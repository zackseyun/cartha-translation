  text: ἀλλὰ ἐν ἐκκλησίᾳ θέλω πέντε λόγους ⸂τῷ νοΐ⸃ μου λαλῆσαι, ἵνα καὶ ἄλλους κατηχήσω, ἢ μυρίους λόγους ἐν γλώσσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/019.yaml
  text: But in the church I would rather speak five words with my mind[a], so that I may also instruct others, than ten thousand words in a tongue.
translation:
  language: zh_hans
  text: 但在教会中，我宁愿用我的悟性[a]说五句话，也好教导别人，也不愿用方言[b]说一万句话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本省略“用我的悟性”。
    reason: SBLGNT以方括号标示τῷ νοΐ μου的文本不确定性。
  - marker: b
    text: 或译：“一种语言”。希腊词既可指“舌头”，也可指“语言”；这里指哥林多前书12—14章一直讨论的那种言语。
    reason: 保留γλῶσσα的词义范围，并避免对这种言语现象的性质作超出原文的判定。
lexical_decisions:
- source_word: ἐν ἐκκλησίᾳ
  choice: 在教会中
  rationale: 这里指基督徒群体聚集敬拜的场合。“在教会中”简洁自然，并保留群体性的含义。
- source_word: θέλω … ἢ
  choice: 我宁愿……也不愿……
  rationale: θέλω本义为“愿意、想要”，但与ἢ引出的数量对比结合时表达明显的偏好；此句式自然呈现这种比较关系。
- source_word: πέντε λόγους
  choice: 五句话
  rationale: λόγους在数字对比中指说出的言语。“五句话”比逐字的“五个词”更符合现代汉语，同时保留具体而鲜明的数量修辞。
- source_word: τῷ νοΐ μου
  choice: 用我的悟性
  rationale: νοῦς可指心思、理智或理解力。此处强调能够理解并传达意义的言语；“悟性”保留人的认知能力这一含义，又不把它扩写为解释性短语。
- source_word: λαλῆσαι
  choice: 说
  rationale: λαλέω在本段指公开说话。“说”简明自然，并与“五句话”和“一万句话”顺畅搭配。
- source_word: ἵνα καὶ ἄλλους κατηχήσω
  choice: 好教导别人
  rationale: κατηχέω指以口头方式教导或指教。“教导”准确表达其教育作用，且避免引入后来“教理讲授”等技术性含义；καί在汉语目的结构中无需机械译出也可涵盖“也”的语意。
- source_word: μυρίους λόγους
  choice: 一万句话
  rationale: μύριοι基本义为“一万”，在此也有极大数量的修辞效果。保留明确数字，能呈现“五”与“一万”的强烈对比。
- source_word: ἐν γλώσσῃ
  choice: 用方言
  rationale: γλῶσσα可指舌头、语言，也可指本段所讨论的特殊言语现象。“方言”承接哥林多前书12—14章的常用术语，同时以脚注说明“一种语言”这一词义可能，避免判定该现象的具体性质。
theological_decisions:
- issue: 哥林多前书12—14章中γλῶσσα的性质
  choice: 正文译作“方言”
  alternative: 一种语言
  rationale: 正文沿用该段落的术语关联，但不解释为“狂喜言语”或限定为普通外语；脚注保留γλῶσσα可指“语言”的词义，从而不消解经文本身留下的争议与张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“宁愿……也不愿……”清楚表达原文的比较结构；“五句话”与“一万句话”保留保罗鲜明的数量对照。脚注标记置于“方言”之后，使其所说明的词语明确无误。
