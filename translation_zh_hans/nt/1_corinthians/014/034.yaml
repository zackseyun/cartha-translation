  text: Αἱ ⸀γυναῖκες ἐν ταῖς ἐκκλησίαις σιγάτωσαν, οὐ γὰρ ⸀ἐπιτρέπεται αὐταῖς λαλεῖν· ἀλλὰ ⸀ὑποτασσέσθωσαν, καθὼς καὶ ὁ νόμος λέγει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/034.yaml
  text: The women should keep silent in the churches[a], for they are not permitted to speak, but should be in submission[c][b], just as the law also says.
translation:
  language: zh_hans
  text: 妇女在众教会中应当静默[a]，因为不准她们说话[b]；她们却要顺服，正如律法也这样说[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “妇女”也可译作“妻子”；希腊语γυνή可按上下文表示“妇女”或“妻子”。
    reason: alternative_reading
  - marker: b
    text: 本节没有明说这里指哪一种“说话”；有人根据上下文把它理解为范围较窄的某类发言。
    reason: lexical_alternative
  - marker: c
    text: 这里的“律法”可能特指摩西律法，也可能较宽泛地指圣经。
    reason: alternative_reading
lexical_decisions:
- source_word: γυναῖκες
  choice: 妇女
  rationale: γυνή可指“妇女”或“妻子”。本节没有明说丈夫，因此正文采用较宽泛的“妇女”，并在脚注保留“妻子”的可能。
- source_word: ἐκκλησίαις
  choice: 众教会中
  rationale: ἐκκλησία在保罗书信中通常指基督徒聚集的群体；“众教会”自然、庄重，也能涵盖各地会众聚会的意思。
- source_word: σιγάτωσαν
  choice: 应当静默
  rationale: 现在时命令语气要求在所述场合保持不说话；“应当静默”既传达命令力，也与本章关于聚会秩序的用语相称。
- source_word: ἐπιτρέπεται
  choice: 不准
  rationale: 该被动形式表达不被许可。“不准她们”是简明自然的现代汉语，同时保留许可受到否定的含义。
- source_word: λαλεῖν
  choice: 说话
  rationale: λαλέω是含义宽泛的“说、讲话”；正文不把它擅自限定为某一种发言，相关解释空间在脚注说明。
- source_word: ὑποτασσέσθωσαν
  choice: 要顺服
  rationale: 该现在时中间/被动命令形式表达处于顺服或使自己顺服的状态。“要顺服”保留命令语气，却不增添原文未注明的顺服对象。
- source_word: νόμος
  choice: 律法
  rationale: νόμος可特指摩西律法，也可能较宽泛地指圣经中的权威教导。“律法”沿用合宜的圣经汉语表达，而脚注交代其所指存在争议。
- source_word: καθὼς καὶ ὁ νόμος λέγει
  choice: 正如律法所说的
  rationale: καθὼς引出比较和佐证。汉语“正如……所说的”自然传达这一关系；希腊语καί在此具有附加佐证的语用作用，不必机械译成“也”。
theological_decisions:
- issue: γυναῖκες所指的对象
  choice: 聚会中的妇女
  alternative: 聚会中的妻子
  rationale: 该词本身兼有“妇女”和“妻子”两义，本节没有明确提到丈夫。正文采用较宽泛的译法，脚注保留较窄的可能，以免替读者消除原文的歧义。
- issue: 禁止“说话”的范围
  choice: 正文直译为“说话”，不限定具体言语行为
  alternative: 仅指扰乱秩序的谈话，或仅指评断先知讲论时的发言
  rationale: 本节的λαλεῖν本身只是宽泛的“说话”。上下文是否把禁令限于某类发言仍有争议，因此不在正文加入限制性解释。
- issue: ὁ νόμος的确切所指
  choice: 译为“律法”，不进一步指定出处
  alternative: 特指摩西律法，或较宽泛地指圣经
  rationale: 原文没有明说具体引文或范围。译文保留这一神学和释经张力，脚注列出主要可能。
- issue: ὑποτασσέσθωσαν的顺服对象
  choice: 不在正文补出对象
  alternative: 补作“顺服丈夫”或“顺服聚会秩序”
  rationale: 希腊文本在本节没有明说顺服谁或什么；补出具体对象会把一种解释写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“静默”保留经文语体和本章秩序语境；“不准她们说话”则用自然现代汉语。正文不补出说话的具体类型、顺服的对象或律法的确切范围，以忠实保留原文的歧义与神学张力。
