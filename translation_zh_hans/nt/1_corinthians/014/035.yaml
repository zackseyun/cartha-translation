  text: εἰ δέ τι ⸀μαθεῖν θέλουσιν, ἐν οἴκῳ τοὺς ἰδίους ἄνδρας ἐπερωτάτωσαν, αἰσχρὸν γάρ ἐστιν γυναικὶ ⸂λαλεῖν ἐν ἐκκλησίᾳ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/035.yaml
  text: But if they want to learn anything[a], let them ask their own husbands at home[b], for it is shameful for a woman to speak in the assembly.
translation:
  language: zh_hans
  text: 她们若想学些什么，应当在家里问自己的丈夫；因为女人[a]在会众中[b]说话是可耻的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“妻子”。希腊语这个词可按上下文指“女人”或“妻子”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“在教会中”或“在会众的聚会中”。希腊语指聚集起来的会众。
    reason: lexical_alternative
lexical_decisions:
- source_word: μαθεῖν
  choice: 学
  rationale: 该不定式表示学习、得知；“学些什么”直接自然，也保留了原文没有限定学习内容的宽泛含义。
- source_word: ἐν οἴκῳ
  choice: 在家里
  rationale: 这是现代汉语表达居家场景的自然说法，并与会众聚会的场景形成对照。
- source_word: τοὺς ἰδίους ἄνδρας
  choice: 自己的丈夫
  rationale: ἄνδρας可指男人或丈夫；与ἰδίους（自己的）连用，又处于家庭语境中，婚姻义最合适。
- source_word: ἐπερωτάτωσαν
  choice: 就应当……问
  rationale: 以自然汉语表达第三人称命令语气，保留要求她们询问的力量，避免生硬的“让她们问”。
- source_word: αἰσχρὸν
  choice: 可耻的
  rationale: 保留该词所表达的羞耻、失体面的强烈社会伦理色彩，比“不得体”更贴近原文力度。
- source_word: γυναικὶ
  choice: 女人
  rationale: γυνή可指女人或妻子。主文采用较一般的“女人”，同时用脚注保留“妻子”这一符合上下文的可能译法。
- source_word: λαλεῖν
  choice: 说话
  rationale: λαλεῖν本身是宽泛的“说话”，原文并未明定是哪一种言语行为，因此不缩窄为“提问”或其他特定活动。
- source_word: ἐν ἐκκλησίᾳ
  choice: 在会众聚会中
  rationale: 此处ἐκκλησία着重于聚集起来的群体；该译法既清楚自然，也避免把词义局限为建筑物或后世制度。
theological_decisions:
- issue: 关于女人说话之限制的范围
  choice: 按原文宽泛地译为“说话”，不在主文中限定具体言语行为。
  alternative: 译作扰乱秩序的提问、评断预言，或把整句话视为哥林多人立场的引语。
  rationale: 希腊文本本身只说“说话”，并未在这一句中明示具体范围；译文应保留其解释张力，而不把某一种释经结论写入正文。
- issue: γυνή与ἀνήρ应译为女人／男人还是妻子／丈夫
  choice: 将ἄνδρας译为“丈夫”，将γυναικὶ在主文译为“女人”，并以脚注保留“妻子”。
  alternative: 全句统一采用“妻子／丈夫”，或采用“女人／男人”。
  rationale: “自己的”及家庭场景有力支持ἄνδρας的“丈夫”义；单数γυναικὶ既可泛指女人，也可能承接婚姻语境而指妻子，因此主文与脚注共同保留这种语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“就应当”自然传达命令语气；“会众聚会中”突出实际聚集的群体。脚注标记置于各自所解释的词语之后，以纠正咨询层中标记位置与脚注内容不对应的问题。
