  text: ἢ ἀφ’ ὑμῶν ὁ λόγος τοῦ θεοῦ ἐξῆλθεν, ἢ εἰς ὑμᾶς μόνους κατήντησεν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/036.yaml
  text: Or did the word of God go out from you[b][a], or has it reached only you?
translation:
  language: zh_hans
  text: 难道上帝的话是从你们那里传出来的吗？还是只传到你们那里呢？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἢ
  choice: 难道……吗？还是……？
  rationale: 保留两个ἤ构成的选择式反问，并以现代汉语“难道……还是……”传达保罗尖锐的责问语气。
- source_word: ἀφ’ ὑμῶν
  choice: 从你们
  rationale: ἀπό加属格表示来源；“从你们”直接保留原文对哥林多人是否自居为源头的质问。
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: 上帝的话
  rationale: 这是自然且庄重的现代汉语表达，同时保持该短语的宽泛性，不把它限定为福音信息或聚会中的预言。
- source_word: ἐξῆλθεν
  choice: 发出
  rationale: 保留ἐξέρχομαι“出去、发出”的动态意象；与“从你们”搭配自然，也隐含“起源于你们”的可能意义。
- source_word: εἰς ὑμᾶς μόνους
  choice: 只……你们这里
  rationale: 明确保留μόνους所强调的排他性，并用“这里”与表示到达的动词自然搭配。
- source_word: κατήντησεν
  choice: 传到
  rationale: καταντάω表示到达、抵达；因主语是“上帝的话”，汉语“传到”比机械的“到达”更自然，同时仍保留信息抵达的基本意义。
theological_decisions:
- issue: “上帝的话”的所指
  choice: 保持为宽泛的“上帝的话”
  alternative: 明确译作“福音”或“聚会中的预言”
  rationale: 上下文可能涉及福音、使徒教导及聚会中具有权威的信息；原文本身未作明确限定，因此不在译文中缩窄。
- issue: 哥林多人作为源头或唯一领受者的反问
  choice: 保留两个并列反问，不将其改写为解释性陈述
  alternative: 意译为“你们既不是上帝话语的源头，也不是唯一领受者”
  rationale: 原文借反问维持责备的力度，也让“发出”兼具实际传播与起源方面的张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“难道……还是……”清楚呈现双重反问；“发出／传到”形成源头与终点的对应，适合普通读者朗读理解。
