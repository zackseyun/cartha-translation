  yaml_path: translation/nt/1_corinthians/014/032.yaml
  text: And the spirits of prophets are subject to prophets,[a]
translation:
  language: zh_hans
  text: 先知的灵也顺服先知，[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“属于先知的灵顺服先知。”这里的“灵”可能指先知所受的感动或与先知有关的属灵活动，重点是说预言时仍须自制。
    reason: 说明属格结构和“灵”在语境中的可能含义，同时不在正文中限定为某一种解释。
lexical_decisions:
- source_word: καὶ
  choice: 也
  rationale: 承接上文并补充支持保罗关于聚会秩序的论述；现代汉语用“也”比直译为“和”更自然。
- source_word: πνεύματα
  choice: 灵
  rationale: 保留复数名词所指的“灵”这一基本词义；汉语中“先知的灵”虽形式上不标复数，仍可作集合性理解，避免在正文中释为“感动”“话语”或“恩赐”。
- source_word: προφητῶν
  choice: 先知的
  rationale: 按属格关系直译，保留它既可表示属于先知，也可表示与先知相关的开放性。
- source_word: προφήταις
  choice: 顺服先知
  rationale: 与ὑποτάσσεται搭配，表示处于先知的约束或支配之下；不明确添加“自己”或“其他”，以免消除原文可能的歧义。
- source_word: ὑποτάσσεται
  choice: 顺服
  rationale: 准确表达置于约束、权柄或控制之下的意思，也自然契合本段关于有秩序发言的语境。希腊文虽为单数形式，但与中性复数主语搭配，汉语无需体现数的一致。
theological_decisions:
- issue: “先知的灵”与先知控制之间的关系
  choice: 正文保留“先知的灵也顺服先知”，表明先知性的属灵活动并不排除先知的自制和责任，同时不把解释写入正文。
  alternative: 可理解为先知所受的感动受先知本人控制；也可理解为先知的灵顺服其他先知，或先知性信息接受众先知的辨别。
  rationale: 哥林多前书14:29–33强调聚会中的辨别与秩序，但本句本身没有明说“自己”“其他”或“信息”。因此保留简洁而有张力的表达，并用脚注说明主要解释。
translation_notes:
  register: 采用简洁、庄重而通俗的现代标准汉语。“顺服”保留原文的从属关系；正文沿用“先知的灵”这一紧凑表达，并以脚注帮助普通读者理解其语境含义。
