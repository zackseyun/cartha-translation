  yaml_path: translation/nt/1_corinthians/014/018.yaml
  text: I thank God that I speak in tongues more than all of you[a].
translation:
  language: zh_hans
  text: 我感谢神，我说方言比你们众人都多[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “说方言”也可译作“说各种语言”。希腊语 γλῶσσα 可指“语言”；但在本段语境中，它指哥林多前书12—14章所讨论的现象，中文圣经传统通常译作“方言”。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐχαριστῶ
  choice: 我感谢
  rationale: 现在时主动直陈语气第一人称单数；“我感谢”自然、庄重，并保留直接陈述的语力。
- source_word: τῷ θεῷ
  choice: 神
  rationale: 与 εὐχαριστέω 连用的与格对象；现代汉语自然表达为“感谢神”。
- source_word: πάντων ὑμῶν μᾶλλον
  choice: 比你们众人都多
  rationale: μᾶλλον 与属格 πάντων ὑμῶν 构成比较，表示相较于在场的全体；此译法自然呈现比较关系，同时不额外断定是逐一超过每一个人，还是总量上的比较。
- source_word: γλώσσαις
  choice: 说方言
  rationale: γλῶσσα 的与格复数与 λαλῶ 连用。在哥林多前书12—14章中，这是所讨论之属灵现象的语境性称谓；“方言”是中文圣经语境中的通行表达，又不预先判定其必为已知人类语言或狂喜性言语。
- source_word: λαλῶ
  choice: 我说
  rationale: 现在时主动直陈语气第一人称单数；汉语用一般陈述“我说”最自然。
theological_decisions:
- issue: 在属灵恩赐语境中如何翻译 γλώσσαις
  choice: 说方言
  alternative: 说各种语言
  rationale: 上下文以 γλῶσσα/γλῶσσαι 指称哥林多前书12—14章所讨论的现象。“方言”保留这一语境性术语，不裁定它究竟是人类语言、超常言语，还是更宽泛的类别；“语言”作为词义可能性收入脚注。
translation_notes:
  register: 采用现代、清楚而庄重的普通话。“你们众人”比单说“你们”更明确地体现 πάντων；保留“方言”这一熟悉术语，并以脚注说明其词义范围。
