  text: Ἀδελφοί, μὴ παιδία γίνεσθε ταῖς φρεσίν, ἀλλὰ τῇ κακίᾳ νηπιάζετε, ταῖς δὲ φρεσὶν τέλειοι γίνεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/020.yaml
  text: Brothers[a], do not become children in your thinking, but be infants in evil[b]; yet in your thinking become mature.
translation:
  language: zh_hans
  text: 弟兄们[a]，在心智上不要像小孩子；在邪恶上却要像婴孩[b]；在心智上要成为成熟的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“弟兄姊妹们”；希腊文用阳性复数“弟兄们”称呼会众，这里按语境包括姊妹。
    reason: lexical_alternative
  - marker: b
    text: “邪恶”也可译作“恶意”；希腊文κακία可指邪恶、坏事性或恶意。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφοί
  choice: 弟兄们
  rationale: 这是ἀδελφός的阳性复数呼格。保留原文有性别形式的会众称呼，同时以脚注说明这里按语境包括姊妹。
- source_word: παιδία
  choice: 小孩子
  rationale: 该词泛指儿童；译作“小孩子”既自然，也保留与后文“婴孩”和“成熟的人”的年龄层次对比。
- source_word: γίνεσθε
  choice: 作／成为
  rationale: γίνομαι的现在时命令式带有“成为、变成”的动态含义。汉语中否定句译作“不要作小孩子”较自然，末句用“要成为”明确保留动态语义。
- source_word: ταῖς φρεσίν / ταῖς δὲ φρεσὶν
  choice: 在思想上
  rationale: φρήν在这里指理解、思考的能力或心智状态；“在思想上”准确表达关系方面的与格，也使首尾反复清晰自然。
- source_word: τῇ κακίᾳ
  choice: 在恶事上
  rationale: κακία可指邪恶、恶行或恶意。此处采用较宽泛的“恶事”，不把含义限缩为人际间的恶意；脚注保留另一可能。
- source_word: νηπιάζετε
  choice: 要作婴孩
  rationale: νηπιάζω意为“像婴孩／作婴孩”。“作婴孩”保留保罗刻意设置的儿童、婴孩与成熟者之间的对照。
- source_word: τέλειοι
  choice: 成熟的人
  rationale: τέλειος在此强调心智成熟、长成，而非毫无缺陷或无罪的“完美”；“成熟的人”符合上下文。
- source_word: ἀλλὰ ... δὲ
  choice: 但……却
  rationale: 这一组连接词构成连续的转折；“但……却”保留修辞推进，并符合现代汉语表达。
theological_decisions:
- issue: 有性别形式的会众称呼
  choice: 正文保留“弟兄们”，脚注说明按语境包括姊妹。
  alternative: 弟兄姊妹们
  rationale: 希腊文使用阳性复数“弟兄们”作为对会众的称呼，语境中很可能指全体教会成员。正文保留原文形式，脚注则交代其包容性指向。
- issue: τέλειοι所指的成熟
  choice: 译作“成熟的人”。
  alternative: 完全的人／完美的人
  rationale: 本节把孩童式思考与成熟思考相对照，重点是心智和判断力的成熟，不宜引入无罪或绝对完美的神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留原文“思想上”的首尾反复，以及“小孩子—婴孩—成熟的人”的修辞对照；避免把κακία过度限缩为“恶意”，也避免把τέλειοι误解为绝对完美。
