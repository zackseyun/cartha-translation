id: 1CO.14.2
reference: 1 Corinthians 14:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ γὰρ λαλῶν γλώσσῃ οὐκ ἀνθρώποις λαλεῖ ⸀ἀλλὰ θεῷ, οὐδεὶς γὰρ ἀκούει, πνεύματι δὲ λαλεῖ μυστήρια·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/002.yaml
  text: For the one speaking in a tongue does not speak to people but to God, for no one understands; rather, he speaks mysteries in the Spirit.
translation:
  language: zh_hans
  text: 因为说方言的人不是对人说，而是对上帝说，因为没有人听懂[a]；他却在灵里[b]讲奥秘。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“听见”。希腊语动词既可指“听见”，在本语境中也可引申为“听懂”。
    reason: lexical_alternative
  - marker: b
    text: “灵”可能指圣灵，也可能指说话者自己的灵。
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ λαλῶν
  choice: 说方言的人
  rationale: 定冠词加现在分词构成泛指的名词性表达；中文用“……的人”自然地保留其泛指意义，不额外指定性别。
- source_word: γλώσσῃ
  choice: 说方言
  rationale: 单数与动词搭配在中文中自然表达为“说方言”。“方言”保留本章所指言语现象的传统称呼，避免直接解释为某一种已知语言。
- source_word: ἀνθρώποις
  choice: 对人
  rationale: 此处泛指人类，并非特指男性；“对人”简洁自然。
- source_word: θεῷ
  choice: 对上帝
  rationale: 如实表达 λαλεῖ 所带的与格对象，不作扩译。
- source_word: ἀκούει
  choice: 听懂
  rationale: ἀκούω 的基本义是“听见”，但上下文强调话语无人领会；“听懂”传达语境中的含义，同时以脚注保留字面译法。
- source_word: πνεύματι
  choice: 在灵里
  rationale: 与格短语可指在圣灵里，也可指说话者的灵；中文“在灵里”保留了这种指称上的开放性，避免在正文中先行裁定。
- source_word: μυστήρια
  choice: 奥秘
  rationale: “奥秘”保留 μυστήριον 在保罗书信中的神学分量，不将其简化为一般的秘密。
- source_word: δὲ
  choice: 却
  rationale: “却”自然呈现此处的转折和对照关系。
theological_decisions:
- issue: πνεύματι 所指的是圣灵还是说话者的灵
  choice: 正文译为“在灵里”
  alternative: “借着圣灵”或“在自己的灵里”
  rationale: 希腊语与格在此容许不同理解；正文采用不明确限定所指的表达，并在脚注中说明两种可能，以保留经文本身的神学张力。
- issue: ἀκούει 是“听见”还是“听懂”
  choice: 正文译为“听懂”
  alternative: “听见”
  rationale: 上下文讨论言语是否能被领会，因此“听懂”更符合语境；但“听见”是该动词较直接的词义，故以脚注保留。
translation_notes:
  register: 采用现代、庄重而通顺的标准普通话。“说方言”沿用读者熟悉的圣经用语；句法尽量贴近原文的两重因果与末句转折，同时避免生硬直译。
