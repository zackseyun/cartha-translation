  text: ἐν τῷ νόμῳ γέγραπται ὅτι Ἐν ἑτερογλώσσοις καὶ ἐν χείλεσιν ⸀ἑτέρων λαλήσω τῷ λαῷ τούτῳ, καὶ οὐδ’ οὕτως εἰσακούσονταί μου, λέγει κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/021.yaml
  text: 'In the Law it is written: “By people of other tongues and by the lips of foreigners I will speak to this people[d][c][b][a], and not even in this way will they listen to me,” says the Lord.'
translation:
  language: zh_hans
  text: '律法上记着：


    “我要借着说别种语言的人，


    借着外族人的嘴唇[a]，


    向这百姓说话；


    即便这样，他们也不会听我。”[c]


    主说。[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“借着别种语言，借着别人的嘴唇。”
    reason: lexical_alternative
  - marker: c
    text: 这段引文呼应《以赛亚书》28:11—12。
    reason: cross_reference
  - marker: d
    text: 这里引述的是以色列的上帝所说的话；有些译本依据希伯来文背景译作“耶和华说”。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τῷ νόμῳ
  choice: 律法上
  rationale: 保留保罗以“律法”广义指称犹太圣经的用法；虽然引文出自以赛亚书，并不改译为较宽泛的“经上”。
- source_word: γέγραπται
  choice: 记着
  rationale: 以现代汉语自然表达圣经引文公式，同时保留完成状态的意味。
- source_word: ἐν ἑτερογλώσσοις
  choice: 借着说别种语言的人
  rationale: ἐν 在此可表凭借或媒介；将形容词实词化为“说别种语言的人”，既符合上下文，也保留与本章“方言／语言”主题的联系。
- source_word: ἐν χείλεσιν ἑτέρων
  choice: 借着外族人的嘴唇
  rationale: 保留“嘴唇”的引文意象，并按以赛亚书背景将“别的人”自然表达为使用异族语言的“外族人”；脚注保留较直译的可能。
- source_word: λαλήσω
  choice: 说话
  rationale: 直接、自然地对应未来时“我要说话”，适合上帝发言的语境。
- source_word: τῷ λαῷ τούτῳ
  choice: 对这百姓
  rationale: λαός 在经文引语中通常指百姓，尤其是上帝所面对的约民；“百姓”比“民族”更贴合此处。
- source_word: οὐδ’ οὕτως
  choice: 即使这样……还是不
  rationale: 清楚传达 οὐδέ 与 οὕτως 的强调：即便采用这种非同寻常的方式，他们仍不响应。
- source_word: εἰσακούσονταί μου
  choice: 他们还是不肯听从我
  rationale: “听从”兼顾听见、留意和顺服的语义；加入“不肯”自然呈现语境中的拒绝意味，但脚注保留较中性的译法。
- source_word: λέγει κύριος
  choice: 这是主说的
  rationale: 按汉语引文收束方式自然表达现在时引文公式，并依据希腊文 κύριος 译作“主”。
theological_decisions:
- issue: 圣经引文中的 κύριος 如何译写
  choice: 主
  alternative: 耶和华
  rationale: 希腊文本写的是 κύριος，故正文译作“主”，不以希伯来文背景取代现有希腊文本；脚注说明以赛亚书引文背景下的另一种译法。
- issue: εἰσακούσονταί μου 是否明确包含顺服
  choice: 不肯听从我
  alternative: 不听我
  rationale: 该动词可指听见、听取或听从；正文采用能表达回应与顺服意味的自然汉语，同时用脚注保存较弱的词义可能，避免把语义范围绝对化。
translation_notes:
  register: 采用庄重而明白的现代标准汉语。“律法上记着”保留保罗的传统经文引介方式；诗行排版显示引文结构。“说别种语言的人”和“外族人的嘴唇”在普通读者可理解的同时，维持原文平行意象及其与本章语言现象的关联。
