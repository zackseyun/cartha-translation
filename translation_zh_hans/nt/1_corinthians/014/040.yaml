  text: But let everything be done decently and in order[a].
translation:
  language: zh_hans
  text: 凡事都要合宜，并且按秩序进行[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “合宜”也可译作“得体”；希腊文指合乎体统、相称恰当。
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: 凡事
  rationale: 中性复数，范围广泛；“凡事”自然、庄重，并保留概括性的指示。
- source_word: δὲ
  choice: 都要（不另译连接词）
  rationale: δὲ在此起轻微转折或总结过渡作用。汉语承接上文时可由句式自然体现；若直译为“但是”会显得转折过强。
- source_word: εὐσχημόνως
  choice: 合宜
  rationale: 表示符合体统、得当、相称；“合宜”在现代汉语中清楚而庄重，也适合聚会语境，且不把含义局限为外在礼仪。
- source_word: κατὰ τάξιν
  choice: 按秩序
  rationale: 表示依照适当的安排或次序；“按秩序”既保留介词结构，也不预设某种固定礼仪模式。
- source_word: γινέσθω
  choice: 要……进行
  rationale: 第三人称现在时中间/被动命令式，在此表达普遍性指令。“要……进行”自然传达命令语气，并适合指聚会中各项活动的开展。
theological_decisions:
- issue: 本命令在敬拜聚会语境中的范围
  choice: 将其译为对聚会中一切活动应当合宜、有秩序进行的概括性指示，不指定任何宗派性的礼仪模式。
  alternative: 理解为规定固定礼序的狭义礼仪规则，或扩展为教会全部实践的普遍原则。
  rationale: 本节总结上文关于会众聚会中发言及秩序的讨论。译文保留希腊文的概括性，同时不超出直接语境来规定特定教会制度。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“凡事”保持经文的概括力度；“按秩序进行”清楚自然，又避免让读者误以为原文明确规定了固定的礼拜程序。
