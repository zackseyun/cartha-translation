  text: ἐὰν οὖν μὴ εἰδῶ τὴν δύναμιν τῆς φωνῆς, ἔσομαι τῷ λαλοῦντι βάρβαρος καὶ ὁ λαλῶν ἐν ἐμοὶ βάρβαρος.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/011.yaml
  text: Therefore[a], if I do not know the meaning of the voice, I will be a foreigner to the one speaking[b], and the one speaking will be a foreigner to me.
translation:
  language: zh_hans
  text: 所以，我若不明白这声音的意思[a]，对说话的人来说，我就是外国人[b]；说话的人对我来说也是外国人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “意思”也可译作“效力”或“含义”；原文直译为“声音的力量”或“声音的效力”。
    reason: lexical_alternative
  - marker: b
    text: 原文词语常音译为“巴巴里人”；这里指言语陌生、彼此听不懂的人，即语言上的外国人，并不一定含有“未开化”或“野蛮”的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: 所以，我若
  rationale: 以“所以”表达 οὖν 的推论关系，以“若”表达 ἐὰν 的条件意味，既承接上文，也符合现代汉语表达。
- source_word: μὴ εἰδῶ
  choice: 不明白
  rationale: οἶδα 基本义为“知道”，但此处所指是不能识别声音所传达的意思；“不明白”在汉语中更自然准确。
- source_word: τὴν δύναμιν τῆς φωνῆς
  choice: 所发声音的意思
  rationale: δύναμις 本义可指“能力、力量”，在此搭配中指声音所具有的意义或效力；φωνή 可指声音或话音。“所发声音的意思”保留声音意象并清楚传达语境含义。
- source_word: τῷ λαλοῦντι
  choice: 对说话的人来说
  rationale: 自然表达与说话者之间的相对关系，并保留现在分词“说话的人”的动态意味。
- source_word: βάρβαρος
  choice: 外邦人
  rationale: βάρβαρος 在此指语言彼此不通、听来像外国人的人，并非强调野蛮或未开化；“外邦人”保留其古代族群与语言上的陌生意味，脚注排除现代误读。
- source_word: ἐν ἐμοὶ
  choice: 对我来说
  rationale: ἐν ἐμοί 在此为关系性表达，与前半句形成相互对应；“对我来说”是自然的现代汉语。
theological_decisions: []
