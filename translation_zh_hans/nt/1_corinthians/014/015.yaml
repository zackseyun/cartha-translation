id: 1CO.14.15
reference: 1 Corinthians 14:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: τί οὖν ἐστιν; προσεύξομαι τῷ πνεύματι, προσεύξομαι δὲ καὶ τῷ νοΐ· ψαλῶ τῷ πνεύματι, ψαλῶ δὲ καὶ τῷ νοΐ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/015.yaml
  text: What then is to be done? I will pray with the spirit[a], but I will also pray with the mind; I will sing praise with the spirit[c][b], but I will also sing praise with the mind.
translation:
  language: zh_hans
  text: 那么，该怎么办呢？我要用灵祷告[a]，也要用心思祷告[b]；我要用灵歌颂[a][c]，也要用心思歌颂[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “用灵”也可译作“在灵里”或“借着灵”；希腊原文没有明确说明这里的“灵”特指圣灵、说话者自己的灵，还是属灵的发声。
    reason: lexical_alternative
  - marker: b
    text: “用心思”也可译作“用悟性”。
    reason: lexical_alternative
  - marker: c
    text: “歌颂”也可译作“歌唱”或“奏乐歌唱”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τί οὖν ἐστιν;
  choice: 那么，该怎么办呢？
  rationale: 这是承接上文、引出实际结论的修辞问句；此译自然地表达其语用功能，同时保留问句形式。
- source_word: προσεύξομαι
  choice: 我要……祷告
  rationale: 准确表达该动词的将来时；中文以“要”自然呈现说话者接下来的意向。
- source_word: τῷ πνεύματι
  choice: 用灵
  rationale: 保留与“用心思”的平行，也不在正文中限定为圣灵、人的灵或属灵的发声方式。
- source_word: τῷ νοΐ
  choice: 用心思
  rationale: νοῦς指思想、理解的官能；“心思”在现代中文中既自然，又能与“灵”形成清楚对照。
- source_word: ψαλῶ
  choice: 我要……歌颂
  rationale: 在敬拜语境中指以歌唱表达赞美；“歌颂”比单说“唱歌”更能传达赞美含义，又不过度加入具体形式。
- source_word: δὲ καὶ
  choice: 也要
  rationale: 在中文中自然表达补充兼轻微对比：不只采用前一种方式，也采用后一种方式。
theological_decisions:
- issue: πνεῦμα在“灵”与“心思”的对照中具体指什么
  choice: 正文笼统译作“灵”
  alternative: “圣灵”、“我的灵”或“属灵的发声”
  rationale: 原文没有明确限定其所指，语境也容许不同理解；译文不替原文消除这一神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“那么，该怎么办呢”承接论证并引出实践结论；两组“用灵／用心思”保持原文平行结构。脚注标记均置于正文相应表达之后。
