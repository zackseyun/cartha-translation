  text: Διώκετε τὴν ἀγάπην, ζηλοῦτε δὲ τὰ πνευματικά, μᾶλλον δὲ ἵνα προφητεύητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/001.yaml
  text: Pursue love[a], and earnestly desire the spiritual things[c][b], but especially that you may prophesy.
translation:
  language: zh_hans
  text: 你们要追求爱，也要切慕属灵的事[a]，尤其要切慕说预言[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“属灵的恩赐”。原文也可泛指“属灵的事”，但这里的上下文主要谈圣灵在教会中所赐的彰显。
    reason: lexical_alternative
  - marker: b
    text: 或译“倒更要切慕说预言”。
    reason: alternative_reading
lexical_decisions:
- source_word: Διώκετε
  choice: 追求
  rationale: 保留持续、主动竭力寻求的命令语气，并与现代汉语惯用表达相符。
- source_word: τὴν ἀγάπην
  choice: 爱
  rationale: 承接第13章的核心主题，简明自然，不附加原文没有的限定。
- source_word: ζηλοῦτε
  choice: 切慕
  rationale: 表达热切渴望和积极寻求；在庄重而通俗的经文语体中自然。
- source_word: τὰ πνευματικά
  choice: 属灵的事
  rationale: 原文为中性复数形容词的名词化用法，范围比“属灵恩赐”更宽；此译保留其概括性，让12—14章的上下文说明其重点。
- source_word: μᾶλλον δὲ
  choice: 尤其
  rationale: 体现比较和优先强调，即在属灵之事中格外看重说预言，同时避免生硬的转折。
- source_word: ἵνα προφητεύητε
  choice: 要切慕说预言
  rationale: 按汉语补出前面动词，使愿望的内容清晰自然；“说预言”保留既有的圣经类别用语。
theological_decisions:
- issue: τὰ πνευματικά的范围
  choice: 译作“属灵的事”
  alternative: 属灵的恩赐
  rationale: 哥林多前书12—14章确实聚焦圣灵在教会中的彰显和恩赐，但原词本身较宽。正文不把意义收窄为“恩赐”，并用脚注交代上下文所指。
- issue: 保罗对说预言的强调
  choice: 译作“尤其要切慕说预言”
  alternative: 倒更要切慕说预言
  rationale: μᾶλλον δὲ可表达更高程度或优先选择；“尤其”保留优先强调，又不暗示其他属灵彰显均应排除。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“追求爱”承接上一章；“切慕”较凝练地表达热切渴望。所有脚注标记均放在对应正文之后。
