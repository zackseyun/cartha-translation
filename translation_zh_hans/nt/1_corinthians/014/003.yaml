  text: ὁ δὲ προφητεύων ἀνθρώποις λαλεῖ οἰκοδομὴν καὶ παράκλησιν καὶ παραμυθίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/003.yaml
  text: But the one who prophesies speaks to people for edification and encouragement and consolation[a][b][c].
translation:
  language: zh_hans
  text: 但说预言的人，是对人说使人得到造就[a]、劝勉[b]和安慰[c]的话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “造就”原有“建造、建立”的意象，也可译作“建立”或“使人刚强”。
    reason: lexical_alternative
  - marker: b
    text: “劝勉”所译的 παράκλησις 也可意为“鼓励”，在某些语境中还可指“安慰”。
    reason: lexical_alternative
  - marker: c
    text: “安慰”所译的 παραμυθία 也可译作“慰藉”或“安抚”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ προφητεύων
  choice: 但说预言的人
  rationale: 带冠词的现在分词作名词使用，指正在或惯常说预言的人；δὲ 表示与上文的轻微转折，用“但”自然衔接。“说预言”保留该词的广度，不将其限定为讲道或预告未来。
- source_word: ἀνθρώποις
  choice: 对人
  rationale: 与格复数表示说话的对象，泛指人，并非专指男性；现代汉语以“对人”简洁准确地表达。
- source_word: λαλεῖ
  choice: 说……的话
  rationale: λαλέω 在此为一般性的“说话”；将后三个宾格名词处理为话语的内容或作用，译成“说……的话”，既符合汉语习惯，也不把它们过度限定为单一语法关系。
- source_word: οἰκοδομὴν
  choice: 造就
  rationale: 该词本义与建造有关，在保罗书信中常比喻使群体或个人得到建立、坚固。“造就”简洁庄重，并保留这一惯用的属灵建造意象。
- source_word: παράκλησιν
  choice: 劝勉
  rationale: 该词可涵盖劝勉、鼓励和安慰。此处选“劝勉”，既保留推动、激励人的意味，也与下一个偏重抚慰的 παραμυθία 区分。
- source_word: παραμυθίαν
  choice: 安慰
  rationale: 该词指安抚、慰藉的话。“安慰”是现代汉语最自然的对应，并与“劝勉”共同保留原文三项并列而不合并其含义。
theological_decisions:
- issue: 聚会语境中“说预言”的含义
  choice: 保留“说预言”，不进一步界定其具体形式
  alternative: 讲道；传达启示；预告未来
  rationale: 本节着重说明说预言对人的作用，并未在此完整界定预言。保留原词的广度，可避免引入特定宗派对其性质或持续性的解释。
- issue: 三个宾格名词与“说话”的关系
  choice: 译为所说之话的性质或作用：“说造就、劝勉和安慰的话”
  alternative: 译为明确目的：“为要造就、劝勉和安慰人”
  rationale: 希腊文并未明用目的介词；这些宾格可概括预言之言的内容、结果或功用。中文采用“……的话”保留这种开放性，避免只定为主观目的。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“造就”虽带有传统教会用语色彩，但在此能准确保留 οἰκοδομή 的建造隐喻；脚注补充更直白的表达。全句保持原文三项并列的节奏，并用“说……的话”形成自然汉语。
