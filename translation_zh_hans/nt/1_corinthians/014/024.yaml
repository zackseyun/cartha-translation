  text: ἐὰν δὲ πάντες προφητεύωσιν, εἰσέλθῃ δέ τις ἄπιστος ἢ ἰδιώτης, ἐλέγχεται ὑπὸ πάντων, ἀνακρίνεται ὑπὸ πάντων,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/024.yaml
  text: But if all prophesy[a], and some unbeliever or uninstructed person enters, he is convicted by all; he is examined by all.
translation:
  language: zh_hans
  text: 但如果众人都说预言，有一个不信的人或未受教导的人[a]进来，他就被众人指出过错，也被众人审察。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“外来的人”。希腊词可指未受相关教导、不熟悉聚会中的言语或实践，或不属于发言群体的人。
    reason: 保留ἰδιώτης在本语境中可指群体之外者的合理解释，同时说明正文‘未受教导的人’所表达的缺乏相关认识或参与资格的含义。
lexical_decisions:
- source_word: πάντες
  choice: 众人
  rationale: 保留原文的全称范围，并与后面两次“被众人”形成呼应。这里按上下文指聚会中发言的人。
- source_word: προφητεύωσιν
  choice: 说预言
  rationale: 保留保罗在本章使用的“预言”这一类别，不将其缩窄为预测未来，也不扩写成某种特定教会传统中的讲道形式。
- source_word: ἄπιστος
  choice: 不信的人
  rationale: 在此指不信者；用描述性表达比标签化的“不信者”更自然，也不误解为不忠实的人。
- source_word: ἰδιώτης
  choice: 不熟悉的人
  rationale: 此词在这里可指不了解、未受相关教导或不属于发言群体的人。“不熟悉的人”突出其对聚会言语和实践缺乏了解，同时不武断认定其完全属于教会之外。
- source_word: ἐλέγχεται
  choice: 被众人责备
  rationale: 表达其受到揭露、纠正并知罪的语义范围；保持被动结构，不额外规定其内在反应达到何种程度。
- source_word: ἀνακρίνεται
  choice: 被众人审察
  rationale: 保留查验、审视的含义，避免译成“定罪”而加入终局审判的意味。
- source_word: ὑπὸ πάντων
  choice: 被众人
  rationale: 两次照原文重复，保留句子的修辞力度。
- source_word: δέ
  choice: 但
  rationale: 句首连接词与上一节所述方言情形构成对比；第二个δέ通过汉语条件句的自然衔接体现，无须机械另译。
- source_word: τις
  choice: 有……的人
  rationale: 用汉语存在句自然表达不定代词，涵盖随后并列的两类身份。
theological_decisions:
- issue: ἰδιώτης在聚会语境中的身份
  choice: 不熟悉的人
  alternative: 外来的人；未受教导的人；普通人
  rationale: 上下文重点在言语是否能被理解，以及聚会中的话对缺乏相关认识者产生什么效果。“不熟悉的人”保留这种语义焦点，又不预先断定此人是否完全在信徒群体之外；“外来的人”作为合理可能性列入脚注。
- issue: ἐλέγχεται所表达的作用
  choice: 被众人责备
  alternative: 被众人揭露；被众人劝服而知罪
  rationale: 原词兼有揭露、责备、使人知罪等意味。正文采用较直接且不添加明确心理结果的“责备”，以免把语义张力单一化。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“众人”的三次呼应和两个被动分句；脚注标记紧跟其实际说明的“不了解聚会的人”，而不是置于“说预言”之后。
