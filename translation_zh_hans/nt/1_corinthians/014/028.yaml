  text: ἐὰν δὲ μὴ ᾖ ⸀διερμηνευτής, σιγάτω ἐν ἐκκλησίᾳ, ἑαυτῷ δὲ λαλείτω καὶ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/028.yaml
  text: But if there is no interpreter[a], he must keep silent in the church and speak to himself and to God.
translation:
  language: zh_hans
  text: 但如果没有翻译的人，那说方言的人就应当在聚会中静默，只对自己和上帝说。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文“对自己和上帝说”没有明确说明这种说话是否出声。
    reason: 保留ἑαυτῷ δὲ λαλείτω καὶ τῷ θεῷ的表达方式歧义，不将其限定为完全无声或可被旁人听见。
lexical_decisions:
- source_word: διερμηνευτής
  choice: 有人翻出来
  rationale: 这里指能把方言内容传达明白的人。结合上下文，用动词性表达比生硬的“翻译者”更自然，也不预先断定其方式是口译还是解释。
- source_word: σιγάτω
  choice: 他就要……保持安静
  rationale: 第三人称单数现在时命令式，表达明确指令；“就要……保持安静”既保留命令力度，也符合现代汉语。
- source_word: ἐν ἐκκλησίᾳ
  choice: 在教会聚会中
  rationale: 本章语境指信徒聚集的场合，而非建筑物；这一译法自然明确地呈现聚会语境。
- source_word: ἑαυτῷ
  choice: 对自己
  rationale: 直接保留反身代词的关系，不添加“私下”或“独自”等原文没有明说的限定。
- source_word: λαλείτω
  choice: 说
  rationale: 中性、自然地表达继续说话的命令，与前面的“保持安静”形成原文中的对照。
- source_word: τῷ θεῷ
  choice: 对上帝
  rationale: 保留与“说”相连的与格对象，表明话语可指向上帝。
- source_word: ἐὰν δὲ μὴ ᾖ
  choice: 但如果没有
  rationale: 自然呈现条件从句及转折关系，并表达现场不存在相应人员的情形。
theological_decisions:
- issue: 聚会中保持安静这一命令的范围
  choice: 将命令表述为在教会聚会中保持安静，同时保留“对自己和上帝说”的许可。
  alternative: 理解为必须完全停止一切言语，或仍可面向会众公开发言。
  rationale: 原文把“在教会中保持安静”与“对自己和上帝说”并列对照，显示限制针对面向聚会的公开言说，并非绝对禁止任何言语；译文不进一步规定这种说话是否出声，以保留原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“教会聚会中”避免把ἐκκλησία误解为建筑物；整体句式简洁，并保留命令语气及公开沉默与向自己、向上帝说话之间的张力。
