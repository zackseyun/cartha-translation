  text: εἴτε γλώσσῃ τις λαλεῖ, κατὰ δύο ἢ τὸ πλεῖστον τρεῖς, καὶ ἀνὰ μέρος, καὶ εἷς διερμηνευέτω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/027.yaml
  text: If anyone speaks in a tongue[a], let there be two, or at most three, and each in turn, and let one interpret.
translation:
  language: zh_hans
  text: 若有人说方言[a]，就应当由两个人，最多三个人轮流说；并要有一人翻译。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“语言”。希腊语原词既可指“舌头”，也可指“语言”；这里沿用本章一贯的“方言”用语，但不据此判定这种恩赐所说之话的具体性质。
    reason: lexical_alternative
lexical_decisions:
- source_word: γλώσσῃ
  choice: 说方言
  rationale: γλῶσσα可指舌头，也可指语言；在哥林多前书12—14章中，它是保罗反复使用的属灵恩赐用语。“说方言”符合现代中文基督教语境中的通行表达，同时不判定这种言语究竟是人间语言还是其他性质的言语。
- source_word: τις
  choice: 有人
  rationale: 不定代词在条件句中泛指任何一个人；“有人”简洁自然，并保留非特指意义。
- source_word: λαλεῖ
  choice: 说
  rationale: 现在时直陈语气用于一般条件情形，中文以“说”自然表达。
- source_word: κατὰ δύο ἢ τὸ πλεῖστον τρεῖς
  choice: 只可两个人，至多三个人
  rationale: 该短语限制参与说方言的人数；此译法保留“两人、最多三人”的规限，避免误解为多人同时成组发言。
- source_word: ἀνὰ μέρος
  choice: 要轮流说
  rationale: 该短语表示分别进行、一次一人；“轮流说”以自然中文明确表达不可同时发言。
- source_word: εἷς
  choice: 一个人
  rationale: 数词在此作名词用，指由一人承担传译。
- source_word: διερμηνευέτω
  choice: 要有一个人传译
  rationale: 该命令要求把方言内容转达成会众能够明白的话。“传译”兼有口头译出的意味，又不像“讲解”那样偏向阐释，也不预先断定方言必定是普通外语。
theological_decisions:
- issue: 本节中γλώσσῃ所指言语的性质
  choice: 正文译作“方言”，把它作为哥林多前书12—14章所讨论的恩赐现象，不具体界定其性质。
  alternative: 可译作“别种语言”，或进一步解释为人间外语或超常、出神式言语。
  rationale: 原文本节规定这种言语在聚会中的使用方式，却没有解决其究竟属于哪一类言语。“方言”配合脚注，既承接本章用语，也保留原文的神学张力。
- issue: διερμηνευέτω是翻译还是解释
  choice: 译作“传译”，强调把所说内容转达得使会众明白。
  alternative: 可译作“翻译”或“讲解”。
  rationale: “翻译”可能使读者预先认定这是普通人类语言，“讲解”则可能把动作理解为释义；“传译”较能保留原词在语境中的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“只可……至多……”清楚表达人数上限，“轮流说”说明一次一人；分号使人数与传译两项聚会规限层次分明。
