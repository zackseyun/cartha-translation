base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/031.yaml
  text: For you can all prophesy one by one[b][a], so that all may learn and all may be encouraged.
translation:
  language: zh_hans
  text: 因为你们都可以一个接一个地说预言[a]，好让众人都得以学习，众人都得到鼓励[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“每次一人说预言”。
    reason: lexical_alternative
  - marker: b
    text: “得到鼓励”也可译为“受到劝勉”或“得到安慰”；原文动词可按语境表达鼓励、劝勉或安慰。
    reason: lexical_alternative
lexical_decisions:
- source_word: δύνασθε
  choice: 可以
  rationale: 表达现实的能力或可能性；“可以”符合保罗在聚会秩序方面的实际说明，也比“有能力”更自然。
- source_word: γὰρ
  choice: 因为
  rationale: 承接上文，为前面的指示提供理由或解释。
- source_word: καθ’ ἕνα
  choice: 一个接一个地
  rationale: 表示依次进行，即同一时间由一人发言；此译法自然地体现聚会中的次序。
- source_word: πάντες
  choice: 都／众人都
  rationale: 原文三次重复 πάντες 以加强语气。译文相应保留三次“都”，但按汉语句法分别译为“你们都”和“众人都”，不进一步限定具体范围。
- source_word: προφητεύειν
  choice: 说预言
  rationale: 保留保罗书信中“说预言”这一既定概念，不将其缩窄为讲道、预测或一般性的受感发言。
- source_word: ἵνα
  choice: 使
  rationale: 简洁表达目的或结果关系，符合现代汉语。
- source_word: μανθάνωσιν
  choice: 能学习
  rationale: 表达 ἵνα 从句中的目的，并保留一般性的学习含义。
- source_word: παρακαλῶνται
  choice: 受到劝勉
  rationale: παρακαλέω 可含鼓励、劝勉或安慰之意；“受到劝勉”适合造就会众的语境，同时用脚注保留其语义幅度。
theological_decisions:
- issue: 会众指示中 πάντες（“都／众人”）的范围
  choice: 保留原文三次“都”的广泛表述，不把第一处明确限定为“所有先知”，也不把后两处另行限定为某一群体。
  alternative: 第一处可理解为“你们所有人”或“所有作先知讲论的人”；后两处可理解为全体会众。
  rationale: 上下文有助于判断各处所指的人群，但本节本身重复 πάντες，并未在措辞上加以限定。译文让上下文决定具体所指，避免消除原文留下的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式保留原文的因果关系和三次“都”的强调；“说预言”沿用清楚而不过度解释的圣经用语。
