id: 1CO.14.5
reference: 1 Corinthians 14:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: θέλω δὲ πάντας ὑμᾶς λαλεῖν γλώσσαις, μᾶλλον δὲ ἵνα προφητεύητε· μείζων ⸀δὲ ὁ προφητεύων ἢ ὁ λαλῶν γλώσσαις, ἐκτὸς εἰ μὴ ⸀διερμηνεύῃ, ἵνα ἡ ἐκκλησία οἰκοδομὴν λάβῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/005.yaml
  text: I want all of you to speak in tongues[a], but even more that you would prophesy. The one who prophesies is greater than the one who speaks in tongues, unless he interprets[b], so that the church may receive edification.
translation:
  language: zh_hans
  text: 我愿意你们人人都说方言，但我更愿意你们说预言。说预言的，比说方言的更大；除非他说方言后加以解释[a]，使教会得到造就[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“除非有人解释。”希腊文的单数动词可以指说方言者本人；按本章更广的语境，也可能泛指有人提供解释。
    reason: alternative_reading
  - marker: b
    text: “造就”原有建造、建立之意，这里指使聚集的教会在信仰上得到建立和益处。
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλω
  choice: 我愿意
  rationale: 表达保罗直接而明确的个人愿望；比“我要”更符合现代汉语在此处的语气。
- source_word: πάντας ὑμᾶς
  choice: 你们人人都
  rationale: 同时保留第二人称复数和范围上的完整性。
- source_word: λαλεῖν γλώσσαις
  choice: 说方言
  rationale: “方言”是中文圣经传统中对本段特殊言语现象的通行表达，也避免直接断定其必为普通地域语言。
- source_word: μᾶλλον δὲ
  choice: 但我更愿意
  rationale: 体现偏好的比较，而不是否定说方言。
- source_word: ἵνα προφητεύητε
  choice: 你们说预言
  rationale: 在θέλω之后表达愿望的内容；“说预言”自然且保留本段的恩赐用语。
- source_word: μείζων
  choice: 更大
  rationale: 保留原文宽泛的比较词，不在正文中将其收窄为地位、能力或实用价值。
- source_word: ὁ προφητεύων
  choice: 说预言的
  rationale: 用自然的汉语名词化结构表达泛指的人。
- source_word: ὁ λαλῶν γλώσσαις
  choice: 说方言的
  rationale: 与“说预言的”保持平行结构。
- source_word: ἐκτὸς εἰ μὴ
  choice: 除非
  rationale: 简明自然地表达例外条件。
- source_word: διερμηνεύῃ
  choice: 他说方言后加以解释
  rationale: 无明示新主语的单数动词最自然地回指说方言者；补出“说方言后”使中文关系清楚，同时脚注保留由别人解释的可能。
- source_word: ἡ ἐκκλησία
  choice: 教会
  rationale: 符合保罗书信的通行中文用语；这里具体指聚集的信徒群体。
- source_word: οἰκοδομὴν λάβῃ
  choice: 得到造就
  rationale: 既保留“得到”的接受结构，也以现代教会语境中易懂的“造就”传达建立、增强群体之意。
theological_decisions:
- issue: 说预言者相对于说方言者“更大”
  choice: 正文保留“更大”，由目的从句显示比较关乎教会得到造就。
  alternative: 译作“更重要”或“对教会更有益”。
  rationale: 原文使用宽泛的比较词μείζων；不应将其解释为个人灵性、圣洁或等级上的优越，也不宜在正文中过早消除其张力。
- issue: διερμηνεύῃ的主语
  choice: 正文按最直接的语法衔接理解为说方言者本人解释。
  alternative: 由另一个人解释，或笼统地说“有人解释”。
  rationale: 单数动词没有另立主语，最自然地承接前面的单数说方言者；但本章下文允许别人解释，因此在脚注中保留这一可能。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。保留“说方言”“说预言”“教会”“造就”等已广为人知的经文用语，同时用自然句法避免生硬直译。所有脚注标记均置于其所说明的正文词句之后。
