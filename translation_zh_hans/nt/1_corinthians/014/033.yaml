  text: οὐ γάρ ἐστιν ἀκαταστασίας ὁ θεὸς ἀλλὰ εἰρήνης), ὡς ἐν πάσαις ταῖς ἐκκλησίαις τῶν ἁγίων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/033.yaml
  text: For God is not a God of disorder but of peace[b][a], as in all the churches of the saints.
translation:
  language: zh_hans
  text: 因为神不是混乱的神，而是赐平安的神，正如众圣徒的各教会中一样。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “混乱”或译“纷乱”。“正如众圣徒的各教会中一样”也可译作“正如在神圣洁子民的各教会中一样”。有些人把这句话与下一节相连，而不与本节相连。
    reason: lexical_alternative; alternative_reading
lexical_decisions:
- source_word: ἀκαταστασίας
  choice: 混乱
  rationale: 此词在这里与聚会中的秩序有关，表示紊乱、失序；“混乱”既自然，也保留了可指局面失序而非仅指思想困惑的宽度。
- source_word: εἰρήνης
  choice: 和平
  rationale: 这是 εἰρήνη 的常用对应词，在本处与“混乱”相对，表达和睦、安宁且有秩序的状态。
- source_word: ὁ θεὸς
  choice: 神
  rationale: 在现代汉语圣经语体中，“神”自然地表达此处确定、具位格的所指，无须另译定冠词。
- source_word: ὡς
  choice: 正如……一样
  rationale: 保留比较或援引各教会共同情形的功能，同时避免把其与前句的逻辑关系解释得过满。
- source_word: ἐκκλησίαις
  choice: 教会
  rationale: 此处指各地基督徒群体；“教会”是现代汉语中自然且惯用的对应词。
- source_word: τῶν ἁγίων
  choice: 圣徒的
  rationale: 保留保罗对信徒的惯用称谓及原文属格结构；脚注提供更通俗的表达。
- source_word: γάρ
  choice: 因为
  rationale: 承接上文，为有关聚会秩序的指示提供理由；“因为”在汉语中比句首“原来”更直接清楚。
theological_decisions:
- issue: ὡς ἐν πάσαις ταῖς ἐκκλησίαις τῶν ἁγίων 的句法归属
  choice: 按所给 SBLGNT 标点，将该短语连于第33节，作为比较或对众教会共同情形的援引
  alternative: 将该短语连于第34节，意为“正如在圣徒的众教会中，妇女应当……”
  rationale: 希腊文自身不能完全消除连接歧义，抄本与现代标点处理也有差异。正文依所给版本连于本节，但以脚注保留另一种可能，不据此化解相关神学张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“和平的神”保留原文两个属格名词结构之间的对称；“正如在……一样”略显凝练，但有意保存原文短语的概括性与句法歧义。
