base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/009.yaml
  text: 'So also with you: if through the tongue you do not give intelligible speech[a], how will what is spoken be understood? For you will be speaking into the air.'
translation:
  language: zh_hans
  text: 你们也同样：若你们用舌头说不出清楚易懂的话[a]，人怎么能明白所说的呢？因为你们是在对着空气说话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“清晰可辨的话”或“明确的信息”。希腊语强调听者能够辨认并理解的话语。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: 你们也同样
  rationale: 承接上文乐器发声的比喻，并直接把原则应用于哥林多人；表达简洁自然。
- source_word: διὰ τῆς γλώσσης
  choice: 用舌头
  rationale: 保留“舌头”的具体意象，同时以现代汉语自然表达工具意义；不提前把它限定解释为某一种语言。
- source_word: εὔσημον λόγον
  choice: 清楚易懂的话
  rationale: εὔσημος强调可辨认、清楚而能被听者理解；“话”适合此处话语的整体意义，不局限于单个词。
- source_word: δῶτε
  choice: 说出
  rationale: δίδωμι字面为“给出”，但汉语说“给出话语”较生硬；“说出”准确表达在发声中产生话语的语境含义。
- source_word: πῶς γνωσθήσεται
  choice: 怎么能明白
  rationale: 被动形式在此指听者能否领会所说内容；汉语用主动泛指结构更自然，并保留反问语气。
- source_word: τὸ λαλούμενον
  choice: 所说的
  rationale: 简洁保留实体化被动分词的意义，即正在被说出的内容。
- source_word: ἔσεσθε γὰρ εἰς ἀέρα λαλοῦντες
  choice: 因为你们只是在对着空气说话
  rationale: 保留“向空气说话”的形象，传达无人理解、言语徒然的效果；“只是在”使汉语句意自然，但不改变论证。
