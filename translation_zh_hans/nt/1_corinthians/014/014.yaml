  text: ἐὰν γὰρ προσεύχωμαι γλώσσῃ, τὸ πνεῦμά μου προσεύχεται, ὁ δὲ νοῦς μου ἄκαρπός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/014.yaml
  text: For if I pray in a tongue[a], my spirit prays[b], but my mind is unfruitful.
translation:
  language: zh_hans
  text: 因为我若用方言[a]祷告，我的灵在祷告，我的心思却不结果子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“一种语言”。希腊语这个词既可指人的语言，也可指本章所说的“方言”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν γὰρ
  choice: 因为，如果
  rationale: γάρ承接并解释上文，ἐάν引出条件；“因为，如果”在现代汉语中保留两者的功能。
- source_word: προσεύχωμαι
  choice: 我……祷告
  rationale: 以一般现在性的表达呈现条件句中的现在时虚拟语气，不额外强调进行状态。
- source_word: γλώσσῃ
  choice: 用方言
  rationale: γλῶσσα既可指语言，也可指本章语境中的属灵言说；“方言”保留哥林多前书相关段落的常用术语，而脚注说明其词义范围。
- source_word: τὸ πνεῦμά μου
  choice: 我的灵
  rationale: 直译所有格结构，并与“我的心思”形成对照；不将其明确写成圣灵，也不作解释性扩充。
- source_word: ὁ δὲ νοῦς μου
  choice: 但我的心思却
  rationale: νοῦς可指心智、思想或理解能力；“心思”能自然地与“灵”对照，又不过度缩窄为单纯的理解。δέ译作“但……却”，清楚表达转折。
- source_word: ἄκαρπός ἐστιν
  choice: 不结果子
  rationale: 保留ἄκαρπος的结果子隐喻，同时比生硬的“是不结果子的”更符合现代汉语。
theological_decisions:
- issue: “我的灵”（τὸ πνεῦμά μου）的所指
  choice: 译作“我的灵”，首先按说话者自己的灵来理解
  alternative: 指在说话者里面运行的圣灵
  rationale: 所有格“我的”以及与“我的心思”的对照较支持人的灵这一理解；译文仍严格保留“我的灵”，不加入会彻底排除另一理解的解释。
- issue: “心思不结果子”的意义
  choice: 保留心思本身“不结果子”的表述
  alternative: 解释为“我的理解没有产生果效”或“我不能理解”
  rationale: 原文以νοῦς为主语，以ἄκαρπος为谓语；直保留这一隐喻，避免提前判定果效的对象或具体性质。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不结果子”保留保罗的农业隐喻；“方言”按本章惯用术语处理，并以脚注保留“语言”的词义可能。
