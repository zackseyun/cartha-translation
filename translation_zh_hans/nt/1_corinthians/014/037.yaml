  text: Εἴ τις δοκεῖ προφήτης εἶναι ἢ πνευματικός, ἐπιγινωσκέτω ἃ γράφω ὑμῖν ὅτι κυρίου ⸀ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/037.yaml
  text: If anyone thinks he is a prophet or spiritual[a], let him recognize that what I am writing to you is a command of the Lord.
translation:
  language: zh_hans
  text: 如果有人自认为是先知，或是属灵的人，就该承认：我写给你们的这些话是主的命令。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我写给你们的这些话是属于主的。”希腊文直译为“是主的／属于主”，正文中的“命令”是按上下文补出的。
    reason: 保留 κυρίου ἐστίν 这一省略结构的较直译读法，并说明正文所作的语义补足。
lexical_decisions:
- source_word: δοκεῖ
  choice: 自认为
  rationale: 这里表达个人对自己身份的判断或主张；“自认为”自然地保留了保罗可能带有纠正意味的语气。
- source_word: προφήτης
  choice: 先知
  rationale: 这是该词在属灵恩赐与先知讲论语境中的标准、清楚译法。
- source_word: πνευματικός
  choice: 属灵的人
  rationale: 希腊语形容词在此名词化，指自认有圣灵恩赐或受圣灵引导的人；此译法保留其宽泛含义，不限定为某一种具体恩赐。
- source_word: ἐπιγινωσκέτω
  choice: 就该承认
  rationale: 现在时命令式要求对方认可并接受所述事实；“承认”符合顺服使徒教导的语境，也比单纯“知道”更准确。
- source_word: ἃ γράφω ὑμῖν
  choice: 我写给你们的这些话
  rationale: 自然表达关系代词与书信体现在时，清楚指向保罗正在写下的教导。
- source_word: κυρίου ἐστίν
  choice: 是主的命令
  rationale: 原文直译为“是主的／属于主”，结构有所省略；结合上下文，补出“命令”可清楚传达这些教导具有主所赋予的约束权威，同时以脚注保留原文形式上的歧义。
theological_decisions:
- issue: κυρίου ἐστίν 的省略结构
  choice: 正文译作“是主的命令”
  alternative: “是属于主的”或“是主的”
  rationale: 上下文强调保罗所写教导的神圣权威与约束力；补出“命令”使现代汉语意思完整，但因希腊文没有明写“命令”一词，脚注注明较直译的可能表达，以保存原文的压缩性和歧义。
- issue: τις ... προφήτης ... πνευματικός 的性别表达
  choice: 译作泛指的“有人……属灵的人”
  alternative: 使用男性代词“他”
  rationale: 希腊语为阳性单数形式，但 τις 在条件句中泛指任何个人。现代汉语无需用代词标示语法性别，因此既忠实于泛指功能，也不额外限定所指性别。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“自认为”保留可能的纠正语气；“就该承认”体现命令式的力度。脚注标记置于相关句末，说明原文省略结构。
