  text: ⸀Νῦν δέ, ἀδελφοί, ἐὰν ἔλθω πρὸς ὑμᾶς γλώσσαις λαλῶν, τί ὑμᾶς ὠφελήσω, ἐὰν μὴ ὑμῖν λαλήσω ἢ ἐν ἀποκαλύψει ἢ ἐν γνώσει ἢ ἐν προφητείᾳ ἢ ἐν διδαχῇ;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/006.yaml
  text: Now[a], brothers, if I come to you speaking in tongues[b], what will I benefit you unless I speak to you either by revelation or by knowledge or by prophecy or by teaching?
translation:
  language: zh_hans
  text: 如今，弟兄们[a]，如果我到你们那里去说方言[b]，除非我对你们讲的是启示、知识、预言或教导，不然我能使你们得到什么益处呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“弟兄姊妹”；希腊文“弟兄们”可以用来称呼包括男女在内的会众。
    reason: lexical_alternative
  - marker: b
    text: 或译“说各种语言”；这里的希腊词也可指“语言”，但在哥林多前书12—14章的语境中，指一直讨论的那种言语现象。
    reason: lexical_alternative
lexical_decisions:
- source_word: Νῦν δέ
  choice: 现在
  rationale: 标明保罗论述转入当前所设情形；中文用“现在”自然，也不过度强化转折。
- source_word: ἀδελφοί
  choice: 弟兄们
  rationale: 保留希腊文阳性复数称呼的形式；在保罗书信中，这一称呼可指包括女性在内的全体会众，故以脚注说明。
- source_word: γλώσσαις λαλῶν
  choice: 只说方言
  rationale: “说方言”是本段属灵言语现象的常用中文表达。“只”在中文句法中显明后文ἐὰν μὴ所构成的排除条件，并非另加一种现象；“语言”仍是词义上的可能说法，列入脚注。
- source_word: τί ὑμᾶς ὠφελήσω
  choice: 我能使你们得到什么益处呢
  rationale: 自然表达ὠφελέω的“使……受益”之义，并保留反问语气及对会众实际益处的强调。
- source_word: ἐὰν μὴ
  choice: 除非……不然
  rationale: 用现代汉语自然呈现希腊文的否定条件关系。
- source_word: ὑμῖν λαλήσω
  choice: 我对你们讲的是
  rationale: 保留向会众传达话语的含义，并使后接四个并列名词在中文中清楚顺畅。
- source_word: ἐν ἀποκαλύψει / ἐν γνώσει / ἐν προφητείᾳ / ἐν διδαχῇ
  choice: 启示、知识、预言或教导
  rationale: 四项保持平行。介词ἐν在此可表方式、内容或领域；中文由“讲的是”统摄，避免武断限定为单一关系。
theological_decisions:
- issue: ἀδελφοί作为会众称呼的范围
  choice: 正文译“弟兄们”，脚注说明也可译“弟兄姊妹”
  alternative: 正文直接译“弟兄姊妹”
  rationale: 既保留原文的语法形式，也明确其在混合会众中可有包容性指称。
- issue: γλώσσαις在哥林多前书12—14章中的含义
  choice: 方言
  alternative: 语言
  rationale: “方言”保留本段所讨论之属灵言语现象的惯用称呼，却不判定这种现象究竟是人间语言还是其他形式的言语。
- issue: 四个ἐν短语的关系
  choice: 译作所讲内容的并列项目，不额外界定为“借着”或“在……中”
  alternative: 借着启示、知识、预言或教导
  rationale: ἐν可表达方式、内容或领域；汉语“讲的是”既符合语境，也保留一定语义张力，避免不必要地缩窄解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“方言”沿用中文圣经语境中的通行表达；句子重组为自然反问，同时保留原文的条件结构和四项并列。
