  text: ἐὰν οὖν συνέλθῃ ἡ ἐκκλησία ὅλη ἐπὶ τὸ αὐτὸ καὶ πάντες ⸂λαλῶσιν γλώσσαις⸃, εἰσέλθωσιν δὲ ἰδιῶται ἢ ἄπιστοι, οὐκ ἐροῦσιν ὅτι μαίνεσθε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/023.yaml
  text: Therefore[a], if the whole church comes together in one place and all speak in tongues, and uninstructed people or unbelievers enter[b], will they not say that you are out of your minds?
translation:
  language: zh_hans
  text: 所以，若全教会聚集在一处，人人都说方言[a]，又有不熟悉这种聚会的人[b]或不信的人进来，他们岂不会说：“你们疯了吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “方言”也可译作“语言”。希腊语γλῶσσα可以指语言；这里采用“方言”这一通行称谓，不据此断定这种言说现象的具体性质。
    reason: alternative_reading
  - marker: b
    text: “不熟悉这种聚会的人”也可译作“不了解的人”或“外人”。原词可能指对会众的活动或做法尚不了解、未受教导的人；这里将他们与“不信的人”分别列出。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: 所以
  rationale: 表示由上文引出的推论；“所以”在现代汉语中自然清楚，又保留逻辑衔接。
- source_word: συνέλθῃ ἡ ἐκκλησία ὅλη ἐπὶ τὸ αὐτό
  choice: 全教会聚集在一处
  rationale: “全教会”保留ὅλη对整个群体的强调；“聚集在一处”同时表达共同聚会和同处一地的含义。
- source_word: πάντες λαλῶσιν γλώσσαις
  choice: 人人都说方言
  rationale: “人人都”保留πάντες的整体范围；“说方言”是华语教会语境中对此恩赐现象的通行表达，同时不把它限定为普通人类语言。
- source_word: ἰδιῶται
  choice: 不熟悉这种聚会的人
  rationale: 该词指对相关实践或群体处境不了解、未受教导的人；此译法也保留其与随后“不信的人”的区别。
- source_word: ἄπιστοι
  choice: 不信的人
  rationale: 直接表达不信者，并与前面的ἰδιῶται形成原文中的并列和区分。
- source_word: οὐκ ἐροῦσιν ὅτι μαίνεσθε
  choice: 他们岂不会说你们疯了吗
  rationale: “岂不会”保留预期肯定答案的反问语气；“疯了”自然传达μαίνομαι所指的失常、疯狂判断。
theological_decisions:
- issue: 哥林多前书14章中γλώσσαι所指现象的性质
  choice: 正文译作“方言”
  alternative: 语言；别种语言
  rationale: γλῶσσα在词汇上可指语言，但本章用它称呼所讨论的属灵言说现象。“方言”保留中文圣经及教会语境中的既有称谓，不武断裁定它必然是已知人类语言、忘我言说或其他特定形式。
- issue: ἰδιῶται与ἄπιστοι是否指同一类人
  choice: 分别译为“不熟悉这种聚会的人”和“不信的人”
  alternative: 把前者统称为“外人”
  rationale: 原文以ἤ并列两个称谓，可能有类别重叠，却仍作词义上的区分；正文不将两者合并。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“全教会聚集在一处”保持经文的群体和空间重点；结尾用“岂不会……吗”呈现保罗鲜明的反问语气。脚注标记均紧随其所说明的词语。
