  text: ἐπεὶ ἐὰν ⸀εὐλογῇς ⸀πνεύματι, ὁ ἀναπληρῶν τὸν τόπον τοῦ ἰδιώτου πῶς ἐρεῖ τὸ Ἀμήν ἐπὶ τῇ σῇ εὐχαριστίᾳ; ἐπειδὴ τί λέγεις οὐκ οἶδεν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/016.yaml
  text: Otherwise[a], if you bless in the spirit, how will the one filling the place of the uninstructed say the Amen at your thanksgiving[c][b], since he does not know what you are saying?
translation:
  language: zh_hans
  text: 不然，如果你在灵里[b]祝福，处在不明白者[a]之列的人，既然不知道你在说什么，怎能对你所献的感谢[c]说“阿们”呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不明白者”也可译作“外来者”、“普通人”或“未受教的人”。这里指不具备相关知识、因而不明白所说话语的人。
    reason: lexical_alternative
  - marker: b
    text: “在灵里”也可译作“用灵”；希腊文在这里没有要求更具体地判定是人的灵，还是圣灵所促成的表达。
    reason: alternative_reading
  - marker: c
    text: 这里的“感谢”指献上感谢或感恩之言，不一定是后来作为专门术语使用的“圣餐”。
    reason: cultural_note
lexical_decisions:
- source_word: ἐπεὶ ἐὰν
  choice: 不然，如果
  rationale: 这一组合承接上文，引出若不按上文原则行事所产生的情形；“不然，如果”既保留推论和转折意味，也自然引入条件句。
- source_word: εὐλογῇς
  choice: 祝福
  rationale: 保留 εὐλογέω 的基本词义，并符合聚会中出声颂赞或祝福的语境；不把它限缩为某一种固定礼仪。
- source_word: πνεύματι
  choice: 在灵里
  rationale: 与格既可能表达凭借，也可能表达所处领域；“在灵里”保留这种开放性，不武断认定专指人的灵或圣灵。
- source_word: ὁ ἀναπληρῶν τὸν τόπον τοῦ ἰδιώτου
  choice: 那位处于不通晓者位置的人
  rationale: ἀναπληρῶν τὸν τόπον 是占据某一位置或处境的惯用表达；ἰδιώτης 在此着重指未掌握或不明白这种言语的人。“处于……位置”保留原文意象，而“不通晓者”与下文“不知道你在说什么”呼应。
- source_word: πῶς ἐρεῖ τὸ Ἀμήν
  choice: 怎么能……说“阿们”呢
  rationale: 保留会众以“阿们”表示认同的实际回应；汉语用引号标示所说的话，比直译冠词更自然。
- source_word: ἐπὶ τῇ σῇ εὐχαριστίᾳ
  choice: 在你献上感谢时
  rationale: 此处 εὐχαριστία 指发出的感谢或感恩之言；该译法配合 ἐπί 表达回应发生的场合，同时避免引入后来形成的圣餐专门术语。
- source_word: ἐπειδὴ τί λέγεις οὐκ οἶδεν
  choice: 既然不知道你在说什么
  rationale: 直接表达原因，保留 οἶδεν 的“知道”，而不把它完全改写为解释性更强的“听不懂”。
theological_decisions:
- issue: πνεύματι 在属灵恩赐与聚会语境中的所指
  choice: 译作“在灵里”，不明确限定为人的灵或圣灵所促成的言语
  alternative: “用灵”或“靠圣灵”
  rationale: 希腊文与格以及本节措辞没有迫使译者在人的灵、圣灵或圣灵所促成的表达之间作出唯一判定；正文保留原有张力，脚注仅提示语法上的另一种译法。
- issue: εὐχαριστία 是否为圣餐专门术语
  choice: 译作“感谢”，指在聚会中献上的感恩之言
  alternative: 译作后来具有礼仪专义的“感恩祭”或“圣餐”
  rationale: 上下文关注他人能否听懂并以“阿们”回应，原文在这里并不要求后世的圣礼专义，因此不将该含义带入正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“那位处于……位置的人”略保留原文的空间意象，同时避免生硬直译为“填补位置”。“说‘阿们’”符合当代中文教会及一般读者熟悉的表达；句末反问体现原文论证语气。
