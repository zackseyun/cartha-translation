  text: ὥστε αἱ γλῶσσαι εἰς σημεῖόν εἰσιν οὐ τοῖς πιστεύουσιν ἀλλὰ τοῖς ἀπίστοις, ἡ δὲ προφητεία οὐ τοῖς ἀπίστοις ἀλλὰ τοῖς πιστεύουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/022.yaml
  text: So then[a], tongues are for a sign not to those who believe but to unbelievers[b], while prophecy is not to unbelievers but to those who believe.
translation:
  language: zh_hans
  text: 因此，方言[a]是给不信的人的记号，不是给信的人的；先知性发言却不是给不信的人，而是给信的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“语言”。希腊词可以指各种语言；在哥林多前书12—14章中译作“方言”，可沿用保罗在这段论述中的术语，而不裁定其具体性质。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: 因此
  rationale: 表示从上文论证得出的结论；“因此”在现代汉语中自然、庄重，并保留推论关系。
- source_word: γλῶσσαι
  choice: 方言
  rationale: 这是哥林多前书12—14章相关恩赐的通行译语，又不明确限定为外国语言或忘我状态下的言语，保留原词在此处的解释空间。
- source_word: εἰς σημεῖόν
  choice: 作记号
  rationale: 保留εἰς在此所表达的目的或结果关系；不把σημεῖον具体解释为正面的凭据或审判的记号。
- source_word: τοῖς πιστεύουσιν
  choice: 给信的人
  rationale: 将实词化分词的动作意味直接表达出来，并与“不信的人”形成清楚对照。
- source_word: τοῖς ἀπίστοις
  choice: 给不信的人
  rationale: 准确表达与“信的人”相对的群体，措辞简明自然。
- source_word: ἡ προφητεία
  choice: 先知性发言
  rationale: 指本章所论的先知恩赐及其言语活动；此译法避免把它缩限为预告未来，也避免将其等同于一般讲道。
- source_word: δὲ
  choice: 却
  rationale: 清楚标示方言与先知性发言之间的对比。
theological_decisions:
- issue: γλῶσσαι在属灵恩赐语境中的含义
  choice: 译作“方言”，不具体说明其语言现象
  alternative: “语言”或“忘我状态下的言语”
  rationale: 保罗所指现象的具体性质存在争议；正文采用已确立的教会用语，但不引入特定宗派的解释。
- issue: 给不信之人的σημεῖον具有什么性质
  choice: 中性地译作“记号”
  alternative: “印证的记号”或“审判的记号”
  rationale: 紧接上文以赛亚书28:11—12的引文，有人据此理解为审判的记号；但希腊文本本身只说“记号”，正文不替读者解决这一张力。
- issue: προφητεία的活动性质
  choice: 译作“先知性发言”
  alternative: “预言”或“先知讲道”
  rationale: “预言”在现代汉语中容易被理解为专指预告未来，“先知讲道”则可能过度限定为讲道形式；所选译法较为中性地表达先知恩赐所产生的言语活动。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“信的人／不信的人”保留希腊文分词与形容词的鲜明对照；分号呈现原句两个并列而相反的分句。
