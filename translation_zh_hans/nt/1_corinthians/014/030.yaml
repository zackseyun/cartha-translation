revisions:
- from: 但若有启示给了另一位坐着的人，先说话的就当静默。[a]
  to: 但如果坐着的另一位得了启示，先说话的就当静默。[a]
  rationale: 修订仅改善汉语句法和搭配：“得了启示”取代生硬的“有启示给了”，并将分词性修饰语调整为自然语序。保留条件语气、另一人的坐姿、启示来源未明，以及先发言者停止发言的命令。脚注锚点和释义均保持有效。
