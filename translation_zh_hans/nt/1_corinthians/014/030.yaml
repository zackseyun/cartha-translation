  yaml_path: translation/nt/1_corinthians/014/030.yaml
  text: But if a revelation is given to another who is seated[b][a], let the first be silent.
translation:
  language: zh_hans
  text: 但如果坐着的另一位得了启示，先说话的就当静默。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “静默”在这里是指先说话的人停止发言，让另一位发言。
    reason: cross_reference
lexical_decisions:
- source_word: ἐὰν δὲ
  choice: 但若
  rationale: ἐὰν引出条件，δὲ表示轻微转折或话题推进；“但若”符合上下文中对聚会发言次序的补充规定。
- source_word: ἄλλῳ
  choice: 另一位
  rationale: 与当前发言者相区别，指聚会中的另一人；“另一位”简洁自然，也保持对人的指称。
- source_word: ἀποκαλυφθῇ
  choice: 有启示给了
  rationale: 该词为不定过去时被动虚拟式，表达某事被揭示。译文保留被动含义及“启示”的语境，同时不明说施事者。
- source_word: καθημένῳ
  choice: 坐着的人
  rationale: 现在时分词，修饰ἄλλῳ，描写另一位参与者当时坐着；“坐着的人”是自然的现代汉语。
- source_word: ὁ πρῶτος
  choice: 先说话的
  rationale: 字面为“第一个／先前的那位”，上下文指正在发言的第一位先知；汉语若仅译“第一个”较含混，因此以最少量语境补足为“先说话的”。
- source_word: σιγάτω
  choice: 就当静默
  rationale: 第三人称单数命令式，要求前一位停止发言、让出发言机会；“当静默”保留命令语气和经文的庄重语体。
theological_decisions:
- issue: 会众预言语境中启示事件的性质与来源
  choice: 译作“有启示给了”，不明确指出启示的施事者
  alternative: “若有什么向另一位显明”或“若另一位从神领受启示”
  rationale: 被动式在此语境中自然表示启示临到，但原文没有明确说“从神”；译文既保留启示性质，也避免添加原文未明说的神学信息。
- issue: ὁ πρῶτος所指的人
  choice: 译作“先说话的”
  alternative: 较字面的“第一个”
  rationale: 上下文表明这是指先前正在发言的人。该表达澄清实际指向，但不把他进一步限定为某种正式职分。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“有启示给了”刻意保留原文被动结构及施事者未明的特点；“当静默”呼应本章关于聚会秩序的命令语气。脚注标记已在正文中出现。
