reference: 1 Corinthians 14:26
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Τί οὖν ἐστιν, ἀδελφοί; ὅταν συνέρχησθε, ⸀ἕκαστος ψαλμὸν ἔχει, διδαχὴν ἔχει, ⸂ἀποκάλυψιν ἔχει, γλῶσσαν⸃ ἔχει, ἑρμηνείαν ἔχει· πάντα πρὸς οἰκοδομὴν γινέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/026.yaml
  text: What then is it[a], brothers? When you come together, each one has a psalm, has a teaching, has a revelation, has a tongue, has an interpretation[b]. Let all things be done for building up.
translation:
  language: zh_hans
  text: 那么，弟兄们[a]，这该怎么说呢？你们聚集的时候，每个人都有诗篇，有教导，有启示，有方言[b]，有翻译。凡事都应当为造就而做。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄们”在这里是对全体会众的代表性称呼，包括女性。
    reason: 说明代表性阳性复数称呼在此会众语境中的包容范围。
  - marker: b
    text: 或译“语言”。希腊语这个词可指舌头或语言；在本段中译为“方言”以保留保罗所用的术语，并不限定为现代意义上的地域方言，也不预断这种言语现象的具体性质。
    reason: 保留γλῶσσα的词义范围及本章语境中的术语连续性，避免以现代“方言”的狭义预先界定其所指。
lexical_decisions:
- source_word: Τί οὖν ἐστιν
  choice: 那么……该怎么说呢？
  rationale: 以现代汉语的反问句自然表达保罗从前文转入实际结论的语气，同时保留原文问句，不把它改写成单纯陈述。
- source_word: ἀδελφοί
  choice: 弟兄们
  rationale: 保留希腊语阳性复数的称呼形式；上下文中这是对整个会众的代表性称呼，其包括女性的语用范围由脚注说明。
- source_word: ὅταν συνέρχησθε
  choice: 你们聚集的时候
  rationale: 表达会众共同聚会的情境，也保留ὅταν加虚拟语气所含的每逢此事发生之意。
- source_word: ἕκαστος
  choice: 各人
  rationale: 简洁表达逐一分配的含义，并与后面的聚会贡献项目相衔接。
- source_word: ψαλμόν
  choice: 诗歌
  rationale: 在现代汉语中比“诗篇”更适合指聚会中供吟唱或颂赞的内容，也不武断限定为《诗篇》中的篇章。
- source_word: διδαχήν
  choice: 教导
  rationale: 准确表达聚会中用于教诲的内容，避免“教义”可能带来的系统化含义。
- source_word: ἀποκάλυψιν
  choice: 启示
  rationale: 采用清楚而通行的对应词，表达被揭示、显明的信息。
- source_word: γλῶσσαν
  choice: 方言
  rationale: 采用哥林多前书12—14章在汉语基督教语境中的通行术语，同时以脚注保留“语言”的可能性，不判定这种言语现象的具体性质。
- source_word: ἑρμηνείαν
  choice: 翻译
  rationale: 切合本章将方言转达给会众的语境；此词也可涵盖解释，但这里“翻译”更清楚地表现语言内容被传达出来。
- source_word: πάντα πρὸς οἰκοδομὴν γινέσθω
  choice: 凡事都要为造就人而行
  rationale: 以自然庄重的汉语表达命令语气，并保留οἰκοδομή的建造隐喻在群体属灵成长上的常用引申义。
theological_decisions:
- issue: 会众训示中的代表性阳性称呼
  choice: 正文译作“弟兄们”，脚注说明在此包括女性。
  alternative: 弟兄姊妹们
  rationale: 既保留原文阳性复数称呼的形式，又明确它在混合会众中的代表性和包容性用法。
- issue: 本章中γλῶσσα的含义
  choice: 正文译作“方言”，脚注列出“语言”。
  alternative: 语言
  rationale: “方言”保留保罗这段论述中的传统术语；脚注避免把它误解为现代汉语所说的地域性方言，也不预先裁定这是已知人类语言、特殊言语，还是更宽泛的语言现象。
- issue: οἰκοδομή的对象
  choice: 译作“造就人”。
  alternative: 建造
  rationale: 原文未明说宾语，但上下文明确关注会众得造就；补出“人”使现代汉语完整自然，同时保留“造就”所承载的建造意象。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式保留原文从反问转入聚会规范的推进；重复“有”以反映希腊文列举结构。术语“方言”配脚注，以免现代读者仅按地域性方言理解。
