  yaml_path: translation/nt/1_corinthians/014/008.yaml
  text: For if the trumpet gives an unclear sound[b][a], who will prepare for battle?
translation:
  language: zh_hans
  text: 因为号筒若发出含混不清的声音[a]，谁会准备作战[b]呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“难以辨明的声音”。
    reason: lexical_alternative
  - marker: b
    text: 直译：“为战争（作准备）”。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: 因为
  rationale: 承接上文并引出说明性例证；现代汉语用“因为”自然表达其解释作用。
- source_word: ἐὰν
  choice: 若
  rationale: 与虚拟式动词构成条件句；“若”简洁庄重，也符合反问语境。
- source_word: ἄδηλον
  choice: 含混不清的
  rationale: 表示不清楚、难以辨明；在军事号音的语境中，指无法明确辨识其信号。
- source_word: φωνὴν
  choice: 声音
  rationale: φωνή可指嗓音或声响；与号筒连用时，宜译为“声音”。
- source_word: σάλπιγξ
  choice: 号筒
  rationale: 指用于发出信号的军用吹奏器；“号筒”较“喇叭”更能保留本节军事语境。
- source_word: δῷ
  choice: 发出
  rationale: 原义为“给出”，但汉语通常说乐器“发出声音”，既自然又保留原句结构。
- source_word: τίς
  choice: 谁
  rationale: 直接表达反问代词，并保留修辞力度。
- source_word: παρασκευάσεται
  choice: 会准备
  rationale: 未来中间态表示使自己预备妥当；汉语“准备”在此已自然包含自身整备之意。
- source_word: εἰς πόλεμον
  choice: 迎战
  rationale: 字面为“为战争”；在号筒召集作战的具体情境中，“准备迎战”自然表达备战之意。
