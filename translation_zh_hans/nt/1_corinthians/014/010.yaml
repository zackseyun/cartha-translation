  yaml_path: translation/nt/1_corinthians/014/010.yaml
  text: There are perhaps many kinds of languages in the world[a], and none is without meaning.
translation:
  language: zh_hans
  text: 世上也许有这么多种声音[a]，没有一种是没有意义的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “声音”也可译为“语言”。“没有意义的”按语境表达；原文ἄφωνον按字面可译为“无声的”或“不能发声的”。
    reason: 保留φωνή和ἄφωνον的词义范围，同时说明正文依据语境所作的表达，避免把字面替代译文处理得不自然。
lexical_decisions:
- source_word: τοσαῦτα
  choice: 那么多
  rationale: 保留指数量众多的语气，并与后面的“种”自然搭配。
- source_word: εἰ τύχοι
  choice: 也许
  rationale: 这是缓和语气的惯用表达；“也许”自然地保留其不确定、随举一例的口吻。
- source_word: γένη
  choice: 种
  rationale: 表示类别或种类，现代汉语用“种”最简洁自然。
- source_word: φωνῶν
  choice: 声音
  rationale: φωνή可指声音、嗓音或语言；正文采用较宽泛的“声音”，既承接上下文有关言语的讨论，也不把词义过早限定为“语言”。
- source_word: ἐν κόσμῳ
  choice: 世上
  rationale: 自然表达“在世界上”，符合现代汉语习惯。
- source_word: οὐδὲν ἄφωνον
  choice: 没有一种是没有含义的
  rationale: ἄφωνος字面可指无声、不能发声；但与各种φωνή相对时，语境重点在于声音并非不可理解或毫无指向，因此正文表达为“没有含义”，同时以脚注保留字面可能。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“那么多种”保留原文的数量感；“却”清楚呈现后半句的推进关系。正文以“声音”保存φωνή的词义宽度，以“含义”传达本节论证所指，脚注保留另一种较字面的组合。
