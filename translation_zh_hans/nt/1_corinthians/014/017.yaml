  text: σὺ μὲν γὰρ καλῶς εὐχαριστεῖς, ἀλλ’ ὁ ἕτερος οὐκ οἰκοδομεῖται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/017.yaml
  text: For you are indeed giving thanks well[a], but the other person is not built up.
translation:
  language: zh_hans
  text: 因为你固然感谢得很好，但另一个人却得不到造就[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“没有被建造起来”。
    reason: 说明οἰκοδομεῖται的被动语态及其建造隐喻。
lexical_decisions:
- source_word: σὺ
  choice: 你
  rationale: 保留第二人称单数的直接称呼；现代汉语“你”清楚表达单数。
- source_word: μὲν γὰρ
  choice: 因为……固然
  rationale: “因为”表达γάρ的解释作用，“固然”则与后面的“但”配合，保留μέν……ἀλλά先承认、后转折的结构。
- source_word: καλῶς
  choice: 得好
  rationale: 表达“好、恰当”的评价意义；与“感恩”搭配虽略带原文痕迹，却简明地保留保罗对其感恩本身的肯定。
- source_word: εὐχαριστεῖς
  choice: 感恩
  rationale: 在聚会祷告的语境中，指向上帝献上感谢；“感恩”自然、简洁，也不必补出原文未明说的宾语。
- source_word: ἀλλ’
  choice: 但……却
  rationale: 明确呈现强烈转折，并使现代汉语句势自然。
- source_word: ὁ ἕτερος
  choice: 另一个人
  rationale: 明确指聚会中的另一位参与者或听者，不把其身份进一步限定为某一特定群体。
- source_word: οὐκ οἰκοδομεῖται
  choice: 得不到造就
  rationale: 保留οἰκοδομέω的被动意义及保罗常用的建造隐喻，同时符合现代中文教会语境中可理解的表达。
theological_decisions:
- issue: οἰκοδομέω在会众语境中的建造隐喻
  choice: 得不到造就
  alternative: 没有得着建立
  rationale: “造就”保留群体中属灵建立与益处的含义，却不把它收窄为某一种教义上的成长模式；脚注提示其字面图像。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“因为……固然……但……却”保留原句的解释、让步和转折关系；不补充“用方言”等须由上下文推知的信息。
