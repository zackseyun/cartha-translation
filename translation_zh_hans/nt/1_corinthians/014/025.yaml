  text: ⸀τὰ κρυπτὰ τῆς καρδίας αὐτοῦ φανερὰ γίνεται, καὶ οὕτως πεσὼν ἐπὶ πρόσωπον προσκυνήσει τῷ θεῷ, ἀπαγγέλλων ὅτι ⸂Ὄντως ὁ θεὸς⸃ ἐν ὑμῖν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/025.yaml
  text: the secrets of his heart become evident[a], and so, falling on his face, he will worship God, declaring that God truly is among you.
translation:
  language: zh_hans
  text: 他心中隐藏的事显明出来；于是，他俯伏在地，敬拜上帝，宣告说：“上帝真的在你们中间[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“上帝真的在你们里面。”
    reason: 保留 ἐν ὑμῖν 可指上帝在群体或信徒里面的另一种理解。
lexical_decisions:
- source_word: τὰ κρυπτὰ τῆς καρδίας αὐτοῦ
  choice: 他心里的隐秘
  rationale: 保留“心”这一圣经人论用语，并用“隐秘”表达藏在人内心的思想和动机；相较于“秘密”，“隐秘”更庄重，也可涵盖不一定主动隐瞒的内在之事。
- source_word: φανερὰ γίνεται
  choice: 就显明出来
  rationale: “显明出来”保留从隐藏转为明显的过程性；“就”自然承接上文语境中的结果。
- source_word: καὶ οὕτως
  choice: 于是
  rationale: 表达前述内心被显明之后所产生的结果，符合该连接语在此处的推论和结果意味。
- source_word: πεσὼν ἐπὶ πρόσωπον
  choice: 俯伏在地
  rationale: 这是现代汉语中自然、庄重的俯身敬拜表达，传达面伏于地的身体姿态，又避免生硬直译为“倒在脸上”。
- source_word: προσκυνήσει τῷ θεῷ
  choice: 敬拜上帝
  rationale: 在此语境中，该动词指向上帝的宗教性敬拜；俯伏的身体动作已由前句表达。
- source_word: ἀπαγγέλλων
  choice: 宣告说
  rationale: 既表达公开、郑重地说出所确认之事，也用“说”自然引出直接引语。
- source_word: Ὄντως
  choice: 真的
  rationale: 自然地表达肯定和真实性，符合普通现代读者的语言习惯，同时保持语气力度。
- source_word: ἐν ὑμῖν
  choice: 在你们中间
  rationale: 上下文是教会聚会，所强调的是来访者从会众中的先知性言说认出上帝临在于他们当中；脚注保留“在你们里面”的可能译法。
theological_decisions:
- issue: 结语中 ἐν ὑμῖν 的含义
  choice: 在你们中间
  alternative: 在你们里面
  rationale: 直接语境指聚集的会众，因此正文采用群体中间的临在这一较自然的理解；但希腊语介词短语也可表达“在你们里面”，故以脚注保留该真实歧义，不将其默默消解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“俯伏在地”避免机械直译，同时保持敬拜姿态的鲜明画面；引号使 ἀπαγγέλλων 所引出的宣告清楚可读。
