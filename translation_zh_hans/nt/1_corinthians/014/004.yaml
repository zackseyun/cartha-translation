base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/004.yaml
  text: The one who speaks in a tongue builds up himself[c][b][a], but the one who prophesies builds up the church.
translation:
  language: zh_hans
  text: 说方言的，是造就自己；而说预言的，是造就教会。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “教会”也可译作“会众”或“聚会的群体”。本节的“方言”也可直译为“语言”；在本章语境中，它指方言恩赐，但这种言语的确切性质仍有争议。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λαλῶν
  choice: 说……的
  rationale: 冠词加现在分词构成名词性表达，指以该行动为特征的代表性个体；汉语用“说……的”自然地保留这一结构，并与后半句形成平行。
- source_word: γλώσσῃ
  choice: 方言
  rationale: 这里是无冠词的单数与格，处于哥林多前书12—14章有关属灵恩赐的语境中。“方言”是现代中文圣经语境中通行且易懂的表达，同时不限定这种言语究竟是外国语言还是其他受圣灵感动的言语。
- source_word: ἑαυτὸν
  choice: 自己
  rationale: 反身代词指回前面的说话者。现代汉语的“自己”不标性别，但准确保持单数反身关系，无须生硬补出“他自己”。
- source_word: οἰκοδομεῖ
  choice: 造就
  rationale: 该动词在此为比喻义，指使人或群体在属灵方面得到建立、坚固和益处。“造就”在现代中文基督教语境中自然凝练，也保留建造的隐喻。
- source_word: ὁ δὲ προφητεύων
  choice: 而说预言的
  rationale: 名词性现在分词与前半句平行；“而”表达δέ所带的温和对照，不将其强化为尖锐转折。
- source_word: ἐκκλησίαν
  choice: 教会
  rationale: 在保罗书信和本段聚会语境中，指聚集的基督徒群体。“教会”是最自然通行的译法；脚注注明“会众”等可能表达。
theological_decisions:
- issue: γλώσσῃ在哥林多前书12—14章中的所指
  choice: 译作“方言”，指本段所谈的方言恩赐，但不界定其具体性质
  alternative: 译作“语言”，并将其明确理解为普通外国语言；或明确译成狂喜式言语
  rationale: 上下文讨论聚会中的方言恩赐，但经文本身并未在本节界定这种言语的确切性质。“方言”既承接语境，也保留关于其性质的真实歧义。
- issue: ἑαυτὸν的代表性阳性单数
  choice: 译作“自己”
  alternative: 译作“他自己”
  rationale: 希腊语形式为阳性单数，但在此用于代表性陈述。汉语反身代词“自己”能准确指回说方言者，不额外引入原文在汉语中不必显出的性别信息。
- issue: 个人造就与教会造就之间的关系
  choice: 按原文陈述二者的对照，不添加褒贬判断
  alternative: 将“造就自己”解释为自私或讽刺性的负面陈述
  rationale: 本节本身只对比个人所得的造就与教会所得的造就；是否含讽刺或责备并不明确，因此译文不替读者解决这一神学与修辞张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“说方言的……说预言的……”保持原文两半句的紧密平行；用分号和“而”清楚呈现温和对照。正文中的脚注标记[a]与脚注完全对应。
