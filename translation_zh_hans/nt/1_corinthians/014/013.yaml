  text: Therefore[b][a], the one who speaks in a tongue should pray that he may interpret.
translation:
  language: zh_hans
  text: 因此，说方言[a]的人应当祷告，好使自己能翻出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “方言”也可译作“语言”。希腊文直译为“舌头”；这是本章通常用来指需要解释才能使人明白之话语的说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὸ
  choice: 因此
  rationale: 表示由上文推出结论；“因此”自然、庄重，并保留明确的推论关系。
- source_word: ὁ λαλῶν
  choice: 说……的人
  rationale: 带冠词的现在分词作名词用，泛指任何正在说方言的人；此表达保留单数而不限定性别。
- source_word: γλώσσῃ
  choice: 说方言
  rationale: γλώσσῃ为单数与λαλέω连用。本章所指的话语需要翻译才能使会众明白；“方言”保留保罗在本段的用语联系，也不预先断定它必定是普通人类语言或其他形式的话语。
- source_word: προσευχέσθω
  choice: 应当祷告
  rationale: 第三人称现在时命令式，表达劝勉或命令；“应当祷告”符合现代汉语，又保留其规范性语气。
- source_word: ἵνα
  choice: 求
  rationale: 在“祷告”之后，“求”自然地表达祷告的内容，同时含有目的意味。
- source_word: διερμηνεύῃ
  choice: 能把所说的翻译出来
  rationale: 该动词指把话语转达成可理解的内容。“翻译出来”符合本章一贯的语境；补出“所说的”使汉语完整，但没有另加希腊文未表达的具体内容。
theological_decisions:
- issue: γλώσσῃ在哥林多前书12—14章中的含义
  choice: 方言
  alternative: 语言；另一种语言
  rationale: 上下文描述一种在聚会中若不翻译便不能使人明白的话语。“方言”既维持本章内部的文学与神学联系，也避免武断解决它究竟是人类语言、超常话语还是更广泛现象的争议。
- issue: 说方言者与翻译者的关系
  choice: 求自己能把所说的翻译出来
  alternative: 求有人能翻译
  rationale: 希腊文以同一个单数语法主体贯穿“说”“祷告”和“翻译”，最自然地指说方言者祈求自己能够翻译。中文补出“自己”以清楚呈现这一语法关系。
- issue: 希腊文阳性单数的泛指性质
  choice: 说方言的人……自己
  alternative: 说方言的男人……他
  rationale: 希腊文的阳性单数在这里代表任何说方言的人，并非把命令限于男性。现代汉语用“人”和“自己”能保留单数指向，同时不制造原文没有的性别限制。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“应当祷告”保留命令式的劝勉力度；“翻译出来”延续本章关于使话语可理解的核心用词。主文仅设一个确有必要的词义脚注，标记已置于“方言”之后。
