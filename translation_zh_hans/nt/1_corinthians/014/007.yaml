  text: ὅμως τὰ ἄψυχα φωνὴν διδόντα, εἴτε αὐλὸς εἴτε κιθάρα, ἐὰν διαστολὴν τοῖς φθόγγοις μὴ ⸀δῷ, πῶς γνωσθήσεται τὸ αὐλούμενον ἢ τὸ κιθαριζόμενον;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/007.yaml
  text: Even lifeless things that produce sound—whether flute or harp—if they do not give a distinction in the notes[a], how will what is played on the flute or on the harp be recognized?
translation:
  language: zh_hans
  text: 即使是没有生命、能发出声音的东西，无论是笛子还是里拉琴[a]，若所发出的音调没有区别，怎能辨认出所吹奏的或所弹奏的是什么呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “里拉琴”是古代的一种弦乐器；也可译作“竖琴”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅμως
  choice: 即使
  rationale: 在论证中引入进一步的类比，并带有强调意味；“即使”自然地从说话者转到无生命的乐器。
- source_word: τὰ ἄψυχα
  choice: 没有生命……的东西
  rationale: 保留中性复数所指的无生命之物；上下文表明这里具体指乐器。
- source_word: φωνὴν διδόντα
  choice: 能发出声音
  rationale: 自然表达“给出声音”的分词含义，并修饰无生命之物。
- source_word: εἴτε αὐλὸς εἴτε κιθάρα
  choice: 无论是笛子还是里拉琴
  rationale: αὐλός指管乐器，以“笛子”便于现代读者理解；κιθάρα是古代弦乐器，“里拉琴”比现代“竖琴”更能避免乐器形制上的误解。
- source_word: ἐὰν διαστολὴν τοῖς φθόγγοις μὴ δῷ
  choice: 若发出的音调没有区别
  rationale: διαστολή表示区分或差别，φθόγγοι表示乐音、音调；此译文清楚传达各音必须彼此有别的意思。
- source_word: πῶς γνωσθήσεται
  choice: 怎能辨认
  rationale: 被动式在此表示所奏内容如何被识别；“辨认”符合音乐语境。
- source_word: τὸ αὐλούμενον ἢ τὸ κιθαριζόμενον
  choice: 笛子或里拉琴所奏的是什么
  rationale: 两个带冠词的被动分词指由相应乐器演奏的内容；中文以“所奏的是什么”自然保留这一含义。
