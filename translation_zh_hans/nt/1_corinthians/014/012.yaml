  text: οὕτως καὶ ὑμεῖς, ἐπεὶ ζηλωταί ἐστε πνευμάτων, πρὸς τὴν οἰκοδομὴν τῆς ἐκκλησίας ζητεῖτε ἵνα περισσεύητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/012.yaml
  text: So also you[a], since you are eager for spiritual gifts, seek to abound for the building up of the church.
translation:
  language: zh_hans
  text: 你们也是这样：既然热心追求属灵的恩赐[a]，就当力求多多造就教会。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文可直译为“诸灵”或“属灵的事物”；按上下文，这里可指属灵的恩赐或圣灵的彰显。
    reason: 保留πνευμάτων的字面表达及其语境歧义。
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: 你们也是这样
  rationale: 承接上文的类比和推论，简洁自然。
- source_word: ἐπεὶ ζηλωταί ἐστε
  choice: 既然热切追求
  rationale: 表达作为热心追求者的状态，并保留ἐπεὶ的因由意味。
- source_word: πνευμάτων
  choice: 属灵的恩赐
  rationale: 原文直译可作“诸灵”或“属灵之事”；结合哥林多前书12—14章所论的圣灵彰显与恩赐，正文采用较清楚的语境义，并用脚注保留原文的简约和歧义。
- source_word: πρὸς τὴν οἰκοδομὴν τῆς ἐκκλησίας
  choice: 以造就教会
  rationale: 保留οἰκοδομή的建造隐喻，同时符合现代汉语教会语境。
- source_word: ζητεῖτε ἵνα περισσεύητε
  choice: 就要努力充充足足地运用
  rationale: ζητεῖτε表示有意追求，περισσεύητε表示丰富、充足；“运用”补明汉语中所需的隐含关系，但不限定为追求个人卓越，目的仍由“造就教会”界定。
theological_decisions:
- issue: πνευμάτων的所指
  choice: 正文译作“属灵的恩赐”
  alternative: “诸灵”或“属灵之事”
  rationale: 上下文集中讨论方言、预言等属灵彰显及其对群体的益处。“属灵的恩赐”最能传达语境所指，但原文并未出现通常译作“恩赐”的χάρισμα，因此以脚注保留其字面范围。
- issue: ἵνα περισσεύητε的补足对象
  choice: 译作“充充足足地运用”，以目的短语“以造就教会”加以限定
  alternative: “力求充足有余”或“力求越发丰富”
  rationale: 希腊文没有明说在哪一方面“充足有余”。中文若完全悬空会生硬，因此作最低限度的语境补足，同时不译成“在恩赐上胜过别人”，以免引入竞争意味。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“热切追求”传达积极热心，“造就教会”保留保罗的建造隐喻。
