  text: But if anyone does not recognize this[b][a], he is not recognized.
translation:
  language: zh_hans
  text: 但若有人不承认这一点，他不被承认。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ
  choice: 若
  rationale: 引出一般条件句；“若”简洁庄重，又不额外断定条件是否属实。
- source_word: δέ
  choice: 但
  rationale: 承接上文并形成转折：有人自认为是先知或属灵的人，就应当承认保罗所写的是主的命令；反之则有相应后果。
- source_word: τις
  choice: 有人
  rationale: 保留不定代词的泛指单数意义，符合现代汉语习惯。
- source_word: ἀγνοεῖ
  choice: 不承认这一点
  rationale: ἀγνοέω可表示“不知道、不认识、不承认、忽视”。鉴于上一节使用ἐπιγινωσκέτω，要求人“承认”保罗所写的是主的命令，此处译作“不承认”最合语境；“这一点”是按上文补出的隐含宾语。
- source_word: ἀγνοεῖται
  choice: 不被承认
  rationale: 保留被动语态，并以“不承认／不被承认”的复现尽量传达原文主动式与被动式之间的修辞呼应；不明说施事者，以免把经文只限定为神或教会的行动。
theological_decisions:
- issue: 被动式ἀγνοεῖται的含义及施事者
  choice: 译作“他也不被承认”，保留对应性、被动语态和施事者未明的特点
  alternative: 译作“他也被忽视”“他是不为人所知的”，或明确译成“不被神承认／不被教会承认”
  rationale: 原文可带有对应性或审判意味，但没有明说由谁不承认此人。正文不补出“神”或“教会”，从而保留其神学张力和适用范围。
- issue: 是否把ἀγνοεῖ理解为无意的不知道或有意的不承认
  choice: 正文采用语境较合适的“不承认”，脚注保留“不知道／不理会”等可能
  alternative: 正文译作“不知道”或“不理会”
  rationale: 第37节要求读者承认保罗所写的是主的命令，因此“不承认”能自然衔接上下文；但该动词本身的语义范围较宽，不宜把其他可能完全隐去。
translation_notes:
  register: 采用现代、简洁而庄重的书面汉语。“承认”与上一节的语境相接；“这一点”补明汉语所需的宾语，所指是上文关于保罗所写内容的断言。“他也不被承认”刻意不补出施事者，并保留原文简短有力的平行结构。
