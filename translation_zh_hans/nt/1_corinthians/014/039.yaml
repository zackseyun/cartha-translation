  text: ὥστε, ἀδελφοί ⸀μου, ζηλοῦτε τὸ προφητεύειν, καὶ τὸ λαλεῖν ⸂μὴ κωλύετε γλώσσαις⸃·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/039.yaml
  text: So then[a], my brothers, be eager to prophesy, and do not forbid speaking in tongues.
translation:
  language: zh_hans
  text: 所以，我的弟兄们[a]，你们要切慕说预言，也不要禁止说方言。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我的弟兄姊妹们”；希腊文直译为“我的弟兄们”，在这里可能包括全体会众。
    reason: 说明阳性复数呼语在语境中可能具有包举性，同时保留正文对原文形式的对应。
lexical_decisions:
- source_word: ὥστε
  choice: 所以
  rationale: 这是承接上文并作出总结性推论的连词；“所以”自然、简明地保留其推论力量。
- source_word: ἀδελφοί μου
  choice: 我的弟兄们
  rationale: 保留希腊文阳性复数呼语和“我的”这一领属成分；在此语境中可能概括全体会众，故以脚注说明。
- source_word: ζηλοῦτε
  choice: 要切慕
  rationale: 现在时命令语气表达持续而热切的追求；“切慕”在现代中文圣经语体中清楚、庄重，也保留其强烈意愿。
- source_word: τὸ προφητεύειν
  choice: 说预言
  rationale: 带冠词的不定式作ζηλοῦτε的对象；“说预言”自然表达该行动，同时不额外界定其具体方式。
- source_word: μὴ κωλύετε
  choice: 不要禁止
  rationale: μή加现在时命令语气构成直接禁令；“不要禁止”准确保留教会秩序指示中的明确语气。
- source_word: τὸ λαλεῖν γλώσσαις
  choice: 说方言
  rationale: 带冠词的不定式与γλώσσαις构成本章反复讨论的表达；“说方言”是现代中文基督教语境中通行且简洁的译法。
theological_decisions:
- issue: 在男女皆有的会众语境中如何翻译呼语ἀδελφοί
  choice: 我的弟兄们
  alternative: 我的弟兄姊妹们
  rationale: 希腊文形式为阳性复数，但在此处可能以代表性用法称呼全体会众。正文保留源文形式，脚注说明其可能包含姊妹，避免在正文中消除原文的性别形式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“切慕”保留劝勉的热切程度；“说预言”和“说方言”沿用清楚且广为理解的圣经用语。
