  text: εἶτα τὸ τέλος, ὅταν ⸀παραδιδῷ τὴν βασιλείαν τῷ θεῷ καὶ πατρί, ὅταν καταργήσῃ πᾶσαν ἀρχὴν καὶ πᾶσαν ἐξουσίαν καὶ δύναμιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/024.yaml
  text: Then comes the end[a], when he hands over the kingdom to God the Father[c][b], when he abolishes every rule and every authority and power.
translation:
  language: zh_hans
  text: 随后就是终局[a]：那时，基督把国度交给父上帝[b]；那时，他废除一切统治、一切权柄和势力[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “终局”也可译作“末了”或“成全”。希腊文τέλος可指终点、目标或圆满成就。
    reason: lexical_alternative
  - marker: b
    text: “父上帝”较直译可作“上帝和父”，通常理解为“上帝，就是父”。
    reason: lexical_alternative
  - marker: c
    text: “废除”也可译作“使……失效”或“废掉”。“统治”也可理解为“掌权者”或“统治势力”。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶτα
  choice: 然后
  rationale: 承接前文复活的次序，简洁表达下一个阶段。
- source_word: τὸ τέλος
  choice: 结局
  rationale: τέλος在此可指末后的终局，也可含目标、成全之意；“结局”自然地保留其时间性和终极性。
- source_word: ὅταν παραδιδῷ
  choice: 那时，基督把……交给
  rationale: ὅταν加虚拟式指向未来发生之时；“交给”表达统治权的移交。希腊文主语承前省略，中文补出“基督”以避免歧义。
- source_word: τὴν βασιλείαν
  choice: 国
  rationale: βασιλεία既可指国度，也可指王权或统治；“国”符合交付国度的王权语境，同时不排除动态的统治含义。
- source_word: τῷ θεῷ καὶ πατρί
  choice: 父上帝
  rationale: 该短语自然可按同位关系理解，即上帝就是父；“父上帝”是清楚、庄重的现代中文表达。
- source_word: ὅταν καταργήσῃ
  choice: 那时，他废除
  rationale: καταργέω表示使失效、废止或除去；“废除”表达这些权势的作用和地位被决定性终止，而不预断其是否被本体性消灭。
- source_word: πᾶσαν ἀρχὴν
  choice: 一切统治
  rationale: 在与ἐξουσία、δύναμις并列时，ἀρχή可指统治、掌权者或统治势力；“统治”保留抽象权势层面的可能。
- source_word: πᾶσαν ἐξουσίαν
  choice: 一切权柄
  rationale: “权柄”准确表达被授予或行使的权威，并符合庄重的经文语体。
- source_word: δύναμιν
  choice: 权能
  rationale: 在权势三联语中，“权能”既与“权柄”有别，也保留力量或势力的广义。
theological_decisions:
- issue: τῷ θεῷ καὶ πατρί中“上帝”与“父”的关系
  choice: 按同位关系译为“父上帝”
  alternative: “上帝和父”或“上帝，就是父”
  rationale: 同位理解最符合保罗在此所说基督将国交给父的语境；译文不借此延伸讨论子的神性，也不加入原文未明说的教义解释。
- issue: καταργήσῃ对诸权势所表达的结果
  choice: 译为“废除”
  alternative: “使……失效”“除灭”或“化为乌有”
  rationale: “废除”保留其决定性终止作用的力度，同时避免把动词限定为彻底消灭其存在。
- issue: ἀρχή是抽象统治还是具体掌权者
  choice: 正文采用“一切统治”
  alternative: “一切掌权者”或“一切统治势力”
  rationale: 该词在此三联结构中可以指统治权或掌权势力；正文保留抽象表达，脚注提示具体化的可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。用两个“那时”保留原文重复的ὅταν结构；补出省略主语“基督”，使中文指代清楚。脚注标记均在正文出现，并依正文顺序排列。
