base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/008.yaml
  text: And last of all[a], as to one untimely born, he appeared also to me.
translation:
  language: zh_hans
  text: 最后，他也向我显现，仿佛是向一个流产的胎儿显现一样。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “流产的胎儿”也可译作“流产物”或“被堕掉的胎儿”。保罗在这里使用了一个尖锐的自我贬抑比喻。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσχατον δὲ πάντων
  choice: 最后
  rationale: ἔσχατον作副词用，πάντων表明是在前述所有显现之后；现代汉语用“最后”已能自然表达“在所有人之后”的次序，避免生硬的“所有人中最后”。δέ在此承接叙述，不必另译。
- source_word: ὡσπερεὶ
  choice: 仿佛
  rationale: 表达近似性的比较语气，既保留比喻，又不把它改写成明确的身份判断。
- source_word: τῷ ἐκτρώματι
  choice: 一个未到产期就出生的人
  rationale: ἔκτρωμα本义可指流产或夭折的胎儿，是强烈而自抑的比喻。正文采用现代汉语中较易理解的表达，保留其出生异常、时机不合的意味；更直译且更尖锐的说法收入脚注。
- source_word: ὤφθη
  choice: 他……显现了
  rationale: 该被动形式在复活显现的语境中自然译作“显现”，清楚传达基督被人看见的显现事件。根据上下文补出主语“他”，但不在本节内另行指明。
- source_word: κἀμοί
  choice: 也向我
  rationale: κἀμοί是καί与ἐμοί的缩合，保留“也”的递加意义，并用“向我显现”符合现代汉语搭配。
theological_decisions:
- issue: 保罗用ἐκτρώματι自称的具体含义
  choice: 正文译作“一个未到产期就出生的人”，脚注保留更直译的尖锐含义
  alternative: “流产的胎儿”“夭折的胎儿”“异常出生的人”
  rationale: 原文并未解释这一比喻具体对应保罗经历的哪一方面。译文保留出生异常和自我贬抑的张力，不把它限定为某种关于使徒身份、归信时间或属灵资格的教义解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“未到产期就出生的人”比“未按时出生的人”更贴近出生语境，又比正文直接使用“流产的胎儿”更易读；脚注保留原词的强烈程度。
