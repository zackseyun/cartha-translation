source:
  edition: SBLGNT
  text: εἰ κατὰ ἄνθρωπον ἐθηριομάχησα ἐν Ἐφέσῳ, τί μοι τὸ ὄφελος; εἰ νεκροὶ οὐκ ἐγείρονται, Φάγωμεν καὶ πίωμεν, αὔριον γὰρ ἀποθνῄσκομεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/032.yaml
  text: If[a], speaking in merely human terms, I fought with wild beasts in Ephesus, what does it profit me? If the dead are not raised[b], “Let us eat and drink[c], for tomorrow we die.”
translation:
  language: zh_hans
  text: 如果[a]从人的角度说，我在以弗所同野兽搏斗[b]，这对我有什么益处呢？如果死人不会被复活，“我们吃喝吧[c]，因为明天我们就要死了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “从人的角度说”也可译作“按人的方式说”。这个短语可能说明保罗说话的方式，也可能说明他看待这件事的角度。
    reason: lexical_alternative
  - marker: b
    text: “同野兽搏斗”既可能按字面理解，也可能比喻同凶暴的人争战；正文保留希腊语本身的意象。
    reason: alternative_reading
  - marker: c
    text: 引自或暗指《以赛亚书》22:13。
    reason: cross_reference
lexical_decisions:
- source_word: κατὰ ἄνθρωπον
  choice: 照人的说法
  rationale: 用自然的现代汉语表达“按人的方式／从人的层面而言”，并以脚注保留该短语究竟修饰保罗的说话方式还是所述事情之视角的歧义。
- source_word: ἐθηριομάχησα
  choice: 同野兽搏斗
  rationale: 保留希腊语鲜明的字面意象，不在正文中断定这是实际与野兽搏斗，还是比喻遭遇凶暴的人。
- source_word: ἐν Ἐφέσῳ
  choice: 在以弗所
  rationale: 采用现代中文圣经传统中通行的地名译法。
- source_word: τί μοι τὸ ὄφελος
  choice: 这对我有什么益处呢？
  rationale: 自然传达反问语气和ὄφελος所指的益处。
- source_word: νεκροὶ οὐκ ἐγείρονται
  choice: 死人不会被复活
  rationale: “死人”自然表达名词化形容词νεκροί；“被复活”保留ἐγείρονται的被动形式，而“不会”适合表达假设中的否定。
- source_word: Φάγωμεν καὶ πίωμεν
  choice: 我们就吃吃喝喝吧
  rationale: “吧”传达劝勉虚拟语气，“吃吃喝喝”是自然、凝练的现代汉语表达；“就”衔接前面的假设及其推论。
- source_word: αὔριον γὰρ ἀποθνῄσκομεν
  choice: 因为明天我们就要死了
  rationale: 以自然汉语表达现在时形式所具有的将来指向，并保留γάρ的理由关系。
theological_decisions:
- issue: ἐθηριομάχησα是指实际与野兽搏斗，还是比喻遭遇凶暴的人
  choice: 正文保留“同野兽搏斗”的希腊语意象，不裁定其为字面或比喻。
  alternative: 直接译为“同凶暴的对手争战”，将其解释为人的敌对。
  rationale: 本节论证并不要求译者解决这一历史问题；保留原文意象可避免把一种解释写入正文。
- issue: ἐγείρονται的被动语态
  choice: 译作“不会被复活”。
  alternative: 译作“不会复活”或“不能复活”。
  rationale: “被复活”较明确地保留希腊语被动形式，同时不在正文中增添施动者；这也避免把句意改成死人自身能力上的“不能”。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“益处”保留论证语气而不过分书面；“吃吃喝喝吧”使引语口吻清楚，并与全句的严肃警告形成原文所有的张力。
