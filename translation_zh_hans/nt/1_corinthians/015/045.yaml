base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/045.yaml
  text: 'So also it is written: “The first man[a], Adam, became a living being”[b]; the last Adam became a life-giving spirit.'
translation:
  language: zh_hans
  text: 正如经上所记：“第一个人，亚当，成了有生命的人[a]”；末后的亚当成了赐生命的灵[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“活的魂”，呼应《创世记》2:7的传统译法。
    reason: lexical_alternative
  - marker: b
    text: 或译：“赐人生命的灵”。这里是在对比末后的亚当与第一个亚当；希腊原文着重描述其性质，未必是在明确地把基督等同于圣灵这一独特位格。
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ γέγραπται
  choice: 经上也这样记着
  rationale: 保留οὕτως καὶ与上文论证的承接关系；“经上……记着”是自然、庄重的经文引述用语。
- source_word: Ἐγένετο
  choice: 成了
  rationale: 表达γίνομαι所指的形成或进入某种状态，也与后半句的平行结构相称。
- source_word: ὁ πρῶτος ἄνθρωπος
  choice: 第一个人
  rationale: ἄνθρωπος在此指作为人类代表的亚当；“人”既准确又不削弱与“末后的亚当”之间的预表性对照。
- source_word: Ἀδὰμ
  choice: 亚当
  rationale: 采用现代中文圣经及一般读者熟悉的标准人名译法。
- source_word: εἰς ψυχὴν ζῶσαν
  choice: 有生命的人
  rationale: 此语呼应《创世记》2:7，着重亚当成为活着的人，而不是明确区分物质身体与非物质灵魂；这一译法在现代汉语中清楚自然。
- source_word: ὁ ἔσχατος Ἀδὰμ
  choice: 末后的亚当
  rationale: “末后的”保留ἔσχατος在亚当—基督对照中的终末性和预表性，也是庄重而熟悉的中文表达。
- source_word: εἰς πνεῦμα ζῳοποιοῦν
  choice: 赐生命的灵
  rationale: πνεῦμα在此无冠词，表达性质；ζῳοποιοῦν意为使人活、赐生命。“赐生命的灵”简洁地保留原文表达，不额外作教义性解释。
theological_decisions:
- issue: 创世记引文中ψυχή的人论含义
  choice: 译作“有生命的人”
  alternative: “活的魂”或“有灵的活人”
  rationale: 上下文所指是亚当成为有生命的人，并不着重把“魂”描述为可与身体分离的部分。正文采用现代读者易懂且不过度限定人论的表达，传统直译则列入脚注。
- issue: “末后的亚当成了赐生命的灵”的含义
  choice: 保留性质性的“赐生命的灵”
  alternative: “成了赐生命的圣灵”或“成了赐人生命的灵”
  rationale: 原文πνεῦμα无冠词，宜保留性质性的表述，不在译文中把基督直接等同于作为独特位格的圣灵，也不消解亚当与末后亚当之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。正文保持两半句的平行对照，以分号连接；不用“圣灵”替代原文无冠词的πνεῦμα，从而保留原文的神学张力。
