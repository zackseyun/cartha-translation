  text: and that he appeared to Cephas[c][b][a], then to the twelve.
translation:
  language: zh_hans
  text: 并且他向矶法显现了[a][b]，然后向十二人显现[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他被矶法看见了。”希腊语动词在形式上是被动语态，但在复活显现的语境中通常译作“显现”。
    reason: lexical_alternative
  - marker: b
    text: “矶法”是与“彼得”相对应的亚兰语名字。
    reason: cross_reference
  - marker: c
    text: “十二人”是耶稣的使徒群体的固定称号，尽管这个群体并非在每个时期都正好有十二个人。
    reason: cultural_note
lexical_decisions:
- source_word: ὤφθη
  choice: 向……显现了
  rationale: 这是 ὁράω 的不定过去时被动形式；在复活显现的语境中，译作“向……显现”符合希腊语惯用法，也比字面上的“被……看见”更自然，同时不进一步说明显现的方式。
- source_word: Κηφᾷ
  choice: 向矶法
  rationale: Κηφᾶς 的与格形式在此标明显现的对象。保留“矶法”这一名字，不直接改为较熟悉的“彼得”；介词“向”自然表达与格关系。
- source_word: εἶτα
  choice: 然后
  rationale: 简明表达先后次序，保留保罗所引传统中的见证顺序。
- source_word: τοῖς δώδεκα
  choice: 向十二人
  rationale: 保留原文“十二”这一固定群体称号，不改成“十一人”，也不在正文中增添原文没有的“使徒”。中文加“人”可使表达自然清楚。
- source_word: καὶ ὅτι
  choice: 并且
  rationale: 承接前文连续的内容分句。中文用“并且”既保留连接关系，又避免生硬地逐字译出“并且……这件事”。
theological_decisions:
- issue: 复活显现的表述
  choice: 他向……显现了
  alternative: 他被……看见了
  rationale: “显现”忠实传达复活后的可见呈现，同时不界定显现的具体性质。脚注保留原文形式上被动的另一种译法。
- issue: 犹大不在时仍称“十二”
  choice: 十二人
  alternative: 十一人；使徒们
  rationale: 原文使用固定称号“十二”，应保留其张力，不根据其他经文作历史性协调，也不以解释性称谓取代原文。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“显现”保留经文的神学分量而不过度解释；“十二人”比“十二使徒”更贴近原文，同时借脚注说明其固定称号性质。所有脚注标记均放在所解释的词语之后。
