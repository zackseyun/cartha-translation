id: 1CO.15.58
reference: 1 Corinthians 15:58
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ὥστε, ἀδελφοί μου ἀγαπητοί, ἑδραῖοι γίνεσθε, ἀμετακίνητοι, περισσεύοντες ἐν τῷ ἔργῳ τοῦ κυρίου πάντοτε, εἰδότες ὅτι ὁ κόπος ὑμῶν οὐκ ἔστιν κενὸς ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/058.yaml
  text: Therefore[a], my beloved brothers, become steadfast, immovable, always abounding in the work of the Lord, knowing that your labor in the Lord is not in vain.
translation:
  language: zh_hans
  text: 所以，我亲爱的弟兄们[a]，你们要坚定，不可动摇，常常多做主的工作，因为知道你们在主里的劳苦不是徒然的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄们”所译的希腊语可以集合性地指同信的人；按本处语境，也包括女性信徒。
    reason: 说明原文阳性复数在教会称呼中的包容性用法，防止把受众误解为仅限男性。
lexical_decisions:
- source_word: Ὥστε
  choice: 所以
  rationale: 承接前文关于复活的论证并引出劝勉，保留推论关系，同时符合现代汉语表达。
- source_word: ἀδελφοί μου ἀγαπητοί
  choice: 我亲爱的弟兄们
  rationale: “弟兄们”对应阳性复数 ἀδελφοί；本处称呼全教会，可能包含女性信徒，因此以脚注说明其集合性用法。“亲爱的”自然传达 ἀγαπητοί。
- source_word: ἑδραῖοι γίνεσθε
  choice: 你们要坚定
  rationale: γίνεσθε 是命令语气，要求进入并持守坚定的状态；汉语用“要坚定”比生硬的“要成为坚定的”更自然，也保留劝勉力度。
- source_word: ἀμετακίνητοι
  choice: 不可动摇
  rationale: 表达不被移离既定立场，与“坚定”并列而加强语气。
- source_word: περισσεύοντες…πάντοτε
  choice: 常常多做
  rationale: περισσεύοντες 表示持续而充充足足地投入；“常常多做”以自然汉语保留持续性和丰盛程度，不把含义缩窄为单纯的卓越表现。
- source_word: ἐν τῷ ἔργῳ τοῦ κυρίου
  choice: 主的工作
  rationale: 保留所有格关系及 ἔργον 的宽泛含义，不限于某一种教会职分或事工。
- source_word: εἰδότες
  choice: 因为知道
  rationale: 该分词在劝勉中自然带有依据或原因意味；此译法使汉语衔接清楚，但不增加所知道内容之外的解释。
- source_word: ὁ κόπος ὑμῶν
  choice: 你们的劳苦
  rationale: “劳苦”体现 κόπος 所含费力乃至疲惫的意味，比一般的“工作”更有分量。
- source_word: οὐκ ἔστιν κενὸς
  choice: 不是徒然的
  rationale: 在此语境中，κενός 指没有成果、意义或效用；“不是徒然的”是自然且庄重的汉语对应。
- source_word: ἐν κυρίῳ
  choice: 在主里
  rationale: 保留保罗书信中这一短语的广阔神学含义，不擅自限定为“靠着主”“为主”或“由于主”。
theological_decisions:
- issue: ἀδελφοί 的性别指向
  choice: 正文译作“弟兄们”，并用脚注说明在本语境中可集合性地包括女性信徒。
  alternative: 弟兄姊妹们
  rationale: 原词在语法上是阳性复数，但书信对象是全教会；正文保留形式特征，脚注则避免读者误以为保罗只称呼男性。
- issue: 句末 ἐν κυρίῳ 的归属和含义
  choice: 译作“你们在主里的劳苦不是徒然的”，使“在主里”修饰信徒的劳苦。
  alternative: 你们的劳苦因主而不是徒然的
  rationale: 该短语最自然地界定劳苦是在与主的关系中进行的；保留“在主里”也避免把关系单一解释为原因。
- issue: κύριος 的译法
  choice: 主
  alternative: 主人
  rationale: “主”在此最恰当地保留基督论称谓及其庄重语体；“主人”会不必要地偏向社会身份或主仆关系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“坚定，不可动摇”保留原文两个并列形容词的递进力度；“常常多做主的工作”避免过度教会术语化，同时保持持续且丰盛投入的意思。
