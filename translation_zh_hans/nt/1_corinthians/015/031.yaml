revisions:
- from: 我天天都死——我指着我在我们的主弥赛亚耶稣里因你们所有的夸耀起誓[a][b][c]。
  to: 我天天死——我指着我在弥赛亚耶稣、我们的主里因你们而有的夸耀起誓[a][b][c]。
  rationale: 修订消除了“所有的”造成的歧义，明确夸耀是保罗“因你们而有”的，同时不将有争议的ὑμετέραν结构绝对化；脚注保留“你们的夸耀”的替代可能。重排“弥赛亚耶稣、我们的主”使汉语同位结构清楚，并保留原文的称号、联合性表达和郑重誓言语气。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T03:51:35Z'
review_pass:
  verdict: revise
  source_fidelity: 正文把τὴν ὑμετέραν καύχησιν译为“因你们所有的夸耀”，其中“所有的”会被理解为“all [of] you”，既非原文所指，也使“夸耀”的所属／对象关系不清。应明确为“因你们而有的夸耀”或“以你们为夸耀”。此外，“我们的主弥赛亚耶稣”在现代汉语中不如“弥赛亚耶稣、我们的主”自然，也较不清楚地呈现同位语关系。
  naturalness: “我天天都死”可懂，但“我天天死”更简洁有力，适合保留原文突兀的修辞。修订后的“我指着我在弥赛亚耶稣、我们的主里因你们而有的夸耀起誓”在庄重的现代标准汉语中自然，并保留誓言式结构。
  terminology: “弥赛亚耶稣”正确保留Χριστός的称号意义；“主”对应κύριος；“在……里”保留ἐν的表达。“夸耀”可保留καύχησις的保罗书信用语联系。
