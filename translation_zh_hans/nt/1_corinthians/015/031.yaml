  text: καθ’ ἡμέραν ἀποθνῄσκω, νὴ τὴν ὑμετέραν ⸀καύχησιν, ἣν ἔχω ἐν Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/031.yaml
  text: I die every day—by the boasting in you that I have in Messiah Jesus our Lord[a][b][c].
translation:
  language: zh_hans
  text: 我天天死——我指着我在弥赛亚耶稣、我们的主里因你们而有的夸耀起誓[a][b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或更直译：“我每日死。”
    reason: lexical_alternative
  - marker: b
    text: 也可译为：“我凭着我以你们为夸耀的事起誓”，或“我指着你们的夸耀起誓”。原文带有誓言式语气，而“夸耀”与“你们”的句法关系存在争议。
    reason: alternative_reading
  - marker: c
    text: 传统译法：“基督耶稣”。
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: 天天都
  rationale: 这是表示反复发生的惯用短语，意为“每天、每日”；“天天都”符合现代汉语表达，并保留逐日反复的强调。
- source_word: ἀποθνῄσκω
  choice: 我……死
  rationale: 保留现在时直陈语气的鲜明修辞，不把它解释性改写成“我天天面对死亡”。
- source_word: νὴ
  choice: 我指着……起誓
  rationale: νὴ用于郑重断言或誓言式表达；汉语用“指着……起誓”比单独译成“凭着”更自然地传达其功能。
- source_word: τὴν ὑμετέραν καύχησιν
  choice: 我……因你们所有的夸耀
  rationale: 结合后面的关系从句ἣν ἔχω，主文理解为保罗因哥林多人而有的夸耀；“夸耀”保留καύχησις在保罗书信中的词汇联系，同时用脚注保留“你们的夸耀”等句法可能。
- source_word: ἣν ἔχω
  choice: 我……所有的
  rationale: 将关系从句自然嵌入汉语定语结构，表达“我所拥有的”。
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: 在……弥赛亚耶稣里
  rationale: 保留ἐν的重要联合性表达；Χριστός按其称号意义译为“弥赛亚”，Ἰησοῦ译为“耶稣”。
- source_word: τῷ κυρίῳ ἡμῶν
  choice: 我们的主
  rationale: 按常用而庄重的汉语译出κύριος及第一人称复数所属关系。
theological_decisions:
- issue: Χριστός在此译作称号还是沿用传统名称式译法
  choice: 弥赛亚耶稣
  alternative: 基督耶稣
  rationale: Χριστός在保罗用语中仍有称号意义，因此正文译出“弥赛亚”；传统译法列入脚注，不抹去两种表达传统。
- issue: τὴν ὑμετέραν καύχησιν的所属关系
  choice: 保罗因哥林多人而有的夸耀
  alternative: 哥林多人自己的夸耀；或“以你们为夸耀”
  rationale: 关系从句“这是我所有的”较支持夸耀属于保罗、对象或缘由是哥林多人；但ὑμετέραν的结构确有争议，故在脚注中明确保留其他读法。
- issue: “我天天死”的性质
  choice: 保留鲜明的字面修辞
  alternative: 我天天面对死亡
  rationale: 上下文可能指持续面临死亡，但原文直接使用“死”，不宜在正文中提前消解其修辞张力。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“我天天都死”刻意保留原文突兀有力的修辞；破折号标出随后誓言式断言。“因你们所有的夸耀”在汉语中表达保罗因读者而夸耀，同时以脚注保留原文句法歧义。
