  text: ἐγὼ γάρ εἰμι ὁ ἐλάχιστος τῶν ἀποστόλων, ὃς οὐκ εἰμὶ ἱκανὸς καλεῖσθαι ἀπόστολος, διότι ἐδίωξα τὴν ἐκκλησίαν τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/009.yaml
  text: For I am the least of the apostles[a], who am not worthy to be called an apostle, because I persecuted the church of God.
translation:
  language: zh_hans
  text: 因为我是使徒中最小的，不配称为使徒，因为我曾迫害上帝的教会。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γάρ
  choice: 因为
  rationale: 承接上一节并说明保罗为何如此自述；现代汉语以“因为”自然表达这一解释关系。
- source_word: ἐλάχιστος
  choice: 最微小的
  rationale: 这里指保罗自认在使徒群体中的地位最低，并非身体最小；“最微小的”既自然，也保留其自谦语气。
- source_word: ἀπόστολος / ἀποστόλων
  choice: 使徒
  rationale: 此处指受认可的使徒身份和群体，而非一般意义上的使者。
- source_word: ἱκανός
  choice: 配
  rationale: ἱκανός可表示足够、合格或堪当；结合保罗因曾迫害教会而自谦的语境，“不配”最自然，同时不否认其实际使徒身份。
- source_word: καλεῖσθαι
  choice: 称为
  rationale: 直接而自然地表达被动不定式“被称作”。
- source_word: διότι
  choice: 因为
  rationale: 明确引出保罗认为自己不配称为使徒的原因。
- source_word: ἐδίωξα
  choice: 我曾迫害
  rationale: 此处明确指保罗过去敌对并压迫信徒的行为；“曾”体现希腊语不定过去时在语境中的既往事件。
- source_word: ἐκκλησίαν τοῦ θεοῦ
  choice: 上帝的教会
  rationale: “教会”在保罗书信中指属上帝的信徒群体；所有格译法自然，并保留其归属于上帝的含义。
- source_word: ὃς
  choice: 省略显式关系代词
  rationale: 希腊语关系从句直译为“我是不配……”在现代汉语中生硬；并入主句为“不配称为使徒”，仍清楚以保罗为主语并完整保留语义。
theological_decisions:
- issue: 保罗关于自己使徒身份的陈述
  choice: 保罗承认自己确属使徒，同时因曾迫害教会而自认不配承担这一称号。
  alternative: 将本句理解为保罗完全否认自己的使徒身份，或仅表示社会地位较低。
  rationale: “我是使徒中最微小的”把保罗包括在使徒之内，而“不配称为使徒”表达其基于往事的谦卑。译文保留二者之间的张力，不将其中任何一面消解。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“最微小的”比“最小的”更能避免身体大小的误解；“不配称为”简洁地呈现保罗的自谦。原文两次使用因果连接词，译文相应保留两个“因为”，以维持论证结构。
