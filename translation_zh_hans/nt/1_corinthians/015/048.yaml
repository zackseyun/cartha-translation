  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οἷος ὁ χοϊκός, τοιοῦτοι καὶ οἱ χοϊκοί, καὶ οἷος ὁ ἐπουράνιος, τοιοῦτοι καὶ οἱ ἐπουράνιοι·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/048.yaml
  text: As is the man of dust[a], so also are those of dust; and as is the heavenly man, so also are those who are heavenly.
translation:
  language: zh_hans
  text: 那属尘土的人怎样，属尘土的人也都怎样；那属天的人怎样，属天的人也都怎样。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἷος ... τοιοῦτοι
  choice: ……怎样，……也都怎样
  rationale: 以自然的现代汉语再现相关结构所表达的对应关系，并保留两句严整的平行。
- source_word: χοϊκός
  choice: 属尘土的
  rationale: 保留与亚当出于尘土有关的《创世记》背景，也表达由尘土而来、具有尘土性质的含义；比“属地的”更能维持原文的尘土意象。
- source_word: ὁ χοϊκός
  choice: 那属尘土的人
  rationale: 定冠词加单数形容词在上下文中指作为代表人物的亚当；补出“人”使汉语自然，同时不在本节直接加入“亚当”这一解释性名称。
- source_word: οἱ χοϊκοί
  choice: 属尘土的人
  rationale: 指与那属尘土者相对应的一群人；以“人”明确其人类所指，并重复“属尘土”以保存词汇联系。
- source_word: ἐπουράνιος
  choice: 属天的
  rationale: 表达属于天、具有天上性质的含义，并与“属尘土的”构成简洁平衡的对照；没有改写成上一节的“从天而来”。
- source_word: ὁ ἐπουράνιος
  choice: 那属天的人
  rationale: 上下文指与亚当相对的基督；补出“人”维持两个代表人物的对照，但不把“基督”直接写入本节。
- source_word: οἱ ἐπουράνιοι
  choice: 属天的人
  rationale: 上下文谈论与属天者相对应的人类，而非天使；这一译法保留形容词性质，也避免过度说明其实现的时间或方式。
theological_decisions:
- issue: 是否在两个单数名词化形容词后补出“人”，以明确亚当与基督的代表性对照
  choice: 译作“那属尘土的人”和“那属天的人”
  alternative: 译作“那属尘土的”和“那属天的”
  rationale: 上下文（林前15:45–49）清楚呈现两个代表人物的对照。补出“人”符合汉语表达，也没有超出上下文明确所指。
- issue: οἱ ἐπουράνιοι 是指天上生灵，还是与属天者相对应的人
  choice: 译作“属天的人”
  alternative: 译作“属天的”或“天上的众生”
  rationale: 本段主题是人的复活以及人承受相应的形象，因此这里指属天者所代表的人，而不是天使；译文仍保留“属天”的概括性，未额外规定这种状态的全部内涵。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。两分句保持相同句式，以再现原文的修辞平行；“属尘土／属天”保留保罗的性质与归属对照。
