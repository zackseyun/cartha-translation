  text: δεῖ γὰρ τὸ φθαρτὸν τοῦτο ἐνδύσασθαι ἀφθαρσίαν καὶ τὸ θνητὸν τοῦτο ἐνδύσασθαι ἀθανασίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/053.yaml
  text: For this perishable body must put on imperishability[a], and this mortal body must put on immortality.
translation:
  language: zh_hans
  text: 因为这必朽坏的身体必须穿上不朽坏[a]，这必死的身体也必须穿上不死。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较形式地译作：“这必朽坏的必须穿上不朽坏，这必死的必须穿上不死。”本节希腊原文没有明说“身体”，但上下文清楚表明所指的是身体。
    reason: 说明正文依据上下文补出的词，并保留原文较含蓄的表达。
lexical_decisions:
- source_word: δεῖ
  choice: 必须
  rationale: 表达复活转变的必要性，语气明确自然。
- source_word: γὰρ
  choice: 因为
  rationale: 保留本节对上文的解释关系，符合现代汉语表达。
- source_word: τὸ φθαρτὸν τοῦτο
  choice: 这必朽坏的身体
  rationale: φθαρτός指会腐朽、败坏；根据上下文补出“身体”，使所指清楚，同时以脚注说明原文没有“身体”一词。
- source_word: ἐνδύσασθαι
  choice: 穿上
  rationale: 保留原文穿衣的比喻，也符合汉语圣经语境中的自然表达。
- source_word: ἀφθαρσίαν
  choice: 不朽坏
  rationale: 与“必朽坏”形成清楚而紧密的词义对照，并表达不再遭受腐朽败坏的状态。
- source_word: καὶ
  choice: 也
  rationale: 连接两个平行分句；汉语用“也”能自然凸显对应关系。
- source_word: τὸ θνητὸν τοῦτο
  choice: 这必死的身体
  rationale: θνητός指会死、受死亡辖制；依上下文补出“身体”，并保持两分句平行。
- source_word: ἀθανασίαν
  choice: 不死
  rationale: 准确表达不再受死亡支配的状态，并与“必死”形成直接对照。
theological_decisions:
- issue: 本节原文没有出现“身体”（σῶμα），是否在正文补出
  choice: 在两个分句中译作“这必朽坏的身体”和“这必死的身体”
  alternative: 较形式地译作“这必朽坏的必须穿上不朽坏，这必死的必须穿上不死”
  rationale: 哥林多前书15章42—54节的近距离上下文明确讨论身体的复活与改变。补出“身体”可使现代汉语自然清楚，却不增加新的教义断言；脚注同时保存原文形式上的含蓄。
- issue: ἐνδύσασθαι的衣着意象是否保留
  choice: 译作“穿上”
  alternative: 译作“变成”或“成为”
  rationale: “穿上”保留保罗原有的比喻，也避免把转变的具体性质解释得超过原文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“必朽坏／不朽坏”和“必死／不死”保持原文两组鲜明对照；“穿上”保留衣着隐喻。
