  text: Why are we also in danger every hour?[a]
translation:
  language: zh_hans
  text: 我们又为什么每时每刻都处于危险中呢？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“我们又是什么缘故每时每刻都处于危险中呢？”原文的“什么”在这里表达“为什么”的意思。
    reason: 保留τί的字面可能性，并说明其在此反问句中表达理由；“处于危险中”和“每时每刻”分别对应κινδυνεύομεν和πᾶσαν ὥραν。
lexical_decisions:
- source_word: τί
  choice: 为什么
  rationale: τί在这个反问句中询问如此行事的理由或意义；结合复活论证的上下文，译作“为什么”最自然，同时保留保罗的论辩力度。
- source_word: καὶ
  choice: 又
  rationale: καὶ把保罗及其同工所遭遇的危险加入前文所举的例子；“又”在现代汉语反问句中自然表达这种递加关系。
- source_word: ἡμεῖς
  choice: 我们
  rationale: 保留原文明确出现的第一人称复数代词；其具体范围仍由上下文判断，不额外限定为某一群体。
- source_word: κινδυνεύομεν
  choice: 冒险
  rationale: κινδυνεύω表示处于危险或面对风险。“冒险”简洁自然，且没有像“冒生命危险”那样把危险的程度进一步具体化。
- source_word: πᾶσαν ὥραν
  choice: 时刻
  rationale: 该宾格时间短语表示持续、反复地面临危险。“时刻”既自然凝练，也保留原文“每一时刻”的强烈持续意味。
theological_decisions:
- issue: 本节在复活论证中的反问作用
  choice: 译为询问理由的反问：“我们又为什么……呢？”
  alternative: 较直译为“我们又是什么缘故时刻冒险呢？”或按字面保留“什么”
  rationale: 希腊文τί本可按字面理解为“什么”，但在此句及紧邻上下文中承担“为什么”的功能。译文呈现其反问力度，指出若死人不复活，使徒持续面对危险便显得没有道理，同时不增添原文未明说的教义结论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“时刻冒险”简洁有力；句末“呢”清楚传达反问语气。脚注标记已在正文中对应出现。
