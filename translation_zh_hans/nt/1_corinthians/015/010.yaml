  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: χάριτι δὲ θεοῦ εἰμι ὅ εἰμι, καὶ ἡ χάρις αὐτοῦ ἡ εἰς ἐμὲ οὐ κενὴ ἐγενήθη, ἀλλὰ περισσότερον αὐτῶν πάντων ἐκοπίασα, οὐκ ἐγὼ δὲ ἀλλὰ ἡ χάρις τοῦ θεοῦ ⸀ἡ σὺν ἐμοί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/010.yaml
  text: But by the grace of God I am what I am[a], and his grace toward me did not prove empty. On the contrary, I labored more than all of them—yet not I, but the grace of God that was with me.
translation:
  language: zh_hans
  text: 然而，我之所以成为今日的我，是靠着神的恩典；他向我所施的恩典并没有落空[a]。相反，我比他们众人劳苦得更多；但不是我，而是与我同在的神的恩典。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“并没有变成空的”，或“并非徒然”。
    reason: 词义选择：κενός 可表达空无、没有结果或徒然。
lexical_decisions:
- source_word: χάριτι δὲ θεοῦ
  choice: 然而，靠着神的恩典
  rationale: 将 χάριτι 按工具性与凭借义译为“靠着”，保留“恩典”这一保罗书信的核心用语；“然而”体现 δέ 与上文的轻微转折。
- source_word: εἰμι ὅ εἰμι
  choice: 我才成了现在的我
  rationale: 用现代汉语自然表达重复结构所指的现今身份与处境；“才”承接前面的恩典，突出这一切出于神的恩典，而不增添具体身份解释。
- source_word: ἡ χάρις αὐτοῦ ἡ εἰς ἐμὲ
  choice: 他向我所施的恩典
  rationale: “向我”保留 εἰς 的指向性，“所施的”使限定关系符合自然汉语。
- source_word: οὐ κενὴ ἐγενήθη
  choice: 并没有落空
  rationale: “落空”既保留 κενός 的空无意象，也表达这恩典并非徒然、没有成效；相关词义空间在脚注中保留。
- source_word: ἀλλὰ περισσότερον αὐτῶν πάντων ἐκοπίασα
  choice: 相反，我比他们众人劳苦得更多
  rationale: “劳苦”体现 κοπιάω 所含的辛劳与竭力；“比他们众人……更多”忠实表达比较结构，ἀλλά 译作“相反”以加强对照。
- source_word: οὐκ ἐγὼ δὲ ἀλλὰ ἡ χάρις τοῦ θεοῦ ἡ σὺν ἐμοί
  choice: 但这不是我，而是与我同在的神的恩典
  rationale: 紧贴原文突转的对举结构，同时保留 σύν 所表达的“与我同在”；不把保罗的劳苦与神恩典的工作改写成后设的系统表述。
theological_decisions:
- issue: 保罗的劳苦与神恩典之间的关系
  choice: 同时直陈保罗确实劳苦，以及这劳苦归因于与他同在的神的恩典。
  alternative: 将两者解释为明确的对等合作，或以神的单一作为弱化保罗真实的劳苦。
  rationale: 希腊文本一面说“我……劳苦得更多”，一面又说“不是我，而是……神的恩典”。译文保留这种张力，不用后来的神学体系替文本作出消解。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“我才成了现在的我”避免生硬直译，同时保留原文关于现今身份的概括性；分号与转折词帮助读者看清恩典、劳苦和归因之间的层次。脚注标记置于其实际说明的“没有落空”之后。
