  text: Then he appeared to James[a], then to all the apostles.
translation:
  language: zh_hans
  text: 后来，他向雅各显现[a]，接着又向所有使徒显现。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或更直译：“后来，雅各看见了他，接着所有使徒也看见了他。”希腊原文采用被动形式，直译为“他被雅各看见……被所有使徒看见”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπειτα
  choice: 后来
  rationale: 表示复活显现次序中的下一件事；“后来”自然地传达时间上的先后。
- source_word: ὤφθη
  choice: 他向……显现
  rationale: ὁράω 的不定过去时被动形式在复活叙事中惯用于表示某人显现；中文译为“向……显现”比直译“被……看见”更自然，同时保留显现事件的含义。
- source_word: Ἰακώβῳ
  choice: 向雅各
  rationale: 与 ὤφθη 连用的与格，指出显现的对象；“雅各”是该人名在中文圣经传统中的通行译名。
- source_word: εἶτα
  choice: 接着又
  rationale: 再次标明顺序；“接着”呈现逐项列举，“又”自然承接重复的显现动作。
- source_word: ἀποστόλοις
  choice: 使徒
  rationale: 此处指受差遣并为复活作见证的人，采用已确立的术语“使徒”，不泛化为普通“使者”。
- source_word: πᾶσιν
  choice: 所有
  rationale: 修饰“使徒”，强调全体；“所有使徒”直接保留原文范围，同时不界定该群体具体包括哪些人。
theological_decisions:
- issue: “所有使徒”的身份和范围，以及他们与雅各的关系
  choice: 直接译为“所有使徒”，并保留雅各与随后这一群体在叙述上的区分。
  alternative: 将其具体解释为“十二使徒”，或解释为十二使徒以外更广泛的一群受差遣见证人。
  rationale: 希腊文本没有界定这群人的确切成员。译文不应加入调和性解释，而应保留保罗原有的措辞和其中可能存在的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“后来……接着又……”清楚呈现顺序；第二处补出“显现”，使中文句子完整自然。脚注保留 ὤφθη 的字面被动表达。
