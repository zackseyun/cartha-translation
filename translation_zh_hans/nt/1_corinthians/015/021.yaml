  text: ἐπειδὴ γὰρ δι’ ἀνθρώπου ⸀θάνατος, καὶ δι’ ἀνθρώπου ἀνάστασις νεκρῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/021.yaml
  text: For since death came through a man[b][a], the resurrection of the dead also came through a man.
translation:
  language: zh_hans
  text: 既然死亡是借着一个人而来，死人复活也借着一个人而来。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 两处“借着一个人”也可译作“由一个人”；希腊语介词既可表达媒介，也可表达施事者。
    reason: lexical_alternative
  - marker: b
    text: 按本章上下文，这两个人分别是亚当和基督（参15:22、45）。
    reason: cross_reference
lexical_decisions:
- source_word: ἐπειδὴ γὰρ
  choice: 因为……既……
  rationale: ἐπειδή与γάρ共同说明本句是对上文的解释和论证根据；“因为”表达解释关系，“既”引出已确立的前提，符合现代汉语表达。
- source_word: δι’ ἀνθρώπου
  choice: 借着一个人
  rationale: διά加属格可表达媒介或施事；“借着”保留这种语义弹性，“一个人”则保留原文无冠词的单数形式及两个人物之间的平行。
- source_word: θάνατος
  choice: 死亡……而来
  rationale: 原文为无动词结构；汉语补出“而来”，自然地表达死亡经由一个人进入人类处境，同时与后半句保持对称。
- source_word: καὶ
  choice: 也同样
  rationale: 这里的καί标明与前一分句相对应的第二项；“也同样”清楚呈现保罗刻意构成的平行关系。
- source_word: ἀνάστασις νεκρῶν
  choice: 死人复活
  rationale: 这是保罗论述身体复活的常用表达；“死人复活”直接、自然，不把它弱化为泛指的死后生命。
- source_word: δι’ ἀνθρώπου
  choice: 借着一个人
  rationale: 第二处沿用相同译法，以保留死亡与复活、亚当与基督之间严整的对应结构。
theological_decisions:
- issue: 亚当与基督的代表性对照
  choice: 两处都译作“借着一个人”，正文不直接补出人物姓名。
  alternative: 借着一人……借着一人；借着亚当……借着基督
  rationale: 上下文明确这两个人是亚当和基督，但本节本身只用ἀνθρώπου。保留“一个人”既忠于本节措辞，也维持其神学对称，避免把上下文说明直接写进正文。
- issue: 复活的性质
  choice: 将ἀνάστασις νεκρῶν译为“死人复活”。
  alternative: 属灵复活；死后生命
  rationale: 《哥林多前书》15章所论的是死人真实的复活；译文应保留这一具体主张，不作灵意化或模糊化处理。
- issue: διά所表达的关系
  choice: 正文采用“借着”，不限定为单纯工具或单纯施事。
  alternative: 由一个人；通过一个人
  rationale: διά加属格既可突出施事，也可突出媒介。“借着”能保留原文在这两方面的语义张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。两分句重复“借着一个人而来”，以再现原文紧密的平行结构；“死亡”与“死人复活”用语清楚、通俗，并保持保罗论证中的神学张力。
