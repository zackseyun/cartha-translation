  text: πάντα γὰρ ὑπέταξεν ὑπὸ τοὺς πόδας αὐτοῦ. ὅταν δὲ εἴπῃ ὅτι πάντα ὑποτέτακται, δῆλον ὅτι ἐκτὸς τοῦ ὑποτάξαντος αὐτῷ τὰ πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/027.yaml
  text: For he has subjected all things under his feet. But when it says that all things have been subjected[a], it is clear that this excludes the one who subjected all things to him.
translation:
  language: zh_hans
  text: 因为他已经使万物都服在他的脚下。[a] 但当说“万物都已经服在他之下”时，显然，那使万物服在他之下的并不包括在内。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句前一个“他”按上下文指上帝，后一个“他”指基督；希腊原文也使用未明说名称的代词。
    reason: 代词在中文中容易被误解为同一对象；脚注说明上下文所指，同时保留正文的原文形式。
lexical_decisions:
- source_word: πάντα / τὰ πάντα
  choice: 万物
  rationale: 中性复数在这里具有全面范围，指一切受造之物；“万物”自然简洁，也保留了诗篇第8篇背景中的广泛含义。
- source_word: ὑπέταξεν / ὑποτέτακται / ὑποτάξαντος
  choice: 使……服在……之下 / 已经服在……之下
  rationale: ὑποτάσσω表示使某物处于从属地位。使动态译作“使……服在……之下”，被动完成时译作“都已经服在……之下”，兼顾动作已经完成及其持续结果。
- source_word: ὑπὸ τοὺς πόδας αὐτοῦ
  choice: 服在他的脚下
  rationale: 保留圣经中表示统治和制伏的形象，也呼应诗篇第8篇的措辞。
- source_word: ὅταν δὲ εἴπῃ
  choice: 但说……时
  rationale: 希腊文没有明说εἴπῃ的主语；采用汉语无主句，避免武断地补成“经文说”或“他说”，并保持原文的开放性。
- source_word: δῆλον
  choice: 显然
  rationale: 准确表达保罗认为读者能够自然得出的明确推论，现代汉语中简洁有力。
- source_word: ἐκτὸς τοῦ ὑποτάξαντος αὐτῷ τὰ πάντα
  choice: 那使万物服在他之下的并不包括在内
  rationale: ἐκτός在这里表示例外。“并不包括在内”以自然汉语清楚表达：使万物服从基督的那一位本身不属于被制伏的“万物”。
- source_word: αὐτῷ
  choice: 在他之下
  rationale: 这里的与格指出万物所服从的对象；“在他之下”既符合汉语表达，也延续本节的从属意象。
theological_decisions:
- issue: “万物”与使万物服从者之间的关系
  choice: 明确说明使万物服在基督之下的那一位不包括在“万物”之内
  alternative: 较为直译作“除了那使万物服在他之下的以外”
  rationale: 原文明确设立例外，区分接受万物服从的“他”和使万物服从的那一位。译文保留这种关系和张力，不进一步加入经文未明说的神学术语。
- issue: εἴπῃ的隐含主语
  choice: 采用无主句“但说……时”
  alternative: “但当经文说……”或“但当他说……”
  rationale: 希腊文动词为第三人称单数，但主语没有明说。无主句既合乎现代汉语，也不把“说”的主体限定为经文或上帝。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“服在……脚下”和“服在……之下”保留经文意象；第二句使用无主结构，以保存希腊文中说话主体未明的特点。
