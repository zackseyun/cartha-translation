  text: τὸ δὲ κέντρον τοῦ θανάτου ἡ ἁμαρτία, ἡ δὲ δύναμις τῆς ἁμαρτίας ὁ νόμος·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/056.yaml
  text: The sting of death is sin[b][a], and the power of sin is the law.
translation:
  language: zh_hans
  text: 死亡的毒刺就是罪，而罪的力量就是律法。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“律法”很可能特别指摩西律法，但原文也容许较广的理解，即律法在揭露罪并使罪加剧方面所起的作用。
    reason: alternative_reading
lexical_decisions:
- source_word: κέντρον
  choice: 毒刺
  rationale: 本词可指尖刺或赶牲口的刺棒；在此承接上文对死亡“毒刺”的拟人化描写，“毒刺”最自然地表达死亡用来伤害人的利器。
- source_word: θανάτου
  choice: 死亡的
  rationale: 保留属格所表达的归属关系，即属于死亡、为死亡所用的毒刺。
- source_word: ἁμαρτία
  choice: 罪
  rationale: 保留单数，符合保罗在此把罪视为一种权势或原则的表达，而不只指个别罪行。
- source_word: δύναμις
  choice: 力量
  rationale: 表达罪借着律法而具有的能力或势力；“权势”也可表达此义，但“力量”更贴近此处简洁的对应结构。
- source_word: νόμος
  choice: 律法
  rationale: “律法”保留保罗用语中很可能指向摩西律法的意味，同时正文不增添限定语，以免排除律法揭露并加剧罪这一较广层面的含义。
- source_word: δὲ
  choice: 而……而……
  rationale: 两个 δέ 在这里推动并连接解释，不表示强烈转折；汉语以“而”构成平衡句式，自然呈现两句之间的递进关联。
theological_decisions:
- issue: “律法”在“罪的力量就是律法”中的范围
  choice: 正文只译“律法”，不明说“摩西律法”
  alternative: 明确译作“摩西律法”，或泛化为一般性的“法则”
  rationale: 保罗的论述很可能特别涉及摩西律法，但希腊文此处本身没有加上“摩西”这一限定；保留“律法”既维持具体历史指向，也容纳律法揭露并激发罪的较广作用。
translation_notes:
  register: 采用简洁、庄重而自然的现代汉语。“死亡的毒刺就是罪，而罪的力量就是律法”保留原文两分句的紧密平行结构及神学张力；脚注标记置于涉及“律法”的句末。
