revisions:
- from: 太阳有太阳的荣光[a]，月亮有月亮的荣光，众星也有众星的荣光；其实，星与星的荣光也有差别。
  to: 太阳有一种荣光，月亮另有一种荣光，众星又有一种荣光；因为星与星在荣光上各不相同。
  rationale: 修订以“一种／另有一种／又有一种”呈现ἄλλη的重复对照；以“因为”恢复γാർ的解释关系；以“星与星在荣光上各不相同”直接对应ἀστὴρ ... ἀστέρος διαφέρει ἐν δόξῃ，且不引入优劣或等级。脚注仅规范希腊文与中文之间的排版空格，内容不变。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T03:51:25Z'
review_pass:
  verdict: revise
  source_fidelity: 译稿总体准确保留了太阳、月亮、众星以及星与星之间在δόξα上的区别，并以“荣光”维持本段的关键词连贯性。但“其实”弱化并略改变了γάρ的说明／理由关系；末句的主语也宜明确为“星与星”本身的不同，而非其“荣光有差别”的名词化表述。
  naturalness: 原译流畅、庄重。“太阳有太阳的荣光”虽自然，却未如“有一种……另有一种……”那样直接呈现重复的ἄλλη及其对照。修订后仍保持现代汉语的自然表达。
  terminology: “荣光”可取，既能涵盖此处可见的光彩，也保留与相邻复活论述的词汇联系。脚注保留“光辉”这一较自然的替代译法；“亮光”可作为较宽泛的说明性替代。
  issues:
  - severity: medium
    issue: γάρ译作“其实”
    rationale: γάρ在此引出对前述众星荣光差异的说明或理由。“其实”主要表示强调、转折性澄清，未充分标示原文的解释性连接；“因为”更明确且自然。
  - severity: low
    issue: 三次ἄλλη的对照表达不够直接
    rationale: “太阳有太阳的……，月亮有月亮的……”可理解为各自所有，却较弱地表达“另一种／不同的”荣光。用“一种……另有一种……又有一种”可更清楚保留原文反复的区分。
  - severity: low
    issue: 末句表述可更贴合原文句法
    rationale: ἀστὴρ γὰρ ἀστέρος διαφέρει ἐν δόξῃ直接说“星与星在荣光上不同”。“星与星的荣光也有差别”含义近似，但将比较主体转为“荣光”，不如直译清晰。
  revised_text: 太阳有一种荣光，月亮另有一种荣光，众星又有一种荣光；因为星与星在荣光上各不相同。
  revised_footnotes:
