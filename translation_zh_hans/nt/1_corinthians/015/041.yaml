  text: ἄλλη δόξα ἡλίου, καὶ ἄλλη δόξα σελήνης, καὶ ἄλλη δόξα ἀστέρων, ἀστὴρ γὰρ ἀστέρος διαφέρει ἐν δόξῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/041.yaml
  text: There is one glory of the sun[a], and another glory of the moon, and another glory of the stars; for star differs from star in glory.
translation:
  language: zh_hans
  text: 太阳有一种荣光，月亮另有一种荣光，众星又有一种荣光；因为星与星在荣光上各不相同。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλη
  choice: 有……的……（彼此不同）
  rationale: 重复的ἄλλη强调太阳、月亮和众星各有不同的荣光。中文采用平行句式自然表达这种区别，不机械重复“另一种”。
- source_word: δόξα
  choice: 荣光
  rationale: 此处既指天体可见的光辉，也与上下文复活身体的“荣光”相呼应。“荣光”兼顾可见光彩和保罗论述中的关键词联系。
- source_word: ἡλίου / σελήνης / ἀστέρων
  choice: 太阳 / 月亮 / 众星
  rationale: 三个属格均依附于δόξα，译成“太阳的荣光、月亮的荣光、众星的荣光”，保留原文三项并列。
- source_word: ἀστὴρ ... ἀστέρος
  choice: 星与星
  rationale: 直接保留单数之间的比较，表明同一类别内部也存在差异。
- source_word: γὰρ
  choice: 其实
  rationale: γάρ在此补充说明众星之中也各有差异；“其实”在现代汉语中比生硬的“因为”更能自然承接前句，同时保留解释作用。
- source_word: διαφέρει ἐν δόξῃ
  choice: 荣光也有差别
  rationale: 明确差异所在是“荣光”，不将διαφέρει强化为某颗星胜过另一颗星。
theological_decisions:
- issue: 复活论述中的天体比喻应如何翻译δόξα
  choice: 荣光
  alternative: 光辉；亮度
  rationale: 眼前所指包含天体可见的光辉，但“亮度”会把词义缩窄为纯物理性质；“荣光”保留与上下文复活身体之荣耀的修辞和神学联系，同时脚注说明其可见光彩含义。
- issue: 星与星之间的διαφέρει是否表示优劣
  choice: 译为“有差别”，不明说高下
  alternative: 一颗星胜过另一颗星
  rationale: 原文可表示不同，在此未必明确断言等级或优劣；译文保留这种开放性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“太阳有太阳的……，月亮有月亮的……”形成自然平行，既忠实于原文反复对照，也避免翻译腔；“众星”简洁体现复数。
