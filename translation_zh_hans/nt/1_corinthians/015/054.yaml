  text: ὅταν δὲ τὸ ⸂φθαρτὸν τοῦτο ἐνδύσηται ἀφθαρσίαν καὶ τὸ⸃ θνητὸν τοῦτο ἐνδύσηται ⸀ἀθανασίαν, τότε γενήσεται ὁ λόγος ὁ γεγραμμένος· Κατεπόθη ὁ θάνατος εἰς νῖκος.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/054.yaml
  text: 'But when this perishable puts on imperishability[a], and this mortal puts on immortality[d][c][b], then the written word will come to pass: “Death has been swallowed up in victory.”'
translation:
  language: zh_hans
  text: 但当这必朽坏的穿上不朽坏性，这必死的穿上不死性时，所写的话便会实现：“死亡在胜利中被吞灭了。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 引自《以赛亚书》25:8；这里的措辞反映保罗所引用的希腊文传统。
    reason: cross_reference
lexical_decisions:
- source_word: φθαρτὸν
  choice: 必朽坏的
  rationale: 将形容词作名词理解，指现今处于会朽坏状态的身体；并与“不朽坏”形成清楚对应。
- source_word: ἐνδύσηται
  choice: 穿上
  rationale: 保留原文的穿衣比喻，也自然表达身体披戴一种新的性质。
- source_word: ἀφθαρσίαν
  choice: 不朽坏
  rationale: 与“必朽坏的”保持词义对应，表达不再腐朽败坏的状态。
- source_word: θνητὸν
  choice: 必死的
  rationale: 表达受死亡辖制、终必死亡的性质，并与“不死”对应。
- source_word: ἀθανασίαν
  choice: 不死
  rationale: 简明表达不再死亡的状态，符合现代汉语习惯。
- source_word: γενήσεται
  choice: 会成为事实
  rationale: γίνομαι在这里指所记之言发生、成为现实；这一译法比“应验”更少加入专门的应验公式，同时在汉语中自然。
- source_word: ὁ λόγος ὁ γεγραμμένος
  choice: 经上所写的话
  rationale: λόγος指下文引用的言语；“经上所写的话”既自然，也明确这是书面经文中的话。
- source_word: Κατεπόθη
  choice: 被……吞灭了
  rationale: 保留被动语态和吞咽意象；“吞灭”在此表达死亡遭到彻底消除。
- source_word: εἰς νῖκος
  choice: 被胜利吞灭
  rationale: 将εἰς νῖκος理解为结果或胜利状态，以自然汉语表达死亡在胜利中被彻底击败。
theological_decisions:
- issue: γενήσεται与经文引语的关系
  choice: 会成为事实
  alternative: 就应验了／就会实现
  rationale: 原文使用普通动词γίνομαι，而非明确的“应验”术语；译文表达所写之言成为现实，同时避免强化原文没有明说的公式化含义。
- issue: Κατεπόθη在未来末世语境中的时态与体貌
  choice: 死亡被胜利吞灭了
  alternative: 死亡已被胜利吞灭／死亡被胜利吞灭
  rationale: 引语中的不定过去时在保罗所展望的未来时刻宣告既成结果；句末“了”自然呈现届时已经实现的状态。
- issue: “这必朽坏的／这必死的”所指
  choice: 保留形容词名词化表达，不在正文补出“身体”
  alternative: 这必朽坏的身体／这必死的身体
  rationale: 上下文显然涉及身体，但本节希腊文本没有明说σῶμα；保留原文的省略，避免将上下文解释直接写入正文。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“穿上”保留保罗连续使用的衣着意象；“必朽坏的／不朽坏”和“必死的／不死”形成两组紧密对照。脚注标记置于引语之后，说明其旧约出处及文本传统。
