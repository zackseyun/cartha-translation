revisions:
- from: 但当这必朽坏的穿上不朽坏，这必死的穿上不死，那时，经上所写的话就会成为事实：“死亡被胜利吞灭了。”[a]
  to: 但当这必朽坏的穿上不朽坏性，这必死的穿上不死性时，所写的话便会实现：“死亡在胜利中被吞灭了。”[a]
  rationale: 修订使两个抽象名词在汉语中能够自然作“穿上”的宾语，同时保留原文的衣着比喻及“朽坏／不朽坏”“必死／不死”的平行。将引语中的“被胜利吞灭”改为“在胜利中被吞灭”，避免无根据地把胜利指定为施事，并保留该短语的结果性表达。脚注锚点仍紧随引语，且内容与其所说明的旧约引文一致。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T03:51:30Z'
review_pass:
  verdict: revise
  source_fidelity: 译文基本准确地保留了条件性未来结构、两组对照和引语的被动意象。不过“不朽坏”“不死”在“穿上……”的宾语位置缺少表性质的名词形式，汉语不够完整自然；“被胜利吞灭”则容易将“胜利”误解为施事，未能较好保留 εἰς νῖκος 所表达的结果／胜利状态。
  naturalness: “这必朽坏的／这必死的”可保留原文形容词名词化的省略，但“穿上不朽坏”“穿上不死”不合现代汉语通常搭配。改为“不朽坏性／不死性”可保留词汇对应和衣着隐喻，并使句子通顺。“所写的话便会实现”也比“经上所写的话就会成为事实”更简洁自然。
  terminology: 以“朽坏／不朽坏性”和“必死／不死性”对应 φθαρτός／ἀφθαρσία 与 θνητός／ἀθανασία，既避免把原文未明说的“身体”写入正文，也维持两组神学与词汇对照。引语改作“死亡在胜利中被吞灭了”，不指定隐含施事，并较稳妥呈现 εἰς νῖκος。
  issues:
  - severity: medium
    issue: “穿上不朽坏／穿上不死”缺乏名词化表达
    rationale: ἀφθαρσίαν和ἀθανασίαν均为名词，作“穿上”的宾语时，中文宜译为“不朽坏性／不死性”等性质名词；原译搭配生硬。
  - severity: medium
    issue: “死亡被胜利吞灭了”易把“胜利”处理为吞灭的施事
    rationale: εἰς νῖκος并非明确的施事结构，较可取的是表达死亡被吞灭后进入／归于胜利的结果状态。
  - severity: low
    issue: “经上”比原文“所写的话”略具体
    rationale: 上下文和引文确实表明是经文，原译不构成实质错误；但正文可保留原文较一般的“所写的话”，旧约出处则由脚注说明。
