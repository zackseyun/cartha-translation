  naturalness: 删去“因为”后的逗号，使“因为正如……，照样……”成为自然连贯的书面论证句式。“众人都必死”及“众人也都将被赋予生命”庄重、清楚，适合本段保罗书信的语体。
  terminology: 保留“亚当”“弥赛亚”以及两处“在……里”的平行。脚注正确说明Χριστός的传统译法“基督”与正文按含义所译的“弥赛亚”。两处“众人”均不加限定，以保留原文的平行和神学张力。
