  text: ὥσπερ γὰρ ἐν τῷ Ἀδὰμ πάντες ἀποθνῄσκουσιν, οὕτως καὶ ἐν τῷ Χριστῷ πάντες ζῳοποιηθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/022.yaml
  text: For just as in Adam all die[a], so also in Messiah all will be made alive.
translation:
  language: zh_hans
  text: 因为正如在亚当里众人都必死，照样，在弥赛亚[a]里众人也都将被赋予生命。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“基督”。希腊语称号 Χριστός 既可译作传统称呼“基督”，也可按其含义译作“弥赛亚”；此处按含义翻译。
    reason: 提供称号 Χριστός 的传统译法，并说明正文采用“弥赛亚”的依据。
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: 因为，正如
  rationale: “正如”保留比较关系，“因为”体现 γάρ 与上文的解释性衔接；用逗号使现代汉语论证层次清楚。
- source_word: ἐν τῷ Ἀδὰμ
  choice: 在亚当里
  rationale: 贴近原文，并保留保罗简练的代表性或群体关联表达；不擅自具体化为“借着亚当”或“与亚当联合”。
- source_word: πάντες
  choice: 众人都
  rationale: 两处均采用同一表达，以保留 πάντες…πάντες 的广泛范围和严整对称，不在译文中限定其所指。
- source_word: ἀποθνῄσκουσιν
  choice: 死了
  rationale: 此处现在时陈述与亚当相关的普遍现实。现代汉语用“死了”自然表达已成为事实的状态；若译“正在死”，容易误成仅指持续过程。
- source_word: οὕτως καὶ
  choice: 照样……也
  rationale: 自然呈现与“正如”对应的关联结构，同时保留 καί 的附加意味。
- source_word: ἐν τῷ Χριστῷ
  choice: 在弥赛亚里
  rationale: Χριστός 在此作为称号，并与“在亚当里”平行；“弥赛亚”传达称号本义，同时用脚注提供传统译名“基督”。
- source_word: ζῳοποιηθήσονται
  choice: 将活过来
  rationale: 保留将来意义，并以自然现代汉语表达“使之活”的结果。直译为“将被使活”生硬；“将复活”则比原词更明确地限定为复活，可能缩窄原文措辞。
theological_decisions:
- issue: 两处“众人”的范围
  choice: 两处都不加限定地译为“众人都”
  alternative: 把第二处限定为“所有信徒”，或明确断定两处在完全相同的意义上指全人类
  rationale: 希腊文刻意使用 πάντες…πάντες 的平行结构，却未在本句中进一步说明第二个“众人”的范围或实现方式。译文保留这种神学张力，不预先替读者作宗派性裁定。
- issue: “在亚当里”与“在弥赛亚里”的关系性质
  choice: 保留“在……里”的紧凑表达
  alternative: 解释为“借着……”“由于……”，或“与……联合”
  rationale: 介词 ἐν 在两处形成关键平行，可能涉及代表、归属或联合等含义。译文不把其中任何一种解释直接写入正文。
- issue: ζῳοποιηθήσονται 的神圣施事者
  choice: 译为“将活过来”，不明说施事者
  alternative: 译为“将被上帝赐予生命”
  rationale: 原文采用被动语态而未明说施事者；上下文可暗示上帝的行动，但正文不添加原文没有明说的“上帝”。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“正如……照样……”保留原句论证结构；“在亚当里／在弥赛亚里”维持紧凑平行。避免生硬的被动句，也不增添原文未明说的神学限定。
