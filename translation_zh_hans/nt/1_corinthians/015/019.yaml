source:
  edition: SBLGNT
  text: εἰ ἐν τῇ ζωῇ ταύτῃ ⸂ἐν Χριστῷ ἠλπικότες ἐσμὲν⸃ μόνον, ἐλεεινότεροι πάντων ἀνθρώπων ἐσμέν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/019.yaml
  text: If we have hoped in Messiah for this life only[c][b][a], we are more pitiable than all people.
translation:
  language: zh_hans
  text: 我们若只为今生寄望于弥赛亚[a][c]，就比所有人都更值得怜悯[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“基督”。希腊语头衔 Χριστός 既可译作“基督”，也可译作“弥赛亚”；正文用“弥赛亚”以保留这个头衔的含义。
    reason: alternative_reading
  - marker: b
    text: 或译：“就是所有人中最可怜的。”希腊语原文为比较级，在汉语中也可按最高级的语意来表达。
    reason: lexical_alternative
  - marker: c
    text: 或译：“我们若只在今生寄望于弥赛亚。”
    reason: previous_rendering
lexical_decisions:
- source_word: εἰ
  choice: 若
  rationale: 引出条件句；“若”简洁、庄重，也符合本节反事实论证的语气。
- source_word: ἐν τῇ ζωῇ ταύτῃ
  choice: 为今生
  rationale: 希腊语字面为“在今生”；结合 μόνον 的范围，译作“只为今生”可自然表达盼望若仅限于现世这一含义，同时以脚注保留较贴近形式的译法。
- source_word: ἐν Χριστῷ
  choice: 寄望于弥赛亚
  rationale: 保留 ἐν 所表达的关系性，并将 Χριστός 按头衔译作“弥赛亚”，避免把它仅当作音译姓名。
- source_word: ἠλπικότες ἐσμὲν
  choice: 寄望
  rationale: 这是完成时迂说结构，表示已经把盼望寄托于某对象并持续至今；现代汉语“寄望于”自然体现这种既成而持续的状态。
- source_word: μόνον
  choice: 只
  rationale: 将其放在“为今生”之前，清楚表明受限制的是盼望所及的生命范围，而不是说信徒除了盼望之外什么也没做。
- source_word: ἐλεεινότεροι
  choice: 更值得怜悯
  rationale: 保留比较级，并准确表达“更应受人怜悯”，而非主要指主观上的悲惨感受。
- source_word: πάντων ἀνθρώπων
  choice: 比所有人都
  rationale: 泛指全人类，不限于男性；“比所有人都”在现代汉语中自然地承接比较级。
theological_decisions:
- issue: 保罗短语 ἐν Χριστῷ 中 Χριστός 的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处仍有头衔含义，正文用“弥赛亚”传达该含义；脚注保留教会传统中熟悉的“基督”。
- issue: μόνον 的范围及本节所说盼望的限度
  choice: 只为今生寄望于弥赛亚
  alternative: 只在今生寄望于弥赛亚
  rationale: 正文表明保罗所设想的是盼望仅以今生为范围，不额外展开复活或来世教义；脚注保留更贴近希腊语介词形式、但在中文中范围略显含混的表达。
- issue: 比较级 ἐλεεινότεροι 的表达
  choice: 比所有人都更值得怜悯
  alternative: 是所有人中最可怜的
  rationale: 正文保留希腊语比较级；备选译法说明该比较在汉语中也可用最高级式表达，但不把“值得怜悯”弱化为单纯感到悲惨。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“寄望于”比“有盼望”更清楚地体现盼望所寄托的对象；“更值得怜悯”准确而不过度口语化。正文调整语序以避免把“只”误解为仅修饰“寄望”这一行为。
