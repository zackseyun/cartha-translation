  text: ὁ δὲ θεὸς ⸂δίδωσιν αὐτῷ⸃ σῶμα καθὼς ἠθέλησεν, καὶ ἑκάστῳ τῶν σπερμάτων ⸀ἴδιον σῶμα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/038.yaml
  text: But God gives it a body as he willed[a], and to each of the seeds its own body.
translation:
  language: zh_hans
  text: 但上帝照着自己的旨意给它一个身体，也给每一粒种子各自的身体。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δίδωσιν
  choice: 给
  rationale: 现在时在这一普遍性的种子比喻中自然译为“给”；既直接对应原词，也保持上下文的生动性。
- source_word: αὐτῷ
  choice: 给它
  rationale: 与格单数回指上文的种子；汉语用“给它一个身体”自然清楚。
- source_word: σῶμα
  choice: 身体
  rationale: 保持σῶμα在本章中的核心词汇联系；这里指上帝赋予种子的具体有形形态，也与复活身体的论述相连。
- source_word: καθὼς ἠθέλησεν
  choice: 照着自己的旨意
  rationale: 表达上帝的意愿和决定；“自己的”明确主语归属，但不增添超出原文的神学内容。
- source_word: ἑκάστῳ τῶν σπερμάτων
  choice: 给每一粒种子
  rationale: 以自然汉语表达ἑκάστῳ与部分属格的逐一分配意义；不添加原文未明说的“种类”。
- source_word: ἴδιον
  choice: 各自的
  rationale: 突出每一粒种子所得身体分别属于它自身，并与“每一粒”形成自然搭配。
theological_decisions:
- issue: 种子与身体比喻中的上帝作为和意愿
  choice: 译文明确身体由上帝按照自己的旨意赐予，并分别赐给每一粒种子。
  alternative: 可将“照着自己的旨意”译为“随自己的意思”或“按他所愿的”。
  rationale: 这样保留保罗对上帝主动作为和意愿的强调，同时不把“身体”解释为原文未明说的特定物种、类别或完整教义体系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“旨意”在宗教语境中自然，但仍为普通读者所理解；句式尽量贴近希腊文的两个并列分句，同时避免生硬的“每一个种子中的”。
