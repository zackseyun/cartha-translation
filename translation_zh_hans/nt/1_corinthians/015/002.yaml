base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/002.yaml
  text: through which you also are being saved, if you hold firmly to the message I proclaimed as good news to you—unless you believed in vain.
translation:
  language: zh_hans
  text: 你们也借着这福音正在得救[a]，如果你们持守我向你们所传的福音信息[b]——除非你们徒然相信了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“得救”。希腊语现在时既可强调正在进行的过程，也可作较概括的陈述。
    reason: lexical_alternative
  - marker: b
    text: 原文较直译可作：“如果你们持守我向你们传福音时所传的是什么信息。”这里的“什么信息”可指福音的内容，也可能着重传讲时所用的表述。
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ οὗ
  choice: 借着这福音
  rationale: διά加属格在这里表示媒介或凭借；关系代词回指上一节的“福音”。译为“借着这福音”既明确所指，也符合现代汉语表达。
- source_word: σῴζεσθε
  choice: 正在得救
  rationale: 现在时被动语态可突出正在进行的过程。“正在得救”保留其体貌色彩，同时不把经文纳入某种特定的救恩论体系。
- source_word: τίνι λόγῳ
  choice: 福音信息
  rationale: λόγος在此指保罗所宣告之福音的内容或表述。结合κατέχετε，译作“持守……福音信息”比直译“什么话”更自然；相关句法和字面形式在脚注中保留。
- source_word: εὐηγγελισάμην
  choice: 所传的福音
  rationale: 该动词意为宣告好消息；“传福音”在现代汉语中清楚而自然，并保留其福音语义。
- source_word: κατέχετε
  choice: 持守
  rationale: κατέχω在此表示持续牢牢守住、坚持或保留。“持守”简洁庄重，也保留条件句的实际力度。
- source_word: ἐκτὸς εἰ μὴ
  choice: 除非
  rationale: 该组合引出例外情况。“除非”直接保留原文的例外结构，避免将其改写成解释性的结论。
- source_word: εἰκῇ
  choice: 徒然
  rationale: 这里表达空洞、无果效或达不到目的。“徒然”自然地保留保罗警告中的张力。
- source_word: ἐπιστεύσατε
  choice: 当初是……相信的
  rationale: 不定过去时指向哥林多人先前接受福音而相信的行动；加入“当初”在汉语中清楚表达这一回顾意味。
theological_decisions:
- issue: σῴζεσθε所表达的救恩体貌
  choice: 正在得救
  alternative: 得救
  rationale: 采用进行性表达以反映现在时的可能体貌，同时不否认“得救”这一概括性译法，也不借翻译解决有关救恩阶段的神学争论。
- issue: εἰ κατέχετε的条件性质
  choice: 只要你们持守
  alternative: 你们既然持守；你们若以此证明信心真实
  rationale: 保留原文真实的条件形式，不将其解释成已假定为真的修辞条件，也不加入有关真信心证据或坚忍的宗派性说明。
- issue: ἐκτὸς εἰ μὴ εἰκῇ ἐπιστεύσατε的警告
  choice: 除非你们当初是徒然相信的
  alternative: 不然，你们的信就是徒然的
  rationale: “除非”较直接地保存原文的例外结构及其神学张力；不进一步界定“徒然相信”究竟指信仰内容错误、信心无果，还是因否认复活而归于空虚。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“持守”“徒然”保留经文的严肃语气；破折号呈现末尾例外句的突转。所有脚注标记均已置于正文对应位置。
