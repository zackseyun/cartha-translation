  terminology: “福音”“得救”“持守”“徒然”均恰当，且没有加入宗派性解释。保留“福音信息”可清楚表达 λόγος 在此所指的宣讲内容；脚注应以通顺汉语说明其较字面的、带疑问色彩的句法。
