  rationale: 将“只要”改为“如果”，以不加强 εἰ 的条件力度；删去非原文明确要求的“当初”，并将末句改为自然的“徒然相信了”。同时重写脚注 b，使其以可理解的汉语交代 τίνι λόγῳ 的较字面、带疑问色彩的表达，而不裁定其具体句法分析。
