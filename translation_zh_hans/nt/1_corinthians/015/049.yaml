  text: καὶ καθὼς ἐφορέσαμεν τὴν εἰκόνα τοῦ χοϊκοῦ, ⸀φορέσομεν καὶ τὴν εἰκόνα τοῦ ἐπουρανίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/049.yaml
  text: And just as we have borne the image of the man of dust[a], we will also bear the image of the heavenly man.
translation:
  language: zh_hans
  text: 正如我们曾带有那属尘土之人的形象，我们也将带有那属天之人的形象。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“让我们也带有那属天之人的形象”。
    reason: textual_variant
lexical_decisions:
- source_word: καθὼς
  choice: 正如
  rationale: 明确引出前后两种形象之间的对应关系，符合本节的比较结构。
- source_word: ἐφορέσαμεν
  choice: 我们曾带着
  rationale: φορέω可指承载或带着某种形象；“曾”体现不定过去时，又不暗示这种处境如今已经完全结束。
- source_word: εἰκόνα
  choice: 形象
  rationale: 保留εἰκών的常用对应词，也维持亚当与基督之间的预表性对照。
- source_word: τοῦ χοϊκοῦ
  choice: 那属尘土之人的
  rationale: χοϊκός意为由尘土而来、属尘土；结合上文“头一个人”的对照，补出“人”可使所指清楚，并保留《创世记》的尘土意象。
- source_word: φορέσομεν
  choice: 我们也必带着
  rationale: 按SBLGNT正文译为将来陈述；“必”自然表达语境中复活改变的未来确定性，但不添加超出动词语气的条件。
- source_word: τοῦ ἐπουρανίου
  choice: 那属天之人的
  rationale: ἐπουράνιος意为属天的；依照上文“属尘土的人／属天的人”的平行结构补出“人”，使亚当与基督的对照清楚。
- source_word: καὶ
  choice: 也
  rationale: 体现第二分句中καί的递进、附加作用，并保持两个分句的平行。
theological_decisions:
- issue: 第二个动词是将来直陈式还是劝勉虚拟式
  choice: 我们也必带着
  alternative: 也让我们带着
  rationale: SBLGNT正文采用φορέσομεν（将来直陈式），与本段所论将来复活和改变相符；φορέσωμεν（劝勉虚拟式）的异文具有释经意义，因此在脚注中保留，而不在正文中调和。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“带着……形象”比生硬的“承载……形象”更自然，同时保留φορέω与εἰκών的意象。两个“那……之人”维持原文与上文的平行和亚当—基督对照。
