base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/020.yaml
  text: But now Messiah has been raised from the dead[c][b][a], the firstfruits of those who have fallen asleep.
translation:
  language: zh_hans
  text: 但如今，弥赛亚[a]已经从死人中复活了，是那些已经睡了[c]的人中的初熟果子[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弥赛亚”也可译作“基督”；两者都表示“受膏者”。
    reason: alternative_reading
  - marker: b
    text: “初熟的果子”指收割时最先献给上帝的那一份，既表示在先，也预示其余收成随后来到。
    reason: cultural_note
  - marker: c
    text: “睡了”在这里是指死亡的比喻，置于复活的语境中尤其含有死亡并非终局的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: Νυνὶ δὲ
  choice: 但如今
  rationale: 承接上文对复活的假设性否定，作出强烈转折，并强调现在所肯定的事实。
- source_word: Χριστὸς
  choice: 弥赛亚
  rationale: 此处具有称号意味，译出“受膏者／弥赛亚”的称号意义；脚注保留华语基督教传统译法“基督”。
- source_word: ἐγήγερται
  choice: 已经……复活了
  rationale: 希腊语为完成时被动语态，表示已经发生且结果持续至今。现代汉语用“已经……了”自然表达完成及持续有效的结果；“复活”不明说施事者，也没有把神的使其复活这一含义排除掉。
- source_word: ἐκ νεκρῶν
  choice: 从死人中
  rationale: 保留复数“死人”的群体性意象，即弥赛亚从死者之中复活；比单说“脱离死亡”更贴近原文。
- source_word: ἀπαρχὴ
  choice: 初熟的果子
  rationale: 保留献给上帝的首批收成这一祭祀与收割意象，并表达其在先和预示后来完整收成的代表意义。
- source_word: τῶν κεκοιμημένων
  choice: 那些已经睡了之人
  rationale: 保留原文以睡眠指死亡的委婉比喻；“已经”也对应分词的完成时意义。
theological_decisions:
- issue: 复活的语态与施事者
  choice: 已经从死人中复活了
  alternative: 已经从死人中被复活了／已经从死人中被使其复活了
  rationale: 原文采用神学被动语态，但直译成汉语被动句生硬。“复活了”符合现代汉语表达，同时不擅自点明或排除使其复活的施事者。
- issue: Χριστός作为称号的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 正文凸显“受膏者”这一称号意义；“基督”是惯用且正确的传统译法，列入脚注以免掩盖译名传统。
- issue: “初熟果子”的代表与保证意味
  choice: 保留收割意象，不在正文中解释
  alternative: 第一位复活者／后来复活之人的保证
  rationale: 原文使用富有祭祀和收割背景的隐喻；正文不把其丰富含义缩减为单一解释，相关背景在脚注说明。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“但如今”保持论证的强烈转折；“从死人中复活”兼顾原文具体意象和华语可读性；保留“初熟的果子”与“睡了”两个核心隐喻，并用脚注帮助普通读者理解。
