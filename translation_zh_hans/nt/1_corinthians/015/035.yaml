id: 1CO.15.35
reference: 1 Corinthians 15:35
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ἀλλὰ ἐρεῖ τις· Πῶς ἐγείρονται οἱ νεκροί, ποίῳ δὲ σώματι ἔρχονται;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/035.yaml
  text: But someone will say[a], “How are the dead raised, and with what kind of body do they come?”
translation:
  language: zh_hans
  text: 但有人会说：“死人是怎样被复活的[a]？他们又以什么样的身体来呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“死人怎样复活？”希腊文动词是被动语态，直译为“被复活”，可能暗示复活是由上帝施行的。
    reason: 说明原文被动语态，并保留一种更自然的汉语表达及其神学含义。
lexical_decisions:
- source_word: Ἀλλὰ
  choice: 但
  rationale: 表示转折，引出设想中的质问；“但”简洁自然，符合论辩语境。
- source_word: ἐρεῖ τις
  choice: 有人会说
  rationale: 保留将来时表达，同时自然地引出假想发言者；虽然后文是问句，仍按原文译为“说”，不改成“问”。
- source_word: Πῶς
  choice: 怎样
  rationale: 保留对方式或可能性的询问，现代汉语中自然明确。
- source_word: ἐγείρονται
  choice: 是怎样被复活的
  rationale: 保留希腊文的被动语态及其可能暗示的施事者，同时不在正文中明确补出“上帝”。
- source_word: οἱ νεκροί
  choice: 死人
  rationale: 自然表达作为群体的“死者”，用语直白，适合普通现代读者。
- source_word: ποίῳ ... σώματι
  choice: 以什么样的身体
  rationale: “什么样的”体现 ποίῳ 所含的种类、性质之问；“以……身体”对应与格，并避免把身体描写成可与人分离、由人携带的物件。
- source_word: δὲ
  choice: 又
  rationale: 连接第二个相关问题，表达递进而非强烈转折，符合现代汉语问句习惯。
- source_word: ἔρχονται
  choice: 来
  rationale: 直接保留 ἔρχομαι 的基本意象，不将其解释性改写为“出现”或再次译作“复活”。
theological_decisions:
- issue: 复活用语及施事者
  choice: 死人是怎样被复活的
  alternative: 死人怎样复活
  rationale: 正文保留 ἐγείρονται 的被动形式，使可能蕴含的神圣施事者仍可被感知，却不把原文未明说的施事者直接补入译文；脚注提供较自然的主动式汉语读法。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。正文保留两个直接问句及原文的修辞张力；“以什么样的身体来”略具书面色彩，但能避免“带着身体”可能产生的身体与人相分离之误解。
