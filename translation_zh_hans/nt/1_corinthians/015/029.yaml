id: 1CO.15.29
reference: 1 Corinthians 15:29
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ἐπεὶ τί ποιήσουσιν οἱ βαπτιζόμενοι ὑπὲρ τῶν νεκρῶν; εἰ ὅλως νεκροὶ οὐκ ἐγείρονται, τί καὶ βαπτίζονται ὑπὲρ ⸀αὐτῶν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/029.yaml
  text: Otherwise[a], what will those do who are being baptized on behalf of the dead? If the dead are not raised at all, why then are they being baptized on their behalf?
translation:
  language: zh_hans
  text: 不然，那些为死人受洗的人[a]将怎么办呢？如果死人根本不复活，他们为什么还要为他们受洗呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为死人”也可理解为“代表死人”或“因死人之故”，较不可能指“在死人上方”。希腊文介词可有多种理解，保罗所指的具体做法并不确定。
    reason: 说明希腊文 ὑπέρ 的词义选择及相关历史做法的不确定性。
lexical_decisions:
- source_word: Ἐπεὶ
  choice: 不然
  rationale: 这里承接上文的论证，引出否认复活所导致的反问；“不然”自然表达这种推论关系。
- source_word: τί ποιήσουσιν
  choice: 将怎么办呢
  rationale: 保留 ποιέω 宽泛的“做”之意，并以现代汉语常用的反问表达呈现其开放性，不具体限定为“成就什么”。
- source_word: οἱ βαπτιζόμενοι
  choice: 那些……受洗的人
  rationale: “受洗”保留希腊文被动形式；这一表述可以指正在发生或惯常进行的做法，而不对其正当性作判断。
- source_word: ὑπὲρ τῶν νεκρῶν
  choice: 为死人
  rationale: ὑπέρ 加属格通常可表示“为了、代表”；“为死人”在中文中简洁且保留一定歧义，具体可能含义置于脚注说明。
- source_word: εἰ ὅλως
  choice: 如果……根本不
  rationale: “根本”体现 ὅλως 对否定条件的加强语气。
- source_word: νεκροὶ οὐκ ἐγείρονται
  choice: 死人根本不复活
  rationale: 现代汉语通常以“不复活”自然表达此处的复活概念；虽未形式化呈现被动语态，却没有指定使死人复活的施事者。
- source_word: τί καὶ
  choice: 为什么还
  rationale: 在重复的修辞问句中，“为什么还”自然传达 καί 所加强的论证语气。
- source_word: βαπτίζονται
  choice: 要……受洗
  rationale: “受洗”保留被动含义，“还要”在条件反问中自然表达这一做法仍在进行或被实行。
- source_word: ὑπὲρ αὐτῶν
  choice: 为他们
  rationale: “他们”回指前文的死人，并与前面的“为死人”保持用词对应，不进一步断定这种做法的性质。
theological_decisions:
- issue: “为死人受洗”的确切含义
  choice: 正文采用最低限度诠释的“为死人受洗”，不认可或否定任何特定历史做法或神学主张。
  alternative: 也可能理解为“代表死人受洗”“因死人之故受洗”，较不可能指“在死人上方受洗”。
  rationale: 这句话所指的具体做法历来存在争议。译文应保留 ὑπέρ 的语义张力，并突出保罗在复活论证中使用这一现象的修辞作用，而不是替读者确定某一宗派解释。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“不然”“根本不复活”“为什么还要”等表达使保罗的连续反问清楚有力；对争议性做法则维持中性，不作宗派化解释。
