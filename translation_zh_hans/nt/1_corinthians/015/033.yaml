  text: 'Do not be deceived: bad company corrupts good morals[a].'
translation:
  language: zh_hans
  text: 不要受迷惑：“不良的交往会败坏良好的品行[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不良的谈话会败坏良好的品行。”希腊语“交往”一词既可指人与人之间的来往，也可指谈话；按上下文，较宽泛的“交往”更为合适。
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ πλανᾶσθε
  choice: 不要受迷惑
  rationale: 保留原文被动或中间语态形式所容许的开放性，不限定迷惑来自他人还是自己；在现代汉语中也是简洁有力的警告语。
- source_word: φθείρουσιν
  choice: 会败坏
  rationale: 该动词在这里表示使品行逐渐变坏或腐化；“败坏”准确体现伦理语境，也保持格言式表达。加入“会”使汉语陈述自然，并表达普遍性的结果。
- source_word: ἤθη
  choice: 品行
  rationale: 此词指习性、风尚或道德品格；“品行”比“礼貌”更能体现伦理含义，也比“道德”更自然地指人的实际行为和习惯。
- source_word: χρηστὰ
  choice: 良好的
  rationale: 在此修饰品行，表达正面、健全的伦理性质；“良好的”平实清楚，不增加原文没有的特定解释。
- source_word: ὁμιλίαι
  choice: 交往
  rationale: 该复数名词可指交往、交际，也可能指谈话；上下文中的格言重点更可能是有害的人际来往。“交往”能涵盖相处与言谈，同时在脚注保留“谈话”的词义可能。
- source_word: κακαί
  choice: 不良的
  rationale: “不良的”自然地修饰“交往”，表达具有道德危害的性质，又避免用“邪恶”而使语气过强。
