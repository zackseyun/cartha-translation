id: 1CO.15.11
reference: 1 Corinthians 15:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἴτε οὖν ἐγὼ εἴτε ἐκεῖνοι, οὕτως κηρύσσομεν καὶ οὕτως ἐπιστεύσατε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/011.yaml
  text: Whether then it was I or they[a], so we proclaim and so you believed.
translation:
  language: zh_hans
  text: 所以，无论是我还是他们，我们都这样传讲[a]，你们也这样信了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这样”也可译作“如此”；这里既可着重指上文所述的宣讲内容，也可含有“以这样的方式”的意思。
    reason: 保留 οὕτως 在回指内容与表达方式之间的语义幅度。
lexical_decisions:
- source_word: εἴτε ... εἴτε
  choice: 无论是……还是……
  rationale: 保留两个传讲者选项之间的对应关系，同时符合现代汉语表达。
- source_word: οὖν
  choice: 所以
  rationale: 承接上文对复活见证人和保罗蒙恩经历的陈述，表达由此得出的结论。
- source_word: ἐκεῖνοι
  choice: 他们
  rationale: 按上下文指前面提到的其他使徒或见证人，不额外补入原文未明说的身份称谓。
- source_word: οὕτως
  choice: 这样
  rationale: 两处采用同一译法，以保留原文的重复和平行；既可回指上述信息内容，也不排除方式层面的含义。
- source_word: κηρύσσομεν
  choice: 我们都这样传讲
  rationale: “传讲”自然表达公开宣告信息之意；“我们”把保罗与其他使徒并列在共同的行动中，“都”使汉语与前面的“无论……还是……”自然衔接。
- source_word: ἐπιστεύσατε
  choice: 你们也这样信了
  rationale: 保留不定过去时所指向的既往相信行动，不增添“归信”或“信靠它”等解释性内容。
theological_decisions:
- issue: 使徒宣讲的一致性
  choice: 把重复的 οὕτως 两次都译作“这样”，表明无论保罗还是其他使徒都传讲上文所述的信息，而哥林多人所信的也是如此。
  alternative: 可译作“我们就是如此传道，你们也就是如此相信”，较强调方式或形式。
  rationale: 译文呈现使徒见证的一致性，但不把这句话扩展为原文未明说的教会论或使徒权威主张。
- issue: οὕτως 所指的是内容还是方式
  choice: 正文使用兼具回指性和方式含义的“这样”，不强行限定。
  alternative: 明确译为“这就是我们所传讲的，也是你们所信的”，会更偏向信息内容。
  rationale: 希腊语本身可指“如此、这样”，而上下文强烈回指前述福音内容；保留措辞的开放性更贴近原文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“无论是我还是他们”保留原文对照结构；“传讲”比“讲道”更少带特定宗派或礼仪语境，也能表达 κηρύσσω 的公开宣告意味。
