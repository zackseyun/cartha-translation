  text: Οὕτως καὶ ἡ ἀνάστασις τῶν νεκρῶν. σπείρεται ἐν φθορᾷ, ἐγείρεται ἐν ἀφθαρσίᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/042.yaml
  text: 'So also is the resurrection of the dead: it is sown in corruption[a]; it is raised in incorruption.'
translation:
  language: zh_hans
  text: 死人复活也是这样：所种下的是会朽坏的，复活的是不会朽坏的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“所种下的是在朽坏中，复活的是在不朽坏中。”
    reason: 保留ἐν φθορᾷ与ἐν ἀφθαρσίᾳ较形式对应的译法；正文以现代汉语表达其可朽坏与不可朽坏的性质。
lexical_decisions:
- source_word: Οὕτως καὶ
  choice: 也是这样
  rationale: 承接前文种子的比喻，保留推论兼类比的语气；现代汉语自然简洁。
- source_word: ἡ ἀνάστασις τῶν νεκρῶν
  choice: 死人复活
  rationale: 准确表达属格结构所指的死人之复活，也符合现代汉语常用的圣经表述，未改成句法重心不同的“从死人中复活”。
- source_word: σπείρεται
  choice: 所种下的是
  rationale: 保留播种意象及被动含义，并以汉语“所……的是”结构与下句形成清楚的对应。
- source_word: ἐν φθορᾷ
  choice: 必朽坏的
  rationale: φθορά在此主要指会败坏、会消亡的性质；“必朽坏”比单说“朽坏中”更自然，并与ἀφθαρσία形成直接对照。
- source_word: ἐγείρεται
  choice: 复活的是
  rationale: 在复活语境中以“复活”准确传达ἐγείρω；与前句的被动式平行，且不将主语解释性地补成“身体”。
- source_word: ἐν ἀφθαρσίᾳ
  choice: 不朽坏的
  rationale: 保留与φθορά的词根式反差，表达不再败坏或死亡的性质，而不额外界定其具体形态。
theological_decisions:
- issue: 保罗所说复活之身体的性质及播种—复活的连续与转变
  choice: 保留“种下—复活”的身体性比喻和被动语义，不明说主语为“身体”
  alternative: 意译为“身体埋葬时会朽坏，复活时却不会朽坏”
  rationale: 上下文确实论及身体复活，但本节希腊文以省略主语的被动句维持种子比喻。译文不把复活化为纯属灵或道德变化，也不加入原文未明说的“身体”“埋葬”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“必朽坏／不朽坏”保持保罗鲜明的反义平行；句中不补出“身体”，以保存原文的简练与语境张力。
