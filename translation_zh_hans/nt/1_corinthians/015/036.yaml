base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/036.yaml
  text: Foolish one[b][a], what you sow is not made alive unless it dies.
translation:
  language: zh_hans
  text: 愚昧的人哪！你所撒的若不死，就不能活过来。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “活过来”也可译作“被赋予生命”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφρων
  choice: 无知的人哪
  rationale: 这是直接称呼和尖锐责备；“无知的人哪”保留呼格语气，并在现代汉语中自然庄重。“愚昧的人哪”亦可，但略带更强的道德色彩。
- source_word: σὺ
  choice: 你
  rationale: 希腊文显式代词带强调；汉语以“你所撒的”自然保留第二人称及其强调。
- source_word: ὃ σπείρεις
  choice: 你所撒的
  rationale: 保留播种意象及不定关系结构，不擅自补出“种子”。
- source_word: ζῳοποιεῖται
  choice: 活过来
  rationale: 这里的被动形式可表示“被赋予生命”，但汉语“活过来”更自然，并保留由死到生的语境意义；用脚注注明较形式对应的译法。
- source_word: ἐὰν μὴ
  choice: 若不
  rationale: 简洁自然地表达“除非”的否定条件，且与后句“就不能”搭配顺畅。
- source_word: ἀποθάνῃ
  choice: 死
  rationale: 在条件句中以一般形式表达即可，不添加原文没有明说的“先”。
theological_decisions:
- issue: 种子之死与复活生命之间的比喻关系
  choice: 保留播种、死亡和活过来的农业比喻，不将其扩写为教义命题。
  alternative: 明确译成有关身体复活的解释性陈述。
  rationale: 本节用种子的比喻回应复活问题；译文应保存比喻本身及其张力，不加入本句未明说的解释。
- issue: ζῳοποιεῖται 的被动语态
  choice: 正文采用自然汉语“活过来”，脚注保留“被赋予生命”的可能表达。
  alternative: 正文直译为“被赋予生命”。
  rationale: 希腊文语法形式为被动，但此处也可自然理解为“获得生命、活起来”；脚注避免把施事者或神学含义说得超过原文。
translation_notes:
  register: 采用现代、庄重而直接的汉语。“无知的人哪”保留保罗责备的力度；“你所撒的”避免补入原文未明说的“种子”。脚注标记置于相关短语之后。
