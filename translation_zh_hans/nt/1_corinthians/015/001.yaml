- from: 弟兄们[a]，我要向你们说明我曾传给你们的福音；这福音你们也领受了，如今也在其中站立得稳。
  to: 弟兄们[a]，我向你们说明我从前传给你们的福音：你们也领受了这福音，并且在这福音中站立。
  rationale: 修订将 Γνωρίζω 按其现在时直陈语气译为“我向你们说明”，以免“我要”引入原文未明示的意愿／将来色彩；以“我从前传给你们”表达先前的宣讲；并保留“在这福音中”以对应 ἐν ᾧ 的领域性关系。末句采用“站立”，不额外强化为“站立得稳”，但在汉语语境中仍可表达完成时所指已形成且持续的站立状态。
