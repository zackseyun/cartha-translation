  text: Γνωρίζω δὲ ὑμῖν, ἀδελφοί, τὸ εὐαγγέλιον ὃ εὐηγγελισάμην ὑμῖν, ὃ καὶ παρελάβετε, ἐν ᾧ καὶ ἑστήκατε,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/001.yaml
  text: I make known to you[a], brothers, the good news that I proclaimed to you, which you also received, in which you also stand,
translation:
  language: zh_hans
  text: 弟兄们[a]，我向你们说明我从前传给你们的福音：你们也领受了这福音，并且在这福音中站立。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“弟兄姊妹们”。希腊语作“弟兄们”；这种阳性复数称呼常用来称呼包括男女在内的整个信徒群体。
    reason: 说明原文的语法形式及其在会众称呼中的包容性用法。
lexical_decisions:
- source_word: Γνωρίζω
  choice: 我要向你们说明
  rationale: 该动词通常表示“使人知道、告知”。这里保留其直接含义，不改译为“提醒”；“我要……说明”也符合保罗重新郑重陈明福音的语境。
- source_word: δὲ
  choice: 不单独译出
  rationale: δέ在这里是轻微的篇章转换标记，并非强烈转折。现代汉语可借称呼和新句自然体现话题转换，无须机械加入“但是”或“现在”。
- source_word: ἀδελφοί
  choice: 弟兄们
  rationale: 保留希腊语阳性复数称呼的形式；在保罗书信中，这一称呼常包括整个信徒群体，因此以脚注说明其包容范围。
- source_word: τὸ εὐαγγέλιον
  choice: 福音
  rationale: “福音”是现代汉语中通行且易懂的对应词，表达所宣告的好消息，并保留本段的基督教语境。
- source_word: ὃ εὐηγγελισάμην ὑμῖν
  choice: 我曾传给你们的
  rationale: εὐαγγελίζω表示宣告好消息；“传给”在汉语中自然简洁，并与名词“福音”搭配。曾经体反映不定过去时所指的先前宣讲。
- source_word: παρελάβετε
  choice: 你们也领受了
  rationale: παραλαμβάνω在此指接收所传的信息或传统。“领受”既保留接受传承的意味，也不额外强化为主观上的完全认同。
- source_word: ἐν ᾧ
  choice: 在其中
  rationale: 按ἐν的基本空间／领域意象，指福音是哥林多信徒目前站立的范围或根基；不提前改成第2节较明显的“借着它”。
- source_word: ἑστήκατε
  choice: 如今也……站立得稳
  rationale: 完成时表达由先前行动形成并延续至今的状态。“如今”在这里体现完成时的现时结果，并非把δέ译作时间副词；“站立得稳”自然表达持续站立的稳定状态。
theological_decisions:
- issue: ἀδελφοί是否明确包括女性信徒
  choice: 正文译“弟兄们”，脚注说明可包括弟兄姊妹
  alternative: 正文直接译“弟兄姊妹们”
  rationale: 希腊语正文使用阳性复数称呼，但在这种会众称谓中很可能指全教会。正文保留原文形式，脚注交代其实际指涉，避免遮蔽两方面的信息。
- issue: ἐν ᾧ与福音的关系
  choice: 译为“在其中站立得稳”
  alternative: 译为“靠它站立得稳”或“因它站立得稳”
  rationale: ἐν ᾧ本身可表达范围、领域或关联，也可能隐含依据。采用“在其中”保留原文意象及一定的解释空间，不将关系限定为工具或原因。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。句式略作汉语化处理，以分号连接对福音的连续说明；保留“领受”和“站立得稳”等源文关键意象。脚注标记紧随“弟兄们”，明确对应所注词语。
