  text: Εἰ δὲ Χριστὸς κηρύσσεται ὅτι ἐκ νεκρῶν ἐγήγερται, πῶς λέγουσιν ⸂ἐν ὑμῖν τινες⸃ ὅτι ἀνάστασις νεκρῶν οὐκ ἔστιν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/012.yaml
  text: If the Messiah is proclaimed as having been raised from the dead[a], how can some among you say that there is no resurrection of the dead?
translation:
  language: zh_hans
  text: 既然所宣讲的是基督已经从死人中复活了[a]，你们中间怎么有人说死人复活并不存在呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “基督”意为“弥赛亚（受膏者）”。本句也可译作：“既然人们宣讲基督已经从死人中复活了……”
    reason: 说明Χριστός的称号意义，并提供κηρύσσεται较显式的被动译法。
lexical_decisions:
- source_word: Χριστὸς
  choice: 基督
  rationale: Χριστός在保罗书信中既保留“受膏者”的称号背景，也已常用作耶稣的固定称谓；现代中文以“基督”最自然、庄重。脚注说明其称号义“弥赛亚”。
- source_word: κηρύσσεται
  choice: 所传的是
  rationale: 现在时被动语态指群体中持续公开宣讲的内容；“所传的是”在中文中自然地保留被动和宣告之意。
- source_word: ἐκ νεκρῶν ἐγήγερται
  choice: 已经从死人中复活了
  rationale: ἐγήγερται为完成时被动，表达已经发生且结果持续的行动；中文“已经……复活了”传达其完成及现存结果，而“从死人中”保留ἐκ νεκρῶν的群体背景。
- source_word: πῶς λέγουσιν
  choice: 怎么还有人说
  rationale: πῶς引出带责问意味的反问；结合τινες译作“怎么还有人说”，自然表达前后主张的不相容。
- source_word: ἐν ὑμῖν τινες
  choice: 你们中间……有人
  rationale: 明确这些人属于哥林多信徒群体内部，同时符合现代汉语表达。
- source_word: ἀνάστασις νεκρῶν
  choice: 死人复活的事
  rationale: 指普遍意义上死人的复活；“死人复活的事”比名词化较重的“死人的复活”更自然，同时不将其缩限为某一次事件。
- source_word: οὐκ ἔστιν
  choice: 并不存在
  rationale: 这里的εἰμί是存在用法；“并不存在”准确表达对死人复活这一事实或现实的否认，并加强反问中的对照。
theological_decisions:
- issue: Χριστός应译作固定称谓还是展开其称号意义
  choice: 正文译“基督”，脚注注明“弥赛亚（受膏者）”
  alternative: 正文译“弥赛亚”
  rationale: 原词确有“弥赛亚/受膏者”的称号意义，但在现代中文基督教及一般语境中，“基督”是保罗论述耶稣时最通行且不失庄重的对应。脚注保存称号语义，避免把两种可行处理暗中合并。
- issue: ἐγήγερται的被动语态是否显明施事者
  choice: 译为自然中文“复活了”，不在正文补出“被上帝使……复活”
  alternative: 译为“已经被使从死人中复活”或“上帝已经使他从死人中复活”
  rationale: 希腊文为被动语态，可能含有上帝施行行动的神学背景，但本句没有明说施事者。中文硬译被动不自然，补出“上帝”又会超出本句明示内容，因此保留语义而不擅自补明。
translation_notes:
  register: 采用现代、庄重而口语可懂的普通话。“既然……怎么……”呈现保罗反问中的逻辑张力；不添加原文没有的句首“如今”。
