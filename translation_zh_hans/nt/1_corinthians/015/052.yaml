base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/052.yaml
  text: in an instant[a], in the blink of an eye, at the last trumpet. For the trumpet will sound, and the dead will be raised imperishable, and we will be changed.
translation:
  language: zh_hans
  text: 就在一刹那[a]，一眨眼之间，在末次号筒响起时；因为号筒将要响起，死人将复活，不再朽坏；我们也将改变。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “刹那”对应的希腊词本指“不可分割的”，这里表示短到无法再分的片刻。
    reason: 说明原词的字面含义及其在本句中的时间用法。
lexical_decisions:
- source_word: ἐν ἀτόμῳ
  choice: 就在一刹那
  rationale: ἄτομος本指“不可分割的”，此处作时间用语，表示短到无法再分的片刻。“一刹那”自然传达极短的瞬间，“就在”也承接上文所述事件的突然发生。
- source_word: ἐν ῥιπῇ ὀφθαλμοῦ
  choice: 一眨眼之间
  rationale: 该短语描写眼睛一次极快的动作，强调事情发生得突然迅速；“一眨眼之间”是现代汉语中清楚自然的对应表达。
- source_word: ἐν τῇ ἐσχάτῃ σάλπιγγι
  choice: 末次号筒吹响的时候
  rationale: 保留ἐσχάτῃ“末次”的末世性标记，并将σάλπιγξ按上下文自然译为号筒吹响之时，不加入任何特定末世时间体系。
- source_word: σαλπίσει
  choice: 号筒将要吹响
  rationale: 该动词意为吹号或号筒发声；根据前文的σάλπιγγι补出“号筒”作汉语主语，使句意自然明确。
- source_word: οἱ νεκροὶ
  choice: 死人
  rationale: 指已死之人的整体；“死人”直接、通俗，并与后面的“我们”形成原文中的对照。
- source_word: ἐγερθήσονται
  choice: 将复活
  rationale: ἐγείρω的将来被动形式在本章语境中明确指死人被兴起。汉语通常以“复活”自然表达这一被动事件，避免生硬的“被复活”。
- source_word: ἄφθαρτοι
  choice: 成为不朽坏的
  rationale: ἄφθαρτος表示不再腐朽、败坏。加“成为”说明它描述死人复活后的状态，同时不把原文进一步限定为某种具体身体构造。
- source_word: ἡμεῖς
  choice: 我们
  rationale: 原文明确使用第一人称复数，并以此与“死人”对照；照译而不扩展为“仍然活着的我们”。
- source_word: ἀλλαγησόμεθα
  choice: 也将改变
  rationale: ἀλλάσσω的将来被动表示发生改变。“将改变”在现代汉语中自然，也保留原文未明说改变方式的开放性；“也”对应连接词καί。
theological_decisions:
- issue: 末次号筒与末世事件次序的关系
  choice: 末次号筒吹响的时候
  alternative: 在最后的号筒声中
  rationale: 译文保留“末次号筒”这一明确意象，却不借此加入经文没有说明的末世事件表或宗派性体系。
- issue: “我们”所指的人群
  choice: 我们也将改变
  alternative: 我们这些仍然活着的人也将改变
  rationale: 保留保罗明确使用的第一人称复数，不把上下文所暗示的对照直接扩写进本节，从而保存原文的简洁与张力。
- issue: 死人复活后的不朽坏状态
  choice: 死人将复活，成为不朽坏的
  alternative: 死人将以不朽坏之身复活
  rationale: 原文以ἄφθαρτοι描述复活者的状态，但本句没有明说“身体”；所选译法既传达不再朽坏，也避免增加原文未明言的名词。
translation_notes:
  register: 采用现代、庄重而通俗的标准普通话。“一刹那”“一眨眼之间”保留原文两个并列的极速时间表达；“不朽坏”与本章反复出现的朽坏／不朽坏对比保持术语连贯。
