  text: σπείρεται σῶμα ψυχικόν, ἐγείρεται σῶμα πνευματικόν. ⸀Εἰ ἔστιν σῶμα ψυχικόν, ⸂ἔστιν καὶ⸃ πνευματικόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/044.yaml
  text: It is sown a natural body; it is raised a spiritual body. If there is a natural body[a], there is also a spiritual body.
translation:
  language: zh_hans
  text: 所种下的是属自然生命的身体，复活的是属灵的身体。若有属自然生命的身体，也有属灵的身体[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “属自然生命的身体”也可译作“属魂的身体”。它与“属灵的身体”相对。这里的对照不是物质身体与非物质存在之间的对照，而是受普通受造生命赋活的身体，与受神的灵（圣灵）赋活、以灵为特征的身体之间的对照。
    reason: 说明ψυχικόν的词义选择，并防止将πνευματικόν理解为非身体或非物质的存在。
lexical_decisions:
- source_word: σπείρεται
  choice: 所种的是
  rationale: 保留现在时被动语态及上下文撒种的比喻；汉语用“所种的是”自然承接前文种子与复活的论述。
- source_word: σῶμα
  choice: 身体
  rationale: 直接对应身体，指人在死亡与复活中的具身存在，不弱化为抽象的“形体”。
- source_word: ψυχικόν
  choice: 属血气的
  rationale: ψυχικόν与πνευματικόν形成对照，表示由普通受造生命所支配或赋予活力，而非单指物质性。“属血气的”既沿用易懂的圣经语汇，也避免“物质的”所造成的误解。
- source_word: ἐγείρεται
  choice: 复活的是
  rationale: 在本章复活语境中，ἐγείρεται意为从死里被兴起；译作“复活的是”比字面的“被兴起”更符合现代汉语，同时保留被动含义。
- source_word: πνευματικόν
  choice: 属灵的
  rationale: 保留保罗的术语及其一定的语义张力；这里并非“非物质的”，而是指以灵为特征、受灵赋予生命的身体。
- source_word: Εἰ
  choice: 既
  rationale: 此处条件句以已承认的事实推进论证，现代汉语用“既……也就……”自然表达这种条件兼推论关系；并未把命题改成纯粹因果陈述。
- source_word: καὶ
  choice: 也就
  rationale: 表达第二项的附加与推论意味，契合“既有……也就有……”的汉语结构。
theological_decisions:
- issue: “属血气的身体”与“属灵的身体”的对照
  choice: 正文保留两种身体的对照，并以注释说明这是普通受造生命与灵所赋生命之间的对照，不是物质身体与非物质存在之间的对照。
  alternative: 译作“天然的身体／灵性的身体”或“属魂的身体／属灵的身体”。
  rationale: 原文两处都明确使用σῶμα，故复活后的存在仍称为身体。ψυχικόν与πνευματικόν的对照应予保留，不应通过译文擅自断定“属灵”就是无形或无身体。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“属血气的／属灵的”保留保罗术语上的对称；“所种的是……复活的是……”兼顾原文结构与汉语自然表达。
