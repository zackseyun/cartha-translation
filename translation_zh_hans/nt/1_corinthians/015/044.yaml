    rationale: 现代中文里“血气”常指易怒、冲动的气性，或在圣经语汇中联想到肉体和罪性；本节的ψυχικόν主要指受普通受造生命（ψυχή）赋活的身体，与受圣灵赋活的身体相对。
  - severity: low
    issue: “既有……也就有……”未完全保留原文条件句形式。
    rationale: Εἰ直译为“若／如果”；虽然上下文论证可蕴含推论，用“若……也有……”更贴近原文而仍自然。
  - severity: low
    issue: 原注释中“由灵赋予生命”所指不够明确。
    rationale: 中文“灵”可被理解为人的灵或泛指精神。注释可说明这里通常指神的灵／圣灵，同时不把“属灵”解释成非物质。
  revised_text: 所种下的是属自然生命的身体，复活的是属灵的身体。若有属自然生命的身体，也有属灵的身体[a]。
