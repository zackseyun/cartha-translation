revisions:
- from: 所种的是属血气的身体，复活的是属灵的身体。既有属血气的身体[a]，也就有属灵的身体。
  to: 所种下的是属自然生命的身体，复活的是属灵的身体。若有属自然生命的身体，也有属灵的身体[a]。
  rationale: 修订以“属自然生命的”避免“属血气的”在现代汉语中可能引起的罪性或肉体情欲联想，并保留ψυχικόν与πνευματικόν的术语性对照。将“既”改为“若”以更忠实地反映Εἰ的条件形式；正文仍简洁，必要的语义澄清保留在脚注中。
