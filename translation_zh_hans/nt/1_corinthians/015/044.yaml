review_pass:
  verdict: revise
  source_fidelity: “属血气的”在现代汉语圣经语境中容易联想到肉体、情欲或罪性（通常更接近σάρξ一类概念），未能准确表达ψυχικόν在本节与πνευματικόν相对时“属于普通受造生命”的意思。将其改为“属自然生命的”较能保留原文对照，且不暗示罪性。第二句的Εἰ宜保留为“若”，避免“既……也就……”将条件句的形式强化为汉语因果推论。
  naturalness: “所种下的是……，复活的是……”庄重、通顺，并保留撒种与复活的被动意象。“属自然生命的身体／属灵的身体”在正文中保持术语对称；解释性内容置于注释，避免正文过度释义。
  terminology: σῶμα一致译为“身体”。ψυχικόν译为“属自然生命的”，注中列出“属魂的”这一较贴近字面的替代译法。πνευματικόν保留为“属灵的”，并在注中说明其不表示非身体或非物质的存在；“圣灵”作为保罗此处用语的通常指向可在说明中明确，但不把“圣灵”直接替换进正文。
