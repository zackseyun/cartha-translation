  text: 'Behold[a], I tell you a mystery: we will not all sleep, but we will all be changed[b],'
translation:
  language: zh_hans
  text: 看哪，我告诉你们一个奥秘：并非所有人都要睡去[a]，但所有人都要改变[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “睡去”是新约中常用来指死亡的比喻，在此处的复活语境中尤为如此；也可较直白地译作“死去”。
    reason: lexical_alternative
  - marker: b
    text: 一个显著的异文大意为：“我们都要睡去，但并非所有人都要改变。”正文依SBLGNT所采用的读法。
    reason: textual_variant
lexical_decisions:
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留提示听众注意的庄重语气；这是现代中文圣经语体中清楚而凝练的表达。
- source_word: μυστήριον
  choice: 奥秘
  rationale: 在保罗书信中指从前隐藏、如今由神揭示的真理，并非仅指难解之谜；“奥秘”保留其既有神学含义。
- source_word: ὑμῖν λέγω
  choice: 我告诉你们
  rationale: 自然地保留第一人称宣告和对复数听众的直接称呼。
- source_word: πάντες οὐ κοιμηθησόμεθα
  choice: 我们不是都要睡去
  rationale: 保留κοιμάομαι以睡眠喻死亡的复活语境，并按希腊语表达“不都如此”，避免误译为“我们全都不会死”。
- source_word: πάντες δὲ ἀλλαγησόμεθα
  choice: 但我们都要改变
  rationale: “改变”直接表达末世性的转变；“但”体现δέ在两句之间形成的对比：不是所有人都会死，所有人却都要经历改变。
theological_decisions:
- issue: 复活语境中“睡去”的含义
  choice: 正文保留“睡去”作为肉身死亡的比喻
  alternative: 意译为“死去”
  rationale: 保罗以复活为背景使用睡眠隐喻。保留该隐喻既维持经文间的呼应，也不额外引入关于死后状态的教义判断；脚注说明其所指。
- issue: 经文异文造成的意义张力
  choice: 正文依SBLGNT译作“我们不是都要睡去，但我们都要改变”
  alternative: 一个显著异文大意为“我们都要睡去，但不是都要改变”
  rationale: 所给原文明确支持正文读法；意义重大的异文不纳入正文，但在脚注中如实保存。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”和“奥秘”保留原文宣告的郑重感；句式尽量自然，同时保留睡眠隐喻以及“不都……但都……”的逻辑对比。
