  to: 因为我传给你们最重要的信息，也是我自己所领受的：弥赛亚[a]为我们的罪而死，正如圣经[b]所说的。
  rationale: 修订移除了连词后的不当逗号，并重组首句以更自然地表达“传给”与“领受”的对应及“最重要”的优先性。末句改为直接关联弥赛亚之死与圣经，保留原文κατά的广义对应关系。术语、脚注标记和脚注内容均予保留。
