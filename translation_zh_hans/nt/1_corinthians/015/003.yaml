  text: Παρέδωκα γὰρ ὑμῖν ἐν πρώτοις, ὃ καὶ παρέλαβον, ὅτι Χριστὸς ἀπέθανεν ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν κατὰ τὰς γραφάς,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/003.yaml
  text: 'For I delivered to you as of first importance what I also received: that Messiah died for our sins according to the Scriptures[b][a],'
translation:
  language: zh_hans
  text: 因为我传给你们最重要的信息，也是我自己所领受的：弥赛亚[a]为我们的罪而死，正如圣经[b]所说的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“基督”。希腊语Χριστός在这里可理解为称号“弥赛亚”。
    reason: alternative_reading
  - marker: b
    text: 或译“与圣经相符”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρέδωκα
  choice: 传给了
  rationale: 这里指把自己领受的传统或教导传递给别人；“传给”自然地保留了权威性传承的含义。
- source_word: γὰρ
  choice: 因为
  rationale: γάρ承接上文并作出解释；“因为”在现代汉语中清楚表达这一逻辑关系。
- source_word: ἐν πρώτοις
  choice: 首要信息
  rationale: 此处最自然地表示重要性上的优先，而不只是时间上的先后；“首要”也简洁保留了原文措辞。
- source_word: ὃ καὶ παρέλαβον
  choice: 自己也领受了的
  rationale: 保留“领受”与“传给”之间的对应关系，表明保罗传递的不是自己创出的信息。
- source_word: ὅτι
  choice: ：
  rationale: 汉语用冒号自然地引出所传信息的具体内容，无须机械译出连接词。
- source_word: Χριστὸς
  choice: 弥赛亚
  rationale: 在这一信仰告白式摘要中，Χριστός具有明显的称号意味；“弥赛亚”保留其犹太背景和受膏者身份。
- source_word: ἀπέθανεν
  choice: 死了
  rationale: 简单过去事件在现代汉语中自然译为“死了”，符合此处告白式历史陈述。
- source_word: ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν
  choice: 为我们的罪
  rationale: “为我们的罪”保留ὑπέρ在救赎语境中的宽广含义，不把经文限定为某一种赎罪理论。
- source_word: κατὰ τὰς γραφάς
  choice: 这是照着圣经所说的
  rationale: 表达这件事与圣经相符并照圣经所预示而发生；“圣经”在汉语中作为集合称谓，不必生硬标出希腊语复数。
theological_decisions:
- issue: Χριστός的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处位于早期信仰告白的开头，称号意味突出；正文采用“弥赛亚”，脚注保留读者熟悉的传统译法“基督”。
- issue: ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν的含义范围
  choice: 为我们的罪
  alternative: 因我们的罪；为担当我们的罪
  rationale: 正文不具体断定是原因、代表关系或某种特定的代赎机制，从而保留希腊语本身的神学张力。
- issue: κατὰ τὰς γραφάς的关系
  choice: 照着圣经所说的
  alternative: 与圣经相符
  rationale: 正文表达应验或符合圣经的关系，但不指定某一处经文；脚注说明另一种可行表达。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“领受—传给”保留传统传承的对应关系；“首要信息”避免古奥表达，同时突出重要性。脚注标记均置于正文相应词语之后。
