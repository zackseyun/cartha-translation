  text: οὐ πᾶσα σὰρξ ἡ αὐτὴ σάρξ, ἀλλὰ ἄλλη μὲν ἀνθρώπων, ἄλλη δὲ σὰρξ κτηνῶν, ἄλλη δὲ ⸂σὰρξ πτηνῶν⸃, ἄλλη δὲ ⸀ἰχθύων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/039.yaml
  text: Not all flesh is the same flesh[a], but one kind is of humans, another flesh of animals, another of birds[b], and another of fish.
translation:
  language: zh_hans
  text: 并不是所有的肉体都一样[a]：人的肉体是一类，牲畜的肉体是另一类，飞鸟的又是一类，鱼的又是一类。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“各种肉体并不都一样。”
    reason: 原文 οὐ πᾶσα σὰρξ ἡ αὐτὴ σάρξ 逐字重复“肉体”；正文采用较自然的现代汉语，脚注提供突出类别差异的译法。
lexical_decisions:
- source_word: σὰρξ
  choice: 肉体
  rationale: 此处指受造生物实际的身体构成，并非保罗书信中比喻性的罪性用法；译作“肉体”既保留字面意义，也保留原文的重复和对比。
- source_word: οὐ πᾶσα σὰρξ ἡ αὐτὴ σάρξ
  choice: 并不是所有的肉体都一样
  rationale: 准确表达 οὐ πᾶσα 的部分否定，避免误解为“所有肉体都不相同”；中文省去句末再次重复“肉体”，更自然，而核心对比未丢失。
- source_word: ἄλλη
  choice: 一类……另一类……又是一类
  rationale: ἄλλη 在这里标明类别之间的差异。采用中文的分类句式，保留原文连续列举的节奏。
- source_word: ἀνθρώπων
  choice: 人
  rationale: 泛指人类，不限于男性；“人”在此与牲畜、飞鸟和鱼相对，简明自然。
- source_word: κτηνῶν
  choice: 牲畜
  rationale: κτῆνος 通常指家畜或役畜；“牲畜”比笼统的“动物”更贴近词义，并与飞鸟、鱼等类别形成清楚区分。
- source_word: πτηνῶν
  choice: 飞鸟
  rationale: 该词指会飞的生物，在此受造物分类中译作“飞鸟”自然、庄重，也保留其与飞行相关的词义。
- source_word: ἰχθύων
  choice: 鱼
  rationale: 泛指鱼类；现代汉语中用“鱼”即可表达类别复数。
theological_decisions:
- issue: 保罗在复活语境中使用 σάρξ 的含义
  choice: 按字面译作“肉体”
  alternative: 身体；本性；罪性
  rationale: 本节讨论不同受造生物的肉身形态，为后文阐释复活身体作类比；这里不是指道德上的罪性。保留“肉体”也维持了本段从种子、形体到荣耀之差异的论证张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。正文以冒号引出四类生物，并用“一类／另一类／又是一类”重现希腊文 ἄλλη 的排比。保留“肉体”这一关键词，但避免机械重复造成生硬。
