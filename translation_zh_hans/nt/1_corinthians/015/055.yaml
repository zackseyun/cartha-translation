  text: ποῦ σου, θάνατε, τὸ ⸂νῖκος; ποῦ σου, θάνατε, τὸ κέντρον⸃;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/055.yaml
  text: Where[a], O death, is your victory? Where, O death, is your sting?
translation:
  language: zh_hans
  text: '死亡啊，你的胜利在哪里？[a]

    死亡啊，你的毒刺在哪里？'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本在第一分句作：“死亡啊，你的毒刺在哪里？”这一读法见于《钦定版》等传统译本。
    reason: textual_variant
lexical_decisions:
- source_word: ποῦ
  choice: 在哪里
  rationale: 疑问副词引出带有嘲讽和挑战意味的反问；“在哪里”直接自然，不额外添加原文没有的强调。
- source_word: σου
  choice: 你的
  rationale: 第二人称属格在两处均表示领属，现代汉语自然译作“你的”。
- source_word: θάνατε
  choice: 死亡啊
  rationale: 呼格直接称呼被拟人化的死亡；“死亡啊”保留庄重、诗性的呼告语气。
- source_word: νῖκος
  choice: 胜利
  rationale: 意为胜利或得胜；结合上一节“死亡被胜利吞灭”的语境，译作“胜利”准确清楚。
- source_word: κέντρον
  choice: 毒刺
  rationale: 该词可指刺、螫针或赶牲口的尖棒；此处将死亡拟人化，且下一节解释死亡之刺，译作“毒刺”既形象又符合现代汉语表达。
theological_decisions:
- issue: 第一分句采用何种文本读法
  choice: 按SBLGNT的νῖκος译作“胜利”
  alternative: 依据部分抄本的κέντρον，将第一分句译为“死亡啊，你的毒刺在哪里？”
  rationale: 指定的希腊文底本在第一分句作νῖκος，并与15:54“死亡被胜利吞灭”的上下文紧密相连；同时以脚注保留具有重要传统影响的异文，不将文本差异静默消除。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。两句保持平行结构，以“死亡啊”再现呼格和拟人化，以反问保留原文胜利宣告中的挑战语气。脚注标记置于第一分句后，对应其文本异文。
