  text: and that he was buried[a], and that he has been raised on the third day according to the Scriptures[b],
translation:
  language: zh_hans
  text: 并且他被埋葬了，又在第三天已经复活了，正如圣经所说的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文“已经复活了”是完成时被动形式，指复活已经发生，并可突出其持续至今的意义。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐτάφη
  choice: 被埋葬了
  rationale: 这是 θάπτω 的不定过去时被动形式；“被埋葬了”自然、准确地表达埋葬这一事实，并保留被动语态。
- source_word: ἐγήγερται
  choice: 已经……复活了
  rationale: 这是 ἐγείρω 的完成时被动形式。“已经……复活了”以现代汉语自然表达已经成就并具有持续意义的事件；汉语主句不生硬地直译被动形式，其被动语态信息在脚注中说明。
- source_word: τῇ ἡμέρᾳ τῇ τρίτῃ
  choice: 在第三天
  rationale: 这是表示时间的与格结构，意为“在第三天”；不添加原文没有明说的“之后”。
- source_word: κατὰ τὰς γραφάς
  choice: 正如圣经所说的
  rationale: κατά 在这里表示与圣经见证相符。“正如圣经所说的”符合现代汉语习惯，也保留其依据或应验圣经的含义，而不限定具体经文。
- source_word: ὅτι
  choice: 又说
  rationale: ὅτι 在上下文中引出所传内容。重复“又说”保留原文信条式、逐项陈述的节奏，并使单节中文能够顺畅承接前文。
- source_word: καὶ
  choice: 又
  rationale: 原文重复连接词 καί；译为“又”既保留并列递进结构，也符合现代汉语表达。
theological_decisions:
- issue: 复活动词的时体与语态
  choice: 已经……复活了，并以脚注说明原文为完成时被动形式
  alternative: 已经被使复活了／被复活了
  rationale: 原文完成时表达复活已经发生并具有持续至今的意义，被动语态也可能含蓄指向上帝的行动。现代汉语若直译为“被复活了”较生硬，“被使复活了”又会增加使役措辞，因此正文采用自然表达，脚注保留语法信息。
- issue: “照圣经”所修饰的范围
  choice: 置于复活与第三天陈述之后，译作“正如圣经所说的”
  alternative: 又照圣经所说的，在第三天复活了
  rationale: 原文短语位于句末，可概括“在第三天复活”这一整体陈述。句末位置保留这种范围，不武断限定它只修饰“第三天”或只修饰“复活”。
- issue: “圣经”的所指
  choice: 圣经
  alternative: 犹太人的圣经／圣书
  rationale: γραφαί 在保罗语境中指公认的神圣经卷；“圣经”简洁准确，不加入原文未明说的历史限定。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。重复“又说”以保留原文信条式并列结构；“已经……复活了”兼顾现代汉语自然度与希腊语完成时意义，语态细节由脚注补足。
