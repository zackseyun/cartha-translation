  text: εἰ δὲ ἀνάστασις νεκρῶν οὐκ ἔστιν, οὐδὲ Χριστὸς ἐγήγερται·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/013.yaml
  text: But if there is no resurrection of the dead[b][a], then not even Messiah has been raised.
translation:
  language: zh_hans
  text: 但如果没有死人复活，那么连弥赛亚[a]也没有被复活[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“基督”。希腊语称号Χριστός意为“受膏者”；这里译作“弥赛亚”，以保留这一称号的含义。
    reason: alternative_reading
  - marker: b
    text: 也可译作“复活了”。希腊语动词采用被动形式，直译为“被复活”，可能暗示上帝的行动，却没有明说施事者。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: 但如果
  rationale: εἰ引出条件，δέ表示轻微转折并承接上文；“但如果”自然地保留保罗论证的转折。
- source_word: ἀνάστασις νεκρῶν οὐκ ἔστιν
  choice: 根本没有死人复活这回事
  rationale: 用现代汉语的存在句表达οὐκ ἔστιν对复活之真实性或存在的否定；“死人复活”保留ἀνάστασις νεκρῶν所指死者这一类人的复活，而“根本”传达否定在论证中的明确力度。
- source_word: οὐδὲ
  choice: 也就没有
  rationale: 既保留“也不”的递进否定，又以“就”自然显明这是由前一条件推出的结论。
- source_word: Χριστὸς
  choice: 弥赛亚
  rationale: Χριστός在这里作为称号，意为“受膏者”；译作“弥赛亚”保留称号的含义，而不是把它仅当作名字。
- source_word: ἐγήγερται
  choice: 被复活
  rationale: 该词是完成时被动语态；“被复活”保留被动形式和已经发生之行动的持续相关性，同时不在正文中擅自补出施事者。
theological_decisions:
- issue: Χριστός的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处是保罗论述受膏者复活的神学命题，称号意味清楚；采用“弥赛亚”使其含义对现代读者可见，同时脚注保留传统译名。
- issue: ἐγήγερται的语态
  choice: 没有被复活
  alternative: 没有复活
  rationale: 原文使用被动语态，可能暗示上帝的行动，却没有明说施事者。正文保留被动，不将其改成不及物表达，也不直接加入“上帝”。
- issue: ἀνάστασις νεκρῶν的范围
  choice: 死人复活这回事
  alternative: 从死人中复活
  rationale: νεκρῶν是复数属格，指死者作为一类；这里讨论的是死者复活是否存在，并非仅表示某人“从死人中”出来。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“根本没有……这回事”是自然的存在否定表达；“被复活”虽略带书面色彩，但为保留希腊语被动语态及其神学张力而采用。
