language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ σώματα ἐπουράνια, καὶ σώματα ἐπίγεια· ἀλλὰ ἑτέρα μὲν ἡ τῶν ἐπουρανίων δόξα, ἑτέρα δὲ ἡ τῶν ἐπιγείων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/040.yaml
  text: And there are heavenly bodies and earthly bodies; but the glory of the heavenly is one kind[a], and the glory of the earthly is another.
translation:
  language: zh_hans
  text: 也有天上的形体，也有地上的形体[a]；但天上形体的荣光是一种，地上形体的荣光又是另一种。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“也有天体，也有地上的物体。”
    reason: 说明本句也可按天文学与地上物体的对比来理解，但正文保留较宽泛的表达。
lexical_decisions:
- source_word: σώματα
  choice: 形体
  rationale: “形体”保留“有形、有身体的存在”这一宽泛含义，又比“身体”更适合同时修饰“天上的”和“地上的”，不把所指限定为人、天使或天文学意义上的天体。
- source_word: ἐπουράνια
  choice: 天上的
  rationale: 表达“属于天上、在天上的”基本含义，并保留它既可能指天界存在，也可能让人联想到天体的开放性。
- source_word: ἐπίγεια
  choice: 地上的
  rationale: 与“天上的”构成自然对举，表达“属于地上、在地上的”，避免采用过于技术化的“地球的”。
- source_word: ἀλλὰ
  choice: 但
  rationale: 简洁体现前后对比关系。
- source_word: ἑτέρα μὲν ... ἑτέρα δὲ
  choice: 一种……又是另一种
  rationale: 体现两者在类别或性质上的差异，同时保留希腊文平衡的对举结构。
- source_word: δόξα
  choice: 荣光
  rationale: “荣光”既可表达可见的光辉、华美，也保留δόξα在保罗书信中的神学词汇联系；“亮度”会把含义过度缩窄为物理现象。
- source_word: τῶν ἐπουρανίων ... τῶν ἐπιγείων
  choice: 天上形体的……地上形体的
  rationale: 希腊文省略了前文的σώματα；中文补出“形体”可避免“天上的荣光”被误解为泛指天堂的荣光，同时保持语意清楚。
theological_decisions:
- issue: “天上的形体”和“地上的形体”具体指什么
  choice: 采用宽泛的“天上的形体”和“地上的形体”，不限定具体所指
  alternative: 译作“天体和地上的物体”，或“天上的众生和地上的众生”
  rationale: 原文使用σώματα（形体），上下文借不同形体及其不同荣光说明复活。译文不应擅自把它仅限于天文学上的星体，也不应加入原文没有明说的天使或其他众生观念。
- issue: δόξα在本节中的含义
  choice: 译作“荣光”
  alternative: 译作“光辉”或“亮度”
  rationale: 这里含有可见光辉、华美之意，但“荣光”还能保留保罗神学用语的广度，不把论述化约成单纯的物理明亮程度。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“形体”略带经文语体，但在本节能自然涵盖不同类别的身体或有形存在；句式保留原文两组对举，并以“又是另一种”呈现差异。
