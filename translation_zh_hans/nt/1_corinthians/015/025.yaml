base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/025.yaml
  text: For he must reign until he has put all his enemies under his feet[a][b].
translation:
  language: zh_hans
  text: 因为基督必须作王，直到所有仇敌都被放在他脚下[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“直到他把所有仇敌都放在自己脚下。”希腊语动词的施事者没有明说；此处用被动句式，避免断定是基督还是上帝施行这动作。
    reason: lexical_alternative
  - marker: b
    text: “放在他脚下”是圣经中表示完全制伏仇敌的形象；参诗篇 110:1。
    reason: cross_reference
lexical_decisions:
- source_word: δεῖ
  choice: 必须
  rationale: 表达必要性或神圣计划中必然成就之事；“必须”简洁自然，并保留原文的力度。
- source_word: γὰρ
  choice: 因为
  rationale: 承接并说明上一节所述之事的根据；现代汉语用“因为”能清楚呈现解释关系。
- source_word: αὐτὸν
  choice: 基督
  rationale: 原文为代词“他”，其所指由上下文（第22—24节）可知是基督。汉语在此明确为“基督”，可避免句首代词指向含混，而不增加新的所指。
- source_word: βασιλεύειν
  choice: 作王
  rationale: 保留王权统治的含义；“作王”是自然、庄重且具有圣经语体辨识度的现代汉语表达。
- source_word: ἄχρι οὗ
  choice: 直到
  rationale: 标明时间界点，但这个结构本身并不说明基督在该界点之后是否停止作王。
- source_word: θῇ
  choice: 把……放在
  rationale: τίθημι在此与“脚下”构成征服意象。“把……放在”直接保留原文动作和比喻，也自然适合汉语。
- source_word: πάντας τοὺς ἐχθρούς
  choice: 所有仇敌
  rationale: “所有”保留πάντας的周全范围；定冠词在此不宜机械译出。其为谁的仇敌可由句中的“他的脚下”及上下文明确，不必另加原文没有的物主词。
- source_word: ὑπὸ τοὺς πόδας αὐτοῦ
  choice: 在他的脚下
  rationale: 直接保留圣经中表示完全制伏的形象，并与诗篇110:1的用语形成可辨认的呼应。
theological_decisions:
- issue: “直到”（ἄχρι οὗ）的时间含义
  choice: 译作“直到”，不暗示基督在仇敌被制伏后便不再作王。
  alternative: 把这一时间界点理解并译成基督王权终止的时刻。
  rationale: 原文只把当前论述聚焦于仇敌全被置于他脚下之前的作王，并未凭这个连接语本身断言其后王权终止；译文保留这种神学张力。
- issue: θῇ的主语
  choice: 按希腊语最直接的句法，将“他”理解为基督，即基督把仇敌放在自己脚下。
  alternative: 根据诗篇110:1的背景，将隐含施事者理解为上帝，即“直到上帝把仇敌放在他脚下”。
  rationale: θῇ没有明示主语，最自然地承接本句的αὐτόν；但经文互文背景容许读者意识到上帝的施事角色。正文不另行加入“上帝”，以免消除原文可感知的张力。
translation_notes:
  register: 采用现代、庄重且普通读者易懂的简体中文。“作王”保留王权语义和经文互文色彩；句式尽量简洁。正文中所有脚注标记均已对应列出。
