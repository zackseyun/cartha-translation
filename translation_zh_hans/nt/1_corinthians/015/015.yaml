  text: εὑρισκόμεθα δὲ καὶ ψευδομάρτυρες τοῦ θεοῦ, ὅτι ἐμαρτυρήσαμεν κατὰ τοῦ θεοῦ ὅτι ἤγειρεν τὸν Χριστόν, ὃν οὐκ ἤγειρεν εἴπερ ἄρα νεκροὶ οὐκ ἐγείρονται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/015.yaml
  text: Then we are even found to be false witnesses about God[a], because we testified about God that he raised the Messiah[b], whom he did not raise if in fact the dead are not raised.
translation:
  language: zh_hans
  text: 这样，我们甚至会被认定为关于上帝的假见证者[a]，因为我们曾作了反对上帝的见证，说他使弥赛亚[b]复活了；如果死人确实不会复活，那么他也没有使弥赛亚复活。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“上帝的假见证者”。“假见证者”后的希腊语属格可指见证所关涉的对象，即关于上帝；紧接着的“反对上帝”则表明，这假见证在语境中是与上帝相抵触的。
    reason: lexical_alternative
  - marker: b
    text: 希腊文为“基督”；这里译作“弥赛亚”，因为Χριστός在本节中用作称号。
    reason: alternative_reading
lexical_decisions:
- source_word: εὑρισκόμεθα
  choice: 会被认定是
  rationale: 保留被动语态所表达的“被查明、被判定为”之意；结合假设论证，用“会”自然体现推论结果。
- source_word: δὲ καὶ
  choice: 这样，我们甚至
  rationale: “这样”承接上文的逻辑推论，“甚至”保留καί在此的递进强调。
- source_word: ψευδομάρτυρες τοῦ θεοῦ
  choice: 作假见证敌对上帝的人
  rationale: ψευδομάρτυρες译作“作假见证的人”；τοῦ θεοῦ本身可表示见证所关涉的对象，而紧接的κατὰ τοῦ θεοῦ支持在正文中表达更强的敌对意味。
- source_word: ἐμαρτυρήσαμεν κατὰ τοῦ θεοῦ
  choice: 我们作见证说……（因而）敌对上帝
  rationale: κατά加属格通常有“反对、敌对”之意；中文将其与前面的“作假见证敌对上帝”连贯表达，再以“作见证说”引出见证内容，避免生硬重复。
- source_word: ἤγειρεν
  choice: 使……复活了
  rationale: 准确表达ἐγείρω在复活语境中的及物用法，清楚表明上帝是施行复活者。
- source_word: τὸν Χριστόν
  choice: 弥赛亚
  rationale: 此处Χριστός带冠词，并在保罗关于复活的论证中具有称号功能，因此译出其“受膏者／弥赛亚”的意义。
- source_word: εἴπερ ἄρα
  choice: 如果……确实
  rationale: 表达这一条件是为论证而提出，并保留“果真如此”的强调意味。
- source_word: νεκροὶ οὐκ ἐγείρονται
  choice: 死人确实不会复活
  rationale: “死人”自然表达实体化形容词νεκροί；“不会复活”在中文中自然传达一般性否定命题，语境仍清楚表明复活是上帝的作为。
theological_decisions:
- issue: κατὰ τοῦ θεοῦ的语义力度
  choice: 敌对上帝
  alternative: 关于上帝
  rationale: κατά加属格最直接的意义是“反对、敌对”。保罗的张力在于：若死人不复活，使徒把上帝没有做的事归给上帝，便不只是陈述错误，更是在作假见证敌对上帝。脚注保留“关于上帝”这一较弱理解。
- issue: Χριστός的称号功能
  choice: 弥赛亚
  alternative: 基督
  rationale: 本节的定冠词和论证语境支持将Χριστός作为称号理解；正文译为“弥赛亚”，脚注注明传统音译“基督”。
- issue: 复活的施动者
  choice: 上帝使……复活
  alternative: ……复活了
  rationale: 原文ἤγειρεν为主动及物形式，明确以上帝为主语；译文保留这一神学上重要但也是语法明示的施动关系。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“作假见证”保留司法和公开见证的语感；用两个句子呈现长句的论证层次，同时以“可是”清楚引出反事实条件。
