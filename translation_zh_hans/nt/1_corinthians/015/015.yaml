  to: 这样，我们甚至会被认定为关于上帝的假见证者[a]，因为我们曾作了反对上帝的见证，说他使弥赛亚[b]复活了；如果死人确实不会复活，那么他也没有使弥赛亚复活。
  rationale: 修订严格按原文句法分别呈现“关于上帝的假见证者”（ψευδομάρτυρες τοῦ θεοῦ）和“作了反对上帝的见证”（ἐμαρτυρήσαμεν κατὰ τοῦ θεοῦ）。这既保留κατά加属格的对立力度，也不把该短语错误地归入前一名词短语。条件句保留“确实”的强调，并以重复“弥赛亚”清楚表达关系从句所指。
