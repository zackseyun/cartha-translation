  text: Τοῦτο δέ φημι, ἀδελφοί, ὅτι σὰρξ καὶ αἷμα βασιλείαν θεοῦ κληρονομῆσαι οὐ ⸀δύναται, οὐδὲ ἡ φθορὰ τὴν ἀφθαρσίαν κληρονομεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/050.yaml
  text: 'I say this[a], brothers: flesh and blood cannot inherit the kingdom of God[b], nor does the perishable inherit the imperishable.'
translation:
  language: zh_hans
  text: 弟兄们[a]，我这样说：血肉之躯[b]不能承受上帝的国；必朽坏的也不能承受不朽坏的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄们”也可理解为“弟兄姊妹们”；希腊文直译为“弟兄们”，在这里可能包括全体会众。
    reason: lexical_alternative
  - marker: b
    text: “血肉之躯”是指人目前必死、会朽坏的生命状态，并不是否认身体复活。
    reason: cultural_note
lexical_decisions:
- source_word: Τοῦτο δέ φημι
  choice: 我是说
  rationale: 自然表达保罗承接上文所作的说明；不添加原文没有的时间副词，同时由语序和冒号体现转折、解释功能。
- source_word: ἀδελφοί
  choice: 弟兄们
  rationale: 保留希腊文阳性复数称呼；在保罗书信中可包括全体会众，故以脚注说明其包容性用法。
- source_word: σὰρξ καὶ αἷμα
  choice: 血肉之躯
  rationale: 保留“血肉”意象，并用现代汉语自然习语表达今世会朽坏的肉身生命，避免被误解为单指血液和肌肉。
- source_word: βασιλείαν θεοῦ
  choice: 上帝的国
  rationale: 清楚保留属格结构及该短语的神学分量。
- source_word: κληρονομῆσαι / κληρονομεῖ
  choice: 承受
  rationale: “承受”是圣经语境中自然、凝练的对应词，兼具领受产业和进入所有的含义，并保留两处平行。
- source_word: οὐ δύναται
  choice: 不能
  rationale: 准确、简洁地表达能力上的否定。
- source_word: ἡ φθορά
  choice: 必朽坏的
  rationale: 在复活语境中指受败坏、衰残和死亡支配的存在；与后面的“不朽坏”形成明确对应。
- source_word: τὴν ἀφθαρσίαν
  choice: 不朽坏的
  rationale: 保留与 φθορά 的词根对照；不译作“不死”，以免与 ἀθανασία 混同。
theological_decisions:
- issue: “血肉”与身体复活的关系
  choice: 理解为人目前必死、会朽坏的生命状态，而非否定身体本身可以复活。
  alternative: 理解为物质身体本身绝不能进入上帝的国。
  rationale: 上下文所论的是身体从必朽坏转变为不朽坏，而不是弃绝身体；正文保留原文意象，脚注防止反身体化误读。
- issue: ἀδελφοί 的指称范围
  choice: 正文译作“弟兄们”，脚注注明也可能包括姊妹。
  alternative: 正文直接译作“弟兄姊妹们”。
  rationale: 既保留原文的阳性形式，也向现代读者说明其在会众称呼中可能具有的包容范围。
- issue: φθορά 与 ἀφθαρσία 的对照
  choice: 译作“必朽坏的”与“不朽坏的”。
  alternative: 译作“败坏”与“不败坏”，或“必死的”与“不死的”。
  rationale: 这一译法保留同词根式的鲜明对照，也避免将“不朽坏”完全等同于“不死”。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“我是说”承接上文并引出结论；“血肉之躯”比生硬的“肉和血”更符合现代汉语，同时保留原文意象。两次“承受”及“朽坏／不朽坏”的重复刻意保留原文平行结构。
