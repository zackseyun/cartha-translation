  text: ἔπειτα ὤφθη ἐπάνω πεντακοσίοις ἀδελφοῖς ἐφάπαξ, ἐξ ὧν οἱ ⸀πλείονες μένουσιν ἕως ἄρτι, τινὲς ⸀δὲ ἐκοιμήθησαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/006.yaml
  text: Then he appeared to more than five hundred brothers at one time[a], most of whom remain until now[b], though some have fallen asleep.
translation:
  language: zh_hans
  text: 后来，他一次向五百多位弟兄[a]显现；其中大多数至今仍然在世，但有些已经睡了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“弟兄姊妹”。希腊文直译为“弟兄”；在早期基督徒的用语中，这个词有时也可指更广泛的信徒群体。
    reason: lexical_alternative
  - marker: b
    text: 意思是他们已经去世。保罗沿用以“睡了”指死亡的说法；在这里，这一说法与复活的盼望相呼应。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπειτα
  choice: 后来
  rationale: 表示保罗按次序列举复活后的显现；“后来”自然地承接上文。
- source_word: ὤφθη
  choice: 显现
  rationale: 该被动形式在复活显现的语境中通常表达“向人显现”；承接上文可知主语是基督。
- source_word: ἐπάνω πεντακοσίοις
  choice: 五百多位
  rationale: ἐπάνω与数词连用表示“超过”；“五百多位”符合现代汉语表达。
- source_word: ἀδελφοῖς
  choice: 弟兄
  rationale: 保留希腊文阳性复数的形式；早期基督徒用语中也可能泛指信徒群体，因此以脚注说明。
- source_word: ἐφάπαξ
  choice: 同时
  rationale: 此处强调基督在同一次场合向这五百多人显现，而不是分别显现。
- source_word: ἐξ ὧν οἱ πλείονες
  choice: 其中大多数
  rationale: 自然表达希腊文的部分关系及“较多数、绝大部分”之意。
- source_word: μένουσιν ἕως ἄρτι
  choice: 直到如今仍在
  rationale: 尽量保留μένω“留存、仍在”的措辞；语境表明这些见证人当时仍然活着。
- source_word: τινὲς δὲ
  choice: 不过有些
  rationale: δέ在这里构成轻微转折，对照仍在的多数人与已经去世的少数人。
- source_word: ἐκοιμήθησαν
  choice: 已经睡了
  rationale: 保留“睡了”这一指死亡的比喻；在本章复活主题下，这一措辞具有重要语境作用。
theological_decisions:
- issue: ἀδελφοῖς是否明确包含女性
  choice: 正文译作“弟兄”，脚注说明也可能泛指信徒群体
  alternative: 弟兄姊妹
  rationale: 希腊文形式是阳性复数，但早期基督徒用语有时可以包含更广泛的信徒群体；正文不替原文消除这一含混。
- issue: ἐκοιμήθησαν在复活语境中的表达
  choice: 已经睡了
  alternative: 已经去世了
  rationale: 保罗以睡眠比喻死亡，这与本章对复活的论述相呼应；保留比喻可避免削平原文的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“五百多位”符合汉语数量表达；“直到如今仍在”略带经文语体，以保留原文“仍然留存”的含义；“已经睡了”刻意保留保罗的死亡隐喻，并由脚注释明。
