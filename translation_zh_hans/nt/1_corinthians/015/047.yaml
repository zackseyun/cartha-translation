base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/047.yaml
  text: The first man was from the earth[a], made of dust; the second man is from heaven.
translation:
  language: zh_hans
  text: 第一个人出于地，是属尘土的[a]；第二个人出于天。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“尘土所造的”或“属土的”。希腊语形容词χοϊκός呼应亚当由尘土受造。
    reason: lexical_alternative
lexical_decisions:
- source_word: πρῶτος
  choice: 第一个
  rationale: 保留序数含义，并与后文“第二个”形成清楚、对称的亚当与基督之对照。
- source_word: ἄνθρωπος
  choice: 人
  rationale: 此处单数所指分别是亚当和基督；“人”在现代汉语中自然，也保留代表性人物的类型关系。
- source_word: ἐκ γῆς
  choice: 出于地
  rationale: ἐκ与γῆ表示来源；“出于地”既简洁庄重，也保留创世记中人从地而出的呼应。
- source_word: χοϊκός
  choice: 属尘土的
  rationale: 该形容词表示由尘土构成或具有尘土性质，呼应亚当由尘土受造；“属尘土的”也可与“出于天”形成自然对照。
- source_word: δεύτερος
  choice: 第二个
  rationale: 保留序数及与“第一个”的平行结构。
- source_word: ἄνθρωπος
  choice: 人
  rationale: 重复“人”，保留原文“第一个人……第二个人”的刻意平行，不明加“基督”。
- source_word: ἐξ οὐρανοῦ
  choice: 出于天
  rationale: 表示来源于天；“天”在此语境中保留超越性的含义，并与“地”形成简洁对照。
theological_decisions:
- issue: “第二个人”的基督论所指
  choice: 保留“第二个人”，不明加“基督”
  alternative: 第二个人基督出于天
  rationale: 上下文表明所指是基督，但本节希腊文没有直接写出其名；保留原文措辞可维持亚当—基督类型关系而不作解释性增补。
- issue: 第二分句的系词时态
  choice: 采用无显式系词的汉语名词性结构：“第二个人出于天”
  alternative: 第二个人是出于天的／第二个人从天而来
  rationale: 希腊文第二分句没有明写系词。汉语可自然省略“是”，因而既表达现时断言，也避免把原文未标明的时态过度具体化；同时不把来源改写成行动性的“从天而来”。
- issue: χοϊκός与ἐκ γῆς的关系
  choice: 分别译作“出于地，是属尘土的”
  alternative: 从地而来，由尘土所造
  rationale: 原文先陈明来源，再以形容词描述性质或构成。分别翻译可保留其语义重叠及创世叙事的回声，而不把形容词完全解释为被动受造动作。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以“出于地／出于天”保存原文紧密的来源对照，以“第一个人／第二个人”保存平行结构。脚注说明χοϊκός的主要词义范围及创世记背景。
