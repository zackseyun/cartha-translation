  text: καὶ ὃ σπείρεις, οὐ τὸ σῶμα τὸ γενησόμενον σπείρεις ἀλλὰ γυμνὸν κόκκον εἰ τύχοι σίτου ἤ τινος τῶν λοιπῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/037.yaml
  text: And what you sow[a], you do not sow the body that will be, but a bare kernel[c][b], perhaps of wheat or of some other kind.
translation:
  language: zh_hans
  text: 你所撒的，并不是将来会有的身体，而是一粒裸露的种子，或许是麦子，或是别的某一种。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπείρεις
  choice: 撒
  rationale: 采用现代汉语中“撒种”的常用农业用语，保留保罗反复使用的播种意象。
- source_word: σῶμα
  choice: 身体
  rationale: 直译保罗在复活论述中的关键用词，保留种子比喻与复活身体之间有意形成的对应，不弱化为“形态”。
- source_word: τὸ γενησόμενον
  choice: 那将要形成的
  rationale: 表达γίνομαι所含的未来生成之意，同时不把它限定为单纯的植物生长。
- source_word: γυμνὸν κόκκον
  choice: 一粒光秃的籽粒
  rationale: “光秃”表达γυμνός的无遮蔽、未附加之意；“籽粒”兼顾κόκκος作为种子或谷粒的含义，也适合后文以麦粒举例。
- source_word: εἰ τύχοι
  choice: 或许是
  rationale: 这一习语在此引出可能的例子；“或许是”简洁自然，并保留不确定、举例性的语气。
- source_word: σίτου
  choice: 麦粒
  rationale: σῖτος在这里最自然地指麦子；结合“一粒籽粒”的量词和语境，译作“麦粒”清楚自然。
- source_word: τινος τῶν λοιπῶν
  choice: 其他种类的籽粒
  rationale: 表达其余各类种子中的某一种；汉语补出“籽粒”，使所指明确而不改变原意。
theological_decisions:
- issue: 种子与复活身体的关系
  choice: 保留“身体”以及未来形成的措辞，不在译文中进一步解释两者的连续性或差异。
  alternative: 意译为“将来长成的植物”或“将来的形态”。
  rationale: 本节以农业现象说明复活，但原文仍使用复活论述中的关键词“身体”。保留这一措辞可维持比喻及其神学张力，避免将经文缩减为纯植物学描述。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“那将要形成的身体”有意保留原文略显突出的“身体”意象；后半句用“麦粒”和“其他种类的籽粒”使农业比喻在汉语中清晰可懂。
