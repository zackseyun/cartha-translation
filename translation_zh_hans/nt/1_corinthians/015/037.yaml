  rationale: 修订以“将来会有的身体”对应τὸ γενησόμενον，既保留未来指向，也不预设具体形成机制。以“裸露的一粒种子”自然表达γυμνὸν κόκκον；末句按εἰ τύχοι…ἤ…保留“或许”的举例语气，并以“别的某一种”表达“其余种类之一”。脚注锚点置于“裸露的一粒种子”之后。
