  naturalness: 修订后保留庄重、清楚的现代标准汉语。“裸露的一粒种子”比“光秃的籽粒”更自然；“或是别的某一种”自然表达原文的举例性和“其余种类之一”。
  terminology: 保留“撒”“身体”“种子”“麦子”，维持本段复活论述中σῶμα（身体）的关键词和农业比喻，不增添神学解释。
  issues:
  - severity: medium
    issue: “那将要形成的身体”对τὸ γενησόμενον的表述偏窄且略显生硬。
    rationale: γενησόμενον指“将要成为／将会有的”，并未明确说“形成”；“形成”容易把措辞具体化为生长或成形过程。
  - severity: low
    issue: “光秃的籽粒”不合现代汉语的通常搭配。
    rationale: γυμνόν在此是“裸露的、没有外在附着物的”；以“裸露的一粒种子”表达更自然，也保留比喻的开放性。
  - severity: low
