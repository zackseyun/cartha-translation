id: 1CO.15.17
reference: 1 Corinthians 15:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἰ δὲ Χριστὸς οὐκ ἐγήγερται, ματαία ἡ πίστις ⸀ὑμῶν, ἔτι ἐστὲ ἐν ταῖς ἁμαρτίαις ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/017.yaml
  text: But if Messiah has not been raised[a], your faith is futile[b]; you are still in your sins.
translation:
  language: zh_hans
  text: 但如果弥赛亚没有被复活[a]，你们的信就是徒然的[b]；你们仍在自己的罪中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弥赛亚”传统上译作“基督”；“被复活”也可译作“复活了”。
    reason: 称号及语态的译法说明
  - marker: b
    text: “徒然的”也可译作“无效的”或“没有用的”。
    reason: 词义备选
lexical_decisions:
- source_word: Χριστὸς
  choice: 弥赛亚
  rationale: 此处作为称号使用，译为“弥赛亚”可体现“受膏者”的身份；不把传统音译“基督”直接当作姓名处理。
- source_word: ἐγήγερται
  choice: 被复活
  rationale: 希腊语为完成时被动形式，既指已经发生的复活事件，也强调其持续至今的结果；被动表达保留了未明说施事者的神圣被动意味。
- source_word: ματαία
  choice: 徒然的
  rationale: 表示无效、不能达到目的；“徒然”在现代汉语中简洁庄重，也比“虚空”更准确地传达此处论证中的无效性。
- source_word: πίστις
  choice: 信
  rationale: 此处指哥林多人所持的信仰或相信，不主要表示“忠信”；“你们的信”自然且符合上下文。
- source_word: ἔτι
  choice: 仍
  rationale: 表达若弥赛亚未被复活，他们的罪中状态便持续不变。
- source_word: ἐν ταῖς ἁμαρτίαις ὑμῶν
  choice: 在自己的罪中
  rationale: 保留介词结构及复数“罪”，表达仍处于自身诸罪所构成的状态之中，不额外限定为罪责或罪的权势。
- source_word: δὲ
  choice: 但
  rationale: 承接上文的反事实论证并形成转折，“但”最自然地体现其对比功能。
theological_decisions:
- issue: 复活措辞与施事者
  choice: 没有被复活
  alternative: 没有复活
  rationale: 被动译法对应ἐγήγερται的语态，并保留施事者没有明说这一点；不擅自补出“被上帝复活”。
- issue: Χριστός的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处突出受膏者的身份与其复活在保罗论证中的意义，故采用称号性译法；脚注提供中文读者更熟悉的传统译名。
- issue: 仍在罪中的含义
  choice: 仍在自己的罪中
  alternative: 仍受自己的罪辖制／仍担当自己的罪责
  rationale: 原文没有明确区分罪责、罪的权势或罪中状态，因此保留较宽的表达，不在正文中把神学含义缩窄。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“被复活”略带书面色彩，但能准确保留希腊语被动形式；分号呈现后半句作为前述判断的直接结果。
