  text: εἰ γὰρ νεκροὶ οὐκ ἐγείρονται, οὐδὲ Χριστὸς ἐγήγερται·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/016.yaml
  text: For if the dead are not raised[a], not even Messiah has been raised.
translation:
  language: zh_hans
  text: 因为死人若不复活，连弥赛亚[a]也没有复活了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“基督”。希腊语称号Χριστός既可译作“弥赛亚”，也可按长久以来的传统译作“基督”。
    reason: 提供Χριστός的传统替代译法，并说明两种译名的关系。
lexical_decisions:
- source_word: εἰ γὰρ
  choice: 因为……若……
  rationale: 以“因为”表达γάρ承接并解释上文的论证，以“若”保留εἰ所引出的条件关系，符合现代汉语语序。
- source_word: νεκροὶ
  choice: 死人
  rationale: 该复数形容词在此作名词使用，泛指已经死去的人；“死人”简洁自然，并保留其总括性。
- source_word: οὐκ ἐγείρονται
  choice: 不复活
  rationale: 原文是现在时被动语态，处于复活语境中。汉语“复活”通常自然表达这一概念；若机械译成“不被复活”会显得生硬。译文不加入施动者，也不把条件改成能力或可能性。
- source_word: οὐδὲ
  choice: 连……也不
  rationale: 这一结构自然传达οὐδέ的递进强调：若死人不复活，那么连弥赛亚也不例外。
- source_word: Χριστὸς
  choice: 弥赛亚
  rationale: Χριστός在此保有称号意义，指受膏者；“弥赛亚”使这一称号含义清楚可见。传统译名“基督”列入脚注。
- source_word: ἐγήγερται
  choice: 没有复活了
  rationale: 原文为完成时被动语态，表示已经发生且结果持续的事件；“没有……了”在自然汉语中表达截至当前并未发生的结果状态。未机械保留被动形式，以免译文生硬。
theological_decisions:
- issue: 复活动词的被动语态与神的施动
  choice: 用自然汉语“复活”，不明说施动者
  alternative: 被复活
  rationale: 原文被动形式可暗示神使人复活，但本句没有明说施动者。汉语“被复活”不够自然，因此采用“复活”，同时不添加“神使……复活”，以免把隐含信息提升为明说。
- issue: Χριστός在本节中的称号含义
  choice: 弥赛亚
  alternative: 基督
  rationale: “弥赛亚”直接呈现“受膏者”这一称号功能，适合本节关于其复活的神学论证；“基督”是历史悠久且广为人知的传统译法，故在脚注中保留。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“因为……若……”保持保罗承接上文的论证推进；“连……也……”突出结论的递进力度。脚注标记紧接其所解释的“弥赛亚”。
