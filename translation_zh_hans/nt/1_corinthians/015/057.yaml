  text: τῷ δὲ θεῷ χάρις τῷ διδόντι ἡμῖν τὸ νῖκος διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/057.yaml
  text: But thanks be to God[a], who gives us the victory through our Lord Jesus the Messiah.
translation:
  language: zh_hans
  text: 然而，感谢神！他借着我们的主耶稣，即弥赛亚[a]，把胜利赐给我们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弥赛亚”在此对应希腊文 Χριστός，意思是“受膏者”；传统译作“基督”。
    reason: 提供传统译法，并说明原文称号的含义。
lexical_decisions:
- source_word: δὲ
  choice: 然而
  rationale: 承接上文死亡被胜利吞灭的论述，标示转折并引出感恩；“然而”比单用“但”更适合庄重的颂赞语气。
- source_word: χάρις
  choice: 感谢
  rationale: χάρις 在“感谢归给神”这一惯用表达中表示感恩，而不是此处常见的另一义项“恩典”。
- source_word: τῷ θεῷ χάρις
  choice: 感谢神
  rationale: 按现代汉语的自然感叹表达处理希腊文省略系词的颂赞公式，保留其直接、庄重的感恩语气。
- source_word: τῷ διδόντι
  choice: 他……把……赐给
  rationale: 现在分词作实词使用，描述神是赐予者；“赐给”兼顾持续或一般性的施予含义及庄重语体。
- source_word: ἡμῖν
  choice: 给我们
  rationale: 准确表达与格间接宾语，语境中指信徒群体。
- source_word: τὸ νῖκος
  choice: 胜利
  rationale: 指向上文战胜死亡的特定胜利；汉语中无需机械添加定指词。
- source_word: διὰ
  choice: 借着
  rationale: διά 加属格表示途径或媒介；“借着”准确保留这种关系。
- source_word: τοῦ κυρίου ἡμῶν
  choice: 我们的主
  rationale: 保留 κύριος 的基督论称号和 ἡμῶν 的所属关系。
- source_word: Ἰησοῦ Χριστοῦ
  choice: 耶稣弥赛亚
  rationale: 保留名字在前、称号在后的次序，并使 Χριστός 的称号意义清楚可见；脚注列出传统译名“基督”。
theological_decisions:
- issue: Χριστός 在 Ἰησοῦ Χριστοῦ 中应作为称号翻译还是采用传统固定译名
  choice: 正文作“弥赛亚”
  alternative: “基督”
  rationale: Χριστός 本义为“受膏者”，在这里虽已呈现一定的姓名化用法，称号含义仍然存在。正文采用普通读者能够识别其称号性质的“弥赛亚”，同时用脚注保留传统译法，避免把两种理解无声地合并。
translation_notes:
  register: 采用现代、庄重且易懂的汉语。“然而，感谢神！”以独立感叹句呈现原文的颂赞力度；后一句清楚表达神是赐胜利者，以及这胜利借着主耶稣而来。
