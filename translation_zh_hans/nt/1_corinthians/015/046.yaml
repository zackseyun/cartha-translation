base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/046.yaml
  text: But the spiritual is not first[a], but the natural[b]; afterward the spiritual.
translation:
  language: zh_hans
  text: 但不是属灵的在先，而是属血气的；随后才是属灵的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρῶτον
  choice: 先有的
  rationale: 这里作副词，表示次序。结合省略谓语的汉语表达，以“先有的”自然呈现“首先出现/存在”的意思。
- source_word: πνευματικόν
  choice: 属灵的
  rationale: 带冠词的中性单数形容词作名词用。译文保留其简洁和实词省略，不直接补出“身体”，以免缩窄原文，同时与上下文相呼应。
- source_word: ψυχικόν
  choice: 属血气的
  rationale: 指属于普通有生命之人的现世生命形态，与属于圣灵或灵性层面的 πνευματικόν 相对。“属血气的”是较自然且具有经文语体的表达；脚注说明其并非单指物质身体，也不必含道德贬义。
- source_word: ἔπειτα
  choice: 以后才有
  rationale: 表示随后发生的次序；“才”凸显先后关系，却不额外加入因果含义。
- source_word: ἀλλ’ οὐ ... ἀλλὰ
  choice: 但……不是……而是……
  rationale: 直接保留原文纠正既定次序的双重对比结构。
theological_decisions:
- issue: ψυχικόν 与 πνευματικόν 的对比范围
  choice: 保留为“属血气的”与“属灵的”两种依次出现的存在形态，不在正文补出“身体”
  alternative: 明确译为“属血气的身体”与“属灵的身体”
  rationale: 第44节明说两种“身体”，但本节原文省略了“身体”，可能既承接身体的讨论，也把原则说得更宽。正文保留这种简练与张力，脚注交代上下文所允许的具体理解。
- issue: ψυχικόν 是否带道德贬义
  choice: 理解为属于普通受造生命的形态，不强加“邪恶”或“无灵性”的评价
  alternative: 译作“不属灵的”并理解为道德或宗教上的负面状态
  rationale: 本节重点是复活论证中的先后次序；原词在此不要求道德定罪的含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。正文保留希腊文两个名词化形容词的省略性，不擅自补出“身体”；以脚注说明上下文及词义范围。
