  yaml_path: translation/nt/1_corinthians/015/018.yaml
  text: Then those also who have fallen asleep in Messiah have perished[a][b].
translation:
  language: zh_hans
  text: 那么，那些在弥赛亚里[a]已经安睡[b]的人也就灭亡了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在基督里”。
    reason: alternative_reading
  - marker: b
    text: “安睡”是希腊语对死亡的委婉说法，尤其常用于信徒。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα
  choice: 那么
  rationale: 这是承接上文反证推论的推断连接词；“那么”自然地表达“若真如此，结果就是”的语气。
- source_word: καὶ
  choice: 也
  rationale: 保留附加意味，说明在弥赛亚里死去的人同样受上文假设的后果影响。
- source_word: οἱ κοιμηθέντες
  choice: 睡了的人
  rationale: 保留 κοιμάομαι 指死亡的委婉比喻，不直接释为“死了的人”；完成性由语境和“了”表达。
- source_word: ἐν Χριστῷ
  choice: 在弥赛亚里
  rationale: Χριστός在此保有称号意义；“在……里”保留保罗式的联合关系表达，不改写为“信弥赛亚”。
- source_word: ἀπώλοντο
  choice: 灭亡了
  rationale: 表达 ἀπόλλυμι 在此所指的最终失丧或毁灭，并以“了”呈现推论中已经造成的结果；不将其弱化为一般的死亡。
theological_decisions:
- issue: 保罗联合用语ἐν Χριστῷ中Χριστός的译法
  choice: 在弥赛亚里
  alternative: 在基督里
  rationale: 正文翻译其称号含义，同时保留“在……里”的神学张力；因“在基督里”是中文读者熟悉的传统表达，列入脚注。
- issue: ἀπώλοντο所表达的结局
  choice: 灭亡了
  alternative: 失丧了
  rationale: 这里所说的不只是肉身死亡，因为这些人已经被称为“睡了”；“灭亡”较能表达在否认复活这一假设下的终局后果，同时不进一步界定其具体性质。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“那么……也就……”清楚呈现保罗承接上文的反证推论；保留“睡了”这一原文比喻，并借脚注避免现代读者误解。
