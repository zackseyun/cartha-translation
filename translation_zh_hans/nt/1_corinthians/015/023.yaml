id: 1CO.15.23
reference: 1 Corinthians 15:23
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἕκαστος δὲ ἐν τῷ ἰδίῳ τάγματι· ἀπαρχὴ Χριστός, ἔπειτα οἱ τοῦ Χριστοῦ ἐν τῇ παρουσίᾳ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/023.yaml
  text: 'But each in his own order: Messiah the firstfruits[b][a], then those who belong to Messiah at his coming.'
translation:
  language: zh_hans
  text: 但各人都按着自己的次序：基督[a]是初熟的果子；随后，在他降临[b]时，是那些属于基督的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “基督”意为“受膏者”，也可译作“弥赛亚”。
    reason: 说明Χριστός的称号含义及常见对应译法。
  - marker: b
    text: “降临”也可译作“临在”或“来到”；本处语境指他将来的到来。
    reason: 保留παρουσία的词义范围，同时说明本段语境。
lexical_decisions:
- source_word: ἕκαστος
  choice: 各人
  rationale: 采用分配性表达，承接上文所说的复活，并自然引出不同对象各按次序复活。
- source_word: ἐν τῷ ἰδίῳ τάγματι
  choice: 按着自己的次序
  rationale: τάγμα可指排列、队次或既定次序；本段重点是复活的先后，译作“次序”既贴合语境，也避免加入过强的军事色彩。
- source_word: ἀπαρχὴ
  choice: 初熟的果子
  rationale: 保留献上初熟之物的圣经意象，也传达其作为随后收成之先兆与保证的含义。
- source_word: Χριστός
  choice: 基督
  rationale: “基督”是现代汉语中对Χριστός通行且庄重的译法；脚注说明其称号含义为“受膏者”，避免把它仅仅当作名字。
- source_word: οἱ τοῦ Χριστοῦ
  choice: 那些属于基督的人
  rationale: 明确表达属格所含的归属关系，同时保持原文对这群人的概括性指称。
- source_word: παρουσίᾳ
  choice: 降临
  rationale: 在保罗此处的末世语境中指基督未来的来到；“降临”简明自然，并以脚注保留“临在、来到”等词义范围。
theological_decisions:
- issue: Χριστός在此应按称号还是姓名式称呼处理
  choice: 基督，并以脚注注明意为“受膏者”
  alternative: 弥赛亚；受膏者
  rationale: 原词在此具有称号意味，但“基督”在中文圣经语境中同时保持原词对应和可理解性；脚注显明其称号内涵，而不强行选择某一传统表述。
- issue: παρουσία是否应译成技术性末世术语
  choice: 降临
  alternative: 临在；来到
  rationale: 上下文确实指向基督未来来到时的事件，但原词也有“临在、到达”的词义；正文采用语境最自然的“降临”，脚注保留词汇上的可能表达。
- issue: 是否在省略结构中明说“复活”
  choice: 保留原文的省略结构，用“随后……是……”承接上文
  alternative: 随后……属于基督的人也要复活
  rationale: 原文没有在本节重复“复活”这一动词；保留省略可避免把上文信息过度写入本节，同时中文仍能从语境理解。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。分号呈现原文两阶段的次序关系；保留“初熟的果子”这一核心圣经意象，并避免在正文中加入原文未明说的复活动词。
