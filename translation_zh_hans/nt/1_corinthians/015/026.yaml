base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/026.yaml
  text: The last enemy to be abolished is death[a].
translation:
  language: zh_hans
  text: 最后被废除的仇敌是死亡[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“最后被毁灭的仇敌是死亡。”
    reason: 词义替代译法：καταργεῖται也可译作“被毁灭”。
lexical_decisions:
- source_word: ἔσχατος
  choice: 最后
  rationale: 表示次序中的末一位；“最后”自然清楚，也保留保罗论述中的末世次序。
- source_word: ἐχθρὸς
  choice: 仇敌
  rationale: 指敌对者或敌对势力；“仇敌”既庄重又能体现把死亡人格化为敌对权势的表达。
- source_word: καταργεῖται
  choice: 被废除
  rationale: 现在时被动语态表示死亡被置于无效、被终止；“被废除”保留使之失去效力、使之终结的语义，而不额外断定其形而上的消灭方式。
- source_word: ὁ θάνατος
  choice: 死亡
  rationale: 带冠词并被人格化为最后的仇敌；现代汉语以“死亡”自然表达这一概念和敌对权势。
theological_decisions:
- issue: καταργεῖται如何表达死亡最终被击败
  choice: 被废除
  alternative: 被毁灭
  rationale: “被废除”表达死亡作为仇敌终被终止并失去效力，同时避免加入动词本身未明确规定的形而上含义；“被毁灭”也是合乎原文的传统译法，列入脚注。
- issue: 希腊语现在时被动语态的时态表达
  choice: 最后被废除的仇敌是死亡
  alternative: 最后一个仇敌——死亡——正被废除
  rationale: 上下文描述末世次序；采用汉语关系结构自然呈现此敌是最后被废除者，同时保留原文陈述的指向，不把现在时机械处理为正在发生。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“最后被废除的仇敌是死亡”简洁保留原文语序重点及死亡人格化的修辞；脚注明示可成立的传统译法。
