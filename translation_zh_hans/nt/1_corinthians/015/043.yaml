  text: σπείρεται ἐν ἀτιμίᾳ, ἐγείρεται ἐν δόξῃ· σπείρεται ἐν ἀσθενείᾳ, ἐγείρεται ἐν δυνάμει·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/043.yaml
  text: It is sown in dishonor; it is raised in glory. It is sown in weakness; it is raised in power.
translation:
  language: zh_hans
  text: 它被种下时是卑贱的，复活时却是荣耀的；被种下时是软弱的，复活时却是有能力的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 译作“复活”的原文动词为被动式，直译可作“被兴起”；本句没有明说施动者。
    reason: 准确说明两处ἐγείρεται的被动语态，同时保留正文自然的汉语表达及原文未明说的施动者。
lexical_decisions:
- source_word: σπείρεται
  choice: 被种下
  rationale: 保留播种的比喻和被动语态；与上下文把身体比作种子的论述相呼应。“种下”比单用“埋葬”更忠实于原文意象。
- source_word: ἀτιμίᾳ
  choice: 卑贱
  rationale: 表达缺少尊荣、处于卑微状态，并与下文“荣耀”形成清楚对照；避免把词义限缩为主观的羞耻感。
- source_word: ἐγείρεται
  choice: 复活
  rationale: 在死人复活的语境中，这是现代汉语最自然明确的表达。希腊文为被动语态，其隐含的施动者没有在正文中补明。
- source_word: δόξῃ
  choice: 荣耀
  rationale: 保留δόξα在保罗复活论述中的丰富含义，也直接对应“卑贱”的反差。
- source_word: ἀσθενείᾳ
  choice: 软弱
  rationale: 直接表达身体的脆弱与无力，同时不把含义限定为体力不足。
- source_word: δυνάμει
  choice: 有能力
  rationale: 自然呈现与“软弱”的对照；“能力”比“强壮”更能保留δύναμις不只限于肉体力量的含义。
theological_decisions:
- issue: 复活用语的语态和施动者
  choice: 正文采用自然的“复活”，不明确补入施动者，并以脚注说明希腊文是被动语态。
  alternative: 译作“被上帝使之复活”或“被兴起”
  rationale: 原文反复使用被动式，却没有在本句明说上帝；不补入施动者可保留原文的表达方式，而脚注则使读者知道其语态。
- issue: 省略主语的所指
  choice: 以“它”承接上下文所谈的身体，后半句按汉语习惯省略重复主语。
  alternative: 四次重复“身体”
  rationale: 希腊文动词的单数主语由上下文补足。使用“它”既保持所指，又避免不必要的重复。
- issue: ἐν与状态描述
  choice: 译成“……时是……的”，表达被种下和复活时各自呈现的状态。
  alternative: 直译为“在卑贱中……在荣耀中……”
  rationale: 此处ἐν可表达状态或处境；所选译法在现代汉语中更自然，同时保留两组对称反差。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。保留两组平行对偶和播种意象，用“却”凸显卑贱与荣耀、软弱与能力之间的反差。
