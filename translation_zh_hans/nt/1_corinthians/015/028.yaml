- from: 但当万有[a]都服在他之下以后，子自己也要服在那使万有服在他之下的那一位之下，好使上帝成为万有中的一切。[b]
  to: 但万有[a]都服在他之下以后，子自己也要服在那使万有服在他之下的那一位之下，使上帝在万有中成为一切。[b]
  rationale: 修订仅处理汉语句法与末句表达：删去“当……以后”的叠加；以较中性的“使”对应ἵνα；将末句改为“上帝在万有中成为一切”，使其句法更清楚，并保留πάντα ἐν πᾶσιν的宇宙性、重复性及“万物/众人”范围歧义。其余关键措辞，包括“万有”、三处同根的“服在……之下”、以及不补出“父”的分词称谓，均予保留。
