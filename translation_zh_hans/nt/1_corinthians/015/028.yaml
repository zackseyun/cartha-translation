source:
  edition: SBLGNT
  text: ὅταν δὲ ὑποταγῇ αὐτῷ τὰ πάντα, ⸀τότε αὐτὸς ὁ υἱὸς ὑποταγήσεται τῷ ὑποτάξαντι αὐτῷ τὰ πάντα, ἵνα ᾖ ὁ θεὸς ⸀πάντα ἐν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/028.yaml
  text: But when all things are subjected to him[a], then the Son himself will also be subjected to the one who subjected all things to him[b], so that God may be all in all.
translation:
  language: zh_hans
  text: 但万有[a]都服在他之下以后，子自己也要服在那使万有服在他之下的那一位之下，使上帝在万有中成为一切。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “万有”也可译作“一切”。希腊文多次使用同一短语（τὰ πάντα），强调其广泛、总体的范围。
    reason: lexical_alternative
  - marker: b
    text: “使上帝在万有中成为一切”直译可作“使上帝成为一切，在一切之中”。也有人理解为“使上帝在众人中成为一切”。希腊文πάντα ἐν πᾶσιν十分凝练，并未明确限定后一个“一切”是万物还是众人。
    reason: alternative_reading
lexical_decisions:
- source_word: ὅταν δὲ
  choice: 但当……以后
  rationale: ὅταν引出时间条件，δὲ承接上文并带轻微转折；这样的译法符合现代汉语表达，也保留论述推进的层次。
- source_word: ὑποταγῇ / ὑποταγήσεται / ὑποτάξαντι
  choice: 服在……之下 / 使……服在……之下
  rationale: 三个形式均出自ὑποτάσσω。统一采用“服在……之下”，既表达从属关系，也分别保留前两处的被动意义和分词处的主动意义。
- source_word: αὐτῷ
  choice: 他
  rationale: 按上下文指子；保留原文的代词形式，不在正文中改为解释性的“子”。
- source_word: τὰ πάντα
  choice: 万有
  rationale: 这个反复出现的中性复数短语在本段具有宇宙性的总体范围。“万有”简洁、庄重，并能在各处保持重复。
- source_word: τότε
  choice: 以后……也要
  rationale: 汉语以“当……以后”表达时间次序，后句的“也要”自然呈现随后发生的对应行动。
- source_word: αὐτὸς ὁ υἱὸς
  choice: 子自己
  rationale: αὐτός带强调作用；“子自己”自然地突出子的亲自服从，而不添加身份解释。
- source_word: τῷ ὑποτάξαντι
  choice: 那使……服在……之下的那一位
  rationale: 保留带冠词分词的实体化表达，不直接补出“父”或“上帝”，以维持原句的指称方式。
- source_word: ἵνα ᾖ
  choice: 好使……成为
  rationale: 表达ἵνα加虚拟式所具有的目的或结果意味；中文不强行判定二者。
- source_word: πάντα ἐν πᾶσιν
  choice: 万有中的一切
  rationale: 这是高度凝练且存在解释空间的保罗式表达。此译保留两个πᾶς词形的总体性及ἐν的关系，同时避免把后一个πᾶσιν限定为“众人”。
theological_decisions:
- issue: 子服从那使万有服在他之下者的含义
  choice: 直译子将服在那一位之下，不增加本体、位格或职分方面的说明。
  alternative: 为避免误解而改写为仅指职分上的服从，或弱化“服在……之下”。
  rationale: 原文明确陈述末后次序中子的服从。翻译应保留这一神学张力，不以译文解决后来神学体系所讨论的问题，也不暗示本质上的低等。
- issue: πάντα ἐν πᾶσιν的范围
  choice: 译作“万有中的一切”，保持广泛而凝练的表述。
  alternative: 译作“在每个人里面成为一切”或“统管万有”。
  rationale: 后一个πᾶσιν可按事物或群体来理解，原文没有将其明确限定为人；“统管”则加入了原文未明说的解释。正文保留宽广表述，并在脚注说明可能译法。
- issue: τῷ ὑποτάξαντι的所指
  choice: 保留“那一位”的间接称呼。
  alternative: 直接译作“父”或“上帝”。
  rationale: 上下文足以表明所指，但本句希腊文采用分词称谓；保留其形式可避免正文添加原文没有明说的名词。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“万有”保留本段宇宙性的修辞范围；“服在……之下”贯穿同一希腊词根的三个形式。句末略显凝练，是为保留原文表达的张力与歧义。
