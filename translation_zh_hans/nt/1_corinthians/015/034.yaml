  text: ἐκνήψατε δικαίως καὶ μὴ ἁμαρτάνετε, ἀγνωσίαν γὰρ θεοῦ τινες ἔχουσιν· πρὸς ἐντροπὴν ὑμῖν ⸀λαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/034.yaml
  text: Come to your senses rightly[a], and do not go on sinning; for some have ignorance of God[b]. I say this to your shame.
translation:
  language: zh_hans
  text: 你们要清醒过来，恢复正确的判断[a]，不要再犯罪[b]；因为有些人对神无知。我说这话是要使你们羞愧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们要正确地清醒过来”或“你们要合宜地清醒过来”。“清醒过来”原文使人联想到从醉态中醒来；此处很可能是比喻用法。
    reason: lexical_alternative
  - marker: b
    text: 或译：“不要犯罪”。原文的现在命令式可能指持续或惯常的行为，因此也可理解为“停止犯罪”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκνήψατε
  choice: 清醒过来
  rationale: 这个命令式动词本义使人联想到从醉态中醒过来，此处是比喻用法，要求听众果断恢复清醒的判断。
- source_word: δικαίως
  choice: 回归正道
  rationale: 原文副词表示“正确地、合宜地、按正道”。为使现代汉语自然，将其与“清醒过来”合译为并列而紧密相连的劝告，同时保留道德意味。
- source_word: μὴ ἁμαρτάνετε
  choice: 不要再犯罪
  rationale: μή加现在命令式可带有持续或反复行为的意味；“不要再犯罪”自然表达停止继续犯罪的劝诫，但用脚注保留较中性的译法。
- source_word: ἀγνωσίαν θεοῦ
  choice: 不认识神
  rationale: 直译是“对神无知”或“缺乏对神的认识”。“不认识神”在现代汉语中较自然，也保留关系性与认知性的可能含义。
- source_word: τινες
  choice: 有些人
  rationale: 表示听众中或与其相关群体中的一部分人，不扩大为所有人。
- source_word: πρὸς ἐντροπὴν ὑμῖν
  choice: 是要叫你们羞愧
  rationale: 此短语表达这番话与听众羞愧之间的目的或效果关系；该译法保留保罗直接责备的语气。
- source_word: λαλῶ
  choice: 我这样说
  rationale: 按上下文指向刚才所说的责备，现代汉语用“我这样说”最为顺畅。
theological_decisions:
- issue: δικαίως在劝诫中的道德分量
  choice: 译为“回归正道”
  alternative: “正确地”或“合宜地”清醒过来
  rationale: 该副词带有正确、合宜的伦理意味，但并非保罗关于“称义”的专门术语。此译法保留道德力度，同时避免引入经文未明确表达的教义含义。
- issue: ἀγνωσίαν θεοῦ所指的无知性质
  choice: 译为“不认识神”
  alternative: “对神无知”或“缺乏关于神的知识”
  rationale: 属格自然可理解为以神为对象的无知。译文不进一步断定这是完全没有得救的认识，还是在复活问题上显出的严重无知，以保留语义张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“清醒过来”保留原文醒酒意象的比喻力量；“回归正道”使δικαίως的修饰关系在汉语中清楚自然。句末保留直接责备语气，不作弱化。
