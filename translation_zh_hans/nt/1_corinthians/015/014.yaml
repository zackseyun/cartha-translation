  text: εἰ δὲ Χριστὸς οὐκ ἐγήγερται, κενὸν ⸀ἄρα τὸ κήρυγμα ἡμῶν, ⸀κενὴ καὶ ἡ πίστις ⸀ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/014.yaml
  text: And if Messiah has not been raised[a], then our proclamation is empty[c][b], and your faith is empty.
translation:
  language: zh_hans
  text: 如果弥赛亚[a]没有复活，那么我们的宣讲就是徒然的[b]，你们的信[c]也是徒然的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“基督”。希腊语为 Christos，意为“受膏者”。
    reason: alternative_reading
  - marker: b
    text: “徒然的”两处也可译作“空的”或“没有实效的”。
    reason: lexical_alternative
  - marker: c
    text: “信”也可译作“信靠”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστὸς
  choice: 弥赛亚
  rationale: 保留希腊语 Χριστός 所表达的受膏者称号含义；“基督”是传统且自然的对应译法，列入脚注。
- source_word: ἐγήγερται
  choice: 没有被复活
  rationale: 保留完成时被动语态及其结果持续至今的意味，也不明说被动行动者，从而保存原文的神学张力。
- source_word: κενὸν / κενὴ
  choice: 空的
  rationale: 两处采用相同译法，以保存保罗的平行和重复；此处表示缺乏实质、根据或效力。
- source_word: ἄρα
  choice: 那么
  rationale: 自然地标明条件句所引出的逻辑结论。
- source_word: κήρυγμα
  choice: 宣讲
  rationale: 兼顾公开宣告的信息及宣告行为，比单指讲道的“讲道”范围更合适。
- source_word: πίστις
  choice: 信
  rationale: 在此指哥林多人相信福音的信；“信靠”也是可能的语境化表达，但“信”更简洁，并与本段论证的用语相称。
theological_decisions:
- issue: 复活措辞与行动者
  choice: 没有被复活
  alternative: 没有复活
  rationale: 原文是被动形式；保留被动措辞，不将经文改写为主动，也不擅自补出“上帝”作为明说的主语。
- issue: Χριστός作为称号还是惯用名称
  choice: 弥赛亚
  alternative: 基督
  rationale: 主文凸显“受膏者”的称号意义，同时以脚注提供汉语基督教传统中更惯用的“基督”。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。以“那么”呈现论证关系，并重复“空的”以保留原文鲜明的平行结构；“没有被复活”虽略带书面色彩，却能准确保留希腊语被动形式。
