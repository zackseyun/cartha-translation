  text: τιμῆς ἠγοράσθητε· μὴ γίνεσθε δοῦλοι ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/023.yaml
  text: You were bought with a price[a]; do not become slaves of men.
translation:
  language: zh_hans
  text: 你们是付了代价买来的；不要成为人的奴隶。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人”在这里泛指人类，并非专指男性；原文以人作主人，与主形成对照。
    reason: 说明 ἀνθρώπων 的代表性、包容性用法，以及上下文中的对比。
lexical_decisions:
- source_word: τιμῆς
  choice: 付了代价
  rationale: 该属格表示购买所付的价款。“付了代价”是自然的现代汉语，保留购买隐喻，也不擅自说明代价的具体内容或高低。
- source_word: ἠγοράσθητε
  choice: 你们是……买来的
  rationale: 不定过去时被动直陈语气、第二人称复数。此译保留被动形式以及保罗关于被买赎、归属他者的商业隐喻，并不补出原文未明说的购买者。
- source_word: μὴ γίνεσθε
  choice: 不要成为
  rationale: γίνομαι 表示“成为”，而非单纯的静态“是”；μή 加现在时命令语气在此禁止进入或持续趋向这种状态。“不要成为”清楚保留这一动态意味。
- source_word: δοῦλοι
  choice: 奴隶
  rationale: 上下文突出被购买、归属和受支配的关系；“奴隶”比“仆人”更准确地保留 δοῦλος 所表达的受辖制身份及其与购买隐喻的联系。
- source_word: ἀνθρώπων
  choice: 人的
  rationale: ἀνθρώπων 是泛指人类的复数属格，修饰“奴隶”，与属于主形成对照。“人的”在现代汉语中自然且不限定为男性。
theological_decisions:
- issue: 如何表达 δοῦλοι ἀνθρώπων 所涉及的归属和效忠关系
  choice: 人的奴隶
  alternative: 人的仆人；受人的奴役
  rationale: 本句的张力在于信徒既已付代价被买来，就不可把自己置于人最终的支配之下。“奴隶”保留所有权与辖制的强度；同时不把经文扩释为禁止一切正常的人际服事或社会关系。
- issue: 是否明确补出购买者是神或基督
  choice: 沿用原文被动式，不在正文补出购买者
  alternative: 你们是基督付了代价买来的；你们是神付了代价买来的
  rationale: 原文没有在本节明说购买者。上下文虽使神圣的购买者这一理解十分自然，正文仍保留原句的含蓄，避免消除其表达上的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“付了代价买来的”保留原文商业—买赎隐喻；分号呈现两句之间紧密的因果和劝诫关系。
