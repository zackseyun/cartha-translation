  text: διὰ δὲ τὰς πορνείας ἕκαστος τὴν ἑαυτοῦ γυναῖκα ἐχέτω, καὶ ἑκάστη τὸν ἴδιον ἄνδρα ἐχέτω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/002.yaml
  text: But because of sexual immoralities[a], let each man have his own wife, and let each woman have her own husband.
translation:
  language: zh_hans
  text: 但由于各种淫乱行为[a]，每个男人应当有自己的妻子；每个女人也应当有自己的丈夫。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“淫乱”（单数）。原文为复数，直译可作“各种淫乱行为”。
    reason: 说明希腊文τὰς πορνείας为复数，同时保留汉语以集合性单数表达的自然替代译法。
lexical_decisions:
- source_word: διὰ δὲ
  choice: 但由于有
  rationale: διά加宾格表示原因，译作“由于”；δέ承接上文并带轻微转折，译作“但”。补出“有”使现代汉语表达自然，同时不把原文解释成明确的“为了避免”。
- source_word: τὰς πορνείας
  choice: 种种淫乱行为
  rationale: πορνεία指不合宜的性行为；原文使用复数。“种种……行为”既保留复数含义，也比生硬的“淫乱们”符合现代汉语。
- source_word: ἕκαστος
  choice: 每个男人
  rationale: 阳性单数与后半句的阴性ἑκάστη形成平行，并由“妻子”表明这里所指的是男人；不预先将其限定为“丈夫”。
- source_word: τὴν ἑαυτοῦ γυναῖκα
  choice: 自己的妻子
  rationale: γυνή可指“女人”或“妻子”，在本节婚姻配对的语境中应译为“妻子”；ἑαυτοῦ强调属于他自己。
- source_word: ἐχέτω
  choice: 都应当有
  rationale: 第三人称现在时命令式带有劝令或规范性。“应当有”保留命令力度，但不强化为绝对的“必须有”，也不擅自改译为“应当结婚”或“履行夫妻义务”。
- source_word: καὶ ἑκάστη
  choice: 每个女人也都
  rationale: 保留与前半句相称的逐一分配结构；καί在汉语中自然译作“也”。
- source_word: τὸν ἴδιον ἄνδρα
  choice: 自己的丈夫
  rationale: ἀνήρ可指“男人”或“丈夫”，与γυναῖκα平行且处于婚姻语境，故译为“丈夫”；ἴδιον强调自己的配偶。
theological_decisions:
- issue: 本节是在准许人借婚姻避免性犯罪，还是在命令夫妻维持婚姻关系
  choice: 按原文直译为每个男人和女人“应当有”自己的配偶，不进一步说明是“应当结婚”还是“应当保持夫妻关系”。
  alternative: 解释性地译为“应当结婚”，或译为“应当履行夫妻义务”。
  rationale: 原文使用ἐχέτω（“要有／应当有”），没有使用明确表示结婚或履行夫妻义务的动词。保留这一措辞，可避免提前消解原文及上下文中的解释张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“淫乱行为”保留圣经伦理语境中的广义性；句式保持男女双方完全平行。
