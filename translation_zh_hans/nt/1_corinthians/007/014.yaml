  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἡγίασται γὰρ ὁ ἀνὴρ ὁ ἄπιστος ἐν τῇ γυναικί, καὶ ἡγίασται ἡ γυνὴ ἡ ἄπιστος ἐν τῷ ⸀ἀδελφῷ· ἐπεὶ ἄρα τὰ τέκνα ὑμῶν ἀκάθαρτά ἐστιν, νῦν δὲ ἅγιά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/014.yaml
  text: For the unbelieving husband has been made holy through his wife[a], and the unbelieving wife has been made holy through the brother; otherwise your children are unclean, but as it is[b], they are holy.
translation:
  language: zh_hans
  text: 因为不信的丈夫因妻子成了圣洁；不信的妻子也因弟兄[a]成了圣洁。不然，你们的儿女就是不洁净的；但如今，他们是圣洁的。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄”很可能是保罗惯常用来称呼信徒的说法；这里很可能指信主的丈夫。也可译作“因信主的丈夫”。
    reason: lexical_alternative
  - marker: b
    text: 这里的“成了圣洁”是指不信的配偶因与信徒配偶及其家庭相连而具有分别为圣的状态，不一定表示他或她本人已经得救。经文也称儿女为“圣洁的”，但没有在本节进一步界定这种圣洁。
    reason: cultural_note
lexical_decisions:
- source_word: ἡγίασται
  choice: 成了圣洁
  rationale: 完成时被动态表达由先前作用而形成并持续的状态。“成了圣洁”既保留与后文“圣洁的”的词义呼应，也不把这里直接解释为个人得救。
- source_word: ἄπιστος
  choice: 不信的
  rationale: 婚姻语境中指不信者，而非“不忠”或“不可靠”的人；用于修饰“丈夫、妻子”自然清楚。
- source_word: ἐν
  choice: 因
  rationale: 此处表达婚姻联合中的关系或凭借；“因”在中文中简洁自然，同时避免把希腊语关系含义过度限定为单一的工具意义。
- source_word: ἀνὴρ / γυνή
  choice: 丈夫 / 妻子
  rationale: 上下文明指婚姻关系，因此采用具体的配偶称谓，而非泛指“男人 / 女人”。
- source_word: ἀδελφῷ
  choice: 那位弟兄
  rationale: 直译保留原文第二分句特意使用“弟兄”而非“丈夫”的措辞；脚注说明其很可能指信主的丈夫。
- source_word: ἐπεὶ ἄρα
  choice: 不然
  rationale: 引出若前述情况不成立便会有的后果，符合原文的推论语气，也合乎现代汉语表达。
- source_word: ἀκάθαρτα
  choice: 不洁净的
  rationale: 保留该词在礼仪、群体身份与圣洁范畴中的意味，避免弱化为一般性的“不纯”。
- source_word: νῦν δὲ
  choice: 但如今
  rationale: 保留 νῦν 的时间用语及 δέ 的对比作用，不将其改写成较强的解释性措辞。
- source_word: ἅγια
  choice: 圣洁的
  rationale: 与“成了圣洁”保持词根和神学语域上的呼应；不在正文中解释成较窄的“分别出来”。
theological_decisions:
- issue: 不信的配偶“成了圣洁”的含义
  choice: 正文保留“成了圣洁”，不把它等同于不信配偶自动获得个人救恩；脚注提示这里涉及其与信徒配偶及家庭相连的分别为圣状态。
  alternative: 解释为不信配偶因婚姻而自动得救，或仅解释为婚姻及夫妻关系的合法性。
  rationale: 保罗的论证把配偶的状态与儿女的洁净、圣洁相连。原文本身没有完整界定这种圣洁的性质，因此译文保留其神学张力，脚注只防止明显的过度推论。
- issue: ἀδελφῷ 的所指
  choice: 正文译作“那位弟兄”，脚注说明很可能指信主的丈夫。
  alternative: 为求上下对称，直接译作“丈夫”或“信主的配偶”。
  rationale: 原文在第二分句明确使用“弟兄”，而非重复“丈夫”。保留这一差异更忠于源文，也体现保罗惯用的信徒亲属称谓。
- issue: 儿女“圣洁”的性质
  choice: 保留“圣洁的”，不在正文中具体界定为个人得救、礼仪身份或盟约地位。
  alternative: 译成“已经得救”或仅译成“合法的”。
  rationale: ἅγια 与 ἀκάθαρτα 构成直接对照，但本节没有明说儿女个人得救；直译可避免加入经文本身未明示的教义结论。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“那位弟兄”略带书面和教会语域，但为保留希腊原文与前句“丈夫”的有意差异而采用，并以脚注辅助理解。正文维持“成了圣洁—圣洁的”及“不洁净—圣洁”的词义联系。
