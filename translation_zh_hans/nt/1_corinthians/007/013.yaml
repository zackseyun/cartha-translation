  text: καὶ γυνὴ ⸂εἴ τις⸃ ἔχει ἄνδρα ἄπιστον, καὶ ⸀οὗτος συνευδοκεῖ οἰκεῖν μετ’ αὐτῆς, μὴ ἀφιέτω ⸂τὸν ἄνδρα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/013.yaml
  text: And if a woman has an unbelieving husband[a], and he consents to live with her, she must not leave her husband.
translation:
  language: zh_hans
  text: 如果有一位妇人的丈夫不信主，而他愿意和她一起生活，她就不可离开丈夫[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“她不可与丈夫离婚”。所译“离开”的希腊词也可较直译为“遣走”；在这里指结束婚姻关系。
    reason: 说明 ἀφίημι 的较宽词义，以及其在本节婚姻语境中可译为“离婚”。
lexical_decisions:
- source_word: γυνὴ
  choice: 妇人
  rationale: 此词可指“女人”或“妻子”；上下文明确谈论已婚女子。“妇人”在现代中文中庄重自然，后文的“丈夫”使婚姻关系清楚。
- source_word: εἴ τις ἔχει ἄνδρα
  choice: 她若有……丈夫
  rationale: εἴ τις 引入一般性的假设情形；中文用“她若有”既自然，也保留这种泛指条件。
- source_word: ἄνδρα ἄπιστον
  choice: 不信的丈夫
  rationale: ἀνήρ 在婚姻语境中指“丈夫”；ἄπιστος 在此指不信基督信仰的人，而非婚姻上不忠的人，所以译作“不信的”，避免“无信”或“不忠”的歧义。
- source_word: οὗτος
  choice: 丈夫也
  rationale: 指回前述丈夫。中文重复“丈夫”比单用“他”更清楚；“也”承接平行情形，并自然表达原句的推进。
- source_word: συνευδοκεῖ
  choice: 愿意
  rationale: 该动词表示赞同、同意或乐意如此；在共同生活的语境中，“愿意”自然地表达自愿同意，而不带法律术语色彩。
- source_word: οἰκεῖν μετ’ αὐτῆς
  choice: 和她一同生活
  rationale: 指继续共同居住并维持家庭生活；“一同生活”比“同住”略宽，符合婚姻语境。
- source_word: μὴ ἀφιέτω τὸν ἄνδρα
  choice: 她就不可离弃丈夫
  rationale: ἀφίημι 基本可表示离开、放走或遣走；在本章婚姻语境中涉及终止婚姻关系。“离弃”保留原词较宽的表达，同时比单纯“离开”更能传达关系上的断绝，又不直接把含义限定为正式法律离婚。
theological_decisions:
- issue: 如何表达混合信仰婚姻中 μὴ ἀφιέτω 的命令
  choice: 不可离弃丈夫
  alternative: 不可与丈夫离婚；不可离开丈夫；不可遣走丈夫
  rationale: 经文要求信主的妻子在不信的丈夫愿意继续共同生活时，不主动结束婚姻。“离弃”既传达这一伦理要求，也保留 ἀφίημι 可指离开或放走的词义幅度；脚注说明“离婚”这一符合语境的理解，避免正文过度限定为某种法律程序。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“又有妇人”承接上一节的平行情形；“丈夫也愿意”避免生硬照译指示代词。正文用“离弃”保留原文的词义张力，脚注补充“离婚”这一语境化译法。
