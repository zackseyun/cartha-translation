  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ⸀καὶ μεμέρισται. καὶ ἡ γυνὴ ⸂ἡ ἄγαμος⸃ καὶ ἡ ⸀παρθένος μεριμνᾷ τὰ τοῦ κυρίου, ἵνα ᾖ ἁγία καὶ ⸀τῷ σώματι καὶ ⸁τῷ πνεύματι· ἡ δὲ γαμήσασα μεριμνᾷ τὰ τοῦ κόσμου, πῶς ⸀ἀρέσῃ τῷ ἀνδρί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/034.yaml
  text: And she is divided. And the unmarried woman[a], that is, the virgin, is concerned about the things of the Lord, so that she may be holy both in body and in spirit. But the married woman is concerned about the things of the world, how she may please her husband.
translation:
  language: zh_hans
  text: 他的心思就分散了。未婚的女子，也就是童女[a]，关心主的事，为要在身体和心灵上都成为圣洁；但已婚的女子关心世上的事，想着怎样取悦丈夫。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“未婚的女子和童女都关心主的事。”希腊文也可理解为列出两个类别，而不是以“童女”说明“未婚的女子”。
    reason: alternative_reading
lexical_decisions:
- source_word: μεμέρισται
  choice: 心思就分散了
  rationale: 该词是完成时被动形式，承接上一节，表达婚姻责任使关注有所分散的持续状态。“心思分散”保留原文“分开”的意象，又符合现代汉语。
- source_word: γυνὴ ἡ ἄγαμος
  choice: 未婚的女子
  rationale: γυνή 可指女子或妻子；与后文已婚女子对照时，“未婚的女子”最自然明确。
- source_word: παρθένος
  choice: 童女
  rationale: 保留 παρθένος 所特指的童贞、未有性关系的女子，不将其泛化为一般的未婚女子。
- source_word: γυνὴ ἡ ἄγαμος καὶ ἡ παρθένος
  choice: 未婚的女子，也就是童女
  rationale: 原文结构紧缩，既可理解为同位说明，也可理解为两个并列类别。正文采用同位读法，因为随后的谓语 μεριμνᾷ 是单数；并列读法收入脚注。
- source_word: μεριμνᾷ
  choice: 关心
  rationale: 这里表示投注心力、挂念，并不必然含有罪性的焦虑；“关心”自然且不过度诠释。
- source_word: τὰ τοῦ κυρίου
  choice: 主的事
  rationale: 简洁保留与“世上的事”相对应的结构，指属于主、关乎主的事务。
- source_word: ἵνα ᾖ ἁγία
  choice: 为要使自己……成为圣洁
  rationale: 保留 ἵνα 所表达的目的意味，并保留原文明确的圣洁用语。
- source_word: τῷ σώματι καὶ τῷ πνεύματι
  choice: 身体和心灵都
  rationale: 两个与格表示圣洁所涉及的方面；“……都”自然体现 καὶ…καὶ，而不额外建立特定的人论体系。
- source_word: ἡ δὲ γαμήσασα
  choice: 已婚的女子
  rationale: 该过去时分词在此名词化，指已经进入婚姻状态的女子；译法简洁，并与“未婚的女子”形成清楚对照。
- source_word: τὰ τοῦ κόσμου
  choice: 世上的事
  rationale: 与“主的事”保持结构对应，也避免把婚姻责任贬称为带强烈负面意味的“世俗之事”。
- source_word: πῶς ἀρέσῃ τῷ ἀνδρί
  choice: 想着怎样取悦丈夫
  rationale: 婚姻语境中 ἀνήρ 明确指丈夫；“取悦丈夫”准确表达 ἀρέσκω。加入“想着”使其自然衔接“关心”。
theological_decisions:
- issue: “未婚的女子”和“童女”是同一类别的说明，还是两个并列类别
  choice: 正文按同位关系译作“未婚的女子，也就是童女”
  alternative: “未婚的女子和童女都关心主的事”
  rationale: 希腊文句法紧缩，单数谓语支持将二者视为统一主语，但并列理解仍有可能。因此正文采用较顺畅的同位读法，同时用脚注保存另一种真实可行的解读。
- issue: “世上的事”是否含有道德贬义
  choice: 不额外加入贬义限定
  alternative: 译作“世俗的事”
  rationale: 本节对照的是未婚与已婚者关注事项的分配，并未明确谴责已婚者履行婚姻责任；“世上的事”更能保留原文张力而不强化负面判断。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“童女”保留经文语体和原词的具体含义；“主的事／世上的事”维持原文对称。脚注标记[a]已置于正文相应位置。
