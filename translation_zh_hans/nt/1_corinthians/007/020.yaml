  text: Each one should remain in the calling in which he was called[a][b].
translation:
  language: zh_hans
  text: 各人应当留在自己蒙召时的呼召中。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “呼召”也可按上下文理解为“处境”“生活地位”或“身份”。希腊原文在此用“呼召”一词，与本句的“蒙召”同源。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: 各人
  rationale: 保留分配性的单数含义，表示这项劝勉逐一适用于每位信徒；现代汉语无需显出语法性别。
- source_word: κλήσει
  choice: 蒙召时所处的身份
  rationale: κλῆσις本义可指“呼召”，但本节语境涉及婚姻、割礼和奴仆身份等处境。译文以“蒙召时处于什么身份”自然表达其处境义，同时借“蒙召”保留与ἐκλήθη的词根呼应。
- source_word: ᾗ ἐκλήθη
  choice: 蒙召时处于什么身份
  rationale: 关系结构可理解为人在某种身份或处境中蒙召。汉语用“蒙召时处于什么身份”表达这一关系，不明确说出施行呼召者，从而保留神性被动。
- source_word: ἐν ταύτῃ
  choice: 那身份
  rationale: 指回前述人在蒙召时所处的身份；用指示词“那”保留回指关系，并避免生硬重复。
- source_word: μενέτω
  choice: 应当持守
  rationale: 现在时命令语气要求继续维持该状态。“应当持守”具有劝令力度，也比“必须留在”较少引出绝对、不可改变的误解。
theological_decisions:
- issue: κλῆσις在本节中的含义及其与ἐκλήθη的呼应
  choice: 正文译作“蒙召时处于什么身份”，以“身份”表达上下文中的生活或社会处境，并以“蒙召”保留呼召主题。
  alternative: 直译为“各人要留在自己蒙召时的呼召中”或译为“各人要保持蒙召时的处境”。
  rationale: 希腊文刻意并置κλήσει与ἐκλήθη，兼有“呼召”和蒙召时所处状态之间的张力。若只译“呼召”，现代汉语容易被理解为使命或职业；若只译“处境”，又会消除词根呼应。所选表达力求同时保留两面。
- issue: 命令是否禁止任何身份改变
  choice: 译为“应当持守”，不增添“永远”或“绝不可改变”等限定。
  alternative: 译为“必须留在原来的身份中”。
  rationale: μενέτω要求继续持守，但上下文尤其7:21也容许对处境变化作进一步讨论，因此不应把本句强化为无条件禁止一切改变。
- issue: 阳性单数形式的汉语表达
  choice: 译作无性别标记的“各人”，不另加性别脚注。
  alternative: 译作“每一个男人”或补出“他”。
  rationale: 希腊语阳性单数在此作代表性、泛指用法；现代汉语“各人”准确表达逐一适用于众人的范围，并非出于改写性别内容。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“身份”在本段关于割礼与奴仆等议题的语境中较自然；脚注说明其也涵盖处境、生活地位，并揭示原文的同源词呼应。正文脚注标记已对应出现。
