  text: ἡ περιτομὴ οὐδέν ἐστιν, καὶ ἡ ἀκροβυστία οὐδέν ἐστιν, ἀλλὰ τήρησις ἐντολῶν θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/019.yaml
  text: Circumcision is nothing[a], and uncircumcision is nothing, but keeping the commandments of God.
translation:
  language: zh_hans
  text: 受割礼算不得什么[a]，不受割礼也算不得什么；要紧的是遵守上帝的命令。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“无关紧要”；下句同。
    reason: 说明 οὐδέν ἐστιν 的另一种自然译法；该表达可理解为“不具决定性分量”，而不只是本体意义上的“什么也不是”。
lexical_decisions:
- source_word: περιτομή
  choice: 受割礼
  rationale: 用现代汉语中约定俗成的名词性表达，指受割礼这一身份状况；与下文“不受割礼”形成清楚对照。
- source_word: οὐδέν ἐστιν
  choice: 算不得什么
  rationale: 既保留原文直截了当的否定评价，也比生硬的“什么也不是”更符合现代汉语；两处采用相同措辞，以再现希腊文的重复结构。
- source_word: ἀκροβυστία
  choice: 不受割礼
  rationale: 自然、明确地表达未受割礼的状态，并保持与“受割礼”的修辞对称。
- source_word: ἀλλά
  choice: ；要紧的是
  rationale: 原文在两种身份标记与真正具有分量之事之间形成强烈转折。汉语以分号和“要紧的是”自然呈现这一对比，同时补足希腊文省略的判断成分。
- source_word: τήρησις
  choice: 遵守
  rationale: 准确表达持守、遵行之意，与“命令”搭配自然；不将其抽象泛化为一般性的“顺服”。
- source_word: ἐντολῶν θεοῦ
  choice: 上帝的命令
  rationale: 保留复数所涵盖的多项命令，并以现代汉语自然的所属结构表达希腊文属格关系。
theological_decisions:
- issue: 保罗如何评价受割礼与不受割礼
  choice: 将两者都译为“算不得什么”，并与“遵守上帝的命令”形成对比。
  alternative: 将本句解释为割礼在任何意义上都毫无道德价值。
  rationale: 本节在当前论证中相对化两种身份状况，强调遵守上帝命令才要紧；译文不把这一表述扩展为超出本节范围的系统性结论。
- issue: 割礼与遵守上帝命令之间的张力
  choice: 按原文并列保留张力，不说明这里“命令”是否包括或排除割礼规定。
  alternative: 在译文中明确限定为新约命令，或明确宣告割礼诫命已经废除。
  rationale: 原文本身没有作这种限定；添加说明会替保罗解决此处刻意保留的神学张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“算不得什么”保留原文两次重复的锋利语气；“要紧的是”使省略谓语的希腊文名词短语在汉语中完整自然。正文中的[a]与脚注相对应。
