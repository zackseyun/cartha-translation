  text: Τοῖς δὲ λοιποῖς ⸂λέγω ἐγώ⸃, οὐχ ὁ κύριος· εἴ τις ἀδελφὸς γυναῖκα ἔχει ἄπιστον, καὶ αὕτη συνευδοκεῖ οἰκεῖν μετ’ αὐτοῦ, μὴ ἀφιέτω αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/012.yaml
  text: But to the rest I say—I[a], not the Lord—if any brother has an unbelieving wife, and she consents to live with him, he must not divorce her.
translation:
  language: zh_hans
  text: 至于其余的人，我说（不是主说的）：如果有弟兄娶了不信的妻子，她也愿意与他共同生活，他不可离弃她。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“离开她”或“休掉她”。希腊语动词更直译是“离开”或“遣走”，但这里指解除婚姻关系。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῖς δὲ λοιποῖς
  choice: 至于其余的人
  rationale: λοιποί指前文尚未涵盖的其余群体；δέ在此作温和的转接。“至于”自然地引出新一类情况，又不强化为明显对立。
- source_word: λέγω ἐγώ, οὐχ ὁ κύριος
  choice: 是我说，不是主说
  rationale: 保留ἐγώ的明确强调及原文的对照，也维持插入说明的语气；不在正文中进一步解释其权威性质。
- source_word: ἀδελφὸς
  choice: 弟兄
  rationale: 此处阳性单数与“妻子”相对，具体指男性信徒；“弟兄”既保留性别信息，也符合基督徒群体语境。
- source_word: γυναῖκα ἔχει ἄπιστον
  choice: 有不信的妻子
  rationale: ἔχει γυναῖκα在这里表达婚姻关系；ἄπιστον指不信基督，而非婚姻上的不忠。“有不信的妻子”简洁并贴近原句结构。
- source_word: καὶ αὕτη συνευδοκεῖ
  choice: 而她也愿意
  rationale: συνευδοκεῖ表示赞同、情愿接受这一共同生活安排；“愿意”在现代汉语婚姻语境中自然，并保留主动意愿。
- source_word: οἰκεῖν μετ’ αὐτοῦ
  choice: 与他共同生活
  rationale: οἰκεῖν μετ’ αὐτοῦ指同住并维持家庭生活；“共同生活”比单纯“住在一起”更能表达婚姻共同生活的关系含义。
- source_word: μὴ ἀφιέτω αὐτήν
  choice: 他就不可离弃她
  rationale: ἀφίημι本义范围包括离开、放走或遣走，在本段婚姻语境中指终止婚姻。“离弃”保留原词的形象和一定语义宽度，同时由脚注说明其实际所指。
theological_decisions:
- issue: “是我说，不是主说”的含义
  choice: 正文直接保留保罗与主之话语之间的区别，不将其改写为“只是我的意见”
  alternative: 明确解释为保罗是在区别自己的使徒教导与耶稣在世时直接说过的话
  rationale: 原文本身只陈述“我”与“主”的对照，并未说这话没有权威。直译能保存神学张力，避免在经文正文中加入对默示或使徒权威的额外判断。
- issue: ἀφίημι在婚姻语境中的关系含义
  choice: 正文译作“离弃”，脚注指出这里是指解除婚姻关系
  alternative: 正文直接译作“休掉”或“离婚”
  rationale: “离弃”保留原词可表示离开或遣走的词汇广度；脚注则防止现代读者误解为短暂分居。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“至于”体现段落转接；冒号保留插入说明之后引出具体命令的结构。“共同生活”避免把婚姻关系缩减为仅仅同住。“离弃”较“休妻”更符合现代标准汉语，也避免过强的古代制度色彩。
