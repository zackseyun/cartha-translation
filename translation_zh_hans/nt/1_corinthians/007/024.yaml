revisions:
- from: 弟兄们[b]，各人蒙召时处于什么境况，就要在那境况中与上帝同在[a]。
  to: 弟兄们[b]，各人蒙召时处于什么境况，就要在上帝面前留在那境况中[a]。
  rationale: 将παρὰ θεῷ译为“在上帝面前”，并置于“留在那境况中”之前，使其明确限定保罗所吩咐的“留在”行为。保留“什么……那……”以反映原文关系词与指示词的照应；保留“蒙召”的被动表达，不补出原文未明说的施事者。脚注保留该短语的其他可行译法。
