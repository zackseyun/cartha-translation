review_pass:
  verdict: revise
  source_fidelity: 正文对ἕκαστος、ἐκλήθη及ἐν ᾧ…ἐν τούτῳ的处理基本准确。“与上帝同在”虽可作为παρὰ θεῷ的一种解释，却在现代汉语中较易被理解为一种属灵经历或上帝与人的同在，而未清楚呈现该短语对“留在那境况中”的限定。改为“在上帝面前”较贴合其关系／临在的语义，且句法更明确。
  naturalness: 原句整体通顺，但“在那境况中与上帝同在”容易使“与上帝同在”成为与“留在原有境况”并列的另一项要求。修订后把“在上帝面前”明确作为“继续留在那境况中”的方式或范围，现代庄重语体自然。
  terminology: “弟兄们”“各人”“蒙召”“境况”均合宜。“在上帝面前”作为παρὰ θεῷ的正文译法，并以脚注保留“与上帝同在”和“在上帝的临在中”等可能性，避免将有压缩性的希腊短语过度限定。
  issues:
  - severity: medium
    issue: “与上帝同在”在句中的修饰关系不够明确。
    rationale: παρὰ θεῷ紧随μενέτω，限定的是人在原有境况中“留下”的状态；汉语“在那境况中与上帝同在”容易读成“留在该境况”和“与上帝同在”两项并列内容，也可能带入较特定的宗教表达。
  revised_text: 弟兄们[b]，各人蒙召时处于什么境况，就要在上帝面前留在那境况中[a]。
