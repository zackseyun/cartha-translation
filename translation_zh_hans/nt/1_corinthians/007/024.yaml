  text: ἕκαστος ἐν ᾧ ἐκλήθη, ἀδελφοί, ἐν τούτῳ μενέτω παρὰ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/024.yaml
  text: Brothers[b][a], let each one remain with God in that condition in which he was called.
translation:
  language: zh_hans
  text: 弟兄们[b]，各人蒙召时处于什么境况，就要在上帝面前留在那境况中[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“与上帝同在”或“在上帝的临在中”。
    reason: lexical_alternative
  - marker: b
    text: 这里的“弟兄们”是对全体会众的称呼，也包括女性。
    reason: cultural_note
lexical_decisions:
- source_word: ἕκαστος
  choice: 各人
  rationale: 保留分配性的单数含义，逐一把劝勉应用于每个人；现代汉语简洁自然。
- source_word: ἐν ᾧ ... ἐν τούτῳ
  choice: 蒙召时处于什么境况，就要在那境况中
  rationale: 以“什么……那……”对应原文关系词与指示词的呼应，并按上下文将介词结构理解为人的生活境况或社会处境，而非单纯地点。
- source_word: ἐκλήθη
  choice: 蒙召
  rationale: 保留神学语境中的被动意义，不在正文中补出原文未明说的施事者“上帝”。
- source_word: ἀδελφοί
  choice: 弟兄们
  rationale: 对应阳性复数呼格，同时用脚注说明此称呼在这里面向包括女性在内的全体会众。
- source_word: μενέτω
  choice: 就要……在……中
  rationale: 用带命令意味的“要”表达第三人称命令式；结合处所结构自然传达继续留在原有境况中的意思。
- source_word: παρὰ θεῷ
  choice: 与上帝同在
  rationale: παρά加与格可表达亲近或关系；“与上帝同在”保留简洁而浓缩的关系性表达，其他可能译法收入脚注。
theological_decisions:
- issue: 是否在“蒙召”中明确补出上帝的施事作用
  choice: 保留“蒙召”，不补“被上帝呼召”
  alternative: 被上帝呼召
  rationale: 保罗语境强烈暗示呼召者是上帝，但希腊文本没有明说施事者，因此正文保留被动表达。
- issue: ἀδελφοί对混合性别会众的称呼
  choice: 弟兄们
  alternative: 弟兄姊妹们
  rationale: 正文保留原文阳性复数称呼的形式，脚注则明确其语用范围包括会众中的女性。
- issue: παρὰ θεῷ所表达的关系
  choice: 与上帝同在
  alternative: 在上帝面前／在上帝的临在中
  rationale: 该短语简练且可表达亲近、关系或处于上帝面前；正文采用关系性较强而自然的译法，同时用脚注保留真实的词义空间。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式以“什么……那……”重现希腊文ἐν ᾧ…ἐν τούτῳ的照应；“境况”承接本段有关社会身份与生活处境的讨论。脚注标记均置于相应正文词语之后。
