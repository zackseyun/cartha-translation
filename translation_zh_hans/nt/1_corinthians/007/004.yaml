  text: ἡ γυνὴ τοῦ ἰδίου σώματος οὐκ ἐξουσιάζει ἀλλὰ ὁ ἀνήρ· ὁμοίως δὲ καὶ ὁ ἀνὴρ τοῦ ἰδίου σώματος οὐκ ἐξουσιάζει ἀλλὰ ἡ γυνή.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/004.yaml
  text: The wife does not have authority over her own body[a], but the husband does; likewise also the husband does not have authority over his own body, but the wife does.
translation:
  language: zh_hans
  text: 妻子无权支配自己的身体[a]，丈夫却有权支配；同样，丈夫也无权支配自己的身体，妻子却有权支配。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “有权支配”也可译作“行使权柄”。希腊文动词既可指拥有权柄，也可指行使权柄；本节以对称的方式表明婚姻关系中夫妻彼此的相互权柄。
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: 妻子
  rationale: 本节处于婚姻及夫妻义务的语境中，指已婚女性；译作“妻子”比泛指的“女人”准确。
- source_word: ἀνήρ
  choice: 丈夫
  rationale: 与 γυνή 配对并用于婚姻语境，指配偶中的男性，故译作“丈夫”。
- source_word: ἰδίου σώματος
  choice: 自己的身体
  rationale: 保留 ἴδιος 所强调的自身所有关系，同时符合现代汉语习惯。
- source_word: ἐξουσιάζει
  choice: 有权支配
  rationale: 该动词可表示拥有或行使权柄、支配权；“有权支配”既保留权柄含义，也能自然连接“自己的身体”，并在两句严格对称的结构中凸显夫妻双方的相互性。
- source_word: ἀλλά
  choice: 而是
  rationale: 在否定句后引出与之相对的主体，“而是”清楚呈现希腊文的强烈转折。
- source_word: ὁμοίως δὲ καὶ
  choice: 同样……也
  rationale: 自然保留第二句与第一句之间强调相互对应的平行关系。
theological_decisions:
- issue: 婚姻中权柄的性质
  choice: 以完全对称的措辞表达夫妻彼此对对方身体所具有的权柄，不加入单方面的等级或强制意味。
  alternative: 弱化为“身体不属于自己”，或强化为一方“控制”另一方的身体。
  rationale: 原文两句形成明确的互惠平行：妻子与丈夫都不是只对自己的身体行使权柄，而对方也有权柄。译文应保留这种张力和相互性，既不将其化约为归属关系，也不增添原文没有说明的强制性。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“无权支配……而是……有”的省略结构在后半句补足相同含义，贴近原文的对称和简洁；脚注说明动词在“拥有”与“行使”权柄之间的词义幅度。
