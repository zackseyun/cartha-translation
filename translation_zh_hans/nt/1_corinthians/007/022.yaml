  text: ὁ γὰρ ἐν κυρίῳ κληθεὶς δοῦλος ἀπελεύθερος κυρίου ἐστίν· ⸀ὁμοίως ὁ ἐλεύθερος κληθεὶς δοῦλός ἐστιν Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/022.yaml
  text: For the slave who was called in the Lord is the Lord’s freedman[a]; likewise[b], the free man who was called is Messiah’s slave.
translation:
  language: zh_hans
  text: 因为，那在主里蒙召的奴隶，是主的获释者[a]；同样，那蒙召的自由人，是弥赛亚的奴隶[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“主的自由人”。原文所用的词特指从奴隶身份中获释的人。
    reason: lexical_alternative
  - marker: b
    text: 或译“基督”。希腊文意为“受膏者”，这里用作称号。
    reason: title_rendering
lexical_decisions:
- source_word: δοῦλος
  choice: 奴隶
  rationale: 保留受奴役的身份含义，使本节“奴隶—获释者”与“自由人—奴隶”的强烈反转清楚可见；“仆人”会削弱这一社会身份与神学归属之间的张力。
- source_word: ἐν κυρίῳ
  choice: 在主里
  rationale: 按保罗惯用表达保留其联合、领域或关系层面的开放性，不具体化为“被主”或“属于主”。
- source_word: κληθεὶς
  choice: 蒙召
  rationale: 既表达被动语态所暗示的召唤来源，也符合现代中文基督教语境中的自然表达；不在正文中补明召唤者。
- source_word: ἀπελεύθερος
  choice: 获释奴隶
  rationale: 该词特指脱离奴隶身份而获释的人。“获释奴隶”保留其先前身份及法律社会背景，比泛称“自由人”更能形成保罗刻意使用的悖论。
- source_word: κυρίου
  choice: 主的
  rationale: 保留属格关系，不把它单一解释为“由主释放”；中文所有格也能表达此人归属于主。
- source_word: ὁμοίως
  choice: 同样
  rationale: 简洁地维持上下两半句的平行与对应。
- source_word: ἐλεύθερος
  choice: 自由人
  rationale: 准确表达与奴隶相对的社会身份；中文无需添加原文没有明确强调的性别。
- source_word: Χριστοῦ
  choice: 弥赛亚的
  rationale: Χριστός在此作为称号，译作“弥赛亚”可传达“受膏者”的君王性身份；以脚注提供传统译名“基督”。
- source_word: κύριος
  choice: 主
  rationale: 保留保罗赋予耶稣的神学称号，不缩减为社会关系中的“主人”或“主子”。
theological_decisions:
- issue: 社会身份与属灵归属之间的悖论
  choice: 保留“奴隶—主的获释奴隶”及“自由人—弥赛亚的奴隶”的鲜明反转
  alternative: 把δοῦλος弱化为“仆人”，或把ἀπελεύθερος泛化为“自由人”
  rationale: 保罗的论证依赖两组身份的交错对照：社会上的奴隶在主里成为获释者，社会上的自由人却属于弥赛亚、作他的奴隶。弱化任何一项都会减损原文张力。
- issue: κυρίου在“主的获释奴隶”中的属格含义
  choice: 用“主的”保留归属关系及可能的施动关联
  alternative: 明确译为“被主释放的人”
  rationale: 原文属格可突出归属于主，也可能让人联想到主是释放者；正文不把它限定为单一解释。
- issue: Χριστοῦ的称号含义
  choice: 弥赛亚的
  alternative: 基督的
  rationale: “弥赛亚”明确呈现Χριστός的称号性质；脚注保留中文读者熟悉的传统对应词“基督”。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。句式尽量贴近原文的两重平行结构，以分号呈现对称关系；“蒙召”“在主里”保留保罗书信中具有神学分量但现代读者仍可理解的表达。
