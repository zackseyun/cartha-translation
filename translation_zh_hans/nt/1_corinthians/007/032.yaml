  text: Θέλω δὲ ὑμᾶς ἀμερίμνους εἶναι. ὁ ἄγαμος μεριμνᾷ τὰ τοῦ κυρίου, πῶς ⸀ἀρέσῃ τῷ κυρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/032.yaml
  text: But I want you to be free from anxieties. The unmarried man is concerned with the things of the Lord[a], how he may please the Lord;
translation:
  language: zh_hans
  text: 但我愿你们无所挂虑。未婚的男人关心主的事[a]，想着怎样讨主喜悦；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“未婚的人关心主的事。”希腊原文是阳性单数（“未婚的男人”），不过保罗在上下文中更广泛地论到未婚和已婚的处境。
    reason: 词汇替代及阳性单数形式说明
lexical_decisions:
- source_word: Θέλω δὲ
  choice: 但我愿
  rationale: θέλω表达意愿；δέ在此承接并略带转折，“但”自然地连接前文。
- source_word: ὑμᾶς ἀμερίμνους εἶναι
  choice: 你们无所挂虑
  rationale: ἀμέριμνος指不受忧虑或牵挂困扰；“无所挂虑”既保留与后文μεριμνᾷ的词义联系，也不表示冷漠或毫不关心。
- source_word: ὁ ἄγαμος
  choice: 未婚的男人
  rationale: 该名词化形容词为阳性单数，且紧接的上下文分别谈论男性和女性的婚姻处境，因此正文保留其性别和单数形式。
- source_word: μεριμνᾷ
  choice: 关心
  rationale: μεριμνάω可指忧虑，也可指关切、操心；其对象是“主的事”，故译为“关心”，避免误示这种关注本身是负面的，同时保留与“挂虑”的语义呼应。
- source_word: τὰ τοῦ κυρίου
  choice: 主的事
  rationale: 该属格结构泛指与主有关或属于主的事务；“主的事”简洁自然，并保留原文宽泛的指向。
- source_word: κυρίου / κυρίῳ
  choice: 主
  rationale: κύριος在此是基督徒语境中的称号，译为“主”可保留其惯常的词汇与神学分量。
- source_word: πῶς ἀρέσῃ τῷ κυρίῳ
  choice: 想着怎样讨主喜悦
  rationale: πῶς引出所关心的方式或目标，ἀρέσῃ为虚拟式；“想着怎样”自然表达所考虑、谋求的行动，而不把它说成已经实现的事实。
theological_decisions:
- issue: 保罗论未婚与已婚处境时使用阳性单数
  choice: 正文译作“未婚的男人”
  alternative: “未婚的人”或“未婚者”
  rationale: 希腊文形式是阳性单数，而且相邻经文分别处理男性与女性的情形。正文保留这一语法特征；脚注说明整段论述的范围更广，以免读者误以为原则完全排除女性。
- issue: ἀμέριμνος与μεριμνάω之间的张力
  choice: 分别译作“无所挂虑”和“关心”
  alternative: 两处均采用“忧虑”或“挂虑”一类同根措辞
  rationale: 原文刻意使用同一词族，却可依对象呈现负担性的忧虑或正当的关切。中文用不同但相关的词表达语境差异，同时不把主的事描述成消极焦虑。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“无所挂虑”略具经文语体但仍属常用表达；“关心主的事”自然简洁。脚注标记[a]紧随相关短语之后。
