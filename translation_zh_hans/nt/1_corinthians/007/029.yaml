  text: τοῦτο δέ φημι, ἀδελφοί, ὁ καιρὸς συνεσταλμένος ⸂ἐστίν· τὸ λοιπὸν⸃ ἵνα καὶ οἱ ἔχοντες γυναῖκας ὡς μὴ ἔχοντες ὦσιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/029.yaml
  text: 'This is what I mean[a], brothers: the time has been shortened, so that from now on even those who have wives should be as though they had none[b],'
translation:
  language: zh_hans
  text: 弟兄们[a]，我要说的是，时候已经缩短了[b]；从今以后，有妻子的，也要像没有妻子一样，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄们”译自希腊语阳性复数ἀδελφοί；这个称呼在此可以包括男女信徒。
    reason: cultural_note
  - marker: b
    text: “时候已经缩短了”或译“所定的时候已经不多了”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δέ φημι
  choice: 我要说的是
  rationale: 以现代汉语自然地表达保罗引出说明的言谈公式，同时保留“我说这事”的强调意味。
- source_word: ἀδελφοί
  choice: 弟兄们
  rationale: 保留希腊语阳性复数称呼的形式；在当时书信语境中，该称呼可以涵盖整个信徒群体，相关说明置于脚注。
- source_word: ὁ καιρός
  choice: 时候
  rationale: καιρός指具有决定性或特定意义的时段，不只是抽象的钟表时间；“时候”简洁、庄重，也让上下文承载其末世性的分量。
- source_word: συνεσταλμένος ἐστίν
  choice: 已经缩短了
  rationale: 反映完成时迂说结构所表达的结果状态，即这时候已经受到收缩、如今处于缩短的状态；不擅自说明是谁使之缩短。
- source_word: τὸ λοιπὸν
  choice: 从今以后
  rationale: 在本句中引出余下时日应有的生活方式；“从今以后”是清楚自然的现代汉语表达。
- source_word: ἵνα
  choice: 也要
  rationale: 结合前面的“时候已经缩短了”和后续劝勉，以汉语承接其目的或结果意味；不强行判定ἵνα只表示目的或只表示结果。
- source_word: οἱ ἔχοντες γυναῖκας
  choice: 有妻子的
  rationale: 贴近原文“有妻子的人”，并明确γυναῖκας在此指妻子，而非泛指女人。
- source_word: ὡς μὴ ἔχοντες
  choice: 像没有妻子一样
  rationale: 保留原文尖锐的比较表达，不将其解释性地弱化为“不要过分依恋婚姻”，也不暗示婚姻关系已被解除。
theological_decisions:
- issue: 保罗关于婚姻之劝勉的牧养与神学力度
  choice: 直译为“有妻子的，也要像没有妻子一样”
  alternative: 解释性地译为“已婚的人应当超然看待婚姻”或改写以缓和与保罗其他婚姻教导之间的张力
  rationale: 原文在时间紧迫的背景下，相对化日常社会处境，其表述刻意鲜明。译文应保留这种张力，不把它解释为废除婚姻义务，也不在翻译中提前调和。
- issue: ἵνα所表达的逻辑关系
  choice: 用“从今以后……也要……”承接
  alternative: 明确译作纯目的关系“为要使”或纯结果关系“以致”
  rationale: ἵνα在此可承载目的、结果或劝勉性后果。汉语采用自然承接方式，以免过度限定其句法与神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留保罗句子的紧迫感和未完待续的逗号结构；避免古奥的“自今而后”，也不以解释性措辞消解婚姻劝勉的张力。
