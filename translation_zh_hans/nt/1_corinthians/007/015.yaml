  text: εἰ δὲ ὁ ἄπιστος χωρίζεται, χωριζέσθω· οὐ δεδούλωται ὁ ἀδελφὸς ἢ ἡ ἀδελφὴ ἐν τοῖς τοιούτοις, ἐν δὲ εἰρήνῃ κέκληκεν ⸀ἡμᾶς ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/015.yaml
  text: But if the unbeliever separates[a], let him separate. The brother or the sister is not enslaved in such cases[c][b], but God has called us in peace.
translation:
  language: zh_hans
  text: 但如果不信的一方[a]离开，就让他离开。弟兄或姊妹在这种情况下不受奴役[b]；但神已经在平安中召了我们[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 按上下文，指“不信的配偶”；原文直译为“不信的那一方”。
    reason: lexical_alternative
  - marker: b
    text: 或译“不受束缚”。原文动词的基本意思是“奴役”，不是通常表示“捆绑”的动词。
    reason: lexical_alternative
  - marker: c
    text: 有些抄本作“你们”。
    reason: textual_variant
lexical_decisions:
- source_word: ὁ ἄπιστος
  choice: 不信的一方
  rationale: 原文是形容词名词化，直指“不信的那一方”；婚姻语境表明所指是不信的配偶，但正文不额外补出“配偶”，以保留原文的含蓄表达。
- source_word: χωρίζεται / χωριζέσθω
  choice: 要离开，就让他离开
  rationale: χωρίζω在此指婚姻关系中的分离或离去；“离开”是自然的现代汉语，并保留两个同根动词的重复。第一个“要”表达正在选择离开的情形，第二句为容许性的命令，不把它说成主动要求离婚。
- source_word: οὐ δεδούλωται
  choice: 不受奴役
  rationale: 原词来自δουλόω（使人成为奴隶、奴役），并非通常表示“捆绑”的δέω。采用“不受奴役”保留其鲜明措辞，不预先断定这里所说的自由是否包括再婚。
- source_word: ὁ ἀδελφὸς ἢ ἡ ἀδελφὴ
  choice: 弟兄或姊妹
  rationale: 保留保罗对男女信徒所用的家人称谓，也明确呈现原文的两种性别形式。
- source_word: ἐν τοῖς τοιούτοις
  choice: 在这种情况下
  rationale: 这是指刚才所述一类处境的惯用表达；汉语用单数概括类属最为自然。
- source_word: ἐν δὲ εἰρήνῃ
  choice: 原是要我们和睦
  rationale: 在本段婚姻冲突的语境中，用自然汉语表达蒙召与和平、和睦之间的关系；脚注说明更贴近介词形式的译法，以免掩盖“在平安中”与“归向和平”之间的语义张力。
- source_word: κέκληκεν ἡμᾶς ὁ θεός
  choice: 神召我们
  rationale: 汉语“召”本身可表达已经发生且持续有效的呼召，不必机械添加“已经”；正文依SBLGNT采用“我们”。
theological_decisions:
- issue: οὐ δεδούλωται对婚姻解除及再婚的含义
  choice: 译作“不受奴役”，不在正文中界定这种自由的全部范围。
  alternative: 译作“不受约束”，并将其理解为准许再婚；或仅理解为信徒不必强迫离去的配偶留下。
  rationale: 经文明确说信主的一方“不受奴役”，却没有在本节明说这是否构成再婚许可。贴近δουλόω的措辞可保留这一神学张力。
- issue: ὁ ἄπιστος的具体所指
  choice: 正文译作“不信的一方”，由上下文显明是不信的配偶。
  alternative: 直接译作“不信的配偶”。
  rationale: 婚姻语境使所指清楚，但原文没有使用“配偶”一词；不在正文补明可兼顾准确和含蓄。
- issue: ἐν εἰρήνῃ与神呼召的关系
  choice: 正文以“原是要我们和睦”作自然表达，同时用脚注保留“在平安中”的形式。
  alternative: 神已经在平安中召了我们。
  rationale: 介词ἐν可表示范围、状态或关联；正文避免生硬，脚注则防止把目的性理解当作唯一可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不信的一方”适合婚姻双方的语境，并避免正文过度解释；“弟兄或姊妹”“不受奴役”保留原文的重要称谓和意象。分号呈现前后转折，同时保持经文节奏。
