  text: τοῦτο δὲ πρὸς τὸ ὑμῶν αὐτῶν ⸀σύμφορον λέγω, οὐχ ἵνα βρόχον ὑμῖν ἐπιβάλω, ἀλλὰ πρὸς τὸ εὔσχημον καὶ ⸀εὐπάρεδρον τῷ κυρίῳ ἀπερισπάστως.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/035.yaml
  text: I say this for your own benefit, not to put a noose on you, but for what is proper and for undistracted devotion to the Lord.
translation:
  language: zh_hans
  text: 我说这话，是为了你们自己的益处，不是要给你们套上绳套，而是为了让你们行事合宜，并能不受牵扰地专心侍奉主。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σύμφορον
  choice: 益处
  rationale: 表示对收信人有利、有帮助之事；“为了你们自己的益处”自然传达 πρὸς τὸ ὑμῶν αὐτῶν σύμφορον。
- source_word: βρόχον
  choice: 绳套
  rationale: 本义为套索、绳圈，在此比喻强加约束；保留具体而有力度的意象，不弱化为笼统的“限制”。
- source_word: εὔσχημον
  choice: 行事端正
  rationale: 在本段伦理语境中指合宜、体面或端正的行为；译为“行事端正”比单说“合宜”更清楚自然。
- source_word: εὐπάρεδρον τῷ κυρίῳ
  choice: 侍奉主
  rationale: 该词组表达安稳地守候在主旁、忠心专注于主；“侍奉主”适合现代汉语，也保留其献身与服事意味。
- source_word: ἀπερισπάστως
  choice: 专心不受牵扰地
  rationale: 强调不被别的事务拉开或分散注意；“专心不受牵扰”同时表达积极的专注和消极的不分心。
theological_decisions:
- issue: 保罗话语的目的是否构成强制性的独身规定
  choice: 不是要把绳套套在你们身上
  alternative: 不是要限制你们
  rationale: 保留 βρόχον 的套索意象，清楚表明保罗不是要以强制性规条辖制信徒，同时不把他的劝勉弱化为纯粹建议。
- issue: εὐπάρεδρον 所指的是敬虔、亲近还是服事
  choice: 侍奉主
  alternative: 亲近主／献身于主
  rationale: 原词涵盖在主面前稳定守候和专注投入的意味；“侍奉”在上下文中较自然，但不限定为教会职分或某种宗派性的服事观。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“绳套”保留原文鲜明比喻；后半句用并列结构呈现“行事端正”与“不受牵扰地侍奉主”两个相关目标。未添加“现在”等原文没有明确对应词的篇章标记。
