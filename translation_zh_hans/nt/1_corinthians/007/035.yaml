  terminology: “益处”“绳套”“主”均恰当。“行事合宜”保留 εὔσχημον 的“适当、得体”含义，避免“端正”可能带来的较强道德化色彩；“不受牵扰地专心侍奉主”适切表达 ἀπερισπάστως 修饰对主的稳定专注。
