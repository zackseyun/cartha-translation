review_pass:
  verdict: revise
  source_fidelity: 正文准确保留了“蒙召时”的身份、奴隶与自由的社会身份对照，以及不要挂虑的劝勉。末句的希腊文 μᾶλλον（“倒、宁可、更要”）在“也要”中没有得到充分体现；改为“倒要”可保留其对前句的转折与强调。
  naturalness: “你蒙召时是奴隶吗？不要为此忧虑。”自然、庄重且符合现代标准汉语。“不过，若你能获得自由，倒要善用这个机会”清楚顺畅，也避免“即使……也要”在此处可能造成的让步关系误解。
  terminology: “蒙召”恰当地保留保罗书信语境而未擅自扩展；“奴隶”准确对应 δοῦλος；“获得自由”准确对应 ἐλεύθερος γενέσθαι。“善用这个机会”作为正文对省略宾语的合理理解可接受，脚注应明确保留另一种解释。
