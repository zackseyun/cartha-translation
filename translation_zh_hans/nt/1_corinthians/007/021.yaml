  text: Δοῦλος ἐκλήθης; μή σοι μελέτω· ἀλλ’ εἰ καὶ δύνασαι ἐλεύθερος γενέσθαι, μᾶλλον χρῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/021.yaml
  text: Were you called as a slave? Do not let it trouble you. But if indeed you are able to become free[a], rather make use of it.
translation:
  language: zh_hans
  text: 你蒙召时是奴隶吗？不要为此忧虑。不过，若你能获得自由，倒要善用这个机会。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“倒要善用你目前的处境”，即仍守在原有处境中。希腊文“善用”所指的对象没有明说，因此这两种理解都有依据。
    reason: alternative_reading
lexical_decisions:
- source_word: Δοῦλος
  choice: 奴隶
  rationale: 此处指受奴役的社会身份，并与下文“获得自由”形成明确对照；“奴隶”比“仆人”更准确。
- source_word: ἐκλήθης
  choice: 你蒙召时
  rationale: 保留保罗书信中神圣呼召的含义，同时结合上下文自然表达蒙召之时所处的身份，不明加“被神”或“信主”。
- source_word: μή σοι μελέτω
  choice: 不要为此忧虑
  rationale: 该惯用语表达挂虑或困扰；此译法简明自然，并保留劝勉语气。
- source_word: ἐλεύθερος γενέσθαι
  choice: 获得自由
  rationale: 准确表达从奴隶身份转为自由身份，在现代汉语中也比直译“成为自由人”更自然。
- source_word: μᾶλλον χρῆσαι
  choice: 也要善加利用这个机会
  rationale: χράομαι意为“利用、使用”，宾语在希腊文中省略。正文按紧邻条件句理解为利用获得自由的机会；“也要”在汉语中体现让步条件后的递进转折。另一种历史悠久的理解在脚注中保留。
theological_decisions:
- issue: μᾶλλον χρῆσαι所省略宾语造成的解释歧义
  choice: 理解为若有获得自由的机会，就加以利用
  alternative: 理解为善用当前的奴隶身份，也就是仍守原状
  rationale: 紧邻的“即使能够获得自由”最自然地提供了隐含宾语，即获得自由的机会；但原文没有明说宾语，另一理解亦有充分历史依据，因此以脚注保存歧义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“蒙召”保留保罗语境中的神学用语；“奴隶”“获得自由”清楚呈现社会身份的对照。脚注标记已在正文中以[a]列出。
