- from: 你蒙召时是奴隶吗？不要为此忧虑。不过，你即使能够获得自由，也要善加利用这个机会。[a]
  to: 你蒙召时是奴隶吗？不要为此忧虑。不过，若你能获得自由，倒要善用这个机会。[a]
  rationale: 修订以“倒要”对应 μᾶλλον，并以“若你能”自然表达条件句，避免将 εἰ καί处理成中文“即使……也……”所可能带来的语义偏移。正文仍采用紧邻语境下“善用获得自由的机会”的理解；脚注保留“善用当前处境”的历史性替代解释，且不把任何一种解释说成原文唯一含义。
