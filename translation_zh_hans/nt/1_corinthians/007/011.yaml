  text: ἐὰν δὲ καὶ χωρισθῇ, μενέτω ἄγαμος ἢ τῷ ἀνδρὶ καταλλαγήτω— καὶ ἄνδρα γυναῖκα μὴ ἀφιέναι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/011.yaml
  text: But if she does separate[a], let her remain unmarried[b], or else be reconciled to her husband—and a husband must not divorce his wife.
translation:
  language: zh_hans
  text: 但即使她与丈夫分开了[a]，就应当保持未婚，或与丈夫和好；丈夫也不可与妻子离婚[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“但如果她与丈夫分开了。”原文中的καί在这里可以略带“即使”的让步意味。
    reason: lexical_alternative
  - marker: b
    text: 或译：“丈夫也不可遣走妻子。”原文动词的基本含义可指“放走、遣走或离开”，在这里的婚姻语境中通常指休妻或离婚。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ καὶ
  choice: 但即使
  rationale: καί在这一条件句中可带让步意味。“但即使”自然表达这一层次，同时不改变条件句的性质。
- source_word: χωρισθῇ
  choice: 她与丈夫分开了
  rationale: χωρίζω可指分开、离开；此处所指是夫妻分居或分开，不宜直接限定为正式离婚。补出“与丈夫”使现代汉语指向清楚。
- source_word: μενέτω ἄγαμος
  choice: 应当不再嫁人
  rationale: 直译为“保持未婚”在汉语中生硬，且对已婚后分开的女子容易造成状态用语上的误解。“不再嫁人”自然表达继续不进入另一婚姻的命令含义。
- source_word: καταλλαγήτω
  choice: 与丈夫和好
  rationale: 被动命令式表示得到和解、恢复和好；汉语“与丈夫和好”保留关系修复的含义，又不额外规定具体程序。
- source_word: ἀνδρί / ἄνδρα
  choice: 丈夫
  rationale: ἀνήρ虽也可指男人，但上下文明指婚姻关系，因此译作“丈夫”。
- source_word: γυναῖκα
  choice: 妻子
  rationale: γυνή可指女人或妻子；婚姻语境要求译作“妻子”。
- source_word: μὴ ἀφιέναι
  choice: 不可与妻子离婚
  rationale: ἀφίημι基本义可包括放走、离开或遣走，在婚姻语境中通常指解除婚姻或休弃配偶。“不可与妻子离婚”以现代汉语清楚传达禁止意味。
theological_decisions:
- issue: 是否把χωρισθῇ与ἀφιέναι译成同一个婚姻法律术语
  choice: 前者译“分开”，后者译“离婚”
  alternative: 两者都译作“离婚”，或都泛译作“分开/离开”
  rationale: 原文有意使用两个不同动词。保留区别可避免把χωρισθῇ过早限定为正式离婚，也承认ἀφιέναι在这里具有休弃或离婚的婚姻语境含义。
- issue: 如何表达μενέτω ἄγαμος对分开后女子的要求
  choice: 译作“应当不再嫁人”
  alternative: 译作“应当保持未婚”或“应当继续独身”
  rationale: “不再嫁人”准确传达不得另行结婚的实际含义；“保持未婚”在现代汉语中不合已婚者分开后的通常表述，“继续独身”则可能被理解为更宽泛的禁欲要求。
- issue: 是否明确第一分句的女性主语
  choice: 使用“她”，并补明“与丈夫”分开
  alternative: 全句改用“妻子”作主语
  rationale: 前文正在谈妻子，希腊语动词为第三人称单数而省略主语。汉语补出“她”符合篇章衔接；补明“与丈夫”可避免“分开”对象含混。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不再嫁人”比“保持未婚”自然；“与妻子离婚”比“休妻”更符合当代用语。分号保留原句由妻子转向丈夫的并列禁令结构。
