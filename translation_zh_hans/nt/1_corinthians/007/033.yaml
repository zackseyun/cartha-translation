  text: ὁ δὲ γαμήσας μεριμνᾷ τὰ τοῦ κόσμου, πῶς ⸀ἀρέσῃ τῇ γυναικί,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/033.yaml
  text: But the married man is concerned with the things of the world[a], how he may please his wife,
translation:
  language: zh_hans
  text: 但已婚的男人挂念世上的事[a]，想着怎样使妻子喜悦，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“世间的事务”或“世上的各种事情”。
    reason: 词义替代译法
lexical_decisions:
- source_word: ὁ δὲ γαμήσας
  choice: 但已婚的男人
  rationale: 带冠词的简单过去时分词在此作名词用，指已婚男性，并与上下文中的未婚男人形成对照。“已婚的男人”自然、明确，也保留了希腊文阳性单数的指向。
- source_word: μεριμνᾷ
  choice: 挂念
  rationale: 该动词可表示忧虑、关切或操心。这里描述婚姻所带来的现实牵挂，未必指有罪的焦虑；“挂念”既自然，也不过度强化负面情绪。
- source_word: τὰ τοῦ κόσμου
  choice: 世上的事
  rationale: 这一结构指属于世间日常生活范畴的事务。“世上的事”保留复数而含义中性，不把 κόσμος 擅自解释为道德上的邪恶。
- source_word: πῶς ἀρέσῃ
  choice: 想着怎样使……喜悦
  rationale: πῶς 加虚拟式说明其挂念的内容，即怎样取悦妻子。补出“想着”使汉语句法顺畅，并保留筹划、寻求如何做到的意味。
- source_word: τῇ γυναικί
  choice: 妻子
  rationale: 在婚姻语境中 γυνή 明确指妻子；所属关系由“已婚的男人”及汉语语境自然表达，无须机械添加代词。
theological_decisions:
- issue: κόσμος 在此是否带有道德贬义
  choice: 以中性的“世上的事”表达
  alternative: 译成带贬义的“属世的事”
  rationale: 上下文强调已婚者因现实责任而有所牵挂，与专心服事主形成张力，并非全面谴责婚姻或日常责任。中性译法避免加入禁欲主义判断。
translation_notes:
  register: 采用现代、庄重而通俗的普通话。“挂念”比“忧虑”更中性，符合本节语境；句末逗号保留与下一节连续的句法关系。
