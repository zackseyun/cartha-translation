  to: 哭泣的人，要像不哭泣；欢喜的人，要像不欢喜；购买的人，要像不拥有。[a]
  rationale: 修订以动词性“不哭泣／不欢喜／不拥有”对应原文三处μὴ加现在分词，消除原译的名词化和末项不自然搭配，同时保留“要像”所表达的劝勉性方式、三重平行结构及原文未明说的具体拥有对象。脚注相应说明“仿佛”这一自然替代译法及该结构并非否定经历的现实性。
