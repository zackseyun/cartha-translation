  text: καὶ οἱ κλαίοντες ὡς μὴ κλαίοντες, καὶ οἱ χαίροντες ὡς μὴ χαίροντες, καὶ οἱ ἀγοράζοντες ὡς μὴ κατέχοντες,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/030.yaml
  text: and those who weep as not weeping[a], and those who rejoice as not rejoicing, and those who buy as not possessing,
translation:
  language: zh_hans
  text: 哭泣的人，要像不哭泣；欢喜的人，要像不欢喜；购买的人，要像不拥有。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“仿佛不哭泣……仿佛不欢喜……仿佛不拥有。”希腊原文反复使用“像不……”的结构，表达的是面对这些经历时所采取的态度或方式，并非否认这些经历确实发生。
    reason: lexical_alternative
lexical_decisions:
- source_word: κλαίοντες
  choice: 哀哭的
  rationale: 带冠词的现在分词作名词使用，指正在哀哭的人。“哀哭”直接保留具体的情感行动，也比“哀恸”较少限定原因。
- source_word: ὡς μὴ κλαίοντες
  choice: 要像没有哀哭
  rationale: ὡς 加 μή 和分词表达生活方式或姿态，并非否认哀哭实际发生；此译保留原文紧凑的“像没有……”结构。
- source_word: χαίροντες
  choice: 喜乐的
  rationale: χαίρω 在保罗书信中常指喜乐；此处用“喜乐”既庄重自然，也与“哀哭”形成平行。
- source_word: ὡς μὴ χαίροντες
  choice: 要像没有喜乐
  rationale: 沿用前一分句相同的结构，以保留原文反复而累进的修辞。
- source_word: ἀγοράζοντες
  choice: 买东西的
  rationale: 指一般的购买行为；“买东西”是现代汉语中自然、直接的表达。
- source_word: κατέχοντες
  choice: 占有
  rationale: κατέχω 可指持有、保有或占有；在与“买”对举的语境中，“占有”体现把所买之物牢牢视为己有的含义，同时不缩窄为法律意义上的所有权。
- source_word: καὶ
  choice: ；……；……
  rationale: 原文重复 καὶ 串联三个平行群体。汉语以分号和重复句式呈现累进节奏，避免机械重复“并且”造成不自然。
theological_decisions:
- issue: 反复出现的“ὡς μὴ”结构应如何理解
  choice: 译作“要像没有……”，表达信徒对情感和经济活动应持有某种超然、不被辖制的生活姿态，而非否认这些经历真实发生。
  alternative: 可译作“仿佛没有……”；也可能被理解成更强的禁欲要求。
  rationale: ὡς μὴ 加分词在此描述行为方式或态度。结合7:26、31关于当前困境及这世界样式正在过去的语境，应保留其末世性的张力，却不把哀哭、喜乐或购买本身判为不当。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。三个平行分句保留原文压缩、反复的修辞；用“要像没有”使劝勉语气在汉语中清楚呈现。脚注标记置于整组平行句末，适用于三处相同结构。
