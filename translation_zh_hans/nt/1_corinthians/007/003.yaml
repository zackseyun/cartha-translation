  text: τῇ γυναικὶ ὁ ἀνὴρ τὴν ⸀ὀφειλὴν ἀποδιδότω, ὁμοίως δὲ καὶ ἡ γυνὴ τῷ ἀνδρί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/003.yaml
  text: The husband must give to his wife her marital duty, and likewise the wife to her husband.
translation:
  language: zh_hans
  text: 丈夫应当向妻子尽他所当尽的本分[a]；妻子向丈夫也应当如此。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“应尽之责”；直译“所欠的”。按上下文，指夫妻在婚姻生活中彼此应尽的义务。
    reason: 说明ὀφειλή的字面意义及其上下文所指。
lexical_decisions:
- source_word: γυναικί
  choice: 妻子
  rationale: 婚姻语境明确指妻子，而非泛指女人。
- source_word: ἀνήρ / ἀνδρί
  choice: 丈夫
  rationale: 与“妻子”相对应，在此婚姻语境中指丈夫。
- source_word: ὀφειλήν
  choice: 本分
  rationale: 原词指所欠的责任或义务；“本分”在现代汉语中自然简洁，并由上下文表达夫妻之间的婚姻义务，同时避免将原词过度具体化。
- source_word: ἀποδιδότω
  choice: 应当尽
  rationale: 现在时命令式表达持续性的要求；“应当尽……本分”既传达命令意味，也符合现代汉语搭配。
- source_word: ὁμοίως δὲ καὶ
  choice: 也应当照样做
  rationale: 清楚表达第二分句与第一分句之间对等、互惠的关系。
theological_decisions:
- issue: 是否在正文中明确把ὀφειλή解释为夫妻间的性义务
  choice: 采用较宽的“本分”，并以脚注说明上下文所指
  alternative: 夫妻生活的义务；应尽之责；当给的
  rationale: 上下文表明这是夫妻生活方面彼此所负的义务，但ὀφειλή本身意为“所欠的、义务”。正文保留其词义宽度，脚注交代语境，避免过度解释，同时维持夫妻双方完全对等的伦理重点。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“尽……本分”属自然搭配；以分号保留原文平衡的两句结构，并突出夫妻之间义务的相互性。
