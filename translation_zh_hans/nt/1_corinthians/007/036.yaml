review_pass:
  verdict: revise
  source_fidelity: 正文总体准确传达了原文的条件句、年龄相关描述、概括性的必要性、许可性命令、非犯罪判断及复数命令“让他们结婚”。但“自己对他的童女”在人称指涉上不协调；原文同一人既是“认为”的主语，也是αὐτοῦ所指的所属者，中文宜统一为“自己的”。“这不算犯罪”虽可理解为前述行为，原文直接谓述“他不犯罪”，宜相应译出。
  naturalness: “自己的童女”仍保留正式圣经语体及原文未说明的关系，同时比“自己对他的童女”自然、清楚。“待……不合宜”比“对……行事不当”更合乎现代汉语搭配，且不缩窄ἀσχημονεῖν的含义。
  terminology: “童女”可在正文中保留παρθένος及关系的不确定性；脚注须明确其可指订婚对象或童贞女儿，避免正文强行选择一种解释。“犯罪”“结婚”均适切。
  issues:
  - severity: medium
    issue: “自己对他的童女”人称不一致且中文表达别扭。
    rationale: 希腊文tis、主语及αὐτοῦ在此均指同一泛指男性。“他的”虽可被理解为泛指，但紧接“自己”会造成不必要的指涉跳转。改为“自己的童女”可保留关系歧义。
  - severity: low
    issue: “这不算犯罪”没有直接保留原文“他不犯罪”的人物谓述。
    rationale: 原文οὐχ ἁμαρτάνει的主语是该男子；译为“他并没有犯罪”更贴合句法，也不改变其对所许可行动的道德判断。
  revised_text: 但若有人认为自己待自己的童女不合宜，若她已过了青春年华，而且事情理当如此，他就照自己的心愿去做吧；他并没有犯罪。让他们结婚吧。
  revised_footnotes:
  - marker: a
    text: 或译“他所订婚的童女”或“他的未婚妻”；传统上也有人理解为“他的童贞女儿”。希腊原文对二人的具体关系有歧义。
    reason: 说明ἐπὶ τὴν παρθένον αὐτοῦ中人物关系的主要可能解释，并保留原文歧义。
  revision_rationale: 修订统一泛指人物的人称，并将“他不犯罪”直接译出；其余保留原文的概括性和命令语气。正文使用“自己的童女”而不具体定为未婚妻或女儿，脚注记录两项主要解释。
