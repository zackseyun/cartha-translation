revisions:
- from: 但若有人认为自己对他的童女[a]行事不当，而她又过了青春年华，事情也理当如此，他就可以照自己的心愿去做；这不算犯罪。让他们结婚吧。
  to: 但若有人认为自己待自己的童女不合宜，若她已过了青春年华，而且事情理当如此，他就照自己的心愿去做吧；他并没有犯罪。让他们结婚吧。
  rationale: 修订统一泛指人物的人称，并将“他不犯罪”直接译出；其余保留原文的概括性和命令语气。正文使用“自己的童女”而不具体定为未婚妻或女儿，脚注记录两项主要解释。
  reviewer_model: gpt-5.6-terra
