  text: Εἰ δέ τις ἀσχημονεῖν ἐπὶ τὴν παρθένον αὐτοῦ νομίζει ἐὰν ᾖ ὑπέρακμος, καὶ οὕτως ὀφείλει γίνεσθαι, ὃ θέλει ποιείτω· οὐχ ἁμαρτάνει· γαμείτωσαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/036.yaml
  text: But if anyone thinks he is behaving improperly toward his virgin[a], if she is past her youth and it ought to be so, let him do what he wants; he is not sinning. Let them marry.
translation:
  language: zh_hans
  text: 但若有人认为自己待自己的童女不合宜，若她已过了青春年华，而且事情理当如此，他就照自己的心愿去做吧；他并没有犯罪。让他们结婚吧。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσχημονεῖν
  choice: 行事不当
  rationale: 表达举止不合宜、不得体之意，保留道德与社会层面的不当含义，又不夸大为明确的淫乱行为。
- source_word: ἐπὶ τὴν παρθένον αὐτοῦ
  choice: 对他的童女
  rationale: παρθένος直指童女或处女，而αὐτοῦ所表达的关系在本节有歧义；正文采用较直译的措辞，并以脚注列出未婚妻及女儿两种主要理解。
- source_word: ὑπέρακμος
  choice: 过了青春年华
  rationale: 该词指越过青春鼎盛期；此译自然地表达年龄含义，但不擅自限定为现代意义上的某个法定或适婚年龄。
- source_word: καὶ οὕτως ὀφείλει γίνεσθαι
  choice: 事情也理当如此
  rationale: 保留ὀφείλει所含的应当或必要之意，以及γίνεσθαι在原文中的概括性，不明确添加情欲、舆论或婚龄压力。
- source_word: ὃ θέλει ποιείτω
  choice: 他就可以照自己的心愿去做
  rationale: 以自然中文表达第三人称命令式所具有的许可意味。
- source_word: οὐχ ἁμαρτάνει
  choice: 这不算犯罪
  rationale: 在中文圣经语体中自然表达该行为并非犯罪；“这”指向前述决定，避免误解为对人物整体的判断。
- source_word: γαμείτωσαν
  choice: 让他们结婚吧
  rationale: 保留第三人称复数命令式，也清楚表明涉及双方。
theological_decisions:
- issue: “他的童女”（παρθένον αὐτοῦ）的身份
  choice: 正文保留关系上的歧义，以“他的童女”呈现。
  alternative: 可理解为他的未婚妻、与他订婚的童女；传统上也可理解为由他作主的童贞女儿。
  rationale: 希腊文没有明确说明男子与童女的具体关系，语境历来容许婚约关系和父亲或监护关系两种主要解释；正文不替原文消除这一诠释张力。
translation_notes:
  register: 采用现代、庄重且普通读者易懂的标准普通话。“童女”虽较日常用语正式，却能在正文中保留παρθένος及人物关系的歧义；脚注提供自然的现代称谓。句法尽量贴近原文逻辑，同时避免生硬的欧化结构。
