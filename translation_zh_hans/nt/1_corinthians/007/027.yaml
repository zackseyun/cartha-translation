base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/027.yaml
  text: Are you bound to a wife? Do not seek release[a]. Are you released from a wife? Do not seek a wife.
translation:
  language: zh_hans
  text: 你与妻子相系吗？不要寻求解除[a]。你已经脱离妻子了吗？不要寻求妻子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较具解释性地译作：“你结婚了吗？不要寻求离婚。你离婚了吗？不要寻求妻子。”希腊文较直译地说“相系”和“解除／脱离”。
    reason: alternative_reading
lexical_decisions:
- source_word: δέδεσαι
  choice: 与……相系
  rationale: 这是δέω的完成时中间或被动形式，表达已经被系住、如今仍处于约束中的状态。“相系”保留原文的系结意象，也能与后文的“解脱／脱离”形成对应。
- source_word: γυναικί
  choice: 与妻子
  rationale: 在本段婚姻语境中，γυνή指“妻子”；与δέδεσαι连用时译作“与妻子相系”符合现代汉语表达。
- source_word: ζήτει
  choice: 寻求
  rationale: 保留ζητέω主动追求某事的含义和否定命令的语气，比“想要”更准确。
- source_word: λύσιν
  choice: 解脱
  rationale: λύσις本义是解开、解除。“解脱”既保留与“相系”相对的意象，也不把所指直接限定为法律意义上的离婚。
- source_word: λέλυσαι
  choice: 已经……脱离
  rationale: 这是λύω的完成时中间或被动形式，强调解开之后持续存在的状态。“已经……脱离”在汉语中较自然，并与前半句的“相系／解脱”相呼应。
- source_word: ἀπὸ γυναικός
  choice: 与妻子脱离
  rationale: ἀπό表示离开、脱离；婚姻语境中的γυνή译为“妻子”。汉语用“与……脱离”比逐字译作“从妻子”自然。
- source_word: γυναῖκα
  choice: 妻子
  rationale: 末句谈的是进入婚姻关系，因此γυνή在此应译为“妻子”，而不是泛指“女人”。
theological_decisions:
- issue: 本节应明确译成“结婚／离婚”，还是保留保罗“系住／解开”的意象
  choice: 正文保留“相系／解脱／脱离”的意象
  alternative: 你结婚了吗？不要寻求离婚。你离婚了吗？不要寻求妻子。
  rationale: 希腊文使用δέω、λύσις和λύω这一组“系住／解开”的词，而没有采用更明确的结婚或离婚术语。保留该意象既呈现原文的词语对应，也避免武断地把“脱离妻子”仅限于离婚，因其具体范围可能也涉及丧偶或其他不再受婚姻约束的状态。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“相系”略带书面色彩，用来保留原文的系结比喻；“解脱”和“脱离”使前后对应清楚，同时不把含义过早收窄为离婚。
