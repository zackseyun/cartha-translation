  text: Τοῖς δὲ γεγαμηκόσιν παραγγέλλω, οὐκ ἐγὼ ἀλλὰ ὁ κύριος, γυναῖκα ἀπὸ ἀνδρὸς μὴ χωρισθῆναι—
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/010.yaml
  text: 'To the married I give this command—not I[a], but the Lord: a wife must not separate from her husband—'
translation:
  language: zh_hans
  text: 至于已婚的人，我吩咐他们——这不是我自己的吩咐，而是主的吩咐：妻子不可离开丈夫[a]——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“不可与丈夫离婚”。这里的希腊语动词指婚姻关系中的分开，在此语境中也可能包括离婚。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῖς δὲ γεγαμηκόσιν
  choice: 至于已婚的人
  rationale: γεγαμηκόσιν指处于婚姻状态的人；“已婚的人”准确而自然。δὲ在此主要转换到相关的新话题，用“至于”体现衔接，不译成较强的转折。
- source_word: παραγγέλλω
  choice: 我吩咐他们
  rationale: 该词表示带权威的命令或指示；“吩咐”保留其权威语气。“他们”补足汉语所需的受事，并对应希腊语与格短语。
- source_word: οὐκ ἐγὼ ἀλλὰ ὁ κύριος
  choice: 不是我，而是主吩咐
  rationale: 保留“我”与“主”的鲜明对照；末尾复现“吩咐”使汉语句法完整，但不在正文中进一步解释这种对照的神学含义。
- source_word: γυναῖκα ἀπὸ ἀνδρὸς
  choice: 妻子……与丈夫
  rationale: 在婚姻语境中，γυνή和ἀνήρ分别指妻子和丈夫；汉语“与丈夫分开”自然表达ἀπό所表示的分离关系。
- source_word: μὴ χωρισθῆναι
  choice: 不可……分开
  rationale: 在命令内容中译为“不可”，保留禁止语气。χωρίζω首先表达分开或分居，在本语境中可能涵盖离婚，但正文不将其限定为现代法律意义上的离婚。
theological_decisions:
- issue: “不是我，而是主”所表达的权威对照
  choice: 直译并保留保罗与主之间的对照，不在正文中说明这是已由主耶稣给出的命令。
  alternative: 将其解释性地译为“这不是我自己的意见，而是主的命令”。
  rationale: 解释性译法会把对照的具体性质直接写入正文。当前译文保留原文张力，也不暗示保罗其余的话没有权威。
- issue: 婚姻语境中χωρισθῆναι的范围
  choice: 分开
  alternative: 离婚
  rationale: “分开”较贴近该动词的基本语义，也与下文的论述衔接；脚注提示它在此可能包括离婚，以保存法律与社会层面的语义开放性。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“至于”自然标示话题转换；破折号保留原句延续到下一节的未完结构。
