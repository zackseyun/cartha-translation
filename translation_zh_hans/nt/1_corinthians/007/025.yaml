  text: Περὶ δὲ τῶν παρθένων ἐπιταγὴν κυρίου οὐκ ἔχω, γνώμην δὲ δίδωμι ὡς ἠλεημένος ὑπὸ κυρίου πιστὸς εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/025.yaml
  text: Concerning virgins[a], I have no command from the Lord[c][b], but I give my judgment as one who by the Lord’s mercy is trustworthy.
translation:
  language: zh_hans
  text: 至于童贞女子[a]，我没有主的命令；但我作为一个蒙主怜悯、得以成为可信之人[c]，提出一个意见[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“未婚女子”；按上下文的一些解释，也可指“童贞的女儿”。希腊文的基本意思是“童贞女子”。
    reason: lexical_alternative
  - marker: b
    text: 或译“判断”或“劝告”。保罗在这里把自己经过考虑的意见与直接“从主而来的命令”区别开来。
    reason: alternative_reading
  - marker: c
    text: 或译“忠信的人”。希腊词既可表示“忠信”，也可表示“可信、可靠”；此处很可能强调保罗因主的怜悯而是可靠的引导者。
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ
  choice: 至于
  rationale: 这是保罗转换话题的常用表达。“至于”自然地标明新议题，不额外加入时间意义。
- source_word: τῶν παρθένων
  choice: 童身女子
  rationale: παρθένος的基本意义是未有性经历的女子，也常指年轻未婚女子。上下文中具体所指存在争议，因此正文保留其基本词义，不缩窄为“女儿”。
- source_word: ἐπιταγὴν κυρίου
  choice: 从主而来的命令
  rationale: ἐπιταγή指命令或权威性指示；此译明确表达命令的来源是主。
- source_word: γνώμην
  choice: 自己的意见
  rationale: γνώμη可指意见、判断或经过考虑的主张。“意见”与前面的直接“命令”形成区别，同时不暗示这只是随意的个人想法。
- source_word: δίδωμι
  choice: 提出
  rationale: 希腊文直译为“给出”；汉语以“提出意见”较自然，并保留现在作出陈述的语气。
- source_word: ὡς
  choice: 以……的身份
  rationale: 表达保罗据以提出意见的身份或资格，保留ὡς的方式和身份意味，不径直改写为因果关系。
- source_word: ἠλεημένος ὑπὸ κυρίου
  choice: 蒙主怜悯
  rationale: 完成时被动分词表示已经从主领受怜悯；“蒙主怜悯”简洁、庄重，并保留被动意义。
- source_word: πιστὸς εἶναι
  choice: 成为可信之人
  rationale: πιστός既可表示“忠信”，也可表示“可信、可靠”。此处保罗是在说明其意见值得信赖的身份根据，正文采用“可信”，并在脚注保留另一可能。
theological_decisions:
- issue: 保罗的意见与主直接命令之间的权威关系
  choice: 译文区分“从主而来的命令”和保罗作为蒙怜悯且可信之人所提出的意见。
  alternative: 将这句话理解为保罗只是在发表没有权威的私人意见，或理解为他间接引用主的一条未知命令。
  rationale: ἐπιταγή与γνώμη形成明确对照：保罗没有可援引的主之直接命令，却并非随意发言，而是以蒙主怜悯成为可信之人的身份作出审慎判断。译文保留这种张力，既不把他的意见等同于主的直接命令，也不贬为无足轻重的私见。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“童身女子”比“处女”更适合经文语体，也避免现代汉语中可能带有的突兀感；脚注说明其可能指未婚女子或童身女儿。“以……的身份”略带正式色彩，但能清楚保留原文ὡς所表达的身份关系。
