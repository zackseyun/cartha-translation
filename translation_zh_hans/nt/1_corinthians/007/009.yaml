  text: εἰ δὲ οὐκ ἐγκρατεύονται, γαμησάτωσαν, κρεῖττον γάρ ἐστιν ⸀γαμῆσαι ἢ πυροῦσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/009.yaml
  text: But if they do not have self-control[a], let them marry; for it is better to marry than to burn.
translation:
  language: zh_hans
  text: 但如果他们不能自制，就应当结婚，因为结婚比欲火中烧好[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译可作“被烧灼”或“燃烧”；在这里最可能指因性欲而灼热难耐。
    reason: 说明原文保留“燃烧”的比喻，并交代上下文所支持的具体含义。
lexical_decisions:
- source_word: ἐγκρατεύονται
  choice: 自制
  rationale: 该动词在这里指实行自我节制；结合上下文，主要涉及性方面的克制。“不能自制”既符合现代汉语习惯，也保留了原文否定式的表达。
- source_word: γαμησάτωσαν
  choice: 就应当结婚
  rationale: 这是第三人称复数不定过去时命令式。“应当结婚”传达劝令的力度；“就”承接前面的条件，表达在不能自制的情况下所当采取的行动。
- source_word: κρεῖττον
  choice: 总比……好
  rationale: 该比较级作表语，意思是“更好”。汉语结构“总比……好”自然地表达两种情形之间的比较，并不表示结婚在所有方面都具有绝对优越性。
- source_word: γαμῆσαι
  choice: 结婚
  rationale: 不定式与后面的 πυροῦσθαι 平行；用简洁的“结婚”直接传达其含义。
- source_word: πυροῦσθαι
  choice: 欲火中烧
  rationale: 原词字面表示“被烧灼、燃烧起来”。在讨论婚姻与自制的语境中，最自然地指性欲炽烈。“欲火中烧”保留燃烧的比喻，同时使现代中文读者明白语境所指；脚注保留较为含蓄的字面可能。
- source_word: δὲ
  choice: 但
  rationale: δέ 在此承接上一节并形成轻微转折，“但”准确而自然。
theological_decisions:
- issue: πυροῦσθαι 在本节中的含义
  choice: 指欲望炽烈，并以“欲火中烧”表达
  alternative: 按字面译为“被烧灼”或“燃烧”，也有人将其理解为受审判之火焚烧
  rationale: 本章紧邻语境讨论独身、婚姻和自制，而本句又直接把不能自制与结婚相对照，因此性欲炽烈最符合上下文。译文没有舍弃“燃烧”的比喻，脚注也说明原文较含蓄的字面表达，避免把语境判断冒充为词语本身明说的内容。
translation_notes:
  register: 采用现代、简洁而庄重的普通话。“不能自制”通俗清楚；“就应当结婚”保留命令式的劝令力度；“欲火中烧”是现代读者易懂的固定表达，也保留原文的火焰意象。脚注标记紧接其所解释的短语。
