source:
  edition: SBLGNT
  text: Εἰ μὴ ἑκάστῳ ὡς ⸀ἐμέρισεν ὁ ⸀κύριος, ἕκαστον ὡς κέκληκεν ὁ ⸀θεός, οὕτως περιπατείτω· καὶ οὕτως ἐν ταῖς ἐκκλησίαις πάσαις διατάσσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/017.yaml
  text: Only[a], as the Lord has assigned to each one, as God has called each one, so let him walk[b]. And so I direct in all the churches.
translation:
  language: zh_hans
  text: 只是，主怎样分给各人[a]，神怎样呼召各人，各人就当这样行事为人[b]。我在所有教会都这样吩咐。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“分派给”“分定给”。原文动词可指主分配或指定给各人的份。
    reason: lexical_alternative
  - marker: b
    text: 原文直译“行走”；在圣经中常用来比喻一个人的生活方式，也可译作“生活”或“为人处世”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ μὴ
  choice: 只是
  rationale: 此处不是严格的“若不”，而是承接上文、引出总原则的限制性转折；“只是”简洁自然，也保留原文语篇上的转折力度。
- source_word: ἑκάστῳ / ἕκαστον
  choice: 各人
  rationale: 原文重复使用分配性的“每一个人”，译作“各人”既保留逐一适用的意味，又符合现代汉语表达。
- source_word: ἐμέρισεν
  choice: 分给
  rationale: 该动词表示主给各人分定或分派其所得的处境；“分给”保留分配意象，同时不把具体所分配的内容说死。
- source_word: ὁ κύριος
  choice: 主
  rationale: 按保罗书信中的通常用法译作“主”，并与后句的“神”保持区别。
- source_word: κέκληκεν
  choice: 呼召
  rationale: “呼召”准确表达神主动召唤人的含义；上下文已足以体现这一呼召持续有效，不必用额外汉语成分标示希腊语完成时。
- source_word: ὁ θεός
  choice: 神
  rationale: 采用现代中文圣经语体中通行而清楚的译法，并保留其与“主”的不同称谓。
- source_word: οὕτως
  choice: 照样 / 这样
  rationale: 前一处译作“照样”以指向前述所分得、蒙召的情形，后一处译作“这样”以自然表达保罗在各教会一致的指示。
- source_word: περιπατείτω
  choice: 要照样行事为人
  rationale: 该词字面为“行走”，在保罗书信中常比喻人的生活方式。“行事为人”是自然、庄重且容易理解的中文表达，脚注同时保留原文意象。
- source_word: διατάσσομαι
  choice: 我……吩咐
  rationale: “吩咐”体现保罗作使徒所给指示的权威性，又不额外强化为严厉命令。
- source_word: ἐν ταῖς ἐκκλησίαις πάσαις
  choice: 在所有教会
  rationale: 明确保留“所有”的普遍范围；“教会”是此处地方信徒群体最清楚、通行的译法。
theological_decisions:
- issue: “主”与“神”两个称谓的所指关系
  choice: 分别保留“主怎样分给……神怎样呼召……”
  alternative: 把两个称谓合并或视为纯粹同义变换
  rationale: 原文在平行结构中有意使用两个不同称谓，译文不将二者合并，也不进一步断定二者关系，从而保留原文的神学表达与张力。
- issue: περιπατείτω 的伦理生活隐喻
  choice: 正文译作“行事为人”，脚注说明字面为“行走”
  alternative: 正文直译为“行走”或完全平译为“生活”
  rationale: “行事为人”准确传达生活方式，且带有适度的行动意象；脚注保留原文常见的“行走”隐喻，兼顾可读性与形式信息。
- issue: 主所“分给”的具体内容
  choice: 不在正文中补出“身份”“处境”或“生活地位”
  alternative: 明确译为“主所分定的身份/处境”
  rationale: 上下文涉及人生处境，但本句宾语在原文中没有明说；不补出具体内容可避免把保罗的原则限缩为某一种解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“只是”承接上文并引出总原则；“行事为人”避免生硬直译，同时借脚注保留原文隐喻。句末“我在所有教会都是这样吩咐的”保持权威而不过度严厉的语气。
