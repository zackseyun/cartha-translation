base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/018.yaml
  text: Was anyone called while circumcised? He should not try to reverse it[a]. Was anyone called while uncircumcised? He should not be circumcised.
translation:
  language: zh_hans
  text: 有人受召时已经受了割礼吗？他就不要设法消除割礼的痕迹[a]。有人受召时还未受割礼吗？他就不要受割礼。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较直译：“他不要使自己成为未受割礼的。”意思是不要试图掩盖或消除割礼留下的痕迹。
    reason: lexical_alternative
lexical_decisions:
- source_word: περιτετμημένος
  choice: 已经受了割礼
  rationale: 完成时分词表示受割礼后持续存在的状态；“受召时已经受了割礼”既反映这一状态，也符合现代汉语表达。
- source_word: ἐκλήθη / κέκληταί
  choice: 受召
  rationale: 这里指蒙上帝呼召进入基督徒生活。保留“受召”，不直接释作“信主”或“归信”，以免消除原文的神学用语；两处希腊语时态虽不同，在本句中不必用生硬的汉语形式强行区分。
- source_word: ἐπισπάσθω
  choice: 不要设法消除割礼的痕迹
  rationale: 该动词字面指使自己恢复为未受割礼的样子，涉及掩盖或逆转割礼的外在痕迹。正文用自然且明确的表达传达实际所指，脚注保留较直译的说法。
- source_word: ἐν ἀκροβυστίᾳ
  choice: 还未受割礼
  rationale: 介词短语表示受召时处于未受割礼的状态。“还未受割礼”自然清楚，并与前一分句形成对照。
- source_word: περιτεμνέσθω
  choice: 不要受割礼
  rationale: μή加现在时命令语气表达禁止；“不要受割礼”简洁地保留劝止或命令的力度。
theological_decisions:
- issue: 两处“受召”的含义
  choice: 在当时既有的社会与宗教处境中蒙上帝呼召进入基督徒生活
  alternative: 泛指受到召唤，或直接译作“归信”
  rationale: 《哥林多前书》第7章以“呼召”描述信徒蒙召时所处的境况。译文保留“受召”，既呈现保罗的神学措辞，也不把其含义过度简化为单一的归信术语。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“有人……吗？他就不要……”保留原文两个设问与禁止句的平行结构；正文说明古代读者熟悉而现代读者可能不明白的动作，脚注同时保存较直译表达。
