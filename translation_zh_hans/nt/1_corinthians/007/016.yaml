  text: τί γὰρ οἶδας, γύναι, εἰ τὸν ἄνδρα σώσεις; ἢ τί οἶδας, ἄνερ, εἰ τὴν γυναῖκα σώσεις;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/016.yaml
  text: For how do you know[a], wife, whether you will save your husband? Or how do you know, husband, whether you will save your wife?
translation:
  language: zh_hans
  text: 因为妻子啊，你怎么知道自己是否会救你的丈夫呢？或者，丈夫啊，你怎么知道自己是否会救你的妻子呢？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可较自然地译为：“你怎么能知道……是否可能救……呢？”希腊原文在间接疑问中使用将来时动词，字面为“是否会救”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γὰρ οἶδας
  choice: 因为……你怎么知道
  rationale: τί与οἶδας在此构成反问，现代汉语自然表达为“你怎么知道”，而不是字面的“你知道什么”。“因为”保留γάρ承接上文、说明理由的作用。
- source_word: γύναι
  choice: 作妻子的
  rationale: γυνή虽可指“女人”或“妻子”，但婚姻语境明确要求“妻子”；用呼语式“作妻子的”自然地体现直接称呼。
- source_word: ἄνερ
  choice: 作丈夫的
  rationale: ἀνήρ虽可指“男人”或“丈夫”，但此处与前半句平行，并处于婚姻语境，因此译为“作丈夫的”。
- source_word: σώσεις
  choice: 会救
  rationale: 保留将来时形式的基本意味。由于它位于εἰ引导的间接疑问中，这不是确定预言，而是询问尚不确定的可能结果；“是否会救”兼顾形式和语义。
- source_word: τὸν ἄνδρα
  choice: 丈夫
  rationale: 定冠词所指的是被称呼之人的配偶。汉语在“作妻子的”之后无需重复“你的”，仍能清楚表达其丈夫。
- source_word: τὴν γυναῖκα
  choice: 妻子
  rationale: 与前半句相同，语境明确指受话者的配偶；现代汉语省略所属词更简洁自然。
- source_word: ἢ
  choice: 又
  rationale: 原文ἢ连接两个并列、对应的反问。汉语用“又”自然呈现转向另一方并重复提问的关系。
theological_decisions:
- issue: 婚姻语境中“救”的含义
  choice: 保留“救”
  alternative: 使之信主；使婚姻得以维持；在较宽泛的属灵意义上挽救
  rationale: σῴζω在保罗书信中常有救恩含义，而上下文涉及信的一方可能对不信的配偶产生的影响。直译为“救”可保留原文的救恩分量与神学张力，不把它缩减为维持婚姻，也不以解释性改写取代经文本身。
- issue: 反问的语用方向
  choice: 保留“你怎么知道……是否会救”的开放式反问
  alternative: 译成“你或许能救”以突出盼望，或译成“你不能知道”以突出不确定性
  rationale: 原文措辞本身可在上下文中被理解为对结果不确定的提醒，也可能容纳得救的可能性。译文不替读者单方面确定其劝勉方向。
translation_notes:
  register: 采用现代、庄重而口语可懂的称呼“作妻子的／作丈夫的”，保持两句平行。将脚注标记置于整节末，适用于两处相同的“是否会救”结构。
