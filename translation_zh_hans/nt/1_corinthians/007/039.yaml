  text: Γυνὴ ⸀δέδεται ἐφ’ ὅσον χρόνον ζῇ ὁ ἀνὴρ αὐτῆς· ἐὰν ⸀δὲ κοιμηθῇ ὁ ἀνήρ, ἐλευθέρα ἐστὶν ᾧ θέλει γαμηθῆναι, μόνον ἐν κυρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/039.yaml
  text: A wife is bound for as long as her husband lives[a]; but if her husband dies, she is free to be married to whom she wishes[b], only in the Lord.
translation:
  language: zh_hans
  text: 妻子在丈夫活着的时候受约束；丈夫若死了，她就可以随自己心意嫁给谁，只是要在主里[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在主里”通常被理解为只嫁给属主的人，也就是同为信徒的人；也可理解为再婚应当合乎对主的归属与忠诚。
    reason: alternative_reading
lexical_decisions:
- source_word: Γυνὴ
  choice: 妻子
  rationale: 在明确提到“她的丈夫”的婚姻语境中，γυνή 指“妻子”，不是泛指“女人”。
- source_word: δέδεται
  choice: 受婚约约束
  rationale: 完成时被动态表达持续处于被约束的状态；补出“婚约”可使现代汉语自然清楚，同时保留法律与关系层面的约束力。
- source_word: ἐφ’ ὅσον χρόνον ζῇ ὁ ἀνὴρ αὐτῆς
  choice: 在丈夫活着的时候
  rationale: 准确表达持续时间，也符合现代汉语习惯。
- source_word: κοιμηθῇ
  choice: 死了
  rationale: 该词字面为“睡了”，在这里是常见的死亡委婉语；中文若直译“睡了”容易误解，因此正文译出实际含义。
- source_word: ἐλευθέρα ἐστὶν
  choice: 就可以自由地
  rationale: 表达她已不再受先前婚姻关系约束，并自然衔接后面的不定式。
- source_word: ᾧ θέλει γαμηθῆναι
  choice: 嫁给自己愿意嫁的人
  rationale: 保留选择再婚对象的自由；用“嫁给”自然传达被动不定式在此处的婚嫁含义。
- source_word: μόνον ἐν κυρίῳ
  choice: 只是要在主里
  rationale: 保留保罗简洁而具有神学分量的原表达，不在正文中把它限定为某一种解释。
theological_decisions:
- issue: “在主里”对再婚对象或方式的限制
  choice: 正文保留“只是要在主里”
  alternative: 只可嫁给属主的信徒；或只可按着对主的忠诚再婚
  rationale: ἐν κυρίῳ 的含义高度凝练，通常被理解为只与信徒结婚，但也可着重指再婚必须处于对主的归属与顺服之中。直译可保存其神学张力，脚注说明常见理解。
- issue: 死亡委婉语 κοιμηθῇ
  choice: 正文译作“死了”
  alternative: 睡了；安睡了
  rationale: 原文以“睡”委婉指死亡，但现代中文直译容易被理解为普通睡眠。“死了”准确传达语境意义，而不借委婉表达加入额外的末世论解释。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“受婚约约束”比单说“被束缚”更明确，也避免负面色彩；“丈夫若死了”直接传达希腊文死亡委婉语的实际意思；“在主里”保留保罗原语的凝练与解释空间。
