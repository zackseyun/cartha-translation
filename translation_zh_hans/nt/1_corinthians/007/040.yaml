  text: μακαριωτέρα δέ ἐστιν ἐὰν οὕτως μείνῃ, κατὰ τὴν ἐμὴν γνώμην, δοκῶ ⸀δὲ κἀγὼ πνεῦμα θεοῦ ἔχειν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/040.yaml
  text: But she is happier if she remains as she is[a], according to my judgment—and I think that I also have the Spirit of God.
translation:
  language: zh_hans
  text: 不过，照我的判断，她若保持现状，会更幸福[a]；我想，我也有神的灵。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“更有福”。希腊语 μακαριωτέρα 既可表示更加幸福，也可表示更为有福。
    reason: 保留该比较级在幸福状态与蒙福状态之间的词义幅度。
lexical_decisions:
- source_word: μακαριωτέρα
  choice: 更幸福
  rationale: 这是 μακάριος 的比较级；本节是在作实际的牧养劝告。“更幸福”以自然的现代汉语表达比较意义，同时脚注保留“更有福”这一可能译法。
- source_word: ἐὰν οὕτως μείνῃ
  choice: 她若保持现状
  rationale: μένω 表示“保持、仍然处于”，οὕτως 回指上下文中她目前未再婚的状态。“保持现状”自然地保留回指，不在正文中添加原文未明说的细节。
- source_word: κατὰ τὴν ἐμὴν γνώμην
  choice: 照我的判断
  rationale: γνώμη 在此指经过考虑的判断或意见。“照我的判断”既保留这是保罗所作判断的限定，也比“依我个人看法”更庄重。
- source_word: δοκῶ
  choice: 我想
  rationale: δοκέω 在这里带有修辞上的谦抑，但并非表示保罗真的不确定。“我想”保留这种措辞的克制。
- source_word: κἀγὼ
  choice: 我也
  rationale: κἀγώ 是 καὶ ἐγώ 的缩合，具有附加意味；“我也”简洁地保留这一强调。
- source_word: πνεῦμα θεοῦ
  choice: 神的灵
  rationale: 在保罗的用语中，此处指神的圣灵，而非一般的属灵气质。“神的灵”直接、自然，并保留原文表达。
- source_word: ἔχειν
  choice: 有
  rationale: 这是 δοκῶ 的不定式补语；“有”准确简明，“拥有”则显得不必要地强调占有。
theological_decisions:
- issue: πνεῦμα θεοῦ 是指圣灵，还是泛指属灵气质
  choice: 译作“神的灵”，指向圣灵
  alternative: 译作“从神而来的灵”或“属神的属灵洞见”
  rationale: 保罗书信中的 πνεῦμα θεοῦ 通常指神的圣灵；这里保罗是在表明其劝告具有圣灵引导的正当性。译文不把它弱化为一种气质，也不扩写成“这是主直接下的命令”。
- issue: δοκῶ…πνεῦμα θεοῦ ἔχειν 中保罗自我陈述的语气
  choice: 保留为措辞谦抑、实质肯定的圣灵引导宣称
  alternative: 理解为保罗不确定自己是否有圣灵，或明确译成对反对者的讽刺
  rationale: “我想”保留 δοκῶ 的修辞克制；上下文并不支持将其理解为真实的自我怀疑。原文是否带有讽刺意味不能确定，因此不在译文中明示。
translation_notes:
  register: 采用自然、庄重的现代标准普通话。“不过”承接前文并体现首个 δέ 的转折；分号呈现后半句既相关又相对独立的判断。“保持现状”依赖上下文理解，避免把“守寡不嫁”等解释性内容直接加入正文。
