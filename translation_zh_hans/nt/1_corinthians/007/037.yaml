source:
  edition: SBLGNT
  text: ὃς δὲ ἕστηκεν ⸂ἐν τῇ καρδίᾳ αὐτοῦ ἑδραῖος⸃ μὴ ἔχων ἀνάγκην, ἐξουσίαν δὲ ἔχει περὶ τοῦ ἰδίου θελήματος, καὶ τοῦτο κέκρικεν ἐν τῇ ⸂ἰδίᾳ καρδίᾳ⸃, ⸀τηρεῖν τὴν ἑαυτοῦ παρθένον, καλῶς ⸀ποιήσει·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/037.yaml
  text: But whoever stands firm in his heart[a], having no necessity, but has authority over his own will[b], and has decided this in his own heart—to keep his own virgin—he will do well.
translation:
  language: zh_hans
  text: 但谁若心里立定不移，并非迫不得已[a]，而是能按自己的意愿作主，又已在自己心里作了这样的决定——保守自己的童女[b]——他就会做得好。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “并非迫不得已”或译“没有非这样不可的必要”。
    reason: lexical_alternative
  - marker: b
    text: “自己的童女”可能指他的童贞女儿，也可能指他的未婚妻（或订婚对象）；原文所指有争议。
    reason: alternative_reading
lexical_decisions:
- source_word: ἕστηκεν ... ἑδραῖος
  choice: 心里立定不移
  rationale: 完成时的ἕστηκεν与ἑδραῖος合用，表达已经确立并且稳固的内在决定；“立定不移”既保留坚定、稳定之意，也符合现代汉语表达。
- source_word: μὴ ἔχων ἀνάγκην
  choice: 并非迫不得已
  rationale: ἀνάγκη可指必要、压力或强迫；此译体现没有外在或情势上的强制，同时以脚注保留“没有必要”的较直译说法。
- source_word: ἐξουσίαν δὲ ἔχει περὶ τοῦ ἰδίου θελήματος
  choice: 而且有权支配自己的意愿
  rationale: ἐξουσία表示权柄、权利或自主权，θέλημα表示意愿、心愿或决定；此译清楚表达当事人能够自主决定，而不把短语局限为性欲控制。
- source_word: κέκρικεν
  choice: 作了这样的决定
  rationale: 完成时表示决定已经作出并仍然有效；“作了决定”自然地传达这种已然且坚定的决断。
- source_word: τηρεῖν τὴν ἑαυτοῦ παρθένον
  choice: 保守自己的童女
  rationale: τηρεῖν有保守、保持之意，παρθένον直指童女。译文保留原文不明确的所属关系，不擅自指定为女儿或未婚妻；具体可能所指列于脚注。
- source_word: καλῶς ποιήσει
  choice: 他会做得好
  rationale: 这是表示行为可取、值得肯定的常用表达；此译也保留原文的将来时形式。
theological_decisions:
- issue: “自己的童女”（τὴν ἑαυτοῦ παρθένον）所指何人
  choice: 正文保留“自己的童女”这一较为直译且含义开放的表达。
  alternative: 可理解为他的童贞女儿，也可理解为他的未婚妻或已订婚的童女。
  rationale: 原文没有明确说明此人是父亲、监护人还是订婚的男子，学界对此有争议。正文不替读者消除这一真实的释义张力，而由脚注说明两种主要理解。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“心里立定不移”保留保罗关于内在坚定决心的表达；正文两次出现“心里”的概念，以呼应原文重复的καρδία。“保守自己的童女”刻意保留原文的指称歧义，并以脚注帮助普通读者理解。
