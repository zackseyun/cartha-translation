revisions:
- from: 但那心里立定不移，并非迫不得已[a]，而且有权支配自己的意愿，又在自己心里作了这样的决定——保守自己的童女[b]——他会做得好。
  to: 但谁若心里立定不移，并非迫不得已[a]，而是能按自己的意愿作主，又已在自己心里作了这样的决定——保守自己的童女[b]——他就会做得好。
  rationale: 修订仅改善主语结构和“对自己的意愿有权”的汉语表达，并润色脚注b；保留原文的完成时所暗示的既定决定、将来时的结果，以及“自己的童女”所刻意保留的释义歧义。
