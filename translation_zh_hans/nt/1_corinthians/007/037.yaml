review_pass:
  verdict: revise
  source_fidelity: 译文总体忠实呈现了坚定的内心决定、没有外在必要或压力、自主决定，以及已作出的决定。“保守自己的童女”保留了τὴν ἑαυτοῦ παρθένον在所指对象上的争议，未擅自确定为女儿或未婚妻。将“有权支配自己的意愿”调整为“能按自己的意愿作主”，更准确表达ἐξουσίαν ... περὶ τοῦ ἰδίου θελήματος所指的自主权，而非仿佛人支配一个与自己分离的“意愿”。
  naturalness: 原句开头“但那心里立定不移”在现代汉语中缺少自然的主语中心，读起来不够顺畅；改为“但谁若心里立定不移”既自然，也对应ὃς δέ的泛指结构。“能按自己的意愿作主”是庄重而现代的表达。
  terminology: “心里”“立定不移”“保守”“童女”等用语保持经文的庄重语体。保留“童女”虽略具书面及传统色彩，但有助于维持原文παρθένος的字面性及其未决指称；脚注应以更自然明确的汉语说明争议。
  issues:
  - severity: medium
    issue: “但那心里立定不移”句法和指称不自然。
    rationale: ὃς δέ是“但谁／凡……的人”的泛指结构；“那”后直接接“心里立定不移”在现代标准汉语中缺少合适的名词性中心语。
  - severity: medium
    issue: “有权支配自己的意愿”对ἐξουσίαν ... περὶ τοῦ ἰδίου θελήματος的搭配略显生硬。
    rationale: 原文强调当事人就自己的意愿具有自主权或作主权，不是把“意愿”当作一个被其支配的对象。“能按自己的意愿作主”更符合汉语，也保留了不受强迫的含义。
  - severity: low
    issue: 脚注b中“未婚妻或已订婚的童女”表述重复且稍不自然。
    rationale: “未婚妻”通常已经涵盖订婚关系；可用“未婚妻（或订婚对象）”简洁说明该解释，同时不在正文解决争议。
