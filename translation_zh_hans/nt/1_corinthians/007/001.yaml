  yaml_path: translation/nt/1_corinthians/007/001.yaml
  text: 'Concerning the matters you wrote about: it is good for a man not to touch a woman.[a]'
translation:
  language: zh_hans
  text: 至于你们信上所提的事：男人不亲近女人是好的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亲近”原文直译为“触碰”，这里很可能委婉指性关系。这句话也可能是哥林多人来信中的主张，保罗在下文加以回应。
    reason: 说明源文的委婉用法，并保留本句说话归属上的真实歧义。
lexical_decisions:
- source_word: Περὶ δὲ ὧν ἐγράψατε
  choice: 至于你们信上所提的事
  rationale: “至于”自然表达 περὶ δέ 转换话题的作用；“你们信上所提的事”明确 ἐγράψατε 指对方写信提出的事项，又不补入原文没有说明的具体问题。
- source_word: καλὸν
  choice: 是好的
  rationale: 保留“好、合宜”的宽泛评价，不擅自强化为“最好”或“更好”。
- source_word: ἀνθρώπῳ
  choice: 男人
  rationale: 此处与 γυναικός 对举，语境所指是男性，而非泛指“人”。
- source_word: γυναικὸς μὴ ἅπτεσθαι
  choice: 不亲近女人
  rationale: ἅπτεσθαι 字面为“触碰”，在此很可能是性关系的委婉说法；“亲近”在现代汉语中较庄重，也保留一定委婉性。
theological_decisions:
- issue: 本句是否是哥林多人来信中的口号或主张
  choice: 正文不加引号
  alternative: 加引号写成“男人不亲近女人是好的。”
  rationale: 希腊文本本身没有引号，句子究竟是保罗直接陈述，还是引用并回应哥林多人来信中的主张，存在解释上的不确定性；正文不加引号可避免提前裁定。
- issue: “不亲近女人”的范围
  choice: 保留委婉表达，并在脚注说明可能指性关系
  alternative: 正文直接译为“不与女人发生性关系”
  rationale: 直接释义虽清楚，却会消除 ἅπτεσθαι 的字面意象及其语用含混；正文保留委婉语更贴近源文。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“至于”承担话题转换功能；“信上所提的事”比机械的“你们所写的事”更符合汉语表达。正文避免加引号或将“亲近”完全释义化，以保存原文的歧义和神学张力。
