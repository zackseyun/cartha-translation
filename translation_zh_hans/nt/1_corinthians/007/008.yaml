  yaml_path: translation/nt/1_corinthians/007/008.yaml
  text: 'I say to the unmarried and to the widows: it is good for them if they remain as I am[a][b].'
translation:
  language: zh_hans
  text: 我对未婚者[a]和寡妇说：他们若像我一样保持单身[b]，对他们是好的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“未婚男子”；希腊原文在这里使用阳性复数形式，但也可能以阳性形式泛指未婚者。
    reason: lexical_alternative
  - marker: b
    text: 原文较直译为“正如我也（是这样）”。“保持单身”根据上下文补出所指的状态。
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγω δὲ
  choice: 我……说
  rationale: δέ在这里是轻微的承接或转折词；中文不必另加“现在”，以免引入原文没有的时间含义。句式本身可自然承接上文。
- source_word: τοῖς ἀγάμοις
  choice: 对未婚的人
  rationale: ἄγαμος意为“未婚的”。原文形式为阳性复数，但在本语境中可能泛指未婚者；译作“未婚的人”既自然，也保留由脚注说明“未婚男子”这一可能性的空间。
- source_word: ταῖς χήραις
  choice: 和寡妇
  rationale: χήρα明确指丈夫已经去世的妇女，故译作“寡妇”，不泛化为一般未婚女性。
- source_word: καλὸν
  choice: 是好的
  rationale: καλός在此表示好、合宜或可取，并非比较级；不用“更好”，以免加强原文的评价。
- source_word: αὐτοῖς
  choice: 他们
  rationale: 此与καλόν连用的与格表示“对他们而言”；中文以话题中的“他们……是好的”自然表达。
- source_word: ἐὰν μείνωσιν
  choice: 他们若……继续保持
  rationale: μένω表示停留、继续处于某种状态；结合上下文，指继续保持未婚状态。
- source_word: ὡς κἀγώ
  choice: 像我一样
  rationale: κἀγώ由καὶ与ἐγώ缩合而成，字面带有“我也”的附加意味；中文正文以“像我一样”自然表达比较关系，字面形式另见脚注。
theological_decisions:
- issue: “未婚的人”（ἀγάμοις）的范围
  choice: 正文译作“未婚的人”，并以脚注注明也可理解为“未婚男子”。
  alternative: 正文直接译作“未婚男子”。
  rationale: 原词是阳性复数，可能专指男子，也可能按希腊语惯例概括一个较广群体。正文不武断限定其范围，同时脚注保留语法上的另一可能。
- issue: καλὸν所表达的评价力度
  choice: 译作“是好的”。
  alternative: 译作“是更好的”或“是合宜的”。
  rationale: 原文没有比较级；“更好”会加入原文未明说的比较。“是好的”保留其可指良好、合宜或可取的语义幅度。
- issue: “继续保持”的具体状态
  choice: 在正文中补明为“继续保持未婚”。
  alternative: 较逐字地译作“继续像我一样”。
  rationale: 原文依上下文明示所谈的是婚姻状态；中文若只说“继续像我一样”语义不完整。补出“未婚”使隐含信息自然显明，并不判定保罗此前的婚姻经历。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“继续保持未婚”使中文语意完整；“是好的”保留劝勉语气，不强化为绝对命令或比较判断。
