  text: καὶ οἱ χρώμενοι ⸂τὸν κόσμον⸃ ὡς μὴ καταχρώμενοι· παράγει γὰρ τὸ σχῆμα τοῦ κόσμου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/031.yaml
  text: and those who use the world as not making full use of it[b][a]; for the present form of this world is passing away.
translation:
  language: zh_hans
  text: 使用这世界的人，要像没有充分使用它一样[a]；因为这世界现有的形态[b]正在消逝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “没有充分使用它”也可译作“没有尽用它”；这个动词也可能含有“不滥用”的意思。
    reason: lexical_alternative
  - marker: b
    text: “形态”也可译作“外在形态”或“样式”。
    reason: lexical_alternative
lexical_decisions:
- source_word: χρώμενοι
  choice: 使用
  rationale: χράομαι在这里指使用、利用或接触世上的事物；“使用”简洁自然，并与后面的复合动词构成呼应。
- source_word: τὸν κόσμον
  choice: 这世界
  rationale: κόσμος在本段语境中指现今世界及其社会、物质秩序；结合后句τοῦ κόσμου τούτου，译作“这世界”可保持指称一致。
- source_word: ὡς μὴ καταχρώμενοι
  choice: 要像没有尽用这世界一样
  rationale: καταχράομαι在此与χράομαι形成词语呼应，可表示充分使用、用尽，也可能含滥用之意。“没有尽用”保留加强语气和一定歧义，不把经文单纯解释为禁止道德意义上的滥用。
- source_word: παράγει
  choice: 正在消逝
  rationale: 现在时表达正在持续发生的过程；“正在消逝”兼顾动态性及短暂无常之意。
- source_word: τὸ σχῆμα
  choice: 现有的形态
  rationale: σχῆμα可指外在形态、样式或当前格局。“现有的形态”自然地表达此世界当前而非永恒的样态，又不将其误作世界的本质。
theological_decisions:
- issue: καταχρώμενοι与χρώμενοι之间的关系
  choice: 保留“使用／尽用”的词语呼应，表达使用世界却不把它用到尽或全然投入其中
  alternative: 译作“不要滥用这世界”或“像不使用这世界一样”
  rationale: 复合动词可能表示充分使用，也可能带有滥用色彩；上下文强调现今处境短暂，因此正文采用“尽用”，脚注同时保留“充分使用”和“滥用”的可能。
- issue: σχῆμα的含义
  choice: 指这世界现有、正在过去的形态或格局
  alternative: 仅指世界的外表，或指世界的本质
  rationale: 该词侧重可见形态或当前样式，并不等同于受造世界的本质；如此翻译保留保罗关于世界现状短暂性的论述。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“尽用”略带凝练的书面色彩，用以保留χρώμενοι／καταχρώμενοι的词根呼应；脚注说明其词义范围。脚注标记均放在相关短语之后。
