  text: μὴ ἀποστερεῖτε ἀλλήλους, εἰ μήτι ἂν ἐκ συμφώνου πρὸς καιρὸν ἵνα ⸀σχολάσητε ⸀τῇ προσευχῇ καὶ πάλιν ἐπὶ τὸ αὐτὸ ⸀ἦτε, ἵνα μὴ πειράζῃ ὑμᾶς ὁ Σατανᾶς διὰ τὴν ἀκρασίαν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/005.yaml
  text: Do not deprive one another[a], except perhaps by mutual agreement for a time, so that you may devote yourselves to prayer, and then come together again[b], so that Satan may not tempt you because of your lack of self-control.
translation:
  language: zh_hans
  text: 夫妻不可彼此亏负[a]，除非双方同意，暂时分开，好专心祷告；然后要再同房[b]，免得撒但因你们缺乏自制而诱惑你们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亏负”在这里指扣留配偶应得的夫妻亲密关系。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“再在一起”；这里指夫妻恢复亲密生活。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστερεῖτε
  choice: 亏负
  rationale: 此动词在婚姻语境中指扣留配偶应得的夫妻亲密关系。“亏负”保留伦理上的亏欠意味，又不带现代商业欺诈的色彩。
- source_word: ἀλλήλους
  choice: 彼此
  rationale: 准确表达互惠关系，表明这项劝诫同样适用于夫妻双方。
- source_word: εἰ μήτι ἂν ἐκ συμφώνου
  choice: 除非双方同意
  rationale: 表达有条件的例外及共同认可；“双方同意”清楚呈现夫妻双方一致同意的含义。
- source_word: πρὸς καιρόν
  choice: 暂时
  rationale: 简洁自然地表达限于一段时间，而非无限期。
- source_word: σχολάσητε τῇ προσευχῇ
  choice: 专心祷告
  rationale: 在现代汉语中自然表达腾出时间、专注于祷告的意思。
- source_word: πάλιν ἐπὶ τὸ αὐτὸ ἦτε
  choice: 以后仍要同房
  rationale: 此语在上下文中指夫妻恢复亲密结合；“同房”明确而含蓄，符合原文在婚姻语境中的所指。
- source_word: πειράζῃ
  choice: 诱惑
  rationale: 主语是撒但，且语境涉及犯罪的引诱，因此不是中性的“试验”。
- source_word: Σατανᾶς
  choice: 撒但
  rationale: 采用现代中文圣经中通行的专名音译。
- source_word: ἀκρασίαν
  choice: 缺乏自制
  rationale: 准确表达不能节制或自我约束不足，在当代汉语中清楚易懂。
theological_decisions:
- issue: πάλιν ἐπὶ τὸ αὐτὸ ἦτε 是泛指重新在一起，还是特指恢复夫妻性关系
  choice: 译为“以后仍要同房”，并用脚注说明字面表达
  alternative: “以后仍要在一起”
  rationale: 上下文从不可彼此亏负、暂时禁欲谈到撒但的诱惑，明显指恢复夫妻亲密关系。“同房”没有超出语境，同时仍保持庄重含蓄。
- issue: ὁ Σατανᾶς 是专指有位格的撒但，还是泛称敌对者
  choice: 译作专名“撒但”
  alternative: “那敌对者”
  rationale: 保罗在此使用的是指称撒但的专名；音译既忠于文本，也不把有位格的指称抽象化。
- issue: ἀκρασίαν 是否暗示夫妻必然不能自制
  choice: 保留为“你们缺乏自制”，陈述本节给出的现实风险
  alternative: 弱化为“你们可能难以自制”
  rationale: 原文使用名词并由属格“你们的”限定，措辞直接；译文不应擅自减弱，但也不将此陈述扩展为关于所有夫妻的普遍教义。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“夫妻”作为主语补足上下文中的婚姻对象，使中文独立成句时指向清楚；“同房”保持含蓄而不模糊。脚注标记[a]、[b]均已在正文中出现。
