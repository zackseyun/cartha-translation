  text: θέλω ⸀δὲ πάντας ἀνθρώπους εἶναι ὡς καὶ ἐμαυτόν· ἀλλὰ ἕκαστος ἴδιον ⸂ἔχει χάρισμα⸃ ἐκ θεοῦ, ⸀ὁ μὲν οὕτως, ⸁ὁ δὲ οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/007.yaml
  text: But I want all men to be as I myself am. Yet each has his own gift from God, one in this way and another in that way.
translation:
  language: zh_hans
  text: 我愿意所有人都像我一样；但各人都有自己从上帝而来的恩赐：有人是这样，有人是那样。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θέλω
  choice: 我愿意
  rationale: 表达保罗的愿望，而非命令；现代汉语中自然、庄重。
- source_word: πάντας ἀνθρώπους
  choice: 所有人
  rationale: ἄνθρωπος在此泛指众人，并非专指男性；上下文谈婚姻与独身，译为“所有人”可保留其普遍范围。
- source_word: ὡς καὶ ἐμαυτόν
  choice: 像我一样
  rationale: 保留原文未明说的比较内容，让上下文说明保罗所指的生活状态。
- source_word: ἴδιον ἔχει χάρισμα ἐκ θεοῦ
  choice: 各人都从上帝领受了自己的恩赐
  rationale: 原文直义为“各人有自己从上帝而来的恩赐”；用“领受”自然表达来源，同时不把恩赐限缩为某一种能力或身份。
- source_word: ὁ μὲν οὕτως, ὁ δὲ οὕτως
  choice: 有人是这样，有人是那样
  rationale: 保留原文概括而含蓄的对照，不擅自明确为婚姻或独身的特定分类。
theological_decisions:
- issue: “像我一样”具体指什么
  choice: 正文保留含蓄表达“像我一样”
  alternative: 明确译作“像我一样独身”或“不结婚”
  rationale: 本节原文没有在该短语内明说独身；虽可由上下文推知，但不应在正文中消除原有含蓄性。
- issue: “恩赐”的所指
  choice: 保留为笼统的“自己的恩赐”
  alternative: 解释为独身的恩赐与婚姻的恩赐
  rationale: 原文只说各人所得不同，未直接界定两种恩赐的名称；保留神学张力，避免过度解释。
translation_notes:
  register: 采用现代、清楚而庄重的普通话。“不过……然而……”再现δὲ与ἀλλά的转折层次；末句保持简洁对称。
