    rationale: 虽可理解为对应δὲ与ἀλλά，但汉语以一个“但”连接更自然，也足以表达保罗愿望与个别恩赐差异之间的对照。
  revised_text: 我愿意所有人都像我一样；但各人都有自己从上帝而来的恩赐：有人是这样，有人是那样。
