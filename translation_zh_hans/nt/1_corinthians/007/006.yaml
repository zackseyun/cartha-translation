  yaml_path: translation/nt/1_corinthians/007/006.yaml
  text: But I say this as a concession[a], not as a command.
translation:
  language: zh_hans
  text: 不过，我这样说，是作为一种准许，不是作为命令。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο
  choice: 这样
  rationale: 指向上下文中紧接相关的话；译作“这样”自然，也不强行判定它专指前文还是后文。
- source_word: δὲ
  choice: 不过
  rationale: 表示轻微的转折或话题推进；“不过”自然地带出“通融”与“命令”之间的对照。
- source_word: λέγω
  choice: 我说
  rationale: 以现代汉语的一般现在表达希腊语现在时直陈语气。
- source_word: κατὰ συγγνώμην
  choice: 是出于通融
  rationale: 表示所说的是一种许可或让步，而非强制要求；“出于通融”在现代汉语中简洁自然，并能与下句“并不是命令”形成清楚对照。
- source_word: συγγνώμην
  choice: 通融
  rationale: 此处不是通常意义的“饶恕”，而是准许、容让或让步；“通融”较能兼顾其许可性和非强制性。
- source_word: οὐ
  choice: 并不是
  rationale: 准确表达否定，并加强汉语中前后两项的对照。
- source_word: κατ’ ἐπιταγήν
  choice: 是命令
  rationale: 指具有权威约束力的吩咐；“命令”清楚、直接，并与“通融”相对。
- source_word: ἐπιταγήν
  choice: 命令
  rationale: 准确表达权威性的指令，不额外加入其来源或范围。
theological_decisions:
- issue: 保罗所说的是个人许可，还是仍具较低层次权威的使徒教导
  choice: 保留经文本身“通融”与“命令”的明确区别，表明这话不是强制性的命令。
  alternative: 将其理解为虽非直接命令、却仍带有间接使徒权威的劝告。
  rationale: 原文明确对照 κατὰ συγγνώμην 与 κατ’ ἐπιταγήν。译文不应削弱这个对照，也不应进一步断定这种通融完全不具使徒权威。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我这样说”保留 τοῦτο 所指方向的含混；“出于通融”避免把 συγγνώμη 误解为“饶恕”，同时保持与“命令”的鲜明对照。
