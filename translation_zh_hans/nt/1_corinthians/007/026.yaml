  rationale: 修订将希腊文中“我认为……是好的”的内容直接译为“我认为人保持现状是好的”，消除“这样”所指不明及重复生硬的问题。译文仍保留个人判断（νομίζω）、推论关系（因此）、现时压力的背景（διὰ τὴν ἐνεστῶσαν ἀνάγκην）、泛指的“人”（ἀνθρώπῳ），以及“就这样存在”的处境延续含义（τὸ οὕτως εἶναι）。
