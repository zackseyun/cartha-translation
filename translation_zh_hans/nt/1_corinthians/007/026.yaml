  text: νομίζω οὖν τοῦτο καλὸν ὑπάρχειν διὰ τὴν ἐνεστῶσαν ἀνάγκην, ὅτι καλὸν ἀνθρώπῳ τὸ οὕτως εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/026.yaml
  text: 'Therefore I think this is good because of the present distress: that it is good for a man to remain as he is[a][b][c].'
translation:
  language: zh_hans
  text: 因此，鉴于当前的困境[a]，我认为人保持现状是好的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “困境”也可译作“迫切需要”或“危急处境”。
    reason: lexical_alternative
  - marker: b
    text: 直译：“就这样存在”或“处于这种状态”。
    reason: lexical_alternative
lexical_decisions:
- source_word: νομίζω
  choice: 我认为
  rationale: 表达保罗经过考虑所得的个人判断；“认为”自然庄重，也不把这句话强化为绝对命令。
- source_word: οὖν
  choice: 所以
  rationale: 清楚承接上文并标明推论关系，符合现代汉语表达。
- source_word: τοῦτο καλὸν ὑπάρχειν
  choice: 这样是好的
  rationale: 以汉语完整分句表达不定式结构，并保留τοῦτο的指示性以及καλόν“好、合宜”的评价含义。
- source_word: διὰ τὴν ἐνεστῶσαν ἀνάγκην
  choice: 鉴于当前的困境
  rationale: ἀνάγκη可指迫切需要、压力或苦难处境；结合本段语境译作“困境”，同时以脚注保留其他可能。“当前的”准确表达ἐνεστῶσαν所指的现时性。
- source_word: ὅτι
  choice: ——
  rationale: 这里引出对前面“这样”的具体说明。破折号能自然表达解释关系，同时不把ὅτι过度限定为因果连词。
- source_word: καλὸν
  choice: 是好的
  rationale: 与前半句相同，保留καλόν的重复，避免擅自改为“有益”或“必要”。
- source_word: ἀνθρώπῳ
  choice: 人
  rationale: ἄνθρωπος在此可作泛指；现代汉语“人”既贴近词形，也无需额外指定男性。
- source_word: τὸ οὕτως εἶναι
  choice: 保持现状
  rationale: 直译为“就这样存在”；结合上下文，指继续处于当下的婚姻或未婚状态。“保持现状”是自然汉语，并以脚注保留字面形式。
theological_decisions:
- issue: 保罗这项判断的性质
  choice: 译文保留“我认为”以及“鉴于当前的困境”，呈现其针对处境的判断。
  alternative: 将本句表达为普遍、永恒地反对结婚的命令。
  rationale: 第一人称的νομίζω和理由短语διὰ τὴν ἐνεστῶσαν ἀνάγκην共同表明，这里是处境性的劝告；译文不把它扩大为经文本身没有明说的普遍禁令。
- issue: ὅτι的句法功能
  choice: 视为解释前面的“这样”，用破折号引出具体内容。
  alternative: 将ὅτι理解为“因为”，使后半句成为另一层理由。
  rationale: 两种分析在语法上均有人采用；正文选择较自然的解释性读法，但不添加会消除原文张力的神学说明。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“这样是好的——人保持现状是好的”有意保留原文两次使用“好”所形成的重复；破折号使解释关系在汉语中清楚而不显生硬。
