  text: ἐὰν δὲ καὶ ⸀γαμήσῃς, οὐχ ἥμαρτες. καὶ ἐὰν γήμῃ ἡ παρθένος, οὐχ ἥμαρτεν. θλῖψιν δὲ τῇ σαρκὶ ἕξουσιν οἱ τοιοῦτοι, ἐγὼ δὲ ὑμῶν φείδομαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/028.yaml
  text: But even if you marry[a], you have not sinned; and if the virgin marries, she has not sinned. Yet such people will have tribulation in the flesh[b], and I am sparing you.
translation:
  language: zh_hans
  text: 即使你结婚，也没有犯罪；处女若结婚，也没有犯罪。不过，这样的人在肉身方面会有患难[a]；我却顾惜你们[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在肉身方面会有患难”也可译作“在现实生活中会有困苦”。这指结婚所伴随的今世或身体方面的艰难，并非特指“罪性”。
    reason: lexical_alternative
  - marker: b
    text: “我却顾惜你们”也可译作“我却宽免你们”或“我是为了顾惜你们”。这句话说明保罗提出警告时为读者益处着想的牧养用意。
    reason: lexical_alternative
lexical_decisions:
- source_word: γαμήσῃς
  choice: 你结婚
  rationale: ἐάν加不定过去时虚拟语气构成面向将来的条件句；“如果／即使你结婚”自然表达条件意义，不把它误作命令。
- source_word: ἥμαρτες / ἥμαρτεν
  choice: 没有犯罪
  rationale: 不定过去时直陈语气在这里否定结婚这一行为构成罪；汉语“没有犯罪”自然保留这种道德判断。
- source_word: ἡ παρθένος
  choice: 童女
  rationale: παρθένος本义为处女；“童女”庄重并保留原文对性状态的明确指称，不泛化为“未婚女子”。
- source_word: θλῖψιν
  choice: 患难
  rationale: θλῖψις可指压力、苦难或困苦；“患难”既保留较强的词义力度，又不限定为末世性的灾难。
- source_word: τῇ σαρκὶ
  choice: 在肉身上
  rationale: 此处与θλῖψιν连用，按关系或范围理解，指人在现实、有形生命中承受的艰难；直译“肉身”可避免把σάρξ直接解释成“罪性”。
- source_word: οἱ τοιοῦτοι
  choice: 这样的人
  rationale: 泛指前面所说结婚的人；“这样的人”保留概括性，不增添原文没有明说的限定。
- source_word: φείδομαι
  choice: 顾惜
  rationale: φείδομαι带有为对方着想而使其免受艰难或有所克制的意思；“顾惜”简洁地表达保罗的牧养关切，同时不像“正在设法使你们免受”那样过度展开语义。
theological_decisions:
- issue: τῇ σαρκί中σάρξ的含义
  choice: 保留非伦理化的“肉身”，指今世有形生活的层面
  alternative: 罪性；或宽泛的属世存在
  rationale: 上下文是在说明结婚者会面对的患难，并非论述人的败坏本性。保留“肉身”及脚注说明，既贴近原文，也不把一种神学解释写进正文。
- issue: φείδομαι所表达的牧养意图
  choice: 我却顾惜你们
  alternative: 我却要使你们免受这些患难；我想要顾惜你们
  rationale: 原文现在时可陈述保罗正在采取的顾惜态度，也可在语境中表达其意图。“顾惜”保留一定开放性，脚注列出更显明的释义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“童女”保留παρθένος的明确含义；“肉身”保留保罗用词的张力，并借脚注防止被误解为“罪性”。分号使末句的转折及牧养动机更清楚。
