  text: ὥστε καὶ ὁ ⸀γαμίζων ⸂τὴν παρθένον ἑαυτοῦ⸃ καλῶς ποιεῖ, ⸂καὶ ὁ⸃ μὴ ⸁γαμίζων κρεῖσσον ⸀ποιήσει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/038.yaml
  text: So then[a], the one who gives his own virgin in marriage does well, and the one who does not give her in marriage will do better.
translation:
  language: zh_hans
  text: 所以，把自己那位童女嫁出去的人做得好；不把她嫁出去的人做得更好。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“所以，娶自己仍为童女的未婚妻的人做得好；不娶她的人做得更好。”另一种常见解释认为，“自己那位童女”特指“自己的女儿”。这里的希腊语动词较自然地表示“使其结婚、把她嫁出去”，所以正文保留这个意思，却不进一步确定该女子与那人的具体关系。
    reason: 交代本节关键语句的另一种句法理解，以及“童女”身份上的主要异解。
lexical_decisions:
- source_word: ὥστε
  choice: 所以
  rationale: 表示从上文得出的结论，符合现代汉语自然表达，并保留推论语气。
- source_word: γαμίζων
  choice: 把……嫁出去
  rationale: γαμίζω通常具有使役含义，即“使其结婚、把她嫁出去”，不同于单纯表示“结婚”的γαμέω；因此正文保留使役义。
- source_word: τὴν παρθένον ἑαυτοῦ
  choice: 自己的童女
  rationale: παρθένος指未婚而守贞的女子，ἑαυτοῦ表示与该男子所属或相关的关系。译作“自己的童女”虽略带古雅，却避免武断指定她是女儿、受监护者或未婚妻，从而保留原文的争议与含混。
- source_word: καλῶς ποιεῖ
  choice: 做得好
  rationale: 自然保留原文正面评价的力度，同时不把它强化成绝对命令。
- source_word: μὴ γαμίζων
  choice: 不把她嫁出去
  rationale: 与前一分句一致保留使役义；“她”承接前文宾语，使汉语表达完整。
- source_word: κρεῖσσον ποιήσει
  choice: 做得更好
  rationale: κρεῖσσον是比较级；“更好”准确保留比较判断，不误译为最高级“最好”。
theological_decisions:
- issue: “自己的童女”所指的人，以及γαμίζω在哥林多前书7:38中的含义
  choice: 正文采用使役义“把……嫁出去”，但不明确把童女说成女儿或受监护者。
  alternative: 也可理解为“娶自己守贞的未婚妻”；另一常见理解明确指“把自己的童女嫁出去”。
  rationale: 哥林多前书7:36–38是著名的释义难点。γαμίζω较自然地支持“使结婚、嫁出去”的使役义，但“自己的童女”究竟是女儿、受监护的女子，还是在另一种句法解释下的未婚妻，仍有争议。正文尽量贴近希腊语形式，脚注交代主要异解，不以译文替读者解决原文未明说的社会关系。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“童女”用于准确表达παρθένος并维持身份上的含混；全句以“做得好／做得更好”清楚呈现保罗的比较性判断。
