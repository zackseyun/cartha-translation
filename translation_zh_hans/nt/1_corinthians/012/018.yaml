  text: ⸀νυνὶ δὲ ὁ θεὸς ἔθετο τὰ μέλη, ἓν ἕκαστον αὐτῶν, ἐν τῷ σώματι καθὼς ἠθέλησεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/018.yaml
  text: But as it is[a], God arranged the members, each one of them[b], in the body just as he desired.
translation:
  language: zh_hans
  text: 但事实上，上帝照着自己的意愿，把肢体一一安置在身体里。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “安置”也可译为“安排”或“放置”。
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: 但事实上
  rationale: 承接前文的假设性反问，并转回实际情形；“但事实上”自然保留转折和现实状态的语用功能，避免“但现在”被误解为单纯的时间转换。
- source_word: ὁ θεὸς
  choice: 上帝
  rationale: 对带冠词的 θεός 作自然、明确的现代汉语表达。
- source_word: ἔθετο
  choice: 安置好了
  rationale: τίθημι 的基本意义是放置、安放；在身体比喻中，“安置”兼顾各肢体在整体中的位置和上帝有意的安排。“好了”体现不定过去时所叙述的既成事实，但不把时态过度教义化。
- source_word: τὰ μέλη
  choice: 身体的各个肢体
  rationale: μέλη 在此指构成身体的各部分；“肢体”能延续本段身体比喻，也符合中文圣经语境。“身体的”是为汉语清晰度补出，并由后面的 ἐν τῷ σώματι 支持。
- source_word: ἓν ἕκαστον αὐτῶν
  choice: 一一
  rationale: 简洁保留分配性强调，表明每一个肢体都包括在内，而非仅指整体性的安排。
- source_word: ἐν τῷ σώματι
  choice: 把身体的各个肢体……安置
  rationale: 按自然汉语将地点关系融入“把”字结构；语义仍是每个肢体被置于身体之中，没有把“身体”直接解释为教会。
- source_word: καθὼς ἠθέλησεν
  choice: 都是照着自己的意愿
  rationale: 保留 καθὼς 的符合关系和 θέλω 的意愿、意欲含义；“自己的”在汉语中清楚回指上帝，同时避免“随己意”可能带来的任意或武断色彩。
theological_decisions:
- issue: 上帝安置身体各肢体的主动性与目的性
  choice: 译文表明每个肢体的位置都是上帝按自己的意愿安置的。
  alternative: 仅译为中性的“放在身体里”，较少体现有意安排。
  rationale: ἔθετο 与 καθὼς ἠθέλησεν 共同突出上帝的主动意愿；译文保留这一重点，但不由此扩展为经文未明说的系统教义。
- issue: “身体”的指向
  choice: 正文保留身体比喻本身。
  alternative: 直接释为“教会”。
  rationale: 本节首先继续论述身体与肢体的比喻；虽然后文应用于基督的身体，直接以“教会”替换会提前消除比喻层次。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“但事实上”清楚衔接上文；“一一安置好了”兼顾自然表达、逐一强调和神圣主动性。脚注标记置于其所说明的意愿短语之后。
