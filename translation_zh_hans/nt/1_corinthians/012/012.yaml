source:
  edition: SBLGNT
  text: Καθάπερ γὰρ τὸ σῶμα ἕν ἐστιν καὶ μέλη ⸂πολλὰ ἔχει⸃, πάντα δὲ τὰ μέλη τοῦ ⸀σώματος πολλὰ ὄντα ἕν ἐστιν σῶμα, οὕτως καὶ ὁ Χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/012.yaml
  text: For just as the body is one and has many members[a], and all the members of the body, though they are many, are one body[b], so also is Messiah.
translation:
  language: zh_hans
  text: 正如身体是一个，却有许多肢体；身体的各肢体虽然很多，却仍是一个身体；受膏者[a]也是这样。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “受膏者”：希腊文为Χριστός，传统译作“基督”。这里采用“受膏者”，以显明这是一个称号。
    reason: alternative_reading
  - marker: b
    text: 原文直译为“受膏者也是这样”。这是一个浓缩的表达；下文将进一步说明，许多肢体怎样组成一个身体。
    reason: preserve_ambiguity
lexical_decisions:
- source_word: Καθάπερ γὰρ
  choice: 因为……也是这样
  rationale: “因为”保留γάρ与上文的解释性联系；“……也是这样”呈现καθάπερ与οὕτως καί前后呼应的比较结构，符合现代汉语表达。
- source_word: σῶμα
  choice: 身体
  rationale: 直接保留保罗论证的核心身体比喻。
- source_word: ἕν
  choice: 一个
  rationale: 既表达数量上的单一，也保留整体合一的含义。
- source_word: μέλη
  choice: 肢体
  rationale: “肢体”在汉语中自然指身体各部分，也能承接下文关于群体成员的比喻意义。
- source_word: πολλὰ ὄντα
  choice: 虽然很多
  rationale: 以让步结构自然表达分词短语在句中的让步意味。
- source_word: ἕν ἐστιν σῶμα
  choice: 仍是一个身体
  rationale: “仍”明确表达众多肢体与一个身体之间的让步关系，而不增加新的解释。
- source_word: οὕτως καὶ ὁ Χριστός
  choice: 受膏者也是这样
  rationale: 保留简洁而意味浓缩的比较结论，不擅自扩写为“受膏者的身体”或“教会”；“受膏者”直接传达Χριστός的称号含义。
theological_decisions:
- issue: Χριστός的译法
  choice: 受膏者
  alternative: 基督
  rationale: 此处ὁ Χριστός带冠词并处于神学性比较结论中，译为“受膏者”可使现代读者看见其称号含义，而非仅将其当作专名；脚注列出教会传统通行译法。
- issue: “受膏者也是这样”的所指
  choice: 保留原文浓缩表达
  alternative: 受膏者的身体也是这样／教会也是这样
  rationale: 希腊文只说οὕτως καὶ ὁ Χριστός。直接补出“身体”或“教会”会替正文解除原有的神学张力；其具体含义由后文展开。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“肢体”保留身体比喻及其群体层面的延伸；分号呈现原文层层推进的论证。所有解释性补充均置于脚注，正文不把“受膏者”改写成“教会”或“受膏者的身体”。
