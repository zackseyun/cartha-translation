  text: Καὶ γὰρ τὸ σῶμα οὐκ ἔστιν ἓν μέλος ἀλλὰ πολλά.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/014.yaml
  text: For the body is not one member, but many.
translation:
  language: zh_hans
  text: 因为身体并不是一个肢体，而是许多肢体。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ γὰρ
  choice: 因为
  rationale: 该组合在这里承接并说明上文的论证。现代汉语用“因为”自然表达其解释性关联；καί在组合中不必机械译作“并且”。
- source_word: τὸ σῶμα
  choice: 身体
  rationale: 直接保留保罗的身体比喻，不在本节中扩充为“基督的身体”或“教会”。
- source_word: οὐκ ἔστιν
  choice: 并不是
  rationale: 忠实表达否定系词；“并”加强与后半句转折的自然衔接，却不增加实质意义。
- source_word: ἓν μέλος
  choice: 一个肢体
  rationale: μέλος指身体的肢体或组成部分。“肢体”既保留身体意象，也符合本段常见而庄重的汉语表达。
- source_word: ἀλλὰ πολλά
  choice: 而是许多肢体
  rationale: πολλά为实词化的中性复数，所省略的μέλη可由前文补出。汉语若只说“而是许多”不够自然，因此明示“肢体”。
theological_decisions:
- issue: “身体”的隐喻所指
  choice: 正文保留“身体”，不扩写其所指
  alternative: 译作“基督的身体”或“教会”
  rationale: 上下文确实将教会描绘为基督的身体，但本节希腊文本仅有“身体”。保留原有隐喻可避免把上下文解释直接写入正文。
translation_notes:
  register: 采用自然、简洁而庄重的现代标准汉语。“因为……并不是……而是……”清楚呈现本句对上文的解释作用及 οὐκ…ἀλλά 的对比结构。
