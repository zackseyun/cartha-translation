  text: καὶ ἐὰν εἴπῃ τὸ οὖς· Ὅτι οὐκ εἰμὶ ὀφθαλμός, οὐκ εἰμὶ ἐκ τοῦ σώματος, οὐ παρὰ τοῦτο οὐκ ἔστιν ἐκ τοῦ σώματος·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/016.yaml
  text: And if the ear says[a], ‘Because I am not an eye, I am not of the body,’ it is not for this reason not of the body.
translation:
  language: zh_hans
  text: 耳朵若说：“因为我不是眼睛，所以我不属于身体[a]。”它并不因此就不属于身体。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可较意译为：“因为我不是眼睛，所以我不是身体的一部分”……“这并不使它不再是身体的一部分。”原文前后重复同一个“属于身体”的说法，以形成修辞呼应。
    reason: 说明更符合汉语习惯的替代译法，并交代正文保留原文重复结构的原因。
lexical_decisions:
- source_word: καὶ
  choice: （不单独译出）
  rationale: 本节承接上一节的并列例证；现代汉语在此无需另加“并且”，上下文的衔接仍然清楚。
- source_word: ἐὰν εἴπῃ
  choice: 若说
  rationale: ἐὰν加虚拟语气表达假设情形；“若说”简洁、庄重，也符合现代汉语。
- source_word: τὸ οὖς
  choice: 耳朵
  rationale: 保留普通身体部位名称及其拟人化表达。
- source_word: Ὅτι
  choice: 因为
  rationale: 这里既引出话语内容，也体现其所声称的因果理由；译作“因为”能保留论证关系。
- source_word: ὀφθαλμός
  choice: 眼睛
  rationale: 采用现代汉语中自然、明确的身体部位名称。
- source_word: ἐκ τοῦ σώματος
  choice: 属于身体
  rationale: 此处ἐκ τοῦ σώματος表达作为身体一部分的归属关系；“属于身体”比逐字译作“出于身体”自然，同时在前后两处完全重复，以保留原文的修辞呼应。
- source_word: οὐ παρὰ τοῦτο
  choice: 不能因此就
  rationale: 表达不能根据刚才所说的理由推出后面的否定结论；“因此就”准确呈现παρὰ τοῦτο的推论意味。
- source_word: οὐκ ἔστιν ἐκ τοῦ σώματος
  choice: 不属于身体
  rationale: 保留原文否定式结论，并与引语中的同一短语相呼应；以“不能……不……”再现原文反驳性的双重否定结构。
theological_decisions:
- issue: 是否把身体比喻直接解释为教会成员身份
  choice: 保留“属于身体”的比喻性说法，不在正文中加上“教会”或“肢体”等解释
  alternative: 译为“这并不使它不再是身体的一部分”或直接说明教会归属
  rationale: 原文本节继续身体各部分的比喻，并未在句内直接解释其教会论所指；保留比喻可避免把解释性内容加入正文。
- issue: 如何处理原文的重复否定
  choice: 译作“它不能因此就不属于身体”
  alternative: 译作“它仍然是身体的一部分”
  rationale: 正面改写虽较顺口，却会消除保罗刻意使用的否定式反驳；本译文保留其论证张力，同时维持自然汉语。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“若说”保持经文语体但不古奥；“不能因此就不属于身体”有意保留原文的重复与否定式推理。
