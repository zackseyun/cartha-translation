source:
  edition: SBLGNT
  text: καὶ οὓς μὲν ἔθετο ὁ θεὸς ἐν τῇ ἐκκλησίᾳ πρῶτον ἀποστόλους, δεύτερον προφήτας, τρίτον διδασκάλους, ἔπειτα δυνάμεις, ⸀ἔπειτα χαρίσματα ἰαμάτων, ἀντιλήμψεις, κυβερνήσεις, γένη γλωσσῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/028.yaml
  text: And God has appointed in the church first apostles[a], second prophets, third teachers, then miracles, then gifts of healings, helps, administrations[c][b], kinds of tongues.
translation:
  language: zh_hans
  text: 神在教会中设立的有：第一是使徒，第二是先知，第三是教师；随后是异能[a]，再后是医治的种种恩赐、帮助、治理[b]和各种方言[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “异能”或译“大能的作为”。
    reason: lexical_alternative
  - marker: b
    text: “治理”或译“引导”或“各种带领的功用”。
    reason: lexical_alternative
  - marker: c
    text: “各种方言”或译“各种语言”。原文用词既可指“方言”，也可指“语言”；正文保留保罗在本语境中用词的含混性。
    reason: alternative_reading
lexical_decisions:
- source_word: ἔθετο
  choice: 设立
  rationale: 这里的 τίθημι 表示神在教会中安置或指派人承担角色、发挥功用；“设立”既自然，也保留神主动安排的含义。
- source_word: ἐν τῇ ἐκκλησίᾳ
  choice: 在教会中
  rationale: ἐκκλησία 在此指属神的群体；“教会”符合保罗书信的通常用语，也适合本章讨论肢体、职分与恩赐的语境。
- source_word: πρῶτον ... δεύτερον ... τρίτον ... ἔπειτα
  choice: 第一……第二……第三……然后……再后
  rationale: 照原文呈现明确的次序，同时不说明这次序究竟属于权柄、时间还是功能上的重要性。
- source_word: ἀποστόλους
  choice: 使徒
  rationale: 在教会职分的清单中，该词指受差遣并具有公认使徒职分的人；采用现代中文基督教语境中清楚、通行的对应词。
- source_word: προφήτας
  choice: 先知
  rationale: 直接表达在群体中传达预言性信息的人，不额外限定其具体运作方式。
- source_word: διδασκάλους
  choice: 教师
  rationale: 准确、简洁地表达在教会中承担教导功用的人。
- source_word: δυνάμεις
  choice: 异能
  rationale: 该复数词字面涉及“大能”，在恩赐清单中指大能的作为或神迹；“异能”简洁并保留名词性清单的形式，脚注列出较直译的说法。
- source_word: χαρίσματα ἰαμάτων
  choice: 医治的种种恩赐
  rationale: 原文“恩赐”和“医治”均为复数；“种种”尽量体现其复数和多样性，同时保持中文自然。
- source_word: ἀντιλήμψεις
  choice: 帮助
  rationale: 该词表示扶助、支援的行动或能力；“帮助”通俗清楚，并保留原文抽象名词的形式。
- source_word: κυβερνήσεις
  choice: 治理
  rationale: 该词带有掌舵、引导和管理的意象；“治理”能表达带领与组织的功用，又不把它强行解释为某一固定层级的职分。
- source_word: γένη γλωσσῶν
  choice: 各种方言
  rationale: γένη 表示种类，γλῶσσαι 可指舌、方言或语言；“各种方言”沿用保罗相关经文的通行措辞，并以脚注保留“各种语言”这一可能译法。
theological_decisions:
- issue: 本节的排列次序究竟表示永久性的权柄等级、出现的先后，还是功能上的重要性
  choice: 按原文直译为“第一……第二……第三……然后……再后”，不添加解释性限定。
  alternative: 明确译成权柄等级、历史先后或重要性排序。
  rationale: 原文确实列出次序，却没有明说次序的性质；译文保留这种未决张力。
- issue: γλῶσσαι 在此具体指什么
  choice: 正文采用“方言”。
  alternative: 各种语言。
  rationale: 保罗在本章所说现象的确切性质存在解释空间；正文不将其限定为普通人类语言，脚注则保留这一词义可能。
- issue: 清单由人物转为恩赐、作为和功用
  choice: 保留“使徒、先知、教师”之后接“异能、恩赐、帮助、治理、方言”的语法转换。
  alternative: 把后半全部补译为“行异能的人”“帮助人的人”等。
  rationale: 原文先以 οὓς 引出人，随后转用抽象或事物性复数名词；不统一改写，可保留保罗表达中的真实转换。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。整体维持原文清单式节奏，并用分号区分前三项明确列序的人员角色与其后的恩赐、作为及功用；不把该次序解释成特定教会制度或神学等级。
