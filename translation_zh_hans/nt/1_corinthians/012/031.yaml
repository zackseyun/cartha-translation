  text: ζηλοῦτε δὲ τὰ χαρίσματα τὰ ⸀μείζονα. καὶ ἔτι καθ’ ὑπερβολὴν ὁδὸν ὑμῖν δείκνυμι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/031.yaml
  text: But earnestly desire the greater gifts[b][a]. And I will show you a still more surpassing way.
translation:
  language: zh_hans
  text: 不过，你们要热切追求那些更大的恩赐。[a] 我还要向你们指出一条更为卓越的道路。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不过，你们热切追求那些更大的恩赐。”希腊文ζηλοῦτε在这里既可理解为命令语气，也可理解为直陈语气。
    reason: alternative_reading
  - marker: b
    text: “更为卓越”也可译为“远为卓越”。原文短语表达超乎通常程度的优越。
    reason: lexical_alternative
lexical_decisions:
- source_word: ζηλοῦτε
  choice: 要热切追求
  rationale: ζηλόω表示强烈的愿望、热忱或积极追求。“热切追求”在现代汉语中自然地传达其力度；正文按命令语气理解，同时以脚注保留直陈语气的可能。
- source_word: χαρίσματα
  choice: 恩赐
  rationale: χάρισμα指由恩典而来的赐予；在本章语境中是各样属灵能力与职分。“恩赐”既简洁，也保留了词语与恩典的关联，无须在本句另加原文没有的“属灵”。
- source_word: μείζονα
  choice: 更大的
  rationale: 保留比较级的基本意义，不在译文中额外限定为“更重要的”，让其具体所指由上下文判断。
- source_word: καὶ ἔτι
  choice: 还要
  rationale: 表达与前文的延续及递进，并自然引出下文。
- source_word: καθ’ ὑπερβολὴν
  choice: 更加卓越
  rationale: 该短语表示超越通常程度、格外优越。“更加卓越”在现代汉语中自然，并保留其递进和超越意味。
- source_word: ὁδὸν
  choice: 道路
  rationale: 保留ὁδός的比喻，指一种生活方式或行事途径，并引向第十三章有关爱的论述。
- source_word: δείκνυμι
  choice: 要指给
  rationale: 希腊文为现在时，但保罗是在引出随后的论述；汉语用“还要指给”自然表达即将展开说明的语用功能。
theological_decisions:
- issue: ζηλοῦτε的语气
  choice: 命令语气：“你们要热切追求”
  alternative: 直陈语气：“你们正在热切追求”
  rationale: 该形式既可能是命令语气，也可能是直陈语气。正文采用较符合本段劝勉语流的命令语气，但以脚注明确保留另一种语法可能，避免消除原文的歧义。
- issue: “更大的恩赐”与“更加卓越的道路”的关系
  choice: 保留两者的比较表达，不将“道路”直接释义为“爱”
  alternative: 解释性译为“我要指给你们爱这条最卓越的道路”
  rationale: 原文在此只说“道路”，具体内容到下一章才展开。保留比喻与递进，避免把解释提前写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“热切追求”传达劝勉力度；“恩赐”沿用汉语基督教语境中已广为理解的用词；“道路”保留原文比喻。标点和句式力求适合公开诵读。
