  text: πάντα δὲ ταῦτα ἐνεργεῖ τὸ ἓν καὶ τὸ αὐτὸ πνεῦμα, διαιροῦν ἰδίᾳ ἑκάστῳ καθὼς βούλεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/011.yaml
  text: But one and the same Spirit works all these things[d][c][b][a], distributing to each one individually just as he wills.
translation:
  language: zh_hans
  text: 但这一切都是同一位圣灵[b]所成就的[a]；他随自己的意思[d]，分别分给[c]每一个人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “成就”或译“运行”“产生”。
    reason: lexical_alternative
  - marker: b
    text: 原文强调是“同一位圣灵”，说明各种不同的恩赐表现都出于同一源头。
    reason: cross_reference
  - marker: c
    text: “分别分给”或译“按份分配给”。原文此处未明说所分配的对象；上下文所指为恩赐及其表现。
    reason: lexical_alternative
  - marker: d
    text: “随自己的意思”或译“照着自己的选择”。原文动词可表示愿意、选择或意欲。
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα δὲ ταῦτα
  choice: 但这一切
  rationale: πάντα与ταῦτα合用，强调前文所列各种恩赐表现的整体；δέ在这里表示轻微转折或承接，用“但”引出多样表现背后的同一源头。
- source_word: ἐνεργεῖ
  choice: 所成就的
  rationale: ἐνεργέω在此表示主动运行并产生结果。“成就”保留圣灵主动使这一切发生的含义，又不限定其具体方式。
- source_word: τὸ ἓν καὶ τὸ αὐτὸ πνεῦμα
  choice: 同一位圣灵
  rationale: 原文强调众多不同表现都来自完全相同的一位灵。“同一位”自然表达其同一性；按保罗书信语境译作“圣灵”，并用“位”体现其主体性。
- source_word: διαιροῦν
  choice: 分给
  rationale: 该分词说明圣灵成就这一切的方式，即把不同恩赐分配给各人。“分给”自然清楚，也避免“分割”可能带来的负面含义。
- source_word: ἰδίᾳ ἑκάστῳ
  choice: 逐一……每一个人
  rationale: ἰδίᾳ与ἑκάστῳ共同突出个别性的分配；“逐一……每一个人”保留这一分配意义，同时符合现代汉语表达。
- source_word: καθὼς βούλεται
  choice: 按照自己的意愿
  rationale: καθώς表示分配所依据的准则，βούλομαι表示意愿、选择或意图。“按照自己的意愿”既保留主动意志，也不把词义收窄为单纯欲望。
theological_decisions:
- issue: πνεῦμα的所指及βούλεται所体现的主体性
  choice: 将πνεῦμα译作“圣灵”，并以“他……自己的意愿”表达其有意志的主体性
  alternative: 按πνεῦμα的希腊语中性语法处理为非人格的“它”，或省略代词而译作“按所定的”
  rationale: πνεῦμα虽在语法上是中性名词，但βούλεται把意愿归于这位灵；本段保罗语境把圣灵描写为主动分配恩赐的主体。因此用“他”和“自己的意愿”忠实表达经文本身所呈现的个人性行动，而非依据语法性别将其物化。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“所成就的”保持经文语体而不过度古雅；“逐一分给每一个人”明确表达个别分配。标点将圣灵的工作与其分配方式相连，避免把后半句误读成另一个行动者。
