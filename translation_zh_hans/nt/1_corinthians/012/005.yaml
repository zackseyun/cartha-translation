  yaml_path: translation/nt/1_corinthians/012/005.yaml
  text: And there are varieties of ministries[a], and the same Lord.
translation:
  language: zh_hans
  text: 服事有多种，主却是同一位。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: 省略明译，以并列句式承接上文
  rationale: καί连接本节与上下平行句。现代汉语在独立呈现本节时不必机械译作“并且”；并列结构已能自然表达承接关系。
- source_word: διαιρέσεις
  choice: 不同的方式
  rationale: 此处指在合一之中存在不同种类或样式，并非纷争或派别；“不同的方式”自然传达差异而不暗示分裂。
- source_word: διακονιῶν
  choice: 服事
  rationale: διακονία可指服务、服事或职事。结合属灵恩赐及群体功用的语境，“服事”既保留行动含义，也避免把它局限为正式职位。
- source_word: εἰσιν
  choice: 有
  rationale: 用汉语存在句“有”自然对应εἰσιν。
- source_word: ὁ αὐτὸς
  choice: 同一位
  rationale: 强调各种服事背后的主相同；“同一位”与有位格的“主”搭配自然，并保留上下文反复出现的合一主题。
- source_word: κύριος
  choice: 主
  rationale: 保留保罗所用的称号，不在正文中扩写其所指；在12:4–6的三重平行结构里，很可能指主耶稣。
theological_decisions:
- issue: 12:4–6三重表述中“主”的所指
  choice: 正文只译“主”，不作解释性扩写
  alternative: 明确译作“主耶稣”，或理解为较泛指的主／上帝
  rationale: 上下文依次提到同一位圣灵、同一位主、同一位上帝，因此“主”很可能指耶稣；但原文没有加上“耶稣”，译文保留其措辞和可能存在的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“服事”符合教会语境，但仍保有服务他人的基本意义；“主却是同一位”以“却”突出多样与合一的对照，未增加实质命题。
