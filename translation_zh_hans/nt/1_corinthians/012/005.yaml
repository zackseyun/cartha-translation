  naturalness: 原文整体自然庄重，但“服事有不同的方式”略有语义偏移。改为“服事有多种”更简洁、自然，并与12:4—6的平行句式相称。
  terminology: “服事”可恰当对应διακονιῶν，且不把含义限于正式职位。“主”应保留为称号，不扩写为“主耶稣”。
