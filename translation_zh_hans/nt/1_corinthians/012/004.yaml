base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/004.yaml
  text: There are varieties of gifts[a], but the same Spirit.
translation:
  language: zh_hans
  text: 恩赐有不同[a]，圣灵却是同一位。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“恩赐有各种分别”或“恩赐有不同的分配”。希腊文强调恩赐的多样性，并非教会的分裂。
    reason: 词义存在可成立的不同表达，且需避免把多样性误读为纷争。
lexical_decisions:
- source_word: Διαιρέσεις
  choice: 不同
  rationale: 此复数名词在这里指恩赐之间的区别和多样性，并非教会中的分裂；“虽有不同”以自然汉语表达下文与“同一位”之间的对照。
- source_word: δὲ ... δὲ
  choice: 虽……却……
  rationale: 两个 δέ 共同构成多样性与同一性的对照。汉语用“虽……却……”清楚自然地呈现这一关系，同时不把第一个 δέ 误作时间性的“现在”。
- source_word: χαρισμάτων
  choice: 恩赐
  rationale: χάρισμα 指出于恩典而赐下的礼物，在本段特指圣灵所赐的属灵恩赐；“恩赐”是现代中文基督教语境中清楚而简洁的表达。
- source_word: τὸ ... αὐτὸ
  choice: 同一位
  rationale: 该结构强调身份相同；配合有位格的“圣灵”，“同一位”比单说“相同”更符合现代汉语。
- source_word: πνεῦμα
  choice: 圣灵
  rationale: 上下文（12:3—11）明确指向赐下并分配恩赐的神之灵；译作“圣灵”可清楚标明所指，而不是人的灵。
theological_decisions:
- issue: πνεῦμα 的所指
  choice: 圣灵
  alternative: 人的灵；属灵能力或原则
  rationale: 哥林多前书12章的近距离上下文反复把这位灵描述为恩赐的神圣来源和分配者，因此“圣灵”最符合语境。
- issue: 恩赐的多样性与圣灵的同一性
  choice: 保留“不同”与“同一位”的鲜明对照
  alternative: 把 διαίρεσεις 译成带负面意味的“分裂”
  rationale: 保罗此处肯定恩赐有真实差异，同时强调来源于同一位圣灵；不应把这种多样性误解为教会纷争。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“恩赐”保留经文语境中的核心术语；“虽……却……”使原文的对照关系在中文中自然清楚。
