id: 1CO.12.24
reference: 1 Corinthians 12:24
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: τὰ δὲ εὐσχήμονα ἡμῶν οὐ χρείαν ⸀ἔχει. ἀλλὰ ὁ θεὸς συνεκέρασεν τὸ σῶμα, τῷ ⸀ὑστεροῦντι περισσοτέραν δοὺς τιμήν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/024.yaml
  text: but our presentable parts have no need. Instead[a], God has composed the body, giving greater honor to the part that lacked it,
translation:
  language: zh_hans
  text: 至于我们体面的肢体，就没有这个需要。然而，上帝把身体调和成一个整体[a]，把更多的尊荣给了那缺少尊荣的肢体，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“配搭了身体。”希腊语动词可强调把不同部分混合、结合为统一的整体。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐσχήμονα
  choice: 体面的肢体
  rationale: 该词在这里与上一节“不体面”的肢体相对，指外观上得体、无须特别遮护的身体部位；“肢体”依上下文补出，使中文自然。
- source_word: χρείαν ἔχει
  choice: 没有这个需要
  rationale: 直译为“没有需要”；“这个”承接上一节对不体面肢体所给予的格外体面，避免在正文中过度展开。
- source_word: συνεκέρασεν
  choice: 调和成一个整体
  rationale: 该动词有混合、结合之意，强调上帝把不同肢体结合为统一的身体；“调和成一个整体”既保留词义形象，也符合现代中文表达。
- source_word: σῶμα
  choice: 身体
  rationale: 保留保罗贯穿本段的身体比喻，不在正文中提前限定为自然身体或教会。
- source_word: τῷ ὑστεροῦντι
  choice: 那缺少尊荣的肢体
  rationale: 分词表示有所缺少或不足；所缺的内容由后面的“尊荣”确定。这样译可避免暗示该肢体本身价值较低。
- source_word: περισσοτέραν τιμήν
  choice: 更多的尊荣
  rationale: 直接保留比较级的含义，表达相对于原先缺少尊荣的肢体，上帝赐予更丰富的尊荣。
- source_word: δοὺς
  choice: 把……给了
  rationale: 以中文连动结构表达该不定过去时分词，说明上帝调和身体的方式或伴随行动。
theological_decisions:
- issue: 上帝调和身体这一行动的指向
  choice: 保留“身体”的比喻，并呈现上帝有意使不同肢体结合、把更多尊荣给缺少尊荣者的行动。
  alternative: 将其明确限定为人体构造，或直接解释为上帝在教会中安排各成员。
  rationale: 上下文同时运用人体和教会的类比。正文不把“身体”单限定为其中一层，以保留比喻张力，同时清楚表达上帝主动赐予尊荣。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“体面的肢体”与上下文的外在得体相呼应；“调和成一个整体”保留原文结合、混合的词义色彩。句末逗号保留原句与下一节在语法和论述上的延续。
