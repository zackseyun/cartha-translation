  text: ἐὰν εἴπῃ ὁ πούς· Ὅτι οὐκ εἰμὶ χείρ, οὐκ εἰμὶ ἐκ τοῦ σώματος, οὐ παρὰ τοῦτο οὐκ ἔστιν ἐκ τοῦ σώματος;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/015.yaml
  text: If the foot says[a], “Because I am not a hand, I am not of the body,” it is not for this reason not of the body, is it?
translation:
  language: zh_hans
  text: 如果脚说：“因为我不是手，所以我不属于身体”，它并不因此就不属于身体，不是吗？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν εἴπῃ
  choice: 如果……说
  rationale: ἐὰν加不定过去时虚拟语气构成一般性的假设条件；“如果……说”在现代汉语中自然，并保留假设意味。
- source_word: ὁ πούς
  choice: 脚
  rationale: 保留具体的身体部位意象，因为保罗的论证依赖“脚”与“手”的对比。
- source_word: Ὅτι
  choice: 因为
  rationale: 此处既引出脚所说的话，也表达其推论的理由；译为“因为”能清楚呈现抱怨的逻辑。
- source_word: χείρ
  choice: 手
  rationale: 直译以保留身体比喻及其与“脚”的鲜明对照。
- source_word: ἐκ τοῦ σώματος
  choice: 属于身体
  rationale: 这里表示作为身体的一部分或成员；“属于身体”是自然的现代汉语，并能在两处重复使用以体现原文的呼应。
- source_word: οὐ παρὰ τοῦτο
  choice: 不能因此就
  rationale: παρὰ τοῦτο指“由于这个缘故”；结合前后否定，译为“不能因此就”自然地否定脚所得出的结论。
- source_word: οὐκ ἔστιν ἐκ τοῦ σώματος
  choice: 不属于身体，不是吗？
  rationale: 保留原文反问和否定形式；汉语句末“不是吗”明确表达预期的否定答案，即脚仍属于身体。
theological_decisions:
- issue: 如何处理身体比喻中的重复和双重否定
  choice: 重复“属于身体”，并以“不能因此就……不是吗？”保留反问与否定推理
  alternative: 意译为“这也不能使它不再是身体的一部分”
  rationale: 所选译法既保留两次ἐκ τοῦ σώματος的呼应和原文反问，也避免逐词复制双重否定而造成不自然或难懂的汉语；不额外解释教会论含义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。保留“脚—手—身体”的具体比喻和保罗的反问语气；“属于身体”比“出于身体”更符合此处成员关系的汉语表达。
