base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/002.yaml
  text: You know that when you were Gentiles[a], you were led away to the mute idols[b], however you were led.
translation:
  language: zh_hans
  text: 你们知道，你们从前作外邦人的时候，无论怎样受引导，总被带到那些不能说话的偶像那里去[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“无论怎样受引导，被带往那些不能说话的偶像。”“受引导”和“被带往”都为被动表达，强调他们从前受外在影响带动。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδατε
  choice: 你们知道
  rationale: 直译保罗诉诸共同记忆的语气，在现代汉语中自然明确。
- source_word: ὅτε ἔθνη ἦτε
  choice: 你们从前作外族人的时候
  rationale: ἔθνη在此兼有族群和宗教背景；“外族人”保留相对于犹太人的身份含义，又不采用贬义较强的“异教徒”。“从前”由过去时语境自然体现。
- source_word: πρὸς τὰ εἴδωλα τὰ ἄφωνα
  choice: 到那些不能说话的偶像那里去
  rationale: 保留πρός所表达的趋向，并将ἄφωνα自然译为“不能说话的”，凸显偶像无言，与上下文有关属灵言语的讨论形成对照。
- source_word: ὡς ἂν ἤγεσθε
  choice: 总是受牵引
  rationale: ὡς ἂν在此具有不定方式的意味，结合未完成时被动态，表达他们当时任凭某种力量以各种方式牵引；汉语“总是受牵引”保留持续、被动的色彩而避免生硬重复。
- source_word: ἀπαγόμενοι
  choice: 被带到……那里去
  rationale: 分词强化被动移动，指被带往偶像；与ἤγεσθε构成修辞性的重复，译文以“受牵引，被带到”予以保留。
theological_decisions:
- issue: ἔθνη所指的哥林多人从前身份
  choice: 译为“外族人”
  alternative: “异教徒”或“列国的人”
  rationale: “外族人”保留保罗用语中的族群—宗教双重背景，不把经文单方面收窄为道德贬称；“列国的人”在现代汉语中则不够清楚。
- issue: ἄφωνα与上下文属灵言语之间的修辞对照
  choice: 译为“不能说话的偶像”
  alternative: “无声的偶像”
  rationale: “不能说话”明确表达偶像缺乏言语能力，同时不在正文中额外解释这一对照的神学意义。
- issue: ἤγεσθε与ἀπαγόμενοι的双重被动表达
  choice: 保留为“受牵引，被带到”
  alternative: 简化为“被引到”
  rationale: 原文刻意叠加被动移动的表达，强调他们从前受外在影响摆布；保留两层措辞可避免抹平这一张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“作外族人”保留身份色彩；“不能说话的偶像”比“哑巴偶像”更庄重准确。正文适度重组希腊语序，使两层被动动作在汉语中清楚可读，同时以脚注保存ὡς ἂν的另一种较形式对应的表达。
