  text: ᾧ μὲν γὰρ διὰ τοῦ πνεύματος δίδοται λόγος σοφίας, ἄλλῳ δὲ λόγος γνώσεως κατὰ τὸ αὐτὸ πνεῦμα,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/008.yaml
  text: For to one is given through the Spirit a message of wisdom[a], and to another a message of knowledge according to the same Spirit[c][b],
translation:
  language: zh_hans
  text: 有人借着圣灵领受智慧的话语[a]，另一个人则按着同一位圣灵领受知识的话语[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“智慧的言语”或“智慧的信息”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“知识的言语”或“知识的信息”。
    reason: lexical_alternative
  - marker: c
    text: “按着同一位圣灵”也可译作“由同一位圣灵”。这里的希腊文介词不同于前面的“借着圣灵”，可表示依照或符合；这也指向同一位圣灵作为共同来源。
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾧ μὲν
  choice: 有一个人
  rationale: 在分配性的对比结构中指群体中的某一个人；这样译成现代汉语自然，并与后面的“另一个人”对应。
- source_word: διὰ τοῦ πνεύματος
  choice: 借着圣灵
  rationale: διά加属格表示媒介或施行者；“借着”保留圣灵作为赐予媒介的含义。
- source_word: δίδοται
  choice: 得着
  rationale: 原文是现在时被动语态，表明这是被赐下的，并非人自行产生；汉语“得着”在此自然表达领受之意。
- source_word: λόγος σοφίας
  choice: 智慧的言语
  rationale: λόγος在这里可指话语、表达或信息；“言语”既保留其宽泛性，也避免把它限定为单个字词。属格关系按原文保留。
- source_word: ἄλλῳ δὲ
  choice: 另一个人则
  rationale: 与前面的“有一个人”构成分配性的对照，并用“则”体现δέ的转接。
- source_word: λόγος γνώσεως
  choice: 知识的言语
  rationale: 与λόγος σοφίας保持平行译法；γνῶσις译为“知识”。
- source_word: κατὰ τὸ αὐτὸ πνεῦμα
  choice: 照着同一位圣灵
  rationale: κατά加宾格可表达依照、符合；“照着”有意区别于前面的διά“借着”，同时保留共同源于同一位圣灵的含义。
- source_word: πνεύματος / πνεῦμα
  choice: 圣灵
  rationale: 哥林多前书12章的上下文所指是赐下各样恩赐的神之灵；汉语以“圣灵”明确这一语境所指。
theological_decisions:
- issue: “灵”的所指
  choice: 圣灵
  alternative: 人的灵
  rationale: 紧邻上下文论述同一位神的灵分配各样恩赐，因此译作“圣灵”符合语境，也没有加入本节之外的宗派性解释。
- issue: λόγος在恩赐表达中的含义
  choice: 言语
  alternative: 信息；话语；道
  rationale: “言语”可自然涵盖说出的内容或表达，又能保留原文λόγος的宽度；脚注列出其他可能译法，避免把其性质解释得过窄。
- issue: κατά与διά的区别
  choice: 分别译作“照着”与“借着”
  alternative: 两处都译作“借着”或“由”
  rationale: 原文使用不同介词。保留这种差异，既呈现圣灵作为媒介，也呈现后一项与同一位圣灵相符或依其施予的关系，而不强行消除其张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“有一个人……另一个人则……”清楚呈现分配结构；“智慧的言语／知识的言语”保持原文平行。脚注标记均置于对应主文之后，并避免使用特定宗派的恩赐术语。
