  text: μὴ πάντες ἀπόστολοι; μὴ πάντες προφῆται; μὴ πάντες διδάσκαλοι; μὴ πάντες δυνάμεις;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/029.yaml
  text: Not all are apostles[a], are they? Not all are prophets, are they? Not all are teachers, are they? Not all work miracles, do they?
translation:
  language: zh_hans
  text: 难道人人都是使徒吗？难道人人都是先知吗？难道人人都是教师吗？难道人人都行神迹吗？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ
  choice: 难道……吗？
  rationale: μή引导的问句预期否定回答。现代汉语用“难道……吗”既自然，也保留四个反问的语气。
- source_word: πάντες
  choice: 人人
  rationale: πάντες在重复结构中指全体成员；“人人”简洁自然，并清楚突出并非每个人都有同样职分或功用。
- source_word: ἀπόστολοι
  choice: 使徒
  rationale: 此处是保罗所列的教会职分或功用，采用通行且准确的“使徒”，而非泛指的“使者”。
- source_word: προφῆται
  choice: 先知
  rationale: “先知”是指说预言者的标准译法，也符合本段恩赐与职分的语境。
- source_word: διδάσκαλοι
  choice: 教师
  rationale: “教师”直接对应教导者，并与前两项名词性称谓保持平行。
- source_word: δυνάμεις
  choice: 行神迹
  rationale: δυνάμεις字面为“大能”或“异能”，此处以转喻方式指施行大能之事；“行神迹”在现代汉语中自然表达这种功能，而不致误解为人本身就是“异能”。
theological_decisions:
- issue: 末项δυνάμεις在职分与恩赐清单中的表达
  choice: 难道人人都行神迹吗？
  alternative: 难道人人都是行异能的吗？／难道人人都有异能吗？
  rationale: 希腊文以名词“大能／异能”简略指代施行大能之事的功用。采用动词性表达传达上下文意思，同时不把经文扩大解释为每个人是否拥有某种内在能力。
- issue: 四个μή问句的预期答案
  choice: 以四次“难道……吗？”表达预期否定的反问
  alternative: 并非人人都是……
  rationale: 保留原文连续提问的修辞形式以及每问都预期“不是”的语气，不将其改写成平铺直叙的断言。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话；四句保持严格平行和反复节奏。无需脚注，因为“行神迹”已在正文中自然传达δυνάμεις的语境意义。
