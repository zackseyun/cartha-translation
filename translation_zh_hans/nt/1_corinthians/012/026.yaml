  text: καὶ ⸀εἴτε πάσχει ἓν μέλος, συμπάσχει πάντα τὰ μέλη· εἴτε δοξάζεται ⸀μέλος, συγχαίρει πάντα τὰ μέλη.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/026.yaml
  text: And if one member suffers[a], all the members suffer with it; if a member is honored, all the members rejoice with it.
translation:
  language: zh_hans
  text: 如果身体的一个肢体受苦，所有肢体就一同受苦；如果一个肢体得尊荣[a]，所有肢体就一同欢喜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“得荣耀”。这里很可能是指一个肢体受到尊重，整个身体便与它一同欢喜。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴτε ... εἴτε
  choice: 如果……如果……
  rationale: 这一关联结构提出两个相对应的情形。重复“如果”符合现代汉语表达，也保留经文的条件性和句式平行。
- source_word: πάσχει
  choice: 受苦
  rationale: 概括表达肢体所承受的痛苦或患难，不把痛苦限定为身体疼痛。
- source_word: ἓν μέλος / μέλος
  choice: 一个肢体
  rationale: “肢体”既保留人体比喻，也能在教会语境中自然指身体中的成员；第二处原文虽无数词ἓν，汉语仍需用“一个”自然表达不定指，不据此强调数目。
- source_word: συμπάσχει
  choice: 一同受苦
  rationale: 明确表达复合动词所含的共同承受之意，并与后半句“一同欢喜”形成对应。
- source_word: πάντα τὰ μέλη
  choice: 所有肢体
  rationale: 两处保持相同译法，以保留原文的重复、整体性和修辞平行。
- source_word: δοξάζεται
  choice: 得尊荣
  rationale: 在身体各肢体彼此关顾的语境中，主要指一个肢体受到尊重或获得荣誉；“得尊荣”也保留了该词与“荣耀”语义范围的联系。
- source_word: συγχαίρει
  choice: 一同欢喜
  rationale: 表达因该肢体所得尊荣而共同欢喜，保留复合动词的共同参与含义。
theological_decisions:
- issue: 教会身体比喻中δοξάζεται的含义
  choice: 得尊荣
  alternative: 得荣耀
  rationale: 上下文强调各肢体彼此关顾、共同回应，因此社会关系层面的“得尊荣”最切合；脚注保留较贴近该词常见宗教用语的“得荣耀”，避免消除原词可能具有的语义张力。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“身体的一个肢体”在首句明示身体比喻，随后沿用“肢体”。两分句结构对称，以“一同受苦／一同欢喜”突出全体成员的共同经历。脚注标记置于实际涉及词义选择的“得尊荣”之后。
