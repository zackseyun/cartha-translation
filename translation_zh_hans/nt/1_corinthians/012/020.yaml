  text: νῦν δὲ πολλὰ ⸀μὲν μέλη, ἓν δὲ σῶμα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/020.yaml
  text: But as it is[a], there are many parts, yet one body.
translation:
  language: zh_hans
  text: 但事实上，部分[a]虽多，身体却是一个。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “部分”也可译作“肢体”。
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν δὲ
  choice: 但事实上
  rationale: 这里的 νῦν 并非主要表示时间上的“现在”，而是承接并转折于上一节的假设，指出实际情形；“但事实上”自然表达这一论证关系。
- source_word: πολλὰ ... μέλη
  choice: 部分虽多
  rationale: μέλη 在身体比喻中指组成身体的各个部分。“部分”在现代汉语中清楚自然，也避免“成员”所带来的组织用语色彩；用“虽多”体现 μὲν 所开启的对照。
- source_word: ἓν δὲ σῶμα
  choice: 身体却是一个
  rationale: 保留“一”与“多”的鲜明对照，并以“却”体现 δὲ 与前半句相平衡的转折。σῶμα 直译为“身体”，保留保罗贯穿上下文的比喻。
theological_decisions:
- issue: 身体比喻中 μέλη 的译法
  choice: 部分
  alternative: 肢体
  rationale: “部分”能涵盖身体的各种组成部分，现代读者容易理解，也不预先把比喻解释成教会成员关系；“肢体”是传统且合乎语境的译法，因此列入脚注。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“部分虽多，身体却是一个”保留原文多与一之间的平衡和张力。
