  text: ἵνα μὴ ᾖ ⸀σχίσμα ἐν τῷ σώματι, ἀλλὰ τὸ αὐτὸ ὑπὲρ ἀλλήλων μεριμνῶσι τὰ μέλη.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/025.yaml
  text: so that there may be no division in the body[b][a], but that the members may have the same concern for one another.
translation:
  language: zh_hans
  text: 为使身体不致有分裂[a]，而使各肢体彼此同样地关怀[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “分裂”也可译为“裂痕”或“分开”；原文词语可指撕裂、裂口或分裂，这里指身体内部的分裂。
    reason: lexical_alternative
  - marker: b
    text: 也可译为“彼此同等地关怀”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα μὴ ᾖ
  choice: 为使……不至于
  rationale: ἵνα引出目的或结果；结合否定词μή和系词ᾖ，译为“为使……不至于”，既保留目的意味，也符合现代汉语表达。
- source_word: σχίσμα
  choice: 分裂
  rationale: 该词可指撕裂、裂缝或群体内部的分争；“分裂”既能呼应身体可能被撕裂的比喻，也不会引入后世教会制度中的专门术语。
- source_word: ἐν τῷ σώματι
  choice: 身体
  rationale: 直译保留保罗贯穿上下文的身体比喻；在语境中也指向作为一个整体的教会。
- source_word: ἀλλὰ
  choice: 反而
  rationale: 表达与“不至于分裂”相对的正面目的；“反而”在汉语中清楚呈现转折。
- source_word: τὸ αὐτό
  choice: 同样
  rationale: 中性单数短语在此与μεριμνῶσι连用，表示肢体之间怀有相同或不偏不倚的关切；译成副词“同样”自然，并保留其可能指同等关怀的含义。
- source_word: ὑπὲρ ἀλλήλων
  choice: 彼此
  rationale: ὑπέρ在这里表示关怀所指向的对象，并非替代关系；ἀλλήλων表达相互性，合译为“彼此”简洁自然。
- source_word: μεριμνῶσι
  choice: 关怀
  rationale: 该动词可表示挂虑、关心或照料；这里是积极的相互关切，不是负面的焦虑，因此用“关怀”。
- source_word: τὰ μέλη
  choice: 各个肢体
  rationale: μέλη在身体比喻中指身体的各部分，同时映射群体中的成员；“各个肢体”直接保留比喻，也清楚表达复数。
theological_decisions:
- issue: σχίσμα在教会身体比喻中的译法
  choice: 分裂
  alternative: 分争；裂痕
  rationale: “分裂”保留群体内部破裂和身体被撕裂的双重意象，又避免把该词处理成后世技术性的宗派术语。
- issue: τὸ αὐτό所表达的是相同关怀还是同等关怀
  choice: 在正文译作“同样关怀”，脚注说明也可理解为“同等地彼此关怀”
  alternative: 怀有同一份关切
  rationale: 原文强调τὸ αὐτό，但没有明确说明是关怀内容相同还是程度上不偏待；正文保持简练，脚注保留这一真实语义幅度。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。保留“身体—肢体”的核心比喻；用“关怀”表达积极的相互顾念，避免“忧虑”可能带来的负面含义。脚注标记按正文出现顺序排列。
