  naturalness: 修订后的“没有一个靠着上帝的灵说话的人会说”虽较庄重，结构清楚且符合现代书面普通话；“耶稣是受咒诅的”比“可咒诅的”自然，也避免后者可能表示“能够被咒诅”。
  terminology: 保留“上帝的灵”“圣灵”及“主”。“靠着”在两处保持对应，既不把ἐν机械限缩为空间意义，也不把圣灵的作用具体化为某一种心理经验。
