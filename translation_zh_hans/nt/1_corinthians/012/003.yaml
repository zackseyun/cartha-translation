revisions:
- from: 所以，我要让你们知道：没有人受上帝的灵感动而说[a]：“耶稣是可咒诅的”；也没有人能说[b]：“耶稣是主”，除非受圣灵感动。
  to: 因此，我告诉你们：没有一个靠着上帝的灵说话的人会说[a]：“耶稣是受咒诅的”；也没有人能说[b]：“耶稣是主”，除非靠着圣灵。
  rationale: 将“受……感动”统一修订为“靠着……”，以更贴近ἐν πνεύματι在本句中与发言和宣认相连的表达，同时不规定其作用机制。将“可咒诅的”修订为“受咒诅的”，并保留脚注所提示的断言与咒诅性语气之间的歧义。其余逻辑关系、基督称号及脚注锚点均予保留。
