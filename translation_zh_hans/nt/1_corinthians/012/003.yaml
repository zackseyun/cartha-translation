  text: διὸ γνωρίζω ὑμῖν ὅτι οὐδεὶς ἐν πνεύματι θεοῦ λαλῶν λέγει· Ἀνάθεμα ⸀Ἰησοῦς, καὶ οὐδεὶς δύναται εἰπεῖν· ⸂Κύριος Ἰησοῦς⸃ εἰ μὴ ἐν πνεύματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/003.yaml
  text: Therefore I make known to you that no one speaking by the Spirit of God says[a], “Jesus is accursed,” and no one is able to say[b], “Jesus is Lord,” except by the Holy Spirit.
translation:
  language: zh_hans
  text: 因此，我告诉你们：没有一个靠着上帝的灵说话的人会说[a]：“耶稣是受咒诅的”；也没有人能说[b]：“耶稣是主”，除非靠着圣灵。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“耶稣当受咒诅。”希腊原文是没有系词的强烈短句，既可理解为断言，也可带有咒诅性的语气。
    reason: lexical_alternative
  - marker: b
    text: 希腊原文按字面为“主，耶稣”；在这里是宣认：“耶稣是主。”
    reason: lexical_alternative
lexical_decisions:
- source_word: διό
  choice: 所以
  rationale: 承接上文并引出推论；“所以”在现代汉语中自然清楚。
- source_word: γνωρίζω ὑμῖν
  choice: 我要让你们知道
  rationale: 表达“使你们知道”的使动意义；“要”使汉语表达自然，但不将其强化为特殊意愿。
- source_word: ἐν πνεύματι θεοῦ λαλῶν
  choice: 受上帝的灵感动而说
  rationale: ἐν可表示在圣灵的作用或范围之中；此译清楚表达属灵推动，同时不使用容易被误解为空间意义的“在……里面”。
- source_word: Ἀνάθεμα Ἰησοῦς
  choice: 耶稣是可咒诅的
  rationale: 原文是无系词的呼喊或断言；补出“是”符合汉语，并保留ἀνάθεμα所含被交付咒诅的强烈含义。
- source_word: δύναται εἰπεῖν
  choice: 能说
  rationale: 直接保留能力或可能性的意义，现代汉语简洁自然。
- source_word: Κύριος Ἰησοῦς
  choice: 耶稣是主
  rationale: 原文按字序为“主—耶稣”，在引述内容中具有宣认性质；汉语补出系词并调整语序，以明确表达宣认。
- source_word: εἰ μὴ ἐν πνεύματι ἁγίῳ
  choice: 除非受圣灵感动
  rationale: εἰ μή标明唯一例外；与前半句保持对应，并传达圣灵的作用而不限定其具体机制。
theological_decisions:
- issue: Κύριος Ἰησοῦς中κύριος的译法
  choice: 主
  alternative: 主人
  rationale: “主”既保留通常的权柄称谓，也承载保罗语境中的基督论分量，而不在译文中额外界定其全部神学含义。
- issue: “除非受圣灵感动”所表达的属灵能力
  choice: 保留经文所述的圣灵作用，不进一步限定为单纯发声、真诚信仰告白或完整的重生教义
  alternative: 明确译作“若不是真心被圣灵感动，就不能承认”
  rationale: 原文把宣认耶稣为主与圣灵联系起来，却未在本句明说“真心”、重生过程或其他系统性解释；译文应保留这一张力。
- issue: ἐν πνεύματι的语义
  choice: 译作“受……感动”
  alternative: 译作“在……里”或“借着……”
  rationale: 这里既可涉及媒介，也可涉及受圣灵支配的状态；“受……感动”在现代汉语中兼顾发言的属灵来源和状态，但脚注提示其可能范围。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“上帝的灵”与“圣灵”分别对应原文πνεύματι θεοῦ和πνεύματι ἁγίῳ；两处ἐν πνεύματι均译为“受……感动”，形成结构对应。所有脚注标记均已置于正文相应位置。
