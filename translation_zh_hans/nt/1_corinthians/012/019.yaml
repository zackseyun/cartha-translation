  text: 如果全都是一个肢体，身体在哪里呢？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ
  choice: 如果
  rationale: 引出假设条件，现代汉语用“如果”自然准确。
- source_word: δὲ
  choice: 不单独译出
  rationale: 此处是轻微的承接或对比连接词；上下文和条件句本身已能清楚表达转折，汉语省译更自然。
- source_word: ἦν
  choice: 只是
  rationale: 希腊语未完成时在此构成假设；汉语没有对应的虚拟语气形态，以“如果……只是……”表达这一假设关系。
- source_word: τὰ πάντα
  choice: 全体
  rationale: 这里指身体各部分合在一起，并非抽象的“万物”；“全体”既体现整体范围，也适合身体比喻。
- source_word: ἓν μέλος
  choice: 一个肢体
  rationale: μέλος在身体比喻中指身体的组成部分；“肢体”保留保罗在本段反复使用的身体意象，也可自然延伸至群体成员。
- source_word: ποῦ
  choice: 在哪里呢
  rationale: 保留原文以“哪里”发出的反问，并用句末“呢”传达其修辞语气，不改写为解释性的结果句。
- source_word: τὸ σῶμα
  choice: 身体
  rationale: 直接保留原文的身体比喻，不在本节擅自增添“基督的”或“教会”等限定。
theological_decisions:
- issue: 身体比喻的指涉范围
  choice: 仅译作“身体”，以反问说明一个身体必须具有不同肢体。
  alternative: 明确译作“基督的身体”或“教会”。
  rationale: 虽然上下文把信徒群体比作基督的身体，本节原文本身只说“身体”；保留这一措辞可避免把上下文解释加入正文。
- issue: τὰ πάντα的集合意义
  choice: 译作“全体”，指各肢体合起来的整体。
  alternative: 译作“一切”或“所有东西”。
  rationale: 本段讨论众多肢体与一个身体的关系；“全体”保留集合意义，同时不把原文改写成“所有肢体”，从而避免不必要的明说。
translation_notes:
  register: 采用现代、简洁而庄重的普通话。句式保留原文条件句和反问结构；“肢体”与本段身体比喻一致，且不加入宗派性解释。
