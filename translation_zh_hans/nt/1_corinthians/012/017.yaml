  text: εἰ ὅλον τὸ σῶμα ὀφθαλμός, ποῦ ἡ ἀκοή; εἰ ὅλον ἀκοή, ποῦ ἡ ὄσφρησις;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/017.yaml
  text: If the whole body were an eye[a], where would the hearing be? If the whole were hearing, where would the sense of smell be?
translation:
  language: zh_hans
  text: 如果整个身体都是眼睛[a]，听觉在哪里呢？如果整个身体都是听觉，嗅觉在哪里呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或按器官意象译：“耳朵在哪里呢？……鼻子在哪里呢？”希腊原文所用的是表示听觉和嗅觉的词，较贴近感官功能，而非器官名称。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅλον τὸ σῶμα
  choice: 整个身体
  rationale: 直接表达全体身体，并保留保罗所设想的整个身体只有一种肢体或功能的反常图景。
- source_word: ὀφθαλμός
  choice: 眼睛
  rationale: 采用通常的身体部位名称，保留单数意象；汉语作表语时无需冠词。
- source_word: ποῦ
  choice: 在哪里呢？
  rationale: 希腊文直问“在哪里”；在两个假设条件之后，现代汉语可自然承载“那又会在哪里”的条件含义，“呢”也保留反问语气。
- source_word: ἀκοή
  choice: 听觉
  rationale: 该词在此指听的能力而非耳朵这一器官；“听觉”既准确又能在两个分句中自然使用。
- source_word: ὅλον
  choice: 整个身体
  rationale: 原文第二句省略了“身体”，但汉语若仅说“整个都是听觉”较不自然；补出已知名词使句意清楚，不改变所指。
- source_word: ὄσφρησις
  choice: 嗅觉
  rationale: 该名词表示闻气味的能力；“嗅觉”准确对应感官功能，并与“听觉”形成平行。
theological_decisions:
- issue: 身体比喻应按感官功能还是身体器官表达
  choice: 将 ἀκοή 和 ὄσφρησις 译为感官功能“听觉”和“嗅觉”。
  alternative: 译作身体器官：“耳朵在哪里呢？……鼻子在哪里呢？”
  rationale: 希腊原文使用的是听和闻的能力名称，而不是“耳朵”和“鼻子”的解剖学名称。保留功能性措辞更贴近原文，也避免将比喻具体化到原文没有明说的程度。
translation_notes:
  register: 采用现代、自然而庄重的普通话。“整个身体都是……”清楚呈现假设，“听觉／嗅觉”保留原文感官功能的表达；脚注提供较具象、较口语化的器官译法。
