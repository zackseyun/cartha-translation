  text: ἀλλὰ πολλῷ μᾶλλον τὰ δοκοῦντα μέλη τοῦ σώματος ἀσθενέστερα ὑπάρχειν ἀναγκαῖά ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/022.yaml
  text: On the contrary[a], the parts of the body that seem to be weaker are necessary[c][b],
translation:
  language: zh_hans
  text: 恰恰相反，身体上那些看起来比较软弱的肢体，更是必不可少的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ πολλῷ μᾶλλον
  choice: 恰恰相反……更是
  rationale: ἀλλά承接上文形成强烈转折，πολλῷ μᾶλλον带有明确的加强语气；用“恰恰相反……更是”既自然，也保留“更何况／更为如此”的强调作用。
- source_word: τὰ δοκοῦντα
  choice: 那些看起来
  rationale: δοκέω在此指表象或人的判断，并不确认这些肢体实际上软弱；“看起来”保留了这一差别。
- source_word: μέλη τοῦ σώματος
  choice: 身体上……的肢体
  rationale: μέλη在身体比喻中指身体的各个肢体或部分；“肢体”既保持具体的身体意象，也能与上下文中群体成员的比喻意义相呼应。
- source_word: ἀσθενέστερα ὑπάρχειν
  choice: 比较软弱
  rationale: ἀσθενέστερα是比较级，表示相对而言更弱；“比较软弱”以自然汉语表达比较意义，同时与“看起来”共同修饰对这些肢体的观感。
- source_word: ἀναγκαῖά ἐστιν
  choice: 必不可少
  rationale: ἀναγκαῖος表示必要、不可缺少；“必不可少”在现代汉语中自然有力，并准确传达这些肢体不可缺失的意思。
theological_decisions:
- issue: 身体意象在教会语境中的比喻作用
  choice: 保留“身体”和“肢体”的具体意象，不在本节内直接改写为教会成员
  alternative: 把“肢体”解释性地译作“成员”或“信徒”
  rationale: 上下文将身体比作群体，但本节原文仍直接谈身体的肢体。保留原有比喻可避免把解释写进经文，并让读者从上下文领会其群体含义。
- issue: 所谓软弱是实际状态还是人的观感
  choice: 译作“看起来比较软弱”
  alternative: 译作“比较软弱”
  rationale: 原文δοκοῦντα明确标示“看来／似乎”，因此不应断言这些肢体本质上确实软弱。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“恰恰相反……更是”清楚呈现原文的强转折与加强语气；“肢体”保留保罗的身体比喻，并避免“部分”可能带来的抽象感。
