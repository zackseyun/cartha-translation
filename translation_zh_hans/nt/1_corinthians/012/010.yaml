  text: ⸀ἄλλῳ ἐνεργήματα δυνάμεων, ⸁ἄλλῳ προφητεία, ⸀1ἄλλῳ διακρίσεις πνευμάτων, ⸀ἑτέρῳ γένη γλωσσῶν, ⸀2ἄλλῳ ἑρμηνεία γλωσσῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/010.yaml
  text: to another[a], workings of miracles; to another, prophecy; to another, discernments of spirits; to another, kinds of tongues; to another[b], interpretation of tongues.
translation:
  language: zh_hans
  text: 又给另一人行异能[a]，给另一人说预言，给另一人辨别诸灵，给另一人说各种方言[b]，又给另一人翻译方言。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“各样能力的运行”或“大能作为的运作”。
    reason: lexical_alternative
  - marker: b
    text: “方言”也可译作“语言”；相应地，“翻译方言”也可译作“翻译语言”。希腊词既可指方言，也可指语言；正文保留“方言”，以免在保罗关于属灵恩赐的论述中预先断定其具体性质。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐνεργήματα δυνάμεων
  choice: 施行异能
  rationale: ἐνεργήματα 指实际的运行、作用或成效，δυνάμεων 在本段属灵恩赐的语境中通常指大能的作为，即神迹奇事。“施行异能”在现代汉语中简洁自然，也保留行动性的含义；较直译的可能译法列入脚注。
- source_word: προφητεία
  choice: 说预言
  rationale: 这里列举的是圣灵所赐的具体表现。“说预言”比单独使用抽象名词“预言”更符合汉语句法，同时不把其内容限定为预告未来。
- source_word: διακρίσεις πνευμάτων
  choice: 辨别诸灵
  rationale: διακρίσεις 是复数，表示辨别、分辨或评断的活动；πνευμάτων 也为复数。“辨别诸灵”保持所辨别对象的宽泛性，不擅自限定为善灵、邪灵、人的灵或话语背后的灵。
- source_word: γένη γλωσσῶν
  choice: 各种方言
  rationale: γένη 表示种类，γλωσσῶν 可指舌头、语言，也用于哥林多前书所谈的“方言”恩赐。“各种方言”是中文圣经语境中自然且熟悉的说法，同时以脚注保留“各种语言”的可能。
- source_word: ἑρμηνεία γλωσσῶν
  choice: 翻译方言
  rationale: ἑρμηνεία 指把内容传达得可以理解，可表示解释或翻译。此处与 γλωσσῶν 搭配，“翻译方言”清楚表达其功能，而不进一步界定这种言语现象。
- source_word: ἄλλῳ / ἑτέρῳ
  choice: 给另一人
  rationale: 重复的与格结构表达圣灵把不同恩赐分给不同的人。两词在此都译为“给另一人”，使中文连贯；不把 ἑτέρῳ 与 ἄλλῳ 的措辞变化夸大为明确的语义对立。
theological_decisions:
- issue: δυνάμεων 在属灵恩赐清单中的含义
  choice: 译作“异能”
  alternative: “能力”或“大能的作为”
  rationale: 在保罗书信中，复数 δυνάμεις 在类似语境常指大能的作为或神迹。“异能”传达其很可能的所指，却不引入关于神迹恩赐是否延续等教派立场。
- issue: γλωσσῶν 的含义
  choice: 正文译作“方言”
  alternative: “语言”
  rationale: 希腊词可以泛指语言，在本段也可能具有属灵恩赐语境中的专门用法。正文采用现代中文教会语境中通行的“方言”，脚注同时保留“语言”，避免断定它必然是已知人类语言或非人类的灵 ecstatic speech。
- issue: πνευμάτων 在“辨别诸灵”中的所指
  choice: 保留为宽泛的“诸灵”
  alternative: “属灵言论”“言论背后的灵”“人的灵”或“邪灵”
  rationale: 原文没有具体说明这些“灵”属于哪一类。译文不补入解释，以保留原文的神学张力和指称范围。
- issue: προφητεία 的范围
  choice: 译作“说预言”而不另加说明
  alternative: “传讲神的信息”或“预告未来”
  rationale: προφητεία 可以涉及受感而说话，但本节没有限定其内容。采用传统而自然的“说预言”，既不把它缩窄为预测未来，也不将某一解释直接写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。以“给另一人……”反复呈现原文分配恩赐的平行结构；在汉语需要处加入“说”“施行”等动词，使清单自然流畅。正文保持“诸灵”和“方言”的歧义，不加入宗派性解释。
