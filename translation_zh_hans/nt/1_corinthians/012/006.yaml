  text: καὶ διαιρέσεις ἐνεργημάτων εἰσίν, ⸂ὁ δὲ⸃ ⸀αὐτὸς θεός, ὁ ἐνεργῶν τὰ πάντα ἐν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/006.yaml
  text: And there are varieties of workings[b][a], but it is the same God who works all things in all people.
translation:
  language: zh_hans
  text: 各样功用也有不同[a]；但同一位上帝在众人里面成就万事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在众人里面”原文直译为“在所有人中”或“在众人里面”。原文没有明确说明所指的具体群体；按上下文，通常理解为上帝在共同体的众成员中成就这些工作。
    reason: lexical_alternative
lexical_decisions:
- source_word: διαιρέσεις
  choice: 各种……虽有不同
  rationale: 表达同一共同体中有不同类别和表现，而不暗示分裂或冲突；与本段4—6节“多样而同源”的结构相称。
- source_word: ἐνεργημάτων
  choice: 功用
  rationale: 指活动所产生的作用或表现；“功用”在现代中文中简洁自然，也能与后文“成就”共同呈现ἐνεργ-词根所强调的实际运作。
- source_word: ὁ δὲ αὐτὸς θεός
  choice: 却是同一位上帝
  rationale: δέ表示温和的转折：功用各异，源头却相同。“同一位”保留αὐτός所强调的同一性。
- source_word: ὁ ἐνεργῶν
  choice: 成就
  rationale: 在中文中自然表达上帝主动使各样功用发生并产生果效；其现在时分词的一般、持续意义由整句陈述体现。
- source_word: τὰ πάντα
  choice: 这一切
  rationale: 结合上下文，主要指前述各样属灵功用；“这一切”仍保留整体涵盖性，同时避免脱离语境而被理解为毫无限定的宇宙性命题。
- source_word: ἐν πᾶσιν
  choice: 在众人里面
  rationale: 希腊文没有明说名词，但复数形式和教会肢体的上下文自然指众成员；正文作明确而自然的中文表达，脚注保留原文省略名词的特点。
theological_decisions:
- issue: τὰ πάντα ἐν πᾶσιν所指上帝工作的范围
  choice: 译作“在众人里面成就这一切”，在正文中按上下文指向教会众成员及各样功用。
  alternative: “在一切里面成就一切”或“在所有人里面成就一切”
  rationale: 原文措辞宽广，却处于属灵恩赐和共同体成员的语境中。译文不把上帝的工作缩减为某一种恩赐，也不把本句扩展成脱离上下文的绝对命题；脚注保留原文未明说对象的歧义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“各种功用虽有不同”与前两节的平行句式协调；“上帝”遵循中性、通行的现代中文圣经用语。
