source:
  edition: SBLGNT
  text: καὶ γὰρ ἐν ἑνὶ πνεύματι ἡμεῖς πάντες εἰς ἓν σῶμα ἐβαπτίσθημεν, εἴτε Ἰουδαῖοι εἴτε Ἕλληνες, εἴτε δοῦλοι εἴτε ἐλεύθεροι, καὶ ⸀πάντες ἓν πνεῦμα ἐποτίσθημεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/013.yaml
  text: For indeed[a], in one Spirit we all were baptized into one body—whether Jews or Greeks[c][b], whether slaves or free—and we all were given to drink one Spirit.
translation:
  language: zh_hans
  text: 因为我们众人都在同一位圣灵里受了洗，归入一个身体；无论是犹太人还是希腊人，无论是奴隶还是自由人，我们全都得以饮用同一位圣灵。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在同一位圣灵里”也可译作“借着同一位圣灵”；希腊文可表示所处的范围，也可表示凭借或施行者。末句也可译作“我们全都被赐给同一位圣灵饮用”。希腊文不以大小写区分“灵”和“圣灵”；虽然上下文强烈指向圣灵，“一个灵”也是一种可能的理解。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ἑνὶ πνεύματι
  choice: 在同一位圣灵里
  rationale: ἐν加与格可表示范围，也可表示工具或施事者。“在……里”贴近希腊语形式，并保留圣灵是受洗的范围还是施事者这一真实歧义；“一位”表明此处指圣灵。
- source_word: ἐβαπτίσθημεν
  choice: 受了洗
  rationale: 这是保罗教会语境中βαπτίζω的标准译法；不译作“浸入”，以免额外强调原文在此未明确说明的施洗方式。
- source_word: εἰς ἓν σῶμα
  choice: 归入一个身体
  rationale: “归入”自然表达εἰς所含的进入和归属结果，同时保留保罗关于一个身体的意象。
- source_word: Ἰουδαῖοι ... Ἕλληνες
  choice: 犹太人……希腊人
  rationale: 保留原文具体的族群称谓及其对举，不将“希腊人”泛化为“外邦人”。
- source_word: δοῦλοι ... ἐλεύθεροι
  choice: 奴隶……自由人
  rationale: 此处明确对比受奴役与自由的社会身份，“奴隶”比“仆人”准确，“自由人”则自然传达相反身份。
- source_word: ἐποτίσθημεν
  choice: 得以饮于
  rationale: 保留ποτίζω被动式“被给饮、得以喝”的含义和共同领受的饮用隐喻，同时使现代汉语流畅。
- source_word: καὶ γὰρ
  choice: 的确
  rationale: 在上下文中以自然汉语传达解释兼强调的语气；汉语无需机械叠加“因为”和“的确”。
- source_word: ἡμεῖς πάντες / πάντες
  choice: 我们众人 / 都
  rationale: 分别保留首句显著的集合强调和末句再次出现的“全都”之意。
theological_decisions:
- issue: ἐν ἑνὶ πνεύματι表示范围还是工具、施事
  choice: 在同一位圣灵里
  alternative: 借着同一位圣灵
  rationale: 希腊语ἐν允许两种理解。正文采用较贴近形式且不强行定论的“在……里”，脚注保留工具或施事义，避免把有争议的圣灵之洗解释固定化。
- issue: 第二处ἓν πνεῦμα是圣灵还是共同的属灵实在
  choice: 同一位圣灵
  alternative: 同一个灵
  rationale: 紧邻上下文反复谈到圣灵的工作，最自然的所指是圣灵；不过希腊文自身不以大小写区分，脚注说明较弱的另一可能。
- issue: 饮用隐喻中ἓν πνεῦμα的句法关系
  choice: 都得以饮于同一位圣灵
  alternative: 都蒙赐同一位圣灵作为饮品
  rationale: 正文将圣灵理解为共同饮用、参与的对象，并保留隐喻；脚注列出较明说“蒙赐……喝”的句法表达。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“归入一个身体”比直译“进入一个身体”更自然，也保留群体归属意象；“饮于”略带书面色彩，用来维持原文饮用隐喻的庄重与简洁。
