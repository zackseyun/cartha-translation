id: 1CO.12.21
reference: 1 Corinthians 12:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οὐ δύναται δὲ ὁ ὀφθαλμὸς εἰπεῖν τῇ χειρί· Χρείαν σου οὐκ ἔχω, ἢ πάλιν ἡ κεφαλὴ τοῖς ποσίν· Χρείαν ὑμῶν οὐκ ἔχω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/021.yaml
  text: But the eye cannot say to the hand[a], ‘I have no need of you,’ or again the head to the feet, ‘I have no need of you.’
translation:
  language: zh_hans
  text: 但眼睛不能对手说：“我不需要你”；头也不能对脚说：“我不需要你们。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ δύναται
  choice: 不能
  rationale: 自然表达否定的能力或可能性，保留“不可能如此”的语义，而不弱化为“不应该”。
- source_word: δὲ
  choice: 但
  rationale: 承接上文身体各部分彼此依存的论述，表达转折。
- source_word: ὁ ὀφθαλμός
  choice: 眼睛
  rationale: 保留保罗身体比喻中的具体器官形象。
- source_word: εἰπεῖν τῇ χειρί
  choice: 对手说
  rationale: 以现代汉语自然表达间接宾语，同时保留身体部位意象。
- source_word: Χρείαν σου οὐκ ἔχω
  choice: 我不需要你
  rationale: 准确、自然地表达“我没有对你的需要”；比“你对我没有用”更贴近原文，也避免加强轻蔑语气。
- source_word: ἢ πάλιν
  choice: 也
  rationale: 这里引出第二个同类例子；汉语用并列式“也不能”比直译“或者再者”更自然，并保留类比关系。
- source_word: ἡ κεφαλὴ τοῖς ποσίν
  choice: 头也不能对脚说
  rationale: 原文第二分句省略了“不能说”，汉语补出后句法完整清楚；“头”和“脚”保留身体比喻。
- source_word: ὑμῶν
  choice: 你们
  rationale: 明确保留希腊文第二人称复数，与前句指向单数“手”的 σου 形成区别。
theological_decisions:
- issue: 身体各部分所表达的教会成员彼此依存
  choice: 正文只保留身体部位的比喻，不直接释为教会成员
  alternative: 在正文中说明眼、手、头、脚代表教会中的成员
  rationale: 原文以身体比喻本身承载神学意义；直接解释会把翻译扩展为注释。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“我不需要你／你们”简洁有力；第二句补出原文省略而汉语语意所需的“不能对……说”。由于“你们”已经清楚呈现 ὑμῶν 的复数，本节无需脚注。
