  text: Περὶ δὲ τῶν πνευματικῶν, ἀδελφοί, οὐ θέλω ὑμᾶς ἀγνοεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/001.yaml
  text: Concerning spiritual gifts, brothers, I do not want you to be uninformed.
translation:
  language: zh_hans
  text: 弟兄们[b]，关于属灵的恩赐[a]，我不愿你们不了解。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“属灵的事”。希腊原文的含义比“恩赐”更宽，不过本章的语境主要谈圣灵所赐的恩赐。
    reason: alternative_reading
  - marker: b
    text: “弟兄们”是保罗对会众的称呼，这里很可能也包括女性。
    reason: cultural_note
lexical_decisions:
- source_word: Περὶ δὲ
  choice: 关于
  rationale: περί引出所谈论的新主题，译作“关于”自然准确；δέ在此仅有轻微的转题作用，现代汉语无需另加“现在”或其他时间词。
- source_word: τῶν πνευματικῶν
  choice: 属灵的恩赐
  rationale: 这是名词化的形容词，原文未明确说出所修饰的名词，可泛指“属灵的事”，也可能指“属灵的人”。但本章下文集中讨论圣灵所赐的恩赐及彰显，因此正文采用“属灵的恩赐”；原文较宽的表达保留在脚注中。
- source_word: ἀδελφοί
  choice: 弟兄们
  rationale: 保留希腊文阳性复数呼语的形式。保罗以此称呼会众时通常包括女性，相关语用信息在脚注中说明。
- source_word: οὐ θέλω ὑμᾶς ἀγνοεῖν
  choice: 我不愿你们不了解
  rationale: 这是保罗常用的引入教导的表达，意思是不愿读者不知道或不明白某事。“不了解”符合现代汉语，又避免“一无所知”可能带来的过强语气。
theological_decisions:
- issue: τῶν πνευματικῶν所指为何
  choice: 正文译作“属灵的恩赐”
  alternative: “属灵的事”；较不可能为“属灵的人”
  rationale: 希腊文表达本身省略中心名词，确有歧义；不过12:4—11谈到圣灵所赐的各样恩赐和彰显，因而“属灵的恩赐”最合乎紧接的语境。脚注保留较宽泛的可能，不把原文的张力完全消除。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“关于”简洁地引出新话题；“我不愿你们不了解”自然表达保罗希望会众获得必要认识的语气。脚注标记均紧随相关词语。
