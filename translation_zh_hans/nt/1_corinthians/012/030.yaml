  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: μὴ πάντες χαρίσματα ἔχουσιν ἰαμάτων; μὴ πάντες γλώσσαις λαλοῦσιν; μὴ πάντες διερμηνεύουσιν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/030.yaml
  text: Not all have gifts of healings[a], do they? Not all speak in tongues, do they? Not all interpret[b], do they?
translation:
  language: zh_hans
  text: 难道人人都有医治的恩赐[a]吗？难道人人都说方言[b]吗？难道人人都翻译方言吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“医治的众恩赐”。希腊原文的“恩赐”和“医治”都是复数。
    reason: lexical_alternative
  - marker: b
    text: 或译“说别种语言”。本段语境中的这个词通常称为“方言”。
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ πάντες
  choice: 难道人人都……吗？
  rationale: μή引导的修辞问句预期否定回答。“难道人人都……吗？”既符合现代汉语习惯，也保留保罗强调恩赐并非人人相同的语气。
- source_word: χαρίσματα ἰαμάτων
  choice: 医治的恩赐
  rationale: χαρίσματα指由恩典而来的赐予，译作“恩赐”；ἰαμάτων为复数，中文名词通常不以形态标示单复数，因此在脚注说明原文形式，正文保持自然。
- source_word: γλώσσαις λαλοῦσιν
  choice: 说方言
  rationale: 在哥林多前书12—14章的语境中，γλῶσσα指通常称为“方言”的属灵现象；λαλοῦσιν为表达一般情形的现在时，译作“说”。“别种语言”在词义上也有可能，故列入脚注。
- source_word: διερμηνεύουσιν
  choice: 翻译方言
  rationale: 此处指把方言内容转达为会众能够明白的话。“翻译方言”在现代汉语中清楚自然，并依据紧接的上句补出隐含宾语。
theological_decisions:
- issue: μή所引导修辞问句的性质
  choice: 译成预期否定回答的“难道人人都……吗？”
  alternative: 译成不暗示预期答案的普通疑问句“人人都……吗？”
  rationale: 希腊语句法表明预期答案为否定；如此翻译保留本段关于同一身体中恩赐多样性的重点，而不暗示人人拥有每一种恩赐。
- issue: διερμηνεύουσιν的隐含对象
  choice: 依据平行结构译作“翻译方言”
  alternative: 只译作“翻译”或“解释”
  rationale: 原文没有明说宾语，但紧邻的γλώσσαις清楚提供语境。补出“方言”使中文完整易懂，并未界定这种现象的具体性质。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。三个平行问句均以“难道人人都……吗”呈现，保留原文的节奏和预期否定的修辞力量；避免用生硬的复数形式破坏中文表达，并以脚注交代原文形态。
