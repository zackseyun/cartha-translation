  text: ἑκάστῳ δὲ δίδοται ἡ φανέρωσις τοῦ πνεύματος πρὸς τὸ συμφέρον.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/007.yaml
  text: But to each one the manifestation of the Spirit is given for the common good[a].
translation:
  language: zh_hans
  text: 但圣灵的彰显赐给每一个人，是为使众人得益处[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“为着有益之事”或“为着众人的益处”。原文也可泛指“为了有益、有利”；在本章语境中，很可能着重整个群体共同所得的益处。
    reason: 原文πρὸς τὸ συμφέρον可指有益或有利之事；“众人的益处”反映本章的群体语境，但并非该短语唯一可能的字面范围。
lexical_decisions:
- source_word: ἑκάστῳ
  choice: 各人
  rationale: 保留单数形式的逐一分配意味，表明群体中的每一个人都领受圣灵的显明；“各人”简洁、自然。
- source_word: δὲ
  choice: 不过
  rationale: 在此表示轻微转折或话题推进。“不过”承接上文各种恩赐出于同一位圣灵的论述，又不把对比说得过强。
- source_word: δίδοται
  choice: 赐给
  rationale: 保留现在时被动语态及礼物由外而来的含义；“赐给”在现代中文中自然，也符合恩赐语境。
- source_word: φανέρωσις
  choice: 显明
  rationale: 该词指使某事成为可见、明显或可辨认的表现。“显明”既贴近原文，又能涵盖下文所列圣灵工作的不同表现。
- source_word: τοῦ πνεύματος
  choice: 圣灵的
  rationale: 本章上下文清楚指向同一位圣灵。中文若仅译“灵”，容易被理解为人的灵，因此采用“圣灵”明确所指，虽比本节孤立字面略为显明，却符合原文语境。
- source_word: πρὸς τὸ συμφέρον
  choice: 是为了使大家得益处
  rationale: 此结构表示趋向有益、有利的结果。结合全章身体与彼此配搭的语境，“使大家得益处”自然传达其共同指向，同时用脚注保留较一般的词义可能。
theological_decisions:
- issue: “灵”的所指
  choice: 译作“圣灵”，指上文和下文所说的同一位圣灵。
  alternative: 较字面地译作“灵”。
  rationale: 哥林多前书12章4、8—11节反复表明各种恩赐都来自同一位圣灵。中文没有英文大小写的区分，直译“灵”可能造成不必要的歧义，因此明确译为“圣灵”。
- issue: συμφέρον所指益处的范围
  choice: 译作“使大家得益处”，突出群体性的益处。
  alternative: 译作“为了有益处”或“为了有益的事”，保留一般性表达。
  rationale: 该词本身可泛指有益或有利之事，但本章以一个身体和肢体彼此相关为论述背景，群体性理解最切合语境；脚注仍保留原词较宽泛的可能。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“圣灵的显明”保留原文神学表达，“使大家得益处”则以自然中文呈现其群体指向。脚注标记[a]已置于正文相应位置。
