source:
  edition: SBLGNT
  text: καὶ ἃ δοκοῦμεν ἀτιμότερα εἶναι τοῦ σώματος, τούτοις τιμὴν περισσοτέραν περιτίθεμεν, καὶ τὰ ἀσχήμονα ἡμῶν εὐσχημοσύνην περισσοτέραν ἔχει,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/023.yaml
  text: and those parts of the body that we think to be less honorable[a], on these we bestow greater honor, and our unpresentable parts have greater decorum[b],
translation:
  language: zh_hans
  text: 身体上那些我们认为较不受尊重的部位，我们就格外尊重它们；我们不宜显露的部位，就更为雅观[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “更为雅观”也可译作“更为得体”或“更有体面”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἃ δοκοῦμεν
  choice: 那些我们认为……的
  rationale: δοκέω在此表示人的看法或判断，而非对这些部位作客观定性；“我们认为”自然地保留了这一层意思。
- source_word: ἀτιμότερα
  choice: 不太体面
  rationale: 这是ἄτιμος的比较级，与下文τιμή形成“较少体面—更多体面”的对照。“不太体面”既体现比较意味，也避免译成带有强烈道德谴责色彩的“不光彩”。
- source_word: τοῦ σώματος
  choice: 身体上……的部位
  rationale: 属格表明这些部位属于整个身体；补出“部位”符合汉语表达，同时保留本段核心的身体意象。
- source_word: τιμὴν περισσοτέραν περιτίθεμεν
  choice: 给它们更多的体面
  rationale: περιτίθημι本义为放置、披戴在某物之上，此处指人借着遮盖或装饰给予身体某些部位更多尊重。“给……更多的体面”兼顾该动作及τιμή的尊荣含义。
- source_word: τὰ ἀσχήμονα ἡμῶν
  choice: 我们不宜显露的部位
  rationale: ἀσχήμων指不合体统、不宜公开展示或不雅观之物；结合身体部位与遮盖的语境，“不宜显露”比“不道德”或“丑陋”更准确，也不作过度具体化。
- source_word: εὐσχημοσύνην περισσοτέραν ἔχει
  choice: 也就更显得端庄
  rationale: εὐσχημοσύνη表示合宜、雅观或得体的外观。“更显得端庄”在现代汉语中自然，并与前面的“不宜显露”构成清楚对照；“也就”表达这些部位因受到更多体面待遇而呈现的结果，但不超出上下文逻辑。
theological_decisions:
- issue: 身体比喻与群体中的尊荣
  choice: 保留具体的身体部位、显露和体面的语言
  alternative: 直接意译为教会中较弱或较少受尊重的成员应得到尊重
  rationale: 保罗先以真实身体各部位受不同待遇为比喻，再让读者理解其对基督身体的应用。译文不提前把比喻改写成教会论结论，使经文本身的推进与张力得以保留。
- issue: 所谓“不太体面”是否为客观价值判断
  choice: 以“我们认为”明确这是人的评价
  alternative: 译成“本来不体面”而视为客观事实
  rationale: ἃ δοκοῦμεν保留了主观判断的层面；这也避免暗示某些身体部位或某些群体成员本质上较无价值。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“部位”清楚呈现具体身体意象；“不宜显露”含蓄但不含混，适合公开诵读。“体面”前后呼应τιμή的尊荣语义，“端庄”则区分εὐσχημοσύνη所强调的合宜外观。
