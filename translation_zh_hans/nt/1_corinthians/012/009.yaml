  text: ⸀ἑτέρῳ πίστις ἐν τῷ αὐτῷ πνεύματι, ⸀ἄλλῳ χαρίσματα ἰαμάτων ἐν τῷ ⸀ἑνὶ πνεύματι,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/009.yaml
  text: to another[a], faith by the same Spirit; to another, gifts of healings by the one Spirit[b],
translation:
  language: zh_hans
  text: 又有一人，借着同一位圣灵得着信心[a]；另有一人，借着同一位圣灵得着医治的恩赐[b]；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “信心”也可译作“忠信”或“信靠”。
    reason: lexical_alternative
  - marker: b
    text: 原文“恩赐”和“医治”两个词都是复数。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑτέρῳ
  choice: 又有一人
  rationale: 承接上文的分配句式，表示恩赐赐给不同的人；现代汉语用“又有一人”自然清楚，不强行扩大ἕτερος与ἄλλος之间可能并不显著的差别。
- source_word: πίστις
  choice: 信心
  rationale: 这是πίστις在保罗书信中的常用对应词；本段语境表明它是圣灵所赐的恩赐，但经文本身没有进一步界定其具体表现，因此不在正文中加以限定。
- source_word: ἐν τῷ αὐτῷ πνεύματι
  choice: 借着同一位圣灵
  rationale: 此处ἐν可表达媒介或施行者；“借着”符合汉语习惯，并保留圣灵赐下恩赐的作用。“同一位”对应αὐτῷ，突出多样恩赐出于同一圣灵。
- source_word: ἄλλῳ
  choice: 另有一人
  rationale: 继续上文逐人分配恩赐的结构；“另有一人”自然表达与前一人有别，而不对ἄλλος与ἕτερος作过度区分。
- source_word: χαρίσματα
  choice: 种种恩赐
  rationale: χαρίσματα为复数。“种种”使中文读者可感知复数，同时“恩赐”保留其出于恩典、由圣灵赐予的语境意义。
- source_word: ἰαμάτων
  choice: 医治的
  rationale: ἰαμάτων为复数，指多种或多次医治；中文名词通常不作形态上的复数变化，故正文采用自然表达，并以脚注说明原文两个名词均为复数。
- source_word: ἐν τῷ ἑνὶ πνεύματι
  choice: 借着这一位圣灵
  rationale: “借着”表达ἐν在此处的媒介或施行作用；“这一位”对应ἑνὶ，保留原文由“同一”转为“一位”的措辞变化，并强调圣灵的合一性。
theological_decisions:
- issue: πίστις在圣灵恩赐语境中的含义
  choice: 信心
  alternative: 忠信；信靠
  rationale: “信心”最能承接保罗的一般用法，也不把本处预先限定为某一宗派所定义的特殊能力。由于πίστις亦可表示“忠信”或“信靠”，脚注保留这些词义可能性。
- issue: πνεύματι的所指
  choice: 圣灵
  alternative: 灵
  rationale: 哥林多前书12章的上下文明确将各样恩赐归于同一位圣灵；译作“圣灵”反映上下文所指，并未额外增添经文以外的主张。
- issue: χαρίσματα ἰαμάτων的双重复数
  choice: 医治的种种恩赐
  alternative: 医治的恩赐；各种医治的各种恩赐
  rationale: 正文以自然中文表达复数概念，同时不采用生硬的双重“各种”。脚注明说两个希腊语名词都是复数，以保留原文细节及其可能的解释空间。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留本节承接上文的分配式片段结构，并以分号对应两个并列分句。正文区分“同一位圣灵”和“这一位圣灵”，反映原文αὐτῷ与ἑνὶ的措辞变化；不加入对“信心”或“医治”之恩赐的宗派性解释。
