  yaml_path: translation/nt/1_corinthians/012/027.yaml
  text: You are the body of Messiah[c][b][a], and members individually.
translation:
  language: zh_hans
  text: 你们是基督的身体；你们各自都是其中的肢体。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “各自都是其中的肢体”也可译作“分别是肢体”。原文可直译为“肢体，按部分说”；在这里通常理解为：众人共同构成一个身体，每个人各是其中的肢体。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς
  choice: 你们
  rationale: 明示的第二人称复数代词，带有强调作用；现代汉语以“你们”自然指向哥林多信徒群体。
- source_word: δέ
  choice: 就是（不另译连接词）
  rationale: δέ在此主要标示从身体比喻转向对受众的直接应用。汉语不必机械加上“如今”或“但是”；用“就是”配合明示的“你们”自然呈现这一转折和确认。
- source_word: σῶμα Χριστοῦ
  choice: 基督的身体
  rationale: 在此谓语结构中，保罗把受众群体认定为基督的身体。“基督的身体”是现代汉语中自然、清楚且保留身体隐喻的表达。
- source_word: Χριστοῦ
  choice: 基督的
  rationale: Χριστός在中文圣经及现代基督教语境中惯常译作“基督”，本身即保留“受膏者”的称号性质；此处属格用“基督的”表达。
- source_word: μέλη
  choice: 肢体
  rationale: 在身体比喻中，μέλη指身体的各个部分。“肢体”既保持具体身体意象，也能自然表达群体中各成员的关系。
- source_word: ἐκ μέρους
  choice: 各自
  rationale: 此短语在上下文中具有分配意义，说明众人合为一个身体，而每个人各是其中的一个肢体；“各自”避免“部分地”可能引起的不完整之意。
theological_decisions:
- issue: Χριστοῦ在保罗的教会论陈述中的译法
  choice: 基督
  alternative: 弥赛亚
  rationale: “基督”是Χριστός在现代标准汉语中的稳定称号译法，并未将其仅仅处理为无意义的人名；“弥赛亚”语义相通，但在本句中较不符合自然、庄重的汉语教会论表达。
- issue: ἐκ μέρους在καὶ μέλη ἐκ μέρους中的意义
  choice: 分配性地译为“各自都是其中的肢体”
  alternative: “分别作肢体”或较直译的“按部分作肢体”
  rationale: 紧邻语境强调一个身体与多个肢体之间的关系。“各自”保留群体合一与个体参与之间的张力，同时避免把短语误解为仅在某种程度上属于身体。
- issue: 是否补出“其中的”
  choice: 补出“其中的”以明确汉语指代关系
  alternative: “并且各自是肢体”
  rationale: 希腊文可依身体隐喻省略所属对象，但现代汉语若完全不补出会略显突兀。“其中的”只显明语境已包含的关系，并未增加新的神学主张。
translation_notes:
  register: 采用现代、庄重而通顺的简体中文。“你们就是”体现明示主语的强调和δέ所带出的直接应用；“基督的身体—肢体”保持原文贯穿上下文的身体隐喻。脚注标记置于其所说明的整句末尾。
