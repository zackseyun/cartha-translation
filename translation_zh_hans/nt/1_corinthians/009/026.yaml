base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/026.yaml
  text: 'So then[a], I run in this way: not aimlessly; in this way I box: not beating the air.'
translation:
  language: zh_hans
  text: 所以，我这样奔跑，不是漫无目标；这样打拳，不是在打空气。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοίνυν
  choice: 所以
  rationale: 承接上文赛跑与得奖赏的比喻，引出保罗对自己的应用；“所以”自然保留推论作用。
- source_word: οὕτως
  choice: 就这样
  rationale: 原文两次重复，强调行动的方式；译文相应重复，以保留平行结构和语势。
- source_word: τρέχω
  choice: 奔跑
  rationale: 直接保留竞技场上的赛跑意象；现在时表达持续而鲜明的自我描述。
- source_word: ἀδήλως
  choice: 漫无目标
  rationale: 该副词可指方向或目标不明确；在赛跑意象中，“漫无目标”自然突出奔跑有明确目标。
- source_word: πυκτεύω
  choice: 挥拳
  rationale: 该词特指拳击；现代汉语用“挥拳”能简洁自然地呈现拳击动作，并与下句“击打空气”衔接。
- source_word: ἀέρα δέρων
  choice: 击打空气
  rationale: 按原文保留拳头落空、未击中对手的形象，表达行动并非徒劳无效。
theological_decisions: []
