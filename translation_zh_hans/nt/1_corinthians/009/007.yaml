source:
  edition: SBLGNT
  text: τίς στρατεύεται ἰδίοις ὀψωνίοις ποτέ; τίς φυτεύει ἀμπελῶνα καὶ ⸂τὸν καρπὸν⸃ αὐτοῦ οὐκ ἐσθίει; ⸀τίς ποιμαίνει ποίμνην καὶ ἐκ τοῦ γάλακτος τῆς ποίμνης οὐκ ἐσθίει;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/007.yaml
  text: Who ever serves as a soldier at his own expense? Who plants a vineyard and does not eat its fruit? Or who shepherds a flock and does not drink from the milk of the flock?[a][b]
translation:
  language: zh_hans
  text: 有谁当兵还要自己负担费用呢？[a] 有谁栽种葡萄园，却不吃园中的果子呢？又有谁牧养羊群，却不喝羊群所产的奶呢？[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “自己负担费用”也可译作“用自己的军饷（或军粮）”。原词指士兵所得的军饷或给养；这里的意思是，士兵不会自行承担服役的开支。
    reason: lexical_alternative
  - marker: b
    text: 原文直译是“不吃羊群的奶”。同一个“吃”字也用于上一句的果子；现代汉语通常说“喝奶”。
    reason: lexical_alternative
lexical_decisions:
- source_word: στρατεύεται
  choice: 当兵
  rationale: 指服兵役或从军；“当兵”是现代汉语中自然、简明的表达，也未将语义过度限定为实际参战。
- source_word: ἰδίοις ὀψωνίοις
  choice: 自己负担费用
  rationale: ὀψώνιον可指军饷或军粮；在这个反问中，重点是士兵不会自行承担服役所需的开支。正文采用自然的功能对等表达，并以脚注保留具体词义。
- source_word: ποτέ
  choice: 有谁……还……呢
  rationale: ποτέ在反问句中有“曾经、什么时候”的意味；汉语借助“有谁……还……呢”的反问结构自然传达“究竟有谁会这样”的语气。
- source_word: φυτεύει ἀμπελῶνα
  choice: 栽种葡萄园
  rationale: 直接保留种植葡萄园的农业图景；“栽种”比泛指经营或耕作更贴近φυτεύει。
- source_word: τὸν καρπὸν αὐτοῦ
  choice: 园中的果子
  rationale: καρπός指葡萄园所结的果实或出产；“园中的果子”自然清楚，并避免汉语代词指向含混。
- source_word: ποιμαίνει ποίμνην
  choice: 牧养羊群
  rationale: 保留ποιμαίνω与ποίμνη的牧人及群羊图景，同时符合庄重而通顺的现代汉语。
- source_word: ἐκ τοῦ γάλακτος τῆς ποίμνης
  choice: 羊群所产的奶
  rationale: ἐκ表示从羊群的奶中取用或受益；“羊群所产的奶”在汉语中清楚表达来源关系。
- source_word: ἐσθίει
  choice: 吃／喝
  rationale: 该动词在两个分句中都直译为“吃”，但现代汉语与“奶”搭配通常说“喝”；正文作语境化调整，脚注保留原文重复同一动词的特点。
theological_decisions:
- issue: 三个τίς反问句中的阳性单数泛指
  choice: 用“有谁”作不限定性别的单数泛指
  alternative: 显式译作“哪个男人”或使用复数表达
  rationale: 希腊语阳性单数在这些职业性例子中具有代表性、泛指功能；现代汉语“谁”本身不标示性别，既保留单数反问，也不额外加入原文没有强调的性别信息。
translation_notes:
  register: 采用现代、庄重而口语可懂的反问句式。三个问题以“有谁”平行展开，并用“却”和“又”体现论证的递进及对称。
