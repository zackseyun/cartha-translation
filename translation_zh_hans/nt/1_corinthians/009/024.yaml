  text: Οὐκ οἴδατε ὅτι οἱ ἐν σταδίῳ τρέχοντες πάντες μὲν τρέχουσιν, εἷς δὲ λαμβάνει τὸ βραβεῖον; οὕτως τρέχετε ἵνα καταλάβητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/024.yaml
  text: Do you not know that those who run in a stadium all run[a], but one receives the prize? Run in this way[b], so that you may obtain it.
translation:
  language: zh_hans
  text: 你们岂不知道，在赛场[a]上奔跑的人，人人都在跑；但只有一人得到奖赏吗？你们要这样跑，好叫你们得到奖赏[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赛场”也可译为“跑道”。原文στάδιον指赛跑举行的场地，即体育场或跑道。
    reason: lexical_alternative
  - marker: b
    text: “得到”也可译为“抓住”或“取得”。原文καταλάβητε可指获得、抓住或达到；此处承接前文的“奖赏”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐκ οἴδατε
  choice: 你们岂不知道
  rationale: 保留保罗常用的反问形式和“知道”的基本词义；现代汉语中自然且有劝诫力度。
- source_word: οἱ ἐν σταδίῳ τρέχοντες
  choice: 在赛场上赛跑的人
  rationale: στάδιον在此指举行赛跑的场地；“赛场”保留具体的竞技图景，“赛跑的人”也自然再现τρέχω。
- source_word: πάντες μὲν τρέχουσιν, εἷς δὲ
  choice: 都跑，但只有一个人
  rationale: 清楚表达μέν…δέ所构成的对比，并以“只有”自然呈现此处一人与众人的鲜明反差。
- source_word: λαμβάνει τὸ βραβεῖον
  choice: 得到奖赏
  rationale: λαμβάνει的基本意义是“得到、领受”，βραβεῖον是竞赛所得的奖赏；避免用“赢得”过度解释竞赛结果。
- source_word: οὕτως τρέχετε
  choice: 你们也要这样跑
  rationale: οὕτως回指前面的赛跑比喻；补出“也”使汉语衔接自然，而“要……跑”传达现在时命令语气的劝勉力度。
- source_word: ἵνα καταλάβητε
  choice: 好让自己得到奖赏
  rationale: καταλαμβάνω可指获得、抓住或达到；在奖赏的语境中译作“得到”自然，同时补明宾语“奖赏”以免中文指代含混。
theological_decisions:
- issue: 赛跑比喻与基督徒恒忍、奖赏之间的关系
  choice: 保留竞技赛跑和追求奖赏的劝勉，不说明奖赏具体指什么，也不将经文归入某种救恩、功德或奖赏体系。
  alternative: 意译为“你们要跑到赢为止”，或将“奖赏”明确解释为永生、救恩或属天冠冕。
  rationale: 原文借竞技图景强调有目标、有决心地奔跑，却没有在本节界定奖赏的性质；译文应保留这种神学张力，不添加原文未明说的教义结论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“赛场”比“体育场”更准确聚焦赛跑场地；重复“跑”和“奖赏”，以保留原文鲜明的竞技意象及劝勉节奏。
