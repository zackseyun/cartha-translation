  text: ἐγενόμην τοῖς ⸀ἀσθενέσιν ἀσθενής, ἵνα τοὺς ἀσθενεῖς κερδήσω· τοῖς πᾶσιν ⸀γέγονα πάντα, ἵνα πάντως τινὰς σώσω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/022.yaml
  text: To the weak I became weak[a], so that I might win the weak. I have become all things to all people[b], so that by all means I might save some.
translation:
  language: zh_hans
  text: 对软弱的人[a]，我就成了软弱的人，为要赢得软弱的人。对所有的人，我都成了各样的人，为要尽一切可能[b]救一些人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“良心软弱的人。”在《哥林多前书》中，这个说法可特指良心较为脆弱的人。
    reason: lexical_alternative
  - marker: b
    text: 或译：“用各种方法”“无论如何”。原文此词表示为达成目标而采用各种可能的方法。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγενόμην
  choice: 我就成为
  rationale: 不定过去时在这里指保罗面对不同对象时所采取的适应性行动；“成为”保留了进入某种处境或立场的意味，“就”使汉语衔接自然。
- source_word: ἀσθενέσιν / ἀσθενής / ἀσθενεῖς
  choice: 软弱的人／软弱的
  rationale: 三处保持同一词根的重复，以保存原文的修辞力量；“软弱”也不把含义限定为良心软弱。
- source_word: κερδήσω
  choice: 赢得
  rationale: 在宣教语境中指赢得人，而非取得利益；“赢得”简洁自然。
- source_word: τοῖς πᾶσιν
  choice: 对所有的人
  rationale: 希腊文与格短语有所省略；补出“人”符合上下文，并使现代汉语清楚。
- source_word: γέγονα
  choice: 我已经成为
  rationale: 完成时表达过去形成而延续至今的事奉方式；“已经成为”保留这一时体意味。
- source_word: πάντα
  choice: 各样的人
  rationale: 原文字面为“万有／一切”，但在“对所有的人”的人际语境中，汉语“成为各样的人”自然表达按不同群体作出适应，同时避免误解为成为任何事物。
- source_word: πάντως
  choice: 尽一切可能
  rationale: 这里表示采用一切可能的方式来达成目标；此译法保留广度，又不暗示不择手段。
- source_word: τινὰς
  choice: 一些人
  rationale: 保留不定代词的克制：保罗没有声称所有人都会因他的工作得救。
- source_word: σώσω
  choice: 救
  rationale: 原词在此具有明确的救恩含义；直接译为“救”保存其神学分量，也不额外界定保罗如何参与其中。
theological_decisions:
- issue: “软弱的人”的范围
  choice: 正文宽泛译作“软弱的人”
  alternative: “良心软弱的人”或“无力的人”
  rationale: 哥林多前书8—10章的语境可能特别涉及良心脆弱者，但本节措辞较宽，并与周围各类人形成修辞平行；正文不宜缩窄。
- issue: “救”的施事力量
  choice: 译作“为要……救一些人”
  alternative: “使一些人得救”或“帮助拯救一些人”
  rationale: σώσω确实使用救恩语言。直译保留保罗所陈述的事奉目标，同时不在译文中额外解决他作为工具性施事与上帝终极施救之间的关系。
- issue: πάντως所表达的方法范围
  choice: 译作“尽一切可能”
  alternative: “无论如何”“不惜一切代价”
  rationale: 该词强调竭尽各种可能方式；避免“不惜一切代价”可能带来的伦理上不择手段之意。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。通过“软弱—软弱”保存原文重复，以“我已经成为”体现完成时；整体力求兼顾形式与自然表达。
