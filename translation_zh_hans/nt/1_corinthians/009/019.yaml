  text: Ἐλεύθερος γὰρ ὢν ἐκ πάντων πᾶσιν ἐμαυτὸν ἐδούλωσα, ἵνα τοὺς πλείονας κερδήσω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/019.yaml
  text: For though I am free from all[a], I made myself a slave to all, so that I might win more of them.
translation:
  language: zh_hans
  text: 我虽然不受任何人辖制，却使自己作了众人的奴隶[a]，为要赢得更多的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“作了众人的仆人。”希腊文使用的是奴役用语；正文保留“奴隶”，因为它与前面的“不受任何人辖制”形成关键对照。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐλεύθερος
  choice: 不受……辖制
  rationale: 这里的“自由”指不受他人约束或支配；结合ἐκ πάντων译为“不受任何人辖制”，符合现代汉语，也为下文“作了……奴隶”的反差作铺垫。
- source_word: ἐκ πάντων
  choice: 不受任何人辖制
  rationale: πάντων在语境中指所有人；这一表达传达保罗不在任何人的权下或不欠任何人的义务，避免生硬直译为“脱离众人”。
- source_word: πᾶσιν
  choice: 众人的
  rationale: 与“任何人”形成修辞上的呼应，表示保罗自愿使自己处于服事所有人的卑微地位。
- source_word: ἐμαυτὸν ἐδούλωσα
  choice: 使自己作了……奴隶
  rationale: δουλόω是“使成为奴隶、奴役”；反身代词表明这是保罗自愿的自我降卑。保留“奴隶”能清楚呈现与“自由”之间的强烈对照。
- source_word: ἵνα
  choice: 为要
  rationale: 明确表达目的，简洁而庄重。
- source_word: τοὺς πλείονας
  choice: 更多的人
  rationale: 比较级表示人数上的“更多”，不扩展为较强的解释性说法“尽可能多的人”。
- source_word: κερδήσω
  choice: 赢得
  rationale: 保留κερδαίνω“获取、赢得”的比喻用法；在本段宣教语境中，指使更多人因福音而归信，但正文不把这一隐含意义过度明说。
theological_decisions:
- issue: δουλόω的奴役用语
  choice: 奴隶
  alternative: 仆人
  rationale: 本句以“自由”与自愿成为“奴隶”构成核心反差。“仆人”较温和，会削弱原文的奴役意象；因此正文保留“奴隶”，脚注提供较柔和的译法。
- issue: κερδήσω所指的“赢得”
  choice: 保留“赢得”的比喻，不在正文注明归信对象
  alternative: 使更多人归信
  rationale: 语境表明是借福音赢得人，但原文本身使用简洁的商业或得益比喻。保留该表达可避免把语境解释直接写入正文。
translation_notes:
  register: 采用现代、清楚而庄重的普通话。“不受任何人辖制”比直译“从众人得自由”自然；“使自己作了众人的奴隶”保留原文自愿降卑和自由／奴役的修辞张力。
