  text: ἐὰν γὰρ εὐαγγελίζωμαι, οὐκ ἔστιν μοι καύχημα, ἀνάγκη γάρ μοι ἐπίκειται· οὐαὶ ⸀γάρ μοί ἐστιν ἐὰν μὴ ⸀εὐαγγελίσωμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/016.yaml
  text: For if I preach the gospel[a], I have no ground for boasting, for necessity is laid upon me[b]. For woe is me if I do not preach the gospel.
translation:
  language: zh_hans
  text: 因为我若传福音[a]，并没有可夸之处；因为有不得已的责任加在我身上。我若不传福音，我就有祸了！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“宣告好消息”。本节下同。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐαγγελίζωμαι / εὐαγγελίσωμαι
  choice: 传福音
  rationale: 该动词指宣告好消息；在保罗的语境中，所宣告的内容虽未明说，却显然是福音。“传福音”是现代汉语中自然、明确的表达，并在两处保持一致。
- source_word: καύχημα
  choice: 可夸的
  rationale: 该词可指夸耀的根据或可夸之处。“没有什么可夸的”表明保罗并不以履行这项义务作为自夸的资本。
- source_word: ἀνάγκη
  choice: 非这样做不可
  rationale: 该词表达加在当事人身上的必要性或迫切约束。此译法自然地传达强制性的义务，同时不擅自说明这种必要性的来源。
- source_word: ἐπίκειται
  choice: 非这样做不可
  rationale: 该动词描写某事压在或加在保罗身上。汉语以“我非这样做不可”连同脚注表达其整体含义，正文更自然，脚注则保留原文“压在我身上”的意象。
- source_word: οὐαί
  choice: 有祸了
  rationale: 该感叹语表示严重的灾祸或审判威胁。“有祸了”保留庄重而强烈的警告语气，不弱化为单纯的悲叹。
- source_word: ἐὰν μὴ
  choice: 若不
  rationale: 直接保留原文的条件关系，简洁而庄重。
- source_word: γάρ
  choice: 因为
  rationale: 两处均表达解释或理由；译作“因为”清楚呈现论证关系。
theological_decisions:
- issue: 保罗传福音之义务的性质与来源
  choice: 译为“我非这样做不可”，表明有强制性的必要，却不指明其来源
  alternative: 明确译为“神把这使命交给了我”或仅译作“我内心受到催逼”
  rationale: 本节只说必要性压在保罗身上，并未在句中明确说明这是神直接的托付、内在催逼还是其他外在约束。正文保留这种张力，避免把上下文中的神学解释直接写进本节。
- issue: “祸”所指的具体性质
  choice: 保留概括性的“有祸了”
  alternative: 具体解释为“必受神惩罚”或“我就悲惨了”
  rationale: οὐαί语气严肃，可涉及灾祸或审判，但本节没有具体界定其形式；概括性译法既保留警告力度，也不作过度解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“可夸的”“非这样做不可”“有祸了”保留原文的论辩力度和郑重语气；分号呈现末句由理由转向严厉后果的节奏。
