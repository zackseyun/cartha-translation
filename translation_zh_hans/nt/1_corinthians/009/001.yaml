language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Οὐκ εἰμὶ ⸂ἐλεύθερος; οὐκ εἰμὶ ἀπόστολος⸃; οὐχὶ ⸀Ἰησοῦν τὸν κύριον ἡμῶν ἑόρακα; οὐ τὸ ἔργον μου ὑμεῖς ἐστε ἐν κυρίῳ;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/001.yaml
  text: Am I not free? Am I not an apostle? Have I not seen Jesus our Lord? Are you not my work in the Lord?[a]
translation:
  language: zh_hans
  text: 我不是自由的吗？我不是使徒吗？我不是见过我们的主耶稣吗？[a]你们不就是我在主里的工作吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我们的主耶稣”按原文词序也可表达为“耶稣——我们的主”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλεύθερος
  choice: 自由的
  rationale: 这里指保罗所拥有的自由及相应权利，并承接前文有关自由的讨论；“自由的”直接、自然，也不把含义收窄为单纯的“独立”。
- source_word: ἀπόστολος
  choice: 使徒
  rationale: 此处指保罗受差遣并获承认的使徒身份，而非一般意义上的信使；“使徒”保留了新约语境中的专门含义。
- source_word: Ἰησοῦν τὸν κύριον ἡμῶν
  choice: 我们的主耶稣
  rationale: “主”保留 κύριος 的基督论称号；中文采用自然词序“我们的主耶稣”，并用脚注交代更贴近希腊语次序的表达。
- source_word: ἑόρακα
  choice: 见过
  rationale: 希腊语完成时表示一次看见及其持续有效的意义；中文“见过”自然表达具有现时关联的既往经历，又不在正文中增添原文未明说的“复活后的”。
- source_word: ἔργον
  choice: 工作
  rationale: 保罗把哥林多信徒视为自己使徒劳作的工作或成果；正文保留“工作”这一宽泛比喻，不把它完全解释为“成果”。
- source_word: ἐν κυρίῳ
  choice: 在主里
  rationale: 保留保罗惯用而在中文中仍可理解的关系性表达，既可指这工作所在的属主领域，也可指哥林多信徒与主联合的关系。
- source_word: οὐκ / οὐχὶ / οὐ
  choice: 不是……吗？／不是……吗？／不就是……吗？
  rationale: 这些否定疑问句都期待肯定回答；连续采用中文反问形式，保留原文层层推进的修辞力量，末句用“不就是”使表达更自然。
theological_decisions:
- issue: 保罗声称见过耶稣的含义
  choice: 正文只译作“见过我们的主耶稣”，在上下文中让它作为保罗使徒身份的依据
  alternative: 明确译成“见过复活的主耶稣”
  rationale: 上下文强烈指向保罗见过复活的耶稣并以此支持其使徒身份，但希腊文没有明说“复活的”，故不在正文中补入，以保留原文的简洁和张力。
- issue: “在主里”与“工作”的关系
  choice: 保留“我在主里的工作”这一结构
  alternative: 解释为“我在主里劳作的成果”或“你们因与主联合而成为我工作的成果”
  rationale: ἐν κυρίῳ 的具体修饰关系具有一定开放性；直保留“在主里”可避免只选定“保罗在主里工作”或“信徒在主里”其中一种解释。
translation_notes:
  register: 采用现代、庄重而口语可懂的反问句式。四个问题保持紧凑并列；“工作”和“在主里”有意保留保罗原有的比喻及关系性表达，不作过度释义。
