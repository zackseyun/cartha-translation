  text: ἢ μόνος ἐγὼ καὶ Βαρναβᾶς οὐκ ἔχομεν ἐξουσίαν ⸀μὴ ἐργάζεσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/006.yaml
  text: Or is it only Barnabas and I who have no right not to work?[a]
translation:
  language: zh_hans
  text: 难道只有我和巴拿巴没有权利不做工吗？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “权利”也可译作“权限”或“自由”。这里的意思是，他们有权不靠做工维持生计，并从服事中获得生活所需的供应。
    reason: 说明ἐξουσία和μὴ ἐργάζεσθαι在本段语境中的含义，同时保留可行的词义表达。
lexical_decisions:
- source_word: ἢ
  choice: 难道
  rationale: 本词承接上文，引出另一个带反诘意味的选择；结合整句疑问形式译为“难道”，使现代汉语语气自然，同时保留论证的推进。
- source_word: μόνος
  choice: 只有
  rationale: 修饰“我和巴拿巴”这一并列主语，强调二人是否成为唯一的例外；“只有”准确而自然。
- source_word: ἐγὼ καὶ Βαρναβᾶς
  choice: 我和巴拿巴
  rationale: 依照希腊语次序直译，并采用现代汉语常见的人名音译“巴拿巴”。
- source_word: οὐκ ἔχομεν
  choice: 没有
  rationale: 简洁表达否定的现在时陈述，并与“权利”自然搭配。
- source_word: ἐξουσίαν
  choice: 权利
  rationale: 上下文谈使徒有资格获得生活供应，而非治理他人的权柄；“权利”最能传达这里的正当资格或权益。
- source_word: μὴ ἐργάζεσθαι
  choice: 不做工
  rationale: μή加不定式说明该权利的内容，即不靠做工维持生计；“不做工”保留原文简洁措辞及其在脱离上下文时可能产生的宽泛理解。
theological_decisions:
- issue: 保罗所说ἐξουσία的具体含义
  choice: 指使徒可以不靠做工维持生计、而接受事工生活供应的权利
  alternative: 泛指不工作的自由，未必涉及教会的物质供应
  rationale: 本章紧接着讨论使徒吃喝、获得供应以及保罗自愿放弃这些权利，因此语境支持生活供应之意；正文仍保持原文简练，不把解释直接扩写进去。
translation_notes:
  register: 采用现代、庄重而通俗的反诘句式。“做工”既符合圣经语体，也能让普通读者理解为劳动谋生；脚注澄清语境所指，避免把经文误读为笼统主张不劳动。
