  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἰ ἄλλοι τῆς ⸂ὑμῶν ἐξουσίας⸃ μετέχουσιν, οὐ μᾶλλον ἡμεῖς; Ἀλλ’ οὐκ ἐχρησάμεθα τῇ ἐξουσίᾳ ταύτῃ, ἀλλὰ πάντα στέγομεν ἵνα μή ⸂τινα ἐγκοπὴν⸃ δῶμεν τῷ εὐαγγελίῳ τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/012.yaml
  text: If others share in this right over you[a], do not we even more? But we have not made use of this right; instead[b], we endure everything so that we may give no hindrance to the gospel of the Messiah.
translation:
  language: zh_hans
  text: 如果别人享有向你们提出要求的权利[a]，我们岂不更有权吗？然而，我们没有使用这权利，反而凡事忍受，免得给弥赛亚的福音造成任何阻碍。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“对你们享有这项权利”或“有权向你们提出这样的要求”。希腊文所指的，很可能是使徒有权从哥林多人获得物质供给。
    reason: lexical_alternative
lexical_decisions:
- source_word: τῆς ὑμῶν ἐξουσίας / τῇ ἐξουσίᾳ ταύτῃ
  choice: 有权从你们得到供给 / 这权利
  rationale: ἐξουσία在上下文中指使徒有权从哥林多人获得物质供给。首处将关系明确表达为“从你们得到供给”，避免直译成容易误解的“你们的权利”；后文用“这权利”自然回指。
- source_word: μετέχουσιν
  choice: 有权……得到
  rationale: 该词本义为“分享、参与”。与ἐξουσία连用时，中文采用“有权”表达享有并行使此项权利，避免生硬的“分享权利”。
- source_word: οὐ μᾶλλον ἡμεῖς;
  choice: 我们岂不更有权吗？
  rationale: 保留反问语气及μᾶλλον“更、更加”的比较意味。
- source_word: ἐχρησάμεθα
  choice: 没有使用
  rationale: 准确表达χράομαι“使用、利用”的含义，并与“权利”自然搭配。
- source_word: πάντα στέγομεν
  choice: 凡事忍受
  rationale: στέγω在此指承受各种艰难或不便，而非字面的“遮盖”；“凡事忍受”保留πάντα的全面语气。
- source_word: τινα ἐγκοπὴν δῶμεν
  choice: 造成任何阻碍
  rationale: 中文不宜机械译作“给出阻碍”；“造成任何阻碍”自然表达给福音设置障碍之意，并保留τινα在否定目的句中的广泛范围。
- source_word: εὐαγγελίῳ
  choice: 福音
  rationale: “福音”是现代汉语基督教语境中清楚、稳定且庄重的对应词。
- source_word: Χριστοῦ
  choice: 弥赛亚
  rationale: 此处Χριστός带冠词且具有称号功能；“弥赛亚”保留其受膏者称号的意义。
theological_decisions:
- issue: Χριστοῦ作为称号还是名称化称呼
  choice: 弥赛亚
  alternative: 基督
  rationale: τοῦ Χριστοῦ在“弥赛亚的福音”中可自然理解为称号；采用“弥赛亚”显明原词的称号含义，同时不额外界定属格是单指福音属于他，还是也指关于他的福音。
- issue: τῆς ὑμῶν ἐξουσίας所指的权利
  choice: 有权从你们得到供给
  alternative: 对你们所拥有的权柄；向你们提出要求的权利
  rationale: 前后文讨论传福音者获得生活供给的权利，因此在正文中补明“供给”。这说明语境所指，却不把该权利解释成一般性的管辖权。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“供给”与上下文的物质支持相连；“凡事忍受”“造成任何阻碍”保持保罗论述的力度和目的关系。所有脚注标记均已置于正文。
