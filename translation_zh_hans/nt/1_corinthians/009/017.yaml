  rationale: 修订仅去除中文未受原文支持的“也”，并将第二分句调整为更自然、直接的“已受托承担一项管家职责”。保留原文在赏赐与受托责任之间的对照，不将其解释为否定赏赐、强制性圣职或任何特定教义。
