  text: εἰ γὰρ ἑκὼν τοῦτο πράσσω, μισθὸν ἔχω· εἰ δὲ ἄκων, οἰκονομίαν πεπίστευμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/017.yaml
  text: For if I do this willingly[a], I have a reward; but if unwillingly, I have been entrusted with a stewardship.
translation:
  language: zh_hans
  text: 因为我若自愿做这事，就有赏赐；若不是出于自愿，我已受托承担一项管家职责[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “管家职责”或译“受托的使命”。
    reason: οἰκονομία可侧重受托管理的责任，也可在本语境中表达所领受的使命；正文保留管家隐喻，脚注列出较侧重功能的译法。
lexical_decisions:
- source_word: ἑκὼν
  choice: 自愿
  rationale: 表示出于自己的意愿，简洁自然，并与后面的ἄκων形成直接对照。
- source_word: τοῦτο πράσσω
  choice: 做这事
  rationale: 指履行上下文所说的传福音事工；保持原文宽泛的指代，不作过度解释。
- source_word: μισθὸν
  choice: 赏赐
  rationale: 此处强调自愿服事所得的回报；“赏赐”比“工资”更符合语境，同时保留回报之意。
- source_word: ἄκων
  choice: 非自愿
  rationale: 与ἑκὼν严格对应，表达并非出于自己的意愿，而不额外加入“勉强”所可能暗示的情绪色彩。
- source_word: οἰκονομίαν
  choice: 管家的职责
  rationale: 该词指受托管理的责任。“管家的职责”既保留管家隐喻，也比单用“管家职分”更易为现代普通读者理解。
- source_word: πεπίστευμαι
  choice: 我也已经受托承担
  rationale: 体现完成时被动语态：这项责任已经托付给保罗，而他现今仍处于受托状态。中文补出“承担”，使与“职责”的搭配自然。
theological_decisions:
- issue: 第二分句中保罗事工的性质
  choice: 即使并非自愿，保罗仍是已经受托承担管家职责的人。
  alternative: 若非自愿，保罗所得的只是义务而非赏赐；或将此句专门解释为一种强制性的圣职。
  rationale: 原文将“有赏赐”与“已经受托承担管家的职责”并列对照，既表明自愿服事与赏赐的关系，也保留受托责任的客观性；译文不进一步建立特定宗派的事工理论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“自愿／非自愿”保持鲜明对照；“管家的职责”保留原文受托管理的意象。脚注标记置于其实际对应的οἰκονομίαν译语之后。
