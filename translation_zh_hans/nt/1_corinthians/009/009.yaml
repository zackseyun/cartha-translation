source:
  edition: SBLGNT
  text: ἐν γὰρ τῷ Μωϋσέως νόμῳ γέγραπται· Οὐ ⸀κημώσεις βοῦν ἀλοῶντα. μὴ τῶν βοῶν μέλει τῷ θεῷ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/009.yaml
  text: For it is written in the law of Moses[a], “You shall not muzzle an ox while it is threshing.” Is God concerned about oxen?
translation:
  language: zh_hans
  text: 因为摩西的律法上记着：“牛打谷[a]的时候，不可笼住它的嘴。”难道上帝关心的是牛吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“踹谷”。
    reason: ἀλοάω指打谷、脱粒；在古代语境中，牛通常以踩踏谷物的方式作业。“踹谷”更具体地呈现这种方式，但“打谷”更直接对应本句用词的概括性。
lexical_decisions:
- source_word: ἐν γὰρ τῷ Μωϋσέως νόμῳ
  choice: 因为摩西的律法上
  rationale: ἐν在此表示经文记载所在的范围；“摩西的律法上”是自然的现代汉语圣经用语，并保留Μωϋσέως的属格关系。γάρ译为“因为”，承接上文论证。
- source_word: γέγραπται
  choice: 记着
  rationale: 这是引出经文的完成时被动式惯用语。“记着”既体现已经写下且仍具效力，也比生硬的“被写着”自然。
- source_word: Οὐ κημώσεις
  choice: 不可笼住它的嘴
  rationale: 将以将来时表达的律法禁令译为汉语法律语体“不可”。κημόω意为给牲畜套上口笼；“笼住它的嘴”准确、易懂。补出“它的”是汉语表达所需，所指明确为牛。
- source_word: βοῦν
  choice: 牛
  rationale: 指用于劳作的牛。现代汉语以“牛”最自然，也不必强行限定其性别或译作较古雅的“牛犊”。
- source_word: ἀλοῶντα
  choice: 打谷
  rationale: 现在分词表示牛当时正在进行的动作。“打谷”概括脱粒作业，不额外限定具体方式；“踹谷”作为贴近古代作业方式的译法列于脚注。
- source_word: μὴ τῶν βοῶν μέλει τῷ θεῷ
  choice: 难道上帝关心的是牛吗？
  rationale: μή引导预期否定回答的反问，“难道……吗”保留其修辞力度。“关心的是牛”也保留τῶν βοῶν在句中的焦点位置，而不擅自加入“只”或“仅仅”。
theological_decisions:
- issue: 保罗关于上帝是否关心牛的反问
  choice: 难道上帝关心的是牛吗？
  alternative: 难道上帝只关心牛吗？／上帝不关心牛，是吗？
  rationale: 原文是由μή引导的反问，但没有“只”的对应词。直译为反问可保留保罗的论证张力，同时不把这句话解释成上帝绝对不眷顾动物，也不擅自将其明确化为“并非只关心牛”。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“摩西的律法上记着”保留引用经文的正式语气；律法命令用“不可”，反问用“难道……吗”。标点按现代简体中文规范处理。
