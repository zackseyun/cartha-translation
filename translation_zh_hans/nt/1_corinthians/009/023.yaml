  rationale: 将“成为”纳入正文，以对应γένομαι在ἵνα目的从句中的身分/状态转换含义；“与人一同有分于福音的人”则保留συν-的共同性及该共同参与具体为何的开放性。将脚注第一项改为“有分于其中”，使其明确是较简洁、较少突出“成为”义的替代表达；第二项保留较直译的参与者表述。
