  text: ⸀πάντα δὲ ποιῶ διὰ τὸ εὐαγγέλιον, ἵνα συγκοινωνὸς αὐτοῦ γένωμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/023.yaml
  text: But I do all things for the sake of the good news[b][a], so that I may become a fellow participant in it.
translation:
  language: zh_hans
  text: 但我做这一切都是为了福音[a]，好让我成为与人一同有分于福音的人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为了好消息”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“好使我也能有分于其中”，或“好使我成为福音的共同参与者”。
    reason: alternative_reading
lexical_decisions:
- source_word: πάντα
  choice: 我所做的一切
  rationale: πάντα是中性复数宾格，在此作ποιῶ的宾语，概括保罗为适应不同的人而采取的各样行动；译成“我所做的一切”既完整又符合现代汉语。
- source_word: δὲ
  choice: 但
  rationale: δὲ承接上文并带轻微转折，表明这些行动虽多样，其共同动机却是福音；“但”自然保留这一语气。
- source_word: ποιῶ
  choice: 我所做
  rationale: ποιῶ为现在时直陈式，表示保罗一贯的行事方式。汉语定语结构“我所做的一切”自然涵盖持续或惯常意义。
- source_word: διὰ τὸ εὐαγγέλιον
  choice: 为了福音
  rationale: διά加宾格在这里表达缘故、目的或利益。“为了”简洁呈现保罗以福音为动机和目标的意思；“福音”是现代中文基督教语境中通行且庄重的εὐαγγέλιον译法。
- source_word: ἵνα
  choice: 为要
  rationale: ἵνα引出目的从句。“为要”明确保留目的色彩，同时符合经文的庄重语体。
- source_word: συγκοινωνὸς
  choice: 与人一同有分
  rationale: συγκοινωνός指与他人共同参与或分享的人。“与人一同有分”保留συν-所表达的共同性，也不限定究竟是有分于福音的益处、传播还是事工。
- source_word: αὐτοῦ
  choice: 于福音
  rationale: αὐτοῦ为中性单数属格，最自然地回指τὸ εὐαγγέλιον。中文重复“福音”比使用可能指代不清的“它”更自然清楚。
- source_word: γένωμαι
  choice: 有分
  rationale: γένωμαι为γίνομαι的不定过去时中动虚拟式，在ἵνα之后表达成为某种身份或进入某种状态。正文以自然汉语“有分”表达，脚注补出“成为共同参与者”以保留其成为义。
theological_decisions:
- issue: 保罗“有分于福音”的具体所指
  choice: 保留为“与人一同有分于福音”，不限定参与的层面
  alternative: 可具体理解为分享福音的福分、参与福音的传播，或成为福音事工的同工
  rationale: συγκοινωνός语义宽广，经文本身没有明确限定所分享的是福音的益处、使命还是事工。译文保留这一张力，避免导入特定教义体系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“福音”保留中文读者熟悉的圣经术语，并以脚注说明较透明的“好消息”。“与人一同有分于福音”既表达共同参与，也刻意不说明参与的具体方式，以忠实保留原文的开放性。
