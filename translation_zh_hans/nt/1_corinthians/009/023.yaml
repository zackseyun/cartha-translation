  naturalness: 原句庄重自然。“好让我成为与人一同有分于福音的人”虽较长，但在现代标准汉语的经文语体中清楚、顺畅，并比将“成为”仅留在脚注中更完整。
  terminology: “福音”是恰当且通行的术语；以“好消息”为脚注替代译法也合适。“有分于”能保留συγκοινωνός所涵盖的共同分享、参与而不将其限定为福音事工、传播或福分中的任何一种。
