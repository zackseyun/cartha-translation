  text: ἢ δι’ ἡμᾶς πάντως λέγει; δι’ ἡμᾶς γὰρ ἐγράφη, ὅτι ⸂ὀφείλει ἐπ’ ἐλπίδι⸃ ὁ ἀροτριῶν ἀροτριᾶν, καὶ ὁ ἀλοῶν ⸂ἐπ’ ἐλπίδι τοῦ μετέχειν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/010.yaml
  text: Or is he speaking entirely for our sake? Yes[a], it was written for our sake, because the one who plows ought to plow in hope[b], and the one who threshes ought to thresh in hope of sharing.
translation:
  language: zh_hans
  text: 难道他全然是为了我们才说这话吗？的确，这话是为我们写的：耕地的人应当怀着盼望耕地，打谷的人也应当怀着盼望能有份而打谷[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作：“打谷的人也应当怀着有份的盼望。”原文没有明说有份于什么；农业语境暗示是劳动所得或收成。
    reason: implicit_object
lexical_decisions:
- source_word: πάντως
  choice: 完全
  rationale: 该副词加强反问语气；“完全”保留“全然、专为”的可能含义，又不把它单纯处理成表示肯定的“当然”。
- source_word: δι’ ἡμᾶς
  choice: 为我们
  rationale: διά加宾格在这里表示缘故或受益对象；“为我们”自然地表达保罗所论经文与人的益处有关。
- source_word: ἐγράφη
  choice: 这话是……写的
  rationale: 按不定过去时被动语态直译，并以“这话”自然承接前文所引经文。
- source_word: ὀφείλει
  choice: 应当
  rationale: 保留义务和合宜性的规范意味，不强化成绝对强制的“必须”。
- source_word: ἐπ’ ἐλπίδι
  choice: 怀着盼望
  rationale: 表达劳动时所抱的期待，现代汉语自然，并保留两个分句中ἐλπίς的呼应。
- source_word: ὁ ἀροτριῶν ἀροτριᾶν
  choice: 耕地的应当……耕地
  rationale: 保留分词与不定式的同词根重复，以及泛指劳动者的表达。
- source_word: ὁ ἀλοῶν
  choice: 打谷的
  rationale: “打谷”是普通读者可懂的农业用语，并与“耕地的”形成平行。
- source_word: τοῦ μετέχειν
  choice: 有份
  rationale: μετέχω表示分享、参与或分得一份；原文未明说所分享的对象，因此正文不擅自补入“收成”。
theological_decisions:
- issue: μετέχειν所支配的隐含对象
  choice: 正文保留为“有份”，不补明对象
  alternative: “分享收成”或“分得庄稼”
  rationale: 农业语境暗示劳动成果或收成，但希腊文有意省略宾语；保留省略可避免把一种合理推断写成明说内容。
- issue: πάντως在反问中的功能
  choice: 正文译作“完全”，并以“的确”承接回答
  alternative: 将πάντως直接译作“当然”或“确实”
  rationale: “完全”保存该词修饰“为我们”的范围意味；下一句以“的确”表达论证中的肯定承接，同时脚注说明另一种分析。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“耕地—打谷”保留农业图景和句式平行；“怀着……盼望”避免生硬的“在盼望中”。所有脚注标记均置于正文相应位置。
