reference: 1 Corinthians 9:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: τίς οὖν ⸀μού ἐστιν ὁ μισθός; ἵνα εὐαγγελιζόμενος ἀδάπανον θήσω τὸ ⸀εὐαγγέλιον, εἰς τὸ μὴ καταχρήσασθαι τῇ ἐξουσίᾳ μου ἐν τῷ εὐαγγελίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/018.yaml
  text: What then is my reward? That in preaching the good news I may present the good news free of charge[b][a], so as not to make full use of my right in the good news.
translation:
  language: zh_hans
  text: 那么，我的报酬是什么呢？就是我传福音时，免费把福音传给人[a]，为的是不完全行使自己在传福音上所享有的权利[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文也可较直译为“使福音不需花费”，意思是传福音而不向人收取报酬。
    reason: 说明ἀδάπανον修饰“福音”这一浓缩表达，并交代其在上下文中的含义。
  - marker: b
    text: “不完全行使”也可译为“不充分使用”或“不把权利用到充分程度”；“在传福音上”原文直译为“在福音中”。
    reason: 保留καταχρήσασθαι的“充分使用”语义，以及ἐν τῷ εὐαγγελίῳ这一较为浓缩的表达。
lexical_decisions:
- source_word: μισθός
  choice: 报酬
  rationale: 本节延续上下文关于传道人获得供养的讨论。“报酬”既能表达所得回报，也能保留保罗以免费传福音为自己“报酬”的反讽意味，而不把它局限为工资。
- source_word: εὐαγγελιζόμενος
  choice: 我传福音时
  rationale: 该现在分词表示与主要动作同时发生的活动；此译自然地保留“传扬福音”的动词意义。
- source_word: ἀδάπανον
  choice: 免费
  rationale: 该词意为“不需费用、不产生花费”。“免费”在现代汉语中简洁明确，结合上下文指保罗不因传福音向人索取供养。
- source_word: θήσω τὸ εὐαγγέλιον
  choice: 把福音传给人
  rationale: 字面为“放置／呈上福音”，在这里指把福音提供、传给听众。译文避免生硬直译，并在汉语中明确其传扬行为。
- source_word: εὐαγγέλιον
  choice: 福音
  rationale: “福音”是现代汉语中通行而庄重的对应词，表达所宣告的好消息，也与动词“传福音”自然衔接。
- source_word: καταχρήσασθαι
  choice: 充分使用
  rationale: 该动词在此可表示“充分利用、用到底”，并不必然含有滥用或剥削之意。此译符合上下文：保罗拥有正当权利，却自愿不完全行使。
- source_word: ἐξουσίᾳ
  choice: 权利
  rationale: 上下文所论的是使徒因传福音而获得物质供养的正当资格；“权利”比宽泛的“权柄”更准确。
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: 在传福音上
  rationale: 希腊语可直译为“在福音中”，语境则指与福音工作有关的领域。“在传福音上”在现代汉语中自然，也没有把其范围过度扩大。
theological_decisions:
- issue: 保罗所说ἐξουσία的性质
  choice: 指保罗在传福音工作中获得供养的正当权利，而他自愿不充分行使。
  alternative: 泛指使徒权柄，或暗示对权柄的滥用。
  rationale: 哥林多前书第9章的上下文反复讨论使徒获得物质供养的权利。译作“权利”和“充分使用”，既承认其正当性，也避免无根据地加入“滥用”的负面判断。
- issue: καταχρήσασθαι是否必然带有贬义
  choice: 不在正文中译成“滥用”，而译为“不充分使用”。
  alternative: “免得我利用／滥用自己的权利”。
  rationale: 该词可以表示充分使用，有时也可带负面色彩；但本节重点是保罗克制行使正当权利。正文保留这一语境判断，脚注提示较简约的另一种译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“免费把福音传给人”避免“使福音成为免费的”之类生硬结构；“所享有的权利”表明该权利正当存在，同时以“不充分使用”保留保罗主动克制的语气。
