  text: This is my defense to those who examine me[a].
translation:
  language: zh_hans
  text: 这就是我对那些审查我的人[a]所作的申辩：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这就是我在那些评断我的人面前所作的申辩。”
    reason: 保留ἀνακρίνω可译为“评断”，以及与格可用“在……面前”表达的词义和句法选择。
lexical_decisions:
- source_word: ἀπολογία
  choice: 申辩
  rationale: 指面对质疑或审查所作的答辩；“申辩”既保留正式意味，也符合现代汉语表达，不会误解为道歉。
- source_word: ἀνακρίνουσίν
  choice: 审查
  rationale: 该词表示仔细查问、评断或调查。上下文涉及对保罗使徒身份与权利的检视，因此译作“审查”能体现批判性考察，同时不将其限定为最终司法判决。
- source_word: Ἡ ἐμὴ
  choice: 我
  rationale: 以“我对……申辩”的结构自然表达希腊文所有关系；无需另加“我自己的”来强化。
- source_word: τοῖς ἐμὲ ἀνακρίνουσίν
  choice: 对那些审查我的人
  rationale: 将与格理解为申辩所面向的对象，准确而自然。
- source_word: ἐστιν αὕτη
  choice: 如下
  rationale: 在“申辩如下”的汉语结构中自然传达“这就是”的指示和识别作用，也容许它指向下文。
theological_decisions:
- issue: “这”所指的方向
  choice: 以“如下”表达，主要指向随后展开的申辩
  alternative: 译作“这就是我的申辩”，可能指向前文或下文
  rationale: 希腊文 αὕτη 的具体指向存在一定讨论空间；本节通常被视为下文论证的引言。“如下”适合汉语篇章衔接，但脚注保留另一种表达及可能的司法色彩。
translation_notes:
  register: 采用现代、庄重而易懂的书面语。“审查”与“申辩”保持本节近似司法场景的语气，却不把经文限定为正式法庭程序。
