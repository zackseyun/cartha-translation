reference: 1 Corinthians 9:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἐγενόμην τοῖς Ἰουδαίοις ὡς Ἰουδαῖος, ἵνα Ἰουδαίους κερδήσω· τοῖς ὑπὸ νόμον ὡς ὑπὸ νόμον, ⸂μὴ ὢν αὐτὸς ὑπὸ νόμον⸃, ἵνα τοὺς ὑπὸ νόμον κερδήσω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/020.yaml
  text: And to the Jews I became as a Jew[a], so that I might win Jews; to those under the law[b], as under the law—though I myself am not under the law—so that I might win those under the law.
translation:
  language: zh_hans
  text: 对犹太人，我就像犹太人一样，为要赢得犹太人[a]；对律法之下的人，我就像律法之下的人一样——虽然我自己不在律法之下——为要赢得律法之下的人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赢得”也可译作“得着”；原词兼有获得和赢得人心的意思。
    reason: lexical_alternative
  - marker: b
    text: 这里的“律法”最可能指摩西律法。
    reason: cultural_note
lexical_decisions:
- source_word: ἐγενόμην
  choice: 我就像……一样
  rationale: γίνομαι 在这里表达保罗面对不同群体时采取相应的处世方式。若直译为“成为”，现代汉语容易误解为身份或族裔发生改变；结合 ὡς 译成“就像……一样”，既自然，也保留适应性认同的含义。
- source_word: τοῖς Ἰουδαίοις ... ὡς Ἰουδαῖος
  choice: 对犹太人，我就像犹太人一样
  rationale: 与格表示保罗所面对的群体，ὡς 保留比较意义；此译法不暗示保罗否认或改变了自己的犹太族裔身份。
- source_word: ἵνα ... κερδήσω
  choice: 为要赢得
  rationale: κερδαίνω 本义可指“获得、得着”，在本段宣教语境中指赢得人；“赢得”在现代汉语中自然，并保留其目的意味。
- source_word: τοῖς ὑπὸ νόμον
  choice: 对律法之下的人
  rationale: 介词短语带冠词而名词化，指处于律法权辖之下的人。“律法之下”保留保罗式的浓缩表达。
- source_word: ὡς ὑπὸ νόμον
  choice: 我就像律法之下的人一样
  rationale: 补出“人”使现代汉语完整，同时与前句“像犹太人一样”形成对应，并未断言保罗本人确实在律法之下。
- source_word: μὴ ὢν αὐτὸς ὑπὸ νόμον
  choice: 虽然我自己不在律法之下
  rationale: 现在分词构成同时性的让步说明；“虽然”清楚呈现插入的对比，“不在……之下”保留其身份或处境陈述。
- source_word: αὐτὸς
  choice: 我自己
  rationale: 保留 αὐτός 的强调意味，突出保罗本人虽如此适应，却不在律法之下。
- source_word: νόμος
  choice: 律法
  rationale: 上下文最可能指摩西律法，但正文保持希腊文较简洁的“律法”，不把解释直接写入译文。
theological_decisions:
- issue: 保罗说自己“不在律法之下”的含义
  choice: 直接译为“虽然我自己不在律法之下”，不添加限定语。
  alternative: 译为“不在摩西律法之下”，或根据下一节补充“不在上帝的律法之外、而在基督的律法之下”。
  rationale: 本节希腊文只说保罗不在律法之下。正文不应借下一节调和，也不应把“律法”在正文中进一步限定，从而保留原文的修辞对比与神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“对……，我就像……一样”重现原文的平行结构；破折号标出保罗的插入说明。脚注标记均置于正文相关内容之后。
