  text: Μὴ κατὰ ἄνθρωπον ταῦτα λαλῶ ἢ ⸂καὶ ὁ νόμος ταῦτα οὐ⸃ λέγει;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/008.yaml
  text: Am I saying these things from a merely human perspective[a], or does not the Law also say these things?
translation:
  language: zh_hans
  text: 我说这些话，难道只是按人的观点吗？还是律法不也这样说吗？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ
  choice: 难道……吗
  rationale: 该否定疑问句预期否定回答；现代汉语用“难道……吗”自然保留其反问语气。
- source_word: κατὰ ἄνθρωπον
  choice: 只是按人的观点
  rationale: 该短语指以人的层面或观点为依据，并与下句律法的见证形成对照；“只是”体现这种限制意味，同时脚注保留较直译的可能。
- source_word: ταῦτα
  choice: 这些话／这样
  rationale: 首处译作“这些话”，承接保罗上文所说的论点；后句按汉语习惯译作“这样”，仍保留相同内容的回指。
- source_word: λαλῶ
  choice: 我说
  rationale: 以自然的现代汉语表达保罗正在提出的论述。
- source_word: ἢ
  choice: （分作相连的第二问）
  rationale: 希腊文以“或”连接两个反问；汉语分成两个紧密相连的问题更自然，二者的选择和对照关系仍由语境清楚表达。
- source_word: καὶ
  choice: 也
  rationale: 保留律法作为另一项、并且更具权威性的见证之添加意义。
- source_word: ὁ νόμος
  choice: 律法
  rationale: 上下文下一节引用申命记25:4，因此这里特指摩西律法或圣经中的律法，而不是泛指一般法则。
- source_word: οὐ λέγει
  choice: 不也……说吗
  rationale: 保留原文预期肯定回答的否定反问结构，而不将其平直改写为肯定陈述。
theological_decisions:
- issue: “律法”的所指
  choice: 指摩西律法／圣经中的律法
  alternative: 泛指一般的法律或原则
  rationale: 紧接着的哥林多前书9:9引用申命记25:4，表明保罗是在诉诸圣经律法；正文不额外加入“摩西的”，以避免不必要的明说。
- issue: 人的论证与律法见证之间的关系
  choice: 保留两个反问的张力，表明保罗并非只凭人的观点，律法也作见证
  alternative: 将前句解释为完全否定一切人的推理，或将后句仅视为普通类比
  rationale: 原文既否定其论证只是“按人”，又诉诸律法；译文不进一步规定二者的系统神学关系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“难道……吗？……不也……吗？”再现原文连续反问。将ἢ连接的两问分句处理，以免汉语“还是”误导为真正寻求二选一答案。
