  text: τοῖς ἀνόμοις ὡς ἄνομος, μὴ ὢν ἄνομος ⸀θεοῦ ἀλλ’ ἔννομος ⸀Χριστοῦ, ἵνα ⸀κερδάνω ⸀τοὺς ἀνόμους·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/021.yaml
  text: To those outside the law[b][a], as one outside the law—though not being outside God’s law but under Messiah’s law—so that I might win those outside the law.
translation:
  language: zh_hans
  text: 对于律法以外的人，我就像律法以外的人[a]——虽然我并非在上帝的律法以外，反而受弥赛亚的律法约束[b]——为要赢得律法以外的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “律法以外”也可译作“没有律法”。这里主要指不在摩西律法之下，并不一定是说道德上无法无天。
    reason: lexical_alternative
  - marker: b
    text: 也可表达为“在弥赛亚的律法之内”；这里译作“受弥赛亚的律法约束”。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνόμοις / ἄνομος / ἀνόμους
  choice: 律法以外的人／律法以外
  rationale: 上下文把“在律法之下的人”与这些人相对照，所指主要是不在摩西律法之下者，而非泛指邪恶或无法无天的人。保留三次重复，也维持原文的修辞连贯。
- source_word: ὡς
  choice: 像
  rationale: 表达保罗为接近对方而采取的处境性适应，并不表示他在绝对意义上成为不受任何律法约束的人。
- source_word: μὴ ὢν
  choice: 其实我并非
  rationale: 在插入说明中自然表达其让步和限定作用，澄清前面的“像律法以外的人”。
- source_word: ἔννομος
  choice: 受……律法约束
  rationale: 该词表示处在律法范围内或受律法约束；此译法在现代汉语中自然，也清楚表达保罗并非否定一切规范。
- source_word: Χριστοῦ
  choice: 弥赛亚的
  rationale: 此处 Χριστός 作为称号使用，属格表示这律法与弥赛亚的关系。
- source_word: ἵνα
  choice: 为要
  rationale: 自然表达目的。
- source_word: κερδάνω
  choice: 赢得
  rationale: 在本段传扬福音的语境中，指争取人、使人归信，而非获取经济利益。
theological_decisions:
- issue: ἀνόμος 在本节的含义
  choice: 指处于摩西律法范围以外的人，而不是泛指道德败坏、无法无天者
  alternative: 无法无天的人；没有律法的人
  rationale: 哥林多前书9:20–21将“在律法之下的人”与 ἀνόμοι 并列对照；保罗随即说明自己并非在上帝的律法以外，表明这里谈的是律法之下或之外的处境，同时避免反律法主义的误解。
- issue: ἔννομος Χριστοῦ 的关系
  choice: 受弥赛亚的律法约束
  alternative: 在弥赛亚的律法之内；对弥赛亚而言是在律法之内
  rationale: 该短语表明保罗仍受与弥赛亚相关的律法约束；希腊语可侧重“在……之内”或“受……约束”，脚注保留这种表达差异，不进一步界定“弥赛亚的律法”的全部神学内涵。
- issue: Χριστοῦ 的译法
  choice: 弥赛亚的
  alternative: 基督的
  rationale: 这里称号意义清楚，译作“弥赛亚”可显明其受膏者称号的性质。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“律法以外”反复三次，以对应原文同一词根的重复；破折号标出保罗的插入澄清，使长句关系清楚。
