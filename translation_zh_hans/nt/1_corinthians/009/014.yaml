  text: οὕτως καὶ ὁ κύριος διέταξεν τοῖς τὸ εὐαγγέλιον καταγγέλλουσιν ἐκ τοῦ εὐαγγελίου ζῆν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/014.yaml
  text: In the same way[b][a], the Lord also commanded that those who proclaim the gospel should live from the gospel.
translation:
  language: zh_hans
  text: 同样，主也吩咐宣讲福音的人[a]靠福音为生[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“传福音的人”。
    reason: lexical_alternative
  - marker: b
    text: 直译：“从福音而活。”这里指从福音事工获得生活供养。
    reason: lexical_clarification
lexical_decisions:
- source_word: οὕτως
  choice: 同样
  rationale: 承接上文的祭司、利未人与劳作者获得供养的例证，清楚表达类比关系。
- source_word: καὶ
  choice: 也
  rationale: 体现附加意味：除上文所举的依据外，主也作了这样的吩咐。
- source_word: ὁ κύριος
  choice: 主
  rationale: 忠实保留原文称谓；在保罗书信的语境中最自然地指主耶稣，但正文不擅自扩写。
- source_word: διέταξεν
  choice: 吩咐
  rationale: 表达具有权威的指示；较“安排”更符合此处语义，又比“命令”更贴合现代中文圣经语体。
- source_word: τοῖς τὸ εὐαγγέλιον καταγγέλλουσιν
  choice: 宣讲福音的人
  rationale: 将带冠词的分词结构自然译为一类人；“宣讲”保留公开传扬、宣告的意味。
- source_word: τὸ εὐαγγέλιον
  choice: 福音
  rationale: 采用保罗书信中通行且现代读者可理解的术语，并保持词汇一致。
- source_word: ἐκ τοῦ εὐαγγελίου ζῆν
  choice: 靠福音为生
  rationale: 结合上下文，ἐκ 表示生活所需的来源；此译自然表达福音工作者从其事工获得生活供养，同时保留“福音”这一原文意象。
theological_decisions:
- issue: “主”的所指
  choice: 正文保留“主”，语境中最可能指耶稣
  alternative: 泛指上帝
  rationale: 保罗在本段援引主关于工人得供养的教导，但原文没有写出“耶稣”，故不在正文中增补。
- issue: “靠福音为生”的含义
  choice: 指宣讲福音者从福音事工获得物质生活供养
  alternative: 指人借福音获得属灵生命
  rationale: 整段论述使徒和服事者有权得到生活供应，因此这里主要谈生计；译文仍沿用原文“福音”的表达，避免加入超出原文的具体供养方式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“同样……也……”清楚衔接上文论证；“靠福音为生”符合现代汉语习惯，并准确传达本节关于生活供养的重点。
