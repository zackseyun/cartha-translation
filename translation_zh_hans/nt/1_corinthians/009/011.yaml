id: 1CO.9.11
reference: 1 Corinthians 9:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἰ ἡμεῖς ὑμῖν τὰ πνευματικὰ ἐσπείραμεν, μέγα εἰ ἡμεῖς ὑμῶν τὰ σαρκικὰ θερίσομεν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/011.yaml
  text: If we have sown spiritual things among you[a], is it too much if we reap material things from you?
translation:
  language: zh_hans
  text: 我们若把属灵的事播种在你们中间，那么从你们那里收获物质上的供应[a]，难道算过分吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“属肉体的事”。这里指属于身体和日常物质生活的事物，即实际的生活供应，并非指罪性的行为。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ πνευματικὰ
  choice: 属灵的事
  rationale: 中性复数形容词作名词用，广泛指属灵方面的益处或服事；此译法保留原文的宽泛性，不把它限定为某一种恩惠。
- source_word: ἐσπείραμεν
  choice: 播种
  rationale: 延续保罗的农耕比喻，指此前在哥林多人中所作的属灵服事；汉语条件句无需机械标示希腊语不定过去时。
- source_word: μέγα
  choice: 算过分
  rationale: 在反问中，μέγα 所问的是这种要求是否太大或不合理；“算过分”符合现代汉语表达。
- source_word: τὰ σαρκικὰ
  choice: 物质上的供应
  rationale: 此处与“属灵的事”相对，结合上下文指维持身体和日常生活的实际供给，并非带有道德贬义的“属肉体之事”。
- source_word: θερίσομεν
  choice: 收获
  rationale: 保留与“播种”对应的收割比喻；希腊语将来时在此表达预期取得供应，汉语由条件和反问结构自然体现。
- source_word: ὑμῶν
  choice: 从你们那里
  rationale: 将属格自然表达为来源，表明实际供应来自哥林多人。
- source_word: ἡμεῖς
  choice: 我们
  rationale: 保留原文两次明说的主语所带的对照意味，即我们既已播种，也可合理地有所收获。
theological_decisions:
- issue: τὰ σαρκικὰ 与 τὰ πνευματικὰ 的对照
  choice: 理解为服事者所得的物质或生活供应，不含道德上的负面意思。
  alternative: 译作“属肉体的事”，可能被理解为罪性的行为或欲望。
  rationale: 本段论证使徒有权从服事对象那里获得生活供给；对照的是属灵服事与现世物质支持，而不是圣洁与罪恶。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。“播种—收获”保留原文比喻；“物质上的供应”结合上下文传达实际生活供给，同时用脚注交代 σαρκικὰ 的字面表达及其语境含义。
