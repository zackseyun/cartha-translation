id: 1CO.9.15
reference: 1 Corinthians 9:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ἐγὼ δὲ ⸂οὐ κέχρημαι οὐδενὶ⸃ τούτων. οὐκ ἔγραψα δὲ ταῦτα ἵνα οὕτως γένηται ἐν ἐμοί, καλὸν γάρ μοι μᾶλλον ἀποθανεῖν ἤ— τὸ καύχημά μου ⸂οὐδεὶς κενώσει⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/015.yaml
  text: But I have made use of none of these things[a]. Yet I did not write these things so that it should be done this way for me[b], for I would rather die than—no one will nullify my boasting.
translation:
  language: zh_hans
  text: 但这些权利，我一项也没有使用过[a]。我写这些话，并不是要人这样待我，因为我宁可死，也不愿——谁也不能使我所夸的落空[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“这些中的任何一项”；这里是指上文所说获得供养的权利。
    reason: lexical_alternative
  - marker: b
    text: 原文在“也不愿——”处突然中断，随后重新说：“谁也不能使我所夸的落空。”也可按意思补顺为：“我宁可死，也不愿让任何人使我所夸的落空。”
    reason: alternative_reading
lexical_decisions:
- source_word: κέχρημαι
  choice: 使用过
  rationale: 完成时中间语态表示保罗从未利用前文所说的权利；“使用过”自然简洁，不含“滥用”之意。
- source_word: οὐδενὶ τούτων
  choice: 这些权利，我一项也没有
  rationale: 希腊文直译为“这些中的任何一项都没有”，所指由上下文明确为获得供养的权利；在正文中补出“权利”，使现代汉语清楚自然。
- source_word: ἵνα οὕτως γένηται ἐν ἐμοί
  choice: 要人这样待我
  rationale: 该压缩表达意为保罗写这些话并非为了让自己得到前述待遇；此译保留目的关系，并以自然汉语表达。
- source_word: καλὸν γάρ μοι μᾶλλον ἀποθανεῖν
  choice: 因为我宁可死
  rationale: 自然表达比较性偏好和保罗强烈的决心。
- source_word: τὸ καύχημά μου
  choice: 我所夸的
  rationale: καύχημα可指夸口的内容或根据；“我所夸的”保留这种开放性，避免把它仅限于夸口这一行为。
- source_word: κενώσει
  choice: 使……落空
  rationale: 保留“使之成为空、失去效力”的比喻意义，同时符合现代汉语表达。
theological_decisions:
- issue: ἤ之后的突断句法
  choice: 保留“也不愿——”后的破折号，再以“谁也不能……”重新起句
  alternative: 平顺补足为“我宁可死，也不愿让任何人使我所夸的落空”
  rationale: 原文在“也不愿/胜于”之后突然中断，随后重新说“谁也不能使我所夸的落空”。保留突断可呈现保罗强烈而激动的语气，不替原文暗中补全句法。
- issue: καύχημα的具体所指
  choice: 译为较开放的“我所夸的”
  alternative: 译为“我夸口的根据”
  rationale: 上下文指保罗无偿传福音这件事，但该词兼有夸口内容、成果或根据的范围；正文不作过度限定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“这些权利，我一项也没有使用过”以前置宾语突出全面否定；破折号保留原文情绪强烈的突断。
