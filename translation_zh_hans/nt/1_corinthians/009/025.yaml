  text: πᾶς δὲ ὁ ἀγωνιζόμενος πάντα ἐγκρατεύεται, ἐκεῖνοι μὲν οὖν ἵνα φθαρτὸν στέφανον λάβωσιν, ἡμεῖς δὲ ἄφθαρτον.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/025.yaml
  text: Everyone who competes exercises self-control in all things. They do so in order to receive a perishable crown[a], but we an imperishable one.
translation:
  language: zh_hans
  text: 凡参加竞赛的，在一切事上都有节制。他们这样做，是为了得到会朽坏的冠冕[a]；我们却是为了得到不会朽坏的冠冕。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“花冠”；希腊文指竞技比赛中颁给获胜者的冠饰。
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ ἀγωνιζόμενος
  choice: 凡参加竞赛的
  rationale: 泛指每一个参与竞技的人；“参加竞赛”自然传达上下文中的体育竞技意象。
- source_word: πάντα ἐγκρατεύεται
  choice: 在一切事上都有节制
  rationale: πάντα 表示节制所涵盖的范围，不限于饮食；“都有节制”体现持续约束自己的含义。
- source_word: ἐκεῖνοι μὲν οὖν ἵνα
  choice: 他们这样做，是为了
  rationale: 承接前述参赛者，并清楚表达 ἵνα 的目的意义，同时保留与“我们却”之间的对照。
- source_word: φθαρτὸν στέφανον
  choice: 会朽坏的冠冕
  rationale: 保留 στέφανος 的奖赏与荣誉意象，并与后文 ἄφθαρτον 构成鲜明对照；竞技场景中的具体含义由脚注说明。
- source_word: ἡμεῖς δὲ ἄφθαρτον
  choice: 我们却是为了得到不会朽坏的冠冕
  rationale: 希腊文省略了前文可补足的“得到”和“冠冕”。中文补出二者以确保语义完整，并保留对照焦点。
theological_decisions:
- issue: 冠冕所指的奖赏性质
  choice: 保留“冠冕”的竞技奖赏比喻，不明确限定其教义所指
  alternative: 直接解释为永生或天上的奖赏
  rationale: 本节只对比会朽坏与不会朽坏的冠冕，并未进一步界定奖赏，因此不以特定神学体系消解其开放性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“凡……的”适合表达泛指；分号突出参赛者与“我们”的对照。
