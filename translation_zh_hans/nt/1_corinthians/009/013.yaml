  text: οὐκ οἴδατε ὅτι οἱ τὰ ἱερὰ ἐργαζόμενοι ⸀τὰ ἐκ τοῦ ἱεροῦ ἐσθίουσιν, οἱ τῷ θυσιαστηρίῳ ⸀παρεδρεύοντες τῷ θυσιαστηρίῳ συμμερίζονται;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/013.yaml
  text: Do you not know that those who work in the temple eat from the temple[b][a], and those who serve at the altar share in what is offered on the altar?
translation:
  language: zh_hans
  text: 你们岂不知道，从事圣殿事务的人吃从圣殿得来的食物[a]，在祭坛旁侍立的人分得祭坛上的祭物[b]吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“从事神圣事务的人吃从圣殿来的东西。”
    reason: lexical_alternative
  - marker: b
    text: 或较直译：“在祭坛旁侍立的人有份于祭坛。”意思是他们从献在祭坛上的祭物中分得一份。
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ οἴδατε
  choice: 你们难道不知道
  rationale: 保留保罗惯用的反问语气；补出复数“你们”，符合希腊语动词的人称和数，也使现代汉语自然。
- source_word: οἱ τὰ ἱερὰ ἐργαζόμενοι
  choice: 办理圣事的人
  rationale: τὰ ἱερά直指与神圣事物有关的事务或礼仪；译作“办理圣事”既保留祭祀语境，又不把所指过早限定为某一种具体职分。
- source_word: τὰ ἐκ τοῦ ἱεροῦ ἐσθίουσιν
  choice: 吃圣殿所供应的食物
  rationale: 保留“吃”的具体意象，并以“所供应的食物”自然表达这些食物来自圣殿；未进一步说明其具体种类。
- source_word: ἱεροῦ
  choice: 圣殿
  rationale: ἱερόν通常指圣殿建筑或整个圣殿范围；“圣殿”是现代中文圣经语境中清楚而通行的对应词。
- source_word: παρεδρεύοντες
  choice: 在祭坛旁供职的人
  rationale: 该分词兼有在旁侍立和履行职务的含义；“在祭坛旁供职”同时保留位置意象和礼仪服事的功能。
- source_word: θυσιαστηρίῳ
  choice: 祭坛
  rationale: 这是指献祭用祭坛的标准而准确的译法。
- source_word: συμμερίζονται
  choice: 也分得……祭物
  rationale: 该动词表示共同有份或分得一份；结合祭坛语境，用“分得祭坛上的祭物”清楚表达其实际所分得的份额，同时在脚注保留更贴近字面的说法。
theological_decisions:
- issue: 圣职人员从神圣事务中获得生活供给的类比
  choice: 保留圣殿、祭坛和分得祭物的祭祀图景，表达供职者从其圣事中获得食物。
  alternative: 可更直译为“与祭坛一同分受”，不明说所分的是祭物。
  rationale: 本节的论证依赖一个广为人知的原则：从事圣殿和祭坛事务的人从相关祭物中获得份额。正文适度说明宾语，使中文可懂，但不将其套入后来的教会制度或特定教派职分。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“办理圣事”保持礼仪语境但不使用晦涩官衔；“在祭坛旁供职”保留原文的位置与职务双重含义。两个脚注分别交代原文较具体的字面结构和末句“与祭坛一同分受”的隐喻表达。
