  text: Do we not have the right to eat and drink?[a]
translation:
  language: zh_hans
  text: 难道我们没有吃喝的权利吗？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“有权吃喝。”这里的“权利”也可指正当的自由；按保罗在本章的论述，很可能涉及接受物质供养。
    reason: 说明ἐξουσίαν可指正当权利或自由，并交代上下文所指，而不使用现代汉语中易误解为职权范围的“权限”。
lexical_decisions:
- source_word: μὴ οὐκ
  choice: 难道……没有……吗
  rationale: 这一否定组合引出预期肯定回答的反问；此表达既保留反问形式，也自然传达“我们当然有”的语气。
- source_word: ἔχομεν
  choice: 有
  rationale: 直接表达现在所享有或持有的权利，符合现代汉语习惯。
- source_word: ἐξουσίαν
  choice: 权利
  rationale: 此处所指是使徒正当享有的资格或自由，而非统治权或单纯能力；“权利”最贴合上下文，同时不在正文中过度明确其具体实施方式。
- source_word: φαγεῖν καὶ πεῖν
  choice: 吃喝
  rationale: 两个并列不定式表示吃与喝；汉语用凝练自然的“吃喝”即可完整传意。
theological_decisions:
- issue: 使徒所享权利的范围
  choice: 正文保留为“吃喝的权利”，在脚注说明上下文很可能涉及接受物质供养。
  alternative: 直接译成“接受供养的权利”。
  rationale: 哥林多前书第9章的论证聚焦使徒及服事者获得供养的正当权利，但原文在本节只明说“吃喝”；保留其措辞可避免把上下文推论直接写进正文。
translation_notes:
  register: 采用现代、庄重而自然的标准普通话。“难道……吗”体现原文预期肯定回答的反问语气；“吃喝”简洁明白，适合公众诵读。
