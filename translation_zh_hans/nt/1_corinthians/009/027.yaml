  text: ἀλλὰ ὑπωπιάζω μου τὸ σῶμα καὶ δουλαγωγῶ, μή πως ἄλλοις κηρύξας αὐτὸς ἀδόκιμος γένωμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/027.yaml
  text: But I discipline my body and make it my slave[a], lest somehow, after preaching to others[c][b], I myself should become disqualified.
translation:
  language: zh_hans
  text: 但我是严厉地操练自己的身体[a]，使它作我的奴仆[b]，免得我向别人传讲以后，自己反倒不合格[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“重击自己的身体”。这个希腊词本义可指击打眼睛下方、把眼眶打青；这里以此为喻，表示严厉地约束自己。
    reason: lexical_alternative
  - marker: b
    text: 或译“使它为奴”或“奴役它”。
    reason: lexical_alternative
  - marker: c
    text: 或译“被淘汰”、“不蒙认可”或“经不起检验”。“不合格”与上下文的竞技意象相呼应。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: 但
  rationale: 承接上文赛跑和节制的比喻，表达鲜明转折。
- source_word: ὑπωπιάζω
  choice: 严厉地操练
  rationale: 该词本义可指击打眼睛下方，在这里以强烈的拳击形象表达严酷的自我约束；正文采用自然且不误导为自残的说法，并在脚注保留原有画面。
- source_word: μου τὸ σῶμα
  choice: 自己的身体
  rationale: 保留σῶμα的具体所指，不将其泛化为“自己”。
- source_word: δουλαγωγῶ
  choice: 使它成为奴仆
  rationale: 保留“使之为奴”的强烈支配隐喻，不弱化为一般的“控制”。
- source_word: μή πως
  choice: 免得
  rationale: 自然表达否定目的或所担忧的结果；语境中的忧虑意味由整句体现。
- source_word: ἄλλοις κηρύξας
  choice: 向别人传讲以后
  rationale: 体现与格所表示的对象，并将先于主句结果的分词关系清楚译出；“传讲”保留公开宣告的含义。
- source_word: ἀδόκιμος
  choice: 不合格
  rationale: 表达未能通过检验、未获认可之意，并呼应上下文的竞技形象，同时不擅自限定为失去救恩或仅失去奖赏。
- source_word: γένωμαι
  choice: 反倒不合格
  rationale: 在汉语中以“反倒”表达保罗所担忧的反差和可能结果；“免得”已承载虚拟、预期的语气。
theological_decisions:
- issue: 保罗担心自己成为ἀδόκιμος的具体含义
  choice: 译作“不合格”，保留未通过检验或被取消资格的严肃警告
  alternative: 被神最终弃绝；或仅失去事奉资格、奖赏
  rationale: 上下文使用赛跑、节制和得奖的竞技意象，但本节本身没有明确界定后果属于最终救恩还是事奉与奖赏；译文不替经文消除这一神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“严厉地操练”保留上下文的运动员训练语境，脚注补足ὑπωπιάζω更猛烈的拳击画面；“使它成为奴仆”刻意保留δουλαγωγῶ的强烈奴役隐喻。句式简洁，适合经文朗读。
