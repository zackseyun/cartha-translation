  text: εἰ ἄλλοις οὐκ εἰμὶ ἀπόστολος, ἀλλά γε ὑμῖν εἰμι, ἡ γὰρ σφραγίς ⸂μου τῆς⸃ ἀποστολῆς ὑμεῖς ἐστε ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/002.yaml
  text: If I am not an apostle to others[a], yet I certainly am to you, for you are the seal of my apostleship in the Lord.
translation:
  language: zh_hans
  text: 若我对别人不是使徒，至少对你们我是使徒；因为在主里，你们正是我使徒职分的印记[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “印记”也可意译为“凭证”或“证明”。希腊文使用“印章／印记”的形象，表示能确认真实性的东西。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόστολος
  choice: 使徒
  rationale: 这里是保罗为自己受委任的使徒身份辩护，并非泛指普通的使者；“使徒”保留了这一专门含义。
- source_word: ἀλλά γε
  choice: 却确实是
  rationale: ἀλλά表达转折，γε加强语气；“却确实是”自然地传达了两者的合力。
- source_word: σφραγίς
  choice: 印记
  rationale: 原词指用于确认真实性或归属的印章、印记；“印记”既保留比喻，也让上下文中的证明作用可以被理解。
- source_word: ἀποστολή
  choice: 使徒职分
  rationale: 此处指保罗作为使徒所领受的身份与使命；“使徒职分”比单说“使命”更贴合本段的身份辩护。
- source_word: ἐν κυρίῳ
  choice: 在主里
  rationale: 保留保罗书信中这一富有关系性和神学张力的惯用语，不把它窄化为单纯的施事意义“靠着主”。
- source_word: ἄλλοις
  choice: 对别人来说
  rationale: 与“对你们来说”形成清楚的对应，也保留该与格所表达的关系或评价角度。
theological_decisions:
- issue: 保罗关于使徒身份之断言的力度
  choice: 将前半句保留为让步式表达，并以哥林多人作为其使徒职分真实性的印记。
  alternative: 理解为保罗的使徒身份实际上仅限于哥林多人，或他在别人看来根本不是使徒。
  rationale: 本节的句法和上下文具有辩护与反问色彩，并非把保罗的使徒职分严格限制在一个教会；哥林多信徒在主里的存在，正构成其使徒职分的确证。
- issue: “在主里”的修饰范围
  choice: 采用“因为在主里，你们正是……”的语序，保留它既可关联哥林多人之属主身份、也可笼罩整项确证关系的空间。
  alternative: 明确译成“主使你们成为……”，把短语解释为单纯的施事来源。
  rationale: 希腊文ἐν κυρίῳ不要求仅作施事解释；直译式表达更能保存保罗惯用语的关系性与原文可能的修饰张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“即使……却……”呈现让步与强调；分号保持原句论证层次。“印记”保留原文比喻，并以脚注说明其确证含义。
