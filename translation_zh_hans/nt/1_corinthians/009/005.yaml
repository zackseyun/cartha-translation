- from: 难道我们没有权利像其余的使徒、主的弟兄和矶法一样，带着一位作妻子的姊妹[a]同行吗？
  to: 难道我们没有权利像其余的使徒、主的弟兄和矶法一样，带着一位信主的妻子同行吗？
  rationale: 将不自然且可能引起误解的“作妻子的姊妹”改为“信主的妻子”，以符合现代汉语并准确表达原文的语义关系；脚注保留原文“姊妹、妻子”的并列形式。其余措辞忠实且自然，予以保留。
