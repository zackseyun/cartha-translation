id: 1CO.9.5
reference: 1 Corinthians 9:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: μὴ οὐκ ἔχομεν ἐξουσίαν ἀδελφὴν γυναῖκα περιάγειν, ὡς καὶ οἱ λοιποὶ ἀπόστολοι καὶ οἱ ἀδελφοὶ τοῦ κυρίου καὶ Κηφᾶς;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/005.yaml
  text: Do we not have the right to take along a sister as a wife[a], as also the rest of the apostles and the brothers of the Lord and Cephas?
translation:
  language: zh_hans
  text: 难道我们没有权利像其余的使徒、主的弟兄和矶法一样，带着一位信主的妻子同行吗？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξουσίαν
  choice: 权利
  rationale: 本节讨论的是使徒可以正当享有的待遇，而不是抽象的权柄；“权利”贴合上下文，也符合现代汉语表达。
- source_word: ἀδελφὴν γυναῖκα
  choice: 一位作妻子的姊妹
  rationale: 保留两个并列成分：γυνή在这里指妻子，ἀδελφή则表明她是信仰群体中的姊妹。此译法比直接译作“信主的妻子”更贴近原文形式，同时借脚注说明其含义。
- source_word: περιάγειν
  choice: 带着……同行
  rationale: 这里指在事奉旅程中带某人一起出行；“带着……同行”自然地传达该语境中的意思。
- source_word: ὡς καὶ
  choice: 像……一样
  rationale: 以自然的现代汉语表达比较关系；原文的附加意味由所列举的其他使徒、主的弟兄和矶法体现。
- source_word: οἱ λοιποὶ ἀπόστολοι
  choice: 其余的使徒
  rationale: λοιποί指同一群体中其余的人；“其余的使徒”比“其他使徒”更精确。
- source_word: οἱ ἀδελφοὶ τοῦ κυρίου
  choice: 主的弟兄
  rationale: 直译原文的属格结构，不在正文中判定这些人与主具体属于何种亲属关系。
- source_word: Κηφᾶς
  choice: 矶法
  rationale: 保留本节原文所用的闪语名字形式，而不改换为更常见的“彼得”。
theological_decisions:
- issue: “主的弟兄”的确切亲属关系
  choice: 保留“主的弟兄”这一原文称谓
  alternative: 明确译成耶稣的亲兄弟、继兄弟或其他近亲
  rationale: 原文本身没有解决后世关于其具体亲属关系的争论，因此译文不替读者作教义判断。
- issue: ἀδελφὴν γυναῖκα所指的身份
  choice: 译作“一位作妻子的姊妹”，并以脚注说明她是同信者
  alternative: 译作“信主的妻子”或理解为仅仅一位同行的女性信徒
  rationale: γυνή在此比较使徒出行权利的语境中最自然地指妻子，而ἀδελφή说明她也是信仰群体中的姊妹；正文保留原文双重称谓，脚注则避免现代读者误解。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“作妻子的姊妹”刻意保留原文的双重称谓，虽略显特别，但脚注可消除歧义；比较成分前置，使整句符合汉语语序。
