review_pass:
  verdict: revise
  source_fidelity: 译文准确传达了反问句、ἐξουσίαν的正当权利、随行之意，以及与其余使徒、主的弟兄和矶法的比较。惟“一位作妻子的姊妹”虽试图逐字保留并列称谓，在现代汉语中容易被理解为“担任妻子角色的姊妹”，未能清楚表达γυνή在此为“妻子”、ἀδελφή为同信者的限定。
  naturalness: 句子整体通顺，但“作妻子的姊妹”不属自然现代标准汉语。改为“信主的妻子”可在正文中明确而自然地表达“作为信徒的妻子”；原文的字面双重称谓及其语义可由脚注保留。
  terminology: “权利”“其余的使徒”“主的弟兄”“矶法”均恰当。“信主的妻子”避免把“姊妹”误作亲属称呼，同时不对“主的弟兄”的具体亲属关系作教义性断定。
  issues:
  - severity: medium
    issue: “一位作妻子的姊妹”表达生硬且可能歧义。
    rationale: ἀδελφὴν γυναῖκα最自然指“同为信徒的妻子”。汉语“作妻子的姊妹”可能被读为一位“作妻子”的女性信徒，未自然显示“妻子”是核心名词。正文宜采用自然的“信主的妻子”，并以脚注保留字面形式。
  revised_text: 难道我们没有权利像其余的使徒、主的弟兄和矶法一样，带着一位信主的妻子同行吗？
  revised_footnotes:
  - marker: a
    text: 直译“一位姊妹，一位妻子”，即一位同信的妻子。
    reason: 说明原文不寻常的并列称谓，并表明“姊妹”在此指信仰群体中的成员。
  revision_rationale: 将不自然且可能引起误解的“作妻子的姊妹”改为“信主的妻子”，以符合现代汉语并准确表达原文的语义关系；脚注保留原文“姊妹、妻子”的并列形式。其余措辞忠实且自然，予以保留。
