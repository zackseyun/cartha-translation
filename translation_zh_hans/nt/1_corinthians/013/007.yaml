  text: πάντα στέγει, πάντα πιστεύει, πάντα ἐλπίζει, πάντα ὑπομένει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/007.yaml
  text: It bears all things[a], believes all things, hopes all things[b], endures all things.
translation:
  language: zh_hans
  text: 凡事包容[a]，凡事相信[b]，凡事盼望，凡事忍耐。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“凡事遮盖”；“包容”所译的希腊词也可有遮盖、保护或承受的意思。
    reason: lexical_alternative
  - marker: b
    text: 或译“凡事信任”；这里不是说爱会轻信，而是说爱倾向于信任。
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: 凡事
  rationale: 四次重复译为“凡事”，既保留原文整齐有力的排比，也自然表达其涵盖一切的修辞广度。
- source_word: στέγει
  choice: 包容
  rationale: στέγω可指遮盖、保护，也可引申为承受。“包容”在现代汉语中简洁自然，能兼顾容纳、承担的语感；“遮盖”的可能含义以脚注保留。
- source_word: πιστεύει
  choice: 相信
  rationale: 直接对应πιστεύω的基本义，并保持四个短句的简洁平行；此处描述爱倾向信任，并非毫无分辨地轻信。
- source_word: ἐλπίζει
  choice: 盼望
  rationale: 准确表达ἐλπίζω的持续性、特征性行动，也符合中文圣经语体和本节排比。
- source_word: ὑπομένει
  choice: 忍耐
  rationale: 表达ὑπομένω在压力之下坚持、承受到底的含义，措辞简练，并与全段对爱的描述协调。
theological_decisions:
- issue: 四次πάντα所表达的范围
  choice: 保留“凡事”的全面性修辞，将其理解为对爱之恒常品格的描述。
  alternative: 把它理解为爱会毫无分辨地认可、相信或接受任何事。
  rationale: 上下文以诗性排比描述爱的品格；保留原文张力，不把“凡事”缩窄，同时也不在正文中加入“轻信”或“赞同一切”的含义。
- issue: πιστεύει的信任意味
  choice: 正文译“相信”，脚注说明也可译“信任”。
  alternative: 正文直接译为“信任”。
  rationale: “相信”较直接地保留词汇对应和排比节奏；脚注则保存其在此处倾向信任的语义，不将爱刻画为轻信。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“凡事”四次重复，保留原文的节奏、广度与修辞力度；全句简洁，适合公开诵读。
