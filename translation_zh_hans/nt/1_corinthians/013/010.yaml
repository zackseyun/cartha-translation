  text: ὅταν δὲ ἔλθῃ τὸ τέλειον, ⸀τὸ ἐκ μέρους καταργηθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/010.yaml
  text: But when the perfect comes[b][a], the partial will be set aside.
translation:
  language: zh_hans
  text: 但那完全的[a]来到时，那不完全的就会被废去[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“那完整的”或“那成熟的”。“那完全的”（希腊文：τὸ τέλειον）所指历来有不同理解；可指完全、完整或成熟，也可指与现今不完全状态相对的末世圆满。
    reason: alternative_reading
  - marker: b
    text: 或译“就会被取消”“就会消逝”或“就会被除去”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: ……时
  rationale: 引出带有将来指向的时间从句；在此译为“……时”，比表示反复情形的“每当”更符合语境。
- source_word: δὲ
  choice: 但
  rationale: 承接上文关于知识和预言都只是局部的论述，并表达温和的转折。
- source_word: ἔλθῃ
  choice: 来到
  rationale: ὅταν 后的不定过去时虚拟语气指向预期中的将来事件；“来到”自然保留其动态意象。
- source_word: τὸ τέλειον
  choice: 那完全的
  rationale: τέλειον 可表示完全、完整或成熟；采用名词化的“那完全的”，不在正文中限定其具体所指，从而保留原文的开放性。
- source_word: τὸ ἐκ μέρους
  choice: 这局部的
  rationale: 带冠词的介词短语在此作名词使用；“这局部的”与“那完全的”形成对应，并保留“仅为一部分”的含义。
- source_word: καταργηθήσεται
  choice: 就会被废去
  rationale: 将来时被动语态表示使之失效或终止；“被废去”保留被动形式和停止发挥作用的语义，同时不必理解为彻底毁灭。
theological_decisions:
- issue: τὸ τέλειον 的所指
  choice: 正文笼统译作“那完全的”，不明确指定其所指。
  alternative: 也可译作“那完整的”或“那成熟的”；解释上有人理解为完全或成熟的状态，也有人理解为与基督再来、面对面认识相关的末世圆满，或理解为完备的圣经正典。
  rationale: 希腊文本在本节没有明确说明其所指。中性单数名词化形式可支持抽象或整体性的含义，却不能独自裁定具体解释，因此译文应保留其神学张力，避免替读者预先作出教义判断。
translation_notes:
  register: 采用现代、庄重而简洁的普通话。“那完全的／这局部的”有意保留希腊文两个名词化表达之间的对照；虽略带凝练的书面色彩，但可避免用“事物”“状态”等词过早限定原文所指。所有脚注标记均置于其所说明的短语之后。
