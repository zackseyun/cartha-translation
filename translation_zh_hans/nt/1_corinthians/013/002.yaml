  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ⸂καὶ ἐὰν⸃ ἔχω προφητείαν καὶ εἰδῶ τὰ μυστήρια πάντα καὶ πᾶσαν τὴν γνῶσιν, ⸄καὶ ἐὰν⸅ ἔχω πᾶσαν τὴν πίστιν ὥστε ὄρη ⸀μεθιστάναι, ἀγάπην δὲ μὴ ἔχω, οὐθέν εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/002.yaml
  text: And if I have prophecy and understand all mysteries and all knowledge[a], and if I have all faith so as to move mountains, but do not have love, I am nothing.
translation:
  language: zh_hans
  text: 即使我能说预言，明白一切奥秘和一切知识；即使我有足以移山的全备信心[a]，却没有爱，我就什么也不是。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“全然的信靠”；较不可能译作“完全的忠信”。希腊词在不同语境中可有这些含义，但这里很可能指非凡的信心。
    reason: 保留πίστις的词义选择，并说明本节移山语境下较可能的含义。
lexical_decisions:
- source_word: προφητείαν
  choice: 先知传言的能力
  rationale: 保留该词与先知性传言有关的宽广含义，同时使“有预言”这一不自然的直译成为现代汉语可懂的表达；不把它限定为职分，也不只理解为预告未来。
- source_word: εἰδῶ
  choice: 明白
  rationale: 与“一切奥秘”搭配自然，表达认知和领会，也与后面的名词“知识”保持形式与意义上的区分。
- source_word: μυστήρια
  choice: 奥秘
  rationale: “奥秘”是保罗书信中这一术语自然且庄重的译法，保留其指向隐秘或由启示显明之事的神学语域。
- source_word: πᾶσαν τὴν γνῶσιν
  choice: 具备一切知识
  rationale: “知识”直接对应 γνῶσις；用“具备”承接希腊文整体结构，并避免汉语中生硬的“知道一切知识”。
- source_word: πᾶσαν τὴν πίστιν
  choice: 全备的信心
  rationale: 上下文强调程度达到足以移山的信心。“全备”自然表达 πᾶσαν 的总体和极致意味，又不将 πίστις 技术性地限定为得救的信心。
- source_word: ὥστε ὄρη μεθιστάναι
  choice: 足以移山
  rationale: 简洁保留结果或能力意味以及“移山”的强烈意象，符合现代汉语表达。
- source_word: ἀγάπην
  choice: 爱
  rationale: “爱”是现代汉语对 ἀγάπη 最宽广、自然的对应，不将其缩窄为慈善行为。
- source_word: οὐθέν εἰμι
  choice: 我就什么也不是
  rationale: 保留保罗断然的自我否定，语气有力，不用“毫无价值”等解释性扩展替代原文。
theological_decisions:
- issue: προφητεία是否应明确译作一种属灵恩赐
  choice: 先知传言的能力
  alternative: 先知讲道的恩赐
  rationale: 本节位于属灵恩赐的语境中，但原文只用名词 προφητεία，没有明说“恩赐”。正文表达其能力层面，却不增添原文未明说的分类。
- issue: πᾶσαν τὴν πίστιν在移山语境中的含义
  choice: 全备的信心
  alternative: 完全的信靠；全然的忠信
  rationale: “足以移山”表明这里最可能指非凡的信心或信靠，而非把“忠信”作为品格来描述；同时用脚注保留 πίστις 的词义范围，避免把这里的用法等同于某一教义体系中的技术术语。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“先知传言”避免把预言缩窄为预测未来；分号呈现两组递进的假设条件，“却没有爱”保留全节的强烈转折。
