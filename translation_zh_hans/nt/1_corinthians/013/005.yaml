base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/005.yaml
  text: it does not behave disgracefully[a], it does not seek its own, it is not provoked[e][d][c][b], it does not count the wrong.
translation:
  language: zh_hans
  text: 不做不合宜的事[a]，不求自己的益处[b]，不被激怒[c]，不把恶记在账上[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不做失体统的事”或“不做失礼的事”。
    reason: lexical_alternative
  - marker: b
    text: 直译：“不求自己的事”；意思是不专求自己的利益。
    reason: lexical_alternative
  - marker: c
    text: 也可译：“不受激惹”或“不动怒”。原文没有明说“轻易”。
    reason: source_form
  - marker: d
    text: 也可译：“不计算恶”或“不记念所受的伤害”。原文使用记账、计算一类的词，且“恶”为单数；“所受的伤害”是按上下文作出的解释。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσχημονεῖ
  choice: 做失礼的事
  rationale: 该动词指举止不合宜、失体统或可耻。“做失礼的事”在现代汉语中自然，并保留其社会与道德层面的宽泛含义，不限于言语粗鲁。
- source_word: ζητεῖ τὰ ἑαυτῆς
  choice: 求自己的益处
  rationale: 原文直译为“寻求自己的事物”，是自我求取的表达。补出“益处”使汉语清楚，同时不将其收窄为“坚持自己的方式”。
- source_word: παροξύνεται
  choice: 轻易动怒
  rationale: 该形式表示受到激惹而产生尖锐的恼怒。“动怒”准确表达语境中的情绪反应；“轻易”虽非独立对应的希腊副词，却在汉语中自然表达此处不因刺激而发怒的性情，因此用脚注提示较贴近形式的译法。
- source_word: λογίζεται τὸ κακόν
  choice: 把所受的恶记在账上
  rationale: λογίζεται具有计算、归账之意，τὸ κακόν可指恶事或所受的伤害。此译保留记账隐喻，也以“所受的”明确本节最自然的人际语境；脚注保留更形式对应的可能译法。
- source_word: ἀγάπη（由上文承接的隐含主语）
  choice: 省略主语
  rationale: 汉语可在连续排比中自然承接上文的“爱”，无需每个分句重复主语。
theological_decisions:
- issue: 是否在 παροξύνεται 的译文中加入“轻易”
  choice: 不轻易动怒
  alternative: 不被激怒／不动怒
  rationale: 原文没有对应“轻易”的独立副词，因此更形式化的译法有其依据；但汉语“不被激怒”容易暗示外界无法激起任何反应，而“不动怒”又可能被理解为绝对否定一切愤怒。“不轻易动怒”自然表达爱不受刺激便发怒的品格，并以脚注交代原文形式。
- issue: λογίζεται τὸ κακόν 是泛指思想恶事，还是指记住别人所行的恶
  choice: 不把所受的恶记在账上
  alternative: 不计算恶／不思念恶事
  rationale: λογίζομαι的记账意义与本段人际关系语境支持“记账”理解；但τὸ κακόν本身未明说行为者或受害者，因此脚注保留较直译的范围，避免把解释冒充唯一含义。
translation_notes:
  register: 采用现代、庄重且易懂的排比句式，承接上文以“爱”为主语。四个分句保持简洁；对原文中较难在汉语里同时保留形式与自然度的地方，用脚注说明词义范围与真实歧义。
