  text: 因为我们知道的只是一部分[a]，我们说预言也只是一部分。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“部分地”；希腊语原文是一个意为“部分地”的习语，字面有“从一部分”之意，并在两个分句中重复，以形成强调。
    reason: 词义备选及原文修辞说明
lexical_decisions:
- source_word: ἐκ μέρους
  choice: 只是部分
  rationale: 该短语意为“部分地”或“只是一部分”。译作“只是部分”既自然地表达有限性，也保留两处重复及其与下文“完全”之物的对照。
- source_word: γὰρ
  choice: 因为
  rationale: γάρ承接上文作解释；现代汉语用“因为”能清楚、自然地体现这一逻辑关系。
- source_word: γινώσκομεν
  choice: 我们所知道的
  rationale: γινώσκω在此指“知道、认识”。采用“所知道的”可与“只是部分”自然衔接，而不额外解释为更深层的“领悟”。
- source_word: καὶ
  choice: 也
  rationale: καί连接两个平行分句；汉语在第二分句用“也”，能自然突出二者同样具有局限性。
- source_word: προφητεύομεν
  choice: 所说的预言
  rationale: 该动词指发出先知性言语。译作“所说的预言”保留其先知性言说的范围，不将其缩减为预测未来或一般讲道，并使平行句式符合现代汉语。
theological_decisions:
- issue: 教会中先知性活动的含义
  choice: 译为“所说的预言”，不限定为预测未来或一般讲道
  alternative: “预告未来”或“讲道”
  rationale: 上下文涉及属灵恩赐，προφητεύω可泛指受感而发出的先知性言语；保持宽泛表述，可避免替原文解决有争议的神学问题。
- issue: 知识与预言的有限性
  choice: 两次保留“只是部分”的表达
  alternative: 将其中一处改写为“并不完全”
  rationale: 原文两次重复ἐκ μέρους，以平行结构强调当前知识和预言皆有限；保留重复也维持其与下一节“完全”来到时的张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。通过“所知道的……所说的预言……”形成自然的汉语平行结构，并保留原文“部分”的重复；不把“说预言”限定为预告未来或一般讲道。
