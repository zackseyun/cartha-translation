  source_fidelity: 译文准确呈现了爱与预言、方言、知识之间的对照，也保留了καταργέω与παύω的用词区别。不过，“先知预言”对προφητεῖαι略显重复且不够贴合原文的普通复数名词；“衰败”主要指逐渐衰落或败坏，不是此处πίπτει在语境中所表达的恒久、不失效之意。
  naturalness: “爱永不衰败”不如现代汉语和本段庄重语体中常用的“爱永不止息”自然。“说方言终将停止”虽可理解，却把原文并列名词“方言”转换为动作短语；直接保留“方言”可更清楚维持原文结构。
  terminology: “爱”“方言”“知识”均合宜。“预言”足以表达προφητεῖαι，无须加入“先知”限定。“被废去”可保留，以对应两处被动的καταργέω；两处应保持一致。
