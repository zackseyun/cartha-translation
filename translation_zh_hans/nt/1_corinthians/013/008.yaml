    rationale: “衰败”通常描述事物逐渐衰落、败坏，较少表达此处与短暂恩赐相对的“永不止息／永不失效”。“爱永不止息”既符合上下文，也不必把πίπτει与后文的παύσονται完全混同。
  - severity: low
