  text: Ἡ ἀγάπη οὐδέποτε ⸀πίπτει. εἴτε δὲ προφητεῖαι, καταργηθήσονται· εἴτε γλῶσσαι, παύσονται· εἴτε γνῶσις, καταργηθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/008.yaml
  text: Love never fails[a]. But whether there are prophecies, they will be set aside; whether tongues, they will cease; whether knowledge[c][b], it will be set aside.
translation:
  language: zh_hans
  text: 爱永不止息[a]。至于预言，终将被废去；方言，终将停止[b]；知识，也终将被废去[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “永不止息”也可译作“永不失败”“永不坠落”或“永不终结”。
    reason: lexical_alternative
  - marker: b
    text: “方言”也可译作“各种语言”。
    reason: lexical_alternative
  - marker: c
    text: 这里译作“被废去”的动词，与本节“预言”分句中的动词相同。
    reason: cross_reference
lexical_decisions:
- source_word: Ἡ ἀγάπη
  choice: 爱
  rationale: “爱”是现代汉语中自然、宽广的对应词，承接本章所论的爱，不把它缩窄为施舍或慈善。
- source_word: οὐδέποτε πίπτει
  choice: 永不衰败
  rationale: πίπτει本义可指“倒下”，在这里与各样恩赐终止形成对照；“衰败”既表达爱不会失效或败落，也不完全等同于后文表示废去、停止的动词。
- source_word: προφητεῖαι
  choice: 先知预言
  rationale: 复数所指是先知性的言说或信息；“先知预言”比单说“预言”更清楚地保留其属灵恩赐语境。
- source_word: καταργηθήσονται / καταργηθήσεται
  choice: 终将被废去
  rationale: 两处为同一动词的不同数形式，因此采用一致译法；被动式“被废去”保留原文语态，并表达其作用终止而不必断言被毁灭。
- source_word: γλῶσσαι
  choice: 说方言
  rationale: 结合哥林多前书12—14章，译为“说方言”可自然指向正在讨论的属灵现象，同时不判定这些言语究竟属于已知人类语言还是其他类型。
- source_word: παύσονται
  choice: 终将停止
  rationale: 保留此词与καταργέω的用词差异；“停止”自然表达不再继续。
- source_word: γνῶσις
  choice: 知识
  rationale: 采用保罗书信中常见且与下文“知道得有限”相衔接的译法，不将其解释性地缩窄为某一种知识。
theological_decisions:
- issue: πίπτει在“爱永不……”中的含义
  choice: 爱永不衰败
  alternative: 爱永不失败；爱永不止息；爱永不倒下
  rationale: “衰败”兼顾“倒下、失败”的词汇形象和上下文中爱的恒久性，同时避免把它直接同化为后面“废去”或“停止”的措辞。脚注保留其他合理理解。
- issue: γλῶσσαι在本章中的所指
  choice: 说方言
  alternative: 各种语言；舌音
  rationale: “说方言”是现代中文教会语境中可识别的术语，但译文本身不裁定这种恩赐是否必然是已知的人类语言，从而保留争议和神学张力。
- issue: καταργέω两次出现的对应关系
  choice: 两处均译为“被废去”
  alternative: 分别译为“归于无用”或“不复存在”
  rationale: 原文在“先知预言”和“知识”两个分句中使用同一动词，统一译法使读者能够看见这一修辞和语义联系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“终将”自然表达三个将来时，并突出爱恒久与恩赐暂时的对照。分号呈现原文三个并列分句。所有脚注标记均置于其所解释的正文成分之后。
