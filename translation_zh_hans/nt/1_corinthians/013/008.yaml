  to: 爱永不止息[a]。至于预言，终将被废去；方言，终将停止[b]；知识，也终将被废去[c]。
  rationale: 修订以“爱永不止息”更自然地表达πίπτει在本段中爱的恒久性，同时以脚注保留“失败”“坠落”等词汇可能性。将“先知预言”简化为“预言”，并将“说方言”改为“方言”，使中文更贴近原文三个并列名词分句的结构。两处καταργέω继续一致译为“被废去”，παύω则译为“停止”，保留原文的动词差异。
