id: 1CO.13.3
reference: 1 Corinthians 13:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ⸂καὶ ἐὰν⸃ ψωμίσω πάντα τὰ ὑπάρχοντά μου, ⸄καὶ ἐὰν⸃ παραδῶ τὸ σῶμά μου, ἵνα ⸀καυθήσομαι, ἀγάπην δὲ μὴ ἔχω, οὐδὲν ὠφελοῦμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/003.yaml
  text: And if I give away all my possessions[a], and if I hand over my body so that I may be burned, but do not have love, I gain nothing.
translation:
  language: zh_hans
  text: 即使我把自己所有的财物全都分出去，又把自己的身体交出去，好让自己被焚烧[a]，却没有爱，这对我也毫无益处。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“好让我可以夸耀”，而不是“好让自己被焚烧”。
    reason: textual_variant
lexical_decisions:
- source_word: ψωμίσω
  choice: 分出去
  rationale: 该动词本指把食物一口一口分给人，在这里与“所有的财物”连用，表示逐一分赠、施予。译作“分出去”自然明白，也不擅自补出特定受赠对象。
- source_word: πάντα τὰ ὑπάρχοντά μου
  choice: 自己所有的财物全都
  rationale: 这一表达指本人拥有的产业或物质资财。“所有的财物”保留具体的财产含义，“全都”传达 πάντα 的完整范围。
- source_word: παραδῶ
  choice: 交出去
  rationale: παραδίδωμι 表示交付、交出。这里不译作“牺牲”，以免提前限定行为的神学意义；“交出去”也保留主动将身体置于某种处置之下的意味。
- source_word: τὸ σῶμά μου
  choice: 自己的身体
  rationale: 按具体名词直译，不作隐喻性扩展。与前句“自己所有的财物”呼应，中文采用“自己的”较为顺畅。
- source_word: ἵνα καυθήσομαι
  choice: 好让自己被焚烧
  rationale: ἵνα 引出目的或预期结果，καυθήσομαι 按所给 SBLGNT 正文理解为“被烧”。“好让”保留从属关系，“被焚烧”保持被动语态和庄重语体。
- source_word: ἀγάπην
  choice: 爱
  rationale: ἀγάπη 在本章指爱；现代汉语用“爱”清楚自然，不采用容易带有狭窄施舍含义的措辞。
- source_word: οὐδὲν ὠφελοῦμαι
  choice: 这对我也毫无益处
  rationale: 该被动动词表示本人得不到任何益处。“对我毫无益处”准确保留受益者为“我”，也比生硬的被动直译更符合现代汉语。
- source_word: καὶ ἐὰν ... καὶ ἐὰν
  choice: 即使……又……
  rationale: 两个并列的条件句构成递进式假设。中文以“即使……又……”保留两项极端行动的并列与递进，同时避免重复“即使”造成拗口。
theological_decisions:
- issue: 目的从句中的文本异文
  choice: 正文按 SBLGNT 的 καυθήσομαι 译为“被焚烧”。
  alternative: 部分抄本作 καυχήσωμαι，可译为“使我可以夸耀”。
  rationale: 所给原文版本采用“被焚烧”的读法，因此正文依此翻译。另一读法会使经文从身体遭焚烧转为夸耀，显著影响理解，故在脚注中透明保留，不在正文中擅自调和。
- issue: 极端施予与爱的关系
  choice: 将 οὐδὲν ὠφελοῦμαι 译为“这对我也毫无益处”。
  alternative: 可译作“我什么也得不到”。
  rationale: 正文不把“益处”具体解释为救恩、奖赏或人的称赞，以保留保罗原句未加限定的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“财物”“交出去”“焚烧”“毫无益处”兼顾可读性与经文语体；避免补入“穷人”“殉道”“献祭”等原文未明说的解释。脚注标记紧随其所说明的“被焚烧”。
