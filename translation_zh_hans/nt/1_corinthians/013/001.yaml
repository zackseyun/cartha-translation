  text: Ἐὰν ταῖς γλώσσαις τῶν ἀνθρώπων λαλῶ καὶ τῶν ἀγγέλων, ἀγάπην δὲ μὴ ἔχω, γέγονα χαλκὸς ἠχῶν ἢ κύμβαλον ἀλαλάζον.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/001.yaml
  text: If I speak in the tongues of men and of angels[a], but do not have love[c][b], I have become sounding bronze or a clashing cymbal.
translation:
  language: zh_hans
  text: 我若说人和天使的语言[a]，却没有爱，我就成了鸣响的铜器[b]，或铿锵作响的钹。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “语言”也可译作“方言”。这个希腊词可指舌头或语言；在哥林多前书中也用于所讨论的受感而说的方言。
    reason: lexical_alternative
  - marker: b
    text: “鸣响的铜器”也可译作“震响的铜”。原文指发声的铜或铜制物，并未明确说明是哪一种乐器。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐὰν
  choice: 若
  rationale: 引出假设条件，简洁保留保罗层层推进的修辞结构；不额外加入“即使”所可能带出的让步意味。
- source_word: ταῖς γλώσσαις
  choice: 语言
  rationale: γλῶσσα可指舌头，也可指语言或受感而说的方言。“语言”在现代汉语中自然，并以脚注保留其在哥林多书信语境中也可译作“方言”的可能。
- source_word: τῶν ἀνθρώπων
  choice: 人
  rationale: 这里指人类，与天使相对；汉语“人”自然包含所有人，无须引入男性限定。
- source_word: λαλῶ
  choice: 说
  rationale: 准确表达说话这一动作，并与“语言”自然搭配。
- source_word: τῶν ἀγγέλων
  choice: 天使
  rationale: 与人类形成递进对照，此处所指以天上的使者为宜，而非一般的人间使者。
- source_word: ἀγάπην
  choice: 爱
  rationale: 现代汉语中最直接、宽广的对应词，避免使用可能缩窄为施舍或慈善的表达。
- source_word: δὲ μὴ ἔχω
  choice: 却没有
  rationale: “却”清楚表达反差，“没有”自然表达不具备爱。
- source_word: γέγονα
  choice: 我就成了
  rationale: 保留完成时所体现的结果状态，也保留第一人称自我陈述。
- source_word: χαλκὸς ἠχῶν
  choice: 鸣响的铜器
  rationale: χαλκός首先指铜或青铜，也可转指铜制物；“铜器”使汉语意象可理解，同时不武断指定为锣等某一种乐器。
- source_word: κύμβαλον ἀλαλάζον
  choice: 铿锵作响的钹
  rationale: κύμβαλον明确指钹；“铿锵作响”传达ἀλαλάζον响亮而强烈的声响，使与爱相对的空洞噪声意象鲜明。
theological_decisions:
- issue: “人和天使的语言”是实指还是夸张
  choice: 直译为“人和天使的语言”，不判定天使是否实际拥有独特语言
  alternative: 理解为真实的天上语言；或理解为指向最高言语能力的修辞夸张
  rationale: 原文的条件句容许实指和修辞性理解，翻译不应借措辞预先解决有关方言或天使语言的神学争论。
- issue: ἀγάπη的表达范围
  choice: 译作“爱”
  alternative: 慈爱；仁爱
  rationale: “爱”保留本章概念的广度，不把它限定为某一种德行、情感或慈善行为。
- issue: 声音比喻的具体器物
  choice: 译作“鸣响的铜器”，不明确指定为锣
  alternative: 鸣锣；响铜；震响的铜
  rationale: 原文χαλκός没有明确命名某一种乐器；保留较宽泛的铜制发声物，可避免把解释写进正文。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以“若……却……”保持保罗条件句的节奏；“铿锵作响”增强听觉形象，但不添加原文没有的神学解释。所有脚注标记均置于相关词语之后。
