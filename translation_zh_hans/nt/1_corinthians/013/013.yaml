id: 1CO.13.13
reference: 1 Corinthians 13:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: νυνὶ δὲ μένει πίστις, ἐλπίς, ἀγάπη· τὰ τρία ταῦτα, μείζων δὲ τούτων ἡ ἀγάπη.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/013.yaml
  text: 'And now these three remain: faith[a], hope, and love[c][b]. But the greatest of these is love.'
translation:
  language: zh_hans
  text: 而如今[a]，信[b]、望、爱这三样长存[c]；其中最大的是爱。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“但如今”。希腊语连接词δέ既可表示承接，也可表示轻微转折。
    reason: lexical_alternative
  - marker: b
    text: “信”也可理解为“信靠”；这里不大可能是“忠信”的意思。
    reason: alternative_reading
  - marker: c
    text: “长存”也可译为“继续存在”或“持续”。
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: 而如今
  rationale: νυνί表示“如今、现在”，δέ在这里可作承接，也可带轻微转折。“而如今”自然地保留这两层话语功能；另一种理解见脚注。
- source_word: μένει
  choice: 长存
  rationale: μένω在本句表示继续存在、持久不消逝，与上文那些终必止息的恩赐形成对照。“长存”简洁、庄重，又符合现代汉语表达。
- source_word: πίστις
  choice: 信
  rationale: 在“信、望、爱”这一保罗书信中的并列组合里，πίστις最自然地指信心或信靠。“信”既保留这组熟知的简洁形式，也不把含义限定为人的忠信。
- source_word: ἐλπίς
  choice: 望
  rationale: ἐλπίς指盼望。“望”在“信、望、爱”的固定并列中清楚、凝练；其完整含义为“盼望”。
- source_word: ἀγάπη
  choice: 爱
  rationale: ἀγάπη在本章指爱。“爱”是准确、自然且不带古旧色彩的现代汉语对应词。
- source_word: τὰ τρία ταῦτα
  choice: 这三样
  rationale: 该短语回指刚列出的信、望、爱。“这三样”符合现代汉语习惯，并明确三者构成一组。
- source_word: μείζων δὲ τούτων ἡ ἀγάπη
  choice: 其中最大的是爱
  rationale: μείζων虽为比较级，但与τούτων连用是在三者之中作比较，汉语用“其中最大”最自然地表达爱居首位的意思。
theological_decisions:
- issue: πίστις在保罗神学语境中的含义
  choice: 信
  alternative: 信靠；忠信
  rationale: 本节的“信、望、爱”组合支持“信／信心”的理解；“信靠”可说明其语义范围，而“忠信”在这里可能性较低。译文不把该词扩展为特定宗派对信心的定义。
- issue: μένει是否明确表示永恒不止息
  choice: 长存
  alternative: 仍然存在；持续
  rationale: 原文强调三者相对于会止息之事继续存留，但本节本身没有详述三者存留的时间范围。“长存”表达持久性，却不在正文中额外界定其末世论期限。
- issue: μείζων的比较级表达
  choice: 其中最大的是爱
  alternative: 爱比这些更大
  rationale: 原文将爱与所列三者比较。汉语用最高级式表达能自然呈现组内排序，同时不添加爱为何最大的解释。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语，并保留“信、望、爱”这一广为人知且凝练的三项并列。语序略作汉语化处理，但维持原文先列三者、后突出爱的结构。所有词义分歧均以脚注说明，不在正文中消解原文可能保留的时间与话语关系张力。
