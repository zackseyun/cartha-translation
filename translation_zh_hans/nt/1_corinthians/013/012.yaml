source:
  edition: SBLGNT
  text: βλέπομεν γὰρ ἄρτι δι’ ἐσόπτρου ἐν αἰνίγματι, τότε δὲ πρόσωπον πρὸς πρόσωπον· ἄρτι γινώσκω ἐκ μέρους, τότε δὲ ἐπιγνώσομαι καθὼς καὶ ἐπεγνώσθην.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/012.yaml
  text: For now we see in a mirror[a], dimly, but then face to face. Now I know in part, but then I will know fully, just as I also have been fully known.
translation:
  language: zh_hans
  text: 因为我们如今借着镜子观看，所见如谜[a]；到那时却要面对面地相见。现在我所知道的只是一部分；到那时，我就会完全知道，正如我也已经被完全知道一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“在谜中”。这里强调如今的观看是间接而难以完全明白的；也可译作“模糊不清”。
    reason: 说明ἐν αἰνίγματι的字面意义及常见解释性译法。
lexical_decisions:
- source_word: βλέπομεν
  choice: 我们……观看
  rationale: 保留视觉隐喻，也符合庄重而自然的现代汉语表达。
- source_word: ἄρτι
  choice: 现在
  rationale: 与 τότε“到那时”形成清楚的时间对照。
- source_word: δι’ ἐσόπτρου
  choice: 借着镜子
  rationale: διά加属格表示媒介；“借着”既保留经由镜子的间接性，也比“穿过镜子”更符合汉语习惯。
- source_word: ἐν αἰνίγματι
  choice: 所见如谜
  rationale: αἴνιγμα本义为“谜、谜语”；此译保留间接而难解的感知，不把它缩减为单纯的视觉模糊。
- source_word: πρόσωπον πρὸς πρόσωπον
  choice: 面对面
  rationale: 自然准确地表达直接、无中介的相见。
- source_word: γινώσκω ἐκ μέρους
  choice: 我所知道的只是一部分
  rationale: 准确传达“部分地知道”，并使现代汉语自然流畅。
- source_word: ἐπιγνώσομαι
  choice: 我就会完全知道
  rationale: 体现与当前“只是一部分”的对比，同时不引申为拥有神那样无所不知的知识。
- source_word: καθὼς καὶ ἐπεγνώσθην
  choice: 正如我也已经被完全知道一样
  rationale: 保留与前句ἐπιγνώσομαι的词语呼应及原文被动语态，不明说施动者。
theological_decisions:
- issue: 将来之知识的范围
  choice: 完全知道
  alternative: 知道一切／无所不知
  rationale: 原文强调将来的充分认识与现在的部分认识相对，却没有断言人将拥有穷尽一切的神圣全知；因此保留这种张力。
- issue: 被动式ἐπεγνώσθην的施动者
  choice: 保留“被完全知道”，不补出主语
  alternative: 被神完全知道
  rationale: 上下文很可能暗示神是认识者，但本句原文没有明说，译文不应替文本消除这一含蓄之处。
translation_notes:
  register: 采用现代、庄重且易懂的简体中文。“借着镜子观看，所见如谜”兼顾希腊文的媒介结构与谜语意象；分号呈现两组“现在／到那时”的平行对照。
