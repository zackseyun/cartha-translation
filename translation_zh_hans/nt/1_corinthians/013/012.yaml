  to: 因为我们如今借着镜子观看，所见如谜[a]；到那时却要面对面地相见。现在我所知道的只是一部分；到那时，我就会完全知道，正如我也已经被完全知道一样。
  rationale: 仅作必要的汉语句法与表达修订：以「面对面地相见」补足原文图像在汉语中的谓语，删去首句冗余的「是」。其余措辞及脚注均可保留，继续体现原文的词汇呼应、被动含蓄和认识范围的限定。
