  yaml_path: translation/nt/1_corinthians/013/006.yaml
  text: it does not rejoice in unrighteousness, but rejoices with the truth.
translation:
  language: zh_hans
  text: 不因不义而欢喜[a]，却与真理一同欢喜[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不义”也可译作“恶行”或“不公”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“却因真理而欢喜。”希腊语复合动词既可表示与……一同欢喜，也可表示因……而欢喜。
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρει
  choice: 欢喜
  rationale: χαίρω表示喜乐、欣然；“欢喜”自然庄重，并与后面的 συγχαίρει 保持动词呼应。
- source_word: ἐπὶ τῇ ἀδικίᾳ
  choice: 因不义而
  rationale: ἐπί加与格在此表示欢喜的缘由或对象；“因……而欢喜”符合现代汉语习惯。ἀδικία涵盖不义、恶行和不公，“不义”保留其宽广的伦理及神学意味。
- source_word: συγχαίρει
  choice: 与……一同欢喜
  rationale: 该复合动词中的 συν- 可表达共同欢喜；此译法明确保留这一含义，同时不排除“因真理而欢喜”的语义可能。
- source_word: δὲ
  choice: 却
  rationale: δέ在此连接鲜明对比的正反陈述；“却”简洁自然。
- source_word: τῇ ἀληθείᾳ
  choice: 真理
  rationale: ἀλήθεια与ἀδικία相对，既可指真实、诚实，也可能带有道德及福音层面的广义内涵；“真理”保留这种开放性。
theological_decisions:
- issue: ἀδικία在保罗伦理对比中的译法
  choice: 不义
  alternative: 恶行；不公
  rationale: “不义”能涵盖普遍的道德错误和与公义相反的状态，不把词义缩窄为具体恶行或社会不公。
- issue: συγχαίρει与τῇ ἀληθείᾳ的关系
  choice: 与真理一同欢喜
  alternative: 因真理而欢喜
  rationale: “与……一同欢喜”保留复合动词 συν- 的共同参与意味；但希腊语也可理解为以真理为欢喜的对象，因此以脚注保留另一可能。
translation_notes:
  register: 采用现代、简洁而庄重的书面汉语；保持前后“欢喜”的修辞平行，并保留“不义／真理”的伦理对照及原文中 συγχαίρει 的语义张力。
