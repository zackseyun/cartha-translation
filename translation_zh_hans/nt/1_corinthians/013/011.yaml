source:
  edition: SBLGNT
  text: ὅτε ἤμην νήπιος, ⸂ἐλάλουν ὡς νήπιος, ἐφρόνουν ὡς νήπιος, ἐλογιζόμην ὡς νήπιος⸃· ⸀ὅτε γέγονα ἀνήρ, κατήργηκα τὰ τοῦ νηπίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/011.yaml
  text: When I was a child[a], I spoke like a child, I thought like a child, I reasoned like a child. When I became a man, I put away the things of the child.
translation:
  language: zh_hans
  text: 我作孩子的时候，说话像孩子，思想像孩子，推想也像孩子；既已长成成年男子，就把孩子的事[a]丢开了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“孩子气的事”或“孩子的作风”。希腊文直译为“孩子的那些事”。
    reason: 说明概括性所有格结构的直译及可行的语义化译法。
lexical_decisions:
- source_word: νήπιος
  choice: 孩子
  rationale: 指年幼、尚未成熟的人；“孩子”自然保留了与成年人之间的对比，又不把含义收窄为婴儿。
- source_word: ἐλάλουν
  choice: 说话
  rationale: 准确表达日常的言说，并与后面的心思和推想构成清楚、有节奏的三联句。
- source_word: ἐφρόνουν
  choice: 心思
  rationale: φρονέω可涉及思想、心态或观念；译作“心思像孩子”既自然，也保留了比单纯理性思考更宽的含义。
- source_word: ἐλογιζόμην
  choice: 推想
  rationale: 表达思量、推论或判断，与前面的“心思”有所区分，同时避免把原词限定为严格的逻辑推理。
- source_word: γέγονα
  choice: 既已长大成人
  rationale: 完成时表示已经进入成年状态；“既已”体现结果状态，“长大成人”符合现代汉语表达。
- source_word: ἀνήρ
  choice: 成人
  rationale: 此处重点是与孩子相对的成年阶段。汉语“成人”自然表达这一对比；原文用阳性名词，语境中保罗以自己为例，并非讨论性别地位。
- source_word: κατήργηκα
  choice: 丢开了
  rationale: 在成长的比喻中表示使孩童阶段的事不再起作用、将其弃置；“丢开了”具体自然，并保留主动断舍的意味。
- source_word: τὰ τοῦ νηπίου
  choice: 孩子的事
  rationale: 贴近原文“属于孩子的那些事”，同时保留其概括性，不把它过早解释为幼稚行为或特定习惯。
theological_decisions:
- issue: ἀνήρ的性别形式与语境中的成熟对比
  choice: 成人
  alternative: 男人／成年男子
  rationale: 希腊文ἀνήρ为阳性单数，保罗以自身从孩童到成年男子的成长为例；但本句论证焦点是成熟阶段，而非男性身份。现代汉语“成人”能准确传达与νήπιος的对照，又不引入男性优越的含义。
- issue: τὰ τοῦ νηπίου所指范围
  choice: 保留为概括性的“孩子的事”
  alternative: 幼稚的事／孩子的作风
  rationale: 原文没有明确限定这些“事”只指行为、思想或说话方式，且前文三项都可能包括在内，因此不在正文中缩窄其范围。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。前半句以三次“像孩子”保留原文的排比和节奏；后半句用“既已长大成人”体现完成时所强调的新状态。
