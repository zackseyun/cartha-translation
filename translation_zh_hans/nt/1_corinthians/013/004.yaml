language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ἡ ἀγάπη μακροθυμεῖ, χρηστεύεται ἡ ἀγάπη, οὐ ζηλοῖ ⸂ἡ ἀγάπη⸃, οὐ περπερεύεται, οὐ φυσιοῦται,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/004.yaml
  text: Love is patient[a], love is kind. It does not envy, it does not boast[b], it is not puffed up.
translation:
  language: zh_hans
  text: 爱恒久忍耐，爱以仁慈待人；爱不嫉妒[a]，不夸耀自己，也不自高自大[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “嫉妒”所译的希腊词也可表示“热心”或“热切追求”；但这里有否定词，且上下文列举爱的反面，因此取负面的“嫉妒”之意。
    reason: lexical_alternative
  - marker: b
    text: “自高自大”所译的希腊词原有“使自己膨胀”的意象，指因骄傲而自负。
    reason: metaphor
lexical_decisions:
- source_word: ἀγάπη
  choice: 爱
  rationale: “爱”是现代汉语中自然、宽广且庄重的对应词，不把含义缩窄为慈善施舍。
- source_word: μακροθυμεῖ
  choice: 恒久忍耐
  rationale: 该动词表示面对他人时长久忍耐、克制；“恒久忍耐”既体现持续性，也承接本段庄重的修辞。
- source_word: χρηστεύεται
  choice: 以仁慈待人
  rationale: 该动词强调实际表现仁慈，而不只描述一种性情；此译法在现代汉语中自然，并保留其行动意味。
- source_word: ζηλοῖ
  choice: 嫉妒
  rationale: 该词本可表示热切或妒忌；受 οὐ 和此处负面品格清单制约，译作“嫉妒”最贴合语境。
- source_word: περπερεύεται
  choice: 夸耀自己
  rationale: 该罕见动词指自我炫耀、吹嘘；“夸耀自己”清楚而庄重，也凸显其以自我为中心的意味。
- source_word: φυσιοῦται
  choice: 自高自大
  rationale: 原词字面涉及“膨胀”，在保罗书信中用于骄傲自负；正文采用自然的汉语成语，脚注说明其形象。
- source_word: ἡ ἀγάπη ... ἡ ἀγάπη ... ⸂ἡ ἀγάπη⸃
  choice: 爱……爱……爱
  rationale: 正文在前三个分句中保留主语“爱”的反复，以体现希腊文的修辞强调；后两句依汉语习惯省略已明确的主语。
- source_word: οὐ
  choice: 不
  rationale: 汉语以“不”自然表达这些一般性、持续性的否定陈述。
theological_decisions:
- issue: ἀγάπη 在著名伦理与神学段落中的译法
  choice: 爱
  alternative: 仁爱
  rationale: “爱”直接、自然，并保留该词在人际、群体及神学语境中的广度；“仁爱”虽庄重，却可能使现代读者将其理解为一种特定德目。
- issue: ζηλοῖ 的正负双重语义
  choice: 不嫉妒
  alternative: 不妒忌／不怀嫉妒
  rationale: 该动词可指正面的热心，也可指负面的嫉妒；否定结构及相邻的骄傲行为支持负面义，但以脚注承认词汇本身的语义幅度。
- issue: φυσιοῦται 的隐喻处理
  choice: 正文译“自高自大”，脚注保留“膨胀”意象
  alternative: 不自我膨胀／不骄傲
  rationale: 这样既使正文符合现代标准汉语，又不抹去保罗常用的“因骄傲而膨胀”隐喻。
translation_notes:
  register: 采用现代、庄重而易懂的标准汉语。首两句保留“爱”的反复，第三句亦按有较强外证支持的 SBLGNT 方括号读法重复“爱”；分号划分正面与负面陈述。“以仁慈待人”突出 χρηστεύεται 的行动性；“自高自大”保证汉语自然度，并由脚注保存原文隐喻。
