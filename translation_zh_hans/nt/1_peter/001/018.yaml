  text: εἰδότες ὅτι οὐ φθαρτοῖς, ἀργυρίῳ ἢ χρυσίῳ, ἐλυτρώθητε ἐκ τῆς ματαίας ὑμῶν ἀναστροφῆς πατροπαραδότου,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/018.yaml
  text: knowing that you were redeemed from your futile way of life handed down from your fathers[a], not with perishable things such as silver or gold[b],
translation:
  language: zh_hans
  text: 你们知道，你们从父辈传下来的[b]虚妄生活方式中被赎了出来[a]，不是用金银这类会朽坏的东西，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“付赎价而得释放”。希腊语动词含有付赎价而得释放之意。
    reason: lexical_alternative
  - marker: b
    text: 或译“祖先传下来的”。直译为“父辈传下来的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδότες
  choice: 你们知道
  rationale: 将完成时分词按其与上下文劝勉的附带关系译出；“你们知道”自然清楚，又不把因果关系说得过满。
- source_word: ἐλυτρώθητε
  choice: 被赎了出来
  rationale: 该动词含借赎价获得释放之意；“被赎了出来”既保留救赎用语，也由下文金银的对比显明赎价意象。
- source_word: φθαρτοῖς
  choice: 会朽坏的东西
  rationale: 此处形容词作名词用，指会败坏、不能长存之物；这一译法通俗自然，并与下一节的价值对比相呼应。
- source_word: ἀργυρίῳ ἢ χρυσίῳ
  choice: 金银这类
  rationale: 银与金是前述会朽坏之物的具体例子；“这类”明确其举例说明的关系，同时符合现代汉语表达。
- source_word: ἐκ
  choice: 从……中
  rationale: 表达脱离原有生活方式的来源和分离意义。
- source_word: ματαίας
  choice: 虚妄
  rationale: 兼具空虚、无益和徒劳之意，保留其道德与生命层面的分量。
- source_word: ἀναστροφῆς
  choice: 生活方式
  rationale: 在彼得书信中常指人的行为表现或整体生活样式；“生活方式”自然且涵盖面恰当。
- source_word: πατροπαραδότου
  choice: 父辈传下来的
  rationale: 保留原文“父辈”的明确措辞，并以“传下来的”表达传统承袭之意。
theological_decisions:
- issue: 承袭传统措辞的译法
  choice: 父辈传下来的
  alternative: 祖先传下来的
  rationale: 原文明确含“父辈”成分，正文予以保留；脚注说明可按涵盖历代祖先的意义理解，避免将范围不必要地限定于直接父亲。
- issue: 赎回术语
  choice: 被赎了出来
  alternative: 付赎价得释放
  rationale: 本句运用赎价与释放的意象，却未在本分句中详述其机制；正文保留圣经救赎用语，脚注则交代希腊语中的付款释放含义。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“虚妄生活方式”保留原文的道德和生命层面张力；句末逗号依照原文，表明思想在下一节继续。脚注标记按其实际所解释的词语放置：[a]对应“被赎了出来”，[b]对应“父辈传下来的”。
