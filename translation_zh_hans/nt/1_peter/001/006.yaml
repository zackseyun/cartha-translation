  text: ἐν ᾧ ἀγαλλιᾶσθε, ὀλίγον ἄρτι εἰ ⸀δέον λυπηθέντες ἐν ποικίλοις πειρασμοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/006.yaml
  text: In this you rejoice[a], though now for a little while, if necessary, you have been grieved by various trials,
translation:
  language: zh_hans
  text: 你们为此欢欣喜乐；尽管如今若有必要，暂时因各种试炼[a]而忧愁。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“考验”；这个希腊词在其他语境中也可指“诱惑”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: 为此
  rationale: 关系代词所指很可能是上文所述的救恩、盼望与基业这一整体。“为此”在现代汉语中自然地表达喜乐所依托的内容，同时不把所指范围限定得过窄。
- source_word: ἀγαλλιᾶσθε
  choice: 欢欣喜乐
  rationale: 该动词表示强烈的喜乐。“欢欣喜乐”既传达其强度，又保持庄重、易懂的现代汉语表达。
- source_word: ὀλίγον ἄρτι
  choice: 如今……暂时
  rationale: 同时保留ἄρτι的当前时间意义和ὀλίγον的短暂意义，并按自然汉语语序分置于句中。
- source_word: εἰ δέον
  choice: 若有必要
  rationale: 保留εἰ的条件意味和δέον的必要性，不进一步解释这种必要由谁决定或为何存在。
- source_word: λυπηθέντες
  choice: 会……忧愁
  rationale: 在让步结构中自然表达经历忧愁的状态；“会”使汉语句法通顺，并未断言试炼必然发生。
- source_word: ἐν ποικίλοις πειρασμοῖς
  choice: 因各种试炼
  rationale: 上下文谈到苦难及信心受检验，因此“试炼”比“诱惑”更切合；“因”自然表达这些处境带来忧愁，同时“各种”保留ποικίλοις所指的多样性。
theological_decisions:
- issue: πειρασμοῖς在受苦语境中的含义
  choice: 试炼
  alternative: 考验；诱惑
  rationale: 下一节谈到信心经过检验，当前语境也强调忧愁与苦难，所以“试炼”最能兼顾外在困境和信心受验证的意味；脚注保留该词在其他语境中可指“诱惑”的词义范围。
- issue: εἰ δέον所表达的必要性
  choice: 若有必要
  alternative: 既然有必要；如果必须
  rationale: 保留原文的条件形式及其神学张力，不把苦难的必要性解释为确定事实，也不明确指定其来源。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“欢欣喜乐”与“忧愁”形成原文中的鲜明张力；分号呈现主句与让步成分的关系。脚注标记置于其实际说明的“试炼”之后。
