  to: 他们查考在他们里面的弥赛亚之灵预先见证那临到弥赛亚的苦难[a]和此后的种种荣耀时，所指明的是谁，或是怎样的时期。
  rationale: 修订仅重组中文句法，使“预先见证”明确连接于“弥赛亚之灵”及其“所指明”的内容，同时保留原译对εἰς的主文理解。脚注改为保留英语审校轨迹所列、且在中文中更直接的传统替代译法；没有改变经文的神学主张或消除原文的语义余地。
