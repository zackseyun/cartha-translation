  text: ἐραυνῶντες εἰς τίνα ἢ ποῖον καιρὸν ἐδήλου τὸ ἐν αὐτοῖς πνεῦμα Χριστοῦ προμαρτυρόμενον τὰ εἰς Χριστὸν παθήματα καὶ τὰς μετὰ ταῦτα δόξας·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/011.yaml
  text: inquiring into what person or what time the Spirit of Messiah in them was indicating[a], as it testified beforehand to the sufferings for Messiah and the glories after these things.
translation:
  language: zh_hans
  text: 他们查考在他们里面的弥赛亚之灵预先见证那临到弥赛亚的苦难[a]和此后的种种荣耀时，所指明的是谁，或是怎样的时期。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“弥赛亚所受的苦难”。
    reason: 原文τὰ εἰς Χριστὸν παθήματα中的εἰς可理解为苦难临到弥赛亚；也可按传统理解为弥赛亚所受的苦难。
lexical_decisions:
- source_word: ἐραυνῶντες
  choice: 查考
  rationale: 承接上一节先知寻求、考察的行动，既保留深入探究之意，也符合现代汉语圣经语体。
- source_word: εἰς τίνα ἢ ποῖον καιρόν
  choice: 所指的是谁，或是怎样的时期
  rationale: 保留 τίνα 可能指人的理解，并以“怎样的时期”体现 ποῖον 的性质性询问，不把两重问题压缩成单一的时间问题。
- source_word: ἐδήλου
  choice: 所指的是
  rationale: 表达未完成时所呈现的持续指示，同时与后面的疑问内容自然衔接。
- source_word: τὸ ἐν αὐτοῖς πνεῦμα Χριστοῦ
  choice: 住在他们里面的弥赛亚之灵
  rationale: 明确圣灵在先知里面，并将 Χριστός 作为称号译为“弥赛亚”；不进一步解释该属格的神学关系。
- source_word: προμαρτυρόμενον
  choice: 预先见证了
  rationale: 兼顾 μαρτυρέω 的“见证”含义和 προ- 的预先性，避免弱化为一般的“预告”。
- source_word: τὰ εἰς Χριστὸν παθήματα
  choice: 临到弥赛亚的苦难
  rationale: 用“临到”体现 εἰς 的趋向或关联意味，同时在汉语中清楚表达这些苦难与弥赛亚的关系；另一种较宽泛的理解收入脚注。
- source_word: τὰς μετὰ ταῦτα δόξας
  choice: 此后的种种荣耀
  rationale: “此后”保留时间次序，“种种荣耀”保留原文复数所暗示的多重荣耀表现。
theological_decisions:
- issue: “弥赛亚之灵”与先知的关系
  choice: 直接保留“住在他们里面的弥赛亚之灵”
  alternative: 在先知里面、为弥赛亚作见证的灵
  rationale: 原文将这灵直接称为“弥赛亚之灵”，并说他在先知里面；译文不将此关系化约为仅仅谈论弥赛亚的先知之灵。
- issue: τὰ εἰς Χριστὸν παθήματα 中 εἰς 的含义
  choice: 临到弥赛亚的苦难
  alternative: 关乎弥赛亚的苦难
  rationale: 主文体现趋向弥赛亚、落在弥赛亚身上的意味，但原文结构并非普通所有格，因此用脚注保留较宽泛的关联性理解。
- issue: “荣耀”的复数形式
  choice: 种种荣耀
  alternative: 荣耀
  rationale: 保留 δόξας 的复数，不限定它只指复活、升天或其他某一项荣耀事件。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“查考”“预先见证”保留经文的论述力度；分号梳理较长的希腊句法。“种种荣耀”既自然，又明确反映原文复数。
