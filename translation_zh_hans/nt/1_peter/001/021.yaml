  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: τοὺς δι’ αὐτοῦ ⸀πιστοὺς εἰς θεὸν τὸν ἐγείραντα αὐτὸν ἐκ νεκρῶν καὶ δόξαν αὐτῷ δόντα, ὥστε τὴν πίστιν ὑμῶν καὶ ἐλπίδα εἶναι εἰς θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/021.yaml
  text: who through him are believers in God[a], who raised him from the dead and gave him glory[b], so that your faith and hope are in God.
translation:
  language: zh_hans
  text: 你们是借着他信靠那位使他从死人中复活、又赐给他荣耀的上帝的人，以致你们的信心和盼望都在上帝身上。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “信靠上帝的人”所对应的原词也可译作“忠信的人”；但这里的短语最可能是指借着基督信靠上帝的人。也可译作：“为要使你们的信心和盼望都在上帝身上。”原文主要表达结果，也可能带有目的意味。
    reason: 合并保留πιστούς的词义替代和ὥστε从句的另一种理解；脚注锚点置于全句结果处，避免在正文中造成不必要的断裂。
lexical_decisions:
- source_word: δι’ αὐτοῦ
  choice: 借着他
  rationale: διά接属格通常表示途径或中介；“借着他”自然表达众人是以基督为中介而信靠上帝，同时不夸大为基督直接使人相信。
- source_word: πιστοὺς εἰς θεόν
  choice: 信靠上帝
  rationale: πιστός虽可指“忠信的”，但与εἰς θεόν连用时，更自然地表示以上帝为信靠对象。“信靠”比单说“相信”更能体现此处信赖的意味。
- source_word: τὸν ἐγείραντα αὐτὸν ἐκ νεκρῶν
  choice: 上帝使他从死人中复活
  rationale: 这是新约常见的复活表述；“从死人中复活”保留ἐκ νεκρῶν所表达的从死者当中出来之意。
- source_word: δόξαν αὐτῷ δόντα
  choice: 又赐给他荣耀
  rationale: 忠实保留δίδωμι与δόξα的直接含义，并以“又”连接两个并列的分词所述行动。
- source_word: ὥστε
  choice: 因此
  rationale: ὥστε引出前述上帝使基督复活并赐他荣耀所带来的结果；“因此”在现代汉语中自然地衔接这一结果，同时脚注保留目的或结果之间的张力。
- source_word: τὴν πίστιν ὑμῶν καὶ ἐλπίδα
  choice: 你们的信心和盼望
  rationale: “信心”和“盼望”是自然、庄重且通行的对应词；句法上ὑμῶν同时修饰二者。
- source_word: εἶναι εἰς θεόν
  choice: 都在于上帝
  rationale: εἰς表示信心与盼望所指向的对象；“在于上帝”符合现代汉语表达，也与前半节的“信靠上帝”形成呼应。
theological_decisions:
- issue: πιστούς的含义
  choice: 理解为“信靠上帝的人”，并在正文中按第二人称语境译作“你们……信靠上帝”
  alternative: “对上帝忠信的人”
  rationale: 紧随其后的εἰς θεόν强烈支持相信、信靠的意义，而非泛指品格上的忠信；脚注保留词义上的真实可能性。
- issue: 基督在人与上帝之关系中的作用
  choice: “借着他”表达基督作为信靠上帝的中介
  alternative: “因为他”所表达的较宽泛原因关系
  rationale: διά加属格首先表达途径或中介；此译法紧贴语法，不额外加入经文未明说的教义体系。
- issue: ὥστε从句的逻辑关系
  choice: 以“因此”呈现结果关系
  alternative: “为要使你们的信心和盼望都在于上帝”所表达的目的意味
  rationale: ὥστε加不定式通常引出结果，但在此也可能带有目的色彩；正文采用较自然的结果表达，脚注明示另一种理解，避免消除经文张力。
- issue: 上帝使基督复活并赐他荣耀
  choice: 保留上帝为行动主体、基督为领受者的句法关系
  alternative: 将“荣耀”泛化为“尊荣”或把复活与荣耀合并为笼统的高举
  rationale: 原文明确并列“使他复活”和“赐给他荣耀”，直译能保存彼得在此所陈述的行动次序和神学重点。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“上帝”与上下文保持一致；以分号拆开较长的希腊句法，使汉语层次清楚。“从死人中复活”较“从死里复活”更明确保留ἐκ νεκρῶν的复数表达。
