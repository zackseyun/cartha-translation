  text: ἀναγεγεννημένοι οὐκ ἐκ σπορᾶς φθαρτῆς ἀλλὰ ἀφθάρτου, διὰ λόγου ζῶντος θεοῦ καὶ ⸀μένοντος·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/023.yaml
  text: having been born again[a], not from perishable seed but imperishable, through the living and abiding word of God.
translation:
  language: zh_hans
  text: 你们已经重生了，不是出于会朽坏的种子，而是出于不会朽坏的种子，是借着上帝那活着并长存的道。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“借着那永活长存的上帝的道。”希腊文中“活着”和“长存”在语法上既可修饰“道”，也可修饰“上帝”；上下文较支持修饰“道”。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀναγεγεννημένοι
  choice: 已经重生了
  rationale: 该词是完成时被动分词，表达已经发生并持续产生结果的被动行动。中文用“已经重生了”自然呈现其完成和延续意味；虽改为完整谓语，却不额外加入原文没有的因果连接词。
- source_word: σπορᾶς
  choice: 种子
  rationale: 本节以种子比喻生命的来源，并与“会朽坏／不会朽坏”形成对比；“种子”直接、自然，也与重生意象吻合。
- source_word: φθαρτῆς
  choice: 会朽坏的
  rationale: 清楚表达可败坏、可消逝的性质，并与ἀφθάρτου形成整齐的中文对照。
- source_word: ἀφθάρτου
  choice: 不会朽坏的
  rationale: 以否定式对应“会朽坏的”，保留原文鲜明的词义对照，同时比“不能败坏的”更符合现代汉语习惯。
- source_word: ἐκ
  choice: 出于
  rationale: 表达重生的来源，保留原文两次ἐκ所构成的“不是出于……而是出于……”对比。
- source_word: διὰ
  choice: 借着
  rationale: διά接属格在此表示途径或媒介；“借着”简洁而准确。
- source_word: λόγου
  choice: 道
  rationale: λόγος在此可指话语或信息；“道”是庄重且通行的圣经用语，也能与下文有关这道长存的论述衔接。
- source_word: ζῶντος
  choice: 永活
  rationale: 直译核心意义“活着的”。与μένοντος并列时译作“永活长存”，中文凝练自然；“永”也由两项并置的持续意味得到支持，并非将其解释成“赐生命的”。
- source_word: θεοῦ
  choice: 上帝
  rationale: 作为属格，最自然地构成“上帝的道”。译文采用现代标准普通话中庄重而通行的称谓“上帝”。
- source_word: μένοντος
  choice: 长存
  rationale: 表达持续存在、存留的意思，并与彼得前书1:25关于主的道永远长存的语境相呼应。
theological_decisions:
- issue: ζῶντος和μένοντος是修饰λόγου（道），还是修饰θεοῦ（上帝）
  choice: 正文按“永活长存的道”处理，即两个分词修饰“道”
  alternative: “永活长存之上帝的道”，即两个分词修饰“上帝”
  rationale: λόγου、ζῶντος和μένοντος均为属格阳性单数，因此两个分词可自然地修饰λόγου；而θεοῦ可作为依附于λόγου的属格，构成“上帝的道”。这也符合第25节对“道”长存的强调。不过，因θεοῦ同样是属格阳性单数，两个分词在语法上也可能修饰“上帝”，故在脚注中保留这一真实歧义。
translation_notes:
  register: 采用自然、庄重的现代标准普通话。“会朽坏／不会朽坏”保持原文对称；“出于”表达来源，“借着”表达媒介。正文不补入“因为”或“既然”，以免把依赖上文的分词关系解释得过死。脚注标记[a]已置于正文相关句末。
