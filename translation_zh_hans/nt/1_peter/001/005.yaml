  text: τοὺς ἐν δυνάμει θεοῦ φρουρουμένους διὰ πίστεως εἰς σωτηρίαν ἑτοίμην ἀποκαλυφθῆναι ἐν καιρῷ ἐσχάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/005.yaml
  text: who are being guarded by the power of God through faith for a salvation ready to be revealed in the last time[a][b].
translation:
  language: zh_hans
  text: 你们正借着信[a]，靠着上帝的大能蒙保守，为要得着那预备好在末后的时期[b]显明的救恩。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “信”也可理解为“信靠”；在这里较不可能指“忠信”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“在最后的时候”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τοὺς
  choice: 你们
  rationale: 定冠词在这里承接上一节所说的收信人；简体中文以“你们”自然地恢复其指向，并保持本节与上文的连接。
- source_word: φρουρουμένους
  choice: 正……蒙……保守
  rationale: 现在时被动分词表示收信人持续受到保守。“蒙……保守”既体现被动意义，也保留该词防守、护卫的色彩；“正”传达行动正在持续。
- source_word: ἐν δυνάμει θεοῦ
  choice: 蒙上帝的能力保守
  rationale: ἐν在此结合被动分词表达凭借的手段。“上帝的能力”是保守得以施行的力量，中文以“蒙……的能力保守”表达自然清楚。
- source_word: διὰ πίστεως
  choice: 借着信
  rationale: διά加属格表示媒介或途径。πίστις在此最自然地指“信”，既可包含信靠，也不把它限定为人的忠贞；其他可能含义保留在脚注中。
- source_word: εἰς σωτηρίαν
  choice: 为要得着……救恩
  rationale: εἰς指出保守所朝向的目标。“为要得着”用自然中文表达这一前瞻方向；“救恩”仍由后面的短语限定为将来要显明的。
- source_word: ἑτοίμην ἀποκαλυφθῆναι
  choice: 已经预备好、要……显明的
  rationale: ἑτοίμην表示救恩已经处于就绪状态，被动不定式ἀποκαλυφθῆναι表示它将被揭示。“显明”适合表达原文的启示、揭开含义。
- source_word: ἐν καιρῷ ἐσχάτῳ
  choice: 在末后的时期
  rationale: καιρός指具有决定意义或特定性质的时期，不只是钟表式时间。“末后的时期”保留末世性的指向，同时不引入具体的末世时间表。
theological_decisions:
- issue: 上帝的保守与人的信之间的关系
  choice: 上帝以自己的能力施行保守，而“信”是这保守所借着的途径。
  alternative: 把“信”仅视为附带描述，或把πίστις主要理解为“忠信”。
  rationale: 句法同时突出了上帝能力所施行的保守和διὰ πίστεως所表达的媒介。译文保留两者，不进一步裁定有关坚忍或失落救恩的宗派性问题。
- issue: 救恩的时间指向
  choice: 这里着重救恩在末后显明的未来面向。
  alternative: 把这里的救恩只解释为当前的归信，或据此否定救恩在新约其他经文中的当前面向。
  rationale: “已经预备好、要……显明”清楚指向未来；译文忠实保留这一点，却不把本节扩展成对救恩全部时间层面的系统性定义。
translation_notes:
  register: 采用现代、庄重而通顺的简体中文。“上帝”与项目咨询层一致；句式以“你们”承接上文，使本节作为从句性希腊原文片段在中文中可以独立朗读。脚注标记均紧跟相关词语。
