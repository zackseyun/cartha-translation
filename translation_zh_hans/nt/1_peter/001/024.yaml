id: 1PE.1.24
reference: 1 Peter 1:24
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: διότι πᾶσα σὰρξ ὡς χόρτος, καὶ πᾶσα δόξα ⸀αὐτῆς ὡς ἄνθος χόρτου· ἐξηράνθη ὁ χόρτος, καὶ τὸ ⸀ἄνθος ἐξέπεσεν·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/024.yaml
  text: because all flesh is like grass[a], and all its glory is like the flower of grass; the grass withered[b], and the flower fell off.
translation:
  language: zh_hans
  text: 因为“凡有血肉的都像草[a]，他们的一切荣美[b]都像草的花；草枯干了，花也凋落了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“所有人”。希腊文直译为“所有血肉”，呼应《以赛亚书》40:6，强调人必死且脆弱。
    reason: lexical_alternative
  - marker: b
    text: 或译“荣耀”或“光彩”。
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: 因为
  rationale: 引出前文论断的经文根据，保留明确的因果关系。
- source_word: πᾶσα σὰρξ
  choice: 凡有血肉的
  rationale: 按字面保留“血肉”的意象，并承接《以赛亚书》40:6；这里强调世人的脆弱与必死性，并非指“罪性”。
- source_word: ὡς χόρτος
  choice: 都像草
  rationale: 以自然的现代汉语保留原文关于短暂无常的明喻。
- source_word: πᾶσα δόξα αὐτῆς
  choice: 他们的一切荣美
  rationale: “荣美”在此兼具光彩、荣耀与美盛之意；“他们”使集体性的人类所指在汉语中清楚自然。
- source_word: ὡς ἄνθος χόρτου
  choice: 都像草上的花
  rationale: 保留χόρτου与“草”的词汇联系和属格意象，同时采用自然可懂的汉语表达。
- source_word: ἐξηράνθη
  choice: 枯干了
  rationale: 准确表达草失去水分、枯萎的景象，并适合经文引语的庄重语体。
- source_word: ἐξέπεσεν
  choice: 凋落了
  rationale: 同时表达花朵衰败并从茎上落下，比单用“落了”更自然，也未丢失“落下”的动态。
theological_decisions:
- issue: 在论述人必朽坏的经文引语中如何翻译σάρξ
  choice: 凡有血肉的
  alternative: 所有人／全人类
  rationale: 此处的σάρξ不是道德意义上的“罪性”，而是借“血肉”指必死而脆弱的人类。保留“血肉”既维护原文意象，也保存与《以赛亚书》40:6的互文联系。
- issue: δόξα在此处的语义
  choice: 荣美
  alternative: 荣耀／光彩
  rationale: 上下文把人所拥有的一切可夸、华美和显赫之处比作易逝的花。“荣美”保留正面价值与外在美盛之间的张力，不把含义局限为宗教性的“荣耀”。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。用引号标明经文引语；分号保持原文诗句的连贯与转折。重复“草”和“花”的意象，保留引文的平行结构及诗性节奏。
