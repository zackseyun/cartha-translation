  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ εἰ πατέρα ἐπικαλεῖσθε τὸν ἀπροσωπολήμπτως κρίνοντα κατὰ τὸ ἑκάστου ἔργον, ἐν φόβῳ τὸν τῆς παροικίας ὑμῶν χρόνον ἀναστράφητε·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/017.yaml
  text: And if you call as Father the one who judges impartially according to each person's work[c][b][a], conduct yourselves in fear during the time of your sojourn.
translation:
  language: zh_hans
  text: 如果你们称那位不偏不倚、按各人的行为施行审判的为父[a]，就当在寄居的这段日子里[b]，以畏惧的心[c]行事为人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“呼求那位……为父。”
    reason: lexical_alternative
  - marker: b
    text: “寄居”也可译为“旅居”或“作外来者生活”；原文指作为外来者或暂住者的生活状态。
    reason: lexical_alternative
  - marker: c
    text: “畏惧”也可译为“敬畏”或“肃然敬畏”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπικαλεῖσθε
  choice: 称……为父
  rationale: 该中间语态动词在这里指向上帝呼求或称呼他；与宾格“父”连用时，译作“称……为父”既自然，也保留了称谓关系。
- source_word: πατέρα
  choice: 父
  rationale: “父”在句中作谓语性宾格，表明信徒以父来称呼上帝；现代汉语中置于“称……为”之后无需冠词。
- source_word: ἀπροσωπολήμπτως
  choice: 不偏不倚
  rationale: 该副词表示审判时不看人的身份地位、不徇私情；“不偏不倚”简洁自然。
- source_word: κρίνοντα
  choice: 施行审判的
  rationale: 现在分词修饰所称为父的那一位，表达他作为审判者的持续性特征；汉语用“施行审判的”构成自然的定语。
- source_word: κατὰ τὸ ἑκάστου ἔργον
  choice: 按各人的行为
  rationale: κατά加宾格表示审判的准则；单数ἔργον在此可作集合性理解。“各人的行为”保留个人责任，同时不把它限定为某一件单独的事。
- source_word: ἐν φόβῳ
  choice: 心存畏惧
  rationale: φόβος可涵盖惧怕、敬畏和肃然畏惧。“心存畏惧”保留父与公正审判者之间的张力，不预先将其弱化为单纯的尊敬。
- source_word: παροικίας
  choice: 寄居
  rationale: 该词指作为外来者或暂住者的生活状态；“寄居”在现代汉语中自然，并保留本书的客旅主题，而不特指政治性的流亡。
- source_word: ἀναστράφητε
  choice: 度日
  rationale: 该命令式在这里指人的生活方式和行事为人；与时间短语连用时，“度日”自然地表达在整段寄居期间应有的生活态度。
- source_word: τὸν τῆς παροικίας ὑμῶν χρόνον
  choice: 在寄居的这段日子里
  rationale: χρόνον为持续时间宾格；此译法清楚表达整个寄居时期，也保持现代汉语的流畅度。
theological_decisions:
- issue: φόβος在上帝既为父又为审判者的语境中的含义
  choice: 正文译为“畏惧”
  alternative: 敬畏；肃然敬畏
  rationale: 经文把上帝的父亲身份与他不偏不倚的审判并置。“畏惧”保留其道德严肃性及亲近与问责之间的张力；脚注同时说明其敬畏内涵。
- issue: 按各人的行为审判的范围与教义含义
  choice: 直接译为“按各人的行为施行审判”
  alternative: 将其明确解释为信徒行为的末日审判；将其泛化为上帝评估人的一般原则
  rationale: 希腊文明确陈述审判以各人的行为为准则，却没有在本句中建立关于功德、称义或得救确据的完整体系，因此译文不加入特定宗派解释。
- issue: 条件连词εἰ的语气
  choice: 译为“如果”
  alternative: 既然
  rationale: εἰ可在语境中表达以事实为前提的条件，但其形式仍是条件句；“如果”保留原文表层条件性，避免替作者明确断定为“既然”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不偏不倚”“寄居”“心存畏惧度日”兼顾经文的伦理力度与自然表达；脚注标记[a]、[b]、[c]均已置于正文相应位置。
