id: 1PE.1.19
reference: 1 Peter 1:19
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἀλλὰ τιμίῳ αἵματι ὡς ἀμνοῦ ἀμώμου καὶ ἀσπίλου Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/019.yaml
  text: but with the precious blood of Messiah[a], like that of a lamb without blemish and without spot,
translation:
  language: zh_hans
  text: 而是凭着基督[a]的宝血，如同无瑕疵、无玷污的羔羊之血。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “基督”即“弥赛亚”，意思是“受膏者”。
    reason: 说明希腊称号Χριστός的含义，避免将其仅视为姓名，并保留另一种常见称呼。
lexical_decisions:
- source_word: ἀλλὰ
  choice: 而是
  rationale: 承接上一节“不是……”的否定，构成强烈的“不是……而是……”对比；中文用“而是”比单用“但”更准确地衔接上下文。
- source_word: τιμίῳ
  choice: 宝贵的（在“宝血”中表达）
  rationale: τιμίῳ兼有价值极高和受尊崇之意。“宝血”是自然、庄重的中文表达，也避免把这里仅仅理解为金钱上的昂贵。
- source_word: αἵματι
  choice: 血
  rationale: 保留具体名词；这里虽蕴含牺牲之死的意义，却不以解释取代原文意象。
- source_word: ὡς
  choice: 如同
  rationale: 引出比较，说明这宝血如同无缺陷羔羊的血；保留原文比喻关系，不把它改写成明确的等同陈述。
- source_word: ἀμνοῦ
  choice: 羔羊
  rationale: 直接保留献祭意象及其可能唤起的逾越节和祭牲背景，不在正文中展开解释。
- source_word: ἀμώμου
  choice: 无瑕疵
  rationale: 符合祭牲必须没有缺陷的用语，同时保留与ἀσπίλου并列而不完全重合的含义。
- source_word: καὶ
  choice: 、
  rationale: 中文并列定语中用顿号自然连接两个相近而有区别的形容语。
- source_word: ἀσπίλου
  choice: 无玷污
  rationale: 与“无瑕疵”形成庄重的平行表达，既保留洁净、无污点的含义，也不将两词合并为一个概念。
- source_word: Χριστοῦ
  choice: 基督
  rationale: Χριστός在此指那位受膏者。现代中文圣经语境中“基督”最自然、庄重；脚注说明其称号意义及“弥赛亚”这一译法，避免读者只把它当作姓名。
theological_decisions:
- issue: Χριστοῦ应译作称号还是姓名式称呼
  choice: 正文译“基督”，脚注说明“即弥赛亚，意为受膏者”
  alternative: 正文译“弥赛亚”或“受膏者”
  rationale: 原词是称号，不能在理解上降为单纯姓名；但在现代标准中文中，“基督”是最通行且庄重的对应语。脚注明示其称号含义，既保留原文神学功能，也维持正文流畅。
- issue: ὡς所表达的是比较还是直接等同
  choice: 保留“如同”的比较形式
  alternative: 译为“就是那无瑕疵、无玷污的羔羊之血”
  rationale: 原文使用ὡς，形式上明确引入比较。虽然上下文很容易使人把基督理解为羔羊，译文仍不应删去原文的比较标记并替作者完成等同判断。
- issue: 两个形容词的祭牲与道德含义
  choice: 译作“无瑕疵、无玷污”
  alternative: 译作“无可指责、毫无罪污”
  rationale: ἀμώμου和ἀσπίλου既可承载对基督无罪的理解，也明显呼应合格祭牲的语言。所选译法保留两层可能性，不把意象单向改写成道德说明。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“宝血”保留经文的崇高语气；整体句式有意与上一节的“不是……”构成“不是……而是……”的连续结构。
