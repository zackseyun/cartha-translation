  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Εὐλογητὸς ὁ θεὸς καὶ πατὴρ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὁ κατὰ τὸ πολὺ αὐτοῦ ἔλεος ἀναγεννήσας ἡμᾶς εἰς ἐλπίδα ζῶσαν δι’ ἀναστάσεως Ἰησοῦ Χριστοῦ ἐκ νεκρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/003.yaml
  text: Blessed be the God and Father of our Lord Jesus the Messiah[a], who according to his great mercy has caused us to be born again to a living hope through the resurrection of Jesus the Messiah from the dead[b],
translation:
  language: zh_hans
  text: 愿颂赞归于我们主耶稣这位弥赛亚[a]的上帝和父！他按着自己丰盛的怜悯，借着耶稣这位弥赛亚从死人中复活，使我们重生[b]，得着活的盼望。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 传统上译作“基督”。希腊语Χριστός在这里是称号，意为“受膏者”，相当于“弥赛亚”。
    reason: alternative_reading
  - marker: b
    text: 也可译作“赐给我们新生”。原文动词保留了再次出生或得着新生的意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐλογητὸς
  choice: 愿颂赞归给
  rationale: 这是颂赞式用语，而非单纯描述“有福”；此译法在现代汉语中自然地表达敬拜和称颂的语气。
- source_word: ὁ θεὸς καὶ πατὴρ
  choice: 上帝和父
  rationale: 保留两个并列名词及其共同限定关系，不把“上帝”或“父”其中之一省略。
- source_word: κυρίου
  choice: 主
  rationale: κύριος在此是尊称和身份称号，译作“主”准确而自然。
- source_word: Ἰησοῦ Χριστοῦ
  choice: 耶稣弥赛亚
  rationale: Χριστός在此保有称号含义；“弥赛亚”比把它当作姓名组成部分更明确地传达“受膏者”这一身份。
- source_word: κατὰ τὸ πολὺ αὐτοῦ ἔλεος
  choice: 照着自己丰盛的怜悯
  rationale: κατά表示行动所依循的尺度或准则；“丰盛”自然传达πολύ所强调的充裕程度。
- source_word: ἀναγεννήσας
  choice: 使我们重生
  rationale: 明确保留上帝是行动者，也保留再次出生的意象；汉语“使……重生”简洁自然。
- source_word: εἰς ἐλπίδα ζῶσαν
  choice: 得着活的盼望
  rationale: 用“得着”表达εἰς所指向的结果；“活的盼望”保留ζῶσαν的鲜明生命意象，避免解释成较抽象的“充满希望”。
- source_word: δι’ ἀναστάσεως
  choice: 借着……复活
  rationale: διά加属格在此表示途径或媒介，“借着”准确传达这一关系。
- source_word: ἐκ νεκρῶν
  choice: 从死人中
  rationale: 保留ἐκ的来源意味及复活语境中“从死人中出来”的群体性表达。
theological_decisions:
- issue: Χριστός作为基督论称号的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: “弥赛亚”在现代汉语中更明显地保留其身份称号的功能，而不是使其看似耶稣的固定姓名；脚注列出传统译法。
- issue: ἀναγεννήσας所表达的行动主体
  choice: 使我们重生
  alternative: 赐给我们新生
  rationale: 原文明确以上帝为使人重生的行动者；译文仅保留这一语法和意象，不进一步引入任何宗派性体系。
- issue: ζῶσαν修饰盼望的意象
  choice: 活的盼望
  alternative: 充满生命的盼望
  rationale: 直译保留原文开放而有张力的生命意象，不擅自界定这盼望“活”的具体含义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以感叹句呈现颂赞语气；保留“上帝和父”“从死人中”“活的盼望”等原文结构和意象，同时用“使我们重生，得着……”避免生硬的逐词对应。
