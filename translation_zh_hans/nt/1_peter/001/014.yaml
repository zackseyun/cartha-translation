  text: ὡς τέκνα ὑπακοῆς, μὴ συσχηματιζόμενοι ταῖς πρότερον ἐν τῇ ἀγνοίᾳ ὑμῶν ἐπιθυμίαις,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/014.yaml
  text: as children of obedience[a], not conforming yourselves to the desires you formerly had in your ignorance,
translation:
  language: zh_hans
  text: 作为顺服的儿女[a]，不要照着你们从前在无知中所怀的欲望来塑造自己。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“顺服之儿女。”希腊文为“儿女”与“顺服”的属格结构，字面可作“顺服之儿女”。
    reason: 说明 τέκνα ὑπακοῆς 的属格结构，并提供较贴近原文形式的汉语替代译法。
lexical_decisions:
- source_word: ὡς
  choice: 作为
  rationale: 在劝勉语境中表达受众应当以何种身份和样式行事；“作为”自然地承接“顺服的儿女”。
- source_word: τέκνα ὑπακοῆς
  choice: 顺服的儿女
  rationale: 这是现代汉语对属格性质表达的自然呈现，保留“儿女”所传达的身份意味，同时以脚注说明希腊文较为直译的结构。
- source_word: μὴ συσχηματιζόμενοι
  choice: 不要再……塑造自己
  rationale: 该分词在本段劝勉中具有禁止意味；“塑造自己”体现中间语态可能包含的主体参与，而“再”结合 πρότερον 清楚表明不可重回以往的模式。
- source_word: ταῖς ... ἐπιθυμίαις
  choice: 照着……种种欲望
  rationale: 与 συσχηματιζόμενοι 搭配，表示以欲望为模式塑造自己。“欲望”保留词义宽度，不把它局限为性欲；“种种”自然体现复数。
- source_word: πρότερον ἐν τῇ ἀγνοίᾳ ὑμῶν
  choice: 你们从前蒙昧时
  rationale: “从前”对应 πρότερον；“蒙昧时”以自然现代汉语表达处于无知状态，保留其认识与伦理层面的含义而不额外限定对象。
theological_decisions:
- issue: 是否把 τέκνα ὑπακοῆς 完全直译为“顺服之子”
  choice: 正文采用“顺服的儿女”，脚注保留直译信息
  alternative: 顺服之子
  rationale: “顺服的儿女”在现代汉语中自然、包容且仍有身份性的力量；“顺服之子”虽更贴近属格形式，却容易显得古奥或被误解为只指男性。脚注使读者仍能看见原文结构及其神学张力。
- issue: 如何理解 μὴ συσχηματιζόμενοι 的语态
  choice: 不要再……塑造自己
  alternative: 不要被……塑造
  rationale: 该形式在此可有中间或被动色彩。正文采用反身表达，符合劝勉中人的道德责任；同时不增添外在施动者，避免把语态的含混解释得过死。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“蒙昧”比“无知”略具经文语体，但仍属通行用语，并能避免把原句仅理解为缺乏一般知识。“照着……塑造自己”有意保留原文“依某种模式成形”的形象。
