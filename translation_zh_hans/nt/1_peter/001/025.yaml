  text: τὸ δὲ ῥῆμα κυρίου μένει εἰς τὸν αἰῶνα. τοῦτο δέ ἐστιν τὸ ῥῆμα τὸ εὐαγγελισθὲν εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/025.yaml
  text: But the word of the Lord remains forever." And this is the word that was proclaimed as good news to you[a].
translation:
  language: zh_hans
  text: “但主的话永远长存。”这就是那作为好消息向你们宣讲的话。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这就是那传给你们的好消息。”
    reason: 词义与句法上的可选译法；将 εὐαγγελισθέν 所含的福音宣告意义更凝练地表达为“好消息”，但不如正文明确保留“话”是被宣讲的内容。
lexical_decisions:
- source_word: ῥῆμα
  choice: 话
  rationale: “话”自然对应口头表达、言语或信息，并在两处保持一致，保留与前文所引《以赛亚书》40:8的呼应。
- source_word: κυρίου
  choice: 主
  rationale: 属格短语译为“主的话”，既符合新约中 κύριος 的通常译法，也不额外限定此处称谓的指向。
- source_word: μένει
  choice: 长存
  rationale: 表达持续存在、恒久不变的含义；与“永远”搭配自然、庄重。
- source_word: εἰς τὸν αἰῶνα
  choice: 永远
  rationale: 这是表示永久持续的惯用语，“永远”是现代汉语中准确自然的对应。
- source_word: τοῦτο δέ ἐστιν
  choice: 这话就是
  rationale: δέ 在此作轻微承接和转折；汉语无需机械另译连词，“就是”清楚连接引文及彼得的说明。
- source_word: τὸ ῥῆμα τὸ εὐαγγελισθὲν
  choice: 那传给你们的好消息
  rationale: εὐαγγελισθέν 是 εὐαγγελίζω 的被动分词，含“作为好消息宣告”的意思；此译法用现代汉语明确呈现其福音宣告含义。
- source_word: εἰς ὑμᾶς
  choice: 给你们
  rationale: 在 εὐαγγελίζω 的语境中表示宣告所指向的听众；“传给你们”是自然的现代汉语表达。
theological_decisions:
- issue: “主的话”与前文《以赛亚书》引文以及福音宣告之间的关系
  choice: 引文中保留“主的话”，第二句以“这话就是”将其认定为传给读者的好消息。
  alternative: 两处均解释性地译为“从主而来的信息”。
  rationale: 这样既保留经文引语的措辞和互文联系，又呈现彼得把这长存之“话”应用于福音宣告的方式，不把二者的关系过度释义。
- issue: εὐαγγελισθέν 的译法
  choice: 译为“传给你们的好消息”。
  alternative: “当作福音传给你们的话”或“向你们宣讲的福音”。
  rationale: “好消息”直接体现 εὐαγγελίζω 的词义和被宣告的内容，也比仅用教会术语“福音”更便于普通现代读者理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“长存”保留引文语体的凝练感；“好消息”清楚呈现福音宣告的含义。正文中的脚注标记置于相关句末。
