  text: Τὰς ψυχὰς ὑμῶν ἡγνικότες ἐν τῇ ὑπακοῇ τῆς ⸀ἀληθείας εἰς φιλαδελφίαν ἀνυπόκριτον ⸀ἐκ καρδίας ἀλλήλους ἀγαπήσατε ἐκτενῶς,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/022.yaml
  text: Having purified your souls by obedience to the truth for sincere brotherly love[a], love one another earnestly from the heart[b],
translation:
  language: zh_hans
  text: 你们既借着顺从真理洁净了自己的心灵，为了真诚地爱弟兄姐妹[a]，就要从心里热切地彼此相爱[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊语原文指信徒之间如同家人、手足一般的爱。
    reason: lexical_alternative
  - marker: b
    text: 有些抄本作“从清洁的心里”。
    reason: textual_variant
lexical_decisions:
- source_word: ἡγνικότες
  choice: 既……洁净了
  rationale: 完成时主动分词表示已经成就、其果效仍然相关的行动；“既……了”保留其先于主句命令的关系，又不把因果说得过强。
- source_word: ψυχὰς
  choice: 心灵
  rationale: ψυχή在此指人的内在生命乃至整个人；“心灵”比单用“灵魂”更符合现代汉语，同时不将其缩减为外在生活。
- source_word: ἐν τῇ ὑπακοῇ τῆς ἀληθείας
  choice: 因顺从真理
  rationale: ἐν加与格可表示方式、范围或凭借；“因顺从真理”自然表达洁净与顺服真理之间的密切联系，同时保留一定语义弹性。
- source_word: εἰς φιλαδελφίαν ἀνυπόκριτον
  choice: 以致真诚地爱弟兄姐妹
  rationale: εἰς可表示目标或结果，“以致”不排除二者；φιλαδελφία表示信徒之间如家人般的手足之爱，ἀνυπόκριτον译为“真诚地”。
- source_word: ἐκ καρδίας
  choice: 从心里
  rationale: 准确对应底本不带形容词的ἐκ καρδίας；“清洁的心”属于异文，不纳入正文。
- source_word: ἀγαπήσατε
  choice: 要……相爱
  rationale: 以自然的汉语命令句表达不定过去时祈使语气，不额外加入“持续不断”等体貌含义。
- source_word: ἀλλήλους
  choice: 彼此
  rationale: 现代汉语中表达相互关系的标准用语。
- source_word: ἐκτενῶς
  choice: 热切地
  rationale: 表达该副词所含的强度与全力投入；较“恒常地”更少单独强调时间延续。
theological_decisions:
- issue: φιλαδελφία与ἀγαπάω在同一节中的区别
  choice: 前者译作“爱弟兄姐妹”，后者译作“彼此相爱”
  alternative: 两处都直接译为“爱”
  rationale: 汉语难以用两个不同而自然的名词或动词完全复现希腊语差异；加入“弟兄姐妹”保留前者的信仰群体家庭意味，但不夸大两种爱的神学差别。
- issue: φιλαδελφία的性别涵盖范围
  choice: 正文采用“弟兄姐妹”
  alternative: 译作“弟兄之爱”并以脚注说明包括女性信徒
  rationale: 该词指同一信仰群体中如手足般的爱，实际包含男女信徒；“弟兄姐妹”在现代汉语中既准确又清楚。
- issue: ἐκ καρδίας后的文本异文
  choice: 正文译“从心里”
  alternative: “从清洁的心里”
  rationale: SBLGNT正文没有καθαρᾶς，因此不把“清洁的”加入正文；异文在脚注中保存。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“既……就要……”清楚呈现分词与主命令的关系；“热切地”传达强度而避免古雅生硬。正文中的[a]、[b]均与脚注对应。
