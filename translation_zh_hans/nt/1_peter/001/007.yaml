id: 1PE.1.7
reference: 1 Peter 1:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἵνα τὸ δοκίμιον ὑμῶν τῆς πίστεως ⸀πολυτιμότερον χρυσίου τοῦ ἀπολλυμένου διὰ πυρὸς δὲ δοκιμαζομένου εὑρεθῇ εἰς ἔπαινον καὶ ⸂δόξαν καὶ τιμὴν⸃ ἐν ἀποκαλύψει Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/007.yaml
  text: so that the proven genuineness of your faith—more precious than gold that perishes though it is tested by fire—may be found to result in praise and glory and honor at the revelation of Jesus the Messiah[a][b][c].
translation:
  language: zh_hans
  text: 为要使你们信心经过考验所显出的纯正——比那会朽坏、却经过火试验的金子更宝贵——得以在耶稣弥赛亚显现时显明会带来称赞、荣耀和尊荣。[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们信心所受的考验”。希腊语这个词既可侧重考验的过程，也可侧重经过考验后显出的纯正。
    reason: lexical_alternative
  - marker: b
    text: 或译：“耶稣基督”。这里的“弥赛亚”翻译的是称号 Χριστός，意思是“受膏者”。
    reason: lexical_alternative
  - marker: c
    text: 或较直译为：“被发现归于称赞、荣耀和尊荣。”这里按上下文表达其结果。
    reason: translation_alternative
lexical_decisions:
- source_word: δοκίμιον
  choice: 经过考验所显出的真纯
  rationale: 该词在此较自然地指经检验后显明的真实、纯正品质，而不只是检验过程；这一译法也保留了与金子经火试验的对应。
- source_word: πίστεως
  choice: 信心
  rationale: 上下文说的是信徒的信心在试炼中受考验；“信心”是现代汉语中自然且范围合宜的表达。
- source_word: πολυτιμότερον
  choice: 更宝贵
  rationale: 准确表达比较级的价值含义，并自然衔接与金子的比较。
- source_word: χρυσίου
  choice: 金子
  rationale: 直接、自然地表达原词，并符合普通现代汉语用法。
- source_word: ἀπολλυμένου
  choice: 仍会毁坏
  rationale: 保留分词的动态含义，突出金子即使经火检验仍属可毁坏之物，与信心的更高价值形成对比。
- source_word: διὰ πυρὸς
  choice: 经火
  rationale: 在“试验”这一搭配中自然表达火作为检验媒介。
- source_word: δοκιμαζομένου
  choice: 试验
  rationale: 保留检验、验证之意，同时与 δοκίμιον 的语义联系相呼应，不将其过度限定为冶炼。
- source_word: εὑρεθῇ εἰς
  choice: 被认定会带来
  rationale: 保留被动形式及 εἰς 所表达的结果或归向；现代汉语中清楚自然，同时不强行确定三项荣誉的授予者或接受者。
- source_word: ἔπαινον
  choice: 称赞
  rationale: 表达末世显现时的肯定与赞许，并适合三联词的语境。
- source_word: δόξαν
  choice: 荣耀
  rationale: 采用该词在圣经语境中的标准且自然译法。
- source_word: τιμήν
  choice: 尊荣
  rationale: 与“称赞、荣耀”并列时，“尊荣”能表达公开的敬重和地位，比单用“尊重”更庄重。
- source_word: ἐν ἀποκαλύψει
  choice: 在……显现时
  rationale: 此处最自然的是时间意义；“显现”也能表达耶稣从隐藏到公开显明，而不仅是信息被揭示。
- source_word: Ἰησοῦ Χριστοῦ
  choice: 耶稣弥赛亚
  rationale: Χριστός 是称号，意为“受膏者／弥赛亚”；译作“弥赛亚”显明其称号含义，脚注保留传统译名“基督”。
theological_decisions:
- issue: τὸ δοκίμιον ὑμῶν τῆς πίστεως 的含义
  choice: 译为“你们信心经过考验所显出的真纯”，侧重考验后显明的真实品质
  alternative: “你们信心所受的考验”，侧重考验过程
  rationale: δοκίμιον 可涉及检验过程或检验后证明为真的品质；结合经火试验的金子作比较，结果义更合乎语境，但以脚注保留过程义。
- issue: “称赞、荣耀和尊荣”的归属
  choice: 不明确说明是谁受到或给予这些称赞、荣耀和尊荣
  alternative: 明确解释为信徒所得的尊荣，或归给上帝／基督的颂赞
  rationale: 希腊文没有明说三项名词的接受者或来源；正文保留这种末世论语境中的真实含混，避免加入特定教义解释。
- issue: Χριστός 的称号性质
  choice: 正文译作“弥赛亚”
  alternative: 传统音意结合的教会用语“基督”
  rationale: “弥赛亚”直接传达 Χριστός 作为受膏君王称号的意义；脚注给出传统译法，避免读者误以为两者所指不同。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“真纯”用于表达经检验证实的真实与纯正；破折号保留原句中关于金子的插入性比较。三联词“称赞、荣耀和尊荣”保持并列，不补出其授予者或接受者。所有脚注标记均置于正文句末。
