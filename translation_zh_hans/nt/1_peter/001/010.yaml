- from: 关于这救恩，那些预言上帝给你们之恩典[a]的先知，曾悉心寻求，仔细考察，
  to: 关于这救恩，先知们曾殷切寻求、仔细考察；这些先知预言的是那临到你们的恩典[a]，
  rationale: 删除原文未明说的‘上帝’，并将εἰς ὑμᾶς所表达的朝向读者的含义译为‘临到你们’。这在中文中自然表达恩典的目标和预言的前瞻语境；脚注保留较贴近字面的‘给你们的恩典’，并说明未来意味是由上下文所显示，而非本节明说。分号后的说明性同位语避免了连续两个‘的’造成的生硬句式，同时仍限定先知为那些预言这恩典的人。
