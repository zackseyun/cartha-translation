id: 1PE.1.10
reference: 1 Peter 1:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Περὶ ἧς σωτηρίας ἐξεζήτησαν καὶ ἐξηραύνησαν προφῆται οἱ περὶ τῆς εἰς ὑμᾶς χάριτος προφητεύσαντες,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/010.yaml
  text: Concerning this salvation[a], the prophets who prophesied about the grace for you searched and investigated carefully[b],
translation:
  language: zh_hans
  text: 关于这救恩，先知们曾殷切寻求、仔细考察；这些先知预言的是那临到你们的恩典[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“给你们的恩典。”上下文显示这恩典具有将来临到你们的指向；但本节原文没有明说“将要”。
    reason: alternative_reading
lexical_decisions:
- source_word: Περὶ ἧς σωτηρίας
  choice: 关于这救恩
  rationale: περί加属格表示所论及的主题；关系代词ἧς回指上文所说的救恩。中文用“这救恩”自然承接上文，也保留其回指作用。
- source_word: σωτηρίας
  choice: 救恩
  rationale: σωτηρία可指拯救或救恩；本段具有明确的救恩论语境，“救恩”既准确又与上下文一致。
- source_word: ἐξεζήτησαν
  choice: 悉心寻求
  rationale: ἐκζητέω表达认真、殷切地寻求；“悉心”体现其加强语气，同时与下一个动词有所区分。
- source_word: ἐξηραύνησαν
  choice: 仔细考察
  rationale: ἐξεραυνάω指深入搜寻、查究；“仔细考察”保留彻底探究的意味，并再现两个并列动词所形成的递进强调。
- source_word: προφῆται οἱ ... προφητεύσαντες
  choice: 那些……的先知
  rationale: 带冠词的分词短语具体限定“先知”。中文用“那些……的先知”可清楚表达这一限定关系。
- source_word: περὶ τῆς εἰς ὑμᾶς χάριτος
  choice: 预言上帝给你们之恩典
  rationale: περί表示预言的内容；εἰς ὑμᾶς具有朝向或惠及读者的含义。“给你们”在现代中文中自然表达这种方向兼受益关系。补出“上帝”是中文中说明恩典来源所需的最小语义显化，并不改变所指。
- source_word: χάριτος
  choice: 恩典
  rationale: χάρις在此救恩历史语境中指上帝施予的恩惠；“恩典”保留其经文用语的神学分量。
theological_decisions:
- issue: 是否在“给你们的恩典”中明确加入将来含义
  choice: 正文不加入“将要”
  alternative: 将要临到你们的恩典
  rationale: 先知预言的语境使将来指向十分自然，但本节希腊文本没有明说将来时态。正文不将推论写成明文，以保留原文的含蓄性；脚注列出合乎上下文的另一译法。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“悉心寻求，仔细考察”保留原文两个近义动词的加强效果。句末逗号反映本节在原段落中尚未完结，并与下一节衔接。
