    text: 或译：“给你们的恩典。”上下文显示这恩典具有将来临到你们的指向；但本节原文没有明说“将要”。
    reason: alternative_reading
  revision_rationale: 删除原文未明说的‘上帝’，并将εἰς ὑμᾶς所表达的朝向读者的含义译为‘临到你们’。这在中文中自然表达恩典的目标和预言的前瞻语境；脚注保留较贴近字面的‘给你们的恩典’，并说明未来意味是由上下文所显示，而非本节明说。分号后的说明性同位语避免了连续两个‘的’造成的生硬句式，同时仍限定先知为那些预言这恩典的人。
