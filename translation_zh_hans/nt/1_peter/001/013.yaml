  source_fidelity: 主要命令、束腰的心思隐喻、清醒警觉、盼望的对象和末后显现的时间背景均译出。可是“耶稣弥赛亚显现时正带给你们的恩典”在汉语中不够顺畅，且“正带给”与尚未来临的显现并置，容易误解为显现当下正在进行的动作。原文现在时被动分词虽保留进行体形式，但在此末世语境中明确指向将于显现时临到的恩典；以“将要……带给”是安全、清楚的语境化表达。
  naturalness: “束起心思的腰”作为刻意保留的隐喻可接受，并已有充分脚注说明。“耶稣弥赛亚”在现代汉语中略显生硬；“耶稣这位弥赛亚”既自然地表达称号关系，也避免把“弥赛亚”读成姓名的一部分。
  terminology: “恩典”“盼望”“显现”和“弥赛亚”均合乎本段庄重的现代汉语基督教语域。脚注c应相应说明“这位弥赛亚”的处理。“保持清醒”恰当地表达此处比喻性的νήφοντες，不应强加禁酒含义。
