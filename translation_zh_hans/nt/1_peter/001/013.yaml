  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Διὸ ἀναζωσάμενοι τὰς ὀσφύας τῆς διανοίας ὑμῶν, νήφοντες τελείως, ἐλπίσατε ἐπὶ τὴν φερομένην ὑμῖν χάριν ἐν ἀποκαλύψει Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/013.yaml
  text: Therefore[a], having girded up the loins of your mind, being fully clear-minded[d][c][b], set your hope completely on the grace being brought to you at the revelation of Jesus the Messiah.
translation:
  language: zh_hans
  text: 所以，你们要束起心思的腰[a]，保持清醒，把盼望完全[b]寄托在那将要在耶稣这位弥赛亚显现时带给你们的恩典上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译是“束起你们心思的腰”，意思是预备好心思，随时行动。
    reason: lexical_alternative
  - marker: b
    text: “完全”也可与前面的“保持清醒”相连，译作“完全保持清醒，把盼望寄托在……”。原文的连接关系可以有两种理解。
    reason: alternative_reading
lexical_decisions:
- source_word: Διὸ
  choice: 所以
  rationale: 承接上文并引出劝勉，清楚表达推论关系。
- source_word: ἀναζωσάμενοι τὰς ὀσφύας τῆς διανοίας ὑμῶν
  choice: 束起心思的腰
  rationale: 保留希腊文“束腰”的鲜明行动意象，同时以“心思”表明这是指内在的思想准备；脚注说明其惯用含义。
- source_word: νήφοντες
  choice: 保持清醒
  rationale: 此处是比喻性用法，强调思想清明、警觉自持，而非专指没有饮酒；“保持清醒”在现代汉语中自然且不把含义限于禁酒。
- source_word: τελείως
  choice: 完全
  rationale: 表达彻底、全然之意。正文将其与“寄托盼望”相连，但脚注保留它也可能修饰“保持清醒”的句法歧义。
- source_word: ἐλπίσατε
  choice: 把盼望……寄托在
  rationale: 体现命令语气以及有意识地确定盼望对象的行动性，比单说“盼望”更充分。
- source_word: ἐπὶ τὴν φερομένην ὑμῖν χάριν
  choice: 寄托在……正带给你们的恩典上
  rationale: “正带给”保留现在时被动分词的进行形态，同时上下文仍让读者看出这恩典与将来的显现相关。
- source_word: χάριν
  choice: 恩典
  rationale: 既符合彼得前书的用法，也保留基督教语境中这一词的神学分量。
- source_word: ἐν ἀποκαλύψει
  choice: 显现时
  rationale: 此处主要表示耶稣弥赛亚被显明的末世事件；“显现时”自然表达时间关系。
- source_word: Ἰησοῦ Χριστοῦ
  choice: 耶稣弥赛亚
  rationale: Χριστός在此仍有称号作用；译作“弥赛亚”使其不被误听为姓氏，并保留其受膏者含义。
theological_decisions:
- issue: 是否保留“束起心思的腰”这一身体隐喻
  choice: 正文保留隐喻，并以脚注解释为预备心思采取行动
  alternative: 预备好你们的心思，随时行动
  rationale: 原文刻意使用束起长衣、准备行动的鲜明图像；保留图像可避免把经文直接化约为解释。
- issue: τελείως修饰哪一个成分
  choice: 正文按“把盼望完全寄托”处理
  alternative: “完全保持清醒”，或让它同时影响清醒与盼望
  rationale: 希腊词序容许不同连接方式，不能在翻译中假装歧义不存在；正文采用自然且常见的理解，脚注明确保留另一可能。
- issue: Χριστός的称号性质
  choice: 弥赛亚
  alternative: 基督
  rationale: 在耶稣末后显现的语境中，受膏者称号仍然清晰可闻；“弥赛亚”保留称号功能，不把它处理成固定姓名的一部分。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。正文保留“束腰”的原文意象，以脚注帮助不熟悉古代服饰习惯的读者；“保持清醒”强调思想清明而不导入禁酒含义；整体句式围绕主要命令“把盼望……寄托”展开。
