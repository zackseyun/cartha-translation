  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὃν οὐκ ⸀ἰδόντες ἀγαπᾶτε, εἰς ὃν ἄρτι μὴ ὁρῶντες πιστεύοντες δὲ ⸀ἀγαλλιᾶσθε χαρᾷ ἀνεκλαλήτῳ καὶ δεδοξασμένῃ,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/008.yaml
  text: Though you have not seen him[a], you love him. Though you do not now see him, yet believing in him, you rejoice with inexpressible and glorious joy,
translation:
  language: zh_hans
  text: 你们虽然没有见过他，却爱他；如今虽然看不见他，却信靠他，并以无法言表、满有荣耀的喜乐欢欣。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “满有荣耀的喜乐”也可译作“得了荣耀的喜乐”或“荣耀的喜乐”。
    reason: 原文 δεδοξασμένῃ 是完成时被动分词，既可较形式地理解为“得了荣耀的”，也可按其结果状态表达为“满有荣耀的”或较简洁地译为“荣耀的”。
lexical_decisions:
- source_word: ὃν οὐκ ἰδόντες
  choice: 虽然没有见过他
  rationale: 关系代词指向上文的耶稣基督；不定过去时分词表示此前未曾见过，在汉语中用“没有见过”自然表达，并保留其与现在“爱他”的对照。
- source_word: ἀγαπᾶτε
  choice: 爱他
  rationale: 现在时直陈语气表明持续的现实状态；“爱”简洁、自然，也符合该词通常的语义。
- source_word: εἰς ὃν … πιστεύοντες
  choice: 信他
  rationale: πιστεύω 与 εἰς 连用，以基督为信靠的对象。“信他”是现代汉语中自然明确的表达，同时可涵盖相信与信靠。
- source_word: ἄρτι μὴ ὁρῶντες
  choice: 如今虽然看不见他
  rationale: ἄρτι 表示当前时刻，ὁρῶντες 为现在时分词；“如今……看不见”保留当前未见的持续状态，并以“虽然”显出让步关系。
- source_word: δὲ
  choice: 却
  rationale: 此处带轻微转折，突出虽未看见仍然相信并欢欣；“却”符合汉语语篇关系。
- source_word: ἀγαλλιᾶσθε
  choice: 欢欣
  rationale: 该动词表达强烈、洋溢的喜乐。“欢欣”比单纯“喜乐”更能体现其加强意味，又保持庄重自然。
- source_word: χαρᾷ ἀνεκλαλήτῳ
  choice: 因那无法言表的喜乐
  rationale: χαρᾷ 是方式或伴随意义的与格；汉语以“因……喜乐而欢欣”避免“以喜乐喜乐”的重复。ἀνεκλάλητος 指无法用言语充分表达。
- source_word: δεδοξασμένῃ
  choice: 满有荣耀的
  rationale: 该完成时被动分词修饰“喜乐”，含有被赋予荣耀、充满荣耀的意味。“满有荣耀”比生硬的“被荣耀了的喜乐”更自然，同时不把它简单弱化为一般的“荣耀的”。
theological_decisions:
- issue: πιστεύοντες 与 εἰς ὃν 的表达
  choice: 信他
  alternative: 信靠他
  rationale: 原文明确以基督为信的对象。“信他”简洁自然，并保留“相信”与“信靠”之间的语义宽度；“信靠他”虽可行，却较偏重信赖这一层面。
- issue: δεδοξασμένῃ χαρᾷ 的理解
  choice: 满有荣耀的喜乐
  alternative: 得了荣耀的喜乐；荣耀的喜乐
  rationale: 原文用完成时被动分词，表达这种喜乐已经被赋予荣耀或充满荣耀。主文采用自然且能保留结果状态的说法，脚注列出较形式对应的译法，以免消除原文的表达张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。两次“虽然……却……”呈现原文中未见与爱、信及欢欣之间的让步和对照。为避免“以喜乐欢喜”在汉语中的同义重复，用“因那……喜乐而欢欣”。脚注标记置于相关短语之后。
