id: 1PE.1.12
reference: 1 Peter 1:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οἷς ἀπεκαλύφθη ὅτι οὐχ ἑαυτοῖς ὑμῖν δὲ διηκόνουν αὐτά, ἃ νῦν ἀνηγγέλη ὑμῖν διὰ τῶν εὐαγγελισαμένων ⸀ὑμᾶς πνεύματι ἁγίῳ ἀποσταλέντι ἀπ’ οὐρανοῦ, εἰς ἃ ἐπιθυμοῦσιν ἄγγελοι παρακύψαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/012.yaml
  text: To them it was revealed that they were serving not themselves but you in these things[c][b][a], which now have been announced to you through those who preached the good news to you by the Holy Spirit sent from heaven—things into which angels long to look.
translation:
  language: zh_hans
  text: 他们得到启示，知道他们在这些事上所作的服事，不是为自己，而是为你们[a]。如今，这些事已经借着那些靠着从天上差来的圣灵、向你们传好消息的人，传报给你们了[b]；天使也渴望俯身察看这些事[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“不是服事自己，而是服事你们”；原文的与格表示先知服事所惠及的对象。
    reason: lexical_alternative
  - marker: b
    text: “向你们传好消息的人”也可译作“向你们宣讲福音的人”；原文使用的动词意为“宣告好消息”。
    reason: lexical_alternative
  - marker: c
    text: “俯身察看”也可译作“探看”或“仔细察看”，表达热切而专注地想要深入观看。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἷς ἀπεκαλύφθη
  choice: 他们蒙了启示
  rationale: οἷς回指上文的众先知；保留ἀπεκαλύφθη的被动启示语态，同时不擅自补出启示者。
- source_word: οὐχ ἑαυτοῖς ὑμῖν δὲ
  choice: 不是自己，而是你们
  rationale: 两个与格在διηκόνουν之后表示服事所惠及的对象；正文保留简洁鲜明的对比，脚注说明也可显译为“不是为了自己，而是为了你们”。
- source_word: διηκόνουν αὐτά
  choice: 在这些事上所服事的
  rationale: 未完成时表示过去持续进行的服事；αὐτά指上文先知所查考并预言的救恩之事。
- source_word: ἃ νῦν ἀνηγγέλη ὑμῖν
  choice: 如今，这些事已经……宣告给你们了
  rationale: 保留νῦν与先知时代的时间对照，并以“已经……了”自然表达宣告已发生且与读者当前处境相关。
- source_word: διὰ τῶν εὐαγγελισαμένων ὑμᾶς
  choice: 借着那些……向你们传好消息的人
  rationale: 按动词εὐαγγελίζω翻译为“传好消息”，既通俗自然，也不把动词不必要地名词化。
- source_word: πνεύματι ἁγίῳ ἀποσταλέντι ἀπ’ οὐρανοῦ
  choice: 靠从天上差来的圣灵
  rationale: “靠”表达工具性与能力来源，同时保留圣灵从天上受差而来的被动使命意味。
- source_word: ἐπιθυμοῦσιν
  choice: 渴望
  rationale: 现在时呈现天使持续而强烈的愿望；“渴望”自然且具有庄重感。
- source_word: παρακύψαι
  choice: 俯身察看
  rationale: 该词可描写弯身探看、专注察看；此译保留εἰς所带出的深入探察意象，而不把它弱化为普通的“看”。
theological_decisions:
- issue: πνεύματι ἁγίῳ的所指及与传福音行动的关系
  choice: 译作“靠……圣灵”，理解为圣灵是传好消息的神圣施行者或能力来源
  alternative: 译作“在圣灵里”，强调传讲发生于圣灵所构成的领域或状态中
  rationale: 此处与“从天上差来”相连，最自然地指向圣灵；与格可能具有工具性或领域性，正文采用较合语境的工具性表达，脚注保留另一种句法可能。
- issue: 先知服事与后来福音宣告的时间关系
  choice: 先知在所预言的事上服事后来听见好消息的读者
  alternative: 把先知的服事主要理解为面向其同时代的人
  rationale: οὐχ ἑαυτοῖς ὑμῖν δὲ明确形成“不是自己，而是你们”的对照；译文保留这一救恩历史上的时间张力，又不抹去先知信息在其原处境中的其他作用。
- issue: 天使察看的对象
  choice: 指本节所说、现已宣告的救恩之事
  alternative: 狭义地只指传福音的过程或圣灵的差遣
  rationale: 复数关系代词ἃ自然回指前述诸事；译为“这些事”保留宽广所指，不将对象限定为单一环节。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“蒙了启示”“宣告”“圣灵”等保留经文的启示与神学语域；“传好消息”直译动词性表达，避免过度教会术语化。“俯身察看”保留原文生动意象。
