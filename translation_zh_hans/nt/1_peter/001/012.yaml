revisions:
- from: 他们蒙了启示，知道他们在这些事上所服事的，不是自己，而是你们[a]。如今，这些事已经借着那些靠从天上差来的圣灵向你们传好消息的人，宣告给你们了[b]；连天使也渴望俯身察看这些事[c]。
  to: 他们得到启示，知道他们在这些事上所作的服事，不是为自己，而是为你们[a]。如今，这些事已经借着那些靠着从天上差来的圣灵、向你们传好消息的人，传报给你们了[b]；天使也渴望俯身察看这些事[c]。
  rationale: 修订主要澄清中文句法，使“不是为自己，而是为你们”明确修饰先知在前述救恩之事上的服事，保留原文受益与格的对比。第二句将长定语以逗号分隔，并采用“传报”对应ἀνηγγέλη。脚注b改为紧扣“传好消息”的词汇替代，解决其原先与锚点和英文审计轨迹不一致的问题。未对πνεύματι ἁγίῳ另设脚注，因为正文“靠着……圣灵”自然表达最合语境的工具性理解，且不需要以脚注制造不必要的歧义。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T03:57:03Z'
review_pass:
  verdict: revise
  source_fidelity: 原译准确呈现了先知所得的启示、服事对象的对比、如今福音的宣告、从天上差来的圣灵，以及天使热切察看的意象。不过“他们在这些事上所服事的，不是自己，而是你们”在汉语中修饰关系不够清楚，容易使“这些事”成为“服事”的直接对象，而“不是自己、而是你们”又似乎与之不协调。改为“他们在这些事上所作的服事，不是为自己，而是为你们”更明确地表达与格所标示的受益对象，也保留原文的概括性。
  naturalness: “蒙了启示”可用，但“得到启示”在现代庄重书面语中更顺畅。原文中“靠从天上差来的圣灵向你们传好消息的人”定语较长；加入“靠着”并调整断句后，施事、方式和受众的关系更清晰。
  terminology: “圣灵”“从天上差来”“传好消息”“天使”“俯身察看”均合适。“传报”较贴近ἀναγγέλλω，又不强行将其技术化为特定教会用语。脚注b原本实际讨论圣灵的与格，却锚定在整段宣告之后，未对应英文审计轨迹中对εὐαγγελίζω的替代译法；修订后使其锚定“传好消息”，并说明相应词义。
  issues:
  - severity: medium
    issue: “他们在这些事上所服事的，不是自己，而是你们”句法和指代关系含混。
    rationale: διηκόνουν的两个与格表示服事所惠及的对象；中文宜显出“为自己／为你们”的受益关系，避免读者把“自己、你们”误解为被服事的内容。
  - severity: low
    issue: 脚注b的锚点与说明内容及英文审计轨迹不一致。
    rationale: 现有脚注b说明πνεύματι ἁγίῳ的句法可能性，但标记置于整句末，且英文对应标记讨论的是εὐαγγελίζω。将脚注改为说明“传好消息”的替代译法，可使锚点和审计信息一致。
