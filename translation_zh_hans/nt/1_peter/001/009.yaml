  yaml_path: translation/nt/1_peter/001/009.yaml
  text: as you receive the outcome of your faith[b][a], the salvation of your souls.
translation:
  language: zh_hans
  text: 你们正领受你们信心的结果[a]，就是你们灵魂的救恩[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “结果”也可译作“终点”、“目标”或“成果”。
    reason: lexical_alternative
  - marker: b
    text: “灵魂”也可按语境译作“生命”或“人”。希腊语该词可指灵魂、生命或人本身。
    reason: lexical_alternative
lexical_decisions:
- source_word: κομιζόμενοι
  choice: 正在得着
  rationale: 该词是现在时分词，承接上文并指向读者正在获得、领受信心所带来的结果。“正在得着”保留其持续意味，也不对中间或被动语态作过度解释。
- source_word: τέλος
  choice: 成果
  rationale: 此处指信心最终实现的结果。“成果”比单纯表示时间终点的“终点”更符合语境，同时不过分强调主观设定的目标。
- source_word: πίστεως ὑμῶν
  choice: 信心
  rationale: 译文中的“你们”同时自然涵盖了原文“你们的信心”。πίστις在此最自然地指读者的信心；“信实”或“信靠”虽有词义上的可能，但不是本句首选。
- source_word: σωτηρίαν
  choice: 救恩
  rationale: “救恩”既是本书信语境中稳定而恰当的译法，也能容纳当前的领受与将来完全实现的层面。
- source_word: ψυχῶν
  choice: 灵魂
  rationale: ψυχή可按语境表示灵魂、生命或人本身。正文采用较直接的“灵魂”，但不据此引申严格的身心二元论；其他可能译法列入脚注。
theological_decisions:
- issue: πίστις在本句中的含义
  choice: 信心
  alternative: 信靠；信实
  rationale: “你们的信心”在上下文中最自然地指读者相信并倚靠上帝的回应。保留“信心”可避免把它改释为单纯的忠诚表现。
- issue: “灵魂的救恩”所表达的人观
  choice: 灵魂的救恩
  alternative: 生命得救；人得救
  rationale: 正文贴近原文措辞，同时不把“灵魂”解释为与身体完全分离的部分，也不暗示救恩排除身体；ψυχή所具有的“生命”或“人本身”之义在脚注中保留。
- issue: 救恩的时间层面
  choice: 正在得着
  alternative: 终将得到
  rationale: 现在时分词支持正在领受的表达，而τέλος又带有结果或终局的意味。译文保留这种已在领受、又指向最终成果的张力，不将其单独限定为现在或将来。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“正在得着”体现分词与上文的延续关系；“就是”清楚表达“灵魂的救恩”对“信心的成果”的同位说明。脚注标记均置于正文相应词语之后。
