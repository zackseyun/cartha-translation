  text: προεγνωσμένου μὲν πρὸ καταβολῆς κόσμου, φανερωθέντος δὲ ἐπ’ ⸀ἐσχάτου τῶν χρόνων δι’ ὑμᾶς
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/020.yaml
  text: He was foreknown before the foundation of the world[a], but was revealed at the end of the times for your sake[b],
translation:
  language: zh_hans
  text: 他在创世以前已被预知[a]，却在诸时代的末期[b]为了你们被显明。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“已被预先拣选”。希腊文的字面意思是“已被预知”；这个词可以含有上帝旨意的意味，但正文没有进一步作出解释。
    reason: lexical_alternative
  - marker: b
    text: 或译“在这些末后的时期”。
    reason: alternative_reading
lexical_decisions:
- source_word: προεγνωσμένου
  choice: 已被预知
  rationale: 这个不定过去时被动分词承接第19节所说的基督。“被预知”保留了 προγινώσκω 的基本词义，也保留了其中可能含有上帝旨意、却不必直接等同于“预先拣选”的张力。
- source_word: πρὸ καταβολῆς κόσμου
  choice: 在创世以前
  rationale: 这是表示世界受造以前的惯用语。“创世以前”是现代中文自然、庄重的表达，准确传达其前于创造的时间意义。
- source_word: φανερωθέντος
  choice: 显现出来
  rationale: 被动分词表示他被显明、公开呈现。“显现出来”在中文中自然，并保留从隐藏到显明的语义。
- source_word: ἐπ’ ἐσχάτου τῶν χρόνων
  choice: 在诸时期的末后
  rationale: 较贴近原文“在众时期的末端”，保留复数“时期”和末世性的时间指向，且不在正文中加入原文没有明说的“这些”。
- source_word: δι’ ὑμᾶς
  choice: 为你们
  rationale: διά 加宾格在这里表达受益或目的；“为你们”简洁自然，表明基督的显现是为了读者的益处。
theological_decisions:
- issue: προεγνωσμένου 描述基督在创世以前与上帝的关系
  choice: 正文译作“已被预知”
  alternative: 已被预先拣选；已被预定
  rationale: 原词可在圣经语境中含有上帝预定旨意的意味，但并不要求翻译直接改用“拣选”或“预定”。保留“预知”可避免替原文消解神学张力。
- issue: ἐπ’ ἐσχάτου τῶν χρόνων 的时间含义
  choice: 在诸时期的末后
  alternative: 在这些末后的时期
  rationale: 原文表达末世性的时期，却没有明说“这些”。正文采用较贴近原文的表达，另一种较顺畅但略带指示意味的译法列入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“在诸时期的末后”略带经文体色彩，用以保留原文复数结构及末世性的张力；其较自然的替代译法收入脚注。
