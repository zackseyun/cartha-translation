  text: 因为经上记着：“你们要圣洁，因为我是圣洁的。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διότι
  choice: 因为
  rationale: 引出前文劝勉的经文依据，保留明确的因果关系。
- source_word: γέγραπται
  choice: 经上记着说
  rationale: 采用现代中文常见的引经格式，既表达完成时被动语态所含的既已写下、持续有效之意，也自然引出直接引语。
- source_word: ὅτι（第一个）
  choice: 由引号和“说”表达
  rationale: 此处引出引文；中文不必另译为“即”，由“说”和引号自然承载其功能。
- source_word: Ἅγιοι
  choice: 圣洁
  rationale: 在伦理和盟约语境中，“圣洁”兼顾归神分别与品格要求，比单译“分别出来”更完整。
- source_word: ἔσεσθε
  choice: 要成为
  rationale: 保留将来时形式及其在律法引文中的命令意味，避免仅译成预测性的“将会”，也不完全改写成单纯祈使句。
- source_word: ὅτι（第二个）
  choice: 因为
  rationale: 清楚表达神自身的圣洁是这项要求的根据。
- source_word: ἐγὼ
  choice: 我
  rationale: 保留原文明确使用的人称代词，传达神自我指称的强调。
- source_word: ἅγιος
  choice: 圣洁的
  rationale: 与前面的“圣洁”保持词义一致，清楚表明人的圣洁以神的圣洁为根据。
theological_decisions:
- issue: 圣洁引文中将来时ἔσεσθε的语气
  choice: 译作“要成为圣洁”，兼顾将来时形式和命令作用。
  alternative: 可更直接译作“你们要圣洁”；也可按形式译作“你们将成为圣洁”。
  rationale: 原文沿用利未记希腊文引文的将来时，而这种将来时在律法和劝诫语体中具有命令作用。“要成为”尽量保留其形式与功能之间的张力，不把它化约为单纯预言或普通祈使句。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“经上记着说”符合中文引经习惯；“要成为圣洁”略带经文语体色彩，以保留原文将来形式兼具命令作用的张力。
