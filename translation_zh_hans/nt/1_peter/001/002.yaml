language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: κατὰ πρόγνωσιν θεοῦ πατρός, ἐν ἁγιασμῷ πνεύματος, εἰς ὑπακοὴν καὶ ῥαντισμὸν αἵματος Ἰησοῦ Χριστοῦ· χάρις ὑμῖν καὶ εἰρήνη πληθυνθείη.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/002.yaml
  text: 'according to the foreknowledge of God the Father[a], in the sanctification of the Spirit[c][b], for obedience and sprinkling with the blood of Jesus the Messiah: Grace to you and peace be multiplied.'
translation:
  language: zh_hans
  text: 照着父上帝的预知，借着圣灵使人成圣，为要顺服，并蒙耶稣这位弥赛亚[c]的血所洒[b]。愿恩典与平安多多加给你们！
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “蒙……的血所洒”很可能呼应旧约中立约和洁净的意象，尤其可参看《出埃及记》24:8。
    reason: cross_reference
  - marker: c
    text: 或译“耶稣基督”。希腊语称号Χριστός在某些语境中也可像名称一样使用；这里译作“弥赛亚”，以保留其称号意味。
    reason: alternative_reading
lexical_decisions:
- source_word: κατὰ πρόγνωσιν
  choice: 照……的预知
  rationale: κατά加宾格表示依据或准则；“预知”直接保留πρόγνωσις的词义，不把它扩译为“预定”或仅仅“预见”。
- source_word: θεοῦ πατρός
  choice: 父上帝
  rationale: θεοῦ与πατρός共同指明预知的主体；“父上帝”在现代汉语中自然、庄重，也保留“上帝—父”的关系。
- source_word: ἐν ἁγιασμῷ πνεύματος
  choice: 借着圣灵使人成圣
  rationale: ἐν在此可表达所处领域或施行方式；ἁγιασμός指成圣。结合本节“父—圣灵—耶稣”的三重结构，将πνεύματος理解为圣灵，并用自然汉语表达其使人成圣的工作。
- source_word: εἰς ὑπακοὴν
  choice: 为要顺服
  rationale: εἰς表示目的或结果；“为要”保留其指向性，“顺服”准确表达ὑπακοή。
- source_word: καὶ ῥαντισμὸν αἵματος
  choice: 也蒙……的血所洒
  rationale: ῥαντισμός意为洒、洒血；用“蒙……所洒”表达血施用于人的含义，同时保留其礼仪和立约意象。
- source_word: Ἰησοῦ Χριστοῦ
  choice: 耶稣弥赛亚
  rationale: Χριστός在这里仍具有称号意味；译作“弥赛亚”可显明其“受膏者”称号，而不只把它当作姓名的一部分。
- source_word: χάρις ὑμῖν καὶ εἰρήνη πληθυνθείη
  choice: 愿恩典与平安多多加给你们
  rationale: πληθυνθείη为表达祝愿的希求语气；“愿……多多加给你们”既传达祝福，也自然表达“增多”的意思。
theological_decisions:
- issue: πρόγνωσις与拣选的关系
  choice: 译作“预知”，不进一步解释
  alternative: 预定；预先拣选；预先的慈爱；预见
  rationale: 原词本身可以引发关于上帝预先知道、预先拣选或两者关系的讨论；正文应保留这种神学张力，不替读者裁定。
- issue: πνεύματος的所指
  choice: 理解为“圣灵”
  alternative: 人的灵；非人格性的灵性力量
  rationale: 本节依次提到父上帝、圣灵和耶稣，三重结构强烈支持这里指圣灵。
- issue: πνεύματος属格和ἐν的功能
  choice: 正文采用较自然的工具性表达“借着圣灵使人成圣”
  alternative: 在圣灵的圣化中；在圣灵所成就的成圣中
  rationale: 希腊语形式容许领域或工具等细微差别；中文若机械译作“在……的圣化中”较生硬。现译文表达最可能的施事关系，但不把成圣过程作更细的教义界定。
- issue: Χριστοῦ的称号性质
  choice: 译作“弥赛亚”
  alternative: 基督
  rationale: 此处Χριστός可像名称一样使用，也仍承载“受膏者”的称号意义；“弥赛亚”保留后者，脚注提示通行替代译法。
- issue: “洒血”的背景
  choice: 保留洒血表达，不在正文解释其具体功效
  alternative: 洁净；立约；赎罪
  rationale: 该措辞可能同时唤起立约和洁净等旧约意象；正文不应只选定其中一种含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“父上帝”“使人成圣”“蒙……的血所洒”保留经文的神学密度，又避免生硬照搬希腊语结构。末句用祝愿式“愿……多多加给你们”，符合书信问安语体。
