  text: ἀλλὰ κατὰ τὸν καλέσαντα ὑμᾶς ἅγιον καὶ αὐτοὶ ἅγιοι ἐν πάσῃ ἀναστροφῇ γενήθητε,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/015.yaml
  text: but as the Holy One who called you is holy[a], you yourselves also be holy in all your conduct[b],
translation:
  language: zh_hans
  text: 而要像那位呼召你们的圣洁者一样，你们自己也要在一切行事为人上都圣洁[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “都圣洁”也可译作“成为圣洁”。这里的希腊语动词可以强调进入或显出这种状态。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: 而要
  rationale: 承接上文形成鲜明转折，并自然引出正面的劝勉；中文用“而要”比单独的“但是”更顺畅。
- source_word: κατὰ τὸν καλέσαντα ὑμᾶς ἅγιον
  choice: 像那位呼召你们的圣者一样
  rationale: κατά表示以呼召者为对应的标准；“圣者”保留ἅγιον对上帝圣洁属性及其位格指称的双重作用，同时避免添入原文没有的第二个“圣洁”。
- source_word: καὶ αὐτοὶ
  choice: 你们自己也
  rationale: “自己”保留αὐτοί的强调，“也”对应καί，突出信徒应与呼召他们的圣者相称。
- source_word: ἅγιοι
  choice: 圣洁
  rationale: 与前一个ἅγιον保持词根呼应，准确表达本节的核心要求。
- source_word: ἐν πάσῃ ἀναστροφῇ
  choice: 在一切行事为人上
  rationale: ἀναστροφή指人的整个生活方式和行为表现；“行事为人”是自然、庄重且范围较广的现代汉语表达。
- source_word: γενήθητε
  choice: 成为
  rationale: 保留γίνομαι不定过去时命令式可能具有的进入或呈现某种状态之意味；在中文中“成为圣洁”自然，也比单纯“要圣洁”更贴近动词本身。
theological_decisions:
- issue: 上帝的圣洁与信徒蒙召成为圣洁之间的对应
  choice: 像那位呼召你们的圣者一样……也要……成为圣洁
  alternative: 既然呼召你们的那一位是圣洁的，你们也要圣洁
  rationale: 所选译法保留κατά所表达的对应和榜样关系，也维持ἅγιον与ἅγιοι之间刻意的词义呼应，不把句法扩展为因果解释。
- issue: γενήθητε在成圣劝勉中的语气
  choice: 成为圣洁
  alternative: 要圣洁
  rationale: “成为”保留希腊动词可能含有的进入、达到或显明该状态的力度，但不进一步规定成圣过程的具体教义模式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“圣者”指那位呼召信徒的上帝；“行事为人”涵盖整体生活方式，而不只指个别行为。
