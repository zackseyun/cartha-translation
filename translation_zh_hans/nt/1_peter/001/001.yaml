  text: Πέτρος ἀπόστολος Ἰησοῦ Χριστοῦ ἐκλεκτοῖς παρεπιδήμοις διασπορᾶς Πόντου, Γαλατίας, Καππαδοκίας, Ἀσίας, καὶ Βιθυνίας,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/001.yaml
  text: Peter[a], an apostle of Jesus the Messiah, to the chosen sojourners of the dispersion in Pontus, Galatia, Cappadocia, Asia, and Bithynia[e][d][c][b],
translation:
  language: zh_hans
  text: 彼得，耶稣基督[a]的使徒，写信给蒙拣选、散居[b]在本都、加拉太、加帕多家、亚细亚[d]和庇推尼的寄居者[c]：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “基督”意为“受膏者”，也就是“弥赛亚”；这里是耶稣的称号。
    reason: lexical_alternative
  - marker: b
    text: “散居”一词可能使人联想到犹太人散居列国的处境，也可更广泛地描写上帝的子民住在并非真正家乡之地；本节没有把这两层意味截然分开。
    reason: cultural_note
  - marker: c
    text: “寄居者”也可译作“客旅”或“侨居者”；原词强调人在异乡居住、并不完全属于当地的身份。
    reason: lexical_alternative
  - marker: d
    text: 这里的“亚细亚”不是现代所说的整个亚洲，而是罗马帝国在小亚细亚西部的一个行省。
    reason: historical_geography
lexical_decisions:
- source_word: Πέτρος
  choice: 彼得
  rationale: 采用现代中文圣经传统中通行的人名译法，不把名字的字面含义译出。
- source_word: ἀπόστολος
  choice: 使徒
  rationale: 这里是书信开头的身份称谓，表示受差遣并具有代表权柄的人；“使徒”既保留新约中的专门用法，也符合现代中文习惯。
- source_word: Ἰησοῦ Χριστοῦ
  choice: 耶稣基督
  rationale: “基督”是 Χριστός 在中文中的通行称号，承载“受膏者／弥赛亚”的头衔含义；脚注说明其意义，避免读者仅将其视为姓名。
- source_word: ἐκλεκτοῖς
  choice: 蒙拣选
  rationale: 表达这些收信人是被选择的，同时不把经文限定在某一套有关拣选的宗派教义中。
- source_word: παρεπιδήμοις
  choice: 寄居者
  rationale: 该词指居住在异乡、并非当地正式归属者的人；“寄居者”比行政色彩较强的“外侨”更自然，也能保留本段可能具有的属灵意味。
- source_word: διασπορᾶς
  choice: 散居
  rationale: 用动词化表达使中文句子自然，同时保留“分散居住”及其可能唤起犹太散居传统的含义。
- source_word: Πόντου, Γαλατίας, Καππαδοκίας, Ἀσίας, καὶ Βιθυνίας
  choice: 本都、加拉太、加帕多家、亚细亚和庇推尼
  rationale: 采用中文圣经地名的通行译名；这些名称在此指罗马时代的小亚细亚地区或行省。
theological_decisions:
- issue: ἐκλεκτοῖς 的神学力度
  choice: 蒙拣选
  alternative: 被选中的
  rationale: “蒙拣选”准确保留经文对收信人身份的肯定，但不进一步说明拣选的方式、条件或教义体系。
- issue: παρεπιδήμοις διασπορᾶς 的指向
  choice: 蒙拣选、散居……的寄居者
  alternative: 散居各地的流亡者；犹太散居者
  rationale: 正文不强行判定收信人全是民族意义上的犹太侨民，也不把他们完全解释为象征意义上的属灵流亡者，因而保留社会处境、犹太散居传统和神学寓意之间的张力。
- issue: Χριστός 是称号还是固化姓名
  choice: 正文用“基督”，脚注说明“弥赛亚／受膏者”之意
  alternative: 耶稣弥赛亚
  rationale: 现代中文以“耶稣基督”为自然且庄重的固定表达；脚注明确其称号性质，避免丢失原词的弥赛亚含义。
translation_notes:
  register: 采用现代、庄重而易懂的书信起首语体。“写信给”补出希腊文书信格式中隐含的收信关系；以冒号承接下文。地名沿用中文圣经中较熟悉的形式，并通过脚注避免把“亚细亚”误解为现代亚洲。
