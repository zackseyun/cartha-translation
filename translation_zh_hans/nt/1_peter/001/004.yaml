base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/004.yaml
  text: into an inheritance imperishable and undefiled and unfading, kept in the heavens for you,
translation:
  language: zh_hans
  text: 以承受那不能朽坏、毫无玷污、永不衰残的产业；这产业已在天上为你们保留，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς κληρονομίαν
  choice: 为要得着……产业
  rationale: εἰς承接上文“重生”的趋向或结果。汉语若直译为“进入产业”不自然，因此译出朝向得产业的含义，同时保留与上文的句法联系。κληρονομία指所承受的份或产业，译作普通读者易懂且庄重的“产业”。
- source_word: ἄφθαρτον
  choice: 不能朽坏
  rationale: 表达不受腐朽毁坏的性质，并与后面两个并列形容词保持整齐有力的节奏。
- source_word: ἀμίαντον
  choice: 毫无玷污
  rationale: 强调这产业本身纯净、未受污染，而不是仅表示将来不会被污染。
- source_word: ἀμάραντον
  choice: 永不衰残
  rationale: 保留原词“不凋谢、不衰败”的意象，并与“不能朽坏”有所区分。
- source_word: τετηρημένην
  choice: 存留
  rationale: 完成时被动态表示这产业已经被保存，并持续为收信人保留；汉语“存留”简洁地体现这种持续状态。
- source_word: ἐν οὐρανοῖς
  choice: 在天上
  rationale: 希腊文使用复数“诸天”，但现代汉语通常以“天上”自然表达其空间和神学指向，不额外引入分层诸天的解释。
- source_word: εἰς ὑμᾶς
  choice: 为你们
  rationale: 这里表示产业为收信人保留、以他们为归属对象；“为你们”自然保留这一指向。
theological_decisions:
- issue: 产业被保守的施事者
  choice: 采用“存留”的无施事表达
  alternative: 译作“由上帝保守”
  rationale: 原文是神学被动式的可能性存在，但没有明说施事者；不补出“上帝”，以免把隐含关系变成明说。
- issue: εἰς与上文重生的关系
  choice: 译为目的或趋向性的“为要得着”
  alternative: 译为“进入”或“直到”
  rationale: 原文可涵盖趋向、目的和结果。中文“为要得着”在当前句法中最自然，但不将产业解释为靠行为赚取，而是承接上文因重生而有的归向。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“不能朽坏、毫无玷污、永不衰残”保留原文三个并列形容词的递进节奏；分号用于清楚呈现关系从句所说明的产业状态。
