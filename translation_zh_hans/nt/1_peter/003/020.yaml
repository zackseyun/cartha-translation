source:
  edition: SBLGNT
  text: ἀπειθήσασίν ποτε ὅτε ἀπεξεδέχετο ἡ τοῦ θεοῦ μακροθυμία ἐν ἡμέραις Νῶε κατασκευαζομένης κιβωτοῦ εἰς ἣν ⸀ὀλίγοι, τοῦτ’ ἔστιν ὀκτὼ ψυχαί, διεσώθησαν δι’ ὕδατος.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/020.yaml
  text: who formerly were disobedient[a], when the patience of God was waiting in the days of Noah while the ark was being prepared, into which a few—that is[b], eight persons—were brought safely through water.
translation:
  language: zh_hans
  text: 他们从前不顺从。在挪亚的日子，当方舟正在建造时，神一直耐心等候。进入方舟的只有少数人，也就是八个人[a]；他们经过洪水，得以安全脱险[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“八个灵魂”，这里指八个人。
    reason: lexical_alternative
  - marker: b
    text: 或译：“他们借着水得救。”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπειθήσασίν ποτε
  choice: 他们从前不顺从
  rationale: ἀπειθέω在这里指拒不顺从，而不只限于理智上的不信；ποτε标明过去的时间。译文承接上一节所说的对象。
- source_word: ἀπεξεδέχετο ἡ τοῦ θεοῦ μακροθυμία
  choice: 神一直耐心等候
  rationale: 未完成时态表达持续的等候；μακροθυμία表明神延迟审判、恒久忍耐。汉语以“耐心等候”自然地合并表达。
- source_word: ἐν ἡμέραις Νῶε
  choice: 挪亚的日子
  rationale: 保留原文的时间表达，并采用现代中文圣经语境中自然、庄重的说法。
- source_word: κατασκευαζομένης κιβωτοῦ
  choice: 方舟正在建造时
  rationale: 现在分词被动形式表明方舟处于预备、建造的过程中；在挪亚语境中，“建造”比笼统的“预备”更清楚。
- source_word: εἰς ἣν ὀλίγοι
  choice: 进入方舟的只有少数人
  rationale: εἰς保留进入的方向含义；“只有少数人”自然表达人数很少这一重点。
- source_word: τοῦτ’ ἔστιν ὀκτὼ ψυχαί
  choice: 也就是八个人
  rationale: ψυχαί在这里按闪语式用法指八个活人，并非刻意区分身体与灵魂；“人”最清楚，字面形式收入脚注。
- source_word: διεσώθησαν δι’ ὕδατος
  choice: 他们经过水，得以安全脱险
  rationale: διασῴζω突出从危险中安全保存、脱险；διά加属格既可涉及经过洪水，也可能被理解为借着水。正文以“经过水”保留洪水中的通过意象，另一种重要译法收入脚注。
theological_decisions:
- issue: διεσώθησαν是否采用带有明确救恩术语色彩的“得救”
  choice: 得以安全脱险
  alternative: 得救
  rationale: 此处直接叙述八人在洪水中蒙保全。“安全脱险”保留具体事件的含义，不预先替下一节的洗礼预表作神学定论；“得救”仍是语义上成立且具有解释意义的译法，列入脚注。
- issue: δι’ ὕδατος表示经过水还是借着水
  choice: 经过水
  alternative: 借着水
  rationale: διά加属格通常可表示媒介或手段，但本语境也自然呈现人在洪水中被安全带过的图景。正文不把水单纯定为施救工具，脚注保留工具性理解。
- issue: ψυχαί是否译为“灵魂”
  choice: 人
  alternative: 灵魂
  rationale: 这里是在计算进入方舟的人数，不是在建立灵魂与身体的技术性人论区分；正文采用现代汉语清楚的“人”，脚注保留原文较直译的表达。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。将希腊文较长的从属结构分成数句，以免中文晦涩，同时保留与上一节对象的承接、神持续等候的过程、进入方舟的方向性，以及“经过水／借着水”和“安全脱险／得救”的解释张力。
