revisions:
- from: 他们从前不顺从。挪亚的日子，方舟正在建造时，神一直耐心等候。进入方舟的只有少数人，也就是八个人[a]；他们经过水，得以安全脱险[b]。
  to: 他们从前不顺从。在挪亚的日子，当方舟正在建造时，神一直耐心等候。进入方舟的只有少数人，也就是八个人[a]；他们经过洪水，得以安全脱险[b]。
  rationale: 修订仅改善现代汉语的句法衔接，并将“水”在挪亚叙事中的明确所指表达为“洪水”。保留“安全脱险”与脚注“借着水得救”的张力，不以正文裁定διὰ ὕδατος的媒介性理解，也保留ψυχαί的字面译法脚注。
