id: 1PE.3.1
reference: 1 Peter 3:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ⸀Ὁμοίως γυναῖκες ὑποτασσόμεναι τοῖς ἰδίοις ἀνδράσιν, ἵνα ⸀καὶ εἴ τινες ἀπειθοῦσιν τῷ λόγῳ διὰ τῆς τῶν γυναικῶν ἀναστροφῆς ἄνευ λόγου κερδηθήσονται
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/001.yaml
  text: Likewise[a], wives, being subject to your own husbands, so that even if some are disobeying the word, they may be won without a word through the conduct of their wives,
translation:
  language: zh_hans
  text: 同样，作妻子的，要顺服自己的丈夫。这样，即使有些丈夫不顺从这道[a]，他们也会因妻子的品行、无需言语而被赢得过来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不顺从这道”也可译作“不听从这信息”，指他们拒绝所传的福音。
    reason: 说明ἀπειθέω可表达不信或不顺从，并交代λόγος在此处的福音信息含义。
lexical_decisions:
- source_word: Ὁμοίως
  choice: 同样
  rationale: 保留与上文劝勉的连接，表达“照样、同样地”的承接关系。
- source_word: γυναῖκες
  choice: 作妻子的
  rationale: 因后接“自己的丈夫”，此处是婚姻关系中的“妻子”，不是泛指妇女。
- source_word: ὑποτασσόμεναι
  choice: 要顺服
  rationale: 以自然的汉语劝勉句表达分词的命令功能；“顺服”保留关系秩序之意，却不增添绝对服从或地位低下的含义。
- source_word: τοῖς ἰδίοις ἀνδράσιν
  choice: 自己的丈夫
  rationale: ἀνήρ在此家庭语境中指丈夫；“自己的”保留ἰδίοις的强调。
- source_word: ἵνα
  choice: 这样
  rationale: 自然引出目的或预期结果，同时不把二者之间的细微张力过度限定。
- source_word: καὶ εἴ τινες
  choice: 即使有些丈夫
  rationale: “即使”体现καὶ εἴ的让步意味；按上下文补出“丈夫”，使汉语指代清楚。
- source_word: ἀπειθοῦσιν τῷ λόγῳ
  choice: 不顺从这道
  rationale: 保留ἀπειθέω兼有不信与不顺从的语义张力；“这道”在彼得前书语境中指所传的福音信息。
- source_word: διὰ τῆς τῶν γυναικῶν ἀναστροφῆς
  choice: 借着妻子的品行
  rationale: ἀναστροφή指生活方式或行为表现；“品行”简洁、庄重，并与下一节衔接自然。
- source_word: ἄνευ λόγου
  choice: 不用言语
  rationale: 保留与前文“道/话语”的修辞呼应，同时自然表达无需妻子言语劝说之意。
- source_word: κερδηθήσονται
  choice: 被赢得
  rationale: 保留κερδαίνω的“赢得、得着”隐喻及被动语态，不擅自具体化为某一种归信过程。
theological_decisions:
- issue: ὑποτασσόμεναι在家庭劝勉中的性质
  choice: 译作“要顺服”，不解释为绝对服从。
  alternative: 要服从；要使自己处于丈夫之下
  rationale: 原文使用ὑποτάσσω而非通常表示听命的更强用词；译文保留关系秩序，同时不加入本体上的尊卑或无限权威。
- issue: ἀπειθοῦσιν τῷ λόγῳ的信与服从含义
  choice: 译作“不顺从这道”，并以脚注说明也可理解为拒绝相信福音信息。
  alternative: 不相信这信息；拒绝服从福音
  rationale: 该动词可涵盖不信与不顺从。正文保留其意志和行为层面的色彩，脚注呈现福音信仰语境，避免消除原文张力。
- issue: κερδηθήσονται所指的结果
  choice: 保留“被赢得”的隐喻。
  alternative: 被感化；归信；得救
  rationale: 上下文很可能指被赢得而归向信仰，但原文在本节没有把结果直接表述为“得救”；保留隐喻可避免过度解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“作妻子的”明确称呼对象；“这道”保持常见圣经用语，并由脚注解释；句式适度调整，使目的关系和两个λόγος之间“道—言语”的呼应在汉语中清楚可辨。
