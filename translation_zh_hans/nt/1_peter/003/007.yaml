  to: 同样，作丈夫的，你们要以理解和体谅与妻子共同生活；要尊重她，视她为较软弱的女性器皿，也视她为与你们同作生命之恩共同继承人的人，免得你们的祷告受阻。
  rationale: 修订将τῷ γυναικείῳ连同“器皿”作为一个完整的女性性／性别化比喻处理，删除不合原文句法和汉语习惯的“是女性”。两个并列的ὡς短语均以“视为”表达，既保留丈夫尊重妻子时所应采取的看法，也不把第二短语定为明确因果。新增脚注锚点分别对应κατὰ γνῶσιν、较软弱的器皿和χάριτος ζωῆς的必要说明。
