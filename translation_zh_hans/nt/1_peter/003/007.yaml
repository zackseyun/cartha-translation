    rationale: τῷ γυναικείῳ是限定σ κεύει的阴性／女性性定语，不是继“器皿”之后另加“是女性”的谓语断言；原译既不自然，也模糊了“女性的器皿”这一完整隐喻。
  - severity: medium
    issue: “因为她也与你们一同承受”过度明确化ὡς καὶ的关系。
    rationale: 此处与前一个ὡς短语并列，主要说明丈夫应如何看待并尊重妻子。汉语宜以“也作为……共同继承人”呈现，避免把原文未明说的因果连接固定化。
  - severity: medium
    issue: “按着认识”不够自然。
    rationale: 该直译虽可辨认，但现代标准汉语不够顺畅。正文采用“以理解和体谅”，并以脚注保留原短语较宽的“按着知识／以应有的认识”可能性。
