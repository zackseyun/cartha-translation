id: 1PE.3.7
reference: 1 Peter 3:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Οἱ ἄνδρες ὁμοίως συνοικοῦντες κατὰ γνῶσιν, ὡς ἀσθενεστέρῳ σκεύει τῷ γυναικείῳ ἀπονέμοντες τιμήν, ὡς καὶ ⸀συγκληρονόμοις χάριτος ζωῆς, εἰς τὸ μὴ ἐγκόπτεσθαι τὰς προσευχὰς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/007.yaml
  text: Likewise[a], husbands, living together with your wives according to knowledge, assigning honor to the woman as to a weaker vessel, as also fellow heirs of the grace of life[c][b], so that your prayers may not be hindered.
translation:
  language: zh_hans
  text: 同样，作丈夫的，你们要以理解和体谅与妻子共同生活；要尊重她，视她为较软弱的女性器皿，也视她为与你们同作生命之恩共同继承人的人，免得你们的祷告受阻。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οἱ ἄνδρες
  choice: 作丈夫的
  rationale: 承接3:1对妻子的劝勉，此处指丈夫，而非泛指男性。
- source_word: ὁμοίως
  choice: 同样
  rationale: 保留与上文劝勉的篇章联系及比较意味。
- source_word: συνοικοῦντες κατὰ γνῶσιν
  choice: 要按着认识与妻子共同生活
  rationale: 保留κατὰ γνῶσιν较宽的含义，指婚姻共同生活受正确认识和体谅所引导，不把它收窄为单纯情感上的理解。
- source_word: ἀσθενεστέρῳ σκεύει τῷ γυναικείῳ
  choice: 她是较软弱的器皿，是女性
  rationale: 保留比较级和“器皿”的隐喻，并用“是女性”表达τῷ γυναικείῳ对该器皿的限定；不在正文中断定具体指身体或社会处境。
- source_word: ἀπονέμοντες τιμήν
  choice: 要尊重她
  rationale: 自然表达给予应有尊荣之意，比生硬的“分配尊荣”更符合现代汉语。
- source_word: ὡς καὶ συγκληρονόμοις
  choice: 因为她也与你们一同承受
  rationale: 按句法将妻子理解为与丈夫同作继承者；汉语用原因关系使尊重妻子的依据清楚，但不改变共同承受的平等地位。
- source_word: χάριτος ζωῆς
  choice: 生命之恩
  rationale: 保留属格结构的浓缩和开放性，既不限定为今生，也不明说仅指永生。
- source_word: εἰς τὸ μὴ ἐγκόπτεσθαι τὰς προσευχὰς ὑμῶν
  choice: 这样，你们的祷告就不会受到阻碍
  rationale: 自然表达目的或结果，并保留祷告被阻碍的被动意义。
theological_decisions:
- issue: “较软弱的器皿”的含义
  choice: 保留相对软弱及器皿隐喻，不等同于尊严或属灵地位较低。
  alternative: 明确译成身体较弱、社会处境更脆弱或情感更软弱。
  rationale: 原文没有说明软弱的具体层面；紧接着要求尊重妻子，并称她与丈夫同承生命之恩，因此不应把这句话解释为价值或属灵地位低下。
- issue: 共同承受产业者的所指
  choice: 妻子也与丈夫一同承受生命之恩。
  alternative: 将“生命之恩”明确解释为永生，或泛指今生的生命恩赐。
  rationale: 原文明说共同继承，却保留“生命之恩”的范围；译文同样不作过度限定。
- issue: ὡς καὶ的关系
  choice: 在现代汉语正文中译为“因为……也……”，表达尊重妻子的根据。
  alternative: 形式对应为“作为也一同承受……的人”。
  rationale: 两个ὡς结构共同说明丈夫应如何看待妻子；此处原因/根据意味在语境中自然，但希腊语连接本身较含蓄，故译法避免进一步添加教义解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“共同生活”“尊重”“受到阻碍”便于普通读者理解；保留“器皿”“生命之恩”等关键隐喻和神学张力。所有脚注标记均已置于正文。
