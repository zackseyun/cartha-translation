id: 1PE.3.8
reference: 1 Peter 3:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Τὸ δὲ τέλος πάντες ὁμόφρονες, συμπαθεῖς, φιλάδελφοι, εὔσπλαγχνοι, ⸀ταπεινόφρονες,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/008.yaml
  text: Finally[a], all of you, be like-minded, sympathetic, loving as brothers, tenderhearted, humble-minded[b],
translation:
  language: zh_hans
  text: 最后，你们众人都要同心，彼此体恤，像弟兄一样相爱[a]，心怀怜悯，存谦卑的心[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“彼此有手足之爱”。希腊文采用弟兄手足的家庭用语，在这里包括信徒群体中的众人。
    reason: lexical_alternative
  - marker: b
    text: 有些抄本作“待人有礼”或“待人友善”，而不是“存谦卑的心”。
    reason: textual_variant
lexical_decisions:
- source_word: Τὸ δὲ τέλος
  choice: 最后
  rationale: 这是引出劝勉总结的篇章标记；“最后”简洁自然，符合本段语流，并不把它误解为时间或终末意义上的“末了”。
- source_word: πάντες
  choice: 你们众人
  rationale: 该词在此直接指向全体受众；“你们众人”既表达“所有人”，也保留群体性的呼语语气。
- source_word: ὁμόφρονες
  choice: 同心
  rationale: 该词指具有共同的心思或一致的取向；“同心”是自然、庄重的现代汉语，也保留了词中的心思层面，而不暗示每个人在一切细节上意见完全相同。
- source_word: συμπαθεῖς
  choice: 彼此体恤
  rationale: 该词含有与别人一同感受、体会其处境的意思；“彼此体恤”在汉语中自然地表达群体成员间的同感与关怀。
- source_word: φιλάδελφοι
  choice: 像弟兄一样相爱
  rationale: 该词以手足亲情描写信徒群体中的爱；译文保留“弟兄”的原文意象，并用“像……一样”清楚表达这种爱的性质。其在混合群体中的包容性意义由脚注说明。
- source_word: εὔσπλαγχνοι
  choice: 心怀怜悯
  rationale: 该词表示发自内心的柔和、怜悯与慈爱；“心怀怜悯”既保留内在情感的色彩，也符合现代汉语表达。
- source_word: ταπεινόφρονες
  choice: 存谦卑的心
  rationale: 该复合词着重于谦卑的心思或态度；“存谦卑的心”比单译“谦卑”更明确地保留其思想和 disposition 层面的含义。
theological_decisions:
- issue: φιλάδελφοι中的性别化手足语言
  choice: 像弟兄一样相爱
  alternative: 像兄弟姐妹一样彼此相爱；彼此有手足之爱
  rationale: 正文保留希腊文以弟兄手足关系为喻的具体意象，不将其完全中性化；同时，语境中的称呼面向整个信徒群体，其包容性在脚注中明确说明。
- issue: 末尾形容词的异文
  choice: ταπεινόφρονες＝存谦卑的心
  alternative: φιλόφρονες＝待人有礼／友善
  rationale: SBLGNT正文采用ταπεινόφρονες，因此正文据此翻译；另有抄本所见异文具有释经意义，故置于脚注而不替换正文。
translation_notes:
  register: 采用现代、庄重且易懂的劝勉语体。希腊文是一连串形容词，汉语以“都要”统领各项要求，使句法自然；各分句保持简洁并列。脚注[a]放在其实际解释的“像弟兄一样相爱”之后，以免产生错指。
