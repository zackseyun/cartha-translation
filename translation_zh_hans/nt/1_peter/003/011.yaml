    rationale: ἐκκλινάτω、ποιησάτω、ζητησάτω、διωξάτω均为第三人称单数命令式，但该动词形态不编码阳性。英语“him”是英语译文为表达泛指而作的选择，不能反向归为希腊文的阳性形式。
