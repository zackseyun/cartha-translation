  source_fidelity: 正文准确保留了四个命令式的劝诫性质，并保留“离开恶／行善”与“寻求／追求”的动词区分。惟“一心追求”额外加入了原文未明说的专一或全心程度；改为“追求它”可忠实对应διωξάτω αὐτήν。
  naturalness: “要离开恶，行善；要寻求和平，并追求它。”在现代标准汉语中通顺、庄重。重复使用“追求”虽较简洁的意译略显直译，却恰当地呈现原文先“寻求”后“追求”的递进；“它”清楚回指“和平”。
  terminology: “恶”“善”“和平”均适合本节的伦理劝诫语境。“和平”可涵盖εἰρήνη在此的和睦、安宁等宽广含义，不宜擅自窄化。原脚注将希腊文第三人称单数命令式称为“阳性单数形式”不准确：这些动词形式本身不标示语法性别，须修正。
