- from: 要离开恶，行善[a]；要寻求和平，一心追求。
  to: 要离开恶，行善[a]；要寻求和平，并追求它。
  rationale: 删除“一心”以免添加原文未明说的程度意义，并以“并追求它”明确对应διωξάτω αὐτήν。同步更正脚注对于希腊文语法性别的错误说明；正文省略主语的劝诫句式仍自然表达泛指的第三人称单数命令。
