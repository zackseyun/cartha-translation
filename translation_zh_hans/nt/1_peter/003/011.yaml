  text: ἐκκλινάτω ⸀δὲ ἀπὸ κακοῦ καὶ ποιησάτω ἀγαθόν, ζητησάτω εἰρήνην καὶ διωξάτω αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/011.yaml
  text: But let him turn away from evil and do good[a]; let him seek peace and pursue it.
translation:
  language: zh_hans
  text: 要离开恶，行善[a]；要寻求和平，并追求它。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“人要离开恶，行善；人要寻求和平，并追求它。”希腊文动词使用第三人称单数命令式，具有泛指作用。
    reason: 说明原文第三人称单数命令式的代表性、泛指用法，并提供显明主语的译法；避免错误声称该动词形式带有阳性语法性别。
lexical_decisions:
- source_word: ἐκκλινάτω
  choice: 要离开
  rationale: 第三人称单数不定过去时主动命令式，表达明确而坚决的行动；“离开”保留了ἐκκλίνω转离某事的方向感，也符合现代汉语表达。
- source_word: δὲ
  choice: 不单独译出
  rationale: δὲ在此承接上文并带轻微转折；本节作为诗篇引文中的并列劝诫，汉语不加“但”更自然，语义对比仍由“恶—善”清楚呈现。
- source_word: ἀπὸ κακοῦ
  choice: 恶
  rationale: κακόν在此指道德意义上的恶，与ἀγαθόν形成明确对照；“离开恶”简洁庄重。
- source_word: ποιησάτω ἀγαθόν
  choice: 行善
  rationale: 准确表达“做善事、实行良善”的伦理行动；“行善”是自然且凝练的现代汉语搭配。
- source_word: ζητησάτω
  choice: 要寻求
  rationale: 保留ζητέω的“寻找、寻求”含义，并与后面的διώκω形成从寻求到积极追赶的递进。
- source_word: εἰρήνην
  choice: 和平
  rationale: “和平”能承载εἰρήνη在此处的人际和睦及广义安宁，且不把语义过早限定为“和好”。
- source_word: διωξάτω αὐτήν
  choice: 一心追求
  rationale: διώκω表达积极而持续追赶目标的力度；汉语“一心追求”自然地强化行动的迫切性，所追求的对象仍明确是前述“和平”。
- source_word: 第三人称单数命令式
  choice: 要……；要……
  rationale: 汉语没有对应的性别和第三人称命令式形态。省略主语的“要”字句既保留劝诫语气，也自然表达原文具有代表性的泛指单数，不误限定为男性。
theological_decisions:
- issue: 命令式中阳性单数的泛指作用
  choice: 正文采用省略主语的“要……”句式
  alternative: “他要……”或“人要……”
  rationale: 希腊语形式为第三人称阳性单数，但在引文中具有代表性、泛指作用。现代汉语省略主语可准确保留普遍劝诫，不把对象误解为仅限男性；脚注说明原文形式。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫体。“离开恶，行善”简洁有力；“寻求……追求”保留两个希腊动词的递进。正文省略泛指主语，符合现代标准汉语，也避免强加原文并未限定的男性对象。
