  text: ὅτι ὀφθαλμοὶ κυρίου ἐπὶ δικαίους καὶ ὦτα αὐτοῦ εἰς δέησιν αὐτῶν, πρόσωπον δὲ κυρίου ἐπὶ ποιοῦντας κακά.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/012.yaml
  text: For the eyes of the Lord are on the righteous[a], and his ears are open to their prayer[b], but the face of the Lord is against those who do evil.
translation:
  language: zh_hans
  text: 因为主的眼目眷顾义人；他的耳朵垂听他们的祈求；但主向作恶的人变脸。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 在上下文中引出前文劝勉所依据的理由；“因为”自然保留因果关系。
- source_word: ὀφθαλμοὶ κυρίου ἐπὶ δικαίους
  choice: 主的眼眷顾义人
  rationale: 保留“主的眼”这一拟人意象；ἐπί在此表达关注所向，“眷顾”自然传达带有恩惠的注视。
- source_word: ὦτα αὐτοῦ εἰς δέησιν αὐτῶν
  choice: 他的耳垂听他们的祈求
  rationale: 希腊文直译近于“他的耳向着他们的祈求”，句式有所省略；“垂听”补足专注聆听之意，同时保留耳的意象。δέησις在此译作“祈求”，兼顾祷告与恳求的含义。
- source_word: πρόσωπον δὲ κυρίου
  choice: 但主的脸
  rationale: 保留πρόσωπον“脸”的具体意象，并以“但”体现δέ在两句之间的转折对照。
- source_word: ἐπὶ ποιοῦντας κακά
  choice: 敌对作恶的人
  rationale: 在负面语境中，ἐπί所表达的朝向含有反对、敌视之意；“作恶的人”保留分词短语的动作性。
theological_decisions:
- issue: 对上帝眼、耳和脸的拟人表达
  choice: 直接保留“眼”“耳”“脸”的意象
  alternative: 释义为“主看顾……垂听……反对……”而省去身体意象
  rationale: 经文沿用诗篇的鲜明拟人意象，分别表达上帝的眷顾、垂听与敌对；保留这些意象可维持原文的文学和神学张力，而不将其粗略理解为上帝具有肉身。
- issue: 主的脸所表达的立场
  choice: 译为“主的脸敌对”
  alternative: 较形式化地译为“主的脸朝向”
  rationale: 上下句共用ἐπί，但语境形成鲜明对照；后句指向上帝对作恶者的反对。译出“敌对”使现代汉语读者准确理解该习语，同时保留“脸”的原有意象。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。句式保留诗歌式平行与转折；“眷顾”“垂听”较凝练，也适合经文语体。
