  text: ἐν ᾧ καὶ τοῖς ἐν φυλακῇ πνεύμασιν πορευθεὶς ἐκήρυξεν,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/019.yaml
  text: in which also he went and proclaimed to the spirits in prison[c][b][a],
translation:
  language: zh_hans
  text: 他也在这灵里[a]前去向那些在监牢里的灵[c]宣告[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在他里面”；也可译“借着这灵”。希腊文与上一句的关系可有不同理解。
    reason: alternative_reading
  - marker: b
    text: 或译“传讲”。这个动词指作出宣告，但本节没有说明所宣告的具体内容。
    reason: lexical_alternative
  - marker: c
    text: “在监牢里的灵”究竟是谁，历来有不同理解；可能指已死的人，也可能指堕落的天使性存在。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ
  choice: 在这灵里
  rationale: 介词短语与关系代词承接上一节的“灵”，保留“在……里”的基本表达，也不把它明确限定为方式、工具或对弥赛亚本人的指称。
- source_word: καὶ
  choice: 也
  rationale: 这里的 καί 表示在前述行动之外又有相关行动；“也”自然地体现其附加意味。
- source_word: τοῖς ... πνεύμασιν
  choice: 向……灵
  rationale: πνεύμασιν 最直接的对应是“灵”。不译为“灵魂”或“灵界存在”，以免预先判定这些灵的身份。
- source_word: ἐν φυλακῇ
  choice: 在监牢里
  rationale: φυλακή 可指受看守或囚禁之处；“在监牢里”保留具体意象，且符合现代汉语表达。
- source_word: πορευθεὶς
  choice: 去向
  rationale: 这个不定过去时分词含有前往的动作；与主要动词合译为“去向……宣告”，既自然，也不额外强化严格的时间先后。
- source_word: ἐκήρυξεν
  choice: 宣告
  rationale: κηρύσσω 指像传令者一样公开传达信息；“宣告”不自行断定信息是福音、审判还是得胜宣言。
theological_decisions:
- issue: ἐν ᾧ 的所指和语义关系
  choice: 正文译作“在这灵里”，承接上一节的“灵”，但不进一步解释其具体性质。
  alternative: 可理解为“在他里面”，更直接指弥赛亚；或理解为“借着这灵”，强调工具或方式。
  rationale: 希腊文的句法与神学解释存在争议。保留较贴近形式的表达，可避免把弥赛亚如何宣告的问题固定为某一种教义解释。
- issue: “在监牢里的灵”的身份
  choice: 正文只称其为“灵”，不说明其身份。
  alternative: 可解释为挪亚时代死去的人、堕落的天使性存在，或更广义的被拘禁之灵。
  rationale: 这处希腊文本身没有充分界定这些灵是谁；译文不应替读者裁定历史上存在分歧的问题。
- issue: ἐκήρυξεν 所指信息的性质
  choice: 译作“宣告”。
  alternative: 可译作“传讲”，并可能被理解为传福音、宣布审判或宣告得胜。
  rationale: 该动词说明公开传达，却没有在本节明确交代信息内容；“宣告”保留这种开放性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“在这灵里”有意保留原文与上一节之间的语法和神学张力；“监牢”保留 φυλακή 的具体意象；整句依照汉语语序处理分词结构。
