id: 1PE.3.21
reference: 1 Peter 3:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὃ ⸂καὶ ὑμᾶς ἀντίτυπον νῦν⸃ σῴζει βάπτισμα, οὐ σαρκὸς ἀπόθεσις ῥύπου ἀλλὰ συνειδήσεως ἀγαθῆς ἐπερώτημα εἰς θεόν, δι’ ἀναστάσεως Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/021.yaml
  text: Corresponding to that[a], baptism now also saves you—not the removal of dirt from the flesh, but an appeal to God for a good conscience—through the resurrection of Jesus the Messiah,
translation:
  language: zh_hans
  text: 与此相对应的洗礼，如今也拯救你们——这不是除去肉身的污垢，而是向上帝祈求良心无愧[a]——借着耶稣基督的复活。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“而是以无愧的良心向上帝作出承诺（或答复）。”希腊词ἐπερώτημα可指“呼求、请求”，也可指“承诺、答复”；“无愧的良心”与该词的具体关系也有歧义。
    reason: 保留ἐπερώτημα的另一重要词义，以及其与“无愧的良心”之属格结构的歧义，避免正文的“祈求”译法被误作唯一解释。
lexical_decisions:
- source_word: ἀντίτυπον
  choice: 与此相对应
  rationale: 承接上一节洪水中的水，并表达洗礼与那水之间的对应关系；避免采用普通读者难懂且可能带入后世术语含义的“对型”。
- source_word: σῴζει
  choice: 拯救
  rationale: 保留现在时直陈语气的直接陈述，不将其弱化为“象征得救”；后文由彼得自己的限定说明其含义。
- source_word: βάπτισμα
  choice: 洗礼
  rationale: 采用现代汉语中这一礼仪的标准名称；上下文随即说明它并非单纯清洗身体。
- source_word: σαρκὸς ἀπόθεσις ῥύπου
  choice: 除去肉身的污垢
  rationale: 忠实表达外在、身体层面的清洁，并保留“肉身”与良心之间的对照。
- source_word: συνειδήσεως ἀγαθῆς
  choice: 无愧的良心
  rationale: “无愧的良心”比直译“好的良心”更符合现代汉语，同时表达在上帝面前正直、清洁的良心；其与ἐπερώτημα的具体关系仍有歧义。
- source_word: ἐπερώτημα εἰς θεόν
  choice: 向上帝呼求
  rationale: “呼求”自然表达一个指向上帝的请求，也避免在正文中预设洗礼誓约神学；“承诺／答复”的可能含义列入脚注。
- source_word: δι’ ἀναστάσεως
  choice: 借着……的复活
  rationale: 表达διά加属格所表示的途径或媒介。
- source_word: Ἰησοῦ Χριστοῦ
  choice: 耶稣基督
  rationale: 这是现代中文对该称号组合的标准、庄重表达；“基督”本身保留“受膏者／弥赛亚”的称号背景。
theological_decisions:
- issue: 洗礼与拯救的关系
  choice: 直接保留“洗礼现在也拯救你们”，让经文本身随后的限定界定其含义。
  alternative: 将其释义为“洗礼象征你们已经得救”，或扩写成某一宗派的圣礼教义。
  rationale: 希腊文明确使用“拯救”，同时说明所指并非外在除垢，而与良心、上帝以及耶稣基督的复活相连。直译可保留经文的神学张力而不作宗派化裁定。
- issue: ἐπερώτημα的含义及συνειδήσεως ἀγαθῆς与它的关系
  choice: 正文译作“为求无愧的良心向上帝呼求”。
  alternative: “以无愧的良心向上帝呼求”或“向上帝作出无愧良心的承诺／答复”。
  rationale: “呼求”符合εἰς θεόν所表达的指向，也与该词“请求”的用法相合；属格可有不同理解，而“承诺／答复”亦有词义依据，因此用脚注保留另一主要读法。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“与此相对应”承接上一节的水；破折号保留原句的解释性插入结构。正文不弱化“洗礼……拯救”的直接说法，也不据此加入任何宗派性的圣礼解释。
