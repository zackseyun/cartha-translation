    reason: lexical_alternative
  revision_rationale: 以“却要”准确表达ἀλλά；重组末句，使“毁谤”的对象明确为“你们在弥赛亚里的美好品行”。将“敬畏”改为“畏惧”，避免在正文中限定φόβος的含义或对象；并以“美好的良心”对应原文与“美好品行”共享的ἀγαθός词汇。保留“在弥赛亚里”及其未展开的关系含义。
