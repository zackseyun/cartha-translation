id: 1PE.3.16
reference: 1 Peter 3:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ⸀ἀλλὰ μετὰ πραΰτητος καὶ φόβου, συνείδησιν ἔχοντες ἀγαθήν, ἵνα ἐν ᾧ ⸀καταλαλεῖσθε καταισχυνθῶσιν οἱ ἐπηρεάζοντες ὑμῶν τὴν ἀγαθὴν ἐν Χριστῷ ἀναστροφήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/016.yaml
  text: but with gentleness and fear[a], having a good conscience, so that in what you are slandered[c][b], those who revile your good conduct in Messiah may be put to shame.
translation:
  language: zh_hans
  text: 却要以温柔和畏惧[a]，存着美好的良心，好叫你们在受毁谤的事上[b]，那些毁谤你们在弥赛亚里的美好品行的人蒙羞。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “畏惧”也可译作“敬畏”或“尊重”；原文没有明说其对象。
    reason: lexical_alternative
  - marker: b
    text: 或译：“在你们被人说坏话的事上。”
    reason: lexical_alternative
lexical_decisions:
- source_word: πραΰτητος
  choice: 温柔
  rationale: 指谦和、不粗暴的态度；“温柔”是现代汉语中自然、清楚且符合劝勉语境的表达。
- source_word: φόβου
  choice: 敬畏
  rationale: φόβος可指惧怕、敬畏或尊重。此处未明说对象；“敬畏”保留庄重而有所畏惧的意味，又不擅自补出对象。脚注列出其他可能。
- source_word: συνείδησιν ἔχοντες ἀγαθήν
  choice: 持守无愧的良心
  rationale: 按汉语习惯表达持续保持良好良心的伴随状态；“无愧”突出良心不受谴责之意，但不把它扩展为无罪宣告。
- source_word: ἐν ᾧ
  choice: 在受毁谤的事上
  rationale: 原文关系短语指涉较为压缩；此译保留“在哪一件事或哪一方面”的开放性，并使汉语通顺。
- source_word: καταλαλεῖσθε
  choice: 受毁谤
  rationale: 该动词表示遭人敌意地说坏话；“毁谤”既体现言语攻击，也符合本句受动形式。
- source_word: καταισχυνθῶσιν
  choice: 反倒蒙羞
  rationale: 保留ἵνα所表达的目的或结果色彩及被动含义；“反倒”清楚呈现毁谤者最终蒙羞的反转。
- source_word: ἐπηρεάζοντες
  choice: 辱骂
  rationale: 该词可表示侮辱、恶待或凌辱；在本句与毁谤相连的语境中，“辱骂”自然地体现敌意攻击。
- source_word: ἀναστροφήν
  choice: 品行
  rationale: 指生活方式或行为表现；“品行”简洁、自然，并保留伦理重点。
- source_word: ἐν Χριστῷ
  choice: 在弥赛亚里
  rationale: Χριστός在此保有称号意义，因此译作“弥赛亚”；“在……里”保留保罗及新约常见的联合或所属关系表达，不进一步释义。
- source_word: ἀγαθὴν
  choice: 美好
  rationale: 修饰品行时，“美好”比重复使用“无愧”更自然，同时保留ἀγαθός的正面道德评价。
theological_decisions:
- issue: φόβου在“温柔和φόβος”中的含义及对象
  choice: 正文译作“敬畏”，不明说对象
  alternative: 惧怕；尊重；敬畏上帝
  rationale: 上下文没有明确指出敬畏或惧怕的对象。正文不补出“上帝”或“人”，以保存原文的解释空间；脚注提示词义范围。
- issue: Χριστῷ的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处Χριστός仍作为称号发挥作用，译作“弥赛亚”直接传达“受膏者”的称号背景；传统译名“基督”可作为读者熟悉的对应词，但不取代正文的称号译法。
- issue: “在弥赛亚里”与“美好品行”的关系
  choice: 保留“你们在弥赛亚里有美好品行”的结构
  alternative: 你们因属于弥赛亚而有的美好品行；你们作为基督徒的美好生活
  rationale: ἐν Χριστῷ可表达联合、所属或生活领域。直保留“在弥赛亚里”避免将其单一化为因果、身份标签或伦理来源。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“只要”承接上一节的转折语气；“持守无愧的良心”比生硬的“有美好的良心”更符合汉语表达。正文保留“在弥赛亚里”这一神学上含义丰富的短语，不以解释性意译取代。
