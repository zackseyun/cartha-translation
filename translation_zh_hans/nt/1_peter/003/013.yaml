  text: Καὶ τίς ὁ κακώσων ὑμᾶς ἐὰν τοῦ ἀγαθοῦ ⸀ζηλωταὶ γένησθε;
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/013.yaml
  text: And who will harm you if you become zealous for what is good?[a]
translation:
  language: zh_hans
  text: 你们若成为热心行善的人，谁会伤害你们呢？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “热心行善”或译“热心于美善的事”。
    reason: ζηλωτής可指热心追求、拥护某事的人；τοῦ ἀγαθοῦ可较直译为“美善的事”。
lexical_decisions:
- source_word: Καὶ
  choice: （承接上文，不另译）
  rationale: καί在此承接前文；现代汉语直接进入反问句更自然，句意和连贯性不受损。
- source_word: τίς ὁ κακώσων ὑμᾶς
  choice: 谁会伤害你们呢
  rationale: 带冠词的将来分词作名词性用法，构成反问。译为“谁会伤害你们呢”既保留将来指向和反问语气，也符合现代汉语表达。
- source_word: ἐὰν
  choice: 若
  rationale: 准确表达与虚拟式连用的条件关系；“若”简洁、庄重而不古奥。
- source_word: τοῦ ἀγαθοῦ
  choice: 行善
  rationale: 中性形容词名词化，指“善的事／美善之事”。结合ζηλωταί译作“热心行善”，在汉语中自然地表达以善为热切追求的对象。
- source_word: ζηλωταὶ
  choice: 热心……的人
  rationale: ζηλωτής是指热切追求或拥护某事的人；“热心……的人”保留其名词性和投入程度。
- source_word: γένησθε
  choice: 成为
  rationale: 保留γίνομαι的变化或进入某种状态之意，而不弱化为单纯的“是”。
theological_decisions:
- issue: 反问句是否构成信徒绝不会因行善受苦的绝对保证
  choice: 保留“谁会伤害你们呢？”这一概括性的反问与劝勉
  alternative: 明确译成“没有人能真正伤害你们”，使其成为绝对保证
  rationale: 紧接的上下文承认信徒仍可能因行义受苦，因此不在译文中补入“没有人”或“真正”等解释性限定，以保留经文本身的张力。
translation_notes:
  register: 采用现代、清楚而庄重的普通话。“热心行善的人”适合普通读者，并保留“成为”的动态意味；句末“呢”自然呈现希腊文反问语气。
