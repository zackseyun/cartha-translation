source:
  edition: SBLGNT
  text: ἀλλ’ εἰ καὶ πάσχοιτε διὰ δικαιοσύνην, μακάριοι. τὸν δὲ φόβον αὐτῶν μὴ φοβηθῆτε μηδὲ ταραχθῆτε,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/014.yaml
  text: But even if you should suffer for righteousness, you are blessed. And do not fear their fear, nor be troubled,
translation:
  language: zh_hans
  text: 但即使你们因义受苦，也是有福的。不要惧怕他们的惧怕[a]，也不要惊慌。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要怕他们”，或“不要怕他们所怕的”。原文“他们的惧怕”也呼应《以赛亚书》8:12的希腊文本，含义有意保留歧义。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλ’ εἰ καὶ πάσχοιτε
  choice: 但即使你们……受苦
  rationale: “但即使”表达让步条件，并承接上文的转折；汉语条件句本身足以传达πάσχοιτε所表示的可能性，无须添加生硬的情态词。
- source_word: διὰ δικαιοσύνην
  choice: 因义
  rationale: διά加宾格在此表示原因。“义”保留δικαιοσύνη的伦理和神学内涵，也比“因行善”更少解释性。
- source_word: μακάριοι
  choice: 也是有福的
  rationale: 补出判断结构，使现代汉语自然；“有福”保留圣经语境中的神圣认可，不简化为主观的“快乐”或世俗的“幸运”。
- source_word: τὸν ... φόβον αὐτῶν μὴ φοβηθῆτε
  choice: 不要惧怕他们的惧怕[a]
  rationale: 刻意保留φόβος与φοβέομαι的词根呼应，并尽量保存“他们的惧怕”既可指他们所引起的恐惧，也可指他们自己所怕之事的歧义及其对《以赛亚书》8:12希腊文本的呼应。
- source_word: μηδὲ ταραχθῆτε
  choice: 也不要惊慌
  rationale: “惊慌”自然表达ταράσσω在此所指的内心震动和不安；“也不要”准确连接第二个禁令。
theological_decisions:
- issue: δικαιοσύνη的译法
  choice: 义
  alternative: 正义；行得正
  rationale: 本节语境涉及因在神和人面前持守正直而受苦。“义”保留该词较宽广的伦理—神学范围；“正义”容易偏向社会或司法层面，“行得正”则把抽象名词解释为行为。
- issue: τὸν φόβον αὐτῶν的歧义
  choice: 他们的惧怕
  alternative: 对他们的惧怕；他们所惧怕的
  rationale: 属格αὐτῶν可作不同理解，且措辞明显呼应《以赛亚书》8:12。正文不替读者消除原文的张力，较自然的解释列于脚注。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。“他们的惧怕”在日常汉语中略显特别，但这是为保留原文的词语重复、经文呼应和真实歧义；脚注提供较自然的两种理解。
