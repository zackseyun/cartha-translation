  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: μὴ ἀποδιδόντες κακὸν ἀντὶ κακοῦ ἢ λοιδορίαν ἀντὶ λοιδορίας τοὐναντίον δὲ ⸀εὐλογοῦντες, ὅτι εἰς τοῦτο ἐκλήθητε ἵνα εὐλογίαν κληρονομήσητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/009.yaml
  text: not repaying evil for evil or insult for insult[a], but on the contrary blessing, because you were called to this[c][b], so that you might inherit a blessing.
translation:
  language: zh_hans
  text: 不要以恶报恶，也不要以辱骂还辱骂[a]；反而[b]要祝福，因为你们正是为此蒙召[c]，好使你们承受福分。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “辱骂”也可译作“毁谤”或“恶言攻击”；希腊词指侮辱、贬损人的言语。
    reason: lexical_alternative
  - marker: b
    text: “反而”表示强烈的转折，也可译作“恰恰相反”。
    reason: lexical_alternative
  - marker: c
    text: “为此”首先指前面所说的以祝福回应恶待，也可能概括不报复的整个生活方式。
    reason: cross_reference
lexical_decisions:
- source_word: ἀποδιδόντες
  choice: 报／还
  rationale: 该现在分词受 μή 支配，在劝勉语境中表达以相应行为回报；按汉语搭配分别译为“以恶报恶”和“以辱骂还辱骂”。
- source_word: κακὸν ἀντὶ κακοῦ
  choice: 以恶报恶
  rationale: 采用自然且庄重的汉语固定表达，保留 κακόν 的道德分量以及 ἀντί 所表达的报复性对应关系。
- source_word: λοιδορίαν ἀντὶ λοιδορίας
  choice: 以辱骂还辱骂
  rationale: λοιδορία 指侮辱、毁谤或恶言攻击；“辱骂”清楚体现言语上的恶意攻击，并保留原文平行结构。
- source_word: τοὐναντίον δὲ
  choice: 反而
  rationale: 这一强转折短语表示与报复截然相反的做法；“反而”在现代汉语中简洁自然，力度足够。
- source_word: εὐλογοῦντες
  choice: 要祝福
  rationale: 原文未明说宾语，译文也不补出“他们”，从而保留简洁和一定开放性；“祝福”兼可涵盖说祝福的话和求神赐福。
- source_word: ὅτι
  choice: 因为
  rationale: 明确呈现该连词为前述劝勉提供理由的因果作用。
- source_word: εἰς τοῦτο ἐκλήθητε
  choice: 你们正是为此蒙召
  rationale: “蒙召”自然表达神圣被动，“为此”保留 τοῦτο 的指向而不过度限定其范围；加入“正是”传达 εἰς τοῦτο 的聚焦意味。
- source_word: ἵνα
  choice: 好使
  rationale: 既可自然引出目的，也不排除预期结果，保留 ἵνα 在此处的目的性张力。
- source_word: εὐλογίαν
  choice: 福分
  rationale: 此处是信徒将要承受的 εὐλογία；“福分”比重复使用“祝福”更符合现代汉语，也自然指向所得之福，同时保留其来自神的含义。
- source_word: κληρονομήσητε
  choice: 承受
  rationale: “承受”是现代中文圣经语体中自然且庄重的继承用语，保留作为产业或继承所得之物的意涵，而不弱化为一般的“得到”。
theological_decisions:
- issue: εἰς τοῦτο ἐκλήθητε 中“为此”的所指
  choice: 正文保留“为此”，让它首先回指以祝福回应恶待的劝勉，同时不排除更广义的受苦与不报复生活。
  alternative: 明确译成“你们蒙召，就是要以祝福回应恶待”。
  rationale: 近距离语境支持其回指“反而要祝福”，但原文 τοῦτο 本身可概括前述整组劝勉；不在正文中展开说明，可避免消除真实的指代范围张力。
- issue: 祝福与承受福分之间的关系
  choice: 以“好使”保留神呼召之目的或预期结果，不把承受福分表述为靠行为赚取的机械报偿。
  alternative: 译成“这样你们就必得到福分”，将其处理为直接结果或条件报偿。
  rationale: ἵνα 加虚拟式表达目的或预期结果；原文没有详细说明人的回应与神所赐福分之间的系统神学关系，译文不应擅自补定。
translation_notes:
  register: 采用现代、庄重而易懂的劝勉语体。“以恶报恶”使用常见固定表达；第二分句用“以辱骂还辱骂”避免机械重复“报”并符合汉语搭配。正文保留原文简洁性和“为此”的指代弹性。所有脚注标记均已在正文出现。
