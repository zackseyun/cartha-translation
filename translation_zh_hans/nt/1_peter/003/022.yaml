  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὅς ἐστιν ἐν ⸀δεξιᾷ θεοῦ πορευθεὶς εἰς οὐρανὸν ὑποταγέντων αὐτῷ ἀγγέλων καὶ ἐξουσιῶν καὶ δυνάμεων.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/022.yaml
  text: who is at the right hand of God[a], having gone into heaven, with angels and authorities and powers subjected to him.
translation:
  language: zh_hans
  text: 他已经进入天上，现今在上帝的右边；众天使、权势和能力都已服在他之下。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅς
  choice: 他
  rationale: 关系代词回指上一节的耶稣基督。汉语若直译为“他是……”会显得生硬，因此以“他”自然承接上文，不另加解释性强调。
- source_word: ἐν δεξιᾷ θεοῦ
  choice: 在上帝的右边
  rationale: 保留圣经中表示尊荣与高举地位的空间—关系性表达，不将其释义化为“最高尊位”。
- source_word: πορευθεὶς εἰς οὐρανόν
  choice: 已经进入天上
  rationale: “已经”体现不定过去时分词所表达的先行动作；“进入”保留 εἰς 的方向性，同时以现代汉语自然表达升入天上的意思。
- source_word: ὑποταγέντων αὐτῷ
  choice: 都已服在他之下
  rationale: 保留被动、已经成就的从属关系；“服在……之下”比机械直译“被置于顺服”更符合现代汉语，也清楚表达 αὐτῷ 所指向的隶属对象。
- source_word: ἀγγέλων
  choice: 众天使
  rationale: 在与宇宙性权能并列的语境中指超自然的天使，而非人间使者；“众”自然体现复数。
- source_word: ἐξουσιῶν
  choice: 掌权者
  rationale: 既表达权柄，也保留此处可能指有位格之天上或宇宙性权势的含义，并与后面的 δυνάμεων 区分。
- source_word: δυνάμεων
  choice: 大能者
  rationale: 在此并列名单中译为具有大能的存在，既区别于“掌权者”，又不预先判定其善恶属性。
theological_decisions:
- issue: 基督在上帝右边的高举地位
  choice: 保留“在上帝的右边”这一圣经表达
  alternative: 在上帝身旁最高的尊位上
  rationale: 原文兼有空间关系和尊荣、高举的神学意涵；直接保留其表达可避免把丰富含义缩减为单一解释。
- issue: “天使、掌权者和大能者”的身份与道德属性
  choice: 译作广义的天上或宇宙性存在，不注明其为善、恶或善恶混合
  alternative: 专指圣天使；或专指敌对的邪灵权势
  rationale: 原文本身没有明确界定这些存在的道德属性，译文应保留这一开放性，同时清楚表达它们全都服在基督之下。
- issue: 分词结构所表达的时间关系
  choice: 用“已经……，现今……”呈现先进入天上、现处上帝右边的关系
  alternative: 完全按希腊语次序直译为“他在上帝的右边，进入了天上”
  rationale: 现代汉语调整语序可清楚传达 πορευθεὶς 相对于 ἐστιν 的先行动作，同时不改变事件关系。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。为顺应汉语叙事次序，将“进入天上”置于“在上帝的右边”之前；用分号分隔基督的高举与诸权能对他的从属。未添加脚注，因为“进入天上”已直接表达 εἰς οὐρανόν 的方向性，无需另列“到天上”这一近义译法。
