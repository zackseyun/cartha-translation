revisions:
- from: 他已经进入天上，现今在上帝的右边；众天使、掌权者和大能者都已服在他之下。
  to: 他已经进入天上，现今在上帝的右边；众天使、权势和能力都已服在他之下。
  rationale: 仅将“掌权者和大能者”修订为“权势和能力”，以避免不必要地把原文的宇宙性权能术语人格化，同时保留其身份和道德属性未明的开放性。其余译文忠实而自然： “已经”与“现今”恰当地呈现分词的先行关系和现时状态，“服在他之下”也清楚表达被动的归服关系。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T03:56:58Z'
review_pass:
  verdict: revise
  source_fidelity: 译文正确传达基督已进入天上、现处于上帝右边，以及天使、权柄和能力都归服于他。惟“掌权者”和“大能者”较易将原文的抽象/宇宙性权能名单具体化为人物；“权势”和“能力”更贴近并保留原文的开放性。
  naturalness: 语句庄重、现代且通顺。将先行的“进入天上”置前、再说“现今在上帝的右边”，符合汉语表达。
  terminology: “上帝”“天使”使用一致。“权势”和“能力”能更清楚地区分ἐξουσίαι与δυνάμεις，也避免“大能者”暗示独立的有位格存在；原文并未明确限定其本体类别。
  issues:
  - severity: medium
    issue: “掌权者和大能者”可能过度具体化原文的宇宙性权能。
    rationale: ἐξουσίαι与δυνάμεις在此类并列中可指权柄、权势或能力等宇宙性力量；虽不排除有位格的理解，但“掌权者”“大能者”将二者固定为人物，缩窄了原文保留的歧义。译作“权势和能力”较为中性、贴近词汇，并仍与“天使”区分。
  revised_text: 他已经进入天上，现今在上帝的右边；众天使、权势和能力都已服在他之下。
  revised_footnotes: []
  revision_rationale: 仅将“掌权者和大能者”修订为“权势和能力”，以避免不必要地把原文的宇宙性权能术语人格化，同时保留其身份和道德属性未明的开放性。其余译文忠实而自然： “已经”与“现今”恰当地呈现分词的先行关系和现时状态，“服在他之下”也清楚表达被动的归服关系。
