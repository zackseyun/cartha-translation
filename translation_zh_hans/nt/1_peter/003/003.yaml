  text: ὧν ἔστω οὐχ ὁ ἔξωθεν ἐμπλοκῆς τριχῶν καὶ περιθέσεως χρυσίων ἢ ἐνδύσεως ἱματίων κόσμος,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/003.yaml
  text: Do not let your adornment be the outward one—braiding of hair[a], wearing of gold jewelry, or putting on of clothing—
translation:
  language: zh_hans
  text: 你们的妆饰，不要在于外在的——编发、佩戴金饰或穿衣[a]——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们的妆饰，不可只是外在的：编发、佩戴金饰或穿衣。”彼得在下一节将外在装饰与内心隐藏的人相对照，重点在于内在品格的优先性，而非一概禁止梳妆或穿戴。
    reason: 说明原文否定句在上下文中可按比较、主次的意思理解；“只是”作为解释性补足置于脚注，不写入正文。
lexical_decisions:
- source_word: ὧν
  choice: 你们的
  rationale: 这是阴性复数属格关系代词，回指上一节所称的妻子；现代汉语用“你们的”自然表达其领属关系。
- source_word: ἔστω οὐχ
  choice: 不要是
  rationale: 保留 εἰμί 第三人称现在时命令语气及其否定力量，同时采用自然的现代汉语劝诫句式。
- source_word: ὁ ἔξωθεν ... κόσμος
  choice: 外在的……妆饰
  rationale: κόσμος 在此指装饰、妆饰，而非“世界”；ἔξωθεν 表明这种妆饰属于外在层面，并与下一节内在的人形成对照。
- source_word: ἐμπλοκῆς τριχῶν
  choice: 编头发
  rationale: 表达把头发编结起来这一装饰行为；比“编辫子”涵盖面更广，也保留原文动作名词的含义。
- source_word: περιθέσεως χρυσίων
  choice: 佩戴金饰
  rationale: περίθεσις 指戴上或围在身上，χρυσίων 指金制饰物；“佩戴金饰”在现代汉语中准确而自然。
- source_word: ἐνδύσεως ἱματίων
  choice: 穿着衣服
  rationale: 直陈穿上衣物这一行为，并与前两个外在装饰项目保持并列；不擅自加入原文没有明说的“华美”等限定。
theological_decisions:
- issue: 彼得是否绝对禁止编发、金饰和穿衣，还是将外在装饰置于内在品格之下
  choice: 正文保留原文否定命令的直接形式，并以脚注说明上下文所容许的比较性理解
  alternative: 在正文中译为“不要只在于外表”，直接明说并非绝对禁止
  rationale: 希腊文本本身没有表示“只、仅仅”的词，因此正文不静默补入；但下一节以“内心隐藏的人”形成对照，而且若把本节逐项视为绝对禁令，就连穿衣也会被禁止。脚注据此保留并说明真实的语义张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“妆饰”承接本段内外对照；破折号标出随后列举的具体外在装饰，并保留句子向下一节延续的结构。
