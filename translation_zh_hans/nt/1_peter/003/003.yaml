  naturalness: 建议将谓语改为‘不要在于外在的’，这是现代标准汉语中更自然的表达，也能使后面的列举顺畅地作为‘外在的’具体内容。‘编发’比‘编头发’更凝练、合乎本段庄重书面语体。
