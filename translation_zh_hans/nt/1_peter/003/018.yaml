  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὅτι καὶ Χριστὸς ἅπαξ περὶ ἁμαρτιῶν ⸀ἔπαθεν, δίκαιος ὑπὲρ ἀδίκων, ἵνα ⸀ὑμᾶς προσαγάγῃ τῷ θεῷ, θανατωθεὶς μὲν σαρκὶ ζῳοποιηθεὶς δὲ πνεύματι·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/018.yaml
  text: For Messiah also suffered once for sins[a], the righteous for the unrighteous, so that he might bring you to God[b], having been put to death in the flesh but made alive in the spirit.
translation:
  language: zh_hans
  text: 因为弥赛亚也曾一次为罪受苦[a]，就是义者为不义者受苦，为要领你们到上帝面前；他在肉身上被处死，却在灵里得以活过来[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“死了”，而不是“受苦”。
    reason: textual_variant
  - marker: b
    text: 或译：“他在肉身上被处死，却借着圣灵得以活过来。”希腊文既可指灵的领域或层面，也可指圣灵的作为或施行。
    reason: alternative_reading
lexical_decisions:
- source_word: Χριστὸς
  choice: 弥赛亚
  rationale: 保留该称号的受膏者含义，也符合项目对 Χριστός 的默认处理。
- source_word: ἅπαξ
  choice: 一次
  rationale: 直接表达该副词的意义，不额外加入“永远有效”等原文未明说的强调。
- source_word: περὶ ἁμαρτιῶν
  choice: 为罪
  rationale: 在救赎和献祭语境中，περί 加属格自然表示“为罪”。
- source_word: ἔπαθεν
  choice: 受苦
  rationale: 依照 SBLGNT 正文所采用的读法；异文“死了”列入脚注。
- source_word: δίκαιος ὑπὲρ ἀδίκων
  choice: 义的代替不义的
  rationale: 以简洁而自然的中文表达义者为不义者受苦的代表性、替代性关系，同时不扩展为完整的赎罪理论。
- source_word: προσαγάγῃ
  choice: 带到……面前
  rationale: 表达带人进入某位面前、使人得以亲近的含义。
- source_word: θανατωθεὶς
  choice: 被处死
  rationale: 保留不定过去时被动分词的被动意义，并以自然中文承接主句。
- source_word: σαρκὶ
  choice: 在肉身方面
  rationale: 与 πνεύματι 构成平行对照，指有形、必死生命的层面，而非“罪性”。
- source_word: ζῳοποιηθεὶς
  choice: 得以活过来
  rationale: 清楚表达被赋予生命、活过来的被动含义。
- source_word: πνεύματι
  choice: 在灵方面
  rationale: 正文按范围或层面理解，同时以脚注保留工具格读法“借着圣灵”。
theological_decisions:
- issue: 末句“肉身／灵”的对照
  choice: 译作“在肉身方面……在灵方面”，保留两个与格在形式上的平行，并按领域或层面表达。
  alternative: “在肉身中……借着圣灵”
  rationale: 希腊文十分凝练，πνεύματι 可指灵的领域或层面，也可指圣灵作为施行者；正文不应无提示地消除这一神学歧义。
- issue: “义的为不义的”的替代性
  choice: 译作“义的代替不义的”。
  alternative: “义的为了不义的”
  rationale: ὑπέρ 在此具有为他人利益而受苦的代表性或替代性意味；“代替”在中文中清楚传达这一对照，但不进一步规定某一种完整的赎罪模型。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“义的／不义的”保留原文鲜明的道德和代表性对照；“上帝”用于 θεός。
