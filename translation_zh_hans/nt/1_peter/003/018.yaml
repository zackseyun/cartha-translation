revisions:
- from: 因为弥赛亚也曾一次为罪受苦[a]，就是义的代替不义的，为要把你们带到上帝面前[b]。他在肉身方面被处死，却在灵方面得以活过来。
  to: 因为弥赛亚也曾一次为罪受苦[a]，就是义者为不义者受苦，为要领你们到上帝面前；他在肉身上被处死，却在灵里得以活过来[b]。
  rationale: 修订“义的代替不义的”为“义者为不义者受苦”，以消除中文语病，并避免将ὑπέρ的代表性／替代性关系限定为单一、较强的表述。调整末句和脚注措辞，使中文更自然；正文仍保留πνεύματι的歧义，脚注保留“借着圣灵”的另一可行读法。
