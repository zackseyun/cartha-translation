  text: ἀλλ’ ὁ κρυπτὸς τῆς καρδίας ἄνθρωπος ἐν τῷ ἀφθάρτῳ τοῦ ⸂πραέως καὶ ἡσυχίου⸃ πνεύματος, ὅ ἐστιν ἐνώπιον τοῦ θεοῦ πολυτελές.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/004.yaml
  text: but the hidden person of the heart[a], in the imperishable beauty of a gentle and quiet spirit[c][b], which is very precious before God.
translation:
  language: zh_hans
  text: 而要以内心隐藏的人[a]为妆饰，就是以温柔而安静[c]的心灵所具有的不朽之美[b]为妆饰；这在上帝面前极其宝贵。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“内心隐藏的人”。希腊语ἄνθρωπος可指“人”，这里所说的是内在的人，并非特指男性。
    reason: lexical_alternative
  - marker: b
    text: 直译“在温柔安静的心灵那不朽的里面”；原文没有“美”字，这里根据上一节与外在妆饰的对比补出。
    reason: lexical_alternative
  - marker: c
    text: “安静”指平和、安宁、不搅扰的性情，不一定指沉默不语。
    reason: lexical_alternative
lexical_decisions:
- source_word: κρυπτὸς τῆς καρδίας ἄνθρωπος
  choice: 内心隐藏的自我
  rationale: ἄνθρωπος在这里指人的内在自我，并非特指男性。“隐藏”直接对应κρυπτός，“内心……的自我”以自然现代汉语表达希腊语的属格结构。
- source_word: ἐν τῷ ἀφθάρτῳ
  choice: 在于……那不朽的美
  rationale: 原文以冠词加形容词构成省略表达，没有明说“美”。结合第3节外在妆饰的对比，正文补出“美”以使汉语通顺，同时用脚注保留原文的简约和歧义。
- source_word: πραέως
  choice: 温柔
  rationale: “温柔”自然表达πραΰς所指的柔和、不强暴的品格，又避免把它误解为软弱。
- source_word: ἡσυχίου
  choice: 安静
  rationale: “安静”直接对应ἡσύχιος；此处主要指平和、不搅扰的性情，不必然表示不说话，故加脚注说明。
- source_word: πνεύματος
  choice: 心灵
  rationale: “心灵”在此保留πνεῦμα的人格与内在生命用语，也比解释性的“性情”更贴近原文；语境表明这里并非指圣灵。
- source_word: ὅ ἐστιν ἐνώπιον τοῦ θεοῦ πολυτελές
  choice: 这在上帝面前极其宝贵
  rationale: “这”保留中性关系代词对前述整体特质的概括；“在上帝面前”表达神的评判，“极其宝贵”体现πολυτελές的高度价值。
theological_decisions:
- issue: 在针对女性的语境中如何表达ἄνθρωπος
  choice: 译作“自我”，指内在的人
  alternative: 译作“人”或“内心隐藏的人”
  rationale: 该词在此是泛指人的内在自我，并不强调男性身份；译作“自我”既避免误导，也保留其人论意义。
- issue: 是否为ἀφθάρτῳ补出省略的名词
  choice: 正文补出“美”，并以脚注说明原文没有该名词
  alternative: 直译为“那不朽的”或补作“不朽的品质”
  rationale: 第3—4节将外在妆饰与内在价值相对照，“美”是语境上自然的补足；脚注则防止把补词误认为希腊文本明说的内容。
- issue: 关系代词ὅ的所指
  choice: 用“这”概括温柔安静的心灵及其不朽之美
  alternative: 仅理解为“心灵”或仅理解为“不朽之美”
  rationale: 希腊语中ὅ为中性，可承接前面的中性表达；译作“这”保留其概括性，不把所指过度限定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“内心隐藏的自我”保留原文“隐藏”与内在人格的意象；“温柔安静的心灵”沿用清楚自然的品格用语。句式作为第3节对比结构的延续，以“而要在于”开头，避免擅自增添命令或主语。
