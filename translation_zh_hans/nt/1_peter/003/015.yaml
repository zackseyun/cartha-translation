  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: κύριον δὲ τὸν ⸀Χριστὸν ἁγιάσατε ἐν ταῖς καρδίαις ὑμῶν, ⸀ἕτοιμοι ἀεὶ πρὸς ἀπολογίαν παντὶ τῷ αἰτοῦντι ὑμᾶς λόγον περὶ τῆς ἐν ὑμῖν ἐλπίδος,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/015.yaml
  text: But regard Messiah the Lord as holy in your hearts[a], always ready for a defense to everyone who asks you for a reason concerning the hope that is in you[b],
translation:
  language: zh_hans
  text: 却要在你们心里尊弥赛亚为圣，以他为主；又要常常准备好，向每一个要求你们说明所怀盼望缘由的人作出答辩，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριον ... τὸν Χριστόν
  choice: 弥赛亚……为主
  rationale: Χριστός在这里是称号，译作“弥赛亚”；κύριος译作“主”。结合ἁγιάσατε理解为尊弥赛亚为圣，并承认他为主，也保留了对《以赛亚书》8:13的呼应。
- source_word: ἁγιάσατε
  choice: 尊……为圣
  rationale: 该动词本义为“使成圣、分别为圣、尊为圣”。此处以弥赛亚为宾语，并非人使他变得圣洁，而是人在心里承认并敬奉他为圣。
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: 在心里
  rationale: 自然保留καρδία所指人的内在思想、意志与敬奉中心；汉语可由上下文清楚看出是“你们心里”。
- source_word: ἕτοιμοι ἀεί
  choice: 随时准备
  rationale: 既表达ἕτοιμοι的“准备好”，也表达ἀεί的“总是、随时”。
- source_word: πρὸς ἀπολογίαν
  choice: 准备答辩
  rationale: ἀπολογία可指申辩、辩护或有理据的答复；“答辩”保留其辩护色彩，同时适合回应询问的语境。
- source_word: παντὶ τῷ αἰτοῦντι ὑμᾶς
  choice: 无论谁要求你们……
  rationale: 以自然汉语表达παντί的周遍、逐一意义，以及现在分词αἰτοῦντι所描述的询问或要求。
- source_word: λόγον
  choice: 说明……的缘由
  rationale: λόγος在此不是单指“话”，而是可交代的理由、说明或陈述；“说明……的缘由”兼顾通顺与语义。
- source_word: περὶ τῆς ἐν ὑμῖν ἐλπίδος
  choice: 所怀盼望
  rationale: “所怀”自然表达ἐν ὑμῖν所指内在持有的盼望，又不把它缩减为单纯情绪。
theological_decisions:
- issue: Χριστός的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处Χριστός与κύριος构成带有宣认意味的称号表达，称号功能明显；“弥赛亚”直接传达“受膏者”的称号性质。
- issue: 以弥赛亚为宾语的ἁγιάσατε
  choice: 尊弥赛亚为圣，以他为主
  alternative: 使主弥赛亚成圣；把弥赛亚分别为圣作主
  rationale: 选译保留“尊为圣”的命令，又避免让现代读者误以为信徒能使弥赛亚从不圣洁变为圣洁；“以他为主”明确表达κύριον的述语作用。
- issue: ἀπολογία的语域
  choice: 答辩
  alternative: 回答；辩护；申辩
  rationale: “答辩”既可表示针对质询作有理据的回答，也保留原词可能具有的辩护意味，不把经文限定为正式法庭场景。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“尊……为圣，以他为主”避免生硬直译，同时以脚注保留希腊语结构；后半句按自然汉语调整语序，但保留“每一个人”“缘由”“随时准备”和“答辩”等要素。末尾逗号依照所给经文片段，表明句意在下一节继续。
