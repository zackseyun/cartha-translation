  source_fidelity: 译文忠实呈现希腊文的比较结构（“正如”）、ὑπήκουσεν 的“听从”、撒拉称亚伯拉罕为 κύριος 的引语，以及读者成为撒拉“儿女”的比喻。以“若……就……”表达两个现在分词在本段劝勉语境中所具有的实际条件/表现性关系，是可接受且自然的处理。
