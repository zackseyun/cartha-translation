id: 1PE.3.6
reference: 1 Peter 3:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὡς Σάρρα ⸀ὑπήκουσεν τῷ Ἀβραάμ, κύριον αὐτὸν καλοῦσα· ἧς ἐγενήθητε τέκνα ἀγαθοποιοῦσαι καὶ μὴ φοβούμεναι μηδεμίαν πτόησιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/006.yaml
  text: just as Sarah obeyed Abraham[a], calling him lord. You have become her children if you do good and do not fear any intimidation.
translation:
  language: zh_hans
  text: 正如撒拉听从亚伯拉罕，称他为“主”。你们若行善，不怕任何威吓[a]，就成了她的儿女。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“任何恐怖”或“任何可怕的事”。
    reason: πτόησις既可指恐惧、惊恐，也可指引起恐惧的事物；正文“威吓”较贴合语境，脚注保留原词的其他可能范围。
lexical_decisions:
- source_word: ὡς
  choice: 正如
  rationale: 明确引出撒拉作为与上文相呼应的榜样，保留比较意味。
- source_word: ὑπήκουσεν
  choice: 听从
  rationale: 准确表达ὑπακούω的顺从、服从之意；现代汉语中“听从亚伯拉罕”自然，也不弱化原文。
- source_word: κύριον αὐτὸν καλοῦσα
  choice: 称他为“主”
  rationale: 保留κύριος作为尊称的基本意义，并以引号表明这是撒拉对亚伯拉罕的称呼，而非把它当作神的称号。
- source_word: ἧς ἐγενήθητε τέκνα
  choice: 就成了她的儿女
  rationale: “成了”体现γίνομαι所表示的进入某种身份；“儿女”保留τέκνα的亲属比喻，并适合现代汉语。
- source_word: ἀγαθοποιοῦσαι
  choice: 若行善
  rationale: 分词在本句劝勉语境中带有实际的条件意味；用“若”使其与主句的关系在汉语中清楚，同时不把条件解释得过度僵硬。
- source_word: μὴ φοβούμεναι μηδεμίαν πτόησιν
  choice: 不怕任何威吓
  rationale: πτόησις可指恐惧、惊吓或引起恐惧之事；“威吓”适合本段面对压力而仍行善的语境，同时以脚注保留其他可能译法。
theological_decisions:
- issue: 撒拉的听从对基督徒妻子的示范意义
  choice: 按原文直译为撒拉“听从”亚伯拉罕，不将本节扩展为完整的婚姻教义。
  alternative: 弱化为“顺应”或扩展为普遍、绝对的婚姻服从原则。
  rationale: ὑπήκουσεν本身有明确的听从、服从意义，不应因现代文化顾虑而淡化；但经文也没有在本句中界定这种听从的一切范围，因此译文不额外补充。
- issue: 两个分词与“成了她的儿女”的关系
  choice: 用“若……就……”表达其条件意味。
  alternative: 译为描述性的“你们行善、不惧怕……，已经成了她的儿女”。
  rationale: 原文分词既描写这些妇女的行为，也在劝勉语境中说明她们如何显明这种属灵亲属关系。“若……就……”是自然汉语，并保留经文的劝勉张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“听从”直接但不生硬；“称他为‘主’”保留古代尊称色彩；“儿女”维持原文的家庭比喻。脚注标记置于其实际所说明的“威吓”之后。
