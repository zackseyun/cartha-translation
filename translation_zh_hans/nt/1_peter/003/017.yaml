base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/017.yaml
  text: For it is better to suffer for doing good[a], if the will of God should so will it[b], than for doing evil.
translation:
  language: zh_hans
  text: 因为若上帝的旨意愿意如此[b]，行善时受苦[a]总比作恶时受苦好。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “行善时”也可译作“因行善”；同样，“作恶时”也可译作“因作恶”。原文的两个分词既可描述受苦时的情形，也可带有原因的含义。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近于“若上帝的旨意愿意如此”，以相关的名词和动词形成强调；译文保留这种重复性的表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: κρεῖττον
  choice: 总比……好
  rationale: 这是作表语的比较级，表达“更好”；用“总比……好”自然呈现两种受苦情形之间的比较。
- source_word: γὰρ
  choice: 因为
  rationale: 说明本节是对上文劝勉的理由或解释，并保留原文的逻辑连接。
- source_word: ἀγαθοποιοῦντας
  choice: 行善时
  rationale: 现在时主动分词描述受苦者行善的情形，同时不排除“因行善”的因果理解。
- source_word: εἰ θέλοι
  choice: 若是如此
  rationale: εἰ加愿望式表达带有可能性或不确定性的条件；“若”保留这一语气，“如此”承接受苦这件事。
- source_word: τὸ θέλημα τοῦ θεοῦ
  choice: 上帝的旨意
  rationale: 直接对应属格结构，语言庄重而自然。
- source_word: πάσχειν
  choice: 受苦
  rationale: 直接、自然地表达该不定式的含义。
- source_word: ἢ
  choice: 比
  rationale: 在“总比……好”结构中自然表达比较。
- source_word: κακοποιοῦντας
  choice: 作恶时
  rationale: 与“行善时”构成对称，保留现在时分词所描述的情形，也不排除因果理解。
theological_decisions:
- issue: 受苦与上帝旨意的关系
  choice: 译文说明行善者受苦可能处于上帝的旨意之中，但不界定上帝如何使其发生。
  alternative: 把本句明确解释为上帝决定每一次受苦，或仅仅被动容许受苦。
  rationale: εἰ θέλοι τὸ θέλημα τοῦ θεοῦ有条件地提及上帝的旨意，却没有解决“决定”与“容许”等更广泛的神学问题；译文保留这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“行善时……作恶时”保持平行，并借脚注保留分词可能具有的因果含义；“若是如此”自然呈现原文条件式语气，避免把受苦与上帝旨意之间的关系解释得过于确定。
