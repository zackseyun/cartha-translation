  text: when they observe your pure conduct in fear.
translation:
  language: zh_hans
  text: 当他们看到你们带着敬畏所表现的纯洁品行时。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐποπτεύσαντες
  choice: 亲眼看见了
  rationale: 该分词表示亲自观察、目睹；译作“亲眼看见”既保留直接观察的意味，也符合现代汉语。
- source_word: ἁγνὴν ἀναστροφὴν
  choice: 纯洁的品行
  rationale: ἁγνός 指纯洁、贞洁，ἀναστροφή 指生活表现或行为方式；“纯洁的品行”简洁并贴近本节语境。
- source_word: ἐν φόβῳ
  choice: 在敬畏中
  rationale: 按原文保留介词结构及 φόβος 的敬畏含义，不擅自明确敬畏的对象，也避免改成单纯的人际惧怕。
theological_decisions:
- issue: ἐν φόβῳ 所表达的敬畏及其对象
  choice: 在敬畏中
  alternative: 带着敬畏；敬畏地；带着对上帝的敬畏
  rationale: 原文没有明说敬畏的对象。“在敬畏中”保留其范围和神学张力，不把对象明确限定为丈夫或上帝。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“因为”承接3:1的目的/结果结构，使本节作为从句片段在中文中易于理解；若与上一节连续排版，可依上下文调整标点而不改变措辞。
