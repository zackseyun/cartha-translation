id: 1PE.3.5
reference: 1 Peter 3:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οὕτως γάρ ποτε καὶ αἱ ἅγιαι γυναῖκες αἱ ἐλπίζουσαι ⸀εἰς θεὸν ἐκόσμουν ἑαυτάς, ὑποτασσόμεναι τοῖς ἰδίοις ἀνδράσιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/005.yaml
  text: For in this way formerly also the holy women who hoped in God adorned themselves[a], submitting to their own husbands,
translation:
  language: zh_hans
  text: 因为从前那些把盼望寄托在神身上的圣洁妇女[a]，也这样装扮自己，顺服自己的丈夫。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“仰望神的圣洁妇女”。
    reason: “把盼望寄托在神身上”较充分地表达ἐλπίζουσαι εἰς θεόν以神为盼望对象的方向性；“仰望神”是较简洁而自然的替代译法。
lexical_decisions:
- source_word: οὕτως
  choice: 这样
  rationale: 回指上文所说的装饰方式；“这样”自然保留了指示作用。
- source_word: γάρ
  choice: 因为
  rationale: 引出支持前文劝勉的理由，在现代汉语中用“因为”衔接清楚。
- source_word: ποτε
  choice: 从前
  rationale: 指早先世代的妇女，符合本节以历史榜样说明劝勉的语境。
- source_word: αἱ ἅγιαι γυναῖκες
  choice: 那些……圣洁妇女
  rationale: 保留ἅγιαι的“圣洁”含义，并用“那些”自然体现希腊文冠词所指的特定群体。
- source_word: αἱ ἐλπίζουσαι εἰς θεὸν
  choice: 把盼望寄托在神身上的
  rationale: 以定语结构体现分词对这些妇女的持续性刻画；“把盼望寄托在……身上”自然表达以神为盼望对象。
- source_word: ἐκόσμουν ἑαυτάς
  choice: 装扮自己
  rationale: 保留κοσμέω与上下文“装饰”的词义联系；“装扮”比“使自己美丽”更贴近原词，也不预先限定外在或内在方式。
- source_word: ὑποτασσόμεναι
  choice: 顺服
  rationale: 以伴随方式说明她们如何装扮自己；汉语用连续谓语表达分词关系，比生硬的“使自己服从”更自然。
- source_word: τοῖς ἰδίοις ἀνδράσιν
  choice: 自己的丈夫
  rationale: 婚姻和家庭语境明确要求把ἀνήρ译为“丈夫”；保留ἰδίοις的“自己的”，限定于各自的婚姻关系。
theological_decisions:
- issue: 婚姻关系中顺服表述的范围
  choice: 顺服自己的丈夫
  alternative: 服在自己的丈夫之下
  rationale: 保留经文所述的婚姻关系和“自己的”这一范围限定，不把陈述扩大为所有妇女对所有男子的普遍从属，也不添加任何宗派性的角色理论。
- issue: “装扮自己”与“顺服”的句法关系
  choice: 以连续谓语表达伴随方式
  alternative: 借着顺服自己的丈夫来装扮自己
  rationale: 希腊文分词可表达伴随情形或方式；正文保留两者紧密相连，却不以“借着”把工具性解释定死，从而保留句法上的一定开放性。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“圣洁”保留经文的宗教语义，“装扮自己”与上下文的装饰主题相连；全句保持历史榜样式说明的语气。
