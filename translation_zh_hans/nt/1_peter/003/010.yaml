id: 1PE.3.10
reference: 1 Peter 3:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ γὰρ θέλων ζωὴν ἀγαπᾶν καὶ ἰδεῖν ἡμέρας ἀγαθὰς παυσάτω τὴν ⸀γλῶσσαν ἀπὸ κακοῦ καὶ ⸀χείλη τοῦ μὴ λαλῆσαι δόλον,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/010.yaml
  text: For the one who wants to love life and see good days must keep his tongue from evil and his lips from speaking deceit[a].
translation:
  language: zh_hans
  text: 因为凡愿意热爱生命、看见美好日子的人，就要使舌头不出恶言，使嘴唇不说诡诈的话[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“欺骗的话。”希腊语词可指欺骗、诡计或奸诈。
    reason: 词义备选：δόλος的语义范围包括欺骗、诡计和奸诈，“诡诈”并非唯一可行译法。
lexical_decisions:
- source_word: ὁ ... θέλων
  choice: 凡愿意……的人
  rationale: 冠词加现在分词在这里作名词用，泛指任何符合这一描述的人；中文用“凡……的人”自然表达其概括性，并保留单数代表性的意义，而不加入性别限定。
- source_word: γὰρ
  choice: 因为
  rationale: 本词引出对上文劝勉的解释和经文依据；“因为”能清楚呈现承接关系。
- source_word: ζωὴν ἀγαπᾶν
  choice: 热爱生命
  rationale: 贴近希腊语不定式表达，不添加原文没有的物主成分；“热爱生命”在现代汉语中自然且庄重。
- source_word: ἰδεῖν ἡμέρας ἀγαθὰς
  choice: 看见美好日子
  rationale: 保留ἰδεῖν“看见”的具体意象和诗歌色彩；“美好”比“富足”或“兴旺”范围更广，更符合ἀγαθάς。
- source_word: παυσάτω
  choice: 就要使……不……
  rationale: 该词是命令式，要求停止或制止某种行为；这一句式在中文中自然表达劝诫的命令语气，也适合后接舌头和嘴唇的并列意象。
- source_word: τὴν γλῶσσαν ἀπὸ κακοῦ
  choice: 使舌头不出恶言
  rationale: 原文直译为使舌头离开恶；按语境指言语上的恶。“不出恶言”既保留舌头的具体意象，也以自然中文明确表达其所指。
- source_word: χείλη
  choice: 嘴唇
  rationale: 保留原文复数的身体意象；现代汉语通常以集合意义使用“嘴唇”，无需另加物主代词。
- source_word: τοῦ μὴ λαλῆσαι δόλον
  choice: 使嘴唇不说诡诈的话
  rationale: 带μή的冠词不定式在制止类动词后表达防止或不让某事发生；“诡诈的话”清楚表达δόλος所含的欺骗和诡计意味。
theological_decisions:
- issue: 泛指主体及性别表达
  choice: 采用“凡……的人”，并省去“他的”等性别化物主代词
  alternative: 译作“那愿意……的人……他的舌头……他的嘴唇”
  rationale: 希腊语使用单数代表性表达，并非特指男性。汉语可借“凡……的人”以及不带物主词的身体部位自然保留泛指意义，也不改变原文的道德劝诫对象。
- issue: “美好日子”的含义
  choice: 保留较宽泛的“看见美好日子”
  alternative: 具体化为“过富足的日子”或“享受顺利的生活”
  rationale: ἀγαθός并不只指物质兴旺或环境顺利；保留宽泛表达可避免把应许收窄为特定的现世福乐。
translation_notes:
  register: 采用现代、庄重而易懂的普通话，保留诗篇引文中“舌头”“嘴唇”和“看见美好日子”的具体意象。以“凡……的人”表达泛指，不使用带性别的代词；两个“使……不……”形成整齐的平行结构。
