id: 1PE.2.10
reference: 1 Peter 2:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οἵ ποτε οὐ λαὸς νῦν δὲ λαὸς θεοῦ, οἱ οὐκ ἠλεημένοι νῦν δὲ ἐλεηθέντες.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/010.yaml
  text: you who once were not a people[a], but now are God's people; you who had not received mercy[b], but now have received mercy.
translation:
  language: zh_hans
  text: 你们从前不是一个子民[a]，现在却是上帝的子民；从前未蒙怜悯[b]，现在却蒙了怜悯。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 彼得呼应《何西阿书》1:9-10；2:23，把以色列复兴的语言用于说明读者如今在上帝子民中的身份。
    reason: cross_reference
  - marker: b
    text: 或译：“从前没有受到怜悯，现在却受到了怜悯。”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵ
  choice: 你们
  rationale: 关系代词承接上一节所称的读者；汉语以“你们”直接延续称呼，比生硬译作“那些……的人”更自然。
- source_word: ποτε
  choice: 从前
  rationale: 与νῦν“现在”形成明确的时间和身份对照，符合现代汉语表达。
- source_word: λαὸς
  choice: 一个子民／上帝的子民
  rationale: λαός在这里具有群体及圣约背景。“一个子民”保留首句未明确说“上帝的”这一特点；λαὸς θεοῦ则译为“上帝的子民”。
- source_word: θεοῦ
  choice: 上帝的
  rationale: 将属格自然译作所属关系，准确表达λαὸς θεοῦ。
- source_word: οὐκ ἠλεημένοι
  choice: 未蒙怜悯
  rationale: 被动分词表明他们从前不是怜悯的承受者；“蒙怜悯”简洁、庄重，并保留被动受惠的含义。
- source_word: ἐλεηθέντες
  choice: 蒙了怜悯
  rationale: 被动分词与前句构成反转；“蒙了怜悯”既指向施怜悯者的行动，也表达如今由此形成的处境。
- source_word: δὲ
  choice: 却
  rationale: 两次δέ均表示鲜明转折；汉语用“却”自然突出从前与现在的逆转。
- source_word: νῦν
  choice: 现在
  rationale: 直接标示读者目前的身份和处境，与“从前”对举。
theological_decisions:
- issue: 何西阿书典故与圣约群体身份
  choice: 保留“不是一个子民”与“是上帝的子民”之间措辞上的不对称
  alternative: 两处都明确译作“不是上帝的子民／是上帝的子民”
  rationale: 希腊文前半仅说οὐ λαός，并未出现θεοῦ；后半才说λαὸς θεοῦ。这样翻译既保留何西阿书回响及群体身份的逆转，也不把经文限定为某种更狭窄的族群或宗派解释。
- issue: 怜悯表述中的主动者
  choice: 采用“蒙怜悯”的被动表达，不在正文补出“上帝”
  alternative: 译作“上帝从前没有怜悯你们，现在却怜悯了你们”
  rationale: 神学语境自然指向上帝，但原文采用被动形式。保留被动可避免把隐含的主动者显明化超过原文，同时仍清楚表达恩惠来自他者。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“子民”保留λαός在圣约语境中的群体意味；平行结构“从前……现在却……”再现原文两重对照。所有脚注标记均已置于正文相应位置。
