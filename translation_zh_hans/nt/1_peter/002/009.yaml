id: 1PE.2.9
reference: 1 Peter 2:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ὑμεῖς δὲ γένος ἐκλεκτόν, βασίλειον ἱεράτευμα, ἔθνος ἅγιον, λαὸς εἰς περιποίησιν, ὅπως τὰς ἀρετὰς ἐξαγγείλητε τοῦ ἐκ σκότους ὑμᾶς καλέσαντος εἰς τὸ θαυμαστὸν αὐτοῦ φῶς·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/009.yaml
  text: But you are a chosen people[a], a royal priesthood, a holy nation, a people for his own possession[b], so that you may proclaim the excellencies of the one who called you out of darkness into his marvelous light.
translation:
  language: zh_hans
  text: 但你们是蒙拣选的族类[a]，是君尊的祭司，是圣洁的国民，是归上帝所有的子民，为要宣扬那召你们出黑暗、进入他奇妙光明者的美善[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “族类”也可译作“民族”或“种族”。这里指蒙拣选的群体身份，不必限定为现代意义上的族裔类别。
    reason: lexical_alternative
  - marker: b
    text: “美善”也可译作“卓越”“美德”“可称颂之处”或“大能作为”。希腊词可指那位呼召者可称颂的卓越品质，也可在本语境中包括其彰显出来的作为。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς δὲ
  choice: 但你们
  rationale: δὲ承接上文形成对比，显出的代词Ὑμεῖς又带强调；“但你们”自然保留两者。
- source_word: γένος ἐκλεκτόν
  choice: 蒙拣选的族类
  rationale: γένος可指血统、族类或群体；“族类”保留集体身份和旧约盟约语言，又不把它限定为现代种族概念。
- source_word: βασίλειον ἱεράτευμα
  choice: 君尊的祭司群体
  rationale: βασίλειον可表达王者或王室的尊荣，ἱεράτευμα指祭司构成的群体；此译同时保留其王权色彩和群体性祭司身份。
- source_word: ἔθνος ἅγιον
  choice: 圣洁的国度
  rationale: 直译盟约称谓，保留ἅγιον分别为圣的含义。
- source_word: λαὸς εἰς περιποίησιν
  choice: 归上帝所有的子民
  rationale: περιποίησις在此表达被取得、专属所有；根据上下文补明所有者是上帝，使现代汉语清楚自然。
- source_word: ὅπως
  choice: 为要
  rationale: 明确保留目的关系。
- source_word: τὰς ἀρετὰς
  choice: 卓越作为
  rationale: ἀρετή可指卓越、可称颂的品质，也可在此涵盖上帝彰显出来的大能作为；主文以“卓越作为”兼顾品格与行动的语境，但以脚注保留其他可能。
- source_word: ἐξαγγείλητε
  choice: 宣扬
  rationale: 表达公开传告、广为宣布的力度。
- source_word: τοῦ ... καλέσαντος
  choice: 那位……者
  rationale: 保留希腊文以分词行动指称上帝的结构，不在主句中额外重复“上帝”。
- source_word: ἐκ σκότους ... εἰς τὸ θαυμαστὸν αὐτοῦ φῶς
  choice: 出黑暗、进入他奇妙之光
  rationale: 保留从一个领域出来并进入另一个领域的方向性，以及黑暗与光的鲜明隐喻。
theological_decisions:
- issue: 源自以色列盟约称号的群体身份语言
  choice: 直接保留“蒙拣选的族类”“君尊的祭司群体”“圣洁的国度”等集体称号。
  alternative: 将这些称号抽象化或弱化为一般性比喻。
  rationale: 本节有意把旧约盟约身份语言用于彼得的受众；译文应保留这种互文张力，而不进一步加入关于教会与以色列关系的体系性结论。
- issue: λαὸς εἰς περιποίησιν中未明说的所有者
  choice: 译为“归上帝所有的子民”。
  alternative: 译为较含混的“作为产业的子民”或“为得着的子民”。
  rationale: 上下文所指的所有者显然是上帝；汉语补明所指可避免关系不清，同时不增加文本之外的教义判断。
- issue: ἀρετάς所涵盖的是上帝的属性还是作为
  choice: 主文采用“卓越作为”，脚注注明也可理解为“美德”或“可称颂之处”。
  alternative: 只译为“美德”“美善”或“奇妙作为”。
  rationale: 该词本身具有语义宽度，语境可涵盖上帝可称颂的属性及其彰显；不应把这一张力完全消除。
translation_notes:
  register: 采用现代、庄重而可诵读的普通话。“祭司群体”准确表达ἱεράτευμα的集体意义，避免让读者误解为单数身份；“君尊”保留传统圣经语体但仍为现代读者熟悉。“上帝”仅在所有关系需要补明之处出现。所有脚注标记均已置于主文。
