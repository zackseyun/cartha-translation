  text: πάντας τιμήσατε, τὴν ἀδελφότητα ⸀ἀγαπᾶτε, τὸν θεὸν φοβεῖσθε, τὸν βασιλέα τιμᾶτε.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/017.yaml
  text: Honor everyone[a], love the brotherhood, fear God[b], honor the king.
translation:
  language: zh_hans
  text: 要尊重所有人，爱众弟兄姊妹[a]，敬畏上帝，尊重君王[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “众弟兄姊妹”指同为信徒的人所组成的群体。
    reason: lexical_alternative
  - marker: b
    text: 或译“皇帝”。希腊文直译为“君王”，但在彼得所处的罗马背景下，很可能指皇帝。
    reason: alternative_reading
lexical_decisions:
- source_word: πάντας
  choice: 所有人
  rationale: 该词在此作名词性用法，涵盖所有人；“所有人”简洁自然，也保留其普遍范围。
- source_word: τιμήσατε / τιμᾶτε
  choice: 尊重
  rationale: 两处均译作“尊重”，保留原文首尾重复同一动词的结构。此词比一般礼貌更有分量，又不与只归于上帝的“敬畏”混同。
- source_word: τὴν ἀδελφότητα
  choice: 众弟兄姊妹
  rationale: 该词指由同信者构成的群体。现代汉语用“众弟兄姊妹”自然表达信徒之间的家人关系，同时包含群体中的男女。
- source_word: ἀγαπᾶτε
  choice: 爱
  rationale: 直接保留ἀγαπάω的基本含义。现在时命令可能带有持续之意，但简洁的汉语命令句通常无需另加“不断”。
- source_word: τὸν θεὸν
  choice: 上帝
  rationale: 直接对应θεός；采用现代汉语中庄重且通行的称呼。
- source_word: φοβεῖσθε
  choice: 敬畏
  rationale: “敬畏”既保留φοβέομαι所含的畏惧分量，也符合此处人对上帝应有态度的语境，不把它弱化为一般的“尊敬”。
- source_word: τὸν βασιλέα
  choice: 君王
  rationale: βασιλεύς的直接含义是王；“君王”在现代中文中庄重、清楚，并保留原文措辞。彼得所处的罗马背景下，该称谓很可能具体指皇帝，另以脚注说明。
theological_decisions:
- issue: 对上帝与对世俗统治者所用态度的区别
  choice: 上帝要“敬畏”，君王要“尊重”
  alternative: 将二者分别译为“尊崇”和“尊敬”
  rationale: 原文特意使用不同动词，区分对上帝与对君王的责任。“敬畏”保留对上帝更强、更独特的回应，而君王与所有人同样受到“尊重”；这样既呈现层次，也不引申出经文未明说的政治神学。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。四个并列命令均以动词直接领起，保留原文紧凑有力的节奏；首尾统一译作“尊重”，凸显原文的词语呼应。“众弟兄姊妹”兼顾群体含义与现代读者的自然理解。
