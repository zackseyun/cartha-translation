  to: 你们要像初生的婴孩一样，切慕那纯净的、合乎理性的奶[a]，好让你们借着它成长，以至得救。
  rationale: 修订使正文更直接对应 λογικόν 的词义而不排除其“属灵／灵性”解释，并以脚注保存语义张力。将末句改为目的—结果关系更清楚的“以至得救”，既反映 εἰς σωτηρίαν 的趋向，也避免“进入救恩”可能带来的过度具体化。
