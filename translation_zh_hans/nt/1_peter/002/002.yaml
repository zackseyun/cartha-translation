  naturalness: 原文整体庄重通顺。“纯净的、合乎理性的奶”因保留了原文刻意而不寻常的修饰，在现代汉语中略显陌生；但作为明确的比喻表达仍可理解，且脚注可帮助读者。将目的结果译为“好让你们借着它成长，以至得救”比“成长，进入救恩”更自然。
  terminology: “切慕”“纯净”“救恩”均恰当。“婴孩”可保留。“合乎理性的”较“属灵”更直接反映 λογικόν，同时脚注应说明“属灵／灵性的”这一语境化译法亦有相当根据，避免把争议词义定论化。
