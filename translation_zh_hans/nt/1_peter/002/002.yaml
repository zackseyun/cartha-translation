id: 1PE.2.2
reference: 1 Peter 2:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὡς ἀρτιγέννητα βρέφη τὸ λογικὸν ἄδολον γάλα ἐπιποθήσατε, ἵνα ἐν αὐτῷ αὐξηθῆτε ⸂εἰς σωτηρίαν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/002.yaml
  text: Like newborn infants[a], long for the pure, rational milk, so that by it you may grow into salvation,
translation:
  language: zh_hans
  text: 你们要像初生的婴孩一样，切慕那纯净的、合乎理性的奶[a]，好让你们借着它成长，以至得救。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “合乎理性的奶”也可译作“属灵的奶”或“灵性的奶”。希腊语形容词可指与理性、言语或内在生命有关的事物；此处的“奶”是比喻，并非指字面的奶。
    reason: 保留λογικός的词义范围及其在此比喻中的解释空间。
lexical_decisions:
- source_word: ὡς ἀρτιγέννητα βρέφη
  choice: 像初生的婴孩一样
  rationale: ὡς引出比喻；ἀρτιγέννητα强调刚刚出生，βρέφη指婴孩。此译自然保留新生婴孩的形象。
- source_word: τὸ λογικὸν
  choice: 属灵
  rationale: λογικός可指与理性、内在生命相关的事物；在“奶”的比喻中，“属灵”能让现代普通读者明白这里不是字面的奶，同时以脚注保留“合乎理性的”等较贴近字面的可能译法。
- source_word: ἄδολον
  choice: 纯净
  rationale: 该词表示没有掺杂、纯正，也含不带欺诈的意味；“纯净”与奶的意象搭配自然。
- source_word: γάλα
  choice: 奶
  rationale: 保留经文中喂养和成长的核心比喻。
- source_word: ἐπιποθήσατε
  choice: 切慕
  rationale: 该命令表达强烈、迫切的渴望；“切慕”庄重而清楚。
- source_word: ἵνα ἐν αὐτῷ αὐξηθῆτε
  choice: 好使你们借着它成长
  rationale: ἵνα表达目的；ἐν αὐτῷ在此可表达凭借或途径，并回指“奶”。“得以成长”也可体现被动形式，但“成长”在现代汉语中更流畅。
- source_word: εἰς σωτηρίαν
  choice: 进入救恩
  rationale: εἰς带有朝向目标或结果的方向性；“进入救恩”保留这种动态意味，不将其改写为某一特定的救恩论公式。
theological_decisions:
- issue: 比喻中λογικός的含义
  choice: 正文译作“属灵”
  alternative: “合乎理性的”或“理性的”
  rationale: 这里的奶显然用作喂养内在生命的比喻。“属灵”在汉语中最能传达非字面、内在滋养的意思；但原词本身与理性或合理性有关，因此脚注保留这一真实的词义张力。
- issue: εἰς σωτηρίαν的方向性
  choice: 译作“进入救恩”
  alternative: “以致得救”或“在救恩中成长”
  rationale: 原文表达朝向救恩的成长，却没有在此详细界定救恩的现在与将来层面。正文保留其方向性，避免把经文限定为某一宗派性的成圣或确据解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“切慕”保留命令的强烈语气；“属灵之奶”略带经文体色彩，但比“理性的奶”更自然清楚。脚注标记紧随其所解释的短语。
