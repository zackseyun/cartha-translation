  text: τοῦτο γὰρ χάρις εἰ διὰ συνείδησιν θεοῦ ὑποφέρει τις λύπας πάσχων ἀδίκως·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/019.yaml
  text: 'For this is grace: if someone endures sorrows while suffering unjustly because of consciousness of God[a][b][c].'
translation:
  language: zh_hans
  text: 因为人若出于对神的顾念[a]，在遭受不公正的苦待时忍受痛苦，这就是恩惠[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因着意识到神”、“本着对神的良知”。
    reason: lexical_alternative
  - marker: b
    text: “恩惠”在这里也可理解为可称许或蒙悦纳的事。
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: 恩惠
  rationale: 此处作评价性的表语，可指蒙悦纳、值得称许之事；译作“恩惠”保留其与新约中“恩典／恩惠”词义的联系，又不直接补入原文未明说的“在神面前”。
- source_word: διὰ συνείδησιν θεοῦ
  choice: 因意识到神
  rationale: συνείδησις既可涉及“良知”，也可指有意识的认知；属格θεοῦ可理解为认知所指向的对象。“意识到神”保留这种紧凑表达及其歧义，同时清楚表明忍受的动因。
- source_word: ὑποφέρει
  choice: 忍受
  rationale: 表达在艰难处境下承受并坚持，现代汉语自然简洁。
- source_word: λύπας
  choice: 痛苦
  rationale: 涵盖忧伤、苦楚和困扰，不局限于身体疼痛。
- source_word: πάσχων ἀδίκως
  choice: 在遭受不公正的苦待时
  rationale: 保留分词所表达的伴随处境，并把ἀδίκως的不公正性质明确归于所受的苦待。
- source_word: τις
  choice: 人若
  rationale: 以泛指单数表达任何人，不额外引入性别。
- source_word: τοῦτο γὰρ
  choice: 因为……这就是
  rationale: “因为”承接上文的解释关系，“这”回指随后整个条件情形，符合希腊语的篇章功能。
theological_decisions:
- issue: χάρις在本节中的含义
  choice: 译作“恩惠”
  alternative: 可译“可称许的事”或“蒙悦纳的事”
  rationale: 保留χάρις的神学词汇关联及评价意味，不把“在神面前”等上下文推论直接写入正文。
- issue: συνείδησις θεοῦ的理解
  choice: 译作“意识到神”
  alternative: 可理解为“顾念神”或“本着对神的良知”
  rationale: 正文保留“意识／认知”与“良知”之间的张力，不将短语窄化为单一的道德良知解释；脚注列出自然且可能的其他译法。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。将原因短语置于“忍受”之前，避免误解为“因为意识到神而遭受不公正苦待”；不用教派性术语，并以脚注保留关键语义张力。
