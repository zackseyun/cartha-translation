id: 1PE.2.8
reference: 1 Peter 2:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ λίθος προσκόμματος καὶ πέτρα σκανδάλου· οἳ προσκόπτουσιν τῷ λόγῳ ἀπειθοῦντες· εἰς ὃ καὶ ἐτέθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/008.yaml
  text: and, “a stone of stumbling and a rock of offense.” They stumble because they disobey the word, and to this they were also appointed.
translation:
  language: zh_hans
  text: '又说：

    “他是使人绊倒的石头，

    使人跌倒的磐石。”

    他们因不顺从这道而绊倒；他们也被定为如此。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λίθος προσκόμματος
  choice: 使人绊倒的石头
  rationale: 保留希腊文“石头”与“绊倒”的意象，并以自然汉语表达其致人绊倒的作用。
- source_word: πέτρα σκανδάλου
  choice: 使人跌倒的磐石
  rationale: 用“磐石”对应 πέτρα，并用“跌倒”传达 σκανδάλου 在此处的陷跌、冒犯意象，同时与前句形成平行。
- source_word: τῷ λόγῳ
  choice: 这道
  rationale: λόγος 在上下文中指所传的福音信息；“道”是简洁、庄重且保留一定语义宽度的译法。
- source_word: ἀπειθοῦντες
  choice: 不顺从
  rationale: 该词兼有不信与不服从的意味；“不顺从”较直接保留其抗拒信息的行为色彩。
- source_word: εἰς ὃ καὶ ἐτέθησαν
  choice: 他们也被定为如此
  rationale: 保留被动语态及“被安排/指定”的含义，同时让“如此”承接前述绊倒这一结果，不额外指明施事者。
theological_decisions:
- issue: εἰς ὃ 所指及预定含义
  choice: 他们也被定为如此
  alternative: 他们也被定为不顺从这道
  rationale: 关系代词可能指向前述绊倒的结果，也可能被理解为更广泛地指前述不顺从与绊倒。译文用“如此”保留指代范围的张力，避免断言他们被指定去不信。
- issue: 绊倒与不顺从的逻辑关系
  choice: 他们因不顺从这道而绊倒
  alternative: 他们绊倒，是由于不信这道
  rationale: 分词 ἀπειθοῦντες 可表达伴随情形或原因；这里按自然语义译为原因，但以“不顺从”保留信与服从相联的张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。引文按诗行排列，以呈现两组平行意象；正文不添加原文没有明确说明的施事者或教义解释。
