  rationale: 修订以“归向”直接对应归回至某对象的结构，删去中文中重复的“来到……那里”。将ἐπίσκοπος正文译为“监督者”，以保留其词汇核心，同时在脚注提供“看顾者”“守护者”及传统译法。“被带回”改为“被转回”，避免添加原文未指定的带领动作。脚注b置于句末，是因其说明整个“归向了”的动词形式；其余锚点紧随所释词语。
