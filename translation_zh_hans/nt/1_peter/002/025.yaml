  text: ἦτε γὰρ ὡς πρόβατα ⸀πλανώμενοι, ἀλλὰ ἐπεστράφητε νῦν ἐπὶ τὸν ποιμένα καὶ ἐπίσκοπον τῶν ψυχῶν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/025.yaml
  text: For you were like sheep going astray[c][b][a], but now you have returned to the Shepherd and Overseer of your souls.
translation:
  language: zh_hans
  text: 因为你们从前好像走迷了路的羊[a]，如今却归向了你们灵魂的牧人和监督者[c]。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“迷失”或“漂流”；也可理解为“被引入歧途”。
    reason: lexical_alternative
  - marker: b
    text: 或译“转回”；希腊文形式也可能带有被动意味：“被转回”。
    reason: alternative_reading
  - marker: c
    text: 或译“看顾者”或“守护者”；传统上也译作“主教”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦτε γὰρ
  choice: 因为你们从前
  rationale: γάρ承接上文，说明前述事实的缘由，译为“因为”；ἦτε为未完成过去时，描述他们先前持续的状态，以“从前”自然表达。
- source_word: ὡς πρόβατα
  choice: 好像……的羊
  rationale: ὡς表示比拟；πρόβατα是复数。汉语“羊”本身不标复数，结合“你们”即可清楚表达群体含义。
- source_word: πλανώμενοι
  choice: 迷失
  rationale: πλανάω在此可指走迷、漂流，也可带有被引入歧途的被动意味。“迷失”符合羊的牧养意象，并保留未明确说明行为主体的含混性。
- source_word: ἀλλὰ ἐπεστράφητε νῦν
  choice: 如今却已经归回
  rationale: ἀλλά构成鲜明转折；νῦν译为“如今”。ἐπεστράφητε虽在形式上为不定过去时被动语态，也常有不及物或中动态意味；“已经归回”表达转变已发生且关乎现状，同时不把神的行动或人的回应单方面说死。
- source_word: ἐπὶ τὸν ποιμένα
  choice: 来到……牧人……那里
  rationale: ἐπί加宾格在此表示归向的对象；“来到……那里”是自然汉语。ποιμήν直译为“牧人”，保留经文的牧羊意象。
- source_word: καὶ ἐπίσκοπον
  choice: 和看顾者
  rationale: ἐπίσκοπος指察看、照料并守护的人。“看顾者”能表达其在本节中的功能，又避免将后世特定教会职衔直接带入基督论称谓。
- source_word: τῶν ψυχῶν ὑμῶν
  choice: 你们灵魂的
  rationale: ψυχή可指灵魂、生命或整个人；这里译作“灵魂”，保留其传统而直接的词义及属灵牧养语境，但不排除对整个人的关怀。
theological_decisions:
- issue: 将ποιμήν和ἐπίσκοπος作为指向基督的称谓
  choice: 牧人和看顾者
  alternative: 牧者和监督者；牧人和守护者；牧人和主教
  rationale: 两个名词共同指向基督。“牧人”保留羊群意象，“看顾者”传达察看、照料和守护之意，同时避免“主教”所带有的后世教制含义，也比单纯的“守护者”更贴近词源功能。
- issue: ἐπεστράφητε的语态含义
  choice: 已经归回
  alternative: 已经转回；已经被带回
  rationale: 该形式可被理解为被动，也可按常见的中动或不及物用法理解。“归回”在现代汉语中自然，并保留神的行动与人的回应之间未被原文完全展开的张力；脚注说明可能的被动意味。
- issue: ψυχή的指涉范围
  choice: 灵魂
  alternative: 生命；你们自己
  rationale: “灵魂”保留原词在此属灵照管语境中的传统表达，但不把ψυχή限定为与身体完全分割的部分；其更广的“生命、整个人”含义由脚注提示。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“迷失的羊—牧人”保持完整意象；以“看顾者”表达ἐπίσκοπος在此对基督的功能性称谓，避免宗派化职衔。句中把脚注分别置于其所解释的词语之后。
