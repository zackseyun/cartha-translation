  text: ὑμῖν οὖν ἡ τιμὴ τοῖς πιστεύουσιν· ⸀ἀπιστοῦσιν δὲ ⸀λίθος ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/007.yaml
  text: Therefore[a], for you who believe is the honor, but for those who do not believe[c][b], “The stone that the builders rejected—this one has become the head of the corner.”
translation:
  language: zh_hans
  text: '所以，尊荣归于你们这些相信的人[a]；但对那些不信的人[b]：


    “匠人所弃的石头，

    已经成了房角之首[c]。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“对你们这些相信的人，这石头是宝贵的。”
    reason: alternative_reading
  - marker: b
    text: 或译：“那些不顺从的人”；这个动词可含有拒绝相信、因而不顺从的意思。
    reason: lexical_alternative
  - marker: c
    text: 传统译作“房角石”或“首要的房角石”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τιμή
  choice: 尊荣
  rationale: 此词可指尊荣、价值或珍贵。这里的“尊荣归于你们”既保留希腊文的简洁表达，也与不信者所拒绝的石头形成对照；“珍贵”这一可能含义留在脚注中。
- source_word: τοῖς πιστεύουσιν
  choice: 你们这些相信的人
  rationale: 与前面的ὑμῖν相连，既保留对读者的直接称呼，也表达分词“相信的人”的含义。
- source_word: ἀπιστοῦσιν
  choice: 那些不信的人
  rationale: 在此与“相信的人”直接对举，译作“不信”最清楚；此词也可能带有拒绝相信而不顺从的意味，故在脚注说明。
- source_word: λίθος
  choice: 石头
  rationale: 符合建筑比喻，也是此处诗篇引文的自然对应词。
- source_word: ἀπεδοκίμασαν
  choice: 所弃
  rationale: 原词指经过考察后拒绝；在熟悉的引文句式中，“所弃”简洁、庄重，也准确表达拒绝不用之意。
- source_word: οἰκοδομοῦντες
  choice: 匠人
  rationale: 该名词化分词指从事建造的人；“匠人”在中文建筑意象中自然凝练。
- source_word: κεφαλὴν γωνίας
  choice: 房角之首
  rationale: 尽量透明地保留原文“角的头”这一建筑隐喻，避免在正文中将其限定为某一种具体石材位置；传统译法在脚注列出。
theological_decisions:
- issue: ἡ τιμή与信徒及作为石头的基督之间的关系
  choice: 正文译为“尊荣归于你们这些相信的人”，理解为尊荣属于信的人。
  alternative: “这珍贵是给你们这些相信之人的”，即那石头对信徒而言是珍贵的。
  rationale: ὑμῖν οὖν ἡ τιμή最自然地表达“这尊荣归于你们”，也与上文不至蒙羞的主题相合；但由于前文称石头为宝贵，另一理解确有可能，故用脚注保留。
- issue: κεφαλὴ γωνίας的建筑及基督论意象
  choice: 正文采用较透明的“房角之首”。
  alternative: “房角石”或“首要的房角石”。
  rationale: 原文直译为“角的头”，具体建筑所指存在解释空间。正文保留其隐喻张力，脚注提供读者熟悉的传统理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。正文保留引文的诗行形式，并用“房角之首”呈现原文较为开放的建筑隐喻；脚注交代更通行的译法和词义上的真实歧义。
