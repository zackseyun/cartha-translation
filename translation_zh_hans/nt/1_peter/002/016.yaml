  text: ὡς ἐλεύθεροι, καὶ μὴ ὡς ἐπικάλυμμα ἔχοντες τῆς κακίας τὴν ἐλευθερίαν, ἀλλ’ ὡς ⸂θεοῦ δοῦλοι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/016.yaml
  text: as free people[a], and not using freedom as a cover for evil, but as slaves of God.
translation:
  language: zh_hans
  text: 你们既是自由的人，就不可把自由当作遮掩恶事的幌子，倒要作上帝的奴仆[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “奴仆”也可译作“仆人”。这里采用“奴仆”，以保留它与“自由的人”之间更强烈的对比。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλεύθεροι
  choice: 自由的人
  rationale: 保留社会身份和修辞层面的“自由”含义；“人”自然涵盖全体受众，不把希腊语阳性复数机械地限于男性。
- source_word: ἐπικάλυμμα
  choice: 遮掩
  rationale: 该词本指遮盖物；结合ἔχοντες构成的表达，译为“用自由遮掩”既保留遮盖恶事的意象，也符合现代汉语习惯。
- source_word: ἔχοντες ... τὴν ἐλευθερίαν
  choice: 用自由
  rationale: 原文直译近于“把自由当作遮盖物持有”，这里以“用”表达其工具性，避免生硬。
- source_word: κακίας
  choice: 恶事
  rationale: κακία在此泛指道德上的恶，而非仅指恶意；“恶事”在汉语中清楚指向应受谴责的行为。
- source_word: θεοῦ δοῦλοι
  choice: 上帝的奴仆
  rationale: δοῦλοι强调隶属和受主人支配；“奴仆”比单纯“仆人”更能保留与“自由的人”之间的强烈张力，同时在现代中文圣经语体中较自然。
theological_decisions:
- issue: 如何表达基督徒既自由又完全属于上帝的身份张力
  choice: 上帝的奴仆
  alternative: 上帝的仆人
  rationale: 原文有意并置ἐλεύθεροι与δοῦλοι。正文采用“奴仆”以保留这种悖论式张力，不将完全隶属于上帝的含义弱化为一般服务关系；脚注列出较温和且词义上可能的译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“像……却不可……而要像……”对应原文三个ὡς结构及其转折关系；句末脚注紧随相关词语。
