  text: ⸀Ὑποτάγητε πάσῃ ἀνθρωπίνῃ κτίσει διὰ τὸν κύριον· εἴτε βασιλεῖ ὡς ὑπερέχοντι,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/013.yaml
  text: Submit yourselves to every human institution for the Lord’s sake[a], whether to a king as one in authority[b],
translation:
  language: zh_hans
  text: 你们要为主的缘故，顺服一切人间制度[a]，无论是居于上位的君王[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“人类的创造（物）”；传统上也译作“人的一切制度”。这里随后提到君王和治理者，表明这个短语是指人类社会中的民事制度或权柄。
    reason: lexical_alternative
  - marker: b
    text: 或译：“身居最高位的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑποτάγητε
  choice: 你们要……顺服
  rationale: 这是带命令语气的不定过去时被动形式，在这里具有反身或中间语态的作用。“你们要顺服”自然地表达主动接受秩序安排的劝勉，又不额外加入原文没有的对象或限制。
- source_word: πάσῃ
  choice: 每一种
  rationale: 与单数与格 κτίσει 连用，具有逐一涵盖的分配意义；“每一种”比笼统的“一切”更清楚地保留这一点。
- source_word: ἀνθρωπίνῃ
  choice: 人间
  rationale: 表示属于人类社会层面的性质。“人间”简洁自然，并避免把它过度限定为某个具体的人所创立。
- source_word: κτίσει
  choice: 制度
  rationale: 该词通常可指“创造”或“受造之物”，但下文以君王和治理者为例，表明这里所谈的是人类社会中的治理建制。“制度”传达语境中的功能，同时以脚注保留其罕见的字面可能性。
- source_word: διὰ τὸν κύριον
  choice: 为主的缘故
  rationale: διά 加宾格在此表达原因或动机；这一译法保留信徒顺服的行动以“主”为根据和动机的含义。
- source_word: κύριον
  choice: 主
  rationale: 原文只使用称号“主”，没有在本句明说是耶稣还是上帝，因此译文不作超出原文的限定。
- source_word: εἴτε
  choice: 无论是
  rationale: 引出“无论是……还是……”结构的第一项，后一项延续到下一节。
- source_word: βασιλεῖ
  choice: 君王
  rationale: βασιλεύς 的基本意义是“王、君王”。罗马时代的语境容许理解为皇帝，但原词范围更广，故正文不收窄为“皇帝”。
- source_word: ὡς ὑπερέχοντι
  choice: 居于上位的
  rationale: ὑπερέχω 在此表示地位或权柄高于其他人。“居于上位”保留相对的等级意义，避免“至高”可能带来的绝对化理解。
theological_decisions:
- issue: κτίσει 所指的民事权柄性质
  choice: 译为“人间制度”
  alternative: 人的创造物；人所制定的一切条例；每一个人
  rationale: 紧接着列出的君王和治理者表明，本句讨论的是人类社会中的民事建制或权柄，而不是要求信徒顺服每一个个体。“人间制度”也没有额外断言其最终合法性仅来自人或直接来自上帝；本句所明说的信仰根据是“为主的缘故”。
- issue: κύριον 的所指
  choice: 仅译为“主”
  alternative: 主耶稣；上帝
  rationale: 希腊文没有进一步明说所指。保留“主”既符合彼得前书的基督徒认信语境，也保存本句自身的指称开放性。
- issue: 君王“居于上位”的权柄范围
  choice: 采用相对性的“居于上位”
  alternative: 至高无上；最高统治者
  rationale: ὑπερέχων 表明较高的地位或权柄，但本句并不宣称君王拥有绝对或神圣意义上的至高权柄，因此避免使用容易绝对化的措辞。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“每一种人间制度”兼顾 πάσῃ 的分配意义和 κτίσις 在本语境中的制度性含义；句末保留逗号，以反映“无论是……还是……”结构将在下一节继续。
