id: 1PE.2.20
reference: 1 Peter 2:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ποῖον γὰρ κλέος εἰ ἁμαρτάνοντες καὶ κολαφιζόμενοι ὑπομενεῖτε; ἀλλ’ εἰ ἀγαθοποιοῦντες καὶ πάσχοντες ὑπομενεῖτε, τοῦτο χάρις παρὰ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/020.yaml
  text: For what credit is it if[a], when you are sinning and being beaten, you endure? But if, when you are doing good and suffering, you endure, this is grace before God.
translation:
  language: zh_hans
  text: 你们若犯罪而挨打，却能忍耐，有什么可称赞的呢？但若行善而受苦，却能忍耐，这在上帝面前是恩典[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这是蒙上帝喜悦的”，或“这是上帝所称许的”。
    reason: χάρις παρὰ θεῷ 在这里既可保留为“在上帝面前是恩典”，也可按语境理解为蒙上帝悦纳或称许。
lexical_decisions:
- source_word: κλέος
  choice: 值得称赞
  rationale: 这里指因某种表现而获得的称许或赞誉；“值得称赞”符合反问语气，也比“荣耀”或“名声”更贴合伦理语境。
- source_word: ἁμαρτάνοντες
  choice: 犯罪
  rationale: 保留该词明确的罪恶和道德含义，不弱化为一般性的“做错事”。
- source_word: κολαφιζόμενοι
  choice: 挨打
  rationale: 该词指遭拳打或殴打；“挨打”在现代汉语中自然、明确地表达身体虐待。
- source_word: ὑπομενεῖτε
  choice: 仍能忍耐
  rationale: 表达在苦难之下坚持承受；两处采用同一译法，以保留原文的重复和对比。“仍”自然呈现逆境中的持续忍耐。
- source_word: ἀγαθοποιοῦντες
  choice: 行善
  rationale: 简洁表达正当地行事或做有益之事，也符合现代基督教汉语的庄重语体。
- source_word: πάσχοντες
  choice: 受苦
  rationale: 保留原词较宽泛的受苦含义，不擅自限定为某一种虐待。
- source_word: χάρις
  choice: 恩典
  rationale: 保留 χάρις 的核心词汇和神学张力；上下文中也可能指蒙悦纳或获得称许，因此以脚注说明。
- source_word: παρὰ θεῷ
  choice: 在上帝面前
  rationale: 表达在上帝的临在、判断或看法中，既贴近 παρά 加与格的关系含义，也避免把“与上帝同在”误作空间陈述。
theological_decisions:
- issue: 末句 χάρις 的含义
  choice: 正文译作“这在上帝面前是恩典”
  alternative: “这是蒙上帝喜悦的”或“这是上帝所称许的”
  rationale: χάρις 在此语境中可指恩典、悦纳或称许。正文保留“恩典”的词汇和神学回响，脚注则说明语境上自然成立的其他理解，不将其强行限定为某一教义解释。
- issue: 行善、受苦与忍耐之间的关系
  choice: 按原文并列结构译作“行善受苦时仍能忍耐”
  alternative: “因行善而受苦，仍能忍耐”
  rationale: 上下文支持无辜受苦的理解，但本节分词本身主要并列描述行善与受苦；正文不额外明确加入因果关系，以保存原文的表达空间。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“挨打”具体自然，“行善”“受苦”“忍耐”保持经文语体而不显陈旧。两组条件句采用平行结构，以呈现原文鲜明的伦理对比。
