id: 1PE.2.18
reference: 1 Peter 2:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Οἱ οἰκέται ὑποτασσόμενοι ἐν παντὶ φόβῳ τοῖς δεσπόταις, οὐ μόνον τοῖς ἀγαθοῖς καὶ ἐπιεικέσιν ἀλλὰ καὶ τοῖς σκολιοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/018.yaml
  text: Household servants, submitting yourselves to your masters with all respect, not only to the good and gentle but also to the crooked.
translation:
  language: zh_hans
  text: 家仆[a]，要满怀敬畏[b]，顺服你们的主人；不但要顺服良善温和的，也要顺服乖僻的[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“家奴”“家中的奴仆”。希腊语οἰκέται特指一个家庭中的仆役或受奴役者。
    reason: lexical_alternative
  - marker: b
    text: 直译“在一切惧怕中”。这里可表达敬畏、恭敬，也保留惧怕的意味；原文没有明说这种敬畏的对象。
    reason: lexical_ambiguity
  - marker: c
    text: 或译“苛刻的”“不公的”。希腊语原意为“弯曲的、扭曲的”，在这里形容人的品性。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκέται
  choice: 家仆
  rationale: 该词特指家中的仆役或奴仆。“家仆”保留家庭场景，脚注则说明其可能包含受奴役的身份，避免淡化原有社会关系。
- source_word: ὑποτασσόμενοι
  choice: 要……顺服
  rationale: 该分词在上下文中承担劝勉、命令的功能；译为“要顺服”符合现代汉语表达，也准确传达其劝诫语气。
- source_word: ἐν παντὶ φόβῳ
  choice: 满怀敬畏
  rationale: φόβος可指惧怕、敬畏或尊重。“敬畏”保留原词的力度与一定歧义，不把它直接缩减为一般礼貌；脚注说明可理解为恭敬或惧怕。
- source_word: δεσπόταις
  choice: 主人
  rationale: 该词指对家仆或奴仆拥有权柄的人；“主人”最自然地表达当时的家庭权力关系。
- source_word: ἀγαθοῖς
  choice: 良善
  rationale: 直接保留其道德评价，并与后面的“温和”形成自然搭配。
- source_word: ἐπιεικέσιν
  choice: 温和
  rationale: 该词含温厚、宽容、通情达理之意；“温和”简洁地表达其与人为善的一面。
- source_word: σκολιοῖς
  choice: 乖僻
  rationale: 原词本义为弯曲、扭曲，用于人时可指乖僻、不公或苛刻。“乖僻”保留其比喻性和较宽语义，脚注补充其他可能理解。
theological_decisions:
- issue: 如何表达οἰκέται所指的家庭身份而不淡化或夸大其受奴役处境
  choice: 正文译作“家仆”，并以脚注注明也可译作“家奴”或“家中的奴仆”
  alternative: 直接译作“家奴”
  rationale: 该词具体指家庭内部的从属人员，在当时往往具有奴仆身份。“家仆”保持简洁和家庭范围，脚注明确其可能涉及奴役制度，避免把古代关系误解为现代雇佣。
- issue: φόβος所指是对主人的惧怕或尊敬，还是更广义的敬畏
  choice: 译作“满怀敬畏”，并在脚注保留“惧怕、恭敬”的语义范围
  alternative: 译作“十分尊敬”或“十分惧怕”
  rationale: 原文没有明确限定这种φόβος只是礼貌尊重，也未明说其对象；“敬畏”保留语义力度及上下文可能存在的指向，不替文本消除张力。
- issue: 这项顺服劝勉是否意味着认可主人的乖僻或不义
  choice: 仅准确翻译顺服的劝勉及主人品性的对比，不增加认可不义的表述
  alternative: 把顺服解释为赞同或无条件认可主人的行为
  rationale: 本节要求在不同品性的主人之下顺服，却没有说乖僻或不义本身是善的；译文应保留这项伦理张力，而不额外作教义化解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“家仆”“主人”清楚呈现家庭权力关系；“满怀敬畏”保留原文φόβος的力度与歧义；“乖僻”略带文学色彩，但能较好承载“弯曲、扭曲”的比喻，并由脚注解释。所有脚注标记均置于正文对应词语之后。
