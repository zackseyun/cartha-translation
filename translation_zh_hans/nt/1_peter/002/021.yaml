id: 1PE.2.21
reference: 1 Peter 2:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἰς τοῦτο γὰρ ἐκλήθητε, ὅτι καὶ Χριστὸς ἔπαθεν ὑπὲρ ⸀ὑμῶν, ὑμῖν ὑπολιμπάνων ὑπογραμμὸν ἵνα ἐπακολουθήσητε τοῖς ἴχνεσιν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/021.yaml
  text: For you were called to this[a], because Messiah also suffered for you, leaving you an example so that you might follow in his steps.
translation:
  language: zh_hans
  text: '你们蒙召正是为此，因为弥赛亚也为你们受了苦，给你们留下榜样[a]，使你们跟随他的脚踪。


    [a] “榜样”原文可指摆在初学者面前供其临摹的字帖或范本。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “榜样”原文可指摆在初学者面前供其临摹的字帖或范本。
    reason: 说明ὑπογραμμός所含的具体教学比喻及可译作“范本”的词义。
lexical_decisions:
- source_word: εἰς τοῦτο
  choice: 正是为此
  rationale: 承接上文关于忍受不公正苦难的教导，同时保留εἰς所含的指向和目的意味。
- source_word: ἐκλήθητε
  choice: 你们蒙召
  rationale: 保留神学语境中的被动含义，不进一步限定呼召的教义类别。
- source_word: ὅτι
  choice: 因为
  rationale: 清楚表达后半句对蒙召所作的原因或根据说明。
- source_word: Χριστὸς
  choice: 弥赛亚
  rationale: 在此作为称号理解，译出“受膏者”的身份意义，而不把它仅当作名字。
- source_word: ἔπαθεν
  choice: 受了苦
  rationale: 忠实保留不及物的概括表达，不擅自添加受死等本节未明说的内容。
- source_word: ὑπὲρ ὑμῶν
  choice: 为你们
  rationale: 既表达为读者利益和缘故受苦，也保留可能的代表性或代替性余韵，不缩窄为某一种解释。
- source_word: ὑμῖν ὑπολιμπάνων
  choice: 给你们留下
  rationale: 将ὑμῖν作为间接宾语自然译出，并保留留下某物供人效法的意思。
- source_word: ὑπογραμμὸν
  choice: 榜样
  rationale: 正文采用现代汉语中清楚自然的对应词；原词所带供学习者临摹的具体教学意象在脚注中说明。
- source_word: ἵνα
  choice: 使
  rationale: 简洁表达目的关系。
- source_word: ἐπακολουθήσητε
  choice: 跟随
  rationale: 与目的从句搭配自然，并保留沿着既定道路效法的含义。
- source_word: τοῖς ἴχνεσιν αὐτοῦ
  choice: 他的脚踪
  rationale: 保留脚印和行路的比喻，也符合庄重而易懂的中文表达。
theological_decisions:
- issue: ὑπὲρ ὑμῶν所表达的弥赛亚受苦与信徒之间的关系
  choice: 译作“为你们”，保留受益、代表及潜在代替含义的宽度
  alternative: 译作“代替你们”或“为了你们的缘故”
  rationale: 本节明确说弥赛亚为读者受苦，并在语境中强调其榜样作用；“为你们”不排除代赎意蕴，也不把本句强行限定为更具体的赎罪公式。
- issue: 本节中弥赛亚受苦的榜样性与救赎性张力
  choice: 同时保留“为你们受苦”和“留下榜样”
  alternative: 将受苦仅解释为道德榜样，或在正文中扩写为明确的代替受罚
  rationale: 原文把为信徒受苦和供信徒跟随并列呈现，译文不消解二者之间的神学张力。
translation_notes:
  register: 采用现代、庄重且易懂的普通话书面语。“蒙召”“弥赛亚”“脚踪”保留经文的神学和比喻色彩；句法适度调整为自然汉语，同时保持原文因果与目的结构。
