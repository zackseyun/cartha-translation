  text: (ὅτι οὕτως ἐστὶν τὸ θέλημα τοῦ θεοῦ, ἀγαθοποιοῦντας φιμοῦν τὴν τῶν ἀφρόνων ἀνθρώπων ἀγνωσίαν)·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/015.yaml
  text: 'For this is the will of God: that by doing good you should silence the ignorance of foolish people[a].'
translation:
  language: zh_hans
  text: 因为上帝的旨意正是要你们借着行善，使那些愚昧之人的无知无话可说[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使……无话可说”直译可作“给……套上笼嘴”。原文动词本指给牲畜套上笼嘴；这里比喻使愚昧之人的无知及其所发出的言论止息。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 承接上文，为此前关于顺服与行善的劝勉说明理由；译作“因为”自然体现因果关系。
- source_word: οὕτως
  choice: 正是这样
  rationale: 指向这里所说明的行事方式；“正是这样”既保留指示意味，又符合现代汉语表达。
- source_word: τὸ θέλημα τοῦ θεοῦ
  choice: 上帝的旨意
  rationale: “旨意”是现代中文圣经语体中清楚而庄重的对应，涵盖上帝所意欲、所定意的事。
- source_word: ἀγαθοποιοῦντας
  choice: 借着行善
  rationale: 该现在分词在句中主要表达手段，即借行善达到后述效果。
- source_word: φιμοῦν
  choice: 堵住……之口
  rationale: φιμόω本义为“给……套上笼嘴”，此处比喻使敌对言论无法继续；“堵住……之口”保留形象，同时在中文中自然可懂。
- source_word: ἀγνωσίαν
  choice: 无知
  rationale: 直接表达缺乏认识；语境中这种无知带有可责的愚昧性质。
- source_word: ἀφρόνων ἀνθρώπων
  choice: 那些愚昧人
  rationale: ἄφρων意为愚昧、无见识；ἄνθρωποι泛指人，并不限定男性，因此不译作“男人”。
theological_decisions:
- issue: ἀνθρώπων的性别范围
  choice: 人
  alternative: 男人
  rationale: 这里泛指敌对者，希腊文的语法形式并不表明对象仅限男性；“人”准确保留其普遍范围。
- issue: 上帝旨意与行善、止息毁谤之间的句法关系
  choice: 用冒号引出旨意的具体内容，并以“要”表达不定式在语境中的规范性
  alternative: 译作“因为你们借着行善堵住……，这就是上帝的旨意”
  rationale: 原文先断言“上帝的旨意正是这样”，随后以分词和不定式说明其内容；本译法保留这种展开方式，不把它改写为已经实现的事实。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“借着行善”清楚表达手段；“堵住……之口”保留原文生动隐喻，并由脚注说明其字面意义。
