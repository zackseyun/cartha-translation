    rationale: φιμοῦν直接支配ἀγνωσίαν；虽然该动词暗喻封住口，原文并未说“无知之口”。中文应在保留隐喻效果的同时，清楚表明被止息的是愚昧之人的无知（即由此而出的无知言论/主张）。
  - severity: low
    issue: “上帝的旨意正是这样：你们要……”的句式略显翻译腔。
    rationale: 将旨意的内容表述为“上帝的旨意正是要你们……”更自然，并不改变原文的劝勉性语境或不定式所表达的目的。
