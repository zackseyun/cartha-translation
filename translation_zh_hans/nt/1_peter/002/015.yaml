revisions:
- from: 因为上帝的旨意正是这样：你们要借着行善，堵住那些愚昧人的无知之口[a]。
  to: 因为上帝的旨意正是要你们借着行善，使那些愚昧之人的无知无话可说[a]。
  rationale: 修订以“使……无话可说”对应φιμοῦν ἀγνωσίαν，避免“无知之口”的不自然搭配，并保留原文将“无知”拟人化、使之止息的隐喻。调整首句语序，使中文更自然，同时完整保留因果关系、上帝旨意、行善作为手段，以及愚昧之人的无知这一对象。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T03:56:51Z'
review_pass:
  verdict: revise
  source_fidelity: 原文以ὅτι说明前文的理由；“因为”恰当。ἀγαθοποιοῦντας表达藉行善的手段，φιμοῦν的对象是“无知”（ἀγνωσίαν），并以“给牲畜套上笼嘴”的动词隐喻使其止息。草稿将该隐喻具体化为“无知之口”，在中文中不够通顺，也略混淆了原文所说的“无知”与人的“口”。
  naturalness: “上帝的旨意正是这样：你们要……”略显生硬；改为“上帝的旨意正是要你们……”更符合现代标准汉语，也自然地表达原文的内容性结构。“使……的无知无话可说”保留原文以“无知”为被止息对象的修辞，同时使中文可理解。
  terminology: “上帝”“旨意”“行善”“愚昧之人”均合乎庄重、现代的经文语体。保留“无知”与“愚昧”的两个不同原文概念，未将ἀνθρώπων误限为男性。
  issues:
