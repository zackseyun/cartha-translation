  text: ὃς ἁμαρτίαν οὐκ ἐποίησεν οὐδὲ εὑρέθη δόλος ἐν τῷ στόματι αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/022.yaml
  text: who committed no sin[b][a], nor was deceit found in his mouth.
translation:
  language: zh_hans
  text: 他没有犯过罪[b]，他口中也没有诡诈[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “诡诈”也可译作“欺骗”或“奸诈”；希腊词可指欺骗、欺诈或背信。
    reason: lexical_alternative
  - marker: b
    text: 这里的措辞呼应以赛亚书53:9。
    reason: cross_reference
lexical_decisions:
- source_word: ὃς
  choice: 他
  rationale: 关系代词承接上文所说的基督。汉语若直译为“他是那……的人”会显得累赘，因此用“他”自然承接，同时不增加原文没有的强调。
- source_word: ἁμαρτίαν οὐκ ἐποίησεν
  choice: 没有犯过罪
  rationale: ποιέω与ἁμαρτία搭配，惯用义为“犯罪”。“没有犯过罪”在现代汉语中自然，并保留原文对基督无罪的概括性陈述。
- source_word: οὐδὲ
  choice: 也没有
  rationale: 连接两个并列的否定分句；“也没有”符合现代汉语表达，并清楚保留递进并列关系。
- source_word: εὑρέθη
  choice: 没有……被发现（译文按汉语习惯作“没有”）
  rationale: 原词是“发现”的不定过去时被动式。正文“他口中也没有诡诈”避免生硬的被动句，但仍表达任何诡诈都未被发现、也不存在的意思。
- source_word: δόλος
  choice: 诡诈
  rationale: 该词可指欺骗、奸诈或诡计。“诡诈”庄重而仍为现代读者所懂，也与以赛亚书53:9的传统互文措辞相协调；脚注说明其语义范围。
- source_word: ἐν τῷ στόματι αὐτοῦ
  choice: 他口中
  rationale: 贴近原文的身体隐喻，指言语中没有欺骗，也保留与以赛亚书53:9的呼应。
theological_decisions:
- issue: 本节以以赛亚书53:9的语言描述基督的无罪与诚实
  choice: 采用“没有犯过罪”和“口中也没有诡诈”，保留经文呼应而不加解释
  alternative: 译作“他从不犯罪，也从不说骗人的话”
  rationale: 较贴近原文的措辞既保留基督无罪的神学力度，也保留与受苦仆人经文的互文关系；不把“口中没有诡诈”缩窄为某一种说谎行为。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“犯过罪”比“行过罪”更符合当代用法；“口中没有诡诈”略带经文语体，用以保留原文意象和以赛亚书的呼应。脚注标记均置于相应词语之后。
