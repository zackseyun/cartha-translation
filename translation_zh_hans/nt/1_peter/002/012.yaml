id: 1PE.2.12
reference: 1 Peter 2:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: τὴν ἀναστροφὴν ὑμῶν ⸂ἐν τοῖς ἔθνεσιν ἔχοντες καλήν⸃, ἵνα, ἐν ᾧ καταλαλοῦσιν ὑμῶν ὡς κακοποιῶν, ἐκ τῶν καλῶν ἔργων ⸀ἐποπτεύοντες δοξάσωσι τὸν θεὸν ἐν ἡμέρᾳ ἐπισκοπῆς.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/012.yaml
  text: Keep your conduct among the Gentiles honorable, so that, in what they slander you as evildoers, by observing your good works they may glorify God on the day of visitation.
translation:
  language: zh_hans
  text: 你们在外邦人中间要保持美好的品行，好使那些在毁谤你们为作恶者的事上、亲眼看见你们善行的人，便在神察访的日子[a]荣耀神。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “察访的日子”也可译作“眷顾的日子”，指神临到并施行察验或眷顾的时候。
    reason: 原文ἐν ἡμέρᾳ ἐπισκοπῆς具有一定语义开放性，不宜在正文中单方面限定为恩典或审判。
lexical_decisions:
- source_word: ἀναστροφή
  choice: 品行
  rationale: 指一个人的生活方式和日常行为；“品行”简洁自然，也保留其道德含义。
- source_word: ἔθνεσιν
  choice: 外族人
  rationale: 在本段语境中指信徒群体以外的各族世人；译作“外族人”比音译或传统术语更便于现代读者理解，同时不直接把词义收窄为“非信徒”。
- source_word: καλήν / καλῶν
  choice: 端正的／好
  rationale: 同一词根在此分别修饰品行和行为；按汉语搭配译为“端正的品行”和“好行为”，保留其美善、可敬的意味。
- source_word: ἐποπτεύοντες
  choice: 亲眼看见
  rationale: 该词强调亲自观察、目睹，而非仅仅听说。
- source_word: ἐπισκοπῆς
  choice: 察访
  rationale: 可指神临到并施行眷顾或鉴察；“察访”较能保留这种开放性，不预先限定为恩典或审判。
theological_decisions:
- issue: ἐν ᾧ 的关系和让步色彩
  choice: 在毁谤你们为作恶者的事上
  alternative: 虽然他们毁谤你们是作恶者
  rationale: 原文直译近于“在其中／在那件事上”，语法略有开放性；采用“在……的事上”保留这种关系，不把它明确改写成让步从句。
- issue: “察访的日子”的性质
  choice: 不明确限定为得救、审判或末日
  alternative: 神眷顾的日子／神审判的日子
  rationale: ἐπισκοπή 本身可带眷顾或鉴察的意味；上下文并未要求译者在正文中排除其中一种可能。
- issue: 荣耀神的主体
  choice: 毁谤者／外族人将荣耀神
  alternative: 信徒荣耀神
  rationale: δοξάσωσι 的隐含主语承接毁谤并观察信徒行为的人；中文据此使用“他们”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“保持端正的品行”表达持续的生活见证；保留“在……的事上”这一略显正式的结构，以忠实反映原文 ἐν ᾧ 的真实歧义。
