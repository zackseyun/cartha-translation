id: 1PE.2.24
reference: 1 Peter 2:24
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὃς τὰς ἁμαρτίας ἡμῶν αὐτὸς ἀνήνεγκεν ἐν τῷ σώματι αὐτοῦ ἐπὶ τὸ ξύλον, ἵνα ταῖς ἁμαρτίαις ἀπογενόμενοι τῇ δικαιοσύνῃ ζήσωμεν· οὗ τῷ ⸀μώλωπι ἰάθητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/024.yaml
  text: He himself bore our sins in his body on the tree[a], so that, having died to sins, we might live to righteousness[c][b]. By his wound you were healed.
translation:
  language: zh_hans
  text: 他亲自在木头[a]上，在自己的身体上担当了我们的罪，使我们既已脱离罪，便可以为义而活；因他所受的伤痕[c]，你们得了医治[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “木头”在这里指十字架；原文用ξύλον（木头、树木），可能呼应《申命记》21:23。也可译作“十字架”。
    reason: alternative_reading
  - marker: c
    text: “伤痕”也可译作“创伤”“青肿”或“鞭伤”；原文为单数，呼应《以赛亚书》53:5。
    reason: lexical_alternative
  - marker: d
    text: 这里的“医治”表达得较宽泛；按上下文，它与罪和义密切相关，但原文没有把含义限定为只属身体或只属灵性的医治。
    reason: cross_reference
lexical_decisions:
- source_word: ἀνήνεγκεν
  choice: 担当了
  rationale: ἀναφέρω可表示带上去、献上或承担。这里以“我们的罪”为宾语，又处于受苦与献祭的语境；“担当”既保留承担罪的含义和《以赛亚书》53章的呼应，也不把词义限定为某一套技术性的献祭术语。
- source_word: ἐν τῷ σώματι αὐτοῦ
  choice: 以自己的身体
  rationale: 明确保留基督身体受苦的具体性；结合汉语表达，用“以自己的身体”自然地说明担当罪发生在他真实的身体中，同时不削弱前面“亲自”的强调。
- source_word: ἐπὶ τὸ ξύλον
  choice: 在木头上
  rationale: ξύλον本义为木头、树木，在这里指钉十字架，并可能呼应《申命记》21:23。正文保留“木头”，比直接译为“十字架”更贴近原词。
- source_word: ταῖς ἁμαρτίαις ἀπογενόμενοι
  choice: 既与罪断绝
  rationale: ἀπογίνομαι表达离开、不再与之相属的决定性转变。“与罪断绝”在现代汉语中自然，并保留其脱离罪、向罪而死的语义张力；“罪”在此按汉语习惯用集合性单数表达希腊文复数。
- source_word: τῇ δικαιοσύνῃ ζήσωμεν
  choice: 为义而活
  rationale: 与前面的“与罪断绝”形成清楚对照，表达生命转向并以义为目标。“义”保留δικαιοσύνη在此处兼具正确关系与正直生活的伦理含义。
- source_word: μώλωπι
  choice: 伤痕
  rationale: μώλωψ指击打造成的伤、青肿或伤痕，且原文为单数。“伤痕”是现代汉语中自然而庄重的表达，并能承接《以赛亚书》53:5的呼应。
- source_word: ἰάθητε
  choice: 你们得了医治
  rationale: 保留不定过去时被动语态所表达的已成事实，也保留“医治”可用于身体、属灵及整体复原的宽度，不在正文中擅自缩窄。
- source_word: αὐτὸς
  choice: 亲自
  rationale: 原文强化代词突出承担者就是他本人；“亲自”在汉语中准确传达这一强调。
theological_decisions:
- issue: 末句“医治”的范围
  choice: 正文仅译为“你们得了医治”，不限定为纯身体或纯属灵的医治。
  alternative: 明确译作“你们的罪得了医治”，或解释为身体疾病得医治。
  rationale: 上下文集中于罪、义和基督的受苦，因此医治显然包含从罪中复原；但原文没有明说只限于某一层面。保留宽泛措辞，既顺应上下文，也保存《以赛亚书》53章意象的张力。
- issue: ξύλον所指的刑具
  choice: 正文译“木头”，脚注说明指十字架。
  alternative: 正文直接译“十字架”。
  rationale: 事件所指确为耶稣被钉十字架，但希腊文用ξύλον而非σταυρός。保留“木头”可呈现原文措辞及其可能的《申命记》21:23呼应。
- issue: ἀπογενόμενοι与罪的关系
  choice: 译为“与罪断绝”，表达决定性的脱离。
  alternative: 译为“向罪死了”或“不再犯罪”。
  rationale: “向罪死了”能表达上下文意义，却比该动词本身更具固定神学色彩；“不再犯罪”又可能被理解为此后绝无任何犯罪。选文保留决定性转变，而不把结果绝对化。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“担当”“为义而活”“得了医治”保留经文的肃穆感，又不使用生僻文言。“木头”略显反常，特意保留原文用词和经文互文，并用脚注帮助读者理解。
