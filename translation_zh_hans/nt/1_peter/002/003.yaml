  text: if indeed you have tasted that the Lord is good[a][b].
translation:
  language: zh_hans
  text: 如果你们确实[a]尝过主美善[b]的滋味。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“既然你们已经尝过。”希腊文采用条件句式，但可能预设这个条件确实成立。
    reason: alternative_reading
  - marker: b
    text: “美善”也可译作“仁慈”或“恩慈”。这里的措辞呼应《诗篇》34:8。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: 如果……确实
  rationale: 保留希腊文的条件形式，同时用“确实”表达此条件在修辞上很可能被视为已经成立；不直接改成“既然”，以免消除原文张力。
- source_word: ἐγεύσασθε
  choice: 尝过……的滋味
  rationale: 保留“尝”的具体意象，与上文婴孩渴慕奶的图景相连，也呼应诗篇34:8；“尝过”自然表达先前经历及其现今关联。
- source_word: ὅτι
  choice: （以“尝过……的滋味”表达其内容关系）
  rationale: 希腊文ὅτι引出所尝知的内容。汉语用“尝过主是美善的滋味”比生硬的“尝过主是美善的”更自然，同时没有把它解释成原因。
- source_word: χρηστὸς
  choice: 美善
  rationale: 该词可表示良善、仁慈、恩慈。“美善”既保持宽广含义，又适合“品尝”的意象；脚注列出较窄的可选译法。
- source_word: κύριος
  choice: 主
  rationale: 既保留这一称号的神学分量，也维持与诗篇34:8的互文呼应；正文不明确增补为“基督”，以保留语境中的双重共鸣。
theological_decisions:
- issue: 条件从句εἰ的语气
  choice: 如果你们确实尝过
  alternative: 既然你们已经尝过
  rationale: 该条件很可能预设读者确有这种经历，但原文仍使用条件形式；正文保留条件结构，并以“确实”提示其预期真实性。
- issue: “主”的所指
  choice: 仅译作“主”
  alternative: 主基督
  rationale: 上下文与耶稣密切相关，但措辞又明显呼应诗篇中对主的表述；不在正文中明确加上“基督”，可避免替原文消解这种互文张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“尝过……的滋味”保留饮食意象并使汉语自然；“美善”兼顾χρηστός的宽广语义与诗篇回声。所有脚注标记均置于正文相应位置。
