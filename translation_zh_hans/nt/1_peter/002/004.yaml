  text: Πρὸς ὃν προσερχόμενοι, λίθον ζῶντα, ὑπὸ ἀνθρώπων μὲν ἀποδεδοκιμασμένον παρὰ δὲ θεῷ ἐκλεκτὸν ἔντιμον
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/004.yaml
  text: As you come to him[a], a living stone, rejected by men but chosen and precious in the sight of God[b],
translation:
  language: zh_hans
  text: 你们来到他面前[a]——他是活石，虽被人[b]弃绝，在上帝看来却是蒙拣选、宝贵的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“向他”；“来到”也可译作“亲近”。原文形式也可表达“当你们来到他面前时”或持续来到他面前。
    reason: lexical_alternative
  - marker: b
    text: 原文“人”可指人类或众人，并非只指男性。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρὸς ὃν προσερχόμενοι
  choice: 你们来到他面前
  rationale: 保留朝向“他”的动作，并以自然的现代汉语表达现在分词与读者之间的关系；不在正文中补出“耶稣”的名字，以保留原文的代词形式。
- source_word: λίθον ζῶντα
  choice: 他是活石
  rationale: λίθος通常指用于建筑的“石头”，译作“活石”既保留原文悖论式比喻，也衔接下文的建造意象。
- source_word: ὑπὸ ἀνθρώπων
  choice: 被人
  rationale: ἀνθρώπων在此泛指人类一方，与上帝的判断形成对照；现代汉语“人”自然涵盖众人，不限定为男性。
- source_word: ἀποδεδοκιμασμένον
  choice: 弃绝
  rationale: 该完成时被动分词表示经过评断后已遭拒绝；“弃绝”简洁保留拒斥及否定评价的意味。
- source_word: παρὰ δὲ θεῷ
  choice: 在上帝看来却
  rationale: παρά加与格在此表达在上帝那里的地位或按上帝的评价；“在上帝看来”清楚呈现它与人的判断之间的对比。
- source_word: ἐκλεκτὸν
  choice: 蒙拣选
  rationale: 被动式汉语表达这块活石是上帝拣选的对象，同时避免把“拣选”处理成仅表示优质的形容词。
- source_word: ἔντιμον
  choice: 宝贵
  rationale: ἔντιμος兼有受尊重和价值珍贵之意；“宝贵”自然契合石头意象，但其“尊贵”义以脚注保留。
theological_decisions:
- issue: 代词“他”及活石的指称
  choice: 保留“他”，由上下文指向主耶稣基督
  alternative: 在正文中直接写“耶稣”或“基督”
  rationale: 2:3—4及2:6—8的石头经文表明所指是基督，但本节希腊文只用关系代词，因此不在正文中明说名字。
- issue: 人的弃绝与上帝的拣选之间的对照
  choice: 明确保留“虽……却……”的让步对比
  alternative: 仅并列两个评价
  rationale: 原文μέν……δέ突出人和上帝截然不同的判断；译文保留这一神学张力，而不解释弃绝或拣选的机制。
- issue: ἔντιμον的价值与尊荣含义
  choice: 正文译“宝贵”，脚注保留“尊贵”
  alternative: 正文译“尊贵”或“受尊崇”
  rationale: “宝贵”更贴合石头比喻和现代汉语表达，但原词也可强调尊荣，故不将该层含义静默排除。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“活石”“弃绝”“蒙拣选”保留经文的核心意象和神学用语，同时避免古奥句式；分号用于清楚呈现“他”与“活石”的同位关系。
