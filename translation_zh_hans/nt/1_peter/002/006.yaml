id: 1PE.2.6
reference: 1 Peter 2:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: διότι περιέχει ⸀ἐν γραφῇ· Ἰδοὺ τίθημι ἐν Σιὼν λίθον ⸂ἀκρογωνιαῖον ἐκλεκτὸν⸃ ἔντιμον, καὶ ὁ πιστεύων ἐπ’ αὐτῷ οὐ μὴ καταισχυνθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/006.yaml
  text: 'For it stands in Scripture: “Behold[a], I lay in Zion a chosen and honored cornerstone[e][d][c][b], and the one who believes in him will certainly not be put to shame.”'
translation:
  language: zh_hans
  text: 因为经上记着：“看哪，我在锡安安放一块蒙拣选、尊贵的房角石[a]；信靠他的人，绝不会蒙羞[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “尊贵的”也可译作“宝贵的”或“珍贵的”。“房角石”指建筑中关键的角石；原文未明确它是基础角石还是顶部的角石。
    reason: lexical_alternative
  - marker: b
    text: “他”按彼得在上下文中对基督的应用而译；若严格顺着“石头”的比喻，也可译作“它”。“绝不会”表达原文强烈的否定语气。
    reason: alternative_reading
lexical_decisions:
- source_word: διότι
  choice: 因为
  rationale: 承接上文，为彼得前面的论述引入经文依据；现代汉语用“因为”自然清楚。
- source_word: περιέχει ἐν γραφῇ
  choice: 经上记着
  rationale: 这是希腊语较特殊的非人称表达，意为某话载于经书中；“经上记着”既符合汉语圣经语体，也比生硬直译更自然。
- source_word: Ἰδοὺ
  choice: 看哪
  rationale: 保留先知引文中唤起注意的庄重语气。
- source_word: τίθημι
  choice: 安放
  rationale: 配合建筑意象，表达把石头放置在特定位置；较“放”庄重，又不额外限定为奠基动作。
- source_word: ἐν Σιὼν
  choice: 在锡安
  rationale: 直接保留ἐν的处所意义和“锡安”这一专名。
- source_word: λίθον ἀκρογωνιαῖον
  choice: 房角石
  rationale: 指建筑物角部具有关键作用的石头；“房角石”是准确且广为理解的传统汉语表达。
- source_word: ἐκλεκτὸν
  choice: 蒙拣选
  rationale: 表达这石头是被神选定的；“蒙”使其被动含义在汉语中更明确。
- source_word: ἔντιμον
  choice: 受尊重的
  rationale: 突出该词的尊荣、受重视含义，并与下文2:7的“尊荣”主题相呼应；其“宝贵”义另见脚注。
- source_word: ὁ πιστεύων ἐπ’ αὐτῷ
  choice: 信靠他的人
  rationale: πιστεύω加ἐπί在这里包含把信心置于某对象之上的意味；“信靠”自然表达这种倚赖。代词译为“他”，反映彼得在上下文中把石头经文应用于基督。
- source_word: οὐ μὴ καταισχυνθῇ
  choice: 绝不会蒙羞
  rationale: “绝不会”传达οὐ μή的强烈否定；“蒙羞”直接保留καταισχύνω的羞耻含义。
theological_decisions:
- issue: 以赛亚引文中αὐτῷ的所指
  choice: 译作人格代词“他”
  alternative: 按石头的比喻译作“它”
  rationale: 就引文本身而言，代词可回指“石头”；但彼得在2:4–8明确把这石头应用于耶稣基督。译作“他”呈现彼得在当前语境中的基督论用法，同时脚注保留比喻层面的另一种理解。
- issue: ἔντιμον表达价值还是尊荣
  choice: 正文译作“受尊重的”
  alternative: 译作“宝贵的”或“珍贵的”
  rationale: 该词兼有贵重和受尊崇的语义。正文选择尊荣义，以衔接2:7的τιμή主题；脚注明示价值义，避免排除真实的词义张力。
- issue: ἀκρογωνιαῖον在建筑意象中的具体位置
  choice: 译作“房角石”
  alternative: 译作“基石”或“顶角石”
  rationale: 该词确定指关键的角石，但仅凭本节难以断定它具体是基础角石还是建筑顶部的角石。“房角石”保留这种可能性，不作过度解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“经上记着”“看哪”“锡安”“房角石”保留经文引述的正式语域；其余措辞避免古奥。“蒙拣选、受尊重”以对称结构呈现并列修饰语。
