  text: εἴτε ἡγεμόσιν ὡς δι’ αὐτοῦ πεμπομένοις εἰς ἐκδίκησιν κακοποιῶν ἔπαινον δὲ ἀγαθοποιῶν
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/014.yaml
  text: or to governors[a], as those sent by him for the punishment of evildoers and the praise of those who do good.
translation:
  language: zh_hans
  text: 或顺服总督[a]；他们是奉他差遣，为要惩罚作恶的人、褒奖行善的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “奉他差遣”中的“他”，最自然是指上一节所说的君王或皇帝；也有人理解为上帝。
    reason: 说明δι’ αὐτοῦ中代词所指的歧义。
lexical_decisions:
- source_word: εἴτε
  choice: 或要顺服
  rationale: 承接上一节“无论是……或是……”的结构；补出上一节支配本句的“顺服”，使独立呈现的中文经节自然清楚。
- source_word: ἡγεμόσιν
  choice: 总督
  rationale: 在此公民治理语境中指受委派的治理官员；“总督”简洁自然，又不进一步限定具体的罗马官阶。
- source_word: ὡς δι’ αὐτοῦ πεμπομένοις
  choice: 因为他们是由他派来
  rationale: ὡς在这里说明顺服总督的依据或其身份，可自然译作“因为”；διά加属格与被动分词表达间接施事，“由他派来”既符合现代汉语，也保留代词所指的张力。
- source_word: εἰς ἐκδίκησιν κακοποιῶν
  choice: 惩罚作恶的人
  rationale: ἐκδίκησις在政府司法语境中是施行惩处，不必译成带私人报复色彩的“报仇”；κακοποιῶν指惯于或正在作恶的人。
- source_word: ἔπαινον δὲ ἀγαθοποιῶν
  choice: 褒奖行善的人
  rationale: ἔπαινος与前面的“惩罚”形成平衡，表示公开肯定或赞许；“褒奖”较能体现治理者的认可，同时保留ἀγαθοποιῶν的行为性。
theological_decisions:
- issue: δι’ αὐτοῦ中αὐτοῦ所指
  choice: 正文保留“他”，语境上最自然地回指上一节的君王或皇帝
  alternative: 理解为上帝借其权柄秩序差派总督
  rationale: 最近的语法先行词是上一节的君王，符合行政权力委派的上下文；但正文不以明说对象的方式排除较广义的神学理解，并用脚注交代歧义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。因本节在希腊文中延续上一节的句法，正文补出“顺服”；用“总督”表达治理官员，用“惩罚……、褒奖……”保存原文工整的目的并列。
