  rationale: 修订避免把ὡς解释为因果性的“因为”，以“他们是奉他差遣”保留其描述性功能；以“为要”呈现两个εἰς短语的目的关系。正文仍以“他”保留αὐτοῦ的歧义，脚注简要交代最自然的上下文所指及另一种理解。
