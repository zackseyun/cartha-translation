  text: Ἀποθέμενοι οὖν πᾶσαν κακίαν καὶ πάντα δόλον καὶ ⸀ὑποκρίσεις καὶ φθόνους καὶ πάσας καταλαλιάς,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/001.yaml
  text: Therefore[a], having put away all malice and all deceit and hypocrisies and envies and all slanders[b],
translation:
  language: zh_hans
  text: 所以，你们既除去一切恶意、一切诡诈、种种虚伪和嫉妒，以及一切毁谤的话[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “毁谤的话”也可译作“说人坏话”；原文泛指贬损他人、攻击他人的言论。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀποθέμενοι
  choice: 既除去
  rationale: 不定过去时中间语态分词在第2节主要命令之前作附带说明，表达预备性的行动；“既除去”自然保留了这一语法关系及其完成意味，而没有把它另译为独立命令。
- source_word: οὖν
  choice: 所以
  rationale: 标明本节是从1:22—25所得出的劝勉；“所以”在现代汉语中清楚、自然。
- source_word: πᾶσαν κακίαν
  choice: 一切恶意
  rationale: κακία可泛指邪恶，但在这组涉及人际关系的恶行中尤其带有恶意、害人之心的意味；“恶意”既具体又符合上下文。
- source_word: πάντα δόλον
  choice: 一切诡诈
  rationale: δόλος指欺骗、狡诈；“诡诈”简洁而庄重，并保留其品格和行为层面的含义。
- source_word: ὑποκρίσεις
  choice: 种种虚伪
  rationale: 希腊文使用复数，指各种虚假伪装或虚伪表现；“种种虚伪”比生硬的复数形式更符合现代汉语，同时体现原文复数。
- source_word: φθόνους
  choice: 嫉妒
  rationale: φθόνος指因别人拥有好处而产生的嫉妒。汉语抽象名词通常不作复数，因此用“嫉妒”自然表达原文所列的这一类恶行。
- source_word: πάσας καταλαλιάς
  choice: 一切毁谤人的话
  rationale: καταλαλιά泛指贬损、说坏话或毁坏他人名声的言论。“毁谤人的话”明确保留其针对他人的言语性质，同时避免把意义限制在现代法律意义上的诽谤。
theological_decisions:
- issue: 恶行清单的道德范围
  choice: 逐项具体翻译，不加教义性扩展
  alternative: 把κακία宽泛译为“邪恶”，或把καταλαλιάς译为“说坏话”
  rationale: 本节是伦理劝勉；具体措辞能保留原文在人际关系方面的道德力度，同时不把任何一项缩窄为特定宗派所界定的罪类。
- issue: 分词与第2节命令之间的关系
  choice: 用“既除去”保留其作为第2节主要劝勉之预备行动的附属关系
  alternative: 译成独立命令“要除去”或进行性表达“除去……”
  rationale: 原文此处不是独立的限定动词，而是分词；中文“既……”可让句子延续到下一节，保留其语法张力，而不提前把关系解释为另一项并列命令。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以“所以”承接上文，以“既除去”使本节在语法上继续指向第2节。清单中适度使用“一切”和“种种”，既反映希腊文的全称词与复数，也避免不自然的汉语复数堆叠。
