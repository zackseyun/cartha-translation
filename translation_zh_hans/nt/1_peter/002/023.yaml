  text: ὃς λοιδορούμενος οὐκ ἀντελοιδόρει, πάσχων οὐκ ἠπείλει, παρεδίδου δὲ τῷ κρίνοντι δικαίως·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/023.yaml
  text: who[a], when he was insulted, did not insult in return; when he suffered, he did not threaten[b], but kept entrusting himself to the one who judges justly.
translation:
  language: zh_hans
  text: 他被辱骂时，不还以辱骂；受苦时，也不威胁，却不断把自己[a]交托给那位秉公审判者。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文没有明说“交托”的宾语；也可理解为“把自己的事交托”。
    reason: 原文省略宾语，正文按语境补出“自己”；脚注保留也可指自己的案件或事情的理解空间。
lexical_decisions:
- source_word: λοιδορούμενος / ἀντελοιδόρει
  choice: 受辱骂时，不以辱骂还击
  rationale: “辱骂”准确表达言语侮辱；“还击”保留ἀντι-所含的回应、报复意味。未采用较书面的“毁谤”或较弱的“侮辱”。
- source_word: πάσχων
  choice: 受苦时
  rationale: 将现在分词按时间情境处理，与前一分句形成自然平行。
- source_word: οὐκ ἠπείλει
  choice: 也不威胁
  rationale: 准确表达ἀπειλέω所指的发出威吓或威胁；简洁自然，并不添加原文未明说的受威胁对象。
- source_word: παρεδίδου
  choice: 反而不断把自己交托
  rationale: “不断”体现未完成过去时的持续或一贯性；“交托”适合此处信赖、交付的语境。希腊文没有明说宾语，因此用脚注保留“自己”与“自己的事”两种理解空间。
- source_word: τῷ κρίνοντι δικαίως
  choice: 给那位按公义审判的
  rationale: 保留冠词化分词的描述性表达，不把它压缩为原文没有明说的神圣称号；“按公义”自然表达副词δικαίως。
- source_word: δὲ
  choice: 反而
  rationale: 清楚呈现不报复与积极交托之间的转折。
- source_word: ὃς
  choice: 他
  rationale: 关系代词承接上文所说的基督；中文分节独立呈现时用“他”比生硬的“那一位”更自然。
theological_decisions:
- issue: “那位按公义审判的”所指是谁
  choice: 沿用原文的描述性称呼，不在正文中直接补作“父神”或“神”
  alternative: 明确译为“按公义审判的神”或“父神”
  rationale: 上下文所指是神，但希腊文只用冠词化分词描述“那位按公义审判的”；保留这种表达可避免加入原文未明说的位格称号。
- issue: παρεδίδου省略的宾语
  choice: 正文按语境译为“把自己交托”，并用脚注说明另一可能
  alternative: 译为“把自己的事交托”
  rationale: 受苦者把自己交付给公义审判者符合句法和语境，但原文确实没有明说宾语；脚注保留可能是把自己的案件或事情交托的理解。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“辱骂—辱骂”有意保留原文词根呼应；“不以……还击”避免机械重复。“那位按公义审判的”保留原文的描述性和所指含蓄性。
