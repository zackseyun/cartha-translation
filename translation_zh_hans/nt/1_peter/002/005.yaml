  text: καὶ αὐτοὶ ὡς λίθοι ζῶντες οἰκοδομεῖσθε οἶκος πνευματικὸς ⸀εἰς ἱεράτευμα ἅγιον, ἀνενέγκαι πνευματικὰς θυσίας ⸀εὐπροσδέκτους θεῷ διὰ Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/005.yaml
  text: you yourselves also[a], as living stones, are being built up as a spiritual house into a holy priesthood[d][c][b], to offer spiritual sacrifices acceptable to God through Jesus the Messiah.
translation:
  language: zh_hans
  text: 你们自己也像活石一样，正被建造成一所属灵的房屋，成为圣洁的祭司群体[a]，借着耶稣基督献上蒙上帝悦纳的属灵祭物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “成为”也可译作“为要作”；原文介词可表示目标或结果。
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ αὐτοὶ ὡς λίθοι ζῶντες
  choice: 你们自己也像活石一样
  rationale: “你们自己”保留代词的强调作用，“也”承接上文基督这块“活石”；“像活石一样”自然表达ὡς的比拟，并保留上下文意象。
- source_word: οἰκοδομεῖσθε
  choice: 正被建造成
  rationale: 保留现在时所呈现的持续过程和被动语态，不明说经文未明示的施事者。
- source_word: οἶκος πνευματικός
  choice: 属灵的殿
  rationale: οἶκος可指房屋，也可在宗教语境中指殿宇；此处与祭司和献祭意象相连，“殿”在现代汉语中更自然地呈现整体隐喻，但不具体限定为某座物质圣殿。
- source_word: εἰς ἱεράτευμα ἅγιον
  choice: 成为圣洁的祭司群体
  rationale: εἰς表达目标或结果；ἱεράτευμα指集体性的祭司群体，而非仅指若干个别祭司。“成为”在汉语中自然表达建造所达到的结果。
- source_word: ἀνενέγκαι πνευματικὰς θυσίας
  choice: 献上……属灵祭物
  rationale: ἀναφέρω在祭祀语境中指献上；“属灵祭物”保留祭祀意象及πνευματικός的修饰范围，不擅自说明祭物的具体内容。
- source_word: εὐπροσδέκτους θεῷ
  choice: 蒙上帝悦纳的
  rationale: 采用祭祀语境中自然的汉语表达，保留祭物为上帝所接纳之意。
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: 借着耶稣基督
  rationale: διά加属格表示途径或中介；“借着”准确表达这一关系。“耶稣基督”是现代中文中对带称号意味的Ἰησοῦ Χριστοῦ最通行且庄重的表达。
theological_decisions:
- issue: οἰκοδομεῖσθε的语态与施事者
  choice: 译作被动的“正被建造成”，不补出施事者
  alternative: “把自己建造成”或“上帝正把你们建造成”
  rationale: 该形式最自然地理解为被动；经文本句未明说施事者，因此既不改为反身，也不直接补出“上帝”。
- issue: εἰς ἱεράτευμα ἅγιον所表达的关系
  choice: 译作“成为圣洁的祭司群体”
  alternative: “为要作圣洁的祭司群体”或较直译的“进入圣洁的祭司群体”
  rationale: εἰς可表示目标或结果；正文采用自然汉语表达结果，同时以脚注保留目的义的可能。
- issue: ἱεράτευμα的集体意义
  choice: 祭司群体
  alternative: 祭司职分或众祭司
  rationale: 该词主要指祭司组成的整体；“祭司群体”避免把重点缩减为抽象职分，也避免仅理解为互不相干的个人。
- issue: Χριστός的译法
  choice: 基督
  alternative: 受膏者／弥赛亚
  rationale: Χριστός在此仍带称号意义；现代标准中文以“耶稣基督”作为清楚、庄重且广泛可懂的称呼，不把它处理成纯粹个人名字，也不额外展开解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“殿”与“祭司群体”“献上祭物”形成连贯的圣殿—祭祀意象；“正被建造成”保留过程性和被动语态。正文避免生硬照搬希腊语介词结构，并用脚注保存其目标／结果两可性。
