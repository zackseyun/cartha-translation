  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ἀγαπητοί, παρακαλῶ ὡς παροίκους καὶ παρεπιδήμους ἀπέχεσθαι τῶν σαρκικῶν ἐπιθυμιῶν, αἵτινες στρατεύονται κατὰ τῆς ψυχῆς·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/011.yaml
  text: Beloved[a], I urge you as sojourners and exiles to abstain from fleshly desires[c][b], which wage war against the soul.
translation:
  language: zh_hans
  text: 亲爱的各位，我劝你们：身为异乡人和寄居者[a]，要禁戒肉体的欲望[b]；这些欲望正向灵魂[c]发动争战。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“外来居民和暂住者”。这两个并列的词强调外来、暂居的身份。
    reason: lexical_alternative
  - marker: b
    text: “肉体的欲望”也可译作“属肉体的欲望”；这里不只指性欲。若译作“罪恶的欲望”，解释性更强。
    reason: lexical_alternative
  - marker: c
    text: “灵魂”在这里也可能指“生命”“自身”或“整个人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: 亲爱的各位
  rationale: 这是带有爱意的复数呼语。“亲爱的各位”自然传达亲切语气，同时不擅自加入原文没有明说的“弟兄姊妹”等身份称谓。
- source_word: παρακαλῶ
  choice: 我劝你们
  rationale: 此处表示恳切的劝勉，不只是一般请求；“劝”在现代汉语中自然，也保留了劝诫的力度。
- source_word: ὡς
  choice: 身为
  rationale: 表明读者受劝勉时所具有的身份，避免译成“既然”而加入过强的因果意味。
- source_word: παροίκους καὶ παρεπιδήμους
  choice: 异乡人和寄居者
  rationale: 两个词共同描写不在本乡、未在现今所在地永久安居的人。“异乡人”突出非本地归属，“寄居者”突出暂居状态，并保留二词并列。
- source_word: ἀπέχεσθαι
  choice: 要禁戒
  rationale: 表示持续约束自己、远离某事；“禁戒”简洁而有明确的伦理分量。
- source_word: σαρκικῶν ἐπιθυμιῶν
  choice: 肉体的欲望
  rationale: 保留σαρκικός与“肉体”的词义联系以及原文的神学张力，不直接解释成“罪恶的欲望”，也不把欲望限缩为性欲。
- source_word: στρατεύονται
  choice: 争战
  rationale: 保留军事隐喻，描绘这些欲望主动进行敌对攻击。
- source_word: κατὰ τῆς ψυχῆς
  choice: 与灵魂争战
  rationale: κατά加属格表达敌对方向；“与……争战”符合现代汉语习惯。“灵魂”保留ψυχή的传统和神学分量，但脚注注明其可能涵盖生命或整个人。
theological_decisions:
- issue: σαρκικῶν在伦理语境中的译法
  choice: 肉体的
  alternative: 属肉体的；罪恶的
  rationale: “肉体的”最直接保留原文意象。“罪恶的”虽符合本句的负面语境，却会把原文隐喻直接解释掉；“属肉体的”也可行，但更带固定神学术语色彩。
- issue: ψυχή的含义范围
  choice: 灵魂
  alternative: 生命；自身；整个人
  rationale: “灵魂”保留原词在本句中的内在生命和人格分量，但不据此断定一种严格的身体—灵魂二分；脚注保留其较宽的语义可能。
- issue: παροίκους与παρεπιδήμους所指的身份
  choice: 异乡人和寄居者
  alternative: 外来居民和暂住者；客旅和寄居者
  rationale: 原文可以兼具社会身份和神学身份的意味。正文保留身份比喻，不将其限定为政治流亡，也不直接解释为“不属于今世”。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“亲爱的各位”保持温暖的劝勉语气；分号清楚连接命令与其解释。正文避免生僻的“侨民”“羁旅者”，也避免把“肉体”“灵魂”过度教义化。
