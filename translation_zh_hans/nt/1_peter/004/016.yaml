  text: εἰ δὲ ὡς Χριστιανός, μὴ αἰσχυνέσθω, δοξαζέτω δὲ τὸν θεὸν ἐν τῷ ⸀ὀνόματι τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/016.yaml
  text: But if as a Christian[a], let him not be ashamed, but let him glorify God in this name.
translation:
  language: zh_hans
  text: 但若有人因作为基督徒而受苦[a]，就不要以此为耻，反要因这名荣耀上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“但若有人作为基督徒受苦……反要在这名里荣耀上帝。”本节原文省略“受苦”，承接上一节。末句较直译为“在这名里”，很可能指“基督徒”这个称号；也可理解为“在这件事上”或“因为这名”。
    reason: 说明承接上文补出的“受苦”，并保留ἐν τῷ ὀνόματι τούτῳ较直译的措辞及其替代理解。
lexical_decisions:
- source_word: εἰ δὲ
  choice: 但若
  rationale: 保留条件关系和δέ轻微的转折作用，并符合现代汉语表达。
- source_word: ὡς Χριστιανός
  choice: 因是基督徒而受苦
  rationale: 原文承接上一节省略了“受苦”；汉语补出这一语境成分，使条件句完整。“基督徒”是Χριστιανός通行且已词汇化的对应称谓。
- source_word: μὴ αἰσχυνέσθω
  choice: 就不要羞耻
  rationale: 以自然的第三人称劝诫句表达现在时命令语气，不削弱其命令力度。
- source_word: δοξαζέτω δὲ τὸν θεόν
  choice: 反要……荣耀上帝
  rationale: “反要”清楚呈现与“不羞耻”的对照；“荣耀上帝”保留δοξάζω在以上帝为对象时的常见宗教用法。
- source_word: ἐν τῷ ὀνόματι τούτῳ
  choice: 因这名
  rationale: 保留ὄνομα的“名、称号”意义，并用“因”自然表达ἐν在此可能具有的依据或缘由含义；“这名”紧接“基督徒”这一称号，同时不把关系解释得过细。
theological_decisions:
- issue: ἐν τῷ ὀνόματι τούτῳ所指及ἐν的语义
  choice: “因这名”，主要指“基督徒”这一称号
  alternative: “在这名里”；或“在这件事上”；或“因为有这名”
  rationale: Χριστιανός是最近的先行概念，而ὄνομα通常表示名称或称号。“因这名”在现代汉语中较自然，也保留因承担此称号而荣耀上帝的含义；脚注列出较直译及较宽泛的可能解释，以保存原文歧义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“上帝”用于θεός；句式简明，适合普通读者。主句补出上文所含的“受苦”，避免汉语条件句残缺；脚注交代这一补足及末句的歧义。
