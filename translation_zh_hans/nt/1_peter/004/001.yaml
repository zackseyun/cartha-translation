id: 1PE.4.1
reference: 1 Peter 4:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Χριστοῦ οὖν ⸀παθόντος σαρκὶ καὶ ὑμεῖς τὴν αὐτὴν ἔννοιαν ὁπλίσασθε, ὅτι ὁ ⸀παθὼν σαρκὶ πέπαυται ⸀ἁμαρτίας,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/001.yaml
  text: Therefore[a], since the Messiah suffered in the flesh, you also arm yourselves with the same mindset, because the one who has suffered in the flesh has ceased from sin[c][b],
translation:
  language: zh_hans
  text: 所以，既然基督[a]在肉身[b]受过苦，你们也要以同样的心志武装自己，因为在肉身受过苦的人已经与罪断绝了[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “基督”意为“弥赛亚”，即受膏者；希腊文为Christos。
    reason: lexical_alternative
  - marker: b
    text: “在肉身”直译希腊文sarx，在这里指有身体的人类生存状态，并不必然表示“罪性”。
    reason: lexical_alternative
  - marker: c
    text: “在肉身受过苦的人已经与罪断绝了”所指为何，历来有不同理解：可能专指基督，也可能指依循他受苦道路的信徒，或表达受苦标志着人与罪恶生活决然断绝的一般原则。原文没有明确限定。
    reason: alternative_reading
lexical_decisions:
- source_word: Χριστοῦ
  choice: 基督
  rationale: 采用现代汉语中通行且庄重的称号“基督”；这里是属格，与分词共同构成“既然基督……受过苦”。脚注说明其称号含义为“弥赛亚”。
- source_word: οὖν
  choice: 所以
  rationale: 承接上文并引出推论；“所以”在现代汉语中自然清楚。
- source_word: παθόντος
  choice: 受过苦
  rationale: 以“既然……受过苦”表达不定过去时分词在此兼具的时序和因由意味，也保留已发生之受苦的语感。
- source_word: σαρκὶ
  choice: 在肉身
  rationale: 保留σάρξ的具体表达及本节两次出现的呼应，所指是有身体的人类生存状态，并非必然指“罪性”。
- source_word: ἔννοιαν
  choice: 心志
  rationale: 兼顾思想、态度和决意；比单纯“想法”更符合劝勉语境，也能自然地与“武装自己”搭配。
- source_word: ὁπλίσασθε
  choice: 武装自己
  rationale: 保留中间语态的反身意味及鲜明的军事比喻。
- source_word: ὅτι
  choice: 因为
  rationale: 明确表达后一句为前面命令所提供的理由。
- source_word: ὁ παθὼν
  choice: 受过苦的人
  rationale: 保留实词化分词的概括性，不在正文中限定其专指基督或信徒。
- source_word: πέπαυται ἁμαρτίας
  choice: 已经与罪断绝了
  rationale: 以自然而庄重的汉语表达完成时所强调的持续结果，并保留单数“罪”作为一种领域、权势或生活方式的可能含义；脚注交代整句的解释争议。
theological_decisions:
- issue: “在肉身受过苦的人已经与罪断绝了”的指代和含义
  choice: 正文维持概括性的“受过苦的人”，不限定所指，并直陈“已经与罪断绝了”。
  alternative: 可理解为专指基督；也可理解为跟随基督受苦的信徒；或视为关于受苦使人决然脱离罪恶生活的一般原则。
  rationale: 希腊文表述凝练，指代及论证方式存在真实歧义。译文不添加“信徒”“因此不再犯罪”等解释性成分，以免消除原文的神学张力。
translation_notes:
  register: 采用现代、庄重且适合公开诵读的标准普通话。“心志”和“武装自己”保留劝勉的力度与军事比喻；两次“在肉身”均予保留，以呈现原文的重复和论证联系。
