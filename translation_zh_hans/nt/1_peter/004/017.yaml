  text: ὅτι ὁ καιρὸς τοῦ ἄρξασθαι τὸ κρίμα ἀπὸ τοῦ οἴκου τοῦ θεοῦ· εἰ δὲ πρῶτον ἀφ’ ἡμῶν, τί τὸ τέλος τῶν ἀπειθούντων τῷ τοῦ θεοῦ εὐαγγελίῳ;
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/017.yaml
  text: For it is time for judgment to begin from the household of God[a]; and if it begins first from us[c][b], what will be the outcome for those who disobey the gospel of God?
translation:
  language: zh_hans
  text: 因为时候到了，审判要从神的家[a]开始；如果先从我们开始，那些不顺从[c]神的福音的人，结局[b]将会怎样呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “家”也可译作“房屋”或“家中的人”。原文的词既可指房屋，也可指家中的人；这里因下文说“从我们开始”，主要是指神的子民。
    reason: lexical_alternative
  - marker: b
    text: “结局”也可译作“终局”或“结果”。
    reason: lexical_alternative
  - marker: c
    text: “不顺从”也可译作“拒绝相信”；原文的词在回应福音的语境中可兼有不服从和不信的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 本句承接上文并说明缘由；“因为”自然地表达因果关系。
- source_word: ὁ καιρός
  choice: 时候到了
  rationale: καιρός指合宜或指定的时刻，而非单纯的计时；“时候到了”在现代汉语中自然，并保留时机已经来临的意味。
- source_word: τοῦ ἄρξασθαι τὸ κρίμα
  choice: 审判要……开始
  rationale: 以自然汉语表达带冠词不定式与καιρός的关系，同时保留“审判开始”的核心语义。
- source_word: κρίμα
  choice: 审判
  rationale: 该词在此指神施行判断与处置，不宜窄化为定罪，也不宜弱化为管教；“审判”保留原文的严肃性与张力。
- source_word: ἀπὸ τοῦ οἴκου τοῦ θεοῦ
  choice: 从神的家
  rationale: “家”既可指居所，也可指家中的群体，与οἶκος的语义幅度相近；下文“从我们开始”表明这里主要指神的子民。
- source_word: εἰ δὲ πρῶτον ἀφ’ ἡμῶν
  choice: 如果先从我们开始
  rationale: 补出上句已有的“开始”，使汉语完整；“如果”保留εἰ的条件表达，“从我们”保留重复出现的ἀπό。
- source_word: τέλος
  choice: 结局
  rationale: τέλος可指终局、结果或结局；“结局”既保留终末色彩，也适合本句询问最终结果的语境。
- source_word: ἀπειθούντων
  choice: 不顺从
  rationale: 该词在回应福音的语境中兼有悖逆与不信的意味；正文用“不顺从”保留其直接的动词性含义，并以脚注提示另一语义侧面。
- source_word: τῷ τοῦ θεοῦ εὐαγγελίῳ
  choice: 神的福音
  rationale: 简洁保留属格关系，可理解为属于神、出于神的福音；也是自然庄重的现代汉语表达。
theological_decisions:
- issue: κρίμα临到神家之人的性质
  choice: 译为“审判”，不明确限定为定罪或管教
  alternative: “定罪”或“管教”
  rationale: “定罪”会过度规定神子民所受审判的性质，“管教”则可能削弱其司法性的严肃意味；“审判”保留经文中神先从自己家开始施行判断的张力。
- issue: “神的家”的所指
  choice: 正文译为“神的家”，理解上主要指神的子民
  alternative: 专指圣殿或建筑物
  rationale: 紧接着的“从我们开始”把“神的家”与作者及信徒群体相连；同时正文保留“家”的意象，不把隐喻完全解释掉。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“时候到了”自然表达指定时刻已经来临；“神的家”保留原文家庭／房屋意象，并由脚注说明其群体含义。反问句以“将会怎样呢”呈现原文的严肃语气。
