id: 1PE.4.2
reference: 1 Peter 4:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἰς τὸ μηκέτι ἀνθρώπων ἐπιθυμίαις ἀλλὰ θελήματι θεοῦ τὸν ἐπίλοιπον ἐν σαρκὶ βιῶσαι χρόνον.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/002.yaml
  text: so as to live the rest of his time in the flesh no longer for human desires[a], but for the will of God.
translation:
  language: zh_hans
  text: 好使他在肉身中[a]度过余下的光阴，不再随从人的欲望，而是遵从上帝的旨意。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在身体中”。这里“在肉身中”指人在世上有身体的生活，并不必然指“罪性”。
    reason: 说明ἐν σαρκὶ的词义范围，并保留“肉身／身体”的翻译选择，防止神学上的过度解读。
lexical_decisions:
- source_word: εἰς τὸ
  choice: 好使
  rationale: 介词加带冠词的不定式承接上一节，表达目的或结果；“好使”在现代汉语中自然地保留这种承接和目的意味。
- source_word: μηκέτι
  choice: 不再
  rationale: 准确表达先前行为模式从此停止。
- source_word: ἀνθρώπων ἐπιθυμίαις
  choice: 随从人的欲望
  rationale: ἀνθρώπων是泛指人类，并非仅指男性；ἐπιθυμίαις泛指欲望，不宜缩窄为性欲。“随从”表达这些欲望支配生活取向的含义。
- source_word: ἀλλὰ θελήματι θεοῦ
  choice: 而是遵从上帝的旨意
  rationale: ἀλλά构成强烈对比；与前一与格短语平行，表示余生所遵循的目标或准则。“遵从”使汉语对比清楚，同时不把上帝的旨意误解为行为发生的工具。
- source_word: τὸν ἐπίλοιπον ... χρόνον
  choice: 余下的光阴
  rationale: 指一个人在今世尚存的时间；“余下的光阴”简洁、庄重，也符合单数语境。
- source_word: ἐν σαρκὶ
  choice: 在肉身中
  rationale: 保留σάρξ的字面意象；此处指有身体的尘世生命，并不必然表示“罪性”。以脚注说明，避免读者误解。
- source_word: βιῶσαι
  choice: 度过
  rationale: 该动词与表示时间的宾语连用，意为生活、度过一段人生；汉语用“度过余下的光阴”比直译“活余下的时间”更自然。
theological_decisions:
- issue: ἐν σαρκὶ中σάρξ的含义
  choice: 肉身，即有身体的尘世生命
  alternative: 罪性
  rationale: 上下文谈的是人在世上余下的生命。虽然经文把过去的罪恶生活与如今遵行上帝旨意的生活相对照，但该短语本身并未把σάρξ界定为内在的“罪性”。译文保留“肉身”，并用脚注澄清。
- issue: 人的欲望与上帝旨意之间的关系
  choice: 译为两种彼此对立的生活取向：“随从……而是遵从……”
  alternative: 把与格理解为单纯的工具意义，即“借着人的欲望／借着上帝的旨意”
  rationale: 两个与格短语由ἀλλά对举，最自然地表示生活所受支配的目标或准则，而非行为的工具。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“好使”承接上一节；“度过余下的光阴”自然表达有限的今世余生；“随从……遵从……”清楚呈现原文的强烈对比。脚注标记紧跟其所解释的“在肉身中”。
