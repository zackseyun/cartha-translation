id: 1PE.4.11
reference: 1 Peter 4:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἴ τις λαλεῖ, ὡς λόγια θεοῦ· εἴ τις διακονεῖ, ὡς ἐξ ἰσχύος ⸀ἧς χορηγεῖ ὁ θεός· ἵνα ἐν πᾶσιν δοξάζηται ὁ θεὸς διὰ Ἰησοῦ Χριστοῦ, ᾧ ἐστιν ἡ δόξα καὶ τὸ κράτος εἰς τοὺς αἰῶνας τῶν αἰώνων· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/011.yaml
  text: If anyone speaks[a], let it be as the utterances of God; if anyone serves, let it be from the strength that God supplies, so that in everything God may be glorified through Jesus the Messiah, to whom belong the glory and the dominion forever and ever[e][d][c][b]. Amen.
translation:
  language: zh_hans
  text: 若有人讲说，就要像传讲上帝的圣言[a]；若有人服侍，就要靠上帝所供应的力量[b]；好使上帝在一切事上，借着耶稣弥赛亚得荣耀。荣耀和权能都归给他，直到永永远远[c][d]。阿们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣言”也可译作“神圣的宣告”。希腊词 λόγια 指上帝所发出的言语或神谕。
    reason: lexical_alternative
  - marker: b
    text: 较直译：“就要像是出于上帝所供应的力量。”
    reason: formal_alternative
  - marker: c
    text: “归给他”按语法上最近的先行词，最自然是指耶稣弥赛亚；但因前句说上帝借着耶稣弥赛亚得荣耀，也有人理解为指上帝。
    reason: alternative_reading
  - marker: d
    text: 直译：“直到世世代代的世代。”这是表示永无穷尽的说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλεῖ
  choice: 讲说
  rationale: 泛指以言语服侍，不把含义限缩为讲道；“讲说”也适合本节较庄重的劝勉语体。
- source_word: λόγια θεοῦ
  choice: 上帝的圣言
  rationale: λόγια 指来自上帝、具有神圣权威的言语。“圣言”比普通的“话语”更能保留其庄重意味，同时正文不武断声称每位说话者的话都直接受默示。
- source_word: διακονεῖ
  choice: 服侍
  rationale: 涵盖广义的服务和事奉，不限于正式教会职分。
- source_word: ὡς ἐξ ἰσχύος ἧς χορηγεῖ ὁ θεός
  choice: 就要靠上帝所供应的力量
  rationale: ἐξ 表明力量的来源；现代汉语用“靠”自然表达服侍所倚赖的力量来自上帝。脚注保留较贴近形式的译法。
- source_word: ἐν πᾶσιν
  choice: 在一切事上
  rationale: 保留原文宽广而概括的范围。
- source_word: δοξάζηται
  choice: 得荣耀
  rationale: 自然表达被动意义，并与 ἵνα 所引出的目的相合。
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: 借着耶稣弥赛亚
  rationale: διά 表达中介；Χριστός 在此作为称号，译作“弥赛亚”。
- source_word: κράτος
  choice: 权能
  rationale: 在颂赞语境中指有统治效力的大能；“权能”既庄重，也避免仅译作一般的“力量”。
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: 直到永永远远
  rationale: 以自然、传统而易懂的汉语表达无尽的时间。
theological_decisions:
- issue: 两处 ὡς 的劝勉语气
  choice: 分别译为“就要像……”和“就要靠……”
  alternative: 更省略地译为“若有人讲说，要如同上帝的圣言；若有人服侍，要如同出于……力量”
  rationale: 希腊文比较结构较为省略，汉语需要补出劝勉关系；“就要”没有增加新的命令内容，而是清楚呈现语用功能。第二处用“靠”自然表达 ἐξ 所指的来源。
- issue: 颂赞中 ᾧ（“归给他”）的所指
  choice: 正文保留男性单数代词“他”，按最近的先行词可理解为耶稣弥赛亚
  alternative: 也可理解为前句所说的上帝，或视为一种紧凑表达，使颂赞与“上帝借着耶稣弥赛亚得荣耀”相连
  rationale: 语法上最近的先行词是“耶稣弥赛亚”，但前一分句的中心是上帝得荣耀。正文不添写具体称谓，脚注说明两种理解，以保留原文的张力。
- issue: 说话者与“上帝的圣言”的关系
  choice: 译作“像传讲上帝的圣言”
  alternative: 译作“要如同上帝的圣言”或“要讲上帝的圣言”
  rationale: ὡς 表示说话应与上帝的圣言相称；加入“传讲”使汉语明确而自然，同时避免把所有说话者的话直接等同于上帝的启示。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“上帝”保持人民开放圣经的称谓风格；“弥赛亚”保留 Χριστός 的称号性质。句式尽量紧随原文两组条件句、目的句和颂赞的结构，又避免生硬的欧化表达。
