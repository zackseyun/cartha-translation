  text: πρὸ ⸀πάντων τὴν εἰς ἑαυτοὺς ἀγάπην ἐκτενῆ ἔχοντες, ὅτι ἀγάπη ⸀καλύπτει πλῆθος ἁμαρτιῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/008.yaml
  text: Above all[a], maintain fervent love for one another[c][b], because love covers a multitude of sins.
translation:
  language: zh_hans
  text: 最要紧的是，你们要彼此热切[a]相爱[c]，因为爱能遮盖许多罪[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “热切”也可译作“恳切”或“恒切”。
    reason: lexical_alternative
  - marker: b
    text: 这句话呼应《箴言》10:12。“遮盖”也可理解为不张扬过犯、不挑起纷争，但原文保留了较宽泛的比喻。
    reason: cross_reference
  - marker: c
    text: 较贴近原文结构可译作：“要持守彼此间热切的爱。”
    reason: previous_rendering
lexical_decisions:
- source_word: πρὸ πάντων
  choice: 最要紧的是
  rationale: 这是表示优先性和首要地位的惯用语，并非单指时间上的“在万事以前”；此译自然地保留劝勉的强调语气。
- source_word: εἰς ἑαυτοὺς
  choice: 彼此
  rationale: 在信徒群体的语境中，反身代词具有相互关系的含义；“彼此”简洁、清楚地表达群体成员之间的相爱。
- source_word: ἀγάπην
  choice: 相爱／爱
  rationale: 前半句结合汉语习惯译作动词“相爱”，后半句保留名词“爱”，既自然又维持原文关键词的重复。
- source_word: ἐκτενῆ
  choice: 热切
  rationale: 该词含有伸展、专注、恳切而持续的意味；“热切”兼顾强度和认真投入的语气，又是现代汉语常用表达。
- source_word: ἔχοντες
  choice: 要……相爱
  rationale: 这是承接上文劝勉的现在分词。汉语用“要”将其表达为劝勉，比机械译作“有着”更完整自然，同时不改变其持续性的语境。
- source_word: ὅτι
  choice: 因为
  rationale: 明确表达后一句为前述劝勉提供理由的因果关系。
- source_word: καλύπτει
  choice: 遮盖
  rationale: 保留原文“覆盖、遮盖”的比喻及其与《箴言》10:12的呼应，不把含义限定为隐瞒、宽容或使罪得赦免中的任何一种。
- source_word: πλῆθος
  choice: 许多
  rationale: 在“许多罪”这一汉语搭配中自然表达数量众多的集合意义，也保留原句的修辞力度。
- source_word: ἁμαρτιῶν
  choice: 罪
  rationale: 直接表达复数属格所指的众多罪行；汉语中“许多罪”已经清楚呈现复数意义。
theological_decisions:
- issue: “爱能遮盖许多罪”的含义
  choice: 保留“遮盖”的比喻，不界定这些罪究竟是别人对信徒所犯的罪，还是群体中更广泛的罪。
  alternative: 可解释为爱宽容许多过犯，或爱使许多罪得到赦免。
  rationale: 这句话带有箴言式的概括性和经文呼应，希腊文本本身没有强制限定为某一种神学解释。保留比喻可以避免加入原文未明说的功德性、圣礼性或纯心理性的理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“最要紧的是”自然表达首要性；“彼此热切相爱”避免生硬的名词结构，同时借助脚注保留更贴近希腊语分词和名词结构的译法。
