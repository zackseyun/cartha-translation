id: 1PE.4.19
reference: 1 Peter 4:19
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὥστε καὶ οἱ πάσχοντες κατὰ τὸ θέλημα τοῦ ⸀θεοῦ πιστῷ κτίστῃ παρατιθέσθωσαν τὰς ψυχὰς ⸀αὐτῶν ἐν ἀγαθοποιΐᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/019.yaml
  text: Therefore[a], let also those who suffer according to the will of God entrust their souls to a faithful Creator in doing good.
translation:
  language: zh_hans
  text: 所以，那些照着上帝旨意受苦的人，也要在行善中把自己的生命[a]交托给信实的造物主。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“自己的魂”或“自己”；希腊词可以指魂、生命或整个人。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: 所以
  rationale: 表示从上文得出的结论；“所以”自然清楚地保留推论作用。
- source_word: οἱ πάσχοντες
  choice: 那些……受苦的人
  rationale: 将名词化的现在分词译为一类正在或常常受苦的人，符合现代汉语表达。
- source_word: κατὰ τὸ θέλημα τοῦ θεοῦ
  choice: 照着上帝旨意
  rationale: 保留κατά所表达的符合、依照关系，不进一步断定这种受苦是上帝许可、命定还是以其他方式与其旨意相符。
- source_word: πιστῷ κτίστῃ
  choice: 信实的造物主
  rationale: πιστός在此强调可靠、可信；κτίστης指创造者。译为“信实的造物主”既庄重又自然，并明确所指为上帝。
- source_word: παρατιθέσθωσαν
  choice: 交托
  rationale: 该中间语态命令式表示把某物托付给另一位保守照管；“交托”简洁地传达信赖和托付。
- source_word: τὰς ψυχὰς αὐτῶν
  choice: 自己的生命
  rationale: ψυχή在这里可指生命、自身或魂；受苦语境中“生命”涵盖把整个人交由上帝保守之意，又避免现代读者将其误解为与身体截然分离的部分。其他可能含义列入脚注。
- source_word: ἐν ἀγαθοποιΐᾳ
  choice: 在行善中
  rationale: 较直接地保留ἐν结构，表示交托发生于持续行善的处境或方式之中。
theological_decisions:
- issue: 受苦与上帝旨意的关系
  choice: 照着上帝旨意受苦
  alternative: 由于上帝的旨意受苦；上帝许可之下受苦
  rationale: 原文只说明受苦与上帝旨意相符，并未细分许可、命定或认可等神学机制，因此保留其张力。
- issue: ψυχή在本节中的含义
  choice: 生命
  alternative: 魂；自己
  rationale: 此词语义可涵盖生命、魂或整个人。“生命”在受苦和交托的语境中自然，但不排除整个人或魂的含义，故以脚注保存歧义。
- issue: κτίστης的身份与πιστός的含义
  choice: 信实的造物主
  alternative: 可信靠的创造者
  rationale: 原文无冠词，但语境明确指上帝；“信实”保留其可靠、值得信赖的神学分量，而不加入特定宗派解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“照着”保留原文关系而不过度解释；“在行善中”略带书面色彩，但能清楚反映原文介词结构。
