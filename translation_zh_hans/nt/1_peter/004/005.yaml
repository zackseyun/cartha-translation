  yaml_path: translation/nt/1_peter/004/005.yaml
  text: They will give an account to the one who stands ready to judge the living and the dead[a].
translation:
  language: zh_hans
  text: 他们必向那位已准备好审判活人和死人的交账。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那位准备好审判活人和死人的。”希腊语的表达直译近于“那位已为审判准备妥当的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἳ
  choice: 他们
  rationale: 关系代词回指上一节所说的人；汉语另起一句用“他们”最自然，也能清楚承接所指对象。
- source_word: ἀποδώσουσιν λόγον
  choice: 必……交账
  rationale: 这一惯用语表示为自己的行为作出说明或承担交代；“交账”简洁自然，并保留审判语境中的问责意味。
- source_word: τῷ
  choice: 向那位……的
  rationale: 冠词与分词构成名词性表达；译作“那位……的”既符合现代汉语，也不在原文之外明确审判者的身份。
- source_word: ἑτοίμως ἔχοντι κρῖναι
  choice: 随时准备审判
  rationale: 原表达近于“具备审判的准备状态”，强调审判者已经准备就绪；“随时准备审判”自然地传达这种迫近且已就绪的意味。
- source_word: ζῶντας καὶ νεκρούς
  choice: 活人和死人
  rationale: 直接保留原文并列的两类对象及其广泛范围，措辞清楚而庄重。
theological_decisions:
- issue: “那位随时准备审判活人和死人的”所指身份
  choice: 正文保留“那位”，不明确补出上帝或基督
  alternative: 上帝；基督
  rationale: 本节希腊文本没有直接点明审判者。新约其他语境既谈上帝施行审判，也谈基督施行审判；因此不在译文中消除原文保留的张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“交账”保留司法问责意味；“随时准备”表达审判者已经就绪，并以脚注呈现较贴近形式的译法。
