  text: μὴ γάρ τις ὑμῶν πασχέτω ὡς φονεὺς ἢ κλέπτης ἢ κακοποιὸς ἢ ὡς ἀλλοτριεπίσκοπος·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/015.yaml
  text: For let none of you suffer as a murderer or a thief or an evildoer or as a meddler[a].
translation:
  language: zh_hans
  text: 因为你们中间不可有人因杀人、偷窃、作恶，或因多管闲事[a]而受苦。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“好管闲事”；较直译为“监督他人事务的人”，指越界干涉不属于自己管的事务。
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ γάρ
  choice: 因为……不可
  rationale: μὴ与第三人称命令式构成禁令，译作“不可”；γάρ保留为“因为”，承接上文的解释关系。
- source_word: τις ὑμῶν
  choice: 你们中间……有人
  rationale: 保留τις的个体意味和ὑμῶν的部分属格关系；与否定词“不可”结合，自然表达“你们中间不可有人”。
- source_word: πασχέτω
  choice: 受苦
  rationale: πάσχω泛指遭受苦难；本节未明说是刑罚，因此不增译为“受惩罚”。
- source_word: ὡς φονεὺς ἢ κλέπτης ἢ κακοποιός
  choice: 因杀人、偷窃、作恶
  rationale: ὡς说明受苦所依据的身份或行为。汉语用“因”更自然地表达“作为犯这些事的人而受苦”；三个名词依次用行为性表达，简洁且保持罪行类别。
- source_word: ἀλλοτριεπίσκοπος
  choice: 好管闲事
  rationale: 这是罕见复合词，字面涉及“察管别人的事”，在此负面地指越界干预不属于自己的事务。“好管闲事”是现代汉语中自然且明确的对应表达。
theological_decisions:
- issue: ἀλλοτριεπίσκοπος的含义
  choice: 好管闲事
  alternative: 干涉别人的事务；多管闲事
  rationale: 上下文列举会使受苦成为咎由自取的行为，因此采用表示不当越界干预的译法；脚注保留其罕见性与较直译含义，不从词尾ἐπίσκοπος引入教会职分含义。
- issue: ὡς与受苦原因的关系
  choice: 因杀人、偷窃、作恶……而受苦
  alternative: 作为杀人犯、盗贼、作恶者……受苦
  rationale: “因……而受苦”符合现代汉语表达，也准确传达ὡς在此所标示的受苦身份或依据；不把πάσχω限定为司法惩罚。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“不可有人……而受苦”保留劝诫语气；“杀人、偷窃、作恶”以并列动词呈现，避免连续身份名词造成生硬。“好管闲事”虽属常用语，但语义明确，脚注补充罕见原词的字面构成与范围。
