  yaml_path: translation/nt/1_peter/004/009.yaml
  text: Be hospitable to one another without grumbling[a].
translation:
  language: zh_hans
  text: 要彼此热情接待，不发怨言。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“要彼此款待，不抱怨。”
    reason: 词汇上可将 φιλόξενοι 译为“款待”，将 γογγυσμοῦ 译为“抱怨”；此译法较直接地突出接待行动和不满情绪。
lexical_decisions:
- source_word: φιλόξενοι
  choice: 热情接待
  rationale: 该形容词在上下文中具有命令语气，指乐意款待、接待他人。译作“要……热情接待”既传达劝勉的语气，也比单用“好客”更自然地表达彼此之间的实际行动。
- source_word: εἰς ἀλλήλους
  choice: 彼此
  rationale: 表达群体成员之间相互的指向；“彼此”简洁自然，准确保留互惠含义。
- source_word: ἄνευ
  choice: 不
  rationale: 在本句中表示排除或没有某种伴随态度；汉语用“不发怨言”比直译“没有怨言”更自然。
- source_word: γογγυσμοῦ
  choice: 发怨言
  rationale: 该词指因不满而低声抱怨或埋怨。“发怨言”保留其不满、抱怨的语义，也符合现代中文的圣经语体。
