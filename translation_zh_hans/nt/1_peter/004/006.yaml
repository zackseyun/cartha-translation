revisions:
- from: 正因如此，福音也曾传给死者，为要使他们虽然在肉身中按人[a]受审判，却在灵里[b]照着神而活。
  to: 正因如此，福音也曾传给死者，为要使他们虽然在肉身中按人的标准[a]受审判，却在灵里[b]按着神而活。
  rationale: 仅作小幅语言修订。“按人的标准”使中文表达明确自然，同时由脚注保留原文可指人的角度这一歧义；“按着神而活”改善原译的搭配，并不把κατὰ θεόν限定为神的旨意、神的审判或圣灵的能力。其余措辞保留，以维持原文关于死者、审判及肉身／灵之关系的解释开放性。
