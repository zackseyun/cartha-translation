id: 1PE.4.6
reference: 1 Peter 4:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἰς τοῦτο γὰρ καὶ νεκροῖς εὐηγγελίσθη ἵνα κριθῶσι μὲν κατὰ ἀνθρώπους σαρκὶ ζῶσι δὲ κατὰ θεὸν πνεύματι.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/006.yaml
  text: 'For this is why the gospel was also proclaimed to the dead: so that[a], though judged according to men in the flesh[b], they might live according to God in the spirit.'
translation:
  language: zh_hans
  text: 正因如此，福音也曾传给死者，为要使他们虽然在肉身中按人的标准[a]受审判，却在灵里[b]按着神而活。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“从人的角度”或较直译地说“按人”。原文与后面的“按着神”相对。
    reason: lexical_alternative
  - marker: b
    text: “在灵里”也可译作“在灵方面”。这可指与“在肉身中”相对的生命领域；也有人理解为“靠着圣灵”。
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς τοῦτο γὰρ
  choice: 正因如此
  rationale: 以自然的现代汉语表达承接上文的解释和因果关系，同时保留“为此／为这个目的”的语意空间。
- source_word: νεκροῖς
  choice: 死者
  rationale: 将作名词使用的与格复数形容词直接译出；“死者”庄重自然，也不限定他们是在何时或以何种意义为死者。
- source_word: εὐηγγελίσθη
  choice: 福音也曾传给
  rationale: 保留被动含义和宣告好消息的意义；“曾”体现不定过去时所指的既成事件，但不额外确定宣讲发生的具体时间。
- source_word: ἵνα
  choice: 为要使
  rationale: 明确表达目的或预期结果。
- source_word: κριθῶσι μὲν ... ζῶσι δὲ
  choice: 虽然……受审判，却……而活
  rationale: 以汉语的让步对照结构自然呈现 μὲν…δὲ 的鲜明反差，同时保留两个动词处于 ἵνα 所引目的结构之下。
- source_word: κατὰ ἀνθρώπους
  choice: 按人
  rationale: 贴近原文，并与后面的“照着神”形成平行对照；脚注说明它也可表达人的标准或视角。
- source_word: σαρκὶ
  choice: 在肉身中
  rationale: 保留 σάρξ 的身体性和与 πνεύματι 的对照，不误译为“罪性”；此处表达受审判所在的肉身生命领域。
- source_word: κατὰ θεὸν
  choice: 照着神
  rationale: 保留其与“按人”的刻意平行和原文简洁性，不擅自限定为神的标准、眼光或方式。
- source_word: πνεύματι
  choice: 在灵里
  rationale: 按与“在肉身中”相对的领域或层面来译；原文没有明说是圣灵，因此正文不以“圣灵”消除歧义。
theological_decisions:
- issue: “死者”的身份
  choice: 仅译为“死者”，不说明他们听见福音时是否已经肉身死亡，也不将其解释为灵性死亡。
  alternative: 可理解为如今已死、在世时听过福音的人；灵性上的死人；或与3:19所述宣告相关的死者。
  rationale: 原文本身没有在本节界定其身份；保持中性可避免把有争议的时间次序或死后宣讲教义写入正文。
- issue: “在肉身中按人受审判”与“在灵里照着神而活”的关系
  choice: 保留肉身／灵和人／神的双重对照，并用“虽然……却……”呈现其反差。
  alternative: 可理解为按人的标准在肉身生活中被定罪、承受众人共有的肉身死亡，或在肉身方面受神审判而在灵里活着。
  rationale: 希腊文允许若干紧密相关但不同的解释；正文不明确审判者，也不将“受审判”专指人的定罪、肉身死亡或神的审判。
- issue: πνεύματι 是否明确指圣灵
  choice: 译为“在灵里”，不加“圣”字。
  alternative: “靠着圣灵而活”或“在圣灵里活着”。
  rationale: 无冠词的 πνεύματι 在此与 σαρκὶ 平行，较自然地表示生命的领域或层面；然而圣灵性的理解仍有可能，故列入脚注而不在正文定论。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“福音”“肉身”“灵”等为普通读者熟悉的经文用语；句式保留原文的人／神、肉身／灵两组平行对照，不加入宗派性解释。
