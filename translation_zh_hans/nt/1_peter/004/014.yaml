  text: εἰ ὀνειδίζεσθε ἐν ὀνόματι Χριστοῦ, μακάριοι, ὅτι τὸ τῆς δόξης καὶ τὸ τοῦ θεοῦ πνεῦμα ἐφ’ ὑμᾶς ⸀ἀναπαύεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/014.yaml
  text: If you are insulted in the name of Messiah[a], you are blessed[b], because the Spirit of glory and of God rests upon you.
translation:
  language: zh_hans
  text: 你们若因弥赛亚的名[a]受辱，便是有福的，因为荣耀的灵、上帝的灵[b]安息在你们身上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弥赛亚”原文为 Χριστός，也常译作“基督”；这里按称号译出。
    reason: lexical_alternative
  - marker: b
    text: 这一短语也可译作“上帝荣耀的灵”；或译作“荣耀的灵，就是上帝的灵”。
    reason: alternative_reading
lexical_decisions:
- source_word: ὀνειδίζεσθε
  choice: 受辱
  rationale: 这个现在时被动形式表示遭受辱骂、毁谤或羞辱。“受辱”简洁自然，并保留原文所含的言语攻击和社会羞耻意味。
- source_word: ἐν ὀνόματι Χριστοῦ
  choice: 因弥赛亚的名
  rationale: 这里的介词短语表示因与弥赛亚的名和身份相联而受苦；“因……的名”既表达缘由，也保留原文“名”的措辞。
- source_word: Χριστοῦ
  choice: 弥赛亚
  rationale: Χριστός在这里具有称号的作用。“弥赛亚”显明其“受膏者”的称号含义，而不只把它当作姓名。
- source_word: μακάριοι
  choice: 有福的
  rationale: “有福”符合圣经祝福宣告的语体，表达来自上帝的福分，不仅是主观的快乐或世俗意义上的幸运。
- source_word: τὸ τῆς δόξης καὶ τὸ τοῦ θεοῦ πνεῦμα
  choice: 那荣耀的、上帝的灵
  rationale: 以两个并列的“的”结构对应原文重复冠词和两个属格的压缩表达，尽量不武断判定二者是并列修饰，还是后者对前者的解释。脚注列出其他可行理解。
- source_word: δόξης
  choice: 荣耀
  rationale: “荣耀”是 δόξα 在神圣临在语境中的常用译法，也保留其圣经神学内涵。
- source_word: ἀναπαύεται
  choice: 安息在……身上
  rationale: 该动词表示停驻、歇息；“安息在……身上”既贴近原文，也呼应圣灵停驻在人身上的先知性用语。
theological_decisions:
- issue: 如何理解 τὸ τῆς δόξης καὶ τὸ τοῦ θεοῦ πνεῦμα
  choice: 正文译为“那荣耀的、上帝的灵”，保留两个属格表达的并置。
  alternative: 可理解为“上帝荣耀的灵”，或“荣耀的灵，就是上帝的灵”。
  rationale: 原文句法紧凑，既可把“荣耀的”和“上帝的”看作共同修饰“灵”，也可把后一表达视为解释前一表达。正文不以解释性同位语消除这一张力，脚注说明主要可能。
- issue: Χριστός作为称号还是名称
  choice: 译作“弥赛亚”。
  alternative: 译作“基督”。
  rationale: 本节的“名”强调其身份，Χριστός的称号功能较为突出；“弥赛亚”在现代汉语中能更清楚显示“受膏者”的身份含义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“受辱”“有福”“安息在……身上”简明易懂，同时保持经文语体。“那荣耀的、上帝的灵”略带原文式的压缩感，目的是保留希腊文结构中的真实歧义，并以脚注帮助普通读者理解。
