  text: ἀλλὰ καθὸ κοινωνεῖτε τοῖς τοῦ Χριστοῦ παθήμασιν χαίρετε, ἵνα καὶ ἐν τῇ ἀποκαλύψει τῆς δόξης αὐτοῦ χαρῆτε ἀγαλλιώμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/013.yaml
  text: But insofar as you share in the sufferings of Messiah[a], rejoice[b], so that at the revelation of his glory you may also rejoice with exultation.
translation:
  language: zh_hans
  text: 反倒，要按你们有分于弥赛亚[a]苦难的程度欢喜，好叫你们在他荣耀显现[b]的时候，也能欢喜雀跃。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“基督”。希腊语Χριστός意为“受膏者”，在这里用作称号。
    reason: 称号的传统译名与意义说明
  - marker: b
    text: “显现”也可译作“揭示”或“显露”。这里指他的荣耀被公开显明。
    reason: 词义替代译法
lexical_decisions:
- source_word: καθὸ
  choice: 因你们……有分
  rationale: καθό在这里说明欢喜的根据，并带有“在……范围内／到……程度”的意味。汉语用“因……而”自然地表达逻辑关系，同时不把受苦本身说成救赎功劳。
- source_word: κοινωνεῖτε
  choice: 有分
  rationale: “有分”简洁保留共同参与之意，比“同受”更能避免把具体参与方式限定得过窄。
- source_word: τοῖς τοῦ Χριστοῦ παθήμασιν
  choice: 弥赛亚的苦难
  rationale: 保留属格结构的开放性，既不将其改写为单纯“为弥赛亚受苦”，也不暗示信徒重复其独特的救赎苦难。
- source_word: Χριστοῦ
  choice: 弥赛亚
  rationale: 此处Χριστός具有称号作用；“弥赛亚”传达“受膏者”的身份含义。
- source_word: χαίρετε
  choice: 要……欢喜
  rationale: 用命令式“要”表达劝令，并以“欢喜”保持庄重而通俗的语体。
- source_word: ἵνα
  choice: 好使
  rationale: 表达希腊文可兼具目的与结果色彩的从句关系，不将二者过度细分。
- source_word: ἐν τῇ ἀποκαλύψει τῆς δόξης αὐτοῦ
  choice: 在他的荣耀显现时
  rationale: “显现”自然表达荣耀由隐藏到公开可见的揭示，并保留其未来指向。
- source_word: χαρῆτε ἀγαλλιώμενοι
  choice: 能欢喜雀跃
  rationale: “欢喜”呼应前面的χαίρετε，“雀跃”传达ἀγαλλιάω所含的强烈、洋溢的喜乐。
theological_decisions:
- issue: Χριστός的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 按称号翻译，以呈现其犹太弥赛亚背景；脚注列出汉语基督教传统中更熟悉的译称。
- issue: 信徒参与弥赛亚苦难的性质
  choice: 在弥赛亚的苦难上有分
  alternative: 与弥赛亚一同受苦；为弥赛亚受苦
  rationale: 原文表达参与关系，却没有在本句中明确界定这种参与的全部性质；因此不将其限定为同一性质的苦难或仅仅为他受苦。
- issue: ἵνα从句的目的或结果关系
  choice: 好使
  alternative: 以致
  rationale: “好使”保留目的导向，同时不排除结果意味，避免过度解决原文的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“反倒”承接ἀλλά的强转折；“欢喜雀跃”既保留两个相关的喜乐词，又避免生硬的“欢喜且狂喜”。脚注标记均置于对应词语之后。
