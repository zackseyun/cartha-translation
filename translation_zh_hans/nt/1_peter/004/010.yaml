  text: ἕκαστος καθὼς ἔλαβεν χάρισμα, εἰς ἑαυτοὺς αὐτὸ διακονοῦντες ὡς καλοὶ οἰκονόμοι ποικίλης χάριτος θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/010.yaml
  text: As each has received a gift[a], use it in serving one another as good stewards of God’s varied grace.
translation:
  language: zh_hans
  text: 各人要照着所领受的恩赐，用它彼此服事，作上帝百般恩典的好管家。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕκαστος
  choice: 各人
  rationale: 保留分配性的单数含义，强调群体中的每一个人；现代汉语自然简洁。
- source_word: καθὼς ἔλαβεν
  choice: 既然领受了
  rationale: καθὼς在这里把领受恩赐的事实与随后的服事劝勉联系起来；“既然”符合汉语劝勉语境，“领受了”保留主动形式和既成事实。
- source_word: χάρισμα
  choice: 恩赐
  rationale: 既表达与恩典有关的礼物，也避免把含义限定为某一狭义、技术性的“属灵恩赐”。
- source_word: εἰς ἑαυτοὺς
  choice: 彼此
  rationale: 复数反身代词在群体语境中具有相互指向，表示服事的对象是群体中的其他成员；“彼此”是自然且简明的现代汉语表达。
- source_word: αὐτὸ διακονοῦντες
  choice: 就要用它……服事
  rationale: 分词在上下文中带劝勉力量；补出“就要用它”能在汉语中清楚表明恩赐是服事的媒介，而不赋予διακονέω教职化含义。
- source_word: καλοὶ οἰκονόμοι
  choice: 好管家
  rationale: “管家”保留受托管理主人资源及须负责任的意象；“好”准确保留καλοί宽广的褒义，而不擅自收窄为“忠心”。
- source_word: ποικίλης χάριτος θεοῦ
  choice: 上帝百般恩典
  rationale: “百般”自然表达ποικίλης所指恩典形式多样、丰富多元；属格译为“上帝……的”，保留恩典源于并属于上帝的关系。
theological_decisions:
- issue: χάρισμα是否应窄化为“属灵恩赐”
  choice: 恩赐
  alternative: 属灵恩赐；恩典的礼物
  rationale: 原词确指由恩典而来的礼物，但本身不要求狭义技术含义。“恩赐”既保留恩典色彩，也让上下文界定其用于群体服事。
- issue: εἰς ἑαυτούς的群体指向如何表达
  choice: 彼此
  alternative: 在你们中间；为彼此；向彼此
  rationale: 这里的复数反身形式指同一信徒群体内的受益者。汉语“彼此服事”自然体现相互和群体内的关系；“在你们中间”较易只被理解为服事发生的地点。
- issue: οἰκονόμοι所含责任意象
  choice: 管家
  alternative: 管理者
  rationale: “管家”保留受主人托付、代管不属于自己的资源这一比喻，也不额外加入经文未明说的制度或职分含义。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“上帝”作为θεός的通用译法；句式保留从领受恩赐到彼此服事、再到管家身份的逻辑推进。
