  text: Ἀγαπητοί, μὴ ξενίζεσθε τῇ ἐν ὑμῖν πυρώσει πρὸς πειρασμὸν ὑμῖν γινομένῃ ὡς ξένου ὑμῖν συμβαίνοντος,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/012.yaml
  text: Beloved[a], do not be surprised at the fiery trial among you that is happening to test you, as though something strange were happening to you.
translation:
  language: zh_hans
  text: 亲爱的，不要因那在你们中间发生、为要考验你们的火炼[a]而感到惊奇，好像有怪事临到你们似的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “火炼”也可译作“如火般的试炼”或“烈火般的考验”。原文πύρωσις带有燃烧、火炼的意象；“考验”（πειρασμός）也可指试炼，在其他语境中还可指诱惑。
    reason: 保留πύρωσις的火焰意象及πειρασμός的词义范围。
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: 亲爱的弟兄姊妹
  rationale: 这是复数呼格，用作充满关爱的牧养性称呼。按本书信所面对的信徒群体译为“亲爱的弟兄姊妹”，自然传达其亲密语气；原词本身没有性别限定。
- source_word: μὴ ξενίζεσθε
  choice: 不要……惊讶
  rationale: ξενίζομαι在这里表示因某事陌生、出乎意料而惊讶；“不要惊讶”是自然的现代汉语，并与后文“怪事”形成语义呼应。
- source_word: τῇ ἐν ὑμῖν πυρώσει
  choice: 你们中间发生如火般的考验
  rationale: πύρωσις本义涉及燃烧或火炼，在这里比喻信徒群体正在经历的严酷患难。“如火般”保留火的意象，“你们中间”体现ἐν ὑμῖν较可能的群体含义。
- source_word: πρὸς πειρασμὸν ὑμῖν γινομένῃ
  choice: 这是要试炼你们
  rationale: πειρασμός可指试验、考验或诱惑；在受苦的上下文中，重点是患难对信徒的检验，而非引诱犯罪。用目的表达使汉语清楚，同时保留试炼观念。
- source_word: ὡς ξένου ὑμῖν συμβαίνοντος
  choice: 不要以为临到你们的是怪事
  rationale: ξένος在此指陌生、反常或出乎意料之事；“怪事”简洁自然，并与前面的“惊讶”传达原文重复使用同一词根的修辞联系。συμβαίνω译作“临到”符合患难发生在人身上的语境。
theological_decisions:
- issue: πειρασμός在本节中的性质
  choice: 试炼、考验
  alternative: 诱惑
  rationale: 本节及相邻经文讨论因基督之名受苦，语境充分支持“检验性的患难”，而不是内在犯罪诱惑。
- issue: 火的意象是否专指炼净
  choice: 保留“如火般”的意象，不明说炼净目的
  alternative: 炼净之火
  rationale: πύρωσις可以唤起火炼和严酷苦难，但本句没有明确限定为金属炼净过程；避免加入原文未明说的神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的书信语体。“亲爱的弟兄姊妹”传达牧养性的复数称呼；句中以分号分开劝诫与解释，避免汉语结构过重。脚注标记[a]已置于正文相关句末。
