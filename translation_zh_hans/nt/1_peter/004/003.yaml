language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἀρκετὸς ⸀γὰρ ὁ παρεληλυθὼς ⸀χρόνος τὸ ⸀βούλημα τῶν ἐθνῶν ⸀κατειργάσθαι, πεπορευμένους ἐν ἀσελγείαις, ἐπιθυμίαις, οἰνοφλυγίαις, κώμοις, πότοις, καὶ ἀθεμίτοις εἰδωλολατρίαις.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/003.yaml
  text: For the time that has passed is enough to have carried out the will of the Gentiles[a], having walked in sensualities, lusts, drunkenness, carousing, drinking parties[c][b], and lawless idolatries.
translation:
  language: zh_hans
  text: 因为过去的时间已经够你们随从外邦人的意愿而行了；你们曾生活在放荡[a]、私欲、酗酒[b]、狂欢宴乐、饮酒聚会和不法的[c]偶像崇拜之中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “放荡”也可译作“无耻的纵欲”；原词强调不受约束、毫不知耻的放纵。
    reason: lexical_alternative
  - marker: b
    text: “酗酒”也可译作“醉酒狂饮”；原文为复数形式，可指反复发生的醉酒行为。
    reason: lexical_alternative
  - marker: c
    text: “不法的”也可译作“不被准许的”；原词指违反应有规范、不可行之事。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρκετὸς γὰρ ὁ παρεληλυθὼς χρόνος
  choice: 因为过去的时间已经够……了
  rationale: 保留ἀρκετός“足够”的语义及γάρ的解释性衔接；用现代汉语句式表达已经过去的时期已然足够。
- source_word: τὸ βούλημα τῶν ἐθνῶν
  choice: 照外族人的心意
  rationale: βούλημα指意愿、意图；在彼得前书的语境中，τὰ ἔθνη指不属于犹太群体的外族人。译作“心意”保留其意愿义，不将其缩窄为单一欲望。
- source_word: κατειργάσθαι
  choice: 行事
  rationale: 该词表示实行、做成。中文以“照……心意行事”自然表达其实践含义；“已经够……了”结合上下文体现此前所行已经足够，无须生硬复制希腊语完成时不定式。
- source_word: πεπορευμένους
  choice: 那时你们生活在……之中
  rationale: πορεύομαι在伦理语境中表示生活、行事为人；译作“生活”比直译“行走”更符合现代汉语，同时保留持续生活方式的含义。
- source_word: ἐν ἀσελγείαις
  choice: 放荡
  rationale: ἀσέλγεια指无耻而不受约束的放纵，常包含性方面的过度；“放荡”简明自然并保持广泛道德含义。
- source_word: ἐπιθυμίαις
  choice: 私欲
  rationale: ἐπιθυμία本可中性，但在恶行清单中为负面；“私欲”表达失序、邪恶的欲望，并保持圣经伦理用语的庄重感。
- source_word: οἰνοφλυγίαις
  choice: 酗酒
  rationale: 此罕见名词指过量饮酒及醉酒状态；“酗酒”在现代汉语中自然表达反复、无节制饮酒，不必机械保留复数。
- source_word: κώμοις
  choice: 狂欢
  rationale: κῶμος指常伴随饮酒和失序行为的喧闹宴乐；“狂欢”简洁而能传达其放纵色彩。
- source_word: πότοις
  choice: 宴饮
  rationale: πότος指聚众饮酒或饮酒宴会；“宴饮”既区别于前面的“酗酒”，又保留社交性饮酒场合的含义。
- source_word: ἀθεμίτοις εἰδωλολατρίαις
  choice: 违法的偶像崇拜
  rationale: ἀθέμιτος表示不合法、不被准许、违背规范；“违法的”保留客观的道德—规范力量，而不单译成情绪性的“可憎”。εἰδωλολατρίαις虽为复数，汉语集合名词用单数形式更自然。
theological_decisions:
- issue: τῶν ἐθνῶν的群体指称
  choice: 外族人
  alternative: 列国的人；异教徒
  rationale: 这里指与收信人现今生活形成对照的非犹太社会。“外族人”既保留族群指称，也避免“异教徒”直接预设宗教评价；“列国的人”在现代汉语中较不自然。
- issue: ἀθεμίτοις εἰδωλολατρίαις的道德力度
  choice: 违法的偶像崇拜
  alternative: 可憎的偶像崇拜；不法的偶像崇拜
  rationale: 原词强调不被许可、违反应有规范。正文采用“违法的”保留这种客观规范性；“可憎的”偏重情感反应，“不法的”较具传统经文语体但现代口语清晰度稍低。
- issue: 过去行为与当前劝诫的时间关系
  choice: 过去的时间已经够……了；那时你们……
  alternative: 你们过去已经花了足够时间……
  rationale: 译文保留原句“已经过去的时间足够”的修辞判断，并以“那时”明确分词所描述的是从前的生活，不额外推断收信人的族裔身份或归信经历细节。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。恶行清单以简洁并列词呈现，通过“酗酒—狂欢—宴饮”保留三个饮宴相关希腊词之间的区别。脚注标记均置于整组相关表达之后，正文中的[a][b][c]分别对应“放荡”“酗酒”“违法的偶像崇拜”。
