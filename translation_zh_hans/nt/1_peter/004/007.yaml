  text: Πάντων δὲ τὸ τέλος ἤγγικεν. σωφρονήσατε οὖν καὶ νήψατε ⸀εἰς προσευχάς·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/007.yaml
  text: But the end of all things has drawn near[b][a]. Therefore be self-controlled and sober-minded for prayers.
translation:
  language: zh_hans
  text: 但万物的结局已经临近了[a]。所以，你们要谨慎自守，保持警醒[b]，以便祷告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“近了。”希腊语的完成时动词既可较形式对应地译为“已经临近了”，也可按当前状态译为“近了”。
    reason: lexical_alternative
  - marker: b
    text: “谨慎自守，保持警醒”也可译作“心思清醒，并且警觉”。这两个命令强调健全的判断、自我约束和属灵上的警觉。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντων
  choice: 万物的
  rationale: 此处为中性复数属格，与“结局”构成“万物的结局”；“万物”简洁自然，也保留其包罗一切的末世性表达。
- source_word: δὲ
  choice: 但
  rationale: δὲ在这里标示轻微转折或话题推进；译作“但”保留与上文之间的语篇转折。
- source_word: τὸ τέλος
  choice: 结局
  rationale: τέλος在此指万物终局性的终结。中文“结局”既自然，又比单说“结束”更适合这一末世语境，同时不预设具体的末世时间表。
- source_word: ἤγγικεν
  choice: 已经临近了
  rationale: 希腊语完成时表达某事已经趋近并处于近在眼前的状态；“已经临近了”兼顾其完成时意味与当前状态。
- source_word: σωφρονήσατε
  choice: 要谨慎自守
  rationale: 该命令要求人有健全、节制而审慎的心思与行为。“谨慎自守”在现代中文中庄重易懂，并兼顾清醒判断和自我约束。
- source_word: οὖν
  choice: 所以
  rationale: οὖν从“万物的结局已经临近”推出随后的劝勉；“所以”清楚自然地表达这一推论关系。
- source_word: νήψατε
  choice: 保持警醒
  rationale: νήφω本义与清醒有关，在新约中用于比喻性的精神警觉。这里与σωφρονήσατε并列，并以祷告为目的，因此译作“保持警醒”，不将其缩限为戒酒。
- source_word: εἰς προσευχάς
  choice: 以便祷告
  rationale: εἰς在此表达目的或结果。“以便祷告”明确说明谨慎与警醒是为了祷告；中文名词通常不标单复数，故无需生硬表达希腊语复数。
theological_decisions:
- issue: “万物的结局”的末世论含义
  choice: 保留为直接的末世性宣告，不界定具体时间表或体系
  alternative: 将τέλος理解为较弱的“目标”，或将本句处理为完全实现而淡化将来的终局
  rationale: 经文以万物终局的临近作为伦理劝勉的根据。译文保留这种迫切感，却不引入任何特定的千禧年观或宗派框架。
- issue: ἤγγικεν所表达的临近状态
  choice: 译为“已经临近了”
  alternative: 译为“近了”
  rationale: 两者都可表达原文；正文用“已经临近了”较明显地保留完成时所含的趋近过程及其当前结果，脚注则说明更简练的可能译法。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“谨慎自守，保持警醒”保留两个并列命令的区别，又避免生硬直译；“以便祷告”清楚呈现其目的关系。所有代词均依希腊语复数语境译为“你们”。
