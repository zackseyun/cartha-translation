  terminology: “义人”“得救”“不敬虔的人”“罪人”均为稳定、准确的圣经汉语术语。脚注a适当地列出“勉强”“好不容易”等可行替代，并谨慎说明其并不必然断言最终得救的不确定性；脚注b所列“被发现”符合φανεῖται可有的替代性理解。
