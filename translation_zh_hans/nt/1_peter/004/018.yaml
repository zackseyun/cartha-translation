  source_fidelity: 正文忠实对应希腊文的条件句与反问句：ὁ δίκαιος译为“义人”，μόλις σῴζεται以“得救尚且艰难”保留其艰难、勉强的张力，且未把现在时语态不当地限定为单一过程含义。ἀσεβής与ἁμαρτωλός分别译作“不敬虔的人”和“罪人”，没有合并；ποῦ φανεῖται译作“将在哪里出现”，保留原文空间疑问和将来显现的开放性。
