id: 1PE.4.18
reference: 1 Peter 4:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ εἰ ὁ δίκαιος μόλις σῴζεται, ⸀ὁ ἀσεβὴς καὶ ἁμαρτωλὸς ποῦ φανεῖται;
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/018.yaml
  text: And if the righteous is scarcely saved[b][a], where will the ungodly and the sinner appear?
translation:
  language: zh_hans
  text: 如果义人得救尚且艰难[a]，那么不敬虔的人和罪人将在哪里出现[b]呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “艰难”也可译作“勉强”或“好不容易”。这里着重表达义人经历严峻艰难而得救，不必理解为得救本身仅有不确定的可能。
    reason: lexical_alternative
  - marker: b
    text: “出现”也可译作“被发现”。
    reason: lexical_alternative
lexical_decisions:
- source_word: δίκαιος
  choice: 义人
  rationale: 带冠词的单数形容词作名词使用，泛指义人；“义人”简洁、自然，也保留箴言式的代表性单数。
- source_word: μόλις
  choice: 尚且艰难
  rationale: μόλις可表示“艰难地”或“几乎不能、勉强”。结合受苦与审判的上下文，以“得救尚且艰难”表达得救所经历的严峻艰难，同时保留原文的张力。
- source_word: σῴζεται
  choice: 得救
  rationale: 现在时被动或中间语态；在这句概括性的箴言式陈述中，“得救”最符合现代汉语习惯，也不强行限定为过程或终局。
- source_word: ἀσεβής
  choice: 不敬虔的人
  rationale: 表达对上帝缺乏敬畏的宗教与道德含义，并与后面的“罪人”保持区别。
- source_word: ἁμαρτωλός
  choice: 罪人
  rationale: 准确而通行的译法；原文以两个并列称谓描述对象，因此不与“不敬虔的人”合并。
- source_word: ποῦ
  choice: 在哪里
  rationale: 直接保留疑问副词的空间表达与反问语气。
- source_word: φανεῖται
  choice: 将……出现
  rationale: 将来时中间语态，可表示“出现、显露”或“被发现”。正文采用较直接的“出现”，并在脚注列出另一种可能。
theological_decisions:
- issue: μόλις σῴζεται所表达的含义
  choice: 正文表明义人得救伴随着艰难，并保留措辞本身的张力。
  alternative: 将其理解为义人最终能否得救本身仍不确定，或译作“仅仅得救”。
  rationale: 彼得前书4章的上下文涉及受苦、审判从上帝的家开始以及在苦难中持守。译文不把原句解释成最终救恩必然性不足，也不在正文中加入超出原文的保证。
- issue: 单数阳性代表性表达
  choice: 译作单数的“义人”。
  alternative: 译作复数“义人们”或扩展为“义人这个人”。
  rationale: 原文为带冠词的单数阳性形式，具有代表性、概括性的用法；中文“义人”可以自然保留这种箴言式表达。
- issue: 反问句中φανεῖται的开放性
  choice: 保留字面的空间问句“将在哪里出现”。
  alternative: 解释为“将如何站立得住”或“将何处容身”。
  rationale: 这些解释虽可能传达审判场景，却加入了原文未明说的内容；直译更能保留其修辞力度与含义开放性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“如果……尚且……那么……”自然呈现原文由条件句引出的强烈反问；“不敬虔的人和罪人”保留两个并列称谓及各自的定冠意味。
