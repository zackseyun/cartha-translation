  text: ἐν ᾧ ξενίζονται μὴ συντρεχόντων ὑμῶν εἰς τὴν αὐτὴν τῆς ἀσωτίας ἀνάχυσιν, βλασφημοῦντες·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/004.yaml
  text: In this[a], they are surprised that you do not run with them into the same flood of debauchery[c][b], slandering you.
translation:
  language: zh_hans
  text: 在这事上，他们见你们不再与他们一同奔向那同一股放荡的洪流[b]，就觉得奇怪[a]，并毁谤你们[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“感到惊讶”或“认为奇怪”。
    reason: lexical_alternative
  - marker: b
    text: 直译：“放荡的同一倾泻（或泛滥）。”
    reason: lexical_alternative
  - marker: c
    text: 也可译为“辱骂你们”或“恶言攻击你们”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: 就
  rationale: 该短语承接上文，并引出他们对信徒不再同行的反应；汉语用“就”连接原因情境与结果，较“在这事上”更自然，又不必强化为明确的因果连词。
- source_word: ξενίζονται
  choice: 觉得奇怪
  rationale: 保留该动词“视为陌生、感到诧异”的语义，比单纯“惊讶”更能体现他们认为信徒的改变反常。
- source_word: μὴ συντρεχόντων ὑμῶν
  choice: 你们不再和他们一起奔向
  rationale: “一起奔向”保留 συντρέχω 的共同奔跑意象；“不再”根据上文信徒过去的生活方式表达语境含义。
- source_word: εἰς τὴν αὐτὴν
  choice: 那同样
  rationale: 表达他们仍参与、而信徒不再参与的同一种生活状态，并与后面的方向性意象相接。
- source_word: τῆς ἀσωτίας
  choice: 放荡
  rationale: ἀσωτία 指挥霍无度、缺乏道德节制的生活；“放荡”在现代汉语中简洁、清楚，也具有适当的道德分量。
- source_word: ἀνάχυσιν
  choice: 洪流
  rationale: 原词有倾泻、泛滥之意；“洪流”保留过度涌流的比喻，并与“奔向”自然搭配。
- source_word: βλασφημοῦντες
  choice: 毁谤你们
  rationale: 此处语境是人对信徒的恶言攻击；“毁谤”既可涵盖辱骂和诋毁，也避免现代读者把它误解为专指亵渎上帝。
theological_decisions:
- issue: βλασφημοῦντες 所指敌意言语的对象和性质
  choice: 毁谤你们
  alternative: 亵渎；说恶言
  rationale: 上下文描述不信者因信徒改变生活而作出的反应，受攻击者自然是“你们”。译为“毁谤你们”表达针对人的恶言，同时不把词义误限为对上帝的亵渎。
- issue: 分词 βλασφημοῦντες 与主句的关系
  choice: 并且毁谤你们
  alternative: 毁谤着你们；一面毁谤你们
  rationale: 希腊文分词可表示伴随情形，但具体逻辑关系未完全明说。“并且”在现代汉语中自然地保留伴随或并列关系，而不强加原因或结果。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“一起奔向……洪流”刻意保留原文奔跑与倾泻相结合的强烈意象；正文不使用较生硬的“在这事上”，但仍清楚承接上文。所有脚注标记均置于正文相应位置。
