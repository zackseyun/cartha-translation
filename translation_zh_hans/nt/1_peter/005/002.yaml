id: 1PE.5.2
reference: 1 Peter 5:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ποιμάνατε τὸ ἐν ὑμῖν ποίμνιον τοῦ θεοῦ, ⸀ἐπισκοποῦντες μὴ ἀναγκαστῶς ἀλλὰ ἑκουσίως ⸂κατὰ θεόν⸃, μηδὲ αἰσχροκερδῶς ἀλλὰ προθύμως,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/002.yaml
  text: Shepherd the flock of God among you[a], exercising oversight not under compulsion but willingly, according to God; nor for shameful gain, but eagerly.
translation:
  language: zh_hans
  text: 你们要牧养在你们中间的上帝的羊群，照管他们；不要出于勉强，而要甘心，照着上帝的心意[a]；不要为卑劣的利益而做，却要热心。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“按着上帝”；即按上帝所喜悦的心意、标准或方式。
    reason: alternative_reading
lexical_decisions:
- source_word: ποιμάνατε
  choice: 务要牧养
  rationale: 保留牧人照料羊群的比喻；“务要”自然传达命令语气，又不把动词处理为后期固定的教会职衔。
- source_word: τὸ ἐν ὑμῖν ποίμνιον τοῦ θεοῦ
  choice: 你们中间上帝的羊群
  rationale: “羊群”对应 ποίμνιον；“你们中间”保留 ἐν ὑμῖν 的地域和关系含义，并以“上帝的”明确羊群属于上帝，而非属于受劝勉的长老。
- source_word: ἐπισκοποῦντες
  choice: 照管他们
  rationale: 分词说明牧养的实行方式；“照管”兼顾监督与关怀，现代中文自然，也避免译成特定宗派的职衔。
- source_word: μὴ ἀναγκαστῶς
  choice: 不是出于勉强
  rationale: 表达因压力或不得已而行动，与后面的自愿服事构成清楚对照。
- source_word: ἀλλὰ ἑκουσίως
  choice: 而是甘心
  rationale: 自然传达自愿、乐意的意思，并与“出于勉强”形成简洁对比。
- source_word: κατὰ θεόν
  choice: 照着上帝的心意
  rationale: 希腊短语高度凝练；此译在现代中文中自然地表达依照上帝所愿或所定的规范，同时不将其扩展为更具体的教义说明。
- source_word: μηδὲ αἰσχροκερδῶς
  choice: 也不是贪图不义之财
  rationale: 表达 αἰσχροκερδῶς 所含为卑劣、可耻利益而行的动机；“贪图不义之财”是清楚而庄重的现代中文。
- source_word: ἀλλὰ προθύμως
  choice: 而是热切地去做
  rationale: προθύμως 表示积极、热切和随时愿意，借“热切”与前面的“甘心”区分，避免两个希腊副词译得完全相同。
theological_decisions:
- issue: ἐπισκοποῦντες 是否应译为技术性教会职衔
  choice: 译作描述性行动“照管他们”
  alternative: 作监督；履行监督职分
  rationale: 此处分词描述上下文中长老应有的行动，不必认定为后期固定的教会职衔；这样既保留监督照料之意，也不引入特定宗派制度。
- issue: 如何表达 κατὰ θεόν
  choice: 译为“照着上帝的心意”
  alternative: 照着上帝；按上帝的旨意
  rationale: 原短语可以指合乎上帝的旨意、标准或所喜悦的方式。“照着上帝的心意”在中文中可读，同时保持一定涵盖性，不进一步限定具体所指。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“牧养—羊群”保留原文核心比喻；句中两组“不是……而是……”对应原文并列对照。“上帝”统一用于 θεός。
