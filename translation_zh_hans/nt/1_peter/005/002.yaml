review_pass:
  verdict: revise
  source_fidelity: 译文总体保留了命令语气、牧养比喻、监督/照管的动作，以及两组否定—肯定的对照。但“贪图不义之财”将“为可耻/卑劣的获利而行”较具体地转成“不义之财”，并非原文必要含义；末句“热切地去做”缺少自然、明确的施事方式表达。κατὰ θεόν宜保留其压缩性，并以脚注说明可指合乎上帝的心意、标准或方式。
  naturalness: 原句基本通顺庄重，但“你们中间上帝的羊群”修饰关系略显拥挤；“而是热切地去做”在中文中宾语悬空，读来不够凝练。改为“在你们中间的上帝的羊群”及“而要热心”更自然。
  terminology: “牧养”“羊群”“照管”“甘心”均恰当，且没有把ἐπισκοποῦντες处理为教会职衔。“卑劣的利益”比“不义之财”更贴近αἰσχροκερδῶς所表达的可耻、卑下的牟利动机；“热心”可与前文“甘心”区分，并对应προθύμως的积极乐意。
  issues:
