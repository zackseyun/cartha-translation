  to: 你们要牧养在你们中间的上帝的羊群，照管他们；不要出于勉强，而要甘心，照着上帝的心意[a]；不要为卑劣的利益而做，却要热心。
  rationale: 修订明确“羊群”是“在你们中间”的上帝的羊群，保留ἐπισκοποῦντες的描述性照管含义；以“卑劣的利益”避免将可耻牟利误限为“不义之财”；以“热心”自然表达προθύμως，并通过脚注保留κατὰ θεόν的语义涵盖性。
