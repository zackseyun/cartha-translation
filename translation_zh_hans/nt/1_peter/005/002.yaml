    rationale: 原文指为卑劣、可耻的利益/获利而行动，不必断言所得财物本身为“不义之财”。
  - severity: medium
    issue: “而是热切地去做”表达不完整且不够自然。
    rationale: προθύμως是方式副词，指积极、热切地服事；“去做”在中文中所指不明。
  - severity: low
    issue: 缺少κατὰ θεόν的脚注。
    rationale: 该短语语义凝练，可涵盖合乎上帝的心意、标准或方式；脚注有助于保留而非消解这种涵盖性。
