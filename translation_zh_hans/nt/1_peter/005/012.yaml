  text: Διὰ Σιλουανοῦ ὑμῖν τοῦ πιστοῦ ἀδελφοῦ, ὡς λογίζομαι, δι’ ὀλίγων ἔγραψα, παρακαλῶν καὶ ἐπιμαρτυρῶν ταύτην εἶναι ἀληθῆ χάριν τοῦ θεοῦ· εἰς ἣν ⸀στῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/012.yaml
  text: Through Silvanus[a], the faithful brother, as I regard him, I have written to you briefly, exhorting and testifying that this is the true grace of God[b]. Stand firm in it.
translation:
  language: zh_hans
  text: 我借着西尔瓦努——我认为他是一位忠信的弟兄——简要地写信给你们，劝勉并郑重见证：这就是上帝真实的恩典。你们要在这恩典中站稳。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 有些抄本作：“你们站立在这恩典中。”
    reason: textual_variant
lexical_decisions:
- source_word: Διὰ Σιλουανοῦ
  choice: 借着西尔瓦努
  rationale: διά加属格表示媒介或代理。“借着”保留西尔瓦努可能作为送信者或代笔者的开放性，不具体限定其角色。人名按本节希腊文形式音译。
- source_word: τοῦ πιστοῦ ἀδελφοῦ, ὡς λογίζομαι
  choice: 我认为他是忠信的弟兄
  rationale: 将插入性的评价化为自然汉语独立分句；“忠信”兼有忠诚、可靠之意，又不把彼得的个人评价强化为绝对断言。
- source_word: δι’ ὀλίγων ἔγραψα
  choice: 写了这封短信；我用寥寥数语
  rationale: δι’ ὀλίγων表示篇幅简短或所用言语不多。正文以自然汉语表达书信简短，并用脚注标示较贴近字面的译法。
- source_word: παρακαλῶν καὶ ἐπιμαρτυρῶν
  choice: 劝勉你们，并郑重见证
  rationale: “劝勉”保留παρακαλέω的规劝和鼓励色彩；“郑重见证”表达ἐπιμαρτυρέω所具有的严肃确认和作证意味。
- source_word: ταύτην εἶναι ἀληθῆ χάριν τοῦ θεοῦ
  choice: 这就是上帝真正的恩典
  rationale: “这”保留所指范围的开放性，可指信中所传讲、劝勉并见证的内容，也可涵盖读者所领受的恩典；“真正的恩典”直接反映ἀληθῆ χάριν。
- source_word: εἰς ἣν στῆτε
  choice: 你们要在这恩典中站稳
  rationale: 按所给SBLGNT的命令式στῆτε翻译。“站稳”自然表达坚定持守；补出“这恩典”以明确汉语指代，但不改变其回指对象。
theological_decisions:
- issue: “这就是上帝真正的恩典”中“这”的所指
  choice: 保留“这”的宽泛指向，不在译文中限定为整封信、福音信息或读者当前的经历。
  alternative: 明确译作“我在信中所讲的”或“你们所领受的”。
  rationale: 上下文把写信、劝勉和见证连在一起，但没有进一步限定ταύτην的范围；保留指代上的张力最忠于原文。
- issue: 末句στῆτε的语气
  choice: 按命令式译为“你们要……站稳”。
  alternative: 部分抄本作陈述式，可译为“你们正站立在其中”。
  rationale: 所给SBLGNT正文采用命令式；异文则在脚注中保留。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“忠信的弟兄”“郑重见证”“站稳”保留书信结语的郑重语气；分句经过汉语化处理，避免照搬希腊文长句结构。
