source:
  edition: SBLGNT
  text: Πρεσβυτέρους ⸀οὖν ἐν ὑμῖν παρακαλῶ ὁ συμπρεσβύτερος καὶ μάρτυς τῶν τοῦ Χριστοῦ παθημάτων, ὁ καὶ τῆς μελλούσης ἀποκαλύπτεσθαι δόξης κοινωνός,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/001.yaml
  text: 'Therefore I exhort the elders among you[a], as a fellow elder and a witness of the sufferings of the Messiah[b], and also a sharer in the glory that is about to be revealed:'
translation:
  language: zh_hans
  text: 所以，我这与你们同作长老、又是弥赛亚[a]所受苦难的见证人，并且在那将要显现的荣耀上有分的人，劝勉你们中间的长老：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弥赛亚”也可译作传统用语“基督”。希腊语Χριστός意为“受膏者”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρεσβυτέρους
  choice: 长老
  rationale: 这里指教会群体中的带领者，而不只是年长的男子；“长老”是现代中文圣经语境中清楚且不限定宗派制度的对应词。
- source_word: οὖν
  choice: 所以
  rationale: 承接上文并表达推论关系；“所以”比“那么”更清楚地保留逻辑衔接，也比“因此”稍为自然。
- source_word: ἐν ὑμῖν
  choice: 你们中间
  rationale: 自然表达这些长老身处收信群体之中。
- source_word: παρακαλῶ
  choice: 我劝勉
  rationale: 表达郑重而带有牧养意味的敦促，不把语气削弱为一般请求。
- source_word: συμπρεσβύτερος
  choice: 和你们同作长老
  rationale: 保留复合词所表达的共同长老身份及同工关系；较“同为长老者”更符合现代汉语。
- source_word: μάρτυς
  choice: 见证人
  rationale: 保留既可指亲历者、也可指作见证者的语义空间，不译作“殉道者”。
- source_word: τῶν τοῦ Χριστοῦ παθημάτων
  choice: 弥赛亚受苦
  rationale: 按最自然的属格关系理解为弥赛亚所经历的苦难；中文以“弥赛亚受苦”简洁表达。
- source_word: Χριστοῦ
  choice: 弥赛亚
  rationale: 此处称号意义仍然鲜明；“弥赛亚”直接传达“受膏者”的身份，传统译法“基督”列于脚注。
- source_word: κοινωνός
  choice: 有分者
  rationale: 表达参与、分享某事的身份，又避免“伙伴”可能带来的商业或组织含义。
- source_word: τῆς μελλούσης ἀποκαλύπτεσθαι δόξης
  choice: 那将要显现之荣耀
  rationale: “将要”保留未来期待，“显现”自然表达荣耀原先隐藏而后被揭示的被动含义；不据此判定末世时间表。
theological_decisions:
- issue: Χριστοῦ作为基督论称号的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: “弥赛亚”保留Χριστός作为“受膏者”称号的意义；同时以脚注给出中文传统译名“基督”，不把其中一种表达绝对化。
- issue: μελλούσης ἀποκαλύπτεσθαι所表达的未来期待
  choice: 将要显现
  alternative: 即将显现；要被显明
  rationale: “将要显现”同时保留未来指向和启示、揭露的含义，却不以“即将”过度限定时间上的迫近程度，也不借译文解决末世论争议。
- issue: μάρτυς与彼得见证身份的性质
  choice: 见证人
  alternative: 作见证的人；亲眼见证的人
  rationale: 希腊词本身可涉及亲历和作证；正文不加入“亲眼”，以免替原文解决彼得如何见证弥赛亚受苦的问题。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。为避免首句主宾成分过长，将希腊语的一个长句按中文习惯分成两句，同时保留末尾冒号，表明劝勉内容将在下一节展开。“和你们同作长老”突出彼得与受劝者共同的身份；“见证人”及“将要显现”保留原文的神学张力，不额外解释见证方式或荣耀显现的具体时间。
