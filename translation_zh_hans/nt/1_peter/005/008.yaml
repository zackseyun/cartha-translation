id: 1PE.5.8
reference: 1 Peter 5:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: νήψατε, γρηγορήσατε. ὁ ἀντίδικος ὑμῶν διάβολος ὡς λέων ὠρυόμενος περιπατεῖ ζητῶν ⸀τινα ⸀καταπιεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/008.yaml
  text: Be clear-minded[a]; stay alert. Your adversary, the devil, walks around like a roaring lion[b], seeking someone to devour.
translation:
  language: zh_hans
  text: 务要头脑清醒[a]，保持警觉。你们的仇敌魔鬼，好像咆哮的狮子，四处游走[b]，寻找可吞吃的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“务要谨守自持”。这个希腊语动词本义是“不醉酒”，但新约中的用法都是比喻性的；这里指在属灵攻击面前保持心智清醒和自持，并非特指禁酒。
    reason: lexical_alternative
  - marker: b
    text: 或译“四处徘徊”。原文动词直译是“走来走去”或“四处行走”；狮子的比喻使其自然带有搜寻猎物的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: νήψατε
  choice: 务要头脑清醒
  rationale: 该动词本义与戒除醉酒有关，但新约中均作比喻使用；本节与“保持警觉”并列，指在属灵威胁下保持清醒、自持。“头脑清醒”自然表达其实际语义，又不与下一个命令混同。
- source_word: γρηγορήσατε
  choice: 保持警觉
  rationale: 表达清醒守望、随时戒备的命令，与前句的心智清醒彼此补充。
- source_word: ἀντίδικος
  choice: 仇敌
  rationale: 此词可指诉讼中的对手，也可泛指敌对者；本节重在魔鬼对信徒的敌对，译作“仇敌”自然且不过度限定法律含义。
- source_word: διάβολος
  choice: 魔鬼
  rationale: 这里不是泛指诽谤者，而是用作那位敌对信徒的邪恶者之通行称谓。
- source_word: ὡς λέων ὠρυόμενος
  choice: 好像咆哮的狮子
  rationale: 保留明确的比喻及其威吓、捕食的鲜明意象。
- source_word: περιπατεῖ
  choice: 四处游走
  rationale: 保留“走动、到处行走”的基本意义；中文“游走”在狮子语境中自然传达搜寻猎物的动态，而未直接强化为“潜行”。
- source_word: ζητῶν
  choice: 寻找
  rationale: 表达持续搜寻目标的伴随行动，并可自然引出后面的不定式目的。
- source_word: τινα
  choice: 可……的人
  rationale: 希腊文是不定单数代词，指未确定的目标；中文用“可吞吃的人”自然表达“寻找某个能够吞吃的人”。
- source_word: καταπιεῖν
  choice: 吞吃
  rationale: 原词有吞下、吞没之意；置于狮子比喻中，“吞吃”保留其猛烈的捕食意味。
theological_decisions:
- issue: διάβολος应译为普通名词“诽谤者”，还是指撒但的称谓
  choice: 魔鬼
  alternative: 诽谤者
  rationale: 定冠词及上下文表明这里所指的是与信徒敌对的那位邪恶者；“魔鬼”符合新约通行用法，不额外加入经文以外的教义内容。
- issue: περιπατεῖ在狮子比喻中应表达多强的捕猎意味
  choice: 四处游走
  alternative: 四处徘徊／四处潜行
  rationale: 选择较贴近动词基本义的表达，让“咆哮的狮子”和“寻找可吞吃的人”承担威胁色彩，同时在脚注保留更具捕猎意味的理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“务要”保留命令的郑重感；两个祈使句分别译为“头脑清醒”和“保持警觉”，避免语义重叠。句式保留原文由命令转向警告的推进，并保留狮子比喻的力度。
