  text: πᾶσαν τὴν μέριμναν ὑμῶν ἐπιρίψαντες ἐπ’ αὐτόν, ὅτι αὐτῷ μέλει περὶ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/007.yaml
  text: casting all your anxiety on him[c][b][a], because he cares for you.
translation:
  language: zh_hans
  text: 把你们一切的忧虑[a]都卸在他身上[b][c]，因为他顾念你们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “忧虑”也可译作“挂虑”或“担心”；这里指使人不安的牵挂。
    reason: lexical_alternative
  - marker: b
    text: 直译“投在他身上”；这个分词承接第6节的劝勉。
    reason: lexical_alternative
  - marker: c
    text: “他”按紧接的上文（第6节）指神。
    reason: cross_reference
lexical_decisions:
- source_word: πᾶσαν τὴν μέριμναν ὑμῶν
  choice: 你们一切的忧虑
  rationale: πᾶσαν 表达整体、无一保留的范围；μέριμνα 在此指令人不安的挂虑，而非中性的关心，因此译为现代汉语自然的“忧虑”。ὑμῶν 为复数第二人称所属关系，译作“你们的”。
- source_word: ἐπιρίψαντες ἐπ’ αὐτόν
  choice: 卸给他
  rationale: ἐπιρίπτω 描写把重担投放到某人身上的动作；“卸给”既保留转移重担的意象，也符合庄重而自然的现代汉语。分词与上文第6节的劝勉相连，本句中文以连动式表达，不另加主命令。
- source_word: ὅτι
  choice: 因为
  rationale: 明确引出把忧虑卸给他的理由。
- source_word: αὐτῷ μέλει περὶ ὑμῶν
  choice: 他顾念你们
  rationale: 该表达意为你们的事是他所关切的；“顾念”自然、庄重，并传达主动而有关系性的关怀，不把含义缩窄为物质供应。
theological_decisions:
- issue: αὐτόν／αὐτῷ 所指是谁
  choice: 保留代词“他”，按紧接的上文理解为神
  alternative: 直接译成“神”或宽泛理解为“主”
  rationale: 第6节“神大能的手”提供了最自然的指代对象；正文保留希腊文的代词形式，避免在翻译中把上下文所暗示的对象改成明说。
- issue: ἐπιρίψαντες 与上文命令的关系
  choice: 保留为与上文劝勉相连的方式或伴随动作
  alternative: 将本节独立处理成新的命令“要把……”
  rationale: 希腊文使用分词而非新的命令式，语法上承接第6节“要谦卑”；中文不额外加入“要”，以免抹去这种联系。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“卸给”保留卸下重担的具体意象；“顾念”与“忧虑”形成有意义的对照：信徒不必独自背负忧虑，因为神关切他们。
