id: 1PE.5.5
reference: 1 Peter 5:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁμοίως, νεώτεροι, ὑποτάγητε πρεσβυτέροις. πάντες δὲ ⸀ἀλλήλοις τὴν ταπεινοφροσύνην ἐγκομβώσασθε, ὅτι Ὁ θεὸς ὑπερηφάνοις ἀντιτάσσεται ταπεινοῖς δὲ δίδωσιν χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/005.yaml
  text: Likewise[a], you younger men, submit yourselves to the elders. And all of you, clothe yourselves with humility toward one another, because God opposes the proud[c][b], but gives grace to the humble.
translation:
  language: zh_hans
  text: 同样，年轻的男子们[a]要顺服长老。你们众人也都要以谦卑束身[b]，彼此相待，因为：“上帝抵挡骄傲的人，却赐恩典给谦卑的人。”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你们较年轻的人”。希腊文是阳性复数，直译为“年轻男子”，但也有人认为这里泛指会众中较年轻的成员。
    reason: lexical_alternative
  - marker: b
    text: 或译“把谦卑穿在身上”。原文动词有把衣物穿上或系好的意象，强调有意识地以谦卑待人。
    reason: lexical_alternative
  - marker: c
    text: 引自或呼应《箴言》3:34（七十士译本）。
    reason: cross_reference
lexical_decisions:
- source_word: ὁμοίως
  choice: 同样
  rationale: 作为承接上文的论述标记，简洁自然地把本节劝勉与前文联系起来。
- source_word: νεώτεροι
  choice: 你们年轻男子
  rationale: 保留希腊文阳性复数形式及其与长老群体的对应关系；其也可能泛指较年轻的会众，故加脚注说明。
- source_word: ὑποτάγητε
  choice: 要顺服
  rationale: 准确表达劝勉语境中的命令语气和主动甘愿置于其带领之下的含义，又符合现代汉语习惯。
- source_word: πρεσβυτέροις
  choice: 长老
  rationale: 紧接5:1–4对长老的称呼，最自然地指教会中的长老，而不只是年长男子。
- source_word: πάντες δὲ ἀλλήλοις
  choice: 你们众人也都……彼此相待
  rationale: 清楚表明劝勉从年轻男子扩展到全体，并保留群体成员彼此相向的关系。
- source_word: ταπεινοφροσύνην
  choice: 谦卑
  rationale: 是现代汉语中清楚、自然且庄重的对应词，涵盖谦卑的心态与待人方式。
- source_word: ἐγκομβώσασθε
  choice: 以谦卑束身
  rationale: 保留动词所含把衣物系上或穿在身上的鲜明意象，同时避免擅自限定为腰带或围裙。
- source_word: ἀντιτάσσεται
  choice: 抵挡
  rationale: 传达上帝站在骄傲者对面、与之对抗的强烈含义，也与箴言引文的中文表达相称。
- source_word: δίδωσιν χάριν
  choice: 赐恩典
  rationale: 直接保留‘赐予’和‘恩典’这两个重要概念，语言简明庄重。
theological_decisions:
- issue: πρεσβυτέροις所指对象
  choice: 教会中的长老
  alternative: 一般的年长男子
  rationale: 5:1–4刚刚明确论及长老，因此本节最可能继续指这一群体；正文译作‘长老’，不额外添加职分性解释。
- issue: νεώτεροι的性别与范围
  choice: 年轻男子
  alternative: 较年轻的人／年轻会众
  rationale: 希腊文为阳性复数，正文保留这一形式，不把性别信息抹平；同时用脚注保留其可能泛指较年轻会众的解释空间。
- issue: 谦卑命令的范围
  choice: 扩展至全体会众彼此相待
  alternative: 只延续对年轻男子的命令
  rationale: πάντες明确转向‘众人’，ἀλλήλοις又强调相互关系，因此后半句是对整个群体的劝勉。
- issue: 箴言3:34的引用关系
  choice: 按引文处理并注明出处
  alternative: 仅视为一般性的经文呼应
  rationale: 措辞与七十士译本箴言3:34高度一致；正文用引号呈现，脚注明确其引用或引述关系，同时不扩大解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。正文保留‘顺服’‘谦卑’‘恩典’等清楚且有经文分量的词语；以‘以谦卑束身，彼此相待’兼顾原文衣着意象和汉语可读性。
