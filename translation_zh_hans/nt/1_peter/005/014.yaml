  text: ἀσπάσασθε ἀλλήλους ἐν φιλήματι ἀγάπης. εἰρήνη ὑμῖν πᾶσιν τοῖς ἐν ⸀Χριστῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/014.yaml
  text: Greet one another with a kiss of love[a]. Peace to all of you who are in Messiah.
translation:
  language: zh_hans
  text: 你们要用爱的亲吻彼此问安。愿平安归给你们全体，就是在弥赛亚[a]里的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弥赛亚”传统上常译作“基督”。
    reason: 提供Χριστός广为人知的传统译法，同时正文保留其称号含义。
lexical_decisions:
- source_word: ἀσπάσασθε ἀλλήλους
  choice: 彼此问安
  rationale: ἀσπάσασθε是复数命令式，ἀλλήλους表示群体成员之间的相互行动。“彼此问安”自然地传达书信结尾中互相致意的意思。
- source_word: ἐν φιλήματι ἀγάπης
  choice: 用爱的亲吻
  rationale: ἐν在这里表示问安的方式；φίλημα指亲吻，ἀγάπης是修饰它的属格。“爱的亲吻”保留了“爱”这一明确词义，也没有将其弱化为泛泛的友好表示。
- source_word: εἰρήνη ὑμῖν πᾶσιν
  choice: 愿……都得平安
  rationale: 原文是简洁的名词性祝福语。汉语加入“愿”和“得”，自然地表达其祝愿语气；“都”保留πᾶσιν的全体范围。
- source_word: τοῖς ἐν Χριστῷ
  choice: 所有在弥赛亚里的人
  rationale: 冠词加介词短语在此作名词性成分，指“那些在……里的人”。Χριστός在此仍带有“受膏者”这一称号含义，因此正文采用“弥赛亚”；“在……里”的表达保留了原文关系性和神学性的措辞，未将其解释性改写。
theological_decisions:
- issue: Χριστῷ在ἐν Χριστῷ中的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: Χριστός本义为“受膏者”，对应“弥赛亚”这一称号。正文保留称号意义，同时以脚注列出中文传统且广为人知的“基督”，避免掩盖两种译法之间的传统差异。
- issue: ἐν Χριστῷ的关系表达
  choice: 在弥赛亚里
  alternative: 属于弥赛亚的人
  rationale: 直译“在……里”保留原文的空间隐喻及其神学张力；改作“属于”虽较口语化，却会把原文可能涵盖的联合、归属和群体身份收窄为单一解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“彼此问安”和“都得平安”符合当代汉语表达；“爱的亲吻”保留原文具体的群体礼仪动作，不将其文化性内容泛化。“在弥赛亚里”略带圣经语体，但为保存原文隐喻而有意保留。
