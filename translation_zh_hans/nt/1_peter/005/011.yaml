  text: ⸀αὐτῷ τὸ κράτος εἰς τοὺς αἰῶνας ⸂τῶν αἰώνων⸃· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/011.yaml
  text: To him be the dominion forever and ever[a]. Amen.
translation:
  language: zh_hans
  text: 愿权能归给他，直到永永远远[a]。阿们！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较直译：“直到万世之世。”
    reason: 说明原文 εἰς τοὺς αἰῶνας τῶν αἰώνων 的字面结构；正文采用自然的中文惯用表达。
lexical_decisions:
- source_word: αὐτῷ
  choice: 归给他
  rationale: 与格代词承接上文所指的上帝；在中文颂赞语中用“归给他”自然表达归属和称颂，同时不改写为所有格断言。
- source_word: κράτος
  choice: 权能
  rationale: 此词在颂赞语境中指彰显于统治和掌权的力量。“权能”兼顾能力与主权意味，比单说“力量”更符合本句庄重的颂赞语气。
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: 直到永永远远
  rationale: 这是强调无尽久远的固定颂赞表达；“永永远远”在现代中文中自然、庄重，也保留了原文的强化语气。
- source_word: ἀμήν
  choice: 阿们
  rationale: 采用中文圣经及礼仪传统中通行的音译，保留结尾确认和响应的功能。
theological_decisions:
- issue: 无动词颂赞句中的隐含谓语
  choice: 愿权能归给他
  alternative: 权能是他的
  rationale: 希腊文没有明写动词。“愿……归给他”保留颂赞和宣告兼具的语气；若译成“权能是他的”，则更明确地把它处理为陈述句，缩小了原文无动词结构所容纳的张力。
translation_notes:
  register: 采用现代、庄重且易懂的中文颂赞语体。“愿……归给他”符合汉语颂赞习惯；句末用“阿们！”体现礼仪性的确认与响应。
