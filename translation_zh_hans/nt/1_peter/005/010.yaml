revisions:
- from: 但那赐下一切恩典的上帝，就是那在基督[a]里召你们进入他永恒荣耀的上帝，在你们受苦片刻以后，必亲自使你们恢复完全[b]，使你们坚定、刚强，并使你们根基稳固[c]。
  to: 但那赐各样恩典的上帝，曾在基督[a]里召你们进入他永恒的荣耀；在你们暂受苦难之后，他必亲自使你们复原、坚固、刚强，并使你们根基稳固[c]。
  rationale: 以“赐各样恩典的上帝”自然表达原文属格所指的上帝为各样恩典之源；删去重复主语。将不自然的“恢复完全”改为“复原”，并通过脚注保留“成全／使完全”的语义范围。将“受苦片刻”改为“暂受苦难”，使时间上的短暂性及其与后续将来行动的关系更清楚。保留“在基督里”“进入他永恒的荣耀”“亲自”以及四项神圣行动的区分。脚注 b 是词义替代说明，故不在正文设置锚点亦不影响文本结构。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T03:57:06Z'
review_pass:
  verdict: revise
  source_fidelity: 原文以“万有／各样恩典的上帝”描述上帝为恩典的源头；草案“赐下一切恩典的”基本可通，但较为解释性。“使你们恢复完全”把καταρτίσει的修复与完备意义不自然地合并，且中文搭配欠妥。修订为“使你们复原”，并在脚注保留“成全／使完全”的替代义，较准确地保留原词范围。其余三个将来动词和其递进、并列关系均予保留。
  naturalness: “就是那……的上帝”重复主语，令句子略显拖沓；“受苦片刻”也不如“暂受苦难”自然庄重。修订后的句子保持现代标准普通话的庄重、清晰语体，并保留原文“但”与“亲自”的衔接和强调。
  terminology: “基督”是现代汉语基督教语境中稳定、通行的称号译法；脚注说明其“受膏者”含义及“弥赛亚”替代译法。将πάσης χάριτος译作“赐各样恩典的”自然表达其来源性，避免把“一切恩典的上帝”作生硬直译。
  issues:
