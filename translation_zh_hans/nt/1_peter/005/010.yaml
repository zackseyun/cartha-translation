id: 1PE.5.10
reference: 1 Peter 5:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς πάσης χάριτος, ὁ καλέσας ὑμᾶς εἰς τὴν αἰώνιον αὐτοῦ δόξαν ἐν ⸀Χριστῷ, ὀλίγον παθόντας αὐτὸς ⸀καταρτίσει, στηρίξει, σθενώσει, ⸀θεμελιώσει.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/010.yaml
  text: And the God of all grace, who called you into his eternal glory in Messiah, after you have suffered a little while, will himself restore, establish, strengthen, and ground you.
translation:
  language: zh_hans
  text: 但那赐各样恩典的上帝，曾在基督[a]里召你们进入他永恒的荣耀；在你们暂受苦难之后，他必亲自使你们复原、坚固、刚强，并使你们根基稳固[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “基督”意为“受膏者”，也可译作“弥赛亚”。
    reason: 说明希腊文 Χριστός 是称号，并提供常见的另一译法。
  - marker: c
    text: 或译：“使你们立定根基”或“使你们站在坚固的根基上”。原文使用根基的意象。
    reason: 说明 θεμελιώσει 的根基意象及可选表达。
lexical_decisions:
- source_word: πάσης χάριτος
  choice: 赐下一切恩典的
  rationale: 属格短语表明上帝与一切恩典的密切关系；结合上下文，用“赐下”自然表达上帝是恩典的源头，同时保留“一切”的周全意义。
- source_word: καλέσας
  choice: 召……的
  rationale: 以关系从句表达不定过去时分词，清楚说明这位上帝曾施行呼召，不额外强化时态含义。
- source_word: εἰς τὴν αἰώνιον αὐτοῦ δόξαν
  choice: 进入他永恒的荣耀
  rationale: “进入”保留 εἰς 的方向性，也自然表达受召者将有分于上帝的荣耀。
- source_word: ἐν Χριστῷ
  choice: 在基督里
  rationale: “在基督里”是现代汉语基督教语境中清楚、简洁的表达，并保留 ἐν 的联合或领域含义；脚注说明“基督”这一称号的意义。
- source_word: ὀλίγον παθόντας
  choice: 在你们受苦片刻以后
  rationale: 将 ὀλίγον 理解为时间短暂，并以“以后”自然表达分词与随后几个将来时动词之间的时间关系。
- source_word: αὐτὸς
  choice: 亲自
  rationale: 保留强调代词的力量，突出上帝本人将施行以下行动。
- source_word: καταρτίσει
  choice: 使你们恢复完全
  rationale: 兼顾修复、调整至合宜状态和使之完备等语义，避免只选“完善”而削弱受苦后恢复的语境。
- source_word: στηρίξει
  choice: 使你们坚定
  rationale: 表达使人稳固、不动摇的含义，并与后面的“刚强”和根基意象有所区分。
- source_word: σθενώσει
  choice: 使你们刚强
  rationale: 直接表达赋予力量的意思，语言庄重而通俗。
- source_word: θεμελιώσει
  choice: 使你们根基稳固
  rationale: 明确保留源词的奠基、根基意象，同时避免与“坚定”完全重复。
theological_decisions:
- issue: Χριστῷ 的译法
  choice: 基督
  alternative: 弥赛亚
  rationale: Χριστός 是“受膏者”的称号；“基督”是现代中文圣经传统中通行且可理解的形式，脚注提供“弥赛亚”以显明其称号意义，不把它仅当作专名。
- issue: 受苦与上帝行动的时间关系
  choice: 在你们受苦片刻以后
  alternative: 你们受苦片刻时／你们受了片刻的苦之后
  rationale: 该分词结构容许略有不同的时间表达；正文呈现短暂受苦之后上帝施行恢复与坚固的次序，但不据此加入特定的苦难或成圣体系。
- issue: καταρτίσει 的神学语义
  choice: 使你们恢复完全
  alternative: 使你们完全／修复你们
  rationale: 译文同时保留受损后恢复和达到合宜、完备状态的张力，不将其单限定为道德完全或身体复原。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。保留原文以“但”承接上文的语气，并用重复“上帝”理顺较长的希腊语修饰结构。四个并列动词均予保留，以“恢复完全、坚定、刚强、根基稳固”尽量呈现各自不同的语义。
