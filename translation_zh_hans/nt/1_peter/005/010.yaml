    rationale: “恢复”通常须搭配“原状、健康、关系”等对象；“恢复完全”语义和语法均不够顺畅，也将καταρτίσει的“修复／成全”两个可并存的词义过度压缩为不自然表达。
  - severity: low
    issue: “就是那……的上帝”造成不必要的主语重复。
    rationale: 希腊文同位关系分词可在中文中直接处理为“曾在……召你们的”；无需重复“上帝”，且不会损失修饰关系。
  - severity: low
    issue: “受苦片刻”较生硬。
    rationale: ὀλίγον在此指暂时的受苦；“暂受苦难”更符合现代庄重中文，也保留其时间短暂及随后神行动的关系。
