  text: Ταπεινώθητε οὖν ὑπὸ τὴν κραταιὰν χεῖρα τοῦ θεοῦ, ἵνα ὑμᾶς ὑψώσῃ ἐν καιρῷ,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/006.yaml
  text: Humble yourselves[a], therefore, under the mighty hand of God, so that he may exalt you at the proper time,
translation:
  language: zh_hans
  text: 所以，你们要在神大能的手下谦卑自己[a]，好让他在适当的时候高举你们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“要让自己被降卑……好让他在适当的时候高举你们。”希腊语命令式在形式上是被动语态；不过在这里通常理解为带有反身意味：“要谦卑自己。”
    reason: 保留Ταπεινώθητε在语法形式上的被动取向及其可能的译法，同时说明正文采用反身性理解。
lexical_decisions:
- source_word: Ταπεινώθητε
  choice: 要谦卑自己
  rationale: 该词为不定过去时被动命令式，但在这一劝勉语境中可具有反身或中间语态的含义。“要谦卑自己”在现代汉语中自然地表达命令，同时由后面的“服在神大能的手下”限定为对神的顺服；脚注保留形式上的被动理解。
- source_word: οὖν
  choice: 所以
  rationale: 承接上文神阻挡骄傲的人、赐恩给谦卑之人的论述，明确表达推论关系。
- source_word: ὑπὸ τὴν κραταιὰν χεῖρα τοῦ θεοῦ
  choice: 服在神大能的手下
  rationale: ὑπό加宾格在此表达置身于权柄之下；“神大能的手”保留圣经中表示神强大作为和主权的惯用意象。“服在……手下”使汉语关系清楚，并与谦卑的劝勉自然衔接。
- source_word: ἵνα
  choice: 使
  rationale: 保留目的兼结果的意味，不把两者过度区分。
- source_word: ὑμᾶς ὑψώσῃ
  choice: 他高举你们
  rationale: 主语由前句的“神”承接。“高举”表达神使谦卑者得尊荣或获得伸张，不限于身体上的抬起。
- source_word: ἐν καιρῷ
  choice: 在适当的时候
  rationale: καιρός指合宜、恰当的时机，而非仅指一般的时间流逝；此译法清楚自然，又不额外断定为某个预先指定的时刻。
theological_decisions:
- issue: Ταπεινώθητε的语态与行动主体
  choice: 正文译作主动反身的“要谦卑自己”，并以脚注保留“要被降卑”的可能。
  alternative: 要被降卑
  rationale: 原文命令式在形式上是被动语态，但在此处通常可按反身或中间意义理解。正文体现人的责任，后面的“服在神大能的手下”则表明这种谦卑并非脱离神的自主自贬；脚注避免抹去原文语态所保留的张力。
- issue: 神高举人的时间
  choice: 译作“在适当的时候”，不明确指定为今生、末世或某一特定事件。
  alternative: 到了指定的时候
  rationale: 原文只说明合宜的时机，未进一步界定何时或以何种方式高举，因此不加入特定的末世论或现世报偿解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“大能的手”和“高举”保留原文的圣经意象；“适当的时候”比传统表达“到了时候”更明确地传达καιρός所指的合宜时机。
