id: 1PE.5.3
reference: 1 Peter 5:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: μηδ’ ὡς κατακυριεύοντες τῶν κλήρων ἀλλὰ τύποι γινόμενοι τοῦ ποιμνίου·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/003.yaml
  text: not domineering over those allotted to your care[a], but becoming examples to the flock.
translation:
  language: zh_hans
  text: 也不要辖制所分给你们照管的人[a]，而要成为群羊的榜样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要辖制所分给你们的各份。”希腊原文直译为“各份”或“所分得的部分”，在这里很可能指神的群羊中分别交由各长老照管的部分。
    reason: 保留τῶν κλήρων的字面意义及其在牧养语境中的可能所指。
lexical_decisions:
- source_word: μηδ’ ὡς
  choice: 也不要
  rationale: 承接上一节的否定劝诫，并引出长老不可采用的牧养方式；“也不要”在现代汉语中自然地保留了否定并列关系。
- source_word: κατακυριεύοντες
  choice: 辖制
  rationale: 该词指以强势、压迫的方式施行权柄，而不只是一般性的带领或治理。“辖制”简洁表达了滥用权威的含义。
- source_word: τῶν κλήρων
  choice: 所分给你们照管的人
  rationale: κλῆροι字面意为“所分得的份、分配的部分”；在牧养语境中，指分别交由各长老照管的群羊。正文以自然汉语表达其所指，同时用脚注保留原文意象和歧义。
- source_word: ἀλλὰ
  choice: 而要
  rationale: 鲜明对照不可有的辖制与应有的榜样式牧养，并使汉语劝诫句式连贯。
- source_word: τύποι
  choice: 榜样
  rationale: 此处指可供效法的典范或样式；“榜样”是清楚、自然且庄重的现代汉语。
- source_word: γινόμενοι
  choice: 成为
  rationale: 保留动词所表达的动态意味，即在实际生活和服事中成为可效法的人，而非仅陈述静态身份。
- source_word: τοῦ ποιμνίου
  choice: 群羊
  rationale: 保留牧养比喻，指由长老照管的信徒群体；“群羊”也与上下文的牧者意象相呼应。
theological_decisions:
- issue: κλήρων与教会带领职分的关系
  choice: 理解为分派给各长老照管的信徒，而不是长老所拥有的人
  alternative: 按字面译作“各份”或理解为长老拥有的辖区
  rationale: 上下文命令长老牧养神的群羊，强调受托照管而非占有。正文表达照管关系，脚注则保留“所分的份”这一原文字面意义。
- issue: κατακυριεύοντες所禁止的范围
  choice: 禁止以强势、压迫的方式滥用权柄
  alternative: 理解为禁止长老施行任何形式的带领或治理
  rationale: 该动词本身带有专横辖制的意味；经文将这种方式与作群羊榜样相对照，并非否定一切带领职分。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“辖制”准确传达专横用权；“群羊”保留经文的牧养意象。正文力求自然，脚注说明κλήρων的字面表达，避免把其隐喻所指绝对化。
