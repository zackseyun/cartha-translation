  text: καὶ φανερωθέντος τοῦ ἀρχιποίμενος κομιεῖσθε τὸν ἀμαράντινον τῆς δόξης στέφανον.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/004.yaml
  text: And when the Chief Shepherd is revealed[b][a], you will receive the unfading crown of glory.
translation:
  language: zh_hans
  text: 牧长显现[a]的时候，你们必得那永不衰残的荣耀冠冕[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“被显明”。原文采用被动形式；“显现”是较自然的中文表达。
    reason: alternative_reading
  - marker: b
    text: 原文所用的“冠冕”可指颁给得胜者、作为尊荣奖赏的花冠，并非专指君王的王冠。
    reason: lexical_alternative
lexical_decisions:
- source_word: φανερωθέντος
  choice: 显现
  rationale: 这是属格独立结构中的不定过去时被动分词，在句中表达时间。中文“显现”自然地表达原先未显明、后来显露出来的意思；被动形态的细微差别另在脚注说明。
- source_word: ἀρχιποίμενος
  choice: 牧长
  rationale: 该复合词指首要、居首的牧者。“牧长”简洁庄重，并与上下文的牧养意象相连；在本句中作为指向耶稣的称号。
- source_word: κομιεῖσθε
  choice: 必得
  rationale: 将来时中间语态在这里表示领受所颁给的奖赏。“必得”既符合中文表达，也保留未来应许的确定语气。
- source_word: ἀμαράντινον
  choice: 永不衰残的
  rationale: 该词表示不会凋谢、失去鲜美或光彩。“永不衰残”保留植物花冠可能衰败的意象，同时适合现代汉语。
- source_word: τῆς δόξης
  choice: 荣耀
  rationale: 原文为属格“荣耀的”。中文以“荣耀冠冕”表达最自然，仍保留荣耀与冠冕之间的紧密修饰关系，而不把它解释为单纯“华美的冠冕”。
- source_word: στέφανον
  choice: 冠冕
  rationale: στέφανος可指授予得胜者或受尊荣者的花冠，并非专指君王的王冠。“冠冕”庄重且为普通读者可懂，具体含义由脚注补明。
theological_decisions:
- issue: “牧长”的身份
  choice: 按上下文视为指耶稣的称号，但不在正文中增补名字
  alternative: 正文译作“主耶稣这位牧长”
  rationale: 前后文的牧养意象及末世显现的语境使所指明确；保留原文简洁称号可避免加入原文没有明说的解释。
- issue: 末世显现的措辞
  choice: 显现
  alternative: 被显明
  rationale: “显现”是自然、庄重的现代汉语，也保留从隐藏到显露的意涵；脚注注明更贴近被动形态的译法，以免消除原文语法上的张力。
- issue: 冠冕意象的性质
  choice: 正文保留“冠冕”，脚注说明可指奖赏性的花冠
  alternative: 得胜者的花冠
  rationale: 原文词语本身可用于荣誉或得胜的冠冕。正文不把意象限缩为某一特定竞赛场景，脚注则防止读者误以为必是王权象征。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“牧长”保持称号的凝练感；“永不衰残”保留花冠不会凋谢的形象。句首的καί未机械译作“并且”，因为本节中文承接上文时无需明示连词，语义并无损失。
