  text: ᾧ ἀντίστητε στερεοὶ τῇ πίστει, εἰδότες τὰ αὐτὰ τῶν παθημάτων τῇ ἐν ⸀τῷ κόσμῳ ὑμῶν ἀδελφότητι ἐπιτελεῖσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/009.yaml
  text: Resist him[a], firm in the faith[c][b], knowing that the same sufferings are being experienced by your brotherhood in the world.
translation:
  language: zh_hans
  text: 你们要抵挡他，在信仰上坚定不移；因为你们知道，世上与你们同属信徒群体的弟兄姐妹也正在经历同样的苦难。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄姐妹”指整个信徒共同体，并非只指男性。这里“正在经历”也可理解为这些苦难正在他们中间发生或实现。
    reason: 说明ἀδελφότης的集合性及性别范围，并保留ἐπιτελεῖσθαι较贴近原文的另一种理解。
lexical_decisions:
- source_word: ᾧ
  choice: 他
  rationale: 关系代词指回第8节的魔鬼；汉语用明确宾语“他”自然清楚。
- source_word: ἀντίστητε
  choice: 要抵挡
  rationale: 表达命令语气和坚决对抗之意，简洁而有力度。
- source_word: στερεοὶ τῇ πίστει
  choice: 在信仰上坚定不移
  rationale: 保留“坚定”与“信仰”的关联；定冠词支持共同持守的信仰这一理解，但中文表达不排除坚定信靠的意味。
- source_word: εἰδότες
  choice: 因为知道
  rationale: 分词可表达抵挡魔鬼的根据；译作“因为知道”在现代汉语中比直译“知道着”自然。
- source_word: τὰ αὐτὰ τῶν παθημάτων
  choice: 同样的苦难
  rationale: 该结构指同类的受苦经历，并不要求事件完全相同；中文“同样的苦难”能自然保留这一点。
- source_word: τῇ ἐν τῷ κόσμῳ ὑμῶν ἀδελφότητι
  choice: 你们在世上的众弟兄
  rationale: ἀδελφότης是信徒共同体的集合名词；“众弟兄”保留其亲属性称谓，脚注说明包括男女信徒。
- source_word: ἐπιτελεῖσθαι
  choice: 正在经历
  rationale: 该被动不定式在这里可指苦难正在临到或发生于信徒群体；“正在经历”最符合现代汉语搭配，同时以脚注保留“正在完成”的形式可能。
theological_decisions:
- issue: τῇ πίστει是指客观的基督信仰，还是主观的信靠
  choice: 在信仰上
  alternative: 凭着信心
  rationale: 冠词和劝勉语境较支持在共同信仰中站稳，但二者并非截然可分；“在信仰上”避免将含义限定为单一心理行为。
- issue: ἐπιτελεῖσθαι是否带有苦难被完成或达到定量的意味
  choice: 正在经历
  alternative: 正在完成
  rationale: “苦难正在完成”虽更贴近动词形式，却在现代汉语中生硬，也可能额外暗示预定的苦难总量；正文采用语境自然的表达，脚注保存另一可能。
- issue: ἀδελφότης的性别范围
  choice: 众弟兄
  alternative: 信徒大家庭
  rationale: 保留原文的集合性亲属称谓，不把它改写成抽象群体；脚注明确此词涵盖整个信徒群体，并非只指男性。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“坚定不移”传达στερεοὶ的坚固意味；句序顺应汉语，将地点短语置于“众弟兄”之前。
