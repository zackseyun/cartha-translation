  text: ἀσπάζεται ὑμᾶς ἡ ἐν Βαβυλῶνι συνεκλεκτὴ καὶ Μᾶρκος ὁ υἱός μου.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/013.yaml
  text: She who is in Babylon[a], chosen together with you, greets you, and so does Mark[c][b], my son.
translation:
  language: zh_hans
  text: 那位在巴比伦[b]、与你们一同蒙拣选的[a]，以及我儿子马可[c]，向你们问安。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较具解释性地译作：“在巴比伦、与你们一同蒙拣选的教会。”希腊文是阴性单数的省略表达，隐含的中心名词或所指对象没有明说。
    reason: alternative_reading
  - marker: b
    text: 早期基督徒有时以“巴比伦”象征罗马；但本节原文写的是“巴比伦”。
    reason: cultural_note
  - marker: c
    text: “我儿子”很可能表示属灵关系，而不是血缘关系。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάζεται
  choice: 向……问安
  rationale: 该动词在书信语境中表示问候或致意。“向……问安”自然庄重，也保留了书信末尾问候的语气。
- source_word: ἡ ... συνεκλεκτὴ
  choice: 那位……与你们一同蒙拣选的
  rationale: 希腊文用阴性单数冠词和形容词构成省略表达，却没有明说所指名词。现代汉语无法直接呈现语法阴性，因此用“那位……的”保留所指对象未明的特点，不在正文中擅自补入“教会”或“女子”。
- source_word: ἐν Βαβυλῶνι
  choice: 在巴比伦
  rationale: 原文直接写“巴比伦”。正文保留该地名，不把可能的象征含义“罗马”代入译文。
- source_word: συνεκλεκτὴ
  choice: 与你们一同蒙拣选
  rationale: “一同”表达共同被拣选的关系；“蒙拣选”是现代中文圣经语体中自然且易懂的被动表达。
- source_word: Μᾶρκος
  choice: 马可
  rationale: 采用该人名在现代中文圣经传统中的通行译法。
- source_word: ὁ υἱός μου
  choice: 我儿子
  rationale: 原文直译为“我的儿子”。虽然这里很可能指属灵关系，正文仍保留亲属称谓，不加入原文未明说的“属灵”。
theological_decisions:
- issue: ἡ ... συνεκλεκτὴ所指为何
  choice: 正文以“那位……的”保留所指对象未明
  alternative: 译作“在巴比伦、与你们一同蒙拣选的教会”，或理解为彼得的妻子或另一位基督徒女子
  rationale: 希腊文虽为阴性单数形式，却省略了中心名词。许多解释认为隐含的是“教会”，但原文没有明说。中文正文不补足所指，并以脚注说明常见理解，以保存真实的歧义。
- issue: “巴比伦”的含义
  choice: 正文保留“巴比伦”
  alternative: 直接译作“罗马”，或理解为美索不达米亚的巴比伦
  rationale: 原文明确使用“巴比伦”这一名称，而其历史所指仍有争议，因此正文不替读者作出决定。
- issue: 马可被称为“我儿子”的关系性质
  choice: 正文保留“我儿子”
  alternative: 译作“我属灵的儿子”或“我亲爱的儿子”
  rationale: 此语很可能表示属灵亲情而非血缘关系，但原文没有显明加上“属灵的”或“亲爱的”，故把解释放入脚注。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“那位……的”在中文中略带悬念，但这是有意保留原文省略中心名词所造成的歧义；以脚注提供较通顺且常见的“教会”解释。标点将两项问安并列呈现，避免重复过多，同时保持原句结构清楚。
