  text: καὶ Δαυὶδ λέγει· Γενηθήτω ἡ τράπεζα αὐτῶν εἰς παγίδα καὶ εἰς θήραν καὶ εἰς σκάνδαλον καὶ εἰς ἀνταπόδομα αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/009.yaml
  text: And David says[b][a], “Let their table become a snare and a trap and a stumbling block and a retribution to them,”
translation:
  language: zh_hans
  text: 大卫也说：“愿他们的桌子变成网罗、陷阱、绊脚石和给他们的报应。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δαυὶδ
  choice: 大卫
  rationale: 采用现代中文圣经及一般读者熟悉的标准人名译法。
- source_word: λέγει
  choice: 说
  rationale: 保留希腊文现在时所构成的引经叙述现在时；中文用“说”自然得体。
- source_word: Γενηθήτω
  choice: 愿……变成
  rationale: 该不定过去时命令式在此表达祈愿或咒诅性的诉求；“愿”保留其祈使力度，又符合现代中文引文语体。
- source_word: τράπεζα
  choice: 筵席
  rationale: 原词基本义为“桌子”，但在诗篇引文中指摆在桌上的饮食与宴享；“筵席”保留具体意象，也比直译“桌子”更自然。
- source_word: παγίδα
  choice: 网罗
  rationale: 表示捕捉用的罗网，采用庄重而仍易懂的“网罗”，并与后面的近义词有所区别。
- source_word: θήραν
  choice: 陷阱
  rationale: 该词与狩猎、捕获有关；在并列结构中译为“陷阱”，自然呈现设法捕获的意象，并与“网罗”构成近义并列。
- source_word: σκάνδαλον
  choice: 绊脚石
  rationale: 保留使人绊倒、跌落的具体隐喻，而不缩减为主观上的“冒犯”。
- source_word: ἀνταπόδομα
  choice: 报应
  rationale: 此词指回报、偿还或报偿；在咒诅性审判语境中“报应”简洁自然，同时体现按所行而受的回报。
- source_word: αὐτοῖς
  choice: 临到他们的
  rationale: 将与“报应”相连的与格自然表达为报应所临到的对象，避免生硬的“给他们的报应”。
theological_decisions:
- issue: 诗篇69:22的咒诅性引文
  choice: 保留直接的祈愿语气：“愿……变成……”。
  alternative: “他们的筵席必变成……”或弱化为单纯预言
  rationale: Γενηθήτω是命令式，在此具有祈愿／咒诅力度；译文不将其软化为单纯的未来陈述。
- issue: ἀνταπόδομα的审判色彩
  choice: 译作“报应”。
  alternative: “报偿”或“偿还”
  rationale: 上下文明确带有不利审判意味；“报应”符合该语境，但仍保留按行为回报的基本概念，不进一步说明报应的具体方式。
translation_notes:
  register: 采用现代、庄重且便于普通读者理解的书面语。保留原文四项并列的累积力度；以“并成为”使最后一项在中文中句法清楚。
