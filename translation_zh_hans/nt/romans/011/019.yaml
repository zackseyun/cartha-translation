base_translation:
  language: en
  yaml_path: translation/nt/romans/011/019.yaml
  text: You will say then, “Branches were broken off so that I might be grafted in.”
translation:
  language: zh_hans
  text: 那么，你会说：“那些枝子被折下来，好让我被嫁接上去。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐρεῖς
  choice: 你会说
  rationale: 这是 λέγω 的将来时主动直陈语气第二人称单数。保留第二人称和将来表达，符合保罗与设想中的对话者辩论的语气。
- source_word: οὖν
  choice: 那么
  rationale: 作为推论和话语衔接词，“那么”自然承接上文，并引出对方可能提出的说法。
- source_word: Ἐξεκλάσθησαν
  choice: 被折下来
  rationale: 这是 ἐκκλάω 的不定过去时被动直陈语气；“折下来”既保留被动意义，也维持橄榄树枝子的园艺比喻。
- source_word: κλάδοι
  choice: 那些枝子
  rationale: 按橄榄树比喻直译为“枝子”；汉语中加指示词“那些”使无冠词复数名词在此语境下表达自然，但不增添新的所指。
- source_word: ἵνα
  choice: 是为了
  rationale: 保留目的或结果关系。这里是设想中的说话者所作的推论，不表示保罗认可这一推论。
- source_word: ἐγὼ
  choice: 让我
  rationale: 希腊文显式使用第一人称代词，带有突显作用；“让我”在目的从句中自然地保留第一人称的突出位置。
- source_word: ἐγκεντρισθῶ
  choice: 接上去
  rationale: 这是 ἐγκεντρίζω 的不定过去时被动虚拟语气，指园艺上的嫁接。“接上去”在现代汉语中简明自然，并由上下文清楚表达枝条被嫁接到树上的意象；不加入本节没有的“在他们中间”。
theological_decisions:
- issue: 是否明确说明说话者是保罗论辩中设想的对话者
  choice: 保留“你会说”的直接第二人称表达，不在正文中加入解释
  alternative: 译作“有人也许会说”或“那么你也许会说”
  rationale: 希腊文直接说“你会说”。上下文可显明论辩体裁，正文无需加入“有人”或把将来式改成可能式。
- issue: 是否把目的从句强化为关于上帝意旨的神学断言
  choice: 直译对话者的说法为“是为了让我接上去”
  alternative: 译作“好使我能接上去”，或补明这是上帝的目的
  rationale: 本节记录的是设想中的外邦人对话者所作的推论，并不必然代表保罗对此神学表述的认可；译文保留其原有张力，不加评断。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“那么”承接论证，“被折下来”与“接上去”共同维持橄榄树嫁接的比喻。引号标明对话者的话，不添加原文没有的解释。
