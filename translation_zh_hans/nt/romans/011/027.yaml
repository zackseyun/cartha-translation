  source_fidelity: 原文“ἡ παρ’ ἐμοῦ διαθήκη”直指“出于我／从我而来的约”；“我与他们所立的约”虽通顺，却加入“所立”这一原文未明说的动作，也将来源表达转为立约行为。ὅταν 加虚拟语气表示“当／在……的时候”，此处宜保留为“当我除去……的时候”，而非“那时我要”，后者额外明确第一人称将来形式并把从属时间从句改成独立的未来陈述。
  naturalness: “这是我给他们的约，当我除去他们的罪时。”在现代标准汉语中自然、庄重，并保留经文引语的简洁。为避免“约”单独使用略显凝缩，可译作“这是我与他们所立的约”，但该表达会比原文更具体；因此正文以“这是我给他们的约”较为贴近。
  terminology: “约”准确对应 διαθήκη，适合保留先知性盟约语境；“罪”可自然涵盖希腊文复数。“除去”准确传达 ἀφέλωμαι 的移除意象。
