  yaml_path: translation/nt/romans/011/027.yaml
  text: And this will be my covenant with them[a], when I take away their sins.
translation:
  language: zh_hans
  text: 这是我给他们的约：当我除去他们的罪时。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαθήκη
  choice: 约
  rationale: 在保罗引用先知应许的语境中，此词指上帝所设立、带有约束力的约；“约”既保留旧约经文的呼应，也比“遗嘱”或一般性的“协议”更准确。
- source_word: ἡ παρ’ ἐμοῦ διαθήκη
  choice: 我所立的约
  rationale: παρ’ ἐμοῦ 强调此约出于上帝；现代汉语用“我所立的约”自然地表达其来源和立约者，同时脚注保留较直译的形式。
- source_word: αὐτοῖς
  choice: 与他们
  rationale: 该词形式上是与格，可译作“给他们”；但汉语谈论立约关系时通常说“与他们所立的约”，更自然清楚。
- source_word: ὅταν
  choice: 那时
  rationale: 此处引出先知性应许实现之时，并非表示反复发生的“每当”；“那时”保留时间关系，也不额外断定具体时间。
- source_word: ἀφέλωμαι
  choice: 我要除去
  rationale: ἀφαιρέω 在此表示把罪除掉；“除去”是自然而庄重的现代汉语，并保留罪被移除的意象。
- source_word: ἁμαρτίας
  choice: 罪
  rationale: 汉语“罪”可自然地统称他们的诸般罪行和罪责，无须机械呈现希腊语复数。
- source_word: καὶ αὕτη
  choice: 这就是
  rationale: 希腊文为省略系词的名词句；“这就是”在汉语中完整自然，并避免仅因上下文具有前瞻性而补入文本未明说的将来系词。
theological_decisions:
- issue: 保罗引用先知应许时 διαθήκη 的性质
  choice: 约
  alternative: 遗嘱
  rationale: 上下文承接上帝向以色列所作的救赎应许；译作“约”可保存先知书的互文背景，而不引入遗嘱意义。
- issue: ὅταν ἀφέλωμαι 的时间含义
  choice: 那时我要除去他们的罪
  alternative: 每当我除去他们的罪
  rationale: 这里指应许实现的时刻，而不是反复出现的一般情形；“那时”保存其先知性和确定性，却不具体规定实现时间。
- issue: καὶ αὕτη 省略系词的处理
  choice: 这就是
  alternative: 这将是
  rationale: 原文没有明示将来时系词。上下文虽有前瞻性，但中文用“这就是”能够保留原句的简洁和一定的时间开放性；后半句的“那时我要”已清楚表达应许的未来指向。
translation_notes:
  register: 采用现代、庄重且易懂的经文语体。“所立的约”符合汉语搭配；“除去他们的罪”简洁保留原文意象。
