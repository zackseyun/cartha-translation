  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: κατὰ μὲν τὸ εὐαγγέλιον ἐχθροὶ δι’ ὑμᾶς, κατὰ δὲ τὴν ἐκλογὴν ἀγαπητοὶ διὰ τοὺς πατέρας·
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/028.yaml
  text: With respect to the gospel[a], they are enemies for your sake; but with respect to election[b], they are beloved because of the fathers.
translation:
  language: zh_hans
  text: 就福音而言，他们因你们的缘故[a]是仇敌；但就拣选而言，他们因列祖[b]的缘故是蒙爱的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “因你们的缘故”也可译作“由于你们”；这里也可能含有“使你们得益”的意思。
    reason: lexical_alternative
  - marker: b
    text: “列祖”指以色列的族长，尤其是亚伯拉罕、以撒和雅各。
    reason: cross_reference
lexical_decisions:
- source_word: κατὰ μὲν τὸ εὐαγγέλιον
  choice: 就福音而言
  rationale: κατά加宾格在此表示考量的方面或范围；“就……而言”自然地呈现μέν…δέ的对照结构，也避免误解为动作方向。
- source_word: εὐαγγέλιον
  choice: 福音
  rationale: 这是保罗书信中指所宣讲之好消息的通行且准确用语；比一般性的“好消息”更符合此处语境。
- source_word: ἐχθροὶ
  choice: 是仇敌
  rationale: 该复数形容词在句中作表语，具有关系性的名词含义。“仇敌”保留原文的力度，又不擅自补明是谁的仇敌。
- source_word: δι’ ὑμᾶς
  choice: 因你们的缘故
  rationale: διά加宾格可表达缘由，也可带有“为了……的益处”的意味；这一译法保留两者之间的空间，并符合本章外邦人得益的论述。
- source_word: κατὰ δὲ τὴν ἐκλογὴν
  choice: 但就拣选而言
  rationale: 再次以“就……而言”表达考量范围，并用“但”清楚呈现δέ与前半句的转折对照。
- source_word: ἐκλογὴν
  choice: 拣选
  rationale: 在《罗马书》9—11章的语境中，ἐκλογή涉及上帝拣选的旨意；“拣选”是准确而通行的用语，又不作超出原文的扩展。
- source_word: ἀγαπητοὶ
  choice: 是蒙爱的
  rationale: 原词表示处于被爱的地位。“蒙爱”在现代中文中自然庄重，也保留此处与“仇敌”并列的表语结构和神学张力。
- source_word: διὰ τοὺς πατέρας
  choice: 因列祖的缘故
  rationale: διά加宾格在此表达缘由或根据；“列祖”简洁保留保罗对以色列族长的盟约性称呼。
theological_decisions:
- issue: “他们”的所指
  choice: 按《罗马书》9—11章的整体论述，所指为以色列／犹太人这一群体；译文沿用未进一步限定的“他们”。
  alternative: 仅指保罗时代不信的犹太人。
  rationale: 直接语境既以整体性的以色列为主题，也涉及当时许多人的不信。译文不把所指缩窄，以保留原文的群体性和历史处境。
- issue: “仇敌”的含义
  choice: 保留“仇敌”这一关系性称谓，不补成“上帝所恨的人”或仅仅“反对福音的人”。
  alternative: 明确译为“上帝所憎恨的”，或弱化为“敌对福音的”。
  rationale: 本节刻意把“仇敌”与“蒙爱”并置；不擅自补明关系对象，能保留保罗原有的悖论和张力。
- issue: “列祖”的含义
  choice: 主文保留“列祖”，脚注说明主要指亚伯拉罕、以撒和雅各。
  alternative: 在主文直接释为“族长”或泛指所有民族祖先。
  rationale: 《罗马书》9—11章中的“列祖”自然使人想到承受应许的族长；直译并辅以脚注，既保存原文措辞，也帮助普通读者理解。
- issue: “因你们的缘故”的关系
  choice: 保留既可表示缘由、也可暗含外邦人由此得益的表述。
  alternative: 明确译为“由于你们”或“为了使你们得益”。
  rationale: διά加宾格在此不宜被单向限定；本章上下文表明以色列当前的处境与外邦人蒙恩有关，但译文不把这一解释完全写进正文。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“就……而言……但就……而言”保留原文对称结构；“仇敌”与“蒙爱”并列，避免消解经文本身的神学张力。
