source:
  edition: SBLGNT
  text: εἰ δὲ τὸ παράπτωμα αὐτῶν πλοῦτος κόσμου καὶ τὸ ἥττημα αὐτῶν πλοῦτος ἐθνῶν, πόσῳ μᾶλλον τὸ πλήρωμα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/012.yaml
  text: If their trespass means riches for the world[a], and their loss means riches for the Gentiles[b], how much more will their fullness mean?
translation:
  language: zh_hans
  text: 但如果他们的过犯成了世界的富足，他们的亏损[a]成了外邦人的富足，何况他们的丰盛[b]呢！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亏损”也可译作“失败”或“减少”。
    reason: lexical_alternative
  - marker: b
    text: “丰盛”也可理解为“全数”或“完全归入”；也有理解为“圆满实现”或“复兴”。
    reason: alternative_reading
lexical_decisions:
- source_word: παράπτωμα
  choice: 过犯
  rationale: 该词指失足、冒犯或过犯；“过犯”保留了本段中以色列所犯之错的道德含义，又不把具体性质说得过细。
- source_word: πλοῦτος
  choice: 富足
  rationale: 这里比喻上帝所赐福分的丰厚；“富足”自然地保留了原文在两个平行分句中反复出现的财富意象。
- source_word: κόσμου
  choice: 世界
  rationale: 原词在这里广泛指以色列以外、因其过犯而得益的世界；“世界”既简明，也保留了原文的宽广范围。
- source_word: ἥττημα
  choice: 亏损
  rationale: 该罕见词可指亏损、失败或减少；“亏损”能与“过犯”形成平行，又不预先断定重点在失败还是人数减少。
- source_word: ἐθνῶν
  choice: 外族人
  rationale: 在《罗马书》的语境中，该词常与以色列人或犹太人相对；“外族人”清楚表达这一对比，同时符合现代普通话表达。
- source_word: πόσῳ μᾶλλον
  choice: 何况
  rationale: 这是由较小推到较大的加强比较表达；“何况……呢”是自然凝练的汉语对应。
- source_word: πλήρωμα
  choice: 完满
  rationale: 该词可表示丰满、全数、完全纳入或圆满实现；“完满”保留其宽泛性，不在正文中裁定是数量、归入还是复兴方面的含义。
theological_decisions:
- issue: “他们的完满”（τὸ πλήρωμα αὐτῶν）的所指与含义
  choice: 正文译作宽泛的“他们的完满”
  alternative: 他们的全数；他们完全被接纳；他们的圆满实现或复兴
  rationale: 保罗的措辞简练而含义丰富，本节本身没有明确限定它是指以色列的全数、完全归入，还是末后的复兴。正文保留这一神学张力，脚注列出主要可能。
- issue: 末句省略谓语的修辞形式
  choice: 译为“何况他们的完满呢！”并保留省略
  alternative: 补足为“他们的完满岂不更会带来富足吗？”
  rationale: 希腊文末句没有明说谓语，须由前文补出。汉语也能自然使用这种省略，因此无需在正文中补入解释性成分。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。两个“成了……的富足”保留原文的平行结构和财富比喻；末句用“何况……呢”再现由小到大的论证，并保留原文省略谓语的力度。脚注标记均放在其实际说明的词后。
