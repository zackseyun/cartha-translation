  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Λέγω οὖν, μὴ ἔπταισαν ἵνα πέσωσιν; μὴ γένοιτο· ἀλλὰ τῷ αὐτῶν παραπτώματι ἡ σωτηρία τοῖς ἔθνεσιν, εἰς τὸ παραζηλῶσαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/011.yaml
  text: So I say[a], they did not stumble so as to fall, did they? May it never be! Rather, by their trespass salvation has come to the Gentiles[d][c][b], to make them jealous.
translation:
  language: zh_hans
  text: 那么，我说：难道他们失足，是要倒下吗？[a] 绝不是！反而，救恩借着他们的过犯[b]临到了外邦人[c]，为要使他们嫉妒。[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文用两个不同的词，分别表示“失足”和“倒下”；“是要”也可理解为“以致”。这个反问预期的回答是否定的。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“因着他们的违犯”。
    reason: lexical_alternative
  - marker: c
    text: 希腊文直译为“列国”；在这里是指犹太人以外的各族人，即外邦人。
    reason: lexical_alternative
  - marker: d
    text: 也可理解为“激起他们的嫉妒”或“促使他们也寻求同一救恩”；该词可包含因羡慕而受激发的意味。
    reason: alternative_reading
lexical_decisions:
- source_word: Λέγω οὖν
  choice: 所以我说
  rationale: 保留οὖν承接上文的推论作用，也以自然的汉语引出保罗接下来的反问。
- source_word: μὴ ἔπταισαν ἵνα πέσωσιν
  choice: 难道他们失足，是要倒下吗？
  rationale: 用“难道……吗”体现μή所引导的反问预期否定回答；以“失足”和“倒下”分别对应πταίω与πίπτω，不把后者解释成“永远沉沦”或“无可挽回”。“是要”可容纳目的或结果意味，具体张力在脚注说明。
- source_word: μὴ γένοιτο
  choice: 绝不是！
  rationale: 简洁有力地表达保罗惯用语的强烈否定；现代汉语自然，同时保持庄重。
- source_word: τῷ αὐτῶν παραπτώματι
  choice: 借着他们的过犯
  rationale: 将与格理解为工具或途径；“过犯”既表达道德性的违犯，也与前面的失足意象有所呼应。
- source_word: ἡ σωτηρία
  choice: 救恩
  rationale: 在《罗马书》的语境中，σωτηρία具有明确的救赎含义；“救恩”是准确且通行的现代中文圣经用语。
- source_word: τοῖς ἔθνεσιν
  choice: 临到了外族人
  rationale: ἔθνη字面可指“列国”，但在罗马书9—11章犹太人与非犹太人的对照中指非犹太人。“外族人”较现代、直白；补出“临到了”使无动词的希腊语分句成为自然汉语。
- source_word: εἰς τὸ παραζηλῶσαι αὐτούς
  choice: 为要激起他们的嫉妒
  rationale: 保留εἰς τό加不定式的目的或结果意味，并保留παραζηλόω的“嫉妒”语言，不在正文中直接改释为积极的效法或追求。
theological_decisions:
- issue: 以色列的失足是否构成最终且不可挽回的倒下
  choice: 正文区分“失足”与“倒下”，并保留反问，表明后一结论受到否定。
  alternative: 可解释为只否定立即或终局性的毁灭，或理解为完全却暂时的倒下。
  rationale: 原文有意并列πταίω和πίπτω，却没有加入“彻底”“永远”或“无可挽回”等限定语，因此译文不替保罗消解这一神学张力。
- issue: “激起嫉妒”在救恩历史中的含义
  choice: 正文直译为“激起他们的嫉妒”。
  alternative: 可理解为激发羡慕、效法，或促使他们也寻求同一救恩。
  rationale: παραζηλόω既可带负面的嫉妒意味，也可能指因看见他人所得福分而产生追求；正文保留普通的嫉妒用语，脚注提示较积极的可能含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“绝不是”比仿古式表达更自然；“外族人”避免“外邦人”可能带来的陈旧感，同时由脚注交代“列国”的字面形式。句式保留保罗从反问、强烈否定到救恩历史转折的推进。
