revisions:
- from: 神并没有弃绝自己预先认识的子民。[a] 难道你们不知道，圣经在讲以利亚的那一段[b]怎样说吗？就是以利亚怎样向神控诉以色列。[c]
  to: 神没有弃绝他所预先认识的子民。[a]难道你们不知道，圣经在论到以利亚的那一段[b]，是怎样记载以利亚向神控告以色列的吗？[c]
  rationale: 修订仅改善汉语句法和脚注措辞：以“他所预先认识的子民”更自然地呈现ὃν προέγνω；以“圣经……怎样记载以利亚……”将原文的“圣经说什么／怎样向神申诉”连成完整汉语问句。保留“控告以色列”以表达κατά的敌对方向，不在正文中加入任何关于预知、拣选或以色列范围的神学解释。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T03:51:06Z'
