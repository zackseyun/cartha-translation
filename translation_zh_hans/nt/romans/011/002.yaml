source:
  edition: SBLGNT
  text: οὐκ ἀπώσατο ὁ θεὸς τὸν λαὸν αὐτοῦ ὃν προέγνω. ἢ οὐκ οἴδατε ἐν Ἠλίᾳ τί λέγει ἡ γραφή, ὡς ἐντυγχάνει τῷ θεῷ κατὰ τοῦ ⸀Ἰσραήλ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/002.yaml
  text: God has not rejected his people[a], whom he foreknew. Or do you not know what the Scripture says in the passage about Elijah[c][b], how he appeals to God against Israel?
translation:
  language: zh_hans
  text: 神没有弃绝他所预先认识的子民。[a]难道你们不知道，圣经在论到以利亚的那一段[b]，是怎样记载以利亚向神控告以色列的吗？[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “预先认识”也可译作“预先知道”。有人将这个词理解为含有“预先拣选”的较强意思，但这里保留原词本身的神学张力。
    reason: alternative_reading
  - marker: b
    text: 希腊原文直译为“在以利亚中”，是指圣经中论到以利亚的那一段。
    reason: lexical_alternative
  - marker: c
    text: “向神控告以色列”也可译作“向神申诉，反对以色列”。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἀπώσατο
  choice: 并没有弃绝
  rationale: ἀπωθέομαι在这里表示拒绝、摒弃或断绝关系；“弃绝”简洁庄重，也符合本节关于神是否抛弃其子民的语境。
- source_word: τὸν λαὸν αὐτοῦ
  choice: 自己的……子民
  rationale: λαός在保罗书信中常指属神的约民；“自己的子民”保留归属关系，不在前半句提前补入“以色列”。
- source_word: ὃν προέγνω
  choice: 预先认识
  rationale: προγινώσκω的基本形式是“预先知道／认识”。“预先认识”既保留以人为宾语的表达，也不把较强的“预先拣选”直接写入正文。
- source_word: ἢ οὐκ οἴδατε
  choice: 难道你们不知道
  rationale: 用自然的现代汉语呈现保罗的反问语气。
- source_word: ἐν Ἠλίᾳ
  choice: 在讲以利亚的那一段
  rationale: 原文直译为“在以利亚中”，是指圣经中有关以利亚的段落；意译可避免现代读者误解为空间意义。
- source_word: ἡ γραφή
  choice: 圣经
  rationale: γραφή在这里指神圣经文；“圣经”是现代汉语中清楚自然的对应表达。
- source_word: ὡς ἐντυγχάνει τῷ θεῷ
  choice: 怎样向神控诉
  rationale: ἐντυγχάνω可指向某人陈情、请求或申诉；与后面的“反对以色列”结合时，“向神控诉”准确表达其不利于以色列的诉求。
- source_word: κατὰ τοῦ Ἰσραήλ
  choice: 以色列
  rationale: κατά加属格表示“反对、控告”；这一方向已由“控诉”表达，因此直接以“以色列”为宾语，保留专名的整体含义。
theological_decisions:
- issue: προέγνω与神拣选之间的关系
  choice: 预先认识
  alternative: 预先知道；预先眷爱；预先拣选
  rationale: 本节涉及保罗关于拣选的更广泛论述，但προέγνω本身不要求译者在此判定它是否必然包含预先拣选。“预先认识”保留词义及其神学张力。
- issue: “神的子民”在本节所指的范围
  choice: 不在前半句增译“以色列”
  alternative: 自己的以色列子民
  rationale: 原文前半句只说“他的子民”，后半句才明确出现“以色列”。译文维持这一行文次序，避免补入原文未明说的限定。
translation_notes:
  register: 采用现代、清楚而庄重的普通话。“弃绝”“子民”“圣经”保持经文语体；反问句与随后“就是……”的说明，使较长的希腊句法在汉语中自然连贯。所有解释性选择均以脚注标明，正文不替读者消解προέγνω的神学含义。
