id: ROM.11.26
reference: Romans 11:26
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ οὕτως πᾶς Ἰσραὴλ σωθήσεται· καθὼς γέγραπται· Ἥξει ἐκ Σιὼν ὁ ⸀ῥυόμενος, ἀποστρέψει ἀσεβείας ἀπὸ Ἰακώβ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/026.yaml
  text: 'And in this way all Israel will be saved[a], just as it is written: “The Deliverer will come from Zion[c][b]; he will turn away ungodliness from Jacob.”'
translation:
  language: zh_hans
  text: '这样，以色列全体都将得救[a][b]，正如经上所记：


    “拯救者必从锡安而来[c]；

    他必使不敬虔离开雅各。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以色列全体”的所指在释经上有争议；这里保留原文措辞，不断定它是指以色列民族的整体、其中信靠者的余民，还是上帝子民的整体。
    reason: alternative_reading
  - marker: b
    text: “这样”也可译作“如此”或“于是”。希腊语 οὕτως 可表示方式；这里很可能指上文刚说明的过程。
    reason: lexical_alternative
  - marker: c
    text: “从锡安而来”也可译作“从锡安出来”。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: 这样
  rationale: 保留方式副词的含义，较自然地指向上文所述的过程，同时不排除“如此、于是”的理解。
- source_word: πᾶς Ἰσραήλ
  choice: 以色列全体
  rationale: 忠实保留整体性表达，又不在译文中限定它究竟指民族以色列、其中信靠者的余民，还是上帝子民的整体。
- source_word: σωθήσεται
  choice: 都将得救
  rationale: 将将来时被动语态译出，并保留保罗语境中明确的救恩含义。
- source_word: καθὼς γέγραπται
  choice: 正如经上所记
  rationale: 采用现代中文圣经引文公式的自然、庄重表达，也体现前述论断与经文的对应。
- source_word: Ἥξει
  choice: 必……而来
  rationale: “必”符合预言引文的语体，“而来”自然表达将来的来到。
- source_word: ἐκ Σιὼν
  choice: 从锡安而来
  rationale: 准确表达起点或来源；“从锡安出来”也是较贴近字面的可能译法。
- source_word: ὁ ῥυόμενος
  choice: 拯救者
  rationale: 把带冠词的实体化分词译为称号式名词，既简洁庄重，也保留施行解救者的含义。
- source_word: ἀποστρέψει
  choice: 必使……离开
  rationale: 保留动词“使转离”的意象，避免直接释义为“除去”。
- source_word: ἀσεβείας
  choice: 不敬虔之事
  rationale: 兼顾该复数名词的宗教、道德含义及中文可读性。
- source_word: ἀπὸ Ἰακώβ
  choice: 离开雅各
  rationale: 保留介词所表达的分离关系和“雅各”这一经文用名，不将其改写为“以色列”。
theological_decisions:
- issue: “以色列全体”的所指
  choice: 保留“以色列全体”，不作解释性扩写
  alternative: 以色列民族的整体；以色列中蒙拣选的余民；包括外族人在内的上帝全体子民
  rationale: 原文所指在释经上存在争议，译文不应替读者消除这一神学张力。
- issue: “拯救者”的身份
  choice: 采用称号式的“拯救者”，但中文不借助大小写额外标示
  alternative: 施行拯救的那一位；救援者
  rationale: 实体化分词具有称号性质；上下文可承载其弥赛亚含义，而中文译文无需加入原文未明说的专名化标记。
- issue: 使不敬虔离开雅各
  choice: 保留不敬虔之事被使之离开的语法意象
  alternative: 除去雅各的不敬虔；使雅各离弃不敬虔
  rationale: 所选译法避免把原文明确改写成雅各主动离弃不敬虔，同时保留拯救者施行行动的主语地位。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。引文分行以体现经文诗体；“不敬虔之事”略带正式色彩，用来保留原文复数名词及宗教伦理力度。所有脚注标记均置于正文相应位置。
