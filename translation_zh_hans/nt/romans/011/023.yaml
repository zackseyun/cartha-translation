  text: κἀκεῖνοι δέ, ἐὰν μὴ ⸀ἐπιμένωσι τῇ ἀπιστίᾳ, ἐγκεντρισθήσονται· δυνατὸς γάρ ⸂ἐστιν ὁ θεὸς⸃ πάλιν ἐγκεντρίσαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/023.yaml
  text: And even they[a], if they do not continue in unbelief, will be grafted in[b]; for God is able to graft them in again.
translation:
  language: zh_hans
  text: 他们若不继续不信，也会被接上[a]；因为上帝能再把他们接上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“被嫁接上”。原文的“再／重新”只在后一句明确出现。
    reason: alternative_reading
lexical_decisions:
- source_word: κἀκεῖνοι δέ
  choice: 至于他们……也
  rationale: 既承接上文，又保留καί的附加意味；“他们”指先前因不信而被折下的枝子。
- source_word: ἐὰν μὴ ἐπιμένωσι τῇ ἀπιστίᾳ
  choice: 如果不再执迷于不信
  rationale: ἐπιμένω表示持续、坚持某种状态；“执迷于”自然传达持续不改的意味，ἀπιστία在本段主要指不信。
- source_word: ἐγκεντρισθήσονται
  choice: 会被接回去
  rationale: 采用果树嫁接语境中的自然汉语“接”，并根据上下文说明这些枝子重新归入原树；恢复意味虽由上下文得出，但希腊文此处动词本身没有πάλιν，故以脚注说明。
- source_word: δυνατὸς γάρ ἐστιν ὁ θεὸς
  choice: 因为上帝能够
  rationale: 准确表达上帝具备实行此事的能力，并保留γάρ所引出的理由。
- source_word: πάλιν ἐγκεντρίσαι αὐτούς
  choice: 把他们重新接上
  rationale: “重新”明确对应πάλιν；“接上”延续橄榄树嫁接的比喻，表达简洁自然。
theological_decisions:
- issue: ἀπιστία在本节中的性质
  choice: 译为“不信”
  alternative: 不忠信
  rationale: 罗马书11章直接以信与不信解释枝子的存留和折下，因此“不信”最贴合当前论证，同时不把它扩展为更宽泛的盟约不忠。
- issue: 第一处嫁接动词是否明说恢复
  choice: 正文译作“接回去”，并用脚注交代其上下文性质
  alternative: 严格译作“接上”
  rationale: 这些枝子此前已从自己的橄榄树上被折下，汉语“接回去”自然呈现上下文中的恢复关系；但πάλιν只在后一分句明说，因此脚注保留原文措辞层面的区别。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“接上”比技术色彩较重的“嫁接进去”更符合树枝嫁接的自然汉语；以“接回去／重新接上”维持全节比喻的一致性。
