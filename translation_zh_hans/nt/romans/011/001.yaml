id: ROM.11.1
reference: Romans 11:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Λέγω οὖν, μὴ ἀπώσατο ὁ θεὸς τὸν λαὸν αὐτοῦ; μὴ γένοιτο· καὶ γὰρ ἐγὼ Ἰσραηλίτης εἰμί, ἐκ σπέρματος Ἀβραάμ, φυλῆς Βενιαμίν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/001.yaml
  text: So I ask[a], has God rejected his people? May it never be! For I myself am an Israelite, from the offspring of Abraham[c][b], of the tribe of Benjamin.
translation:
  language: zh_hans
  text: 那么我要问：难道神弃绝了自己的子民吗？[a] 绝对不是！[b] 因为我自己也是以色列人，是亚伯拉罕的后裔[c]，属于便雅悯支派。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弃绝”也可译作“抛弃”或“推开”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文是一个表示强烈否定的惯用语，直译近似“愿这事绝不发生！”也可译作“断乎不是！”
    reason: lexical_alternative
  - marker: c
    text: “后裔”希腊文直译为“种子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγω οὖν
  choice: 那么我要问
  rationale: λέγω在这里引出修辞性问句，οὖν承接上文并带有推论意味；“那么我要问”既自然，也保留论证的衔接。
- source_word: μὴ ἀπώσατο
  choice: 难道……弃绝了……吗
  rationale: μή引导的问题预期否定回答；ἀπωθέομαι表示推开、拒绝或弃绝。“难道……弃绝了……吗”在现代汉语中清楚表达这种修辞语气。
- source_word: τὸν λαὸν αὐτοῦ
  choice: 自己的子民
  rationale: λαός在此指属于神的群体；“自己的子民”保留所属关系及经文中的圣约背景，而不额外限定其范围。
- source_word: μὴ γένοιτο
  choice: 绝对不是！
  rationale: 这是保罗常用的强烈否定表达，比普通的“不”更有力度；此译自然、庄重，并保留坚决驳斥的语气。
- source_word: καὶ γὰρ ἐγὼ
  choice: 因为我自己也是
  rationale: γάρ说明理由，καί与强调的ἐγώ表明保罗本人也是例证；“我自己也是”准确传达其自我举证的作用。
- source_word: Ἰσραηλίτης
  choice: 以色列人
  rationale: 直接表达保罗的民族及圣约群体身份，不作额外解释。
- source_word: ἐκ σπέρματος Ἀβραάμ
  choice: 是亚伯拉罕的后裔
  rationale: σπέρμα字面为“种子”，在族谱语境中指后代；“后裔”是现代汉语中准确、自然且庄重的表达。
- source_word: φυλῆς Βενιαμίν
  choice: 属于便雅悯支派
  rationale: φυλή意为“支派”；“属于……支派”明确表达保罗的支派归属，并符合现代汉语习惯。
theological_decisions:
- issue: 保罗的问题是否明确指神彻底或永远弃绝以色列
  choice: 仅译为“神弃绝了自己的子民吗”，不添加“彻底”或“永远”等限定词。
  alternative: “神彻底弃绝了自己的子民吗”或“神永远抛弃了自己的子民吗”。
  rationale: 希腊文本没有“彻底”或“永远”等副词；应保留问题本身的范围与张力，让后文展开其含义，避免把特定神学结论预先写入本节。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“绝对不是”保留原文强烈驳斥的力度；“子民”“后裔”“支派”沿用大众熟悉的圣经语汇，同时避免古奥句式。
