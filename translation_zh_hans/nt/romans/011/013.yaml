review_pass:
  verdict: revise
  source_fidelity: “外族人”虽试图表达ἔθνη与以色列的对照，但现代汉语通常指来自别国的个人，容易偏离保罗所说的非犹太群体。“看重”不足以表达δοξάζω所含的尊荣、使显为荣耀之意。
  naturalness: 原句整体通顺，但“你们外族人”不如“你们外邦人”符合现代中文圣经语境及本段的族群对照。“使我的服事得荣耀”庄重而可懂，也较准确保留原文动词的力度。
  terminology: 建议采用“外邦人”，这是罗马书9—11章中与“以色列”相对时对ἔθνη的准确且既有的中文术语。“服事”可保留为διακονία的现代译法。
  issues:
  - severity: medium
    issue: “外族人”不准确地呈现ἔθνη／ἐθνῶν。
    rationale: “外族人”在现代汉语中常指外国人或异族个人；本处在罗马书的语境中指非犹太人整体。“外邦人”更明确、自然地保留这一历史—族群对照。
  - severity: medium
    issue: “看重”弱化δοξάζω。
    rationale: δοξάζω的基本语义是荣耀、尊荣、使得荣耀；“看重”只表达重视，未充分呈现原文的修辞力度。采用“使我的服事得荣耀”能保留其及物用法，又不把荣耀归于保罗本人。
