  text: Ὑμῖν ⸀δὲ λέγω τοῖς ἔθνεσιν. ἐφ’ ὅσον μὲν ⸀οὖν εἰμι ἐγὼ ἐθνῶν ἀπόστολος, τὴν διακονίαν μου δοξάζω,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/013.yaml
  text: I am speaking to you Gentiles[a]. Inasmuch, then, as I am an apostle to the Gentiles, I magnify my ministry[b],
translation:
  language: zh_hans
  text: 我对你们外邦人说：既然我是外邦人的使徒，我就使我的服事得荣耀[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我荣耀我的服事”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμῖν δὲ λέγω τοῖς ἔθνεσιν
  choice: 不过，我要对你们外族人说
  rationale: δὲ在此表示话题转折，用“不过”自然衔接上下文；Ὑμῖν与τοῖς ἔθνεσιν合起来构成直接称呼。鉴于本段将以色列与非犹太人相对，“外族人”比地缘政治意义上的“列国”更明确。
- source_word: ἐφ’ ὅσον μὲν οὖν
  choice: 既然
  rationale: 这一组合在此引出保罗下述行动所依据的身份；汉语用“既然”简洁表达其逻辑关系，无须逐一对应语气词。
- source_word: ἐγὼ ἐθνῶν ἀπόστολος
  choice: 我是外族人的使徒
  rationale: 保留ἐγώ的强调意味和属格结构可能具有的简洁性；“使徒”表达保罗特定的受差遣职分，而非泛指信使。
- source_word: τὴν διακονίαν μου
  choice: 我的服事
  rationale: διακονία指保罗受托承担的使徒工作；“服事”既保留服务之义，也避免“事工”较强的教会圈内术语色彩。
- source_word: δοξάζω
  choice: 我就看重
  rationale: 此处不是说保罗荣耀自己，而是重视并尊荣所领受的服事。“看重”是自然现代汉语，能表达赋予高度价值之意；脚注保留更贴近字面的替代译法。
theological_decisions:
- issue: 保罗如何对待自己的服事
  choice: 他看重自己所领受的服事
  alternative: 他荣耀自己的服事
  rationale: δοξάζω的宾语是“我的服事”，不是保罗本人；上下文说明他尊重这一使命及其救赎目的，而非自我夸耀。译文不把这种张力扩展为特定的自夸神学。
- issue: ἔθνη / ἐθνῶν所指
  choice: 外族人
  alternative: 列国
  rationale: 罗马书9—11章持续对照以色列与非犹太群体，因此这里主要是族群和救赎历史意义上的外族人，而非政治实体“列国”。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“外族人”清楚呈现与以色列的语境性对照；“服事”保留διακονία的服务意味。句末逗号依照原文，表明本节语意在下一节继续。
