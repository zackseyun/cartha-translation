id: ROM.11.10
reference: Romans 11:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: σκοτισθήτωσαν οἱ ὀφθαλμοὶ αὐτῶν τοῦ μὴ βλέπειν, καὶ τὸν νῶτον αὐτῶν διὰ παντὸς σύγκαμψον.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/010.yaml
  text: Let their eyes be darkened so that they may not see[b][a], and bend their back continually.
translation:
  language: zh_hans
  text: 愿他们的眼睛昏暗[a]，以致不能看见；愿你使他们的背不断弯曲[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“失明”。希腊文直译为“昏暗”，保留了所引经文中的黑暗意象。
    reason: lexical_alternative
  - marker: b
    text: 或译：“总是弯曲”。原短语可表示持续不断或始终如此。
    reason: lexical_alternative
lexical_decisions:
- source_word: σκοτισθήτωσαν
  choice: 愿……昏暗
  rationale: 该词是第三人称复数被动命令式，在这里带有祈愿、求审判的语气。“昏暗”保留了希腊文及其所引诗篇的黑暗意象，没有直接解释为“失明”。
- source_word: οἱ ὀφθαλμοὶ αὐτῶν
  choice: 他们的眼睛
  rationale: 按原文直译，保留身体部位所承载的比喻意象。
- source_word: τοῦ μὴ βλέπειν
  choice: 以致不能看见
  rationale: 带冠词的不定式与 μή 可表达目的或结果。“以致”在现代汉语中自然，并让目的与结果之间的张力保持开放；“不能看见”表达由眼睛昏暗所造成的无能。
- source_word: τὸν νῶτον αὐτῶν
  choice: 他们的背
  rationale: νῶτον 是单数，但在此可作集合性表达；汉语“他们的背”自然地保留原文形式和身体意象。
- source_word: διὰ παντός
  choice: 不断
  rationale: 该短语表示持续、经常或始终如此。“不断”表达持续性，却不额外引入“直到永远”的终极含义。
- source_word: σύγκαμψον
  choice: 愿你使……弯曲
  rationale: 该词是第二人称单数主动命令式，语境中是向上帝发出的祈求。“愿你使”明确保留神圣施动者和祈愿语气；“弯曲”直接对应背部被压弯的身体图像。
theological_decisions:
- issue: 咒诅性引文与上帝的施动
  choice: 保留祈愿兼命令的力度：“愿他们……；愿你使……”。
  alternative: 译为单纯预言（“他们的眼睛必昏暗”），或改成不说明施动者的被动后果。
  rationale: 保罗引用的经文带有求上帝施行审判的语气。译文不把严厉的祈愿弱化为预测，也不添加原文没有给出的神学解释。
- issue: τοῦ μὴ βλέπειν 的目的—结果关系
  choice: 译作“以致不能看见”。
  alternative: 译作“为使他们不能看见”或“使他们看不见”。
  rationale: 希腊文结构可指目的或结果。采用“以致”较自然地呈现眼睛昏暗与不能看见的关联，同时避免把句法关系限定为纯粹目的。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“愿……；愿你……”再现引文的祈愿、审判语气；“昏暗”“背……弯曲”保留原文鲜明的身体与黑暗意象。
