id: ROM.11.24
reference: Romans 11:24
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἰ γὰρ σὺ ἐκ τῆς κατὰ φύσιν ἐξεκόπης ἀγριελαίου καὶ παρὰ φύσιν ἐνεκεντρίσθης εἰς καλλιέλαιον, πόσῳ μᾶλλον οὗτοι οἱ κατὰ φύσιν ἐγκεντρισθήσονται τῇ ἰδίᾳ ἐλαίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/024.yaml
  text: For if you were cut from what is by nature a wild olive tree and[a], contrary to nature, were grafted into a cultivated olive tree, how much more will these, the natural branches[b], be grafted into their own olive tree.
translation:
  language: zh_hans
  text: 因为，你若从本来就是野生的橄榄树上被砍下，又违背本性地被嫁接到栽培的橄榄树上，那么，这些本来就属于这棵树的枝子[a]，岂不更会被嫁接到自己的橄榄树上吗？[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“这些按本性的”；原文没有“枝子”一词，此词按上下文的橄榄树比喻补出。
    reason: 说明语境补词并保留原文表达的简略性。
  - marker: b
    text: 也可译作“岂不更会被嫁接回自己的橄榄树上吗？”“回”的意思可由上下文推知，但希腊文动词本身没有明说。
    reason: 呈现语境隐含但词面未明说的另一译法。
lexical_decisions:
- source_word: ἐξεκόπης
  choice: 被砍下来
  rationale: ἐκκόπτω的核心意思是“砍下、砍掉”。此处采用“砍下来”，既符合园艺比喻，也不受上文“折下来”的措辞同化。
- source_word: τῆς κατὰ φύσιν ἀγριελαίου
  choice: 本来就是野生的橄榄树
  rationale: κατὰ φύσιν在这里说明受话者按本性出自野橄榄树；“本来就是野生的”以自然汉语保留这一含义。
- source_word: παρὰ φύσιν
  choice: 有违自然地
  rationale: 保留与κατὰ φύσιν的鲜明对照，同时避免把“自然”扩展解释为某种明确的自然规律。
- source_word: ἐνεκεντρίσθης / ἐγκεντρισθήσονται
  choice: 接到
  rationale: ἐγκεντρίζω是嫁接用语。现代汉语园艺语境可用“接到”，简洁地表达枝条被嫁接到树上；被动关系由“被……接到”和上下文体现。
- source_word: καλλιέλαιον
  choice: 栽培的橄榄树
  rationale: 该词与野橄榄树相对，指经栽培的橄榄树；此译比“好橄榄树”更准确，且不增添价值判断。
- source_word: πόσῳ μᾶλλον
  choice: 岂不更要
  rationale: 结合全句的反问结构，传达由较难之事推及较易之事的“何况、更何况”论证力度。
- source_word: οὗτοι οἱ κατὰ φύσιν
  choice: 这些本来就属于这树的枝子
  rationale: 希腊文直译为“这些按本性的”，并未明说“枝子”；但上下文的橄榄树嫁接比喻清楚省略了“枝子”。补出该词使现代汉语完整易懂，同时以脚注说明。
- source_word: τῇ ἰδίᾳ ἐλαίᾳ
  choice: 到自己的橄榄树上
  rationale: ἰδίᾳ强调这棵橄榄树是“他们自己的”；“接到……树上”符合汉语嫁接表达。
theological_decisions:
- issue: 是否在本节明说“这些”是犹太人或以色列人
  choice: 保留橄榄树比喻，译作“这些本来就属于这树的枝子”
  alternative: 这些犹太人／这些以色列人
  rationale: 罗马书11章的上下文清楚指向以色列，但本节希腊文没有直接使用族群名称。保留比喻可避免把上下文所指写成原句明说的内容。
- issue: 是否将末句译为“接回”自己的橄榄树
  choice: 正文译作“接到自己的橄榄树上”
  alternative: 接回自己的橄榄树上
  rationale: 重归的意思由上下文可以推知，但ἐγκεντρισθήσονται本身只表示“将被嫁接”。正文不加“回”，以免把隐含意义当作词面明说；脚注列出自然的语境译法。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。保留保罗从“有违自然”到“本来属于”的强弱对比和橄榄树嫁接意象；用反问句体现πόσῳ μᾶλλον的修辞力量。
