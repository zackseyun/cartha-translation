id: ROM.11.36
reference: Romans 11:36
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὅτι ἐξ αὐτοῦ καὶ δι’ αὐτοῦ καὶ εἰς αὐτὸν τὰ πάντα· αὐτῷ ἡ δόξα εἰς τοὺς αἰῶνας, ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/036.yaml
  text: For from him and through him and to him are all things[a]. To him be the glory forever[b]. Amen.
translation:
  language: zh_hans
  text: 因为万有都出于他，借着他，也归于他。愿荣耀归给他，直到永远[a]！阿们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“直到众世代”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 在这里引出前文颂赞的根据；“因为”自然保留明确的因果关系。
- source_word: ἐξ αὐτοῦ
  choice: 出于他
  rationale: ἐξ加属格表示来源；“出于他”简洁地表达万有以神为源头。
- source_word: δι’ αὐτοῦ
  choice: 借着他
  rationale: διά加属格表示媒介或施事；“借着他”保留万有经由他的意思，又不将其缩窄为单一方式。
- source_word: εἰς αὐτόν
  choice: 归于他
  rationale: εἰς表示方向、目标或归宿；“归于他”在现代汉语中兼具方向性和终极指向，同时不把含义过度解释为单纯“为了他”。
- source_word: τὰ πάντα
  choice: 万有
  rationale: 带冠词的中性复数具有包罗一切的宇宙性范围；“万有”凝练、庄重，并与颂赞语体相称。
- source_word: αὐτῷ ἡ δόξα
  choice: 愿荣耀归给他
  rationale: 希腊文是无动词的颂赞归荣耀句；补出“愿……归给”符合自然汉语的赞颂表达，不额外加入神学判断。
- source_word: εἰς τοὺς αἰῶνας
  choice: 直到永远
  rationale: 原文直译为“直到众世代”，是表达无尽持续的惯用语；“直到永远”清楚自然。
- source_word: ἀμήν
  choice: 阿们
  rationale: 采用现代汉语基督教语境中通行的音译，保留礼仪性的确认与赞同。
theological_decisions:
- issue: 重复代词αὐτοῦ／αὐτόν／αὐτῷ所指为何
  choice: 依照罗马书11:33—35的上下文理解为神，但正文始终保留“他”
  alternative: 在译文中直接以“神”替换代词
  rationale: 上下文明确是一段向神发出的颂赞；保留原文代词的重复结构，既让读者由语境辨明所指，也避免在正文中作超出原文形式的明示。
- issue: εἰς αὐτόν的目的或归向含义
  choice: 译作“归于他”，保留方向、目标和终极归宿之间的张力
  alternative: 译作“为了他”或“以他为归宿”
  rationale: “为了他”偏重目的，“以他为归宿”则解释性较强；“归于他”更能开放地承载原文εἰς的多重关联。
- issue: αὐτῷ ἡ δόξα的无动词颂赞结构
  choice: 译作“愿荣耀归给他”
  alternative: “荣耀是他的”或“荣耀归给他”
  rationale: “愿荣耀归给他”自然呈现颂赞和祈愿语气；“荣耀是他的”较像陈述归属，而不如原句具有直接赞颂的力量。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“万有都出于他，借着他，也归于他”保留原文三个介词短语的平行与递进；避免较陈旧的“本于、倚靠、归于”组合，因为“倚靠”容易把διά的媒介意义误解为受造物对神的信赖。
