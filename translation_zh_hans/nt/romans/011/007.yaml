source:
  edition: SBLGNT
  text: τί οὖν; ὃ ἐπιζητεῖ Ἰσραήλ, τοῦτο οὐκ ἐπέτυχεν, ἡ δὲ ἐκλογὴ ἐπέτυχεν· οἱ δὲ λοιποὶ ἐπωρώθησαν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/007.yaml
  text: What then? Israel did not obtain what it seeks[a], but the elect obtained it, and the rest were hardened[b],
translation:
  language: zh_hans
  text: 那么，结果如何呢？以色列没有得到自己所寻求的；蒙拣选的人却得到了，其余的人则变得刚硬了[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “变得刚硬了”也可译作“变得麻木了”。原文可指心灵刚硬或失去属灵的敏锐。
    reason: lexical_alternative
lexical_decisions:
- source_word: τί οὖν
  choice: 那么，怎么说呢？
  rationale: 保留保罗承接上文、引出结论的推论性反问语气，同时使用自然的现代汉语表达。
- source_word: ὃ ἐπιζητεῖ Ἰσραήλ
  choice: 以色列……自己所寻求的
  rationale: 将以色列理解为群体，并以“所寻求的”表达现在时所指的持续追求，不擅自补明其对象。
- source_word: τοῦτο οὐκ ἐπέτυχεν / ἐπέτυχεν
  choice: 没有得到……却得到了
  rationale: 前后重复同一动词，保留原文鲜明的对照；“得到”适合所追求之物，且通俗自然。
- source_word: ἡ δὲ ἐκλογὴ
  choice: 蒙拣选的人
  rationale: ἐκλογή字面可指“拣选”，但这里与复数意义的“其余的人”对照，宜理解为被拣选的群体；“蒙拣选的人”也保留了受动意味。
- source_word: οἱ δὲ λοιποὶ
  choice: 其余的人
  rationale: 明确指与蒙拣选者相对的其余群体，简洁自然。
- source_word: ἐπωρώθησαν
  choice: 变得刚硬了
  rationale: 保留“硬化、麻木”的隐喻和被动形式，不把未明说的施事者补入正文。
theological_decisions:
- issue: ἡ ἐκλογὴ在本节中的所指
  choice: 译作“蒙拣选的人”，指被拣选的群体。
  alternative: 译作抽象名词“拣选”。
  rationale: 上下文将其与“其余的人”相对，表明这里很可能以抽象名词转指人；此译法不进一步界定拣选的机制或范围。
- issue: ἐπωρώθησαν的施事者与神学含义
  choice: 保留被动表达“变得刚硬了”，不说明是谁使他们刚硬。
  alternative: 明确译为“上帝使他们刚硬”或“他们使自己刚硬”。
  rationale: 希腊文在本句没有明说施事者；译文保留神圣审判与人的责任之间未被本句明确消解的张力。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“那么，怎么说呢？”保留论辩语气；分号突出以色列整体未得与蒙拣选者得着之间的对照。正文唯一脚注标记[a]已对应脚注。
