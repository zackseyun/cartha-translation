  source_fidelity: “那么，怎么说呢？”在现代汉语中较容易理解为“那么该如何表述”，没有准确呈现τί οὖν承接论证并提出结论的修辞问句。改为“那么，结果如何呢？”更贴合此处“那么，结论是什么？”的语用功能。其余主要对照均忠实：以色列未得所追求的，蒙拣选者得着，其余者刚硬；末句不指定被动的施事者。
  naturalness: 修订后的开头庄重、自然，并与保罗书信的论辩文体相称。“蒙拣选的人”“其余的人则变得刚硬了”均为现代标准汉语中清楚可懂的表达。
  terminology: “蒙拣选的人”恰当地把ἐκλογή在本处转指人的用法译出，同时不把拣选的机制加入文本。“刚硬”保留πωρόω的核心隐喻；脚注提供“麻木”的可行替代，未将未明言的施事者写入正文。
