  naturalness: 原译整体庄重清楚，但“为要使他们借着你们所蒙的怜悯，如今也蒙怜悯”中“使他们借着”搭配略显拗口。调整语序后，目的分句更符合现代书面汉语，同时不改变原文的句法关系或神学含义。
  terminology: “不顺从”恰当地保留ἀπειθέω在本段可含不信与悖逆的语义范围；“怜悯／蒙怜悯”前后一致，并保留神为隐含施恩者的被动表达。“这些人”保留上下文所指以色列人的指示性，无须在正文补足。
