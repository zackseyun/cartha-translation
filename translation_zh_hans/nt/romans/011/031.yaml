  text: οὕτως καὶ οὗτοι νῦν ἠπείθησαν τῷ ὑμετέρῳ ἐλέει ἵνα καὶ αὐτοὶ ⸀νῦν ἐλεηθῶσιν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/031.yaml
  text: So also these now have been disobedient[a], so that by the mercy shown to you they also may now receive mercy.
translation:
  language: zh_hans
  text: 同样，这些人如今也不顺从，好叫他们也借着你们所蒙的怜悯，如今蒙怜悯。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως καὶ
  choice: 同样……也
  rationale: 承接上一节形成类比，既保留推论和对应关系，也符合现代汉语表达。
- source_word: οὗτοι
  choice: 这些人
  rationale: 保留指示代词的明确性；按上下文指以色列人，而不在正文中直接补明。
- source_word: νῦν
  choice: 如今
  rationale: 保留保罗关于救恩历史现阶段的时间强调；两处均予以译出。
- source_word: ἠπείθησαν
  choice: 不顺从
  rationale: ἀπειθέω兼有不信与不顺服的语义；“不顺从”保留较宽广的盟约性含义，避免将其缩减为思想上的不信。
- source_word: τῷ ὑμετέρῳ ἐλέει
  choice: 借着你们所蒙的怜悯
  rationale: 将紧缩的与格短语理解为神向外族信徒所施的怜悯，并以“所蒙的”清楚表达领受关系；脚注保留更直译且可能指向信徒施怜悯的读法。
- source_word: ἵνα
  choice: 为要使
  rationale: 自然表达目的或结果关系，同时不强行消除二者之间的张力。
- source_word: καὶ αὐτοὶ
  choice: 他们……也
  rationale: 保留以色列人同样被纳入蒙怜悯之目的中的强调，避免生硬地译成“他们自己也”。
- source_word: ἐλεηθῶσιν
  choice: 蒙怜悯
  rationale: 保留被动形式及神为施怜悯者的含义，且是自然、庄重的现代汉语。
theological_decisions:
- issue: “你们的怜悯”是指外族信徒施出的怜悯，还是神向他们所施的怜悯
  choice: 你们所蒙的怜悯
  alternative: 你们的怜悯
  rationale: 罗马书11:30–32的论述以两群人的悖逆和领受神的怜悯相互对应，因此正文采用神向外族信徒所施怜悯的理解；但希腊语与格短语较为紧缩，故用脚注保留另一种可能。
- issue: ἵνα表达目的还是结果
  choice: 为要使
  alternative: 以致
  rationale: “为要使”较直接保留ἵνα的目的色彩，同时上下文仍容许读者体会结果含义，不把神学关系过度定死。
translation_notes:
  register: 采用现代、庄重而易懂的书面语。“这些人”保留原文指示性，“不顺从”维持不信与悖逆之间的语义张力；两个“如今”均保留，以反映原文的时间强调。
