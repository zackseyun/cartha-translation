  text: εἴ πως παραζηλώσω μου τὴν σάρκα καὶ σώσω τινὰς ἐξ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/014.yaml
  text: if somehow I may provoke my own people to jealousy and save some of them[a].
translation:
  language: zh_hans
  text: 或许可以激起我的骨肉同胞[a]的嫉妒，并且救他们中间的一些人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “骨肉同胞”直译为“我的肉身”，这里指保罗的同族犹太人。
    reason: 说明σάρξ在此处是血缘、族裔意义，同时交代原文的字面表达。
lexical_decisions:
- source_word: εἴ πως
  choice: 或许可以
  rationale: 表达保罗带有不确定性的盼望或目标，不把结果说成必然；在现代汉语中也自然简洁。
- source_word: παραζηλώσω
  choice: 激起……的嫉妒
  rationale: 保留动词“使人嫉妒”的主动语气，并呼应上下文中外族人蒙接纳而激起以色列嫉妒的主题。
- source_word: μου τὴν σάρκα
  choice: 我骨肉同胞
  rationale: σάρξ字面为“肉身”，此处按血缘、族裔亲属关系使用。“骨肉同胞”既保留身体亲缘意象，也自然指向保罗的同族人。脚注进一步说明其所指。
- source_word: σώσω
  choice: 救
  rationale: 该词在保罗书信中具有明确的救恩含义；“救”简洁地保留这种神学分量。
- source_word: τινὰς ἐξ αὐτῶν
  choice: 他们中间的一些人
  rationale: 明确表示从前述群体中救出一部分人，同时符合现代汉语表达习惯。
theological_decisions:
- issue: σάρξ在保罗指称自己族群时的含义
  choice: 译作“我骨肉同胞”，按血缘和族裔亲属关系理解
  alternative: 我的同胞；我的犹太同胞；我的肉身
  rationale: 这里的σάρξ并非“罪性”，而是指保罗天然血缘与族裔上的亲属，即犹太同胞。“骨肉同胞”保留原文的身体亲缘意象，又避免生硬和误解。
- issue: 保罗在“救”人中的作用
  choice: 保留第一人称“救”，不改写为“使……得救”或明确加入神为施救者
  alternative: 使他们中间的一些人得救
  rationale: 原文直接使用第一人称主动虚拟式σώσω。译文保留这种较强表述，不在本节中替保罗解释其工具性角色，从而维持原文的神学张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“骨肉同胞”既易于普通读者理解，又保留原文以“肉身”表达亲缘关系的意象；句式简洁，并保留“或许”所表达的不确定性。
