  text: εἰ δὲ χάριτι, οὐκέτι ἐξ ἔργων, ἐπεὶ ἡ χάρις οὐκέτι γίνεται ⸀χάρις.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/006.yaml
  text: But if by grace, it is no longer from works; otherwise grace no longer becomes grace.
translation:
  language: zh_hans
  text: 但既然是出于恩典，就不再是出于行为；否则，恩典就不再成为恩典了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάριτι
  choice: 出于恩典
  rationale: 与后面的“出于行为”形成清晰对照，并自然表达凭借或依据恩典的意思。
- source_word: ἐξ ἔργων
  choice: 出于行为
  rationale: 保留ἐκ所表达的来源或依据关系，也维持保罗论证中“恩典—行为”的对照。
- source_word: γίνεται
  choice: 成为
  rationale: 按词面保留γίνομαι的动态意味，不将其弱化为单纯的系词“是”；这也与所给审定修订一致。
theological_decisions:
- issue: 恩典与行为的关系
  choice: 保留二者作为彼此排斥的依据或来源
  alternative: 译作“若是靠恩典，就不是靠功劳”
  rationale: “行为”更直接对应ἔργων，也避免把经文提前解释为某一种特定的功德论框架。
- issue: γίνεται χάρις的表达
  choice: 恩典就不再成为恩典了
  alternative: 恩典就不再是恩典了
  rationale: 选择“成为”以反映原文γίνεται，并保留原句略显悖论式、动态的措辞，而不静态化处理。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“既然”承接本章前文所说余民是按恩典蒙拣选的事实；分号保留紧密的逻辑推论。
