base_translation:
  language: en
  yaml_path: translation/nt/romans/011/005.yaml
  text: So then, in the present time also, a remnant has come to be according to the election of grace.
translation:
  language: zh_hans
  text: 所以，如今这时候也已经有一群余民；这余民是按着恩典的拣选而有的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “按着恩典的拣选”也可译作“按恩典而蒙拣选”或“出于恩典的拣选”。原文“恩典”与“拣选”之间的属格关系简练，可理解为恩典赋予拣选以性质、构成其根据或表明其来源。
    reason: 原文“恩典”与“拣选”之间的属格关系简练，可理解为恩典赋予拣选以性质、构成其根据或表明其来源。
lexical_decisions:
- source_word: οὕτως οὖν καὶ
  choice: 所以，同样……也
  rationale: οὕτως οὖν承接上文以利亚时代的例子并引出结论；“所以”自然表达推论，“同样……也”保留古今之间的类比。
- source_word: ἐν τῷ νῦν καιρῷ
  choice: 在现今这时候
  rationale: καιρός指特定的时期或时势；此译既自然，又保留保罗在以利亚时代与现今之间所作的时间对照。
- source_word: λεῖμμα
  choice: 余民
  rationale: “余民”是中文圣经语境中成熟而简洁的用语，表示在整体中存留下来的一部分人，也能承接上文旧约背景。
- source_word: κατ’ ἐκλογὴν χάριτος
  choice: 按着恩典的拣选
  rationale: 保留ἐκλογή的“拣选”和χάρις的“恩典”，并尽量维持属格结构的紧凑与开放性，不把两者关系限定为单一解释。
- source_word: γέγονεν
  choice: 而有
  rationale: γίνομαι的完成时表达已经形成并持续至今的状态；在“有……余民”的现代汉语结构中，“而有”较自然，同时没有把它误解成单纯的“剩下”。
theological_decisions:
- issue: 在保罗神学语境中如何翻译ἐκλογή
  choice: 拣选
  alternative: 选择；被选中的身份
  rationale: “拣选”准确保留该词的神学分量，同时不在本节中引入任何特定宗派对拣选方式或范围的解释。
- issue: κατ’ ἐκλογὴν χάριτος中恩典与拣选的关系
  choice: 按着恩典的拣选
  alternative: 按恩典而蒙拣选；出于恩典的拣选；恩典所作的拣选
  rationale: 此译保留原文属格关系可能涉及性质、根据或来源的空间，避免擅自把语义收窄为某一种教义公式。
- issue: γέγονεν所表达的形成与现存状态
  choice: 有
  alternative: 形成了；出现了；存留下来
  rationale: 上下文确实谈到余民，但动词本身是γίνομαι而非“留下”；采用存在性表达，可避免把动词意义过度同化为λεῖμμα所包含的“余留”概念。
translation_notes:
  register: 采用现代、庄重且便于普通读者理解的书面汉语。“余民”和“拣选”保留必要的圣经神学术语；句序以中文自然度为先，同时维持原文的推论、时代类比及恩典与拣选之间的语义张力。
