  text: ὥσπερ ⸀γὰρ ὑμεῖς ποτε ἠπειθήσατε τῷ θεῷ, νῦν δὲ ἠλεήθητε τῇ τούτων ἀπειθείᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/030.yaml
  text: For just as you once were disobedient to God[a], but now have received mercy because of their disobedience,
translation:
  language: zh_hans
  text: 因为正如你们从前不顺服上帝[a]，如今却因他们的不顺服蒙了怜悯，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不顺服”和“他们的不顺服”也可分别译为“不信”和“他们的不信”；本节所用的希腊语词在这里可兼有这两层意思。
    reason: 保留ἀπειθέω与ἀπείθεια在本语境中“不顺服／不信”的词义选择。
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: 因为，正如
  rationale: 同时保留γάρ承接上文的解释作用和ὥσπερ引出的比较关系，并以自然的现代汉语表达。
- source_word: ὑμεῖς
  choice: 你们
  rationale: 准确表达第二人称复数；不在正文中补入原文未明说的“外族人”。
- source_word: ποτε
  choice: 从前
  rationale: 自然地表达过去的状态，并与νῦν“如今”形成鲜明对照。
- source_word: ἠπειθήσατε
  choice: 不顺服
  rationale: ἀπειθέω兼有不顺服与不信的语义；此处采用“不顺服”，既保留对上帝的关系和行为层面，也与后面的同根名词ἀπείθεια对应。
- source_word: τῷ θεῷ
  choice: 上帝
  rationale: 作为ἀπειθέω的与格补语，在汉语中自然表达为“不顺服上帝”。
- source_word: νῦν δὲ
  choice: 如今却
  rationale: 清楚呈现当前处境与从前状态之间的转折和对比。
- source_word: ἠλεήθητε
  choice: 蒙了怜悯
  rationale: 保留ἐλεάω的被动意义，表明怜悯是临到受众、由他们领受的；措辞简洁庄重。
- source_word: τῇ τούτων ἀπειθείᾳ
  choice: 因他们的不顺服
  rationale: 将与格理解为原因或媒介；“因”在汉语中简洁地保留这种关系，而“他们”依上下文指当前不顺服的以色列人，不在正文中额外明说。
theological_decisions:
- issue: ἀπειθέω／ἀπείθεια在保罗救恩论语境中的含义
  choice: 正文译作“不顺服”，并用脚注保留“不信”的可能
  alternative: 正文译作“不信”
  rationale: 这组希腊词可涵盖不信与不顺服，两层意思在本语境中彼此交叠。正文采用“不顺服”可维持动词与名词的词根呼应，也避免把保罗的表达收窄为纯认知层面的不信；脚注则保留真实的词义张力。
- issue: τῇ τούτων ἀπειθείᾳ所表达的逻辑关系
  choice: 译作“因他们的不顺服”
  alternative: 译作“借着他们的不顺服”
  rationale: 与格可以带有原因或媒介色彩；“因”适合本句的救恩历史论述，又不进一步界定上帝施怜悯的具体机制。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“因为，正如”保留本节与上下文的解释和比较关系；句末用逗号，反映原文句法尚未结束，并与下一节继续相连。
