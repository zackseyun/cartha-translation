id: ROM.11.8
reference: Romans 11:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ⸀καθὼς γέγραπται· Ἔδωκεν αὐτοῖς ὁ θεὸς πνεῦμα κατανύξεως, ὀφθαλμοὺς τοῦ μὴ βλέπειν καὶ ὦτα τοῦ μὴ ἀκούειν, ἕως τῆς σήμερον ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/008.yaml
  text: 'just as it is written: “God gave them a spirit of stupor[a], eyes not to see and ears not to hear, until this very day.”'
translation:
  language: zh_hans
  text: 正如经上所记：“神给了他们昏沉的灵[a]，使他们有眼却不能看见，有耳却不能听见，直到今日。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“沉睡的灵”。这里的说法呼应《以赛亚书》29:10，但本节所用的希腊词侧重迟钝、麻木或神志昏沉。
    reason: 保留以赛亚背景所支持的传统译法，同时说明本节希腊词的具体语义。
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: 正如经上所记
  rationale: 保留καθώς的对应意味，并采用现代中文中自然、庄重的经文引述套语。
- source_word: Ἔδωκεν αὐτοῖς ὁ θεὸς
  choice: 神给了他们
  rationale: 按希腊文直陈神是施动者，并以简单过去时语气表达不定过去时；不弱化为“容许”。
- source_word: πνεῦμα κατανύξεως
  choice: 昏沉的灵
  rationale: κατάνυξις在此指迟钝、麻木、神志昏沉的状态；“昏沉”比“昏睡”更贴近本节希腊词，同时“灵”保留πνεῦμα，不改释为“心”。
- source_word: ὀφθαλμοὺς τοῦ μὴ βλέπειν καὶ ὦτα τοῦ μὴ ἀκούειν
  choice: 使他们有眼却不能看见，有耳却不能听见
  rationale: 以自然中文表达τοῦ μή加不定式所含的目的或结果意味，又借“有……却不能……”保留两句的紧凑平行和属灵无知觉的张力。
- source_word: ἕως τῆς σήμερον ἡμέρας
  choice: 直到今日
  rationale: 准确传达该惯用语，并以简洁庄重的措辞保留引文延续到保罗当下的意味。
theological_decisions:
- issue: 神在刚硬或审判性麻木中的主动作用
  choice: 保留“神给了他们”的直接陈述
  alternative: 神任凭他们昏沉／神容许他们有昏沉的灵
  rationale: 希腊文明说神是Ἔδωκεν的主语。译文不将其缓和为单纯许可，也不在本节措辞之外建立更具体的教义体系。
- issue: τοῦ μὴ加不定式的目的或结果意味
  choice: 译作“使他们有眼却不能看见，有耳却不能听见”
  alternative: 给他们不能看见的眼睛和不能听见的耳朵
  rationale: “使”在中文中可承载所造成的状态，而“却不能”保留反常和审判性的张力；不强行判定这里只表达主观目的还是客观结果。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“昏沉的灵”避免过度口语化，也不把πνεῦμα解释性改写为“心”。平行句使用“有眼却……有耳却……”，兼顾经文节奏与中文自然度。
