base_translation:
  language: en
  yaml_path: translation/nt/romans/011/034.yaml
  text: For who has known the mind of the Lord? Or who has become his counselor?[a]
translation:
  language: zh_hans
  text: 因为谁曾知道主的心意？或谁曾作过他的谋士？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 保罗在这里呼应《以赛亚书》40:13；该处的希腊文译本同样问：谁曾知道主的心意，或作过他的谋士。
    reason: cross_reference
lexical_decisions:
- source_word: Τίς
  choice: 谁
  rationale: 疑问代词引出反问，简洁自然，并保留引文的力度。
- source_word: γὰρ
  choice: 因为
  rationale: 承接上文，为前面的论述提供根据；“因为”清楚表达其解释性连接作用。
- source_word: ἔγνω
  choice: 曾知道
  rationale: 不定过去时用于经文式反问；“曾知道”自然表达历来无人能知道之意，同时避免把“知道”解释性地改为“理解”。
- source_word: νοῦν
  choice: 心意
  rationale: νοῦς在此可指思想、意念或旨意；“心意”在现代汉语中比单说“心”清楚，也保留一定语义幅度。
- source_word: κυρίου
  choice: 主
  rationale: 直接对应κύριος，并保留保罗所引希腊文的表述，不在正文中改写为神名。
- source_word: ἢ
  choice: （省略显式连词）
  rationale: 原文以“或”连接两个平行反问；现代汉语连续使用两个“谁曾……”已能自然传达并列递进关系，若直译“或”反而生硬。
- source_word: σύμβουλος
  choice: 谋士
  rationale: 指向人提供谋略或劝告者；“谋士”凝练、庄重，适合经文引语语体。
- source_word: αὐτοῦ
  choice: 他的
  rationale: 自然表达属格关系，不额外限定所指。
- source_word: ἐγένετο
  choice: 曾作过
  rationale: γίνομαι在此表示成为、充任某种身份；“曾作过他的谋士”是自然汉语，也保留历来无人居于此地位的反问意味。
theological_decisions:
- issue: 以赛亚引文中“主”的所指
  choice: 译作“主”，不在正文中进一步收窄所指
  alternative: 依据《以赛亚书》背景显式译为神的圣名
  rationale: 希腊文为κυρίου，且保罗沿用希腊文经书的措辞；译作“主”既忠于新约文本，也保留其在上下文中指向神及其不可测度智慧的颂赞力量。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“因为”明确连接上文；两个平行反问保持经文引语的节奏。正文中的[a]与脚注标记一致。
