  text: εἰ γὰρ ἡ ἀποβολὴ αὐτῶν καταλλαγὴ κόσμου, τίς ἡ πρόσλημψις εἰ μὴ ζωὴ ἐκ νεκρῶν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/015.yaml
  text: For if their rejection means reconciliation for the world[b][a], what will their acceptance mean if not life from the dead?
translation:
  language: zh_hans
  text: 因为他们被弃绝，既使世人与上帝和好；那么他们被接纳，又会怎样呢？岂不就是死而复生吗？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “死而复生”可能比喻非凡的属灵更新，也可能更具体地指复活；保罗在这里使用了简练而含义丰富的表达。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποβολὴ
  choice: 被弃绝
  rationale: 在本段语境中表达以色列被拒绝、被搁置的关系性含义，并与后面的“被接纳”形成清楚对照。
- source_word: καταλλαγὴ
  choice: 与上帝和好
  rationale: 原文只明说“和好”，但保罗此处所指是世人与上帝关系的恢复；汉语补出关系对象，表达自然且符合保罗惯常用法。
- source_word: κόσμου
  choice: 世人
  rationale: κόσμος在这里指广泛的人类世界；译作“世人”比“世界”作为‘与上帝和好’的主体更自然，同时不把范围明确缩窄为外邦人。
- source_word: πρόσλημψις
  choice: 被接纳
  rationale: 保留被动关系含义，并与“被弃绝”构成自然、鲜明的反义对照。
- source_word: ζωὴ ἐκ νεκρῶν
  choice: 从死人中得生命
  rationale: 贴近原文意象，不将其直接解释为属灵复兴或末日复活，保留短语的开放性。
- source_word: εἰ μὴ
  choice: 岂不就是……吗
  rationale: 以现代汉语反问句传达原文期待肯定回答的强调语气。
- source_word: γὰρ
  choice: 因为
  rationale: 明确承接前文的论证关系，符合γάρ在此的解释性作用。
theological_decisions:
- issue: “从死人中得生命”的含义
  choice: 保留为开放而富有末世意味的表达，不限定为属灵更新或身体复活。
  alternative: 可理解为非凡的属灵复兴、末日普遍复活，或兼含两者的浓缩表达。
  rationale: 保罗的措辞简短而富有张力；正文不应超出希腊文，替读者确定唯一解释。
- issue: 和好的对象
  choice: 译为“使世人与上帝和好”。
  alternative: 较形式地译为“成为世界的和好”，不明说和好的对象。
  rationale: καταλλαγή在保罗神学语境中指人与上帝关系的恢复；汉语通常需要说明关系对象才自然清楚，但不借此增加宗派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“尚且……又会怎样呢”呈现条件句递进和反问力度；“被弃绝／被接纳”保留原文两名词之间的对照。
