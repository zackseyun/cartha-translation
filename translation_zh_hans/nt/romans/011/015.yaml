  terminology: “被弃绝／被接纳”准确保留 ἀποβολή 与 πρόσλημψις 的关系性反衬；“与上帝和好”适切表达 καταλλαγή 在此语境中的含义，且“世人”没有将 κόσμος不当窄化为外邦人。
