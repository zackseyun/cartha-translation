id: ROM.11.20
reference: Romans 11:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καλῶς· τῇ ἀπιστίᾳ ἐξεκλάσθησαν, σὺ δὲ τῇ πίστει ἕστηκας. μὴ ⸂ὑψηλὰ φρόνει⸃, ἀλλὰ φοβοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/020.yaml
  text: 'Quite right: they were broken off because of unbelief[a], but you stand by faith. Do not be arrogant[d][c][b], but fear.'
translation:
  language: zh_hans
  text: 不错[a]。他们因不信被折下来，你却因信站立得住[b]。不要自高[c]，反要惧怕[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“说得对”或“确是如此”。
    reason: lexical_alternative
  - marker: b
    text: “因信”也可译作“凭着信”或“借着信”；这里的“信”也含有“信靠”的意思。
    reason: alternative_reading
  - marker: c
    text: 或译：“不要心高气傲”或“不要自视甚高”。
    reason: lexical_alternative
  - marker: d
    text: 这里指在上帝面前存谦卑、敬畏和谨慎的心，不可骄傲自恃；“惧怕”也保留了原文严肃的警告语气。
    reason: lexical_alternative
lexical_decisions:
- source_word: καλῶς
  choice: 不错
  rationale: 这里是对上一节所述观点的肯定回应。“不错”在现代汉语中自然、简洁，也保留了“说得对／确是如此”的语气。
- source_word: ἀπιστίᾳ
  choice: 因不信
  rationale: 与后面的 πίστει 构成鲜明对照；此处与格可表达原因或凭借，语境侧重他们因不信而被折下。
- source_word: ἐξεκλάσθησαν
  choice: 被折下来
  rationale: 保留上下文橄榄树枝的具体比喻；被动形式也对应希腊文。
- source_word: πίστει
  choice: 因信
  rationale: 保留 πίστις 与 ἀπιστία 的对照，并以自然汉语表达其作为站立之依据或凭借；“信”在此主要指信靠。
- source_word: ἕστηκας
  choice: 站立得住
  rationale: 希腊文完成时表示已经形成并持续至今的站立状态；“站立得住”既自然，也呼应枝子仍留在树上的语境。
- source_word: ὑψηλὰ φρόνει
  choice: 自高
  rationale: 该习语指自视甚高、怀有骄傲的意念。“自高”简洁庄重，并保留其思想与态度层面的含义。
- source_word: φοβοῦ
  choice: 惧怕
  rationale: 保留命令语气的锋芒及经文中的神学张力，不把它淡化为单纯的尊敬，也不限定为惊恐。
theological_decisions:
- issue: πίστις 与 ἀπιστία 的对照
  choice: 信／不信
  alternative: 信靠／不信从；忠信／不忠信
  rationale: 本节的直接对照最自然地指人的相信与不信；不过“信”仍可包含信靠之意，不将其扩展为特定教派的教义表述。
- issue: φοβοῦ 的力度与对象
  choice: 惧怕
  alternative: 敬畏；害怕
  rationale: 上下文警告外邦信徒不可自恃。“惧怕”保留严肃警戒，不将其弱化为一般尊敬，也不擅自解释为恐慌；其敬畏和谨慎的内涵由脚注说明。
- issue: 信徒“站立”是否暗示自有功劳
  choice: 因信站立得住
  alternative: 凭着信站立；借着信站立
  rationale: 译文明确把站立与信相连，并与因不信被折下形成对照；不进一步裁定“因／凭借”所涉及的系统神学关系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“被折下来”延续橄榄树枝的比喻；“反要”清楚表达 ἀλλά 的强烈转折。脚注标记按对应词语就近放置，避免英文咨询稿中标记位置可能造成的歧义。
