source:
  edition: SBLGNT
  text: Ὦ βάθος πλούτου καὶ σοφίας καὶ γνώσεως θεοῦ· ὡς ἀνεξεραύνητα τὰ κρίματα αὐτοῦ καὶ ἀνεξιχνίαστοι αἱ ὁδοὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/033.yaml
  text: Oh[b][a], the depth of the riches and wisdom and knowledge of God! How unsearchable are his judgments and untraceable his ways!
translation:
  language: zh_hans
  text: 啊，神的丰富、智慧和知识，是何等深邃！[a]他的裁断何其无法测透，他的道路何其无法追寻！[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“啊，神的智慧和知识的丰富是何等深邃！”希腊语句法也容许把“丰富”与后面的“智慧和知识”联系得更紧密；主文则把“丰富、智慧和知识”看作并列的三项，都属于神。
    reason: alternative_reading
  - marker: b
    text: “无法追寻”所译的希腊词含有“不能循着踪迹查出”的意思，与前面的“无法测透”相关，却保留了不同的形象。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὦ
  choice: 啊
  rationale: 感叹词引出颂赞与惊叹；“啊”在现代汉语中自然，也保留原文的强烈感情色彩。
- source_word: βάθος
  choice: 深邃
  rationale: 原词意为“深度”，此处比喻神的丰富、智慧和知识深不可测；“深邃”比“深度”更符合现代汉语感叹句的表达。
- source_word: πλούτου
  choice: 丰富
  rationale: πλοῦτος可指财富、丰盛或丰富；此处用“丰富”既保留充盈丰盛之意，也避免让读者只联想到物质财富。
- source_word: σοφίας
  choice: 智慧
  rationale: 准确保留σοφία所指神的智慧与筹划，并与“知识”分别表达。
- source_word: γνώσεως
  choice: 知识
  rationale: 直译γνῶσις，保留它与“智慧”的区别，不将两者合并。
- source_word: θεοῦ
  choice: 神的
  rationale: 主文将属格理解为同时修饰“丰富、智慧和知识”，以自然汉语表达三者都属于神。
- source_word: ὡς
  choice: 何其
  rationale: 这里用于感叹；“何其”简洁、庄重，能体现原文颂赞式的语气。
- source_word: ἀνεξεραύνητα
  choice: 无法测透
  rationale: 表示不能借查考而完全探明；“无法测透”清楚表达其不可穷究之意。
- source_word: κρίματα
  choice: 裁断
  rationale: κρίμα可指判断、裁决或判定；“裁断”既有神作出判定的意味，又不将范围限于末日审判。
- source_word: ἀνεξιχνίαστοι
  choice: 无法追寻
  rationale: 原词带有循着足迹追查却不能查出的意象；“无法追寻”保留这一特点，并与“无法测透”有所区别。
- source_word: ὁδοὶ
  choice: 道路
  rationale: 保留原文“道路”的比喻，指神行事的途径和方式。
- source_word: αὐτοῦ
  choice: 他的
  rationale: 明确回指神，并依照原文在“裁断”和“道路”两项中表达所属关系。
theological_decisions:
- issue: “神的”与“丰富、智慧和知识”三者的关系
  choice: 主文把“神的”理解为同时修饰“丰富、智慧和知识”。
  alternative: 把“丰富”与后面的“神的智慧和知识”结合，译成“神的智慧和知识何其丰富、何其深邃”。
  rationale: 希腊语词序容许两种句法理解。上下文中的颂赞性并列较自然地支持三项都属于神的读法，但另一种理解也确有语法依据，因此在脚注中保留。
- issue: 是否区分ἀνεξεραύνητα与ἀνεξιχνίαστοι
  choice: 分别译为“无法测透”和“无法追寻”。
  alternative: 两者都译为“难以测度”或采用意义近乎相同的词语。
  rationale: 两个形容词相关却不相同：前者侧重不能查考穷尽，后者侧重不能循迹追出。分别翻译可保留原文的修辞层次，但不把这种差异夸大为严格的神学分类。
translation_notes:
  register: 采用现代、庄重而易懂的颂赞语体。“啊”和两处“何其”传达原文连续的惊叹；“深邃、测透、追寻”保持诗性节奏，但避免过度古雅。脚注标记分别置于相关分句之后。
