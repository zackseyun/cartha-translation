  text: ἴδε οὖν χρηστότητα καὶ ἀποτομίαν θεοῦ· ἐπὶ μὲν τοὺς πεσόντας ⸀ἀποτομία, ἐπὶ δὲ σὲ ⸂χρηστότης θεοῦ⸃, ἐὰν ⸀ἐπιμένῃς τῇ χρηστότητι, ἐπεὶ καὶ σὺ ἐκκοπήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/022.yaml
  text: 'Consider[a], then, the kindness and severity of God: severity toward those who have fallen, but God''s kindness toward you, if you continue in his kindness[b]; otherwise you too will be cut off.'
translation:
  language: zh_hans
  text: 所以，你要留意上帝的恩慈[a]和严厉：对于那些跌倒的人，是严厉；对于你，却是上帝的恩慈——如果你继续在这恩慈中；不然，你也会被砍下[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恩慈”也可译作“仁慈”或“良善”。希腊词χρηστότης可表示仁厚、良善或善意；这里译作“恩慈”，以突出它与“严厉”之间具关系性的对照。
    reason: lexical_alternative
  - marker: b
    text: “被砍下”也可译作“被折下来”。原文动词的基本意思是“砍除”；“被折下来”是承接上下文橄榄树和枝子比喻的语境性译法。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴδε
  choice: 要留意
  rationale: 该命令式呼吁读者认真察看并思量。译作“要留意”既保留劝诫语气，又比“看哪”更符合现代汉语表达。
- source_word: χρηστότητα / χρηστότης
  choice: 恩慈
  rationale: 此词表示上帝仁厚、善待人的特质。“恩慈”能自然地与“严厉”形成对照，也保留其关系性和施恩意味。
- source_word: ἀποτομίαν / ἀποτομία
  choice: 严厉
  rationale: 此词在这里指上帝施行审判时的严正和决绝。“严厉”清楚自然，且没有超出原文而强化为残酷。
- source_word: ἐπὶ μὲν τοὺς πεσόντας
  choice: 对于那些跌倒的人
  rationale: “对于”体现ἐπί在对举结构中的指向；“跌倒的人”保留橄榄树比喻语境及其结果状态。
- source_word: ἐπὶ δὲ σὲ
  choice: 对于你
  rationale: 与前一“对于”保持平行，并保留原文对单数受话者的直接劝诫。
- source_word: ἐὰν ἐπιμένῃς τῇ χρηστότητι
  choice: 只要你持续在他的恩慈中
  rationale: “持续在……中”保留ἐπιμένω加与格所表达的继续、持守之意；“他的”根据紧邻语境明确指上帝，不改变所指。
- source_word: ἐπεὶ
  choice: 不然
  rationale: 在此条件句后引出条件未满足时的后果，现代汉语以“不然”最自然地表达这一警告逻辑。
- source_word: ἐκκοπήσῃ
  choice: 会被砍下来
  rationale: 保留将枝子从树上砍除的被动含义，并与上下文的橄榄树比喻自然衔接。
theological_decisions:
- issue: 上帝的恩慈与审判之间的条件性警告
  choice: 直接保留“只要……；不然……”的真实条件和警告
  alternative: 将警告弱化为纯粹假设，或在译文中预先判定这是个人还是群体、是否涉及最终失落
  rationale: 原文明确提出条件与相反后果，却没有在本节中解决坚忍、背道以及个人或群体应用等后来的神学争论；译文因此保留原有张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“所以”承接上文论证；分号清楚呈现条件及后果。译文不加入宗派术语，也不替原文消解条件性警告所包含的神学张力。
