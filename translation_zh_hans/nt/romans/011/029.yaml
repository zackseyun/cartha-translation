  text: ἀμεταμέλητα γὰρ τὰ χαρίσματα καὶ ἡ κλῆσις τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/029.yaml
  text: For the gifts and the calling of God are irrevocable[a].
translation:
  language: zh_hans
  text: 因为上帝的恩赐和呼召是不会收回的[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“上帝不会后悔”或“是不会撤回的”。传统译法常作“是没有后悔的”。
    reason: 词义存在可保留的译法差异：ἀμεταμέλητα既可从上帝“不后悔”着眼，也可按语境表达为“不撤回”。
lexical_decisions:
- source_word: ἀμεταμέλητα
  choice: 不会收回
  rationale: 该词表示“不后悔的、不会因后悔而撤回的”。在这里修饰上帝的“恩赐和呼召”，“不会收回”自然传达其不被撤销之意，同时不把词义扩大为抽象的“永不改变”。
- source_word: γὰρ
  choice: 因为
  rationale: γάρ承接上文，说明前一句论断的根据；“因为”在现代汉语中清楚保留这一解释性连接。
- source_word: τὰ χαρίσματα
  choice: 恩赐
  rationale: χάρισμα指由恩典而来的礼物。“恩赐”是简洁、通行且具有尊严感的译法，并保留复数集合概念而不额外限定具体内容。
- source_word: ἡ κλῆσις
  choice: 呼召
  rationale: κλῆσις指呼唤、召唤，在保罗书信中常带有上帝施行呼召的神学分量；“呼召”保留这一含义而不过度解释其作用方式。
- source_word: τοῦ θεοῦ
  choice: 上帝的
  rationale: 属格同时修饰“恩赐”和“呼召”，可表示上帝是其来源或所属者；“上帝的”保留这种适度宽泛性。
theological_decisions:
- issue: “上帝的恩赐和呼召”在上下文中的范围
  choice: 不在正文中明确限定其专指以色列的特权与蒙召，或泛指上帝一切恩赐与呼召。
  alternative: 明确译成“上帝赐给以色列的恩赐和对以色列的呼召”，或将其表达为普遍性的神学原则。
  rationale: 罗马书11章的直接语境集中于以色列，但希腊文本本句没有明说其对象。正文保留保罗原有措辞，以保存语境指向与较广原则之间的张力。
- issue: ἀμεταμέλητα所表达的不撤回性
  choice: 译作“不会收回”，强调上帝不撤销其恩赐和呼召。
  alternative: 译作“不后悔”或“永不改变”。
  rationale: “不后悔”在现代汉语中容易使读者只想到情绪状态；“永不改变”则可能超出该词在本句中的语义范围。“不会收回”较准确地表达其在此处的实际含义。
translation_notes:
  register: 采用现代、自然而庄重的普通话。“因为”保留本句与上文的论证关系；“恩赐和呼召”沿用读者熟悉的圣经词汇；“不会收回”比生硬的“不可撤销”更口语可懂，同时保持正式文体。
