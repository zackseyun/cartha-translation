  text: ἢ τίς προέδωκεν αὐτῷ, καὶ ἀνταποδοθήσεται αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/035.yaml
  text: Or who has first given to him[b][a], and it will be repaid to him?
translation:
  language: zh_hans
  text: 又有谁先给了他什么，而会得到偿还呢？[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “先给了”也可译作“预先给了”。
    reason: lexical_alternative
  - marker: b
    text: 这反问的意思是：没有人能先给神什么，以致神欠他、必须回报他。
    reason: cross_reference
lexical_decisions:
- source_word: ἢ
  choice: 又
  rationale: 承接上一节的一连串反问；现代汉语用“又”比直译为“或”更自然，也保留递进提出另一问的作用。
- source_word: τίς
  choice: 谁
  rationale: 准确表达指人的疑问代词，并适合反问语气。
- source_word: προέδωκεν
  choice: 先给了
  rationale: 保留前缀所表达的在先、预先给予之意，即有人先给神，以致可要求回报。
- source_word: αὐτῷ
  choice: 他
  rationale: 原文使用代词，所指由上下文可知是神；保留代词，不在正文中明加“神”。
- source_word: καὶ
  choice: 使……后来
  rationale: 此处两分句在反问中形成结果关系。汉语以“使”衔接更清楚，“后来”同时显出先给与后偿还的次序，但不改变原文逻辑。
- source_word: ἀνταποδοθήσεται
  choice: 必须偿还
  rationale: 该词是将来时被动式，意为作为回报而偿还。汉语反问中明示“必须”，自然传达前一行为使神负有偿还义务的语境含义。
- source_word: αὐτῷ
  choice: 他
  rationale: 按汉语表达，被动式“偿还给他”可自然转为“使他……偿还”，其中“他”仍指先给予的人；避免生硬重复代词。
theological_decisions:
- issue: 两个 αὐτῷ 的指向
  choice: 第一个“他”指神；第二个代词的受益者通过“谁……使他后来必须偿还”的结构指向先给予的人
  alternative: 将两处都逐字译作“给他”，造成中文指代混乱；或在正文中直接写“神”
  rationale: 希腊文第一个 αὐτῷ 指神，第二个 αὐτῷ 指应得回报的人。中文改换句法可清楚保留这一区别，而不把第一处代词擅自改成名词。
- issue: προέδωκεν 与神是否负债
  choice: 译为“先给了……使他后来必须偿还”，保留优先给予所造成偿还义务这一反问含义
  alternative: 只译为“给过他”，省略“先”；或仅译为“他就偿还”而不表达义务意味
  rationale: 保罗的反问否定任何人能先施予神，从而使神成为欠债者；译文表达此逻辑，却不在正文中增加宗派性解释。
translation_notes:
  register: 采用现代、庄重且口语可懂的反问句式。“给了他什么”补出汉语所需的宾语“什么”，由 τίς 的反问及动词语义自然隐含；“后来”与“必须”使原文的先后和偿还义务在中文中清楚呈现。所有脚注标记均置于正文。
