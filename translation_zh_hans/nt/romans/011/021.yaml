  text: εἰ γὰρ ὁ θεὸς τῶν κατὰ φύσιν κλάδων οὐκ ἐφείσατο, ⸀οὐδὲ σοῦ φείσεται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/021.yaml
  text: For if God did not spare the natural branches[a], neither will he spare you.
translation:
  language: zh_hans
  text: 因为上帝若没有顾惜那些天然的枝子[a]，他也不会顾惜你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“按本性的枝子”；也可译“自然的枝子”。
    reason: 说明κατὰ φύσιν的字面表达及可接受的词汇译法。
lexical_decisions:
- source_word: εἰ γὰρ
  choice: 因为……既
  rationale: εἰ引出真实条件，γάρ承接上文说明理由。汉语以“因为……既”自然表达论证关系，并使后半句的推论清楚。
- source_word: ὁ θεὸς
  choice: 上帝
  rationale: θεός在此有冠词并作主语；“上帝”是现代汉语中庄重、通行的对应表达。
- source_word: τῶν κατὰ φύσιν κλάδων
  choice: 那些天然的枝子
  rationale: κατὰ φύσιν直译为“按本性的”，在橄榄树比喻中指原本自然生长、自然属于树的枝子。“天然的枝子”简洁保留比喻，不在正文中直接解释为以色列。
- source_word: οὐκ ἐφείσατο
  choice: 没有顾惜
  rationale: φείδομαι意为顾惜、宽免或不加伤害；“没有顾惜”既保留原词的一般意义，也与后句形成准确的重复。
- source_word: οὐδὲ σοῦ φείσεται
  choice: 也不会顾惜你
  rationale: οὐδέ延续前一否定，φείσεται为将来时；“也不会”符合现代汉语表达。σοῦ是第二人称单数，以“你”保留其直接警告的语气。
theological_decisions:
- issue: “天然的枝子”所指为何
  choice: 正文保留枝子的比喻，不直接写成“以色列人”。
  alternative: 在正文中明确译为以色列。
  rationale: 上下文表明这比喻指向以色列，但本节原文本身仍使用枝子的形象。保留比喻可避免把上下文解释直接写入正文。
- issue: “不会顾惜你”这一警告的神学范围
  choice: 按原文保留对单数“你”的直接、真实警告，不附加关于个人或群体、蒙拣选或背道的限定。
  alternative: 依某一救恩论体系将警告限定为个人、群体、暂时惩戒或最终失落。
  rationale: 原文明确发出警告，却没有在本句中解决这些系统神学争论；译文应保留其力度与张力。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“因为……既……也……”保持与上文的论证联系；“顾惜”准确保留前后同一动词的呼应。
