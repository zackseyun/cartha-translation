id: ROM.11.4
reference: Romans 11:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἀλλὰ τί λέγει αὐτῷ ὁ χρηματισμός; Κατέλιπον ἐμαυτῷ ἑπτακισχιλίους ἄνδρας, οἵτινες οὐκ ἔκαμψαν γόνυ τῇ Βάαλ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/004.yaml
  text: But what does the divine response say to him? “I have kept for myself seven thousand men[b][a], who have not bent the knee to Baal.”
translation:
  language: zh_hans
  text: 可是，上帝给他的回答[a]怎么说呢？“我为自己留下[b]了七千名男子，他们没有向巴力屈膝。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“上帝的答复”，或“神谕”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“保留”。
    reason: lexical_alternative
lexical_decisions:
- source_word: χρηματισμός
  choice: 上帝给他的回答
  rationale: 该词在这里指上帝对以利亚所作的权威回应（参《列王纪上》19章）。译文明确回应来自上帝，同时比单独译作“神谕”更自然易懂。
- source_word: Κατέλιπον
  choice: 留下
  rationale: 直译其过去时动作，并与“为自己”搭配，表达上帝特意保留这些人的意思；上下文自然显出这行动所产生的持续结果。
- source_word: ἐμαυτῷ
  choice: 为自己
  rationale: 保留反身与格的含义，表明这群人是上帝为自己留下的。
- source_word: ἑπτακισχιλίους ἄνδρας
  choice: 七千名男子
  rationale: ἄνδρας在此明确为阳性名词；“男子”既准确保留性别信息，也符合现代汉语表达。
- source_word: οἵτινες
  choice: 他们
  rationale: 在汉语中以“他们”承接前面的七千名男子，自然表达关系从句的限定说明，无须勉强译出可能的定性语气。
- source_word: οὐκ ἔκαμψαν γόνυ
  choice: 没有……屈膝
  rationale: 保留原文“屈膝”的身体意象，也传达向神明敬拜、臣服的含义。
- source_word: τῇ Βάαλ
  choice: 向巴力
  rationale: 巴力是该神祇名称的通行音译；“向……屈膝”符合现代汉语习惯，不需译出希腊语冠词。
theological_decisions:
- issue: 是否明确引文中的回答来自上帝
  choice: 译作“上帝给他的回答”，并保留引文中上帝的第一人称话语。
  alternative: 仅译作“回答”或“神谕”。
  rationale: 上下文和所引旧约经文都表明这是上帝对以利亚的回应；明确其来源符合χρηματισμός在此处的语义，却不额外加入教义解释。
- issue: ἄνδρας的性别表达
  choice: 七千名男子
  alternative: 七千人
  rationale: 原文使用明确指男性的名词，故保留其性别信息，不以可能具有泛指意味的“人”将其弱化。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“可是”承接上一节的反问并形成转折；引文保留“向巴力屈膝”的具体意象。脚注标记紧随其所说明的词语。
