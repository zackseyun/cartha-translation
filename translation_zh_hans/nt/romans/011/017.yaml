id: ROM.11.17
reference: Romans 11:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Εἰ δέ τινες τῶν κλάδων ἐξεκλάσθησαν, σὺ δὲ ἀγριέλαιος ὢν ἐνεκεντρίσθης ἐν αὐτοῖς καὶ συγκοινωνὸς τῆς ⸀ῥίζης τῆς πιότητος τῆς ἐλαίας ἐγένου,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/017.yaml
  text: But if some of the branches were broken off[a], and you, although being a wild olive tree, were grafted in among them and became a fellow sharer in the root, in the richness of the olive tree[b],
translation:
  language: zh_hans
  text: 但如果有些枝子被折下来，而你本是野橄榄，却被嫁接在它们中间，并且一同有分于橄榄树丰美的根[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译为“一同有分于橄榄树的根和丰盛”；有些抄本在“根”和“丰美”之间有“和”字。
    reason: 原文连续属格的关系较为紧缩；脚注保留并列理解及相关抄本的连接词差异。
lexical_decisions:
- source_word: Εἰ δέ
  choice: 但如果
  rationale: 既保留条件关系，也自然表达δέ所带的轻微转折。
- source_word: τινες τῶν κλάδων
  choice: 有些枝子
  rationale: 准确表达τινες与部分属格的含义；现代汉语无需直译为“枝子中的一些”。
- source_word: ἐξεκλάσθησαν
  choice: 被折了下来
  rationale: 保留树枝被折离树体的园艺意象，也体现被动语态。
- source_word: ἀγριέλαιος ὢν
  choice: 本是野橄榄
  rationale: 保留橄榄树比喻，不将所指解释性地改写为“外邦人”；“本是”自然传达让步背景。
- source_word: ἐνεκεντρίσθης ἐν αὐτοῖς
  choice: 被接在它们中间
  rationale: “接”是现代汉语中清楚自然的嫁接用语；“它们”最自然地指仍在树上的枝子。
- source_word: συγκοινωνὸς
  choice: 一同有分
  rationale: 兼顾共同参与和分享的含义，并保留与其他枝子共同领受的关系。
- source_word: τῆς ῥίζης τῆς πιότητος τῆς ἐλαίας
  choice: 橄榄树丰美的根
  rationale: 将连续属格理解为橄榄树那富含滋养、丰美的根，符合无连接词的较难读法；脚注保留另一种可能的结构理解。
theological_decisions:
- issue: 野橄榄的比喻所指
  choice: 直译为“野橄榄”
  alternative: 解释为“外邦人”或“野橄榄枝”
  rationale: 经文本身维持树木和嫁接的比喻；译文不应直接替保罗说明其神学所指。“野橄榄枝”虽合上下文，却是原文未明说的补足。
- issue: 根与丰美之间的关系
  choice: 译为“橄榄树丰美的根”
  alternative: 译为“一同有分于橄榄树的根和丰盛”
  rationale: 所给SBLGNT正文没有连接“根”和“丰美”的καί，因此主译按连续属格呈现“丰美的根”；同时以脚注说明传统及异文所支持的并列理解，避免掩盖真实的文本与句法张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“枝子”“野橄榄”“接”保持整段的园艺比喻；句末逗号保留本节作为后续劝诫条件从句的未完结构。
