  text: εἰ δὲ ἡ ἀπαρχὴ ἁγία, καὶ τὸ φύραμα· καὶ εἰ ἡ ῥίζα ἁγία, καὶ οἱ κλάδοι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/016.yaml
  text: If the firstfruits are holy[a], so is the whole batch of dough; and if the root is holy, so are the branches.
translation:
  language: zh_hans
  text: 如果初熟之物是圣的，整团面团也必是圣的；如果树根是圣的，树枝也必是圣的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπαρχὴ
  choice: 初熟之物
  rationale: 保留旧约献初熟之物的礼仪与盟约联想，同时不把这里所指的人或群体明说出来。
- source_word: ἁγία
  choice: 是圣的
  rationale: 直接保留“圣”这一圣经范畴及两组比喻的平行结构，不限定为礼仪上的分别、盟约身份或得救意义上的圣洁。
- source_word: φύραμα
  choice: 整团面
  rationale: 该词指和成的一团面或面团；“整团面”在现代汉语中简洁自然，并清楚呈现初熟部分与全团之间的对照。
- source_word: ῥίζα
  choice: 树根
  rationale: 准确表达植物比喻，也与下文橄榄树的语境自然衔接。
- source_word: κλάδοι
  choice: 树枝
  rationale: 采用现代汉语中自然明确的植物用语，与“树根”形成对应。
- source_word: εἰ δὲ ... καὶ ...; καὶ εἰ ... καὶ ...
  choice: 如果……也就是……；如果……也就是……
  rationale: 希腊文两个后半句都省略系词；译文补出“也就是”，使推论关系清楚，同时不增添时间性的“如今”。
theological_decisions:
- issue: 初熟之物或树根的“圣”如何关系到全团或树枝
  choice: 两处均直译为“圣”，只保留其衍生或代表性的关系
  alternative: 明确译作“归给上帝”“在盟约中分别为圣”或“得救而成圣”
  rationale: 本节没有界定这里的圣究竟是礼仪性的、盟约性的、代表性的，还是关乎个人得救；译文不替保罗消解这一神学张力。
translation_notes:
  register: 采用简洁、庄重而通顺的现代标准汉语。两组条件句保持紧密平行；“初熟之物”“圣”保留经文的礼仪色彩和神学开放性。
