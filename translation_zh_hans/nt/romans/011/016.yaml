- from: 如果初熟之物是圣的，整团面[a]也就是圣的；如果树根是圣的，树枝也就是圣的。
  to: 如果初熟之物是圣的，整团面团也必是圣的；如果树根是圣的，树枝也必是圣的。
  rationale: 修订仅将“整团面”改为“整团面团”，以准确反映φύραμα，并将“也就是”改为“也必是”，使汉语条件句更自然、平行，同时不改变原文的神学开放性。脚注随之更新，并保留原有锚点。
