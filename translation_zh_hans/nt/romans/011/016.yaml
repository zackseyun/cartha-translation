review_pass:
  verdict: revise
  source_fidelity: 译文准确保留了两组条件—结果的平行结构，并将ἀπαρχή、ἁγία、ῥίζα、κλάδοι分别译为“初熟之物”“圣”“树根”“树枝”，没有越过经文界定“圣”的性质。惟“整团面”在现代汉语中通常指面粉而非已揉和的面团，未充分体现φύραμα“揉和的面团／一团生面”的意象；应改为“整团面团”。
  naturalness: “如果……也就是……”可理解，但“也就是”在现代汉语中较常用于解释或改述，弱化了原文简洁的类比式断言。以“也必是……”更自然，且清楚传达后项与前项的对应关系。
  terminology: “初熟之物”和“圣”恰当保留礼仪及圣经语汇；“面团”比“面”更准确、自然。保留“圣”，不改为“成圣”或“分别为圣”，以免添加原文未说明的神学限定。
  issues:
  - severity: medium
    issue: “整团面”不足以准确表达φύραμα。
    rationale: φύραμα指揉和、混合成的一团面，即“面团”；现代汉语“面”多可理解为面粉。“整团面团”既保留“whole batch”的整体性，也呈现原词的具体意象。
  - severity: low
    issue: “也就是圣的”略带解释性。
    rationale: 原文后半句是省略系词的平行断言，不是定义或释义。“也必是圣的”在汉语中更顺畅，并保持条件句的逻辑对应。
  revised_text: 如果初熟之物是圣的，整团面团也必是圣的；如果树根是圣的，树枝也必是圣的。
  revised_footnotes:
