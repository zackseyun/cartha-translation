  text: συνέκλεισεν γὰρ ὁ θεὸς τοὺς πάντας εἰς ἀπείθειαν ἵνα τοὺς πάντας ἐλεήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/032.yaml
  text: For God has shut up all into disobedience[c][b][a], so that he may show mercy to all.
translation:
  language: zh_hans
  text: 因为神把众人都圈在悖逆之中[a][b][c]，为要怜悯众人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圈在”也可译作“关在”或“限制在”。
    reason: lexical_alternative
  - marker: b
    text: “悖逆”也可译作“不顺服”；这个词在某些语境中也可指“不信”。
    reason: lexical_alternative
  - marker: c
    text: 原文两次都用“众人”。这里保留其宽泛说法，不预先缩小其范围；上下文所论包括犹太人和外族人。
    reason: alternative_reading
lexical_decisions:
- source_word: συνέκλεισεν
  choice: 圈在
  rationale: 该动词有把对象一同围住、关闭或限制在某种处境中的意思。“圈在”保留其具体的围困意象，又避免把它过度解释为刑罚性的“囚禁”或较抽象的“交付”。
- source_word: γὰρ
  choice: 因为
  rationale: γάρ承接上文并说明理由；“因为”符合现代汉语的论述衔接。
- source_word: τοὺς πάντας
  choice: 众人
  rationale: 原文在两处使用同一表达。两处都译作“众人”，保留其广度、重复和修辞上的对称，不在正文中预先限定其范围。
- source_word: εἰς ἀπείθειαν
  choice: 在悖逆之中
  rationale: ἀπείθεια可指不顺服，也可在某些语境中指不信；“悖逆”兼有拒绝听从和抗拒的意味，适合本段较宽的语义。介词结构译为“在……之中”，自然表达被圈限于某种状态。
- source_word: ἵνα
  choice: 为要
  rationale: ἵνα在此引出目的；“为要”简洁而庄重，清楚呈现目的关系。
- source_word: ἐλεήσῃ
  choice: 怜悯
  rationale: ἐλεέω表示施予怜悯。“怜悯”在现代中文中清楚、庄重，也保留本段神学用语的一致性。
theological_decisions:
- issue: 两处“众人”的范围
  choice: 两处均译作“众人”，不在正文中缩小或扩大所指范围。
  alternative: 译作“所有人”、或解释性地译作“犹太人和外族人双方”。
  rationale: 原文两次重复τοὺς πάντας，形成刻意的对称。本节常被用于讨论普世得救等问题；翻译不应先行解决这种神学张力。上下文涉及犹太人和外族人，但正文仍应保留原文宽泛的措辞。
- issue: ἵνα所表达的关系
  choice: 译作“为要”，保留目的意味。
  alternative: 译作“以致”，偏重结果。
  rationale: ἵνα可涉及目的或结果；此处“为要”最直接保留神行动中的目的关系，而不把虚拟语气误解为神是否会怜悯的不确定性。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“圈在……之中”保留原文意象；“众人”两次重复，以体现保罗原句的对称和神学张力。
