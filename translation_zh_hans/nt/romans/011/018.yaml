  text: μὴ κατακαυχῶ τῶν κλάδων· εἰ δὲ κατακαυχᾶσαι, οὐ σὺ τὴν ῥίζαν βαστάζεις ἀλλὰ ἡ ῥίζα σέ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/018.yaml
  text: do not boast over the branches[a]. But if you do boast, it is not you who support the root[b], but the root supports you.
translation:
  language: zh_hans
  text: 不可向那些枝子夸口[a]。但如果你夸口，不是你托住根，而是根托住你[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “向那些枝子夸口”也可译作“夸口胜过那些枝子”或“向那些枝子自夸”。
    reason: lexical_alternative
  - marker: b
    text: “托住”也可译作“承载”：不是你承载根，而是根承载你。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατακαυχῶ / κατακαυχᾶσαι
  choice: 向……夸耀 / 夸耀
  rationale: 该动词表达对着或凌驾于某人而自夸。首处译作“向那些枝子夸耀”，保留其关系指向而不将语气过度解释为敌对；第二处按条件句自然译为“即使你夸耀”。
- source_word: κλάδων
  choice: 那些枝子
  rationale: 指向上下文橄榄树比喻中特定的枝子；“那些”自然体现希腊文冠词的特指作用。
- source_word: ῥίζαν / ῥίζα
  choice: 根
  rationale: 两处一致译作“根”，完整保留橄榄树的比喻，不在译文中解释其具体所指。
- source_word: βαστάζεις
  choice: 托住
  rationale: “托住”既保留承载的形象，也传达维系、支撑之意；比单纯的“背负”更适合树根与枝子的比喻。
- source_word: οὐ σὺ ... ἀλλὰ ἡ ῥίζα σέ
  choice: 不是你托住根，而是根托住你
  rationale: 以“不是你……而是……”保留原文对“你”和“根”的强调对比及依存关系的逆转。
- source_word: μὴ
  choice: 不可
  rationale: 在劝诫语境中，“不可”简洁、庄重地表达否定命令，同时不对现在时命令式的体貌作过度阐释。
theological_decisions:
- issue: 保罗橄榄树比喻中根与枝子的具体所指
  choice: 正文只保留“根”和“枝子”的比喻，不明说它们分别代表谁或什么。
  alternative: 在译文中把根明确解释为列祖、亚伯拉罕或圣约的应许。
  rationale: 希腊文本身没有在本节明确解释这些意象；直接保留比喻可避免把注释性或宗派性判断写入正文，并保存原文的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“枝子”与“根”保持树木比喻的一致性；“托住”在中文中兼顾具体承托形象与持续支撑之意。所有脚注标记均已置于正文。
