  to: 不可向那些枝子夸口[a]。但如果你夸口，不是你托住根，而是根托住你[b]。
  rationale: 修订仅校正条件句的语气，并将首句调整为更自然、也更贴近 κατακαυχάομαι 关系意味的汉语表达。根与枝子的隐喻、对比强调及脚注锚点均予保留。
