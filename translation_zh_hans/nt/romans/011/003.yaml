  text: Κύριε, τοὺς προφήτας σου ἀπέκτειναν, ⸀τὰ θυσιαστήριά σου κατέσκαψαν, κἀγὼ ὑπελείφθην μόνος, καὶ ζητοῦσιν τὴν ψυχήν μου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/003.yaml
  text: Lord[a], they killed your prophets, they tore down your altars, and I alone was left, and they are seeking my life.
translation:
  language: zh_hans
  text: 主啊，他们杀了你的先知，拆毁了你的祭坛，只剩下我一个人；他们还在寻索我的性命。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“他们还在寻索我的魂”；这里的希腊语惯用语是说他们想要取我的性命。
    reason: 说明ψυχή在此处的语境义，并保留较字面的译法供读者参考。
lexical_decisions:
- source_word: Κύριε
  choice: 主啊
  rationale: κύριος在此是对上帝的直接呼语；“主啊”符合现代汉语圣经语体，也不引入“主人”等不合语境的含义。
- source_word: ἀπέκτειναν
  choice: 杀了
  rationale: 准确表达ἀποκτείνω的杀死之意；不译作“谋杀”，以免加入动词本身未明说的法律或道德判断。
- source_word: τὰ θυσιαστήριά σου
  choice: 你的祭坛
  rationale: θυσιαστήριον指献祭用的坛；汉语“祭坛”已清楚包含其用途，无须增译。
- source_word: κατέσκαψαν
  choice: 拆毁了
  rationale: κατασκάπτω含挖倒、夷平之意；用于祭坛时，“拆毁”既自然，又保留具体的破坏动作。
- source_word: κἀγὼ ὑπελείφθην μόνος
  choice: 只剩下我一个人
  rationale: 以自然汉语表达被动结果及μόνος所强调的仅此一人；避免“我被独自留下”可能产生的生硬或偏重情绪孤独的意味。
- source_word: ζητοῦσιν τὴν ψυχήν μου
  choice: 他们还在寻索我的性命
  rationale: ψυχή在这一威胁性惯用语中指人的性命；“寻索我的性命”保留原文表达方式，而现在进行中的敌对行动由“还在”体现。
theological_decisions:
- issue: 威胁性惯用语中ψυχή的译法
  choice: 我的性命
  alternative: 我的魂
  rationale: 上下文所说的是有人要取以利亚的性命，并非讨论非物质的灵魂；译作“性命”可避免引入原文无意处理的神学人论问题。
- issue: ὑπελείφθην μόνος的排他性强调
  choice: 只剩下我一个人
  alternative: 我被独自留下
  rationale: 本句陈述以利亚所认为的存留人数，重点在“唯独我”；所选译法保留这种张力，不将其改写成主要表达孤独感。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“主啊”保留直接祷告式呼语；分号呈现末两分句之间紧密而递进的关系。“寻索我的性命”略带经文语体色彩，但在现代汉语中仍可理解，并比直接释义为“想杀我”更贴近原文措辞。
