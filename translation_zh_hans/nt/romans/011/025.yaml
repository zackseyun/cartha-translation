id: ROM.11.25
reference: Romans 11:25
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Οὐ γὰρ θέλω ὑμᾶς ἀγνοεῖν, ἀδελφοί, τὸ μυστήριον τοῦτο, ἵνα μὴ ⸀ἦτε ἑαυτοῖς φρόνιμοι, ὅτι πώρωσις ἀπὸ μέρους τῷ Ἰσραὴλ γέγονεν ἄχρι οὗ τὸ πλήρωμα τῶν ἐθνῶν εἰσέλθῃ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/025.yaml
  text: 'For I do not want you to be unaware[a], brothers, of this mystery, so that you may not be wise in your own sight: a partial hardening has come upon Israel until the fullness of the Gentiles has come in[b],'
translation:
  language: zh_hans
  text: 弟兄们，我不愿意你们不知道[a]这个奥秘，免得你们自以为有智慧：以色列中有一部分人已经陷入刚硬的状态，直到外邦人的全数进入[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄们”在这里可以包括弟兄姊妹；希腊原文用的是阳性复数的“弟兄们”。
    reason: lexical_alternative
  - marker: b
    text: 或译“外邦人的丰满进入”。原文“丰满”的具体含义存在争议，也可指“外邦人的全数”。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγνοεῖν
  choice: 不知道
  rationale: 保罗惯用的“我不愿意你们不知道”表示不愿读者对此不知情；此译自然，并避免“无知”的贬义色彩。
- source_word: ἀδελφοί
  choice: 弟兄们
  rationale: 保留希腊文阳性复数呼语的形式；在当时书信语境中可包括女性听众，另以脚注说明。
- source_word: μυστήριον
  choice: 奥秘
  rationale: 指上帝从前隐藏、如今揭示的旨意；“奥秘”保留了保罗用语的神学语域。
- source_word: ἵνα μὴ ἦτε ἑαυτοῖς φρόνιμοι
  choice: 免得你们自以为有智慧
  rationale: 自然表达目的或结果，也准确传达不可按自己的判断自负的警告。
- source_word: πώρωσις
  choice: 变得刚硬
  rationale: 表达属灵上的迟钝和顽梗，同时与完成时 γέγονεν 结合，体现已经形成并持续存在的状态。
- source_word: ἀπὸ μέρους
  choice: 有一部分人
  rationale: 在汉语中自然地表达刚硬只涉及以色列的一部分，避免被理解为每个以色列人只在某种程度上刚硬。
- source_word: τῷ Ἰσραήλ
  choice: 以色列中
  rationale: 结合“有一部分人”来呈现受影响的群体，符合汉语表达，并保留“以色列”所指群体的开放性。
- source_word: γέγονεν
  choice: 变得
  rationale: 与“刚硬”组合，既呈现状态的发生，也暗含该状态延续至今的完成时意味。
- source_word: πλήρωμα
  choice: 丰盛
  rationale: 尽量保留 πλήρωμα 的“丰满、完满”意象，不在正文中限定为人数总额或完全归入。
- source_word: τῶν ἐθνῶν
  choice: 外族人
  rationale: 此处与以色列相对，指非犹太人；“外族人”是清楚而较少带古旧色彩的现代汉语表达。
- source_word: εἰσέλθῃ
  choice: 进入
  rationale: 保留原文未明说进入何处的表达，也使 ἄχρι οὗ 所引出的终点条件清楚自然。
theological_decisions:
- issue: “外族人的丰盛”的确切含义
  choice: 正文译作“外族人的丰盛进入”
  alternative: “外族人的全数进入”或“外族人完全进入”
  rationale: 原文 πλήρωμα 可指丰盛、全数或完满状态；正文保留其歧义，不替经文决定是人数达到总额、完全归入，还是末世性的完成。
- issue: ἀδελφοί 的指称范围
  choice: 正文保留“弟兄们”
  alternative: “弟兄姊妹们”
  rationale: “弟兄们”对应希腊文阳性复数呼语；由于保罗面对的罗马信徒群体包括女性，其包容性用法在脚注中说明。
- issue: 以色列刚硬的范围
  choice: 译作“以色列中有一部分人变得刚硬”
  alternative: “以色列部分地变得刚硬”
  rationale: ἀπὸ μέρους 最自然地限制刚硬的范围，但原短语也可较形式地译作“部分地”；正文避免让人误以为所有以色列人都只在程度上刚硬。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句首呼语更符合汉语自然语序；保留“奥秘”“刚硬”“丰盛”等关键神学词汇。末尾逗号反映本节在后文中句意尚未完结。
