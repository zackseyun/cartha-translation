revisions:
- from: 弟兄们，我不愿意你们不知道[a]这个奥秘，免得你们自以为有智慧：以色列中有一部分人变得刚硬，直到外族人的丰盛进入[b]，
  to: 弟兄们，我不愿意你们不知道[a]这个奥秘，免得你们自以为有智慧：以色列中有一部分人已经陷入刚硬的状态，直到外邦人的全数进入[b]，
  rationale: 修订解决了“丰盛进入”的不自然搭配，并以“外邦人”准确呈现本节中与以色列相对的非犹太人。“全数进入”是中文中可读的表达；脚注保留 πλήρωμα 的字面替代和其未定的解释空间，避免把它限定为某一特定救恩论或末世论立场。“已经陷入刚硬的状态”则更完整地反映 πώρωσις 与 γέγονεν。
