  text: Τί οὖν ἐροῦμεν; ὅτι ἔθνη τὰ μὴ διώκοντα δικαιοσύνην κατέλαβεν δικαιοσύνην, δικαιοσύνην δὲ τὴν ἐκ πίστεως·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/030.yaml
  text: What then shall we say? That the Gentiles, who were not pursuing righteousness, attained righteousness—but the righteousness that is from faith.
translation:
  language: zh_hans
  text: 那么，我们该说什么呢？外邦人[b]并没有追求义[a]，却得着了义，就是出于信的义[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “义”（δικαιοσύνη）也可译作“正义”；这个词的意义范围可包括道德或法律上的正直、公正，以及盟约关系中的合宜。
    reason: lexical_alternative
  - marker: b
    text: “外邦人”也可按字面译作“列国”或“诸民族”；这里指以色列以外、即非犹太的人。
    reason: lexical_alternative
  - marker: c
    text: “出于信的义”也可译作“因信而来的义”或“本于信的义”；此处理解为“出于忠信的义”的可能性较低。
    reason: alternative_reading
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: 那么，我们该说什么呢？
  rationale: 保留保罗常用的推论转折和商议语气，同时采用自然的现代汉语表达。
- source_word: ἔθνη
  choice: 外族人
  rationale: 在本段与以色列相对，指非犹太人；“外族人”比直译“列国”更清楚，也较符合现代普通读者的理解。
- source_word: τὰ μὴ διώκοντα
  choice: 本来不追求
  rationale: “追求”保留 διώκω 的主动、持续意味；“本来”体现其先前并无这种追求的状态，但不额外暗示时间界限。
- source_word: δικαιοσύνην
  choice: 义
  rationale: “义”是保罗书信中 δικαιοσύνη 的传统而宽广的汉语对应，能够涵盖正直、合宜及在神面前为义等层面，而不在正文中限定其神学机制。
- source_word: κατέλαβεν
  choice: 得着了
  rationale: 此处表示达到并取得原本没有追求的事物；“得着了”自然地表达实际获得，也避免过于具象的“抓住”。
- source_word: δικαιοσύνην δὲ τὴν ἐκ πίστεως
  choice: 却得着了义，就是出于信的义
  rationale: “却”呈现“不追求”与“得着”之间的强烈反差；“就是”将重复的“义”理解为进一步说明其性质，保留原文强调而不制造两种义的对立。
- source_word: πίστεως
  choice: 信
  rationale: “信”在此最自然地表示信靠；正文用简洁的“出于信”保留 ἐκ 的来源表达，不扩写为带有后期教义色彩的公式。
theological_decisions:
- issue: 保罗论述中“义”的含义
  choice: 正文译作“义”，不把它限定为单指归算之义或某一种称义理论。
  alternative: 正义；在神面前的正当地位；盟约身份
  rationale: 本节提出外族人所得的是“出于信的义”，却未在此完整解释其机制；宽广的“义”最能保留保罗用语的神学张力。
- issue: ἐκ πίστεως 的含义
  choice: 译作“出于信”。
  alternative: 因信而来；本于信；出于忠信
  rationale: “出于”较直接地保留 ἐκ 的来源意味；不扩写为“唯独因信”等原文没有的措辞。“忠信”在词义上可能，但在此语境中可能性较低，故列入脚注。
- issue: 重复的 δικαιοσύνη 与 δέ 的关系
  choice: 用“就是”将后一句处理为对所得之义的具体说明，同时用“却”表达前半句“不追求”与“得着”的反差。
  alternative: “但所得到的是出于信的义”；“而且是出于信的义”
  rationale: 原文重复“义”并以定冠词短语加以限定，重点是说明所得之义的性质。这样既体现整体反差，也避免把 δέ 过度解释成两种义之间的对立。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“那么，我们该说什么呢？”保留保罗的论辩过渡；“本来不追求……却得着了……”清楚呈现悖论式反差。正文不使用过度教会化或宗派化的扩展措辞，脚注说明必要的词义空间。
