    issue: “让他荣耀的丰富彰显在蒙怜悯的器皿上”中“彰显在……上”的汉语搭配及语义指向不够清楚。
    rationale: γνωρίσῃ主要是“使……被知道／显明”，ἐπὶ在此标示其临到或施及的对象。以“使……显明在……身上”既自然，也较好对应原文。
  - severity: medium
    issue: “预先预备好要得荣耀”略将εἰς δόξαν限定为这些器皿将‘获得’荣耀。
    rationale: εἰς δόξαν可表目的、趋向或归宿；“为着荣耀”保留原文的简洁与歧义，避免增加具体的接受方式。
  revised_text: 也是为了使他荣耀的丰富显明在蒙怜悯的器皿身上；这些器皿是他预先预备好、为着荣耀的。
