  text: ⸀καὶ ἵνα γνωρίσῃ τὸν πλοῦτον τῆς δόξης αὐτοῦ ἐπὶ σκεύη ἐλέους, ἃ προητοίμασεν εἰς δόξαν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/023.yaml
  text: and in order to make known the riches of his glory upon vessels of mercy, which he prepared beforehand for glory,
translation:
  language: zh_hans
  text: 也是为了使他荣耀的丰富显明在蒙怜悯的器皿身上；这些器皿是他预先预备好、为着荣耀的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ἵνα γνωρίσῃ
  choice: 也是为了让……彰显
  rationale: 保留ἵνα的目的意味；γνωρίζω在此指使人知道、显明，译为“让……彰显”较自然，并与“荣耀的丰富”搭配。
- source_word: τὸν πλοῦτον τῆς δόξης αὐτοῦ
  choice: 他荣耀的丰富
  rationale: 贴近原文属格结构，不改释为“丰富荣耀”，以保留“荣耀所具有的丰富”这一表达张力。
- source_word: ἐπὶ σκεύη ἐλέους
  choice: 在蒙怜悯的器皿上
  rationale: ἐπί在此保留“在……上”的方向/施及意味；“蒙怜悯的器皿”既自然，也保留器皿隐喻及属格可能表示特征或承受怜悯。
- source_word: ἃ προητοίμασεν
  choice: 这些器皿，是他预先预备好
  rationale: 明确关系代词ἃ所指为器皿；“预先预备好”表达προ-的先行意味，同时避免添加原文未明说的时间点。
- source_word: εἰς δόξαν
  choice: 要得荣耀
  rationale: 表达εἰς的目标/归向含义；“得荣耀”较现代自然，同时不把荣耀具体化为地点或仅仅理解为用途。
theological_decisions:
- issue: “预先预备”的主体及对象
  choice: 保留“他”作主体，并以“这些器皿”为对象
  alternative: 使用无主句或将其泛化为“预备好了”
  rationale: 原文动词προητοίμασεν是第三人称单数，最近且自然的主体为上文的神；关系代词明确指向“蒙怜悯的器皿”。
- issue: “蒙怜悯的器皿”的属格关系
  choice: 译为“蒙怜悯的器皿”
  alternative: “怜悯的器皿”
  rationale: 中文“蒙怜悯”清楚表达器皿是怜悯的承受者，但仍保留其作为具有怜悯特征之器皿的隐喻，不延伸为特定宗派的预定论表述。
- issue: εἰς δόξαν的神学指向
  choice: 译为“要得荣耀”
  alternative: “为荣耀”或“进入荣耀”
  rationale: 原文可表达目的或归宿；“要得荣耀”保留终向性而不擅自判定是分享神的荣耀、进入末世荣耀，还是成为彰显荣耀的对象。
translation_notes:
  register: 采用现代、庄重且易懂的书面普通话。分号承接第22节未完的条件—目的句结构，同时使本节内部层次清楚；保留“器皿”这一关键隐喻。
