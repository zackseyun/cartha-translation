base_translation:
  language: en
  yaml_path: translation/nt/romans/009/031.yaml
  text: But Israel[a], pursuing a law of righteousness[b], did not attain to that law.
translation:
  language: zh_hans
  text: 可是，以色列追求关乎义的律法[a]，却没有达到那律法[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “义”也可译作“公正”。
    reason: lexical_alternative
  - marker: b
    text: 本句后半也可译作“却没有到达律法”或“却没有达到它”。希腊原文的表达简练，句法较难确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰσραήλ
  choice: 以色列
  rationale: 采用现代汉语通行的圣经专名译法；在本段论证中指民族意义上的以色列。
- source_word: δέ
  choice: 可是
  rationale: 承接上文外邦人的情形并形成鲜明对比；“可是”自然传达转折语气。
- source_word: διώκων
  choice: 追求
  rationale: 保留该分词所表达的积极寻求、竭力趋向之意，不额外加入希腊文未明说的让步关系。
- source_word: νόμον δικαιοσύνης
  choice: 一个关乎义的律法
  rationale: νόμον 未带冠词，译作“一个……律法”；“关乎义”保留属格关系的弹性，不武断限定为“使人称义的律法”或“公义的律法”。
- source_word: δικαιοσύνης
  choice: 义
  rationale: 在保罗书信的语境中，“义”既简洁又能承载与神面前正确地位及合宜状态相关的含义；脚注保留“公正”这一词义可能。
- source_word: εἰς νόμον
  choice: 达到那律法
  rationale: 按上下文把第二个 νόμον 理解为回指所追求的律法；“那律法”使汉语指代清楚，同时在脚注保留原文压缩结构的其他译法。
- source_word: οὐκ ἔφθασεν
  choice: 却没有达到
  rationale: ἔφθασεν 与 εἰς 连用表示未能到达或达成目标；“没有达到”准确而自然。
theological_decisions:
- issue: 保罗语境中 δικαιοσύνη 的译法
  choice: 义
  alternative: 公正
  rationale: “义”更能贴合本段关于人在神面前所得地位的论证，同时不将词义缩减为现代法律或社会层面的公正；以脚注保留另一词义。
- issue: νόμον δικαιοσύνης 中属格关系的理解
  choice: 关乎义的律法
  alternative: 使人得义的律法；公义的律法
  rationale: 原文没有明确说明律法是产生义、要求义，还是以义为特征；采用较开放的表达，以保存原有的神学张力。
- issue: 第二个 νόμον 的指向
  choice: 那律法
  alternative: 律法；一个律法；律法的目标
  rationale: 回指前面的 νόμον 最符合重复用词及追求而未达到的语境；不采用“律法的目标”，以免加入原文没有明说的目的论解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“关乎义”略带书面色彩，但可避免把含义过早限定为“使人称义”或“公义”；两个脚注标记均放在其实际说明的词句之后。
