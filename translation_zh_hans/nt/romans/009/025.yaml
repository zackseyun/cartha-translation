  text: ὡς καὶ ἐν τῷ Ὡσηὲ λέγει· Καλέσω τὸν οὐ λαόν μου λαόν μου καὶ τὴν οὐκ ἠγαπημένην ἠγαπημένην·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/025.yaml
  text: as he also says in Hosea[a], “I will call those who were not my people, ‘my people,’ and her who was not loved[c][b], ‘loved.’”
translation:
  language: zh_hans
  text: '正如他也在何西阿书中说：


    “我要把那不是我子民的称为‘我的子民’，


    把那不蒙爱的[a]称为‘蒙爱的’。”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “那不蒙爱的”在希腊原文中是阴性单数，承接何西阿书中的女性形象；也可译作“那不被爱的”。
    reason: lexical_alternative
  - marker: b
    text: 引自何西阿书2:23（希伯来文本编号；七十士译本为2:25）。保罗用何西阿书所说的复兴，说明神呼召一群人成为自己的子民。
    reason: cross_reference
lexical_decisions:
- source_word: ὡς καὶ
  choice: 正如……也
  rationale: 引出作为佐证的经文，保留ὡς的比较意味和καί的附加意味，同时符合现代汉语表达。
- source_word: ἐν τῷ Ὡσηὲ
  choice: 在何西阿书中
  rationale: 这是引用公式，指何西阿的著作；补出“书”能在汉语中清楚自然地表达。
- source_word: λέγει
  choice: 他说
  rationale: 希腊文用第三人称单数，语境中的说话者是神；保留人格化的经文表达，不改作“经上说”。
- source_word: Καλέσω
  choice: 我要称……为
  rationale: καλέω在此表示命名或认定；“称……为”既直接，也能自然带出后面的身份名称。
- source_word: τὸν οὐ λαόν μου
  choice: 那不是我子民的
  rationale: 原文为阳性单数形式，但λαός本身具有群体含义。汉语“那……的”既可保持形式上的单数，又不排除整体性指向。
- source_word: λαόν μου
  choice: 我的子民
  rationale: 保留圣约语境中的归属关系；“子民”比一般的“人民”更适合神与其群体的关系。
- source_word: τὴν οὐκ ἠγαπημένην
  choice: 那不蒙爱的
  rationale: 保留阴性单数所表达的何西阿背景，并以“蒙爱”体现完成时被动分词的受动含义。汉语无需强加女性代词，仍可由脚注说明其阴性形式。
- source_word: ἠγαπημένην
  choice: 蒙爱的
  rationale: 与前一短语保持同一词根和被动含义；“蒙爱”自然、庄重，也适合神施爱的语境。
theological_decisions:
- issue: 何西阿引文中单数形式与群体含义的关系
  choice: 正文译作“那不是我子民的”，保留单数式表达，同时让“子民”呈现其群体含义。
  alternative: 译作“那些原不是我子民的人”，明确采用复数和群体性表达。
  rationale: 保罗用何西阿的复兴语言说明神为自己呼召子民。原文形式为单数，但首句语义具有群体性；当前译法不把两者之间的张力消除。
- issue: 阴性分词的呈现
  choice: 正文用中性的汉语关系结构“那不蒙爱的”，并在脚注说明原文为阴性单数。
  alternative: 译作“那不蒙爱的女子”或“她这不蒙爱的”。
  rationale: 阴性形式关联何西阿书中的女性形象，但直接补入“女子”会比希腊文本说得更明确；脚注既保存背景，也避免正文过度解释。
- issue: ἠγαπημένην的词义
  choice: 译作“蒙爱的”，突出被动地领受爱。
  alternative: 译作“所爱的”或“爱女”。
  rationale: “蒙爱的”保留完成时被动分词的意义及神施爱的方向，又不把它固化成专名。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。引文保留平行结构与圣经性的“我的子民”表达；避免用“非我民”“不蒙怜悯者”等过度古雅或偏离本节希腊措辞的译法。
