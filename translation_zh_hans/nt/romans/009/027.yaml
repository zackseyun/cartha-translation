  text: Ἠσαΐας δὲ κράζει ὑπὲρ τοῦ Ἰσραήλ· Ἐὰν ᾖ ὁ ἀριθμὸς τῶν υἱῶν Ἰσραὴλ ὡς ἡ ἄμμος τῆς θαλάσσης, τὸ ⸀ὑπόλειμμα σωθήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/027.yaml
  text: But Isaiah cries out concerning Israel[a], “Though the number of the sons of Israel is like the sand of the sea[c][b], only the remnant will be saved.”
translation:
  language: zh_hans
  text: 然而，以赛亚论到以色列时呼喊说：“以色列子孙的数目虽然多如海沙，[a]得救的却只是余民。[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文也可译作：“如果以色列子孙的数目多如海沙”或“即使以色列子孙的数目多如海沙”。这里的条件句在上下文中带有让步意味。
    reason: alternative_reading
  - marker: b
    text: “得救”也可译作“获救”或“蒙拯救”；这句话呼应以赛亚关于余民获救的预言。
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: 然而
  rationale: 承接上文并显出轻微转折，符合保罗此处的论述推进。
- source_word: κράζει
  choice: 呼喊说
  rationale: 保留现在时所呈现的鲜明、强烈宣告语气，同时符合现代汉语表达。
- source_word: ὑπὲρ τοῦ Ἰσραήλ
  choice: 论到以色列
  rationale: 在先知引文语境中，ὑπέρ最自然地表示“关于、论及”，而不是“代表、为……求情”。
- source_word: Ἐὰν ᾖ
  choice: 虽然……多
  rationale: 原文形式为条件句，但在这里结合下句形成让步关系；译作“虽然”自然呈现数量众多与仅余民得救之间的对照。
- source_word: ὁ ἀριθμὸς τῶν υἱῶν Ἰσραήλ
  choice: 以色列子孙的数目
  rationale: “以色列子孙”保留传统盟约群体称谓，也比逐字译作“以色列的儿子们”更符合现代汉语。
- source_word: ὡς ἡ ἄμμος τῆς θαλάσσης
  choice: 多如海沙
  rationale: 采用自然且庄重的汉语成语式表达，准确保留数量如海沙般众多的比喻。
- source_word: τὸ ὑπόλειμμα
  choice: 余民
  rationale: “余民”是简洁、成熟的圣经用语，准确指整体之中存留下来的群体。
- source_word: σωθήσεται
  choice: 得救
  rationale: 符合保罗在《罗马书》中的救恩语境，同时保留以赛亚预言背景中“获救、蒙拯救”的含义。
theological_decisions:
- issue: Ἐὰν ᾖ在先知引文中的语义作用
  choice: 按让步义译为“虽然……多”
  alternative: 按形式直译为“如果……像海沙一样多”或“即使……像海沙一样多”
  rationale: 本句强调以色列人数众多与只有余民得救之间的反差。“虽然”清楚传达此逻辑，又以脚注保留原文条件式的形式。
- issue: σωθήσεται的译法
  choice: “得救”
  alternative: “获救”或“蒙拯救”
  rationale: “得救”保留保罗语境中的神学分量，但不限定得救的具体层面；脚注说明其先知背景中的拯救含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“论到……时呼喊说”保留先知宣告的力度；“以色列子孙”和“余民”保留经文传统称谓。脚注标记均置于正文对应位置。
