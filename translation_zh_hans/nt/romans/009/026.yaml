  text: καὶ ἔσται ἐν τῷ τόπῳ οὗ ἐρρέθη ⸀αὐτοῖς· Οὐ λαός μου ὑμεῖς, ἐκεῖ κληθήσονται υἱοὶ θεοῦ ζῶντος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/026.yaml
  text: And in the very place where it was said to them[b][a], ‘You are not my people,’ there they will be called sons of the living God.
translation:
  language: zh_hans
  text: 又必在曾对他们说：“你们不是我的子民”的地方[a]，正是在那里，他们将被称为永活上帝的儿子[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 引自或化用《何西阿书》1:10（《七十士译本》2:1），采用上帝恢复盟约关系的语言。
    reason: cross_reference
  - marker: b
    text: 或译“永活上帝的儿女”。希腊文直译为“儿子”，这里保留原词，以呈现儿子身份及承受产业的意味；所指群体包括男女。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: 也
  rationale: 以简洁连接词承接前一节和继续引文，不额外加入推论意味。
- source_word: ἔσται
  choice: 必
  rationale: 结合整句表达将来的应验；现代中文用“必”自然体现未来及确定性，而无需生硬译出“将会是”。
- source_word: ἐν τῷ τόπῳ οὗ ἐρρέθη αὐτοῖς
  choice: 在从前有话对他们说……的地方
  rationale: 保留非人称被动表达，不补明说话者；“从前”自然呈现不定过去时所指的既往言说。
- source_word: Οὐ λαός μου ὑμεῖς
  choice: 你们不是我的子民
  rationale: 保留旧约盟约公式“我的子民”，并按现代汉语语序清楚表达。
- source_word: ἐκεῖ
  choice: 就在那里
  rationale: “就”凸显身份逆转发生在同一地方，与前面的“地方”形成对应。
- source_word: κληθήσονται
  choice: 必被称为
  rationale: 保留将来被动语态，不把经文未明说的施事者补成上帝。
- source_word: υἱοὶ
  choice: 儿子
  rationale: 原文明确使用阳性复数“儿子”，此译法保留儿子身份及潜在的承受产业意味；其群体指涉可包含男女，脚注予以说明。
- source_word: θεοῦ ζῶντος
  choice: 永生上帝的
  rationale: “永生上帝”是自然、庄重且沿用已久的中文圣经表达，意为活着的上帝，并保留其与无生命偶像的潜在对照。
theological_decisions:
- issue: υἱοὶ作为群体身份称谓的译法
  choice: 儿子
  alternative: 儿女
  rationale: “儿子”更贴近希腊文υἱοὶ，并保留保罗语境中可能具有的儿子身份和继承意味；但所指群体并不限于男性，因此在脚注中列出“儿女”这一意义更明确的译法。
- issue: λαός μου的盟约身份含义
  choice: 我的子民
  alternative: 属我的人民
  rationale: “我的子民”是中文中自然、庄重的盟约公式，也忠实保留何西阿书背景中的群体身份语言。
- issue: κληθήσονται的隐含施事者
  choice: 必被称为
  alternative: 上帝必称他们为
  rationale: 原文使用被动式而未明说施事者；保留被动可避免把虽可能成立但未明载的信息加入正文。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“从前有话对他们说”保留原文的非人称被动；“就在那里”突出同一地点中的身份逆转。脚注标记均置于正文相关内容之后。
