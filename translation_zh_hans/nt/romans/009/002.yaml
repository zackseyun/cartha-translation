translation:
  language: zh_hans
  text: 我有极大的忧愁，心里有不断的痛苦[a][b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “忧愁”或译“悲伤”。
    reason: lexical_alternative
  - marker: b
    text: “痛苦”或译“煎熬”。
    reason: lexical_alternative
  - marker: c
    text: 希腊文直译为“对我的心”，是表示内心感受的惯用说法，因此译作“心里”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: 就是
  rationale: 承接上一节的郑重陈述，引出其具体内容；“就是”在现代汉语中自然表达内容关系，而不误作原因关系。
- source_word: λύπη
  choice: 忧愁
  rationale: 表示深重的悲伤；“忧愁”自然庄重，也与后面的“痛苦”形成适当区分。
- source_word: μοί ἐστιν
  choice: 我有
  rationale: 与格代词加系词表示当事人所具有或经历的状态，汉语用“我有”表达自然清楚。
- source_word: μεγάλη
  choice: 极大的
  rationale: 修饰“忧愁”，强调其程度；“极大的”保留了原文的强度。
- source_word: καὶ
  choice: ，
  rationale: 原文连接两个并列的悲痛表述；汉语以逗号并列更流畅，关系仍然清楚。
- source_word: ἀδιάλειπτος
  choice: 不断的
  rationale: 表达持续不止的状态；“不断的”是现代汉语中自然且有力度的说法。
- source_word: ὀδύνη
  choice: 痛苦
  rationale: 指强烈的内在痛楚或煎熬；“痛苦”直接而自然，同时保留“煎熬”这一较强译法的可能。
- source_word: τῇ καρδίᾳ μου
  choice: 心里
  rationale: 原文直译为“对我的心”，按其惯用意义指内在情感所在；“心里”保留了圣经的“心”这一意象，又符合现代汉语习惯。
