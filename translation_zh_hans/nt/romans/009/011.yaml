source:
  edition: SBLGNT
  text: μήπω γὰρ γεννηθέντων μηδὲ πραξάντων τι ἀγαθὸν ἢ ⸀φαῦλον, ἵνα ἡ κατ’ ἐκλογὴν πρόθεσις τοῦ θεοῦ μένῃ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/011.yaml
  text: For before they had yet been born or had done anything good or bad[a], so that God’s purpose according to election might remain[c][b],
translation:
  language: zh_hans
  text: 因为双生子还没有出生，也没有做过什么善事或恶事[a]，为要使神按着拣选所定的旨意得以存立[b][c]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恶事”也可译作“坏事”。原文 φαῦλον 可指坏的、卑劣的或道德上的恶。
    reason: lexical_alternative
  - marker: b
    text: “神按着拣选所定的旨意”也可译作“神拣选的旨意”或“神照着拣选所定的旨意”。
    reason: lexical_alternative
  - marker: c
    text: “存立”也可译作“长存”。原文动词有“持续、留存”的意思，在这里也可能含有“站立得住”的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: μήπω γὰρ γεννηθέντων
  choice: 因为双生子还没有出生
  rationale: 以“还没有”表达 μήπω，以“因为”保留 γάρ 对上文的解释关系；希腊文主语由上下文确定为双生子，汉语中补明可避免悬空。
- source_word: μηδὲ πραξάντων τι ἀγαθὸν ἢ φαῦλον
  choice: 也没有做过什么善事或恶事
  rationale: 保留并列否定；φαῦλον 可指坏的、卑劣的或道德上的恶，与 ἀγαθόν 对举时译作“恶事”自然且庄重，并以脚注保留较弱译法。
- source_word: ἵνα
  choice: 为要使
  rationale: 明确呈现目的从句，同时不把经文扩释为某一预定论体系。
- source_word: ἡ κατ’ ἐκλογὴν πρόθεσις τοῦ θεοῦ
  choice: 神按拣选而定的旨意
  rationale: 保留 κατ’ ἐκλογήν 的关系，不简单并合为教义化较强的术语；“旨意”在此表达 πρόθεσις 的计划、目的之义。
- source_word: μένῃ
  choice: 得以存立
  rationale: 兼顾 μένω 的“持续、留存”与本处“站立得住、保持有效”的语境含义；脚注列出更直接的“长存”。
theological_decisions:
- issue: ἵνα 在拣选语境中的语力
  choice: 译作目的关系“为要使”
  alternative: 译作结果关系“以致”
  rationale: 语法最自然地表示目的，但不进一步说明拣选与人的行为之间的系统神学关系，以保留经文本身的张力。
- issue: ἐκλογή 的译法
  choice: 拣选
  alternative: 选择
  rationale: “拣选”能体现保罗语境中的词义分量，又不在译文中界定其完整教义机制。
- issue: μένῃ 所表达的持续性
  choice: 得以存立
  alternative: 得以长存
  rationale: “存立”既可表达持续存在，也带有成立、站稳之感，但不擅自补入“不可改变”等更强结论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。因本节希腊文是承接上下文的未完句，末尾保留逗号。为避免汉语主语不明，依罗马书9:10的上下文补出“双生子”；不补入“不是由于行为”等属于下一节的内容。
