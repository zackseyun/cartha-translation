id: ROM.9.1
reference: Romans 9:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ἀλήθειαν λέγω ἐν Χριστῷ, οὐ ψεύδομαι, συμμαρτυρούσης μοι τῆς συνειδήσεώς μου ἐν πνεύματι ἁγίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/001.yaml
  text: I am telling the truth in Messiah[a]; I am not lying, as my conscience bears witness with me in the Holy Spirit[c][b],
translation:
  language: zh_hans
  text: 我在弥赛亚[a]里说真话，并没有说谎；我的良心也在圣灵[c]里与我一同作证[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在基督里”。希腊语Χριστός意为“受膏者”，既可作为称号使用，也可近似专名使用；此处正文按称号译作“弥赛亚”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“我的良心也与我一同见证”或“同时有我的良心为我作证”。
    reason: lexical_alternative
  - marker: c
    text: 也有可能译作“在圣洁的灵里”，不过按保罗的通常用法，这里最自然是指圣灵。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀλήθειαν λέγω
  choice: 我……说真话
  rationale: 这是表示如实说话的惯用表达；译文采用现代汉语的自然说法，同时保留原文庄重而强调的断言。
- source_word: ἐν Χριστῷ
  choice: 在弥赛亚里
  rationale: Χριστός本义为“受膏者”，在此具有称号色彩。“弥赛亚”保留这一称号性质；“在……里”也保留介词ἐν，不把其关系具体化为凭借、奉名或指着起誓。
- source_word: οὐ ψεύδομαι
  choice: 并没有说谎
  rationale: 直接、自然地表达原文对前一句的强调性否定。
- source_word: συμμαρτυρούσης
  choice: 也……与我一同作证
  rationale: 保留复合动词中συν-的“一同、共同”含义，并用“也”体现良心对保罗所言的共同印证。
- source_word: τῆς συνειδήσεώς μου
  choice: 我的良心
  rationale: 这是συνείδησις在保罗书信中的常规现代汉语对应表达。
- source_word: ἐν πνεύματι ἁγίῳ
  choice: 在圣灵里
  rationale: 按保罗常见用法，最自然地指圣灵；直译ἐν为“在……里”，避免擅自限定为工具性的“借着”。
theological_decisions:
- issue: πνεύματι ἁγίῳ所指为何
  choice: 圣灵，即上帝的灵
  alternative: 圣洁的灵，或保罗被分别为圣的内在之灵
  rationale: 无冠词的表达在保罗用语中仍可自然指圣灵；此处“在圣灵里”最符合语境，但脚注保留语法上较弱的另一种理解。
- issue: ἐν Χριστῷ的关系含义
  choice: 保留为“在弥赛亚里”
  alternative: “靠着弥赛亚”“指着弥赛亚”或“奉弥赛亚的名”
  rationale: 原文ἐν的关系具有一定概括性；不将其明确处理为工具、起誓公式或授权公式，以免消除原有张力。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“说真话／没有说谎／一同作证”清楚易懂；保留“在弥赛亚里”和“在圣灵里”的原文关系表达，不以解释性改写消除歧义。所有脚注标记均置于正文相应词句之后。
