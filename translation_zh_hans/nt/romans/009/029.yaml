id: ROM.9.29
reference: Romans 9:29
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ καθὼς προείρηκεν Ἠσαΐας· Εἰ μὴ κύριος Σαβαὼθ ἐγκατέλιπεν ἡμῖν σπέρμα, ὡς Σόδομα ἂν ἐγενήθημεν καὶ ὡς Γόμορρα ἂν ὡμοιώθημεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/029.yaml
  text: And just as Isaiah said before[a], “If the Lord of Hosts had not left us offspring[c][b], we would have become like Sodom and been made like Gomorrah.”
translation:
  language: zh_hans
  text: 正如以赛亚早已说过：“若不是万军之主[a]给我们留下后裔[b][c]，我们早就成了所多玛，也早已像蛾摩拉一样了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“主撒巴特”；希腊文“撒巴特”音译自希伯来文的神圣称号，意思是“万军”或“众军”。
    reason: lexical_alternative
  - marker: b
    text: 直译“种子”；这里指存留下来的后裔或子孙。
    reason: lexical_alternative
  - marker: c
    text: 引自《以赛亚书》1:9。
    reason: cross_reference
lexical_decisions:
- source_word: καθὼς
  choice: 正如
  rationale: 引出与前文相呼应的经文引证，保留比较和对应意味，也符合现代汉语表达。
- source_word: προείρηκεν
  choice: 早已说过
  rationale: 既表达此前已经说过，也体现完成时所含的持续相关性；不译作“预言”，以免把先前的经文陈述限定为预测。
- source_word: κύριος Σαβαὼθ
  choice: 万军之主
  rationale: Σαβαώθ是对希伯来神圣称号的音译；译出其含义比再次音译更易懂。“万军之主”是庄重、通行且贴近旧约背景的汉语表达。
- source_word: ἐγκατέλιπεν
  choice: 留下
  rationale: 直接保留“使之留下、留下来”的基本意义；在本语境中也自然传达存留之意，而不把解释性的“保全”放入正文。
- source_word: σπέρμα
  choice: 后裔
  rationale: 字面为“种子”，此处指存留下来的子孙。“后裔”自然准确，同时避免直接译成带有较强神学解释色彩的“余民”。
- source_word: ὡς Σόδομα ἂν ἐγενήθημεν
  choice: 我们早就成了所多玛
  rationale: ἄν与过去时态构成与事实相反的结果，“早就……了”自然表达该反事实意味；“成了”对应γίνομαι。
- source_word: ὡς Γόμορρα ἂν ὡμοιώθημεν
  choice: 也早已像蛾摩拉一样了
  rationale: 保留与前一分句平行而不完全重复的表达；ὁμοιόω的被动意义在汉语中以“像……一样”自然呈现。
theological_decisions:
- issue: 旧约引文中 κύριος Σαβαώθ 的译法
  choice: 万军之主
  alternative: 主撒巴特；万军之耶和华；众军之主
  rationale: 保罗的希腊文本使用κύριος并音译希伯来称号。正文译出称号含义，同时保留“主”，不越过希腊文本直接改写为“耶和华”。脚注说明其音译和可替代译法。
- issue: σπέρμα是否译作“余民”
  choice: 后裔
  alternative: 种子；余种；余民
  rationale: 本节实际用词是σπέρμα（种子、后裔）。虽然上下文涉及余民，正文仍保留该词本身的后裔意象，不以“余民”消解词汇和神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“正如……早已说过”适合经文引证；“若不是……早就……”清楚表达反事实条件。保留“所多玛／蛾摩拉”的传统通行地名，并以脚注交代神圣称号与“种子”的字面意义。
