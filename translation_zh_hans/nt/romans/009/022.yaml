id: ROM.9.22
reference: Romans 9:22
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἰ δὲ θέλων ὁ θεὸς ἐνδείξασθαι τὴν ὀργὴν καὶ γνωρίσαι τὸ δυνατὸν αὐτοῦ ἤνεγκεν ἐν πολλῇ μακροθυμίᾳ σκεύη ὀργῆς κατηρτισμένα εἰς ἀπώλειαν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/022.yaml
  text: But what if God[a], wanting to display his wrath and make known his power, endured with great patience vessels of wrath prepared for destruction[c][b],
translation:
  language: zh_hans
  text: 倘若神[a]有意彰显他的愤怒，使人知道他的大能[b]，以极大的忍耐宽容那些作为愤怒对象、已为毁灭预备好的器皿[c]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“但如果神……”。希腊文在这里开始一个修辞性的条件句，句子延续到下一节。
    reason: lexical_alternative
  - marker: b
    text: 或译：“他的能力”。原文直译近于“他所能的”，在这里指神的大能。
    reason: lexical_alternative
  - marker: c
    text: “已为毁灭预备好的”是被动表达，原文没有说明是谁预备了这些器皿。有人理解为神的作为，有人理解为人使自己刚硬，也有人认为这里只是在描述它们已处于面临审判的状态。“作为愤怒对象”用于表达原文简约的“愤怒之器”，并不表示它们自身发怒，也不预先断定其预备者。
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ δὲ
  choice: 倘若
  rationale: 引出延续到下一节的修辞性条件句；“倘若”既保留条件语气，也不把本节误作完整陈述。δέ在此主要承担转折和论述推进功能，中文无需另加生硬的“但是”。
- source_word: θέλων
  choice: 有意
  rationale: 保留分词所表达的意愿或意图，同时避免擅自判定它与主句是让步关系还是原因关系。
- source_word: ἐνδείξασθαι τὴν ὀργήν
  choice: 彰显他的愤怒
  rationale: “彰显”表达有目的地显明；“愤怒”在此承载神审判性的忿怒，语体庄重且现代。
- source_word: γνωρίσαι
  choice: 使人知道
  rationale: 自然表达使某事为人所知的使动含义；宾语“他的大能”紧随其后。
- source_word: τὸ δυνατὸν αὐτοῦ
  choice: 他的大能
  rationale: 该中性形容词名词化短语在上下文指神所具有的能力；“大能”符合圣经语境，又保留庄重感。
- source_word: ἤνεγκεν
  choice: 宽容
  rationale: 与“以极大的忍耐”连用，表达长期忍受、容忍这些器皿；比直译为“承受”更符合现代汉语搭配。
- source_word: ἐν πολλῇ μακροθυμίᾳ
  choice: 以极大的忍耐
  rationale: 准确表达行事方式及程度，现代读者容易理解。
- source_word: σκεύη ὀργῆς
  choice: 可怒之器
  rationale: 保留紧接陶匠比喻的“器皿”意象，并用“可怒”维持属格短语的凝练与一定歧义，不扩写成明确的行动者或命定关系。
- source_word: κατηρτισμένα
  choice: 预备好的
  rationale: 反映完成时被动分词所表示的既成状态，同时不说明是谁预备的。
- source_word: εἰς ἀπώλειαν
  choice: 为毁灭
  rationale: 简洁表达所趋向的结局或用途，避免较古旧的“沉沦”。
theological_decisions:
- issue: κατηρτισμένα（“预备好的”）这一被动形式所暗示的行动者
  choice: 正文采用被动表达“预备好的”，不指明预备者。
  alternative: 译作“神为毁灭而预备的”、“适合毁灭的”，或理解为他们使自己成为毁灭的对象。
  rationale: 希腊文只陈述这些器皿处于已经预备好的状态，并未明说行动者；正文应保留这一重要的神学张力。
- issue: εἰ引出的未完条件句
  choice: 以“倘若”开头，并以逗号收束本节，使句意延续到下一节。
  alternative: 将本节改写为独立的肯定陈述，或用反问号使其在本节结束。
  rationale: 原文条件结构延续至第23节；保持悬置句法可避免在第22节单独强化保罗的断言。
- issue: θέλων与主句ἤνεγκεν之间的逻辑关系
  choice: 译为中性的“有意……却……”，不明定为原因或让步。
  alternative: 译作“因为神想要……”或“神虽然想要……”。
  rationale: 分词与主句的确切逻辑关系在语法上有解释空间；正文不应擅自固定为原因或让步。“却”自然呈现意图与忍耐之间的修辞张力，但不把θέλων本身改译成“虽然”。
- issue: σκεύη ὀργῆς中属格ὀργῆς的关系
  choice: 保留凝练的“可怒之器”。
  alternative: “盛怒的器皿”、“承受愤怒的器皿”或“注定受愤怒的器皿”。
  rationale: 原文属格关系简约，可能涉及器皿与神愤怒的关联而未详加界定；避免在正文中加入“注定”或明确承受关系。
translation_notes:
  register: 采用现代、庄重而可读的普通话。保留陶匠段落中的“器”之意象、条件句跨节悬置的结构，以及被动分词未说明行动者的歧义。标点以逗号结尾，提示句子尚未完结。
