  to: 不是出于行为，而是出于那位呼召者；有人对她说：“年长的要服侍年幼的。”[b][c]
  rationale: 将“那位呼召人的”改为“那位呼召者”，以准确自然地表达实词化现在分词。将“上帝就对她说”改为“有人对她说”，在自然汉语中表达原文无人称被动，同时不把《创世记》背景中可推知的说话者作为本节正文的明示信息。脚注a一并修正。脚注a保留为词汇备选说明，虽其锚点在此简洁正文中不另重复标示，b、c继续锚定引文。
