  text: οὐκ ἐξ ἔργων ἀλλ’ ἐκ τοῦ καλοῦντος, ἐρρέθη αὐτῇ ὅτι Ὁ μείζων δουλεύσει τῷ ἐλάσσονι·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/012.yaml
  text: not from works but from the One who calls[a], it was said to her[c][b], “The older will serve the younger.”
translation:
  language: zh_hans
  text: 不是出于行为，而是出于那位呼召者；有人对她说：“年长的要服侍年幼的。”[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 引自《创世记》25:23。
    reason: cross_reference
  - marker: c
    text: “年长的……年幼的”也可译作“较大的……较小的”；正文按雅各和以扫的语境翻译。
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ ἐξ ἔργων
  choice: 不在于行为
  rationale: ἐκ加属格在此可表示根据或来源；“不在于行为”以自然中文保留保罗简洁的对比，也避免把“行为”具体化为经文未明说的某一类行为。
- source_word: ἀλλ’ ἐκ τοῦ καλοῦντος
  choice: 而在于那位呼召人的
  rationale: 带冠词的现在分词τοῦ καλοῦντος作名词用，所指为上帝；“那位呼召人的”保留呼召行动的持续性，并与前句形成紧凑对照。
- source_word: ἐρρέθη αὐτῇ
  choice: 上帝就对她说
  rationale: 希腊文直译为“有话对她说”；中文若保留无人称被动会显得生硬。上下文中说话者明确是上帝，因此在正文补出主语以求自然，但用脚注注明原文形式。
- source_word: ὅτι
  choice: ：“
  rationale: ὅτι在此引出直接引语，以中文冒号和引号自然表达。
- source_word: Ὁ μείζων
  choice: 年长的
  rationale: μείζων本义可为“较大的、较尊贵的”；在雅各与以扫的语境中指年长者，译作“年长的”清楚而不失语境含义。
- source_word: δουλεύσει
  choice: 要服侍
  rationale: δουλεύω可指作奴仆或处于从属地位；此处“服侍”保留从属关系，又不把奴役制度的具体含义过度带入。
- source_word: τῷ ἐλάσσονι
  choice: 年幼的
  rationale: ἐλάσσων可指“较小的、较次的”；与μείζων成对，并结合双胞胎语境，译作“年幼的”最为自然。
theological_decisions:
- issue: 是否将“不在于行为，而在于那位呼召人的”扩写为特定的无条件拣选教义表述
  choice: 保留经文本身紧凑的行为与呼召者之对比，不作教义性扩写。
  alternative: 不是因为人的行为，而完全是因为上帝无条件的拣选
  rationale: 本节确实把行为与上帝的呼召相对照，但更完整的教义结论需从上下文论证，不应被直接加入本节译文。
- issue: 是否在ἐρρέθη αὐτῇ中补出说话者为上帝
  choice: 正文译作“上帝就对她说”，脚注说明原文为无人称被动。
  alternative: 有话对她说／有人对她说
  rationale: 原文没有明写主语，但其引文来自上帝对利百加所说的话；中文补出上帝可避免生硬和歧义，同时脚注保存原文表达方式。
- issue: Ὁ μείζων与τῷ ἐλάσσονι应表达年龄还是较大／较小的地位
  choice: 正文按创世记语境译作“年长的／年幼的”。
  alternative: 较大的要服侍较小的
  rationale: 原词容许较广的比较意义，但雅各与以扫的语境明确支持年龄对比；脚注保留较直译的可能。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“不在于……而在于……”自然呈现ἐκ所表达的根据或来源；引文保持简洁有力。所有脚注标记均已置于正文。
