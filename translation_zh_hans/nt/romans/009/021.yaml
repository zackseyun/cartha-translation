source:
  edition: SBLGNT
  text: ἢ οὐκ ἔχει ἐξουσίαν ὁ κεραμεὺς τοῦ πηλοῦ ἐκ τοῦ αὐτοῦ φυράματος ποιῆσαι ὃ μὲν εἰς τιμὴν σκεῦος ὃ δὲ εἰς ἀτιμίαν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/021.yaml
  text: Or does the potter not have authority over the clay[d][c][b][a], to make from the same lump one vessel for honor and another for dishonor?
translation:
  language: zh_hans
  text: 难道陶匠没有权柄支配泥土[a]，从同一团泥[b]中做成一个尊贵的器皿，另一个卑贱的器皿吗？[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “有权柄支配泥土”也可译作“对泥土有权利”。
    reason: lexical_alternative
  - marker: b
    text: “同一团泥”也可译作“同一批泥”或“同一块泥料”。
    reason: lexical_alternative
  - marker: d
    text: 这个意象呼应旧约中陶匠与泥土的经文，如以赛亚书29:16；45:9；耶利米书18:1–6。
    reason: cross_reference
lexical_decisions:
- source_word: ἢ
  choice: 难道
  rationale: ἤ承接上文，引出进一步的反问；汉语用“难道”自然体现 οὐκ 所要求的肯定预期，并保持保罗论证的推进。
- source_word: οὐκ ἔχει ἐξουσίαν
  choice: 没有权利
  rationale: ἐξουσία在这里指正当的支配权或处置权，不只是实际能力；“权利”在现代汉语中自然地表达窑匠有权决定怎样使用泥土。
- source_word: ὁ κεραμεὺς τοῦ πηλοῦ
  choice: 窑匠……支配泥土
  rationale: “窑匠”准确指制作陶器的工匠，也保留先知书中窑匠与泥土的意象；属格 τοῦ πηλοῦ 依汉语习惯处理为权利所及的对象。
- source_word: ἐκ τοῦ αὐτοῦ φυράματος
  choice: 从同一团泥中
  rationale: φύραμα指混合而成的一团或一块材料；在制陶语境中译作“一团泥”明确、自然，并保留两种器皿同出一源的重点。
- source_word: ποιῆσαι
  choice: 造
  rationale: “造”简洁表达制作、塑成之意，比“做”更适合窑匠制作器皿的语境，又不过度增添解释。
- source_word: ὃ μὲν ... ὃ δὲ
  choice: 一个……另一个……
  rationale: 自然呈现 μέν…δέ 的对应和对比关系，不把虚词机械直译出来。
- source_word: εἰς τιμὴν ... εἰς ἀτιμίαν
  choice: 为尊贵……为卑贱
  rationale: 直接保留 τιμή 与 ἀτιμία 的尊贵—卑贱对照，不擅自限定为具体的家用功能或用途。
- source_word: σκεῦος
  choice: 器皿
  rationale: “器皿”贴合窑匠和泥土的比喻，也保留原文可指器具或容器的宽度。
theological_decisions:
- issue: ἐξουσία在神的主权与人的责任这一争议语境中应译为正当权利、权柄，还是单纯能力
  choice: 权利
  alternative: 权柄；权力；能力
  rationale: “权利”凸显窑匠正当的处置权，而不把本节扩展成关于决定论或自由意志的完整教义陈述，因而保留保罗论证中的神学张力。
- issue: εἰς τιμὴν / εἰς ἀτιμίαν是否应明确解释为不同用途
  choice: 为尊贵……为卑贱
  alternative: 作贵重之用……作普通之用；作尊贵的器皿……作卑贱的器皿
  rationale: 原文直接使用尊荣与羞辱的范畴，并未明说家庭中的贵重或普通用途；保留较开放的表达可避免缩窄比喻，也不预先判定其具体神学所指。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“难道……吗”保留反问语气；“窑匠、泥土、器皿”维持贯穿全句的制陶意象。“为尊贵……为卑贱”略带凝练的经文语体，以保存原文刻意简约且未明确用途的 honor-shame 对照。
