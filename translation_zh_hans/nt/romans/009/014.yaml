  yaml_path: translation/nt/romans/009/014.yaml
  text: What then shall we say? Is there injustice with God? Certainly not![a][b]
translation:
  language: zh_hans
  text: 那么，我们该怎么说呢？难道神会不公吗？绝对不是！[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不公”也可译作“不义”。
    reason: lexical_alternative
  - marker: b
    text: 希腊原文可直译为“愿这事绝不发生！”这是强烈的否定，也常译作“断乎不是！”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: 那么，我们该怎么说呢？
  rationale: 这是保罗常用的承接和设问句式；“该怎么说呢”自然表达商议意味，也保留由上文引出的反问语气。
- source_word: μὴ
  choice: 难道……吗？
  rationale: μή引导预期否定答案的问句；“难道”在现代汉语中能清楚表达这种反问倾向。
- source_word: ἀδικία
  choice: 不公
  rationale: 此处所问的是神的作为是否存在不公平或不正义。“不公”简洁自然，并保留道德与司法层面的含义；“不义”列入脚注作为较传统的对应。
- source_word: παρὰ τῷ θεῷ
  choice: 神有
  rationale: 该介词短语在此表示“在神那里”或“神这一方面”。译成“神有不公吗”符合现代汉语习惯，又不额外解释神如何行事。
- source_word: μὴ γένοιτο
  choice: 绝对不是！
  rationale: 这是强烈否定的惯用表达。“绝对不是”在现代汉语中有足够力度，也比逐字译作“但愿绝不会如此”更自然。
theological_decisions:
- issue: 是否在译文中解释神的不公与拣选、公平或弃绝之间的关系
  choice: 只保留对“神有不公”的设问及其强烈否定，不添加神学解释。
  alternative: 可解释性地译为“难道神是不公正的吗？”或补出与拣选有关的说明。
  rationale: 希腊原文只简洁提出异议并断然驳回；不作扩写可保留本节的神学张力，避免把特定体系带入经文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“那么”承接上文，“难道”标明预期否定答案的反问；结尾以“绝对不是”传达原文强烈的驳斥语气。
