  text: τῷ ⸂Μωϋσεῖ γὰρ⸃ λέγει· Ἐλεήσω ὃν ἂν ἐλεῶ, καὶ οἰκτιρήσω ὃν ἂν οἰκτίρω.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/015.yaml
  text: For he says to Moses[a], “I will have mercy on whomever I have mercy[b], and I will have compassion on whomever I have compassion.”
translation:
  language: zh_hans
  text: 因为他对摩西说：“我要怜悯谁，就怜悯谁；我要怜恤谁，就怜恤谁。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 引自《出埃及记》33:19。
    reason: cross_reference
lexical_decisions:
- source_word: τῷ Μωϋσεῖ
  choice: 对摩西
  rationale: 与λέγει连用的与格表示说话的对象；按现代汉语自然译为“对摩西”。
- source_word: γὰρ
  choice: 因为
  rationale: 承接并说明上一节的论断；“因为”清楚保留保罗的论证关系。
- source_word: λέγει
  choice: 他说
  rationale: 保留希腊文现在时的经文引用用法；根据《出埃及记》33:19的语境，隐含的说话者是上帝。
- source_word: Ἐλεήσω / ἐλεῶ
  choice: 我要怜悯／就怜悯
  rationale: “怜悯”准确传达ἐλεέω，并在前后两处重复同一词根，保留原文简洁而有力的平行结构。
- source_word: ὃν ἂν
  choice: 谁
  rationale: 关系代词加ἄν表示不确定对象；汉语以“谁……就……”自然表达，同时不加入原文没有的“选择”等解释。
- source_word: οἰκτιρήσω / οἰκτίρω
  choice: 我要同情／就同情
  rationale: “同情”与“怜悯”有所区别，并保留第二分句的词汇和平行重复；相较“可怜”，也避免贬抑色彩。
theological_decisions:
- issue: 引文公式中说话者的身份
  choice: 译作“他说”，指上帝对摩西说话
  alternative: 译作“经上对摩西说”或省略主语
  rationale: 希腊文没有明示主语，但《出埃及记》33:19的引文语境明确是上帝亲自说话；采用人称表达而不额外扩展。
- issue: 上帝施怜悯与同情的自由
  choice: 保留“我要……谁，就……谁”的重复表述
  alternative: 解释为“我要怜悯我所选择的人”
  rationale: 原文没有“选择”一词。直译其紧凑的重复，保留有关怜悯与拣选的神学张力，不替读者解决争议。
- issue: ἐλεέω与οἰκτίρω的区分
  choice: 分别译作“怜悯”和“同情”
  alternative: 两者都译作“怜悯”或将οἰκτίρω译作“施恩”
  rationale: 原文使用两个相关但不同的动词；译文保留其区别，同时维持对称结构。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“谁……就……谁”保留原文的不定关系结构及强调性重复；不加入“愿意”“选择”等解释性词语。脚注标记置于整段引文之后。
