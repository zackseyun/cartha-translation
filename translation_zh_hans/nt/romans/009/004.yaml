  text: οἵτινές εἰσιν Ἰσραηλῖται, ὧν ἡ υἱοθεσία καὶ ἡ δόξα καὶ αἱ διαθῆκαι καὶ ἡ νομοθεσία καὶ ἡ λατρεία καὶ αἱ ἐπαγγελίαι,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/004.yaml
  text: who are Israelites[a], to whom belong the adoption, the glory, the covenants, the giving of the law, the worship, and the promises[d][c][b],
translation:
  language: zh_hans
  text: 他们是以色列人；儿子的名分、荣耀、诸约、律法的颁布、敬拜和诸般应许，都是他们的。[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “儿子的名分”也可译作“儿子身份”，这里指以色列作为神的子民所得的盟约性地位。
    reason: lexical_alternative
  - marker: b
    text: 这里的“荣耀”很可能指神在以色列中彰显的荣耀同在。
    reason: cross_reference
  - marker: c
    text: 这里的“敬拜”指以色列人在约中按神所设立的方式敬拜、事奉神。
    reason: cultural_note
lexical_decisions:
- source_word: οἵτινές εἰσιν Ἰσραηλῖται
  choice: 他们是以色列人
  rationale: 承接上一节所说保罗的同胞，以自然庄重的现代汉语保留解释性关系从句的识别作用。
- source_word: ὧν
  choice: 都是他们的
  rationale: 该属格关系代词表达归属；将列举项前置后以“都是他们的”收束，清楚传达所有关系，也符合汉语节奏。
- source_word: υἱοθεσία
  choice: 儿子的名分
  rationale: 保留“被置于儿子地位”的亲子身份意象；在本段指以色列作为群体所得的盟约性儿子地位，而不扩写为个人得救论。
- source_word: δόξα
  choice: 荣耀
  rationale: 忠实保留希腊文简洁而神学含义浓厚的表达，不在正文中把所指限定为某一种显现。
- source_word: διαθῆκαι
  choice: 诸约
  rationale: 保留希腊文复数，并以简洁的圣经语体指神与以色列所立的约。
- source_word: νομοθεσία
  choice: 律法的颁布
  rationale: 该词所指不只是律法本身，也包括律法被赐下、设立的行动；“颁布”准确且自然。
- source_word: λατρεία
  choice: 敬拜礼仪
  rationale: 兼顾该词“敬拜”与盟约制度中礼仪性事奉的含义，又避免过度限定为圣殿或祭司的服事。
- source_word: ἐπαγγελίαι
  choice: 诸般应许
  rationale: 保留复数，指神赐给以色列的多项应许；“诸般”在庄重现代汉语中自然。
theological_decisions:
- issue: υἱοθεσία用于以色列时的含义
  choice: 儿子的名分
  alternative: 收养／儿子身份
  rationale: 本节列举以色列民族在救赎历史中的特权。“儿子的名分”保留亲子关系的比喻和盟约群体维度，不把后文个人性的应用提前带入。
- issue: ἡ δόξα的所指
  choice: 正文保留“荣耀”
  alternative: 神的荣光／彰显同在的荣耀
  rationale: 这里很可能指神在以色列中彰显的荣耀同在，但希腊文只说“荣耀”；正文保留开放性，脚注说明可能所指。
- issue: λατρεία的范围
  choice: 敬拜礼仪
  alternative: 敬拜／圣殿礼仪／事奉
  rationale: 语境指神为以色列所设立的盟约性敬拜。“敬拜礼仪”表达礼仪性、制度性的事奉，却不把范围局限于圣殿或祭司。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。列举结构保留原文六项特权及其复数信息；以分号划分身份陈述与归属清单，并用“都是他们的”收束，避免生硬仿照希腊语语序。
