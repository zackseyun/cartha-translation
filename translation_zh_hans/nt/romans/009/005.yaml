  text: ὧν οἱ πατέρες, καὶ ἐξ ὧν ὁ χριστὸς τὸ κατὰ σάρκα, ὁ ὢν ἐπὶ πάντων, θεὸς εὐλογητὸς εἰς τοὺς αἰῶνας· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/005.yaml
  text: theirs are the fathers[a], and from them, according to the flesh, is the Messiah, who is over all, God blessed forever[b]. Amen.
translation:
  language: zh_hans
  text: 列祖是他们的；按肉身说[a]，弥赛亚也是从他们而出的。他是在万有之上、永远当受颂赞的上帝[b]。阿们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“就人的血统而言。”原文直译为“按肉身说”。
    reason: lexical_alternative
  - marker: b
    text: 末句也可另作一句对上帝的颂赞：“愿那在万有之上的上帝永远受颂赞。阿们。”而不是对弥赛亚的描述。
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ πατέρες
  choice: 列祖
  rationale: 指以色列备受尊崇的先祖。“列祖”既贴近原文，也保留保罗所强调的圣约历史背景；“族长”范围较窄，“祖先”则较为泛化。
- source_word: ἐξ ὧν
  choice: 从他们而出
  rationale: 关系代词回指保罗的以色列同胞；此译自然地表达弥赛亚在人间血统上出自以色列。
- source_word: ὁ χριστός
  choice: 弥赛亚
  rationale: 此处 Χριστός 是与以色列所得福分相连的称号，而非近似姓名的用法，因此译为“弥赛亚”。
- source_word: τὸ κατὰ σάρκα
  choice: 按肉身说
  rationale: 保留保罗“按肉身”的措辞，并以“说”使现代汉语顺畅；这里指人间血统，并非有罪的本性。解释性译法置于脚注。
- source_word: ὁ ὢν ἐπὶ πάντων
  choice: 他是在万有之上
  rationale: 带冠词的分词短语最自然地承接“弥赛亚”，说明他超乎万有之上；“万有”比“所有人”更能保留 πάντων 的广度。
- source_word: θεὸς εὐλογητὸς εἰς τοὺς αἰῶνας
  choice: 永远当受颂赞的上帝
  rationale: 以自然庄重的汉语表达颂赞用语，同时按主文标点将“上帝”作为对弥赛亚的进一步说明。“永远”准确传达 εἰς τοὺς αἰῶνας。
- source_word: ἀμήν
  choice: 阿们
  rationale: 采用现代中文圣经与礼仪中通行的音译。
theological_decisions:
- issue: 末句“ὁ ὢν ἐπὶ πάντων, θεὸς εὐλογητὸς εἰς τοὺς αἰῶνας”是继续描述弥赛亚，还是另起一句对上帝的颂赞
  choice: 主文将该句继续用于描述弥赛亚：“他是在万有之上、永远当受颂赞的上帝。”
  alternative: 将末句视为独立的颂赞：“愿那在万有之上的上帝永远受颂赞。”
  rationale: 从希腊语句法和行文衔接看，带冠词的分词 ὁ ὢν 很自然地与前面的 ὁ χριστός 构成同位说明，因此主文采用基督论读法。不过，早期抄本不以现代标点明确划分句子，独立颂赞的理解也有悠久争议，故在脚注中完整保留这一可能，而不以标点掩盖原文的张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“列祖”“弥赛亚”“万有”“阿们”保留经文的圣约历史与礼仪语感；语序适度调整，使长句在中文中清晰。脚注标记均置于所解释的主文位置。
