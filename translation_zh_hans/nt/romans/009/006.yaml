  text: Οὐχ οἷον δὲ ὅτι ἐκπέπτωκεν ὁ λόγος τοῦ θεοῦ. οὐ γὰρ πάντες οἱ ἐξ Ἰσραήλ, οὗτοι Ἰσραήλ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/006.yaml
  text: But it is not as though the word of God has failed[b][a]. For not all those from Israel are Israel.
translation:
  language: zh_hans
  text: 然而，这并不是说上帝的话落了空。因为，出于以色列的，并不都是以色列[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 前一个“以色列”涉及出身或后裔关系；后一个“以色列”的含义较窄。保罗在这里区分出于以色列者与“以色列”在较完整的圣约意义上的所指，但本句没有进一步界定后者的确切范围。
    reason: cross_reference
lexical_decisions:
- source_word: Οὐχ οἷον δὲ ὅτι
  choice: 然而，这并不是说
  rationale: 这是一个否定性的纠正表达，回应上文可能引出的结论；此译法符合现代汉语习惯，并保留转折和否定推论的作用。
- source_word: ἐκπέπτωκεν
  choice: 落了空
  rationale: 该完成时在此表示上帝的话并未落空、失效。汉语“落了空”既保留“落下”的词语意象，又自然表达未能实现的含义。
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: 上帝的话
  rationale: 按原文保留“话”的宽泛含义，不缩窄为“应许”，尽管上下文包含上帝应许的层面。
- source_word: οὐ γὰρ πάντες
  choice: 因为……不都是
  rationale: “因为”清楚表达 γάρ 对前句所作的解释；“不都是”准确呈现部分否定。
- source_word: οἱ ἐξ Ἰσραήλ
  choice: 从以色列而出的
  rationale: ἐξ 表示来源或出身。此译法保留原文的简洁和一定歧义，既可指源自以色列，也自然暗示血统出身。
- source_word: οὗτοι Ἰσραήλ
  choice: 都是以色列
  rationale: 原文是省略系词的等同结构；与前半句合译为“不都是以色列”，保留两个“以色列”之间刻意形成的张力。
theological_decisions:
- issue: 第二个“以色列”的含义
  choice: 正文保留同一名称“以色列”，不具体界定其范围；脚注说明其含义比第一个更窄。
  alternative: 明确译为“真正的以色列”“蒙拣选的以色列人”或广义的“上帝的子民”。
  rationale: 上下文确实区分血统来源与较完整的圣约性身份，但本节没有直接界定第二个“以色列”的精确范围。避免在正文中加入“真正的”“属灵的”或“蒙拣选的”，可保存保罗有意留下的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“然而”承接上文，“落了空”自然表达上帝的话未失效；重复“以色列”以保留原文的修辞冲击和神学张力。
