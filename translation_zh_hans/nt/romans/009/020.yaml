  text: ⸂ὦ ἄνθρωπε, μενοῦνγε⸃ σὺ τίς εἶ ὁ ἀνταποκρινόμενος τῷ θεῷ; μὴ ἐρεῖ τὸ πλάσμα τῷ πλάσαντι Τί με ἐποίησας οὕτως;
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/020.yaml
  text: But who are you[a], O man, to answer back to God? Will what is formed say to the one who formed it[d][c][b], “Why did you make me like this?”
translation:
  language: zh_hans
  text: 不然，人哪，你是谁，竟与上帝争辩呢？被塑造之物难道会对那塑造它的那位说：“你为什么把我造成这样？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“你为什么把我造得如此？”
    reason: lexical_alternative
lexical_decisions:
- source_word: μενοῦνγε
  choice: 但
  rationale: 此复合语气词承接并纠正前面的质疑，带有加强的转折意味；“但”在现代汉语中自然地保留这一反驳语气。
- source_word: ὦ ἄνθρωπε
  choice: 你这个人哪
  rationale: 这是单数呼格，以一个人为全人类的代表。“你这个人哪”既保留直接称呼，也传达责问的力度，而不限定为男性。
- source_word: σὺ τίς εἶ
  choice: 你是谁
  rationale: 这是带挑战意味的反问，并非询问身份；直译“你是谁”在汉语中同样具有鲜明的责问语气。
- source_word: ὁ ἀνταποκρινόμενος τῷ θεῷ
  choice: 竟敢反驳上帝
  rationale: ἀνταποκρίνομαι在这里不是中性地“回答”，而是顶嘴、抗辩。“竟敢反驳”自然表达其不当对抗的意味，并与“你是谁”组成流畅反问。
- source_word: μὴ ἐρεῖ
  choice: 难道会……说
  rationale: μή引出的疑问预期否定回答；汉语“难道会”明确而自然地保留这种反问预期。
- source_word: τὸ πλάσμα
  choice: 受造之物
  rationale: πλάσμα指被塑造、制成的东西。“受造之物”保留其与塑造者之间的被造—造作者对比，也适合本段庄重语域。
- source_word: τῷ πλάσαντι
  choice: 造它的
  rationale: 分词指塑造该物者；“造它的”在现代汉语中简洁自然，并与“受造之物”形成清楚对应。
- source_word: Τί με ἐποίησας οὕτως;
  choice: 你为什么把我造成这样？
  rationale: 贴近原文“为什么把我造得如此”，同时采用自然现代汉语；“这样”保留οὕτως所指状态的开放性。
theological_decisions:
- issue: ἄνθρωπε的代表性范围
  choice: 译为“你这个人哪”
  alternative: “人哪”或“你这个男人”
  rationale: 这里是向一个代表人类的人发出修辞性责问，不强调男性性别；所选译法保留单数直呼和普遍的人类指向。
- issue: 保罗责问的力度及神人不对称
  choice: 用“你是谁，竟敢反驳上帝呢”保留尖锐责问
  alternative: 较中性的“你是谁，竟回答上帝呢”
  rationale: 原文ἀνταποκρινόμενος含抗辩、顶撞意味；不应把受造者质问造物主的张力弱化为普通回应。
- issue: 陶匠意象的词汇关联
  choice: 译作“受造之物……造它的”
  alternative: “被塑造之物……塑造它的”
  rationale: 上下文含塑造意象，但本节自身并未明说“陶器”或“陶匠”；因此保留一般性的造作者关系，不提前加入下一节的具体意象。
translation_notes:
  register: 采用现代、庄重而口语可懂的责问语气。“你这个人哪”传达呼格力度；“竟敢”使反驳含义显明，但不增添特定宗派解释。唯一脚注说明末句较直译的表达。
