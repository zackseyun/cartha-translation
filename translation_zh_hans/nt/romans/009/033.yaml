  text: καθὼς γέγραπται· Ἰδοὺ τίθημι ἐν Σιὼν λίθον προσκόμματος καὶ πέτραν σκανδάλου, ⸀καὶ ὁ πιστεύων ἐπ’ αὐτῷ οὐ καταισχυνθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/033.yaml
  text: As it is written[a], “Look, I am laying in Zion a stone of stumbling and a rock of offense[d][c][b], and the one who believes in him will not be put to shame.”
translation:
  language: zh_hans
  text: 正如经上所记[a]：“看哪，我在锡安安放一块绊脚石，一块使人跌倒的磐石；信靠他[b]的人，必不蒙羞[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 保罗在这里把《以赛亚书》8:14和28:16的用语合并引用。
    reason: cross_reference
  - marker: b
    text: 原文介词直译为“在／在……上”；与“信”搭配时，意思是信靠、倚赖他。也可按石头的意象译作“信靠它”，但保罗的上下文把这意象用于弥赛亚。
    reason: lexical_alternative
  - marker: c
    text: 或译“必不失望”。原文着重于最终不至于受辱、蒙羞。
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: 正如经上所记
  rationale: 采用现代中文中自然、庄重的引经格式，表达完成时被动语态所强调的经文既已写定、现仍有效。
- source_word: Ἰδοὺ
  choice: 看哪
  rationale: 保留原文唤起注意的指示语气；比“看”更具经文引语的庄重感，又不至于晦涩。
- source_word: τίθημι
  choice: 安放
  rationale: 保留“放置、设立”的基本意思，并适合石头及建筑意象；中文不强行添加原文没有的将来时。
- source_word: ἐν Σιὼν
  choice: 在锡安
  rationale: 按介词的通常处所义翻译，并沿用该地名的通行译法。
- source_word: λίθον προσκόμματος
  choice: 一块绊脚石
  rationale: 简明表达使人绊倒的石头这一意象；“块”符合中文量词习惯。
- source_word: πέτραν σκανδάλου
  choice: 一方使人跌倒的磐石
  rationale: σκανδάλου在此指造成跌倒的障碍，而不只是主观上的“冒犯”；“磐石”与前面的“石头”保持词汇区别。
- source_word: ὁ πιστεύων
  choice: 信靠……的人
  rationale: 自然表达带冠词的实体化分词及其泛指单数意义；“信靠”也能与ἐπί所含的倚赖意味相配。
- source_word: ἐπ’ αὐτῷ
  choice: 他
  rationale: 原文代词为阳性单数；保罗在上下文中把石头意象用于弥赛亚，因此用人格化的“他”，同时以脚注说明较贴近介词字面的表达。
- source_word: οὐ καταισχυνθήσεται
  choice: 必不蒙羞
  rationale: 保留将来被动和荣辱语义；“蒙羞”比单纯的“不失望”更贴近动词本义，也符合庄重的现代中文。
theological_decisions:
- issue: ἐπ’ αὐτῷ所指的是人格化的弥赛亚，还是作为物件的石头
  choice: 译为“信靠他”，按人格指称处理
  alternative: 译为“信靠它”或“倚靠这石头”
  rationale: 虽然直接意象是石头，但希腊文使用阳性代词，且罗马书9:32—33及10:11的语境把这段预言应用于弥赛亚。“他”保留保罗的基督论应用；脚注同时交代介词可较直译为“在他上面／倚靠他”。
- issue: σκανδάλου表达主观冒犯还是客观致人跌倒
  choice: 译为“使人跌倒”
  alternative: 译为“冒犯人的”或“令人反感的”
  rationale: 在以石头和磐石构成的平行意象中，此词主要表示导致人失足、跌倒的障碍；不把经文缩减为现代心理意义上的“觉得被冒犯”。
translation_notes:
  register: 采用现代标准普通话的简体中文，语气庄重而易懂。保留“看哪”“锡安”“磐石”等具有经文传统色彩但仍通行的词语；量词分别用“块”和“方”，使平行句自然且避免机械重复。
