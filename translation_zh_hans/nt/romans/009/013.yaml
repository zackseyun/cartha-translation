  text: 'as it is written: “Jacob I loved[b][a], but Esau I hated.”'
translation:
  language: zh_hans
  text: 正如经上所记：“我爱雅各，却恨以扫。”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 引自《玛拉基书》1:2–3。
    reason: cross_reference
  - marker: b
    text: “恨”也有人理解为“弃绝”或“较少爱”。这里可能是指盟约上的弃绝或相对的偏爱，不一定表示情感上的敌意。
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: 正如
  rationale: 自然引出经文引语，并保留比较、印证的语气。
- source_word: γέγραπται
  choice: 经上所记
  rationale: 希腊语完成时被动式是新约常用的引经公式；此译法符合现代中文圣经语体，也表达经文已写下并持续有效。
- source_word: Ἰακώβ
  choice: 雅各
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: ἠγάπησα
  choice: 我爱
  rationale: 直接保留 ἀγαπάω 的基本含义；中文引语中用“爱”自然简洁，不必机械标出过去时。
- source_word: δὲ
  choice: 却
  rationale: 清楚表达雅各与以扫之间的对比，且较符合中文句式。
- source_word: Ἠσαῦ
  choice: 以扫
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: ἐμίσησα
  choice: 我恨
  rationale: 保留 μισέω 的直接、强烈词义，不在正文中以解释性译法弱化原文的张力。
theological_decisions:
- issue: 是否因神的拣选、盟约性弃绝或闪语比较表达等解释而弱化“我恨”
  choice: 正文保留“我恨”
  alternative: “我弃绝”或“我较少爱”
  rationale: 希腊文引用《玛拉基书》时使用普通而强烈的 μισέω。正文应保存原文的神学张力，不应把某一种解释直接写入译文；可能的盟约性或比较性含义放入脚注说明。
translation_notes:
  register: 采用自然、庄重、易懂的现代标准普通话。“正如经上所记”保留正式的引经语气；“我爱……却恨……”维持原文鲜明的平行与对比。脚注标记依正文出现次序编排。
