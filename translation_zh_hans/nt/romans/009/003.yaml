id: ROM.9.3
reference: Romans 9:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ηὐχόμην γὰρ ⸂ἀνάθεμα εἶναι αὐτὸς ἐγὼ⸃ ἀπὸ τοῦ Χριστοῦ ὑπὲρ τῶν ἀδελφῶν μου τῶν συγγενῶν μου κατὰ σάρκα,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/003.yaml
  text: For I could wish that I myself were accursed and cut off from the Messiah for the sake of my brothers[a], my kinsmen according to the flesh[c][b],
translation:
  language: zh_hans
  text: 因为我自己甚至宁愿受咒诅、与弥赛亚隔绝，为了我的弟兄，就是按血缘说与我同族的人。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “受咒诅、与弥赛亚隔绝”也可理解为“受咒诅，从弥赛亚那里被分离”。原文把受咒诅与离开弥赛亚的意思紧密联系在一起。
    reason: lexical_alternative
  - marker: b
    text: “弟兄”在这里指保罗的以色列同胞，即与他有共同族裔血统的人，包括男女。
    reason: cultural_note
lexical_decisions:
- source_word: ηὐχόμην
  choice: 我甚至情愿
  rationale: 未完成时在这里表达一种强烈而难以实现的设想性愿望，不宜直译为过去发生的“我曾祈求”。“情愿”自然传达保罗宁可自己承受损失的心愿；“甚至”体现语气强度。
- source_word: γὰρ
  choice: 因为
  rationale: 承接上文，表明本句是在解释保罗为何大有忧愁、心里不住伤痛。
- source_word: ἀνάθεμα
  choice: 受咒诅
  rationale: 该词指处于咒诅之下、被交付毁灭；“受咒诅”在现代汉语中清楚而庄重，并保留其强烈的神学分量。
- source_word: αὐτὸς ἐγώ
  choice: 自己
  rationale: 重叠代词具有强调作用；汉语用“自己”，并配合“我甚至”，自然保留这种自指强调。
- source_word: ἀπὸ τοῦ Χριστοῦ
  choice: 与弥赛亚隔绝
  rationale: ἀπό表示分离；在此与ἀνάθεμα紧密相连。“与……隔绝”清楚表达从弥赛亚那里被分离的意思。Χριστός在此按其称号含义译为“弥赛亚”。
- source_word: ὑπὲρ
  choice: 为了
  rationale: 表达为他人益处而承受代价的受益或代替性取向；“为了”符合现代汉语表达。
- source_word: τῶν ἀδελφῶν μου
  choice: 我的弟兄
  rationale: 保留原文的亲属称谓；下文进一步说明这些“弟兄”是保罗在族裔意义上的同胞，并非仅指男性手足。
- source_word: τῶν συγγενῶν μου κατὰ σάρκα
  choice: 就是我血缘上的同胞
  rationale: 两个定语同指一群人。“血缘上的”准确表达κατὰ σάρκα在本处的肉身、族裔血统含义；“同胞”比“亲戚”更能涵盖保罗所指的以色列族人。
theological_decisions:
- issue: 保罗是在陈述实际祷告，还是表达设想性的强烈愿望
  choice: 译作“我甚至情愿”，表达设想性或潜在愿望
  alternative: “我曾祈求”或“我一直希望”
  rationale: ηὐχόμην在这里结合上下文，并不要求理解为保罗实际祈求与弥赛亚隔绝；“情愿”既避免把它说成已经提出的祷告，也保留其牺牲性的情感强度。
- issue: ἀνάθεμα与ἀπὸ τοῦ Χριστοῦ之间的关系
  choice: 译作“受咒诅，与弥赛亚隔绝”
  alternative: 把两者理解为彼此独立的两项结果，或仅译“被弥赛亚咒诅”
  rationale: 原文可理解为受咒诅而与弥赛亚分离，二者语义紧密，但句法关系不宜被过度限定。用逗号并列保留这种紧密联系及一定的解释空间。
- issue: Χριστός是称号还是近似专名
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处称号义自然成立；“弥赛亚”使受膏者身份清楚可见，又不引入额外教派解释。
- issue: κατὰ σάρκα中σάρξ的含义
  choice: 血缘上的
  alternative: 按肉体或属罪性的人性
  rationale: 这里是在界定保罗与以色列人的族裔亲属关系，不是在谈论“罪性”。“血缘上的”明确呈现肉身血统之义。
translation_notes:
  register: 采用现代、庄重且口语可懂的书面汉语。“因为”保留论证连接；“我甚至情愿”避免生硬的反事实句式。“血缘上的同胞”把原文“按肉体”的语境义直接呈现出来，并避免现代读者误解为“罪性”。所有脚注标记均置于正文相关句末。
