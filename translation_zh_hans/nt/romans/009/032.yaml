id: ROM.9.32
reference: Romans 9:32
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: διὰ τί; ὅτι οὐκ ἐκ πίστεως ἀλλ’ ὡς ἐξ ⸀ἔργων· ⸀προσέκοψαν τῷ λίθῳ τοῦ προσκόμματος,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/032.yaml
  text: Why? Because it was not from faith[a], but as if from works. They stumbled over the stone of stumbling[d][c][b],
translation:
  language: zh_hans
  text: 为什么呢？因为不是出于信心[a]，而是仿佛出于行为[b]。他们在那块绊脚石[c][d]上绊跌了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“不是凭着信心”或“不是以信心为根据”。希腊原文直译为“不是出于信心”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“而是好像以行为为根据”。“仿佛”保留了原文 ὡς（“好像、如同”）的语气。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“使人绊跌的石头”或“使人跌倒的石头”。
    reason: lexical_alternative
  - marker: d
    text: 这里暗引《以赛亚书》8:14；另参下一节所引用的《以赛亚书》28:16。
    reason: cross_reference
lexical_decisions:
- source_word: διὰ τί
  choice: 为什么呢？
  rationale: 以现代汉语常用的反问承接上文，并保留保罗简短有力的修辞效果。
- source_word: οὐκ ἐκ πίστεως
  choice: 不是出于信心
  rationale: “出于”对应 ἐκ，保留来源或依据的含义；“信心”是现代汉语中对 πίστις 自然且通行的表达。
- source_word: ἀλλ’ ὡς ἐξ ἔργων
  choice: 而是仿佛出于行为
  rationale: 保留 ὡς 的“仿佛、好像”语气，不把原文简化为断然的“靠行为”；“行为”延续保罗书信中 ἔργα 的术语一致性。
- source_word: προσέκοψαν
  choice: 绊跌了
  rationale: 保留 προσκόπτω 所表达的具体绊倒意象，并与后面的“绊脚石”形成词义呼应。
- source_word: τῷ λίθῳ τοῦ προσκόμματος
  choice: 那块绊脚石
  rationale: 用自然而凝练的现代汉语呈现“使人绊跌的石头”，同时保留以赛亚书典故中的石头意象。
theological_decisions:
- issue: 信心与行为对比中 πίστις 的含义
  choice: 信心
  alternative: 信靠；忠信
  rationale: 本节将信心与行为作为不同的根据相对照；“信心”既符合本段语境，也不额外限定为人的忠信或其他特定神学解释。
- issue: ὡς 对“出于行为”的限定
  choice: 仿佛出于行为
  alternative: 出于行为；好像靠行为
  rationale: 保留 ὡς 所造成的语义张力，不把保罗较审慎的措辞改写成毫无限定的断言。
- issue: 绊脚石意象的解释
  choice: 保留具体的“绊脚石”意象
  alternative: 使人冒犯的石头
  rationale: 原文首先呈现绊跌的具体隐喻；正文不直接把它解释为抽象的“冒犯”，以免消解以赛亚书典故的画面。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“不是出于……而是仿佛出于……”刻意保留原文的省略结构及 ὡς 的限定语气；“绊跌／绊脚石”保留同根词形成的修辞呼应。
