  text: οὐδ’ ὅτι εἰσὶν σπέρμα Ἀβραάμ, πάντες τέκνα, ἀλλ’· Ἐν Ἰσαὰκ κληθήσεταί σοι σπέρμα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/007.yaml
  text: Nor is it the case that because they are Abraham’s offspring[a], they are all children. Rather[c][b], “In Isaac your offspring will be called.”
translation:
  language: zh_hans
  text: 也不是说，因为是亚伯拉罕的后裔[a]，就全都是儿女；相反，“从以撒而来的，才会被称为你的后裔。”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “后裔”原文直译为“种子”，形式上是单数，在这里具有集合意义，指后代。
    reason: lexical_alternative
  - marker: b
    text: 或较形式化地译作：“在以撒里，才要称为你的后裔。”这里“称为”在上下文中也可理解为“算作”或“认定为”。参《创世记》21:12。
    reason: cross_reference
lexical_decisions:
- source_word: οὐδ’ ὅτι
  choice: 也不是说……就
  rationale: 承接上文的否定，并以现代汉语的“不是说……就……”清楚表达ὅτι从句与主句之间的逻辑关系。
- source_word: σπέρμα Ἀβραάμ
  choice: 亚伯拉罕的后裔
  rationale: σπέρμα在此为集合意义，指亚伯拉罕的后代；“后裔”庄重自然，也适合血缘与应许谱系的语境。
- source_word: πάντες τέκνα
  choice: 全都是儿女
  rationale: τέκνα为性别包容的“儿女”，不译作“儿子”；保留原文未在本节明说“神的儿女”的克制。
- source_word: ἀλλ’
  choice: 相反
  rationale: 体现强烈的转折和纠正作用。
- source_word: Ἐν Ἰσαὰκ
  choice: 从以撒而出的
  rationale: 这里的ἐν用于谱系语境；结合汉语表达和《创世记》21:12的引文背景，译为“从以撒而出的”可自然传达后裔经由以撒这一支系而出，同时不把句意扩展为完整解释。
- source_word: κληθήσεταί σοι σπέρμα
  choice: 才要称为你的后裔
  rationale: 保留καλέω“称为”的被动语义；“才”由前文的排除性对比体现，并使引文在汉语中完整自然。
theological_decisions:
- issue: 肉身血统与儿女身份的关系
  choice: 区分身为亚伯拉罕的血缘后裔与被称为其儿女，但不在本节补出身份的完整神学机制
  alternative: 直接译成“并不都是神的儿女”或加入“蒙拣选”等解释
  rationale: 本节原文只说“儿女”，后续语境才进一步阐明；正文应保存保罗论证逐步展开的张力。
- issue: 《创世记》引文中“称为”的含义
  choice: 保留“称为”
  alternative: 译为“算作”“认定为”或“你的后裔要从以撒延续”
  rationale: κληθήσεται本义容许“称为”，而“算作”等译法已替读者解释其神学含义；保留引文措辞可维护真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不是说……就……”符合汉语论证习惯；引文以“从以撒而出的”表达谱系关系。正文避免加入“神的”“应许的”或“蒙拣选”等原文在本节未明说的限定。
