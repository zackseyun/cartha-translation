  text: λόγον γὰρ συντελῶν καὶ ⸀συντέμνων ποιήσει κύριος ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/028.yaml
  text: For the Lord will carry out his word on the earth[c][b][a], finishing it and cutting it short.
translation:
  language: zh_hans
  text: 因为主必在地上[c]施行他所说的话[a]，把这话成全，并把它截短[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他所说的话”也可译为“这事”或“判决”。
    reason: lexical_alternative
  - marker: b
    text: “截短”也可理解为“缩短”；按其含意，也可译为“迅速把它施行完毕”。
    reason: lexical_alternative
  - marker: c
    text: 有些译本将ἐπὶ τῆς γῆς译为“在那地”，以反映《以赛亚书》原来语境中的措辞；但《罗马书》这里的希腊文读作“在地上”。
    reason: cross_reference
lexical_decisions:
- source_word: λόγον
  choice: 他所说的话
  rationale: 这里作ποιήσει的宾语，指主所宣告并将付诸实行的事；译为“他所说的话”既保留言说含义，也符合现代汉语表达。
- source_word: γὰρ
  choice: 因为
  rationale: 承接上文，说明前一句的根据，体现保罗论述中的解释关系。
- source_word: συντελῶν
  choice: 把它成就
  rationale: 表达将所说之事带到完成、实现的意思，同时保留分词与主句动作相伴的关系。
- source_word: καὶ συντέμνων
  choice: 并使它缩短
  rationale: 保留συντέμνω“缩短、截短”的形象和原文可能存在的歧义，不直接解释成“迅速施行”。
- source_word: ποιήσει
  choice: 施行
  rationale: 与“所说的话”搭配，表示主将自己所宣告的付诸实行；比直译“做”自然，也不过度限定为司法执行。
- source_word: κύριος
  choice: 主
  rationale: 按新约引用经文的通常用法，指神，采用庄重而通行的译法。
- source_word: ἐπὶ τῆς γῆς
  choice: 在全地
  rationale: γῆ可指土地或大地；“全地”自然表达其广泛范围，同时脚注保留“地上／那地”的可能理解。
theological_decisions:
- issue: 以赛亚引文中神行动的性质
  choice: 主将自己所宣告的话决定性地付诸实行并完成，但正文不进一步限定其为某一特定教义体系中的审判或拯救方案。
  alternative: 主将在全地迅速执行司法判决。
  rationale: 上下文带有审判意味，但λόγος及两个分词仍保有较宽的语义；译文应保存这种张力，不增加原文未明说的教派性解释。
translation_notes:
  register: 采用现代、庄重且便于普通读者理解的书面汉语。“施行他所说的话”保持宣告与实现之间的联系；正文保留“使它缩短”的陌生而有力的形象，并用脚注说明可能含意。
