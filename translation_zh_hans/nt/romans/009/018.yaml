  text: ἄρα οὖν ὃν θέλει ἐλεεῖ, ὃν δὲ θέλει σκληρύνει.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/018.yaml
  text: So then[a], he shows mercy to whom he wills[b], and he hardens whom he wills.
translation:
  language: zh_hans
  text: 这样看来，神愿意怜悯谁，就怜悯谁[a]；愿意使谁刚硬，就使谁刚硬[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “怜悯”也可译作“施怜悯”。
    reason: lexical_alternative
  - marker: b
    text: “使……刚硬”也可译作“使……顽梗”；希腊文使用主动动词，不宜弱化为仅仅“容许……刚硬”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα οὖν
  choice: 这样看来
  rationale: 两个推论语气词共同引出基于上文的结论。“这样看来”符合现代汉语表达，并保留鲜明的推论作用。
- source_word: ὃν θέλει
  choice: 愿意怜悯谁，就怜悯谁
  rationale: 以“愿意……谁，就……”自然表达不定关系结构，并保留 θέλει 所表达的意愿以及两分句之间的平行。
- source_word: ἐλεεῖ
  choice: 怜悯
  rationale: 该动词表示向人施以怜悯或慈悲。“怜悯”简明、庄重，也与本段上下文的用语相称。
- source_word: ὃν δὲ θέλει
  choice: 愿意使谁……，就使谁……
  rationale: δέ 在这里引出对照；汉语用分号和对应句式即可清楚呈现对照，无须生硬加上“但是”。重复“愿意”保留原文刻意的对称结构。
- source_word: σκληρύνει
  choice: 使……刚硬
  rationale: 原文为主动动词，含使人变得刚硬、顽梗之意。“使……刚硬”既保留主动使役关系，也呼应法老叙事中的经文用语，没有弱化为单纯的容许。
theological_decisions:
- issue: θέλει 所表达的神的意愿
  choice: 直接译为“神愿意……”，不弱化其意愿，也不解释预定与人的责任之间的关系。
  alternative: 译为“神容许……”或加入说明，以突出人的自主选择。
  rationale: 希腊文在两个分句中都直接使用 θέλει。译文应保留这种陈述及其神学张力，而不代替经文解决相关争论。
- issue: σκληρύνει 中的行动主体与使役关系
  choice: 译为主动使役式“使……刚硬”。
  alternative: 译为“任凭……刚硬”或“容许……变得刚硬”。
  rationale: 希腊文采用主动语态，直接把该行动归于主语。译成单纯容许会加入原文没有明说的解释。
- issue: 希腊文省略的主语
  choice: 在中文首句补出“神”，第二句承前省略。
  alternative: 两句都不明说主语，或两句都重复“神”。
  rationale: 上文清楚表明主语是神；中文若完全省略会显得突兀，而首句补明、后句承前，既清楚自然，也不改变原意。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。以整齐的“愿意……谁，就……”句式再现原文平行结构，并用分号呈现两项行动之间的对照。
