id: ROM.9.8
reference: Romans 9:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: τοῦτ’ ἔστιν, οὐ τὰ τέκνα τῆς σαρκὸς ταῦτα τέκνα τοῦ θεοῦ, ἀλλὰ τὰ τέκνα τῆς ἐπαγγελίας λογίζεται εἰς σπέρμα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/008.yaml
  text: That is[a], it is not the children of the flesh who are the children of God[b], but the children of the promise are counted as offspring.
translation:
  language: zh_hans
  text: 这就是说，按肉身而生的儿女[a]并不是上帝的儿女；惟有应许的儿女才被算为后裔[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“按自然血统而生的儿女”。希腊文直译为“肉身的儿女”。
    reason: lexical_alternative
  - marker: b
    text: 或译“被算作后代”。“后裔”所译的希腊词也可直译为“种子”，在这里指子孙后代。
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτ’ ἔστιν
  choice: 这就是说
  rationale: 引出保罗对前一句话的解释，既自然又保留原文的说明作用。
- source_word: τὰ τέκνα τῆς σαρκὸς
  choice: 按肉身而生的儿女
  rationale: 保留 σάρξ“肉身”的措辞，同时用“按……而生”清楚表达这里所指的血统和自然生育关系，避免误读为伦理意义上的“属肉体”。
- source_word: τέκνα τοῦ θεοῦ
  choice: 上帝的儿女
  rationale: 准确表达所属关系；“儿女”涵盖男女，也与本节 τέκνα 的其他两处译法保持一致。
- source_word: τὰ τέκνα τῆς ἐπαγγελίας
  choice: 应许的儿女
  rationale: 保留原文凝练的属格结构，以及这些儿女由上帝的应许界定这一含义，不将其解释性地窄化。
- source_word: λογίζεται εἰς σπέρμα
  choice: 被算为后裔
  rationale: “被算为”保留 λογίζεται 的认定、归算意味；“后裔”符合亚伯拉罕谱系语境中 σπέρμα 的集合性含义，也比直译“种子”更符合现代汉语。
theological_decisions:
- issue: 肉身血统与应许所界定之群体的对比
  choice: 译文直接保留“按肉身而生的儿女”与“应许的儿女”的对比，不进一步说明其系统神学范围。
  alternative: 把本节明确译成仅属群体历史的论述，或明确译成个人预定论的陈述。
  rationale: 希腊文本提出血统与应许之间的对比，却未在本节中解决《罗马书》第9章涉及的全部神学争议；译文不应预先限定其解释。
- issue: λογίζεται 所隐含的认定者
  choice: 采用“被算为”，不在正文中补出“被上帝”。
  alternative: 译作“上帝才把他们算为后裔”。
  rationale: 语境可使读者理解认定者，但原文未明说施事者；保留被动表达可避免加入文本没有明示的成分。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“惟有……才……”鲜明呈现 οὐ…ἀλλά… 的对比；分号使较长的对照句层次清楚。脚注标记均置于其所解释的正文词语之后。
