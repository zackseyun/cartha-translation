  text: οὓς καὶ ἐκάλεσεν ἡμᾶς οὐ μόνον ἐξ Ἰουδαίων ἀλλὰ καὶ ἐξ ἐθνῶν;—
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/024.yaml
  text: even us[a], whom he also called[b], not only from the Jews but also from the Gentiles—
translation:
  language: zh_hans
  text: 就是我们这些他也呼召的人[a]——不但从犹太人中，也从外邦人中[b]——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文语序较直译为：“他也呼召的那些人，就是我们。”这里的“那些人”回指上一节所说蒙怜悯的器皿。
    reason: 说明关系代词与“我们”之间的同位关系，以及本节对上文的回指。
  - marker: b
    text: “外邦人”原文为“列国”或“各民族”；在这里与犹太人相对，指非犹太人。
    reason: 交代ἐθνῶν的字面含义及其在本语境中的具体所指。
lexical_decisions:
- source_word: οὓς ... ἡμᾶς
  choice: 就是我们这些……的人
  rationale: 关系代词οὓς回指上一节所说蒙怜悯的器皿，ἡμᾶς则以同位语明确指出这些人就是“我们”。此译法保留回指关系和强调，同时符合现代汉语表达。
- source_word: καὶ ἐκάλεσεν
  choice: 也呼召
  rationale: καί具有递进、附加意味；καλέω在保罗书信这一语境中用“呼召”，既自然，也保留其救恩历史层面的用语。
- source_word: οὐ μόνον ... ἀλλὰ καὶ
  choice: 不但……也……
  rationale: 准确呈现希腊文成对关联结构及两个群体之间的平衡。
- source_word: ἐξ Ἰουδαίων
  choice: 从犹太人中
  rationale: ἐξ表示来源或从某一群体中选出；“从……中”比单说“来自”更清楚地保留这一语义。
- source_word: ἐξ ἐθνῶν
  choice: 从外族人中
  rationale: ἐθνῶν字面为“列国、各民族”，但与“犹太人”对举时指非犹太人。“外族人”在现代汉语中清楚呈现这一对比，同时避免把原文误解为现代民族国家。
theological_decisions:
- issue: 本节与上一节“蒙怜悯的器皿”的指代联系
  choice: 就是我们这些他也呼召的人
  alternative: 他也呼召了我们
  rationale: 保留οὓς的关系结构，使本节继续依附上一节，而不把它改写成一个完全独立的新陈述；同时不进一步界定“预备”与“呼召”的神学关系。
- issue: ἐθνῶν在犹太人与非犹太人的救恩历史对比中如何表达
  choice: 外族人
  alternative: 列国的人；外邦人
  rationale: 上下文明确是在对举犹太人与非犹太人。“外族人”通俗而准确；脚注保留较直译的“列国”及传统译法“外邦人”，不借译词加入特定宗派解释。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“就是我们这些……的人”保留原文回指上一节的句法关系；破折号保留本节承接前后论述的未完语势。
