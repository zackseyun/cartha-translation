  text: ἄρα οὖν οὐ τοῦ θέλοντος οὐδὲ τοῦ τρέχοντος ἀλλὰ τοῦ ἐλεῶντος θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/016.yaml
  text: So then[a], it does not depend on the one who wills or the one who runs[b], but on God who shows mercy.
translation:
  language: zh_hans
  text: 所以[a]，这不在于人的意愿，也不在于人的奔跑[b]，而在于施怜悯的神。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文采用省略表达；较贴近形式可译为：“所以，这不在于愿意的人，也不在于奔跑的人，而在于施怜悯的神。”正文以“这不在于”补足汉语句法，但不明确“这”具体指救恩、拣选或其他事项。
    reason: 说明原文的省略结构及较贴近形式的译法。
  - marker: b
    text: “奔跑”是原文的字面意思；在这里很可能含有人努力或奋力追求的比喻意味。
    reason: 保留原文意象，同时说明其可能的比喻含义。
lexical_decisions:
- source_word: ἄρα οὖν
  choice: 这样看来
  rationale: 两个推论性连接词共同引出保罗根据上文所得的结论；“这样看来”在现代汉语中自然，也保留了较强的推论作用。
- source_word: τοῦ θέλοντος
  choice: 人愿意
  rationale: 带冠词的现在分词指“愿意的人”或“作出意愿的人”。译作“人愿意”保留意志层面的动作，同时避免“立志”可能带来的额外语气。
- source_word: τοῦ τρέχοντος
  choice: 人奔跑
  rationale: τρέχω的字面义是“奔跑”。正文保留具体比喻，不直接改译成“努力”或“奋斗”，以免消除原文形象。
- source_word: ἀλλὰ
  choice: 而
  rationale: 在“不在于……而在于……”结构中，“而”自然清楚地表达原文的强烈对比。
- source_word: τοῦ ἐλεῶντος θεοῦ
  choice: 施怜悯的神
  rationale: 保留分词所表达的主动行动，强调神是施行怜悯者，而不只把“怜悯”处理为静态属性。
- source_word: 省略的主语／谓语关系
  choice: 这并不在于……而在于……
  rationale: 希腊文采用省略表达，没有明说究竟是什么“不出于”这些主体。汉语用“这”和“不在于”补足句法，使句子通顺，却不把所指具体限定为救恩、拣选或其他单一概念。
theological_decisions:
- issue: 省略成分的所指及“不在于”的范围
  choice: 正文采用泛指的“这并不在于”，不明说“这”是救恩、拣选或神的选择。
  alternative: 明确译作“所以，救恩不在于人的意愿或努力”或“所以，神的拣选不在于人愿意或奔跑”。
  rationale: 原文在语法上是省略的；上下文涉及神的旨意与怜悯，但若在正文补入某一具体名词，就会把原文的范围收窄，并可能预先解决其神学张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“这样看来”承接论证；“不在于……而在于……”符合现代汉语习惯。正文保留“奔跑”的具体意象，并借脚注解释其比喻意味；不使用可能带有特定宗派诠释的增补词。
