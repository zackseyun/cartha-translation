  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐπαγγελίας γὰρ ὁ λόγος οὗτος· Κατὰ τὸν καιρὸν τοῦτον ἐλεύσομαι καὶ ἔσται τῇ Σάρρᾳ υἱός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/009.yaml
  text: 'For this is the word of promise: “At this time I will come[a], and Sarah will have a son.”'
translation:
  language: zh_hans
  text: 因为这就是应许的话：“到那时，我必来[a]，撒拉将有一个儿子。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我必再来”。这里的希腊文直译为“我必来”，但有些译本根据《创世记》的背景译作“我必再来”。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπαγγελίας
  choice: 所应许的
  rationale: 该属格修饰 λόγος，表达带有应许性质或内容的话；译为“所应许的话”自然清楚，也保留上下文对上帝应许的强调。
- source_word: λόγος
  choice: 话
  rationale: 这里指随后引述的具体话语；“话”比“信息”更贴近原文，也符合现代汉语表达。
- source_word: γὰρ
  choice: 因为
  rationale: 说明上一节所作判断的根据，用“因为”明确保留论证关系。
- source_word: Κατὰ τὸν καιρὸν τοῦτον
  choice: 到这时候
  rationale: 表示应许实现的指定时间，并呼应《创世记》的应许措辞；“到这时候”在汉语中自然，且适合未来语境。
- source_word: ἐλεύσομαι
  choice: 我必来
  rationale: 原文动词直接意为“来”；“必”体现将来陈述及应许的确定性，不把《创世记》背景中可能的“再来”含义直接写入正文。
- source_word: ἔσται τῇ Σάρρᾳ υἱός
  choice: 撒拉将生一个儿子
  rationale: 原文直译为“撒拉将有一个儿子”。结合生育应许的语境，“将生一个儿子”是自然汉语，并清楚传达其含义。
- source_word: Σάρρᾳ
  choice: 撒拉
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: υἱός
  choice: 儿子
  rationale: 该词明确指男性后代；“儿子”保留以撒应许语境中相关的性别信息。
theological_decisions:
- issue: 亚伯拉罕之约的应许及上帝的主动作为
  choice: 将引文直接呈现为上帝的应许，并把 ἐλεύσομαι 译为“我必来”。
  alternative: 译作“我必再来”，以更明显呼应某些《创世记》译法。
  rationale: 保罗的论证以神圣应许为以撒出生的根据。正文优先反映《罗马书》希腊文实际使用的“来”，不以旧约翻译传统替换它；替代译法在脚注中说明。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“所应许的话”保留原文结构和神学重点；引文措辞简洁有力。脚注标记已在正文“来”之后标出。
