  text: Ἐρεῖς ⸂μοι οὖν⸃· Τί ⸀οὖν ἔτι μέμφεται; τῷ γὰρ βουλήματι αὐτοῦ τίς ἀνθέστηκεν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/019.yaml
  text: You will say to me then[a], “Why then does he still find fault? For who has resisted his purpose?”
translation:
  language: zh_hans
  text: 那么，你会对我说：“那么，他为什么还责怪呢？因为谁曾抗拒过他的旨意[a]呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “旨意”或译“意愿”、“意图”或“目的”。希腊语βούλημα可有这些含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐρεῖς
  choice: 你会……说
  rationale: 将来时在这里是修辞性用法，引出保罗预期读者会提出的异议；“说”贴近原词，也自然涵盖随后提出的问题。
- source_word: μοι
  choice: 对我
  rationale: 明确译出间接受词，保留保罗与假想反对者之间的对话形式。
- source_word: οὖν ... οὖν
  choice: 这样……那么
  rationale: 两处都译出：第一处承接前文推论，第二处加强异议内部的追问，同时避免中文重复使用同一连接词而显得生硬。
- source_word: Τί οὖν ἔτι μέμφεται
  choice: 那么，他为什么还责怪人呢
  rationale: τί在此结合责怪类动词自然表示“为什么”；ἔτι译为“还”。原文未明说责怪的对象，中文补出泛指的“人”，使句意完整而不限定具体群体。
- source_word: τῷ ... βουλήματι αὐτοῦ
  choice: 他的旨意
  rationale: βούλημα可指意愿、意图或目的；“旨意”在现代中文圣经语境中自然庄重，能表达有意向的决定，同时以脚注保留其词义幅度。
- source_word: ἀνθέστηκεν
  choice: 抗拒过
  rationale: 准确表达“抵抗、反对”的意义；以“过”自然反映完成时所指向的既成经验及其当前关联。
theological_decisions:
- issue: 神的βούλημα与人的责任之间的张力
  choice: 旨意
  alternative: 意愿；意图；目的
  rationale: 正文不解释神为何仍责怪，也不把假想异议改写为答案，保留上下文中神主权与人责任之间刻意呈现的张力。“旨意”表达神有意向的决定，但脚注同时说明原词的其他可能含义，避免锁定某一宗派体系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“这样……那么”体现两个οὖν的论证推进；问句保留假想反对者的强烈语气。脚注标记置于整节末尾，对正文中的“旨意”作词义说明。
