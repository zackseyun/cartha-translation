id: ROM.9.17
reference: Romans 9:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: λέγει γὰρ ἡ γραφὴ τῷ Φαραὼ ὅτι Εἰς αὐτὸ τοῦτο ἐξήγειρά σε ὅπως ἐνδείξωμαι ἐν σοὶ τὴν δύναμίν μου, καὶ ὅπως διαγγελῇ τὸ ὄνομά μου ἐν πάσῃ τῇ γῇ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/017.yaml
  text: 'For the Scripture says to Pharaoh[a], “For this very purpose I raised you up: that I might display my power in you[b], and that my name might be proclaimed in all the earth.”'
translation:
  language: zh_hans
  text: 因为经上对法老说：“我兴起你[a]，正是为了这件事：要在你身上彰显我的大能，也要使我的名[b]在全地被传扬。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我保全你”或“我使你存立”。原文动词在这里可以有较宽的含义。
    reason: lexical_alternative
  - marker: b
    text: 这里“我的名”不只是一个称呼，也指上帝所启示的声名和威望。
    reason: cultural_note
lexical_decisions:
- source_word: λέγει γὰρ ἡ γραφὴ τῷ Φαραώ
  choice: 因为经上对法老说
  rationale: 保留γὰρ与上文的解释关系，也保留λέγει的现在时表达及“经上”作为说话主体的拟人化用法；“经上”是现代中文圣经语境中自然、庄重的说法。
- source_word: Εἰς αὐτὸ τοῦτο
  choice: 正是为了这件事
  rationale: 既表达目的，也保留αὐτὸ所带的强调语气。
- source_word: ἐξήγειρά σε
  choice: 我兴起你
  rationale: “兴起”保留该动词较宽的语义，可指使法老出现、站立或被保全而继续处于其位置，不把经文限定为受造、复活或单纯存活。
- source_word: ὅπως ἐνδείξωμαι ἐν σοὶ τὴν δύναμίν μου
  choice: 要在你身上彰显我的大能
  rationale: “彰显”传达公开显示、证明之意；“在你身上”贴近ἐν σοὶ，避免直接改写为较具解释性的“借着你”。“大能”自然表达δύναμις在此处的力量与威能。
- source_word: καὶ ὅπως διαγγελῇ τὸ ὄνομά μου
  choice: 也要使我的名传遍
  rationale: 以“使……传遍”表达目的从句和广泛宣扬的含义，同时保持施事者未明说的开放性。
- source_word: ἐν πάσῃ τῇ γῇ
  choice: 全地
  rationale: 在保留普世范围的同时采用简洁、庄重且常见的中文表达，不缩窄为某一地区或国土。
theological_decisions:
- issue: ἐξήγειρά σε如何表达上帝对法老的主权作为
  choice: 我兴起你
  alternative: 我保全你／我使你存立
  rationale: “兴起”能够表达上帝使法老处于这一历史位置，却不进一步断定这仅指创造他、任命他或让他存活，从而保留上帝主权与人的责任之间经文本身的张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“因为”明确承接上文论证；引语保持平衡句式。“兴起”“彰显”“全地”略具经文语体，但仍为当代读者容易理解。脚注标记分别紧随其实际说明的词语，避免英文咨询层中标记位置与脚注内容不一致的问题。
