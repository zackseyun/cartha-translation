  text: οὐ μόνον δέ, ἀλλὰ καὶ Ῥεβέκκα ἐξ ἑνὸς κοίτην ἔχουσα, Ἰσαὰκ τοῦ πατρὸς ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/010.yaml
  text: And not only that[a], but Rebekah also had conceived by one man, our father Isaac.
translation:
  language: zh_hans
  text: 不但如此，利百加也从一人受孕[a]，那人就是我们的祖先以撒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“从一位有床笫”；“床笫”在这里是指从一位男子受孕的委婉说法。
    reason: 说明希腊语习语及译文所作的语义明示。
lexical_decisions:
- source_word: οὐ μόνον δέ, ἀλλὰ καί
  choice: 不但如此，……也
  rationale: 自然传达希腊语关联结构，并保留保罗在前例之上继续推进论证的作用。
- source_word: Ῥεβέκκα
  choice: 利百加
  rationale: 采用现代中文圣经语境中通行的人名译法。
- source_word: ἐξ ἑνός
  choice: 从一个人
  rationale: 保留原文“一位／一个”的简洁表达，同时按上下文补出“人”，指明同一位男性亲本。
- source_word: κοίτην ἔχουσα
  choice: 怀了孕
  rationale: 该表达字面涉及同床或交合，在此语境中委婉指向受孕；“怀了孕”符合现代汉语，并避免生硬直译。
- source_word: Ἰσαὰκ τοῦ πατρὸς ἡμῶν
  choice: 就是我们的祖先以撒
  rationale: 把同位关系清楚呈现出来；此处“祖先”比现代汉语中的“我们的父亲”更能自然表达族长身份，而不改变其祖裔含义。
theological_decisions:
- issue: 如何表达受孕／性结合习语在拣选论证中的意义
  choice: 译作“从一个人，就是我们的祖先以撒，怀了孕”
  alternative: 较直译为“与一个人同床，就是我们的父亲以撒”或较简略为“从一位怀孕”
  rationale: 原文强调利百加腹中的后代同出一父，排除父母不同这一因素；译文明确所指而不加入“双胞胎”“孩子”等本节未明说的内容，也不提前解释下一节的神学结论。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“利百加”“以撒”沿用通行译名；“祖先”自然表达 πατήρ 在此处的先祖含义。脚注保留原文习语的信息，并避免正文显得粗涩。
