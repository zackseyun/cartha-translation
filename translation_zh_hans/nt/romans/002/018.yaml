  text: καὶ γινώσκεις τὸ θέλημα καὶ δοκιμάζεις τὰ διαφέροντα κατηχούμενος ἐκ τοῦ νόμου,
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/018.yaml
  text: and know his will and approve the things that differ[a], being instructed from the law[b],
translation:
  language: zh_hans
  text: 又明白他的旨意[a]，能辨别什么更为要紧[b]，从律法中受教；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文没有明说“他的”；根据上下文，这旨意指上帝的旨意。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“能认可优异的事”；较直译为“察验不同的事”。
    reason: alternative_reading
lexical_decisions:
- source_word: γινώσκεις
  choice: 明白
  rationale: 现在时直陈语气表示确实具有的认识；“明白”在此自然地表达对上帝旨意的认识，而不只是听说。
- source_word: τὸ θέλημα
  choice: 他的旨意
  rationale: 希腊文直译为“这旨意”或“旨意”，没有明说所属者；但上文提到上帝，语境清楚指上帝的旨意。正文补出自然汉语所需的“他的”，并用脚注保留原文形式。
- source_word: δοκιμάζεις
  choice: 能辨别
  rationale: 该动词在这里指经过考察而作出判断、认出可取之事；“能辨别”既符合上下文，也不过度强调最终的“赞同”。
- source_word: τὰ διαφέροντα
  choice: 什么更为要紧
  rationale: 这一表达既可较直译为“不同的事”，也可按习语理解为“更优越或更要紧的事”。正文采用符合道德判断语境的习语义，脚注保留较直译的可能。
- source_word: κατηχούμενος
  choice: 因为……受了教导
  rationale: 被动分词说明受话者何以明白并能辨别，具有自然的原因意味；译成原因分句使现代汉语顺畅，同时保留其受教含义。
- source_word: ἐκ τοῦ νόμου
  choice: 从律法中
  rationale: ἐκ表示来源；“从律法中”保留知识和教导以律法为来源的意思。
theological_decisions:
- issue: τὸ θέλημα的所属者
  choice: 正文译为“他的旨意”，以语境中的上帝为所指
  alternative: 直译为“旨意”或“这旨意”
  rationale: 原文没有所有格，但罗马书2:17紧接着提到“以上帝为荣”，因此上帝是自然的隐含所指；脚注明确原文未明说，以免把语境推论误当作字面形式。
- issue: τὰ διαφέροντα的意义范围
  choice: 正文译为“什么更为要紧”
  alternative: “不同的事”或“优异的事”
  rationale: 该短语可能指彼此有别之事，也可能指更有价值、更重要之事。正文采用语境中较自然的比较性意义，脚注保留原文的词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“又……能……”承接上文对自称为犹太之人的描述；末尾分号表明本节在句法上仍与后文相连。
