id: ROM.2.15
reference: Romans 2:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οἵτινες ἐνδείκνυνται τὸ ἔργον τοῦ νόμου γραπτὸν ἐν ταῖς καρδίαις αὐτῶν, συμμαρτυρούσης αὐτῶν τῆς συνειδήσεως καὶ μεταξὺ ἀλλήλων τῶν λογισμῶν κατηγορούντων ἢ καὶ ἀπολογουμένων,
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/015.yaml
  text: They show that the work of the law is written on their hearts[b][a], while their conscience also bears witness and their thoughts accuse or even defend them.
translation:
  language: zh_hans
  text: 他们显明：律法的工作[a]写在他们心里；他们的良心也为此作证，他们的思念彼此控告，或甚至彼此辩护[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“律法的要求”或“律法所要求的事”。
    reason: lexical_alternative
  - marker: b
    text: 也可理解为：“他们的思念控告他们，或甚至为他们辩护。”不过，希腊文含有“彼此”的相互意味。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐνδείκνυνται
  choice: 显明
  rationale: “显明”自然表达该动词所含的展示、表明之意，又不加强为严格意义上的“证明”。
- source_word: τὸ ἔργον τοῦ νόμου
  choice: 律法的工作
  rationale: 保留原文单数“工作”的紧凑表达，不在正文中直接解释为律法的要求；较明确的解释列入脚注。
- source_word: γραπτὸν ἐν ταῖς καρδίαις αὐτῶν
  choice: 写在他们心里
  rationale: 符合现代汉语习惯，也保留内在铭刻的比喻。
- source_word: συμμαρτυρούσης αὐτῶν τῆς συνειδήσεως
  choice: 他们的良心也一同作证
  rationale: “一同作证”体现复合动词的共同见证或佐证意味，并自然处理属格独立结构。
- source_word: μεταξὺ ἀλλήλων τῶν λογισμῶν
  choice: 他们的思念彼此之间
  rationale: 原文句法紧缩；此译尽量保留 μεταξὺ ἀλλήλων 的相互关系，不把所指关系完全确定下来。
- source_word: κατηγορούντων ἢ καὶ ἀπολογουμένων
  choice: 或是控告，或甚至辩护
  rationale: “辩护”比“开脱”更直接对应 ἀπολογέομαι；“甚至”表达 ἢ καὶ 中 καὶ 的强调意味。
theological_decisions:
- issue: 这里指普遍的内在道德意识，还是特指律法所要求的事
  choice: 正文保留较少解释性的“律法的工作”
  alternative: 律法的要求；律法所要求的事
  rationale: 希腊文比常见的解释性译法更紧凑。保留其表达可避免预先消解保罗用语中的神学张力。
- issue: 思念是彼此控告、辩护，还是控告、辩护有关的人
  choice: 正文保留“彼此之间”的相互意味，同时不明说控告或辩护的宾语
  alternative: 他们的思念控告他们，或甚至为他们辩护
  rationale: 原文的 μεταξὺ ἀλλήλων 具有相互意味，但压缩的句法容许不同理解；不宜在正文中武断补出宾语。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“律法的工作”有意保留原文较不寻常的紧凑说法，并以脚注提供常见解释；末句保留原文相互关系及宾语未明的张力。
