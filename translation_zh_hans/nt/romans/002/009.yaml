  text: θλῖψις καὶ στενοχωρία, ἐπὶ πᾶσαν ψυχὴν ἀνθρώπου τοῦ κατεργαζομένου τὸ κακόν, Ἰουδαίου τε πρῶτον καὶ Ἕλληνος·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/009.yaml
  text: There will be affliction and distress upon every human soul that does evil[b][a], to the Jew first and also to the Greek.
translation:
  language: zh_hans
  text: 患难和困苦必临到每一个人[a]，就是作恶的人；先临到犹太人，也临到希腊人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“每一个人的魂”；此处指每一个人。
    reason: lexical_alternative
  - marker: b
    text: 这里的“希腊人”在“犹太人／希腊人”的对举中指非犹太人。
    reason: lexical_alternative
lexical_decisions:
- source_word: θλῖψις
  choice: 患难
  rationale: 表达严重的苦难与压迫，符合审判语境，也能与后面的“困苦”构成自然而有层次的并列。
- source_word: στενοχωρία
  choice: 困苦
  rationale: 保留原词受逼迫、陷入窘境的意味，同时与“患难”有所区分，形成递进式的沉重语气。
- source_word: ἐπὶ πᾶσαν ψυχὴν ἀνθρώπου
  choice: 临到每一个人
  rationale: 这里的“魂”以转喻方式指整个人；现代汉语若直译“每一个人的魂”容易被误解为只针对人的非物质部分，因此正文自然译出整体所指，并以脚注保留原文表达。
- source_word: τοῦ κατεργαζομένου
  choice: 作
  rationale: 该分词表示实施或行出某事；“作恶”简洁自然，且不额外强化为长期习惯。
- source_word: τὸ κακόν
  choice: 恶
  rationale: 中性单数带冠词在此为概括用法；与动词合译为现代汉语惯用的“作恶”。
- source_word: Ἰουδαίου
  choice: 犹太人
  rationale: 在本段指犹太民族及其宗教身份，而非仅指犹太地区居民。
- source_word: Ἕλληνος
  choice: 希腊人
  rationale: 保留保罗实际使用的族群称谓及其反复出现的“犹太人／希腊人”对举；在此语境中泛指非犹太人，故加脚注说明。
- source_word: πρῶτον
  choice: 先是
  rationale: 自然保留次序或优先性的含义，不进一步解释这种“先”所涉及的是特权、责任还是审判次序。
- source_word: τε ... καὶ
  choice: 也同样
  rationale: 体现两方都包括在内，并让“先是”不至于被误读为只有犹太人受审判。
theological_decisions:
- issue: 是否在汉语中补出将来审判的谓语
  choice: 以“必临到”补足句子
  alternative: 保留名词句：“患难和困苦临到……”
  rationale: 希腊文在上下文中承接第6至8节，谓语可由语境补足；现代汉语加入“必临到”使句子完整，并表达上下文明确的将来审判与确定性，而不增添宗派性解释。
- issue: ψυχή是否直译为“灵魂”
  choice: 正文译为“人”，脚注注明原文作“每一个人的魂”
  alternative: 正文直译“每一个人的灵魂”
  rationale: 此处ψυχή指整个人，而非将人分为身体与灵魂后只审判其中一部分。译作“人”准确传达所指，脚注则保存原文具体意象。
- issue: Ἕλλην是否解释性译为“外邦人”
  choice: 正文保留“希腊人”
  alternative: 译作“外邦人”或“非犹太人”
  rationale: “希腊人”保留原文措辞及罗马书中的固定对举；脚注说明在这一对举中所涵盖的非犹太人，避免正文过度解释。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“患难和困苦”保留两个近义名词的并列加强效果；“作恶”简洁自然；“先是……也同样是……”既保留次序，也清楚表达审判临到双方。所有脚注标记均置于正文相关词语之后。
