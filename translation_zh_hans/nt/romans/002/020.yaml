source:
  edition: SBLGNT
  text: παιδευτὴν ἀφρόνων, διδάσκαλον νηπίων, ἔχοντα τὴν μόρφωσιν τῆς γνώσεως καὶ τῆς ἀληθείας ἐν τῷ νόμῳ—
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/020.yaml
  text: an instructor of the foolish[a], a teacher of infants, having in the law the embodiment of knowledge and truth—
translation:
  language: zh_hans
  text: 是愚昧人的训导者、婴孩的老师，并且在律法中拥有知识和真理的体现[a]——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“知识和真理的形式”。
    reason: 保留 μόρφωσις 可指“形式”或“成形表达”的词义可能，避免正文的“体现”排除原文歧义。
lexical_decisions:
- source_word: παιδευτὴν
  choice: 训导者
  rationale: 该词指训练、教导或规劝别人的人。“训导者”既保留教育含义，也不把惩戒意味强调过度，并与本段自夸能指导他人的语气相符。
- source_word: ἀφρόνων
  choice: 愚昧人
  rationale: 该词意为愚昧、缺乏明辨的人；“愚昧人”自然清楚，也保留原文带有轻蔑意味的称呼。
- source_word: διδάσκαλον
  choice: 老师
  rationale: 这是该词通常且直接的含义；现代汉语中“老师”自然易懂，并与前面的“训导者”形成对应。
- source_word: νηπίων
  choice: 婴孩
  rationale: 该词本义是婴儿或年幼孩童，也可比喻不成熟的人；译作“婴孩”保留原文的字面比喻和修辞力度。
- source_word: ἔχοντα
  choice: 拥有
  rationale: 保留分词所表达的持有或具备之意，并使这一描述与前面的身份称谓顺畅连接。
- source_word: μόρφωσιν
  choice: 具体体现
  rationale: 该词可指形式、成形的表达或具体体现。“具体体现”传达知识和真理在律法中获得可辨认表达的含义，同时用脚注保留“形式”这一较贴近词形的译法。
- source_word: γνώσεως
  choice: 知识
  rationale: “知识”是自然、准确的对应词，也保留它与“真理”的并列关系。
- source_word: ἀληθείας
  choice: 真理
  rationale: “真理”准确表达该词在此处的含义，并保留保罗书信中常见的神学语域。
- source_word: ἐν τῷ νόμῳ
  choice: 在律法中
  rationale: 保留介词结构，表明所声称拥有的知识和真理之体现是在律法中；“律法”在上下文中自然指犹太人的律法。
theological_decisions:
- issue: μόρφωσις 是指真实的“具体体现”，还是仅指外在“形式”
  choice: 正文译作“具体体现”，不判定此处带有贬义
  alternative: 形式；外在形式；轮廓
  rationale: 原词本身可以表示成形的表达或形式，而上下文随后会质问自称教导者的人。译文不提前断定保罗是在肯定律法的真实内容，还是讽刺对方只有外在形式；脚注保留词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。经文是承接上文的一串描述，因此保留句首“是”和句末破折号。用“婴孩”保存原文直白而尖锐的比喻；用“训导者”与“老师”区分两个近义称谓。
