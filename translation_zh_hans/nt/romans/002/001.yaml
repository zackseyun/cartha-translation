source:
  edition: SBLGNT
  text: Διὸ ἀναπολόγητος εἶ, ὦ ἄνθρωπε πᾶς ὁ κρίνων· ἐν ᾧ γὰρ κρίνεις τὸν ἕτερον, σεαυτὸν κατακρίνεις, τὰ γὰρ αὐτὰ πράσσεις ὁ κρίνων·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/001.yaml
  text: Therefore you are without excuse[a], O man, every one who judges. For in passing judgment on another, you condemn yourself, because you who judge practice the same things.
translation:
  language: zh_hans
  text: 所以，人哪，凡论断别人的，你都无可推诿；因为你论断别人时，就定自己的罪；因为你这论断人的，所做的正是同样的事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὸ
  choice: 所以
  rationale: 承接前文并引出推论，清楚保留逻辑关系。
- source_word: ἀναπολόγητος
  choice: 无可推诿
  rationale: 表达无法提出有效辩解的司法意味，同时符合现代汉语习惯。
- source_word: ὦ ἄνθρωπε
  choice: 人哪
  rationale: 保留单数呼语和直接责问的修辞力度；汉语“人”本身可作不分性别的泛指。
- source_word: πᾶς ὁ κρίνων
  choice: 你无论是谁，只要论断别人
  rationale: 把πᾶς的普遍范围和分词所指的论断行为自然地表达出来。
- source_word: ἐν ᾧ κρίνεις τὸν ἕτερον
  choice: 你论断别人时
  rationale: 以自然汉语表达该结构的时间性含义，即在论断别人的行动中；其工具性意味也由下句“就是定自己的罪”体现。
- source_word: κατακρίνεις
  choice: 定自己的罪
  rationale: 区别于一般的“论断”，保留作出有罪判定的较强司法含义。
- source_word: τὰ γὰρ αὐτὰ πράσσεις
  choice: 也做同样的事
  rationale: 忠实表达行为相同；“做”在此可涵盖现在时所表示的持续或惯常行为。
- source_word: ὁ κρίνων
  choice: 你这论断人的
  rationale: 保留分词对受话者身份的再次点明，并维持保罗责问的语气。
theological_decisions:
- issue: 保罗责备中阳性单数呼语的代表性范围
  choice: 正文译作“人哪”，并在脚注说明其泛指性质
  alternative: “世人哪”或“任何人啊”
  rationale: 希腊语ἄνθρωπε虽为阳性单数形式，此处却代表任何论断别人的人。汉语“人”既保留单数呼语的修辞形式，也不会限定为男性。
- issue: 论断别人如何导致自我定罪
  choice: 保留“论断别人时，就是定自己的罪”的紧密关系
  alternative: “你凭什么论断别人，就凭什么定自己的罪”
  rationale: ἐν ᾧ可带时间或工具色彩；正文采用自然的时间性表达，但不把因果关系解释为某一种特定的审判标准，以免消除原文的含混和张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“人哪”保留使徒直接责问的修辞语气；“无可推诿”“定罪”维持本节的司法语域。
