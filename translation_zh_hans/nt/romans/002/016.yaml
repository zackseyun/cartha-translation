- from: 就在神借着弥赛亚耶稣[a]审判人隐秘之事的那一天——这是照着我的福音所说的。
  to: 就在那一天，神要按照我的福音，借着弥赛亚耶稣[a]审判人隐秘的事。
  rationale: 修订将“按照我的福音”直接置于神施行审判的陈述中，避免添加“这是……所说的”的解释性结构，同时保留原文的时间指向、审判对象、中介关系、保罗的第一人称所有格和“弥赛亚”这一称号意义。“要”在“那一天”的末世审判语境中以自然现代汉语明确原文现在时的未来指向。
