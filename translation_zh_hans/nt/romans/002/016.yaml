  terminology: “弥赛亚耶稣”适当地保留Χριστός的称号含义；“审判”“福音”均符合本段的既定宗教术语。“人隐秘的事”保留τὰ κρυπτὰ τῶν ἀνθρώπων的宽泛范围，不限于内心思想。脚注的传统译名“基督耶稣”可保留。
