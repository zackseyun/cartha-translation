  text: ἐν ⸂ἡμέρᾳ ὅτε⸃ ⸀κρίνει ὁ θεὸς τὰ κρυπτὰ τῶν ἀνθρώπων κατὰ τὸ εὐαγγέλιόν μου διὰ ⸂Χριστοῦ Ἰησοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/016.yaml
  text: on the day when God judges the secrets of people through Messiah Jesus[a], according to my gospel.
translation:
  language: zh_hans
  text: 就在那一天，神要按照我的福音，借着弥赛亚耶稣[a]审判人隐秘的事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“基督耶稣”。
    reason: Χριστός既可突出“弥赛亚”这一称号，也可采用传统译名“基督”。
lexical_decisions:
- source_word: ἐν ἡμέρᾳ ὅτε
  choice: 就在……的那一天
  rationale: 保留明确的末日时间指向，并以现代汉语自然表达希腊文的时间结构；“就”也承接上文。
- source_word: κρίνει
  choice: 审判
  rationale: 现在时形式置于指向未来的时间结构中，表达将来发生的末世审判；汉语无需另加“将要”也能保留这种语气。
- source_word: τὰ κρυπτὰ τῶν ἀνθρώπων
  choice: 人隐秘之事
  rationale: 既可涵盖人内心的秘密，也可涵盖一切被隐藏的事，不将所指限缩为思想或行为；“人”是泛指全人类。
- source_word: κατὰ τὸ εὐαγγέλιόν μου
  choice: 这是照着我的福音所说的
  rationale: 保留保罗的第一人称所有关系，并用自然汉语说明这审判与他所传福音相符；“福音”在本语境中也可指其所宣讲的福音信息。
- source_word: διὰ Χριστοῦ Ἰησοῦ
  choice: 借着弥赛亚耶稣
  rationale: διά加属格表示中介或施行审判的代理者，故译作“借着”；Χριστός在此保留“受膏者／弥赛亚”的称号意味。
theological_decisions:
- issue: Χριστοῦ在此译为称号还是姓名化形式
  choice: 弥赛亚耶稣
  alternative: 基督耶稣
  rationale: 此处仍可清楚听出“弥赛亚”这一称号含义，正文据此翻译；传统且已高度姓名化的译法列入脚注，不排除这种理解。
- issue: κατὰ τὸ εὐαγγέλιόν μου与句中成分的关系
  choice: 这是照着我的福音所说的
  alternative: 神按照我的福音施行审判
  rationale: 希腊文可理解为福音宣告这场审判，也可更直接地修饰“审判”。正文采用较自然且避免让“福音”听来像审判标准的表达，同时不否认其与审判行动的紧密关系。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“隐秘之事”保留原文对象的宽泛性；破折号帮助读者看出末尾短语对整句的说明作用，同时本节仍自然承接上文。
