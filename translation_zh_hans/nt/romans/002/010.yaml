  text: δόξα δὲ καὶ τιμὴ καὶ εἰρήνη παντὶ τῷ ἐργαζομένῳ τὸ ἀγαθόν, Ἰουδαίῳ τε πρῶτον καὶ Ἕλληνι·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/010.yaml
  text: but glory and honor and peace to everyone who does good[b][a], to the Jew first and also to the Greek.
translation:
  language: zh_hans
  text: 但荣耀、尊贵和平安要归给每一个行善的人[a]，先归给犹太人，也归给希腊人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“行那善的事”。
    reason: lexical_alternative
  - marker: b
    text: “希腊人”在这里很可能广指非犹太人，也就是外邦人。
    reason: cultural_note
lexical_decisions:
- source_word: δόξα
  choice: 荣耀
  rationale: “荣耀”是该词在圣经语境中的常用译法，保留其尊荣和末世赏赐的意味。
- source_word: τιμή
  choice: 尊贵
  rationale: “尊贵”与“荣耀”搭配自然，表达受到尊重、得着尊荣的含义。
- source_word: εἰρήνη
  choice: 平安
  rationale: “平安”保留该词宽广的圣经含义，不局限于内心安宁或人际和睦。
- source_word: παντὶ τῷ ἐργαζομένῳ
  choice: 每一个……的人
  rationale: 这一分词结构指以某种行为为特征的人；“每一个……的人”既自然，也保留其概括性。
- source_word: τὸ ἀγαθόν
  choice: 行善
  rationale: 直译可作“行那善的事”；现代汉语用“行善”简洁自然，脚注保留较贴近形式的译法。
- source_word: Ἰουδαίῳ
  choice: 犹太人
  rationale: 采用直接、通行的族群称谓；希腊文单数在这里具有代表性，中文无需标明单数。
- source_word: πρῶτον
  choice: 先
  rationale: “先”简洁地保留原文所表达的次序，不在正文中进一步解释这一先后次序的性质。
- source_word: Ἕλληνι
  choice: 希腊人
  rationale: 保留原文“犹太人—希腊人”的对举；其在此可能泛指非犹太人，另以脚注说明。
- source_word: δὲ
  choice: 但
  rationale: 该连接词与上一节的忿怒、患难形成对比，因此译作“但”。
theological_decisions:
- issue: 保罗以“犹太人和希腊人”所表达的范围
  choice: 正文译作“希腊人”，脚注说明此处很可能广指非犹太人，即外族人。
  alternative: 正文直接译作“外族人”。
  rationale: “希腊人”保留原文用词及保罗的固定对举，同时脚注呈现其较广的族群和宗教语境含义，避免在正文中消除原有表达。
- issue: “先是犹太人”所指次序的性质
  choice: 只译出“先”，不解释为时间、救恩历史或优先地位。
  alternative: 在正文中明确解释这一先后次序。
  rationale: 原文本身只陈述次序；保持简洁可避免把某一种神学解释直接写入经文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“要归给”补足汉语句法所需的谓语，同时不明说施予者；重复“归给”使“先……也……”的结构清楚。
