- from: 他必照各人所行的报应各人[a]。
  to: 他必按各人的行为，给各人相应的报偿。
  rationale: 修订以“按各人的行为”准确表达κατὰ τὰ ἔργα αὐτοῦ，以“给各人”保留ἑκάστῳ的逐一性；“相应的报偿”表达ἀποδώσει的回报/偿还含义，并避免“报应”在现代中文中常见的纯惩罚联想。译文不解释该报偿的具体结果，因而保留原文的神学张力。
  reviewer_model: gpt-5.6-terra
