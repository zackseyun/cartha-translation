  text: who will repay each one according to his works[a][b].
translation:
  language: zh_hans
  text: 他必按各人的行为，给各人相应的报偿。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὃς
  choice: 他
  rationale: 关系代词承接上文的神；中文独立呈现本节时，以“他”自然连接语境，又不增加解释。
- source_word: ἀποδώσει
  choice: 必……报应
  rationale: 该动词在此有按行为给予相应回报的审判语境。“报应”兼可涵盖赏与罚，保留司法性回报的力度，不弱化为一般的“对待”。
- source_word: ἑκάστῳ
  choice: 各人
  rationale: 保留与格单数的逐一、分配性意味，现代中文简洁自然。
- source_word: κατὰ
  choice: 照
  rationale: 准确表达以某事为标准或尺度，符合现代汉语经文语体。
- source_word: τὰ ἔργα
  choice: 所行的
  rationale: 将名词性“行为/作为”自然转化为汉语关系结构，指各人实际所做之事；不局限为善行，也不预先化解保罗神学中的张力。
- source_word: αὐτοῦ
  choice: 各人所行的
  rationale: 希腊文阳性单数代词在ἑκάστῳ之后具有泛指、回指功能。中文用“各人所行的”清楚表达“每个人自己的行为”，无需采用可能被误解为仅指男性的“他的”。
theological_decisions:
- issue: 按行为施行审判
  choice: 保留“照各人所行的报应各人”的司法性回报表述
  alternative: 弱化为“按各人的行为对待各人”或只译作“奖赏”
  rationale: 原文明确陈述神按各人的行为给予相应回报；译文不以其他保罗书信的称义论述来消解或限定本节，也不把结果预设为只有奖赏或只有惩罚。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“报应”在此按其本义表示给予相应回报，既不限定为惩罚，也保留审判语境。主文中的脚注标记与脚注完全对应。
