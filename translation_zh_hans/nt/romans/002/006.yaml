review_pass:
  verdict: revise
  source_fidelity: 原文ὃς承接上文的神，未来时ἀποδώσει表示在审判/报偿语境中按行为作出相应回报；ἑκάστῳ的逐一分配性，以及κατὰ τὰ ἔργα αὐτοῦ“按每个人自己的行为”的标准，均应保留。草案的基本理解正确，但“报应”在现代普通话中通常强烈偏向惩罚，容易把本节的中性、可涵盖赏罚的报偿意义限窄。
  naturalness: “他必照各人所行的报应各人”中“各人”重复，且“照……报应……”虽有传统经文语感，在现代汉语中不如“按……给……相应的报偿”清晰自然。
  terminology: 将ἀποδώσει译为“给……相应的报偿”保留按行为给予相称回报的司法意味，而不预设仅为惩罚或仅为奖赏。“行为”是τὰ ἔργα在此简洁、自然且涵盖广泛的译法。
  issues:
  - severity: medium
    issue: “报应”在现代汉语中的语义偏向惩罚。
    rationale: ἀποδώσει在本节及紧邻上下文的审判语境中是按行为作相应回报，不宜由主文预先限定为负面惩罚。
  - severity: low
    issue: 主文“各人”重复，原有脚注所注释的“所行的”也不够必要。
    rationale: 改为“各人的行为”后可更直接呈现所有格回指，并删除无须保留的词汇替代脚注。
  revised_text: 他必按各人的行为，给各人相应的报偿。
