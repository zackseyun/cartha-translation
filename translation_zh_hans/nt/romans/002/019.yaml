  yaml_path: translation/nt/romans/002/019.yaml
  text: And you are convinced that you yourself are a guide to the blind, a light to those in darkness,
translation:
  language: zh_hans
  text: 又确信自己是盲人的向导，是在黑暗中的人的光，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πέποιθάς
  choice: 深信
  rationale: 完成时表达已经形成并持续存在的笃定、自信状态；“深信”自然地呈现保罗所指出的自我确信语气。
- source_word: τε
  choice: 又
  rationale: 该连接词承接上文所列举的自我认定；“又”简洁保留其连接和递进作用。
- source_word: σεαυτὸν
  choice: 自己
  rationale: 反身代词指向受话者本人；现代汉语用“自己”即可自然表达其自我认定的意味，无须生硬增译“你自己”。
- source_word: ὁδηγὸν
  choice: 向导
  rationale: 准确保留带领、指引他人的比喻，在现代汉语中简洁自然。
- source_word: τυφλῶν
  choice: 瞎子
  rationale: 保留原文名词化形容词的概括性指称，并与“向导”的比喻形成清楚对应。
- source_word: φῶς
  choice: 光
  rationale: 保留原文直接的隐喻，指能给人启明和方向的人。
- source_word: τῶν ἐν σκότει
  choice: 黑暗中之人
  rationale: 以人的指称呈现冠词短语，同时保留“在黑暗中”的空间性隐喻；“之人”使经文庄重而不晦涩。
theological_decisions:
- issue: 受话者的自我认定是否得到保罗认可
  choice: 以“深信自己是”保留其主观确信，不改写为客观事实
  alternative: 你确实是／你作为
  rationale: 上下文具有反诘和揭露自负的张力；原文说明受话者相信自己具有这些身份，并不在本节直接确认这种自我评价为真。
translation_notes:
  register: 采用现代、庄重而清楚的书面汉语；保留“瞎子—向导”“黑暗—光”的平行隐喻和本节未完句式，以衔接罗马书2:20。
