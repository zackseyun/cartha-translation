  text: καὶ κρινεῖ ἡ ἐκ φύσεως ἀκροβυστία τὸν νόμον τελοῦσα σὲ τὸν διὰ γράμματος καὶ περιτομῆς παραβάτην νόμου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/027.yaml
  text: And the uncircumcised person by nature[a], if he fulfills the law, will judge you who, with the letter and circumcision[b], are a transgressor of the law.
translation:
  language: zh_hans
  text: 这样，那生来未受割礼的人若遵行律法，就要审判你这有成文的律法、又受了割礼，却违犯律法的人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “成文的律法”直译为“字句”；此短语也可译为“借着字句和割礼”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκροβυστία
  choice: 未受割礼的人
  rationale: 该词字面为“未受割礼”，此处借此指未受割礼的人；不直接译作“外族人”，以保留原文围绕割礼所作的对比。
- source_word: ἐκ φύσεως
  choice: 生来
  rationale: 这里描述其天然、出生以来未受割礼的状态；“生来”在现代汉语中自然，也贴合上下文的对比。
- source_word: τελοῦσα
  choice: 若遵行
  rationale: 分词在此可按语境表达条件关系；“遵行”清楚传达实际履行律法的意思，而不暗示毫无缺欠地成全律法。
- source_word: νόμος
  choice: 律法
  rationale: 上下文所指为犹太人所领受的律法；采用圣经汉语中清楚而通行的“律法”。
- source_word: διὰ γράμματος καὶ περιτομῆς
  choice: 虽有成文的律法和割礼
  rationale: διά在此表达犹太人凭借或拥有成文律法与割礼的处境；将γράμμα按语境译为“成文的律法”，比直译“字句”更易懂。配合句意用“虽有”呈现其优势与违犯之间的反差。
- source_word: παραβάτην νόμου
  choice: 违犯律法
  rationale: 以动词谓语自然表达“律法的违犯者”，同时保留与νόμος的明确关系。
theological_decisions:
- issue: 是否把ἀκροβυστία明确译成族群称谓“外族人”
  choice: 译作“未受割礼的人”
  alternative: 外族人
  rationale: 本节确实处于犹太人与外族人的论述背景中，但原文直接使用的是割礼范畴。保留这一说法可避免把词义范围扩展为明说的族群身份。
- issue: τελοῦσα是条件意义还是伴随意义
  choice: 按条件意义译作“若遵行律法”
  alternative: 遵行律法的时候／因遵行律法
  rationale: 无冠词分词可描述该未受割礼之人的特征或行为；在本句论证中，汉语用条件句能自然表达其审判作用以遵行律法为前提，但不把这种句法判断上升为额外的神学断言。
- issue: διὰ γράμματος καὶ περιτομῆς的关系
  choice: 译为“虽有成文的律法和割礼”
  alternative: 借着字句和割礼／凭着成文法典和割礼
  rationale: διά加属格通常可表示媒介，但这里若机械译为“借着……成为违犯者”容易令人误解律法与割礼本身导致犯罪。译文保留其作为对方所凭借、所拥有之条件的意味，并用让步结构呈现保罗的反讽对比。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“未受割礼的人”保留原文的转喻和论证焦点；全句调整为自然汉语语序，并以分号突出未受割礼者与有律法、割礼却违犯律法者之间的对比。
