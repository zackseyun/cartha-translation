revisions:
- from: 而且，那生来未受割礼的人若遵行律法，就要审判你；你虽有成文的律法和割礼[a]，却违犯律法。
  to: 这样，那生来未受割礼的人若遵行律法，就要审判你这有成文的律法、又受了割礼，却违犯律法的人[a]。
  rationale: 修订仅改善汉语句法和连接语，并把“有成文的律法、又受了割礼”明确纳入对“你”的限定。保留“若遵行”所表达的语境性条件关系，保留割礼而不改译为族群称谓；脚注保留γράμμα的字面表达及διά短语的另一贴近原文译法。
