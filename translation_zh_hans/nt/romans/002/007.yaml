  text: eternal life to those who by perseverance in doing good seek glory and honor and immortality.
translation:
  language: zh_hans
  text: 他要把永生赐给那些以恒心行善、寻求荣耀、尊荣和不朽的人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθ’ ὑπομονὴν ἔργου ἀγαθοῦ
  choice: 恒心行善
  rationale: κατά与ὑπομονή表达持续、坚忍的方式；ἔργου ἀγαθοῦ在此自然地表达为“行善”，既保留行为层面，也符合现代汉语。
- source_word: δόξαν καὶ τιμὴν καὶ ἀφθαρσίαν
  choice: 荣耀、尊贵和不朽
  rationale: 分别对应三个并列宾语，保留原文结构；“不朽”准确表达ἀφθαρσία的不腐朽、不败坏之意。
- source_word: ζητοῦσιν
  choice: 寻求
  rationale: 保留持续追求的基本语义，不额外解释其对象的来源或性质。
- source_word: ζωὴν αἰώνιον
  choice: 永生
  rationale: 这是现代中文圣经语域中自然且准确的固定表达，对应“永恒的生命”。
theological_decisions:
- issue: 永生与恒心行善之间的关系
  choice: 保留原文的直接陈述，不添加“凭功德”“作为奖赏”或“因信而能”等解释
  alternative: 用解释性措辞明确界定称义、行为与赏赐的系统关系
  rationale: 本节在句法上承接第6节“照各人的行为报应各人”，本句本身不解决更广泛的神学张力；译文应保留这种张力。
- issue: 句首省略的施予者与谓语
  choice: 依据上文补出“却把……赐给”以形成自然汉语句子
  alternative: 译作片语“永生给那些……”或机械照录无谓语结构
  rationale: 希腊文此句承接第6节的ἀποδώσει；中文单独呈现经节时补足承接关系更清楚。“赐给”表达给予，并未改变对象和条件。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“恒心行善”简洁呈现坚忍持续地做善事；并列的“荣耀、尊贵和不朽”保留原文节奏。
