  text: οὐ γὰρ ὁ ἐν τῷ φανερῷ Ἰουδαῖός ἐστιν, οὐδὲ ἡ ἐν τῷ φανερῷ ἐν σαρκὶ περιτομή·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/028.yaml
  text: For a Jew is not one outwardly[a], nor is circumcision outward in the flesh[c][b];
translation:
  language: zh_hans
  text: 因为，外表上的犹太人[a]不是真正的犹太人；肉身上[c]外在的[b]割礼，也不是真正的割礼。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “犹太人”在某些语境中也可指“犹太地区的人”；这里更可能指与律法和割礼相关的圣约身份。
    reason: lexical_alternative
  - marker: b
    text: “外在的”也可译作“在可见之处”或“显于外表”。
    reason: lexical_alternative
  - marker: c
    text: “在肉身上”是原文的直译，这里指身体上的割礼。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰουδαῖος
  choice: 犹太人
  rationale: 本段讨论以律法和割礼为标志的以色列圣约身份，而非单指犹太地区的居民，因此译作“犹太人”最合乎语境。
- source_word: ἐν τῷ φανερῷ
  choice: 表面上／显于外表
  rationale: 该短语指可见、外在的层面，并与下一节的内在实质形成对照。因两处分属不同句法结构，分别采用自然的“表面上”和“显于外表”。
- source_word: περιτομή
  choice: 割礼
  rationale: 这是此处所论圣约记号的现代汉语标准译法。
- source_word: ἐν σαρκί
  choice: 在肉身上
  rationale: 此处 σάρξ 指身体层面的实际割礼；“肉身”保留原文措辞及其与下一节内在层面的对照。
- source_word: γὰρ
  choice: 因为
  rationale: 表明本节对前文论证的解释关系，现代汉语中用“因为”衔接自然。
- source_word: οὐδὲ ἡ ἐν τῷ φανερῷ ἐν σαρκὶ περιτομή
  choice: 在肉身上显于外表的割礼，也不是真正的割礼
  rationale: 原文为省略结构，谓语需由前半句补足。汉语加入“真正的”以清楚表达“外在的割礼并不构成此处所说的割礼”，同时保留保罗刻意形成的悖论式对照。
theological_decisions:
- issue: “犹太人”和“割礼”所表达的圣约身份
  choice: 将经文译成对单凭外在身份标志是否构成真正圣约身份的否定
  alternative: 理解为否定犹太身份本身，或把犹太身份完全改换为纯属灵的类别
  rationale: 原文在本节与下一节之间对照外在和内在层面，并未直接废除犹太身份或割礼这两个类别。译文保留这一张力，不预先替下一节作神学定论。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。前后两分句保留原文的平行结构和悖论式重复；以“真正的”补足希腊文省略的判断关系，使普通读者能够自然理解，又不把“内在”的具体含义提前带入本节。
