  text: οἴδαμεν δὲ ὅτι τὸ κρίμα τοῦ θεοῦ ἐστιν κατὰ ἀλήθειαν ἐπὶ τοὺς τὰ τοιαῦτα πράσσοντας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/002.yaml
  text: And we know that the judgment of God is according to truth against those who practice such things[a].
translation:
  language: zh_hans
  text: 我们知道，神对那些行这类事的人所施行的审判，是按照真理的[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“合乎真理”；意思是，神的审判与真实情况相符。
    reason: 说明κατὰ ἀλήθειαν的自然汉语替代译法及其语义。
lexical_decisions:
- source_word: οἴδαμεν
  choice: 我们知道
  rationale: οἶδα虽为完成时形式，却具有现在时意义；“我们知道”直接、自然。
- source_word: δέ
  choice: （不单独译出）
  rationale: δέ在这里主要承接上文，并非表示强烈转折；汉语借句序即可自然延续论述，若硬译“而且”或“但是”反会加重原文没有的语气。
- source_word: κρίμα
  choice: 审判
  rationale: κρίμα在此指神司法性的判断；“审判”保留较宽泛的含义，不预先把它限定为“定罪”或仅指“判决”。
- source_word: κατὰ ἀλήθειαν
  choice: 按照真理
  rationale: 该短语表示神的审判符合真理或事实真相；采用较透明的译法，保留保罗将神的审判与真理相联的表达。
- source_word: ἐπὶ
  choice: 对
  rationale: ἐπί在这里指审判所针对的人；汉语“对……所作的审判”自然表达其司法指向。
- source_word: τὰ τοιαῦτα
  choice: 这类事
  rationale: 指回上文所述的种种行为；“这类事”简洁且符合现代汉语。
- source_word: πράσσοντας
  choice: 行
  rationale: 现在分词刻画这些人的持续或典型行为；在“那些行这类事的人”中，“行”既自然，也保留其行为特征，避免以“惯行”过度强化频率。
theological_decisions:
- issue: κατὰ ἀλήθειαν应较直译为“按照真理”，还是解释性地译为“公正无误”。
  choice: 按照真理
  alternative: 公正无误／合乎事实
  rationale: “按照真理”保留原文的词汇和神学张力，使读者看见神的审判以真理或真实情况为准，而不把该短语仅归结为一般性的公正。
- issue: κρίμα是否应明确译作带不利结果的“定罪”。
  choice: 审判
  alternative: 定罪
  rationale: 虽然语境中的审判具有不利指向，但κρίμα本身可指司法判断；译作“审判”避免把结果提前限定为“定罪”。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“对那些……的人所作的审判”保留原文以“审判”为中心的名词结构；正文中的[a]与脚注标记一致。
