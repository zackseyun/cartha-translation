id: ROM.2.21
reference: Romans 2:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ οὖν διδάσκων ἕτερον σεαυτὸν οὐ διδάσκεις; ὁ κηρύσσων μὴ κλέπτειν κλέπτεις;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/021.yaml
  text: You, therefore, who teach another, do you not teach yourself? You who proclaim, “Do not steal,” do you steal?
translation:
  language: zh_hans
  text: 那么，你这教导别人的，难道不教导自己吗？你这宣讲“不可偷盗”的，自己倒偷盗吗？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: 那么
  rationale: 承接上文并引出推论；现代汉语中“那么”既保留推论关系，也适合连续反问的语气。
- source_word: διδάσκων
  choice: 教导
  rationale: 将作名词用的现在分词译入“你这……的”结构，表达以教导人为特征的人，并保持动作与下句的对称。
- source_word: ἕτερον
  choice: 别人
  rationale: 自然表达单数的ἕτερον，保留“他人”与“自己”的鲜明对照，而不刻意扩大为复数。
- source_word: σεαυτὸν
  choice: 自己
  rationale: 准确体现反身代词，突出教导别人却不教导自己的讽刺性对照。
- source_word: οὐ διδάσκεις;
  choice: 难道不教导自己吗？
  rationale: 以“难道不……吗”保留否定疑问及责问意味，不把反问改写成直陈判断。
- source_word: κηρύσσων
  choice: 宣讲
  rationale: 体现公开宣告的含义，同时避免“讲道”可能带入的特定礼仪或教会语境。
- source_word: μὴ κλέπτειν
  choice: 不可偷盗
  rationale: 按宣告内容译作直接禁令；“不可偷盗”简洁庄重，并呼应诫命式表达。
- source_word: κλέπτεις;
  choice: 自己倒偷盗吗？
  rationale: 保留现在时反问；“自己倒”自然凸显宣讲禁令与本人行为之间的尖锐反差，但不把疑问改成明确指控。
theological_decisions:
- issue: 反问是否断言受话者实际犯了偷盗
  choice: 保留“……吗？”的反问形式
  alternative: 译成“你自己却偷盗”一类直陈句
  rationale: 希腊文使用疑问形式，修辞上具有强烈责问意味，但文本仍未直接改写为事实陈述；保留这一张力较为稳妥。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你这……的”重现两个 substantival participle 的平行结构；两问保持保罗直接、尖锐的修辞节奏。
