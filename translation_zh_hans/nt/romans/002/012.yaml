id: ROM.2.12
reference: Romans 2:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ὅσοι γὰρ ἀνόμως ἥμαρτον, ἀνόμως καὶ ἀπολοῦνται· καὶ ὅσοι ἐν νόμῳ ἥμαρτον, διὰ νόμου κριθήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/012.yaml
  text: For all who sinned apart from the law will also perish apart from the law[c][b][a], and all who sinned under the law will be judged through the law.
translation:
  language: zh_hans
  text: 因为凡在律法之外犯了罪的，也必在律法之外灭亡[a]；凡在律法之下犯了罪的，也必借着律法受审判[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在律法之外”也可译作“没有律法”或“不按律法”；原文两处使用同一副词。
    reason: lexical_alternative
  - marker: b
    text: “在律法之下”直译为“在律法中”，意思是处于律法的范围或管辖之内。
    reason: lexical_alternative
  - marker: c
    text: “借着律法”也可译作“按律法”或“凭律法”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνόμως
  choice: 在律法之外
  rationale: 按其与“在律法之下”的对照作关系性表达，指不在摩西律法的范围之内；不译作单纯描述行为方式的“不法地”。
- source_word: ἥμαρτον
  choice: 犯了罪
  rationale: 自然表达简单过去时的动作，不对不定过去时的体貌作过度诠释。
- source_word: ἀπολοῦνται
  choice: 必……灭亡
  rationale: 保留将来结果及原词的宽泛含义，不擅自限定为消灭或某一种终末刑罚。
- source_word: ἐν νόμῳ
  choice: 在律法之下
  rationale: 表达处于律法所管辖的范围中，比直译“在律法里”更符合现代汉语，也与前半句形成清楚对照。
- source_word: διὰ νόμου
  choice: 借着律法
  rationale: 保留 διά 所表达的媒介或凭借关系，并与 ἐν νόμῳ 的范围含义相区别。
- source_word: κριθήσονται
  choice: 必……受审判
  rationale: 保持司法评判的中性措辞，不直接译成“被定罪”，让上下文决定审判的结果。
- source_word: Ὅσοι ... καὶ ὅσοι
  choice: 凡……的……；凡……的……
  rationale: 准确传达分配性的全称范围，并形成自然、庄重的汉语平行结构。
- source_word: γὰρ
  choice: 因为
  rationale: 保留本节对前文论断所作的解释或论证关系。
theological_decisions:
- issue: νόμος（律法）的所指
  choice: 正文只译“律法”，语境上主要指摩西律法
  alternative: 一般性的道德法则
  rationale: 罗马书2章的犹太人与外族人之对照，指向是否处于摩西律法范围之内；正文不添加“摩西”以避免把可能的语义范围限定得过死。
- issue: “灭亡”与最终定罪的关系
  choice: 译作“灭亡”，不说明其具体方式
  alternative: 被定罪；被毁灭
  rationale: ἀπολοῦνται 陈述审判性的结局，却未在本节界定其具体性质；译文保留这一神学张力。
- issue: κριθήσονται 是否已含定罪之意
  choice: 译作“受审判”
  alternative: 被定罪
  rationale: κρίνω 本身可指司法审理或评判；不在译文中预先确定审判结果。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以“在律法之外／在律法之下”呈现保罗的平行对照；用两个分句及分号保留原文结构。“必”自然标示两个将来时，但不额外强化结果的性质。所有脚注标记均置于相应正文措辞之后。
