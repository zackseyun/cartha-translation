id: ROM.2.25
reference: Romans 2:25
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Περιτομὴ μὲν γὰρ ὠφελεῖ ἐὰν νόμον πράσσῃς· ἐὰν δὲ παραβάτης νόμου ᾖς, ἡ περιτομή σου ἀκροβυστία γέγονεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/025.yaml
  text: Circumcision indeed is beneficial if you practice the law[a]; but if you are a transgressor of the law[d][c][b], your circumcision has become uncircumcision.
translation:
  language: zh_hans
  text: 受割礼固然有益[a]，若你遵行律法；但你若违犯律法，你所受的割礼就成了未受割礼[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “有益”也可译作“有价值”。
    reason: lexical_alternative
  - marker: b
    text: 直译为“你的割礼已经成了未受割礼”；意思是，人若违犯律法，割礼所代表的立约特权便失去了效力。
    reason: cultural_note
lexical_decisions:
- source_word: Περιτομὴ
  choice: 受割礼
  rationale: 用现代汉语常用表达指割礼这一身份与礼仪事实，同时保留它与末句“未受割礼”的对应。
- source_word: μὲν γὰρ
  choice: 固然
  rationale: 表示先作肯定、随后转折的论述结构；“固然……但……”自然传达希腊文的对照关系。
- source_word: ὠφελεῖ
  choice: 有益
  rationale: 准确表达实际的益处或价值，措辞简明且符合现代汉语。
- source_word: ἐὰν νόμον πράσσῃς
  choice: 只要你遵行律法
  rationale: πράσσω在此指实际履行、实行；“遵行律法”自然清楚，又保留行为层面的条件。
- source_word: παραβάτης νόμου
  choice: 违犯律法
  rationale: 以动词结构自然表达“成为律法的违犯者”，并保留与前句“遵行律法”的鲜明对照。
- source_word: ἡ περιτομή σου
  choice: 你所受的割礼
  rationale: 比直译“你的割礼”更符合现代汉语，同时保留第二人称直陈的修辞力量。
- source_word: ἀκροβυστία
  choice: 未受割礼
  rationale: 此处指与割礼相反的立约身份，而非身体部位；“未受割礼”在汉语中自然，并维持保罗的对照。
- source_word: γέγονεν
  choice: 就成了
  rationale: 表达完成时所强调的转变及其现存结果，不弱化原文强烈的修辞逆转。
theological_decisions:
- issue: 末句应按身体状态理解，还是按立约身份与价值理解
  choice: 在正文中保留“你所受的割礼就成了未受割礼”这一强烈而具体的表述
  alternative: 你所受的割礼就算不得割礼
  rationale: 原文γέγονεν直接说“已经成为”，其力度强于“被算作”或“视同”；正文不替保罗消解这种修辞张力，注释只说明其语境含义。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“固然……但……”呈现原文先肯定后转折的论证推进；末句保留原文刻意形成的悖论式表达，不在正文中改写为解释性措辞。
