  text: ὃς ἐν νόμῳ καυχᾶσαι, διὰ τῆς παραβάσεως τοῦ νόμου τὸν θεὸν ἀτιμάζεις;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/023.yaml
  text: You who boast in the law[a], do you dishonor God through your transgression of the law?
translation:
  language: zh_hans
  text: 你以律法夸口，却因触犯律法[a]而使上帝蒙羞吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“借着违反律法。”
    reason: “因触犯”可表达διὰ加属格所示的媒介或缘由；“借着违反”保留较接近原文名词性短语的另一种表达。
lexical_decisions:
- source_word: ἐν νόμῳ
  choice: 以律法
  rationale: 保留介词短语与“夸口”的紧密关系；“以”可自然表达以律法为夸口的根据，同时不把原文收窄为仅仅“谈论律法”。
- source_word: καυχᾶσαι
  choice: 夸口
  rationale: 准确传达 καυχάομαι 在此处带批判意味的自夸语气，并与上下文的反诘相称。
- source_word: διὰ τῆς παραβάσεως τοῦ νόμου
  choice: 因违犯律法
  rationale: “因”表达 διά 加属格在此的媒介或缘由关系；“违犯”既对应 παράβασις 的越界、触犯法规之意，又符合现代汉语习惯。
- source_word: τὸν θεὸν
  choice: 上帝
  rationale: 指独一的上帝；汉语无需翻出希腊语定冠词。
- source_word: ἀτιμάζεις
  choice: 羞辱
  rationale: 传达使上帝失去尊荣、不给上帝当得尊荣的含义，并鲜明对应前半句的“夸口”。
theological_decisions:
- issue: νόμος 在保罗论述中的所指
  choice: 律法
  alternative: 摩西律法
  rationale: 上下文表明所指为犹太人所领受的律法，但原文只用 νόμος；译作“律法”既保留其明确语境，又避免把解释性限定直接写入正文。
- issue: 反诘句中夸口与羞辱的张力
  choice: 以“却”明确呈现语义转折，同时保留问句
  alternative: 不用“却”，逐字并列两个分句
  rationale: 希腊文虽无显式转折连词，但反诘本身建立强烈反差；汉语加入“却”使这一隐含关系自然清楚，并未化解保罗的指控张力。
translation_notes:
  register: 采用现代、庄重而直接的反诘语气。“你”对应第二人称单数；不额外补出“你这……的人”，以保持句子简洁有力。
