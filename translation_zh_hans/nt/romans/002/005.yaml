revisions:
- from: 可是，由于你刚硬，心不悔改，你正在为自己积蓄愤怒，直到震怒之日，也就是上帝公义审判[a]显明的日子。
  to: 可是，因着你的刚硬和不悔改的心，你正在为自己积蓄震怒，留到震怒和上帝公义审判[a]显明的日子。
  rationale: 修订补足“你的……和……的心”的中文结构，统一“震怒”的译法，并以“留到……日子”自然表达积蓄的末后指向。末句保留“震怒”和“显明”的并列名词结构，不以“也就是”强行界定其关系。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T03:51:23Z'
review_pass:
  verdict: revise
  source_fidelity: 草稿准确传达了因刚硬、不悔改而为自己积蓄神圣愤怒的主旨，也保留了上帝公义审判显明的内容。但“直到”将ἐν ἡμέρᾳ处理成明确的终点，超出原文较为紧凑的时间性表达；“也就是”则把并列的“震怒”和“显明”解释成严格同位，略强于希腊文的并列结构。
  naturalness: “由于你刚硬，心不悔改”在现代普通话中不如“因着你的刚硬和不悔改的心”完整自然。“留到……日子”既能自然表明当前积蓄所指向的末后日子，又避免“直到”在此处造成的累积动作终止含义。
  terminology: “刚硬”“不悔改的心”“积蓄”“震怒”“公义审判”均适合庄重而现代的圣经语体。两处ὀργή宜统一译为“震怒”，以保留本节重复及其审判语境。脚注所给“公正的审判”是δικαιοκρισία可接受的词汇替代。
  issues:
  - severity: medium
    issue: “直到震怒之日”把ἐν ἡμέρᾳ译成明确终点。
    rationale: 原文是“在……日子”，在上下文中可指所积蓄之震怒将临到的日子；“直到”会较明确地表达积蓄持续至该日才停止的时间界限。
  - severity: low
    issue: “也就是”过度明确两个并列名词的关系。
    rationale: ἡμέρᾳ ὀργῆς καὶ ἀποκαλύψεως并列“震怒”和“显明”；两者显然共同描述末后的日子，但原文并未使用明确的释义性同位连词。
  - severity: low
    issue: 同一希腊词ὀργή分别译作“愤怒”和“震怒”。
    rationale: 统一为“震怒”可更好保留原文重复，并符合此处上帝审判的庄重语境。
  revised_text: 可是，因着你的刚硬和不悔改的心，你正在为自己积蓄震怒，留到震怒和上帝公义审判[a]显明的日子。
