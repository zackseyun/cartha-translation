source:
  edition: SBLGNT
  text: κατὰ δὲ τὴν σκληρότητά σου καὶ ἀμετανόητον καρδίαν θησαυρίζεις σεαυτῷ ὀργὴν ἐν ἡμέρᾳ ὀργῆς καὶ ⸀ἀποκαλύψεως δικαιοκρισίας τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/005.yaml
  text: But because of your hardness and unrepentant heart, you are storing up wrath for yourself on the day of wrath and the revelation of God’s righteous judgment,
translation:
  language: zh_hans
  text: 可是，因着你的刚硬和不悔改的心，你正在为自己积蓄震怒，留到震怒和上帝公义审判[a]显明的日子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“上帝公正的审判”。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ δὲ
  choice: 可是，由于
  rationale: δέ以“可是”承接前文的转折，κατά加宾格在这里按因由理解，以“由于”自然表达受话者的刚硬与后果之间的关系。
- source_word: σκληρότης
  choice: 刚硬
  rationale: 保留原词有关坚硬、麻木的道德隐喻，也是现代中文读者能够理解的圣经用语。
- source_word: ἀμετανόητον καρδίαν
  choice: 心不悔改
  rationale: 保留“心”的意象和“不悔改”的核心含义，同时避免较生僻的“顽梗不悛”等说法。
- source_word: θησαυρίζεις
  choice: 正在……积蓄
  rationale: 表达动词所含不断储存、累积的意味，也保留其反讽性的“积存财宝”意象。
- source_word: σεαυτῷ
  choice: 为自己
  rationale: 准确体现反身与个人承担后果的含义。
- source_word: ὀργή
  choice: 愤怒／震怒
  rationale: 首次出现用“愤怒”自然表达所积蓄的对象；在“震怒之日”中用较庄重的“震怒”，体现上帝审判之怒的分量。
- source_word: ἐν ἡμέρᾳ ὀργῆς καὶ ἀποκαλύψεως
  choice: 直到震怒之日，也就是……显明的日子
  rationale: ἐν ἡμέρᾳ在此指向愤怒累积所面对的审判之日；中文以“直到”明确时间终点，并以同位结构表达同一日子的双重特征。
- source_word: δικαιοκρισίας τοῦ θεοῦ
  choice: 上帝公义审判
  rationale: δικαιοκρισία兼有审判及其正直、公义性质；“上帝公义审判”准确保留施行或拥有该审判者及其性质。
theological_decisions:
- issue: 是否把“震怒之日”和“公义审判的显明”完全改写成带有限定动词的解释句
  choice: 保留两个名词概念，并用“也就是……显明的日子”连接
  alternative: 到了上帝发怒并显明他公义审判的日子
  rationale: 希腊文以“震怒”和“显明”两个名词结构并列，而不是明确写成两个动作。中文同位表达既保持两者的联系，也不把原文完全改写为上帝执行两个动作的从句。
- issue: δικαιοκρισία的性质应译为“公义”还是“公正”
  choice: 公义审判
  alternative: 公正的审判
  rationale: “公义”保留该复合词所强调的正直、合乎义的审判，在保罗书信语境中庄重而通顺；“公正”也是可行的现代中文对应，列入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“刚硬”“积蓄”“震怒之日”等词保留原文意象和审判语气，同时避免古奥句法。脚注标记紧随其所说明的“公义审判”。
