  text: ἐὰν οὖν ἡ ἀκροβυστία τὰ δικαιώματα τοῦ νόμου φυλάσσῃ, ⸀οὐχ ἡ ἀκροβυστία αὐτοῦ εἰς περιτομὴν λογισθήσεται;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/026.yaml
  text: So then[a], if the uncircumcised man keeps the requirements of the law, will not his uncircumcision be counted as circumcision?
translation:
  language: zh_hans
  text: 那么，未受割礼的人[a]若遵守律法的要求，他的未受割礼岂不被算作割礼吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为：“未受割礼若遵守……，他的未受割礼岂不被算作割礼吗？”这里用“未受割礼”这一抽象名词指未受割礼的人。
    reason: 说明原文以抽象名词代指人，并保留其字面表达。
lexical_decisions:
- source_word: ἀκροβυστία
  choice: 未受割礼的人／他未受割礼
  rationale: 该词本义是“未受割礼”或“未受割礼的状态”，此处借此指未受割礼的人，且后文 αὐτοῦ（“他的”）表明所指为人。译文首次出现时明确译出“人”，后半句保留“他未受割礼”的表达，以兼顾自然中文和原文的反复。
- source_word: δικαιώματα
  choice: 要求
  rationale: 复数在此指律法所规定、要求人实行的事。“要求”清楚自然，也不额外加入“公义”等原文在本短语中未明说的强调。
- source_word: νόμου
  choice: 律法
  rationale: 在保罗此处的论述中指犹太人所领受的律法；“律法”是现代中文圣经语境中自然且明确的表达。
- source_word: φυλάσσῃ
  choice: 遵守
  rationale: 该动词在诫命和律法语境中表示谨守、实行；“遵守”最符合现代中文习惯。
- source_word: λογισθήσεται
  choice: 算作
  rationale: 保留该词“计算、归算、视为”的判断性含义，同时避免较古雅的“算为”或较抽象的“归算”。
- source_word: εἰς περιτομήν
  choice: 算作受了割礼
  rationale: εἰς 在此表示所归入的身份或类别。中文补出“受了”，自然表达其未受割礼的状态被视同受割礼。
- source_word: οὐχ
  choice: 难道不……吗
  rationale: 该否定词引出预期肯定答案的反问；“难道不……吗”准确保留反问语气。
- source_word: οὖν
  choice: 那么
  rationale: 承接前文推论，译作“那么”比单纯的“所以”更自然地引出这一条件反问。
theological_decisions:
- issue: 条件句是否断言未受割礼者已经完全履行律法
  choice: 保留“若……难道不……”的条件反问结构
  alternative: 改写为直接断言未受割礼者确实遵守律法
  rationale: ἐὰν 加虚拟语气提出条件，原文在本节并未直接判定这一条件是否或如何实现；译文不提前化解保罗论证中的张力。
- issue: 未受割礼者被算作受割礼的含义
  choice: 保留“算作受了割礼”的身份性表述
  alternative: 解释为已经得救、成为犹太人或获得某种特定教派定义的地位
  rationale: 本节只说其未受割礼被算为割礼；不把这一表述扩展为原文未明确说明的完整救恩论或群体身份结论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“未受割礼的人”明确所指，“遵守律法的要求”避免生硬术语；反问句保留原文预期肯定回答的力度。
