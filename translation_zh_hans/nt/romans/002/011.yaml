  source_fidelity: “偏待人的事”大致表达了 προσωπολημψία 所指的按人区别对待，但将抽象名词说成“……的事”会轻微地把重点移到具体事件上。译为“上帝不偏待人”准确传达本句关于上帝不按人的身份或外在条件区别对待的断言；“因为”也保留 γάρ 对上文的说明作用。
  naturalness: “在上帝那里没有偏待人的事”虽可理解，却不符合现代汉语最自然、凝练的表达。“因为上帝不偏待人”庄重、清楚，并适合本段审判与报应的语境。
  terminology: “上帝”与上下文及草稿一致。“偏待人”是现代汉语中表达神不按人分别对待的稳妥用语；脚注以“不偏心”提供较口语化的词汇替代，避免把“偏心的事”这一不够自然的名词短语作为替代译法。
  issues:
