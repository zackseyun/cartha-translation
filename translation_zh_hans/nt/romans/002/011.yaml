  yaml_path: translation/nt/romans/002/011.yaml
  text: For there is no partiality with God[a].
translation:
  language: zh_hans
  text: 因为上帝不偏待人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为上帝不偏心。”
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: 因为
  rationale: 承接上文并说明其根据；“因为”在现代汉语中自然地保留了解释和论证功能。
- source_word: προσωπολημψία
  choice: 偏待人的事
  rationale: 该词指因身份、地位或外在条件而区别对待；“偏待人的事”兼顾道德与审判语境，也保留名词性表达。
- source_word: παρὰ τῷ θεῷ
  choice: 在上帝那里
  rationale: παρά与与格在此表示在上帝面前或就上帝而言；“在上帝那里”既贴近原文关系结构，又是自然的现代汉语。
- source_word: οὐ γάρ ἐστιν ... παρὰ τῷ θεῷ
  choice: 因为在上帝那里没有偏待人的事
  rationale: 保留希腊文的存在句式，没有改写为“上帝不偏待人”，从而较忠实地呈现原文结构，同时保持清楚流畅。
theological_decisions:
- issue: 上帝不偏待人的表述方式
  choice: 将本句译为关于上帝的一般性陈述：“在上帝那里没有偏待人的事。”
  alternative: 动态译为“上帝不偏待人。”
  rationale: 两种译法表达的核心真理相同；所选译法更直接保留原文的存在句式，避免把原文没有明说的动作形式加入正文。
translation_notes:
  register: 采用庄重而通俗的现代标准汉语。“偏待人的事”准确且易懂；正文中的[a]与脚注标记相对应。
