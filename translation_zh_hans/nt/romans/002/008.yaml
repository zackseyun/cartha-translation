id: ROM.2.8
reference: Romans 2:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: τοῖς δὲ ἐξ ἐριθείας καὶ ⸀ἀπειθοῦσι τῇ ἀληθείᾳ πειθομένοις δὲ τῇ ἀδικίᾳ ⸂ὀργὴ καὶ θυμός⸃,
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/008.yaml
  text: 'But for those who are self-seeking and disobey the truth[b][a], but obey unrighteousness: wrath and fury.'
translation:
  language: zh_hans
  text: 但对那些出于私心、不顺从真理，反倒顺从不义的人，却有震怒和烈怒。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξ ἐριθείας
  choice: 出于私心
  rationale: ἐκ加属格表示行为的动机或根源；“出于私心”自然简洁，并保留自利、争竞性的意味。
- source_word: ἀπειθοῦσι τῇ ἀληθείᾳ
  choice: 不顺从真理
  rationale: ἀπειθέω在此强调意志和行为上的不服从，不宜仅译作“不相信”；“不顺从”也与下句“顺从”形成对应。
- source_word: πειθομένοις δὲ τῇ ἀδικίᾳ
  choice: 反倒顺从不义
  rationale: πειθομένοις与前面的ἀπειθοῦσι构成鲜明对照；“反倒”表达δέ在此处的转折，“顺从”保留其效忠、听从的含义。
- source_word: ἀδικίᾳ
  choice: 不义
  rationale: “不义”既可涵盖不公，也保留保罗语境中与真理和神的审判相对的广泛道德含义。
- source_word: ὀργὴ
  choice: 震怒
  rationale: “震怒”较普通的“愤怒”更能体现此处神圣审判的庄严力度。
- source_word: θυμός
  choice: 烈怒
  rationale: 与“震怒”并列时，“烈怒”体现强烈、迸发的怒气，同时保持庄重自然。
- source_word: implicit verbal ellipsis
  choice: 却有
  rationale: 希腊文此处省略谓语，中文若完全照搬会显得残缺；补出最少量的“却有”，使句子自然，并不额外规定临到的方式或时间。
theological_decisions:
- issue: 审判语境中ἀδικία的译法
  choice: 不义
  alternative: 不公
  rationale: 本节所指不限于社会层面的不公，也包括人在神面前与真理相背的道德状态；“不义”保留δικ-词族的神学张力，而“不公”较为狭窄。
- issue: ὀργή与θυμός并列时是否区分含义
  choice: 震怒和烈怒
  alternative: 愤怒和忿怒
  rationale: 原文使用两个近义词并列加强语气；译文保留两个不同词语，不将其合并，也不强行赋予过细的教义性区别。
translation_notes:
  register: 采用现代、庄重且易懂的书面普通话。“出于私心”避免生硬直译；“不顺从／顺从”保留原文的词义对照；末尾补出最低限度的谓语以符合现代汉语表达。
