id: ROM.2.29
reference: Romans 2:29
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἀλλ’ ὁ ἐν τῷ κρυπτῷ Ἰουδαῖος, καὶ περιτομὴ καρδίας ἐν πνεύματι οὐ γράμματι, οὗ ὁ ἔπαινος οὐκ ἐξ ἀνθρώπων ἀλλ’ ἐκ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/029.yaml
  text: But the Jew is one inwardly[a], and circumcision is of the heart—by the Spirit, not by the letter—whose praise is not from people but from God.
translation:
  language: zh_hans
  text: 惟有在内在上作犹太人的；割礼也是心里的，是在灵里，不在字句上。这样的人所受的称赞，不是来自人，而是来自上帝。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τῷ κρυπτῷ
  choice: 里面
  rationale: 与上文外表可见的身份形成对比，表达内在、隐而不见的实质；“里面”在现代汉语中自然，也不误导为秘密行事。
- source_word: Ἰουδαῖος
  choice: 犹太人
  rationale: 本段讨论的是宗教与圣约身份，而非单纯地理归属，因此译作“犹太人”最合适。
- source_word: περιτομὴ καρδίας
  choice: 割礼也是心里的
  rationale: 保留“割礼”与“心”的比喻，同时用自然汉语表明保罗所说的是内在的割礼。
- source_word: ἐν πνεύματι
  choice: 借着圣灵
  rationale: 结合保罗常见的“圣灵—字句”对照，理解为圣灵所成就的工作；介词“借着”自然表达方式或施行者。由于πνεῦμα在此仍有解释空间，脚注保留“在灵里”的译法。
- source_word: οὐ γράμματι
  choice: 不是凭着字句
  rationale: “字句”保留γράμμα的词义及保罗式对照；“凭着”与前面的“借着”构成流畅对比，而不扩写成特定法典。
- source_word: οὗ ὁ ἔπαινος
  choice: 这样的人所受的称赞
  rationale: 明确关系代词所指的是里面作犹太人的人，避免汉语中“其称赞”的指代含混。
- source_word: ἐξ ἀνθρώπων
  choice: 来自人
  rationale: ἀνθρώπων为泛指人类，译作“人”简洁自然，不限于男性。
- source_word: ἐκ τοῦ θεοῦ
  choice: 来自上帝
  rationale: 直接表达称赞的来源，不增加原文没有的限定。
theological_decisions:
- issue: πνεύματι是指圣灵、人的灵，还是一般的内在属灵实质
  choice: 主文译作“借着圣灵”
  alternative: “在灵里”，可指人的内在之灵或属灵实质
  rationale: 保罗将πνεῦμα与γράμμα相对时，通常以圣灵为更可能的所指；但原文没有冠词，语法本身未完全排除其他理解，因此用脚注保留真实歧义。
- issue: “里面作犹太人的”是否等于否定外在族裔身份
  choice: 译作“才是真正的犹太人”，表达本段所强调的内在真实
  alternative: 较直译为“惟有在里面的才是犹太人”
  rationale: “真正的”使省略的谓语在汉语中清楚，但不把经文扩展为对族裔身份的系统性否定；此处重点是上帝认可的内在实质与外在标志的对照。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“惟有……才……”突出ἀλλά引出的对照；“这样的人”使关系从句在汉语中指代清晰。保留“割礼”“心”“字句”等核心意象和保罗式张力。
