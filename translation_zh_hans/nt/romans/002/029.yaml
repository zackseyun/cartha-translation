  terminology: “犹太人”“割礼”“心”“灵”“字句”“上帝”均恰当。将πνεύματι主文译为未大写、未限定的“灵”，并在脚注列出“圣灵”“人的灵”“属灵实质”的可能性，最能避免预断。
