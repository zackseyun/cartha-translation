  to: 惟有在内在上作犹太人的；割礼也是心里的，是在灵里，不在字句上。这样的人所受的称赞，不是来自人，而是来自上帝。
  rationale: 修订以“在灵里，不在字句上”对应ἐν πνεύματι οὐ γράμματι，避免将有争议的πνεύματι在主文中限定为圣灵，同时在脚注提供“借着圣灵”这一重要解释。将“真正的”改为“在内在上作犹太人的”，保留原文内在／外在的对照而减少解释性增补。
