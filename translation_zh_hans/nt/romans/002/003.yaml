id: ROM.2.3
reference: Romans 2:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: λογίζῃ δὲ τοῦτο, ὦ ἄνθρωπε ὁ κρίνων τοὺς τὰ τοιαῦτα πράσσοντας καὶ ποιῶν αὐτά, ὅτι σὺ ἐκφεύξῃ τὸ κρίμα τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/003.yaml
  text: But do you suppose this[a], O man—you who judge those who practice such things and yet do them yourself—that you will escape the judgment of God?
translation:
  language: zh_hans
  text: 可是，人哪[a]，你评判做这类事的人，自己却也做这些事；你以为自己能逃脱上帝的审判吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊原文为单数呼格，直译为“人哪”，所称呼的是一个具有代表性的人。
    reason: cultural_note
lexical_decisions:
- source_word: λογίζῃ
  choice: 以为
  rationale: 这里指人在心里作出判断或设想；“以为”自然地体现反问中受到质疑的主观判断。
- source_word: ἄνθρωπε
  choice: 人哪
  rationale: 保留单数呼格和保罗直接责问代表性人物的论辩语气；“人”在现代汉语中可泛指任何人。
- source_word: κρίνων
  choice: 评判
  rationale: 表达对他人行为作道德判断的意思，又不把词义加强为必然的“定罪”。
- source_word: πράσσοντας
  choice: 做
  rationale: 指持续实行这类事情；汉语用“做这类事”简明自然。
- source_word: ποιῶν
  choice: 做
  rationale: 与前面的 πράσσω 在此语境中意义高度重叠；不刻意制造原文未必强调的语义差别。
- source_word: αὐτά
  choice: 这些事
  rationale: 明确回指前面的“这类事”，保持责问的清晰度。
- source_word: ἐκφεύξῃ
  choice: 能逃脱
  rationale: 准确表达躲过或避开将临审判的意思；“能”符合汉语反问表达。
- source_word: κρίμα
  choice: 审判
  rationale: 此处广义指上帝司法性的裁断，不局限于判词或刑罚。
theological_decisions:
- issue: κρίμα 所指范围
  choice: 译为“审判”
  alternative: “判决”或“定罪”
  rationale: 原词在此可涵盖上帝的司法裁断；译作“审判”保留其范围，不预先将它缩窄为宣判结果或定罪。
translation_notes:
  register: 采用现代、庄重而直接的论辩语体。“人哪”保留呼格色彩；全句用分号理清指控与反问的关系，同时保持原文的迫切责问语气。
