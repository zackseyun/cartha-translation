  text: οὐ γὰρ οἱ ἀκροαταὶ ⸀νόμου δίκαιοι παρὰ ⸀τῷ θεῷ, ἀλλ’ οἱ ποιηταὶ ⸁νόμου δικαιωθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/013.yaml
  text: For it is not the hearers of the law who are righteous before God[a], but the doers of the law who will be justified.
translation:
  language: zh_hans
  text: 因为，在神面前，听律法的人并不为义；惟有遵行律法的人将被称义。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“将被宣告为义”；也可译“将被证明为义”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκροαταὶ
  choice: 听律法的人
  rationale: “听……的人”自然表达名词 ἀκροαταί，并与后文“遵行……的人”形成鲜明对照，突出仅仅听见与实际遵行的区别。
- source_word: νόμου
  choice: 律法
  rationale: 希腊文虽未带冠词，但上下文所谈的是神的律法；现代汉语无需用冠词标明限定性，译作“律法”既自然也不增加原文没有的解释。
- source_word: δίκαιοι
  choice: 为义
  rationale: “为义”保留 δίκαιοι 的形容词性质和保罗在本段中的义／称义词汇联系，也表达人在神面前被评定为义的地位。
- source_word: παρὰ τῷ θεῷ
  choice: 在神面前
  rationale: 准确表达人在神的判断与评定之下所处的地位，语言简洁庄重。
- source_word: ποιηταὶ
  choice: 遵行律法的人
  rationale: 直译“行律法的人”在现代汉语中略显生硬；“遵行”自然表达实际照律法而行，同时保留与“听律法的人”的对照。
- source_word: δικαιωθήσονται
  choice: 将被称义
  rationale: 保留未来时和被动语态，并维持 δικαιόω 在《罗马书》中的重要术语联系；不在正文中把它收窄为某一种解释。
theological_decisions:
- issue: 如何翻译 δικαιωθήσονται，既保留保罗的称义术语，又不预先裁定其法庭性语义的具体侧重
  choice: 将被称义
  alternative: 将被宣告为义；将被证明为义
  rationale: “将被称义”既保留原文的未来被动形式及其神学分量，也容许语境决定其侧重；注释列出“宣告为义”和“证明为义”，呈现该词可能具有的法庭宣告或伸张、证实含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“在神面前为义的，不是……而是……”贴近希腊文论证结构；分号后的“他们”使较长的中文句子更清楚，同时不改变“遵行律法的人”是 δικαιωθήσονται 主语这一关系。
