id: ROM.2.4
reference: Romans 2:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἢ τοῦ πλούτου τῆς χρηστότητος αὐτοῦ καὶ τῆς ἀνοχῆς καὶ τῆς μακροθυμίας καταφρονεῖς, ἀγνοῶν ὅτι τὸ χρηστὸν τοῦ θεοῦ εἰς μετάνοιάν σε ἄγει;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/004.yaml
  text: Or do you despise the riches of his kindness and forbearance and patience[a], not knowing that God's kindness is leading you to repentance?
translation:
  language: zh_hans
  text: 还是你藐视他恩慈、宽容和忍耐的丰盛[a]，不知道神的恩慈正引导你悔改吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恩慈”两处也可译作“良善”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πλούτου
  choice: 丰盛
  rationale: 保留原文以“财富”表达神这些品格极其丰富的比喻，同时避免在现代汉语中生硬地直译为“财富”。
- source_word: χρηστότητος / τὸ χρηστόν
  choice: 恩慈
  rationale: 两处采用同一译词，以保留词汇呼应；“恩慈”既表达良善，也突出神待人的仁厚。
- source_word: ἀνοχῆς
  choice: 宽容
  rationale: 表达神暂缓施行审判、容忍罪人的意思，又不把它误解为认可罪恶。
- source_word: μακροθυμίας
  choice: 忍耐
  rationale: 自然、庄重地表达长久克制、不轻易发怒的含义。
- source_word: καταφρονεῖς
  choice: 藐视
  rationale: 保留原文责问中强烈的贬抑与轻看的语气。
- source_word: ἀγνοῶν
  choice: 不知道
  rationale: 忠实表达认知上的“不知”，不擅自强化为故意无视。
- source_word: εἰς μετάνοιάν
  choice: 悔改
  rationale: “悔改”在此准确表达转离罪、归向神，不将其缩减为单纯改变想法。
- source_word: ἄγει
  choice: 正引导
  rationale: 体现现在时的持续意味，也保留动作朝向悔改而未明说必然达到结果。
theological_decisions:
- issue: χρηστότης / χρηστόν 应译为“恩慈”还是较宽泛的“良善”
  choice: 两处均译为“恩慈”
  alternative: 两处均译为“良善”
  rationale: 上下文强调神在暂缓审判中仁厚地对待罪人；“恩慈”更能体现这种关系性含义，同时用脚注保留“良善”的可能。
- issue: 神的恩慈“引导”人悔改是否表示必然产生悔改
  choice: 正引导你悔改
  alternative: 使你悔改
  rationale: 原文ἄγει表达带领、引向；译作“引导”保留方向性，不额外断定受引导者必然悔改。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“恩慈、宽容和忍耐的丰盛”保留三个并列属格共同受“丰盛”支配的结构；问句延续上文的反诘语气。
