id: ROM.2.22
reference: Romans 2:22
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ λέγων μὴ μοιχεύειν μοιχεύεις; ὁ βδελυσσόμενος τὰ εἴδωλα ἱεροσυλεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/022.yaml
  text: You who say[a], “Do not commit adultery,” do you commit adultery? You who detest idols, do you rob temples?
translation:
  language: zh_hans
  text: 你这说“不可奸淫”的，自己倒奸淫吗？你这憎恶偶像的，自己倒盗取庙中财物吗？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“自己倒亵渎圣物吗？”
    reason: ἱεροσυλέω既可具体指盗取庙宇财物，也可较广泛地指亵渎神圣之物；正文采用具体含义，脚注保留较广的可能。
lexical_decisions:
- source_word: ὁ λέγων
  choice: 你这说……的
  rationale: 定冠词加现在分词在此作名词用，并直接指向保罗所质问的代表性人物；这一表达既保留直面听者的语气，也符合现代汉语。
- source_word: μὴ μοιχεύειν
  choice: 不可奸淫
  rationale: μή加不定式表达所说禁令的内容；“不可奸淫”准确、凝练，并自然呼应十诫措辞。
- source_word: μοιχεύεις
  choice: 自己倒奸淫吗
  rationale: 现在时直陈语气用于反问，具有一般性、揭露性的力量；“自己倒”凸显言教与行为之间的反差，但不改变命题内容。
- source_word: ὁ βδελυσσόμενος
  choice: 你这憎恶……的
  rationale: βδελύσσομαι表示强烈厌恶；“憎恶”庄重而通俗，保留原文力度。
- source_word: τὰ εἴδωλα
  choice: 偶像
  rationale: 此处指宗教崇拜中的神像或偶像；“偶像”是现代汉语中明确且约定俗成的对应词。
- source_word: ἱεροσυλεῖς
  choice: 盗取庙中财物
  rationale: ἱεροσυλέω的具体含义是劫掠或盗取庙宇及其财物；此译保留与前文“偶像”相连的具体历史图景，较“偷庙”更自然明确。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的反问句式；两句以“你这……的，自己倒……吗”形成平行结构，体现保罗质问式论辩的力度。
