  text: ⸂Εἰ δὲ⸃ σὺ Ἰουδαῖος ἐπονομάζῃ καὶ ἐπαναπαύῃ ⸀νόμῳ καὶ καυχᾶσαι ἐν θεῷ
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/017.yaml
  text: But if you call yourself a Jew and rely on the law and boast in God[b][a],
translation:
  language: zh_hans
  text: 但你若自称是犹太人[a]，倚靠律法[b]，并以神为夸口，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以犹太人之名自居”或“被称为犹太人”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“在律法上安歇”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ δὲ
  choice: 但你若
  rationale: 保留εἰ的条件意味和δέ在上下文中轻微的转折、承接作用；“但……若”适合保罗此处论辩的推进。
- source_word: Ἰουδαῖος
  choice: 犹太人
  rationale: 此处主要指民族与宗教身份，而非单纯地理归属；“犹太人”符合《罗马书》的语境。
- source_word: ἐπονομάζῃ
  choice: 自称为
  rationale: 中间语态可自然表达主体以此名称自居；“自称为”既通顺，也保留保罗直接质询对方身份主张的修辞力度。
- source_word: ἐπαναπαύῃ
  choice: 倚靠
  rationale: 这里不是指身体上的安歇，而是以律法为信赖和把握；“倚靠”在现代中文中自然清楚。
- source_word: νόμῳ
  choice: 律法
  rationale: 在此语境中指以摩西律法为核心的、广为人知的圣约规范；中文无需另加冠词。
- source_word: καυχᾶσαι
  choice: 以……为夸耀
  rationale: 保留保罗常用的“夸耀”概念及其可由语境决定正面或负面色彩，避免提前解释为单纯的骄傲。
- source_word: ἐν θεῷ
  choice: 以神为夸耀
  rationale: 用中文“以……为夸耀”的结构自然表达ἐν与καυχᾶσαι的搭配，同时保留以神为夸耀对象或根据的语义空间。
theological_decisions:
- issue: “以神为夸耀”在此处是正面还是讽刺性的负面表述
  choice: 不在正文中明定其道德评价，译作“以神为夸耀”
  alternative: 因神而自豪／拿神来夸口
  rationale: καυχᾶσαι本身可随语境带正面或负面意味；本节开启的论证带批判锋芒，但不宜在译文中提前消除这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“倚靠律法”比直译“安歇在律法上”自然，同时以脚注保留原词形象；句末逗号表明本节句法尚未完结，继续进入后文的一连串条件陈述。
