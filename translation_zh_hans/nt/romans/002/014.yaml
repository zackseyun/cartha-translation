  rationale: 以“因为”对应γάρ；以“外邦人”准确表达本段中ἔθνη与犹太人的对照；以“凭着本性”保留φύσει的解释开放性；以自然的“实行律法所要求的事”表达“律法的事”，并在脚注保留较贴近原文字面的译法。末句保留“律法”的表语比喻，未添加自主立法的解释。
