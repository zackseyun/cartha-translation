id: ROM.2.14
reference: Romans 2:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὅταν γὰρ ἔθνη τὰ μὴ νόμον ἔχοντα φύσει τὰ τοῦ νόμου ⸀ποιῶσιν, οὗτοι νόμον μὴ ἔχοντες ἑαυτοῖς εἰσιν νόμος·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/014.yaml
  text: For whenever Gentiles[a], who do not have the law, do by nature the things of the law, these, though not having the law[c][b], are a law to themselves.
translation:
  language: zh_hans
  text: 因为，每逢外邦人[a]没有律法，却凭着本性[b]实行律法所要求的事[c]，这些人虽然没有律法，对他们自己却成为律法。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“列国的人”。
    reason: lexical_alternative
  - marker: b
    text: 或译“自然而然地”。
    reason: lexical_alternative
  - marker: c
    text: 直译“实行律法的事”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθνη
  choice: 外族人
  rationale: 这里与拥有摩西律法的犹太人形成对照。“外族人”能表达族群与宗教层面的含义，又比传统术语“外邦人”更易为现代普通读者理解；脚注保留“列国的人”这一较宽泛的可能译法。
- source_word: νόμον / νόμου / νόμος
  choice: 律法
  rationale: 上下文主要指摩西律法，而末句的 νόμος 作表语，具有比喻意味。各处统一译作“律法”，以保留保罗反复使用同一词所形成的修辞和概念联系。
- source_word: φύσει
  choice: 按本性
  rationale: 这是 φύσει 较直接而开放的译法，不把它过早限定为本能、天生的道德意识或习俗；脚注列出更偏动态的译法。
- source_word: τὰ τοῦ νόμου ποιῶσιν
  choice: 行律法上的事
  rationale: 尽量保留原文“律法的事”这一表达及其宽度，同时使用现代汉语可理解的结构；脚注提供更顺畅但解释性稍强的译法。
- source_word: ἑαυτοῖς εἰσιν νόμος
  choice: 对自己来说却就是律法
  rationale: 明确表达反身与格“对他们自己而言”的关系，并保留“就是律法”的表语结构，避免把这句话强化成他们自主制定律法。
theological_decisions:
- issue: φύσει 与道德知识、良知之间的具体关系
  choice: 正文译作“按本性”，不说明这是天生的道德意识、本能行为还是自然状态。
  alternative: 译作“本能地”或“自然而然地”。
  rationale: 单凭 φύσει 不能确定保罗在此采取哪一种更具体的神学解释；采用较宽的表达可保留经文本身的张力。
- issue: “对自己来说就是律法”是否表示自主立法
  choice: 保留原文的表语比喻，不增添“为自己制定律法”等解释。
  alternative: 译作“自己就是自己的律法”。
  rationale: 后者虽简洁熟悉，却较容易让现代读者理解为个人自主立法；当前译法更贴近反身与格，也不预先解决保罗的论证。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“其实”承接 γάρ 的解释语气；“每逢”体现 ὅταν 的反复或一般情形。句中三次保留“律法”，使原文的重复与末句转折清楚可见。
