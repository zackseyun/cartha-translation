  text: τὸ γὰρ ὄνομα τοῦ θεοῦ δι’ ὑμᾶς βλασφημεῖται ἐν τοῖς ἔθνεσιν, καθὼς γέγραπται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/024.yaml
  text: For the name of God is blasphemed among the Gentiles because of you[b][a], just as it is written.
translation:
  language: zh_hans
  text: 因为经上记着：[b]“上帝的名因你们的缘故，在外邦人中[a]受到亵渎。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “外邦人”或译“列国”。
    reason: lexical_alternative
  - marker: b
    text: 保罗在此呼应经文，尤其是《以赛亚书》52:5，也与《以西结书》36:20—23的主题相近。
    reason: cross_reference
lexical_decisions:
- source_word: γὰρ
  choice: 因为
  rationale: 承接并说明前文责备的根据；现代汉语中“因为”能自然保留其解释性逻辑关系。
- source_word: τὸ ὄνομα τοῦ θεοῦ
  choice: 上帝的名
  rationale: 按原文直译“上帝的名”，不将其所包含的声誉意味直接改写进正文。
- source_word: δι’ ὑμᾶς
  choice: 因你们的缘故
  rationale: διά加宾格在这里表示原因，直接指出听众是外族人亵渎上帝之名的缘由。
- source_word: βλασφημεῖται
  choice: 受到亵渎
  rationale: 保留现在时被动语态和强烈的宗教含义，指上帝的名遭受不敬、毁谤的言语攻击。
- source_word: ἐν τοῖς ἔθνεσιν
  choice: 在外族人中
  rationale: 在保罗针对犹太人与非犹太人的语境中，ἔθνη主要指犹太人以外的各族人；“外族人”比“列国”更清楚地表达群体身份，同时不使用较具教会术语色彩的“外邦人”。
- source_word: καθὼς γέγραπται
  choice: 正如经上所记
  rationale: 采用自然、庄重的汉语引经格式，保留καθώς所表达的对应关系和完成时被动的既定经文意味。
theological_decisions:
- issue: 本句是直接引文还是概括性的经文回声
  choice: 以引号标示引文，同时在脚注说明主要经文背景
  alternative: 不加引号，仅视为经文主题的概括
  rationale: καθὼς γέγραπται明确引入经文依据，措辞尤其接近《以赛亚书》52:5；加引号符合汉语引经习惯，但不在正文中武断限定唯一出处。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“上帝的名”忠实保留圣经中的“名”这一表达；“受到亵渎”兼顾被动语态与严肃语气。脚注标记均置于正文相关句末。
