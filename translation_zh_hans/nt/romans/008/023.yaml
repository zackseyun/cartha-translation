  text: οὐ μόνον δέ, ἀλλὰ ⸂καὶ αὐτοὶ⸃ τὴν ἀπαρχὴν τοῦ πνεύματος ἔχοντες ⸂ἡμεῖς καὶ⸃ αὐτοὶ ἐν ἑαυτοῖς στενάζομεν, υἱοθεσίαν ἀπεκδεχόμενοι τὴν ἀπολύτρωσιν τοῦ σώματος ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/023.yaml
  text: And not only that[a], but we ourselves also, who have the firstfruits of the Spirit, even we ourselves groan within ourselves[c][b], eagerly awaiting adoption as sons—the redemption of our bodies.
translation:
  language: zh_hans
  text: 不但如此，我们这些有圣灵的初熟果子的人，自己也在心里叹息，热切等候被收纳为儿子[b]，就是我们的身体得蒙救赎[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “被收纳为儿子”指被接纳而得着儿子的身份和继承权；这里包括所有信徒，并不限于男性。也可译作“被收纳”。
    reason: lexical_alternative
  - marker: c
    text: 希腊文直译为“我们身体的救赎”；“身体”是单数，具有集合或分配的用法。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μόνον δέ, ἀλλὰ
  choice: 不但如此，就是
  rationale: 承接上文受造界的叹息，并保留原文递进、转折的结构。
- source_word: καὶ αὐτοὶ / ἡμεῖς καὶ αὐτοὶ
  choice: 我们这些……的人，自己也
  rationale: 以自然汉语体现原文反复出现的强调成分，突出信徒自身也同样叹息。
- source_word: τὴν ἀπαρχὴν τοῦ πνεύματος
  choice: 圣灵初熟的果子
  rationale: 保留ἀπαρχή的初熟果子意象；这一属格结构在中文中仍可容纳“圣灵所赐的初熟果子”与“圣灵自己作为初熟果子”的语义张力。
- source_word: ἐν ἑαυτοῖς στενάζομεν
  choice: 自己也在心里叹息
  rationale: 清楚表达叹息发生于内在，并保持与上下文受造界“叹息”的词语联系。
- source_word: ἀπεκδεχόμενοι
  choice: 热切等候
  rationale: 传达该复合动词所含的殷切期待意味。
- source_word: υἱοθεσίαν
  choice: 被收为儿子
  rationale: 既表达收纳进入家庭和法律身份的含义，也保留原词明确的儿子名分及继承意象。
- source_word: τὴν ἀπολύτρωσιν τοῦ σώματος ἡμῶν
  choice: 就是我们的身体得蒙救赎
  rationale: 将同位说明关系译明；“我们的身体”贴近希腊文集合性单数，同时在现代汉语中自然地涵盖每位信徒的身体。
theological_decisions:
- issue: υἱοθεσίαν既指收纳身份，也带有儿子及继承权的意象
  choice: 被收为儿子
  alternative: 被收纳为儿女；得着儿子的名分；被收养
  rationale: 原词含有“立为儿子”的成分；译文保留保罗时代与继承相关的法律—神学意象，并不将所指对象限于男性。脚注说明其包容范围，避免现代读者误解。
- issue: τοῦ πνεύματος的属格关系
  choice: 圣灵初熟的果子
  alternative: 圣灵作为初熟的果子；圣灵所赐初熟的果子
  rationale: 不在正文中排他性地判定是源属格还是同位关系，从而保留原文可能具有的双重理解。
- issue: “被收为儿子”与尚待身体救赎之间的末世张力
  choice: 热切等候被收为儿子，就是我们的身体得蒙救赎
  alternative: 热切等候儿子的名分，等候我们的身体得蒙救赎
  rationale: 按原文将所等候的儿子身份与身体得赎紧密相连，不把它改写为与信徒现今身份无关，也不擅自系统化“已经—尚未”的关系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“初熟的果子”“叹息”“救赎”等贯穿上下文及保罗论述的重要意象和术语；用“在心里”自然表达内在叹息。
