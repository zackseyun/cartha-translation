id: ROM.8.4
reference: Romans 8:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἵνα τὸ δικαίωμα τοῦ νόμου πληρωθῇ ἐν ἡμῖν τοῖς μὴ κατὰ σάρκα περιπατοῦσιν ἀλλὰ κατὰ πνεῦμα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/004.yaml
  text: so that the righteous requirement of the law might be fulfilled in us[c][b][a], who do not walk according to the flesh but according to the Spirit.
translation:
  language: zh_hans
  text: 好使律法的公义要求[a]得以在我们这些不按肉体[b]行事、却按圣灵[c]行事的人身上成全。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “公义要求”或译“要求”。
    reason: lexical_alternative
  - marker: b
    text: 这里的“肉体”不是单指身体，而是指堕落的人性，或背离上帝的生活取向；有些译本译作“罪性”。
    reason: lexical_alternative
  - marker: c
    text: 或译“灵”；按罗马书第八章的上下文，这里很可能是指圣灵。
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: 为要使
  rationale: 保留目的或预期结果的语气，并自然承接上一节的论述。
- source_word: τὸ δικαίωμα τοῦ νόμου
  choice: 律法公义的要求
  rationale: δικαίωμα 在此兼有法律上的正当性和道德要求之意；此译法避免把它缩窄为某一条条例。
- source_word: πληρωθῇ
  choice: 得以成全
  rationale: 保留不定过去时被动虚拟语气在目的从句中的被动和预期实现之意。
- source_word: ἐν ἡμῖν
  choice: 在我们……身上
  rationale: 直接保留 ἐν 的范围含义，不擅自加强为“由我们成全”。
- source_word: περιπατοῦσιν
  choice: 行事为人
  rationale: 以现代汉语常用表达传达“行走”作为生活方式的伦理隐喻。
- source_word: σάρκα
  choice: 肉体
  rationale: 保留保罗用语的广度，不在正文中直接解释为“罪性”或“犯罪本性”。
- source_word: πνεῦμα
  choice: 圣灵
  rationale: 罗马书第八章的上下文主要指向上帝的灵；脚注保留译作“灵”的可能。
- source_word: κατὰ σάρκα ... κατὰ πνεῦμα
  choice: 随从肉体……随从圣灵
  rationale: “随从”自然表达 κατά 所指的准则、取向或支配范围，同时保持两项对照。
theological_decisions:
- issue: πνεῦμα 是指人的灵还是圣灵
  choice: 圣灵
  alternative: 灵
  rationale: 罗马书第八章紧接的上下文反复强调圣灵的工作和领域，因此正文采用“圣灵”；但希腊词本身在孤立情况下仍可泛指“灵”，故在脚注注明。
- issue: ἐν ἡμῖν 是否表示由我们成全
  choice: 在我们身上得以成全
  alternative: 由我们成全；在我们中间成全
  rationale: 采用“在”可忠实保留原文介词，并避免把经文没有明说的人类施行主体引入正文。
- issue: σάρξ 在此处的神学含义
  choice: 肉体
  alternative: 堕落的人性；罪性
  rationale: 正文保留原词的隐喻张力，不将其等同于物质身体，也不以单一神学术语穷尽其含义；脚注说明其语境用法。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“行事为人”自然表达保罗以“行走”比喻生活方式的说法；将修饰“我们”的分词结构译为“我们这些……的人”，使句法关系清楚。
