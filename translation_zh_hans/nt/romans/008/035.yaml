id: ROM.8.35
reference: Romans 8:35
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: τίς ἡμᾶς χωρίσει ἀπὸ τῆς ἀγάπης τοῦ Χριστοῦ; θλῖψις ἢ στενοχωρία ἢ διωγμὸς ἢ λιμὸς ἢ γυμνότης ἢ κίνδυνος ἢ μάχαιρα;
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/035.yaml
  text: Who will separate us from the Messiah’s love? Will trouble or distress or persecution or famine or nakedness or danger or sword?[a]
translation:
  language: zh_hans
  text: 谁能使我们与弥赛亚的爱隔绝呢？难道是患难、困苦、迫害、饥荒、赤身露体、危险或刀剑吗？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们对弥赛亚的爱。”希腊语的属格可以这样理解，不过上下文更支持正文的译法。
    reason: alternative_reading
lexical_decisions:
- source_word: τίς
  choice: 谁
  rationale: 保留人称疑问代词及保罗反问的语气；后列诸般苦难也被拟人化地纳入此问。
- source_word: χωρίσει
  choice: 使……隔绝
  rationale: 准确表达将双方分开、断绝联系之意，也符合现代中文圣经语体。
- source_word: ἀγάπης
  choice: 爱
  rationale: 采用 ἀγάπη 在本项目中的常规译法。
- source_word: τοῦ Χριστοῦ
  choice: 弥赛亚的
  rationale: Χριστός 在此是称号，译作“弥赛亚”；属格在正文中按上下文理解为施事属格，即弥赛亚对我们的爱。
- source_word: θλῖψις
  choice: 患难
  rationale: 涵盖外在压迫与苦难，庄重而为现代读者熟悉。
- source_word: στενοχωρία
  choice: 困苦
  rationale: 表达受逼迫、陷入窘迫的处境，并与“患难”保持语义区别。
- source_word: διωγμός
  choice: 迫害
  rationale: 直接、准确地表达因敌意而遭追逼和伤害。
- source_word: λιμός
  choice: 饥荒
  rationale: 指严重的食物匮乏，不只是个人饥饿。
- source_word: γυμνότης
  choice: 赤身露体
  rationale: 保留原词直观意象，并可包含因贫困而缺衣的处境。
- source_word: κίνδυνος
  choice: 危险
  rationale: 现代、自然且准确。
- source_word: μάχαιρα
  choice: 刀剑
  rationale: 保留原文兵刃的具体意象及其所代表的致命暴力威胁。
theological_decisions:
- issue: τοῦ Χριστοῦ 的属格关系
  choice: 弥赛亚对我们的爱（正文作“弥赛亚的爱”）
  alternative: 我们对弥赛亚的爱
  rationale: 希腊语属格本身可容许主观属格或客观属格；罗马书8:31–39的上下文更支持弥赛亚爱信徒，因此正文采用此解，同时以脚注保留另一种语法可能。
translation_notes:
  register: 采用自然、庄重、易懂的现代标准汉语。以连续反问保持原文修辞力度；苦难清单使用简洁、节奏匀称的名词。
