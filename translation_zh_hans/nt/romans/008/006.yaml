  text: τὸ γὰρ φρόνημα τῆς σαρκὸς θάνατος, τὸ δὲ φρόνημα τοῦ πνεύματος ζωὴ καὶ εἰρήνη·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/006.yaml
  text: For the mindset of the flesh is death[b][a], but the mindset of the Spirit is life and peace.
translation:
  language: zh_hans
  text: 因为体贴肉体[a]就是死；体贴圣灵[b]却是生命和平安。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “肉体”也可理解为“罪性”。
    reason: lexical_alternative
  - marker: b
    text: 原文作“灵”；这里按上下文理解为“圣灵”。
    reason: alternative_reading
lexical_decisions:
- source_word: γὰρ
  choice: 因为
  rationale: 保留本句对上文论述的解释和因果承接作用，符合现代汉语表达。
- source_word: φρόνημα
  choice: 体贴
  rationale: “体贴”在保罗书信的汉语语境中可表达持续把心思放在某一对象上、受其支配的倾向；比单纯的“思想”更能体现定向和意向。
- source_word: σάρξ
  choice: 肉体
  rationale: 采用较贴近原词的译法，保留保罗用语的神学张力，不直接将其解释为“罪性”。
- source_word: θάνατος
  choice: 死
  rationale: 直接呈现原文简洁有力的判断，并与下文“生命”形成鲜明对照。
- source_word: πνεῦμα
  choice: 圣灵
  rationale: 罗马书第8章的上下文多次把肉体与上帝的灵相对照；译作“圣灵”明确表达这一语境判断。
- source_word: ζωή
  choice: 生命
  rationale: 自然、直接地对应原词，并保留与“死”的对称关系。
- source_word: εἰρήνη
  choice: 平安
  rationale: “平安”是圣经汉语中自然且含义宽广的对应词，既可涵盖与上帝和好，也可涵盖完整安宁的状态。
theological_decisions:
- issue: πνεῦμα在本节指圣灵还是人的灵
  choice: 圣灵
  alternative: 灵（可理解为人的灵或一般意义上的灵）
  rationale: 罗马书第8章紧邻上下文反复将肉体与作为赐生命者的上帝之灵相对，因此正文译作“圣灵”；同时以脚注保留原文在形式上未明说“圣”的事实。
- issue: σάρξ在本节应直译还是解释为罪性
  choice: 肉体
  alternative: 罪性
  rationale: “肉体”保留保罗的关键词及其多层含义，避免把所指范围过早限定为抽象的“罪性”；脚注提供解释性译法。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。句式保留原文“死”与“生命和平安”的紧凑对照；“体贴”表达φρόνημα所指的心思取向，而非一时的念头。所有脚注标记均置于与其解释对象相邻的位置。
