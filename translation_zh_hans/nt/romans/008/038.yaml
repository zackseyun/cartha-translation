  text: πέπεισμαι γὰρ ὅτι οὔτε θάνατος οὔτε ζωὴ οὔτε ἄγγελοι οὔτε ἀρχαὶ οὔτε ⸂ἐνεστῶτα οὔτε μέλλοντα οὔτε δυνάμεις⸃
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/038.yaml
  text: For I am convinced that neither death nor life[a], nor angels nor rulers, nor things present nor things to come, nor powers,
translation:
  language: zh_hans
  text: 因为我确信，无论是死亡还是生命，无论是天使还是掌权者[a]，无论是现今的事还是将来的事，无论是权势，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “掌权者”也可译作“统治者”或“执政者”；这里可能指宇宙性或属灵的掌权势力。
    reason: lexical_alternative
lexical_decisions:
- source_word: πέπεισμαι
  choice: 我确信
  rationale: 完成时带有现在效力，表达已经形成并持续至今的坚定确信；“我确信”自然、凝练，也保留这种确定状态。
- source_word: γὰρ
  choice: 因为
  rationale: 承接上文并说明理由；“因为”清楚保留解释性的连接作用。
- source_word: οὔτε … οὔτε
  choice: 无论是……还是……
  rationale: 本句的否定结论延续到下一节；用反复的“无论是……还是……”既维持列举节奏，也自然预示后文“都不能”的结论。
- source_word: θάνατος
  choice: 死亡
  rationale: 直接表达其通常含义，并与“生命”构成鲜明对举。
- source_word: ζωή
  choice: 生命
  rationale: 直接、自然，与“死亡”保持对应。
- source_word: ἄγγελοι
  choice: 天使
  rationale: 该词虽也可指一般使者，但上下文列举超越人力的存在与权势，因此这里以“天使”最为合适。
- source_word: ἀρχαὶ
  choice: 掌权者
  rationale: 该词可指统治者、掌权的存在或宇宙性权势；“掌权者”现代易懂，并保留其可能具有属灵或宇宙层面的含义。
- source_word: ἐνεστῶτα
  choice: 现今的事
  rationale: 此处为名词化用法，泛指当前存在或发生的一切现实；“现今的事”简洁自然。
- source_word: μέλλοντα
  choice: 将来的事
  rationale: 此处为名词化用法，泛指将要发生或出现的一切，与“现今的事”形成平行对照。
- source_word: δυνάμεις
  choice: 权能
  rationale: “权能”可涵盖有位格的强大势力和非位格的力量，不将原文限定为某一类属灵存在。
theological_decisions:
- issue: ἀρχαὶ 与 δυνάμεις 是否应译成特定类别的属灵存在
  choice: 正文采用较宽泛的“掌权者”和“权能”
  alternative: 译作“执政的”和“有能的”，或把两者明确译为某类属灵权势
  rationale: 上下文很可能包含宇宙性或属灵权势，但原词仍有一定语义宽度。译文不将其固定为某一神学体系中的专门等级，并使“权能”保留有位格与非位格两种理解的可能。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。反复使用“无论是……还是……”来重现原文层层列举的节奏，并因句意延续至下一节而保留句末逗号。脚注标记置于其实际说明的“掌权者”之后。
