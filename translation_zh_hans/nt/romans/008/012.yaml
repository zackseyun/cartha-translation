  text: Ἄρα οὖν, ἀδελφοί, ὀφειλέται ἐσμέν, οὐ τῇ σαρκὶ τοῦ κατὰ σάρκα ζῆν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/012.yaml
  text: So then[a], brothers, we are debtors—not to the flesh[b], to live according to the flesh.
translation:
  language: zh_hans
  text: 因此，弟兄们[a]，我们是负债的；但不是向肉体负债，以致要按着肉体而活[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“弟兄姊妹们”；希腊文直译为“弟兄们”，在这里是对整个信徒群体的称呼。
    reason: lexical_alternative
  - marker: b
    text: “肉体”在这里不是单指人的身体，而是指受罪影响、与圣灵相对的人性取向；也可译作“罪性”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄρα οὖν
  choice: 所以
  rationale: 两个推论性小词共同承接上文并引出结论；“所以”在现代汉语中自然、简洁地保留这一推论作用。
- source_word: ἀδελφοί
  choice: 弟兄们
  rationale: 保留希腊语阳性复数称呼的形式；在这里保罗面向整个信徒群体，其包容范围以脚注说明。
- source_word: ὀφειλέται ἐσμέν
  choice: 我们是欠债的
  rationale: 保留ὀφειλέται的债务比喻，同时上下文表明所说的是义务而非金钱债务。
- source_word: τῇ σαρκί
  choice: 欠肉体的债
  rationale: 汉语补出由“欠债”自然要求的“欠……的债”，使与格所指的债权对象清楚，同时保留保罗的“肉体”术语。
- source_word: τοῦ κατὰ σάρκα ζῆν
  choice: 去顺从肉体而活
  rationale: 表达带冠词不定式所说明的义务内容或结果；“顺从肉体而活”自然传达κατά的规范、支配意味，并避免将其误解为单纯按肉身方式生活。
theological_decisions:
- issue: 在保罗肉体与圣灵的对照中如何翻译σάρξ
  choice: 肉体
  alternative: 罪性
  rationale: 正文保留保罗反复使用的同一术语及其神学张力，不把意义完全限定为某一种解释；脚注说明此处并非单指身体。
- issue: ἀδελφοί是否在正文中显明包容性
  choice: 弟兄们
  alternative: 弟兄姊妹们
  rationale: 正文保留原文的语法形式，脚注说明该称呼在此指整个信徒群体，包括女性。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“欠债”延续原文比喻；第二分句补出“债”以符合汉语搭配。“去顺从肉体而活”保留原文不定式与“按着肉体”的逻辑关系，又使普通读者易于理解。
