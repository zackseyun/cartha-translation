  text: ὅσοι γὰρ πνεύματι θεοῦ ἄγονται, οὗτοι ⸂υἱοί εἰσιν θεοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/014.yaml
  text: For all who are led by the Spirit of God[a], these are sons of God.
translation:
  language: zh_hans
  text: 因为凡被上帝的灵引导的，都是上帝的儿子[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“上帝的儿女”。“儿子”保留了希腊原文的措辞，以及上下文中被收养和承受产业的含义；这里包括男性和女性。
    reason: 词义替代及性别涵盖说明
lexical_decisions:
- source_word: ὅσοι
  choice: 凡……的
  rationale: 以现代汉语自然表达复数关联结构所指的完整一类人，保留“所有这样的人”的普遍范围。
- source_word: γὰρ
  choice: 因为
  rationale: 承接上文，表达本句对前面论述的解释或论证作用。
- source_word: πνεύματι θεοῦ
  choice: 被上帝的灵
  rationale: 与被动动词“引导”搭配，将与格理解为施事或媒介；“上帝的灵”保留原文属格关系和保罗的措辞。
- source_word: ἄγονται
  choice: 引导
  rationale: 置于“被……引导”结构中，保留现在时被动态的持续性含义，同时避免生硬地译成“正在被引导”。
- source_word: οὗτοι
  choice: 都
  rationale: 汉语用“凡……的，都是……”这一对应结构自然体现原文指示代词的归结和强调作用。
- source_word: υἱοί
  choice: 儿子
  rationale: 原文明确使用阳性复数“儿子”；在罗马书第8章的语境中，这一用语也关联收养和承受产业，正文保留其措辞，脚注说明其涵盖意义。
- source_word: θεοῦ
  choice: 上帝的
  rationale: 两处均直接表达属格关系，并保留原文重复出现“上帝”的措辞。
theological_decisions:
- issue: υἱοί θεοῦ应译为“上帝的儿子”还是更具包容性的表达
  choice: 上帝的儿子
  alternative: 上帝的儿女
  rationale: 原文使用υἱοί（儿子），且上下文涉及被收养和承受产业；保留“儿子”可呈现保罗的用词及其法律—继承意涵。这里指凡被上帝的灵引导的人，并不限于男性，因此以脚注说明其涵盖范围。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“凡……的，都是……”清楚再现原文关联结构；“被上帝的灵引导”简洁保留被动态。正文用“儿子”呈现原文和上下文的继承意涵，脚注避免读者误解为仅指男性。
