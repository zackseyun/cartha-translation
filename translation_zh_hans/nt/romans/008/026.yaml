revisions:
- from: 同样，圣灵也在我们的软弱中帮助我们。因为我们不知道该祷告什么才合宜，但圣灵亲自用无法用言语表达的叹息[a]替我们祈求。
  to: 同样，圣灵也扶助我们的软弱。因为我们不知道该祷告什么才合宜，但圣灵亲自用无法用言语表达的叹息[a]替我们祈求。
  rationale: 修订仅处理两处：将“在我们的软弱中帮助我们”改为“扶助我们的软弱”，以更紧密对应 συναντιλαμβάνεται τῇ ἀσθενείᾳ ἡμῶν；并删除可能误导为完全无声的脚注替代译法。其余译文保留原有的语义开放性，尤其不判定叹息的经验主体。
