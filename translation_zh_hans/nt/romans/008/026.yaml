source:
  edition: SBLGNT
  text: Ὡσαύτως δὲ καὶ τὸ πνεῦμα συναντιλαμβάνεται ⸂τῇ ἀσθενείᾳ⸃ ἡμῶν· τὸ γὰρ τί ⸀προσευξώμεθα καθὸ δεῖ οὐκ οἴδαμεν, ἀλλὰ αὐτὸ τὸ πνεῦμα ⸀ὑπερεντυγχάνει στεναγμοῖς ἀλαλήτοις,
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/026.yaml
  text: Likewise[a], the Spirit also helps in our weakness. For we do not know what we should pray for as we ought, but the Spirit himself intercedes with inexpressible groanings[b],
translation:
  language: zh_hans
  text: 同样，圣灵也扶助我们的软弱。因为我们不知道该祷告什么才合宜，但圣灵亲自用无法用言语表达的叹息[a]替我们祈求。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “无法用言语表达的”也可译作“说不出来的”或“难以言说的”。原词可指不能化为话语，或不以话语表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡσαύτως δὲ καὶ
  choice: 同样，……也
  rationale: 承接上文并引出圣灵相应的工作；“同样……也”在现代汉语中简洁自然。
- source_word: συναντιλαμβάνεται
  choice: 在……中帮助我们
  rationale: 该词有共同承担、前来相助之意；译作“帮助我们”自然清楚，而介词短语保留帮助发生在软弱处境中的含义。
- source_word: τῇ ἀσθενείᾳ ἡμῶν
  choice: 我们的软弱
  rationale: 保留原文单数的集合性表达，不把含义缩窄为身体虚弱或某一种属灵缺陷。
- source_word: τὸ γὰρ τί προσευξώμεθα καθὸ δεῖ
  choice: 我们不知道该祷告什么才合宜
  rationale: 保留 τί 所指的祷告内容，并以“才合宜”表达 καθὸ δεῖ 的应当、适切之意，避免只译成祷告方式。
- source_word: αὐτὸ τὸ πνεῦμα
  choice: 圣灵亲自
  rationale: “亲自”传达原文强调结构及圣灵主动行事的意味，同时避免汉语代词造成不必要的性别说明。
- source_word: ὑπερεντυγχάνει
  choice: 替我们祈求
  rationale: 表达为他人代求、恳求的核心意义；“替我们”虽为语义补足，却是该动词在上下文中的自然汉语表达。
- source_word: στεναγμοῖς ἀλαλήτοις
  choice: 用无法用言语表达的叹息
  rationale: 既保留“叹息”，又让 ἀλαλήτοις 可能表示不能化为话语或不诉诸话语的含义保持开放；脚注列出其他可行译法。
theological_decisions:
- issue: πνεῦμα 为语法中性名词，但上下文描写圣灵主动帮助和代求
  choice: 圣灵亲自
  alternative: 圣灵自己／圣灵本身
  rationale: “亲自”忠实体现 αὐτό 的强调和主体行动，不依赖汉语性别代词，也不额外引入教派性表述。
- issue: στεναγμοῖς ἀλαλήτοις 是圣灵的叹息，还是圣灵借着信徒未成言语的叹息代求
  choice: 不明确指定叹息的经验主体，只按句法说圣灵“用……叹息”代求
  alternative: 圣灵借着我们的无声叹息代求
  rationale: 原文把该短语直接连于圣灵的代求，却未明说这些叹息是否由信徒发出；正文保留这种张力，不补入“我们的”。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“软弱”“合宜”“替我们祈求”均为普通读者易懂的表达；避免机械照搬希腊语序，也不把原文未说明的叹息主体或具体软弱类型写死。
