review_pass:
  verdict: revise
  source_fidelity: “在我们的软弱中帮助我们”基本可通，但 τῇ ἀσθενείᾳ ἡμῶν 是 συναντιλαμβάνεται 的直接关联对象，较准确地说是圣灵扶助／帮助“我们的软弱”，而不只是人在软弱处境中得到帮助。将其改为“扶助我们的软弱”可更好保留该动词共同承担、前来相助的力度。末句的“替我们祈求”与上下文及该复合动词的代求含义相符，未不当限定叹息的主体。
  naturalness: 修订后的句子在现代标准汉语中庄重、清晰且自然。“扶助我们的软弱”比“在……中帮助我们”更凝练，也更贴近原文结构。“无法用言语表达的叹息”自然可懂。
  terminology: “圣灵”“祷告”“合宜”“祈求”均符合通行的现代汉语圣经语域。“圣灵亲自”恰当传达 αὐτὸ τὸ πνεῦμα 的强调，而不引入汉语性别代词。脚注中的“无声的”不宜作为 ἀλαλήτοις 的直接替代，因为该词关乎不可言说、未化为言语，并不主要表示没有声音。
  issues:
  - severity: medium
    issue: “在我们的软弱中帮助我们”将“我们的软弱”处理为帮助发生的处境。
    rationale: 希腊文 συναντιλαμβάνεται 与 τῇ ἀσθενείᾳ ἡμῶν 相连，表达圣灵对我们的软弱给予扶助、共同承担；“扶助我们的软弱”更直接且保留动词较强的意味。
  - severity: medium
    issue: 脚注将“无声的”列作“无法用言语表达的”的可译替代。
    rationale: ἀλαλήτοις 的核心是不能说出、难以言说或不以言语表达；“无声”容易误指完全没有声音，与“叹息”的语义及原词重点均不完全相合。
