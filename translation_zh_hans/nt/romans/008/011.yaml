id: ROM.8.11
reference: Romans 8:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἰ δὲ τὸ πνεῦμα τοῦ ἐγείραντος ⸀τὸν Ἰησοῦν ἐκ νεκρῶν οἰκεῖ ἐν ὑμῖν, ὁ ἐγείρας ⸂ἐκ νεκρῶν Χριστὸν Ἰησοῦν⸃ ζῳοποιήσει καὶ τὰ θνητὰ σώματα ὑμῶν διὰ ⸂τὸ ἐνοικοῦν αὐτοῦ πνεῦμα⸃ ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/011.yaml
  text: And if the Spirit of the one who raised Jesus from the dead dwells in you[b][a], the one who raised Messiah Jesus from the dead will also give life to your mortal bodies through his Spirit dwelling in you.
translation:
  language: zh_hans
  text: 如果那使耶稣从死人中复活者的灵住在你们里面，那么那使弥赛亚耶稣[b]从死人中复活的，也必因他住在你们里面的灵，使你们必死的身体得着生命。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“借着他住在你们里面的灵。”
    reason: alternative_reading
  - marker: b
    text: 希腊文为“基督耶稣”；“基督”和“弥赛亚”都意为“受膏者”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα
  choice: 灵
  rationale: 两处都指保罗上下文中的圣灵；中文用“灵”既自然，也避免把原文未出现的“圣”字直接补入正文。
- source_word: ἐγείραντος / ἐγείρας
  choice: 使……复活
  rationale: 在死人复活的语境中，这是现代中文最清楚自然的表达，保留了施行复活行动的含义。
- source_word: ἐκ νεκρῶν
  choice: 从死人中
  rationale: 较贴近原文“从死者当中”的表达，同时在中文中仍然清楚地指向复活。
- source_word: οἰκεῖ / ἐνοικοῦν
  choice: 住在……里面
  rationale: 两处采用一致措辞，保留圣灵内住的空间意象，并符合现代中文习惯。
- source_word: Χριστὸν Ἰησοῦν
  choice: 弥赛亚耶稣
  rationale: Χριστός在这里仍有称号含义；译作“弥赛亚”可避免普通读者将“基督”误当作姓名的一部分。
- source_word: ζῳοποιήσει
  choice: 使……得着生命
  rationale: 保留将来时和赐予生命的主动意义，并与“必死的身体”形成清楚对照。
- source_word: θνητὰ σώματα
  choice: 必死的身体
  rationale: 直接表达身体受死亡辖制、终必死亡的性质，比“会死的身体”更庄重。
- source_word: διὰ τὸ ἐνοικοῦν αὐτοῦ πνεῦμα
  choice: 因他住在你们里面的灵
  rationale: 所给SBLGNT正文为διά加宾格结构，最自然地表达原因；因此正文采用“因”，并以脚注保留工具性读法。
theological_decisions:
- issue: 末句διά结构表示原因还是途径
  choice: 因他住在你们里面的灵
  alternative: 借着他住在你们里面的灵
  rationale: 所给正文的宾格结构支持原因义；但抄本读法及传统译法中存在工具义，故不在正文中混同二者，而以脚注保存另一可能。
- issue: Χριστός在此是称号还是已固化的名称成分
  choice: 弥赛亚耶稣
  alternative: 基督耶稣
  rationale: 原词仍可听出“受膏者”的称号意味；正文显明该称号，脚注提供中文教会熟悉的对应形式。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。条件句以“若……那么……”呈现长句结构；保留两次“从死人中复活”的重复，以维持原文的修辞呼应。未直接补出“神”，因为希腊文以“使……复活者”指称行动者。
