id: ROM.8.10
reference: Romans 8:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἰ δὲ Χριστὸς ἐν ὑμῖν, τὸ μὲν σῶμα νεκρὸν διὰ ἁμαρτίαν, τὸ δὲ πνεῦμα ζωὴ διὰ δικαιοσύνην.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/010.yaml
  text: But if the Messiah is in you[a], the body is dead because of sin[c][b], but the spirit is life because of righteousness.
translation:
  language: zh_hans
  text: 但如果弥赛亚在你们里面，身体固然因罪而死[b]，灵却因义而有生命[a][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“灵”也可译作“圣灵”。希腊词既可指上帝使其得生命之人的灵，也可指圣灵。
    reason: alternative_reading
  - marker: b
    text: 或译：“身体是必死的”或“身体受死亡辖制”。
    reason: lexical_alternative
  - marker: c
    text: “义”或译：“正义”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστὸς
  choice: 弥赛亚
  rationale: 保留 Χριστός 在此处的称号含义，而不只把它当作名字；“弥赛亚”是现代中文中通行且易懂的对应词。
- source_word: σῶμα
  choice: 身体
  rationale: σῶμα 通常指身体，不等同于 σάρξ（肉体）；“身体”也保留了与 πνεῦμα 的具体对照。
- source_word: νεκρὸν
  choice: 是死的
  rationale: 直译该形容词的强烈措辞，不在正文中先行弱化为“必死的”或“受死亡辖制的”。
- source_word: διὰ ἁμαρτίαν
  choice: 因罪
  rationale: διά 加宾格在这里表示原因；“因罪”简洁自然地保留因果关系。
- source_word: πνεῦμα
  choice: 灵
  rationale: 原词可理解为被上帝赐生命之人的灵，也可理解为圣灵；正文用不加限定的“灵”保留歧义。
- source_word: ζωὴ
  choice: 是生命
  rationale: ζωή 是名词“生命”，不是形容词“活的”；“是生命”保留保罗凝练而突出的名词表达。
- source_word: διὰ δικαιοσύνην
  choice: 因义
  rationale: 保留 διά 的原因含义，并以“义”表达保罗语境中的 δικαιοσύνη；“正义”列作脚注中的词义选择。
- source_word: μὲν … δὲ
  choice: 固然……却……
  rationale: 用自然的现代汉语呈现两个分句之间先承认、后转折的对照关系。
theological_decisions:
- issue: πνεῦμα 的所指
  choice: 灵
  alternative: 圣灵
  rationale: 上下文同时涉及信徒里面的灵与圣灵的内住工作；不加限定的“灵”保留原文可能指人的灵、也可能直接指圣灵的张力。
- issue: νεκρὸν 修饰 σῶμα 时的含义
  choice: 身体是死的
  alternative: 身体是必死的／身体受死亡辖制
  rationale: 保罗可能是在说身体因罪而具有必死性，但原文直接使用“死的”；正文保留这一鲜明说法，较弱的解释放入脚注。
- issue: δικαιοσύνη 的含义
  choice: 义
  alternative: 正义
  rationale: “义”能涵盖保罗语境中的神学与关系性含义，同时不排除“正义”这一词义层面。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“固然……却……”对应原文 μὲν … δὲ 的对照结构；保留“是死的”与“是生命”这组刻意不对称、富有张力的表达，不将其释义化。脚注标记置于各自所说明的词句之后，因此按正文语序出现为 [b]、[a]、[c]。
