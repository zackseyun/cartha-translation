  source_fidelity: 译文准确表达了ὁ ἐραυνῶν τὰς καρδίας、圣灵的φρόνημα，以及圣灵为圣徒代求。πνεῦμα译为“圣灵”完全符合紧邻的8:26语境。“照着神”虽贴近κατὰ θεὸν的字面形式，但在现代汉语中缺少可自然承载该介词短语的关系，容易造成理解停顿；译为“按着神的心意”是该短语在此语境中必要且常规的语义展开，并以脚注保留原文简洁措辞。
