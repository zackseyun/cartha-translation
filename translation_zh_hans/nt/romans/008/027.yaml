id: ROM.8.27
reference: Romans 8:27
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ δὲ ἐραυνῶν τὰς καρδίας οἶδεν τί τὸ φρόνημα τοῦ πνεύματος, ὅτι κατὰ θεὸν ἐντυγχάνει ὑπὲρ ἁγίων.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/027.yaml
  text: And he who searches hearts knows what the mindset of the Spirit is, because he intercedes for the saints according to God.
translation:
  language: zh_hans
  text: 那位鉴察人心的，知道圣灵的意念是什么，因为圣灵按着神的心意为圣徒代求[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“照着神。”此处通常理解为“按着神的心意”或“合乎神的旨意”。
    reason: 保留κατὰ θεὸν的紧凑字面表达，同时说明为使现代汉语自然通顺而作的语境性展开。
lexical_decisions:
- source_word: ἐραυνῶν
  choice: 鉴察
  rationale: “鉴察”既保留主动、深入察看的含义，也符合“鉴察人心”这一庄重而自然的现代中文表达。
- source_word: τὰς καρδίας
  choice: 人心
  rationale: 以“人心”保留καρδία的圣经性隐喻，并在中文中自然表达人的内在思想、意愿与情感。
- source_word: τί τὸ φρόνημα
  choice: 意念是什么
  rationale: φρόνημα在本章指思想取向、心思或意向；“意念”比单纯的“思想”更能涵盖其意向性，又不把含义限定为某一种具体意志。
- source_word: τοῦ πνεύματος
  choice: 圣灵的
  rationale: 上下文明确以πνεῦμα指圣灵；中文明确译作“圣灵”，避免被理解为人的灵。
- source_word: ἐντυγχάνει
  choice: 代求
  rationale: 此处为祷告中替他人祈求的意思；“代求”准确、简洁，并与前一节圣灵的活动相衔接。
- source_word: ὑπὲρ ἁγίων
  choice: 为圣徒
  rationale: “为”自然表达ὑπέρ加属格的受益或代表关系；“圣徒”保留保罗对属神群体的惯用称呼。
- source_word: κατὰ θεὸν
  choice: 照着神
  rationale: 保留希腊文紧凑而略有省略的表达，不在正文中擅自补出“旨意”或“心意”；脚注说明常见的释义。
theological_decisions:
- issue: 是否将κατὰ θεὸν明确译为“照着神的旨意”
  choice: 正文译作“照着神”
  alternative: 照着神的旨意
  rationale: 该短语在语境中很可能表示符合神的旨意，但希腊文并未明说“旨意”。正文保留其简洁和张力，脚注提供自然的释义。
- issue: πνεῦμα是圣灵还是人的灵
  choice: 圣灵
  alternative: 人的灵
  rationale: 紧接上文罗马书8:26所述圣灵的扶助与代求，主语应为圣灵。
translation_notes:
  register: 采用现代、庄重且易懂的中文。“鉴察人心”“为圣徒代求”保持圣经语体但不过分古雅；“照着神”有意保留原文的紧凑表达，并用脚注补充较自然的释义。
