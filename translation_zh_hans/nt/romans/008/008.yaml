  text: οἱ δὲ ἐν σαρκὶ ὄντες θεῷ ἀρέσαι οὐ δύνανται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/008.yaml
  text: Those who are in the flesh cannot please God[a].
translation:
  language: zh_hans
  text: 属肉体的人不能使上帝喜悦。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“受罪性支配的人”。希腊文直译为“在肉体中的人”；“肉体”是保罗在本段使用的一个重要词语。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ... ὄντες
  choice: ……的人
  rationale: 冠词加分词在此作名词用，指处于某种状态的一类人；汉语用“……的人”自然地保留这一含义。
- source_word: δὲ
  choice: 不单独译出
  rationale: δὲ承接并对照上文；本节在汉语中不加连接词更自然，而上下文仍清楚呈现对比。
- source_word: ἐν σαρκὶ
  choice: 属肉体
  rationale: σάρξ是本段具有神学分量的保罗用语。“属肉体”既保留“肉体”这一关键词及其与上下文的联系，也自然表达处在其领域或支配之下的状态；不在正文中径直解释为“罪性”。
- source_word: ἀρέσαι
  choice: 使……喜悦
  rationale: 不定式与δύνανται构成能力表达；“使上帝喜悦”是清楚、自然的现代汉语。
- source_word: θεῷ
  choice: 上帝
  rationale: 希腊文与ἀρέσκω搭配的与格在汉语中自然表达为“使上帝喜悦”的对象。
- source_word: οὐ δύνανται
  choice: 不能
  rationale: 简洁、准确地表达否定的能力。
theological_decisions:
- issue: 在保罗书信这一有争议的语境中如何翻译σάρξ
  choice: 属肉体
  alternative: 受罪性支配
  rationale: 正文保留“肉体”这一原文核心意象和本章的概念联系，避免把其神学含义限定为某一种解释；脚注列出较具解释性的译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“属肉体”符合当代中文圣经语域，并与罗马书8章的关键词保持一致；脚注说明其直译及解释性备选译法。
