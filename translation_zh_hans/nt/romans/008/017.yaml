  text: εἰ δὲ τέκνα, καὶ κληρονόμοι· κληρονόμοι μὲν θεοῦ, συγκληρονόμοι δὲ Χριστοῦ, εἴπερ συμπάσχομεν ἵνα καὶ συνδοξασθῶμεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/017.yaml
  text: and if children[a], then heirs also—heirs of God and fellow heirs with Messiah, if indeed we suffer with him so that we may also be glorified with him.
translation:
  language: zh_hans
  text: 如果我们是儿女，那么也是继承人——是上帝的继承人，也是与基督一同承受产业的人；如果确实[a]我们与他一同受苦，为要我们也与他一同得荣耀。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “如果确实”也可理解为“既然确实”；原文既有条件意味，也带有确信的语气。
    reason: 保留 εἴπερ 的条件性与修辞确信之间的语义张力。
lexical_decisions:
- source_word: τέκνα
  choice: 儿女
  rationale: 该中性复数表示亲子身份，并不限定性别；“儿女”在现代汉语中自然地涵盖男女，也契合上下文的继承主题。
- source_word: κληρονόμοι
  choice: 继承人
  rationale: 保留原词的法律与家庭含义，指有权承受产业的人。
- source_word: θεοῦ
  choice: 上帝的
  rationale: 直接保留属格关系；在“上帝的继承人”这一表达中，不擅自限定所继承之物。
- source_word: συγκληρονόμοι
  choice: 一同承受产业的人
  rationale: 明确表达 συν- 所含的共同参与，以及 κληρονόμος 的继承含义；比生硬的“共同继承人”更符合现代汉语。
- source_word: Χριστοῦ
  choice: 基督
  rationale: “基督”是 Χριστός 在中文圣经语境中的通行称号，既自然又保留其受膏者的称号含义。
- source_word: εἴπερ
  choice: 如果确实
  rationale: 同时保留真实的条件意味和带有确信色彩的修辞语气，避免弱化为单纯的“既然”。
- source_word: συμπάσχομεν
  choice: 与他一同受苦
  rationale: 将 συν- 的共同参与明确译出；“他”依上下文指基督。
- source_word: ἵνα
  choice: 为要
  rationale: 保留目的兼可含结果的关联，不把受苦解释为赚取荣耀的功德。
- source_word: συνδοξασθῶμεν
  choice: 与他一同得荣耀
  rationale: “得荣耀”体现被动语态，“与他一同”体现 συν- 所表达的共同参与。
theological_decisions:
- issue: εἴπερ συμπάσχομεν 是有条件的陈述，还是对信徒现状的肯定
  choice: 译作“如果确实与他一同受苦”
  alternative: 译作“既然与他一同受苦”
  rationale: 原文保有条件性，同时带有说话者预期条件为真的语气；正文不将条件消解，脚注则提示其语气范围。
- issue: 与基督一同受苦是否构成赚取荣耀的功德条件
  choice: 保留“受苦—得荣耀”的条件与目的关联，但不加入功德性措辞
  alternative: 将经文解释性改写为受苦使人配得荣耀，或反向弱化条件关系
  rationale: 希腊文陈述与基督共同受苦及共同得荣耀之间的紧密关联，却没有说受苦本身赚取产业或荣耀。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“儿女”兼顾性别包容与家庭身份；用破折号展开“继承人”的双重说明，并以“一同承受产业”避免法律术语堆叠。
