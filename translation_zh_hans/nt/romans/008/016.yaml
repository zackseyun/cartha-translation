  text: αὐτὸ τὸ πνεῦμα συμμαρτυρεῖ τῷ πνεύματι ἡμῶν ὅτι ἐσμὲν τέκνα θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/016.yaml
  text: The Spirit himself testifies with our spirit that we are God's children[a][b][c].
translation:
  language: zh_hans
  text: 圣灵亲自与我们的灵一同作证：我们是上帝的儿女[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“圣灵向我们的灵作证”。
    reason: 保留τῷ πνεύματι ἡμῶν可能表示见证对象、而不只是共同见证者的语法理解。
  - marker: b
    text: “上帝的儿女”也可译作“上帝的孩子”。
    reason: τέκνα是包含男女的亲属称谓；脚注列出较口语化的对应表达。
lexical_decisions:
- source_word: αὐτὸ τὸ πνεῦμα
  choice: 圣灵亲自
  rationale: αὐτό使“灵”这一主语带有强调意味。“亲自”既自然地保留这种强调，也清楚表达此处圣灵主动、有位格的行动；希腊语πνεῦμα的中性语法性别在汉语中无须另作体现。
- source_word: συμμαρτυρεῖ
  choice: 与……一同作证
  rationale: 该复合动词含有共同、相伴作见证的意思；“一同作证”比单说“作证”更充分保留συν-的语义。
- source_word: τῷ πνεύματι ἡμῶν
  choice: 与我们的灵
  rationale: 与συμμαρτυρεῖ连用的与格可理解为伴随或联合，表示圣灵同我们的灵一起作证；同时以脚注保留将其理解为受事对象的可能。
- source_word: ὅτι ἐσμὲν
  choice: 证明我们是
  rationale: ὅτι引出见证的内容。汉语用“证明”衔接主句与内容从句，表达清楚而不改变命题内容。
- source_word: τέκνα θεοῦ
  choice: 上帝的儿女
  rationale: τέκνα泛指儿女、孩子，不限于男性；“上帝的儿女”在现代汉语中自然、庄重，并保留亲属关系的含义。
theological_decisions:
- issue: 圣灵与人的灵之间见证关系的理解
  choice: 圣灵与我们的灵一同作证
  alternative: 圣灵向我们的灵作证
  rationale: συμμαρτυρεῖ本身通常表达共同作证，且与格可表示相伴，因此正文采用“一同作证”；但与格也可能被理解为见证所面向的对象，故在脚注中保留这一解释，避免消除原文可能存在的张力。
- issue: αὐτὸ τὸ πνεῦμα的位格性与强调
  choice: 圣灵亲自
  alternative: 灵本身
  rationale: 上下文所指是圣灵，αὐτό主要强调主语。汉语“亲自”能表达强调及主动行动，不依赖希腊语名词的中性语法形式，也不额外引入宗派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“圣灵亲自”保留原文主语的强调；“与我们的灵一同作证”贴近希腊语结构。“证明”用于自然引出ὅτι内容从句，并非另加第二个独立动作。
