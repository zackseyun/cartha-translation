  yaml_path: translation/nt/romans/008/001.yaml
  text: Therefore[b][a], there is now no condemnation for those in Messiah Jesus.
translation:
  language: zh_hans
  text: 因此，如今凡在弥赛亚耶稣[b]里的人不被定罪。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些较晚的抄本在此加上：“他们不随从肉体而行。”最早期的希腊文见证支持这里采用的较短文本。
    reason: textual_variant
  - marker: b
    text: 或译“基督耶稣”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐδὲν
  choice: 不
  rationale: 与“被定罪”组合成自然的现代汉语否定表达，完整传达希腊文绝对否定的力度。
- source_word: ἄρα
  choice: 因此
  rationale: 表明本句是根据前文论证得出的结论，保留其推论关系。
- source_word: νῦν
  choice: 如今
  rationale: 明确保留保罗所强调的现今现实，也与救赎历史语境相协调。
- source_word: κατάκριμα
  choice: 被定罪
  rationale: 采用自然、清楚的司法性表达，指有罪判决，而非仅指主观的罪疚感。
- source_word: τοῖς ἐν Χριστῷ Ἰησοῦ
  choice: 那些在弥赛亚耶稣里的人
  rationale: 保留ἐν的“在……里”结构，不把保罗丰富的联合、归属和参与含义缩减为单一解释。
- source_word: Χριστῷ
  choice: 弥赛亚
  rationale: 译出该称号的含义，避免将其仅当作无语义的姓名组成部分；脚注提供传统译法。
- source_word: Ἰησοῦ
  choice: 耶稣
  rationale: 采用该人名在现代汉语圣经语境中的标准译名。
theological_decisions:
- issue: “在弥赛亚耶稣里”的含义
  choice: 保留“在……里”的联合与归属表达
  alternative: 意译为“因着弥赛亚耶稣”
  rationale: 保罗此处的ἐν具有丰富的参与和联合意味；直保留空间隐喻可避免把其神学张力限制为单纯的原因关系。
- issue: κατάκριμα的司法含义
  choice: 译作“不被定罪”
  alternative: 译作“没有罪疚感”
  rationale: 该词主要指不利的司法判决，并非只谈个人内心的罪疚感。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“就不被定罪了”使希腊文省略系词的名词句在汉语中清楚顺畅，同时保留“如今”所表达的现今状态；“在……里”刻意保留保罗原有的神学张力。
