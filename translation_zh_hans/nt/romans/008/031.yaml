  text: Τί οὖν ἐροῦμεν πρὸς ταῦτα; εἰ ὁ θεὸς ὑπὲρ ἡμῶν, τίς καθ’ ἡμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/031.yaml
  text: What then shall we say to these things? If God is for us[b][a], who is against us?
translation:
  language: zh_hans
  text: 那么，面对这一切[a]，我们还要说什么呢？神若站在我们这边[b]，谁能与我们作对呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“关于这一切”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“既然神站在我们这边”。这里的“若”并不表示怀疑。
    reason: alternative_reading
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: 那么……我们还要说什么呢
  rationale: 用“那么”承接上文的推论，以“我们还要说什么呢”表达将来时直陈语气在此处的商议性、反问性用法，符合现代汉语表达。
- source_word: πρὸς ταῦτα
  choice: 面对这一切
  rationale: πρός在这里表示针对或回应前述诸事；“面对这一切”自然地体现回应上文的语境，同时保留“关于这一切”的可能译法于脚注。
- source_word: εἰ
  choice: 若
  rationale: 保留希腊文条件句的形式；上下文表明这不是怀疑神是否眷顾属他的人，而是以已知事实发出有力的反问。
- source_word: ὁ θεὸς
  choice: 神
  rationale: θεός在此明确指神；采用现代中文圣经语体中自然、庄重的称呼。
- source_word: ὑπὲρ ἡμῶν
  choice: 站在我们这边
  rationale: ὑπέρ在此表达有利于、支持或维护某人；此译法清楚传达神与“我们”同一阵线的关系性含义，避免缩减为单一具体行动。
- source_word: τίς καθ’ ἡμῶν
  choice: 谁能与我们作对呢
  rationale: κατά加属格表达敌对；加入“能”是汉语反问中的自然表达，传达无人能够有效胜过神所支持之人的语用含义，并非否认会有人敌对。
theological_decisions:
- issue: εἰ ὁ θεὸς ὑπὲρ ἡμῶν的条件语气
  choice: 正文译作“神若站在我们这边”
  alternative: “既然神站在我们这边”
  rationale: “若”保留原文εἰ的条件句形式及反问张力；“既然”则可更明确表达上下文所预设的真实性，因此列入脚注，避免把保罗的语气误解为对神是否支持信徒存疑。
- issue: “谁与我们作对”的修辞范围
  choice: 译作“谁能与我们作对呢”
  alternative: “谁会反对我们呢”
  rationale: 这句话是得胜式的修辞挑战，并非声称信徒不会遭遇任何敌对。“能……作对”较自然地指向敌对者不能最终胜过神的支持，同时不消除现实中存在反对者的张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准普通话。“那么”承接前文，“面对这一切”指向此前整段论述；两个反问句保留原文逐步加强的得胜语气。
