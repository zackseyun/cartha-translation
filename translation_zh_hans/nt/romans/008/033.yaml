  text: τίς ἐγκαλέσει κατὰ ἐκλεκτῶν θεοῦ; θεὸς ὁ δικαιῶν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/033.yaml
  text: Who will bring a charge against God's chosen ones? It is God who justifies[a][b][c].
translation:
  language: zh_hans
  text: 谁能控告上帝所拣选的人呢？是上帝称他们为义。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “称……为义”在这里带有司法含义，指上帝宣告人为义。
    reason: cultural_note
lexical_decisions:
- source_word: τίς
  choice: 谁
  rationale: 疑问代词引出反问；“谁”直接、自然，不额外加入希腊文未明说的情态含义。
- source_word: ἐγκαλέσει
  choice: 控告
  rationale: 该动词在此具有司法语境中的指控含义；“控告”既简明，也保留法庭色彩。
- source_word: κατὰ
  choice: （控告）……
  rationale: 与控告动词连用时表示针对某人；汉语由“控告”的宾语结构自然表达，无须另译“反对”。
- source_word: ἐκλεκτῶν θεοῦ
  choice: 上帝所拣选的人
  rationale: 将实体化形容词译为“所拣选的人”，清楚表达归属于上帝的拣选，同时避免把后来的神学体系预先带入经文。
- source_word: θεὸς ὁ δικαιῶν
  choice: 是上帝称他们为义
  rationale: “是上帝”保留前置主语的强调；“称……为义”表达 δικαιόω 在此司法性的宣告含义。汉语补出“他们”，其指代由上句明确提供。
theological_decisions:
- issue: 如何翻译 ἐκλεκτῶν 而不预先限定其系统神学含义
  choice: 所拣选的人
  alternative: 选民
  rationale: “所拣选的人”透明地表达希腊文含义，并保留经文本身关于上帝拣选的神学分量；“选民”虽简洁，却更容易被理解为固定的神学或群体称号。
- issue: 如何表达 θεὸς ὁ δικαιῶν 的省略和强调
  choice: 是上帝称他们为义
  alternative: 上帝是称人为义的那一位
  rationale: 原文是简洁而强调的名词句。所选译法在现代汉语中自然，并使反问与回答的司法逻辑清楚；不把本句改译成另一个问句，以免替原文解决标点和句法张力。
- issue: δικαιῶν 的司法性含义
  choice: 称他们为义
  alternative: 使他们成为义人
  rationale: 上下文涉及控告，因此这里主要是法庭性的宣告。“称……为义”较能保留这一点，而不把词义限定为内在道德改变。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“控告—称义”保留原文的法庭语境；句式简洁，以呈现保罗反问后的强调回答。脚注标记已在正文中出现。
