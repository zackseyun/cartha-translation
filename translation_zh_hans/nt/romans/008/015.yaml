id: ROM.8.15
reference: Romans 8:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οὐ γὰρ ἐλάβετε πνεῦμα δουλείας πάλιν εἰς φόβον, ἀλλὰ ἐλάβετε πνεῦμα υἱοθεσίας ἐν ᾧ κράζομεν· Αββα ὁ πατήρ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/015.yaml
  text: For you did not receive a spirit of slavery leading back into fear[a], but you received the Spirit of adoption as sons, by whom we cry[c][b], “Abba! Father!”
translation:
  language: zh_hans
  text: 因为你们所领受的，不是奴役的灵，以致再次陷入惧怕；你们所领受的，乃是儿子名分的灵[a]，我们在这灵里[b]呼喊：“阿爸！父啊！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “儿子名分的灵”也可译作“使人被收养为儿子的灵”或“收纳为儿子的灵”。这里的“灵”按上下文很可能指圣灵，因此也可译作“使人得儿子名分的圣灵”。“儿子名分”强调正式的家庭身份和继承地位，并不表示只有男性才能领受。
    reason: 保留 υἱοθεσία 的收纳、法律身份及继承含义，并说明 πνεῦμα 在上下文中可能指圣灵，而不在正文中过度消歧。
  - marker: b
    text: 或译：“借着他”或“靠着这灵”。原文较直译为“在其中／在他里面”；关系词为中性，形式上与“灵”一致。
    reason: 交代 ἐν ᾧ 可按上下文理解为工具性用法，同时保留其较直接的“在……里”表达及与“灵”的语法一致。
lexical_decisions:
- source_word: πνεῦμα δουλείας
  choice: 奴役的灵
  rationale: 保留“灵”与“奴役”的意象，并与后文“使人得儿子名分的灵”形成原文中的平行对照；不擅自把它限定为一种心理状态或明确位格。
- source_word: πάλιν εἰς φόβον
  choice: 使你们再次陷入惧怕
  rationale: “再次”对应 πάλιν，“陷入惧怕”自然表达 εἰς φόβον 的趋向或结果，同时避免生硬直译为“再次进入惧怕”。
- source_word: πνεῦμα υἱοθεσίας
  choice: 使人得儿子名分的灵
  rationale: 既保留 πνεῦμα，也用“得儿子名分”表达 υἱοθεσία 所含的收纳、法律身份和继承地位；措辞不在正文中完全消除“灵”究竟是圣灵还是与奴役相对的状态这一语法张力。
- source_word: υἱοθεσίας
  choice: 得儿子名分
  rationale: 此词在保罗书信中不只是泛指收养，也突出儿子的法律地位和继承权；“儿子名分”保留原词的男性形式及其历史法律背景。
- source_word: ἐν ᾧ
  choice: 在这灵里
  rationale: 较直接地保留介词 ἐν，避免用“借着他”预先断定纯工具意义和明确位格；中文以“这灵”清楚指出关系词的先行词。
- source_word: κράζομεν
  choice: 我们……呼喊
  rationale: “呼喊”保留动词强烈、迫切而公开发声的语气，比单纯“说”更贴近原文。
- source_word: Αββα ὁ πατήρ
  choice: 阿爸！父啊！
  rationale: “阿爸”音译亚兰语称呼，“父啊”翻译随后希腊语的同位呼语；感叹号表现呼求的强烈语气，而不把两个称呼合并。
theological_decisions:
- issue: πνεῦμα υἱοθεσίας 是否应在正文中明确译作“圣灵”
  choice: 正文译作“使人得儿子名分的灵”，并在脚注说明上下文很可能指圣灵。
  alternative: 使人得儿子名分的圣灵
  rationale: 罗马书第八章的上下文强烈支持圣灵这一位格性所指，但无冠词结构与前面的“奴役的灵”形成刻意平行。正文保留这种张力，脚注则交代更明确的理解。
- issue: ἐν ᾧ 应表达位格性的工具意义，还是保留较直接的空间／联合表达
  choice: 在这灵里
  alternative: 借着他／靠着这灵
  rationale: 原文直译为“在其中／在他里面”；“借着他”在上下文中合理，却会更明确地把关系词理解为指向位格性的圣灵并作工具用法。正文不替原文消除这一歧义。
- issue: υἱοθεσία 的性别与法律身份含义
  choice: 得儿子名分
  alternative: 被收养／得儿女名分
  rationale: 古代语境中的“儿子名分”关涉正式身份与继承权，适用于本节所称的所有信徒；保留“儿子”可呈现原词的法律文化内涵，而不是限定受益者只有男性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“奴役的灵”与“使人得儿子名分的灵”保留原句的平行结构；“陷入惧怕”使趋向表达符合现代汉语；“阿爸！父啊！”保留亚兰语音译和希腊语解释性呼语。所有脚注标记均已置于正文相应位置。
