id: ROM.8.18
reference: Romans 8:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Λογίζομαι γὰρ ὅτι οὐκ ἄξια τὰ παθήματα τοῦ νῦν καιροῦ πρὸς τὴν μέλλουσαν δόξαν ἀποκαλυφθῆναι εἰς ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/018.yaml
  text: For I consider that the sufferings of the present time are not worthy to be compared with the coming glory that is to be revealed to us[a].
translation:
  language: zh_hans
  text: 因为我认为，现在所受的苦楚，若与那将要向我们显明的荣耀相比，根本算不得什么[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在我们身上显明”。
    reason: 原文εἰς ἡμᾶς既可理解为荣耀“向我们”显明，也可能指荣耀“在我们身上”显明。
lexical_decisions:
- source_word: Λογίζομαι
  choice: 我认为
  rationale: 表达经过衡量而作出的判断，而非单纯感受；现代汉语自然、庄重。
- source_word: γὰρ
  choice: 因为
  rationale: 承接上文并说明理由，保留原文的解释性连接。
- source_word: τὰ παθήματα τοῦ νῦν καιροῦ
  choice: 现在所受的苦楚
  rationale: πάθημα指人所经历的苦难；此译法自然地保留“现今时刻”的时间限定。
- source_word: οὐκ ἄξια ... πρὸς
  choice: 若与……相比，根本算不得什么
  rationale: 体现ἄξια与πρός构成的比较及极不相称之意，避免把“配得”生硬地套入汉语。
- source_word: τὴν μέλλουσαν δόξαν
  choice: 那将要……的荣耀
  rationale: 将μέλλουσαν的未来指向明确译出，并以ἀποκαλυφθῆναι补足其内容。
- source_word: ἀποκαλυφθῆναι
  choice: 显明
  rationale: 保留被动启示、揭露之意；“显明”在现代中文中简洁而庄重。
- source_word: εἰς ἡμᾶς
  choice: 向我们
  rationale: 按荣耀被显明给信徒的方向性理解，同时用脚注保留“在我们身上”的参与性可能。
theological_decisions:
- issue: εἰς ἡμᾶς所表达的荣耀显明与信徒的关系
  choice: 向我们显明
  alternative: 在我们身上显明
  rationale: εἰς可表达朝向，也可能在此强调荣耀在信徒身上的实现。正文采用较直接的方向性表达，脚注保留具有神学分量的另一理解，不武断消除歧义。
translation_notes:
  register: 采用现代、庄重且便于普通读者理解的汉语。“苦楚”保持经文语体但不过度古雅；“根本算不得什么”自然传达比较中的悬殊，不将其误解为否定现今苦难本身的真实或严重性。
