  text: εἰ δὲ ὃ οὐ βλέπομεν ἐλπίζομεν, δι’ ὑπομονῆς ἀπεκδεχόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/025.yaml
  text: But if we hope for what we do not see[b][a], we wait for it with patient endurance.
translation:
  language: zh_hans
  text: 但我们若盼望那看不见的，就以坚忍等候[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “等候”也可译作“热切等候”。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: 但……若
  rationale: 保留εἰ的条件意味和δέ承接上文并略带转折的语气；这样的汉语表达自然简洁。
- source_word: ὃ οὐ βλέπομεν
  choice: 那尚未看见的
  rationale: 以名词化的“那……的”对应中性关系代词ὃ；“尚未”在上下文中表达当前未见而将来所盼的状态，但不把对象具体化为救恩、得赎或复活。
- source_word: ἐλπίζομεν
  choice: 盼望
  rationale: “盼望”能自然承接宾语，并保留现在时所表达的持续状态及面向未来的期待。
- source_word: δι’ ὑπομονῆς
  choice: 以坚忍
  rationale: “坚忍”兼顾ὑπομονή在延迟和困难中持守、忍耐的含义，比单纯的“耐心”更有力度。
- source_word: ἀπεκδεχόμεθα
  choice: 等候
  rationale: “等候”准确表达期待尚未来到之事；该复合动词所含的热切期待意味可由脚注交代，以免正文表达过满。
theological_decisions:
- issue: 盼望之对象与尚未看见之未来成全
  choice: 保留为“那尚未看见的”，不明确指出具体对象
  alternative: 按上下文扩展为救恩、身体得赎或复活
  rationale: 虽然上下文有助于辨明所指，本节希腊文本仍以关系从句含蓄表达；保留这种含蓄可避免把解释直接写入正文。
- issue: 等候的情态
  choice: 正文译作“以坚忍等候”，脚注说明动词也可表达热切期待
  alternative: 正文译作“热切等候”或“耐心等候”
  rationale: δι’ ὑπομονῆς突出在延迟中坚忍，ἀπεκδεχόμεθα又带期待意味；正文与脚注分别呈现，可同时保留两者而不使汉语累赘。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“坚忍”比“忍耐”稍凝练有力，适合表达ὑπομονή在困境和延迟中持续持守的意味。脚注标记已置于正文对应词后。
