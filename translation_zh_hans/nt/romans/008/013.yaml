id: ROM.8.13
reference: Romans 8:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἰ γὰρ κατὰ σάρκα ζῆτε μέλλετε ἀποθνῄσκειν, εἰ δὲ πνεύματι τὰς πράξεις τοῦ σώματος θανατοῦτε, ζήσεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/013.yaml
  text: For if you live according to the flesh[a], you are about to die; but if by the Spirit you put to death the deeds of the body, you will live.
translation:
  language: zh_hans
  text: 因为，你们若顺从肉体[a]而活，就将死去；但若靠着圣灵[b]治死身体的行为，就必活着。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “肉体”原文直译为“肉”；在这里不是单指人的身体，而是指受罪支配、与上帝的灵相对的生活取向。
    reason: 说明保罗伦理语境中的关键词含义，并防止把物质身体本身视为邪恶。
  - marker: b
    text: 原文也可译作“靠着灵”；本章上下文较支持这里是指圣灵。
    reason: 保留πνεύματι在词形上的可能歧义，同时交代上下文所支持的主要理解。
lexical_decisions:
- source_word: γὰρ
  choice: 因为
  rationale: 保留本节对上文论述的解释和论证作用。
- source_word: κατὰ σάρκα
  choice: 顺从肉体
  rationale: κατά表达依照、受其支配而行的意思；“肉体”保留保罗在本段中与“灵”相对的关键词，也避免把原文直接释义成抽象的“罪性”。
- source_word: ζῆτε
  choice: 而活
  rationale: 自然表达现在时条件句所描述的生活方式。
- source_word: μέλλετε ἀποθνῄσκειν
  choice: 就将死去
  rationale: 表达μέλλω加不定式所含的即将或必然趋向，同时不把时间上的紧迫程度说得过死。
- source_word: πνεύματι
  choice: 靠着圣灵
  rationale: 将与格理解为凭借或施行的方式；《罗马书》第8章的上下文较强地指向上帝的灵。
- source_word: τὰς πράξεις τοῦ σώματος
  choice: 身体的行为
  rationale: 保留πράξεις的具体行为含义以及τοῦ σώματος的属格关系，不在正文中额外加入原文没有明说的“恶”。
- source_word: θανατοῦτε
  choice: 治死
  rationale: 保留使之死去的强烈比喻和持续实行的伦理行动；“治死”在庄重的现代汉语宗教语境中简洁准确。
- source_word: ζήσεσθε
  choice: 就必活着
  rationale: 用明确的将来结果表达希腊语将来时；“必”在此体现条件实现后的确定结果。
theological_decisions:
- issue: σάρξ在伦理对比中是指物质身体，还是指受罪支配的人性生存取向
  choice: 正文译作“肉体”，并用脚注说明其语境意义
  alternative: 罪性；属肉体的本性
  rationale: “肉体”保留保罗有意使用的身体性词汇以及它与后文“身体”的张力；脚注帮助现代读者避免误以为物质身体本身就是邪恶的。
- issue: πνεύματι是指圣灵还是人的灵
  choice: 圣灵
  alternative: 灵；人的灵
  rationale: 单从词形看没有冠词，也可能保留一定歧义；但《罗马书》第8章紧邻上下文反复谈到上帝的灵，故正文采用“圣灵”，并在脚注中注明形式上的另一种译法。
- issue: “死”与“活”主要指现世、肉身还是终末生命
  choice: 保留“死去／活着”的开放表达
  alternative: 永远死亡／得永生；肉身死亡／存活
  rationale: 原句没有在此明确限定死亡和生命的层面，正文不擅自缩窄其现世与终末含义之间的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“顺从肉体而活”比机械直译“按着肉体活”更自然，同时保留支配性的关系；“治死”保留原文鲜明的死亡隐喻。分号呈现两个条件句之间的强烈对照。
