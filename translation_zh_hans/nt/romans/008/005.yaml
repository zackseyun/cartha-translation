  text: οἱ γὰρ κατὰ σάρκα ὄντες τὰ τῆς σαρκὸς φρονοῦσιν, οἱ δὲ κατὰ πνεῦμα τὰ τοῦ πνεύματος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/005.yaml
  text: For those who live according to the flesh set their minds on the things of the flesh, but those who live according to the Spirit, on the things of the Spirit.
translation:
  language: zh_hans
  text: 因为顺着肉体而活的人，心思放在肉体的事上；顺着圣灵而活的人，心思放在圣灵的事上。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατὰ σάρκα ὄντες
  choice: 顺着肉体而活的人
  rationale: κατά在这里表达取向或支配性的生活准则；ὄντες直译为“是/处于”，结合上下文译为“而活”更符合现代汉语，同时保留持续生活取向。σάρξ译作“肉体”，保留保罗术语的神学张力，不缩减为单纯的“身体”或直接解释成“罪性”。
- source_word: φρονοῦσιν
  choice: 心思放在
  rationale: 该词不仅指偶然想到，也指思想、关注和取向；“心思放在”自然地表达持续关注和内在倾向。
- source_word: τὰ τῆς σαρκὸς
  choice: 肉体的事
  rationale: 保留原文宽泛的属格结构，不擅自列举或限定其内容。
- source_word: κατὰ πνεῦμα
  choice: 顺着圣灵而活
  rationale: 本段上下文中的πνεῦμα指上帝的灵，故译“圣灵”；“顺着”表达κατά所指的规范与方向。
- source_word: τὰ τοῦ πνεύματος
  choice: 圣灵的事
  rationale: 与“肉体的事”保持原文的平行对照，并保留其概括性。
theological_decisions:
- issue: σάρξ的含义
  choice: 肉体
  alternative: 罪性／本性
  rationale: “肉体”保留保罗用语可能涵盖的人类软弱、悖逆取向及受罪辖制的生存状态，避免以解释性词语消除其语义张力。
- issue: πνεῦμα是否明确为圣灵
  choice: 圣灵
  alternative: 灵
  rationale: 罗马书8章紧邻上下文谈到“上帝的灵”和“基督的灵”，这里的人格性、神圣性指向明确；现代汉语以“圣灵”可避免误解为人的精神。
- issue: 省略谓语的补足
  choice: 在第二分句补出“心思放在”
  alternative: 保留省略，只译“顺着圣灵而活的人，则在圣灵的事上”
  rationale: 希腊文第二分句省略了可由前句补出的φρονοῦσιν；汉语补出谓语更清楚自然，也不增加新的命题内容。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“肉体—圣灵”的鲜明平行结构；以“顺着……而活”传达生活取向，以“心思放在”传达持续的思想与关注方向。
