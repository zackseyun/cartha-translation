  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: τίς ὁ ⸀κατακρινῶν; ⸀Χριστὸς ὁ ἀποθανών, μᾶλλον ⸀δὲ ⸀ἐγερθείς, ὅς ⸀καί ἐστιν ἐν δεξιᾷ τοῦ θεοῦ, ὃς καὶ ἐντυγχάνει ὑπὲρ ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/034.yaml
  text: Who is the one condemning? Messiah Jesus is the one who died—more than that[a], who was raised—who is also at the right hand of God[d][c][b], who also intercedes for us.
translation:
  language: zh_hans
  text: 谁会定罪呢？基督[a]已经死了；不仅如此，他还被复活了[b]；他也在上帝的右边[c]，并且为我们[d]代求。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “基督”意为“受膏者”，也可译作“弥赛亚”。本节希腊文正文此处没有“耶稣”一词。
    reason: lexical_alternative
  - marker: b
    text: 希腊文为被动语态：“被复活了”。也常译作“复活了”，但该译法转为主动表达。
    reason: alternative_reading
  - marker: c
    text: “在上帝的右边”是圣经中的表达，指享有至高的尊荣和权柄。
    reason: cultural_note
  - marker: d
    text: “为我们”也可译作“代表我们”或“替我们”。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατακρινῶν
  choice: 定罪的
  rationale: 带冠词的现在分词作名词用；译作“定罪的”保留反问的简洁力度，也不额外限定为一次性行为。
- source_word: Χριστός
  choice: 基督
  rationale: 此处原文只有 Χριστός，并无“耶稣”；“基督”是现代中文中自然、庄重且通行的称谓，其“弥赛亚”含义以脚注说明。
- source_word: ἀποθανών
  choice: 死了
  rationale: 以简单的完成性表达对应不定过去时分词，清楚指向基督已经发生的死亡。
- source_word: μᾶλλον δὲ
  choice: 而且更进一步说
  rationale: 保留从死亡推进到复活的加强和递进语气，而不把 δέ 误解为单纯转折。
- source_word: ἐγερθείς
  choice: 被复活了
  rationale: 保留希腊文被动语态，不改写成主动的“复活了”；虽略带经文语体，却在现代中文中可以理解。
- source_word: ἐν δεξιᾷ τοῦ θεοῦ
  choice: 在上帝的右边
  rationale: 贴近原文空间性表达，同时保留其关于尊荣和权柄的经文意象，不在正文中展开解释。
- source_word: ἐντυγχάνει
  choice: 代求
  rationale: “代求”简洁表达为他人向上帝恳求、陈情的含义，并符合庄重的现代中文经文语体。
- source_word: ὑπὲρ ἡμῶν
  choice: 为我们
  rationale: 自然表达受益和代表关系；脚注补明也可理解为“代表我们”。
theological_decisions:
- issue: Χριστός在本节中的称谓意义
  choice: 基督
  alternative: 弥赛亚
  rationale: 保留现代中文读者熟悉的正文称谓，同时用脚注显明其“受膏者／弥赛亚”的头衔含义；不依英文层擅自加入原文没有的“耶稣”。
- issue: ἐγερθείς的语态
  choice: 被复活了
  alternative: 复活了
  rationale: 原文是被动分词，正文保留被动，避免悄然抹去复活在此被表述为施加于基督之行动的方式；较自然的主动译法列于脚注。
- issue: 上帝右边的意象
  choice: 保留空间性意象
  alternative: 处于最高尊荣和权柄的地位
  rationale: 正文不把经文意象直接释义化，以免缩减其神学和互文内涵；脚注说明其通常含义。
translation_notes:
  register: 采用自然、庄重的现代标准普通话。反问保持简短有力；后半句用分号理清两个连续关系从句。正文忠实于所给SBLGNT文本，不沿用英文咨询层中原文未出现的“耶稣”。
