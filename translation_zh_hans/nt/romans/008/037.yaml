  text: ἀλλ’ ἐν τούτοις πᾶσιν ὑπερνικῶμεν διὰ τοῦ ἀγαπήσαντος ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/037.yaml
  text: But in all these things we overwhelmingly conquer through the one who loved us[a][b].
translation:
  language: zh_hans
  text: 然而，在这一切事上，我们靠着那位爱我们的，得胜有余[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“大大得胜”。
    reason: lexical_alternative
  - marker: b
    text: “那位爱我们的”在紧邻语境中很可能指基督。
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλ’
  choice: 然而
  rationale: 承接上文所列的患难与危险，表达鲜明转折；“然而”自然、庄重，也保留了原文的对比力度。
- source_word: ἐν τούτοις πᾶσιν
  choice: 在这一切事上
  rationale: 贴近原文介词短语，并把所指连于上一节列出的种种苦难；不把 ἐν 明确改释为“借着”或“尽管”。
- source_word: ὑπερνικῶμεν
  choice: 得胜有余
  rationale: 该动词由表示“胜过、得胜”的 νικάω 加强化成分 ὑπερ- 构成；“得胜有余”以简洁而有力度的现代汉语表达远超一般得胜、彻底获胜之意。
- source_word: διὰ
  choice: 靠着
  rationale: διά 后接属格，在此自然表达媒介或施事；“靠着”说明得胜并非出于我们自己，而是经由那位爱我们者。
- source_word: τοῦ ἀγαπήσαντος ἡμᾶς
  choice: 那位爱我们的
  rationale: 保留带冠词的实体化分词结构，不在正文中补出其身份；汉语无需机械表现希腊语不定过去时的形态差异，“爱我们的”自然涵盖其既成之爱。
theological_decisions:
- issue: “那位爱我们的”所指是谁
  choice: 正文保留“那位爱我们的”，不直接补作“基督”。
  alternative: 按紧邻语境明确译作“爱我们的基督”，或理解为“在基督里爱我们的神”。
  rationale: 罗马书8:35的紧邻语境很可能指向基督，但本节希腊文本没有明说名字；保留原文称谓可避免消除其指代上的余地。
- issue: 信徒得胜的性质
  choice: 译作“靠着……得胜有余”，同时保留得胜的强化程度及其来源。
  alternative: 译作“我们是得胜有余的人”或“大大得胜”。
  rationale: 原文使用主动直陈动词 ὑπερνικῶμεν，而不是身份性名词表达；当前译文既传达行动，也不把得胜归为人的独立能力。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“得胜有余”保留保罗用强化动词所表达的高昂语气；正文不补明“那位”的身份，以保存原文的表达方式与语境张力。
