  text: ἡ γὰρ ἀποκαραδοκία τῆς κτίσεως τὴν ἀποκάλυψιν τῶν υἱῶν τοῦ θεοῦ ἀπεκδέχεται·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/019.yaml
  text: For the creation waits with eager expectation for the revealing of the sons of God[a].
translation:
  language: zh_hans
  text: 因为受造界正热切等候上帝的儿子们显现出来[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译作“上帝的儿女”。希腊原文用阳性复数“儿子”，也可能强调儿子的身份和承受产业的地位。
    reason: 说明原文阳性复数形式，并保留“儿女”这一自然且可包容的替代译法；谨慎反映其可能具有的身份和承受产业含义。
lexical_decisions:
- source_word: γὰρ
  choice: 因为
  rationale: 保留本句对上文的解释和论证关系；“因为”在现代汉语中自然清楚。
- source_word: ἀποκαραδοκία
  choice: 热切
  rationale: 该名词表达强烈而专注的期待；汉语中将其转化为修饰“等候”的状语，既自然又保留其力度。
- source_word: κτίσεως
  choice: 受造界
  rationale: 这里是集合意义，指受造的整体；“受造界”比“受造物”更能传达上下文中的宇宙性范围。
- source_word: ἀποκάλυψιν
  choice: 显明
  rationale: 表达目前隐藏的身份将来公开显露出来；“显明”简洁、庄重，也保留事件性的含义。
- source_word: υἱῶν
  choice: 众子
  rationale: 保留希腊文阳性复数“儿子”的表述，并兼顾保罗语境中儿子身份及承受产业的意味；脚注说明可理解或译作“儿女”。
- source_word: θεοῦ
  choice: 上帝
  rationale: 按所属和关系结构译为“上帝众子”，即属于上帝、与上帝有父子关系的人。
- source_word: ἀπεκδέχεται
  choice: 正……等候
  rationale: 表达朝向未来、持续期待的动作；期待的强烈程度已由“热切”传达，避免重复堆砌。
theological_decisions:
- issue: υἱῶν θεοῦ应译为具有阳性形式的“上帝众子”，还是包容性的“上帝的儿女”。
  choice: 上帝众子
  alternative: 上帝的儿女
  rationale: 希腊文明确使用阳性复数“儿子”；保留这一形式也可能承载儿子身份和承受产业的语义。不过其所指可包括所有属上帝的人，因此以脚注保留“儿女”这一译法。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“受造界”体现整体性的宇宙范围；“热切等候”自然整合原文名词与动词的期待语义；“众子”略带经文语体色彩，但用于保留原文形式及身份意味。
