id: ROM.8.24
reference: Romans 8:24
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: τῇ γὰρ ἐλπίδι ἐσώθημεν· ἐλπὶς δὲ βλεπομένη οὐκ ἔστιν ἐλπίς, ὃ γὰρ βλέπει ⸀τίς ἐλπίζει;
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/024.yaml
  text: For in hope we were saved[a]. But hope that is seen is not hope[b], for who hopes for what he sees?
translation:
  language: zh_hans
  text: 因为我们是在盼望中得救的[a]。但看得见的盼望就不是盼望了[b]；人既然看见了，还盼望什么呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“借着盼望得救。”
    reason: alternative_reading
  - marker: b
    text: 也就是说，盼望所关乎的是尚未看见的事。
    reason: cross_reference
lexical_decisions:
- source_word: τῇ ἐλπίδι
  choice: 在盼望中
  rationale: 将与格理解为范围或情状，表达救恩已经真实临到，却仍在盼望中等候完全显明；避免用“借着盼望”暗示盼望是救恩的成因。
- source_word: ἐσώθημεν
  choice: 得救了
  rationale: 保留不定过去时被动语态所指向的既成事件；汉语以“得救了”自然表达被动含义，无须生硬加上“被”。
- source_word: ἐλπὶς ... βλεπομένη
  choice: 看得见的盼望
  rationale: 以自然的汉语定中结构表达现在被动分词，同时保留“盼望”与“看见”的鲜明对照。
- source_word: οὐκ ἔστιν ἐλπίς
  choice: 就不是盼望了
  rationale: 保留原文的判断句，并以“就……了”自然呈现其格言式逻辑。
- source_word: ὃ γὰρ βλέπει τίς ἐλπίζει
  choice: 人既然看见了，还盼望什么呢？
  rationale: 按反问句自然重组汉语语序；“人”表达 τίς 的泛指性质，不限定性别，“什么”对应中性关系代词 ὃ。
theological_decisions:
- issue: τῇ ἐλπίδι ἐσώθημεν 中救恩与盼望的关系
  choice: 正文译为“在盼望中得救”，保留救恩已经临到、但尚待可见之完全实现的张力。
  alternative: “借着盼望得救”，将与格理解为工具或途径。
  rationale: 上下文强调尚未看见而忍耐等候。“在盼望中”较少暗示盼望是产生救恩的有效原因，也不把已经与尚未之间的张力消解掉。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看得见”比“被看见”更自然，也符合上下文中人的观看；末句用反问保持原文的修辞力度。所有脚注标记均已置入正文。
