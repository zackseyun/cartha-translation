id: ROM.8.9
reference: Romans 8:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ὑμεῖς δὲ οὐκ ἐστὲ ἐν σαρκὶ ἀλλὰ ἐν πνεύματι, εἴπερ πνεῦμα θεοῦ οἰκεῖ ἐν ὑμῖν. εἰ δέ τις πνεῦμα Χριστοῦ οὐκ ἔχει, οὗτος οὐκ ἔστιν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/009.yaml
  text: But you are not in the flesh but in the Spirit[a], if indeed the Spirit of God dwells in you. But if anyone does not have the Spirit of Messiah[c][b], he does not belong to him.
translation:
  language: zh_hans
  text: 但你们不在肉体中，而在圣灵中[a]，如果上帝的灵确实住在你们里面。谁若没有弥赛亚的灵[b]，就不属于他[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “肉体”在这里不只是指人的身体，也可指与圣灵相对的生存领域或状态。希腊文直译：“在肉体中……在灵中。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“基督的灵。”
    reason: lexical_alternative
  - marker: c
    text: 直译：“就不是他的。”
    reason: lexical_alternative
lexical_decisions:
- source_word: σάρξ
  choice: 肉体
  rationale: 保留保罗“肉体”的核心术语及“在……中”的领域性表达；此处不只指身体，也不直接改写为较窄的“罪性”。
- source_word: πνεῦμα
  choice: 圣灵／灵
  rationale: 上下文明确说“上帝的灵”和“弥赛亚的灵”，所指是圣灵；首处译作“圣灵”以避免误解为人的精神，后两处依照所属结构译作“上帝的灵”“弥赛亚的灵”。
- source_word: οἰκεῖ
  choice: 住在
  rationale: 自然地表达持续居住、内住的含义，同时保持现代汉语的清楚与庄重。
- source_word: Χριστοῦ
  choice: 弥赛亚
  rationale: Χριστός在此作为称号，译作“弥赛亚”，保留其“受膏者”的身份含义。
- source_word: οὐκ ἔστιν αὐτοῦ
  choice: 不属于他
  rationale: 以自然现代汉语表达希腊文所属关系；“他”的直接先行词最自然是弥赛亚，但不在正文中进一步明说。
- source_word: εἴπερ
  choice: 只要……确实
  rationale: 兼顾条件形式及带有预设、确认意味的语气，不将其径直改成无条件的“既然”。
- source_word: Ὑμεῖς
  choice: 你们
  rationale: 体现希腊文明确且带对比强调的复数代词。
- source_word: οὗτος
  choice: 就
  rationale: 汉语条件复句无需重复阳性单数代词；用“谁若……就……”准确保留泛指单数的逻辑关系。
theological_decisions:
- issue: “在肉体中”与“在圣灵中”的对比
  choice: 保留“在……中”的领域或生存状态表达，并保留“肉体”这一术语
  alternative: 译作“受罪性支配／受圣灵支配”
  rationale: 原文既有领域性的表达，也蕴含支配关系；直保留其张力，避免把保罗的范畴缩减为心理倾向或预先解释成特定教义体系。
- issue: “他”的先行词
  choice: 正文保留代词“他”
  alternative: 明确译作“不属于弥赛亚”或“不属于上帝”
  rationale: 最近的语法先行词是弥赛亚，但较广语境同时连接“上帝的灵”与“弥赛亚的灵”；保留代词可避免过度明释。
- issue: “上帝的灵”与“弥赛亚的灵”的关系
  choice: 依原文并列保留两个所属表达
  alternative: 统一改写为“圣灵”
  rationale: 原文的紧密衔接具有神学分量，但本节没有以解释性措辞详述二者关系，因此译文不额外系统化。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“但你们”保留开头的鲜明对比；破折号帮助读者把条件从句与前句自然连接。“谁若……就……”符合现代汉语习惯，并避免不必要的性别限定。所有脚注标记均置于相关正文之后。
