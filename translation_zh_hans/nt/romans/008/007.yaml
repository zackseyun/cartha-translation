id: ROM.8.7
reference: Romans 8:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: διότι τὸ φρόνημα τῆς σαρκὸς ἔχθρα εἰς θεόν, τῷ γὰρ νόμῳ τοῦ θεοῦ οὐχ ὑποτάσσεται, οὐδὲ γὰρ δύναται·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/007.yaml
  text: because the mindset of the flesh is hostility toward God[a], for it does not submit to the law of God[b], for it is not even able.
translation:
  language: zh_hans
  text: 因为肉体的心思[a]就是对上帝的敌意[b]；它不顺服上帝的律法，因为它根本不能顺服。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “肉体的心思”也可按含义译作“罪性的心思”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“就是与上帝为敌。”
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: 因为
  rationale: 引出前文所述事实的原因，保留明确的因果关系。
- source_word: τὸ φρόνημα
  choice: 心思
  rationale: 这里不只是指思想活动，也指内在的取向和倾向；“心思”在现代汉语中简明自然，并能承载这种含义。
- source_word: τῆς σαρκὸς
  choice: 肉体的
  rationale: 保留保罗用语“肉体”的比喻张力，不在正文中直接解释为“罪性”；解释性译法列入脚注。
- source_word: ἔχθρα εἰς θεόν
  choice: 对上帝的敌意
  rationale: ἔχθρα是名词，表示敌对、仇视的状态；εἰς表示这种敌意所指向的对象。此译法也保留原文“是敌意”的名词结构。
- source_word: τῷ νόμῳ τοῦ θεοῦ οὐχ ὑποτάσσεται
  choice: 它不顺服上帝的律法
  rationale: ὑποτάσσεται在此表示服从、受约束；“不顺服”自然地表达原文否定的从属关系。
- source_word: οὐδὲ γὰρ δύναται
  choice: 事实上也不能顺服
  rationale: δύναται明确表示能力，οὐδέ加强否定。“也不能”保留能力上的否定；补出“顺服”使中文指向清楚，“事实上”体现γάρ在此处的说明和强调作用。
theological_decisions:
- issue: σάρξ应译为“肉体”还是解释为“罪性”
  choice: 正文译作“肉体”，脚注注明可按含义理解并译作“罪性”。
  alternative: 罪性
  rationale: 上下文中的σάρξ并非单指身体，而是指背离上帝的人性取向；但保留“肉体”能维持保罗术语的意象和语义张力，避免把解释直接写入正文。
- issue: ἔχθρα的名词结构是否改译为形容性的“与上帝为敌”
  choice: 译作“就是对上帝的敌意”。
  alternative: 就是与上帝为敌
  rationale: 两种译法意义相近，但正文保留名词谓语，更贴近ἔχθρα，并突出这种心思本身就是敌意，而不只是表现出敌对行为。
- issue: 末句表达不愿顺服还是不能顺服
  choice: 明确译为“也不能顺服”。
  alternative: 也不肯顺服
  rationale: δύναται直接涉及能力。译文保留原文所陈述的不能，而不把它弱化为单纯的不愿，也不进一步用某一神学体系解释这种不能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“对上帝的敌意”略带书面色彩，但准确保留原文名词结构；分号呈现后半句对前半句的解释关系。所有脚注标记均置于正文相应词语之后。
