  text: οἴδαμεν γὰρ ὅτι πᾶσα ἡ κτίσις συστενάζει καὶ συνωδίνει ἄχρι τοῦ νῦν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/022.yaml
  text: For we know that the whole creation groans together and suffers labor pains together until now[a][b].
translation:
  language: zh_hans
  text: 因为我们知道，整个受造界[a]一同呻吟，一同经历生产的阵痛[b]，直到如今。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“一切受造之物”；也可理解为“每个受造物”，但本段更可能指整体的受造界。
    reason: lexical_alternative
  - marker: b
    text: 原文特指生产时的阵痛；这一意象不仅表达痛苦，也可能暗示痛苦正朝向新生命。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδαμεν
  choice: 我们知道
  rationale: οἶδα虽在形式上是完成时，通常表达现在的状态；这里指保罗与读者共同确认的认识。
- source_word: γὰρ
  choice: 因为
  rationale: 保留其解释作用，使本节与上文关于受造界等候得释放的论述相连。
- source_word: πᾶσα ἡ κτίσις
  choice: 整个受造界
  rationale: 定冠词与πᾶσα在此自然表达整体意义；结合罗马书8:19–23的宇宙性语境，“受造界”比“每个受造物”更能体现整体受造秩序，同时保留其人格化表达。
- source_word: συστενάζει
  choice: 一同呻吟
  rationale: “呻吟”传达στενάζω所指的痛苦哀声，“一同”保留συν-前缀所表达的共同经历。
- source_word: συνωδίνει
  choice: 一同经历生产的阵痛
  rationale: 该词特指分娩时的痛楚，而非泛指受苦；译文保留生产意象，并以“一同”体现συν-前缀。
- source_word: ἄχρι τοῦ νῦν
  choice: 直到如今
  rationale: 简洁自然地表达这种状态一直延续到当前。
theological_decisions:
- issue: κτίσις应理解为整体“受造界”，还是分别指“每个受造物”。
  choice: 整个受造界
  alternative: 一切受造之物；每个受造物
  rationale: 罗马书8:19–23把非人类的受造秩序人格化，描述它被置于虚空之下并等候释放。采用“整个受造界”保留这种较广的宇宙性范围，但以脚注承认可能的词义表达。
- issue: ὠδίνω的生产意象是否应在译文中明确表达。
  choice: 明确译作“经历生产的阵痛”
  alternative: 一同受苦；一同痛苦呻吟
  rationale: 原词明确唤起分娩阵痛；保留这一意象，既呈现当前的痛苦，也不抹去它可能指向新生的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“受造界”适合本段的整体性语境；“呻吟”和“生产的阵痛”保留原文鲜明的痛苦与分娩意象。两个“一同”对应两个带συν-前缀的动词，呈现受造界共同承受的状态。
