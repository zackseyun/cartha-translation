source:
  edition: SBLGNT
  text: οὓς δὲ προώρισεν, τούτους καὶ ἐκάλεσεν· καὶ οὓς ἐκάλεσεν, τούτους καὶ ἐδικαίωσεν· οὓς δὲ ἐδικαίωσεν, τούτους καὶ ἐδόξασεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/030.yaml
  text: And those whom he predestined[a], he also called; and those whom he called, he also justified; and those whom he justified[b], he also glorified.
translation:
  language: zh_hans
  text: 他预先定下[a]的人，他也呼召了他们；他呼召的人，他也称他们为义；他称为义的人，他也使他们得了荣耀[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“预定”或“预先指定”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文作过去时态的“使他们得了荣耀”；有些人认为，这里所说的是将来的荣耀，但因其必然实现，便描述为已经成就。
    reason: alternative_reading
lexical_decisions:
- source_word: προώρισεν
  choice: 预先定下
  rationale: 表达“事先决定、指定”的核心含义，同时避免仅凭术语引入某一宗派对“预定”的完整体系。
- source_word: ἐκάλεσεν
  choice: 呼召
  rationale: 保留保罗书信中“召唤”的神学关联，也符合现代中文圣经语体。
- source_word: ἐδικαίωσεν
  choice: 称他们为义
  rationale: 保留 δικαιόω 在保罗语境中的法庭性含义；这一表达比单独使用术语“称义”更便于普通读者理解，又不扩写为解释。
- source_word: ἐδόξασεν
  choice: 使他们得了荣耀
  rationale: 按希腊文不定过去时译出已然表述，以“了”保留其完成式叙述效果，不在正文中改译成将来时。
- source_word: οὓς ... τούτους
  choice: ……的人，他也……他们
  rationale: 以自然中文重现反复出现的关联结构，并清楚表明各环节所指的是同一群人。
- source_word: καὶ
  choice: 也
  rationale: 体现每个分句中的递进兼附加作用，保留“预先定下—呼召—称义—得荣耀”的连锁结构。
- source_word: δὲ
  choice: 以分句衔接体现，未单独译出
  rationale: δέ 在此是轻微的衔接词，并非强烈转折；中文通过句式自然承接即可表达。
theological_decisions:
- issue: προώρισεν 是否应弱化，以回避有关预定的教义争论
  choice: 预先定下
  alternative: 预定；预先指定
  rationale: 原文本身明确表达事先决定。正文应保留这一含义，但不添加有关其方式、范围或条件的解释。
- issue: ἐδόξασεν 应按过去时还是将来时翻译
  choice: 使他们得了荣耀
  alternative: 将使他们得荣耀
  rationale: 希腊文使用不定过去时直陈语气，因此正文保留过去时式的表述；至于是否以已成之事描述确定的将来荣耀，则留在脚注中说明。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留原文三个平行分句及反复推进的结构；避免用解释性增译来解决有关预定、称义和将来荣耀的神学争议。
