  terminology: “预先定下”传达προώρισεν的事先决定含义，且没有扩展为特定教义体系；“呼召”适合保罗语境；“称他们为义”准确传达δικαιόω的法庭性表达；“使他们得了荣耀”忠实表达δοξάζω及其过去时形式。脚注提供了“预定”的词汇替代和末项过去时可能具有预指性的理解，措辞中立。
