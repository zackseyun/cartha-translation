  source_fidelity: 草稿大体保留了原文的句法关系与关键术语，也没有将σάρξ解释性改译为“罪性”。但“成为……样式”将ἐν ὁμοιώματι误作“成为某种样式”，不够准确；“定了罪的罪”则误把κατέκρινε τὴν ἁμαρτίαν处理成不合汉语且语义混乱的结构。
  naturalness: “因为律法因肉体而软弱，做不到的事”语序生硬；“并为着罪”及“定了罪的罪”尤其不自然。改以破折号标出解释性插入语，并采用“定了罪”表达司法性的“定罪/宣判有罪”，可保持庄重、清楚的现代汉语。
  terminology: 保留“律法”“肉体”“罪”“定罪”。“以罪之肉体的样式而来”较准确地表达ἐν ὁμοιώματι σαρκὸς ἁμαρτίας，既不否认儿子的真实人性，也不称他本人有罪。περὶ ἁμαρτίας正文译为“为罪”，并以脚注保留“作赎罪祭”的可能。
