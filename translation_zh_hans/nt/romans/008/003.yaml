id: ROM.8.3
reference: Romans 8:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: τὸ γὰρ ἀδύνατον τοῦ νόμου, ἐν ᾧ ἠσθένει διὰ τῆς σαρκός, ὁ θεὸς τὸν ἑαυτοῦ υἱὸν πέμψας ἐν ὁμοιώματι σαρκὸς ἁμαρτίας καὶ περὶ ἁμαρτίας κατέκρινε τὴν ἁμαρτίαν ἐν τῇ σαρκί,
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/003.yaml
  text: For what the law could not do[a], in that it was weak through the flesh, God did by sending his own Son in the likeness of sinful flesh and for sin; he condemned sin in the flesh[d][c][b],
translation:
  language: zh_hans
  text: 律法所不能做到的事——因为它因肉体而软弱——上帝借着差遣自己的儿子，以罪之肉体的样式而来，并为罪，在肉体中定了罪。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ ἀδύνατον τοῦ νόμου
  choice: 律法……做不到的事
  rationale: 将中性名词化结构自然译为律法无法成就之事，既符合现代汉语，也保留律法无能为力的含义。
- source_word: ἐν ᾧ ἠσθένει διὰ τῆς σαρκός
  choice: 因为律法因肉体而软弱
  rationale: 把ἐν ᾧ理解为说明律法做不到的缘由；保留“肉体”这一有张力的保罗用语，不解释性地改成“罪性”。
- source_word: τὸν ἑαυτοῦ υἱόν
  choice: 自己的儿子
  rationale: “自己”传达ἑαυτοῦ的强调意味，又不添加原文以外的教义措辞。
- source_word: ἐν ὁμοιώματι σαρκὸς ἁμαρτίας
  choice: 成为罪之肉体的样式
  rationale: “罪之肉体”贴近属格结构，“样式”保留ὁμοίωμα的谨慎限定；“成为”在汉语中自然表达差遣时所进入的存在样态，并不否定真实人性。
- source_word: περὶ ἁμαρτίας
  choice: 为着罪
  rationale: 采用较宽泛的表达，保留“为了处理罪”与祭献语境中“作赎罪祭”的可能，不在正文中排除任何一面。
- source_word: κατέκρινε τὴν ἁμαρτίαν
  choice: 定了罪的罪
  rationale: “定……的罪”保留κατακρίνω的司法宣判意味，而宾语仍是“罪”。
- source_word: ἐν τῇ σαρκί
  choice: 在肉体中
  rationale: 不擅自补出“他的”，保留原文紧凑性以及所指范围的含蓄。
theological_decisions:
- issue: 本节σάρξ的含义
  choice: 两处均译为“肉体”
  alternative: 罪性；有罪的本性
  rationale: 原文在人的软弱与上帝借儿子在肉身中的作为之间形成刻意呼应；“肉体”能保留这种多层含义，避免先行限定为抽象的罪性。
- issue: περὶ ἁμαρτίας是否具有献祭含义
  choice: 正文译“为着罪”
  alternative: 作赎罪祭；为罪
  rationale: 该短语在七十士译本的献祭语境中可指赎罪祭，但单凭形式也可较广泛地表示“为罪”。正文保留宽度，脚注说明祭献读法。
- issue: “罪之肉体的样式”的基督论张力
  choice: 保留“样式”及属格结构
  alternative: 成为有罪肉体的样子；取了与罪人相同的肉身
  rationale: 原文同时申明儿子进入真实的人类肉体处境，又避免直接说他本人有罪；译文不将这种张力化约为某一套解释。
- issue: ἐν τῇ σαρκί所指
  choice: 译作“在肉体中”，不补代词
  alternative: 在他的肉体中
  rationale: “他的肉体”很可能符合语境，却不是希腊文明确说出的；正文保留原文的含蓄。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“因为……做不到的事，上帝做到了”补明希腊文结构中隐含的谓语关系，使长句清楚可读；关键术语“律法、肉体、定罪”保持前后呼应。所有脚注标记均置于相关正文短语之后。
