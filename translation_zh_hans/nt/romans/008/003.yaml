revisions:
- from: 因为律法因肉体而软弱，做不到的事[a]，上帝做到了：他差遣自己的儿子，成为罪之肉体的样式[b]，并为着罪[c]，就在肉体中定了罪的罪。
  to: 律法所不能做到的事——因为它因肉体而软弱——上帝借着差遣自己的儿子，以罪之肉体的样式而来，并为罪，在肉体中定了罪。
  rationale: 修订纠正了两个实质问题：“成为……样式”改为“以……样式而来”，以符合ἐν ὁμοιώματι的表达；“定了罪的罪”改为“定了罪”，以准确自然地表达κατέκρινε τὴν ἁμαρτίαν。句首改用破折号保留原文中对律法无能的解释性插入，并让“上帝”所作的行动成为全句的明确主干。脚注锚点应分别置于“所不能做到的事”“罪之肉体的样式”“为罪”之后。
