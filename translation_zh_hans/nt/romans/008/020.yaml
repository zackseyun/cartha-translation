id: ROM.8.20
reference: Romans 8:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: τῇ γὰρ ματαιότητι ἡ κτίσις ὑπετάγη, οὐχ ἑκοῦσα ἀλλὰ διὰ τὸν ὑποτάξαντα, ⸀ἐφ’ ἑλπίδι
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/020.yaml
  text: For the creation was subjected to futility[a], not willingly, but because of the one who subjected it[c][b], in hope
translation:
  language: zh_hans
  text: 因为受造界被置于虚空[a]，不是出于自己的意愿，而是因为那位使它受制于此的人[b]，并且是在盼望中[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “虚空”也可译为“徒然无功”或“挫败”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文没有明确说明“那位使它受制于此的人”是谁。
    reason: alternative_reading
  - marker: c
    text: “在盼望中”也可译为“带着盼望”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ματαιότητι
  choice: 徒然无功的境地
  rationale: 该词在这里指受造界无法达到其应有目的的受挫、无果状态，并非指道德上的邪恶。“徒然无功的境地”在现代汉语中较清楚，也保留了保罗所表达的目的落空之意。
- source_word: κτίσις
  choice: 受造界
  rationale: 罗马书8:19–22所指是整体性的受造秩序，而非某一个受造物；“受造界”既简洁，又能表达其集合意义。
- source_word: ὑπετάγη
  choice: 被置于……的境地
  rationale: 采用被动表达，保留受造界遭外力置于某种状态之下的含义；中文不生硬地逐字译作“被降服”。
- source_word: οὐχ ἑκοῦσα
  choice: 并不是出于自愿
  rationale: 清楚表达受造界并非凭自己的意愿进入这种状态，并与后面的施动者形成对照。
- source_word: διὰ τὸν ὑποτάξαντα
  choice: 由于那使它屈服者
  rationale: 将带宾格的διά理解为原因，译文保留该人物指称，却不在正文中擅自确认其身份。
- source_word: ἐφ’ ἑλπίδι
  choice: 在盼望中
  rationale: 保留原文简短而开放的表达，使“盼望”可自然引向下一节的说明，也不把它过度解释为某一种明确的心理活动。
theological_decisions:
- issue: “那使它屈服者”的身份
  choice: 正文仅译作“那使它屈服者”，不明确指名。
  alternative: 可解释为上帝；也有人认为亚当的堕落是受造界屈服的起因，另有较少见的解释指向撒但。
  rationale: 希腊文在本节没有明说其身份。上下文可能支持特定理解，但翻译应保留原文的克制和神学张力。
- issue: “在盼望中”与前文的句法关系
  choice: 保留为句末短语“在盼望中”。
  alternative: 也可译作“带着盼望”或将其明确连接于“被置于……境地”。
  rationale: 原文表达紧凑，其修饰关系在中文中不宜被过度限定；句末保留该短语，也能承接下一节对盼望内容的展开。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“受造界”准确概括上下文中的整体受造秩序；句末“在盼望中”刻意保持原文的紧凑和一定程度的悬置，以自然承接下一节。
