  source_fidelity: 草稿总体忠实呈现了κτίσις的集合意义、ὑπετάγη的被动语态、οὐχ ἑκοῦσα的非自愿性，以及未指明施动者身份的原文限制。但“那使它屈服者”在汉语中句法和指称均不够清晰；“徒然无功的境地”则较原文抽象名词性表达显得扩充且不够凝练。
  naturalness: “受造界”及“在盼望中”自然、庄重。将施动者改为“那位使它受制于此的人”，并以“并且是在盼望中”明确句末短语仍修饰受造界被置于该状态的事件，可显著改善现代汉语的通顺度，同时不限定盼望的具体归属或内容。
  terminology: “受造界”适合本段语境。“虚空”是ματαιότης在中文圣经语域中简洁、可理解且保留开放度的对应；脚注保留“徒然无功”“挫败”等释义。避免“屈服”，因为该词容易使读者理解为受造界主动让步，而原文强调其被动受制。
