revisions:
- from: 因为受造界被置于徒然无功的境地[a]，并不是出于自愿，而是由于那使它屈服者[b]，在盼望中[c]。
  to: 因为受造界被置于虚空[a]，不是出于自己的意愿，而是因为那位使它受制于此的人[b]，并且是在盼望中[c]。
  rationale: 修订以“虚空”对应ματαιότης，保留其在本处指受挫、未达目的之状态的语义开放性；以“受制于此”对应ὑπετάγη及ὑποτάξαντα，维持被动与未具名施动者。句末“并且是在盼望中”使中文句法完整，但不将盼望解释为受造界的心理状态，也不预断该短语的更细句法关系。
