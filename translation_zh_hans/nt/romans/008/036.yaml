  text: καθὼς γέγραπται ὅτι Ἕνεκεν σοῦ θανατούμεθα ὅλην τὴν ἡμέραν, ἐλογίσθημεν ὡς πρόβατα σφαγῆς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/036.yaml
  text: 'Just as it is written: “For your sake we are being put to death all day long[a]; we were counted as sheep for slaughter.”'
translation:
  language: zh_hans
  text: 正如经上所记：“为了你，我们终日被杀；我们被看作如同待宰的羊。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: 正如经上所记
  rationale: 采用自然、庄重的经文引述格式；“正如”保留与上文的比较关联，“经上所记”表达完成时被动式所具有的现存权威意味。
- source_word: Ἕνεκεν σοῦ
  choice: 为了你
  rationale: 保留原因或缘故之意以及对上帝的第二人称直接称呼；现代汉语简洁自然。
- source_word: θανατούμεθα
  choice: 我们……被置于死地
  rationale: 保留现在时被动语态所表达的持续遭受致死对待，语气庄重而不将其狭义化为某一种殉道方式。
- source_word: ὅλην τὴν ἡμέραν
  choice: 终日
  rationale: 简洁而有尊严地表达整日、不断面对死亡的时间延续含义。
- source_word: ἐλογίσθημεν
  choice: 人看我们
  rationale: 表达被动的‘被算作、被视为’，在现代汉语中比机械的‘我们被算为’更自然；泛指施行这种看待的人，不指定具体主体。
- source_word: ὡς πρόβατα σφαγῆς
  choice: 如同待宰的羊
  rationale: 清楚保留比较关系和供宰杀之羊的意象，不额外加入祭祀含义。
theological_decisions:
- issue: 诗篇44:22引文在受苦语境中的群体性与持续性
  choice: 保留‘我们’的群体视角及持续面对死亡的含义，不添加解释。
  alternative: 明确译成殉道，或限定为某一种历史迫害。
  rationale: 希腊文本直接引用群体哀歌；译文应保留受苦与归属上帝之间的张力，而不把应用缩窄为特定教义或事件。
- issue: ἐλογίσθημεν的被动施事者
  choice: 以泛指的‘人看我们’自然表达未明说的施事者。
  alternative: 译作‘我们被算作’或明确说是上帝、迫害者看待他们。
  rationale: 原文没有说明是谁如此看待他们，因此不应在译文中指定施事者。
translation_notes:
  register: 采用现代标准普通话，语体庄重而易懂，与诗篇引文的诗性相称；保留‘待宰的羊’这一鲜明意象，并避免宗派性阐释。
