  text: ὅς γε τοῦ ἰδίου υἱοῦ οὐκ ἐφείσατο, ἀλλὰ ὑπὲρ ἡμῶν πάντων παρέδωκεν αὐτόν, πῶς οὐχὶ καὶ σὺν αὐτῷ τὰ πάντα ἡμῖν χαρίσεται;
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/032.yaml
  text: He indeed did not spare his own Son[c][b][a], but gave him over for us all—how will he not also with him graciously give us all things?
translation:
  language: zh_hans
  text: 他既然连自己的儿子也没有顾惜，反而为我们众人[b]把他交付了[a]，又怎会不把万有连同他一并白白赐给我们呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “交付了”也可译作“交了出去”。
    reason: lexical_alternative
  - marker: b
    text: “为我们众人”也可译作“为了我们所有人”或“为我们众人的益处”。
    reason: alternative_reading
lexical_decisions:
- source_word: ὅς γε
  choice: 他既然
  rationale: ὅς回指上文的神；γε加强语气。汉语用“既然”自然引出由更大恩赐推及其余恩赐的反问论证，并传达强调意味。
- source_word: τοῦ ἰδίου υἱοῦ
  choice: 自己的儿子
  rationale: “自己的”保留ἰδίου所强调的亲属与所有关系；“儿子”明确指上帝的儿子，但简体中文一般不靠大写标示专名。
- source_word: οὐκ ἐφείσατο
  choice: 也没有顾惜
  rationale: “顾惜”准确表达φείδομαι的不舍、保全之意，并保留可能与献以撒叙事形成的经文呼应。
- source_word: ἀλλὰ
  choice: 反而
  rationale: 体现强烈转折，与前面的“没有顾惜”构成自然对照。
- source_word: ὑπὲρ ἡμῶν πάντων
  choice: 为我们众人
  rationale: 保留ὑπέρ的受益、代表之宽泛含义和πάντων的整体范围，不将其收窄为某一种技术性的代赎表述。
- source_word: παρέδωκεν αὐτόν
  choice: 把他交了出去
  rationale: 表达交付于受难和死亡的严肃含义，又不把动作主体、对象或具体方式过度明说。
- source_word: πῶς οὐχὶ καὶ
  choice: 又怎会不
  rationale: 保留期待肯定答案的强烈反问，以及从更大之赐推论到其余一切的逻辑。
- source_word: σὺν αὐτῷ
  choice: 连同他一并
  rationale: 清楚保留σύν的伴随意义；“一并”使中文语序自然。
- source_word: τὰ πάντα
  choice: 万有
  rationale: “万有”庄重而简洁，可保留表达的广泛性；其具体范围仍由上下文界定。
- source_word: ἡμῖν
  choice: 赐给我们
  rationale: 用“给我们”明确表达与格的间接受益者。
- source_word: χαρίσεται
  choice: 白白赐给
  rationale: “白白”保留χαρίζομαι所含的恩惠、无偿赐予意味，“赐给”符合神向人施予的庄重语域。
theological_decisions:
- issue: ὑπὲρ ἡμῶν πάντων是否应译成明确指定替代性代赎的技术表述
  choice: 为我们众人
  alternative: 代替我们众人；代表我们众人
  rationale: 原文明确表达基督的交付是为众人而有益并带有牺牲意味，但ὑπέρ本身在此不必被限定为某一种技术性的代赎公式。
- issue: τὰ πάντα的范围是否应在译文中限定为救恩福分
  choice: 万有
  alternative: 一切所需；一切福分
  rationale: 保留保罗宽广而受语境约束的措辞，不在正文中替作者界定其范围。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“既然……又怎会不……”自然呈现原文从较大恩赐到较小恩赐的反问推论；“顾惜”“万有”“白白赐给”保留经文语体，同时避免生僻或宗派化术语。
