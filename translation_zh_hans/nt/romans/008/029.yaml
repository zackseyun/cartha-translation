  text: ὅτι οὓς προέγνω, καὶ προώρισεν συμμόρφους τῆς εἰκόνος τοῦ υἱοῦ αὐτοῦ, εἰς τὸ εἶναι αὐτὸν πρωτότοκον ἐν πολλοῖς ἀδελφοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/029.yaml
  text: For those whom he foreknew[a], he also predestined to be conformed to the image of his Son[b], so that he might be the firstborn among many brothers.
translation:
  language: zh_hans
  text: 因为他预先知道的人[a]，也预先定下他们模成他儿子的形象，为要使他的儿子在许多弟兄中成为长子[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“预先认识”。这里的“知道”也有人理解为关系性的认识，即“预先眷顾”。
    reason: alternative_reading
  - marker: b
    text: “弟兄”原文为阳性复数；这里所指的神家成员可能包括男性和女性。
    reason: cultural_note
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 承接上文，说明前一句的根据；现代汉语中“因为”比孤立的“原来”更直接。
- source_word: προέγνω
  choice: 预先所知道
  rationale: 保留“预先”与“知道”的词义构成，不把它限定为单纯预见信息或预先拣选，留下原文的神学张力。
- source_word: προώρισεν
  choice: 预先定下
  rationale: 表达在事前作出确定安排的意思，同时避免用解释性更强的宗派术语替代原词。
- source_word: συμμόρφους τῆς εἰκόνος
  choice: 效法……的形像
  rationale: 表达与某一形像相符、被塑造成相似样式的含义；中文简洁自然，并保留“形像”的圣经语汇关联。
- source_word: τοῦ υἱοῦ αὐτοῦ
  choice: 他儿子
  rationale: 直接保留明确的父子称谓及其基督论意义。
- source_word: εἰς τὸ εἶναι
  choice: 使……作
  rationale: 该结构可表达目的或结果；“使”在中文中简洁呈现这一指向，不额外断定二者中的一端。
- source_word: πρωτότοκον
  choice: 长子
  rationale: 保留出生次序与首位地位的比喻性称谓，不将其简化为“最尊贵者”。
- source_word: ἐν πολλοῖς ἀδελφοῖς
  choice: 在许多弟兄中
  rationale: 按原文保留阳性复数“弟兄”，其所指可能包括神家中的男女，另以脚注说明。
theological_decisions:
- issue: προέγνω是否应译成预先拣选、预先眷顾或仅仅预知信息
  choice: 译为“预先所知道”
  alternative: “预先认识”“预先眷顾”“预先拣选”
  rationale: 原文没有在本句中明确解释这种“知道”的机制或关系性质，因此正文不替读者解决有关预知与预定的神学争论。
- issue: εἰς τὸ εἶναι的目的与结果色彩
  choice: 译为“使他儿子……作长子”
  alternative: “为要使他儿子……作长子”“结果使他儿子……作长子”
  rationale: 希腊语结构兼具目的与结果的可能色彩；采用不强行排除其中任何一面的中文表达。
- issue: ἀδελφοῖς是否在正文中性别中和
  choice: 正文译“弟兄”，脚注说明可能包括男女
  alternative: “弟兄姊妹”“众手足”
  rationale: 原词在语法上为阳性复数；正文准确保留其形式，脚注交代在神家语境中可能具有包容性所指。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“预先所知道／预先定下”保留希腊文两个带有“预先”前缀的动词之间的呼应；“形像”“长子”“弟兄”则保留重要的圣经意象与亲属称谓。
