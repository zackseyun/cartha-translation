  text: ὅτι καὶ αὐτὴ ἡ κτίσις ἐλευθερωθήσεται ἀπὸ τῆς δουλείας τῆς φθορᾶς εἰς τὴν ἐλευθερίαν τῆς δόξης τῶν τέκνων τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/021.yaml
  text: because creation itself also will be set free from slavery to decay into the freedom of the glory of the children of God[a].
translation:
  language: zh_hans
  text: 因为受造界本身也将从朽坏的奴役中得释放，进入神的儿女荣耀的自由。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较直译：“进入神的儿女之荣耀的自由。”
    reason: 保留 τῆς δόξης τῶν τέκνων τοῦ θεοῦ 的连续属格结构及其可能的理解空间。
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 按因果连词理解，说明前文所说盼望的依据；同时保留本节与上文的紧密衔接。
- source_word: καὶ αὐτὴ ἡ κτίσις
  choice: 受造界本身也
  rationale: “也”保留 καὶ 的附加意味，“本身”体现 αὐτή 的强调；“受造界”在此指整体受造秩序，而非某一个受造物。
- source_word: ἐλευθερωθήσεται
  choice: 将……得到释放
  rationale: 保留将来时和被动语态，表达受造界将来蒙受释放，而不是自行挣脱。
- source_word: ἀπὸ τῆς δουλείας τῆς φθορᾶς
  choice: 脱离朽坏的奴役
  rationale: “奴役”保留 δουλεία 强烈的奴隶制隐喻；在此语境中，φθορά 主要指衰残、败坏和必朽状态，故译为“朽坏”。
- source_word: εἰς τὴν ἐλευθερίαν
  choice: 进入……自由
  rationale: “进入”保留 εἰς 所表达的方向和状态转变，与前面的“脱离”形成对应。
- source_word: τῆς δόξης τῶν τέκνων τοῦ θεοῦ
  choice: 神儿女所享有的荣耀
  rationale: “神儿女”准确保留 τέκνα 的亲属关系和包容性；正文采用自然汉语表达，把这自由描述为属于神儿女并以荣耀为特征，同时用脚注保留希腊语属格链较直译的形式。
theological_decisions:
- issue: 如何表达 τὴν ἐλευθερίαν τῆς δόξης τῶν τέκνων τοῦ θεοῦ 的连续属格关系
  choice: 神儿女所享有的荣耀自由
  alternative: 神儿女之荣耀的自由
  rationale: 希腊语可理解为神儿女所享有、以荣耀为特征的自由，也可较形式化地译作“神儿女之荣耀的自由”。正文采用自然而不额外扩展教义内容的表达，脚注保留较直译形式，以免掩盖原文关系上的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“受造界”适合表达整体受造秩序；“朽坏的奴役”刻意保留原文鲜明的奴役隐喻。脚注标记已在正文中标出。
