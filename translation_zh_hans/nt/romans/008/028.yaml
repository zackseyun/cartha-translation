source:
  edition: SBLGNT
  text: Οἴδαμεν δὲ ὅτι τοῖς ἀγαπῶσι τὸν θεὸν πάντα ⸀συνεργεῖ εἰς ἀγαθόν, τοῖς κατὰ πρόθεσιν κλητοῖς οὖσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/028.yaml
  text: And we know that for those who love God, all things work together for good—for those who are called according to purpose.
translation:
  language: zh_hans
  text: 我们知道，万事都一同效力，使爱上帝的人得益处[a]；这些人就是照着旨意[b]蒙召的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作：“上帝使万事一同效力，使爱上帝的人得益处。”
    reason: textual_variant
  - marker: b
    text: 或译：“照着他的旨意。”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδαμεν
  choice: 我们知道
  rationale: 现在时表达一种确定、持续的认知状态；“我们知道”简明自然，也保留保罗论述中的确信语气。
- source_word: δὲ
  choice: （不单独译出）
  rationale: 此处是轻微的承接语气。现代汉语无需机械译作“而且”或“但是”，省略后上下文衔接更自然，也不夸大转折。
- source_word: τοῖς ἀγαπῶσι τὸν θεόν
  choice: 为爱上帝的人
  rationale: 用“为”承接与益处相关的与格关系；“爱上帝的人”准确保留现在分词所指的群体。
- source_word: πάντα
  choice: 万事
  rationale: 保留中性复数所涵盖的广度；“万事”在现代汉语中凝练、庄重，又不把范围缩窄为某类经历。
- source_word: συνεργεῖ
  choice: 一同效力
  rationale: 按所给SBLGNT正文，不在主句中补入“上帝”作主语；“万事……一同效力”保留该动词的共同作用含义及正文的句法张力。
- source_word: εἰς ἀγαθόν
  choice: 使他们得益处
  rationale: 将表示结果或趋向的短语译成自然汉语，清楚说明这种共同作用导向益处，同时不把ἀγαθόν抽象化为特定教义概念。
- source_word: τοῖς κατὰ πρόθεσιν κλητοῖς οὖσιν
  choice: 他们就是照着旨意蒙召的人
  rationale: 将重复的与格群体自然地处理为同位说明，表明这群人就是前面的“爱上帝的人”；“蒙召”符合保罗语境，也保留被动含义。
- source_word: πρόθεσιν
  choice: 旨意
  rationale: 此处指有意的目的或计划。“旨意”在中文圣经语域中庄重而易懂；正文不添加原文未明说的所有格，另一译法见脚注。
- source_word: κλητοῖς
  choice: 蒙召
  rationale: 保留被召的被动意义和保罗书信中的术语连贯性，不进一步界定呼召发生的方式。
theological_decisions:
- issue: συνεργεῖ的隐含或明示主语
  choice: 正文译作“万事……一同效力”，不补入“上帝”作主语。
  alternative: “上帝使万事一同效力，使他们得益处。”
  rationale: 所给SBLGNT正文是πάντα συνεργεῖ，没有明写θεός作主语。正文依从该文本，明确以上帝为主语的异文则保留在脚注中，以免无声消除文本与神学上的张力。
- issue: κατὰ πρόθεσιν是否补出所有格
  choice: 译作“照着旨意”，不在正文添加“他的”。
  alternative: “照着他的旨意”
  rationale: 上下文很自然地指向上帝的旨意，但希腊语短语本身没有明写所有格。中文允许在语境明确时省略所有格，因此正文可兼顾自然度与形式忠实，显明的解释见脚注。
- issue: 两个与格群体之间的关系
  choice: 用“他们就是”将“照着旨意蒙召的人”处理为对“爱上帝的人”的同位说明。
  alternative: 再次译作“为照着旨意蒙召的人”。
  rationale: 重复“为……的人”在汉语中生硬，也可能误导读者以为是两个不同群体；同位表达保留希腊文对同一群体的双重描述。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“万事”“一同效力”“蒙召”“旨意”保持经文语体的凝练感；通过“使他们得益处”和“他们就是”避免过度欧化。脚注标记[a]置于相关异文分句之后，[b]置于“照着旨意”所在句末。
