id: ROM.8.2
reference: Romans 8:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ γὰρ νόμος τοῦ πνεύματος τῆς ζωῆς ἐν Χριστῷ Ἰησοῦ ἠλευθέρωσέν ⸀σε ἀπὸ τοῦ νόμου τῆς ἁμαρτίας καὶ τοῦ θανάτου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/002.yaml
  text: For the law of the Spirit of life in Messiah Jesus has set you free from the law of sin and death[a][b][c].
translation:
  language: zh_hans
  text: 因为生命之灵的律[a]在弥赛亚耶稣里[c]已经使你[b]从罪与死的律中得了自由。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “律”也可译作“法则”：“生命之灵的法则”。
    reason: lexical_alternative
  - marker: b
    text: 有些抄本作“我”，而不是“你”。
    reason: textual_variant
  - marker: c
    text: 传统译法：“在基督耶稣里”。
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμος
  choice: 律
  rationale: 两处均译作“律”，保留保罗对同一名词的重复，以及它可指法律、支配性规律或原则的张力；“法则”虽较顺口，却会过早限定其含义。
- source_word: πνεύματος τῆς ζωῆς
  choice: 生命之灵
  rationale: 按属格结构直译，保留“灵”与“生命”的紧密关系，不扩写为“赐生命的灵”；罗马书第8章的语境表明这里所指的是圣灵。
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: 在弥赛亚耶稣里
  rationale: 将 Χριστός 作为称号译为“弥赛亚”，并保留“在……里”的表达，以呈现保罗关于人与弥赛亚联合的语言。
- source_word: ἠλευθέρωσέν
  choice: 使……脱离……，得了自由
  rationale: 用自然汉语表达已经完成并带来现今结果的释放行动，同时清楚呈现其所脱离的对象。
- source_word: σε
  choice: 你
  rationale: 遵从SBLGNT正文的第二人称单数读法；异文“我”列入脚注。
- source_word: ἁμαρτίας καὶ τοῦ θανάτου
  choice: 罪与死
  rationale: 保留两个单数名词并列的简洁结构，也保留“罪”既可表示抽象现实、又可表示奴役性权势的语义空间。
theological_decisions:
- issue: πνεύματος 是指圣灵、人的灵，还是一种属灵原则
  choice: 理解为圣灵，正文译作“生命之灵”
  alternative: 人的灵；属灵原则
  rationale: 罗马书第8章中，灵与肉体、罪和死形成的对照强烈支持这里指赐生命的神之灵；但中文不另加原文没有的“圣”字，以保持原文措辞。
- issue: νόμος 在本节是“律”还是“法则”
  choice: 正文作“律”
  alternative: 法则；原则
  rationale: 同一个词同时用于“生命之灵的律”和“罪与死的律”，译作“律”最能保留修辞重复和神学张力，不把它单纯解释为摩西律法或抽象原则。
- issue: ἐν Χριστῷ Ἰησοῦ 的句法关联
  choice: 保留为“在弥赛亚耶稣里”，置于主语与谓语之间
  alternative: 明确解释为生命之灵的律所在的领域；明确解释为得释放的领域
  rationale: 希腊文短语可与前面的“生命之灵的律”紧密相连，也可说明释放发生的领域；中文位置尽量不把这种关联完全锁定。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“律”比“律法”更能避免让读者立即只联想到摩西律法；“得了自由”清楚表达释放的结果。所有脚注标记均置于相关词语之后。
