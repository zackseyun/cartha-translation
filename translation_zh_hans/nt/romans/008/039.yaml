id: ROM.8.39
reference: Romans 8:39
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οὔτε ὕψωμα οὔτε βάθος οὔτε τις κτίσις ἑτέρα δυνήσεται ἡμᾶς χωρίσαι ἀπὸ τῆς ἀγάπης τοῦ θεοῦ τῆς ἐν Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/039.yaml
  text: nor height nor depth nor any other created thing will be able to separate us from the love of God that is in Messiah Jesus our Lord[a][b][c].
translation:
  language: zh_hans
  text: 无论高处、深处，还是任何别的受造之物[a]，都不能使我们与上帝那在我们的主弥赛亚[c]耶稣里的爱[b]隔绝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“受造界中的任何其他事物”或“任何别的受造者”。
    reason: lexical_alternative
  - marker: b
    text: 这里的“上帝的爱”按上下文最可能指上帝对我们的爱。
    reason: alternative_reading
  - marker: c
    text: “弥赛亚”传统上常译作“基督”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕψωμα
  choice: 高处
  rationale: 与 βάθος 配对时，空间意义最自然；“高处”保留了上下两极的修辞对照。
- source_word: βάθος
  choice: 深处
  rationale: 与 ὕψωμα 构成极端空间维度的对举；“深处”直接而自然。
- source_word: κτίσις ἑτέρα
  choice: 任何别的受造之物
  rationale: κτίσις 可指“受造界”或“受造之物”；此处用“受造之物”表达没有任何被造者或被造事物能造成隔绝，并以“别的”对应 ἑτέρα，以“任何”体现 τις 的不定意味。
- source_word: δυνήσεται
  choice: 都不能
  rationale: 表达将来能力的否定；现代汉语在这种普遍保证中通常不必明说“将来”，而“不能”自然涵盖其不能做到。
- source_word: χωρίσαι
  choice: 使……隔绝
  rationale: “使……隔绝”准确表达从关系中分开、断开的意思，也与本段的保证语境相称。
- source_word: ἀγάπης τοῦ θεοῦ
  choice: 上帝的爱
  rationale: 保留属格形式及其表面上的含混，不在正文中直接改写为“上帝对我们的爱”。
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: 在弥赛亚耶稣里
  rationale: 保留 ἐν 的“在……里”，并将 Χριστός 作为称号译为“弥赛亚”。
- source_word: κυρίῳ ἡμῶν
  choice: 我们的主
  rationale: κύριος 在此按保罗书信中惯常的基督论称谓译为“主”，并保留“我们的”。
theological_decisions:
- issue: “上帝的爱”（τῆς ἀγάπης τοῦ θεοῦ）中属格的含义
  choice: 正文保留“上帝的爱”；注释说明上下文最可能指上帝对我们的爱
  alternative: 我们对上帝的爱；或有意兼含双向意义
  rationale: 罗马书8:31—39着重上帝为其子民所采取的行动，因此主观属格最合语境；但希腊文形式本身没有把关系明说，正文不应消除这种张力。
- issue: “在弥赛亚耶稣里”修饰什么
  choice: 将其明确置于“爱”的名词短语之内
  alternative: 将其理解为信徒在弥赛亚耶稣里的身份或领域
  rationale: 希腊文 τῆς ἐν Χριστῷ Ἰησοῦ 紧接并限定“爱”；中文采用“上帝那在……里的爱”保留这一语法联系，同时不进一步解释“在……里”的具体机制。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“无论……还是……”自然承接原文连续的 οὔτε 结构；“上帝那在……里的爱”略带庄重色彩，但能准确保留希腊文中介词短语对“爱”的限定。
