  text: εἰς τοῦτο γὰρ ⸀Χριστὸς ⸀ἀπέθανεν καὶ ἔζησεν ἵνα καὶ νεκρῶν καὶ ζώντων κυριεύσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/009.yaml
  text: For to this end Messiah died and lived again[a], so that he might rule over both the dead and the living.
translation:
  language: zh_hans
  text: 因为弥赛亚为此死了，又活了[a]，为要掌管死人和活人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“活过来”。希腊原文直译为“死了，又活了”；上下文表明这是指复活后的生命。
    reason: 保留ἔζησεν较直译的措辞，并说明其在上下文中的复活含义。
lexical_decisions:
- source_word: εἰς τοῦτο
  choice: 正是为此
  rationale: 该短语表示目的或目标；“正是为此”自然地保留了目的指向，也与后面的ἵνα目的从句相呼应。
- source_word: γὰρ
  choice: 因为
  rationale: γάρ承接上文并提供解释或根据；“因为”符合本节在论证中的功能。
- source_word: Χριστὸς
  choice: 弥赛亚
  rationale: Χριστός在此作为耶稣的称号，指受膏者；译作“弥赛亚”明确传达其称号含义。
- source_word: ἀπέθανεν
  choice: 死了
  rationale: 不定过去时直陈语气，直接陈述已经发生的死亡，无须扩译。
- source_word: ἔζησεν
  choice: 又活了
  rationale: 原文仅说“活了”，但它与“死了”并列，语境明显指死后生命；“又活了”保留简练表达，同时让中文读者听出复活含义。
- source_word: ἵνα
  choice: 好
  rationale: 引出目的；“好”在现代中文中简洁自然地表达“为要、使得”的目的关系。
- source_word: νεκρῶν καὶ ζώντων
  choice: 死人和活人
  rationale: 两个复数实体化形式彼此对举；“死人和活人”简明保留这种全面性的对照。
- source_word: κυριεύσῃ
  choice: 统管
  rationale: 该动词表示作主、掌权或治理；“统管”直接表达实际的主权和管辖，同时保持其动词形式。
theological_decisions:
- issue: ἔζησεν是否应明确译为复活
  choice: 正文译“又活了”，脚注说明也可译“活过来”
  alternative: 复活了
  rationale: “死了，又活了”的上下文蕴含复活，但原动词本身是“活”；正文不把隐含意义完全改写为明确的“复活”，从而保留原文措辞与神学张力。
- issue: κυριεύσῃ的主权含义
  choice: 统管死人和活人
  alternative: 作死人和活人的主
  rationale: “统管”保留原文的动词性质和掌权含义，避免把动词直接改写成称号，同时仍清楚表达弥赛亚对死者与生者的主权。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“正是为此”凸显目的，“好统管”保持句子紧凑；“死人和活人”是普通读者容易理解的对举表达。
