    issue: σκανδαλίζεται译作“陷入罪中”过度释义。
    rationale: 该词在此处的核心是受绊、被诱陷或受冒犯；“陷入罪中”选择了其中较强且更具体的解释，未保留原文的语义开放性。
  - severity: medium
    issue: b脚注的文本异文说明及其锚点不可靠。
    rationale: 所给SBLGNT正文没有为此处提供需在译文中标示的异文说明；并且脚注锚点只置于“变得软弱”后，文本却称省略“陷入罪中或变得软弱”，锚定范围不清。删除该脚注可避免引入未经本任务资料支持的文本批注。
  - severity: low
