  text: καλὸν τὸ μὴ φαγεῖν κρέα μηδὲ πιεῖν οἶνον μηδὲ ἐν ᾧ ὁ ἀδελφός σου προσκόπτει ⸂ἢ σκανδαλίζεται ἢ ἀσθενεῖ⸃·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/021.yaml
  text: It is good not to eat meat or drink wine or do anything by which your brother stumbles or is offended or is weakened[a].
translation:
  language: zh_hans
  text: 不吃肉、不喝酒，也不做任何会使你的弟兄[a]跌倒、受绊倒或变得软弱的事，这才是好的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“弟兄”按语境也可包括姊妹，指一同信主的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: καλὸν
  choice: 都是好的
  rationale: 这里评价克制自己的做法在道德上是合宜、可取的；“好的”自然保留了原词宽泛的评价意义。
- source_word: τὸ μὴ φαγεῖν κρέα
  choice: 不吃肉
  rationale: 准确表达冠词化不定式所指的行为，并按现代汉语习惯简洁表述。
- source_word: μηδὲ πιεῖν οἶνον
  choice: 不喝酒
  rationale: μηδέ继续列举自愿不做的事；“不喝酒”自然、明确。
- source_word: μηδὲ ἐν ᾧ
  choice: 也不做任何使……的事
  rationale: 希腊文此处省略了与前文平行的行为成分；汉语需要适度补足，“不做任何……的事”显明其泛指任何造成伤害的行为，而不增添具体禁令。
- source_word: ὁ ἀδελφός σου
  choice: 你的弟兄
  rationale: 保留阳性单数形式及初期基督徒群体中的亲属称谓；脚注说明在语境中可涵盖姊妹。
- source_word: προσκόπτει
  choice: 跌倒
  rationale: 保留碰绊而跌倒的伦理和属灵隐喻，符合本段谈论对他人信心与行为造成妨碍的语境。
- source_word: σκανδαλίζεται
  choice: 陷入罪中
  rationale: 被动形式表示因外在诱因而受绊或落入圈套；此译法与前面的“跌倒”有所区分，并在伦理语境中自然传达受诱而犯罪的含义。
- source_word: ἀσθενεῖ
  choice: 变得软弱
  rationale: 保留动词“软弱”的宽泛性，并由上下文指向信心或良心受到削弱，而不在正文中把具体层面说死。
theological_decisions:
- issue: ἀδελφός是否按语境作包容性翻译
  choice: 正文译作“你的弟兄”，脚注说明也可包括姊妹
  alternative: 你的弟兄或姊妹；与你一同信主的人
  rationale: 原文是阳性单数，但在群体伦理语境中具有代表性。正文保留其语法和亲属意象，脚注交代所指范围，既不缩窄对象，也不抹平原文形式。
- issue: 三个结果动词之间既重叠又有区别
  choice: 跌倒、陷入罪中、变得软弱
  alternative: 绊倒、受冒犯、软弱
  rationale: 译文保留三个并列结果，不把它们合并为同一概念；同时避免把σκανδαλίζεται仅译成现代汉语中偏重情绪感受的“受冒犯”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句末“都是好的”统摄前面三项克制行为；“肉”和“酒”保持具体，“任何……的事”则自然补足希腊文省略结构。
