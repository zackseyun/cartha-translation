- from: 不吃肉，不喝酒，也不做任何使你的弟兄[a]跌倒、陷入罪中或变得软弱[b]的事，都是好的。
  to: 不吃肉、不喝酒，也不做任何会使你的弟兄[a]跌倒、受绊倒或变得软弱的事，这才是好的。
  rationale: 修订以“受绊倒”较直接对应 σκανδαλίζεται 的被动、受绊含义，不把其限定为“陷入罪中”；保留与 προσκόπτει 及 ἀσθενεῖ 的三重并列。删除无充分依据且锚定不清的文本异文脚注，并微调句式，使 καλόν 对整体行为的评价在现代汉语中更明确。
