  text: γέγραπται γάρ· Ζῶ ἐγώ, λέγει κύριος, ὅτι ἐμοὶ κάμψει πᾶν γόνυ, καὶ ⸂πᾶσα γλῶσσα ἐξομολογήσεται⸃ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/011.yaml
  text: 'For it is written: “As I live[a], says the Lord, every knee will bow to me, and every tongue will confess to God.”'
translation:
  language: zh_hans
  text: 因为经上记着：“主说：‘我凭着我的生命起誓：所有的膝盖都要向我屈膝，万口都要向上帝承认[a]。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“公开承认”或“认信”；也可理解为“称颂上帝”。希腊语这个动词可含公开承认、认信或称颂的意思，具体侧重须视语境而定。
    reason: 保留ἐξομολογήσεται在本语境中可能具有的多重语义。
lexical_decisions:
- source_word: γέγραπται
  choice: 经上记着
  rationale: 这是引述圣经的惯用表达，也保留了完成时被动态所强调的经文既已写下、如今仍具权威的意味。
- source_word: Ζῶ ἐγώ
  choice: 我指着我的永生起誓
  rationale: 直译是“我活着”，但在这里是上帝以自己的永生作保证的庄严誓言格式；此译法用现代汉语清楚传达其语用功能。
- source_word: κύριος
  choice: 主
  rationale: 按希腊文本译为“主”，不因其引自以赛亚书中的上帝宣告而在正文中改作“耶和华”。
- source_word: ἐμοὶ
  choice: 向我
  rationale: 直接表达与格的指向，并与下文“向上帝”形成既对应又不完全相同的措辞。
- source_word: κάμψει πᾶν γόνυ
  choice: 万膝都必……跪拜
  rationale: 保留“膝”的身体意象；“跪拜”自然表达屈膝所表示的降服和敬拜。
- source_word: πᾶσα γλῶσσα
  choice: 万口
  rationale: “万口”是自然、庄重的汉语转喻，保留人人公开发声的身体意象；“万舌”在现代汉语中较生硬。
- source_word: ἐξομολογήσεται
  choice: 必……承认
  rationale: 该动词可表示公开承认、认信或称颂；“承认”在此最能保持宽广含义，其他语义可能性以脚注保留。
- source_word: τῷ θεῷ
  choice: 向上帝
  rationale: 明确保留与格的指向，并忠实呈现保罗在前句“向我”之后改用“向上帝”的原文措辞。
theological_decisions:
- issue: 引文中“主”“我”与“上帝”的关系
  choice: 保留“主说……向我……向上帝”的措辞变化，不在译文中协调所指。
  alternative: 把末句改成“向我承认”，或在正文中明确说明这里的“主”就是耶稣。
  rationale: 希腊文本本身从第一人称的“向我”转为“向上帝”。译文应保留这种形式及其神学张力，而不以释义代替翻译。
- issue: Ζῶ ἐγώ的誓言性质
  choice: 译为“我指着我的永生起誓”。
  alternative: 较形式化地译为“我活着”或“我既活着”。
  rationale: 该短语在神圣宣告中具有誓言公式的功能；明确译出“起誓”可避免现代读者误解为普通的生命陈述，同时不改变誓言以主自身的生命为凭据这一内容。
translation_notes:
  register: 采用现代、庄重而易懂的经文语体。“经上记着”“万膝”“万口”保留引文的圣经回响；“跪拜”与“承认”则避免过分古雅。脚注标记紧随其所解释的“承认”。
