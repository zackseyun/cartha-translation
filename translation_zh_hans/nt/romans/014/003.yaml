  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ ἐσθίων τὸν μὴ ἐσθίοντα μὴ ἐξουθενείτω, ⸂ὁ δὲ⸃ μὴ ἐσθίων τὸν ἐσθίοντα μὴ κρινέτω, ὁ θεὸς γὰρ αὐτὸν προσελάβετο.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/003.yaml
  text: The one who eats must not despise the one who does not eat[a], and the one who does not eat must not judge the one who eats[c][b], for God has welcomed him.
translation:
  language: zh_hans
  text: 吃的人不可轻视不吃的人[a]；不吃的人也不可论断吃的人[b]，因为上帝接纳了他[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “轻视”也可译作“藐视”或“看不起”。
    reason: lexical_alternative
  - marker: b
    text: “论断”也可译作“评断”。这里不一定专指“定罪”。
    reason: lexical_alternative
  - marker: c
    text: “接纳”也可译作“接受”或“迎接”。原词可含有欢迎某人进入交往关系的意味。“他”在语法上最直接指前面的“吃的人”，但本节的相互劝诫也使这个理由可应用于双方。
    reason: lexical_and_referential_ambiguity
lexical_decisions:
- source_word: ὁ ἐσθίων
  choice: 吃的人
  rationale: 定冠词加现在分词作名词用，指以“吃”为特征的一类人；“吃的人”自然、简洁，并与下文形成对称。
- source_word: τὸν μὴ ἐσθίοντα
  choice: 不吃的人
  rationale: 紧贴希腊文的否定分词结构，不在本节正文中擅自补充“不吃某些食物”或“只吃素食”等解释。
- source_word: ἐξουθενείτω
  choice: 不可轻视
  rationale: 该词表示把人看作无足轻重、以轻蔑态度对待；“轻视”在现代汉语中自然，并保留禁令的力度。
- source_word: ὁ δὲ μὴ ἐσθίων
  choice: 不吃的人也
  rationale: δέ带出对照；汉语以“也”构成相互对应的禁令，既流畅又清楚表达双方都不可如此。
- source_word: κρινέτω
  choice: 不可论断
  rationale: κρίνω在此指对同伴作负面评断；“论断”保留较宽的语义，不把含义收窄为最终的“定罪”。
- source_word: ὁ θεὸς
  choice: 上帝
  rationale: 直译主语；“上帝”是现代标准汉语中清楚、庄重的对应表达。
- source_word: γὰρ
  choice: 因为
  rationale: 明确表达后一分句是前面两项禁令的理由，符合自然现代汉语。
- source_word: αὐτὸν
  choice: 他
  rationale: 保留希腊文单数阳性代词，不在正文中消解其可能主要回指“吃的人”而论证又可适用于双方的张力。
- source_word: προσελάβετο
  choice: 接纳了
  rationale: 该动词在此有接受、欢迎某人进入交往关系之意；“接纳”兼具接受与关系性的含义，也与罗马书十四章和十五章的语境相称。
theological_decisions:
- issue: 吃与不吃所指的范围
  choice: 正文只译为“吃”与“不吃”
  alternative: 明确译成“什么都吃”与“禁戒某些食物”，或“吃肉”与“吃素”
  rationale: 上下文涉及食物实践的争议，但本节本身只采用吃与不吃的概括说法；译文不把上下文推断加入正文。
- issue: “他”的所指
  choice: 保留单数代词“他”
  alternative: 译成“这个人”或明确解释为“吃的人”；也可泛化为“他们”
  rationale: 就紧邻语法而言，代词可回指“吃的人”，但整段互惠式论证也使上帝接纳同伴这一理由适用于双方。保留“他”最能保存原文形式与其解释张力。
- issue: 上帝“接纳”的关系性含义
  choice: 译作“接纳了”
  alternative: 译作“接受了”或“欢迎了”
  rationale: “接纳”既不只表示赞同某种行为，也能传达将人接入团契关系的意味；同时不额外规定这种接纳的教派性内涵。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。两个分句保持平行结构，以“轻视”与“论断”区分双方不同的错误态度；不用较古雅的“藐视”作正文，也不把食物争议的具体内容加入本节。
