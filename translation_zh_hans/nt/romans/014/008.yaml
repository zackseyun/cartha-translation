  naturalness: “向主而活／向主而死”可懂，但在现代标准汉语中略显生硬。“为主而活／为主而死”是自然、庄重且惯用的对应表达；脚注应说明此处“为”不应狭义限定为目的或利益，而保留原文与格的关系、朝向及归属意味。
  terminology: “主”准确保留 κύριος 的称号，不应在正文擅加“耶稣”或“主人”。将结语译为“属于主”准确传达 τοῦ κυρίου ἐσμέν 的归属义。
