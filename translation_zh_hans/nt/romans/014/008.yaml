  to: 因为我们若活着，是为主而活；若死，是为主而死。所以，无论我们活着或死去，我们都属于主。
  rationale: 修订以“若活／若死”恢复原文概括性条件句的平行，以自然的现代汉语“为主而活／为主而死”替换生硬的“向主而活／向主而死”，并通过脚注保留与格的宽广语义。结语改为“我们都属于主”，清楚自然地表达原文的归属结构。脚注锚点a仍置于首个“活着”后，覆盖两处重复表达；锚点b置于结语后。
