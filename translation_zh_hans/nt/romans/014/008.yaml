id: ROM.14.8
reference: Romans 14:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐάν τε γὰρ ζῶμεν, τῷ κυρίῳ ζῶμεν, ἐάν τε ἀποθνῄσκωμεν, τῷ κυρίῳ ἀποθνῄσκομεν. ἐάν τε οὖν ζῶμεν ἐάν τε ἀποθνῄσκωμεν, τοῦ κυρίου ἐσμέν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/008.yaml
  text: For if we live[a], we live to the Lord, and if we die, we die to the Lord. So then, whether we live or whether we die[b], we are the Lord’s.
translation:
  language: zh_hans
  text: 因为我们若活着，是为主而活；若死，是为主而死。所以，无论我们活着或死去，我们都属于主。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐάν τε γὰρ
  choice: 因为……若
  rationale: 保留 γάρ 对上文的解释关系，并用现代汉语自然的条件句表达 ἐάν τε 所引出的成对情形。
- source_word: ζῶμεν / ζῶμεν
  choice: 我们若活着／（我们）活
  rationale: 两处均一致译出 ζάω；前者处于条件句中，后者陈述人在这种情形下与主的关系。
- source_word: τῷ κυρίῳ
  choice: 向主
  rationale: 与“而活／而死”连用，尽量保留希腊语与格所表达的关系和朝向，不把含义限定为单纯的目的、服事或利益。
- source_word: κύριος
  choice: 主
  rationale: 保留 κύριος 的称号及其神学分量；上下文指向主耶稣，但正文不加入希腊文未明说的名字。
- source_word: ἀποθνῄσκωμεν / ἀποθνῄσκομεν
  choice: 我们若死了／（我们）死
  rationale: 按一般、概括性的意义译为“死”，不误译成正在持续的死亡过程。
- source_word: οὖν
  choice: 所以
  rationale: 清楚表达由前两个平衡分句所得出的结论，符合现代汉语论述习惯。
- source_word: τοῦ κυρίου ἐσμέν
  choice: 都是主的
  rationale: 简洁保留属格的归属意味；“都属于主”是意思明确但稍作展开的译法。
theological_decisions:
- issue: 本节 κύριος 的所指与表达力度
  choice: 保留称号“主”，不在正文中进一步指明
  alternative: 明确译作“主耶稣”或译作强调权柄的“主人”
  rationale: 紧接的罗马书14:9使所指倾向基督，但本节原文只用“主”；保留该称号既符合上下文，也不超出原文。
- issue: “向主而活／向主而死”的关系含义
  choice: 采用“向主”，保留朝向、关联和归属等较宽的含义
  alternative: 译作“为主而活／为主而死”，突出目的或受益关系
  rationale: 重复的与格结构和末句“都是主的”共同表达生命与死亡都处于对主的关系及归属之中，不宜只收窄为服事或目的。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。平衡重复“若活着／若死了”和“向主而活／向主而死”，以呈现原文的修辞结构；末句用“都是主的”保持简洁有力。
