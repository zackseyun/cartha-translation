  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οὐ γάρ ἐστιν ἡ βασιλεία τοῦ θεοῦ βρῶσις καὶ πόσις, ἀλλὰ δικαιοσύνη καὶ εἰρήνη καὶ χαρὰ ἐν πνεύματι ἁγίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/017.yaml
  text: For the kingdom of God is not eating and drinking[a], but righteousness and peace and joy in the Holy Spirit.
translation:
  language: zh_hans
  text: 因为神的国不在于吃喝，而在于圣灵里的公义[a]、和平与喜乐。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“正义”。希腊词 δικαιοσύνη 可表示“公义”或“正义”；正文采用保罗书信中通常的译法。
    reason: lexical_alternative
lexical_decisions:
- source_word: βασιλεία τοῦ θεοῦ
  choice: 神的国
  rationale: 采用现代中文基督教语境中自然且广为理解的表达；“国”既可涵盖神的统治，也保留这一固定神学概念的广度。
- source_word: βρῶσις καὶ πόσις
  choice: 吃喝
  rationale: 两个名词在此指吃与喝的行为；译作“吃喝”简洁自然，也符合本章有关饮食争议的上下文。
- source_word: δικαιοσύνη
  choice: 公义
  rationale: “公义”能表达在神面前及人际伦理上的正直，是保罗书信中 δικαιοσύνη 的稳妥常用译法；其“正义”义项以脚注保留。
- source_word: εἰρήνη
  choice: 和平
  rationale: 既保留“和平”的基本意义，也适合本章强调群体和睦的语境。
- source_word: χαρά
  choice: 喜乐
  rationale: “喜乐”是庄重而自然的现代中文表达，符合保罗书信中的用法。
- source_word: ἐν πνεύματι ἁγίῳ
  choice: 在圣灵里的
  rationale: 保留介词 ἐν 所含的领域或作用含义，并按保罗通常用法将 πνεῦμα ἅγιον 理解为圣灵；中文结构使其自然地统摄“公义、和平与喜乐”。
- source_word: γάρ
  choice: 因为
  rationale: 清楚表达本节对前文劝勉的解释关系，符合现代汉语行文。
theological_decisions:
- issue: δικαιοσύνη 在本节中的译法
  choice: 公义
  alternative: 正义
  rationale: “公义”保留该词在保罗语境中的神学与伦理广度；“正义”也在其语义范围内，但若直接放入正文，较容易把含义收窄为社会或司法层面的正义，因此置于脚注。
- issue: ἐν πνεύματι ἁγίῳ 的修饰范围
  choice: 理解为统摄公义、和平与喜乐
  alternative: 只修饰喜乐
  rationale: 希腊语末尾介词短语在句法上存在贴近“喜乐”的可能，但也可自然地说明前三项共同所在的领域或来源；正文采用中文中较顺畅的整体修饰，同时不把 ἐν 单一解释为纯粹工具性的“借着”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不在于……而在于……”自然传达希腊文“不是……而是……”的对比，避免让“神的国”与吃喝行为形成生硬的等同句；“圣灵里的”保留原文介词短语的开放性。
