source:
  edition: SBLGNT
  text: μὴ ἕνεκεν βρώματος κατάλυε τὸ ἔργον τοῦ θεοῦ. πάντα μὲν καθαρά, ἀλλὰ κακὸν τῷ ἀνθρώπῳ τῷ διὰ προσκόμματος ἐσθίοντι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/020.yaml
  text: Do not[a], for the sake of food, tear down the work of God. All things are indeed clean[b], but it is evil for the person who eats in a way that causes stumbling.
translation:
  language: zh_hans
  text: 不要为了食物拆毁上帝的工作。一切固然都是洁净的[a]，但人若吃而使人跌倒[b]，这对他就是恶事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 上下文谈论食物，因此也可译作：“各种食物固然都是洁净的。”
    reason: 说明πάντα在语境中的范围，同时保留正文较宽的原文措辞。
  - marker: b
    text: 或译：“但人若因绊脚之事而吃，对他来说就是恶事。”希腊文措辞较概括；在本段语境中可理解为这种吃法使别人跌倒。
    reason: 保留διὰ προσκόμματος在句法和指向上的凝练与一定歧义。
lexical_decisions:
- source_word: ἕνεκεν βρώματος
  choice: 为了食物
  rationale: ἕνεκεν加属格表示缘由或动机；“为了食物”自然地保留了不应因食物而损害更重要之事的对比。
- source_word: κατάλυε
  choice: 拆毁
  rationale: 保留动词“拆除、瓦解”的建筑性比喻，与上帝正在成就的“工作”相呼应；μή加现在时命令语气表达禁止。
- source_word: τὸ ἔργον τοῦ θεοῦ
  choice: 上帝的工作
  rationale: 直译属格结构，保留所指的宽度，可涵盖上帝在信徒个人及群体中所做的事。
- source_word: πάντα μὲν καθαρά
  choice: 一切固然都是洁净的
  rationale: “一切”保留πάντα的广度，“固然”体现μέν的让步铺垫，“洁净”保留礼仪与纯洁范畴的用语；上下文表明主要所论的是食物。
- source_word: κακὸν
  choice: 恶事
  rationale: 保留κακόν鲜明的道德分量，又使中文谓语表达自然。
- source_word: τῷ ἀνθρώπῳ
  choice: 对他来说
  rationale: 前面的“人”表达泛指单数，后用“他”承接，在现代中文中自然，并保留原文单数结构。
- source_word: διὰ προσκόμματος ἐσθίοντι
  choice: 人若吃了会使人跌倒
  rationale: 以自然中文表达这种吃法与“绊倒”之间的关系，并保留跌倒的比喻；脚注注明希腊语短语在关系指向上的概括性。
theological_decisions:
- issue: “洁净”的范围及其与食物条例、信徒自由的关系
  choice: 正文译作“一切固然都是洁净的”，由上下文限定其主要涉及食物。
  alternative: 译作“各种食物固然都是洁净的”或“一切都是可以吃的”。
  rationale: 原文πάντα没有明说“食物”，καθαρά也应保留“洁净”这一范畴，不宜直接解释成“许可”；脚注说明语境，既清楚又不缩窄原文。
- issue: διὰ προσκόμματος所表达的跌倒关系
  choice: 正文译作“吃了会使人跌倒”，突出本段对弟兄受损的关切。
  alternative: 译作“因绊脚之事而吃”或“在吃的事上跌倒”。
  rationale: 上下文尤其14:13、14:15和14:21支持“使别人跌倒”的理解，但希腊文措辞较凝练，并未明说跌倒者是谁，因此用脚注保留较宽泛的可能。
- issue: 泛指单数ἄνθρωπος的表达
  choice: 用“人”表达其泛指意义，并以“他”承接。
  alternative: 用“那个人”或重复“这人”。
  rationale: ἄνθρωπος在这里泛指任何这样吃的人，并非强调男性身份；现代汉语“人……他”既自然，又保留单数指称。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“拆毁”保留原文比喻，“洁净”保留纯洁范畴的神学张力；避免把经文扩写成特定宗派对饮食条例或基督徒自由的系统性结论。
