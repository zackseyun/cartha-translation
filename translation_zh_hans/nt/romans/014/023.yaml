  text: ὁ δὲ διακρινόμενος ἐὰν φάγῃ κατακέκριται, ὅτι οὐκ ἐκ πίστεως· πᾶν δὲ ὃ οὐκ ἐκ πίστεως ἁμαρτία ⸀ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/023.yaml
  text: But the one who doubts is condemned if he eats[a], because it is not from faith; and everything that is not from faith is sin.
translation:
  language: zh_hans
  text: 但那心里疑惑的人若吃了，就被定罪，因为他这样做不是出于信心[a]；凡不是出于信心的，都是罪。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “出于信心”也可按本处语境译为“出于确信”；指人在上帝面前按坚定的确信而行。
    reason: lexical_alternative
lexical_decisions:
- source_word: διακρινόμενος
  choice: 心里疑惑的人
  rationale: 本段讨论饮食上的顾忌；这里指人内心迟疑、不能确定，而不是与别人争辩。“心里疑惑”自然表达这种内在摇摆。
- source_word: ἐὰν φάγῃ
  choice: 若吃了
  rationale: ἐάν加虚拟语气表示条件事件；“若吃了”保留条件含义，也符合现代汉语表达。
- source_word: κατακέκριται
  choice: 就被定罪
  rationale: 完成时被动语态表达行为所导致的定罪状态；保留被动说法，不明指施事者。
- source_word: ἐκ πίστεως
  choice: 出于信心
  rationale: 保留希腊文“从信心而出”的表达和保罗的核心用语，同时通过脚注说明本语境也涉及人在上帝面前的确信。
- source_word: πᾶν ... ὃ
  choice: 凡……的事
  rationale: 以自然汉语表达中性单数关系结构的概括性和全面性。
- source_word: ἁμαρτία ἐστίν
  choice: 都是罪
  rationale: 保留谓语名词的直接断言，比译作“是有罪的”更贴近原文的力度。
theological_decisions:
- issue: 在带有道德判断的保罗语境中如何翻译 πίστις
  choice: 信心
  alternative: 确信；信靠；忠信
  rationale: 上下文确实包含个人在上帝面前的确信，但“信心”能保留保罗更广泛的神学词汇，不把含义缩减为主观意见；语境中的“确信”义由脚注说明。
- issue: κατακέκριται 所指的定罪范围与施事者
  choice: 被定罪
  alternative: 被自己定罪；在上帝面前被定罪
  rationale: 希腊文使用被动语态，却没有明说谁施行定罪，因此译文不限定是上帝的审判、良心的定罪，还是两者兼有，以保留原文的张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“心里疑惑”明确是内在迟疑；分号保留原文从具体饮食情形转向普遍原则的推进。
