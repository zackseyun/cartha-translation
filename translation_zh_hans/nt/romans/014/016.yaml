base_translation:
  language: en
  yaml_path: translation/nt/romans/014/016.yaml
  text: Therefore[a], do not let your good be spoken of as evil.
translation:
  language: zh_hans
  text: 所以，不要让你们的善被人说成恶[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“受到毁谤”或“受到辱骂”。这里的希腊语动词指用侮辱、贬损或诽谤的话谈论某事；直译可作“被亵渎”，但现代汉语中的“亵渎”容易让人以为对象特指神圣之物。
    reason: 词义备选
lexical_decisions:
- source_word: μὴ … βλασφημείσθω
  choice: 不要让……被人说成恶
  rationale: μή与现在时被动命令式连用，表达禁止；“不要让”符合现代汉语。“被人说成恶”保留被动含义，也传达以贬损、毁谤的话把善说成恶的意思。
- source_word: οὖν
  choice: 所以
  rationale: οὖν承接上文并引出推论；“所以”在现代汉语中自然、清楚。
- source_word: ὑμῶν
  choice: 你们的
  rationale: 属格代词修饰τὸ ἀγαθόν，表示与收信人有关或为他们所有；“你们的”既简洁，也不限定具体所指。
- source_word: τὸ ἀγαθόν
  choice: 善
  rationale: 中性单数形容词在此作名词使用，意为“善”或“好处”。译作“善”保持原文的概括性，不擅自限定为“自由”“权利”或“益处”。
theological_decisions:
- issue: “你们的善”（ὑμῶν τὸ ἀγαθόν）具体指什么
  choice: 保留为概括性的“你们的善”
  alternative: 你们的自由／你们的权利／你们所得的好处
  rationale: 原文没有明确限定其所指；在上下文中，它可能包括信徒在争议事项上的自由、所得的益处或所持守的好原则。概括性译法可保留这种解释空间和劝勉中的张力。
translation_notes:
  register: 采用现代、简洁而庄重的普通话。“你们的善”略带凝练的书面色彩，以保留原文τὸ ἀγαθόν的宽泛含义；“被人说成恶”则以自然汉语清楚呈现言语贬损的动作。
