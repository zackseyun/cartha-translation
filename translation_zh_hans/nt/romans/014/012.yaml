  text: ⸀ἄρα ἕκαστος ἡμῶν περὶ ἑαυτοῦ λόγον ⸀δώσει.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/012.yaml
  text: So then[a], each of us will give an account of himself.
translation:
  language: zh_hans
  text: 这样看来，我们各人都要为自己[a]交账。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“关于自己”，也可译作“就自己的事”。
    reason: 说明περὶ ἑαυτοῦ的字面意义及可行的汉语表达，保留“为自己”与“关于自己”之间的语义张力。
lexical_decisions:
- source_word: ἄρα
  choice: 这样看来
  rationale: 表示由上文得出的推论；“这样看来”在现代汉语中自然地保留了承接和总结的逻辑作用。
- source_word: ἕκαστος ἡμῶν
  choice: 我们各人
  rationale: 准确表达ἕκαστος的逐一分配意义和ἡμῶν的部分属格，即我们当中的每一个人。
- source_word: περὶ ἑαυτοῦ
  choice: 为自己
  rationale: περί加属格本义是“关于自己”；在“交账”这一汉语搭配中译作“为自己”较自然，同时保留每个人须就自身负责的含义，并以脚注说明较直译的表达。
- source_word: λόγον δώσει
  choice: 交账
  rationale: 这是表示提交说明、接受审查的惯用语；“交账”简洁地传达司法或评断语境中的问责含义，优于逐字译为“给出话语”。
theological_decisions:
- issue: 是否明说交账的对象是上帝
  choice: 不在正文补出对象
  alternative: 向上帝交账
  rationale: 本节希腊文没有明说间接宾语；上文虽提供上帝审判的语境，正文仍不补入原文未明说的成分，以免消除原句的简练表达。
- issue: 单数反身代词的普遍适用范围
  choice: 自己
  alternative: 各自的事
  rationale: ἑαυτοῦ是与“各人”相应的单数反身代词。汉语“自己”既保留逐一个体承担责任的形式，也自然适用于所有人，无须引入性别标记。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“交账”是常用的问责表达，保留原文的审判语境；脚注标记紧接“为自己”，明确其对应范围。
