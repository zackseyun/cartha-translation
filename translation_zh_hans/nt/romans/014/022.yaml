  text: σὺ πίστιν ⸀ἣν ἔχεις κατὰ σεαυτὸν ἔχε ἐνώπιον τοῦ θεοῦ. μακάριος ὁ μὴ κρίνων ἑαυτὸν ἐν ᾧ δοκιμάζει·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/022.yaml
  text: The faith that you have[a], keep to yourself before God[b]. Blessed is the one who does not judge himself by what he approves.
translation:
  language: zh_hans
  text: 你所持有的信心[a]，要在上帝面前只为自己持守。那不因自己所认可的事而定自己的罪的人[b]，是有福的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你所持有的确信”。这里的“信心”可指人在这些有争议的事上所持的个人确信。
    reason: lexical_alternative
  - marker: b
    text: “定自己的罪”或译：“评断自己”。此处可含因自己所认可的事而自我定罪的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστιν
  choice: 信心
  rationale: 沿用 πίστις 的常规译法，同时由上下文限定为人在争议事项上、在上帝面前所持的个人确信；另一可能译法“确信”收入脚注。
- source_word: κατὰ σεαυτὸν
  choice: 自己保留
  rationale: 该短语在此表示将这种信心或确信留作个人持守，不强加给别人；“自己保留”在现代汉语中自然，并避免误解为向上帝隐瞒。
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: 在上帝面前
  rationale: 保留原文所表达的上帝临在与垂察，也显明这种个人确信仍须向上帝负责。
- source_word: μακάριος
  choice: 有福的
  rationale: 比“快乐的”更能保留原词在伦理与神学语境中的分量。
- source_word: κρίνων ἑαυτὸν
  choice: 评断自己
  rationale: 保留 κρίνω 可指判断、也可在语境中带有定罪意味的张力；“定自己的罪”作为语境较强的可能译法列入脚注。
- source_word: ἐν ᾧ δοκιμάζει
  choice: 在自己所认可的事上
  rationale: δοκιμάζω 在此指经过衡量后认可；“在……事上”保留 ἐν 所表达的范围，并符合自然汉语。
theological_decisions:
- issue: 争议事项语境中 πίστις 的含义
  choice: 正文译作“信心”，按上下文理解为人在有关事项上、在上帝面前所持的个人确信
  alternative: 译作“确信”，明确突出伦理判断和良心层面的含义
  rationale: 上下文谈论可争议的实践与良心，而非专门界定使人得救的信心；保留关键术语“信心”，同时用脚注呈现语境义，可兼顾词汇一致性与可理解性。
- issue: κρίνων ἑαυτὸν 是否具有定罪含义
  choice: 正文译作“评断自己”
  alternative: 译作“定自己的罪”
  rationale: 原词本身可涵盖判断与定罪；本节语境容许较强的自我定罪意味，但正文不宜把这种语境含义绝对化，故保留较宽译法并在脚注列出较强译法。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“在上帝面前自己保留”分别呈现 κατὰ σεαυτόν 与 ἐνώπιον τοῦ θεοῦ，既表达个人持守，也保留向上帝负责之意；第二句保留“评断”与“定罪”之间的语义张力。
