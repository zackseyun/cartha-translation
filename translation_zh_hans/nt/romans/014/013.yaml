  text: Μηκέτι οὖν ἀλλήλους κρίνωμεν· ἀλλὰ τοῦτο κρίνατε μᾶλλον, τὸ μὴ τιθέναι πρόσκομμα τῷ ἀδελφῷ ἢ σκάνδαλον.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/013.yaml
  text: 'Therefore, let us no longer judge one another, but rather decide this: not to put a stumbling block or an offense before a brother.'
translation:
  language: zh_hans
  text: 所以，我们不要再彼此论断；倒要决定这事：不要在弟兄[a]面前放置绊脚石或陷阱[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“弟兄或姐妹”；希腊原文用单数“弟兄”，这里指同为信徒的人。
    reason: alternative_reading
  - marker: b
    text: 或译“使人跌倒的诱因”或“使人犯罪的事物”。这里不是仅指伤害别人的感情，而是指使别人陷入罪或属灵跌倒的事物。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μηκέτι
  choice: 不要再
  rationale: 表达停止已有行为的劝勉语气，与第一人称复数劝勉虚拟式自然衔接。
- source_word: οὖν
  choice: 所以
  rationale: 标明本节是从上文论证推出的劝勉；现代汉语自然，同时保留推论关系。
- source_word: ἀλλήλους
  choice: 彼此
  rationale: 准确表达相互关系，简洁而符合劝诫文体。
- source_word: κρίνωμεν / κρίνατε
  choice: 评断／判断
  rationale: 用同根近义表达保留保罗的修辞转换：不再评断别人，却要对自己的行为作出判断。前者的“评断”带有对他人下判断的语境色彩，后者的“判断”指作出决定。
- source_word: ἀλλὰ τοῦτο κρίνατε μᾶλλον
  choice: 倒要作这样的判断
  rationale: “倒要”体现ἀλλά与μᾶλλον的转折和取舍，“这样的判断”引出后面的不定式内容。
- source_word: τὸ μὴ τιθέναι
  choice: 绝不……放置
  rationale: 表达所要作之判断的具体内容；“绝不”在劝勉语境中自然呈现否定决意，“放置”保留原文的空间意象。
- source_word: πρόσκομμα
  choice: 绊脚石
  rationale: 保留导致人绊倒的鲜明比喻，并可自然指向属灵或道德上的跌倒。
- source_word: τῷ ἀδελφῷ
  choice: 在弟兄面前
  rationale: 保留希腊文阳性单数“弟兄”，并用脚注说明此处泛指同为信徒的人；“在……面前”自然表达把障碍放在某人前面的意象。
- source_word: ἢ
  choice: 或
  rationale: 保留原文的选言结构，不强行把两个近义概念合并。
- source_word: σκάνδαλον
  choice: 使人跌倒的诱因
  rationale: 明确其在本节中是诱使另一位信徒陷入罪或属灵跌倒的事物，而不是现代汉语中单指冒犯感情；同时与“绊脚石”的具体意象有所区分。
theological_decisions:
- issue: ἀδελφῷ在代表性单数语境中的译法
  choice: 弟兄
  alternative: 弟兄或姐妹；同为信徒的人
  rationale: 正文保留原文阳性单数形式，不在正文中将其无痕中性化；脚注交代这里在语境中泛指同为信徒的人，包括弟兄姐妹。
- issue: σκάνδαλον在伦理劝勉中的语义
  choice: 使人跌倒的诱因
  alternative: 陷阱；使人犯罪的事物
  rationale: 这里所说的不是仅仅使人感到被冒犯，而是导致信徒陷入罪或属灵跌倒的因素。译文明确这一伦理和属灵力度，同时脚注保留“陷阱”等词源意象。
- issue: κρίνω在同一句中的重复与语义转换
  choice: 评断／判断
  alternative: 论断／定意
  rationale: 保留同一希腊词在句中的修辞呼应，也让汉语读者看出两种对象的区别：前半是对别人评断，后半是对自己应有的行为作判断。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“评断／判断”保留原文κρίνω的重复及语义转折；“绊脚石”保留传统而透明的比喻，“使人跌倒的诱因”则避免把σκάνδαλον误解为单纯的情感冒犯。
