id: ROM.14.7
reference: Romans 14:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Οὐδεὶς γὰρ ἡμῶν ἑαυτῷ ζῇ, καὶ οὐδεὶς ἑαυτῷ ἀποθνῄσκει·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/007.yaml
  text: For none of us lives for himself[a], and none dies for himself.
translation:
  language: zh_hans
  text: 因为我们没有一个人是为自己而活，也没有一个人是为自己而死。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为自己”也可较直译为“向自己”。这里的希腊语与格可能指以自己为目的、利益或归属所向。
    reason: 保留反身与格ἑαυτῷ的词义弹性，说明“为自己”是合乎语境而非唯一机械对应的译法。
lexical_decisions:
- source_word: Οὐδεὶς ... ἡμῶν
  choice: 我们没有一个人
  rationale: 准确表达部分属格结构“我们中没有人”，同时采用自然的现代汉语语序；第二分句按希腊文省略“我们”，但汉译补出相同结构以保持清晰和平行。
- source_word: γὰρ
  choice: 因为
  rationale: 承接上文，标明本节是在说明前述论断的理由；“因为”在现代汉语中自然地表达解释关系。
- source_word: ἑαυτῷ
  choice: 为自己
  rationale: 与“活、死”搭配时，自然表达以自己为目的或归属所指；同时不把下一节才明确出现的“主”提前加入本节。
- source_word: ζῇ
  choice: 活
  rationale: 用一般现在意义表达概括性的陈述，简洁自然。
- source_word: καὶ
  choice: 也
  rationale: 在否定平行句式“没有……也没有……”中，“也”比直译为“和”更符合现代汉语。
- source_word: ἀποθνῄσκει
  choice: 死
  rationale: 与“活”构成简洁对称的概括性陈述。
theological_decisions:
- issue: 两个ἑαυτῷ的意义
  choice: 为自己
  alternative: 向自己；只为自己
  rationale: 上下文指人的生与死并非以自己为最终指向，但希腊语与格本身具有一定弹性。“为自己”既自然，也保留目的、利益或归属指向之间的张力；不采用“只为自己”，以免增添原文没有明说的排他意味。
- issue: 是否在本节补明“为主”
  choice: 不补明
  alternative: 译成“没有人为自己活，乃是为主活”等解释性表述
  rationale: 第8节才明确说“为主而活、为主而死”。本节应保留自身的否定陈述，不提前化解其修辞推进和神学张力。
- issue: 希腊语阳性单数反身代词的汉语表达
  choice: 自己
  alternative: 他自己
  rationale: 现代汉语“自己”可自然承接“我们没有一个人”，不标示原文在此仅属语法性的阳性形式，也避免生硬重复；其所指范围仍是“我们”中的每一个人。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以“我们没有一个人……也没有一个人……”保留原文两个οὐδεὶς分句的强调和平行；“而活／而死”使“为自己”与谓语的关系清楚，并形成整齐节奏。
