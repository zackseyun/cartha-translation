  text: Ὃς ⸀μὲν κρίνει ἡμέραν παρ’ ἡμέραν, ὃς δὲ κρίνει πᾶσαν ἡμέραν· ἕκαστος ἐν τῷ ἰδίῳ νοῒ πληροφορείσθω·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/005.yaml
  text: One person judges one day above another day[a], while another judges every day alike[c][b]. Let each one be fully convinced in his own mind.
translation:
  language: zh_hans
  text: 有人看这一天比那一天重要[a]，另有人看每天都一样[b]。各人都应当在自己心里充分确信[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“有人认为这一天比那一天重要。”
    reason: lexical_alternative
  - marker: b
    text: 直译：“另有人看每一天。”按上下文，意思是他看每天都一样。
    reason: lexical_alternative
  - marker: c
    text: 或译：“完全确信”或“完全信服”。
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίνει
  choice: 看……重要／看……一样
  rationale: 此处指作出评价和区分，并非定罪。“看”在现代汉语中自然，也能配合上下两句的对比结构。
- source_word: ἡμέραν παρ’ ἡμέραν
  choice: 这一天比那一天重要
  rationale: παρά构成日与日之间的比较；译文明确其比较意味，却不擅自指定安息日、节期或禁食日。
- source_word: πᾶσαν ἡμέραν
  choice: 每天都一样
  rationale: 希腊文直译为“每一天”；按上下文的对比，第二种人不在日子之间作区别。“都一样”是语境所隐含的意思。
- source_word: ἕκαστος
  choice: 各人
  rationale: 保留原文单数分配性的重点，同时是自然、涵盖所有相关者的现代汉语。
- source_word: ἐν τῷ ἰδίῳ νοῒ
  choice: 在自己的心思里
  rationale: νοῦς指人的心思、思想或理解判断的能力；“自己的心思”保留个人慎思与确信的意味。
- source_word: πληροφορείσθω
  choice: 要……确信
  rationale: 现在时被动命令式表达达到充分、稳固的把握；“确信”简洁自然，同时不把这种把握误译成客观无误。
theological_decisions:
- issue: 这里所说的“日子”具体指什么
  choice: 保留泛称“这一天／那一天／每天”
  alternative: 明确译作安息日、犹太节期、禁食日或特别敬虔的日子
  rationale: 本节没有明说所指为何；译文应保留原文的一般性及其解释空间。
- issue: πᾶσαν ἡμέραν是否明说“相同”
  choice: 正文译作“每天都一样”，并以脚注说明直译
  alternative: 正文只译作“每一天”
  rationale: “一样”虽无独立对应的希腊词，却由前一句的比较对照自然隐含；脚注保留形式上的透明度。
- issue: 个人确信的性质
  choice: 译作“各人都要在自己的心思里确信”
  alternative: 译作“各人可以自行决定”或“各人所想的都正确”
  rationale: 原文要求个人有充分把握，却没有宣称所有观点都同样正确，也没有取消其在主面前的责任。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“这一天比那一天”保留日与日之间的比较，不增添具体宗教日名称；“心思”比单用“心里”更能体现νοῦς的思想与判断层面。所有脚注标记均置于正文相应位置。
