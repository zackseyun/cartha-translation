  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ φρονῶν τὴν ἡμέραν κυρίῳ ⸀φρονεῖ. καὶ ὁ ἐσθίων κυρίῳ ἐσθίει, εὐχαριστεῖ γὰρ τῷ θεῷ· καὶ ὁ μὴ ἐσθίων κυρίῳ οὐκ ἐσθίει, καὶ εὐχαριστεῖ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/006.yaml
  text: The one who observes the day[a], observes it for the Lord. And the one who eats, eats for the Lord, for he gives thanks to God; and the one who does not eat, does not eat for the Lord, and he gives thanks to God.
translation:
  language: zh_hans
  text: 看重这日的人，是为主而看重[a]；吃的人，是为主而吃，因为他感谢上帝；不吃的人，是为主而不吃，也感谢上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“守这日”或“顾念这日”。希腊语动词可指把心思放在某事上或加以重视；在这里很可能含有守某日的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: φρονῶν / φρονεῖ
  choice: 看重／看重
  rationale: φρονέω在此不只是心里想到，而是对某日加以重视、郑重看待。“看重”自然表达这种态度与实践，同时保留它可指“重视、顾念”的语义幅度；脚注说明也可理解为“守这日”。
- source_word: τὴν ἡμέραν
  choice: 这日
  rationale: 定冠词指向上下文正在讨论的某一日；“这日”在现代汉语中既体现所指性，又不擅自认定为安息日、节期或禁食日。
- source_word: κυρίῳ
  choice: 为主
  rationale: 此处与格表达行为以主为指向或为主而行。“为主”简洁自然，并保留κύριος为“主”，不与后文“上帝”合并。
- source_word: ἐσθίων / ἐσθίει
  choice: 吃的人／吃
  rationale: 以一般现在意义表达有关食物的惯常做法，并与“不吃的人”保持原文的平行结构。
- source_word: εὐχαριστεῖ
  choice: 感谢
  rationale: 表达向上帝献上感谢这一明确行动；现代汉语中“感谢上帝”自然、清楚。
- source_word: τῷ θεῷ
  choice: 上帝
  rationale: 作为εὐχαριστεῖ的与格对象，汉语可直接说“感谢上帝”，无需另加介词，同时明确感谢的对象。
- source_word: ὁ μὴ ἐσθίων
  choice: 不吃的人
  rationale: 直接保留否定分词结构，与“吃的人”形成鲜明对称，不额外解释为特定形式的禁食。
theological_decisions:
- issue: “这日”所指为何
  choice: 泛指罗马书14章争议中受到特别看重的一日
  alternative: 特指安息日、犹太节期或禁食日
  rationale: 本节措辞本身没有指明是哪一种日子；译文保留其概括性，避免加入经文未明说的宗派或历史判断。
- issue: κύριος的所指
  choice: 译作“主”
  alternative: 译作“上帝”
  rationale: 保留保罗此处“主”与后文明确的“上帝”之间的措辞区别；上下文中“主”最自然地指主耶稣，但正文不另行扩写。
- issue: 吃与不吃的属灵取向
  choice: 两种做法都可被描述为“为主”，并都伴随向上帝感谢
  alternative: 把其中一种做法表述为本质上更敬虔或更正确
  rationale: 原文刻意平行陈述双方，译文不替保罗消解这种张力，也不判定争议实践中的某一方优越。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看重这日”保留φρονέω的语义宽度，脚注补充实践性的“守这日”；用“吃的人／不吃的人”维持原文简洁、对称的论述节奏。
