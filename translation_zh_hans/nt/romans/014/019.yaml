  text: ἄρα οὖν τὰ τῆς εἰρήνης διώκωμεν καὶ τὰ τῆς οἰκοδομῆς τῆς εἰς ἀλλήλους.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/019.yaml
  text: So then[a], let us pursue what makes for peace and what builds up one another.
translation:
  language: zh_hans
  text: 所以，我们要追求促进和睦、彼此造就的事。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较直译：“所以，我们要追求和睦的事，以及彼此造就的事。”
    reason: 保留希腊文两次 τὰ 所构成的平行结构，以及两个属格短语较形式对应的译法。
lexical_decisions:
- source_word: ἄρα οὖν
  choice: 所以
  rationale: 两个推论性小词共同承接上文并引出结论；“所以”在现代汉语中自然、庄重，也足以表达其总结推论的作用。
- source_word: τὰ τῆς εἰρήνης
  choice: 促进和睦的事
  rationale: 带冠词的中性复数配属格，指与和睦有关并有助于和睦的事；此译既保留“事”的结构，也清楚表达其实际指向。
- source_word: διώκωμεν
  choice: 我们要追求
  rationale: 现在时劝勉虚拟语气表达群体持续而积极的行动；“追求”保留 διώκω 的力度，“我们要”自然传达共同劝勉。
- source_word: τὰ τῆς οἰκοδομῆς
  choice: 造就的事
  rationale: οἰκοδομή 原指建造，此处比喻使人得建立、成长；“造就”是现代中文圣经语境中清楚且凝练的表达。
- source_word: τῆς εἰς ἀλλήλους
  choice: 彼此造就
  rationale: εἰς ἀλλήλους 表明造就是相互指向的；按自然汉语语序将“彼此”置于“造就”之前，保留群体内的互惠意义。
theological_decisions:
- issue: 群体性造就的范围
  choice: 本节劝勉信徒共同追求和睦，以及群体成员之间彼此造就的事。
  alternative: 仅指个人自身的道德改善。
  rationale: 第一人称复数的劝勉形式和 ἀλλήλους 的相互性，都把重点放在共同体生活上；译文保留这一点，同时不限定具体宗派背景。
- issue: “和平”的语境含义
  choice: 译为“和睦”，突出罗马书14章群体成员在良心分歧中维持和谐关系。
  alternative: 译为较宽泛的“和平”。
  rationale: εἰρήνη 可指和平或和睦；在本章处理群体内部争议的语境中，“和睦”更符合现代汉语习惯，但脚注保留较形式对应的表达。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“促进和睦、彼此造就的事”兼顾希腊文平行结构与自然汉语；脚注提供更形式对应的译法。
