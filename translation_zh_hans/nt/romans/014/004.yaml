  text: σὺ τίς εἶ ὁ κρίνων ἀλλότριον οἰκέτην; τῷ ἰδίῳ κυρίῳ στήκει ἢ πίπτει· σταθήσεται δέ, ⸂δυνατεῖ γὰρ⸃ ὁ ⸀κύριος στῆσαι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/004.yaml
  text: Who are you to judge another's household slave? He stands or falls before his own lord[a], and he will be made to stand[c][b], for the Lord is able to make him stand.
translation:
  language: zh_hans
  text: 你是谁，竟论断别人的家奴[a]呢？他或站立或跌倒，都在他自己的主人[b]面前；他却必得以站立，因为主[c]能使他站立。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“别人家的仆人”。希腊语οἰκέτης特指家中的仆役，可指仆人，也可指奴隶；正文用“家奴”，以保留其受主人支配的社会关系。
    reason: lexical_alternative
  - marker: b
    text: 直译“他自己的主”。这里和后文的“主”都译自κύριος；在家奴的比喻中，译作“主人”更符合现代汉语，同时仍保留两处用词的关联。
    reason: lexical_alternative
  - marker: c
    text: 有人把这里的“主”理解为比喻中家奴的主人；更可能的是，保罗在此转指神学意义上的主，是主的能力保证信徒能够站立。
    reason: alternative_reading
lexical_decisions:
- source_word: σὺ τίς εἶ ὁ κρίνων
  choice: 你是谁，竟论断……呢
  rationale: 保留强调代词所形成的反问和责问语气；“竟”自然传达这种强调，而“论断”体现这里对他人作判断的含义。
- source_word: ἀλλότριον οἰκέτην
  choice: 别人的家奴
  rationale: οἰκέτης专指家中的仆役，且在当时可指具有隶属身份的奴隶；“家奴”简洁保留家庭关系及受奴役的社会身份。
- source_word: τῷ ἰδίῳ κυρίῳ
  choice: 在他自己的主人面前
  rationale: 与格表示这名家奴的站立或跌倒只关乎他自己的主人；“在……面前”自然表达向主人负责的关系。
- source_word: στήκει ἢ πίπτει
  choice: 站立还是跌倒
  rationale: 保留两个动词的对照和比喻，不将其提前解释为蒙认可或被定罪。
- source_word: σταθήσεται
  choice: 必蒙扶持，站立得住
  rationale: 未来被动式暗示外来的施动者；此译法用自然中文保留被动和得以站立的含义，随后一句再明确施动者。
- source_word: δυνατεῖ γὰρ
  choice: 因为……能
  rationale: γάρ说明前述把握的理由，δυνατεῖ表达能力或权能；“因为……能”准确而自然。
- source_word: ὁ κύριος
  choice: 主
  rationale: 此处最自然地指神学意义上的主，同时中文“主”仍与前面的“主人”保持词义关联。
- source_word: στῆσαι αὐτόν
  choice: 使他站立
  rationale: 保留ἵστημι的使役意义，并与前文“站立”形成清楚的词语呼应。
theological_decisions:
- issue: 末句ὁ κύριος所指为何
  choice: 正文译作“主”，较自然地指神学意义上的主
  alternative: 也可理解为比喻中家奴自己的主人
  rationale: 保罗很可能由家奴与主人的比喻转向信徒所面对的主，以主的能力作为信徒得以站立的根据；但原文仍容许比喻层面的理解，因此用脚注保留这一张力。
- issue: σταθήσεται中的施动者
  choice: 用“蒙扶持，站立得住”保留隐含的外来施动
  alternative: 译作“他必站立得住”
  rationale: 原文是未来被动式，下一分句又明确说主能使他站立；正文不把被动简化为纯粹主动。
translation_notes:
  register: 采用现代、庄重而通顺的标准普通话。“你是谁，竟……呢”保留责问力度；“站立—跌倒—站立”重复保留原文的核心意象。“家奴”虽较“仆人”尖锐，却准确反映古代受奴役关系，并以脚注提供较宽泛的译法。
