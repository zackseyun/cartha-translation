id: ROM.14.14
reference: Romans 14:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οἶδα καὶ πέπεισμαι ἐν κυρίῳ Ἰησοῦ ὅτι οὐδὲν κοινὸν δι’ ⸀ἑαυτοῦ· εἰ μὴ τῷ λογιζομένῳ τι κοινὸν εἶναι, ἐκείνῳ κοινόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/014.yaml
  text: I know and am persuaded in the Lord Jesus that nothing is unclean in itself; except that to the one who considers anything to be unclean[a], to that person it is unclean.
translation:
  language: zh_hans
  text: 我知道，并且在主耶稣里深信：没有什么东西本身是不洁净的[a]；只是，人若认为某样东西不洁净，对那人来说，它就是不洁净的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译作“凡俗的”。这里的希腊词通常指被视为在礼仪上受玷污或不洁净的事物。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶδα
  choice: 我知道
  rationale: 直接表达认知与确知，符合现代汉语，也保留原文陈述的明确语气。
- source_word: πέπεισμαι
  choice: 深信
  rationale: 该完成时形式表达已经形成并持续保持的坚定确信；“深信”自然凝练，并体现这种稳固状态。
- source_word: ἐν κυρίῳ Ἰησοῦ
  choice: 在主耶稣里
  rationale: 保留介词“在……里”的表达，不擅自限定为“借着主耶稣”或“因主耶稣”，从而保存原文中关系层面的丰富性。
- source_word: κοινόν
  choice: 不洁净
  rationale: 在本段关于食物与洁净观念的语境中，该词指被视为受玷污、不合洁净标准之物；“不洁净”比字面的“俗的”更能让现代读者准确理解。字面替代译法收入脚注。
- source_word: δι’ ἑαυτοῦ
  choice: 本身
  rationale: 这里表达事物并非因其内在性质而不洁净；“本身”是简洁自然的汉语对应。
- source_word: τῷ λογιζομένῳ
  choice: 人若认为
  rationale: λογίζομαι在此指把某物看作或认定为某种性质；条件式汉语表达清楚呈现原文所说的个人判断。
- source_word: τι
  choice: 某样东西
  rationale: 以自然汉语表达泛指的对象，同时与前文“没有什么东西”衔接。
- source_word: ἐκείνῳ κοινόν
  choice: 对那人来说，它就是不洁净的
  rationale: 清楚保留与特定个人相关的适用范围，并避免把这种不洁净误解为事物固有的性质。
theological_decisions:
- issue: κοινός在食物与洁净语境中的含义
  choice: 正文译为“不洁净”，同时明确否认事物本身具有这种性质
  alternative: “俗的”或“凡俗的”
  rationale: 保罗的论点同时包含两面：事物本身并不污秽，但认定它不洁净的人不可违背自己的判断而行。“不洁净”能传达礼仪洁净语境；脚注保留较字面的译法，以免遮蔽词语背景。
- issue: ἐν κυρίῳ Ἰησοῦ所表达的关系
  choice: 译作“在主耶稣里”
  alternative: “借着主耶稣”或“因主耶稣”
  rationale: 原文介词结构可以涉及保罗与主联合的身份和确信的范围或根据；直译能保存这种神学张力，不把它单一解释为启示来源或因果关系。
- issue: 个人认定与客观性质之间的张力
  choice: 译文保留“本身”与“对那人来说”的对照
  alternative: 将后半句解释为事物因此客观变得污秽
  rationale: 原文一方面否认事物内在不洁，另一方面确认个人良知判断对其本人具有实际效力；译文不消解这两者之间的张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“我知道，并且……深信”保留两个并列认知动词；冒号和分号帮助普通读者把握论断与限定之间的关系。代词使用“那人”，既符合现代汉语，也不额外强调性别。
