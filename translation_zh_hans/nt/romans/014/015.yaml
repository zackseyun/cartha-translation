  text: εἰ ⸀γὰρ διὰ βρῶμα ὁ ἀδελφός σου λυπεῖται, οὐκέτι κατὰ ἀγάπην περιπατεῖς. μὴ τῷ βρώματί σου ἐκεῖνον ἀπόλλυε ὑπὲρ οὗ Χριστὸς ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/015.yaml
  text: For if your brother is grieved because of food[a], you are no longer walking according to love[c][b]. Do not destroy that one with your food—the one for whom Messiah died.
translation:
  language: zh_hans
  text: 若你的弟兄[a]因食物而忧伤，你就不再按着爱行事了。不要因你的食物毁掉[b]那位弥赛亚曾为他而死的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄”在这里也可泛指同为信徒的人，包括姊妹。
    reason: lexical_alternative
  - marker: b
    text: “毁掉”也可译为“败坏”或“使……灭亡”。原文用词很强，但本节没有具体说明这种毁坏最终意味着什么。
    reason: alternative_reading
lexical_decisions:
- source_word: βρῶμα / βρώματι
  choice: 食物 / 用你的食物
  rationale: 该词泛指食物，并非特指肉；与格短语可表达手段或缘由，译为“用你的食物”既保留句法关系，也适合上下文。
- source_word: ἀδελφός
  choice: 弟兄
  rationale: 保留希腊文阳性单数及信徒群体中的亲属称谓；此处也可能代表同为信徒的人，故在脚注说明。
- source_word: λυπεῖται
  choice: 忧伤
  rationale: 表达因他人的饮食行为而感到痛苦、悲伤，不把具体心理或属灵后果解释得过窄。
- source_word: κατὰ ἀγάπην περιπατεῖς
  choice: 按着爱行事
  rationale: “按着”对应 κατά 所表达的准则；“行事”自然承接 περιπατέω 的伦理性行走隐喻，同时符合现代汉语表达。
- source_word: ἀπόλλυε
  choice: 毁掉
  rationale: 保留动词强烈的警告力度，但不擅自断定它专指暂时的属灵损害或最终灭亡。
- source_word: ὑπὲρ οὗ
  choice: 为他
  rationale: 简洁表达 ὑπέρ 加属格的代替、为……之意。
- source_word: Χριστός
  choice: 弥赛亚
  rationale: 此处 Χριστός 具有称号功能；译出称号含义，而不只音译为“基督”。
- source_word: ἀπέθανεν
  choice: 死
  rationale: 直接对应不定过去时所指向的历史性死亡事件。
- source_word: ἐκεῖνον
  choice: 他
  rationale: 汉语中以“他”回指前面的“弟兄”最自然；配合破折号和“正是”体现原文对该对象的强调。
- source_word: εἰ γὰρ
  choice: 因为……若
  rationale: “因为”保留 γάρ 与上文的论证联系，“若”保留 εἰ 的条件形式。
theological_decisions:
- issue: ἀπόλλυε 所指的毁灭性质
  choice: 译作“毁掉”，不界定具体结局
  alternative: “败坏”或“使……灭亡”
  rationale: 原词语气强烈，但本节本身没有明确裁定这是严重的属灵伤害、暂时败坏，还是最终灭亡；译文保留这种神学张力。
- issue: ἀδελφός 的指称范围
  choice: 正文译作“弟兄”
  alternative: “弟兄或姊妹”或“同为信徒的人”
  rationale: 正文反映希腊文阳性单数形式，同时用脚注说明该称呼在群体语境中可作代表性用法。
- issue: Χριστός 的称号性质
  choice: 弥赛亚
  alternative: “基督”
  rationale: 这里该词作为称号，译出“受膏者／弥赛亚”的意义更透明，并避免把称号仅当作专名。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“按着爱行事”保留保罗关于生活行为的伦理性“行走”意象，又避免生硬的“行走”。破折号突出被警告不可毁掉的那个人，正是弥赛亚为之而死的人。
