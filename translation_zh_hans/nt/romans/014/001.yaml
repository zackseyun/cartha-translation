  text: Τὸν δὲ ἀσθενοῦντα τῇ πίστει προσλαμβάνεσθε, μὴ εἰς διακρίσεις διαλογισμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/001.yaml
  text: Receive the one who is weak in faith[b][a], not for disputes over opinions.
translation:
  language: zh_hans
  text: 信心软弱的人，你们要接纳[a]；不要为了争论各种看法而接纳他[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “接纳”也可译作“欢迎”；希腊语动词有把人接到自己身边、纳入交往的意思。
    reason: lexical_alternative
  - marker: b
    text: 这句话也可译作“接纳他，但不要评断有争议的想法”或“接纳他，不要为各样的思量争吵”。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσθενοῦντα
  choice: 软弱的人
  rationale: 带冠词的现在分词作名词用，指“正在软弱的人”；不补入原文未明说的“良心”。
- source_word: τῇ πίστει
  choice: 信心
  rationale: 与“软弱”构成关系，表示软弱所涉及的方面；译为“信心”比“信仰内容”更符合本节有关个人确信的语境。
- source_word: προσλαμβάνεσθε
  choice: 接纳
  rationale: 该中间语态命令式表示把人接到自己身边、纳入交往或团契；“接纳”在现代汉语中自然，并保留群体关系的含义。
- source_word: μὴ εἰς
  choice: 不要为
  rationale: 表达应避免的目的或结果；“不要为”简洁地保留这一目的关系。
- source_word: διακρίσεις
  choice: 争论
  rationale: 在此语境中指带有评断和分歧性质的争辩，而非中性的“区分”。
- source_word: διαλογισμῶν
  choice: 各种看法
  rationale: 该词可指思量、推论或意见；这里用“看法”符合可争议事项的语境，同时避免缩窄为“疑虑”。
- source_word: δὲ
  choice: 不单独译出
  rationale: δέ在这里主要承担轻微的篇章过渡作用；现代汉语可借上下文自然体现，无须机械添加“现在”或强化为“但是”。
theological_decisions:
- issue: πίστις的译法
  choice: 信心
  alternative: 信仰；信实
  rationale: 此处重点是人在可争议实践上的信念或确信较弱，并非明确指一套客观教义，也不是指忠信品格；“信心”最能保持原文范围。
- issue: 接纳软弱者的命令与后半句的关系
  choice: 接纳，但不可把接纳变成争论看法的机会
  alternative: 接纳时不要评断有争议的想法
  rationale: μὴ εἰς διακρίσεις διαλογισμῶν在结构和语义上存在一定幅度，可指争辩、评断或判别人的思想；正文采用自然且较宽的“不要为争论各种看法”，脚注保留另一可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“信心软弱的人”前置为话题，随后用“你们要接纳”准确表达复数命令。脚注标记均置于正文相关词句之后。
