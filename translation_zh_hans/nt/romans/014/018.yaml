id: ROM.14.18
reference: Romans 14:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ γὰρ ἐν ⸀τούτῳ δουλεύων τῷ Χριστῷ εὐάρεστος τῷ θεῷ καὶ δόκιμος τοῖς ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/018.yaml
  text: For the one who serves the Messiah in this way is pleasing to God and approved by men.
translation:
  language: zh_hans
  text: 因为这样服侍基督的人，是上帝所喜悦的，也得到人们的认可。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“在这些事上服侍基督的人”。
    reason: 记录 ἐν τούτῳ（“在这事上／这样”）的抄本异文 ἐν τούτοις（“在这些事上”）。
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: 这样
  rationale: 此处直译为“在这事上”，也可按语境理解为“以这种方式”。“这样”在现代汉语中自然，并保留其回指上文的作用。
- source_word: δουλεύων τῷ Χριστῷ
  choice: 服侍基督
  rationale: δουλεύω 表示以仆人身份事奉、服侍；中文圣经语体中“服侍基督”既准确又自然。
- source_word: εὐάρεστος τῷ θεῷ
  choice: 是上帝所喜悦的
  rationale: 表达“蒙上帝悦纳、令上帝喜悦”之意；采用“所喜悦的”保留与格所表示的关系。
- source_word: δόκιμος τοῖς ἀνθρώποις
  choice: 得到人们的认可
  rationale: δόκιμος 指经过检验而被认可、获得肯定；“得到人们的认可”比生硬的“在人面前是可称许的”更符合现代汉语。ἀνθρώποις 在此泛指人们，并非特指男性。
theological_decisions:
- issue: ἐν τούτῳ 的所指
  choice: 这样
  alternative: 在这事上／在这些事上
  rationale: 单数代词可概括上文所说的生活方式或原则；译作“这样”不强行限定它只指某一项品德，也与“服侍基督”自然衔接。
- issue: 人的认可与上帝的喜悦之间的关系
  choice: 并列陈述“是上帝所喜悦的，也得到人们的认可”
  alternative: 把人的认可解释为得救或称义的依据
  rationale: 原文仅将两种评价并列，没有说人的认可构成得救或称义的条件，因此不作额外神学推断。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“上帝所喜悦的”与“得到人们的认可”保持原文平行结构；“人们”准确表达泛指的 τοῖς ἀνθρώποις，避免误解为仅指男性。
