  text: ὃς μὲν πιστεύει φαγεῖν πάντα, ὁ δὲ ἀσθενῶν λάχανα ἐσθίει.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/002.yaml
  text: One person believes he may eat anything[b][a], but the one who is weak eats vegetables.
translation:
  language: zh_hans
  text: 有人相信自己可以吃任何食物[a]，但软弱的人[b]吃蔬菜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“确信自己可以吃一切食物。”
    reason: lexical_alternative
  - marker: b
    text: 这里的“软弱”按上下文是指在饮食做法上信心或良心软弱；参14:1。
    reason: cross_reference
lexical_decisions:
- source_word: ὃς μὲν
  choice: 有人
  rationale: 这一结构引出对照的第一方。“有人”自然表达具有代表性的单数，也不无根据地限定为男性。
- source_word: πιστεύει
  choice: 相信
  rationale: 这里πιστεύω后接不定式，表示个人对于饮食的信念或确信，而不是特指使人得救的信心。“相信”既直接，也保留了原词与上下文中“信心”的词义联系。
- source_word: φαγεῖν πάντα
  choice: 什么都可以吃
  rationale: 原文直译为“吃一切”，在争议饮食的语境中表达饮食不受限制。“什么都可以吃”是自然的现代汉语；“可以”明示语境所含的许可意味，但不把具体理由写入正文。
- source_word: ὁ δὲ
  choice: 但那……的人
  rationale: δὲ标明第二方与第一方的对照；定冠词加分词指具有该特征的人。“但那……的人”保留这一平行对比。
- source_word: ἀσθενῶν
  choice: 软弱的人
  rationale: 该分词在这里作名词性用法，指被描述为软弱的人。译文不在本节正文中补入“信心上”，由14:1的上下文说明其范围。
- source_word: λάχανα
  choice: 蔬菜
  rationale: λάχανα指园中出产的菜蔬。“蔬菜”是清楚而通行的现代汉语，比“香草”或“青菜”范围更合适。
- source_word: ἐσθίει
  choice: 吃
  rationale: 动词本身只说这人吃蔬菜。对比虽然可能暗示饮食仅限于此，但原文没有明说“只”，所以正文不添加。
theological_decisions:
- issue: ἀσθενῶν所指的“软弱”性质
  choice: 正文译作“软弱的人”，不在本节补出“信心上”
  alternative: 信心软弱的人
  rationale: 罗马书14:1表明，这种软弱涉及信心或良心在饮食做法上的顾虑；但14:2本身只说“软弱的人”。保留本节的简洁表达，可避免在正文中提前消解上下文所保留的张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“什么都可以吃”通俗清楚；“软弱的人”保留保罗的评价性称呼，而不误解为身体虚弱。正文没有加入原文未明说的“只”。
