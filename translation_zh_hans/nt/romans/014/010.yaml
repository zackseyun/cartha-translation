id: ROM.14.10
reference: Romans 14:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Σὺ δὲ τί κρίνεις τὸν ἀδελφόν σου; ἢ καὶ σὺ τί ἐξουθενεῖς τὸν ἀδελφόν σου; πάντες γὰρ παραστησόμεθα τῷ βήματι τοῦ ⸀θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/010.yaml
  text: But you[a], why do you judge your brother? Or you also, why do you despise your brother? For we will all stand before the judgment seat of God[b],
translation:
  language: zh_hans
  text: 可是你，为什么论断你的弟兄[b]呢？你又为什么轻视你的弟兄呢？因为我们都要站在上帝的审判台[a]前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“基督的审判台”。
    reason: textual_variant
  - marker: b
    text: 也可译作“你的弟兄或姊妹”；希腊原文为“你的弟兄”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Σὺ δὲ
  choice: 可是你
  rationale: 既保留δέ的转折意味，也借“你”的前置体现σύ的强调，符合现代汉语表达。
- source_word: τί κρίνεις
  choice: 为什么论断
  rationale: 疑问词τί在这里构成责问，译作“为什么”；“论断”保留κρίνω作出判断的含义，不擅自强化为“定罪”。
- source_word: τὸν ἀδελφόν σου
  choice: 你的弟兄
  rationale: 按阳性单数ἀδελφός直译为“弟兄”；语境可涵盖同一信仰群体中的弟兄姊妹，另以脚注说明。
- source_word: ἢ καὶ σὺ
  choice: 你又
  rationale: “又”自然传达καί的附加意味，并保留第二个“你”所带出的对照与强调。
- source_word: τί ἐξουθενεῖς
  choice: 为什么轻视
  rationale: ἐξουθενέω指把人看作无足轻重、以轻蔑态度相待；“轻视”准确且为现代读者自然易懂。
- source_word: πάντες γὰρ
  choice: 因为我们都
  rationale: “因为”表达γάρ的解释或因由关系；“我们都”明确保留πάντες包括作者与读者在内的整体性。
- source_word: παραστησόμεθα
  choice: 要站在……前
  rationale: 该动词在司法语境中表示出庭、站到审判者面前；此译保留原文的法庭图景。
- source_word: τῷ βήματι
  choice: 审判台
  rationale: βῆμα在此指审判官的座台或法庭审判席；“审判台”简明保留其司法含义。
- source_word: τοῦ θεοῦ
  choice: 上帝的
  rationale: 直接翻译SBLGNT正文的属格τοῦ θεοῦ；异文“基督的”置于脚注，不在正文中调和。
theological_decisions:
- issue: 众人将站在谁的审判台前
  choice: 上帝的审判台
  alternative: 基督的审判台
  rationale: 所给SBLGNT正文读作τοῦ θεοῦ，故正文译为“上帝的”；部分抄本的“基督”读法具有神学与文本批判意义，保留在脚注中。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“论断”保留经文语体和司法关联，“轻视”则比“藐视”更贴近日常现代用语。脚注标记按其实际所说明的词语放置：文本异文标在“审判台”后，性别涵盖说明标在首次出现的“弟兄”后。
