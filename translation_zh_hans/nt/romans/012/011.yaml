  text: τῇ σπουδῇ μὴ ὀκνηροί, τῷ πνεύματι ζέοντες, τῷ κυρίῳ δουλεύοντες,
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/011.yaml
  text: Do not be lazy in zeal[a]; be fervent in spirit; serve the Lord.
translation:
  language: zh_hans
  text: 做事要殷勤，不可懒惰；灵里要火热[a]；要服侍主。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灵”也可理解为圣灵，因而可译作“在圣灵里要火热”。
    reason: 原文 πνεύματι 既可理解为人的灵或内在生命，也有人理解为圣灵。
lexical_decisions:
- source_word: σπουδῇ
  choice: 殷勤
  rationale: 该词表示热切、认真或勤勉；“殷勤”既能与“懒惰”形成鲜明对照，也保留积极热诚的含义。
- source_word: ὀκνηροί
  choice: 懒惰
  rationale: 该词指迟缓、怠惰或不情愿；“懒惰”是清楚自然的现代汉语，并与“殷勤”相对。
- source_word: πνεύματι
  choice: 灵里
  rationale: 希腊文未明确说明这里是人的灵还是圣灵。“灵里”尽量保留原文的简洁和指涉上的开放性，不在正文中武断限定。
- source_word: ζέοντες
  choice: 要火热
  rationale: 该词本义为“沸腾”，此处比喻热切旺盛；“火热”在现代汉语中自然地保留了这一形象。
- source_word: κυρίῳ
  choice: 主
  rationale: 按保罗书信中的通常用法译作“主”，很可能指主耶稣，但正文保留这一称号本身。
- source_word: δουλεύοντες
  choice: 要服侍
  rationale: 该动词含有作奴仆、受支配而效劳的背景；在此劝勉语境中，“服侍”自然表达对主的忠诚与顺服，又不使中文显得生硬。
theological_decisions:
- issue: τῷ πνεύματι ζέοντες 中 πνεύματι 的所指
  choice: 正文译作“灵里要火热”，不明确限定所指
  alternative: “在圣灵里要火热”或“心灵要火热”
  rationale: 原文没有明确标示这里是信徒自己的灵，还是圣灵。上下文的伦理劝勉适合人的内在生命这一理解，但圣灵的解释也有语法可能，因此正文保留张力，并在脚注中说明另一种译法。
translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语；三个并列分句对应原文的劝勉节奏。
