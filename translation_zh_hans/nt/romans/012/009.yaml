  text: Ἡ ἀγάπη ἀνυπόκριτος. ἀποστυγοῦντες τὸ πονηρόν, κολλώμενοι τῷ ἀγαθῷ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/009.yaml
  text: Let love be without hypocrisy[a]. Abhor what is evil; cling to what is good.
translation:
  language: zh_hans
  text: 爱不可虚假。[a]要憎恶邪恶，持守良善。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“爱要真诚。”希腊文直译为“爱，不虚假”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγάπη
  choice: 爱
  rationale: “爱”是现代汉语中自然、宽广的对应词，保留了这里的伦理含义，不额外限定为某一种爱。
- source_word: ἀνυπόκριτος
  choice: 不可虚假
  rationale: 该词指不伪装、不假冒。“不可虚假”保留了原文反对虚伪的具体道德意味，也以简洁的劝勉句表达希腊文无动词短语的语用力量。
- source_word: ἀποστυγοῦντες
  choice: 憎恶
  rationale: 该分词表达强烈的厌恶；“憎恶”在现代汉语中庄重自然，并在本段劝勉语境中按命令语气处理。
- source_word: τὸ πονηρόν
  choice: 邪恶
  rationale: 冠词化的中性形容词泛指邪恶之事或一切恶，不宜缩窄为某个具体恶行；汉语“邪恶”可自然承载这一概括意义。
- source_word: κολλώμενοι
  choice: 持守
  rationale: 原词有紧密依附、牢牢贴住之意。“持守”自然表达坚定不离的行动，虽不照搬其具体黏附意象，却适合伦理劝勉语境。
- source_word: τῷ ἀγαθῷ
  choice: 良善
  rationale: 冠词化的中性形容词泛指善或良善之事；“良善”与“邪恶”形成清晰对照，并保持庄重语体。
theological_decisions:
- issue: 无动词首句及后续分词在劝勉语境中的语气
  choice: 译成一连串直接劝勉：“爱不可……要憎恶……持守……”
  alternative: 较形式对应地译为片段式结构：“爱毫无虚假，憎恶邪恶，紧附良善。”
  rationale: 希腊文首句是无动词名词短语，后接两个分词；但罗马书12章此处是一连串伦理劝勉。汉语补出“不可”和“要”，能清楚传达劝勉功能，同时不改变命题内容。
- issue: κολλώμενοι 的依附强度
  choice: 持守良善
  alternative: 紧紧依附良善
  rationale: “持守”符合现代汉语圣经伦理劝勉的庄重语体，也表达坚定不离；脚注不必为此增加解释，因为译文未引入特定教义解释。
translation_notes:
  register: 采用现代、简洁、庄重的标准普通话。保留原文三项并列劝勉的力度；首句脚注说明希腊文的无动词结构及较顺畅的替代译法。
