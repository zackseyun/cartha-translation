  text: οὕτως οἱ πολλοὶ ἓν σῶμά ἐσμεν ἐν Χριστῷ, ⸀τὸ δὲ καθ’ εἷς ἀλλήλων μέλη.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/005.yaml
  text: so we[a], though many, are one body in Messiah, and individually members of one another.
translation:
  language: zh_hans
  text: 这样，我们虽多，在弥赛亚[a]里却是一个身体；各人则互为肢体。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“基督”。希腊语 Χριστός 是称号，意为“受膏者”，与“弥赛亚”相对应。
    reason: 说明称号的另一常见译法。
lexical_decisions:
- source_word: οὕτως
  choice: 这样
  rationale: 承接上一节身体与肢体的比喻，保留比较兼推论的语气。
- source_word: οἱ πολλοὶ
  choice: 我们人数虽多
  rationale: 结合谓语“我们是”，明确保罗包含自己在内；“虽多”以自然汉语表达语境中的多与一之对照。
- source_word: ἓν σῶμά
  choice: 一个身体
  rationale: 直接保留群体合一的身体隐喻。
- source_word: ἐν Χριστῷ
  choice: 在弥赛亚里
  rationale: 保留介词“在……里”所表达的联合关系，并用“弥赛亚”呈现 Χριστός 的称号意义。
- source_word: τὸ δὲ καθ’ εἷς
  choice: 各人则
  rationale: 表达逐一、分别而言的分配意义；“则”也呈现由整体转向个体的对照。
- source_word: ἀλλήλων μέλη
  choice: 互为肢体
  rationale: 简洁保留彼此相属的相互关系及身体隐喻，不另加原文没有的“联络”等概念。
theological_decisions:
- issue: ἐν Χριστῷ 中 Χριστός 的译法
  choice: 在弥赛亚里
  alternative: 在基督里
  rationale: Χριστός 在此仍带有受膏者称号的意义；“弥赛亚”可显明这一称号，同时“在……里”保留保罗关于与弥赛亚联合的表达。脚注列出汉语教会传统中更常见的译法，以避免把两种译名误解为不同对象。
- issue: ἀλλήλων μέλη 所表达的群体关系
  choice: 互为肢体
  alternative: 彼此都是肢体
  rationale: 原文属格表达成员彼此相属，不只是共同属于某个整体；“互为”较完整地保留这种相互关系，同时不把其具体神学含义进一步发挥。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“人数虽多……却是一个身体”自然呈现多与一的对照；分号区分整体陈述与逐一陈述。
