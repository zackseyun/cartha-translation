  text: 在盼望中喜乐；在患难[b]中忍耐；祷告要恒切[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恒切”也可译作“坚持不懈”或“专心投入”；原词兼有持续坚持和专心委身的意思。
