lexical_decisions:
- source_word: ἐλπίδι
  choice: 在盼望中
  rationale: 保留与定冠词连用的与格所表达的关联范围，同时按现代汉语习惯不硬译定冠词；“盼望”准确传达期待与确信的语义。
- source_word: χαίροντες
  choice: 喜乐
  rationale: 现在主动分词在这里与后两个分词并列，具有劝勉意味；汉语用简洁的动词短语既自然，也保留持续性的品格描述。
- source_word: θλίψει
  choice: 在患难中
  rationale: θλῖψις可指压力、困苦、苦难或患难；“患难”庄重而易懂，保留处境严峻的分量。
- source_word: ὑπομένοντες
  choice: 忍耐
  rationale: 表达在艰难压力下坚忍承受、持守不退；不额外加入仅指情绪平静的限定。
- source_word: προσευχῇ
  choice: 在祷告上
  rationale: 表示祷告这一持续投入的领域；“在祷告上”与“恒切”搭配自然，也呼应原文三个与格结构。
- source_word: προσκαρτεροῦντες
  choice: 恒切
  rationale: 该词兼有持续坚持和专心投入之意；“恒切”以简洁、传统而仍可理解的表达涵盖坚定持续与委身两面。
