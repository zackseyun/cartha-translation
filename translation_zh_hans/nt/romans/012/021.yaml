  text: μὴ νικῶ ὑπὸ τοῦ κακοῦ, ἀλλὰ νίκα ἐν τῷ ἀγαθῷ τὸ κακόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/021.yaml
  text: Do not be overcome by evil[a], but overcome evil with good.
translation:
  language: zh_hans
  text: 不要被恶所胜[a]，反要以善胜恶。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要让恶的事胜过你，反要用善的事胜过恶的事。”希腊文使用带冠词的中性形容词，既可译作抽象的“恶”和“善”，也可译作“恶的事”和“善的事”。
    reason: 词义表达的合理替代译法
lexical_decisions:
- source_word: μὴ νικῶ
  choice: 不要被……所胜
  rationale: νικῶ是现在时被动命令语气第二人称单数，μή构成禁止语气。“不要被……所胜”自然保留被动含义，也与后半句主动的“胜”形成鲜明对应。
- source_word: ὑπὸ τοῦ κακοῦ
  choice: 被恶所胜
  rationale: ὑπό加属格表示施事者；τοῦ κακοῦ是带冠词的中性单数形容词，可泛指“恶”或“恶的事”。正文采用简洁的抽象名词“恶”，不把它人格化。
- source_word: ἀλλὰ νίκα
  choice: 反要……胜……
  rationale: ἀλλά表达强烈转折；νίκα是现在时主动命令语气第二人称单数。“反要”清楚传达转折和命令，“胜”则与前句保持词汇和修辞上的对应。
- source_word: ἐν τῷ ἀγαθῷ
  choice: 以善
  rationale: ἐν加与格在此表示手段。“以善”是简洁庄重的现代汉语，准确表达借着善、用善作为得胜手段。
- source_word: τὸ κακόν
  choice: 恶
  rationale: 带冠词的中性单数形容词在此作名词用，泛指“恶”或“恶的事”。译作“恶”保留宽泛的道德范畴，并与“善”构成凝练对照。
theological_decisions:
- issue: κακός／ἀγαθός应理解为人格化对象，还是抽象或泛指的道德范畴
  choice: 译作“恶”和“善”，作为泛指的道德范畴
  alternative: 译作“恶的事”和“善的事”；或将“恶”人格化为“那恶者”
  rationale: 希腊文使用带冠词的中性形容词，既可抽象地指“恶／善”，也可指“恶的事／善的事”；语法和上下文均不要求把“恶”具体解释为撒但等人格化对象。正文采用自然凝练的“恶／善”，脚注保留另一种合理表达。
translation_notes:
  register: 采用现代、简洁而庄重的劝诫语体。“被……所胜／以……胜……”保留原文前后被动与主动的反转，以及“胜”字的重复；单数第二人称在汉语中无需明说，仍可自然用于对每位读者的直接劝勉。
