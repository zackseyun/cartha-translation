  text: ἔχοντες δὲ χαρίσματα κατὰ τὴν χάριν τὴν δοθεῖσαν ἡμῖν διάφορα, εἴτε προφητείαν κατὰ τὴν ἀναλογίαν τῆς πίστεως,
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/006.yaml
  text: 'But having gifts that differ according to the grace given to us: if prophecy[a], in proportion to faith;'
translation:
  language: zh_hans
  text: 我们既有照着所赐给我们的恩典而各不相同的恩赐：若是说预言[a]，就当按着信心的比例；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “按着信心的比例”也可理解为“按着各人信心的程度”；另一种译法是“与信仰相符”。希腊语可指说预言者的信心所及的程度，也可指预言的内容须与基督信仰相符。
    reason: alternative_reading
lexical_decisions:
- source_word: ἔχοντες δὲ
  choice: 既然我们所得的
  rationale: 分词承接上文并引出劝勉；“既然……所得”在现代汉语中自然，也避免把 δὲ 强化为明显转折。
- source_word: χαρίσματα
  choice: 恩赐
  rationale: 这是保罗书信语境中 χάρισμα 的通行译法，既表达所赐之物，也保留其与恩典的词义关联。
- source_word: κατὰ τὴν χάριν τὴν δοθεῖσαν ἡμῖν
  choice: 照着所赐给我们的恩典
  rationale: κατά 表示依据或相称关系；译文保留“恩典”及其被赐予的含义。
- source_word: διάφορα
  choice: 各有不同
  rationale: 作为谓语形容词说明恩赐的多样性；“各有不同”符合现代汉语表达。
- source_word: εἴτε προφητείαν
  choice: 若是说预言
  rationale: εἴτε 引出省略结构中的第一项；补出“说”使汉语完整，同时不把 προφητείαν 过度限定为职位或固定制度。
- source_word: κατὰ τὴν ἀναλογίαν τῆς πίστεως
  choice: 按着信心的程度
  rationale: ἀναλογία 表示比例、相称或对应关系；主文采用自然而宽泛的表达，脚注保留“与信仰相符”的另一种理解。
theological_decisions:
- issue: κατὰ τὴν ἀναλογίαν τῆς πίστεως 的含义
  choice: 按着信心的程度
  alternative: 与所信的真道相符
  rationale: 希腊语既可能指说预言者所得信心的程度，也可能指预言内容须与基督信仰相符。主文采用较贴近“比例”的读法，脚注明确保留另一主要解释，不把争议静默解决。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“恩赐、恩典、信心”保留保罗原文中的关键词联系；冒号和分号体现本节作为后续恩赐清单开端的未完结构。
