  text: ταῖς χρείαις τῶν ἁγίων κοινωνοῦντες, τὴν φιλοξενίαν διώκοντες.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/013.yaml
  text: sharing in the needs of the saints[b][a], pursuing hospitality.
translation:
  language: zh_hans
  text: 要帮助满足圣徒的需要[a]，要积极接待客旅[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣徒”指归属上帝的信徒；“帮助满足”也可译作“分担”或“参与供应”。
    reason: 澄清保罗用语的所指，并保留κοινωνέω在此处参与、供应他人实际需要的语义范围。
  - marker: b
    text: 或译：“要积极接待陌生人。”希腊语φιλοξενία指善待、接待外来者，也可泛指“好客”。
    reason: 保留φιλοξενία中接待陌生人或外来者的词义重点，避免将其限于旅行者。
lexical_decisions:
- source_word: χρείαις
  choice: 需要
  rationale: χρεία在这里指实际生活所需；“需要”自然、清楚，也不把范围限于金钱。
- source_word: ἁγίων
  choice: 圣徒
  rationale: 保罗通常以ἅγιοι统称归属上帝的信徒；“圣徒”保留其群体身份和神学色彩，并非指后世教会所封的少数圣人。
- source_word: κοινωνοῦντες
  choice: 分担
  rationale: κοινωνέω与间接受格“需要”连用，表示实际参与、共同承担这些需要；“分担”既自然，也比“捐助”更能保留不限于钱财的广义。
- source_word: φιλοξενίαν
  choice: 接待旅客
  rationale: φιλοξενία含有善待、接待陌生人或外来者之意；“接待旅客”比单说“好客”更具体地呈现其面向外来人的含义。
- source_word: διώκοντες
  choice: 竭力
  rationale: διώκω本有追求、积极寻求之意；“竭力”传达主动而迫切地寻找机会实践接待的力度。
theological_decisions:
- issue: “圣徒”的所指
  choice: 信徒，即归属上帝的圣洁群体
  alternative: 后世教会意义上被册封的圣人
  rationale: 保罗书信中的“圣徒”通常泛指基督徒群体，因此保留传统称谓，同时以脚注避免现代读者误解。
- issue: κοινωνοῦντες所表达的帮助方式
  choice: 广义地参与并分担需要
  alternative: 专指金钱捐助
  rationale: 语境包含物质援助，但希腊词本身并未限定帮助方式，译文不宜将其收窄为财务奉献。
translation_notes:
  register: 采用简洁、对称的劝勉句式，与本段连续命令的节奏相符。“圣徒”保留保罗惯用的群体称谓，以脚注澄清；“接待旅客”使用现代而庄重的表达，避免“好客”可能只表示性格热情，也避免“陌生人”在现代汉语中偏重完全不相识者的歧义。
