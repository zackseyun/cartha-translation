  rationale: 修订仅处理两处语义和中文搭配问题：“帮助满足”明确对圣徒需要的实际支持；“客旅”及脚注避免“旅客”对接待对象的限缩，并以“积极”体现διώκοντες的主动追求。原有“圣徒”的保留及其注释均合乎保罗书信中的通常用法。
