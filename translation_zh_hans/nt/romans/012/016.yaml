source:
  edition: SBLGNT
  text: τὸ αὐτὸ εἰς ἀλλήλους φρονοῦντες, μὴ τὰ ὑψηλὰ φρονοῦντες ἀλλὰ τοῖς ταπεινοῖς συναπαγόμενοι. μὴ γίνεσθε φρόνιμοι παρ’ ἑαυτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/016.yaml
  text: Be of the same mind toward one another[a]; do not set your mind on high things, but associate with the lowly[b]. Do not become wise in your own sight.
translation:
  language: zh_hans
  text: 彼此要同心；不要一心想着高高在上的事[a]，倒要与卑微者交往[b]。不要自以为聪明。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要追求高位”，或“不要心高气傲”。
    reason: 原文“想着高高在上的事”既可能指追求地位或崇高之事，也可能形容骄傲的心态。
  - marker: b
    text: 或译：“要与卑微的人交往”；原文也可能指卑微的事。
    reason: 希腊文 τοῖς ταπεινοῖς 的形式与语境容许指人或指事；正文采用较自然的“人”的读法，脚注保留另一种可能。
lexical_decisions:
- source_word: τὸ αὐτὸ εἰς ἀλλήλους φρονοῦντες
  choice: 彼此要同心
  rationale: 这一惯用表达重在信徒彼此之间共有的心志与和谐，并非要求每个想法都完全相同。“彼此要同心”简洁自然，也保留了相互指向的劝勉语气。
- source_word: μὴ τὰ ὑψηλὰ φρονοῦντες
  choice: 不要一心想着高处的事
  rationale: 原文直译近于“不要思想高的事”，既可指高傲的心态，也可指追求地位崇高之人或事。“高处的事”保留其空间意象与语义宽度；“一心想着”表达 φρονοῦντες 的心志取向。
- source_word: τοῖς ταπεινοῖς
  choice: 卑微的
  rationale: 该复数形容词在语法和语境上可指卑微的人，也可指卑微的事物。正文采用名词化的“卑微的”，尽量不在正文中排除任何一种理解，并以脚注说明。
- source_word: συναπαγόμενοι
  choice: 相伴
  rationale: 该词本有“被带着一同走、随同”的动态意味；在此处“与……相伴”既自然地表达亲近、交往，也略保留同行的形象，避免仅译成静态的“接纳”。
- source_word: μὴ γίνεσθε φρόνιμοι παρ’ ἑαυτοῖς
  choice: 不要自以为聪明
  rationale: 这是汉语中自然、明确的惯用说法，准确表达“按自己的判断看自己为聪明”的自负。虽然未逐字呈现 γίνεσθε 的过程意味，禁令本身仍可涵盖不要形成这种心态。
theological_decisions:
- issue: τὰ ὑψηλά 与 τοῖς ταπεινοῖς 在谦卑劝勉中的所指
  choice: 正文采用“高处的事”与“卑微的”，保留内在骄傲、社会地位以及所追求之事等可能含义。
  alternative: 可明确译为“不要心高气傲，倒要与卑微的人相处”，或“不要追求崇高的事，倒要甘心做卑微的事”。
  rationale: 希腊文容许态度层面和社会关系层面的理解，而 τοῖς ταπεινοῖς 也可能指人或事。正文不把保罗的劝勉收窄为单一解释，脚注则帮助读者看见这些可能性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“同心”“高处的事”“相伴”保留原文的修辞与关系性；两个脚注分别说明关键短语的词义范围和人／事歧义。
