revisions:
- from: 彼此要同心；不要一心想着高处的事[a]，倒要与卑微的相伴[b]。不要自以为聪明。
  to: 彼此要同心；不要一心想着高高在上的事[a]，倒要与卑微者交往[b]。不要自以为聪明。
  rationale: 为使正文符合现代标准普通话，将语法悬空的“与卑微的相伴”改为“与卑微者交往”。由于汉语难以用自然的名词化形式同时涵盖“低微的人”和“低微的事”，正文采用语境中强有力且自然的“人”之读法，并以脚注保留原文的另一可能。另微调“高处的事”，使其更自然，同时不预先裁定其究竟指骄傲、高位还是高尚／崇高之事。
