  yaml_path: translation/nt/romans/012/017.yaml
  text: Repaying no one evil for evil[a], but taking thought for what is good in the sight of all people.
translation:
  language: zh_hans
  text: 不要向任何人以恶报恶；要留心去做众人眼中美善[a]的事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “美善”也可译作“可敬”或“高尚”。
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδενὶ
  choice: 不要……任何人
  rationale: 与ἀποδιδόντες合起来表达“不要向任何人偿还”；汉语用“不要以恶报恶”已自然涵盖无人例外的普遍范围。
- source_word: κακὸν ἀντὶ κακοῦ ἀποδιδόντες
  choice: 不要以恶报恶
  rationale: ἀντί表示相应回报，ἀποδίδω表示偿还或回报；“以恶报恶”准确、简洁地保留报复性回报的伦理含义。
- source_word: προνοούμενοι
  choice: 要留心做
  rationale: 该词有预先考虑、用心顾念之意；“留心做”在现代汉语中自然地表达审慎考虑并付诸实行，同时不将其限于物质供应。
- source_word: καλὰ
  choice: 美善的事
  rationale: καλός在此既可指道德上的良善，也可含美好、可敬、体面的意味；“美善”比单说“好”更能保留其积极伦理与公共荣誉色彩。
- source_word: ἐνώπιον πάντων ἀνθρώπων
  choice: 众人眼中
  rationale: 保留“在所有人面前／眼中”的公开可见性；“众人”自然涵盖所有人，不带性别限定。
theological_decisions:
- issue: καλά在公开处境中的伦理含义
  choice: 美善的事
  alternative: 众人认为可敬的事；众人看为好的事
  rationale: 原文可能兼有内在良善与公开可敬两层意义。正文采用较宽的“美善”，避免将劝勉缩减为迎合社会观感；脚注保留“可敬／高尚”的词义可能。
translation_notes:
  register: 采用现代、简洁而庄重的劝勉语体。“以恶报恶”为通行成语，准确传达回报与报复之意；分号体现两个并列的劝勉。脚注标记已置于其所说明的“美善”之后。
