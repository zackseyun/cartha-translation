  text: εἴτε διακονίαν ἐν τῇ διακονίᾳ, εἴτε ὁ διδάσκων ἐν τῇ διδασκαλίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/007.yaml
  text: if service[a], in service; if the one teaching, in teaching[b];
translation:
  language: zh_hans
  text: 若是服事[a]，就当专心服事；若是教导人的，就当专心教导[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “服事”也可译作“职事”。希腊文διακονία可按语境指服务、服事或职事。
    reason: lexical_alternative
  - marker: b
    text: 或译：“若是教师，就当专心教导。”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴτε
  choice: 若是
  rationale: 在这组省略式、平行排列的恩赐与功用中，用“若是”自然承接上文，也保留希腊文近似条件句的紧凑结构。
- source_word: διακονίαν
  choice: 服事
  rationale: διακονία可指服务、服事或职事；“服事”在现代中文教会语境内外都较易理解，又不必限定为正式职分。
- source_word: ἐν τῇ διακονίᾳ
  choice: 就当专心服事
  rationale: 希腊文直译近于“在服事中”，是省略式劝勉，意在让领受这种恩赐的人投身于相应活动；补出“就当专心”使中文完整自然，同时保留重复。
- source_word: ὁ διδάσκων
  choice: 教导人的
  rationale: 名词化的现在分词强调正在履行教导功能的人；“教导人的”保留其功能性，不把它明确制度化为“教师”这一职称。
- source_word: διδασκαλίᾳ
  choice: 教导
  rationale: 此处指教导这一活动或内容；“教导”直接、自然，且不像“教义”那样缩窄为技术性概念。
theological_decisions:
- issue: 是否用带有正式教会职分色彩的词翻译διακονία
  choice: 服事
  alternative: 职事
  rationale: 上下文列举按恩典所得的不同功用。“服事”保留该词的宽泛范围，不预先限定为正式教会职分，也仍容许其包含事奉性工作。
- issue: 是否把ὁ διδάσκων处理成制度化的职称
  choice: 教导人的
  alternative: 教师
  rationale: 希腊文使用分词，着重从事教导的人，而不是明确命名某种职分；功能性的译法避免加入原文未明说的教会制度。
- issue: 如何表达ἐν加定冠词名词的省略式结构
  choice: 就当专心……
  alternative: 就在……上
  rationale: 原文保持格言式简洁，具体语气需由上下文补足。“就当专心”自然表达投身相应恩赐活动的劝勉，但不把它解释为额外的神学要求。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。正文补出省略句中的“就当专心”，使中文通顺；两个分句维持平行。脚注标记[a]、[b]均已置于正文相应位置。
