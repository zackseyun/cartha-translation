  yaml_path: translation/nt/romans/012/015.yaml
  text: Rejoice with those who rejoice[a]; weep with those who weep.
translation:
  language: zh_hans
  text: 要与喜乐的人一同喜乐；要与哭泣的人一同哭泣。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χαίρειν
  choice: 喜乐
  rationale: 该现在时主动不定式在本段劝勉语境中具有命令作用；“喜乐”自然、庄重，并保留情感与行动色彩。
- source_word: μετὰ
  choice: 与……一同
  rationale: μετά加属格在此表示陪伴、共同参与；“与……一同”准确传达关联意义，也强化两句的平行结构。
- source_word: χαιρόντων
  choice: 喜乐的人
  rationale: 现在时主动分词、属格复数，在μετά之后作名词用；“喜乐的人”简洁自然，保留泛指复数意义。
- source_word: κλαίειν
  choice: 哭泣
  rationale: 该不定式同样具有命令作用；“哭泣”贴近κλαίω所表达的哀伤流泪，并与“喜乐”形成庄重而清楚的对应。
- source_word: κλαιόντων
  choice: 哭泣的人
  rationale: 现在时主动分词、属格复数，作名词用；“哭泣的人”与前半句结构平行，且不把含义扩展为较宽泛的“哀悼”。
theological_decisions:
- issue: 劝勉段落中不定式的命令作用
  choice: 用“要……”表达两项劝勉，并让第二项承接省略的命令语气
  alternative: 直译为“与喜乐的人一同喜乐；与哭泣的人一同哭泣”，不明确标示命令作用
  rationale: 罗马书12:9–21是一连串劝勉；此处两个不定式在语篇中承担命令或训诫功能。“要”能用现代汉语自然传达这一作用，同时不增加教义内容。
- issue: μετά所表达的共同参与
  choice: 译为“与……一同”，表达同喜同哭的陪伴与参与
  alternative: 译为“在……中间”
  rationale: μετά加属格主要表示相伴或关联；这里不是单纯描述空间位置，而是劝勉人与他人的喜乐和悲伤共同有分。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“喜乐”符合圣经劝勉语体，但仍为现代读者所熟悉；“哭泣”比“哀悼”更贴近原词，也保持两分句的整齐平行。脚注保留希腊语现在时分词所呈现的进行状态。
