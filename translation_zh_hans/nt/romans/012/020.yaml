id: ROM.12.20
reference: Romans 12:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ⸂ἀλλὰ ἐὰν⸃ πεινᾷ ὁ ἐχθρός σου, ψώμιζε αὐτόν· ἐὰν διψᾷ, πότιζε αὐτόν· τοῦτο γὰρ ποιῶν ἄνθρακας πυρὸς σωρεύσεις ἐπὶ τὴν κεφαλὴν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/020.yaml
  text: But if your enemy is hungry[a], feed him; if he is thirsty, give him something to drink; for by doing this you will heap burning coals on his head.
translation:
  language: zh_hans
  text: 相反，你的仇敌若饿了，就给他吃的；若渴了，就给他喝。因为你这样做，就会把燃烧的炭堆在他头上[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“火的炭”。这个意象可能表示使人羞愧而悔改、令人痛苦的良心谴责，或将要临到的审判；正文保留希腊文的比喻，不确定其单一含义。
    reason: 说明原文的字面形式及有争议的比喻含义，同时避免在正文中替读者作神学定论。
lexical_decisions:
- source_word: ἀλλὰ ἐὰν
  choice: 相反……若
  rationale: ἀλλά承接上文不可自行报复的劝诫，表示转折；ἐάν引出条件。“相反……若”既保留对比，也符合现代汉语表达。
- source_word: ὁ ἐχθρός σου
  choice: 你的仇敌
  rationale: 保留定冠词短语的单数含义和第二人称所属关系；“仇敌”庄重而通俗。
- source_word: πεινᾷ … ψώμιζε αὐτόν
  choice: 饿了，就给他吃的
  rationale: πεινᾷ表示处于饥饿状态，ψώμιζε是持续或一般性命令，意为供给食物；此译法自然明确，不把食物具体化。
- source_word: διψᾷ … πότιζε αὐτόν
  choice: 渴了，就给他喝
  rationale: ποτίζω意为给人饮用之物；“给他喝”是自然的现代汉语，也避免擅自限定为水。
- source_word: τοῦτο γὰρ ποιῶν
  choice: 因为你这样做
  rationale: γάρ说明如此善待仇敌所产生的结果，分词ποιῶν以“你这样做”自然呈现。
- source_word: ἄνθρακας πυρὸς
  choice: 燃烧的炭
  rationale: 该短语直译为“火的炭”。“燃烧的炭”在现代汉语中清楚自然，同时完整保留具体意象。
- source_word: σωρεύσεις ἐπὶ τὴν κεφαλὴν αὐτοῦ
  choice: 就会把……堆在他头上
  rationale: σωρεύσεις是将来时，表示如此行将有的结果；“堆在他头上”保留原文鲜明而未加解释的比喻。
theological_decisions:
- issue: “把燃烧的炭堆在他头上”这一比喻的含义
  choice: 正文保留比喻，不确定其单一解释
  alternative: 直接解释为使仇敌羞愧悔改、产生痛苦的良心谴责，或招致审判
  rationale: 原文没有明说火炭意象所指，且可能涉及羞愧而悔改、道德刺痛或将来的审判。译文不应替保罗消除这一解释张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“相反”明确承接上文的对比，“给他吃的／给他喝”简洁自然；末句保留具体而有张力的火炭意象。脚注标记置于其实际说明的比喻之后。
