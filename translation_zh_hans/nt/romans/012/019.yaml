  text: μὴ ἑαυτοὺς ἐκδικοῦντες, ἀγαπητοί, ἀλλὰ δότε τόπον τῇ ὀργῇ, γέγραπται γάρ· Ἐμοὶ ἐκδίκησις, ἐγὼ ἀνταποδώσω, λέγει κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/019.yaml
  text: 'Do not avenge yourselves[a], beloved, but give place to wrath, for it is written: “Vengeance is mine; I will repay[b], says the Lord.”'
translation:
  language: zh_hans
  text: 亲爱的，不要自己报仇，却要给愤怒留余地[a]，因为经上记着：“伸冤在我，我必报应。”主这样说。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “愤怒”结合下文很可能指神的愤怒；原文只说“愤怒”，没有明说“神的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ἑαυτοὺς ἐκδικοῦντες
  choice: 不要自己报仇
  rationale: 保留反身代词“自己”和禁止亲自施行报复的语义；在本句语境中，“报仇”比“为自己辩白”更准确。
- source_word: ἀγαπητοί
  choice: 亲爱的弟兄姊妹
  rationale: 以现代汉语自然表达带有深厚情感的复数呼语，并明确涵盖会众中的男女。
- source_word: ἀλλὰ δότε τόπον τῇ ὀργῇ
  choice: 却要给愤怒留地步
  rationale: 保留“给……地方”的原文隐喻，也不在正文中擅自补出“神的”，从而保留原文简略表达所具有的张力。
- source_word: γέγραπται γάρ
  choice: 因为经上记着
  rationale: 这是现代中文圣经语体中自然、庄重的引经公式，也体现完成时所含“已经写下并仍然有效”的意味。
- source_word: Ἐμοὶ ἐκδίκησις
  choice: 伸冤在我
  rationale: 该短句表达伸张公义、施行惩治属于主的权柄；此译法简洁庄重，并与前文禁止个人报仇形成清楚对照。
- source_word: ἐγὼ ἀνταποδώσω
  choice: 我必报应
  rationale: 表达神将按行为施行相称回报的司法语义；“必”自然传达将来陈述的确定性。
- source_word: λέγει κύριος
  choice: 主这样说
  rationale: 自然表达引文后的说话者公式，并按项目惯例将 κύριος 译为“主”。
theological_decisions:
- issue: τῇ ὀργῇ（“愤怒”）的所指
  choice: 正文保留简略的“愤怒”，脚注说明结合下文很可能指神的愤怒。
  alternative: 在正文直接译作“神的愤怒”或理解为一般人的愤怒。
  rationale: 紧接着引用的经文把伸冤与报应归给主，因此神的愤怒最符合上下文；但希腊原文没有明说“神的”，正文不应消除这一含蓄性。
- issue: Ἐμοὶ ἐκδίκησις 中神所宣告的权柄
  choice: 译作“伸冤在我”，表明最终施行公义与报应属于主。
  alternative: 译作“报仇属于我”。
  rationale: “伸冤在我”保留神独有的司法权柄，也避免把神的公义审判简单等同于出于私怨的报复；下句“我必报应”仍明确保留惩治含义。
translation_notes:
  register: 采用庄重而可懂的现代标准普通话。“给愤怒留地步”刻意保留原文隐喻和简略性；“亲爱的弟兄姊妹”使复数呼语在中文中自然且兼顾男女。引文采用简洁、具有经文韵味但仍易于现代读者理解的表达。
