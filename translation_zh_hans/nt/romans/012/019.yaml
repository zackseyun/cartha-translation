  naturalness: “给愤怒留地步”虽逐字模仿“给地方”，但“留地步”在现代普通话中不自然，也容易使“地步”被理解为处境或程度。“给愤怒留余地”既保留原文隐喻和未明说其所指的表达，也更符合现代汉语。
  terminology: 将ἀγαπητοί译为“亲爱的”足以保留亲切、庄重的呼语，不应补作“弟兄姊妹”。“愤怒”不在正文加“神的”，并以脚注说明上下文最可能的指向，妥当地保存了原文的含蓄性。
