  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Λέγω γὰρ διὰ τῆς χάριτος τῆς δοθείσης μοι παντὶ τῷ ὄντι ἐν ὑμῖν μὴ ὑπερφρονεῖν παρ’ ὃ δεῖ φρονεῖν, ἀλλὰ φρονεῖν εἰς τὸ σωφρονεῖν, ἑκάστῳ ὡς ὁ θεὸς ἐμέρισεν μέτρον πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/003.yaml
  text: For by the grace given to me I say to everyone among you not to think of himself more highly than he ought to think, but to think with sound judgment, as God has apportioned to each a measure of faith.
translation:
  language: zh_hans
  text: 我凭着所赐给我的恩典，对你们中间的每一个人说：不要把自己看得过高，过于所当看的；倒要照着上帝分给各人的信心尺度[b]，作出清醒而审慎的判断[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“倒要思想，好使自己清醒自持。”
    reason: lexical_alternative
  - marker: b
    text: 也可译作“上帝分给各人的一份信心”，或“信实（或信靠）的尺度”。希腊语可能指上帝所赐、与信心有关的某种份量或尺度，但没有明确说明其确切含义。
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τῆς χάριτος τῆς δοθείσης μοι
  choice: 凭着所赐给我的恩典
  rationale: διά加属格可表达凭借或根据；此译自然地保留保罗以所领受的恩典为说话依据的含义，不额外阐明其职分。
- source_word: παντὶ τῷ ὄντι ἐν ὑμῖν
  choice: 对你们中间的每一个人
  rationale: 保留παντί的逐一、普遍指向，也符合现代汉语表达。
- source_word: μὴ ὑπερφρονεῖν παρ’ ὃ δεῖ φρονεῖν
  choice: 不要把自己看得过高，超过所当看的
  rationale: 以重复的“看”尽量呈现ὑπερφρονεῖν与φρονεῖν的词语呼应，并保留自我评价不可越过适当界限的意思。
- source_word: ἀλλὰ φρονεῖν εἰς τὸ σωφρονεῖν
  choice: 倒要作出清醒而合宜的判断
  rationale: σωφρονεῖν兼有清醒、审慎、适度和自制的含义；此译用自然汉语表达理智与伦理两方面，同时不把它缩减为单纯谦卑。
- source_word: ἐμέρισεν
  choice: 分给
  rationale: 准确表达μερίζω的分配、分派含义，简洁自然。
- source_word: μέτρον πίστεως
  choice: 信心尺度
  rationale: “尺度”保留μέτρον既可指份量也可指衡量标准的空间；“信心”是πίστις在此处最稳妥的基本译法，避免限定为得救信心、服事能力或忠信。
theological_decisions:
- issue: μέτρον πίστεως的具体所指
  choice: 保留为“信心尺度”
  alternative: “一份信心”“信实的尺度”或“以信心为尺度”
  rationale: 下文谈到不同恩赐，可能暗示上帝所分派的服事范围或能力，但本句本身并未明确限定。译文保留“尺度”与“信心”之间的关系及其神学张力。
- issue: σωφρονεῖν在自我评价中的含义
  choice: 清醒而合宜的判断
  alternative: 头脑清醒、自守或看得适中
  rationale: 该词既涉及健全判断，也含适度和自制；不将它专门化为某一项德行。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看得过高／所当看的”保留原文围绕φρονέω形成的词语呼应；“清醒而合宜的判断”避免生硬直译。“上帝”依现代标准汉语圣经语体使用。
