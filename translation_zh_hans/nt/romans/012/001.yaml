id: ROM.12.1
reference: Romans 12:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Παρακαλῶ οὖν ὑμᾶς, ἀδελφοί, διὰ τῶν οἰκτιρμῶν τοῦ θεοῦ παραστῆσαι τὰ σώματα ὑμῶν θυσίαν ζῶσαν ἁγίαν ⸂εὐάρεστον τῷ θεῷ⸃, τὴν λογικὴν λατρείαν ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/001.yaml
  text: Therefore I urge you[a], brothers, by the mercies of God, to present your bodies as a living sacrifice[b], holy and pleasing to God—your reasonable worship.
translation:
  language: zh_hans
  text: 所以，弟兄们[a]，我凭着神的怜悯劝你们，要将你们的身体献上，作活的、圣洁的、蒙神喜悦的祭物；这就是你们合乎理性的敬拜[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“弟兄姊妹们”。希腊文直译是“弟兄们”；这种阳性复数称呼常可用于包括男女在内的群体。
    reason: alternative_reading
  - marker: b
    text: 或译“属灵的敬拜”或“合理的事奉”。希腊文这个短语可表达合乎理性、合理合宜或属灵的敬拜与服事。
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: 我……劝你们
  rationale: 此处是保罗郑重而恳切的劝勉，不只是一般请求。“劝”在现代汉语中自然，也保留使徒劝勉的力度。
- source_word: οὖν
  choice: 所以
  rationale: 表明本节的劝勉是根据《罗马书》1—11章此前的论述而作出的推论；“所以”清楚、自然地保留这一逻辑联系。
- source_word: ἀδελφοί
  choice: 弟兄们
  rationale: 保留希腊文阳性复数称呼的形式；该称呼在这里很可能涵盖罗马教会全体会众，其语境上的包容范围以脚注说明。
- source_word: διὰ τῶν οἰκτιρμῶν τοῦ θεοῦ
  choice: 凭着神的种种怜悯
  rationale: διά加属格在这里表示劝勉的根据。“凭着”保留这一作用；“种种怜悯”体现οἰκτιρμῶν的复数，并概括前文所陈明神多方面的慈悲。
- source_word: παραστῆσαι
  choice: 献上
  rationale: παρίστημι在献祭语境中有呈献、供奉之意。“献上”既自然，也与随后“祭物”的意象相呼应。
- source_word: τὰ σώματα ὑμῶν
  choice: 你们的身体
  rationale: 直译并保留σώματα的具体身体性，没有将其泛化为“你们自己”；同时不否认这里涉及完整的、有身体的人。
- source_word: θυσίαν ζῶσαν
  choice: 作为活的祭物
  rationale: 以补出“作为”表达宾语补足关系，并保留“活”与“祭物”之间有意形成的张力。
- source_word: ἁγίαν
  choice: 圣洁
  rationale: 表达祭物分别归给神、适合献给神的性质，同时保留该词常见的神学分量。
- source_word: εὐάρεστον τῷ θεῷ
  choice: 蒙神喜悦
  rationale: 准确表达祭物为神所悦纳、使神喜悦；比单说“可接受”更能传达εὐάρεστος的积极含义。
- source_word: λογικὴν
  choice: 合乎理性的
  rationale: λογικός可指合乎理性、合理合宜，也可能带有属灵的含义。“合乎理性的”较贴近词形和基本语义，同时将其他可能性保留在脚注中。
- source_word: λατρείαν
  choice: 敬拜
  rationale: λατρεία指向神所献的礼仪性服事或敬拜。结合全句献祭意象，“敬拜”在现代汉语中清楚自然；“事奉”的可能译法见脚注。
theological_decisions:
- issue: 对混合会众使用的呼语ἀδελφοί如何翻译
  choice: 弟兄们
  alternative: 弟兄姊妹们
  rationale: 正文保留原文阳性复数称呼的形式，不把语法形式无声改写；同时以脚注说明该词在此很可能包括女性信徒。
- issue: λογικὴν λατρείαν的多义性
  choice: 合乎理性的敬拜
  alternative: 属灵的敬拜；合理的事奉
  rationale: 该短语可能强调有理性、合理合宜，也可能被理解为属灵的敬拜或服事。正文采用贴近词面且较少预断的译法，脚注保留主要替代解释，避免消除原文的解释张力。
- issue: “身体”与“整个人”的关系
  choice: 保留“你们的身体”
  alternative: 献上你们自己
  rationale: 原文明说“身体”，虽可在语境中代表有身体的整个人，正文仍保留具体用词，以免削弱保罗对身体性献身的强调。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“种种怜悯”保留希腊文复数的修辞作用；“作为活的祭物”比凝缩成传统术语“活祭”更便于普通读者直接理解。分号凸显末句是对献身行动之性质的说明。
