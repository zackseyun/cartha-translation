  text: εἴτε ὁ παρακαλῶν ἐν τῇ παρακλήσει, ὁ μεταδιδοὺς ἐν ἁπλότητι, ὁ προϊστάμενος ἐν σπουδῇ, ὁ ἐλεῶν ἐν ἱλαρότητι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/008.yaml
  text: if exhorting[a], in exhortation; the one who shares, with generosity; the one who leads, with diligence; the one who shows mercy[e][d][c][b], with cheerfulness.
translation:
  language: zh_hans
  text: 劝勉人的，要在劝勉的事上[a]；分享的人，要慷慨[b]；带领人的，要殷勤[c]；怜悯人的，要带着欢喜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “劝勉……劝勉”也可译作“鼓励……鼓励”。原文的动词和名词同源，兼有劝勉、鼓励等意思。
    reason: lexical_alternative
  - marker: b
    text: “慷慨”也可译作“真诚”或“纯一”。原词可指专一无杂，也可在分享财物的语境中指慷慨。
    reason: lexical_alternative
  - marker: c
    text: “带领”也可译作“管理”或“主持”；“殷勤”也可译作“热切”或“认真”。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴτε ὁ παρακαλῶν ἐν τῇ παρακλήσει
  choice: 或是劝勉的，就当专心劝勉
  rationale: 承接上一节省略谓语的恩赐清单；补出“就当专心”使现代汉语完整自然，同时保留动词与同源名词的重复。παρακαλέω／παράκλησις兼有劝勉、鼓励等义，正文依清单中积极劝导的语境译为“劝勉”，并以脚注保存另一可能。
- source_word: ὁ μεταδιδοὺς
  choice: 分给人的
  rationale: μεταδίδωμι指把自己所有的分给或分享给别人；“分给”既保留资源共享的动作，也比单纯“施舍”更宽泛。
- source_word: ἐν ἁπλότητι
  choice: 要慷慨
  rationale: ἁπλότης可指纯一、真诚或慷慨；与分给财物相连时，“慷慨”最符合语境，但脚注保留“真诚／纯一”的词义张力。
- source_word: ὁ προϊστάμενος
  choice: 带领人的
  rationale: προΐστημι可表示带领、管理或主持；“带领”是宽泛而自然的现代汉语，不将其限定为特定教会职分。
- source_word: ἐν σπουδῇ
  choice: 要殷勤
  rationale: σπουδή包含殷勤、热切、认真之意；“殷勤”适合承担带领责任的语境，并保持简洁。
- source_word: ὁ ἐλεῶν ἐν ἱλαρότητι
  choice: 怜悯人的，要甘心喜乐
  rationale: ἐλεέω表示以行动施怜悯；ἱλαρότης表示喜乐、欣然或乐意。“甘心喜乐”兼顾内在乐意与外在愉悦，避免仅理解为表面笑容。
theological_decisions:
- issue: ὁ προϊστάμενος所指范围
  choice: 宽泛译作“带领人的”
  alternative: “管理人的”“主持人的”或特指教会职分者
  rationale: 原文采用一般性的实词化分词，未明说某一教会职位；宽泛译法保留其适用范围，避免加入特定教会体制。
- issue: ἁπλότης在分给语境中的含义
  choice: 正文取“慷慨”
  alternative: “真诚”“纯一”“不存二心”
  rationale: 因其直接修饰资源的分享，慷慨义在此最贴合上下文；但该词本有纯一和真诚的语义，因此用脚注保留歧义。
- issue: παρακαλέω／παράκλησις的语气
  choice: 正文译“劝勉……劝勉”
  alternative: “鼓励……鼓励”或兼含安慰
  rationale: 此词族兼有规劝、鼓励、安慰等含义；正文保留同源重复，并以脚注注明“鼓励”，不把恩赐仅限于责备式规劝。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。以“……的，就／要……”重现原文简短并列的劝令结构；“专心”是为表达希腊语ἐν短语所补出的自然汉语，不意在增加排他性的神学含义。脚注标记均紧随相关正文。
