  text: εἰ δυνατόν, τὸ ἐξ ὑμῶν μετὰ πάντων ἀνθρώπων εἰρηνεύοντες·
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/018.yaml
  text: If possible[a], as far as it depends on you, live at peace with all people.
translation:
  language: zh_hans
  text: 如果可能[a]，在你们力所能及的范围内，要与所有人和睦相处。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“若是可行，就你们这一方面说，要与所有人和睦相处。”
    reason: 原文的两个限定语可按不同但相近的汉语句法表达；此译较贴近τὸ ἐξ ὑμῶν“就你们这一方面”的字面结构。
lexical_decisions:
- source_word: εἰ δυνατόν
  choice: 如果可能
  rationale: 简洁自然地保留条件限定，表明这项劝勉承认现实中和平未必总能达成。
- source_word: τὸ ἐξ ὑμῶν
  choice: 只要在于你们
  rationale: 保留原文较凝练的责任范围表达，指在读者自身能力与责任所及的范围内；同时避免暗示和平的结果完全由一方掌控。
- source_word: μετὰ πάντων ἀνθρώπων
  choice: 与所有人
  rationale: ἄνθρωποι在此泛指人类，不限男性；“所有人”准确、自然，也保留劝勉的普遍范围。
- source_word: εἰρηνεύοντες
  choice: 和睦相处
  rationale: 该现在分词在上下文中具有劝勉作用，并含持续意味；“和睦相处”以现代汉语自然表达持续过和平生活。
theological_decisions:
- issue: 和平劝勉的范围与限制
  choice: 劝勉信徒与所有人和睦相处，同时以“如果可能”和“只要在于你们”限定其责任范围。
  alternative: 把本句译成毫无限定、保证和平必能实现的绝对命令。
  rationale: εἰ δυνατόν与τὸ ἐξ ὑμῶν共同保留现实张力：信徒应普遍追求和平，却不能单方面保证和平一定实现。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“只要在于你们”略带经文式凝练，以贴近原文τὸ ἐξ ὑμῶν的结构；脚注提供更明白的现代释义。
