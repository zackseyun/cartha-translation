  text: καθάπερ γὰρ ἐν ἑνὶ σώματι ⸂πολλὰ μέλη⸃ ἔχομεν, τὰ δὲ μέλη πάντα οὐ τὴν αὐτὴν ἔχει πρᾶξιν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/004.yaml
  text: For just as in one body we have many members[a], but the members do not all have the same function[b],
translation:
  language: zh_hans
  text: 正如一个身体有许多肢体[a]，但各肢体并不都有同样的功能[b]；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “肢体”或译“部分”。
    reason: lexical_alternative
  - marker: b
    text: “功能”或译“作用”或“活动”。原文词可指活动或功能；这里按身体的比喻译作“功能”。
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ γὰρ
  choice: 正如
  rationale: καθάπερ引出将在下一节完成的类比；γάρ承接并解释上文。现代汉语中合译为“正如”最自然，且分号和后续句意可体现其论证衔接，若硬译“因为”反而生涩。
- source_word: ἐν ἑνὶ σώματι
  choice: 一个身体上
  rationale: 保留“一个身体”的单数意象；汉语谈身体的组成部分时用“身体上”比直译“在一个身体里”更自然。
- source_word: πολλὰ μέλη
  choice: 许多肢体
  rationale: μέλη在身体比喻中指身体的肢体或组成部分。“肢体”既保持解剖意象，也能自然承接保罗后文的群体应用。
- source_word: ἔχομεν
  choice: 我们……有
  rationale: 直接表达第一人称复数现在时，并按汉语习惯组成“我们一个身体上有……”的句式。
- source_word: τὰ δὲ μέλη πάντα οὐ
  choice: 但各肢体并不都
  rationale: 用“并不都”准确保留否定的范围：不是所有肢体都有同样功用，而非所有肢体一概没有功用。
- source_word: τὴν αὐτὴν ἔχει πρᾶξιν
  choice: 有同样的功用
  rationale: πρᾶξις可指行动、活动或职能；在身体各部分的比喻中，“功用”自然贴切，同时不把它限定为正式职位。
theological_decisions:
- issue: 身体比喻是否在本节明说教会
  choice: 只译“一个身体”和“许多肢体”，不在正文补出“教会”
  alternative: 译作“一个身体，就是教会”
  rationale: 本节先陈述身体的类比，下一节才明确应用于“我们”。保留这一铺陈次序，避免把解释性神学指向提前加入正文。
- issue: πρᾶξις是否译为带职位色彩的“职分”
  choice: 译为“功用”
  alternative: 译为“职分”或“作用”
  rationale: “职分”容易使读者只想到正式教会职位；“功用”既符合身体比喻，也保留各肢体活动或功能有别的宽泛含义。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“我们一个身体上”保留共同的人体经验，不提前点明教会；“并不都”清楚表达希腊文否定范围。句末用分号，提示本节的类比将在下一节继续完成。
