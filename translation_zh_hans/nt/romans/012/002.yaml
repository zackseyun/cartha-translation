  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ μὴ ⸀συσχηματίζεσθε τῷ αἰῶνι τούτῳ, ἀλλὰ ⸀μεταμορφοῦσθε τῇ ἀνακαινώσει τοῦ ⸀νοός, εἰς τὸ δοκιμάζειν ὑμᾶς τί τὸ θέλημα τοῦ θεοῦ, τὸ ἀγαθὸν καὶ εὐάρεστον καὶ τέλειον.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/002.yaml
  text: And do not be conformed to this age[a], but be transformed by the renewing of your mind[c][b], so that you may discern what the will of God is—the good and pleasing and perfect.
translation:
  language: zh_hans
  text: 不要效法这个世代[a]，反要借着心思的更新而改变，使你们能察验[b]什么是上帝的旨意，就是美善、蒙上帝喜悦[c]、完全的旨意。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“这个世界”。希腊语αἰών更确切地指“世代、时代”，这里是指现今的秩序或时代。
    reason: lexical_alternative
  - marker: b
    text: 或译“检验并认可”。希腊语动词既可指检验，也可包括辨明并认可经过检验之事。
    reason: lexical_alternative
  - marker: c
    text: 或译“可接受”或“蒙悦纳”。希腊语εὐάρεστον在这里通常指蒙上帝喜悦。
    reason: lexical_alternative
lexical_decisions:
- source_word: συσχηματίζεσθε
  choice: 效法
  rationale: 该动词指依照外在样式而塑造或顺应。“效法”在现代汉语中简洁自然，并与下文内在的“改变”形成对照；这里的否定命令译为“不要效法”。
- source_word: αἰῶνι τούτῳ
  choice: 这个世代
  rationale: αἰών在此主要指现今的时代及其秩序，而非受造世界本身。“这个世代”保留其时间与伦理层面的含义。
- source_word: μεταμορφοῦσθε
  choice: 改变
  rationale: 该词表示形态或状态上的深刻转变。汉语“改变”自然庄重；不添加明确施事者，以保留希腊语中间／被动形式在此可能具有的张力。
- source_word: τῇ ἀνακαινώσει τοῦ νοός
  choice: 借着心思的更新
  rationale: 与格按工具意义理解，说明改变所借助的途径。“心思”指人的思考、判断与道德辨识能力；“更新”保留持续焕新的意味。
- source_word: εἰς τὸ δοκιμάζειν
  choice: 使你们能察验
  rationale: 该结构表达目的或结果。δοκιμάζω兼有检验、辨明并认可之意；“察验”保留评估性的语义，而不暗示人对上帝的旨意作最终裁判。
- source_word: τί τὸ θέλημα τοῦ θεοῦ
  choice: 什么是上帝的旨意
  rationale: 保留τί所表达的间接疑问，也明确呈现τοῦ θεοῦ的所属关系。
- source_word: ἀγαθὸν καὶ εὐάρεστον καὶ τέλειον
  choice: 美善、可喜悦、完全
  rationale: 三个并列形容词作为同位说明，描述上帝旨意的性质。“可喜悦”保留εὐάρεστον的开放性，不在正文中强行补出喜悦者；“完全”保留τέλειον在此处完整、无缺的分量。
theological_decisions:
- issue: αἰών在伦理对照中的译法
  choice: 这个世代
  alternative: 这个世界；现今的世界秩序
  rationale: “世代”避免把经文转化为对受造世界本身的否定，并保留保罗关于现今时代与更新改变之间的张力。
- issue: μεταμορφοῦσθε的语态与改变的施事者
  choice: 反要借着心思的更新而改变
  alternative: 反要被改变；反要改变自己
  rationale: 希腊语形式可作中间或被动理解。正文不明说“自己”或外在施事者，以免把人的参与或上帝的工作单方面固定下来。
- issue: δοκιμάζειν与上帝旨意的关系
  choice: 察验
  alternative: 辨明；检验并认可
  rationale: “察验”既包括分辨，也包括经检验后认同的意味，同时不把人描写成审判上帝旨意的人。
- issue: εὐάρεστον所指的喜悦者
  choice: 可喜悦
  alternative: 蒙上帝喜悦；可接受
  rationale: 原文未明说喜悦的主体。正文保留这种简洁与开放性，脚注提示主要解释和另一词义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。句式保留原文“不要……反要……”的命令对照，并将末尾三个形容词作为对“上帝的旨意”的同位说明。避免使用过度教会化或古奥的表达，也不在正文中补出原文未明说的施事者或喜悦主体。
