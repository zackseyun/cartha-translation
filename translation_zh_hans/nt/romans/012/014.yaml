  yaml_path: translation/nt/romans/012/014.yaml
  text: Bless those who persecute you[a]; bless and do not curse.
translation:
  language: zh_hans
  text: 要祝福迫害你们的人[a]；要祝福，不可咒诅。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“追赶你们的人。”希腊语动词可指“追赶、追逐”，但这里很可能指怀有敌意的迫害。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: 祝福
  rationale: 这是复数命令式。“祝福”在现代汉语中自然、简洁，既可表达说祝福的话，也可表达祈愿对方蒙福；并保留原文两次重复所形成的强调。
- source_word: τοὺς διώκοντας
  choice: 迫害你们的人
  rationale: 带冠词的分词在此作名词性用法，指正在实施迫害的人。διώκω本可泛指“追赶、追逐”，但结合本节祝福与咒诅的对照及新约常见用法，此处以“迫害”最合语境。“你们”由劝勉对象和关系语境补明。
- source_word: καὶ
  choice: （以分号衔接）
  rationale: καὶ连接重复的正面命令与随后的禁令。汉语用分号自然呈现并列和递进强调，无须机械译出“并且”。
- source_word: μὴ καταρᾶσθε
  choice: 不可咒诅
  rationale: μή加命令式构成禁令。“不可咒诅”与前面的“祝福”形成鲜明而简洁的对照，也保留了原文禁止以恶言或求祸回应的宽泛含义。
theological_decisions:
- issue: διώκω在本节中的范围
  choice: 按敌意的“迫害”翻译
  alternative: 追赶你们的人／追逐你们的人
  rationale: 虽然该动词可以表示一般性的“追赶、追逐”，但保罗书信及早期基督徒伦理语境常用它指迫害；本节将祝福与咒诅对置，也表明敌意相待的人在视野之内。脚注保留其较宽的词汇可能性。
- issue: 对迫害者的伦理命令
  choice: 保留两次“祝福”及绝对形式的禁令
  alternative: 将第二次“祝福”弱化为解释性复述，或把禁令具体化为“不要报复”
  rationale: 原文重复εὐλογεῖτε，并明确使用καταράομαι“咒诅”，因此不将其泛化为报复，也不削弱重复产生的强调和神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“要为……祝福”明确祝福的对象；“要祝福，不可咒诅”保留原文简短有力的重复和平行对照。脚注标记[a]已置于相应主文本之后。
