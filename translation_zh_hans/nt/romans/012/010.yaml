  text: τῇ φιλαδελφίᾳ εἰς ἀλλήλους φιλόστοργοι, τῇ τιμῇ ἀλλήλους προηγούμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/010.yaml
  text: In brotherly love, be affectionate toward one another; in honor, outdo one another.
translation:
  language: zh_hans
  text: 要以手足之爱彼此相亲相爱；要在尊重上彼此争先。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φιλαδελφίᾳ
  choice: 手足之爱
  rationale: 原词指弟兄姊妹般的亲爱；在本段语境中用于信徒彼此的关系。“手足”自然、简洁，并兼顾男女。
- source_word: φιλόστοργοι
  choice: 相亲相爱
  rationale: 该词表达家人之间温厚亲密的爱，与前面的“手足之爱”相互加强；译为“相亲相爱”保留亲情意味，又符合现代汉语表达。
- source_word: τιμῇ
  choice: 尊重
  rationale: τιμή可指尊荣、敬重；此处采用“尊重”，突出彼此给予敬意的实际态度。
- source_word: προηγούμενοι
  choice: 争先
  rationale: 该分词可理解为走在前面、率先，也可能含看重或优先对待之意。“彼此争先”保留主动竞相尊重对方的修辞力度，并与最新修订中的“outdo one another”一致。
theological_decisions:
- issue: προηγούμενοι的解释范围
  choice: 以尊重彼此争先
  alternative: 彼此推让、彼此尊重在先／要尊重别人过于自己
  rationale: 原词在此可表达率先、领先或优先看重；译文不将其直接解释为自我贬抑，而保留保罗劝勉众人竞相尊重彼此的张力。
translation_notes:
  register: 采用现代、庄重而易懂的劝勉语体；两个并列分句保留原文的平衡结构。“手足”避免仅用“弟兄”可能造成的男性限定感。
