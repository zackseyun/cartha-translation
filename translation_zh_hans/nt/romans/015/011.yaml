id: ROM.15.11
reference: Romans 15:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ πάλιν· Αἰνεῖτε, ⸂πάντα τὰ ἔθνη, τὸν κύριον⸃, καὶ ⸀ἐπαινεσάτωσαν αὐτὸν πάντες οἱ λαοί.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/011.yaml
  text: 'And again: “Praise the Lord[a], all the nations[b], and let all the peoples praise him.”'
translation:
  language: zh_hans
  text: 又说：“列国[b]啊，你们都要赞美主[a]！万民都要颂赞他。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“耶和华”。这句引自旧约；希伯来文原文使用神的名，希腊文则以“主”（κύριος）表示。
    reason: alternative_reading
  - marker: b
    text: 或译“所有外邦人”。希腊文ἔθνη既可指“列国”，也可指“外邦人”；此处引文具有普世意义，同时也切合保罗关于外邦人的论述。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ πάλιν
  choice: 又说
  rationale: 承接上文并引出另一处经文引语；“又说”自然体现“并且再次”的篇章功能。
- source_word: Αἰνεῖτε
  choice: 你们都要赞美
  rationale: 保留第二人称复数命令语气；加入“你们”使现代汉语呼语后的命令清楚自然。
- source_word: πάντα τὰ ἔθνη
  choice: 列国
  rationale: ἔθνη既可指各国，也可指外邦人；引文在此呼召普世敬拜，“列国”保留广泛的群体意义，并与下句“万民”形成对应。
- source_word: τὸν κύριον
  choice: 主
  rationale: 直接对应希腊文κύριος；旧约希伯来文来源中的神名这一层意义另以脚注说明。
- source_word: ἐπαινεσάτωσαν
  choice: 都要颂赞
  rationale: 以自然的现代汉语表达第三人称复数命令式的劝令语气，并用“颂赞”体现与前句的平行变化。
- source_word: αὐτὸν
  choice: 他
  rationale: 明确回指前句的“主”，同时避免不必要的重复。
- source_word: πάντες οἱ λαοί
  choice: 万民
  rationale: 保留λαοί与前句ἔθνη的词汇区别；“万民”简洁、庄重，并准确表达所有族群。
theological_decisions:
- issue: 旧约引文中κύριος所指以色列的神，应如何译出
  choice: 主
  alternative: 耶和华
  rationale: 直接按本节希腊文κύριος译为“主”，不在正文中越过希腊文本改按希伯来底本译名；同时以脚注保留其所代表神名的旧约背景。
- issue: 保罗论述外邦人时ἔθνη的译法
  choice: 列国
  alternative: 外邦人
  rationale: 引文本身具有呼召各国普遍赞美的意义，因此正文采用较宽广且贴近集体图景的“列国”；“外邦人”与罗马书15章的论证密切相关，作为真实的词义可能收入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的经文语体。“列国”与“万民”既保留诗歌式平行，也维持ἔθνη和λαοί之间的词汇区别；两个分句均以“都要”传达命令和劝勉的力度。
