  text: ὡς ⸀ἂν πορεύωμαι εἰς τὴν ⸀Σπανίαν, ἐλπίζω γὰρ διαπορευόμενος θεάσασθαι ὑμᾶς καὶ ὑφ’ ὑμῶν προπεμφθῆναι ἐκεῖ ἐὰν ὑμῶν πρῶτον ἀπὸ μέρους ἐμπλησθῶ—
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/024.yaml
  text: whenever I go to Spain—for I hope[a], as I pass through, to see you and to be sent on my way there by you[c][b], if first I may be satisfied in part with your company—
translation:
  language: zh_hans
  text: 我去西班牙的时候[a]——因为我盼望在途中经过时见到你们；若我先从与你们的相聚中稍得满足，就由你们送我上路到那里[b]——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“当我去西班牙时”。原文结构表示未定的将来时间。
    reason: lexical_alternative
  - marker: b
    text: 或译：“由你们帮助我前往那里”。原文动词可指为人送行，并可含有陪送或协助其继续旅程的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ἂν πορεύωμαι
  choice: 等我去……的时候
  rationale: ὡς ἄν与虚拟语气表示未确定的将来时间；“等我……的时候”在现代汉语中自然地保留这种未来与未定的意味。
- source_word: Σπανίαν
  choice: 西班牙
  rationale: 采用该地名的现代标准汉语译名。
- source_word: ἐλπίζω γὰρ
  choice: 因为我盼望
  rationale: “因为”保留γάρ的解释作用；“盼望”兼具期待与愿望的意味。
- source_word: διαπορευόμενος
  choice: 途中经过你们那里
  rationale: 该分词描写前往另一目的地时途经罗马；译文补出“你们那里”，使汉语表达清楚而不改变行程关系。
- source_word: θεάσασθαι ὑμᾶς
  choice: 见到你们
  rationale: 准确表达亲自相见，且比“看见你们”更符合探访语境。
- source_word: ὑφ’ ὑμῶν προπεμφθῆναι ἐκεῖ
  choice: 由你们送我上路，前往那里
  rationale: προπέμπω可包括送行、陪送或为下一段旅程提供帮助；“送我上路”保留宽泛含义，不具体限定帮助形式。
- source_word: ἐὰν ... ἐμπλησθῶ
  choice: 但愿我……得满足
  rationale: ἐάν加虚拟语气表达尚未确定的条件；在此用“但愿”自然呈现保罗的期待。“得满足”传达ἐμπίμπλημι的充足、满足意象。
- source_word: ὑμῶν πρῶτον
  choice: 我先与你们相聚
  rationale: πρῶτον表示时间上的先后；属格ὑμῶν在相聚语境中自然译为“与你们相聚”。
- source_word: ἀπὸ μέρους
  choice: 稍
  rationale: 该短语直译为“部分地”；此处“稍”简洁保留满足并非完全或停留有限的意味，同时不强行判定具体所指。
theological_decisions:
- issue: 罗马信徒将怎样帮助保罗继续旅程
  choice: 译作“由你们送我上路，前往那里”
  alternative: “由你们帮助我前往那里”或“由你们陪送到那里”
  rationale: 原文动词可能包含陪伴、物质供应或其他旅途协助，但没有说明具体形式；译文保留一般性的送行与支持含义。
- issue: 保罗从与罗马信徒相聚中所得的满足
  choice: 译作“与你们相聚，稍得满足”
  alternative: “从你们稍得满足”或“暂且享受与你们相聚”
  rationale: 原文保留“充满／满足”的意象，并以ἀπὸ μέρους加以限制；译文既指出人际相聚的语境，也不把限制明确解释成逗留时间短暂或喜乐不完全。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。保留全句作为承接上下文的未完结构，并以破折号呈现；避免把送行具体化为金钱支持，也避免将ἀπὸ μέρους唯一解释为停留时间短暂。
