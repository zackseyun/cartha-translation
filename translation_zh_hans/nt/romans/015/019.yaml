  text: ἐν δυνάμει σημείων καὶ τεράτων, ἐν δυνάμει ⸀πνεύματος· ὥστε με ἀπὸ Ἰερουσαλὴμ καὶ κύκλῳ μέχρι τοῦ Ἰλλυρικοῦ πεπληρωκέναι τὸ εὐαγγέλιον τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/019.yaml
  text: by the power of signs and wonders[a], by the power of the Spirit, so that from Jerusalem and all around as far as Illyricum I have fully proclaimed the gospel of the Messiah[b],
translation:
  language: zh_hans
  text: 借着神迹奇事的大能，借着圣灵的大能，以致我从耶路撒冷起，连同周围各地，直到以利哩古，已经把基督的福音充分传扬了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν δυνάμει σημείων καὶ τεράτων
  choice: 借着神迹奇事的能力
  rationale: 重复结构中的ἐν δυνάμει表示凭借或施行事工的媒介；“神迹奇事”保留这组传统而自然的圣经用语。
- source_word: ἐν δυνάμει πνεύματος
  choice: 借着圣灵的能力
  rationale: 上下文所指最自然是上帝的灵；汉语若只译“灵”容易含混，因此明确译作“圣灵”，但不另加原文没有的神学说明。
- source_word: ὥστε με ... πεπληρωκέναι
  choice: 我就……传遍了
  rationale: ὥστε引出前述能力所产生的结果；完成时不定式表达已经达成的事工成果。结合地域范围，πεπληρωκέναι τὸ εὐαγγέλιον意为使福音在该范围内得到充分传扬，“传遍了”比直译“充满/成全福音”更自然准确。
- source_word: ἀπὸ Ἰερουσαλὴμ καὶ κύκλῳ μέχρι τοῦ Ἰλλυρικοῦ
  choice: 从耶路撒冷起，直到以利哩古，周围各处
  rationale: 保留起点、终点和κύκλῳ所表达的周边广大地区，不将其误解为一条精确的环形路线。
- source_word: τὸ εὐαγγέλιον τοῦ Χριστοῦ
  choice: 基督的福音
  rationale: “福音”是保罗书信中清楚而通行的用语；现代汉语圣经语境中“基督”自然保留Χριστός的称号意义。
theological_decisions:
- issue: πνεύματος的所指
  choice: 圣灵
  alternative: 灵
  rationale: 神迹奇事和使徒事工蒙能力的语境强烈指向圣灵；在汉语中明确所指能避免把它理解为人的精神或一般灵性。
- issue: πεπληρωκέναι τὸ εὐαγγέλιον的含义
  choice: 把基督的福音传遍了
  alternative: 充分传扬了基督的福音；成全了基督的福音
  rationale: 这里不是说福音本身有所欠缺，而是说保罗已使福音在所述地域范围内得到广泛而充分的传扬。“传遍”保留完成性和地域性的张力，却不暗示当地每一个人都已听见。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我就”自然承接ὥστε的结果关系；地名采用中文圣经中通行的“以利哩古”。句末按独立经节处理为句号。
