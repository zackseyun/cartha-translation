base_translation:
  language: en
  yaml_path: translation/nt/romans/015/025.yaml
  text: But now I am going to Jerusalem[a], ministering to the saints.
translation:
  language: zh_hans
  text: 但现在，我要去耶路撒冷，服事圣徒。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “服事”也可译作“为圣徒服务”或“把援助送给圣徒”。这里的希腊词可以指实际的服务；结合下一节，很可能是指保罗把捐款送给耶路撒冷的信徒。
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: 但现在
  rationale: νυνί强调当前时点，δέ在此构成温和的转折或承接；“但现在”自然保留这两层作用。
- source_word: πορεύομαι
  choice: 我要去
  rationale: 该现在时形式在语境中表达保罗当前的行程安排或意向；“我要去”比“我正在去”更符合现代汉语，同时不额外断定他已经上路。
- source_word: εἰς Ἰερουσαλὴμ
  choice: 去耶路撒冷
  rationale: εἰς与城市名连用，表示移动的目的地；汉语用“去耶路撒冷”最自然。
- source_word: διακονῶν
  choice: 服事
  rationale: 该现在主动分词说明此行相关的服事，可表达伴随情况或目的。结合下一节，实际涉及送交捐款援助，但正文不把语义收窄为“送援款”。
- source_word: τοῖς ἁγίοις
  choice: 那里的圣徒
  rationale: οἱ ἅγιοι在保罗书信中通常指属神的信徒。“圣徒”保留其群体称谓；补出“那里”使汉语明确其为耶路撒冷的圣徒，这是由目的地和紧接语境所支持的指向。
theological_decisions:
- issue: “圣徒”的所指
  choice: 保留“圣徒”，并以“那里”指向耶路撒冷的信徒
  alternative: 译作“上帝的子民”或直接写成“耶路撒冷的信徒”
  rationale: “圣徒”较直接对应τοῖς ἁγίοις，也保留保罗惯用的群体称谓；上下文尤其下一节表明所指是耶路撒冷的信徒，特别是其中的穷人，但本节不宜把范围直接限定为穷人。
- issue: διακονῶν所表达的关系
  choice: 以“服事”保留可兼具伴随与目的意味的表达
  alternative: 译作“为要服事”或“把援助送给”
  rationale: 希腊分词本身未用明确的目的连接词；后文显示此行与送交捐款有关，但正文保留其较宽的服务性含义，脚注交代具体语境。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“服事”和“圣徒”是读者较熟悉的圣经用语；脚注说明其现实援助背景，避免正文过度解释。
