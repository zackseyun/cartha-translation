  text: ὁ δὲ θεὸς τῆς ἐλπίδος πληρώσαι ὑμᾶς πάσης χαρᾶς καὶ εἰρήνης ἐν τῷ πιστεύειν, εἰς τὸ περισσεύειν ὑμᾶς ἐν τῇ ἐλπίδι ἐν δυνάμει πνεύματος ἁγίου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/013.yaml
  text: May the God of hope fill you with all joy and peace in believing, so that you may abound in hope by the power of the Holy Spirit.
translation:
  language: zh_hans
  text: 但愿赐盼望的神在你们信靠之中，以各样的喜乐和平安充满你们，好让你们借着圣灵的能力满有盼望。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ θεὸς τῆς ἐλπίδος
  choice: 但愿赐盼望的神
  rationale: δὲ在此为轻微承接，汉语祝愿句不必另译连接词；属格τῆς ἐλπίδος既可描述神与盼望的关系，也蕴含神是盼望的源头。“赐盼望的神”在现代汉语中自然，并与下文“盼望”保持呼应。
- source_word: πληρώσαι ὑμᾶς πάσης χαρᾶς καὶ εἰρήνης
  choice: 使你们充满各样的喜乐和平安
  rationale: 不定过去时祈愿式表达祝愿，用“但愿……使”自然呈现；“充满”保留原文的充盈意象，“各样的”表达πάσης的周全范围。
- source_word: ἐν τῷ πιστεύειν
  choice: 因着你们的信
  rationale: ἐν加冠词不定式可表达处境、伴随或关联；此处译作“因着你们的信”在汉语中清楚自然，同时保留信靠与喜乐、平安之间的关系，不将其抽象化为教义术语。
- source_word: εἰς τὸ περισσεύειν ὑμᾶς
  choice: 好让你们……满有
  rationale: εἰς τὸ加不定式在此可兼具目的与结果意味；“好让”自然表达预期结果，“满有”对应περισσεύειν的丰盛、充溢之意。
- source_word: ἐν τῇ ἐλπίδι
  choice: 满有盼望
  rationale: 汉语用“满有盼望”比直译“在盼望中丰盛”更自然，同时保留与前文“赐盼望的神”的词汇呼应。
- source_word: ἐν δυνάμει πνεύματος ἁγίου
  choice: 靠着圣灵的能力
  rationale: ἐν δυνάμει在此突出凭借或施行的能力；“靠着”清楚表达工具性，“圣灵”是现代中文基督教语境中自然且准确的专名表达。
theological_decisions:
- issue: θεὸς τῆς ἐλπίδος中属格的含义
  choice: 赐盼望的神
  alternative: 盼望的神
  rationale: 原属格可涵盖神以盼望为特征、为对象或为源头等关联。“赐盼望的神”突出上下文中神使信徒满有盼望的作用，但不排除“盼望的神”更形式对应的理解。
- issue: ἐν τῷ πιστεύειν的关系
  choice: 因着你们的信
  alternative: 在信靠中／当你们信的时候
  rationale: 该结构可表示范围、处境或伴随情况，也可在语境中带出因由。“因着”符合自然汉语，但不把信理解为赚取神恩赐的功劳。
- issue: πνεύματος ἁγίου的所指
  choice: 圣灵
  alternative: 圣洁的灵
  rationale: 保罗语境中该短语通常指神的圣灵；译作固定称谓“圣灵”最自然，同时没有增添原文未明说的进一步教义定义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。句式保留祈愿语气及“神—信—喜乐和平安—盼望—圣灵能力”的逻辑推进；避免生硬照搬希腊语介词结构。
