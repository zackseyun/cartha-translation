source:
  edition: SBLGNT
  text: Διὸ προσλαμβάνεσθε ἀλλήλους, καθὼς καὶ ὁ Χριστὸς προσελάβετο ⸀ὑμᾶς, εἰς δόξαν ⸀τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/007.yaml
  text: Therefore welcome one another[a], just as the Messiah also welcomed you[c][b], for the glory of God.
translation:
  language: zh_hans
  text: 因此，你们要彼此接纳[a]，正如弥赛亚[b]也接纳了你们，为使上帝得荣耀。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “接纳”也可译作“欢迎”或“接受”。
    reason: lexical_alternative
  - marker: b
    text: “弥赛亚”也可译作“基督”；意为“受膏者”。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“为上帝的荣耀”或“归于上帝的荣耀”。原文可表达目的或结果。
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὸ
  choice: 所以
  rationale: 承接前文并引出推论；“所以”自然清楚地保留逻辑关系。
- source_word: προσλαμβάνεσθε / προσελάβετο
  choice: 接纳 / 接纳了
  rationale: 同一希腊动词在命令和陈述中重复出现，译文也保持同词呼应；“接纳”既可表达接受对方，也具有群体关系中的欢迎意味。
- source_word: ἀλλήλους
  choice: 彼此
  rationale: 准确表达相互、双向的关系，符合现代汉语习惯。
- source_word: καθὼς καὶ
  choice: 正如……也
  rationale: 同时保留比较关系和καί的附加意味，并符合自然汉语句式。
- source_word: ὁ Χριστὸς
  choice: 基督
  rationale: 这里带冠词，具有称号意味；“基督”是现代汉语中通行而庄重的称谓，并以脚注说明其含义及另一译法。
- source_word: ὑμᾶς
  choice: 你们
  rationale: 按所给SBLGNT正文直译第二人称复数，作为“接纳了”的宾语。
- source_word: εἰς δόξαν τοῦ θεοῦ
  choice: 为使上帝得荣耀
  rationale: εἰς在此可表达目的或结果；该译法自然地呈现荣耀归于上帝的指向，同时不把目的与结果截然分开。
theological_decisions:
- issue: Χριστός作为称号的表达
  choice: 基督
  alternative: 弥赛亚
  rationale: “基督”保留中文基督教语境中通行的称谓；脚注指出它意为“受膏者”，也可译作“弥赛亚”，从而显明称号性质而不强行改作较不常见的正文形式。
- issue: προσλαμβάνομαι在群体关系中的语气
  choice: 彼此接纳
  alternative: 彼此欢迎 / 彼此接受
  rationale: “接纳”能涵盖实际欢迎和关系上的接受，适合罗马书14—15章的群体处境，又不额外加入特定宗派含义。
- issue: εἰς δόξαν τοῦ θεοῦ的目的或结果意味
  choice: 为使上帝得荣耀
  alternative: 归于上帝的荣耀 / 从而使上帝得荣耀
  rationale: 原短语可以指向目的或结果；正文采用兼具目的和结果色彩的自然汉语，脚注保留这种语义幅度。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“接纳”在伦理和群体关系上的温度，并在前后两处使用同一译词，以显出保罗刻意设置的呼应。句末目的短语保持宽泛修饰范围，不武断限定它只修饰基督的接纳或信徒彼此的接纳。
