base_translation:
  language: en
  yaml_path: translation/nt/romans/015/002.yaml
  text: Let each of us please his neighbor for his good[b][a], for building him up.
translation:
  language: zh_hans
  text: 我们每个人都应当为着邻舍的益处[a]使邻舍喜悦，为要造就邻舍[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为善”或“向着有益的事”。原文强调有益和良善的目标，并不是单纯讨好人。
    reason: lexical_alternative
  - marker: b
    text: 或译：“使邻舍得建立”。原文直译有“建造”的意思，这里比喻使人得到坚固和成长。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος ἡμῶν
  choice: 我们每个人
  rationale: 保留分配性的单数含义，并以自然的现代汉语表达对群体中每一个人的劝勉。
- source_word: τῷ πλησίον
  choice: 邻舍
  rationale: 在此指伦理意义上与自己相关的他人；“邻舍”简洁、庄重，也能与圣经一贯用语衔接。
- source_word: ἀρεσκέτω
  choice: 都应当……使他喜悦
  rationale: 表达第三人称现在时命令式的劝勉和约束力；“使他喜悦”保留原词含义，而后面的目的语限定这并非无原则地讨好。
- source_word: εἰς τὸ ἀγαθὸν
  choice: 为邻舍的益处
  rationale: 将目的或趋向表达为对邻舍有益，明确这里所说的取悦以善和益处为界限，同时不把“善”的内涵过度具体化。
- source_word: πρὸς οἰκοδομήν
  choice: 为要造就他
  rationale: οἰκοδομή在此为比喻义，指建立、坚固他人；“造就”是自然而庄重的现代汉语圣经用语，所补出的“他”承接单数的“邻舍”。
theological_decisions:
- issue: 使邻舍喜悦的伦理范围
  choice: 以邻舍的益处和造就为目的的取悦
  alternative: 把这句话理解为无条件迎合或讨好他人
  rationale: 原文的两个目的短语限制了ἀρέσκω的含义；译文同时保留“益处”和“造就”，避免将其读成不受约束的取悦他人。
- issue: εἰς τὸ ἀγαθὸν的指向
  choice: 译为“为邻舍的益处”
  alternative: 译为“为善”或“使他行善”
  rationale: 希腊语可强调善、益处或有益的目标；上下文支持与邻舍有关的受益含义，但原文没有明确说“使他行善”，因此不作这一较强解释。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“邻舍”和“造就”保留了熟悉的圣经语域，但句法保持现代自然；两个脚注标记均置于相关短语之后。
