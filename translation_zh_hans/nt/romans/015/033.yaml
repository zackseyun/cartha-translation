id: ROM.15.33
reference: Romans 15:33
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς τῆς εἰρήνης μετὰ πάντων ὑμῶν· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/033.yaml
  text: May the God of peace be with all of you. Amen.
translation:
  language: zh_hans
  text: 愿赐平安的上帝与你们众人同在。阿们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: 不另译
  rationale: 此处是轻微的承接或转折语气，用于引入结尾祝福，并非表示时间的“现在”。汉语直接进入祝福语更自然，篇章衔接可由上下文体现。
- source_word: θεὸς τῆς εἰρήνης
  choice: 赐平安的上帝
  rationale: 属格短语既可直译为“平安的上帝”，也可表达上帝是平安的赐予者。此处采用现代汉语中自然且庄重的保罗书信惯用表达，同时保留“平安”这一核心概念。
- source_word: εἰρήνης
  choice: 平安
  rationale: “平安”能涵盖和平、和好与整全福祉，是此类祝福语中自然而充分的译法。
- source_word: μετὰ πάντων ὑμῶν
  choice: 与你们众人同在
  rationale: 原文没有明说动词；汉语祝福语补出“愿……同在”。“你们众人”明确保留 πάντων 的全体范围。
- source_word: ἀμήν
  choice: 阿们
  rationale: 保留通行的礼仪性音译，体现庄严的结束语气。
theological_decisions:
- issue: 无动词短句应译作陈述还是祝愿
  choice: 译作祝福祈愿：“愿……同在”
  alternative: “赐平安的上帝与你们众人同在”或“赐平安的上帝正与你们众人同在”
  rationale: 虽然希腊文没有明示祈愿式动词，但在书信结尾公式中，这种结构自然具有祝祷功能。补出“愿”能在现代汉语中准确传达其语用作用，而不把它限定为事实陈述。
- issue: θεὸς τῆς εἰρήνης 的属格关系
  choice: 赐平安的上帝
  alternative: 平安的上帝
  rationale: 原文属格具有一定语义宽度；“赐平安的上帝”符合该称号在祝福语中的自然含义和现代汉语表达。译文不进一步限定“平安”的教义内涵。
translation_notes:
  register: 采用现代、庄重而易懂的书信祝福语体。“上帝”用于 θεός；“你们众人”避免把 πάντων 弱化为泛指。“阿们”保留传统通行形式。
