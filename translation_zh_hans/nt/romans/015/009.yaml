- from: '外族人也因他的怜悯而荣耀上帝[a]。正如经上所记：

    “因此，我要在列邦中称颂你，

    歌颂你的名。”'
  to: '并使外邦人因他的怜悯而荣耀上帝[a]。正如经上所记：


    “因此，我要在列邦中称颂你，


    歌颂你的名。”'
  rationale: 修订以“外邦人”取代“外族人”，使ἔθνη在罗马书犹太人与非犹太人对照的语境中更清楚、合乎中文圣经术语习惯。加入“并使”以呈现本节从属于15:8的句法关系。引文中的“列邦”及其脚注保留原引文较广的“万国／列国”语义，避免抹平保罗应用与引文措辞之间的张力。
