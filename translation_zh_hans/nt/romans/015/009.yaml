base_translation:
  language: en
  yaml_path: translation/nt/romans/015/009.yaml
  text: and the Gentiles might glorify God for his mercy[a], as it is written, “Therefore I will praise you among the Gentiles, and sing praise to your name.”
translation:
  language: zh_hans
  text: '并使外邦人因他的怜悯而荣耀上帝[a]。正如经上所记：


    “因此，我要在列邦中称颂你，


    歌颂你的名。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “外邦人”和引文中的“列邦”译自同一个希腊词；这个词既可特指犹太人以外的人，也可泛指“列国”。保罗在这里把引文应用于外邦人，而原引文仍带有“列国”的宽广含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθνη / ἔθνεσι
  choice: 外族人 / 列邦中
  rationale: 在《罗马书》的论述中，ἔθνη通常指与犹太人相对的非犹太人，因此正文前半译作“外族人”；引文中的复数也保留“列邦”的宽广语感。脚注说明两处原文用词相同及其语义范围。
- source_word: ὑπὲρ ἐλέους
  choice: 因他的怜悯
  rationale: ὑπέρ加属格在此表示原因或根据；“因”自然传达这一关系。“他的”根据上下文明确怜悯来自上帝。
- source_word: δοξάσαι
  choice: 荣耀
  rationale: 不定式承接上一节的句法和论证，表达目的或结果；汉语以“也……而荣耀”自然连接前文，同时避免过度限定为单一语法类别。
- source_word: καθὼς γέγραπται
  choice: 正如经上所记
  rationale: 采用现代汉语中清楚、庄重的经文引用格式。
- source_word: ἐξομολογήσομαί
  choice: 我要……称颂你
  rationale: 此处指公开赞美或感谢上帝，并非认罪；“称颂”与下句“歌颂”形成自然平行。
- source_word: ψαλῶ
  choice: 歌颂
  rationale: 在此敬拜语境中表示唱歌赞美；“歌颂”自然简洁，也不把含义限于吟唱某一类诗篇。
- source_word: τῷ ὀνόματί σου
  choice: 歌颂你的名
  rationale: 保留圣经中赞美上帝之名的表达，同时符合现代汉语习惯。
theological_decisions:
- issue: 开头不定式短语与上一节的关系
  choice: 用“外族人也因他的怜悯而荣耀上帝”承接上一节，表达基督事工所带来的目的或结果
  alternative: 较生硬地译作“而外族人，为了怜悯荣耀上帝”或明确补出“使外族人”
  rationale: 希腊文在句法上依附15:8；“也”标明与前文平行，又不在单独展示本节时擅自补出一个主语或把目的、结果之间的张力完全消除。
- issue: ἔθνη在保罗论证及诗篇引文中的范围
  choice: 论述部分译“外族人”，引文译“列邦”，并以脚注交代两处为同一希腊词
  alternative: 两处统一译作“外族人”或“列国”
  rationale: 前者呈现保罗针对非犹太人的应用，后者保留原引文可指万邦列国的宽广含义，避免无声地消除词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“外族人”比传统的“外邦人”更直观，且不带“外国人”的现代国籍含义；诗歌引文分行排布，以显出平行结构。
