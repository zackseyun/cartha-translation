id: ROM.15.14
reference: Romans 15:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Πέπεισμαι δέ, ἀδελφοί μου, καὶ αὐτὸς ἐγὼ περὶ ὑμῶν, ὅτι καὶ αὐτοὶ μεστοί ἐστε ἀγαθωσύνης, πεπληρωμένοι ⸀πάσης γνώσεως, δυνάμενοι καὶ ⸀ἀλλήλους νουθετεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/014.yaml
  text: And I myself am convinced about you[a], my brothers, that you yourselves also are full of goodness, filled with all knowledge[b], and able also to instruct one another.
translation:
  language: zh_hans
  text: 我的弟兄们[a]，我自己也确信，你们自己也满有良善，充满一切知识，并且能够彼此劝诫[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄们”译自希腊语 adelphoi；这个称呼可统指同一信仰群体，包括男性和女性。
    reason: lexical_alternative
  - marker: b
    text: “劝诫”也可译作“劝导”“教导”或“警戒”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πέπεισμαι
  choice: 确信
  rationale: 该完成时形式表达因先前形成的确信而持续至今的状态；“确信”自然地传达保罗坚定、现存的把握。
- source_word: δέ
  choice: 不单独译出，以句式体现承接转换
  rationale: 此处 δέ 表示轻微的语篇转换，并非强烈转折；汉语无需机械加入“但是”，用称呼起句即可自然承接上文。
- source_word: ἀδελφοί μου
  choice: 我的弟兄们[a]
  rationale: 保留希腊语阳性复数称呼的形式；脚注说明该词在此可统称同一信仰群体，其中包括女性。
- source_word: καὶ αὐτὸς ἐγώ
  choice: 我自己也
  rationale: “自己”体现 αὐτός 的强调，“也”保留 καί 的附加意味。
- source_word: περὶ ὑμῶν
  choice: 由“确信，你们……”的汉语宾语从句表达
  rationale: 若直译为“关于你们，我确信”较显生硬；汉语宾语从句自然表达保罗对他们所确信的内容，并未改变所指。
- source_word: καὶ αὐτοί
  choice: 你们自己也
  rationale: 同时保留代词的强调作用与 καί 的附加意味。
- source_word: μεστοί ἐστε ἀγαθωσύνης
  choice: 满有良善
  rationale: “满有”对应 μεστός 的充满之意，“良善”表达 ἀγαθωσύνη 的道德善良与正直含义。
- source_word: πεπληρωμένοι πάσης γνώσεως
  choice: 充满一切知识
  rationale: 保留完成时分词所描写的现有充足状态，并尽量维持 πάσης γνώσεως 的广泛范围，不将其窄化为某一种知识。
- source_word: δυνάμενοι
  choice: 能够
  rationale: 直接表达由前述良善和知识而来的能力。
- source_word: ἀλλήλους
  choice: 彼此
  rationale: 这是现代汉语中自然、简洁的相互代词。
- source_word: νουθετεῖν
  choice: 劝诫[b]
  rationale: 该词指以劝告、提醒或纠正来教导人；“劝诫”兼顾建设性的劝导和纠正性的告诫，比单纯“教导”更完整。
theological_decisions:
- issue: 混合会众中的阳性复数称呼 ἀδελφοί
  choice: 我的弟兄们
  alternative: 我的弟兄姊妹们
  rationale: 正文保留源语称呼的语法形式，同时以脚注交代其在群体称呼中可以包括女性，避免读者误以为只指男性。
- issue: νουθετεῖν 的劝导与纠正意味
  choice: 彼此劝诫
  alternative: 彼此教导；彼此警戒
  rationale: “劝诫”既含有以教导建立人的一面，也保留纠正、提醒的力度，不把该词单方面弱化为一般知识传授或强化为严厉警告。
- issue: πάσης γνώσεως 的广泛表述
  choice: 一切知识
  alternative: 各样知识；充分的知识
  rationale: “一切知识”较贴近源语的广泛表达，并保留其修辞张力；不擅自把范围限定为某几类知识，也不将其解释为神学上的无所不知。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“满有良善”保留经文的赞许语气；“充满一切知识”刻意保留原文较宽广的表达；整体句式兼顾希腊文的强调成分与现代汉语的自然语序。
