revisions:
- from: 所以，论到与上帝有关的事，我在弥赛亚耶稣里有可夸之处[a][b][c]。
  to: 所以，我在弥赛亚耶稣里，就关乎上帝的事有夸口的理由[a][b][c]。
  rationale: 把“有可夸之处”修订为“有夸口的理由”，以更清楚、自然地对应τὴν καύχησιν在本句中的“夸口的根据／理由”含义，同时不把其限制为自我炫耀、单纯喜乐或特定的事奉职分。调整语序使“在弥赛亚耶稣里”和“关乎上帝的事”两个原文限定语在汉语中更清晰。
