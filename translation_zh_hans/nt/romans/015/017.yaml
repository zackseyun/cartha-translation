base_translation:
  language: en
  yaml_path: translation/nt/romans/015/017.yaml
  text: Therefore I have reason for boasting in Messiah Jesus in the things pertaining to God[a][b][c].
translation:
  language: zh_hans
  text: 所以，我在弥赛亚耶稣里，就关乎上帝的事有夸口的理由[a][b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我可以夸口”或“我有夸口的根据”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文作“在弥赛亚耶稣里”；传统译法为“在基督耶稣里”。
    reason: alternative_reading
  - marker: c
    text: 或译：“在关乎上帝的事上”或“就与上帝有关的事务而言”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχω
  choice: 我有
  rationale: 直译现在时第一人称，同时与宾语“可夸之处”构成自然的现代汉语表达。
- source_word: οὖν
  choice: 所以
  rationale: 承接上文并标明推论关系；“所以”自然清楚，又保留原文的逻辑连接。
- source_word: τὴν καύχησιν
  choice: 有可夸之处
  rationale: καύχησις既可指“夸口”，也可指“夸口的根据”。此处用“可夸之处”表达保罗有理由夸口，同时避免把它弱化为一般的喜乐或自信。
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: 在弥赛亚耶稣里
  rationale: 保留ἐν所表达的领域或联合关系，不改译为工具性的“借着”；Χριστός在此作为称号，译为“弥赛亚”。
- source_word: τὰ πρὸς τὸν θεόν
  choice: 论到与上帝有关的事
  rationale: 该短语泛指关乎上帝的事务，可能包含服事层面；此译保留其宽泛性，不将其限定为祭司职务或笼统的宗教活动。
- source_word: θεόν
  choice: 上帝
  rationale: 在现代标准普通话中采用清楚、庄重且通行的对应词。
theological_decisions:
- issue: Χριστός的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处Χριστός与耶稣之名连用，但称号意义仍然鲜明；译出“弥赛亚”可呈现其原有称号含义。
- issue: καύχησις的性质
  choice: 保罗在弥赛亚耶稣里，就关乎上帝的事有可夸之处
  alternative: 保罗只是表达个人自信或主观喜悦
  rationale: 原文以“在弥赛亚耶稣里”和“与上帝有关的事”限定其夸口，既保留“夸”的张力，又不把它理解为独立于弥赛亚的自我抬高。
- issue: τὰ πρὸς τὸν θεόν的范围
  choice: 保留为广义的“与上帝有关的事”
  alternative: 明确译成“事奉上帝的工作”
  rationale: 该表达可带有事奉含义，但原文本身较宽；不在正文中将其收窄，有助于保存真实的语义幅度。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“论到……事”使句首修饰范围清楚；“可夸之处”兼顾καύχησις的词义和汉语自然度。正文保留“在……里”的保罗式联合表达，并用脚注呈现可行的词汇替代译法。
