  text: ⸀τολμηρότερον δὲ ἔγραψα ⸀ὑμῖν ἀπὸ μέρους, ὡς ἐπαναμιμνῄσκων ὑμᾶς, διὰ τὴν χάριν τὴν δοθεῖσάν μοι ⸀ὑπὸ τοῦ θεοῦ
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/015.yaml
  text: But I have written to you rather boldly in part, as reminding you again, because of the grace given to me by God,
translation:
  language: zh_hans
  text: 不过，我在某些方面写得更大胆一些[a]，是为了再次提醒你们；我这样写，是因为上帝赐给我的恩典[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在某些方面写得更大胆一些”也可理解为“多少写得更大胆一些”。原文既可能强调所写的某些内容，也可能强调大胆的程度。
    reason: lexical_alternative
  - marker: b
    text: 这里的“恩典”特别指上帝赐给保罗的事奉职分和使命（参15:16），不只是泛指恩惠。
    reason: cross_reference
lexical_decisions:
- source_word: τολμηρότερον
  choice: 颇为大胆
  rationale: 该比较级副词在这里可带缓和语气，表示保罗所写的某些话相当大胆；“颇为大胆”既自然，也避免生硬地补出一个没有明说的比较对象。
- source_word: δὲ
  choice: 不过
  rationale: 承接上文对读者的肯定，同时引出轻微转折；“不过”符合现代汉语书信语气。
- source_word: ἔγραψα
  choice: 写得
  rationale: 指保罗在本信中已经写下的话；与程度补语“颇为大胆”搭配自然。
- source_word: ἀπὸ μέρους
  choice: 在有些地方
  rationale: 表达所说内容只涉及部分篇幅或某些事项；主文采用符合上下文的范围理解，同时在脚注保留另一种句法可能。
- source_word: ὡς ἐπαναμιμνῄσκων ὑμᾶς
  choice: 是要再提醒你们
  rationale: 分词说明写信的意图或作用；“再提醒”体现复合动词的重复、重新唤起记忆之意。
- source_word: διὰ τὴν χάριν
  choice: 是因……恩典
  rationale: διά加宾格表示原因或依据；保留保罗常用的“恩典”，不在主文中将其缩窄为“职分”或“使命”。
- source_word: τὴν δοθεῖσάν μοι ὑπὸ τοῦ θεοῦ
  choice: 上帝赐给我的
  rationale: 准确表达被动分词及施事者；改为汉语主动结构，清楚自然。
theological_decisions:
- issue: 本节中 χάρις（恩典）的含义
  choice: 主文保留“恩典”，脚注说明这里特别关联上帝赐给保罗的事奉职分和使命
  alternative: 直接译为“职分”“使命”或一般性的“恩惠”
  rationale: 15—16节表明，这恩典具体体现为保罗向外族人事奉的托付与能力；但原词仍是含义较广的“恩典”，主文不宜把它完全等同于某一较窄概念。
translation_notes:
  register: 采用现代、庄重而易懂的书信语体。“我这样做”补明后半句与前文的逻辑关系，避免汉语出现悬垂的原因短语；不增加教派性术语。
