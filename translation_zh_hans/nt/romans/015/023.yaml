id: ROM.15.23
reference: Romans 15:23
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: νυνὶ δὲ μηκέτι τόπον ἔχων ἐν τοῖς κλίμασι τούτοις, ἐπιποθίαν δὲ ἔχων τοῦ ἐλθεῖν πρὸς ὑμᾶς ἀπὸ ⸀ἱκανῶν ἐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/023.yaml
  text: But now[a], no longer having any place in these regions, but having had a longing for many years to come to you,
translation:
  language: zh_hans
  text: 但如今，我在这些地区已经没有余地了[a]，却又多年来一直切望到你们那里去，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在这些地区已经没有地方（或机会）了”。这里的希腊语表达可指当地已没有继续开展工作的余地，不一定只是说没有实际的地点。
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: 但如今
  rationale: 既表达νυνί的当前时间意味，也保留δέ引出的转折和话题推进。
- source_word: μηκέτι τόπον ἔχων
  choice: 已经没有余地了
  rationale: “已经没有”自然表达μηκέτι所指的状态终止；“余地”保留τόπος在此可能指工作空间或机会的比喻义，同时避免把含义限定为具体地点。
- source_word: ἐν τοῖς κλίμασι τούτοις
  choice: 在这些地区
  rationale: κλίματα在此指地理区域；“这些地区”准确、自然，也符合上下文。
- source_word: ἐπιποθίαν δὲ ἔχων
  choice: 却又……一直切望
  rationale: “切望”体现ἐπιποθία的强烈愿望；“却又”承接第二个δέ，并表现前一否定状态与后一积极愿望之间的对照。
- source_word: τοῦ ἐλθεῖν πρὸς ὑμᾶς
  choice: 到你们那里去
  rationale: 直接表达前往收信人所在地之意，不额外加入“探访”等原文未明说的含义。
- source_word: ἀπὸ ἱκανῶν ἐτῶν
  choice: 多年来一直
  rationale: 以现代汉语自然表达从多年前持续至今的时间跨度。
theological_decisions:
- issue: τόπον ἔχων所指的是实际地点还是事工空间
  choice: 正文译作“没有余地”，并以脚注说明
  alternative: “没有地方”或“没有机会”
  rationale: 原表达可指不再有开展工作的空间或机会，并非必然指没有物理地点；正文保留一定开放性，不把上下文推断写成唯一解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留原句尚未完结、继续衔接下一节的逗号结构；“但……却又……”自然呈现两个δέ所形成的推进与对照。
