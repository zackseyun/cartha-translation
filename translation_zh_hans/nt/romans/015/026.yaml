  text: εὐδόκησαν γὰρ Μακεδονία καὶ Ἀχαΐα κοινωνίαν τινὰ ποιήσασθαι εἰς τοὺς πτωχοὺς τῶν ἁγίων τῶν ἐν Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/026.yaml
  text: For Macedonia and Achaia were pleased to make a certain contribution for the poor among the saints in Jerusalem[a].
translation:
  language: zh_hans
  text: 因为马其顿和亚该亚乐意为耶路撒冷圣徒中的穷人捐出一笔款项[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“作出一些分享。”希腊语的表达强调以物质援助体现彼此分享和团契。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐδόκησαν
  choice: 乐意
  rationale: 表达该不定过去时动词所含的积极意愿与欣然态度，避免只译成中性的“决定”。
- source_word: γὰρ
  choice: 因为
  rationale: 承接上文并说明缘由；在现代汉语中，“因为”比生硬的“原来”更直接自然。
- source_word: Μακεδονία καὶ Ἀχαΐα
  choice: 马其顿和亚该亚
  rationale: 照原文保留两个地区名称，并保留以地区代指当地信徒群体的转喻，不擅自增添“教会”或“信徒”。
- source_word: κοινωνίαν τινὰ ποιήσασθαι
  choice: 捐一笔款
  rationale: 在本段为耶路撒冷穷困圣徒募捐的语境中，此表达指实际的物质或金钱分享；“一笔”体现 τινά 的不定性，“捐款”清楚传达实际用途。脚注补充 κοινωνία 所含的分享、相交意味。
- source_word: εἰς τοὺς πτωχοὺς
  choice: 为……穷人
  rationale: εἰς 在这里表示款项所惠及的对象；“为”符合现代汉语表达。
- source_word: τῶν ἁγίων
  choice: 圣徒中的
  rationale: 属格表明这些穷人属于圣徒这一群体；“圣徒中的穷人”准确保留这种关系，也保留保罗书信的关键称谓。
- source_word: τῶν ἐν Ἰερουσαλήμ
  choice: 耶路撒冷
  rationale: 该介词结构限定“圣徒”；汉语将地点前置，译为“耶路撒冷圣徒中的穷人”自然简洁。
theological_decisions:
- issue: 保罗语境中 ἅγιοι 的译法
  choice: 圣徒
  alternative: 圣洁的人；上帝的子民；信徒
  rationale: “圣徒”是保罗对信徒群体的常用称谓，保留其群体身份及“分别为圣”的神学内涵；此处并不限定为后世经正式册封的人。
- issue: κοινωνία 的物质与群体含义
  choice: 正文按语境译作“捐一笔款”，脚注保留“分享”的含义
  alternative: 作一些分享；献上一笔相交之礼
  rationale: 上下文明确涉及实际救济，正文应让普通读者立即明白；同时 κοινωνία 不只是交易性捐赠，还包含共同参与和团契式分享，因此以脚注保存其语义张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“乐意”兼顾意愿和喜悦；保留“马其顿和亚该亚”的转喻及“圣徒”这一保罗惯用称谓。
