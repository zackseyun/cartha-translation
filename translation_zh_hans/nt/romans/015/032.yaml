  text: ἵνα ἐν χαρᾷ ⸀ἐλθὼν πρὸς ὑμᾶς διὰ θελήματος ⸀θεοῦ συναναπαύσωμαι ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/032.yaml
  text: so that by God's will I may come to you with joy and be refreshed together with you[a].
translation:
  language: zh_hans
  text: 使我能照着上帝的旨意，怀着喜乐到你们那里，与你们一同得安歇[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“与你们一同得振奋”或“与你们一同得安息”。希腊语动词指共同得着恢复或安歇。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: 使
  rationale: 承接上文的请求并引出目的，保留目的从句的语气，同时符合现代汉语表达。
- source_word: ἐν χαρᾷ
  choice: 欢欢喜喜地
  rationale: 表达伴随而来的喜乐状态；采用自然的现代汉语副词形式，语气庄重而易懂。
- source_word: ἐλθὼν πρὸς ὑμᾶς
  choice: 到你们那里
  rationale: 将从属于主要动词的过去时分词自然地纳入目的句，表达保罗所盼望的到访。
- source_word: διὰ θελήματος θεοῦ
  choice: 按着上帝的旨意
  rationale: 表达此行取决于并符合上帝的意愿；“按着”在汉语中自然，也避免把διά的语义机械化。
- source_word: θεοῦ
  choice: 上帝的
  rationale: 以现代标准普通话中庄重且通行的称谓指称神。
- source_word: συναναπαύσωμαι
  choice: 和你们一同得到安歇
  rationale: 保留συν-所表达的共同参与，并以“安歇”涵盖休息、舒畅和恢复精神的语义，不把互惠程度解释得过满。
theological_decisions:
- issue: 保罗与罗马信徒相聚所得安歇的共同性
  choice: 和你们一同得到安歇
  alternative: 与你们彼此得到振奋
  rationale: 原文明确包含“一同”的意味，但未必要求把动作严格解释为完全对等的相互振奋；正文保留共同安歇的含义，脚注说明可能的互相得安慰或振奋。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“欢欢喜喜地”比直译“在喜乐中”更自然；“一同得到安歇”保留原文共享休息与恢复的意象及其一定程度的歧义。
