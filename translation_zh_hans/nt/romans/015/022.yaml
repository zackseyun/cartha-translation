  text: Διὸ καὶ ἐνεκοπτόμην τὰ πολλὰ τοῦ ἐλθεῖν πρὸς ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/022.yaml
  text: Therefore I also was often hindered from coming to you[a].
translation:
  language: zh_hans
  text: 所以，我也屡次受到拦阻，不能到你们那里去。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“多次”或“一再”；希腊语短语“τὰ πολλὰ”是表示频繁、反复的习惯用语。
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὸ
  choice: 所以
  rationale: 承接上文并引出由此产生的结果，保留原文的推论关系，也符合现代汉语表达。
- source_word: καὶ
  choice: 也
  rationale: 将保罗个人的处境补充到上文所述之事中，体现其附加语气。
- source_word: ἐνεκοπτόμην
  choice: 受到拦阻
  rationale: 原词为未完成时的被动或中间形式，表示过去反复或持续受阻；此译法不明确指定阻拦者，保留原文的开放性。
- source_word: τὰ πολλὰ
  choice: 屡次
  rationale: 该短语在此作副词使用，表达多次、反复发生；“屡次”简洁自然，并保留重复性的含义。
- source_word: τοῦ ἐλθεῖν
  choice: 不能到……去
  rationale: 带冠词的不定式接在表示拦阻的动词之后，说明受阻之事；汉语以“受到拦阻，不能……”自然表达这一关系。
- source_word: πρὸς ὑμᾶς
  choice: 到你们那里去
  rationale: πρός加宾格表示朝向收信人的移动；此译法清楚传达前往罗马信徒所在之处的意思。
