source:
  edition: SBLGNT
  text: καὶ πάλιν Ἠσαΐας λέγει· Ἔσται ἡ ῥίζα τοῦ Ἰεσσαί, καὶ ὁ ἀνιστάμενος ἄρχειν ἐθνῶν· ἐπ’ αὐτῷ ἔθνη ἐλπιοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/012.yaml
  text: And again Isaiah says, “The root of Jesse will be, and the one who rises to rule the Gentiles; in him the Gentiles will hope.”
translation:
  language: zh_hans
  text: 以赛亚又说：“将有耶西的根，就是那兴起来统治列国的；列国都要仰望他。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ ῥίζα τοῦ Ἰεσσαί
  choice: 耶西的根
  rationale: 保留原文及其所引经文的植物意象；虽然按语境指从耶西而出的后裔，但不将隐喻解释性改写为“后裔”。
- source_word: ὁ ἀνιστάμενος
  choice: 那兴起来……的
  rationale: 对应现在分词的兴起意象，并保留其与前句“耶西的根”的同位关系。
- source_word: ἄρχειν ἐθνῶν
  choice: 统治列国
  rationale: ἄρχειν 表示掌权、统治；ἐθνῶν 在此承接以色列之外的众民族，用“列国”比“外邦人”更自然，也保留群体范围。
- source_word: ἐπ’ αὐτῷ ἔθνη ἐλπιοῦσιν
  choice: 列国都要仰望他
  rationale: ἐλπίζω 表示把盼望寄托于某人；“仰望他”在现代中文中自然表达信赖和盼望，而非仅仅观看。
theological_decisions:
- issue: ἔσται 与两个名词性表达之间的关系
  choice: 译为“将有耶西的根，就是那兴起来统治列国的”
  alternative: “耶西的根将存在，而那兴起来统治列国的……”
  rationale: 原句形式上有并列成分，但二者共同指向同一位人物；用“就是”明确中文句法上的同位关系，而不额外引入身份或教义解释。
- issue: ἐπ’ αὐτῷ 的依靠含义
  choice: “仰望他”
  alternative: “把盼望寄托在他身上”
  rationale: 前者凝练庄重，保留关系性的盼望；未进一步说明这种盼望的救恩机制。
translation_notes:
  register: 采用现代、庄重而易懂的经文语体；保留“耶西的根”这一关键隐喻，以“列国”统一表达 ἔθνη，并避免生硬照搬希腊语并列结构。
