source:
  edition: SBLGNT
  text: οὕτως δὲ ⸀φιλοτιμούμενον εὐαγγελίζεσθαι οὐχ ὅπου ὠνομάσθη Χριστός, ἵνα μὴ ἐπ’ ἀλλότριον θεμέλιον οἰκοδομῶ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/020.yaml
  text: And in this way I make it my ambition to proclaim the good news[a], not where Messiah has already been named[b], so that I might not build on another's foundation.
translation:
  language: zh_hans
  text: 而我这样以此为志：不在弥赛亚的名已经传开的地方传福音[a]，免得在别人的根基上建造。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“不在弥赛亚已经被称名的地方传福音”。这里“被称名”在语境中指弥赛亚已在那里被公开宣告、为人所知。
    reason: 说明ὠνομάσθη的字面被动表达及其在上下文中指向已被宣告的含义。
lexical_decisions:
- source_word: οὕτως δὲ
  choice: 而且，我这样
  rationale: δὲ在此是承接上文的轻度连接词，用“而且”自然延续论述；οὕτως用“这样”保留其指向前文所述事奉方式的作用。
- source_word: φιλοτιμούμενον
  choice: 我……立志
  rationale: 该分词表达热切追求、以某事为志向；“立志”简洁自然，并保留保罗个人事奉抱负的意涵，而不把它扩大为普遍命令。
- source_word: εὐαγγελίζεσθαι
  choice: 传福音
  rationale: 这是现代汉语基督教语境中自然且广为理解的表达，也保留了动词“宣告好消息”的行动含义。
- source_word: οὐχ ὅπου ὠνομάσθη Χριστός
  choice: 只在基督的名还没有传到的地方
  rationale: 原文从反面说“不在基督已经被称名的地方”。汉语改从正面表达，可自然传达保罗前往尚未听闻基督之地的宣教志向；脚注保留原文措辞及其可能包含的公开传扬含义。Χριστός在此用“基督”，符合现代汉语中作为称号和固定称谓的通行表达。
- source_word: ἵνα μὴ
  choice: 免得
  rationale: 准确而简洁地表达否定目的。
- source_word: ἐπ’ ἀλλότριον θεμέλιον οἰκοδομῶ
  choice: 在别人的根基上建造
  rationale: 保留原文的建筑比喻；“别人”不额外指定性别，并自然指向他人先前开展的使徒性工作。
theological_decisions:
- issue: Χριστός的译法
  choice: 基督
  alternative: 弥赛亚
  rationale: “基督”是Χριστός在现代汉语《罗马书》语境中的自然、庄重且广为人知的对应词，本身仍保有受膏者称号的背景；此处不必借译名选择额外断定它更接近专名还是称号。
- issue: 保罗事奉原则的范围
  choice: 译为保罗个人所立的志向
  alternative: 译成所有传道者都必须遵守的普遍禁令
  rationale: φιλοτιμούμενον表达保罗本人的抱负和宣教策略。译文不把这一陈述扩展成对所有事奉者的绝对命令。
- issue: ὠνομάσθη在语境中的含义
  choice: 基督的名还没有传到
  alternative: 基督还没有被称名／提及
  rationale: 这里不只是偶然提及名字，而是指基督尚未在当地被公开宣告和认识。正文采用自然汉语表达语境含义，脚注同时保留原文字面形式，避免抹去其措辞张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“立志”“传福音”“根基上建造”既自然，也保留原文的个人抱负、宣告行动和建筑比喻。正文只设一个脚注，标记[a]已在相应位置出现。
