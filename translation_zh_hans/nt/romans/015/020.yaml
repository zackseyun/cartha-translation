- from: 而且，我这样立志：只在基督的名还没有传到的地方传福音[a]，免得在别人的根基上建造。
  to: 而我这样以此为志：不在弥赛亚的名已经传开的地方传福音[a]，免得在别人的根基上建造。
  rationale: 修订恢复原文“不在……地方”的否定结构，避免“只在”可能带来的额外排他色彩；以“名已经传开”作自然汉语表达，并以脚注保留“被称名”的字面措辞及语境范围。与此同时，按英文POB审计轨迹将Χριστός作为称号译为“弥赛亚”。
