  text: ἵνα ὁμοθυμαδὸν ἐν ἑνὶ στόματι δοξάζητε τὸν θεὸν καὶ πατέρα τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/006.yaml
  text: so that with one accord and with one mouth you may glorify the God and Father of our Lord Jesus the Messiah[a][b].
translation:
  language: zh_hans
  text: 使你们同心合意，异口同声地将荣耀归给我们主耶稣弥赛亚的上帝和父。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“用一张口”，强调众人合一地颂赞；“异口同声”是相应的汉语惯用表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: 使
  rationale: 承接上文，表达目的或结果；“使”在现代汉语中简洁自然，也保留希腊语的目的意味。
- source_word: ὁμοθυμαδόν
  choice: 同心合意
  rationale: 表达众人在心志与意向上的一致，并与后面的言语一致形成呼应。
- source_word: ἐν ἑνὶ στόματι
  choice: 异口同声地
  rationale: 这是现代汉语中表达多人如同一口发声的自然说法，保留合一颂赞的形象；脚注注明希腊语的字面表达。
- source_word: δοξάζητε
  choice: 荣耀
  rationale: 准确表达归荣耀于上帝的含义，符合庄重而通俗的经文语体。
- source_word: τὸν θεὸν καὶ πατέρα
  choice: 上帝和父
  rationale: 保留单一冠词统摄两个名词的紧密结构，不擅自改写为解释性同位语。
- source_word: τοῦ κυρίου ἡμῶν
  choice: 我们主……的
  rationale: 忠实保留所属关系及“我们的主”这一称谓。
- source_word: Ἰησοῦ Χριστοῦ
  choice: 耶稣弥赛亚
  rationale: 将人名Ἰησοῦ音译为“耶稣”，并将称号Χριστός按其意义译为“弥赛亚”，避免仅作传统音译。
theological_decisions:
- issue: Χριστοῦ在Ἰησοῦ Χριστοῦ中的译法
  choice: 耶稣弥赛亚
  alternative: 耶稣基督
  rationale: Χριστός在此仍可理解为称号“受膏者／弥赛亚”；译出称号含义，同时不额外添加原文没有的定冠表达。
- issue: τὸν θεὸν καὶ πατέρα与“我们主耶稣弥赛亚”的关系
  choice: 我们主耶稣弥赛亚的上帝和父
  alternative: 上帝，就是我们主耶稣弥赛亚的父
  rationale: 原文把“上帝”和“父”并列置于同一冠词之下；正文保留这一紧凑且具有神学张力的表达，不将καί解释性改译为“就是”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“同心合意，异口同声”自然呈现心志与言语两方面的合一；保留“上帝和父”的原文结构，并以脚注说明“用一张口”的具体意象。
