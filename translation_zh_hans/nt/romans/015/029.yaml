  text: οἶδα δὲ ὅτι ἐρχόμενος πρὸς ὑμᾶς ἐν πληρώματι ⸀εὐλογίας Χριστοῦ ἐλεύσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/029.yaml
  text: And I know that when I come to you[a], I will come in the fullness of the blessing of Messiah.
translation:
  language: zh_hans
  text: 我知道，我到你们那里去时，必会带着弥赛亚[a]丰盛的福分而来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“基督”。
    reason: Χριστός 既可按称号意义译作“弥赛亚”，也常按传统译作“基督”。
lexical_decisions:
- source_word: οἶδα
  choice: 我知道
  rationale: 保留保罗明确而有把握的陈述，不弱化为“我想”或“我相信”
- source_word: δὲ
  choice: （不另译）
  rationale: 此处是轻微的承接词；现代汉语凭上下文即可自然推进，硬译“而且”或“但是”会加重原文没有的语气
- source_word: ἐρχόμενος πρὸς ὑμᾶς
  choice: 我到你们那里去的时候
  rationale: 将分词按相对于主句未来动词的时间关系表达，符合现代汉语习惯
- source_word: ἐλεύσομαι
  choice: 必……而来
  rationale: 直接表达将来的到来；“必”也传达本句所陈述的确定性
- source_word: ἐν πληρώματι
  choice: 带着……的丰盛
  rationale: 把介词短语理解为伴随情形，同时保留 πλήρωμα 所表达的充盈、完满意象
- source_word: εὐλογίας
  choice: 福分
  rationale: 在此语境中指来自或属于弥赛亚的恩惠与益处；“福分”比单用“祝福”更自然地指所领受的福
- source_word: Χριστοῦ
  choice: 弥赛亚
  rationale: Χριστός 在这里仍是称号；译出“弥赛亚”可保留其“受膏者”的称号性质
theological_decisions:
- issue: Χριστοῦ 的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 正文采用称号的意义译法“弥赛亚”，脚注列出汉语教会传统中常用的“基督”，不把该词处理成姓氏
- issue: “弥赛亚的福分”中属格的关系
  choice: 保留较宽泛的所属表达
  alternative: 弥赛亚所赐的福分
  rationale: 希腊文属格可以表示来源、归属或特征；正文不用“所赐”明确限定为来源，以保留原文的语义张力
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“带着……福分的丰盛而来”略保留原文结构，以免把属格关系过度解释；脚注标记紧随“弥赛亚”。
