  text: Ὀφείλομεν δὲ ἡμεῖς οἱ δυνατοὶ τὰ ἀσθενήματα τῶν ἀδυνάτων βαστάζειν, καὶ μὴ ἑαυτοῖς ἀρέσκειν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/001.yaml
  text: We who are strong ought to bear the weaknesses of the weak[a], and not please ourselves.
translation:
  language: zh_hans
  text: 我们这些刚强的人，应当担当软弱者的软弱，而不应取悦自己[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“软弱者的缺欠。”希腊语这个词可指软弱、局限或缺欠；这里很可能是指上一章所谈到的良心顾忌或限制。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὀφείλομεν
  choice: 应当
  rationale: 表达伦理上的责任与义务，符合直陈式在劝勉语境中的语气，又不额外强化为生硬的绝对命令。
- source_word: δὲ
  choice: 不单独译出
  rationale: 此处是轻微的承接或转折；中文可借上下文自然衔接，若机械译作“但是”容易造成过强对比。
- source_word: ἡμεῖς οἱ δυνατοὶ
  choice: 我们这些坚强的人
  rationale: 保留强调性的“我们”和名词化形容词；“坚强”在上下文中主要指良心或信念上的强健，而非体力强壮。
- source_word: τὰ ἀσθενήματα
  choice: 种种软弱
  rationale: 复数形式表示软弱者的各样局限、顾忌或缺欠；“软弱”保持词义宽度，不径直定性为道德过失。
- source_word: τῶν ἀδυνάτων
  choice: 软弱之人
  rationale: 与“坚强的人”形成上下文中的对应，所指主要是信仰实践和良心自由较受限制的人。
- source_word: βαστάζειν
  choice: 担当
  rationale: 既保留承担、负荷的意象，也比“容忍”更能表达积极扶持和共同承受。
- source_word: καὶ μὴ ἑαυτοῖς ἀρέσκειν
  choice: 不求使自己喜悦
  rationale: 保留“取悦自己”的反身含义，同时用自然而庄重的中文表达不以满足自身偏好为目标。
theological_decisions:
- issue: “坚强的人”与“软弱之人”的所指
  choice: 主要指罗马书14章语境中，在良心自由和信仰实践上程度不同的信徒
  alternative: 社会上有权势与无权势的人，或身体强壮与虚弱的人
  rationale: 紧邻语境讨论食物、日子和良心上的顾忌，因此本节首先要求较有自由的信徒承担良心受限制之人的软弱；译文仍保留“坚强／软弱”的原有张力。
- issue: “种种软弱”是否等同于道德过错
  choice: 保持较宽泛的“软弱”，不直接判定为罪或过错
  alternative: 译作“过失”或“缺点”
  rationale: ἀσθενήματα 可指软弱、局限或缺欠；在此语境中很可能包括良心上的顾忌。直译为“过失”会增加原文未必具有的道德谴责色彩。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“担当”保留负重并扶持他人的伦理意象；“种种软弱”避免把上下文中的良心限制简单定罪。主文中的脚注标记[a]与脚注对应。
