id: ROM.15.31
reference: Romans 15:31
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἵνα ῥυσθῶ ἀπὸ τῶν ἀπειθούντων ἐν τῇ Ἰουδαίᾳ ⸀καὶ ἡ διακονία μου ἡ εἰς Ἰερουσαλὴμ εὐπρόσδεκτος ⸂τοῖς ἁγίοις γένηται⸃,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/031.yaml
  text: so that I may be rescued from those who are disobedient in Judea[a], and that my service for Jerusalem may become acceptable to the saints,
translation:
  language: zh_hans
  text: 使我得以脱离犹太地那些不顺从的人[a]，也使我为耶路撒冷所作的服事能蒙圣徒悦纳。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那些不信的人”。希腊语这个分词可指拒绝相信，并因而不顺从。
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: 使……也使
  rationale: 承接上文请求代祷的目的，并自然表达同一个ἵνα所统摄的两个并列虚拟语气从句。
- source_word: ῥυσθῶ
  choice: 使我能脱离
  rationale: 表达从危险或敌对者手中获救、得解脱的被动含义；中文无需明确补出施事者。
- source_word: ἀπὸ τῶν ἀπειθούντων
  choice: 脱离……那些不顺从的人
  rationale: ἀπειθέω兼有不信、拒绝相信和不顺从的语义；正文采用较宽的“不顺从”，脚注保留“不信”的可能。
- source_word: ἐν τῇ Ἰουδαίᾳ
  choice: 犹太地
  rationale: 采用现代中文中清楚而常见的地名译法。
- source_word: διακονία
  choice: 服事
  rationale: 既保留为信徒群体效力的含义，也能涵盖本处运送捐款这一实际行动，而不将词义限缩为“援助”。
- source_word: ἡ εἰς Ἰερουσαλήμ
  choice: 为耶路撒冷所作的
  rationale: 表达这项服事的对象和方向；“为……所作”比直译“到耶路撒冷的”更符合现代汉语。
- source_word: εὐπρόσδεκτος
  choice: 蒙……悦纳
  rationale: 表达受到对方欣然接纳、认可；与间接受词“圣徒”搭配自然。
- source_word: τοῖς ἁγίοις
  choice: 圣徒
  rationale: 保留保罗对信徒惯常使用的称谓及其“分别为圣之人”的神学分量。
- source_word: γένηται
  choice: 蒙……悦纳
  rationale: 中文的“蒙……悦纳”在此自然涵盖成为可接受、实际受到接纳的结果，无需生硬补出“成为”。
theological_decisions:
- issue: ἀπειθούντων指不顺从还是不信
  choice: 正文译作“那些不顺从的人”
  alternative: “那些不信的人”
  rationale: 该分词可指拒绝相信，也可指由此表现出的不顺从。正文保留较宽语义，脚注说明常见的语境性理解，避免消除原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“服事”“圣徒”“悦纳”保留保罗书信的宗教语域，但句法力求自然清晰。
