  text: οὐ γὰρ τολμήσω ⸂τι λαλεῖν⸃ ὧν οὐ κατειργάσατο Χριστὸς δι’ ἐμοῦ εἰς ὑπακοὴν ἐθνῶν, λόγῳ καὶ ἔργῳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/018.yaml
  text: For I will not dare to speak of anything except what Messiah has accomplished through me for the obedience of the Gentiles[a], by word and deed[b],
translation:
  language: zh_hans
  text: 因为我不敢说任何事，除非是弥赛亚借着我、以言语和行动为使外邦人[a]顺服所成就的事。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“列国”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“因为，除了弥赛亚借着我、以言语和行动为使外邦人顺服所成就的事以外，我什么也不敢说。”
    reason: alternative_reading
lexical_decisions:
- source_word: τολμήσω
  choice: 我……不敢
  rationale: οὐ加将来时τολμήσω表达保罗所持的克制态度；汉语用“不敢”自然传达“胆敢、冒然”的含义，无须机械保留将来时。
- source_word: τι λαλεῖν … ὧν οὐ κατειργάσατο
  choice: 除了……所成就的事……我什么也不敢说
  rationale: 按限制性关系理解这一结构，以“除了……什么也不”清楚表达保罗只述说弥赛亚所成就之事；κατεργάζομαι译为“成就”，体现有效促成、实现。
- source_word: Χριστὸς
  choice: 弥赛亚
  rationale: 此处作为施行工作的那一位，保留称号含义；“弥赛亚”直接呈现“受膏者”的头衔性质。
- source_word: δι’ ἐμοῦ
  choice: 借着我
  rationale: διά接属格表示媒介或代理；“借着我”保留弥赛亚是行动主体、保罗是其器皿这一关系。
- source_word: εἰς ὑπακοὴν ἐθνῶν
  choice: 为要使外族人顺服
  rationale: 用目的或结果性的汉语结构自然表达εἰς；在《罗马书》的犹太人与非犹太人语境中，ἐθνῶν主要指外族人。
- source_word: λόγῳ καὶ ἔργῳ
  choice: 以言语和行动
  rationale: 两个与格很可能表示手段；“言语和行动”兼顾宣讲与实际作为，并保留二者的配对。
theological_decisions:
- issue: Χριστός的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: “弥赛亚”在这里清楚保留称号意味；“基督”虽是汉语圣经传统常用译法，也可能被读作近似专名。
- issue: ἐθνῶν的所指
  choice: 外族人
  alternative: 列国
  rationale: 保罗在《罗马书》中常以该词指与犹太人相对的非犹太群体；“外族人”在现代汉语中较易理解，而“列国”保留其一般词义。
- issue: λόγῳ καὶ ἔργῳ的关联范围
  choice: 修饰弥赛亚借保罗所成就的事
  alternative: 另起一层，概括保罗事工所用的言语和行动
  rationale: 希腊语与格短语可自然表示成就这些事的手段，但其句末位置容许较宽的关联；正文以紧凑语序呈现主要理解，不把行动主体改成保罗。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“外族人”避免“外邦人”可能带来的古旧感，同时保留保罗论述中犹太人与非犹太人的区分。破折号标明“为要使外族人顺服”与“所成就的事”的目的关系，并使长句层次清楚。
