source:
  edition: SBLGNT
  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ καὶ διὰ τῆς ἀγάπης τοῦ πνεύματος συναγωνίσασθαί μοι ἐν ταῖς προσευχαῖς ὑπὲρ ἐμοῦ πρὸς τὸν θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/030.yaml
  text: I urge you[a], brothers, through our Lord Jesus the Messiah and through the love of the Spirit, to strive together with me in prayers to God for me[c][b],
translation:
  language: zh_hans
  text: 弟兄们[b]，我凭着我们的主耶稣弥赛亚[a]，也凭着圣灵的爱[c]，劝你们在为我向上帝所献的祷告中与我一同竭力。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“基督”。希腊语 Christos 是一个称号，意思是“受膏者”或“弥赛亚”。
    reason: alternative_reading
  - marker: b
    text: “弟兄们”在希腊语中是阳性形式，但这里可能是对整个信徒群体的称呼，也就是包括弟兄和姊妹。
    reason: lexical_alternative
  - marker: c
    text: 或理解为“圣灵所具有的爱”或“圣灵所产生的爱”；这里的希腊语属格可以有不止一种理解。
    reason: alternative_reading
lexical_decisions:
- source_word: Παρακαλῶ
  choice: 劝
  rationale: 这里表示恳切而郑重的劝请；“劝”在现代汉语中自然庄重，又不至于强化成命令或哀求。
- source_word: δὲ
  choice: 不单独译出
  rationale: δέ在这里主要标示话题转折或推进，并非强烈转折；汉语可借语序和新的呼语自然体现，若机械译作“现在”会误添时间含义。
- source_word: ἀδελφοί
  choice: 弟兄们
  rationale: 保留希腊语阳性复数呼语的形式；其在本处可能涵盖整个信徒群体，另以脚注说明。
- source_word: διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: 借着我们的主耶稣弥赛亚
  rationale: διά加属格在此表达劝请所凭借的关系或根据；“借着”也与后一个διά保持对应。Χριστός按其称号意义译为“弥赛亚”。
- source_word: ἀγάπης τοῦ πνεύματος
  choice: 圣灵的爱
  rationale: 以简洁的属有结构保留希腊语属格的多义性，既可指圣灵所具有的爱，也可指圣灵所产生的爱。
- source_word: συναγωνίσασθαί μοι
  choice: 与我一同竭力
  rationale: 既体现συν-的共同参与，也传达ἀγωνίζομαι所含的奋力、争战意味，同时符合现代汉语表达。
- source_word: ἐν ταῖς προσευχαῖς
  choice: 在……所献的祷告中
  rationale: 保留介词ἐν所表达的祷告范围或方式；不添加原文没有的“你们的”。“所献”仅使“向上帝祷告”的方向关系在汉语中顺畅。
- source_word: ὑπὲρ ἐμοῦ
  choice: 为我
  rationale: 表示代求对象，即为保罗祷告。
- source_word: πρὸς τὸν θεόν
  choice: 向上帝
  rationale: πρός在祷告语境中表示祷告所指向的对象；“向上帝所献的祷告”清楚自然。
theological_decisions:
- issue: “圣灵的爱”中“灵”的所指
  choice: 圣灵
  alternative: 人的灵，或非人格化的灵
  rationale: 保罗书信中本结构最自然地指向圣灵，因此用“圣灵”；但不进一步断定这爱是圣灵自己的爱还是圣灵所产生的爱。
- issue: Χριστοῦ的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: Χριστός在“主耶稣”之后仍带有称号意义，故译为“弥赛亚”；传统译名“基督”列入脚注。
- issue: ἀδελφοί的范围
  choice: 弟兄们
  alternative: 弟兄姊妹们
  rationale: 正文保留原文阳性复数形式，同时用脚注说明该称呼可能指整个信徒群体，避免把语法形式与实际涵盖范围混为一谈。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“借着……也借着……”保留原文重复的διά结构；全句避免生硬直译，同时保留“圣灵的爱”的真实语义张力。
