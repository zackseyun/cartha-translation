id: ROM.15.16
reference: Romans 15:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἰς τὸ εἶναί με λειτουργὸν ⸂Χριστοῦ Ἰησοῦ⸃ εἰς τὰ ἔθνη, ἱερουργοῦντα τὸ εὐαγγέλιον τοῦ θεοῦ, ἵνα γένηται ἡ προσφορὰ τῶν ἐθνῶν εὐπρόσδεκτος, ἡγιασμένη ἐν πνεύματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/016.yaml
  text: to be a minister of Messiah Jesus to the Gentiles[a], serving as a priest in the gospel of God, so that the offering of the Gentiles may become acceptable[d][c][b], sanctified by the Holy Spirit.
translation:
  language: zh_hans
  text: 使我作基督耶稣的服事者，向外族人，以祭司般的方式服事上帝的福音，好使外族人的供物[c]蒙悦纳，由圣灵分别为圣[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: 这里很可能指外族人本身被献给上帝作供物；也可能指“外族人献上的供物”。
    reason: alternative_reading
  - marker: d
    text: 或译“在圣灵里分别为圣”。
    reason: lexical_alternative
lexical_decisions:
- source_word: λειτουργὸν
  choice: 仆役
  rationale: 该词指承担公共或宗教服事的人。译作“仆役”保留服事含义；随后“祭司般的职事”进一步显明本节的礼仪性比喻，同时避免把保罗的表述直接等同于后世某种正式圣职。
- source_word: Χριστοῦ Ἰησοῦ
  choice: 基督耶稣
  rationale: Χριστός在此保有“受膏者／弥赛亚”的称号含义；“基督耶稣”是现代汉语中自然且通行的称号表达。
- source_word: εἰς τὰ ἔθνη
  choice: 在外族人中
  rationale: 在《罗马书》的犹太人与非犹太人语境中，ἔθνη主要指非犹太人。“外族人”清楚表达这一所指，同时脚注保留较直译的“列国”。
- source_word: ἱερουργοῦντα
  choice: 履行祭司般的职事
  rationale: 该动词明确带有祭司礼仪色彩。此译保留祭司比喻，又不把保罗说成是在献上赎罪祭，或宣称自己拥有后世制度化的祭司职位。
- source_word: τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: 上帝的福音
  rationale: 保留保罗常用的表达，并以现代汉语中熟悉的“福音”传达来自上帝、属于上帝的好消息。
- source_word: προσφορὰ τῶν ἐθνῶν
  choice: 外族人作为供物
  rationale: 上下文的祭司比喻和保罗对外族人的使命较支持把外族人本身视为献给上帝的供物。由于属格也可能表示外族人所献的供物，脚注保留该歧义。
- source_word: εὐπρόσδεκτος
  choice: 蒙悦纳
  rationale: 该词用于供物时表示被接纳、令人满意。“蒙悦纳”自然体现供物被上帝接纳的含义，而不必在正文补出希腊文未明说的宾语。
- source_word: ἡγιασμένη
  choice: 分别为圣
  rationale: 完成时被动分词表示经过成圣行动后所处的状态。“分别为圣”既保留圣洁词汇的神学联系，也比单用音译式术语更易理解。
- source_word: ἐν πνεύματι ἁγίῳ
  choice: 由圣灵
  rationale: 此处将ἐν理解为工具或施事意义，圣灵是使供物成圣的那一位；其处所或范围意义仍可能成立，故在脚注中保留“在圣灵里”。
theological_decisions:
- issue: 保罗以祭司语言描述自己的使命
  choice: 将保罗对外族人的福音服事表达为“祭司般的职事”，保留λειτουργός、ἱερουργέω和προσφορά共同构成的祭司比喻。
  alternative: 把它理解为正式祭司职位，或反过来淡化为一般性的服事。
  rationale: 本节确实使用浓厚的献祭语言，但所描述的是福音使命以及外族人作为蒙上帝悦纳的供物，并非保罗另行献上具有赎罪功效的祭物，也不足以据此引入后世教会职制。
- issue: “外族人的供物”的所指
  choice: 正文采用外族人本身作为供物的理解。
  alternative: 外族人献上的供物。
  rationale: 使命语境和完整的祭司比喻较支持保罗把因福音归向上帝的外族人献上；但希腊文属格本身容许另一种理解，因此用脚注明示，而不声称语法已完全排除它。
- issue: 圣灵与成圣的关系
  choice: 将ἐν理解为工具或施事，译作“由圣灵分别为圣”。
  alternative: 将ἐν理解为范围或领域，译作“在圣灵里分别为圣”。
  rationale: 两种理解在语法和神学上都可成立；正文选取较符合汉语习惯、也较清楚表达成圣来源的译法，脚注保留另一种可能。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“外族人”避免“外邦人”可能带有的疏离或贬义色彩；“祭司般的职事”保留原文献祭意象，又明确其比喻性质。句法维持原文的目的链条：作仆役、履行祭司般职事、使供物蒙悦纳并成圣。
