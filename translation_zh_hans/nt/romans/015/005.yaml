id: ROM.15.5
reference: Romans 15:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς τῆς ὑπομονῆς καὶ τῆς παρακλήσεως δῴη ὑμῖν τὸ αὐτὸ φρονεῖν ἐν ἀλλήλοις κατὰ ⸂Χριστὸν Ἰησοῦν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/005.yaml
  text: May the God of endurance and encouragement grant you to think the same way toward one another[a], in accordance with Messiah Jesus[b],
translation:
  language: zh_hans
  text: 愿那赐忍耐和鼓励的上帝，使你们彼此有同样的心志[a]，按照弥赛亚耶稣[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“彼此同心”或“彼此有同样的想法”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文直译为“按照弥赛亚耶稣”；也可理解为“以弥赛亚耶稣为准则”。“弥赛亚”也常译作“基督”。
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ θεὸς
  choice: 愿那……的上帝
  rationale: δέ在这里是轻微的承接词，不必在中文中硬译为“但”或“而”；δῴη的祈愿语气则由“愿……使”表达。
- source_word: τῆς ὑπομονῆς
  choice: 赐忍耐
  rationale: ὑπομονή指在压力中坚持、忍耐；结合属格结构和上文，中文以“赐忍耐”自然表达上帝是这种忍耐的源头。
- source_word: τῆς παρακλήσεως
  choice: 和鼓励
  rationale: παράκλησις可指鼓励、安慰或劝勉；此处与“忍耐”并列，“鼓励”最能保留其宽广的扶持含义。
- source_word: δῴη
  choice: 愿……使
  rationale: δίδωμι的不定过去时祈愿式用于祷愿；“愿……使”既传达祈愿语气，也符合现代汉语表达。
- source_word: τὸ αὐτὸ φρονεῖν
  choice: 有同样的心志
  rationale: φρονεῖν涉及思想、心态和取向；“心志”比单纯“想法”更贴近其整体心态含义，同时不强行解释为所有意见完全一致。
- source_word: ἐν ἀλλήλοις
  choice: 彼此
  rationale: 该短语表示这种共同心志存在于信徒相互关系中；“彼此”简洁自然地保留相互性。
- source_word: κατὰ Χριστὸν Ἰησοῦν
  choice: 按照弥赛亚耶稣
  rationale: κατά表示以某人或某标准为准则；采用较贴近原文的开放表达，不补入“榜样”或“旨意”，以免消除原有的语义张力。Χριστός按其称号含义译为“弥赛亚”。
theological_decisions:
- issue: Χριστός的译法
  choice: 弥赛亚耶稣
  alternative: 基督耶稣
  rationale: Χριστός在此仍具有称号意义；译为“弥赛亚”把其原有含义直接传达给普通读者，而非把它仅作为姓名的一部分音译或沿用传统形式。
- issue: τὸ αὐτὸ φρονεῖν所要求的一致程度
  choice: 彼此有同样的心志
  alternative: 彼此完全持相同意见；彼此同心
  rationale: 原文强调共同的心态或取向，却未明确要求在每一件事上意见完全一致；译文保留这种范围上的张力。
- issue: κατὰ Χριστὸν Ἰησοῦν的关系
  choice: 按照弥赛亚耶稣
  alternative: 效法弥赛亚耶稣；按照弥赛亚耶稣的旨意
  rationale: 原文没有明说所遵循的是耶稣的榜样、教导还是旨意，因此不在正文中补足，以保留真实的开放性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“愿……使”保留祷愿语气；句末逗号保留本节与下一节在希腊文中的句法延续。所有脚注标记均已置于正文相应位置。
