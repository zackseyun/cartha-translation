id: ROM.15.3
reference: Romans 15:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ γὰρ ὁ Χριστὸς οὐχ ἑαυτῷ ἤρεσεν· ἀλλὰ καθὼς γέγραπται· Οἱ ὀνειδισμοὶ τῶν ὀνειδιζόντων σε ἐπέπεσαν ἐπ’ ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/003.yaml
  text: For even the Messiah did not please himself[a], but as it is written, “The reproaches of those who reproached you fell on me.”
translation:
  language: zh_hans
  text: 因为就连弥赛亚也不求取悦自己[a]；反而正如经上所记：“辱骂你的人的辱骂，都落在了我身上。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弥赛亚”也可译作“基督”。
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ γὰρ
  choice: 因为就连
  rationale: 既承接上文给出理由，又强调弥赛亚也如此行；“因为就连”在现代汉语中保留了推论与强调两层作用。
- source_word: ὁ Χριστός
  choice: 弥赛亚
  rationale: 此处带冠词，并以受膏者的身份作为信徒的榜样，称号意味较明显，故译为“弥赛亚”；“基督”列作脚注中的可选译法。
- source_word: οὐχ ἑαυτῷ ἤρεσεν
  choice: 不求取悦自己
  rationale: 保留“取悦”和反身代词的语义，同时用“求”表达此处并非单指一次使自己高兴，而是不以满足自己为行为取向。
- source_word: ἀλλὰ καθὼς γέγραπται
  choice: 反而正如经上所记
  rationale: ἀλλά构成鲜明转折；“经上所记”是自然庄重的经文引述格式，也能体现γέγραπται的持续权威意味。
- source_word: ὀνειδισμοί
  choice: 辱骂
  rationale: 在本引文中指带来羞辱的斥责、侮辱；“辱骂”通俗而庄重程度适中，并可与同根分词重复对应。
- source_word: τῶν ὀνειδιζόντων σε
  choice: 辱骂你的人
  rationale: 用关系性短语自然表达希腊文分词结构，并借重复“辱骂”保留原文同根词的修辞呼应。
- source_word: ἐπέπεσαν ἐπ’ ἐμέ
  choice: 都落在了我身上
  rationale: 直译“落在我身上”，保留攻击与羞辱转移到说话者身上的形象；“了”自然表达不定过去时所叙述的发生。
theological_decisions:
- issue: Χριστός的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 上下文凸显其受膏者身份及代表性榜样作用，冠词也支持称号理解；但“基督”是传统且语义成立的译法，因此在脚注中保留。
- issue: 诗篇引文中“我”的身份
  choice: 不在正文中明说“我”是谁
  alternative: 将“我”解释性译成“弥赛亚”或“基督”
  rationale: 保罗把诗篇引文应用于弥赛亚，但引文本身只说“我”；直译可保留原文的声音及神学张力，避免把解释加入正文。
- issue: “不取悦自己”的意义范围
  choice: 不求取悦自己
  alternative: 不为自己而活／不求自己的益处
  rationale: 上下文涉及不以自己为中心，但希腊文直接使用“取悦”一词；本译法既适合汉语，又避免把“益处”或更宽泛的生活伦理直接写进经文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“反而正如经上所记”维持经文引用的正式感；引文重复“辱骂”，刻意保留希腊文ὀνειδισμοί／ὀνειδιζόντων的同根呼应。正文脚注标记[a]与脚注完全对应。
