  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εὐδόκησαν γάρ, καὶ ὀφειλέται ⸂εἰσὶν αὐτῶν⸃· εἰ γὰρ τοῖς πνευματικοῖς αὐτῶν ἐκοινώνησαν τὰ ἔθνη, ὀφείλουσιν καὶ ἐν τοῖς σαρκικοῖς λειτουργῆσαι αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/027.yaml
  text: For they were pleased to do it[a], and they are indebted to them. For if the Gentiles have shared in their spiritual things[c][b], they also owe it to minister to them in material things.
translation:
  language: zh_hans
  text: 因为他们乐意这样做，也确实欠他们的债；因为外邦人[a]既然分享了他们属灵的事物[b]，就也应当在物质方面服事他们[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“列国的人”。这里指相对于犹太人的非犹太人；传统译法为“外邦人”。
    reason: lexical_alternative
  - marker: b
    text: 或译“他们属灵的福分”。希腊原文直译为“他们属灵的事物”。
    reason: lexical_alternative
  - marker: c
    text: 希腊原文直译为“在属肉体的事物上”；这里指物质或身体生活方面的供应，与“属灵的事物”相对。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐδόκησαν
  choice: 乐意这样做
  rationale: 表达主动的欣然赞同，并根据上文补出“这样做”，指为耶路撒冷圣徒捐助。
- source_word: ὀφειλέται εἰσὶν αὐτῶν
  choice: 他们也是欠他们的
  rationale: 保留“欠债者”的义务含义，同时采用现代汉语较自然的表达；前后两个“他们”的具体所指由上下文确定。
- source_word: τὰ ἔθνη
  choice: 外族人
  rationale: 这里指相对于犹太人的非犹太各族；“外族人”在现代汉语中较易理解，也保留ἔθνη的族群含义。
- source_word: τοῖς πνευματικοῖς αὐτῶν
  choice: 他们属灵的事物
  rationale: πνευματικοῖς是名词化形容词，直指“属灵的事物”；不擅自补成“福分”，以保留原文的宽泛性。
- source_word: ἐκοινώνησαν
  choice: 分享了
  rationale: 表达参与并得享某事的含义，符合与格结构。
- source_word: ἐν τοῖς σαρκικοῖς
  choice: 在物质的事物上
  rationale: 在捐款语境中，σαρκικός与“属灵的”相对，指物质或身体生活方面，并非“属肉体、罪恶”的伦理意义。
- source_word: λειτουργῆσαι
  choice: 服事
  rationale: 保留λειτουργέω所含的郑重服务意味，又不把这种服事局限于教职人员。
theological_decisions:
- issue: σαρκικοῖς与πνευματικοῖς的对比
  choice: 物质的事物
  alternative: 属肉体的事物
  rationale: 上下文是给耶路撒冷贫困圣徒的捐助，因此这里所指是物质及身体生活方面的供应，而不是罪性。
- issue: αὐτῶν／αὐτοῖς的所指
  choice: 直接指向耶路撒冷的圣徒，尤其是犹太信徒
  alternative: 泛指以色列或犹太人整体
  rationale: 15:25–26的最近语境是耶路撒冷圣徒及给他们的捐款；同时本节的论证也带有外族人从犹太人所得属灵益处的救恩历史背景。
- issue: 外族人所负义务的性质
  choice: 因分享属灵之事而负有物质服事的义务
  alternative: 仅是自愿慈善，不构成义务
  rationale: ὀφειλέται和ὀφείλουσιν都明确表达欠债与应尽的义务，但εὐδόκησαν同时表明他们是乐意而行。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“外族人”避免“外邦人”对普通读者可能产生的古旧感；“属灵的事物／物质的事物”刻意保持原文对称。分号保存原句先断言、后说明理由的论证结构。
