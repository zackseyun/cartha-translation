  text: And again he says[a], “Rejoice, Gentiles, with his people.”
translation:
  language: zh_hans
  text: 又说：“外邦人啊，当与他的子民一同欢喜！”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “外邦人”或译“列国”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: 又
  rationale: 在连续引述经文的公式中表示“再次、又”，简洁自然地引出另一处引文。
- source_word: λέγει
  choice: 说
  rationale: 保留希腊文现在时的经文引用惯用语；中文无需明说主语，也可保留“他/经上”这一含混性。
- source_word: Εὐφράνθητε
  choice: 要……欢喜
  rationale: 准确表达命令语气；“欢喜”庄重而易懂，也符合此处呼召共同赞美的语境。
- source_word: ἔθνη
  choice: 列国
  rationale: ἔθνη既可指各国，也可在保罗的论述中指外族人；“列国”贴近申命记引文的措辞并保留群体与国家层面的语义，另一种语境化译法见脚注。
- source_word: μετὰ τοῦ λαοῦ αὐτοῦ
  choice: 和他的子民一同
  rationale: μετά加属格表达共同参与；“一同”自然体现关联。“子民”保留λαός在这里所带的立约群体意味，却不把所指直接扩写为以色列。
theological_decisions:
- issue: 罗马书15章犹太人与外族人共同颂赞的语境中如何翻译ἔθνη
  choice: 列国
  alternative: 外族人
  rationale: “列国”较直接保留希腊文及其旧约引文的宽广意义，不把“国家/民族”层面的含义收窄；同时，“外族人”更明确呈现保罗上下文中与神子民并列的非犹太群体，因此列入脚注。
- issue: λέγει的隐含主语
  choice: 中文省略主语，译作“又说”
  alternative: “他又说”或“经上又说”
  rationale: 希腊文动词形式本身允许按引文公式理解为“他说”或“经上说”。省略主语符合自然中文，也避免替原文消除这一含混性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“列国啊”保留引文的呼语形式；“要……欢喜”清楚传达命令语气。脚注标记置于整句引文之后。
