  text: ἀλλὰ καθὼς γέγραπται· ⸂Οἷς οὐκ ἀνηγγέλη περὶ αὐτοῦ ὄψονται⸃, καὶ οἳ οὐκ ἀκηκόασιν συνήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/021.yaml
  text: 'but as it is written: Those who were not told about him will see[b][a], and those who have not heard will understand.'
translation:
  language: zh_hans
  text: '而是正如经上所记：


    “那些未曾有人向他们传讲关于他的事[a]的人，

    将要看见[b]；


    那些未曾听见的人，

    将要明白。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 保罗在这里引用以赛亚书52:15。在以赛亚书的语境中，“他”指那位仆人；保罗在这里把这句话用于自己传扬福音的事工。
    reason: cross_reference
  - marker: b
    text: 或译：“那些未曾听到关于他的宣告的人，将要看见。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: 而是
  rationale: 承接上文，表示保罗的事工目标不是建立在别人根基上，而是符合经上所记；“而是”比单纯的“但是”更能体现此处的转折关系。
- source_word: καθὼς γέγραπται
  choice: 正如经上所记
  rationale: 这是引述经文的惯用公式；既自然表达完成时被动态，也明确这里所写的是圣经。
- source_word: Οἷς οὐκ ἀνηγγέλη περὶ αὐτοῦ
  choice: 那些从未听人传讲他的人
  rationale: 将希腊文“关于他未曾向其宣告的人”调整为自然的现代汉语，同时保留传讲的对象“他”，不把所指直接扩写为“基督”。
- source_word: ὄψονται
  choice: 将要看见
  rationale: 按其基本意义译为“看见”，保留它与下句“明白”之间由视觉到认知的诗性并列，不提前解释成“认识”或“领会”。
- source_word: οἳ οὐκ ἀκηκόασιν
  choice: 那些从未听见的人
  rationale: ἀκούω的完成时表达截至当时仍未听见的状态；“从未听见”在汉语中简洁自然。
- source_word: συνήσουσιν
  choice: 将要明白
  rationale: 准确表达“理解、领会”的意思，并保留预言中的将来语气。
theological_decisions:
- issue: 以赛亚引文中“他”的所指
  choice: 正文保留代词“他”
  alternative: 译作“弥赛亚”或“基督”
  rationale: 希腊原文只使用代词αὐτοῦ。以赛亚书语境指向仆人形象，保罗将这段话用于自己的福音使命；正文保留代词，既忠于原文，也不替读者消除经文互文关系中的张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留引文的平行结构和“看见／明白”的诗性对应；用“传讲”体现宣告信息的动作，但不在正文中补出“福音”“基督”等解释性词语。
