  text: τοῦτο οὖν ἐπιτελέσας, καὶ σφραγισάμενος αὐτοῖς τὸν καρπὸν τοῦτον, ἀπελεύσομαι δι’ ὑμῶν ⸀εἰς Σπανίαν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/028.yaml
  text: Therefore[a], when I have completed this and have sealed this fruit to them[c][b], I will go on by way of you to Spain.
translation:
  language: zh_hans
  text: 所以，我办完这件事，把这果子妥善交给他们以后，就要途经你们那里前往西班牙。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这果子”指外邦信徒为耶路撒冷圣徒募集的捐款。“妥善交给”所译的原文意思是“把这果子给他们盖印确认”；这可能指正式确认这份捐款归受助者所有，并确保交付给他们。“途经你们那里”也可译作“经过你们”。
    reason: 说明“果子”所指，保留σφραγίζω的盖印意象及其未定的语境含义，并交代δι’ ὑμῶν的另一种译法。
lexical_decisions:
- source_word: τοῦτο οὖν ἐπιτελέσας
  choice: 所以，我办完这件事……以后
  rationale: οὖν承接上文并作出行程上的结论；τοῦτο回指办理并送交捐款一事；不定过去时分词表示先于主句将来动作完成。
- source_word: σφραγισάμενος αὐτοῖς
  choice: 妥善交给他们
  rationale: σφραγίζω本义为“盖印、封缄”，这里与捐款送达受助者的语境结合，可能表示正式确认并确保交付。直译“给他们盖印”在现代汉语中无法自然传达其语境意义，因此正文采用功能对等表达，脚注保留原文意象。
- source_word: τὸν καρπὸν τοῦτον
  choice: 这果子
  rationale: 保留保罗用“果子”指外邦信徒慷慨奉献所结成果的比喻；脚注说明具体所指，避免正文直接消解该意象。
- source_word: δι’ ὑμῶν
  choice: 途经你们那里
  rationale: διά加属格可指从中经过；这里的“你们”是罗马的信徒，现代汉语需补出“那里”才能自然表达经由他们所在地前往西班牙。该表达不额外断定他们必定提供援助。
- source_word: εἰς Σπανίαν
  choice: 前往西班牙
  rationale: 按目的地方向自然译为“前往西班牙”。
theological_decisions:
- issue: “盖印”意象在耶路撒冷捐款语境中的含义
  choice: 正文译作“妥善交给他们”，并在脚注交代字面意象及可能含义
  alternative: 直译为“把这果子给他们盖了印”
  rationale: 原词的具体语用含义存在张力，可能侧重正式确认、确保归属或安全交付。现代汉语直译容易被误解为在物品上实际盖章；功能性正文配合脚注，既清楚传意，又不把单一解释伪装成确定含义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“办完这件事”清楚承接上文；“妥善交给”避免生硬且易误解的直译，同时由脚注保存原文“盖印”的意象与歧义。
