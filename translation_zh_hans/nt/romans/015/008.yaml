  text: λέγω ⸀γὰρ ⸀Χριστὸν διάκονον ⸀γεγενῆσθαι περιτομῆς ὑπὲρ ἀληθείας θεοῦ, εἰς τὸ βεβαιῶσαι τὰς ἐπαγγελίας τῶν πατέρων,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/008.yaml
  text: For I say that the Messiah has become a servant to the circumcised for the sake of God's truth[a], in order to confirm the promises to the fathers,
translation:
  language: zh_hans
  text: 因为我说，弥赛亚已经成为受割礼之人的仆人，为了上帝的真实[a]，好证实赐给列祖的应许；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“上帝的信实”，强调上帝忠于自己所立的约，成就他的应许。
    reason: 保留ἀλήθεια θεοῦ可指上帝真实可信、信守盟约的词义选择。
lexical_decisions:
- source_word: λέγω γὰρ
  choice: 因为我说
  rationale: γάρ承接并解释上文，译作“因为”；λέγω保留保罗论述中的“我说”句式。
- source_word: Χριστόν
  choice: 弥赛亚
  rationale: 此处在以色列、割礼和列祖应许的救恩历史语境中具有称号意味，译作“弥赛亚”比音译“基督”更直接显明其含义。
- source_word: διάκονον γεγενῆσθαι
  choice: 已经成为……的仆人
  rationale: διάκονος在此指承担服事职责者，不指教会职分；γεγενῆσθαι为完成时不定式，表达成为之后持续成立的状态，故译“已经成为”。
- source_word: περιτομῆς
  choice: 受割礼之人
  rationale: 属格在此以“割礼”代指受割礼的群体，即犹太人；保留源文意象而不直接解释为“犹太人”。
- source_word: ὑπὲρ ἀληθείας θεοῦ
  choice: 为要彰显上帝的真实
  rationale: ὑπέρ表示为了、为着；结合下文坚固应许，此句指向上帝之真实得到彰显。“真实”保留ἀλήθεια既可指真理，也可指真实可信的张力。
- source_word: εἰς τὸ βεβαιῶσαι
  choice: 以坚固
  rationale: 该结构表达目的；βεβαιόω意为使之坚定、确立。译作“坚固”既贴近词义，也适合应许的语境。
- source_word: τὰς ἐπαγγελίας τῶν πατέρων
  choice: 赐给列祖的应许
  rationale: 该属格按语境理解为向列祖所作的应许；“列祖”保留以色列救恩历史中特定的先祖含义。
theological_decisions:
- issue: Χριστός的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 这里该词作为称号，与受割礼者及列祖的应许紧密相连；采用意译可清楚呈现其受膏者称号。
- issue: ἀλήθεια θεοῦ的含义
  choice: 上帝的真实
  alternative: 上帝的信实
  rationale: 下文关于坚固应许使“信实、可信”这一含义十分突出，但源词也可泛指真实或真理；正文保留较宽的“真实”，脚注说明“信实”的语境含义，避免把歧义完全消解。
- issue: τῶν πατέρων的属格关系
  choice: 赐给列祖的应许
  alternative: 列祖的应许
  rationale: 语境所指是上帝向列祖所作的应许；中文若直译“列祖的应许”容易误解为列祖发出的应许，因此明确其受领关系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“受割礼之人”和“列祖”保留经文的犹太救恩历史语境；句末用分号，以便与下一节延续的句法和论证相接。
