  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὅσα γὰρ προεγράφη, ⸀εἰς τὴν ἡμετέραν διδασκαλίαν ⸀ἐγράφη, ἵνα διὰ τῆς ὑπομονῆς καὶ διὰ τῆς παρακλήσεως τῶν γραφῶν τὴν ἐλπίδα ἔχωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/004.yaml
  text: For whatever was written beforehand was written for our instruction[b][a], so that through the endurance and through the encouragement of the Scriptures we might have hope.
translation:
  language: zh_hans
  text: 因为从前所写的一切，都是为了教导我们而写的，好使我们借着忍耐，也借着圣经带来的鼓励[a]，可以怀有盼望[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “鼓励”或译“安慰”；παράκλησις也可含“劝勉”之意。
    reason: lexical_alternative
  - marker: b
    text: 或译：“使我们有盼望。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσα
  choice: 所写的一切
  rationale: 中性复数关系代词具有概括性；“一切”自然表达凡从前写下来的经文。
- source_word: προεγράφη
  choice: 从前所写
  rationale: 保留 προ- 的时间含义，指先前写成，而不是公开张贴。
- source_word: εἰς τὴν ἡμετέραν διδασκαλίαν
  choice: 为教导我们
  rationale: εἰς 加宾格在此表示目的；“教导”既自然，也保留经文塑造、训诲读者的作用。
- source_word: ἐγράφη
  choice: 而写的
  rationale: 保留原文第二次使用“写”，重现其修辞上的重复。
- source_word: ἵνα
  choice: 好使
  rationale: 清楚表达目的或预期结果。
- source_word: διὰ τῆς ὑπομονῆς
  choice: 借着忍耐
  rationale: ὑπομονή 指在艰难中持久忍耐；“忍耐”简明且符合本段语境。
- source_word: διὰ τῆς παρακλήσεως τῶν γραφῶν
  choice: 借着圣经所赐的鼓励
  rationale: παράκλησις 可指鼓励、安慰或劝勉；在维系盼望的语境中，“鼓励”涵盖较广。“所赐的”自然表达属格关系，但不进一步界定圣经如何施行这种作用。
- source_word: τῶν γραφῶν
  choice: 圣经
  rationale: γραφή 的复数在保罗书信中通常指神圣经卷；现代汉语以“圣经”表达这一集合性所指。
- source_word: τὴν ἐλπίδα
  choice: 盼望
  rationale: 汉语抽象名词不需对应希腊语冠词；“盼望”保留其正面期待的含义。
- source_word: ἔχωμεν
  choice: 可以怀有
  rationale: 现在时虚拟语气受 ἵνα 支配，表达目的；“可以怀有”既自然，也不把目的结构误写成无条件的结果。
theological_decisions:
- issue: “圣经”与“忍耐、鼓励”的关系
  choice: 将“圣经”直接连接于“鼓励”，译作“圣经所赐的鼓励”，同时让整句表明忍耐和这种鼓励共同通向盼望。
  alternative: 可把忍耐和鼓励都理解为圣经所产生或所见证的，也可较窄地理解为读经所得的忍耐与鼓励。
  rationale: 原文的属格 τῶν γραφῶν 在词序上直接修饰“鼓励”，但整句没有详述这两者由圣经发挥作用的具体方式；译文保留这一关系，不作教义化扩展。
- issue: 目的从句中的盼望
  choice: 译为“好使……可以怀有盼望”。
  alternative: 也可译为“使我们有盼望”，语气更直接。
  rationale: 保留 ἵνα 加虚拟语气的目的意味，同时避免暗示盼望是否实现取决于不确定因素。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“写”在原文中的重复，以呈现保罗的强调；用两个“借着”对应原文重复的 διά，并保持“忍耐”与“圣经所赐的鼓励”的并列结构。
