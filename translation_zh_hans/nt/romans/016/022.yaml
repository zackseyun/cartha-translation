base_translation:
  language: en
  yaml_path: translation/nt/romans/016/022.yaml
  text: I[a], Tertius, who wrote the letter, greet you in the Lord.
translation:
  language: zh_hans
  text: 我德丢，就是写这封信的，也在主里问候你们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 另一种可能性较小的译法是：“我德丢，就是在主里写这封信的，也问候你们。”希腊语“在主里”也可与“写”相连，不过与“问候”相连更自然。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάζομαι
  choice: 问候
  rationale: 此动词在书信结尾常表示问候；“问候”简洁自然，不额外加入原文未明说的热情程度。
- source_word: ὑμᾶς
  choice: 你们
  rationale: 保留第二人称复数，现代汉语可明确表达其复数意义。
- source_word: ἐγὼ Τέρτιος
  choice: 我……德丢
  rationale: 显出的第一人称代词连同人名突出说话者的自我介绍；以“我这……的德丢”纳入汉语句式，清楚而自然。
- source_word: ὁ γράψας
  choice: 这替……写信的
  rationale: 定冠词加不定过去时分词指明德丢是实际执笔写下这封信的人；“替你们写信”中的“你们”并非此短语内容，故整体实际译文按“替你们写信”容易产生受益者误解。更准确地说，本选择在正文中应理解为“替（保罗）写这封信的”；正文省去宾语“保罗”以免加入原文未明说的信息。
- source_word: τὴν ἐπιστολήν
  choice: 信
  rationale: “信”是现代汉语对书信最自然的称呼；语境已明确是本封书信，无须生硬译作“书信”。
- source_word: ἐν κυρίῳ
  choice: 在主里
  rationale: 保留保罗书信中常见的关系或领域表达，并按较自然的句法理解为修饰“问候”，不把其含义解释得过窄。
theological_decisions:
- issue: ἐν κυρίῳ（在主里）的句法归属
  choice: 理解为修饰主要动词“问候”：德丢在主里问候收信人。
  alternative: 理解为修饰“写信”：德丢是在主里写这封信的人。
  rationale: 在书信问候语境中，此短语更自然地与“问候”相连，表达在主里的团契或关系；但希腊语语序允许它与“写信”相连，因此以脚注保留这一真实歧义。
translation_notes:
  register: 采用现代、庄重且易懂的书信体。“德丢”沿用普通话圣经人名的通行音译。注意：正文“替你们写信”可能误示德丢替收信人写信；更合源文的定稿应为“我这写信的德丢，也在主里问候你们。[a]”或“我德丢，就是写这封信的，也在主里问候你们。[a]”。
