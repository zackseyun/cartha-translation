id: ROM.16.20
reference: Romans 16:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς τῆς εἰρήνης συντρίψει τὸν Σατανᾶν ὑπὸ τοὺς πόδας ὑμῶν ἐν τάχει. ἡ χάρις τοῦ κυρίου ἡμῶν Ἰησοῦ ⸀Χριστοῦ μεθ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/020.yaml
  text: And the God of peace will soon crush Satan under your feet[a]. The grace of our Lord Jesus Christ be with you.
translation:
  language: zh_hans
  text: 赐平安的上帝很快就要把撒但压碎在你们脚下。愿我们的主耶稣弥赛亚[a]的恩典与你们同在。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 传统译作“耶稣基督”。
    reason: 保留 Χριστός 的传统汉语译名，便于熟悉传统措辞的读者辨认。
lexical_decisions:
- source_word: ὁ δὲ θεὸς τῆς εἰρήνης
  choice: 赐平安的上帝
  rationale: 属格短语既可直译为“平安的上帝”，也可表达上帝是平安的赐予者。现代汉语中“赐平安的上帝”自然清楚，同时保留保罗式称号的核心意义。
- source_word: συντρίψει
  choice: 要把……压碎
  rationale: 将来时表达确定的未来行动；“压碎”与“在脚下”的得胜、制伏意象自然搭配，并保留原词强烈程度。
- source_word: τὸν Σατανᾶν
  choice: 撒但
  rationale: 按新约通行专名音译处理，不在正文中改译为“敌对者”，以免把解释性词义取代专名。
- source_word: ὑπὸ τοὺς πόδας ὑμῶν
  choice: 在你们脚下
  rationale: 保留征服、制伏的惯用意象；“你们”明确反映复数，指向罗马的信徒群体。
- source_word: ἐν τάχει
  choice: 很快
  rationale: 在本句中主要表达时间临近；“很快”也容许行动迅速的语感，不把原文限制得过窄。
- source_word: ἡ χάρις
  choice: 恩典
  rationale: 保留保罗书信祝福语中的核心神学用词，不释义为一般性的“恩惠”。
- source_word: τοῦ κυρίου ἡμῶν
  choice: 我们的主……的
  rationale: 按所属关系处理属格，并保留“主”这一称号。
- source_word: Ἰησοῦ Χριστοῦ
  choice: 耶稣弥赛亚
  rationale: Χριστός源于“受膏者”的称号意义；“弥赛亚”直接传达这一称号，传统译名“基督”列入脚注，方便读者辨认。
- source_word: μεθ’ ὑμῶν
  choice: 与你们同在
  rationale: 原文祝福语省略系词，汉语补出“愿……同在”，形成自然、庄重的祝愿句。
theological_decisions:
- issue: 末尾祝福语中 Χριστοῦ 的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处与“耶稣”连用，但仍可听出称号意味。正文用“弥赛亚”呈现“受膏者”的语义，不把它完全视为无词义的姓名组成部分；脚注保留华语基督教传统译名“基督”。
- issue: “上帝在你们脚下压碎撒但”中的施事与参与者
  choice: 保留上帝为施事、信徒的脚为得胜发生之处
  alternative: 改写为“使你们战胜撒但”
  rationale: 原文有意并置上帝的决定性行动与信徒群体参与得胜的图景；不以解释性改写消除这层张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“压碎”保留原文强烈的得胜意象；“与你们同在”沿用自然的书信祝福语体。脚注标记紧随相关称号。
