reference: Romans 16:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οἱ γὰρ τοιοῦτοι τῷ κυρίῳ ⸀ἡμῶν Χριστῷ οὐ δουλεύουσιν ἀλλὰ τῇ ἑαυτῶν κοιλίᾳ, καὶ διὰ τῆς χρηστολογίας καὶ εὐλογίας ἐξαπατῶσι τὰς καρδίας τῶν ἀκάκων.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/018.yaml
  text: For such people do not serve our Lord Messiah[a], but their own belly[c][b], and by smooth talk and flattery they deceive the hearts of the unsuspecting.
translation:
  language: zh_hans
  text: 因为这样的人不服事我们的主弥赛亚[a]，反倒服事自己的肚腹[b]；他们用甜言蜜语和阿谀奉承，欺骗没有戒心之人[c]的心。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我们的主基督”。
    reason: 保留 Χριστός 的传统汉语译法。
  - marker: b
    text: 直译“自己的肚腹”，是受自身欲望支配、追求自我满足的鲜明说法。
    reason: 说明原文隐喻而不在正文中将其抽象化。
  - marker: c
    text: “没有戒心之人”也可译作“纯朴的人”或“无恶意的人”。
    reason: ἀκάκων 可强调不设防、纯朴或无恶意，原词具有语义幅度。
lexical_decisions:
- source_word: τοιοῦτοι
  choice: 这样的人
  rationale: 承接上一节所说制造分裂、设置绊脚石的人，保留指示意味，同时符合现代汉语表达。
- source_word: κυρίῳ ἡμῶν Χριστῷ
  choice: 我们的主弥赛亚
  rationale: 按原文保留“我们的”和“主”，不增补原文没有的“耶稣”；将 Χριστός 作为称号译为“弥赛亚”。
- source_word: δουλεύουσιν
  choice: 服事
  rationale: 该词含有作奴仆、受支配而效力的意味；“服事”在此能自然呈现效忠对象的对比。
- source_word: κοιλίᾳ
  choice: 肚腹
  rationale: 保留保罗具体而鲜明的身体隐喻，不直接抽象化为“欲望”或“口腹之欲”。
- source_word: χρηστολογίας
  choice: 动听的话
  rationale: 指悦耳、讨好、貌似良善的言辞；“动听的话”自然表达其诱人而具有欺骗性的特点。
- source_word: εὐλογίας
  choice: 奉承
  rationale: 本语境不是指真正的祝福，而是与动听言辞并列、用于诱骗的恭维话。
- source_word: ἐξαπατῶσι
  choice: 欺骗
  rationale: 准确表达使人受骗的动作；汉语无需另加副词也足以传达该复合动词在语境中的力度。
- source_word: καρδίας
  choice: 心
  rationale: 保留圣经语言中“心”作为人的内在思想、意愿与感受中心的整体含义。
- source_word: ἀκάκων
  choice: 没有戒心之人
  rationale: 在受骗的警告语境中突出其不设防、容易受蒙蔽的一面，同时以脚注保留“纯朴、无恶意”的词义空间。
theological_decisions:
- issue: 保罗称号短语中 Χριστός 的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 这里的 Χριστός 是受膏者的称号；正文采用能显出称号意义的“弥赛亚”，并在脚注保留汉语教会传统译法“基督”，不把两者之间的翻译传统差异静默抹平。
- issue: “服事自己的肚腹”的隐喻范围
  choice: 保留“肚腹”的具体形象
  alternative: 译为“满足自己的欲望”
  rationale: 原文以“主”和“肚腹”形成效忠对象的强烈对比。直接解释成某一种欲望可能缩窄其范围，因此正文保留隐喻，脚注说明其通常指向自我放纵的欲求。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“并不……而是……”清楚呈现原文对比；分号使后半句的欺骗手段及结果与前半句的效忠对象区分开来。“动听的话和奉承”避免生硬直译，同时保持两项言语手段的并列。
