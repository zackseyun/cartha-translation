  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, σκοπεῖν τοὺς τὰς διχοστασίας καὶ τὰ σκάνδαλα παρὰ τὴν διδαχὴν ἣν ὑμεῖς ἐμάθετε ποιοῦντας, καὶ ⸀ἐκκλίνετε ἀπ’ αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/017.yaml
  text: I urge you[a], brothers, to watch out for those who cause divisions and stumbling blocks contrary to the teaching that you learned, and turn away from them.
translation:
  language: zh_hans
  text: 弟兄们[a]，我劝你们，要留意那些制造违背你们所学教导的纷争和绊脚之事的人，并且要避开他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作“弟兄们”；这里很可能是对包括姊妹在内的全体会众说的。
    reason: 说明阳性复数称呼在本语境中的代表性用法。
lexical_decisions:
- source_word: Παρακαλῶ
  choice: 我劝你们
  rationale: 表达强烈而带有牧养关切的劝告；现代汉语自然庄重，又不至于像“我命令”那样过强。
- source_word: ἀδελφοί
  choice: 弟兄们
  rationale: 保留希腊文阳性复数称呼的形式；在保罗书信中通常可包括全体会众，另以脚注说明。
- source_word: σκοπεῖν
  choice: 要留意
  rationale: 表示仔细观察并保持警惕。“留意”自然清楚，警戒意味也由本句所指的人和下文“避开”共同体现。
- source_word: διχοστασίας
  choice: 纷争
  rationale: 指造成群体分裂的争端；“纷争”比“分裂”更自然地与“制造”搭配，同时保留破坏群体合一的含义。
- source_word: σκάνδαλα
  choice: 绊脚之事
  rationale: 保留绊倒人的隐喻，并表明这里所指的是使人跌倒或偏离的事物，不仅是令人不快的“冒犯”。
- source_word: παρὰ τὴν διδαχήν
  choice: 违背……教导
  rationale: παρά加宾格在此表示偏离或违反既有教导的准则；“违背”简洁准确。
- source_word: διδαχήν
  choice: 教导
  rationale: 既可表达权威性的使徒教训，又比“教义”更贴近日常现代汉语。
- source_word: ἐμάθετε
  choice: 你们所学
  rationale: 直接反映主动语态和过去已经学习的事实，语句简洁自然。
- source_word: ποιοῦντας
  choice: 制造
  rationale: 该分词修饰所警戒的人，在语境中表示造成或引起纷争与绊脚之事；“制造”体现其主动促成。
- source_word: ἐκκλίνετε ἀπ’ αὐτῶν
  choice: 要避开他们
  rationale: 表达转离并保持距离的命令。“避开”是自然现代汉语，也保留实际远离这些人的要求。
theological_decisions:
- issue: ἀδελφοί对罗马会众的代表性范围
  choice: 正文译作“弟兄们”，脚注说明很可能是对包括姊妹在内的全体会众说的。
  alternative: 正文直接译作“弟兄姊妹们”。
  rationale: 希腊文形式是阳性复数“弟兄们”，宜在正文保留；其语用上的群体包容范围则通过脚注交代，避免把词形与实际所指混为一谈。
- issue: σκάνδαλα所表达的是客观障碍还是使人犯罪跌倒的诱因
  choice: 译作“绊脚之事”，保留隐喻及一定语义开放性。
  alternative: 译作“使人犯罪的诱因”或“障碍”。
  rationale: 原词可以指使人跌倒、犯罪或偏离的因素；正文不将其限定为单一神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“弟兄们，我劝你们”保留直接的牧养劝诫语气；用“绊脚之事”保存原文隐喻，用“避开”清楚传达命令。
