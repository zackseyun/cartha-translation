  text: ἀσπάσασθε Οὐρβανὸν τὸν συνεργὸν ἡμῶν ἐν Χριστῷ καὶ Στάχυν τὸν ἀγαπητόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/009.yaml
  text: Greet Urbanus[a], our fellow worker in Messiah, and Stachys, my beloved.
translation:
  language: zh_hans
  text: 请向在基督里与我们同工的乌尔巴努斯，以及我亲爱的斯塔基问安。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: 请向……问安
  rationale: 这是复数命令式；在连续问安的语境中，“请向……问安”既准确又符合现代汉语书信表达。
- source_word: Οὐρβανὸν
  choice: 乌尔巴努斯
  rationale: 按希腊文所代表的人名作音译，并保留其完整形式。
- source_word: συνεργὸν ἡμῶν
  choice: 与我们同工的
  rationale: συνεργός 指一同工作的人；结合 ἡμῶν 译作“与我们同工的”，自然表达共同参与工作的关系。
- source_word: ἐν Χριστῷ
  choice: 在基督里
  rationale: 保留保罗书信中 ἐν Χριστῷ 的关系或领域表达，不将其具体化为较窄的解释；“基督”也是现代汉语基督教语境中 Χριστός 的通行译法。
- source_word: Στάχυν
  choice: 斯塔基
  rationale: 依希腊文人名音译。
- source_word: τὸν ἀγαπητόν μου
  choice: 我亲爱的
  rationale: 简洁保留 ἀγαπητός 所表达的亲爱之情，并以现代汉语自然的人际称谓呈现。
theological_decisions:
- issue: ἐν Χριστῷ 所表达的关系
  choice: 在基督里
  alternative: 属于基督的；在基督的事工中
  rationale: 原文可以指与基督联合、以基督为关系领域，或在基督所界定的事奉中；直译“在基督里”可保留这种神学张力，避免替原文限定单一解释。
- issue: Χριστός 的译法
  choice: 基督
  alternative: 弥赛亚
  rationale: Χριστός 本有“受膏者／弥赛亚”的称号背景，但在固定短语 ἐν Χριστῷ 中也具有名称化用法；“在基督里”是自然且能承载原文含义的现代汉语表达。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。句式将两个受问安者置于“问安”之前，符合汉语习惯；不沿用可能不易辨认原名形式的传统旧译人名。
