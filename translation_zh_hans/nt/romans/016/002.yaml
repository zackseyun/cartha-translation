  to: 好让你们在主里接纳她，以合乎圣徒身份的方式，并在她有什么事需要你们时帮助她；因为她自己曾是许多人的资助者[a]，也包括我本人。
  rationale: 调整“以配得上圣徒的方式”为自然且语义更准确的“以合乎圣徒身份的方式”；重整末句，使“资助者”同样明确适用于“许多人”和“我本人”；脚注以较清楚且不易引起神学术语混淆的替代词说明προστάτις的宽广社会支持含义。
