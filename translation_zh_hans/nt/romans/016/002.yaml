source:
  edition: SBLGNT
  text: ἵνα ⸂αὐτὴν προσδέξησθε⸃ ἐν κυρίῳ ἀξίως τῶν ἁγίων, καὶ παραστῆτε αὐτῇ ἐν ᾧ ἂν ὑμῶν χρῄζῃ πράγματι, καὶ γὰρ αὐτὴ προστάτις πολλῶν ἐγενήθη καὶ ⸂ἐμοῦ αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/002.yaml
  text: so that you may welcome her in the Lord in a manner worthy of the saints[a], and assist her in whatever matter she may need from you, for she herself has become a patron of many[b], and of myself as well.
translation:
  language: zh_hans
  text: 好让你们在主里接纳她，以合乎圣徒身份的方式，并在她有什么事需要你们时帮助她；因为她自己曾是许多人的资助者[a]，也包括我本人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “资助者”也可译为“赞助人”“帮助者”或“保护者”。原文指一位为他人提供支持、帮助或庇护的女性。
    reason: lexical_alternative
lexical_decisions:
- source_word: προσδέξησθε
  choice: 接纳
  rationale: 此处指罗马信徒友善地接待非比进入群体；“接纳”兼顾迎接、认可和款待之意。
- source_word: ἐν κυρίῳ
  choice: 在主里
  rationale: 保留保罗惯用的表达，指以与主联合的关系和基督徒团契为范围。
- source_word: ἀξίως τῶν ἁγίων
  choice: 以配得上圣徒的方式
  rationale: 较直接地保留ἀξίως的方式含义及τῶν ἁγίων的比较关系，同时现代中文可懂。
- source_word: ἁγίων
  choice: 圣徒
  rationale: 这是保罗对信徒的惯常称呼；“圣徒”保留其群体性和神学用语的一致性。
- source_word: παραστῆτε αὐτῇ
  choice: 帮助她
  rationale: 在此语境中指站在她一边、给予所需支援；“帮助她”自然清楚，且不限定帮助的具体形式。
- source_word: ἐν ᾧ ἂν ὑμῶν χρῄζῃ πράγματι
  choice: 在她有什么事需要你们时
  rationale: πρᾶγμα可泛指事情、事务；这一译法保留范围的开放性，并自然表达她对众人的需要。
- source_word: προστάτις
  choice: 资助者
  rationale: 该阴性名词在此很可能指为他人提供实际支持、资源或庇护的女性；“资助者”比泛泛的“帮助者”更能体现其重要支持角色，又不强行设定正式职衔。
- source_word: πολλῶν
  choice: 许多人
  rationale: 将不定的人称复数明确译出，符合现代中文表达。
- source_word: ἐγενήθη
  choice: 曾作
  rationale: 以过去时自然表达她已经承担过这一角色；上下文仍显明其对当前推荐的意义。
- source_word: ἐμοῦ αὐτοῦ
  choice: 我本人
  rationale: 保留αὐτοῦ对第一人称代词的强调，并由“也”表达καί的附加意义。
theological_decisions:
- issue: 如何翻译非比的称谓προστάτις
  choice: 资助者
  alternative: 恩主、保护者、帮助者
  rationale: 原词可能涵盖经济资助、社会庇护及实际帮助。“资助者”能显示非比主动且重要的支持角色，又不把该词处理为后世教会职分；脚注保留其更宽的语义范围。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“在主里”和“圣徒”保留保罗书信的惯用神学措辞；整体句法略作汉语化处理，同时保留原文的目的、条件和因果关系。
