  text: ἀσπάζεται ὑμᾶς Γάϊος ὁ ξένος μου καὶ ⸂ὅλης τῆς ἐκκλησίας⸃. ἀσπάζεται ὑμᾶς Ἔραστος ὁ οἰκονόμος τῆς πόλεως καὶ Κούαρτος ὁ ἀδελφός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/023.yaml
  text: Gaius[a], my host and the host of the whole church, greets you. Erastus, the city treasurer, greets you, and Quartus, the brother.
translation:
  language: zh_hans
  text: 我和全教会的接待者该犹向你们问安。城里的财务官[a]以拉都和弟兄括土也向你们问安。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“城中的管家”或“市政事务官”。希腊语可泛指负责管理事务的官员；在这里也很可能特指掌管城市财政的官员。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάζεται
  choice: 向你们问安
  rationale: 符合保罗书信结尾中传达问候的常见用法，也自然保留了直接的人际语气。
- source_word: ξένος
  choice: 接待……的
  rationale: 此处该犹是施行接待的人；结合“我”和“全教会”，译作动词性短语比直译为“主人”或“东道主”更自然，也能表达他提供款待和住处的含义。
- source_word: ὅλης τῆς ἐκκλησίας
  choice: 全教会
  rationale: ἐκκλησία在保罗书信中通常指基督徒群体；“全”明确保留ὅλης所表达的范围。
- source_word: οἰκονόμος τῆς πόλεως
  choice: 市里的财务官
  rationale: οἰκονόμος表示管理事务的人，在市政语境中很可能指掌管财政的官员；正文采用清楚自然的“财务官”，脚注保留更宽泛的可能。
- source_word: ἀδελφός
  choice: 弟兄
  rationale: 原文为阳性单数，指一名男性信徒；“弟兄”在现代中文基督徒群体语境中自然，并未添加原文没有的“我们的”。
theological_decisions:
- issue: ἐκκλησία在问安语中的译法
  choice: 教会
  alternative: 会众；群体
  rationale: 这里指基督徒共同体。“教会”符合保罗书信中的通常用法，同时不额外规定其组织形态。
- issue: ἀδελφός的性别与关系表达
  choice: 弟兄
  alternative: 信徒；我们的弟兄
  rationale: 原文明确使用阳性单数亲属称谓；“弟兄”既保留性别和属灵亲属关系，也避免补入原文没有的所属代词。
- issue: 该犹与“全教会”的接待关系
  choice: 接待我、也接待全教会
  alternative: 我和全教会的主人
  rationale: ξένος在这里按接待者理解，但“接待全教会”可能包括向整个群体开放住所、提供聚会或款待等，不进一步限定具体方式，以保留原文的概括性。
translation_notes:
  register: 采用现代、庄重而口语可懂的书信问安语体。“接待我、也接待全教会”避免生硬的“作……的主人”；“市里”体现πόλις的市政背景；专名采用中文圣经中通行的“该犹、以拉都、括土”。
