  text: ⸂Ἡ χάρις τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ μετὰ πάντων ὑμῶν.⸃ ⸀Ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/024.yaml
  text: The grace of our Lord Jesus Christ be with all of you[b][a]. Amen.
translation:
  language: zh_hans
  text: 愿我们主耶稣基督的恩典与你们众人同在。[a]阿们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本有本节，另一些抄本则没有；许多现代希腊文版本把本节标为文本异文。
    reason: textual_variant
lexical_decisions:
- source_word: χάρις
  choice: 恩典
  rationale: 保留保罗祝福语中上帝白白施予的恩惠这一含义，也符合现代中文基督教语境中的通行表达。
- source_word: κυρίου
  choice: 主
  rationale: 在此作为耶稣的尊称，表达其主权；“主”自然、庄重，并符合 κύριος 在这一基督论语境中的含义。
- source_word: Ἰησοῦ Χριστοῦ
  choice: 耶稣基督
  rationale: “耶稣基督”是现代中文最自然且广为人知的表达；“基督”虽为音译传统，但在中文中已稳定承载“受膏者/弥赛亚”的称号意义。
- source_word: μετὰ πάντων ὑμῶν
  choice: 与你们众人同在
  rationale: 准确表达 μετά 加属格的“与……同在”和 πάντων ὑμῶν 对全体收信人的涵盖，语体庄重而自然。
- source_word: Ἀμήν
  choice: 阿们
  rationale: 采用中文礼仪和圣经传统中通行的音译，保留其确认、赞同与祈愿实现的功能。
theological_decisions:
- issue: Χριστός 在“Ἰησοῦ Χριστοῦ”中的译法
  choice: 基督
  alternative: 弥赛亚
  rationale: 原词保有“受膏者”的称号背景；但在现代标准中文中，“耶稣基督”已是固定而清楚的称名，并未必抹去称号含义。“耶稣弥赛亚”较不自然，因此正文采用“基督”。
- issue: 本节是否属于《罗马书》原文
  choice: 正文收录并加文本异文脚注
  alternative: 从正文省略
  rationale: SBLGNT 以异文括号标示整句，抄本证据在有无本节之间存在分歧。遵照所给源文本收录，但不掩盖其文本不确定性。
translation_notes:
  register: 采用现代、庄重且易懂的祝福语体。“愿”明确呈现希腊文省略动词的祈愿性质；“你们众人”保留对全体受众的强调。文本异文标记置于整句祝福之后，以表明争议涉及整节。
