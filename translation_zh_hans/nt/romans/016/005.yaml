  text: καὶ τὴν κατ’ οἶκον αὐτῶν ἐκκλησίαν. ἀσπάσασθε Ἐπαίνετον τὸν ἀγαπητόν μου, ὅς ἐστιν ἀπαρχὴ τῆς ⸀Ἀσίας εἰς Χριστόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/005.yaml
  text: Also greet the church in their house[a]. Greet Epaenetus, my beloved[c][b], who is the firstfruits of Asia for Messiah.
translation:
  language: zh_hans
  text: 也要问候在他们家里的教会[a]。问候我所亲爱的以拜尼土；他是亚细亚中归向弥赛亚的初熟果子[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在他们家中聚会的教会。”
    reason: lexical_alternative
  - marker: b
    text: “亚细亚”指当时罗马帝国的亚细亚行省，不是现代所说的亚洲大陆。
    reason: cultural_note
  - marker: c
    text: 这句话也可意译为：“他是亚细亚最早归信弥赛亚的人。”
    reason: alternative_reading
lexical_decisions:
- source_word: κατ’ οἶκον αὐτῶν ἐκκλησίαν
  choice: 在他们家里的教会
  rationale: 贴近希腊语的结构，既可指与其家庭相关的教会，也自然暗示该教会在其家中聚会；不在正文中把后者定为唯一解释。
- source_word: ἀσπάσασθε
  choice: 问候
  rationale: 在书信末尾的问安名单中，意为向某人致意；“问候”简洁、自然。
- source_word: Ἐπαίνετον
  choice: 以拜尼土
  rationale: 采用中文圣经传统中通行、易识别的人名音译。
- source_word: ἀγαπητόν μου
  choice: 我所亲爱的
  rationale: 保留保罗表达的个人情谊，语气庄重而不显生硬。
- source_word: ἀπαρχὴ
  choice: 初熟果子
  rationale: 保留“最先收获并献上的一份”这一原有比喻及其神学回响，不直接简化为“第一个信徒”。
- source_word: τῆς Ἀσίας
  choice: 亚细亚
  rationale: 按新约时代的地理名称音译，以区别于现代所说的亚洲；具体所指在脚注说明。
- source_word: εἰς Χριστόν
  choice: 归于弥赛亚
  rationale: εἰς在此表示朝向、归属或关联；“归于”在现代中文中较自然，同时未把关系过度限定为献给或在……里面。
theological_decisions:
- issue: Χριστόν的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处保留Χριστός作为称号的含义；“弥赛亚”直接呈现“受膏者”这一称号，而不添加其他教派性解释。
- issue: ἀπαρχὴ τῆς Ἀσίας εἰς Χριστόν的含义
  choice: 亚细亚归于弥赛亚的初熟果子
  alternative: 亚细亚最早归信弥赛亚的人
  rationale: 正文保留保罗“初熟果子”的比喻以及εἰς所含的关系张力；脚注给出语境中很可能表达的具体意思，而不以解释取代原文意象。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“在他们家里的教会”保留原文的简练表达；“初熟果子”虽带古代农业意象，但在脚注辅助下可理解，并能保存原文的修辞与神学张力。
