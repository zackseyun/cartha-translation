  text: Ἀσπάσασθε Πρίσκαν καὶ Ἀκύλαν τοὺς συνεργούς μου ἐν Χριστῷ Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/003.yaml
  text: Greet Prisca and Aquila[a], my fellow workers in Messiah Jesus[b],
translation:
  language: zh_hans
  text: 请问候百基拉[a]和亚居拉——他们是我在弥赛亚耶稣里的同工[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文此处作Πρίσκα，是该姓名的正式形式；同一人在别处作Πρίσκιλλα，是较常用的形式。中文通常都音译为“百基拉”，因此不易显示这一差别。
    reason: 说明原文Πρίσκα与别处Πρίσκιλλα的姓名形式差异，以及中文音译无法显明该差异。
  - marker: b
    text: “弥赛亚耶稣”也常译作“基督耶稣”。
    reason: 提供Χριστῷ Ἰησοῦ的传统中文译法。
lexical_decisions:
- source_word: Ἀσπάσασθε
  choice: 请问候
  rationale: 第二人称复数不定过去时中间语态命令式，在书信结尾惯用于嘱咐收信人代为致意；“请问候”在现代汉语中简洁、自然，又保留命令语气的礼貌表达。
- source_word: Πρίσκαν
  choice: 百基拉
  rationale: 按新约中文传统音译该女性姓名；原文是 Πρίσκα 的宾格，即与别处“百基拉”所指同一人。脚注说明原文使用的姓名形式。
- source_word: Ἀκύλαν
  choice: 亚居拉
  rationale: 采用现代中文圣经读者熟悉且稳定的人名音译。
- source_word: τοὺς συνεργούς μου
  choice: 与我一同做工
  rationale: συνεργός 指共同工作的人。译为关系从句，既自然，也表达 μου 所标明的与保罗共同参与事工的关系；不把工作范围过度限定为某一种职分。
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: 在弥赛亚耶稣里
  rationale: ἐν 保留“在……里”的联合或所属领域意象；Χριστός 在此仍有称号意味，译作“弥赛亚”，同时以脚注列出汉语教会中更传统的“基督耶稣”。
theological_decisions:
- issue: 保罗固定表达 ἐν Χριστῷ Ἰησοῦ 中 Χριστός 的译法
  choice: 弥赛亚耶稣
  alternative: 基督耶稣
  rationale: “弥赛亚”直接传达 Χριστός 作为受膏者称号的意义，而“在……里”保留该短语可能表示联合、归属或事奉领域的张力，不将其窄化。传统译法置于脚注，以兼顾熟悉度与透明度。
- issue: ἐν Χριστῷ Ἰησοῦ 与“同工”关系的理解
  choice: 保留为“在弥赛亚耶稣里与我一同做工”
  alternative: 为弥赛亚耶稣与我一同工作
  rationale: 原文 ἐν 表示“在……里”，不宜直接改成目的或受益关系“为……”，以免消除保罗联合于弥赛亚的神学表达。
translation_notes:
  register: 采用现代、庄重而易懂的书信语体。“请问候”符合中文代致问候的习惯；“与我一同做工”比“我的同工”略展开，以清楚表达 συνεργούς μου 的共同参与关系。所有脚注标记均置于正文相应位置。
