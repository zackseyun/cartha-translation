  text: Greet Ampliatus[a], my beloved in the Lord.
translation:
  language: zh_hans
  text: 请问候我在主里所亲爱的安普利亚图[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这个希腊名字的较短形式也可音译为“安普利亚”；SBLGNT此处采用的读法支持“安普利亚图”。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: 问候
  rationale: 这是书信中常见的命令表达，要求收信人向所提到的人致意；“问候”简洁、自然，也保留了命令语气。
- source_word: Ἀμπλιᾶτον
  choice: 安普利亚图
  rationale: 按SBLGNT所载较长的希腊名字形式音译，并将宾格还原为姓名的基本形式；不用反映较短形式的“安普利亚”。
- source_word: τὸν ἀγαπητόν μου
  choice: 我所亲爱的
  rationale: 既保留μου“我的”所表达的个人情感，也以现代汉语自然地传达ἀγαπητός的亲爱、蒙爱之意。
- source_word: ἐν κυρίῳ
  choice: 在主里
  rationale: 保留保罗常用的关系或生命领域表达，不增补原文没有的“耶稣”，也不将其弱化为一般友谊。
theological_decisions:
- issue: 保罗的亲爱之情与ἐν κυρίῳ的修饰关系
  choice: 将“在主里”与“我所亲爱的安普利亚图”连在一起，表示这份亲爱处于共同归属主的关系中。
  alternative: 把“在主里”理解为修饰问候的举动，或仅译成一般的“亲爱的朋友”。
  rationale: 希腊语词序最自然地使ἐν κυρίῳ限定保罗所亲爱的这个人；直译“在主里”可保留其神学内涵及可能的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的书信语体。“问候”符合中文圣经书信中的自然表达；“我所亲爱的”比单说“亲爱的”更明确地保留第一人称所属关系。
