  text: Ἀσπάσασθε ἀλλήλους ἐν φιλήματι ἁγίῳ. Ἀσπάζονται ὑμᾶς αἱ ἐκκλησίαι ⸀πᾶσαι τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/016.yaml
  text: Greet one another with a holy kiss[b][a]. All the churches of Messiah greet you.
translation:
  language: zh_hans
  text: 你们要以圣洁的亲吻[b]彼此问安。弥赛亚的众教会都向你们问安。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“基督的众教会都向你们问安。”
    reason: alternative_reading
  - marker: b
    text: “圣洁的亲吻”是当时社会所熟悉的一种问候方式；在信徒中，它表达圣洁的关爱和团契情谊。
    reason: cultural_note
lexical_decisions:
- source_word: Ἀσπάσασθε ἀλλήλους
  choice: 彼此问安
  rationale: ἀσπάζομαι在书信语境中表示问候、致意；结合相互代词ἀλλήλους，译为“彼此问安”自然、准确，也保留命令语气。
- source_word: ἐν φιλήματι ἁγίῳ
  choice: 以圣洁的亲吻
  rationale: ἐν加与格在此表达方式；φίλημα是“亲吻”，ἁγίῳ强调这种问候在信徒团契中是圣洁、纯正的。
- source_word: Ἀσπάζονται ὑμᾶς
  choice: 向你们问安
  rationale: 这是书信结尾常见的致意表达；“你们”保留了ὑμᾶς的复数指向。
- source_word: αἱ ἐκκλησίαι πᾶσαι
  choice: 众教会都
  rationale: 定冠词、复数名词与πᾶσαι共同表达整体范围；“众……都”符合现代汉语，并保留“所有”的强调。
- source_word: τοῦ Χριστοῦ
  choice: 属于弥赛亚的
  rationale: 属格表达归属或关联；Χριστός在这里仍带有称号“受膏者／弥赛亚”的含义，因此正文采用“弥赛亚”。
theological_decisions:
- issue: Χριστοῦ的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: “弥赛亚”直接呈现Χριστός作为称号的含义；“基督”是汉语教会中长期沿用的音意传统译法，也可表达同一称号，故列作可选译法，避免把这一选择解释为教派性主张。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“问安”适合书信致意语境；“亲吻”比“亲嘴”更符合当代公共文本语体。脚注标记紧随各自所解释的内容。
