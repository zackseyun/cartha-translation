source:
  edition: SBLGNT
  text: Συνίστημι δὲ ὑμῖν Φοίβην τὴν ἀδελφὴν ἡμῶν, οὖσαν ⸀καὶ διάκονον τῆς ἐκκλησίας τῆς ἐν Κεγχρεαῖς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/001.yaml
  text: I commend to you Phoebe[a], our sister, who is also a deacon of the church in Cenchreae,
translation:
  language: zh_hans
  text: 我向你们推荐我们的姊妹非比；她也是坚革哩教会的执事[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“服事者”或“仆人”。希腊语 διάκονος 既可指教会中受认可的服事职分，也可泛指服事的人。
    reason: 保留 διάκονος 在此处可能指职分或一般服事者的词义歧义。
lexical_decisions:
- source_word: Συνίστημι
  choice: 我向你们推荐
  rationale: 在书信语境中，该词用于郑重而有利地向收信人介绍某人。“推荐”自然地表达保罗为非比作荐举的意思；“向你们”明确保留与格 ὑμῖν。
- source_word: δὲ
  choice: 不单独译出
  rationale: 此处 δέ 仅标示温和的语篇转折，并非强烈对比。现代汉语无需添加“现在”或“但是”，省略可避免赋予原文没有的时间或转折含义。
- source_word: Φοίβην
  choice: 非比
  rationale: 采用现代中文圣经读者熟悉的希腊人名音译。
- source_word: τὴν ἀδελφὴν ἡμῶν
  choice: 我们的姊妹
  rationale: 直接保留保罗对同信者所用的家庭性称呼，不在正文中增添“主内”等解释性成分。
- source_word: οὖσαν καὶ
  choice: 她也是
  rationale: 用自然汉语表达分词结构的补充说明，并保留 καί 的附加意义“也”。
- source_word: διάκονον
  choice: 执事
  rationale: 该词既可泛指服事者，也可指教会中受认可的服事职分。其后接“教会的”，使“执事”成为合适的正文译法；同时以脚注保留较宽泛的可能含义。没有译成“女执事”，因为希腊词本身在此不额外使用性别化职称。
- source_word: τῆς ἐκκλησίας τῆς ἐν Κεγχρεαῖς
  choice: 坚革哩教会的
  rationale: ἐκκλησία 在保罗书信中通常指基督徒群体；地点限定语自然处理为“坚革哩教会”。
theological_decisions:
- issue: διάκονον 是一般性的服事称呼，还是教会职分名称
  choice: 执事
  alternative: 服事者；仆人
  rationale: “坚革哩教会的”表明非比与一个具体地方教会有明确的服事关系，因此正文采用可能表示受认可职分的“执事”。但原词本身也能泛指服事者，故在脚注中保留这种真实的词义与解释张力，不据此断定后世任何宗派的职制。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“姊妹”保留教会群体的家庭性语言；“执事”不附加“女”字，以免加入原文未明说的职称形式。分号使荐举行为与对非比身份的补充说明层次清楚。
