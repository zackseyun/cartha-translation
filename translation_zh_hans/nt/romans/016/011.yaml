source:
  edition: SBLGNT
  text: ἀσπάσασθε Ἡρῳδίωνα τὸν ⸀συγγενῆ μου. ἀσπάσασθε τοὺς ἐκ τῶν Ναρκίσσου τοὺς ὄντας ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/011.yaml
  text: Greet Herodion[a], my kinsman[b]. Greet those of Narcissus who are in the Lord.
translation:
  language: zh_hans
  text: 问候我的亲族[a]希罗天。问候属拿其数[b]的那些在主里的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亲族”也可译作“亲属”或“同族同胞”；希腊语可指有血缘关系的人，也可指与保罗同属一个民族的人。
    reason: lexical_alternative
  - marker: b
    text: 很可能指拿其数家中或产业中信主的人。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: 问候
  rationale: 这是书信问安语境中的复数命令式；“问候”自然、简洁，也准确表达托人致意的意思。
- source_word: Ἡρῳδίωνα
  choice: 希罗天
  rationale: 按现代中文圣经人名的通行音译处理该人名。
- source_word: συγγενῆ μου
  choice: 我的亲族
  rationale: συγγενής 可指有血缘关系的亲属，也可在保罗书信中泛指同族同胞。“亲族”在正文中保留较宽的亲缘或族属意味，具体歧义由脚注说明。
- source_word: τοὺς ἐκ τῶν Ναρκίσσου
  choice: 属拿其数的那些人
  rationale: 原文表明这些人与拿其数有关，却没有明说“家”或“家属”。此译法保留关联关系，不在正文中补入原文没有的名词。
- source_word: τοὺς ὄντας ἐν κυρίῳ
  choice: 那些在主里的人
  rationale: 保留保罗常用的“在主里”表达及其神学含义，同时清楚表明问候只针对与拿其数有关的人中的这一部分。
- source_word: κυρίῳ
  choice: 主
  rationale: κύριος 在此处属于保罗惯用的基督徒表达“在主里”，译作“主”最为恰当。
theological_decisions:
- issue: συγγενής 所指的是血亲还是同族同胞
  choice: 正文译作“我的亲族”，不限定为近亲或犹太同胞
  alternative: 我的亲属；我的犹太同胞
  rationale: 该词既可表示血缘亲属，也可表示与保罗同族的人；本节语境不足以排除其中任何一种，故正文不擅自消除歧义，并以脚注交代。
- issue: 与拿其数有关之人的具体范围
  choice: 译作“属拿其数的那些人”
  alternative: 拿其数家里的人；拿其数家中的成员
  rationale: 原文只表达他们与拿其数的关联，并未出现“家”或“家属”一词。很可能指其家中或产业中的人，但不宜把这一推断直接写入正文。
- issue: “在主里”所表达的身份
  choice: 保留“在主里”的保罗式表达
  alternative: 信主的人；属于主的人
  rationale: 原文以“在主里”界定与拿其数有关的人中的一部分。直译既保留联合、归属等神学内涵，也避免只用一个解释性措辞将其意义收窄。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“问候”符合书信语体；“在主里”保留保罗特有而已为中文基督教语境熟悉的表达。正文中的脚注标记均紧随其所解释的词组。
