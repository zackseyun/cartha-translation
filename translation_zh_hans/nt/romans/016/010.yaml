  text: ἀσπάσασθε Ἀπελλῆν τὸν δόκιμον ἐν Χριστῷ. ἀσπάσασθε τοὺς ἐκ τῶν Ἀριστοβούλου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/010.yaml
  text: Greet Apelles[a], the approved one in Messiah. Greet those of the household of Aristobulus.
translation:
  language: zh_hans
  text: 请问候在弥赛亚里蒙认可的亚比利。请问候亚利多布家里的人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: 请问候
  rationale: 这是复数命令式，要求收信人向所提到的人致意；“请问候”自然、简洁，也保留本章反复出现的劝勉语气。
- source_word: Ἀπελλῆν
  choice: 亚比利
  rationale: 按现代中文圣经人名的通行音译处理此人名。
- source_word: τὸν δόκιμον
  choice: 经受考验、蒙认可的人
  rationale: δόκιμος指经过检验而被认定为可靠、合格；这一译法兼顾“受过考验”与“得到认可”两层含义，避免只译“可称许”而丢失检验的意味。
- source_word: ἐν Χριστῷ
  choice: 在弥赛亚里
  rationale: 保留保罗“在……里”的关系或领域表达，不改写成“作为信徒”；Χριστός在此按其称号含义译为“弥赛亚”。
- source_word: τοὺς ἐκ τῶν Ἀριστοβούλου
  choice: 亚利多布家里的人
  rationale: 原文省略了“家”或“家属”等名词，指与亚利多布家宅或产业相关的人，而不一定包括亚利多布本人；中文补出“家里”可清楚传达这一习语。
theological_decisions:
- issue: 保罗用语ἐν Χριστῷ中Χριστός的译法
  choice: 在弥赛亚里
  alternative: 在基督里
  rationale: “弥赛亚”凸显Χριστός的称号意义，同时保留ἐν所表达的联合、关系或所属领域；“在基督里”是传统且熟悉的译法，列入脚注，不把原文可能包含的神学张力简化为“作为信徒”。
- issue: δόκιμον与ἐν Χριστῷ的关系
  choice: 他是在弥赛亚里经受考验、蒙认可的人
  alternative: 他是蒙弥赛亚认可的人
  rationale: 原文ἐν Χριστῷ更自然地表示其受认可所处的关系或领域，而不明确说弥赛亚是执行认可的主体，因此不译成“蒙弥赛亚认可”。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“经受考验、蒙认可”略作展开，以呈现δόκιμος兼有的检验与认可含义；两次ἀσπάσασθε均译作“请问候”，保持原文的重复结构。
