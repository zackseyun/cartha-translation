  yaml_path: translation/nt/romans/016/025.yaml
  text: '[A] to him who is able to strengthen you according to my gospel and the preaching of Jesus the Messiah, according to the revelation of the mystery kept secret for long ages,'
translation:
  language: zh_hans
  text: '[a]那能照着我的福音和耶稣弥赛亚的宣讲，并照着那历世历代中久被隐而未宣的奥秘的启示坚固你们的那一位，'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 25—27节构成书信结尾的颂赞。这段颂赞在古代抄本中的位置不尽相同：拜占庭多数文本把它放在第14章末；现存最早的纸草抄本把它放在第15章之后；一些重要的四世纪抄本和拉丁文本则像这里一样，把它放在第16章末。有些抄本在不止一处收录这段文字，少数抄本则完全没有。大多数现代译本仍把它保留在这里，作为保罗书信的结语。
    reason: 文本鉴别
lexical_decisions:
- source_word: στηρίξαι
  choice: 坚固
  rationale: 指使信徒在信仰上稳固、坚定；“坚固”既保留原词的支撑意味，也符合现代中文圣经语体。
- source_word: κήρυγμα
  choice: 宣讲
  rationale: 表示公开传扬的信息或行动；与“耶稣弥赛亚的”连用，可在中文允许的范围内保留属格关系的含混性。
- source_word: Χριστοῦ
  choice: 弥赛亚
  rationale: 此处 Χριστός 是称号；译作“弥赛亚”清楚呈现其受膏者身份，而不把它仅当作名字。
- source_word: μυστηρίου
  choice: 奥秘
  rationale: 指先前隐藏、如今由上帝启示的真理；“奥秘”是自然且庄重的现代中文表达。
- source_word: σεσιγημένου
  choice: 秘而未宣
  rationale: 完成时被动分词表示这奥秘在过去一直处于未被说出、未被揭示的状态；“秘而未宣”同时传达隐藏与沉默两层意味。
- source_word: χρόνοις αἰωνίοις
  choice: 历世以来
  rationale: 该复数时间短语在此指漫长的往昔世代，并非抽象的永恒；“历世以来”自然表达长久延续的过去时段。
theological_decisions:
- issue: κήρυγμα Ἰησοῦ Χριστοῦ 的属格关系
  choice: 耶稣弥赛亚的宣讲
  alternative: 有关耶稣弥赛亚的宣讲
  rationale: 希腊语属格可理解为关于耶稣弥赛亚的宣讲，也可能让人想到由他而来的宣讲；正文避免加入“有关”，以免无依据地限定为宾格属格。
- issue: 本节未明说的“荣耀”与“上帝”
  choice: 不在正文补入“愿荣耀归给”或“上帝”
  alternative: 愿荣耀归给那能……的上帝
  rationale: 本节是延续到第27节才完成的与格结构。保留悬置句法和破折号，不提前补出后文成分，可避免把后文内容当成本节明说的文字。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。正文保留原文长句尚未完成的颂赞结构，以破折号引出对“奥秘”的补充说明，并以逗号结尾，表明句意延续至后文。
