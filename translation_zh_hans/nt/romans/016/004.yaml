  text: οἵτινες ὑπὲρ τῆς ψυχῆς μου τὸν ἑαυτῶν τράχηλον ὑπέθηκαν, οἷς οὐκ ἐγὼ μόνος εὐχαριστῶ ἀλλὰ καὶ πᾶσαι αἱ ἐκκλησίαι τῶν ἐθνῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/004.yaml
  text: who laid down their own necks for my life[a], to whom not only I give thanks, but also all the churches of the Gentiles[b],
translation:
  language: zh_hans
  text: 他们为了我的性命，不惜冒着生命危险[a]。不但我感谢他们，所有外邦人的教会也都感谢他们[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译作“把他们自己的颈项置于下面”，是指使自己面临丧命的危险；“颈项”在原文中为单数，与复数反身代词连用。
    reason: 说明原文具体的惯用图像、其所表达的致命危险，以及单复数形式；不加入原文未提及的兵器。
  - marker: b
    text: “外邦人”指非犹太人；或译“列国”。
    reason: 说明此处 ἔθνη 在保罗语境中的通常指称，同时保留较字面的译法。
lexical_decisions:
- source_word: οἵτινες
  choice: 他们
  rationale: 承接上一节的百基拉和亚居拉，在中文中另起一句用“他们”比直译关系代词更自然，同时保留描述性承接。
- source_word: ὑπὲρ τῆς ψυχῆς μου
  choice: 为了我的性命
  rationale: 此处 ψυχή 指保罗在现实危险中的生命，并非特指非物质的“灵魂”；“为了”保留 ὑπέρ 的代偿、护助意味而不过度说明具体事件。
- source_word: τὸν ἑαυτῶν τράχηλον ὑπέθηκαν
  choice: 把自己的颈项置于刀下
  rationale: 保留原文“把颈项置于……之下”的具体而强烈的舍命图像；“刀下”使现代中文读者能够理解这是面对致命危险，而不把表达完全化约为抽象的“冒险”。
- source_word: οὐκ ἐγὼ μόνος εὐχαριστῶ ἀλλὰ καὶ
  choice: 不但我感谢他们……也都感谢他们
  rationale: 保留原文“不但……而且/也……”的强调对比；中文补出第二个“感谢他们”，使句意完整清楚。
- source_word: πᾶσαι αἱ ἐκκλησίαι
  choice: 所有教会
  rationale: 准确表达复数定冠结构与 πᾶσαι 的全称范围，行文自然。
- source_word: τῶν ἐθνῶν
  choice: 外族人的
  rationale: 在保罗书信的语境中，ἔθνη 通常指犹太人以外的各族；“外族人”能表达族群对比，又比传统教会术语“外邦人”更易为现代普通读者理解。
theological_decisions:
- issue: ψυχή 在本句中的含义
  choice: 性命
  alternative: 灵魂
  rationale: 上下文所说的是百基拉和亚居拉为保罗承受致命危险，因此这里指保罗现实中的生命；译作“灵魂”会误导读者，使其理解为对人的构成所作的神学陈述。
- issue: τῶν ἐθνῶν 的指称
  choice: 外族人的
  alternative: 列国的
  rationale: 在《罗马书》的犹太人与非犹太人语境中，此词组自然指由非犹太人组成或以他们为主的教会；脚注保留较字面的“列国”可能性。
- issue: 舍命图像的表达程度
  choice: 把自己的颈项置于刀下
  alternative: 冒着生命危险
  rationale: 选择保留原文具体的“颈项”图像和致命危险的张力，不把它完全解释成抽象表述；脚注交代其字面结构和惯用含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“颈项”略具文学色彩，用来保存原文鲜明的舍命图像；其余句法简洁自然。所有脚注标记均已置入正文。
