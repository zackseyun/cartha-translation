source:
  edition: SBLGNT
  text: ἀσπάσασθε Ἀσύγκριτον, Φλέγοντα, ⸂Ἑρμῆν, Πατροβᾶν, Ἑρμᾶν⸃ καὶ τοὺς σὺν αὐτοῖς ἀδελφούς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/014.yaml
  text: Greet Asyncritus[a], Phlegon, Hermes, Patrobas, Hermas, and the brothers with them.
translation:
  language: zh_hans
  text: 你们要问候亚逊其土、弗勒干、赫尔墨斯、帕特罗巴、赫尔马，以及和他们在一起的弟兄们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “和他们在一起”也可理解为“与他们有联系”。这句话很可能是指与这些人相交的其他信徒。
    reason: 说明σὺν αὐτοῖς既可表示共同在场，也可在此问候语境中表示群体关联，避免把具体关系解释得过窄。
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: 你们要问候
  rationale: 这是第二人称复数的不定过去时中间语态命令式。在保罗书信结尾的问安名单中，“你们要问候”既准确表达命令语气，也符合现代汉语书信语境。
- source_word: Ἀσύγκριτον
  choice: 亚逊其土
  rationale: 人名采用现代汉语音译，并沿用中文圣经读者较熟悉的译名。
- source_word: Φλέγοντα
  choice: 弗勒干
  rationale: 人名按希腊语读音音译。
- source_word: Ἑρμῆν
  choice: 赫尔墨斯
  rationale: 人名按希腊语形式音译；虽然其形式与希腊神祇之名相同，这里在问候名单中显然是人的名字。译名也刻意与下文的Ἑρμᾶν区分。
- source_word: Πατροβᾶν
  choice: 帕特罗巴
  rationale: 人名按希腊语读音音译。
- source_word: Ἑρμᾶν
  choice: 赫尔马
  rationale: 人名按希腊语读音音译，并与前面的Ἑρμῆν（赫尔墨斯）清楚区分。
- source_word: τοὺς σὺν αὐτοῖς ἀδελφούς
  choice: 和他们在一起的弟兄们
  rationale: σὺν αὐτοῖς直译为“和他们在一起”；ἀδελφούς在语法上是阳性复数，在保罗书信中常指同属信仰群体的人。正文保留“弟兄们”，不在上下文未明示时扩展为“弟兄姊妹”。
theological_decisions:
- issue: 群体问候中ἀδελφούς的译法
  choice: 弟兄们
  alternative: 弟兄姊妹；信徒
  rationale: 希腊词在形式上明确为阳性复数。这里没有足够的上下文证据要求将其明确扩展为男女皆含的表达，因此保留原文形式；同时不否认该词在其他语境中可以泛指信徒群体。
- issue: σὺν αὐτοῖς所表达的关系
  choice: 和他们在一起
  alternative: 与他们有联系；同他们相交
  rationale: 正文保留介词短语最直接的共同在场或相伴含义，不把它限定为某种正式教会组织关系；脚注提示其可能泛指与这些人有关联的其他信徒。
translation_notes:
  register: 采用自然、庄重而简洁的现代标准汉语。人名使用清晰音译，特别区分Ἑρμῆν与Ἑρμᾶν；命令式以“你们要问候”表达。
