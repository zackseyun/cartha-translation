  text: ἀσπάσασθε Φιλόλογον καὶ Ἰουλίαν, Νηρέα καὶ τὴν ἀδελφὴν αὐτοῦ, καὶ Ὀλυμπᾶν καὶ τοὺς σὺν αὐτοῖς πάντας ἁγίους.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/015.yaml
  text: Greet Philologus and Julia[a], Nereus and his sister, and Olympas and all the saints with them.
translation:
  language: zh_hans
  text: 请问候非罗罗古、犹利亚[a]、尼利亚和他的姊妹，以及奥林巴和所有与他们在一起的圣徒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可能译作男性名“犹利亚斯”；不过，这个希腊语形式通常被理解为女性名“犹利亚”。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: 请问候
  rationale: 这是复数第二人称不定过去时中间语态命令式；在书信问安语境中译为“请问候”自然、简洁，并保留指示语气。
- source_word: Φιλόλογον
  choice: 非罗罗古
  rationale: 人名，按现代中文圣经人名音译惯例处理。
- source_word: Ἰουλίαν
  choice: 犹利亚
  rationale: 该宾格形式通常且最自然地理解为女性名 Julia；因也有人将其视为男性名，正文保留脚注标记说明。
- source_word: Νηρέα
  choice: 尼利亚
  rationale: 人名，依希腊语形式音译，采用中文读者较易辨读的形式。
- source_word: τὴν ἀδελφὴν αὐτοῦ
  choice: 他的姊妹
  rationale: ἀδελφή在此指亲属关系中的姊妹，αὐτοῦ自然译作“他的”，其先行对象按句法最自然地是尼利亚。
- source_word: Ὀλυμπᾶν
  choice: 奥林巴
  rationale: 人名，按希腊语Ὀλυμπᾶς的形式音译。
- source_word: τοὺς σὺν αὐτοῖς
  choice: 与他们在一起的
  rationale: σύν加与格表达同在或结伴关系；译法保留其修饰一群人的结构。
- source_word: πάντας ἁγίους
  choice: 所有……圣徒
  rationale: πάντας表示全体；ἅγιοι是保罗对信徒的惯常称呼，译作“圣徒”可保留其教会语境中的既定含义。
theological_decisions:
- issue: 保罗问安名单中ἅγιοι的译法
  choice: 圣徒
  alternative: 圣者；属上帝的圣洁子民
  rationale: 此词在这里指与所列人物一同聚集的信徒。“圣徒”保留保罗惯用的群体称谓，并不暗示后世册封制度。
- issue: Ἰουλίαν所指人名的性别
  choice: 犹利亚（女性名）
  alternative: 犹利亚斯（男性名）
  rationale: 希腊语形式最通常被理解为女性名Julia；鉴于翻译传统中有人提出男性名的可能，正文采用较自然的女性名，并以脚注保留另一理解。
translation_notes:
  register: 采用现代、庄重而易懂的书信问安表达。“姊妹”兼顾经文语体与亲属含义；人名以音译为主。正文中的[a]与脚注完全对应。
