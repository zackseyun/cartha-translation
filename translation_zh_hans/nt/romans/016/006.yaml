  text: Greet Mary[a], who has worked very hard for you.
translation:
  language: zh_hans
  text: 请向马利亚问安；她曾为你们[a]辛勤劳苦。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“为我们”或“在你们中间”。
    reason: textual_variant
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: 请问候
  rationale: 这是书信中转达问候的第二人称复数命令式；“请问候”符合现代汉语书信语体，也保留劝请的语气。
- source_word: Μαριάμ
  choice: 马利亚
  rationale: 采用中文圣经传统中广为人知的人名译法，便于读者辨认。
- source_word: ἥτις
  choice: 她
  rationale: 该关系代词引出对马利亚的说明；汉语分句用“她”承接更自然，其描述性语气由整个分句表达。
- source_word: πολλὰ
  choice: 辛勤
  rationale: πολλὰ在此作副词，表示劳苦的程度；与κοπιάω合译为“辛勤劳苦”，自然传达付出甚多之意。
- source_word: ἐκοπίασεν
  choice: 劳苦
  rationale: κοπιάω指费力、辛劳地工作；“劳苦”保留其强度，也符合庄重而通俗的现代汉语。
- source_word: εἰς ὑμᾶς
  choice: 为你们
  rationale: 依SBLGNT所采εἰς ὑμᾶς，表达工作所指向的对象或受益者；“为你们”简洁自然。
theological_decisions:
- issue: 末句介词短语的文本异文
  choice: 为你们
  alternative: 为我们；在你们中间
  rationale: 正文依所提供的SBLGNT读法εἰς ὑμᾶς；其他抄本读作εἰς ἡμᾶς或ἐν ὑμῖν，因此在脚注中保留这些有意义的异文，不在正文中混合处理。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“辛勤劳苦”兼顾κοπιάω所含费力工作的意味和πολλὰ所表达的程度；正文脚注标记与脚注完全对应。
