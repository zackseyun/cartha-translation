  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἡ γὰρ ὑμῶν ὑπακοὴ εἰς πάντας ἀφίκετο· ⸂ἐφ’ ὑμῖν οὖν χαίρω⸃, θέλω δὲ ὑμᾶς ⸀σοφοὺς εἶναι εἰς τὸ ἀγαθόν, ἀκεραίους δὲ εἰς τὸ κακόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/019.yaml
  text: For your obedience has reached everyone[a]. Therefore I rejoice over you, but I want you to be wise in what is good[c][b], and innocent in what is evil.
translation:
  language: zh_hans
  text: 你们的顺服已经传到众人那里[a]，所以我为你们感到欢喜[b]。不过，我希望你们在善上有智慧，在恶上纯真[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们的顺服已经为众人所知。”希腊原文直译为“你们的顺服已经传到众人那里”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“所以我因你们而欢喜。”
    reason: lexical_alternative
  - marker: c
    text: “纯真”也可译作“纯洁”或“无邪”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπακοή
  choice: 顺服
  rationale: 在保罗的用法中，这个词通常指以行动作出的顺从回应，而不只是听见；“顺服”准确且符合现代中文圣经语体。
- source_word: εἰς πάντας ἀφίκετο
  choice: 已经传到众人那里
  rationale: 保留“到达、传到”的形象，同时让中文读者自然理解为他们顺服的消息已广为人知；“众人”保留 πάντας 的修辞性广度，并不将其绝对化。
- source_word: ἐφ’ ὑμῖν χαίρω
  choice: 我为你们感到欢喜
  rationale: ἐπί加与格可表示欢喜的缘由或对象；这一译法自然表达保罗因他们而欢喜，同时不排除“为你们欢喜”的关系意味。
- source_word: σοφοὺς εἶναι εἰς τὸ ἀγαθόν
  choice: 在善事上有智慧
  rationale: 表达智慧和实际辨别力以善为领域或指向，并与下句形成平行结构。
- source_word: ἀκεραίους δὲ εἰς τὸ κακόν
  choice: 在恶事上纯真
  rationale: ἀκέραιος 可指未掺杂、纯洁、无邪；“纯真”既保留其道德上不受邪恶玷污的含义，也避免译成对恶毫无认知的幼稚。
theological_decisions:
- issue: πάντας 所指范围
  choice: 译作“众人”，按修辞性概括理解
  alternative: 所有人；各处教会中的众人
  rationale: 本句是对罗马信徒顺服之名声广传的称许，不必理解为数学意义上毫无例外的全体，也不应在正文中擅自限定为某一群体。
- issue: “在善事上有智慧，在恶事上纯真”的道德张力
  choice: 保留积极辨善与不受恶玷污之间的对照
  alternative: 善于行善、对恶一无所知；在善上有智慧、远离邪恶
  rationale: 原文同时要求对善有成熟辨识，并在与恶的关系上保持纯正；译文不将“纯真”解释成无知，也不把关系性表达强化成原文未明说的完全隔绝。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不过”自然呈现 δέ 的转折，避免“但”在此造成过强对立；两个“在……事上”保持原文善恶两项的平行。
