  text: ἀσπάσασθε Τρύφαιναν καὶ Τρυφῶσαν τὰς κοπιώσας ἐν κυρίῳ. ἀσπάσασθε Περσίδα τὴν ἀγαπητήν, ἥτις πολλὰ ἐκοπίασεν ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/012.yaml
  text: Greet Tryphaena and Tryphosa[a], who have labored in the Lord. Greet Persis, the beloved[b], who has labored much in the Lord.
translation:
  language: zh_hans
  text: 请问候土非拿和土富撒，她们是那两位在主里劳苦的[a]。请问候彼息——那位亲爱的[b]；她在主里多多劳苦。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “劳苦”也可译作“辛勤做工”或“辛劳服事”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“那位亲爱的”，没有明确说“我亲爱的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: 请问候
  rationale: 这是书信问安名单中的复数命令式；“请问候”在现代汉语中简洁自然，也保留了保罗托收信人代为致意的语气。
- source_word: Τρύφαιναν καὶ Τρυφῶσαν
  choice: 土非拿和土富撒
  rationale: 采用现代中文圣经读者较熟悉的人名音译形式，并保留两个人名在希腊文中的相近音韵。
- source_word: τὰς κοπιώσας
  choice: 她们在主里劳苦
  rationale: 阴性复数分词明确指前述两位女性；“劳苦”表达κοπιάω所含辛勤付出的意味，同时不把不定过去分词强行限定为某个汉语时态。
- source_word: ἐν κυρίῳ
  choice: 在主里
  rationale: 保留保罗惯用语的关系与领域含义，不窄化为单纯“为主”或“服事主”。
- source_word: Περσίδα
  choice: 彼息
  rationale: 采用现代中文圣经读者较熟悉的人名音译。
- source_word: τὴν ἀγαπητήν
  choice: 亲爱的彼息
  rationale: “亲爱的”自然表达ἀγαπητήν，但不添加原文没有的“我所亲爱的”或“我的”。
- source_word: ἥτις πολλὰ ἐκοπίασεν
  choice: 她在主里多多劳苦
  rationale: “她”反映关系代词的阴性单数；“多多”保留πολλά对劳苦程度或分量的强调，并以“劳苦”重现本节κοπιάω的词汇重复。
theological_decisions:
- issue: 保罗短语ἐν κυρίῳ的含义
  choice: 在主里
  alternative: 为主；在服事主的事上
  rationale: “在主里”保留与主联合、在主所界定的关系和领域中劳作等可能含义，不将其简化为目的或受益关系。
- issue: ἀγαπητήν是否带第一人称所属意味
  choice: 亲爱的彼息
  alternative: 我亲爱的彼息；蒙爱的彼息
  rationale: 希腊文有定冠词和形容词，却没有“我的”；译文因此保持亲爱或受爱这一称谓，但不补入所属代词。
- issue: 两组κοπιάω的时间与体貌
  choice: 均译作“劳苦”而不显式标注完成时态
  alternative: 曾经劳苦；已经劳苦
  rationale: 汉语不必机械对应希腊文不定过去体；上下文是在称许这些人已知的辛劳，简洁的“劳苦”既可涵盖其既往付出，也避免排除持续服事的可能。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“请问候”适合公开宣读的书信语体；分号划分两组问安。“多多劳苦”略带书面色彩，但清楚保留原文对彼息辛劳之多的强调，以及本节两次κοπιάω的词汇呼应。
