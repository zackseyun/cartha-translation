  text: φανερωθέντος δὲ νῦν, διά τε γραφῶν προφητικῶν, κατ' ἐπιταγὴν τοῦ αἰωνίου θεοῦ, εἰς ὑπακοὴν πίστεως εἰς πάντα τὰ ἔθνη γνωρισθέντος,
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/026.yaml
  text: but[a] has now been revealed, and through the prophetic Scriptures made known to all nations, according to the command of the eternal God, to bring about the obedience of faith,
translation:
  language: zh_hans
  text: 这奥秘如今已经显明，并且照永恒上帝的命令，借着先知的经卷，使万国都得知，好叫他们归于信心的顺服，[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节承接罗马书16:25—27的结尾颂赞。关于这段颂赞在不同抄本中的位置和相关抄本证据，见罗马书16:25注。
    reason: textual_critical
lexical_decisions:
- source_word: φανερωθέντος
  choice: 已经显明
  rationale: 该分词承接第25节所说的“奥秘”，表示从前隐藏的如今已被公开显明；保留被动语态，也保留与上文的句法衔接。
- source_word: γραφαῖς προφητικαῖς
  choice: 先知的经书
  rationale: 指具有先知性质或出自先知的圣经文献；“经书”既体现其权威性，又比单说“著作”更符合此处语境。
- source_word: ἐπιταγή
  choice: 命令
  rationale: 表达具有权威的指令，说明让万国知道这奥秘是按上帝的命令进行的。
- source_word: ὑπακοὴν πίστεως
  choice: 信而顺服
  rationale: 希腊语属格关系可理解为由信而来的顺服、以信为内容的顺服，或信心本身所构成的顺服；正文采用自然汉语表达，同时不把两者割裂。
- source_word: πάντα τὰ ἔθνη
  choice: 万国
  rationale: 表达普世范围，并保留ἔθνη可指各民族、列国的宽度，而不限定为与犹太人相对的“外邦人”。
- source_word: τοῦ αἰωνίου θεοῦ
  choice: 永恒上帝
  rationale: αἰώνιος在此描述上帝超越时间、永远长存；“永恒”自然而庄重。
- source_word: γνωρισθέντος
  choice: 让……知道
  rationale: 该被动分词与前面的“显明”并列并承接“奥秘”，表示这奥秘已被传达、使万国得知。
theological_decisions:
- issue: ὑπακοὴ πίστεως中属格πίστεως的关系
  choice: 信而顺服
  alternative: 信心的顺服；对信仰的顺服
  rationale: 原文关系具有浓缩性，可能涵盖信所产生的顺服及以信回应福音；采用“信而顺服”可读性较好，又避免把信与顺服截然分开。
- issue: 先知经书与显明奥秘的关系
  choice: 借着先知的经书让万国知道
  alternative: 通过先知性的经书使万国知道
  rationale: διά加属格表示媒介；不进一步断定其专指旧约某一类书卷，从而保留原文“先知的/先知性经书”的范围。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“如今却”承接第25节“历世以来秘而不宣”的对比；全节在希腊文中仍是未完结的长句，因此中文保留逗号结尾式的衔接感，但为独立引用的清晰度在注号前使用逗号。
