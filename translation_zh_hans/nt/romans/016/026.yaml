- from: 如今却已经显明，并且照永恒上帝的命令，借着先知的经书让万国知道，为要使人信而顺服，[a]
  to: 这奥秘如今已经显明，并且照永恒上帝的命令，借着先知的经卷，使万国都得知，好叫他们归于信心的顺服，[a]
  rationale: 补出承自25节的“这奥秘”，使汉语句法清楚，同时不添加原文以外的神学内容。以“先知的经卷”表达“prophetic Scriptures”，并以“归于信心的顺服”保留ὑπακοὴ πίστεως的浓缩性和歧义；“好叫他们”在汉语中明确目的结构，所指仍为“万国”。保留尾逗号，以反映本节在原文中继续连接结尾颂赞的句法。
