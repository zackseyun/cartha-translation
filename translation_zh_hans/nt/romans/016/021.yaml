id: ROM.16.21
reference: Romans 16:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ⸀Ἀσπάζεται ὑμᾶς Τιμόθεος ὁ συνεργός μου, καὶ Λούκιος καὶ Ἰάσων καὶ Σωσίπατρος οἱ συγγενεῖς μου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/021.yaml
  text: Timothy[a], my fellow worker, greets you, and so do Lucius and Jason and Sosipater, my kinsmen.
translation:
  language: zh_hans
  text: 我的同工提摩太问候你们；我的亲族[a]路求、耶孙和所西巴德也问候你们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亲族”也可译作“亲属”或“与我同族的犹太人”。希腊语原词既可指有血缘关系的亲属，也可泛指同族的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάζεται
  choice: 问候
  rationale: 在书信语境中，ἀσπάζομαι通常表示向人问安或致意。“问候”简洁自然；后半句依汉语表达补出同一谓语。
- source_word: ὑμᾶς
  choice: 你们
  rationale: 第二人称复数宾格，指罗马的众收信人；“你们”明确保留复数。
- source_word: συνεργός
  choice: 同工
  rationale: 指与保罗一同劳作的人，在基督徒事奉语境中“同工”自然、庄重，并保留共同工作的含义。
- source_word: Τιμόθεος
  choice: 提摩太
  rationale: 采用现代中文圣经传统中通行且易于辨识的人名译法。
- source_word: Λούκιος
  choice: 路求
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: Ἰάσων
  choice: 耶孙
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: Σωσίπατρος
  choice: 所西巴德
  rationale: 按本节Σωσίπατρος这一完整名字采用中文圣经中通行的译名，不与别处可能出现的简称混同。
- source_word: συγγενεῖς
  choice: 亲族
  rationale: 该词既可指血缘亲属，也可较宽泛地指同族之人。“亲族”较“亲戚”宽泛，能在正文中尽量保留家族与族群关联之间的歧义。
theological_decisions:
- issue: συγγενεῖς μου在保罗用语中的具体所指
  choice: 我的亲族
  alternative: 我的亲属；与我同族的犹太人
  rationale: 原词本身没有在本节明确限定为近亲或犹太同胞，因此正文不替作者消除这一歧义，并以脚注说明两种可能。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。为避免首句连续重复“我的”，使用“我的同工提摩太”；后半句按汉语习惯补出“也问候你们”，清楚表达希腊语中由καί连接的并列问安。
