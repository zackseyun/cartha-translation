  text: to the only wise God, through Jesus the Messiah, to whom be the glory forever. Amen.
translation:
  language: zh_hans
  text: 惟一有智慧的神，借着耶稣基督，愿荣耀归给他[a]，直到永远。阿们。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他”通常理解为前面的“神”；不过在希腊原文中，关系代词紧接“耶稣基督”之后，因此句法上也可能让人理解为指基督。
    reason: 保留原文关系代词所指的轻微歧义。
  - marker: b
    text: 本节结束了罗马书16:25—27的末尾颂赞。早期抄本对于这段颂赞的位置以及是否收录它，有显著差异；这里依照拜占庭多数文本传统予以保留。
    reason: 文本鉴别说明。
lexical_decisions:
- source_word: μόνῳ σοφῷ θεῷ
  choice: 惟一有智慧的神
  rationale: μόνῳ修饰“有智慧的神”，强调神是惟一具有终极智慧的那一位；此译法比生硬的“惟一智慧的神”更符合现代汉语。
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: 借着耶稣基督
  rationale: διά加属格表示媒介或中介；“借着”既贴近原文，也符合颂赞语境。Χριστός在此采用汉语圣经中通行且自然的称谓“基督”。
- source_word: ᾧ
  choice: 归给他
  rationale: 保留与格关系代词“给他/归给他”的表达。希腊文中其所指在句法上略有歧义，正文不直接补明所指，并用脚注说明。
- source_word: εἰς τοὺς αἰῶνας
  choice: 直到永远
  rationale: 这是表示无尽延续的惯用语；“直到永远”自然、庄重，并准确传达其意义。
- source_word: Ἀμήν
  choice: 阿们
  rationale: 采用现代汉语基督教传统中通行的音译。
theological_decisions:
- issue: 关系代词ᾧ的所指
  choice: 正文译作“他”，不明说是神还是耶稣基督，并以脚注提示句法歧义
  alternative: 明确译作“愿荣耀借着耶稣基督归给神”
  rationale: 按整体颂赞结构，所指通常理解为“神”；但由于“耶稣基督”是较近的名词，希腊文形式保留了轻微歧义，不宜在正文中无声消除。
translation_notes:
  register: 采用现代、庄重而易懂的颂赞语体。“惟一有智慧的神”保持原文强调；整体保留希腊文略显突出的语序与关系代词张力，同时用“愿荣耀归给他”使汉语可读。
