  text: ἀσπάσασθε Ἀνδρόνικον καὶ ⸀Ἰουνίαν τοὺς συγγενεῖς μου καὶ συναιχμαλώτους μου, οἵτινές εἰσιν ἐπίσημοι ἐν τοῖς ἀποστόλοις, οἳ καὶ πρὸ ἐμοῦ ⸀γέγοναν ἐν Χριστῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/007.yaml
  text: Greet Andronicus and Junia[a], my kinsmen and my fellow prisoners. They are notable among the apostles[b], and they were in Messiah before me.
translation:
  language: zh_hans
  text: 请向安多尼古和犹尼亚[a]问安；他们是我的同族，也是和我一同被囚的人。他们在使徒中颇有名望[b]，并且比我更早就在弥赛亚里了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “犹尼亚”：也有人译作男性名“犹尼亚斯”；按希腊文形式和历史用例，女性名的可能性更大。
    reason: alternative_reading
  - marker: b
    text: 也可译作“在使徒中杰出”；该短语也可能理解为“为使徒们所熟知”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: 请问安
  rationale: 保留书信中直接吩咐问候的语气；“请问安”在现代中文圣经语体中自然、庄重。
- source_word: Ἀνδρόνικον
  choice: 安多尼古
  rationale: 按希腊人名音译，并采用适合现代普通话的形式。
- source_word: Ἰουνίαν
  choice: 犹尼亚
  rationale: 该宾格形式最自然地对应有充分历史用例的女性名 Junia；历史上提出的男性名解释收入脚注。
- source_word: συγγενεῖς μου
  choice: 我的同族
  rationale: 此词既可指亲属，也可指同民族的人；保罗书信中常指同胞。“同族”避免武断地限定为近亲，同时保留族群关系。
- source_word: συναιχμαλώτους μου
  choice: 和我一同坐过牢的人
  rationale: 清楚表达共同被囚的具体经历；结合后面的完成时语境，以“坐过牢”呈现自然现代汉语。
- source_word: ἐπίσημοι ἐν τοῖς ἀποστόλοις
  choice: 在使徒中颇有名望
  rationale: 贴近该短语最直接的内部性读法，同时中文“在……中颇有名望”仍可表达在该群体范围内受瞩目；另一种“为使徒们所熟知”的外部性理解列入脚注。
- source_word: πρὸ ἐμοῦ
  choice: 比我更早
  rationale: 明确表达时间上的先后关系，并与后面的“在弥赛亚里”自然衔接。
- source_word: γέγοναν ἐν Χριστῷ
  choice: 在弥赛亚里
  rationale: 保留保罗“在基督/弥赛亚里”的联合性惯用表达，不将其释义化为单纯“信主”；Χριστός在此按称号译为“弥赛亚”。
theological_decisions:
- issue: Ἰουνίαν的性别与人名形式
  choice: 正文译作女性名“犹尼亚”
  alternative: 男性名“犹尼亚斯”
  rationale: 希腊文形式及古代姓名用例更支持女性名；男性读法虽较不可能，却在释经史上影响显著，因此以脚注保持透明。
- issue: ἐπίσημοι ἐν τοῖς ἀποστόλοις的范围
  choice: 在使徒中颇有名望
  alternative: 为使徒们所熟知
  rationale: 希腊语可被理解为二人在使徒群体中有名望，也有人将其理解为他们受到使徒们熟知。正文采用较直接的“在……中”读法，脚注保留另一种句法理解，不消除真实的神学张力。
- issue: ἐν Χριστῷ的表达
  choice: 在弥赛亚里
  alternative: 信了弥赛亚／成为信徒
  rationale: 原文是保罗特有且神学含义丰富的“在弥赛亚里”表达；不将其缩减为归信事件，且以“弥赛亚”体现Χριστός的称号性质。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“同族”保留συγγενεῖς可能指亲属或同胞的空间；正文和脚注共同呈现“使徒中”这一争议短语的真实歧义。所有脚注标记均已在正文对应位置出现。
