  text: ἀσπάσασθε Ῥοῦφον τὸν ἐκλεκτὸν ἐν κυρίῳ καὶ τὴν μητέρα αὐτοῦ καὶ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/013.yaml
  text: Greet Rufus[a], the chosen one in the Lord, and his mother and mine.
translation:
  language: zh_hans
  text: 问候在主里蒙拣选的鲁孚[a]，也问候他的母亲——也是我的母亲。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在主里杰出的鲁孚”。“蒙拣选的”所译的希腊语形容词也可有“优秀、出众”的意思。
    reason: 保留 ἐκλεκτός 在“蒙拣选”与“杰出、优秀”之间的词义可能。
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: 问候
  rationale: 复数命令式，要求收信人向所提到的人致意；“问候”简洁自然，符合保罗书信结尾的语境。
- source_word: Ῥοῦφον
  choice: 鲁孚
  rationale: 按现代中文圣经人名的通行音译处理。
- source_word: ἐκλεκτὸν
  choice: 蒙拣选的
  rationale: 该形容词可表示“被拣选的”，也可能有“优秀、出众”的意味；正文采用较直接且为读者熟悉的“蒙拣选”，另以脚注保留词义上的其他可能。
- source_word: ἐν κυρίῳ
  choice: 在主里
  rationale: 保留介词短语所表达的领域或关系，不改写成“被主”或“主所”，以免过度限定其语义。
- source_word: μητέρα αὐτοῦ καὶ ἐμοῦ
  choice: 他的母亲——也是我的母亲
  rationale: 原文简省，直译为“他的母亲和我的”；破折号既保留保罗亲切的补充语气，也以自然中文呈现其属灵亲情，而不展开成解释性意译。
theological_decisions:
- issue: ἐκλεκτὸν ἐν κυρίῳ 的含义
  choice: 译作“在主里蒙拣选的”，表达鲁孚在与主的关系中是蒙拣选的，但不将其纳入某一特定的教义体系。
  alternative: 也可能指“在主里杰出的、出众的”，或将“蒙拣选”理解为更具技术性的救恩论用语。
  rationale: 原短语容许神圣拣选与褒扬性称许之间的张力；正文与脚注共同保留这种可能性，不武断消除歧义。
- issue: “他的母亲——也是我的母亲”的关系
  choice: 保留母亲称谓，让上下文自然表明保罗是在亲情与照顾的意义上称她为自己的母亲。
  alternative: 理解为保罗与鲁孚有同一位生母。
  rationale: 书信与社群语境更支持亲切的属灵家庭称谓；译文仍贴近原文，不直接加入“待我如母”等解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“在主里”保留保罗惯用的关系性表达；破折号呈现原文简省而亲切的补充语气。
