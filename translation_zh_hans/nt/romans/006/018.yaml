  text: And having been freed from sin[b][a], you were enslaved to righteousness.
translation:
  language: zh_hans
  text: 你们既从罪中得了释放，就被义所奴役。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλευθερωθέντες
  choice: 既……得了释放
  rationale: 不定过去时被动分词表示受众已经承受的行动；“既……得了释放”自然保留被动意义，并体现与主句的先后或逻辑关系。
- source_word: δὲ
  choice: 就（以句式衔接体现）
  rationale: δέ在这里是较弱的承接语；中文用“既……就……”自然推进论述，无须机械另译为“而”或“但”。
- source_word: ἁμαρτίας
  choice: 罪
  rationale: 保留单数“罪”，既可指罪本身，也容纳保罗在本段中将罪描写为统治势力的意味。
- source_word: ἐδουλώθητε
  choice: 作了……的奴仆
  rationale: 该词为不定过去时被动，表达被置于奴役关系之下；“作了……的奴仆”保留奴隶隐喻及被动意味，避免弱化为一般的“服事”。
- source_word: δικαιοσύνῃ
  choice: 义
  rationale: “义”是δικαιοσύνη在保罗书信中的传统且凝练的对应词，可容纳道德、公义及法理等语义层面。
theological_decisions:
- issue: 如何处理δουλόω的奴役隐喻
  choice: 作了义的奴仆
  alternative: 被义奴役了
  rationale: 保罗在罗马书第6章刻意以奴役关系描述主权的转移，不宜淡化为“义的仆人”或“服事义”。“作了义的奴仆”在现代中文中较自然，也保留隐喻的尖锐性。
- issue: δικαιοσύνη的语义范围
  choice: 义
  alternative: 公义
  rationale: 正文采用“义”以保持保罗用语的凝练和多义张力；“公义”可突出正直或正义，却可能使范围显得较窄。
translation_notes:
  register: 采用简洁、庄重而通俗的现代标准汉语。“既……就……”呈现分词与主句的关系；保留“罪”与“义”的对称，也保留奴役隐喻。
