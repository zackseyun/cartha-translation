  text: χάρις δὲ τῷ θεῷ ὅτι ἦτε δοῦλοι τῆς ἁμαρτίας ὑπηκούσατε δὲ ἐκ καρδίας εἰς ὃν παρεδόθητε τύπον διδαχῆς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/017.yaml
  text: But thanks be to God that[a], though you were slaves of sin[b], you obeyed from the heart the pattern of teaching to which you were handed over.
translation:
  language: zh_hans
  text: 但感谢神！你们从前虽然作罪的奴隶，却从心里顺从了你们所被交付给的那教导的规范[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“那教导的模式”或“那教导的准则”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译可作“你们被交付给的那教导的规范”；原文把信徒表述为被交付给这一教导规范，而非单说教导传给了信徒。
    reason: alternative_rendering
lexical_decisions:
- source_word: χάρις δὲ τῷ θεῷ
  choice: 但感谢神
  rationale: 这是向神表达感谢的惯用语，不是把 χάρις 译作抽象的“恩典”；“感谢神”自然保留了保罗的颂赞语气。
- source_word: δοῦλοι τῆς ἁμαρτίας
  choice: 罪的奴隶
  rationale: 本章以受辖制和归属为核心展开奴役比喻；“奴隶”比“仆人”更准确地保留罪的支配意味。
- source_word: ὑπηκούσατε
  choice: 顺从了
  rationale: 该动词表示实际服从，而不只是听见；“顺从”也能自然衔接“从心里”。
- source_word: ἐκ καρδίας
  choice: 从心里
  rationale: 保留 καρδία 的具体隐喻，并表达真诚、内在的顺从。
- source_word: τύπον διδαχῆς
  choice: 那教导的规范
  rationale: τύπος 可指模式、范型或规范；此处用“规范”既表达塑造和约束作用，也避免把它误解为教学方法。
- source_word: παρεδόθητε
  choice: 你们已被交付
  rationale: 保留希腊文的被动语态及其出人意料的意象：不是教导被交给信徒，而是信徒被交付给这教导。
- source_word: εἰς ὃν
  choice: 归入其中
  rationale: “归入”表达 εἰς 所含的方向或进入意味，“其中”回指前面的教导规范。
theological_decisions:
- issue: δοῦλοι 是否应弱化为“仆人”
  choice: 罪的奴隶
  alternative: 罪的仆人
  rationale: 罗马书第六章强调罪的占有和辖制，并与作义的奴隶形成对照；“奴隶”保留这一神学张力。
- issue: παρεδόθητε 的被动结构应否改写为“教导传给你们”
  choice: 你们已被交付归入其中
  alternative: 那传给你们的教导
  rationale: 原文明确把信徒作为被交付的一方。保留被动结构，避免消除保罗刻意采用的强烈意象。
- issue: 如何处理“曾是罪的奴隶”与“顺从教导”之间的感谢逻辑
  choice: 保留“虽……却……”的转折
  alternative: 改写为“感谢神，因为你们不再是罪的奴隶”
  rationale: 原文没有直接说“不再是”，而是以先前身份和实际顺从形成张力；译文不补入原文未明说的否定命题。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“罪的奴隶”保留本章鲜明的奴役比喻；分号使罕见的被动结构在中文中清楚可读，同时不将其顺常化为“教导被传给你们”。
