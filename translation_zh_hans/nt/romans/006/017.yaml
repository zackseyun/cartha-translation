  rationale: 修订删除原文未明说的“如今”，并把被动分词结构恢复为修饰“教导的规范”的关系结构：“你们所被交付给的那教导的规范”。这样既忠实保留παρεδόθητε的被动语态和εἰς的趋向，也使中文句法连贯。脚注锚点分别紧邻“规范”与完整被动关系结构。
