  text: νυνὶ δέ, ἐλευθερωθέντες ἀπὸ τῆς ἁμαρτίας δουλωθέντες δὲ τῷ θεῷ, ἔχετε τὸν καρπὸν ὑμῶν εἰς ἁγιασμόν, τὸ δὲ τέλος ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/022.yaml
  text: But now[a], having been freed from sin and enslaved to God, you have your fruit unto sanctification, and the end[c][b], eternal life.
translation:
  language: zh_hans
  text: 但如今，你们既从罪中得了释放，又成了上帝的奴仆[a]，就有果子，以至于成圣[b]；结局就是永生[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“又被归给上帝作奴仆”。
    reason: 说明δουλωθέντες的被动语态以及归属上帝的奴仆意象。
  - marker: b
    text: 或译“以至于圣洁”或“导向圣洁”。
    reason: ἁγιασμός可侧重成圣的过程，也可侧重圣洁的状态或结果；εἰς表达趋向或结果。
  - marker: c
    text: 或译“终局”或“最终结果”。
    reason: τέλος可指终点，也可指最终达成的结果。
lexical_decisions:
- source_word: νυνὶ δέ
  choice: 但如今
  rationale: 保留δέ所表达的强烈转折，并以自然的现代汉语承接前文所述的旧境况。
- source_word: ἐλευθερωθέντες ἀπὸ τῆς ἁμαρτίας
  choice: 既从罪中得了释放
  rationale: 体现不定过去时被动分词所指向的、信徒所领受的已成事实；“罪”保持单数，也保留其作为权势或辖制领域的含义。
- source_word: δουλωθέντες δὲ τῷ θεῷ
  choice: 又成了上帝的奴仆
  rationale: 保留δουλόω鲜明的奴役比喻及与“罪”的奴役之间的对照；汉语采用较自然的表达，所隐含的被动含义另以脚注说明。
- source_word: ἔχετε τὸν καρπὸν ὑμῶν
  choice: 就有了自己的果子
  rationale: 保留ἔχετε“有”和καρπός“果子”的农业意象，不将其直接释作“益处”或“结果”。
- source_word: εἰς ἁγιασμόν
  choice: 导向成圣
  rationale: “导向”表达εἰς所含的趋向及结果意味；“成圣”既保留神学含义，也可在现代汉语中表达成为圣洁的过程或结果。
- source_word: τὸ δὲ τέλος
  choice: 其结局
  rationale: “结局”既能表达τέλος的终点，也能表达由前述果子最终达到的结果，且比单纯的“结束”更符合本句语境。
- source_word: ζωὴν αἰώνιον
  choice: 永生
  rationale: 这是现代汉语中准确、通行且具有适当神学分量的译法。
theological_decisions:
- issue: 信徒与上帝之间的奴仆意象
  choice: 成了上帝的奴仆
  alternative: 被置于上帝的奴役之下；归上帝作奴仆
  rationale: 本章有意将从前受罪奴役与如今归上帝作奴仆相对照，因此不以“服事上帝”或“献身给上帝”等较弱表达淡化其张力。
- issue: ἁγιασμός的过程与状态含义
  choice: 成圣
  alternative: 圣洁
  rationale: “成圣”较能保留本语境中过程与结果并存的可能性；“圣洁”也是合理译法，故在脚注中保留。
- issue: τέλος是终点还是结果
  choice: 结局
  alternative: 终局；结果
  rationale: “结局”不强行排除时间上的终点或逻辑上的最终结果，因而保留原词在本语境中的语义张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“奴仆”有意保留保罗论证中尖锐的受辖制意象；“果子”保留原文比喻。“导向成圣”清楚表达εἰς的方向与结果意味，同时避免把过程和结果截然分开。
