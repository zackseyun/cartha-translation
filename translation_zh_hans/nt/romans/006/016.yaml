revisions:
- from: 难道你们不知道吗？你们把自己献上作奴隶、听从谁，就是谁的奴隶：或作罪的奴隶，以致死亡；或作顺从的奴隶，以致称义[a]。
  to: 难道你们不知道吗？你们把自己交出来作奴隶去服从谁，就作谁的奴隶：不是作罪的奴隶，以致死亡，就是作顺从的奴隶，以致于义[a]。
  rationale: 修订使中文句法明确对应原文的呈交、服从和奴隶归属关系；保留罪与顺从作为相对的奴役对象；并将 δικαιοσύνην 改译为“义”，以忠实保留保罗此处的名词表达及其语义开放性。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T03:51:06Z'
review_pass:
  verdict: revise
  source_fidelity: 正文将 δικαιοσύνην 译为“称义”不够忠实。该词在此是与“死亡”相对的结果性名词，不能安全地限定为“称义”（δικαίωσις/被宣告为义的概念）；应保留为“义”，并可在脚注提示“公义”为词义选项。原译“把自己献上作奴隶、听从谁，就是谁的奴隶”句法连接也不清楚，未充分表达“把自己置于某人支配下以服从他”的条件关系。
  naturalness: 修订后的“把自己交出来作奴隶去服从谁，就作谁的奴隶”是现代普通话中清晰、自然的对应表达。“不是……就是……”自然呈现原文的二择对照，同时保留“作罪的奴隶／作顺从的奴隶”的刻意张力。
  terminology: 保留“奴隶”以对应 δοῦλος，保留“罪”和“顺从”的抽象、拟人化对照。以“义”对应 δικαιοσύνη，避免将其狭义化为“称义”；脚注保留“公义”的可行词义选项，符合英文审计轨迹。
  issues:
  - severity: high
    issue: δικαιοσύνην 被译为“称义”。
    rationale: “称义”将原文的 δικαιοσύνη（义／正义／公义）限定为特定的法庭性、救恩论过程，超出了本节名词本身所明确表达的内容，也未保留其可争议的语义幅度。
  - severity: medium
    issue: 首句的汉语句法关系不清楚。
    rationale: “把自己献上作奴隶、听从谁，就是谁的奴隶”中顿号后的“听从谁”悬置，难以明确表现原文“向谁把自己呈上作奴隶以服从，就属于谁”的关系。
  - severity: low
    issue: 脚注对“称义”的说明延续了正文的过度限定。
    rationale: 脚注应说明正文“义”的词义替代项，而不应把“称义”作为本节正文的优先含义。
