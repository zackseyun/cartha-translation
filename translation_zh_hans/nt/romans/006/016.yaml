id: ROM.6.16
reference: Romans 6:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οὐκ οἴδατε ὅτι ᾧ παριστάνετε ἑαυτοὺς δούλους εἰς ὑπακοήν, δοῦλοί ἐστε ᾧ ὑπακούετε, ἤτοι ἁμαρτίας εἰς θάνατον ἢ ὑπακοῆς εἰς δικαιοσύνην;
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/016.yaml
  text: Do you not know that if you present yourselves as slaves for obedience[a], you are slaves of the one whom you obey—either of sin leading to death, or of obedience leading to righteousness?
translation:
  language: zh_hans
  text: 难道你们不知道吗？你们把自己交出来作奴隶去服从谁，就作谁的奴隶：不是作罪的奴隶，以致死亡，就是作顺从的奴隶，以致于义[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“公义”。
    reason: δικαιοσύνη可指义或公义；正文保留“义”，避免将其限定为“称义”。
lexical_decisions:
- source_word: παριστάνετε ἑαυτούς
  choice: 把自己献上
  rationale: 保留把自己置于某者支配之下的具体意味；“献上”在现代汉语中自然，也与本章上下文用语相呼应。
- source_word: δούλους / δοῦλοί
  choice: 奴隶
  rationale: 准确表达受辖制、归属主人的身份，保留保罗论证中强烈的奴役意象，不弱化为“仆人”。
- source_word: εἰς ὑπακοήν
  choice: 听从
  rationale: 在汉语句法中把目的性的名词结构自然转化为动词，表达献上自己是为了服从。
- source_word: ᾧ ὑπακούετε
  choice: 听从谁
  rationale: 希腊文关系代词在语境中指奴隶所服从的对象；中文以“谁”简洁保留这一关系，不额外加入“主人”。
- source_word: ἁμαρτίας
  choice: 罪
  rationale: 保留原文抽象名词，让上下文的奴隶意象自然体现罪被人格化为辖制人的势力。
- source_word: εἰς θάνατον
  choice: 以致死亡
  rationale: 表达 εἰς 的结果或趋向意义，同时保持庄重、自然。
- source_word: ὑπακοῆς
  choice: 顺从
  rationale: 保留名词性概念，并与前文“听从”形成词义呼应；原文把“顺从”与“罪”并列为两种归属。
- source_word: δικαιοσύνην
  choice: 称义
  rationale: 在本句“以致……”的结果结构中，“称义”可表达保罗语境中进入正当、蒙认可状态的含义；但原词也可指“义”，故以脚注保留该译法，避免消除歧义。
theological_decisions:
- issue: δικαιοσύνην 在保罗式对比中的含义
  choice: 称义
  alternative: 义；公义
  rationale: 本句以“死亡”与 δικαιοσύνην 作为平行结果，“称义”在中文中较自然地表达与死亡相对的正当状态；然而该词也可能强调道德上的义或公义，故不将其排除，并在脚注中保留。
- issue: 罪与顺从作为奴役对象的拟人化
  choice: 保留“作罪的奴隶／作顺从的奴隶”
  alternative: 解释为“受罪辖制／因顺从而……”
  rationale: 原文有意以两个抽象名词构成不完全对称而富张力的对比；直保留这种表达，不将“顺从”的对象补充为某一特定神学对象。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“难道你们不知道吗”保留反问语气；冒号与分号呈现原文两条道路的对照。正文所有脚注标记均已对应。
