  text: Τί οὖν; ⸀ἁμαρτήσωμεν ὅτι οὐκ ἐσμὲν ὑπὸ νόμον ἀλλὰ ὑπὸ χάριν; μὴ γένοιτο·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/015.yaml
  text: What then? Should we sin because we are not under law but under grace? May it never be![a][b]
translation:
  language: zh_hans
  text: 那么，我们因为不在律法之下，而在恩典之下，就犯罪吗？绝对不可！
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τί οὖν
  choice: 那么，怎么样呢？
  rationale: 保留简短的推论性问句和保罗推进论证的语气，不增添原文没有的“我们该说什么”。
- source_word: ἁμαρτήσωμεν
  choice: 就可以犯罪吗？
  rationale: 这里是不定过去时虚拟语气的商议式用法；结合反问语境，“可以犯罪吗”自然表达所提出并随即否定的可能性，而不把它译成持续犯罪。
- source_word: ὅτι
  choice: 因为
  rationale: 明确表示所提议行为的理由：以“不在律法之下，而在恩典之下”为犯罪的根据。
- source_word: ὑπὸ νόμον
  choice: 在律法之下
  rationale: 保留保罗的法律—权势关系隐喻；中文通常需用“律法”自然表达 νόμος，同时不擅自限定为“摩西律法”。
- source_word: ὑπὸ χάριν
  choice: 在恩典之下
  rationale: 以基督教汉语中准确而通行的“恩典”表达 χάρις，并与“律法之下”形成平行对照。
- source_word: μὴ γένοιτο
  choice: 绝对不可以！
  rationale: 传达该希腊习语强烈、断然的否定；现代中文清楚有力，也直接回应前面的“可以……吗”。
theological_decisions:
- issue: νόμος 在对比中的范围
  choice: 正文译为“律法”，不加“摩西的”
  alternative: 摩西律法；法律
  rationale: 原文没有冠词，也未在本句明确限定范围；译文保留保罗表达中的神学张力，避免在翻译层面过早缩窄所指。
- issue: 恩典是否构成犯罪的许可
  choice: 以反问及强烈否定呈现，不添加解释
  alternative: 意译为“恩典绝不准许我们犯罪”
  rationale: 原文通过问答推进论证，而不是在本句完整阐释恩典与顺服的关系；保留其修辞形式可避免加入原文未明说的神学结论。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“那么，怎么样呢？”保留论辩转折；“在律法之下／在恩典之下”维持原文平行结构。脚注提供较直译或较传统的替代表达。
