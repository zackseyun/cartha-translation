  source_fidelity: “那么，怎么样呢？”在现代汉语中不够自然，且“怎么样”容易指向‘情形如何’或‘该怎么办’，未能清晰承接Τί οὖν的论辩性转折。把“就可以犯罪吗”改为“就犯罪吗”，较贴近ἁμαρτήσωμεν的商议式问句，避免将问题主要表述为‘是否获准’。其余关键对照——“律法之下／恩典之下”——忠实保留了原文未限定νόμος范围的表达。
  naturalness: 修订后的问句符合现代标准普通话的论辩语体，语序清楚，且保留保罗先提出荒谬推论、再断然驳斥的节奏。“绝对不可！”庄重而易懂，能自然传达μὴ γένοιτο的强烈否定。
  terminology: “律法”“恩典”均为现代中文圣经译法中通行且准确的术语；不加“摩西”或“神的”等限定，恰当保留原文的开放性。“犯罪”准确对应ἁμαρτήσωμεν。
  issues:
