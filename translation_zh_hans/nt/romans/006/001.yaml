  yaml_path: translation/nt/romans/006/001.yaml
  text: What then shall we say? Should we continue in sin so that grace may increase?[a][b]
translation:
  language: zh_hans
  text: 那么，我们该怎么说呢？难道我们要继续活在罪中，好让恩典增多吗？[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “继续活在罪中”或译“继续留在罪中”。
    reason: lexical_alternative
  - marker: b
    text: “恩典增多”或译“恩典越发丰盛”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: 那么，我们该怎么说呢
  rationale: 保留οὖν承接上文推论的作用，并将未来时ἐροῦμεν在此处的商议性、修辞性问法译成自然的现代汉语。
- source_word: ἐπιμένωμεν
  choice: 难道我们要继续
  rationale: 现在时虚拟语气提出对持续行为的商议性反问；“继续”准确表达坚持或停留于某种状态，“难道”则自然体现上下文中的反问语气，但不提前说出下一节的回答。
- source_word: τῇ ἁμαρτίᾳ
  choice: 活在罪中
  rationale: 与ἐπιμένω搭配的与格表示持续处于罪的领域或生活实践中；“活在罪中”比生硬的“继续于罪”更符合现代汉语，同时避免将其窄化为单次犯罪。
- source_word: ἵνα
  choice: 好让
  rationale: 明确保留目的或所设想结果的关系，也符合反问句中的自然汉语表达。
- source_word: ἡ χάρις
  choice: 恩典
  rationale: “恩典”是χάρις在保罗论述中准确而通行的汉语译法，指向上帝所赐的恩惠。
- source_word: πλεονάσῃ
  choice: 增多
  rationale: 表达数量或程度上的增加，语言清楚现代；“越发丰盛”可体现传统的“abound”色彩，列为脚注替代译法。
theological_decisions:
- issue: 应将保罗的问题表达为许可、义务，还是单纯预测
  choice: 以“难道我们要继续活在罪中”表达商议性的道德反问
  alternative: “我们可以继续活在罪中吗”或“我们仍要活在罪中吗”
  rationale: 希腊语虚拟语气是在提出一种可能采取的持续行为，而非单纯预测；本译法保留其道德张力，又不把问题改写成明确的许可公式。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“那么”承接前文论证；“难道”呈现修辞性反问；“活在罪中”便于普通读者理解持续处于罪之中的含义。所有脚注标记均已置于正文。
