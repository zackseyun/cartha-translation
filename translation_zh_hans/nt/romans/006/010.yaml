  text: ὃ γὰρ ἀπέθανεν, τῇ ἁμαρτίᾳ ἀπέθανεν ἐφάπαξ· ὃ δὲ ζῇ, ζῇ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/010.yaml
  text: For the death he died[a], he died to sin once for all; but the life he lives, he lives to God.
translation:
  language: zh_hans
  text: 因为他死，是向罪死，一次而永远地[a]；但他活，是向上帝活。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “向罪死”也可译作“为罪而死”或“就罪而言死了”。
    reason: 保留τῇ ἁμαρτίᾳ这一与格短语可能表达的关系、受益或所涉方面等不同理解。
lexical_decisions:
- source_word: ὃ γὰρ ἀπέθανεν
  choice: 因为他所死的
  rationale: 中性关系代词ὃ与重复的动词构成惯用表达，指向他死亡这件事；“他所死的”保留原文形式及与后半句的平行，也承接γάρ所表达的解释关系。
- source_word: τῇ ἁμαρτίᾳ ἀπέθανεν
  choice: 是向罪死
  rationale: 与格在此最自然地表达关系或指向；“向罪死”保留保罗在“向罪”与“向上帝”之间的对照，也不把可能的“为罪而死”直接写入正文。
- source_word: ἐφάπαξ
  choice: 只此一次，永远有效
  rationale: 该词表示一次完成、不再重复，并具有持续效力；这一译法用现代汉语同时传达单次性与终局性。
- source_word: ὃ δὲ ζῇ
  choice: 但他所活的
  rationale: 保留与“他所死的”相称的关系结构；δέ在此标明死亡与活着之间的鲜明转折，译作“但”。
- source_word: ζῇ τῷ θεῷ
  choice: 是向上帝活
  rationale: 与格表达生命的关系与指向；“向上帝活”与前面的“向罪死”形成紧密、刻意的平行。
theological_decisions:
- issue: τῇ ἁμαρτίᾳ应如何翻译，才不至于暗示基督本人有罪，同时又保存原文张力
  choice: 向罪死
  alternative: 为罪而死；就罪而言死了
  rationale: “向罪死”不把个人罪性归于基督，并保留原文与“向上帝活”的语法和神学对称。鉴于与格也可能理解为“为罪”或“就罪而言”，这些可能性列入脚注，而不在正文中加以裁定。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“上帝”用于θεός。“只此一次，永远有效”避免单译“仅一次”可能只表示次数的不足，并传达ἐφάπαξ所含不可重复、效力持久之意。正文刻意保留“他所死的／他所活的”平行结构。
