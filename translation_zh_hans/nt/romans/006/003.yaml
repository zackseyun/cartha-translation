  text: ἢ ἀγνοεῖτε ὅτι ὅσοι ἐβαπτίσθημεν εἰς Χριστὸν Ἰησοῦν εἰς τὸν θάνατον αὐτοῦ ἐβαπτίσθημεν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/003.yaml
  text: Or do you not know that all of us who were baptized into Messiah Jesus were baptized into his death?[a]
translation:
  language: zh_hans
  text: 难道你们不知道，我们所有受洗归入弥赛亚耶稣[a]的人，都是受洗归入他的死吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弥赛亚耶稣”也可译作“基督耶稣”。希腊文：Christos Iēsous。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: 难道……吗
  rationale: 结合反问句式表达保罗承接上文的论辩转折和温和责问；汉语不必生硬地单独译出“或”。
- source_word: ἀγνοεῖτε
  choice: 你们不知道吗
  rationale: 自然表达现在时直陈语气所构成的反问，并保留保罗诉诸共同知识的意味。
- source_word: ὅσοι
  choice: 我们凡……的人
  rationale: 与第一人称复数动词相配，清楚表达所有符合条件者都包括在内。
- source_word: ἐβαπτίσθημεν
  choice: 受洗
  rationale: 直接表达不定过去时被动语态所指的事件，不加入对洗礼方式或功效的宗派性解释。
- source_word: εἰς
  choice: 归入
  rationale: “归入”在现代中文中自然地保留进入、归属和联合的意象，同时不具体界定其神学机制；两处均作同样处理。
- source_word: Χριστὸν Ἰησοῦν
  choice: 弥赛亚耶稣
  rationale: Χριστός在此保留其“受膏者／弥赛亚”的称号意义；脚注列出传统译法“基督耶稣”。
- source_word: θάνατον
  choice: 死
  rationale: 简洁、直接地对应θάνατος，在“归入他的死”这一结构中自然庄重。
- source_word: αὐτοῦ
  choice: 他的
  rationale: 按属格代词的自然领属意义翻译，所指为弥赛亚耶稣。
theological_decisions:
- issue: 洗礼语境中的εἰς是否应译得偏向圣礼功效、象征性认同或盟约联合
  choice: 两处均译为“归入”
  alternative: “与……相关”“受洗而与……联合”“进入”
  rationale: “归入”保留原文朝向、进入及纳入其中的强烈意象，却不替原文判定洗礼与基督及其死亡发生关联的具体神学机制。
translation_notes:
  register: 采用现代、庄重且口语可懂的反问句式。“难道你们不知道吗？”将责问自然前置；“我们凡……的人”兼顾包容范围和汉语流畅度。脚注标记置于全句末，主文与脚注一一对应。
