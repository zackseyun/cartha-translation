  text: Εἰ γὰρ σύμφυτοι γεγόναμεν τῷ ὁμοιώματι τοῦ θανάτου αὐτοῦ, ἀλλὰ καὶ τῆς ἀναστάσεως ἐσόμεθα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/005.yaml
  text: For if we have become united with him in the likeness of his death[b][a], we will certainly also be united with him in the likeness of his resurrection.
translation:
  language: zh_hans
  text: 因为我们若已经在与他的死相似的样式中和他联合[a]，也必在与他的复活相似的样式中和他联合[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“与他一同生长”。
    reason: lexical_alternative
  - marker: b
    text: 希腊原文后半句直译为：“也必是复活的”；译文承接前半句补出“和他联合”，并为汉语平行而补出“相似的样式”。
    reason: alternative_reading
lexical_decisions:
- source_word: σύμφυτοι
  choice: 与他联合
  rationale: 该词可表达共同生长而形成的紧密结合，也可指共同参与。“与他联合”在现代汉语中自然清楚，同时不把这种联合限定为某一种教义解释。
- source_word: γεγόναμεν
  choice: 已经……联合（由“若……联合”的句式承载其现今结果）
  rationale: 完成时表示已经形成并持续有效的状态；汉语借整体句式表达这一结果状态，避免生硬直译为“已经成为”。
- source_word: τῷ ὁμοιώματι
  choice: 在……相似的样式上
  rationale: 保留ὁμοίωμα“相似、样式”的限定作用，并以“在……上”呈现与格所表达的关联，避免过度判定其精确语法关系。
- source_word: τοῦ θανάτου αὐτοῦ
  choice: 他死亡
  rationale: 直接保留属格关系，所指为基督的死。
- source_word: ἀλλὰ καὶ
  choice: 也必
  rationale: 结合上下文表达由前项加强推进到后项的确定性；现代汉语不必机械译出转折词“但”。
- source_word: τῆς ἀναστάσεως
  choice: 与他复活相似的样式上
  rationale: 原文后半省略了前半的“样式”及相关结构；译文补出以形成清楚的汉语平行句，并依前句自然补明“他”。
- source_word: ἐσόμεθα
  choice: 必……与他联合
  rationale: 原文直译为“我们也将是复活的”，谓语内容承接前半的σύμφυτοι。汉语补出“与他联合”，使省略关系清楚，同时用脚注保留原文简约表达。
theological_decisions:
- issue: 如何表达人与基督之死和复活的联合
  choice: 译作“在与他死亡相似的样式上与他联合……在与他复活相似的样式上与他联合”
  alternative: 译作“与他的死一同生长……也与他的复活一同生长”，或直接译作“同死同复活”
  rationale: 译文既保留真实联合或共同参与的意味，也保留“相似的样式”这一限定，不将其预先解释为单纯象征、特定圣礼机制或无差别的同一。
- issue: 后半句是否明确重复“与他联合”和“相似的样式”
  choice: 正文补出省略成分，并以脚注说明希腊原文
  alternative: 正文按形式直译为“也必是复活的”
  rationale: 原文平行关系要求从前半承接谓语概念；补出后更符合现代汉语，但脚注保留原文的省略和潜在张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“确实……也必……”体现γάρ及后半句的强调和推论关系；避免使用带有特定宗派色彩的术语。
