id: ROM.6.13
reference: Romans 6:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: μηδὲ παριστάνετε τὰ μέλη ὑμῶν ὅπλα ἀδικίας τῇ ἁμαρτίᾳ, ἀλλὰ παραστήσατε ἑαυτοὺς τῷ θεῷ ⸀ὡσεὶ ἐκ νεκρῶν ζῶντας καὶ τὰ μέλη ὑμῶν ὅπλα δικαιοσύνης τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/013.yaml
  text: And do not present your members to sin as weapons of unrighteousness[a], but present yourselves to God as alive from the dead[b], and your members to God as weapons of righteousness.
translation:
  language: zh_hans
  text: 也不要把你们的肢体交给罪，作不义的兵器[a]；倒要把自己交给神，像从死人中活过来的人，并把你们的肢体交给神，作义的兵器[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “兵器”或译“器具”。
    reason: lexical_alternative
  - marker: b
    text: “义”或译“公正”。
    reason: lexical_alternative
lexical_decisions:
- source_word: παριστάνετε / παραστήσατε
  choice: 交给
  rationale: 这里指把自己或身体置于某一方支配、使用之下。“交给”在现代汉语中自然，并保留两处动词的重复和鲜明对照。
- source_word: μέλη
  choice: 肢体
  rationale: 指身体各部分，也保留保罗书信中这一用语的整体性和伦理含义；比“成员”准确，比“身体部位”庄重。
- source_word: ὅπλα
  choice: 兵器
  rationale: 该词可指兵器或器具；“兵器”保留上下文中争战和效忠的鲜明意象，其他可能意义列于脚注。
- source_word: ἀδικίας
  choice: 不义
  rationale: 与后文“义”形成紧密对称，兼具道德和神学语域，同时不把含义缩窄为社会层面的“不公正”。
- source_word: ἁμαρτίᾳ
  choice: 罪
  rationale: 直接对应希腊文，并容许读者从上下文听出保罗把罪人格化为支配力量的表达。
- source_word: ὡσεὶ ἐκ νεκρῶν ζῶντας
  choice: 像从死人中活过来的人
  rationale: “像”保留ὡσεὶ的比较语气，“从死人中活过来”保留死亡与生命之间带有复活意味的对照，而不进一步解释为特定教义公式。
- source_word: δικαιοσύνης
  choice: 义
  rationale: 在保罗语境中，“义”自然、凝练，并与“不义”对应；“公正”这一可能译法保留在脚注。
theological_decisions:
- issue: 罪与神作为相对的归属和支配对象
  choice: 用“交给罪／交给神”直接表达两个与格关系
  alternative: 为罪效力／为神效力
  rationale: 希腊文已含有归属、支配和效忠意味；不增添“效力”等解释性措辞，可保留原文的简洁与神学张力。
- issue: ὡσεὶ所表达的比较语气与复活意象
  choice: 像从死人中活过来的人
  alternative: 作为已经从死里复活的人
  rationale: “像”保留原文比较语气，避免把本节单独明确化为对信徒身体复活时间点的断言，同时仍保留从死到生的复活图景。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“肢体”保留保罗惯用的身体意象；用“交给”避免“呈献”在现代汉语中过于生硬。分号突出禁止与命令之间的转折，重复“交给神”则保留原文结构和强调。脚注标记按其实际所注释的词分别置于“兵器”和末句“义的兵器”之后。
