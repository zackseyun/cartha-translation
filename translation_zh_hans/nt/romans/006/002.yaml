id: ROM.6.2
reference: Romans 6:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: μὴ γένοιτο· οἵτινες ἀπεθάνομεν τῇ ἁμαρτίᾳ, πῶς ἔτι ζήσομεν ἐν αὐτῇ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/002.yaml
  text: Absolutely not! We who died to sin—how can we still live in it?[a]
translation:
  language: zh_hans
  text: 绝对不可！我们既然向罪死了，怎么还能活在罪中呢？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “绝对不可”也可译作“断乎不可”或“千万不可”；原文是表示强烈否定和斥拒的惯用语。
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ γένοιτο
  choice: 绝对不可！
  rationale: 这是保罗强烈否定并斥退前述推论的惯用表达。“绝对不可”在现代汉语中自然有力，同时保留祈愿式原文所传达的坚决拒绝。
- source_word: οἵτινες
  choice: 我们既然
  rationale: 该关系代词带有说明理由或性质的意味，指向保罗及其读者。“我们既然”既保留第一人称复数，也使后面的反问在汉语中衔接自然。
- source_word: ἀπεθάνομεν
  choice: 死了
  rationale: 简单过去时态指向已经发生的决定性事件；不添加其具体机制，以保留上下文展开这一隐喻的空间。
- source_word: τῇ ἁμαρτίᾳ
  choice: 向罪
  rationale: 与“死”连用的与格表示相对于罪而死。“向罪死了”保留原文的关系性表达和神学隐喻，不将其弱化为单纯的道德改善。
- source_word: πῶς ἔτι
  choice: 怎么还能
  rationale: “怎么”体现反问和不可置信，“还能”准确传达ἔτι所含的继续之意。
- source_word: ζήσομεν
  choice: 活
  rationale: 未来直陈式在此用于修辞性反问；现代汉语以“怎么还能活”自然表达其语气，无须机械标示将来。
- source_word: ἐν αὐτῇ
  choice: 在罪中
  rationale: 代词回指“罪”，将罪呈现为人所处的领域。汉语若直译为“在它里面”指代生硬，因此明说“罪”，同时保留空间性隐喻。
theological_decisions:
- issue: “向罪死了”是指道德改善，还是与罪的权势发生决定性断裂
  choice: 保留“向罪死了”这一直接隐喻，不加解释
  alternative: 译作“已经不再受罪支配”或“已经离弃罪”
  rationale: 原文直接陈述“向罪死了”，而没有在本节说明这一死亡的全部机制或含义。保留隐喻可维持保罗论述中的神学张力，避免提前限定为某一种成圣解释。
- issue: ἐν αὐτῇ是否应解释为偶尔犯罪还是持续生活在罪的领域中
  choice: 译作“活在罪中”
  alternative: 译作“继续犯罪”
  rationale: 原文使用“活在其中”的领域性表达，而非直接使用“犯罪”一词。“活在罪中”保留罪作为领域或权势的意象，也不额外断定经文是在谈犯罪频率。
translation_notes:
  register: 采用庄重而现代的标准普通话。“绝对不可”力度强且易懂；“向罪死了”和“活在罪中”保留原文彼此呼应的死亡—生命及领域隐喻。主文本中的脚注标记[a]与脚注对应。
