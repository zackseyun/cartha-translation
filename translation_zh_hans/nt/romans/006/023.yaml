  text: τὰ γὰρ ὀψώνια τῆς ἁμαρτίας θάνατος, τὸ δὲ χάρισμα τοῦ θεοῦ ζωὴ αἰώνιος ἐν Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/023.yaml
  text: For the wages of sin is death[b][a], but the gift of God is eternal life in Messiah Jesus our Lord.
translation:
  language: zh_hans
  text: 因为罪的工价就是死；但上帝的恩赐[a]是在我们的主弥赛亚耶稣里的永生。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“白白赐下的礼物”。
    reason: lexical_alternative
  - marker: b
    text: “弥赛亚耶稣”也常译作“基督耶稣”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀψώνια
  choice: 工价
  rationale: 指付给人、由人赚得的报酬；“工价”在现代汉语中清楚保留了“赚取所得”的比喻，并与后文白白赐下的“恩赐”形成鲜明对照。
- source_word: τῆς ἁμαρτίας
  choice: 罪的
  rationale: 以简洁的属格结构保留原文关系，可理解为罪所付的工价或属于罪的工价，不把它窄化为单一解释。
- source_word: θάνατος
  choice: 死
  rationale: 直接对应原文的谓语名词，保留其字面意义与神学分量，不在正文中限定死亡的具体层面。
- source_word: χάρισμα
  choice: 恩赐
  rationale: “恩赐”既表达礼物的性质，也体现该词与恩典相关的语义，并与“工价”构成所得与获赐的对比。
- source_word: ζωὴ αἰώνιος
  choice: 永生
  rationale: 这是自然、通行而准确的现代汉语表达，兼顾生命的持久性及其新约语境中的神学内涵。
- source_word: ἐν
  choice: 在……里面
  rationale: 保留该介词表示范围、领域或联合的开放性，不将其直接改释为单纯的“借着”或工具关系。
- source_word: Χριστῷ
  choice: 弥赛亚
  rationale: 在“弥赛亚耶稣”中按称号处理，传达 Χριστός 的原有称号意义；脚注提供汉语基督教传统中的常见译名。
- source_word: κυρίῳ
  choice: 主
  rationale: “主”准确保留早期基督徒认信用语及该词的神学分量。
theological_decisions:
- issue: ἐν Χριστῷ Ἰησοῦ 的语义力量
  choice: 译作“在……弥赛亚耶稣里面”
  alternative: 译作“借着……弥赛亚耶稣”
  rationale: 原文更自然地表达生命所在的领域或人与弥赛亚的联合，而不只是工具或原因；保留“在……里面”可避免消解保罗措辞中的神学张力。
- issue: Χριστός 作为称号的呈现
  choice: 正文采用“弥赛亚”
  alternative: 采用传统音译“基督”
  rationale: “弥赛亚”清楚呈现“受膏者”称号的功能，同时以脚注保留读者熟悉的传统译法。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“工价—恩赐”保留原文核心对比；“在……里面”的结构略带保罗书信特有的凝练感，但仍可自然理解。正文中的脚注标记[a]、[b]均已对应列出。
