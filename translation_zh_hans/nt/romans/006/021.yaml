id: ROM.6.21
reference: Romans 6:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: τίνα οὖν καρπὸν εἴχετε τότε ἐφ’ οἷς νῦν ἐπαισχύνεσθε; τὸ γὰρ τέλος ἐκείνων θάνατος·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/021.yaml
  text: So what fruit did you have then from the things of which you are now ashamed? For the end of those things is death[a].
translation:
  language: zh_hans
  text: 那么，你们那时从那些如今引以为耻的事中，得了什么果子呢？那些事的结局就是死[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “结局”也可译作“结果”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τίνα
  choice: 什么
  rationale: 引出反问，追问从前生活所产生的结果；“什么”自然简洁，并保留反问力度。
- source_word: καρπὸν
  choice: 果子
  rationale: 保留保罗以“果子”表示行为所产生结果的比喻，不将其解释性地弱化为“益处”或“结果”。
- source_word: εἴχετε
  choice: 得了
  rationale: 结合“从……中”和“果子”的汉语搭配，表达他们从前持续生活所产生或获得的结果；“那时”已清楚标明过去时态。
- source_word: τότε
  choice: 那时
  rationale: 与后文“如今”形成鲜明而自然的时间对照。
- source_word: ἐφ’ οἷς
  choice: 从那些……的事中
  rationale: 按上下文补出“事”，表达这些从前行为是所结之果的来源，同时保留关系结构。
- source_word: νῦν
  choice: 如今
  rationale: 与“那时”形成明确对照，语体庄重而现代。
- source_word: ἐπαισχύνεσθε
  choice: 引以为耻
  rationale: 准确表达对从前行为的道德羞耻感，力度强于仅仅“难为情”。
- source_word: τέλος
  choice: 结局
  rationale: 兼顾终点与最终结果两层含义；在现代汉语中比单用“终点”更适合描述行为所导向的死亡。
- source_word: ἐκείνων
  choice: 那些事
  rationale: 补出中心语“事”，清楚回指前句中如今引以为耻的行为。
- source_word: θάνατος
  choice: 死
  rationale: 采用直接、庄重的常用表达，保留保罗警告的神学分量。
theological_decisions:
- issue: τέλος应译作强调终点的“终结”，还是强调结果的“结局”
  choice: 结局
  alternative: 终结；结果
  rationale: “结局”在汉语中既可指最终归宿，也可指所导致的结果，较好保留τέλος在本句中的双重意味，不将其窄化为单纯因果结果。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“果子”保留原文比喻；“那时／如今”凸显前后生命状态的对照。
