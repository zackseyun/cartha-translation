  text: ἁμαρτία γὰρ ὑμῶν οὐ κυριεύσει, οὐ γάρ ἐστε ὑπὸ νόμον ἀλλὰ ὑπὸ χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/014.yaml
  text: For sin will not rule over you[b][a], because you are not under the law but under grace.
translation:
  language: zh_hans
  text: 罪必不辖制你们[a]，因为你们不在律法之下[b]，而在恩典之下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“作你们的主。”
    reason: lexical_alternative
  - marker: b
    text: “在律法之下”意为处于律法的权柄或管辖之下。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁμαρτία
  choice: 罪
  rationale: 采用保罗书信中该词的标准译法。这里的“罪”被拟人化为掌权者，但希腊文并未要求用额外标记把它处理成专名。
- source_word: κυριεύσει
  choice: 必不能辖制
  rationale: 该动词表示行使主权或统治。“辖制”自然地保留了罪如主人般掌权的意象；“必不能”体现将来时在此所表达的确定性。
- source_word: ὑπὸ νόμον
  choice: 在律法之下
  rationale: 直译并保留保罗的表达，意指处于律法的权柄或管辖之下。虽然 νόμον 没有冠词，上下文仍适合译作“律法”，无需在正文中进一步限定。
- source_word: ὑπὸ χάριν
  choice: 在恩典之下
  rationale: 与“在律法之下”形成平行对照，也保留恩典作为一种管辖领域或权势范围的隐喻。
- source_word: γὰρ
  choice: 因为；隐含的解释关系
  rationale: 句首 γὰρ 译为“因为”，承接前文并说明理由；第二个 γὰρ 的解释作用借分号后紧接的原因陈述自然表达，避免中文重复两次“因为”而显得生硬。
theological_decisions:
- issue: 是否强化“罪”的人格化或将其视为专名
  choice: 保留普通名词“罪”，用“辖制”呈现其掌权者形象。
  alternative: 译作“罪必不能作你们的主”或以特殊形式突出“罪”。
  rationale: 希腊文确实把罪描写成统治力量，却没有把它明确变成专名；当前译法既保留拟人意象，也不添加额外的教义解释。
- issue: 如何表达律法与恩典的对照
  choice: 平行译作“在律法之下”与“在恩典之下”。
  alternative: 解释性地译作“受律法管辖”与“受恩典管辖”。
  rationale: 平行直译保留原文简洁而富张力的领域隐喻，不在正文中预先界定两者的全部神学含义。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“辖制”虽略具书面色彩，但在此清楚表达掌权和控制，并与经文的神学语境相称。分号呈现两个解释性分句之间的紧密关系。
