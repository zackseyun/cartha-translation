source:
  edition: SBLGNT
  text: ἀνθρώπινον λέγω διὰ τὴν ἀσθένειαν τῆς σαρκὸς ὑμῶν· ὥσπερ γὰρ παρεστήσατε τὰ μέλη ὑμῶν δοῦλα τῇ ἀκαθαρσίᾳ καὶ τῇ ἀνομίᾳ εἰς τὴν ἀνομίαν, οὕτως νῦν παραστήσατε τὰ μέλη ὑμῶν δοῦλα τῇ δικαιοσύνῃ εἰς ἁγιασμόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/019.yaml
  text: I am speaking in human terms because of the weakness of your flesh[a]. For just as you presented your members as slaves to impurity and to lawlessness, leading to lawlessness, so now present your members as slaves to righteousness[b], leading to sanctification.
translation:
  language: zh_hans
  text: 考虑到你们肉体[a]的软弱，我用人通常的说法来讲。你们从前怎样把自己的肢体献上，作不洁和不法的奴隶，导致不法；现在也要照样把自己的肢体献上，作义[b]的奴隶，导致成圣。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “肉体”在这里也可较解释性地理解为“罪性”，但希腊文的表达范围更广。
    reason: lexical_alternative
  - marker: b
    text: “义”也可译作“公义”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθρώπινον λέγω
  choice: 用人的说法来说
  rationale: 表达保罗为迁就一般人的理解而采用人间常用说法，既自然，也不过度具体化为“比喻”。
- source_word: ἀσθένειαν
  choice: 软弱
  rationale: 保留原词宽泛的含义，可涵盖人的脆弱与能力有限，而不局限于身体或道德层面。
- source_word: σάρξ
  choice: 肉体
  rationale: 保留保罗用语的广度及其可能包含的身体性与堕落处境，不直接窄化为“罪性”。
- source_word: παρεστήσατε / παραστήσατε
  choice: 献上 / 献上
  rationale: 以相同译词保留过去行为与当前劝勉之间的动词呼应；“献上”也符合本段将自身置于某种支配之下的语境。
- source_word: μέλη
  choice: 肢体
  rationale: 这是现代中文圣经语境中自然且庄重的表达，既可指身体各部分，也可涵盖借身体施行的能力。
- source_word: δοῦλα
  choice: 奴隶
  rationale: 本章以奴役关系表现支配和归属，“奴隶”比“仆人”更充分保留其强烈含义。
- source_word: ἀκαθαρσίᾳ
  choice: 不洁
  rationale: 简洁保留道德污秽的含义，并与“不法”形成并列。
- source_word: ἀνομίᾳ / ἀνομίαν
  choice: 不法 / 不法
  rationale: 保留原文的词语重复和从不法走向不法的递进修辞。
- source_word: εἰς τὴν ἀνομίαν
  choice: 以致陷入不法
  rationale: 将 εἰς 的方向或结果含义译为自然中文，同时不把因果关系表述得过强。
- source_word: δικαιοσύνῃ
  choice: 义
  rationale: 在保罗语境中，“义”是简洁而通行的译法，并与“不洁、不法”构成伦理对照；“公义”也是可能译法。
- source_word: ἁγιασμόν
  choice: 成圣
  rationale: 体现由献身于义而朝向圣洁状态或过程的含义，比静态的“圣洁”更能呈现 εἰς 所表达的趋向或结果。
theological_decisions:
- issue: “肉体的软弱”中 σάρξ 的理解
  choice: 肉体
  alternative: 罪性
  rationale: 这里可涉及人在堕落处境中的软弱，但希腊文表达比“罪性”更宽；正文保留“肉体”，避免预先消解其身体性和神学张力。
- issue: 保罗语境中 δικαιοσύνη 的翻译
  choice: 义
  alternative: 公义
  rationale: 本节主要以义对照不洁和不法，“义”能自然涵盖正直、合宜的状态；脚注保留“公义”这一可能译法。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。保留“献上”“奴隶”“肢体”等贯穿本段论证的核心意象，并以“以致”呈现两处 εἰς 的平行结构。
