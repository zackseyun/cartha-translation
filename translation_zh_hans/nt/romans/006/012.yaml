id: ROM.6.12
reference: Romans 6:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Μὴ οὖν βασιλευέτω ἡ ἁμαρτία ἐν τῷ θνητῷ ὑμῶν σώματι εἰς τὸ ⸀ὑπακούειν ταῖς ἐπιθυμίαις αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/012.yaml
  text: Therefore[a], do not let sin reign in your mortal body, so that you obey its desires.
translation:
  language: zh_hans
  text: 所以，不要让罪在你们必死的身体中作王，以致你们顺从身体的欲望。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或可理解为“顺从罪的欲望”。
    reason: 原文代词在语法上最自然地指“身体”，但语境上也有人将这些欲望理解为属于罪或受罪支配。
lexical_decisions:
- source_word: οὖν
  choice: 所以
  rationale: 表示从上文论证得出的推论；“所以”自然、清楚地保留逻辑承接。
- source_word: βασιλευέτω
  choice: 不要让……作王
  rationale: 保留否定命令的语气和“作王”的王权隐喻，也体现罪被人格化为辖制人的权势。
- source_word: ἁμαρτία
  choice: 罪
  rationale: 采用直接对应词，并借“作王”保留保罗对罪的拟人化表达，不将其缩减为个别犯罪行为。
- source_word: θνητῷ
  choice: 必死的
  rationale: 准确表达身体会死亡、受死亡限制的现状；在现代汉语中比音译式或抽象表达更自然。
- source_word: σώματι
  choice: 身体
  rationale: 直接保留原文所指，不擅自扩展为“肉体”或“肉身”，以免引入额外神学含义。
- source_word: εἰς τὸ ὑπακούειν
  choice: 以致你们顺从
  rationale: 此结构可表达目的或结果；“以致”保留二者之间一定的张力，同时符合本句警告罪掌权所导致后果的语境。
- source_word: ἐπιθυμίαις
  choice: 欲望
  rationale: 涵盖广义的强烈欲求，不把意思局限于性欲；结合上下文仍具有负面的道德色彩。
- source_word: αὐτοῦ
  choice: 身体的
  rationale: 该代词为阳性或中性单数属格，在语法上最自然地回指中性单数的“身体”；汉语明确重复“身体”，避免“它的”指代不清。
theological_decisions:
- issue: 罪是行为概念，还是被描写为掌权的势力
  choice: 保留“罪……作王”的拟人化王权意象。
  alternative: 意译为“不让犯罪行为控制你们”。
  rationale: 原文以“作王”描写罪，呈现其辖制人的权势；直保留这一意象可避免把保罗的表达缩减为单纯的行为劝诫。
- issue: αὐτοῦ所指为何
  choice: 正文理解为“身体的欲望”。
  alternative: 理解为“罪的欲望”。
  rationale: 从希腊语的性、数配合看，αὐτοῦ最自然地回指中性单数的σώματι，而不是阴性单数的ἁμαρτία；但按语境将欲望与罪的辖制相联也有解释传统，故列入脚注。
- issue: εἰς τὸ ὑπακούειν表达目的还是结果
  choice: 译作“以致你们顺从”，侧重结果而不完全排除目的意味。
  alternative: 译作“为要叫你们顺从”或“好让你们顺从”。
  rationale: 该结构在此可有目的或结果色彩；“以致”更自然地呈现罪在身体中作王所导致的顺从，同时不作过度教义化判定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“必死的身体”保留现今身体受死亡限制的含义；“作王”保持保罗鲜明的王权隐喻。脚注标记置于相关短语之后，便于读者准确对应。
