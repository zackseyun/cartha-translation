id: ROM.6.4
reference: Romans 6:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: συνετάφημεν οὖν αὐτῷ διὰ τοῦ βαπτίσματος εἰς τὸν θάνατον, ἵνα ὥσπερ ἠγέρθη Χριστὸς ἐκ νεκρῶν διὰ τῆς δόξης τοῦ πατρός, οὕτως καὶ ἡμεῖς ἐν καινότητι ζωῆς περιπατήσωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/004.yaml
  text: Therefore we were buried with him through baptism into death[a], so that just as Messiah was raised from the dead through the glory of the Father, so also we might walk in newness of life.
translation:
  language: zh_hans
  text: 所以，我们借着洗礼归入死，与他一同埋葬了；为的是，正如弥赛亚[a]借着父的荣耀从死人中复活，我们也照样在生命的新样式中行事为人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：基督。
    reason: Χριστός既可按其称号意义译为“弥赛亚”，也可采用已成为传统名称的音意译“基督”。
lexical_decisions:
- source_word: συνετάφημεν
  choice: 与他一同埋葬了
  rationale: 以“一同”表达 συν- 的共同含义，并以“了”自然体现不定过去时所指的既成行动；上下文中的“他”保留与基督联合的关系。
- source_word: οὖν
  choice: 所以
  rationale: 自然表达本节承接上文所得出的推论。
- source_word: διὰ τοῦ βαπτίσματος
  choice: 借着洗礼
  rationale: 表达 διά 加属格的媒介或工具含义，同时不额外规定洗礼与联合于基督之间的教义机制。
- source_word: εἰς τὸν θάνατον
  choice: 归入死
  rationale: “归入”保留 εἰς 的方向与进入关系；“死”在现代中文圣经语域中简洁自然，也避免仅译成与死亡相近或相关。
- source_word: ἵνα
  choice: 为要使
  rationale: 明确保留目的意味，并顺畅引出后面的虚拟语气内容。
- source_word: Χριστὸς
  choice: 弥赛亚
  rationale: 按此处的称号含义译出 Χριστός，同时用脚注提供传统译名“基督”。
- source_word: ἐκ νεκρῶν
  choice: 从死人中
  rationale: 准确表达从死者群体或死亡领域中复起的含义，并保留原文复数表达。
- source_word: διὰ τῆς δόξης τοῦ πατρός
  choice: 借着父的荣耀
  rationale: 保留 διά 的媒介或工具意味及 δόξα 的“荣耀”这一宽广概念，不将其缩减为单指“能力”。
- source_word: ἐν καινότητι ζωῆς
  choice: 在生命的新样中
  rationale: 保留原文抽象的“新样／崭新状态”，而不完全释义为“新生活”。
- source_word: περιπατήσωμεν
  choice: 行事为人
  rationale: 这是现代中文中可理解的生命行为隐喻，既反映“行走”的比喻义，又避免生硬直译。
theological_decisions:
- issue: διὰ τοῦ βαπτίσματος 是否应译得明确支持某一种圣礼观
  choice: 借着洗礼
  alternative: 因受洗而／藉洗礼本身
  rationale: 译文保留原文的工具或媒介关系，却不自行判定洗礼如何使人联合于弥赛亚。
- issue: διὰ τῆς δόξης τοῦ πατρός 中“荣耀”的作用
  choice: 借着父的荣耀
  alternative: 靠着父的大能
  rationale: 保留原文“荣耀”的完整神学张力及 διά 的关系，不把“荣耀”解释性缩窄为“大能”。
- issue: ἠγέρθη 的神圣被动含义
  choice: 从死人中复活
  alternative: 被父从死人中复活／父使他从死人中复活
  rationale: 中文直接使用被动式“被复活”较生硬，而明确补出施事者又超出该分句的明说内容；现译自然表达复活事实，同时不否认被动语态暗示的施事者。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“行事为人”保留保罗“行走”的生活隐喻；“在生命的新样中”较为贴近原文，同时避免过度古雅。
