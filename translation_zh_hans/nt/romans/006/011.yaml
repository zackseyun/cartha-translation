  text: οὕτως καὶ ὑμεῖς λογίζεσθε ἑαυτοὺς ⸂εἶναι νεκροὺς μὲν⸃ τῇ ἁμαρτίᾳ ζῶντας δὲ τῷ θεῷ ἐν Χριστῷ ⸀Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/011.yaml
  text: So also you[c][b][a], consider yourselves to be dead to sin but alive to God in Messiah Jesus.
translation:
  language: zh_hans
  text: 同样，你们也当认定[a]自己向罪是死的，却在弥赛亚耶稣里[c]向神活着[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “认定”也可译作“看作”或“算作”。
    reason: lexical_alternative
  - marker: b
    text: “活着”也可译作“是活的”。
    reason: lexical_alternative
  - marker: c
    text: “弥赛亚”在希腊文中是Χριστός，传统上译作“基督”，意思是“受膏者”。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ
  choice: 同样……也
  rationale: 承接上文的论证，既表达“照样、如此”的推论关系，又符合现代汉语习惯。
- source_word: λογίζεσθε
  choice: 认定
  rationale: 表达把某事视为真实、据此看待自己的含义，并保留该动词带有判断和核算意味的语气。
- source_word: ἑαυτοὺς εἶναι
  choice: 自己……是
  rationale: 明确保留反身代词及希腊文不定式所表达的存在状态。
- source_word: νεκροὺς μὲν τῇ ἁμαρτίᾳ
  choice: 向罪是死的
  rationale: 用“向……”表达与格所标示的关系；μέν与后面的δέ构成对照，由“却”自然体现。
- source_word: ζῶντας δὲ τῷ θεῷ
  choice: 向神却是活的
  rationale: 与“向罪是死的”形成简洁而鲜明的对应，同时保留向神而活的关系。
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: 在弥赛亚耶稣里
  rationale: 保留ἐν的空间／领域式表达，不改写为“借着”或“因为”；将Χριστός按其称号含义译为“弥赛亚”。
theological_decisions:
- issue: ἐν Χριστῷ Ἰησοῦ所表达的关系
  choice: 在弥赛亚耶稣里
  alternative: 借着弥赛亚耶稣；因为弥赛亚耶稣
  rationale: 直译“在……里”，保留保罗语言中联合、领域或归属等可能内涵，不把关系限定为工具或原因。
- issue: Χριστός在本节是称号还是近似专名
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处保留“受膏者”称号的语义，同时以脚注说明传统译法。
- issue: 向罪死、向神活的陈述性质
  choice: 认定自己……是
  alternative: 把自己想象成……；努力变得……
  rationale: 经文要求读者据实看待自己，并非把状态解释成主观想象，也不将其改写为逐渐达到的道德目标。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“向罪……向神……”保留原文紧密的对偶；末尾“在弥赛亚耶稣里”尽量维持原文位置和神学张力。所有脚注标记均已置于正文相应位置。
