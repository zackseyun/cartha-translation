id: ROM.6.6
reference: Romans 6:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: τοῦτο γινώσκοντες ὅτι ὁ παλαιὸς ἡμῶν ἄνθρωπος συνεσταυρώθη, ἵνα καταργηθῇ τὸ σῶμα τῆς ἁμαρτίας, τοῦ μηκέτι δουλεύειν ἡμᾶς τῇ ἁμαρτίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/006.yaml
  text: knowing this[a], that our old self was crucified with him, so that the body of sin might be rendered powerless, so that we should no longer be enslaved to sin[c][b],
translation:
  language: zh_hans
  text: 我们知道这一点：我们的旧人[a]已经与他同钉十字架，为要使罪的身体失去效力[b]，使我们不再作罪的奴隶[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从前的我们”或“我们的旧我”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“被废除”或“归于无用”。
    reason: lexical_alternative
  - marker: c
    text: 或译：“使我们不再服侍罪”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο γινώσκοντες
  choice: 我们知道这一点
  rationale: 保留分词与上文的衔接作用，并明确译出 τοῦτο；中文用完整分句比直译为“知道着这一点”自然。
- source_word: ὁ παλαιὸς ἡμῶν ἄνθρωπος
  choice: 我们的旧人
  rationale: “旧人”保留保罗表达中的人之意象及其单数整体性，也能指信徒从前的生命状态，而不把 ἄνθρωπος 缩窄为男性。
- source_word: συνεσταυρώθη
  choice: 已经与他同钉十字架
  rationale: “与他同钉”明确表达 συν- 所含共同经历的意义；“他”依上下文指基督，但原句没有在本节重复其名，故不在正文补明。
- source_word: καταργηθῇ
  choice: 失去效力
  rationale: 此处着重于罪之身体的作用被解除或失效；该译法避免擅自断定其本体被彻底消灭，同时以脚注保留较强的词义可能。
- source_word: τὸ σῶμα τῆς ἁμαρτίας
  choice: 罪的身体
  rationale: 保留原文紧凑且可能有多种理解的属格结构，不预先解释为“犯罪的身体”或“受罪支配的身体”。
- source_word: τοῦ μηκέτι δουλεύειν ἡμᾶς τῇ ἁμαρτίᾳ
  choice: 使我们不再作罪的奴隶
  rationale: δουλεύω 带有为奴、受主人辖制的意象；“作罪的奴隶”既保留这一力度，又符合现代汉语表达。
theological_decisions:
- issue: “旧人”（ὁ παλαιὸς ἡμῶν ἄνθρωπος）的人论含义
  choice: 我们的旧人
  alternative: 从前的我们／我们的旧我
  rationale: 采用“旧人”以保存原文把从前的人格或生存状态人格化的表达，不把它解释成男性个体，也不完全抽象化为“旧本性”。
- issue: καταργηθῇ 对“罪的身体”所表达的作用
  choice: 失去效力
  alternative: 被废除／归于无用
  rationale: 正文表达其支配作用被解除，而不加入原文未明确说明的形而上毁灭；脚注保留“废除”等较强译法。
- issue: “罪的身体”（τὸ σῶμα τῆς ἁμαρτίας）的属格关系
  choice: 罪的身体
  alternative: 犯罪的身体／受罪支配的身体
  rationale: 原文可以表达身体与罪的紧密关系，但关系的具体性质并未完全展开；直保属格可避免把神学张力单向解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“同钉十字架”“旧人”“罪的身体”等保留保罗原文的核心意象；以冒号承接“知道这一点”所引出的内容。
