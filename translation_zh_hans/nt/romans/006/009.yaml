id: ROM.6.9
reference: Romans 6:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἰδότες ὅτι Χριστὸς ἐγερθεὶς ἐκ νεκρῶν οὐκέτι ἀποθνῄσκει, θάνατος αὐτοῦ οὐκέτι κυριεύει·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/009.yaml
  text: knowing that the Messiah[a], having been raised from the dead, no longer dies; death no longer rules over him.
translation:
  language: zh_hans
  text: 我们知道，弥赛亚[a]既已从死人中复活，就不再死；死也不再辖制他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“基督”。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδότες
  choice: 我们知道
  rationale: 该完成时主动分词引出共同认知，并为本句断言提供依据；汉语用“我们知道”自然承接上下文，同时不硬性限定为“因为”或“既然”。
- source_word: Χριστὸς
  choice: 弥赛亚
  rationale: 此处保留 Χριστός 作为称号的含义；“弥赛亚”是现代汉语中明确而通行的对应表达。
- source_word: ἐγερθεὶς
  choice: 既已……复活
  rationale: 不定过去时被动分词表示先于“不再死”的已成事件；“既已……复活”体现其前时性。汉语“复活”在此自然表达蒙使从死者中起来的被动意义。
- source_word: ἐκ νεκρῶν
  choice: 从死人中
  rationale: 直译该短语，保留“从死者当中”的群体意象，同时符合现代汉语圣经语域。
- source_word: οὐκέτι
  choice: 不再
  rationale: 两处均译作“不再”，清楚保留状态已终止且不复出现的意味。
- source_word: ἀποθνῄσκει
  choice: 死
  rationale: 现在时在此陈述持续有效的事实；汉语“不再死”简洁自然。
- source_word: θάνατος
  choice: 死
  rationale: 保留抽象名词的拟人化作用，使“死”成为施行辖制的主语。
- source_word: κυριεύει
  choice: 辖制
  rationale: 表达掌权、作主和控制之意；“辖制”庄重且为现代读者可懂，并保留死亡被拟人化为统治力量的修辞。
theological_decisions:
- issue: 保罗书信中 Χριστός 的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 本处可理解为具有实义的称号，因此正文译出“受膏者／弥赛亚”的称号含义；同时以脚注保留汉语教会传统中音译兼称号化的“基督”，不把两者间的语用判断绝对化。
- issue: ἐγερθεὶς 的被动意义
  choice: 既已从死人中复活
  alternative: 既已从死人中被复活
  rationale: 希腊文形态为被动，可隐含上帝使其复活；但现代汉语通常说“从死人中复活”，若机械加入“被”会显得生硬。此译保留事件的神学开放性，不在正文中补出未明说的施事者。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“我们知道”使分词结构在汉语中完整可读；分号保留原文两项紧密相连的宣告。
