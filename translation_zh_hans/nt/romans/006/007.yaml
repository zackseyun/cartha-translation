  text: ὁ γὰρ ἀποθανὼν δεδικαίωται ἀπὸ τῆς ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/007.yaml
  text: For the one who has died has been acquitted from sin.
translation:
  language: zh_hans
  text: 因为死了的人已经脱离了罪[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“已经从罪中得以称义”；也可译：“已经从罪中获判无罪。”
    reason: δικαιόω 通常具有“称义／宣告为义”的司法性含义；但在本段罪之权势的语境中，本句也可理解为从罪中得释放。
lexical_decisions:
- source_word: ὁ ... ἀποθανὼν
  choice: 死了的人
  rationale: 冠词加不定过去时分词在此作名词使用，泛指“已经死去的那个人”；译为“死了的人”自然、简洁，也不额外限定性别。
- source_word: γὰρ
  choice: 因为
  rationale: γάρ承接上文并说明理由；现代汉语用“因为”可清楚表达这一解释关系。
- source_word: δεδικαίωται
  choice: 已经获判无罪
  rationale: 完成时被动语态表示已经作成且结果持续的判决。δικαιόω通常带有司法性的“判为义、宣告无罪”含义；“获判无罪”保留这一法律色彩，同时避免把本节直接化约为单纯的摆脱辖制。
- source_word: ἀπὸ τῆς ἁμαρτίας
  choice: 脱离了罪
  rationale: ἀπό表示分离。这里的“罪”在《罗马书》第6章中也呈现为支配人的力量；“脱离了罪”用自然汉语表达从罪的权利要求或辖制下分离，而不将含义限于罪责或权势中的一面。
theological_decisions:
- issue: 本节的 δικαιόω 应侧重司法性的“称义／判无罪”，还是上下文所强调的“脱离罪的辖制”。
  choice: 正文译作“已经获判无罪，脱离了罪”，保留司法判决与实际脱离两方面的张力。
  alternative: “已经从罪中得以称义”或“已经摆脱了罪”
  rationale: 保罗使用的是通常具有司法色彩的 δικαιόω，但本章上下文强调人借着死脱离罪的统治。正文以“获判无罪”对应动词的法律意味，以“脱离了罪”表达 ἀπό 的分离关系；脚注保留更形式对应及更侧重上下文效果的译法，避免只取其中一面。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“获判无罪”具有清楚的司法语感；随后用“脱离了罪”使整个短句符合汉语表达，并保留原文 ἀπό 所表示的分离。脚注标记已在正文中列出。
