  text: εἰ δὲ ἀπεθάνομεν σὺν Χριστῷ, πιστεύομεν ὅτι καὶ συζήσομεν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/008.yaml
  text: If we died with Messiah[a], we believe that we will also live with him.
translation:
  language: zh_hans
  text: 如果我们与弥赛亚[a]同死，我们相信，我们也将与他同活。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“基督”。希腊文为Χριστῷ（Christō）。
    reason: 词汇替代译法：正文突出其“弥赛亚”头衔含义，同时提供传统译名。
lexical_decisions:
- source_word: εἰ δὲ
  choice: 如果
  rationale: εἰ引出条件句；δέ在这里承接上文并推进论述。现代汉语用“如果”即可自然表达条件关系，句间承接由上下文体现，避免生硬增添“现在”。
- source_word: ἀπεθάνομεν
  choice: 我们……同死
  rationale: 不定过去时指向上文已论及的死亡；结合σὺν Χριστῷ译为“与弥赛亚同死”，既简洁又保留共同参与的含义。
- source_word: σὺν Χριστῷ
  choice: 与弥赛亚同
  rationale: σύν表示伴随或联合；Χριστός在此按头衔译为“弥赛亚”，并用脚注注明传统译法“基督”。
- source_word: πιστεύομεν
  choice: 我们相信
  rationale: 直译πιστεύομεν，保留保罗对共同信念的明确陈述，不弱化为推测。
- source_word: ὅτι
  choice: （由逗号引出相信的内容）
  rationale: 汉语通常不需为内容从句另加对应词；逗号自然引出“相信”的具体内容。
- source_word: καὶ συζήσομεν αὐτῷ
  choice: 也将与他一同活着
  rationale: καί译为“也”，未来时以“将”表达；συζάω与αὐτῷ共同表达“与他一同活着”，不额外限定为复活后的生命或现世的新生命。
theological_decisions:
- issue: Χριστῷ的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处Χριστός保有受膏者头衔的意义，因此正文译为“弥赛亚”；“基督”作为广为使用的传统译法列入脚注。
- issue: συζήσομεν αὐτῷ所指生命的性质
  choice: 也将与他一同活着
  alternative: 也将与他一同复活／分享他的复活生命
  rationale: 原文只明确陈述将来与他一同活着，并未在本句中进一步界定其时间范围或具体机制；译文保留这种广度，避免替保罗消解神学张力。
- issue: 条件句的力度
  choice: 如果我们……
  alternative: 既然我们……
  rationale: εἰ形式上是条件连接词。虽然语境可能带有以事实为前提的论证意味，正文仍保留条件形式，不直接改写为已然断言。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“同死”和“一同活着”形成清楚对应；正文避免使用过度教会化或解释性的措辞。脚注标记[a]已置于正文对应词之后。
