id: ROM.6.20
reference: Romans 6:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ὅτε γὰρ δοῦλοι ἦτε τῆς ἁμαρτίας, ἐλεύθεροι ἦτε τῇ δικαιοσύνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/020.yaml
  text: For when you were slaves of sin[b][a], you were free in regard to righteousness.
translation:
  language: zh_hans
  text: 因为你们作罪的奴隶时，对于义是自由的[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不受义约束。”
    reason: 原文与格可理解为关系、范围，也可在“自由”之后表达所不受约束的对象。
lexical_decisions:
- source_word: δοῦλοι
  choice: 奴隶
  rationale: 本段把罪与义人格化为彼此对立的主人；“奴隶”保留了受辖制和归属主人的强烈含义。
- source_word: ἁμαρτίας
  choice: 罪的
  rationale: 属格表达归属或辖制关系；“作罪的奴隶”自然地表明他们受罪支配。
- source_word: ἐλεύθεροι
  choice: 自由的
  rationale: 保留保罗刻意形成的尖锐反差：他们既作罪的奴隶，相对于义却是自由的。
- source_word: τῇ δικαιοσύνῃ
  choice: 对于义
  rationale: 将与格理解为关系或范围，既贴近原文，又不把“义”明确说成需要摆脱的压迫者。
- source_word: δικαιοσύνῃ
  choice: 义
  rationale: 在保罗书信的语境中，“义”简洁而庄重，并可涵盖正直、公义及与神旨意相符的状态。
- source_word: γὰρ
  choice: 因为
  rationale: 承接上文并说明理由，符合此处解释性的逻辑关系，也比孤立使用“原来”更直接。
theological_decisions:
- issue: 如何表达人与义之间的关系
  choice: 对于义是自由的
  alternative: 脱离了义／不受义约束／与义毫无关系
  rationale: 原文与格可表示关系或范围，也可能带有某种分离意味。正文保留“自由”这一反常而有张力的表达，同时避免把义直接描绘成压迫人的主人，或将含义解释成“毫无关系”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“作罪的奴隶”延续罗马书第6章两种奴役的比喻；“对于义是自由的”刻意保留原文的修辞反差和一定程度的语义张力。
