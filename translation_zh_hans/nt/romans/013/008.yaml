  text: Μηδενὶ μηδὲν ὀφείλετε, εἰ μὴ τὸ ⸂ἀλλήλους ἀγαπᾶν⸃· ὁ γὰρ ἀγαπῶν τὸν ἕτερον νόμον πεπλήρωκεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/008.yaml
  text: Owe no one anything[a], except to love one another; for the one who loves another has fulfilled the law.
translation:
  language: zh_hans
  text: 除了彼此相爱以外，不要欠任何人任何东西；因为爱别人的人，已经成全了律法。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μηδενὶ μηδὲν ὀφείλετε
  choice: 你们不要欠任何人任何东西
  rationale: 保留原文“对任何人，任何东西都不要欠”的全面表达，也维持“亏欠／负有义务”的语义张力，不把经文扩展为对借贷问题的解释。
- source_word: εἰ μὴ
  choice: 只要
  rationale: 在否定命令之后自然表达唯一的例外，即彼此相爱这一持续的义务；现代汉语中比生硬的“除非”更贴合此句结构。
- source_word: τὸ ἀλλήλους ἀγαπᾶν
  choice: 彼此相爱
  rationale: 准确表达相互性的 ἀλλήλους，并以自然简洁的汉语呈现名词化不定式所指的义务。
- source_word: ὁ ἀγαπῶν τὸν ἕτερον
  choice: 爱别人的
  rationale: τὸν ἕτερον 直指“另一个人／别人”，不擅自换成后文语境中的“邻舍”；“爱别人的”也保留概括性的单数参与者。
- source_word: νόμον
  choice: 律法
  rationale: 在保罗书信语境中，“律法”是清楚且惯用的译法，指向已知的律法要求。
- source_word: πεπλήρωκεν
  choice: 已经成全了
  rationale: “成全”保留 πληρόω 在律法语境中的履行、使之达到圆满的含义；“已经”体现完成时所表达的既成结果。
theological_decisions:
- issue: 保罗禁止欠债之语的范围
  choice: 直译为不要欠任何人任何东西，并保留彼此相爱作为唯一例外。
  alternative: 解释为绝对禁止一切借贷，或仅视为道德义务的比喻。
  rationale: 原文本身使用“欠”的语言，却没有处理所有借贷情境；译文不替经文解决更广泛的伦理争议。
- issue: “成全律法”的含义
  choice: 保留“成全”这一具有神学张力的表述。
  alternative: 释义为“完全遵守了律法”或“满足了律法的一切要求”。
  rationale: 原文 πεπλήρωκεν 的范围不应在翻译中被过度解释；“成全”既忠于词义，也与保罗的相关用语保持呼应。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“任何人任何东西”略带原文式的全面强调，但仍属自然汉语；全句保持简洁的劝诫语气。
