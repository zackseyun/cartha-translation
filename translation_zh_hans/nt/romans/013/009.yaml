id: ROM.13.9
reference: Romans 13:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: τὸ γάρ· Οὐ μοιχεύσεις, Οὐ φονεύσεις, Οὐ κλέψεις, Οὐκ ἐπιθυμήσεις, καὶ εἴ τις ἑτέρα ἐντολή, ἐν ⸂τῷ λόγῳ τούτῳ⸃ ἀνακεφαλαιοῦται, ⸂ἐν τῷ⸃· Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/009.yaml
  text: 'For this: “You shall not commit adultery[a], you shall not murder, you shall not steal, you shall not covet,” and if there is any other commandment[b], it is summed up in this word: “You shall love your neighbor as yourself.”'
translation:
  language: zh_hans
  text: 因为：“不可奸淫，不可杀人[a]，不可偷盗，不可贪恋”，以及任何别的诫命，都概括在这句话[b]中：“要爱你的邻人，如同自己。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “杀人”所译的希腊语动词特指谋杀或非法杀人，并非泛指一切导致死亡的行为。
    reason: lexical_alternative
  - marker: b
    text: “这句话”也可译作“一个陈述”或“一项表述”；原文 λόγος 在此指用来概括诫命的言语表述。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ γάρ
  choice: 因为这些诫命
  rationale: 中性冠词与 γάρ 引出下文所列诫命的内容；译为“因为这些诫命”既承接上文，也使现代汉语表达完整自然。
- source_word: Οὐ μοιχεύσεις
  choice: 不可奸淫
  rationale: 将十诫引文中的将来时命令用汉语经典律法措辞“不可”表达，并准确保留 μοιχεύω 所指的通奸行为。
- source_word: Οὐ φονεύσεις
  choice: 不可杀人
  rationale: φονεύω 指蓄意或非法杀人，并非一切形式的致死；中文十诫传统用语“不可杀人”自然庄重，脚注进一步限定其词义。
- source_word: Οὐ κλέψεις
  choice: 不可偷盗
  rationale: 采用简明、庄重且为普通读者熟悉的诫命表达。
- source_word: Οὐκ ἐπιθυμήσεις
  choice: 不可贪恋
  rationale: ἐπιθυμέω 在十诫语境中指觊觎、贪求不属于自己的事物；“贪恋”比一般性的“想要”更准确。
- source_word: καὶ εἴ τις ἑτέρα ἐντολή
  choice: 以及其他任何诫命
  rationale: 保留 τις 的不定范围和 ἑτέρα 的“其他”含义，以自然汉语涵盖未逐一列出的诫命。
- source_word: ἀνακεφαλαιοῦται
  choice: 都归结
  rationale: 该动词表示汇总、概括或归于一个总纲；“归结”清楚表达众诫命被统摄于一句话中的意思。
- source_word: ἐν τῷ λόγῳ τούτῳ
  choice: 在这一句话中
  rationale: λόγος 此处不是单个词，而是一项言语表述；“一句话”符合现代汉语，也保留其作为总结性陈述的功能。
- source_word: Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν
  choice: 要爱邻人如同自己
  rationale: “要爱”传达经文引语中将来时的命令功能；“邻人”保留利未记引文的互文联系，“如同自己”不增添原文未明说的成分。
theological_decisions:
- issue: 十诫引文中禁令的表达形式
  choice: 采用“不可……”的律法命令形式
  alternative: 采用“不要……”的日常直接命令形式
  rationale: 希腊文沿用经文引语中的将来时命令形式；“不可”在现代中文中仍清楚可懂，并能保留十诫的庄重语体和互文联系。
- issue: λόγος 在“ἐν τῷ λόγῳ τούτῳ”中的范围
  choice: 译作“这一句话”，指总结性的经文陈述
  alternative: 译作“这个道”或“这项原则”
  rationale: 这里所指的是随后引用的完整表述，并非单个词，也不必将其解释性扩展为抽象“原则”；“这一句话”兼顾词义与上下文。
- issue: “爱邻人如同自己”的比较关系
  choice: 保留简洁的“如同自己”
  alternative: 解释为“像爱自己一样爱邻人”
  rationale: 原文省略重复的动词宾语结构；直译式的简洁表达保留经文张力，避免加入关于自爱性质的额外解释。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。十诫引文用“不可”保留律法语体；全句避免过度古雅。英文咨询层的脚注标记与脚注内容位置显然错配，中文稿按实际词义将“杀人”的说明标为[a]，将 λόγος 的说明标为[b]。
