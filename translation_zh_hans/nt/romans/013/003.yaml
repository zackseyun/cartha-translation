  text: οἱ γὰρ ἄρχοντες οὐκ εἰσὶν φόβος ⸂τῷ ἀγαθῷ ἔργῳ⸃ ἀλλὰ ⸂τῷ κακῷ⸃. θέλεις δὲ μὴ φοβεῖσθαι τὴν ἐξουσίαν; τὸ ἀγαθὸν ποίει, καὶ ἕξεις ἔπαινον ἐξ αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/003.yaml
  text: For rulers are not a terror to good conduct[a], but to bad. But if you do not want to fear the authority, do what is good[c][b], and you will have praise from it.
translation:
  language: zh_hans
  text: 因为掌权者并不是令行善的人惧怕的对象，而是令作恶的人惧怕的对象。[a]你想不惧怕这权柄吗？那就行善，你就会得到这权柄的称赞。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为掌权者不是善行所惧怕的，却是恶行所惧怕的。”原文将“善”与“恶”作为一般伦理范畴相对照；正文为使现代汉语自然明确，表达为行善者与作恶者所面对的情形。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρχοντες
  choice: 掌权者
  rationale: 指执政、掌握治理权的人；“掌权者”自然承接本章政治治理的语境，又不限定具体官职。
- source_word: φόβος
  choice: 所惧怕的
  rationale: 该词作表语，表示引起恐惧的对象；这样译成自然汉语，同时保留其具体语用含义。
- source_word: τῷ ἀγαθῷ ἔργῳ
  choice: 行善者
  rationale: 原文直译可作“对善行”；结合与后半句实词化形容词的对照，汉语用“行善者”表达治理者对不同行为者所构成的威慑关系。脚注保留行为导向的直译可能。
- source_word: τῷ κακῷ
  choice: 作恶者
  rationale: κακῷ为实词化形容词，并与“善”形成伦理对照；“作恶者”在汉语中与“行善者”平行自然。
- source_word: θέλεις δὲ μὴ φοβεῖσθαι
  choice: 你不想惧怕……吗？
  rationale: 保留θέλεις加不定式所形成的修辞问句，而不改写成条件句。
- source_word: ἐξουσίαν
  choice: 那权柄
  rationale: 保留单数和定冠语所指的治理权威；“权柄”既可指治理权，也可转指执掌该权力的权威主体。
- source_word: τὸ ἀγαθὸν ποίει
  choice: 行善吧
  rationale: 实词化的“善”与ποιεῖν组成“做善事、行善”之意；“行善”简洁自然，并保留一般伦理范畴。
- source_word: ἕξεις ἔπαινον
  choice: 你必得到……的称赞
  rationale: 汉语用“得到称赞”比逐字的“有称赞”自然；将来时用“必”表达结果。
- source_word: ἐξ αὐτῆς
  choice: 它的
  rationale: 阴性代词回指ἐξουσία；现代汉语以“它”指非人格化的治理权威，避免额外人格化。
theological_decisions:
- issue: 掌权者使恶者惧怕并称赞善者这一陈述的范围
  choice: 按经文陈述治理权柄通常或应有的功能来翻译，不加入“总是”等绝对化措辞。
  alternative: 将其译成所有统治者在任何情况下都必然赏善罚恶的无条件普遍命题，或译成反讽。
  rationale: 原文直接陈述掌权者与善恶行为的关系，但没有“总是”等强化词，也没有明确反讽标志；译文应保留现实与神学上的张力，不替作者扩大或消解其断言。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“掌权者—权柄”保留原文从复数治理者到单数治理权威的转换；修辞问句按希腊文句法保留。
