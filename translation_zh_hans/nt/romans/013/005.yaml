  text: διὸ ἀνάγκη ὑποτάσσεσθαι, οὐ μόνον διὰ τὴν ὀργὴν ἀλλὰ καὶ διὰ τὴν συνείδησιν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/005.yaml
  text: Therefore it is necessary to submit[a], not only because of wrath but also because of conscience[b],
translation:
  language: zh_hans
  text: 所以，必须顺服[a]，不但因为震怒[b]，也因为良心。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“服在权下”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“惩罚”。希腊原文作“震怒”，可能指执政者施行刑罚，也可能更广泛地指上帝借着政权所施的震怒。
    reason: alternative_reading
lexical_decisions:
- source_word: διὸ
  choice: 所以
  rationale: 表示由上文推出结论；“所以”自然清楚，也保留推论关系。
- source_word: ἀνάγκη
  choice: 必须
  rationale: 原文是表达必要性的无人称结构；汉语用“必须”简洁地传达其约束力。
- source_word: ὑποτάσσεσθαι
  choice: 顺服
  rationale: 在本段论到执政者的语境中，表示处于其权柄之下并采取相应态度；“顺服”自然庄重，但不额外解释为任何情况下都绝对服从。
- source_word: οὐ μόνον … ἀλλὰ καὶ
  choice: 不但……也……
  rationale: 准确而自然地再现原文的递进并列结构。
- source_word: διὰ τὴν ὀργὴν
  choice: 因为震怒
  rationale: διά加宾格在此表示原因或动机；“震怒”保留ὀργή的词义，不把它直接改释为“惩罚”。
- source_word: διὰ τὴν συνείδησιν
  choice: 因为良心
  rationale: 保留与前一分句平行的原因表达，指内在的道德意识也是顺服的理由。
theological_decisions:
- issue: ὀργή（震怒）的所指
  choice: 保留为“震怒”，不明确限定所指
  alternative: 译作“惩罚”，或明确译成“上帝的震怒”
  rationale: 上下文既提到权柄出于上帝，也提到执政者佩剑施行刑罚；本节没有明确说震怒属于谁，因此正文保留这种歧义。
- issue: ὑποτάσσεσθαι相对于执政掌权者的含义
  choice: 顺服
  alternative: 服在权下
  rationale: “顺服”清楚表达经文所要求的态度，同时没有加入原文未明说的“绝对服从”等教义性限定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不但……也……”保持原句紧凑的论证节奏；脚注标记按其实际说明对象分别置于“顺服”和“震怒”之后。
