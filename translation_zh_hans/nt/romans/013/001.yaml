id: ROM.13.1
reference: Romans 13:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Πᾶσα ψυχὴ ἐξουσίαις ὑπερεχούσαις ὑποτασσέσθω, οὐ γὰρ ἔστιν ἐξουσία εἰ μὴ ὑπὸ θεοῦ, αἱ δὲ ⸀οὖσαι ⸀ὑπὸ θεοῦ τεταγμέναι εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/001.yaml
  text: Let every person be subject to the governing authorities[a], for there is no authority except from God[b], and those that exist have been appointed by God.
translation:
  language: zh_hans
  text: 每个人都应当服从执政的权柄[a]，因为一切权柄都出于上帝；现有的权柄都已由上帝设立[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“居上位的权柄”或“更高的权柄”。
    reason: lexical_alternative
  - marker: b
    text: “设立”也可译为“安排”或“置于相应的位置”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶσα ψυχὴ
  choice: 人人
  rationale: 字面为“每一个灵魂”，但在通用希腊语中是指每一个人。“人人”既自然，又保留了逐一涵盖所有人的分配意味，且不引入原文无意强调的人论含义。
- source_word: ἐξουσίαις ὑπερεχούσαις
  choice: 在上掌权者
  rationale: ἐξουσίαις指具有或行使权柄者，ὑπερεχούσαις意为“居上位、在上”。结合公民治理语境，译作“在上掌权者”既表达其治理地位，也保留“更高、居上”的词义色彩。
- source_word: ὑποτασσέσθω
  choice: 要顺服
  rationale: 现在时命令语气要求处于有秩序的服从关系中。“顺服”能表达ὑποτάσσω的从属、服从含义，同时不把经文扩大解释为赞同掌权者的一切行为。
- source_word: οὐ γὰρ ἔστιν ἐξουσία εἰ μὴ ὑπὸ θεοῦ
  choice: 因为没有权柄不是出于上帝的
  rationale: 此处ὑπὸ θεοῦ表达权柄的终极来源或施行者。“出于上帝”在现代汉语中自然，并保留原句关于权柄来源的概括性断言。
- source_word: αἱ δὲ οὖσαι
  choice: 现有的权柄
  rationale: 阴性复数结构回指ἐξουσίαις。“现有的权柄”清楚表达实际存在的权柄，而不是只谈抽象的权柄原则。
- source_word: τεταγμέναι
  choice: 所设立的
  rationale: τάσσω的完成时被动分词表示经过安排而处于既定状态。“所设立的”简明表达上帝的安排；脚注同时保留“安排、置于相应位置”的词义可能。
theological_decisions:
- issue: 掌权者与上帝之间关系的范围和力度
  choice: 译文肯定权柄出于上帝，现有的权柄也处于上帝所设立的秩序之中，但不增添上帝无条件认可每个政权或掌权者每项行为的意思。
  alternative: 可作更强的理解，认为每一个具体政权及其行为都得到上帝积极认可；也可作较弱的理解，认为保罗只是在谈抽象的权柄原则，并非现实中的掌权者。
  rationale: 原文既具体提到“现有的”权柄，又用τεταγμέναι说明它们由上帝安排。译为“所设立的”保留这一有力度的陈述，却不替原文推演为对一切统治行为的道德认同。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“人人”自然传达Πᾶσα ψυχὴ；“在上掌权者”兼顾公民治理语境与ὑπερεχούσαις“居上”的词义。分号呈现原文后半句与前一因由句之间紧密而有层次的逻辑关系。
