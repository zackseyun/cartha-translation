id: ROM.13.2
reference: Romans 13:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὥστε ὁ ἀντιτασσόμενος τῇ ἐξουσίᾳ τῇ τοῦ θεοῦ διαταγῇ ἀνθέστηκεν, οἱ δὲ ἀνθεστηκότες ἑαυτοῖς κρίμα λήμψονται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/002.yaml
  text: Therefore[a], the one who resists the authority has opposed the ordinance of God[b], and those who have opposed it will receive judgment on themselves.
translation:
  language: zh_hans
  text: 因此，抗拒这权柄的人，就是反抗神的安排[a]；反抗的人必自取审判[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “神的安排”也可译作“神的规定”或“神所设立的秩序”。
    reason: lexical_alternative
  - marker: b
    text: “审判”也可译作“判决”或“定罪”；但这里的希腊文并不必然专指最终的永恒定罪。
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: 因此
  rationale: 表示由上一节推出的结论；“因此”自然地保留了推论关系。
- source_word: ὁ ἀντιτασσόμενος
  choice: 抗拒……的人
  rationale: 带冠词的现在时分词泛指持续采取抗拒立场的人；“抗拒”也保留其与后文同词根表达之间的联系。
- source_word: τῇ ἐξουσίᾳ
  choice: 这权柄
  rationale: 保留原文单数，并以“这”承接上一节所说的掌权者及其权柄；不在本节正文中过度扩写为“政府权力”。
- source_word: τῇ τοῦ θεοῦ διαταγῇ
  choice: 神的安排
  rationale: διαταγή可指安排、规定或所设立的秩序。“神的安排”既自然，又保留原词较宽的语义范围。
- source_word: ἀνθέστηκεν
  choice: 就是反抗
  rationale: 原文完成时表明已经采取、且仍然有效的对抗立场；汉语用“就是反抗”自然表达这一现实关系，避免生硬地强加时态标记。
- source_word: οἱ δὲ ἀνθεστηκότες
  choice: 反抗的人
  rationale: 承接前句，泛指已经采取反抗立场的人。汉语不重复补出宾语，也能由上下文清楚理解。
- source_word: ἑαυτοῖς
  choice: 自取
  rationale: 简洁表达反身与受害归己的含义，即这种后果落到他们自己身上。
- source_word: κρίμα
  choice: 审判
  rationale: 保留“裁决、审判、定罪”等可能范围，不把本节限定为末后的永远定罪。
- source_word: λήμψονται
  choice: 必……取
  rationale: “必自取”自然传达将来必然领受或招致该后果的意思。
theological_decisions:
- issue: κρίμα所指审判的范围
  choice: 审判
  alternative: 定罪、刑罚或判决
  rationale: 原文本身没有明确限定为永恒定罪；采用较宽的“审判”，既保留严肃警告，也不越过本节所说的范围。
- issue: ἐξουσία的所指
  choice: 这权柄
  alternative: 掌权者、政府权力
  rationale: 上下文明显涉及治理性的掌权者，但本节原文使用单数“权柄”。译文承接上下文而不把所指扩写得比原文更具体。
- issue: διαταγή的性质
  choice: 神的安排
  alternative: 神的规定、神所设立的秩序
  rationale: 该词可强调安排、命令或秩序。正文采用语义较宽的表达，避免把神与掌权者的关系缩减为某一种特定政治神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“抗拒—反抗”保留原文两个同义动词的呼应；“自取审判”简洁传达反身代词与将来后果。正文不加入特定政体、无条件顺服或永恒定罪等原文未明说的限定。
