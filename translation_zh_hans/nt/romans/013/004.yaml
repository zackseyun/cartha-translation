source:
  edition: SBLGNT
  text: θεοῦ γὰρ διάκονός ἐστιν σοὶ εἰς τὸ ἀγαθόν. ἐὰν δὲ τὸ κακὸν ποιῇς, φοβοῦ· οὐ γὰρ εἰκῇ τὴν μάχαιραν φορεῖ· θεοῦ γὰρ διάκονός ἐστιν, ἔκδικος εἰς ὀργὴν τῷ τὸ κακὸν πράσσοντι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/004.yaml
  text: For it is God’s servant for your good[a]. But if you do what is evil, be afraid, for it does not bear the sword for nothing. For it is God’s servant[b], an avenger for wrath against the one who practices evil.
translation:
  language: zh_hans
  text: 因为执政者是上帝的仆役，为使你得益处。但你若作恶，就该惧怕，因为他佩剑并非徒然。他是上帝的仆役，是向作恶的人施行震怒[a]的执行者。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “施行震怒”也可译作“施行惩罚”。原文没有明确说明这里的“震怒”是谁的震怒。
    reason: 保留 εἰς ὀργὴν 的语义及其未明说震怒归属的歧义。
lexical_decisions:
- source_word: διάκονός
  choice: 仆役
  rationale: 指受命服事并执行使命的人；在此说明执政者处于上帝之下、执行受托职分，同时避免把词义局限于教会职分。
- source_word: σοὶ εἰς τὸ ἀγαθόν
  choice: 为使你得益处
  rationale: 把与格 σοὶ 的受益关系和 εἰς τὸ ἀγαθόν 的目的或结果合并为自然的现代汉语。
- source_word: τὸ κακὸν ποιῇς
  choice: 作恶
  rationale: 简明自然地表达道德意义上的恶行。
- source_word: φοβοῦ
  choice: 就该惧怕
  rationale: 保留命令语气，并在汉语中自然表达面对执政者惩治权时应有的惧怕。
- source_word: εἰκῇ
  choice: 徒然
  rationale: 表示并非无目的、无实际作用；“徒然”兼具庄重和简洁。
- source_word: τὴν μάχαιραν φορεῖ
  choice: 佩剑
  rationale: φορέω 可指经常携带或佩带；“佩剑”保留具体形象及其惩治权象征。
- source_word: ἔκδικος
  choice: 施行惩治的
  rationale: 表达执行公正报应或惩罚的职能，避免“报仇者”在现代汉语中可能引起的私人复仇意味。
- source_word: εἰς ὀργὴν
  choice: 降下震怒
  rationale: 表达指向震怒的目的或结果，又不在正文中明确添加希腊文未明说的“上帝的”。
- source_word: τῷ τὸ κακὸν πράσσοντι
  choice: 向作恶的人
  rationale: 准确表达受惩治的对象；“作恶的人”自然清楚，也保留行为特征。
- source_word: γὰρ
  choice: 因为
  rationale: 清楚呈现本句对上文论述的解释关系。
theological_decisions:
- issue: 执政者的惩治职能与震怒的关系
  choice: 是施行惩治的，要向作恶的人降下震怒
  alternative: 是报应者，向作恶的人施行震怒
  rationale: 上下文表明执政者作为上帝的仆役执行惩治，但 εἰς ὀργὴν 本身没有再次明说“上帝的震怒”。正文因此保留“震怒”而不补入所有者，同时用自然汉语呈现其目的和对象。
- issue: “剑”的含义
  choice: 保留“佩剑”的具体意象
  alternative: 掌有惩罚的权柄
  rationale: 原文使用具体名词 μάχαιρα；保留这一意象，不把它缩减为抽象权柄，也不进一步界定其惩罚范围。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“执政者”承接上下文所指的掌权者；代词用“他”，符合汉语对该角色的自然指称。“佩剑并非徒然”保留原文的具体形象和论证力度。
