revisions:
- from: 因为执政者是上帝的仆役，是为使你得益处。但你若作恶，就该惧怕，因为他佩剑并非徒然。他是上帝的仆役，是施行惩治的，要向作恶的人降下震怒。[a]
  to: 因为执政者是上帝的仆役，为使你得益处。但你若作恶，就该惧怕，因为他佩剑并非徒然。他是上帝的仆役，是向作恶的人施行震怒[a]的执行者。
  rationale: 修改首句以消除汉语句法生硬之处。末句以“执行者”呈现 ἔκδικος 的职能性名词，并以“向作恶的人施行震怒”对应 εἰς ὀργὴν τῷ τὸ κακὸν πράσσοντι；这不把震怒的来源明确限定为上帝，也不将原文具体的报应／震怒语义泛化掉。脚注移至“震怒”后，明确锚定所说明的短语。
