id: ROM.13.14
reference: Romans 13:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἀλλὰ ἐνδύσασθε τὸν κύριον Ἰησοῦν Χριστόν, καὶ τῆς σαρκὸς πρόνοιαν μὴ ποιεῖσθε εἰς ἐπιθυμίας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/014.yaml
  text: But put on the Lord Jesus the Messiah[a], and make no provision for the flesh, for its desires.
translation:
  language: zh_hans
  text: 但要披戴主耶稣基督，也不要为肉体[a]作安排，去满足私欲。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“罪性”。希腊原文是“肉体”；保罗常用这个词指堕落人性中违背上帝的欲念，与顺从上帝引导的生命相对。
    reason: 说明σάρξ在此处的比喻性伦理含义，同时保留原词的神学张力。
lexical_decisions:
- source_word: ἐνδύσασθε
  choice: 披戴
  rationale: 该词以穿衣为喻，命令人以主耶稣基督为身份与生活方式；“披戴”保留这一形象，也符合庄重而通顺的现代中文表达。
- source_word: κύριον
  choice: 主
  rationale: 在这里是耶稣的称号；译作“主”保留其基督论分量及中文圣经传统中清楚自然的表达。
- source_word: Χριστόν
  choice: 基督
  rationale: 该词意为“受膏者”，在“主耶稣基督”这一称号序列中用“基督”最自然、庄重；不把它处理成普通姓氏。
- source_word: πρόνοιαν μὴ ποιεῖσθε
  choice: 不要……作安排
  rationale: πρόνοια指预先筹划、照料或预备，与ποιεῖσθε构成“作安排、作预备”的意思；此译法自然地表达不可预先为肉体的欲望铺路。
- source_word: σάρξ
  choice: 肉体
  rationale: 此处带有伦理含义，指向堕落人性中悖逆上帝的倾向，但直译“肉体”可以保留保罗用语本身的广度和神学张力，不将其直接等同于一套系统化的“罪性”概念。
- source_word: εἰς ἐπιθυμίας
  choice: 去满足私欲
  rationale: 介词短语表明为肉体作安排所趋向的目的或结果。“去满足私欲”在现代中文中清楚表达这种关系；“私欲”在本段伦理语境中传达ἐπιθυμίαι的负面含义。
theological_decisions:
- issue: 在保罗伦理语境中如何翻译σάρξ
  choice: 肉体
  alternative: 罪性
  rationale: 上下文确实涉及悖逆上帝的欲望，但直接译成“罪性”会缩窄并预先解释保罗的身体隐喻和人论。正文保留“肉体”，脚注说明此处可能的伦理含义。
- issue: Χριστός作为称号还是姓名成分
  choice: 基督
  alternative: 弥赛亚（受膏者）
  rationale: Χριστός本是“受膏者”的称号；中文“基督”在“主耶稣基督”中仍承载这一传统称号，且比在此处改用“弥赛亚”更符合自然、庄重的现代中文表达。
translation_notes:
  register: 采用庄重、简洁而易懂的现代标准汉语。“披戴”保留穿衣隐喻；分句结构紧贴希腊文的两个并列命令。脚注标记紧随“肉体”，使注释对象清楚。
