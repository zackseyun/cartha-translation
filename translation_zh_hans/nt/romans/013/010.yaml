  text: ἡ ἀγάπη τῷ πλησίον κακὸν οὐκ ἐργάζεται· πλήρωμα οὖν νόμου ἡ ἀγάπη.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/010.yaml
  text: Love does no harm to a neighbor[b][a]; therefore love is the fulfillment of the law.
translation:
  language: zh_hans
  text: 爱不加害于邻人[a]；所以，爱就是律法的成全[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“爱不对邻人行恶。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“爱就是律法的完满。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγάπη
  choice: 爱
  rationale: 采用现代汉语中自然且涵盖面恰当的“爱”，并在本节两处保持同一译法，以保留原文的重复和强调。
- source_word: τῷ πλησίον
  choice: 于邻人
  rationale: 与“加害”搭配，表达与格所标明的受影响对象；“邻人”在现代汉语中可泛指身边的他人，符合此处普遍性的伦理含义。
- source_word: κακὸν οὐκ ἐργάζεται
  choice: 不加害
  rationale: κακόν与ἐργάζεται结合，在此指对他人作恶或造成伤害。“不加害”简洁自然，同时保留主动施害的含义；脚注列出较贴近字面的译法。
- source_word: πλήρωμα
  choice: 成全
  rationale: 此处指使律法达到其要求或目标的成全。“成全”既保留名词性表述，也契合上下文；“完满”作为可能的词义另见脚注。
- source_word: οὖν
  choice: 所以
  rationale: 清楚表达由前句推出结论的推论关系，语气自然。
- source_word: νόμου
  choice: 律法
  rationale: 上下文指可识别的律法，译作“律法”符合保罗书信中的用语，并避免将其泛化为一般规律。
theological_decisions:
- issue: 爱与律法之间的关系
  choice: 爱就是律法的成全
  alternative: 爱成全了律法；爱就是律法的完满
  rationale: 原文是名词性判断句，并未直接使用“成全”这一动词。译文保留“爱就是……的成全”的结构，不额外界定爱以何种方式成全每一条诫命，同时脚注保留πλήρωμα可理解为“完满”的余地。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“不加害于”略带书面色彩，适合经文语体，但仍为普通读者所理解；分号保留两句之间紧密的推论关系。
