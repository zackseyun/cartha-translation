source:
  edition: SBLGNT
  text: ὡς ἐν ἡμέρᾳ εὐσχημόνως περιπατήσωμεν, μὴ κώμοις καὶ μέθαις, μὴ κοίταις καὶ ἀσελγείαις, μὴ ἔριδι καὶ ζήλῳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/013.yaml
  text: Let us walk properly as in the daytime[a], not in revelries and drunkenness, not in sexual immorality and sensuality[b], not in strife and jealousy.
translation:
  language: zh_hans
  text: 让我们行事端正[a]，如同在白昼一样；不可狂欢醉酒，不可淫乱放荡，也不可争竞嫉妒[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “端正”也可译作“得体”。
    reason: lexical_alternative
  - marker: b
    text: “嫉妒”也可译作“羡妒”；原文在不同语境中可表达这两种意思，但在此恶行清单中带负面含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ἐν ἡμέρᾳ
  choice: 如同在白昼一样
  rationale: 保留昼夜对比的比喻，并以自然的现代汉语表达在光明中生活、行为无须遮掩的意象。
- source_word: εὐσχημόνως
  choice: 端正
  rationale: 该副词指合宜、得体、受人尊重的行为；“端正”简洁庄重，也适合修饰整体生活方式。
- source_word: περιπατήσωμεν
  choice: 让我们行事
  rationale: 原文是劝勉语气；“让我们”传达第一人称复数的共同劝勉，“行事”则自然表达保罗以“行走”比喻生活方式的惯用法。
- source_word: κώμοις
  choice: 狂欢
  rationale: 该词指喧闹无度的宴饮作乐；“狂欢”保留其放纵意味，又不把含义误限于现代汉语中的性行为。
- source_word: μέθαις
  choice: 醉酒
  rationale: 直接表达因饮酒而醉或纵酒的行为，与“狂欢”组成自然的恶行并列。
- source_word: κοίταις
  choice: 淫乱
  rationale: 字面为“床榻”，在此惯用地指不正当的性行为；按语义译为“淫乱”可清楚传达原文的道德含义。
- source_word: ἀσελγείαις
  choice: 放荡
  rationale: 指无所节制、恬不知耻的行为，常带性方面的色彩；“放荡”既自然又不把词义限制得过窄。
- source_word: ἔριδι
  choice: 争竞
  rationale: 该词表示争执、纷争或好胜对抗；“争竞”适合恶行清单的凝练文体，并能与下文“嫉妒”自然配对。
- source_word: ζήλῳ
  choice: 嫉妒
  rationale: 该词可指热心、妒忌或羡妒；在此恶行清单中显然为负面意义，“嫉妒”是清楚自然的译法。
theological_decisions:
- issue: 昼与暗夜的伦理比喻
  choice: 译作“如同在白昼一样”，直接保留意象
  alternative: 译作“像白天行事”或将其解释为“行在光明中”
  rationale: 本节承接上下文的昼夜对比；译文保留保罗的比喻，不把本节未明说的神学解释直接写入正文。
- issue: κοίταις的性含义
  choice: 按惯用含义译作“淫乱”
  alternative: 按字面译作“床榻”
  rationale: “床榻”在现代汉语中无法自然传达此处所指的不正当性行为；“淫乱”清楚表达其语境意义，同时不额外限定某一种具体行为。
- issue: ζῆλος词族在恶行清单中的负面意义
  choice: 译作“嫉妒”
  alternative: “羡妒”或“热心”
  rationale: 上下文与“争竞”并列，要求负面含义；正文采用常用的“嫉妒”，脚注保留“羡妒”这一可能译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“让我们”保留共同劝勉的语气，以三组“不可”呈现原文整齐的恶行并列；“行事”自然承载希腊文“行走”所表达的生活方式含义。
