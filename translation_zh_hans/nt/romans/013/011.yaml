id: ROM.13.11
reference: Romans 13:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ τοῦτο εἰδότες τὸν καιρόν, ὅτι ὥρα ⸂ἤδη ὑμᾶς⸃ ἐξ ὕπνου ἐγερθῆναι, νῦν γὰρ ἐγγύτερον ἡμῶν ἡ σωτηρία ἢ ὅτε ἐπιστεύσαμεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/011.yaml
  text: And do this[a], knowing the time, that it is already the hour for you to awaken from sleep[b], for now our salvation is nearer than when we believed.
translation:
  language: zh_hans
  text: 你们也要这样做，既知道这时机：现在已经是你们[a]该从睡梦中醒来的时候了；因为现在，我们的救恩比我们信的时候[b]更近了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本在“该从睡梦中醒来”之前作“我们”，而不是“你们”。
    reason: textual_variant
  - marker: b
    text: 也可译作“比我们起初信的时候”。希腊文直译为“我们信的时候”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ τοῦτο
  choice: 你们也要这样做
  rationale: τοῦτο承接上文的伦理劝勉；补出汉语所需的“做”，既自然，也不超出上下文所含的命令意味。
- source_word: εἰδότες τὸν καιρόν
  choice: 因为你们知道现今是什么时候
  rationale: 分词在此带有理由意味；καιρός指具有决定意义的时机，而不只是钟表或历法上的时间。“现今是什么时候”用现代汉语传达对当前关键时刻的辨识。
- source_word: ὅτι ὥρα ἤδη
  choice: 现在已经是……时刻了
  rationale: 保留ὥρα的“时刻”意象，并以“已经……了”表达ἤδη所强调的现实紧迫性。
- source_word: ὑμᾶς
  choice: 你们
  rationale: 依SBLGNT正文采用第二人称复数；异文“我们”收入脚注。
- source_word: ἐξ ὕπνου ἐγερθῆναι
  choice: 该从睡梦中醒来
  rationale: 保留“睡眠—醒来”的劝勉性隐喻；“睡梦”在现代汉语中自然，且“该”表达ὥρα配不定式所含的适时与必要意味。
- source_word: νῦν γὰρ
  choice: 因为现在
  rationale: γάρ说明应当醒来的理由，νῦν突出当前时点。
- source_word: ἐγγύτερον ἡμῶν ἡ σωτηρία
  choice: 我们的救恩……更近了
  rationale: 保持比较结构及救恩正在临近的末世性动态，不把σωτηρία限定为某一教义阶段。
- source_word: ἢ ὅτε ἐπιστεύσαμεν
  choice: 比我们信的时候
  rationale: 按希腊文直译“我们信的时候”，不在正文增添原文没有明确表达的“起初”或“初次”。
theological_decisions:
- issue: 救恩既属于信徒，又被说成正在临近
  choice: 保留“我们的救恩……更近了”
  alternative: 我们最终的救恩更近了；主再来时的拯救更近了；救恩完全实现的日子更近了
  rationale: 原文同时称之为“我们的”救恩，又说它如今更加临近，体现已经与尚未之间的张力；译文不把它缩限为称义、成圣、得荣耀或末日拯救中的单一层面。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“醒来”比“苏醒”更日常自然，“救恩”则保留保罗书信中稳定且不被过度解释的神学用语。脚注标记放在其实际说明的词语之后，以免读者误解。
