  text: ἡ νὺξ προέκοψεν, ἡ δὲ ἡμέρα ἤγγικεν. ⸀ἀποβαλώμεθα οὖν τὰ ἔργα τοῦ σκότους, ⸂ἐνδυσώμεθα δὲ⸃ τὰ ὅπλα τοῦ φωτός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/012.yaml
  text: The night is far gone[a]; the day has drawn near[b]. Therefore let us cast off the works of darkness and put on the armor of light.
translation:
  language: zh_hans
  text: 黑夜已深[a]，白昼将近。所以，让我们脱去黑暗的行为，披戴光明的兵器[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“黑夜已经过去大半。”希腊语动词本义为“向前推进、进展”；用于黑夜，表示它已经大大过去。
    reason: lexical_alternative
  - marker: b
    text: 或译：“光明的战斗装备。”希腊语此词可指武器，也可泛指战斗装备。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡ νὺξ
  choice: 黑夜
  rationale: 直译夜与昼的时间性比喻，同时不把其伦理和末世含义明说出来。
- source_word: προέκοψεν
  choice: 已深
  rationale: 该动词本义为向前推进；就夜间进程而言，现代汉语“夜已深”自然表达黑夜已经过去大半，同时保留其推进的图景。脚注说明较直译的可能。
- source_word: ἡ ἡμέρα
  choice: 白昼
  rationale: 与“黑夜”形成清楚、自然的对应，也保留时间和伦理双重意象。
- source_word: ἤγγικεν
  choice: 已经临近
  rationale: “临近”表达接近，“已经”体现完成时所强调的、由接近所形成的当前状态。
- source_word: ἀποβαλώμεθα
  choice: 我们要脱去
  rationale: 劝勉式虚拟语气译作共同劝勉；“脱去”与后文“穿上”相配，保留衣着意象。
- source_word: τὰ ἔργα τοῦ σκότους
  choice: 黑暗的行为
  rationale: ἔργα 在此指伦理性的所作所为；“行为”比“工作”更符合现代汉语，又保留“黑暗”的比喻，不直接释为恶行。
- source_word: ἐνδυσώμεθα
  choice: 穿上
  rationale: 自然保留穿衣意象，并与“脱去”构成鲜明对应。
- source_word: τὰ ὅπλα τοῦ φωτός
  choice: 光明的军装
  rationale: ὅπλα 可指武器、兵器或战斗装备；“军装”既能与“穿上”自然搭配，也可概括防护和作战装备，而不局限于攻击性武器。脚注保留“兵器”的词义可能。
theological_decisions:
- issue: 黑夜与白昼的末世性比喻
  choice: 按原文保留“黑夜／白昼”，不把它们解释性改写为“黑暗时代／新时代”。
  alternative: 这个黑暗的时代快要过去，新的日子就要来到。
  rationale: 原文意象同时具有时间、伦理和救恩历史层面的张力；直保留比喻可避免替读者预先限定其含义。
- issue: ὅπλα τοῦ φωτός 的含义
  choice: 正文译为“光明的军装”。
  alternative: 光明的兵器
  rationale: “穿上”支持可穿戴的战斗装备含义；但 ὅπλα 也常指兵器，因此以脚注保留该可能，避免完全消除词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“夜已深”是自然汉语，同时保留原文夜间进程的意象；“脱去／穿上”保持平行的衣着比喻。“所以，我们要”清楚传达共同劝勉语气。
