  text: ⸀ἀπόδοτε πᾶσι τὰς ὀφειλάς, τῷ τὸν φόρον τὸν φόρον, τῷ τὸ τέλος τὸ τέλος, τῷ τὸν φόβον τὸν φόβον, τῷ τὴν τιμὴν τὴν τιμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/007.yaml
  text: 'Pay to all what is owed: to the one due tax, tax; to the one due revenue, revenue; to the one due fear, fear; to the one due honor, honor.'
translation:
  language: zh_hans
  text: 向众人偿还所欠的：该向谁纳税，就向谁纳税；该向谁缴税费，就向谁缴税费；该敬畏谁，就敬畏谁；该尊敬谁，就尊敬谁。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόδοτε
  choice: 偿付
  rationale: 表达把所欠之物交还或付清的含义，并与下文“所当得的”自然衔接。
- source_word: πᾶσι τὰς ὀφειλάς
  choice: 凡人所当得的，都要
  rationale: 保留“向所有人／各人”与“所欠之物”的普遍范围，同时采用自然现代汉语语序。
- source_word: φόρος
  choice: 税款
  rationale: 通常指向被统治者征收的直接税或贡税；“税款”清楚而不过度限定具体税制。
- source_word: τέλος
  choice: 关税
  rationale: 在此与 φόρος 并列，指另一类征收，常包括关税、消费税等；正文选用简明且能体现区别的“关税”。
- source_word: φόβος
  choice: 敬畏
  rationale: 保留 φόβος 的“畏惧／敬畏”力度，不弱化为单纯“尊敬”，也符合对权柄应有态度的语境。
- source_word: τιμή
  choice: 尊重
  rationale: 表示给予某人应有的尊荣与重视；“尊重”自然，并与前项“敬畏”保持区别。
theological_decisions:
- issue: φόβος 是否弱化为一般性的“尊敬”
  choice: 敬畏
  alternative: 尊敬／敬重
  rationale: 原文明确使用 φόβος，且与 τιμή 并列；译作“敬畏”可保留两者之间的张力，避免将其合并为同一观念。
- issue: 本节是否限定所指对象仅为政府官员
  choice: 保留“凡人”及各类应得者的开放表述
  alternative: 明确译为“各级官员”
  rationale: 上下文涉及掌权者，但本句 πᾶσι 表述较广；不在正文中添加原文未明说的身份限定。
translation_notes:
  register: 采用庄重、简洁的现代标准汉语；保留原文四项平行、反复的修辞结构，使命令的力度和各项义务的对应关系清楚可见。
