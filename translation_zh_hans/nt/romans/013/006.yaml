  text: διὰ τοῦτο γὰρ καὶ φόρους τελεῖτε, λειτουργοὶ γὰρ θεοῦ εἰσιν εἰς αὐτὸ τοῦτο προσκαρτεροῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/006.yaml
  text: For because of this you also pay taxes, for they are God’s ministers, devoting themselves to this very thing.
translation:
  language: zh_hans
  text: 因为这个缘故，你们也缴纳税款；因为他们是上帝的仆役，专心于这件事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φόρους τελεῖτε
  choice: 缴纳税款
  rationale: φόρος 指由臣民或居民缴纳的税赋；τελεῖτε 在此意为支付、缴纳。现代汉语“缴纳税款”准确自然。
- source_word: λειτουργοὶ θεοῦ
  choice: 上帝的公仆
  rationale: λειτουργός 可指承担公共职务或服务的人；结合本段所论掌权者及征税职责，“公仆”既保留服务者含义，也体现其公共职分。属格 θεοῦ 直译为“上帝的”。
- source_word: εἰς αὐτὸ τοῦτο προσκαρτεροῦντες
  choice: 专心履行这项职责
  rationale: προσκαρτερέω 表示持续专注、坚守；εἰς αὐτὸ τοῦτο 强调正是这件事。中文用“专心履行这项职责”自然表达其持续投入公共职务之意。
theological_decisions:
- issue: 政府官员作为“上帝的 λειτουργοί”
  choice: 上帝的公仆
  alternative: 上帝的仆役／上帝的差役
  rationale: 译文保留其职分与上帝相关这一明确陈述，但不将其扩大为对官员品格、行为或所有命令的神圣认可。
- issue: “这项职责”的具体所指
  choice: 保留可由上下文界定的概括表达
  alternative: 专心征税
  rationale: τοῦτο 可能紧接缴税、收税，也可能概括前文所述治理职分；译为“这项职责”保留原文一定的指代张力，避免将其过度限定为征税。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“公仆”在当代汉语中适用于承担公共职分者；全句保持原文两次 γάρ 所形成的解释关系，但为避免汉语中“因为……因为……”生硬，首个因果关系译作“也是出于这个缘故”，第二个用“因为”展开说明。
