  source_fidelity: 译文准确传达缴税、掌权者为上帝的λειτουργοί及其持续专注于“这件事”的基本意思。然“公仆”是现代汉语特定的政治伦理称谓，容易把原文较宽的“服事者／执行职分者”压缩为现代意义的人民公仆；宜改为较中性的“仆役”。
