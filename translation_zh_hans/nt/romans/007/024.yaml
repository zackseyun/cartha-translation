  text: ταλαίπωρος ἐγὼ ἄνθρωπος· τίς με ῥύσεται ἐκ τοῦ σώματος τοῦ θανάτου τούτου;
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/024.yaml
  text: What a wretched man I am! Who will rescue me from this body of death?[a][b]
translation:
  language: zh_hans
  text: 我这个人真是苦啊！谁能救我脱离[b]这死亡之躯[a]呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文较直译为“这死亡的身体”。
    reason: lexical_alternative
  - marker: b
    text: “救我脱离”也可译为“解救我”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ταλαίπωρος
  choice: 苦
  rationale: 该词表达深重的痛苦、困顿和悲惨；“真是苦啊”以自然的现代汉语保留保罗呼喊中的强烈情绪。
- source_word: ἐγὼ ἄνθρωπος
  choice: 我这个人
  rationale: 既明确是说话者自指，也保留ἄνθρωπος所强调的“人”这一层意思；比单说“我真苦”更贴近原文。
- source_word: τίς
  choice: 谁
  rationale: 原文用指人的疑问代词，询问施行拯救者，译作“谁”准确自然。
- source_word: ῥύσεται
  choice: 能救我脱离
  rationale: ῥύομαι指从危险、辖制或困境中营救、解救；“救……脱离”兼顾动作的力度和ἐκ所表达的脱离。
- source_word: ἐκ
  choice: 脱离
  rationale: 这里表示从某种处境或范围中被解救出来；与“救”搭配成“救我脱离”，符合现代汉语习惯。
- source_word: σώματος
  choice: 躯
  rationale: 保留“身体”的具体意象；“死亡之躯”中的“躯”庄重、凝练，但不将身体解释为抽象的‘本性’或‘处境’。
- source_word: τοῦ θανάτου τούτου
  choice: 这死亡之
  rationale: 尽量保留θάνατος“死亡”和τούτου“这”的表达，并以“这死亡之躯”组成自然而有力度的汉语短语，不进一步界定身体与死亡之间的关系。
theological_decisions:
- issue: 末句属格短语τοῦ σώματος τοῦ θανάτου τούτου的表达及τούτου的修饰范围
  choice: 这死亡之躯
  alternative: 属于这死亡的身体／这具死亡的身体
  rationale: 原文τούτου在语法形式上与“死亡”相应，而整个短语也可在译入语中自然理解为“这死亡之躯”。正文保留身体与死亡之间未明说的关联，不将其擅自解释为“必死的身体”“带来死亡的身体”或某一特定教义概念；脚注提示较直译的结构。
- issue: ῥύσεται的语气与含义
  choice: 能救我脱离
  alternative: 会解救我
  rationale: “能……呢”自然传达呼求式疑问的力度；“救……脱离”保留从困境中被营救出来的含义，不预先说明施救方式。
translation_notes:
  register: 采用现代、庄重而口语可懂的表达。“我这个人真是苦啊”保留原文突出的自我哀叹；“这死亡之躯”保留具体身体意象及原文中身体与死亡关系的张力。所有脚注标记均置于正文相关问句之后。
