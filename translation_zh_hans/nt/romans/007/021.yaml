  text: Εὑρίσκω ἄρα τὸν νόμον τῷ θέλοντι ἐμοὶ ποιεῖν τὸ καλὸν ὅτι ἐμοὶ τὸ κακὸν παράκειται·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/021.yaml
  text: 'So I find this law: when I want to do what is good[a], evil lies close at hand.'
translation:
  language: zh_hans
  text: 这样看来，我发现有一条规律[a]：当我愿意行善时，恶就近在身边。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “规律”也可译作“律”或“法则”。
    reason: 保留 νόμος 在本节中既可按字面理解为“律”，又可指支配性规律或法则的语义可能。
lexical_decisions:
- source_word: Εὑρίσκω
  choice: 我发现
  rationale: 现在时表达保罗当下并持续的认识；“发现”自然保留了辨明所得结论的语气。
- source_word: ἄρα
  choice: 因此
  rationale: 承接上文并引出推论；“因此”清楚表达推论关系，语体庄重而自然。
- source_word: νόμον
  choice: 律
  rationale: 保留希腊文 νόμος 的用词及其与上下文“律”之论述的呼应，不在正文中径直限定为摩西律法或一般规律。
- source_word: τῷ θέλοντι ἐμοὶ ποιεῖν τὸ καλὸν
  choice: 我愿意行善的时候
  rationale: 将希腊文较紧缩的与格结构转换为自然汉语的时间情境，同时保留 θέλω 的意愿含义和“行善”的行动指向。
- source_word: τὸ καλὸν
  choice: 善
  rationale: 定冠词加形容词作名词用；汉语“行善”简洁自然，准确表达“做那善的事”。
- source_word: τὸ κακὸν
  choice: 恶
  rationale: 保留名词化形容词的概括性，不把它过度具体化为某一种恶行。
- source_word: παράκειται
  choice: 就在我身边
  rationale: 表达“在旁边、近在手边”的基本意象，也传达恶持续临近、随时在场的意味。
theological_decisions:
- issue: νόμον 是指摩西律法，还是指一种支配性的规律或法则
  choice: 正文译作“律”
  alternative: 规律；法则
  rationale: “律”保留保罗反复使用 νόμος 所形成的词语呼应和解释张力；脚注提示此处也可能指经验中显出的规律，避免读者将其自动等同于摩西律法。
- issue: παράκειται 所表达的恶与“我”的关系
  choice: 译作“恶就在我身边”
  alternative: 恶与我同在；恶近在手边
  rationale: “在我身边”保留空间性的临近意象，却不进一步断定恶是内住于“我”、外在于“我”，或只是可供选择，从而避免消解经文的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“有这样一个律”使推论结构在汉语中清楚自然；“行善”简洁凝练。“律”后的脚注标记与脚注所解释的词直接对应。
