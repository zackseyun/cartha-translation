id: ROM.7.8
reference: Romans 7:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἀφορμὴν δὲ λαβοῦσα ἡ ἁμαρτία διὰ τῆς ἐντολῆς κατειργάσατο ἐν ἐμοὶ πᾶσαν ἐπιθυμίαν, χωρὶς γὰρ νόμου ἁμαρτία νεκρά.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/008.yaml
  text: But sin[a], seizing an opportunity through the commandment, produced in me every kind of coveting. For apart from the law[b], sin is dead.
translation:
  language: zh_hans
  text: 可是，罪借着诫命抓住了机会[a]，在我里面生出各样的贪欲[b]；因为没有律法，罪是死的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“找到了可乘之机”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“各样的欲望”；本段语境特指贪欲。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφορμήν
  choice: 机会
  rationale: 该词指可被利用的契机或出发点；与“抓住”搭配，既自然，又保留罪伺机利用诫命的拟人意象。
- source_word: λαβοῦσα
  choice: 抓住了
  rationale: 此不定过去时分词表示先于主句动作发生；“抓住了机会”准确而自然地表现主动利用机会之意。
- source_word: ἡ ἁμαρτία
  choice: 罪
  rationale: 保留“罪”作为行动主体的拟人表达，不将其弱化为抽象状态。
- source_word: διὰ τῆς ἐντολῆς
  choice: 借着诫命
  rationale: 介词短语表示罪所利用的途径；单数“诫命”也与上文刚引用的不可贪心之诫相呼应。
- source_word: κατειργάσατο
  choice: 生出
  rationale: 该动词表示造成、产生某种结果；“生出”符合现代汉语，并清楚表达罪所导致的结果。
- source_word: πᾶσαν ἐπιθυμίαν
  choice: 各样的贪欲
  rationale: πᾶσαν在此自然表达为“各样的”；ἐπιθυμία本可泛指欲望，但本段紧接“不可贪心”的诫命，因此主文采用“贪欲”，同时以脚注保留较宽泛的词义。
- source_word: χωρὶς γὰρ νόμου
  choice: 因为没有律法
  rationale: “因为”传达γάρ的解释作用；“没有律法”简明保留χωρὶς νόμου的含义，而不额外界定其时间或范围。
- source_word: νεκρά
  choice: 死的
  rationale: 直译保留保罗鲜明而带张力的隐喻，不解释性地改成“不活跃”或“不起作用”。
theological_decisions:
- issue: 是否淡化罪的拟人化，并把“死的”解释为“不起作用”
  choice: 保留罪抓住机会、产生贪欲的拟人表达，并直译为“罪就是死的”
  alternative: 把罪处理为抽象状态，并将νεκρά译作“不起作用”或“不活跃”
  rationale: 希腊文把罪描写为采取行动的力量，又以“死的”作谓语；保留这些表述可维持原文的神学张力，而不替作者作进一步解释。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“可是”承接上文并突出转折；分号连接结果与保罗随后给出的解释。拟人化和“死的”这一隐喻均按原文保留。
