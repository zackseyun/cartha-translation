  text: οὐ γὰρ ὃ θέλω ποιῶ ἀγαθόν, ἀλλὰ ὃ οὐ θέλω κακὸν τοῦτο πράσσω.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/019.yaml
  text: For I do not do the good that I want[b][a], but the evil that I do not want—this I practice.
translation:
  language: zh_hans
  text: 因为我想要的善，我不做[a]；我不想要的恶，我反倒去行[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “做”也可译作“实行”。原文后半句用了另一个含义相近的动词。
    reason: lexical_alternative
  - marker: b
    text: “行”也可译作“做”。这里用不同的汉语词对应原文两个不同但意义重叠的动词。
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλω
  choice: 想要
  rationale: 用现代汉语自然地表达意愿，既不弱化为一时喜好，也不强化为哲学意义上的“意志”。
- source_word: ποιῶ
  choice: 做
  rationale: “做”是 ποιέω 在此最直接自然的对应，并可与后文 πράσσω 的“行”形成适度区别。
- source_word: ἀγαθόν
  choice: 善
  rationale: 保留原文明确而有分量的道德范畴，并与“恶”构成整齐对照。
- source_word: κακὸν
  choice: 恶
  rationale: 保留原文的道德力度，不弱化为一般性的“不好”或“坏事”。
- source_word: πράσσω
  choice: 行
  rationale: “行”适合表达实际付诸行为，并在不夸大差别的前提下，与前面的 ποιῶ“做”有所区分。
- source_word: τοῦτο
  choice: 偏偏
  rationale: 原文 τοῦτο 把“我不想要的恶”突出为实际所行之事；中文用“偏偏”自然传达这一强调和反差，避免生硬的“这个我行”。
- source_word: οὐ γὰρ
  choice: 因为……不
  rationale: “因为”保留 γάρ 与上文之间的解释关系；否定按现代汉语语序置于谓语之前。
theological_decisions:
- issue: 是否弱化“善／恶”的道德对立
  choice: 保留“善／恶”这两个直接的道德范畴。
  alternative: 译作“好事／坏事”或“对的事／错的事”。
  rationale: ἀγαθόν 与 κακόν 在此具有鲜明的伦理分量；直译为“善／恶”可保留保罗论述中的张力，不把它降为实用层面的好坏。
- issue: 是否把现在时或 πράσσω 明确解释为习惯性犯罪
  choice: 仅译为“去行”，不额外加入“不断”“惯常”等频率含义。
  alternative: 译作“我总是在做”或“我惯于行”。
  rationale: πράσσω 可涉及实际行为，但本句本身不足以要求把反复性明说出来；应保留原文在具体行动与行为模式之间的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。通过“我想要的善／我不想要的恶”保留原文平行结构；用“反而……偏偏……”自然呈现 ἀλλά 与 τοῦτο 所加强的反差。所有脚注标记均置于相应正文词语之后。
