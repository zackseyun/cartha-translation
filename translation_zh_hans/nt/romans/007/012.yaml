id: ROM.7.12
reference: Romans 7:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὥστε ὁ μὲν νόμος ἅγιος, καὶ ἡ ἐντολὴ ἁγία καὶ δικαία καὶ ἀγαθή.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/012.yaml
  text: So then, the law is holy, and the commandment is holy and righteous and good.
translation:
  language: zh_hans
  text: 所以，律法是圣洁的，诫命也是圣洁、公义、良善的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥστε
  choice: 所以
  rationale: 承接上文并引出推论；“所以”在现代汉语中自然、清楚地表达其推论作用。
- source_word: νόμος
  choice: 律法
  rationale: 上下文所指为摩西律法；“律法”是中文圣经语境中准确而通行的对应词，同时没有在本句中作超出原文的具体化。
- source_word: ἅγιος
  choice: 圣洁
  rationale: 既可表达归属于神、分别为圣，也保留道德纯洁的含义；此处用于律法和诫命，译作“圣洁”自然且符合神学语境。
- source_word: ἐντολή
  choice: 诫命
  rationale: 此词在上下文中很可能指律法中的一条具体命令；“诫命”比一般性的“命令”更贴合其正式、道德性的语义。
- source_word: δικαία
  choice: 公义
  rationale: 表达诫命合乎正义、正直的性质，并与保罗书信中相关词群的常见译法保持适度一致。
- source_word: ἀγαθή
  choice: 良善
  rationale: 既表达道德上的善，也容纳其有益的性质；“良善”与前面的“圣洁、公义”并列，语体庄重自然。
- source_word: μὲν
  choice: 不单独译出
  rationale: 该语气词在此略带强调，但没有相应的δέ对举；其作用可由整句断言自然体现，强行译作“诚然”会使现代汉语显得多余。
theological_decisions:
- issue: νόμος是否明确译为“摩西律法”
  choice: 保留为“律法”
  alternative: 摩西律法
  rationale: 上下文确实指向摩西律法，但原句只用νόμος；保留“律法”可避免把语境信息直接写进正文而造成过度限定。
- issue: δικαία译作“公义”还是“公正”
  choice: 公义
  alternative: 公正
  rationale: 两者均可表达δικαία；“公义”更能保留保罗论述中的道德与神学色彩，而不把含义缩窄为司法层面的公平。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“也是”自然呈现律法与诫命之间的延续关系；三个并列形容词保持原文的简洁和强调。
