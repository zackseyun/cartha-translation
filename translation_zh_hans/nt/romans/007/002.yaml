  text: ἡ γὰρ ὕπανδρος γυνὴ τῷ ζῶντι ἀνδρὶ δέδεται νόμῳ· ἐὰν δὲ ἀποθάνῃ ὁ ἀνήρ, κατήργηται ἀπὸ τοῦ νόμου τοῦ ἀνδρός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/002.yaml
  text: For a married woman is bound by law to her husband while he lives; but if the husband dies[a], she is released from the law of her husband.
translation:
  language: zh_hans
  text: 因为已婚的妇人，在丈夫还活着的时候，受律法约束归属丈夫；但丈夫若死了[a]，她就脱离了丈夫的律法。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“她已从丈夫的律法中得释放。”这里的希腊文很可能指使她与丈夫维系婚姻关系的法律约束，而非丈夫自己制定的律法。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕπανδρος γυνή
  choice: 已婚的女人
  rationale: 表达处于婚姻约束之下的女子，现代汉语自然清楚，同时保留原文的法律—婚姻语境。
- source_word: τῷ ζῶντι ἀνδρί
  choice: 在丈夫活着的时候……受丈夫约束
  rationale: 将分词性的“活着的丈夫”自然展开为时间表达，准确突出约束持续到丈夫死亡为止。
- source_word: δέδεται
  choice: 受……约束
  rationale: 原文完成时被动语态强调既已形成并持续有效的约束状态；这一译法在汉语中兼顾法律意味与自然表达。
- source_word: νόμῳ
  choice: 按律法
  rationale: 这里无冠词，结合婚姻类比，可指具有约束力的法律原则；“按律法”不强行限定为摩西律法。
- source_word: κατήργηται
  choice: 脱离
  rationale: 在本语境中表示有关律法不再对她具有约束效力，而非律法本身被废除；“脱离”也与本章上下文的措辞相协调。
- source_word: ἀπὸ τοῦ νόμου τοῦ ἀνδρός
  choice: 脱离了约束她与丈夫关系的律法
  rationale: 属格结构较为浓缩；此译法说明所指是使她在婚姻中与丈夫相联的法律约束，避免误解为丈夫制定的律法。
theological_decisions:
- issue: νόμῳ及τοῦ νόμου是否专指摩西律法
  choice: 保留为婚姻关系中的一般法律约束，不专门指明摩西律法
  alternative: 理解为摩西律法中适用于婚姻的规定
  rationale: 本句直接以婚姻法律关系作类比，且第一次出现的νόμῳ无冠词；因此译文保留一般法律原则的含义，同时不排除犹太律法背景。
- issue: τοῦ νόμου τοῦ ἀνδρός中属格的关系
  choice: 理解为约束女人与丈夫关系的律法
  alternative: 直译为“丈夫的律法”
  rationale: 直译在现代汉语中容易暗示丈夫是立法者；展开关系可以传达原文压缩表达的法律—婚姻含义，但以脚注保留较直译形式。
translation_notes:
  register: 采用现代、庄重而通俗的书面汉语。“按律法受……约束”保留法律语域；后半句适度展开浓缩的希腊语属格，并用脚注呈现较直译的可能译法。
