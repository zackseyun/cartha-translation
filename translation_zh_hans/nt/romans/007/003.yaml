revisions:
- from: 所以，她丈夫还活着的时候，她若归了另一个男人，就会被称为淫妇。但丈夫若死了，她就脱离了这律法[a]；即使归了另一个男人，也不算淫妇。
  to: 所以，丈夫还活着的时候，她若嫁给别的男人，就会被称为犯奸淫的妇人；但丈夫若死了，她就不再受这律法[a]约束。这样，她即使嫁给别的男人，也不是犯奸淫的妇人。
  rationale: 修订使婚姻关系的表达更符合现代普通话，避免“淫妇”的不必要贬抑色彩，并以更自然的措辞表达丈夫死亡后解除婚姻法律约束的结果。脚注锚点保留并与正文“这律法”一致。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T03:51:08Z'
review_pass:
  verdict: revise
  source_fidelity: 草案准确传达了丈夫在世时与另一男子建立婚姻关系会被认定为通奸、丈夫死后即不再受该婚姻法律约束的基本论证。不过，“归了另一个男人”在现代普通话中不够自然，且“归”可能带有不必要的归属意味；在此法律—婚姻语境中，“嫁给别的男人”更清楚地传达γένηται/γενομένην ἀνδρὶ ἑτέρῳ所指的进入婚姻关系。后半句的分词不是独立条件句；以“这样，即使……”表达其在丈夫死后不构成通奸的结果，较贴近原文逻辑。
  naturalness: “淫妇”虽可见于传统译本，但在现代标准汉语里带有强烈贬抑色彩，也容易把法律/身份认定的表述变成辱骂性标签。“犯奸淫的妇人”较为庄重、中性，并准确保留女性名词μoiχαλὶς的含义。“不再受这律法约束”比“脱离了这律法”更符合现代汉语，并清楚说明ἐλευθέρα ἐστὶν ἀπὸ τοῦ νόμου的解除约束之意。
  terminology: 保留“律法”，并以脚注限定其在此处直接指婚姻关系所受的法律约束，避免把它在正文中过早释作某一特定法典。“犯奸淫的妇人”对应μοιχαλίς，不将其泛化为一般意义上的性不道德。
  issues:
  - severity: medium
    issue: “归了另一个男人”不够自然，关系含义也偏含混。
    rationale: γίνομαι加与格在这里是婚姻类比中的惯用表达，指成为另一男子的妻子/嫁与另一男子。中文“嫁给别的男人”既自然，又不额外扩展原文意义。
  - severity: medium
    issue: “淫妇”在现代汉语中贬抑性过强。
    rationale: 原文是在陈述法律及社会认定的身份，不是使用辱骂语。改为“犯奸淫的妇人”可维持准确、庄重的经文语体。
  - severity: low
    issue: “脱离了这律法”略显生硬。
    rationale: “不再受这律法约束”自然地表达从法律约束下得自由，且不改变νόμος在本节的保留性。
