  text: ἄρα οὖν ζῶντος τοῦ ἀνδρὸς μοιχαλὶς χρηματίσει ἐὰν γένηται ἀνδρὶ ἑτέρῳ· ἐὰν δὲ ἀποθάνῃ ὁ ἀνήρ, ἐλευθέρα ἐστὶν ἀπὸ τοῦ νόμου, τοῦ μὴ εἶναι αὐτὴν μοιχαλίδα γενομένην ἀνδρὶ ἑτέρῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/003.yaml
  text: So then[a], while her husband is living, she will be called an adulteress if she belongs to another man. But if the husband dies, she is free from the law[b], so that she is not an adulteress if she belongs to another man.
translation:
  language: zh_hans
  text: 所以，丈夫还活着的时候，她若嫁给别的男人，就会被称为犯奸淫的妇人；但丈夫若死了，她就不再受这律法[a]约束。这样，她即使嫁给别的男人，也不是犯奸淫的妇人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“律法”直接指约束婚姻关系的法律规定。
    reason: cultural_note
lexical_decisions:
- source_word: ἄρα οὖν
  choice: 所以
  rationale: 两个推论性连接词承接上文并引出结论；“所以”在现代汉语中自然、清楚。
- source_word: ζῶντος τοῦ ἀνδρός
  choice: 她丈夫还活着的时候
  rationale: 将属格独立结构译为同时发生的时间背景，并依上下文补出“她”。
- source_word: μοιχαλὶς
  choice: 淫妇
  rationale: 该名词特指犯奸淫的女子；“淫妇”简洁而准确，也符合经文庄重语体。
- source_word: χρηματίσει
  choice: 就会被称为
  rationale: 此处表示被称作或被认定为某种身份；译文保留将来意义和被动色彩。
- source_word: ἐὰν γένηται ἀνδρὶ ἑτέρῳ / γενομένην ἀνδρὶ ἑτέρῳ
  choice: 若／即使归了另一个男人
  rationale: γίνομαι加与格表示进入与另一男人的归属或结合关系。“归了”保留婚姻语境，又避免把原文明确化为“成为妻子”；第二处依分词与结果结构译作让步性的“即使”。
- source_word: ἐλευθέρα ἐστὶν ἀπὸ τοῦ νόμου
  choice: 她就脱离了这律法
  rationale: ἐλευθέρα表示不再受约束；“脱离”自然表达从法律约束中获释。“这”指向上下文所述的婚姻约束。
- source_word: τοῦ μὴ εἶναι αὐτὴν μοιχαλίδα
  choice: 也不算淫妇
  rationale: 以汉语结果表达呈现带冠词不定式的结果或后果关系，保持原句逻辑而避免生硬直译。
theological_decisions:
- issue: νόμος在本比喻中的范围
  choice: 正文译作“这律法”，脚注说明其直接所指
  alternative: 婚姻律法；泛指摩西律法
  rationale: 上下文直接谈丈夫生死对婚姻法律约束的影响；保留“律法”一词可避免把保罗的用语过度限定，同时用指示词和脚注澄清当前语境。
- issue: γένηται ἀνδρὶ ἑτέρῳ所表达的关系
  choice: 归了另一个男人
  alternative: 成为另一个男人的妻子；与另一个男人结合
  rationale: 原文表达进入与另一男人的关系，但未使用“妻子”一词；“归了”在汉语中可传达婚姻或伴侣归属关系，同时保存原文一定程度的含混。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“淫妇”虽略带传统书面色彩，却准确对应女性奸淫者；句法经过汉语化处理，以“即使……也……”自然表达后半句的结果与让步意味。
