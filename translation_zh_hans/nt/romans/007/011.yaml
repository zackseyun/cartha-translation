id: ROM.7.11
reference: Romans 7:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἡ γὰρ ἁμαρτία ἀφορμὴν λαβοῦσα διὰ τῆς ἐντολῆς ἐξηπάτησέν με καὶ δι’ αὐτῆς ἀπέκτεινεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/011.yaml
  text: For sin[a], having taken an opportunity through the commandment[b], deceived me and through it killed me.
translation:
  language: zh_hans
  text: 因为罪借着诫命得了可乘之机[a]，欺骗了我，又借着它[b]杀了我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “得了可乘之机”也可译作“抓住了机会”。
    reason: lexical_alternative
  - marker: b
    text: “它”指前面的“诫命”。
    reason: referent_clarification
lexical_decisions:
- source_word: γὰρ
  choice: 因为
  rationale: 保留本节对前文的解释和说明作用；现代汉语中“因为”连接自然。
- source_word: ἁμαρτία
  choice: 罪
  rationale: 采用保罗书信中的常用译法，并保留“罪”作为一连串行动之主语的拟人化力量。
- source_word: ἀφορμὴν λαβοῦσα
  choice: 得了可乘之机
  rationale: 表达罪取得并利用机会或突破口的意思；“可乘之机”在现代汉语中自然，也没有额外说明机会的性质。
- source_word: διὰ τῆς ἐντολῆς
  choice: 借着诫命
  rationale: 准确表达 διά 加属格在此所表示的途径或媒介，并保留“诫命”的单数形式。
- source_word: ἐξηπάτησέν
  choice: 欺骗了
  rationale: 清楚表达欺骗、诱入歧途的核心意义，不以“彻底”等词过度凸显复合动词的加强色彩。
- source_word: με
  choice: 我
  rationale: 直接保留第一人称单数宾语。
- source_word: δι’ αὐτῆς
  choice: 借着它
  rationale: 保留原文的代词和工具性含义；脚注说明其先行词是“诫命”，避免中文读者误解。
- source_word: ἀπέκτεινεν
  choice: 杀了
  rationale: 简洁而直接地传达致死之意，也延续本句中罪作为行动者的强烈形象。
theological_decisions:
- issue: 保罗对“罪”的拟人化程度
  choice: 让“罪”直接作“得了可乘之机、欺骗、杀了”的行动主体。
  alternative: 把“罪”弱化为抽象原因或结果。
  rationale: 希腊文明确以“罪”为语法主语，并连续赋予它主动行为；译文保留这种修辞与神学张力，不另加解释。
- issue: 诫命与死亡之间的关系
  choice: 译作罪“借着”诫命欺骗并杀害，保留工具或途径关系。
  alternative: 改写为诫命本身实施欺骗和杀害。
  rationale: 原文中实施行动的主语是“罪”，诫命则由 διά 短语引入；这样翻译既不把罪责转给诫命，也不削弱原文令人不安的关联。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句子保持简洁有力，以连续动词呈现“罪”的主动作用；“借着它”保留原文代词，并以脚注消除指代歧义。
