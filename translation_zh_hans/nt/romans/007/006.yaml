  text: νυνὶ δὲ κατηργήθημεν ἀπὸ τοῦ νόμου, ἀποθανόντες ἐν ᾧ κατειχόμεθα, ὥστε δουλεύειν ἡμᾶς ἐν καινότητι πνεύματος καὶ οὐ παλαιότητι γράμματος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/006.yaml
  text: But now we have been released from the law[a], having died to what held us[c][b], so that we serve in newness of the Spirit and not in oldness of the letter.
translation:
  language: zh_hans
  text: 但如今，我们既已向那曾束缚我们的死了，就脱离了律法，为要以圣灵[b]的新样式服事，而不是以字句[c]的旧样式。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 或译：“灵”。
    reason: alternative_reading
  - marker: c
    text: 或译：“成文法规”。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατηργήθημεν ἀπὸ τοῦ νόμου
  choice: 脱离了律法
  rationale: 这里的被动形式与ἀπό连用，表示不再受律法约束，并非表示律法本身已不存在。“脱离了律法”自然地传达这种关系上的解除。
- source_word: ἀποθανόντες
  choice: 既已……死了
  rationale: 保留不定过去时分词所表达的先行情形，并清楚表明死去的是“我们”，不是律法。
- source_word: ἐν ᾧ κατειχόμεθα
  choice: 向那拘禁我们的
  rationale: κατέχω在这里有扣住、拘禁或束缚之意；此译法结合“向……死了”的保罗式表达，传达信徒从先前辖制中脱离的意思，同时不把关系所指过度具体化。
- source_word: δουλεύειν
  choice: 服事
  rationale: 既保留δουλεύω所含的隶属与效力意味，也符合本句论述服事方式的语境。
- source_word: καινότητι
  choice: 新样式
  rationale: 以自然中文表达抽象名词“新”，并与后面的“旧样式”形成对称。
- source_word: πνεύματος
  choice: 圣灵
  rationale: 保罗笔下“灵”与“字句”的对照及新约背景较支持指圣灵；原文没有冠词且仍可能泛指“灵”，故在脚注保留另一理解。
- source_word: παλαιότητι
  choice: 旧样式
  rationale: 与“新样式”形成修辞上的平衡，并表达旧有状态或方式。
- source_word: γράμματος
  choice: 字句
  rationale: 这是γράμμα的直接对应，也保留保罗“灵—字句”的惯用对照；“成文法规”是较具解释性的可能译法。
theological_decisions:
- issue: 是律法死了，还是信徒向先前拘禁他们的事物死了
  choice: 信徒是死去的主体：“我们既已向那拘禁我们的死了”
  alternative: 律法相对于信徒死了
  rationale: ἀποθανόντες是主格复数分词，与隐含主语“我们”一致，因此语法上是信徒死了；译文不把“死”归给律法。
- issue: πνεύματος是指圣灵还是人的灵
  choice: 圣灵
  alternative: 灵
  rationale: “灵”与“字句”的保罗式对照及新约语境使圣灵更为可能，但原文形式本身容许较宽泛的理解，因此以脚注保留。
- issue: γράμματος是一般的字句还是成文法规
  choice: 字句
  alternative: 成文法规
  rationale: “字句”较直接，并保留原文的神学张力；“成文法规”可帮助说明其在律法语境中的所指，但解释性更强。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“向……死了”略带保罗书信特有的表达张力，予以保留；“新样式／旧样式”使原文两个抽象名词的对称在中文中清楚可读。
