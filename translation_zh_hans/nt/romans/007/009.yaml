source:
  edition: SBLGNT
  text: ἐγὼ δὲ ἔζων χωρὶς νόμου ποτέ· ἐλθούσης δὲ τῆς ἐντολῆς ἡ ἁμαρτία ἀνέζησεν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/009.yaml
  text: I was once alive apart from the law[a], but when the commandment came, sin came to life,
translation:
  language: zh_hans
  text: 从前，我在律法之外是活着的；但诫命一来到，罪就活过来了[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“罪又活了。”
    reason: ἀνέζησεν可表达“活过来”，也可理解为“重新活起来”。脚注保留其可能带有“再度活跃”意味的词义选择。
lexical_decisions:
- source_word: ἔζων
  choice: 我是活着的
  rationale: 采用状态性表达，以保留上下文中“生”与“死”的对照，而不只表达一般的“生活”。
- source_word: χωρὶς νόμου
  choice: 没有律法的时候
  rationale: 用自然的现代汉语表达“与律法分离、没有律法”的情形；不额外断定这里所说的具体救赎历史阶段。
- source_word: ποτέ
  choice: 从前
  rationale: 简洁表达过去某一时期，与保罗的回顾语气相符。
- source_word: ἐλθούσης ... τῆς ἐντολῆς
  choice: 诫命一来
  rationale: 将独立属格结构自然转换为汉语时间从句，同时保留诫命“来到”的事件性表达。
- source_word: ἐντολῆς
  choice: 诫命
  rationale: 沿用现代汉语圣经语境中清楚而庄重的常用词，并与“律法”形成合宜关联。
- source_word: ἁμαρτία
  choice: 罪
  rationale: 保留单数及拟人化用法，不改写为具体的罪行。
- source_word: ἀνέζησεν
  choice: 活了过来
  rationale: 保留拟人化的生命意象，现代汉语自然易懂；同时不把它限定为字面复活。
theological_decisions:
- issue: 第一人称“我”究竟是保罗自传性的陈述，还是代表以色列或人类发言
  choice: 保留单纯的第一人称“我”，不作解释性扩写
  alternative: 明确译成保罗个人的经历，或明确译成以色列／全人类的代表性经历
  rationale: 本节希腊文本本身没有解决这一较大的诠释问题，因此译文保留其神学张力与歧义。
translation_notes:
  register: 采用自然、庄重且易懂的现代标准汉语。“但”承接原文两个δέ所形成的转折推进；不用句首“如今”等原文没有的时间或话语标记。
