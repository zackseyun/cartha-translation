  text: νυνὶ δὲ οὐκέτι ἐγὼ κατεργάζομαι αὐτὸ ἀλλὰ ἡ ⸀οἰκοῦσα ἐν ἐμοὶ ἁμαρτία.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/017.yaml
  text: But now I am no longer the one doing it[a], but sin dwelling in me.
translation:
  language: zh_hans
  text: 但如今，做这事的不再是我[a]，而是住在我里面的罪。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“但如今，不再是我做这事，而是住在我里面的罪做的。”
    reason: 语序替代；较贴近希腊文中“我”在否定结构里的突出位置。
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: 但如今
  rationale: 兼顾逻辑转折与当前论证阶段；“但如今”在现代汉语中自然地承接上文并突出对比。
- source_word: οὐκέτι ἐγὼ κατεργάζομαι αὐτό
  choice: 不再是我做这事
  rationale: “不再”表达οὐκέτι，“是我”体现显式代词ἐγώ的强调；“做这事”自然指回上文所说的行为。
- source_word: κατεργάζομαι
  choice: 做
  rationale: 本语境指实际行出或实施有关行为；“做”清楚自然，也与下半句省略但可补出的同一谓语相呼应。
- source_word: ἡ οἰκοῦσα ἐν ἐμοὶ ἁμαρτία
  choice: 住在我里面的罪
  rationale: 保留οἰκέω的居住意象以及保罗对“罪”的人格化表达，语体庄重而易懂。
theological_decisions:
- issue: “我”与“住在我里面的罪”之间的强烈区分可能被理解为推卸责任。
  choice: 照原文保留这一鲜明区分，不加解释性缓和。
  alternative: 改写为“这是我里面罪的作用”，以强调内在冲突并弱化施事区分。
  rationale: 原文有意形成“不是我……而是罪……”的张力；译文不应替作者消解其神学与人论上的张力。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“住在我里面”保留原文居住隐喻；末尾补出“做的”，使汉语句子完整，并明确“罪”是与前半句对照的施事者。
