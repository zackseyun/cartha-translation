id: ROM.7.13
reference: Romans 7:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Τὸ οὖν ἀγαθὸν ἐμοὶ ⸀ἐγένετο θάνατος; μὴ γένοιτο· ἀλλὰ ἡ ἁμαρτία, ἵνα φανῇ ἁμαρτία διὰ τοῦ ἀγαθοῦ μοι κατεργαζομένη θάνατον· ἵνα γένηται καθ’ ὑπερβολὴν ἁμαρτωλὸς ἡ ἁμαρτία διὰ τῆς ἐντολῆς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/013.yaml
  text: So then[a], did what is good become death to me? May it never be! Rather, it was sin, so that it might be shown to be sin by producing death in me through what is good[b], in order that through the commandment sin might become exceedingly sinful.
translation:
  language: zh_hans
  text: 那么，那良善的事物[a]难道给我成了死亡吗？绝非如此！不，是罪借着那良善的事物给我造成死亡，为要显明罪是罪；又为要使罪借着诫命变得极其罪恶。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“那良善的”或“良善之物”。本节原文没有重复使用“诫命”一词，虽其所指与上下文的诫命密切相关。
    reason: lexical_alternative
  - marker: b
    text: 两处“为要”也可译作“以致”，以突出所产生的结果。
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: Τὸ ... ἀγαθὸν
  choice: 那良善的事物
  rationale: 将中性形容词的名词化用法译出，既保留其概括性，也以现代汉语自然表达；上下文所指是良善的诫命。
- source_word: ἐμοὶ ἐγένετο θάνατος
  choice: 对我成了死亡
  rationale: 保留 γίνομαι 的表语结构和与格所表达的个人关系，避免把良善之物直接说成有罪地“导致”死亡。
- source_word: μὴ γένοιτο
  choice: 绝非如此！
  rationale: 以简明有力的现代汉语表达保罗强烈的否定。
- source_word: ἡ ἁμαρτία
  choice: 罪
  rationale: 保留抽象名词及其在本句中的人格化施事作用。
- source_word: ἵνα φανῇ ἁμαρτία
  choice: 为要显明罪确实是罪
  rationale: 保留重复“罪”所产生的强调，并表达 φανῇ 在此使罪显露其真实性质的含义。
- source_word: διὰ τοῦ ἀγαθοῦ
  choice: 借着那良善的事物
  rationale: 与前半句保持词语呼应，并保留 διά 的工具或媒介意义。
- source_word: μοι κατεργαζομένη θάνατον
  choice: 给我造成死亡
  rationale: κατεργάζομαι 表示产生实际结果；“给我”保留与格的受事关联，而不武断限定为“在我里面”。
- source_word: καθ’ ὑπερβολὴν ἁμαρτωλὸς
  choice: 罪恶至极
  rationale: 以自然有力的汉语保留“超过寻常程度”的强化含义，同时延续原文“罪—罪恶”的修辞呼应。
- source_word: διὰ τῆς ἐντολῆς
  choice: 借着诫命
  rationale: 保留诫命作为罪显露并发展至极端之媒介的语法关系，不把责任归给诫命本身。
theological_decisions:
- issue: 良善的诫命与死亡之间的责任归属
  choice: 明确否认良善之物本身成了致死的罪责主体，并把造成死亡的行动归于罪。
  alternative: 可较宽泛地译成良善的诫命本身导致了死亡。
  rationale: ἀλλὰ ἡ ἁμαρτία 所形成的强烈转折把施事责任放在罪上；译文保留罪借良善之物运作的张力，而不贬损诫命的良善。
- issue: 两个 ἵνα 从句的目的或结果色彩
  choice: 正文译作“为要”，保留目的色彩，并用脚注说明也可理解为结果。
  alternative: 译作“以致”，突出结果。
  rationale: ἵνα 在此既可表达罪的作用被揭露所达成的目的，也可带有结果意味；脚注保留这一真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“对我成了死亡”略带保罗原句的凝缩感，以保留其反问力度；后半句则用自然汉语明确罪是造成死亡的施事者。所有脚注标记均已置于正文相应位置。
