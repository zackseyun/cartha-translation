  text: ἐγὼ δὲ ἀπέθανον, καὶ εὑρέθη μοι ἡ ἐντολὴ ἡ εἰς ζωὴν αὕτη εἰς θάνατον·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/010.yaml
  text: and I died[b][a], and the commandment that was for life proved to be for death to me.
translation:
  language: zh_hans
  text: 我就死了；这条本是通向生命的诫命，结果对我反倒成了死亡。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这条为生命的诫命，对我反倒显明是归于死亡的。”
    reason: 保留原文“为生命／归于死亡”两个 εἰς 短语的平行结构，以及 εὑρέθη μοι 所表达的较中性的发现或结果关系。
lexical_decisions:
- source_word: ἀπέθανον
  choice: 我却死了
  rationale: 不定过去时主动直陈语气第一人称单数，直接陈述发生的结果；“却”承接上下文并突出转折。
- source_word: εὑρέθη μοι
  choice: 反倒显明是使我……的
  rationale: 该被动形式与间接受格 μοι 表达说话者所发现或经历的结果；“显明是”比生硬的“被我发现是”更符合现代汉语。
- source_word: ἡ ἐντολή
  choice: 那……诫命
  rationale: 保留单数及保罗书信中的律法语境，不添加原文没有的“律法的”。
- source_word: ἡ εἰς ζωὴν
  choice: 本来是为生命的
  rationale: “为生命”贴近 εἰς ζωή 的方向或结果含义；“本来”自然表达其预期指向，但不把含义限定为主观意图。
- source_word: αὕτη
  choice: 那……诫命
  rationale: 指回刚提到的诫命。汉语以指示词“那”表达其回指作用，避免机械重复“这一个”。
- source_word: εἰς θάνατον
  choice: 使我死亡的
  rationale: 在现代汉语中自然表达 εἰς θάνατον 对说话者产生的死亡结果；脚注保留更形式对应、因果色彩较弱的译法。
theological_decisions:
- issue: 是否将诫命与死亡之间的关系明确译成直接致死的因果关系
  choice: 正文译作“显明是使我死亡的”，表达保罗所经历的结果，但不另加解释
  alternative: 显明对我竟是为死亡的
  rationale: 原文以两个 εἰς 短语形成“生命—死亡”的张力，并陈述诫命在“我”身上显出的结果；不应进一步说明诫命本身是否为死亡的终极原因。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“反倒”清楚呈现生命与死亡的逆转；分号保留两小句之间紧密的逻辑关系。正文中的脚注标记与脚注条目一致。
