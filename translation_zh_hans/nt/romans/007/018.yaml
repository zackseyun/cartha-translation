  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οἶδα γὰρ ὅτι οὐκ οἰκεῖ ἐν ἐμοί, τοῦτ’ ἔστιν ἐν τῇ σαρκί μου, ἀγαθόν· τὸ γὰρ θέλειν παράκειταί μοι, τὸ δὲ κατεργάζεσθαι τὸ καλὸν ⸀οὔ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/018.yaml
  text: For I know that nothing good dwells in me—that is[a], in my flesh. For the willing is present with me, but the doing of the good is not.
translation:
  language: zh_hans
  text: 因为我知道，在我里面，也就是在我的肉体里，没有良善。因为我有行善的意愿，却不能实行那善。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本在句末作“我找不到”；据此可译作：“但我找不到把那善实行出来的办法。”
    reason: textual_variant
lexical_decisions:
- source_word: οἶδα
  choice: 我知道
  rationale: 该完成时形式在这里具有现在时意义；“我知道”自然、准确。
- source_word: οἰκεῖ
  choice: 在……里面
  rationale: 结合否定式译为“在我里面……没有”，以自然中文表达“居住、内住”的意思；这里的空间性措辞仍保留内在存在的意象。
- source_word: ἀγαθόν
  choice: 良善
  rationale: 这是无冠词的中性单数形容词作名词用；与否定词连用，译成“没有良善”简洁庄重，也不把它缩窄为某一件好事。
- source_word: σάρξ
  choice: 肉体
  rationale: 保留保罗所用的身体性词语及其神学张力，不在正文中直接解释成“罪性”。
- source_word: τὸ θέλειν
  choice: 立志行善
  rationale: 有冠词的不定式表示“意愿、愿意”；依上下文补出“行善”，使中文完整自然，并与后半句形成清晰对照。
- source_word: παράκειταί μοι
  choice: 由得我
  rationale: 在此表达意愿是自己现成具备、可以做到的；“由得我”与下句“由不得我”形成简洁有力的中文对偶。
- source_word: τὸ κατεργάζεσθαι τὸ καλόν
  choice: 行出善来
  rationale: κατεργάζεσθαι 强调实际做成、成就；“行出善来”保留从意愿到付诸实行的对比。
- source_word: οὔ
  choice: 却由不得我
  rationale: 原文末尾是省略式否定；中文补足与前句相对的谓语，保留其简短而强烈的转折。
theological_decisions:
- issue: 在保罗带有道德含义的语境中如何翻译 σάρξ
  choice: 肉体
  alternative: 罪性
  rationale: “肉体”最直接对应 σάρξ，并保留“我”与“我的肉体”之间未经解释消解的张力；“罪性”虽可表达一种解释方向，却会把诠释写入正文。
- issue: “没有良善”所限定的范围
  choice: 按同位说明限定为“在我的肉体里”
  alternative: 理解为对完整人格毫无限定的绝对否定
  rationale: 原文 τοῦτ’ ἔστιν ἐν τῇ σαρκί μου 明确修正、说明“在我里面”的所指，译文保留这一限定，不扩大或削弱保罗的表述。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“立志行善……行出善来”呈现 θέλειν 与 κατεργάζεσθαι 的对照；“由得我……由不得我”使省略结构在中文中清楚有力。正文保留“肉体”，不以解释性较强的“罪性”取代。
