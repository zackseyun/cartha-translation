    issue: “立志行善”把θέλειν的对象明确化为“行善”。
    rationale: 原文的第一个不定式仅为“愿意／意愿”，并未直接带“善”作宾语；“那善”只在后一个不定式中出现。中文为通顺可在语境中适度理解，但不宜在正文中将其完全合并为“立志行善”。
  - severity: medium
    issue: “由得我……由不得我”过度解释παράκειταί μοι与末尾οὔ。
    rationale: παράκειταί μοι意为“在我这里／现成在我这里”，末尾是否定该对应项；该对偶并不直接使用“能不能由我”的措辞。修订以“有……意愿，却不能实行”较自然地表达上下文的实际对照，同时避免“由得我”的陈旧语感。
  - severity: low
    issue: 异文脚注的措辞可更准确地说明其位置与所补文字。
    rationale: 脚注应说明部分抄本在末尾读作“我找不到”，并使译出的补足与“实行那善”相连；这既保留SBLGNT正文的短读法，也准确呈现异文。
