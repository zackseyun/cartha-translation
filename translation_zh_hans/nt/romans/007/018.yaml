revisions:
- from: 因为我知道，在我里面，就是在我的肉体里，没有良善。因为立志行善由得我，行出善来却由不得我。[a]
  to: 因为我知道，在我里面，也就是在我的肉体里，没有良善。因为我有行善的意愿，却不能实行那善。[a]
  rationale: 修订保留“肉体”及“良善”的非教派性表达，并使“愿意”与“实行那善”的对比符合原文。为使现代中文自然，采用“有行善的意愿，却不能实行那善”；“行善”在前句是由紧邻的“那善”所作的语境性补足，而非另行引入神学解释。异文脚注保留并澄清其所对应的句末增读。
