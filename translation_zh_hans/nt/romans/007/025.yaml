source:
  edition: SBLGNT
  text: ⸀χάρις τῷ θεῷ διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν. Ἄρα οὖν αὐτὸς ἐγὼ τῷ μὲν νοῒ δουλεύω νόμῳ θεοῦ, τῇ δὲ σαρκὶ νόμῳ ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/025.yaml
  text: Thanks be to God through Jesus the Messiah our Lord! So then[a], I myself serve the law of God with my mind[c][b], but with my flesh the law of sin.
translation:
  language: zh_hans
  text: 感谢上帝，借着我们的主耶稣基督！这样看来，我自己在心思上服事上帝的律法，在肉体[a]上却服事罪的律法[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “肉体”也可理解为“罪性”。
    reason: lexical_alternative
  - marker: b
    text: “罪的律法”也可译作“罪的法则”。
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις τῷ θεῷ
  choice: 感谢上帝
  rationale: 在这一感叹式结构中，χάρις 与间接受格 τῷ θεῷ 构成感谢用语，并非在此陈述“恩典”本身。
- source_word: διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν
  choice: 借着我们的主耶稣基督
  rationale: διά 加属格表示媒介，译为“借着”；“我们的主耶稣基督”符合现代汉语基督教语体，同时保留 Χριστός 的传统称谓。
- source_word: Ἄρα οὖν
  choice: 这样看来
  rationale: 两个推论性小词共同引出总结；“这样看来”自然表达其承接和归结作用。
- source_word: αὐτὸς ἐγώ
  choice: 我自己
  rationale: 保留原文对第一人称的强调。
- source_word: τῷ μὲν νοῒ
  choice: 以内心
  rationale: νοῦς 指人的心思、理智或内在认知官能；此处译作“内心”，与“肉体”形成自然而不失张力的对照。
- source_word: δουλεύω
  choice: 服事
  rationale: 该动词带有作奴仆、受役使的意味；“服事”在本句平行结构中通顺，并保留归属和效力于某一律法的含义。
- source_word: νόμῳ θεοῦ
  choice: 上帝的律法
  rationale: 保留 νόμος 为“律法”，与下文“罪的律法”形成原文刻意的平行。
- source_word: τῇ δὲ σαρκὶ
  choice: 肉体却
  rationale: 直译 σάρξ 为“肉体”，不把它直接解释成“罪性”，从而保留保罗用语的歧义及神学张力。
- source_word: νόμῳ ἁμαρτίας
  choice: 罪的律法
  rationale: 保留 νόμος 的词汇重复与两种律法之间的对照，不在正文中解释为抽象的“原则”。
theological_decisions:
- issue: 在保罗具有道德色彩的语境中如何翻译 σάρξ
  choice: 肉体
  alternative: 罪性
  rationale: 原文使用 σάρξ，而不是明确表示罪恶本性的词；“肉体”避免将一种可能的神学解释直接写进正文。
- issue: νόμος 在“罪的律法”中的含义
  choice: 律法
  alternative: 法则
  rationale: 译作“律法”保留与“上帝的律法”的明确平行；“法则”虽较具解释性，却会弱化原文的重复和张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“感谢上帝”保留感叹语气；后半句维持“内心／肉体”和“上帝的律法／罪的律法”两组平行对照。所有脚注标记均置于正文相关句末。
