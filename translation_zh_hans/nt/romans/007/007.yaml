  text: Τί οὖν ἐροῦμεν; ὁ νόμος ἁμαρτία; μὴ γένοιτο· ἀλλὰ τὴν ἁμαρτίαν οὐκ ἔγνων εἰ μὴ διὰ νόμου, τήν τε γὰρ ἐπιθυμίαν οὐκ ᾔδειν εἰ μὴ ὁ νόμος ἔλεγεν· Οὐκ ἐπιθυμήσεις·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/007.yaml
  text: What then shall we say? Is the law sin? May it never be! On the contrary[a], I would not have known sin except through the law. For I would not have known coveting if the law had not said, "You shall not covet."
translation:
  language: zh_hans
  text: 那么，我们该说什么呢？律法就是罪吗？绝对不是！只是，若不是借着律法，我就不会认识罪。因为若不是律法说：“不可贪恋”，我就不会知道何为贪恋[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “贪恋”原文也可译作“欲望”；但这里紧接着引述“不可贪恋”的诫命，因此正文采用较具体的译法。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: 那么，我们该说什么呢？
  rationale: 保留保罗推进论述时惯用的设问形式，同时采用自然、庄重的现代汉语。
- source_word: ὁ νόμος
  choice: 律法
  rationale: 上下文所指为摩西律法；“律法”是保罗书信中 νόμος 的通行且准确的汉语对应词。
- source_word: ἁμαρτία
  choice: 罪
  rationale: 直接保留该词的神学含义；在“律法就是罪吗”中维持原文谓语名词所表达的同一性问题。
- source_word: μὴ γένοιτο
  choice: 绝对不是！
  rationale: 以有力而自然的现代汉语传达原文强烈否定，避免弱化为普通的“不”。
- source_word: ἀλλὰ
  choice: 相反
  rationale: 清楚表达强烈否定之后的转折和纠正关系。
- source_word: τὴν ἁμαρτίαν οὐκ ἔγνων εἰ μὴ διὰ νόμου
  choice: 要不是借着律法，我就不会认识罪
  rationale: 用“要不是……就不会……”自然表达 εἰ μὴ 的反事实关系；“认识罪”既贴近 ἔγνων，也不把含义限制为纯粹的知识理解。
- source_word: ἐπιθυμίαν
  choice: 贪恋
  rationale: 该词本可泛指欲望，但紧接着引述“不可贪恋”的诫命，因此正文采用此处较具体的含义，同时以脚注保留较宽泛的可能性。
- source_word: οὐκ ᾔδειν
  choice: 我就不会知道何为
  rationale: “知道何为贪恋”在汉语中自然，并与前句“认识罪”保持语义关联，同时适度反映希腊文此处换用了不同的认知动词。
- source_word: Οὐκ ἐπιθυμήσεις
  choice: 不可贪恋
  rationale: 以庄重简洁的汉语表达诫命的禁止语气，并保持名词“贪恋”与引文动词之间的词义呼应。
theological_decisions:
- issue: 律法与罪的关系
  choice: 律法就是罪吗？绝对不是！
  alternative: 律法是有罪的吗？
  rationale: 原文以谓语名词提出律法是否等同于罪，而不只是询问律法是否具有罪恶性质；正文保留这一更尖锐的问法及保罗强烈的否定。
- issue: 人借律法认识罪的性质
  choice: 要不是借着律法，我就不会认识罪
  alternative: 我只是借着律法才认出罪来
  rationale: 保留原文关于律法使人认识罪的陈述，不进一步断定这种“认识”仅指辨认、亲身经历或某种特定的神学机制。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。设问与强烈否定保留保罗论证的力度；反事实句式调整为自然汉语语序。引号使用中文全角形式，脚注标记置于相关词语之后。
