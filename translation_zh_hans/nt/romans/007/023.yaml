  text: βλέπω δὲ ἕτερον νόμον ἐν τοῖς μέλεσίν μου ἀντιστρατευόμενον τῷ νόμῳ τοῦ νοός μου καὶ αἰχμαλωτίζοντά με ⸀ἐν τῷ νόμῳ τῆς ἁμαρτίας τῷ ὄντι ἐν τοῖς μέλεσίν μου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/023.yaml
  text: But I see another law in my members[b][a], waging war against the law of my mind and taking me captive to the law of sin that is in my members.
translation:
  language: zh_hans
  text: 但我看见，在我的肢体中另有一个律[a]，与我心思的律交战，并把我掳去，使我受制于那在我肢体中的罪的律[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里反复使用的“律”，也可理解为“法则”或“力量”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“把我掳在那在我肢体中的罪的律中”；“使我受制于”表达被掳后落在其权势之下的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπω
  choice: 我看见
  rationale: 保留现在时的直接感和保罗生动的自我描述；现代汉语中自然清楚。
- source_word: ἕτερον νόμον
  choice: 另有一个律
  rationale: “另有一个”表达与前文之“律”的对照；用“律”而非直接解释为“法则”或“力量”，以保留反复出现的 νόμος 所形成的修辞张力。
- source_word: ἐν τοῖς μέλεσίν μου
  choice: 我肢体中
  rationale: μέλη 是身体各部分的具体比喻；“肢体”既保留保罗书信的惯用表达，也不将其笼统化为“身体”。
- source_word: ἀντιστρατευόμενον
  choice: 交战
  rationale: 保留原文鲜明的军事意象，并与后面的“掳去”相呼应。
- source_word: τῷ νόμῳ τοῦ νοός μου
  choice: 与我心思的律
  rationale: νοῦς 指人的思想、理解和意志活动；“心思”在现代汉语中兼具内在思维与意向色彩，比单用“思想”更适合此处。
- source_word: αἰχμαλωτίζοντά με
  choice: 把我掳去
  rationale: 保留俘虏的军事图像及其强制性。
- source_word: ἐν τῷ νόμῳ τῆς ἁμαρτίας
  choice: 使我受制于……罪的律
  rationale: ἐν 的字面形式是“在……中”，但与“掳去”连用表示被置于某种辖制之下；“受制于”在汉语中自然地传达这一结果，同时用脚注保留较直译的可能。
- source_word: ἁμαρτίας
  choice: 罪
  rationale: 这是清楚、标准且符合上下文的对应词。
theological_decisions:
- issue: 本节反复出现的 νόμος 应译为“律”，还是解释性地译作“法则”或“力量”
  choice: 正文各处均译为“律”
  alternative: 可译为“法则”或“力量”
  rationale: 统一保留“律”能呈现保罗刻意重复同一词所造成的张力，不预先判定这里究竟主要是规范、原则还是支配力量。
- issue: ἐν τῷ νόμῳ τῆς ἁμαρτίας 与“掳去”的关系
  choice: 译为“使我受制于……罪的律”
  alternative: 较直译为“掳我在……罪的律中”
  rationale: 正文采用自然汉语表达被俘后落入辖制的意义，脚注则交代原文介词结构，避免掩盖其形式和可能的细微差别。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留“交战—掳去”的军事图像，并以“肢体”维持原文具体的身体隐喻。脚注标记均置于正文相应词句之后。
