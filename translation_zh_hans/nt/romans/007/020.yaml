  text: εἰ δὲ ὃ οὐ ⸀θέλω τοῦτο ποιῶ, οὐκέτι ἐγὼ κατεργάζομαι αὐτὸ ἀλλὰ ἡ οἰκοῦσα ἐν ἐμοὶ ἁμαρτία.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/020.yaml
  text: But if I do what I do not want[a], I am no longer the one doing it, but sin dwelling in me.
translation:
  language: zh_hans
  text: 可是，如果我做自己不愿意做的事，那么做这事的就不再是我，而是住在我里面的罪。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ δὲ
  choice: 可是，如果
  rationale: 承接上文的条件论证并带出轻微转折；现代汉语中自然、清楚。
- source_word: ὃ οὐ θέλω τοῦτο ποιῶ
  choice: 我做了自己不愿意做的事
  rationale: 保留“不愿意”与“做”之间的反差，同时将希腊语的关系—指示结构转换成自然的现代汉语。
- source_word: οὐκέτι ἐγὼ κατεργάζομαι αὐτό
  choice: 做这事的就不再是我
  rationale: “不再”准确表达οὐκέτι；“做这事的……不是我”保留显式ἐγώ的强调，并以自然汉语表达κατεργάζομαι的施行动作之意。
- source_word: ἡ οἰκοῦσα ἐν ἐμοὶ ἁμαρτία
  choice: 住在我里面的罪
  rationale: 直接翻译ἁμαρτία为“罪”，不改译为“罪性”；“住在……里面”保留οἰκοῦσα的居住意象及罪的拟人化表达。
theological_decisions:
- issue: “我”与“住在我里面的罪”之间的关系是否应在译文中加以解释
  choice: 直接保留二者的鲜明对照
  alternative: 用解释性改写弱化人的主体责任，或把“罪”改译为“罪性”
  rationale: 原文有意把“我”与“住在我里面的罪”并置；译文应保留这种神学张力，不替保罗解决其含义，也不把ἁμαρτία换成原文没有使用的概念。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“可是，如果”自然衔接上文；全句保持原文条件句和强烈对照，不作教义性扩写。
