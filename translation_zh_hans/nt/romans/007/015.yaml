id: ROM.7.15
reference: Romans 7:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὃ γὰρ κατεργάζομαι οὐ γινώσκω· οὐ γὰρ ὃ θέλω τοῦτο πράσσω, ἀλλ’ ὃ μισῶ τοῦτο ποιῶ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/015.yaml
  text: For I do not understand what I am doing, because I do not practice what I want; instead, I do the very thing I hate.
translation:
  language: zh_hans
  text: 因为我不明白自己所做的；我想要的，我不去实行；我所恨的，我反而去做。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατεργάζομαι
  choice: 所做的
  rationale: 此处指实际做出来的行为；译作“所做的”自然清楚，也保留与后文行为动词的联系。
- source_word: οὐ γινώσκω
  choice: 不明白
  rationale: γινώσκω在这里可指不理解、无法认同自己的行为，而非对行为毫无意识；“不明白”保留这种语义张力。
- source_word: θέλω
  choice: 想要
  rationale: 表达意愿或内在愿望，不额外解释为道德能力或决定。
- source_word: πράσσω
  choice: 实行
  rationale: 与“想要的”搭配自然，并体现持续付诸实践的意味。
- source_word: μισῶ
  choice: 恨
  rationale: 直接保留原文强烈的厌恶用语。
- source_word: ποιῶ
  choice: 做
  rationale: 以现代汉语最自然的普通行为动词呈现，并与前面的“实行”形成原文近义动词的轻微区分。
theological_decisions:
- issue: 说话者身份及其经历所处阶段
  choice: 不在译文中判定
  alternative: 通过措辞明确解释为重生前或重生后的经历
  rationale: 本节本身未明确界定说话者的属灵阶段；直译其意志与行为的冲突，保留上下文中的神学张力。
- issue: γάρ与前句的逻辑关系
  choice: 译作“因为”
  alternative: 译作“原来”或“诚然”
  rationale: γάρ最自然地把本节作为前述陈述的说明或理由；“因为”清楚呈现这一解释关系，但不增加原文没有的因果内容。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。用三个并列分句保留原文的论证推进与鲜明对照；“反而”对应ἀλλά所引出的转折。
