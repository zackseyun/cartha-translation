id: ROM.7.14
reference: Romans 7:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Οἴδαμεν γὰρ ὅτι ὁ νόμος πνευματικός ἐστιν· ἐγὼ δὲ ⸀σάρκινός εἰμι, πεπραμένος ὑπὸ τὴν ἁμαρτίαν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/014.yaml
  text: For we know that the law is spiritual[a], but I am fleshly[b], sold under sin.
translation:
  language: zh_hans
  text: 因为我们知道，律法是属灵的；但我是属肉体的[a]，已经被卖在罪之下[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“由肉体构成的”或“属血肉的”。
    reason: lexical_alternative
  - marker: b
    text: 也可理解为：“已经被卖作奴隶，受罪辖制。”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδαμεν
  choice: 我们知道
  rationale: 表达保罗与读者共同承认的确定认识，直译自然。
- source_word: ὁ νόμος
  choice: 律法
  rationale: 按《罗马书》语境通常指摩西律法；“律法”是现代中文圣经语体中准确而通行的对应词。
- source_word: πνευματικός
  choice: 属灵的
  rationale: 保留其与“属肉体的”之间的鲜明对照，也不强行限定为“出于圣灵”或“由圣灵赋予”。
- source_word: σάρκινός
  choice: 属肉体的
  rationale: 保留与“肉体”相关的希腊词形和保罗式张力，避免扩译为“有罪性”或“属罪恶本性”。
- source_word: πεπραμένος
  choice: 已经被卖
  rationale: 完成时被动分词表示被卖后所处的持续状态；中文用“已经被卖”体现这一结果状态。
- source_word: ὑπὸ τὴν ἁμαρτίαν
  choice: 在罪之下
  rationale: 紧贴希腊文的支配意象，保留简洁而富张力的表达，不在正文中扩写为“在罪的权势之下”。
theological_decisions:
- issue: 如何理解保罗所说“我是属肉体的”
  choice: 正文保留“属肉体的”
  alternative: 属罪恶本性的；不属灵的
  rationale: 原文使用 σάρκινος，并与 πνευματικός 对照。保留“肉体”语言可避免把保罗的人论直接归入某种后来的教义公式，也保留此处“我”的身份与经验在上下文中的解释张力。
- issue: “被卖在罪之下”的奴役含义
  choice: 正文采用“已经被卖在罪之下”
  alternative: 已经被卖作罪的奴隶；已经落在罪的权势之下
  rationale: 原文明确含有买卖及受辖制的隐喻，却没有明说“奴隶”一词；正文保留原文紧凑形式，脚注说明其奴役含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话圣经语体。“律法、属灵、属肉体、罪之下”等词保留保罗论述中的关键词联系；标点采用中文全角形式。
