  text: For I delight in the law of God in my inner man,[a]
translation:
  language: zh_hans
  text: 因为就我里面的人来说，我喜爱上帝的律法。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“就我内在的自我而言”。“里面的人”是保罗用以指人的内在自我的隐喻。
    reason: 说明“里面的人”的习语性含义，并反映 κατὰ 的“就……而言”关系，不将其界定为特定的人论构成。
lexical_decisions:
- source_word: συνήδομαι
  choice: 喜爱
  rationale: 该动词表示带着喜悦的赞同，而不只是理智上的认同；“喜爱”在现代汉语中自然地保留了这种情感意味。
- source_word: νόμῳ τοῦ θεοῦ
  choice: 上帝的律法
  rationale: “律法”保留 νόμος 在《罗马书》中的重要保罗用语；属格 τοῦ θεοῦ 自然译为“上帝的”。
- source_word: κατὰ
  choice: 按着
  rationale: 此处 κατὰ 可表示所依循的层面或准则；“按着”较贴近原文，也保留它与“在……里面”之间的解释空间。
- source_word: τὸν ἔσω ἄνθρωπον
  choice: 里面的人
  rationale: 直译保留保罗“外面的人／里面的人”的人格隐喻；定冠词结构未明确带有物主代词，因此正文不增添“我”。
theological_decisions:
- issue: “里面的人”的人论含义
  choice: 保留为“里面的人”，不将其具体界定为人的某一构成部分
  alternative: 我内在的自我／我的内在生命
  rationale: 原文使用保罗式隐喻，指说话者内在的自我或生命，却没有在本节建立一套精细的人论结构；直译可保留这种神学张力。
- issue: κατὰ 与内在主体的关系
  choice: 译为“按着里面的人”
  alternative: 在我内心里／就内在的我而言
  rationale: “按着”保留 κατὰ 的形式与可能的准则或层面意味，避免只把它解释为空间性的“在……里面”。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“里面的人”略带源语痕迹，但在保罗语境中有意保留其隐喻；脚注提供更自然的释义。
