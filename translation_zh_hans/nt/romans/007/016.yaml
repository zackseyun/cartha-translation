  text: εἰ δὲ ὃ οὐ θέλω τοῦτο ποιῶ, σύμφημι τῷ νόμῳ ὅτι καλός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/016.yaml
  text: But if I do what I do not want, I agree with the law that it is good.
translation:
  language: zh_hans
  text: 但如果我做的是自己不愿意做的，我就认同律法是好的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ δὲ
  choice: 但如果
  rationale: 保留εἰ的条件意味和δέ轻微的转折、承接作用，符合现代汉语表达。
- source_word: ὃ … τοῦτο
  choice: 做的是……做的
  rationale: 以自然的汉语关系结构表达希腊语的关联结构，既避免生硬直译，也保留所做之事这一指向。
- source_word: θέλω
  choice: 愿意
  rationale: 此处指内心意愿，与实际行为形成对照；“愿意”比“想要”更适合本段的道德抉择语境，同时不过度解释意志的性质。
- source_word: ποιῶ
  choice: 做
  rationale: 直接对应普通现在时的行为用语，简洁自然，并与上下文重复措辞协调。
- source_word: σύμφημι
  choice: 承认
  rationale: 表达与律法的判断相一致并予以认同；现代汉语中“承认律法是好的”比“赞同律法是好的”更自然。
- source_word: τῷ νόμῳ
  choice: 律法
  rationale: 保留定指意义；在《罗马书》语境中指已知的律法范畴，不额外加上“摩西”以免超出本节明说的内容。
- source_word: καλός
  choice: 好的
  rationale: 直接保留对律法正面道德性质的评价，不收窄为仅仅“正确”，也不强化为“卓越”。
theological_decisions:
- issue: 本句是否明确肯定律法本身为善
  choice: 译为“承认律法是好的”
  alternative: “赞同律法，认为它是好的”或“承认律法是对的”
  rationale: 希腊文可理解为“赞同律法，认定它是好的”，而汉语简洁表述“承认律法是好的”自然保留了保罗对律法的正面判断，以及这种判断与其行为冲突之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“自己”明确主语内在意愿，却不增添心理或神学解释；全句保持条件推论的简洁力度。
