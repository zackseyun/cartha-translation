id: ROM.7.1
reference: Romans 7:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ἢ ἀγνοεῖτε, ἀδελφοί, γινώσκουσιν γὰρ νόμον λαλῶ, ὅτι ὁ νόμος κυριεύει τοῦ ἀνθρώπου ἐφ’ ὅσον χρόνον ζῇ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/001.yaml
  text: Or do you not know[b][a], brothers—for I am speaking to those who know the law—that the law has authority over a person for as long as he lives?
translation:
  language: zh_hans
  text: 还是说，弟兄们[a]，难道你们不知道吗？（我是在对熟悉律法的人说。）律法只在一个人活着的时候管辖他[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄们”译自希腊语阳性复数 adelphoi；在这里很可能也包括保罗听众中的女性。
    reason: cultural_note
  - marker: b
    text: 或译：“对一个人有权柄”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἢ
  choice: 还是说
  rationale: 保留保罗承接上文、推进论证的转折语气；现代汉语中比孤立的“或者”更自然。
- source_word: ἀγνοεῖτε
  choice: 你们不知道吗
  rationale: 保留现在时直陈语气所构成的反问，并体现保罗诉诸读者已有知识。
- source_word: ἀδελφοί
  choice: 弟兄们
  rationale: 忠实保留希腊文阳性复数称呼；其在本语境中可能包含女性听众的包容用法，以脚注说明。
- source_word: γινώσκουσιν γὰρ νόμον λαλῶ
  choice: 我是对熟悉律法的人说的
  rationale: 用插入语表达 γάρ 的解释作用，并自然呈现“认识、熟知律法的人”这一分词结构。
- source_word: νόμον / ὁ νόμος
  choice: 律法
  rationale: 前后统一译为“律法”，不在正文中将其范围限定为摩西律法或一般法律原则。汉语无需借冠词来表达其可识别性。
- source_word: κυριεύει
  choice: 管辖
  rationale: 表达支配、作主和具有权柄的含义，同时符合现代汉语庄重而清楚的表达。
- source_word: τοῦ ἀνθρώπου
  choice: 人／他
  rationale: ἄνθρωπος 在此为泛指的人，并非特指男性；先用“人”表达泛指，再以“他”承接代表性单数。
- source_word: ἐφ’ ὅσον χρόνον ζῇ
  choice: 只在人活着期间
  rationale: 自然表达“在其活着的全部时间内”的时间限制，并清楚表明死亡终止律法的管辖。
theological_decisions:
- issue: νόμος 在本句中的范围
  choice: 正文仅译为“律法”，不进一步限定
  alternative: 明确译作“摩西律法”，或理解为一般性的法律原则
  rationale: 上下文尤其使摩西律法进入视野，但本句措辞本身仍有一定概括性；保留原文范围，避免替读者预先化解这一张力。
- issue: κυριεύει 所表达的权威关系
  choice: 译为“管辖”
  alternative: 译为“对……有权柄”或“作……的主”
  rationale: “管辖”保留律法对活人施行权威的核心意思，又不把该动词扩展成额外的神学命题。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“还是说”承接上文论证；破折号保留保罗对听众身份的插入说明。正文保持简洁，不把“律法”的范围解释得超过希腊原文。
