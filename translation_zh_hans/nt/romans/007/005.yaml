id: ROM.7.5
reference: Romans 7:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὅτε γὰρ ἦμεν ἐν τῇ σαρκί, τὰ παθήματα τῶν ἁμαρτιῶν τὰ διὰ τοῦ νόμου ἐνηργεῖτο ἐν τοῖς μέλεσιν ἡμῶν εἰς τὸ καρποφορῆσαι τῷ θανάτῳ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/005.yaml
  text: For when we were in the flesh[a], the sinful passions that came through the law[c][b], were at work in our members to bear fruit for death.
translation:
  language: zh_hans
  text: 因为我们从前在肉体中[a]的时候，那些借着律法而产生的罪恶情欲[b]，在我们的肢体中活动[c]，以至于结出死亡的果子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在肉体中”也可理解为“受罪性支配”或“处在堕落的人类境况中”；这里不只是指活在身体里。
    reason: alternative_reading
  - marker: b
    text: 直译：“罪的情欲”。
    reason: lexical_alternative
  - marker: c
    text: “肢体”指身体的各部分，也包括它们作为行动工具所发挥的功能。
    reason: cultural_note
lexical_decisions:
- source_word: ἐν τῇ σαρκί
  choice: 在肉体中
  rationale: 保留保罗“肉体”的核心措辞及其在肉体、堕落处境与罪势力之间的神学张力，不在正文中将其单一化为“罪性”。
- source_word: τὰ παθήματα τῶν ἁμαρτιῶν
  choice: 罪恶情欲
  rationale: 将属格结构自然地表达为性质修饰，指带有罪恶性质的欲望或冲动；“情欲”在此比“苦难”更符合语境。
- source_word: τὰ διὰ τοῦ νόμου
  choice: 借着律法而来的
  rationale: 保留 διά 的媒介或关联作用，却不擅自明确为律法主动“激发”了这些情欲。
- source_word: ἐνηργεῖτο
  choice: 运行
  rationale: 表达未完成时所体现的持续作用；现代中文中“运行”也能保留其在人的肢体内发挥效力的意味。
- source_word: ἐν τοῖς μέλεσιν ἡμῶν
  choice: 在我们的肢体中
  rationale: 保留保罗惯用的“肢体”说法，既涉及身体各部分，也可涵盖它们作为行动工具的功能。
- source_word: εἰς τὸ καρποφορῆσαι τῷ θανάτῳ
  choice: 结出归于死亡的果子
  rationale: 保留“结果子”的有机比喻，并以“归于死亡”表达与死亡相关、趋向死亡或以死亡为结果的开放语义。
theological_decisions:
- issue: ἐν τῇ σαρκί应直译还是解释为罪性或堕落处境
  choice: 在肉体中
  alternative: 受罪性支配／处在堕落的人类境况中
  rationale: 直译能维持保罗肉体观的语义宽度及其与圣灵的对照，脚注再说明这里并非仅指有身体的状态。
- issue: διὰ τοῦ νόμου是否应译为律法激发情欲
  choice: 借着律法而来的
  alternative: 被律法激发的
  rationale: 上下文容许“激发”的理解，但该词本身只明确表达借着或通过律法；正文避免补入更强的因果机制。
- issue: τῷ θανάτῳ的关系如何表达
  choice: 归于死亡
  alternative: 导致死亡／为死亡
  rationale: 此与格可表达归属、趋向或结果；“归于死亡”保留其张力，不把语法关系仅限定为结果。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“肉体”“肢体”“结果子”等保留保罗的关键词和比喻；通过脚注解释其非日常含义。所有脚注标记均置于所说明的词组之后。
