id: ROM.7.4
reference: Romans 7:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ὥστε, ἀδελφοί μου, καὶ ὑμεῖς ἐθανατώθητε τῷ νόμῳ διὰ τοῦ σώματος τοῦ Χριστοῦ, εἰς τὸ γενέσθαι ὑμᾶς ἑτέρῳ, τῷ ἐκ νεκρῶν ἐγερθέντι ἵνα καρποφορήσωμεν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/004.yaml
  text: So then[a], my brothers, you also were put to death to the law through the body of the Messiah[c][b], so that you might belong to another—to him who was raised from the dead—in order that we might bear fruit for God.
translation:
  language: zh_hans
  text: 所以，我的弟兄们[a]，你们也借着弥赛亚[b]的身体，向律法死了，为要归属另一位[c]，就是那位从死人中复活的，好让我们为上帝结果子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄们”也可译作“弟兄姊妹们”；希腊文“弟兄”可用于称呼包括男女在内的群体。
    reason: lexical_alternative
  - marker: b
    text: 希腊文为 Christou；这里译作“弥赛亚”，以突出这一称号“受膏者”的含义。也可译作“基督”。
    reason: lexical_alternative
  - marker: c
    text: 直译为“为使你们成为另一位的”；这一措辞延续了上文的婚姻比喻。
    reason: cultural_note
lexical_decisions:
- source_word: Ὥστε
  choice: 所以
  rationale: 承接上文婚姻比喻所推出的结论，简洁保留推论和转折推进的作用。
- source_word: ἀδελφοί μου
  choice: 我的弟兄们
  rationale: 保留希腊文阳性复数呼语的形式；此词在这里可包括群体中的女性，另以脚注说明。
- source_word: ἐθανατώθητε
  choice: 被处死了
  rationale: 保留不定过去时被动语态，表明信徒在与律法的关系上是承受这一行动，而不只是自行“死了”。
- source_word: τῷ νόμῳ
  choice: 向律法
  rationale: 贴近与死亡意象搭配的与格，表达信徒与律法之间原有约束关系因死亡而终止，同时避免直接增译为“脱离律法”。
- source_word: διὰ τοῦ σώματος τοῦ Χριστοῦ
  choice: 借着弥赛亚的身体
  rationale: διά加属格表示媒介或途径；译文保留“身体”，使这一死亡与弥赛亚身体的死亡相连。
- source_word: Χριστοῦ
  choice: 弥赛亚
  rationale: 此处保留Χριστός作为受膏者称号的含义，而不只将其作为固定姓名音译。
- source_word: εἰς τὸ γενέσθαι ὑμᾶς ἑτέρῳ
  choice: 为要使你们归属另一位
  rationale: 目的结构译为“为要”；“归属另一位”以现代汉语表达所有关系，并延续上文婚姻关系转移的比喻。
- source_word: τῷ ἐκ νεκρῶν ἐγερθέντι
  choice: 就是那位从死人中复活的
  rationale: 明确所说的“另一位”是从死人中复活的那一位；采用自然、庄重的现代汉语表达，虽未生硬复制希腊文被动形式，却不增添行动者。
- source_word: ἵνα καρποφορήσωμεν
  choice: 好让我们……结果子
  rationale: 保留ἵνα的目的含义和“结果子”的比喻，也保留原文由“你们”转为“我们”的人称变化。
- source_word: τῷ θεῷ
  choice: 为上帝
  rationale: 将与格自然表达为结果子的对象和受益指向，即所结的果子是为上帝而结。
theological_decisions:
- issue: Χριστοῦ在保罗论述中的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 这里该词仍具有受膏者称号的救赎历史意味；采用“弥赛亚”显明称号含义，同时用脚注提供传统译法。
- issue: εἰς τὸ γενέσθαι ὑμᾶς ἑτέρῳ中的婚姻关系比喻
  choice: 为要使你们归属另一位
  alternative: 为要使你们与另一位结合
  rationale: “归属另一位”保留原文“成为另一位的”这一所有关系，并延续上下文的婚姻比喻；“结合”虽更明白，却会把隐含意义直接说出。
- issue: ἐθανατώθητε τῷ νόμῳ所表达的关系
  choice: 向律法被处死了
  alternative: 脱离律法而死了
  rationale: 所选译法保留被动语态及与格表达，不进一步界定施事者，也不把神学效果直接改写成“脱离”，从而保留原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留“向律法被处死”“结果子”等核心意象及原文从“你们”转为“我们”的变化；以“归属另一位”在自然表达和婚姻比喻之间取得平衡。
