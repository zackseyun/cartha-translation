  text: Τί οὖν τὸ περισσὸν τοῦ Ἰουδαίου, ἢ τίς ἡ ὠφέλεια τῆς περιτομῆς;
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/001.yaml
  text: What then is the advantage of the Jew? Or what is the benefit of circumcision?[a][b]
translation:
  language: zh_hans
  text: 那么，犹太人有什么长处呢？割礼又有什么益处呢？[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “益处”也可译作“价值”。
    reason: lexical_alternative
  - marker: b
    text: 原文“犹太人”是代表性单数，泛指犹太人这一类人。
    reason: cultural_note
lexical_decisions:
- source_word: Τί οὖν
  choice: 那么，……有什么……呢？
  rationale: 保留οὖν承接上文并作推论的作用，也以自然的现代汉语呈现保罗的反问语气。
- source_word: τὸ περισσὸν
  choice: 长处
  rationale: 此处指犹太人所具有的特殊优势；“长处”自然清楚，同时避免把问题强化为族群本质上的优越。
- source_word: τοῦ Ἰουδαίου
  choice: 犹太人
  rationale: 希腊文带冠词的单数在这里作类指。汉语“犹太人”不标示单复数，既可自然表达这一类别，也无需生硬地译成“一个犹太人”。
- source_word: ἢ τίς
  choice: 又有什么
  rationale: 以“又”连接并列的第二个反问，保留原文的平行结构，同时符合汉语表达习惯。
- source_word: ἡ ὠφέλεια
  choice: 益处
  rationale: 准确表达实际的好处、效益，并与前句的“长处”保持细微词义区别。
- source_word: τῆς περιτομῆς
  choice: 割礼
  rationale: 直接保留原文所指的礼仪名称；上下文中它是标志犹太身份的盟约记号，但本节无需将这一含义扩写进正文。
theological_decisions:
- issue: Ἰουδαίου的单数类指在汉语中如何表达
  choice: 犹太人
  alternative: 一个犹太人；犹太民族
  rationale: 原文用代表性单数指犹太人这一类别。现代汉语名词本身通常不标单复数，因此“犹太人”既忠实又自然；“一个犹太人”容易被理解为某个个体，“犹太民族”则扩大了原词的表述。
translation_notes:
  register: 采用现代、庄重而易懂的反问句式。“长处”与“益处”分别对应περισσόν和ὠφέλεια，避免在中文中把两个近义词完全合并。脚注标记均置于正文相应节末。
