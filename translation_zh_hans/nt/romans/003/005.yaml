  to: 但如果我们的不义显明上帝的义[a]，我们该说什么呢？难道降下忿怒的上帝是不义的吗？（我是按人的说法说的。）
  rationale: 修订仅调整体貌、惯用语和语域：维持“不义／义”的词汇对照、反问的否定预期，以及保罗插入式免责声明。脚注保留 ἀδικία／δικαιοσύνη 的“ 不公／公义”可行译法；脚注中的“显明了”作为完整替代译句可成立。
