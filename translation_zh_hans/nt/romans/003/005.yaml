  source_fidelity: 译文总体准确保留了条件句、反问以及 μή 所暗示的否定预期。为更贴合现在时 συνίστησιν，宜不用完成貌的“显明了”；“照人的想法”则将 κατὰ ἄνθρωπον λέγω 的“按人的方式／说法”稍微转成了人的内在想法。
  naturalness: “难道……吗？”自然地表达了反问。“降下愤怒”可理解，但“降下忿怒”在现代庄重的圣经汉语中更固定，也较明确保留审判性语境；“我是按人的说法说的”自然且贴近原文。
  terminology: 保留“不义／义”的对应是合适的，脚注以“不公／公义”提示司法性词义也恰当。将 ὀργή 译为“忿怒”符合汉语圣经用语，避免“愤怒”较泛泛的日常情绪色彩。
  issues:
