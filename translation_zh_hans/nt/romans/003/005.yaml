  text: εἰ δὲ ἡ ἀδικία ἡμῶν θεοῦ δικαιοσύνην συνίστησιν, τί ἐροῦμεν; μὴ ἄδικος ὁ θεὸς ὁ ἐπιφέρων τὴν ὀργήν; κατὰ ἄνθρωπον λέγω.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/005.yaml
  text: But if our unrighteousness demonstrates God’s righteousness[a], what shall we say? Is God unjust to inflict wrath? (I am speaking in a human way.)
translation:
  language: zh_hans
  text: 但如果我们的不义显明上帝的义[a]，我们该说什么呢？难道降下忿怒的上帝是不义的吗？（我是按人的说法说的。）
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们的不公显明了上帝的公义。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδικία
  choice: 不义
  rationale: 与δικαιοσύνη构成直接的道德与关系性对照；“不公”在本语境中也是可行含义，故与δικαιοσύνη的另一译法一并收入脚注。
- source_word: δικαιοσύνη
  choice: 义
  rationale: 保留保罗书信中该词较宽广的含义及其与ἀδικία的词义对照；语境也容许理解为“公义”。
- source_word: συνίστησιν
  choice: 显明了
  rationale: 表达人的不义使上帝的义得到彰显、显为真实；中文自然且不把含义收窄为形式逻辑上的“证明”。
- source_word: μὴ ἄδικος
  choice: 难道……是不义的吗？
  rationale: 以“难道”传达μή所提示的预期否定回答，同时保留反问本身的张力。
- source_word: ἐπιφέρων τὴν ὀργήν
  choice: 降下愤怒
  rationale: 保留ἐπιφέρω的施加、带来之意和ὀργή的审判语境，又避免把“愤怒”抽象化为仅指惩罚。
- source_word: κατὰ ἄνθρωπον λέγω
  choice: 我是照人的想法说的
  rationale: 自然表达保罗是在采用人的推理方式提出异议，而非认同上帝不义这一判断。
theological_decisions:
- issue: 如何表达关于上帝施行愤怒是否不义的反问
  choice: 难道降下愤怒的上帝是不义的吗？
  alternative: 上帝降下愤怒，难道是不义的吗？
  rationale: “难道”保留μή所暗示的否定预期，但不删除或直接回答异议；定语结构也贴近ὁ θεὸς ὁ ἐπιφέρων τὴν ὀργήν。
- issue: ἀδικία与δικαιοσύνη在本节中的对应含义
  choice: 正文译作“不义／义”
  alternative: “不公／公义”
  rationale: 正文保留保罗常用且含义较宽的“义”词族对照，脚注说明司法、公正层面的可行读法，不将两者强行割裂。
translation_notes:
  register: 采用现代、庄重而通俗的普通话。“我们该说什么呢”保留论辩推进；括号保留原文的插入性免责声明。正文中的[a]与脚注完全对应。
