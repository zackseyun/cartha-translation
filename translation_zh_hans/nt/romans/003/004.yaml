id: ROM.3.4
reference: Romans 3:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: μὴ γένοιτο· γινέσθω δὲ ὁ θεὸς ἀληθής, πᾶς δὲ ἄνθρωπος ψεύστης, ⸀καθὼς γέγραπται· Ὅπως ἂν δικαιωθῇς ἐν τοῖς λόγοις σου καὶ ⸀νικήσεις ἐν τῷ κρίνεσθαί σε.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/004.yaml
  text: 'May it never be! Rather[a], let God be true, and every person a liar[b], as it is written: “So that you may be justified in your words and prevail when you are judged.”'
translation:
  language: zh_hans
  text: '绝对不是！倒要承认上帝是真实的，而人人都是说谎的。正如经上所记：


    “使你在你所说的话上显为公义[a]，

    并在你受审判时得胜。[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“显明为正确”或“被证明为正当”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“在你施行审判时”；这一译法更直接反映《诗篇》51:4的希伯来语措辞，而《罗马书》这里的希腊语通常理解为“在你受审判时”。
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ γένοιτο
  choice: 绝对不是！
  rationale: 以自然有力的现代汉语表达保罗强烈的否定和驳斥；希腊语形式虽带愿望语气，实际功能是断然否认。
- source_word: γινέσθω δὲ ὁ θεὸς ἀληθής
  choice: 倒要让上帝显为真实
  rationale: 保留第三人称命令语气以及与下句“说谎者”的鲜明对照；“显为”避免暗示上帝原先并不真实、后来才变得真实。
- source_word: πᾶς δὲ ἄνθρωπος
  choice: 即使人人
  rationale: ἄνθρωπος泛指所有人，并非专指男性；“即使”自然表达这里上帝真实与全人类虚假之间的强烈对照。
- source_word: ψεύστης
  choice: 说谎者
  rationale: 直接对应指称说谎或虚假之人的名词，并与“真实”形成清楚对照。
- source_word: καθὼς γέγραπται
  choice: 正如经上所记
  rationale: 采用庄重而通行的引经格式，简明表达完成时所带出的既有、有效的经文记载。
- source_word: δικαιωθῇς
  choice: 被证实为义
  rationale: 保留被动形式和司法性含义，说明上帝被显明、判定为站在正义的一方，而不是从不义变成义；另在脚注列出更通俗的表达。
- source_word: λόγοις
  choice: 话语
  rationale: 自然对应复数名词，并保留引文庄重的语体。
- source_word: νικήσεις
  choice: 得胜
  rationale: 表达在审判或争讼中胜出，既保留原词的胜利含义，也符合司法语境。
- source_word: ἐν τῷ κρίνεσθαί σε
  choice: 在你受审判时
  rationale: 按《罗马书》现有希腊文本最自然地理解为被动语态；主动读法与《诗篇》51:4的希伯来文本较接近，留在脚注中说明。
theological_decisions:
- issue: δικαιωθῇς用于上帝时的司法含义
  choice: 被证实为义
  alternative: 显明为正确；被判定为正当
  rationale: 上下文讨论上帝的真实与人的虚假，引文所说的不是上帝获得原先没有的道德义，而是他的义与正确受到证实。
- issue: ἐν τῷ κρίνεσθαί σε的语态及《诗篇》引文差异
  choice: 在你受审判时
  alternative: 在你施行审判时
  rationale: 《罗马书》的希腊语不定式形态自然作被动理解；《诗篇》51:4的希伯来语则支持主动含义。正文依所译希腊文本，脚注保存另一读法及其来源。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“绝对不是”传达强烈驳斥；引文保留诗歌分行。“显为真实”和“被证实为义”兼顾自然表达、司法语境及神学张力，不把上帝描述成由虚假或不义转变为真实或公义。
