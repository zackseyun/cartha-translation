lexical_decisions:
- source_word: οὐκ ἔστιν
  choice: 毫不
  rationale: 结合汉语表达将存在式否定自然地译为“毫不”，完整保留绝对否定的力度。
- source_word: φόβος
  choice: 敬畏
  rationale: 在以上帝为对象的圣经语境中，“敬畏”既保留“惧怕”的基本成分，也自然表达尊崇与畏惧交织的含义；脚注列出更直译的可能。
- source_word: θεοῦ
  choice: 上帝
  rationale: 明确指出敬畏的对象，并采用现代标准汉语中庄重、通行的称谓。
- source_word: ἀπέναντι
  choice: 眼中
  rationale: 与“他们的眼睛”组合为自然的汉语空间—认知习语，表达上帝不在其关注和道德视野之中。
- source_word: τῶν ὀφθαλμῶν αὐτῶν
  choice: 他们眼中
  rationale: 保留“眼睛”的具体意象，同时采用现代汉语惯用表达。
theological_decisions:
- issue: φόβος θεοῦ所表达的态度
  choice: 敬畏上帝
  alternative: 惧怕上帝
  rationale: “敬畏”适合以上帝为对象的经文习语，但不把“惧怕”的词义完全排除，因此在脚注中保留该译法。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“他们眼中”保留原文的视觉意象；“毫不敬畏”准确传达否定力度，且便于普通读者理解。
