  text: δικαιοσύνη δὲ θεοῦ διὰ πίστεως Ἰησοῦ Χριστοῦ, εἰς ⸀πάντας τοὺς πιστεύοντας, οὐ γάρ ἐστιν διαστολή.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/022.yaml
  text: And the righteousness of God through faith in Jesus the Messiah[a], for all who believe[b]; for there is no distinction.
translation:
  language: zh_hans
  text: 上帝的义，借着对耶稣弥赛亚的信[b]，临到一切相信的人；因为没有分别。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 或译：“借着耶稣弥赛亚的信实。”
    reason: alternative_reading
lexical_decisions:
- source_word: δικαιοσύνη
  choice: 义
  rationale: “义”能承载保罗语境中正直、公正以及蒙上帝判为义等相互关联的含义；用脚注保留“公正”这一可能译法。
- source_word: θεοῦ
  choice: 上帝的
  rationale: 按属格结构直译，保留其可能指上帝的属性、作为或所赐之义的宽度，不在正文中改释为“从上帝而来”。
- source_word: διὰ πίστεως
  choice: 借着……信
  rationale: 以“信”表达 πίστις，并用自然汉语“借着对……的信”呈现正文所采用的受词属格理解。
- source_word: Ἰησοῦ Χριστοῦ
  choice: 耶稣弥赛亚
  rationale: 将 Χριστός 作为称号译为“弥赛亚”，同时保留“耶稣”与称号的紧密组合。
- source_word: εἰς πάντας τοὺς πιστεύοντας
  choice: 临到一切相信的人
  rationale: “临到”自然表达 εἰς 在此处的趋向和惠及范围；“一切相信的人”保留 πάντας 的普遍范围及现在分词的持续性表达。
- source_word: διαστολή
  choice: 分别
  rationale: “并没有分别”是自然、庄重的现代汉语，可表达此处不存在区别或差等之意。
theological_decisions:
- issue: πίστεως Ἰησοῦ Χριστοῦ
  choice: 对耶稣弥赛亚的信
  alternative: 耶稣弥赛亚的信实
  rationale: 该属格结构可能指人对耶稣弥赛亚的信，也可能指耶稣弥赛亚的信实。正文采用较常见的受词属格理解，脚注保留主体属格理解，不消除原文真实的神学张力。
- issue: δικαιοσύνη θεοῦ
  choice: 上帝的义
  alternative: 上帝的公正
  rationale: “上帝的义”较能保留短语在保罗书信中的宽广含义，包括上帝自身的正直、公义作为以及他所赐的义；脚注列出“上帝的公正”这一词义可能。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“这上帝的义”承接前文并保留本节希腊文省略谓语的附加说明性质；为使中文句子完整，补出判断词“是”。标点以分号呈现后半句的解释关系。
