source:
  edition: SBLGNT
  text: Οἴδαμεν δὲ ὅτι ὅσα ὁ νόμος λέγει τοῖς ἐν τῷ νόμῳ λαλεῖ, ἵνα πᾶν στόμα φραγῇ καὶ ὑπόδικος γένηται πᾶς ὁ κόσμος τῷ θεῷ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/019.yaml
  text: We know that whatever the law says[a], it speaks to those under the law[c][b], so that every mouth may be stopped and the whole world may become accountable to God.
translation:
  language: zh_hans
  text: 我们知道，律法所说的一切，都是对律法之下的人[a]说的，好堵住每一张口[b]，使全世界都要向上帝交账[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“在律法中的人”。
    reason: lexical_alternative
  - marker: b
    text: 或译“封住每一张口”或“使人人都无话可说”。
    reason: lexical_alternative
  - marker: c
    text: 或译“伏在上帝的审判之下”“须向上帝负责”，或“在上帝面前被判有罪”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδαμεν δὲ
  choice: 我们知道
  rationale: Οἴδαμεν表达共同确认的现有认识；δέ在此承接上下文，汉语不必机械译出，以免加入过强的转折或时间意味。
- source_word: ὁ νόμος
  choice: 律法
  rationale: 保留保罗所说具有权威、能够发言的“律法”，又不在译文中额外限定其具体范围。
- source_word: ὅσα ... λέγει
  choice: 所说的一切
  rationale: 自然表达ὅσα的概括范围，即律法无论说什么、所说的全部内容。
- source_word: τοῖς ἐν τῷ νόμῳ
  choice: 律法之下的人
  rationale: 原文直译为“在律法中的人”；“律法之下”在现代汉语中更自然，也能表达处于律法范围和管辖之内的意思。
- source_word: λαλεῖ
  choice: 说的
  rationale: 希腊文在前后分别使用λέγει和λαλεῖ；汉语若强行用不同动词会显得生硬，因此按自然表达译为“说的”，句式仍清楚表明律法向特定对象发言。
- source_word: ἵνα
  choice: 为要
  rationale: 明确保留目的意味，同时符合庄重而自然的现代汉语。
- source_word: πᾶν στόμα φραγῇ
  choice: 堵住每一张口
  rationale: 保留“口”被封住的具体比喻，表达人在审判面前再无话可辩。
- source_word: ὑπόδικος γένηται
  choice: 负有罪责
  rationale: ὑπόδικος具有司法语境中的受追究、须负责之意；“负有罪责”既保留法律力度，又不把词义直接收窄为已经宣判“有罪”。汉语以结果状态表达γένηται，避免生硬地译成“成为负有罪责的”。
- source_word: πᾶς ὁ κόσμος
  choice: 全世界
  rationale: 保留原文涵盖全体世人的普遍范围。
- source_word: τῷ θεῷ
  choice: 在上帝面前
  rationale: 结合ὑπόδικος的司法背景，用“在上帝面前”自然表达全人类面对上帝审断并须向他负责。
theological_decisions:
- issue: ὑπόδικος所表达的司法和神学力度
  choice: 译为“在上帝面前负有罪责”，强调全世界处于须向上帝负责、受其审断的地位。
  alternative: 可译为“要向上帝交账”“伏在上帝的审判之下”或“在上帝面前被判有罪”。
  rationale: 原词带有明确的法庭色彩，但未必单独等同于最终判词。“负有罪责”保留罪与审判的力度，同时不越过原文本身，把含义完全限定为已经宣判有罪。
- issue: 律法发言对象与全世界受追究之间的张力
  choice: 保留“对律法之下的人说”与“使全世界……负有罪责”的并置。
  alternative: 可解释性地把前者扩展成“对所有受律法约束的人说”。
  rationale: 原文有意从律法直接发言的对象推进到全世界在上帝面前的处境；译文不替保罗消解这一论证张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“律法”沿用中文圣经语域中的通行词；“堵住每一张口”保留原文鲜明的法庭性比喻。脚注标记紧跟各自所解释的词组，避免英文咨询层中标记位置与脚注内容错位的问题。
