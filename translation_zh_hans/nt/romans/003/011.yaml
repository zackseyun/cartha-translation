  text: οὐκ ἔστιν ⸀ὁ συνίων, οὐκ ἔστιν ⸁ὁ ἐκζητῶν τὸν θεόν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/011.yaml
  text: There is no one who understands[a]; there is no one who seeks God.
translation:
  language: zh_hans
  text: 没有明白的，也没有寻求上帝的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “寻求”也可译作“切切寻求”或“竭力寻找”。
    reason: lexical_alternative
lexical_decisions:
- source_word: συνίων
  choice: 明白
  rationale: 该分词指理解、领悟；“明白”简洁自然，保留其认知含义，又不显得生硬或技术化。
- source_word: ἐκζητῶν
  choice: 寻求
  rationale: 该复合动词可带有恳切寻找、竭力寻求的意味；正文用现代汉语中自然的“寻求”，较强语气列于脚注。
- source_word: οὐκ ἔστιν
  choice: 没有……的
  rationale: 这一表达在本句两次构成绝对否定；用“没有……的”既符合现代汉语，也保留其概括性和强调作用。
- source_word: ὁ συνίων / ὁ ἐκζητῶν
  choice: 明白的／寻求……的
  rationale: 希腊语带冠词的实体化分词用汉语“……的”结构表达，自然且贴近原句形式。
- source_word: τὸν θεόν
  choice: 上帝
  rationale: 指独一的神；“上帝”是现代标准汉语中清楚、庄重且通行的对应词。
theological_decisions:
- issue: 保罗这一连串引文中否定的范围
  choice: 两次保留绝对表述“没有……的”
  alternative: 没有真正明白的，也没有真心寻求上帝的
  rationale: 希腊文作明确的概括性否定，并未加入“真正”或“真心”等限定；译文不应以解释性措辞削弱或限定其力度。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语；保留原文两句平行结构和绝对否定。脚注标记置于全句末，说明ἐκζητῶν可能具有的加强语气。
