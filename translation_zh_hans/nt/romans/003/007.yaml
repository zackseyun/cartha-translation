source:
  edition: SBLGNT
  text: εἰ ⸀δὲ ἡ ἀλήθεια τοῦ θεοῦ ἐν τῷ ἐμῷ ψεύσματι ἐπερίσσευσεν εἰς τὴν δόξαν αὐτοῦ, τί ἔτι κἀγὼ ὡς ἁμαρτωλὸς κρίνομαι,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/007.yaml
  text: But if God’s truthfulness has abounded through my lie for his glory, why am I still being judged as a sinner?
translation:
  language: zh_hans
  text: 但如果上帝的信实借着我的谎言越发显明，以致他得荣耀，为什么我还被当作罪人审判呢？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ ἀλήθεια τοῦ θεοῦ
  choice: 上帝的信实
  rationale: 上下文将上帝的真实可靠与人的虚假相对照（参3:4）；“信实”自然表达此处ἀλήθεια所含的品格与可靠性，同时不把它缩减为抽象命题。
- source_word: ἐν τῷ ἐμῷ ψεύσματι
  choice: 因我的谎言
  rationale: ἐν在此可表凭借或媒介；“因”符合汉语表达，并保留人的谎言反而衬显上帝信实的论证关系。
- source_word: ἐπερίσσευσεν
  choice: 越发显明
  rationale: 该动词本义涉及增多、丰盛；结合“信实”和“荣耀”，译为“越发显明”在现代汉语中自然，也表达上帝的信实因对比而更充分彰显。
- source_word: εἰς τὴν δόξαν αὐτοῦ
  choice: 使他得荣耀
  rationale: εἰς可表示趋向、结果或目的；正文采用自然汉语的结果表达，脚注保留更贴近形式的译法。
- source_word: τί ἔτι κἀγὼ
  choice: 为什么我还
  rationale: “还”体现ἔτι的持续或仍然之意；κἀγώ的附加语气在汉语问句中由整体语境自然承载。
- source_word: ὡς ἁμαρτωλὸς κρίνομαι
  choice: 被当作罪人审判
  rationale: 保留ὡς的“作为、当作”含义及κρίνομαι的被动审判意义，不预先窄化为末日定罪。
theological_decisions:
- issue: ἀλήθεια τοῦ θεοῦ是指抽象的“上帝的真理”，还是上帝真实可靠的品格
  choice: 上帝的信实
  alternative: 上帝的真实／上帝的真理
  rationale: 罗马书3:4—7将上帝为真与人的虚谎相对照；“信实”体现这种道德与关系层面的可靠性，同时不引入宗派性解释。
- issue: 保罗是否在认可“以谎言荣耀上帝”的推论
  choice: 保留为反诘中的假设性论证
  alternative: 把它改写为保罗本人的正面主张
  rationale: εἰ引出的条件句属于本段的辩论性反问；译文不额外说明说话者身份，也不消解其刻意保留的张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“上帝的信实”与“我的谎言”形成鲜明对照；句末“呢”自然呈现反诘语气。
