  to: 但如果上帝的信实借着我的谎言越发显明，以致他得荣耀，为什么我还被当作罪人审判呢？
  rationale: 仅将“因”修订为“借着”，以更准确表达ἐν的凭借／媒介作用；其余措辞保留原译对反诘、持续性的“还”、以及“作为／当作罪人”之语义处理。脚注保留εἰς τὴν δόξαν αὐτοῦ的较形式化替代译法。
