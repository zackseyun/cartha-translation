  text: ἢ Ἰουδαίων ὁ θεὸς μόνον; ⸀οὐχὶ καὶ ἐθνῶν; ναὶ καὶ ἐθνῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/029.yaml
  text: Or is God the God of the Jews only? Is he not also the God of the Gentiles? Yes[a], of the Gentiles also.
translation:
  language: zh_hans
  text: 还是说，上帝只是犹太人的上帝吗？他不也是非犹太人的上帝吗？是的，他也是非犹太人的上帝。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἢ
  choice: 难道
  rationale: 承接前文，引出一个反问式的另一种可能；中文用“难道”能自然体现论证推进及反问语气。
- source_word: Ἰουδαίων
  choice: 犹太人的
  rationale: 属格依附于“上帝”，译作“犹太人的上帝”符合现代汉语，也准确表达群体归属关系。
- source_word: ὁ θεὸς
  choice: 上帝
  rationale: 采用现代汉语中庄重而通行的 θεός 译法；第二问和答句补出“上帝”，使省略结构在中文中清楚自然。
- source_word: μόνον
  choice: 只是
  rationale: 直接表达排他性，并与反问句式自然结合。
- source_word: οὐχὶ
  choice: 不也是……吗
  rationale: οὐχί 引导预期肯定回答的反问；此中文句式保留了问题形式及其期待肯定的语力。
- source_word: ἐθνῶν
  choice: 外族人
  rationale: 在与“犹太人”的明确对照中，指非犹太人；“外族人”比“列国”更清楚地指向人群，同时避免现代“外邦人”可能带有的宗教圈内术语感。
- source_word: ναὶ
  choice: 是的
  rationale: 简洁保留保罗对反问所作的明确肯定回答。
- source_word: καὶ
  choice: 也
  rationale: 表达外族人与犹太人一同被包括在内的附加、并列意义。
theological_decisions:
- issue: ἐθνῶν 应译为“外族人”还是“列国”
  choice: 外族人
  alternative: 列国
  rationale: 本节将 Ἰουδαίων 与 ἐθνῶν 对举，重点是犹太人与非犹太人两类人，而不是现代地缘政治意义上的国家。“外族人”保留这种族群对照；脚注注明较直译的“列国”，不掩盖原词的语义范围。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。连续反问保留原文的论证力度；末句重复“外族人的上帝”，虽比希腊文省略结构稍完整，却使中文表达清晰，并不增加新的神学断言。
