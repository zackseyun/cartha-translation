revisions:
- from: 神设立他作赎罪祭[a]，要人借着信，凭他的血[b]，得以领受，为要显明神的义[c]；因为神宽容了从前所犯的罪。
  to: 神设立他作赎罪祭[a]，借着信，凭着他的血[b]，为要显明神的义[c]，因着神对从前所犯之罪的宽容。
  rationale: 删除原文未明说且在中文中没有宾语的“要人……得以领受”。修订保留原文介词短语的次序及其可争议的关系，并在b注释中以自然中文呈现“信靠他的血”的替代读法。将“宽容了”改为“对……的宽容”，对应πάρεσιν的名词形式及其暂且不追究的含义，避免等同于完全赦免。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T03:51:13Z'
review_pass:
  verdict: revise
  source_fidelity: 草稿在“神设立他作赎罪祭”“显明神的义”及“从前所犯的罪”等主要对应上基本准确，也以注释保存了ἱλαστήριον和短语句法的争议。不过，正文加入“要人……得以领受”，原文没有相应的动词或宾语；这不但补入未明说的“人”，还使“借着信，凭他的血”所修饰的对象变得不清，并造成句意残缺。πάρεσιν宜保留为名词性的“宽容／暂且越过”，而非无根据地改作完整的过去时事件“宽容了”。
  naturalness: “要人借着信，凭他的血，得以领受”在现代汉语中缺少“领受”的宾语，语法和语义均不完整。修订后采用庄重而通顺的句法，并避免以分号将原文连续的因果说明割裂得过强。
  terminology: “赎罪祭”可作为ἱλαστήριον的可读主译，且注释适当保留“挽回祭”和“施恩座”。“义”保留保罗语境的宽度，“公义”列为注释备选合宜。对πάρεσις采用“宽容”并明确其不是完整赦免，较能保持该词的暂缓、不追究之意。
  issues:
  - severity: high
    issue: 正文“要人借着信，凭他的血，得以领受”无原文依据且句法残缺。
    rationale: 希腊文没有“要人”或“得以领受”的对应表达，更没有说明所“领受”的对象。该补充既增添解释，也使介词短语的修饰关系不清。
  - severity: medium
    issue: “因为神宽容了从前所犯的罪”将πάρεσιν处理为完成动作。
    rationale: πάρεσιν是名词，指对既往罪的宽容、暂且放过；译为“因着神对……的宽容”更贴合原文结构，也不把它混同为最终、完全的赦免。
  - severity: medium
    issue: b注释的“借着信他的血”不符合自然汉语。
    rationale: 若表达“through faith in his blood”的读法，应译作“借着信靠他的血”或“借着对他的血的信”，以免中文读者误解。
