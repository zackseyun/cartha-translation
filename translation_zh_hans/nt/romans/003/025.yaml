id: ROM.3.25
reference: Romans 3:25
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὃν προέθετο ὁ θεὸς ἱλαστήριον ⸀διὰ πίστεως ἐν τῷ αὐτοῦ αἵματι εἰς ἔνδειξιν τῆς δικαιοσύνης αὐτοῦ διὰ τὴν πάρεσιν τῶν προγεγονότων ἁμαρτημάτων
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/025.yaml
  text: whom God put forward as an atoning sacrifice[a] through faith in his blood[b], to demonstrate his righteousness[c], because of the passing over of previously committed sins.
translation:
  language: zh_hans
  text: 神设立他作赎罪祭[a]，借着信，凭着他的血[b]，为要显明神的义[c]，因着神对从前所犯之罪的宽容。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赎罪祭”也可译作“挽回祭”；或理解为“施恩座”，即约柜上洒赎罪之血的金盖。
    reason: lexical_alternative
  - marker: b
    text: 也可理解为：“借着信靠他的血。”希腊文中“他的血”与“信”的关系有不同的句法理解；“凭着他的血”也可理解为说明赎罪祭的根据或媒介。
    reason: alternative_reading
  - marker: c
    text: “义”在这里也可译作“公义”。
    reason: lexical_alternative
lexical_decisions:
- source_word: προέθετο
  choice: 设立
  rationale: 既可表达神主动安排、公开呈明基督的行动，也符合现代中文圣经语体；不采用仅指内心计划的“预定”。
- source_word: ἱλαστήριον
  choice: 赎罪祭
  rationale: 以普通读者可理解的方式保留赎罪和献祭意涵，同时不在正文中单独锁定“挽回祭”或“施恩座”的解释。
- source_word: διὰ πίστεως
  choice: 借着信
  rationale: 保留 διά 所表达的途径或媒介意义，并按保罗书信中 πίστις 的通常用法译为“信”。
- source_word: ἐν τῷ αὐτοῦ αἵματι
  choice: 凭他的血
  rationale: “凭”可自然表达基督之血在赎罪中的根据或媒介作用；通过注释保留它与“信”结合成“信他的血”的句法可能。
- source_word: εἰς ἔνδειξιν
  choice: 为要显明
  rationale: 自然表达该介词短语的目的性，同时保留“证明、彰显”的含义。
- source_word: δικαιοσύνης
  choice: 义
  rationale: 沿用保罗神学语境中 δικαιοσύνη 的核心对应词；注释列出此处可突显的“公义”含义。
- source_word: πάρεσιν
  choice: 宽容了
  rationale: 表达神暂不追究、容让罪过去，而不直接等同于完全赦免；比生硬的“越过”更符合现代汉语。
- source_word: προγεγονότων ἁμαρτημάτων
  choice: 从前所犯的罪
  rationale: 清楚保留这些罪在时间上先前发生的分词意义。
theological_decisions:
- issue: ἱλαστήριον 的争议性含义
  choice: 赎罪祭
  alternative: 挽回祭；施恩座
  rationale: “赎罪祭”兼顾可读性与祭献、除罪的功能范围，不强行裁定该词只指平息忿怒或约柜上的施恩座；主要备选解释列入注释。
- issue: διὰ πίστεως ἐν τῷ αὐτοῦ αἵματι 的句法关系
  choice: 借着信，凭他的血
  alternative: 借着信他的血
  rationale: 希腊文可让“凭他的血”说明赎罪的媒介或根据，也可把“他的血”理解为信的对象。正文采用自然且保留神学张力的分层表达，另一读法列入注释。
- issue: δικαιοσύνη 在本节中的含义
  choice: 义
  alternative: 公义
  rationale: “义”保留保罗用语较广的语义范围，而“公义”更突出神审判上的正直；后者以注释呈现。
- issue: πάρεσις 与赦免的区别
  choice: 宽容了
  alternative: 暂且越过了；没有追究
  rationale: 该词在此强调神对先前罪行的暂缓处置或不立即追究，不宜直接译成语义更完整的“赦免”。
translation_notes:
  register: 采用现代、庄重且易懂的普通话圣经语体。“得以领受”是为补足中文句法，使“借着信”明确说明人领受神所设立之赎罪途径，而不把“信”说成赎罪祭本身的构成方式。分号划分目的与原因关系。所有注释标记均已置于正文。
