  text: πολὺ κατὰ πάντα τρόπον. πρῶτον μὲν ⸀γὰρ ὅτι ἐπιστεύθησαν τὰ λόγια τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/002.yaml
  text: Much in every way. For first of all[a], they were entrusted with the oracles of God.
translation:
  language: zh_hans
  text: 各方面都大有益处。首先，是因为他们曾受托保管上帝的圣言[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣言”指上帝所说、所启示的话；也可译作“上帝的宣告”。
    reason: 说明λόγια所指的神圣言语或宣告，并保留可行的现代汉语替代译法。
lexical_decisions:
- source_word: πολὺ
  choice: 大有益处
  rationale: 这里承接上一节关于“益处”的提问，作程度性的回答；“大有益处”简洁自然，也准确表达“很多、很大”的意思。
- source_word: κατὰ πάντα τρόπον
  choice: 各方面都
  rationale: 这一习语表示全面性；“各方面都”符合现代汉语表达，并保留保罗断言的广度。
- source_word: πρῶτον μὲν γὰρ
  choice: 这是因为，首先
  rationale: “这是因为”体现 γάρ 对前句的解释作用，“首先”保留 πρῶτον μὲν 引出首项的语篇功能；即使本节没有紧接着列出第二项，也不替保罗补足未明说的内容。
- source_word: ἐπιστεύθησαν
  choice: 托付给了他们
  rationale: πιστεύω 的被动式在这里表示某物被交托给某人，而非“他们相信了”；此译法保留受托管理的意味。
- source_word: τὰ λόγια
  choice: 圣言
  rationale: λόγια 在这里指来自上帝的神圣言语或启示。“圣言”庄重而简明，并以脚注说明其含义，避免将它窄化为某一种特定形式的启示。
- source_word: τοῦ θεοῦ
  choice: 上帝的
  rationale: 直译属格表达，既可自然涵盖归属，也不排除来源含义。
theological_decisions:
- issue: “他们”所指及受托内容的范围
  choice: 保留代词“他们”，并将 τὰ λόγια 译作范围较宽的“上帝的圣言”
  alternative: 明确增补“犹太人”，或直接解释为整部旧约圣经
  rationale: 上文已经提供代词所指，原文此处没有重复“犹太人”；λόγια 表示上帝的言语或宣告，但本句没有明确界定其文献范围，因此不在正文中加以窄化。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“大有益处”自然承接上一节；“这是因为，首先”保留原文解释关系和列举开端；“圣言”保持经文语体，并由脚注帮助普通读者理解。
