  text: ἐν τῇ ἀνοχῇ τοῦ θεοῦ, πρὸς ⸀τὴν ἔνδειξιν τῆς δικαιοσύνης αὐτοῦ ἐν τῷ νῦν καιρῷ, εἰς τὸ εἶναι αὐτὸν δίκαιον καὶ δικαιοῦντα τὸν ἐκ πίστεως Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/026.yaml
  text: in God's forbearance[a], for the demonstration of his righteousness at the present time[c][b], so that he might be just and the justifier of the one who has faith in Jesus.
translation:
  language: zh_hans
  text: 在上帝的宽容中，为要在现今彰显他自己的义[a]，使他自己既是公义的，又称信靠耶稣的人[b]为义[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “义”或译“公正”。
    reason: lexical_alternative
  - marker: b
    text: “信靠耶稣的人”或译“出于耶稣的信实的人”。原文属格结构可有两种理解。
    reason: alternative_reading
  - marker: c
    text: “称……为义”也可译作“宣告……为义”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνοχῇ
  choice: 宽容
  rationale: 表达上帝暂缓施行审判、克制而容忍的意思；比一般性的“耐心”更贴合本段语境。
- source_word: ἔνδειξιν
  choice: 彰显
  rationale: 既保留公开显明、展示的含义，也符合现代汉语表达。
- source_word: δικαιοσύνης
  choice: 义
  rationale: 沿用保罗书信中 δικαιοσύνη 的核心译法，并与后文“公义”“称……为义”形成词义呼应；“公正”这一司法语境中的可能含义收入脚注。
- source_word: νῦν καιρῷ
  choice: 现今这时候
  rationale: 保留 νῦν 的“现今”与 καιρός 的特定时机色彩，同时使中文自然。
- source_word: δίκαιον
  choice: 公义的
  rationale: 体现司法语境，又与“自己的义”和“称……为义”相呼应。
- source_word: δικαιοῦντα
  choice: 称……为义
  rationale: 准确表达现在主动分词的持续施事意义，并尽可能保留 δίκαιον 与 δικαιοῦντα 的文字呼应；脚注说明“宣告……为义”的译法。
- source_word: ἐκ πίστεως Ἰησοῦ
  choice: 信靠耶稣的人
  rationale: 正文按较常见的宾格属格理解，将 πίστις 表达为对耶稣的信靠；属格结构也可能指耶稣的信实，故在脚注保留。
theological_decisions:
- issue: ἐκ πίστεως Ἰησοῦ 中属格的含义
  choice: 信靠耶稣的人
  alternative: 因耶稣的信实而属于信的人／因耶稣的信实而得以称义的人
  rationale: 正文采用较通行且自然的宾格属格理解，但不排除主格属格“耶稣的信实”，以脚注保留这一真实存在的释义张力。
- issue: δίκαιον 与 δικαιοῦντα 的关系
  choice: 公义的，并且称……为义
  alternative: 公正的，并且宣告……为义
  rationale: 保留保罗在同一词根上的司法性呼应，同时避免将“称义”的具体神学机制进一步解释进正文。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“在上帝的宽容中”保留本节与上文在句法上的衔接；正文用“义—公义—称……为义”呈现同一词族的呼应。脚注标记均紧随其所解释的词语，修正了咨询层中标记位置与脚注内容不相符的问题。
