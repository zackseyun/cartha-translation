  to: 在上帝的宽容中，为要在现今彰显他自己的义[a]，使他自己既是公义的，又称信靠耶稣的人[b]为义[c]。
  rationale: 修订目的结构以对应πρὸς……εἰς τὸ εἶναι，并删除“要”所暗示的将来意义。脚注b改为仅反映“耶稣的信实”的主格属格替代理解，不额外加入原短语没有明说的“得以称义”。脚注锚点仍分别紧随“义”、“信靠耶稣的人”和“称……为义”。
