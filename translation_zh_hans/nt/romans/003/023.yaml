  text: πάντες γὰρ ἥμαρτον καὶ ὑστεροῦνται τῆς δόξης τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/023.yaml
  text: For all have sinned and fall short of the glory of God[b][a],
translation:
  language: zh_hans
  text: 因为人人都犯了罪，亏缺上帝的荣耀[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“达不到上帝的荣耀”，或“缺少上帝的荣耀”。
    reason: lexical_alternative
  - marker: b
    text: “上帝的荣耀”可能指上帝本有的荣耀、人原应反映的荣耀，或上帝所赐的荣耀。
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες
  choice: 人人都
  rationale: 在上下文中具有涵盖全人类的范围；“人人都”自然明确，又不增添希腊文所没有的限定。
- source_word: γὰρ
  choice: 因为
  rationale: 表达本节对前文论述的解释或依据；现代汉语中“因为”比单用“原来”更直接。
- source_word: ἥμαρτον
  choice: 犯了罪
  rationale: 不定过去时概括全人类犯罪这一事实；“犯了罪”是自然、庄重且准确的汉语表达。
- source_word: ὑστεροῦνται
  choice: 亏缺了
  rationale: 该词表示缺少、未达到或有所欠缺；“亏缺了”保留这种不足状态，并避免把具体参照标准过度写入正文。希腊文现在时所表达的持续状态在汉语中主要由语境承载。
- source_word: δόξης
  choice: 荣耀
  rationale: “荣耀”是δόξα在此处最稳妥且通行的译法，能够涵盖尊荣、荣光以及与上帝相关的荣耀等意涵。
- source_word: τοῦ θεοῦ
  choice: 上帝的
  rationale: 直接保留属格结构的开放性，不预先判定这是上帝本有的荣耀、人应反映的荣耀，还是上帝所赐的荣耀。
theological_decisions:
- issue: “上帝的荣耀”的含义
  choice: 正文保留为“上帝的荣耀”，不作解释性扩写。
  alternative: 可理解为上帝本有的荣耀、人受造原应反映的荣耀，或上帝赐给人的荣耀。
  rationale: 希腊文短语τῆς δόξης τοῦ θεοῦ简洁而具有多重可能关系；直译可保存其神学张力，避免在正文中锁定单一解释。
- issue: ὑστεροῦνται所表达的不足
  choice: 译作“亏缺了”，以保留缺少或未达到的开放含义。
  alternative: “达不到”会突出未达到标准；“缺少”则更突出没有或欠缺。
  rationale: 原词可涉及缺乏、落后或未达到。正文采用传统且简洁的“亏缺”，脚注列明自然的现代汉语替代说法。
translation_notes:
  register: 采用现代、庄重、易懂的标准普通话。“人人都”明确普遍范围；“犯了罪”自然概括既成事实；“亏缺了”保留原文的词义弹性。正文中的脚注标记依相关短语排列：词义备选[a]，短语解释[b]。
