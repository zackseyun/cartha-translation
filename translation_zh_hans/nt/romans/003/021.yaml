id: ROM.3.21
reference: Romans 3:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Νυνὶ δὲ χωρὶς νόμου δικαιοσύνη θεοῦ πεφανέρωται, μαρτυρουμένη ὑπὸ τοῦ νόμου καὶ τῶν προφητῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/021.yaml
  text: But now[a], apart from the law, the righteousness of God has been revealed, attested by the Law and the Prophets[c][b],
translation:
  language: zh_hans
  text: 但如今，神的义[a][b]在律法之外已经显明出来；律法和先知[c]都为这义作见证。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “神的义”也可理解为“神的公义”或“神的正义”。
    reason: lexical_alternative
  - marker: b
    text: “神的义”也可能指“从神而来的义”。原文的属格关系可有不同理解。
    reason: alternative_reading
  - marker: c
    text: “律法和先知”是对以色列圣经见证的惯用概括。
    reason: cross_reference
lexical_decisions:
- source_word: Νυνὶ δὲ
  choice: 但如今
  rationale: 同时保留 δὲ 的转折作用和 νυνὶ 的时间意味，并以自然的现代汉语标示保罗论述中的重大转折。
- source_word: χωρὶς νόμου
  choice: 在律法之外
  rationale: χωρίς 表示分离；此译法避免把它过早解释为单指“不靠遵行律法”，并按上下文将 νόμος 译为“律法”。
- source_word: δικαιοσύνη θεοῦ
  choice: 神的义
  rationale: “义”是 δικαιοσύνη 在保罗书信中的凝练常用译法；“神的”尽量保留属格关系的开放性，不在正文中限定为神自身的属性或从神而来的义。
- source_word: πεφανέρωται
  choice: 已经显明出来
  rationale: 既表达φανερόω 的显露含义，也以“已经……出来”体现完成时所指的既已发生、其结果仍然有效。
- source_word: μαρτυρουμένη
  choice: 都为这义作见证
  rationale: 将现在时被动分词自然转换成汉语主动表达，由律法和先知作见证；“这义”明确其所指，又不增添解释性神学内容。
- source_word: ὑπὸ τοῦ νόμου καὶ τῶν προφητῶν
  choice: 律法和先知
  rationale: 保留犹太经文的惯用合称；不在正文中扩写为“旧约圣经”，以免加入原文没有的后世称谓。
theological_decisions:
- issue: δικαιοσύνη θεοῦ 中属格 θεοῦ 的含义
  choice: 神的义
  alternative: 从神而来的义
  rationale: 该短语既可能着重于神自身的义及其施行，也可能包含神所赐之义的意味；正文保留这种神学张力，脚注列出来源属格的可能理解。
- issue: δικαιοσύνη 的语义范围
  choice: 义
  alternative: 公义／正义
  rationale: “义”能涵盖保罗语境中正直、称义和神拯救行动等关联意义；脚注提示其也可侧重公平审判与正义。
- issue: “律法和先知”的所指
  choice: 保留原有合称
  alternative: 圣经／旧约圣经
  rationale: 该表达在语境中很可能概括以色列的经卷见证，但正文不把这一惯用语直接替换成后世书名。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“显明出来”和“作见证”便于普通读者理解；保留“神的义”“律法和先知”等关键经文用语，并用脚注说明真实存在的词义与属格歧义。
