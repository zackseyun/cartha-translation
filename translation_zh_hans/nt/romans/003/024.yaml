base_translation:
  language: en
  yaml_path: translation/nt/romans/003/024.yaml
  text: being justified freely by his grace through the redemption that is in Messiah Jesus[b][a],
translation:
  language: zh_hans
  text: 却因他的恩典白白地得以称义[a]，借着在弥赛亚耶稣[b]里的救赎。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“被宣告为义”。
    reason: lexical_alternative
  - marker: b
    text: 传统译法：“基督耶稣”。
    reason: alternative_rendering
lexical_decisions:
- source_word: δικαιούμενοι
  choice: 得以称义
  rationale: 保留保罗书信中 δικαιόω 的法庭性用语及被动含义；用“得以”表达蒙受这一行动，并使本节能自然承接上一节的众人。
- source_word: δωρεὰν
  choice: 白白地
  rationale: 表达称义是无偿赐下、并非靠人赚取；这是现代中文圣经语体中简洁而清楚的说法。
- source_word: τῇ αὐτοῦ χάριτι
  choice: 因他的恩典
  rationale: 将与格理解为称义的根据或原因；“恩典”准确保留保罗用语中上帝主动而非人配得的恩惠。
- source_word: ἀπολυτρώσεως
  choice: 救赎
  rationale: 保留该词从奴役或困境中付代价释放出来的含义，同时采用现代中文基督教语境中通行而庄重的词。
- source_word: Χριστῷ
  choice: 弥赛亚
  rationale: 此处 Χριστός 仍具有称号意义，译作“弥赛亚”可显明其“受膏者”的身份；传统译名“基督”列于脚注。
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: 在弥赛亚耶稣里
  rationale: 直接保留希腊文 ἐν 的关系性表达，不把“在……里”具体化为某一种单一机制，以免消除原文的神学张力。
theological_decisions:
- issue: 保罗的称义用语
  choice: 正文采用“得以称义”
  alternative: 被宣告为义
  rationale: “称义”保留 δικαιόω 简洁的法律—关系性内涵，也避免正文用解释性扩译预先限定其全部含义；较直白的释义置于脚注。
- issue: 救赎“在弥赛亚耶稣里”
  choice: 保留“在……里”的表达
  alternative: 借着弥赛亚耶稣所成就的救赎
  rationale: 后者会明确加入“所成就的”，虽符合语境，却超出本节明说的内容；正文因此保留原文关系表达的开放性。
translation_notes:
  register: 采用现代、庄重且便于普通读者理解的中文。保留分词与上文的承接关系，以“却……得以称义”构成汉语句式；“白白地”强调无偿，“因……借着……”分别呈现恩典与救赎在句中的不同关系。
