source:
  edition: SBLGNT
  text: Τί οὖν; προεχόμεθα; οὐ πάντως, προῃτιασάμεθα γὰρ Ἰουδαίους τε καὶ Ἕλληνας πάντας ὑφ’ ἁμαρτίαν εἶναι,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/009.yaml
  text: What then? Are we better? Not at all[a], for we have already charged that both Jews and Greeks are all under sin[b],
translation:
  language: zh_hans
  text: 那么，怎么样呢？我们更优越吗[a]？绝不是！因为我们先前已经指控，犹太人和希腊人全都在罪之下[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们占优势吗？”
    reason: alternative_reading
  - marker: b
    text: 或译：“全都在罪的权势之下。”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν
  choice: 那么，怎么样呢？
  rationale: 保留οὖν的推论衔接和简短问句的论辩节奏，不增添原文没有的“我们该说什么”。
- source_word: προεχόμεθα
  choice: 我们比他们强吗？
  rationale: 该中动态形式的含义有争议；正文以自然中文表达相对优越地位，并由语境补出比较对象“他们”。“我们占优势吗？”作为合理的词义选择保留在脚注中。
- source_word: οὐ πάντως
  choice: 绝不是
  rationale: 表达上下文中的强烈否定，简洁有力，也符合现代汉语论辩语气。
- source_word: προῃτιασάμεθα
  choice: 我们先前已经指控
  rationale: 保留该动词的司法、控诉色彩，并准确体现动作在先。
- source_word: Ἰουδαίους τε καὶ Ἕλληνας
  choice: 犹太人和希腊人
  rationale: 直接保留τε καὶ所连接的两类人，也保留保罗原文惯用的“希腊人”，不擅自改写为“外邦人”。
- source_word: πάντας
  choice: 全都
  rationale: 强调前述两类人无一例外，中文简明自然。
- source_word: ὑφ’ ἁμαρτίαν εἶναι
  choice: 全都在罪之下
  rationale: 保留保罗高度凝练的隶属隐喻，不在正文中将其单向解释为“在罪的权势之下”；解释性译法列于脚注。
theological_decisions:
- issue: προεχόμεθα中第一人称复数所问的是优越地位还是所享优势
  choice: 正文译作“我们比他们强吗？”，表达犹太人是否具有相对优越地位。
  alternative: “我们占优势吗？”
  rationale: 罗马书3:1—9同时涉及犹太人的优势与他们在罪面前并无道德豁免。正文顺应本节强烈否定的语境，脚注则保留动词可能表示“占优势”的真实歧义。
- issue: ὑφ’ ἁμαρτίαν的关系性质
  choice: 在罪之下
  alternative: 在罪的权势之下
  rationale: 直译保留原文可能兼有受罪辖制、处于罪之定罪范围等意涵的神学张力，避免正文过早限定为单一解释。
translation_notes:
  register: 采用现代、庄重而易懂的论辩语体。“那么，怎么样呢？”承接上文；“绝不是”保持保罗回答的力度。正文保留“在罪之下”的凝练表达，脚注说明较具解释性的译法。
