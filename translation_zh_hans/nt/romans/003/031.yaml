  text: νόμον οὖν καταργοῦμεν διὰ τῆς πίστεως; μὴ γένοιτο, ἀλλὰ νόμον ⸀ἱστάνομεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/031.yaml
  text: Do we then nullify the law through faith? May it never be! On the contrary[a], we uphold the law.
translation:
  language: zh_hans
  text: 那么，我们是借着信使律法失效吗？绝对不是！相反，我们维护律法[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们确立律法。”
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμον
  choice: 律法
  rationale: 虽然希腊文没有冠词，但在《罗马书》的论述中指向明确，即摩西律法或作为整体的律法；中文用“律法”即可自然表达这一特定概念。
- source_word: οὖν
  choice: 那么
  rationale: 承接上文并引出推论式反问；“那么”符合现代汉语论辩语气。
- source_word: καταργοῦμεν
  choice: 使……失效
  rationale: 表达使某物失去效力、成为无效的含义，比“废除”更少带有正式立法撤销的色彩，也与下文的正面陈述形成清楚对照。
- source_word: διὰ τῆς πίστεως
  choice: 借着信
  rationale: 保留 διά 加属格所表达的途径或媒介意义；“信”在此延续保罗本段关于信的论述，同时避免增添原文没有的宾语。
- source_word: μὴ γένοιτο
  choice: 绝对不是！
  rationale: 以自然有力的现代汉语传达这一强烈否定，而不将其弱化为普通的“不”。
- source_word: ἀλλὰ
  choice: 相反
  rationale: 明确表达强烈的纠正和转折，衔接前面的否定。
- source_word: ἱστάνομεν
  choice: 维护
  rationale: 在本语境中表达使律法站立、维持其效力，与“使……失效”形成直接对照；同时用脚注保留“确立”这一真实可能的译法。
theological_decisions:
- issue: 信与律法的关系
  choice: 译作“我们维护律法”
  alternative: 我们确立律法
  rationale: ἱστάνομεν 可表示确立，也可在此语境中表示维护、使之站立。主文“维护”紧扣前句所否定的“使……失效”，说明信并不使律法失去效力；脚注保留“确立”，避免把原文的词义张力归结为某一特定神学体系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“绝对不是”保留保罗反驳的强烈力度；整体句式维持原文的推论、反问、否定与正面纠正结构。
