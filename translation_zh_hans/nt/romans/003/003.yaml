  text: τί γάρ; εἰ ἠπίστησάν τινες, μὴ ἡ ἀπιστία αὐτῶν τὴν πίστιν τοῦ θεοῦ καταργήσει;
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/003.yaml
  text: What then? If some were unfaithful[a], will their unfaithfulness nullify God's faithfulness?
translation:
  language: zh_hans
  text: 那么，若有些人不信实，难道他们的不信实会使上帝的信实[a]失效吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“上帝的信心”。希腊语字面为“上帝的‘信’”，但这里很可能是指上帝的信实。
    reason: 保留πίστιν τοῦ θεοῦ的字面形式和词义上的另一种可能。
lexical_decisions:
- source_word: τί γάρ
  choice: 那么，怎么说呢？
  rationale: 这是保罗推进论证、引出诘问的简短转折语；此译符合现代汉语表达，并保留其论辩语气。
- source_word: ἠπίστησάν
  choice: 不信实
  rationale: 该词也可指“不信”，但本句中与ἀπιστία重复呼应，又与上帝的πίστις形成对照，因此“不信实”更能体现人的失信与上帝可靠可信之间的张力。
- source_word: τινες
  choice: 有些人
  rationale: 忠实表达不定复数，指其中一部分人。
- source_word: ἀπιστία
  choice: 不信实
  rationale: 与动词ἠπίστησάν保持词根呼应，并与上帝的“信实”构成清楚对照；“不信”仍是可能含义。
- source_word: πίστιν τοῦ θεοῦ
  choice: 上帝的信实
  rationale: 该属格短语直译为“上帝的信”，但在人的ἀπιστία与上帝的πίστις对照中，更自然地指上帝的可信可靠，即“信实”；脚注保留另一种译法。
- source_word: καταργήσει
  choice: 使……失效
  rationale: 表达使某事归于无效、失去效力的含义，也适合本句的反问语气。
- source_word: μή
  choice: 难道……吗？
  rationale: 以汉语反问形式传达μή所预期的否定回答，即人的不信实并不能使上帝的信实失效。
theological_decisions:
- issue: πίστιν τοῦ θεοῦ这一保罗书信中可有争议的表达
  choice: 上帝的信实
  alternative: 上帝的信
  rationale: 上下文把人的ἀπιστία与上帝的πίστις相对照，因而“信实”最能传达上帝可靠、守信的含义；同时用脚注保留原文形式及“信”的可能译法，避免把词义争议完全消除。
- issue: ἠπίστησάν与ἀπιστία的语义
  choice: 不信实
  alternative: 不信
  rationale: 在本句的修辞对照中，“不信实”能呈现人失信与上帝信实之间的对应关系；但这些词也可表示不信或不相信，因此不将“不信”的可能性视为不存在。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“那么，怎么说呢”体现论证转折；“难道……吗”保留原文预期否定回答的反问力度。主文避免生硬直译，脚注则保存关键希腊语短语的真实歧义。
