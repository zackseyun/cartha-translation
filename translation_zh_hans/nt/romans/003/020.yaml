id: ROM.3.20
reference: Romans 3:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: διότι ἐξ ἔργων νόμου οὐ δικαιωθήσεται πᾶσα σὰρξ ἐνώπιον αὐτοῦ, διὰ γὰρ νόμου ἐπίγνωσις ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/020.yaml
  text: because by works of the law no one will be justified before him, for through the law comes the knowledge of sin.
translation:
  language: zh_hans
  text: 因为没有一个人会靠行律法在他面前被称为义；因为借着律法，人认识到罪。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξ ἔργων νόμου
  choice: 靠行律法
  rationale: 表达凭借或根据律法行为寻求称义的意思；比直译“出于律法的行为”更符合现代汉语，同时不把“律法”缩限为某一类具体规条。
- source_word: πᾶσα σὰρξ
  choice: 没有一个人
  rationale: 该闪语色彩的表达在此泛指全人类；译为“没有一个人”自然清楚，也与否定句的实际语义相符。
- source_word: δικαιωθήσεται
  choice: 被称为义
  rationale: 保留希腊文的被动语态和法庭性语义，不改写成一般性的“成为好人”或“证明自己无罪”。
- source_word: ἐπίγνωσις ἁμαρτίας
  choice: 认识到罪
  rationale: 既传达对罪的认知，也保留原文未明说是认识自己的罪、罪的本质或罪责这一开放性。
theological_decisions:
- issue: 称义与行律法的关系
  choice: 没有一个人能靠行律法……被称为义
  alternative: 没有一个遵行律法的人会被称为义
  rationale: 原文否定的是以律法行为作为称义根据，并非否定顺服本身或断言凡遵行律法者都不被称义。
- issue: 称义行动者的表达
  choice: 保留“被称为义”的神学被动语态
  alternative: 神称他为义
  rationale: 上下文表明施行判断的是神，但原句使用被动式；保留被动可避免在正文中加入原文未明说的主语。
- issue: 律法与罪的认识
  choice: 借着律法，人认识到罪
  alternative: 律法只使人知罪
  rationale: 原文说明律法带来对罪的认识，却没有“只”这一限制词，因此不额外强化排他性命题。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“靠行律法”避免生硬的名词堆叠；分号保留两项因果陈述之间的紧密论证关系。代词“他”承接上下文，不在本节擅自改成明说的“神”。
