  yaml_path: translation/nt/romans/003/013.yaml
  text: Their throat is an open grave[a]; they deceive with their tongues[c][b]; the venom of asps is under their lips.
translation:
  language: zh_hans
  text: 他们的喉咙是敞开的坟墓；他们用舌头耍诡诈[a]；他们嘴唇下有毒蛇的毒液[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们一直用舌头耍诡诈。”原文动词为未完成时，可强调持续或反复进行的意味。
    reason: lexical_alternative
  - marker: b
    text: “毒蛇”所译的希腊词可指“蝰蛇”等有毒的蛇；具体蛇种不能完全确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: τάφος
  choice: 坟墓
  rationale: 自然、通行，并保留死亡与腐朽的鲜明意象；“墓穴”亦可，但较偏重实体空间。
- source_word: ἀνεῳγμένος
  choice: 敞开的
  rationale: 以状态性表达对应完成时被动分词“已经打开而仍处于开启状态”，比单用“打开的”更具书面庄重感。
- source_word: λάρυγξ
  choice: 喉咙
  rationale: 现代汉语中最清楚自然的身体部位名称，也保留原文由发声器官构成的比喻。
- source_word: ἐδολιοῦσαν
  choice: 不断行诡诈
  rationale: “行诡诈”保留动词所指的欺诈行为，“不断”体现未完成时的持续或反复意味，同时不将其缩窄为单次欺骗。
- source_word: ἰὸς
  choice: 毒液
  rationale: 在蛇的语境中，“毒液”比泛称“毒”更精确，也符合现代汉语用法。
- source_word: ἀσπίδων
  choice: 毒蛇
  rationale: 该希腊词所指蛇种难以用现代汉语准确锁定；“毒蛇”自然地保留其致命性，并避免“虺蛇”等古奥或物种对应不确定的说法。
- source_word: ὑπὸ τὰ χείλη αὐτῶν
  choice: 他们嘴唇下
  rationale: 贴近原文空间表达，保留毒液藏在嘴唇之下、随时可由言语伤人的身体意象。
