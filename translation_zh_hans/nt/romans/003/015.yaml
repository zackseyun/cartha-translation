lexical_decisions:
- source_word: ὀξεῖς
  choice: 飞快
  rationale: 该词本义为“尖锐、敏捷”，在这里修饰“脚”，表达迅速奔向暴力行动；“飞快”自然保留其速度与紧迫感。
- source_word: οἱ πόδες αὐτῶν
  choice: 他们的脚
  rationale: 直接保留原文的身体意象，并以现代汉语自然表达所属关系。
- source_word: ἐκχέαι
  choice: 流
  rationale: 该动词本义是“倒出、倾出”；与“血”连用时，“流人的血”是自然、庄重的汉语表达，同时保留使血倾流的暴力含义。
- source_word: αἷμα
  choice: 人的血
  rationale: “血”是直接对应；补出“人”使“流血”明确表示杀伤他人，而非自身出血，符合上下文所描写的暴行。
