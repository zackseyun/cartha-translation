  text: πάντες ἐξέκλιναν, ἅμα ἠχρεώθησαν· οὐκ ⸀ἔστιν ποιῶν χρηστότητα, οὐκ ἔστιν ἕως ἑνός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/012.yaml
  text: All have turned aside[a]; together they have become worthless. There is no one who does what is good[b]; there is not even one.
translation:
  language: zh_hans
  text: 众人都偏离了，一同变得毫无用处[a]；没有行善的[b]，连一个也没有。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“变得无用”或“败坏了”。
    reason: lexical_alternative
  - marker: b
    text: 或译“施行良善”；“善”也可含“仁慈、恩慈”的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες
  choice: 众人都
  rationale: 保留复数所表达的普遍范围，不额外限定所指群体。
- source_word: ἐξέκλιναν
  choice: 偏离了正道
  rationale: 以自然汉语表达偏离、转离的道德意象，并保留其已然发生的意味；“正道”是为使汉语中的“偏离”语义完整而补出的惯用搭配。
- source_word: ἅμα
  choice: 一同
  rationale: 表达众人共同处于同一境况，而非主要强调时间上的同时。
- source_word: ἠχρεώθησαν
  choice: 变得毫无用处
  rationale: 保留被动形式所呈现的结果状态及强烈负面评价，也避免直接把该词解释成单指道德败坏。
- source_word: ποιῶν
  choice: 行
  rationale: 在“没有……的”结构中自然表达分词所指持续或一贯的行为。
- source_word: χρηστότητα
  choice: 善
  rationale: 简洁保留其道德上的良善之意；该词也可突出仁慈、恩慈，故以脚注说明。
- source_word: οὐκ ἔστιν
  choice: 没有……的
  rationale: 采用现代汉语自然的存在否定句式，同时保留原文的绝对否定。
- source_word: ἕως ἑνός
  choice: 连一个也没有
  rationale: 按希腊语习语传达递进而强调的彻底否定。
theological_decisions:
- issue: 众人偏离及无人行善的绝对陈述
  choice: 按原文保留普遍、无例外的措辞
  alternative: 将其弱化为一般趋势或仅指部分人
  rationale: πάντες、οὐκ ἔστιν及ἕως ἑνός共同形成强烈的普遍性断言；译文不替文本缓和其神学张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“偏离了正道”使转离的意象在汉语中清楚自然；“毫无用处”保留原词的强烈评价。分号对应原文两组并列陈述，末句以“连……也……”再现强调。
