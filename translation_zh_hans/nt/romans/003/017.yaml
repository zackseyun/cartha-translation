  yaml_path: translation/nt/romans/003/017.yaml
  text: and they have not known the way of peace[a].
translation:
  language: zh_hans
  text: 他们也不知道和平之路[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “和平之路”也可译作“平安的道路”。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: 也
  rationale: 承接上下文连续列举的指控；汉语中用“也”比句首直译为“和”更自然，并保留累加语气。
- source_word: ὁδὸν
  choice: 路
  rationale: 既保留道路的形象，也可自然表达生活方式或行事路径；在“和平之路”这一结构中简洁庄重。
- source_word: εἰρήνης
  choice: 和平
  rationale: 准确表达 εἰρήνη，并说明这条路以和平为特征或通向和平；不擅自缩窄为内心平安。
- source_word: οὐκ ἔγνωσαν
  choice: 不知道
  rationale: 以自然现代汉语表达其未曾认识、不了解这条路的事实；希腊语简单过去时在此不必机械标示时态。
theological_decisions:
- issue: “和平之路”的语义范围
  choice: 保留“和平之路”这一开放表达
  alternative: 使人和睦的生活方式／通往和平的道路
  rationale: 原文属格结构可涵盖以和平为特征、促成和平或通向和平的道路；正文不将其限定为单一解释。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“他们也不知道……”承接罗马书3章引文串的累加语势；“和平”较适合公共、关系层面的语境，而脚注保留“平安”这一常见译法。
