  verdict: revise
  source_fidelity: 原文的连续设问、被动式“被排除”，以及“行为／信”与三次 νόμος 的对照都应保留。草稿基本忠实，但“可夸耀的”较明显地把 καύχησις 限定为“可用来夸耀的依据”；此处更宜保留为“夸耀”这一行为或状态。
  naturalness: “律”单独用作此处反复出现的名词，在现代普通话中略显生硬，且“借着哪一种律”不够顺畅。改为“律法”并使用“凭着”构成自然、庄重的论辩问答；重复“律法”也再现原文的修辞重复。
  terminology: “夸耀”“被排除”“行为”“信”均可保留。“信的律法”刻意不扩展为“信心的原则”或“因信称义的法则”，从而不替原文解决其修辞性的含义张力。
