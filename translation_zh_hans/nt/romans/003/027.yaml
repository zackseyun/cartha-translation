  - severity: low
    issue: “律”及“借着哪一种律”不够符合现代标准书面汉语。
    rationale: “律”单用容易显得截断或引向音律；“律法”是对 νόμος 更稳定的现代汉语对应，而“凭着什么律法”更自然。
