  text: Ποῦ οὖν ἡ καύχησις; ἐξεκλείσθη. διὰ ποίου νόμου; τῶν ἔργων; οὐχί, ἀλλὰ διὰ νόμου πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/027.yaml
  text: Where, then, is boasting? It has been excluded. Through what kind of law? A law of works? No, but through a law of faith.
translation:
  language: zh_hans
  text: 既然如此，夸耀在哪里呢？已经被排除了。凭着什么律法呢？凭着行为的律法吗？不是，而是凭着信的律法。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καύχησις
  choice: 夸耀
  rationale: 既可指夸口的行为，也可指可夸耀的依据；“夸耀”在此保留一定的语义宽度。
- source_word: ἐξεκλείσθη
  choice: 已经被排除了
  rationale: 保留被动语态和彻底排除在外的意象，并体现简单过去时在论证中的定论语气。
- source_word: νόμος
  choice: 律
  rationale: 本节重复使用 νόμος，可能带有“律法”“原则”或“法则”的修辞张力；统一译作较简洁的“律”，避免提前消解歧义。
- source_word: ἔργων
  choice: 行为
  rationale: 在保罗的论证语境中指作为称义依据的行为；不擅自增补“律法的”，以忠于本节的省略表达。
- source_word: πίστεως
  choice: 信
  rationale: 保留属格结构的开放性，不擅自明确为“人的信心”或“信实”。
- source_word: διὰ
  choice: 借着
  rationale: 与属格连用表示媒介或途径；两处保持一致，贴合原文平行结构。
theological_decisions:
- issue: “信之律”的含义
  choice: 信之律
  alternative: 信心的原则／关于信的律法
  rationale: 原文 νόμος πίστεως 用语刻意凝练，与“行为之律”对照；直译式结构保留它究竟指原则、规范还是律法运作方式的张力。
- issue: “夸耀”被排除的施事者
  choice: 已经被排除了
  alternative: 上帝已经把它排除了
  rationale: 原文使用神学被动式但没有明说施事者，因此中文不补出“上帝”，以保存原文表达。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。保留连续问答的论辩节奏，并以“行为之律／信之律”的平行形式再现希腊文结构及其有意留下的语义张力。
