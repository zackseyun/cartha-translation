  rationale: 修订仅调整“夸耀”的表达和“律法／凭着”的现代汉语措辞，保留原文被动语态、问答节奏、三重 νόμος 重复，以及“行为的律法／信的律法”的开放性对照；不增补任何特定神学解释。
