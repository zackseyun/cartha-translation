source:
  edition: SBLGNT
  text: ⸀εἴπερ εἷς ὁ θεός, ὃς δικαιώσει περιτομὴν ἐκ πίστεως καὶ ἀκροβυστίαν διὰ τῆς πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/030.yaml
  text: since God is one[c][b][a], who will justify the circumcised by faith and the uncircumcised through faith.
translation:
  language: zh_hans
  text: 既然神是独一的[a]，他必本于信心称受割礼的人为义，也必借着信心称未受割礼的人为义[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“如果神确实是独一的。”
    reason: alternative_reading
  - marker: b
    text: 希腊文直译为“割礼”和“未受割礼”，在这里分别指受割礼的人和未受割礼的人。
    reason: cultural_note
  - marker: c
    text: 保罗在两处使用不同的表达：“本于信心”和“借着信心”；这种差别可能只是措辞上的变化，不一定表示鲜明的神学对比。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴπερ
  choice: 既然
  rationale: 这里并非表示保罗对神的独一有所怀疑，而是以共同承认的信念作为论证根据；“既然”自然地表达这一推论关系，同时以脚注保留条件式理解。
- source_word: εἷς ὁ θεός
  choice: 神是独一的
  rationale: 保留原文强调神独一的宣告，也使它清楚成为后半句的论证基础。
- source_word: δικαιώσει
  choice: 必……称……为义
  rationale: “称……为义”准确表达 δικαιόω 在保罗论述中的司法性含义；“必”保留将来时及其确定语气。
- source_word: περιτομήν
  choice: 受割礼的人
  rationale: 原文以“割礼”转指受割礼者；正文译出所指的人群，但不进一步限定为某一族群。
- source_word: ἐκ πίστεως
  choice: 本于信心
  rationale: “本于”保留 ἐκ 所表达的来源或根据，并与后面的 διά 区分；“信心”是现代汉语中自然且清楚的 πίστις 译法。
- source_word: ἀκροβυστίαν
  choice: 未受割礼的人
  rationale: 原词字面为“未受割礼”，在此转指未受割礼者；不直接译作“外族人”，以免把原文的转喻解释得过窄。
- source_word: διὰ τῆς πίστεως
  choice: 借着信心
  rationale: “借着”体现 διά 的媒介含义，并保留它与 ἐκ πίστεως 在措辞上的差别；希腊文冠词在此不必在汉语中另行表达。
theological_decisions:
- issue: ἐκ πίστεως 与 διὰ τῆς πίστεως 是否包含神学上的实质区别
  choice: 分别译作“本于信心”和“借着信心”，保留介词差异，但不宣称二者必有严格的教义性对立。
  alternative: 将两处都译作“因信心”，视为修辞上的同义变化。
  rationale: 原文有意使用不同介词，译文宜让读者看见这一差异；然而上下文不足以证明保罗在此建立两种不同的称义方式，因此不替原文消除或强化这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“称……为义”保留保罗论述的关键司法性用语；“受割礼的人／未受割礼的人”清楚传达原文转喻，同时避免在正文中直接等同于犹太人与外族人。
