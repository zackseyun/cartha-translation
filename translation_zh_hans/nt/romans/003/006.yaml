id: ROM.3.6
reference: Romans 3:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: μὴ γένοιτο· ἐπεὶ πῶς κρινεῖ ὁ θεὸς τὸν κόσμον;
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/006.yaml
  text: Absolutely not! Otherwise[a], how will God judge the world?
translation:
  language: zh_hans
  text: 绝不是这样！[a]不然，神将怎样审判世界呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“万万不可！”较贴近形式可译：“绝不可如此！”
    reason: 说明μὴ γένοιτο既可按其强烈否定的语用功能翻译，也可采用较形式对应的表达。
lexical_decisions:
- source_word: μὴ γένοιτο
  choice: 绝不是这样！
  rationale: 这是保罗用来强烈否定前述推论的惯用表达。“绝不是这样”以自然的现代汉语保留其坚决驳斥的语气，而不拘泥于愿望式的字面形式。
- source_word: ἐπεὶ
  choice: 不然
  rationale: 此处承接被否定的前提，引出其不能成立的后果；“不然”简洁自然地体现论证关系，同时不把连接词解释得过满。
- source_word: κρινεῖ
  choice: 将怎样审判
  rationale: κρινεῖ是将来时直陈语气。“将怎样审判”保留将来指向，也维持原文反问的形式，避免改写成带有额外能力意味的“怎能审判”。
- source_word: ὁ θεὸς
  choice: 神
  rationale: 采用现代中文基督教文本中清楚、庄重且通行的称谓；定冠词在此不需另行译出。
- source_word: τὸν κόσμον
  choice: 世界
  rationale: κόσμος在这里指神施行审判的世界，广义上包含世人；“世界”是最直接且能保留范围弹性的对应词。
theological_decisions:
- issue: μὴ γένοιτο的否定力度与形式
  choice: 以“绝不是这样”表达对上一推论的强烈否定
  alternative: 译为较传统的“断乎不是”或较贴近愿望式形式的“绝不可如此”
  rationale: 原语是保罗惯用的强烈驳斥语。现代惯用表达更能传达其实际语用力度，又不加入特定教派解释。
- issue: κρινεῖ的将来时与反问语气
  choice: 译作“神将怎样审判世界呢”
  alternative: 译作“神怎能审判世界呢”
  rationale: 所选译法保留将来时，并让反问本身表达前提的不可能；备选译法虽更口语化，却可能额外突出神是否有能力或资格审判。
- issue: κόσμος的指涉范围
  choice: 保留为“世界”
  alternative: 明确译为“世人”
  rationale: 上下文很可能聚焦全人类受审判，但“世界”更直接对应κόσμος，并保留原文在人的世界与更广世界之间的语义幅度。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“绝不是这样”清楚有力而不显陈旧；“将怎样审判”略带书面色彩，以准确保留希腊文将来时及反问结构。
