  yaml_path: translation/nt/romans/003/010.yaml
  text: 'As it is written: “There is no one righteous, not even one.”'
translation:
  language: zh_hans
  text: 正如经上所记：“没有义人，连一个也没有。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθὼς
  choice: 正如
  rationale: 自然引出经文依据，并保留与后面的引用公式相连的比较、符合之意。
- source_word: γέγραπται
  choice: 经上所记
  rationale: 用现代汉语常见的圣经引用公式表达完成时被动语态，既说明已经写下，也含有持续有效的意味。
- source_word: ὅτι
  choice: ：
  rationale: 此处ὅτι用于引出所引用的内容，汉语以冒号直接引语更自然，无须另译“说”或“就是”。
- source_word: Οὐκ ἔστιν
  choice: 没有
  rationale: 准确而自然地表达存在句的否定。
- source_word: δίκαιος
  choice: 义人
  rationale: 保留保罗语境中道德及与神关系层面的“义”这一核心概念；“义人”也符合自然、庄重的现代汉语圣经表达。
- source_word: οὐδὲ εἷς
  choice: 连一个也没有
  rationale: 明确传达οὐδὲ的递进强调和εἷς的绝对范围，汉语表达自然有力。
theological_decisions:
- issue: 是否将绝对陈述解释性地限定为某类人，或改写为人的行为表现
  choice: 没有义人，连一个也没有
  alternative: 没有一个人是义人；没有行义的人
  rationale: 原文表述概括而绝对，并未在本节中添加群体限定或把“义人”解释为“行义的人”。所选译法保留保罗引文的普遍性、简洁性和神学张力。
translation_notes:
  register: 采用现代、庄重、易懂的标准普通话。“正如经上所记”是自然的引经公式；引文保持短促有力。无需脚注。
