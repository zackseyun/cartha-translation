  text: whose mouth is full of cursing and bitterness.
translation:
  language: zh_hans
  text: 他们满口都是咒诅和苦毒。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὧν
  choice: 他们
  rationale: 该属格关系代词承接上文所说的人；汉语以“他们”开启分句最自然，同时保留其指代关系。
- source_word: τὸ στόμα
  choice: 满口
  rationale: 原文为单数“口”，具有概括性；与 γέμει 合译为汉语惯用的“满口”，既保留言语意象，也表达充满之意。
- source_word: ἀρᾶς
  choice: 咒诅
  rationale: 指咒骂或求祸临到他人的言语；“咒诅”庄重而准确，并可自然用于“满口都是……”的结构。
- source_word: πικρίας
  choice: 苦毒
  rationale: 保留该词既可指内在怨恨、也可体现于尖刻言语的语义张力；“苦毒”在现代汉语圣经语境中清楚且庄重。
- source_word: γέμει
  choice: 满……都是
  rationale: 该现在时动词表示“充满”；“满口都是”以自然汉语传达持续的特征描述。
theological_decisions: []
