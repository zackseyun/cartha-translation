lexical_decisions:
- source_word: σύντριμμα
  choice: 毁灭
  rationale: 该词表示破碎、摧毁所造成的毁坏；“毁灭”简洁有力，也能自然地与“苦难”并列。
- source_word: ταλαιπωρία
  choice: 苦难
  rationale: 该词指悲惨、困苦的处境或痛苦；“苦难”是现代汉语中自然庄重、易懂的表达。
- source_word: ἐν ταῖς ὁδοῖς αὐτῶν
  choice: 遍布他们所走的路
  rationale: 保留“道路”的具体意象，同时以“所走的路”自然传达其行为和人生道路的引申义；“遍布”表达事物出现在其道路之中的结果性画面。
- source_word: καὶ
  choice: 和
  rationale: 自然连接两个并列名词。
