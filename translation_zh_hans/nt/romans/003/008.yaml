  text: καὶ μὴ καθὼς βλασφημούμεθα καὶ καθώς φασίν τινες ἡμᾶς λέγειν ὅτι Ποιήσωμεν τὰ κακὰ ἵνα ἔλθῃ τὰ ἀγαθά; ὧν τὸ κρίμα ἔνδικόν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/008.yaml
  text: And why not say—as we are slandered and as some claim that we say—“Let us do evil so that good may come”? Their condemnation is just[a][b].
translation:
  language: zh_hans
  text: 那么，何不就如我们受毁谤、又如有人声称我们所说的那样，说：“我们来作恶，好让善事来到”呢？他们所受的定罪是公正的[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文在此承接上文，采用省略式反问；较贴近原文形式可译为：“又何不如我们受毁谤、又如有人声称我们所说的那样，说：‘我们来作恶，好让善事来到’呢？”
    reason: lexical_alternative
  - marker: b
    text: “他们”主要指如此毁谤或指控保罗等人的人，也可涵盖认同这种“作恶以成善”说法的人。
    reason: alternative_reading
lexical_decisions:
- source_word: βλασφημούμεθα
  choice: 别人毁谤我们
  rationale: 这里指保罗等人的言论遭到恶意歪曲，而非专指亵渎上帝；“毁谤”准确保留敌意诬蔑的语气。
- source_word: φασίν τινες
  choice: 有些人声称
  rationale: “声称”既表达转述，也带出上下文中未经证实且带敌意的指控意味。
- source_word: ἡμᾶς λέγειν
  choice: 我们所说的
  rationale: 按原文保留“说”，不扩展为“教导”，以免加入原文没有明说的含义。
- source_word: Ποιήσωμεν
  choice: 我们来作
  rationale: 第一人称复数虚拟语气在此用于劝促，以“我们来……”自然传达其号召语气。
- source_word: τὰ κακὰ
  choice: 恶
  rationale: 冠词加中性复数形容词泛指恶事；现代汉语用“作恶”简洁自然。
- source_word: ἵνα ἔλθῃ τὰ ἀγαθά
  choice: 好让善事出现
  rationale: “好让”保留ἵνα的目的或预期结果关系；“善事出现”也保留τὰ ἀγαθά的复数概括意义。
- source_word: κρίμα
  choice: 定罪
  rationale: 此处是负面的司法判决，不只是一般意义的“审判”，所以译作“定罪”。
- source_word: ἔνδικον
  choice: 公正的
  rationale: 保留该词兼具司法正当性与道德正当性的庄重含义。
- source_word: καὶ μὴ
  choice: 那么，为什么不干脆……呢
  rationale: 原文承接上一节而采用省略式反问；补出“为什么不……呢”使现代汉语句意完整，“那么”标明其承接关系。
theological_decisions:
- issue: ὧν（“这些人／他们的”）所指对象
  choice: 正文译作“这些人”，让指代主要落在提出毁谤性指控的人身上，并以脚注说明范围
  alternative: 明确译作“那些持这种主张的人”或仅指“毁谤我们的人”
  rationale: 关系代词的先行对象在语法和论证上可涵盖诬称保罗如此说的人，也可能包括赞同“作恶以成善”这一推论的人；正文不把范围限定得过窄。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“作恶”与“善事出现”形成清楚对照；保留原文反问、毁谤指控及司法性结论之间的张力。破折式英文结构在中文中改用“像……像……那样”的嵌入结构，以尽量维持原文语序和修辞关系。
