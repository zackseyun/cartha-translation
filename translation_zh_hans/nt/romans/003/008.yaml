  rationale: 删除无原文依据的“干脆”，重整嵌入式比较结构，使其在现代汉语中清晰自然；同时保留原文的反问、省略承接、毁谤指控、劝促式引语及ὧν指代的开放性。脚注a一并修正为语法完整的说明和替代译法。
