  naturalness: “因为我们认定，人是借着信称义的，不靠律法的行为”是现代普通话中自然、庄重且清楚的论证句式。“是……称义的”明确呈现原文被动不定式所表达的称义关系，避免“人称义”可能产生的主动或语法歧义。
  terminology: “称义”保留中文保罗书信的既有核心术语，并适切传达δικαιοῦσθαι的法庭性而不强加特定神学解释。“借着信”对应πίστει；“律法的行为”对应ἔργων νόμου，避免把它预先限定为单纯的守律法行动。
