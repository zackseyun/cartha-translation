  text: λογιζόμεθα ⸀γὰρ ⸂δικαιοῦσθαι πίστει⸃ ἄνθρωπον χωρὶς ἔργων νόμου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/028.yaml
  text: For we conclude that a person is justified by faith apart from works of the law[a][b].
translation:
  language: zh_hans
  text: 因为我们认定，人是借着信称义的，不靠律法的行为。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λογιζόμεθα
  choice: 我们认定
  rationale: 该动词在此表达经过论证所得的判断；“认定”既保留推断、判断之意，也自然衔接保罗的论述。
- source_word: γάρ
  choice: 因为
  rationale: 该连词说明本句为前文提供理由或论证依据；中文用“因为”清楚保留这一解释关系。
- source_word: δικαιοῦσθαι
  choice: 称义
  rationale: “称义”是中文圣经传统中简洁而准确的法庭性表达，保留被判定或宣告为义的含义，同时不把其丰富的保罗神学内涵完全化约为一种释义。
- source_word: πίστει
  choice: 借着信
  rationale: 无冠词的与格在此表达信作为称义的途径或凭借；“借着信”自然且避免把与格的功能说得过死。
- source_word: ἄνθρωπον
  choice: 人
  rationale: ἄνθρωπος虽为语法阳性，此处泛指任何人；现代汉语“人”准确表达这一普遍意义，无须添加性别说明。
- source_word: χωρὶς
  choice: 不在于
  rationale: 该介词表达排除、分离；结合中文句法，“不在于”清楚呈现称义并非以律法之行为为根据，同时保持与“借着信”的对照。
- source_word: ἔργων νόμου
  choice: 遵行律法
  rationale: 原文直译为“律法的行为”。正文采用自然现代汉语“遵行律法”，表达由律法所规定或与守律法相关的行为；脚注保留更形式对应的译法，以免过早限定该保罗用语的范围。
theological_decisions:
- issue: δικαιοῦσθαι的法庭性与传统神学用语
  choice: 称义
  alternative: 被宣告为义
  rationale: 正文保留已广为理解的保罗书信用语“称义”，既有法庭性，也不排除该词在上下文中的完整神学张力；“被宣告为义”虽更具解释性，却可能将词义限定得更窄。
- issue: ἔργων νόμου的范围
  choice: 遵行律法
  alternative: 律法的行为
  rationale: “遵行律法”较符合自然现代汉语，但不把该短语改写成泛指“做好事”或仅指人的功德；脚注给出形式更贴近原文的“律法的行为”，以保存可能的释义空间。
- issue: 泛指的ἄνθρωπον
  choice: 人
  alternative: 一个人
  rationale: 此处并非特指男性，而是对人作普遍论断；汉语“人”自然、准确，不引入原文没有的性别限制。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式保留原文“理由—结论—对照”的论证结构；正文避免把“律法的行为”释成笼统的善行，也避免加入原文没有的“唯独”等限定词。
