- from: 因为我们认定，人称义是借着信，不在于遵行律法[a]。
  to: 因为我们认定，人是借着信称义的，不靠律法的行为。
  rationale: 修订保留“因为—我们认定”的论证推进，维持“称义”与“借着信”的传统而准确表达，并将“律法的行为”置于正文，以忠实保留原文及英语审校轨迹中的术语范围。原脚注原为对正文解释性改写的直译说明；既然正文已采用“律法的行为”，该脚注不再需要，故删除。
