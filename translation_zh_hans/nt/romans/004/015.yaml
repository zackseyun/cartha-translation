base_translation:
  language: en
  yaml_path: translation/nt/romans/004/015.yaml
  text: For the law produces wrath[a], but where there is no law[b], neither is there transgression.
translation:
  language: zh_hans
  text: 因为律法招致愤怒[a]；哪里没有律法，哪里也就没有过犯[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “律法”也可理解为特指摩西律法。
    reason: alternative_reading
  - marker: b
    text: “过犯”也可译作“违犯”，指越过律法所划定的界限。
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμος
  choice: 律法
  rationale: “律法”是现代中文圣经语境中自然且庄重的对应词；此处不加“摩西”，以保留保罗用语的范围含混，既可表达一般原则，也不排除摩西律法的背景。
- source_word: ὀργή
  choice: 愤怒
  rationale: “愤怒”保留该词在保罗论述中的审判意味，同时不在正文中明言愤怒的主体，因为希腊文也未明说。
- source_word: κατεργάζεται
  choice: 招致
  rationale: 在本句中“招致”自然表达律法带来愤怒这一结果，比“产生”更符合现代汉语搭配，同时保留其使结果发生的语义。
- source_word: οὗ δὲ
  choice: 哪里……哪里也就……
  rationale: 用对应关联结构清楚表达地点兼条件性的关系；分号体现 δέ 所标出的对照，无须机械译出“但是”。
- source_word: παράβασις
  choice: 过犯
  rationale: “过犯”指越过既定界限或违犯命令，符合该词与律法之间的特定关系；脚注列出更直白的词义选择。
theological_decisions:
- issue: νόμος 在保罗论证中的范围
  choice: 律法
  alternative: 摩西律法
  rationale: 正文保留宽泛表述，不预先把原则限定为摩西律法，亦不排除其在上下文中的相关背景。
- issue: ὀργή 的主体
  choice: 愤怒
  alternative: 上帝的愤怒
  rationale: 原文没有明说愤怒的主体；虽然上下文可能指向上帝的审判性愤怒，正文不补入“上帝的”，以保存原文的含蓄。
translation_notes:
  register: 采用简明、庄重的现代标准汉语。“因为”承接上文论证；分号及“哪里……哪里也就……”使两分句的因果与对照关系清晰。所有脚注标记均已置于正文。
