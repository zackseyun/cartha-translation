id: ROM.4.9
reference: Romans 4:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ὁ μακαρισμὸς οὖν οὗτος ἐπὶ τὴν περιτομὴν ἢ καὶ ἐπὶ τὴν ἀκροβυστίαν; λέγομεν ⸀γάρ· Ἐλογίσθη τῷ Ἀβραὰμ ἡ πίστις εἰς δικαιοσύνην.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/009.yaml
  text: Is this blessing[a], then, for the circumcised, or also for the uncircumcised? For we say, “Faith was counted to Abraham as righteousness.”
translation:
  language: zh_hans
  text: 那么，这福分是给受割礼的人，还是也给未受割礼的人呢？因为我们说：“亚伯拉罕的信被算为义[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“公义”。
    reason: δικαιοσύνη可按语境表达为“义”或“公义”；正文采用保罗此处关于称义地位的常用译法，脚注保留词义上的另一种表达。
lexical_decisions:
- source_word: μακαρισμός
  choice: 福分
  rationale: 本词承接4:6–8所宣告的有福状态；“福分”在现代汉语中自然，也保留了对这种蒙福境况的指称。
- source_word: περιτομή
  choice: 受割礼的人
  rationale: 原文名词“割礼”在这里借代以割礼为标志的人群；译出所指的人，使汉语清楚自然。
- source_word: ἀκροβυστία
  choice: 未受割礼的人
  rationale: 原文名词“未受割礼”在这里同样借代一个人群，与“受割礼的人”形成明确对照。
- source_word: πίστις
  choice: 信
  rationale: “信”准确而简洁，适合保罗引用亚伯拉罕之事的语境；不把它扩展解释为“忠信”等较特定的理解。
- source_word: ἐλογίσθη
  choice: 被算为
  rationale: 保留λογίζομαι所含的计算、认定意味，同时使用普通读者容易理解的现代汉语表达。
- source_word: δικαιοσύνη
  choice: 义
  rationale: “义”是保罗此处论及人在神面前地位时简洁而传统的对应词，也能保留神学张力，不把含义扩写成一套解释。
- source_word: εἰς δικαιοσύνην
  choice: 算为义
  rationale: 这一表达自然传达信被认定为义的关系，同时不进一步说明这种认定的机制。
theological_decisions:
- issue: 亚伯拉罕的信与义之间的表述
  choice: 亚伯拉罕的信被算为义
  alternative: 亚伯拉罕的信被归算作义
  rationale: 所选译法紧贴引文的措辞，保留“信”与“义”之间未经展开说明的关系，避免把某一完整的教义体系加入经文。
- issue: 割礼与未受割礼者是否同享福分
  choice: 是给受割礼的人，还是也给未受割礼的人
  alternative: 是临到割礼，还是也临到未受割礼
  rationale: 原文以两个名词借代人群；汉语直接译明为人，既保持问题的范围，也避免把福分理解为临到礼仪本身。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。问句保留原文由受割礼者扩展到未受割礼者的推进；引文简洁，不添加解释性主语或教义术语。英语咨询层的脚注位置与内容似不相符，因此依据希腊文词义将脚注标在“义”之后。
source_grounding:
  english_pob_role: consult_only
