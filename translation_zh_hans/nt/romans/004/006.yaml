  to: 正如大卫也论到一个人所蒙的福分：上帝不凭行为把义算给他。[a]
  rationale: 修订删除原文未明示的“这样”，将归算的对象明确译为“义”，并以“不凭行为”自然表达“离开行为／不以行为为根据”的对照。保留代表性单数的概括性，不增添关于归算机制或义之性质的神学解释。
