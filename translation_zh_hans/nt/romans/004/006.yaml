  text: καθάπερ καὶ Δαυὶδ λέγει τὸν μακαρισμὸν τοῦ ἀνθρώπου ᾧ ὁ θεὸς λογίζεται δικαιοσύνην χωρὶς ἔργων·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/006.yaml
  text: Just as David also speaks of the blessedness of the man to whom God credits righteousness apart from works:[a][b][c]
translation:
  language: zh_hans
  text: 正如大卫也论到一个人所蒙的福分：上帝不凭行为把义算给他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “把义算给他”也可译作“把义归在他账上”或“算他有义”。
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ
  choice: 正如
  rationale: 引出与上文论证相呼应的例证，既贴近原文比较关系，也符合现代汉语表达。
- source_word: καὶ
  choice: 也
  rationale: 表示大卫是进一步加入的见证，保留其附加语气。
- source_word: λέγει τὸν μακαρισμόν
  choice: 说到……的福分
  rationale: 原文直译近于“说出……的蒙福”，此处用自然汉语表达大卫对这种福分的宣告。
- source_word: τοῦ ἀνθρώπου
  choice: 这样之人
  rationale: ἀνθρώπου为单数且具有代表性，并非仅指男性；“这样之人”保留单数指称及概括作用。
- source_word: λογίζεται
  choice: 算……为
  rationale: 保留λογίζομαι的核算、归算意象，同时是普通读者易懂的现代汉语。
- source_word: δικαιοσύνην
  choice: 义
  rationale: 在保罗此处的语境中，“义”是δικαιοσύνη的自然且具有经文传统连续性的译法；句法上与“算……为义”搭配清楚。
- source_word: χωρὶς ἔργων
  choice: 在行为以外
  rationale: 保留“与行为分开、不以行为为基础”的对照关系，避免将“行为”具体化为原文未明说的某类行为。
theological_decisions:
- issue: ἀνθρώπου的代表性单数与性别范围
  choice: 这样之人
  alternative: 这个人；那人
  rationale: 原文是阳性单数，但在此泛指任何处于这种情形的人；译文不把适用范围误限于男性，同时保持单数代表性。
- issue: λογίζεται δικαιοσύνην的关系
  choice: 算他为义
  alternative: 把义算给他；算他有义
  rationale: “算他为义”自然表达上帝的归算行动，并保留其法庭与核算色彩；不进一步规定这义的机制或性质，以免替原文消解神学张力。
- issue: χωρὶς ἔργων的神学对照
  choice: 在行为以外
  alternative: 不靠行为；没有行为
  rationale: 该译法紧贴χωρίς的分离意义，表明上帝的归算与行为不是同一根据，同时不把经文扩大解释成完全没有任何行为。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“福分”“算他为义”“行为”保留保罗论述中的关键概念及其张力；避免使用较生硬的“归算”作为正文用语。
