  naturalness: “在行为以外”虽可理解，但在现代标准汉语中略显生硬。改为“不凭行为”更自然，并在此处清楚表达χωρὶς ἔργων所排除的根据。
  terminology: 保留“福分”“义”“行为”。以“把义算给他”表达λογίζεται δικαιοσύνην，既保留核算/归算意象，也避免把该短语预先解释为对人的道德认定。
  issues:
