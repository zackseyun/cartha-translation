  text: Οὐ γὰρ διὰ νόμου ἡ ἐπαγγελία τῷ Ἀβραὰμ ἢ τῷ σπέρματι αὐτοῦ, τὸ κληρονόμον αὐτὸν ⸀εἶναι κόσμου, ἀλλὰ διὰ δικαιοσύνης πίστεως·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/013.yaml
  text: For the promise to Abraham or to his offspring that he would be heir of the world was not through the law[d][c][b][a], but through the righteousness of faith.
translation:
  language: zh_hans
  text: 亚伯拉罕要承受世界的应许，并不是借着律法赐给亚伯拉罕或他的后裔[a]的，而是借着信的义[b][c][d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “后裔”原文为单数，也可译作“种子”；这里可作集合名词，指后代。
    reason: lexical_alternative
  - marker: b
    text: “信的义”也可译作“本于信的义”或“借着信而有的义”。原文结构简练，没有明确说明“义”与“信”之间是哪一种关系。
    reason: alternative_reading
  - marker: c
    text: “义”也可译作“公义”。
    reason: lexical_alternative
  - marker: d
    text: “信”也可按语境译作“信靠”或“忠信”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαγγελία
  choice: 应许
  rationale: 这是保罗书信中表示上帝所赐承诺的常用词；“应许”自然、庄重，也保留其圣约语境。
- source_word: σπέρματι
  choice: 后裔
  rationale: 希腊文为单数形式，却可作集合名词，泛指一个或多个后代；中文“后裔”能自然表达这种集合意义。
- source_word: κληρονόμον ... κόσμου
  choice: 承受世界
  rationale: 中文以动词“承受”自然表达成为继承者的意思，同时保留 κόσμος 所指范围的广阔性，不将其缩窄。
- source_word: διὰ νόμου
  choice: 借着律法
  rationale: 介词短语表示途径或凭借；保罗此处论证中自然指向律法，尤其是摩西律法。
- source_word: δικαιοσύνης
  choice: 义
  rationale: “义”是保罗语境中 δικαιοσύνη 的规范中文对应，能够承载其称义、正直及合乎上帝标准等语义关联。
- source_word: πίστεως
  choice: 信
  rationale: 在律法与信的对比中，“信”最自然；同时不在正文中把它扩写成某一种特定的神学解释。
- source_word: διὰ δικαιοσύνης πίστεως
  choice: 借着出于信的义
  rationale: 此译保持“义”与“信”的紧密关系，并以脚注保留属格结构也可理解为“本于信的义”等可能性，避免过度限定。
theological_decisions:
- issue: δικαιοσύνης πίστεως 中“义”与“信”的关系
  choice: 出于信的义
  alternative: 本于信的义；借着信而有的义；与信相连的义
  rationale: 希腊文属格结构简练，可能表达来源、特征或紧密关联。正文采用自然且符合上下文对比的译法，脚注说明其他理解，不把这一关系限定为单一教义公式。
- issue: “承受世界”的应许与律法的关系
  choice: 并不是借着律法，而是借着出于信的义
  alternative: 不是以律法为途径，而是以信所关联的义为途径
  rationale: 保留原文明确的否定—转折结构，使律法与信之义的对照清楚，同时不补入原文未明说的时间或圣约体系解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“亚伯拉罕或他的后裔必承受世界的应许”按中文语序重组原文同位说明；“借着……而是借着……”保留保罗论证中的鲜明对照。正文避免生硬的“成为世界的继承人”，改用中文圣经语体中自然的“承受世界”。
