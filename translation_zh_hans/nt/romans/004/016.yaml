  text: Διὰ τοῦτο ἐκ πίστεως, ἵνα κατὰ χάριν, εἰς τὸ εἶναι βεβαίαν τὴν ἐπαγγελίαν παντὶ τῷ σπέρματι, οὐ τῷ ἐκ τοῦ νόμου μόνον ἀλλὰ καὶ τῷ ἐκ πίστεως Ἀβραάμ (ὅς ἐστιν πατὴρ πάντων ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/016.yaml
  text: For this reason it is by faith[a], so that it may be according to grace, in order that the promise may be certain to all the offspring—not only to those from the law, but also to those of the faith of Abraham, who is the father of us all[c][b],
translation:
  language: zh_hans
  text: 因此，这事是本于信[a]，为要照着恩典，使应许向所有后裔[b]都确实可靠——不但向那些本于律法的人，也向那些有亚伯拉罕同样信心的人[c]；亚伯拉罕是我们众人的父，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “信”也可译作“信靠”；在这里译作“信实”的可能性较低。
    reason: lexical_alternative
  - marker: b
    text: “后裔”原文直译为“种子”，这里是集合用法，指亚伯拉罕的后代。
    reason: lexical_alternative
  - marker: c
    text: 原文直译可作“那本于亚伯拉罕之信的”。这里的单数冠词结构具有集合意义，指那些有亚伯拉罕同样信心的人。
    reason: alternative_reading
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: 所以
  rationale: 保留承接上文并作出推论的语气，符合现代汉语表达。
- source_word: ἐκ πίστεως
  choice: 本于信
  rationale: 表达基础或依据，同时保留保罗将信与律法相对照的措辞；“承受产业”由上下文所省略的概念补出，使汉语句子完整。
- source_word: ἵνα κατὰ χάριν
  choice: 为要照着恩典
  rationale: 明确保留目的从句以及“按照恩典”的关系，不改写为更具解释性的神学表述。
- source_word: βεβαίαν
  choice: 确实可靠
  rationale: 既表达应许的确定性，也表达其稳固可信，符合 βέβαιος 在本句中的语义。
- source_word: ἐπαγγελίαν
  choice: 应许
  rationale: 这是保罗相关论述中的标准译法，准确且自然。
- source_word: σπέρματι
  choice: 后裔
  rationale: 该词字面为“种子”，此处是集合用法，指亚伯拉罕的后代；“后裔”庄重而清楚。
- source_word: οὐ τῷ ἐκ τοῦ νόμου μόνον
  choice: 不但对那本于律法的
  rationale: 保留希腊文单数形式及其集合意义，并与下半句形成对称。
- source_word: τῷ ἐκ πίστεως Ἀβραάμ
  choice: 对那本于亚伯拉罕之信的
  rationale: 贴近希腊文压缩的结构，不在正文中直接扩写为“与亚伯拉罕有同样信心的人”，从而保留其语法张力。
- source_word: πατὴρ πάντων ἡμῶν
  choice: 我们众人的父
  rationale: 自然、庄重地保留原文的亲属与群体性语言。
theological_decisions:
- issue: 如何处理 ἐκ πίστεως 中省略的主语或概念
  choice: 承受产业是本于信
  alternative: 这是本于信；应许是本于信
  rationale: 上文讨论承受世界和成为后嗣；补出“承受产业”使现代汉语完整，又避免把“本于信”直接说成修饰应许本身。
- issue: 如何理解 τῷ ἐκ πίστεως Ἀβραάμ
  choice: 那本于亚伯拉罕之信的
  alternative: 与亚伯拉罕有同样信心的人
  rationale: 正文保留原文可能指“属于亚伯拉罕之信的一方”的压缩表达，脚注提供较明确的理解，不把解释直接写死在正文中。
- issue: πίστις 应译为“信”“信靠”还是“信实”
  choice: 信
  alternative: 信靠；信实
  rationale: 本段以亚伯拉罕相信应许为论述核心，“信”最适合；“信靠”可表达其主动信赖的含义，而“信实”在此语境中可能性较低。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“本于”“为要”“应许”等词保持经文论证的凝练感。末尾保留逗号，以反映原文句法仍延续至下一节。
