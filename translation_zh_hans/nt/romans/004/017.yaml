revisions:
- from: 正如经上所记：“我已经立你作万国之父。”[a]——在他所信的上帝面前，也就是在那使死人得生命、又呼唤那不存在的如同存在的上帝面前。[b]
  to: 正如经上所记：“我已经立你作万国[a]之父。”——是在他所信的上帝面前；这位上帝使死人得生命，又呼唤那不存在的，如同存在的。[b]
  rationale: 修订消除了“上帝面前”的不必要重复，并将“使死人得生命、又呼唤……”明确作为对同一位上帝的描述。破折号及“是在”保留本节承接前文而略具片段性的句法，不补写上节的内容。末句仍按原文的凝练结构译为“呼唤那不存在的，如同存在的”，脚注才给出较解释性的“使……成为存在”。脚注锚点也移至所注释的具体词语和短语。
