  text: καθὼς γέγραπται ὅτι Πατέρα πολλῶν ἐθνῶν τέθεικά σε), κατέναντι οὗ ἐπίστευσεν θεοῦ τοῦ ζῳοποιοῦντος τοὺς νεκροὺς καὶ καλοῦντος τὰ μὴ ὄντα ὡς ὄντα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/017.yaml
  text: as it is written[a], "I have made you the father of many nations"—in the presence of the God in whom he believed[b], who gives life to the dead and calls the things that are not as though they were.
translation:
  language: zh_hans
  text: 正如经上所记：“我已经立你作万国[a]之父。”——是在他所信的上帝面前；这位上帝使死人得生命，又呼唤那不存在的，如同存在的。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “万国”也可译作“许多民族”或“许多族群”；这里并非专指与犹太人相对的“外邦人”。
    reason: lexical_alternative
  - marker: b
    text: 这句话也可较解释性地译作：“使那不存在的成为存在。”
    reason: alternative_reading
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: 正如经上所记
  rationale: 采用现代中文常用的经文引用格式；“所记”也体现希腊语完成时所含“已经写下且仍然有效”的意味。
- source_word: Πατέρα πολλῶν ἐθνῶν
  choice: 万国之父
  rationale: ἐθνῶν在所引《创世记》的应许中泛指许多国家、民族或族群，不宜在正文中缩窄为与犹太人相对的“外邦人”；“万国”在中文经文语体中简洁庄重。
- source_word: τέθεικά σε
  choice: 我已经立你作
  rationale: “立……作”既可表达设立，也符合应许赋予身份的语境；“已经”传达完成时及其持续效力。
- source_word: κατέναντι οὗ ἐπίστευσεν θεοῦ
  choice: 在他所信的上帝面前
  rationale: 保留κατέναντι的临在、面对之意，并自然表达亚伯拉罕对上帝的信靠。
- source_word: ζῳοποιοῦντος τοὺς νεκρούς
  choice: 使死人得生命
  rationale: 直接表达上帝赐生命给死人的能力，同时不把分词具体化为某一次复活事件。
- source_word: καλοῦντος
  choice: 呼唤
  rationale: 保留καλέω较基本的“呼唤、召唤”意义，不在正文中预先解释为“创造”或“使之存在”。
- source_word: τὰ μὴ ὄντα ὡς ὄντα
  choice: 那不存在的如同存在的
  rationale: 贴近希腊语压缩而带张力的表述，保留其可能涉及宣告、召唤或使之存在的解释空间。
theological_decisions:
- issue: 末句是否应明确译为上帝使不存在之物成为存在，即直接陈述从无创造。
  choice: 呼唤那不存在的如同存在的
  alternative: 使那不存在的成为存在
  rationale: 希腊文本本身使用“呼唤”及“如同存在的”这一凝练结构。正文保留其真实歧义，不把潜在的创造论含义直接定为唯一解释；较明确的解释置于脚注。
- issue: κατέναντι短语在本节中与上文“作我们众人的父”的句法衔接。
  choice: 以破折号保留承接上文的附加说明结构
  alternative: 补写“他在上帝面前作了我们众人的父”
  rationale: 原文第17节从上节延续而来，本节单独看近似句子片段。采用破折号既使中文层次清楚，又避免把本节未明说的成分补入正文。
translation_notes:
  register: 采用现代、庄重而可懂的经文语体。“上帝”清楚自然；引文用“立你作万国之父”保持简洁。破折号反映本节与前一节的句法连续性，避免为追求独立成句而增添原文未明说的内容。
