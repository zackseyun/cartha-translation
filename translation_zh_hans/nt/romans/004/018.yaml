  text: ὃς παρ’ ἐλπίδα ἐπ’ ἐλπίδι ἐπίστευσεν εἰς τὸ γενέσθαι αὐτὸν πατέρα πολλῶν ἐθνῶν κατὰ τὸ εἰρημένον· Οὕτως ἔσται τὸ σπέρμα σου·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/018.yaml
  text: 'who[a], against hope, believed in hope, so that he might become the father of many nations[c][b], according to what had been spoken: “So shall your offspring be.”'
translation:
  language: zh_hans
  text: 他在无望之中[a]，仍怀着盼望相信，从而得以成为许多民族之父，正如所说：“你的后裔[c]也必如此。”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“超乎盼望”或“违背盼望”。
    reason: lexical_alternative
  - marker: b
    text: 引自《创世记》15:5；另参《创世记》17:5。
    reason: cross_reference
  - marker: c
    text: “后裔”原文直译为“种子”，是单数形式，却可集合性地指众多后代。
    reason: lexical_alternative
lexical_decisions:
- source_word: παρ’ ἐλπίδα
  choice: 在无可指望的时候
  rationale: παρά加宾格在此表示与通常可有的指望相反或超出其范围。此译自然表达客观处境毫无指望，同时保留与下句“盼望”的悖论。
- source_word: ἐπ’ ἐλπίδι
  choice: 仍怀着盼望
  rationale: 该短语可表示相信时所立足的盼望或所处的盼望状态；“仍怀着盼望”在现代汉语中清楚呈现其与前句的强烈对照。
- source_word: ἐπίστευσεν
  choice: 相信了
  rationale: 直译πιστεύω的陈述性用法，并以“了”体现不定过去时所叙述的行动，不扩展为特定宗派性的信心定义。
- source_word: εἰς τὸ γενέσθαι αὐτὸν
  choice: 因而得以成为
  rationale: εἰς τό加不定式可表达目的或结果；“因而得以”保留二者之间的张力，不把关系过度限定为单纯主观目的。
- source_word: πατέρα πολλῶν ἐθνῶν
  choice: 许多民族的父
  rationale: ἔθνη在亚伯拉罕应许的语境中指诸民族，而非专指与犹太人相对的外邦人；汉语无需添加冠词。
- source_word: κατὰ τὸ εἰρημένον
  choice: 正如上帝所说
  rationale: 用自然、庄重的现代汉语表达“按照那已经说过的话”。被动式含蓄指向上帝；中文明说“上帝”可使引语关系清楚，而不改变语境中的说话者。
- source_word: Οὕτως ἔσται τὸ σπέρμα σου
  choice: 你的后裔将要这样多
  rationale: οὕτως回指创世记15:5中星辰不可胜数的情景，含有“这样多”的数量意味；“后裔”自然表达σπέρμα的集合意义，但不保留其字面单数意象。
theological_decisions:
- issue: “许多民族”的所指
  choice: 译作“许多民族”
  alternative: “许多外邦人”或“许多国”
  rationale: 这里承接亚伯拉罕之约的旧约措辞，重点是由他而来的众多民族；“外邦人”会过早引入犹太人与外邦人的对立。
- issue: εἰς τὸ γενέσθαι所表达的是目的还是结果
  choice: 译作“因而得以成为”
  alternative: “为要成为”或“结果成为”
  rationale: 原构式容许目的与结果两种侧重；所选措辞避免彻底消除这种语义张力，同时在汉语中保持通顺。
- issue: σπέρμα的单数集合意象
  choice: 正文译作“后裔”
  alternative: “种子”或“子孙”
  rationale: 本节重点是创世记15:5中繁多的后裔。“后裔”最符合现代汉语，但以脚注交代希腊词的单数集合意象，避免读者误以为原文只是普通复数。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“在无可指望的时候，仍怀着盼望”保留原文παρ’ ἐλπίδα / ἐπ’ ἐλπίδι的修辞对照；引语则用简洁、略具经文节奏的表达。所有脚注标记均置于相关正文位置。
