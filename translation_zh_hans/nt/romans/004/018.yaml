- from: 他在无可指望的时候，仍怀着盼望相信了，因而得以成为许多民族的父[a]，正如上帝所说：“你的后裔将要这样多。”[b]
  to: 他在无望之中[a]，仍怀着盼望相信，从而得以成为许多民族之父，正如所说：“你的后裔[c]也必如此。”[b]
  rationale: 修订使“无望”与“盼望”形成与希腊文相应的悖论式对照，避免把前一短语仅译作时间背景；以“正如所说”保留原文被动的含蓄性；引文按“如此”的指示语气翻译，不将其所指内容过度明说。并补足词汇替代脚注，将交叉引注和“后裔”词义注分别锚定在相应位置。
