id: ROM.4.10
reference: Romans 4:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: πῶς οὖν ἐλογίσθη; ἐν περιτομῇ ὄντι ἢ ἐν ἀκροβυστίᾳ; οὐκ ἐν περιτομῇ ἀλλ’ ἐν ἀκροβυστίᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/010.yaml
  text: How then was it counted? While he was circumcised[a], or uncircumcised? Not while circumcised, but while uncircumcised.
translation:
  language: zh_hans
  text: 那么，这是在什么情况下算给他的呢？是在他已经受割礼的时候，还是在他还未受割礼的时候？不是在他已经受割礼的时候，而是在他还未受割礼的时候。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πῶς οὖν
  choice: 那么，这是在什么情况下
  rationale: οὖν承接上文的推论，译作“那么”；πῶς在这里引出亚伯拉罕被算为义时所处的情形，译作“在什么情况下”比单说“怎样”更自然，也与后面的两个选项衔接。
- source_word: ἐλογίσθη
  choice: 算给他的
  rationale: 该词是λογίζομαι的被动形式，承接罗马书4章前文“算为义”的论述。这里保留“算”这一核心用语，并补出汉语所需的“给他的”；不擅自补入“为义”，以免增加本节希腊文本省略的内容。
- source_word: ἐν περιτομῇ ὄντι
  choice: 在他受割礼的时候
  rationale: 希腊文直指“处于割礼中”的状态；现代汉语以“受割礼的时候”自然表达这种状态及其时间含义。
- source_word: ἐν ἀκροβυστίᾳ
  choice: 在他未受割礼的时候
  rationale: ἀκροβυστία在此与“割礼”相对，表示未受割礼的状态。译作“未受割礼”清楚、自然，并保持两项之间的平行对比。
- source_word: οὐκ ... ἀλλ’
  choice: 不是……而是……
  rationale: 准确保留希腊文明确而有强调作用的否定—转折结构。
theological_decisions:
- issue: ἐλογίσθη所省略的补语
  choice: 正文译为“算给他的”，不补“为义”
  alternative: 译为“算他为义”或“算作义归给他”
  rationale: 上下文确实表明所算的是“义”，但本节原文只用被动动词而省略补语。正文保留这种承接上文的省略，避免把上下文解释直接写入本节。
- issue: ἐν περιτομῇ与ἐν ἀκροβυστίᾳ的语义重点
  choice: 按亚伯拉罕当时是否已经受割礼的情形来表达
  alternative: 名词化直译为“在割礼中／在未受割礼中”
  rationale: 保罗的论证焦点是称义的计算发生在割礼之前还是之后。自然汉语中的“在……的时候”保留这一时序对比，却不额外加入教派性解释。
translation_notes:
  register: 采用现代、庄重且通顺的书面汉语。保留三句连续问答的修辞推进，以及末句“不是……而是……”的鲜明对照。由于没有脚注，正文不设置脚注标记。
