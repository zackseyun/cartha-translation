  text: εἰς δὲ τὴν ἐπαγγελίαν τοῦ θεοῦ οὐ διεκρίθη τῇ ἀπιστίᾳ ἀλλὰ ἐνεδυναμώθη τῇ πίστει, δοὺς δόξαν τῷ θεῷ
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/020.yaml
  text: Yet regarding the promise of God[a], he did not waver in unbelief, but was strengthened in faith[b], giving glory to God.
translation:
  language: zh_hans
  text: 然而，对于上帝的应许，他并没有在不信中动摇[a]，反而在信心中得以刚强[b]，将荣耀归给上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“没有因不信而动摇。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“借着信心得以刚强。”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς δὲ τὴν ἐπαγγελίαν τοῦ θεοῦ
  choice: 然而，面对上帝的应许
  rationale: εἰς加宾格在这里表示所涉及的对象，而非移动方向；“面对”自然表达亚伯拉罕对于上帝应许的回应，δὲ则以“然而”承接上文并引出对比。
- source_word: οὐ διεκρίθη
  choice: 没有……动摇
  rationale: διακρίνω在此语境指内心摇摆、迟疑，而非单纯的理智疑问；“动摇”也与下文“得着力量”形成清楚对照。
- source_word: τῇ ἀπιστίᾳ
  choice: 因不信
  rationale: 与格可以表示原因、凭借或状态；正文采用自然的因果表达，同时以脚注保留“在不信中”的状态性理解。
- source_word: ἀλλὰ ἐνεδυναμώθη
  choice: 反而……得着力量
  rationale: ἀλλά表达强烈转折；被动式ἐνεδυναμώθη译为“得着力量”，既保留被动意味，也不超出原文指定力量来源。
- source_word: τῇ πίστει
  choice: 在信心里
  rationale: 与格可理解为领域或凭借；“在信心里”与前面的不信构成对照，并用脚注保留工具性译法。
- source_word: δοὺς δόξαν τῷ θεῷ
  choice: 把荣耀归给上帝
  rationale: 该惯用表达在现代汉语中自然地表示尊荣上帝；分词形式用连续短语承接，保留其与前述行动相伴的关系。
theological_decisions:
- issue: 亚伯拉罕的反应应理解为理智上的怀疑，还是更广泛的信仰动摇
  choice: 没有因不信而动摇
  alternative: 没有因不信而怀疑
  rationale: “动摇”较完整地体现διακρίνω在上下文中的摇摆和迟疑，也保留它与“在信心里得着力量”的修辞对照，而不把经文缩减为单纯的认知疑问。
- issue: 信心与得力之间的语法关系
  choice: 在信心里得着力量
  alternative: 借着信心得着力量
  rationale: 希腊语与格可指领域，也可指凭借；正文选择领域性表达，不明确断定信心是工具，脚注则保留另一种可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“上帝”遵循本项目用语；“面对……应许”“动摇”“得着力量”“把荣耀归给”均为当代读者自然可懂的表达。正文保留原文的转折、被动语态及与格歧义，并以脚注呈现重要替代译法。
