  text: τῷ δὲ μὴ ἐργαζομένῳ, πιστεύοντι δὲ ἐπὶ τὸν δικαιοῦντα τὸν ἀσεβῆ, λογίζεται ἡ πίστις αὐτοῦ εἰς δικαιοσύνην,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/005.yaml
  text: But to the one not working[a], but believing in the one who justifies the ungodly[d][c][b], his faith is counted as righteousness.
translation:
  language: zh_hans
  text: 但对于那不做工[a]、却信靠[b]那位称不敬虔者为义[c]的人，他的信心被算为[d]义[e]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“不凭行为”。直译为“不做工”，承接上一节做工与工价的比喻。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“相信”。“信靠”突出了此处介词结构所含的倚靠意味。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“宣告……为义”。
    reason: lexical_alternative
  - marker: d
    text: 也可译作“记为”或“归算为”。
    reason: lexical_alternative
  - marker: e
    text: “义”在保罗书信的某些语境中也可译作“公义”或“正义”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τῷ ... μὴ ἐργαζομένῳ
  choice: 对那不做工的人来说
  rationale: 保留实体化分词和与上一节“做工—工价”比喻的联系；用与格框架“对……来说”自然引出后面的“他的信心就被算作义”。
- source_word: πιστεύοντι δὲ ἐπὶ
  choice: 却信靠
  rationale: “信靠”既保留 πιστεύω 的“信”字词族，也表达 ἐπί 在此所含的倚靠意味；“却”清楚呈现与“不做工”的对照。
- source_word: τὸν δικαιοῦντα
  choice: 那位称……为义
  rationale: “称……为义”是现代中文中简洁且可理解的 δικαιόω 译法，并与本句末尾 δικαιοσύνη 的“义”保持词义联系，同时不预先判定称义的具体机制。
- source_word: τὸν ἀσεβῆ
  choice: 不敬虔者
  rationale: 准确表达 ἀσεβής 对上帝缺乏敬虔的含义；比“恶人”更少偏向一般道德邪恶，也保留单数类称的概括性。
- source_word: λογίζεται
  choice: 被算作
  rationale: “算作”清楚表达 λογίζομαι 在本段的计算、记账和归算意象，并符合自然现代汉语。
- source_word: ἡ πίστις αὐτοῦ
  choice: 他的信心
  rationale: 上下文以“信靠”与“做工”对照，因此 πίστις 在此主要指信，而不是“忠信”；“信心”是自然且通行的中文表达。
- source_word: εἰς δικαιοσύνην
  choice: 算作义
  rationale: 在 λογίζομαι ... εἰς 的结构中，“算作……”自然表达所认定的结果，同时保留原文简洁而具有神学张力的说法。
theological_decisions:
- issue: δικαιόω 在保罗论述中的译法
  choice: 称……为义
  alternative: 宣告……为义；使……成为义人
  rationale: 主文采用“称……为义”，保留司法性宣告与更广义“使之处于义的地位”之间的张力，不把经文限定于某一宗派的称义理论。
- issue: πίστις／πιστεύω 的译法
  choice: 信心／信靠
  alternative: 信／相信；忠信
  rationale: 本节明确把 πιστεύειν 与做工相对照，支持译为“信靠”和“信心”；“忠信”在这里可能使读者误以为重点是人的忠诚表现，因此不用于主文。
- issue: λογίζεται εἰς δικαιοσύνην 的关系
  choice: 被算作义
  alternative: 被归算为义；被记为义
  rationale: 原文陈述信心被算为义，却没有在本句内解释这种计算的全部性质；译文维持该表述，不增添功劳、内在转变或纯外在归算等体系性结论。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“不做工”保留本段的工价比喻，并以脚注防止被误解为一般就业问题；“不敬虔者”简洁正式；“称……为义／义”保留 δικαιόω 与 δικαιοσύνη 的词义呼应。
