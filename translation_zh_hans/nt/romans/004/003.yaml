  text: τί γὰρ ἡ γραφὴ λέγει; Ἐπίστευσεν δὲ Ἀβραὰμ τῷ θεῷ καὶ ἐλογίσθη αὐτῷ εἰς δικαιοσύνην.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/003.yaml
  text: For what does the Scripture say? Abraham believed God[b][a], and it was counted to him as righteousness.
translation:
  language: zh_hans
  text: 因为经上怎么说呢？“亚伯拉罕信了上帝，这就算为他的义。”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “算为他的义”也可译作“归算给他，作为义”或“认定为他的义”。
    reason: lexical_alternative
  - marker: b
    text: “义”也可译作“正义”。
    reason: lexical_alternative
lexical_decisions:
- source_word: γραφή
  choice: 经上
  rationale: 定冠词单数的 γραφή 在保罗这里指神圣经文；“经上怎么说”是现代汉语中自然且庄重的引经表达。
- source_word: Ἐπίστευσεν
  choice: 信了
  rationale: 直接保留 πιστεύω 简明的陈述，不扩展为“信靠”而增加原文未明说的解释。
- source_word: τῷ θεῷ
  choice: 上帝
  rationale: πιστεύω 后接与格，语境侧重亚伯拉罕相信上帝所说的话；汉语“信了上帝”可保留这一结构，而不改成偏向一般宗教信仰表述的“信仰上帝”。
- source_word: ἐλογίσθη
  choice: 算为
  rationale: 保留被动意义及 λογίζομαι 的认定、归算语义；“算为”在现代汉语中简洁，也与本段论证相称。
- source_word: εἰς δικαιοσύνην
  choice: 为他的义
  rationale: “算为他的义”自然表达 εἰς 的结果或认定关系；“义”保留 δικαιοσύνη 在保罗语境中的广度，避免预先限定为道德品格、司法宣告或社会公正。
theological_decisions:
- issue: 保罗称义语境中 δικαιοσύνη 的译法
  choice: 义
  alternative: 公义；正义
  rationale: “义”是简洁而宽广的圣经用语，可承载关系性、行为性与宣告性的张力；正文不把该词缩限为“正义”。
- issue: ἐλογίσθη αὐτῷ 的所指与表达
  choice: 这就算为他的义
  alternative: 他就被算为义；这就归算给他，作为义
  rationale: 中性单数动词的隐含主语可理解为亚伯拉罕的相信或整件事；用“这”保留其指代弹性，也避免译成“他被算为义”而改变句法重点。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“经上怎么说呢”保留反问推进；引文使用“上帝”与全项目现代标准普通话风格一致。脚注标记置于整段引文之后。
