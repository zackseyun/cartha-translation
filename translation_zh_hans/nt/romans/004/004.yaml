  text: τῷ δὲ ἐργαζομένῳ ὁ μισθὸς οὐ λογίζεται κατὰ χάριν ἀλλὰ κατὰ ὀφείλημα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/004.yaml
  text: To the one who works[a], the wages are not credited as a gift[b], but as an obligation.
translation:
  language: zh_hans
  text: 做工的人，他的工钱不是按恩典[a]算的，而是按所欠的[b]算的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不是按着恩典来计算。”这里“恩典”指白白施予的恩惠。
    reason: lexical_alternative
  - marker: b
    text: 或译：“而是按债来计算”或“按应付的来计算”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐργαζομένῳ
  choice: 做工的人
  rationale: 带冠词的现在分词作名词用，泛指以做工为特征的人；“做工的人”自然且保留一般性。
- source_word: μισθὸς
  choice: 工钱
  rationale: 在劳动与支付的语境中，指因工作所得的报酬；“工钱”比宽泛的“奖赏”更准确。
- source_word: λογίζεται
  choice: 算是
  rationale: λογίζομαι带有核算、记账的意味；汉语“算是”既自然，也能承接“恩典”与“所欠的”之间的归类对比。
- source_word: κατὰ χάριν
  choice: 恩典
  rationale: κατά在这里表示衡量或归类的准则；直译为“按着恩典”略显生硬，“算是恩典”保留χάρις的神学词汇及非赚取性质。
- source_word: ὀφείλημα
  choice: 所欠的
  rationale: 该词指应当偿付的欠项；“所欠的”清楚表达工钱是应付之物，也比抽象的“义务”更符合此处财务比喻。
- source_word: δὲ
  choice: 而（体现在句内对比）
  rationale: δὲ在上下文中承接并推进论证，汉语无需在句首另加“如今”；其对比功能由“不……而……”自然表达。
theological_decisions:
- issue: 劳动报酬语境中χάρις的译法
  choice: 正文译作“恩典”
  alternative: 礼物；白白的恩惠
  rationale: 原文以χάρις与ὀφείλημα相对，强调非赚取的恩惠与应付欠项之别。“恩典”保留保罗用词的神学张力，脚注说明也可理解为“白白的恩惠”，不把经文本身的词义限定为实物性的礼物。
- issue: ὀφείλημα的债务意象
  choice: 译作“所欠的”
  alternative: 债；应尽的义务
  rationale: “所欠的”保留雇主因工作而欠付报酬的意象，同时避免“义务”可能被误解为工人的责任。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“工钱”“所欠的”保持劳动报酬的具体语境；正文保留“恩典”这一关键词，并以脚注说明其在此处白白施予的含义。所有脚注标记均置于正文相应词语之后。
