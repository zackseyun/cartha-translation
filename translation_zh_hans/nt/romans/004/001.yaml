  text: Τί οὖν ἐροῦμεν ⸀εὑρηκέναι Ἀβραὰμ τὸν ⸀προπάτορα ⸀ἡμῶν κατὰ σάρκα;
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/001.yaml
  text: What then shall we say that Abraham[a], our forefather according to the flesh[c][b], has found?
translation:
  language: zh_hans
  text: 那么，我们该说，亚伯拉罕——按肉身说是我们的先祖[a]——得到了什么呢？[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可较通顺地译作“我们血缘上的祖先”。
    reason: lexical_alternative
  - marker: b
    text: “按肉身说”也可能修饰“得到了”，全句可译作：“那么，我们该说，我们的先祖亚伯拉罕凭肉身得到了什么呢？”即问他凭人的方式或从人的层面得到了什么。
    reason: alternative_reading
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: 那么，我们该说……什么呢？
  rationale: 保留οὖν承接上文的推论语气，以及ἐροῦμεν在修辞问句中的商议意味；拆分到问句首尾，使现代汉语自然流畅。
- source_word: εὑρηκέναι
  choice: 得到了
  rationale: 反映εὑρίσκω完成时不定式所表达的既成结果；在这里“得到”比“发现”更能容纳保罗随后讨论所得结果或益处的语境，同时不预先限定其内容。
- source_word: προπάτορα
  choice: 先祖
  rationale: 准确表达男性单数祖先及亚伯拉罕的宗祖身份；“祖先”也可行，但“先祖”较庄重凝练。
- source_word: ἡμῶν
  choice: 我们的
  rationale: 明确保留第一人称复数，呈现保罗在论证中所表达的共同祖源关系。
- source_word: κατὰ σάρκα
  choice: 按肉身说
  rationale: 保留保罗用σάρξ表达血缘、身体层面关系的措辞，而不误译为“罪性”；“按肉身说”既贴近原文，也能为另一种句法理解保留线索。
theological_decisions:
- issue: κατὰ σάρκα的修饰范围
  choice: 主文将其理解为限定亚伯拉罕与“我们”的关系，即他按肉身说是我们的先祖。
  alternative: 也可理解为修饰“得到了”，意为亚伯拉罕凭人的方式、在肉身层面得到了什么。
  rationale: 从“亚伯拉罕—我们的先祖”这一同位结构来看，限定祖源关系较为顺畅，也契合《罗马书》关于犹太身份和血缘的论述；但希腊语词序确实容许另一种连接方式，因此以脚注保留。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。破折号标明“按肉身说是我们的先祖”是对亚伯拉罕的同位说明，避免主文误接到“得到了”；脚注则明确保存原文真实存在的句法歧义。
