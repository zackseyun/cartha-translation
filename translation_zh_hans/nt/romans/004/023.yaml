lexical_decisions:
- source_word: ἐγράφη
  choice: 写的
  rationale: 采用自然的被动结构“为……写的”，保留经文被写下、记载的含义。
- source_word: δὲ
  choice: 不单独译出
  rationale: δέ在此主要承接并推进论述；本节紧接上文时，现代汉语无需另加“现在”或“但是”，即可自然表达。
- source_word: δι’ αὐτὸν μόνον
  choice: 单为他
  rationale: 表达“只以他为对象、只为了他”的意思，并保留μόνον的排他强调。
- source_word: ὅτι
  choice: 以引号标示所写内容
  rationale: ὅτι引出被写下的内容；汉语用直接引语比机械译成“即”或“说”更自然。
- source_word: ἐλογίσθη
  choice: 算在……账上
  rationale: 保留λογίζομαι的计算、记账意象，也符合本段称义语境，同时不额外限定其神学机制。
- source_word: αὐτῷ
  choice: 他账上
  rationale: 在汉语记账表达中，以“算在他账上”自然体现间接受事者。
theological_decisions:
- issue: 保罗称义论语境中λογίζομαι的译法
  choice: 算在他账上
  alternative: 算给他；归给他
  rationale: “算在……账上”保留会计性隐喻及归算意味，又不把经文本身未明说的教义细节加入译文。
- issue: ὅτι所引内容的范围
  choice: 将“这话算在他账上”作为所写内容
  alternative: 译作“他被算为……”
  rationale: 沿用上文引句的表达并保留被动意义；“这话”使独立节选仍可读，同时指向上文所说被算在账上的内容。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“单为他写的”简洁保留原文焦点；以引号清楚标出ὅτι引入的书面内容。
