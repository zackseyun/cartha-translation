  text: εἰ γὰρ οἱ ἐκ νόμου κληρονόμοι, κεκένωται ἡ πίστις καὶ κατήργηται ἡ ἐπαγγελία·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/014.yaml
  text: For if those who are of the law are heirs[c][b][a], faith has been emptied and the promise has been nullified.
translation:
  language: zh_hans
  text: 因为，若属于律法的人是继承人，信就落空了，应许也失去了效力。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “属于律法的人”或译“靠律法的人”。
    reason: lexical_alternative
  - marker: b
    text: “失去了效力”或译“被废去”或“成为无效”。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἐκ νόμου
  choice: 属于律法的人
  rationale: 保留保罗以人与律法之关系来界定群体的紧凑表达，不把它过度解释为单指“遵行律法的人”。
- source_word: κληρονόμοι
  choice: 承受产业的人
  rationale: 符合本段关于应许与产业承受的语境，也比单用较书面的“继承人”更自然。
- source_word: κεκένωται
  choice: 落了空
  rationale: 以自然中文传达“被倒空、成为空无”的隐喻及完成时所表达的既成结果。
- source_word: πίστις
  choice: 信
  rationale: 在罗马书4章律法与信的对照中，“信”简洁而准确，并避免加入原文没有明说的宾语。
- source_word: κατήργηται
  choice: 失去了效力
  rationale: 表达被置于无效状态，而不夸大为彻底消灭；也保留完成时的结果状态。
- source_word: ἡ ἐπαγγελία
  choice: 应许
  rationale: 自然、准确地指向上下文正在讨论的特定应许；中文无须另加定冠词。
theological_decisions:
- issue: πίστις在律法与信的保罗式对照中的译法
  choice: 信
  alternative: 信实；信靠
  rationale: 上下文所论的是承受产业凭律法还是凭信，因此“信”最能保持论证结构，同时不限定为人的信实或增补信靠的对象。
- issue: οἱ ἐκ νόμου所指群体的界定
  choice: 属于律法的人
  alternative: 靠律法的人；遵行律法的人
  rationale: 原文ἐκ νόμου具有凝练且可有多重关系色彩的表达；主文不把它收窄为靠行为得产业或实际遵守律法的人。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“因为，如果”保留γάρ与条件句的论证衔接；“才是”自然呈现条件命题所隐含的排他重点。“落了空”与“失去了效力”形成清楚但不过度整齐化的并列。
