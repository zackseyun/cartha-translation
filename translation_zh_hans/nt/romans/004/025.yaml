  text: ὃς παρεδόθη διὰ τὰ παραπτώματα ἡμῶν καὶ ἠγέρθη διὰ τὴν δικαίωσιν ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/025.yaml
  text: who was handed over because of our trespasses and was raised for our justification[a][b].
translation:
  language: zh_hans
  text: 他因我们的过犯被交付，又为了使我们称义而被复活[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因我们得称义而被复活。”
    reason: alternative_reading
  - marker: b
    text: “称义”也可表达为“被判无罪”或“被宣告为义”。
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεδόθη
  choice: 被交出去
  rationale: 保留希腊文的被动语态及其可能暗含的神圣被动意味；“交出去”在现代汉语中自然清楚，也不擅自补出交给谁。
- source_word: διὰ τὰ παραπτώματα ἡμῶν
  choice: 因我们的过犯
  rationale: διά加宾格在此最自然地表达原因；“因”简洁地呈现“由于”的关系。
- source_word: παραπτώματα
  choice: 过犯
  rationale: “过犯”准确表达越界、犯错的道德含义，又避免笼统地归并为“罪”。
- source_word: ἠγέρθη
  choice: 复活了
  rationale: 在谈论耶稣时，“复活”是现代汉语对被动形式“被使起来”的自然对应；不必生硬译作“被举起来”，同时其施动者未明说的特点仍由语境保留。
- source_word: διὰ τὴν δικαίωσιν ἡμῶν
  choice: 为使我们称义
  rationale: 正文采用目的或结果方向的理解，以自然汉语表明他的复活与我们得称为义相关；διά加宾格也可能表示原因，该可能性收入脚注。
- source_word: δικαίωσιν
  choice: 称义
  rationale: “称义”是简明而准确的保罗书信法律—救恩语汇，表达被判定或宣告为义；脚注提供更直白的说法。
theological_decisions:
- issue: διὰ τὴν δικαίωσιν ἡμῶν表示目的/结果，还是表示原因
  choice: 为使我们称义
  alternative: 因我们得称为义
  rationale: 正文保留常见且符合上下文的前瞻性理解，即复活与信徒得称为义的实现相关；不过，希腊文也容许因果性理解，因此在脚注中保留，不把语法上的张力消除。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“过犯”“称义”保留经文的道德和司法色彩；整体句式紧凑，并维持原文两个并列被动事件之间的对应关系。
