id: ROM.4.21
reference: Romans 4:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ πληροφορηθεὶς ὅτι ὃ ἐπήγγελται δυνατός ἐστιν καὶ ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/021.yaml
  text: and being fully convinced that what he had promised[c][b][a], he was also able to do.
translation:
  language: zh_hans
  text: 并且满心确信：他所应许的，他也有能力成就。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “满心确信”也可译作“完全相信”或“深信不疑”。
    reason: lexical_alternative
  - marker: b
    text: 这里的“他”按上下文指神。
    reason: cross_reference
lexical_decisions:
- source_word: πληροφορηθεὶς
  choice: 满心确信
  rationale: 该分词表达充分、完全的确信；“满心确信”自然庄重，也保留了希腊文的强度。
- source_word: ὅτι
  choice: （以冒号引出确信的内容）
  rationale: 汉语用冒号自然引出亚伯拉罕所确信的内容，无须机械译出“即”。
- source_word: ὃ
  choice: 所……的
  rationale: 以“他所应许的”自然表达关系代词所指的内容。
- source_word: ἐπήγγελται
  choice: 所应许的
  rationale: 希腊文完成时表示应许已经作出且仍然有效；汉语“所应许的”在语境中自然涵盖这一点。
- source_word: δυνατός ἐστιν
  choice: 有能力
  rationale: 保留希腊文现在时所表达的持续能力，不按过去叙事语境改成“当时能够”。
- source_word: καὶ
  choice: 也
  rationale: 表明作出应许的那一位也有能力将其实现。
- source_word: ποιῆσαι
  choice: 成就
  rationale: 这里指把所应许的事付诸实现；“成就”比字面的“做”更符合现代汉语，同时没有增添具体内容。
theological_decisions:
- issue: 应许与能力的隐含主语
  choice: 正文保留“他”，不直接补出“神”
  alternative: 译作“神所应许的，神也有能力成就”
  rationale: 上下文清楚表明所指是神，但本节希腊文本身的主语隐含；保留代词更贴近原文，并以脚注说明。
- issue: 神能力的时态表达
  choice: 译为现在性的“有能力”
  alternative: 按过去叙事译为“当时也能”
  rationale: 希腊文使用现在时 ἐστιν，强调神持续具有成就应许的能力；汉语无需为叙事时序改变这一表达。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“满心确信”传达完全确定的语气；以“成就”表达实现应许。保留原文的代词和现在性能力表述，避免在正文中补足原文隐含的信息。
