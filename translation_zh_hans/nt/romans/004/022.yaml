  yaml_path: translation/nt/romans/004/022.yaml
  text: Therefore it was counted to him as righteousness[a][b].
translation:
  language: zh_hans
  text: 因此，这就被算为他的义[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被算为”也可译作“被归算为”或“被认定为”。
    reason: 保留λογίζομαι的记账／认定语义及其被动形式。
  - marker: b
    text: “义”也可译作“公义”或“正义”。
    reason: 保留δικαιοσύνη的词义范围；正文在保罗此处的语境中采用“义”。
lexical_decisions:
- source_word: διό
  choice: 所以
  rationale: 承接上文并引出推论；“所以”在现代汉语中自然清楚。
- source_word: ἐλογίσθη
  choice: 算为
  rationale: 保留被动意义及本段反复出现的记账、认定意象，同时符合汉语表达习惯。
- source_word: αὐτῷ
  choice: 他的
  rationale: 在“算为……的义”这一汉语结构中自然表达与亚伯拉罕的关系；所指承接上文。
- source_word: εἰς
  choice: 为
  rationale: 在“算为……义”的固定结构中表达被认定的身份或结果，不额外解释其机制。
- source_word: δικαιοσύνην
  choice: 义
  rationale: “义”是保罗语境中 δικαιοσύνη 的简明、传统且仍可理解的对应词，也与本章核心用语保持一致。
theological_decisions:
- issue: 如何表达保罗的记账或认定语言而不加入额外教义解释
  choice: 这就算为他的义
  alternative: 这就归算为他的义；这就被认定为他的义
  rationale: 保留原文的被动认定及记账意象，却不明说原文未交代的施行方式或系统神学含义。
- issue: δικαιοσύνην 的语义范围
  choice: 义
  alternative: 公义；正义
  rationale: 本处主要涉及人在神面前被算为义的语境，“义”最贴切；同时以脚注保留“公义”的可能表达，避免把词义范围绝对化。
translation_notes:
  register: 采用现代、简洁而庄重的普通话。“这”补明原文隐含的主语，指上文所说亚伯拉罕的信；不在正文中直接补出“信”，以免超过本节希腊文本的明说内容。
