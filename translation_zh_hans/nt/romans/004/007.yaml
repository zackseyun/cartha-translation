  text: Μακάριοι ὧν ἀφέθησαν αἱ ἀνομίαι καὶ ὧν ἐπεκαλύφθησαν αἱ ἁμαρτίαι,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/007.yaml
  text: Blessed are those whose lawless deeds have been forgiven[a], and whose sins have been covered.
translation:
  language: zh_hans
  text: 那些过犯蒙赦免[a]、罪恶被遮盖的人有福了！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “过犯”也可译作“违法的行为”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μακάριοι
  choice: 有福了
  rationale: 采用现代中文圣经语体中自然且庄重的宣告式表达，保留由上帝赐福、被判定为有福的含义，不缩减为主观的“快乐”。
- source_word: ἀφέθησαν
  choice: 蒙赦免
  rationale: 准确表达被动语态以及罪责得到免除的意思；“蒙”使被动关系在中文中清楚自然，也符合诗歌引文的凝练语体。
- source_word: ἀνομίαι
  choice: 过犯
  rationale: 表达违背规范或律法的行为，并与后面的“罪恶”保持词义区别；相比“违法行为”，“过犯”在此更自然庄重，也不易被误解为仅指世俗法律犯罪。
- source_word: ἐπεκαλύφθησαν
  choice: 被遮盖
  rationale: 保留诗篇引文中的“遮盖”隐喻，不将其解释性改写为“被除去”或“蒙赦免”。
- source_word: ἁμαρτίαι
  choice: 罪恶
  rationale: 在复数语境中概括人的诸般罪，同时与ἀνομίαι所译“过犯”形成相关而不完全相同的诗意平行。
theological_decisions:
- issue: “过犯”与“罪恶”的关系
  choice: 分别译出两个相关但不同的词
  alternative: 两者都译为“罪”或“罪恶”
  rationale: 原文在诗意平行中使用ἀνομίαι与ἁμαρτίαι两个不同词语；译文保留差异，但不人为建立超出本节的严格神学分类。
- issue: “遮盖”的神学含义
  choice: 保留“被遮盖”的原有隐喻
  alternative: 解释为“被赦免”或“被除去”
  rationale: 原文以赦免和遮盖构成平行表达。保留隐喻既忠于引文，也避免替文本预先解决两者关系。
translation_notes:
  register: 采用现代、庄重而易懂的宣告式中文。“有福了”置于句末，使长定语结构更符合自然汉语；使用感叹号体现祝福宣告的力度。
