revisions:
- from: 他在信心上并没有软弱；他想到自己的身体已经如同死了——那时他将近一百岁——也想到撒拉的子宫已经死寂[b]。[a]
  to: 他的信心没有软弱；他想到自己的身体已经如同死了——那时他将近一百岁——也想到撒拉的子宫已经失去生机[b]。[a]
  rationale: 修订仅改善汉语表达及脚注替代语的精确度，未改变指定底本的句法：亚伯拉罕在信心中没有软弱，却正视自己及撒拉在生育上近乎死亡的状态。正文仍以“如同死了／失去生机”保留 νενεκρωμένον 与 νέκρωσιν 的对应死亡意象；异文脚注及其锚点均予保留。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T03:51:01Z'
review_pass:
  verdict: revise
  source_fidelity: 译文基本忠实于指定的 SBLGNT 正文：保留了亚伯拉罕在信心中不软弱、正视自己身体及撒拉子宫生育无望的事实，并以脚注保留了 κατενόησεν 前否定词的异文。惟“死寂”通常形容环境的寂静，用于“子宫”不合现代汉语搭配，且“已经死寂”略显语义不清。
  naturalness: “在信心上并没有软弱”带有较明显的直译痕迹；“他的信心没有软弱”更自然、庄重。将撒拉子宫的状态译为“失去生机”可保留原文与前句相呼应的死亡意象，同时避免“死寂”的搭配问题。
  terminology: “信心”“撒拉”“子宫”均可接受。“如同死了”恰当地避免将亚伯拉罕理解为肉身已经死亡。为保留 νέκρωσις 的死亡隐喻，宜用“失去生机”，而非仅作“不能生育”。
  issues:
