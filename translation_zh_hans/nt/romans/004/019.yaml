    rationale: “死寂”主要描述声音、环境或气氛的全然寂静；用于器官状态语义不稳定，容易造成不必要的理解障碍。
  - severity: low
    issue: “在信心上并没有软弱”略显直译。
    rationale: 希腊文的与格可在汉语中自然表达为“信心没有软弱”，不必使用“在……上”的范围式结构。
