    rationale: 脚注应作为“死寂／失去生机”的解释性替代，同时避免弱化原文在正文中刻意维持的死亡意象。
  revised_text: 他的信心没有软弱；他想到自己的身体已经如同死了——那时他将近一百岁——也想到撒拉的子宫已经失去生机[b]。[a]
