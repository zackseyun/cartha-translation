  text: καὶ μὴ ἀσθενήσας τῇ ⸀πίστει κατενόησεν τὸ ἑαυτοῦ ⸀σῶμα νενεκρωμένον, ἑκατονταετής που ὑπάρχων, καὶ τὴν νέκρωσιν τῆς μήτρας Σάρρας,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/019.yaml
  text: And without weakening in faith[b][a], he considered his own body as good as dead—since he was about a hundred years old—and the deadness of Sarah’s womb.
translation:
  language: zh_hans
  text: 他的信心没有软弱；他想到自己的身体已经如同死了——那时他将近一百岁——也想到撒拉的子宫已经失去生机[b]。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 另一种文本传统作：“他没有想到自己的身体已经如同死了。”
    reason: textual_variant
  - marker: b
    text: “失去生机”也可译作“不孕”或“生育能力丧失”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσθενήσας
  choice: 软弱
  rationale: 以“并没有软弱”表达否定式不定过去分词，保留信心未失去力量的动态含义，同时符合现代汉语表达。
- source_word: πίστει
  choice: 在信心上
  rationale: 此处指亚伯拉罕对上帝应许的信靠；“在信心上”自然表达范围关系，不将其改释为泛指的忠诚。
- source_word: κατενόησεν
  choice: 想到
  rationale: 该动词表示留意并认真考虑事实；“想到”简明自然，也不暗示他因看见现实困难就产生不信。
- source_word: νενεκρωμένον
  choice: 已经如同死了
  rationale: 完成时分词表示身体在生育能力方面已处于近乎死亡的状态，并非亚伯拉罕肉身实际死亡；“如同死了”保留死亡意象而避免误解。
- source_word: ἑκατονταετής που ὑπάρχων
  choice: 那时他将近一百岁
  rationale: “将近”传达 πού 对数字的约略语气，并以插入说明自然交代其身体如同死了的缘由。
- source_word: νέκρωσιν
  choice: 死寂
  rationale: 保留与前句相呼应的死亡意象，同时用于子宫时在现代汉语中比生硬的“死亡状态”更自然；脚注列出较解释性的“不能生育”。
- source_word: μήτρας Σάρρας
  choice: 撒拉的子宫
  rationale: 直接保留具体的身体意象，准确表达属格结构。
theological_decisions:
- issue: 是否把亚伯拉罕身体和撒拉子宫的死亡意象淡化为“不育”
  choice: 正文保留“如同死了”和“死寂”的死亡意象
  alternative: 将两处解释为年老、不能生育或不孕
  rationale: 保罗有意使用相关的死亡词汇，突出人的生育能力已无指望与上帝应许之间的张力；译文不应把这一张力消解为单纯的医学描述。
- issue: κατενόησεν 前是否有否定词的文本异文
  choice: 按所给 SBLGNT 正文译为“他想到自己的身体”
  alternative: 依另一文本传统译为“他没有想到自己的身体已经如同死了”
  rationale: 否定词的有无显著改变句法和论证细节，正文遵循指定底本，同时以脚注如实保留异文。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“将近一百岁”比“约一百岁”更贴合叙事语感；“死寂”保留原文强烈的死亡比喻。脚注标记均置于正文：词义脚注 [b] 紧随相关词语，异文脚注 [a] 置于全句之后。
