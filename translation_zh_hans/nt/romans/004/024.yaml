  text: ἀλλὰ καὶ δι’ ἡμᾶς οἷς μέλλει λογίζεσθαι, τοῖς πιστεύουσιν ἐπὶ τὸν ἐγείραντα Ἰησοῦν τὸν κύριον ἡμῶν ἐκ νεκρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/024.yaml
  text: but also for us[a], to whom it will be credited—to us who believe in the one who raised Jesus our Lord from the dead[b],
translation:
  language: zh_hans
  text: 也是为我们写的：这将归算给我们，就是那些信靠使我们的主耶稣从死人中复活的那一位的人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ καὶ
  choice: 也是
  rationale: 承接上一节的否定—转折结构，并表达从亚伯拉罕扩展到“我们”的附加意义；汉语中用“也是”比直译“但也”更自然。
- source_word: δι’ ἡμᾶς
  choice: 为我们
  rationale: διά加宾格在这里表示以我们为对象或着眼于我们；结合上一节“写下来”，译作“为我们写的”。
- source_word: οἷς μέλλει λογίζεσθαι
  choice: 这也将算给我们
  rationale: 保留μέλλω的将来指向，也保留λογίζομαι的记账、归算意象。“这”对应希腊文省略而由上文补足的内容，不直接增添“义”，以保存原文的省略。
- source_word: τοῖς πιστεύουσιν ἐπὶ
  choice: 信靠……的人
  rationale: πιστεύω与ἐπί加宾格表示把信心或倚靠指向某一对象；“信靠”自然地兼顾相信与倚赖。
- source_word: τὸν ἐγείραντα
  choice: 那使……复活者
  rationale: 保留实词化分词以行动指称上帝的表达方式，不在正文中补出原文未明说的“上帝”。
- source_word: Ἰησοῦν τὸν κύριον ἡμῶν
  choice: 我们的主耶稣
  rationale: 按现代汉语的自然语序表达κύριος及所属关系，并保留“主”这一称号。
- source_word: ἐκ νεκρῶν
  choice: 从死人中复活
  rationale: 准确表达从死者群体中起来的复活用语，也是现代汉语可理解的圣经表达。
theological_decisions:
- issue: 是否明说λογίζεσθαι所省略的受词是“义”
  choice: 用“这”承接上文，不在本节明说“义”
  alternative: 译作“义也将算给我们”
  rationale: 上下文确实以“义”为所指，但本节希腊文省略了受词；用“这”既使汉语完整，又保留原文的省略和上下文依赖。
- issue: 是否在“使耶稣复活者”处补出“上帝”
  choice: 译作“那使……复活者”
  alternative: 译作“使……复活的上帝”
  rationale: 所指在神学与上下文中是上帝，但原文以实词化分词称呼他；不补名称可更贴近原句的修辞形式。
- issue: δι’ ἡμᾶς是否补出上一节的“写”
  choice: 译作“也是为我们写的”
  alternative: 仅译“也是为我们”
  rationale: 本句承接上一节的“写下来”；现代汉语若完全保留省略会显得残缺，因此补出已由紧邻上文明确提供的谓语，同时不增添新的意义。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。分号显示本节前半承接上一节“写下来”，后半转入所应许的归算；“就是”说明“我们”是哪些人。避免直接补入“义”或“上帝”，以保存希腊文的省略与称谓方式。
