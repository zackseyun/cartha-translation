  rationale: 修订删除后半句无原文依据的第二个“也”，将“算给”调整为更能体现λογίζομαι账目／归算意象的“归算给”，并以“使……复活的那一位”替代可能歧义的“复活者”。“这”仍保留原文对归算内容的省略，且未将“义”补入正文；“那一位”也保留原文不直称上帝的表达。
