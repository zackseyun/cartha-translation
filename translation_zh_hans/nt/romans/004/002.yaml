  text: εἰ γὰρ Ἀβραὰμ ἐξ ἔργων ἐδικαιώθη, ἔχει καύχημα· ἀλλ’ οὐ ⸀πρὸς θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/002.yaml
  text: For if Abraham was justified by works[b][a], he has a boast—but not before God.
translation:
  language: zh_hans
  text: 因为亚伯拉罕若因行为得以称义[a]，他就有可夸之处[b]；但在上帝面前却没有。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“被宣告为义”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“有夸口的根据”。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ γὰρ
  choice: 因为……若是
  rationale: 既保留γάρ承接上文的论证作用，也以“若是”直接表达εἰ所引出的条件，不预先判定条件是否成立。
- source_word: Ἀβραὰμ
  choice: 亚伯拉罕
  rationale: 采用现代中文圣经及一般读者熟悉的标准译名。
- source_word: ἐξ ἔργων
  choice: 因行为
  rationale: ἐκ在此表示依据或根由；“因行为”简洁自然，并保留行为作为称义依据的含义。
- source_word: ἐδικαιώθη
  choice: 被称为义
  rationale: 以被动形式保留神学语境中的法庭性和宣告意味，同时不额外明说施事者；“得以称义”列为脚注中的可选译法。
- source_word: ἔχει καύχημα
  choice: 有可夸之处
  rationale: 自然表达καύχημα可指夸口的根据或对象，且保留原文紧凑的名词性表达。
- source_word: ἀλλ’ οὐ πρὸς θεόν
  choice: 但在上帝面前并没有
  rationale: “在上帝面前”自然表达πρὸς θεόν在本语境中的关系和评断层面；补出“并没有”承接前面的“有可夸之处”，避免中文残句，同时不改变对比。
theological_decisions:
- issue: 条件句所述是实际情况还是假设情况
  choice: 直译为“亚伯拉罕若是因行为被称为义”
  alternative: “亚伯拉罕若真是因行为被称为义”或“亚伯拉罕若曾因行为被称为义”
  rationale: 原文只明确提出条件，并未用措辞直接标明其为事实或反事实；译文不把保罗后续论证的结论预先加入本节。
- issue: “称义”的含义侧重
  choice: 正文采用“被称为义”
  alternative: “得以称义”或“被判为义”
  rationale: “被称为义”较清楚地保留δικαιόω可能具有的宣告意味，又避免把该词限定为单一、已解决的系统神学定义。
- issue: 夸口与上帝之间的对比
  choice: 译作“有可夸之处，但在上帝面前并没有”
  alternative: “可以夸口，却不能向上帝夸口”
  rationale: 原文πρὸς θεόν较简略，可能指在上帝面前或就与上帝的关系而言；正文保留这种评断层面的表达，不将其收窄为直接“向上帝夸口”的动作。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“因为”承接上文，“若是”保留条件性；正文紧凑，脚注只呈现确有词义依据的替代译法。所有脚注标记均置于相关短语之后。
