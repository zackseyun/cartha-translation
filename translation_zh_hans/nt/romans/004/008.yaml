id: ROM.4.8
reference: Romans 4:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: μακάριος ἀνὴρ ⸀οὗ οὐ μὴ λογίσηται κύριος ἁμαρτίαν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/008.yaml
  text: Blessed is the man against whom the Lord will never count sin[a][b].
translation:
  language: zh_hans
  text: 主绝不把罪算在他账上的人，是有福的。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文“人”采用阳性单数形式，但这里具有代表性，并非只指男性。
    reason: lexical_alternative
  - marker: b
    text: 或译：“主必不把罪算在他账上。”原文的否定语气十分强烈。
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριος
  choice: 有福的
  rationale: 沿用圣经祝福语的庄重表达，体现从神而来的蒙福状态；“快乐”过于侧重主观感受。
- source_word: ἀνήρ
  choice: 人
  rationale: 此处阳性单数具有代表性，泛指任何这样的人，并非仅指男性；现代汉语用“人”自然且准确。
- source_word: οὗ
  choice: 在他账上
  rationale: 与“算”共同构成自然的汉语记账表达，传达关系代词属格所指向的归算对象。
- source_word: οὐ μὴ
  choice: 绝不
  rationale: 希腊语双重否定配合虚拟语气构成强烈否定；“绝不”简洁地保留其强调力度。
- source_word: λογίσηται
  choice: 算
  rationale: 保留罗马书4章上下文中的记账隐喻，同时避免采用可能预先带入系统神学含义的术语。
- source_word: κύριος
  choice: 主
  rationale: 符合 κύριος 在经文引语语境中的通常译法。
- source_word: ἁμαρτίαν
  choice: 罪
  rationale: 保留希腊语单数作为类别概念的用法，现代汉语中“罪”无需量词即可自然表达。
theological_decisions:
- issue: 阳性单数的代表性含义
  choice: 正文译作“人”
  alternative: 男人；那人
  rationale: ἀνήρ 形式上为阳性单数，但在这里具有泛指和代表性，并不排除女性。汉语“人”既忠实传达所指范围，也不增添原文没有的男性限定。
- issue: 罪的归算与强烈否定
  choice: “绝不把罪算在他账上”
  alternative: “必不算他为有罪”；“绝不把罪归给他”
  rationale: 选择记账式表达，以保留 λογίζομαι 在本章中的核心隐喻；不把它改写成定罪判决，也不采用更技术化的神学术语。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“算在他账上”延续上下文的记账意象；句首先陈述主的作为，再以“是有福的”收束，符合自然汉语的信息结构。
