  text: καὶ πατέρα περιτομῆς τοῖς οὐκ ἐκ περιτομῆς μόνον ἀλλὰ καὶ τοῖς στοιχοῦσιν τοῖς ἴχνεσιν τῆς ⸂ἐν ἀκροβυστίᾳ πίστεως⸃ τοῦ πατρὸς ἡμῶν Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/012.yaml
  text: and the father of circumcision to those who are not merely circumcised[d][c][b][a], but who also walk in the footsteps of the faith that our father Abraham had while uncircumcised.
translation:
  language: zh_hans
  text: 又作受割礼之人的父[a]，就是那些不只是受了割礼，也循着我们先祖亚伯拉罕在未受割礼时所怀信心的足迹而行的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“割礼之父”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πατέρα περιτομῆς
  choice: 受割礼之人的父
  rationale: 原文直译为“割礼之父”，但此处所指不是礼仪本身，而是受割礼的群体；正文采用现代汉语中更清楚的表达，并以脚注保留原文较抽象的形式。
- source_word: οὐκ ἐκ περιτομῆς μόνον
  choice: 不单受了割礼
  rationale: 原文用“出于割礼”一类的群体归属表达；汉语自然地说“受了割礼”，同时保留“不单……而且也……”的限制结构。
- source_word: στοιχοῦσιν τοῖς ἴχνεσιν
  choice: 循着……脚踪而行
  rationale: στοιχεῖν有按次序前行、遵循之意，ἴχνη指足迹；该译法保留行走与效法的双重意象。
- source_word: πίστεως
  choice: 信心
  rationale: 上下文讨论亚伯拉罕对上帝应许的相信，此处译为“信心”最符合论证，并不把它改释为人的忠诚表现。
- source_word: ἐν ἀκροβυστίᾳ
  choice: 未受割礼时
  rationale: 原文是“在未受割礼的状态中”；这里该状态同时具有时间含义，汉语以“未受割礼时”表达最自然。
- source_word: τοῦ πατρὸς ἡμῶν Ἀβραάμ
  choice: 我们先祖亚伯拉罕
  rationale: “先祖”自然表达亚伯拉罕作为共同祖先的身份，并避免现代汉语“我们的父亲亚伯拉罕”可能引起的生父误解。
theological_decisions:
- issue: 亚伯拉罕作受割礼者之父的范围
  choice: 把条件限定于不只受了割礼、也跟随亚伯拉罕信心脚踪的人
  alternative: 把亚伯拉罕无条件地说成所有受割礼者的父
  rationale: 原文“不单……而且也……”修饰同一群人，表明外在割礼本身并非这里所说父子关系的充分条件；译文保留这一语法限制而不另加神学解释。
- issue: “信心”与“未受割礼时”的关系
  choice: 理解为亚伯拉罕在未受割礼时所怀的信心
  alternative: 把“未受割礼”主要关联于后面跟随者的处境
  rationale: 希腊语词序和上下文都把ἐν ἀκροβυστίᾳ与亚伯拉罕的信心紧密相连；译文清楚表达此点，同时不扩写信心的具体内容。
translation_notes:
  register: 采用现代、庄重且可朗读的书面汉语。“循着……脚踪而行”保留保罗的行走意象；“先祖”符合普通现代读者的理解。所有脚注标记均置于正文相应位置。
