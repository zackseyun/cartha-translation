id: ROM.4.11
reference: Romans 4:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ σημεῖον ἔλαβεν περιτομῆς, σφραγῖδα τῆς δικαιοσύνης τῆς πίστεως τῆς ἐν τῇ ἀκροβυστίᾳ, εἰς τὸ εἶναι αὐτὸν πατέρα πάντων τῶν πιστευόντων δι’ ἀκροβυστίας, εἰς τὸ ⸀λογισθῆναι αὐτοῖς τὴν δικαιοσύνην,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/011.yaml
  text: And he received the sign of circumcision as a seal of the righteousness of the faith that he had while uncircumcised[a], so that he might be the father of all who believe while uncircumcised, so that righteousness might be counted to them also[c][b],
translation:
  language: zh_hans
  text: 他领受了割礼这一记号，作为他在未受割礼时因信而有的义的印记[a][b]，为要使他成为一切在未受割礼状态中相信之人的父[c]，好叫义也归算给他们[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “因信而有的义”较直译为“信的义”；“义”也可译作“公义”。
    reason: lexical_alternative
  - marker: b
    text: 直译为“在未受割礼中”；即在他尚未受割礼的状态中。
    reason: lexical_alternative
  - marker: c
    text: 直译为“藉着未受割礼”；这里指人在未受割礼的状态中相信。
    reason: lexical_alternative
  - marker: d
    text: “归算给他们”也可译作“算给他们”或“算在他们账上”。
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖον
  choice: 记号
  rationale: 自然保留外在标志的含义，也符合本节的圣约语境。
- source_word: περιτομῆς
  choice: 割礼
  rationale: 保罗论述这一礼仪时的标准、准确译法。
- source_word: σφραγῖδα
  choice: 印证
  rationale: 保留印章所表达的确认、证实之喻，同时比直译“印”更符合现代汉语。
- source_word: τῆς δικαιοσύνης τῆς πίστεως
  choice: 因信所得之义
  rationale: 表达义与信的紧密关系，并结合上文罗4:9所说信被算为义；不把割礼说成获得义的途径。
- source_word: ἐν τῇ ἀκροβυστίᾳ
  choice: 未受割礼时
  rationale: 这里表示亚伯拉罕拥有信与义时所处的状态，现代汉语用时间状态表达最清楚。
- source_word: πατέρα πάντων τῶν πιστευόντων
  choice: 一切……信之人的父
  rationale: 保留保罗的代表性父亲语言，表达自然。
- source_word: δι’ ἀκροβυστίας
  choice: 未受割礼而
  rationale: 这里的διά加属格描述信徒在未受割礼状态中相信，并非以未受割礼为工具。
- source_word: λογισθῆναι
  choice: 算在……账上
  rationale: 清楚保留λογίζομαι的记账、归算意象，也与本章反复出现的用语相呼应。
- source_word: καί
  choice: 也
  rationale: 明确未受割礼的信徒同样被算为义，体现保罗的纳入性论证。
theological_decisions:
- issue: 割礼与义的关系
  choice: 将割礼表达为亚伯拉罕未受割礼时已有之义的记号和印证，而非取得义的手段。
  alternative: 也可采用容易使人听成割礼传递或赋予义的措辞。
  rationale: 希腊文的时间次序表明，亚伯拉罕先在未受割礼时有信及与信相关的义，后来才领受割礼作为印证；译文保留此顺序，不引入后期宗派性的圣礼解释。
- issue: τῆς πίστεως的关系
  choice: 译为“因信所得之义”，按本章语境表达义借着信而归给人。
  alternative: 较形式地译为“信的义”或“出于信的义”。
  rationale: 属格结构本身简练，但罗4:9及本句的论证支持义与信之间的工具或关联关系；“因信所得”在现代汉语中较清楚，同时没有把信说成功德。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“印证”保留σφραγίς的认证意象；“算在……账上”延续本章的核算隐喻。主句较长，以逗号分层，保持原文两重目的结构。
