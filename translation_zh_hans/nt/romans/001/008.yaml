  text: Πρῶτον μὲν εὐχαριστῶ τῷ θεῷ μου διὰ Ἰησοῦ Χριστοῦ ⸀περὶ πάντων ὑμῶν, ὅτι ἡ πίστις ὑμῶν καταγγέλλεται ἐν ὅλῳ τῷ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/008.yaml
  text: First[a], I thank my God through Jesus the Messiah for all of you[b], because your faith is being proclaimed throughout the whole world.
translation:
  language: zh_hans
  text: 首先，我借着耶稣基督，为你们众人感谢我的上帝，因为你们的信心正在全世界被传扬。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πρῶτον μὲν
  choice: 首先
  rationale: 标明保罗开始陈述第一点；μὲν作为篇章语气词自然融入“首先”，不另行硬译。
- source_word: εὐχαριστῶ τῷ θεῷ μου
  choice: 感谢我的上帝
  rationale: 直接保留感谢的动作和“我的上帝”这一带有个人敬虔色彩的所属表达。
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: 借着耶稣基督
  rationale: διά接属格表示途径或中介，因此译作“借着”；“基督”是现代汉语基督教语境中Χριστός的通行称谓，同时仍保有其称号性质。
- source_word: περὶ πάντων ὑμῶν
  choice: 为你们众人
  rationale: 在感谢语境中，περί自然表示感谢所关乎的对象；“众人”明确保留πάντων的全称范围。
- source_word: ἡ πίστις ὑμῶν
  choice: 你们的信
  rationale: “信”在此最自然地指罗马信徒广为人知的信仰或信靠回应；脚注保留“忠信”等可能语义。
- source_word: καταγγέλλεται
  choice: 传遍了
  rationale: 以自然汉语表达其被广泛宣扬、传述的被动意义；结合“全世界”，比机械的“正被宣告”更顺畅。
- source_word: ἐν ὅλῳ τῷ κόσμῳ
  choice: 全世界
  rationale: 保留κόσμος在此处具有修辞广度的“整个世界”范围；“传遍了全世界”符合现代汉语表达。
theological_decisions:
- issue: διὰ Ἰησοῦ Χριστοῦ中Χριστοῦ的译法
  choice: 耶稣基督
  alternative: 耶稣弥赛亚
  rationale: “基督”是Χριστός在现代标准汉语中的通行称号译法，并非仅作无意义音译；此处与“耶稣”连用时最自然庄重。原文没有定冠词，汉语也无需增添“那位”。
- issue: ἡ πίστις ὑμῶν中πίστις的语义
  choice: 你们的信
  alternative: 你们的忠信；你们的信靠
  rationale: 上下文最可能指罗马信徒广为人知的信仰回应，但πίστις具有“信靠”及“忠信”的语义范围，因此不在正文中将其限定得过窄，并以脚注保留重要可能性。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“为你们众人感谢我的上帝”保留原文成分关系；“传遍了全世界”以汉语惯用表达再现持续而广泛传扬的含义。
