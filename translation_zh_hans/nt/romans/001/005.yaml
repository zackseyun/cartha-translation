id: ROM.1.5
reference: Romans 1:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: δι’ οὗ ἐλάβομεν χάριν καὶ ἀποστολὴν εἰς ὑπακοὴν πίστεως ἐν πᾶσιν τοῖς ἔθνεσιν ὑπὲρ τοῦ ὀνόματος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/005.yaml
  text: Through whom we received grace and apostleship for the obedience of faith among all the nations for the sake of his name[b][a],
translation:
  language: zh_hans
  text: 我们借着他领受了恩典和使徒的职分，为使万民都信服而顺从[a]，为了他的名的缘故[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “信服而顺从”直译为“信的顺服”。也可理解为“由信心而来的顺服”或“以信本身为顺服”。
    reason: alternative_reading
  - marker: b
    text: “万民”也可译作“所有外邦人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ οὗ
  choice: 借着他
  rationale: διά接属格表示中介或途径；现代汉语用“借着他”自然地承接上文所指的耶稣基督。
- source_word: ἐλάβομεν
  choice: 我们领受了
  rationale: 保留希腊文第一人称复数，不在正文中将其解释为保罗个人的修辞性复数。
- source_word: χάριν καὶ ἀποστολὴν
  choice: 恩典和使徒的职分
  rationale: 保留两个由καί连接的并列名词；“使徒的职分”比单说“使徒身份”更能表达受差遣的使命。
- source_word: εἰς ὑπακοὴν πίστεως
  choice: 为要使……因信而顺服
  rationale: εἰς表达目的或目标；“因信而顺服”是自然、易懂的现代汉语，同时以脚注保留属格关系的其他可能解释。
- source_word: ἐν πᾶσιν τοῖς ἔθνεσιν
  choice: 万民
  rationale: ἔθνη在此可指各国各族，也可特指外族人；“万民”简洁地表达普世范围，另一词义列入脚注。
- source_word: ὑπὲρ τοῦ ὀνόματος αὐτοῦ
  choice: 好荣耀他的名
  rationale: ὑπέρ表示为了其名、为其名的缘故；汉语“荣耀他的名”传达为他的名誉与尊荣而行的目的，但属于适度显化。
theological_decisions:
- issue: ὑπακοὴν πίστεως的属格关系
  choice: 因信而顺服
  alternative: 信的顺服；以信为顺服
  rationale: 该短语可表示由信产生的顺服，也可表示以信本身为顺服。正文采用较自然但不过度限定的汉语表达，并用脚注明确保留其他解释。
- issue: ἐλάβομεν中“我们”的范围
  choice: 保留“我们”
  alternative: 译作保罗个人的“我”
  rationale: 希腊文明确为第一人称复数；不替读者裁定这是同工群体、使徒群体还是修辞性复数。
- issue: “他的名”的目的含义
  choice: 好荣耀他的名
  alternative: 为他的名；为了他的名的缘故
  rationale: 此处指使命为基督之名的尊荣与传扬而展开；译文作适度意义显化，脚注保留更贴近形式的表达。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“领受”“恩典”“使徒的职分”保留保罗书信的宗教语域；语序调整为自然汉语。脚注标记均置于正文相关短语之后。
