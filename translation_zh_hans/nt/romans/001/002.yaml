  text: ὃ προεπηγγείλατο διὰ τῶν προφητῶν αὐτοῦ ἐν γραφαῖς ἁγίαις
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/002.yaml
  text: which he promised beforehand through his prophets in the holy Scriptures,[a]
translation:
  language: zh_hans
  text: 这福音是神从前借着他的先知在圣经中所应许的，[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在神圣的著作中”。
    reason: 保留γραφαῖς ἁγίαις较为字面的译法；该短语也可表达为“神圣的著作”，而不直接使用后来固定化的书名“圣经”。
lexical_decisions:
- source_word: ὃ
  choice: 这福音
  rationale: 中性单数关系代词回指1:1的“福音”。汉语用“这福音”明确承接上文，比生硬直译为“它”更自然。
- source_word: προεπηγγείλατο
  choice: 从前……所应许的
  rationale: 既保留动词的应许含义，也表达前缀所含的预先、早先之意。
- source_word: διὰ τῶν προφητῶν αὐτοῦ
  choice: 借着他的先知
  rationale: “借着”自然表达以先知为传达媒介；“他的”表明这些先知属于并受命于神。汉语“先知”在此可作集合性复数。
- source_word: ἐν γραφαῖς ἁγίαις
  choice: 在圣经中
  rationale: 保罗语境中的γραφαί通常指具有权威的经卷；“圣经”是现代汉语最自然、准确的表达。介词“在……中”保留了应许记载于这些经卷中的含义。
theological_decisions:
- issue: γραφαῖς ἁγίαις应译为“圣经”还是较宽泛的“神圣著作”
  choice: 圣经
  alternative: 神圣的著作
  rationale: 在保罗的用法和本节先知性应许的语境中，该短语最可能指公认的神圣经卷；正文采用“圣经”传达这一含义，同时以脚注保留较形式对应、范围可能较宽的译法。
translation_notes:
  register: 采用现代、庄重而通顺的汉语。“这福音”清楚衔接上一节；句末逗号反映本节在罗马书1:1—7长句中尚未结束。
