id: ROM.1.17
reference: Romans 1:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: δικαιοσύνη γὰρ θεοῦ ἐν αὐτῷ ἀποκαλύπτεται ἐκ πίστεως εἰς πίστιν, καθὼς γέγραπται· Ὁ δὲ δίκαιος ἐκ πίστεως ζήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/017.yaml
  text: 'For in it the righteousness of God is revealed from faith to faith[d][c][b][a], just as it is written: “The righteous one shall live by faith.”'
translation:
  language: zh_hans
  text: 因为神的义[a]在这福音中显明出来，本于信，以至于信[b]，正如经上所记：“义人必因信而活。”[c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “神的义”也可理解为“神的公正”或“从神而来的义”；原文的属格关系没有明确限定。
    reason: lexical_alternative
  - marker: b
    text: “本于信，以至于信”翻译希腊语ἐκ πίστεως εἰς πίστιν。这一短语含义颇有争议；也可直译为“从信到信”，或解释为“始于信、终于信”“借着信、为了信”。
    reason: alternative_reading
  - marker: c
    text: 也可译作：“因信而为义的人必活着。”原文“因信”既可能修饰“活”，也可能修饰“义人”。
    reason: alternative_reading
  - marker: d
    text: 原文引语开头有连接词δὲ，也可译作：“但义人必因信而活。”
    reason: previous_rendering
lexical_decisions:
- source_word: δικαιοσύνη
  choice: 义
  rationale: “义”是保罗书信中δικαιοσύνη的传统而凝练的对应词，可涵盖正直、公义、被判为义等相关语义；此处不将其限定为单一教义解释。
- source_word: θεοῦ
  choice: 神的
  rationale: 保留属格结构“神的义”，不预先裁定它专指神自身的义、神所施行的公正，还是从神而来的义。
- source_word: ἐν αὐτῷ
  choice: 在这福音中
  rationale: 中性代词αὐτῷ最自然地回指上一节的“福音”；汉语明说“这福音”可避免“在其中”指代不清。
- source_word: ἀποκαλύπτεται
  choice: 显明出来
  rationale: 自然表达现在时被动语态的“被揭示、被显露”，不额外限定其时态体意义。
- source_word: ἐκ πίστεως εἰς πίστιν
  choice: 从信到信
  rationale: 逐一保留ἐκ与εἰς的方向性及πίστις的重复，以保留这一著名难句的真实歧义，而不选定“始于信、终于信”等解释。
- source_word: δίκαιος
  choice: 义人
  rationale: 自然、庄重地表达作名词用的单数形容词，符合经文引语的汉语传统。
- source_word: ἐκ πίστεως
  choice: 因信
  rationale: “因信而活”在现代汉语中清楚简练，同时仍可通过脚注提示该短语也可能修饰“义人”。
- source_word: ζήσεται
  choice: 必……活
  rationale: “必”传达将来时的确定意味，也适合庄重的经文引语。
- source_word: δὲ
  choice: 主文不单独译出
  rationale: 此处引文用于支持上文；若硬译为“但”容易在汉语中造成过强的转折。脚注保留这一形式上的可能译法。
theological_decisions:
- issue: δικαιοσύνη θεοῦ的含义
  choice: 神的义
  alternative: 从神而来的义；神的公正
  rationale: 希腊语属格具有多种可能关系。主文采用透明的“神的义”，不把争议预先解释为来源属格或仅指神施行公正。
- issue: ἐκ πίστεως εἰς πίστιν的含义
  choice: 从信到信
  alternative: 本于信、归于信；始于信、终于信；借着信、为了信
  rationale: 原语措辞极为简练且解释纷纭。主文保留两个介词的方向感和“信”的重复，让神的信实与人的信、信的起点与终点等可能理解保持开放。
- issue: 哈巴谷引文中ἐκ πίστεως的连接对象
  choice: 义人必因信而活
  alternative: 因信而为义的人必活着
  rationale: 原文可将“因信”理解为修饰“活”，也可理解为修饰“义人”。主文采用自然且通行的句法，脚注说明另一种连接方式。
- issue: 引文中δὲ的处理
  choice: 主文省略显性连接词
  alternative: 但义人必因信而活
  rationale: δὲ可有轻微承接或转折作用；这里若译“但”会使汉语读者感到与上文强烈对立。省略能保持论证的支持关系，脚注则保留形式对应。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“神的义”“从信到信”刻意保留原文的神学张力；“在这福音中”明确上一节所指，避免汉语代词含混。引文保持简洁有力，不使用古奥虚词。
