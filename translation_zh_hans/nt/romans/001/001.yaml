base_translation:
  language: en
  yaml_path: translation/nt/romans/001/001.yaml
  text: Paul[a], a slave of Messiah Jesus, called as an apostle, set apart for the gospel of God[d][c][b],
translation:
  language: zh_hans
  text: 保罗，弥赛亚耶稣[c]的奴隶[a]，蒙召作使徒[b]，为上帝的福音而被分别出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “奴隶”或译“仆人”“奴仆”。
    reason: lexical_alternative
  - marker: b
    text: “蒙召作使徒”或译“蒙召的使徒”。
    reason: alternative_reading
  - marker: c
    text: “弥赛亚耶稣”也常译作“基督耶稣”。
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλος
  choice: 奴隶
  rationale: 保留该词所表达的隶属与归属关系，不以较弱的“仆人”淡化其力度。
- source_word: Χριστοῦ Ἰησοῦ
  choice: 弥赛亚耶稣
  rationale: 此处 Χριστός 仍具有称号意味；译作“弥赛亚”可显明其含义，并保留原文“称号＋名字”的次序。
- source_word: κλητὸς ἀπόστολος
  choice: 蒙召作使徒
  rationale: 以自然的现代汉语表达形容词与名词的关系；“蒙召”也保留呼召者未明说的被动意味。
- source_word: ἀφωρισμένος
  choice: 被分别出来
  rationale: 保留完成时被动分词的状态性与被动意味，不把它具体化为原文未明说的“任命”。
- source_word: εἰς εὐαγγέλιον θεοῦ
  choice: 为上帝的福音
  rationale: “为”简洁表达 εἰς 在此处的目的或指向；属格 θεοῦ 直译为“上帝的”。
theological_decisions:
- issue: δοῦλος 所表达的身份关系
  choice: 奴隶
  alternative: 仆人／奴仆
  rationale: “奴隶”最直接保留原词所含的受主人支配和归属主人的关系；脚注列出较传统且语气稍缓的译法。
- issue: Χριστός 在此处是称号还是已名称化的用语
  choice: 弥赛亚耶稣
  alternative: 基督耶稣
  rationale: 原文次序及保罗的自我介绍容许按称号理解；正文显明“受膏者／弥赛亚”的称号意义，同时用脚注保留惯用译法。
- issue: κλητὸς ἀπόστολος 的句法关系
  choice: 蒙召作使徒
  alternative: 蒙召的使徒
  rationale: 正文采用自然汉语表达其述谓含义，但原文也可较贴近形式地理解为“蒙召的使徒”，故在脚注中保留。
translation_notes:
  register: 采用现代、庄重而清楚的书信开篇语体。三个描述保罗身份的成分保持并列；“为上帝的福音而被分别出来”保留原文的被动结构和目的指向。
