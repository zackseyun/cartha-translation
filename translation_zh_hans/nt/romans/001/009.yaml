  rationale: 修订恢复μάρτυς ἐστιν的直陈语气，并以较自然的汉语关系从句承载原文插入的事奉说明。“以我的心灵”适合现代汉语，脚注保留“在我的灵里”的形式对应。保留“在他儿子的福音上”，不将其属格关系或“在”的具体含义扩展为“传扬”或“关于”。
