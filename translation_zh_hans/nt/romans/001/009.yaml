  text: μάρτυς γάρ μού ἐστιν ὁ θεός, ᾧ λατρεύω ἐν τῷ πνεύματί μου ἐν τῷ εὐαγγελίῳ τοῦ υἱοῦ αὐτοῦ, ὡς ἀδιαλείπτως μνείαν ὑμῶν ποιοῦμαι
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/009.yaml
  text: For God[a], whom I serve in my spirit in the good news of his Son[d][c][b], is my witness that I continually mention you.
translation:
  language: zh_hans
  text: 我以我的心灵[a]在他儿子的福音上所事奉的上帝，是我的见证：我不断地提到你们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在我的灵里”。
    reason: lexical_alternative
lexical_decisions:
- source_word: μάρτυς
  choice: 作证
  rationale: 这里是近似起誓的郑重申诉，表示上帝能为保罗所说的话作见证；汉语用“可以为我作证”自然清楚。
- source_word: λατρεύω
  choice: 事奉
  rationale: 该词指向上帝所献上的宗教性服事；“事奉”既保留敬拜、服事的色彩，也符合现代基督教汉语的一般表达。
- source_word: ἐν τῷ πνεύματί μου
  choice: 在我的灵里
  rationale: 直译保留ἐν可能表达领域或内在层面的含义，不把它限定为工具或方式；另以脚注列出“用我的灵”。
- source_word: ἐν τῷ εὐαγγελίῳ τοῦ υἱοῦ αὐτοῦ
  choice: 在他儿子的福音上
  rationale: 保留介词短语及属格的开放性，不擅自增添“传扬”或将属格明确解释成“关于他儿子”。“福音”在现代汉语中通行且准确。
- source_word: ἀδιαλείπτως
  choice: 不断地
  rationale: 表达持续、经常而不间断的行动，现代汉语自然明白。
- source_word: μνείαν ὑμῶν ποιοῦμαι
  choice: 提到你们
  rationale: 这是“提及、说起”的惯用结构；避免译成“记念你们”，因为后者可能增添原文未明确表达的祷告或关怀含义。
theological_decisions:
- issue: ἐν τῷ πνεύματί μου表示内在领域还是凭借灵而事奉
  choice: 在我的灵里
  alternative: 用我的灵
  rationale: 原文介词ἐν可表达领域、方式或凭借。正文采用较贴近形式且不排除内在事奉含义的译法，并用脚注保留工具性理解。
- issue: “他儿子的福音”中属格的关系
  choice: 他儿子的福音
  alternative: 关于他儿子的福音
  rationale: 原文属格可涉及来源、归属或内容；直译保留这种张力，不在正文中将其单限定为“关于”。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以破折号标示较长的关系从句，使“上帝……可以为我作证”的主干清楚，同时保留希腊文各短语之间的关系与歧义。
