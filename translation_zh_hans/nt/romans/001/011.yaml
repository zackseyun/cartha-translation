  terminology: “属灵的恩赐”是恰当且通行的对应，保留πνευματικόν究竟指属灵、属圣灵或带来属灵益处的语义空间；不应改为限定性的“圣灵恩赐”或神迹性能力。“坚固”适当地保留了被动表达未说明施事者的特点。
