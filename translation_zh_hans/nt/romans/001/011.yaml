  to: 因为我切望见到你们，为要把某种属灵的恩赐分给你们[a]，使你们得以坚固[b]。
  rationale: 修订仅处理不定单数的表达和μεταδῶ的汉语搭配。“某种”避免将原文未说明的恩赐理解为若干项具体恩赐；“分给”更直接表达向罗马信徒传递属灵益处，同时脚注保留“分享”的合理译法。其余句法及神学语义空间维持不变。
