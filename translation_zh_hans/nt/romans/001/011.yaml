id: ROM.1.11
reference: Romans 1:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐπιποθῶ γὰρ ἰδεῖν ὑμᾶς, ἵνα τι μεταδῶ χάρισμα ὑμῖν πνευματικὸν εἰς τὸ στηριχθῆναι ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/011.yaml
  text: For I long to see you[a], so that I may impart some spiritual gift to you to strengthen you[b],
translation:
  language: zh_hans
  text: 因为我切望见到你们，为要把某种属灵的恩赐分给你们[a]，使你们得以坚固[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“与你们分享某种属灵的恩赐。”
    reason: 词义备选；μεταδῶ可指把自己所有的分给别人，也可强调分享。
  - marker: b
    text: 直译：“为使你们被坚固。”
    reason: 原文为被动式不定词；正文以自然汉语表达其目的，并不指明施事者。
lexical_decisions:
- source_word: ἐπιποθῶ
  choice: 切望
  rationale: 表达强烈而真挚的愿望，语气庄重自然，又不显古奥。
- source_word: γὰρ
  choice: 因为
  rationale: 保留本句与上文之间的解释关系，符合现代汉语表达。
- source_word: ἰδεῖν
  choice: 见到
  rationale: 按原词直译为“见到”，不将上下文隐含的探访之意直接写入正文。
- source_word: ἵνα
  choice: 好
  rationale: 自然地标明保罗想见他们的目的；与后面的“使”配合，可清楚呈现句子的目的结构。
- source_word: τι
  choice: 一些
  rationale: 保留原文的不定意味，不将所指限定为某一种特定恩赐。
- source_word: μεταδῶ
  choice: 分享
  rationale: 该词有把自己所有的分给他人、与人分享之意；“分享”较“传授”自然，也避免暗示保罗可以自行授予某种特定能力。
- source_word: χάρισμα
  choice: 恩赐
  rationale: “恩赐”既体现与恩典相关的词义，也是在现代中文圣经语境中清楚而简洁的对应表达。
- source_word: πνευματικὸν
  choice: 属灵的
  rationale: 保留形容词的宽泛含义，不擅自限定为神迹性能力，也不直接改写成“圣灵所赐的”。
- source_word: εἰς τὸ στηριχθῆναι ὑμᾶς
  choice: 使你们得以坚固
  rationale: 保留原文的目的或预期结果以及被动语态，同时在现代汉语中通顺自然。
theological_decisions:
- issue: “属灵的恩赐”是否专指某种神迹性或职分性的恩赐
  choice: 一些属灵的恩赐
  alternative: 一些圣灵所赐的恩赐；某种属灵的益处
  rationale: 原文并未把 χάρισμα 限定为某一种超自然能力，也没有明确解释其具体内容，因此正文保留较宽泛的表达。
- issue: 坚固他们的施事者是否应明确写成保罗或所分享的恩赐
  choice: 使你们得以坚固
  alternative: 借此坚固你们
  rationale: 原文使用被动式，并未明说最终施事者；保留被动表达可避免过度确定是保罗、恩赐还是上帝在施行坚固。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“切望”保留保罗强烈的个人情感；全句保持目的关系清楚。正文不把“属灵的恩赐”窄化为特定神迹能力，也不补出原文没有明说的施事者。
