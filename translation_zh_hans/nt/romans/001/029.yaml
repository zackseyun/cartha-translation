id: ROM.1.29
reference: Romans 1:29
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: πεπληρωμένους πάσῃ ⸀ἀδικίᾳ πονηρίᾳ πλεονεξίᾳ κακίᾳ, μεστοὺς φθόνου φόνου ἔριδος δόλου κακοηθείας, ψιθυριστάς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/029.yaml
  text: filled with every kind of unrighteousness[a], evil, greed, and malice; full of envy, murder, strife, deceit, and maliciousness; whisperers[b],
translation:
  language: zh_hans
  text: 他们充满了各样的不义[a]、邪恶、贪婪和恶意；满怀嫉妒、凶杀、纷争、诡诈和恶毒；又是私下毁谤人的人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“充满了不义”；这里的希腊语表达全面的范围。
    reason: lexical_alternative
  - marker: b
    text: “私下毁谤人的人”也可译作“搬弄是非的人”或“说闲话的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πεπληρωμένους
  choice: 充满了
  rationale: 表达完成时被动分词所描写的既成状态；现代汉语自然流畅，也保留“被充满”所产生的结果意味。
- source_word: πάσῃ
  choice: 各样的
  rationale: 与单数抽象名词连用时表示范围全面；“各样的”比机械译作“所有的”更符合现代汉语。
- source_word: ἀδικίᾳ
  choice: 不义
  rationale: 兼顾对神、对人及一般道德层面的错误与不正，不局限于社会层面的“不公”。
- source_word: πονηρίᾳ
  choice: 邪恶
  rationale: 表达广义的道德败坏，并与后面的 κακίᾳ 区分。
- source_word: πλεονεξίᾳ
  choice: 贪婪
  rationale: 清楚表达不断想占有更多的欲望，是现代汉语中最自然的对应词。
- source_word: κακίᾳ
  choice: 恶意
  rationale: 突出针对他人的恶念，与表示广义道德邪恶的 πονηρίᾳ 有所区别。
- source_word: μεστοὺς
  choice: 满怀
  rationale: 既表达“满有”的意思，又与前面的“充满了”形成自然变化。
- source_word: φθόνου
  choice: 嫉妒
  rationale: 准确表达因他人所有或所得而产生的不满。
- source_word: φόνου
  choice: 凶杀
  rationale: 保留该词在恶行清单中的强烈道德含义；“凶杀”也适合与其他抽象恶行并列。
- source_word: ἔριδος
  choice: 纷争
  rationale: 简洁表达争竞、冲突和不和，适合恶行清单的语体。
- source_word: δόλου
  choice: 诡诈
  rationale: 表达蓄意欺骗和设法蒙骗人的意味。
- source_word: κακοηθείας
  choice: 恶毒
  rationale: 突出性情和用心上的恶劣，避免与前面的“恶意”完全合并。
- source_word: ψιθυριστάς
  choice: 暗中毁谤人
  rationale: 该名词指私下低声议论、暗地中伤别人的人；此译法保留其隐秘性及伤害他人名誉的意味。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的恶行清单语体。以分号呈现原文两个“充满”结构及末尾人物称谓之间的层次；各词力求简洁，同时区分 πονηρία、κακία 与 κακοήθεια 的相近含义。
