id: ROM.1.25
reference: Romans 1:25
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οἵτινες μετήλλαξαν τὴν ἀλήθειαν τοῦ θεοῦ ἐν τῷ ψεύδει, καὶ ἐσεβάσθησαν καὶ ἐλάτρευσαν τῇ κτίσει παρὰ τὸν κτίσαντα, ὅς ἐστιν εὐλογητὸς εἰς τοὺς αἰῶνας· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/025.yaml
  text: who exchanged the truth of God for the lie, and revered and served the creation rather than the Creator, who is blessed forever. Amen.
translation:
  language: zh_hans
  text: 他们用谎言取代了上帝的真理，又敬奉并服事受造之物，而不敬奉并服事造物主。造物主是永远当受称颂的。阿们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετήλλαξαν
  choice: 用……取代了……
  rationale: 表达以一物换去另一物的语义，并清楚呈现他们弃真从假的行动。
- source_word: τὴν ἀλήθειαν τοῦ θεοῦ
  choice: 上帝的真理
  rationale: 保留属格结构本身可能涵盖的语义张力，不限定为“关于上帝的真理”或“上帝所启示的真理”。
- source_word: ἐν τῷ ψεύδει
  choice: 用谎言
  rationale: ἐν 在交换结构中表示所换取、用来替代的对象；定冠词予以保留为特指性的“谎言”，但中文无需机械译作“那谎言”。
- source_word: ἐσεβάσθησαν
  choice: 敬奉
  rationale: 兼顾敬畏、尊崇与宗教性崇敬，比单译“敬重”更符合此处偶像崇拜语境，也避免与后面的“服事”重复。
- source_word: ἐλάτρευσαν
  choice: 服事
  rationale: 该词在此指宗教性的事奉；“服事”保持与“敬奉”的区分。
- source_word: τῇ κτίσει
  choice: 受造之物
  rationale: 此处指被创造的事物整体，而非创造这一行为。
- source_word: παρὰ τὸν κτίσαντα
  choice: 而不……造物主
  rationale: παρά 在比较语境中表示“超过、而不是”；中文用“而不”自然呈现受造物与创造者之间的排他性对照。
- source_word: εὐλογητὸς εἰς τοὺς αἰῶνας
  choice: 永远当受称颂
  rationale: εὐλογητός 用于上帝时表示“当受称颂”；εἰς τοὺς αἰῶνας 表达直到永远。
- source_word: ἀμήν
  choice: 阿们
  rationale: 沿用现代中文圣经与基督教语境中通行的音译。
theological_decisions:
- issue: παρά 所表达的受造物与造物主的对照
  choice: 译为“而不敬奉并服事造物主”
  alternative: “过于造物主”或“而不是造物主”
  rationale: 上下文责备的是以受造物取代造物主作为崇敬和事奉的对象；“而不”在现代中文中自然明确，又不引入额外教义解释。
- issue: 关系代词 ὅς 的指代及颂赞对象
  choice: 另起一句明确为“造物主是永远当受称颂的”
  alternative: “他是永远当受称颂的”
  rationale: 希腊文阳性单数关系代词直接指向“创造者”；中文重复“造物主”可消除因前置“受造之物”造成的指代歧义，而不改变原文神学内容。
- issue: 是否把“敬奉”和“服事”同时施用于造物主
  choice: 在否定对照中重复两个动作
  alternative: “敬奉并服事受造之物，而不是造物主”
  rationale: 原文 παρά 可统摄前面两个并列动词；补出两个动作使中文关系明确，并保留责备的完整力度。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“敬奉并服事”保留两个希腊动词的区别；将末尾关系从句独立成句，以避免中文指代含混。正文不需脚注。
