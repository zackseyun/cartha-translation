  text: διότι τὸ γνωστὸν τοῦ θεοῦ φανερόν ἐστιν ἐν αὐτοῖς, ὁ ⸂θεὸς γὰρ⸃ αὐτοῖς ἐφανέρωσεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/019.yaml
  text: because what can be known about God is plain among them, for God has made it plain to them.
translation:
  language: zh_hans
  text: 因为关于上帝可知的事，在他们中间是显明的[a]，因为上帝已经向他们显明了这事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在他们里面”。
    reason: 原文ἐν αὐτοῖς既可指“在他们中间”，也可指“在他们里面”。
lexical_decisions:
- source_word: διότι
  choice: 因为
  rationale: 引出上一节论断的原因；“因为”在现代汉语中清楚表达因果关系。
- source_word: τὸ γνωστὸν τοῦ θεοῦ
  choice: 关于上帝所能知道的
  rationale: τὸ γνωστόν是中性单数形容词名词化，可指可被认识、可知的事；τοῦ θεοῦ在此自然译作“关于上帝”。这一译法保留其可知性含义，而不将其缩窄为人已经实际掌握的知识。
- source_word: φανερόν
  choice: 是显明的
  rationale: 表达公开、明显、可辨认的状态，并与后面的ἐφανέρωσεν形成词义呼应。
- source_word: ἐν αὐτοῖς
  choice: 在他们中间
  rationale: ἐν加复数代词可表达群体范围中的公开显现；原文也可能指“在他们里面”，故以脚注保留歧义。
- source_word: ὁ θεὸς γὰρ αὐτοῖς ἐφανέρωσεν
  choice: 因为上帝已经向他们显明了
  rationale: 保留γάρ的解释性因果关系，并让“显明”与前句φανερόν呼应；汉语中宾语可由上文自然补足。
theological_decisions:
- issue: ἐν αὐτοῖς的范围或位置含义
  choice: 在他们中间
  alternative: 在他们里面
  rationale: 原短语既可能指在人群中公开可见，也可能指在人内在层面的显明。正文采用群体或公开范围的理解，同时用脚注保留内在含义，避免消除原文的神学张力。
- issue: τὸ γνωστὸν表示可知还是已知
  choice: 关于上帝所能知道的
  alternative: 关于上帝已知的事
  rationale: γνωστόν可表达“可知的”或“已知的”。结合显明与启示的语境，正文采用“所能知道的”，但不扩展为关于上帝的一切都可被人认识。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“上帝”遵循所给咨询文本的称谓；以两次“显明”保留希腊文φανερόν与ἐφανέρωσεν的词义呼应。
