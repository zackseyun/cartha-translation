source:
  edition: SBLGNT
  text: πᾶσιν τοῖς οὖσιν ἐν Ῥώμῃ ἀγαπητοῖς θεοῦ, κλητοῖς ἁγίοις· χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/007.yaml
  text: 'To all those in Rome who are beloved by God and called to be saints: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a][b][c].'
translation:
  language: zh_hans
  text: 写给所有在罗马、蒙上帝所爱、蒙召为圣徒的人[a]：愿恩典与平安从我们的父上帝和主耶稣基督[b]临到你们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“蒙召的圣洁之人”；传统译作“蒙召为圣徒”。
    reason: lexical_alternative
  - marker: b
    text: “基督”意为“弥赛亚”，即“受膏者”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσιν τοῖς οὖσιν ἐν Ῥώμῃ
  choice: 所有在罗马……的人
  rationale: 保留πᾶσιν的全称范围及ἐν Ῥώμῃ的地点含义，并以现代汉语自然的定语结构表达。
- source_word: ἀγαπητοῖς θεοῦ
  choice: 蒙上帝所爱
  rationale: 保留形容词ἀγαπητοῖς所表达的身份和关系意味；“蒙……所爱”庄重而清楚。
- source_word: κλητοῖς ἁγίοις
  choice: 蒙召为圣徒
  rationale: κλητοῖς和ἁγίοις均为形容词；此译法在自然汉语中表达受召与圣徒身份的关系，同时用脚注保留“蒙召的圣洁之人”这一较贴近形式的理解。
- source_word: χάρις
  choice: 恩典
  rationale: 符合保罗书信问安语的常用译法，也保留其神学内涵。
- source_word: εἰρήνη
  choice: 平安
  rationale: 既能发挥问安功能，也保留εἰρήνη所含的和平、安宁与福祉意味。
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: 我们的父上帝
  rationale: 自然表达“上帝是我们的父”这一属格结构，避免误读为两个来源。
- source_word: κυρίου
  choice: 主
  rationale: “主”是κύριος在此基督论语境中的准确、通行译法。
- source_word: Χριστοῦ
  choice: 基督
  rationale: 现代汉语中“基督”是Χριστός作为耶稣称号的通行表达；脚注说明其意义为“弥赛亚（受膏者）”。
theological_decisions:
- issue: 如何表达κλητοῖς ἁγίοις中“蒙召”与“圣洁者/圣徒”的关系
  choice: 蒙召为圣徒
  alternative: 蒙召的圣洁之人；蒙召作圣徒
  rationale: 原文没有明示“成为”的不定式，因此正文采用汉语中简洁而传统的表达，并以脚注提示较贴近希腊文形态的另一译法，避免把一种句法解释绝对化。
- issue: χάρις与εἰρήνη的来源是否同时由父上帝和主耶稣基督构成
  choice: 从我们的父上帝和主耶稣基督临到你们
  alternative: 把“从”仅与父上帝相连
  rationale: 单一介词ἀπό统摄两个并列名词短语，最自然地把父上帝与主耶稣基督共同呈现为恩典和平安的来源。
- issue: Χριστός应音译还是释义
  choice: 基督
  alternative: 弥赛亚；受膏者
  rationale: “基督”在现代汉语中既是约定俗成的称号，又不必把该词简化为姓名组成部分；脚注补明其称号含义。
translation_notes:
  register: 采用现代、庄重而易懂的书信问安语体。“写给”补足中文书信地址语所需成分；原文此节本身没有显式动词。“愿……临到你们”自然呈现希腊文省略系词的祝愿句。
