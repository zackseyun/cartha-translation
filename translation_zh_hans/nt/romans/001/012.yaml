  text: τοῦτο δέ ἐστιν συμπαρακληθῆναι ἐν ὑμῖν διὰ τῆς ἐν ἀλλήλοις πίστεως ὑμῶν τε καὶ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/012.yaml
  text: that is[a], that I may be mutually encouraged among you through each other’s faith[c][b], both yours and mine.
translation:
  language: zh_hans
  text: 也就是说，我在你们中间，借着你们和我彼此的信心，与你们一同得到鼓励。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “与你们一同得到鼓励”也可译作“我们在你们中间彼此得到鼓励”。后一译法突出原文动词所含共同、相互的意味；正文则依上下文保留保罗以第一人称表达的愿望。
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δέ ἐστιν
  choice: 也就是说
  rationale: 承接并解释上一节的意思；现代汉语自然，同时保留原文的说明语气。
- source_word: συμπαρακληθῆναι
  choice: 与你们一同得到鼓励
  rationale: 保留复合动词所表达的共同、相互参与之意，也依上下文呈现保罗本人的视角；原文不定式本身不标明人称。
- source_word: ἐν ὑμῖν
  choice: 在你们中间
  rationale: 这里表示鼓励发生在罗马信徒群体之中，而不是指内在状态。
- source_word: διὰ τῆς ἐν ἀλλήλοις πίστεως
  choice: 借着你我彼此的信心
  rationale: “借着”表达διὰ的途径或媒介意义；“彼此”保留ἐν ἀλλήλοις的相互性，并与后面的“你们的和我的”结合成自然汉语。
- source_word: πίστεως
  choice: 信心
  rationale: 此处指保罗与罗马信徒对神的信靠；“信心”比“忠信”更符合上下文。
- source_word: ὑμῶν τε καὶ ἐμοῦ
  choice: 你我
  rationale: 简洁表达“你们的和我的”这一对称结构，并避免汉语中重复“信心”造成的累赘。
theological_decisions:
- issue: 本节所说的是使徒单方面坚固信徒，还是双方共同得到鼓励
  choice: 保罗与罗马信徒一同得到鼓励
  alternative: 主要由保罗坚固他们
  rationale: συμπαρακληθῆναι中的共同意味，以及“你们的和我的信心”，都表明这里不是单向的服事；译文保留双方共同参与的张力。
- issue: 不定式中未明说的主语如何呈现
  choice: 依上下文以“我”为视角，同时用“与你们一同”保留共同性
  alternative: 直接译为“我们彼此得到鼓励”
  rationale: 希腊语不定式本身不标人称；前文是保罗第一人称的愿望，因此正文保留“我”的视角，但不把共同鼓励缩减为保罗个人单独受益。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你我彼此的信心”体现双方信心所带来的相互鼓励；“一同得到鼓励”避免把经文理解成保罗单方面施予鼓励。
