  text: καταλάλους, θεοστυγεῖς, ὑβριστάς, ὑπερηφάνους, ἀλαζόνας, ἐφευρετὰς κακῶν, γονεῦσιν ἀπειθεῖς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/030.yaml
  text: slanderers[a], hateful to God, insolent, arrogant, boastful, inventors of evil, disobedient to parents,
translation:
  language: zh_hans
  text: 毁谤人的，恨上帝的[a]，凌辱人的，狂傲的，自夸的，想出恶事的，忤逆父母的，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“上帝所憎恶的”。
    reason: 保留 θεοστυγεῖς 可能的被动义。
lexical_decisions:
- source_word: καταλάλους
  choice: 说人坏话的
  rationale: 指在背后说人坏话、诋毁他人的人；此译自然易懂，并保留其伦理力度。
- source_word: θεοστυγεῖς
  choice: 恨上帝的
  rationale: 按主动义理解为仇恨上帝的人，符合这一连串对人的性情与行为的描述；被动义在脚注保留。
- source_word: ὑβριστάς
  choice: 凌辱人的
  rationale: 该词包含傲慢无礼并欺凌、侮辱他人的意思；此译比单纯的“无礼”更能体现对他人的侵害。
- source_word: ὑπερηφάνους
  choice: 狂傲的
  rationale: 表达自视高人一等的傲慢，也与相邻的自夸之意有所区分。
- source_word: ἀλαζόνας
  choice: 自夸的
  rationale: 指夸耀、吹嘘自己的人；译法简洁自然，适合罪恶清单的并列结构。
- source_word: ἐφευρετὰς κακῶν
  choice: 想出各种恶事的
  rationale: 表达别出心裁地谋划或创出恶事；“各种”使汉语表达自然，但不把恶限定为某一类。
- source_word: γονεῦσιν ἀπειθεῖς
  choice: 忤逆父母的
  rationale: 准确表达对父母不服从、悖逆的关系性含义，且用语庄重凝练。
theological_decisions:
- issue: θεοστυγεῖς 的语态含义
  choice: 主动义：“恨上帝的”
  alternative: 被动义：“上帝所憎恶的”
  rationale: 主动义更符合本段逐项列举人的性情和行为的语流；但该词在解释史上也可按被动义理解，因此以脚注保留，不消除原文的歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话，以重复的“……的”保持原文罪恶清单的紧凑并列节奏。
