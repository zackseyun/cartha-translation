  text: among whom you also are[a], called of Jesus the Messiah,
translation:
  language: zh_hans
  text: 你们也在其中，是蒙召归属耶稣这位弥赛亚的人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“耶稣这位弥赛亚的蒙召者”。原文的属格主要表示归属关系；也可理解为“蒙耶稣这位弥赛亚呼召的人”。
    reason: 原文属格可表示归属关系，也可能表示呼召的施事者。
lexical_decisions:
- source_word: ἐν οἷς
  choice: 在他们中间
  rationale: 关系代词为复数，承接上一节所说的列国之民；“在他们中间”自然表达罗马信徒也包括在这群人之内。
- source_word: ἐστε
  choice: 是
  rationale: 明确表达 εἰμί 的现在时直陈语气，并与后面的表语“蒙召者”自然衔接。
- source_word: καὶ ὑμεῖς
  choice: 你们也
  rationale: 保留原文对“你们”的强调，以及罗马信徒同样被包括在内的意思。
- source_word: κλητοὶ
  choice: 蒙召者
  rationale: 既保留 κλητός 表示被呼召之人的名词性用法，也避免将其弱化为一般性的“受邀请者”。
- source_word: Ἰησοῦ Χριστοῦ
  choice: 耶稣弥赛亚
  rationale: Ἰησοῦ 译作人名“耶稣”；Χριστοῦ 在此作为称号译作“弥赛亚”。
- source_word: κλητοὶ Ἰησοῦ Χριστοῦ
  choice: 耶稣弥赛亚的蒙召者
  rationale: 用简洁的“的”结构贴近原文未明说关系类型的属格表达，不在正文中武断限定为归属关系或施事关系。
theological_decisions:
- issue: 如何表达 κλητοὶ Ἰησοῦ Χριστοῦ 中属格的关系
  choice: 耶稣弥赛亚的蒙召者
  alternative: 属于耶稣弥赛亚的蒙召者；蒙耶稣弥赛亚呼召的人
  rationale: 希腊语属格较为浓缩，既可理解为归属，也可能被理解为呼召的施事。“耶稣弥赛亚的蒙召者”在中文中保留类似的关系弹性，并以脚注说明主要译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“蒙召者”保留经文的神学分量；句式简洁，并承接上一节的“列国之民”。
