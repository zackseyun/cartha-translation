revisions:
- from: 因为上帝的震怒正从天上显明出来，临到人的一切不敬虔和不义，就是那些以不义压制真理的人[a][b]。
  to: 因为上帝的愤怒正从天上显明出来，临到那些以不义压制真理之人的一切不敬虔和不义[a][b]。
  rationale: 修订仅处理两项安全且必要的改进：以“愤怒”避免对ὀργή作无根据的强度升级，并重组汉语语序，使“以不义压制真理”的分词结构明确限定“人”。保留“正……显明出来”所体现的现在时进行性，保留“以不义”及其脚注所承认的“在不义中”歧义，也保留所有现有脚注锚点和内容。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T03:51:06Z'
review_pass:
  verdict: revise
  source_fidelity: “震怒”比ὀργή所必然表达的强度更高；改为“愤怒”可保留上帝审判性的怒气，同时避免额外强化。原句中“就是那些……”在句法上易使其与“不敬虔和不义”形成不够清楚的同位关系；重组后明确τῶν…κατεχόντων修饰“人”。其余关键对应（现在时被动的持续性、从天上的来源、ἀσέβεια／ἀδικία的双重表达及ἐν ἀδικίᾳ的手段义）均得到保留。
  naturalness: 修订句子采用现代庄重的标准汉语，避免“人的……，就是那些……的人”造成的指代和修饰层级滞涩。“临到……之人的一切不敬虔和不义”虽保持原文的紧密修饰关系，仍可自然理解为上帝的愤怒针对这些人的一切不敬虔和不义。
  terminology: “上帝的愤怒”适当地表达ὀργὴ θεοῦ的属格及审判语境，不把它弱化为抽象后果，也不将其加强为“震怒”。“不敬虔”“不义”“真理”“压制”均是准确且在现代汉语圣经语域中稳定的对应。
  issues:
  - severity: medium
    issue: “震怒”可能过度强化ὀργή。
    rationale: ὀργή在本节确有上帝审判性怒气的含义，但原词本身并未要求译为较强烈、带额外修辞色彩的“震怒”。“愤怒”既自然又足以保留原文分量。
  - severity: low
    issue: “就是那些……”的句法连接不够清晰。
    rationale: 希腊文τῶν…κατεχόντων是修饰ἀνθρώπων的冠词分词结构；草案的“人的一切……，就是那些……的人”会使“就是”似乎把人的罪行与人本身作同位。调整语序可更清楚地保留修饰关系。
  revised_text: 因为上帝的愤怒正从天上显明出来，临到那些以不义压制真理之人的一切不敬虔和不义[a][b]。
  revised_footnotes:
  - marker: a
    text: “以不义”或译“在不义中”。
    reason: lexical_alternative
  - marker: b
    text: “压制”也可译作“阻挡”或“抑制”。
    reason: lexical_alternative
  revision_rationale: 修订仅处理两项安全且必要的改进：以“愤怒”避免对ὀργή作无根据的强度升级，并重组汉语语序，使“以不义压制真理”的分词结构明确限定“人”。保留“正……显明出来”所体现的现在时进行性，保留“以不义”及其脚注所承认的“在不义中”歧义，也保留所有现有脚注锚点和内容。
