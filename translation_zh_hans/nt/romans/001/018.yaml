id: ROM.1.18
reference: Romans 1:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ἀποκαλύπτεται γὰρ ὀργὴ θεοῦ ἀπ’ οὐρανοῦ ἐπὶ πᾶσαν ἀσέβειαν καὶ ἀδικίαν ἀνθρώπων τῶν τὴν ἀλήθειαν ἐν ἀδικίᾳ κατεχόντων,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/018.yaml
  text: For the wrath of God is being revealed from heaven against all ungodliness and unrighteousness of people who suppress the truth in unrighteousness[a][b][c][d][e].
translation:
  language: zh_hans
  text: 因为上帝的愤怒正从天上显明出来，临到那些以不义压制真理之人的一切不敬虔和不义[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以不义”或译“在不义中”。
    reason: lexical_alternative
  - marker: b
    text: “压制”也可译作“阻挡”或“抑制”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀποκαλύπτεται
  choice: 正……显明出来
  rationale: 现在时被动语态；“正”自然地保留其进行或持续意味，“显明出来”表达被揭示、显露。
- source_word: γὰρ
  choice: 因为
  rationale: 承接并说明前文的根据；现代汉语中“因为”比句首“原来”更直接清楚。
- source_word: ὀργὴ θεοῦ
  choice: 上帝的震怒
  rationale: 保留属格结构及神亲自作出审判性回应的分量；“震怒”比一般的“生气”更庄重。
- source_word: ἀπ’ οὐρανοῦ
  choice: 从天上
  rationale: 直接表达来源。
- source_word: ἐπὶ πᾶσαν ἀσέβειαν καὶ ἀδικίαν
  choice: 临到人的一切不敬虔和不义
  rationale: “临到”自然表达震怒所针对的对象；“不敬虔”保留ἀσέβεια对上帝缺乏敬畏的方向，“不义”保留ἀδικία广泛的道德含义。
- source_word: ἀνθρώπων
  choice: 人的
  rationale: 这里泛指人类，并非专指男性；与后面的关系结构连读自然。
- source_word: τῶν ... κατεχόντων
  choice: 就是那些……压制……的人
  rationale: 用“就是”明确说明后面的分词结构修饰“人”；“压制”符合κατέχω在本语境中阻挡、抑制真理的含义。
- source_word: τὴν ἀλήθειαν
  choice: 真理
  rationale: 直接译出，语境不要求缩窄其含义。
- source_word: ἐν ἀδικίᾳ
  choice: 以不义
  rationale: 可表达手段或方式，即借着不义压制真理；同时用脚注保留“在不义中”这一范围或状态解读。
theological_decisions:
- issue: ὀργὴ θεοῦ是否应弱化为非人格化的道德后果
  choice: 译作“上帝的震怒”，指上帝亲自施行审判的震怒
  alternative: 理解为罪恶自然产生的非人格化后果
  rationale: 属格结构及保罗此处的论述支持上帝亲自作出审判性回应；译文保留这一神学分量而不加以扩展。
- issue: ἐν ἀδικίᾳ表示手段还是所处范围
  choice: 正文译作“以不义”，侧重手段或方式
  alternative: “在不义中”，侧重压制真理时所处的状态或范围
  rationale: 两种理解在语法上都可成立；正文采用较自然的手段义，脚注保留真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“不敬虔”“不义”“震怒”保留保罗论述的神学力度；句法略作汉语化，以“就是那些……”清楚连接ἀνθρώπων与其后的冠词分词结构。
