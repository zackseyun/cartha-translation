  yaml_path: translation/nt/romans/001/014.yaml
  text: I am under obligation both to Greeks and to barbarians[a], both to the wise and to the foolish.
translation:
  language: zh_hans
  text: 我对希腊人和非希腊人[a]，对有智慧的人和愚昧的人，都负有义务。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“外族人”或“蛮族人”。原文是当时与“希腊人”相对的文化称谓，并不一定含有道德上野蛮、残暴的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἕλλησίν
  choice: 希腊人
  rationale: 指希腊文化群体，与下文“非希腊人”构成当时常见的文化分类。
- source_word: βαρβάροις
  choice: 非希腊人
  rationale: 在此是“希腊人”的惯常文化对应语，主要指不讲希腊语或不属于希腊文化的人；译作“非希腊人”可避免现代汉语“野蛮人”所带有的强烈贬义，并用脚注保留其历史措辞。
- source_word: σοφοῖς
  choice: 有智慧的人
  rationale: 直接表达与ἀνοήτοις相对的“智慧”概念，同时保持自然庄重的现代汉语。
- source_word: ἀνοήτοις
  choice: 愚昧的人
  rationale: 保留与“有智慧的人”的鲜明对照，且不将含义缩窄为仅指未受教育的人。
- source_word: ὀφειλέτης
  choice: 负有责任
  rationale: 该名词本义为“欠债者”，此处表达保罗因使命而承担的义务；“负有责任”清楚传达非金钱意义上的责任感。
- source_word: τε ... καὶ / τε ... καὶ
  choice: 无论……还是……／无论……还是……
  rationale: 以两组平衡结构再现希腊文的双重对应，并自然表达保罗对各类人同样负有责任。
theological_decisions: []
translation_notes:
