  text: οἵτινες τὸ δικαίωμα τοῦ θεοῦ ἐπιγνόντες, ὅτι οἱ τὰ τοιαῦτα πράσσοντες ἄξιοι θανάτου εἰσίν, οὐ μόνον αὐτὰ ποιοῦσιν ἀλλὰ καὶ συνευδοκοῦσιν τοῖς πράσσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/032.yaml
  text: who[a], although they know God's righteous decree—that those who practice such things are worthy of death—not only do them but also approve of those who practice them.
translation:
  language: zh_hans
  text: 他们虽然明知神的公正判定[a]——行这类事的人理当受死——却不但自己去做，还赞同那些这样做的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “判定”或译“法令”“要求”或“判决”。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: 这些人
  rationale: 承接上文所说的人，并引出对他们的进一步描述；“这些人”比生硬的关系代词结构更符合现代汉语。
- source_word: τὸ δικαίωμα τοῦ θεοῦ
  choice: 神公正的判定
  rationale: δικαίωμα 在这里带有司法和道德判断的意味，后面的死亡判语进一步说明其内容；“公正的判定”兼顾其正义性质与裁断意味。
- source_word: ἐπιγνόντες
  choice: 虽然明知
  rationale: 分词在语境中具有让步意味；“明知”表达他们确实认识这一判定，同时不把词义过度扩大为某种特殊的完全知识。
- source_word: οἱ τὰ τοιαῦτα πράσσοντες
  choice: 行这类事的人
  rationale: “行这类事”自然表达持续或惯常实行此类行为的意思。
- source_word: ἄξιοι θανάτου
  choice: 理当受死
  rationale: 保留原文司法判语的力度，又避免把“死亡”限定为民事死刑或末世性的死亡。
- source_word: ποιοῦσιν
  choice: 自己去做
  rationale: 忠实表达他们亲自行这些事，并与后文赞同他人的行为形成清楚对比。
- source_word: συνευδοκοῦσιν
  choice: 赞同
  rationale: 该词表示同意、认可或赞许；“赞同”清楚表达其不只是旁观，而是认可别人的行为。
- source_word: τοῖς πράσσουσιν
  choice: 那些这样做的人
  rationale: 自然重现 πράσσω 所指的实行行为，并保持与前文“行这类事的人”的对应。
theological_decisions:
- issue: “理当受死”的范围
  choice: 按原文保留为神所作的司法性判语，不进一步界定“死”的具体范围。
  alternative: 将其明确解释为民事死刑，或明确解释为包括末世死亡。
  rationale: 本节本身没有说明“死”专指哪一种层面；译文保留其分量和开放性，不替文本作进一步限定。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“虽然……却不但……还……”明确呈现原文的让步和递进关系；避免使用容易像日常咒骂的“该死”，改用具有司法色彩的“理当受死”。
