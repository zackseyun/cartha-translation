  text: οὕτως τὸ κατ’ ἐμὲ πρόθυμον καὶ ὑμῖν τοῖς ἐν Ῥώμῃ εὐαγγελίσασθαι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/015.yaml
  text: So[a], for my part, I am eager to proclaim the good news also to you who are in Rome.
translation:
  language: zh_hans
  text: 所以，就我而言，我切望也向你们这些在罗马的人传扬福音[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“宣讲好消息。”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: 所以
  rationale: 在此承接上文并引出保罗的结论和意愿；“所以”是现代汉语中自然、清楚的推论连接词。
- source_word: τὸ κατ’ ἐμὲ πρόθυμον
  choice: 就我而言，我……切望
  rationale: 原文是省略性的名词化表达，意为保罗自身具有热切的意愿。“就我而言”保留 κατ’ ἐμέ 的限定，“切望”则兼顾 πρόθυμον 所含的甘愿与热忱，不仅表示已经准备好。
- source_word: καὶ ὑμῖν
  choice: 也……向你们
  rationale: καί 突出罗马的听众也包括在保罗希望传福音的对象之中；汉语将“也”置于“切望向你们”之前，表达自然并保留其包含意味。
- source_word: τοῖς ἐν Ῥώμῃ
  choice: 你们这些在罗马的人
  rationale: 定冠词加介词短语进一步指明受话者；此译法在现代汉语中清楚、顺畅。
- source_word: εὐαγγελίσασθαι
  choice: 传扬福音
  rationale: 该动词指宣告好消息，即传福音。“传扬福音”既保留基督教语境中的核心词义，又不把行动局限为正式讲道。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留原文省略表达所传达的个人热切意愿，并使“也”明确涵盖罗马的听众。正文中的脚注标记置于句末，脚注提供 εὐαγγελίσασθαι 的词汇性替代译法。
