  text: πάντοτε ἐπὶ τῶν προσευχῶν μου, δεόμενος εἴ πως ἤδη ποτὲ εὐοδωθήσομαι ἐν τῷ θελήματι τοῦ θεοῦ ἐλθεῖν πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/010.yaml
  text: always in my prayers[a], asking whether somehow, at last, by the will of God I may succeed in coming to you.
translation:
  language: zh_hans
  text: 我总是在祷告中恳求：或许如今终于能照着上帝的旨意顺利成行，到你们那里去。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “顺利成行，到你们那里去”也可译作“能成功地到你们那里去”或“有一次顺利的行程，得以到你们那里去”。
    reason: 原文动词可指获得顺遂、成功，也保留“道路顺利、旅程成功”的字面背景。
lexical_decisions:
- source_word: πάντοτε
  choice: 总是
  rationale: 表达持续而经常的祷告习惯，也自然承接上文未完的句法。
- source_word: ἐπὶ τῶν προσευχῶν μου
  choice: 在祷告中
  rationale: 用现代汉语的自然表达传达保罗在祷告时所作的祈求；“我的”在汉语中可由语境明确，不必硬译。
- source_word: δεόμενος
  choice: 恳求
  rationale: 该分词带有迫切祈求的意味；“恳求”比普通的“求”更能保留其力度，又符合祷告语境。
- source_word: εἴ πως
  choice: 或许……能
  rationale: 保留达成愿望的未定性和殷切盼望，避免译成单纯的条件句。
- source_word: ἤδη ποτὲ
  choice: 如今终于
  rationale: 同时体现“现在”和“终于”的意味，传达保罗长久以来盼望成行。
- source_word: εὐοδωθήσομαι
  choice: 顺利地
  rationale: 在“到你们那里去”的语境中表达事情获得顺遂、道路得以通达，不引入现代汉语中偏重财富的“兴旺”含义。
- source_word: ἐν τῷ θελήματι τοῦ θεοῦ
  choice: 照着上帝的旨意
  rationale: 自然表达上帝的旨意是此行得以实现的支配条件，同时不把人与上帝旨意之间的关系解释得过细。
- source_word: ἐλθεῖν πρὸς ὑμᾶς
  choice: 到你们那里去
  rationale: 直接保留“来/去到你们那里”的移动含义，不额外加入“探望”等原文未明说的目的。
theological_decisions:
- issue: 保罗能否成行与上帝旨意的关系
  choice: 照着上帝的旨意
  alternative: 在上帝的旨意中
  rationale: 前者是自然现代汉语，也保留上帝旨意对行程的决定性制约；不进一步断定这里主要表示工具、许可还是范围。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“我总是”承接罗马书1:9的句子结构；使用“恳求”呈现祷告的迫切性，并以“或许如今终于”保留原文中愿望、迟延和不确定性并存的张力。
