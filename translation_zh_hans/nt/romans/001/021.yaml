id: ROM.1.21
reference: Romans 1:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: διότι γνόντες τὸν θεὸν οὐχ ὡς θεὸν ἐδόξασαν ἢ ηὐχαρίστησαν, ἀλλὰ ἐματαιώθησαν ἐν τοῖς διαλογισμοῖς αὐτῶν καὶ ἐσκοτίσθη ἡ ἀσύνετος αὐτῶν καρδία·
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/021.yaml
  text: For although they knew God[a], they did not glorify him as God or give thanks, but they became futile in their thinking[b], and their senseless heart was darkened.
translation:
  language: zh_hans
  text: 因为他们虽然知道神，却没有把他当作神来荣耀，也没有感谢他；反而在自己的思量[a]中变得虚妄，他们那不明事理的心[b]也昏暗了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“推想”、“念头”或“思辨”。
    reason: lexical_alternative
  - marker: b
    text: 原文“心”为单数，在这里集合性地指他们内在的心。
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: 因为
  rationale: 承接上文，为前面的陈述说明缘由，保留原文的逻辑关系。
- source_word: γνόντες τὸν θεόν
  choice: 虽然知道神
  rationale: 结合上下文，将分词理解为让步用法，突出他们虽有对神的认识，却没有作出相称的回应。
- source_word: οὐχ ὡς θεὸν ἐδόξασαν
  choice: 没有把他当作神来荣耀
  rationale: 既保留“荣耀”的神学分量，也明确表达ὡς θεόν所指按神应有的身份和地位对待他。
- source_word: ἢ ηὐχαρίστησαν
  choice: 也没有感谢他
  rationale: 自然表达向神表示感恩的动作；宾语“他”按汉语需要补出。
- source_word: ἐματαιώθησαν
  choice: 变得虚妄
  rationale: 表达思想落入空虚、无效和错误状态的含义，同时不额外指定原文没有明说的施动者。
- source_word: ἐν τοῖς διαλογισμοῖς αὐτῶν
  choice: 他们的思量
  rationale: διαλογισμοί可指推想、念头或思辨；“思量”兼顾思维过程和内在盘算，语体庄重而易懂。
- source_word: ἐσκοτίσθη
  choice: 昏暗了
  rationale: 保留黑暗的比喻及被动含义，描述人在理解和道德判断上的暗昧。
- source_word: ἡ ἀσύνετος αὐτῶν καρδία
  choice: 他们那不明事理的心
  rationale: ἀσύνετος重在缺乏理解和分辨，并非单指智力低下；“心”保留原文单数及其指向内在整体人格的用法。
theological_decisions:
- issue: γνόντες的让步含义
  choice: 虽然知道神
  alternative: 既然知道神／认识神以后
  rationale: 上下文的对比表明重点在于：他们已有对神的认识，却未荣耀或感谢神。译文表达这种让步关系，但不进一步界定这种“知道”在救恩论上的性质。
- issue: ἐματαιώθησαν的被动及施动者
  choice: 变得虚妄
  alternative: 被弄得虚妄
  rationale: 原文采用被动形式但没有点明施动者；中文用状态变化表达，避免擅自断定是神、他们自己或其他力量使其虚妄。
- issue: “心”的单数与集合意义
  choice: 他们那不明事理的心
  alternative: 他们不明事理的心思
  rationale: 保留καρδία的“心”这一圣经人体隐喻，并维持希腊文单数；它在此集合性地描述众人的内在生命。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“把他当作神来荣耀”清楚呈现身份性的ὡς θεόν；“不明事理”比“无感觉”或单纯“愚笨”更贴近缺乏理解与分辨的含义。脚注标记依其实际所释词语分别置于“思量”和“心”之后。
