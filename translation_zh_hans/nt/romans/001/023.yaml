  text: καὶ ἤλλαξαν τὴν δόξαν τοῦ ἀφθάρτου θεοῦ ἐν ὁμοιώματι εἰκόνος φθαρτοῦ ἀνθρώπου καὶ πετεινῶν καὶ τετραπόδων καὶ ἑρπετῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/023.yaml
  text: and exchanged the glory of the imperishable God for the likeness of an image of perishable man and birds and four-footed animals and reptiles[a][b][c][d].
translation:
  language: zh_hans
  text: 又把不朽坏之上帝的荣耀换成了形似会朽坏的人、飞鸟、四足兽和爬虫的偶像[a][b][c][d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不朽坏”也可译作“不受败坏”。
    reason: lexical_alternative
  - marker: b
    text: “形似……的偶像”按字面可译作“仿照……形像的样式”。
    reason: lexical_alternative
  - marker: c
    text: “会朽坏的人”也可译作“必死的人”。
    reason: lexical_alternative
  - marker: d
    text: “爬虫”也可译作“爬行之物”；原词的范围不限于现代动物分类中的爬行动物。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤλλαξαν
  choice: 换成了
  rationale: 表达以一物替代另一物的主动交换，符合本段关于弃绝上帝、转向偶像的语境。
- source_word: δόξαν
  choice: 荣耀
  rationale: 这是该词在保罗书信中的常用对应，也保留上帝的尊荣与受造偶像之间的鲜明对照。
- source_word: ἀφθάρτου
  choice: 不能朽坏
  rationale: 直接表达不受败坏、衰朽支配之意，并与下文 φθαρτοῦ 的“会朽坏”形成词形与意义上的对照。
- source_word: ἐν ὁμοιώματι εἰκόνος
  choice: 形似……的偶像
  rationale: 希腊文叠用“相似、形像”一类词语；此译在现代汉语中自然地保留仿照受造物制作形像的意思，并以脚注交代较贴字面的结构。
- source_word: φθαρτοῦ ἀνθρώπου
  choice: 会朽坏的人
  rationale: 保留与“不能朽坏之上帝”的直接反差；单数 ἀνθρώπου 在这里按类别义译作“人”。
- source_word: πετεινῶν
  choice: 飞鸟
  rationale: 准确、自然地表达鸟类，并保留其会飞的语义色彩。
- source_word: τετραπόδων
  choice: 四足兽
  rationale: 保留“四足”的字面特征，同时比“四足动物”更凝练而庄重。
- source_word: ἑρπετῶν
  choice: 爬虫
  rationale: 简洁表达爬行的生物；脚注说明该词范围可比现代动物分类中的“爬行动物”更广。
theological_decisions:
- issue: 上帝的荣耀与偶像形像之间的交换关系
  choice: 保留“把……换成……”的直接对照
  alternative: 意译为“放弃荣耀，转而敬拜偶像”
  rationale: 原文强调交换和替代，并未在本节明说“敬拜”；直译可避免把上下文含义提前写入本句。
- issue: ἐν ὁμοιώματι εἰκόνος 的形像语言
  choice: 译作“形似……的偶像”并附较直译脚注
  alternative: 译作“……形像的样式”
  rationale: 既传达偶像是仿照受造物的形像，又不对两个近义名词之间略显压缩的关系作过度神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以“不能朽坏／会朽坏”重现希腊文的核心反差；“形似……的偶像”避免生硬重复，同时由脚注保存原文压缩的形像表达。“又把”承接前文句法，不擅自补出主语。
