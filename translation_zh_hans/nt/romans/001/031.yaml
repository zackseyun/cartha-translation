lexical_decisions:
- source_word: ἀσυνέτους
  choice: 不明事理
  rationale: 该词指缺乏理解力或辨别力；“不明事理”表达道德与认知层面的蒙昧，又不至于被误解为单指智力低下。
- source_word: ἀσυνθέτους
  choice: 不守信用
  rationale: 该词指不遵守约定、在承诺关系中不可靠；“不守信用”是自然、明确的现代汉语表达，并在脚注保留“不守约”这一更贴近约定行为的译法。
- source_word: ἀστόργους
  choice: 不顾亲情
  rationale: 该词否定亲人之间自然应有的疼爱与亲情；“不顾亲情”既简洁，又比泛泛的“无情”更清楚地保留家庭关系的含义。
- source_word: ἀνελεήμονας
  choice: 毫无怜悯
  rationale: 该词表示没有怜悯或同情；“毫无怜悯”准确传达其强烈的否定意味，也符合本节罪恶清单的语言节奏。
