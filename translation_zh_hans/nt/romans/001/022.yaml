id: ROM.1.22
reference: Romans 1:22
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: φάσκοντες εἶναι σοφοὶ ἐμωράνθησαν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/022.yaml
  text: Claiming to be wise[a], they became fools[b],
translation:
  language: zh_hans
  text: 他们自称有智慧[a]，反而成了愚昧人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“声称自己有智慧”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“却变得愚昧”。
    reason: lexical_alternative
lexical_decisions:
- source_word: φάσκοντες
  choice: 自称
  rationale: 现在时分词表示他们声称自己具有某种身份或特质；“自称”自然简洁，并保留反讽意味。
- source_word: εἶναι
  choice: 有
  rationale: 与“智慧”搭配译为“有智慧”，自然表达其声称的内容，而不增添原文没有的信息。
- source_word: σοφοὶ
  choice: 有智慧
  rationale: 保留谓语形容词“智慧的”之意；现代汉语用“有智慧”比“是智慧的”更自然。
- source_word: ἐμωράνθησαν
  choice: 成了愚昧人
  rationale: 该动词在此表达进入一种愚昧状态或显为愚昧；“成了愚昧人”保留与“有智慧”之间尖锐的反讽对比，同时不强行判定为神使其愚昧。
theological_decisions:
- issue: ἐμωράνθησαν应译为人格称谓“成了愚昧人”，还是性质描述“变得愚昧”
  choice: 成了愚昧人
  alternative: 变得愚昧；被使成为愚昧
  rationale: 原句的修辞对照尖锐：他们声称有智慧，结果却成了愚昧人。此译保留力度；同时以“成了”传达结果，不将形式上的被动含义明确归因于某一施事者。
- issue: 是否明说其结果与自称相反
  choice: 用“反而”显明语义关系
  alternative: 不用连接词，直译为“他们自称有智慧，却成了愚昧人”
  rationale: 希腊文虽无明写对应词，但分词与主句构成鲜明反讽。“反而”以自然现代汉语表达这一内在关系，未增加新的神学判断。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“自称”传达自我断言；“反而”凸显保罗的反讽；“愚昧人”比单纯“愚昧”更有修辞力度。所有脚注标记均已置于正文对应位置。
