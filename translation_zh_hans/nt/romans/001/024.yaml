source:
  edition: SBLGNT
  text: ⸀Διὸ παρέδωκεν αὐτοὺς ὁ θεὸς ἐν ταῖς ἐπιθυμίαις τῶν καρδιῶν αὐτῶν εἰς ἀκαθαρσίαν τοῦ ἀτιμάζεσθαι τὰ σώματα αὐτῶν ἐν ⸀αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/024.yaml
  text: Therefore God gave them over in the desires of their hearts to impurity[a], for the dishonoring of their bodies among themselves.
translation:
  language: zh_hans
  text: 所以，神任凭他们在自己心里的欲望中陷入污秽，以致他们的身体在他们中间受辱[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在他们中间”或译“在彼此之间”；也可能译“在他们自己身上”。
    reason: 原文ἐν αὐτοῖς结构紧凑，可作群体、相互或反身理解。
lexical_decisions:
- source_word: Διὸ
  choice: 所以
  rationale: 承接上文并标明推论关系；“所以”自然、清楚。
- source_word: παρέδωκεν
  choice: 任凭
  rationale: 表达神将他们交付给某种支配性处境的含义，并保留审判意味；不扩写成“弃绝”或加入系统性解释。
- source_word: ἐν ταῖς ἐπιθυμίαις τῶν καρδιῶν αὐτῶν
  choice: 在自己心里的欲望中
  rationale: 保留ἐν所表达的范围或处境，也保留“心”这一圣经人观用语。
- source_word: ἐπιθυμίαις
  choice: 欲望
  rationale: 该词本身范围较广；“欲望”不预先把含义限定为性欲，尽管下文朝这一方向展开。
- source_word: ἀκαθαρσίαν
  choice: 污秽
  rationale: 自然地表达道德上的不洁，并符合本段语境。
- source_word: τοῦ ἀτιμάζεσθαι
  choice: 以致……受到羞辱
  rationale: 以结果表达法呈现带冠词不定式的作用，使现代汉语通顺，同时保留其后果意味。
- source_word: τὰ σώματα αὐτῶν
  choice: 他们的身体
  rationale: 直接保留原文具体的身体用语及保罗对身体的强调。
- source_word: ἐν αὐτοῖς
  choice: 在彼此之间
  rationale: 按上下文采用相互、群体关系的理解；原短语也可能指“在他们中间”或“在自己身上”，故加脚注保留歧义。
theological_decisions:
- issue: 是否把παρέδωκεν强化为“神在审判中弃绝了他们”
  choice: 任凭
  alternative: 弃绝了他们；以交付他们来审判他们
  rationale: 原文确有神交付人的强烈审判意味，但没有明说完整的教义解释；译文保留其神学张力而不作扩写。
- issue: τοῦ ἀτιμάζεσθαι表达目的还是结果
  choice: 以致……受到羞辱
  alternative: 为要使……受到羞辱；使……受到羞辱
  rationale: 此结构可带目的或结果色彩；结合语境译作自然的结果表达，但不进一步说明行为主体或机制。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“任凭”沿用读者熟悉的圣经表达，但句法按现代汉语调整；脚注明示原文末尾介词短语的真实歧义。
