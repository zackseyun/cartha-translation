id: ROM.1.26
reference: Romans 1:26
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Διὰ τοῦτο παρέδωκεν αὐτοὺς ὁ θεὸς εἰς πάθη ἀτιμίας· αἵ τε γὰρ θήλειαι αὐτῶν μετήλλαξαν τὴν φυσικὴν χρῆσιν εἰς τὴν παρὰ φύσιν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/026.yaml
  text: For this reason God gave them over to dishonorable passions[a], for even their women exchanged natural relations for what is contrary to nature[c][b],
translation:
  language: zh_hans
  text: 因此，上帝任凭他们陷于可耻的情欲；因为连他们当中的女性也把合乎本性的性关系换成违反本性的关系。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: 因此
  rationale: 简洁自然地承接上文，保留该短语的因果和推论作用。
- source_word: παρέδωκεν αὐτοὺς ὁ θεὸς
  choice: 上帝任凭他们陷入
  rationale: “任凭”符合现代汉语圣经语境，也保留上帝将人交付于其所选择之事的审判意味；补入“陷入”使与后面的情欲搭配自然。
- source_word: πάθη ἀτιμίας
  choice: 可耻的欲情
  rationale: 保留ἀτιμία明确的负面评价；“欲情”比单说“欲望”更能表达πάθη所指强烈情欲，同时不增添原文没有的现代分类。
- source_word: αἵ τε γὰρ θήλειαι αὐτῶν
  choice: 他们的女性甚至
  rationale: 用“女性”较贴近θήλειαι，并保留与下一节“男性”的性别配对；τε γὰρ在此自然表达为“甚至”，说明本句是上文的例证。
- source_word: μετήλλαξαν
  choice: 换成了
  rationale: 准确传达主动交换、改换的含义，并与汉语宾语结构自然衔接。
- source_word: τὴν φυσικὴν χρῆσιν
  choice: 合乎本性的性关系
  rationale: χρῆσις字面可指“使用”，但语境具有性关系含义；译出“性关系”使现代读者清楚理解，同时以“合乎本性”保留φυσικός。
- source_word: τὴν παρὰ φύσιν
  choice: 违反本性的关系
  rationale: 保留παρὰ φύσιν的评价性表达，并根据前项补出汉语所需的“关系”，不具体化为原文未明说的行为类别。
theological_decisions:
- issue: 是否强化或淡化保罗的道德评价
  choice: 保留“可耻”和“违反本性”的评价性措辞
  alternative: 改用较弱的“不得体”或加入现代身份、取向和行为分类
  rationale: 原文本身带有明确评价，翻译不应淡化；同时也不应把现代范畴或额外教义解释写入经文。
- issue: φύσις在本节中的具体所指
  choice: 译作“本性”，保留其语义张力
  alternative: 明确解释为生理构造、创造秩序、社会习俗或个人天性
  rationale: 本节没有在句内穷尽界定φύσις；直译为“本性”既忠于原文，也避免替读者预先裁定其完整神学含义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“女性”较“女人”更贴近原文θήλειαι的类别性表述；“性关系”将语境隐含义明确化，但不加入具体行为或现代身份标签。分号保留前后总述与例证的紧密关系。
