source:
  edition: SBLGNT
  text: οὐ θέλω δὲ ὑμᾶς ἀγνοεῖν, ἀδελφοί, ὅτι πολλάκις προεθέμην ἐλθεῖν πρὸς ὑμᾶς, καὶ ἐκωλύθην ἄχρι τοῦ δεῦρο, ἵνα τινὰ καρπὸν σχῶ καὶ ἐν ὑμῖν καθὼς καὶ ἐν τοῖς λοιποῖς ἔθνεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/013.yaml
  text: I do not want you to be unaware[a], brothers, that I have often planned to come to you—but have been prevented until now—so that I might have some fruit among you also[c][b], just as among the rest of the Gentiles.
translation:
  language: zh_hans
  text: 弟兄们[a]，我不愿你们不知道：我屡次计划前往你们那里，却直到如今仍受阻拦，为要也在你们中间得些果子[b]，正如在其余的外邦人中间一样[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄们”在这里是对信徒群体的称呼，可包括弟兄和姊妹。
    reason: lexical_alternative
  - marker: b
    text: “果子”在这里比喻保罗在他们中间服事所产生的成果。
    reason: cultural_note
  - marker: c
    text: 或译“其余各民族的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ θέλω ... ἀγνοεῖν
  choice: 我不愿你们不知道
  rationale: 保留原文否定式表达及保罗惯用的告知公式，同时符合现代汉语习惯，不增添原文没有的“如今”等篇章标记。
- source_word: ἀδελφοί
  choice: 弟兄们
  rationale: 保留阳性复数呼语的传统而自然译法；此称呼在当时可涵盖群体中的男女信徒，另以脚注说明。
- source_word: πολλάκις προεθέμην
  choice: 我屡次计划
  rationale: 表达保罗过去一再定意前往，而“计划”比“立意”更贴近日常现代汉语。
- source_word: ἐκωλύθην ἄχρι τοῦ δεῦρο
  choice: 却直到如今仍受阻拦
  rationale: 体现被动语态所表示的外在阻碍，也传达阻碍延续至说话当下；不擅自说明阻拦者或原因。
- source_word: ἵνα τινὰ καρπὸν σχῶ
  choice: 为要……得些果子
  rationale: 保留 καρπός 的农业隐喻和 τινά 的不定数量，不在正文中将其明确缩窄为某一种事工成果。
- source_word: ἐν ὑμῖν
  choice: 在你们中间
  rationale: 此处指保罗与罗马信徒群体相关的成果；“在你们中间”自然，也避免把介词短语过度解释为信徒内在状态。
- source_word: τοῖς λοιποῖς ἔθνεσιν
  choice: 其余的外族人
  rationale: 在保罗向非犹太人传道的语境中，ἔθνη 较可能指犹太人以外的各族人；“其余”保留罗马受众也属于这一更广群体的含意。
theological_decisions:
- issue: καρπός 所指的具体成果
  choice: 正文保留“果子”的隐喻
  alternative: 收获／事工成果／归信者
  rationale: 原文本身没有把果子明确限定为归信人数、信徒成长或经济支持；保留隐喻可保存其语义开放性，并在脚注作最低限度说明。
- issue: ἔθνη 的群体指向
  choice: 外族人
  alternative: 列国／其他民族／外邦人
  rationale: 上下文涉及保罗在罗马及其他非犹太群体中的使命，“外族人”能表达相对于犹太人的族群含义，同时避免“外邦人”在现代汉语中可能带来的贬义或宗派色彩。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“我不愿你们不知道”保留原文句式；用冒号展开其内容，用逗号呈现受阻与目的之间的关系。正文不增补阻拦的原因，也不把“果子”具体化，以保存原文的张力与开放性。
