  text: περὶ τοῦ υἱοῦ αὐτοῦ, τοῦ γενομένου ἐκ σπέρματος Δαυὶδ κατὰ σάρκα,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/003.yaml
  text: concerning his Son[a], who was descended from the offspring of David according to the flesh[b],
translation:
  language: zh_hans
  text: 论到他的儿子：按肉身[b]说，他出自大卫的后代[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“出自大卫的后裔”；“后代”原文直译为“种子”。
    reason: lexical_alternative
  - marker: b
    text: 这里的“按肉身”是指人的血统或在世的出身，并不是指罪性。
    reason: cultural_note
lexical_decisions:
- source_word: περὶ
  choice: 论到
  rationale: 承接上一节，说明福音的内容所关乎的对象；“论到”既保留书信语体的庄重，也符合现代汉语表达。
- source_word: τοῦ υἱοῦ αὐτοῦ
  choice: 他的儿子
  rationale: 直译所有关系，所指是神的儿子；汉语正文无需借助英文式大小写来标示其身份。
- source_word: τοῦ γενομένου
  choice: 他出自
  rationale: γίνομαι在这里表示来源或出身。“出自”保留其动态意味，又不把经文压缩成单纯的族谱身份陈述。
- source_word: ἐκ σπέρματος Δαυὶδ
  choice: 大卫的后代
  rationale: σπέρμα字面为“种子”，在此指大卫的后裔或血统；“后代”是现代汉语中自然清楚的表达，同时以脚注保留字面译法。
- source_word: κατὰ σάρκα
  choice: 按肉身说
  rationale: 保留σάρξ的神学分量和保罗式表达，并用“说”使汉语自然；此处指人的血统或尘世出身，而非罪性。
theological_decisions:
- issue: 如何同时表达神子身份与大卫血统
  choice: 保留“他的儿子”与“按肉身说，他出自大卫的后代”这两个并列要素
  alternative: 解释为“就他的人性而言，他是大卫的后裔”
  rationale: 原文把儿子身份与真实的大卫家系并置，却没有进一步说明二者的形而上关系；译文不以较晚的教义术语消解这种张力。
- issue: 如何理解“按肉身”
  choice: 正文直译为“按肉身说”，脚注说明其语境含义
  alternative: 正文直接译为“按人的血统说”
  rationale: 直译保留σάρξ可能具有的语义和神学张力，同时脚注避免读者误以为这里在说罪性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。冒号体现本句对上一节“福音”内容的展开；正文保留原文紧凑结构及“肉身”的神学张力。
