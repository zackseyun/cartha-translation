reference: Romans 1:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: τὰ γὰρ ἀόρατα αὐτοῦ ἀπὸ κτίσεως κόσμου τοῖς ποιήμασιν νοούμενα καθορᾶται, ἥ τε ἀΐδιος αὐτοῦ δύναμις καὶ θειότης, εἰς τὸ εἶναι αὐτοὺς ἀναπολογήτους,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/020.yaml
  text: For his invisible attributes[a], that is, his eternal power and divinity, have been clearly seen since the creation of the world, being understood through what has been made[b], so that they are without excuse.
translation:
  language: zh_hans
  text: 因为，自从世界受造以来，他看不见的特性[a]，就是他永恒的大能和神性[b]，借着所造之物被人领悟，便清楚可见，以致他们无可推诿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他看不见的特质”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“神圣本质”。这里的希腊词是θειότης，所指侧重神圣的性质，与较强的θεότης一词有别。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἀόρατα αὐτοῦ
  choice: 他那些看不见的特性
  rationale: 中性复数泛指上帝身上肉眼不可见、却可由受造界认识的方面。“特性”自然清楚，同时用脚注保留“特质”这一近义译法。
- source_word: ἀπὸ κτίσεως κόσμου
  choice: 自从创造世界以来
  rationale: 将ἀπό理解为时间起点，表示这种显明从世界受造之时一直成立。
- source_word: τοῖς ποιήμασιν
  choice: 借着所造之物
  rationale: 将与格译为工具或途径，表明受造之物是人认识上帝不可见特性的媒介。
- source_word: νοούμενα
  choice: 被人领悟
  rationale: 保留该分词所表达的心智认识，不把它弱化为单纯的感官观看；补出“人”符合汉语被动表达。
- source_word: καθορᾶται
  choice: 便清楚可见
  rationale: “清楚”体现动词的加强意味；“可见”与前文“看不见”形成原文刻意保留的张力。
- source_word: ἥ τε ἀΐδιος αὐτοῦ δύναμις καὶ θειότης
  choice: 就是他永恒的大能和神性
  rationale: “就是”表明这两项是对“看不见的特性”的具体说明；“永恒的大能”庄重自然，“神性”则避免把θειότης过度强化为更明确的本体论术语。
- source_word: εἰς τὸ εἶναι αὐτοὺς ἀναπολογήτους
  choice: 以致他们无可推诿
  rationale: 按结果关系翻译εἰς τό结构；“无可推诿”准确表达无法为自己申辩或开脱。
theological_decisions:
- issue: 如何翻译θειότης而不过度强化保罗的措辞
  choice: 神性
  alternative: 神圣本质；神格
  rationale: θειότης指向神圣的性质或神性。“神性”既确认受造界真实显明上帝的神圣实在，又不与较强的θεότης完全等同。
- issue: 如何呈现不可见之事却清楚可见的张力
  choice: 看不见的特性……被人领悟，便清楚可见
  alternative: 看不见的特性……可以清楚认识
  rationale: 原文同时使用“不可见”与“清楚看见”，并以“领悟”说明其方式；所选译法保留这一修辞和认识论张力，而不将两者合并消解。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。句法尽量贴近原文的论证次序，同时以“借着……被人领悟，便……”使长句在汉语中清晰顺畅；保留“看不见”与“清楚可见”之间的有意张力。
