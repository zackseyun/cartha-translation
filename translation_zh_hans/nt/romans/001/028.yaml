id: ROM.1.28
reference: Romans 1:28
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ καθὼς οὐκ ἐδοκίμασαν τὸν θεὸν ἔχειν ἐν ἐπιγνώσει, παρέδωκεν αὐτοὺς ὁ θεὸς εἰς ἀδόκιμον νοῦν, ποιεῖν τὰ μὴ καθήκοντα,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/028.yaml
  text: And just as they did not see fit to have God in their knowledge[a], God gave them over to a debased mind, to do what is not fitting[b],
translation:
  language: zh_hans
  text: 他们既然不以认识神为可取[a]，神就任凭他们存着不合格的心思[b]，去做那些不合宜的事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把神保留在自己的认知中”。
    reason: 原文ἔχειν ἐν ἐπιγνώσει直译近于“在认识中有神”，既可概括为“认识神”，也可理解为不愿继续把神保留在认知之中。
  - marker: b
    text: “不合格”所译的词，与前面的“以……为可取”在原文中词根相关；也可译作“败坏的心思”。
    reason: 说明ἐδοκίμασαν与ἀδόκιμον之间的文字呼应，并保留后者在本语境中可表达道德败坏的译法。
lexical_decisions:
- source_word: καθὼς
  choice: 既然
  rationale: 此处既有与前文相应的意味，也引出神任凭他们的缘由；“既然”在现代汉语中自然表达语境中的因果力量。
- source_word: οὐκ ἐδοκίμασαν
  choice: 不以……为可取
  rationale: δοκιμάζω在此指经过衡量后认可、赞同；“不以……为可取”既表达主动拒绝，也可与后面的ἀδόκιμον形成用词呼应。
- source_word: τὸν θεὸν ἔχειν ἐν ἐπιγνώσει
  choice: 认识神
  rationale: 原文直译近于“在认识中有神”。“认识神”以自然简洁的汉语表达认知和承认的含义；“把神保留在自己的认知中”这一较具象的理解收入脚注。
- source_word: παρέδωκεν αὐτοὺς ὁ θεὸς
  choice: 神就任凭他们
  rationale: παραδίδωμι在本段反复出现，带有神在审判中将人交付其选择后果的意味；“任凭”是自然、凝练且不过度阐释的汉语表达。
- source_word: ἀδόκιμον νοῦν
  choice: 不合格的心思
  rationale: ἀδόκιμος指经不起检验、不获认可。“不合格”保留与前文“以……为可取”的评判性呼应，又避免采用带有后期教义色彩的“邪僻”或“败坏”。νοῦς在此指人的思想、判断和道德认知能力，译作“心思”较自然。
- source_word: ποιεῖν τὰ μὴ καθήκοντα
  choice: 去做那些不合宜的事
  rationale: 保留不定式所表达的结果或趋向，不强行限定为单一语法关系；“不合宜”准确表达καθήκω所指的不适当、不应当。
theological_decisions:
- issue: 如何表达神“交出／任凭”人而不消解神的审判行动与人的责任之间的张力
  choice: 神就任凭他们
  alternative: 神就把他们交给
  rationale: “任凭”清楚呈现神的司法性行动，同时没有补入原文未明说的因果机制，也不把人的责任淡化为纯粹被动。
- issue: 是否把ἀδόκιμον νοῦν强化为固定神学术语
  choice: 不合格的心思
  alternative: 败坏的心思；邪僻的心；被弃绝的心思
  rationale: 原词首先表示未通过检验或不获认可。所选译法保留保罗与ἐδοκίμασαν之间的词义呼应，不额外引入“全然败坏”或“被弃绝”等体系化含义。
- issue: ἔχειν ἐν ἐπιγνώσει是一般的“认识／承认”，还是持续“保留在认知中”
  choice: 正文译“认识神”
  alternative: 把神保留在自己的认知中
  rationale: 原短语允许较具象的“保有／保留”理解，也在语境中涉及对神的承认。正文采用自然汉语，脚注保留较贴近形式的另一可能。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“心思”比“理性”更能涵盖νοῦς在此处的思想、判断与道德认知；全句保留原文由人的拒绝转向神之任凭、再转向行为结果的推进。
