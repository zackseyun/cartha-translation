id: ROM.1.4
reference: Romans 1:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: τοῦ ὁρισθέντος υἱοῦ θεοῦ ἐν δυνάμει κατὰ πνεῦμα ἁγιωσύνης ἐξ ἀναστάσεως νεκρῶν, Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/004.yaml
  text: and who was declared to be the Son of God in power according to the Spirit of holiness by the resurrection from the dead—Jesus the Messiah our Lord[b][a],
translation:
  language: zh_hans
  text: 按圣洁之灵说[b]，他因从死人中复活，被确立为大有能力的上帝之子[a]——耶稣弥赛亚，我们的主。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被确立为”也可译作“被宣告为”或“被指定为”。
    reason: lexical_alternative
  - marker: b
    text: “按圣洁之灵说”也可译作“按圣灵说”。
    reason: alternative_reading
lexical_decisions:
- source_word: ὁρισθέντος
  choice: 被确立为
  rationale: ὁρίζω可指确定、指定或确立。“被确立为”保留其正式而有力的语义，也不直接断定这里只是公开宣告；主要替代译法收入脚注。
- source_word: υἱοῦ θεοῦ ἐν δυνάμει
  choice: 大有能力的上帝之子
  rationale: 将ἐν δυνάμει与“上帝之子”的身份表述紧密相连，表达复活后以能力彰显的状态，同时保留原文可能的句法张力。
- source_word: κατὰ πνεῦμα ἁγιωσύνης
  choice: 按圣洁之灵说
  rationale: “圣洁之灵”贴近原文罕见的属格结构，避免直接将其无歧义地等同于通常所说的“圣灵”；“按……说”也与上一节“按肉身说”的对照自然衔接。
- source_word: ἐξ ἀναστάσεως νεκρῶν
  choice: 因从死人中复活
  rationale: “因”表达ἐξ在此所指的根据或契机；“从死人中复活”是自然且贴近原文的汉语表达。
- source_word: Ἰησοῦ Χριστοῦ
  choice: 耶稣弥赛亚
  rationale: Χριστός在这里保留其称号意义，译作“弥赛亚”，不把它仅当作姓名的一部分。
- source_word: κυρίου ἡμῶν
  choice: 我们的主
  rationale: “主”保留κύριος在保罗书信中的基督论与圣经传统意涵。
theological_decisions:
- issue: ὁρισθέντος是否表示耶稣直到复活时才成为上帝的儿子
  choice: 译作“被确立为大有能力的上帝之子”，保留复活与其有能力的儿子身份之彰显或确立之间的联系，却不说明他此前不是上帝的儿子。
  alternative: “被宣告为大有能力的上帝之子”或“被指定为大有能力的上帝之子”
  rationale: 原文可以指确定、指定或公开显明。正文不以解释性增补消除其张力，脚注则列出主要词义可能。
- issue: πνεῦμα ἁγιωσύνης是否专指圣灵
  choice: 正文译作“圣洁之灵”，让所指保持一定开放性。
  alternative: “按圣灵说”或“按他圣洁的灵说”
  rationale: 该短语不同于新约通常表示“圣灵”的措辞，并与上一节“按肉身说”形成对照；直译较能保存原文的特殊表达与歧义。
translation_notes:
  register: 采用庄重而现代的标准普通话。“圣洁之灵”有意保留原文较罕见的表达；破折号引出“我们的主耶稣弥赛亚”，使这个长句片段在汉语中清楚可读。脚注标记分别紧跟相关措辞或置于句末，正文中均有对应标记。
