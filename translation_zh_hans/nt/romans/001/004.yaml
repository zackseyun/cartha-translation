  to: 按圣洁之灵说[b]，他因从死人中复活，被确立为大有能力的上帝之子[a]——耶稣弥赛亚，我们的主。
  rationale: 调整脚注b至其所说明的“按圣洁之灵说”之后，解决锚点错位；删去“他就是”，使破折号后的名称和称号保持原文的同位语功能。其余主要译词维持原稿，以保存原文关于“确立／宣告”、圣洁之灵的所指，以及“以能力”的句法关联所留下的张力。
