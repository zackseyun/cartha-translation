  text: Οὐ γὰρ ἐπαισχύνομαι τὸ ⸀εὐαγγέλιον, δύναμις γὰρ θεοῦ ἐστιν εἰς σωτηρίαν παντὶ τῷ πιστεύοντι, Ἰουδαίῳ τε πρῶτον καὶ Ἕλληνι·
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/016.yaml
  text: For I am not ashamed of the good news[a], for it is the power of God for salvation to everyone who believes[b], to the Jew first and also to the Greek.
translation:
  language: zh_hans
  text: 因为我不以福音[a]为耻；这福音是神的大能，要使每一个相信的人得救，先是犹太人，也给希腊人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “福音”意为“好消息”。
    reason: lexical_alternative
  - marker: b
    text: 这里的“希腊人”也可较广泛地指外邦人，即非犹太人。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαισχύνομαι
  choice: 不以……为耻
  rationale: 准确表达因羞耻而退缩的含义，也以自然、庄重的现代汉语保留保罗公开而坚定的态度。
- source_word: εὐαγγέλιον
  choice: 福音
  rationale: “福音”在现代汉语基督教语境中自然、庄重，并保留“好消息”的基本词义；脚注说明其直观含义。
- source_word: δύναμις
  choice: 大能
  rationale: “大能”自然表达神施行拯救的有效能力，也符合本节庄重的语体。
- source_word: εἰς σωτηρίαν
  choice: 要使……得救
  rationale: 以自然汉语表达 εἰς 的目标或结果指向，同时清楚传达 σωτηρία 的拯救含义。
- source_word: παντὶ τῷ πιστεύοντι
  choice: 每一个相信的人
  rationale: 保留 παντί 的逐一涵盖范围和 πιστεύοντι 的动词性，不把原文抽象化为某一固定群体称谓。
- source_word: Ἰουδαίῳ
  choice: 犹太人
  rationale: 在与 Ἕλληνι 的救恩历史性对举中，民族及宗教身份意义的“犹太人”比地理性的“犹太地区的人”更合适。
- source_word: πρῶτον
  choice: 先是
  rationale: 简洁保留原文的先后次序，不额外解释这种优先性的性质。
- source_word: Ἕλληνι
  choice: 希腊人
  rationale: 主文保留希腊词的直接族群称谓；其在保罗语境中可能泛指非犹太人的较广含义放入脚注。
- source_word: τε ... καί
  choice: 也包括
  rationale: 自然表达在“先是犹太人”之后的增补关系，同时不暗示希腊人仅是附带或次等的救恩对象。
theological_decisions:
- issue: Ἕλληνι 在“先是犹太人，也包括希腊人”中的范围
  choice: 主文译作“希腊人”，脚注说明可泛指非犹太人
  alternative: 主文直接译作“外族人”或“非犹太人”
  rationale: 这样既忠实保留原文实际使用的族群名称，也承认该词在保罗书信中常可代表更广泛的非犹太世界，避免在主文中消除历史文化上的张力。
- issue: πρῶτον 所表达的犹太人之“先”
  choice: 保留“先是”，不在正文解释其性质
  alternative: 解释为时间上的首先、救恩历史中的优先，或地位上的优先
  rationale: 原文本身只明确给出次序，并未在本节界定这种“先”的全部含义；直译可保留其神学张力，避免添加特定教义解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“不以……为耻”和“神的大能”保留经文的公开宣告感；以“要使……得救”自然呈现神的大能与拯救之间的目标关系。分号对应原文两项理由之间的紧密推进。
