reference: Romans 1:27
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁμοίως τε καὶ οἱ ἄρσενες ἀφέντες τὴν φυσικὴν χρῆσιν τῆς θηλείας ἐξεκαύθησαν ἐν τῇ ὀρέξει αὐτῶν εἰς ἀλλήλους, ἄρσενες ἐν ἄρσεσιν τὴν ἀσχημοσύνην κατεργαζόμενοι καὶ τὴν ἀντιμισθίαν ἣν ἔδει τῆς πλάνης αὐτῶν ἐν ⸀ἑαυτοῖς ἀπολαμβάνοντες.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/027.yaml
  text: And likewise the males[a], having abandoned the natural use of the female, were inflamed in their desire for one another[d][c][b], males with males committing indecency and receiving in themselves the due penalty for their error.
translation:
  language: zh_hans
  text: 同样，男人也弃绝了与女人合乎本性的交合，因对彼此的欲望而欲火中烧；男人和男人行可耻的事，并在自己身上承受他们的错误所应得的报应[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “报应”也可译作“相应的报偿”；原文没有说明这种报应具体是什么。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρσενες / θηλείας
  choice: 男人 / 女人
  rationale: 希腊文采用明确标示生理性别的词。现代汉语若直译为“雄性/雌性”会显得像在描述动物，因此用“男人/女人”自然地保留性别对照，同时不加入婚姻或其他关系含义。
- source_word: ἀφέντες
  choice: 弃绝了
  rationale: 分词表示先于主要动词发生的行动；“弃绝了”保留离开、舍弃之意及较强语气。
- source_word: φυσικὴν χρῆσιν τῆς θηλείας
  choice: 与女人合乎本性的交合
  rationale: χρῆσις本义涉及“使用”，但在此语境中指性方面的交合；这样译既传达性含义，也避免生硬且可能物化的“使用女人”。
- source_word: ἐξεκαύθησαν ἐν τῇ ὀρέξει αὐτῶν
  choice: 彼此欲火中烧
  rationale: 保留ἐξεκαύθησαν的燃烧意象，并以现代汉语惯用表达传达强烈欲望。
- source_word: ἄρσενες ἐν ἄρσεσιν
  choice: 男人和男人
  rationale: 保留希腊文重复性别词所形成的修辞强调。
- source_word: τὴν ἀσχημοσύνην κατεργαζόμενοι
  choice: 行可耻的事
  rationale: 准确保留ἀσχημοσύνη的羞耻与道德评价，同时不把行为进一步具体化到原文没有明说的程度。
- source_word: τὴν ἀντιμισθίαν ἣν ἔδει
  choice: 所应得的报应
  rationale: ἀντιμισθία指相应的回报或报偿，ἔδει表达应当、必然或合宜；“所应得的报应”在上下文中自然传达二者。
- source_word: τῆς πλάνης αὐτῶν
  choice: 他们的迷误
  rationale: πλάνη可指偏离、错误或迷惑；“迷误”保留偏离正道与错误两层意味，未限定其究竟是受骗还是主动犯错。
- source_word: ἐν ἑαυτοῖς ἀπολαμβάνοντες
  choice: 在自己身上承受
  rationale: 保留反身表达，且不解释报应具体以何种方式临到。
theological_decisions:
- issue: 是否把生理性别词译成关系性或分类性术语
  choice: 男人……女人……男人和男人
  alternative: 男性……女性……男性和男性
  rationale: 原文确实突出性别对照，但“男性/女性”在中文句中较抽象，“雄性/雌性”又不适用于庄重的人类叙述；“男人/女人”兼顾原意与自然表达。
- issue: 如何表达φυσικὴν χρῆσιν而不把隐含意义过度说透
  choice: 与女人合乎本性的交合
  alternative: 对女人合乎本性的使用
  rationale: 直译“使用”在现代汉语中生硬且容易产生原文未必着重的物化语感；“交合”明确上下文中的性含义，但没有添加婚姻等关系限定。
- issue: 是否明确“报应”的具体内容
  choice: 在自己身上承受……报应
  alternative: 在身体上受到惩罚
  rationale: 原文没有说明报应的具体性质；保留“在自己身上”的开放性，避免把它限定为身体疾病、社会后果或末世审判。
- issue: 是否使用现代身份标签
  choice: 不使用身份标签，只描述原文所述行为
  alternative: 进行同性恋行为
  rationale: 原文用性别对照和行为描述，并未采用现代性取向或身份类别；译文不额外引入这些概念。
translation_notes:
  register: 采用现代、庄重而可读的书面普通话。用“交合”清楚传达语境中的性含义；用“可耻的事”“迷误”“报应”保留原文的道德力度，却不添加现代身份术语，也不界定报应的具体形式。
