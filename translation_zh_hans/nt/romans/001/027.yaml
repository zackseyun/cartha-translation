  naturalness: 整体庄重通顺；“与女人合乎本性的交合”可理解，但语序略拗。“他们因对彼此的欲望而欲火中烧”更清晰自然，也保留燃烧意象。“错误”比“迷误”更合乎现代标准汉语。
  terminology: “男人／女人”在面向人的中文经文中自然，能保留原文的性别标记，毋须改为带动物色彩的“雄性／雌性”。“交合”“可耻的事”“报应”均适合庄重语域；脚注应紧邻“报应”一词。
