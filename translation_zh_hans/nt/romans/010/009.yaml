id: ROM.10.9
reference: Romans 10:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὅτι ἐὰν ⸀ὁμολογήσῃς ἐν τῷ στόματί ⸀σου κύριον Ἰησοῦν, καὶ πιστεύσῃς ἐν τῇ καρδίᾳ σου ὅτι ὁ θεὸς αὐτὸν ἤγειρεν ἐκ νεκρῶν, σωθήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/009.yaml
  text: because if you confess with your mouth that Jesus is Lord[a], and believe in your heart that God raised him from the dead, you will be saved.
translation:
  language: zh_hans
  text: 因为你若口里承认耶稣是主[a]，心里相信上帝使他从死人中复活，就必得救。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“承认耶稣为主。”
    reason: 希腊语κύριον Ἰησοῦν可用较紧凑的表语结构来表达；主文则明确写出所承认的内容。
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 在上下文中引出对前一句的解释或根据；译作“因为”保留其因果作用。
- source_word: ἐὰν
  choice: 若
  rationale: 与虚拟语气动词构成条件句；“若”简洁、庄重，也符合现代书面汉语。
- source_word: ὁμολογήσῃς ἐν τῷ στόματί σου
  choice: 亲口承认
  rationale: “亲口”自然表达以口公开说出的方式，“承认”保留公开认信、确认其为真的语义，又避免“口里承认”的生硬。
- source_word: κύριον Ἰησοῦν
  choice: 耶稣是主
  rationale: 将宾语和表语关系明确表达为认信的内容，保留κύριος作为尊称“主”，而不把短语误作固定称号“主耶稣”。
- source_word: πιστεύσῃς ἐν τῇ καρδίᾳ σου
  choice: 心里相信
  rationale: 保留内在确信的圣经人论表达，同时符合自然现代汉语。
- source_word: ὁ θεὸς αὐτὸν ἤγειρεν
  choice: 上帝使他……复活
  rationale: 准确表达上帝使耶稣复活这一及物结构；不把简单过去事件额外解释为完成体。
- source_word: ἐκ νεκρῶν
  choice: 从死人中
  rationale: 较直接地保留“从死者当中”的复数含义；与“复活”连用在汉语中清楚可懂。
- source_word: σωθήσῃ
  choice: 就必得救
  rationale: 表达条件句结果中的将来确定性，并保留保罗语境下明确的救恩含义。
theological_decisions:
- issue: κύριος在认信公式中的译法
  choice: 主
  alternative: 主人
  rationale: “主”既表达权柄，也保留本段与经文引用背景的强烈呼应；“主人”会把意义收窄为一般的人身支配关系。
- issue: κύριον Ἰησοῦν的句法表达
  choice: 承认耶稣是主
  alternative: 承认耶稣为主
  rationale: 主文明确呈现所承认的命题内容，同时用脚注保留更紧凑且同样可能的汉语表达，不将希腊语含义锁定为固定复合称号。
- issue: σωθήσῃ的救恩含义
  choice: 必得救
  alternative: 必蒙拯救
  rationale: “得救”在此救恩语境中准确而自然；不添加得救的范围、过程或教派性条件。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“亲口承认”与“心里相信”形成自然对举；保留“因为”以连接上文，并以“若……就必……”清楚呈现条件与结果。
