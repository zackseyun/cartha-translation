  text: ἀλλὰ τί λέγει; Ἐγγύς σου τὸ ῥῆμά ἐστιν, ἐν τῷ στόματί σου καὶ ἐν τῇ καρδίᾳ σου, τοῦτ’ ἔστιν τὸ ῥῆμα τῆς πίστεως ὃ κηρύσσομεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/008.yaml
  text: But what does it say? “The word is near you[a], in your mouth and in your heart” — that is[b], the word of faith that we proclaim.
translation:
  language: zh_hans
  text: 但它怎么说呢？“这话离你很近，就在你口中，在你心里。”[a]这就是我们所宣讲的信心之道。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里呼应《申命记》30:14；保罗把那里的话应用于他所宣讲的信息。
    reason: cross_reference
  - marker: b
    text: “信心之道”也可译作“关于信心的信息”或“信的信息”。这里的希腊文πίστις在某些语境中也可译作“信靠”或“信实”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: 但
  rationale: 承接上文形成转折，简洁自然。
- source_word: τί λέγει
  choice: 它怎么说呢？
  rationale: 保留希腊文未明说主语所指的表达；上下文表明是经文在说话，但正文不额外补入“圣经”。
- source_word: Ἐγγύς σου τὸ ῥῆμά ἐστιν
  choice: 这话离你很近
  rationale: “话”保留ῥῆμα与后文重复所形成的衔接；“离你很近”自然传达ἐγγύς σου。
- source_word: ἐν τῷ στόματί σου καὶ ἐν τῇ καρδίᾳ σου
  choice: 就在你口中，在你心里
  rationale: 保留申命记引文中的身体意象，并以“就”体现贴近、可及的语气。
- source_word: τοῦτ’ ἔστιν
  choice: 这就是
  rationale: 清楚引出保罗对引文中“这话”的说明。
- source_word: τὸ ῥῆμα τῆς πίστεως
  choice: 信心之道
  rationale: “道”在此自然表达所宣讲的信息，也与前面的“话”保持语义联系；“信心”保留属格关系的简洁与一定开放性。
- source_word: ὃ κηρύσσομεν
  choice: 我们所宣讲的
  rationale: “宣讲”体现κηρύσσω公开传扬、宣告的含义，且符合庄重的现代汉语。
theological_decisions:
- issue: τὸ ῥῆμα τῆς πίστεως中πίστις的理解
  choice: 信心之道
  alternative: 关于信的道／使人信的福音信息／信实之道
  rationale: πίστις在此可涉及信、信靠，也可能描述这信息的内容或特征。正文用“信心之道”保留希腊文属格结构的张力，不把它限定为单一关系；脚注提示可理解为“信的信息”。
- issue: 申命记30:14引文的应用
  choice: 在正文中保留引文，随后按原文以“这就是”说明
  alternative: 直接把引文改写为福音信息
  rationale: 保留保罗先引用、再应用的论证结构，避免把解释提前写进引文本身。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“口中”“心里”保留经文意象；“信心之道”兼顾中文圣经语感与原文的紧凑表达。所有脚注标记均置于相关正文之后。
