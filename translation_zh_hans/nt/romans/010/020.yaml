  text: Ἠσαΐας δὲ ἀποτολμᾷ καὶ λέγει· Εὑρέθην ⸀ἐν τοῖς ἐμὲ μὴ ζητοῦσιν, ἐμφανὴς ⸀ἐγενόμην τοῖς ἐμὲ μὴ ἐπερωτῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/020.yaml
  text: But Isaiah is very bold and says[a], “I was found by those who were not seeking me[b]; I became manifest to those who were not asking for me.”
translation:
  language: zh_hans
  text: 以赛亚却放胆说：“我被那些不寻求我的人找到了[a]；我向那些不求问我的人显现了[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我在那些不寻求我的人中间被找到了。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“我使那些不求问我的人认识了我。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποτολμᾷ
  choice: 更是放胆说
  rationale: 该动词表示敢于直言、放胆表达；“更是放胆说”既体现语气的加强，也自然引出以赛亚这句令人惊讶的话。
- source_word: Εὑρέθην
  choice: 我被……找到了
  rationale: 保留简单过去时被动语态和引文中上帝的第一人称自称，不改写为主动的自我启示。
- source_word: ἐν τοῖς ἐμὲ μὴ ζητοῦσιν
  choice: 被那些不寻求我的人
  rationale: 此处ἐν与被动式连用，可按施事关系自然译为“被那些……的人”；更贴近介词字面的“在……中间”列入脚注。
- source_word: ζητοῦσιν
  choice: 寻求
  rationale: “寻求”准确保留ζητέω在经文语境中的郑重意味，并与下句“求问”形成平行。
- source_word: ἐμφανὴς ἐγενόμην
  choice: 我向……显现了
  rationale: “显现”自然、庄重地表达“成为明显可见”的含义，同时不把原文直接解释成使人获得内在认识。
- source_word: ἐπερωτῶσιν
  choice: 求问我
  rationale: 该词在此表示询问、求问；避免译成“呼求”，以免引入原词未明确表达的特定神学含义。
- source_word: δὲ
  choice: 而
  rationale: “而”承接并对照上文的论证，符合现代汉语经文叙述的语体。
- source_word: Ἠσαΐας
  choice: 以赛亚
  rationale: 采用现代中文圣经传统中通行的人名译法。
theological_decisions:
- issue: 以赛亚引文中上帝自我显现的表达
  choice: 我向那些不求问我的人显现了
  alternative: 我使那些不求问我的人认识了我
  rationale: 原文强调上帝成为可见、明显，并未明确使用反身使役结构；正文保留这种形式及其神学张力，较具解释性的说法置于脚注。
- issue: “被找到”与介词ἐν的关系
  choice: 我被那些不寻求我的人找到了
  alternative: 我在那些不寻求我的人中间被找到了
  rationale: 正文采用自然汉语表达被动句的施事者，同时通过脚注保留ἐν可能具有的“在……中间”含义，不将其悄然排除。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“放胆”“寻求”“求问”“显现”保留经文语体，但不使用生僻文言。正文维持两句平行结构，并保留被动式与神显用语的张力。
