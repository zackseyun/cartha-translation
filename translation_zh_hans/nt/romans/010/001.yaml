  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ἀδελφοί, ἡ μὲν εὐδοκία τῆς ἐμῆς καρδίας καὶ ἡ ⸀δέησις πρὸς τὸν θεὸν ὑπὲρ ⸀αὐτῶν εἰς σωτηρίαν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/001.yaml
  text: Brothers[a], the desire of my heart and my prayer to God for them is for their salvation.
translation:
  language: zh_hans
  text: 弟兄们[a]，我心里所愿的和我为他们向神所作的祈求，都是要他们得救。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“弟兄姊妹们”；希腊文采用阳性复数形式，也可用来称呼男女都有的群体。
    reason: 说明原文阳性复数称呼在此可能具有包容性。
lexical_decisions:
- source_word: Ἀδελφοί
  choice: 弟兄们
  rationale: 这是ἀδελφός的阳性复数呼格。正文保留原文的阳性称呼形式；在会众语境中可能包括女性，另以脚注说明。
- source_word: εὐδοκία
  choice: 所愿的
  rationale: 此处指保罗内心所渴望、所盼望的事，并非抽象的“美意”或“喜悦”；“我心里所愿的”自然且贴合上下文。
- source_word: τῆς ἐμῆς καρδίας
  choice: 我心里
  rationale: 以现代汉语自然表达原文“我心的”这一属格关系，同时保留愿望发自内心的含义。
- source_word: δέησις
  choice: 所求的
  rationale: δέησις侧重恳切的祈求；与“向神”搭配时，“所求的”既简洁自然，也比泛称“祷告”更能体现请求的语义。
- source_word: πρὸς τὸν θεόν
  choice: 向神
  rationale: πρός加宾格在此表示祈求所指向的对象，“向神”符合现代汉语表达。
- source_word: ὑπὲρ αὐτῶν
  choice: 为他们
  rationale: ὑπέρ在此表示为了某人的益处或代表某人；“为他们”准确而简洁。
- source_word: αὐτῶν
  choice: 他们
  rationale: 原文使用代词，其所指由前文以色列人的语境确定；正文照原文保留代词，不直接改成“以色列人”。
- source_word: εἰς σωτηρίαν
  choice: 就是要他们得救
  rationale: εἰς在此表达目标或所求的结果。汉语补出“他们”可清楚表明得救者是前述对象，又不改变原意。
- source_word: μὲν
  choice: 不单独译出
  rationale: μέν在这里轻微标示话语推进或潜在对照，本节没有与之明确配对的δέ；若机械译为“诚然”会显得生硬，因此由句式承载其篇章作用。
theological_decisions:
- issue: Ἀδελφοί的性别范围
  choice: 正文译作“弟兄们”
  alternative: “弟兄姊妹们”
  rationale: 原词采用阳性复数形式，因此正文保留其形式上的性别特征；但这一会众称呼可以涵盖男女，脚注保留其包容性解释。
- issue: “他们”的所指
  choice: 保留代词“他们”
  alternative: 明译为“以色列人”或“我的以色列同胞”
  rationale: 上下文表明所指是以色列人，但本节希腊文只用代词。保留代词既忠于本节措辞，也避免把上下文解释直接写入正文。
- issue: εἰς σωτηρίαν所表达的目标
  choice: “就是要他们得救”
  alternative: “是为了救恩”
  rationale: 该短语可表达目标或结果；结合ὑπὲρ αὐτῶν，最自然的理解是保罗为他们祈求得救。此译法保留祈求的目标，不进一步界定救恩实现的方式。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“我心里所愿的”避免生硬直译属格；“我为他们向神所求的”保持祈求的方向和受益对象；“就是要他们得救”清楚呈现全句共同指向的目标。
