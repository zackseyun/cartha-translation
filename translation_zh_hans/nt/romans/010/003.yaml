id: ROM.10.3
reference: Romans 10:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἀγνοοῦντες γὰρ τὴν τοῦ θεοῦ δικαιοσύνην, καὶ τὴν ⸀ἰδίαν ζητοῦντες στῆσαι, τῇ δικαιοσύνῃ τοῦ θεοῦ οὐχ ὑπετάγησαν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/003.yaml
  text: For[a], being ignorant of the righteousness of God and seeking to establish their own[b], they did not submit to the righteousness of God.
translation:
  language: zh_hans
  text: 因为他们不明白上帝的义[a][b]，又试图确立自己的义，所以没有顺服上帝的义。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “义”也可译作“公义”或“公正”；本节两处都是如此。在保罗的用法中，这个词可以指正直、公义，也可以指上帝以公义使人与他恢复正确关系的作为。
    reason: lexical_alternative
  - marker: b
    text: “上帝的义”也可理解为“来自上帝的义”或“上帝自身的义”。希腊语原文容许这些含义彼此交叠。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγνοοῦντες
  choice: 不明白
  rationale: 表达持续缺乏认识的状态，并保留其应当认识却未认识的意味；比“不知道”更适合以抽象概念“上帝的义”为宾语，又不将其强化为蓄意拒绝。
- source_word: γὰρ
  choice: 因为
  rationale: 承接上文，说明原因；与句中的“所以”配合，符合现代汉语因果句式。
- source_word: δικαιοσύνην / δικαιοσύνῃ
  choice: 义
  rationale: “义”是保罗书信语境中 δικαιοσύνη 的简洁、传统且仍通行的对应词，可涵盖正直、公义、正确关系以及上帝使人得以称义的作为；其他可能意味由脚注保留。
- source_word: τοῦ θεοῦ
  choice: 上帝的
  rationale: 现代汉语自然表达希腊语属格；正文不额外添加“所赐的”等限定，以免把属格单一解释为来源。
- source_word: ἰδίαν
  choice: 自己的义
  rationale: 希腊文省略了前文已经出现的“义”，汉语补出该词可使意思清楚，并准确表达与“上帝的义”的对照。
- source_word: ζητοῦντες
  choice: 想要
  rationale: 自然表达其持续追求或试图达成的行动，不额外断定其动机或成功程度。
- source_word: στῆσαι
  choice: 确立
  rationale: 在此采用 ἵστημι 的引申义，即使某事成立或站得住；“确立自己的义”简洁地保留其论证性语气。
- source_word: ὑπετάγησαν
  choice: 顺服
  rationale: 该被动形式在语境中具有近似中动的含义，指甘愿置身于某种权柄之下；“没有顺服”自然表达这种未曾服从的行动。
theological_decisions:
- issue: “上帝的义”（ἡ δικαιοσύνη τοῦ θεοῦ）的含义
  choice: 正文采用“上帝的义”，不判定该属格主要表示上帝自身的义、来自上帝的义，还是上帝施行拯救的公义作为。
  alternative: 可理解为“上帝自身的义”“来自上帝的义”，或“上帝以公义使人与他恢复正确关系的作为”。
  rationale: 希腊语属格容纳彼此关联的多重含义；保留简洁表述，避免把保罗在此的神学张力缩减为单一解释。
- issue: “他们自己的义”的性质
  choice: 直译为“自己的义”，不在正文中解释为靠行为、自我称义或民族身份。
  alternative: 可按上下文进一步理解为他们试图自行建立的称义依据或正确地位。
  rationale: 本节本身只明确将“自己的义”与“上帝的义”对照；增加具体机制会超出本句明说的范围。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“因为……所以……”清楚呈现两个分词所构成的原因与主句结果；保留“义”作为全句反复出现的关键词，使“上帝的义”与“自己的义”的对照鲜明。
