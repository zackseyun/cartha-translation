  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Μωϋσῆς γὰρ γράφει ⸂ὅτι τὴν δικαιοσύνην τὴν ἐκ ⸀τοῦ νόμου⸃ ὁ ⸀ποιήσας ἄνθρωπος ζήσεται ἐν ⸀αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/005.yaml
  text: 'For Moses writes about the righteousness that is from the law: the man who does these things will live by them[a][b][c].'
translation:
  language: zh_hans
  text: 因为摩西论到那出于律法的义[a]，写道：“行这义的人[b]必在其中活着[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “义”（δικαιοσύνη）也可译作“公正”。
    reason: lexical_alternative
  - marker: b
    text: 希腊语这里使用语法上的阳性单数形式，但泛指任何行这义的人。
    reason: cultural_note
  - marker: c
    text: 也可译作“必靠这些事而活”。保罗这里呼应《利未记》18:5；不过本节希腊文使用阴性单数，直译为“在其中”。
    reason: alternative_reading
lexical_decisions:
- source_word: γὰρ
  choice: 因为
  rationale: 承接上文并说明理由；“因为”自然体现其解释性连接作用。
- source_word: γράφει
  choice: 写道
  rationale: 保留现在时经文引述公式在汉语中的自然表达，并引出直接引文。
- source_word: δικαιοσύνην
  choice: 义
  rationale: 在《罗马书》中，该词兼具关系、法庭和神学层面的含义；“义”能与上下文“出于信的义”保持术语联系。
- source_word: τὴν ἐκ τοῦ νόμου
  choice: 出于律法的
  rationale: 贴近ἐκ所表达的来源，保留保罗对两种“义”的对照。
- source_word: νόμου
  choice: 律法
  rationale: 此处在保罗语境中指作为已知范畴的摩西律法；现代中文圣经语体中“律法”清楚而简洁。
- source_word: ὁ ποιήσας ἄνθρωπος
  choice: 实行这义的人
  rationale: 分词表达以实行来体现其特征的人；补出“这义”使汉语句法完整，同时依照当前希腊文本的单数衔接。
- source_word: ζήσεται
  choice: 必……活
  rationale: 忠实表达将来时及引文所含的应许或原则；“必”在中文中自然传达确定的将来意义。
- source_word: ἐν αὐτῇ
  choice: 靠它而
  rationale: αὐτῇ为阴性单数，最直接地回指出于律法的“义”；“靠它而活”表达ἐν在此可能具有的凭借意义，同时以脚注保留较形式对应的译法。
theological_decisions:
- issue: 保罗对比语境中δικαιοσύνη的译法
  choice: 义
  alternative: 公正
  rationale: “义”保留《罗马书》中“出于律法的义”与“出于信的义”之间的神学和词汇联系；脚注保留一般伦理或司法意义上的另一可能译法。
- issue: ἄνθρωπος及阳性结构的代表性
  choice: 人
  alternative: 男人
  rationale: ἄνθρωπος在这里泛指实行者，并非强调男性性别。现代汉语“人”既准确表达所指，又不增加原文没有的性别限制；脚注说明希腊语形式。
- issue: ἐν αὐτῇ的单数形式与《利未记》背景
  choice: 靠它而活
  alternative: 在其中活着；靠这些事而活
  rationale: 当前希腊文本明确使用阴性单数αὐτῇ，因此正文保留单数回指，不因《利未记》18:5的复数背景而改成复数；脚注注明较直译的空间表达及经文呼应，以保存歧义和互文张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“出于律法的义”保留保罗论述中的固定对照；“实行这义”比生硬的“做这义”更符合现代汉语。正文严格保留希腊文本αὐτῇ的单数形式，并在脚注中呈现另一译法和《利未记》的互文背景。
