revisions:
- from: 因为，人以心相信，通向义[a]；以口承认，通向救恩。
  to: 因为人心里相信，便得义；口里承认，便得救。
  rationale: 将不自然的“通向”结构改为汉语中自然的结果式表达“便得义／便得救”，保留原文两条泛指、平行的陈述及εἰς所表达的趋向／结果，未界定相信、承认与义、救恩之间的机制或时序。“心里／口里”自然对应原文的与格短语。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T03:51:05Z'
review_pass:
  verdict: revise
  source_fidelity: 译文保留了γάρ的解释关系、心与口的平行，以及两个εἰς短语所指向的结果／目标。可是“通向义／通向救恩”在现代汉语中不够自然，且“人以心相信”中的“以心”略显生硬。改为“心里相信，便得义；口里承认，便得救”能自然表达泛指陈述和原文的平行结果关系，同时不把“义”直接释窄为某一特定教义体系的“称义”。
  naturalness: “通向义”搭配不合现代标准汉语的通常表达，“通向救恩”也较像抽象说明而非经文语言。使用“心里／口里”和“便得义／便得救”更自然、简洁，也保持庄重的经文语体。
  terminology: “义”可保留δικαιοσύνη在保罗书信中的宽广用语；“救恩”可译为“得救”以顺应“得义”的结果式句法。脚注中的“公正”宜改为名词性更强、在圣经汉语中更适切的“公义”，并说明这只是可能的词义侧面。
  issues:
  - severity: medium
    issue: “通向义；……通向救恩”不够地道
    rationale: 汉语中“通向”通常用于道路、过程或方向；直接支配“义／救恩”虽可理解，却显得翻译腔，削弱经文的自然性。
  - severity: low
    issue: 脚注以“公正”对应δικαιοσύνη不够贴切
    rationale: “公正”在现代汉语中主要作形容词；作为δικαιοσύνη的另一可能译法，“公义”在词类、语域和圣经语境上更合适。
  revised_text: 因为人心里相信，便得义；口里承认，便得救。
  revised_footnotes:
  - marker: a
    text: 或译“公义”。希腊语δικαιοσύνη也可指“公义”，但在保罗书信中通常译作“义”。
    reason: 保留δικαιοσύνη可能包含的“公义”语义侧面，同时维持“义”作为保罗语境中的默认译法。
  revision_rationale: 将不自然的“通向”结构改为汉语中自然的结果式表达“便得义／便得救”，保留原文两条泛指、平行的陈述及εἰς所表达的趋向／结果，未界定相信、承认与义、救恩之间的机制或时序。“心里／口里”自然对应原文的与格短语。
