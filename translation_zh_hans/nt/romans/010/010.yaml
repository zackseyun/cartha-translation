  text: καρδίᾳ γὰρ πιστεύεται εἰς δικαιοσύνην, στόματι δὲ ὁμολογεῖται εἰς σωτηρίαν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/010.yaml
  text: For with the heart one believes unto righteousness[a], and with the mouth one confesses unto salvation.
translation:
  language: zh_hans
  text: 因为人心里相信，便得义；口里承认，便得救。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καρδίᾳ
  choice: 以心
  rationale: 将与格理解为工具或所涉及的内在人格层面；“以心”既自然，也保留内在相信与外在承认的对照。
- source_word: γὰρ
  choice: 因为
  rationale: 承接并解释上一节的陈述，保留原文的解释性连接。
- source_word: πιστεύεται
  choice: 人……相信
  rationale: 原词虽为被动／中间形式，但在此作泛指用法；汉语以“人……相信”自然表达普遍性的陈述。
- source_word: εἰς δικαιοσύνην
  choice: 通向义
  rationale: εἰς可表示方向、目标或结果；“通向”保留这种开放性，避免直接改写为“得以称义”而收窄保罗此处的表达。
- source_word: δικαιοσύνην
  choice: 义
  rationale: “义”是保罗语境中δικαιοσύνη的常用译法，能够容纳法庭性、关系性和伦理性的含义；另在脚注保留“公正”这一词义可能。
- source_word: στόματι
  choice: 以口
  rationale: 与“以心”形成整齐对应，表达借着口作出的外在承认。
- source_word: δὲ
  choice: ；
  rationale: 原文δὲ在此连接两个相互补充、略有对照的平行分句；汉语用分号即可自然体现这种关系，无须译成强烈转折。
- source_word: ὁμολογεῖται
  choice: 人……承认
  rationale: 按泛指结构处理，并结合上一节承认耶稣为主的语境；“承认”比“认罪”更准确，也不额外限定为礼仪性宣告。
- source_word: εἰς σωτηρίαν
  choice: 通向救恩
  rationale: 与“通向义”保持平行，保留εἰς所表达的方向、目标或结果，而不进一步规定其机制。
- source_word: σωτηρίαν
  choice: 救恩
  rationale: 符合保罗的救赎语境，并可涵盖现今与末后的拯救层面。
theological_decisions:
- issue: 相信、承认与义、救恩之间的关系
  choice: 按原文平行结构译为“以心相信，通向义；以口承认，通向救恩”。
  alternative: 可分别解释为“相信便得以称义、承认便得救”，或把口头承认仅视为得救的证据。
  rationale: 原文使用两个平行的εἰς短语，却没有在本节说明称义与得救的机制或先后次序；译文保留这种神学张力，不把承认写成赚取救恩的功劳，也不把它降为纯粹的外在证据。
translation_notes:
  register: 采用现代、庄重而简洁的汉语。“以心……以口……”保留原文的内外平行；“通向”虽略具凝练的书面色彩，却比“得以称义／得救”更能保留εἰς在方向、目标与结果之间的语义张力。
