base_translation:
  language: en
  yaml_path: translation/nt/romans/010/007.yaml
  text: or[a], “Who will descend into the abyss?” (that is[b], to bring Messiah up from the dead).
translation:
  language: zh_hans
  text: 或：“谁要下到无底深渊去呢？”[a]（就是说，要把弥赛亚从死人中带上来。）[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “无底深渊”也可译作“深处”。保罗在这里呼应《申命记》30:13，却使用“无底深渊”一词，并把这话应用于从死人中把弥赛亚带上来。
    reason: lexical_alternative
  - marker: b
    text: 希腊文为“基督”；这里译作“弥赛亚”，因为Χριστός在此作为称号使用。
    reason: alternative_reading
lexical_decisions:
- source_word: ἤ
  choice: 或说
  rationale: 引出与前一句相对的第二个反问；“或说”在中文中能自然衔接引文。
- source_word: Τίς καταβήσεται
  choice: 谁要下到……去呢
  rationale: 保留将来时意味和反问语气；“下到……去”比书面化的“下降”更符合现代汉语。
- source_word: εἰς τὴν ἄβυσσον
  choice: 到无底深渊
  rationale: ἄβυσσος指深不可测的深处；“无底深渊”保留空间意象及其与死人复起之间的张力，不将其窄化为阴间或坟墓。
- source_word: τοῦτ’ ἔστιν
  choice: 就是说
  rationale: 自然表达希腊文的解释公式，并表明括号内是保罗对引文的说明。
- source_word: Χριστόν
  choice: 弥赛亚
  rationale: 此处Χριστός具有称号功能；译出“受膏者／弥赛亚”的称号意义，而不作为专名音译。
- source_word: ἐκ νεκρῶν
  choice: 从死人中
  rationale: 准确保留“从死者当中”的希腊文惯用表达，比单说“从死里”更具体。
- source_word: ἀναγαγεῖν
  choice: 带上来
  rationale: 保留ἀνάγω的空间方向，与前面的“下到”形成对应；避免直接改译为更具解释性的“使……复活”。
theological_decisions:
- issue: Χριστός的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 在本句中该词作为称号使用；“弥赛亚”呈现称号的语义，同时不改变其基督论所指。
- issue: ἄβυσσος的所指
  choice: 保留“无底深渊”的意象
  alternative: 深处；死人之地；阴间
  rationale: 保罗借用并调整《申命记》30章的语言，又将其解释为把弥赛亚从死人中带上来。正文不把这一意象等同于某个更窄的领域，以保留原文的含混与神学张力。
- issue: ἀναγαγεῖν与复活的关系
  choice: 译作“带上来”
  alternative: 使……复活
  rationale: 上下文清楚涉及复活，但动词本身强调“带上来”。保留空间措辞可与“下到”呼应，并避免用解释取代原文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。引文使用反问语气；括号保留保罗解释引文的结构。脚注标记均置于正文相关内容之后。
