id: ROM.10.16
reference: Romans 10:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἀλλ’ οὐ πάντες ὑπήκουσαν τῷ εὐαγγελίῳ· Ἠσαΐας γὰρ λέγει· Κύριε, τίς ἐπίστευσεν τῇ ἀκοῇ ἡμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/016.yaml
  text: But not all obeyed the good news[a]. For Isaiah says, “Lord[b], who has believed our message?”
translation:
  language: zh_hans
  text: 但并不是所有人都顺从了这好消息[a]。因为以赛亚说：“主啊，谁信了我们所传的信息[b]呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“这福音”。
    reason: lexical_alternative
  - marker: b
    text: 或译“我们的传报”；直译“我们的听闻”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: 但
  rationale: 承接上文形成转折，简洁自然。
- source_word: οὐ πάντες
  choice: 并不是所有人都
  rationale: 保留希腊文的部分否定，避免误解为无人顺从。
- source_word: ὑπήκουσαν
  choice: 顺从了
  rationale: ὑπακούω表示听从、服从，不仅是听见；“顺从”保留其较强的回应含义。
- source_word: τῷ εὐαγγελίῳ
  choice: 这好消息
  rationale: εὐαγγέλιον本义为“好消息”；指向语境中已经传讲的福音，因此用“这”使中文衔接自然，并以脚注保留传统译法。
- source_word: Ἠσαΐας γὰρ λέγει
  choice: 因为以赛亚说
  rationale: γάρ引出经文依据；λέγει的现在时按中文引用经文的自然表达译为“说”。
- source_word: Κύριε
  choice: 主啊
  rationale: 用现代汉语呼格“啊”自然表达直接呼求，并保留敬虔庄重的语气。
- source_word: τίς ἐπίστευσεν
  choice: 谁信了……呢
  rationale: 反问形式用句末“呢”自然呈现；“信了”准确表达对所传信息的相信。
- source_word: τῇ ἀκοῇ ἡμῶν
  choice: 我们所传的信息
  rationale: ἀκοή可指听见、所听见的报告或信息；此处指先知群体传出的内容。“所传的信息”在中文中清楚，也与本章传讲和听见的语境相合。
theological_decisions:
- issue: ὑπήκουσαν所表达的福音回应性质
  choice: 顺从了这好消息
  alternative: 听从了这好消息；接受了这福音
  rationale: 原词明确含有服从、听从之义。“顺从”保留保罗把信与顺服相联的张力，同时不引入特定宗派对救恩次序的解释。
- issue: 以赛亚引文中ἀκοή的含义
  choice: 我们所传的信息
  alternative: 我们的传报；我们所听见的
  rationale: 该词既可表示听闻的行为，也可表示被听见的报告。此处内容义较为自然，但脚注保留“传报”和直译“听闻”，不掩盖原文的语义幅度。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“顺从”保留原文的伦理和回应力度；“所传的信息”使以赛亚引文在中文中自然清楚。所有脚注标记均已置于正文对应位置。
