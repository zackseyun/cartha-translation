revisions:
- from: 那么，他们还没有信他，怎能求告他呢？没有听见他，怎能信他呢？若没有人传讲，怎能听见呢？[a]
  to: 那么，他们没有信他，怎能求告他呢？没有听过有关他的事，怎能信他呢？若没有人传讲，怎能听见呢？[a]
  rationale: 修订仅消除现代汉语中“听见他”通常等同于听到其本人声音的误解，并删去“还”所增加的时间意味。三重反问、词语重复、推论关系和原文未完全明说的听闻对象均得到保留。
