reference: Romans 10:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Πῶς οὖν ⸀ἐπικαλέσωνται εἰς ὃν οὐκ ἐπίστευσαν; πῶς δὲ ⸀πιστεύσωσιν οὗ οὐκ ἤκουσαν; πῶς δὲ ⸀ἀκούσωσιν χωρὶς κηρύσσοντος;
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/014.yaml
  text: How then will they call on him in whom they have not believed? And how will they believe in him of whom they have not heard? And how will they hear without someone preaching?[a]
translation:
  language: zh_hans
  text: 那么，他们没有信他，怎能求告他呢？没有听过有关他的事，怎能信他呢？若没有人传讲，怎能听见呢？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “没有听过有关他的事”或译“没有听见他”。
    reason: οὗ在ἀκούω之后可作较字面的“听见他”理解；但按本句传讲的语境，通常指听闻有关他的消息。
lexical_decisions:
- source_word: Πῶς οὖν
  choice: 那么……怎能……呢
  rationale: “那么”保留οὖν承接上文并作出推论的作用；“怎能……呢”自然地再现连续反问。
- source_word: ἐπικαλέσωνται
  choice: 求告
  rationale: “求告”表达向主呼求、祈求或倚靠其名的含义，并与紧邻上文“求告主名”的引文相呼应。
- source_word: εἰς ὃν οὐκ ἐπίστευσαν
  choice: 他们还没有信他
  rationale: “信他”是现代汉语中πιστεύω接人物对象的自然表达；“还没有”体现信在求告之前这一逻辑关系，而不额外限定信的性质。
- source_word: πιστεύσωσιν
  choice: 怎能信他呢
  rationale: 沿用“信”来保持本节πιστεύω词族的一致性，并以反问表达希腊语虚拟式在此处的修辞作用。
- source_word: οὗ οὐκ ἤκουσαν
  choice: 没有听见他
  rationale: 贴近ἀκούω加属格关系代词的结构，保留可能是“听见他本人”或“听见关于他的传讲”的张力；另一种理解列入脚注。
- source_word: ἀκούσωσιν
  choice: 怎能听见呢
  rationale: “听见”直接对应ἀκούω，并维持前后两个“听见”的词语衔接。
- source_word: χωρὶς κηρύσσοντος
  choice: 若没有人传讲
  rationale: κηρύσσοντος是表示行动者及其行动的分词；“有人传讲”既自然，又避免把它限定为某种固定职分。
theological_decisions:
- issue: πιστεύω所表达的信仰行动
  choice: 信／信他
  alternative: 信靠／倚靠
  rationale: “信”最直接保留保罗在本段中的信仰词汇链；“信靠”虽可表达关系性，却会在正文中增加解释色彩。
- issue: οὗ οὐκ ἤκουσαν中“听”的对象
  choice: 没有听见他
  alternative: 没有听见关于他的传讲
  rationale: 希腊语属格关系代词可理解为听见那一位，也可按传讲语境理解为听见有关他的消息。正文采用较贴近形式且简洁的表达，脚注保存信息性解释，不消除原文张力。
- issue: κηρύσσοντος指行动还是固定职分
  choice: 有人传讲
  alternative: 传道人
  rationale: 原文使用分词，强调有人从事宣讲；不宜仅凭此处将其收窄为特定教会职分。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。连续三问以“怎能……呢”保持保罗论证的节奏；使用“求告”“传讲”等普通读者可懂且适合经文语体的词，避免古奥表达和职分化措辞。
