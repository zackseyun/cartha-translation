    rationale: ἀκούω后接属格在本句传讲链条中自然指听闻有关该人的信息；英语“of whom”可保留形式上的含蓄，但汉语“听见他”会产生不同且不必要的直接听见之意。正文应采用自然、语境相符的“听过有关他的事”，脚注保留较字面的表达。
  - severity: low
