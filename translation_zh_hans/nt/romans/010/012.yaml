  text: οὐ γάρ ἐστιν διαστολὴ Ἰουδαίου τε καὶ Ἕλληνος, ὁ γὰρ αὐτὸς κύριος πάντων, πλουτῶν εἰς πάντας τοὺς ἐπικαλουμένους αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/012.yaml
  text: For there is no distinction between Jew and Greek[a], for the same Lord is Lord of all[b], being rich toward all who call on him.
translation:
  language: zh_hans
  text: 因为犹太人和希腊人[a]没有区别；同一位主是所有人的主[b]，丰丰富富地恩待所有呼求他的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“希腊人”；这里“犹太人和希腊人”的对举，是指犹太人和非犹太人。也可译作“外邦人”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“同一位主掌管所有人。”
    reason: alternative_reading
lexical_decisions:
- source_word: διαστολή
  choice: 区别
  rationale: 这里指在犹太人与希腊人之间所作的区分。“区别”自然明白，也不额外引入价值高低的含义。
- source_word: Ἰουδαίου ... Ἕλληνος
  choice: 犹太人和希腊人
  rationale: 原文明确说“希腊人”。在此搭配中，它代表非犹太人，但正文保留原词，以维持源文透明度。
- source_word: ὁ ... αὐτὸς κύριος πάντων
  choice: 同一位主是万人的主
  rationale: 把希腊文名词句的判断关系明确表达出来，同时保留“同一位”和“万人”的强调。
- source_word: κύριος
  choice: 主
  rationale: 在罗马书10章的上下文中，这是具有基督论分量的称号；“主”既符合通行圣经用语，也不削弱其神学含义。
- source_word: πλουτῶν εἰς πάντας
  choice: 丰丰富富地恩待所有
  rationale: πλουτῶν保留“丰富、充裕”的意象；结合εἰς所表达的指向关系，译作“丰丰富富地恩待”在现代汉语中自然，并清楚表达主把丰盛施予人的意思。
- source_word: τοὺς ἐπικαλουμένους αὐτόν
  choice: 呼求他的人
  rationale: ἐπικαλέω在这里指向主呼求，与下一节的经文引用相衔接；“呼求”准确、庄重而且为普通读者所理解。
theological_decisions:
- issue: “主”在上下文中的所指
  choice: 正文只译作“主”，让罗马书10:9-13的上下文显明这位主就是所承认的耶稣，同时保留“呼求主”与旧约经文的共鸣。
  alternative: 把“主”笼统理解为神，而不具体指向基督。
  rationale: 上下文以承认耶稣为主为中心，随后又引用约珥书关于呼求主的话。译文不加“耶稣”等解释性成分，使保罗的基督论表达由上下文本身呈现。
- issue: “所有”的范围
  choice: “所有”受“呼求他的人”限定，强调跨越犹太人与希腊人的普遍开放性。
  alternative: 把“所有”理解为不带任何限定地指每一个人。
  rationale: 希腊文的定冠词分词结构明确界定蒙受丰富恩待的是“呼求他的人”；译文保留这一限定，不把经文改写成无条件的普救陈述。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“并没有区别”自然表达否定判断；冒号呈现后一分句对前一句的解释。“丰丰富富地恩待”兼顾πλουτῶν的丰富意象与现代汉语流畅度。所有脚注标记均已置于正文相应位置。
