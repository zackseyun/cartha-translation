  rationale: 修订仅提升现代汉语的明确性和术语规范性：“所有人”清楚表达“所有”的范围而不带数目联想；脚注a以“外邦人”替换较不规范的“外族人”。保留“希腊人”于正文，以忠实反映原文措辞；保留“主”及“呼求他的人”的限定，不增添解释性神学结论。
