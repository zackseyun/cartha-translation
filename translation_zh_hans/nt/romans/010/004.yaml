  text: τέλος γὰρ νόμου Χριστὸς εἰς δικαιοσύνην παντὶ τῷ πιστεύοντι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/004.yaml
  text: For Messiah is the end of the law for righteousness to everyone who believes[a][b].
translation:
  language: zh_hans
  text: 因为弥赛亚是律法的终点[a]，使每一个相信的人都得着义[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “终点”也可译作“目标”或“成全”。希腊语 τέλος 可指终止，也可指目标、结果或完成。
    reason: alternative_reading
  - marker: b
    text: “义”也可译作“正义”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τέλος
  choice: 终点
  rationale: “终点”既可指一段进程的结束之处，也可指其所趋向的目标，能较好保留 τέλος 在本句中“终止”与“目标、成全”之间的真实歧义。
- source_word: νόμου
  choice: 律法
  rationale: 在保罗讨论以色列及摩西之约的语境中，“律法”比抽象的“法律”更准确，也符合现代中文圣经语体。
- source_word: Χριστὸς
  choice: 弥赛亚
  rationale: 此处强调耶稣与以色列律法及盟约盼望的关系，Χριστός 的称号意义明显，故译为“弥赛亚”，而不作较名称化的“基督”。
- source_word: εἰς δικαιοσύνην
  choice: 使……得着义
  rationale: εἰς 表达方向、目的或结果；此译在自然中文中呈现“归向义／带来义”的作用，同时不进一步界定称义如何发生。
- source_word: δικαιοσύνην
  choice: 义
  rationale: “义”是保罗书信中 δικαιοσύνη 的简洁、传统且语义宽广的译法；“正义”虽可能成立，却容易把重点收窄为社会或司法层面，故列入脚注。
- source_word: παντὶ τῷ πιστεύοντι
  choice: 每一个相信的人
  rationale: 保留 παντί 的普遍范围和 πιστεύοντι 的分词性质，不将其名词化为可能带有固定宗教标签意味的称呼。
- source_word: γὰρ
  choice: 因为
  rationale: 表明本节是在解释前文；“因为”是现代中文中清楚自然的因由连接词。
theological_decisions:
- issue: τέλος νόμου 所表达的弥赛亚与律法之关系
  choice: 正文译作“律法的终点”，兼容终止与目标两层意味
  alternative: “律法的目标”“律法的顶点”“律法的成全”
  rationale: 这是本节的重要释义分歧。希腊语 τέλος 可指终止，也可指目标、结果或顶点；正文不把其中一种解释定为唯一含义，脚注明列其他可能。
- issue: Χριστός 的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 本节置于保罗论述以色列、律法及盟约的脉络中，称号意义较突出，因此采用“弥赛亚”。
- issue: δικαιοσύνη 的译法
  choice: 义
  alternative: 正义
  rationale: “义”保留保罗用语中关系、法庭及道德等可能层面；脚注保留“正义”，避免掩盖该词的语义范围。
- issue: εἰς δικαιοσύνην 与 παντὶ τῷ πιστεύοντι 的关系
  choice: 译为“使每一个相信的人都得着义”
  alternative: “为要使每一个相信的人得着义”“归于义，给每一个相信的人”
  rationale: 中文需要适度补足希腊文压缩的句法。“使……得着”表达目的或结果，但不把 εἰς 强限定为其中一类，也不加入特定宗派的称义机制。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“弥赛亚”“律法”“义”保留经文的神学语汇，但句式调整为自然中文。脚注标记分别紧跟其所解释的词语。
