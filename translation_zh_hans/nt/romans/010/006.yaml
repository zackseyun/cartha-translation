source:
  edition: SBLGNT
  text: ἡ δὲ ἐκ πίστεως δικαιοσύνη οὕτως λέγει· Μὴ εἴπῃς ἐν τῇ καρδίᾳ σου· Τίς ἀναβήσεται εἰς τὸν οὐρανόν; τοῦτ’ ἔστιν Χριστὸν καταγαγεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/006.yaml
  text: 'But the righteousness from faith speaks in this way: “Do not say in your heart[a], ‘Who will ascend into heaven?’” (that is[c][b], to bring Messiah down).'
translation:
  language: zh_hans
  text: 但那出于信的义[a]却这样说：“你心里不要说：‘谁要升到天上去？’”[c]（这就是说，要把弥赛亚[b]带下来。）
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “义”也可译作“公义”或“正义”。希腊词δικαιοσύνη在这里也可带有“公正”这一层意义。
    reason: lexical_alternative
  - marker: b
    text: 希腊文作Χριστός，通常也译作“基督”；这里译作“弥赛亚”，因为该词在此处作为称号使用。
    reason: lexical_alternative
  - marker: c
    text: 保罗在这里呼应《申命记》30:12，并把那段话应用于弥赛亚。
    reason: cross_reference
lexical_decisions:
- source_word: δικαιοσύνη
  choice: 义
  rationale: “义”是保罗书信语境中自然且凝练的对应词，能保留称义、正直和公正等相互关联的意味；本句也保留了“义”作为说话主体的拟人表达。
- source_word: ἐκ πίστεως
  choice: 出于信
  rationale: 较直接地体现介词ἐκ所表达的来源，并保留它与上文“出于律法”之间的对照。
- source_word: πίστεως
  choice: 信
  rationale: 此处不是所有格结构的争议用法；译作“信”简洁清楚，也不把其含义预先限定为“忠信”或仅仅是心理上的“信任”。
- source_word: οὕτως λέγει
  choice: 却这样说
  rationale: 既体现οὕτως“这样”的意思和λέγει的现在时表达，也自然保留“义”被拟人化为说话者的修辞。
- source_word: Μὴ εἴπῃς ἐν τῇ καρδίᾳ σου
  choice: 不要心里说
  rationale: 符合现代汉语习惯，同时保留申命记引文中内心自语、思想意念的含义。
- source_word: Τίς ἀναβήσεται εἰς τὸν οὐρανόν;
  choice: 谁要升到天上去？
  rationale: “升到天上”准确表达ἀναβήσεται与εἰς的方向性；“要”在反问句中自然表达“谁会／谁将”的语气。
- source_word: Χριστόν
  choice: 弥赛亚
  rationale: 此处Χριστός在保罗对经文的救恩历史阐释中具有称号功能；“弥赛亚”能明确传达“受膏者”这一称号，而不将其仅当作姓名。
- source_word: καταγαγεῖν
  choice: 把……带下来
  rationale: 自然表达“使某人从上面下来”的使动和方向意义，并保留原文不说明由谁实施这一行动的简洁结构。
theological_decisions:
- issue: “出于信的义”的拟人化
  choice: 保留“义……说”的拟人表达
  alternative: 意译为“论到因信而得的义，经上这样说”
  rationale: 原文以δικαιοσύνη为λέγει的语法主语；保留拟人手法可呈现保罗的修辞，并维持与上一节的对照。
- issue: Χριστός的称号性质
  choice: 译为“弥赛亚”
  alternative: 译为“基督”
  rationale: 在本节对申命记的释义中，该词指向受膏者这一身份和称号；“弥赛亚”较明确地保留称号意义，同时脚注说明希腊原词通常也译作“基督”。
- issue: 保罗对申命记30:12的应用
  choice: 正文保留解释性括号，脚注说明经文呼应
  alternative: 将申命记出处直接写入正文
  rationale: 原文没有明说出处，却以τοῦτ’ ἔστιν给出保罗的解释；正文不增补出处，脚注则帮助读者识别互文关系。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“出于信的义”略带保罗论述特有的凝练表达，以保留ἐκ πίστεως的来源含义和上下文对照；其余句式尽量符合现代汉语阅读习惯。
