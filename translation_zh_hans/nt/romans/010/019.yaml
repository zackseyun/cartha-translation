  terminology: ‘以色列人’、‘摩西’、‘嫉妒’、‘民族’均合宜。‘不明事理的民族’可表达ἀσυνέτῳ缺乏理解的含义，虽带有一定道德评价色彩，仍属可接受的现代庄重用语。
