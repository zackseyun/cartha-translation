  text: ἀλλὰ λέγω, μὴ ⸂Ἰσραὴλ οὐκ ἔγνω⸃; πρῶτος Μωϋσῆς λέγει· Ἐγὼ παραζηλώσω ὑμᾶς ἐπ’ οὐκ ἔθνει, ἐπ’ ἔθνει ἀσυνέτῳ παροργιῶ ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/019.yaml
  text: But I ask[a], did Israel not know? First Moses says, “I will make you jealous by what is not a nation[b]; by a nation without understanding I will provoke you to anger.”
translation:
  language: zh_hans
  text: 但我要问：难道以色列人不知道吗？[a] 首先，摩西说：“我要借着那不算一个民族的群体，使你们嫉妒；我要借着一个不明事理的民族，激怒你们。”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不知道”也可译作“没有明白”。这里可能指没有领会所听见之信息的意义。
    reason: lexical_alternative
  - marker: b
    text: 引自申命记32:21。“那不算一个民族的群体”可指被视为不成其为真正民族的一群人；在本段语境中，可能指外族人。
    reason: cross_reference
lexical_decisions:
- source_word: μὴ Ἰσραὴλ οὐκ ἔγνω
  choice: 难道以色列人不知道吗？
  rationale: 保留γινώσκω的基本义“知道”，也保留原文反问的形式；上下文可使读者体会其中也涉及领会所听信息的含义，脚注说明“明白”这一可能译法。
- source_word: πρῶτος Μωϋσῆς λέγει
  choice: 首先，摩西说
  rationale: πρῶτος在此标示保罗接下来所引经文见证的次序；“首先”自然且准确。
- source_word: παραζηλώσω
  choice: 使你们嫉妒
  rationale: 表达该动词“激起嫉妒”的使动含义，并与后句“激怒”形成平行。
- source_word: ἐπ’ οὐκ ἔθνει
  choice: 借着那算不得一国的
  rationale: 保留引文刻意反常的“非国”说法及其修辞锋芒，同时用现代汉语表达一种不被视为真正国家或民族的群体；不在正文中直接认定其所指。
- source_word: ἐπ’ ἔθνει ἀσυνέτῳ
  choice: 借着一个不明事理的民族
  rationale: ἀσύνετος表示缺乏理解、无知或愚昧；“不明事理”较贴近其构词意义，也比单纯的“愚蠢”更庄重自然。
- source_word: παροργιῶ
  choice: 激怒你们
  rationale: 简洁表达“惹动……发怒”的使动意义，并保持与“使你们嫉妒”的平行结构。
- source_word: ὑμᾶς
  choice: 你们
  rationale: 明确呈现希腊语第二人称复数。
theological_decisions:
- issue: “算不得一国的”及“不明事理的民族”所指为何
  choice: 正文保留申命记引文的措辞，不明确指定所指群体。
  alternative: 在正文中直接译作“外族人”或解释为“以色列看不上眼的民族”。
  rationale: 保罗借申命记32:21论证以色列本应从经文得知上帝会借外在群体激起他们的反应；直接加入“外族人”会把合理解释写进正文，消除原引文保留的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“难道……吗”保留反问语气；“算不得一国”刻意保存原引文的悖论式表达。“民族”用于ἔθνος，避免现代政治意义过强的“国家”。所有脚注标记均已置于正文相应位置。
