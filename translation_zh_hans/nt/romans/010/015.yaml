  text: πῶς δὲ ⸀κηρύξωσιν ἐὰν μὴ ἀποσταλῶσιν; ⸀καθὼς γέγραπται· Ὡς ὡραῖοι οἱ πόδες τῶν ⸀εὐαγγελιζομένων ⸀τὰ ἀγαθά.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/015.yaml
  text: And how are they to proclaim unless they are sent? As it is written[b][a], “How beautiful are the feet of those who bring good news of good things!”
translation:
  language: zh_hans
  text: 他们若没有被差遣，怎能宣讲呢？正如经上所记：“那些传扬美好之事的人，他们的脚步多么佳美[a]！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “佳美”也可理解为“多么可喜”或“来得多么及时”；原文这个词不仅可以指美，也可含有使者的到来令人欢迎、正合时宜的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: κηρύξωσιν
  choice: 宣讲
  rationale: 表示公开宣告、传扬；“宣讲”保留公开宣告的意味，又不把范围限定为正式讲道。
- source_word: ἀποσταλῶσιν
  choice: 奉差遣
  rationale: 被动形式表明他们由另一方差派；“奉差遣”自然地保留差遣者虽未明说却隐含在内的关系。
- source_word: καθὼς γέγραπται
  choice: 正如经上所记
  rationale: 采用现代中文常用而庄重的经文引用语式。
- source_word: ὡραῖοι
  choice: 佳美
  rationale: 既表达美好、悦目，也可让人联想到使者来到时令人欣喜、合宜；其他可能意味收入脚注。
- source_word: πόδες
  choice: 脚踪
  rationale: 保留“脚”的使者意象，同时“脚踪”在中文中较自然地指向使者跋涉而来；没有把形象解释性改写为“到来”。
- source_word: εὐαγγελιζομένων
  choice: 传扬……的人
  rationale: 表达宣布好消息的行动，符合使者语境，也避免限定为正式教会职分。
- source_word: τὰ ἀγαθά
  choice: 美好之事
  rationale: 对应带冠词的复数“美好的事物”，避免将其与前面的“传扬好消息”完全合并，并使中文通顺。
theological_decisions:
- issue: 使者引文与福音宣讲的关系
  choice: 保留奉差遣、公开宣讲以及使者脚踪受称赞的意象，不限定为受按立者的正式讲道。
  alternative: 将κηρύξωσιν译为“讲道”，并把εὐαγγελιζομένων处理为“传福音的人”，从而更明确指向教会正式事工。
  rationale: 上下文涉及受差遣和福音的宣告，但引文所称颂的是传来美好消息的使者。译文应保留这种宽度，不额外引入特定教会职分。
- issue: ὡραῖοι的语义张力
  choice: 正文译作“佳美”，脚注说明也可侧重“可喜”或“来得正是时候”。
  alternative: 正文直接译作“多么可喜”或“来得多么及时”。
  rationale: 该词在此首先可表达美好、悦人，同时可能包含使者的来到受欢迎且合时的意味；正文与脚注共同保存这层歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“若没有奉差遣”延续本段层层反问的论证；引文用“脚踪”保留诗性使者意象。原文“传扬美好之事”已在正文直译呈现，因此不另设重复说明其字面形式的脚注。
