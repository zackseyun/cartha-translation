  yaml_path: translation/nt/romans/010/013.yaml
  text: For everyone who calls on the name of the Lord will be saved[a][b].
translation:
  language: zh_hans
  text: 因为，凡求告主名的，都必得救。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 保罗在这里引用约珥书2:32；在约珥书中，所指的是耶和华（YHWH），而保罗在这里的上下文中把这段话应用于耶稣。
    reason: cross_reference
  - marker: b
    text: “求告”也可译作“呼求”。这里的希腊语表达是指呼求主的名，向主祈求或求助。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς ... ὃς ἂν
  choice: 凡……的，都
  rationale: 这一组合表达普遍、无例外的范围。汉语用“凡……的，都……”自然地传达“每一个这样的人”，也不暗示只限男性。
- source_word: γὰρ
  choice: 因为
  rationale: γάρ在这里引出经文依据，说明上一节所述应许的根据；“因为”清楚保留其解释和论证作用。
- source_word: ἐπικαλέσηται
  choice: 求告
  rationale: 该动词与“名”连用，指凭名呼求、祈求或诉诸某位。“求告”既准确表达这种宗教语境中的呼求，也保留约珥书引文的经文色彩。
- source_word: τὸ ὄνομα
  choice: 名
  rationale: “名”是圣经惯用表达，涉及所呼求者显明的身份和权柄；直译可保留原文意象，不宜释义改写。
- source_word: κυρίου
  choice: 主
  rationale: 原文为κύριος，译作“主”。上下文指向耶稣，但正文不加入原文没有的名字，从而保留引文措辞及其互文张力。
- source_word: σωθήσεται
  choice: 必得救
  rationale: 未来被动式在保罗此处具有救恩意义。“必得救”自然、明确，并以“必”传达应许的确定性。
theological_decisions:
- issue: 保罗引用约珥书时“主”的所指
  choice: 正文保留“主”，脚注说明约珥书原处指耶和华，而保罗在此处语境中把这段话应用于耶稣。
  alternative: 在正文译作“耶和华”或“主耶稣”。
  rationale: 希腊文本只有κυρίου。罗马书10章的近距离语境强烈指向耶稣，但直接在正文增补“耶稣”会超出原文字面；译作“耶和华”则可能遮蔽保罗在此处的基督论应用。脚注可同时保留旧约背景和新约语境。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“凡……的，都……”简洁传达普遍范围；“求告主名”保留圣经互文所需的固定表达，同时以脚注帮助普通读者理解。
