  text: πρὸς δὲ τὸν Ἰσραὴλ λέγει· Ὅλην τὴν ἡμέραν ἐξεπέτασα τὰς χεῖράς μου πρὸς λαὸν ἀπειθοῦντα καὶ ἀντιλέγοντα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/021.yaml
  text: But concerning Israel he says[c][b][a], “All day long I have stretched out my hands to a disobedient and opposing people.”
translation:
  language: zh_hans
  text: 但论到以色列，他说[a]：“我整天向悖逆[b]又反对[c]的百姓伸出双手。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“但他对以色列说。”希腊文结构既可指关于以色列所说的话，也可指向以色列说话。
    reason: alternative_reading
  - marker: b
    text: “悖逆”也可译作“不信”“不顺从”或“拒不信服”。
    reason: lexical_alternative
  - marker: c
    text: “反对”也可译作“顶撞”“反驳”或“说反对的话”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς δὲ τὸν Ἰσραὴλ
  choice: 但论到以色列
  rationale: πρός与λέγει连用在此可表示言说所针对的对象或主题；“论到以色列”自然地表达有关以色列之意，同时用脚注保留“对以色列说”的可能。
- source_word: λέγει
  choice: 他说
  rationale: 保留希腊文现在时的引述形式，不明说其隐含主语；上下文可使读者理解为神。
- source_word: Ὅλην τὴν ἡμέραν
  choice: 整天
  rationale: 简洁、自然地表达持续一整天的时间范围。
- source_word: ἐξεπέτασα τὰς χεῖράς μου
  choice: 我……伸出双手
  rationale: 保留原文拟人化的动作意象；“伸出双手”在现代汉语中自然，也可传达招呼、邀请或恳求之意，而不限定其具体含义。
- source_word: πρὸς λαὸν
  choice: 向……百姓
  rationale: “向”准确表达伸手动作所朝向的对象；λαός译作“百姓”，符合引述以赛亚书时的群体与盟约语境。
- source_word: ἀπειθοῦντα
  choice: 悖逆
  rationale: 该词兼有不顺从、不信服和拒绝听从之意；“悖逆”保留其道德与意志层面的抗拒，其他语义以脚注说明。
- source_word: ἀντιλέγοντα
  choice: 顶撞
  rationale: 该词指反驳、说反对的话或抗拒；“顶撞”兼顾言语对抗和主动抵拒，在现代汉语中具体而有力。
theological_decisions:
- issue: 以色列对神的回应如何表述
  choice: 悖逆、顶撞的百姓
  alternative: 不信而反对的百姓；不顺从、反驳的百姓
  rationale: 两个并列分词分别呈现拒不听从和主动出言反对，使神持续伸手与人的持续抗拒之间的张力得以保留；不据此扩展为对以色列整体地位的系统性判断。
- issue: λέγει的隐含主语
  choice: 保留“他”，不在正文中补作“神”
  alternative: 神说
  rationale: 上下文表明引文中的发言者是神，但本节希腊文只用隐含的第三人称主语；译文不作超出原文形式的明示。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“百姓”保留先知引文的群体色彩；“伸出双手”保留鲜明意象。“悖逆、顶撞”避免抽象化，并体现两个希腊分词之间由拒绝到积极反对的递进感。所有脚注标记均置于正文相关位置。
