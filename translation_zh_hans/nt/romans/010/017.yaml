  text: ἄρα ἡ πίστις ἐξ ἀκοῆς, ἡ δὲ ἀκοὴ διὰ ῥήματος ⸀Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/017.yaml
  text: So faith comes from hearing[a], and hearing through the word of Messiah.
translation:
  language: zh_hans
  text: 可见，信心源于听见，听见则是借着弥赛亚的话。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弥赛亚的话”也可译作“关于弥赛亚的话”或“有关弥赛亚的信息”。这里的希腊语属格可以有不同理解。
    reason: 保留ῥήματος Χριστοῦ中属格关系的真实歧义。
lexical_decisions:
- source_word: ἄρα
  choice: 可见
  rationale: 表示由上文论证所得的推论；“可见”自然地承接罗马书10:14–16的逻辑。
- source_word: πίστις
  choice: 信心
  rationale: 本节指人听见所传信息后产生的相信和信靠；“信心”既符合保罗书信语境，也不把它误解为“忠信”。
- source_word: ἐξ ἀκοῆς
  choice: 源于听见
  rationale: ἐκ表示来源；“源于”补足希腊语无动词分句的隐含关系，“听见”保留ἀκοή在此作为听闻行动或结果的含义。
- source_word: ἡ δὲ ἀκοὴ
  choice: 听见则
  rationale: 重复“听见”以保留原文ἀκοή的复现；“则”表达δέ较轻的承接和推进，而非强烈转折。
- source_word: διὰ ῥήματος
  choice: 借着……的话
  rationale: διά加属格表示媒介或途径；ῥῆμα侧重说出的话语，“话”兼顾词义与传统表达。
- source_word: Χριστοῦ
  choice: 弥赛亚
  rationale: Χριστός在此作为称号，译作“弥赛亚”；其属格与ῥῆμα的关系在正文中采用较形式对应的“弥赛亚的话”，其他可能理解列入脚注。
theological_decisions:
- issue: πίστις在本节的含义
  choice: 信心
  alternative: 信靠；忠信
  rationale: 上下文讨论听见所传之道并相信的人的回应，因此“信心”最贴切，同时不引入更专门的“忠信”含义。
- issue: ῥήματος Χριστοῦ中属格Χριστοῦ的关系
  choice: 弥赛亚的话
  alternative: 关于弥赛亚的话；有关弥赛亚的信息
  rationale: 希腊语属格可能表示话语来自或属于弥赛亚，也可能表示话语以弥赛亚为内容。正文保留形式上的开放性，脚注说明客观属格的可能读法。
- issue: ἀκοή的语义范围
  choice: 听见
  alternative: 所听见的信息；传闻
  rationale: ἀκοή既可指听闻的行动，也可指听到的内容。正文重复“听见”，避免在两次出现时过早将其限定为同一具体语义。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“可见”承接上文推论；两个“听见”刻意保留原文的词语复现。脚注标记置于相关短语之后。
