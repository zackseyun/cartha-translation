  text: λέγει γὰρ ἡ γραφή· Πᾶς ὁ πιστεύων ἐπ’ αὐτῷ οὐ καταισχυνθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/011.yaml
  text: For the Scripture says[a], “Everyone who believes in him will not be put to shame.”
translation:
  language: zh_hans
  text: 因为经上说：“凡信靠他的人，必不至蒙羞。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“凡信靠他的人，必不至羞愧。”
    reason: 词义上既可着重被动的“蒙羞”，也可表达陷入羞愧或失望的状态。
lexical_decisions:
- source_word: λέγει
  choice: 说
  rationale: 在引述经文的固定表达中，希腊文现在时自然译为“说”，简洁地保留经文当下仍在发言的意味。
- source_word: γὰρ
  choice: 因为
  rationale: γάρ承接并说明上文的根据；“因为”清楚保留保罗论证中的因果衔接。
- source_word: ἡ γραφή
  choice: 经上
  rationale: 这里指神圣经文；现代汉语引经惯用“经上说”，自然、庄重，也不把它误解为一般著作。
- source_word: Πᾶς ὁ πιστεύων
  choice: 凡……的人
  rationale: 该结构具有概括、普遍的范围；“凡信靠他的人”自然表达不受性别限制的普遍含义。
- source_word: πιστεύων
  choice: 信靠
  rationale: πιστεύω与ἐπί加与格连用，表达把信赖寄托于某人；“信靠”比单说“相信”更能传达倚赖的关系性含义。
- source_word: ἐπ’ αὐτῷ
  choice: 他
  rationale: 与“信靠”组合为“信靠他”，自然表达信赖所指向的对象，同时保留原文代词，不在正文中增补其身份。
- source_word: οὐ καταισχυνθήσεται
  choice: 必不至蒙羞
  rationale: καταισχυνθήσεται是将来被动式；“蒙羞”保留受到羞辱或最终遭致羞愧的被动色彩，“必不至”自然表达否定将来的确定结果。
theological_decisions:
- issue: Πᾶς ὁ πιστεύων的阳性单数形式
  choice: 凡信靠他的人
  alternative: 凡信靠他的男人
  rationale: 这里的阳性单数具有代表性和泛指作用，并非限定男性；译文应传达所有信靠者均包括在内。
- issue: αὐτῷ所指为何
  choice: 保留为“他”
  alternative: 扩译为“基督”或“主”
  rationale: 上下文可帮助读者确认所指，但本句作为引文使用代词；保留“他”既忠于句法，也避免把解释直接写入正文。
- issue: καταισχυνθήσεται的羞耻含义
  choice: 必不至蒙羞
  alternative: 必不觉得羞愧
  rationale: 选择“蒙羞”保留被动形式及公开受辱、最终失望的可能意味，不把它缩减为主观羞愧感；脚注列出可行的状态性译法。
translation_notes:
  register: 采用现代、庄重而通俗的经文语体。“经上说”符合汉语引经习惯；“凡……的人”清楚表达普遍范围；“信靠”体现πιστεύω ἐπί的倚赖意味。脚注标记置于引文之后。
