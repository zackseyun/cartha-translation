source:
  edition: SBLGNT
  text: Ἀλλὰ λέγω, μὴ οὐκ ἤκουσαν; μενοῦνγε· Εἰς πᾶσαν τὴν γῆν ἐξῆλθεν ὁ φθόγγος αὐτῶν, καὶ εἰς τὰ πέρατα τῆς οἰκουμένης τὰ ῥήματα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/018.yaml
  text: 'But I ask[a], did they not hear? Indeed they did: “Their voice has gone out into all the earth[c][b], and their words to the ends of the inhabited world.”'
translation:
  language: zh_hans
  text: '但我要问：难道他们没有听见吗？当然，他们听见了：


    “他们的声音[a]传到全地；

    他们的话传到人居世界的尽头。”[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “声音”也可译作“声响”。
    reason: lexical_alternative
  - marker: b
    text: “人居世界”也可译作“世界”；希腊语特指有人居住的世界。
    reason: lexical_alternative
  - marker: c
    text: 保罗在此引用诗篇19:4，并把其中的语言应用于信息的广传。
    reason: cross_reference
lexical_decisions:
- source_word: μὴ οὐκ ἤκουσαν
  choice: 难道他们没有听见吗？
  rationale: μή οὐκ 引出预期肯定回答的反问；“难道……没有……吗”自然保留其修辞力量。
- source_word: μενοῦνγε
  choice: 当然听见了
  rationale: 该语气词作强烈肯定答复；补出隐含的动词，使现代汉语表达完整自然。
- source_word: φθόγγος
  choice: 声音
  rationale: 既贴近该词“声响、声音”的基本含义，也与下句“话”形成诗体平行；不把它解释性地改成“信息”。
- source_word: γῆ
  choice: 全地
  rationale: 引文语境具有普世范围，“全地”兼顾原文和合宜的经文语体。
- source_word: ἐξῆλθεν
  choice: 传遍
  rationale: 原意是“出去、发出”；在声音扩及全地的语境中，“传遍”是自然汉语，并保留传播结果。
- source_word: πέρατα
  choice: 尽头
  rationale: “到……的尽头”自然再现空间边界的诗性表达。
- source_word: οἰκουμένης
  choice: 人居之地
  rationale: 明确保留 οἰκουμένη 所含“有人居住的世界”之义，又比“有人居住的世界”更凝练。
- source_word: ῥήματα
  choice: 话
  rationale: 直接表达复数 ῥήματα，并与“声音”保持平行；避免用“信息”提前解释其内容。
theological_decisions:
- issue: 诗篇引文中“他们”的所指
  choice: 保留“他们”，不在正文中补明所指
  alternative: 明确译作诸天的声音，或传道者／使徒的声音
  rationale: 保罗引用诗篇19:4的措辞用于当前论证；保留代词可维持原有的互文关系和所指张力，避免把某一种解释写进正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。反问和回答保持鲜明；引文分行以呈现诗体平行。“人居之地”有意保留 οἰκουμένη 的词义色彩。“他们”的所指不作解释性扩写。
