id: ROM.10.2
reference: Romans 10:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: μαρτυρῶ γὰρ αὐτοῖς ὅτι ζῆλον θεοῦ ἔχουσιν· ἀλλ’ οὐ κατ’ ἐπίγνωσιν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/002.yaml
  text: For I testify about them that they have zeal for God[a], but not according to knowledge[b],
translation:
  language: zh_hans
  text: 因为我为他们作证：他们对上帝有热心[a]，却不是按着正确的认识[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“有上帝的热心”。这里较可能指他们对上帝所怀的热心。
    reason: lexical_alternative
  - marker: b
    text: 或译：“却不是按着充分的认识”或“却不是以认识为依据”。
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτυρῶ
  choice: 我可以……作证
  rationale: 保留现在时第一人称的直接见证语气；现代汉语中“可以为他们作证”自然、庄重，也表达保罗根据所知提出证言。
- source_word: γὰρ
  choice: 因为
  rationale: 承接上一节，明确本句是对前文所述心愿与祈求的解释。
- source_word: αὐτοῖς
  choice: 为他们
  rationale: 此处与“作证”连用，所指是保罗为其情况作证的人，而非证言的听受者；汉语“为他们作证”自然表达 concerning them 的语义。
- source_word: ζῆλον θεοῦ
  choice: 对上帝有热心
  rationale: 将 θεοῦ 理解为客观属格，即热心指向上帝；同时用脚注保留希腊文属格结构可能容纳的另一种直译。
- source_word: ἔχουσιν
  choice: 有
  rationale: 直接对应现在时，简洁自然。
- source_word: ἀλλ’
  choice: 却
  rationale: 清楚呈现肯定其热心、继而指出其缺失的鲜明转折。
- source_word: οὐ κατ’ ἐπίγνωσιν
  choice: 不是按着真知
  rationale: “按着”保留 κατά 所表达的准则或依据关系；“真知”简洁表达 ἐπίγνωσις 在此处真实、正确认识的语境意味，但脚注保留“充分认识”等可能译法。
theological_decisions:
- issue: 以色列人的热心具有什么性质
  choice: 他们的热心指向上帝，却不合乎正确的认识
  alternative: 他们有出于上帝的热心；或只泛指宗教热忱而不说明对象
  rationale: 上下文承认他们诚挚追求上帝，同时批评其认识与上帝的义不相符。译文保留这种张力：既不否定热忱，也不因其诚挚而认定其正确。
- issue: ἐπίγνωσις 的程度与性质
  choice: 真知
  alternative: 充分的认识；以认识为依据
  rationale: “真知”在本节语境中自然指与事实相符的认识，但不把经文本身扩展成完整的认识论判断；脚注明示较贴近形式的其他理解。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“热心”延续宗教语境中的常用表达；“按着真知”略带书面色彩，以保留原文 κατά + 宾格的结构及其神学张力。所有脚注标记均已置于正文相应位置。
