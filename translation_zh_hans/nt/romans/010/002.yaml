    text: 直译：“有上帝的热心”。这里较可能指他们对上帝所怀的热心。
    reason: lexical_alternative
  - marker: b
    text: 或译：“却不是按着充分的认识”或“却不是以认识为依据”。
    reason: lexical_alternative
  revision_rationale: 删去原文未表达的“可以”。将“真知”改为“正确的认识”，保留保罗对其热心的肯定及对其认识不足或不当的批评，但不把该短语界定为特定神学意义的“真知”。脚注 a 改为较准确地说明字面属格形式及其较可能的上下文理解。
