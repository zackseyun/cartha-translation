revisions:
- from: 因为我可以为他们作证：他们对上帝有热心[a]，却不是按着真知[b]。
  to: 因为我为他们作证：他们对上帝有热心[a]，却不是按着正确的认识[b]。
  rationale: 删去原文未表达的“可以”。将“真知”改为“正确的认识”，保留保罗对其热心的肯定及对其认识不足或不当的批评，但不把该短语界定为特定神学意义的“真知”。脚注 a 改为较准确地说明字面属格形式及其较可能的上下文理解。
