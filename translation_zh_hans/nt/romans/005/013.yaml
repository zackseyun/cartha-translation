id: ROM.5.13
reference: Romans 5:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἄχρι γὰρ νόμου ἁμαρτία ἦν ἐν κόσμῳ, ἁμαρτία δὲ οὐκ ἐλλογεῖται μὴ ὄντος νόμου,
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/013.yaml
  text: For until the law[a], sin was in the world; but sin is not counted where there is no law.
translation:
  language: zh_hans
  text: 因为在律法颁布以前，罪已经在世上；但没有律法时，罪就不被算在账上[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“记在人的账上”，或“归算”。
    reason: 说明ἐλλογεῖται所含的会计及归算意味，并保留较直白和较技术性的译法。
lexical_decisions:
- source_word: ἄχρι γὰρ νόμου
  choice: 因为在律法颁布以前
  rationale: ἄχρι νόμου标明以律法为界的此前时期；结合下文从亚当到摩西的语境，用“律法颁布以前”自然表达时间关系，同时不在正文中另加“摩西律法”。
- source_word: ἁμαρτία
  choice: 罪
  rationale: 保留保罗所用的单数抽象名词，也容许读者感受到上下文中可能存在的拟人化意味。
- source_word: ἐν κόσμῳ
  choice: 在世上
  rationale: 直接表达罪存在于人类世界之中，语言简明自然，不将κόσμος过度解释为某种特定的“世界体系”。
- source_word: ἐλλογεῖται
  choice: 被算在账上
  rationale: 该词带有记账、计入账目的意味；此译法既清楚呈现其比喻，又避免在正文中直接采用神学色彩较浓的术语。
- source_word: μὴ ὄντος νόμου
  choice: 没有律法时
  rationale: 将属格独立结构译为时间兼条件性的表达；中文自然，并保留“律法不存在”与罪不被记账之间的关系。
theological_decisions:
- issue: νόμου所指的律法
  choice: 译作“律法”，由“颁布以前”及上下文暗示摩西律法
  alternative: 泛指任何律法或法则
  rationale: 罗马书5章的论证以从亚当到摩西的时期为背景，因此摩西律法最可能是所指；但正文不直接添加“摩西”，以免把语义限定得超过原文。
- issue: ἐλλογεῖται的神学分量
  choice: 正文译作“被算在账上”
  alternative: 译作“归算”或“记在人的账上”
  rationale: 原词具有会计式的计入含义，并与归算议题相关；正文采用普通读者容易理解的说法，脚注列出较技术性的可能译法，不替读者消解其中的神学张力。
- issue: 没有律法时罪是否存在
  choice: 明确保留“罪已经在世上”与“罪不被算在账上”的并置
  alternative: 把后半句解释成没有律法就没有罪或完全没有罪责
  rationale: 原文刻意区分罪的存在与罪被计入账目；译文保留这一张力，不进一步说明“不被算”在终极审判或个人罪责层面的具体范围。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“被算在账上”保留会计比喻；分号呈现两小句之间既承接又转折的论证关系。
