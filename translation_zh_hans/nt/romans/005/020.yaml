  text: νόμος δὲ παρεισῆλθεν ἵνα πλεονάσῃ τὸ παράπτωμα· οὗ δὲ ἐπλεόνασεν ἡ ἁμαρτία, ὑπερεπερίσσευσεν ἡ χάρις,
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/020.yaml
  text: The law came in alongside so that the trespass might increase; but where sin increased, grace overflowed all the more,
translation:
  language: zh_hans
  text: 律法是附带进来的[a]，为要使过犯[b]增多；但罪在哪里增多，恩典就越发满溢[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“从旁进入”或“进入了”；希腊文含有从旁或另外进入的意味。
    reason: lexical_alternative
  - marker: b
    text: 或译“越轨”或“冒犯”。
    reason: lexical_alternative
  - marker: c
    text: 或译“越发丰盛”。
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμος
  choice: 律法
  rationale: 在保罗的上下文中，带冠词的 νόμος 最自然地指摩西律法；“律法”是现代中文圣经语体中准确且通行的表达。
- source_word: δὲ
  choice: 却
  rationale: 保留此处的转折或推进作用，并自然承接前文；不添加原文没有的时间副词。
- source_word: παρεισῆλθεν
  choice: 从旁进入
  rationale: παρεισέρχομαι 不只是一般的“进入”，还含有从旁、附加进入的意味；此译法保留 para- 的语义色彩，同时让脚注提供较顺畅的替代说法。
- source_word: ἵνα πλεονάσῃ
  choice: 为要使……增多
  rationale: 保留 ἵνα 加虚拟式所表达的目的意味，不把它弱化为单纯结果，也不借翻译消解其中的神学张力。
- source_word: τὸ παράπτωμα
  choice: 过犯
  rationale: “过犯”表达具体的越界或冒犯行为，并与本段亚当之过犯的语境相符。
- source_word: οὗ δὲ
  choice: 只是……在哪里
  rationale: οὗ 自然译为“在哪里”；δὲ 在后半句标示鲜明对照，译作“只是”使中文衔接自然。
- source_word: ἡ ἁμαρτία
  choice: 罪
  rationale: 这是 ἁμαρτία 在保罗书信中的标准译法，此处无需改换。
- source_word: ὑπερεπερίσσευσεν
  choice: 更加满溢
  rationale: 该强化复合动词表示远超过一般的增多或充足；“更加满溢”既表现丰盛意象，也保留强化程度。
- source_word: ἡ χάρις
  choice: 恩典
  rationale: “恩典”是 χάρις 在此神学语境中准确、清楚且通行的现代中文译法。
theological_decisions:
- issue: ἵνα 在“律法……为要使过犯增多”中应译作目的还是结果
  choice: 采用目的表达：“为要使过犯增多”
  alternative: “结果过犯增多了”或“以致过犯增多”
  rationale: 希腊文明确使用 ἵνα 加虚拟式。译文应保留目的意味及其神学张力，而不因担心读者误解为上帝赞同罪，就暗中改写为纯粹结果。
- issue: ὑπερεπερίσσευσεν 的强化程度
  choice: 译作“更加满溢”
  alternative: “越发增多”或“格外充足”
  rationale: 此词的构词与语境都强调恩典不只是与罪同步增加，而是以更丰盛的方式超过它；“满溢”传达这种超越性的丰盛，同时不加入原文之外的教义说明。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“从旁进入”略带陌生感，是为保留希腊动词的附加进入意味，并以脚注辅助理解；后半句用“更加满溢”形成鲜明而自然的修辞高潮。
