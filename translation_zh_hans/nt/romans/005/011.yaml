id: ROM.5.11
reference: Romans 5:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οὐ μόνον δέ, ἀλλὰ καὶ καυχώμενοι ἐν τῷ θεῷ διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, δι’ οὗ νῦν τὴν καταλλαγὴν ἐλάβομεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/011.yaml
  text: And not only that[a], but we also boast in God through our Lord Jesus the Messiah[d][c][b], through whom we have now received the reconciliation.
translation:
  language: zh_hans
  text: '不但如此，我们还借着我们的主耶稣基督，以神为荣[a]；借着他，我们如今已经领受了和好[b]。


    [a] “以神为荣”也可译为“因神欢喜”或“因神欢欣夸耀”。

    [b] “领受了和好”也可译为“得以和好”；原文强调和好是人所领受的。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以神为荣”也可译为“因神欢喜”或“因神欢欣夸耀”。
    reason: 保留καυχάομαι兼有夸耀、引以为荣和欢欣的语义幅度。
  - marker: b
    text: “领受了和好”也可译为“得以和好”；原文强调和好是人所领受的。
    reason: 说明καταλλαγή与ἐλάβομεν的搭配，并提供更符合汉语习惯的替代译法。
lexical_decisions:
- source_word: καυχώμενοι
  choice: 以……为荣
  rationale: 该词有“夸耀、引以为荣、欢欣”的语义范围。这里夸耀的对象是神，不是自我，因此“以神为荣”既保留保罗用词中的夸耀意味，也避免现代汉语“自夸”所带来的负面误解。
- source_word: ἐν τῷ θεῷ
  choice: 以神为荣
  rationale: 介词短语指出夸耀或欢欣所指向的对象；现代汉语用“以……为荣”可自然表达这一关系。
- source_word: διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: 借着我们的主耶稣基督
  rationale: διὰ加属格表达中介，译作“借着”；κύριος在此为基督论称号，译作“主”；Ἰησοῦ Χριστοῦ采用现代汉语基督教通行且能体现称号传统的“耶稣基督”。
- source_word: καταλλαγήν
  choice: 和好
  rationale: 该名词指敌对关系得到修复、恢复和睦。汉语“和好”准确而自然；希腊文的定冠词在汉语中无需机械译出。
- source_word: ἐλάβομεν
  choice: 已经领受了
  rationale: λαμβάνω在此表示接受所赐予的和好；结合νῦν，用“如今已经领受了”表达已经发生并具有当前结果的行动。
theological_decisions:
- issue: καταλλαγή所表达的和好是行动、状态还是所领受的恩惠
  choice: 领受了和好
  alternative: 得以和好
  rationale: 保留ἐλάβομεν“领受”的明确措辞，使和好呈现为借着基督领受的现实，而不把它仅改写为人的状态；脚注提供更自然的状态式译法。
- issue: Χριστός作为称号的译法
  choice: 基督
  alternative: 弥赛亚（受膏者）
  rationale: “基督”是Χριστός在现代标准汉语中的通行对应词，并在“耶稣基督”这一组合中自然庄重；其称号含义是“受膏者”，但正文不以解释性译法取代通行称谓。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“不但如此……还……”再现οὐ μόνον δέ, ἀλλὰ καί的递进结构；分号区分以神为荣的陈述与借基督领受和好的说明，同时保持两者紧密相连。
