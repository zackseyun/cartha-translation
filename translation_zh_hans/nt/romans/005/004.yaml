  text: ἡ δὲ ὑπομονὴ δοκιμήν, ἡ δὲ δοκιμὴ ἐλπίδα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/004.yaml
  text: and endurance produces proven character[a], and proven character produces hope.
translation:
  language: zh_hans
  text: 忍耐产生经受考验的品格[a]，经受考验的品格产生盼望。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“受过考验的品格”，也可理解为“蒙认可”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπομονή
  choice: 忍耐
  rationale: 表达在患难中持续承受、坚定不退的含义；简洁自然，并与上下文的递进关系相称。
- source_word: δοκιμή
  choice: 经受考验的品格
  rationale: 该词在此更可能指经过检验而显为真实可靠的品格，是忍耐所产生的结果，而不只是考验的过程。
- source_word: ἐλπίς
  choice: 盼望
  rationale: 这是保罗书信中自然且通行的对应词；其依据在神里面的语境含义由上下文承载，无须在正文中增添限定。
- source_word: δὲ
  choice: 省略不译，以并列句承接
  rationale: 这里的 δέ 推进递进链条，并无明显转折；现代汉语借两个并列分句即可自然表达这种承接。
- source_word: ellipsis of verb (κατεργάζεται supplied from Romans 5:3)
  choice: 产生
  rationale: 希腊文沿用上文动词而省略；汉语补出“产生”，可清楚呈现各环节之间的因果递进，同时不过度解释。
theological_decisions:
- issue: δοκιμή 在属灵成长递进关系中的含义
  choice: 经过考验而证实的品格
  alternative: 考验的过程；蒙认可
  rationale: 在本节链条中，δοκιμή 是忍耐带来的结果，因此译为经过考验而显明真实的品格较合适；脚注保留“蒙认可”这一词义可能，不将神学张力单向化解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“经受考验的品格”稍具书面感，但能准确保留 δοκιμή 的受试验并获证实之意；重复该短语，以呈现原文清晰的链式递进。
