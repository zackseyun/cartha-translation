revisions:
- from: 这恩赐也不像那借着一个犯罪的人而来的[a]；原来，审判由一次过犯[b]而来，导致定罪；恩典的赏赐却由许多过犯而来，带来称义[c]。
  to: 这礼物并不像借着一个犯罪的人所带来的结果[a]；原来，审判由一次过犯[b]而来，导致定罪；恩赐却由许多过犯而来，带来称义[c]。
  rationale: 修订只处理安全且必要的汉语表达问题：补足首句比较中原文省略、但汉语通常需要明示的“结果”，并以“礼物／恩赐”自然对应δώρημα／χάρισμα。保留“由一次过犯”及其脚注所呈现的语法歧义，也保留“称义”及其司法性替代译法。
