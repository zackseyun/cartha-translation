  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ οὐχ ὡς δι’ ἑνὸς ἁμαρτήσαντος τὸ δώρημα· τὸ μὲν γὰρ κρίμα ἐξ ἑνὸς εἰς κατάκριμα, τὸ δὲ χάρισμα ἐκ πολλῶν παραπτωμάτων εἰς δικαίωμα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/016.yaml
  text: And the gift is not like what came through the one who sinned[a]. For the judgment from one trespass led to condemnation[c][b], but the gracious gift from many trespasses led to justification.
translation:
  language: zh_hans
  text: 这礼物并不像借着一个犯罪的人所带来的结果[a]；原来，审判由一次过犯[b]而来，导致定罪；恩赐却由许多过犯而来，带来称义[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这礼物并不像借着那一个犯罪的人所带来的结果。”
    reason: 希腊文的“一个”可按上下文理解为特指的“那一个”，即亚当；正文保留较贴近字面的表达。
  - marker: b
    text: 或译：“由一个人而来。”
    reason: 希腊文这里只说“由一个而来”，所省略的名词可能理解为“过犯”，也可能理解为“人”；正文依据与“许多过犯”的对照补作“一次过犯”。
  - marker: c
    text: 或译：“带来判为义的裁决”或“带来宣告无罪”。
    reason: δικαίωμα在这里具有司法含义，可指与定罪相反的正义裁决或无罪宣告。
lexical_decisions:
- source_word: δώρημα
  choice: 恩赐
  rationale: 该词指所赐下的礼物；译作“恩赐”自然简洁，也符合本段谈论神所赐之物的语境，但不额外加入“白白”一词。
- source_word: δι’ ἑνὸς ἁμαρτήσαντος
  choice: 借着一个犯罪的人而来的
  rationale: 保留分词结构中的人物指向以及希腊文简略的比较表达；“一个”也不强行确定为“那个”，让上下文辨明所指。
- source_word: κρίμα
  choice: 审判
  rationale: 此处指司法性的裁断，与后面的“定罪”和“称义”形成法庭语义场。
- source_word: ἐξ ἑνὸς
  choice: 由一次过犯而来
  rationale: 中性形式ἑνός在与后文“许多过犯”的对照中最可能省略“过犯”；正文补出“一次过犯”以使现代汉语通顺，同时以脚注保留“由一人而来”的可能。
- source_word: κατάκριμα
  choice: 定罪
  rationale: 准确表达司法上判定有罪的结果，并与“称义”构成清楚对照。
- source_word: χάρισμα
  choice: 恩典的赏赐
  rationale: χάρισμα突出源于恩典的赐予；此译法既保留“恩典”内涵，也与前面的δώρημα“恩赐”略作区分。
- source_word: παραπτωμάτων
  choice: 过犯
  rationale: 该词表示越界、失足式的违犯；“过犯”兼具道德和法律色彩，在现代中文中也较为清楚。
- source_word: δικαίωμα
  choice: 称义
  rationale: 在与κατάκριμα“定罪”的司法对照中，该词指与定罪相反的有利裁决或结果；“称义”准确传达保罗书信中的法庭性含义，脚注同时保留更具体的译法。
theological_decisions:
- issue: δικαίωμα与κατάκριμα对照时的司法含义
  choice: 称义
  alternative: 判为义；宣告无罪
  rationale: 句子以“审判—定罪”和“恩典的赏赐—δικαίωμα”形成司法性的对照。“称义”能简洁表达与定罪相反的裁决结果，但脚注保留“判为义”和“宣告无罪”这两种较具体的表达，以免把该词的语义范围收窄为单一术语。
- issue: ἐξ ἑνὸς中ἑνός所省略的对象
  choice: 一次过犯
  alternative: 一个人
  rationale: 后半句明确说“由许多过犯而来”，因而“一次过犯”最能呈现平行对照；不过语法上的简略形式也可让人联想到前文的“一个犯罪的人”，故以脚注保留另一理解。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以分号呈现原文前后对照，以“原来……却……”显明论证关系；保留首句的压缩表达，不擅自补明其完整比较对象。
