  to: 我们也借着他，因着信，已经得以进入这恩典；我们如今站立在其中，并且因盼望上帝的荣耀而夸耀[a]。
  rationale: 修订保留“借着他”“因着信”“恩典”和“上帝的荣耀”等关键术语；以“已经得以进入”表达已获得的进入地位，以“如今站立在其中”表达完成时的持续结果。删除“得享”以免把盼望的具体实现方式写入正文；将καυχώμεθα译为“夸耀”，并以脚注保留其正面语境下的替代译法。
