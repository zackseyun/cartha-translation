  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: δι’ οὗ καὶ τὴν προσαγωγὴν ἐσχήκαμεν τῇ πίστει εἰς τὴν χάριν ταύτην ἐν ᾗ ἑστήκαμεν, καὶ καυχώμεθα ἐπ’ ἐλπίδι τῆς δόξης τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/002.yaml
  text: through whom we also have obtained access by faith into this grace in which we stand[a], and we boast in the hope of the glory of God.
translation:
  language: zh_hans
  text: 我们也借着他，因着信，已经得以进入这恩典；我们如今站立在其中，并且因盼望上帝的荣耀而夸耀[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“欢喜”或“欢跃”。
    reason: καυχώμεθα直义可指夸耀；在此正面语境中，也可译为“欢喜”或“欢跃”。
lexical_decisions:
- source_word: προσαγωγή
  choice: 得以进入
  rationale: 表达蒙引领进入、获准亲近的含义；用动词短语衔接 εἰς，符合现代汉语，也不把此词局限为单纯的空间入口。
- source_word: πίστει
  choice: 凭信心
  rationale: 将与格理解为工具或途径，简洁表达进入这恩典所凭借的是信心。
- source_word: χάρις
  choice: 恩典
  rationale: 在保罗书信语境中指上帝白白赐予的恩惠及由此而有的蒙恩地位；“恩典”既准确又为普通读者熟悉。
- source_word: ἑστήκαμεν
  choice: 现在所站立
  rationale: 希腊语完成时强调先前进入而形成、如今持续的状态；加入“现在”使这一时态意义在汉语中更清楚，同时保留“站立”的意象。
- source_word: καυχώμεθα
  choice: 以……为荣
  rationale: 保留该词正面的夸耀、自豪之意及保罗有意形成的张力，比单译“欢喜”更接近其词汇力度，又避免现代汉语“夸口”常有的纯负面色彩。
- source_word: ἐπ’ ἐλπίδι
  choice: 以盼望……为荣
  rationale: 在汉语句法中将盼望作为夸耀所依据或指向的内容，保留介词结构可表示根据或范围的弹性。
- source_word: δόξης τοῦ θεοῦ
  choice: 得享上帝的荣耀
  rationale: 这里的盼望指向将来有分于上帝荣耀；“得享”使省略的关系在汉语中自然，但不具体限定这种有分的方式。
theological_decisions:
- issue: καυχώμεθα 的正面神学用法及修辞张力
  choice: 以……为荣
  alternative: 欢喜；夸耀；夸口
  rationale: “以……为荣”保留因盼望而自豪、夸耀的核心意思，也维持保罗将通常可能负面的行为转向上帝之盼望的张力；脚注列出较强的直译可能。
- issue: δόξης τοῦ θεοῦ 与信徒之盼望的关系
  choice: 盼望得享上帝的荣耀
  alternative: 盼望上帝的荣耀；盼望看见上帝的荣耀
  rationale: “得享”反映信徒盼望有分于这荣耀的语境，而不限定为仅仅观看，也不把属格解释为信徒自己的荣耀。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“借着他”“凭信心”“恩典”“上帝的荣耀”保持保罗论述中的神学词汇连续性；句序尽量贴近希腊文，同时以“得以进入”“现在所站立”使汉语清楚流畅。
