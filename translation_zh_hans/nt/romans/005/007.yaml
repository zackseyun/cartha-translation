  text: μόλις γὰρ ὑπὲρ δικαίου τις ἀποθανεῖται· ὑπὲρ γὰρ τοῦ ἀγαθοῦ τάχα τις καὶ τολμᾷ ἀποθανεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/007.yaml
  text: For hardly will anyone die for a righteous person[b][a]; though perhaps for a good person someone might even dare to die.
translation:
  language: zh_hans
  text: 因为几乎没有人会为义人[a]死；但也许有人甚至敢为好人[b]而死。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊语采用阳性形式，也可理解为“一个义人”；这里很可能是泛指人，并不特别限定男性。
    reason: lexical_alternative
  - marker: b
    text: “义人”与“好人”的区别可能是有意的。“好人”也可能带有善良、施惠于人的意味，但原文没有进一步说明。
    reason: alternative_reading
lexical_decisions:
- source_word: μόλις
  choice: 几乎没有
  rationale: 表达这种事极少发生、几乎不会发生的意思，比直译为“勉强”更符合本句语境，也自然体现保罗所强调的罕见程度。
- source_word: ὑπὲρ
  choice: 为
  rationale: 在这里表示为了某人、代某人而死；“为”简洁自然，并保留受益或代表性的含义。
- source_word: δικαίου
  choice: 义人
  rationale: 这是名词化形容词，指具有公义或正直品格的人。“义人”既保留保罗的重要词汇类别，也符合现代汉语圣经语体。
- source_word: ἀποθανεῖται
  choice: 会……死
  rationale: 原文为将来时，在概括性陈述中用“会”能自然表达一般可能性，同时不把语气强化为绝对预言。
- source_word: τοῦ ἀγαθοῦ
  choice: 好人
  rationale: 保留与“义人”的用词差别，不预先断定其特指“恩人”或“施惠者”；“好人”在现代汉语中自然且范围适当。
- source_word: τάχα
  choice: 也许
  rationale: 准确表达可能但不确定的语气，保持原文审慎的措辞。
- source_word: καὶ
  choice: 甚至
  rationale: 这里具有递进作用，突出竟有人敢于这样做。
- source_word: τολμᾷ
  choice: 敢
  rationale: 直接传达采取非同寻常行动所需的勇气；与“也许”和“甚至”合用，可自然呈现原文的可能语气与递进力度。
- source_word: ἀποθανεῖν
  choice: 死
  rationale: 直接翻译不定式，并在汉语中以简洁形式重复死亡主题。
theological_decisions:
- issue: 是否保留 δικαίου 与 ἀγαθοῦ 的区别
  choice: 分别译为“义人”和“好人”
  alternative: 把两者视为近义词，以相同或几乎相同的词翻译
  rationale: 原文连续采用两个不同词，可能有意区分严格正直的人与更具善意、令人感恩的人。正文保留差别，脚注说明其确切关系并不明确，避免消解原文的张力。
- issue: ὑπὲρ 在本节是否明确表达代替受刑的完整神学含义
  choice: 译为宽泛而自然的“为”
  alternative: 明确译为“代替”
  rationale: ὑπὲρ 在语境中可包含为某人利益或代表某人的意义，但本节单凭介词不足以限定为某一种技术性代替理论；“为”保留范围，让上下文阐明其含义。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“几乎没有人会”清楚表达 μόλις 的罕见意味；分号保留两小句的紧密对照。“义人”沿用重要的保罗词汇，“好人”则维持原文不同词项及其可能的意义张力。
