id: ROM.5.17
reference: Romans 5:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἰ γὰρ τῷ τοῦ ἑνὸς παραπτώματι ὁ θάνατος ἐβασίλευσεν διὰ τοῦ ἑνός, πολλῷ μᾶλλον οἱ τὴν περισσείαν τῆς χάριτος καὶ τῆς δωρεᾶς τῆς δικαιοσύνης λαμβάνοντες ἐν ζωῇ βασιλεύσουσιν διὰ τοῦ ἑνὸς Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/017.yaml
  text: For if[a], by the trespass of the one, death reigned through the one, much more will those who receive the abundance of grace and the gift of righteousness reign in life through the one[b], Jesus the Messiah.
translation:
  language: zh_hans
  text: 因为若因那一人的过犯，死亡就借着那一人掌权，那么，那些领受丰盛的恩典和所赐的义[a]的人，就更要借着那一位耶稣基督[b]在生命中掌权。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “义”也可译作“公义”或“正义”。
    reason: lexical_alternative
  - marker: b
    text: “基督”意为“弥赛亚”，即“受膏者”。
    reason: lexical_alternative
lexical_decisions:
- source_word: παραπτώματι
  choice: 过犯
  rationale: 既表达越界、失足所构成的罪责，也自然适合本段亚当与基督的对比。
- source_word: ἐβασίλευσεν / βασιλεύσουσιν
  choice: 掌权
  rationale: 保留前后呼应的王权隐喻；现代汉语中比重复使用“作王”更自然，同时没有削弱统治含义。
- source_word: περισσείαν τῆς χάριτος
  choice: 丰盛的恩典
  rationale: 表达恩典充盈有余，措辞简明庄重。
- source_word: δωρεᾶς τῆς δικαιοσύνης
  choice: 所赐的义
  rationale: 将属格结构理解为以“义”为内容或结果的恩赐；“所赐”避免汉语“义的礼物”的生硬，同时保留 δωρεά 的赠予性质。
- source_word: λαμβάνοντες
  choice: 领受
  rationale: 表明这些人以接受丰盛恩典和义之恩赐为特征；“领受”符合礼物语境。
- source_word: ἐν ζωῇ
  choice: 在生命中
  rationale: 贴近希腊文的简洁表达，并保留与前半句死亡掌权的对照。
- source_word: διὰ τοῦ ἑνὸς
  choice: 借着那一人
  rationale: 保留两处“那一人”的重复及媒介意义，使亚当与耶稣基督的平行对比清楚。
- source_word: Ἰησοῦ Χριστοῦ
  choice: 耶稣基督
  rationale: 这是现代汉语中自然且固定的姓名—称号组合；另以脚注说明“基督”的称号含义。
theological_decisions:
- issue: δικαιοσύνης 在保罗此处的含义
  choice: 所赐的义
  alternative: 所赐的公义；所赐的正义
  rationale: 本段称义与亚当—基督的语境支持“义”，但该词也可凸显公义或正义；脚注保留这一词义幅度，不把它缩减为单一教义解释。
- issue: 人在生命中“掌权”的时间与范围
  choice: 就更要……在生命中掌权了
  alternative: 将在生命中掌权
  rationale: 希腊文 βασιλεύσουσιν 是将来时；汉语“就更要……了”保留将来指向，同时不额外裁定这是仅指末世、仅指今生，还是兼具两者。
- issue: Χριστός 的称号性质
  choice: 耶稣基督
  alternative: 耶稣弥赛亚（受膏者）
  rationale: “耶稣基督”在现代汉语中自然且近于姓名化，但 Χριστός 本有“受膏者／弥赛亚”的称号意义，因此在脚注中明确。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。通过重复“那一人”和“掌权”保存原文的平行结构与王权隐喻；句中加入“那么”以理清较长的条件—递进关系。所有脚注标记均置于对应词语之后。
