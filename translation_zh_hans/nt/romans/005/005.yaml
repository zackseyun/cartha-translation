  naturalness: 'The meaning is clear, but “爱已经借着……圣灵，浇灌在我们心里” is slightly awkward in modern Mandarin: “浇灌” more commonly takes an agent who irrigates, whereas the Greek presents God’s love as what has been poured out. “倾注在” more naturally renders this passive perfect image.'
  terminology: “盼望”“蒙羞”“上帝”“圣灵” are appropriate in a modern, dignified Chinese Bible register. “所赐给我们的圣灵” makes the Greek participial relation explicit and flows naturally.
