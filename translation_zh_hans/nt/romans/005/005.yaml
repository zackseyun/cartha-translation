id: ROM.5.5
reference: Romans 5:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἡ δὲ ἐλπὶς οὐ καταισχύνει· ὅτι ἡ ἀγάπη τοῦ θεοῦ ἐκκέχυται ἐν ταῖς καρδίαις ἡμῶν διὰ πνεύματος ἁγίου τοῦ δοθέντος ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/005.yaml
  text: And hope does not put to shame[a], because the love of God has been poured out in our hearts through the Holy Spirit[b], who was given to us.
translation:
  language: zh_hans
  text: 盼望不会使我们蒙羞[a]，因为上帝的爱[b]已经借着所赐给我们的圣灵，倾注在我们心里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不会使我们失望。”
    reason: lexical_alternative
  - marker: b
    text: “上帝的爱”也可理解为“我们对上帝的爱”，但这种理解可能性较小。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλπίς
  choice: 盼望
  rationale: 这是现代汉语中自然且庄重的对应词；定冠词在此作类指，无须另译。
- source_word: δέ
  choice: 不单独译出
  rationale: 此处是轻微的承接连接；汉语依靠句间衔接即可自然表达，不宜用“但是”强化对比。
- source_word: καταισχύνει
  choice: 不会使我们蒙羞
  rationale: 保留该词核心的羞耻含义；根据上下文补出“我们”，使汉语宾语明确，同时不把意义弱化为单纯的失望。
- source_word: ἡ ἀγάπη τοῦ θεοῦ
  choice: 上帝的爱
  rationale: 正文保留属格结构的简洁表达；上下文较支持这是上帝对人的爱，但属格的另一种理解收入脚注。
- source_word: ἐκκέχυται
  choice: 已经……浇灌
  rationale: “已经”体现完成时所表达的既成行动及其持续结果；“浇灌”保留液体倾注的形象。
- source_word: ἐν ταῖς καρδίαις ἡμῶν
  choice: 在我们心里
  rationale: 直接而自然地表达内在生命与体验的所在。
- source_word: διὰ πνεύματος ἁγίου
  choice: 借着……圣灵
  rationale: 表达διά加属格在此的媒介或工具意义；“圣灵”按现代中文基督教通行写法处理。
- source_word: τοῦ δοθέντος ἡμῖν
  choice: 赐给我们的
  rationale: 作定语紧接“圣灵”，准确表达分词修饰关系，并避免汉语中不必要的关系从句。
theological_decisions:
- issue: ἡ ἀγάπη τοῦ θεοῦ中属格的含义
  choice: 正文译作“上帝的爱”，按语境主要理解为上帝对我们的爱
  alternative: 我们对上帝的爱
  rationale: 圣灵把这爱浇灌在信徒心里的因果说明，更支持主语属格，即爱源自上帝；但希腊语形式本身容许宾语属格理解，因此在脚注保留另一可能。
- issue: καταισχύνει的语义侧重
  choice: 使我们蒙羞
  alternative: 使我们失望
  rationale: 正文保留羞耻—荣辱层面的核心语义；“使我们失望”是语境中可能的结果性表达，但较弱化原词意象，故列入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“浇灌在我们心里”保留原文鲜明意象；调整语序，把“赐给我们的”置于“圣灵”之前，使句子符合自然汉语。脚注标记按其实际所说明的词语安放：词义脚注置于“蒙羞”后，属格歧义脚注置于“上帝的爱”后。
