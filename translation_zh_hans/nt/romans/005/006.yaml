  text: ⸂Ἔτι γὰρ⸃ Χριστὸς ὄντων ἡμῶν ἀσθενῶν ⸀ἔτι κατὰ καιρὸν ὑπὲρ ἀσεβῶν ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/006.yaml
  text: For while we were still weak[a], at the right time Messiah died for the ungodly.
translation:
  language: zh_hans
  text: 因为，当我们还软弱的时候，弥赛亚在适当的时候为不敬虔的人死了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Χριστὸς
  choice: 弥赛亚
  rationale: 按其称号意义翻译为“弥赛亚”，既体现受膏者的身份，也符合本项目对 Χριστός 作称号时的通常处理。
- source_word: ὄντων ἡμῶν ἀσθενῶν
  choice: 我们还软弱时
  rationale: 以自然的时间从句表达属格独立结构；“软弱”保留人无力自救的宽泛含义，不把它限缩为身体虚弱或某一套教义术语。
- source_word: ἔτι
  choice: 还
  rationale: 表示这种软弱状态仍在持续。希腊文传本文本在句中位置和重复上存在差异，中文用一个“还”即可自然表达其语义。
- source_word: κατὰ καιρὸν
  choice: 在适当的时机
  rationale: 表达合宜、特定的时机，同时避免把经文未明说的安排者或具体时间加入正文。
- source_word: ὑπὲρ
  choice: 为
  rationale: “为”在中文中自然涵盖为其益处、代表或代替等可能语气，不在译文层面过早限定其精确的神学机制。
- source_word: ἀσεβῶν
  choice: 不敬虔的人
  rationale: 保留该词对人缺乏对上帝应有敬畏的道德及宗教含义；比单纯的“不信者”更贴近原词。
- source_word: ἀπέθανεν
  choice: 死了
  rationale: 直接对应简单过去时所陈述的历史事件，不作不必要扩展。
theological_decisions:
- issue: ὑπὲρ ἀσεβῶν 所表达的弥赛亚之死与不敬虔之人的关系
  choice: 为不敬虔的人
  alternative: 替不敬虔的人；代表不敬虔的人
  rationale: 原文明确表示弥赛亚的死关乎不敬虔之人的益处，但 ὑπέρ 本身容许“为了、代表、代替”等相近语气。“为”保留其神学分量及真实张力，不在正文中将它收窄为单一的系统神学表述。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我们还软弱时”简洁呈现持续状态；“适当的时机”自然表达 κατὰ καιρόν。脚注标记置于其所说明的“为不敬虔的人”之后。
