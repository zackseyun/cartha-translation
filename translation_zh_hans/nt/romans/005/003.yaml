id: ROM.5.3
reference: Romans 5:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οὐ μόνον δέ, ἀλλὰ καὶ ⸀καυχώμεθα ἐν ταῖς θλίψεσιν, εἰδότες ὅτι ἡ θλῖψις ὑπομονὴν κατεργάζεται,
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/003.yaml
  text: And not only that[a], but we also rejoice in afflictions, knowing that affliction produces endurance[c][b],
translation:
  language: zh_hans
  text: 不但如此，我们也以患难为荣[a]，因为知道患难[b]产生坚忍[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“欢喜”或“夸耀”。
    reason: lexical_alternative
  - marker: b
    text: “患难”也可译作“苦难”或“困苦”。
    reason: lexical_alternative
  - marker: c
    text: “坚忍”也可译作“忍耐”或“坚毅持守”。
    reason: lexical_alternative
lexical_decisions:
- source_word: καυχώμεθα
  choice: 夸耀
  rationale: 保留该词“夸口、引以为荣、欢然自豪”的核心语义，并延续上下文中以神的作为为根据的积极含义；这里不是自高自大的炫耀。
- source_word: θλίψεσιν / θλῖψις
  choice: 患难
  rationale: “患难”自然表达受压迫、困苦和痛楚的广泛处境。中文用同一词即可兼顾前半句复数的具体经历和后半句单数所表达的一般原则。
- source_word: ὑπομονήν
  choice: 坚忍
  rationale: “坚忍”兼有承受压力与持守不退的含义，比单纯的“忍耐”更能体现持续不懈。
- source_word: κατεργάζεται
  choice: 产生
  rationale: 准确传达造成结果、成就某种效果的意思，且符合现代汉语表达。
- source_word: εἰδότες
  choice: 因为知道
  rationale: 将希腊文分词所表达的认知根据自然地显明出来；这里说明信徒为何能在患难中夸耀。
theological_decisions:
- issue: καυχώμεθα在属灵语境中的含义
  choice: 译作“夸耀”，保留以神的作为为根据而夸口、引以为荣的张力
  alternative: 译作“欢喜”或“引以为荣”
  rationale: “欢喜”较自然，却会淡化καυχάομαι本有的夸口色彩；“夸耀”保留保罗用词的力度，而上下文使其不被理解为自我炫耀。
- issue: 患难与坚忍之间的关系
  choice: 译作“患难产生坚忍”
  alternative: 译作“患难使人学会忍耐”
  rationale: 直译因果关系，不额外说明机制，也不暗示患难在任何情况下都会自动带来成熟。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不但如此……也……”承接前文；“在患难中”紧贴希腊文介词结构，避免添加原文没有的“我们的”。标点按独立经节处理。
