source:
  edition: SBLGNT
  text: ὥσπερ γὰρ διὰ τῆς παρακοῆς τοῦ ἑνὸς ἀνθρώπου ἁμαρτωλοὶ κατεστάθησαν οἱ πολλοί, οὕτως καὶ διὰ τῆς ὑπακοῆς τοῦ ἑνὸς δίκαιοι κατασταθήσονται οἱ πολλοί.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/019.yaml
  text: For just as through the disobedience of the one man the many were made sinners[c][b][a], so also through the obedience of the one man the many will be made righteous.
translation:
  language: zh_hans
  text: 因为，正如因那一个人的悖逆，许多人成了罪人[a]；照样，也因那一位的顺服，许多人将成为义人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“许多人被构成为罪人。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“许多人将被构成为义人。”
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακοῆς
  choice: 悖逆
  rationale: 表示不听从、违背命令；“悖逆”以庄重而自然的现代汉语表达其主动抗命之意，并与“顺服”形成清楚对照。
- source_word: τοῦ ἑνὸς ἀνθρώπου
  choice: 那一个人
  rationale: 定冠词与数词在上下文中指向特定的一人，即前文所述的亚当；此译法保留其代表性及与后半句的对照。
- source_word: ἁμαρτωλοὶ
  choice: 罪人
  rationale: 该形容词在此作表语并具有名词性；“罪人”是直接、清楚的对应。
- source_word: κατεστάθησαν
  choice: 成了
  rationale: καθίστημι在此表达被置于或构成为某种身份、处境；“成了”符合现代汉语，同时不把含义限定为某一特定教义术语。
- source_word: οἱ πολλοί
  choice: 众人
  rationale: “众人”自然表达带冠词的复数群体概念，同时不擅自将其范围解释为“所有人”。
- source_word: ὑπακοῆς
  choice: 顺服
  rationale: 直接对应παρακοή的反面，保留亚当与基督之间严整的“悖逆—顺服”对照。
- source_word: τοῦ ἑνὸς
  choice: 那一位
  rationale: 希腊文后半句省略了ἀνθρώπου；“那一位”自然承接前句，并避免在正文中加入原文省略的名词。
- source_word: δίκαιοι
  choice: 义人
  rationale: 该形容词在此作表语；“义人”延续保罗书信中δικ-词族常用的“义”用语，并保持身份性表达。
- source_word: κατασταθήσονται
  choice: 将成为
  rationale: 未来被动形式与前半句κατεστάθησαν平行；“将成为”保留未来指向及构成某种身份的含义，而不改译为原文未使用的“称义”。
theological_decisions:
- issue: οἱ πολλοί的范围应译为“众人”还是解释为“所有人”
  choice: 众人
  alternative: 所有人；许多人
  rationale: 原文是οἱ πολλοί。译作“众人”保留群体性表达，不替保罗预先界定其范围，也维持经文中的神学张力。
- issue: κατασταθήσονται δίκαιοι应表达为身份构成，还是解释为法庭式宣告
  choice: 将成为义人
  alternative: 将被宣告为义；将被构成为义人
  rationale: 原文使用καθίστημι而非δικαιόω。“将成为义人”贴近原词，并避免把该句限定为某一种教义解释。
- issue: 第二个τοῦ ἑνὸς是否补出“人”
  choice: 那一位
  alternative: 那一个人
  rationale: 希腊文第二分句没有重复ἀνθρώπου，只以“那一位”承接前文；中文如此表达清楚自然，也保留原文的省略。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。“正如……照样……”保留原文严整的比较结构；分号突出亚当与基督两端的平行。“悖逆—顺服”“罪人—义人”“成了—将成为”分别对应原文的核心对照。
