  source_fidelity: 译文准确呈现了原文的推论与递进（πολλῷ οὖν μᾶλλον）、现今已经完成的被动称义（δικαιωθέντες νῦν）、以他的血为称义的依据／手段（ἐν τῷ αἵματι αὐτοῦ），以及将来借着他从那愤怒中得救（σωθησόμεθα δι’ αὐτοῦ ἀπὸ τῆς ὀργῆς）。正文没有将“愤怒”直接扩写为“神的愤怒”，保留了原文在本节中的含蓄性。
