id: ROM.5.9
reference: Romans 5:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: πολλῷ οὖν μᾶλλον δικαιωθέντες νῦν ἐν τῷ αἵματι αὐτοῦ σωθησόμεθα δι’ αὐτοῦ ἀπὸ τῆς ὀργῆς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/009.yaml
  text: Much more then[a], having now been justified by his blood[c][b], we shall be saved through him from the wrath.
translation:
  language: zh_hans
  text: 那么，我们现在既已因他的血[b]被称义[a]，就更必借着他得救，脱离那愤怒[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“被宣告为义”。
    reason: lexical_alternative
  - marker: b
    text: “因他的血”也可译作“借着他的血”。
    reason: lexical_alternative
  - marker: c
    text: 即上下文所指的神的愤怒。
    reason: cross_reference
lexical_decisions:
- source_word: πολλῷ οὖν μᾶλλον
  choice: 那么……就更必
  rationale: “那么”承接上文的推论关系；“更必”表达 πολλῷ…μᾶλλον 的递进力度，并与将来时主句结合，传达由较强理由推出的未来确据。
- source_word: δικαιωθέντες
  choice: 既已……被称义
  rationale: “既已”体现不定过去时被动分词相对于将来主句的先行动作；“被称义”保留 δικαιόω 在保罗书信中的法律性与神学连续性。
- source_word: νῦν
  choice: 现在
  rationale: 直接保留时间副词，指出称义所形成的当前处境。
- source_word: ἐν τῷ αἵματι αὐτοῦ
  choice: 因他的血
  rationale: 此处 ἐν 可表达凭借、依据或手段；“因他的血”在现代汉语中自然，也保留血作为称义依据或媒介的含义。
- source_word: σωθησόμεθα
  choice: 必……得救
  rationale: 以“必”配合“得救”表达将来被动形式及上下文中的未来确据，避免把该动词处理成命令或人的主动自救。
- source_word: δι’ αὐτοῦ
  choice: 借着他
  rationale: 准确表达 διά 加属格所表示的中介或施行者。
- source_word: ἀπὸ τῆς ὀργῆς
  choice: 脱离那愤怒
  rationale: “脱离”表达 ἀπό 的分离意义；“那愤怒”保留定冠词所指的特定愤怒，不在正文中擅自补出“神的”。
theological_decisions:
- issue: δικαιωθέντες 的称义含义
  choice: 正文采用“被称义”
  alternative: 被宣告为义
  rationale: “称义”是保罗相关语境中简洁而连贯的核心术语，同时用被动形式保留行动的承受关系；脚注提供较显明的法律性释义，但不在正文中把其含义限定为单一神学解释。
- issue: τῆς ὀργῆς 的所指
  choice: 译作“那愤怒”，不在正文补出拥有者
  alternative: 神的愤怒
  rationale: 上下文表明这是神的愤怒，但希腊文本本节没有明说“神的”；正文保留原文的含蓄，脚注说明语境所指。
- issue: 将来得救的语气
  choice: 译作“更必……得救”
  alternative: 将要……得救
  rationale: “必”结合递进论证体现未来被动陈述中的确据，而不把未来的得救与现今的称义混为同一时间层面。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“既已……就更必……”自然呈现保罗由已成事实推向未来确据的递进论证；保留“称义”“得救”等关键术语，并避免在正文中补出原文未明说的“神的”。
