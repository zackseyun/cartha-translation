id: ROM.5.18
reference: Romans 5:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ἄρα οὖν ὡς δι’ ἑνὸς παραπτώματος εἰς πάντας ἀνθρώπους εἰς κατάκριμα, οὕτως καὶ δι’ ἑνὸς δικαιώματος εἰς πάντας ἀνθρώπους εἰς δικαίωσιν ζωῆς·
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/018.yaml
  text: So then[a], as through one trespass condemnation came to all people, so also through one righteous act justification that brings life came to all people.
translation:
  language: zh_hans
  text: 这样看来，正如因一次过犯，定罪临到所有人；照样，也因一次义行，带来生命的称义[a]临到所有人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译为“生命的称义”。原文没有明说“生命”与“称义”之间的确切关系。
    reason: 保留 δικαίωσιν ζωῆς 的属格结构及其可能的语义幅度。
lexical_decisions:
- source_word: Ἄρα οὖν
  choice: 这样看来
  rationale: 承接上文并表达推论，比生硬的“因此所以”更符合现代汉语。
- source_word: παραπτώματος
  choice: 过犯
  rationale: 表示一次越界、失足的错误行为，并与后半句的“义行”形成清楚对照。
- source_word: κατάκριμα
  choice: 定罪
  rationale: 保留该词的司法意味，指判定有罪，而不泛化为一般的审判。
- source_word: δικαιώματος
  choice: 义行
  rationale: 此处为单数，指一项合乎正义的行为；“义行”简洁地保留行为性，并与“过犯”对应。
- source_word: δικαίωσιν ζωῆς
  choice: 带来生命的称义
  rationale: “称义”保留司法层面的含义，“带来生命”以自然汉语表达 ζωῆς 与 δικαίωσιν 之间可能具有的结果关系；脚注同时保留更贴近原文结构的译法。
- source_word: πάντας ἀνθρώπους
  choice: 所有人
  rationale: 准确表达该短语涵盖全体人的字面范围，并在比较的两半中保持完全一致，不在翻译中附加限制。
theological_decisions:
- issue: 后半句的“所有人”是否应按某种神学理解加以限定
  choice: 两处都译作“所有人”，不加限定
  alternative: 将后半句译为“所有信的人”或“所有称义的人”
  rationale: 希腊文在比较的两半重复同一短语 πάντας ἀνθρώπους。译文应保留这种平行结构及其神学张力，让上下文处理其范围，而不把解释直接写进正文。
- issue: 是否明确“一次过犯”和“一次义行”分别属于亚当和基督
  choice: 不在本节正文中补出“亚当”或“基督”
  alternative: 译作“因亚当的一次过犯”和“因基督的一次义行”
  rationale: 人物可由上下文辨明，但本节希腊文本身只说“一次过犯”和“一次义行”；不补名字可更准确地保存原句的表达方式。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。原文为省略谓语的平行句，译文补出两次“临到”，使句意在汉语中完整，同时保持“过犯—义行”“定罪—称义”“所有人—所有人”的对应结构。
