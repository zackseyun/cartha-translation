source:
  edition: SBLGNT
  text: ἵνα ὥσπερ ἐβασίλευσεν ἡ ἁμαρτία ἐν τῷ θανάτῳ, οὕτως καὶ ἡ χάρις βασιλεύσῃ διὰ δικαιοσύνης εἰς ζωὴν αἰώνιον διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/021.yaml
  text: so that[a], just as sin reigned in death[c][b], so also grace might reign through righteousness to eternal life through Jesus the Messiah our Lord.
translation:
  language: zh_hans
  text: 为要叫，正如罪曾在死亡中作王，恩典也照样借着义[a]作王，以至借着我们的主耶稣基督[b]得永生。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “义”也可译作“公义”或“正义”。
    reason: lexical_alternative
  - marker: b
    text: “基督”意为“弥赛亚”（受膏者），在这里是耶稣的称号。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: 为要使
  rationale: 保留目的或结果从句的功能，并自然承接上文。
- source_word: ἐβασίλευσεν / βασιλεύσῃ
  choice: 曾……作王 / 作王
  rationale: 保留保罗把“罪”和“恩典”人格化并赋予王权的比喻；“曾”体现前者的过去时态，而目的结构已表达后者的虚拟语气。
- source_word: ἐν τῷ θανάτῳ
  choice: 在死亡中
  rationale: 保留ἐν所表达的领域或范围，不擅自改译为“借着死亡”。
- source_word: ἡ χάρις
  choice: 恩典
  rationale: 采用现代汉语基督教语境中清楚而通行的对应词，同时保留人格化用法。
- source_word: διὰ δικαιοσύνης
  choice: 借着义
  rationale: διά加属格表示途径或媒介；“义”简洁地保留δικαιοσύνη兼具正直、公义与正义的语义范围，并以脚注提示替代译法。
- source_word: εἰς ζωὴν αἰώνιον
  choice: 以至永生
  rationale: “以至”保留εἰς的方向和结果含义，且不额外加入原文未明说的受益者。
- source_word: διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν
  choice: 借着我们的主耶稣基督
  rationale: 保留διά所表示的中介关系；按自然汉语词序将“我们的主”置于姓名和称号之前。
- source_word: Χριστοῦ
  choice: 基督
  rationale: “基督”是Χριστός在现代中文圣经中的通行称号；脚注说明其含义为“弥赛亚”，避免把它仅仅当作姓氏。
theological_decisions:
- issue: δικαιοσύνη在保罗书信中的含义
  choice: 义
  alternative: 公义；正义
  rationale: “义”能保持该词在关系、道德和司法层面的语义张力；不在正文中把它限定为单一的司法概念，并在脚注中保留其他可能译法。
- issue: Χριστός是称号还是近似姓名的固定形式
  choice: 基督
  alternative: 弥赛亚
  rationale: 正文采用现代中文最通行且庄重的形式，同时用脚注明确它是“弥赛亚”这一称号，保留原词的称号意义。
- issue: ἐν τῷ θανάτῳ表示领域还是手段
  choice: 在死亡中
  alternative: 借着死亡
  rationale: ἐν在此最自然地表示罪作王的领域；正文不把它解释成死亡是罪掌权的工具。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“作王”刻意保留原文贯穿本句的王权比喻。“这是……成就的”用于使句末的第二个διά短语在汉语中归属清楚；破折号标明这一解释性衔接，而不改变其所表达的中介关系。
