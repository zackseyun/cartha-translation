  to: 为要叫，正如罪曾在死亡中作王，恩典也照样借着义[a]作王，以至借着我们的主耶稣基督[b]得永生。
  rationale: 删除原文没有的“这是……成就的”及破折号，将“借着我们的主耶稣基督”恢复为直接关联“得永生”的介词短语。调整比较分句语序，使汉语更自然；其余术语、两处脚注锚点和脚注内容均予保留。
