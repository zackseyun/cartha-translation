  terminology: “恩典”“义”“永生”“我们的主耶稣基督”均为庄重、通行且适合保罗书信的译法。“作王”恰当保留βασιλεύω的王权隐喻。“义”的脚注适当保留“公义／正义”的词汇可能性；“基督”的脚注也交代其称号意义。
