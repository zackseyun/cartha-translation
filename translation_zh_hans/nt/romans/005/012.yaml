  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Διὰ τοῦτο ὥσπερ δι’ ἑνὸς ἀνθρώπου ἡ ἁμαρτία εἰς τὸν κόσμον εἰσῆλθεν καὶ διὰ τῆς ἁμαρτίας ὁ θάνατος, καὶ οὕτως εἰς πάντας ἀνθρώπους ὁ θάνατος διῆλθεν ἐφ’ ᾧ πάντες ἥμαρτον—
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/012.yaml
  text: Therefore[a], just as sin entered into the world through one man, and death through sin, so also death spread to all people, because all sinned—
translation:
  language: zh_hans
  text: 因此，正如罪借着一个人进入世界，死又借着罪而来；这样，死也临到所有人，因为[a]所有人都犯了罪——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或按传统译法：“在那一人里面，所有人都犯了罪。”
    reason: 保留ἐφ’ ᾧ的传统代表性或联合性解释，避免掩盖这一具有神学意义的歧义。
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: 因此
  rationale: 承接上文并引出推论；“因此”简洁自然，也保留原文的推论关系。
- source_word: δι’ ἑνὸς ἀνθρώπου
  choice: 借着一个人
  rationale: διά加属格表示媒介；此处所指是亚当。“一个人”既自然，也保留后文亚当与基督之间的对应。
- source_word: ἡ ἁμαρτία
  choice: 罪
  rationale: 采用保罗语境中的常用译法，不擅自扩展为罪性、罪行或某种特定教义表述。
- source_word: εἰς τὸν κόσμον εἰσῆλθεν
  choice: 进入世界
  rationale: 清楚表达εἰς的方向性，同时符合现代汉语习惯。
- source_word: διὰ τῆς ἁμαρτίας ὁ θάνατος
  choice: 死又借着罪而来
  rationale: 原文省略了与前句相应的动词，译文以“而来”自然补出，并保留“罪—死”的媒介关系和平行结构。
- source_word: οὕτως
  choice: 这样
  rationale: 标明前述事件与死亡临到众人之间的对应及结果关系。
- source_word: εἰς πάντας ἀνθρώπους
  choice: 临到所有人
  rationale: πάντας ἀνθρώπους泛指全人类；“所有人”在现代汉语中自然且不误限于男性。
- source_word: ὁ θάνατος διῆλθεν
  choice: 死也临到
  rationale: διέρχομαι在此表达死亡延及全人类；“临到”庄重自然，并准确呈现其普遍范围。
- source_word: ἐφ’ ᾧ
  choice: 因为
  rationale: 在本句中取因果义最为自然；由于该短语存在重要而历史悠久的不同理解，另译保留在脚注中。
- source_word: πάντες ἥμαρτον
  choice: 所有人都犯了罪
  rationale: 以简单过去事实表达不定过去时ἥμαρτον，不额外加入完成体或特定教义解释。
theological_decisions:
- issue: ἐφ’ ᾧ πάντες ἥμαρτον的含义
  choice: 因果义：“因为所有人都犯了罪”
  alternative: 代表性或联合性理解：“在他里面，所有人都犯了罪”
  rationale: ἐφ’ ᾧ在这里最自然可解作因果连接语，且不必把某一种关于亚当与全人类关系的教义体系写入正文。不过，这一短语在相关神学讨论中意义重大，传统的代表性理解因此以脚注保留。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“罪”和“死”保持简洁，不作教义性扩写。句末保留破折号，因为希腊原文的比较结构在本节尚未完成，将在后文继续。
