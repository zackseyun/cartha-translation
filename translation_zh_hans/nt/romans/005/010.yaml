  to: 因为，我们作仇敌的时候，尚且借着他儿子的死得以与上帝和好；既已和好，就更要借着他的生命[a]得救了。
  rationale: 修订消除了“若尚且”导致的汉语句法不顺，同时保留γάρ的承接、原文条件论证所表达的尚且—更何况递进、和好先于将来得救的时序，以及“他的生命”之ἐν短语的可争议语义。
