  text: εἰ γὰρ ἐχθροὶ ὄντες κατηλλάγημεν τῷ θεῷ διὰ τοῦ θανάτου τοῦ υἱοῦ αὐτοῦ, πολλῷ μᾶλλον καταλλαγέντες σωθησόμεθα ἐν τῇ ζωῇ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/010.yaml
  text: For if[a], while we were enemies, we were reconciled to God through the death of his Son, much more, having been reconciled, will we be saved by his life.
translation:
  language: zh_hans
  text: 因为，我们作仇敌的时候，尚且借着他儿子的死得以与上帝和好；既已和好，就更要借着他的生命[a]得救了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在他的生命里”。
    reason: 原文ἐν τῇ ζωῇ αὐτοῦ可理解为借着或因着他的生命，也可理解为在他的生命里，表示联合或关联。
lexical_decisions:
- source_word: εἰ γὰρ
  choice: 因为……若……
  rationale: “因为”承接上文的论证，“若”保留条件式表达；中文以分句结构自然呈现二者。
- source_word: ἐχθροὶ ὄντες
  choice: 我们还是仇敌的时候
  rationale: 既表达ὄντες所指的持续状态，也保留ἐχθροί在关系层面的直接含义。
- source_word: κατηλλάγημεν τῷ θεῷ
  choice: 与上帝和好了
  rationale: “和好”准确表达关系的恢复；“与上帝和好”是现代汉语自然说法，同时不额外说明和好的机制。
- source_word: διὰ τοῦ θανάτου τοῦ υἱοῦ αὐτοῦ
  choice: 借着他儿子的死
  rationale: “借着”表达διά加属格所表示的途径或凭借；“他儿子”保留原文的父子称谓。
- source_word: πολλῷ μᾶλλον
  choice: 就更要
  rationale: 配合前面的“尚且”，自然传达保罗由较难之事推至更确定之事的递进论证。
- source_word: καταλλαγέντες
  choice: 既已和好
  rationale: “既已”清楚表达不定过去时被动分词相对于将来得救的先行状态，并以中文简洁呈现被动结果。
- source_word: σωθησόμεθα
  choice: 得救
  rationale: 保留该词在本段中指向将来终极拯救的含义；“就更要”已经承担将来与确定性的语气。
- source_word: ἐν τῇ ζωῇ αὐτοῦ
  choice: 因他的生命
  rationale: 在死亡与生命的对照中，“因”可表达ἐν的工具或原因意义，同时以脚注保留处所或联合意义的可能性。
theological_decisions:
- issue: ἐν τῇ ζωῇ αὐτοῦ的语义作用
  choice: 工具或原因义：“因他的生命”
  alternative: 处所或联合义：“在他的生命里”
  rationale: 上下文将“借着他儿子的死”与“因他的生命”相对照，支持工具或原因义；但ἐν本身也可表达处所或联合关系，因此不在正文中排除另一理解，而以脚注保存其真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“尚且……就更要……”呈现原文强烈的递进论证；保留“若”以避免把希腊文的条件形式悄然改写为纯粹的原因陈述。
