  text: συνίστησιν δὲ τὴν ἑαυτοῦ ἀγάπην εἰς ἡμᾶς ὁ θεὸς ὅτι ἔτι ἁμαρτωλῶν ὄντων ἡμῶν Χριστὸς ὑπὲρ ἡμῶν ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/008.yaml
  text: But God demonstrates his own love for us in that while we were still sinners[c][b][a], Messiah died for us.
translation:
  language: zh_hans
  text: 但上帝这样彰显他自己对我们的爱[a]：我们还作罪人的时候，弥赛亚[b]就为我们[c]死了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “对我们的爱”也可译作“向我们所显的爱”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文为 Christos，传统译作“基督”；这里按称号译作“弥赛亚”。
    reason: lexical_alternative
  - marker: c
    text: “为我们”也可译作“为我们的缘故”或“代表我们”；原文在此未进一步限定这种关系的具体方式。
    reason: lexical_alternative
lexical_decisions:
- source_word: συνίστησιν
  choice: 彰显
  rationale: 该现在时动词在这里表示上帝以实际行动显出、证实自己的爱；“彰显”庄重自然，也保留其公开显明的意味。
- source_word: δὲ
  choice: 但
  rationale: 承接上文并形成温和转折；“但”清楚呈现论证的转向。
- source_word: τὴν ἑαυτοῦ ἀγάπην
  choice: 他自己的爱
  rationale: “自己的”保留反身代词ἑαυτοῦ的强调作用；“爱”直接对应ἀγάπη。
- source_word: εἰς ἡμᾶς
  choice: 对我们的
  rationale: εἰς在此表达爱所指向的对象；“对我们的爱”是现代汉语最自然的说法，同时以脚注保留“向我们”的方向性表达。
- source_word: ὅτι
  choice: 这样……：
  rationale: ὅτι引出上帝如何彰显其爱的具体内容；用“这样”配合冒号，较自然地呈现解释关系，而不误译为单纯原因。
- source_word: ἔτι ἁμαρτωλῶν ὄντων ἡμῶν
  choice: 我们还作罪人的时候
  rationale: 将属格独立结构译为时间性从句，并以“还”保留ἔτι的意味；“作罪人”比“有罪的时候”更直接对应复数名词ἁμαρτωλῶν。
- source_word: Χριστὸς
  choice: 弥赛亚
  rationale: 此处Χριστός具有称号意义，译作“弥赛亚”可显明其受膏者内涵；传统译法“基督”列于脚注。
- source_word: ὑπὲρ ἡμῶν
  choice: 为我们
  rationale: ὑπέρ说明他的死与我们的利益或代表关系有关；“为我们”既自然又不把介词限定为某一种有争议的赎罪机制。
- source_word: ἀπέθανεν
  choice: 死了
  rationale: 直接表达简单过去事件；句末“了”符合现代汉语对已发生事件的自然叙述。
theological_decisions:
- issue: Χριστός在保罗书信中的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 本节中该词仍带有称号功能；主文译出“弥赛亚”以保留其受膏君王的意义，同时以脚注提供传统音译，避免把一种中文教会惯用法绝对化。
- issue: ὑπὲρ ἡμῶν所表达的关系
  choice: 为我们
  alternative: 为我们的缘故；代表我们
  rationale: 原文明确指出弥赛亚之死是为着我们，却未仅凭此介词完整界定其代赎机制；采用较宽广的“为我们”，保留经文本身的神学张力。
- issue: ὅτι从句与“彰显”的逻辑关系
  choice: 以“这样”及冒号引出彰显之爱的事件
  alternative: 因为
  rationale: 该从句可说明上帝之爱的彰显内容或根据；主文采用解释性标点和措辞，避免将其过度收窄为单一因果关系。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“这样彰显……：”使句子论证关系清晰；“还作罪人的时候”保留原文的时间与让步意味。脚注标记均紧随其所说明的词语。
