  terminology: “预表”适当地对应τύπος；“那将要来者”保留了τοῦ μέλλοντος的实词化表达，未在正文添加“基督”。“违犯”可对应παράβασις，且“按……样式犯罪”保留比较关系，未擅自补入“明确命令”。脚注锚点与所释词语相符。
