  to: 然而，死亡从亚当到摩西作王，甚至统治那些没有按亚当违犯的样式犯罪的人。亚当是那将要来者[b]的预表[a]。
  rationale: 仅作措辞层面的安全修订：将“死亡一直作王，甚至辖制了”调整为“死亡从亚当到摩西作王，甚至统治”，使时间范围、死亡的拟人化王权意象和统治范围更连贯。保留“按亚当违犯的样式犯罪”的开放比较结构，也保留正文不直接指明“那将要来者”为基督的做法。
