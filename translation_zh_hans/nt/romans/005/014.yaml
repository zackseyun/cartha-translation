source:
  edition: SBLGNT
  text: ἀλλὰ ἐβασίλευσεν ὁ θάνατος ἀπὸ Ἀδὰμ μέχρι Μωϋσέως καὶ ἐπὶ τοὺς μὴ ἁμαρτήσαντας ἐπὶ τῷ ὁμοιώματι τῆς παραβάσεως Ἀδάμ, ὅς ἐστιν τύπος τοῦ μέλλοντος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/014.yaml
  text: Yet death reigned from Adam until Moses[a], even over those who did not sin in the likeness of Adam’s transgression[b], who is a type of the coming one.
translation:
  language: zh_hans
  text: 然而，死亡从亚当到摩西作王，甚至统治那些没有按亚当违犯的样式犯罪的人。亚当是那将要来者[b]的预表[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “预表”也可译作“模式”或“预示”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“那要来的一位”。上下文所指的是基督。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: 然而
  rationale: 承接上文形成强烈转折，同时符合现代汉语庄重、自然的表达。
- source_word: ἐβασίλευσεν ὁ θάνατος
  choice: 死亡一直作王
  rationale: 保留 βασιλεύω 的君王统治意象和保罗对死亡的拟人化表达；“一直”体现从亚当到摩西这一时段内的统治。
- source_word: ἀπὸ Ἀδὰμ μέχρι Μωϋσέως
  choice: 从亚当到摩西
  rationale: 清楚、简洁地表达时间范围。
- source_word: καὶ ἐπὶ τοὺς μὴ ἁμαρτήσαντας
  choice: 甚至辖制了那些……犯罪的人
  rationale: ἐπί 在“作王”的语境中表示统治所及的对象；“甚至”体现其出人意料的扩展范围，“辖制”使汉语句意完整。
- source_word: ἐπὶ τῷ ὁμοιώματι τῆς παραβάσεως Ἀδάμ
  choice: 照着亚当违犯的样式
  rationale: 较为形式对应地保留“样式/相似性”的比较关系，不把具体相似点预先解释为是否违反明文命令。
- source_word: παράβασις
  choice: 违犯
  rationale: 表达越过或违反既定界限、命令的含义，同时比名词化的“过犯”更适合此处汉语句法。
- source_word: τύπος
  choice: 预表
  rationale: 保留亚当与后来者之间具有前置对应和指向作用的类型论含义；脚注列出较少解释性的替代译法。
- source_word: τοῦ μέλλοντος
  choice: 那将要来者
  rationale: 按实词化分词翻译，不在正文中直接加入“基督”，从而保留原文措辞及其由语境确定的指向。
theological_decisions:
- issue: “那将要来者”的所指
  choice: 正文保留“那将要来者”，脚注说明上下文所指为基督。
  alternative: 在正文中直接译作“将要来的基督”。
  rationale: 罗马书5:12–21的语境建立了亚当与基督的对应关系，但原文此处并未直接写出“基督”；因此不在正文中补明，以免消除原文的表达张力。
- issue: 未按亚当违犯的样式犯罪
  choice: 保留“照着……样式”的比较结构。
  alternative: 解释为“没有像亚当那样违反明确命令”。
  rationale: 后者虽可能说明保罗的含义，却加入了本节没有明说的“明确命令”，因此正文保留原文较开放的比较方式。
translation_notes:
  register: 采用现代、庄重而可理解的书面汉语。“死亡作王”刻意保留原文的拟人化王权意象；“照着亚当违犯的样式”略带形式性，以避免将原文的比较关系过度解释。脚注标记放在各自所解释的词语之后。
