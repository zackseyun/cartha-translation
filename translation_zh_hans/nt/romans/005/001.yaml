  naturalness: “与上帝有了和平”及脚注的“保持和平”在现代标准汉语中不够自然。“与上帝和睦”是庄重、清晰且自然的关系性表达。脚注标记也应紧贴其所说明的词语或短语，而非一并置于句末。
  terminology: “称义”“因信”“主”“弥赛亚”均可保留。“耶稣，即弥赛亚”以合乎汉语的同位说明表达名字加称号，避免生硬的“耶稣弥赛亚”，并保留 Χριστός 的“弥赛亚”译法及传统“基督”的脚注说明。
