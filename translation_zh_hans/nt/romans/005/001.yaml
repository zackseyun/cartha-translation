  text: Δικαιωθέντες οὖν ἐκ πίστεως εἰρήνην ⸀ἔχομεν πρὸς τὸν θεὸν διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/001.yaml
  text: Therefore[a], since we have been justified by faith, we have peace with God through our Lord Jesus the Messiah[c][b],
translation:
  language: zh_hans
  text: 所以，我们既因信[b]得以称义，就借着我们的主耶稣，即弥赛亚[c]，与上帝和睦[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作：“让我们与上帝和睦。”
    reason: textual_variant
  - marker: b
    text: “因信”也可译作“以信为依据”。
    reason: lexical_alternative
  - marker: c
    text: 希腊文 Christos，意思是“弥赛亚”；传统译作“基督”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Δικαιωθέντες
  choice: 得以称义
  rationale: 希腊文为 δικαιόω 的不定过去时被动分词，表示已经承受称义这一行动。“称义”保留保罗语境中的法理意味，又不扩写为某一种教派性的完整教义表述。
- source_word: οὖν
  choice: 所以
  rationale: 表示由前文论证所得出的推论；“所以”自然、清楚地承接上下文。
- source_word: ἐκ πίστεως
  choice: 因信
  rationale: ἐκ 在此表示依据或途径；“因信”是简洁自然的汉语表达，同时保留 πίστις 的“信”这一核心语义。
- source_word: εἰρήνην
  choice: 和平
  rationale: 直译其关系性含义，不缩减为主观的“平安感”，也不直接改写成较具解释性的“和好”。
- source_word: ἔχομεν
  choice: 有了
  rationale: 依照所给 SBLGNT 正文的直陈式 ἔχομεν，译为已经拥有的事实；另一抄本读法所支持的劝勉式意思列入脚注。
- source_word: πρὸς τὸν θεὸν
  choice: 与上帝
  rationale: 与“和平”连用时，πρός 表达双方之间的关系，现代汉语自然译作“与上帝”。
- source_word: διὰ τοῦ κυρίου ἡμῶν
  choice: 借着我们的主
  rationale: διά 加属格表示中介或途径；“借着”准确表达此义，“主”保留 κύριος 的尊称。
- source_word: Ἰησοῦ Χριστοῦ
  choice: 耶稣弥赛亚
  rationale: Χριστός 是受膏者的称号，对应“弥赛亚”；汉语中“耶稣弥赛亚”可将名字与称号紧密相连，脚注说明传统译法“基督”。
theological_decisions:
- issue: δικαιωθέντες 在保罗神学中的含义
  choice: 译为“得以称义”，不进一步扩写
  alternative: “被宣告为义”或“成为义人”
  rationale: 原文陈述上帝使人称义的行动及其结果，却未在本节详述其全部机制；采用传统而宽容度较高的“称义”，避免替文本解决神学争议。
- issue: “与上帝有和平”的性质
  choice: 保留客观关系性的“与上帝有了和平”
  alternative: “心里有来自上帝的平安”或明确改译为“与上帝和好”
  rationale: 原文首先描述人与上帝之间的和平关系；εἰρήνη 本身是“和平/平安”，并非直接使用“和好”一词，因此不把解释写入正文。
- issue: ἔχομεν 的文本异文
  choice: 正文采用直陈式“有了”
  alternative: 依 ἔχωμεν 译为“让我们与上帝保持和平”
  rationale: 所指定的 SBLGNT 正文采用 ἔχομεν；重要异文仍在脚注中如实保留。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“所以……既……就……”清楚呈现推论结构；“得以称义”保持经文术语的连续性；正文中的所有脚注标记均已按 [a]、[b]、[c] 出现。
