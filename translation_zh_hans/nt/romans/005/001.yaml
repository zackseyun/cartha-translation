- from: 所以，我们既因信得以称义，就借着我们的主耶稣弥赛亚，与上帝有了和平。[a][b][c]
  to: 所以，我们既因信[b]得以称义，就借着我们的主耶稣，即弥赛亚[c]，与上帝和睦[a]。
  rationale: 修订以“与上帝和睦”替代不自然的“与上帝有了和平”，保留原文所表达的客观关系性和平，而不将其解释性地改写成“和好”或主观“平安”。异文脚注据 ἔχωμεν 的劝勉式准确改作“让我们与上帝和睦”，并将全部脚注标记移至相应词语之后。
