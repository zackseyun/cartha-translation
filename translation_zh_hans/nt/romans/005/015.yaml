source:
  edition: SBLGNT
  text: Ἀλλ’ οὐχ ὡς τὸ παράπτωμα, οὕτως καὶ τὸ χάρισμα· εἰ γὰρ τῷ τοῦ ἑνὸς παραπτώματι οἱ πολλοὶ ἀπέθανον, πολλῷ μᾶλλον ἡ χάρις τοῦ θεοῦ καὶ ἡ δωρεὰ ἐν χάριτι τῇ τοῦ ἑνὸς ἀνθρώπου Ἰησοῦ Χριστοῦ εἰς τοὺς πολλοὺς ἐπερίσσευσεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/015.yaml
  text: But the gift is not like the trespass[a]. For if by the trespass of the one man the many died, much more the grace of God and the gift by the grace of the one man, Jesus the Messiah[b], overflowed to the many.
translation:
  language: zh_hans
  text: 然而，恩赐不像过犯。若因那一人的过犯，众人死了，何况神的恩典和那因一人耶稣弥赛亚的恩典而有的恩赐[a]，更丰丰富富地临到众人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在一人耶稣弥赛亚的恩典中的恩赐”或“借着一人耶稣弥赛亚的恩典所赐的恩赐”。
    reason: ἐν χάριτι可表达领域、关联或工具；脚注保留这些语法上的可能，而正文采用自然中文表达。
lexical_decisions:
- source_word: παράπτωμα
  choice: 过犯
  rationale: 指越界或失足所犯的错误行为；“过犯”自然地保留了其道德与法律色彩，也适合亚当与弥赛亚的对照。
- source_word: χάρισμα
  choice: 恩赐
  rationale: 与“过犯”形成对照，并保留该词由恩典而来的礼物这一含义；下文的“恩典”进一步说明其性质。
- source_word: οἱ πολλοί / τοὺς πολλούς
  choice: 众人
  rationale: 中文“众人”能自然表达一人与群体的代表性对照；不译成“所有人”，以免替经文预先界定其范围。
- source_word: ἡ χάρις τοῦ θεοῦ
  choice: 神的恩典
  rationale: 准确而自然地保留属格结构，并与随后由恩典而来的赏赐平行。
- source_word: ἡ δωρεὰ ἐν χάριτι
  choice: 借着……恩典而来的赏赐
  rationale: 把ἐν理解为工具或关联用法，同时以脚注承认“在恩典中”这一较形式对应的可能译法。
- source_word: τοῦ ἑνὸς ἀνθρώπου
  choice: 那一个人
  rationale: 保留定冠词和“一人—众人”的鲜明对照，也与上下文所指的亚当相呼应。
- source_word: Ἰησοῦ Χριστοῦ
  choice: 耶稣弥赛亚
  rationale: Χριστός在此仍具有称号意义；“弥赛亚”让其受膏者含义可闻，同时符合现代中文表达。
- source_word: ἐπερίσσευσεν
  choice: 丰丰富富地临到
  rationale: 既传达περισσεύω超过所需、充盈有余的力度，也在中文中清楚说明恩典与赏赐临到众人的方向。
theological_decisions:
- issue: 亚当与弥赛亚平行结构中“众人”的范围
  choice: 保留“众人”，不改译为“所有人”。
  alternative: 译作“所有人”，明确代表性范围。
  rationale: 原文刻意采用“一人—众人”的修辞。保留“众人”可维护本节自身的张力，不把更大段落可能引出的神学结论预先带入。
- issue: πολλῷ μᾶλλον陈述的逻辑力度
  choice: 以“那么……岂不更……”表达由事实推出的更强结论。
  alternative: 直陈为“神的恩典……就更丰丰富富地临到众人”。
  rationale: 原文语法是直陈句而非疑问句；中文反问仅用于自然呈现其强烈的“何况”论证，并不表示不确定。
translation_notes:
  register: 采用现代、庄重而可朗读的标准普通话。“然而”承接前文转折；“丰丰富富”保留原文“更何况”与“充盈有余”的强化效果。所有脚注标记均已置于正文。
