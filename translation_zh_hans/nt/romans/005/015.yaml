    rationale: οἱ πολλοὶ直译性地标示为“众人／许多人”，并无与“都”相当的明示量词；“都”会把范围进一步明确化。应删除，以保留原文一人与众人的张力。
  - severity: medium
    issue: “岂不更……吗？”将直陈句改为反问句
    rationale: ἐπερίσσευσεν是直陈语气。虽然中文反问可表达论证力度，但此处用“何况……更……临到”既自然又更贴合原文的断言。
  - severity: low
    issue: “那一个人”及赏赐短语的行文
    rationale: “那一人”更符合中文经文体和上下文的一人—众人对照；调整赏赐短语，使其更清楚对应“在／藉着那一人的恩典中”的修饰关系，而不擅自限定施予者。
