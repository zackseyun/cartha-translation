revisions:
- from: 然而，恩赐和过犯并不一样。如果因那一人的过犯，众人都死了，那么，神的恩典，以及借着那一个人耶稣弥赛亚的恩典而来的赏赐[a]，岂不更丰丰富富地临到众人吗？
  to: 然而，恩赐不像过犯。若因那一人的过犯，众人死了，何况神的恩典和那因一人耶稣弥赛亚的恩典而有的恩赐[a]，更丰丰富富地临到众人。
  rationale: 修订删除“都”，以免扩大οἱ πολλοί的明示范围；以“何况……更……”恢复原文直陈的加强论证；将“一人”和“众人”的对照译得更自然，并保留“耶稣弥赛亚”作为称号性名称。脚注锚点仍紧随受注释的“恩赐”。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T03:51:13Z'
