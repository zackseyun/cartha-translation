  source_fidelity: 草稿基本把握了过犯与恩赐的对照、神的恩典与一人耶稣弥赛亚之恩典的并列，以及“众人”的修辞张力。但“众人都死了”增加了原文未明说的“都”，而将原文直陈语气改作“岂不……吗？”亦不必要。
  naturalness: “那一个人”略显生硬；“丰丰富富地”可保留原有充盈、超越之意，但应置于直陈句中。“那一人”在本段一人与众人的对照中较自然且庄重。
  terminology: “过犯”“恩赐”“神的恩典”“耶稣弥赛亚”均可取。为避免正文中“恩典”与“赏赐”关系被误读为耶稣主动施予，采用“因……的恩典而有的恩赐”，并以脚注保留ἐν的关联／领域等可能。
  issues:
