source:
  edition: SBLGNT
  text: καὶ αὕτη ἐστὶν ἡ παρρησία ἣν ἔχομεν πρὸς αὐτόν, ὅτι ἐάν τι αἰτώμεθα κατὰ τὸ θέλημα αὐτοῦ ἀκούει ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/014.yaml
  text: 'And this is the confidence that we have before him: that if we ask anything according to his will[a], he hears us.'
translation:
  language: zh_hans
  text: 我们在他面前有这样的把握[a]：我们若照他的旨意求什么，他就垂听我们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “把握”也可译作“坦然无惧”或“确信”。
    reason: 保留 παρρησία 在此处兼有确信、坦然与无惧直言的词义幅度。
lexical_decisions:
- source_word: παρρησία
  choice: 把握
  rationale: 此词在约翰著作中可表达人在上帝面前坦然、确信的态度。译作“把握”符合祷告语境，也避免把它与表示信仰或信实的 πίστις 混同；脚注保留“坦然无惧”和“确信”等可能含义。
- source_word: πρὸς αὐτόν
  choice: 在他面前
  rationale: πρός 加人称宾语在此表示面向对方并处于与其相交的关系中；祷告语境下，“在他面前”比生硬的“向着他”更自然。
- source_word: ὅτι
  choice: ：
  rationale: ὅτι 引出“把握”的具体内容，而非说明原因；中文以冒号自然呈现这一解释关系。
- source_word: ἐάν τι αἰτώμεθα
  choice: 我们若……求什么
  rationale: ἐάν 加现在时虚拟式表达一般条件；“若……求什么”保留条件性和 τι 的开放范围，没有改成无条件应许。
- source_word: κατὰ τὸ θέλημα αὐτοῦ
  choice: 照他的旨意
  rationale: κατά 加宾格在此表示以某事为准则或与之相符；“照他的旨意”简明保留 θέλημα 的神学分量。
- source_word: ἀκούει ἡμῶν
  choice: 他就垂听我们
  rationale: “垂听”自然适用于向上帝祷告的语境，表达他留意并听取祈求；没有擅自加强为“答应”或“赐给”。
theological_decisions:
- issue: 上帝“听”祷告的含义
  choice: 译作“他就垂听我们”，表示上帝听取并关注合乎其旨意的祈求。
  alternative: 译作“他就答应我们”或“他就赐给我们所求的”。
  rationale: 原文使用 ἀκούω，并未在本节直接说每项祈求都立刻获准；下一节才进一步谈到得着所求。因此本节不应把“听”解释性地强化为“必定照所求赐下”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“在他面前”体现祷告中的关系与临在；“垂听”保持经文语体的庄重，同时不把听取祷告直接等同于应允所求。
