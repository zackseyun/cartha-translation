id: 1JN.5.1
reference: 1 John 5:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Πᾶς ὁ πιστεύων ὅτι Ἰησοῦς ἐστιν ὁ χριστὸς ἐκ τοῦ θεοῦ γεγέννηται, καὶ πᾶς ὁ ἀγαπῶν τὸν γεννήσαντα ἀγαπᾷ ⸀καὶ τὸν γεγεννημένον ἐξ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/001.yaml
  text: Everyone who believes that Jesus is the Messiah has been born of God[b][a], and everyone who loves the one who fathered him also loves the one born of him.
translation:
  language: zh_hans
  text: 凡相信耶稣是基督[a]的人，都是从神而生的；凡爱生他的那一位，也爱从那一位而生的人。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “基督”意为“受膏者”，即“弥赛亚”；这里是耶稣的称号。
    reason: alternative_reading
  - marker: b
    text: 原文在本节三处都使用同一个“生”的动词：从神而生、生他的那一位、从那一位而生的人。末一处是单数形式，可作泛指。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς ὁ πιστεύων
  choice: 凡相信……的人
  rationale: 带冠词的现在分词具有泛指、名词性用法；“凡……的人”既自然，又保留了普遍性的陈述。
- source_word: ὅτι Ἰησοῦς ἐστιν ὁ χριστός
  choice: 耶稣是基督
  rationale: χριστός在此是称号。“基督”是现代汉语基督教语境中通行而庄重的称呼，脚注说明其意为“受膏者”、即“弥赛亚”，避免把它误当作名字。
- source_word: ἐκ τοῦ θεοῦ γεγέννηται
  choice: 都是从神生的
  rationale: ἐκ表示来源，完成时被动态表示已经发生并持续有效的状态。“从神生的”保留约翰著作中出生与新生命的意象；因汉语“凡……的人”在意义上是复数，补出“都”使句子自然。
- source_word: πᾶς ὁ ἀγαπῶν
  choice: 凡爱……的
  rationale: 再次以“凡……的”表达带冠词现在分词的泛指意义，并与前半句保持对应。
- source_word: τὸν γεννήσαντα
  choice: 生他的那一位
  rationale: 用“生”保留γεννάω与本节其他形式的词根呼应。“那一位”适合指神，又没有直接把原文改写成“父”；宾语“他”是汉语为表达清楚所需，泛指一个从神而生的人。
- source_word: ἀγαπᾷ καὶ
  choice: 也爱
  rationale: καί在此表示对象的递进与关联，用“也”自然呈现：爱生育者，就也爱由他而生的人。
- source_word: τὸν γεγεννημένον ἐξ αὐτοῦ
  choice: 从那一位而生的人
  rationale: 保留ἐξ所表达的来源和γεγεννημένον的出生意象；“人”使名词化分词在现代汉语中清楚，并维持单数形式所具有的泛指作用。
theological_decisions:
- issue: γεννάω所表达的神圣生育／新生意象
  choice: 全节以“生”作为核心用词：“从神生的”“生他的那一位”“从那一位而生的人”
  alternative: 译作“重生”“使人得生命”，或改写为“父”与“儿女”
  rationale: 原文刻意重复γεννάω的不同形态。统一用“生”既保留这种修辞和亲属关系意象，也不把“重生”等解释性术语直接加入正文。
- issue: 末句“从他而生的”所指为何
  choice: 译为泛指的“从那一位而生的人”
  alternative: 明确译成“神的儿女”“弟兄姊妹”，或专指耶稣
  rationale: 原文为单数名词化分词，可作类别性的泛指；上下文把爱神与爱从神而生的人相连。正文不进一步限定身份，以保留原文的表达张力。
- issue: 耶稣的弥赛亚称号
  choice: 正文用“基督”，脚注说明“受膏者／弥赛亚”
  alternative: 正文直接用“弥赛亚”或“受膏者”
  rationale: “基督”在现代标准汉语中是最通行的称号；脚注揭示其称号意义，避免读者仅把它视为专名。
- issue: γεγέννηται完成时的状态含义
  choice: 译为“都是从神生的”
  alternative: 译为“已经从神而生”或“是神所生的”
  rationale: 汉语通常不强制标示完成体；此译法自然表达由神而生这一已成立且持续有效的身份，不额外断定相信与新生之间的时间或逻辑次序。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“凡……的人”与分号清楚呈现两组平行陈述；“那一位”避免口语化，也不把原文的分词直接解释为神学称谓。正文持续使用“生”，使原文的词汇呼应在汉语中可见。
