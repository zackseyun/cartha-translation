  text: τίς ⸂δέ ἐστιν⸃ ὁ νικῶν τὸν κόσμον εἰ μὴ ὁ πιστεύων ὅτι Ἰησοῦς ἐστιν ὁ υἱὸς τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/005.yaml
  text: And who is the one who overcomes the world except the one who believes that Jesus is the Son of God?[a]
translation:
  language: zh_hans
  text: 那么，谁是胜过世界的呢？不就是那相信耶稣是上帝的儿子的人吗？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作：“那胜过世界的……那相信的。”希腊文使用阳性单数、带冠词的分词，在这里具有泛指和代表作用。
    reason: 说明原文分词结构及其语法性别并不把所指限于男性。
lexical_decisions:
- source_word: τίς
  choice: 谁
  rationale: 疑问代词引出反问；“谁”简洁自然，保留原文的修辞力量。
- source_word: δέ
  choice: 那么
  rationale: 此处轻接上文，并非强烈转折；“那么”自然承接前面的论述。
- source_word: ὁ νικῶν
  choice: 胜过世界的
  rationale: 带冠词的现在时分词作名词用，表达具有代表性或持续特征的人；汉语“……的”保留其动词意味。
- source_word: τὸν κόσμον
  choice: 世界
  rationale: 保留约翰用语本身，不扩译为“世界体系”等带解释性的说法。
- source_word: εἰ μὴ
  choice: 不就是……吗
  rationale: 在此反问结构中表示排他性的“除非／除了”；采用汉语反问句式，清楚表达只有这一类人的意思。
- source_word: ὁ πιστεύων
  choice: 那相信……的人
  rationale: 带冠词的现在时分词作名词用；译文保留“相信”的动词力量，而不改成抽象称谓。
- source_word: ὅτι
  choice: 是
  rationale: 引出所信的内容；汉语以“相信耶稣是……”自然表达。
- source_word: Ἰησοῦς
  choice: 耶稣
  rationale: 采用现代汉语圣经传统中通行的人名译法。
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: 上帝儿子
  rationale: 保留这一基督论称号的直接内容；在“是”字句中不额外增添解释。
theological_decisions:
- issue: ὁ νικῶν 与 ὁ πιστεύων 的阳性单数形式
  choice: 胜过世界的／那相信……的人
  alternative: 胜过世界的男人／相信……的男人
  rationale: 希腊语虽用阳性单数分词，却具有泛指和代表作用，并非把所指限于男性；现代汉语可自然保留泛指，不必添加男性限定。
- issue: ὁ υἱὸς τοῦ θεοῦ 的基督论称号
  choice: 上帝儿子
  alternative: 上帝的儿子
  rationale: 在“耶稣是……”这一判断句中，“上帝儿子”简洁而庄重，并保留原文对耶稣身份的宣认，不作神学扩写。
- issue: εἰ μὴ 所表达的排他性
  choice: 不就是……吗
  alternative: 除了……以外，还有谁
  rationale: 双重反问在现代汉语中自然表达原文的排他性，同时不把经文改写成关于能力或可能性的命题。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“那么”轻接上文；两个反问层层推进，保留原文的修辞结构与排他语气。
