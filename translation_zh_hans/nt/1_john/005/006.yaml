id: 1JN.5.6
reference: 1 John 5:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Οὗτός ἐστιν ὁ ἐλθὼν δι’ ὕδατος καὶ αἵματος, Ἰησοῦς Χριστός· οὐκ ἐν τῷ ὕδατι μόνον ἀλλ’ ἐν τῷ ὕδατι καὶ ⸀ἐν τῷ αἵματι· καὶ τὸ πνεῦμά ἐστιν τὸ μαρτυροῦν, ὅτι τὸ πνεῦμά ἐστιν ἡ ἀλήθεια.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/006.yaml
  text: This is the one who came by water and blood—Jesus the Messiah[a]; not by the water only, but by the water and by the blood. And the Spirit is the one testifying[c][b], because the Spirit is the truth.
translation:
  language: zh_hans
  text: 这位就是借着水和血[a]而来的那一位——耶稣，就是那位弥赛亚；他不是只借着水而来，而是借着水，也借着血而来。作见证的是圣灵[b]，因为圣灵就是真理。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “借着水和血”具体指什么，历来有不同理解，例如耶稣受洗与受死、出生与受死，或洗礼和圣餐的意象。正文保留原文的说法，不在翻译中选定某一种解释。
    reason: alternative_reading
  - marker: b
    text: 原文直译为“灵”；这里按上下文译作“圣灵”。
    reason: referent_clarification
  - marker: c
    text: “因为”也可译作“说”或“即”，把后半句理解为圣灵所见证的内容。
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὗτός ἐστιν ὁ ἐλθὼν
  choice: 这位就是那……而来的
  rationale: 保留指示词的强调和带冠词分词的身份辨认作用，同时采用自然的现代汉语句式。
- source_word: δι’ ὕδατος καὶ αἵματος
  choice: 借着水和血
  rationale: διά加属格可表示媒介或伴随情形；“借着”贴近原文，又不预先断定水和血具体指什么。
- source_word: Ἰησοῦς Χριστός
  choice: 耶稣弥赛亚
  rationale: 此处为同位说明，Χριστός具有称号意味；“弥赛亚”保留其受膏者称号的功能。
- source_word: οὐκ ἐν τῷ ὕδατι μόνον ἀλλ’ ἐν τῷ ὕδατι καὶ ἐν τῷ αἵματι
  choice: 不是只借着水，而是借着水，也借着血
  rationale: 重复“借着”以反映原文对水与血两者的强调，并使前后介词表达在汉语中连贯。
- source_word: τὸ πνεῦμά
  choice: 圣灵
  rationale: 约翰语境中的神圣见证者指向圣灵；汉语用“圣灵”比单说“灵”更清楚地标明所指。
- source_word: τὸ μαρτυροῦν
  choice: 作见证的是
  rationale: 保留现在分词的见证行动，又以汉语判断句自然表达其身份焦点。
- source_word: ὅτι
  choice: 因为
  rationale: 按因果关系理解，说明圣灵作见证的根据；同时以脚注保留引出内容的另一种可能。
- source_word: ἡ ἀλήθεια
  choice: 真理
  rationale: 译作“真理”保留谓语的身份性陈述，而不弱化为“真实”或“可信”。
theological_decisions:
- issue: “水和血”的所指
  choice: 正文仅保留“水和血”
  alternative: 解释为耶稣受洗与受死、出生与受死，或洗礼和圣餐意象
  rationale: 希腊文本没有明说其具体所指；正文不替读者解决这一历来有争议的问题。
- issue: τὸ πνεῦμα的所指
  choice: 圣灵
  alternative: 泛指某个灵或人的灵
  rationale: 本段关于神圣见证的语境以及约翰著作的用法支持圣灵为所指。
- issue: Χριστός的表达
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处同位结构突显称号功能；译作“弥赛亚”可使现代读者看出它不是姓氏。
- issue: ὅτι的句法功能
  choice: 因果：因为
  alternative: 内容：圣灵见证圣灵就是真理／圣灵见证说……
  rationale: 因果读法较符合论证推进，但连接词确可有内容引导功能，故以脚注保留歧义。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“这位就是”保留开头的强调；破折号呈现“耶稣弥赛亚”的同位说明；后半句保持原文重复，以突出不只是水，也包括血。
