  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἰ τὴν μαρτυρίαν τῶν ἀνθρώπων λαμβάνομεν, ἡ μαρτυρία τοῦ θεοῦ μείζων ἐστίν, ὅτι αὕτη ἐστὶν ἡ μαρτυρία τοῦ θεοῦ ⸀ὅτι μεμαρτύρηκεν περὶ τοῦ υἱοῦ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/009.yaml
  text: 'If we receive the testimony of men[a], the testimony of God is greater[c][b], because this is the testimony of God: that he has testified concerning his Son.'
translation:
  language: zh_hans
  text: 如果我们接受人的见证，神的见证就更大，因为这是神的见证：他已经就自己的儿子作了见证。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 末句也可理解为原因：“因为他已经就自己的儿子作了见证。”
    reason: alternative_reading
lexical_decisions:
- source_word: μαρτυρίαν / μαρτυρία
  choice: 见证
  rationale: 本节反复使用同一词，语境侧重可被接受、具有证明作用的证言内容；“见证”既自然，也能保留全节的词语呼应。
- source_word: ἀνθρώπων
  choice: 人的
  rationale: 此处泛指人类，与神形成对照；现代汉语中“人的见证”准确而自然，无须译成特指男性的“男人的见证”。
- source_word: λαμβάνομεν
  choice: 接受
  rationale: λαμβάνω在接受证言的语境中含认可、采纳之意；“接受”比字面的“领受”更符合现代汉语表达。
- source_word: μείζων
  choice: 更大
  rationale: 直接保留比较级及原文措辞的力度，表达神的见证超越人的见证；“更有分量”虽顺畅，却增加了解释。
- source_word: ὅτι（第一次）
  choice: 因为
  rationale: 引出神的见证更大的理由，因果关系明确。
- source_word: αὕτη ἐστὶν ἡ μαρτυρία τοῦ θεοῦ
  choice: 神的见证就是
  rationale: 保持“见证”的重复，同时用自然汉语引出后面的内容从句。
- source_word: ὅτι（第二次）
  choice: 冒号引出内容
  rationale: 主要理解为说明神见证的内容；汉语以冒号自然表达“即：他已经……”，同时避免生硬的“就是他已经”。
- source_word: μεμαρτύρηκεν
  choice: 已经……作了见证
  rationale: 希腊语完成时表示见证已经作出且效力仍存；“已经……作了见证”保留这一意味。
- source_word: περὶ τοῦ υἱοῦ αὐτοῦ
  choice: 为自己的儿子
  rationale: περί加属格可指“关于”；在汉语“作见证”的搭配中，“为……作见证”自然地表达见证所关涉的对象。“自己的”清楚指回神。
theological_decisions:
- issue: ἀνθρώπων的泛指范围
  choice: 人的
  alternative: 人们的／世人的
  rationale: 原文所作的是人类见证与神的见证之间的对比，并非专指男性；“人的”准确保留这种泛指和对照。
- issue: 第二个ὅτι的句法功能
  choice: 内容从句，以冒号表示
  alternative: 原因从句：“因为他已经为自己的儿子作了见证”
  rationale: 此处更自然地说明“神的见证”具体是什么，但原文也容许因果理解，因此以脚注保留另一种读法。
- issue: μείζων所表达的比较
  choice: 更大
  alternative: 更有分量／更可靠
  rationale: 原文只明确说“更大”，可涵盖权威、可靠性和分量，不宜在正文中把意义限定为其中一种。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“见证”贯穿全句，以保留原文的重复和论证节奏；“儿子”不依赖英文大写来标示身份，所指由上下文确定。
