id: 1JN.5.3
reference: 1 John 5:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: αὕτη γάρ ἐστιν ἡ ἀγάπη τοῦ θεοῦ ἵνα τὰς ἐντολὰς αὐτοῦ τηρῶμεν, καὶ αἱ ἐντολαὶ αὐτοῦ βαρεῖαι οὐκ εἰσίν,
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/003.yaml
  text: 'For this is the love of God: that we keep his commandments[a], and his commandments are not burdensome.'
translation:
  language: zh_hans
  text: 因为爱上帝，就是遵守他的诫命[a]；他的诫命并不沉重。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“上帝的爱，就是我们遵守他的诫命。”希腊语“上帝的爱”既可指人对上帝的爱，也可指从上帝而来的爱；紧接的上下文较支持前一种理解。
    reason: alternative_reading
lexical_decisions:
- source_word: αὕτη γάρ ἐστιν
  choice: 因为……就是
  rationale: γάρ承接并解释上一节，译作“因为”；αὕτη……ἐστιν指向后面的解释内容，汉语用“就是”自然地引出定义。
- source_word: ἡ ἀγάπη τοῦ θεοῦ
  choice: 爱上帝
  rationale: 结合上下文，属格最可能是受事属格，指人对上帝的爱；此译法在现代汉语中清楚自然。脚注保留“上帝的爱”这一语法上可能的理解。
- source_word: ἵνα
  choice: 就是
  rationale: 此处引出“爱上帝”的具体内容，而非单纯表达目的；“就是”符合定义性、解释性的用法。
- source_word: τὰς ἐντολὰς αὐτοῦ
  choice: 他的诫命
  rationale: “诫命”保留ἐντολή的郑重含义以及约翰文献中的一贯用语。
- source_word: τηρῶμεν
  choice: 遵守
  rationale: τηρέω在诫命语境中意为持守、实行；现代汉语“遵守诫命”清楚而庄重。
- source_word: βαρεῖαι οὐκ εἰσίν
  choice: 并不沉重
  rationale: 保留βαρύς“重”的意象，同时在汉语中可自然表达难以承受、成为重担之意。
theological_decisions:
- issue: ἡ ἀγάπη τοῦ θεοῦ中属格的含义
  choice: 译为“爱上帝”，理解为人对上帝的爱
  alternative: “上帝的爱”，理解为上帝所施的爱
  rationale: 上一节把爱上帝与遵行他的诫命联系起来，本节又以遵守诫命说明这种爱，因此上下文较支持受事属格；但希腊语形式本身容许另一理解，故以脚注保留。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“并不沉重”既贴近原文意象，也避免把经文绝对化改写成“并不难做到”。
