  text: πᾶσα ἀδικία ἁμαρτία ἐστίν, καὶ ἔστιν ἁμαρτία οὐ πρὸς θάνατον.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/017.yaml
  text: All unrighteousness is sin[b][a], and there is sin not leading to death.
translation:
  language: zh_hans
  text: 一切不义[a]都是罪；也有不至于死的罪[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一切恶行”或“一切不公正的事”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“不导致死亡的罪”；较直译：“不是趋向死亡的罪”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα
  choice: 一切
  rationale: 与无冠词的单数名词ἀδικία连用，表达全面、概括的范围；“一切”自然地保留其普遍性。
- source_word: ἀδικία
  choice: 不义
  rationale: ἀδικία可指不义、恶行或不公正；“不义”既涵盖广泛的道德含义，也保留本书与“义”相关的用语联系，而不把范围缩小为社会层面的“不公正”。
- source_word: ἁμαρτία
  choice: 罪
  rationale: 两处均译为“罪”，是现代汉语基督教语境中准确、简明且前后一致的对应词。
- source_word: καὶ
  choice: 也
  rationale: 此处连接一般性陈述与补充说明；“也”符合现代汉语表达，并保留并列、补充的关系。
- source_word: οὐ πρὸς θάνατον
  choice: 不至于死
  rationale: πρός在此表达趋向或结果。“不至于死”简洁自然，并与上下文“至于死的罪”形成清楚对应，同时不额外界定死亡的性质。
- source_word: θάνατον
  choice: 死
  rationale: 直接对应θάνατος。原文没有说明是肉身死亡、属灵死亡还是末后的定罪，因此译文不加限定。
theological_decisions:
- issue: “不至于死的罪”中“死”的性质
  choice: 只译作“死”，不加解释性限定
  alternative: 译作“肉身死亡”、“属灵死亡”或“永远的定罪”
  rationale: 希腊文仅用θάνατον，没有进一步说明；保留原文的开放性，避免在正文中裁定不同的神学解释。
- issue: ἀδικία的道德与神学范围
  choice: 正文采用“不义”
  alternative: 采用“恶行”或“不公正”
  rationale: 这里是涵盖广泛的道德陈述。“不义”既保留与“义”的词义联系，也不会像“不公正”那样容易被理解为仅指社会或法律层面。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“一切不义都是罪”简洁有力；“不至于死”沿用本段内部的对照表达，并保留“死”所指为何的解释空间。
