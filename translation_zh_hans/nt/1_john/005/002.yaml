  yaml_path: translation/nt/1_john/005/002.yaml
  text: 'By this we know that we love the children of God: when we love God and keep his commandments[a].'
translation:
  language: zh_hans
  text: 当我们爱上帝，并实行他的命令[a]时，我们就由此知道自己爱上帝的儿女。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“遵行他的命令”或“服从他的命令”。这里的希腊语动词直译是“做、实行”（ποιῶμεν），不是较常用于“遵守”的 τηρέω。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: 由此
  rationale: 保留指示性，并以自然的现代汉语引出据以得知某事的标志或根据。
- source_word: γινώσκομεν
  choice: 我们知道
  rationale: 准确表达约翰文体中现在时的认识或确认，简洁自然。
- source_word: ἀγαπῶμεν
  choice: 爱
  rationale: 以“爱”一致表达 ἀγαπάω；汉语无需另行标示希腊语现在时。
- source_word: τὰ τέκνα τοῦ θεοῦ
  choice: 上帝的儿女
  rationale: “儿女”兼顾 τέκνα 的亲子关系和性别包容性，也符合现代汉语教会及一般读者的表达习惯。
- source_word: ὅταν
  choice: 当……时
  rationale: 保留其时间兼条件意味，但不将其过度限定为单纯因果或严格条件。
- source_word: τὰς ἐντολὰς αὐτοῦ ποιῶμεν
  choice: 实行他的命令
  rationale: ποιέω 本义为“做、实行”，此处用“实行”既自然，又避免把它无痕改译成通常对应 τηρέω 的“遵守”；“命令”准确传达 ἐντολάς。
theological_decisions:
- issue: 爱上帝儿女与爱上帝、实行其命令之间的关系
  choice: 以“由此……就是当……”呈现经文所给的识别标准，不进一步界定为因果、证据或定义关系。
  alternative: 明确译成“因为”或“证明”，从而将其解释为因果关系或严格的证据测试。
  rationale: 原文以 ἐν τούτῳ 和 ὅταν 简洁连接这些观念，逻辑关系具有张力；译文保留这种张力，不替经文作神学裁决。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“由此”保留约翰式论述的凝练感；“实行他的命令”较“做他的命令”自然，同时体现原文动词 ποιέω 的用词特点。
