base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/008.yaml
  text: the Spirit and the water and the blood[a], and the three are for the one.
translation:
  language: zh_hans
  text: 就是圣灵、水和血；这三者是一致的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这三者归于一。”这里的希腊语结合上下文，很可能是说三者的见证彼此一致。
    reason: 保留 εἰς τὸ ἕν 较贴近字面的译法及其语境含义。
lexical_decisions:
- source_word: τὸ πνεῦμα
  choice: 圣灵
  rationale: 上下文将其列为作见证者，最自然地指圣灵；定冠词也表明所指明确。
- source_word: τὸ ὕδωρ
  choice: 水
  rationale: 保留具体意象，不在本节正文中进一步解释其所指；现代汉语无需机械补出希腊语定冠词。
- source_word: τὸ αἷμα
  choice: 血
  rationale: 保留原文的具体名词及其神学张力，不把其所指解释性地展开。
- source_word: οἱ τρεῖς
  choice: 这三者
  rationale: 自然对应前面刚列出的圣灵、水和血，并保留其集合性指称。
- source_word: εἰς τὸ ἕν εἰσιν
  choice: 是一致的
  rationale: 结合本段“作见证”的语境，表达三者趋于同一、彼此相合；避免把该短语误读为关于本体合一的直接陈述。脚注保留较贴近字面的表达。
theological_decisions:
- issue: εἰς τὸ ἕν εἰσιν 表示本体合一还是见证一致
  choice: 这三者是一致的
  alternative: 这三者归于一
  rationale: 上下文谈论圣灵、水和血作见证，因此最自然的意义是三者相合、指向同一结论。正文不明确补入“见证”二字，以免过度解释；同时以脚注保存原文较凝练的形式。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“就是”承接上一节的“作见证的有三个”；分号清楚呈现列举与总结之间的关系。
