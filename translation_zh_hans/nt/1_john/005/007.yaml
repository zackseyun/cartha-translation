  text: For there are three who testify,[a]
translation:
  language: zh_hans
  text: 因为有三者作见证，[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 后期抄本增添了一段较长的读法，通常称为“约翰短句”（Comma Johanneum）：“在天上：父、道、圣灵；这三者合而为一。又有三者在地上作见证……”这段文字不见于最早期的希腊文抄本证据，也未收入SBLGNT正文。
    reason: textual_variant
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 此处引出对上文论断的解释或根据；“因为”自然传达其因由、说明作用。
- source_word: τρεῖς
  choice: 三位
  rationale: 表示数目“三”；因后文所列见证者具有人格性，采用用于人的量词“位”，同时不在本节内提前点明其身份。
- source_word: εἰσιν
  choice: 有
  rationale: 希腊文系词与数词、分词结构组合，在现代汉语中自然表达为存在句“有三位”。
- source_word: οἱ μαρτυροῦντες
  choice: 作见证的
  rationale: 保留带冠词现在分词的实体化和动作意味，即“那些正在作见证的”；比直接译作名词“见证人”更贴近原文。
theological_decisions:
- issue: 约翰一书5:7的文本形式与“约翰短句”（Comma Johanneum）
  choice: 正文只翻译SBLGNT所载较短读法：“因为作见证的有三位：”
  alternative: 后期抄本传统增添：“在天上：父、道和圣灵；这三位是一体。在地上作见证的有三……”
  rationale: 所提供的希腊文底本只有较短读法。较长的三一论表述不见于最早期的希腊文抄本证据，也未收入SBLGNT正文；因此正文遵从指定底本，并在脚注中透明说明这一具有历史影响的异文。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“作见证”沿用圣经语境中自然且准确的表达；冒号体现本句将在下一节列出三位见证者，虽希腊文标点本身并不要求冒号，但中文独立节句以冒号衔接下文更清楚。
