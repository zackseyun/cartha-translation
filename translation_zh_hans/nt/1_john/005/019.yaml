  text: οἴδαμεν ὅτι ἐκ τοῦ θεοῦ ἐσμεν, καὶ ὁ κόσμος ὅλος ἐν τῷ πονηρῷ κεῖται.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/019.yaml
  text: We know that we are from God[b][a], and the whole world lies in the evil one.
translation:
  language: zh_hans
  text: 我们知道，我们是出于上帝的，而整个世界都在那恶者的权势之下。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较直译为“整个世界都卧在那恶者里面”。“那恶者”也可理解为“邪恶”，但按约翰著作中的常见用法，指人格性的恶者更为可能。
    reason: 保留ἐν τῷ πονηρῷ的形式表达，并说明人格性与抽象义之间的词义可能性。
lexical_decisions:
- source_word: οἴδαμεν
  choice: 我们知道
  rationale: 表达已经确立、带有确信意味的认识；“我们知道”自然直接，也保留本书书信式的确据语气。
- source_word: ἐκ τοῦ θεοῦ
  choice: 出于上帝
  rationale: ἐκ表示来源，也可连带表达归属；“出于上帝”保留来源关系，不擅自增添本句未明说的“由上帝所生”。
- source_word: ὁ κόσμος ὅλος
  choice: 整个世界
  rationale: ὅλος强调范围的全面性；这里的κόσμος按约翰著作的语境指与上帝敌对的世界体系或人类世界，但译文不把这一语境含义过度解释出来。
- source_word: ἐν τῷ πονηρῷ
  choice: 在那恶者之下
  rationale: 按约翰著作中的常见用法，把带冠词的πονηρός理解为人格性的“那恶者”；“之下”与κεῖται合译，使现代汉语自然，并表达其受辖制的状态。较形式对应的表达和抽象义的可能性在脚注中保留。
- source_word: κεῖται
  choice: 伏在
  rationale: κεῖμαι本义为“躺卧、安置”，这里描述一种持续状态；“伏在……之下”既保留卧伏意象，也以自然汉语传达受其势力辖制的语境含义。
theological_decisions:
- issue: τῷ πονηρῷ是指人格性的“那恶者”，还是抽象的“邪恶”
  choice: 人格性的“那恶者”
  alternative: 抽象的“邪恶”
  rationale: 在约翰著作中，ὁ πονηρός通常指人格性的恶者（参约壹2:13-14；3:12；5:18），冠词及上下文也支持这一理解；但语法形式仍容许抽象理解，因此在脚注中注明。
- issue: 是否把ἐν τῷ πονηρῷ明确解释为受其权势控制
  choice: 正文译作“伏在那恶者之下”
  alternative: 较直译为“卧在那恶者里面”
  rationale: 正文以自然汉语表达受辖制的状态，但不增添“完全控制”等更强断言；脚注保留原文介词结构和卧伏意象，避免隐藏其表达张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“出于上帝”保留约翰式的来源表达；“伏在……之下”避免生硬的“卧在……里面”，同时保留原文的卧伏意象和受辖制意味。脚注标记[a]已置于正文对应句末。
