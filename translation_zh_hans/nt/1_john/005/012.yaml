id: 1JN.5.12
reference: 1 John 5:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ ἔχων τὸν υἱὸν ἔχει τὴν ζωήν· ὁ μὴ ἔχων τὸν υἱὸν τοῦ θεοῦ τὴν ζωὴν οὐκ ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/012.yaml
  text: The one who has the Son has life[a]; the one who does not have the Son of God does not have life.
translation:
  language: zh_hans
  text: 有了子的人，就有生命[a]；没有神的子的人，就没有生命。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“永生”。在约翰的用语中，这里的“生命”指在子里面的生命。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων
  choice: 有了……的人
  rationale: 带冠词的现在分词作名词用，指以“有子”为特征的人。“有了……的人”在现代汉语中自然，并保留泛指单数的作用。
- source_word: τὸν υἱόν
  choice: 子
  rationale: 首句原文只说“子”，不补入“神的”，以保留两句之间原有的称谓变化；上下文足以表明所指。
- source_word: ἔχει
  choice: 有
  rationale: 直接对应ἔχω，也保留约翰文献中既可表达拥有、又带有关联与参与意味的简洁措辞，不作过度解释。
- source_word: τὴν ζωήν
  choice: 生命
  rationale: 译作“生命”既符合现代汉语，也保留原文措辞及其约翰式神学含义，不在正文中直接扩展为“永生”。
- source_word: ὁ μὴ ἔχων
  choice: 没有……的人
  rationale: μή否定作名词用的分词短语；此译与前半句形成清楚、自然的对照。
- source_word: τὸν υἱὸν τοῦ θεοῦ
  choice: 神的子
  rationale: 保留第二句完整的基督论称谓及属格关系；“神的子”简洁、明确，也与首句“子”形成原文所有的变化。
- source_word: οὐκ ἔχει
  choice: 就没有
  rationale: οὐκ否定限定动词；加入“就”使汉语的条件—结果关系及两句对偶更自然，而不增加实质内容。
theological_decisions:
- issue: 约翰语境中“生命”的含义
  choice: 正文译作“生命”，不扩写为“永生”
  alternative: 永生
  rationale: 约翰文献中的ζωή常指在子里面的永恒生命，但本节本身只用ζωή。正文保留“生命”，以免把语境所含的解释直接写进经文；脚注说明其语境意义。
- issue: 阳性单数名词化分词的泛指作用
  choice: 译作“……的人”
  alternative: 凡……的；他……
  rationale: 希腊语形式虽为阳性单数，语义却泛指任何符合这一描述的人。“……的人”在现代汉语中自然，不把经文不必要地限定为男性。
- issue: “有子”的关系性含义
  choice: 保留简洁的“有了子”
  alternative: 接受子；与子联合；信靠子
  rationale: 这些替代说法可能说明“有”的部分神学内涵，却比原文更具体。直译为“有了子”可保留其关系性和参与性的张力，不预先限定具体机制。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。两分句以“有了……就有／没有……就没有”构成鲜明对偶；首句“子”与次句“神的子”保留希腊原文的称谓变化。
