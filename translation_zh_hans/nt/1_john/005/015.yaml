  naturalness: “我们若知道，无论求什么，他都听我们”自然庄重。修订后以“有向他所求的”保留原文的“有”，虽较日常口语凝练，但在现代中文圣经的庄重语体中清楚可懂，且避免不必要的释义。
  terminology: “听我们”不预断为“应允”；“求／所求的”保留αἰτέω与αἴτημα的词汇呼应；“向他”自然表达向神求取的对象。删除为“得着了”所设的脚注，因为该脚注所说明的意译不应保留。
