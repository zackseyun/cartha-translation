  text: καὶ ἐὰν οἴδαμεν ὅτι ἀκούει ἡμῶν ὃ ⸀ἐὰν αἰτώμεθα, οἴδαμεν ὅτι ἔχομεν τὰ αἰτήματα ἃ ᾐτήκαμεν ⸀ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/015.yaml
  text: And if we know that he hears us in whatever we ask, we know that we have the requests that we have asked from him.
translation:
  language: zh_hans
  text: 我们若知道，无论我们求什么，他都听我们，就知道我们有向他所求的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούει ἡμῶν
  choice: 他都听我们
  rationale: 保留“听”的明确词义及祷告语境，不把它强化为“应允”，从而维持原文的推论层次。
- source_word: ὃ ἐὰν αἰτώμεθα
  choice: 无论求什么
  rationale: 关系代词与ἐάν构成不定关系从句，表达开放而广泛的“无论什么”，不是时间性的“每当”。
- source_word: αἰτώμεθα / ᾐτήκαμεν
  choice: 求／所求的
  rationale: 祷告语境中“求”自然简洁；重复同一词根的译法，也尽量呈现原文的词汇呼应。
- source_word: ἔχομεν
  choice: 已经得着了
  rationale: 中文若直译为“拥有所求的”较生硬；“已经得着了”自然表达现时确有所得的状态，同时不进一步说明实现的方式或时间。
- source_word: τὰ αἰτήματα
  choice: 所求的
  rationale: 用名词化结构表达“所请求之事”，符合现代汉语，也与前后的“求”保持联系。
- source_word: ἀπ’ αὐτοῦ
  choice: 向他
  rationale: ἀπό在αἰτέω的搭配中标示请求所指向或求取的对象；现代汉语说“向他求”最自然。
- source_word: οἴδαμεν
  choice: 知道
  rationale: 两次一致译为“知道”，保留约翰著作中反复出现的知识与确信用语。
theological_decisions:
- issue: ἀκούει在祷告语境中是译作“听”还是解释为“应允”
  choice: 他都听我们
  alternative: 他都应允我们
  rationale: 原文先说神“听”，继而推知信徒“有”所求的；译成“应允”会预先消解这两步之间的神学张力。
- issue: ἔχομεν是保持“有”的状态意义，还是解释为将来或外在实现
  choice: 已经得着了
  alternative: 我们就有／将会得到
  rationale: 保留现在时所表达的现时确据，不改成将来时；但中文用“得着”比“有那些请求”更通顺。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式保留原文“若……就知道……”的条件与推论结构；“无论求什么”保留开放范围，不误译为时间性的“每当”。
