  text: Τεκνία, φυλάξατε ἑαυτὰ ἀπὸ τῶν ⸀εἰδώλων.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/021.yaml
  text: Little children[a], guard yourselves from idols.
translation:
  language: zh_hans
  text: 孩子们[a]，你们要保守自己，远离偶像。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“亲爱的孩子们”。希腊语原词是约翰直接称呼读者时使用的亲昵称谓。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τεκνία
  choice: 孩子们
  rationale: 这是τεκνίον的呼格复数，约翰用作带有亲切、关爱意味的直接称呼。现代汉语“孩子们”自然保留亲属式称呼；其昵称意味难以在正文中完全显出，故以脚注说明。
- source_word: φυλάξατε
  choice: 要保守
  rationale: 不定过去时主动命令语气第二人称复数，表达明确而郑重的警戒。“保守自己”在此意为谨慎看守、防备，语体庄重且能体现主动警醒。
- source_word: ἑαυτὰ
  choice: 自己
  rationale: 反身代词作命令动词的宾语。“你们要保守自己”自然体现复数对象和反身意义。
- source_word: ἀπὸ
  choice: 远离
  rationale: ἀπό表示分离。结合φυλάξατε，汉语用“保守自己，远离……”比直译为“保守自己脱离……”更自然，同时保持与偶像分开的含义。
- source_word: εἰδώλων
  choice: 偶像
  rationale: εἴδωλον指偶像或受错误敬拜的神像。“偶像”是现代汉语中准确、通行的对应词；不扩写为“任何取代上帝的事物”，以免超出原文。
theological_decisions:
- issue: “偶像”的范围
  choice: 按原文具体译为“偶像”
  alternative: 任何成为偶像的事物；一切错误敬拜
  rationale: 原文直接使用εἴδωλον。虽然该警告在应用上可能涉及广义的偶像崇拜，译文不将其解释性扩展，以保留原文的具体措辞及其可能范围。
translation_notes:
  register: 采用现代、清楚而庄重的普通话。“孩子们”亲切自然；“保守自己，远离偶像”保持简洁有力的劝诫语气。
