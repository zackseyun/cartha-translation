id: 1JN.5.18
reference: 1 John 5:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Οἴδαμεν ὅτι πᾶς ὁ γεγεννημένος ἐκ τοῦ θεοῦ οὐχ ἁμαρτάνει, ἀλλ’ ὁ γεννηθεὶς ἐκ τοῦ θεοῦ τηρεῖ ⸀αὐτόν, καὶ ὁ πονηρὸς οὐχ ἅπτεται αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/018.yaml
  text: We know that everyone who has been born of God does not keep sinning[a]; rather, the one who was born of God keeps him[c][b], and the evil one does not touch him.
translation:
  language: zh_hans
  text: 我们知道，凡从神而生的，都不持续犯罪[a]；相反，那从神而生的保守他[b]，恶者也不触碰他[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不持续犯罪”也可直译为“不犯罪”。这里的希腊语现在时很可能指持续或惯常的犯罪，并非断言信徒从不犯任何罪；参1:8—10；2:1。
    reason: 说明动词体貌并提供相关经文，避免把强烈断言误解为绝对无罪。
  - marker: b
    text: 本句也可理解为：“从神而生的人保守自己。”不过，许多解释者认为“那从神而生的”是指耶稣、神的儿子，由他保守信徒。
    reason: 原文主语和代词的关系存在真实歧义，需要保留信徒自守与基督保守两种理解。
  - marker: c
    text: “触碰”在这里可有“抓住并加害”的意思。
    reason: 说明ἅπτομαι在本语境中不只是一般接触，而含侵害意味。
lexical_decisions:
- source_word: Οἴδαμεν
  choice: 我们知道
  rationale: οἶδα虽为完成时形式，却惯常表达现在的认知状态；译为“我们知道”自然准确。
- source_word: πᾶς ὁ γεγεννημένος ἐκ τοῦ θεοῦ
  choice: 凡从神而生的
  rationale: πᾶς ὁ加分词具有逐一概括的意义；完成时被动分词表达由神所生并处于这一身份中的人。“凡……的”既简洁，也保留约翰文献的表达。
- source_word: οὐχ ἁμαρτάνει
  choice: 不持续犯罪
  rationale: 现在时在这里具有未完成体色彩，较可能否定持续或惯常的犯罪行为。“不持续犯罪”避免将经文改写成信徒绝不会犯任何罪，同时仍保留原句强烈的否定。
- source_word: ἀλλ’
  choice: 相反
  rationale: 标明前后分句之间鲜明的转折和对照。
- source_word: ὁ γεννηθεὶς ἐκ τοῦ θεοῦ
  choice: 那从神而生的
  rationale: 直译该带冠词的简短语句，不在正文中擅自指明是信徒还是神的儿子，从而保留原文真实的指代张力。
- source_word: τηρεῖ αὐτόν
  choice: 保守他
  rationale: τηρέω可表示看守、守护、保存；“保守”在此自然传达保护意味。αὐτόν按其非反身代词形式译作“他”，另在脚注说明反身理解。
- source_word: ὁ πονηρὸς
  choice: 恶者
  rationale: 带冠词的阳性形式结合约翰文献的用法，最自然地指有位格的邪恶者，而非抽象的邪恶。
- source_word: οὐχ ἅπτεται αὐτοῦ
  choice: 也不能碰他
  rationale: ἅπτομαι的基本义是“触碰”，在此语境中含有抓住、侵害之意；“不能碰他”保留形象，并自然表达其伤害无法得逞。
theological_decisions:
- issue: οὐχ ἁμαρτάνει是否宣称信徒绝不犯任何罪
  choice: 理解为不持续或不以犯罪为惯常行为
  alternative: 理解为从神而生的人完全不犯任何罪
  rationale: 现在时的未完成体色彩支持持续或惯常行为的理解，也与约翰一书1:8—10及2:1承认信徒仍可能犯罪相协调；正文仍保持原句的强烈断言。
- issue: ὁ γεννηθεὶς ἐκ τοῦ θεοῦ所指是谁
  choice: 正文保留“那从神而生的”的含混表达
  alternative: 可指从神而生的信徒，也可特指耶稣、神的儿子
  rationale: 希腊语在句法上允许不同理解。若指耶稣，就是他保守信徒；若指信徒，则后面的代词可按反身意义理解。正文不加入原文没有的“耶稣”或“自己”。
- issue: αὐτόν与αὐτοῦ的所指
  choice: 均以“他”指受保守、不被恶者侵害的人
  alternative: 若前句主语也是信徒，αὐτόν可在意义上理解为“自己”
  rationale: SBLGNT正文采用普通宾格代词αὐτόν，而非反身代词；因此正文译“他”，同时用脚注保存“保守自己”的传统理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“从神而生”“恶者”“保守”延续约翰文献的重要措辞；句式简洁，并借脚注处理动词体貌、主语指代及“碰”的语义，不在正文中消除原文的神学张力。
