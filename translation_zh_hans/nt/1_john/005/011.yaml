source:
  edition: SBLGNT
  text: καὶ αὕτη ἐστὶν ἡ μαρτυρία, ὅτι ζωὴν αἰώνιον ἔδωκεν ⸂ὁ θεὸς ἡμῖν⸃, καὶ αὕτη ἡ ζωὴ ἐν τῷ υἱῷ αὐτοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/011.yaml
  text: 'And this is the testimony: that God has given us eternal life[c][b][a], and this life is in his Son.'
translation:
  language: zh_hans
  text: 这就是那见证：上帝已经赐给我们永生，而这永生在他的儿子里面。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μαρτυρία
  choice: 见证
  rationale: 在约翰文献的语境中指所作见证及其内容；“见证”自然、庄重，也能承接上下文的法庭性和证据意味。
- source_word: ὅτι
  choice: 就是
  rationale: 引出见证的具体内容；汉语用“就是”比生硬直译为“即”更自然，同时保留解释性连接。
- source_word: ζωὴν αἰώνιον
  choice: 永生
  rationale: 这是现代汉语中自然且通行的对应语，既涵盖生命的永久性，也保留约翰文献中特有的神学内涵。
- source_word: ἔδωκεν
  choice: 已经赐给
  rationale: 不定过去时表达已成就的赐予；“已经赐给”在汉语中同时传达完成性及其现今仍然有效的结果。
- source_word: ὁ θεὸς
  choice: 上帝
  rationale: 直接对应 θεός，采用现代标准汉语中庄重而清楚的称呼，不作解释性扩展。
- source_word: ἡμῖν
  choice: 我们
  rationale: 按与格间接受词直接译出，不擅自缩小或扩大所指群体。
- source_word: ἐν τῷ υἱῷ αὐτοῦ
  choice: 在他儿子里面
  rationale: 保留介词 ἐν 的表达及约翰文献中生命“在”子里面的浓缩意象，不改写为“借着”或“与……同在”，以免消解原文张力。
- source_word: υἱῷ
  choice: 儿子
  rationale: 在“他儿子”这一明确关系结构中自然指上帝独特的儿子；中文无需依靠首字母大写标示称号。
- source_word: αὕτη ... αὕτη ἡ ζωή
  choice: 这见证……这生命
  rationale: 保留重复的指示词，呈现原文的强调，并使见证内容与所说的生命紧密衔接。
theological_decisions:
- issue: ἔδωκεν 所表达的已成就行动与现今拥有永生之间的关系
  choice: 译为“已经赐给我们永生”
  alternative: “赐给了我们永生”
  rationale: “已经赐给”既表达行动已完成，也自然传达其结果持续有效；不进一步规定赐予发生的具体时间或套入某一教义体系。
- issue: 生命“在他儿子里面”的含义
  choice: 保留“在他儿子里面”
  alternative: “借着他儿子”或“与他儿子同在”
  rationale: 原文以 ἐν 简洁地陈述生命与子的关系，可能兼有所在、根源和联合等丰富意味；直保留该表述，避免把含义单一化为途径或陪伴。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。句式保留原文两次 αὕτη 的对应关系，同时将 ὅτι 顺译为“就是”，使中文流畅。未设置脚注，因为正文能够忠实呈现主要词义与神学张力，现有异译不足以构成必须标注的实质歧义。
