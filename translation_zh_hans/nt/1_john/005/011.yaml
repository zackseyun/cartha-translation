  rationale: 修订仅处理汉语句法与语体：“这就是那见证”自然对应原文的判断句；“而这永生在他的儿子里面”保留 καὶ、重复的 αὕτη、ζωὴ αἰώνιος 与 ἐν τῷ υἱῷ αὐτοῦ，且不解释或缩窄其神学含义。“已经赐给”可恰当地表达不定过去时所述已成就行动及其现今关联。
