id: 1JN.5.20
reference: 1 John 5:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οἴδαμεν δὲ ὅτι ὁ υἱὸς τοῦ θεοῦ ἥκει, καὶ δέδωκεν ἡμῖν διάνοιαν ἵνα ⸀γινώσκωμεν τὸν ἀληθινόν· καὶ ἐσμὲν ἐν τῷ ἀληθινῷ, ἐν τῷ υἱῷ αὐτοῦ Ἰησοῦ Χριστῷ. οὗτός ἐστιν ὁ ἀληθινὸς θεὸς καὶ ζωὴ αἰώνιος.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/020.yaml
  text: And we know that the Son of God has come and has given us understanding so that we may know the True One; and we are in the True One[a], in his Son Jesus the Messiah. This one is the true God and eternal life.
translation:
  language: zh_hans
  text: 我们知道，神的儿子已经来了，并且赐给我们理解力，好让我们认识那位真实的；我们也在那位真实的里面，在他的儿子耶稣弥赛亚里面。这一位就是真神，也是永生。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这一位”最自然可指紧接在前的耶稣弥赛亚；也有人认为它指前文的“那位真实的”，即父神。
    reason: 保留οὗτός先行词的真实歧义，避免正文将有争议的句法关系完全定死。
lexical_decisions:
- source_word: οἴδαμεν
  choice: 我们知道
  rationale: οἶδα虽为完成时形式，却惯常表达现在的确知状态；“我们知道”自然准确。
- source_word: ἥκει
  choice: 已经来了
  rationale: 表达已经来到且其结果延续至今；“已经来了”兼顾完成与当前意义。
- source_word: δέδωκεν
  choice: 赐给
  rationale: 完成时表明所赐的悟性具有持续效力；“赐给”也符合神为施予者的庄重语域。
- source_word: διάνοιαν
  choice: 悟性
  rationale: 此处指认识属神真实的理解能力；“悟性”比单纯的“心思”更切合语境。
- source_word: ἵνα γινώσκωμεν
  choice: 使我们认识
  rationale: 保留ἵνα所表达的目的，并以自然现代汉语呈现。
- source_word: τὸν ἀληθινόν / τῷ ἀληθινῷ
  choice: 那位真实者
  rationale: 原文为形容词名词化，并在两处重复；统一译法既保留约翰的措辞，又明确所指为一位。
- source_word: ἐσμὲν ἐν
  choice: 我们也在……里面
  rationale: 直译其关系性表达，不增译为“住在”或“与……联合”，因为原文未用μένω。
- source_word: ἐν τῷ υἱῷ αὐτοῦ
  choice: 就是在他的儿子……里面
  rationale: “就是”自然呈现后一个介词短语与前句的紧密解释关系，同时不把这种关系作过度神学化界定。
- source_word: Ἰησοῦ Χριστῷ
  choice: 耶稣弥赛亚
  rationale: Χριστός在此保留称号意义，译作“弥赛亚”，而非按姓氏化习惯处理。
- source_word: οὗτός
  choice: 这一位
  rationale: 直接保留指示代词的指示力度，也避免用“他”在正文中悄然消除先行词的讨论空间。
- source_word: ὁ ἀληθινὸς θεὸς
  choice: 真神
  rationale: 这是简洁、庄重且通行的汉语表达，准确对应“真实的神”。
- source_word: ζωὴ αἰώνιος
  choice: 永生
  rationale: “永生”是约翰著作中自然且成熟的汉语表达，兼含生命的恒久性与属神性质。
theological_decisions:
- issue: οὗτός ἐστιν ὁ ἀληθινὸς θεὸς καὶ ζωὴ αἰώνιος中οὗτός的先行词
  choice: 正文译作“这一位就是真神，也是永生”，依照通常语法让最近的“耶稣弥赛亚”成为自然所指，同时保留指示代词本身。
  alternative: “这一位”也可能回指前文的“那位真实者”，即父神；“在他的儿子耶稣弥赛亚里面”则说明信徒如何在那位真实者里面。
  rationale: οὗτός通常自然指向最近的阳性单数人物“耶稣弥赛亚”，但上下文反复提到“那位真实者”，使回指父神的理解仍有讨论余地。正文不改写为明确点名的“耶稣就是真神”，并以脚注保留真实的句法与神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“那位真实者”保留原文形容词名词化及两次重复；“在……里面”保留约翰特有的关系性语言；分号与“就是”使长句在汉语中清楚顺畅。
