    issue: “上帝儿子”缺少结构助词“的”
    rationale: τοῦ υἱοῦ τοῦ θεοῦ是“上帝的儿子”这一明确称号。“上帝儿子”虽可在极简宗教文体中出现，但不符合此处现代标准汉语的自然定语结构，且降低称号的清晰度。
  revised_text: 我把这些事写给你们这些信靠上帝的儿子之名的人，是要让你们知道你们有永生。
