    reason: 原文把“那些信靠上帝的儿子之名的人”置于句末；这短语可理解为对前面“你们”的后置同位说明。
  revision_rationale: 修改仅为使“上帝的儿子”准确、自然地对应原文称号，并消除“自己”可能产生的指代含混。保留原译对句末分词短语的同位语理解及其脚注所说明的原文语序可能性。
