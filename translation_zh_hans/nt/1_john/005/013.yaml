id: 1JN.5.13
reference: 1 John 5:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ταῦτα ἔγραψα ⸀ὑμῖν ἵνα εἰδῆτε ὅτι ζωὴν ⸂ἔχετε αἰώνιον⸃, ⸂τοῖς πιστεύουσιν⸃ εἰς τὸ ὄνομα τοῦ υἱοῦ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/013.yaml
  text: I have written these things to you who believe in the name of the Son of God[a], so that you may know that you have eternal life.
translation:
  language: zh_hans
  text: 我把这些事写给你们这些信靠上帝的儿子之名的人，是要让你们知道你们有永生。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ταῦτα
  choice: 这些事
  rationale: 保留中性复数的指向，可概括本信内容或前文所论之事，符合约翰文献的常见表达。
- source_word: ἔγραψα
  choice: 我把……写给
  rationale: 希腊语不定过去时在书信语境中表示已经完成的写作行动；现代汉语用“写给”自然清楚，无须硬加时态助词。
- source_word: ὑμῖν
  choice: 给你们
  rationale: 直接表达与格所标明的收信对象。
- source_word: ἵνα εἰδῆτε
  choice: 是要让你们知道
  rationale: 明确保留ἵνα所表达的目的，并以自然的现代汉语传达“知道、确知”的含义。
- source_word: ζωὴν αἰώνιον
  choice: 永生
  rationale: 这是约翰文献中自然、凝练且为普通读者熟悉的对应语，兼顾生命的恒久性及其与上帝关系中的性质。
- source_word: ἔχετε
  choice: 有
  rationale: 保留现在时所表达的现今拥有，而不是仅指将来的盼望。
- source_word: τοῖς πιστεύουσιν
  choice: 你们这些信靠……的人
  rationale: 将该与格分词短语理解为对ὑμῖν的同位说明，既保留收信人的身份，也使中文通顺。
- source_word: πιστεύουσιν εἰς
  choice: 信靠
  rationale: “信靠”比单纯认知性的“相信”更能传达πιστεύω εἰς所含的投靠与信赖，同时不额外加入宗派性解释。
- source_word: τὸ ὄνομα
  choice: 之名
  rationale: 保留“信靠其名”的圣经表达，不把“名”释义性地改写为身份、权柄或本人。
- source_word: τοῦ υἱοῦ τοῦ θεοῦ
  choice: 上帝儿子
  rationale: 直接表达属格关系和基督论称号；在定语结构中不重复“的”，使现代中文简洁自然。
theological_decisions:
- issue: τοῖς πιστεύουσιν的修饰关系和位置
  choice: 将其与ὑμῖν连接，译作“给你们这些信靠……的人”
  alternative: 依希腊语表面次序置于确据句之后：“让你们知道自己有永生——就是你们这些信靠……的人”
  rationale: 把该短语作为ὑμῖν的同位语，最自然地说明收信对象，也符合全句目的：作者写信给信徒，使他们知道自己有永生。原文次序容许在后面作补充或重申，因此以脚注保留这一真实的句法可能性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“永生”保留约翰文献的固定神学用语；“信靠……之名”既保留原文意象，也传达关系性的信赖。正文按自然中文调整语序，脚注交代原文句末同位语所造成的句法张力。
