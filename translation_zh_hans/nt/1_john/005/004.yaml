  text: ὅτι πᾶν τὸ γεγεννημένον ἐκ τοῦ θεοῦ νικᾷ τὸν κόσμον. καὶ αὕτη ἐστὶν ἡ νίκη ἡ νικήσασα τὸν κόσμον, ἡ πίστις ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/004.yaml
  text: 'For everyone who has been born of God overcomes the world[b][a]. And this is the victory that has overcome the world: our faith.'
translation:
  language: zh_hans
  text: 因为凡从神生的，都胜过世界。[a]这就是胜过世界的胜利：我们的信心。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为中性单数，直译可作“凡从神所生的”；此形式概括所有从神而生的人。
    reason: lexical_alternative
  - marker: b
    text: “信心”也可译作“忠信”；原词按语境可表示信、信靠或忠信。
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 承接上文并说明理由，保留原文的因果关系。
- source_word: πᾶν τὸ γεγεννημένον
  choice: 凡……的，都
  rationale: 原文是中性单数的概括表达，指从神而生的整个群体；汉语用“凡……的，都”自然地保留其总括性。
- source_word: γεγεννημένον ἐκ τοῦ θεοῦ
  choice: 从神生的
  rationale: 保留完成时所表达的既成事实及持续结果，也符合约翰著作中有关属灵出生的用语。
- source_word: νικᾷ / νίκη / νικήσασα
  choice: 胜过／胜利／使……胜过
  rationale: 尽量保留同根词之间的呼应；第二句采用自然汉语句式表达胜利与胜过世界的关系。
- source_word: τὸν κόσμον
  choice: 世界
  rationale: 保留约翰著作中“世界”作为与神相对立之秩序的语义，不在正文中作解释性扩展。
- source_word: ἡ πίστις ἡμῶν
  choice: 我们的信心
  rationale: πίστις在此最自然地指信靠；“信心”是现代汉语圣经语境中清楚而常用的表达。
theological_decisions:
- issue: πᾶν τὸ γεγεννημένον所指为何
  choice: 以“凡从神生的”概括所有从神而生的人
  alternative: 凡从神而生的一切
  rationale: 原文形式为中性单数，具有类别概括作用；上下文所指是信徒。正文采用自然的人称理解，脚注保存形式较直译的可能。
- issue: πίστις的含义
  choice: 信心
  alternative: 忠信
  rationale: 本节把胜过世界的胜利归于“我们的πίστις”，语境更支持对神或基督的信靠；但该词在某些语境也可表示忠信，故以脚注保留。
- issue: ἡ νικήσασα的时貌
  choice: 使我们胜过
  alternative: 已经胜过
  rationale: 原文不定过去时分词凸显胜利的成就性。正文采用符合汉语表达的关系结构，避免把时貌过度限定为单一时间点。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“凡……的，都”保留原文的总括性；第二句调整为自然汉语语序，同时保持“胜过—胜利”的词义呼应。
