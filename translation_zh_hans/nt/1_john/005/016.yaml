id: 1JN.5.16
reference: 1 John 5:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐάν τις ἴδῃ τὸν ἀδελφὸν αὐτοῦ ἁμαρτάνοντα ἁμαρτίαν μὴ πρὸς θάνατον, αἰτήσει, καὶ δώσει αὐτῷ ζωήν, τοῖς ἁμαρτάνουσιν μὴ πρὸς θάνατον. ἔστιν ἁμαρτία πρὸς θάνατον· οὐ περὶ ἐκείνης λέγω ἵνα ἐρωτήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/016.yaml
  text: If anyone sees his brother committing a sin not leading to death[a], he shall ask, and God will give him life—to those committing sins not leading to death. There is sin leading to death[c][b]; I am not saying that he should ask about that.
translation:
  language: zh_hans
  text: 人若看见自己的弟兄[a]犯了不至于死的罪[b]，就应当祈求，神[c]必赐生命给他——给那些犯了不至于死的罪的人。有至于死的罪；我不是说应当为那罪祈求。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄”原文为阳性单数，这里很可能指同一信仰群体中的一位信徒；按语境也可泛指基督徒同伴。
    reason: cultural_note
  - marker: b
    text: 这里的“死”原文没有说明是肉身的死、属灵的死，还是末后的定罪。
    reason: ambiguity_note
  - marker: c
    text: 原文直译为“他必赐生命给他”，没有明说施予者；正文根据祈求的语境补出“神”。
    reason: implicit_subject
lexical_decisions:
- source_word: ἀδελφὸν
  choice: 弟兄
  rationale: 原文为阳性单数，在约翰书信中通常指信仰群体中的同伴；“弟兄”保留原文形式，同时以脚注说明其语境范围。
- source_word: ἁμαρτάνοντα ἁμαρτίαν
  choice: 犯了……的罪
  rationale: 以现代汉语自然表达分词加同源宾格所指的具体犯罪行为。
- source_word: μὴ πρὸς θάνατον
  choice: 不至于死
  rationale: “至于”保留πρός所含的趋向或结果意味，又不限定这里所说的是肉身、属灵还是末后的死亡。
- source_word: αἰτήσει
  choice: 就应当祈求
  rationale: 未来直陈式在此带有劝令意味；“应当祈求”清楚表达人在看见弟兄犯罪后该有的回应。
- source_word: δώσει αὐτῷ ζωήν
  choice: 神必赐生命给他
  rationale: 原文未明说主语；祷告语境强烈表明赐生命者是神。中文补出“神”使句意清楚，并用脚注交代原文的省略。
- source_word: ζωήν
  choice: 生命
  rationale: 保留约翰著作中“生命”的丰富神学内涵，不擅自缩窄为“属灵生命”或“永生”。
- source_word: τοῖς ἁμαρτάνουσιν μὴ πρὸς θάνατον
  choice: ——给那些犯了不至于死的罪的人
  rationale: 破折号保留此复数与前面单数“他”之间解释性而略显突兀的句法关系，不强行消除原文张力。
- source_word: ἔστιν ἁμαρτία πρὸς θάνατον
  choice: 有至于死的罪
  rationale: 保留无冠词结构的简洁和类别上的开放性，不武断译成某一种特定的罪。
- source_word: οὐ περὶ ἐκείνης λέγω ἵνα ἐρωτήσῃ
  choice: 我不是说应当为那罪祈求
  rationale: περὶ译作“为”，符合祷告语境；ἐρωτήσῃ译作“祈求”，在自然中文中传达其请求之意，同时不把这句话加强为明确禁止。
theological_decisions:
- issue: “至于死的罪”中“死”的含义
  choice: 正文只译“死”，不作限定。
  alternative: 肉身死亡、属灵死亡、永远灭亡或末后定罪。
  rationale: 本节没有界定“死”的性质；保留其歧义，避免替作者解决经文本身留下的神学张力。
- issue: “必赐生命给他”的施予者
  choice: 正文补出“神”为主语，并以脚注说明原文省略主语。
  alternative: 保留为“他必赐生命给他”，或把祈求者理解为施予者。
  rationale: 祷告的语境最自然地指向神为赐生命者；补出主语有助于现代中文读者理解，但脚注保留原文形式的信息。
- issue: 最后一句是禁止还是范围限定
  choice: 译作“我不是说应当为那罪祈求”。
  alternative: “我说不可为那罪祈求”。
  rationale: 原文否定的是作者正在提出这样的要求，并未直接使用禁止祷告的命令式，因此不把语气强化为绝对禁令。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“至于死”略带经文语体，但准确保留趋向和结果的双重可能；全句避免术语化解释。破折号有意保留原文由单数“他”转向复数“那些人”的解释性结构。
