id: 1JN.5.10
reference: 1 John 5:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ πιστεύων εἰς τὸν υἱὸν τοῦ θεοῦ ἔχει τὴν μαρτυρίαν ἐν ⸀αὑτῷ· ὁ μὴ πιστεύων τῷ θεῷ ψεύστην πεποίηκεν αὐτόν, ὅτι οὐ πεπίστευκεν εἰς τὴν μαρτυρίαν ἣν μεμαρτύρηκεν ὁ θεὸς περὶ τοῦ υἱοῦ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/010.yaml
  text: The one who believes in the Son of God has the testimony in himself[a]; the one who does not believe God has made him a liar[b], because he has not believed the testimony that God has testified about his Son.
translation:
  language: zh_hans
  text: 信上帝儿子的人，自己里面有这见证[a]；不信上帝的人，把上帝当作说谎者[b]，因为他不相信上帝关于他儿子所作的见证。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“在他里面”，也可理解为“在儿子里面”。
    reason: textual_variant
  - marker: b
    text: 直译“使他成为说谎者”；意思是，拒绝上帝的见证，就是把上帝说成不真实的。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πιστεύων εἰς τὸν υἱὸν τοῦ θεοῦ
  choice: 信上帝儿子的
  rationale: 带冠词的现在分词表示泛指的一类人；πιστεύω εἰς 表示以某人为信靠对象，译作“信上帝儿子”自然且准确。
- source_word: τὴν μαρτυρίαν
  choice: 这见证
  rationale: μαρτυρία 指上帝所作见证及其内容；“见证”保留约翰著作中的关键词及作证语境，指示词“这”承接上下文所述的见证。
- source_word: ἐν αὑτῷ
  choice: 自己里面有
  rationale: 反身代词最自然地回指信上帝儿子的人；“自己里面”保留见证内在于信者这一表达，而不进一步解释其具体方式。
- source_word: ὁ μὴ πιστεύων τῷ θεῷ
  choice: 不信上帝的
  rationale: πιστεύω 后接与格，在这里是“不相信上帝所说的”，不是单指不相信上帝存在；下文的原因从句明确把这种不信界定为不接受上帝的见证。
- source_word: ψεύστην πεποίηκεν αὐτόν
  choice: 就是把他当作说谎的
  rationale: 直译为“使他成为说谎者”，语义是拒绝上帝见证的人实际上把上帝视为虚假。“把他当作说谎的”用现代汉语表达这一含义，同时保留强烈指控。
- source_word: οὐ πεπίστευκεν
  choice: 他不相信
  rationale: 希腊语完成时表示直到当前仍未接受；汉语不必机械添加“已经”，上下文中的“不相信”可自然表达持续有效的不信状态。
- source_word: ἣν μεμαρτύρηκεν ὁ θεὸς περὶ τοῦ υἱοῦ αὐτοῦ
  choice: 上帝为自己儿子所作的见证
  rationale: 以“见证／作见证”的同源表达再现 μαρτυρία／μαρτυρέω 的修辞呼应；περί 表示关于儿子的内容，汉语“为……所作的见证”在此自然涵盖这一关系。
theological_decisions:
- issue: “见证在自己里面”的所指
  choice: 见证在信上帝儿子的人里面
  alternative: 见证在上帝的儿子里面
  rationale: SBLGNT 正文采用反身形式 αὑτῷ，最自然地回指刚提到的信者；译文直接保留这种内在拥有见证的说法，不从邻近经文引入额外教义解释。
- issue: “不信上帝”的含义
  choice: 不接受上帝关于其儿子的见证
  alternative: 泛指不相信上帝存在
  rationale: ὅτι 引出的原因从句明确说明，此处的不信是没有相信上帝为其儿子所作的见证。译文因此用“不信上帝”，而不是“不信有上帝”。
- issue: “把他当作说谎的”的神学力度
  choice: 拒绝见证等于把上帝视为说谎的
  alternative: 较弱地译为“怀疑上帝的话”
  rationale: ψεύστης 是明确的“说谎者”，不应弱化；同时以“当作”说明经文不是说人真能使上帝成为说谎者，而是其拒绝所表达的判断。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“自己里面有这见证”略带经文式凝练，以保留原文空间意象；“把他当作说谎的”既维持原文力度，又避免现代汉语把“使他成为”误解为实际改变上帝。代词“他”承接紧邻的“上帝”，脚注进一步明确其所指。
