  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: πᾶς ὁ ἐν αὐτῷ μένων οὐχ ἁμαρτάνει· πᾶς ὁ ἁμαρτάνων οὐχ ἑώρακεν αὐτὸν οὐδὲ ἔγνωκεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/006.yaml
  text: Everyone who remains in him does not sin[a]; everyone who sins has not seen him nor known him.
translation:
  language: zh_hans
  text: 凡住在他里面的，就不犯罪[a]；凡犯罪的，既没有见过他，也不认识他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不持续犯罪……凡一贯犯罪的。”这里的希腊语现在时形式可以描述持续或具有一贯特征的行为。
    reason: 说明希腊语现在时的体貌可能性，同时保留正文较形式对应的表达。
lexical_decisions:
- source_word: πᾶς ὁ
  choice: 凡……的
  rationale: 带冠词的 πᾶς ὁ 泛指属于所述类别的任何人；“凡……的”自然、庄重，并保留其普遍涵盖力。
- source_word: ἐν αὐτῷ μένων
  choice: 住在他里面的
  rationale: μένω 是约翰著作中的关键词，表示持续停留、常在的关系；“住在他里面”既保留“在他里面”的联合性表达，也符合现代汉语圣经语体。
- source_word: οὐχ ἁμαρτάνει
  choice: 不犯罪
  rationale: 直译希腊语现在时，避免在正文中把其体貌强行限定为反复或习惯性行为；其可能表示持续或一贯行动的含义在脚注中说明。
- source_word: ὁ ἁμαρτάνων
  choice: 凡犯罪的
  rationale: 保留现在分词与前句现在时动词的平行，也不在正文中额外加入“持续”或“一贯”；相关体貌可能性由脚注交代。
- source_word: οὐχ ἑώρακεν αὐτόν
  choice: 没有见过他
  rationale: 以汉语经验体“见过”自然表达希腊语完成时所指的既往经历及其现今结果。
- source_word: οὐδὲ ἔγνωκεν αὐτόν
  choice: 也不认识他
  rationale: γινώσκω 在约翰语境中不只指认知，也可指关系性的认识；“不认识”保留这一含义，并自然表达完成时所形成的当前状态。
- source_word: αὐτῷ / αὐτόν
  choice: 他
  rationale: 原文在本节只用代词，没有明说所指是父、子或基督；译文同样保留代词，以免过度解释。
theological_decisions:
- issue: 本节是否宣称住在他里面的人绝不会犯任何一次罪
  choice: 正文按原文简洁译为“不犯罪／凡犯罪的”，并以脚注指出希腊语现在时也可描述持续或一贯的行为。
  alternative: 直接在正文译为“不持续犯罪／凡一贯犯罪的”。
  rationale: 希腊语现在时本身不必然编码“不断”或“习惯性”，但本书1:8—2:2与本节语境使持续或特征性行为成为重要理解。正文与脚注的安排既保留原文措辞的张力，也不把它无说明地解释为信徒绝对无罪。
- issue: “他”的具体所指
  choice: 保留代词“他”。
  alternative: 明确译作“神”“神的儿子”或“基督”。
  rationale: 上下文涉及父与子，而本节希腊文本使用代词；不在译文中指定所指，可避免加入原文没有明说的神学判断。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“住在他里面”保留约翰著作特有的关系与联合意象；“既……也……”使末句两项否定连接清楚。
