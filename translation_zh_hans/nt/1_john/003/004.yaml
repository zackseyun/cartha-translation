id: 1JN.3.4
reference: 1 John 3:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Πᾶς ὁ ποιῶν τὴν ἁμαρτίαν καὶ τὴν ἀνομίαν ποιεῖ, καὶ ἡ ἁμαρτία ἐστὶν ἡ ἀνομία.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/004.yaml
  text: Everyone who practices sin also practices lawlessness[b][a], and sin is lawlessness.
translation:
  language: zh_hans
  text: 凡惯于犯罪的人[a]，也惯于行不法的事；罪就是不法[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“凡行罪的人”。希腊语原文直译接近“行”，其现在时形式在这里可表达持续或具有特征性的行为，因此正文译作“惯于犯罪”。
    reason: lexical_alternative
  - marker: b
    text: “不法”也可译作“违法”或“违背律法”；这里没有明确限定所指的是哪一种律法。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς ὁ ποιῶν τὴν ἁμαρτίαν
  choice: 凡惯于犯罪的人
  rationale: 带冠词的现在时分词泛指所有如此行的人；结合上下文，“惯于犯罪”自然表达持续或特征性的行为，同时不把该时态绝对化为一个专门的“习惯时态”。
- source_word: καὶ τὴν ἀνομίαν ποιεῖ
  choice: 也惯于行不法的事
  rationale: 重复“惯于行”以保留 ποιῶν 与 ποιεῖ 的平行结构；“不法”直接对应 ἀνομία，并保留它与“法”的词义联系。
- source_word: ἁμαρτία
  choice: 罪
  rationale: 此处是泛指和抽象用法，现代汉语用“罪”即可，无须另行表现希腊语冠词。
- source_word: ἀνομία
  choice: 不法
  rationale: “不法”既简洁又保留原词关于无视、违背法的含义；相比“违法”，“不法”不把含义局限于世俗法规；相比“不义”，“不法”更直接对应原词。
- source_word: καὶ ἡ ἁμαρτία ἐστὶν ἡ ἀνομία
  choice: 罪就是不法
  rationale: 保留原文简洁而强烈的定义句式，不将两者关系弱化为罪的例子、结果或一般关联。
theological_decisions:
- issue: 现在时形式表达一次行为还是持续、特征性的行为
  choice: 以“惯于犯罪／惯于行”表达特征性行为
  alternative: 较为字面的“行罪／行不法”或通常所说的“犯罪／行不法”
  rationale: 约翰一书3章的上下文侧重持续或具有特征性的行为。“惯于”使这一语境意义在现代汉语中更清楚，但脚注保留较字面的译法，避免声称希腊语现在时本身必然等于习惯行为。
- issue: ἀνομία 在定义句中的含义
  choice: 不法
  alternative: 违法、违背律法、不义
  rationale: 原文以压缩的方式把罪界定为 ἀνομία。“不法”保留其词义及神学张力，不在正文中擅自限定为违反摩西律法、国家法律或某一种特定法规。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“惯于”比“不断”更少暗示毫无间断，也比“以犯罪为业”更中性；分号保留两个平行陈述之间紧密的解释关系。
