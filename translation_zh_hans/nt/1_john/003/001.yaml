id: 1JN.3.1
reference: 1 John 3:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἴδετε ποταπὴν ἀγάπην δέδωκεν ἡμῖν ὁ πατὴρ ἵνα τέκνα θεοῦ κληθῶμεν, ⸂καὶ ἐσμέν⸃. διὰ τοῦτο ὁ κόσμος οὐ γινώσκει ⸀ἡμᾶς ὅτι οὐκ ἔγνω αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/001.yaml
  text: See what kind of love the Father has given to us[a], that we should be called children of God—and we are. For this reason the world does not know us[e][d][c][b], because it did not know him.
translation:
  language: zh_hans
  text: 你们看，父赐给我们的是何等的爱[a]，使我们得称为上帝的儿女——我们也确实是[b]。世人之所以不认识我们[c]，是因为他们未曾认识他[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“父赐给我们的是怎样的一种爱”。原文强调这种爱的性质，并带有惊叹意味；传统上也常译作“何等大的爱”。
    reason: lexical_alternative
  - marker: b
    text: 有些抄本没有“我们也确实是”这句话。
    reason: textual_variant
  - marker: c
    text: “不认识我们……未曾认识他”也可译作“不认出我们……没有认出他”。
    reason: lexical_alternative
  - marker: d
    text: 本节中的“他”最自然地指父；按约翰著作的较广语境，也有人理解为基督。
    reason: alternative_reading
lexical_decisions:
- source_word: ἴδετε
  choice: 你们看
  rationale: 复数命令式，用作唤起注意的呼语；“你们看”自然、直接，也避免古雅措辞。
- source_word: ποταπὴν ἀγάπην
  choice: 何等的爱
  rationale: ποταπός侧重爱的性质并带有惊叹意味；现代汉语“何等的爱”既表达惊叹，也不把含义局限为单纯的程度大小。脚注保留更明确的性质性译法。
- source_word: δέδωκεν ἡμῖν ὁ πατὴρ
  choice: 父赐给我们
  rationale: “赐给”自然表达父所给予的恩惠；希腊语完成时所含的持续结果由上下文及后句“我们也确实是”体现。
- source_word: ἵνα τέκνα θεοῦ κληθῶμεν
  choice: 使我们得称为上帝的儿女
  rationale: 保留ἵνα所表达的目的或结果关系；τέκνα是性别包容的“儿女”，不限定为儿子。
- source_word: καὶ ἐσμέν
  choice: 我们也确实是
  rationale: 译出原文强调性的确认：信徒不只是被这样称呼，实际上也是上帝的儿女。
- source_word: διὰ τοῦτο
  choice: 之所以
  rationale: 与后面的“是因为”构成自然的现代汉语因果句式，清楚连接前后逻辑。
- source_word: ὁ κόσμος
  choice: 世人
  rationale: 此处κόσμος指不认识上帝的人类世界；译为“世人”比无生命意味的“世界”更自然地作“不认识”的主语，同时不额外界定其范围。
- source_word: οὐ γινώσκει ἡμᾶς
  choice: 不认识我们
  rationale: γινώσκω在此可指认识或认出；“不认识”保留与后句的词语对应，另一可能译法见脚注。
- source_word: οὐκ ἔγνω αὐτόν
  choice: 他们不认识他
  rationale: 以复数“他们”承接集合名词“世人”；“他”保留希腊语代词在较广约翰语境中可能存在的所指张力。
theological_decisions:
- issue: αὐτόν（“他”）所指为何
  choice: 正文保留“他”，按本节最近的明确先行词自然理解为父
  alternative: 在约翰著作的较广语境中，也有人理解为基督
  rationale: 最近的明确先行词是“父”，句内逻辑也支持世人因不认识父而不认识上帝的儿女；但汉语正文不以增补名词的方式排除基督论理解，脚注说明另一读法。
- issue: 是否包括καὶ ἐσμέν
  choice: 正文译出“我们也确实是”
  alternative: 少数抄本省略此语
  rationale: SBLGNT正文收录该短语，且它对“称为”作出有力确认；抄本差异在脚注中交代。
- issue: “称为上帝的儿女”是否仅表示名称或身份
  choice: 以紧接的“我们也确实是”保留名称与真实身份之间的强调
  alternative: 将καὶ ἐσμέν弱化为普通承接语
  rationale: 原文刻意确认这种称呼对应真实身份，不宜淡化，但也不在译文中扩展其系统神学含义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“父”“上帝的儿女”为普通读者熟悉的圣经表达；“何等的爱”保留惊叹语气，脚注澄清其性质性含义。因汉语不宜机械复制英文脚注次序，标记按正文首次出现顺序排列，并确保每一标记均在正文出现。
