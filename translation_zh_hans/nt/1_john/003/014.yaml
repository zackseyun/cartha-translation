source:
  edition: SBLGNT
  text: ἡμεῖς οἴδαμεν ὅτι μεταβεβήκαμεν ἐκ τοῦ θανάτου εἰς τὴν ζωήν, ὅτι ἀγαπῶμεν τοὺς ἀδελφούς· ὁ μὴ ⸀ἀγαπῶν μένει ἐν τῷ θανάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/014.yaml
  text: We know that we have passed from death into life[a], because we love the brothers. The one who does not love remains in death.
translation:
  language: zh_hans
  text: 我们知道，自己已经出死入生了，因为我们爱弟兄[a]。不爱的人仍在死中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“弟兄姊妹”；希腊文作“弟兄”，在本语境中很可能泛指同为信徒的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδαμεν
  choice: 我们知道
  rationale: οἶδα虽为完成时形式，在通用希腊语中具有现在状态意义；译为“知道”自然准确。
- source_word: μεταβεβήκαμεν
  choice: 已经出……入……了
  rationale: 完成时表达已经完成且结果持续至今的转变；结合ἐκ…εἰς译成“已经出死入生了”，既保留移动意象，也体现当前状态。
- source_word: ἐκ τοῦ θανάτου εἰς τὴν ζωήν
  choice: 出死入生
  rationale: “出……入……”对应ἐκ…εἰς从一个领域出来、进入另一个领域的方向性；这一简洁汉语表达保留“死亡”和“生命”的对照及领域转换意象。
- source_word: ἀγαπῶμεν
  choice: 我们爱
  rationale: 现在时在此表示持续而有特征性的行动；“爱”是现代汉语中自然且不加解释的对应词。
- source_word: τοὺς ἀδελφούς
  choice: 弟兄[a]
  rationale: 保留希腊文阳性复数的形式，同时用脚注说明本语境很可能泛指同为信徒的人，包括女性。
- source_word: ὁ μὴ ἀγαπῶν
  choice: 不爱的人
  rationale: 带冠词的现在分词泛指具有这一持续特征的人；此译简洁自然，并保留泛指单数的类别意义。
- source_word: μένει
  choice: 仍在
  rationale: 表达持续停留于原有状态；与“死中”连用比生硬直译为“住在”更符合现代汉语，同时保留约翰著作中μένω的持续意味。
- source_word: ἐν τῷ θανάτῳ
  choice: 在死中
  rationale: 保留原文处于“死亡”领域之中的紧凑隐喻，不扩展为“属灵死亡”或其他解释。
theological_decisions:
- issue: ἀδελφοί的指称范围与性别形式
  choice: 正文译为“弟兄”，脚注说明也可译作“弟兄姊妹”
  alternative: 正文直接译为“弟兄姊妹”
  rationale: 希腊文形式为阳性复数，而本语境很可能泛指信徒群体，包括女性。正文保留源语形式，脚注呈现语境中的包容性所指。
- issue: “死”与“生”的性质
  choice: 保留“死”与“生”，不作解释性扩展
  alternative: 译作“属灵的死”与“永生”，或“死亡的领域”与“生命的领域”
  rationale: 原文以凝练的神学隐喻陈述转变，却未在本节限定其全部内涵；不作扩展可保留其张力与开放性。
- issue: 爱作为知道已经出死入生的根据或证据
  choice: 保留因果连接“因为”，不进一步界定逻辑关系
  alternative: 解释为“我们之所以知道……是因为……”或“证据是……”
  rationale: 第二个ὅτι自然引出知道的根据，但原文没有系统说明爱是成因、证据还是识别标志；直译“因为”避免过度定论。
translation_notes:
  register: 采用现代、简洁而庄重的标准普通话。“出死入生”保留原文由死亡领域进入生命领域的移动意象，并符合自然汉语表达；“不爱的人仍在死中”避免冗长，同时保持原文的鲜明对照。
