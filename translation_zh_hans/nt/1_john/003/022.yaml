source:
  edition: SBLGNT
  text: καὶ ὃ ⸀ἐὰν αἰτῶμεν λαμβάνομεν ⸀ἀπ’ αὐτοῦ, ὅτι τὰς ἐντολὰς αὐτοῦ τηροῦμεν καὶ τὰ ἀρεστὰ ἐνώπιον αὐτοῦ ποιοῦμεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/022.yaml
  text: And whatever we ask[a], we receive from him, because we keep his commandments and do what is pleasing in his sight.
translation:
  language: zh_hans
  text: 我们无论求什么，都从他领受，因为我们遵守他的命令，并且做他眼中所喜悦的事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὃ ἐὰν αἰτῶμεν
  choice: 我们无论求什么
  rationale: ὃ与ἐάν构成不定关系结构，表示“无论什么”；与“求”连用，现代汉语自然表达为“无论求什么”。
- source_word: λαμβάνομεν ἀπ’ αὐτοῦ
  choice: 都从他领受
  rationale: λαμβάνομεν在此为一般现在意义，ἀπό加属格标明来源；“从他领受”既准确表达来源，也符合祷告语境中的庄重语体。
- source_word: ὅτι
  choice: 因为
  rationale: ὅτι在此引出领受所求之事的原因，译作“因为”保留原文明确的因果关系。
- source_word: τὰς ἐντολὰς αὐτοῦ τηροῦμεν
  choice: 我们遵守他的命令
  rationale: τηρέω在约翰文献中有持守、遵守之意；现代汉语中“遵守命令”清楚自然，也保留持续忠于命令的含义。
- source_word: τὰ ἀρεστὰ ἐνώπιον αὐτοῦ ποιοῦμεν
  choice: 做他眼中所喜悦的事
  rationale: τὰ ἀρεστά是名词化的中性复数，指“令人喜悦的事”；ἐνώπιον αὐτοῦ表示“在他面前／在他眼中”。整句如此翻译自然，并保留行为受他察看和认可的意味。
theological_decisions:
- issue: 祷告蒙应允与遵守命令之间的关系
  choice: 保留“因为”所表达的明确因果关系
  alternative: 弱化为仅仅相关，或扩写成祷告必然按人的愿望实现的机械公式
  rationale: 原文以ὅτι明确说明原因。译文应保留这一神学张力，既不削弱因果关系，也不加入原文没有说明的条件或体系化解释。
translation_notes:
  register: 采用现代、清楚而庄重的普通话。“领受”比“得到”更符合此处祷告和神赐予的语境；“他眼中所喜悦的事”自然传达ἐνώπιον αὐτοῦ，因而无需脚注。
