  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐν τούτῳ φανερά ἐστιν τὰ τέκνα τοῦ θεοῦ καὶ τὰ τέκνα τοῦ διαβόλου· πᾶς ὁ μὴ ποιῶν δικαιοσύνην οὐκ ἔστιν ἐκ τοῦ θεοῦ, καὶ ὁ μὴ ἀγαπῶν τὸν ἀδελφὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/010.yaml
  text: 'By this the children of God and the children of the devil are evident: everyone who does not practice righteousness is not from God[c][b][a], nor is the one who does not love his brother.'
translation:
  language: zh_hans
  text: 由此[a]可以看出谁是上帝的儿女，谁是魔鬼的儿女：凡不行义的，都不是出于上帝；不爱自己的弟兄[b]的，也不是出于上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “由此”也可译作“在这一点上”或“从这一点可以看出”。原文可表示据以辨明这种区别的依据。
    reason: lexical_alternative
  - marker: b
    text: “弟兄”原文为阳性单数；在本书语境中可泛指同信的弟兄姊妹。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: 由此
  rationale: 既可承接上文，也可引出下文所述的辨识依据；“由此”在现代汉语中自然，并保留原短语的指示性及一定程度的开放性。
- source_word: φανερά ἐστιν
  choice: 可以看出
  rationale: 表达“显明、可辨认”的状态；相比“显然是”，更自然地连接两类人的辨识依据。
- source_word: τὰ τέκνα τοῦ θεοῦ καὶ τὰ τέκνα τοῦ διαβόλου
  choice: 谁是上帝的儿女，谁是魔鬼的儿女
  rationale: 保留τέκνα的家庭关系意象，同时以现代汉语常用的“谁是……谁是……”表达两类人显明可辨。
- source_word: πᾶς ὁ μὴ ποιῶν δικαιοσύνην
  choice: 凡不行义的
  rationale: “凡……的”对应概括性结构；“行义”简洁表达持续或特征性的正义行为，而非仅一次行动。
- source_word: δικαιοσύνην
  choice: 义
  rationale: 此处主要指符合上帝性情的正直行为；“义”既保留约翰文献的神学伦理用语，也避免把范围缩窄为社会司法意义的“公正”。
- source_word: οὐκ ἔστιν ἐκ τοῦ θεοῦ
  choice: 不是出于上帝
  rationale: “出于”准确体现ἐκ所表示的来源或归属关系，不额外引入后期教义范畴。
- source_word: ὁ μὴ ἀγαπῶν τὸν ἀδελφὸν αὐτοῦ
  choice: 不爱自己弟兄的
  rationale: 保留阳性单数“弟兄”的原文形式；“自己”自然对应αὐτοῦ，并避免汉语中“他的弟兄”指代不清。
- source_word: καὶ
  choice: 也不是
  rationale: 补足希腊文省略而由上句承接的“不是出于上帝”，使否定并列关系在汉语中清楚自然。
theological_decisions:
- issue: 以家庭关系语言表达属灵身份
  choice: 上帝的儿女／魔鬼的儿女
  alternative: 属上帝的人／属魔鬼的人
  rationale: 原文明确使用τέκνα“儿女”，应保留约翰著作关于属灵亲属关系和归属的鲜明意象。
- issue: ἀδελφός的性别形式及语境范围
  choice: 弟兄
  alternative: 弟兄姊妹；同信的人
  rationale: 正文保留原文阳性单数形式，不将语境解释直接代入正文；脚注说明在此语境中可泛指同信的人。
- issue: 不行义与不爱弟兄之间的关系
  choice: 将两者并列为“不出于上帝”的辨识标志
  alternative: 把不爱弟兄解释为不行义的唯一内容
  rationale: 原文以καί连接两个带否定的分词结构；译文保留并列及省略，不把二者的逻辑关系进一步限定。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“行义”“出于上帝”保留经文的重要神学与伦理表达，但句法按现代汉语调整。脚注标记置于相关经文末尾，正文中的每个标记均与脚注对应。
