  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ οἴδατε ὅτι ἐκεῖνος ἐφανερώθη ἵνα τὰς ⸀ἁμαρτίας ἄρῃ, καὶ ἁμαρτία ἐν αὐτῷ οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/005.yaml
  text: And you know that he appeared in order to take away sins[b][a], and in him there is no sin.
translation:
  language: zh_hans
  text: 你们知道，他显现[a]，是要除去罪[b]；在他里面并没有罪。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“被显明出来”。
    reason: lexical_alternative
  - marker: b
    text: “除去”所译的希腊语动词也可表示“带走”或“担当”。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδατε
  choice: 你们知道
  rationale: οἶδα虽为完成时形式，在通用希腊语中通常表达现在的认知状态；“你们知道”自然准确。
- source_word: ἐκεῖνος
  choice: 他
  rationale: 字面可作“那一位”，但约翰文献中此处明确而带强调地指向耶稣基督；现代汉语用“他”最自然，也不额外添加原文没有的称谓。
- source_word: ἐφανερώθη
  choice: 显现
  rationale: 该被动形式表示他进入可见、可知的历史显现；汉语“显现”自然涵盖此义，并保留约翰文献的启示色彩。
- source_word: ἵνα
  choice: 是要
  rationale: 明确表达目的，符合现代汉语句法，也保留ἵνα的目的含义。
- source_word: τὰς ἁμαρτίας
  choice: 罪
  rationale: 希腊文为复数，指具体的诸般罪；汉语“罪”通常可作集合性表达，若机械译成“罪行”或“种种罪”会使语气变窄或变重。
- source_word: ἄρῃ
  choice: 除去
  rationale: αἴρω可指拿起、带走或除掉；这里以罪为宾语，“除去”清楚表达消除罪的目的，同时不把经文限定为某一种赎罪机制。
- source_word: ἁμαρτία
  choice: 罪
  rationale: 单数无冠词在此绝对地陈述他无罪；译作“罪”简洁并保留原文与前半句的词语呼应。
- source_word: ἐν αὐτῷ
  choice: 在他里面
  rationale: 保留约翰文献常见的“在……里面”表达及其神学共鸣，不改写成较具解释性的“他本身”。
theological_decisions:
- issue: ἐκεῖνος所指为何
  choice: 以“他”指耶稣基督
  alternative: 译作“那一位”而不进一步明确所指
  rationale: 上下文中，那位显现以除去罪、且里面没有罪的，就是耶稣基督。“他”既符合现代汉语，也不加入额外的教义措辞。
- issue: αἴρω与罪连用时的含义
  choice: 除去罪
  alternative: 担当罪／带走罪
  rationale: 本节直接强调基督显现的目的是使罪被除去。“除去”保留这一重点，同时不将含义收窄为某一种特定的赎罪理论；“担当”仍作为词义可能性收入脚注。
- issue: “在他里面并没有罪”的性质
  choice: 保留绝对的无罪陈述
  alternative: 解释性改写为“他从未犯罪”或“他没有罪性”
  rationale: 原文陈述的是“罪不在他里面”，既没有限定为行为，也没有使用后来的系统神学术语；直译可保留其广度与张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“显现”保留约翰文献的启示语感；“是要”清楚表达目的；分号呈现两个紧密相关而各自完整的陈述。所有脚注标记均置于对应词语之后。
