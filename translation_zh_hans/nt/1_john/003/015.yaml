source:
  edition: SBLGNT
  text: πᾶς ὁ μισῶν τὸν ἀδελφὸν αὐτοῦ ἀνθρωποκτόνος ἐστίν, καὶ οἴδατε ὅτι πᾶς ἀνθρωποκτόνος οὐκ ἔχει ζωὴν αἰώνιον ἐν ⸀αὐτῷ μένουσαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/015.yaml
  text: Everyone who hates his brother is a murderer[b][a], and you know that every murderer does not have eternal life remaining in him.
translation:
  language: zh_hans
  text: 凡恨自己弟兄[b]的，就是杀人的；你们知道，凡杀人的，都没有永生住在他里面[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“常住在他里面。”“住在／常住”（μένω）是约翰著作中反复出现的重要用语。
    reason: lexical_alternative
  - marker: b
    text: “弟兄”在本段语境中很可能指信主的同伴；希腊文为阳性单数。
    reason: cultural_note
lexical_decisions:
- source_word: πᾶς ὁ μισῶν
  choice: 凡恨……的
  rationale: 带冠词的现在时分词表示具有这一特征的一类人；“凡……的”在现代汉语中自然地表达普遍范围，也保留持续或惯常的意味。
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: 自己弟兄
  rationale: 保留希腊文阳性单数形式；在约翰书信的语境中通常指信仰群体中的弟兄，但正文不将其解释性改写为“信徒同伴”。
- source_word: ἀνθρωποκτόνος
  choice: 杀人的
  rationale: 该词指杀人者、凶手。“杀人的”既保留强烈的道德判断，又避免“杀人犯”可能附带的法律定罪含义，并与前后两个概括性结构自然衔接。
- source_word: οἴδατε
  choice: 你们知道
  rationale: 明确呈现第二人称复数，符合现代汉语表达。
- source_word: πᾶς ἀνθρωποκτόνος οὐκ ἔχει
  choice: 凡杀人的，都没有
  rationale: 以汉语的“凡……都没有”直接而自然地保留希腊文全称量化加否定的结构，表达没有任何杀人者拥有这种生命。
- source_word: ζωὴν αἰώνιον
  choice: 永生
  rationale: “永生”是约翰著作中自然、通行且含义充分的译法，兼具持续性和神学内涵。
- source_word: ἐν αὐτῷ μένουσαν
  choice: 住在他里面
  rationale: 分词修饰“永生”，说明永生并不住留于这样的人里面。“住在”保留约翰著作中 μένω 的核心意象，同时比生硬的“存留着”更自然。
theological_decisions:
- issue: “弟兄”的指涉范围
  choice: 正文保留“自己弟兄”，以脚注说明语境中的常见所指。
  alternative: 信主的同伴；弟兄姊妹
  rationale: 上下文主要论及信仰群体内部的彼此相爱，但希腊文采用阳性单数。保留原文形式可避免在正文中提前消解其代表性范围。
- issue: 约翰著作中 μένω 的译法
  choice: 译作“住在他里面”。
  alternative: 常存在他里面；留在他里面
  rationale: “住在”能呈现持续内住的意象，并与约翰著作反复出现的 μένω 主题相呼应；脚注保留另一种较直接表达持续性的译法。
- issue: 恨弟兄与杀人的关系
  choice: 保留直陈判断“就是杀人的”。
  alternative: 如同杀人的；等于犯了杀人罪
  rationale: 原文使用系词直接断定恨弟兄者是 ἀνθρωποκτόνος，并非仅作明说的比喻或法律归罪；译文不削弱也不扩大这一神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“凡……的，就是……”和“凡……的，都没有……”保持经文的概括性与平行结构；不用带有明显法律程序色彩的“杀人犯”，也不把“弟兄”在正文中解释性扩写。
