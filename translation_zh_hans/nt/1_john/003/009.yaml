id: 1JN.3.9
reference: 1 John 3:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: πᾶς ὁ γεγεννημένος ἐκ τοῦ θεοῦ ἁμαρτίαν οὐ ποιεῖ, ὅτι σπέρμα αὐτοῦ ἐν αὐτῷ μένει, καὶ οὐ δύναται ἁμαρτάνειν, ὅτι ἐκ τοῦ θεοῦ γεγέννηται.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/009.yaml
  text: Everyone who has been born of God does not practice sin[a], because his seed remains in him; and he is not able to keep sinning[c][b], because he has been born of God.
translation:
  language: zh_hans
  text: 凡从神生的，都不以犯罪为常[a]，因为神的种子留在他里面[b]；他也不能持续犯罪[c]，因为他是从神生的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较按字面译作“不行罪”或“不犯罪”。这里的希腊语措辞较可能是指持续以犯罪为行为模式，而不是单独一次犯罪。
    reason: lexical_alternative
  - marker: b
    text: “留在”也可译作“住在”。
    reason: lexical_alternative
  - marker: c
    text: 较按字面可译作“不能犯罪”。在本语境中，希腊语现在时不定式较可能含有“持续犯罪”或“一再犯罪”的意思。
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ὁ γεγεννημένος
  choice: 凡……生的
  rationale: πᾶς与名词化的完成时分词构成涵盖全体的类别陈述；“凡……生的”在现代汉语中自然地保留其普遍范围，而全句语境表达出生后所处的持续状态。
- source_word: ἐκ τοῦ θεοῦ
  choice: 从神
  rationale: ἐκ在约翰的重生用语中表示来源；“从神生的”清楚表达生命来源于神。
- source_word: ἁμαρτίαν οὐ ποιεῖ
  choice: 不以犯罪为常
  rationale: 原文直译近于“不行罪”。结合现在时及后文ἁμαρτάνειν，此处较可能指持续、惯常的行为模式；“不以犯罪为常”既符合现代汉语，也避免把经文缩减为单次行为的陈述。
- source_word: σπέρμα αὐτοῦ
  choice: 神的种子
  rationale: σπέρμα本义为“种子”，其隐喻的确切所指存在争议。正文保留具体意象，不把它解释成神的话、生命或本性；将代词明确为“神的”，符合其最近且合乎语义的先行词。
- source_word: ἐν αὐτῷ μένει
  choice: 留在他里面
  rationale: μένω是约翰著作中的重要动词，含持续不离开的意思。“留在他里面”现代、清楚，并保留其延续意味。
- source_word: οὐ δύναται ἁμαρτάνειν
  choice: 不能持续犯罪
  rationale: 原文形式上可译为“不能犯罪”，但现在时不定式在本语境中较可能描述持续或反复的犯罪。“不能持续犯罪”保留这种体貌意味，同时以脚注保留更形式对应的译法。
- source_word: γεγέννηται
  choice: 是从神生的
  rationale: 完成时强调已经发生的出生及其持续结果；汉语“是从神生的”借助“是……的”结构突出这一既成事实和身份来源。
theological_decisions:
- issue: 本节是指绝对不可能犯任何一次罪，还是指从神而生与持续以犯罪为常不相容
  choice: 正文表达持续、惯常犯罪与从神而生不相容。
  alternative: 理解为绝对不可能犯任何一次罪。
  rationale: ποιεῖ和ἁμαρτάνειν均为现在时形式，结合《约翰一书》1:8—2:1，较自然地指向持续或惯常行为。正文如此处理，但脚注保留“不能犯罪”这一更贴近形式的译法，使原文的力度和神学张力仍然可见。
- issue: “神的种子”具体指什么
  choice: 保留“种子”这一隐喻，不在正文中指定所指。
  alternative: 解释为神的话、神的生命或神的本性。
  rationale: 经文本身没有明确说明σπέρμα的确切所指；保留隐喻可避免把某一种神学解释写入正文。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“凡……的，都……”清楚呈现普遍性陈述；“不以犯罪为常”和“不能持续犯罪”表达行为的持续性而不过度口语化。正文保留“种子”的具体隐喻，并用脚注呈现形式更直译的可能性。
