id: 1JN.3.17
reference: 1 John 3:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὃς δ’ ἂν ἔχῃ τὸν βίον τοῦ κόσμου καὶ θεωρῇ τὸν ἀδελφὸν αὐτοῦ χρείαν ἔχοντα καὶ κλείσῃ τὰ σπλάγχνα αὐτοῦ ἀπ’ αὐτοῦ, πῶς ἡ ἀγάπη τοῦ θεοῦ μένει ἐν αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/017.yaml
  text: But whoever has the world's goods and sees his brother in need[c][b][a], yet closes his heart against him—how does the love of God remain in him?
translation:
  language: zh_hans
  text: 可是，若有人拥有世上的财物，看见自己的弟兄[a]有需要，却对他硬起心肠[b]，神的爱[c]怎么会住在他里面呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“弟兄或姊妹”。希腊文作“弟兄”，在这里可以代表一同信主的人。
    reason: lexical_alternative
  - marker: b
    text: 或译“向他关上自己的怜悯之心”。直译为“向他关闭自己的内脏”；这是指收起、不肯向对方流露内心怜悯的惯用说法。
    reason: lexical_alternative
  - marker: c
    text: “神的爱”可能指神对人的爱住在他里面，也可能指他对神的爱。
    reason: alternative_reading
lexical_decisions:
- source_word: βίον τοῦ κόσμου
  choice: 世上的财物
  rationale: βίος在此指维持生活的物质资源或财产；上下文谈到供给有需要的弟兄，因此译为“世上的财物”，既自然，也保留其属世、物质层面的含义。
- source_word: θεωρῇ
  choice: 看见
  rationale: θεωρέω可指观看、观察；这里强调亲眼看见并意识到弟兄的需要，“看见”简洁自然。
- source_word: ἀδελφὸν
  choice: 弟兄
  rationale: 原文为阳性单数，在约翰书信中可代表同属信仰群体的人；正文保留原词的性别形式，较广的指向在脚注说明。
- source_word: χρείαν ἔχοντα
  choice: 有需要
  rationale: 该分词短语直指处于缺乏之中；“有需要”是现代汉语中自然且准确的表达。
- source_word: κλείσῃ τὰ σπλάγχνα αὐτοῦ ἀπ’ αὐτοῦ
  choice: 对他关闭怜悯之心
  rationale: σπλάγχνα字面指内脏，惯用来表示深切的怜悯和感情；此译保留“关闭”的意象，同时清楚表达刻意不肯怜悯对方。
- source_word: πῶς
  choice: 怎么会
  rationale: πῶς引出带有否定意味的反问。“怎么会”符合现代汉语习惯，又不把问题改写成直陈判断。
- source_word: ἡ ἀγάπη τοῦ θεοῦ
  choice: 神的爱
  rationale: 属格结构可能指神所施的爱，也可能指人对神的爱；“神的爱”保留原文的语法与神学张力。
- source_word: μένει ἐν αὐτῷ
  choice: 住在他里面
  rationale: μένω是约翰著作中的重要词，含持续居住、常存之意；“住在……里面”既保留空间隐喻，也符合本句语境。
theological_decisions:
- issue: “神的爱”（ἡ ἀγάπη τοῦ θεοῦ）的属格歧义
  choice: 正文译作“神的爱”，不限定其方向
  alternative: “神对人的爱”或“人对神的爱”
  rationale: 原文属格容许两种理解，而约翰神学也把领受神的爱与爱神、爱弟兄紧密相连；正文保留歧义，脚注予以说明。
- issue: ἀδελφὸν的性别及群体指向
  choice: 译作“弟兄”
  alternative: “弟兄或姊妹”或“信徒同伴”
  rationale: 原文是阳性单数，正文据此翻译；该词在语境中可代表同属信仰群体的人，这一点放在脚注中说明，避免在正文中抹平原词形式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“世上的财物”“有需要”清楚传达实际处境；“关闭怜悯之心”保留原文意象，并借脚注解释其惯用含义。反问句以“怎么会……呢”呈现原文的伦理力度。
