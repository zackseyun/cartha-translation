  text: καὶ πᾶς ὁ ἔχων τὴν ἐλπίδα ταύτην ἐπ’ αὐτῷ ἁγνίζει ἑαυτὸν καθὼς ἐκεῖνος ἁγνός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/003.yaml
  text: And everyone who has this hope set on him purifies himself[b][a], just as he is pure.
translation:
  language: zh_hans
  text: 凡把这盼望寄托在他身上[a]的人，都洁净自己，正如他[b]是纯洁的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “寄托在他身上”也可理解为“在他里面有这盼望”；希腊语介词短语既可强调盼望所倚靠、指向的对象，也容许后一种表达。
    reason: lexical_alternative
  - marker: b
    text: 这里的“他”按上下文最可能指圣子基督，但希腊原文只用代词，没有明说所指。
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ὁ ἔχων
  choice: 凡……的人，都
  rationale: 带冠词的现在分词构成泛指，表示所有持续持有这盼望的人；“凡……的人，都”符合现代汉语习惯。
- source_word: τὴν ἐλπίδα ταύτην
  choice: 这盼望
  rationale: “这”回指上文所说、以神的应许为根据的期待；“盼望”保留其确定期待的语义，又符合约翰书信的庄重语体。
- source_word: ἐπ’ αὐτῷ
  choice: 寄托在他身上
  rationale: ἐπί加与格在此可表示盼望所指向或倚靠的对象；“寄托在他身上”自然表达这种关系，同时不把代词改写成具体称号。
- source_word: ἁγνίζει ἑαυτὸν
  choice: 洁净自己
  rationale: ἁγνίζω含洁净、使之纯洁之意，既可带礼仪背景，也在此具有伦理含义；“自己”在汉语中自然涵盖泛指的人，无须机械复制希腊语的阳性形式。
- source_word: καθὼς
  choice: 正如
  rationale: 清楚表达比较关系，语气庄重而自然。
- source_word: ἐκεῖνος
  choice: 他
  rationale: 希腊语使用指示代词，语境最可能指向基督；现代汉语若直译为“那一位”会额外加强敬称色彩，因此用“他”保留代词形式与指称上的含蓄。
- source_word: ἁγνός
  choice: 纯洁的
  rationale: 与前面的ἁγνίζει形成同词根呼应；“纯洁”适合这里的伦理语境，并比单说“干净”更庄重准确。
theological_decisions:
- issue: αὐτῷ与ἐκεῖνος所指为何
  choice: 正文均保留为“他”，不直接增译“基督”或“神”；语境最自然地指向圣子基督。
  alternative: 可理解为父神，或认为代词有意保留父与子之间一定程度的指称含混。
  rationale: 上文“见他本来的样子”等语境倾向于基督，但原文没有在本节明说称号；保留代词可避免超出文本消除神学张力。
- issue: ἑαυτὸν的泛指阳性形式
  choice: 译作“自己”。
  alternative: 按形式凸显阳性而译成“他自己”。
  rationale: 现代汉语“自己”是自然的反身代词，并不抹去原文的泛指范围；若译“他自己”，反而可能使读者误以为只指男性。
- issue: 人的自我洁净与基督的纯洁
  choice: 直译为“洁净自己”，保留原文对信徒主动伦理回应的陈述。
  alternative: 解释性改写为“靠着他得洁净”或“让自己被洁净”。
  rationale: 原文使用主动语态ἁγνίζει，不应在翻译中改成被动或增添未明说的施动者；这并不否认上下文可能提供的神圣恩典基础。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“凡……的人，都……”体现普遍范围；“寄托”“洁净”“纯洁”兼顾自然表达与原文关键词之间的联系。脚注标记均置于正文相关词句之后。
