base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/024.yaml
  text: 'And the one who keeps his commandments remains in him[a], and he in him[b]. And by this we know that he remains in us: by the Spirit whom he gave to us.'
translation:
  language: zh_hans
  text: 遵守他诫命的人住在他里面，他也住在这人里面。[a] 我们由此知道他住在我们里面：这就是借着他赐给我们的圣灵。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “住在”也可译作“常在”或“长存于”。本节三次使用同一个希腊动词，强调持续的关系与内住。
    reason: lexical_alternative
  - marker: b
    text: “借着”也可译作“从他赐给我们的圣灵得知”。希腊文介词既可强调来源，也可表示认识的根据。
    reason: lexical_alternative
lexical_decisions:
- source_word: τηρῶν
  choice: 遵守
  rationale: τηρέω在此指持守、实行诫命；“遵守”是现代汉语中自然而准确的表达，同时保留持续忠实守命的含义。
- source_word: ἐντολάς
  choice: 诫命
  rationale: “诫命”符合约翰文献的一贯用语，也保留该词的道德与盟约分量。
- source_word: μένει
  choice: 住在
  rationale: μένω是约翰文献的关键词，表达持续居留及关系上的相互内住；本节三次统一译为“住在”，既自然又保留意象。
- source_word: ἐν αὐτῷ
  choice: 在他里面
  rationale: 保留希腊文代词及ἐν的空间—关系性表达，不直接改写为“在上帝里面”，从而让上下文确定所指。
- source_word: ἐν τούτῳ γινώσκομεν
  choice: 我们由此知道
  rationale: “由此知道”自然表达认识的根据或途径，并符合ἐν τούτῳ在约翰文献中的辨认公式。
- source_word: ἐκ τοῦ πνεύματος
  choice: 凭着……圣灵
  rationale: ἐκ可表示来源或根据；“凭着”在本句中自然体现圣灵是这种认识的根据，同时以脚注保留“从……得知”的来源性理解。
- source_word: πνεύματος
  choice: 圣灵
  rationale: 上下文所指是上帝赐给信徒的神圣之灵；现代中文通常以“圣灵”明确这一所指。
- source_word: οὗ ἡμῖν ἔδωκεν
  choice: 他赐给我们的
  rationale: 忠实反映关系代词与不定过去时ἔδωκεν；“赐给”适合上帝赐予圣灵的语境，也不额外加入完成体含义。
theological_decisions:
- issue: 反复出现的αὐτῷ／αὐτός及“他住在我们里面”所指为何
  choice: 保留“他”，按紧邻语境理解为上帝
  alternative: 将代词直接译为“上帝”；或从约翰神学更广泛地理解为基督的内住
  rationale: 希腊文使用代词，而前文将上帝与“他的儿子耶稣基督”加以区分。保留代词既忠实原文，也不把上下文中仍有张力的内住语言过度限定。
- issue: πνεῦμα的所指
  choice: 译为“圣灵”
  alternative: 译为“灵”
  rationale: “他赐给我们的”以及约翰文献的上下文表明这里指上帝所赐的圣灵；译为“圣灵”能在中文中准确传达所指，而不引入宗派性解释。
- issue: ἐκ τοῦ πνεύματος表示途径还是来源
  choice: 正文译为“凭着……圣灵”，突出认识的根据或途径
  alternative: 译为“从他赐给我们的圣灵，我们知道……”以突出来源
  rationale: ἐκ兼有来源和根据的语义潜能；正文采用自然中文表达，脚注明确保留另一种重心，避免消除原文歧义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“住在……里面”保留约翰式内住意象；用“这人”避免连续两个“他”造成指代混淆。正文保持简洁，并以脚注说明关键词与介词的真实语义幅度。
