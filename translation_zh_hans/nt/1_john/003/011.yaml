  text: Ὅτι αὕτη ἐστὶν ἡ ἀγγελία ἣν ἠκούσατε ἀπ’ ἀρχῆς, ἵνα ἀγαπῶμεν ἀλλήλους·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/011.yaml
  text: 'For this is the message that you have heard from the beginning: that we should love one another[a][b].'
translation:
  language: zh_hans
  text: 因为这就是你们从起初所听见的信息：我们应当彼此相爱。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我们应当彼此相爱”也可译为“以便我们彼此相爱”或“让我们彼此相爱”。
    reason: 保留 ἵνα 加虚拟语气在此可能具有的目的或劝勉语力。
lexical_decisions:
- source_word: Ὅτι
  choice: 因为
  rationale: 承接上文并引出解释；现代汉语用“因为”能自然表达此处的说明性关联。
- source_word: ἡ ἀγγελία
  choice: 信息
  rationale: 指已经传给读者的教导或宣告；“信息”清楚自然，也避免把词义限缩为某一种正式宣讲形式。
- source_word: ἣν ἠκούσατε ἀπ’ ἀρχῆς
  choice: 你们从起初所听见的
  rationale: 按希腊语关系从句自然译出，并保留约翰著作中“从起初”的重要表达。
- source_word: ἵνα ἀγαπῶμεν
  choice: 我们应当……相爱
  rationale: 在此主要说明信息的内容和伦理要求；“应当”保留虚拟语气所带的劝勉、规范意味。
- source_word: ἀλλήλους
  choice: 彼此
  rationale: 简洁自然地表达群体成员之间相互的爱。
theological_decisions:
- issue: ἵνα ἀγαπῶμεν ἀλλήλους 的语力
  choice: 译为信息的内容与伦理要求：“我们应当彼此相爱”
  alternative: “使我们彼此相爱”或“让我们彼此相爱”
  rationale: ἵνα 在这里可以带有内容、目的或劝勉色彩。正文采用最符合上下文的信息内容读法，同时以脚注保留目的和直接劝勉的可能性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“从起初”保留约翰著作中的固定措辞；冒号清楚标示后半句是“信息”的内容。
