  text: ⸀μὴ θαυμάζετε, ⸀ἀδελφοί, εἰ μισεῖ ὑμᾶς ὁ κόσμος.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/013.yaml
  text: Do not be surprised[a], brothers, if the world hates you.
translation:
  language: zh_hans
  text: 弟兄们[a]，如果这世界恨你们，不要惊讶。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄们”译自阳性复数形式；这里很可能是对整个信徒群体的称呼，包括女性。
    reason: 说明原文的语法性别及其在语境中的代表性指向。
lexical_decisions:
- source_word: μὴ θαυμάζετε
  choice: 不要惊讶
  rationale: μή加现在时命令语气构成禁止；“不要惊讶”符合现代汉语表达，也准确传达此处“不必因之感到意外”的意思。
- source_word: ἀδελφοί
  choice: 弟兄们
  rationale: 保留希腊语阳性复数呼语的形式；在本语境中，这一称呼很可能代表性地包括整个信徒群体，故以脚注说明。
- source_word: εἰ
  choice: 如果
  rationale: 保留条件连词的基本意义，不将现实条件进一步解释为“当……时”。
- source_word: μισεῖ
  choice: 恨
  rationale: 简明自然地表达现在时直陈语气所陈述的一般性、持续性现实。
- source_word: ὁ κόσμος
  choice: 这世界
  rationale: 保留约翰著作中“世界”的重要神学用语及其语义张力，不在正文中扩写为“敌对上帝的世人或体系”；“这”使其在现代汉语中作为施事者更自然。
theological_decisions:
- issue: ἀδελφοί的代表性阳性称呼
  choice: 正文译作“弟兄们”
  alternative: 弟兄姊妹们；众弟兄姊妹；信徒们
  rationale: 原文是阳性复数称呼，正文保留其形式；鉴于它很可能涵盖全体信徒，包括女性，以脚注交代其代表性用法。
- issue: κόσμος在约翰著作中的含义
  choice: 译作“这世界”，不作解释性扩写
  alternative: 世人；敌对上帝的世界；世界体系
  rationale: “世界”在约翰著作中常指背离并敌对上帝的人类秩序，但正文保留原词的广度和神学张力，让上下文界定其含义。
- issue: εἰ所表达的条件关系
  choice: 译作“如果”
  alternative: 当……时；即使
  rationale: 原文使用普通条件连词；尽管语境显示这种敌意是现实可能性，仍不把条件句的力度解释得更确定或更让步。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不要惊讶”避免较旧的“不要以为希奇”；句序按汉语习惯调整，将条件从句置于禁令之前。
