  text: ὅτι ἐὰν καταγινώσκῃ ἡμῶν ἡ καρδία, ὅτι μείζων ἐστὶν ὁ θεὸς τῆς καρδίας ἡμῶν καὶ γινώσκει πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/020.yaml
  text: for if our heart condemns us[a], God is greater than our heart[b], and he knows all things.
translation:
  language: zh_hans
  text: 因为如果我们的心责备我们[a]，上帝比我们的心更大[b]，并且他知道一切。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“定我们的罪”“指责我们”。
    reason: lexical_alternative
  - marker: b
    text: “上帝比我们的心更大”可能指他对我们的了解更完全；也可能暗示他的判断和权柄高过我们内心对自己的定罪。
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 句首的ὅτι承接上文，引出理由或解释；现代汉语用“因为”自然地表达这一关联。
- source_word: ἐὰν
  choice: 即使
  rationale: ἐὰν与虚拟语气构成条件句；结合后句带安慰意味的对比，汉语“即使……也……”既保留条件性，又清楚呈现让步色彩。
- source_word: καταγινώσκῃ
  choice: 责备
  rationale: 该词可指判罪、责难或认定有过；“责备”适合内心对自己的负面裁断，同时避免把司法色彩强化为最终定罪。
- source_word: ἡ καρδία / τῆς καρδίας ἡμῶν
  choice: 我们的心
  rationale: 保留καρδία的“心”这一意象，不直接解释为“良心”；前后重复也保持原文比较结构。
- source_word: μείζων
  choice: 更大
  rationale: 原文没有限定是知识、权柄还是怜悯方面更大；直译“更大”保留其广度，后面的“知道一切”提供语境线索。
- source_word: ὁ θεὸς
  choice: 上帝
  rationale: 采用现代标准普通话中庄重、通行的θεός译名。
- source_word: γινώσκει πάντα
  choice: 他知道一切
  rationale: 准确表达πάντα的全面范围，且符合自然现代汉语。
theological_decisions:
- issue: “上帝比我们的心更大”的具体所指
  choice: 保留宽泛表述“上帝也比我们的心更大”
  alternative: 明确译成上帝的判断胜过自我定罪，或上帝比我们的心更有怜悯、更了解真相
  rationale: 比较级本身未限定“更大”的具体层面。后句突出上帝全知，但也可能蕴含其权柄超越人的自我裁断；正文不应只选定其中一种。
- issue: 条件句的语用关系
  choice: 采用“即使……也……”
  alternative: 采用中性的“如果……那么……”
  rationale: ἐὰν本为条件标记，但本节在语境中带有面对内心责备仍可得安慰的对比意味；“即使”能自然传达这一点，却不改变条件内容。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“心”保留约翰原有意象；“更大”不作教派化或单一化解释。
