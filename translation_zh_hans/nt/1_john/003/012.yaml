  text: οὐ καθὼς Κάϊν ἐκ τοῦ πονηροῦ ἦν καὶ ἔσφαξεν τὸν ἀδελφὸν αὐτοῦ· καὶ χάριν τίνος ἔσφαξεν αὐτόν; ὅτι τὰ ἔργα αὐτοῦ πονηρὰ ἦν, τὰ δὲ τοῦ ἀδελφοῦ αὐτοῦ δίκαια.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/012.yaml
  text: not like Cain[a], who was from the evil one and slaughtered his brother. And why did he slaughter him? Because his deeds were evil[b], but those of his brother were righteous.
translation:
  language: zh_hans
  text: 不可像该隐；他是出于那恶者[a]，并且残杀了自己的兄弟[b]。他为什么残杀自己的兄弟呢？因为他的行为是邪恶的，他兄弟的行为却是公义的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“出于恶。”这个希腊语表达也可作较抽象的理解，但在约翰文献中通常指有位格的“恶者”。
    reason: alternative_reading
  - marker: b
    text: “残杀”原文所用动词常用于“宰杀”，语气比一般的“杀”更强烈；也可译作“杀害”。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ καθὼς
  choice: 不可像
  rationale: 承接上文的劝勉并引出反面例子；“不可像”在现代汉语中自然，也保留否定比较的语气。
- source_word: ἐκ τοῦ πονηροῦ
  choice: 出于那恶者
  rationale: “出于”保留ἐκ所表达的来源；带冠词的πονηρός在约翰文献中通常指有位格的“恶者”，而“那恶者”同时避免直接增添原文没有的专名。
- source_word: ἔσφαξεν
  choice: 残杀了
  rationale: σφάζω比一般的“杀”更强烈、更具暴力色彩；“残杀”在现代汉语中既传达其鲜明力度，又不显古奥。
- source_word: ἀδελφὸν αὐτοῦ
  choice: 自己的弟弟
  rationale: 该隐与亚伯的亲属关系是伦理对比的核心；依创世记叙事和汉语亲属称谓译作“弟弟”，并用“自己的”突出他残杀至亲的反常。
- source_word: χάριν τίνος
  choice: 为什么
  rationale: 以自然、直接的现代汉语表达原因问句。
- source_word: τὰ ἔργα αὐτοῦ πονηρὰ ἦν
  choice: 他自己的行为是邪恶的
  rationale: 此处ἔργα指道德上可评断的所作所为，“行为”比“工作”自然；“邪恶”与前文“恶者”保持词义关联，又借语境区分位格与性质。
- source_word: τὰ δὲ τοῦ ἀδελφοῦ αὐτοῦ δίκαια
  choice: 而他弟弟的行为是正义的
  rationale: 汉语补出省略的“行为”以免指代含混；“正义的”保留δίκαια对行为合乎正道的伦理评价，并与“邪恶的”形成清楚对照。
theological_decisions:
- issue: τοῦ πονηροῦ指有位格的“恶者”，还是抽象的“恶”
  choice: 正文译作“那恶者”
  alternative: “恶”或“邪恶”
  rationale: 在约翰文献中，带冠词的ὁ πονηρός通常指有位格的恶者；但该表达在形式上仍可作较抽象的理解，因此以脚注保留另一读法，不在正文中把“恶者”进一步明确为某个专名。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。正文保留原文两次重复“残杀”的修辞力度，并以分号使开头承接上文的否定劝勉。脚注标记均置于所说明的词语之后。
