id: 1JN.3.16
reference: 1 John 3:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐν τούτῳ ἐγνώκαμεν τὴν ἀγάπην, ὅτι ἐκεῖνος ὑπὲρ ἡμῶν τὴν ψυχὴν αὐτοῦ ἔθηκεν· καὶ ἡμεῖς ὀφείλομεν ὑπὲρ τῶν ἀδελφῶν τὰς ψυχὰς ⸀θεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/016.yaml
  text: 'By this we have come to know love: that he laid down his life for us[b][a], and we ought to lay down our lives for the brothers.'
translation:
  language: zh_hans
  text: 我们由此[a]认识了爱：他为我们舍了自己的生命；我们也应当为弟兄们[b]舍命。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在这件事上”或“借此”。
    reason: lexical_alternative
  - marker: b
    text: 原文为阳性复数“弟兄们”；在这里很可能泛指同为信徒的人，包括姊妹。
    reason: cultural_note
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: 由此
  rationale: 这一指示结构指向下文所说明的事实，表示认识爱的根据或途径。“由此”简洁自然，也保留了原文可理解为“在这件事上”或“借此”的弹性。
- source_word: ἐγνώκαμεν
  choice: 认识了
  rationale: 完成时表示已经获得认识、其结果延续至今；“认识了”在现代汉语中兼顾先前的领会及当前的认知状态。
- source_word: τὴν ἀγάπην
  choice: 爱
  rationale: 直接译为“爱”，不额外限定其类别；下文由基督舍命的行动说明爱的内涵。
- source_word: ἐκεῖνος
  choice: 他
  rationale: 原词具有指示性和一定强调意味，在本书信语境中所指为耶稣；汉语用“他”自然，并让上下文确定所指。
- source_word: ὑπὲρ ἡμῶν
  choice: 为我们
  rationale: 保留替他人着想、为他人利益而自我付出的意义，同时不把某一种赎罪理论写入译文。
- source_word: τὴν ψυχὴν αὐτοῦ ἔθηκεν
  choice: 舍了自己的生命
  rationale: ψυχή与τίθημι在约翰著作中构成舍弃生命、自愿牺牲的表达；译作“舍了自己的生命”准确而庄重。
- source_word: ὀφείλομεν
  choice: 应当
  rationale: 表达道德上的责任和义务，又避免过于法律化或生硬的措辞。
- source_word: τῶν ἀδελφῶν
  choice: 弟兄们
  rationale: 保留希腊文阳性复数的形式；在教会群体语境中，它通常统指同为信徒的人，包括女性，此点以脚注说明。
- source_word: τὰς ψυχὰς θεῖναι
  choice: 舍命
  rationale: 与前句“舍了自己的生命”呼应；“舍命”是现代汉语中自然凝练的固定表达，也保留自我牺牲的力度。
theological_decisions:
- issue: ἐκεῖνος所指为何人
  choice: 以“他”译出，由语境指向耶稣基督
  alternative: 明确译作“耶稣”或较直译为“那一位”
  rationale: 约翰文献中“舍命”的表达及本书信上下文清楚指向耶稣。保留代词既忠于原文，也不在正文中加入原文未明说的名字。
- issue: ἀδελφῶν的范围
  choice: 正文译“弟兄们”，脚注说明可统指男女信徒
  alternative: 正文译“弟兄姊妹”或“信徒同伴”
  rationale: 原文是阳性复数，但在群体称谓中很可能具有代表性、包含女性。正文保留其形式，脚注交代实际语用范围。
- issue: ὑπὲρ ἡμῶν所表达的基督舍命意义
  choice: 译作“为我们”，不进一步界定
  alternative: 译作“代替我们”或“为了我们的益处”
  rationale: ὑπέρ在此表达代表、为他人利益及可能带有替代色彩的自我给予；“为我们”保留其神学张力，不预先锁定单一解释。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“由此……：”保留原文先提出认识的根据、再以舍命之举加以说明的结构；前句用完整表达“舍了自己的生命”，后句用自然凝练的“舍命”形成清楚呼应。
