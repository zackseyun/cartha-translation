  text: ἀγαπητοί, ἐὰν ἡ καρδία ⸂μὴ καταγινώσκῃ ἡμῶν⸃, παρρησίαν ἔχομεν πρὸς τὸν θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/021.yaml
  text: Beloved[a], if our heart does not condemn us, we have confidence before God[c][b],
translation:
  language: zh_hans
  text: 亲爱的，如果我们的心不责备我们，我们就在上帝面前坦然无惧[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “责备我们”也可译作“谴责我们”、“指控我们”或“挑我们的错”。
    reason: lexical_alternative
  - marker: b
    text: “心”在这里指人的内在自我或道德意识，意义近似“良心”；“坦然无惧”也可译作“有把握”或“放胆”。
    reason: cultural_note; lexical_alternative
lexical_decisions:
- source_word: ἀγαπητοί
  choice: 亲爱的弟兄姊妹
  rationale: 这是复数呼格，用作充满爱意的称呼；中文以“亲爱的弟兄姊妹”自然表达对信徒群体的亲切称呼，并保留书信的庄重语气。
- source_word: ἐὰν
  choice: 如果
  rationale: 与虚拟语气连用，引出条件从句；“如果”是现代汉语最自然的对应表达。
- source_word: ἡ καρδία
  choice: 我们的心
  rationale: 保留“心”的原文意象；这里指人的内在自我及其道德判断，但正文不将其窄化为“良心”。
- source_word: μὴ καταγινώσκῃ ἡμῶν
  choice: 不定我们的罪
  rationale: καταγινώσκω含有判定有罪、责难或谴责之意；“定我们的罪”保留其审判性语感，也与上文衔接。
- source_word: παρρησίαν ἔχομεν
  choice: 就坦然无惧
  rationale: παρρησία在此表示人在上帝面前可以坦然、毫不退缩；“坦然无惧”比单说“有信心”更能传达开放而有把握的姿态。
- source_word: πρὸς τὸν θεόν
  choice: 在上帝面前
  rationale: πρός在此表达与上帝相关、面对上帝的关系；“在上帝面前”符合上下文中内心省察和亲近上帝的语境。
theological_decisions:
- issue: καρδία所指的内在机能
  choice: 心
  alternative: 良心
  rationale: 原文使用“心”的意象，所指虽具有良心或道德意识的功能，却不限于现代心理学意义上的“良心”；保留“心”可避免缩窄含义。
- issue: παρρησίαν在上帝面前的含义
  choice: 坦然无惧
  alternative: 有把握；放胆；有信心
  rationale: 这里描述人在上帝面前开放、不羞惭且有把握的姿态；此译法既不把它解释成主观情绪上的绝对确定，也不削弱敬畏上帝的张力。
- issue: καταγινώσκῃ的审判性语气
  choice: 定……的罪
  alternative: 责备；指控；挑错
  rationale: 该动词可指责难或作出不利判断；结合上一节，正文保留较强的定罪意味，同时以脚注说明较弱的可能译法。
translation_notes:
  register: 采用现代、自然而庄重的书信体。“亲爱的弟兄姊妹”使复数称呼在中文中明确且亲切；“心”保留原文意象，“定罪”和“坦然无惧”则保存本节的司法语感与亲近上帝之间的张力。
