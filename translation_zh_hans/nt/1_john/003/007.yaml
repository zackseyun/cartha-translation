id: 1JN.3.7
reference: 1 John 3:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: τεκνία, μηδεὶς πλανάτω ὑμᾶς· ὁ ποιῶν τὴν δικαιοσύνην δίκαιός ἐστιν, καθὼς ἐκεῖνος δίκαιός ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/007.yaml
  text: Little children, let no one deceive you. The one who practices righteousness is righteous, just as that one is righteous.
translation:
  language: zh_hans
  text: 孩子们，不要让任何人迷惑你们。行义的人是义人，正如那一位是义的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “那一位”很可能指基督；也有人理解为神。
    reason: alternative_reading
lexical_decisions:
- source_word: τεκνία
  choice: 孩子们
  rationale: 这是带亲昵语气的呼格复数。现代汉语中“孩子们”自然、亲切，也符合作者对信徒的属灵称呼；不加“小”，避免让普通读者误以为只指年幼者。
- source_word: μηδεὶς πλανάτω ὑμᾶς
  choice: 不要让任何人迷惑你们
  rationale: 保留 μηδείς 与命令式构成的禁止语气。πλανάω 在此可指欺骗或引入歧途；“迷惑”既能涵盖错误教导，也自然通顺。
- source_word: ὁ ποιῶν τὴν δικαιοσύνην
  choice: 行义的人
  rationale: 现在时分词表示具有持续性或特征性的行为。“行义”简洁地保留 δικαιοσύνη 与 δίκαιος 的词义联系，并指合乎正直的生活实践，而非一次孤立行为。
- source_word: δίκαιός ἐστιν
  choice: 是义人／是义的
  rationale: 前半句论人，译作“是义人”较自然；后半句描述“那一位”，译作“是义的”更自然。两处均保留 δίκαιος 的相同核心含义。
- source_word: καθὼς
  choice: 正如
  rationale: 清楚表达比较与对应关系，符合现代庄重汉语。
- source_word: ἐκεῖνος
  choice: 那一位
  rationale: 保留希腊文指示代词及其尊称语感，不在正文中直接补成“基督”或“神”，从而保存指代上的真实张力。
theological_decisions:
- issue: ἐκεῖνος 所指的是谁
  choice: 正文保留“那一位”；就近上下文最自然地指基督
  alternative: 也有人理解为神／父，或认为这是有意保持一定开放性的神圣指称
  rationale: 约翰书信在效法的伦理语境中常以 ἐκεῖνος 指耶稣，但该代词本身没有明说名字。译作“那一位”既忠于形式，也不替原文消除可能的指代张力。
- issue: 行义与成为义人的关系
  choice: 照原文直陈“行义的人是义人”
  alternative: 可解释为行为证明其为义，或认为行为构成其义的表现
  rationale: 经文本身没有在本句中详述因果次序。译文不加入“因此”“证明”或“才算”等解释，以免预先解决神学关系。
translation_notes:
  register: 采用现代、简洁而庄重的普通话。“行义”保留约翰文本中“义／义人”的词根联系；“那一位”虽略带书面色彩，却能自然表达尊称并保存原文指代。脚注标记置于相关分句之后。
