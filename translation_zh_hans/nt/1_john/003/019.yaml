  text: ⸀ἐν τούτῳ ⸀γνωσόμεθα ὅτι ἐκ τῆς ἀληθείας ἐσμέν, καὶ ἔμπροσθεν αὐτοῦ πείσομεν ⸂τὴν καρδίαν⸃ ἡμῶν
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/019.yaml
  text: By this we will know that we are from the truth[a], and before him we will persuade our hearts[b],
translation:
  language: zh_hans
  text: 由此，我们就会知道自己是出于真理的[a]，也会在他面前使自己的心安定下来[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“属于真理”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“说服自己的心”，或“使自己的心确信”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: 由此
  rationale: 保留指示与凭借的含义，既可承接上文，也不强行排除与下文的联系；现代汉语自然简洁。
- source_word: γνωσόμεθα
  choice: 我们就会知道
  rationale: 按将来时直译为“会知道”；“就”自然表达由前面的“由此”所得出的认识，但不额外加入“逐渐明白”等体貌意义。
- source_word: ἐκ τῆς ἀληθείας ἐσμέν
  choice: 自己是出于真理的
  rationale: “出于”保留ἐκ所表达的来源、根源关系；不直接改写成“属于真理”或“真正属于上帝”，以免消解原文的约翰式表达。
- source_word: ἔμπροσθεν αὐτοῦ
  choice: 在他面前
  rationale: 直接保留空间兼关系性的表达，也自然传达“在他面前／在他同在中”的意味。
- source_word: πείσομεν
  choice: 使……安定下来
  rationale: πείθω本义范围包括劝服、使确信；以“心”为宾语并结合下文心责备人的语境，这里可自然表达为使内心安定。脚注保留较贴近字面的“说服／使确信”，避免掩盖词义张力。
- source_word: τὴν καρδίαν ἡμῶν
  choice: 自己的心
  rationale: 原文“心”为单数。汉语在复数主语后用“自己的心”能自然表达分配意义，同时保留单数形式。
theological_decisions:
- issue: “出于真理”所表达的关系
  choice: 保留“出于真理”的来源性说法
  alternative: 属于真理；真正属于上帝
  rationale: 原文没有在本节中明说这种关系的全部神学内涵，因此不将它具体化为更强的归属或身份宣告。
- issue: πείσομεν与“心”的搭配
  choice: 使自己的心安定下来
  alternative: 说服自己的心；使自己的心确信
  rationale: 上下文涉及人在上帝面前内心的责备与坦然，“安定下来”较符合语境；但因πείθω仍带有劝服、使信服的词义，故在脚注中保留较形式对应的译法，不把经文单纯处理为心理安慰。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“由此”“出于真理”“在他面前”保留原文的约翰式措辞；“自己的心”符合现代汉语的分配性表达。所有脚注标记均已置于正文相应位置。
