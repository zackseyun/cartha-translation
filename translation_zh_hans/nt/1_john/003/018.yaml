  text: ⸀Τεκνία, μὴ ἀγαπῶμεν λόγῳ μηδὲ τῇ γλώσσῃ ἀλλὰ ἐν ἔργῳ καὶ ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/018.yaml
  text: Little children[a], let us not love in word or with the tongue[b], but in deed and truth.
translation:
  language: zh_hans
  text: 孩子们[a]，我们不要只在言语或口舌上相爱，而要在行动和真理中相爱[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“小孩子们”。这是带有亲切意味的称呼。
    reason: lexical_alternative
  - marker: b
    text: “行动”也可译作“行为”；“真理”在这里也含有“真实”的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τεκνία
  choice: 孩子们
  rationale: 这是作者对受众亲切的复数称呼。“孩子们”在现代普通话中自然、庄重；脚注保留“小孩子们”这一更直接体现指小形式的译法。
- source_word: μὴ ἀγαπῶμεν
  choice: 我们相爱，不要只……
  rationale: μή加现在时虚拟语气构成第一人称复数劝勉。此处用“我们……不要”表达共同劝勉；“只”由后面的强烈转折自然引出，表明作者反对的是仅止于言辞的爱，并非否定一切爱的言语表达。
- source_word: λόγῳ μηδὲ τῇ γλώσσῃ
  choice: 在言语和口舌上
  rationale: “言语”表达λόγος在此处的口头表达之意，“口舌”保留γλῶσσα的具体意象和修辞并列。汉语在否定结构中用“和”连接两项，语意自然涵盖二者。
- source_word: ἐν ἔργῳ
  choice: 在行动……中
  rationale: ἔργον在这里指实际作为。“行动”比“事工”或“工作”更准确地表达与口头言辞相对的具体实践；脚注列出“行为”这一可行译法。
- source_word: καὶ ἀληθείᾳ
  choice: 和真理中
  rationale: ἀλήθεια基本义为“真理、真实”。保留“真理”可维持约翰著作中的词汇呼应及其超越主观真诚的可能内涵，同时用脚注提示“真实”的语义色彩。
theological_decisions:
- issue: “在行动和真理中”里的“真理”应理解为客观真理还是爱的真实、真诚
  choice: 正文保留“真理”
  alternative: 译作“真实”“真诚”
  rationale: ἀλήθεια在此既可能强调爱真实无伪，也可能指与上帝的真理一致。译成“真诚”会把含义限缩为主观态度；保留“真理”并在脚注提示“真实”，可维持原文的神学张力。
- issue: 禁止的是言语表达本身，还是仅有言语而无行动的爱
  choice: 以“不要只在……”表达对仅止于言辞之爱的否定
  alternative: 直译为“不要在言语或口舌上相爱”
  rationale: 上下文和ἀλλά引出的对照针对没有行动与真实相配的口头之爱，并非绝对禁止用言语表达爱。“只”使现代汉语读者不致产生相反误解，又不改变劝勉的核心。
translation_notes:
  register: 采用现代、亲切而庄重的普通话。“口舌”保留原文的具体意象；重复的“相爱”在后半句按汉语习惯省略，但“在……中”的平行结构仍清楚承接该动词。
