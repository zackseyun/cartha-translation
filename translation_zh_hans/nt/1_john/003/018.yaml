  terminology: 保留“孩子们”及脚注中的“小孩子们”，以兼顾现代自然度与 τεκνία 的指小、亲切色彩。保留“行动和真理”，不把 ἀλήθεια 限缩为单指“真诚”；“口舌”保留 γλῶσσα 的具象修辞。
