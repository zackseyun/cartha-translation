source:
  edition: SBLGNT
  text: καὶ αὕτη ἐστὶν ἡ ἐντολὴ αὐτοῦ, ἵνα ⸀πιστεύσωμεν τῷ ὀνόματι τοῦ υἱοῦ αὐτοῦ Ἰησοῦ Χριστοῦ καὶ ἀγαπῶμεν ἀλλήλους, καθὼς ἔδωκεν ἐντολὴν ⸀ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/023.yaml
  text: 'And this is his command: that we believe in the name of his Son Jesus the Messiah and love one another[d][c][b][a], just as he gave us command.'
translation:
  language: zh_hans
  text: 他的命令就是：我们要信靠他儿子耶稣基督[a]的名[b]，并且彼此相爱，正如他曾吩咐我们的一样。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “基督”意为“弥赛亚”，即“受膏者”；这里是称号，不是姓氏。
    reason: alternative_reading
  - marker: b
    text: 或译：“信他儿子耶稣基督的名”。这里的“名”代表这名所彰显的本人、身份和权柄。
    reason: lexical_alternative
  - marker: c
    text: 希腊文直译：“正如他给了我们命令”，也可译作“正如他给了我们一条命令”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐντολή
  choice: 命令
  rationale: “命令”是现代汉语中自然、庄重的对应词，也保留了原词的权威意味。首处保留单数；末句则按汉语习惯将“赐下命令”转译为“吩咐”。
- source_word: ἵνα πιστεύσωμεν
  choice: 我们要信靠
  rationale: ἵνα在“他的命令就是”之后引出命令的内容；“要”自然表达虚拟语气在此处的劝令意味。
- source_word: πιστεύω τῷ ὀνόματι
  choice: 信靠……的名
  rationale: 与间接受格连用时，所表达的不只是认同一个名称，而是把信心寄托于这名所彰显的那一位。“信靠”在现代汉语中能较清楚地表达这一指向，同时脚注保留较直译的说法。
- source_word: υἱοῦ
  choice: 儿子
  rationale: 按上下文指上帝的儿子耶稣；汉语正文无需借助英文式大小写来标示这一点。
- source_word: Ἰησοῦ Χριστοῦ
  choice: 耶稣基督
  rationale: “基督”是Χριστός在现代汉语基督教语境中通行且庄重的称谓；脚注说明其称号含义为“弥赛亚（受膏者）”，避免把它误当作姓氏。
- source_word: ἀγαπῶμεν ἀλλήλους
  choice: 彼此相爱
  rationale: 这是自然、准确且为普通中文读者熟悉的互惠表达。
- source_word: καθὼς
  choice: 正如
  rationale: 保留前后两部分之间的对应和比较关系。
- source_word: ἔδωκεν ἐντολὴν ἡμῖν
  choice: 他吩咐我们的
  rationale: 希腊文直译为“他给了我们命令／一个命令”。中文用“吩咐”更自然，也保留命令的权威意味；较贴近原句名词结构的译法列入脚注。
theological_decisions:
- issue: Χριστός的译法
  choice: 基督，并以脚注说明“弥赛亚（受膏者）”
  alternative: 弥赛亚
  rationale: 此处Χριστός具有称号意义。中文“基督”本身就是该称号的传统音译，通行度远高于把“耶稣弥赛亚”直接放入正文；脚注明确其称号含义，既保持现代中文的可读性，也不把它处理成姓氏。
- issue: πιστεύω τῷ ὀνόματι的指向
  choice: 信靠……的名
  alternative: 信……的名
  rationale: 这里的信指向耶稣本人及其由“名”所彰显的身份和权柄，而非仅仅相信某个名称。“信靠”使这一关系在中文中更清楚，但不在正文中进一步解释其神学内涵。
- issue: 单数命令与两项内容
  choice: 以一个“命令”统摄“信靠”与“彼此相爱”
  alternative: 将其拆成两条命令
  rationale: 原文ἐντολή为单数，随后由两个并列的虚拟语气动词说明其内容；译文保留一个命令包含两项要求的结构。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“他的命令就是”清楚引出命令内容；“信靠”避免“相信某个名字”的误读；末句用“吩咐”符合自然汉语，同时以脚注保存原文名词结构。
