source:
  edition: SBLGNT
  text: ἀγαπητοί, νῦν τέκνα θεοῦ ἐσμεν, καὶ οὔπω ἐφανερώθη τί ἐσόμεθα. ⸀οἴδαμεν ὅτι ἐὰν φανερωθῇ ὅμοιοι αὐτῷ ἐσόμεθα, ὅτι ὀψόμεθα αὐτὸν καθώς ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/002.yaml
  text: Beloved[a], now we are children of God, and what we will be has not yet been revealed. We know that if he is revealed, we will be like him[b], because we will see him as he is.
translation:
  language: zh_hans
  text: 亲爱的弟兄姊妹，现在我们是神的儿女；我们将来会怎样，还没有显明。我们知道，如果他被显明[a][b]，我们就会像他，因为我们将看见他正如他所是。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“如果这事被显明”，指我们将来会怎样；希腊文没有明说主语。上下文较支持“他”，即基督。
    reason: alternative_reading
  - marker: b
    text: 许多译本译作“当他显现时”。希腊文较直译为“如果他被显明”，所用动词与本节前面的“显明”相同。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπητοί
  choice: 亲爱的弟兄姊妹
  rationale: 这是复数呼格，用来亲切地称呼收信群体。“亲爱的弟兄姊妹”符合现代汉语书信语体，也不把称呼限于男性。
- source_word: νῦν
  choice: 现在
  rationale: 突出信徒目前的身份，与尚未显明的将来形成时间上的对照。
- source_word: τέκνα θεοῦ
  choice: 神的儿女
  rationale: τέκνα 表达与神的亲属关系，并不强调年龄或性别；“神的儿女”是自然、清楚的现代汉语。
- source_word: οὔπω ἐφανερώθη
  choice: 还没有显明
  rationale: φανερόω 在这里表示成为可见或被揭示；此译法简洁地保留尚未公开显露的含义。
- source_word: τί ἐσόμεθα
  choice: 我们将来会怎样
  rationale: τί 指信徒将来的状态或样貌，而非狭义的个人身份；“会怎样”在现代汉语中自然且准确。
- source_word: οἴδαμεν
  choice: 我们知道
  rationale: 该完成时形式具有现在意义，直接译为“我们知道”。
- source_word: ἐὰν φανερωθῇ
  choice: 如果他显现出来
  rationale: 动词没有明说主语；后文的“像他”和“看见他”使基督成为最自然的所指。“如果”保留 ἐάν 的条件形式，“显现出来”则以自然汉语表达被动的显明意义。
- source_word: ὅμοιοι αὐτῷ
  choice: 像他
  rationale: ὅμοιος 表示相似而非同一；“像他”既自然，也不暗示信徒与基督在本质上完全相同。
- source_word: ὀψόμεθα αὐτὸν
  choice: 我们将看见他
  rationale: 按将来时直译，保留以“他”为直接宾语的表达。
- source_word: καθώς ἐστιν
  choice: 他的本相
  rationale: καθώς ἐστιν 字面是“正如他所是”；“看见他的本相”是凝练自然的汉语，表达看见他真实所是的样子，而不额外界定其方式。
theological_decisions:
- issue: ἐὰν φανερωθῇ 中隐含主语的所指
  choice: 正文按基督理解，译作“如果他显现出来”。
  alternative: 也可能指“我们将来会怎样”得到显明，即“如果这事显明出来”；另有较解释性的译法“当他显现时”。
  rationale: 紧接着的“像他”和“看见他”强烈支持以基督为所指；但希腊文未明说主语，因此用脚注保留另一种语法可能。正文保留“如果”，不把条件形式直接改成时间性的“当……时”。
- issue: 信徒将来与基督相像的性质
  choice: 译作“我们就会像他”，表达真实的相似。
  alternative: “我们将成为和他一样”可能被理解为完全同一。
  rationale: ὅμοιοι 表示相像、相似，不表示身份或本质上的同一；译文既保留转变应许的力度，也不作超出原文的本体论断言。
translation_notes:
  register: 采用现代、庄重而易懂的中文。“亲爱的弟兄姊妹”保留群体性的温暖称呼；“神的儿女”使用普通信徒熟悉的亲属用语。正文避免生硬的“如果他被显明”，改用自然的“如果他显现出来”，并借脚注交代希腊文的被动形式、条件语气和主语歧义。
