id: 1JN.3.8
reference: 1 John 3:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ ποιῶν τὴν ἁμαρτίαν ἐκ τοῦ διαβόλου ἐστίν, ὅτι ἀπ’ ἀρχῆς ὁ διάβολος ἁμαρτάνει. εἰς τοῦτο ἐφανερώθη ὁ υἱὸς τοῦ θεοῦ ἵνα λύσῃ τὰ ἔργα τοῦ διαβόλου.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/008.yaml
  text: 'The one who practices sin is from the devil[a], because the devil has been sinning from the beginning[d][c][b]. For this purpose the Son of God was revealed: to destroy the works of the devil.'
translation:
  language: zh_hans
  text: 惯于犯罪的人是出于魔鬼的[a]，因为魔鬼从起初就一直犯罪。上帝的儿子显现出来，正是为了除灭魔鬼的作为[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“犯罪的人是出于魔鬼的。”希腊语使用现在时分词，在这里可表示持续或具有特征性的行为，而不只是一次孤立的行为。
    reason: lexical_alternative
  - marker: b
    text: “除灭”也可译为“瓦解”或“破除”。希腊语原意是“解开”，在这里指拆毁魔鬼的作为，使之失效。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ποιῶν τὴν ἁμαρτίαν
  choice: 惯于犯罪的人
  rationale: 现在时分词在本段语境中表达持续或具有特征性的行为；“惯于犯罪”比单纯的“犯罪的人”更能传达这一点，同时不把经文误解为只要犯过一次罪便属于魔鬼。
- source_word: ἐκ τοῦ διαβόλου
  choice: 是出于魔鬼的
  rationale: ἐκ表示来源，在这里是道德和属灵意义上的源头或归属；“出于”保留来源隐喻，又不暗示人在本体上由魔鬼所生。
- source_word: ὁ διάβολος
  choice: 魔鬼
  rationale: 在此处διάβολος是对撒但的固定称谓；“魔鬼”是现代汉语中清楚而通行的对应语。
- source_word: ἀπ’ ἀρχῆς
  choice: 从起初
  rationale: 保留约翰著作中富有神学意味的时间表达，不具体限定为创造之初、魔鬼背叛之时或人类犯罪之始。
- source_word: ἁμαρτάνει
  choice: 一直犯罪
  rationale: 现在时与“从起初”结合，表达从过去延续至今的特征性活动；“一直犯罪”自然呈现其持续意味。
- source_word: εἰς τοῦτο
  choice: 正是为了
  rationale: 此语指向随后由ἵνα引出的目的；“正是为了”自然地突出圣子显现的目的。
- source_word: ἐφανερώθη
  choice: 显现出来
  rationale: 该词表示原先未显明者被彰显或出现；“显现出来”既保留被动/不及物的显明意味，也符合约翰著作的表达。
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: 上帝的儿子
  rationale: 准确保留明确的父子称谓，并采用普通现代读者容易理解的标准表达。
- source_word: ἵνα λύσῃ
  choice: 为了除灭
  rationale: λύω本义为解开、拆散，在“魔鬼的作为”这一宾语搭配中表示破除、瓦解或毁坏；“除灭”表达其决定性的拆毁作用。
- source_word: τὰ ἔργα τοῦ διαβόλου
  choice: 魔鬼的作为
  rationale: “作为”涵盖魔鬼所做的罪恶之事及其造成的结果，并保留复数集合性的广泛含义。
theological_decisions:
- issue: 约翰伦理论述中现在时犯罪用语的力度
  choice: 以“惯于犯罪”和“一直犯罪”表达持续、特征性的行动
  alternative: 将其理解为任何一次孤立的犯罪行为
  rationale: 本书信既承认信徒仍可能犯罪（1:8—2:2），又在本段论及持续的犯罪模式。译文显出其特征性而不消除经文本身的伦理张力。
- issue: “出于魔鬼”的含义
  choice: 道德和属灵意义上的来源或一致性
  alternative: 人在本体或生育意义上源自魔鬼
  rationale: 约翰式的ἐκ表达伦理属灵来源与归属；译文保留来源隐喻，但不加入字面生育的含义。
- issue: 上帝儿子显现的目的
  choice: 除灭、瓦解魔鬼的作为
  alternative: 仅仅揭露魔鬼的作为
  rationale: ἵνα加虚拟式明确表达目的，而λύσῃ在此表示拆毁或使之失效，不只是揭露。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“惯于犯罪”清楚表达持续性；“显现出来”保留约翰式显明语言；“除灭”力度明确，但以脚注说明其“解开、瓦解”的词源图像。所有脚注标记均已置于正文相应位置。
