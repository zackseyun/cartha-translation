  text: ὃς ⸀ἐὰν ὁμολογήσῃ ὅτι ⸀Ἰησοῦς ἐστιν ὁ υἱὸς τοῦ θεοῦ, ὁ θεὸς ἐν αὐτῷ μένει καὶ αὐτὸς ἐν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/015.yaml
  text: Whoever confesses that Jesus is the Son of God[a], God remains in him, and he in God.
translation:
  language: zh_hans
  text: 凡承认耶稣是上帝的儿子的人，上帝就住[a]在他里面，他也在上帝里面。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “住”也可译作“常在”。希腊语动词μένω是约翰著作中的关键词，兼有“住”“停留”“持续不变”等含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἐὰν
  choice: 凡……的
  rationale: 不定关系从句表示普遍条件，即“任何……的人”；“凡……的”简洁自然，并保留概括作用。
- source_word: ὁμολογήσῃ
  choice: 承认
  rationale: 这里指明确承认关于耶稣的真理。“承认”是现代汉语中自然庄重的表达，既不弱化其信仰告白意味，也不额外加入公开宣告的限定。
- source_word: Ἰησοῦς ἐστιν ὁ υἱὸς τοῦ θεοῦ
  choice: 耶稣是上帝的儿子
  rationale: 按原文直译核心基督论称号，保留“是”的明确断言和“上帝的儿子”这一称谓。
- source_word: ἐν αὐτῷ μένει
  choice: 住在他里面
  rationale: μένω是约翰著作中的关键词，可表示居住、停留或持续存在。“住在……里面”在现代汉语中自然，也保留持久而亲密的关系含义。
- source_word: καὶ αὐτὸς ἐν τῷ θεῷ
  choice: 他也在上帝里面
  rationale: 原文第二分句省略了μένει。中文保留这一省略，既呈现原文的对称结构，也避免不必要的重复；“住”可由上文自然补足。
theological_decisions:
- issue: 上帝与信徒彼此内住
  choice: 保留“上帝住在他里面，他也在上帝里面”的相互性表达
  alternative: 上帝与他同在，他也与上帝联合
  rationale: 原文使用ἐν和μένω表达彼此内住；译文不把这种富有神学张力的语言简化为一般的同在或联合，也不作体系化解释。
- issue: ὁ υἱὸς τοῦ θεοῦ这一基督论称号
  choice: 上帝的儿子
  alternative: 上帝之子
  rationale: “上帝的儿子”准确保留原文称号，在现代汉语中比“上帝之子”更通俗自然，同时没有增添原文之外的教义说明。
translation_notes:
  register: 采用现代、庄重而通俗的标准普通话。“凡……的”表达普遍适用的条件；后半句保留原文省略动词的结构。代词“他”在此泛指任何作出这一承认的人。
