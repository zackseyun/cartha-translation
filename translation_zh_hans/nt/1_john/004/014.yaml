  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἡμεῖς τεθεάμεθα καὶ μαρτυροῦμεν ὅτι ὁ πατὴρ ἀπέσταλκεν τὸν υἱὸν σωτῆρα τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/014.yaml
  text: And we have seen and testify that the Father has sent the Son as the Savior of the world[a].
translation:
  language: zh_hans
  text: 我们已经看见，也作见证：父已经差遣了子，作为世界的救主[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或更贴近原文：“父已经差遣了子——世界的救主。”
    reason: 原文“世界的救主”与“子”同格，未明说“作为”；正文的“作为”是为使现代汉语通顺而作的句法处理。
lexical_decisions:
- source_word: καὶ ἡμεῖς
  choice: 我们
  rationale: 显明的复数代词带有轻微强调，并承接上文；现代汉语不必机械译出句首的 καί，也能自然保留话语衔接。
- source_word: τεθεάμεθα
  choice: 已经看见
  rationale: 完成时表达已经发生、其意义延续至今的亲身观看；“已经看见”自然清楚，并保留见证人的亲历意味。
- source_word: μαρτυροῦμεν
  choice: 作见证
  rationale: 现在时表示持续进行的见证行动；“作见证”庄重而通俗，也与前面的亲眼看见形成自然联系。
- source_word: ὅτι
  choice: ：
  rationale: 此词引出见证的内容，而非原因；中文用冒号比硬译为“就是”或“说”更自然。
- source_word: ὁ πατήρ
  choice: 父
  rationale: 约翰在此以关系称谓指神；“父”保留原文称谓，不扩写为“父神”或“上帝”。
- source_word: ἀπέσταλκεν
  choice: 差了
  rationale: 完成时指已经完成、且持续具有现实意义的差遣；“差了”简洁保留完成性，“来作”则使全句在现代汉语中顺畅。
- source_word: τὸν υἱόν
  choice: 子
  rationale: 原文有定冠词而无物主代词；在“父—子”的对应关系中，“子”足以明确其独特称谓，不增译“他的”。
- source_word: σωτῆρα
  choice: 救主
  rationale: “救主”准确表达拯救者之义，并符合现代汉语基督教语境中通行而庄重的用语。
- source_word: τοῦ κόσμου
  choice: 世界的
  rationale: 保留 κόσμος 的广泛范围，不擅自缩窄为某一群体；“世界的救主”也避免把原文直接解释成特定救恩理论。
- source_word: σωτῆρα τοῦ κόσμου
  choice: 来作世界的救主
  rationale: 原文是与“子”同格的宾格短语；中文加“来作”能清楚表达其角色关系而不改变核心意思，较逐字排列自然。
theological_decisions:
- issue: “世界的救主”所指范围
  choice: 保留宽广的约翰用语“世界的救主”
  alternative: 世人的救主；选民的救主；世界可能的救主
  rationale: 原文直接使用 τοῦ κόσμου，译文不把其范围缩窄为某类人，也不加入关于救恩如何施行或适用于谁的宗派性限定。
- issue: 父与子的关系称谓
  choice: 直译为“父”和“子”
  alternative: 父神差遣了耶稣基督；父差了他的儿子
  rationale: 本节使用关系称谓，没有出现“神”“耶稣”“基督”或物主代词；保留原称谓可避免无根据的扩写。
- issue: “子”与“救主”的句法关系
  choice: 正文译为“差了子来作世界的救主”
  alternative: 父差了子——世界的救主
  rationale: “来作”在中文中自然表达同格短语所说明的身份或使命；脚注同时保留更贴近原文形式的译法，避免把这一句法处理误当作唯一可能。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。句子以冒号引出见证内容，使结构清楚；避免古雅的“我们曾亲眼看见”以及带额外解释的称谓扩写。
