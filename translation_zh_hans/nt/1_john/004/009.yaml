  text: ἐν τούτῳ ἐφανερώθη ἡ ἀγάπη τοῦ θεοῦ ἐν ἡμῖν, ὅτι τὸν υἱὸν αὐτοῦ τὸν μονογενῆ ἀπέσταλκεν ὁ θεὸς εἰς τὸν κόσμον ἵνα ζήσωμεν δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/009.yaml
  text: 'In this the love of God was revealed among us: that God has sent his one and only Son into the world so that we might live through him[a][b].'
translation:
  language: zh_hans
  text: 神的爱是在我们中间[a]这样显明的：神差遣了他的独一之子[b]到世上来，好让我们借着他而活。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在我们里面。”希腊语短语既可指神的爱在信徒群体中间显明，也可指它在我们里面显明。
    reason: lexical_alternative
  - marker: b
    text: 传统译作“独生子”。希腊语μονογενής强调这位儿子独一无二；“独生子”保留了教会历史悠久的译法。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: 是这样
  rationale: 这是约翰著作中常见的指示表达，由后面的ὅτι从句说明神的爱如何显明；“是这样”符合现代汉语表达，同时保留其引出下文的作用。
- source_word: ἐφανερώθη
  choice: 显明
  rationale: φ​​ανερόω的被动形式表示原本不可见或未被认识的事成为可见、可知；“显明”自然、庄重，也保留被动含义。
- source_word: ἡ ἀγάπη τοῦ θεοῦ
  choice: 神的爱
  rationale: 此处属格最自然地表示源自主体神的爱，即神借差遣儿子所彰显的爱。
- source_word: ἐν ἡμῖν
  choice: 在我们中间
  rationale: 该介词短语可指爱在信徒群体中间或与他们相关地显明；正文采用自然且具有群体意味的译法，并以脚注保留“在我们里面”的可能解释。
- source_word: ὅτι
  choice: ：
  rationale: ὅτι引出前述“这样”的具体内容。汉语用冒号即可自然、清楚地表达这种解释关系，无须机械译作“就是”。
- source_word: τὸν υἱὸν αὐτοῦ τὸν μονογενῆ
  choice: 他的独一之子
  rationale: μονογενής在此强调儿子身份的独特、无可相比；“独一之子”简洁地表达这种唯一性，又不把词义直接限定为受生方式。
- source_word: ἀπέσταλκεν
  choice: 差遣了
  rationale: 该词为完成时，表示差遣已经发生并具有持续意义。现代汉语无法仅凭动词形态对应希腊语完成体，“差遣了”表达已完成的行动，而上下文保留其现今意义。
- source_word: εἰς τὸν κόσμον
  choice: 到世上来
  rationale: 对应进入世界的方向；“到世上来”是自然汉语，并从作者和读者所在世界的视角表达儿子的来到。
- source_word: ἵνα ζήσωμεν
  choice: 好让我们……而活
  rationale: ἵνα加虚拟式表达目的；“好让”清楚传达目的关系，“活”直接对应ζάω，避免无根据地把它具体化为某一种生命概念。
- source_word: δι’ αὐτοῦ
  choice: 借着他
  rationale: διά加属格表示媒介或途径；“借着他”准确表达生命藉由儿子而有。
theological_decisions:
- issue: μονογενής用于神的儿子时的含义
  choice: 正文译作“独一之子”
  alternative: “独生子”
  rationale: 正文突出儿子与父之间无可相比的独特关系，而不把后期神学表述直接当作该词唯一的词汇释义；传统译法“独生子”因其历史和神学重要性保留于脚注。
- issue: ἐν ἡμῖν的范围
  choice: 正文译作“在我们中间”
  alternative: “在我们里面”
  rationale: “在我们中间”较自然地表现神的爱在信徒群体中被彰显；希腊语也容许内在于信徒的理解，因此用脚注保留，不消除原文的解释空间。
- issue: ζήσωμεν所指的生命
  choice: 译作“我们……而活”
  alternative: “我们得生命”
  rationale: “而活”贴近动词ζάω，并保留它可同时涵盖属灵生命、永生及因基督而活的丰富含义，避免在正文中过早缩窄所指。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“显明”“差遣”“借着”保留经文语体的尊严，但句法按自然汉语安排；用冒号承接解释性ὅτι从句。所有解释性歧义均以脚注透明保留。
