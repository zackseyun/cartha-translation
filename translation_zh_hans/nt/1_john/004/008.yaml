  text: ὁ μὴ ἀγαπῶν οὐκ ἔγνω τὸν θεόν, ὅτι ὁ θεὸς ἀγάπη ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/008.yaml
  text: The one who does not love has not known God[a], because God is love.
translation:
  language: zh_hans
  text: 不爱的人没有认识神[a]，因为神就是爱。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不爱的人不认识神。”原文动词为不定过去时，可表示未曾进入认识神的关系；正文“没有认识神”表达由此显出的状态。
    reason: 时态与体貌的翻译选择
lexical_decisions:
- source_word: ὁ μὴ ἀγαπῶν
  choice: 不爱的人
  rationale: 定冠词加现在分词构成实词化表达，泛指以不爱为特征的人；“不爱的人”在现代汉语中自然，并保留持续或惯常的意味。
- source_word: ἀγαπῶν / ἀγάπη
  choice: 爱 / 爱
  rationale: 前后均用“爱”，保留同源词之间清楚的词汇联系。
- source_word: οὐκ ἔγνω
  choice: 还不认识
  rationale: ἔγνω为不定过去时；结合上下文，表达尚未进入认识神的关系状态。“还不认识”比单纯的“不知道”更适合关系性的认识，同时不把时态意义说得过满。
- source_word: τὸν θεόν / ὁ θεὸς
  choice: 神
  rationale: 作为认识的宾语及后句主语，均采用现代中文圣经语体中自然、明确的“神”。
- source_word: ὅτι
  choice: 因为
  rationale: 此处引出前句判断的原因，译作“因为”准确呈现因果关系。
- source_word: ἐστίν
  choice: 就是
  rationale: “就是”自然承载系词判断，并凸显“爱”是谓语，而非把句子倒转为“爱是神”。
theological_decisions:
- issue: “神是爱”的谓语性质
  choice: 神就是爱
  alternative: 神充满爱；爱就是神
  rationale: 原文以“神”为带冠词的主语，以“爱”为谓语名词。“神就是爱”保留名词谓语的力度，但并不将命题倒置为“爱就是神”；也不弱化为仅仅“神是慈爱的”。
- issue: 认识神的性质与时态
  choice: 还不认识神
  alternative: 不认识神；从未认识神；不了解神
  rationale: 约翰文献中的γινώσκω常指关系性的认识，而非仅仅掌握知识。“还不认识”体现未曾进入并因此仍未处于这种认识关系中的意味；“从未”则可能把不定过去时的力度固定得过强。
translation_notes:
  register: 采用简洁、庄重而通顺的现代标准汉语。“不爱的人”保持泛指单数的概括性；“认识神”保留约翰书信中关系性的用语；“神就是爱”维持原文的神学张力和主谓方向。
