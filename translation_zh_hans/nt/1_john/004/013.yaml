base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/013.yaml
  text: 'By this we know that we remain in him and he in us: because he has given us of his Spirit[a][b][c].'
translation:
  language: zh_hans
  text: 由此，我们知道我们住在他里面，他也住在我们里面：因为他已经把自己的灵赐给我们[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文在“赐给我们”前有“从他的灵”一语；“从”强调所赐之物的来源，也可能带有分有之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν τούτῳ
  choice: 由此
  rationale: 在约翰书信中，这一短语常引出认识某事的依据或凭据；“由此”自然地表达“根据这一点”。
- source_word: γινώσκομεν
  choice: 我们知道
  rationale: 直陈式现在时表达当前并持续的认识；“知道”准确、自然。
- source_word: ἐν αὐτῷ μένομεν
  choice: 我们住在他里面
  rationale: μένω是约翰著作的关键词；“住在……里面”既保留持续居留和关系联合的意象，也符合本段彼此内住的语境。
- source_word: καὶ αὐτὸς ἐν ἡμῖν
  choice: 他也住在我们里面
  rationale: 希腊文省略了重复的μένω，汉语明确补出“住”，使对称结构清楚，并以“也”传达καί。
- source_word: ὅτι
  choice: 因为
  rationale: 第二个ὅτι在这里说明我们如此知道的依据；译作“因为”符合汉语逻辑。
- source_word: ἐκ τοῦ πνεύματος αὐτοῦ
  choice: 自己的灵
  rationale: ἐκ表明来源，原文直译近于“从他的灵”；汉语“把自己的灵赐给了我们”较自然，并可理解为神所赐之灵，而不强行规定所赐是全部还是某种分有。
- source_word: δέδωκεν ἡμῖν
  choice: 赐给了我们
  rationale: 完成时指已经发生并产生持续结果的赐予；“赐给了”在现代汉语中自然体现已完成的行动。
theological_decisions:
- issue: “他的灵”的所指
  choice: 译作“自己的灵”，其中“灵”指上下文中的神之灵。
  alternative: 译作“他的灵”或把“灵”理解为一般性的属灵禀赋。
  rationale: 上下文以神与信徒彼此内住为主题，并把这种内住与神所赐的灵相连；译文不另加“圣”字，避免超出本节措辞。
- issue: 约翰著作中彼此内住的表达
  choice: 译作“我们住在他里面，他也住在我们里面”。
  alternative: 译作“我们常在他里面，他也常在我们里面”。
  rationale: “住在……里面”保存μένω的居住意象和互惠结构；不加“常”可避免把持续性过度显明化。
- issue: ἐκ τοῦ πνεύματος的来源或分有意味
  choice: 正文采用自然汉语“把自己的灵赐给了我们”，脚注保留“从他的灵赐给我们”的字面可能。
  alternative: 正文直译“从他的灵赐给我们”。
  rationale: 原文ἐκ明确标示来源，也可能带有分有意味；正文避免生硬，脚注则保存原句的形式与潜在张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“住在……里面”保留约翰式内住意象；用一个脚注说明ἐκ τοῦ πνεύματος αὐτοῦ的字面形式与来源意味。
