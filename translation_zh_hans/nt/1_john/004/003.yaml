id: 1JN.4.3
reference: 1 John 4:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ πᾶν πνεῦμα ὃ μὴ ὁμολογεῖ ⸀τὸν ⸀Ἰησοῦν ἐκ τοῦ θεοῦ οὐκ ἔστιν· καὶ τοῦτό ἐστιν τὸ τοῦ ἀντιχρίστου, ὃ ἀκηκόατε ὅτι ἔρχεται, καὶ νῦν ἐν τῷ κόσμῳ ἐστὶν ἤδη.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/003.yaml
  text: and every spirit that does not confess Jesus is not from God[a]. And this is the spirit of the antichrist, which you have heard is coming[c][b], and now is already in the world.
translation:
  language: zh_hans
  text: 凡不承认耶稣的灵，都不是出于神的。[a] 这就是敌基督者的灵[b]；你们听说它要来，如今它已经在世上了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作：“不承认耶稣基督是成了肉身来的。”
    reason: textual_variant
  - marker: b
    text: 希腊文在这里有所省略，直译为“这就是敌基督者的”；“灵”是根据上文补出的。
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν πνεῦμα
  choice: 凡……的灵
  rationale: πᾶν在此具有逐一涵盖的意思；上下文谈论需要辨别的属灵影响或宣称，并非指圣灵。用“凡……的灵”符合现代汉语表达。
- source_word: ὁμολογεῖ τὸν Ἰησοῦν
  choice: 承认耶稣
  rationale: SBLGNT正文仅作“承认耶稣”。“承认”既自然，也能表达公开认信的含义；不把其他抄本中的较长表述纳入正文。
- source_word: ἐκ τοῦ θεοῦ
  choice: 出于神
  rationale: ἐκ表示来源；“出于神”准确表达其源头，也符合中文圣经语体。
- source_word: τοῦτό ἐστιν τὸ τοῦ ἀντιχρίστου
  choice: 这就是敌基督者的灵
  rationale: 希腊文省略了前文已经出现的πνεῦμα。中文若直译为“这是敌基督者的”会显得残缺，因此按上下文补出“灵”，并用脚注说明原文的省略。
- source_word: ἀντιχρίστου
  choice: 敌基督者
  rationale: 该词在此指约翰书信中读者已经听说的特定敌基督者；“敌基督者”作为人物称谓清楚自然。
- source_word: ὃ ἀκηκόατε ὅτι ἔρχεται
  choice: 你们听说它要来
  rationale: 关系代词ὃ为中性，承接前面的中性概念，而非明确指一个男性人物；用“它”保留这种语法关系，避免擅自译成“他”。
- source_word: ἐν τῷ κόσμῳ ἐστὶν ἤδη
  choice: 如今它已经在世上了
  rationale: “在世上”对应ἐν τῷ κόσμῳ；“如今……已经”自然传达ἤδη所强调的当前现实。
theological_decisions:
- issue: 所否认之认信的文本形式
  choice: 正文采用SBLGNT的短读法“不承认耶稣”。
  alternative: “不承认耶稣基督已经成了肉身而来。”
  rationale: 短读法有批判本文支持，并且上一节已经交代有关耶稣基督成了肉身而来的认信内容。较长读法列入脚注，以保存重要的抄本异文。
- issue: 是否补明敌基督者的“灵”
  choice: 在正文中按上下文补出“灵”。
  alternative: 保留原文省略，直译为“这是敌基督者的”。
  rationale: 希腊文的冠词短语省略了可由前文明确补出的πνεῦμα。现代汉语不能自然保留这种省略，补出“灵”有助理解，又不改变所指；原文形式在脚注中交代。
- issue: “要来”的主语应否人格化
  choice: 用中性代词“它”，承接敌基督者的灵或相关势力。
  alternative: 译作“他要来”，直接理解为敌基督者本人。
  rationale: 希腊文关系代词为中性，直接承接前面的中性省略表达。译成“他”会比原文更明确地人格化其所指，因此正文保留原有的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“出于神”“在世上”保留约翰书信简洁鲜明的语气；以分号连接后半句，使逻辑层次清楚。
