id: 1JN.4.12
reference: 1 John 4:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: θεὸν οὐδεὶς πώποτε τεθέαται· ἐὰν ἀγαπῶμεν ἀλλήλους, ὁ θεὸς ἐν ἡμῖν μένει καὶ ἡ ἀγάπη αὐτοῦ ⸂ἐν ἡμῖν τετελειωμένη ἐστιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/012.yaml
  text: No one has ever seen God[a]; if we love one another, God remains in us[b], and his love is perfected in us.
translation:
  language: zh_hans
  text: 从来没有人见过神。我们若彼此相爱，神就住在我们里面，他的爱[a]也在我们里面得以成全[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他的爱”也可理解为“我们对他的爱”。希腊语可作两种理解；上下文较支持神对我们的爱。
    reason: 保留属格结构的真实语义歧义。
  - marker: b
    text: 或译：“在我们里面达到完全”或“在我们里面已经完全了”。
    reason: 说明τετελειωμένη ἐστιν所表达的完成、成全状态可有不同的自然汉语表达。
lexical_decisions:
- source_word: τεθέαται
  choice: 见过
  rationale: 与否定词和πώποτε连用，表达截至如今从未有人见过神；“见过”自然体现完成时所指的既往经验，又不额外加入“凝视”等语义。
- source_word: πώποτε
  choice: 从来没有
  rationale: 与οὐδείς合译为“从来没有人”，自然、明确地加强全称否定。
- source_word: ἐὰν ἀγαπῶμεν ἀλλήλους
  choice: 我们若彼此相爱
  rationale: 保留ἐάν加现在时虚拟式的条件意义；“彼此相爱”是现代汉语中自然且庄重的互惠表达。
- source_word: μένει
  choice: 住
  rationale: “住在……里面”既符合现代汉语，也保留约翰著作中μένω所表达的持续同在和内住主题；比“停留”更适合此处的关系语境。
- source_word: ἡ ἀγάπη αὐτοῦ
  choice: 他的爱
  rationale: 形式上贴近希腊语属格，并以“他的”指向神。上下文较支持“神所施的爱”，但该短语也可能指“人对神的爱”，故以脚注保存歧义。
- source_word: ἐν ἡμῖν
  choice: 在我们里面
  rationale: 两处均一致译出，保留内住意味；虽然“在我们中间”在语法上可能成立，但此处与μένει及上下文的内住主题相比，不是首选。
- source_word: τετελειωμένη ἐστιν
  choice: 得以完全
  rationale: 表达迂回完成时所呈现的已成就并持续有效的状态，同时保持τελειόω“使完全、达到完满”的语义，不将其弱化为一般的“改善”。
theological_decisions:
- issue: ἡ ἀγάπη αὐτοῦ中属格的含义
  choice: 正文采用“他的爱”，按上下文优先理解为神对人的爱
  alternative: 我们对神的爱
  rationale: 前文尤其4:10–11强调神主动施爱，因此主观属格的理解较为合适；不过希腊语属格本身容许客观属格，故不在正文中强行消除这项真实歧义，并以脚注说明。
- issue: ἐν ἡμῖν的范围
  choice: 在我们里面
  alternative: 在我们中间
  rationale: 约翰文本中的μένω常有内住意味，而且本节两次使用同一短语；“在我们里面”较好保留这一联系，但“在我们中间”仍是可能的群体性理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“若”比“如果”略显凝练，适合经文语体而不古奥；“住在我们里面”保持约翰著作的关键词联系。脚注标记均置于所解释的词语之后。
