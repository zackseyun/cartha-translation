language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ταύτην τὴν ἐντολὴν ἔχομεν ἀπ’ αὐτοῦ, ἵνα ὁ ἀγαπῶν τὸν θεὸν ἀγαπᾷ καὶ τὸν ἀδελφὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/021.yaml
  text: 'And we have this commandment from him: that the one who loves God should also love his brother[a].'
translation:
  language: zh_hans
  text: 我们从他领受了这条诫命：爱上帝的人，也要爱自己的弟兄[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“自己的弟兄或姊妹”。希腊文作阳性单数“弟兄”，在这里可代表同为信徒的人。
    reason: 说明原文的性别与数，并保留其代表性、群体性的可能含义。
lexical_decisions:
- source_word: ἐντολήν
  choice: 诫命
  rationale: 保留该词在约翰著作中所具有的道德权威和约束力；“诫命”也能自然承接本句所陈明的具体要求。
- source_word: ἀπ’ αὐτοῦ
  choice: 从他领受
  rationale: 以代词“他”对应原文代词，不在正文中明说是“上帝”，从而保留原文的指代方式；“领受”自然表达这条诫命来自他。
- source_word: ἵνα
  choice: 冒号后直接引出诫命内容
  rationale: 此处ἵνα主要引出诫命的内容。汉语用冒号直接陈明，比机械译作“为要”更自然，也避免误解为单纯的目的关系。
- source_word: ὁ ἀγαπῶν τὸν θεόν
  choice: 爱上帝的人
  rationale: 准确表达带冠词的现在分词所指的一类人，同时保持现代汉语的自然表达。
- source_word: ἀγαπᾷ
  choice: 要爱
  rationale: 在诫命内容中，“要”自然体现虚拟式所表达的义务和要求，又不额外强化为绝对化的措辞。
- source_word: ἀδελφὸν αὐτοῦ
  choice: 自己的弟兄
  rationale: 保留原文阳性单数形式及其关系性表达；其可代表同为信徒的人这一范围在脚注中说明。
- source_word: καὶ
  choice: 也
  rationale: 体现第二个καί的附加意义，表明爱弟兄与爱上帝不可分割。
- source_word: ἀγαπάω / ἀγαπῶν / ἀγαπᾷ
  choice: 爱
  rationale: 同一词根前后一致译为“爱”，保留约翰著作中的主题连贯性。
theological_decisions:
- issue: ἀδελφὸν αὐτοῦ的阳性单数及代表性用法
  choice: 正文保留“自己的弟兄”，脚注说明可代表同为信徒的人
  alternative: 自己的弟兄或姊妹；同为信徒的人
  rationale: 原文明确使用阳性单数，但在语境中可作代表性用法。正文不将其直接中性化或扩展，脚注则交代其涵盖范围，以兼顾形式与实际所指。
- issue: ἀπ’ αὐτοῦ中代词的指向
  choice: 保留“他”
  alternative: 译明为“上帝”
  rationale: 上下文自然指向上帝，但原文使用代词而非重述θεός；保留代词可维持原文的话语衔接，不把隐含指向改成明说。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“领受了这条诫命”符合汉语表达，也清楚传达诫命的来源；“弟兄”保留原文形式及约翰书信的信仰群体语境，并以脚注避免将其误解为仅指男性或血缘兄弟。
