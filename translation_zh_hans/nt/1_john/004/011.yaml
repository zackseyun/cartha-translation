source:
  edition: SBLGNT
  text: ἀγαπητοί, εἰ οὕτως ὁ θεὸς ἠγάπησεν ἡμᾶς, καὶ ἡμεῖς ὀφείλομεν ἀλλήλους ἀγαπᾶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/011.yaml
  text: Beloved[a], if God so loved us, we also ought to love one another.
translation:
  language: zh_hans
  text: 亲爱的[a]，如果上帝这样爱我们，我们也应当彼此相爱。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“蒙爱的人”或“亲爱的”。希腊文用条件形式“如果”；在上下文中，这一条件被视为真实，用来引出劝勉。
    reason: 说明称呼语的含义，并保留希腊文条件形式及其在语境中预设为真的语力。
lexical_decisions:
- source_word: ἀγαπητοί
  choice: 亲爱的弟兄姊妹
  rationale: 这是复数呼格，用于亲切地直接称呼信徒群体。现代汉语中“亲爱的弟兄姊妹”自然、庄重，也符合本书信面向信仰群体的语境；爱这一词族的联系则由本句后两处“爱”清楚体现。
- source_word: εἰ
  choice: 既然
  rationale: 希腊文形式上是条件连词“若/如果”，但在本语境中说话者预设上帝爱我们为真。汉语“既然”自然表达这种已认定前提，并保留由前提引出责任的论证关系；脚注说明原文的条件形式。
- source_word: οὕτως
  choice: 这样
  rationale: “这样”可回指上文所述上帝借着差遣儿子而显明的爱，兼容方式与程度两方面的意味，不必替原文作过度限定。
- source_word: ὁ θεὸς
  choice: 上帝
  rationale: 对 θεός 作直接、通行且庄重的现代汉语表达。
- source_word: ἠγάπησεν
  choice: 爱
  rationale: 不定过去时在此指向上文已经显明的爱；汉语动词通常无需形态标示过去时，语境足以表达。
- source_word: ἡμᾶς
  choice: 我们
  rationale: 直接宾语的自然对应。
- source_word: καὶ ἡμεῖς
  choice: 我们也
  rationale: 显明原文独立主语代词的强调，并自然表达 καί 的对应关系。
- source_word: ὀφείλομεν
  choice: 应当
  rationale: 表达道德责任和义务，力度比单纯建议更强，同时不把陈述形式改写成直接命令。
- source_word: ἀλλήλους
  choice: 彼此
  rationale: 现代汉语中表达群体成员相互关系的标准用语。
- source_word: ἀγαπᾶν
  choice: 相爱
  rationale: 与“彼此”搭配自然，准确表达持续实行彼此之爱的责任。
theological_decisions:
- issue: 条件从句 εἰ οὕτως ὁ θεὸς ἠγάπησεν ἡμᾶς 的语力
  choice: 正文译为“上帝既然这样爱我们”，脚注交代原文直译为“如果”。
  alternative: “如果上帝这样爱我们”
  rationale: εἰ 在形式上构成条件句，但上下文明确预设上帝已经如此爱我们。现代汉语用“如果”容易产生事实尚未确定的误解，因此正文采用“既然”传达其语用功能，同时借脚注保留原文形式及其修辞张力。
translation_notes:
  register: 采用现代、庄重而易懂的书信劝勉语体。“亲爱的弟兄姊妹”适合教会群体中的亲切称呼；句式简洁，保留“上帝的爱—我们彼此相爱”的对应结构。
