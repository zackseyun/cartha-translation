id: 1JN.4.2
reference: 1 John 4:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐν τούτῳ ⸀γινώσκετε τὸ πνεῦμα τοῦ θεοῦ· πᾶν πνεῦμα ὃ ὁμολογεῖ Ἰησοῦν Χριστὸν ἐν σαρκὶ ἐληλυθότα ἐκ τοῦ θεοῦ ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/002.yaml
  text: 'By this you know the Spirit of God: every spirit that confesses Jesus the Messiah having come in the flesh is from God[c][b][a],'
translation:
  language: zh_hans
  text: 你们凭这一点认得神的灵：凡承认耶稣这位弥赛亚已经以肉身来到的灵，都是出于神的。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“承认耶稣基督已经以肉身来到”。希腊语“基督”意为“弥赛亚”，在这里是耶稣的称号。
    reason: lexical_alternative
  - marker: b
    text: “已经……来到”也可译作“以肉身来临了”。希腊语使用完成时形式，强调这次来临已经发生，并且其意义仍然有效。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: 凭这一点
  rationale: 该短语引出辨认的依据；“凭这一点”自然表达工具或标准之意。
- source_word: γινώσκετε
  choice: 你们……认得
  rationale: 按陈述语气理解现在时直陈式，而不改作命令；“认得”也贴合上下文中辨认诸灵的含义。
- source_word: τὸ πνεῦμα τοῦ θεοῦ
  choice: 神的灵
  rationale: 定冠词和上下文支持这里指神自己的灵；中文无需借助大小写作进一步解释。
- source_word: πᾶν πνεῦμα
  choice: 凡……的灵
  rationale: “凡”保留 πᾶν 的周遍、逐一判断之意，并适合中文格言式判断句。
- source_word: ὁμολογεῖ
  choice: 承认
  rationale: 表达公开认同、宣认的含义，同时是普通现代读者容易理解的用语。
- source_word: Ἰησοῦν Χριστόν
  choice: 耶稣这位弥赛亚
  rationale: 把 Χριστός 作为称号处理，而不是默认为姓名的一部分；加入“这位”使中文称号结构自然。
- source_word: ἐν σαρκὶ
  choice: 以肉身
  rationale: 保留 σάρξ 的“肉身”措辞，明确真实具有人类身体的来临，又不加入原文没有的后期神学术语。
- source_word: ἐληλυθότα
  choice: 已经……来到
  rationale: 以“已经”表达完成时所指的既成事实，并使其持续意义自然蕴含在当前的宣认标准中。
- source_word: ἐκ τοῦ θεοῦ ἐστιν
  choice: 都是出于神的
  rationale: “出于”准确表达 ἐκ 的来源意义；“都”与前面的“凡”呼应。
theological_decisions:
- issue: τὸ πνεῦμα τοῦ θεοῦ 是特指神的灵，还是泛指一个来自神的灵
  choice: 译作“神的灵”，按上下文理解为神自己的灵
  alternative: 来自神的灵
  rationale: 单数定指形式与随后“凡……的灵”的检验标准形成对照；译文保留这一对照，而不额外加入“三位一体”等原文未明说的术语。
- issue: ἐν σαρκὶ ἐληλυθότα 的基督论含义
  choice: 译作“已经以肉身来到”
  alternative: 已经成为人而来
  rationale: 译文直接肯定耶稣真实以肉身来临，同时保留原文“肉身”的表达，不用后期信经术语替代经文本身。
- issue: Ἰησοῦν Χριστόν 与完成时分词的句法表达
  choice: 译作“承认耶稣这位弥赛亚已经以肉身来到”
  alternative: 承认那位已经以肉身来到的耶稣弥赛亚
  rationale: 主译文以自然中文表达宣认的内容，也保留 Χριστός 的称号功能；脚注列出传统名称形式，避免把一种中文惯用表达绝对化。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“凭这一点认得”保持陈述语气并呼应辨认诸灵的上下文；“耶稣这位弥赛亚”明确呈现称号含义；“以肉身来到”保留约翰书信中的关键措辞。
