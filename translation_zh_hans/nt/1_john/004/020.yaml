source:
  edition: SBLGNT
  text: ἐάν τις εἴπῃ ὅτι Ἀγαπῶ τὸν θεόν, καὶ τὸν ἀδελφὸν αὐτοῦ μισῇ, ψεύστης ἐστίν· ὁ γὰρ μὴ ἀγαπῶν τὸν ἀδελφὸν αὐτοῦ ὃν ἑώρακεν, τὸν θεὸν ὃν οὐχ ἑώρακεν ⸀οὐ δύναται ἀγαπᾶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/020.yaml
  text: If anyone says[a], “I love God,” and hates his brother, he is a liar; for the one who does not love his brother whom he has seen cannot love God whom he has not seen.
translation:
  language: zh_hans
  text: 如果有人说：“我爱上帝”，却恨自己的弟兄[a]，他是说谎的人；因为那不爱自己所看见的弟兄的人，不能爱自己没有看见的上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“弟兄或姐妹”。希腊文作“弟兄”（ἀδελφόν），是阳性单数形式，在本语境中可以具有代表性。
    reason: 词义与性别范围说明
lexical_decisions:
- source_word: ἐάν τις εἴπῃ
  choice: 如果有人说
  rationale: ἐάν加不定代词τις和虚拟语气构成一般性条件句；“如果有人说”自然保留了不特指任何人的语气。
- source_word: Ἀγαπῶ
  choice: 我爱
  rationale: 直译现在时陈述语气，并与本节随后ἀγαπῶν、ἀγαπᾶν的“爱”保持词汇呼应。
- source_word: τὸν θεόν
  choice: 上帝
  rationale: 作为ἀγαπῶ的直接宾语；“上帝”是现代标准普通话中自然、庄重且明确的称谓。
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: 自己的弟兄
  rationale: ἀδελφός为阳性单数；“弟兄”保留原文的性别和单数形式，αὐτοῦ依中文回指习惯译为“自己的”。本语境可能泛指同信群体中的弟兄姊妹，另以脚注说明。
- source_word: μισῇ
  choice: 恨
  rationale: 以简单现在表达条件句中现在时虚拟语气的持续或一般性行为，简洁有力。
- source_word: ψεύστης ἐστίν
  choice: 他就是说谎的人
  rationale: ψεύστης是表语名词，原文对这人的身份作明确判断；“说谎的人”比单译“他说谎”更能保留这一点，也比“骗子”少一层以欺诈牟利为主的现代含义。
- source_word: ὁ γὰρ μὴ ἀγαπῶν
  choice: 因为不爱……
  rationale: γάρ引出理由，译为“因为”；冠词化分词在中文中可自然省去泛指主语，形成一般性论断。
- source_word: ὃν ἑώρακεν
  choice: 自己所看见的
  rationale: ἑώρακεν为完成时，表达已经看见且这一事实对当前论证仍然有效；中文“所看见的”自然传达此义，不强加额外时间说明。
- source_word: ὃν οὐχ ἑώρακεν
  choice: 自己所没有看见的
  rationale: 保留与前一分句“所看见的”的对照，并忠实表达完成时否定形式。
- source_word: οὐ δύναται ἀγαπᾶν
  choice: 不能爱
  rationale: δύναται表达能力或可能性；“不能爱”保留约翰论证中强烈的不可能性，而不弱化为“很难爱”。
theological_decisions:
- issue: ἀδελφός在本语境中是否可代表包括女性在内的同信者
  choice: 正文译“弟兄”，脚注说明“弟兄或姊妹”的可能表达
  alternative: 正文译“弟兄或姊妹”或“同信的人”
  rationale: 原文是阳性单数，正文保留其形式，避免把语境解释直接写入正文；同时用脚注保存该词在此处可能具有代表性、泛指同信群体成员的语用范围。
- issue: οὐ δύναται ἀγαπᾶν的力度
  choice: 不能爱上帝
  alternative: 无法爱上帝；不可能爱上帝
  rationale: “不能”准确保留能力或可能性受到否定的强烈判断，同时不额外界定这种不可能究竟属于心理、道德还是属灵层面。
- issue: ψεύστης ἐστίν是行为描述还是身份判断
  choice: 他就是说谎的人
  alternative: 他在说谎；他是骗子
  rationale: 原文采用表语名词，故保留身份性判断；不改成仅描述一次行为，也避免“骗子”在现代汉语中常有职业性诈骗的附加意味。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“却”清楚表现宣称爱上帝与恨弟兄之间的反差；“就是说谎的人”保留原文的断然判断。前后重复“爱”“看见”，维持原文论证的词汇链条和对称结构。
