id: 1JN.4.18
reference: 1 John 4:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: φόβος οὐκ ἔστιν ἐν τῇ ἀγάπῃ, ἀλλ’ ἡ τελεία ἀγάπη ἔξω βάλλει τὸν φόβον, ὅτι ὁ φόβος κόλασιν ἔχει, ὁ δὲ φοβούμενος οὐ τετελείωται ἐν τῇ ἀγάπῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/018.yaml
  text: There is no fear in love[a], but perfect love drives out fear, because fear has punishment[c][b]. But the one who fears has not been perfected in love.
translation:
  language: zh_hans
  text: 爱里没有惧怕；完全的爱[a]反而把惧怕驱逐出去，因为惧怕中含着刑罚[b]。惧怕的人还没有在爱里得以完全。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “完全”也可译作“完备”或“成熟”，指爱达到其应有的完整状态。
    reason: lexical_alternative
  - marker: b
    text: 直译：“惧怕有刑罚。”也可理解为“惧怕与刑罚相连”。
    reason: lexical_alternative
lexical_decisions:
- source_word: φόβος / φοβούμενος
  choice: 惧怕／惧怕的人
  rationale: “惧怕”自然、庄重，并保留本节中同一词根的反复；在审判和刑罚的语境中，也能表达带着忧惧的害怕。
- source_word: ἀγάπῃ / ἀγάπη
  choice: 爱
  rationale: 采用ἀγάπη的常规译法，并在全节保持关键词一致。
- source_word: τελεία
  choice: 完全的
  rationale: 表达达到预期完整状态之意，并与后文τετελείωται的“得以完全”形成清楚的词语呼应。
- source_word: ἔξω βάλλει
  choice: 驱逐出去
  rationale: 保留“向外赶出”的强烈空间性比喻，同时符合现代汉语表达。
- source_word: κόλασιν ἔχει
  choice: 中含着刑罚
  rationale: 尽量贴近希腊文“有刑罚”的结构，又使汉语可读；不擅自将其具体解释为对刑罚的预期或刑罚所造成的痛苦。
- source_word: ὁ δὲ φοβούμενος
  choice: 惧怕的人
  rationale: 自然表达带冠词的实体化分词，不增添性别信息。
- source_word: οὐ τετελείωται
  choice: 还没有……得以完全
  rationale: “得以”保留完成时被动态，“还没有”表达其现有状态；并维持与τελεία“完全的”的词根联系。
- source_word: ἐν τῇ ἀγάπῃ
  choice: 在爱里
  rationale: 简洁保留介词短语的领域或范围含义。
theological_decisions:
- issue: “完全的爱”与“得以完全”的关系
  choice: 译作“完全的爱”及“在爱里得以完全”，保留二者的词根联系。
  alternative: “成熟的爱”及“在爱里成熟”
  rationale: 原文强调爱达到其应有的完整状态，但没有明确讲论无罪的完美；“完全”既保留原文联系，也不把含义缩减为一般的情绪成熟。
- issue: 惧怕与刑罚的关系
  choice: 译作“惧怕中含着刑罚”，贴近κόλασιν ἔχει。
  alternative: “惧怕与刑罚有关”或“惧怕是因为怕受刑罚”
  rationale: 原文关系简练而有一定含混性；主译文不明确指定惧怕是刑罚的原因、结果，还是对刑罚的预期。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“驱逐出去”保留原文有力的排除意象；“中含着刑罚”略带凝练的书面色彩，以保存原文关系上的含混。所有脚注标记均置于所说明的词句之后。
