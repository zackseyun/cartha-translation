id: 1JN.4.17
reference: 1 John 4:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐν τούτῳ τετελείωται ἡ ἀγάπη μεθ’ ἡμῶν, ἵνα παρρησίαν ἔχωμεν ἐν τῇ ἡμέρᾳ τῆς κρίσεως, ὅτι καθὼς ἐκεῖνός ἐστιν καὶ ἡμεῖς ἐσμεν ἐν τῷ κόσμῳ τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/017.yaml
  text: By this[a], love has been perfected with us, so that we may have boldness in the day of judgment, because as he is[d][c][b], so also are we in this world.
translation:
  language: zh_hans
  text: 在这事上，爱在我们中间得以完全[a]，使我们在审判的日子可以坦然无惧[b]；因为他[c]怎样，我们在这世上也怎样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“借着这事，爱在我们中间得以完全。”希腊语短语也可理解为“爱与我们同在得以完全”。
    reason: 保留ἐν τούτῳ可表示范围、方式或凭借，以及μεθ’ ἡμῶν在语义上的开放性。
  - marker: b
    text: “坦然无惧”也可译作“满有信心”。
    reason: παρρησία兼有坦然、勇气和确信之意。
  - marker: c
    text: “他”很可能指耶稣基督；也有人理解为泛指神。
    reason: 原文代词没有在本句中明确说出所指。
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: 这样
  rationale: 既可回指或前指其具体内容，也可表达方式；“这样”在现代汉语中自然，并保留指向上的一定开放性。
- source_word: τετελείωται
  choice: 得以完全
  rationale: 表达完成时被动态所含的“已被带到圆满并持续有效”，同时避免暗示爱先前具有道德缺陷。
- source_word: ἡ ἀγάπη μεθ’ ἡμῶν
  choice: 爱在我们中间
  rationale: μετά加属格通常表示“与”；此处译作“在我们中间”较符合汉语习惯，又不把爱限定为只指神对人的爱或人对神的爱。
- source_word: ἵνα παρρησίαν ἔχωμεν
  choice: 使我们……可以坦然无惧
  rationale: 保留目的或结果关系；παρρησία在审判语境中指无所畏惧的确信与自由。
- source_word: ἐν τῇ ἡμέρᾳ τῆς κρίσεως
  choice: 在审判的日子
  rationale: 贴近原文介词结构，并保留其末世审判意味。
- source_word: ὅτι
  choice: 因为
  rationale: 明确引出信徒能够坦然无惧的根据。
- source_word: καθὼς ἐκεῖνός ἐστιν καὶ ἡμεῖς ἐσμεν
  choice: 他怎样，我们……也怎样
  rationale: 保留现在时和对应比较关系；不增补比较的具体方面。
- source_word: ἐν τῷ κόσμῳ τούτῳ
  choice: 在这世上
  rationale: 自然表达信徒当前生活于其中的世界领域。
theological_decisions:
- issue: ἐκεῖνος（“他”）的所指
  choice: 正文保留代词“他”，注释说明很可能指耶稣基督
  alternative: 泛指神
  rationale: 《约翰一书》中ἐκεῖνος常在此类表述中指向基督，但希腊正文未在本句明说名字，因此正文保持其隐含性。
- issue: “爱得以完全”的含义
  choice: 爱在信徒中间被带到其应有的圆满
  alternative: 专指我们对神的爱达到道德上的完美，或只指神对我们的爱达到完全
  rationale: 原文没有限定爱的单一方向；译文避免引入完美主义，也不把它缩减为单方面的爱。
- issue: “他怎样，我们也怎样”的比较范围
  choice: 不在正文中补明具体相似点
  alternative: 明确解释为在义、爱、与神的关系或受审判地位上相同
  rationale: 原文保留概括性的神学张力，翻译不应擅自把比较限于某一方面。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“爱在我们中间”避免生硬的“爱与我们同在”；“坦然无惧”比单用“胆量”更贴合审判语境中的παρρησία。
