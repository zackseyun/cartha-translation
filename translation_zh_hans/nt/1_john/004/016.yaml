  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἡμεῖς ἐγνώκαμεν καὶ πεπιστεύκαμεν τὴν ἀγάπην ἣν ἔχει ὁ θεὸς ἐν ἡμῖν. Ὁ θεὸς ἀγάπη ἐστίν, καὶ ὁ μένων ἐν τῇ ἀγάπῃ ἐν τῷ θεῷ μένει καὶ ὁ θεὸς ἐν αὐτῷ ⸀μένει.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/016.yaml
  text: And we have come to know and have believed the love that God has for us[a]. God is love, and the one who remains in love remains in God[c][b], and God remains in him.
translation:
  language: zh_hans
  text: 我们已经认识并且相信了上帝在我们中间的爱。[a]上帝就是爱；住在爱里的人住在上帝里面，上帝也住在他里面。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在我们中间”也可译作“在我们里面”；有人按语意理解为“对我们的”。原文介词短语可指上帝的爱存在于信徒里面，或显明在信徒群体中。
    reason: alternative_reading
  - marker: b
    text: “他”指前文“住在爱里的人”，具有代表性的泛指作用。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώκαμεν
  choice: 已经认识
  rationale: 完成时表示由先前认识而形成、持续至今的状态；“已经认识”在现代汉语中自然地保留这一结果状态。
- source_word: πεπιστεύκαμεν
  choice: 并且相信了
  rationale: 完成时表达已经建立并持续有效的信；“相信了”与“已经认识”并列，既保留完成意义，也避免把对象误解为只是一项命题。
- source_word: τὴν ἀγάπην
  choice: 爱
  rationale: 上下文所指明确，汉语无须用冠词形式，却仍指向上帝具体显明的爱。
- source_word: ἣν ἔχει ὁ θεὸς ἐν ἡμῖν
  choice: 上帝在我们中间所怀的爱
  rationale: ἐν ἡμῖν首先保留“在我们里面／中间”的方位与群体意味；“所怀的爱”使ἔχει的结构在汉语中通顺，同时不直接改写为受益义的“对我们的爱”。
- source_word: Ὁ θεὸς ἀγάπη ἐστίν
  choice: 上帝就是爱
  rationale: 直接保留谓语名词断言；“就是”符合庄重自然的现代汉语，并突出原句的等同陈述。
- source_word: ὁ μένων
  choice: 住……的人
  rationale: μένω是约翰著作中的关键词。“住”能自然承载持续居留和关系相连的意象，比单纯译作“保持”更贴近原文。
- source_word: ἐν τῇ ἀγάπῃ
  choice: 在爱里
  rationale: 保留ἐν的领域性表达，指持续处于前文所说的爱之中，而非泛指情感。
- source_word: ἐν τῷ θεῷ μένει
  choice: 住在上帝里面
  rationale: 与后半句形成相互内住的平行结构，并一致翻译μένω。
- source_word: ὁ θεὸς ἐν αὐτῷ μένει
  choice: 上帝也住在他里面
  rationale: 保留原文阳性单数代词及互相内住的表达；“也”自然呈现καί的递进并列。
theological_decisions:
- issue: ἐν ἡμῖν在首句中的含义
  choice: 译为“在我们中间”，保留方位和群体层面
  alternative: “在我们里面”可强调内住；“对我们的”则按受益关系理解
  rationale: ἐν通常表达“在……里面／中间”。本段既涉及群体中显明的爱，也涉及相互内住；正文采用“在我们中间”避免过早限定为纯粹内在经验或受益关系，并以脚注保存歧义。
- issue: “上帝就是爱”的断言范围
  choice: 直接保留原文谓语名词结构，不加解释性限定
  alternative: 扩写为“上帝充满爱”或“上帝是爱的源头”
  rationale: 扩写会削弱或改写原文的本体性断言；直译能保留其神学张力。
- issue: αὐτῷ的指代
  choice: 正文译为“他”，回指“住在爱里的人”
  alternative: 译为“这个人”或“这样的人”
  rationale: 原文使用阳性单数并具有代表性；汉语“他”形式对应且回指清楚，脚注说明其泛指功能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“住在……里面”保留约翰著作中μένω反复出现的内住意象；标点稍作汉语化处理，使两个相互对应的分句清楚流畅。
