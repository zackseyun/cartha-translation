  text: ἡμεῖς ⸀ἀγαπῶμεν, ὅτι αὐτὸς πρῶτος ἠγάπησεν ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/019.yaml
  text: We love because he first loved us[a].
translation:
  language: zh_hans
  text: 我们爱，因为他先爱了我们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作：“我们爱他，因为他先爱了我们。”
    reason: textual_variant
lexical_decisions:
- source_word: ἡμεῖς
  choice: 我们
  rationale: 保留第一人称复数主语；汉语中明说“我们”也自然，并能体现原文显式主语所带的轻微强调。
- source_word: ἀγαπῶμεν
  choice: 爱
  rationale: 用一般现在时意义的“爱”，表达持续或常态性的行动，并与上下文“爱”的词汇链保持一致；不补出宾语。
- source_word: ὅτι
  choice: 因为
  rationale: 此处最自然地表示原因：我们的爱源于他先有的爱。
- source_word: αὐτὸς
  choice: 他
  rationale: 按上下文指神；现代汉语用“他”自然清楚，无须加重为“他自己”。
- source_word: πρῶτος
  choice: 先
  rationale: 准确表达时间和逻辑上的优先，且“先爱了我们”比“首先爱了我们”更自然。
- source_word: ἠγάπησεν
  choice: 爱了
  rationale: 以“爱了”表达不定过去时所指向的先行动作，并与“先”配合，显明他的爱在我们的爱之前。
- source_word: ἡμᾶς
  choice: 我们
  rationale: 直接对应动词“爱”的宾语，表达自然明确。
theological_decisions:
- issue: 是否给“我们爱”补出宾语
  choice: 不补宾语：“我们爱”
  alternative: “我们爱他”或“我们爱神”
  rationale: 所据SBLGNT正文在ἀγαπῶμεν之后没有宾语。无宾语的表达可涵盖对神和对人的爱，并保留原文的开放性；“他”属于部分抄本的异文，不应无提示地纳入正文。
translation_notes:
  register: 采用现代、简洁而庄重的普通话。“我们爱”在汉语中虽为无宾语结构，但语意可成立，也忠实保留原文的概括性与文本张力。
