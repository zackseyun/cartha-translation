source:
  edition: SBLGNT
  text: Ἀγαπητοί, μὴ παντὶ πνεύματι πιστεύετε, ἀλλὰ δοκιμάζετε τὰ πνεύματα εἰ ἐκ τοῦ θεοῦ ἐστιν, ὅτι πολλοὶ ψευδοπροφῆται ἐξεληλύθασιν εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/001.yaml
  text: Beloved[a], do not believe every spirit, but test the spirits to see whether they are from God[b], because many false prophets have gone out into the world.
translation:
  language: zh_hans
  text: 亲爱的朋友们[a]，不要信每一个灵，却要察验这些灵是否出于上帝[b]，因为有许多假先知已经到世上来了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“蒙爱的人”；也可译作“亲爱的诸位”。
    reason: lexical_alternative
  - marker: b
    text: 这里是要察验预言性宣称背后的属灵来源；下一句所说的“假先知”是这些属灵影响在现实中的人类媒介。
    reason: cultural_note
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: 亲爱的弟兄姊妹
  rationale: 这是复数呼格，用作爱意深厚的称呼。中文若直译为“蒙爱的人”略显生硬；“亲爱的弟兄姊妹”自然、庄重，也符合本书写给信徒群体的语境。脚注保留较贴近字面的译法。
- source_word: παντὶ πνεύματι πιστεύετε
  choice: 每个灵都信
  rationale: 保留原文“灵”的超自然表述，不将其缩减为教师或言论；“不要……都……”自然表达 μή 加现在时命令语气的一般性禁令。
- source_word: δοκιμάζετε τὰ πνεύματα
  choice: 察验那些灵
  rationale: “察验”表达检验真伪的评估性含义，且具有庄重而易懂的经文语体；“那些灵”承接前面的泛指“每个灵”。
- source_word: εἰ ἐκ τοῦ θεοῦ ἐστιν
  choice: 是不是出于上帝
  rationale: ἐκ 表示来源；“出于上帝”准确表达源头。中文“是不是”自然保留间接疑问，并可按集合或逐一检验来理解，不必强行处理希腊文单数动词与复数先行词之间的张力。
- source_word: πολλοὶ ψευδοπροφῆται
  choice: 有许多假先知
  rationale: 直接、通行地表达 ψευδοπροφῆται，并保留“灵”与作为人类代理者的“假先知”之间的区别。
- source_word: ἐξεληλύθασιν εἰς τὸν κόσμον
  choice: 已经到世上来了
  rationale: 以“已经”体现完成时所表示的既成事实及当前结果；“到世上来了”在现代汉语中比机械的“出去进入世界”自然，同时保留其进入人类世界并正在活动的含义。
theological_decisions:
- issue: “灵”的所指
  choice: 保留为实际的灵或属灵来源，并由假先知的言论和活动显明
  alternative: 仅指人类教师，或仅指抽象的预言言论
  rationale: 原文先说察验“灵”，随后以“假先知”说明现实中的人类媒介。译文保留两者的区别和神学张力，不把超自然语言化约为单纯的人际或思想辨别。
- issue: θεός 的中文译名
  choice: 上帝
  alternative: 神
  rationale: 二者在现代汉语基督教用语中均可成立；本稿采用“上帝”，清楚指向独一的神，且不额外加入宗派性解释。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“亲爱的弟兄姊妹”兼顾群体称呼的自然度与约翰语气中的亲爱；“察验”比“测试”更适合经文语体，又不至于古奥。所有脚注标记均已置于正文对应位置。
