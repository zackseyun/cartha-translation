  text: ἐν τούτῳ ἐστὶν ἡ ἀγάπη, οὐχ ὅτι ἡμεῖς ⸀ἠγαπήκαμεν τὸν θεόν, ἀλλ’ ὅτι αὐτὸς ἠγάπησεν ἡμᾶς καὶ ἀπέστειλεν τὸν υἱὸν αὐτοῦ ἱλασμὸν περὶ τῶν ἁμαρτιῶν ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/010.yaml
  text: 'In this is love: not that we have loved God, but that he loved us and sent his Son as an atoning sacrifice for our sins.'
translation:
  language: zh_hans
  text: 爱就在于此：不是我们爱了上帝，而是他爱了我们，差遣他的儿子，作我们罪的赎罪祭。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赎罪祭”也可译作“挽回祭”或“除罪祭”。希腊语ἱλασμός指为罪而有的祭献，具有处理罪的含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ ἐστὶν ἡ ἀγάπη
  choice: 爱就在于此
  rationale: 保留约翰常用的指示结构，并以自然现代汉语引出下文对爱的界定。
- source_word: οὐχ ὅτι ἡμεῖς ἠγαπήκαμεν τὸν θεόν, ἀλλ’ ὅτι αὐτὸς ἠγάπησεν ἡμᾶς
  choice: 不是我们爱了上帝，而是他爱了我们
  rationale: 对应“不是……而是……”的鲜明对照；以“爱了”表达完成时与不定过去时在此共同指向的事实，同时不强行在汉语中制造时态差异。
- source_word: ἀπέστειλεν τὸν υἱὸν αὐτοῦ
  choice: 差遣他的儿子
  rationale: “差遣”自然、庄重，并保留约翰著作中重要的差派语义。
- source_word: ἱλασμὸν περὶ τῶν ἁμαρτιῶν ἡμῶν
  choice: 为我们的罪作了赎罪祭
  rationale: “赎罪祭”兼顾祭献背景与处理罪的功效，且比音译或高度技术化术语更易懂；“为我们的罪”自然表达 περί 与罪的关联。
theological_decisions:
- issue: ἱλασμός 在赎罪语境中的译法
  choice: 赎罪祭
  alternative: 挽回祭；除罪祭
  rationale: 原词表示儿子以祭献方式有效处理人的罪，但其侧重点可被理解为平息忿怒或除去罪。“赎罪祭”保留较宽的核心意义，不在正文中排他性地解决这一神学张力，并在脚注列出其他可能译法。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“爱就在于此”保持经文的界定语气；全句保留原文由人的爱转向上帝主动之爱的对照。
