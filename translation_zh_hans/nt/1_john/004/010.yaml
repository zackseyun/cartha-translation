  source_fidelity: 正文末句“差遣他的儿子为我们的罪作了赎罪祭”在汉语句法上容易表示儿子被差遣去‘作（施行）赎罪祭’，而希腊文的ἱλασμόν是‘儿子’的谓语性补足语：上帝差遣儿子，作为/作赎罪祭。应消除这一关键句法歧义。其余部分准确保留了界定爱的结构、否定—转折对照及上帝主动爱的重点。
  naturalness: “爱就在于此”及“不是……而是……”自然且庄重。“差遣他的儿子，作我们罪的赎罪祭”在现代标准汉语的经文语体中清楚自然；将脚注锚点紧随“赎罪祭”也使其所注词项明确。
  terminology: “上帝”“差遣”“赎罪祭”均一致、适切。“赎罪祭”可宽泛表达ἱλασμός的献祭性、罪处理含义，而不预断‘挽回’或‘除罪’何者为唯一侧重。脚注保留这些替代译法，措辞改为说明该词本身而非增述儿子实施某一动作。
