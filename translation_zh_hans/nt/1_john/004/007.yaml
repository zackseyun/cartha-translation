  text: Ἀγαπητοί, ἀγαπῶμεν ἀλλήλους, ὅτι ἡ ἀγάπη ἐκ τοῦ θεοῦ ἐστιν, καὶ πᾶς ὁ ἀγαπῶν ἐκ τοῦ θεοῦ γεγέννηται καὶ γινώσκει τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/007.yaml
  text: Beloved[a], let us love one another, because love is from God, and everyone who loves has been born of God and knows God.
translation:
  language: zh_hans
  text: 蒙爱的人啊[a]，让我们彼此相爱，因为爱源于神；凡有爱心的人，都是已经从神而生的，也认识神。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“亲爱的朋友们”。希腊文直译为“蒙爱的人”，与本节反复出现的“爱”属于同一词族。
    reason: 说明呼语的自然译法及原文词语重复。
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: 蒙爱的人啊
  rationale: 这是复数呼格形容词，用作亲切称呼。“蒙爱的人”既表达他们是被爱的人，也保留了本节ἀγαπ-词族反复出现的修辞联系；“啊”自然标示呼语。
- source_word: ἀγαπῶμεν ἀλλήλους
  choice: 让我们彼此相爱
  rationale: 第一人称复数现在时虚拟语气在此表示劝勉。“让我们”自然传达劝勉语气，“彼此相爱”准确表达相互关系；不把现在时体明确扩展为“不断相爱”。
- source_word: ὅτι ἡ ἀγάπη ἐκ τοῦ θεοῦ ἐστιν
  choice: 因为爱源于神
  rationale: ὅτι说明劝勉的理由；ἐκ表示来源。“源于神”以简洁、自然的现代汉语清楚表达爱的来源。
- source_word: πᾶς ὁ ἀγαπῶν
  choice: 凡爱别人的人
  rationale: πᾶς加名词化分词泛指所有具有这一行为的人。希腊文未明说爱的对象，汉语补出语境中自然隐含的“别人”，避免“凡爱的人”可能被误解为“所有可爱的人”，但不把它技术化为某种固定身份。
- source_word: ἐκ τοῦ θεοῦ γεγέννηται
  choice: 都是从神生的
  rationale: 完成时被动语态表达已经发生且结果仍然有效的出生。“从神生的”保留神是来源以及被动含义；“都是”与前面的“凡”配合，表达普遍陈述。
- source_word: γινώσκει τὸν θεόν
  choice: 也认识神
  rationale: 现在时直陈语气直接描述持续的认识。“认识神”保留约翰文本中关系性的陈述，不增添“开始认识”等原文未明确表达的起始意味。
theological_decisions:
- issue: 爱、从神而生与认识神之间的关系
  choice: 直接保留三者的紧密关联，把爱人的人描述为已经从神而生并认识神。
  alternative: 将本句扩展为某一特定救恩次序的技术性证明，或把它弱化为与重生无关的一般伦理劝告。
  rationale: 原文明确把爱、从神而生和认识神相连，却没有在本节说明完整的因果次序或系统神学框架；译文既不增添，也不削弱这一张力。
- issue: ἀγαπ-词族的重复
  choice: 以“蒙爱”“相爱”“爱”尽可能重现同一词族的修辞联系。
  alternative: 把称呼译作“亲爱的朋友们”，使其与后文的“爱”失去明显联系。
  rationale: 本节的文学与神学重点建立在ἀγαπ-词族的反复上；汉语应在自然可懂的前提下尽量保留。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“蒙爱的人啊”略带书面呼语色彩，以保留原文的亲切称呼和“爱”字词族联系；正文使用短句，避免古雅或宗派化术语。
