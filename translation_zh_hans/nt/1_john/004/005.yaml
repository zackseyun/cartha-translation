  text: αὐτοὶ ἐκ τοῦ κόσμου εἰσίν· διὰ τοῦτο ἐκ τοῦ κόσμου λαλοῦσιν καὶ ὁ κόσμος αὐτῶν ἀκούει.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/005.yaml
  text: They are from the world[a]; for this reason they speak from the world[b], and the world listens to them.
translation:
  language: zh_hans
  text: 他们是出于世界的[a]；所以他们所讲的话也出于世界[b]，世界也听他们的话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“他们属世界……他们讲论世界的事”。希腊文两次使用“从世界而来”的表达，着重说明来源或根源。
    reason: lexical_alternative
  - marker: b
    text: 这里的“世界”指与上帝相对立的人类秩序，并非指受造的宇宙本身。
    reason: cultural_note
lexical_decisions:
- source_word: αὐτοὶ
  choice: 他们
  rationale: 指上文的假先知，并与下一节的“我们”形成对比。现代汉语无需另加“他们自己”，以免造成不必要的强调。
- source_word: ἐκ τοῦ κόσμου
  choice: 出于世界
  rationale: ἐκ表示来源或归属根源；“出于世界”既保留这种来源含义，也保留约翰文本中反复出现的“世界”这一关键词。
- source_word: κόσμος
  choice: 世界
  rationale: 此处指与上帝相对立的人类秩序，而非受造宇宙本身。正文保留简洁而富有神学张力的“世界”，不扩写为解释性的“世界体系”。
- source_word: διὰ τοῦτο
  choice: 因此
  rationale: 明确承接前句：他们的来源决定了他们所讲之话的来源。
- source_word: λαλοῦσιν
  choice: 他们所讲的
  rationale: 现在时在此具有一般、惯常意义。译作“所讲的”适合汉语表达，也使“出于世界”自然地说明其话语的来源。
- source_word: ἐκ τοῦ κόσμου λαλοῦσιν
  choice: 他们所讲的也出于世界
  rationale: 保留第二次ἐκ τοῦ κόσμου所强调的来源，并以“也”呈现原文前后呼应的修辞结构。
- source_word: ὁ κόσμος αὐτῶν ἀκούει
  choice: 世界就听从他们
  rationale: ἀκούω在此不只是听见声音，而是接受、响应其言论；“听从”传达这种接纳意味。保留“世界”作拟人化主语，以维持原文的重复和张力。
theological_decisions:
- issue: κόσμος在约翰神学中的含义
  choice: 指与上帝相对立、疏离的人类秩序
  alternative: 指物质宇宙，或中性意义上的全人类
  rationale: 上下文将“出于上帝”与“出于世界”相对照，焦点是属灵和道德来源及其彼此接纳。正文仍译作“世界”，由脚注澄清，避免把解释直接写入经文。
- issue: αὐτοὶ的强调作用
  choice: 正文译作“他们”，不另加“自己”
  alternative: 译作“他们自己”或“这些人”
  rationale: 希腊文代词具有一定对比作用，但上下文已足以呈现与下一节“我们”的对照；显译为“他们自己”在现代汉语中容易显得强调过度。
- issue: ὁ κόσμος作为拟人化主语
  choice: 保留“世界就听从他们”
  alternative: 译作“世人就听从他们”或“世界上的人就听从他们”
  rationale: “世人”较自然，却会削弱原文三次使用κόσμος的关键词重复。保留拟人表达，可呈现原文把“世界”视为统一敌对秩序的修辞效果。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“出于世界”略带书面色彩，但能准确保留来源含义；“世界就听从他们”保留原文的拟人化及κόσμος的三重重复。所有脚注标记均已置于正文。
