  rationale: 修订仅收窄两处正文的解释性强化：“听我们”忠实呈现ἀκούει，同时由脚注交代其接受见证的语境含义；“由此我们就知道”保留γινώσκομεν的陈述语气及与“认识”的词汇呼应。脚注锚点仍分别置于相关词句之后，结构完整。
