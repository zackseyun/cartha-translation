source:
  edition: SBLGNT
  text: ἡμεῖς ἐκ τοῦ θεοῦ ἐσμεν· ὁ γινώσκων τὸν θεὸν ἀκούει ἡμῶν, ὃς οὐκ ἔστιν ἐκ τοῦ θεοῦ οὐκ ἀκούει ἡμῶν. ἐκ τούτου γινώσκομεν τὸ πνεῦμα τῆς ἀληθείας καὶ τὸ πνεῦμα τῆς πλάνης.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/006.yaml
  text: We are from God[a]. The one who knows God listens to us; whoever is not from God does not listen to us[c][b]. By this we know the Spirit of truth and the spirit of error.
translation:
  language: zh_hans
  text: 我们是出于上帝的。认识上帝的人听我们[a]；不出于上帝的人不听我们。由此我们就知道真理之灵[b][c]和谬误之灵。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“听见我们”。希腊语动词可以指“听见”，但这里很可能含有愿意听取并接受使徒见证的意思。本节下文同。
    reason: lexical_alternative
  - marker: b
    text: “真理之灵”在约翰著作中通常指圣灵；这里也可较一般地理解为“真理的灵”。
    reason: alternative_reading
  - marker: c
    text: 参约翰福音14:17；15:26；16:13。
    reason: cross_reference
lexical_decisions:
- source_word: ἐκ τοῦ θεοῦ
  choice: 出于上帝
  rationale: 保留ἐκ所表达的来源、归属根源之意，也维持本节两处鲜明的对照。
- source_word: ὁ γινώσκων τὸν θεόν
  choice: 认识上帝的人
  rationale: 以通顺的汉语表达名词性现在分词所具有的一般、特征性含义；“认识”也适合约翰著作中关系性的认知语境。
- source_word: ἀκούει ἡμῶν
  choice: 听从我们
  rationale: 此处不只是听见声音，而是愿意听取并接受使徒见证；“听从”表达回应性的聆听，同时不强化为完全“顺服”。
- source_word: ἐκ τούτου
  choice: 由此
  rationale: 自然表达根据前述准则作出辨认或判断的推论关系。
- source_word: γινώσκομεν
  choice: 就能辨认
  rationale: 基本义是“知道、认识”，但在检验诸灵的上下文中具有识别之意；“辨认”使现代读者清楚看出这里是在分辨两种灵。
- source_word: τὸ πνεῦμα τῆς ἀληθείας
  choice: 真理之灵
  rationale: 保留属格结构的简洁与可能范围；在约翰语境中很可能指圣灵，但正文不加入原文没有的“圣”字。
- source_word: τὸ πνεῦμα τῆς πλάνης
  choice: 谬误之灵
  rationale: πλάνη可指错误、迷惑或使人偏离真理；“谬误”与“真理”构成清楚对照，同时没有过度限定为某一种欺骗方式。
theological_decisions:
- issue: “真理之灵”是否明确指圣灵
  choice: 正文译作“真理之灵”，脚注说明在约翰著作中通常指圣灵
  alternative: 真理的圣灵；较一般意义的真理之灵
  rationale: 上下文论及察验诸灵，且约翰福音多次以“真理的灵”称圣灵，因此圣灵是很可能的所指；不过希腊文本本身没有在此另加“圣”字，汉语又无法用大小写显示解释差异，故正文保留原结构并以脚注交代。
- issue: ἀκούει ἡμῶν是单指听见，还是指接受使徒见证
  choice: 听从我们
  alternative: 听我们；听见我们所说的
  rationale: 本节以人对“我们”之见证的回应作为辨别准则，语境所指超过单纯听觉行为；“听从”传达接纳性的聆听，却不直接译成更强的“服从”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“出于上帝”保留来源含义；“真理之灵／谬误之灵”形成对称，并保留原文关于“灵”之所指的张力。脚注标记均置于相关词句之后。
