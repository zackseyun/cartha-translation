id: 1JN.4.4
reference: 1 John 4:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὑμεῖς ἐκ τοῦ θεοῦ ἐστε, τεκνία, καὶ νενικήκατε αὐτούς, ὅτι μείζων ἐστὶν ὁ ἐν ὑμῖν ἢ ὁ ἐν τῷ κόσμῳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/004.yaml
  text: You are from God[a], little children, and you have overcome them[b], because the one who is in you is greater than the one who is in the world.
translation:
  language: zh_hans
  text: 孩子们，你们是出于神的，已经胜过他们[a]；因为在你们里面的那一位，比在世上的那一位更大[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他们”指上文提到的假先知等敌对者。
    reason: cross_reference
  - marker: b
    text: 希腊文没有明说二者的身份；按上下文，前者可能指神或他的灵，后者可能指在世界背后活动的恶者。
    reason: alternative_reading
lexical_decisions:
- source_word: ὑμεῖς
  choice: 你们
  rationale: 希腊文明确使用代词并带有强调；汉语把“你们”置于判断句中，并配合呼语“孩子们”，自然地保留这种直接强调。
- source_word: ἐκ τοῦ θεοῦ
  choice: 是出于神的
  rationale: ἐκ 表示来源，也包含由此而有的归属关系。“出于神”保留约翰书信中的来源对比，又不把含义缩窄为单纯的身份标签。
- source_word: τεκνία
  choice: 孩子们
  rationale: 这是约翰带着亲爱之情对信徒的称呼。“孩子们”在现代汉语中自然、亲切；“小孩子们”容易被误解为专指年龄幼小者。
- source_word: νενικήκατε
  choice: 已经胜过了
  rationale: 完成时表达已经取得且结果持续的胜利。“已经胜过了”既保留完成意味，也符合现代汉语表达。
- source_word: αὐτούς
  choice: 他们
  rationale: 保留原文代词的回指，不在正文中擅自把所指明说为假先知、敌对者或邪灵。
- source_word: ὅτι
  choice: 因为
  rationale: 此处引出信徒得胜的原因，“因为”在现代汉语中清楚自然。
- source_word: μείζων
  choice: 更大
  rationale: 原词含义广于力量强弱；“更大”保留其宽广比较意义，不收窄为“更强”或“更有能力”。
- source_word: ὁ ἐν ὑμῖν
  choice: 那在你们里面的
  rationale: 原文以冠词加介词短语把所指者人格化，但未明说其身份；此译保留这种隐含表达。
- source_word: ὁ ἐν τῷ κόσμῳ
  choice: 那在世上的
  rationale: 与前一句形成对称，并保留原文没有直接点明所指者身份的特点。
- source_word: κόσμῳ
  choice: 世上
  rationale: “世上”在此处比“世界里面”更自然，同时保留 κόσμος 的基本意象；不在正文中解释为敌对神的世界体系。
theological_decisions:
- issue: “那在你们里面的”与“那在世上的”分别指谁
  choice: 正文保留两者隐含的身份，只译为“那在你们里面的”和“那在世上的”。
  alternative: 把前者明确译为神或圣灵，把后者明确译为魔鬼或那恶者。
  rationale: 上下文强烈暗示前者是神或他的灵，后者是支配敌对世界的那恶者；但希腊文没有直接说出这些名称。保留隐含表达可避免在译文正文中消除原有的修辞张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“孩子们”保留牧者式的亲切称呼；整句维持原文的对称结构与神学含蓄性。
