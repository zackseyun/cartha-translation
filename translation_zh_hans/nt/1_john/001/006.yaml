  text: ἐὰν εἴπωμεν ὅτι κοινωνίαν ἔχομεν μετ’ αὐτοῦ καὶ ἐν τῷ σκότει περιπατῶμεν, ψευδόμεθα καὶ οὐ ποιοῦμεν τὴν ἀλήθειαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/006.yaml
  text: If we say that we have fellowship with him and yet walk in the darkness[b][a], we are lying and are not practicing the truth.
translation:
  language: zh_hans
  text: 我们若说与他相交，却在黑暗中[a]行走，我们就是说谎，也不实行真理[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在黑暗里。”希腊文作“在那黑暗中”；在约翰的用法中，这可能强调与神相对的道德—属灵领域。
    reason: lexical_alternative
  - marker: b
    text: 直译：“不做真理。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν εἴπωμεν
  choice: 我们若说
  rationale: 保留第三类条件句的条件语气；“若说”自然、庄重，又不额外加入“声称”所带的质疑色彩。
- source_word: κοινωνίαν ἔχομεν
  choice: 自己与他相交
  rationale: “相交”保留 κοινωνία 的关系与共享含义，也符合现代中文圣经语体；加入“自己”使“我们说”之后的内容更自然，但不改变所指。
- source_word: μετ’ αὐτοῦ
  choice: 与他
  rationale: 照原文保留代词，不把上下文中的所指直接扩写为“神”。
- source_word: ἐν τῷ σκότει
  choice: 在黑暗中
  rationale: 汉语不用冠词，无法形式对应希腊文定冠词；“黑暗”仍保留约翰著作中与神相对的道德—属灵领域意象。
- source_word: περιπατῶμεν
  choice: 行走
  rationale: 保留以行走比喻生活方式的原文意象；“行事为人”虽更解释性，“行走”则较直接，并可由脚注说明。
- source_word: ψευδόμεθα
  choice: 就是在说谎
  rationale: 用进行性的“在说谎”体现现在时的持续状态，并以“就是”自然连接条件句的结论。
- source_word: οὐ ποιοῦμεν τὴν ἀλήθειαν
  choice: 也没有行出真理
  rationale: 原文直译为“不做真理”。“行出真理”既保留 ποιεῖν 的实践性，又比“实行真理”稍能显出这一约翰式表达的具体动作感。
theological_decisions:
- issue: 黑暗的道德—属灵隐喻
  choice: 保留“在黑暗中行走”
  alternative: 活在罪中；过着黑暗的生活
  rationale: 约翰语境中的“黑暗”兼有邪恶、虚假以及与神隔绝等含义。保留隐喻，不把它缩减为单一的教义解释。
- issue: “行真理”的实践含义
  choice: 行出真理
  alternative: 实行真理；按真理生活；不做真理
  rationale: 保留真理不只是言语或观念、也要落实于行动的张力，同时避免把这一独特短语过度解释成某一具体伦理体系。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“相交”“黑暗”“行走”“真理”等关键词保留约翰文本的关系性与象征性。“仍”表达 καί 在此语境中的逆接意味，使中文自然；脚注仅解释隐喻和直译，不消解原文的神学张力。
