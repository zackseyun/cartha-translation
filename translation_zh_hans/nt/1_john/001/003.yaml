  text: ὃ ἑωράκαμεν καὶ ἀκηκόαμεν ἀπαγγέλλομεν ⸀καὶ ὑμῖν, ἵνα καὶ ὑμεῖς κοινωνίαν ἔχητε μεθ’ ἡμῶν· καὶ ἡ κοινωνία δὲ ἡ ἡμετέρα μετὰ τοῦ πατρὸς καὶ μετὰ τοῦ υἱοῦ αὐτοῦ Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/003.yaml
  text: What we have seen and heard we also proclaim to you[a], so that you too may have fellowship with us; and indeed our fellowship is with the Father and with his Son[b], Jesus the Messiah.
translation:
  language: zh_hans
  text: 我们把所看见、所听见的，也宣告给你们，为要使你们也能与我们相交[a]；而且，我们的相交是与父和他的儿子耶稣弥赛亚[b]相交。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “相交”也可译作“团契”“相通”“共享”或“参与”，强调共同分享的生命与关系。
    reason: lexical_alternative
  - marker: b
    text: “弥赛亚”也可译作“基督”；希腊语Χριστός是“受膏者”的称号。
    reason: alternative_rendering
lexical_decisions:
- source_word: ὃ ἑωράκαμεν καὶ ἀκηκόαμεν
  choice: 我们所看见、所听见的
  rationale: 以“所……的”保留中性关系代词ὃ的宽泛指向，不擅自改为人格化的“那一位”；两个完成时表达亲历见证至今仍有效，汉语无需另加时态助词。
- source_word: ἀπαγγέλλομεν καὶ ὑμῖν
  choice: 也宣告给你们
  rationale: “宣告”表达把亲眼亲耳见证的事郑重传报出来；“也”体现καί，表明受众同样领受这宣告。
- source_word: ἵνα καὶ ὑμεῖς
  choice: 为要使你们也能
  rationale: 清楚表达ἵνα的目的意味，并以“能”自然呈现从属动词的虚拟语气，不把结果说成已经实现。
- source_word: κοινωνίαν ἔχητε μεθ’ ἡμῶν
  choice: 与我们相交
  rationale: “相交”同时涵盖关系、共享和参与，比单纯“交往”更能承载κοινωνία的丰富含义，又不限定为某种礼仪。
- source_word: καὶ ἡ κοινωνία δὲ ἡ ἡμετέρα
  choice: 而且，我们的相交确实
  rationale: “而且”呈现καί与δέ在此处的推进和说明作用，“确实”传达原句的强调语气。
- source_word: μετὰ τοῦ πατρὸς
  choice: 与父
  rationale: “父”在约翰语境中是对上帝的称谓；汉语无需添加原文没有的“上帝”二字。
- source_word: μετὰ τοῦ υἱοῦ αὐτοῦ
  choice: 和他的儿子
  rationale: 直接保留父子关系及αὐτοῦ的所属意义。
- source_word: Ἰησοῦ Χριστοῦ
  choice: 耶稣弥赛亚
  rationale: Χριστός在这里与“耶稣”同位，并保有称号意义；译为“弥赛亚”显明其“受膏者”称号，而非把它无声处理为固定姓名的一部分。
theological_decisions:
- issue: κοινωνία的关系性与参与性
  choice: 相交
  alternative: 团契、相通、共享、参与
  rationale: “相交”既可描述信徒与见证群体的共同关系，也可描述他们与父及子的共同关系，保留关系、共享和参与之间的神学张力。
- issue: Χριστοῦ作为称号还是姓名式表达
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处“耶稣”与Χριστός构成同位表达；采用“弥赛亚”保留称号的可理解意义，同时在脚注列出传统译法“基督”。
- issue: “我们的相交”与父及子的关系
  choice: 我们的相交确实是与父和他的儿子……相交
  alternative: 我们确实与父和他的儿子……相交
  rationale: 重复“相交”以保留原文以ἡ κοινωνία为主语的结构，不把它简化为仅仅描述个人交往的句子。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“我们把……也宣告给你们”避免过度古雅；保留“相交”以承载原文的关系性和参与性。分号呈现目的从句之后的解释推进，末尾重复“相交”使原文结构及神学重心清楚。
