  text: καὶ ἡ ζωὴ ἐφανερώθη, καὶ ἑωράκαμεν καὶ μαρτυροῦμεν καὶ ἀπαγγέλλομεν ὑμῖν τὴν ζωὴν τὴν αἰώνιον ἥτις ἦν πρὸς τὸν πατέρα καὶ ἐφανερώθη ἡμῖν—
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/002.yaml
  text: and the life was revealed[a], and we have seen and testify and proclaim to you the eternal life[b], which was with the Father and was revealed to us—
translation:
  language: zh_hans
  text: 这生命已经显现[a]；我们已经看见，也作见证，并向你们传扬那永恒的生命[b]；这生命原与父同在，也已经向我们显现——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “显现”也可译作“显明”或“彰显”。原文指原先未显明的，如今显露出来。
    reason: lexical_alternative
  - marker: b
    text: 原文在语法上说“那永恒的生命”；结合上下文，这称呼指向那位原与父同在、又向“我们”显现的圣子。
    reason: cross_reference
lexical_decisions:
- source_word: ἡ ζωὴ / τὴν ζωὴν
  choice: 这生命 / 那永恒的生命
  rationale: 首次用“这生命”承接上文并体现定指；后文用“那永恒的生命”保留重复及同位说明的力量，不直接改写为“他”或“圣子”。
- source_word: ἐφανερώθη
  choice: 显现出来
  rationale: 既可表达原先未显明者变得可见、可知，也自然体现不定过去时被动式；同一词在本节两次采用相同译法。
- source_word: ἑωράκαμεν
  choice: 我们已经看见了
  rationale: 用“已经”体现完成时所指的既成亲眼经历，并让其持续的见证意义由下文自然呈现。
- source_word: μαρτυροῦμεν
  choice: 现在作见证
  rationale: “作见证”准确保留证人陈述的含义；补出“现在”以自然表达希腊文由完成时转入现在时的推进，而不增加新的命题。
- source_word: ἀπαγγέλλομεν
  choice: 传给
  rationale: 在此语境中表示把亲眼所见郑重地告知受众；“传给”现代、自然，并与“作见证”有适当区分。
- source_word: τὴν ζωὴν τὴν αἰώνιον
  choice: 那永恒的生命
  rationale: 用“那”体现希腊文的定指结构，同时避免汉语中“这生命，那永恒的生命”连续出现时过于生硬；“永恒”表达 αἰώνιος 的持续性质。
- source_word: ἥτις
  choice: 这生命
  rationale: 汉语不宜用无生命关系代词生硬承接，故重复名词；仍按语法先行词“生命”来表达，没有直接个人化为“他”。
- source_word: ἦν πρὸς τὸν πατέρα
  choice: 原与父同在
  rationale: “与父同在”自然表达关系与临在；“原”简洁体现未显现之前已经如此的背景状态，并呼应约翰文献的措辞。
- source_word: τὸν πατέρα
  choice: 父
  rationale: 在明确的神学语境中，“父”作为对上帝的称谓，无须增译“天父”或“父神”。
- source_word: ἡμῖν
  choice: 向我们
  rationale: 与“显现出来”搭配自然，并明确使徒群体是显现和亲见的接受者。
theological_decisions:
- issue: “生命”是否直接人格化为圣子
  choice: 正文保留“这生命 / 那永恒的生命”
  alternative: 译为“他”，或直接增译“圣子”
  rationale: 希腊文使用阴性名词 ζωή 及与之呼应的关系代词，虽在语境中指向圣子，却没有在本句直接用阳性人称代词或名称；保留名词可维护约翰表达中的人格指向与概念张力。
- issue: πρὸς τὸν πατέρα 所表达的先存与关系
  choice: 原与父同在
  alternative: 在父面前；朝向父
  rationale: “与父同在”既忠实表达 πρὸς 在此处的关系性用法，也以自然中文保留先存意味，而不扩写为教义性释义。
- issue: “永恒的生命”中的 αἰώνιος 译法
  choice: 永恒的生命
  alternative: 永生
  rationale: “永生”更凝练且传统，但容易主要被理解为信徒所得的无尽生命；“永恒的生命”在此更清楚保留修饰定指“生命”的结构及其人格性语境。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。保留本节与上下文相连的破折号，并用分号、句号梳理希腊文连续并列结构。所有脚注标记均置于相关正文之后。
