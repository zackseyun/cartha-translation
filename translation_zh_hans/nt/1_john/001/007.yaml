  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐὰν δὲ ἐν τῷ φωτὶ περιπατῶμεν ὡς αὐτός ἐστιν ἐν τῷ φωτί, κοινωνίαν ἔχομεν μετ’ ἀλλήλων καὶ τὸ αἷμα ⸀Ἰησοῦ τοῦ υἱοῦ αὐτοῦ καθαρίζει ἡμᾶς ἀπὸ πάσης ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/007.yaml
  text: But if we walk in the light[a], as he himself is in the light, we have fellowship with one another[b], and the blood of Jesus his Son cleanses us from every sin.
translation:
  language: zh_hans
  text: 但我们若行在光中，正如他自己在光中，就彼此相交[a]；他儿子耶稣的血也洁净我们，脱离一切罪[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些解经者把“彼此相交”理解为信徒与上帝相交；不过，希腊语中的相互代词更自然地指信徒彼此之间的相交。
    reason: alternative_reading
  - marker: b
    text: “一切罪”也可理解为“每一样罪”；希腊语既可作集合性理解，也可作分配性理解。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ
  choice: 但……若
  rationale: δέ承接上一节并形成对比；“但……若”自然保留转折和条件关系。
- source_word: ἐν τῷ φωτὶ
  choice: 在光中
  rationale: 保留约翰文本中具有主题意义的“光”这一意象，不将其解释性改写为某种生活方式。
- source_word: περιπατῶμεν
  choice: 我们……行
  rationale: 保留“行走”所表达的生活与行为隐喻；中文“行在……”庄重而可懂，也能表达持续性的生活实践。
- source_word: ὡς αὐτός ἐστιν ἐν τῷ φωτί
  choice: 如同他在光中
  rationale: “如同”保留比较关系；中文无需另加“他自己”，上下文已能体现显明主语αὐτός的作用。
- source_word: κοινωνίαν ἔχομεν
  choice: 我们……相交
  rationale: “相交”在此表达共同参与和关系上的团契，既简洁自然，也避免加入圣礼性的限定。
- source_word: μετ’ ἀλλήλων
  choice: 彼此
  rationale: ἀλλήλων是相互代词，“彼此”最自然地表达群体成员之间的相互关系，同时以脚注保留另一种解释。
- source_word: τὸ αἷμα Ἰησοῦ τοῦ υἱοῦ αὐτοῦ
  choice: 他儿子耶稣的血
  rationale: 按希腊语所属关系译出耶稣是“他的儿子”，并让“血”继续作洁净行动的主语。
- source_word: καθαρίζει
  choice: 洁净
  rationale: “洁净”兼顾道德与礼仪层面的含义；一般现在时不额外扩写为“不断洁净”，但可自然表示持续或恒常的作用。
- source_word: ἀπὸ πάσης ἁμαρτίας
  choice: 使我们脱离一切罪
  rationale: 用自然汉语保留καθαρίζει ἡμᾶς ἀπό的结构意义，即洁净“我们”而使我们脱离罪；“一切罪”也保留集合性与分配性之间的可能理解。
theological_decisions:
- issue: μετ’ ἀλλήλων（彼此）的所指
  choice: 信徒彼此之间相交
  alternative: 信徒与上帝相交
  rationale: 相互代词ἀλλήλων通常指群体成员之间的相互关系；第三节虽明确谈到与父和他儿子的相交，本句仍以“彼此”最自然。脚注保留另一种解释，不把上下文中的神人相交排除在整体神学之外。
- issue: καθαρίζει现在时的力度
  choice: 以一般现在时“洁净”表达持续或恒常的作用
  alternative: 明确译为“不断洁净”或理解为一次性的洁净
  rationale: 希腊语现在时在这里可表达持续或特征性的行动，但正文不宜用“不断”强化其体貌，也不应改成一次性的过去行动。
- issue: πάσης ἁμαρτίας的范围
  choice: 一切罪
  alternative: 每一样罪
  rationale: 单数ἁμαρτίας与πάσης搭配，既可作集合性理解，也可作分配性理解；正文采用自然且包容两者的“一切罪”，脚注说明其歧义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“行在光中”保留原文核心隐喻；“彼此相交”沿用简洁、可理解的基督教语汇。“洁净我们，使我们脱离一切罪”较逐字式的“从一切罪洁净我们”更符合现代汉语，同时保留原文以“我们”为洁净对象的语义。
