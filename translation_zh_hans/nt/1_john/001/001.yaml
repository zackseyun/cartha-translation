  naturalness: 原译前半段自然、庄重。“这一切都是关于……”虽通顺，却既削弱原文的未完句式，也使“关于生命之道”与前列关系从句的关系被过度确定。将“关于生命之道”前置，中文更自然，并可用句末破折号保留原文悬接。
  terminology: “生命之道”可保留λόγος的“道／信息”张力及约翰文献的回响，不宜在正文资本化或明确等同于圣子。脚注a原称“也可译作‘那从起初就有的一切’”并非对英文审计轨迹所列替代读法的准确说明；应改为说明可人格化译作“那一位”，同时指出正文保留中性、宽泛所指。
