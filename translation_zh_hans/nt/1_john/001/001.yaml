  to: 关于生命之道[b]——那从起初就有的[a]，我们所听见的、亲眼看见的、仔细观看过的，并且亲手触摸过的——
  rationale: 修订将“关于生命之道”前置，以符合现代汉语表达，同时删除原文未明说的“这一切都是”，并以句末破折号保留本节须由下一节完成的悬接句法。所有见证动词及其递进均予保留；脚注b移至所说明的术语之后，脚注a改正替代读法的说明。
