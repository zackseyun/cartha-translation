id: 1JN.1.1
reference: 1 John 1:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ὃ ἦν ἀπ’ ἀρχῆς, ὃ ἀκηκόαμεν, ὃ ἑωράκαμεν τοῖς ὀφθαλμοῖς ἡμῶν, ὃ ἐθεασάμεθα καὶ αἱ χεῖρες ἡμῶν ἐψηλάφησαν, περὶ τοῦ λόγου τῆς ζωῆς—
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/001.yaml
  text: What was from the beginning[a], what we have heard, what we have seen with our eyes, what we looked upon and our hands have touched[b], concerning the word of life—
translation:
  language: zh_hans
  text: 关于生命之道[b]——那从起初就有的[a]，我们所听见的、亲眼看见的、仔细观看过的，并且亲手触摸过的——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可按上下文人格化地译作“那从起初就有的那一位”。希腊文使用中性关系代词，可能宽泛地指使徒关于圣子的见证，而未直接称为“他”。
    reason: alternative_reading
  - marker: b
    text: “生命之道”也可理解为“生命的信息”。这里的“道”可能指圣子本人，与《约翰福音》1:1相呼应；也可能指关于他、带来生命的信息。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὃ / ὃ
  choice: 那……的／所……的
  rationale: 希腊文反复使用中性关系代词，所指范围可涵盖关于圣子的整全见证，而不只是直接以男性人称指称他。中文采用名词化的“那……的”与“所……的”，既自然，也避免擅自译成“那一位”。
- source_word: ἦν ἀπ’ ἀρχῆς
  choice: 从起初就有
  rationale: 保留约翰文献中“从起初”的措辞，并以“就有”自然表达未完成时所呈现的持续存在，不额外限定“起初”具体指何时。
- source_word: ἀκηκόαμεν
  choice: 我们所听见的
  rationale: 中文通常不以形态标示希腊文完成时；“所听见的”在这一见证语境中自然包含过去经历及其现今效力。
- source_word: ἑωράκαμεν τοῖς ὀφθαλμοῖς ἡμῶν
  choice: 亲眼看见的
  rationale: “亲眼”完整而自然地保留“用我们的眼睛”的强调，突出目击见证。
- source_word: ἐθεασάμεθα
  choice: 仔细观看过的
  rationale: θεάομαι 不只是偶然看见，也可表示专注观看；“仔细观看过”与前面的“亲眼看见”形成有意义的递进，并保留其过去经验。
- source_word: αἱ χεῖρες ἡμῶν ἐψηλάφησαν
  choice: 我们的手触摸过的
  rationale: ψηλαφάω 表示触摸、摸索或亲手察验；“触摸过”是现代中文中清楚而不夸张的表达，保留见证的实体性。
- source_word: περὶ
  choice: 关于
  rationale: περὶ 引出前述见证的主题；中文“关于”比“论到”更现代自然，同时仍适合庄重文体。
- source_word: τοῦ λόγου τῆς ζωῆς
  choice: 生命之道
  rationale: λόγος 可指话语、信息，也可能带有对圣子本人的指涉。“道”能保留约翰文献的互文回响，同时“生命之道”也可自然理解为关乎生命的信息，因而不把歧义完全消除。
theological_decisions:
- issue: 中性关系从句的所指
  choice: 译作“那从起初就有的……这一切”，不直接译为“那一位”或“他”
  alternative: 译作“那从起初就有的那一位”
  rationale: 上下文具有明确的基督论方向，但希腊文使用中性关系代词，可能统摄使徒关于圣子所听、所见、所触摸的一切见证。主文保留这种宽广所指，不将语法形式过早人格化。
- issue: λόγος τῆς ζωῆς 是圣子本人还是关于生命的信息
  choice: 译作“生命之道”，并以脚注说明双重可能
  alternative: 明确译作“生命的信息”或“生命的道（即圣子）”
  rationale: 原文可使读者同时联想到成为肉身的“道”与使徒所传扬的生命信息。中文“道”可承载这种互文与张力，而脚注防止读者误以为译文已经排除其中一种理解。
- issue: 本节未完句式
  choice: 以破折号结尾，保留与后续经文相连的序言结构
  alternative: 在本节内补成独立完整句
  rationale: 希腊文在本节末以 περὶ 短语延续，并由后文完成主干。保留破折号可反映原文悬宕结构，不擅自补足本节。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。以“亲眼看见—仔细观看—亲手触摸”的递进体现见证的具体性；避免古雅的“目睹、瞻仰、亲手摸过”等表达。主文保留原文长串并列及末尾悬接结构，同时加入“这一切都是”作为中文句法支架，使“关于生命之道”与前述整体清楚衔接而不改变所指范围。
