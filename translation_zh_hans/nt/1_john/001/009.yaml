  text: ἐὰν ὁμολογῶμεν τὰς ἁμαρτίας ἡμῶν, πιστός ἐστιν καὶ δίκαιος ἵνα ἀφῇ ἡμῖν τὰς ἁμαρτίας καὶ καθαρίσῃ ἡμᾶς ἀπὸ πάσης ἀδικίας.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/009.yaml
  text: If we confess our sins[a], he is faithful and righteous to forgive us our sins and to cleanse us from all unrighteousness.
translation:
  language: zh_hans
  text: 我们若承认自己的罪，他是信实、公义的[a]，必赦免我们的罪，洗净我们，使我们脱离一切不义。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “公义的”也可译作“公正的”。
    reason: 保留δίκαιος在此处“公义／公正”的真实词义幅度，避免将神的品格仅作单一方向的解释。
lexical_decisions:
- source_word: ἐὰν
  choice: 若
  rationale: 引出带条件意味的从句；“若”自然、庄重，并保留原文的条件性，不把它强化为每逢如此。
- source_word: ὁμολογῶμεν
  choice: 我们承认
  rationale: 在罪的语境中，ὁμολογέω指承认、坦认；“承认”清楚表达对自己的罪不否认，并避免使用对部分现代读者可能偏礼仪化的措辞。
- source_word: τὰς ἁμαρτίας ἡμῶν
  choice: 自己的罪
  rationale: 准确表达第一人称复数所属关系；在“我们”之后用“自己的罪”符合现代汉语习惯。
- source_word: πιστός
  choice: 信实
  rationale: 表达神可靠、忠于其品格与应许；“信实”是自然且具有经文语体尊严的对应词。
- source_word: δίκαιος
  choice: 公义
  rationale: 兼顾正直、公正及符合正义的广义内涵，不把词义仅限于司法层面的公平；“公正”作为可行译法收入脚注。
- source_word: ἵνα ἀφῇ
  choice: 必赦免
  rationale: 此处ἵνα加虚拟式承接“信实、公义”，说明由神的品格所保证的行动；“必”在汉语中自然表达确定结果，但不额外说明其神学机制。
- source_word: ἡμῖν τὰς ἁμαρτίας
  choice: 赦免我们的罪
  rationale: 按现代汉语习惯表达间接受词与直接受词，清楚保留“罪得赦免”的意思。
- source_word: καθαρίσῃ
  choice: 洗净
  rationale: 保留καθαρίζω除去污秽的形象，同时自然表达道德与属灵层面的洁净。
- source_word: ἀπὸ πάσης ἀδικίας
  choice: 一切的不义
  rationale: “不义”保留ἀδικία在约翰著作中涵盖不正、邪恶和错误行为的道德—神学广度；“一切”体现πάσης的全面性。
theological_decisions:
- issue: δίκαιος与神赦罪之间的关系
  choice: 公义
  alternative: 公正
  rationale: 经文把赦免和洗净置于神“信实、公义”的品格之中。“公义”能涵盖道德正直和秉行正义，不强行把此处收窄为法庭式公正；“公正”仍是真实的词义可能，故以脚注保留。
- issue: ἵνα所表达的逻辑关系
  choice: 用“必赦免……洗净……”表达由神品格所保证的结果
  alternative: 译作“为要赦免……并洗净……”
  rationale: 原文ἵνα在此可带目的或预期结果色彩。汉语直译“为要”容易暗示神之所以信实、公义只是为了实施赦免；采用“必”更自然地呈现确定关系，同时不进一步界定赦免与公义之间的教义机制。
translation_notes:
  register: 采用现代、简洁而庄重的普通话。句式保留原文的条件结构及“赦免／洗净”平行关系；“不义”虽略带经文语体色彩，但比“错误行为”更能保留原词的广度。脚注标记置于其实际所说明的“公义”之后。
