  yaml_path: translation/nt/1_john/001/004.yaml
  text: And we are writing these things so that our joy may be complete[a].
translation:
  language: zh_hans
  text: 我们写这些事，是要使我们的喜乐得以圆满[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“你们的喜乐”，而不是“我们的喜乐”。
    reason: textual_variant
lexical_decisions:
- source_word: καὶ
  choice: （不单独译出）
  rationale: 此处承接上文；现代汉语直接以“我们写这些事”起句更自然，句际连接关系仍由语境清楚表达。
- source_word: ταῦτα
  choice: 这些事
  rationale: 保留中性复数指示词的所指，指前述并正在写下的内容，也符合约翰文风。
- source_word: γράφομεν ἡμεῖς
  choice: 我们写
  rationale: γράφομεν是第一人称复数现在时，明说的ἡμεῖς带有一定强调；汉语用显式主语“我们”自然呈现，动词“写”也适合书信语境。
- source_word: ἵνα
  choice: 是要使
  rationale: 表达目的，同时不排除结果意味；在现代汉语中比生硬的“为了叫”更自然庄重。
- source_word: ἡ χαρὰ ἡμῶν
  choice: 我们的喜乐
  rationale: 按所给SBLGNT正文直译ἡμῶν为“我们的”；异文“你们的”另收入脚注。
- source_word: ᾖ πεπληρωμένη
  choice: 得到满足
  rationale: 该迂说结构由“是”的虚拟式和πληρόω的完成被动分词构成，强调喜乐达到充盈、圆满的状态；“得到满足”保留被动意味且为自然现代汉语。
theological_decisions:
- issue: ἡ χαρὰ ἡμῶν中的代词文本异文
  choice: 我们的喜乐
  alternative: 你们的喜乐
  rationale: 所给SBLGNT正文采用ἡμῶν（“我们的”），故正文据此翻译；抄本传统中的“你们的”具有释经意义，因此不在正文中调和，而以脚注保存。
- issue: 喜乐“得到满足”的施受关系
  choice: 得到满足
  alternative: 达到圆满／得以充满
  rationale: 保留πεπληρωμένη的被动形式和完成后持续状态，不明确补出使喜乐圆满的施事者，以免加入原文未明说的解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“这些事”保留原文复数；“是要使”清楚表达目的；脚注标记已置于相关正文句末。
