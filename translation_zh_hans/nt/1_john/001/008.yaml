id: 1JN.1.8
reference: 1 John 1:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐὰν εἴπωμεν ὅτι ἁμαρτίαν οὐκ ἔχομεν, ἑαυτοὺς πλανῶμεν καὶ ἡ ἀλήθεια ⸂οὐκ ἔστιν ἐν ἡμῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/008.yaml
  text: If we say that we have no sin[a], we deceive ourselves, and the truth is not in us.
translation:
  language: zh_hans
  text: 如果我们说自己没有罪[a]，就是在欺骗自己，真理也不在我们里面。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较具解释性地译作“没有罪性”；希腊原文直译为“没有罪”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν εἴπωμεν
  choice: 如果我们说
  rationale: ἐὰν加虚拟式构成条件句；“如果我们说”是自然、准确的现代汉语表达。
- source_word: ἁμαρτίαν οὐκ ἔχομεν
  choice: 自己没有罪
  rationale: 单数且不带冠词的ἁμαρτίαν在这里指人里面罪的存在，而非某一次犯罪行为；“没有罪”保留原文简洁且具有张力的说法。补出“自己”使汉语自然，并与后文反身代词呼应。
- source_word: ἑαυτοὺς πλανῶμεν
  choice: 就是在欺骗自己
  rationale: πλανάω与反身代词连用表示自欺；“欺骗自己”比“使自己迷失”更清楚自然。“就是”呈现条件句后果的直接判断。
- source_word: ἡ ἀλήθεια
  choice: 真理
  rationale: 既可涵盖上帝所启示的真理，也可带有真实、诚实的意味；不加解释，以保留约翰用语的丰富性。
- source_word: οὐκ ἔστιν ἐν ἡμῖν
  choice: 也不在我们里面
  rationale: 直译并自然保留ἐν的内在、个人性含义；“也”承接前一分句的并列关系。
theological_decisions:
- issue: “没有罪”所否认的内容
  choice: 译作“没有罪”，指否认人里面有罪这一事实
  alternative: “没有犯过罪”或“没有罪性”
  rationale: 原文是“有罪”（ἁμαρτίαν ἔχομεν），不同于本章10节所说“犯过罪”。“没有犯过罪”会混淆两处表达；“没有罪性”则比原文更具解释性。
- issue: “真理不在我们里面”的含义
  choice: 保留“真理也不在我们里面”
  alternative: “上帝的真理不在我们里面”或“我们并不诚实”
  rationale: 原文的紧凑表达可同时唤起客观真理与主观真实、诚实等含义；不扩写，以免消解其神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“在我们里面”略带经文语体，但在现代中文中仍清楚自然，并准确保留约翰著作的内在性表达。
