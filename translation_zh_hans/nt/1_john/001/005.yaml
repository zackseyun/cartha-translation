id: 1JN.1.5
reference: 1 John 1:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ ἔστιν αὕτη ἡ ἀγγελία ἣν ἀκηκόαμεν ἀπ’ αὐτοῦ καὶ ἀναγγέλλομεν ὑμῖν, ὅτι ὁ θεὸς φῶς ἐστιν καὶ σκοτία ⸂ἐν αὐτῷ οὐκ ἔστιν⸃ οὐδεμία.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/005.yaml
  text: 'And this is the message that we have heard from him and announce to you: that God is light[a], and there is no darkness at all in him.'
translation:
  language: zh_hans
  text: 我们从他那里听见、又向你们宣告[a]的信息，就是这个：上帝是光，在他里面毫无黑暗。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “宣告”也可译作“传报”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγγελία
  choice: 信息
  rationale: “信息”自然地表达所领受并传出的内容，也适合书信语境；“宣告”则留给同源动词ἀναγγέλλομεν，以免中文重复生硬。
- source_word: ἀκηκόαμεν
  choice: 我们……听见
  rationale: 中文通常不以形态区分完成时；结合“从他那里”和后续“宣告”，已能表达先领受而今仍持守、传递的意味。
- source_word: ἀπ’ αὐτοῦ
  choice: 从他那里
  rationale: 保留原文代词，不擅自明确为“耶稣”或“圣子”，让所指由上下文判断。
- source_word: ἀναγγέλλομεν
  choice: 向你们宣告
  rationale: “宣告”体现把所领受的信息郑重传达给他人的意思；“传报”也可能，但现代中文中稍不常用。
- source_word: ὅτι
  choice: 就是这个：
  rationale: 以自然中文引出信息的具体内容，功能上对应ὅτι；冒号清楚标示下文即所宣告的信息。
- source_word: ὁ θεὸς φῶς ἐστιν
  choice: 上帝是光
  rationale: 直接保留无冠词谓语名词的质性隐喻，不增添“圣洁”“纯净”等解释。
- source_word: σκοτία
  choice: 黑暗
  rationale: 保留约翰著作中兼具形象性与道德、属灵含义的核心隐喻。
- source_word: ἐν αὐτῷ
  choice: 在他里面
  rationale: 直译其空间式隐喻，不将其缩减为单一抽象属性。
- source_word: οὐδεμία
  choice: 毫无
  rationale: “毫无黑暗”以简洁、自然的中文传达双重否定所形成的强烈强调。
theological_decisions:
- issue: “上帝是光”的隐喻
  choice: 原样保留“上帝是光”
  alternative: 上帝是圣洁的光／上帝充满光明
  rationale: 原文直接以“光”述说上帝的本质或属性，含义丰富；添加“圣洁”或改成“充满光明”都会缩窄或改变隐喻。
- issue: 代词αὐτοῦ的所指
  choice: 保留为“他”
  alternative: 明确译为“耶稣”或“圣子”
  rationale: 上下文可帮助读者判断所指，但本节原文本身使用代词；译文不代替作者消除这一指代上的含蓄。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“从他那里听见、又向你们宣告”保持领受与传递的平行关系；“毫无黑暗”自然传达原文末尾的强调。脚注标记置于其实际说明的动词“宣告”之后。
