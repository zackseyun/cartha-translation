source:
  edition: SBLGNT
  text: ἐὰν εἴπωμεν ὅτι οὐχ ἡμαρτήκαμεν, ψεύστην ποιοῦμεν αὐτὸν καὶ ὁ λόγος αὐτοῦ οὐκ ἔστιν ἐν ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/010.yaml
  text: If we say that we have not sinned[a], we make him a liar[b], and his word is not in us.
translation:
  language: zh_hans
  text: 如果我们说自己没有犯过罪[a]，我们就是把他当作说谎者，他的话也不在我们里面[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“没有犯过罪。”这里的希腊语用完成时，指已经发生并对现在仍有意义的事；不必理解为额外强调“从来没有”。
    reason: lexical_alternative
  - marker: b
    text: “他的话”也可译作“他的信息”。希腊语λόγος可有这两层意思；正文译作“话”，以保留约翰著作中的用词呼应。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν εἴπωμεν
  choice: 如果我们说
  rationale: 保留ἐὰν加虚拟语气所表达的条件关系；“说”比“声称”更贴近原文，也不额外加强语气。
- source_word: οὐχ ἡμαρτήκαμεν
  choice: 没有犯过罪
  rationale: 以现代汉语自然表达希腊语完成时所指的既成行为及其当前意义；不译作“从未犯过罪”，以免把时间范围绝对化。
- source_word: ψεύστην ποιοῦμεν αὐτὸν
  choice: 把他说成说谎的
  rationale: 保留ποιέω加宾语和表语的直接力度，并以自然汉语表达“使/判定他为说谎者”的意思；“说谎的”在此名词化使用。
- source_word: ὁ λόγος αὐτοῦ
  choice: 他的话
  rationale: λόγος既可指“话”也可指“信息”；选“他的话”既自然，又保留约翰著作中的用词呼应。
- source_word: οὐκ ἔστιν ἐν ἡμῖν
  choice: 不在我们里面
  rationale: 贴近原文，保留内在、关系性的表达，不增添“住在”等原文未明说的意象。
theological_decisions:
- issue: αὐτόν／αὐτοῦ所指的是谁
  choice: 正文保留代词“他”，由上下文指向上帝。
  alternative: 在正文中直接译成“上帝”。
  rationale: 上下文表明被说成说谎者的是上帝，但原文使用代词；保留“他”既忠于句法，也不把上下文解释直接代入正文。
- issue: “把他说成说谎的”的神学力度
  choice: 保留对上帝作出“说谎”判定的强烈措辞。
  alternative: 弱化为“就是不相信他”或“认为他不真实”。
  rationale: ψεύστης明确意为“说谎者”；不应因神学上的尖锐性而软化原文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“把他说成说谎的”保持原文的直接和尖锐；“在我们里面”保留约翰式的内在关系表达。
