  text: ὁ λέγων ἐν τῷ φωτὶ εἶναι καὶ τὸν ἀδελφὸν αὐτοῦ μισῶν ἐν τῇ σκοτίᾳ ἐστὶν ἕως ἄρτι.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/009.yaml
  text: The one who says he is in the light and hates his brother is in the darkness until now[a].
translation:
  language: zh_hans
  text: 那自称在光明中、却恨自己的弟兄的人，到如今仍在黑暗中[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄”也可理解为“弟兄或姊妹”。希腊原文用阳性单数“弟兄”，在这里的伦理论述中可以作代表性称呼。
    reason: 词义范围说明
lexical_decisions:
- source_word: ὁ λέγων
  choice: 那说……的人
  rationale: 定冠词加现在分词构成名词性表达，指一种有代表性的人；此译保留其结构及持续、自我声称的意味，也符合现代汉语习惯。
- source_word: ἐν τῷ φωτὶ εἶναι
  choice: 自己在光明中
  rationale: 按汉语间接引语自然表达补出“自己”，并保留约翰著作中“在光明中”这一领域性、比喻性的意象。
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: 自己的弟兄
  rationale: ἀδελφός为阳性单数；“弟兄”保留原文亲属称谓及其信仰群体语境中的传统含义，不在正文中径直解释为“信徒同伴”。
- source_word: μισῶν
  choice: 却恨
  rationale: 现在分词表示与自称同时存在、具有持续或特征性的态度；汉语用“恨”即可自然表达，“却”明确原文καί在此连接的强烈反差。
- source_word: ἐν τῇ σκοτίᾳ ἐστὶν
  choice: 仍在黑暗中
  rationale: 保留与“在光明中”平行的约翰式光暗意象；“仍”与末尾时间短语共同传达持续至今的状态。
- source_word: ἕως ἄρτι
  choice: 直到如今
  rationale: 直接保留该短语“持续到当前时刻”的时间重点，说明此人的声称并未改变其真实处境。
theological_decisions:
- issue: 伦理性代表单数中ἀδελφός的范围
  choice: 弟兄
  alternative: 弟兄或姊妹；信徒同伴
  rationale: 正文保留阳性单数的词汇形式及关系意象，同时用脚注说明在此伦理语境中可能具有代表性，避免把范围武断地限于男性，也避免在正文中直接锁定为“信徒同伴”。
- issue: 光明与黑暗的性质
  choice: 保留“在光明中／在黑暗中”的空间性比喻
  alternative: 活在真理中／活在罪恶中
  rationale: 原文没有明说这些意象的全部神学内涵；直保比喻可维持约翰文本的张力，避免用解释性措辞缩窄含义。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“那说……的人”贴近希腊语结构；以“却”自然呈现自称在光明中与实际恨弟兄之间的反差。
