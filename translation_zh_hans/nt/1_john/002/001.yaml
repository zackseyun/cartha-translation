  text: Τεκνία μου, ταῦτα γράφω ὑμῖν ἵνα μὴ ἁμάρτητε. καὶ ἐάν τις ἁμάρτῃ, παράκλητον ἔχομεν πρὸς τὸν πατέρα Ἰησοῦν Χριστὸν δίκαιον,
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/001.yaml
  text: My little children[a], I write these things to you so that you may not sin. But if anyone does sin[b], we have an advocate with the Father—Jesus the Messiah the Righteous One.
translation:
  language: zh_hans
  text: 我的孩子们，我把这些事写给你们，为要使你们不犯罪。但若有人犯罪，在父那里，我们有一位辩护者[a]，就是耶稣——弥赛亚[b]、那位义者。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“帮助者”“代言者”或“安慰者”；希腊语παράκλητος的含义范围较广，此处尤其带有代表、辩护或代求的意味。
    reason: lexical_alternative
  - marker: b
    text: “弥赛亚”传统上也译作“基督”；希腊语Χριστός既可作为称号，意为“受膏者、弥赛亚”，也可近似姓名的一部分。
    reason: alternative_reading
lexical_decisions:
- source_word: Τεκνία μου
  choice: 我的孩子们
  rationale: 保留亲属称谓和慈爱的牧养语气；现代汉语若直译为“我的小孩子们”，容易误指实际年龄，因此不用“小”字。
- source_word: ταῦτα γράφω ὑμῖν
  choice: 我把这些事写给你们
  rationale: 自然表达书信写作行为，并保留ταῦτα所指范围未完全明说的特点。
- source_word: ἵνα μὴ ἁμάρτητε
  choice: 是要你们不犯罪
  rationale: 忠实表达ἵνα加虚拟式的目的，不把它扩展为已经实现的绝对无罪状态。
- source_word: καὶ ἐάν τις ἁμάρτῃ
  choice: 但若有人犯了罪
  rationale: καί在此承接中带有转折意味；“若”保留条件性，过去式语感的“犯了罪”自然对应不定过去时所指的一次犯罪情形，而不排除更广泛用法。
- source_word: παράκλητον
  choice: 辩护者
  rationale: 上下文涉及在父面前代表信徒，法律与代求色彩较强；“辩护者”同时避免把词义限定为安慰。
- source_word: πρὸς τὸν πατέρα
  choice: 在父面前
  rationale: 表达朝向父、与父同在并可在父前代言的关系；比单纯空间性的“在父那里”更契合此处语境。
- source_word: Ἰησοῦν Χριστὸν
  choice: 耶稣——弥赛亚
  rationale: 将Χριστός按称号译为“弥赛亚”，破折号显明它是对耶稣身份的称述，同时避免生硬的“耶稣弥赛亚”。
- source_word: δίκαιον
  choice: 那位义者
  rationale: 保留形容词与耶稣同格的称号性用法；“义者”比“公正者”更能涵盖此处道德与神学语义。
theological_decisions:
- issue: ἵνα μὴ ἁμάρτητε是否暗示信徒能达到绝对无罪
  choice: 按目的从句译为“是要你们不犯罪”
  alternative: 译成已经实现或必然实现的无罪状态
  rationale: 原文陈明写作目的，紧接着又处理“若有人犯了罪”的可能；译文保留这两者之间的张力，不作体系化消解。
- issue: Χριστός在本节是称号还是姓名式成分
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处与“那位义者”并列描述耶稣，称号意味清楚；正文采用“弥赛亚”，脚注保留传统译法“基督”。
- issue: παράκλητος的代表与帮助语义
  choice: 辩护者
  alternative: 帮助者、保惠师、安慰者
  rationale: “在父面前”的语境突出代表、申辩或代求功能，但脚注承认该词的语义范围较宽，避免把它缩减为单一现代法律职务。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“我的孩子们”传达亲昵而不误导年龄；“但若”保持书信论述的简洁转折；用破折号和顿号呈现“耶稣—弥赛亚—那位义者”的同格关系。脚注标记均置于其实际说明的词语之后。
