revisions:
- from: 然而，我又写给你们一条新命令；这命令在他和你们身上都是真实的[a]，因为黑暗正在消逝，真光已经照耀。
  to: 再者，我写给你们一条新命令；这在他和你们身上都是真实的[a]，因为黑暗正在消逝，真光已经在照耀。
  rationale: 删去解释性较强的“然而”，以“再者”表达πάλιν引出的再次／另一面陈述；用“这”保留中性关系代词对前述事项的概括性。将“已经照耀”修订为“已经在照耀”，使ἤδη与现在时φαίνει所呈现的已然且持续的光照更清楚。同步改写脚注，使其准确说明所指解释而非误示代词的机械翻译。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T03:57:09Z'
