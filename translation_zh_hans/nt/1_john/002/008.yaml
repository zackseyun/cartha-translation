    rationale: πάλιν可在此引出相对于上一节的另一面陈述，但词义本身首先是“再、又”；正文加入“然而”会把一种合理的上下文推断固定为明确转折。
  - severity: medium
    issue: “真光已经照耀”未充分呈现φαίνει的现在时。
    rationale: φαίνει表示真光现今正在照耀；加“在”或“着”可保留与“黑暗正在消逝”并列的进行性，同时保留ἤδη的“已经”。
  - severity: low
