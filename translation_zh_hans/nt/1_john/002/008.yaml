  source_fidelity: “然而”将πάλιν所含、但原文未明说的强转折置入正文；“又”虽表达πάλιν，却与“然而”叠加而显得解释性过强。末句φαίνει为现在时，宜明确真光正在照耀，而不仅读作已完成的“已经照耀”。其余主要语义及黑暗正在过去的过程均得到保留。
  naturalness: 现有中文整体通顺、庄重。“再者，我写给你们……”更自然地承接上节同一作者对“旧／新”诫命的再述，也不强制设定为转折。“真光已经在照耀”自然表现“已经”与进行中的“照耀”。
  terminology: “新命令”“真光”“黑暗”均可用；“真光”恰当保留约翰文献的固定意象。以“这”对应中性关系代词所概括的前述事项，避免汉语中把原文关系代词过度限定为仅指“命令”。脚注应说明这是对αὐτῷ所指对象的替代理解，而非将希腊语阳性形式简单译成中性代词。
  issues:
