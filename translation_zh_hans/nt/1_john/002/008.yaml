id: 1JN.2.8
reference: 1 John 2:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: πάλιν ἐντολὴν καινὴν γράφω ὑμῖν, ὅ ἐστιν ἀληθὲς ἐν αὐτῷ καὶ ἐν ὑμῖν, ὅτι ἡ σκοτία παράγεται καὶ τὸ φῶς τὸ ἀληθινὸν ἤδη φαίνει.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/008.yaml
  text: Again[a], I am writing to you a new commandment, which is true in him and in you, because the darkness is passing away and the true light is already shining.
translation:
  language: zh_hans
  text: 再者，我写给你们一条新命令；这在他和你们身上都是真实的[a]，因为黑暗正在消逝，真光已经在照耀。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他”也可理解为指前面的“命令”；如此可译作“这命令在它和你们身上都是真实的”。
    reason: 保留αὐτῷ所指可理解为基督或前述命令的歧义，不在正文中排除替代读法。
lexical_decisions:
- source_word: πάλιν
  choice: 然而……又
  rationale: 承接上一节“不是一条新命令”而转入本节“新命令”的表述，既保留再次陈说之意，也自然显出语义转折。
- source_word: ἐντολὴν καινὴν
  choice: 一条新命令
  rationale: 准确保留“命令”及性质上的新意，并符合约翰文献的常用表达。
- source_word: ὅ ἐστιν ἀληθὲς
  choice: 这命令……是真实的
  rationale: 中性关系代词概括前述命令或整件事；汉语明示“这命令”可使句意清楚，同时保留其在基督和信徒身上成为现实的含义。
- source_word: ἐν αὐτῷ καὶ ἐν ὑμῖν
  choice: 在他和你们身上
  rationale: “在……身上”比直译“在……里面”更自然地表达这命令在基督及受信者生命中真实呈现；αὐτῷ优先按男性人称理解，但另一种指代保留于脚注。
- source_word: ἡ σκοτία παράγεται
  choice: 黑暗正在消逝
  rationale: 体现现在时所表达的持续过程；“消逝”自然传达黑暗逐渐退去，而非已经完全终止。
- source_word: τὸ φῶς τὸ ἀληθινὸν
  choice: 真光
  rationale: 保留约翰文献中具有鲜明神学和文学呼应的固定意象，也与“黑暗”形成简洁对照。
- source_word: ἤδη φαίνει
  choice: 已经照耀
  rationale: “已经”保留当下已经开始实现的意味，“照耀”准确表达光正在发出的动态。
theological_decisions:
- issue: αὐτῷ的指代
  choice: 译作“他”，理解为基督
  alternative: 译作“它”，理解为前述命令
  rationale: 该形式在上下文中较自然地指向基督，也符合约翰著作中真理在基督里彰显的表达；但其形式及关系从句容许将其理解为指前述命令，因此不在正文中排除另一读法，而以脚注保存。
- issue: 黑暗消逝与真光照耀的时间张力
  choice: 用“正在消逝”与“已经照耀”并列
  alternative: 将两者都处理为已经完成或纯属未来
  rationale: 原文一面说黑暗仍处于退去的过程中，一面说真光已经照耀；译文保留这种“已经开始、尚未完全”的张力，不作体系化消解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“然而……又”自然衔接上下文；“在……身上”避免生硬直译，同时未把“真实”弱化为单纯的“有效”。
