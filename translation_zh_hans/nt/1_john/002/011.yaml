  text: ὁ δὲ μισῶν τὸν ἀδελφὸν αὐτοῦ ἐν τῇ σκοτίᾳ ἐστὶν καὶ ἐν τῇ σκοτίᾳ περιπατεῖ, καὶ οὐκ οἶδεν ποῦ ὑπάγει, ὅτι ἡ σκοτία ἐτύφλωσεν τοὺς ὀφθαλμοὺς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/011.yaml
  text: But the one who hates his brother is in the darkness and walks in the darkness[a], and does not know where he is going, because the darkness has blinded his eyes.
translation:
  language: zh_hans
  text: 但恨自己弟兄的人在黑暗里，也在黑暗里行走[a]，不知道自己往哪里去，因为黑暗使他的眼睛瞎了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄”也可包括姊妹；希腊原文作“弟兄”，这里很可能指基督徒群体中的信徒同伴。
    reason: lexical_alternative
lexical_decisions:
- source_word: μισῶν
  choice: 恨……的人
  rationale: 现在时分词与冠词连用，指以恨为其持续态度或特征的人；中文用“恨……的人”自然且不把它局限为一次行为。
- source_word: ἀδελφὸν
  choice: 弟兄
  rationale: 原文为阳性单数，在约翰书信中通常指信仰群体中的同伴；正文保留其形式，并以脚注说明其所指可包括姊妹。
- source_word: ἐν τῇ σκοτίᾳ
  choice: 在黑暗里
  rationale: 两处均保留“黑暗”及重复，呈现约翰笔下具有道德与神学意味的领域意象，而不解释性地改写为“邪恶”。
- source_word: περιπατεῖ
  choice: 行走
  rationale: 保留原文以行走喻生活行为的图像，也与“不知道自己往哪里去”的方向意象相连。
- source_word: οὐκ οἶδεν ποῦ ὑπάγει
  choice: 不知道自己往哪里去
  rationale: 符合现代汉语表达，同时保留原文关于前行方向的动态意象。
- source_word: ἐτύφλωσεν
  choice: 弄瞎了
  rationale: 准确表达使其失明的动作及其现存结果；“了”自然传达动作已经发生。
- source_word: τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: 他的眼睛
  rationale: 保留具体的眼睛意象，不抽象化为心灵或悟性。
theological_decisions:
- issue: 约翰二元意象中“黑暗”的道德—属灵含义
  choice: 直译为“黑暗”
  alternative: 邪恶；罪的黑暗
  rationale: 原文以光与暗的象征意象承载多层含义；保留比喻可避免在正文中把含义收窄为某一种教义解释。
- issue: “弟兄”的所指范围
  choice: 正文保留“弟兄”，脚注说明可包括姊妹
  alternative: 弟兄或姊妹；信徒同伴
  rationale: 原文是阳性单数，同时在语境中很可能泛指基督徒群体内的同伴；此处理兼顾原文形式与实际指称范围。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。保留“黑暗”和“行走”的约翰式意象及原文的重复；使用“弟兄”贴近教会语境，但以脚注避免读者误以为只指男性。
