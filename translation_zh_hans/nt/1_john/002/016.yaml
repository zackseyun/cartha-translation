  text: ὅτι πᾶν τὸ ἐν τῷ κόσμῳ, ἡ ἐπιθυμία τῆς σαρκὸς καὶ ἡ ἐπιθυμία τῶν ὀφθαλμῶν καὶ ἡ ἀλαζονεία τοῦ βίου, οὐκ ἔστιν ἐκ τοῦ πατρός, ἀλλὰ ἐκ τοῦ κόσμου ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/016.yaml
  text: For everything in the world—the desire of the flesh[a], the desire of the eyes, and the pride of life—is not from the Father[c][b], but is from the world.
translation:
  language: zh_hans
  text: 因为世上的一切——肉体的欲望[a]、眼目的欲望和今生的骄傲[b]——都不是出于父，而是出于世界。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “欲望”也可译作“贪欲”；这里的“肉体”也可能指人堕落本性的倾向。原文并不只限于性欲。
    reason: lexical_alternative
  - marker: b
    text: 或译“生活上的傲慢”或“生活的夸耀”。原文可指因自己的生活方式、地位、财物或谋生资源而自负、炫耀。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 承接上一节不可爱世界的命令，说明其原因，保留因果作用。
- source_word: πᾶν τὸ ἐν τῷ κόσμῳ
  choice: 世上的一切
  rationale: 希腊文中性单数结构具有集合意义；此译简洁自然，并保留其全面范围。
- source_word: κόσμῳ / κόσμου
  choice: 世界
  rationale: 保留约翰文本中的核心用语，不把其解释性含义扩写为“堕落的世界体系”。
- source_word: ἐπιθυμία
  choice: 欲望
  rationale: 该词指强烈的愿望，在本语境中带负面意味；“欲望”比“情欲”更宽，不会局限为性欲。
- source_word: τῆς σαρκὸς
  choice: 肉体的
  rationale: 贴近 σάρξ 的基本表达，并保留它在此处可能兼有身体欲求与堕落人性倾向的张力。
- source_word: τῶν ὀφθαλμῶν
  choice: 眼目的
  rationale: 保留希腊文复数属格的形象和与前项平行的结构。
- source_word: ἀλαζονεία
  choice: 夸耀
  rationale: 该词含自负、虚张声势和炫耀之意；“夸耀”兼顾内在傲慢与外在张扬。
- source_word: τοῦ βίου
  choice: 今生的
  rationale: βίος 可指现世生活、谋生资源或财物；“今生”保持表达凝练，具体范围由脚注说明。
- source_word: οὐκ ἔστιν ἐκ τοῦ πατρός
  choice: 都不是出于父
  rationale: ἐκ 表示来源；“出于”准确呈现来源对比，“父”保留约翰书信的关系性称谓。
- source_word: ἀλλὰ ἐκ τοῦ κόσμου ἐστίν
  choice: 而是出于世界
  rationale: 与“不是出于父”构成清晰平行，突出两种来源的对照。
theological_decisions:
- issue: 在带有道德意味的列举中如何翻译 σάρξ
  choice: 肉体
  alternative: 罪性；堕落本性的
  rationale: 采用较贴近原文的“肉体”，不把该词直接等同于某一套人论解释；脚注提示其可能的比喻含义。
- issue: 如何理解 κόσμος
  choice: 世界
  alternative: 世界体系；堕落的世界秩序
  rationale: 原文以“父”和“世界”对照来源；正文保留“世界”，不把语境中的神学解释直接写入译文。
- issue: ἀλαζονεία τοῦ βίου 的范围
  choice: 今生的夸耀
  alternative: 生活的骄傲；对财物和地位的夸耀
  rationale: 原短语可涉及生活方式、社会地位、财物或谋生资源；正文不将其缩窄为其中一项。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。破折号保留原句三项列举的解释结构；用“都”使集合主语与中文谓语自然衔接。
