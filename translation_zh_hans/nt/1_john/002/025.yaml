  text: καὶ αὕτη ἐστὶν ἡ ἐπαγγελία ἣν αὐτὸς ἐπηγγείλατο ἡμῖν, τὴν ζωὴν τὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/025.yaml
  text: 'And this is the promise that he himself promised us: eternal life[a][b].'
translation:
  language: zh_hans
  text: 这就是他亲自应许给我们的应许：永生。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他亲自”在原文中带有强调意味；本节没有明确重述“他”是指父还是指子。
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ αὕτη ἐστὶν ἡ ἐπαγγελία
  choice: 就是这应许
  rationale: 以自然的现代汉语保留指示结构，并承接上文；“应许”准确表达所承诺之事，也适合庄重的经文语体。
- source_word: ἣν αὐτὸς ἐπηγγείλατο ἡμῖν
  choice: 他亲自应许给我们的
  rationale: “亲自”体现 αὐτός 的强调作用；“应许给我们”自然表达间接受词 ἡμῖν，并保留名词“应许”与动词“应许”之间的同根呼应。
- source_word: τὴν ζωὴν τὴν αἰώνιον
  choice: 永生
  rationale: 该宾格短语与“应许”同位，说明应许的内容；“永生”是约翰著作中 ζωή αἰώνιος 清楚、自然且通行的中文表达。
- source_word: καί
  choice: 未单独译出
  rationale: 此处 καί 承接上文；中文用“就是”及整体语序已自然体现衔接，若机械译作“并且”会显得生硬。
theological_decisions:
- issue: “他”（αὐτός）所指是谁
  choice: 只译作“他亲自”，不明确指定所指
  alternative: 明确译为“父亲自”或“子亲自”
  rationale: 希腊文本本节没有重述先行词；上下文可引发对父或子的不同理解。译文保留代词及其强调，不替原文消除这一开放性。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“就是这应许”的重组避免欧化长定语，同时保留原文“应许—应许”的同根修辞。中文“永生”本身无需以冠词差异另设词汇脚注。
