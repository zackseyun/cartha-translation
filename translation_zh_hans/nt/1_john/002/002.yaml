source:
  edition: SBLGNT
  text: καὶ αὐτὸς ἱλασμός ἐστιν περὶ τῶν ἁμαρτιῶν ἡμῶν, οὐ περὶ τῶν ἡμετέρων δὲ μόνον ἀλλὰ καὶ περὶ ὅλου τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/002.yaml
  text: And he himself is the atoning sacrifice for our sins[a], and not for ours only but also for the whole world.
translation:
  language: zh_hans
  text: 他自己就是为我们的罪献上的赎罪祭[a]；不但为我们的罪，也为全世界的罪。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“挽回祭”；也有人理解为“除罪祭”。
    reason: 保留 ἱλασμός 在平息忿怒与除去罪污方面的主要词义解释，避免正文单独裁定这一神学争议。
lexical_decisions:
- source_word: αὐτὸς
  choice: 他自己
  rationale: 保留 αὐτός 的强调用法，突出耶稣亲自担当这一角色，而不把它误译成排他的“唯有他”。
- source_word: ἱλασμός
  choice: 赎罪祭
  rationale: 该词处于献祭与除罪、平息忿怒相关的语义范围内。“赎罪祭”简洁自然，既表达祭牲性的赎罪，也不在正文中单独裁定“挽回祭”与“除罪祭”的神学侧重。
- source_word: περὶ τῶν ἁμαρτιῶν ἡμῶν
  choice: 为我们的罪献上的
  rationale: περί 与 ἱλασμός 连用时可自然译作“为……的罪”；补出“献上的”使现代汉语中的“赎罪祭”结构完整，其献祭含义来自 ἱλασμός。
- source_word: τῶν ἡμετέρων
  choice: 我们的罪
  rationale: 原文以所有格形容词省略“罪”；汉语重复“我们的罪”比单说“我们的”清楚自然。
- source_word: ὅλου τοῦ κόσμου
  choice: 全世界的罪
  rationale: 保留 ὅλου 的完整范围，不把 κόσμος 限缩为某一群体；“的罪”承接前文的省略成分，使汉语语义明确。
- source_word: οὐ ... μόνον ἀλλὰ καὶ
  choice: 不但……也……
  rationale: 自然保留原文“不仅……而且也……”的递进对照；此处用“不但……也……”庄重且流畅。
theological_decisions:
- issue: “全世界”的范围
  choice: 直译为“全世界”，不作解释性限缩
  alternative: 世界各地的人；全世界的选民
  rationale: ὅλου τοῦ κόσμου 本身表达广泛范围。译文应保留其张力，不加入原文没有明说的群体限制。
- issue: ἱλασμός 的赎罪含义
  choice: 正文采用“赎罪祭”
  alternative: 挽回祭；除罪祭
  rationale: “赎罪祭”可让普通读者理解其献祭性赎罪含义，同时不把词义仅限定为平息忿怒或除去罪污；主要词义侧重在脚注中保留。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“他自己”保留原文强调；分号呈现两分句关系。第二分句按汉语需要补出两处“罪”，属于对原文省略成分的明确表达。
