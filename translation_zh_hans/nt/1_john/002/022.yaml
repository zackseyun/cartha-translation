  text: τίς ἐστιν ὁ ψεύστης εἰ μὴ ὁ ἀρνούμενος ὅτι Ἰησοῦς οὐκ ἔστιν ὁ χριστός; οὗτός ἐστιν ὁ ἀντίχριστος, ὁ ἀρνούμενος τὸν πατέρα καὶ τὸν υἱόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/022.yaml
  text: 'Who is the liar except the one who denies that Jesus is the Messiah? This is the antichrist: the one who denies the Father and the Son[a][b].'
translation:
  language: zh_hans
  text: 谁是说谎者呢？不就是那否认“耶稣不是弥赛亚[a]”的人吗？这人就是敌基督[b]，就是那否认父与子的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“基督”。希腊文 ὁ χριστός 在这里是称号，意为“受膏者”。
    reason: alternative_reading
  - marker: b
    text: 希腊文直译“那敌基督者”。这里的说法可指具有这种特征的敌对者；本节本身并未限定为某一个末世人物。
    reason: lexical_alternative
lexical_decisions:
- source_word: ψεύστης
  choice: 那说谎者
  rationale: 定冠词使称谓具有明确、典型的指向；“那说谎者”既保留此限定性，也符合现代汉语表达。
- source_word: ἀρνούμενος
  choice: 那否认……的人
  rationale: 现在时分词在此名词化，刻画这类人的持续性或特征性行为；用“那否认……的人”自然保留其作用。
- source_word: ὅτι Ἰησοῦς οὐκ ἔστιν ὁ χριστός
  choice: 否认耶稣是弥赛亚
  rationale: 希腊文 ὅτι 引出所否认的命题；在汉语中，“否认耶稣是弥赛亚”自然表达其逻辑内容，即主张“耶稣不是弥赛亚”。
- source_word: ὁ χριστός
  choice: 弥赛亚
  rationale: 此处是称号，指受膏者及以色列所盼望的那一位；“弥赛亚”比名称化的“基督”更直接呈现称号功能。
- source_word: ἀντίχριστος
  choice: 敌基督
  rationale: “敌基督”是现代中文圣经语境中通行而简明的对应语，可涵盖反对基督或取代基督的语义关联；正文用“这人就是敌基督”表达原文冠词所带的辨认作用。
- source_word: τὸν πατέρα καὶ τὸν υἱόν
  choice: 父与子
  rationale: 在约翰文献的神学语境中，二者特指父神与子，使用“父与子”庄重、清楚，也保留其关系性称谓。
- source_word: οὗτός ἐστιν
  choice: 这人就是
  rationale: 指回前述否认者；“这人就是”比单纯“这就是”更明确地呈现人物指向和判定语气。
theological_decisions:
- issue: Χριστός 在否认公式中的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处 Χριστός 明显作为称号使用。译作“弥赛亚”保留经文所争议的是耶稣之弥赛亚身份，同时脚注提供传统译名。
- issue: ἀντίχριστος 的所指范围
  choice: 敌基督
  alternative: 那敌基督者
  rationale: 原文有冠词，但约翰书信中的用法既可能具有明确辨认作用，也可描述由否认父与子所界定的一类对敌者。正文不加入“末世唯一人物”等限定，以保留这一张力。
- issue: 否认耶稣是弥赛亚与否认父、子的关系
  choice: 并列保留原文的辨认陈述
  alternative: 解释为否认子就等于否认父
  rationale: 原文直接将敌基督界定为否认父与子的人，却未在本节明说两种否认之间的推论过程，因此不在译文中补入解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“谁是……呢？不就是……吗？”保留原文反问的论辩力度；重复“否认”以维持原文结构和强调。所有脚注标记均置于相应正文词语之后。
