  text: ἐὰν εἰδῆτε ὅτι δίκαιός ἐστιν, γινώσκετε ⸀ὅτι πᾶς ὁ ποιῶν τὴν δικαιοσύνην ἐξ αὐτοῦ γεγέννηται.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/029.yaml
  text: If you know that he is righteous[b][a], you know that everyone who practices righteousness has been born of him.
translation:
  language: zh_hans
  text: 你们若知道他[a]是公义的，就知道[b]凡行公义的人，都是由他所生的[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“他”可能指父神，也可能指圣子；希腊原文在本节没有明确说明所指。
    reason: alternative_reading
  - marker: b
    text: “就知道”也可译作“就要知道”；这个希腊词形既可理解为陈述，也可理解为命令。
    reason: grammatical_alternative
  - marker: c
    text: 直译可作“从他而生”。原文表达来源，且动词为被动式；正文译作“由他所生”以清楚表达这一点。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν εἰδῆτε
  choice: 你们若知道
  rationale: ἐὰν加虚拟语气构成条件从句；“若知道”既准确又符合庄重、自然的现代汉语。
- source_word: δίκαιός
  choice: 公义的
  rationale: 这里指道德与神学意义上的正直，并与下文δικαιοσύνη形成清楚的词根呼应。
- source_word: γινώσκετε
  choice: 就知道
  rationale: 正文按陈述语气理解，与前面的“知道”形成呼应；该形式也可能作命令语气，因此以脚注保留另一种读法。
- source_word: πᾶς ὁ ποιῶν τὴν δικαιοσύνην
  choice: 凡行公义的人
  rationale: 现在分词表达具有特征性或持续性的行为；“行公义”比“做公义”更自然，也保留伦理实践的含义。
- source_word: ἐξ αὐτοῦ
  choice: 从他
  rationale: ἐξ表达来源；“从他而生”在现代汉语中自然地保留了出生或生育的意象。
- source_word: γεγέννηται
  choice: 都是……而生的
  rationale: 完成时被动态表示已经由他所生，并具有持续的结果；汉语用“从他而生”自然表达被动来源，“都是”与“凡”相配。
theological_decisions:
- issue: “他”（δίκαιός ἐστιν及ἐξ αὐτοῦ）的指代对象
  choice: 保留代词“他”，不明确指定所指
  alternative: 明确译为父神或圣子
  rationale: 上下文可能容许两种理解，本节希腊文本没有直接点明所指。保留代词可避免替读者消除原文中的神学张力。
- issue: γινώσκετε的语气
  choice: 正文按陈述语气译为“就知道”
  alternative: 按命令语气译为“就要知道”
  rationale: 该希腊词形可作直陈语气或命令语气。陈述读法与条件句及上下文衔接自然，但另一读法在语法上成立，故列入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“公义”前后对应，保留原文的词义联系；“凡行公义的人”简洁表达持续而具有特征性的行为。
