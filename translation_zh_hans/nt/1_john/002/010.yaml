base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/010.yaml
  text: The one who loves his brother remains in the light[a], and there is no cause for stumbling in him.
translation:
  language: zh_hans
  text: 爱自己弟兄的人住在光中；在他里面没有导致跌倒的因素[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“对他没有绊脚物。”希腊语短语可理解为他里面没有导致跌倒的因素，也可理解为没有绊脚物临到他。
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἀγαπῶν
  choice: 爱……的
  rationale: 带冠词的现在时分词作名词性用法，表达一般性且持续的行动；汉语用“爱……的”自然保留这一功能。
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: 自己的弟兄
  rationale: 按阳性单数原文直译为“弟兄”，不在正文中扩展为“弟兄姊妹”或“信徒同伴”；“自己的”清楚表达所属关系。
- source_word: ἐν τῷ φωτὶ
  choice: 在光中
  rationale: 保留约翰著作中“光”的核心意象及其神学含义，且符合现代汉语表达。
- source_word: μένει
  choice: 住
  rationale: μέ解作持续停留、居于；“住在”既自然，又能与约翰著作中这一关键词的一贯表达相呼应。
- source_word: σκάνδαλον
  choice: 使人跌倒的事
  rationale: 该词可指绊脚物、陷阱或导致跌倒之因；此译保留比喻性的伦理含义，又不把它误解为纯粹字面的物件。
- source_word: ἐν αὐτῷ
  choice: 在他里面
  rationale: 最直接地保留介词短语及阳性单数代词，并指回爱弟兄的人；其也可能表示“对他而言”，故在脚注中说明。
- source_word: οὐκ ἔστιν
  choice: 没有
  rationale: 用现代汉语存在句自然表达否定存在的意思。
theological_decisions:
- issue: καὶ σκάνδαλον ἐν αὐτῷ οὐκ ἔστιν 中 ἐν αὐτῷ 的所指及末句含义
  choice: 在爱弟兄的人里面，没有使人跌倒的事
  alternative: 没有什么会使他跌倒
  rationale: 原文可描述此人里面不存在导致跌倒的因素，也可理解为他不会遇到使自己跌倒的绊脚物。正文保留较直接的“在他里面”，但不明确限定是使自己还是使别人跌倒；脚注保存另一种合理理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“弟兄”忠实保留原文阳性单数；“住在光中”保留约翰式意象和关键词关联。正文不消除末句在语法和神学上的真实歧义。
