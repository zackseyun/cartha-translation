base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/003.yaml
  text: 'And by this we know that we have come to know him: if we keep his commandments[a].'
translation:
  language: zh_hans
  text: 我们由此知道，我们已经认识他：若我们遵守他的诫命。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: 由此
  rationale: 这是约翰常用的表达，指出据以确认某事的根据或证据；“由此”在现代汉语中自然，并保留指示意味。
- source_word: γινώσκομεν
  choice: 我们……知道
  rationale: 现在时表示当下的认知或确信；译为“知道”简明自然。
- source_word: ὅτι ἐγνώκαμεν αὐτόν
  choice: 自己已经认识他
  rationale: 完成时表示已经进入认识他的状态，而其结果持续至今；“已经认识”兼顾完成性与现代汉语的流畅度，脚注补充更明确的起始性译法。
- source_word: αὐτόν
  choice: 他
  rationale: 原文仅用代词；保留“他”，不擅自限定为上帝或基督，从而保存上下文中的指称张力。
- source_word: ἐὰν
  choice: 就是
  rationale: 该条件从句在此说明“由此”所指的检验或证据。汉语用“就是”承接冒号，能自然表达：遵守诫命是知道自己认识他的判据；其中仍含“若遵守”的条件关系。
- source_word: ἐντολάς
  choice: 诫命
  rationale: “诫命”保留该词在约翰著作中的道德与圣约分量，也符合现代中文圣经语体。
- source_word: τηρῶμεν
  choice: 我们遵守
  rationale: τηρέω含持守、谨守并实行之意；“遵守”在现代汉语中比直译“守”更自然，同时准确表达顺服实行。
theological_decisions:
- issue: αὐτόν（“他”）所指为何
  choice: 正文保留代词“他”，不明确指定对象。
  alternative: 明确译作“上帝”或“耶稣／基督”。
  rationale: 希腊文使用代词，而《约翰一书》的语境把认识上帝与认识圣子紧密相连。保留代词可避免加入经文本身没有明说的限定。
- issue: 遵守诫命与认识他的关系
  choice: 将遵守诫命表达为认识他的检验或证据。
  alternative: 把条件理解为凭遵守诫命取得对他的认识。
  rationale: ἐν τούτῳ与条件从句共同说明“我们由此知道”的依据；译文不把遵命解释为赚取或促成认识他的功劳，也不削弱原文的条件力度。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“由此知道”“认识他”“遵守他的诫命”保留约翰文体的关键词联系。正文中的“他”不替换为专名，以保存原文的指称开放性。
