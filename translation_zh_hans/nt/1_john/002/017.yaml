  text: καὶ ὁ κόσμος παράγεται καὶ ἡ ἐπιθυμία αὐτοῦ, ὁ δὲ ποιῶν τὸ θέλημα τοῦ θεοῦ μένει εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/017.yaml
  text: And the world is passing away[a], along with its desire[b], but the one who does the will of God remains forever.
translation:
  language: zh_hans
  text: 这世界正在消逝，它的欲望也在消逝；但遵行上帝旨意的人永远长存。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “长存”所译的希腊语μένει，也可译作“常存”或“存留”。这是约翰著作中的一个重要用词；在本句中强调持续、永久地存留。
    reason: lexical_alternative
lexical_decisions:
- source_word: κόσμος
  choice: 这世界
  rationale: 保留约翰著作中“世界”的宽广表达，并由2:15—16的上下文显明这里主要指背离上帝、受错误欲望支配的现世秩序，而不把含义局限为物质受造界。
- source_word: παράγεται
  choice: 正在消逝
  rationale: 现在时形式呈现持续进行的过程；“正在消逝”既表达其短暂性，也避免仅作无时间色彩的普遍陈述。
- source_word: ἐπιθυμία
  choice: 欲望
  rationale: 此词在上下文中带负面意味，但并非只指性欲；“欲望”能涵盖2:16所述各种失序的贪求。
- source_word: αὐτοῦ
  choice: 它的
  rationale: 代词回指“世界”；现代汉语用“它的”自然表达这种非人格化的所属关系。
- source_word: ὁ δὲ ποιῶν
  choice: 但遵行……的人
  rationale: 名词化分词指以实行上帝旨意为特征的人；“遵行”自然地传达实际去做及顺服的含义。
- source_word: θέλημα τοῦ θεοῦ
  choice: 上帝旨意
  rationale: “旨意”保留θέλημα在此处的神学分量，所指不只是上帝的偏好，而是上帝所要成就并要人实行的事。
- source_word: μένει
  choice: 长存
  rationale: 表达持续存在、不会随世界消逝的对比；现代汉语庄重而清楚，同时保留约翰常用μένω所具有的持续意味。
- source_word: εἰς τὸν αἰῶνα
  choice: 永远
  rationale: 这是现代汉语表达无尽延续最自然的说法，与“长存”连用准确传达该短语在本句中的力度。
theological_decisions:
- issue: κόσμος在约翰语境中的含义
  choice: 正文保留“世界”，按上下文理解为背离上帝、终将消逝的现世秩序
  alternative: 物质受造的世界
  rationale: 2:15—16以欲望和自夸描述“世界”，显示这里的重点是敌对上帝的价值秩序；译文不把这一含义扩写进正文，以保留原文用语的广度。
- issue: μένει εἰς τὸν αἰῶνα的神学力度
  choice: 遵行上帝旨意的人“永远长存”
  alternative: 直接解释为得永生或永远得救
  rationale: 原文明确肯定此人的永久存留，却没有在本句解释其教义机制；译文保留这一强烈对比，不加入原文未明说的系统神学表述。
- issue: 遵行上帝旨意与永久存留之间的关系
  choice: 保留原文并列对照，不明定为功德因果或仅是身份凭据
  alternative: 解释为靠行为赚取永生，或将行为弱化为毫无实际意义的标志
  rationale: ὁ ποιῶν描述“做上帝旨意的人”，而本句没有进一步界定行为与永久存留的机制；译文保存这种神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“这世界”承接近处上下文；重复“消逝”以保留希腊文中世界及其欲望共同消逝的平行结构。“遵行”比单纯“做”更符合中文宗教与伦理语境，但未扩写为任何特定宗派的顺服观。
