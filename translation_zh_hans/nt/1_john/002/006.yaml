  text: ὁ λέγων ἐν αὐτῷ μένειν ὀφείλει καθὼς ἐκεῖνος περιεπάτησεν καὶ ⸀αὐτὸς περιπατεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/006.yaml
  text: The one who says he remains in him ought also to walk just as that one walked[a][b][c].
translation:
  language: zh_hans
  text: 那说自己常在他里面的人，也应当像那一位[a]一样行事[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “那一位”指耶稣；原文使用带有强调意味的指示代词，也可译作“他”。
    reason: alternative_reading
  - marker: b
    text: 原文的“行走”是圣经中表示生活方式的比喻；这里“行事”指应当像耶稣那样生活、行事。
    reason: cultural_note
lexical_decisions:
- source_word: ὁ λέγων
  choice: 那说……的人
  rationale: 带冠词的分词作名词用，指具有代表性的任何一个人；此译保留单数和泛指意味，并符合现代汉语表达。
- source_word: ἐν αὐτῷ μένειν
  choice: 自己住在他里面
  rationale: μένω是约翰著作中的关键词，可表达持续停留、住在并维持关系。汉语“住在……里面”保留了原文的空间隐喻和关系含义；“自己”明确不定式的主语与“说”的人相同。
- source_word: ὀφείλει
  choice: 应当
  rationale: 表达道德上的责任和义务；“应当”庄重自然，又不把语气强化为绝对命令。
- source_word: καθὼς
  choice: 照着
  rationale: 表示方式上的对应，即以那一位的行事为准则；在本句中比机械直译“正如”更自然。
- source_word: ἐκεῖνος
  choice: 那一位
  rationale: 保留指示代词的强调色彩，同时以尊重而自然的中文指向上下文中的耶稣，不额外加入原文没有的名字。
- source_word: περιεπάτησεν ... περιπατεῖν
  choice: 所行的去行
  rationale: 保留περιπατέω“行走”的圣经伦理隐喻，即人的生活方式和行为；借助“所行的”使中文句法顺畅。
- source_word: καὶ αὐτὸς
  choice: 也
  rationale: καί和强调代词αὐτός共同突出那自称者本人也负有相应责任；中文用“也”简洁传达这一对应关系。
theological_decisions:
- issue: αὐτῷ与ἐκεῖνος所指为何
  choice: 正文译作“他”与“那一位”，由上下文指向耶稣，并用脚注说明
  alternative: 直接译作“耶稣”或将二者都译作普通的“他”
  rationale: 上下文最自然地指向基督，但原文此处使用代词而非名字。“那一位”保存ἐκεῖνος的指示和强调作用，又不在正文中把解释替代原文。
- issue: “行”的伦理隐喻
  choice: 正文保留“行”，脚注解释为生活与行事
  alternative: 直接意译为“生活”或“照耶稣那样生活”
  rationale: 保留原文隐喻及其圣经互文性，同时通过脚注确保普通读者理解。
- issue: 单数阳性形式的表达
  choice: 译作单数泛指的“那说……的人”
  alternative: 改为复数“那些说……的人”或明确使用男性称谓
  rationale: 希腊文是语法上的阳性单数，但具有代表性和泛指功能；中文“人”无需标明生理性别，既保留单数，也不加入原文没有的性别限制。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。正文保留约翰著作中“住在……里面”和“行”的核心隐喻；不为μένω另设脚注，因为中文“住在……里面”已直接保存其意象。所有脚注标记均已置于正文。
