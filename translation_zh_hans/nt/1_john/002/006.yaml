  rationale: 修订以“常在”准确体现μένω的持续关系，以“像那一位一样行事”使中文通顺并准确传达“照着那一位所行的方式而行”的伦理比较。脚注保留对指示代词和“行走”隐喻的必要说明，并将锚点置于相应词语之后。
