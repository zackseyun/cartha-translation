  text: πᾶς ὁ ἀρνούμενος τὸν υἱὸν οὐδὲ τὸν πατέρα ἔχει· ⸂ὁ ὁμολογῶν τὸν υἱὸν καὶ τὸν πατέρα ἔχει⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/023.yaml
  text: Everyone who denies the Son does not have the Father either[a]; whoever confesses the Son has the Father also.
translation:
  language: zh_hans
  text: 凡否认子的，也没有父；凡承认子的，也有父[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本没有“承认子的，也有父”。
    reason: textual_variant
lexical_decisions:
- source_word: πᾶς ὁ ἀρνούμενος
  choice: 凡否认……的
  rationale: 带冠词的现在分词在这里泛指一切具有这种立场的人；“凡……的”自然、简洁，并保留普遍范围。
- source_word: ἀρνούμενος
  choice: 否认
  rationale: 在信仰告白的语境中表示否定、拒不承认；“否认”准确保留其明确的否定意味，又不额外加入“弃绝”或“断绝关系”等解释。
- source_word: τὸν υἱὸν
  choice: 子
  rationale: 原文只写“子”，是确定的基督论称号；不扩写为“上帝的儿子”，以免加入原句未明说的内容。
- source_word: οὐδὲ
  choice: 也没有
  rationale: 把前面的否定延伸到“父”，形成“否认子，也没有父”的对应关系，符合现代汉语表达。
- source_word: τὸν πατέρα ἔχει
  choice: 有父
  rationale: 直译约翰文献中含义深厚的“有”；不将其限定性地释为“与父相交”或“属于父”，从而保留原文的神学张力。
- source_word: ὁ ὁμολογῶν
  choice: 承认……的
  rationale: 该现在分词泛指公开认可、宣认子的人。“承认”是普通现代读者易懂的表达，同时与前面的“否认”构成清楚对照。
- source_word: καὶ
  choice: 也
  rationale: 在平衡的对偶结构中表示相应的附加关系：“承认子”的人“也有父”，并与前句“也没有”呼应。
theological_decisions:
- issue: 校勘文本中第二分句带有括号，存在抄本异文
  choice: 正文保留“承认子的，也有父”
  alternative: 依据部分抄本省略第二分句
  rationale: 所给SBLGNT正文虽以校勘符号标示异文，仍收录该分句；因此译入正文，并用脚注说明部分抄本的省略。
- issue: “有父”的关系性含义
  choice: 保留“有父”这一原文表述
  alternative: 释译为“与父相交”或“属于父”
  rationale: 本节强调否认或承认子与“有父”不可分割。直译可保留约翰式措辞的广度，不把它缩减为某一种特定关系。
translation_notes:
  register: 采用简洁、庄重而通俗的现代标准汉语。“否认”与“承认”、“也没有”与“也有”彼此对称，呈现原文鲜明的反义平行结构；保留“子”“父”“有父”等凝练表达，不作教派化扩释。
