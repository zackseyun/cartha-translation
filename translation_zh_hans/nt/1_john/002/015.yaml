source:
  edition: SBLGNT
  text: Μὴ ἀγαπᾶτε τὸν κόσμον μηδὲ τὰ ἐν τῷ κόσμῳ. ἐάν τις ἀγαπᾷ τὸν κόσμον, οὐκ ἔστιν ἡ ἀγάπη τοῦ πατρὸς ἐν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/015.yaml
  text: Do not love the world or the things in the world[a]. If anyone loves the world[c][b], the love of the Father is not in him.
translation:
  language: zh_hans
  text: 不要爱世界，也不要爱世界上的事物。谁若爱世界，对父的爱[a]就不在他里面。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “对父的爱”也可理解为“父的爱”。
    reason: alternative_reading
lexical_decisions:
- source_word: Μὴ ἀγαπᾶτε
  choice: 不要爱
  rationale: μή加现在时命令语气可表达一般性禁令，也可能针对持续中的行为；“不要爱”自然简洁，不对体貌作过度解释。
- source_word: τὸν κόσμον
  choice: 这个世界
  rationale: κόσμος在这里由上下文指向与神相对立的世俗秩序，而不是受造界本身；保留“世界”这一宽广、惯常的表达，并以“这个”使汉语指称自然。
- source_word: μηδὲ τὰ ἐν τῷ κόσμῳ
  choice: 也不要爱世界上的事物
  rationale: μηδέ延续否定，τὰ ἐν τῷ κόσμῳ指世界之中的各样事物；补出“爱”符合汉语表达，同时保持原文禁令的范围。
- source_word: ἐάν τις ἀγαπᾷ
  choice: 谁若爱
  rationale: τις是不定代词，条件句用“谁若”可自然表达普遍、无性别限定的范围。
- source_word: ἡ ἀγάπη τοῦ πατρὸς
  choice: 爱父的心
  rationale: 此表达在现代汉语中自然地传达对父的爱，也在一定程度上保留“父”与“爱”的属格关系；因希腊语属格仍可能理解为父所赐或父所有的爱，另加脚注说明。
- source_word: ἐν αὐτῷ
  choice: 在他里面
  rationale: 保留约翰著作中常见的“在……里面”空间隐喻；“他”对应原文阳性单数，但在“谁若”的结构中泛指任何人。
theological_decisions:
- issue: κόσμος在约翰伦理语境中的含义
  choice: 正文译作“这个世界”，不作解释性扩写
  alternative: 世俗秩序；现今敌对神的世界体系
  rationale: 经文所禁止的是对敌对神之秩序的依恋，而非否定神的创造或对世人的爱。正文保留κόσμος的广度，由上下文界定。
- issue: ἡ ἀγάπη τοῦ πατρὸς中属格的含义
  choice: 正文译作“爱父的心”，并用脚注保留另一种理解
  alternative: 父的爱；父所赐的爱
  rationale: 上下文将爱世界与爱父相对照，较支持“对父的爱”；但希腊语属格本身可能是主观属格，因此不应完全消除歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“事物”比“东西”略为庄重；“谁若”简洁地表达普遍条件。“爱父的心”符合汉语习惯，脚注则保留希腊语属格的真实歧义。
