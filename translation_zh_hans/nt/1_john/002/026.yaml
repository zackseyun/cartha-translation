  text: I have written these things to you concerning those who are leading you astray[a].
translation:
  language: zh_hans
  text: 我把这些事写给你们，是关于那些误导你们的人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那些企图把你们引入歧途的人”，或“那些欺骗你们的人”。希腊语分词既可描述正在施行的误导，也不一定表示误导已经得逞。
    reason: 说明词义选择，并保留该行动是否已经成功的歧义。
lexical_decisions:
- source_word: Ταῦτα
  choice: 这些事
  rationale: 中性复数指示代词回指前文所写的内容；“这些事”既准确又符合现代汉语表达。
- source_word: ἔγραψα
  choice: 写
  rationale: 不定过去时表示已经完成的写作行为；置于“我把这些事写给你们”的结构中，汉语无需另加完成标记也能自然表达。
- source_word: ὑμῖν
  choice: 给你们
  rationale: 与格标明书信的接受者，“给你们”是现代汉语最直接自然的对应。
- source_word: περὶ
  choice: 针对
  rationale: 此处引出写作所涉及的人，也带有警告读者防范他们的语境色彩；“针对”比“关于”更自然地连接整句，但不额外说明写作目的。
- source_word: τῶν πλανώντων ὑμᾶς
  choice: 那些误导你们的人
  rationale: 现在主动分词把这些人描述为对读者施行误导的人。“误导”简明自然，同时以脚注保留其“使人偏离正道”的意象以及行动是否已经得逞的开放性。
- source_word: πλανάω
  choice: 误导
  rationale: 该词可表示使人走迷路、引入歧途或欺骗；“误导”在此兼顾思想与属灵层面的偏离，也符合现代普通话。
theological_decisions:
- issue: πλανώντων所指的误导是否已经成功
  choice: 那些误导你们的人
  alternative: 那些企图把你们引入歧途的人；那些欺骗你们的人
  rationale: 希腊语分词描述这些人正在从事的活动，但本身不明确断言读者已经受骗，也不明确加入“企图”的意图含义。正文采用中性的“误导”，脚注说明可能的理解，以保留原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“我把……写给你们，是针对……”保持书信口吻和警戒语气；脚注避免正文过度解释原文。
