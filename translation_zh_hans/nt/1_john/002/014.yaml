id: 1JN.2.14
reference: 1 John 2:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ⸀ἔγραψα ὑμῖν, παιδία, ὅτι ἐγνώκατε τὸν πατέρα· ἔγραψα ὑμῖν, πατέρες, ὅτι ἐγνώκατε τὸν ἀπ’ ἀρχῆς· ἔγραψα ὑμῖν, νεανίσκοι, ὅτι ἰσχυροί ἐστε καὶ ὁ λόγος τοῦ θεοῦ ἐν ὑμῖν μένει καὶ νενικήκατε τὸν πονηρόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/014.yaml
  text: I have written to you[a], children, because you have known the Father. I have written to you, fathers, because you have known him who is from the beginning. I have written to you, young men, because you are strong, and the word of God remains in you[c][b], and you have overcome the evil one.
translation:
  language: zh_hans
  text: 我写信给你们，孩子们，因为你们已经认识了父；我写信给你们，父老们，因为你们已经认识了那位从起初就有的[a]；我写信给你们，青年男子们，因为你们刚强，神的话语住在你们里面[b]，并且你们已经胜过了那恶者。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “那位从起初就有的”也可译为“那位从起初就在的”。这句话很可能指向先存的子，但本节没有明确说出其身份。
    reason: 保留该短语的词义选择，并说明其所指在正文中仍为隐含。
  - marker: b
    text: “住在”也可译为“存留在”或“常住在”。
    reason: 说明 μένει 的持续停留、存留之意。
lexical_decisions:
- source_word: ἔγραψα
  choice: 我写信给你们
  rationale: 在书信语境中明确表达“写”，用“写信”符合现代汉语；汉语不强制标示英语现在完成时那样的时态，句中以语境及“已经”表达相关结果。
- source_word: παιδία
  choice: 孩子们
  rationale: 保留亲属称谓和群体呼语，不额外加入“亲爱的”等原文没有明说的情感修饰。
- source_word: ἐγνώκατε
  choice: 已经认识了
  rationale: 以“已经……了”表达完成式所强调的既成认识及其当前效力；“认识”也比单纯“知道”更适合这里的人际关系含义。
- source_word: τὸν πατέρα
  choice: 父
  rationale: 在约翰著作的语境中是对神的称呼；汉语以“父”自然表达其称号性质。
- source_word: πατέρες
  choice: 父老们
  rationale: 既保留父辈、年长者的男性称谓，也避免现代汉语中“父亲们”容易被理解为单指有子女的男性。
- source_word: τὸν ἀπ’ ἀρχῆς
  choice: 那位从起初就存在的
  rationale: 保留原文未明说姓名的指称，并用“就存在”自然表达其持续存在之意，不擅自直译为“基督”或“子”。
- source_word: νεανίσκοι
  choice: 青年们
  rationale: 按上下文与“父老们”构成群体对照；汉语“青年”本身不显性标明男性，但原词为阳性复数，语境中的称谓可理解为青年男子。
- source_word: ἰσχυροί
  choice: 刚强
  rationale: “刚强”在现代庄重汉语中自然地表达属灵与道德层面的强健，且不夸大为“强大”。
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: 神的话
  rationale: 保留其可能指神的信息、宣告或福音的开放性，不缩窄为某一种特定形式。
- source_word: μένει
  choice: 常存在
  rationale: 表达 μένω 持续停留、存留的约翰式用法；“常存”兼顾持续性和庄重自然的中文表达。
- source_word: νενικήκατε
  choice: 已经胜过了
  rationale: 用“已经……了”体现完成式：胜利已经取得，并具有持续效力。
- source_word: τὸν πονηρόν
  choice: 那恶者
  rationale: 定冠词与阳性形式倾向于人格化指称；“那恶者”保留这一点，而不抽象化为“邪恶”。
theological_decisions:
- issue: “那位从起初就存在的”的所指
  choice: 保持隐含，不直接写成基督或神的儿子
  alternative: 明确译为“从起初就存在的基督（或神的儿子）”
  rationale: 约翰著作的用语很可能指向先存的子，但本节原文没有明说其身份；保持代称可保存原文的含蓄与神学张力。
- issue: 三组称呼的性别与群体性质
  choice: 译为“孩子们、父老们、青年们”
  alternative: 将三者都泛化为全教会不同属灵阶段的人
  rationale: 原文第一称呼为较宽泛的孩子称谓，后两者为阳性复数。译文保留三重修辞结构，不在正文中断定这些称呼纯指实际年龄还是属灵成熟程度。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。重复“我写信给你们”以保留原文三段并列的修辞节奏；不以解释性措辞消除“那位从起初就存在的”所指的含蓄性。
