  text: ⸀ὑμεῖς ὃ ἠκούσατε ἀπ’ ἀρχῆς, ἐν ὑμῖν μενέτω· ἐὰν ἐν ὑμῖν μείνῃ ὃ ἀπ’ ἀρχῆς ἠκούσατε, καὶ ὑμεῖς ἐν τῷ υἱῷ καὶ ἐν τῷ πατρὶ μενεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/024.yaml
  text: As for you[a], let what you heard from the beginning remain in you. If what you heard from the beginning remains in you[b], you also will remain in the Son and in the Father.
translation:
  language: zh_hans
  text: 至于你们，要让你们从起初所听见的留在你们里面。[a] 你们从起初所听见的若留在你们里面，你们也必留在子里面，也留在父里面。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你们从起初所听见的”很可能是指起初所领受、关于子的使徒信息；原文没有在这里明说“信息”或“福音”。
    reason: lexical_alternative
  - marker: b
    text: 本节三次“留在”都译自同一个希腊动词；也可译作“常在”或“住在”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: 至于你们
  rationale: 句首独立、前置的代词带有强调和话题转换作用；“至于你们”自然表达与前文所述之人的对比。
- source_word: ὃ ἠκούσατε ἀπ’ ἀρχῆς
  choice: 你们从起初所听见的
  rationale: 保留中性关系代词所指内容的概括性，不在正文中擅自明确为“福音”或“使徒教导”。
- source_word: ἀπ’ ἀρχῆς
  choice: 从起初
  rationale: 保留约翰著作中这一惯用表达及其呼应意味，同时符合现代中文圣经语体。
- source_word: ἐν ὑμῖν μενέτω
  choice: 要让……常存在你们里面
  rationale: 表达现在时命令语气所含的持续要求；“常存”兼顾现代可懂性，并可在本节中一致对应 μένω。
- source_word: ἐὰν ἐν ὑμῖν μείνῃ
  choice: 若常存在你们里面
  rationale: 清楚呈现 ἐάν 引出的条件，不把条件关系改写为因果或保证。
- source_word: καὶ ὑμεῖς
  choice: 你们也
  rationale: “也”体现 καί，显明信息留在信徒里面与信徒留在子和父里面之间的对应关系。
- source_word: ἐν τῷ υἱῷ καὶ ἐν τῷ πατρὶ
  choice: 在子里面，也常在父里面
  rationale: 分别呈现两个 ἐν 所表达的平行关系；采用约翰语境中简洁的称谓“子”和“父”，不额外添加原文没有的限定语。
- source_word: μενεῖτε
  choice: 必常在
  rationale: “必”呈现将来直陈语气，“常在”与本节前两次 μένω 保持词汇呼应。
theological_decisions:
- issue: 末句条件性陈述的性质
  choice: 按将来直陈语气译作“你们也必常在子里面，也常在父里面”
  alternative: 将其改写为劝勉，或解释为某一体系中的无条件保证
  rationale: 原文把将来的结果与先前所听见的持续留在信徒里面相连；译文保留这一条件关系及其神学张力，不代入有关坚忍、确据或联合方式的宗派性结论。
- issue: “从起初所听见的”的所指
  choice: 正文保持概括表达
  alternative: 明确译成“福音”或“使徒的信息”
  rationale: 上下文很可能指起初所领受、关于子的使徒宣讲，但希腊文只用中性关系代词指代其内容，因此正文不缩窄原文范围。
- issue: “在子里面”和“在父里面”的关系
  choice: 保留两个并列的关系短语
  alternative: 将两者合并或改写为一项系统神学命题
  rationale: 原文重复介词并把子与父并列；译文照此保留约翰式表达，不进一步界定这种“在……里面”的关系。
translation_notes:
  register: 采用现代、庄重而易懂的中文。“常存／常在”既保留约翰文献中 μένω 的重复，又顺应中文搭配：信息“常存在”人里面，人则“常在”子和父里面。正文避免以“福音”“使徒教导”等解释性名词替代原文宽泛的关系代词。
