id: 1JN.2.7
reference: 1 John 2:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ⸀Ἀγαπητοί, οὐκ ἐντολὴν καινὴν γράφω ὑμῖν, ἀλλ’ ἐντολὴν παλαιὰν ἣν εἴχετε ἀπ’ ἀρχῆς· ἡ ἐντολὴ ἡ παλαιά ἐστιν ὁ λόγος ὃν ⸀ἠκούσατε.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/007.yaml
  text: Beloved[a], I am not writing a new commandment to you, but an old commandment that you have had from the beginning. The old commandment is the message that you heard.
translation:
  language: zh_hans
  text: 亲爱的，我写给你们的不是一条新诫命，而是一条你们从起初就有的旧诫命。这旧诫命就是你们所听见的道。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “道”也可译作“信息”：这旧诫命就是你们所听见的信息。
    reason: λόγος在此可指所传讲、被听见的内容；“道”保留较凝练的经文语域，“信息”则提供语境化的词义选择。
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: 亲爱的弟兄姊妹
  rationale: 这是复数呼格，用于充满爱意的称呼。“亲爱的弟兄姊妹”在现代汉语基督徒群体语境中自然、庄重，并能表达约翰对全体收信人的牧者情谊；希腊词本身未标明性别，因此采用包容男女的表达。
- source_word: ἐντολήν
  choice: 命令
  rationale: “命令”准确传达具有约束力的吩咐，也比“诫命”更贴近日常现代汉语；重复用词保留原文论述的连贯性。
- source_word: καινήν
  choice: 新
  rationale: 与παλαιάν直接对照，采用最自然且不增加解释的译法。
- source_word: γράφω
  choice: 我写给你们的
  rationale: 现在时描述正在进行的写信行为；汉语无需显式添加“正在”，此结构自然地表达当前书写。
- source_word: παλαιάν / παλαιά
  choice: 旧
  rationale: 保留与“新”的直接对照，不将其强化为“古老”或解释成“从前的”。
- source_word: εἴχετε
  choice: 你们……就有的
  rationale: 未完成时表示从过去开始持续拥有；与“从起初”结合，可自然表达这条命令长期为读者所持有。
- source_word: ἀπ’ ἀρχῆς
  choice: 从起初
  rationale: 保留约翰著作中具有回响的惯用语，也不限定为信主之初、受教之初或绝对的宇宙起初。
- source_word: λόγος
  choice: 道
  rationale: λόγος在这里可指听见的信息、话语或所传之道。“道”在中文圣经语域中凝练庄重，并保留其词义幅度；以脚注列出“信息”这一语境化译法。
- source_word: ἠκούσατε
  choice: 你们所听见的
  rationale: 忠实表达不定过去时所指向的既往听闻事件；汉语定语结构自然简洁，不必机械标出时态。
theological_decisions:
- issue: “从起初”的所指
  choice: 保留为“从起初”，不具体限定
  alternative: 从你们开始信主时；从福音开始传给你们时
  rationale: 上下文可能偏向读者最初所领受的教导，但原文没有进一步界定；直译保留约翰用语的开放性与神学回响。
- issue: 旧命令与所听见之λόγος的等同关系
  choice: 译作“这旧命令就是你们所听见的道”
  alternative: 加以解释为爱的命令或福音信息
  rationale: 原文直接把旧命令与读者听见的λόγος等同，却未在本节展开说明；译文不借邻近经文预先补明其内容。
- issue: Ἀγαπητοί的群体指向
  choice: 亲爱的弟兄姊妹
  alternative: 蒙爱的人；亲爱的各位
  rationale: 采用自然、包容男女的群体称呼，同时不把“蒙谁所爱”等原文未明说的施爱者加入正文。
translation_notes:
  register: 采用现代、庄重而易懂的书信语体。“亲爱的弟兄姊妹”传达复数爱称的温暖语气；“从起初”与“道”适度保留约翰文献的传统回响。脚注标记[a]已置于正文相应句末。
