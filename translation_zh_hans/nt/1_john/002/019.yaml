revisions:
- from: 他们从我们中间出去了，但他们并不是属我们的；因为他们若是属我们的，就会一直留在我们中间[a]。然而，他们出去，是要让他们显露出来[b]，表明他们并非全都是属我们的[c]。
  to: 他们从我们中间出去，但他们并不属我们；因为他们若本是属我们，就会一直留在我们中间[a]。但这件事发生，是要显明他们并不都属我们[b]。
  rationale: 修订保留原文的群体归属语言、反事实条件和末句否定范围，同时以自然的被动表达处理φανερωθῶσιν。删除会把“并不都”改成“全都不”的脚注，避免在译文中消除原文及英文审校轨迹所保留的范围张力。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T03:57:17Z'
review_pass:
  verdict: revise
  source_fidelity: 正文前半准确区分了实际从群体中离开与归属关系；但“让他们显露出来”在汉语中容易听作他们主动显露自己，未充分体现φανερωθῶσιν的被动义。末句的οὐκ…πάντες宜保留为“并不都”，不应以脚注把它列为“全都不是”的同等替代，因为这改变了否定词的表层范围，且与英文审校轨迹的保留处理不一致。
  naturalness: 修订以“这件事发生，是要显明……”明确承接前述离去事件，语气庄重、自然；“若本是属我们的”也较清楚地表达反事实条件。
  terminology: “从我们中间出去”与“属我们”保留原文同一短语在不同语境中的关联，并避免加入“背道”“假信徒”或得救状态等神学推断。将“属我们的”统一为更简练自然的“属我们”。
  issues:
  - severity: medium
    issue: “让他们显露出来”弱化被动语态，且可能暗示主动自我显露。
    rationale: φανερωθῶσιν为复数被动虚拟式；“显明他们……”更自然地表达其被揭示的结果。
  - severity: medium
    issue: 脚注c将“他们全都不是属我们的”作为可并列的理解。
    rationale: 原文写作οὐκ εἰσὶν πάντες ἐξ ἡμῶν，英文审校轨迹也选择保留“not all”的范围。该脚注会将正文保留的范围表述改为全称否定，故应删除。
  - severity: low
    issue: “若是属我们的”对原文反事实条件的提示稍弱。
    rationale: “若本是属我们”在现代汉语中更清楚地表达该条件与“就会一直留在”之间的反事实关系。
