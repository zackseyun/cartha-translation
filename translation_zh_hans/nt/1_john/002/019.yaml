  text: ἐξ ἡμῶν ἐξῆλθαν, ἀλλ’ οὐκ ἦσαν ἐξ ἡμῶν· εἰ γὰρ ⸂ἐξ ἡμῶν ἦσαν⸃, μεμενήκεισαν ἂν μεθ’ ἡμῶν· ἀλλ’ ἵνα φανερωθῶσιν ὅτι οὐκ εἰσὶν πάντες ἐξ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/019.yaml
  text: They went out from us[a], but they were not of us; for if they had been of us, they would have remained with us[b]. But this happened so that it might be made clear that not all are of us.
translation:
  language: zh_hans
  text: 他们从我们中间出去，但他们并不属我们；因为他们若本是属我们，就会一直留在我们中间[a]。但这件事发生，是要显明他们并不都属我们[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“就会继续和我们在一起。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“使他们被显明出来。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ ἡμῶν
  choice: 从我们中间／属我们的
  rationale: 首处与动词“出去”连用，表示从群体中离开，译作“从我们中间”；其余各处表达归属和认同，译作“属我们的”。这样既保留同一希腊短语的反复，也符合现代汉语习惯。
- source_word: ἐξῆλθαν
  choice: 出去了
  rationale: 直译其离开的动作，不在动词本身加入“背道”等神学解释。
- source_word: οὐκ ἦσαν ἐξ ἡμῶν
  choice: 并不是属我们的
  rationale: “属我们的”保留群体归属的关系性表达，不扩写成“从未真正得救”或其他系统神学判断。
- source_word: μεμενήκεισαν ἂν μεθ’ ἡμῶν
  choice: 就会一直留在我们中间
  rationale: 体现带ἄν的非事实条件结果；“一直留在”自然表达完成时态所指的持续，也保留约翰著作中μένω的“留住／常在”意象。
- source_word: ἀλλ’ ἵνα φανερωθῶσιν
  choice: 然而，他们出去，是要让他们显露出来
  rationale: φανερωθῶσιν是复数被动形式，主语承接离去的人；补出“他们出去”使汉语句子完整，同时以“显露出来”保留被动和目的意味。
- source_word: ὅτι οὐκ εἰσὶν πάντες ἐξ ἡμῶν
  choice: 表明他们并非全都是属我们的
  rationale: 按希腊语表层次序保留οὐ与πάντες的范围张力；另以脚注说明也可理解为对这群人的整体否定。
theological_decisions:
- issue: “属我们的”是否应解释为可见教会成员身份或真正得救者身份
  choice: 保留“属我们的”这一群体归属表达
  alternative: 他们从未是真正的信徒／他们并不真正属于教会
  rationale: 原文以ἐξ ἡμῶν表达关系和归属，并未采用后世系统神学范畴；不宜由译文替读者解决相关教义问题。
- issue: οὐκ εἰσὶν πάντες ἐξ ἡμῶν中否定词与“所有”的范围
  choice: 正文译作“并非全都是属我们的”，脚注列出“他们全都不是属我们的”
  alternative: 只采用“他们全都不是属我们的”
  rationale: 希腊语形式容许读者感受到否定范围的张力；正文贴近词序，脚注提供在本段语境中常见的整体否定理解，避免无提示地消除歧义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“从我们中间”表达实际离开，“属我们的”表达关系归属；避免使用“背道”“假信徒”“从未得救”等带有预设结论的术语。
