  text: καὶ ὑμεῖς χρῖσμα ἔχετε ἀπὸ τοῦ ἁγίου ⸀καὶ οἴδατε ⸀πάντες·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/020.yaml
  text: But you have an anointing from the Holy One[a], and you all know.
translation:
  language: zh_hans
  text: 但你们有从那位圣者而来的膏抹[a]，并且你们全都知道。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 另有文本异读作：“你们知道万事。”SBLGNT 正文支持“你们全都知道”。
    reason: textual_variant
lexical_decisions:
- source_word: καὶ
  choice: 但
  rationale: 此处 καί 在语篇中与上一节所说的敌对者形成对比；译作“但”能以自然的现代汉语表达这一转折。
- source_word: ὑμεῖς
  choice: 你们
  rationale: 原文明确使用第二人称复数代词，带有对比强调；“但你们”保留了这种强调。
- source_word: χρῖσμα ἔχετε
  choice: 领受了膏抹
  rationale: χρῖσμα 保留为“膏抹”，不直接解释为圣灵；结合 ἀπό 所指的来源，汉语用“从……领受了”比直译“有……膏抹”更自然，同时表达现今拥有这一事实。
- source_word: ἀπὸ τοῦ ἁγίου
  choice: 从那位圣者
  rationale: 保留 τοῦ ἁγίου 的称号形式，不具体判定所指是父神还是基督；“那位圣者”在现代汉语中自然且庄重。
- source_word: καὶ
  choice: ，
  rationale: 第二个 καί 连接两个分句；现代汉语中用逗号并列即可自然传达联系，不必机械译出“并且”。
- source_word: οἴδατε
  choice: 知道
  rationale: 直接表达 οἶδα 的知识、认知含义，简明自然。
- source_word: πάντες
  choice: 人人都
  rationale: 按 SBLGNT 的主格复数 πάντες 理解，修饰“你们”，即“你们所有人”，而不是宾格中性复数所可能表达的“万事”。
theological_decisions:
- issue: “那位圣者”的所指
  choice: 保留为“那位圣者”，不明确指定是父神还是圣子。
  alternative: 译作“圣父”或“圣子耶稣基督”。
  rationale: 原文仅使用带冠词的“圣者”这一称号，上下文容许不同理解；译文不应擅自消除这种真实的指称张力。
- issue: χρῖσμα 的含义
  choice: 译作“膏抹”，保留原文隐喻。
  alternative: 直接译作“圣灵”或“圣灵的恩赐”。
  rationale: 这里的膏抹常被理解为圣灵或圣灵的工作，但原文使用 χρῖσμα，并未直接写 πνεῦμα；保留隐喻可避免把解释写进正文。
- issue: πάντες 的句法与文本异读
  choice: 采用 SBLGNT 正文所支持的“你们人人都知道”。
  alternative: “你们知道万事”。
  rationale: SBLGNT 所列 πάντες 为主格阳性复数，最自然地以“所有人”为主语补语；另一异读支持“万事”，故以脚注交代。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“膏抹”保留约翰书信中的核心隐喻；“领受了”使汉语表达自然，但不展开说明其具体神学所指。脚注标记 [a] 已置于正文相关位置。
