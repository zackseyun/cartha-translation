id: 1JN.2.12
reference: 1 John 2:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Γράφω ὑμῖν, τεκνία, ὅτι ἀφέωνται ὑμῖν αἱ ἁμαρτίαι διὰ τὸ ὄνομα αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/012.yaml
  text: I am writing to you[a], little children[c][b], because your sins have been forgiven for the sake of his name.
translation:
  language: zh_hans
  text: 孩子们，我写信给你们[a]，因为你们的罪已经因他的名得了赦免。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我写信给你们”也可译作“我正在写信给你们”。希腊语现在时在书信语境中可作这两种理解。
    reason: lexical_alternative
  - marker: b
    text: “因为”也可译作“所写的是：你们的罪已经因他的名得了赦免”。此外，“他的”在本节没有明说是指上帝还是耶稣。
    reason: alternative_reading
lexical_decisions:
- source_word: Γράφω
  choice: 我写信给你们
  rationale: 书信语境中的现在时自然译为“我写信给你们”；既可指当下写作，也符合现代汉语书信表达。
- source_word: τεκνία
  choice: 孩子们
  rationale: 该称呼带有亲昵、关爱的意味，不一定强调年龄；“孩子们”在现代汉语中自然且保留亲情语气。
- source_word: ὅτι
  choice: 因为
  rationale: 结合上下文，此处最自然地说明写信的理由；同时以脚注保留“所写的内容是……”这一语法可能。
- source_word: ἀφέωνται
  choice: 已经……得了赦免
  rationale: 完成时被动语态表示赦免已经发生并且结果持续；“已经……得了赦免”兼顾被动意义和现存状态。
- source_word: αἱ ἁμαρτίαι
  choice: 你们的罪
  rationale: 与复数第二人称间接受词ὑμῖν连用时，汉语自然表达为“你们的罪”，明确呈现原文结构所传达的归属关系。
- source_word: διὰ τὸ ὄνομα αὐτοῦ
  choice: 因他的名
  rationale: διά加宾格表示原因或根据；“因他的名”简洁保留圣经中“名”的人格、权柄及身份内涵，而不将其弱化为“名声”。
theological_decisions:
- issue: “他的名”中代词所指
  choice: 正文保留“他的”，不明确补作“上帝的”或“耶稣的”
  alternative: 上帝的名；耶稣基督的名
  rationale: 本节本身没有明说代词所指；保留原文的隐含性，避免用解释取代经文。
- issue: ὅτι的功能
  choice: 译作表示原因的“因为”
  alternative: 译作引出写信内容的“就是/说”
  rationale: 上下文的重复句式较适合理由义，但希腊语也容许内容义，因此在脚注中保留另一读法。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“孩子们”表达使徒亲切的称呼，不刻意解释为年龄群体；“因他的名”保留原文凝练的圣经措辞及指代上的含混。
