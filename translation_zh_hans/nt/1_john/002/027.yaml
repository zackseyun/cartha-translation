  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ὑμεῖς τὸ χρῖσμα ὃ ἐλάβετε ἀπ’ αὐτοῦ ⸂μένει ἐν ὑμῖν⸃, καὶ οὐ χρείαν ἔχετε ἵνα τις διδάσκῃ ὑμᾶς· ἀλλ’ ὡς τὸ ⸀αὐτοῦ χρῖσμα διδάσκει ὑμᾶς περὶ πάντων, καὶ ἀληθές ἐστιν καὶ οὐκ ἔστιν ψεῦδος, καὶ καθὼς ἐδίδαξεν ὑμᾶς, ⸀μένετε ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/027.yaml
  text: And as for you[a], the anointing that you received from him remains in you, and you have no need that anyone should teach you. But as his anointing teaches you about all things, and is true and is not a lie, and just as it taught you[b], remain in him.
translation:
  language: zh_hans
  text: 至于你们，你们从他所领受的膏抹仍在你们里面[b]；你们不需要任何人教导你们。正如他的膏抹在一切事上教导你们，并且是真实的，不是谎言；你们要照着它所教导你们的，住在他里面。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或据另一读法译作：“……你们住在他里面。”
    reason: textual_variant
  - marker: b
    text: 本节“仍在你们里面”和“住在他里面”所对应的是同一个希腊语动词。也可译作“常在你们里面／常在他里面”。
    reason: lexical_alternative
lexical_decisions:
- source_word: χρῖσμα
  choice: 膏抹
  rationale: 保留原文“膏抹”的比喻，不在正文中直接解释为“圣灵”、福音信息或某种物质性的膏油。
- source_word: ἀπ’ αὐτοῦ
  choice: 从他
  rationale: 保留代词表达，让读者按上文判断“他”的所指，不在本节中擅自明确为“圣者”或“神”。
- source_word: μένει ἐν ὑμῖν / μένετε ἐν αὐτῷ
  choice: 住在你们里面 / 住在他里面
  rationale: 两处统一用“住在”对应约翰著作中反复出现的 μένω，既保留词语呼应，也比生硬的“居留”自然。
- source_word: οὐ χρείαν ἔχετε ἵνα τις διδάσκῃ ὑμᾶς
  choice: 你们不需要任何人教导你们
  rationale: 直接保留原文断言，不将其弱化，也不扩写成排除教会中一切人为教导的教义判断。
- source_word: διδάσκῃ / διδάσκει / ἐδίδαξεν
  choice: 教导 / 教导 / 教导
  rationale: 统一译法，以保留本节的重复和修辞联系。
- source_word: περὶ πάντων
  choice: 在一切事上
  rationale: 自然表达原文范围广泛的措辞，不在译文中自行限定其所指。
- source_word: ἀληθές ἐστιν καὶ οὐκ ἔστιν ψεῦδος
  choice: 是真实的，不是谎言
  rationale: 保留约翰式“真实—谎言”的鲜明对照；“谎言”也反映 ψεῦδος 的名词形式。
- source_word: καθὼς ἐδίδαξεν ὑμᾶς
  choice: 照着它所教导你们的
  rationale: 保留 καθὼς 的比较、规范意味，并承接前文膏抹的教导。
theological_decisions:
- issue: “膏抹”（χρῖσμα）的所指
  choice: 正文保留“膏抹”这一比喻，不明确等同于圣灵。
  alternative: 译作“圣灵”，或解释为所领受的信息／福音。
  rationale: 上下文很可能涉及圣灵及其教导工作，但本节本身使用“膏抹”这一表达；保留比喻可避免把一种神学解释直接写入正文。
- issue: “不需要任何人教导你们”的范围
  choice: 按原文直译其断言，由上下文界定范围。
  alternative: 解释为完全否定一切人为教导，或明确限定为不需要离道者的教导。
  rationale: 原文的力度不应被削弱，但译文也不应越过本节，把它绝对化为废除所有教导职分的命题。
- issue: 末句 μένετε 的语气
  choice: 按劝勉语气译为“你们要……住在他里面”。
  alternative: 按陈述语气译为“你们……住在他里面”。
  rationale: 在本段语境中，命令／劝勉读法自然，也符合所据正文；另一读法保留于脚注。
- issue: 末句 αὐτῷ 的所指
  choice: 译为人格性的“他”。
  alternative: 指膏抹而译为“它”。
  rationale: 原文使用阳性代词，且上下文容许其指向基督；译文不把它改成指膏抹的中性表达，以保留原文的指涉张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“膏抹”虽带有经文传统色彩，但最能简洁保留原文隐喻；其余句式尽量避免古雅倒装。用“它”回指“膏抹”，用“他”保留末句阳性代词的潜在人格所指。
