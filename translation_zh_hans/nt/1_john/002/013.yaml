  to: 父亲们，我写信给你们，因为你们已经认识了那位从起初就有的[a]；青年人，我写信给你们，因为你们已经胜过了那恶者。
  rationale: 将“父老们”改为“父亲们”，以更直接保留原文的家庭式称谓，避免汉语“父老”所带的社会性年长者含义。将“从起初就存在的”改为“从起初就有的”，既合乎汉语和约翰文献常见表达，也避免把原文省略的表达过度释义为明确的存在论断言。相应调整脚注的替代译法；其余结构、完成结果和人格性指向均予保留。
