  text: γράφω ὑμῖν, πατέρες, ὅτι ἐγνώκατε τὸν ἀπ’ ἀρχῆς· γράφω ὑμῖν, νεανίσκοι, ὅτι νενικήκατε τὸν πονηρόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/013.yaml
  text: I write to you[a], fathers, because you have known him who is from the beginning; I write to you, young men, because you have overcome the evil one.
translation:
  language: zh_hans
  text: 父亲们，我写信给你们，因为你们已经认识了那位从起初就有的[a]；青年人，我写信给你们，因为你们已经胜过了那恶者。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从起初的那一位”。这句话很可能指圣子，但也有人认为它较广泛地指神。
    reason: 保留希腊文实体化、省略表达的另一种可行译法，以及其指称上的歧义。
lexical_decisions:
- source_word: γράφω
  choice: 我写信给你们
  rationale: 书信语境中的现在时自然表达当前的写作行为；汉语用“写信”比单说“写”更明确、自然。
- source_word: πατέρες
  choice: 父老们
  rationale: 保留“父辈、年长者”的称谓意味，同时避免让现代读者误以为只指收信人的生父；在庄重语体中“父老”可指受尊敬的年长男性。
- source_word: ἐγνώκατε
  choice: 已经认识
  rationale: 以“已经”体现完成时所表达的既成事实及其持续结果，而不额外加入“逐渐认识”等原文未明说的发展过程。
- source_word: τὸν ἀπ’ ἀρχῆς
  choice: 那位从起初就存在的
  rationale: 保留原文实体化短语及男性个人指向；“就存在”使省略的存在含义在现代汉语中自然可懂，却不在正文中明指其为圣子或神。
- source_word: νεανίσκοι
  choice: 青年人
  rationale: 指年轻男性群体；现代汉语“青年人”自然庄重，语境中的对应称谓可传达其群体身份。
- source_word: νενικήκατε
  choice: 已经胜过了
  rationale: “已经”与“了”共同传达胜利已经取得；“胜过”也符合约翰文献中 νικάω 的惯用神学语感。
- source_word: τὸν πονηρόν
  choice: 那恶者
  rationale: 有冠词的阳性单数形容词实体化，最自然地指一个有位格的邪恶对手；“那恶者”保留个人指向，又不擅自补出“撒但”这一专名。
theological_decisions:
- issue: “那位从起初就存在的”所指是谁
  choice: 正文保留间接称谓，不明确补作基督或圣子
  alternative: 明确译作“从起初就存在的圣子”，或宽泛理解为神
  rationale: 约翰文献的用语很可能指向圣子，但本节希腊文本没有明说其身份；保留原有表达可维持真实的指称张力。
- issue: “那恶者”的性质
  choice: 译为有位格的邪恶对手
  alternative: 译作抽象的“邪恶”
  rationale: 阳性单数冠词加实体化形容词有力支持个人性所指，但原文没有直接使用“撒但”这一名称。
translation_notes:
  register: 采用现代、庄重而易懂的书信语体。以“父老们／青年人”保留两组呼语的对称；分号维持原文两个平行分句的结构。
