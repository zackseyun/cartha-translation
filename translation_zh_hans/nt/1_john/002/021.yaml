reference: 1 John 2:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οὐκ ἔγραψα ὑμῖν ὅτι οὐκ οἴδατε τὴν ἀλήθειαν, ἀλλ’ ὅτι οἴδατε αὐτήν, καὶ ὅτι πᾶν ψεῦδος ἐκ τῆς ἀληθείας οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/021.yaml
  text: I have not written to you because you do not know the truth[a], but because you do know it[b], and because no lie is from the truth.
translation:
  language: zh_hans
  text: 我写信给你们[a]，不是因为你们不知道真理，而是因为你们知道真理，也因为任何谎言都不是出于真理。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我写信给你们”也可译作“我写了信给你们”。希腊语不定过去时可表示单纯的过去动作；这里的译法则顺应书信语境，指作者正在写给读者的内容。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψα
  choice: 我写信给你们
  rationale: 希腊语不定过去时在书信语境中指作者写下收信人正在读的内容。现代汉语用不带完成体标记的“我写信给你们”最自然，也不必强行判定为一般过去或现在完成。
- source_word: οἴδατε
  choice: 你们知道
  rationale: οἶδα表示“知道、认识”。前后重复“知道”，清楚保留“不知道……而是知道”的鲜明对比。
- source_word: τὴν ἀλήθειαν / τῆς ἀληθείας
  choice: 真理
  rationale: 两处均有定冠词，但现代汉语通常无需另加对应词。“真理”保留约翰用语的广度，不将其收窄为“福音信息”等解释性表达。
- source_word: πᾶν ψεῦδος
  choice: 任何谎言
  rationale: 结合后面的否定词，表达普遍否定；“任何谎言都不是……”符合现代汉语习惯，并保留“每一个/一切谎言”的范围。
- source_word: ἐκ τῆς ἀληθείας οὐκ ἔστιν
  choice: 都不是出于真理
  rationale: ἐκ表示来源或出处。“不是出于真理”既贴近原文结构，也自然表达谎言并非源自真理。
theological_decisions:
- issue: “真理”在约翰著作中的含义
  choice: 保留为“真理”，不作教义性扩写
  alternative: 真信息；福音的真理
  rationale: 本节未把“真理”明确限定为某一较窄的概念；直译能保留其神学深度和语义广度。
- issue: 谎言与真理的关系
  choice: 译为来源关系：“不是出于真理”
  alternative: 不属于真理；与真理无关
  rationale: 介词ἐκ首先指向来源或出处。此译法保留原文的神学对照，不把它扩展成原文未明说的归属或排斥关系。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“我写信给你们”符合中文书信表达；“不是因为……而是因为……”保留原文论证结构；末句用“任何……都不……”清楚表达普遍否定。
