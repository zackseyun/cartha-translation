id: 1JN.2.28
reference: 1 John 2:28
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ νῦν, τεκνία, μένετε ἐν αὐτῷ, ἵνα ⸀ἐὰν φανερωθῇ ⸀σχῶμεν παρρησίαν καὶ μὴ αἰσχυνθῶμεν ἀπ’ αὐτοῦ ἐν τῇ παρουσίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/028.yaml
  text: And now[a], little children, remain in him, so that if he is revealed[c][b], we may have confidence and not shrink away from him in shame at his coming.
translation:
  language: zh_hans
  text: 现在，孩子们，你们要住在他里面；这样，他若显现[a]，我们就可以坦然无惧，在他来临[b]时也不至于羞愧地从他面前退缩[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“当他显现时”。“显现”所译的希腊语动词是被动形式，也可较直译为“被显明”。
    reason: 保留ἐάν的条件／时间歧义，并说明φανερωθῇ的语态。
  - marker: b
    text: 或译：“临在”。这里的“来临”采用了该词在末世语境中的常见含义。
    reason: 保留παρουσία的字面词义及语境义。
  - marker: c
    text: 或译：“在他面前蒙羞”。原文也可能只是指在他面前感到羞愧，而不着重表达退缩的动作。
    reason: 保留αἰσχυνθῶμεν ἀπ’ αὐτοῦ的另一种句法和语义理解。
lexical_decisions:
- source_word: τεκνία
  choice: 孩子们
  rationale: 这是带有亲切意味的呼语。现代汉语中的“孩子们”能自然表达属灵长辈对群体的慈爱称呼；“小孩子们”容易使人误以为特指年幼儿童。
- source_word: μένετε ἐν αὐτῷ
  choice: 住在他里面
  rationale: 保留约翰著作中“住在……里面”的核心关系性意象，也避免用“与他联合”过早解释这一隐喻。
- source_word: ἐὰν φανερωθῇ
  choice: 他若显现
  rationale: “显现”保留被动形式所表达的“被显明”意味，而“若”保留ἐάν所含的条件或不定时间色彩；上下文仍清楚指向将来的显现。
- source_word: σχῶμεν παρρησίαν
  choice: 我们就可以坦然无惧
  rationale: παρρησία在这里表示面对他时公开、无惧的信心。“坦然无惧”符合现代汉语，也不把它收窄为主观上的确据。
- source_word: αἰσχυνθῶμεν ἀπ’ αὐτοῦ
  choice: 羞愧地从他面前退缩
  rationale: 既表达αἰσχύνομαι的羞愧，也体现ἀπό的“从……离开”方向感；但该短语也可能较简单地表示“在他面前蒙羞”，故以脚注保留。
- source_word: παρουσίᾳ
  choice: 来临
  rationale: 在此末世语境中，παρουσία指基督将来的到来。“来临”自然且庄重；其较字面的“临在”含义在脚注中说明。
theological_decisions:
- issue: 代词所指及将来的显现
  choice: 按上下文理解为耶稣基督将来的显现，但正文只译代词“他”，不增添姓名。
  alternative: 把“他”较笼统地理解为神，而不明确区分父与子。
  rationale: 前文围绕住在子里面展开，φανερωθῇ和παρουσία也自然指向基督将来的显现；不过原句本身使用代词，因此译文不把解释直接扩写进正文。
- issue: ἐὰν在末世显现语境中的语气
  choice: 译作“若”，保留条件或不定时间表达。
  alternative: 译作“当……时”，把它理解为对确定事件的时间表述。
  rationale: ἐάν加虚拟语气形式上保留“若”的空间；这里也完全可能具有“当他显现时”的含义，因此脚注列出该自然读法，不以译文消除张力。
- issue: 在来临时羞愧的性质
  choice: 表达为因羞愧而从他面前退缩，不把它明确等同于最终定罪。
  alternative: 只译作“在他面前蒙羞”，不表达退缩；或理解为被他判定有罪。
  rationale: αἰσχυνθῶμεν与ἀπ’ αὐτοῦ的组合可能带有羞愧退避的意味，但经文本身没有明确说明最终审判的结局，故不作超出原文的教义性扩展。
translation_notes:
  register: 采用现代、庄重而口语可懂的普通话。“现在，孩子们”保留牧养式呼语；“住在他里面”维持约翰文本反复出现的意象；分号使劝勉与其目的／结果关系清楚，同时不改写原句的神学张力。
