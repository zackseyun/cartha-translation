  text: ὃς δ’ ἂν τηρῇ αὐτοῦ τὸν λόγον, ἀληθῶς ἐν τούτῳ ἡ ἀγάπη τοῦ θεοῦ τετελείωται. ἐν τούτῳ γινώσκομεν ὅτι ἐν αὐτῷ ἐσμεν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/005.yaml
  text: 'But whoever keeps his word[a], truly in him the love of God has been perfected[b]. By this we know that we are in him:'
translation:
  language: zh_hans
  text: 凡遵守他话语的人，上帝的爱确实已经在这人里面得以成全[a]。由此我们知道，我们是在他里面的：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “上帝的爱”既可指上帝对人的爱，也可指人对上帝的爱。“在这人里面”也可理解为“在这件事上”，即以遵守他的话语为证据。
    reason: alternative_reading
lexical_decisions:
- source_word: ὃς δ’ ἂν
  choice: 但凡……的人
  rationale: 关系代词与ἄν构成不定、普遍的条件，表达“任何……的人”；“但”保留δέ与上文的轻微转折。
- source_word: τηρῇ
  choice: 遵守
  rationale: τηρέω在此指持守、遵行；“遵守”自然地涵盖对话语的忠实实践，又不缩减为单纯外在服从。
- source_word: αὐτοῦ τὸν λόγον
  choice: 他的话语
  rationale: λόγος为单数，广义指他所传达的话；“话语”保留约翰著作的用语和神学回响，而不把范围限定为“信息”。
- source_word: ἀληθῶς
  choice: 确实
  rationale: 保留副词的强调作用，现代汉语自然且庄重。
- source_word: ἐν τούτῳ
  choice: 在这人里面
  rationale: τούτῳ可指前述遵守他话语的人；“这人”比单说“这”更清楚，同时脚注说明也可能指“这件事”。
- source_word: ἡ ἀγάπη τοῦ θεοῦ
  choice: 上帝的爱
  rationale: 保留希腊语属格的真实歧义，既可理解为上帝的爱，也可理解为人对上帝的爱，不在正文中强行判定。
- source_word: τετελείωται
  choice: 得以完全
  rationale: 完成时被动态表示已经达到完全并处于该状态；“得以完全”保留被动意味及达到圆满、成全的语义。
- source_word: ἐν τούτῳ γινώσκομεν
  choice: 由此我们知道
  rationale: 这是约翰常用的认识凭据公式；“由此”自然表达根据或证据。
- source_word: ὅτι ἐν αὐτῷ ἐσμεν
  choice: 我们是在他里面的
  rationale: 直译并保留约翰著作中“在他里面”这一重要的关系性表达，不扩写为“与他联合”。
theological_decisions:
- issue: ἡ ἀγάπη τοῦ θεοῦ中属格的含义
  choice: 上帝的爱
  alternative: 上帝对人的爱；人对上帝的爱
  rationale: 原文既可能指爱的来源或主体，也可能指爱的对象。正文采用可包容两者的表达，以保留神学张力。
- issue: 第一个ἐν τούτῳ的指向
  choice: 在这人里面
  alternative: 在这件事上／由此
  rationale: 该短语可以回指遵守话语的人，也可能较抽象地指遵守话语这件事。正文采用较顺畅的个人指向，脚注保留另一种可能。
- issue: τετελείωται的完成与被动意味
  choice: 得以完全
  alternative: 达到完全／已经成全
  rationale: 此处不只是程度加深，也含达到目标或圆满状态之意；采用“得以完全”避免把它解释为道德上的绝对无瑕。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“遵守他的话语”“在他里面”保留约翰文本的关键词和表达；句末冒号保留原文向下一节展开的衔接。
