source:
  edition: SBLGNT
  text: Παιδία, ἐσχάτη ὥρα ἐστίν, καὶ καθὼς ἠκούσατε ⸀ὅτι ἀντίχριστος ἔρχεται, καὶ νῦν ἀντίχριστοι πολλοὶ γεγόνασιν· ὅθεν γινώσκομεν ὅτι ἐσχάτη ὥρα ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/018.yaml
  text: Children[a], it is the last hour, and just as you heard that antichrist is coming, even now many antichrists have arisen[b]. From this we know that it is the last hour.
translation:
  language: zh_hans
  text: 孩子们，这是末时了。正如你们所听说的：敌基督要来；如今已经有许多敌基督出现了[a]。由此我们知道，这是末时了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “出现了”也可译作“兴起了”或“已经来到”。希腊文的完成时强调，许多敌基督已经出现，并且如今仍然存在。
    reason: lexical_alternative
lexical_decisions:
- source_word: Παιδία
  choice: 孩子们
  rationale: 这是用于呼语的复数形式，在本书中带有亲切、牧养性的家庭语气；“孩子们”自然易懂，又不额外加入“亲爱的”等原文未明说的修饰。
- source_word: ἐσχάτη ὥρα
  choice: 末时
  rationale: 保留其末世性的时间表达，同时避免让现代读者误解为字面上的六十分钟；“末时”在中文中简洁、庄重，也不预先界定其确切时长。
- source_word: καθὼς ἠκούσατε
  choice: 正如你们听说
  rationale: “正如”体现 καθὼς 的对应关系；“听说”自然表达读者先前所领受的信息。
- source_word: ἀντίχριστος
  choice: 敌基督
  rationale: 采用约翰文献中这一称谓的通行中文译法，并保留单数与随后复数之间的词汇对应。希腊文此处没有冠词，中文本身也无需借冠词强行判定它是专指某一个体还是一个已知称谓。
- source_word: ἔρχεται
  choice: 要来
  rationale: 现在时在此具有面向未来、预期来临的意味；“要来”是自然的现代中文表达。
- source_word: καὶ νῦν
  choice: 如今已经
  rationale: 结合下文完成时，突出所预期之事与当下已有许多敌基督出现之间的对照。
- source_word: ἀντίχριστοι πολλοὶ
  choice: 许多敌基督
  rationale: 直接保留复数概念及其与前面单数称谓的联系；汉语名词本身不作形态复数变化，由“许多”明确标示复数。
- source_word: γεγόνασιν
  choice: 出现了
  rationale: 此完成时表明这些人物已经兴起并且目前仍然存在；“已经……出现了”自然呈现这种已发生且结果延续至今的意味。
- source_word: ὅθεν γινώσκομεν
  choice: 由此我们知道
  rationale: 清楚表达从前述现象得出判断的推论关系，并保留 γινώσκομεν 的认知意义。
theological_decisions:
- issue: “末时”的含义
  choice: 保留为具有末世意味、但时长未被界定的“末时”
  alternative: 译作“最后一个小时”或直接解释为“末世时代”
  rationale: 原文使用时间隐喻，语境显示其末世意义，却没有规定为字面六十分钟，也没有展开一套末世时间表；译文不应替原文消除这种张力。
- issue: 单数“敌基督”与“许多敌基督”的关系
  choice: 原样保留预期来临的单数称谓与当下出现的复数称谓
  alternative: 把单数明确解释为某个特定末世人物，或仅解释为一种泛称类别
  rationale: 约翰有意把读者先前所听见的单数表达与现实中的复数现象并置；中文译文不将二者体系化或彼此等同。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“孩子们”保留牧养性的亲切呼语；“末时”比“最后一小时”更不易引起字面时长的误会。中文没有冠词，因此不另设关于单数 ἀντίχριστος 有无定冠词的正文脚注；译文保持其真实指涉空间。
