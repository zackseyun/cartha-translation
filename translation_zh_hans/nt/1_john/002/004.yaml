  text: ὁ λέγων ⸀ὅτι Ἔγνωκα αὐτὸν καὶ τὰς ἐντολὰς αὐτοῦ μὴ τηρῶν ψεύστης ἐστίν, καὶ ἐν τούτῳ ἡ ἀλήθεια οὐκ ἔστιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/004.yaml
  text: The one who says[a], “I have come to know him,” and does not keep his commandments is a liar[b], and the truth is not in him.
translation:
  language: zh_hans
  text: 凡说：“我已经认识他”[a]，却不遵守他的命令的人，就是说谎者；真理不在这人里面[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我认识他。”希腊语的完成时可简洁地这样表达；“我已经认识他”更明显地体现由先前的认识所形成、持续至今的状态。
    reason: lexical_alternative
  - marker: b
    text: 或译：“他里面”或“这种人里面。”原文此处使用指示词，指前述作此宣称却不遵守命令的人。
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ λέγων
  choice: 那说……的人
  rationale: 带冠词的现在分词作名词用，泛指作出这种宣称的人；这一译法自然保留单数和概括性。
- source_word: Ἔγνωκα
  choice: 我已经认识
  rationale: γινώσκω 的完成时表达由先前认识而形成、延续至今的状态；“已经认识”兼顾完成体意味和现代汉语自然度。
- source_word: τὰς ἐντολὰς αὐτοῦ
  choice: 他的命令
  rationale: ἐντολή 指具有约束力的命令；“命令”是清楚、庄重的现代汉语，并保留约翰著作中的核心概念。
- source_word: μὴ τηρῶν
  choice: 却不遵守
  rationale: τηρέω 在此指持守、遵行命令；现在分词描写与所宣称的认识相冲突的持续行为，“却”明确呈现 καί 在语境中的转折作用。
- source_word: ψεύστης
  choice: 是说谎的
  rationale: 谓语名词 ψεύστης 对此人作直接的道德判断；“是说谎的”在现代汉语中比“是一个说谎者”更自然，同时没有弱化原文。
- source_word: ἐν τούτῳ
  choice: 在他里面
  rationale: 指回前述那个人；“在他里面”保留约翰式内在性表达，不将其解释性改写为“这种人并不诚实”。
- source_word: ἡ ἀλήθεια οὐκ ἔστιν
  choice: 真理不在
  rationale: 直译其否定系词结构，并保留“真理”可能兼有真实启示、属灵实在与诚实品格的丰富含义。
theological_decisions:
- issue: αὐτόν／αὐτοῦ 的所指
  choice: 以“他／他的”保留代词，不明确补成“神”或“基督”
  alternative: 明确译为“神”或“基督”
  rationale: 紧邻语境最自然地指向神，但约翰著作使父与子的认识紧密相连；保留代词可避免超出原文消除这种张力。
- issue: Ἔγνωκα 所表达的“认识”
  choice: 译为“已经认识”，表达已经形成并持续的关系状态
  alternative: 简译为“认识”或强化为属灵、亲密的认识
  rationale: 完成时支持持续结果，但原文没有明说认识的具体性质；译文既反映体貌，也不额外加入神秘或宗派性的解释。
- issue: ἡ ἀλήθεια 的含义
  choice: 保留为“真理”
  alternative: 译为“诚实”或“真实”
  rationale: 约翰语境中的“真理”可能同时涉及神的启示及人的真实品格；采用宽广的对应词，避免只取其中一义。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“那说……的人”保持泛指语气；“在他里面”有意保留约翰式表达。所有脚注标记均置于正文对应位置。
