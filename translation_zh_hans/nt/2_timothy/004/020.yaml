  yaml_path: translation/nt/2_timothy/004/020.yaml
  text: Erastus remained in Corinth[a], but I left Trophimus sick in Miletus.
translation:
  language: zh_hans
  text: 以拉都留在哥林多；我把生病的特罗非摩留在米利都。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔραστος
  choice: 以拉都
  rationale: 人名按现代中文圣经通行译法音译。
- source_word: ἔμεινεν
  choice: 留在
  rationale: μένω在此表示留在某地；“留在”自然、简洁，也适合行程交代的语境。
- source_word: ἐν Κορίνθῳ
  choice: 在哥林多
  rationale: ἐν加城市名作地点用法，译为“在哥林多”。
- source_word: Τρόφιμον
  choice: 特罗非摩
  rationale: 人名按现代中文圣经通行译法音译。
- source_word: δὲ
  choice: ；……就……
  rationale: δέ在两项行程交代之间表示轻微转折或推进。中文用分号区隔，并由后句自然表达语义关系，避免生硬地加“但是”。
- source_word: ἀπέλιπον
  choice: 我就把他留在
  rationale: ἀπολείπω第一人称单数不定过去时，意为“我留下／把……留在”；采用把字句，使中文清楚自然。
- source_word: ἐν Μιλήτῳ
  choice: 在米利都
  rationale: ἐν加城市名作地点用法，译为“在米利都”。
- source_word: ἀσθενοῦντα
  choice: 病了
  rationale: 现在分词修饰特罗非摩，说明保罗把他留下时他正患病；“病了”自然地保留这一伴随状态。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而自然的叙事语体。原文后半句直译次序为“我把患病的特罗非摩留在米利都”；中文调整为“特罗非摩病了，我就把他留在米利都”，清楚表达患病是留下他时的状态，不额外推断病因、严重程度或保罗留下他的目的。
