  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Δημᾶς γάρ με ⸀ἐγκατέλιπεν ἀγαπήσας τὸν νῦν αἰῶνα, καὶ ἐπορεύθη εἰς Θεσσαλονίκην, Κρήσκης εἰς Γαλατίαν, Τίτος εἰς Δαλματίαν·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/010.yaml
  text: For Demas deserted me[a], having loved the present age, and went to Thessalonica; Crescens to Galatia, Titus to Dalmatia.
translation:
  language: zh_hans
  text: 因为底马贪爱现今的世代〔a〕，离弃了我，往帖撒罗尼迦去了；革勒士往加拉太去，提多往挞马太去。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γάρ
  choice: 因为
  rationale: 承接上文，说明保罗为何请求提摩太赶紧前来；现代汉语用“因为”自然清楚。
- source_word: ἐγκατέλιπεν
  choice: 离弃
  rationale: 表达把保罗撇下的严重、负面意味，又不额外断言底马已经背弃信仰。
- source_word: ἀγαπήσας
  choice: 贪爱
  rationale: 分词在语境中很可能带原因意味；“贪爱”自然表达这种爱慕在道德上的负面色彩，但不增加经文未明说的具体行为。
- source_word: τὸν νῦν αἰῶνα
  choice: 现今的世代
  rationale: 保留 αἰών 的时间—伦理含义，避免让人误以为单指物质世界。
- source_word: ἐπορεύθη
  choice: 往……去了
  rationale: 以自然现代汉语表达前往某地，不额外说明出行方式。
- source_word: Θεσσαλονίκην
  choice: 帖撒罗尼迦
  rationale: 采用中文圣经传统中通行的地名译法。
- source_word: Κρήσκης
  choice: 革勒士
  rationale: 采用中文圣经传统中通行的人名译法。
- source_word: Γαλατίαν
  choice: 加拉太
  rationale: 采用中文圣经传统中通行的地区名称译法。
- source_word: Τίτος
  choice: 提多
  rationale: 采用中文圣经传统中通行的人名译法。
- source_word: Δαλματίαν
  choice: 挞马太
  rationale: 采用中文圣经传统中通行的地区名称译法。
theological_decisions:
- issue: 底马离去是否应译成明确的背道
  choice: 译作“离弃我”，保留行为的负面性质，却不明说他已经背弃信仰。
  alternative: 译成明确表示背道或离弃信仰的措辞。
  rationale: 经文明确说底马因贪爱现今的世代而离开保罗，但没有直接判定他最终背道，因此不越过原文作教义性推断。
- issue: 革勒士和提多的动词是否也带有底马“离弃”的负面含义
  choice: 把后两个省略分句理解为承接“往……去”，不重复“离弃我”。
  alternative: 将革勒士和提多也译为离弃保罗而去。
  rationale: 希腊文在两人名后仅列目的地，最自然是省略共同的移动动词；底马独有的原因说明和“离弃我”不应自动套用于另外两人。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。以“因为”明确与上文的因果衔接；用分号区分底马的负面离去与其余两人的行程，避免把同样的道德评价强加给革勒士和提多。
