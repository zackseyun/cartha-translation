id: 2TI.4.2
reference: 2 Timothy 4:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: κήρυξον τὸν λόγον, ἐπίστηθι εὐκαίρως ἀκαίρως, ἔλεγξον, ἐπιτίμησον, παρακάλεσον, ἐν πάσῃ μακροθυμίᾳ καὶ διδαχῇ.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/002.yaml
  text: Preach the word[a]; be ready in season and out of season; reprove, rebuke, exhort[c][b], with all patience and teaching.
translation:
  language: zh_hans
  text: 务要宣讲这道；无论时机合宜不合宜，都要准备妥当[a]；要指出过错，严厉责备，劝勉[b]；要以百般的忍耐和教导来做这一切。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “准备妥当”也可译作“务要迫切”或“坚持不懈”。希腊语命令可表示准备就绪、在场待命，也可强调紧迫地推进此事。
    reason: lexical_alternative
  - marker: b
    text: “劝勉”也可译作“鼓励”或“恳切劝告”。
    reason: lexical_alternative
lexical_decisions:
- source_word: κήρυξον
  choice: 宣讲
  rationale: 该命令式动词指公开传扬信息。“宣讲”既保留公开 proclamation 的分量，也符合现代汉语的牧养语境。
- source_word: τὸν λόγον
  choice: 这道
  rationale: λόγος 在此指提摩太受命传扬的使徒信息。“这道”保留经文熟悉而含义丰富的表达，不擅自限定为“福音”或“圣经”。
- source_word: ἐπίστηθι
  choice: 随时准备
  rationale: 该命令可指在场、站定、准备行动，也可能带有紧迫坚持之意。结合后面的 εὐκαίρως ἀκαίρως，“随时准备”在现代汉语中最自然；其他可能含义列入脚注。
- source_word: εὐκαίρως ἀκαίρως
  choice: 无论时机合宜不合宜
  rationale: 这对副词形成鲜明对照，表示不论处境是否有利、时机是否恰当；此译法清楚保留其修辞平衡。
- source_word: ἔλεγξον
  choice: 指出过错
  rationale: ἐλέγχω 有揭露错误并促使改正的含义。“指出过错”比单说“责备”更能体现揭明和纠正的作用，也与下一动词区分开来。
- source_word: ἐπιτίμησον
  choice: 严厉责备
  rationale: 此词表达较强烈的斥责或警告。“严厉责备”保留它相对于前一命令更尖锐的语气。
- source_word: παρακάλεσον
  choice: 劝勉
  rationale: παρακαλέω 可表示恳切劝告、鼓励或安慰。在这组牧养命令中，“劝勉”兼有敦促和扶持的意味；其语义幅度以脚注说明。
- source_word: ἐν πάσῃ μακροθυμίᾳ
  choice: 带着十足的忍耐
  rationale: μακροθυμία 指面对人时恒久忍耐，πάσῃ 加强其完整程度。“十足的忍耐”自然地传达这种全面、充分的意味。
- source_word: καὶ διδαχῇ
  choice: 并且善加教导
  rationale: διδαχή 指教导或训诲。采用动词化表达使现代汉语流畅，同时保留纠正、责备和劝勉必须伴随教导这一关系。
theological_decisions:
- issue: “这道”的范围
  choice: 主文译作“这道”，不扩写为“福音”或“圣经”。
  alternative: 可理解为“这信息”，或在上下文中具体关联福音及圣经。
  rationale: 上下文虽涉及使徒所传的信息和圣经，但本节 λόγος 本身没有明确缩窄其所指。保留“这道”可避免把经文未明说的范围固定下来。
- issue: ἐπίστηθι 的行动重点
  choice: 译作“随时准备”，并在脚注保留“迫切坚持”等可能。
  alternative: 可译作“务要迫切”“坚持不懈”或“随时在场”。
  rationale: 该动词在此既可强调准备就绪，也可强调紧迫地投入；与“时机合宜不合宜”连用时，两者均有解释依据，因此不把另一层意思排除。
- issue: 三项牧养命令的力度与关系
  choice: 分别译作“指出过错，严厉责备，劝勉”。
  alternative: 也可较概括地译作“责备、斥责、劝告”。
  rationale: 三个命令并列，既有揭明纠正，也有强烈警戒和正面敦促。译文保留其层次，不把它们合并成单一的惩戒行动。
translation_notes:
  register: 采用现代、庄重而易懂的牧函语体。分号保留原文连续命令的节奏；“务要”“这一切”帮助汉语读者把握整体劝诫。避免使用过度古雅的“得时不得时”和可能只强调讲坛活动的狭义措辞。
