base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/007.yaml
  text: I have fought the good fight[a], I have finished the race, I have kept the faith.
translation:
  language: zh_hans
  text: 那场美好的仗，我已经打过了；赛程，我已经跑完了；信仰[a]，我已经持守了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “信仰”也可译作“信”。希腊语“信”（πίστις）在这里可指所持守的信仰，也可能指所保持的信实或忠贞；全句也可理解为“我始终忠信”。
    reason: 保留τὴν πίστιν可指信仰内容或个人信实、忠贞的语义歧义。
lexical_decisions:
- source_word: καλὸν ἀγῶνα
  choice: 那美好的仗
  rationale: ἀγών可指竞赛、搏斗或奋斗；结合ἠγώνισμαι，并顾及本节交织的竞技与争战意象，译作“仗”简洁自然。καλός译作“美好”，保留其“良善、可嘉、高尚”的评价意味。
- source_word: ἠγώνισμαι
  choice: 我已经打过了
  rationale: 这是ἀγωνίζομαι的完成时形式，表示行动已经完成而其结果仍然成立。“已经打过了”与“仗”自然搭配，并与后两句的完成时形成整齐的三联结构。
- source_word: δρόμον
  choice: 当跑的路
  rationale: δρόμος可指跑程、赛程。“当跑的路”在现代汉语中自然，也显出人生使命如赛程的比喻；“路”比单用“赛程”更能容纳使命历程的含义。
- source_word: τετέλεκα
  choice: 我已经跑完了
  rationale: τελέω的完成时表示达到终点、完成。“跑完”与δρόμος的赛跑意象直接呼应，也保留完成后结果持续的意味。
- source_word: τὴν πίστιν
  choice: 所信的道
  rationale: 带冠词的πίστις在此可指保罗持守的信仰内容，也可能含守信、忠贞之意。“所信的道”在正文中清楚表达前一种语境较强的理解，同时以脚注保留后一种可能。
- source_word: τετήρηκα
  choice: 我已经守住了
  rationale: τηρέω可指持守、看守、保存。“守住”既可表示没有放弃，也带有护卫、保存的意味，适合与信仰内容或忠贞两种理解相连。
theological_decisions:
- issue: τὴν πίστιν的含义
  choice: 正文译作“所信的道”
  alternative: “信仰”；“信实”；“我始终忠信”
  rationale: 定冠词及《提摩太后书》中托付与持守真道的语境，使“信仰内容”成为较强理解；但πίστις也能表示忠信，τετήρηκα τὴν πίστιν还可能表达“守信、保持忠贞”。正文不把它具体化为某一套后世教义，脚注则明确保留这种真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。三句都以“我已经……”构成平行句式，反映三个希腊语完成时；分号强化原文的三联节奏。“那美好的仗”略带传统经文语感，但仍为普通读者可懂；“当跑的路”使赛跑意象和受托使命兼而有之。
