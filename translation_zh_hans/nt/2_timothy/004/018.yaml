  text: ⸀ῥύσεταί με ὁ κύριος ἀπὸ παντὸς ἔργου πονηροῦ καὶ σώσει εἰς τὴν βασιλείαν αὐτοῦ τὴν ἐπουράνιον· ᾧ ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων, ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/018.yaml
  text: The Lord will rescue me from every evil deed and will bring me safely into his heavenly kingdom[a]. To him be the glory forever and ever[c][b]. Amen.
translation:
  language: zh_hans
  text: 主必救我脱离一切恶事[a]，也必保全我，使我进入他属天的国度[b]。愿荣耀归给他，直到永永远远[c]。阿们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“一切邪恶的行为”。
    reason: lexical_alternative
  - marker: b
    text: 或译“也必救我进入他属天的国度”。
    reason: lexical_alternative
  - marker: c
    text: 直译“直到万世的万世”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥύσεταί
  choice: 必救我脱离
  rationale: ῥύομαι表示从危险或威胁中搭救、解救；“救我脱离”既符合现代汉语，也保留了原文ἀπό所表达的脱离关系。
- source_word: ἀπὸ παντὸς ἔργου πονηροῦ
  choice: 脱离一切邪恶的事
  rationale: ἔργον可指行为、作为或事情；“邪恶的事”保留了施害行为与邪恶之事两方面的可能性，不限定行为者，也不把它缩窄为肉身危害。
- source_word: σώσει
  choice: 必救我
  rationale: σῴζω具有拯救、保全之意，并在这里指向最终进入属天之国；采用“救”保留新约救恩用语的分量。
- source_word: εἰς τὴν βασιλείαν αὐτοῦ τὴν ἐπουράνιον
  choice: 进入他那属天的国
  rationale: “进入”体现εἰς所表达的目标和趋向；“属天的”准确表达ἐπουράνιος，也避免把国仅仅理解为一个位于天空的地方。
- source_word: κύριος
  choice: 主
  rationale: “主”是κύριος在此敬拜和权柄语境中的标准译法。
- source_word: ᾧ ἡ δόξα
  choice: 愿荣耀归给他
  rationale: 原文是颂赞公式；“愿荣耀归给他”以自然庄重的汉语表达其祝愿和归荣耀的语气。
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: 直到永永远远
  rationale: 这是表达无尽时长的习语；“直到永永远远”保留其加强语气，并符合现代汉语敬拜语域。
- source_word: ἀμήν
  choice: 阿们
  rationale: 采用现代中文基督教文本通行的音译，保留礼仪性的肯定语。
theological_decisions:
- issue: 当下的搭救与最终得救之间的关系
  choice: 译文同时保留“救我脱离”与“救我进入属天的国”，不把前者解释为必然免于死亡。
  alternative: 将本句明确译成主必使保罗逃过处决，或明确限定为只在属灵层面蒙保护。
  rationale: 两个动词ῥύσεταί和σώσει与“进入他那属天的国”并列，使经文既宣告主对邪恶的搭救，也表达最终得救的确信。原文本身没有承诺保罗必免于殉道，因此译文不替经文消除这一张力。
- issue: “一切邪恶的事”的施事者与范围
  choice: 保留宽泛表达，不说明这些邪恶之事是别人加害于保罗，还是使他陷入邪恶的行为。
  alternative: 明确译为“一切恶人的攻击”或“做任何恶事”。
  rationale: ἀπὸ παντὸς ἔργου πονηροῦ本身没有明说施事者；宽泛译法保留其真实歧义。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“救我进入”在汉语中略带原文结构的痕迹，但意思清楚，并保留σώσει εἰς中“拯救”与“进入目标”之间的紧密联系；脚注提供更顺畅的表达。
