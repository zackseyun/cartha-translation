source:
  edition: SBLGNT
  text: ἔσται γὰρ καιρὸς ὅτε τῆς ὑγιαινούσης διδασκαλίας οὐκ ἀνέξονται, ἀλλὰ κατὰ τὰς ⸂ἰδίας ἐπιθυμίας⸃ ἑαυτοῖς ἐπισωρεύσουσιν διδασκάλους κνηθόμενοι τὴν ἀκοήν,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/003.yaml
  text: For the time will come when they will not put up with sound teaching[a], but according to their own desires they will heap up teachers for themselves[b], having itching ears.
translation:
  language: zh_hans
  text: 因为时候将到，那时人们容不下健全的教导[a]，反而会顺着自己的欲望，为自己堆聚教师，耳朵发痒[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不能忍受健全的教义。”
    reason: lexical_alternative
  - marker: b
    text: 原文较字面地说：“耳朵发痒。”这意象表示渴望听自己爱听的话；原文的分词也可理解为伴随状态，或在语境中带有原因意味。
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: καιρὸς
  choice: 时候
  rationale: 这里指将要来到的特定时期；“时候将到”自然地保留了预告意味。
- source_word: ὑγιαινούσης διδασκαλίας
  choice: 健全的教导
  rationale: “健全”保留“健康、无病”的隐喻，也比“纯正教义”更通俗，且不增添宗派色彩。
- source_word: οὐκ ἀνέξονται
  choice: 容不下
  rationale: 表达不肯忍受、接纳的意味，在现代汉语中自然有力；脚注保留较形式对应的译法。
- source_word: κατὰ τὰς ἰδίας ἐπιθυμίας
  choice: 顺着自己的欲望
  rationale: κατά表示依照、顺应；ἐπιθυμίαι在此泛指支配其选择的个人欲求，不宜窄化为性欲。
- source_word: ἑαυτοῖς ἐπισωρεύσουσιν διδασκάλους
  choice: 为自己堆聚许多教师
  rationale: “为自己”保留反身与格的作用，“堆聚”保留动词所带大量累积的鲜明意象；补出“许多”使该意象在汉语中明晰。
- source_word: κνηθόμενοι τὴν ἀκοήν
  choice: 因为耳朵发痒，只想听合意的话
  rationale: 正文保留“耳朵发痒”的意象，并将其在本语境中的惯用含义明说出来，使普通读者易懂；“因为”采取可能的原因性理解，脚注注明原文结构与字面表达。
theological_decisions:
- issue: διδασκαλία在教牧书信语境中的译法
  choice: 教导
  alternative: 教义
  rationale: 该词在这里关乎正确而有益的训诲，但本身不要求采用更技术化的“教义”；“教导”既准确又避免引入额外的宗派联想。
- issue: κνηθόμενοι τὴν ἀκοήν与主句的逻辑关系
  choice: 作为原因表达：“因为耳朵发痒”
  alternative: 保留伴随表达：“耳朵发痒”或“有发痒的耳朵”
  rationale: 希腊语现在分词可表达伴随状态，也可在语境中带原因意味。正文采用自然的汉语原因表达，但脚注明示原文较字面的形式，以免掩盖语法上的开放性。
- issue: “耳朵发痒”意象的解释程度
  choice: 正文补明“只想听合意的话”
  alternative: 仅译“耳朵发痒”
  rationale: 这一补述表达该意象在语境中的功能，即渴望听迎合自身欲望的话，并未限定教师具体教授何种内容。脚注保留字面形式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“健全的教导”保留原文的健康隐喻；“堆聚”保留数量过多、不断累积的力度。正文中的每个脚注标记均与脚注对应。
