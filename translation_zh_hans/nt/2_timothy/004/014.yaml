id: 2TI.4.14
reference: 2 Timothy 4:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ἀλέξανδρος ὁ χαλκεὺς πολλά μοι κακὰ ἐνεδείξατο— ⸀ἀποδώσει αὐτῷ ὁ κύριος κατὰ τὰ ἔργα αὐτοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/014.yaml
  text: Alexander the metalworker showed me many evils[c][b][a]; the Lord will repay him according to his works.
translation:
  language: zh_hans
  text: 金属匠[a]亚历山大对我做了许多恶事[b]；主必照他的行为报应他。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“铜匠”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“给我造成了许多伤害”。
    reason: lexical_alternative
  - marker: c
    text: 有些抄本作：“愿主照他的行为报应他。”
    reason: textual_variant
lexical_decisions:
- source_word: χαλκεὺς
  choice: 金属匠
  rationale: 该词指从事金属加工的工匠，常涉及铜或青铜，但原文在此不必限定具体金属。“金属匠”既符合词义范围，也避免过度具体化；传统译法“铜匠”列入脚注。
- source_word: πολλά μοι κακὰ ἐνεδείξατο
  choice: 对我做了许多恶事
  rationale: 原短语直指亚历山大向保罗表现、施行了“许多恶事”。此译保留 κακά 的道德色彩，同时比逐字式的“向我显出许多恶”更符合现代汉语；“给我造成许多伤害”作为较侧重结果的译法列入脚注。
- source_word: ἀποδώσει
  choice: 必……报应
  rationale: 该词为将来时直陈语气，表示主将按其行为施行相应的回报。“报应”在此自然传达司法性、报偿性的含义，“必”则清楚体现陈述而非祈愿。
- source_word: ὁ κύριος
  choice: 主
  rationale: 定冠词表明所指明确；现代汉语中以“主”自然表达这一称谓，无须另加对应冠词的词语。
- source_word: κατὰ τὰ ἔργα αὐτοῦ
  choice: 照他的行为
  rationale: “照”保留 κατά 所表达的衡量标准，“行为”准确对应复数 ἔργα，并符合现代中文圣经语体。
theological_decisions:
- issue: 将 ἀποδώσει 理解为将来的陈述，还是祈愿
  choice: 主必照他的行为报应他
  alternative: 愿主照他的行为报应他
  rationale: SBLGNT 正文的 ἀποδώσει 是将来时直陈语气，因此正文译作确定的将来陈述，不把保罗的话改写成咒诅或祈愿；抄本异文所反映的祈愿读法保留在脚注中。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“金属匠”避免无根据地限定金属种类；“对我做了许多恶事”兼顾原文的道德力度与中文可读性。标点将警告性的前半句与关于主之报偿的陈述清楚分开。
