id: 2TI.4.1
reference: 2 Timothy 4:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ⸀Διαμαρτύρομαι ἐνώπιον τοῦ θεοῦ καὶ ⸂Χριστοῦ Ἰησοῦ⸃, τοῦ μέλλοντος κρίνειν ζῶντας καὶ νεκρούς, ⸀καὶ τὴν ἐπιφάνειαν αὐτοῦ καὶ τὴν βασιλείαν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/001.yaml
  text: 'I solemnly charge you before God and Messiah Jesus[a], who is about to judge the living and the dead[b], and by his appearing and his kingdom:'
translation:
  language: zh_hans
  text: 我在上帝和基督耶稣面前——他将要审判活人和死人[a]——并凭着他的显现和他的国[b]，郑重嘱咐你：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他将审判活人和死人。”
    reason: μέλλω 可侧重一般的未来性，不一定强调时间上的临近。
  - marker: b
    text: 或译：“以及他的显现和他的国。”希腊文在此处的句法关系较为含蓄。
    reason: 原文的两个宾格通常可理解为郑重嘱咐所凭借的事项，但也可以更直接地保留为并列成分。
lexical_decisions:
- source_word: Διαμαρτύρομαι
  choice: 郑重嘱咐你
  rationale: 在书信中的委任语境里，这个动词表示严肃而有权威的嘱咐，不只是“作证”。希腊文未明说宾语，但上下文清楚指向提摩太，因此汉语补出“你”。
- source_word: ἐνώπιον
  choice: 在……面前
  rationale: 自然地表达处于上帝和基督耶稣的临在与鉴察之下。
- source_word: Χριστοῦ Ἰησοῦ
  choice: 基督耶稣
  rationale: “基督”是现代中文圣经语域中对 Χριστός 的通行称谓，仍保留其受膏者、弥赛亚的头衔含义；与“耶稣”连用也符合庄重的书信语体。
- source_word: τοῦ μέλλοντος κρίνειν
  choice: 他将要审判
  rationale: “将要”既表达 μέλλω 的未来指向，也保留其可能带有的临近感，而不替经文规定具体时间。
- source_word: ζῶντας καὶ νεκρούς
  choice: 活人和死人
  rationale: 简洁、自然地保留审判对象的全面范围。
- source_word: ἐπιφάνειαν
  choice: 显现
  rationale: 直接表达 ἐπιφάνεια 的公开、可见显露之意，并符合本书的末世语境。
- source_word: βασιλείαν
  choice: 国
  rationale: 此处指基督的王国；“国”在“他的国”这一搭配中自然庄重，同时不把含义缩减为抽象的“统治”。
- source_word: καὶ τὴν ἐπιφάνειαν αὐτοῦ καὶ τὴν βασιλείαν αὐτοῦ
  choice: 并凭着他的显现和他的国
  rationale: 把两个宾格名词理解为庄严嘱咐所凭借的事项，使汉语句法清楚；脚注保留希腊文较含蓄、仅作并列的可能。
theological_decisions:
- issue: μέλλω 在末世审判陈述中的力度
  choice: 将要审判
  alternative: 将审判
  rationale: “将要”保留原文对未来及可能临近性的表达，但不据此设定审判时间。
- issue: “他的显现和他的国”与郑重嘱咐之间的句法关系
  choice: 凭着他的显现和他的国
  alternative: 以及他的显现和他的国
  rationale: 两个宾格通常可理解为誓言或郑重嘱咐公式所凭借的事项；然而希腊文的连接方式较为特殊，因此以脚注保留更隐含的并列读法。
- issue: 关系分句所指对象
  choice: 以破折号将“他将要审判活人和死人”紧接在“基督耶稣”之后
  alternative: 改写为“那位将要审判活人和死人的基督耶稣”
  rationale: 此处理清代词所指，同时避免冗长定语使庄严嘱咐的主干难以辨认，也不改变审判者是基督耶稣这一原文结构。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。破折号标出插入的关系分句，使“在……面前……郑重嘱咐你”的主干清晰；句末冒号承接下一节具体的命令。
