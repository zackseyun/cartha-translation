  text: Ἐγὼ γὰρ ἤδη σπένδομαι, καὶ ὁ καιρὸς τῆς ⸂ἀναλύσεώς μου⸃ ἐφέστηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/006.yaml
  text: For I am already being poured out as a drink offering[b][a], and the time of my departure has come.
translation:
  language: zh_hans
  text: 因为我已经正像奠祭一样被浇献[a]，我离世的时刻已经来到[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我已经正被浇献。”希腊文动词使人联想到献祭时把奠酒倾倒出来。
    reason: lexical_alternative
  - marker: b
    text: “离世”所译的词也含有离开、松开或释放的意思；这里是对死亡的委婉说法。
    reason: alternative_reading
lexical_decisions:
- source_word: σπένδομαι
  choice: 像奠祭一样被浇献
  rationale: 保留动词所唤起的奠酒祭祀意象及其被动语态；“浇献”既表达倾倒，也表达献祭，避免直接释作“将要死去”。
- source_word: ἤδη
  choice: 已经
  rationale: 表示这件事如今已经在发生，与保罗感到死亡迫近的语境相符。
- source_word: καιρός
  choice: 时候
  rationale: 此处指一个决定性的时刻；“时候”自然易懂，并由“已经到了”传达其已然临到。
- source_word: ἀναλύσεώς
  choice: 离世
  rationale: 该名词可含离开、解开或释放之意；在本语境中委婉指死亡。“离世”在现代汉语中自然，同时保留离开的意象。
- source_word: ἐφέστηκεν
  choice: 已经到了
  rationale: 完成时表达某时刻已经临到并处于当前状态；此译法兼顾已然性与临近死亡的语境。
- source_word: γὰρ
  choice: 因为
  rationale: 明确保留本句对上文的解释关系。
- source_word: καί
  choice: 也
  rationale: 自然连接两个并列陈述：被浇献与离世之时已经到来。
theological_decisions:
- issue: 保罗对自己死亡的隐喻性描述
  choice: 保留“像奠祭一样被浇献”以及“离世”两个意象
  alternative: 直接译作“我快要死了”或将其泛化为受苦
  rationale: σπένδομαι的祭祀意象与ἀνάλυσις在此共同指向迫近的死亡，但原文并未直说“死亡”；保留隐喻可避免消除其献祭色彩与委婉表达。
- issue: σπένδομαι的时态意义
  choice: 我已经……被浇献了
  alternative: 我即将被浇献
  rationale: 原文是现在时被动式，并由ἤδη修饰，重点是行动已在进行，而不只是未来将发生；中文用“已经……被浇献了”表达这种已然状态。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“奠祭”保留古代祭祀背景，“像……一样”使隐喻关系清楚；脚注标记均置于相关短语之后。
