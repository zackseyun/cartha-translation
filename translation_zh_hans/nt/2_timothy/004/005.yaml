  text: σὺ δὲ νῆφε ἐν πᾶσιν, κακοπάθησον, ἔργον ποίησον εὐαγγελιστοῦ, τὴν διακονίαν σου πληροφόρησον.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/005.yaml
  text: But as for you[a], keep a clear head in all things, endure hardship, do the work of an evangelist[c][b], fully carry out your ministry.
translation:
  language: zh_hans
  text: 但你要凡事保持清醒[a]，忍受苦难[b]，做传福音者的工作，尽你的职事[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“凡事谨慎自持”“凡事头脑清醒”。希腊文原可指不醉酒，但在新约中均比喻思想清明、沉着警醒。
    reason: lexical_alternative
  - marker: b
    text: 或译：“甘受苦难”或“经受苦难”。
    reason: lexical_alternative
  - marker: c
    text: 或译：“充分履行你的服事”或“完成你的职事”。这里的希腊动词含有充分完成、履行到底的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ δὲ
  choice: 但你却要
  rationale: σὺ具有强调作用，δέ承接上文并形成对比；“但你却要”自然地保留了这种转折和对提摩太本人的强调。
- source_word: νῆφε
  choice: 保持清醒
  rationale: νήφω本义与不醉酒有关，但新约中均作比喻用，表示思想清明、沉着自持。“保持清醒”在现代汉语中简明自然，也能表达压力之下警醒稳健的要求。
- source_word: ἐν πᾶσιν
  choice: 凡事
  rationale: 该短语最自然地修饰νῆφε，表示全面性；“凡事”简洁地保留了希腊文未明确限定为各种处境或所有时刻的宽泛含义。
- source_word: κακοπάθησον
  choice: 忍受苦难
  rationale: 该命令要求提摩太接受并坚忍地面对患难；“忍受苦难”同时传达受苦与坚持承受的意味。
- source_word: ἔργον ποίησον
  choice: 做……的工作
  rationale: 这是自然直接的汉语表达，保留了希腊文命令语气，不作不必要的扩充。
- source_word: εὐαγγελιστοῦ
  choice: 传福音者
  rationale: 该名词指宣告福音的人。“传福音者”准确保留其行动和角色含义，同时不把它限定为某一宗派中的正式职位。
- source_word: τὴν διακονίαν σου
  choice: 你的服事
  rationale: διακονία可指服务或职事；本段语境是提摩太受托承担的福音和牧养工作，因此“服事”既保留服务性质，也符合这里的事工语境。
- source_word: πληροφόρησον
  choice: 彻底完成
  rationale: 该动词在此表示充分履行、完成到底。“彻底完成”明确表达其完成至充分程度的语义，同时避免只译作一般性的“完成”而削弱力度。
theological_decisions:
- issue: διακονία所指的服事性质
  choice: 译为“服事”
  alternative: “服务”或“职事”
  rationale: 上下文涉及提摩太受托的传道和牧养责任。“服事”既能体现其受托工作的事奉性质，又不将其技术化为某种特定教会制度或圣职。
- issue: εὐαγγελιστής是否表示正式职衔
  choice: 译为“传福音者”，保留角色名称而不说明其是否为正式职衔
  alternative: “传福音的人”或“福音使者”
  rationale: 希腊文可以指从事宣讲福音工作的人，但本节本身没有界定这是否为固定教会职位，因此译文保留这种开放性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“保持清醒”避免过度书面化，同时由脚注说明其比喻义；“传福音者”保留原文角色称谓而不引入宗派性的职位观；“服事”贴合语境，但以脚注保留“职事”等可行译法。
