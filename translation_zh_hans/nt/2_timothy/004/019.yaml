  yaml_path: translation/nt/2_timothy/004/019.yaml
  text: Greet Prisca and Aquila[a], and the household of Onesiphorus.
translation:
  language: zh_hans
  text: 请问候普里斯卡[a]、亚居拉和阿尼色弗家中的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊原文作“普里斯卡”；别处也称她为“普里斯西拉”（例如《使徒行传》18:2、18、26）。
    reason: 说明本节采用的名字形式，并交代同一人物在别处所用的另一名字形式。
lexical_decisions:
- source_word: Ἄσπασαι
  choice: 请问候
  rationale: 这是ἀσπάζομαι的不定过去时中间语态命令式，在书信结尾表示托人致意。“请问候”自然地保留命令语气，也不额外加入原文没有明说的热情程度。
- source_word: Πρίσκαν
  choice: 普里斯卡
  rationale: 按本节所用正式名字Πρίσκα音译，避免用别处出现的指小形式Πρίσκιλλα取代原文；脚注说明两种名字形式的关系。
- source_word: Ἀκύλαν
  choice: 亚居拉
  rationale: 采用该人名在现代中文圣经传统中通行且易于辨认的译名。
- source_word: τὸν Ὀνησιφόρου οἶκον
  choice: 阿尼色弗一家的人
  rationale: 这里οἶκος在问候语境中指家中或家庭群体，而非房屋建筑；“一家的人”保留其可包括家属及其他家中成员的范围，不限于血亲。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重而自然的现代书信语体。“请问候”适合中文委托致意的表达；并列人名使用顿号，“和”连接最后一项。人名兼顾原文形式与中文可辨识度。
