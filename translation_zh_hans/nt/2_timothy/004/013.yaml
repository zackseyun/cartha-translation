  text: τὸν φαιλόνην, ὃν ⸀ἀπέλιπον ἐν Τρῳάδι παρὰ Κάρπῳ, ἐρχόμενος φέρε, καὶ τὰ βιβλία, μάλιστα τὰς μεμβράνας.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/013.yaml
  text: When you come[a], bring the cloak that I left in Troas with Carpus, and the books[b], especially the parchments.
translation:
  language: zh_hans
  text: 你来的时候，要把我留在特罗亚、在加布那里的斗篷[a]带来，也要把那些书卷[b]带来，尤其是那些皮卷[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有人把这个词理解为装书的套子或包裹，但其通常含义是披在外面的衣物。
    reason: lexical_alternative
  - marker: b
    text: 或译“书籍”；希腊词可指卷轴、书卷或类似的书写材料。
    reason: lexical_alternative
  - marker: c
    text: 指用处理过的兽皮制成的书写材料或文卷。
    reason: historical_cultural_clarification
lexical_decisions:
- source_word: φαιλόνην
  choice: 斗篷
  rationale: 该词通常指披在外面的厚外衣。“斗篷”是现代汉语中自然、明确的对应词；虽有人提出“书套”等解释，但主要词义和上下文更支持衣物。
- source_word: ἀπέλιπον
  choice: 我留在
  rationale: 该词为第一人称单数不定过去时，表示“我留下”或“我留在某处”；结合地点短语，译作“我留在”简洁自然。
- source_word: ἐν Τρῳάδι παρὰ Κάρπῳ
  choice: 在特罗亚加布那里
  rationale: παρά加与格在这里表示物品位于某人处或由某人照管。“加布那里”保留了“在其住处”与“由其保管”之间的细微开放性。
- source_word: ἐρχόμενος
  choice: 你来的时候
  rationale: 该分词修饰命令语气动词，最自然地表达与“带来”相关的时间情境。
- source_word: φέρε
  choice: 带来
  rationale: 命令语气要求提摩太将物品带到写信人这里；“带来”准确表达趋向。
- source_word: τὰ βιβλία
  choice: 那些书卷
  rationale: βιβλία可泛指书籍、卷轴或其他成篇的书写材料。“书卷”符合古代载体背景，同时不限定具体内容。
- source_word: μάλιστα
  choice: 尤其
  rationale: 该词突出后项在所请求物品中的特别重要性；“尤其”清楚而自然。
- source_word: τὰς μεμβράνας
  choice: 那些皮卷
  rationale: μεμβράνα指以处理过的兽皮制成的书写材料或文卷。“皮卷”既与前面的普通书卷有所区分，也避免把兽皮种类武断限定为羊皮。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“斗篷”“书卷”“皮卷”简洁呈现三类物品；句中重复“带来”，使并列命令在汉语中清楚顺畅。人名、地名采用常见译法“加布”“特罗亚”。
