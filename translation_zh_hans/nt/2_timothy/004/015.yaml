  text: ὃν καὶ σὺ φυλάσσου, λίαν γὰρ ⸀ἀντέστη τοῖς ἡμετέροις λόγοις.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/015.yaml
  text: You also must beware of him[a], for he strongly opposed our words.
translation:
  language: zh_hans
  text: 你也要提防他，因为他极力反对我们所说的话[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我们的信息”或“我们的教导”。希腊文直译为“我们的话”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃν
  choice: 他
  rationale: 关系代词回指上一节的亚历山大；汉语用“他”自然承接前文。
- source_word: καὶ σὺ
  choice: 你也
  rationale: 保留καὶ与强调代词σὺ所表达的追加和强调：不仅保罗遭到他的伤害，提摩太也须警惕。
- source_word: φυλάσσου
  choice: 要提防
  rationale: 现在时中间语态命令式要求提摩太持续亲自保持戒备；“要提防”既自然，也保留警告和命令的力度。
- source_word: λίαν
  choice: 极力
  rationale: 该副词加强“反对”的程度；“极力反对”是现代汉语中自然且有力度的搭配。
- source_word: ἀντέστη
  choice: 反对
  rationale: 该词表示站在对立面、抵抗；“反对”清楚自然，不把动作具体化为暴力抵抗。
- source_word: τοῖς ἡμετέροις λόγοις
  choice: 我们所说的话
  rationale: 贴近λόγοι的基本含义，同时比生硬的“我们的言语”更符合现代汉语；不擅自限定为法庭证词、福音信息或教义教导。
theological_decisions:
- issue: “我们所说的话”的范围
  choice: 保留宽泛表述，指保罗及其同工所说的话，但不具体界定其场合或内容。
  alternative: 译作“我们的信息”“我们的教导”或“我们的辩词”。
  rationale: 原文λόγοι本身不能确定所指究竟是法庭上的申辩、公开传讲的信息，还是教义教导；正文不应消除这种真实的语义开放性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“提防”适合针对具体人物的持续警戒；“极力反对”准确传达强烈程度。脚注标记置于相关短语之后，以说明λόγοι可能的语境性译法。
