id: 2TI.4.22
reference: 2 Timothy 4:22
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ὁ ⸀κύριος μετὰ τοῦ πνεύματός σου. ἡ χάρις μεθ’ ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/022.yaml
  text: The Lord be with your spirit[a]. Grace be with you all.
translation:
  language: zh_hans
  text: 愿主与你的灵同在[a]。愿恩典与你们同在。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊原文在这里由单数转为复数：“你的灵”是单数，下一句的“你们”是复数。
    reason: 说明原文中的人称数变化；现代汉语正文虽已体现，但脚注可帮助读者注意其意义。
lexical_decisions:
- source_word: κύριος
  choice: 主
  rationale: 按新约书信祝福语的通常用法译为“主”，保留其确定而未明说姓名的称谓，不擅自增补“耶稣”。
- source_word: μετὰ
  choice: 与……同在
  rationale: 原文省略动词；汉语祝福语需补出“同在”，以自然表达原文所含的祈愿语气。
- source_word: πνεύματός
  choice: 灵
  rationale: 与单数所有格“你的”连用，最自然地指提摩太的灵；译作“灵”而不写成“圣灵”，避免过度解释。
- source_word: σου
  choice: 你的
  rationale: 保留第二人称单数，表明第一句直接向提摩太个人祝福。
- source_word: χάρις
  choice: 恩典
  rationale: “恩典”是保罗书信祝福语中 χάρις 的自然且有神学分量的现代汉语表达。
- source_word: ὑμῶν
  choice: 你们
  rationale: 明确保留第二人称复数，与前句单数“你的”形成原文中的数变化。
theological_decisions:
- issue: “主”的所指
  choice: 保留“主”这一称谓；语境很可能指主耶稣
  alternative: 明确译成“主耶稣”，或理解为对上帝的一般称呼
  rationale: 保罗书信结尾的此类祝福语通常以“主”指耶稣，但希腊文没有明说姓名，因此正文不增补“耶稣”，以保留原文措辞。
- issue: 两句之间人称数的变化
  choice: 第一句用单数“你的”，第二句用复数“你们”
  alternative: 两句都只理解为对提摩太个人所说
  rationale: 原文清楚地由 σου（单数）转为 ὑμῶν（复数），显示后一祝福扩及与收信人相关的群体，应在译文中保留。
translation_notes:
  register: 采用现代、庄重而易懂的书信祝福语体。“愿……同在”补足希腊文省略的祈愿动词；不使用“众人”一类原文未明说的名词，但以“你们”准确体现复数。
