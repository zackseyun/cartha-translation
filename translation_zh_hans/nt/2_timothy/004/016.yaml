id: 2TI.4.16
reference: 2 Timothy 4:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ἐν τῇ πρώτῃ μου ἀπολογίᾳ οὐδείς μοι ⸀παρεγένετο, ἀλλὰ πάντες με ⸀ἐγκατέλιπον— μὴ αὐτοῖς λογισθείη—
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/016.yaml
  text: At my first defense no one stood with me[a], but all deserted me[c][b]. May it not be counted against them.
translation:
  language: zh_hans
  text: 我第一次申辩时[a]，没有人前来支持我[b]，反而所有人都离弃了我。愿这事不算在他们身上[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “申辩”也可译作“受审时的答辩”；这里指在司法场合所作的正式辩护。
    reason: lexical_alternative
  - marker: b
    text: 希腊文直译为“没有人来到我身边在场”，这里指没有人出庭支持保罗。
    reason: lexical_alternative
  - marker: c
    text: 或译：“愿这事不归罪于他们。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολογίᾳ
  choice: 申辩
  rationale: 在司法语境中指面对掌权者所作的正式答辩或辩护。“申辩”自然简洁，并保留法律意味，不把它泛化为普通解释。
- source_word: πρώτῃ
  choice: 第一次
  rationale: 直接表达首次或第一阶段的申辩；原文未说明具体程序，译文也不加以限定。
- source_word: παρεγένετο
  choice: 前来支持我
  rationale: 该词本义是来到并在场；在此司法处境中，所指不只是出现，更是到场支持保罗。译法兼顾实际在场与声援之意。
- source_word: οὐδείς
  choice: 没有人
  rationale: 直接、自然地表达全然否定，符合现代汉语叙述。
- source_word: ἐγκατέλιπον
  choice: 离弃了我
  rationale: 表示在困境中撇下某人。“离弃”保留关系和处境上的严重性，同时具有庄重语体。
- source_word: λογισθείη
  choice: 算在……身上
  rationale: 保留该词核算、归算的比喻，也能表达被算作过错的司法意味；被动祈愿语气以“愿……不……”呈现。
- source_word: μὴ αὐτοῖς λογισθείη
  choice: 愿这事不算在他们身上
  rationale: 希腊文以否定词加不定过去时被动祈愿语气表达愿望或祈求。补出汉语所需的“这事”，所指仍由上下文确定，不进一步解释其神学机制。
theological_decisions:
- issue: 保罗末句对离弃他之人的语气
  choice: 译作祈愿：“愿这事不算在他们身上。”
  alternative: “不要把这事归罪于他们。”
  rationale: λογισθείη 为祈愿语气，宜保留愿望或祈求的色彩；“算在……身上”也保留归算与司法问责之间的张力，不将其扩展为更具体的教义陈述。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“反而”清楚呈现 οὐδείς…ἀλλά πάντες 的强烈对比；末句保持简短的祈愿语气。所有脚注标记均置于正文相应位置。
