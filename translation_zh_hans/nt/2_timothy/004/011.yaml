  text: Λουκᾶς ἐστιν μόνος μετ’ ἐμοῦ. Μᾶρκον ἀναλαβὼν ἄγε μετὰ σεαυτοῦ, ἔστιν γάρ μοι εὔχρηστος εἰς διακονίαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/011.yaml
  text: Luke alone is with me. Pick up Mark and bring him with you, for he is useful to me for ministry.
translation:
  language: zh_hans
  text: 只有路加和我在一起。你要带上马可，同他一起来，因为他在服事[a]上对我很有用。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “服事”或译“服务”。希腊语διακονία可泛指服务；这里很可能指事工方面的服事。
    reason: lexical_alternative
lexical_decisions:
- source_word: Λουκᾶς
  choice: 路加
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: μόνος
  choice: 只有
  rationale: 明确表达路加是当时唯一与保罗同在的人；中文“只有路加”自然保留其排他性。
- source_word: μετ’ ἐμοῦ
  choice: 和我在一起
  rationale: 直接表达 μετά 加属格所表示的陪伴、同在。
- source_word: Μᾶρκον
  choice: 马可
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: ἀναλαβὼν
  choice: 接上
  rationale: 在行程语境中表达先找到并带上马可，再一同前来的次序；比单说“带”更能体现分词的动作。
- source_word: ἄγε μετὰ σεαυτοῦ
  choice: 带他一同来
  rationale: 按上下文补出宾语“他”，并自然表达让马可与提摩太同行到保罗那里。
- source_word: γάρ μοι
  choice: 因为……对我
  rationale: “因为”保留 γάρ 说明前述命令理由的功能，“对我”表达 μοι 的关系或受益含义。
- source_word: εὔχρηστος
  choice: 很有用
  rationale: 准确表达适用、能提供实际帮助之意，并以自然现代汉语呈现。
- source_word: εἰς διακονίαν
  choice: 在服事的事上
  rationale: 保留 διακονία 可指广义服务、也可指事工服事的语义幅度，避免把它限定为正式职分。
theological_decisions:
- issue: διακονία 在马可对保罗有用这一陈述中的含义
  choice: 服事
  alternative: 事奉；事工；服务
  rationale: “服事”适合使徒工作的语境，同时仍可泛指实际服务，不把该词收窄为教会中的正式职位或特定事工。脚注交代其较宽泛的译法。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“接上马可，带他一同来”保留原文先带上马可、再同行前来的动作关系；“服事”兼顾本段事工语境与原词较宽的含义。
