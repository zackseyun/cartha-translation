  text: καὶ ἀπὸ μὲν τῆς ἀληθείας τὴν ἀκοὴν ἀποστρέψουσιν, ἐπὶ δὲ τοὺς μύθους ἐκτραπήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/004.yaml
  text: and they will turn away their hearing from the truth[b][a], and turn aside to myths.
translation:
  language: zh_hans
  text: 他们必转耳不听真理[a]，反而转向神话[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“把耳朵从真理转开”；希腊文直译为“把听觉从真理转开”。
    reason: lexical_alternative
  - marker: b
    text: 或译“传说”或“虚构的故事”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀληθείας
  choice: 真理
  rationale: 希腊文带定冠词，语境指人所熟知的使徒教导之真理；现代汉语用“真理”已能自然表达这一确定所指，无须增译为“纯正教义”或“福音真理”。
- source_word: ἀκοὴν
  choice: 掩耳不听
  rationale: ἀκοή可指听觉、听闻或聆听。与ἀποστρέφω连用，表达主动拒绝聆听；“掩耳不听”是自然、形象的现代汉语，同时保留从真理转开听觉的隐喻。
- source_word: ἀποστρέψουσιν
  choice: 必掩耳不听
  rationale: 该动词表示转开、使离开；此处以“听觉/听闻”为宾语，译法保留其主动而有意拒绝的意味。
- source_word: μύθους
  choice: 荒诞的传说
  rationale: μῦθος在本语境中指与真理相对的虚构、臆造或不可靠的叙事。“传说”比“神话”覆盖面更宽，也比“荒渺的话”更符合现代汉语；加“荒诞的”明确其贬义。
- source_word: ἐκτραπήσονται
  choice: 转向
  rationale: 该将来被动/中动形式可自然理解为偏离后转向某物；“转向”保留方向变化，不额外断定是被他人诱导还是自行偏离。
- source_word: ἀπὸ μὲν ... ἐπὶ δὲ
  choice: 不听……反而转向……
  rationale: 以“不听”与“反而转向”呈现μέν…δέ及ἀπό…ἐπί所构成的鲜明对照：离开真理，转向传说。
theological_decisions:
- issue: “真理”在上下文中的范围
  choice: 保留“真理”这一较宽泛的表述
  alternative: 纯正的教义；福音真理
  rationale: 上下文虽指向使徒教导，但原文只用ἀλήθεια。译文不将其收窄为某一解释，以保留原文的神学广度。
- issue: 转向传说时的施事关系
  choice: 用不及物的“转向”
  alternative: 被引向；被诱入
  rationale: ἐκτραπήσονται的形态容许被动或中动理解；汉语“转向”不强行确定外在诱导或自身偏离，保留原文张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“掩耳不听”通俗易懂并保留听觉隐喻；“反而”清楚呈现两分句的对照。所有脚注标记均置于正文相应词语之后。
