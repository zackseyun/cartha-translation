    issue: 脚注加入“得以伸冤”的解释。
    rationale: δικαιοσύνη 可有“公义／公正（正义）”的语义范围，而“公义的冠冕”的属格关系确有未决之处；但“得以伸冤”是更特定的诠释性结果，并非该短语直接表达的可安全词汇替代。应改为仅说明“公义／公正”及属格关联未定。
  - severity: low
    issue: “那公义的冠冕”在现代汉语中略显指示词负担。
    rationale: 希腊语定冠词不必逐一以“那”对应。中文用“公义的冠冕”已足以自然、准确地表达该名词短语。
  revised_text: 从今以后，公义的冠冕已为我存留；主，就是那公义的审判者，要在那日把这冠冕赐给我；不但赐给我，也赐给所有爱慕他显现的人。
  revised_footnotes:
