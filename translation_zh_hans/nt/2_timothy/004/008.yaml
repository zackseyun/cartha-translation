id: 2TI.4.8
reference: 2 Timothy 4:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: λοιπὸν ἀπόκειταί μοι ὁ τῆς δικαιοσύνης στέφανος, ὃν ἀποδώσει μοι ὁ κύριος ἐν ἐκείνῃ τῇ ἡμέρᾳ, ὁ δίκαιος κριτής, οὐ μόνον δὲ ἐμοὶ ἀλλὰ καὶ πᾶσιν τοῖς ἠγαπηκόσι τὴν ἐπιφάνειαν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/008.yaml
  text: From now on the crown of righteousness is laid up for me[a], which the Lord, the righteous judge, will award to me on that day—and not only to me, but also to all who have loved his appearing.
translation:
  language: zh_hans
  text: 从今以后，公义的冠冕已为我存留；主，就是那公义的审判者，要在那日把这冠冕赐给我；不但赐给我，也赐给所有爱慕他显现的人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λοιπὸν
  choice: 从今以后
  rationale: 承接上文保罗已经跑完赛程的陈述，表示此后为他存留之事，保留时间含义。
- source_word: ἀπόκειταί
  choice: 已经为我存留
  rationale: 表达某物已被保留、妥善存放的现存状态；“已经”也自然体现希腊语现在时所描述的既定状态。
- source_word: ὁ τῆς δικαιοσύνης στέφανος
  choice: 那公义的冠冕
  rationale: 保留属格结构，不限定它究竟是因公义而得的冠冕、以公义为内容的冠冕，还是关乎伸冤与称义的冠冕。
- source_word: δικαιοσύνης
  choice: 公义
  rationale: “公义”是现代中文圣经语境中自然且庄重的对应，也能涵盖品格正直与公正裁断的语义范围；另一可能“公正”收入脚注。
- source_word: ἀποδώσει
  choice: 必将它赐给
  rationale: 结合竞赛冠冕的意象，表达按应许或应得而授予，同时避免“报还”在中文中可能产生的负面意味。
- source_word: κύριος
  choice: 主
  rationale: 直接保留称号；上下文中的“他显现”强烈指向基督，但正文不扩写为“主耶稣”。
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: 到了那日
  rationale: 符合现代汉语时间表达，并保留末世审判之日的指向。
- source_word: ὁ δίκαιος κριτής
  choice: 那公义的审判者
  rationale: 作为同位语说明主在审判中的品格；“审判者”较“审判官”更适合此处末世语境。
- source_word: πᾶσιν τοῖς ἠγαπηκόσι
  choice: 所有爱慕……的人
  rationale: “爱慕”自然表达持续而坚定地珍爱、盼望其显现；中文不生硬复制完成时形式，但保留稳定倾向。
- source_word: ἐπιφάνειαν
  choice: 显现
  rationale: 直接保留公开彰显、出现的含义，不将其缩窄为较具解释性的“再来”。
- source_word: αὐτοῦ
  choice: 他
  rationale: 自然回指“主”，保持原文代词形式与行文流畅。
theological_decisions:
- issue: “公义的冠冕”的含义
  choice: 保留属格短语“公义的冠冕”，不在正文判定属格关系。
  alternative: 因公义而获赐的冠冕；以公义为内容的冠冕；关乎公正裁断或得以伸冤的冠冕。
  rationale: 希腊语属格容许多种关联，原文没有明确限定，翻译应保存这一神学张力。
- issue: “主”的指称
  choice: 正文译作“主”，由上下文让读者辨认其所指。
  alternative: 明确扩译为“主耶稣”或泛指“神”。
  rationale: 教牧书信中“他的显现”强烈指向基督，但原文仅用 κύριος；保留“主”既忠于形式，也避免不必要地扩写。
- issue: “爱慕他显现”的时间与取向
  choice: 译作“爱慕他显现的人”，表达已经形成并持续的爱与盼望。
  alternative: 曾爱过他显现的人；盼望他显现的人。
  rationale: 完成时分词强调延续至今的稳定状态；“曾爱过”容易暗示已经停止，“盼望”则弱化了原文明确的“爱”。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“从今以后”承接上文；以破折号标出同位语，使长句层次清楚。“爱慕”兼具珍爱与热切期待之意，适合描述信徒对主显现的持久热望。
