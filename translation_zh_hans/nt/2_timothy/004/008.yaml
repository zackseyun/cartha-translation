review_pass:
  verdict: revise
  source_fidelity: 正文总体忠实呈现了 λοιπὸν 的时间推进、ἀπόκειται 的“为我存留”、将来时 ἀποδώσει，以及“那日”“公义的审判者”和“所有爱慕他显现的人”。不过，脚注把属格可能性延伸为“得以伸冤”，这比 δικαιοσύνη 及该未限定属格本身所能确定的含义更具体，宜删去。
  naturalness: 行文庄重、清楚，符合现代标准普通话。将“那公义的冠冕”调整为“公义的冠冕”更自然；以“主，就是那公义的审判者”处理同位语，也较连贯。
  terminology: “公义”“冠冕”“主”“审判者”“显现”均恰当一致。“爱慕”可自然表达 ἠγαπηκόσι 所示已形成并持续的爱；不必在正文硬性复制完成体。“公正”可作为 δικαιοσύνη 的词汇替代保留在脚注中，但不应借此指定为“伸冤”。
  issues:
