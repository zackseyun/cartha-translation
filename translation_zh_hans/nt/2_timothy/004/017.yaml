id: 2TI.4.17
reference: 2 Timothy 4:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ δὲ κύριός μοι παρέστη καὶ ἐνεδυνάμωσέν με, ἵνα δι’ ἐμοῦ τὸ κήρυγμα πληροφορηθῇ καὶ ⸀ἀκούσωσιν πάντα τὰ ἔθνη, καὶ ἐρρύσθην ἐκ στόματος λέοντος.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/017.yaml
  text: But the Lord stood by me and strengthened me[a], so that through me the proclamation might be fully accomplished and all the Gentiles might hear[b], and I was rescued from the lion’s mouth.
translation:
  language: zh_hans
  text: 但主站在我身旁，加给我力量，使这宣讲借着我得以充分完成，也使所有外邦人[a]都能听见；我也从狮子口中[b]被救了出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“所有邦国”。希腊语ἔθνη既可指“外邦人”，也可指“邦国、万民”；这里很可能是指听见福音的非犹太各族人民。
    reason: lexical_alternative
  - marker: b
    text: “从狮子口中”可能是形容脱离致命危险的比喻，并不一定指一头真实的狮子。原文没有说明“狮子”具体指什么。
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ κύριός
  choice: 但主
  rationale: “主”保留κύριος的通常称谓，不在正文中限定其所指；“但”体现δέ与上文众人离弃保罗之间的转折。
- source_word: μοι παρέστη
  choice: 站在我身旁
  rationale: 既保留“站在旁边”的具体意象，也自然表达亲自临在并扶助的含义。
- source_word: ἐνεδυνάμωσέν με
  choice: 加给我力量
  rationale: 自然表达“使有力量、加强”的意思，又不把它窄化为某一种能力。
- source_word: ἵνα δι’ ἐμοῦ
  choice: 使……借着我
  rationale: “使”表达ἵνα的目的或预期结果，“借着我”保留διά加属格所表达的媒介或代理意义。
- source_word: τὸ κήρυγμα
  choice: 这宣讲
  rationale: 兼顾所宣讲的信息与公开宣告这一行动；指示词“这”使中文表达自然，并承接保罗所承担的福音宣讲。
- source_word: πληροφορηθῇ
  choice: 得以充分完成
  rationale: 保留“完全实现、充分完成”的宽广语义，不擅自限定为仅仅“传遍”或“讲完”。
- source_word: ἀκούσωσιν
  choice: 都能听见
  rationale: 表达ἵνα结构中的目的或预期结果，且符合现代汉语习惯。
- source_word: πάντα τὰ ἔθνη
  choice: 所有外邦人
  rationale: 在保罗向非犹太人作见证的语境中，“外邦人”较可能贴合其所指；“万邦”这一真实可能性在脚注中保留。
- source_word: ἐρρύσθην
  choice: 被救了出来
  rationale: 准确表达从危险中获救，语言直白、自然，并保留被动语态。
- source_word: ἐκ στόματος λέοντος
  choice: 从狮子口中
  rationale: 直译原有意象，不将狮子预先解释为尼禄、撒但、猛兽刑罚或一般危险。
theological_decisions:
- issue: “主”（κύριος）的具体所指
  choice: 正文只译作“主”
  alternative: 明确译作“主耶稣”或“上帝”
  rationale: 语境可能使读者理解为复活的主耶稣，但原文没有在本句中明说；保留“主”可避免替作者消除这一开放性。
- issue: “从狮子口中”的含义
  choice: 保留原文意象
  alternative: 解释为脱离尼禄、撒但、猛兽刑罚或致命危险
  rationale: 原文没有确定狮子究竟是字面所指、历史人物的隐喻，还是死亡危险的形象说法，因此不在正文中选定某一种解释。
- issue: πληροφορηθῇ所表达的完成
  choice: 译为“得以充分完成”
  alternative: 译为“得以传遍”或“得以完全宣讲出来”
  rationale: 该动词在这里可侧重宣讲使命得到充分实行，也可能包含信息被完整宣告的意味；所选译法尽量保留这种语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“站在我身旁”“加给我力量”“从狮子口中被救了出来”保留原文的具体形象；分号划分目的陈述与获救陈述，使长句清楚而不割裂其逻辑。脚注标记分别紧跟其实际说明的词语，避免歧义。
