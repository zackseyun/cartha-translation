  text: 至于推基古，我已经派他到以弗所去了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“但我已经派推基古到以弗所去了”，或“我已经派推基古到以弗所去了”；希腊语连接词δέ既可表示简单承接或话题转换，也可表示轻微转折。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τυχικὸν
  choice: 推基古
  rationale: 人名宾格；采用现代中文圣经中通行且易辨认的音译。
- source_word: δὲ
  choice: 至于
  rationale: δέ在这里可表示轻微转折，也可只是承接或转换话题；“至于”自然地标示从上一句转向推基古的安排，同时不强化为明显对立。
- source_word: ἀπέστειλα
  choice: 我已经派……去了
  rationale: 该词为ἀποστέλλω的第一人称单数简单过去时；中文用“已经派……去了”自然表达已经发生的差派行动，但不额外断定其持续结果。
- source_word: εἰς
  choice: 到
  rationale: 与城市名连用表示目的地，现代汉语自然译作“到”。
- source_word: Ἔφεσον
  choice: 以弗所
  rationale: 地名宾格，沿用现代中文圣经中的通行译名。
