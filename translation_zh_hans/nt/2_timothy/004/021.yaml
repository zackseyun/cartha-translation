id: 2TI.4.21
reference: 2 Timothy 4:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Σπούδασον πρὸ χειμῶνος ἐλθεῖν. Ἀσπάζεταί σε Εὔβουλος καὶ Πούδης καὶ Λίνος καὶ Κλαυδία καὶ οἱ ἀδελφοὶ πάντες.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/021.yaml
  text: Make every effort to come before winter. Eubulus sends greetings to you[a], and so do Pudens and Linus and Claudia and all the brothers.
translation:
  language: zh_hans
  text: 你要赶在冬天以前来。友布罗、布田、利奴、克劳迪娅和所有弟兄都问候你。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“所有弟兄姊妹”；希腊文直译为“所有弟兄”，但在这里也可能泛指更广泛的信徒群体。
    reason: lexical_alternative
lexical_decisions:
- source_word: Σπούδασον
  choice: 你要赶
  rationale: 此处是不定过去时命令式，表达认真尽快办理之意；结合“冬天以前”的期限，用“要赶……来”自然传达迫切和努力，而不只是一般性的勤勉。
- source_word: πρὸ χειμῶνος
  choice: 在冬天以前
  rationale: πρό加属格表示某时段到来之前；“在冬天以前”准确而自然。
- source_word: ἐλθεῖν
  choice: 来
  rationale: 不定式补充说明所催促的行动，方向是到保罗这里，因此译为“来”。
- source_word: Ἀσπάζεταί σε
  choice: 问候你
  rationale: ἀσπάζομαι在书信问安语境中表示向收信人致意；汉语“问候你”简洁自然。希腊文先用单数谓语配第一个姓名，随后以多个καί连接其余问安者；汉语合并为并列主语更流畅。
- source_word: Εὔβουλος
  choice: 友布罗
  rationale: 按希腊语读音音译人名，并采用现代中文圣经语境中易于辨识的形式。
- source_word: Πούδης
  choice: 布田
  rationale: 按希腊语人名音译，采用中文圣经传统中通行且易辨识的形式。
- source_word: Λίνος
  choice: 利奴
  rationale: 按希腊语读音音译，采用中文圣经传统中通行的形式。
- source_word: Κλαυδία
  choice: 克劳迪娅
  rationale: 按希腊语读音作现代汉语音译，清楚标示女性人名。
- source_word: οἱ ἀδελφοὶ πάντες
  choice: 所有弟兄
  rationale: ἀδελφοί字面为阳性复数“弟兄”，故正文保留其形式；在早期基督徒群体语境中也可能泛指男女信徒，这一可能性以脚注说明。
theological_decisions:
- issue: ἀδελφοί在可能包括男女的基督徒群体中的译法
  choice: 所有弟兄
  alternative: 所有弟兄姊妹；所有信徒
  rationale: 正文保留希腊文阳性复数的明确形式，不预先判定所指群体的性别构成；同时，书信问安中的ἀδελφοί可能泛指更广泛的信徒群体，因此将包容性理解保留在脚注中。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“你要赶在……以前来”体现催促和时限；问安名单按汉语习惯合并表达。正文保留“弟兄”的源语形式，并用脚注保存其可能具有的群体性、包容性指称。
