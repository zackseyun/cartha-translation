  yaml_path: translation/nt/2_timothy/004/009.yaml
  text: Make every effort to come to me quickly[a].
translation:
  language: zh_hans
  text: 你要尽力尽快到我这里来。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你要殷勤地尽早到我这里来”，或“你要竭力赶快到我这里来”。
    reason: 词义可选译法：Σπούδασον可侧重殷勤、竭力，ταχέως既可指迅速，也可指早日、不久。
lexical_decisions:
- source_word: Σπούδασον
  choice: 要尽力
  rationale: 这是σπουδάζω的不定过去时主动命令式，表达认真、殷勤地付出努力，而不单指动作迅速。“要尽力”自然地保留了命令语气和刻意努力的含义，也避免与ταχέως的急迫意味重叠。
- source_word: ἐλθεῖν
  choice: 到……来
  rationale: 这是ἔρχομαι的不定过去时不定式，受Σπούδασον支配；结合πρός με，汉语用“到我这里来”最自然。
- source_word: πρός με
  choice: 到我这里
  rationale: πρός接宾格表示朝向某人移动；“到我这里来”符合现代汉语的指向表达，并清楚保留第一人称对象。
- source_word: ταχέως
  choice: 尽快
  rationale: 该副词可表示“迅速”或“不久、很快”。在此处，“尽快”自然传达时间上的紧迫性，同时与前面的“尽力”分别对应两个希腊语要素。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语自然的表达。“你要尽力尽快”虽连续出现两个“尽”，但分别准确承载努力程度和时间急迫性；“到我这里来”比直译“来到我这里”更符合普通现代汉语。
