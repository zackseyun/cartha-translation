  text: τὰς δὲ μωρὰς καὶ ἀπαιδεύτους ζητήσεις παραιτοῦ, εἰδὼς ὅτι γεννῶσι μάχας·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/023.yaml
  text: But refuse foolish and ignorant controversies[b][a], knowing that they produce quarrels.
translation:
  language: zh_hans
  text: 但要避开愚妄无知的争论[a]，因为你知道，它们会滋生争吵[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“问题”或“辩论”；希腊语词可指探究或询问，但这里更可能指引起纷争的争议，而不是真诚的求问。
    reason: lexical_alternative
  - marker: b
    text: 直译“生出”或“产生”；这里以比喻说明这些争论会造成争吵。
    reason: lexical_alternative
lexical_decisions:
- source_word: μωρὰς
  choice: 愚妄
  rationale: 表达缺乏明智、荒谬不当之意，比口语化且贬损较强的“愚蠢”更符合庄重劝诫的语体。
- source_word: ἀπαιδεύτους
  choice: 无知
  rationale: 该词指未经教导或训练；“无知”在本句中自然简洁，并与“愚妄”共同修饰所谈论的争论，而非给人贴标签。
- source_word: ζητήσεις
  choice: 争论
  rationale: 该词本可指问题、探究或辩论，但在此语境中侧重引起冲突的争议性讨论；脚注保留其较中性的词义可能。
- source_word: παραιτοῦ
  choice: 避开
  rationale: 中间语态命令式要求提摩太谢绝参与、不与之纠缠；“避开”自然表达这种主动回避。
- source_word: εἰδὼς
  choice: 因为你知道
  rationale: 将分词所表达的理由关系明确译出，符合现代汉语习惯，同时保留“知道”这一认知含义。
- source_word: γεννῶσι
  choice: 滋生
  rationale: 原词本义为生育、产生；“滋生”既自然表达导致某结果，也保留一定的生成性比喻。
- source_word: μάχας
  choice: 争吵
  rationale: 此处指言语和人际上的争执，而非主要指肢体打斗；“争吵”贴合上下文。
- source_word: δὲ
  choice: 但
  rationale: 标明与前文劝勉之间的轻微转折。
theological_decisions: []
