id: 2TI.2.24
reference: 2 Timothy 2:24
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: δοῦλον δὲ κυρίου οὐ δεῖ μάχεσθαι, ἀλλὰ ἤπιον εἶναι πρὸς πάντας, διδακτικόν, ἀνεξίκακον,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/024.yaml
  text: And the Lord’s servant must not quarrel[a], but must be gentle toward everyone, able to teach, patient when wronged,
translation:
  language: zh_hans
  text: 然而，主的仆人不可争吵，而要温和地对待所有人，善于教导，受委屈时能忍耐。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “仆人”也可译作“奴仆”。希腊语δοῦλος按语境可指仆人或奴隶。
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλον
  choice: 仆人
  rationale: δοῦλος可指奴隶或仆人；本节着重说明事奉主之人应有的品行，用“仆人”自然且符合语境，同时以脚注保留“奴仆”这一词义可能。
- source_word: κυρίου
  choice: 主的
  rationale: 属格κυρίου修饰δοῦλον；“主的仆人”是自然、明确的现代汉语表达。
- source_word: οὐ δεῖ μάχεσθαι
  choice: 不可争吵
  rationale: δεῖ带有必要和规范性，否定式可译为“不可”；μάχεσθαι在此语境主要指好争辩、与人争执，而非仅指肢体打斗。
- source_word: ἤπιον εἶναι πρὸς πάντας
  choice: 要温和地对待所有人
  rationale: ἤπιος表示温和、柔和；πρὸς πάντας说明这种态度面向所有人。加入“对待”使汉语通顺，同时保留关系指向。
- source_word: διδακτικόν
  choice: 善于教导
  rationale: διδακτικός指具备教导的能力或素质，并非“乐于受教”；“善于教导”简洁自然。
- source_word: ἀνεξίκακον
  choice: 受委屈时能忍耐
  rationale: 此罕见词表示遭受恶待或伤害时能够容忍、不报复；该译法比单说“忍耐”更明确地保留其受害情境。
theological_decisions:
- issue: 事奉语境中δοῦλος的译法
  choice: 仆人
  alternative: 奴仆／奴隶
  rationale: 本节焦点是属于主并事奉主之人的行为规范，而非强调其法律上的奴隶身份；“仆人”在正文中较自然，又不削弱其从属于主的关系。脚注保留另一词义。
- issue: κύριος的称谓
  choice: 主
  alternative: 主人
  rationale: “主”是此处基督教语境中κύριος最自然的称谓；译作“主人”会更突出主奴社会关系，而原句无须将这一层面前置。
- issue: ἀνεξίκακος所包含的伦理要求
  choice: 受委屈时能忍耐
  alternative: 宽容恶人／忍受恶事
  rationale: 原词可涉及忍受伤害而不报复。正文保留遭受不当对待时忍耐的要求，但不将对象限定为“恶人”，也不额外加入“毫无怨恨”等超出词面必然含义的表述。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“然而”承接上文并体现δέ的转折；句中用“不可……而要……”清楚呈现对比。脚注标记置于全句末，正文中的“仆人”与脚注直接对应。
