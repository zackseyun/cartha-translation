id: 2TI.2.21
reference: 2 Timothy 2:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐὰν οὖν τις ἐκκαθάρῃ ἑαυτὸν ἀπὸ τούτων, ἔσται σκεῦος εἰς τιμήν, ἡγιασμένον, ⸀εὔχρηστον τῷ δεσπότῃ, εἰς πᾶν ἔργον ἀγαθὸν ἡτοιμασμένον.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/021.yaml
  text: Therefore[a], if anyone cleanses himself from these things, he will be a vessel for honor, sanctified, useful to the Master[b], prepared for every good work.
translation:
  language: zh_hans
  text: 所以，人若洁净自己，脱离这些，就必成为尊贵的器皿[a]，已经分别为圣[b]，对主人有用，预备好做各样的善工。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“作尊贵用途的器皿”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“已经成圣”或“已经归作圣用”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: 所以，人若
  rationale: “所以”保留οὖν承接上文的推论作用，“若”保留ἐὰν所引条件句的语气，合乎现代汉语表达。
- source_word: τις
  choice: 人
  rationale: τις在此泛指任何人；放在“若”字句中译作“人”，自然且不限定性别。
- source_word: ἐκκαθάρῃ ἑαυτὸν ἀπὸ τούτων
  choice: 洁净自己，脱离这些
  rationale: 保留反身动作和ἀπό表示的分离关系。“这些”照原文回指上文，但不擅自断定专指人、行为或教训。
- source_word: ἔσται σκεῦος
  choice: 就必成为……器皿
  rationale: “器皿”延续上文家中器具的比喻；“就必成为”自然表达条件成立后的将来结果。
- source_word: εἰς τιμήν
  choice: 尊贵的
  rationale: 在与上文“不尊贵”之器皿的对比中，“尊贵的器皿”简洁自然；原短语也可理解为“作尊贵用途”，故以脚注保留。
- source_word: ἡγιασμένον
  choice: 已经分别为圣
  rationale: 表达完成时被动分词所指的既成状态，也保留ἁγιάζω兼具成圣与归为圣用的含义。
- source_word: εὔχρηστον τῷ δεσπότῃ
  choice: 对主人有用
  rationale: “主人”符合家中器皿的比喻，也保留δεσπότης所含的所有权和权威意味；“对……有用”直接表达εὔχρηστος。
- source_word: εἰς πᾶν ἔργον ἀγαθὸν ἡτοιμασμένον
  choice: 预备好做各样的善工
  rationale: “预备好”表达完成时被动分词的预备就绪状态；“各样的善工”保留该书信中“善工”的广泛含义。
theological_decisions:
- issue: “这些”所指为何
  choice: 保留“这些”的开放回指
  alternative: 明确译为“这些人”或“这些恶事”
  rationale: τούτων本身仅为复数指示代词；上下文容许对不尊贵的器皿、错误教训或相关恶行产生联系。正文不应替原文消除这种张力。
- issue: ἡγιασμένον的圣化含义
  choice: 已经分别为圣
  alternative: 已经成圣；已经归作圣用
  rationale: “分别为圣”既能表达被神圣化，也能表达在器皿比喻中被分别出来归主人使用，避免只强调伦理改善或仅强调功能用途。
- issue: δεσπότης在比喻中的称谓
  choice: 主人
  alternative: 主；所有者
  rationale: 家宅器皿的语境首先呈现主人与器皿的关系；译作“主人”不否认其最终的神圣指向，也不把比喻提前改写为固定神学称号。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“器皿”“分别为圣”“善工”保留经文的比喻和神学语域，同时句法力求普通读者易懂。所有脚注标记均紧随其所说明的词语。
