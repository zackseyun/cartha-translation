  text: πιστὸς ὁ λόγος· εἰ γὰρ συναπεθάνομεν, καὶ συζήσομεν·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/011.yaml
  text: 'The saying is trustworthy: for if we died with him[c][b][a], we will also live with him.'
translation:
  language: zh_hans
  text: 这话是可信的[a]：因为我们若与他一同死了[b]，也将与他一同活着[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“这话是可靠的”；原文也可较直译为“这道是信实的”。
    reason: lexical_alternative
  - marker: b
    text: 直译“我们若一同死了”；希腊语复合动词表示与另一位共同经历死亡，按上下文所指的是基督。
    reason: lexical_alternative
  - marker: c
    text: “将与他一同活着”可着重指将来复活后与基督同活，也可能涵盖参与他的生命；原文没有在这里进一步限定。
    reason: alternative_reading
lexical_decisions:
- source_word: πιστὸς
  choice: 可信的
  rationale: πιστός在此作表语，说明这“话”可靠、值得接受。“可信的”既符合现代汉语，也不把这里狭义化为某人的“忠信”。
- source_word: ὁ λόγος
  choice: 这话
  rationale: 在教牧书信中，πιστὸς ὁ λόγος是引出简明宣言的固定表达。“这话”自然地指向随后引述的内容，也比直译为“这个词”更符合此处语用。
- source_word: εἰ γὰρ
  choice: 因为……若
  rationale: “若”保留εἰ的条件关系，“因为”保留γάρ对前面“这话是可信的”的解释作用。汉语按“因为我们若……”排列，清楚而自然。
- source_word: συναπεθάνομεν
  choice: 与他一同死了
  rationale: 该复合动词的συν-表示共同参与；“与他一同”显明其隐含的共同对象，而“死了”简洁表达不定过去时，不额外限定具体时点。
- source_word: καὶ
  choice: 也
  rationale: 这里καί把条件与结果配对，表达“既同死，也同活”的对应关系；译作“也”最符合现代汉语。
- source_word: συζήσομεν
  choice: 将与他一同活着
  rationale: 将来时用“将”表达，συν-用“与他一同”表达。“活着”保留宽泛含义，不擅自限定为复活、今生属灵生命或其中之一。
theological_decisions:
- issue: 两个带συν-复合动词所隐含的共同对象
  choice: 两处均补出“与他一同”，其中“他”按上下文指基督。
  alternative: 不补对象，译作“我们若死了，也将活着”。
  rationale: 原文虽没有独立宾语，但两个复合动词本身都表达“与……一同”，且上下文以基督为中心。汉语补出“他”可清楚传达原意，而不是增添新的神学主张。
- issue: “与他一同活着”的时间和神学范围
  choice: 保留宽泛表达“也将与他一同活着”。
  alternative: 明确限定为将来复活后与基督同活，或限定为今世参与基督的生命。
  rationale: συζήσομεν是将来时，明显带有前瞻性，但本句本身没有进一步界定所指是否仅为末后的复活生命，也没有排除信徒参与基督生命的较广含义，因此不在正文中缩窄。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“这话是可信的”保留教牧书信中宣告式的语气；“与他一同死了／与他一同活着”形成清晰对称，并保留原文的诗歌或格言式节奏。
