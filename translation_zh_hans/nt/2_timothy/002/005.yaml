  text: ἐὰν δὲ καὶ ἀθλῇ τις, οὐ στεφανοῦται ἐὰν μὴ νομίμως ἀθλήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/005.yaml
  text: And if anyone also competes as an athlete[a], he is not crowned unless he competes according to the rules.
translation:
  language: zh_hans
  text: 再者，若有人参加竞技，除非按规矩[a]竞赛，否则不能得冠冕。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“合乎规定地”。这个希腊副词可指以合法、合乎规定或正当的方式；这里很可能是指遵守竞赛规则。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀθλῇ / ἀθλήσῃ
  choice: 参加竞技 / 竞赛
  rationale: 这两个同源动词明确唤起运动竞赛的场景。中文用“参加竞技”和“竞赛”既保留同一意象，也避免笼统译成“努力”或“争战”。
- source_word: τις
  choice: 有人
  rationale: 不定代词具有泛指作用；“有人”在现代汉语中自然，并不限定性别。
- source_word: στεφανοῦται
  choice: 得冠冕
  rationale: 该被动动词指竞技优胜者获授花冠或冠冕。“得冠冕”简洁地保留获胜者受冠的意象，又不把它解释为某一种特定的属灵奖赏。
- source_word: νομίμως
  choice: 按规矩
  rationale: 该副词基本含义是以合乎律法、规定或正当的方式；在竞技语境中，“按规矩”最自然地表达遵守竞赛规则，同时以脚注保留较宽的词义。
- source_word: καὶ
  choice: 再者
  rationale: 这里与前后几个比喻相连，具有增添另一例证的作用；“再者”同时承载 καί 的添加作用和 δέ 的轻微转折、推进作用。
- source_word: ἐὰν μὴ
  choice: 除非……否则
  rationale: 这一结构自然表达必要条件，准确传达“不按规矩竞赛便不能得冠冕”的逻辑关系。
theological_decisions:
- issue: 冠冕意象的性质
  choice: 保留竞技者得冠冕的比喻，不具体说明冠冕所代表的属灵奖赏。
  alternative: 明确解释为末世奖赏，或解释为事奉得到认可。
  rationale: 原文只借竞技比喻强调竞赛方式与得冠冕之间的关系，并未在本节界定冠冕的具体神学所指，因此译文不作超出文本的限定。
- issue: νομίμως 所指的规范
  choice: 在竞技语境中译为“按规矩”，但不进一步列明具体规则。
  alternative: 将其解释为遵守某套特定宗教律法或事奉规范。
  rationale: 上下文的直接意象是运动竞技；原文没有说明这些规矩具体对应哪一种神学或教会制度，故保留其开放性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“参加竞技”“按规矩竞赛”“得冠冕”保持完整的运动竞赛画面；条件句调整为“除非……否则”，符合自然汉语，同时忠实呈现原文的必要条件。
