id: 2TI.2.7
reference: 2 Timothy 2:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: νόει ⸀ὃ λέγω· ⸀δώσει γάρ σοι ὁ κύριος σύνεσιν ἐν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/007.yaml
  text: Consider what I am saying[b][a], for the Lord will give you understanding in all things.
translation:
  language: zh_hans
  text: 你要思想我所说的[a]，因为主[b]必在一切事上赐给你悟性。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “思想”也可译作“思考”或“领会”；原词既可指用心思索，也可指理解。
    reason: lexical_alternative
  - marker: b
    text: 原文只说“主”，没有进一步说明是特指主耶稣，还是较广义地指神。
    reason: alternative_reading
lexical_decisions:
- source_word: νόει
  choice: 思想
  rationale: 现在时主动命令语气要求提摩太持续而主动地思考；“思想”在现代中文中自然、庄重，也不预先取代下文由主所赐的更深悟性。
- source_word: ὃ λέγω
  choice: 我所说的
  rationale: 关系代词ὃ指保罗话语的内容；“我所说的”简洁自然，并保留λέγω的现在时语境。
- source_word: γάρ
  choice: 因为
  rationale: γάρ说明前述命令的根据；“因为”清楚呈现思想与主赐悟性之间的逻辑关系。
- source_word: δώσει σοι
  choice: 必……赐给你
  rationale: 将来时δώσει表达应许；“赐给”适合主作为施予者的语境，“必”传达将来陈述的确定性。
- source_word: ὁ κύριος
  choice: 主
  rationale: 按原文直译为“主”，不擅自限定为主耶稣或父神。
- source_word: σύνεσιν
  choice: 悟性
  rationale: σύνεσις指理解、领会或洞察的能力；“悟性”既简明庄重，又与前面的主动思想有所区分。
- source_word: ἐν πᾶσιν
  choice: 在一切事上
  rationale: 保留介词短语的广泛范围，不将其缩限为教义、当前比喻或某一类事务。
theological_decisions:
- issue: “主”（ὁ κύριος）的所指
  choice: 正文仅译作“主”
  alternative: 明确译作“主耶稣”或“神”
  rationale: 希腊文未进一步说明所指；保罗书信中的κύριος常可指耶稣，但本节本身没有明确限定，因此正文保留原有含混性。
- issue: 人的思想与主所赐悟性之间的关系
  choice: 同时保留“你要思想”的命令与“主必赐给你悟性”的应许
  alternative: 把前半句译成单纯的“要明白”，或把后半句处理成人凭自己思想便获得理解
  rationale: 原文并置人的主动反思和主所赐的理解，翻译不应消解二者之间的神学张力。
translation_notes:
  register: 采用现代标准普通话，语气清楚、庄重而易懂。“你要思想”保留劝勉力度，“悟性”与前面的思想形成适度区分。脚注标记依正文出现次序排列。
