  text: Ταῦτα ὑπομίμνῃσκε, διαμαρτυρόμενος ἐνώπιον τοῦ ⸀κυρίου, μὴ λογομαχεῖν, ⸀ἐπ’ οὐδὲν χρήσιμον, ἐπὶ καταστροφῇ τῶν ἀκουόντων.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/014.yaml
  text: Keep reminding them of these things[a], solemnly charging them before the Lord not to quarrel about words[b], which is useful for nothing and leads to the ruin of those who hear.
translation:
  language: zh_hans
  text: 你要不断提醒他们这些事，并在主[b]面前郑重嘱咐他们，不可为言词争辩；这毫无益处，反会使听的人遭受毁坏[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “毁坏”也可译作“倾覆”。原文用词语气强烈，指听者受到严重损害。
    reason: lexical_alternative
  - marker: b
    text: “在主面前”表示在神圣的鉴察和见证之下；本句没有明确说明这里的“主”特指主耶稣，还是较广义地指神。
    reason: alternative_reading
lexical_decisions:
- source_word: Ταῦτα
  choice: 这些事
  rationale: 保留中性复数指示词回指上文教导的作用；现代汉语中“这些事”自然清楚。
- source_word: ὑπομίμνῃσκε
  choice: 要不断提醒
  rationale: 现在时命令语气带有持续或反复进行的意味，“不断提醒”在汉语中明确表达这一体貌。
- source_word: διαμαρτυρόμενος
  choice: 郑重嘱咐他们
  rationale: 该分词表达严肃作证、郑重劝诫或严令之意；“郑重嘱咐”符合牧养语境，也保留语气的庄重。“他们”依上下文补出。
- source_word: ἐνώπιον τοῦ κυρίου
  choice: 在主面前
  rationale: 忠实保留处于主的鉴察和见证之下这一惯用表达，同时不限定“主”具体指父神还是主耶稣。
- source_word: μὴ λογομαχεῖν
  choice: 不可为言词争辩
  rationale: λογομαχέω指围绕字词展开争斗或口舌之争；此译简洁、庄重，并保留贬义。
- source_word: ἐπ’ οὐδὲν χρήσιμον
  choice: 这毫无益处
  rationale: 表达完全没有用处或益处；“这”自然回指为言词争辩一事。
- source_word: ἐπὶ καταστροφῇ
  choice: 只会使……败坏
  rationale: ἐπί加与格在此表达有害的结果；καταστροφή语气强烈，可指倾覆、毁坏。“败坏”既保留严重性，也适合描述听者所受的毁损。
- source_word: τῶν ἀκουόντων
  choice: 听见的人
  rationale: 将实体化的现在分词译为自然汉语，指听到这些争辩的人。
theological_decisions:
- issue: κύριος所指对象
  choice: 主
  alternative: 神；主耶稣
  rationale: 希腊文只称“主”，并未在本句明确限定所指；直译为“主”可保留真实存在的指称张力。
- issue: ἐπ’ οὐδὲν χρήσιμον与ἐπὶ καταστροφῇ的句法关系
  choice: 把二者都理解为对“为言词争辩”的评价与结果
  alternative: 将“毫无益处”更紧密地处理为独立插入语，或译作“为着毫无益处之事”
  rationale: 两短语顺接禁令，最自然地说明争辩毫无益处，且导致听者败坏；不把两者合并成单一程度较弱的评价。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“为言词争辩”保留原文对围绕字词争斗的批评；分号体现后半句对该行为的评价和后果。所有脚注标记均置于正文相关句末。
