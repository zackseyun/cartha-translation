  text: ⸀συγκακοπάθησον ὡς καλὸς στρατιώτης ⸂Χριστοῦ Ἰησοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/003.yaml
  text: Share in suffering as a good soldier of Messiah Jesus[a][b].
translation:
  language: zh_hans
  text: 你要一同受苦，像弥赛亚耶稣的好士兵一样[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一同受苦”也可译为“和我一同忍受苦难”。希腊文表达共同参与，却没有在本节明说“和谁”；上下文可能指“和我”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文为“基督耶稣”。“基督”意为“弥赛亚（受膏者）”，这里作为称号使用。
    reason: title_rendering
lexical_decisions:
- source_word: συγκακοπάθησον
  choice: 你要一同受苦
  rationale: 这是第二人称单数、不定过去时主动命令式。词首的 συν- 表达共同参与，因此译为“一同受苦”；不在正文中补出原文未明说的“和我”。
- source_word: ὡς
  choice: 像……一样
  rationale: 比较连接词，说明受苦时应有的身份和方式；现代汉语用“像……一样”表达自然清楚。
- source_word: καλὸς
  choice: 好
  rationale: 在“士兵”这一搭配中表示称许、合宜或优秀。“好士兵”保留宽泛评价，避免“精兵”可能附加的精锐或技能含义。
- source_word: στρατιώτης
  choice: 士兵
  rationale: 该词通常指士兵；这里用于比喻，仍保留其基本军事意象。
- source_word: Χριστοῦ Ἰησοῦ
  choice: 弥赛亚耶稣
  rationale: 属格短语，修饰“士兵”。Χριστός在此是耶稣的称号，意为“弥赛亚／受膏者”；采用“弥赛亚耶稣”以显明称号加人名的结构。
theological_decisions:
- issue: Χριστοῦ Ἰησοῦ的译法
  choice: 弥赛亚耶稣
  alternative: 基督耶稣
  rationale: Χριστός在此仍具有称号意义。正文译作“弥赛亚”以呈现其语义，同时以脚注说明传统且更熟悉的“基督耶稣”译法。
- issue: συγκακοπάθησον是否补出共同受苦的对象
  choice: 一同受苦
  alternative: 和我一同忍受苦难
  rationale: συν-明确含有共同参与的意味，但本节未明说共同受苦的对象。正文不补“和我”，以免把上下文推断写成明文；脚注保留这一合理理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“好士兵”比“精兵”更贴近καλός的宽泛称许含义；句末“像……一样”符合自然汉语比较句式。
