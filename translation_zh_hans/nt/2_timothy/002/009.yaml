base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/009.yaml
  text: for which I am suffering hardship[a], even to the point of chains, as a criminal[b]. But the word of God is not bound.
translation:
  language: zh_hans
  text: 我为这福音受苦[a]，甚至被锁链捆绑，被当作罪犯[b]；但神的道没有被捆绑。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我在这福音中受苦”或“我因这福音受苦”；希腊语很可能回指上一节所说的福音。
    reason: alternative_reading
  - marker: b
    text: 或译：“被当作作恶的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: 为这福音
  rationale: 关系短语最可能回指上一节的“福音”，并在这里表达受苦的缘由。正文用自然的现代汉语明确其上下文所指，脚注保留“在其中”的语义可能。
- source_word: κακοπαθῶ
  choice: 受苦
  rationale: 该动词表示遭受苦难或困苦；“受苦”简洁自然，并能表达当前持续的遭遇。
- source_word: μέχρι δεσμῶν
  choice: 甚至被锁链捆绑
  rationale: μέχρι表示程度达到某一点，δεσμά本指锁链，也可转指囚禁；译文保留具体的锁链意象，并以“甚至”自然表达递进程度。
- source_word: ὡς κακοῦργος
  choice: 像罪犯一样
  rationale: κακοῦργος可指作恶者或触犯刑法的人；在受锁链捆绑的司法语境中，“罪犯”清楚自然，同时脚注保留“作恶的人”这一词义。
- source_word: ἀλλὰ
  choice: 然而
  rationale: 该连词突出保罗被捆绑与神的道不受捆绑之间的强烈反差；“然而”庄重而自然。
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: 神的道
  rationale: 保留λόγος的宽广含义，不把它限定为圣经、福音或一般信息；“神的道”也是现代中文圣经语体中自然且为普通读者熟悉的表达。
- source_word: οὐ δέδεται
  choice: 并没有被捆绑
  rationale: 完成时被动态强调并不存在“已被捆绑而处于受限状态”的结果；“没有被捆绑”保留被动形式，也与前面的锁链意象形成刻意呼应。
theological_decisions:
- issue: “神的道”的具体所指
  choice: 保留为“神的道”，不进一步限定
  alternative: 福音的信息；圣经
  rationale: 紧邻语境尤其指向所传的福音，但希腊语本身范围更广。译文不把原文的所指缩窄，以保留其神学张力和语义宽度。
- issue: ἐν ᾧ所表达的关系
  choice: 正文按因由译为“为这福音”
  alternative: 在这福音中；因这福音
  rationale: 该短语可能兼具范围与原因色彩，且所指很可能是上一节的福音。中文正文采用最符合语境的因由表达，脚注交代较贴近字面的另一可能。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“锁链捆绑”保留具体意象，并与末句“神的道并没有被捆绑”形成原文中的修辞对照；分号呈现强烈转折。
