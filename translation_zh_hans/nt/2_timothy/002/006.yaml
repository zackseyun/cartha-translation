  yaml_path: translation/nt/2_timothy/002/006.yaml
  text: The hardworking farmer must be the first to receive a share of the crops[a].
translation:
  language: zh_hans
  text: 辛勤劳作的农夫，必须先从收成中分得一份[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“劳苦耕作的农夫必须先有分于收成。”
    reason: “有分于”较形式地表达 μεταλαμβάνειν 的“参与、分享”之意；正文“从收成中分得一份”以现代汉语明确呈现其部分性。
lexical_decisions:
- source_word: κοπιῶντα（κοπιάω）
  choice: 辛勤劳作的
  rationale: 该现在分词表示付出艰苦、持续的劳动；“辛勤劳作的”既保留劳苦之意，也自然地修饰“农夫”。
- source_word: γεωργὸν（γεωργός）
  choice: 农夫
  rationale: 指耕种土地的人；“农夫”是庄重、清楚且符合本节农业语境的现代汉语表达。
- source_word: δεῖ
  choice: 理当
  rationale: 原词表达必要性或应当如此。“理当”保留规范性和必然性，同时适合本句格言式语气；“必须”也属可能译法，但语气稍显生硬。
- source_word: πρῶτον
  choice: 先
  rationale: 最自然地修饰“分得”，表示这位劳作的农夫在分享收成上具有优先次序，而不是单说他必须先劳动。
- source_word: τῶν καρπῶν（καρπός）
  choice: 收成
  rationale: 在农耕语境中指土地所出的作物或成果；“收成”比直译“果实”更能涵盖各种农作物。
- source_word: μεταλαμβάνειν（μεταλαμβάνω）
  choice: 分得一份
  rationale: 该词配合部分属格 τῶν καρπῶν，表示参与、分享并取得其中一份；“分得一份”在现代汉语中清楚呈现这一部分性含义。
theological_decisions:
- issue: 格言中“先”的关联范围
  choice: “先”与“分得一份收成”相连，强调劳作者优先分享劳动成果。
  alternative: 理解为农夫必须先劳作，然后才能分享收成。
  rationale: 希腊语中 κοπιῶντα 是修饰 γεωργὸν 的分词，而 πρῶτον 最自然地与不定式 μεταλαμβάνειν 相连。因此正文保留“优先分享”的重点，同时在脚注中说明另一种可能理解，不将语法上的张力完全抹平。
translation_notes:
  register: 采用现代、庄重而易懂的格言式表达。“辛勤劳作”突出 κοπιάω 的艰苦劳动含义；“先分得一份收成”既自然，也呈现 μεταλαμβάνω 与部分属格所表达的分享关系。脚注标记置于正文句末标点之前。
