id: 2TI.2.13
reference: 2 Timothy 2:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἰ ἀπιστοῦμεν, ἐκεῖνος πιστὸς μένει· ⸀ἀρνήσασθαι ἑαυτὸν οὐ δύναται.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/013.yaml
  text: If we are faithless[a], he remains faithful[b], for he cannot deny himself.
translation:
  language: zh_hans
  text: 我们若失信[a]，他仍然信实[b]；他不能否认自己。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“不信”，也可译“不忠”。希腊语动词可表达这几种意思。
    reason: lexical_alternative
  - marker: b
    text: 或译“可信可靠”。正文采用“信实”，以保留与“失信”的对照。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπιστοῦμεν（ἀπιστέω）
  choice: 失信
  rationale: 此动词既可指“不信”，也可指“不忠、失信”。“失信”在现代汉语中自然简洁，并与下文“信实”形成鲜明对照；脚注保留“不信”的可能含义，避免把原文限定为单纯的认知性不信或关系上的不忠。
- source_word: πιστὸς
  choice: 信实
  rationale: “信实”既表达始终忠诚可靠，也保留与“失信”的词义对照；“可信可靠”虽可表达相关含义，却会削弱原句的呼应。
- source_word: μένει
  choice: 仍然
  rationale: 与“信实”组合为“仍然信实”，自然表达持续不变的状态。
- source_word: ἀρνήσασθαι（ἀρνέομαι）
  choice: 否认
  rationale: 直接保留原词的强烈关系与道德意味，不将其弱化为单纯的“不承认”。
- source_word: ἑαυτὸν
  choice: 自己
  rationale: 准确对应反身代词，表明他之所以恒久信实，根基在于他自身。
- source_word: οὐ δύναται
  choice: 不能
  rationale: 简洁准确地表达不可能或无此能力，而非仅仅不愿意。
theological_decisions:
- issue: 人的失信与他的信实之间的关系
  choice: 正文只断言他在人的失信之下仍然信实，且不能否认自己；不具体说明这里的信实主要体现为拯救、守约，还是照警告施行审判。
  alternative: 明确解释为他仍会拯救软弱的人；或明确解释为他会忠于自己的警告而审判背道者。
  rationale: 希腊原文强调他的恒常与自我一致，却没有在本句中解明其具体结果。保留这一张力可避免加入宗派性结论。
- issue: 末句与前句的逻辑关系
  choice: 用分号连接，不在正文中增添“因为”。
  alternative: 译作“因为他不能否认自己”。
  rationale: 所给SBLGNT正文在末句前没有明示原因连词；分号既让汉语读者自然理解末句是前句的根据，也不把隐含逻辑改写成明说的连接词。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“失信／信实”保留原文的词义呼应；句式简短凝练，以贴合上下文格言式、诗行式的表达。所有脚注标记均已置于正文对应词后。
