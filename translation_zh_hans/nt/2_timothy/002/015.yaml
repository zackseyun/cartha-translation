  source_fidelity: 草稿总体忠实地传达了命令、上帝面前的评鉴、无愧的工人以及对真理信息的恰当处理。可是“使自己在上帝面前成为经得起考验的人”把 παραστῆσαι（把自己呈在……面前）弱化为“成为”，并以“经得起考验”较突出 δόκιμος 的检验过程，未充分表达其结果性的“蒙认可”。
