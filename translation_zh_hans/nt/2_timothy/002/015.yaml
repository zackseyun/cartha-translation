  terminology: “上帝”“工人”“无须羞愧”均合适。“真理的话语”比“真理的话”稍更自然，同时保留 λόγος τῆς ἀληθείας 的表达。“正确处理”不预先限定 ὀρθοτομέω 为教导，符合原文语义的开放性。
