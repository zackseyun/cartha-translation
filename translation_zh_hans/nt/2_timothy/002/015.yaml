  text: σπούδασον σεαυτὸν δόκιμον παραστῆσαι τῷ θεῷ, ἐργάτην ἀνεπαίσχυντον, ὀρθοτομοῦντα τὸν λόγον τῆς ἀληθείας.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/015.yaml
  text: Be diligent to present yourself approved to God[a], a worker with no need to be ashamed, rightly handling the word of truth.
translation:
  language: zh_hans
  text: 你要竭力把自己呈现在上帝面前，作一个蒙认可、无须羞愧、正确处理真理话语的工人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“正确教导真理话语”。“正确处理”所译的希腊词字面意思是“直切”。
    reason: lexical_alternative
lexical_decisions:
- source_word: σπούδασον
  choice: 要竭力
  rationale: 该不定过去时命令式要求认真、迫切地付诸努力。“要竭力”既保留命令语气，也比“尽你所能”更有力度。
- source_word: σεαυτὸν δόκιμον παραστῆσαι τῷ θεῷ
  choice: 使自己在上帝面前成为经得起考验的人
  rationale: παραστῆσαι表达将自己呈到上帝面前接受察验或供其使用；δόκιμον指经过检验而获认可。“经得起考验”保留了检验与蒙认可两层含义，避免仅用“蒙认可”时可能产生的行政性语感。
- source_word: ἐργάτην
  choice: 工人
  rationale: 保留劳动者的比喻，现代汉语清楚自然，也不额外限定具体职分。
- source_word: ἀνεπαίσχυντον
  choice: 无须羞愧的
  rationale: 该词不只描述主观上“不觉得羞耻”，也表示工作经得起检验，因而没有蒙羞的理由。“无须羞愧”较准确地传达这种客观意味。
- source_word: ὀρθοτομοῦντα
  choice: 正确处理
  rationale: 该词字面意象是“直切”，在此比喻准确、恰当地对待真理的信息。“正确处理”保留其宽泛性，不把意思缩限为讲授或解释。
- source_word: τὸν λόγον τῆς ἀληθείας
  choice: 真理的话
  rationale: 保留原文属格结构及保罗书信中的表达联系；现代读者也能理解为传达真理的话语或信息。
theological_decisions:
- issue: ὀρθοτομοῦντα在服事语境中的含义
  choice: 正确处理真理的话
  alternative: 正确教导真理的话；把真理的话直直地切开
  rationale: 此分词可能泛指准确地对待、宣讲或教导福音信息。正文采用较宽的表达，不把含义限定于单一服事行为；脚注保留更具体的解释和字面意象。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“上帝”用于 θεός；句式尽量保留原文的命令、目的与工人比喻，同时通过“经得起考验”和“无须羞愧”自然呈现评价语境。
