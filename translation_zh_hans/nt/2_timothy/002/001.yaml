source:
  edition: SBLGNT
  text: Σὺ οὖν, τέκνον μου, ἐνδυναμοῦ ἐν τῇ χάριτι τῇ ἐν Χριστῷ Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/001.yaml
  text: You[a], then, my child, be strengthened in the grace that is in Messiah Jesus[b],
translation:
  language: zh_hans
  text: 所以，我的孩子，你要在弥赛亚[a]耶稣里的恩典中刚强起来[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弥赛亚”也常译作“基督”；原文Χριστός意为“受膏者”。
    reason: 说明称号的传统译法及原文含义。
  - marker: b
    text: 或译：“得力。”原文动词的形式很可能含有领受力量的意味。
    reason: 说明动词语态所容许的另一种简洁译法。
lexical_decisions:
- source_word: Σὺ
  choice: 你
  rationale: 原文明确使用第二人称代词，带有一定强调意味；现代汉语命令句中保留“你”，可自然体现这一点。
- source_word: οὖν
  choice: 所以
  rationale: 承接上文，表达推论或过渡；“所以”在现代汉语中自然清楚。
- source_word: τέκνον μου
  choice: 我的孩子
  rationale: τέκνον本义为“孩子”，不专指男性；这一译法也保留保罗对提摩太亲切的属灵关系。
- source_word: ἐνδυναμοῦ
  choice: 得着刚强
  rationale: 该现在时命令语气的中间／被动形式很可能含有领受力量的意味；“得着刚强”比单纯“要刚强”更能反映这种受力色彩。
- source_word: ἐν τῇ χάριτι
  choice: 在……恩典中
  rationale: 保留ἐν所含的范围与凭借之间的张力，不把意思单一限定为“靠着”或“借着”。
- source_word: χάριτι
  choice: 恩典
  rationale: “恩典”是χάρις在此处自然且具有保罗书信语境的标准译法，兼有恩惠和施力的含义。
- source_word: τῇ ἐν Χριστῷ Ἰησοῦ
  choice: 弥赛亚耶稣里的
  rationale: 该限定结构说明这恩典是在弥赛亚耶稣里；此译法贴近原文结构，同时保持现代汉语可读性。
- source_word: Χριστῷ
  choice: 弥赛亚
  rationale: Χριστός源自“受膏者”的称号；译为“弥赛亚”保留其称号含义，并以脚注说明传统译法。
- source_word: Ἰησοῦ
  choice: 耶稣
  rationale: 采用该人名在现代中文圣经语境中的通行译名。
theological_decisions:
- issue: ἐνδυναμοῦ的语态与力量来源
  choice: 译作“得着刚强”，表达力量是领受而来的
  alternative: 译作“要刚强”或“刚强起来”
  rationale: 中间／被动形式与随后“在……恩典中”相配，较自然地指向所领受的力量，同时不把施力者在译文中明确补成原文未明说的对象。
- issue: Χριστός的称号含义
  choice: 译作“弥赛亚”
  alternative: 译作“基督”
  rationale: 此处Χριστός与Ἰησοῦ连用，但仍可保有称号意味；“弥赛亚”直接显明其称号含义，脚注保留传统中文形式。
- issue: ἐν τῇ χάριτι的范围与凭借含义
  choice: 译作“在……恩典中”
  alternative: 译作“靠着……恩典”
  rationale: 原文ἐν可以指所在范围，也可以带有凭借意味；直译为“在……中”可避免过早排除其中任何一面。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“我的孩子”保留亲切语气；“在……恩典中得着刚强”略带书面色彩，以保存原文介词含义和动词受力意味之间的神学张力。
