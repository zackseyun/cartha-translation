  text: καὶ ἀνανήψωσιν ἐκ τῆς τοῦ διαβόλου παγίδος, ἐζωγρημένοι ὑπ’ αὐτοῦ εἰς τὸ ἐκείνου θέλημα.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/026.yaml
  text: and they may come to their senses out of the devil’s snare[b][a], having been captured alive by him for his will.
translation:
  language: zh_hans
  text: 使他们能醒悟过来，脱离魔鬼的网罗；他们已经被他活捉[a]，为要遵行他的旨意[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “活捉”也可译作“掳去”或“俘获”；希腊文所用的词更具体地含有“活着捕获”的意思。
    reason: lexical_alternative
  - marker: b
    text: 或译：“他们已经被他活捉，为要遵行那一位的旨意。”有人认为“那一位”不是指魔鬼，而是指神。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνανήψωσιν
  choice: 醒悟过来
  rationale: 该词本义是从醉态中清醒过来，也可指恢复清醒的判断；此处用“醒悟过来”自然表达他们从迷惑中恢复清醒的含义。
- source_word: παγίδος
  choice: 网罗
  rationale: παγίς指捕捉猎物的罗网或圈套；“网罗”既保留具体捕猎意象，也适合此处比喻性的用法。
- source_word: διαβόλου
  choice: 魔鬼
  rationale: 此处διάβολος用作撒但的称号；“魔鬼”是现代汉语中通行且明确的译法。
- source_word: ἐζωγρημένοι
  choice: 已经被……活捉
  rationale: ζωγρέω具体指“活捉”，完成时被动分词表示他们因先前被捕而处于受制状态；“已经被……活捉”保留了词义及其时态语态的力量。
- source_word: ὑπ’ αὐτοῦ
  choice: 被他
  rationale: 就近的先行词是“魔鬼”，故保留代词“他”，不在正文中作不必要的重复。
- source_word: εἰς τὸ ἐκείνου θέλημα
  choice: 任凭他的意愿
  rationale: 该表达说明被掳后落入某一位意愿的支配或用途之下。“任凭他的意愿”在现代汉语中较自然，同时不强行补入希腊文没有明说的“遵行”；代词所指的争议则交由脚注说明。
theological_decisions:
- issue: εἰς τὸ ἐκείνου θέλημα中ἐκείνου所指为何
  choice: 正文按就近关系理解为魔鬼，译作“任凭他的意愿”
  alternative: “那一位”也可理解为神，即被带回而遵行神的旨意
  rationale: 前句“被他活捉”中的“他”最自然地回指魔鬼，而整句话仍在描写他们需要逃脱的受掳状态。不过，ἐκείνου在语法上并未把所指完全锁定，历来存在指向神的理解，因此以脚注保留这一真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“醒悟过来”传达恢复清醒判断的隐喻；“网罗”和“活捉”共同保留捕猎与受掳的意象。分号呈现主句与完成时分词所描述之既有状态的紧密联系。
