  rationale: 修订仅调整末句对εἰς τὸ ἐκείνου θέλημα的表达：以“为要遵行他的旨意”取代“任凭他的意愿”，使译文更忠实反映原文的目的／归向关系，并采用更合宜的经文语体。脚注继续保留ἐκείνου所指可能为神的解释，避免将存在争议的代词所指绝对化。
