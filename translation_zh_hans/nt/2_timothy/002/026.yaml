  naturalness: 原文整体庄重通顺，但“被他活捉，任凭他的意愿”在现代汉语中略显生硬，且容易理解为单纯受其摆布。改为“被他活捉，为要遵行他的旨意”更自然，并更清晰地表达受掳与意志之间的关系。
  terminology: “魔鬼”“网罗”“活捉”均合适，且保持经文的捕猎意象。“旨意”比“意愿”更适合此处的书面及经文语体，并能在正文中自然对应θέλημα。保留脚注说明ἐκείνου可能指神，不在正文中武断消除歧义。
