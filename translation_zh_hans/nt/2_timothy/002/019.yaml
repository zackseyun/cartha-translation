id: 2TI.2.19
reference: 2 Timothy 2:19
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ μέντοι στερεὸς θεμέλιος τοῦ θεοῦ ἕστηκεν, ἔχων τὴν σφραγῖδα ταύτην· Ἔγνω κύριος τοὺς ὄντας αὐτοῦ, καί· Ἀποστήτω ἀπὸ ἀδικίας πᾶς ὁ ὀνομάζων τὸ ὄνομα κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/019.yaml
  text: 'Nevertheless[a], the firm foundation of God stands, having this seal: “The Lord knows those who are his,” and[b], “Let everyone who names the name of the Lord depart from unrighteousness.”'
translation:
  language: zh_hans
  text: 然而，神的坚固根基仍然立着，有这样的印记[a]：“主认识属他的人”；又说：“凡称主名的人[b]，都要离开不义。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“带着这样的题字”。译作“印记”的词可指印章上的识别标记或题字。
    reason: lexical_alternative
  - marker: b
    text: 或译“凡求告主名的人”。希腊原文直译为“称主的名”，可指求告主或公开承认归属于他。
    reason: lexical_alternative
lexical_decisions:
- source_word: μέντοι
  choice: 然而
  rationale: 承接上文有关错误教导的论述，表达强烈的转折与让步，同时符合现代汉语的庄重语体。
- source_word: στερεὸς θεμέλιος
  choice: 坚固的根基
  rationale: 保留根基的比喻，并传达其稳定、可靠的性质。
- source_word: τοῦ θεοῦ
  choice: 神……的
  rationale: 直接保留属格关系，不限定它只表示所有、来源或性质。
- source_word: ἕστηκεν
  choice: 仍然立着
  rationale: 体现完成时所表达的既已立定并持续站立的状态，也呼应上下文中的对比。
- source_word: ἔχων τὴν σφραγῖδα ταύτην
  choice: 有这样的印记
  rationale: 保留σφραγίς的印记或印章意象；其上所载文字的含义在脚注中说明。
- source_word: Ἔγνω
  choice: 认识
  rationale: 引文中的不定过去时具有恒常、确定的意味；汉语用“认识”自然表达主对属他之人的确认与认知，不额外限定为过去事件。
- source_word: κύριος
  choice: 主
  rationale: 保留经文引语中的称谓及其神学厚度，不擅自明确为父神或基督。
- source_word: τοὺς ὄντας αὐτοῦ
  choice: 属他的人
  rationale: 简洁而准确地表达归属关系，符合现代汉语习惯。
- source_word: Ἀποστήτω
  choice: 都要离开
  rationale: 表达不定过去时命令语气所要求的明确、决断性远离；“都要”也自然承接πᾶς。
- source_word: ἀπὸ ἀδικίας
  choice: 离开不义
  rationale: “不义”保留ἀδικία兼有不正、罪恶与不公的宽广伦理范围，并维持经文语体。
- source_word: πᾶς ὁ ὀνομάζων τὸ ὄνομα κυρίου
  choice: 凡称主名的人
  rationale: 保留原文“称……名”的修辞形式，同时以简洁汉语表达公开认信或求告主名的含义；较解释性的译法列入脚注。
theological_decisions:
- issue: 两句印记文字中“主”的所指
  choice: 两处都只译作“主”，不进一步指明是父神、基督，或具有层叠所指的经文引用。
  alternative: 可将两处都理解为父神、都理解为基督，或认为两处所指不同。
  rationale: 希腊文只用κύριος，并未明确区分；经文引用进入基督徒语境后具有神学张力，译文应予保留，而不作超出原文的裁断。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“仍然立着”保留根基持续稳立的状态；两则引文以分号和“又说”清楚并列。脚注标记均置于所解释的词组之后。
