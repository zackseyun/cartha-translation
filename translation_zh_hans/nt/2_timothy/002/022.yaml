source:
  edition: SBLGNT
  text: τὰς δὲ νεωτερικὰς ἐπιθυμίας φεῦγε, δίωκε δὲ δικαιοσύνην, πίστιν, ἀγάπην, εἰρήνην μετὰ τῶν ἐπικαλουμένων τὸν κύριον ἐκ καθαρᾶς καρδίας.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/022.yaml
  text: But flee youthful desires[a], and pursue righteousness, faith, love, and peace[c][b], together with those who call on the Lord from a pure heart.
translation:
  language: zh_hans
  text: 但你要逃避年轻时的欲望[a]，并同那些出于纯洁的心呼求主的人一起，追求公义[b]、信心[c]、爱与和平。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“年轻时的激情”。原文泛指年轻时期常见的欲望，不一定只指性欲。
    reason: lexical_alternative
  - marker: b
    text: 或译“正义”。原词可以兼有道德正直以及关系或法律层面的意味。
    reason: alternative_reading
  - marker: c
    text: 或译“忠信”。原词可表示信、信靠或忠信，须按语境理解。
    reason: alternative_reading
lexical_decisions:
- source_word: νεωτερικὰς ἐπιθυμίας
  choice: 年轻时的欲望
  rationale: νεωτερικός指年轻时期所特有或常见的，ἐπιθυμία指欲望或强烈渴求。此译法保留其广泛含义，不把它局限于性欲。
- source_word: φεῦγε
  choice: 逃避
  rationale: 现在时命令语气表达持续的行动；“逃避”保留了原文主动远离的鲜明力度。
- source_word: δίωκε
  choice: 追求
  rationale: 该词在伦理劝勉中表示积极而持续地寻求，与“逃避”形成有力对照。
- source_word: δικαιοσύνην
  choice: 公义
  rationale: 在保罗书信的德行语境中，“公义”既自然又保留其道德与关系层面的丰富含义；“正义”作为可能侧重点列入脚注。
- source_word: πίστιν
  choice: 信心
  rationale: πίστις可指信、信靠或忠信；此处采用新约语境中通行且自然的“信心”，并在脚注保留“忠信”的可能性。
- source_word: ἀγάπην
  choice: 爱
  rationale: 直接、自然地对应ἀγάπη，并保持与新约其他相关经文的词汇联系。
- source_word: εἰρήνην
  choice: 和平
  rationale: 准确表达εἰρήνη在德行清单中的含义，并可涵盖人际和睦。
- source_word: μετὰ τῶν ἐπικαλουμένων τὸν κύριον
  choice: 同那些……呼求主的人一起
  rationale: μετά加属格表示结伴或共同参与；该译法清楚表明这些德行是在信徒群体中一同追求的。
- source_word: ἐκ καθαρᾶς καρδίας
  choice: 出于纯洁的心
  rationale: ἐκ表示来源，“出于”自然地呈现呼求主之举发自纯洁内心的意思。
theological_decisions:
- issue: “年轻时的欲望”的范围
  choice: 泛指年轻时期常见的各种不当欲望，不限于性欲
  alternative: 主要指性方面的情欲
  rationale: νεωτερικὰς ἐπιθυμίας本身含义较广，上下文也关注整体品格与行为，因此正文不将其范围缩窄。
- issue: δικαιοσύνη的译法
  choice: 正文译为“公义”
  alternative: 正义
  rationale: “公义”较能承载保罗书信中道德正直及合宜关系等层面；“正义”所突出的社会、关系或法律意味则在脚注中保留。
- issue: πίστις在德行清单中的含义
  choice: 正文译为“信心”
  alternative: 忠信
  rationale: 该词既可指信靠，也可指可靠、忠诚的品格；本处无法仅凭语法完全排除“忠信”，故以脚注保留歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“逃避”与“追求”保持原文鲜明的行动对比；将“同那些……的人一起”置于德行清单之前，使中文句法清楚，同时不改变其修饰“追求”的关系。所有脚注标记均紧随相关词语。
