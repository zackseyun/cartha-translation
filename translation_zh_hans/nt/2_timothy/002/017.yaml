  text: καὶ ὁ λόγος αὐτῶν ὡς γάγγραινα νομὴν ἕξει· ὧν ἐστιν Ὑμέναιος καὶ Φίλητος,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/017.yaml
  text: and their talk will spread like gangrene[a]. Among them are Hymenaeus and Philetus[b],
translation:
  language: zh_hans
  text: 他们的话[a]会像坏疽一样蔓延[b]；其中有许米乃和腓理徒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “话”也可译作“言论”或“信息”。
    reason: lexical_alternative
  - marker: b
    text: 这里的原文表达较直译为“将会扩展”；与“坏疽”连用，意思是会带着破坏性蔓延。
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγος
  choice: 话
  rationale: 结合上文所说的世俗空谈和下文的错误教导，这里指他们所说的话或言论；“话”自然简洁，同时保留可指话语、言论或信息的语义宽度。
- source_word: αὐτῶν
  choice: 他们的
  rationale: 按属格所有关系直译，修饰“话”。
- source_word: ὡς γάγγραινα
  choice: 像坏疽一样
  rationale: γάγγραινα指会侵蚀并扩散的坏疽；采用准确的医学名称，保留原文鲜明而具有破坏性的疾病比喻，不改译为“癌症”。
- source_word: νομὴν ἕξει
  choice: 会……蔓延
  rationale: 这个表达本有取得扩展范围、继续侵蚀之意；与“坏疽”搭配时，重点是破坏性地扩散。“蔓延”以自然汉语传达其语境含义。
- source_word: ὧν ἐστιν
  choice: 其中有
  rationale: 保留关系结构的部分意味，指出许米乃和腓理徒属于前述那一类人。
- source_word: Ὑμέναιος
  choice: 许米乃
  rationale: 采用现代中文圣经读者较熟悉的传统人名音译。
- source_word: Φίλητος
  choice: 腓理徒
  rationale: 采用现代中文圣经读者较熟悉的传统人名音译。
theological_decisions:
- issue: 疾病比喻的力度
  choice: 将错误言论描写为像坏疽一样蔓延
  alternative: 只按表达表层译作“将有其范围”或改用“癌症”来解释扩散
  rationale: 原文既保留“坏疽”这一具体疾病意象，又以νομὴν ἕξει表达其扩展。译文不把比喻改成另一种疾病，也不额外说明其在群体中的具体作用，从而保留警告的力度和开放性。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“坏疽”准确保留医学比喻；“蔓延”符合汉语对疾病及有害言论扩散的常用表达。分号清楚连接普遍警告与两个具体例子。
