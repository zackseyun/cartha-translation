revisions:
- from: 但要避开世俗的空谈[a]，因为这样的人会在不敬虔中越陷越深。
  to: 但要避开不敬神的空谈[a]，因为这样的人会进一步陷入不敬虔。
  rationale: 修订正文以“不敬神的”直接传达 βεβήλους 的不圣洁、亵慢神圣之意，避免“世俗的”在现代汉语中可能产生的中性或仅指日常生活的理解。将“越陷越深”改为“进一步陷入”，更贴近 ἐπὶ πλεῖον 与 προκόψουσιν 所表达的持续、加剧的负面发展，同时不削弱 ἀσεβείας 的宗教伦理分量。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T03:56:10Z'
review_pass:
  verdict: revise
  source_fidelity: “世俗的”在现代汉语中主要指世间、非宗教或日常层面，虽有脚注说明，正文仍不足以自然传达 βεβήλους 所含的不敬神圣、亵慢的负面宗教意味。将 προκόψουσιν 译为“越陷越深”虽能表达负面结果，却把原文“进展／进一步发展”的反讽性动态强化为‘陷入’，可作解释性译法但不如较中性的表述贴近原文。第三人称复数主语在上下文中最自然地指说这类话、持守这类言论的人；“这样的人”可保留。
  naturalness: “但要避开……，因为这样的人会……”自然通顺。“不敬神的空谈”在现代标准汉语中清楚、庄重，且比“世俗的空谈”更不易引起非宗教意义的误解。“会进一步陷入不敬虔”自然，但“在不敬虔中越陷越深”略显搭配生硬且强化了原文。
  terminology: 以“不敬神的”对应 βεβήλους，明确保留其与神圣相反的宗教道德分量；以“不敬虔”对应 ἀσεβείας，维持本段及汉语圣经语境中清晰的神学伦理术语。保留“空谈”和“避开”。
