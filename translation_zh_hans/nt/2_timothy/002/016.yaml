  - severity: low
    issue: “越陷越深”较原文的“进一步进展”更具形象化和陷落意味。
    rationale: προκόπτω 在负面语境中保留‘进展、发展’的反讽；“进一步陷入”既保留负面方向，也较少添加‘深陷’的画面。
  revised_text: 但要避开不敬神的空谈[a]，因为这样的人会进一步陷入不敬虔。
