  text: τὰς δὲ βεβήλους κενοφωνίας περιΐστασο· ἐπὶ πλεῖον γὰρ προκόψουσιν ἀσεβείας,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/016.yaml
  text: But avoid profane empty talk[a], for they will advance further into ungodliness,
translation:
  language: zh_hans
  text: 但要避开不敬神的空谈[a]，因为这样的人会进一步陷入不敬虔。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不敬神的空谈”也可译作“亵慢神圣的空话”“不敬虔的闲谈”或“空洞的言语”。
    reason: 词义替代及消歧
lexical_decisions:
- source_word: βεβήλους
  choice: 世俗的
  rationale: 此词指不属圣、亵慢神圣的事物；“世俗的”在此并非泛指日常生活，而是与敬虔和圣洁相对，并由脚注澄清其宗教道德意味。
- source_word: κενοφωνίας
  choice: 空谈
  rationale: 保留“空洞言语”的基本意象，同时符合现代汉语习惯，指缺乏真实内容和属灵价值的言谈。
- source_word: περιΐστασο
  choice: 避开
  rationale: 中间语态命令式要求提摩太绕开、远离这类言谈；“避开”简洁自然，也保留主动远离之意。
- source_word: ἐπὶ πλεῖον
  choice: 越……越深
  rationale: 与 προκόψουσιν 和 ἀσεβείας 合译，表达向更大程度持续发展的动态，现代汉语中自然有力。
- source_word: προκόψουσιν
  choice: 会……越陷越深
  rationale: 原词本义为前进、进展，此处反讽地用于负面方向；“越陷越深”清楚呈现不断深入不敬虔的结果。
- source_word: ἀσεβείας
  choice: 不敬虔
  rationale: 此词指对神缺乏敬畏、背离敬虔；“不敬虔”保留明确的宗教和道德分量。
- source_word: δὲ
  choice: 但
  rationale: 承接上文并形成劝勉上的转折，“但”准确而自然。
theological_decisions:
- issue: 这类言谈只是无益，还是兼有亵慢神圣的性质
  choice: 正文译作“世俗的空谈”，同时保留空洞性及其与神圣、敬虔相反的性质。
  alternative: “无益的空谈”或“亵渎的闲谈”
  rationale: βεβήλους 与 κενοφωνίας 分别提供不属圣和空洞的含义，不宜只保留其中一面；脚注进一步防止“世俗”被误解为仅指日常或非宗教事物。
- issue: προκόψουσιν 的主语所指
  choice: 译作“这样的人”，理解为从事这类空谈的人。
  alternative: 译作“这些空谈会使人”或不明说主语
  rationale: 希腊语动词为第三人称复数，而最近的显性名词为阴性复数；主语可能意指参与这类言谈的人。补出“这样的人”使汉语通顺，但不把它解释为言谈本身。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“越陷越深”比直译“向前进展”更符合负面语境，同时保留不断发展的动态。脚注标记已在正文中标出。
