  text: εἰ ὑπομένομεν, καὶ συμβασιλεύσομεν· εἰ ⸀ἀρνησόμεθα, κἀκεῖνος ἀρνήσεται ἡμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/012.yaml
  text: If we endure[a], we will also reign with him; if we deny him, he also will deny us.
translation:
  language: zh_hans
  text: 我们若忍耐，也必与他一同作王；我们若不认他[a]，他也必不认我们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不认”也可译作“弃绝”；本句也可译作：“我们若弃绝他，他也必弃绝我们。”
    reason: 词义范围包括否认、不承认和弃绝；脚注呈现语气更强的合理译法，同时保留上下两句使用同一动词的对应。
lexical_decisions:
- source_word: ὑπομένομεν
  choice: 忍耐
  rationale: 这里指在考验或苦难中坚定承受、持守。“忍耐”简洁自然，并保留条件句的力度，不额外引入特定神学术语。
- source_word: συμβασιλεύσομεν
  choice: 必与他一同作王
  rationale: 这个复合动词表示“一同作王、共同掌权”。“作王”保留王权意象；“与他”按上下文补明共同作王的对象，所指为基督。
- source_word: ἀρνησόμεθα
  choice: 不认他
  rationale: ἀρνέομαι可指否认、不承认或弃绝。“不认他”在现代汉语中自然，也能与下句同一动词的重复相呼应；宾语“他”由上下文补出。
- source_word: κἀκεῖνος
  choice: 他也
  rationale: κἀκεῖνος是καὶ ἐκεῖνος的缩合形式，表达相应或回应关系。“他也”自然地保留两句之间的对应。
- source_word: ἀρνήσεται ἡμᾶς
  choice: 必不认我们
  rationale: 再次用“不认”对应重复出现的ἀρνέομαι，保留原文警告鲜明的对称结构和修辞力度。
theological_decisions:
- issue: 第二个条件句中警告的性质
  choice: 按原文直接译作真实而严肃的警告：“我们若不认他，他也必不认我们。”
  alternative: 将“不认我们”限定解释为仅失去奖赏，或把条件句视为没有实际可能性的纯假设。
  rationale: 希腊文以对称的条件句直接陈述这一警告，并与耶稣关于人若不认他、也将被不认的警告传统相呼应。译文保留其严重性和神学张力，不预先裁定有关背道、坚忍或奖赏的争论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我们若……也必……”保留格言式的平衡结构；“一同作王”保留原文的王权意象；两个“不认”维持原文刻意的词语重复。
