  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἃ ἤκουσας παρ’ ἐμοῦ διὰ πολλῶν μαρτύρων, ταῦτα παράθου πιστοῖς ἀνθρώποις, οἵτινες ἱκανοὶ ἔσονται καὶ ἑτέρους διδάξαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/002.yaml
  text: And what you heard from me in the presence of many witnesses[a], entrust these things to faithful men[b], who will be competent to teach others also.
translation:
  language: zh_hans
  text: 你从我这里、在许多见证人面前听见的这些事，要托付给忠信可靠的人；他们也将能够教导别人。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“借着许多见证人。”这里的希腊语短语也可能表示许多见证人是传递教导的媒介；但较可能是指保罗的教导是在许多见证人在场时公开传授的。
    reason: lexical_alternative
  - marker: b
    text: 希腊语为阳性复数，直译可作“忠信的男人”；但“人”在此也可能是泛指忠信可靠的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἃ
  choice: 所听见的
  rationale: 中性复数关系代词指提摩太所领受的教导内容；汉语用“所……的”结构自然地保留其宾语性质。
- source_word: ἤκουσας
  choice: 你……听见
  rationale: 不定过去时在此指提摩太先前从保罗领受教导，汉语无需另加完成体标记。
- source_word: παρ’ ἐμοῦ
  choice: 从我这里
  rationale: παρά加属格与ἀκούω连用表示来源，即提摩太所听内容来自保罗。
- source_word: διὰ πολλῶν μαρτύρων
  choice: 在许多见证人面前
  rationale: διά加属格可表达媒介，也可表达伴随情境；此处较可能指保罗公开教导时有许多见证人在场。译文保留脚注说明其他可能。
- source_word: ταῦτα
  choice: （由“所听见的”承接）
  rationale: 希腊文ταῦτα回指前面的教导内容。汉语若再译“这些事”略显重复，故用前置宾语结构自然承接，同时保留同一指涉。
- source_word: παράθου
  choice: 要托付给
  rationale: 该不定过去时中间语态命令式在此意为把某物交由他人负责保管和传递；“托付”兼具信任与责任的含义。
- source_word: πιστοῖς
  choice: 忠信的
  rationale: πιστός可指忠诚、可靠，也可能带有信仰层面的意味；“忠信”较好地保留这些语义，而不单限定为技术能力。
- source_word: ἀνθρώποις
  choice: 人
  rationale: ἄνθρωπος虽为阳性形式，却常可泛指人。现代汉语“人”自然、不增添原文未明确限定的性别；脚注交代希腊文形式及可能理解。
- source_word: οἵτινες
  choice: 使他们
  rationale: 该定性关系代词说明受托付者应具备的特征。汉语以“使他们……”顺畅表达托付所指向的结果和资格。
- source_word: ἱκανοὶ ἔσονται
  choice: 能
  rationale: ἱκανός与将来时ἔσονται表示这些人将有足够能力承担教导任务；“能”在现代汉语中简洁自然，不额外引入正式认证之意。
- source_word: ἑτέρους
  choice: 别人
  rationale: 指受托者以外的其他人；“别人”是自然清楚的现代汉语表达。
- source_word: διδάξαι
  choice: 教导
  rationale: 准确表达传授所领受教导的行动，并保持庄重的圣经语体。
theological_decisions:
- issue: πιστοῖς ἀνθρώποις的性别范围
  choice: 忠信的人
  alternative: 忠信的男人／忠信的弟兄
  rationale: ἄνθρωπος的阳性复数形式可按语境指男性，也可作代表性或泛指用法。正文译“人”保留这种范围上的开放性，避免把语法性别直接收窄为生理性别；脚注明示原文形式。
- issue: διὰ πολλῶν μαρτύρων所表达的关系
  choice: 在许多见证人面前
  alternative: 借着许多见证人
  rationale: διά加属格容许“借着”的媒介解释，但上下文更可能强调提摩太从保罗听见的教导具有公开、多人见证的性质。脚注保留真实歧义。
- issue: 受托者的资格
  choice: 忠信……能教导
  alternative: 有信仰……有资格教导
  rationale: 原文分别强调πιστός的忠信可靠与ἱκανός的足够能力，不宜把它们扩展成特定宗派所规定的职分资格或认证制度。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“你从我这里、在许多见证人面前所听见的”保持来源和公开见证两层关系；“托付”突出教导传承中的责任。“忠信的人”避免过度限定性别，并以脚注保留希腊文阳性形式。
