- from: 以温和的态度劝戒那些反对他的人[a]；或许神会赐他们悔改，使他们认识真理[b]。
  to: 温柔地劝导那些持反对立场的人[a]，也许神会赐他们悔改，使他们得以认识真理[b]。
  rationale: 修订保留神可能赐下悔改的陈述及其未被系统化的神学张力；删除正文中原文未明说的“他”，并将悔改与认识真理之间的目标／结果关系译得更清楚。脚注亦改为准确、自然地说明原文的省略和 μήποτε 的审慎语气。
