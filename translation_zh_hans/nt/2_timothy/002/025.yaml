  text: ἐν πραΰτητι παιδεύοντα τοὺς ἀντιδιατιθεμένους, μήποτε ⸀δώῃ αὐτοῖς ὁ θεὸς μετάνοιαν εἰς ἐπίγνωσιν ἀληθείας,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/025.yaml
  text: correcting those who oppose him with gentleness[a], in case God may grant them repentance leading to the knowledge of the truth[b],
translation:
  language: zh_hans
  text: 温柔地劝导那些持反对立场的人[a]，也许神会赐他们悔改，使他们得以认识真理[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文也可直译为“那些反对的人”；所反对的对象没有明说。上下文表明，这与主的仆人及其教导有关。
    reason: lexical_alternative
  - marker: b
    text: 或译：“也许神会赐他们悔改。”原文以审慎的语气表达这种可能性；“悔改”导向对真理的认识。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν πραΰτητι
  choice: 以温和的态度
  rationale: 该介词短语表示劝戒的方式；“温和”自然、庄重，也不含现代汉语中“软弱”的意味。
- source_word: παιδεύοντα
  choice: 劝戒
  rationale: 此处指带有教导性质的纠正，而非惩罚性的管教；“劝戒”兼顾教导和纠正两层意思。
- source_word: τοὺς ἀντιδιατιθεμένους
  choice: 那些反对他的人
  rationale: 该分词指持反对立场的人。“他”依据上一节“主的仆人”补出，使中文关系清楚；脚注说明原文并未明说宾语。
- source_word: μήποτε
  choice: 或许
  rationale: 与虚拟语气动词连用，表达审慎的可能性，也可能带有目的意味；“或许”保留这种不确定性。
- source_word: δώῃ αὐτοῖς ὁ θεὸς
  choice: 神会赐他们
  rationale: δίδωμι 在这里宜译为“赐”，明确保留神是施予者；“会”与“或许”共同表达原文虚拟语气的或然性。
- source_word: μετάνοιαν
  choice: 悔改
  rationale: “悔改”是现代汉语基督教语境中准确而通行的对应词，涵盖心意转变与回转，不把含义缩减为纯理智上的改变。
- source_word: εἰς ἐπίγνωσιν ἀληθείας
  choice: 使他们认识真理
  rationale: εἰς 表示目标或结果；此译法自然地呈现悔改导向对真理的认识。ἐπίγνωσις 所含的确切认识之意由语境承载，不刻意加入原文没有的程度副词。
theological_decisions:
- issue: 神的作为与人的悔改
  choice: 保留“神赐悔改”的明确表述，同时用“或许”呈现本句的审慎可能性。
  alternative: 强化为决定论式陈述，或弱化神在悔改中的主动作用。
  rationale: 原文明说神可能赐下悔改，却没有在本节系统解释这与人的回应如何关联；译文不替经文消解这一张力。
- issue: 反对的对象
  choice: 依据上文补出“他”，指主的仆人。
  alternative: 不补宾语，译作“持反对立场的人”。
  rationale: 希腊文没有明说反对谁；中文正文为清晰而按语境补出，并用脚注保留原文的省略和可能范围。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“劝戒”保留 παιδεύω 的教导性纠正意味；句式承接上一节对“主的仆人”的要求。
