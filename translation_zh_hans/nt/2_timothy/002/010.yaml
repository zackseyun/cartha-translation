id: 2TI.2.10
reference: 2 Timothy 2:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: διὰ τοῦτο πάντα ὑπομένω διὰ τοὺς ἐκλεκτούς, ἵνα καὶ αὐτοὶ σωτηρίας τύχωσιν τῆς ἐν Χριστῷ Ἰησοῦ μετὰ δόξης αἰωνίου.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/010.yaml
  text: For this reason I endure everything for the sake of the elect[c][b][a], so that they also may obtain the salvation that is in Messiah Jesus with eternal glory.
translation:
  language: zh_hans
  text: 因此，我为选民[a]忍受一切，好使他们也能得着在弥赛亚耶稣[b]里的救恩，连同永恒的荣耀。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“蒙拣选的人”。希腊语为ἐκλεκτούς。
    reason: lexical_alternative
  - marker: b
    text: 传统译法：“基督耶稣”。
    reason: alternative_reading
  - marker: c
    text: 本句末尾也可译作：“得着那在弥赛亚耶稣里、带着永恒荣耀的救恩。”
    reason: syntactic_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: 因此
  rationale: 承接上文，表达保罗忍受一切的缘由；“因此”简洁自然，并保留因果衔接。
- source_word: πάντα ὑπομένω
  choice: 我忍受一切
  rationale: πάντα具有涵盖一切的语气，ὑπομένω表示在患难中坚忍承受；这一译法既直接又庄重。
- source_word: διὰ τοὺς ἐκλεκτούς
  choice: 为选民
  rationale: διά加宾格在此表达为了某群人的益处；“选民”保留ἐκλεκτούς的拣选含义，不以神学体系进一步限定其范围。
- source_word: ἵνα καὶ αὐτοὶ
  choice: 好使他们也
  rationale: “好使”保留ἵνα的目的意味，“也”对应καί；αὐτοί所带的强调在中文语境中由代词和上下文自然体现。
- source_word: σωτηρίας τύχωσιν
  choice: 能得着……救恩
  rationale: τυγχάνω加属格表示获得或得着；“能”适合表达目的从句中的虚拟语气，不暗示仅凭人的能力取得救恩。
- source_word: τῆς ἐν Χριστῷ Ἰησοῦ
  choice: 在弥赛亚耶稣里的
  rationale: 保留保罗“在……里”的联合或领域性表达；Χριστός在此仍具有称号意义，译为“弥赛亚”。
- source_word: μετὰ δόξης αἰωνίου
  choice: 连同永恒的荣耀
  rationale: μετά加属格表达伴随；“连同”清楚表明永恒荣耀与救恩相伴，同时避免把两者完全拆成互不相关的对象。
theological_decisions:
- issue: ἐκλεκτούς的译法
  choice: 选民
  alternative: 蒙拣选的人
  rationale: “选民”准确保留原文的拣选语言，简洁而为现代中文读者所理解；脚注列出较展开的译法，以免把任何特定宗派的拣选观带入正文。
- issue: Χριστῷ是称号还是名称化用语
  choice: 弥赛亚耶稣
  alternative: 基督耶稣
  rationale: 此处Χριστός虽位于保罗常用组合中，却仍可保有“受膏者／弥赛亚”的称号意义；正文采用语义透明的“弥赛亚”，脚注保留中文传统译法。
- issue: μετὰ δόξης αἰωνίου与σωτηρίας的关系
  choice: 救恩，连同永恒的荣耀
  alternative: 带着永恒荣耀的救恩
  rationale: 原文最自然地表达救恩伴随着永恒荣耀，但修饰关系在中文中可有不同组织方式；正文保留伴随关系，脚注说明另一种较紧密连接荣耀与救恩的译法。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“忍受一切”保持原文力度；“得着”比“获取”更适合经文语域，但仍属现代常用表达。标点将“连同永恒的荣耀”作为伴随成分清楚呈现，避免中文修饰语堆叠。
