  text: Μνημόνευε Ἰησοῦν Χριστὸν ἐγηγερμένον ἐκ νεκρῶν, ἐκ σπέρματος Δαυίδ, κατὰ τὸ εὐαγγέλιόν μου·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/008.yaml
  text: Remember Jesus the Messiah[a], raised from the dead, descended from David[b], according to my gospel.
translation:
  language: zh_hans
  text: 你要记住耶稣这位弥赛亚[a]：他已经从死人中复活，是大卫的后裔[b]，正如我所传的福音所说。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“耶稣基督”。希腊语 Χριστός 是称号，可译为“基督”或“弥赛亚”；本节提到大卫的后裔，因此正文用“弥赛亚”显明这一称号的含义。
    reason: alternative_reading
  - marker: b
    text: 直译“大卫的种子”，意思是大卫的后裔。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μνημόνευε
  choice: 你要记住
  rationale: 现在时命令语气带有持续留意、不断牢记的意味；“你要记住”自然地保留了劝命语气，且没有过度扩写。
- source_word: Ἰησοῦν Χριστόν
  choice: 耶稣这位弥赛亚
  rationale: Χριστός在大卫后裔这一语境中明显保留君王称号的含义；“这位弥赛亚”在现代汉语中自然地表明它是称号，而不是姓氏。
- source_word: ἐγηγερμένον
  choice: 已经……复活
  rationale: 完成时被动分词表示耶稣已经被使之复活，并处于复活后的状态。汉语通常以“已经……复活”自然表达；被动施事者在原文中也未明说，因此不擅自补出“上帝使他”。
- source_word: ἐκ νεκρῶν
  choice: 从死人中
  rationale: 保留“从死者当中”的基本图景，同时采用现代汉语圣经语境中清楚易懂的表达。
- source_word: ἐκ σπέρματος Δαυίδ
  choice: 是大卫的后裔
  rationale: σπέρμα字面为“种子”，在家系语境中指后代；译为“后裔”准确、庄重且自然。
- source_word: κατὰ τὸ εὐαγγέλιόν μου
  choice: 这是照着我所传的福音说的
  rationale: κατά表达“按照、符合”；补出“所传”说明“我的福音”是保罗所宣讲的福音，而非他另创的一种福音，同时使句尾在汉语中顺畅。
theological_decisions:
- issue: Χριστός应译为称号还是名称式的“基督”
  choice: 弥赛亚
  alternative: 基督
  rationale: 复活与大卫后裔的并列使受膏君王的称号意味突出。“弥赛亚”显明称号含义；脚注保留传统译法“基督”。
- issue: ἐγηγερμένον的完成时被动意味
  choice: 已经从死人中复活
  alternative: 已经从死人中被复活
  rationale: 原文为被动式，但现代汉语“被复活”生硬；“已经复活”保留完成状态，不擅自明说原文省略的施事者。
- issue: “我的福音”的含义
  choice: 我所传的福音
  alternative: 我的福音
  rationale: μου直译为“我的”，这里自然指保罗所宣讲、受托传扬的福音；译为“我所传的”避免读者误解为属于保罗的另一套福音。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“耶稣这位弥赛亚”明确称号关系；冒号和分号呈现原文紧凑的同位说明，并使句末“照着我所传的福音”自然关联前面的宣告。
