id: 2TI.2.20
reference: 2 Timothy 2:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ἐν μεγάλῃ δὲ οἰκίᾳ οὐκ ἔστιν μόνον σκεύη χρυσᾶ καὶ ἀργυρᾶ ἀλλὰ καὶ ξύλινα καὶ ὀστράκινα, καὶ ἃ μὲν εἰς τιμὴν ἃ δὲ εἰς ἀτιμίαν·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/020.yaml
  text: In a large house there are not only gold and silver vessels[a], but also wooden and earthenware ones, and some are for honor[b], but others for dishonor.
translation:
  language: zh_hans
  text: 在大宅里，不但有金器和银器，也有木器和陶器[a]；有些作尊贵之用，有些却作卑贱之用[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “陶器”指用黏土烧制的器皿。
    reason: cultural_note
  - marker: b
    text: 或译：“有些为尊贵，有些却为卑贱。”原文直译为“归于尊贵……归于卑贱”。
    reason: lexical_alternative
lexical_decisions:
- source_word: μεγάλῃ οἰκίᾳ
  choice: 大户人家
  rationale: 既保留规模较大的家庭意象，也自然暗示其中有各类器皿；比直译“大房子”更符合现代汉语语境，且不把 μέγας 误解为道德上的“伟大”。
- source_word: σκεύη
  choice: 器
  rationale: “器”可概括容器、器具等物件，适合承载本段的比喻，也能与金、银、木、陶等材料名称自然组合。
- source_word: χρυσᾶ καὶ ἀργυρᾶ
  choice: 金器和银器
  rationale: 明确表示器物的材质，符合现代汉语常用表达。
- source_word: ξύλινα καὶ ὀστράκινα
  choice: 木器和陶器
  rationale: ξύλινα 指木制品；ὀστράκινα 指以烧制黏土制成的器物，“陶器”准确、通俗。
- source_word: καὶ ἃ μὲν ... ἃ δὲ ...
  choice: 有些……有些却……
  rationale: 清楚表达 μέν...δέ 的组内对照，并保持汉语流畅。
- source_word: εἰς τιμήν
  choice: 为尊贵
  rationale: 保留 τιμή 的抽象含义及“归于、用于”尊贵的开放性，不在正文中限定为某种具体用途。
- source_word: εἰς ἀτιμίαν
  choice: 为卑贱
  rationale: 与“尊贵”形成鲜明对应，并保留 ἀτιμία 所含的低贱、失去尊荣之意。
- source_word: δὲ (initial)
  choice: 不单独译出
  rationale: 此处 δέ 承接上下文，现代汉语无需另加“如今”或强转折词；句内“不但……也……”已自然组织论述。
theological_decisions:
- issue: 是否把 τιμή/ἀτιμία 明确解释为器皿的“贵重用途/卑贱用途”
  choice: 正文保留“为尊贵……为卑贱”
  alternative: 作贵重的用途……作卑贱的用途；作体面的用途……作不体面的用途
  rationale: 原文使用抽象名词“尊荣/不尊荣”，既可涉及用途，也可涉及地位或评价。较贴近形式的表达能保留其与下一节之间的神学张力，不把比喻预先收窄为纯粹的实用分类。
translation_notes:
  register: 采用庄重而通俗的现代标准汉语。“大户人家”使家庭场景自然清楚；“金器、银器、木器、陶器”结构整齐。正文保留“尊贵/卑贱”的抽象对照，脚注说明功能性译法。
