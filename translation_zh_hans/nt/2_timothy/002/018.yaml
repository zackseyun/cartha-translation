  text: οἵτινες περὶ τὴν ἀλήθειαν ἠστόχησαν, ⸀λέγοντες ἀνάστασιν ἤδη γεγονέναι, καὶ ἀνατρέπουσιν τήν τινων πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/018.yaml
  text: who have gone astray from the truth[a], saying that the resurrection has already happened[e][d][c][b], and are upsetting the faith of some.
translation:
  language: zh_hans
  text: 他们偏离了真理[a]，声称复活已经发生了[b]，并且正在动摇一些人的信心[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “偏离了真理”也可译作“在真理上没有击中目标”或“在真理上走偏了”。
    reason: lexical_alternative
  - marker: b
    text: 也就是，他们声称复活已经成为过去发生的事；本节没有进一步说明这套错误教导的具体形式。
    reason: cross_reference
  - marker: c
    text: “动摇”也可译作“颠覆”或“推翻”；“信心”也可译作“信仰”或“信靠”。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: 他们
  rationale: 承接上文所说的假教师。汉语若直译为“那些……的人”会使本句残缺，因此用“他们”自然衔接上下文。
- source_word: περὶ τὴν ἀλήθειαν ἠστόχησαν
  choice: 偏离了真理
  rationale: ἀστοχέω本有未击中目标、走偏之意；与περί短语连用时，表示在真理上走入歧途。“偏离了真理”既自然，也保留其方向性意象。
- source_word: λέγοντες
  choice: 说
  rationale: 保留分词对其错误内容的说明，不强行限定为手段或时间关系。
- source_word: ἀνάστασιν
  choice: 复活的事
  rationale: 此处虽无冠词，但语境指向所争论的复活。“复活的事”在现代汉语中自然，也不额外断定其具体教义体系。
- source_word: ἤδη γεγονέναι
  choice: 已经发生了
  rationale: γεγονέναι为完成时不定式，表达他们宣称复活已成为事实；“已经发生了”准确保留完成性和当前关联。
- source_word: ἀνατρέπουσιν
  choice: 正在动摇
  rationale: 该词可指推翻、颠覆或毁坏；此处宾语为人的信心，“动摇”能表达持续造成的不稳定影响，又不武断地说信心已完全毁灭。
- source_word: τήν τινων πίστιν
  choice: 一些人的信心
  rationale: τινων表示不确定的一部分人；πίστις在此最自然地指他们的信仰或信靠状态，“信心”简洁且符合现代教会及普通汉语用法。
theological_decisions:
- issue: “复活已经发生了”的含义
  choice: 直接译出他们声称复活已经发生，不说明其具体教义机制
  alternative: 明确解释为只有属灵的复活，或否认将来身体复活
  rationale: 本节只报告这项错误主张，并未详述其体系；正文不应加入经文没有明说的重构。
- issue: πίστις的语义
  choice: 信心
  alternative: 信仰；信靠
  rationale: 这里指某些人受到错误教导冲击的信靠或信仰状态。“信心”保留个人信靠层面，同时不引入“忠信”之义。
- issue: ἀνατρέπουσιν所描述的结果程度
  choice: 动摇
  alternative: 推翻；颠覆；毁坏
  rationale: 原词力度可较强，但本句未明确表示这些人已彻底离弃信仰；“动摇”保留持续的破坏作用而避免过度断定。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。句法以“他们”承接上文，并用“偏离……并且正在动摇……”呈现同一主语下的两个谓语。避免古奥表达，也不把错误教导解释成经文未明说的特定体系。
