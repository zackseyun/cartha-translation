  text: οὐδεὶς στρατευόμενος ἐμπλέκεται ταῖς τοῦ βίου πραγματείαις, ἵνα τῷ στρατολογήσαντι ἀρέσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/004.yaml
  text: No one serving as a soldier gets entangled in the affairs of ordinary life[a], so that he may please the one who enlisted him.
translation:
  language: zh_hans
  text: 凡服兵役的，没有一个会被日常生活的事务缠住[a]，为要使那招他入伍的人喜悦。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“平民生活的营生”。希腊语在这里把服兵役与日常生活中的事务或营生相对照。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς στρατευόμενος
  choice: 凡当兵的，都不
  rationale: 用现代汉语的全称否定结构表达“没有一个服兵役的人”，既保留普遍语气，也避免生硬直译。
- source_word: ἐμπλέκεται
  choice: 让自己被……缠住
  rationale: 该动词指陷入纠缠、以致行动受阻；“被……缠住”保留鲜明意象。“不让自己”也自然表达希腊语中主体参与其中的意味。
- source_word: ταῖς τοῦ βίου πραγματείαις
  choice: 日常生活的事务
  rationale: πραγματείαις可指事务、营生或经营活动，βίου在这里侧重现世日常生活；此译保留范围，不把含义限定为商业或职业活动。
- source_word: ἵνα
  choice: 为要
  rationale: 清楚表达目的关系，语体庄重而自然。
- source_word: τῷ στρατολογήσαντι
  choice: 那招他入伍的人
  rationale: 准确表达“征募、招募入伍者”，不擅自加入“长官”等原文未明说的军阶。
- source_word: ἀρέσῃ
  choice: 使……喜悦
  rationale: 保留取悦、蒙认可的目的含义，并与目的从句自然衔接。
theological_decisions:
- issue: 军事比喻的范围
  choice: 直接保留当兵、缠住、招入伍和使其喜悦的军事图景
  alternative: 将全句解释性改写为传道人应专心事奉，或把事务明确限定为“世俗事务”
  rationale: 原文用军事比喻劝勉，但本节本身没有明说具体应用，也没有把普通生活判定为邪恶；译文不应提前替读者化解这层张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“凡……都不……”比“没有一个……会……”更顺畅；“日常生活的事务”避免把原文误解为对普通生活本身的否定。
