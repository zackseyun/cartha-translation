source:
  edition: SBLGNT
  text: σὺ δὲ μένε ἐν οἷς ἔμαθες καὶ ἐπιστώθης, εἰδὼς παρὰ ⸀τίνων ἔμαθες,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/014.yaml
  text: But as for you[a], remain in what you learned and became convinced of, knowing from whom you learned it[b],
translation:
  language: zh_hans
  text: 但你却要持守你所学并确信的事[a]，知道你是从哪些人那里学来的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“并得了确据的事”。
    reason: lexical_alternative
  - marker: b
    text: 有些抄本作单数“从谁那里”；这常被理解为指保罗。这里依据复数读法，可能较广泛地指教导过提摩太的人。
    reason: textual_variant
lexical_decisions:
- source_word: σὺ δὲ
  choice: 但你却
  rationale: 明示代词“你”并用“却”突出与上文恶人和骗子的对比；“但”也保留话语的转折与推进。
- source_word: μένε ἐν οἷς
  choice: 要持守……的事
  rationale: μένε是现在时命令式，表示持续坚持；“持守”自然表达留在所受教导之中、不偏离它的含义。
- source_word: ἔμαθες
  choice: 所学
  rationale: 表达提摩太先前领受教导这一事实，简洁而符合现代汉语。
- source_word: ἐπιστώθης
  choice: 确信
  rationale: 该被动形式在此表示得到确证、形成坚定把握；“确信”与“所学”并列自然，也不采用较不可能的“受托”。
- source_word: εἰδὼς
  choice: 知道
  rationale: 保留分词的简练表达，不把它与主句的关系明确限定为原因或伴随情形。
- source_word: παρὰ τίνων
  choice: 从哪些人那里
  rationale: παρά加属格表示来源；SBLGNT所据读法为复数，因此用“哪些人”明确反映复数，同时不指明这些人的身份。
- source_word: ἔμαθες
  choice: 学来的
  rationale: 第二次出现时用“学来的”自然回指前面的教导内容，并体现其来源。
theological_decisions:
- issue: παρὰ τίνων所指的人
  choice: 译作“从哪些人那里”，不在正文中指明具体是谁
  alternative: 有些抄本采用单数形式，可理解为“从谁那里”，常被认为专指保罗
  rationale: SBLGNT正文采用复数，可能包括保罗以及提摩太早年的其他教导者；经文本身没有列明身份，因此保留开放性，不把某一解释写入正文。
- issue: ἐπιστώθης的含义
  choice: 译作“确信”
  alternative: 也可理解为“得了确据”
  rationale: 上下文强调提摩太不但学过这些事，也对其真实性有坚定把握；译文保留这种确定性，而不将其解释为被托付某项职分。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“但你却”凸显上下文对比；“持守”适合劝勉语境，且普通读者容易理解。句式尽量贴近希腊文的紧凑结构，同时避免生硬直译。
