    text: 或译“恨恶良善”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄστοργοι
  choice: 没有亲情
  rationale: 该词指缺少人自然应有的亲爱，尤其是家人、亲属之间的亲情。“没有亲情”简明自然，也保留了其关系层面的具体含义。
- source_word: ἄσπονδοι
  choice: 不肯和解
  rationale: 该词可指不愿接受和解、难以平息的人。“不肯和解”突出其拒绝和好的意愿，比“背约”更少限定为已经违反协议。
- source_word: διάβολοι
  choice: 毁谤人
  rationale: 此处为复数形式，置于品行恶劣的清单中，指以毁谤、诬告伤害别人，而不是指“魔鬼”。“毁谤人”在现代汉语中清楚表达这种行为特征。
- source_word: ἀκρατεῖς
  choice: 不能自制
  rationale: 该词表示无法约束自己的欲望和冲动。“不能自制”自然明确，并保留缺乏自我控制的道德含义。
- source_word: ἀνήμεροι
  choice: 凶暴
  rationale: 该词本有未驯服、粗野残暴之意。“凶暴”简洁地呈现其狠厉、不温良的特征。
- source_word: ἀφιλάγαθοι
  choice: 不爱良善
  rationale: 该复合词直指不喜爱良善或善事。“不爱良善”保留否定之意，不把它强化为主动仇恨良善。
theological_decisions:
- issue: 品行清单中 διάβολοι 的含义
  choice: 按普通道德描述译为“毁谤人”
  alternative: “魔鬼”或“像魔鬼”
  rationale: 复数形式在此与其他恶行并列，描述人的毁谤行为；译成“魔鬼”容易使读者误以为这里是在指某类灵界存在。
translation_notes:
  register: 采用现代、庄重而易懂的并列短语，保持原文恶行清单的紧凑节奏。各项不用成语堆砌，以免增加原文没有的色彩；末尾保留逗号，因为本节内容在句法上继续至下一项。
