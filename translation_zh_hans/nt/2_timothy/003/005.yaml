base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/005.yaml
  text: having a form of godliness but denying its power[b][a]; and turn away from these people.
translation:
  language: zh_hans
  text: 他们有敬虔的形式[a]，却否认了敬虔的能力；你要避开这样的人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“敬虔的外表”。希腊词可侧重外在形式或具体呈现；正文采用“形式”，以保留它与“能力”的对照。
    reason: lexical_alternative
  - marker: b
    text: 或译“远离这样的人”或“转身离开这样的人”。原词含有使自己转离他们的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχοντες
  choice: 有
  rationale: 这是现在分词，继续描述上文所说的人；汉语用“有”自然承接其特征清单，无须机械保留分词形式。
- source_word: μόρφωσιν
  choice: 形式
  rationale: 该词可指形式、外在形态或具体呈现。“形式”既保留其可能偏重外在表现的含义，也与下文的“能力”形成鲜明对照，而不过早断定这种形式全然虚假。
- source_word: εὐσεβείας
  choice: 敬虔
  rationale: 在教牧书信中，该词通常指向神的敬畏、虔诚及由此表现出的生活；“敬虔”准确、庄重，也为现代中文基督教读者所熟悉。
- source_word: τὴν δὲ δύναμιν αὐτῆς
  choice: 却……敬虔的能力
  rationale: “能力”保留 δύναμις 的宽广含义，可包括敬虔实际产生的效力，但不将其限定为神迹、道德改变或圣灵工作的某一单独层面。为避免中文代词“它”指代不清，重述“敬虔”。
- source_word: ἠρνημένοι
  choice: 否认了
  rationale: 完成时中间／被动形态的分词表达一种已经形成并持续存在的拒绝立场；“否认了”比单纯的“否认”更能传达这一结果状态，同时保持中文自然。
- source_word: καὶ τούτους ἀποτρέπου
  choice: 这些人，你也要避开
  rationale: ἀποτρέπου 是现在时中间语态命令式，含转身离开、躲避或远离之意。“避开”自然传达主动与他们保持距离的命令；“这些人”明确 τούτους 所指的是前文描述的那类人。
theological_decisions:
- issue: 外在敬虔与其真实能力之间的对照
  choice: 译作“有敬虔的形式，却否认了敬虔的能力”
  alternative: “有敬虔的外表，却否认敬虔的实效”
  rationale: 正文保留“形式—能力”的原文对照，不把“能力”窄化为神迹、道德更新或任何单一教义机制，也不直接把 μόρφωσις 判定为纯粹伪装，从而保留原文的神学张力。
- issue: 命令所要求的疏离程度
  choice: 译作“避开”
  alternative: “转身离开”或“远离”
  rationale: 原词要求提摩太主动与这类人保持距离，但本节本身没有进一步界定这种疏离在教会纪律或一般社交中的具体实施方式，因此译文不作额外规定。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。句首“他们”承接上文人物清单；分号保留描述与命令之间的转折层次。“这些人，你也要避开”运用话题前置，使命令清楚有力而不显生硬。
