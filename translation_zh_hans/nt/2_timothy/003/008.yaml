id: 2TI.3.8
reference: 2 Timothy 3:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὃν τρόπον δὲ Ἰάννης καὶ Ἰαμβρῆς ἀντέστησαν Μωϋσεῖ, οὕτως καὶ οὗτοι ἀνθίστανται τῇ ἀληθείᾳ, ἄνθρωποι κατεφθαρμένοι τὸν νοῦν, ἀδόκιμοι περὶ τὴν πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/008.yaml
  text: Just as Jannes and Jambres opposed Moses[a], so also these men oppose the truth—men corrupted in mind[b], disqualified regarding the faith.
translation:
  language: zh_hans
  text: 雅尼和佯庇怎样抗拒摩西[a]，这些人也照样抗拒真理。他们的心思已经败坏，在信仰的事上经不起考验[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “抗拒”也可译作“反对”；本节后半的“抗拒真理”使用同一动词。
    reason: lexical_alternative
  - marker: b
    text: “信仰”在这里很可能指基督信仰或使徒所传的信息，而不只是个人的信心。
    reason: cross_reference
lexical_decisions:
- source_word: ὃν τρόπον δὲ
  choice: 怎样
  rationale: 以自然的汉语关联结构“怎样……也照样……”表达比较关系；δὲ在此仅作轻微承接，不另译为“现在”或强转折词。
- source_word: Ἰάννης καὶ Ἰαμβρῆς
  choice: 雅尼和佯庇
  rationale: 采用现代中文圣经中较为通行的人名译法。
- source_word: ἀντέστησαν / ἀνθίστανται
  choice: 抗拒
  rationale: 同一词根前后用同一译词，保留二人抗拒摩西与这些人抗拒真理之间的平行；过去与现在的时态关系由语境和句式体现。
- source_word: Μωϋσεῖ
  choice: 摩西
  rationale: 采用中文通行圣经人名。
- source_word: οὕτως καὶ οὗτοι
  choice: 这些人也照样
  rationale: 清楚保留与前句对应的比较，并把指示代词的男性复数语境落实为“这些人”。
- source_word: τῇ ἀληθείᾳ
  choice: 真理
  rationale: 保持原文表达的宽度，不在正文中限定为福音、使徒教训或一般道德真理。
- source_word: ἄνθρωποι κατεφθαρμένοι τὸν νοῦν
  choice: 他们的心思已经败坏
  rationale: 将关系方面的宾格按自然汉语处理；“已经败坏”体现完成被动分词所表达的既成状态，而不额外说明败坏的施事者。
- source_word: ἀδόκιμοι
  choice: 经不起考验
  rationale: 表达未能通过检验、不能被认可的核心语义，比现代汉语中的“被取消资格”更贴近此处评价性的含义。
- source_word: περὶ τὴν πίστιν
  choice: 在信仰的事上
  rationale: 表达περί加宾格所标明的关涉范围；“信仰”保留其可指基督信仰或信仰内容的可能性。
theological_decisions:
- issue: “真理”和“信仰”的所指
  choice: 正文保留“真理”和“信仰”的宽泛表达，仅在脚注说明“信仰”在本处很可能指基督信仰或使徒所传的信息。
  alternative: 把正文明确译作“福音真理”和“基督教信仰”，或把πίστις理解为个人主观的信心。
  rationale: 上下文指向假教师对使徒教导的敌对，但原文本身没有加入这些限定语；正文不应消除原有的语义张力。
- issue: ἀδόκιμοι的评价含义
  choice: 译为“经不起考验”。
  alternative: 译为“不合格”“被弃绝”或“毫无价值”。
  rationale: 该词表示经过检验却未获认可；所选译法保留检验意象，同时避免把神学判断具体化为某种制度性的资格取消。
- issue: ἄνθρωποι的性别呈现
  choice: 以“这些人……他们”承接具体所指。
  alternative: 另加“男人”或采用泛指的“人们”。
  rationale: 上下文已由“这些人”锁定特定对象；汉语代词不必重复标出性别，也不把该词泛化为全体人类。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“怎样……也照样……”保留原文的类比结构；分成两句以避免汉语句子过度拖长。所有脚注标记均置于正文相应位置。
