source:
  edition: SBLGNT
  text: ἐκ τούτων γάρ εἰσιν οἱ ἐνδύνοντες εἰς τὰς οἰκίας καὶ ⸀αἰχμαλωτίζοντες γυναικάρια σεσωρευμένα ἁμαρτίαις, ἀγόμενα ἐπιθυμίαις ποικίλαις,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/006.yaml
  text: For among these are those who slip into households and capture little women burdened with sins[a], led along by various desires[c][b],
translation:
  language: zh_hans
  text: 因为这等人中，就有那些潜入各家、把被罪压得不堪重负、受各种欲望牵引的软弱妇女[b]掳去[a]的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “掳去”也可译作“俘获”；原文带有把人掳为俘虏的意象。
    reason: lexical_alternative
  - marker: b
    text: “软弱妇女”原文直译为“小妇人”，是带贬义色彩的指小词；这里指容易受这些人操纵的一部分妇女，并非泛指所有妇女。
    reason: lexical_and_contextual_clarification
lexical_decisions:
- source_word: ἐκ τούτων
  choice: 这等人中
  rationale: 表示下文所说的人属于上文描述的那一类；“这等人中”既自然，也保留群体归属关系。
- source_word: ἐνδύνοντες εἰς τὰς οἰκίας
  choice: 潜入各家
  rationale: ἐνδύω在此含暗中钻入、乘隙进入之意；“潜入”保留隐秘和不正当侵入的语气，“各家”指家庭生活的范围。
- source_word: αἰχμαλωτίζοντες
  choice: 掳去
  rationale: 该词具有俘获、掳为俘虏的意象；“掳去”简洁地保留控制和劫掠的力度，但不额外加入奴役含义。
- source_word: γυναικάρια
  choice: 软弱妇女
  rationale: 这是带贬义的指小词，在本语境中指易受这些人操纵的一部分妇女，而非泛指所有妇女。“软弱妇女”传达语境中的脆弱性；脚注保留其字面形式及贬义色彩。
- source_word: σεσωρευμένα ἁμαρτίαις
  choice: 被罪压得透不过气
  rationale: 完成时被动分词描绘罪累积成重担的持续状态；此译以自然汉语传达被堆压、重负难当的形象。
- source_word: ἀγόμενα
  choice: 受……牵引
  rationale: 被动形式表示受外力引导或带动；“牵引”保留其持续受支配的状态，而不把程度强化为完全驱迫。
- source_word: ἐπιθυμίαις ποικίλαις
  choice: 各种欲望
  rationale: ἐπιθυμία在此道德语境中带负面含义，但词义范围较广；“欲望”避免缩窄为某一种特定欲念，ποικίλαις译为“各种”。
theological_decisions:
- issue: γυναικάρια对妇女的贬义称呼
  choice: 译作“软弱妇女”，限定为被假教师乘虚而入、容易受操纵的一部分妇女。
  alternative: 直译为“小妇人”，或译作“愚昧妇女”“容易受骗的妇女”。
  rationale: 原文带贬义，但并未对所有妇女作普遍判断。“软弱”传达本语境中的易受摆布，同时避免把“小”误解为身材或年龄，也不把原文直接解释成智力愚昧。
- issue: οἰκίας所指的范围
  choice: 译作“各家”。
  alternative: 译作“房屋”或“家庭”。
  rationale: 原词形式上指房屋，也可在语境中涉及其中的家庭生活。“各家”在现代汉语中兼顾居所与家庭范围，不必将语义完全收窄为社会学意义的“家庭”。
- issue: 妇女受制于罪与欲望的关系
  choice: 保留两个并列描述：“被罪压得透不过气”与“受各种欲望牵引”。
  alternative: 将后者解释为前者的原因，或把二者合并为一个道德判断。
  rationale: 原文用两个分词结构描述她们的状态，未明确规定二者的逻辑先后；译文保留这种张力，不补入因果关系。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“潜入”“掳去”保留原文对这些人的强烈谴责；“被罪压得透不过气”以通俗而有力度的表达呈现罪不断累积并成为重负的形象。所有脚注标记均置于相关主文之后。
