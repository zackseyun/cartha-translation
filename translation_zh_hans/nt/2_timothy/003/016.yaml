  text: πᾶσα γραφὴ θεόπνευστος καὶ ὠφέλιμος πρὸς διδασκαλίαν, πρὸς ⸀ἐλεγμόν, πρὸς ἐπανόρθωσιν, πρὸς παιδείαν τὴν ἐν δικαιοσύνῃ,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/016.yaml
  text: Every Scripture is God-breathed and profitable for teaching[a], for reproof, for correction[c][b], and for training in righteousness.
translation:
  language: zh_hans
  text: 每一卷圣经[a]都是上帝所默示的，并且对于教导、责备、纠正，以及在义上的训练，都有益处[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“整部圣经。”希腊语πᾶσα γραφή既可逐一理解为“每一卷圣经”，也可整体理解为“整部圣经”。
    reason: alternative_reading
  - marker: b
    text: 本句也可理解为：“每一卷上帝所默示的圣经，也都有益于教导、责备、纠正，以及在义上的训练。”
    reason: alternative_reading
  - marker: c
    text: 这里的“义”也可译作“公义”；本句侧重在正直生活方面对人的塑造。
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα γραφὴ
  choice: 每一处圣经经文
  rationale: πᾶσα与无冠词的γραφή既可作逐一分配理解，也可整体理解。正文采用较贴近希腊语形式的“每一处圣经经文”；上下文（3:15–17）表明γραφή指神圣经文，而非一般文字。整体读法“全部圣经”收入脚注。
- source_word: θεόπνευστος
  choice: 上帝所默示的
  rationale: 该词直指经文出于上帝的气息或吹气。“上帝所默示的”是现代汉语中自然、庄重且易懂的表达；它传达神圣来源，但不在正文中引入后世关于默示方式的特定理论。
- source_word: ὠφέλιμος
  choice: 有益
  rationale: 表达有帮助、有益处，简洁自然，并能顺畅引出后面的四个用途。
- source_word: πρὸς διδασκαλίαν
  choice: 有益于教导
  rationale: διδασκαλία可指教导的行动或内容；“教导”兼顾两者，也避免把含义缩窄为专门的教义体系。
- source_word: ἐλεγμόν
  choice: 责备
  rationale: 该词有揭露错误、指出过失并加以责正之意。“责备”在并列结构中简洁明确；其范围不必限于口头斥责。
- source_word: ἐπανόρθωσιν
  choice: 纠正
  rationale: 该词表示把偏差重新扶正、恢复到正确状态。“纠正”是自然简明的现代汉语对应。
- source_word: παιδείαν τὴν ἐν δικαιοσύνῃ
  choice: 在义中训练人
  rationale: παιδεία涵盖教养、训练和管教；“训练人”突出持续塑造。ἐν δικαιοσύνῃ保留为“在义中”，既贴近原文结构，也表达在正直生活方面受塑造。
- source_word: δικαιοσύνῃ
  choice: 义
  rationale: “义”是δικαιοσύνη在保罗书信中的常用而宽广的对应。此处语境侧重塑造正直的生活；“公义”这一可能译法在脚注中说明。
theological_decisions:
- issue: θεόπνευστος和ὠφέλιμος与πᾶσα γραφή的句法关系
  choice: 把两个形容词都作表语理解：“每一处圣经经文都是上帝所默示的，并且有益……”
  alternative: 把θεόπνευστος作定语，而把ὠφέλιμος作表语：“每一处上帝所默示的圣经经文，也都有益……”
  rationale: 两个形容词平行作表语，最自然地承接下一节，也把神圣来源和功用都陈述为圣经经文的性质。不过，定语式理解在语法上确有可能，因此不在正文中暗自排除，而以脚注保留。
- issue: πᾶσα γραφή的分配式或整体式理解
  choice: 采用分配式表达“每一处圣经经文”
  alternative: 整体式表达“全部圣经”
  rationale: 无冠词的πᾶσα γραφή容许两种理解。正文较直接地保留希腊语形式，脚注同时说明整体读法，避免消除真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。保留“默示”这一通行圣经术语，但用清楚的句法呈现其含义；并列项采用简洁名词性表达。正文及脚注明确保留πᾶσα γραφή和形容词句法关系的真实歧义。
