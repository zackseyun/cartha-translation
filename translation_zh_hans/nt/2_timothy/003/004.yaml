lexical_decisions:
- source_word: προδόται
  choice: 出卖人
  rationale: 该词指背叛、出卖他人的人。“出卖人”在现代汉语中自然，并保留恶行清单中对不忠背叛的谴责。
- source_word: προπετεῖς
  choice: 鲁莽
  rationale: 该词形容行事冒进、欠缺审慎的人；“鲁莽”简洁自然，适合并列的恶行清单。
- source_word: τετυφωμένοι
  choice: 自高自大
  rationale: 这是τυφόομαι的完成时被动分词，字面带有“被吹胀”的意象，语义指因骄傲而自负；正文采用自然、明确的汉语表达，脚注保留原文意象。
- source_word: φιλήδονοι
  choice: 爱享乐
  rationale: 复合词意为爱好享乐；“爱享乐”与后面的“爱上帝”形成简明而清楚的平行。
- source_word: μᾶλλον ἢ
  choice: 胜过
  rationale: 这一比较结构可表示偏爱或对比。“胜过”保留“更爱……而非……”的比较张力，不把它绝对化为完全不爱上帝。
- source_word: φιλόθεοι
  choice: 爱上帝
  rationale: 复合词意为爱上帝；此译法与“爱享乐”保持词形和修辞上的对应。
theological_decisions:
- issue: 如何保留φιλήδονοι μᾶλλον ἢ φιλόθεοι的比较含义和修辞平行
  choice: 爱享乐胜过爱上帝
  alternative: 只爱享乐，不爱上帝
  rationale: 原文μᾶλλον ἢ通常表达“更……而不是／胜过……”的偏好对比。“胜过”既保留比较结构，也避免擅自将其强化为对爱上帝的绝对否定。
- issue: 如何处理τετυφωμένοι的隐喻和道德含义
  choice: 正文译作“自高自大”，脚注说明字面意象
  alternative: 膨胀自大
  rationale: “自高自大”准确传达语义且适合现代庄重汉语；脚注保留“被吹胀”的原文形象，避免正文生硬。
translation_notes:
  register: 采用现代、简洁、庄重的恶行清单体。各项以短语并列；“爱享乐胜过爱上帝”保留希腊文两个复合词的平行及比较结构。经文是句中片段，因此末尾保留逗号。
