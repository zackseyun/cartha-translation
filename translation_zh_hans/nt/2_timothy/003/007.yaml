  text: always learning and never able to come to the knowledge of the truth[a].
translation:
  language: zh_hans
  text: 她们总是在学习，却始终不能达到对真理的认识[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“对真理的充分认识。”希腊语“认识”一词可以含有较充分或较完整的认识的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντοτε
  choice: 总是
  rationale: 表达持续、反复发生的状态，并与后面的“始终不能”形成鲜明对照。
- source_word: μανθάνοντα
  choice: 在学习
  rationale: 现在分词表示持续学习；不限定为正式受教或自行研习。
- source_word: μηδέποτε
  choice: 始终不能
  rationale: 在汉语中自然表达“从来不能”的持续否定，并保留与“总是”的修辞对照。
- source_word: εἰς ἐπίγνωσιν ἀληθείας ἐλθεῖν
  choice: 达到对真理的认识
  rationale: 保留介词 εἰς 与动词 ἐλθεῖν 所含的趋向、抵达意味；“真理”在此自然指所传讲的真理，而非泛指抽象的真实性。
- source_word: δυνάμενα
  choice: 能
  rationale: 表达能力或可能性；其主语承接上文所说的那些妇女，因此译文补出“她们”。
theological_decisions:
- issue: ἐπίγνωσις 是否明确译作“充分认识”
  choice: 认识
  alternative: 充分认识
  rationale: 该词可带有较充分、完整认识的意味，但本节重点是她们虽不断学习，却不能真正抵达对真理的认识。正文不将较强语义绝对化，另以脚注保留这一可能含义。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。“她们”承接3:6的妇女；“总是……却始终不能……”保留原文强烈的持续性对照。
