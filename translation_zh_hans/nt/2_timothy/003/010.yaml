id: 2TI.3.10
reference: 2 Timothy 3:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Σὺ δὲ ⸀παρηκολούθησάς μου τῇ διδασκαλίᾳ, τῇ ἀγωγῇ, τῇ προθέσει, τῇ πίστει, τῇ μακροθυμίᾳ, τῇ ἀγάπῃ, τῇ ὑπομονῇ,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/010.yaml
  text: But you have closely followed my teaching[a], conduct, purpose, faith, patience, love, endurance,
translation:
  language: zh_hans
  text: 但你却紧紧跟从了我的教导、品行、志向、信心[a]、忍耐、爱心和坚忍，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“忠信”。这里的希腊语既可指信心，也可指忠信。
    reason: 保留πίστις在此语境中“信心”与“忠信”之间的真实歧义。
lexical_decisions:
- source_word: Σὺ δὲ
  choice: 但你却
  rationale: δέ承接上文形成对比，显明提摩太不同于前述的人；“你”保留Σὺ的强调作用，“但……却”符合现代汉语表达。
- source_word: παρηκολούθησάς
  choice: 紧紧跟从了
  rationale: παρακολουθέω在此包含密切了解、认同并效法的意思；“紧紧跟从”既保留密切关注，也表达实际遵循。
- source_word: μου
  choice: 我的
  rationale: 属格代词自然地统领后列各项，即保罗的教导、品行、志向等。
- source_word: διδασκαλίᾳ
  choice: 教导
  rationale: 既可指教导的行动，也可指所教导的内容；“教导”自然易懂，并避免“教义”可能带来的过强技术色彩。
- source_word: ἀγωγῇ
  choice: 品行
  rationale: 指一个人的生活方式或行为表现；“品行”简洁庄重，适合此处并列结构。
- source_word: προθέσει
  choice: 志向
  rationale: πρόθεσις在此指既定的目标和人生意向；“志向”比“计划”更能表达持续的人生取向。
- source_word: πίστει
  choice: 信心
  rationale: πίστις可指对神的信靠，也可指忠信可靠；正文采用常见的“信心”，并用脚注保留“忠信”的可能。
- source_word: μακροθυμίᾳ
  choice: 忍耐
  rationale: 主要表达面对他人或刺激时长久忍耐、不轻易发怒；“忍耐”是现代汉语中自然清楚的对应词。
- source_word: ἀγάπῃ
  choice: 爱心
  rationale: “爱心”在德行列表中自然地表达ἀγάπη，同时保持庄重而通俗的语体。
- source_word: ὑπομονῇ
  choice: 坚忍
  rationale: 指在患难和压力下坚定持守；“坚忍”可与前面的μακροθυμία“忍耐”有所区分。
theological_decisions:
- issue: 保罗德行列表中πίστις的含义
  choice: 信心
  alternative: 忠信
  rationale: 上下文既容许理解为对神的信靠，也容许理解为保罗表现出的忠诚可靠。正文不以解释性扩写消除张力，而以脚注保留另一合理含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。并列项目保持简洁匀称；以“忍耐”和“坚忍”分别表达μακροθυμία与ὑπομονή，避免两个不同希腊词在中文中完全合并。
