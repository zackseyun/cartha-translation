  text: καὶ πάντες δὲ οἱ θέλοντες ⸂ζῆν εὐσεβῶς⸃ ἐν Χριστῷ Ἰησοῦ διωχθήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/012.yaml
  text: And indeed[a], all who want to live godly in Messiah Jesus will be persecuted.
translation:
  language: zh_hans
  text: 事实上，凡想要在基督耶稣里过敬虔生活的人，都必受迫害。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ…δὲ
  choice: 其实
  rationale: 这一组合在此承接上文，并带有确认、强调的语气；“其实”自然地表达这一作用，不误作强烈转折。
- source_word: πάντες οἱ θέλοντες
  choice: 凡立志……的人
  rationale: πάντες 与带冠词的分词共同表示范围周全的一类人；θέλω 在这里不只是泛泛愿望，也指向有意选择的生活方向。“凡……的人”保留普遍范围，“立志”以自然汉语表达其意愿。
- source_word: ζῆν εὐσεβῶς
  choice: 敬虔度日
  rationale: εὐσεβῶς 是方式副词，指以敬畏、忠于神的方式生活；“敬虔度日”简洁、庄重，并保留持续生活实践的含义。
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: 在基督耶稣里
  rationale: ἐν 表达生活所处的关系或联合领域；“在……里”保留保罗书信中的空间隐喻和神学张力。Χριστός 采用现代中文圣经通行且易懂的称号“基督”。
- source_word: διωχθήσονται
  choice: 必受迫害
  rationale: 将来时被动态直接表明这些人将遭受敌意追逼；“必受迫害”保留陈述的确定语气和被动意义。
theological_decisions:
- issue: ἐν Χριστῷ Ἰησοῦ 所表达的关系
  choice: 在基督耶稣里
  alternative: 靠着基督耶稣／作为基督耶稣的信徒
  rationale: 原文 ἐν 可表达领域、关系或联合；直译“在……里”避免把这种关系缩减为能力来源或单纯群体身份。
- issue: Χριστός 作为称号的译法
  choice: 基督
  alternative: 弥赛亚
  rationale: 二者都表达“受膏者”这一称号；“基督耶稣”是现代标准中文中自然、庄重且广为理解的固定称呼，也没有把 Χριστός 当作普通姓氏。
- issue: 受迫害陈述的范围与确定性
  choice: 凡……的人，都必受迫害
  alternative: 想要……的人可能会受迫害
  rationale: πάντες 和将来时 διωχθήσονται 共同形成普遍且确定的陈述；不以“可能”缓和原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“敬虔度日”略具经文语体，但含义清楚；句式保留原文的普遍范围、在基督里的关系，以及必受迫害的明确断言。
