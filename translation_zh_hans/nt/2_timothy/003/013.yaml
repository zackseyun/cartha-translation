  text: πονηροὶ δὲ ἄνθρωποι καὶ γόητες προκόψουσιν ἐπὶ τὸ χεῖρον, πλανῶντες καὶ πλανώμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/013.yaml
  text: But evil people and impostors will go on from bad to worse[b][a], deceiving and being deceived.
translation:
  language: zh_hans
  text: 但恶人和骗子[a]会越来越坏[b]，既欺骗别人，自己也受骗。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“招摇撞骗者”或“蛊惑人的人”。希腊语这个词指以欺诈手段蒙骗人的人；在某些语境中也带有巫术或庸医行骗的意味。
    reason: lexical_alternative
  - marker: b
    text: 直译“会向着更坏的地步进展”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πονηροὶ
  choice: 恶
  rationale: 修饰“人”，表达道德上的邪恶败坏，而非一般意义上的不好。
- source_word: δὲ
  choice: 但
  rationale: 承接上文并构成对比；现代汉语用“但”自然传达转折。
- source_word: ἄνθρωποι
  choice: 人
  rationale: 这里泛指人，并不限定男性；“人”准确保留希腊文的普遍所指。
- source_word: γόητες
  choice: 骗子
  rationale: 该词指以欺诈手段迷惑人的江湖术士或冒牌者；本节强调欺骗行为，“骗子”自然清楚，又不把语境过度限定为巫术。
- source_word: προκόψουσιν ἐπὶ τὸ χεῖρον
  choice: 会越来越坏
  rationale: 原文直译为“会向着更坏的地步进展”，带有反讽性的前进意象；“越来越坏”在现代汉语中简洁传达持续恶化。
- source_word: πλανῶντες
  choice: 欺骗别人
  rationale: 主动分词表示这些人持续欺骗或引人走迷；补出“别人”使主动意义在汉语中清楚。
- source_word: πλανώμενοι
  choice: 自己也受骗
  rationale: 保留被动分词的意义，表明行骗者本身也处于受欺骗、被引入迷途的状态。
theological_decisions:
- issue: ἄνθρωποι是否应译为男性专称
  choice: 人
  alternative: 男人
  rationale: 原文阳性复数在此为泛称，所指是人类个体，并无证据限定为男性。
- issue: γόητες是否明确译为带巫术色彩的人
  choice: 骗子
  alternative: 术士／江湖术士／冒牌货
  rationale: 该词虽可带巫术、招摇行骗或庸医式欺诈的色彩，但本节直接强调欺骗；采用较宽泛的“骗子”，避免加入上下文未明确断定的 occult 含义，并以脚注保存词义范围。
- issue: πλανώμενοι的语态
  choice: 自己也受骗
  alternative: 自己也走迷了路
  rationale: 希腊文形式为被动分词，应保留受骗的被动含义，不将其悄然化为单纯自误。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“越来越坏”自然表达持续恶化；末句以“既……也……”保留两个并列分词之间的紧密关系，并明确主动与被动的对照。
