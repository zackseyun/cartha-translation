  text: τοῖς διωγμοῖς, τοῖς παθήμασιν, οἷά μοι ἐγένετο ἐν Ἀντιοχείᾳ, ἐν Ἰκονίῳ, ἐν Λύστροις, οἵους διωγμοὺς ὑπήνεγκα· καὶ ἐκ πάντων με ἐρρύσατο ὁ κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/011.yaml
  text: the persecutions[a], the sufferings, such as happened to me in Antioch, in Iconium, in Lystra—what persecutions I endured[b]; and from them all the Lord rescued me.
translation:
  language: zh_hans
  text: 以及我所受的逼迫和苦难——例如我在安提阿、以哥念和路司得所遭遇的；我忍受了何等的逼迫[a]！主[b]把我从这一切中都救了出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我忍受了怎样的逼迫！”
    reason: lexical_alternative
  - marker: b
    text: “主”很可能指主耶稣，不过希腊原文只写“主”。
    reason: alternative_reading
lexical_decisions:
- source_word: διωγμοῖς / διωγμούς
  choice: 逼迫
  rationale: 该词指因信仰归属或使命而遭受的敌意追赶与压迫。“逼迫”是现代中文圣经语境中自然、准确且不局限于某一种迫害形式的对应词。
- source_word: παθήμασιν
  choice: 苦难
  rationale: 该词广泛指受苦的经历；“苦难”保留其宽泛含义，不把它缩窄为外在攻击或一般困难。
- source_word: οἷά μοι ἐγένετο
  choice: 就是我……所遭遇的那些事
  rationale: οἷα 引出前述逼迫和苦难的具体实例；此译法在现代中文中自然，并保留其举例和回指作用。
- source_word: ἐν Ἀντιοχείᾳ, ἐν Ἰκονίῳ, ἐν Λύστροις
  choice: 在安提阿、以哥念和路司得
  rationale: 采用通行的中文圣经地名音译。中文列举时用顿号及“和”，避免机械重复介词，同时保留三处地点的清晰次序。
- source_word: οἵους διωγμοὺς
  choice: 何等的逼迫
  rationale: “何等”传达 οἵους 的感叹和性质、程度色彩，而不另行解释逼迫的具体方式。
- source_word: ὑπήνεγκα
  choice: 我忍受了
  rationale: 该动词表示在压力之下承受、忍耐；“忍受”简洁自然，也保留主体主动承受的意味。
- source_word: ἐκ πάντων
  choice: 从这一切中
  rationale: “这一切”回指刚列举的逼迫和苦难，“从……中”保留脱离危险处境的空间意象。
- source_word: ἐρρύσατο
  choice: 救了出来
  rationale: 该动词表示从危险中解救。“救了出来”在现代中文中具体鲜明，也避免在此处仅用“拯救”而引入不必要的专门救恩含义。
- source_word: ὁ κύριος
  choice: 主
  rationale: 按原文只译称号“主”，不在正文中补入未明说的名字，从而保留所指对象在形式上的含蓄。
theological_decisions:
- issue: “主”（ὁ κύριος）所指的对象
  choice: 正文只译作“主”
  alternative: 主耶稣
  rationale: 保罗在此语境中很可能是指主耶稣，但希腊文只写“主”。正文不补出“耶稣”，以保留原文措辞及其含蓄性，并用脚注说明可能的所指。
- issue: 获救与受逼迫并存的张力
  choice: 译为“我忍受了……然而，主把我从这一切中都救了出来”
  alternative: 把“救出”解释为使保罗完全免受苦难
  rationale: 原文同时陈述保罗确实忍受逼迫，以及主从这一切中救他出来。译文保留两者，不把“救出”解释成从未经历苦难。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“以及”承接上一节的句法关系；破折号引出三个地点所代表的具体经历。保留“何等”的感叹力度，并以“然而”呈现受苦与蒙救之间的转折。所有脚注标记均已置于正文对应位置。
