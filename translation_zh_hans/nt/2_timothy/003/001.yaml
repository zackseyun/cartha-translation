  text: 'But know this: in the last days difficult times will come[a].'
translation:
  language: zh_hans
  text: 但你要知道：在末后的日子，艰难的时期将会来到[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“危险的时期”或“严酷的时期”。希腊语形容词可指难以应付、危险或令人痛苦。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο
  choice: 这
  rationale: 中性指示代词前指下文由ὅτι引出的内容；汉语用“这”自然明确。
- source_word: δὲ
  choice: 但
  rationale: 表示与前文之间温和的转折或推进；“但”保留这一转折而不过分强化。
- source_word: γίνωσκε
  choice: 你要知道
  rationale: 现在时主动命令语气、第二人称单数；补出“你要”既体现对提摩太的直接劝告，也符合现代汉语表达。
- source_word: ὅτι
  choice: ：
  rationale: 引出所要知道的具体内容；汉语冒号比直译为“就是”或“即”更自然。
- source_word: ἐν ἐσχάταις ἡμέραις
  choice: 末后的日子
  rationale: 保留新约中具有末世意味的固定表达，同时不限定它仅指基督再来前极短的一段时期。
- source_word: ἐνστήσονται
  choice: 必有……来到
  rationale: 该词在此表示临到、出现或成为现实；“来到”与“时期”搭配，可保留未来时和临到之意。“必”表达直陈语气中的确定性。
- source_word: καιροὶ
  choice: 时期
  rationale: καιρός指具有特征的时段或时机，并非单纯按顺序计算的时间；“时期”在本句中比“时候”更清楚。
- source_word: χαλεποί
  choice: 艰难的
  rationale: 该形容词语义可涵盖难以应付、危险、严酷或令人痛苦；“艰难”能以现代、庄重的汉语表达其广义，其他可能性列入脚注。
theological_decisions:
- issue: “末后的日子”的时间范围
  choice: 保留“末后的日子”这一末世性表达，不把它限定为仅仅基督再来前的一小段时间。
  alternative: 译作或解释为“终局以前最后的一段时期”，或理解为已经展开、范围较广的末世时期。
  rationale: 原文具有神学分量，但本节本身没有明确界定其时间范围；直译核心表达可保留不同新约末世论理解之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你要知道”保留单数命令语气；“艰难的时期来到”略带书面庄重感，并贴近原文语序。
