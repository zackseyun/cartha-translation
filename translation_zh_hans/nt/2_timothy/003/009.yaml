source:
  edition: SBLGNT
  text: ἀλλ’ οὐ προκόψουσιν ἐπὶ πλεῖον, ἡ γὰρ ἄνοια αὐτῶν ἔκδηλος ἔσται πᾶσιν, ὡς καὶ ἡ ἐκείνων ἐγένετο.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/009.yaml
  text: But they will not advance any further[a], for their foolishness will be plain to everyone[b], as that of those men also became.
translation:
  language: zh_hans
  text: 然而，他们不会再有进展[a]，因为他们的愚昧必在众人面前显露出来，正如那两个人的愚昧也曾显露出来一样[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不会再进一步。”
    reason: lexical_alternative
  - marker: b
    text: “那两个人”指上一节提到的雅尼和佯庇。
    reason: cross_reference
lexical_decisions:
- source_word: προκόψουσιν
  choice: 有进展
  rationale: προκόπτω表示前进、进展；此处用于假教师，并不表示正面的成长。“有进展”在现代汉语中自然，也保留了原文的进展意象。
- source_word: ἐπὶ πλεῖον
  choice: 再
  rationale: 该短语意为“更进一步、达到更大程度”；与否定词连用时译作“不会再有进展”，自然表达其进展将受到限制。
- source_word: ἄνοια
  choice: 愚昧
  rationale: ἄνοια指缺乏理解、愚妄；“愚昧”兼具认知和道德意味，语体庄重而易懂。
- source_word: ἔκδηλος
  choice: 在众人面前显露出来
  rationale: ἔκδηλος意为明显、显而易见；结合与格πᾶσιν，译文明确表达其愚昧将被众人看出。
- source_word: πᾶσιν
  choice: 众人
  rationale: 表示“所有人”；“在众人面前”符合现代汉语表达，并保留原文的普遍范围。
- source_word: ὡς καὶ ἡ ἐκείνων ἐγένετο
  choice: 正如那两个人的愚昧也曾显露出来一样
  rationale: ἡ省略而回指ἄνοια，ἐκείνων回指上一节的雅尼和佯庇。“那两个人”保持篇章照应；补出“愚昧”和“显露出来”，使汉语完整清楚。
theological_decisions:
- issue: ἐκείνων所指的人
  choice: 按紧接的上文理解为雅尼和佯庇，并在正文中译作“那两个人”
  alternative: 泛指以往反对真理的假教师
  rationale: 3:8刚提到雅尼和佯庇，ἐκείνων最自然地回指二人；正文不重复姓名，以维持原文的指代方式，脚注说明所指。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“然而”承接前文转折；两个“显露出来”虽有重复，却清楚呈现原文省略结构中的比较关系。所有脚注标记均已置于正文相应位置。
