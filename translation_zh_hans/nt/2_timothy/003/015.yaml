  text: καὶ ὅτι ἀπὸ βρέφους ⸀ἱερὰ γράμματα οἶδας, τὰ δυνάμενά σε σοφίσαι εἰς σωτηρίαν διὰ πίστεως τῆς ἐν Χριστῷ Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/015.yaml
  text: and that from infancy you have known the sacred writings[b][a], which are able to make you wise for salvation through faith in Messiah Jesus.
translation:
  language: zh_hans
  text: 并且，你从婴孩时起就知道神圣的书卷[a]；这些书卷能使你借着对弥赛亚耶稣的信心[b]，有得救的智慧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“圣经”。希腊语直译为“神圣的文字（或书卷）”。
    reason: lexical_alternative
  - marker: b
    text: 或译“借着弥赛亚耶稣的信实”；但在这里，“借着对弥赛亚耶稣的信心”是更自然的理解。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπὸ βρέφους
  choice: 从还是婴孩时起
  rationale: βρέφος指年纪很小的孩子，甚至婴儿。此译法比笼统的“自幼”更充分保留原文所强调的幼小年龄，同时符合现代汉语表达。
- source_word: ἱερὰ γράμματα
  choice: 神圣的书卷
  rationale: 该短语直指“神圣的文字／书卷”。“神圣的书卷”既贴近原文，也清楚指向提摩太自幼所受教的经书，并避免在正文中把该短语完全技术化。
- source_word: οἶδας
  choice: 就知道
  rationale: οἶδα虽为完成时形态，却具有现在时意义；结合“从还是婴孩时起”，“就知道”自然表达自幼已有并持续拥有的认识。
- source_word: τὰ δυνάμενά σε σοφίσαι
  choice: 这些书卷能使你……有……智慧
  rationale: 保留书卷为施事主体，并以自然汉语表达σοφίζω“使人有智慧、使人明智”的含义。
- source_word: εἰς σωτηρίαν
  choice: 有得救的智慧
  rationale: εἰς在这里表达目标或结果。“得救的智慧”简洁保留智慧指向救恩的目的性，而不把它改写成书卷本身自动施行拯救。
- source_word: διὰ πίστεως
  choice: 借着……信心
  rationale: διά加属格表达途径或媒介；“借着……信心”在现代汉语中自然地保留这一关系。
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: 对弥赛亚耶稣
  rationale: 在“信心”之后，汉语用“对……的信心”自然表达信心以弥赛亚耶稣为对象；Χριστός作为称号译为“弥赛亚”。
theological_decisions:
- issue: Χριστῷ在此应作为称号还是名称化成分
  choice: 弥赛亚耶稣
  alternative: 基督耶稣
  rationale: Χριστός在此仍承载受膏者／弥赛亚的称号意义，因此译出称号，而不只采用传统音义已较固定的“基督”。
- issue: διὰ πίστεως τῆς ἐν Χριστῷ Ἰησοῦ中πίστεως的含义
  choice: 借着对弥赛亚耶稣的信心
  alternative: 借着弥赛亚耶稣的信实
  rationale: 定冠词短语τῆς ἐν Χριστῷ Ἰησοῦ最自然地限定信心所在或所指的对象，因此正文采用人的信心以耶稣为对象的理解；同时用脚注保留较不可能但具有神学意义的“弥赛亚耶稣的信实”读法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“从还是婴孩时起”保留ἀπὸ βρέφους较强的年龄意味；分号帮助读者辨明关系从句所指的是前面的书卷。脚注标记分别紧随其所解释的词组。
