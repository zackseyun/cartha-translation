id: 2TI.3.2
reference: 2 Timothy 3:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἔσονται γὰρ οἱ ἄνθρωποι φίλαυτοι, φιλάργυροι, ἀλαζόνες, ὑπερήφανοι, βλάσφημοι, γονεῦσιν ἀπειθεῖς, ἀχάριστοι, ἀνόσιοι,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/002.yaml
  text: For people will be lovers of self[a], lovers of money, boastful, arrogant, slanderous, disobedient to parents, ungrateful, unholy,
translation:
  language: zh_hans
  text: 因为人会专爱自己，贪爱钱财，夸口，狂傲，毁谤[a]，违背父母，忘恩负义，不圣洁，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“亵渎”或“辱骂”。这个希腊词可以指用言语侮辱人，也可以指侮慢上帝。
    reason: 保留βλάσφημοι在针对人和针对上帝的言语之间所具有的词义范围。
lexical_decisions:
- source_word: ἔσονται
  choice: 会
  rationale: 表达将来时的系词意义；与后续一连串品性描述自然衔接。
- source_word: γὰρ
  choice: 因为
  rationale: 承接上文，表明本节是在解释前述情形。
- source_word: οἱ ἄνθρωποι
  choice: 人
  rationale: 原文为泛指人类，并非专指男性；现代汉语用“人”简洁准确。
- source_word: φίλαυτοι
  choice: 专爱自己
  rationale: 表达以自我为中心的爱，保留该复合词中“爱”的含义，并与下项形成节奏上的对应。
- source_word: φιλάργυροι
  choice: 贪爱钱财
  rationale: 保留“爱钱财”的词义，同时用“贪”清楚传达其负面道德色彩。
- source_word: ἀλαζόνες
  choice: 夸口
  rationale: 指自我吹嘘、炫耀；“夸口”简洁庄重，适合恶行清单的节奏。
- source_word: ὑπερήφανοι
  choice: 狂傲
  rationale: 表达凌驾于人、目中无人的负面骄傲，比可能带正面含义的“自豪”准确。
- source_word: βλάσφημοι
  choice: 毁谤
  rationale: 该词可指以言语毁损人或侮慢上帝；正文采用不明说对象的“毁谤”，并以脚注保留“亵渎”和“辱骂”等可能含义。
- source_word: γονεῦσιν ἀπειθεῖς
  choice: 违背父母
  rationale: 准确表达拒绝听从父母；用语自然且符合清单体裁。
- source_word: ἀχάριστοι
  choice: 忘恩负义
  rationale: 清楚表达不知感恩、没有感激之心的品性，符合现代汉语习惯。
- source_word: ἀνόσιοι
  choice: 不圣洁
  rationale: 保留该词缺乏圣洁、敬虔的宗教与道德含义，不将其缩减为一般的不道德。
theological_decisions:
- issue: οἱ ἄνθρωποι的泛指范围
  choice: 人
  alternative: 男人；人类
  rationale: 语法形式虽为阳性复数，语境却泛指人，并不限定为男性。
- issue: βλάσφημοι所毁谤的对象
  choice: 正文译“毁谤”，不限定对象
  alternative: 亵渎；辱骂
  rationale: 希腊词既可指诋毁人，也可指侮慢上帝。正文保留对象上的开放性，脚注说明其语义范围，避免把经文本身未明说的对象固定下来。
- issue: ἀνόσιοι的宗教道德色彩
  choice: 不圣洁
  alternative: 不敬虔；亵慢
  rationale: “不圣洁”较直接地保留原词相对于神圣、敬虔之事的负面意义，而不把它局限为某一种具体行为。
translation_notes:
  register: 采用现代、庄重而易懂的清单式表达，以逗号维持原文连续列举的节奏。本节句末保留逗号，因为原文的恶行清单在下一节继续。脚注标记置于与其实际对应的“毁谤”之后。
