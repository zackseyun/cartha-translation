  text: ἵνα ἄρτιος ᾖ ὁ τοῦ θεοῦ ἄνθρωπος, πρὸς πᾶν ἔργον ἀγαθὸν ἐξηρτισμένος.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/017.yaml
  text: so that the man of God may be complete[b][a], equipped for every good work.
translation:
  language: zh_hans
  text: 为要使属神的人[b]完备，为各样善工装备齐全[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“装备妥当”。ἐξηρτισμένος表示已经得到充分预备或配备。
    reason: lexical_alternative
  - marker: b
    text: “属神的人”在希腊原文中是阳性单数，可能是一个公认的圣经称谓；在本段语境中可特指服事神的人，也可更广泛地应用于受圣经塑造的信徒。
    reason: cultural_note
lexical_decisions:
- source_word: ἵνα
  choice: 为要使
  rationale: 引出承接上一节的目的从句，保留目的含义，同时符合现代汉语表达。
- source_word: ἄρτιος
  choice: 完备
  rationale: 表示完整、合用、足以胜任；“完备”避免让人误解为道德上毫无瑕疵，也与后面的装备意象相配。
- source_word: ᾖ
  choice: 使……（成为）
  rationale: 在“为要使”结构中自然体现ἵνα后虚拟语气所表达的目的。
- source_word: ὁ τοῦ θεοῦ ἄνθρωπος
  choice: 属神的人
  rationale: 保留这一公认的圣经称谓及其与神的归属关系。希腊语形式为阳性单数，但汉语“人”无需标示语法性别，既可指具体服事神的人，也不排除更广的应用。
- source_word: πρὸς
  choice: 为
  rationale: 表达面向某一用途或目的，即为各样善工而得到装备。
- source_word: πᾶν ἔργον ἀγαθόν
  choice: 各样善工
  rationale: “各样”自然传达πᾶν在单数名词前的广泛、分配意味；“善工”简洁保留行为与工作的含义。
- source_word: ἐξηρτισμένος
  choice: 装备妥当
  rationale: 这一完成时被动分词表示已经得到所需的预备和配备；“装备妥当”兼顾完成状态与自然汉语。
theological_decisions:
- issue: ὁ τοῦ θεοῦ ἄνθρωπος的所指及性别形式
  choice: 属神的人
  alternative: 神的仆人／神人
  rationale: 原文是阳性单数，并可能沿用圣经中对神之仆人的固定称谓；然而汉语“属神的人”能保留单数称谓和归属意义，而不把原文并未明确限定的职分写进正文。脚注说明其在语境中可能首先指神的工人，同时可有更广应用。
- issue: ἄρτιος与ἐξηρτισμένος的语义关系
  choice: 完备……装备妥当
  alternative: 能胜任……装备齐全
  rationale: 两词形成相关但不完全重复的表达：前者强调人完整合用，后者强调为善工已得到充分预备。译文保留这种递进，不将其解释为无罪的完全。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“善工”保留经文凝练的圣经语体；整体语序紧贴原文的目的从句和末尾完成时被动分词结构，又避免生硬直译。
