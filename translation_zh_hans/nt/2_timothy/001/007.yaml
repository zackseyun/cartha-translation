  text: οὐ γὰρ ἔδωκεν ἡμῖν ὁ θεὸς πνεῦμα δειλίας, ἀλλὰ δυνάμεως καὶ ἀγάπης καὶ σωφρονισμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/007.yaml
  text: For God did not give us a spirit of cowardice[b][a], but of power and love and self-control.
translation:
  language: zh_hans
  text: 因为神赐给我们的灵，不是怯懦[a]的灵，而是能力、爱和自制[b]的灵。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “怯懦”也可译作“胆怯”或“畏缩”。原词所指不只是一般的害怕，更有因惧怕而退缩、缺乏勇气的意味。
    reason: lexical_alternative
  - marker: b
    text: “自制”也可译作“健全的判断”或“自律”；原词兼有心思清醒和自我约束的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ γὰρ
  choice: 因为……不是
  rationale: γάρ承接上一节的劝勉并说明理由，用“因为”自然保留其解释关系；οὐ否定所赐之灵的性质。
- source_word: ἔδωκεν ἡμῖν ὁ θεὸς
  choice: 神赐给我们的
  rationale: 以现代汉语自然语序表达不定过去时的赐予行动和间接受词ἡμῖν；“赐给”也符合神为施予者的庄重语境。
- source_word: πνεῦμα
  choice: 灵
  rationale: 原词可指灵，也可着重于一种内在心志或精神状态。译作“灵”既不擅自明确为“圣灵”，也不把它缩减为纯粹心理倾向，从而保留原文的开放性。
- source_word: δειλίας
  choice: 怯懦
  rationale: 该词不只是一般的害怕，而带有因惧怕而退缩、缺乏勇气的负面意味；“怯懦”比单纯的“惧怕”更准确。
- source_word: ἀλλὰ δυνάμεως καὶ ἀγάπης καὶ σωφρονισμοῦ
  choice: 而是能力、爱和自制的灵
  rationale: ἀλλά形成鲜明对比；三个属格共同说明“灵”的性质。汉语在句末补出“的灵”，使并列关系清楚，同时不改变原意。
- source_word: δυνάμεως
  choice: 能力
  rationale: δύναμις在此表示力量或有效行动的能力；“能力”直接、自然，并能与“爱”和“自制”构成并列。
- source_word: ἀγάπης
  choice: 爱
  rationale: 这是ἀγάπη在现代汉语中最清楚、最通行的对应词。
- source_word: σωφρονισμοῦ
  choice: 自制
  rationale: 该罕见名词涵盖清醒健全的判断、自我约束和纪律；正文采用简洁自然的“自制”，并在脚注保留其他可能译法。
theological_decisions:
- issue: πνεῦμα所指为何
  choice: 保留为“灵”，不明确加上“圣”或改成单纯的“心志”
  alternative: “圣灵”或“心志／精神”
  rationale: πνεῦμα没有冠词，并由表示性质的属格短语修饰；句法可以侧重神所赐的灵或心志的性质，却不足以排他性地确定为“圣灵”这一称号。译作“灵”可保存这种神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“怯懦的灵／能力、爱和自制的灵”保留原文对称结构；末尾补出第二个“的灵”，使汉语表达清晰。所有脚注标记均置于其所说明的词语之后。
