id: 2TI.1.3
reference: 2 Timothy 1:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Χάριν ἔχω τῷ θεῷ, ᾧ λατρεύω ἀπὸ προγόνων ἐν καθαρᾷ συνειδήσει, ὡς ἀδιάλειπτον ἔχω τὴν περὶ σοῦ μνείαν ἐν ταῖς δεήσεσίν μου, νυκτὸς καὶ ἡμέρας
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/003.yaml
  text: I thank God[a], whom I serve as my ancestors did with a clean conscience[c][b], as I constantly remember you in my prayers night and day.
translation:
  language: zh_hans
  text: 我感谢上帝——我像祖先一样，以清洁的良心事奉他[a][b]；我在昼夜的祈求中不断记念你[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “事奉”也可译作“敬拜”；原文动词可指向上帝献上的宗教性服事或敬拜。
    reason: lexical_alternative
  - marker: b
    text: “像祖先一样”原文较直译为“从祖先而来”。这短语可表达与祖先的事奉相延续的关系；也可译作“承袭祖先所传的传统”。
    reason: lexical_alternative
  - marker: c
    text: 原文较直译为“在我的祈求中，不断有关于你的记念”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Χάριν ἔχω τῷ θεῷ
  choice: 我感谢上帝
  rationale: Χάριν ἔχω与与格连用，是“向某人感恩、感谢某人”的惯用表达；译为“我感谢上帝”自然、直接。
- source_word: ᾧ λατρεύω
  choice: 我……事奉他
  rationale: λατρεύω指向上帝献上的宗教性服事，也可含敬拜之意。“事奉”既保留敬虔服事的范围，又不把含义限缩为礼仪性的敬拜。
- source_word: ἀπὸ προγόνων
  choice: 像祖先一样
  rationale: 该短语字面为“从祖先”，在此表达保罗与祖先信仰和事奉的延续关系。“像祖先一样”是通顺的现代汉语，同时以脚注保留较直译的可能。
- source_word: ἐν καθαρᾷ συνειδήσει
  choice: 以清洁的良心
  rationale: 介词短语说明事奉的方式或状态。“清洁的良心”保留道德纯净的意象，也符合现代汉语宗教语境。
- source_word: ὡς
  choice: 以分号连接感恩与持续想念的情形
  rationale: ὡς在这里引出伴随感恩的情形，可能有“正如、当……时”或近似因由的语感。汉语用分号衔接，避免过早将其明确处理为因果关系。
- source_word: ἀδιάλειπτον ἔχω τὴν περὶ σοῦ μνείαν
  choice: 总是不住地想念你
  rationale: 该表达字面是“不断有关于你的记念”。“不住地想念你”自然表达持续记念；“总是”对应其持续性并使汉语流畅。
- source_word: ἐν ταῖς δεήσεσίν μου
  choice: 我……祈求时
  rationale: δέησις侧重向上帝的祈求。“祈求”比笼统的“祷告”更贴近词义，同时在句中保持自然。
- source_word: νυκτὸς καὶ ἡμέρας
  choice: 昼夜
  rationale: 这是表示持续、反复进行的惯用语；“昼夜”简洁庄重，并保留原文次序。
theological_decisions:
- issue: ἀπὸ προγόνων所表达的保罗与祖先信仰之间的关系
  choice: 译为“像祖先一样”，表达事奉上帝的延续性
  alternative: “从祖先以来”或“承袭祖先”
  rationale: 上下文并非表明保罗弃绝以色列祖传的信仰，而是将自己的事奉置于与祖先相连续的脉络中；译文只表达这种连续性，不额外加入关于传统权威或具体祖先身份的教义判断。
- issue: λατρεύω的范围
  choice: 事奉
  alternative: 敬拜
  rationale: 该动词可指献给上帝的敬拜性服事。“事奉”保留较宽的语义范围；脚注提示“敬拜”这一真实可能，避免将词义定得过窄。
- issue: ὡς所连接的逻辑关系
  choice: 不明确译成“因为”，以标点和并列结构保留联系
  alternative: “因为我……想念你”或“当我……想念你时”
  rationale: ὡς在本句中的具体关系并不完全确定。若直接译为“因为”，会把感恩与记念固定为明确因果；较松的连接更能保留原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“上帝”“事奉”“清洁的良心”“昼夜”等用语保持经文语体，但避免生硬古奥。破折号标明关系从句式的插入说明，分号则保留ὡς所表达但未完全明确的逻辑联系。
