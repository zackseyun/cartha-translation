id: 2TI.1.15
reference: 2 Timothy 1:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Οἶδας τοῦτο ὅτι ἀπεστράφησάν με πάντες οἱ ἐν τῇ Ἀσίᾳ, ὧν ἐστιν Φύγελος καὶ Ἑρμογένης.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/015.yaml
  text: 'You know this: all those in Asia turned away from me[b][a], among whom are Phygelus and Hermogenes.'
translation:
  language: zh_hans
  text: 你知道这事：在亚细亚[a]的那些人全都离弃了我[b]，其中有腓吉路和黑摩其尼。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“亚细亚”指小亚细亚西部的罗马行省，不是现代所说的亚洲大陆。
    reason: cultural_note
  - marker: b
    text: 或译“背弃了我”或“抛弃了我”。希腊原文更直译为“转身离开了我”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἶδας τοῦτο ὅτι
  choice: 你知道这事：
  rationale: οἶδας表示现有的认知状态，译作“你知道”直接自然；τοῦτο指向随后由ὅτι引出的内容，以冒号衔接，符合现代汉语表达。
- source_word: ἀπεστράφησάν με
  choice: 离弃了我
  rationale: 该短语字面上带有“转身离开我”的意象，在本语境中表示关系和支持上的转离。“离弃了我”自然、凝练，又保留背离之意；较字面的表达列入脚注。
- source_word: πάντες οἱ ἐν τῇ Ἀσίᾳ
  choice: 在亚细亚的那些人全都
  rationale: 既保留πάντες的全面语气，也借“那些人”体现这是语境所指的一群人，而不擅自解释为该省每一个居民。
- source_word: Ἀσίᾳ
  choice: 亚细亚
  rationale: 采用中文圣经传统中对罗马行省Ἀσία的专名译法，并以脚注说明它并非现代所称的亚洲大陆。
- source_word: ὧν ἐστιν
  choice: 其中有
  rationale: 自然表达分属关系，说明随后两人属于前述群体。
- source_word: Φύγελος
  choice: 腓吉路
  rationale: 采用通行的中文圣经人名音译。
- source_word: Ἑρμογένης
  choice: 黑摩其尼
  rationale: 采用通行的中文圣经人名音译。
theological_decisions:
- issue: “在亚细亚的那些人全都”的范围
  choice: 保留“全都”的广泛语气，同时用“那些人”让其范围由上下文界定。
  alternative: 理解为亚细亚省的每一位基督徒，或明确译成保罗所有的同工和支持者。
  rationale: πάντες具有全面语气，但其实际范围可由上下文限定。正文既不把它绝对化为该地区每一个人，也不加入原文未明说的身份限定，从而保留原文的张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“你知道这事”简洁直接；“其中有”自然引出所列举的人名。脚注标记紧随各自所解释的词语。
