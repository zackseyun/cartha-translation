id: 2TI.1.12
reference: 2 Timothy 1:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: δι’ ἣν αἰτίαν καὶ ταῦτα πάσχω, ἀλλ’ οὐκ ἐπαισχύνομαι, οἶδα γὰρ ᾧ πεπίστευκα, καὶ πέπεισμαι ὅτι δυνατός ἐστιν τὴν παραθήκην μου φυλάξαι εἰς ἐκείνην τὴν ἡμέραν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/012.yaml
  text: For this reason I also suffer these things[a], but I am not ashamed, for I know whom I have believed[c][b], and I am convinced that he is able to guard my deposit until that day.
translation:
  language: zh_hans
  text: 为这个缘故，我也受这些苦，但我并不以此为耻；因为我知道我所信靠的是谁，也深信他能保守我的托付[a]，直到那日[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我的托付”原文指交付保管之物；可指保罗交托给神的事物，也可指交托给保罗保管的事物，如福音或使命。
    reason: alternative_reading
  - marker: b
    text: “那日”通常指未来神最终审判并施行伸冤的日子。
    reason: cross_reference
lexical_decisions:
- source_word: δι’ ἣν αἰτίαν
  choice: 为这个缘故
  rationale: 保留与上文的因果联系，同时符合现代汉语庄重而自然的表达。
- source_word: ταῦτα πάσχω
  choice: 我也受这些苦
  rationale: πάσχω表示遭受苦难；将ταῦτα自然译为“这些苦”，既保留指示性，也不擅自具体化苦难内容。
- source_word: οὐκ ἐπαισχύνομαι
  choice: 我并不以此为耻
  rationale: 表达说话者面对这些苦难时并不羞耻的态度；补出“以此”使汉语自然，其所指由上下文确定。
- source_word: οἶδα γὰρ ᾧ πεπίστευκα
  choice: 因为我知道我所信靠的是谁
  rationale: “信靠”能自然表达πιστεύω与人称间接宾语所含的信任关系；完成时所表达的持久、确定状态由整句语义体现。
- source_word: πέπεισμαι
  choice: 也深信
  rationale: 表达完成时被动形式所具有的坚定确信和持续状态；“深信”比“被说服”更符合现代汉语。
- source_word: δυνατός ἐστιν
  choice: 他能
  rationale: 简洁准确地表达能力，不额外说明未在本分句中点明的身份。
- source_word: τὴν παραθήκην μου
  choice: 我所托付的
  rationale: παραθήκη指交付保管之物。此译法在自然汉语中保留“托付物”的意象，但倾向于理解为保罗交托给神之物；另一种可能在脚注中说明。
- source_word: φυλάξαι
  choice: 保守
  rationale: 与交付保管的语境相配，可表达看守、保存、护卫之意，也是现代基督教汉语中清楚而庄重的用词。
- source_word: εἰς ἐκείνην τὴν ἡμέραν
  choice: 直到那日
  rationale: 自然表达指向未来特定之日的时间含义，同时不在正文中扩充解释。
theological_decisions:
- issue: ᾧ的所指及“他能”的隐含主语
  choice: 正文只用“谁”和“他”，不明确增译为神或基督
  alternative: 明确译作“神”或“基督耶稣”
  rationale: 希腊文本在此分句没有重述其身份；上下文虽能引导读者理解，译文仍保留原文的具体程度。
- issue: παραθήκην μου所指的托付方向与内容
  choice: 正文译为“我所托付的”，并以脚注保留另一种解释
  alternative: 译为“所托付给我的”，指交给保罗保管的福音或使命
  rationale: 属格μου及παραθήκη在此可被理解为保罗交托给神之物，也可指交给保罗保管之物。汉语正文难以在完全自然的情况下保持同等句法歧义，因此采用较通顺的传统理解，并明确脚注另一可能。
- issue: “那日”的含义
  choice: 正文保留“那日”，脚注说明其末世性指向
  alternative: 正文直接译为“审判之日”或“主再来的日子”
  rationale: 原文只说“那日”，不宜在正文中将其具体化超过原文；脚注可帮助普通读者理解其语境指向。
translation_notes:
  register: 采用现代、庄重、易懂的标准普通话。“受这些苦”“并不以此为耻”“深信”等表达自然流畅；不在正文中明确补出神或基督，以保持原文在本分句中的含蓄。所有脚注标记均已置于正文对应位置。
