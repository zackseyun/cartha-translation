  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: φανερωθεῖσαν δὲ νῦν διὰ τῆς ἐπιφανείας τοῦ σωτῆρος ἡμῶν ⸂Ἰησοῦ Χριστοῦ⸃, καταργήσαντος μὲν τὸν θάνατον φωτίσαντος δὲ ζωὴν καὶ ἀφθαρσίαν διὰ τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/010.yaml
  text: but has now been revealed through the appearing of our Savior Jesus the Messiah[a], who indeed abolished death and brought life and incorruptibility to light through the gospel[b],
translation:
  language: zh_hans
  text: 如今却借着我们的救主耶稣，就是弥赛亚[a]的显现而显明了；他废除了死亡，又借着福音使生命和不朽显露出来[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“耶稣基督”。希腊语Χριστός既可用作称号“弥赛亚”，也可用作近似名字的称呼“基督”。
    reason: alternative_reading
  - marker: b
    text: “不朽”或译“不死”。希腊语原词着重指不会朽坏、免受败坏。
    reason: lexical_alternative
lexical_decisions:
- source_word: φανερωθεῖσαν
  choice: 显明出来
  rationale: 保留被动含义，并自然承接上一节所说的恩典；中文无需重复补出“这恩典”。
- source_word: ἐπιφανείας
  choice: 显现
  rationale: 表达耶稣公开、可见的来临，较音译或较生硬的“彰显”更自然。
- source_word: σωτῆρος
  choice: 救主
  rationale: 这是基督论语境中准确而通行的称号。
- source_word: Ἰησοῦ Χριστοῦ
  choice: 耶稣弥赛亚
  rationale: 此处紧接“我们的救主”，Χριστός的称号意味仍然鲜明；脚注保留通行译法“耶稣基督”。
- source_word: καταργήσαντος
  choice: 废除了
  rationale: 表达对死亡决定性的废止和击败，同时不额外解释这种胜利在现今时代实现到何种程度。
- source_word: φωτίσαντος
  choice: 使……显露出来
  rationale: 自然表达使原先隐而未明之事进入光中、得以显明的含义。
- source_word: ζωὴν
  choice: 生命
  rationale: 采用直接、通行的对应词，不扩展其救恩论和末世论内涵。
- source_word: ἀφθαρσίαν
  choice: 不朽
  rationale: 着重表达不受败坏、不会朽坏；脚注列出“不死”这一可能译法，以保留词义范围。
- source_word: διὰ τοῦ εὐαγγελίου
  choice: 借着福音
  rationale: 保留διά加属格所表达的媒介或途径含义。
- source_word: μὲν ... δὲ
  choice: ……，又……
  rationale: 以自然中文呈现两个彼此对应的行动：废除死亡，并使生命和不朽显露出来。
theological_decisions:
- issue: Χριστοῦ在Ἰησοῦ Χριστοῦ中的称号性质
  choice: 耶稣弥赛亚
  alternative: 耶稣基督
  rationale: “弥赛亚”保留Χριστός作为受膏者称号的语义；同时在脚注中保留已经名称化的传统译法。
- issue: καταργήσαντος对死亡所作之事的力度
  choice: 废除了死亡
  alternative: 使死亡失去效力
  rationale: “废除”保留原文强烈而决定性的宣告，但不在译文中自行判定死亡在现今是否已完全停止存在。
- issue: ἀφθαρσίαν的含义
  choice: 不朽
  alternative: 不死
  rationale: “不朽”较能保留免于腐朽败坏的语义重点；“不死”则突出不再死亡，作为词义替代列于脚注。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“显明出来—显露出来”保留原文关于启示和光照的呼应；分号使本节前半承接上一节、后半描述救主作为的结构清晰。
