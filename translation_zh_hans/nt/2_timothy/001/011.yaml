  yaml_path: translation/nt/2_timothy/001/011.yaml
  text: for which I was appointed a herald and an apostle and a teacher[a].
translation:
  language: zh_hans
  text: 为此，我被委任作宣讲者、使徒和教师。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“传令官”。希腊语指奉命公开宣告信息的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ὃ
  choice: 为此
  rationale: 回指上文的福音，并表达保罗受委任所关乎的事或目的；“为此”在现代汉语中自然，也保留了原文所指对象略带概括性的特点。
- source_word: ἐτέθην
  choice: 我被委任
  rationale: τίθημι的被动式在职分语境中表示被设立或指派；“被委任”能准确传达受托承担随后三种角色的含义。
- source_word: ἐγὼ
  choice: 我
  rationale: 原文显式使用第一人称代词，略有强调；汉语以“我被委任”的句式已能自然呈现主体，无须加“我本人”而造成过度强调。
- source_word: κῆρυξ
  choice: 传令官
  rationale: 该词指受委派公开宣告信息的人。“传令官”保留其正式受命传告的色彩，比“传道人”较少引入后来的教会职分含义。
- source_word: ἀπόστολος
  choice: 使徒
  rationale: 保罗以此词自称时，它是公认的使徒身份称谓；“使徒”是准确且通行的译法。
- source_word: διδάσκαλος
  choice: 教师
  rationale: 该词通常指教导者；“教师”简明、庄重，并与并列的职分相称。
theological_decisions:
- issue: κῆρυξ应译为传统教会用语“传道人”，还是更突出受命宣告含义的“传令官”
  choice: 传令官
  alternative: 传道人；宣讲者
  rationale: 本节列举保罗受委任承担的角色。“传令官”突出正式受命公开传告信息的含义，避免把词义缩窄为后世特定的教会职分；脚注同时提供更自然的功能性理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“为此”简洁回指上文；三个并列身份以顿号和“和”连接。正文保留“传令官”的历史职能色彩，并用脚注说明其实际含义。
