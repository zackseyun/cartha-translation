lexical_decisions:
- source_word: ἀλλὰ
  choice: 但
  rationale: 承接上文形成转折，突出阿尼色弗与那些以保罗为耻之人的不同表现。
- source_word: γενόμενος ἐν Ῥώμῃ
  choice: 到了罗马以后
  rationale: γίνομαι 的不定过去时分词与地点短语连用，可表达来到或身在罗马；正文采用自然的汉语时间结构，同时以脚注保留另一种理解。
- source_word: σπουδαίως
  choice: 殷勤地
  rationale: 表达认真、热切并付出努力的态度，与寻找某人的语境相符。
- source_word: ἐζήτησέν με
  choice: 寻找我
  rationale: 准确表达主动寻求、查找保罗的行动。
- source_word: καὶ εὗρεν
  choice: 并且找到了我
  rationale: 延续前句的宾语“我”，明确交代寻找的结果。
