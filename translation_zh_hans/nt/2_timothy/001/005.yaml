  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὑπόμνησιν ⸀λαβὼν τῆς ἐν σοὶ ἀνυποκρίτου πίστεως, ἥτις ἐνῴκησεν πρῶτον ἐν τῇ μάμμῃ σου Λωΐδι καὶ τῇ μητρί σου Εὐνίκῃ, πέπεισμαι δὲ ὅτι καὶ ἐν σοί.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/005.yaml
  text: having been reminded of the sincere faith in you, which first lived in your grandmother Lois and your mother Eunice, I am persuaded that it is also in you.
translation:
  language: zh_hans
  text: 我想起你里面那真诚的信心；这信心先住在你祖母罗以和你母亲友妮基里面，我深信这信心也住在你里面。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπόμνησιν λαβών
  choice: 我想起
  rationale: 该分词短语字面为“受到提醒/得着回想”；汉语用“我想起”自然表达记忆被唤起，同时与上文主句衔接。
- source_word: ἀνυποκρίτου πίστεως
  choice: 无伪的信心
  rationale: ἀνυπόκριτος 指不虚假、不装假；“无伪”庄重简洁，也保留对信心真实性的强调。
- source_word: ἐν σοὶ
  choice: 你里面
  rationale: 保留介词 ἐν 的内在意象，并与后文信心“住在……里面”的表述呼应。
- source_word: ἐνῴκησεν
  choice: 住在
  rationale: 该动词意为居住、内住；直译为“住在”保留原文把信心人格化为居住者的意象。
- source_word: μάμμῃ
  choice: 外祖母
  rationale: μάμμη 本身可泛指祖母；根据罗以是友妮基之母、友妮基是提摩太之母的家系语境，汉语亲属称谓需区分父系与母系，因此译作“外祖母”。
- source_word: πέπεισμαι
  choice: 我深信
  rationale: 完成时表达已经形成并持续持有的确信；“深信”自然体现坚定把握。
theological_decisions:
- issue: “信心住在”是否改释为家族宗教影响或传承
  choice: 保留“信心……住在……里面”的原文意象
  alternative: 译作“这信仰先由……持守，并传给了你”
  rationale: 原文陈述同一种无伪的信心先住在罗以和友妮基里面，也住在提摩太里面，却没有明说信心靠血缘传递；不应加入遗传或传承机制。
- issue: 保罗对提摩太信心的判断强度
  choice: “我深信”
  alternative: “我相信”或“我确信”
  rationale: πέπεισμαι 表达坚定确信，但仍是说话者对提摩太的判断；“我深信”既体现强度，也不把它改写成全知式断言。
translation_notes:
  register: 采用现代、庄重而易懂的书信语言。分号呈现关系从句后的停顿，并避免连续多个“这信心”造成生硬。人名按通行中文圣经音译处理。
