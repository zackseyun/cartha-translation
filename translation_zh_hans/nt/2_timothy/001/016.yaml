  text: δῴη ἔλεος ὁ κύριος τῷ Ὀνησιφόρου οἴκῳ, ὅτι πολλάκις με ἀνέψυξεν, καὶ τὴν ἅλυσίν μου οὐκ ἐπαισχύνθη·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/016.yaml
  text: May the Lord grant mercy to the household of Onesiphorus[a], because he often refreshed me and was not ashamed of my chain.
translation:
  language: zh_hans
  text: 愿主怜悯阿尼色弗一家，因为他屡次使我得安慰，也不以我的锁链为耻。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “锁链”也可转指“我的被囚处境”；原文直译为“锁链”。
    reason: lexical_alternative
lexical_decisions:
- source_word: δῴη
  choice: 愿……怜悯
  rationale: 不定过去时祈愿语气表达祈愿；汉语用“愿……”自然传达这一语气。与ἔλεος合译为“愿……怜悯”，比直译“愿……赐下怜悯”更简洁自然。
- source_word: ἔλεος
  choice: 怜悯
  rationale: 准确表达处于困境者所得的神圣恩慈，也符合祝愿式语境。
- source_word: ὁ κύριος
  choice: 主
  rationale: 保留神圣称号，并不进一步限定所指。
- source_word: τῷ Ὀνησιφόρου οἴκῳ
  choice: 阿尼色弗一家
  rationale: οἶκος在此指家庭或家属群体，而非房屋；“一家”是现代汉语中自然且准确的表达。
- source_word: ὅτι
  choice: 因为
  rationale: 明确引出祈愿的理由。
- source_word: πολλάκις
  choice: 屡次
  rationale: 简洁表达动作多次发生，语体庄重而易懂。
- source_word: ἀνέψυξεν
  choice: 使我振作
  rationale: 该动词表示使人重新得力、得到宽慰；“使我振作”自然传达保罗因对方的服事而得安慰和鼓舞。
- source_word: τὴν ἅλυσίν μου
  choice: 我的锁链
  rationale: 保留原文单数的具体意象；同时它可转喻保罗被囚的处境，脚注说明这一层含义。
- source_word: οὐκ ἐπαισχύνθη
  choice: 不以……为耻
  rationale: 自然表达该动词的羞耻语义和社会道德力度。
theological_decisions:
- issue: “主”的具体所指
  choice: 仅译作“主”，不具体说明
  alternative: 明确译作父神或主耶稣
  rationale: 原文只写ὁ κύριος，本节没有明确限定所指；译文保留这一神学上的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“屡次”“为耻”保留书信祝愿的凝练语气；脚注标记置于相关分句末，避免打断正文。
