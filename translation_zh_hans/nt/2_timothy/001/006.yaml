  text: δι’ ἣν αἰτίαν ἀναμιμνῄσκω σε ἀναζωπυρεῖν τὸ χάρισμα τοῦ θεοῦ, ὅ ἐστιν ἐν σοὶ διὰ τῆς ἐπιθέσεως τῶν χειρῶν μου·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/006.yaml
  text: For this reason I remind you to rekindle the gift of God that is in you through the laying on of my hands[a].
translation:
  language: zh_hans
  text: 为此，我提醒你，要把神的恩赐重新燃旺起来[a]，就是那借着我的按手而在你里面的恩赐。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“重新挑旺”。希腊语动词描绘把火重新拨旺、使之再度燃烧的景象。
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ ἣν αἰτίαν
  choice: 为此
  rationale: 简洁、自然地保留承接上文的因果关系。
- source_word: ἀναμιμνῄσκω
  choice: 我提醒你
  rationale: 准确表达现在时陈述及其劝勉语气，符合现代汉语习惯。
- source_word: σε ἀναζωπυρεῖν
  choice: 要把……重新燃旺起来
  rationale: 保留使将熄或减弱的火再次旺盛起来的生动意象，也传达持续激发恩赐的劝勉。
- source_word: τὸ χάρισμα τοῦ θεοῦ
  choice: 神的恩赐
  rationale: 贴近原文属格表达，不额外限定为某一种“属灵恩赐”，从而保留语义开放性。
- source_word: ὅ ἐστιν ἐν σοὶ
  choice: 这恩赐……在你里面
  rationale: 明确回指恩赐，并保留其现今存在于提摩太里面的陈述。
- source_word: διὰ τῆς ἐπιθέσεως τῶν χειρῶν μου
  choice: 借着我的按手
  rationale: “借着”对应 διά 加属格所表达的媒介或途径；“按手”是现代中文基督教语境中清楚而简练的仪式用语。
theological_decisions:
- issue: 恩赐与保罗按手之间的关系
  choice: 这恩赐借着我的按手在你里面
  alternative: 这恩赐是在我按手时临到你里面的
  rationale: 采用“借着”保留原文所陈述的媒介关系，但不进一步界定按手本身如何传递恩赐，也不引入超出本节的圣礼体系。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“重新燃旺起来”保留原文火焰意象；用分号拆开较长的关系从句，使普通读者更容易把握，同时不改变“借着按手在你里面”所修饰的是恩赐这一关系。
