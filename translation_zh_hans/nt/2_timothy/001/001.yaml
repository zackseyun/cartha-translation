base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/001.yaml
  text: Paul[a], an apostle of Messiah Jesus by the will of God, according to the promise of the life that is in Messiah Jesus,
translation:
  language: zh_hans
  text: 保罗，奉上帝的旨意作弥赛亚耶稣[a]的使徒，照着那在弥赛亚耶稣里的生命的应许，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节两处“弥赛亚耶稣”或译“基督耶稣”。
    reason: 保留Χριστός作为称号的意义，同时提供现代汉语圣经中的传统通行译法。
lexical_decisions:
- source_word: Παῦλος
  choice: 保罗
  rationale: 采用现代汉语圣经传统中通行的人名译法。
- source_word: ἀπόστολος
  choice: 使徒
  rationale: 此处是保罗自述受差遣职分的专门用语；“使徒”既准确又为普通读者熟悉，优于泛化为“使者”。
- source_word: Χριστοῦ Ἰησοῦ / Χριστῷ Ἰησοῦ
  choice: 弥赛亚耶稣
  rationale: Χριστός在此仍保有称号意义，译作“弥赛亚”可显明其“受膏者”的身份；脚注保留传统译法“基督耶稣”。
- source_word: διὰ θελήματος θεοῦ
  choice: 奉上帝的旨意
  rationale: διά加属格在这类差遣公式中表示上帝的授权或施行；“奉……旨意”符合自然、庄重的现代汉语。
- source_word: κατ’ ἐπαγγελίαν
  choice: 照着……应许
  rationale: κατά加宾格表达依照、符合的关系；不将它解释性改写为目的关系。
- source_word: ζωῆς τῆς ἐν Χριστῷ Ἰησοῦ
  choice: 在弥赛亚耶稣里生命
  rationale: 保留ἐν的关系性表达和修饰结构，不额外说明这生命是“所得的”或“赐下的”，以免缩窄原文含义。
theological_decisions:
- issue: Χριστός的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 这里的Χριστός与“耶稣”连用，但仍可辨认其称号意义，因此正文译出“弥赛亚”；同时以脚注保留汉语教会通行的“基督”。
- issue: 使徒职分与生命应许之间κατά所表达的关系
  choice: 照着
  alternative: 为了
  rationale: 原文可表达保罗的使徒职分与生命应许相符或以之为规范；采用“照着”保留这种关系，不把它明确解释为目的。
translation_notes:
  register: 采用现代、庄重而易懂的书信起首语体。“奉上帝的旨意作……的使徒”自然表达差遣与授权；句末逗号保留本节与下一节问候语在句法上的连续性。
