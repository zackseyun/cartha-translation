id: 2TI.1.8
reference: 2 Timothy 1:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Μὴ οὖν ἐπαισχυνθῇς τὸ μαρτύριον τοῦ κυρίου ἡμῶν μηδὲ ἐμὲ τὸν δέσμιον αὐτοῦ, ἀλλὰ συγκακοπάθησον τῷ εὐαγγελίῳ κατὰ δύναμιν θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/008.yaml
  text: Therefore, do not be ashamed of the testimony about our Lord, nor of me, his prisoner, but suffer hardship with the gospel according to the power of God,
translation:
  language: zh_hans
  text: 所以，不要以关于我们主的见证为耻[a]，也不要以我这位属他的囚犯为耻；倒要靠着上帝的能力，为福音一同受苦[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们的主所作的见证。”希腊文的属格可以这样理解；但在这里更可能指关于我们主的见证。
    reason: alternative_reading
  - marker: b
    text: 或译：“要为福音同受苦难。”原文动词含有与别人共同承受苦难的意思，但未说明共同受苦者是谁。
    reason: lexical_alternative
  - marker: c
    text: “靠着上帝的能力”也可译为“按照上帝的能力”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ οὖν
  choice: 所以，不要
  rationale: οὖν承接上文并引出推论；“所以”自然保留逻辑联系，μή与虚拟式构成禁止。
- source_word: ἐπαισχυνθῇς
  choice: 以……为耻
  rationale: 表达因羞耻而退缩；现代汉语中“以……为耻”既自然又保留其道德和社会层面的力度。
- source_word: τὸ μαρτύριον τοῦ κυρίου ἡμῶν
  choice: 为我们的主作见证
  rationale: 将属格主要理解为客观属格，即见证的内容是我们的主；“为……作见证”在汉语中比直译“关于……的见证”更自然，同时保留“见证”这一名词概念。
- source_word: μηδὲ ἐμὲ τὸν δέσμιον αὐτοῦ
  choice: 也不要以我这作他囚徒的为耻
  rationale: μηδέ连接第二个羞耻对象；“他囚徒”保留αὐτοῦ所表达的归属或关联，不把它限定为单纯“为他坐牢”。
- source_word: συγκακοπάθησον
  choice: 与……一同受苦
  rationale: 动词中的συν-含有共同参与之意；“一同受苦”保留这一成分，同时不明确补出原文未明说的共同受苦者。
- source_word: τῷ εὐαγγελίῳ
  choice: 与福音
  rationale: 与复合动词连用的与格关系较为压缩；正文保留“与福音一同受苦”的独特表达，避免直接解释成单一的“为福音受苦”。
- source_word: κατὰ δύναμιν θεοῦ
  choice: 靠着上帝的能力
  rationale: κατά加宾格可表达按照、相称于或凭借；此处汉语“靠着”自然呈现上帝能力是受苦的支持和根据，脚注保留较形式对应的译法。
theological_decisions:
- issue: “见证”与“我们的主”的关系
  choice: 客观属格：“为我们的主作见证”
  alternative: 主观属格：“我们的主所作的见证”
  rationale: 上下文劝提摩太不要因以主为中心的福音见证而羞耻，并与不可因保罗这位囚徒羞耻相平行；客观理解较符合语境，但希腊文属格本身容许另一理解，故列入脚注。
- issue: “作他囚徒的”所表达的关系
  choice: 保留囚徒与主之间的归属和关联
  alternative: 明确解释为“为他坐牢的人”或“因他被囚的人”
  rationale: αὐτοῦ没有明定关系属于归属、缘由还是代表；正文不将其收窄，以保留神学张力。
- issue: συγκακοπάθησον与“福音”的关系
  choice: “与福音一同受苦”
  alternative: “为福音一同受苦”
  rationale: 该复合动词明确含有共同受苦的意味，而与格关系可以理解为同福音相联或为福音受苦；正文贴近希腊文的压缩表达，脚注给出更解释性的自然译法。
- issue: κατὰ δύναμιν θεοῦ的语义
  choice: “靠着上帝的能力”
  alternative: “按照上帝的能力”
  rationale: “靠着”在现代汉语中清楚表达神的能力使人能够承受苦难；不过κατά也可强调尺度或相称关系，故以脚注保留。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“倒要”突出ἀλλά的转折和劝勉力度；句末用句号完成汉语句法。正文保留原文在“与福音一同受苦”及属格关系上的张力，并用脚注呈现真实可行的其他读法。
