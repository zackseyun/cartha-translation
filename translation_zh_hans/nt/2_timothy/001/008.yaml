review_pass:
  verdict: revise
  source_fidelity: 原文的禁止、转折、保罗“属主的囚犯”身份以及藉上帝能力参与受苦的劝勉均已大体呈现。然而“以为我们的主作见证为耻”在现代汉语中会自然理解为“以为我们的主作见证这件事为耻”，即主是作见证者，倒置了此处较可能的客观属格关系。另“与福音一同受苦”会使“福音”仿佛成为共同受苦的同伴，不合汉语语义，也未恰当表达该与格在此处“为福音”的关联。
  naturalness: 建议改为“关于我们主的见证”，清楚而不失名词性的“见证”。“我这作他囚徒的”不自然，改为“我这位属他的囚犯”较通顺，并保留原文未明定的属主／关联关系。“为福音一同受苦”是自然的现代汉语，且以“一同”保留复合动词的共同参与意味；脚注可说明共同受苦者未被明说。
  terminology: 保留“主”“上帝”“福音”“见证”等庄重、通行的基督教术语。“属他的囚犯”避免将αὐτοῦ限定解释成单纯“因他被囚”或“为他坐牢”。“靠着上帝的能力”可自然表达κατὰ δύναμιν θεοῦ的凭借／能力依据，脚注保留“按照”的较形式对应。
  issues:
  - severity: high
    issue: “以为我们的主作见证为耻”错误地表达了“见证”与“主”的关系。
    rationale: τὸ μαρτύριον τοῦ κυρίου ἡμῶν在此较可能是关于主的见证；现有汉语把“我们的主”处理为“作见证”的主语，反而对应脚注所列、但较不可能的主观属格读法。
  - severity: high
    issue: “与福音一同受苦”在汉语中把“福音”误作共同受苦者。
    rationale: συγκακοπάθησον的συν-表达共同参与受苦，但τῷ εὐαγγελίῳ在此应以“为福音”自然表达其关联。译作“为福音一同受苦”既忠于语境，也不虚构福音本身受苦。
  - severity: medium
