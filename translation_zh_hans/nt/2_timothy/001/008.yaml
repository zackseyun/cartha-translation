revisions:
- from: 所以，不要以为我们的主作见证为耻[a]，也不要以我这作他囚徒的为耻；倒要靠着上帝的能力，与福音一同受苦[b][c]。
  to: 所以，不要以关于我们主的见证为耻[a]，也不要以我这位属他的囚犯为耻；倒要靠着上帝的能力，为福音一同受苦[b][c]。
  rationale: 修订纠正了“见证”与“主”的属格关系在正文中的倒置，并将不合汉语语义的“与福音一同受苦”改为“为福音一同受苦”。同时以“属他的囚犯”替换不自然的“作他囚徒的”，在不预断该属格究竟是归属、代表还是缘由的前提下，保留其与主的关联。脚注锚点及其所说明的替代读法均已相应保留。
