  text: ὑποτύπωσιν ἔχε ὑγιαινόντων λόγων ὧν παρ’ ἐμοῦ ἤκουσας ἐν πίστει καὶ ἀγάπῃ τῇ ἐν Χριστῷ Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/013.yaml
  text: Hold to the pattern of sound words that you heard from me[c][b][a], in the faith and love that are in Messiah Jesus.
translation:
  language: zh_hans
  text: 你要在弥赛亚耶稣[c]里的信心[a]和爱心中，持守你从我听到的健全话语的范本。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “信心”也可译作“忠信”或“信靠”。希腊语πίστις可表达信、信靠或忠信。
    reason: lexical_alternative
  - marker: b
    text: 这句话也可理解为：“你要将从我听到的、关于在弥赛亚耶稣里的信心和爱心的健全话语作为范本持守。”希腊语结构既可能说明持守的方式，也可能说明话语的内容。
    reason: alternative_reading
  - marker: c
    text: 传统译法为“基督耶稣”。“弥赛亚”和“基督”都表示“受膏者”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποτύπωσιν
  choice: 范本
  rationale: 该词指可供遵循的模式、轮廓或典范。“范本”既保留规范性，又不把它过度解释为完整的教义体系。
- source_word: ἔχε
  choice: 持守
  rationale: 字面义是“持有”，这里的命令语气要求提摩太保有并坚持这一范本；“持守”在现代中文中自然地表达这种持续遵循的含义。
- source_word: ὑγιαινόντων λόγων
  choice: 健全话语
  rationale: ὑγιαίνω本义为“健康”，在此比喻真实、无败坏；λόγοι是“话语”。“健全话语”保留原文的健康隐喻，也避免直接将其解释成“健全教义”。
- source_word: ὧν παρ’ ἐμοῦ ἤκουσας
  choice: 从我听到的
  rationale: παρά加属格在这里表示来源；此关系从句修饰“健全话语”。
- source_word: ἐν πίστει
  choice: 在……信心……中
  rationale: ἐν可表示行动所处的领域或方式；πίστις在此译为“信心”，同时以脚注保留“忠信”或“信靠”的可能。
- source_word: καὶ ἀγάπῃ
  choice: 和爱心
  rationale: ἀγάπη自然译为“爱”或“爱心”；与“信心”并列时，“爱心”更符合现代中文表达。
- source_word: τῇ ἐν Χριστῷ Ἰησοῦ
  choice: 在弥赛亚耶稣里的
  rationale: 带冠词的介词短语整体限定“信心和爱心”；译文将它置于二者之前，使其自然地同时修饰两项。
- source_word: Χριστῷ Ἰησοῦ
  choice: 弥赛亚耶稣
  rationale: Χριστός在此仍保有称号“受膏者／弥赛亚”的含义；正文采用语义透明的“弥赛亚”，并在脚注保留传统译法“基督耶稣”。
theological_decisions:
- issue: ἐν πίστει καὶ ἀγάπῃ τῇ ἐν Χριστῷ Ἰησοῦ的句法归属
  choice: 理解为提摩太持守范本的领域或方式，即在源于弥赛亚耶稣的信心和爱心中持守
  alternative: 理解为“健全话语”的内容，即关于在弥赛亚耶稣里的信心和爱心的话语
  rationale: 命令句的劝勉脉络较支持方式或领域的理解，但希腊语结构也容许内容性的理解，因此正文采用前者，脚注保留后者。
- issue: Χριστός的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处称号意义仍可辨认，“弥赛亚”直接表达其语义；传统且更为人熟悉的“基督”作为脚注异译保留。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“健全话语”保留原文的身体健康隐喻；末尾重复“持守”是为使“在……中”明确说明行动方式，并避免中文读者误将其只与邻近名词机械连接。
