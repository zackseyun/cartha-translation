  text: ἐπιποθῶν σε ἰδεῖν, μεμνημένος σου τῶν δακρύων, ἵνα χαρᾶς πληρωθῶ
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/004.yaml
  text: longing to see you[a], remembering your tears, so that I may be filled with joy,
translation:
  language: zh_hans
  text: 我切切盼望见到你，想起你的眼泪，好让我满心喜乐，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιποθῶν
  choice: 切切盼望
  rationale: 现在分词表达强烈而持续的个人渴望；“切切盼望”自然、庄重，也保留了原文的感情色彩。
- source_word: σε ἰδεῖν
  choice: 见到你
  rationale: 不定式补足ἐπιποθῶν，说明所盼望的是与提摩太相见；“见到你”符合现代汉语习惯。
- source_word: μεμνημένος
  choice: 想起
  rationale: 完成时中被动形式的分词在此表示处于记念之中的状态；“想起”在句中流畅，并传达持续萦怀的意味。
- source_word: σου τῶν δακρύων
  choice: 你的眼泪
  rationale: 属格结构直接指提摩太的眼泪；这样翻译比“你的哭泣”更贴近原文名词表达，也避免增添情境解释。
- source_word: ἵνα
  choice: 好让
  rationale: 可表达目的，并可能兼含结果意味；“好让”在现代汉语中自然地连接保罗盼望相见与满有喜乐。
- source_word: χαρᾶς
  choice: 满心喜乐
  rationale: χαρᾶς与πληρωθῶ构成“被喜乐充满”的表达；“满心喜乐”是自然的汉语等效表达。
- source_word: πληρωθῶ
  choice: 让我满心
  rationale: 不定过去时被动虚拟式受ἵνα引导；汉语以使动结构“让我满心喜乐”自然表达被充满的语义。
theological_decisions:
- issue: ἵνα从句表示目的还是结果
  choice: 好让
  alternative: 以致
  rationale: 语境更自然地表达盼望相见的目的，但原文也可能带有预期结果的色彩；“好让”不作过度的神学或因果限定。
translation_notes:
  register: 采用现代、庄重而易懂的书信语体。“切切盼望”保留强烈情感；全句承接上一节，故末尾保留逗号。英文咨询层的脚注只提供同义英语措辞，并未反映需要在中文正文中标注的实质性异文或歧义，因此不设脚注。
