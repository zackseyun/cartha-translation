id: 2TI.1.9
reference: 2 Timothy 1:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: τοῦ σώσαντος ἡμᾶς καὶ καλέσαντος κλήσει ἁγίᾳ, οὐ κατὰ τὰ ἔργα ἡμῶν ἀλλὰ κατὰ ἰδίαν πρόθεσιν καὶ χάριν, τὴν δοθεῖσαν ἡμῖν ἐν Χριστῷ Ἰησοῦ πρὸ χρόνων αἰωνίων,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/009.yaml
  text: who saved us and called us with a holy calling[a], not according to our works but according to his own purpose and grace, which was given to us in Messiah Jesus before eternal ages[d][c][b],
translation:
  language: zh_hans
  text: 他救了我们，又以圣洁的呼召呼召我们[a]，不是按我们的行为，而是按他自己的旨意和恩典。这恩典早在万古以前[c]，就在弥赛亚耶稣里赐给了我们[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“呼召我们进入圣洁的呼召”或“借着圣洁的呼召呼召了我们”。希腊语的与格在这里可以有不止一种理解。
    reason: lexical_alternative
  - marker: b
    text: “弥赛亚”也常译作“基督”；这里的希腊词Χριστός可理解为称号。
    reason: alternative_reading
  - marker: c
    text: 较直译为“永恒的世代以前”或“永恒的时期以前”；按现代汉语也可表达为“时间开始以前”。
    reason: lexical_alternative
lexical_decisions:
- source_word: σώσαντος
  choice: 救了
  rationale: σῴζω在保罗书信的这一语境中具有明确的救恩含义；“救了”简洁自然，并保留其神学分量。
- source_word: καλέσαντος
  choice: 召了
  rationale: 与前面的“救了”并列，保留神主动呼召的含义；结合“呼召”这一名词表达，可显出原文καλέω与κλῆσις的同根关系。
- source_word: κλήσει ἁγίᾳ
  choice: 以圣洁的呼召
  rationale: 保留与动词“召”的同根重复，并用“以”较宽泛地呈现与格，可表达伴随或方式，却不在正文中过度限定其句法功能。
- source_word: οὐ κατὰ τὰ ἔργα ἡμῶν
  choice: 不是按我们的行为
  rationale: “按”对应κατά所表达的准则或根据；“行为”是现代中文中清楚且具有保罗书信语境连续性的译法。
- source_word: ἰδίαν πρόθεσιν
  choice: 他自己的旨意
  rationale: “旨意”自然表达神自身所定的目的或意向；“自己的”明确保留ἰδίαν的强调。
- source_word: χάριν
  choice: 恩典
  rationale: “恩典”是χάρις在保罗救恩语境中的标准译语，比一般性的“恩惠”更能保留该词的神学内涵。
- source_word: τὴν δοθεῖσαν ἡμῖν
  choice: 这恩典……赐给了我们
  rationale: 阴性分词δοθεῖσαν与χάριν一致，因此明确以“这恩典”承接；“赐给”同时表达被动给予和恩赐意味。
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: 在弥赛亚耶稣里
  rationale: Χριστός在此仍承载称号“弥赛亚”的意义；“在……里”保留ἐν及保罗常用的联合性表达，不将其改写为较窄的工具或中介关系。
- source_word: πρὸ χρόνων αἰωνίων
  choice: 早在万古以前
  rationale: “万古以前”是自然、庄重的现代中文表达，传达在漫长世代乃至时间起始以前的意思；“早在”使中文时序关系清楚，但不强行消除原文独特表达的张力。
theological_decisions:
- issue: κλήσει ἁγίᾳ中与格的解释
  choice: 以圣洁的呼召
  alternative: 呼召我们归入圣洁的呼召；借着圣洁的呼召
  rationale: 原文与格可以理解为方式、手段或呼召所指向的内容。正文采用较宽泛的“以”，并用脚注列出其他可能，避免把句法和神学含义限定得过窄。
- issue: Χριστῷ作为称号还是名称化表达
  choice: 弥赛亚耶稣
  alternative: 基督耶稣
  rationale: Χριστός本义为“受膏者”，在此仍可理解为称号；译作“弥赛亚”直接传达称号意义，同时以脚注保留中文传统译名。
- issue: πρὸ χρόνων αἰωνίων的时间含义
  choice: 万古以前
  alternative: 永恒的世代以前；时间开始以前
  rationale: 原文可较形式地理解为“永恒的时期以前”，也可按语义自然表达为“时间开始以前”。正文保留较具原文色彩的说法，脚注说明更直译和更通顺的理解。
- issue: 恩典是在何时及何种关系中赐下
  choice: 这恩典早在万古以前，就在弥赛亚耶稣里赐给了我们
  alternative: 这恩典是在弥赛亚耶稣里、在万古以前赐给我们的
  rationale: 保留“在弥赛亚耶稣里”和“万古以前”共同修饰“赐给”的结构，不把“在……里”改释为“借着”或“因着”，也不弱化恩典在创世前已赐予的陈述。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留“救”“呼召”“行为”“旨意”“恩典”等保罗书信中的关键用语；同根词“召／呼召”的适度重复有意对应原文。将希腊语长句分为两句，以提升现代中文可读性，同时用“这恩典”明确分词所修饰的对象。
