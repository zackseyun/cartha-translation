  text: Τιμοθέῳ ἀγαπητῷ τέκνῳ· χάρις, ἔλεος, εἰρήνη ἀπὸ θεοῦ πατρὸς καὶ Χριστοῦ Ἰησοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/002.yaml
  text: 'To Timothy[a], beloved child: grace, mercy, and peace from God the Father and Messiah Jesus our Lord.'
translation:
  language: zh_hans
  text: 致提摩太，亲爱的孩子：愿恩典、怜悯、平安从父神和我们的主弥赛亚耶稣[a]临到你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弥赛亚耶稣”也可译作“基督耶稣”。希腊文称号 Χριστός 在这里译作“弥赛亚”，以表达其含义，而不采用传统音译“基督”。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγαπητῷ
  choice: 亲爱的
  rationale: 表达亲密而郑重的爱，现代汉语中自然，且与 τέκνῳ 连用顺畅。
- source_word: τέκνῳ
  choice: 孩子
  rationale: 保留属灵亲子关系的比喻，不将本义较宽的 τέκνον 过度限定为“儿子”。
- source_word: χάρις
  choice: 恩典
  rationale: 准确保留保罗问安语中的核心神学用语。
- source_word: ἔλεος
  choice: 怜悯
  rationale: 与“恩典”和“平安”分别列出，保留原文三项并列结构。
- source_word: εἰρήνη
  choice: 平安
  rationale: 兼具关系和圣约层面的含义，也是自然、通行的圣经汉语。
- source_word: θεοῦ πατρὸς
  choice: 父上帝
  rationale: 原文没有修饰“父”的“我们的”；译作“父上帝”既准确，也避免补入原文所无的领属语。
- source_word: Χριστοῦ Ἰησοῦ
  choice: 弥赛亚耶稣
  rationale: Χριστός 在此仍具称号作用；译出其“弥赛亚”的含义，而不只采用传统音译“基督”。
- source_word: κυρίου ἡμῶν
  choice: 我们的主
  rationale: 保留 κύριος 的权威与基督论含义，并准确表达 ἡμῶν。
theological_decisions:
- issue: Χριστοῦ Ἰησοῦ 的译法
  choice: 弥赛亚耶稣
  alternative: 基督耶稣
  rationale: 按称号的语义翻译 Χριστός，显明其“受膏者／弥赛亚”的含义；脚注保留传统译法。
- issue: τέκνῳ 的亲属隐喻
  choice: 孩子
  alternative: 儿子
  rationale: τέκνον 本身不特指男性；“孩子”保留属灵后代的比喻，也不否认提摩太的男性身份。
- issue: 问安语的施予来源
  choice: 愿恩典、怜悯、平安从……临到你
  alternative: 恩典、怜悯、平安，从……而来
  rationale: 原文是省略动词的书信问安公式；补出“愿……临到你”使现代汉语完整自然，同时不改变祝愿性质。
translation_notes:
  register: 采用现代、庄重而易懂的书信问安语体。“亲爱的孩子”保留保罗对提摩太的深厚情感；不补入修饰“孩子”的“我的”，因为希腊原文没有相应词语。脚注标记置于相关称号之后。
