base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/014.yaml
  text: Guard the good deposit through the Holy Spirit who dwells in us[a][b].
translation:
  language: zh_hans
  text: 你要借着住在我们里面的圣灵[b]，守护那美好的托付[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那美善的托付”，或“所托付给你的美好之物”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“靠着住在我们里面的圣灵”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὴν καλὴν παραθήκην
  choice: 那美好的托付
  rationale: παραθήκη指交给人保管之物，也可指托付本身；“托付”在现代汉语中简洁自然，并保留受托保守贵重之物的意象。καλή译为“美好的”，表达其内在与道德上的善，不把含义限定为审美上的“美丽”或价值上的“珍贵”。
- source_word: φύλαξον
  choice: 守护
  rationale: 这个不定过去时命令语气要求提摩太积极、警醒地保护受托之物；“守护”比一般的“保留”更能传达防护与看守之意。
- source_word: διὰ πνεύματος ἁγίου
  choice: 借着……圣灵
  rationale: διά接属格在此表示途径、媒介或施事；“借着”既符合现代汉语习惯，也保留圣灵是守护这托付之途径或能力来源的含义。
- source_word: τοῦ ἐνοικοῦντος ἐν ἡμῖν
  choice: 住在我们里面的
  rationale: 现在时分词ἐνοικοῦντος表示持续居住；“住在我们里面”清楚自然，保留圣灵现今内住的含义，又避免采用过于术语化的表达。
- source_word: ἐν ἡμῖν
  choice: 在我们里面
  rationale: 直译保留内在居住的空间意象；“我们”的范围不被解释性地限定为保罗与提摩太二人或所有信徒。
theological_decisions:
- issue: “美好的托付”所指为何
  choice: 保留概括而含有比喻性的“那美好的托付”，不在正文中明确等同于福音或职分。
  alternative: 译为“所托付给你的福音信息”或“你受托承担的职分”。
  rationale: 上下文很可能指使徒所传的福音真道，但希腊文本本身表达紧凑，未明说具体所指；译文因此保留其开放性与神学张力。
- issue: “我们”的范围
  choice: 照原文译为“我们”，不缩小或扩大其指称。
  alternative: 明确解释为“我们所有信徒”或仅指“保罗和提摩太”。
  rationale: ἡμῖν既可首先联系保罗与提摩太所代表的信徒群体，也可具有更广泛的教会含义；正文不替原文作出单一裁定。
- issue: 圣灵在守护托付中的作用
  choice: 用“借着”保留圣灵作为途径、媒介或施事的语义空间。
  alternative: 译为“靠着”，较突出能力来源；或译为“由……来”，较突出施事者。
  rationale: διά接属格可表达媒介或施事，正文不把两者截然分开，也不削弱提摩太所领受的“守护”命令。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你要”明确体现第二人称单数命令；语序先交代守护所借助的圣灵，再落在核心命令“守护那美好的托付”上。脚注标记紧随各自对应的短语。
