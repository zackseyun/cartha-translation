id: 2TI.1.18
reference: 2 Timothy 1:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: δῴη αὐτῷ ὁ κύριος εὑρεῖν ἔλεος παρὰ κυρίου ἐν ἐκείνῃ τῇ ἡμέρᾳ— καὶ ὅσα ἐν Ἐφέσῳ διηκόνησεν, βέλτιον σὺ γινώσκεις.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/018.yaml
  text: May the Lord grant him to find mercy from the Lord on that day—and you know better how much he served in Ephesus[a][b][c].
translation:
  language: zh_hans
  text: 愿主使他在那日从主那里得着怜悯[a][b]——他在以弗所所作的一切服事，你知道得更清楚[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在主面前得着怜悯。”希腊语 παρὰ κυρίου 通常可表示“从主那里”，也有人理解为强调在主面前或与主同在。
    reason: lexical_alternative
  - marker: b
    text: “那日”是新约常用的表达，指将来上帝施行审判或为人申冤的日子。
    reason: cross_reference
  - marker: c
    text: 或译：“他在以弗所所做的各样服事。”希腊语在这里概括他服事的范围。
    reason: lexical_alternative
lexical_decisions:
- source_word: δῴη αὐτῷ ὁ κύριος εὑρεῖν ἔλεος
  choice: 愿主使他……得着怜悯
  rationale: 不定过去时祈愿语气表达祈愿；“愿……使他……得着”自然体现 δῴη 与不定式 εὑρεῖν 的结构，同时“得着怜悯”保留圣经语体中“找到/蒙受怜悯”的含义。
- source_word: παρὰ κυρίου
  choice: 从主那里
  rationale: παρά 加属格在此最自然地表示来源；保留原文两次“主”的重复，不加以协调或消解。
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: 在那日
  rationale: 简洁保留原文惯用表达及其末世意味，不直接扩写为“审判之日”或“末日”。
- source_word: ὅσα ἐν Ἐφέσῳ διηκόνησεν
  choice: 他在以弗所所做的一切服事
  rationale: ὅσα 概括服事的范围，διηκόνησεν 指实际服事；此译法兼顾原文概括性与现代汉语的自然度。
- source_word: βέλτιον σὺ γινώσκεις
  choice: 你知道得更清楚
  rationale: 保留 βέλτιον 的比较意味，却不擅自补出“比我”这一原文未明说的比较对象。
theological_decisions:
- issue: 两次“主”（ὁ κύριος……παρὰ κυρίου）的所指
  choice: 两处均译为“主”，不进一步指明分别是父还是子
  alternative: 第一处指基督、第二处指父；或两处都指基督
  rationale: 希腊文并未明确区分两处 κύριος 的所指，因此译文保留其神学张力与歧义。
- issue: “那日”的末世含义
  choice: 只译作“那日”
  alternative: “审判之日”或“末日”
  rationale: 上下文很可能指将来的神圣审判或申冤之日，但原文采用惯用而未展开的表达，故正文不作解释性扩写。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“得着怜悯”略带圣经语体，但普通读者易懂；“服事”准确承载 διακονέω 的服务含义。“至于”帮助汉语自然转接后半句；保留两次“主”及“那日”的含蓄表达。
