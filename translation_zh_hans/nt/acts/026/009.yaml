revisions:
- from: 所以，我自己确实曾认为，应当多方行事，反对拿撒勒人耶稣的名[a]。
  to: 我自己曾经认为，应当做许多事来反对拿撒勒人耶稣的名[a]。
  rationale: 修订将“许多事”（πολλά）明确译出，并用“做许多事来反对”自然表达“实行许多敌对行动”的句法关系。保留“我自己”的自指强调、“曾经认为”的昔日内在判断、“应当”的主观义务，以及“耶稣的名”的开放性圣经习语。
