  text: Ἐγὼ μὲν οὖν ἔδοξα ἐμαυτῷ πρὸς τὸ ὄνομα Ἰησοῦ τοῦ Ναζωραίου δεῖν πολλὰ ἐναντία πρᾶξαι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/009.yaml
  text: So I myself indeed thought that I ought to do many things in opposition to the name of Jesus the Nazarene[a].
translation:
  language: zh_hans
  text: 我自己曾经认为，应当做许多事来反对拿撒勒人耶稣的名[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“抵挡拿撒勒人耶稣的名。”
    reason: “反对”对应原文的敌对含义；“抵挡”是可行的汉语词汇替代，仍保留“名”这一习语，避免将其解释为权柄、声誉或事业。
lexical_decisions:
- source_word: Ἐγὼ
  choice: 我自己
  rationale: 希腊文显式使用第一人称代词，带有强调意味；“我自己”保留保罗自指认罪的语气。
- source_word: μὲν οὖν
  choice: 所以……确实
  rationale: “所以”承接并推进论述，“确实”表达 μέν 的轻度强调，同时保持现代汉语自然。
- source_word: ἔδοξα ἐμαυτῷ
  choice: 曾认为
  rationale: 该表达指保罗当时内心认定某事；“曾”明确这是他过去的判断，而“我自己”已承载反身强调。
- source_word: πρὸς τὸ ὄνομα
  choice: 反对……的名
  rationale: 与 ἐναντία πρᾶξαι 连用时，πρός 具有敌对、针对之意；保留“名”这一圣经习语，不缩窄为权柄、名誉或事业。
- source_word: Ἰησοῦ τοῦ Ναζωραίου
  choice: 拿撒勒人耶稣
  rationale: Ναζωραῖος 是与耶稣的地域来源和身份相关的称号；“拿撒勒人耶稣”简洁、自然，也保留称谓色彩。
- source_word: δεῖν
  choice: 应当
  rationale: 这里表达保罗昔日自认为负有的必要或义务；“应当”比“必须”更能体现这种主观认定。
- source_word: πολλὰ ἐναντία πρᾶξαι
  choice: 多方行事，反对
  rationale: πολλά 可指许多事或多种行动；“多方行事”保留行动的多样性，后接“反对”清楚表达敌对方向，且不擅自具体化这些行为。
theological_decisions:
- issue: “名”与耶稣的关系
  choice: 保留“耶稣的名”这一圣经表达
  alternative: 译作“耶稣的权柄”或“耶稣的事业”
  rationale: 原文的“名”可代表耶稣本人、其公开身份、声誉和权柄等多重关联；直译能保留其神学内涵与开放性，避免不必要地限定为单一含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“多方行事，反对……”兼顾希腊文 πολλὰ 的多重行动意味与 ἐναντία 的敌对含义；“拿撒勒人耶稣”保留原文称号感。
