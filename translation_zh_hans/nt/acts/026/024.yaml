  text: Ταῦτα δὲ αὐτοῦ ἀπολογουμένου ὁ Φῆστος μεγάλῃ τῇ φωνῇ ⸀φησιν· Μαίνῃ, Παῦλε· τὰ πολλά σε γράμματα εἰς μανίαν περιτρέπει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/024.yaml
  text: As he was saying these things in his defense[a], Festus said with a loud voice, “You are out of your mind, Paul! Your great learning is driving you into madness.”
translation:
  language: zh_hans
  text: 保罗这样申辩的时候，非斯都高声说：“保罗，你疯了！你广博的学识使你发疯了。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπολογουμένου
  choice: 申辩
  rationale: 该分词与属格独立结构表示与主句同时发生的动作；在此语境中，ἀπολογέομαι 指作正式的言语辩护。“申辩”既保留司法语境，也符合现代汉语表达。
- source_word: μεγάλῃ τῇ φωνῇ
  choice: 大声
  rationale: 该与格短语表示说话的方式；“大声”自然简洁，也保留非斯都高声打断保罗的现场感。
- source_word: φησιν
  choice: 说
  rationale: 希腊文采用历史现在时；现代汉语叙事用“说”无需显式标记过去，表达自然。
- source_word: Μαίνῃ
  choice: 你疯了
  rationale: μαίνομαι 表示发疯、失去理智。“你疯了”直接传达非斯都的强烈判断，现代、清楚而不文绉绉。
- source_word: τὰ πολλά ... γράμματα
  choice: 渊博的学问
  rationale: γράμματα 可指文字、著作、学识或教育；这里非斯都所指更可能是保罗广博的学识，而不是具体的多份文书。“渊博的学问”自然表达 τὰ πολλά 的程度。
- source_word: εἰς μανίαν
  choice: 发疯
  rationale: εἰς 与 μανίαν 表示进入疯狂状态的结果；结合汉语使役结构译作“使你发疯”，保留其结果性。
- source_word: περιτρέπει
  choice: 使
  rationale: περιτρέπω 在此表示使人转入某种状态；与“发疯”搭配为“使你发疯”，清楚体现因果关系。
theological_decisions: []
