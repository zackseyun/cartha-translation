  text: καὶ νῦν ἐπ’ ἐλπίδι τῆς ⸀εἰς τοὺς πατέρας ⸀ἡμῶν ἐπαγγελίας γενομένης ὑπὸ τοῦ θεοῦ ἕστηκα κρινόμενος,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/006.yaml
  text: And now I stand on trial because of the hope of the promise made by God to our fathers,[a]
translation:
  language: zh_hans
  text: 如今，我因对上帝向我们列祖所作应许所怀的盼望，站在这里受审。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ νῦν
  choice: 如今
  rationale: 承接上文并转向保罗当前受审的处境；“如今”自然、庄重，也保留时间与转折意味。
- source_word: ἐπ’ ἐλπίδι
  choice: 因盼望
  rationale: ἐπί加与格在这里表示受审的依据或缘由；“因盼望”以自然汉语表达因果关系。
- source_word: ἐπαγγελίας
  choice: 应许
  rationale: 该词指上帝所作的承诺；“应许”准确表达圣经语境中的承诺，并与“盼望”保持属格上的紧密联系。
- source_word: τῆς εἰς τοὺς πατέρας ἡμῶν ἐπαγγελίας
  choice: 向我们祖先所作的应许
  rationale: εἰς短语指出应许所面向的对象；此译法清楚表达上帝向以色列先祖作出应许。
- source_word: γενομένης ὑπὸ τοῦ θεοῦ
  choice: 上帝……所作的
  rationale: 分词与ὑπό加属格表明上帝是应许的发出者；汉语关系结构既自然又保留神圣主动者。
- source_word: πατέρας ἡμῶν
  choice: 我们的祖先
  rationale: 此处指以色列历代先祖。“祖先”在现代汉语中自然明确；脚注说明希腊文的字面措辞及其具体语境。
- source_word: ἕστηκα κρινόμενος
  choice: 站在这里受审
  rationale: ἕστηκα具有现在状态意义，κρινόμενος描述正在进行的司法审理；合译保留法庭场景，也符合现代汉语表达。
theological_decisions:
- issue: “我们的祖先”的身份
  choice: 保留为“我们的祖先”，按语境指以色列的列祖
  alternative: 译作“我们的父辈”或直接扩展为“以色列的列祖”
  rationale: 上下文将应许置于以色列的盟约历史中，但正文不进一步限定具体是哪几位先祖，以免消除原文保留的概括性。
translation_notes:
  register: 采用现代、庄重而易懂的法庭陈述语体。“站在这里受审”保留原文“站立”与“受审”两个要素；语序按现代汉语调整，但未把“应许的盼望”具体解释为某一种成就，以保留原文的神学张力。
