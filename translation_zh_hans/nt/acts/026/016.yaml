  text: ἀλλὰ ἀνάστηθι καὶ στῆθι ἐπὶ τοὺς πόδας σου· εἰς τοῦτο γὰρ ὤφθην σοι, προχειρίσασθαί σε ὑπηρέτην καὶ μάρτυρα ὧν τε εἶδές ⸀με ὧν τε ὀφθήσομαί σοι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/016.yaml
  text: 'But rise and stand on your feet[a], for I have appeared to you for this purpose: to appoint you as a servant and witness both of the things in which you have seen me and of the things in which I will appear to you,'
translation:
  language: zh_hans
  text: “但你要起来，站在自己的脚上；我向你显现，正是为了这个目的：要委派你作仆役和见证人，见证你看见我的事，以及我将向你显现的事。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνάστηθι καὶ στῆθι ἐπὶ τοὺς πόδας σου
  choice: 你要起来，双脚站稳
  rationale: 两个不定过去时命令语气要求立即行动；译文保留“起来”与“站在双脚上”的连续动作，同时用自然的现代汉语表达。
- source_word: εἰς τοῦτο γὰρ
  choice: 正是为了这事
  rationale: 该短语引出此次显现的目的；“正是为了这事”既明确表达目的，也保留强调语气。
- source_word: ὤφθην σοι
  choice: 我向你显现
  rationale: 该形式虽为被动形态，在显现叙事中通常具有不及物意义；“向你显现”保留客观的显现语言，不把其方式解释为内心感受。
- source_word: προχειρίσασθαί σε
  choice: 要委派你
  rationale: 不定式说明显现的目的，且词义包含选定并任命承担职责；“委派”适合此处正式的使命托付。
- source_word: ὑπηρέτην
  choice: 仆役
  rationale: 该词指处于从属地位、执行任务的人，不等同于 δοῦλος；“仆役”比“助手”更能体现受差遣服事的身份，又避免“牧师”等制度化含义。
- source_word: μάρτυρα
  choice: 见证人
  rationale: 指为所见及所得启示作证的人；“见证人”在现代汉语中准确且易懂。
- source_word: ὧν τε εἶδές με ὧν τε ὀφθήσομαί σοι
  choice: 见证你看见我的事，以及我将向你显现的事
  rationale: 希腊文关系结构高度压缩。译文保留两个并列范围以及前后呼应的“看见／显现”，并补出“见证”使汉语关系清楚，而不把未来的显现改译为泛指的教导或内在启示。
theological_decisions:
- issue: ὤφθην与ὀφθήσομαί所表达的启示性质
  choice: 两处都采用“显现”语言
  alternative: 译作“被你看见／将被你看见”，或意译为“启示自己／把事情指示给你”
  rationale: 经文描写复活的耶稣亲自向保罗显现并委派他。“显现”保留希腊文客观而未限定方式的启示表达，也不额外断定显现的具体形态。
- issue: ὧν引导的两个关系结构如何理解
  choice: 将其理解为保罗作见证的两类内容，并保留原文压缩关系
  alternative: 明确解释为“你已经看见关于我的事，以及我以后要指示你的事”
  rationale: 原文可让人理解为与看见耶稣及耶稣后来显现有关的事；译文不将其收窄为单纯“关于耶稣的资料”，也不把未来显现直接等同于口头指示。
translation_notes:
  register: 采用庄重、清楚的现代标准普通话。“不过”承接前文转折；“双脚站稳”保留差遣场景中的具体身体动作。“仆役”略带庄重色彩，但普通读者仍可理解，并能避免“助手”语气过弱或“教役人员”含义过窄。
