  text: καὶ κατὰ πάσας τὰς συναγωγὰς πολλάκις τιμωρῶν αὐτοὺς ἠνάγκαζον βλασφημεῖν, περισσῶς τε ἐμμαινόμενος αὐτοῖς ἐδίωκον ἕως καὶ εἰς τὰς ἔξω πόλεις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/011.yaml
  text: And in all the synagogues[a], punishing them many times, I tried to force them to blaspheme; and being exceedingly enraged against them, I kept persecuting them even to the foreign cities.
translation:
  language: zh_hans
  text: 我屡次在各会堂惩治他们，强迫他们说亵渎的话；我对他们狂怒至极，甚至追逼他们到外地的城邑[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“直到外面的城邑。”这短语很可能指犹太地以外的城市。
    reason: 说明ἔξω的较直译表达及其可能的地理范围；脚注标记置于实际对应的短语之后。
lexical_decisions:
- source_word: κατὰ πάσας τὰς συναγωγάς
  choice: 在各会堂
  rationale: κατά加宾格在此具有分布和地点意味，表示这一行动在各处会堂反复进行；“在各会堂”自然简洁。
- source_word: πολλάκις τιμωρῶν αὐτούς
  choice: 屡次……惩治他们
  rationale: πολλάκις强调反复发生；τιμωρέω表示施加惩罚。“屡次惩治”既保留重复性，也符合庄重的现代汉语。
- source_word: ἠνάγκαζον
  choice: 强迫他们
  rationale: 未完成过去时表现过去持续或反复的强制行动，但本身未必明确表示行动仅仅是尝试；因此正文不额外加入“试图”，以免过度解释其结果。
- source_word: βλασφημεῖν
  choice: 说亵渎的话
  rationale: 希腊文未说明亵渎的对象；此译保留这一开放性，也比单独使用“亵渎”更符合现代汉语表达。
- source_word: περισσῶς ἐμμαινόμενος αὐτοῖς
  choice: 我对他们狂怒至极
  rationale: περισσῶς加强程度，ἐμμαινόμενος表达近乎狂暴的敌意；“狂怒至极”传达强烈程度，同时避免现代汉语中有关精神疾病的误解。
- source_word: ἐδίωκον
  choice: 追逼他们
  rationale: 该未完成过去时表示持续或反复追逐、迫害；“追逼”兼顾实际追赶和敌意迫害的语境。
- source_word: ἕως καὶ εἰς τὰς ἔξω πόλεις
  choice: 甚至……远至境外的城邑
  rationale: ἕως καὶ εἰς表达行动延伸到令人意外的远处，ἔξω意为“外面、境外”；此译保留空间延伸感，不在正文中断定具体边界。
theological_decisions:
- issue: βλασφημεῖν所指的亵渎对象
  choice: 译作“说亵渎的话”，不明说对象
  alternative: “亵渎耶稣”或“咒骂基督信仰”
  rationale: 上下文很可能指针对耶稣或基督徒信仰的亵渎，但希腊文没有明说宾语；正文应保留原文的含混。
- issue: ἠνάγκαζον是否明确表示强迫未遂
  choice: 译作“强迫他们”，不加入“试图”
  alternative: “试图强迫他们”
  rationale: 未完成过去时可按语境带有企图意味，但并不必然表示未遂；直译为持续、反复的“强迫”可避免替原文断定结果。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“惩治”“亵渎”“追逼”“城邑”保持叙事的正式感，但不使用生僻或宗派化措辞；分号保留原句两组紧密相连的行动。
