  text: ὁ δὲ ⸀Παῦλος· Εὐξαίμην ἂν τῷ θεῷ καὶ ἐν ὀλίγῳ καὶ ἐν ⸀μεγάλῳ οὐ μόνον σὲ ἀλλὰ καὶ πάντας τοὺς ἀκούοντάς μου σήμερον γενέσθαι τοιούτους ὁποῖος καὶ ἐγώ εἰμι παρεκτὸς τῶν δεσμῶν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/029.yaml
  text: But Paul said[a], “I would pray to God that whether in a short time or in a long time, not only you but also all who hear me today might become such as I am—except for these chains.”
translation:
  language: zh_hans
  text: 保罗却说：“我向上帝祈求，无论短时间还是长时间[a]，不但你，连今天所有听我讲话的人，也都能成为像我这样的人——这些锁链除外。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“无论到什么程度，或费多少工夫”；也有人译作：“无论几乎还是完全。”这里的希腊语较难确定，可能指程度、努力，也可能指时间或范围。
    reason: 保留ἐν ὀλίγῳ καὶ ἐν μεγάλῳ的真实词义歧义，以及它与亚基帕前一句的多种可能联系。
lexical_decisions:
- source_word: Εὐξαίμην ἂν τῷ θεῷ
  choice: 我向上帝祈求
  rationale: 潜能语气的愿望表达与ἄν结合，表示祈愿；τῷ θεῷ明确指出祈求所向，因此译为自然、庄重的“我向上帝祈求”。
- source_word: ἐν ὀλίγῳ καὶ ἐν μεγάλῳ
  choice: 无论短时间还是长时间
  rationale: 该对举短语含义有争议；正文采用与上下文对话相称的时间解释，同时用脚注保留程度、代价或“几乎／完全”等可能性。
- source_word: οὐ μόνον σὲ ἀλλὰ καὶ πάντας τοὺς ἀκούοντάς μου σήμερον
  choice: 不但你，连今天所有听我讲话的人
  rationale: 保留“不但……连……”的强调对比，并以现代汉语自然表达现在正听保罗讲话的众人。
- source_word: γενέσθαι τοιούτους ὁποῖος καὶ ἐγώ εἰμι
  choice: 也都能成为像我这样的人
  rationale: γενέσθαι表达成为某种状态；“像我这样的人”准确而自然地传达对应结构τοιούτους ὁποῖος。
- source_word: παρεκτὸς τῶν δεσμῶν τούτων
  choice: 只是不要有这些锁链
  rationale: παρεκτός表示排除或例外；“锁链”具体呈现保罗被囚的处境。“只是不要有”比生硬的“除了”更符合此处汉语愿望句。
theological_decisions:
- issue: ἐν ὀλίγῳ καὶ ἐν μεγάλῳ与亚基帕上一句话之间的关系
  choice: 正文译作时间上的广泛对举：“无论短时间还是长时间”
  alternative: “无论到什么程度／付出多少”或“无论几乎还是完全”
  rationale: 希腊语本身难以确定究竟指时间、程度或代价。正文采用语境中合理的时间含义，但不将争议解释绝对化，并在脚注中保存其他可能。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“上帝”与本项目预期用语一致；句式保留保罗话语中的祈愿、强调和末尾带有现场感的锁链意象。
