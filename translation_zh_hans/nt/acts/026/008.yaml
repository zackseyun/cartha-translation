  yaml_path: translation/nt/acts/026/008.yaml
  text: Why is it judged unbelievable by you if God raises the dead?
translation:
  language: zh_hans
  text: 如果神使死人复活，为什么你们会认为这难以置信呢？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί ... κρίνεται παρ’ ὑμῖν
  choice: 为什么你们竟认为
  rationale: 以自然汉语表达“为何被你们判断为”的被动结构，同时保留判断主体明确是“你们”；“竟”传达问句中的反诘语气。
- source_word: ἄπιστον
  choice: 难以置信的
  rationale: 准确表达“不可信、无法相信”的意思，不把它缩窄为单纯的“不可能”。
- source_word: εἰ
  choice: 既
  rationale: 此处可引出被质疑的情形；结合反诘语境，汉语用“既……为什么……”自然地呈现“若/既然神使死人复活”的论证关系。
- source_word: ὁ θεὸς νεκροὺς ἐγείρει
  choice: 神使死人复活
  rationale: “使……复活”清楚表达 ἐγείρει 在死人语境中的“唤起、复起”，并保留现在时所表述的一般性命题。
theological_decisions:
- issue: εἰ 的条件性与论证语气
  choice: 译作“既”，形成“既……为什么……”的反诘
  alternative: “如果神使死人复活，你们为什么认为这是难以置信的呢？”
  rationale: 上下文中保罗是在挑战听众对神使死人复活之事的判断，而非表达自己对此存疑；“既”更符合现代汉语反诘，但不额外界定复活的范围或时间。
- issue: 复活陈述的范围
  choice: 保留一般表述“神使死人复活”
  alternative: 具体化为“神使耶稣从死人中复活”
  rationale: 原文使用复数 νεκρούς，表述神使死人复活的一般命题；不应擅自缩窄为只指耶稣。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。句式以“既……为什么……”呈现原文反诘，避免生硬直译为“为何在你们那里被判为不可信”。无脚注。
