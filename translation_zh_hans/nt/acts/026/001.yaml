  yaml_path: translation/nt/acts/026/001.yaml
  text: 'Then Agrippa said to Paul[b][a], “You are permitted to speak on your own behalf.” Then Paul stretched out his hand and made his defense:'
translation:
  language: zh_hans
  text: 亚基帕对保罗说：“准许你为自己申辩。”于是保罗伸出手来，申辩说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀγρίππας
  choice: 亚基帕
  rationale: 采用现代中文圣经传统中通行的人名音译。
- source_word: δὲ
  choice: （不单独译出）
  rationale: 此处表示叙事推进；中文依靠语序自然承接即可，若机械译作“然后”会显得累赘。
- source_word: πρὸς τὸν Παῦλον ἔφη
  choice: 对保罗说
  rationale: 按现代汉语自然表达，准确传达向保罗说话。
- source_word: Ἐπιτρέπεταί σοι
  choice: 准许你
  rationale: 保留被授予许可的正式语气，同时比“你被允许”更符合现代汉语习惯。
- source_word: ὑπὲρ σεαυτοῦ λέγειν
  choice: 为自己申辩
  rationale: 在审讯语境中，ὑπέρ加反身代词表示为自己陈述、辩护；“申辩”兼顾法律语境与中文自然度。
- source_word: τότε
  choice: 于是
  rationale: 既标明随即发生的时间顺序，也自然表达前后行动的承接。
- source_word: ἐκτείνας τὴν χεῖρα
  choice: 伸出手来
  rationale: 直接保留原文所述的身体动作，不进一步解释为特定手势。
- source_word: ἀπελογεῖτο
  choice: 为自己辩护说
  rationale: 该未完成时中间语态动词在此指作正式答辩；“辩护说”自然引出下文的直接陈述，又不额外加入原文未明说的“开始”。
theological_decisions: []
