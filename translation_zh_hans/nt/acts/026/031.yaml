  text: And after they withdrew[a], they were speaking to one another, saying, “This man is doing nothing worthy of death or imprisonment.”
translation:
  language: zh_hans
  text: 他们退到一旁后，彼此交谈，说：“这个人没有做任何该受死刑或监禁惩罚的事。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这个人没有做任何该受死刑或锁链惩罚的事。”希腊语“δεσμῶν”字面意思是“捆绑、锁链”，这里可能指监禁或拘押。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναχωρήσαντες
  choice: 退到一旁后
  rationale: 不定过去时分词表示他们先离开公开审理的场合，再彼此交谈；“退到一旁”自然表达离席、避开众人的动作。
- source_word: ἐλάλουν πρὸς ἀλλήλους
  choice: 彼此谈论
  rationale: 未完成时体现持续进行的交谈，“彼此”准确表达相互交流。
- source_word: λέγοντες
  choice: 说
  rationale: 引出谈论的具体内容；中文用“谈论说”简洁承接原文分词结构。
- source_word: Οὐδὲν ... ἄξιον
  choice: 没有一件该判……的
  rationale: 在司法语境中表达没有任何行为配受所列刑罚，中文以“该判”自然呈现应受刑罚之意。
- source_word: θανάτου ἢ δεσμῶν
  choice: 死刑或监禁
  rationale: θανάτου在此指司法上的死刑；δεσμῶν字面为“捆绑、锁链”，在此转指受拘禁或监禁。正文采用现代法律语境清楚易懂的表达，脚注保留字面意象。
- source_word: τι πράσσει
  choice: 所做的
  rationale: πράσσει泛指此人正在做或素来所行的事，不额外限定为犯罪行为。
- source_word: ὁ ἄνθρωπος οὗτος
  choice: 这个人
  rationale: 准确指向保罗，语气自然，并保留审议者谈及当事人的表达。
