id: ACT.26.20
reference: Acts 26:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἀλλὰ τοῖς ἐν Δαμασκῷ πρῶτόν ⸀τε καὶ Ἱεροσολύμοις, ⸀πᾶσάν τε τὴν χώραν τῆς Ἰουδαίας, καὶ τοῖς ἔθνεσιν ⸀ἀπήγγελλον μετανοεῖν καὶ ἐπιστρέφειν ἐπὶ τὸν θεόν, ἄξια τῆς μετανοίας ἔργα πράσσοντας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/020.yaml
  text: but first to those in Damascus[a], then also in Jerusalem, and throughout all the region of Judea, and to the Gentiles, I proclaimed that they should repent and turn to God[b], doing works worthy of repentance.
translation:
  language: zh_hans
  text: 而是先向大马士革的人，随后又在耶路撒冷和犹太全境，并向外族人[a]宣告：他们应当悔改，归向上帝，并且行与悔改相称的事[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “外族人”也可译作“列国之人”，这里指非犹太人。
    reason: lexical_alternative
  - marker: b
    text: “与悔改相称的事”也可译作“配得上悔改的行为”或“符合悔改的事”，指与悔改相配的实际行动。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: 而是
  rationale: 承接上文“没有违背”的否定，以“而是”自然表达相反的实际行动。
- source_word: τοῖς ἐν Δαμασκῷ
  choice: 向大马士革的人
  rationale: 保留与ἀπήγγελλον相配的间接宾语含义，明确所指是当地的人。
- source_word: πρῶτόν τε καὶ Ἱεροσολύμοις
  choice: 先向大马士革的人，随后又在耶路撒冷
  rationale: 按语序表达先后和递进关系；中文用“随后又”避免误解为两地同为“首先”。
- source_word: πᾶσάν τε τὴν χώραν τῆς Ἰουδαίας
  choice: 犹太全境
  rationale: χώρα在此泛指地域；“全境”简洁自然，也不把范围限定为乡村。
- source_word: τοῖς ἔθνεσιν
  choice: 向外族人
  rationale: 上下文中指犹太人以外的各族；“外族人”较自然地传达此处的族群对照，并以脚注保留“列国之人”的可能表达。
- source_word: ἀπήγγελλον
  choice: 宣告
  rationale: 在宣教语境中表达公开传达信息，比“报告”更贴切，又不过度增添礼仪色彩。
- source_word: μετανοεῖν
  choice: 悔改
  rationale: 此处不只是改变想法，而是人在上帝面前的悔悟和转变；“悔改”是现代中文中准确而通行的表达。
- source_word: ἐπιστρέφειν ἐπὶ τὸν θεόν
  choice: 归向上帝
  rationale: 表达转向上帝；“归向”不必然断定对象原先属于盟约群体，适用于本节包括的外族人。
- source_word: ἄξια τῆς μετανοίας ἔργα
  choice: 与悔改相称的事
  rationale: ἄξια表示相称、配得，ἔργα表示行为或所做的事；此译保留这些行为与悔改相符合的关系。
- source_word: πράσσοντας
  choice: 行
  rationale: 以简洁自然的中文表达持续付诸行动，并与“事”搭配。
theological_decisions:
- issue: 悔改、归向上帝与行为之间的关系
  choice: 将行为译为“与悔改相称的事”，作为伴随悔改并与之符合的实践
  alternative: 把行为理解为悔改本身的全部内容，或理解为蒙接纳的功德基础
  rationale: 句法先以两个不定式提出“悔改、归向上帝”，再用分词说明相应的行为。译文保留这种关系，但不进一步断言行为仅是证据，或具有赚取接纳的功效。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“悔改”“归向上帝”保留经文的宗教分量；“与悔改相称的事”既贴近原文，也不在译文中预先解决行为与悔改的全部神学关系。所有脚注标记均已在正文对应出现。
