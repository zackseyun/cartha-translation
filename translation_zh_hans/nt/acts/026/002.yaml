  text: Περὶ πάντων ὧν ἐγκαλοῦμαι ὑπὸ Ἰουδαίων, βασιλεῦ Ἀγρίππα, ἥγημαι ἐμαυτὸν μακάριον ἐπὶ σοῦ μέλλων ⸂σήμερον ἀπολογεῖσθαι⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/002.yaml
  text: Concerning all the things of which I am accused by the Jews[a], King Agrippa, I consider myself fortunate that I am about to make my defense before you today,
translation:
  language: zh_hans
  text: 亚基帕王，关于犹太人控告我的一切事，今天我将要在你面前申辩；我认为自己很有幸[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“有福”。这里很可能是指保罗能够在亚基帕面前申辩，因而认为自己有幸或处境有利。
    reason: 保留μακάριον可译为“有福”的词义可能，同时说明本句法律语境较支持“有幸”。
lexical_decisions:
- source_word: Περὶ πάντων ὧν
  choice: 关于……的一切事
  rationale: περί加属格引出所谈事项；这一表达既保留原文“关于”的结构，也符合现代汉语习惯。
- source_word: ἐγκαλοῦμαι
  choice: 控告我
  rationale: 该词在这里指正式提出指控；结合庭审语境，“控告”比一般性的“指责”更准确。希腊文的被动结构在汉语中自然转换为主动式“犹太人控告我”。
- source_word: ὑπὸ Ἰουδαίων
  choice: 犹太人
  rationale: ὑπό标明施事者。此处按上下文指控告保罗的犹太人，并非概括所有犹太人；汉语无需添加定冠词。
- source_word: βασιλεῦ Ἀγρίππα
  choice: 亚基帕王
  rationale: 原文是直接称呼的呼格；“亚基帕王”庄重自然，无需加入较古雅的“啊”。
- source_word: ἥγημαι ἐμαυτὸν
  choice: 实在感到
  rationale: 原意是“认为自己处于某种境况”。汉语用“感到有幸”自然表达这种自我判断；“实在”传达话语中的郑重语气，但不额外强化其程度。
- source_word: μακάριον
  choice: 有幸
  rationale: μακάριος可表示“有福”或处境幸运。这里保罗因能在熟悉犹太事务的亚基帕面前申辩而认为自己处境有利，因此“有幸”最贴合法庭语境，同时用脚注保留“有福”的词义可能。
- source_word: ἐπὶ σοῦ
  choice: 在你面前
  rationale: ἐπί加属格在此表示来到某人面前陈述案情；“在你面前”准确而自然，且不擅自把亚基帕称为审判官。
- source_word: μέλλων
  choice: 能
  rationale: 原文表示即将进行申辩；结合“今天”，汉语以“今天能……申辩”自然表达眼前获得的机会及即将发生的行动，避免生硬的“将要”。
- source_word: σήμερον
  choice: 今天
  rationale: 直接对应“今天”，简明而符合现代汉语。
- source_word: ἀπολογεῖσθαι
  choice: 申辩
  rationale: 该词是司法语境中的自我辩护。“申辩”简洁地保留正式法律意味，比宽泛的“为自己辩护”更凝练。
theological_decisions:
- issue: μακάριον是否带有明确的神学性“蒙福”含义
  choice: 正文译作“有幸”
  alternative: 有福
  rationale: 当前语境强调保罗有机会在亚基帕面前作法律申辩，并未明确说明这是神所赐的福分；正文不将可能的神学意味过度明确化，脚注则保留“有福”这一真实词义可能。
translation_notes:
  register: 采用现代、庄重而易懂的法庭陈述语体。保留“关于……的一切事”和直接称呼“亚基帕王”，并以句末逗号承接下一节尚未说完的理由。脚注标记紧随其实际解释的“有幸”，避免误附在“犹太人”之后。
