  text: ὁ δὲ Ἀγρίππας πρὸς τὸν ⸀Παῦλον· Ἐν ὀλίγῳ με πείθεις Χριστιανὸν ⸀ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/028.yaml
  text: Then Agrippa said to Paul[a], “In a short time you are persuading me to become a Christian.”
translation:
  language: zh_hans
  text: 亚基帕对保罗说：“这么短的时间里，你就在劝我成为基督徒了[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你差一点就劝服我成为基督徒了。”也可能是：“这么短的时间，你就想把我变成基督徒吗？”希腊语的说法既可指时间短，也可指程度小；亚基帕的语气可能是诚恳的，也可能带有讥讽。
    reason: 保留Ἐν ὀλίγῳ的词义歧义，以及整句话在诚恳陈述、回避和讥讽反问之间不确定的语气。
lexical_decisions:
- source_word: ὁ δὲ Ἀγρίππας
  choice: 亚基帕却
  rationale: δέ是较轻的承接或转折词；“却”在此自然引出亚基帕对保罗陈述的回应，但不把对立语气表达得过重。希腊语专名之前的冠词不另行译出。
- source_word: πρὸς τὸν Παῦλον
  choice: 对保罗说
  rationale: πρός在此接在说话者名称之后，省略了说话动词；汉语补出“说”，能清楚、自然地表达引出直接引语的功能。
- source_word: Ἐν ὀλίγῳ
  choice: 这么短的时间
  rationale: 该短语可指时间短，也可能指程度小。“这么短的时间”保留主要的时间义，同时以脚注说明“差一点”等其他可能，避免消除原文的歧义。
- source_word: με πείθεις
  choice: 你就在劝我
  rationale: πείθεις是现在时直陈式，可表示当下正在发生的劝服。“在劝”保留过程性，不武断地断定亚基帕已经被说服。
- source_word: Χριστιανὸν
  choice: 基督徒
  rationale: 这是Χριστιανός在现代汉语中准确且通行的称谓；在ποιῆσαι的结构中表示所形成的身份。
- source_word: ποιῆσαι
  choice: 成为
  rationale: 此处表达使某人成为某种身份。译为“劝我成为基督徒”符合现代汉语习惯，也保留结果指向；较直译的“把我变成基督徒”则容易显得生硬。
theological_decisions:
- issue: 亚基帕回应的语气和力度
  choice: 正文按表层句法译作陈述：“这么短的时间，你就在劝我成为基督徒了。”
  alternative: 也可理解为“你差一点就劝服我成为基督徒了”，或带讥讽、反问意味：“这么短的时间，你就想把我变成基督徒吗？”
  rationale: Ἐν ὀλίγῳ可涉及短时间或小程度，而上下文不能确定亚基帕是诚恳、回避还是讥讽。正文不擅自强化其中一种语气，其他合理理解列入脚注，以保留释义张力。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事和对话表达。“这么短的时间”适合当面回应的语境；“就在劝我”既通顺，又避免把尚在进行的劝服说成已经成功。
