    rationale: ἐὰν θέλωσι μαρτυρεῖν 后面的 ὅτι 从句是“作证”的内容，不是“作证”之后必然产生的另一项“证明”行为。该改写也削弱了原文保留的“若他们愿意”的限定。
  - severity: low
    issue: “作法利赛人”略显简省，身份与生活方式的关系不够清晰。
    rationale: ἔζησα Φαρισαῖος 概括保罗过去以法利赛人身份生活；“过法利赛人的生活”在现代标准汉语中更自然，并保留这一层意思。
