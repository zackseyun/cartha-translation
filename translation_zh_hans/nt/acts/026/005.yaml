  rationale: 删除“就会证明”，改以插入语直接连接“若他们肯作证”与其作证内容，避免添加结果意义。将“作法利赛人”修订为“过法利赛人的生活”，以自然、明确地表达保罗过去的身份和生活方式。保留“从起初”“最严格的教派”及两处脚注的原有释义。
