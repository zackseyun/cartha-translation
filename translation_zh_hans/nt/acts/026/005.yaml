  text: προγινώσκοντές με ἄνωθεν, ἐὰν θέλωσι μαρτυρεῖν, ὅτι κατὰ τὴν ἀκριβεστάτην αἵρεσιν τῆς ἡμετέρας θρησκείας ἔζησα Φαρισαῖος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/005.yaml
  text: They have known me from the beginning[a], if they are willing to testify[b], that I lived as a Pharisee according to the strictest sect of our religion.
translation:
  language: zh_hans
  text: 他们从起初[a]就认识我——若他们肯作证的话——我曾按照我们宗教中最严格的教派[b]，过法利赛人的生活。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“从一开始”，也可理解为“早已”。
    reason: lexical_alternative
  - marker: b
    text: 希腊语 αἵρεσις 在这里指“教派”或“派别”，不是后来专门意义上的“异端”。
    reason: lexical_alternative
lexical_decisions:
- source_word: προγινώσκοντές
  choice: 认识
  rationale: 此处指那些犹太人早先就认识保罗，并且这种认识延续至今；汉语用“认识”自然表达这种既有的熟悉关系，无须生硬译成“预先知道”。
- source_word: ἄνωθεν
  choice: 从起初
  rationale: 在本语境中指“从一开始、从早先”，修饰他们对保罗的认识，不是“从上面”。“从起初”既简洁，也保留其时间起点的含义。
- source_word: ἐὰν θέλωσι μαρτυρεῖν
  choice: 他们若肯作证
  rationale: θέλωσι突出意愿，μαρτυρεῖν在审讯语境中具有作证含义；“若肯作证”准确而自然。
- source_word: κατὰ
  choice: 按
  rationale: 表示保罗生活所依循的规范或所属传统；“按”在汉语中简洁地表达“按照”。
- source_word: ἀκριβεστάτην
  choice: 最严格的
  rationale: 该最高级在此描述某一宗教派别在遵行规范方面最为严谨；“最严格的”比“最精确的”更符合上下文。
- source_word: αἵρεσιν
  choice: 教派
  rationale: 此处指犹太教内部一个可辨认的群体或派别，即法利赛派，并非后世技术意义上的“异端”。
- source_word: τῆς ἡμετέρας θρησκείας
  choice: 我们宗教中
  rationale: 保罗以“我们”认同与听众共享的犹太宗教传统；“我们宗教中”自然表达该教派与整体宗教的关系。
- source_word: ἔζησα Φαρισαῖος
  choice: 作法利赛人
  rationale: 概括保罗从前以法利赛人身份度过的生活。“作法利赛人”简练地保留身份和生活方式两方面的含义。
theological_decisions:
- issue: 犹太历史语境中 αἵρεσις 的译法
  choice: 教派
  alternative: 异端；派别
  rationale: 本节称法利赛人为犹太宗教内部的一个公认群体，没有判定其为错误教义的意思。“异端”会引入后世教会论争中的贬义；“教派”则较准确地保留历史语境。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“他们若肯作证，就会证明”顺应汉语法庭陈述的表达，同时保留原文对证人是否愿意作证的条件意味；分号用于清楚呈现既有认识与可能作证之间的关系。
