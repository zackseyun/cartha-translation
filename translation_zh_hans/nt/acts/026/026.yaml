  text: ἐπίσταται γὰρ περὶ τούτων ὁ βασιλεύς, πρὸς ὃν ⸀καὶ παρρησιαζόμενος λαλῶ· λανθάνειν γὰρ ⸀αὐτὸν τούτων οὐ πείθομαι ⸀οὐθέν, οὐ γάρ ⸀ἐστιν ἐν γωνίᾳ πεπραγμένον τοῦτο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/026.yaml
  text: For the king knows about these things[a], and I speak boldly to him. For I am persuaded that none of these things has escaped his notice[c][b], because this has not been done in a corner.
translation:
  language: zh_hans
  text: 王知道这些事；我也就向他坦然直言[a]。我深信，这些事没有一件瞒过他[b]，因为这事并不是在角落里发生的[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“坦率地对他说话”或“放胆对他说话”。原文含有公开、坦率而有把握地发言之意。
    reason: lexical_alternative
  - marker: b
    text: “没有一件瞒过他”也可译为“没有一件是他不知道的”或“这些事没有一件逃过他的注意”。
    reason: lexical_alternative
  - marker: c
    text: “在角落里发生”是形象说法，意为秘密地或鲜为人知地发生；原文保留了“角落”的意象。
    reason: cultural_note
lexical_decisions:
- source_word: ἐπίσταται
  choice: 知道
  rationale: 该词表示知道或熟悉；“知道”在现代汉语中自然直接，也符合保罗对王知情程度的断言。
- source_word: περὶ τούτων
  choice: 这些事
  rationale: περί加属格表示所涉及的事项；“这些事”简洁自然，并保留指代范围的宽泛性。
- source_word: παρρησιαζόμενος
  choice: 坦然直言
  rationale: 该分词兼有公开、坦率和无所畏惧地说话之意；“坦然直言”比单用“大胆”更能兼顾从容与坦率。
- source_word: πρὸς ὃν ... λαλῶ
  choice: 向他……直言
  rationale: πρός指出说话的对象；按现代汉语语序处理为“向他……直言”，清楚而自然。
- source_word: λανθάνειν ... αὐτὸν
  choice: 瞒过他
  rationale: λανθάνω在此表示未被某人察觉；“没有一件瞒过他”以自然汉语表达没有任何事情逃过王的注意，并不暗示有人蓄意欺瞒。
- source_word: οὐ πείθομαι οὐθέν
  choice: 我深信……没有一件
  rationale: πείθομαι在此表示确信；希腊语否定结构在汉语中自然表达为肯定的确信加“没有一件”。“深信”传达保罗坚定的把握。
- source_word: πεπραγμένον
  choice: 发生的
  rationale: πράσσω的完成时被动分词指已经成就或发生的事；上下文论及一系列事件，用“发生的”比机械译作“做成的”更自然。
- source_word: ἐν γωνίᾳ
  choice: 在隐秘的角落里
  rationale: 保留“角落”的原文意象，同时加“隐秘的”提示其比喻义，即事情并非秘密或默默无闻地发生。
- source_word: τοῦτο
  choice: 这事
  rationale: 单数指示词概括前述事件，但具体范围未被限定；“这事”保留其概括性和歧义。
theological_decisions:
- issue: “这事”（τοῦτο）的范围及事件的公开性质
  choice: 保留为宽泛的“这事”，不具体限定所指，只表明它并非秘密发生。
  alternative: 将其明确解释为耶稣的受死与复活，或扩展为整个基督徒运动及保罗的案件。
  rationale: 原文以单数指示词概括前述事项，却没有精确定义范围。译文保留这种开放性，避免加入经文本身未明说的教义性限定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“所以我才”体现γάρ所表达的理由关系；“坦然直言”兼顾παρρησιάζομαι的坦率、公开与无惧。保留“这些事／这事”的数与指代变化，不擅自缩窄事件范围。所有脚注标记均置于相关正文之后。
