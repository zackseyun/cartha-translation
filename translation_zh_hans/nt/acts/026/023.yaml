  text: εἰ παθητὸς ὁ χριστός, εἰ πρῶτος ἐξ ἀναστάσεως νεκρῶν φῶς μέλλει καταγγέλλειν τῷ ⸀τε λαῷ καὶ τοῖς ἔθνεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/023.yaml
  text: that the Messiah would suffer[a], and that, as the first to rise from the dead[d][c][b], he would proclaim light both to the people and to the Gentiles.
translation:
  language: zh_hans
  text: 就是弥赛亚[a]会受苦，并且他作为第一个从死人中复活的，要向百姓[b]和外邦人[c]宣告光明。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“基督”。希腊语Χριστός在这里是称号，意思是“受膏者”。
    reason: alternative_reading
  - marker: b
    text: 这里的“百姓”很可能指犹太百姓，与后面的“外邦人”相对。
    reason: lexical_alternative
  - marker: c
    text: 或译“列国”。这里通常指犹太人以外的各族人。
    reason: lexical_alternative
lexical_decisions:
- source_word: παθητὸς
  choice: 会受苦
  rationale: 这个形容词表示能够、注定或必然经历苦难；在先知预言的概述中，用“会受苦”既自然，也避免把原文没有明说的情态过度强化为“必须”。
- source_word: ὁ χριστός
  choice: 弥赛亚
  rationale: 这里是在概述摩西和众先知对受膏者的预言，Χριστός主要作为称号使用，因此译作“弥赛亚”，并在脚注保留“基督”这一传统译法。
- source_word: πρῶτος ἐξ ἀναστάσεως νεκρῶν
  choice: 作为第一个从死人中复活的
  rationale: 明确保留πρῶτος所表达的先后地位，并把紧缩的希腊语结构译成自然汉语；译文不进一步界定这种“第一”与圣经中先前复生事件之间的神学关系。
- source_word: φῶς
  choice: 光明
  rationale: 保留圣经中“光”的丰富意象，可涵盖启示、救恩和盼望，而不缩减为单一的解释性概念。
- source_word: μέλλει καταγγέλλειν
  choice: 要……宣告
  rationale: μέλλω加不定式在这里表达预定的将来行动；“要……宣告”符合预言概述的语境，也不误导为时间上即刻将发生。
- source_word: τῷ τε λαῷ
  choice: 向百姓
  rationale: λαός按原文保留为“百姓”；它与“外族人”并列时，很可能特指犹太百姓，但这一指向放在脚注说明，避免在正文中过度明示。
- source_word: τοῖς ἔθνεσιν
  choice: 向外族人
  rationale: 在λαός与ἔθνη的对照中，此词指犹太人以外的人群；“外族人”比“列国”更清楚地传达这里的人群对照，同时保持现代汉语的可懂度。
- source_word: τε ... καὶ
  choice: ……和……
  rationale: 汉语用并列连词“和”即可自然表达两个同受词；不必机械加入“既……也……”。
theological_decisions:
- issue: “第一个从死人中复活”的基督论含义
  choice: 按原文陈述弥赛亚是第一个从死人中复活的，不在正文中进一步限定“第一”的具体神学含义。
  alternative: 明确译为“第一个复活后永不再死的”或“末后复活的初熟果子”。
  rationale: 原文表达复活上的优先地位，却没有在本句解释此前暂时复生的事例，也没有展开“初熟果子”的神学概念；正文应保留这种简洁和张力。
- issue: “百姓”的范围
  choice: 正文译作“百姓”，由它与“外族人”的对照暗示犹太百姓，并以脚注说明。
  alternative: 正文直接译作“犹太百姓”或“以色列人”。
  rationale: λαός在《使徒行传》的此类语境中常指以色列民，但原文并未加上“犹太”或“以色列”；保留较贴近原文的称呼可避免把解释写入正文。
- issue: παθητός所含情态
  choice: 译作“会受苦”。
  alternative: 译作“必须受苦”或“能够受苦”。
  rationale: 此词可以表达可受苦或命定受苦；预言语境支持将来的受苦，但正文不宜仅凭该形容词把“必须”这一较强情态绝对化。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“弥赛亚”“从死人中复活”“宣告光明”保留经文的先知性和圣经意象；句法清楚呈现弥赛亚受苦、复活并宣告光明这几个彼此关联的要点。
