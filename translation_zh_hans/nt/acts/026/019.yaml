  text: Ὅθεν, βασιλεῦ Ἀγρίππα, οὐκ ἐγενόμην ἀπειθὴς τῇ οὐρανίῳ ὀπτασίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/019.yaml
  text: Therefore[a], King Agrippa, I was not disobedient to the heavenly vision,
translation:
  language: zh_hans
  text: “所以，亚基帕王啊，我没有违背那从天上来的异象[a]，”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那属天的异象”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅθεν
  choice: 所以
  rationale: 承接前文保罗所述的显现与使命，表达由此得出的回应；“所以”自然清楚。
- source_word: βασιλεῦ Ἀγρίππα
  choice: 亚基帕王啊
  rationale: 保留直接呼语及王的尊称；“啊”在庄重的现代汉语中明确表现呼格。
- source_word: οὐκ ἐγενόμην
  choice: 我没有
  rationale: 与“违背”组合成自然汉语，表达保罗并未成为或显为不顺从的人。
- source_word: ἀπειθὴς
  choice: 违背
  rationale: 此处指拒绝服从所领受的天上使命；“违背异象”在汉语中自然，并保留意志与行动层面的不顺从。
- source_word: τῇ οὐρανίῳ ὀπτασίᾳ
  choice: 那从天上来的异象
  rationale: ὀπτασία译为“异象”；οὐρανίῳ既可表示来源，也可表示性质，正文采用自然的来源性表达，并以脚注保留另一种理解。
theological_decisions:
- issue: 保罗在大马士革路上经历的性质
  choice: 异象
  alternative: 显现
  rationale: ὀπτασία直接指所见的超自然异象或显现；“异象”保留原文自身的表述范畴，不进一步界定该经历的方式。
- issue: οὐρανίῳ所表达的是来源还是性质
  choice: 从天上来的
  alternative: 属天的
  rationale: 该形容词可指异象来自天上，也可指其属天性质；正文采用汉语较自然的来源性表达，脚注保留性质性译法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“亚基帕王啊”保留正式庭审场景中的直接称呼；句末逗号反映本节在后续话语中尚未结束。
