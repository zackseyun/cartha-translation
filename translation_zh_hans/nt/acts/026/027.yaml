  yaml_path: translation/nt/acts/026/027.yaml
  text: King Agrippa, do you believe the prophets? I know that you do believe.
translation:
  language: zh_hans
  text: 亚基帕王，你相信先知[a]吗？我知道你相信。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “相信先知”也可理解为“接受先知的话”或“信赖先知”。
    reason: 说明πιστεύω接与格时可涵盖相信先知本人、接受其见证或信赖他们等相近含义。
lexical_decisions:
- source_word: πιστεύεις
  choice: 你信
  rationale: 现在时主动直陈语气第二人称单数，在此构成直接问句。“信”既简洁自然，也保留相信、接受先知见证的含义。
- source_word: βασιλεῦ Ἀγρίππα
  choice: 亚基帕王
  rationale: βασιλεῦ是呼格；现代汉语以“亚基帕王”作直接称呼，自然庄重，无须添加古雅的呼语词。“亚基帕”按通行译名音译。
- source_word: τοῖς προφήταις
  choice: 先知
  rationale: 与πιστεύω连用的与格可表示所相信的人或其见证。直译为“信先知”，保留原文以人为语法对象的表达，并由脚注说明其所含的接受先知见证之意。
- source_word: οἶδα
  choice: 我知道
  rationale: 该完成时形式具有现在意义；“我知道”直接保留保罗断言的力度，不弱化为“我想”或“我相信”。
- source_word: ὅτι πιστεύεις
  choice: 你是信的
  rationale: 重复“信”以对应原文重复的πιστεύεις；“是……的”在现代汉语中自然带出肯定和强调，适合保罗紧接问句所作的断言。
theological_decisions:
- issue: “信先知”的性质
  choice: 保留为相信先知，即认可、接受他们的见证
  alternative: 译作“信赖先知”或明确扩展为“相信先知所写的话”
  rationale: 原文以“先知”为πιστεύω的与格对象，语境侧重承认先知的见证，却没有明确限定为个人信赖或仅指成文著作。正文保留原文张力，脚注提示可表达的含义，不扩充为更完整的教义陈述。
translation_notes:
  register: 采用现代、简洁而庄重的叙事语言。“亚基帕王”符合现代汉语直接称呼；末句用“你是信的”传达原文重复动词所形成的强调。
