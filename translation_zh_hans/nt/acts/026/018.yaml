  text: ἀνοῖξαι ὀφθαλμοὺς αὐτῶν, τοῦ ⸀ἐπιστρέψαι ἀπὸ σκότους εἰς φῶς καὶ τῆς ἐξουσίας τοῦ Σατανᾶ ἐπὶ τὸν θεόν, τοῦ λαβεῖν αὐτοὺς ἄφεσιν ἁμαρτιῶν καὶ κλῆρον ἐν τοῖς ἡγιασμένοις πίστει τῇ εἰς ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/018.yaml
  text: to open their eyes[a], so that they may turn from darkness to light and from the authority of Satan to God[b], that they may receive forgiveness of sins and an inheritance among those who have been sanctified by faith in me.
translation:
  language: zh_hans
  text: 要打开他们的眼睛，使他们从黑暗转向光明，从撒但的权势[a]转向神，好让他们得蒙罪的赦免，并在那些因信靠我而已经成圣的人[b]中得着一份产业。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“撒但的权柄”或“撒但的统治”。希腊语ἐξουσία可指权柄、统治力量或管辖范围。
    reason: lexical_alternative
  - marker: b
    text: 或译“在那些已经成为圣洁的人中”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνοῖξαι ὀφθαλμοὺς αὐτῶν
  choice: 打开他们的眼睛
  rationale: 保留“打开眼睛”这一具体而富有张力的比喻，不直接释作“使他们明白”。
- source_word: τοῦ ἐπιστρέψαι
  choice: 使他们……转向
  rationale: 表达带冠词不定式在差遣语境中的目的，并保留ἐπιστρέφω的转向意象，避免加入“归信”等解释性较强的措辞。
- source_word: ἀπὸ σκότους εἰς φῶς
  choice: 从黑暗转向光明
  rationale: 按原文保留黑暗与光明的对照；此译自然，也保存其丰富的神学意象。
- source_word: τῆς ἐξουσίας τοῦ Σατανᾶ
  choice: 撒但的权势
  rationale: ἐξουσία可指权柄、统治力量或管辖范围；“权势”在现代汉语中能兼顾权力与支配之意。
- source_word: ἐπὶ τὸν θεόν
  choice: 转向神
  rationale: 承接前面的转向结构，表达方向与归属的转移；不额外限定为某种教义化表述。
- source_word: τοῦ λαβεῖν αὐτοὺς ἄφεσιν ἁμαρτιῶν
  choice: 好让他们的罪得蒙赦免
  rationale: 自然表达第二个目的以及赦免是领受所得；“罪得蒙赦免”准确传达ἄφεσις ἁμαρτιῶν。
- source_word: κλῆρον
  choice: 一份产业
  rationale: κλῆρος在此指神子民中获分的一份或产业；“一份产业”既保留分配含义，也传达救恩语境中的承受产业意象。
- source_word: ἐν τοῖς ἡγιασμένοις
  choice: 在那些……成圣的人中
  rationale: 保留完成时被动分词的动作及持续状态，不将其静态化为单纯的称号。
- source_word: πίστει τῇ εἰς ἐμέ
  choice: 因信我
  rationale: 将工具或途径意义的πίστει译为“因信”，并明确εἰς ἐμέ所指的信仰对象是说话者耶稣。
theological_decisions:
- issue: πίστει τῇ εἰς ἐμέ的表达
  choice: 因信我而成圣
  alternative: 借着信靠我而成为圣洁
  rationale: 原文是“信”加上明确对象“我”，并非有争议的πίστις Χριστοῦ属格结构。“因信我”简洁自然，且不加入额外的宗派性解释。
- issue: κλῆρον的救恩含义
  choice: 一份产业
  alternative: 一份福分／一个份额
  rationale: 原词既可强调所得的份额，也可在圣经救恩语境中指承受的产业；正文兼用“一份”与“产业”，保存这两层含义。
- issue: 成圣的施事与途径
  choice: 因信我而成圣的人
  alternative: 因信我而成为圣洁的人
  rationale: 被动形式不明说施事者，译文同样不擅自补出；“因信我”保留信作为途径或凭借的关系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“打开眼睛”“从黑暗转向光明”等原文意象，并以两个目的结构“使……”“好让……”呈现句法推进。脚注标记依其实际说明对象分别置于“权势”和“成圣的人”之后。
