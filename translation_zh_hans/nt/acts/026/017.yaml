  text: delivering you from the people and from the Gentiles[a], to whom I am sending you
translation:
  language: zh_hans
  text: 我要救你脱离这百姓和外邦人[a]；我差你到他们那里去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这百姓”指犹太百姓；本句也可译作“我要救你脱离犹太百姓和外邦人”。
    reason: 说明“这百姓”在与“外邦人”对举时的上下文所指，并提供较明确的译法。
lexical_decisions:
- source_word: ἐξαιρούμενός
  choice: 救你脱离
  rationale: 该词在这里表示从敌对或危险的人群中搭救、解救。译作“救你脱离”既自然，也保留其救援含义；分词依附于主句中的差遣宣告，汉语用“我要”表达这一应许与持续保护。
- source_word: τοῦ λαοῦ
  choice: 这百姓
  rationale: 原文仅作“百姓”，但在“外族人”的对照下，所指是犹太百姓。译作“这百姓”保留原文没有明说“犹太”的特点，也符合保罗眼前听众与叙事语境。
- source_word: τῶν ἐθνῶν
  choice: 外族人
  rationale: 在犹太人与非犹太人的对照中，ἔθνη 指非犹太各族的人。“外族人”是现代汉语中清楚而不失庄重的表达，也比单译“列国”更能显明这里所指的是人群。
- source_word: εἰς οὓς
  choice: 到他们那里去
  rationale: εἰς 与差遣动词连用，表示被差往这些人那里。汉语译作“到他们那里去”自然清楚。
- source_word: ἀποστέλλω
  choice: 差你
  rationale: 该词表示带着使命差派。现在时在此是当下发出的使命宣告；汉语“差你”简洁地保留差遣含义。
theological_decisions:
- issue: “这百姓”在与“外族人”对举时的所指
  choice: 正文保留“这百姓”，让上下文表明其指犹太百姓。
  alternative: 直接译作“犹太百姓”或“以色列民”。
  rationale: 上下文强烈表明这里是犹太百姓与非犹太人之间的对举，但希腊文本本身只说“百姓”。正文不把隐含信息完全明说，可保留原文措辞及其叙事视角；脚注则帮助普通读者理解。
- issue: ἐξαιρούμενός 所表达的保护与差遣关系
  choice: 译作“我要救你脱离……并差你……”，将救援理解为伴随使命的应许。
  alternative: 译作“把你从……中选拔出来”，理解为从群体中分别出来。
  rationale: 该动词在此语境中通常表示搭救或解救，而且使徒行传叙事多次记载保罗从敌对者手中获救。正文不把它弱化为单纯的拣选或分别。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“救你脱离”比“拯救你脱离”简洁自然；“外族人”清楚表达犹太语境中的非犹太人。“并”用于理顺希腊语分词与限定从句在汉语中的关系。
