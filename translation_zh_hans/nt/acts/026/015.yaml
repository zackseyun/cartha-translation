source:
  edition: SBLGNT
  text: ἐγὼ δὲ εἶπα· Τίς εἶ, κύριε; ὁ δὲ ⸀κύριος εἶπεν· Ἐγώ εἰμι Ἰησοῦς ὃν σὺ διώκεις·
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/015.yaml
  text: And I said[a], ‘Who are you, Lord?’ And the Lord said, ‘I am Jesus, whom you are persecuting.’
translation:
  language: zh_hans
  text: 我说：“主啊，你是谁？”[a]主说：“我就是你所迫害的耶稣。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “主啊”也可译作“先生”。希腊语κύριε既可作尊敬的称呼，也可指“主”；这里说话者随即表明自己是耶稣。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ δὲ εἶπα
  choice: 我说
  rationale: δέ在这里是轻微的叙事连接词，现代汉语无需机械译出“而”或“于是”；ἐγώ由“我”自然表达，不额外强化对比。
- source_word: Τίς εἶ, κύριε;
  choice: 主啊，你是谁？
  rationale: τίς εἶ直译为“你是谁”；κύριε在天上显现、说话者随即表明自己是耶稣的语境中译为“主啊”，同时以脚注保留“先生”这一语用可能。
- source_word: ὁ δὲ κύριος εἶπεν
  choice: 主说
  rationale: ὁ κύριος指已明确的说话者，译为“主”；δέ只承接叙事，汉语以紧接的“主说”表达最自然。
- source_word: Ἐγώ εἰμι Ἰησοῦς
  choice: 我就是……耶稣
  rationale: 这是直接的身份揭示；“就是”自然传达汉语中的确认语气，但不扩展为“我本人就是”等更强表达。
- source_word: ὃν σὺ διώκεις
  choice: 你所迫害的
  rationale: διώκω在此指敌意的逼迫、迫害；关系从句前置为汉语定语，“你所迫害的耶稣”准确保留耶稣是迫害行为对象的陈述。
theological_decisions:
- issue: 扫罗称呼天上说话者时κύριε的译法
  choice: 主啊
  alternative: 先生
  rationale: κύριε可以是尊称“先生”，也可以指“主”。本段中说话者在天上显现，并立即自称耶稣，随后叙事又称其为“主”，因此正文采用“主啊”；脚注保留称谓在扫罗尚未获知其身份时可能具有的尊称义。
- issue: ὃν σὺ διώκεις所表达的耶稣与受迫害者的关系
  choice: 你所迫害的耶稣
  alternative: 你一直迫害的耶稣
  rationale: 正文保留原文直接而富有神学张力的身份陈述，不解释耶稣如何与受迫害的信徒认同；也不以“一直”过度限定希腊语现在时的体貌。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事体。省略不必机械呈现的连接词δέ，使中文流畅；用引号和“啊”自然呈现直接呼语。
