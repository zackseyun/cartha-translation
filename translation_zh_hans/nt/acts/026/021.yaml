  text: ἕνεκα τούτων ⸂με Ἰουδαῖοι⸃ ⸀συλλαβόμενοι ἐν τῷ ἱερῷ ἐπειρῶντο διαχειρίσασθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/021.yaml
  text: Because of these things the Jews seized me in the temple and were trying to kill me[a][b].
translation:
  language: zh_hans
  text: 因为这些事[a]，犹太人在圣殿里[b]抓住我，试图杀死我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“为此”或“由于这些事”。
    reason: lexical_alternative
  - marker: b
    text: 这里译作“圣殿”的希腊语指整个圣殿区域，并非专指内殿。
    reason: cultural_note
lexical_decisions:
- source_word: ἕνεκα τούτων
  choice: 正因这些事
  rationale: ἕνεκα加属格表示原因；“正因这些事”自然地回指保罗前述的见证与行动，并保留原文的因果关系。
- source_word: με
  choice: 我
  rationale: 第一人称单数宾格，是συλλαβόμενοι的直接宾语。
- source_word: Ἰουδαῖοι
  choice: 犹太人
  rationale: 无冠词复数在本叙事语境中指参与抓捕保罗的那些犹太人，而非泛指全体犹太人；现代汉语的无定表达“犹太人”既直接又避免扩大所指。
- source_word: συλλαβόμενοι
  choice: 抓住
  rationale: 该分词表示抓住或擒住；此处是敌对行动，并不必然指正式依法逮捕，因此译作“抓住”较准确。
- source_word: ἐν τῷ ἱερῷ
  choice: 在圣殿里
  rationale: ἱερόν指整个圣殿区域，而非专指内殿；正文采用自然简明的“在圣殿里”，并以脚注说明范围。
- source_word: ἐπειρῶντο
  choice: 企图
  rationale: 未完成时表达当时正在进行的尝试；“企图”在简洁的现代汉语中保留了未遂尝试之意。
- source_word: διαχειρίσασθαι
  choice: 杀死
  rationale: 本语境中指以暴力除掉、杀害；“杀死”清楚直接，不额外加入法律定罪意味。
theological_decisions:
- issue: 在带有争议色彩的语境中“Ἰουδαῖοι”的所指
  choice: 译作“犹太人”，按上下文理解为抓住保罗的特定犹太反对者
  alternative: 译作“那些犹太人”或“犹太民众”
  rationale: 原文明确指出参与事件的群体，但没有谴责所有犹太人的意思。中文无定形式保留历史所指，也不将叙事扩大为对整个族群的概括。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“正因这些事”承接上文；“抓住……企图杀死”保持叙事紧凑，并保留先抓住、继而试图杀害的关系。
