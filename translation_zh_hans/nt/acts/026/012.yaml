  text: In this connection[a], as I was traveling to Damascus with authority and a commission from the chief priests,
translation:
  language: zh_hans
  text: 在这种情形下[a]，我带着祭司长们授予的权柄和委任，前往大马士革。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“在这些事中”，回指前文保罗所说的行动和意图。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν οἷς
  choice: 那时
  rationale: 该短语字面为“在这些事中”，回指前文保罗迫害圣徒的行动与意图。现代汉语用“那时”自然承接叙事，同时以脚注保留其明确的回指性质。
- source_word: πορευόμενος εἰς τὴν Δαμασκὸν
  choice: 前往大马士革
  rationale: 现在分词表示与所述情境同时发生的行程；“前往”简洁、自然，εἰς在城市名称前表示目的地。
- source_word: μετ’ ἐξουσίας
  choice: 带着……授予的权柄
  rationale: ἐξουσία在此指获授的合法权力，而非单纯的能力或力量；加入“授予的”使中文清楚表达后接属格所表示的来源。
- source_word: ἐπιτροπῆς
  choice: 委任
  rationale: 该词指正式交付的任务或授权。“委任”既体现受托执行之意，也与“权柄”有所区分，不额外引入军事命令的意味。
- source_word: τῆς τῶν ἀρχιερέων
  choice: 祭司长们授予的
  rationale: 此属格短语说明权柄和委任的来源。中文改用主谓修饰结构较为自然，并保留复数领导群体的含义。
- source_word: ἀρχιερέων
  choice: 祭司长们
  rationale: 复数ἀρχιερεῖς指当时的高级祭司领袖群体，并非多位同时在任的大祭司；“祭司长们”准确且符合现代中文表达。
