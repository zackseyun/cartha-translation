  text: ἡμέρας μέσης κατὰ τὴν ὁδὸν εἶδον, βασιλεῦ, οὐρανόθεν ὑπὲρ τὴν λαμπρότητα τοῦ ἡλίου περιλάμψαν με φῶς καὶ τοὺς σὺν ἐμοὶ πορευομένους·
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/013.yaml
  text: At midday[a], along the road, I saw, O king, a light from heaven, brighter than the sun, shining around me and those traveling with me.
translation:
  language: zh_hans
  text: 正午时分，王啊，我在路上看见一道从天上来的光，比太阳还明亮[a]，照耀在我和与我同行的人周围。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“超过太阳的光辉。”希腊文强调这道光的明亮胜过太阳。
    reason: 保留ὑπὲρ τὴν λαμπρότητα τοῦ ἡλίου较贴近原文结构的译法，并说明其强调意味。
lexical_decisions:
- source_word: ἡμέρας μέσης
  choice: 正午时分
  rationale: 这是表示时间的惯用结构，指一天正中之时；“正午时分”准确、自然，也保留了明确的时间信息。
- source_word: κατὰ τὴν ὁδὸν
  choice: 在路上
  rationale: 该短语交代旅途中的地点；“在路上”是现代汉语中最自然、直接的表达。
- source_word: εἶδον
  choice: 我……看见
  rationale: 简单过去时的感知动词，直译为“看见”即可，不额外加入异象或突然发现等解释。
- source_word: βασιλεῦ
  choice: 王啊
  rationale: 保留对亚基帕王的呼格称呼；“王啊”庄重而明确，也未添加原文没有的“陛下”等称号。
- source_word: οὐρανόθεν
  choice: 从天上发出的
  rationale: 表示光的来源是天上；“天上”既符合《使徒行传》的叙事语境，也避免将其弱化为单纯来自天空的自然现象。
- source_word: ὑπὲρ τὴν λαμπρότητα τοῦ ἡλίου
  choice: 比太阳还明亮
  rationale: ὑπέρ加宾格表达超越，λαμπρότης指明亮或光辉。“比太阳还明亮”自然地传达这道光超过太阳光辉的比较关系。
- source_word: περιλάμψαν
  choice: 四面照着
  rationale: 该复合动词带有光环绕照射的含义；“四面照着”保留了环绕性，同时符合现代汉语表达。
- source_word: φῶς
  choice: 一道……光
  rationale: “一道光”是汉语介绍所见光象时自然的量词结构。
- source_word: τοὺς σὺν ἐμοὶ πορευομένους
  choice: 与我同行的人
  rationale: 准确表达当时和保罗一同赶路的人，不增加他们的身份或人数。
theological_decisions:
- issue: 异象语境中 οὐρανόθεν 的译法
  choice: 从天上发出的
  alternative: 从天空发出的
  rationale: “天上”保留原文在路加—使徒行传语境中可能具有的属天来源意味，而不进一步断定这一现象的性质；“天空”则容易使读者只理解为气象位置。
- issue: ὑπὲρ τὴν λαμπρότητα τοῦ ἡλίου 的比较强度
  choice: 比太阳还明亮
  alternative: 超过太阳的光辉
  rationale: 两种译法都表达光辉超越太阳；正文采用更自然的现代汉语，脚注保留较贴近希腊语结构的表达，避免削弱其强调。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。句序略按汉语习惯调整，将呼语置于句首；“一道光”“四面照着”等表达自然清楚，同时保留原文的来源、比较关系和环绕照射的意象。
