base_translation:
  language: en
  yaml_path: translation/nt/acts/026/014.yaml
  text: And when we had all fallen to the ground[a], I heard a voice saying to me in the Hebrew language, ‘Saul, Saul[b], why are you persecuting me? It is hard for you to kick against the goads.’
translation:
  language: zh_hans
  text: 我们都倒在地上以后，我听见有声音用希伯来话[a]对我说：“扫罗，扫罗，为什么迫害我？你踢刺棒是自讨苦吃。”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可能指“亚兰语”；希腊文直译为“用希伯来语言（或方言）”。
    reason: alternative_reading
  - marker: b
    text: 这是一句谚语：刺棒是赶牲畜用的带尖刺的驱赶工具；牲畜踢刺棒反会伤到自己，比喻抗拒者只会自受其害。
    reason: cultural_note
lexical_decisions:
- source_word: πάντων τε καταπεσόντων ἡμῶν εἰς τὴν γῆν
  choice: 我们都倒在地上以后
  rationale: 将属格独立结构自然地译为时间从句，保留“我们都”和倒地动作先于“听见”的时序；“地上”符合现代汉语叙事习惯。
- source_word: ἤκουσα φωνὴν λέγουσαν πρός με
  choice: 我听见一个声音……对我说
  rationale: φωνή在随后出现直接引语的语境中指可辨识的话音；这一表达也自然呈现声音是对保罗发出的。
- source_word: τῇ Ἑβραΐδι διαλέκτῳ
  choice: 用希伯来话
  rationale: 忠实保留希腊文“希伯来语/话”的表述，不在正文中直接改译为“亚兰语”；相关历史语言学可能性置于脚注。
- source_word: Σαοὺλ Σαούλ
  choice: 扫罗，扫罗
  rationale: 采用现代中文圣经语境中通行的人名译法，并保留原文的重复呼唤及其强调作用。
- source_word: τί με διώκεις;
  choice: 为什么迫害我？
  rationale: διώκω在本语境中表示敌意追逼、迫害；汉语无需另加进行体标记，也能自然表达当前持续的行为。
- source_word: σκληρόν σοι πρὸς κέντρα λακτίζειν
  choice: 你用脚踢刺棒，只会使自己受苦
  rationale: 以自然现代汉语传达谚语的画面和σοι所指向的自身后果；κέντρα译作赶牲畜用的“刺棒”，λακτίζειν的踢击动作也予以保留。脚注说明其谚语性质，避免正文过度展开。
theological_decisions:
- issue: τῇ Ἑβραΐδι διαλέκτῳ所指的语言
  choice: 用希伯来话
  alternative: 用亚兰语
  rationale: 正文优先反映希腊文明确使用的“希伯来”称谓，同时以脚注保留该短语在一世纪犹太语境中可能指亚兰语的理解，不武断消除语言学上的歧义。
- issue: 踢刺棒这一谚语的含义
  choice: 保留刺棒意象，并译出行为给本人带来的痛苦
  alternative: 抗拒只会伤害自己
  rationale: 正文保留原文具体比喻，而不把它完全抽象化为神学解释；“只会使自己受苦”使现代读者能够理解σκληρόν σοι的语用效果，脚注再交代谚语背景。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“以后”清楚表达叙事时序；直接引语保持口语力度。正文保留“希伯来话”和“刺棒”等原文要素，并通过脚注说明语言歧义与古代农牧文化背景。
