base_translation:
  language: en
  yaml_path: translation/nt/acts/026/032.yaml
  text: Then Agrippa said to Festus[a], “This man could have been released if he had not appealed to Caesar.”
translation:
  language: zh_hans
  text: 亚基帕对非斯都[a]说：“这个人若没有向凯撒上诉，本来可以获释。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这个人若没有向凯撒上诉，本可以被释放。”
    reason: 保留英语审校轨迹所附的等义措辞替代译法；“被释放”对应“获释”，不改变法律语境或反事实条件的含义。
lexical_decisions:
- source_word: δὲ
  choice: 就
  rationale: 此处承接叙事并引出亚基帕的结论性发言；“就”符合现代汉语叙事表达，同时保留连接作用。
- source_word: ἔφη
  choice: 说
  rationale: φημί的未完成时在此是叙事中的常规引语标记，不必刻意译出持续体；“说”自然准确。
- source_word: Ἀπολελύσθαι
  choice: 获释
  rationale: ἀπολύω的完成时不定式表示得到释放；法律语境中“获释”准确而简洁，又不把含义缩窄为正式“无罪释放”。
- source_word: ἐδύνατο
  choice: 本来是可以
  rationale: 与反事实条件句配合，表达过去曾存在但未实现的可能性；“本来是可以”在汉语中清楚呈现这一语气。
- source_word: ὁ ἄνθρωπος οὗτος
  choice: 这个人
  rationale: 保留指示词οὗτος的近指意味，并自然指称保罗。
- source_word: εἰ μὴ
  choice: 若没有
  rationale: 在本句中引入与事实相反的条件；配合“本来是可以”可自然表达其逻辑。
- source_word: ἐπεκέκλητο
  choice: 向……上诉
  rationale: 在罗马司法背景下，ἐπικαλέω Καίσαρα指请求凯撒审理，即向凯撒上诉；此译法明确保留法律含义。
- source_word: Καίσαρα
  choice: 凯撒
  rationale: 保留原文所用的正式称号及历史司法措辞，不解释性地改译为“皇帝”。
