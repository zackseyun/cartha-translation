  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐπικουρίας οὖν τυχὼν τῆς ⸀ἀπὸ τοῦ θεοῦ ἄχρι τῆς ἡμέρας ταύτης ἕστηκα μαρτυρόμενος μικρῷ τε καὶ μεγάλῳ, οὐδὲν ἐκτὸς λέγων ὧν τε οἱ προφῆται ἐλάλησαν μελλόντων γίνεσθαι καὶ Μωϋσῆς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/022.yaml
  text: Therefore[a], having received the help that is from God, I stand to this day, testifying to both small and great, saying nothing except what both the prophets and Moses said was going to happen[c][b],
translation:
  language: zh_hans
  text: 因此，我既蒙从神而来的帮助[a]，直到今天仍站立着，向卑微的和尊贵的作见证[b]；我所说的，无非是众先知和摩西所说将要发生的事[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“既得了神的帮助”。
    reason: lexical_alternative
  - marker: b
    text: “卑微的和尊贵的”指各种社会地位的人。
    reason: cultural_note
  - marker: c
    text: 也可译作：“我说的没有超出众先知和摩西所说将要发生的事。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπικουρίας ... τῆς ἀπὸ τοῦ θεοῦ
  choice: 从神而来的帮助
  rationale: 明确保留帮助的来源；“帮助”自然、庄重，准确表达援助之意。
- source_word: τυχὼν
  choice: 既蒙了
  rationale: 表达已经得到帮助的分词关系；“蒙了”与来自神的恩助搭配自然，但不额外加入恩典等神学概念。
- source_word: ἄχρι τῆς ἡμέρας ταύτης ἕστηκα
  choice: 直到今天仍能站立
  rationale: 兼顾完成时所表达的持续至今状态，以及上下文中因神帮助而得以继续作见证的含义；不把“站立”明确窄化为存活、坚持或出庭。
- source_word: μαρτυρόμενος
  choice: 作见证
  rationale: 保留见证和司法陈述的语义，同时符合《使徒行传》语境。
- source_word: μικρῷ τε καὶ μεγάλῳ
  choice: 向卑微的和尊贵的众人
  rationale: 以自然汉语呈现社会地位从低到高的两极表达，并用“众人”表明所指为人。
- source_word: οὐδὲν ἐκτὸς λέγων
  choice: 我所说的，无非是
  rationale: 自然表达“没有说……以外的任何事”，保留保罗关于其信息与经书相连续的强烈断言。
- source_word: οἱ προφῆται ... καὶ Μωϋσῆς
  choice: 众先知和摩西
  rationale: 保留希腊文的次序及并列关系，不按更常见的汉语圣经措辞倒置。
- source_word: ἐλάλησαν μελλόντων γίνεσθαι
  choice: 说过将要发生的事
  rationale: 保留先前言说及相对于该言说的将来指向，不擅自限定为迫在眉睫或命定发生。
theological_decisions:
- issue: 保罗的信息与以色列经书的连续性
  choice: 译为“我所说的，无非是众先知和摩西说过将要发生的事”
  alternative: “我说的没有超出众先知和摩西所说将要发生的事”
  rationale: 两种理解都表达内容未越出经书见证；正文用“无非是”保留强烈的排他语气，同时不把经文扩展为对预言细节程度的说明。
- issue: ἕστηκα 所指的持续状态
  choice: 仍能站立
  alternative: 一直存留到今天／直到今天仍站在这里
  rationale: 原词可强调当前仍站立的状态，并在语境中暗示蒙帮助后得以持续作证。正文保留“站立”，避免只解释成存活、坚忍或法庭上的站立。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“蒙了”略带经文语体，但在“从神而来的帮助”这一搭配中仍属当代可理解用语；其余句法力求自然，并保留原文“众先知和摩西”的次序及“站立”的语义张力。
