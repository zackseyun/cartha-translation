  text: μάλιστα γνώστην ὄντα σε πάντων τῶν κατὰ Ἰουδαίους ⸀ἐθῶν τε καὶ ζητημάτων· διὸ ⸀δέομαι μακροθύμως ἀκοῦσαί μου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/003.yaml
  text: especially because you are knowledgeable about all the customs and disputes among the Jews[b][a]. Therefore I beg you to listen to me patiently.
translation:
  language: zh_hans
  text: 尤其是因为您熟悉犹太人的一切习俗和争议[a]。因此，我恳求[b]您耐心听我陈述。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“犹太人中间的一切习俗和争议。”
    reason: lexical_alternative
  - marker: b
    text: “恳求”或译“请求”；原文动词表达诚恳的请求。
    reason: lexical_alternative
lexical_decisions:
- source_word: μάλιστα
  choice: 尤其是因为
  rationale: 该词强调亚基帕熟悉相关事务这一点；结合承接上节的句法，用“尤其是因为”自然表达此处的强调兼缘由。
- source_word: γνώστην ὄντα σε
  choice: 您熟悉
  rationale: 该结构称亚基帕为了解这些事务的人。“熟悉”符合现代汉语，也避免用“专家”过度强化原文。
- source_word: πάντων τῶν κατὰ Ἰουδαίους ἐθῶν
  choice: 犹太人的一切习俗
  rationale: πάντων译为“一切”，ἐθῶν译为“习俗”；“犹太人的”简洁自然地表达κατὰ Ἰουδαίους所指的相关范围，同时以脚注保留另一种关系表达。
- source_word: τε καὶ
  choice: 和
  rationale: 连接“习俗”与“争议”两个并列类别；汉语用“和”即可自然保留并列关系。
- source_word: ζητημάτων
  choice: 争议
  rationale: 在保罗受审的语境中，该词指有争论的问题；“争议”既保留争论色彩，也不过度限定为正式纠纷。
- source_word: διὸ
  choice: 因此
  rationale: 明确标示由亚基帕熟悉犹太事务而引出的请求。
- source_word: δέομαι
  choice: 我恳求
  rationale: 该动词表示诚恳而迫切的请求；“恳求”保留其力度，并以脚注注明较弱的可能译法。
- source_word: μακροθύμως
  choice: 耐心
  rationale: 在此修饰听取陈述的方式，“耐心”清楚自然。
- source_word: ἀκοῦσαί μου
  choice: 听我陈述
  rationale: 原意是听取说话者的话；在申辩语境中，“听我陈述”比直译“听我”更符合现代汉语，同时不预断陈述的具体性质。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的法庭陈述语体；以敬称“您”符合保罗对亚基帕王说话的场景。句首保留承接上一节的从属意味。
