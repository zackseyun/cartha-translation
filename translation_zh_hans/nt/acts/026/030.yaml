  text: ⸀Ἀνέστη ⸀τε ὁ βασιλεὺς καὶ ὁ ἡγεμὼν ἥ τε Βερνίκη καὶ οἱ συγκαθήμενοι αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/030.yaml
  text: Then the king rose[a], and the governor and Bernice and those seated with them,
translation:
  language: zh_hans
  text: 于是，王、总督、百尼基[a]和与他们同席的人都站起来了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “百尼基”也可译作“伯尼基”。
    reason: 人名音译存在不同惯用形式，脚注保留可接受的替代译法。
lexical_decisions:
- source_word: Ἀνέστη
  choice: 站起身来
  rationale: 此处是不定过去时，表示从座位上起身的具体动作；“站起身来”自然、清楚，也符合正式听审场合。
- source_word: τε
  choice: 于是／也
  rationale: 首个 τε 承接上文并推进叙事，译作“于是”；后一个 τε 与 καί 构成并列关系，通过“也”及汉语列举结构体现。
- source_word: ὁ βασιλεὺς
  choice: 王
  rationale: 原文使用头衔 βασιλεύς，而未直称亚基帕，因此保留为“王”。
- source_word: ὁ ἡγεμὼν
  choice: 省长
  rationale: ἡγεμών 在《使徒行传》的这一罗马行政语境中指行省长官；“省长”简明且符合现代中文圣经语体。
- source_word: Βερνίκη
  choice: 百妮基
  rationale: 采用现代中文圣经中较常见、易辨认的音译；原文为女性专名 Βερνίκη。
- source_word: οἱ συγκαθήμενοι αὐτοῖς
  choice: 与他们同席的人
  rationale: 保留 συγκαθήμενοι“与……一同坐着”的具体意象，同时用自然的现代汉语表达，不把这些人的身份过度解释为宾客或官员。
- source_word: καὶ
  choice: 和／也
  rationale: 原文重复使用 καί 串联各方；中文以“和”列举，并以“也”使共同起身的谓语自然覆盖其余各项。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。为避免中文首句只在语法上让“王”成为起身者，将共同动作在句末补明为“也都站了起来”；这符合希腊文单数谓语置于复合主语之前的结构。脚注标记已在正文相应人名后标出。
