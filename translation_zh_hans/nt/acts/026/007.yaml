source:
  edition: SBLGNT
  text: εἰς ἣν τὸ δωδεκάφυλον ἡμῶν ἐν ἐκτενείᾳ νύκτα καὶ ἡμέραν λατρεῦον ἐλπίζει καταντῆσαι· περὶ ἧς ἐλπίδος ἐγκαλοῦμαι ⸂ὑπὸ Ἰουδαίων, βασιλεῦ⸃·
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/007.yaml
  text: to which our twelve tribes hope to attain[a], as they earnestly serve God night and day. It is concerning this hope that I am accused by the Jews[c][b], O king.
translation:
  language: zh_hans
  text: 我们十二支派[a]殷切地日夜事奉上帝[b]，盼望得着这应许。王啊，我正是为了这个盼望，才受到犹太人的控告[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文采用集合意义的单数，可译作“我们这十二支派的民族”。
    reason: lexical_alternative
  - marker: b
    text: “事奉上帝”也可译作“敬拜”；原词指献给上帝的宗教性服事或敬拜。
    reason: lexical_alternative
  - marker: c
    text: 这里的“犹太人”是指在这场诉讼中控告保罗的犹太人，并非泛指所有犹太人。
    reason: contextual_clarification
lexical_decisions:
- source_word: εἰς ἣν
  choice: 得着这应许
  rationale: 关系代词所指的是上一节的“应许”；结合“盼望”，用“得着”自然表达εἰς的目标指向，不把应许的具体内容提前明说。
- source_word: τὸ δωδεκάφυλον ἡμῶν
  choice: 我们十二支派
  rationale: 原文是集合意义的单数，指以色列这十二支派的整体；“我们十二支派”在现代汉语中简洁自然，并保留保罗与其同胞的共同身份。
- source_word: ἐν ἐκτενείᾳ
  choice: 殷切地
  rationale: 表达持续而热切的投入，兼顾强度与恒切之意。
- source_word: νύκτα καὶ ἡμέραν
  choice: 日夜
  rationale: 采用现代汉语的自然固定说法，表达持续不断，不机械照搬希腊语词序。
- source_word: λατρεῦον
  choice: 事奉上帝
  rationale: 该词在这里指向上帝的宗教性服事或敬拜；补出语境中隐含的对象“上帝”，使汉语意思完整，同时以脚注保留“敬拜”的可能译法。
- source_word: ἐλπίζει καταντῆσαι
  choice: 盼望得着
  rationale: καταντάω表示达到、抵达目标；与“应许”搭配时，“盼望得着”是自然庄重的汉语表达。
- source_word: περὶ ἧς ἐλπίδος
  choice: 为了这个盼望
  rationale: περί加属格可表示“关于”，在这里也具有控告缘由的语境色彩；“为了”保留保罗因这盼望而受控告的修辞重点。
- source_word: ἐγκαλοῦμαι
  choice: 受到……控告
  rationale: 准确表达司法语境中的被动含义。
- source_word: ὑπὸ Ἰουδαίων
  choice: 犹太人
  rationale: 直译控告者的群体身份；脚注说明这里特指参与控告保罗的人，并非泛指所有犹太人。
- source_word: βασιλεῦ
  choice: 王啊
  rationale: 保留呼格的直接称呼及庭审陈辞中的正式语气。
theological_decisions:
- issue: λατρεῦον所事奉的对象在原文中未明说
  choice: 正文译作“事奉上帝”
  alternative: 事奉；敬拜
  rationale: 本段谈论以色列持续的宗教事奉，语境明确指向上帝。汉语及物表达补出“上帝”可避免句意残缺，但不引入新的神学主张。
- issue: “盼望”的具体内容
  choice: 只让“这个盼望”回指上文的应许
  alternative: 在本节明确译成复活的盼望
  rationale: 上下文最终涉及复活，但本节没有再次明说其内容，因此不在正文中提前消解这一指代关系。
- issue: περὶ ἧς ἐλπίδος表示控告主题还是缘由
  choice: 译作“为了这个盼望”
  alternative: 关于这个盼望
  rationale: 原结构容许“关于”与“因为”两层关联；结合司法语境，“为了”自然传达这盼望既是争议主题，也是控告缘由，而不进一步界定指控内容。
translation_notes:
  register: 采用现代、庄重而易懂的法庭陈辞语体。“王啊”保留直接呼告；“殷切地日夜事奉”避免文言化，同时呈现持续而热切的宗教事奉。所有脚注标记均置于正文相应词语之后。
