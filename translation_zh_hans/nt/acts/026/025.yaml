  text: ὁ δὲ ⸀Παῦλος· Οὐ μαίνομαι, φησίν, κράτιστε Φῆστε, ἀλλὰ ἀληθείας καὶ σωφροσύνης ῥήματα ἀποφθέγγομαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/025.yaml
  text: But Paul said[a], “I am not out of my mind, most excellent Festus[c][b], but I am speaking words of truth and sound judgment.”
translation:
  language: zh_hans
  text: 保罗却说：“我没有发疯[a]，尊贵的非斯都大人[b]；我所说的乃是真实而理智的话[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “发疯”也可译作“精神失常”。
    reason: lexical_alternative
  - marker: b
    text: “尊贵的……大人”是对高级官员使用的正式尊称。
    reason: cultural_note
  - marker: c
    text: “理智”也可理解为“清醒”或“心智健全”；原词还可含有自制、审慎的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: 却
  rationale: 承接上一节非斯都的指控，表达明显的转折，同时符合现代汉语叙事习惯。
- source_word: μαίνομαι
  choice: 疯
  rationale: 该动词指发疯或精神失常；“疯”直接、自然，并保留保罗对上一节指控的明确否认。
- source_word: φησίν
  choice: 说
  rationale: 原文为历史现在时；汉语叙事用“说”即可自然表达，不必刻意标示时态。
- source_word: κράτιστε
  choice: 尊贵的……大人
  rationale: 这是对高级官员的正式尊称；“尊贵的”保留最高级敬称的庄重意味，“大人”体现对官员的正式称呼。
- source_word: ἀληθείας
  choice: 真实
  rationale: 在“真实而理智的话”中以形容性质表达属格，既忠实传达话语具有真理、真实性的特征，也符合自然汉语。
- source_word: σωφροσύνης
  choice: 理智
  rationale: 该词可涵盖心智健全、清醒、自制等含义；在与“疯”对照的语境中，“理智”自然地突出心智清醒和言辞审慎，同时不把含义缩窄为单纯的冷静。
- source_word: ῥήματα
  choice: 话
  rationale: 保留原文具体的复数言语概念；汉语集合名词“话”无需机械标出复数。
- source_word: ἀποφθέγγομαι
  choice: 我所说的
  rationale: 该动词有郑重说出、宣告之意；此处用主题结构“我所说的”自然承接后面的“话”，既不过度强化修辞，也保留公开陈说的语境。
