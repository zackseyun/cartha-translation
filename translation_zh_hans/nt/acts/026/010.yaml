  text: ὃ καὶ ἐποίησα ἐν Ἱεροσολύμοις, καὶ πολλούς ⸀τε τῶν ἁγίων ἐγὼ ⸀ἐν φυλακαῖς κατέκλεισα τὴν παρὰ τῶν ἀρχιερέων ἐξουσίαν λαβών, ἀναιρουμένων τε αὐτῶν κατήνεγκα ψῆφον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/010.yaml
  text: 'And this is what I did in Jerusalem: I not only locked up many of the saints in prisons[a], having received authority from the chief priests, but also, when they were being put to death[b], I cast my vote against them.'
translation:
  language: zh_hans
  text: 我在耶路撒冷也这样做了：我从祭司长那里得到权柄，把许多圣徒[a]关进监牢；他们被处死时，我也投票赞成处死他们[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣徒”指归属上帝的圣洁子民，也就是信耶稣的人；不是仅指后来受册封的少数人。
    reason: lexical_clarification
  - marker: b
    text: 原文直译为“投下一票”；“赞成处死他们”的方向是按上下文补出的。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ καὶ ἐποίησα
  choice: 我……确实这样做了
  rationale: ὃ回指上一节所说逼迫信徒之事；“这样做了”自然承接上文，“确实”表达καί在此处的确认、落实意味。
- source_word: ἐν Ἱεροσολύμοις
  choice: 在耶路撒冷
  rationale: 采用现代汉语通行地名译法。
- source_word: πολλούς τε τῶν ἁγίων
  choice: 许多圣徒
  rationale: ἅγιοι指归属上帝的圣洁群体，即耶稣的信徒；“圣徒”保留新约关键词的连续性，并以脚注防止读者误解为后世受册封的少数人物。
- source_word: ἐν φυλακαῖς κατέκλεισα
  choice: 关进监牢
  rationale: κατακλείω表示关闭、拘禁；“关进监牢”既传达动作，也保留φυλακαῖς所指的监禁场所。汉语无需刻意用复数。
- source_word: τὴν παρὰ τῶν ἀρχιερέων ἐξουσίαν λαβών
  choice: 从祭司长那里得到权柄
  rationale: 保留分词短语所说明的行动依据；ἐξουσία译作“权柄”，ἀρχιερεῖς按新约惯例译作“祭司长”。
- source_word: ἀναιρουμένων τε αὐτῶν
  choice: 他们被处死时
  rationale: ἀναιρέω在此指置人于死地；以时间从句自然表达被动现在分词的情境关系，同时不额外限定具体处决程序。
- source_word: κατήνεγκα ψῆφον
  choice: 我也投票赞成
  rationale: ψῆφος本指投票所用的小石子，进而指一票；“投票”保留其具体司法性意象。“赞成”根据迫害和处死的语境补明投票方向，但以脚注交代原文没有明说宾语。
theological_decisions:
- issue: ἅγιοι在《使徒行传》中的所指
  choice: 译作“圣徒”，指信耶稣、归属上帝的人
  alternative: 圣洁的人；上帝的子民；信徒
  rationale: 此词指整个信徒群体，并非后来经过特定程序册封的少数人。正文保留传统而重要的圣经用语，脚注予以澄清。
- issue: κατήνεγκα ψῆφον的力度与制度背景
  choice: 译作“投票赞成”，表达保罗亲自投下赞成处死他们的一票
  alternative: 表示赞同；投票反对他们；投下一票
  rationale: 原文明确使用ψῆφος这一投票用语，因此不弱化为一般态度上的赞同；但不据此推断保罗所属的具体机构或正式身份。脚注说明“赞成”的对象由语境补足。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“确实这样做了”顺畅承接上文；分号清楚呈现两项迫害行为。“权柄”“圣徒”保留新约关键用语，并用脚注消除现代读者可能产生的误解。
