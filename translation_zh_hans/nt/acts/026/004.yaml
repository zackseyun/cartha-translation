  text: Τὴν μὲν οὖν βίωσίν μου ⸀τὴν ἐκ νεότητος τὴν ἀπ’ ἀρχῆς γενομένην ἐν τῷ ἔθνει μου ἔν ⸀τε Ἱεροσολύμοις ἴσασι ⸀πάντες Ἰουδαῖοι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/004.yaml
  text: So then[a], all the Jews know my manner of life from my youth, which from the beginning took place among my own nation and also in Jerusalem,
translation:
  language: zh_hans
  text: 那么，我从年轻时起的生活方式[a]——就是我从起初在本民族中和在耶路撒冷所过的生活——所有犹太人都知道。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “生活方式”也可译作“生活”“为人”或“生活行事”。原文所指不只是人的生存，而是其生活表现或人生历程。
    reason: lexical_alternative
lexical_decisions:
- source_word: βίωσίν
  choice: 所过的生活
  rationale: βίωσις指人的生活方式或人生历程，不只是生命的存在；结合γενομένην译为“所过的生活”，现代汉语自然且保留原义。
- source_word: ἐκ νεότητος
  choice: 从年轻时起
  rationale: 准确表达时间起点，也自然承接第一人称语境。
- source_word: ἀπ’ ἀρχῆς
  choice: 从起初
  rationale: 保留原文对时间范围的进一步强调，不与“从年轻时起”合并。
- source_word: γενομένην
  choice: 所过的
  rationale: 该分词修饰βίωσιν，说明这段生活历程是在特定环境中度过；汉语用“所过的生活”比直译“发生的生活”自然。
- source_word: ἐν τῷ ἔθνει μου
  choice: 在本民族中
  rationale: ἔθνος在此指保罗所属的族群，并非现代民族国家；“本民族”保留族群归属。
- source_word: ἔν τε Ἱεροσολύμοις
  choice: 也在耶路撒冷
  rationale: 用“也”体现τε与前一地点短语的并列、附加关系。
- source_word: ἴσασι
  choice: 都知道
  rationale: οἶδα的完成时形式在此具有现在状态意义，译作“知道”最贴切。
- source_word: πάντες Ἰουδαῖοι
  choice: 所有犹太人
  rationale: 直接保留原文的全称表达和族群称谓，不擅自缩小其修辞范围。
- source_word: μὲν οὖν
  choice: 所以
  rationale: 该组合承接上文并推进申辩；“所以”简洁自然，避免生硬地逐字翻译两个语气词。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。为保留希腊文两个时间短语的层次，同时避免汉语关系从句过长，将宾语提前展开；“怎样为人”帮助读者把握βίωσις的生活方式含义，而“所过的生活”保留人生历程的侧面。脚注标记置于整句之后。
