id: ACT.12.24
reference: Acts 12:24
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ὁ δὲ λόγος τοῦ ⸀θεοῦ ηὔξανεν καὶ ἐπληθύνετο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/024.yaml
  text: But the word of God continued to grow and multiply[a].
translation:
  language: zh_hans
  text: 然而，神的道不断增长，越发广传[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “越发广传”也可译为“不断增多”；“神的道”也可译为“神的信息”。
    reason: 保留 ἐπληθύνετο 的形式对应及 λόγος 的词义替代。
lexical_decisions:
- source_word: λόγος
  choice: 道
  rationale: 采用路加著作中常见且为中文圣经读者熟悉的“神的道”，既保留“话语”的圣经表达，也涵盖所宣讲的信息；脚注说明可译为“信息”。
- source_word: τοῦ θεοῦ
  choice: 神的
  rationale: 按属格自然译出，表示这道属于神或出于神。
- source_word: ηὔξανεν
  choice: 不断增长
  rationale: 未完成时表达持续发展的过程；“不断”体现其延续性，“增长”保留原动词意象。
- source_word: ἐπληθύνετο
  choice: 越发广传
  rationale: 该动词为未完成时的被动形式，字面可作“不断增多”。在此以“越发广传”自然表达神的道传播范围持续扩大，同时避免与前一动词都译成泛泛的“增长”。
- source_word: δὲ
  choice: 然而
  rationale: 承接希律之死的上文，标明对比：掌权者虽敌挡并死亡，神的道却继续发展。
theological_decisions:
- issue: λόγος τοῦ θεοῦ 应译为“神的道”还是较动态的“神的信息”
  choice: 神的道
  alternative: 神的信息
  rationale: “神的道”保留路加反复使用的表达及其广阔的宣讲和圣经共鸣，不把 λόγος 限缩为单纯的信息内容；脚注保留较直白的现代汉语替代译法。
- issue: ἐπληθύνετο 所指的是“道”本身增多，还是信徒人数增加或传播扩展
  choice: 越发广传
  alternative: 不断增多
  rationale: 语法主语仍是“神的道”，不宜直接改成“信徒人数”；“广传”表达语境中的传播扩展，但脚注保留形式更贴近被动动词的译法，以免消除原文的拟人化张力。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“然而”凸显与上文希律结局的对比；成对表达“不断增长，越发广传”力求保留两个未完成时动词所呈现的持续进展，同时避免生硬的“增长并被增多”。
