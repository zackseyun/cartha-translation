  text: Ἦν ⸀δὲ θυμομαχῶν Τυρίοις καὶ Σιδωνίοις· ὁμοθυμαδὸν δὲ παρῆσαν πρὸς αὐτόν, καὶ πείσαντες Βλάστον τὸν ἐπὶ τοῦ κοιτῶνος τοῦ βασιλέως ᾐτοῦντο εἰρήνην διὰ τὸ τρέφεσθαι αὐτῶν τὴν χώραν ἀπὸ τῆς βασιλικῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/020.yaml
  text: He was very angry with the Tyrians and Sidonians[a]. But they came to him with one accord, and after persuading Blastus, the king’s chamberlain, they were asking for peace[d][c][b], because their country was fed from the king’s domain.
translation:
  language: zh_hans
  text: 希律对推罗和西顿的人十分恼怒[a]。他们却同心前来见他，先说服王寝宫的主管官员伯拉斯都[b]，然后请求讲和；因为他们的地区要从王的领地获得粮食供应[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“与推罗和西顿的人处于严重敌对状态。”原文用词可表示强烈的愤怒或敌意。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“掌管王寝宫的人”，可能是一位能够出入王私人居所的宫廷官员。
    reason: cultural_note
  - marker: c
    text: 或译：“因为他们的地区靠王的领土供应食物。”
    reason: lexical_alternative
lexical_decisions:
- source_word: θυμομαχῶν
  choice: 十分恼怒
  rationale: 该词表示强烈的愤怒或敌对状态；“十分恼怒”自然地传达其强度，同时不把含义过度限定为公开交战。
- source_word: Τυρίοις καὶ Σιδωνίοις
  choice: 推罗和西顿的人
  rationale: 两个与格复数指这两座城的居民；用“……的人”比音译族称更符合现代汉语习惯。
- source_word: ὁμοθυμαδόν
  choice: 同心
  rationale: 表达众人怀着一致的意向，不仅表示一同前来。
- source_word: παρῆσαν πρὸς αὐτόν
  choice: 前来见他
  rationale: 既表达来到希律那里，也符合前来求见统治者的语境。
- source_word: πείσαντες
  choice: 说服了
  rationale: 不添加原文未明说的贿赂或收买含义，并体现此事先于请求和解。
- source_word: Βλάστον
  choice: 伯拉斯都
  rationale: 按现代中文圣经人名音译习惯处理该专名。
- source_word: τὸν ἐπὶ τοῦ κοιτῶνος τοῦ βασιλέως
  choice: 王的内侍
  rationale: 指负责王私人寝宫、能够接近王的宫廷官员；正文采用简洁自然的职衔，脚注保留字面背景。
- source_word: ᾐτοῦντο εἰρήνην
  choice: 请求和解
  rationale: 在希律与两城处于敌对状态的外交语境中，εἰρήνη指恢复和平关系；“请求和解”较自然，也保留对方主动求和的意味。
- source_word: διὰ τὸ τρέφεσθαι
  choice: 因为……要……获得粮食供应
  rationale: διά加冠词化不定式说明求和的原因；被动态在此表示粮食供给上的依赖。
- source_word: αὐτῶν τὴν χώραν
  choice: 他们的地区
  rationale: χώρα可指地域、地区或领土；此处用“地区”避免把推罗和西顿不必要地界定为现代意义的国家。
- source_word: ἀπὸ τῆς βασιλικῆς
  choice: 从王的领地
  rationale: 阴性形容词实词化，省略的中心词很可能是“地区/领土”；“王的领地”清楚表达属于王管辖的供粮区域。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“希律”由上文明确所指补出，以避免汉语句首单用“他”造成指代不清；“却”承接两个δέ所形成的转折推进。脚注标记均放在相关词语之后。
