  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: διελθόντες δὲ πρώτην φυλακὴν καὶ δευτέραν ἦλθαν ἐπὶ τὴν πύλην τὴν σιδηρᾶν τὴν φέρουσαν εἰς τὴν πόλιν, ἥτις αὐτομάτη ἠνοίγη αὐτοῖς, καὶ ἐξελθόντες προῆλθον ῥύμην μίαν, καὶ εὐθέως ἀπέστη ὁ ἄγγελος ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/010.yaml
  text: After they had passed the first guard and the second[a], they came to the iron gate leading into the city, which opened to them by itself; and after they went out, they went along one street[b], and immediately the angel departed from him.
translation:
  language: zh_hans
  text: 他们经过第一道和第二道岗哨，来到通往城里的铁门前；门自行向他们开了[a]。他们出去后，往前走过一条街[b]，天使随即离开了彼得。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “自行”也可译作“自己开了”或“自行打开”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“往前走了一条街”，可能指他们沿一条街前行，也可能强调走完一条街的距离。
    reason: translation_ambiguity
lexical_decisions:
- source_word: διελθόντες
  choice: 经过
  rationale: 不定过去时分词表示先于主要动词发生的动作；“经过”在中文叙事中自然地交代先后次序。
- source_word: φυλακὴν
  choice: 岗哨
  rationale: 本处与“第一道、第二道”连用，语境指彼得逃离监牢时依次通过的警戒岗位，而不是“监禁”这一抽象状态。
- source_word: ἦλθαν ἐπὶ
  choice: 来到……前
  rationale: 准确表达他们抵达铁门所在之处，也符合现代汉语的空间表达。
- source_word: πύλην τὴν σιδηρᾶν
  choice: 铁门
  rationale: 直接保留门的材质，表达简洁自然。
- source_word: τὴν φέρουσαν εἰς τὴν πόλιν
  choice: 通往城里的
  rationale: 分词在此说明这道门所通向的地方；“通往城里”比逐字译作“带进城里”自然。
- source_word: αὐτομάτη
  choice: 自行
  rationale: 表示门没有人手操作便打开；“自行”既保留事件的异常性，又避免“自动”可能带来的现代机械装置联想。
- source_word: ἠνοίγη αὐτοῖς
  choice: 向他们开了
  rationale: 保留被动形式所描写的结果及与格所表达的受益对象；中文采用门作主语更自然。
- source_word: ἐξελθόντες
  choice: 出去后
  rationale: 不定过去时分词表示下一项先完成的动作，用时间结构清楚呈现叙事顺序。
- source_word: προῆλθον
  choice: 往前走过
  rationale: 表达从门口继续向前行进，并与表示路程范围的“走过一条街”自然搭配。
- source_word: ῥύμην μίαν
  choice: 一条街
  rationale: ῥύμη可指街或巷；结合μίαν及移动动词，此处很可能表示走完一条街的距离，同时保留其字面意象。
- source_word: εὐθέως
  choice: 随即
  rationale: 准确表达紧接着发生，且适合庄重而流畅的叙事语体。
- source_word: ἀπέστη ὁ ἄγγελος ἀπ’ αὐτοῦ
  choice: 天使随即离开了彼得
  rationale: 中文明确以“彼得”承接上文的代词所指，避免连续使用“他”造成指代混淆，没有增加原文之外的人物。
theological_decisions:
- issue: 铁门开启的性质
  choice: 门竟自行向他们开了
  alternative: 门自动为他们开了／门自己向他们开了
  rationale: 原文αὐτομάτη强调门无人操作而开启，却没有说明开启机制；译文保留神奇事件本身，不引入现代自动门的机械含义。“竟”传达叙事中的非寻常性，但不另加事件原因。
- issue: φυλακή在本节所指
  choice: 第一道和第二道岗哨
  alternative: 第一班和第二班守卫／第一处和第二处警戒
  rationale: 上下文描写越过连续的警戒点，“岗哨”最符合空间移动场景；不译为“第一座、第二座监牢”，以免制造原文没有的多重监狱。
- issue: ῥύμην μίαν所表达的范围
  choice: 往前走过一条街
  alternative: 沿着一条街往前走／往前走了一条街的距离
  rationale: 该宾格可表示行进的范围或距离。正文采用自然的中文表达，并以脚注保留“沿街行走”和“走完一条街距离”之间的细微开放性。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“第一道和第二道岗哨”明确呈现连续警戒点；“通往城里”符合现代汉语习惯；末句以“彼得”明确代词所指。脚注标记均置于相关正文之后。
