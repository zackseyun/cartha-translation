  text: ⸂ἰδὼν δὲ⸃ ὅτι ἀρεστόν ἐστιν τοῖς Ἰουδαίοις προσέθετο συλλαβεῖν καὶ Πέτρον (ἦσαν ⸀δὲ ἡμέραι τῶν ἀζύμων),
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/003.yaml
  text: And when he saw that it was pleasing to the Jews[a], he proceeded to arrest Peter also[b]. (Now these were the days of Unleavened Bread.)
translation:
  language: zh_hans
  text: 他见这事使犹太人[a]满意，就又去逮捕彼得。（那时正是除酵节期间。[b]）
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“犹太地区的人”；按语境也可能特指“犹太人的领袖”。原文在这里直译为“犹太人”。
    reason: lexical_alternative
  - marker: b
    text: 指逾越节之后以吃无酵饼为标志的节期。
    reason: cultural_note
lexical_decisions:
- source_word: ἰδὼν δὲ
  choice: 他见
  rationale: 将不定过去时分词按时间背景理解，表示希律先看见群众的反应，随后采取行动；中文以“他见”自然承接上文。
- source_word: ἀρεστόν ἐστιν
  choice: 这事使……满意
  rationale: 保留ἀρεστόν“令人喜悦、合意”的含义，并以现代汉语自然表达其非人称结构；“这事”回指上一节杀害雅各一事。
- source_word: τοῖς Ἰουδαίοις
  choice: 犹太人
  rationale: 原文使用宽泛的族群—宗教称谓，并未明说仅指领袖或犹太地区居民，因此正文不作缩窄。
- source_word: προσέθετο συλλαβεῖν
  choice: 就又下手逮捕
  rationale: προστίθημι接不定式表示进一步、接着做某事；“又”体现追加行动，“下手逮捕”清楚表达司法性拘捕。
- source_word: καὶ Πέτρον
  choice: 彼得
  rationale: καί的追加意义已由“又”体现，表明彼得继雅各之后也成为目标，避免中文重复使用“也”。
- source_word: ἦσαν δὲ ἡμέραι τῶν ἀζύμων
  choice: 那时正是除酵节期间
  rationale: 保留ἄζυμα所指的除酵节，不将其泛化为逾越节；“期间”自然传达复数ἡμέραι所指的节期日子。
theological_decisions:
- issue: 使徒行传中Ἰουδαίοις的指称范围
  choice: 犹太人
  alternative: 犹太地区的人；犹太人的领袖
  rationale: 本节原文没有明确把所指限于某一地域群体或领袖阶层，因此正文保留其宽泛表述，并用脚注提示语境上可能的理解，避免把敌意归于无差别的所有犹太人。
- issue: τῶν ἀζύμων的节期名称
  choice: 除酵节
  alternative: 逾越节
  rationale: 原文明确说“除酵的日子”，与逾越节密切相关但并非直接使用“逾越节”一词，故保留较准确的节期名称。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“满意”比“喜悦”更贴近此处对希律政治行动表示赞同的语境；括号保留原文的补充说明性质。
