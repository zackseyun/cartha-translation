  text: Γενομένης δὲ ἡμέρας ἦν τάραχος οὐκ ὀλίγος ἐν τοῖς στρατιώταις, τί ἄρα ὁ Πέτρος ἐγένετο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/018.yaml
  text: When day came[a], there was no small disturbance among the soldiers over what had become of Peter.
translation:
  language: zh_hans
  text: 天一亮，士兵中就起了不小的骚动，不知道彼得究竟怎么了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Γενομένης δὲ ἡμέρας
  choice: 天一亮
  rationale: 这是属格独立结构，表示时间；δέ兼有叙事推进作用。“天一亮”自然、简洁地表达“到了白天/天亮以后”，无需另加“现在”。
- source_word: τάραχος οὐκ ὀλίγος
  choice: 起了不小的骚动
  rationale: 保留οὐκ ὀλίγος的曲言强调，即“不小”实指相当大的程度，同时符合现代汉语表达。
- source_word: ἐν τοῖς στρατιώταις
  choice: 士兵中
  rationale: στρατιώταις直指士兵；ἐν在此表示骚动发生于这一群体之中。上下文虽说明他们承担守卫职责，但不宜把词义缩窄为“守卫”。
- source_word: τί ἄρα
  choice: 不知道……究竟
  rationale: 引出间接疑问，并带有推测、困惑的语气；“究竟”传达ἄρα在此处的疑惑意味，“不知道”使汉语句法自然。
- source_word: ὁ Πέτρος
  choice: 彼得
  rationale: 采用现代中文圣经人名的通行译名。
- source_word: ἐγένετο
  choice: 怎么了
  rationale: 在τί……ἐγένετο这一涉及人物的习语中，意思是“发生了什么事/下落如何”。“彼得究竟怎么了”保留疑问的开放性，不具体断定其遭遇。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“不小的骚动”保留原文曲言修辞；句末以“不知道彼得究竟怎么了”自然呈现士兵对彼得下落或遭遇的困惑。原文不存在需要以脚注保留的重大文本或释义分歧。
