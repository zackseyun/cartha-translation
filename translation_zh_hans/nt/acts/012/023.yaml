base_translation:
  language: en
  yaml_path: translation/nt/acts/012/023.yaml
  text: Immediately an angel of the Lord struck him[a], because he did not give the glory to God, and becoming worm-eaten[c][b], he died.
translation:
  language: zh_hans
  text: 一位主的天使立刻击打了他，因为他没有把荣耀归给上帝；他被虫所食，随后死了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραχρῆμα
  choice: 立刻
  rationale: 表达事情毫无延迟地发生，保留审判突然而至的意味。
- source_word: ἐπάταξεν
  choice: 击打
  rationale: 直接对应“击打、打击”，不译作“击杀”，以免提前把后文明确陈述的死亡结果并入此词。
- source_word: ἄγγελος κυρίου
  choice: 主的一位天使
  rationale: 希腊文名词无冠词；此译自然表达非特指，同时保留“主”这一称号。
- source_word: ἀνθ’ ὧν
  choice: 因为
  rationale: 该短语在这里引出受审判的原因；“因为”是清楚自然的现代汉语。
- source_word: οὐκ ἔδωκεν τὴν δόξαν τῷ θεῷ
  choice: 没有把荣耀归给上帝
  rationale: 表达他未将本应属于上帝的尊荣归给上帝，也符合现代汉语宗教语境中的自然说法。
- source_word: γενόμενος σκωληκόβρωτος
  choice: 被虫咬噬
  rationale: σκωληκόβρωτος意为被虫吃或咬噬；汉语改用被动谓语，既保留生动形象，也避免生硬直译“成为虫吃的”。
- source_word: ἐξέψυξεν
  choice: 断了气
  rationale: 该动词字面含呼出生命气息、断气之意；“断了气”既自然又比笼统的“死了”更贴近原词形象。
theological_decisions:
- issue: 所述审判的性质与时间进程
  choice: 译文明确呈现主的天使施行击打，并说明原因是希律没有把荣耀归给上帝；随后保留“被虫咬噬—断气”的叙述次序。
  alternative: 将全句处理为纯自然死亡，或译成天使当场将他击杀。
  rationale: 经文明说天使击打及其审判原因，但分词结构和末尾动词没有提供足够依据来断定精确的医学机制或击打与死亡之间的时间间隔，因此不作额外解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“主的一位天使”避免将无冠词结构过度特指；“被虫咬噬，就断了气”保持原文鲜明而克制的叙述，不增添医学解释。
