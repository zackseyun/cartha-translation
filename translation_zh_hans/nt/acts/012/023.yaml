  to: 一位主的天使立刻击打了他，因为他没有把荣耀归给上帝；他被虫所食，随后死了。
  rationale: 修订仅调整末句的措辞与连接方式：以“被虫所食”贴近σκωληκόβρωτος，以“随后死了”保留原文叙述顺序而不规定医学机制或精确时距。补上“了”使“击打”在现代汉语中更完整自然。其余关键术语及审判归因均予保留。
