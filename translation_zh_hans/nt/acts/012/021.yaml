source:
  edition: SBLGNT
  text: τακτῇ δὲ ἡμέρᾳ ὁ Ἡρῴδης ἐνδυσάμενος ἐσθῆτα βασιλικὴν ⸀καὶ καθίσας ἐπὶ τοῦ βήματος ἐδημηγόρει πρὸς αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/021.yaml
  text: On an appointed day[a], Herod, having put on royal clothing and having sat down on the tribunal[b], was delivering a public address to them.
translation:
  language: zh_hans
  text: 到了指定的日子，希律穿上王服，坐在审判台[a]上，向他们发表演说。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “审判台”也可译作“高台”或“官座”。希腊语 βῆμα 常指官员的正式座位或升高的平台。
    reason: lexical_alternative
lexical_decisions:
- source_word: τακτῇ ... ἡμέρᾳ
  choice: 到了指定的日子
  rationale: τακτός表示预先定下或指定；“到了指定的日子”既保留时间设定，也自然承接叙事。
- source_word: ἐνδυσάμενος
  choice: 穿上
  rationale: 该不定过去时中间语态分词表示希律先为自己穿上服装；汉语用“穿上”简洁自然，并通过动作顺序体现分词关系。
- source_word: ἐσθῆτα βασιλικὴν
  choice: 王服
  rationale: ἐσθής泛指衣服或服饰，βασιλικός说明其王室身份；“王服”庄重简明，又不限定为某一种具体袍服。
- source_word: καθίσας
  choice: 坐
  rationale: 不定过去时分词表示随后就座；现代汉语按顺序并列“穿上……坐……”即可自然表达。
- source_word: ἐπὶ τοῦ βήματος
  choice: 在审判台上
  rationale: βῆμα可指官员的审判座或高台；此处“审判台”保留其正式、权威性的含义，同时不暗示当时必有审判程序。
- source_word: ἐδημηγόρει
  choice: 发表演说
  rationale: δημηγορέω指向公众讲话；未完成时描绘当时正在进行的演说，汉语叙事中的“发表演说”可自然表达该场景。
- source_word: πρὸς αὐτούς
  choice: 向他们
  rationale: πρός加宾格表示讲话所朝向的听众，“向他们”直接准确。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。将两个希腊语分词按汉语习惯处理为连续动作，不作生硬的“……之后”结构；保留 βῆμα 在正式官座与高台之间的词义空间。英文咨询层中脚注[a]与“指定的日子”并不相符，显然误置，因此未沿用；仅为 βῆμα 设置脚注并在正文标出。
