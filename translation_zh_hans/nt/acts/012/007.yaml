  text: καὶ ἰδοὺ ἄγγελος κυρίου ἐπέστη, καὶ φῶς ἔλαμψεν ἐν τῷ οἰκήματι· πατάξας δὲ τὴν πλευρὰν τοῦ Πέτρου ἤγειρεν αὐτὸν λέγων· Ἀνάστα ἐν τάχει· καὶ ἐξέπεσαν αὐτοῦ αἱ ἁλύσεις ἐκ τῶν χειρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/007.yaml
  text: And behold[a], an angel of the Lord stood near, and a light shone in the cell. Striking Peter on the side, he woke him, saying[b], “Get up quickly.” And his chains fell off from his hands.
translation:
  language: zh_hans
  text: 看哪[a]，主的一位天使站在彼得身旁，牢房[b]里有光照耀。他拍了一下彼得的肋旁，叫醒他，说：“快起来！”他的锁链就从双手上脱落了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译为“忽然”。原文是引人注意的提示语；后面的动词也可带出天使突然来到或显现的意味。
    reason: lexical_alternative
  - marker: b
    text: 原文也可译作“房间”或“屋子”；这里按监狱的上下文译作“牢房”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: 忽然
  rationale: 在此叙事场景中，这一提示语既引人注意，也引出天使突然而至；译作“忽然”比“看哪”更符合现代汉语叙事，同时保留突发感。
- source_word: ἄγγελος κυρίου
  choice: 主的一位天使
  rationale: 保留无定性和属格关系，表达这位天使属于或奉差于主，不额外限定其身份。
- source_word: ἐπέστη
  choice: 站在旁边
  rationale: 体现天使来到近旁并站立的空间意义；其可能含有突然出现的意味，已由“忽然”协同表达。
- source_word: φῶς ἔλαμψεν
  choice: 有光照耀
  rationale: 自然表达光在室内发亮，保留原文对“光”的非特指表述。
- source_word: ἐν τῷ οἰκήματι
  choice: 牢房里
  rationale: οἴκημα本义较宽，可指房间或住处；上下文明确是监狱环境，故正文采用自然的“牢房”。
- source_word: πατάξας ... τὴν πλευρὰν
  choice: 拍了拍彼得的肋旁
  rationale: πατάσσω可表示击打；在唤醒人的语境中，“拍了拍”自然地表达有力的身体接触，而“肋旁”保留πλευρά所指的身体侧部。
- source_word: ἤγειρεν αὐτόν
  choice: 把他叫醒
  rationale: 这里彼得正在睡觉，ἐγείρω在语境中指唤醒；“叫醒”是清楚自然的现代汉语。
- source_word: Ἀνάστα ἐν τάχει
  choice: 快起来
  rationale: 简洁保留命令的紧迫性，符合现代汉语直接引语。
- source_word: ἐξέπεσαν ... αἱ ἁλύσεις
  choice: 锁链……脱落下来
  rationale: 表达锁链自行从手上掉落的突发动作，不添加动作主体。
- source_word: ἐκ τῶν χειρῶν
  choice: 从他的双手上
  rationale: 按χείρ直译为“手”，不擅自具体化为“手腕”；“双手”适合复数形式和锁链束缚的场景。
theological_decisions:
- issue: ἄγγελος κυρίου中κύριος的译法
  choice: 主
  alternative: 主人
  rationale: “主”是新约语境中κύριος的标准、庄重译法；此处不加入原文未明说的进一步神学限定。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“忽然”避免“看哪”的古雅感；“主的一位天使”保留原文无定表达；“肋旁”较准确地保留身体侧部含义。所有脚注标记均置于正文中，其中[b]放在句末以说明本节较早出现的“牢房”。
