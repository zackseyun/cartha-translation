  yaml_path: translation/nt/acts/012/016.yaml
  text: But Peter kept on knocking[a], and when they opened the door[b], they saw him and were astonished.
translation:
  language: zh_hans
  text: 可是彼得仍不停地敲门[a]。他们开了门[b]，看见他，就大为惊讶。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“继续敲门”或“坚持敲门”。
    reason: lexical_alternative
  - marker: b
    text: 直译：“打开后，他们看见他，就大为惊讶。”原文没有明说打开的是门。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέμενεν
  choice: 仍不停地
  rationale: 未完成时表达持续或反复进行的动作；“仍不停地”既承接前文，也自然传达彼得继续敲门的情形。
- source_word: κρούων
  choice: 敲门
  rationale: κρούω 在此语境中指敲门；与 ἐπέμενεν 合译为“仍不停地敲门”，符合现代汉语叙事习惯。
- source_word: ἀνοίξαντες
  choice: 他们开了门
  rationale: 不定过去时分词在此表示先于看见彼得的动作。原文只说“打开”，宾语“门”由上下文补出，使中文表达完整自然。
- source_word: εἶδαν αὐτόν
  choice: 看见是他
  rationale: 直译为“看见他”亦可；结合众人先前不信罗大的报告，中文“看见是他”自然凸显他们认出门外的人确是彼得，但不增加新的事件内容。
- source_word: ἐξέστησαν
  choice: 大为惊讶
  rationale: 该词在此表示强烈的震惊或惊奇；“大为惊讶”保留其强度，同时适合庄重而通俗的现代汉语。
- source_word: δὲ
  choice: 可是；随后不另译
  rationale: 首个 δέ 与前文众人的反应形成转折，译作“可是”；第二个 δέ 主要推进叙事，以分句衔接自然体现。
- source_word: Πέτρος
  choice: 彼得
  rationale: 采用现代中文圣经传统中通行的人名译法。
