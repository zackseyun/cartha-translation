  text: Βαρναβᾶς δὲ καὶ Σαῦλος ὑπέστρεψαν, ⸀εἰς Ἰερουσαλὴμ πληρώσαντες τὴν διακονίαν, ⸀συμπαραλαβόντες Ἰωάννην τὸν ἐπικληθέντα Μᾶρκον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/025.yaml
  text: But Barnabas and Saul returned to Jerusalem after completing the ministry, taking along John, who was called Mark.
translation:
  language: zh_hans
  text: 巴拿巴和扫罗完成了这项服事后，就回到耶路撒冷[a]，并带着名叫马可的约翰同行。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“从耶路撒冷回来”，而不是“回到耶路撒冷”。
    reason: textual_variant
lexical_decisions:
- source_word: ὑπέστρεψαν
  choice: 回到
  rationale: 该动词意为“返回、回去”；与方向短语连用时，译作“回到”自然简洁。
- source_word: εἰς Ἰερουσαλήμ
  choice: 到耶路撒冷
  rationale: 所提供的SBLGNT正文采用εἰς，通常表示趋向，故译为“到耶路撒冷”；异文“从耶路撒冷”另见脚注。
- source_word: πληρώσαντες τὴν διακονίαν
  choice: 完成了这项服事
  rationale: πληρόω在此表示完成，διακονία表示服事或职事。“这项服事”既承接上文所指派的援助工作，又不把正文过度具体化为“赈灾任务”。
- source_word: συμπαραλαβόντες
  choice: 并带着……同行
  rationale: 该复合分词表示把某人一同带上；此译法符合现代汉语叙事表达，并保留伴随动作。
- source_word: Ἰωάννην τὸν ἐπικληθέντα Μᾶρκον
  choice: 那称为马可的约翰
  rationale: ἐπικληθέντα表示“被称作、被叫作”；这一译法明确约翰也以马可这个名字为人所知，而未额外加入原文没有明说的关系。
theological_decisions:
- issue: 耶路撒冷是返回的目的地还是出发地
  choice: 回到耶路撒冷
  alternative: 从耶路撒冷回来
  rationale: 依照所指定的SBLGNT正文εἰς Ἰερουσαλήμ直译为“到耶路撒冷”。部分抄本作ἐξ Ἰερουσαλήμ，且与叙事上下文衔接较为直观；因该异文实质影响句义，保留在脚注中，不在正文中擅自调和。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语体。“服事”保留διακονία较宽泛的含义；语序将完成服事置于返回之前，以自然表达希腊语分词所表示的先行动作。
