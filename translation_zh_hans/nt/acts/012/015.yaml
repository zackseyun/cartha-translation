id: ACT.12.15
reference: Acts 12:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οἱ δὲ πρὸς αὐτὴν εἶπαν· Μαίνῃ. ἡ δὲ διϊσχυρίζετο οὕτως ἔχειν. οἱ δὲ ἔλεγον· Ὁ ἄγγελός ⸂ἐστιν αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/015.yaml
  text: But they said to her[a], “You are out of your mind.” But she kept insisting that it was so. And they kept saying, “It is his angel.”
translation:
  language: zh_hans
  text: 他们却对她说：“你疯了！”她仍坚持说确实是这样。他们却一再说：“那是他的天使[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或可理解为“他的守护天使”或“代表他的天使”；也有解释为“他的灵”或“他的鬼魂”。希腊原文只说“他的天使”。
    reason: 保留原文措辞的含混性，避免在正文中确定其具体神学含义。
lexical_decisions:
- source_word: Μαίνῃ
  choice: 你疯了
  rationale: 这是对对方神志失常的直接断言。“你疯了”在现代汉语中自然有力，也避免采用过于临床化的“你精神失常了”。
- source_word: διϊσχυρίζετο
  choice: 仍坚持说
  rationale: 未完成时与该动词的加强语气共同表达持续而坚决的申辩；“仍坚持说”兼顾了持续性和上下文中的反驳意味。
- source_word: οὕτως ἔχειν
  choice: 确实是这样
  rationale: 这一习语意为事情正是如此；“确实是这样”自然地传达她坚持自己的判断为真的意思。
- source_word: ἔλεγον
  choice: 一再说
  rationale: 未完成时在此适合表达持续或反复说话；“一再说”清楚呈现众人的反复坚持。
- source_word: ἄγγελός
  choice: 天使
  rationale: 在此语境中更可能指与彼得有关的超自然使者；“天使”是标准译法，同时不进一步界定其具体身份或功能。
- source_word: αὐτοῦ
  choice: 他的
  rationale: 属格代词在“他的天使”中自然译为领属结构，所指为彼得。
theological_decisions:
- issue: “他的天使”的含义
  choice: 正文直译为“他的天使”
  alternative: 他的守护天使；代表他的天使；他的灵或鬼魂
  rationale: 希腊文本只说“他的天使”，没有解释说话者所持观念的具体内容。正文不替读者选定某种天使论或灵魂观，而把可能解释留在脚注中。
translation_notes:
  register: 采用现代、自然而庄重的叙事语言。“你疯了”保留原话的直接力度；“仍坚持说”和“一再说”体现两个未完成时的持续或反复意味。脚注标记[a]已置于正文相应短语之后。
