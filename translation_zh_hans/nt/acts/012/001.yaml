  text: Κατ’ ἐκεῖνον δὲ τὸν καιρὸν ἐπέβαλεν Ἡρῴδης ὁ βασιλεὺς τὰς χεῖρας κακῶσαί τινας τῶν ἀπὸ τῆς ἐκκλησίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/001.yaml
  text: About that time Herod the king laid hands on some from the church to mistreat them[a][b][c].
translation:
  language: zh_hans
  text: 大约在那时[a]，希律王向教会中的一些人下手[b]，要虐待他们[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那时”或“约在那时”。
    reason: lexical_alternative
  - marker: b
    text: 直译：“把手加在……身上”。这里指向教会中的一些人采取敌对行动。
    reason: lexical_alternative
  - marker: c
    text: 或译：“伤害他们”或“苦害他们”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατ’ ἐκεῖνον δὲ τὸν καιρόν
  choice: 大约就在那时
  rationale: κατά加时间宾语在这里表示“大约在……时候”；“就在那时”自然承接叙事，δέ的轻微转折或推进作用不另行硬译。
- source_word: ἐπέβαλεν ... τὰς χεῖρας
  choice: 向……下手
  rationale: 原文直译为“把手加在……身上”，在语境中表示采取敌对行动。“下手”既保留身体动作的意象，也不把含义缩窄为单纯“逮捕”。
- source_word: Ἡρῴδης ὁ βασιλεύς
  choice: 希律王
  rationale: 以现代汉语惯用称谓表达希腊文“希律，那王”，简洁自然。
- source_word: κακῶσαί
  choice: 要苦害他们
  rationale: 不定式表明下手的目的；“苦害”涵盖使人受苦和遭受恶待，不强行赋予“逼迫”一词可能带有的较专门宗教含义。
- source_word: τινας τῶν ἀπὸ τῆς ἐκκλησίας
  choice: 教会中的一些人
  rationale: 该短语指属于或来自基督徒群体的若干人；“教会中的一些人”符合现代汉语表达，并清楚呈现部分关系。
theological_decisions:
- issue: ἐκκλησία的译法
  choice: 教会
  alternative: 会众；集会
  rationale: 在《使徒行传》的这一语境中，该词指基督徒群体。“教会”是现代汉语中通行且明确的表达；“会众”也可表达群体性质，但此处没有必要偏离通用译名。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“大约就在那时”保留时间范围的近似性；“下手”保存原文习语的形象和敌意，又由后面的目的语“要苦害他们”明确其负面含义。所有脚注标记均置于相应正文词语之后。
