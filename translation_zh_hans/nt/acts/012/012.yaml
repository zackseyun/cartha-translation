revisions:
- from: 他明白过来，就到马利亚家去。马利亚是约翰的母亲；这约翰称为马可[a]。当时有许多人聚集在那里，正在祷告。
  to: 他明白过来后，就到了马利亚的家；马利亚是约翰的母亲，约翰称为马可[a]。那里有许多人聚集，正在祷告。
  rationale: 修订仅改善现代汉语的叙述流畅度，并更清晰呈现原文对约翰身份的限定和众人已聚集、正在祷告的状态。未增添神学解释，也未消除“称为马可”是否应译作“又称”的语义余地。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T03:29:38Z'
review_pass:
  verdict: revise
  source_fidelity: 译文准确传达彼得恢复清醒后的行动、马利亚与约翰（马可）的关系，以及众人聚集祷告的情景。为更贴合συνηθροισμένοι与ἦσαν所表示的既已聚集、仍在该处的状态，并使叙述更自然，建议微调语序和措辞。
  naturalness: “到马利亚家去”与“这约翰称为马可”虽可理解，但前者略口语且“去”与“到”并用稍显不顺，后者的指示词“这”稍显生硬。改为“到了马利亚的家”和“约翰称为马可”更符合现代庄重书面汉语。
  terminology: “马利亚”“约翰”“马可”“祷告”均为恰当且通行的中文圣经用语。保留“称为马可”，并以脚注说明“又称”为可选表达，未把“又/也”当作原文的必然含义。
  issues:
  - severity: low
    issue: “到马利亚家去”的动作表达略有冗余。
    rationale: ἦλθεν ἐπὶ τὴν οἰκίαν表示到达/前往该住所；“到了马利亚的家”在汉语叙事中更顺畅，也不改变动作方向。
  - severity: low
    issue: “这约翰称为马可”中的“这”略显生硬。
    rationale: 原文以属格短语继续限定约翰，并无需在汉语中使用带指示性的“这”。改作“约翰称为马可”即可清楚保留同位识别关系。
  - severity: low
    issue: “聚集在那里”可更明确地表达已聚集而仍在场的状态。
    rationale: ἦσαν συνηθροισμένοι是迂回式完成分词，表示人已经聚集在该处；“有许多人聚集在那里，正在祷告”自然保留该状态及祷告的持续性。
