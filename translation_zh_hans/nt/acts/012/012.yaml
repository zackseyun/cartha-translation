  text: Συνιδών τε ἦλθεν ἐπὶ τὴν οἰκίαν ⸀τῆς Μαρίας τῆς μητρὸς Ἰωάννου τοῦ ἐπικαλουμένου Μάρκου, οὗ ἦσαν ἱκανοὶ συνηθροισμένοι καὶ προσευχόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/012.yaml
  text: And when he realized this[a], he went to the house of Mary, the mother of John who was called Mark, where many had gathered together and were praying.
translation:
  language: zh_hans
  text: 他明白过来后，就到了马利亚的家；马利亚是约翰的母亲，约翰称为马可[a]。那里有许多人聚集，正在祷告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“约翰又称马可。”希腊文以另一个名字识别约翰，但并不要求译出“又”或“也”。
    reason: 词义译法
lexical_decisions:
- source_word: Συνιδών
  choice: 他明白过来
  rationale: 该不定过去时分词在上下文中表示彼得在天使离开后完全意识到自己的处境。“明白过来”自然地表达由未明白到明白的变化；宾语由上文补足，不在正文中强行限定。
- source_word: τε
  choice: 就
  rationale: τέ是轻微的叙事连接词；结合分词结构，以“就”自然衔接明白后的行动，不作过度强调。
- source_word: ἦλθεν ἐπὶ τὴν οἰκίαν
  choice: 到……家去
  rationale: 表示朝某处移动；“到……家去”符合现代汉语叙事视角，也明确οἰκία在此指居所。
- source_word: τῆς Μαρίας
  choice: 马利亚
  rationale: 采用现代中文圣经语境中通行的人名音译。
- source_word: τῆς μητρὸς Ἰωάννου
  choice: 马利亚是约翰的母亲
  rationale: 明确保留属格所表达的亲属关系，并拆句以避免多层定语造成歧义。
- source_word: τοῦ ἐπικαλουμένου Μάρκου
  choice: 这约翰称为马可
  rationale: ἐπικαλέω的被动分词以另一个名字识别约翰。“称为马可”不额外加入原文未明确表达的“又”或“也”。
- source_word: οὗ
  choice: 在那里
  rationale: 关系副词回指马利亚的家；汉语拆句后用“在那里”衔接清楚自然。
- source_word: ἱκανοὶ
  choice: 许多人
  rationale: 复数ἱκανοί表示数目可观；“许多人”简明而准确。
- source_word: συνηθροισμένοι
  choice: 聚集在那里
  rationale: 与ἦσαν构成迂回式结构，表达众人先已聚集并处于聚集状态；“当时……聚集在那里”在汉语中自然呈现这一结果状态。
- source_word: καὶ προσευχόμενοι
  choice: 正在祷告
  rationale: 现在时分词表达当时持续进行的活动；“正在”明确其进行性。
