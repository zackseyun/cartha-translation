  text: εἶπεν ⸀δὲ ὁ ἄγγελος πρὸς αὐτόν· ⸀Ζῶσαι καὶ ὑπόδησαι τὰ σανδάλιά σου· ἐποίησεν δὲ οὕτως. καὶ λέγει αὐτῷ· Περιβαλοῦ τὸ ἱμάτιόν σου καὶ ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/008.yaml
  text: And the angel said to him[a], “Tie on your belt and put on your sandals.” And he did so. And he says to him[c][b], “Put on your cloak and follow me.”
translation:
  language: zh_hans
  text: 天使对他说：“束上腰带[a]，穿上你的凉鞋。”他就照着做了。天使又对他说[b]：“披上你的外衣[c]，跟我来。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“束好衣带。”原文所说的是束腰或系紧腰带，以便行动。
    reason: lexical_alternative
  - marker: b
    text: 原文作“他说”；其中“说”使用现在时，是叙事中增强现场感的历史现在时。
    reason: lexical_alternative
  - marker: c
    text: 或译：“把你的外衣裹在身上。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελος
  choice: 天使
  rationale: 上下文所指是显现在监牢中的天上使者，因此译作“天使”比泛指的“使者”更准确自然。
- source_word: Ζῶσαι
  choice: 束上腰带
  rationale: 该中动命令式指束腰、系紧腰带以便行动；“束上腰带”既保留古代衣着动作，也能让现代读者理解。
- source_word: ὑπόδησαι τὰ σανδάλιά σου
  choice: 穿上你的凉鞋
  rationale: 该短语命令彼得把自己的凉鞋穿上；这样表达符合现代汉语习惯。
- source_word: ἐποίησεν δὲ οὕτως
  choice: 他就照着做了
  rationale: οὕτως概括彼得对前述命令的执行；“照着做了”简洁自然。
- source_word: λέγει
  choice: 又对他说
  rationale: 希腊文用历史现在时使叙事生动；现代汉语通常不以现在时形态标示这一效果，因此正文按连贯叙事处理，并用“又”衔接下一道命令，脚注保留原文时态信息。
- source_word: Περιβαλοῦ τὸ ἱμάτιόν σου
  choice: 披上你的外衣
  rationale: περιβάλλω表示把衣物披在身上，ἱμάτιον在此指外层衣服；“披上你的外衣”兼顾动作、衣物类别与汉语自然度。
- source_word: ἀκολούθει μοι
  choice: 跟我来
  rationale: 这里是要求彼得随天使离开监牢的实际行动命令；“跟我来”自然地表达跟随说话者而行，同时不添加解释。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“束上腰带”保留一世纪衣着背景；“披上你的外衣”避免把ἱμάτιον泛化为普通衣服。正文依汉语叙事习惯处理历史现在时，并在脚注中说明。
