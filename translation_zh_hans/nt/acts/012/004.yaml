source:
  edition: SBLGNT
  text: ὃν καὶ πιάσας ἔθετο εἰς φυλακήν, παραδοὺς τέσσαρσιν τετραδίοις στρατιωτῶν φυλάσσειν αὐτόν, βουλόμενος μετὰ τὸ πάσχα ἀναγαγεῖν αὐτὸν τῷ λαῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/004.yaml
  text: After arresting him[a], he put him in prison, handing him over to four squads of soldiers to guard him[b], intending to bring him out to the people after the Passover.
translation:
  language: zh_hans
  text: 希律逮捕彼得后，把他关进监牢，交给四班士兵[a]看守，打算等逾越节[b]过后，把他带到民众面前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“四个四人小组”，即四班士兵，每班四人。
    reason: 说明τετράδιον所指队组的确切人数。
  - marker: b
    text: 希腊语πάσχα意为“逾越节”；某些较早的英文译本在这里译作“复活节”。
    reason: 交代原文词义，并说明传统英文异译。
lexical_decisions:
- source_word: πιάσας
  choice: 逮捕……后
  rationale: 不定过去时分词表示先于主句动作发生的行动；“逮捕……后”自然地表达先后次序，也保留将彼得拘押起来的含义。
- source_word: ἔθετο εἰς φυλακήν
  choice: 把他关进监牢
  rationale: 这是表示监禁的惯用说法；“监牢”符合叙事语体，也比生硬的直译“放入监牢”自然。
- source_word: παραδοὺς
  choice: 交给
  rationale: 表示把彼得转交给士兵监管，简明保留了看押权移交的含义。
- source_word: τέσσαρσιν τετραδίοις στρατιωτῶν
  choice: 四班士兵
  rationale: τετράδιον指四人一组；正文用自然的“班”表达轮班守卫的队组，脚注说明每班的确切人数。
- source_word: φυλάσσειν αὐτόν
  choice: 看守
  rationale: 该不定式说明交给士兵的目的；“看守”准确而简洁。
- source_word: βουλόμενος
  choice: 打算
  rationale: 表达希律有意实施的计划，不额外强化为情绪性的愿望。
- source_word: μετὰ τὸ πάσχα
  choice: 等逾越节过后
  rationale: πάσχα在此指犹太人的逾越节；加入“等”使希律等待节期结束后行动的叙述在现代汉语中更顺畅。
- source_word: ἀναγαγεῖν αὐτὸν τῷ λαῷ
  choice: 把他带到民众面前
  rationale: 在此司法与公开处置的语境中，ἀνάγω表示把人带出并公开呈到众人面前；译文不擅自明确为审判或处决。
- source_word: λαῷ
  choice: 民众
  rationale: 指作为公共群体的百姓；“民众”在现代汉语中自然，也保留其广泛含义。
theological_decisions:
- issue: πάσχα的译法
  choice: 逾越节
  alternative: 复活节
  rationale: 希腊词πάσχα的通常词义是逾越节，本处语境也是犹太人的节期；某些较早英文译本所用的“Easter（复活节）”属于后来的翻译传统，不应取代原文的直接含义。
- issue: 带到民众面前所暗示的处置
  choice: 不明确说明是审判或处决
  alternative: 带出来公审／交给民众处死
  rationale: 上下文可能使读者想到公开审讯或处决，但本节原文本身只明确说要把彼得带到民众面前，因此保留其未明说的张力。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“希律”和“彼得”根据紧接的上下文补明代词所指，避免单节阅读时指代含混；句式保持叙事紧凑，不使用古雅或宗派化措辞。
