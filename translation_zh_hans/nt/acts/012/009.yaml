revisions:
- from: 彼得就出去，跟着他走，却不知道那借着天使发生的事是真的，还以为自己看见了异象。
  to: 彼得出来后，便跟着天使走，却不知道借着天使所发生的事是真的，反以为自己所见的是异象。
  rationale: 本次仅作安全的汉语表达调整：明确“天使”以消除代词指向的轻微负担，改善“借着天使”所在短语的语序，并以“自己所见的是异象”自然表达彼得的误认。未增加神学解释；无须设置脚注，因为正文已直接保留“借着天使”的中介性语义，且英文审计材料中的[a]锚点与其脚注讨论的短语并不一致。
