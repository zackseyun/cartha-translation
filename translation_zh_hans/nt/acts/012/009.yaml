  text: καὶ ἐξελθὼν ⸀ἠκολούθει, καὶ οὐκ ᾔδει ὅτι ἀληθές ἐστιν τὸ γινόμενον διὰ τοῦ ἀγγέλου, ἐδόκει δὲ ὅραμα βλέπειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/009.yaml
  text: And he went out and followed[a], and he did not know that what was happening through the angel was real, but thought he was seeing a vision.
translation:
  language: zh_hans
  text: 彼得出来后，便跟着天使走，却不知道借着天使所发生的事是真的，反以为自己所见的是异象。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξελθὼν
  choice: 就出去
  rationale: 不定过去时分词表示先于主要动作发生的行动；用“就出去”自然连接叙事，同时保留动作次序。
- source_word: ἠκολούθει
  choice: 跟着他走
  rationale: 未完成时描写持续跟随；“跟着他走”比单说“跟随”更符合现代汉语叙事，也由上下文明确“他”指天使。
- source_word: οὐκ ᾔδει
  choice: 却不知道
  rationale: 直接表达彼得当时并未意识到事情的真实性；“却”体现事实与其认识之间的反差。
- source_word: ἀληθές
  choice: 是真的
  rationale: 这里与“异象”形成对照，所指是事情确实发生，而非抽象意义上的真理。
- source_word: τὸ γινόμενον
  choice: 发生的事
  rationale: 实词化的现在时分词指当时正在发生的事件；汉语“发生的事”自然清楚。
- source_word: διὰ τοῦ ἀγγέλου
  choice: 借着天使
  rationale: διά加属格可表达中介性施事；“借着”保留经由天使成就此事的含义，不将其窄化为单纯工具或独立施事者。
- source_word: ἐδόκει
  choice: 还以为
  rationale: 表达彼得当时的主观判断；“还”自然带出与实际情况相反的认知。
- source_word: ὅραμα
  choice: 异象
  rationale: 这是新约中对超自然或启示性所见的常用、自然译法。
- source_word: βλέπειν
  choice: 自己看见了
  rationale: 与ἐδόκει构成彼得以为自己正在经历某种所见；中文用“自己看见了异象”自然，并明确主观体验。
theological_decisions:
- issue: 天使行动的性质
  choice: 借着天使
  alternative: 由天使所做
  rationale: 保留διά加属格所表达的中介性施事，不额外断定天使具有独立的能力或行动来源。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。补出主语“彼得”以避免中文段首指代不清；“他”依上下文指天使。经核对，英文材料所列[a]的位置与脚注内容似不相符：脚注讨论διὰ τοῦ ἀγγέλου，而非“跟着”；本译文直接以“借着天使”保留该语义，因此不设脚注。
