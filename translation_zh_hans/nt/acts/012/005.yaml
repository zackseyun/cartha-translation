  text: ὁ μὲν οὖν Πέτρος ἐτηρεῖτο ἐν τῇ φυλακῇ· προσευχὴ δὲ ἦν ⸀ἐκτενῶς γινομένη ὑπὸ τῆς ἐκκλησίας πρὸς τὸν θεὸν ⸀περὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/005.yaml
  text: So Peter was being kept in the prison[a], but earnest prayer was being made to God by the church for him.
translation:
  language: zh_hans
  text: 于是，彼得被关在监牢里；教会却为他向上帝恳切祷告。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恳切”也可译作“迫切”或“不住地”；希腊语副词可强调祷告的强烈程度或持续不懈。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐτηρεῖτο
  choice: 被关
  rationale: 未完成时被动语态表示彼得持续处于拘禁之中；“被关”在监牢语境中自然，并保留被动含义，不额外限定看守方式。
- source_word: ἐν τῇ φυλακῇ
  choice: 在监牢里
  rationale: 指彼得被拘禁的场所；“监牢”庄重、清楚，适合叙事语体。
- source_word: προσευχὴ ... ἦν ... γινομένη
  choice: 祷告
  rationale: ἦν加现在分词构成持续性表达；汉语用动词“祷告”配合上下文即可自然表达当时持续进行的行动，若机械译成“祷告正被献上”则不自然。
- source_word: ἐκτενῶς
  choice: 恳切
  rationale: 该副词可强调祷告的强烈程度或持续不懈；“恳切”在现代汉语祷告语境中自然，并保留郑重热切之意。
- source_word: ὑπὸ τῆς ἐκκλησίας
  choice: 教会
  rationale: 这里指为彼得祷告的基督徒群体；“教会”是《使徒行传》语境中通行而自然的译法，不必理解为后世制度化组织。
- source_word: πρὸς τὸν θεὸν
  choice: 向上帝
  rationale: πρός在此表示祷告所指向的对象；“向上帝祷告”是自然准确的现代汉语表达。
- source_word: περὶ αὐτοῦ
  choice: 为他
  rationale: περί加属格在代祷语境中表示为某人、关乎某人；“为他”简洁自然，并清楚传达代求含义。
- source_word: μὲν οὖν ... δὲ
  choice: 于是……却……
  rationale: 该组粒子兼具承接叙事与轻微对比作用；“于是”承接前文，“却”突出彼得受囚与教会祷告之间的对照。
theological_decisions:
- issue: ἐκκλησία的译法
  choice: 教会
  alternative: 会众／群体
  rationale: 此处指共同为彼得祷告的基督徒群体。“教会”最符合《使徒行传》的通常用语，同时不要求将其理解为某一宗派或后世组织架构。
- issue: ἐκτενῶς所表达的祷告特征
  choice: 恳切
  alternative: 迫切／不住地
  rationale: 原词可侧重强度，也可能带有坚持不懈的意味。正文采用自然且涵盖面较广的“恳切”，脚注保留“迫切”及持续性的可能，避免把词义单一化。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“被关在监牢里”保留持续拘禁的语境含义；分号与“却”清楚呈现原文的叙事承接和对比。
