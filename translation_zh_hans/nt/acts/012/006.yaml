  text: Ὅτε δὲ ἤμελλεν ⸂προαγαγεῖν αὐτὸν⸃ ὁ Ἡρῴδης, τῇ νυκτὶ ἐκείνῃ ἦν ὁ Πέτρος κοιμώμενος μεταξὺ δύο στρατιωτῶν δεδεμένος ἁλύσεσιν δυσίν, φύλακές τε πρὸ τῆς θύρας ἐτήρουν τὴν φυλακήν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/006.yaml
  text: When Herod was about to bring him out[a], on that very night Peter was sleeping between two soldiers, bound with two chains[b], and guards before the door were keeping watch over the prison.
translation:
  language: zh_hans
  text: 希律将要把彼得带出来[a]的那一夜，彼得正睡在两个士兵中间，被两条锁链锁着；门前的卫兵也在把守监牢[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“把彼得带到众人面前”。这个希腊语动词可指把人从拘押处带出，公开露面或受审。
    reason: 保留προάγω在此处关于带出、带到前面的词义范围，不替原文明确希律的具体安排。
  - marker: b
    text: 或译“在门前站岗”。这里译作“监牢”的希腊语也可指警戒或看守的职责。
    reason: 保留φυλακή可指监牢或警戒、值守的词义歧义。
lexical_decisions:
- source_word: ἤμελλεν
  choice: 将要
  rationale: 表示即将发生的行动，既自然，也保留希律行动迫近的意味。
- source_word: προαγαγεῖν αὐτόν
  choice: 把彼得带出来
  rationale: 在监禁语境中指把彼得从拘押处带出，可能是带去公开处置或审理；正文不明确补入原文未明说的目的。
- source_word: τῇ νυκτὶ ἐκείνῃ
  choice: 前一夜
  rationale: 按上下文，这是希律预定带彼得出来之前紧接着的那一夜；现代汉语用“前一夜”能清楚表达时间关系和叙事张力。
- source_word: κοιμώμενος
  choice: 正睡在
  rationale: 体现未完成的持续状态。
- source_word: μεταξὺ δύο στρατιωτῶν
  choice: 在两个士兵中间
  rationale: 准确表达彼得所处的空间位置。
- source_word: δεδεμένος ἁλύσεσιν δυσίν
  choice: 被两条锁链锁着
  rationale: 表达完成被动分词所指的持续受缚状态，并明确两条锁链这一工具。
- source_word: φύλακες πρὸ τῆς θύρας
  choice: 门前的卫兵
  rationale: 自然、准确地表达卫兵位于门前。
- source_word: ἐτήρουν τὴν φυλακήν
  choice: 在把守监牢
  rationale: τηρέω表示看守、守卫；φυλακή在这里可理解为监牢，也可能指警戒或看守职责，正文采用符合监禁场景的自然译法，并以脚注保留另一理解。
