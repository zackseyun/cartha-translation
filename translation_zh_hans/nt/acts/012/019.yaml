  text: Ἡρῴδης δὲ ἐπιζητήσας αὐτὸν καὶ μὴ εὑρὼν ἀνακρίνας τοὺς φύλακας ἐκέλευσεν ἀπαχθῆναι, καὶ κατελθὼν ἀπὸ τῆς Ἰουδαίας ⸀εἰς Καισάρειαν διέτριβεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/019.yaml
  text: But Herod[a], after searching for him and not finding him, examined the guards and ordered them to be led away to execution. Then he went down from Judea to Caesarea and stayed there.
translation:
  language: zh_hans
  text: 希律搜寻他，却没有找到，就审问守卫，下令把他们押去处死[a]。随后，他从犹太地区下到凯撒利亚，在那里停留了一段时间。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“下令把他们押走”；按上下文，这很可能是指押去处死。
    reason: 保留ἀπαχθῆναι的字面意义，并说明正文所采用的语境含义。
lexical_decisions:
- source_word: ἐπιζητήσας αὐτὸν καὶ μὴ εὑρὼν
  choice: 搜寻他，却没有找到
  rationale: 两个过去时分词表示先于主句发生的连续行动；译文自然呈现希律主动搜寻而未能找到的结果。
- source_word: ἀνακρίνας τοὺς φύλακας
  choice: 审问守卫
  rationale: ἀνακρίνω在这里指带有正式调查性质的讯问；“审问”比一般的“询问”更符合司法语境。
- source_word: ἐκέλευσεν ἀπαχθῆναι
  choice: 下令把他们押去处死[a]
  rationale: ἀπάγω字面是“押走、带走”，在司法叙事中可暗指押去处决。正文表达语境中最可能的意思，脚注同时保留原文没有明说“处死”的措辞。
- source_word: κατελθὼν ἀπὸ τῆς Ἰουδαίας εἰς Καισάρειαν
  choice: 从犹太下到凯撒利亚
  rationale: 保留原文由内陆高地前往沿海凯撒利亚的“下去”这一地理表达。
- source_word: διέτριβεν
  choice: 住在那里
  rationale: 未完成时表示持续停留；“住在那里”简洁自然，并体现延续性。
theological_decisions:
- issue: ἀπαχθῆναι是否应明确译出处决
  choice: 正文译作“押去处死”，并用脚注说明字面措辞
  alternative: “押走”或“带走”
  rationale: 原文只明说“被押走”，没有使用直接表示杀死的动词；但在守卫失职受审的叙事和当时司法语境中，最可能指押去处决。正文传达其语境含义，脚注则保留真实的词义张力，避免把推断伪装成原文明说。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“搜寻”“审问”“押去处死”符合叙事和司法语境；保留“下到凯撒利亚”的古代地理表达。
