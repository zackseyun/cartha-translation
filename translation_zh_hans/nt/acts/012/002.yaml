base_translation:
  language: en
  yaml_path: translation/nt/acts/012/002.yaml
  text: And he killed James[a], the brother of John, with the sword.
translation:
  language: zh_hans
  text: 又用剑杀了约翰的兄弟雅各[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “杀了”或译“处死了”。希腊文只说明他杀死了雅各；较广的上下文可能表明这是一次官方处决。
    reason: 说明ἀνεῖλεν可译为“处死了”，同时保留本节未明确说明司法程序的事实。
lexical_decisions:
- source_word: ἀνεῖλεν
  choice: 杀了
  rationale: 此处表示使人死亡。“杀了”直接、自然，不在正文中额外限定为司法意义上的“处死”。
- source_word: δὲ
  choice: 又
  rationale: δέ在这里承接并推进叙事；结合上一节连续发生的行动，“又”符合现代汉语表达，也不赋予原文过强的转折意味。
- source_word: Ἰάκωβον
  choice: 雅各
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: τὸν ἀδελφὸν Ἰωάννου
  choice: 约翰的兄弟
  rationale: 该同位语用来辨明是哪一位雅各。“兄弟”不擅自断定雅各比约翰年长或年幼，保留ἀδελφός在年龄次序上的不明确性。
- source_word: μαχαίρῃ
  choice: 用刀
  rationale: 工具格说明致死所用的兵器。μάχαιρα可指刀或短剑；“用刀”简洁自然，并保留具体的杀害方式。
theological_decisions:
- issue: 希律行为的性质
  choice: 正文直译为“杀了”，不明确规定为司法处决。
  alternative: 译为“处死了”，突出这可能是统治者实施的官方处决。
  rationale: ἀναιρέω在这里明确表达使雅各死亡，μάχαιρα说明手段；上下文虽显示官方迫害，但本节措辞本身没有突出司法程序。因此正文采用较宽泛的“杀了”，并在脚注保留“处死”的可能性。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“约翰的兄弟雅各”既清楚辨明人物，也避免用“哥哥”或“弟弟”补入原文没有说明的年龄次序。
