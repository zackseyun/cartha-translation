  text: κατασείσας δὲ αὐτοῖς τῇ χειρὶ σιγᾶν διηγήσατο αὐτοῖς πῶς ὁ κύριος αὐτὸν ἐξήγαγεν ἐκ τῆς φυλακῆς, εἶπέν ⸀τε· Ἀπαγγείλατε Ἰακώβῳ καὶ τοῖς ἀδελφοῖς ταῦτα. καὶ ἐξελθὼν ἐπορεύθη εἰς ἕτερον τόπον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/017.yaml
  text: But motioning to them with his hand to be silent[a], he explained to them how the Lord had brought him out of the prison. And he said, “Report these things to James and to the brothers.” Then he departed and went to another place.
translation:
  language: zh_hans
  text: 彼得用手示意他们安静，就向他们讲述主怎样领他出了监牢。接着他说：“你们要把这些事告诉雅各和弟兄们[a]。”随后他出去，往别处去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄们”也可能指包括弟兄姊妹在内的信徒群体；希腊原文直译为“弟兄们”。
    reason: 说明 τοῖς ἀδελφοῖς 在语境中可能具有较广的群体指称。
lexical_decisions:
- source_word: κατασείσας ... τῇ χειρὶ σιγᾶν
  choice: 摆手示意他们安静
  rationale: 该分词与“用手”和“安静”连用，表示以手势让众人静下来；此译自然清楚，又不具体限定手势的方式。
- source_word: διηγήσατο
  choice: 讲述
  rationale: 该词表示有条理地叙述事情经过；“讲述”既保留叙事意味，也符合现代汉语。
- source_word: πῶς
  choice: 怎样
  rationale: 引出彼得所讲述的获救经过，保留原文表达方式。
- source_word: ὁ κύριος
  choice: 主
  rationale: 按新约常规译法处理 κύριος，并保留原文未进一步说明其所指的含混性。
- source_word: ἐξήγαγεν ἐκ τῆς φυλακῆς
  choice: 领他出了监牢
  rationale: ἐξάγω 有领出、带出之意；“领他出了监牢”保留主动引领和脱离囚禁的含义。
- source_word: Ἀπαγγείλατε
  choice: 你们要把这些事告诉
  rationale: 命令语气要求听众转达重要消息；“要……告诉”在现代汉语中自然表达该命令。
- source_word: Ἰακώβῳ
  choice: 雅各
  rationale: 采用中文圣经传统中对该人名的标准译名。
- source_word: τοῖς ἀδελφοῖς
  choice: 弟兄们
  rationale: 保留希腊文阳性复数的字面表达；其在语境中可能广指信徒群体，另以脚注说明。
- source_word: ἐξελθὼν ἐπορεύθη
  choice: 离开那里，往……去了
  rationale: 以自然汉语表达先离开当前地点、继而前往另一地点的连续动作，避免生硬重复。
- source_word: εἰς ἕτερον τόπον
  choice: 往别处
  rationale: 简洁保留地点未被具体说明以及“另一个地方”的含义。
theological_decisions:
- issue: κύριος 的所指
  choice: 译为“主”，不进一步指明
  alternative: 明确译作“主耶稣”或“神”
  rationale: 原文只用带冠词的 κύριος。在《使徒行传》中它可能特指复活的耶稣，也可能处于较宽泛的神圣施行者语境；译文保留这种张力，不作超出原文的限定。
- issue: τοῖς ἀδελφοῖς 的范围
  choice: 正文译为“弟兄们”，脚注说明可能广指信徒群体
  alternative: 正文译为“弟兄姊妹们”或“众信徒”
  rationale: 原文为阳性复数，可能指男性同工，也可能按当时语言惯例包括更广的信徒群体。正文保持形式对应，脚注保留语境上的可能范围。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。“摆手示意”“讲述”“往别处去了”适合普通读者；“主”“雅各”“弟兄们”沿用通行的中文圣经用语。
