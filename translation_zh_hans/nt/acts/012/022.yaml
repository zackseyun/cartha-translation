id: ACT.12.22
reference: Acts 12:22
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ δὲ δῆμος ἐπεφώνει· ⸂Θεοῦ φωνὴ⸃ καὶ οὐκ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/022.yaml
  text: And the crowd kept shouting[a], “The voice of a god, and not of a man!”
translation:
  language: zh_hans
  text: 民众不断高喊[a]：“这是神明的声音，不是人的声音！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这是神的声音，不是人的声音！”希腊文可以这样理解；但按上下文，更可能是“神明的声音”，反映异教群众把希律奉若神明的欢呼。
    reason: alternative_reading
lexical_decisions:
- source_word: δῆμος
  choice: 民众
  rationale: 指现场聚集并发出欢呼的公众；“民众”自然庄重，也不暗示正式政治机构。
- source_word: ἐπεφώνει
  choice: 不断高喊
  rationale: 未完成时体现持续或反复发生的呼喊；“不断高喊”传达其未完成体意义。
- source_word: Θεοῦ
  choice: 神明的
  rationale: 无冠词的 θεοῦ 处于异教群众向希律献媚、赋予神性尊荣的语境中；“神明”比特指独一真神的“神”更能表达泛指含义，同时脚注保留另一种读法。
- source_word: φωνὴ
  choice: 声音
  rationale: 保留名词性表达及其与“人的声音”的直接对照。
- source_word: ἀνθρώπου
  choice: 人的
  rationale: 自然表达单数属格的类别性对照，即神明与人相对，不必生硬译作“一个人的”。
theological_decisions:
- issue: θεοῦ 应理解为“神明的”还是“神的”
  choice: 神明的
  alternative: 神的
  rationale: 上下文是异教群众向希律发出神化式的欢呼，且希腊文 θεοῦ 无冠词；正文用“神明”较能反映泛指的神祇，同时以脚注保留语法上可成立的特指理解，避免消除原文歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“这是……”补足希腊文无动词感叹句在汉语中的自然表达；以重复“声音”保持鲜明对照。
