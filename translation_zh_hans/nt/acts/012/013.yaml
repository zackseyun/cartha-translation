translation:
  language: zh_hans
  text: 彼得敲外门时，一个名叫罗大的女仆前来应门。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“女奴”。希腊语παιδίσκη可指年轻的女性家仆或女奴；这里的叙事没有明确说明她的法律身份。
    reason: lexical_alternative
lexical_decisions:
- source_word: κρούσαντος δὲ αὐτοῦ
  choice: 彼得敲……时
  rationale: 不定过去时分词配合δέ推进叙事，并表达与主句动作相关的时间背景。中文用“……时”自然传达此意；根据上文明确补出主语“彼得”，避免代词指向含混。
- source_word: θύραν τοῦ πυλῶνος
  choice: 外门
  rationale: θύρα指门，πυλών指宅院的门廊、门道或外入口。现代汉语“外门”简洁呈现住宅外部入口这一场景，避免生硬直译为“门道的门”。
- source_word: προσῆλθε
  choice: 过来
  rationale: προσέρχομαι表示走近或来到跟前；“过来”符合有人听见敲门后走向入口的家庭场景。
- source_word: παιδίσκη
  choice: 使女
  rationale: 该词可指年轻的女性家仆或女奴。“使女”在中文圣经叙事中庄重且易懂，并保留其服役身份；其法律身份是否为奴隶，原文在此没有明确强调，故在脚注说明。
- source_word: ὑπακοῦσαι
  choice: 应门
  rationale: ὑπακούω本可指听从、回应；在敲门语境中是前去回应来客。“应门”是现代汉语对此情境最自然、准确的表达。
- source_word: ὀνόματι Ῥόδη
  choice: 名叫罗大
  rationale: ὀνόματι引出姓名；Ῥόδη按中文圣经人名惯例音译为“罗大”。
