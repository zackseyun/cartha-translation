  text: καὶ ἐπιγνοῦσα τὴν φωνὴν τοῦ Πέτρου ἀπὸ τῆς χαρᾶς οὐκ ἤνοιξεν τὸν πυλῶνα, εἰσδραμοῦσα δὲ ἀπήγγειλεν ἑστάναι τὸν Πέτρον πρὸ τοῦ πυλῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/014.yaml
  text: And when she recognized Peter’s voice[a], because of her joy she did not open the gate[b], but ran in and reported that Peter was standing at the gate.
translation:
  language: zh_hans
  text: 她一听出是彼得的声音，就欢喜得没有开大门[a]，反而跑进去报告说，彼得正站在大门外[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大门”也可译作“门道”或“外门”，指从街道进入宅院的入口。
    reason: lexical_alternative
  - marker: b
    text: 直译：“报告彼得正站在大门前。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνοῦσα τὴν φωνὴν τοῦ Πέτρου
  choice: 一听出是彼得的声音
  rationale: ἐπιγινώσκω在这里表示听见声音后认出来；“一听出”自然地表达先于后续动作的分词关系，并保留凭声音辨认的含义。
- source_word: ἀπὸ τῆς χαρᾶς
  choice: 欢喜得
  rationale: 该介词短语表示原因；“欢喜得没有……”以现代汉语自然表达因过度欢喜而产生的反常举动。
- source_word: οὐκ ἤνοιξεν
  choice: 没有开
  rationale: 忠实对应ἀνοίγω“打开”，不擅自具体化为“解锁”或“开锁”。
- source_word: τὸν πυλῶνα / τοῦ πυλῶνος
  choice: 大门
  rationale: πυλών指从街道进入宅院的外部入口或门道；在住宅场景中，“大门”比单说“门”更能体现外门性质，也比“门廊”更少添加建筑细节。
- source_word: εἰσδραμοῦσα
  choice: 跑进去
  rationale: 保留动词所表达的快速向内移动，并维持叙事的生动节奏。
- source_word: ἀπήγγειλεν
  choice: 报告说
  rationale: ἀπαγγέλλω表示传报或报告消息；“报告说”适合叙事语体，同时自然引出后面的内容。
- source_word: ἑστάναι
  choice: 正站着
  rationale: ἵστημι的完成时不定式在此表达持续的站立状态；“正站着”体现彼得当时仍在门外。
- source_word: πρὸ τοῦ πυλῶνος
  choice: 在大门外
  rationale: πρό加属格表示在某物前面；结合从宅内视角叙述的场景，“大门外”自然且准确，避免“在大门前”可能产生的内外方位含混。
