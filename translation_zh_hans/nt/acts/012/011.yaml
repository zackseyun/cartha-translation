  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ὁ Πέτρος ⸂ἐν ἑαυτῷ γενόμενος⸃ εἶπεν· Νῦν οἶδα ἀληθῶς ὅτι ἐξαπέστειλεν ⸀ὁ κύριος τὸν ἄγγελον αὐτοῦ καὶ ἐξείλατό με ἐκ χειρὸς Ἡρῴδου καὶ πάσης τῆς προσδοκίας τοῦ λαοῦ τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/011.yaml
  text: And Peter[a], coming to himself, said[c][b], “Now I truly know that the Lord sent his angel and rescued me from Herod’s hand and from all the expectation of the people of the Jews.”
translation:
  language: zh_hans
  text: 彼得清醒过来[a]，说：“现在我确实知道，主差遣了他的天使，救我脱离希律的手[b]，也脱离犹太民众所期待的一切[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“恢复了意识”或“回过神来”。
    reason: lexical_alternative
  - marker: b
    text: “希律的手”指希律的权势或控制。
    reason: cultural_note
  - marker: c
    text: 或译：“也脱离犹太民众的一切期待。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἑαυτῷ γενόμενος
  choice: 清醒过来
  rationale: 这是表示恢复完全意识的习语；“清醒过来”符合现代汉语，也避免将其误解为悔悟意义上的“醒悟”。
- source_word: ἀληθῶς
  choice: 确实
  rationale: 表达彼得此刻确定无疑的认识，语气自然且庄重。
- source_word: ἐξαπέστειλεν
  choice: 差遣了
  rationale: 在主差遣天使的语境中，“差遣”比普通的“派”更庄重，也准确表达受命而出的含义。
- source_word: κύριος
  choice: 主
  rationale: 希腊文没有进一步说明所指；译作“主”可保留原文在此处的指称张力。
- source_word: ἄγγελον
  choice: 天使
  rationale: 叙事语境明确指向属天的使者，而非一般的人间信使。
- source_word: ἐξείλατό με
  choice: 救我脱离
  rationale: 准确表达从危险和控制之下施行拯救的意义，并能自然统摄后面的两个介词短语。
- source_word: ἐκ χειρὸς Ἡρῴδου
  choice: 脱离希律的手
  rationale: 保留原文“手”的意象；在此指希律的权势或控制。
- source_word: πάσης τῆς προσδοκίας
  choice: 所期待的一切
  rationale: 比直译“所有的期待”更符合现代汉语，并保留原文没有明说具体预期结果的含蓄性。
- source_word: τοῦ λαοῦ τῶν Ἰουδαίων
  choice: 犹太民众
  rationale: 自然传达这群犹太百姓的集体所指，避免生硬的“犹太人的人民”。
theological_decisions:
- issue: κύριος的指称
  choice: 主
  alternative: 上帝；复活的耶稣
  rationale: 原文只用κύριος，没有在本句明确限定所指。译作“主”而不进一步具体化，可保留《使徒行传》此处神圣行动者的指称张力。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“清醒过来”清楚表达彼得从异象般的经历中恢复意识；“希律的手”保留圣经意象并以脚注解释；末句采用“所期待的一切”以保留προσδοκία所指结果未被明说的特点。
