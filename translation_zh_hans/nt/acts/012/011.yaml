revisions:
- from: 彼得清醒过来[a]，说：“现在我确实知道，主差遣了他的天使，救我脱离希律的手[b]，也使我脱离了犹太民众所期待的一切[c]。”
  to: 彼得清醒过来[a]，说：“现在我确实知道，主差遣了他的天使，救我脱离希律的手[b]，也脱离犹太民众所期待的一切[c]。”
  rationale: 修订仅调整末句的并列句法，并将脚注c改为不额外断言“期待的事全都落空”的中性替代译法。如此保留προσδοκία所指的具体预期未被明说的含蓄性，也维持原文两个“从……”短语受同一拯救动作统摄的结构。
