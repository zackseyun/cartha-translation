base_translation:
  language: en
  yaml_path: translation/nt/acts/011/020.yaml
  text: But some of them were men from Cyprus and Cyrene[a], who, when they came to Antioch, were also speaking to the Hellenists, proclaiming the good news about the Lord Jesus.
translation:
  language: zh_hans
  text: 但他们中有些男子来自塞浦路斯和古利奈；他们来到安提阿后，也向说希腊语的犹太人[a]传讲关于主耶稣的福音。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“希腊人”，而不是“说希腊语的犹太人”。若此读法为原文，意思就是他们向外邦人传讲，而不只是向说希腊语的犹太人传讲。
    reason: textual_variant
lexical_decisions:
- source_word: τινες
  choice: 有些人
  rationale: 指前述群体中未具体说明的一部分人；“有些人”自然且准确。
- source_word: ἄνδρες
  choice: 人
  rationale: 此处与“塞浦路斯人和古利奈人”结合表达男性成员的地域身份；现代汉语用“人”最自然，不额外加入原文未强调的“男人”。
- source_word: Κύπριοι καὶ Κυρηναῖοι
  choice: 塞浦路斯人和古利奈人
  rationale: 保留两个地域族称，清楚表达他们来自塞浦路斯和古利奈。
- source_word: οἵτινες
  choice: 他们
  rationale: 承接前句所指的人，引出其行动；汉语另起分句比直译关系代词更自然。
- source_word: ἐλθόντες εἰς Ἀντιόχειαν
  choice: 来到安提阿
  rationale: 将不定过去时分词按伴随时间关系处理；上下文已使先后关系清楚，无须增添“以后”。
- source_word: ἐλάλουν
  choice: 传讲
  rationale: 未完成过去时表示持续或反复的言说；与后面的分词合并为自然汉语谓语，由“传讲福音”表达其持续事工。
- source_word: καὶ
  choice: 也
  rationale: 体现附加意义，表示听众范围有所扩展。
- source_word: πρὸς τοὺς Ἑλληνιστάς
  choice: 向说希腊语的犹太人
  rationale: 按SBLGNT的Ἑλληνιστάς翻译；该词在《使徒行传》中通常指说希腊语、受希腊文化影响的犹太人。重要异文Ἕλληνας另见脚注。
- source_word: εὐαγγελιζόμενοι
  choice: 传讲……的福音
  rationale: 表达宣告好消息的动作和内容，现代汉语清楚自然。
- source_word: τὸν κύριον Ἰησοῦν
  choice: 主耶稣
  rationale: 保留κύριος的基督论称号“主”；中文专名结构不需对应冠词。
theological_decisions:
- issue: τοὺς Ἑλληνιστάς与异文Ἕλληνας所指的听众身份
  choice: 正文按SBLGNT译作“说希腊语的犹太人”
  alternative: “希腊人”，即外邦人
  rationale: 正文忠实采用所给原文版本的Ἑλληνιστάς，同时以脚注保存具有叙事和神学意义的异文，不把福音何时明确扩展至外邦人的问题在翻译中暗自定论。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“也”保留受众扩展的语气；分号使人物身份与其行动之间的结构清楚。
