base_translation:
  language: en
  yaml_path: translation/nt/acts/011/030.yaml
  text: And they did so[a], sending it to the elders by the hand of Barnabas and Saul.
translation:
  language: zh_hans
  text: 他们就这样做了，由巴拿巴和扫罗经手，把捐助送给众长老。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“借着巴拿巴和扫罗的手”，意思是由他们经手送去。
    reason: 保留并说明διὰ χειρός这一表示代理或经手的希腊语惯用表达。
lexical_decisions:
- source_word: ὃ καὶ ἐποίησαν
  choice: 他们也照样做了
  rationale: 中性关系代词ὃ回指上一节所说的赈济安排；与ἐποίησαν连用时，译为“照样做了”自然地承接上文。καί在此兼有承接和“也”的意味。
- source_word: ἀποστείλαντες
  choice: 送到
  rationale: 不定过去时分词说明他们落实此事的方式，即把捐款送交指定对象；汉语用连动结构表达最自然。
- source_word: πρὸς τοὺς πρεσβυτέρους
  choice: 到众长老那里
  rationale: πρεσβύτεροι指群体中获认可的长者或领袖；“长老”是现代中文圣经语境中清楚、通行的对应词。复数冠词以“众”体现。
- source_word: διὰ χειρὸς Βαρναβᾶ καὶ Σαύλου
  choice: 交给巴拿巴和扫罗
  rationale: διὰ χειρός是表示经手或代理的惯用语，字面为“借着……的手”。现代汉语以“交给……送到”准确表达由二人经手递送的关系。
- source_word: implicit object from context
  choice: 捐款
  rationale: 原文宾语由上一节的赈济行动补足。中文若只说“把它”指代稍显生硬，明确译作“捐款”可使句意清楚，同时不把用途误当作物件名称。
- source_word: Βαρναβᾶ καὶ Σαύλου
  choice: 巴拿巴和扫罗
  rationale: 采用现代简体中文圣经中通行的人名译法。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“把捐款交给……送到……”清楚呈现巴拿巴和扫罗是递送者，而众长老是接收者；脚注保留原文的具体“手”这一意象。
