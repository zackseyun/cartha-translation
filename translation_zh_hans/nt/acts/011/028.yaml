base_translation:
  language: en
  yaml_path: translation/nt/acts/011/028.yaml
  text: And one of them[a], named Agabus, stood up and indicated by the Spirit that a great famine was about to come over the whole inhabited world—which happened in the time of Claudius.
translation:
  language: zh_hans
  text: 他们中间有一个人，名叫亚迦布，站起来，借着圣灵预示，将有一场大饥荒临到全世界[a]。这场饥荒在革老丢在位期间发生了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所译的希腊文直指“有人居住的世界”；在路加—使徒行传中，也可能较具体地指罗马世界。
    reason: 说明οἰκουμένη的字面词义范围及其在路加—使徒行传中的可能历史语境，不在正文中限定其所指范围。
lexical_decisions:
- source_word: ἀναστὰς
  choice: 站起来
  rationale: 这里的分词引出亚迦布在聚会中的动作；“站起来”自然清楚，也保留了原文的动作含义。
- source_word: ἐσήμανεν
  choice: 指明
  rationale: σημαίνω可指示、表明或使人知道；“指明”既传达启示的明确性，又不把表达方式过度限定为某种固定的预言公式。
- source_word: διὰ τοῦ πνεύματος
  choice: 借着圣灵
  rationale: διά加属格在此表示媒介或施事；使徒行传的预言语境表明这里所指的是圣灵。
- source_word: λιμὸν μεγάλην
  choice: 一场大饥荒
  rationale: 直译名词λιμός和形容词μεγάλην，中文自然，也不必进一步释作“严重的饥荒”。
- source_word: μέλλειν ἔσεσθαι
  choice: 将要临到
  rationale: μέλλω加不定式表达将来或即将发生；“将要临到”符合饥荒与介词短语的搭配，并保留预告的语气。
- source_word: ἐφ’ ὅλην τὴν οἰκουμένην
  choice: 临到整个有人居住的世界
  rationale: οἰκουμένη字面指有人居住的世界，也可能在路加—使徒行传中侧重罗马帝国范围；正文保留较宽且贴近词义的表达，脚注说明其他可能理解。
- source_word: ἥτις ἐγένετο
  choice: 这场饥荒……发生了
  rationale: 将关系从句改成独立句，明确承接前述饥荒，符合现代汉语表达，同时没有增加原文未说明的因果或程度。
- source_word: ἐπὶ Κλαυδίου
  choice: 在革老丢在位期间
  rationale: ἐπί加属格用于统治者时表示其执政时期；“在位期间”清楚传达年代含义。“革老丢”采用中文圣经中较为熟悉的人名译法。
theological_decisions:
- issue: διὰ τοῦ πνεύματος中“灵”的所指
  choice: 译作“圣灵”
  alternative: 译作“灵”，不进一步明确
  rationale: 在使徒行传的预言语境中，带定冠词的“那灵”通常指圣灵；中文明确译作“圣灵”符合上下文。
- issue: οἰκουμένη的范围
  choice: 正文译作“整个有人居住的世界”，不限定具体疆域
  alternative: “全世界”或“整个罗马世界”
  rationale: 该词既可广指有人居住的世界，在路加—使徒行传中也常带有罗马帝国世界的语境色彩。正文保留原词的广度，脚注呈现较窄的历史语境理解，避免武断消除歧义。
translation_notes:
  register: 采用现代、庄重而通顺的标准普通话。为避免一个中文长句承载过多层次，将原文结构分成三句；预言内容及其后来应验的关系仍保持清楚。脚注标记置于其实际说明的“世界”之后。
