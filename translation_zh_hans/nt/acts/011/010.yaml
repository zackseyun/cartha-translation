  text: τοῦτο δὲ ἐγένετο ἐπὶ τρίς, καὶ ⸂ἀνεσπάσθη πάλιν⸃ ἅπαντα εἰς τὸν οὐρανόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/010.yaml
  text: This happened three times[a], and everything was drawn up again into heaven.
translation:
  language: zh_hans
  text: 这事发生了三次，随后所有这一切又被提到天上去了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“所有这一切又被带回天上。”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: 这事
  rationale: 指向上文所述的异象事件；“这事”自然明确，又不把原文未明说的“异象”增补进正文。
- source_word: δὲ
  choice: 随后
  rationale: 此处是较弱的叙事连接词；结合后半句译作“随后”，使现代汉语的事件推进清楚而不过度强调转折。
- source_word: ἐγένετο
  choice: 发生了
  rationale: 这里表示事件出现或发生；“发生了”符合现代叙事语言。
- source_word: ἐπὶ τρίς
  choice: 一连……三次
  rationale: 表达同一事件重复三次；“一连”自然传达连续重复的语境。
- source_word: ἀνεσπάσθη
  choice: 被提到……去了
  rationale: 保留被动语态和向上移动的意象，不明说施动者；“提到”比“拉到”更符合此处庄重而自然的汉语表达。
- source_word: πάλιν
  choice: 又
  rationale: 表示再次或返回，与向天上移动的动作自然搭配。
- source_word: ἅπαντα
  choice: 一切
  rationale: 保留中性复数的概括性，不擅自限定为布、容器或其中的动物。
- source_word: εἰς τὸν οὐρανόν
  choice: 到天上去
  rationale: 保留εἰς的方向性；在异象语境中，“天上”比单指可见天空的“空中”更合适。
theological_decisions:
- issue: ἅπαντα所指的范围
  choice: 译为“一切”，不具体说明是那块布、整个容器或其中的动物。
  alternative: 译为“全都”或“整个东西”。
  rationale: 原文概括全面，却没有在本节中明确限定所指对象；宽泛译法保留原文的含混，不以解释取代翻译。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“这事一连发生了三次”避免生硬直译；后句保留被动结构、向上运动以及ἅπαντα所指对象的开放性。
