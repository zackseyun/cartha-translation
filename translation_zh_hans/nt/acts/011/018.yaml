  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἀκούσαντες δὲ ταῦτα ἡσύχασαν καὶ ⸀ἐδόξασαν τὸν θεὸν λέγοντες· ⸀Ἄρα καὶ τοῖς ἔθνεσιν ὁ θεὸς τὴν μετάνοιαν ⸂εἰς ζωὴν ἔδωκεν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/018.yaml
  text: When they heard these things[a], they became quiet and glorified God, saying[b], “Then God has also granted to the Gentiles the change of mind that leads to life.”
translation:
  language: zh_hans
  text: 他们听见这些事，就安静下来，把荣耀归给上帝，说：“这样看来，上帝也把那通向生命的悔改赐给外邦人了。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “外邦人”也可译作“列国的人”；这里指非犹太人。“通向生命”也可译作“以至于生命”或“为着生命”。原文介词可表示方向、目标或结果。
    reason: 说明ἔθνεσιν及εἰς ζωήν的词义选择，并保留εἰς ζωήν的语义幅度。
lexical_decisions:
- source_word: ἀκούσαντες δὲ ταῦτα
  choice: 他们听见这些话，就
  rationale: 以时间从句自然表达不定过去时分词的先行动作；δέ在此仅作轻微衔接，不另行直译。ταῦτα指彼得刚才所述的内容，译作“这些话”符合中文语境。
- source_word: ἡσύχασαν
  choice: 不再争辩
  rationale: 本节语境是众人先前与彼得争论（11:2）；该动词在此不只是声音停止，也表示停止异议。译文据语境明确其含义，同时不把它扩展为完全赞同。
- source_word: ἐδόξασαν τὸν θεόν
  choice: 把荣耀归给上帝
  rationale: 保留δοξάζω的“荣耀”语义及路加—使徒行传中的神学分量；比单译“赞美”更贴近原文。
- source_word: λέγοντες
  choice: 说
  rationale: 用中文连续谓语自然引出其发言内容，无须机械保留分词形式。
- source_word: Ἄρα
  choice: 这样看来
  rationale: 表达根据彼得报告所得出的推论，比单独的“那么”更清楚地保留推论语气。
- source_word: καὶ τοῖς ἔθνεσιν
  choice: 也……给外族人
  rationale: καί突出上帝的作为也临到非犹太人；ἔθνη在这里指犹太人以外的族群。“外族人”对普通现代读者较“外邦人”直白，同时保留群体身份含义。
- source_word: τὴν μετάνοιαν
  choice: 那……悔改
  rationale: μετάνοια在新约语境中不只是思想改变，而是转变心意与方向，译作“悔改”既准确又自然；“那”与后面的修饰语共同体现希腊文定冠词所限定的特定恩赐。
- source_word: εἰς ζωήν
  choice: 通向生命的
  rationale: εἰς可表达方向、目标或结果；“通向生命”保留这种动态关系，不武断限定为单一语法类别。
- source_word: ἔδωκεν
  choice: 赐给……了
  rationale: 直译其给予、赐予含义，并以句末“了”表现已经发生且构成当前结论的行动。
theological_decisions:
- issue: 悔改作为上帝所赐
  choice: 保留“上帝……把……悔改赐给”这一施予结构
  alternative: 译为上帝只是“准许”外族人悔改，或反过来说明人的回应机制
  rationale: 原文明确以上帝为ἔδωκεν的主语、以悔改为所赐之物。译文如实保留这一陈述，但不进一步建立关于神人作用方式的教义体系。
- issue: μετάνοια εἰς ζωήν的关系
  choice: 那通向生命的悔改
  alternative: 得生命所必需的悔改；产生生命的悔改；为着生命的悔改
  rationale: εἰς可含目标或结果意味。“通向生命”保留其方向性和神学张力，避免过度断定悔改与生命之间精确的因果机制。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“不再争辩”结合上下文呈现ἡσύχασαν；“把荣耀归给上帝”保留原文措辞的神学力度；避免较晦涩的“悔改以至于生命”，同时以脚注保存可选译法。
