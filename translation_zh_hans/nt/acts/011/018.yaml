revisions:
- from: 他们听见这些话，就不再争辩，并且把荣耀归给上帝，说：“这样看来，上帝也把那通向生命的悔改赐给外族人了。”[a]
  to: 他们听见这些事，就安静下来，把荣耀归给上帝，说：“这样看来，上帝也把那通向生命的悔改赐给外邦人了。”[a]
  rationale: 修订仅处理两个可安全改进之处：以“安静下来”直接对应ἡσύχασαν，避免把动词限定为辩论行为；以“外邦人”明确、自然地表达本节语境中的非犹太人。保留“通向生命的悔改”，以表达μετάνοια εἰς ζωήν的方向/结果关系，而不预断其精确神学机制。
