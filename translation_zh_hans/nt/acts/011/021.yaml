  text: καὶ ἦν χεὶρ κυρίου μετ’ αὐτῶν, πολύς τε ἀριθμὸς ⸀ὁ πιστεύσας ἐπέστρεψεν ἐπὶ τὸν κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/021.yaml
  text: And the hand of the Lord was with them[b][a], and a great number who believed turned to the Lord.
translation:
  language: zh_hans
  text: 主的手与他们同在[a]；许多人信了[b]，归向主。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “主的手”是圣经惯用语，表示主主动施展的能力、同在或恩助。
    reason: lexical_alternative
  - marker: b
    text: 原文作“信了的〔人〕”，修饰“许多人”；也可译作“许多信了的人归向主”。
    reason: lexical_alternative
lexical_decisions:
- source_word: χεὶρ κυρίου
  choice: 主的手
  rationale: 保留圣经中“主的手”这一比喻及其经文互文色彩；此惯用语表达主主动施展的能力、同在或恩助。
- source_word: κύριος
  choice: 主
  rationale: 两处均按原文保留标准称号“主”，不在正文中进一步限定所指。
- source_word: μετ’ αὐτῶν
  choice: 与他们同在
  rationale: μετά加属格的基本意义是“与……同在”；结合“主的手”这一惯用语，此译法自然表达主对传道者的临在与扶助。
- source_word: πολύς τε ἀριθμός
  choice: 许多人
  rationale: 该短语指人数众多；中文用“许多人”比逐字译作“很大的数目”更自然准确。
- source_word: ὁ πιστεύσας
  choice: 信了
  rationale: 冠词化的简单过去时分词与“许多人”共同构成主语。译作“信了”简洁自然，同时以脚注保留其与主要动词之间可能的情状或先后关系。
- source_word: ἐπέστρεψεν ἐπὶ τὸν κύριον
  choice: 归向主
  rationale: ἐπιστρέφω加ἐπί在此表示转向主、归信主；“归向主”保留归信含义，却不额外加入原文未明说的“悔改”，也不必然暗示他们先前已属于主。
theological_decisions:
- issue: 本节两处“主”的所指
  choice: 正文两处都译作“主”，不明确补作“耶稣”或“神”
  alternative: 明确译作“主耶稣”，或将其理解为泛指神
  rationale: 《使徒行传》的语境可能使“主”指向耶稣，尤其在归信语境中如此；但希腊文本只写κύριος。保留“主”可忠实保存原文的措辞及其所指的开放性。
- issue: “信”与“归向主”的关系
  choice: 译作“许多人信了，归向主”
  alternative: 译作“许多人因信而归向主”或“许多人归信了主”
  rationale: 希腊文以简单过去时分词ὁ πιστεύσας修饰群体，并以ἐπέστρεψεν作主要谓语；分词可表达伴随情状，也可能带有先行意味。正文避免明确规定因果关系，脚注提示可译为“信了之后”。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“主的手”保留原文比喻；“与他们同在”符合中文圣经语体。“许多人信了，归向主”避免生硬的分词结构，并保留信与归向之间的语义张力。所有脚注标记均已置于正文相应位置。
