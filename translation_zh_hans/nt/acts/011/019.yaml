source:
  edition: SBLGNT
  text: Οἱ μὲν οὖν διασπαρέντες ἀπὸ τῆς θλίψεως τῆς γενομένης ἐπὶ Στεφάνῳ διῆλθον ἕως Φοινίκης καὶ Κύπρου καὶ Ἀντιοχείας μηδενὶ λαλοῦντες τὸν λόγον εἰ μὴ μόνον Ἰουδαίοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/019.yaml
  text: So then[a], those who had been scattered because of the affliction that arose over Stephen went as far as Phoenicia and Cyprus and Antioch[c][b], speaking the word to no one except Jews.
translation:
  language: zh_hans
  text: 因此，那些因司提反事件而发生的患难[a]而四散的人，走遍各地，远至腓尼基、塞浦路斯和安提阿；他们只向犹太人讲这道[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “患难”也可译作“逼迫”；原词可指困苦、压迫或逼迫。
    reason: lexical_alternative
  - marker: b
    text: “这道”指他们所宣讲的信息，也可译作“这信息”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ μὲν οὖν διασπαρέντες
  choice: 这样，那些……而四散的人
  rationale: οὖν承接前文，译作“这样”；διασπαρέντες为不定过去时被动分词，指此前已经发生的分散，汉语以“而四散的人”自然表达其被动处境及相对先时性。
- source_word: ἀπὸ τῆς θλίψεως
  choice: 因……患难
  rationale: ἀπό在此说明导致四散的缘由；θλῖψις可指患难、压迫或逼迫。“患难”保留其较宽泛的词义，具体敌对背景则由上下文显明。
- source_word: τῆς γενομένης ἐπὶ Στεφάνῳ
  choice: 因司提反的事所引发的
  rationale: 该结构指与司提反事件相关而爆发的患难。“司提反的事”避免误解为司提反本人引发逼迫，同时保留ἐπί所含的关联性。
- source_word: διῆλθον ἕως
  choice: 一直走到
  rationale: 表达他们行经各地，抵达所列地域的地理范围；“一直……到”自然体现ἕως的界限义。
- source_word: Φοινίκης καὶ Κύπρου καὶ Ἀντιοχείας
  choice: 腓尼基、塞浦路斯和安提阿
  rationale: 采用现代简体中文圣经地名的通行译法。
- source_word: μηδενὶ λαλοῦντες τὸν λόγον εἰ μὴ μόνον Ἰουδαίοις
  choice: 他们只向犹太人讲这道
  rationale: “只向犹太人”集中表达μηδενὶ……εἰ μὴ μόνον的排他与强调；“讲这道”保留λόγος在《使徒行传》中对所宣讲信息的主题性简称。
theological_decisions:
- issue: 司提反事件之后敌对情势的性质
  choice: 正文采用较宽泛的“患难”
  alternative: 逼迫
  rationale: 上下文确属逼迫，但θλῖψις本身涵盖患难、压迫和困苦。正文不把词义收窄，脚注提示语境中可理解为“逼迫”。
- issue: τὸν λόγον所指的内容
  choice: 译作“这道”
  alternative: 这信息；关于耶稣的信息；福音
  rationale: “这道”既贴近λόγος，也延续《使徒行传》的主题性用语；不在正文中加入原文未明说的解释性成分，脚注说明其所指。
- issue: 传讲对象的排他限制
  choice: 译作“只向犹太人”
  alternative: 不向任何人讲，只向犹太人讲
  rationale: 简洁的汉语“只向”已自然保留εἰ μὴ μόνον的排他强调，不必机械重复否定结构。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“司提反的事”是自然的汉语关联表达；“这道”保留路加用语的神学与文学连贯性。所有脚注标记均置于相应正文词语之后。
