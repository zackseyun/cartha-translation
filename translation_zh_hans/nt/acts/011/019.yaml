    rationale: 在此承接前文的叙事推论，现代标准汉语以“因此”更自然、清楚。
  - severity: medium
    issue: “所引发”略将ἐπὶ Στεφάνῳ的关联义具体化为直接因果
    rationale: 原文说患难是在司提反事件上／关于司提反而发生，宜使用“因司提反事件而发生”，避免断言司提反本人直接引发患难。
  - severity: low
    issue: “一直走到”可能暗示步行
    rationale: διῆλθον是行旅经过、前行的动词，不限定交通方式；“走遍各地，远至”更贴切。
