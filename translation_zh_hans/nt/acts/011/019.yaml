revisions:
- from: 这样，那些因司提反的事所引发的患难[a]而四散的人，一直走到腓尼基、塞浦路斯和安提阿；他们只向犹太人讲这道[b]。
  to: 因此，那些因司提反事件而发生的患难[a]而四散的人，走遍各地，远至腓尼基、塞浦路斯和安提阿；他们只向犹太人讲这道[b]。
  rationale: 修订仅改善承接词和行旅动词的现代汉语表达，并以“因司提反事件而发生”更审慎地保留原文对患难与司提反事件之间的关联，不扩大为直接因果。脚注锚点均紧随其所说明的词语，且不需增设脚注。
