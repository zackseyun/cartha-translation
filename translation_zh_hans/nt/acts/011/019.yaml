  source_fidelity: “因司提反的事所引发的患难”大体传达了与司提反事件相关而发生的θλῖψις，但“所引发”较明确地表述因果关系；原文的ἐπὶ Στεφάνῳ保留的是与司提反事件相关的较宽关联。将其改为“因司提反事件而发生的患难”较为稳妥。διῆλθον配合ἕως不宜译为“一直走到”，因为这容易限于步行；“走遍各地，远至”更好地表达行旅及范围。
  naturalness: “这样”在现代汉语叙事中不自然地承担承接推论的οὖν，宜改为“因此”。“他们只向犹太人讲这道”自然、庄重，也充分表达原文的排他限制。
  terminology: 地名“腓尼基、塞浦路斯、安提阿”和人名“司提反”均合宜。“患难”保留θλῖψις的宽泛性；“这道”可保留λόγος在《使徒行传》中的简洁、主题性表达。
  issues:
