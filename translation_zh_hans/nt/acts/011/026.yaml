revisions:
- from: 他找到扫罗，就带他到安提阿去。他们整整一年同教会聚集[a]，教导了许多人；门徒称为“基督徒”，也是从安提阿开始的[b]。
  to: 他找到扫罗，就带他到安提阿去。他们有整整一年与教会一同聚集[a]，并教导许多人；门徒首次被称为“基督徒”，是在安提阿[b]。
  rationale: 修订补足中文被动式，并以“首次被称为……是在安提阿”直接呈现原文的命名行动、首次性和地点。将“同教会聚集”调整为“与教会一同聚集”，提高自然度，且仍保留ἐν τῇ ἐκκλησίᾳ可指与信徒共同体聚集而非建筑物的解释空间。
