  text: καὶ εὑρὼν ⸀ἤγαγεν εἰς Ἀντιόχειαν. ἐγένετο δὲ ⸂αὐτοῖς καὶ⸃ ἐνιαυτὸν ὅλον συναχθῆναι ⸀ἐν τῇ ἐκκλησίᾳ καὶ διδάξαι ὄχλον ἱκανόν, χρηματίσαι τε ⸀πρώτως ἐν Ἀντιοχείᾳ τοὺς μαθητὰς Χριστιανούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/026.yaml
  text: And when he found him, he brought him to Antioch. And for a whole year they met together with the church and taught a considerable crowd; and it was in Antioch that the disciples were first called Christians.
translation:
  language: zh_hans
  text: 他找到扫罗，就带他到安提阿去。他们有整整一年与教会一同聚集[a]，并教导许多人；门徒首次被称为“基督徒”，是在安提阿[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在教会中聚集。”这里的“教会”指基督徒群体，不一定指聚会的建筑物。
    reason: lexical_alternative
  - marker: b
    text: 希腊文直译为：“门徒在安提阿首次被称为基督徒。”这个名称很可能是当时社会上对他们的公开称呼。
    reason: cultural_note
lexical_decisions:
- source_word: εὑρὼν
  choice: 他找到扫罗
  rationale: 不定过去时分词表示先于主句的动作；按中文习惯用连续动词表达，并依据上文补出宾语“扫罗”。
- source_word: ἤγαγεν εἰς Ἀντιόχειαν
  choice: 就带他到安提阿去
  rationale: 自然表达带领扫罗前往安提阿的动作，并保留事件顺序。
- source_word: ἐνιαυτὸν ὅλον
  choice: 整整一年
  rationale: 准确传达时间宾格及“完整一年”的强调，中文简洁自然。
- source_word: συναχθῆναι ἐν τῇ ἐκκλησίᾳ
  choice: 同教会聚集
  rationale: 将ἐκκλησία理解为信徒群体而非建筑；“同教会聚集”也保留介词短语可能表示与群体共同聚集的含义。
- source_word: ἐκκλησίᾳ
  choice: 教会
  rationale: 在《使徒行传》中通常指基督徒群体；“教会”是现代汉语中规范且易懂的对应词。
- source_word: διδάξαι ὄχλον ἱκανόν
  choice: 教导了许多人
  rationale: ἱκανός在此表示人数很多或相当可观；“许多人”比直译“相当多的一群人”更符合现代汉语，同时不夸大程度。
- source_word: χρηματίσαι
  choice: 称为
  rationale: 此处指获得或被赋予某一称号；结合中文句式，以“门徒称为”表达被动命名的意义。
- source_word: πρώτως
  choice: 也是从……开始的
  rationale: 传达某称呼首次出现之意，并用强调句式突出地点安提阿。
- source_word: Χριστιανούς
  choice: 基督徒
  rationale: 该词已成为群体名称；“基督徒”是现代汉语约定俗成、语义准确的对应词。
theological_decisions:
- issue: Χριστιανούς是否按词源另造称呼
  choice: 基督徒
  alternative: 受膏者派／弥赛亚派
  rationale: 这里不是单独使用Χριστός这一称号，而是已经词汇化的群体名称。采用“基督徒”可准确传达历史称谓，也避免加入原文没有的宗派色彩。
- issue: ἐν τῇ ἐκκλησίᾳ中的ἐκκλησία指群体还是建筑
  choice: 按信徒群体理解，译为“同教会聚集”
  alternative: 在教堂里聚会
  rationale: 第一世纪语境中的ἐκκλησία在此主要指基督徒共同体；译成“教堂”会无根据地引入建筑含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“整整一年”自然传达持续时间；“同教会聚集”避免让读者误以为ἐκκλησία必指建筑。“基督徒”加引号，标明这是首次出现的群体称号。
