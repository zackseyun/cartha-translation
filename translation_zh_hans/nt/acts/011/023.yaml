  text: ὃς παραγενόμενος καὶ ἰδὼν τὴν χάριν ⸀τὴν τοῦ θεοῦ, ἐχάρη καὶ παρεκάλει πάντας τῇ προθέσει τῆς καρδίας ⸀προσμένειν τῷ κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/023.yaml
  text: When he arrived and saw the grace of God, he rejoiced and kept urging them all to remain devoted to the Lord with purpose of heart,
translation:
  language: zh_hans
  text: 他到了那里，看见上帝的恩典[a]，就欢喜，并不断劝勉众人要坚定心志，持守与主的关系[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“上帝所赐的恩典”。这里可能指上帝施恩之工在他们中间显出的证据。
    reason: lexical_alternative
  - marker: b
    text: 或译“继续与主相连”或“持守对主的忠诚”。
    reason: alternative_reading
lexical_decisions:
- source_word: παραγενόμενος
  choice: 到了那里
  rationale: 不定过去时分词交代巴拿巴抵达现场；“到了那里”符合现代汉语叙事习惯，并承接上下文地点。
- source_word: ἰδὼν
  choice: 看见了
  rationale: 保留ὁράω普通的视觉表达；上下文虽含辨认上帝工作的意味，但不在正文中过度解释。
- source_word: τὴν χάριν τὴν τοῦ θεοῦ
  choice: 上帝的恩典
  rationale: 保留χάρις的神学分量，也可涵盖当时可见的上帝施恩之工，而不窄化为“上帝所做的事”。
- source_word: ἐχάρη
  choice: 就很喜乐
  rationale: 自然表达其因所见而欢喜，语气庄重而易懂。
- source_word: παρεκάλει
  choice: 并不断劝勉
  rationale: 未完成时表示持续或反复的行动；“劝勉”兼顾鼓励与敦促的语义范围。
- source_word: πάντας
  choice: 众人
  rationale: 简洁指向上下文中的全体信徒，不增添原文没有的限定。
- source_word: τῇ προθέσει τῆς καρδίας
  choice: 立定心志
  rationale: 以自然现代汉语表达“内心的定意、决心”，保留坚定意向的含义，避免生硬直译“以心里的定意”。
- source_word: προσμένειν
  choice: 忠于
  rationale: 在与格τῷ κυρίῳ之后，该词表示持续依附、坚持与主相联；“忠于”在汉语中简洁传达坚定不移的归属，同时以脚注保留“常与主同在”等较形式对应的理解。
- source_word: τῷ κυρίῳ
  choice: 主
  rationale: 按使徒行传语境保留κύριος的称号；所指为复活的耶稣，但正文不作解释性扩写。
theological_decisions:
- issue: “上帝的恩典”在本节中的含义
  choice: 保留“上帝的恩典”，让它涵盖在安提阿信徒中可见的施恩之工
  alternative: 直译成“上帝所做的事”或理解为上帝的恩惠态度
  rationale: 原文使用神学意味丰富的χάρις；不将其缩减为单一外在事件，也不排除它指可观察到的施恩结果。
- issue: προσμένειν τῷ κυρίῳ所表达的持续关系
  choice: “忠于主”，表达坚定持续的依附
  alternative: “常与主同在”或“持守对主的忠诚”
  rationale: 原文可指继续与主相联、坚持依附于主；正文采用自然而凝练的汉语，脚注保留其他可能表达，不将其套入后期系统神学范畴。
translation_notes:
  register: 采用现代、庄重且口语可懂的叙事体。“立定心志”是自然汉语成语，准确承载内心坚定意向；“不断劝勉”体现未完成时的持续性。所有脚注标记均已置于正文相应位置。
