- from: 他到了那里，看见了上帝的恩典[a]，就很喜乐，并不断劝勉众人，要立定心志，忠于主[b]。
  to: 他到了那里，看见上帝的恩典[a]，就欢喜，并不断劝勉众人要坚定心志，持守与主的关系[b]。
  rationale: 修订“忠于主”为“持守与主的关系”，以更完整地表达προσμένειν与格所含继续依附、坚持不离的意思，并以“坚定心志”自然对应τῇ προθέσει τῆς καρδίας。同步改正脚注b中易误解为“主的同在”的替代译法。其余措辞忠实、自然，无须改动。
