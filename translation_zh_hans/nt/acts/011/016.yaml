  text: ἐμνήσθην δὲ τοῦ ῥήματος ⸀τοῦ κυρίου ὡς ἔλεγεν· Ἰωάννης μὲν ἐβάπτισεν ὕδατι, ὑμεῖς δὲ βαπτισθήσεσθε ἐν πνεύματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/016.yaml
  text: Then I remembered the word of the Lord[a], how he said, ‘John baptized with water, but you will be baptized in the Holy Spirit.’
translation:
  language: zh_hans
  text: 我就想起了主所说的话：“约翰用水施洗，但你们将要在圣灵里受洗[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“用圣灵受洗。”希腊语介词ἐν在这里既可表示处所或领域（“在……里”），也可表示媒介或凭借（“用、借着”）。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμνήσθην
  choice: 我想起
  rationale: 该形式虽为被动形态，却按中动语义使用，表示彼得回想起某事；“我想起”自然、准确。
- source_word: δὲ
  choice: 于是
  rationale: 此处承接前文并推进叙事，不表示强烈转折；“于是”符合现代汉语行文。
- source_word: τοῦ ῥήματος τοῦ κυρίου
  choice: 主的话
  rationale: ῥῆμα在这里指主所说的话；κύριος译作“主”，保留其权威与神学分量。
- source_word: ὡς ἔλεγεν
  choice: 他曾说
  rationale: 未完成时在此回指主先前所说的话；“曾说”自然地表达过去言说，不额外断定这是反复说过的。
- source_word: Ἰωάννης μὲν ... ὑμεῖς δὲ
  choice: 约翰……但你们……
  rationale: 以“但”自然呈现μέν…δέ所构成的对比，并保留显式代词ὑμεῖς所突出的对象转换。
- source_word: ἐβάπτισεν ὕδατι
  choice: 用水施洗
  rationale: ὕδατι是工具或方式的与格；“用水施洗”是准确而通顺的现代汉语。
- source_word: βαπτισθήσεσθε
  choice: 将受……的洗
  rationale: 保留将来时和被动语态；“受……的洗”符合中文基督教语境，也与前句“施洗”形成对应。
- source_word: ἐν πνεύματι ἁγίῳ
  choice: 受圣灵的洗
  rationale: 该译法在中文中自然表达由圣灵施行或以圣灵为媒介的洗；由于ἐν也可作处所性理解，脚注保留“在圣灵里受洗”这一可能。
theological_decisions:
- issue: κύριος的译法
  choice: 主
  alternative: 主人
  rationale: 上下文指耶稣权威性的话语；“主”既符合使徒行传的惯常称谓，也不削弱其神学含义。
- issue: ἐν πνεύματι ἁγίῳ中ἐν的理解
  choice: 受圣灵的洗
  alternative: 在圣灵里受洗
  rationale: ἐν在此既可按工具或媒介义理解，也可按处所或领域义理解。正文采用较自然的中文说法，并以脚注保存另一种真实可能，避免消解原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“于是我想起主的话”简洁承接叙事；引语保留水洗与圣灵之洗之间的鲜明对比。
