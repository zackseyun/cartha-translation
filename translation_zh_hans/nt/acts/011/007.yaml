  text: ἤκουσα δὲ ⸀καὶ φωνῆς λεγούσης μοι· Ἀναστάς, Πέτρε, θῦσον καὶ φάγε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/007.yaml
  text: And I also heard a voice saying to me, ‘Get up, Peter; kill and eat.’
translation:
  language: zh_hans
  text: 我又听见一个声音对我说：‘彼得，起来，宰了吃。’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤκουσα δὲ καὶ
  choice: 我又听见
  rationale: καί在上下文中表示彼得除看见异象外“又”听见声音；δὲ承接叙述，中文不必另译。
- source_word: φωνῆς λεγούσης μοι
  choice: 有声音对我说
  rationale: 保留属格结构表达的听觉内容，并以自然现代汉语呈现。
- source_word: Ἀναστάς
  choice: 起来
  rationale: 分词在此与后续命令连用，具有命令意味；“起来”自然且准确。
- source_word: θῦσον
  choice: 宰了
  rationale: 指宰杀异象中的动物以供食用；“宰”比泛指的“杀”更贴合动物与饮食语境。
- source_word: φάγε
  choice: 吃
  rationale: 直接对应吃食的命令，简洁自然。
theological_decisions:
- issue: θῦσον是否使用带祭祀色彩的译词
  choice: 宰了
  alternative: 献祭／屠宰
  rationale: 该动词虽可用于献祭语境，但此处与“吃”并列，重点是杀动物取食；不额外引入祭祀含义。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事表达；直接引语中的命令简洁有力。
source_grounding:
  english_pob_role: consult_only
