source:
  edition: SBLGNT
  text: ἠκούσθη δὲ ὁ λόγος εἰς τὰ ὦτα τῆς ἐκκλησίας τῆς ⸀οὔσης ἐν ⸀Ἰερουσαλὴμ περὶ αὐτῶν, καὶ ἐξαπέστειλαν ⸀Βαρναβᾶν ἕως Ἀντιοχείας·
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/022.yaml
  text: The report about them reached the ears of the church in Jerusalem[a], and they sent out Barnabas as far as Antioch.
translation:
  language: zh_hans
  text: 有关他们的消息传到了耶路撒冷教会的耳中[a]，教会便派巴拿巴前往安提阿[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“有关他们的消息被耶路撒冷的教会听见了”；原文直译为“有关他们的话被听进了耶路撒冷教会的耳中”。
    reason: 说明原文被动结构及“进入耳中”的习语表达。
  - marker: b
    text: “前往安提阿”也可译作“直到安提阿”或“远至安提阿”。
    reason: 保留ἕως可能表达行程所至或空间范围的语义。
lexical_decisions:
- source_word: ἠκούσθη
  choice: 传到了
  rationale: 原词为被动式“被听见”；与“进入耳中”的希腊语表达连用时，现代汉语用“传到了……耳中”既自然，也保留消息传到教会那里的含义。
- source_word: ὁ λόγος
  choice: 消息
  rationale: 这里指前文所述安提阿之事的消息，而非正式讲话，也不是特指神学意义上的“道”。
- source_word: εἰς τὰ ὦτα
  choice: 耳中
  rationale: 保留原文“进入耳中”的形象，同时与“传到了”组成自然的现代汉语表达。
- source_word: ἐκκλησίας
  choice: 教会
  rationale: 在《使徒行传》的语境中指基督徒群体；“教会”是现代汉语中通行且准确的译法。
- source_word: τῆς οὔσης ἐν Ἰερουσαλήμ
  choice: 耶路撒冷教会
  rationale: 该分词短语限定是哪一个教会；汉语自然地压缩为“耶路撒冷教会”，不损失信息。
- source_word: περὶ αὐτῶν
  choice: 有关他们的
  rationale: 保留复数代词的指向，不擅自将其限定为“这些事”；其具体所指由上文决定。
- source_word: ἐξαπέστειλαν
  choice: 派
  rationale: 该复合动词表示差派、派出；叙事中用“派”简洁自然，并表达有目的地差遣。
- source_word: Βαρναβᾶν
  choice: 巴拿巴
  rationale: 采用现代中文圣经传统中通行的人名音译。
- source_word: ἕως Ἀντιοχείας
  choice: 前往安提阿
  rationale: ἕως加地名在此可表达行程所至或目的地；“前往安提阿”符合汉语叙事习惯，其较贴字面的空间范围义收入脚注。
theological_decisions:
- issue: “派巴拿巴”的主语
  choice: 用“教会”明确承接耶路撒冷教会这一集体
  alternative: 译作“他们便派巴拿巴”，或理解为教会中的领袖执行差派
  rationale: 原文最近的明确先行词是“耶路撒冷的教会”，没有具体说是使徒或长老。汉语若用“他们”，容易误指前半句“有关他们”中的人，因此重复“教会”，既清楚又不引入原文未说明的治理主体。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“传到了……耳中”保留原文形象；第二分句重复“教会”，避免两个不同指向的复数代词在汉语中造成歧义。
