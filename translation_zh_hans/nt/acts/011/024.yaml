  text: ὅτι ἦν ἀνὴρ ἀγαθὸς καὶ πλήρης πνεύματος ἁγίου καὶ πίστεως. καὶ προσετέθη ὄχλος ἱκανὸς τῷ κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/024.yaml
  text: For he was a good man[a], full of the Holy Spirit and of faith. And a considerable crowd was added to the Lord.
translation:
  language: zh_hans
  text: 因为他是个好人，满有圣灵和信心[a]。并且，有一大群人归向主。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“满有圣灵和忠信。”希腊语“πίστις”也可表示“忠信”或“信靠”；正文采用通常的译法“信心”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 承接上文，说明巴拿巴受到称许的原因；“因为”自然保留了解释关系。
- source_word: ἀνὴρ ἀγαθὸς
  choice: 好人
  rationale: 指巴拿巴是品格良善的人；“好人”简明自然，不把含义限缩为“正直”或“仁慈”。
- source_word: πλήρης πνεύματος ἁγίου
  choice: 满有圣灵
  rationale: 符合现代汉语表达，并把πνεῦμα ἅγιον译为圣灵，而非仅指圣洁的性情。
- source_word: πίστεως
  choice: 信心
  rationale: “信心”是πίστις在此处稳妥的默认译法；鉴于这句话也在描述巴拿巴的品格，“忠信”仍是可能含义，故收入脚注。
- source_word: προσετέθη
  choice: 归入了
  rationale: 希腊文为被动式，表示人被增添到主那里；汉语若直译为“被加给主”极不自然，“归入了”较自然地保留归属关系。
- source_word: ὄχλος ἱκανὸς
  choice: 许多人
  rationale: ἱκανός在这里表示人数众多；汉语用“许多人”比“相当大的一群人”更自然。
- source_word: τῷ κυρίῳ
  choice: 主
  rationale: 原文明确以“主”为归入的对象，不改译为教会或群体。
theological_decisions:
- issue: πνεύματος ἁγίου所指
  choice: 圣灵
  alternative: 圣洁的灵或圣洁的性情
  rationale: 在《路加福音—使徒行传》的语境中，这一短语通常指神圣的圣灵；此处也描述巴拿巴受圣灵充满的生命。
- issue: πίστεως的含义
  choice: 信心
  alternative: 忠信
  rationale: 原词既可指信靠，也可在品格描述中表达忠信；正文采用常规译法“信心”，脚注保留另一合理理解。
- issue: προσετέθη ... τῷ κυρίῳ的归属对象
  choice: 归入了主
  alternative: 加入了教会或信徒群体
  rationale: 虽然加入信徒群体是上下文中可能蕴含的结果，原文明确说“归于主”，因此不以解释性对象取代原文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“满有圣灵”保留经文语体；“归入了主”兼顾原文对象与自然汉语，避免生硬直译“被加给了主”。
