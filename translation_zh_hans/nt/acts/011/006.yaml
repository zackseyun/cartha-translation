id: ACT.11.6
reference: Acts 11:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἰς ἣν ἀτενίσας κατενόουν καὶ εἶδον τὰ τετράποδα τῆς γῆς καὶ τὰ θηρία καὶ τὰ ἑρπετὰ καὶ τὰ πετεινὰ τοῦ οὐρανοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/006.yaml
  text: As I looked intently into it[a], I was considering it, and I saw the four-footed animals of the earth, the wild beasts, the reptiles, and the birds of the sky.
translation:
  language: zh_hans
  text: 我定睛往里面看，仔细观察，就看见地上的四足动物、野兽、爬行之物[a]和天空的飞鸟。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“爬行动物”。“爬行之物”更能保留原词较宽泛的分类含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἣν
  choice: 往里面
  rationale: 关系代词指向上文异象中的容器；介词εἰς配合表示凝视的动词，强调目光投向其内部，而不只是看着其表面。
- source_word: ἀτενίσας
  choice: 定睛……看
  rationale: 表达专注凝视的动作，既准确又符合现代汉语的庄重叙事语体。
- source_word: κατενόουν
  choice: 仔细观察
  rationale: 未完成时态表现持续察看的过程，并与随后简单陈述的“看见”区分开来。
- source_word: εἶδον
  choice: 看见
  rationale: 直接表达实际看到的内容，保留它与前面持续观察动作的区别。
- source_word: τὰ τετράποδα τῆς γῆς
  choice: 地上的四足动物
  rationale: 保留“四足”这一分类性表达和“地上的”这一修饰语，同时使用普通读者易懂的“动物”。
- source_word: τὰ θηρία
  choice: 野兽
  rationale: 体现θηρία所指的野生兽类，并维持原文列举中它与一般四足动物的区分。
- source_word: τὰ ἑρπετά
  choice: 爬行之物
  rationale: 此词范围可宽于现代生物分类中的“爬行动物”；“爬行之物”保留创造叙事及洁净条例分类用语的广度。
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: 天空的飞鸟
  rationale: 在具体动物分类的语境中，“天空”比“天”更明确；“飞鸟”自然地表达πετεινά。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事汉语；保留“定睛看—仔细观察—看见”的动作进展，并维持原文动物分类的列举结构。
