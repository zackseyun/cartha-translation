  text: Ἐγὼ ἤμην ἐν πόλει Ἰόππῃ προσευχόμενος καὶ εἶδον ἐν ἐκστάσει ὅραμα, καταβαῖνον σκεῦός τι ὡς ὀθόνην μεγάλην τέσσαρσιν ἀρχαῖς καθιεμένην ἐκ τοῦ οὐρανοῦ, καὶ ἦλθεν ἄχρι ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/005.yaml
  text: 'I was in the city of Joppa praying[a], and in a trance I saw a vision: something like a large sheet was coming down, being lowered from heaven by four corners[b], and it came to me.'
translation:
  language: zh_hans
  text: 我在约帕城里祷告时，在出神中看见了一个异象：有个东西[a]降下来，好像一大块布，从天上由四个角放下来，来到我这里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“有个器物”；希腊语在将它比作一大块布之前，使用了一个可泛指物件、器皿或容器的词。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγὼ ἤμην ἐν πόλει Ἰόππῃ προσευχόμενος
  choice: 我在约帕城里祷告时
  rationale: 保留“约帕城”和祷告这一持续动作；用“……时”自然表达分词与主句动作同时发生。显式代词Ἐγώ在上下文中略有强调，但现代汉语用“我”已足够，无须加“我本人”。
- source_word: ἐν ἐκστάσει ὅραμα
  choice: 在出神中看见了一个异象
  rationale: 分别保留ἐκστάσει所指的特殊意识状态和ὅραμα所指的异象，避免把两者合并，也避免使用容易令人联想到情绪狂喜的措辞。
- source_word: καταβαῖνον σκεῦός τι
  choice: 有个东西降下来
  rationale: σκεῦος可泛指器物、容器或物件，τι使表达不确定；“有个东西”不在后文将其比作大布之前过早限定类别。
- source_word: ὡς ὀθόνην μεγάλην
  choice: 好像一大块布
  rationale: ὀθόνη指大片布料或布单；“一大块布”在现代汉语中自然，又不擅自限定为麻布或床单。
- source_word: τέσσαρσιν ἀρχαῖς καθιεμένην ἐκ τοῦ οὐρανοῦ
  choice: 四角垂着，从天上放下
  rationale: ἀρχαί在此指布的四个端部或角；καθιεμένην为被动，表达它正被放下。“四角垂着”呈现可见形态，“从天上放下”保留来源和被动含义，同时避免误读为“天有四角”。
- source_word: ἦλθεν ἄχρι ἐμοῦ
  choice: 一直来到我这里
  rationale: ἄχρι表示运动达到彼得所在之处；“一直来到我这里”比单说“来到我这里”更明确地体现“直到、到达”的意味。
theological_decisions:
- issue: 如何表达异象经历而不夸大其神秘主义色彩
  choice: 在出神中看见了一个异象
  alternative: 在狂喜中看见异象；进入异象状态
  rationale: 原文同时使用ἐκστάσει和ὅραμα，分别陈述彼得所处的状态与所见内容。译文保留两者的区别，不把ἐκστάσις解释成情绪性的狂喜，也不将两个词压缩成一个概念。
- issue: “从天上”是空间来源还是纯粹指天空
  choice: 从天上放下
  alternative: 从天空放下
  rationale: 在使徒行传的启示性异象语境中，οὐρανός兼有垂直空间和属天来源的意味。“天上”保留这种张力，不把它缩减为普通气象意义的天空。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“出神”是当代中文圣经语境中较清楚的异象状态用语；“一大块布”比“一张大布单”更少限定具体用途。脚注标记置于其实际解释的“东西”和“放下”之后。
