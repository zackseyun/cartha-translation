  yaml_path: translation/nt/acts/011/004.yaml
  text: But Peter began and explained it to them in order[a], saying,
translation:
  language: zh_hans
  text: 彼得却按着次序[a]向他们解释起来，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“依次”，或“有条理地向他们陈述”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρξάμενος
  choice: 解释起来
  rationale: 该不定过去时中动态分词修饰主句动词，表示彼得开始作出解释。现代汉语用趋向补语“起来”自然表达动作的起始，避免生硬直译为“开始并解释”。
- source_word: δὲ
  choice: 却
  rationale: δέ承接上一节众人的责问，并引出彼得的回应，带有温和的转折意味；“却”在此简洁自然。
- source_word: Πέτρος
  choice: 彼得
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: ἐξετίθετο
  choice: 向他们解释
  rationale: ἐκτίθημι在此指把事情陈明、讲解；未完成时描写随后的持续陈述，中文结合“解释起来”自然呈现。
- source_word: αὐτοῖς
  choice: 向他们
  rationale: 与“解释”搭配，清楚表达复数间接受事者。
- source_word: καθεξῆς
  choice: 按着次序
  rationale: 该副词强调依次、有条理地叙述；“按着次序”既贴近原文，也符合现代汉语表达。
- source_word: λέγων
  choice: 说
  rationale: 现在时分词引出彼得随后直接陈述的内容，中文以“说：”自然衔接。
theological_decisions: []
