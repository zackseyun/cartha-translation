  text: καὶ ἰδοὺ ἐξαυτῆς τρεῖς ἄνδρες ἐπέστησαν ἐπὶ τὴν οἰκίαν ἐν ᾗ ⸀ἦμεν, ἀπεσταλμένοι ἀπὸ Καισαρείας πρός με.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/011.yaml
  text: And behold[a], immediately three men arrived at the house where we were, having been sent to me from Caesarea.
translation:
  language: zh_hans
  text: 看哪，就在那时[a]，有三名男子来到我们所在的那所房子；他们是奉差遣从凯撒利亚到我这里来的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“立即”，或“恰在那时”。
    reason: 说明ἐξαυτῆς既可强调行动立即发生，也可强调事情恰在当时发生。
lexical_decisions:
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留引人注意的话语标记及叙事的鲜明感；现代读者虽会感到略为庄重，但含义清楚。
- source_word: ἐξαυτῆς
  choice: 就在那时
  rationale: 表达事件紧接前文发生，并保留“立即、恰在那一刻”的时间强调；脚注列出更直接的译法。
- source_word: τρεῖς ἄνδρες
  choice: 三个人
  rationale: 准确表达人数；汉语“人”在此自然，人物的男性身份也可由上下文明确，无须使用较生硬的“三个男人”。
- source_word: ἐπέστησαν ἐπὶ τὴν οἰκίαν
  choice: 来到……那所房子
  rationale: 该语境中的动词表示来到并出现在某处；此译法符合现代汉语叙事习惯，也避免照字面译成“站在房子上”。
- source_word: ἐν ᾗ ἦμεν
  choice: 我们所在的
  rationale: 只陈述当时的位置，不额外加入“住宿”等原文未明说的信息。
- source_word: ἀπεσταλμένοι
  choice: 奉差遣
  rationale: 体现完成时被动分词所表达的先行差派及被动意味，同时保持汉语简洁。
- source_word: ἀπὸ Καισαρείας
  choice: 从凯撒利亚
  rationale: 按标准中文地名音译，并准确表达出发地。
- source_word: πρός με
  choice: 来找我的
  rationale: 在本语境中表达这些人受差遣前往彼得那里；“来找我”比机械的“到我这里”更自然，且未增加任务内容。
