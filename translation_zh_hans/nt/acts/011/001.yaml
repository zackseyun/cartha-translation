base_translation:
  language: en
  yaml_path: translation/nt/acts/011/001.yaml
  text: The apostles and the brothers who were throughout Judea heard that the Gentiles also had received the word of God[a].
translation:
  language: zh_hans
  text: 使徒和在犹太全地的弟兄们听说，外邦人也领受了上帝的道。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“弟兄姊妹”；希腊文直译为“弟兄们”，在这里可能广指同信的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤκουσαν
  choice: 听说
  rationale: 此处是听到一项消息；现代汉语用“听说”比单用“听见”更自然，并准确引出后面的消息内容。
- source_word: δὲ
  choice: 不单独译出
  rationale: 此处主要标示叙事转折或推进，并无强烈对比；汉语另加“这时”或“但是”会带入原文未明确表达的时间或对比色彩。
- source_word: οἱ ἀπόστολοι
  choice: 使徒
  rationale: 在《使徒行传》中指公认的使徒群体；“使徒”是准确且通行的圣经用语。
- source_word: οἱ ἀδελφοὶ
  choice: 弟兄们
  rationale: 保留希腊文阳性复数的表达；在此很可能广指同信群体，包括女性，故以脚注说明其代表性用法。
- source_word: οἱ ὄντες κατὰ τὴν Ἰουδαίαν
  choice: 遍布犹太地区的
  rationale: κατά加宾格在此有分布意义，“遍布”传达这些弟兄散处犹太各地，而不只是笼统地身在该地。
- source_word: καὶ τὰ ἔθνη
  choice: 外族人也
  rationale: 此处ἔθνη指犹太人以外的人，并非政治意义上的各国；“也”保留καί所强调的增添和出人意料的包容。
- source_word: ἐδέξαντο
  choice: 领受了
  rationale: δέχομαι与“上帝的道”搭配时表示接受、领受所传的信息；“领受”既自然，也保留其积极接纳的意味。
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: 上帝的道
  rationale: 保留早期基督徒常用表达的圣经语感和神学内涵，同时在现代汉语中简洁可懂。
theological_decisions:
- issue: 混合信徒群体中ἀδελφοὶ的译法
  choice: 弟兄们
  alternative: 弟兄姊妹；信徒们
  rationale: 正文保留原文阳性复数形式，不将其悄然改写为明确的双性表达；脚注同时说明该词在这里可能广指男女信徒，以保存原文形式与语境范围之间的张力。
translation_notes:
  register: 采用现代、庄重而通顺的简体中文。“犹太地区”避免现代读者把“犹太”误读为单指族群；“外族人”清楚表达非犹太人，又比音译或宗派化术语更易懂。脚注标记置于完整句末，且正文中明确出现[a]。
