  text: εἶπεν δὲ ⸂τὸ πνεῦμά μοι⸃ συνελθεῖν αὐτοῖς μηδὲν ⸀διακρίναντα. ἦλθον δὲ σὺν ἐμοὶ καὶ οἱ ἓξ ἀδελφοὶ οὗτοι, καὶ εἰσήλθομεν εἰς τὸν οἶκον τοῦ ἀνδρός.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/012.yaml
  text: And the Spirit told me to go with them[a], making no distinction. These six brothers also came with me, and we entered the man's house.
translation:
  language: zh_hans
  text: 圣灵吩咐我跟他们同去，不作分别[a]。这六位弟兄也和我一同去了；我们进了那人的家。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要犹豫”，或“不要疑惑”。这个希腊语分词既可表示不作区别，也可表示不动摇。
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ πνεῦμά
  choice: 圣灵
  rationale: 原文直译为“那灵”，在使徒行传这一启示和引导的语境中明确指圣灵；现代汉语用“圣灵”才能自然、清楚地表达所指，并非引入额外的位格判断。
- source_word: εἶπεν ... μοι
  choice: 吩咐我
  rationale: λέγω在此引出要求彼得采取行动的指示；“吩咐我”比“对我说”更自然地传达其指令作用。
- source_word: συνελθεῖν αὐτοῖς
  choice: 跟他们同去
  rationale: συνέρχομαι在此表示陪同那些人前往；“跟他们同去”准确、自然，并保留共同前往之意。
- source_word: μηδὲν διακρίναντα
  choice: 不要区别对待
  rationale: διακρίνω可指作出区分，也可指犹豫或疑惑。彼得正在为进入外族人的家申辩，因此正文采用与族群界限相合的“不要区别对待”；其他可能含义列入脚注。
- source_word: οἱ ἓξ ἀδελφοὶ οὗτοι
  choice: 这六位弟兄
  rationale: 这里所指是与彼得同行的六名男性信徒；“弟兄”保留教会群体中的亲属称谓，“这”对应οὗτοι。
- source_word: εἰσήλθομεν
  choice: 我们进了
  rationale: 简洁表达不定过去时所叙述的已发生动作，也符合现代汉语叙事习惯。
- source_word: τὸν οἶκον τοῦ ἀνδρός
  choice: 那人的家
  rationale: 保留原文明确出现的“人”而不改作代词；“那人的家”在汉语中比“那人的房屋”自然，并承接前文所说的哥尼流。
theological_decisions:
- issue: 彼得叙述中μηδὲν διακρίναντα的含义
  choice: 不要区别对待
  alternative: 不要犹豫；不要疑惑
  rationale: 上下文聚焦于彼得跨越犹太人与外族人之间的界限，并为此行动申辩，因此“不要区别对待”较能呈现此处的叙事和神学重点。不过，希腊语也确实可表示不犹豫或不疑惑，故以脚注保留这些可能，不将歧义静默消除。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“吩咐”体现指令语气；“弟兄”保留初期教会群体的称谓；正文简洁顺畅，同时用脚注保存关键词的真实歧义。
