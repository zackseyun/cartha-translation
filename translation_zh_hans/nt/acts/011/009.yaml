  yaml_path: translation/nt/acts/011/009.yaml
  text: But a voice answered from heaven a second time[a], ‘What God has made clean, you must not call common.’
translation:
  language: zh_hans
  text: 但从天上有声音第二次回答说：“神所洁净的，你不可当作俗物。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你不可看作不洁净的”，或“你不可称为污秽”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: 回答说
  rationale: ἀποκρίνομαι在叙事中表示“回答、回应”；“回答说”自然承接彼得先前的话。
- source_word: φωνὴ ἐκ δευτέρου
  choice: 第二次有声音
  rationale: 保留φωνή的不定指性质，并准确表达ἐκ δευτέρου“第二次”的含义。
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: 从天上
  rationale: 此处指声音来自天上，而非仅指可见的天空。
- source_word: Ἃ ὁ θεὸς ἐκαθάρισεν
  choice: 神所洁净的
  rationale: 以自然的汉语关系结构表达中性复数关系代词ἅ；“洁净”保留καθαρίζω的礼仪洁净语境。
- source_word: σὺ μὴ κοίνου
  choice: 你不可当作俗物
  rationale: 显明σὺ所指向的“你”，并以“当作俗物”保留κοινόω与洁净相对的“视为凡俗、不洁”这一礼仪类别含义。
theological_decisions:
- issue: κοινόω所含洁净类别的细微差别
  choice: 当作俗物
  alternative: 看作不洁净的；称为污秽
  rationale: κοινόω在犹太洁净语境中主要表示把某物视为“凡俗的”，与神已经“洁净”的行动形成对照。正文保留这一类别差别，脚注说明其语境含义，避免把它直接等同于另一希腊词“不洁净”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“俗物”略带礼仪术语色彩，用来保留原文κοινόω的概念张力，并由脚注帮助普通读者理解。
