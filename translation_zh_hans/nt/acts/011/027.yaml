  text: In those days prophets came down from Jerusalem to Antioch[a].
translation:
  language: zh_hans
  text: 那些日子，有几位先知从耶路撒冷下到安提阿[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从耶路撒冷下去到安提阿。”原文动词含有向下移动之意；按叙述视角，汉语可说“下来”或“下去”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ταύταις δὲ ταῖς ἡμέραις
  choice: 那些日子
  rationale: 以自然简洁的现代汉语保留时间框架；δέ仅有轻微承接作用，不另译为“现在”或“但”。
- source_word: προφῆται
  choice: 有几位先知
  rationale: “先知”直接对应原词，并保留其在早期教会中的宽泛含义；希腊语无冠词的复数名词在此自然表示若干人，汉语用“有几位”使句子通顺，不规定确切人数。
- source_word: κατῆλθον
  choice: 下到
  rationale: 保留κατέρχομαι所含的“下去／下来”空间或地理意味；汉语“从……下到……”自然表达由耶路撒冷前往目的地，不必强行固定为朝向说话者的“下来”。
- source_word: ἀπὸ Ἱεροσολύμων
  choice: 从耶路撒冷
  rationale: ἀπό表示起点；地名按现代汉语惯例译为“耶路撒冷”。
- source_word: εἰς Ἀντιόχειαν
  choice: 到安提阿
  rationale: εἰς在这里表示移动的目的地；“到安提阿”是现代汉语中自然的城市目的地表达。
theological_decisions:
- issue: 安提阿与耶路撒冷教会语境中“先知”的性质
  choice: 仅译作“先知”，不进一步界定其职分
  alternative: 先知教师；受感动的传讲者；受默示的使者
  rationale: 原文只使用通常的προφῆται，并未在本节说明其事工范围。保留“先知”可避免把他们限定为旧约式正典先知或仅是有恩赐的讲道人。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“那些日子”承接上文；“有几位先知”符合汉语信息结构。“下到”既保留原文移动方向，也避免在“下来／下去”之间作不必要的视角限定。
