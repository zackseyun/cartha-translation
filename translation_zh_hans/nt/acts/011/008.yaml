id: ACT.11.8
reference: Acts 11:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἶπον δέ· Μηδαμῶς, κύριε, ⸀ὅτι κοινὸν ἢ ἀκάθαρτον οὐδέποτε εἰσῆλθεν εἰς τὸ στόμα μου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/008.yaml
  text: But I said, ‘By no means, Lord, because nothing common or unclean has ever entered my mouth.’
translation:
  language: zh_hans
  text: 我却说：‘主啊，绝对不可！因为凡是俗物或不洁之物，从来没有进过我的口。’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μηδαμῶς
  choice: 绝对不可
  rationale: 表达强烈、断然的拒绝，符合彼得对异象中命令的回应。
- source_word: κύριε
  choice: 主啊
  rationale: 保留呼格语气及原文对说话者的称呼；此处不进一步限定所指，以保留语境中的含义。
- source_word: ὅτι
  choice: 因为
  rationale: 按其因果功能翻译，引出彼得拒绝的理由。
- source_word: κοινὸν
  choice: 俗物
  rationale: 在礼仪洁净语境中指未分别为圣、因而不宜食用之物；译作“俗物”以区别于随后明确的“不洁之物”，并保留二者并列。
- source_word: ἀκάθαρτον
  choice: 不洁之物
  rationale: 保留犹太礼仪与饮食规范中的“不洁”概念。
- source_word: εἰσῆλθεν εἰς τὸ στόμα μου
  choice: 进过我的口
  rationale: 贴近原文的身体意象，同时在现代汉语中自然表达“吃过”。
theological_decisions:
- issue: κοινὸν 与 ἀκάθαρτον 的关系
  choice: 分别译为“俗物或不洁之物”
  alternative: 合并为“不洁净的东西”
  rationale: 原文以 ἢ 并列两个不同形容词；分别翻译可保留礼仪上“凡俗”和“本质不洁”的潜在区别，不预先消解经文张力。
- issue: κύριε 所指
  choice: 仅译“主啊”
  alternative: 明确译为“主耶稣啊”或其他特定身份
  rationale: 原文没有在本句中明说称呼对象的身份，因此不作超出文本的限定。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“绝对不可”体现强烈否定；“俗物或不洁之物”略带经文礼仪术语色彩，但普通读者仍可理解，并保留原文的两个范畴。
