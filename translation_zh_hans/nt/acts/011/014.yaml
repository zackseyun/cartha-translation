  text: ὃς λαλήσει ῥήματα πρὸς σὲ ἐν οἷς σωθήσῃ σὺ καὶ πᾶς ὁ οἶκός σου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/014.yaml
  text: He will speak words to you by which you and all your household will be saved[a].
translation:
  language: zh_hans
  text: 他要对你说一些话，借着这些话，你和你全家都将得救[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在这些话中”或“通过这些话”；希腊语表达可指这些话是得救所经由的媒介。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: 他
  rationale: 关系代词承接上文所提到的人；汉语在新句起首用“他”更自然，也不改变所指。
- source_word: λαλήσει
  choice: 要……说
  rationale: 未来时的 λαλέω 表示将要说话；“要……说”既自然，又保留尚未发生的意味。
- source_word: ῥήματα
  choice: 一些话
  rationale: 保留复数 ῥήματα 的具体“话语”含义；不用较概括的“信息”，以免弱化原文措辞。
- source_word: πρὸς σὲ
  choice: 对你
  rationale: πρός 加宾格与言说动词连用，表示话语朝向听者；“对你说”是现代汉语的自然表达。
- source_word: ἐν οἷς
  choice: 借着这些话
  rationale: 此处 ἐν 可表达媒介或凭借；“借着”清楚表明这些话是得救所经由的媒介，同时脚注保留其他可能的直译。
- source_word: σωθήσῃ
  choice: 将得救
  rationale: σῴζω 的将来被动式；在使徒行传此语境中，“得救”准确保留其救恩含义。
- source_word: σὺ
  choice: 你
  rationale: 保留原文明确出现的第二人称主语，并置于与“你全家”并列的结构中。
- source_word: πᾶς ὁ οἶκός σου
  choice: 你全家
  rationale: οἶκος 在此指家庭成员组成的家户，而不是房屋；“你全家”自然表达整体范围。
theological_decisions:
- issue: 哥尼流家户语境中“得救”的含义
  choice: 译作“得救”，表明救恩借着所宣讲的话临到，但不进一步规定其机制。
  alternative: 获救／被拯救
  rationale: 上下文关乎听见福音并领受救恩；“得救”保留救恩论含义，同时不加入本节没有明说的后期教义表述。
- issue: “你全家”的范围
  choice: 按原文整体译作“你全家”，不解释为家庭成员无需回应便自动得救。
  alternative: 你的全家人／你的整个家户
  rationale: 原文陈明应许涉及全家，却未在本节逐一说明每位成员参与救恩的方式；译文保留这一张力，不导入宗派性结论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“说一些话”贴近原文的复数名词结构；“借着这些话”在汉语中自然表达工具或媒介关系。
