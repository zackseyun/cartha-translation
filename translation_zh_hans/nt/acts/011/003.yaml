lexical_decisions:
- source_word: λέγοντες
  choice: 说
  rationale: 现在时分词承接上文并引出指控内容；汉语用“说”自然保留叙事连接。
- source_word: ὅτι
  choice: ：“”
  rationale: 此处引出直接引语，现代汉语以冒号和引号表达最自然。
- source_word: Εἰσῆλθες πρὸς
  choice: 你进了……的家
  rationale: εἰσέρχομαι 与 πρός 加人表示进入他们所在之处或与他们交往；汉语“进了……的家”具体自然，也保留指控其越过群体边界的意味。
- source_word: ἄνδρας ἀκροβυστίαν ἔχοντας
  choice: 未受割礼之人
  rationale: 保留原文以割礼这一盟约标记描述对方的措辞，不直接释为“外邦人”；“之人”庄重而不生硬。
- source_word: καὶ
  choice: 还
  rationale: 在指控中连接并递进第二项行为，汉语用“还”比单纯“和”更自然地传达语气。
- source_word: συνέφαγες αὐτοῖς
  choice: 和他们一起吃饭
  rationale: 准确表达 συνεσθίω 的共同进食含义，也符合现代汉语习惯。
theological_decisions:
- issue: 是否把 ἀκροβυστίαν ἔχοντας 直接译为“外邦人”
  choice: 未受割礼之人
  alternative: 外邦人
  rationale: 原指控刻意诉诸割礼这一犹太盟约与群体边界标记；保留“未受割礼”可呈现其社会和神学张力，避免替原文作解释。
- issue: 是否弱化共同进食所体现的边界冲突
  choice: 还和他们一起吃饭
  alternative: 并与他们交往
  rationale: 原文明确指共同进食，直译有助于保留当时餐桌团契所引发的争议，不泛化为一般交往。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“未受割礼之人”保留原文带有群体边界色彩的称呼；“进了……的家”按汉语习惯补足场所含义，但不扩展为更具体的礼仪判断。
