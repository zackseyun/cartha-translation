  yaml_path: translation/nt/acts/011/025.yaml
  text: Then he went out to Tarsus to look for Saul,[a]
translation:
  language: zh_hans
  text: 于是，他到大数去寻找扫罗。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“搜寻扫罗”或“设法找到扫罗”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: 到……去
  rationale: 该词是不定过去时，基本义为“出去、前往”。结合 εἰς Ταρσόν 表示目的地，汉语用“到大数去”自然地表达向该城移动；没有另译“出去”，以免形成生硬的方向重复。
- source_word: δὲ
  choice: 于是
  rationale: 此处 δέ 是推动叙事的轻微连接词，并不表示明显转折。“于是”符合现代汉语叙事习惯，也保留事件向前发展的关系。
- source_word: εἰς Ταρσόν
  choice: 到大数
  rationale: 介词 εἰς 与移动动词连用，表示目的地。“到大数”准确而自然；“大数”采用该城名的通行中文译法。
- source_word: ἀναζητῆσαι
  choice: 去寻找
  rationale: 不定式表示目的。ἀναζητέω 可指寻找、搜寻；正文用“寻找”既自然又不预设寻找过程的强度，其他可能的力度见脚注。
- source_word: Σαῦλον
  choice: 扫罗
  rationale: 采用该人名在中文圣经传统中的通行音译。
theological_decisions: []
