  text: ⸂ὅτε δὲ⸃ ἀνέβη Πέτρος εἰς ⸀Ἰερουσαλήμ, διεκρίνοντο πρὸς αὐτὸν οἱ ἐκ περιτομῆς
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/002.yaml
  text: But when Peter went up to Jerusalem[a], those of the circumcision were disputing with him.
translation:
  language: zh_hans
  text: 可是，彼得上耶路撒冷去的时候，那些属于割礼一方的人[a]跟他争辩。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“那些出于割礼的人”，也可译作“那些受过割礼的人”“属于割礼的人”或“割礼派的人”。希腊文按他们与割礼的关联来界定这一群体；“一方”不一定表示正式派别。
    reason: 说明οἱ ἐκ περιτομῆς的字面表达和可能指涉，避免将该群体过度限定为正式派别、所有受割礼者，或明确的割礼倡导者。
lexical_decisions:
- source_word: ὅτε δὲ
  choice: 可是……的时候
  rationale: δέ在这里推动叙事，并带有轻微转折；“可是”保留这一衔接作用，“……的时候”对应ὅτε。
- source_word: ἀνέβη
  choice: 上……去
  rationale: ἀναβαίνω与耶路撒冷连用时通常表示“上去”，既可反映地势，也符合前往耶路撒冷的惯常表达。
- source_word: Ἰερουσαλήμ
  choice: 耶路撒冷
  rationale: 采用现代中文圣经传统中通行的地名译法。
- source_word: διεκρίνοντο
  choice: 争辩
  rationale: 此处指向彼得提出异议并与他发生言语争论，不只是心里疑惑；未完成时态呈现当时正在发生的争辩。
- source_word: πρὸς αὐτόν
  choice: 跟他
  rationale: πρός加宾格与争辩类动词连用，表示争论所针对和交涉的对象；“跟他争辩”自然且不额外强化敌意。
- source_word: οἱ ἐκ περιτομῆς
  choice: 那些奉行割礼的人
  rationale: 原文按人与割礼的关联来界定一群人。“奉行割礼”比单纯“受过割礼”更能体现此处的群体立场，同时不像“割礼派”那样断定他们已构成正式派别；脚注保留其他可能理解。
theological_decisions:
- issue: οἱ ἐκ περιτομῆς所指群体的身份
  choice: 以割礼为身份标志或立场特征、并向彼得提出异议的一群人
  alternative: 所有犹太信徒；正式的“割礼派”；泛指一切受过割礼的人
  rationale: 希腊文强调该群体与割礼的关联，却没有明确说明其组织程度。“那些奉行割礼的人”保留群体特征，同时避免把他们武断地界定为后来意义上的正式派别。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“上耶路撒冷去”保留原文常见的地理表达；“跟他争辩”清楚呈现公开异议而不夸大敌意。脚注标记紧随其所解释的“那些奉行割礼的人”。
