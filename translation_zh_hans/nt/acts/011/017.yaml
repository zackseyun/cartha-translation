  text: εἰ οὖν τὴν ἴσην δωρεὰν ἔδωκεν αὐτοῖς ὁ θεὸς ὡς καὶ ἡμῖν πιστεύσασιν ἐπὶ τὸν κύριον Ἰησοῦν Χριστόν, ⸀ἐγὼ τίς ἤμην δυνατὸς κωλῦσαι τὸν θεόν;
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/017.yaml
  text: If then God gave to them the same gift as also to us who believed in the Lord Jesus the Messiah[b][a], who was I that I could hinder God?
translation:
  language: zh_hans
  text: 那么，上帝既然把同样的恩赐赐给他们，如同赐给我们这些信靠主耶稣这位弥赛亚的人一样[a]，我又是谁，竟能拦阻上帝呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“如同赐给我们在信靠主耶稣这位弥赛亚时所得的一样。”希腊文分词可作对“我们”的描述，也可在此带有时间意味。“弥赛亚”也常译作“基督”。
    reason: 保留πιστεύσασιν修饰ἡμῖν的描述性理解及其可能的时间性，并说明Χριστός的传统译法。
lexical_decisions:
- source_word: ἴσην δωρεάν
  choice: 同样的恩赐
  rationale: ἴσην 表示相等、相同；“同样的恩赐”自然地表达外族信徒与犹太信徒所得恩赐并无差别。
- source_word: πιστεύσασιν ἐπὶ τὸν κύριον Ἰησοῦν Χριστόν
  choice: 我们这些信靠主耶稣弥赛亚的人
  rationale: 过去时分词 πιστεύσασιν 与 ἡμῖν 同为与格复数，首先描述“我们”是信靠者；ἐπί 加宾格在此指信靠所指向的对象。译作“信靠”比单用“相信”更能体现这种指向与倚赖，同时不强行限定恩赐与信靠之间精确的时间次序。
- source_word: κύριον
  choice: 主
  rationale: κύριον 在此是耶稣的尊称，译作“主”既符合语境，也保留基督论意味。
- source_word: Χριστόν
  choice: 弥赛亚
  rationale: Χριστός 在这一完整称号中仍有“受膏者”的头衔意义；“弥赛亚”保留其犹太救主期待的语义，而不把它仅当作姓名的一部分。
- source_word: ἐγὼ τίς ἤμην δυνατὸς
  choice: 我又是谁，竟能
  rationale: 这一反问突出说话者在上帝行动面前无权也无力抗拒；“我又是谁，竟能……”是自然、庄重的现代汉语表达。
- source_word: κωλῦσαι τὸν θεόν
  choice: 拦阻上帝
  rationale: 保留原文以“上帝”为 κωλῦσαι 直接宾语的强烈表达，指出阻挡外族人领受恩赐就是企图拦阻上帝本人。
theological_decisions:
- issue: πιστεύσασιν 与 ἡμῖν 的关系及其时间含义
  choice: 译作“我们这些信靠……的人”
  alternative: “我们信靠……的时候”
  rationale: 原文分词在语法上修饰“我们”，本身可容纳描述性或伴随时间意味。正文采用描述性译法，避免把恩赐与信靠的时间关系规定得比原文更精确；脚注提示可行的时间性理解。
- issue: Χριστόν 在“主耶稣Χριστός”中的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处头衔意义仍然鲜明，译作“弥赛亚”可显明“受膏者”的救赎历史背景；“基督”作为传统音意结合译名仍属可行，列入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“所以，既然”对应 εἰ οὖν 的推论语气；“我又是谁，竟能……呢”保留彼得反问中的自谦和力度。脚注标记已置于相关分句之后。
