  rationale: 仅作两项安全的语言性调整：使“讲述他怎样”更顺畅，并以“派人……叫……来”更贴切地表达连续的祈使命令及μετάπεμψαι的差遣语义。其余内容、特指程度和名称均予保留；本节无须增设脚注。
