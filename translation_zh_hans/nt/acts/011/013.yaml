review_pass:
  verdict: revise
  source_fidelity: 译文准确传达了哥尼流向彼得一行人讲述自己看见天使、天使站在他家中并发出两项命令的内容；“派人到约帕去”也没有从平行叙事补入原文此处未明说的“几个人”。不过，“请……来”在现代汉语中容易带出礼貌邀请的语气，较弱于μετάπεμψαι（派人叫／派人去请某人来）的命令性和差遣意味。
  naturalness: “他向我们讲述，他怎样……”在现代书面汉语中逗号后的停顿略显生硬；删去该逗号即可。将引语中的“请……来”调整为“叫……来”，与前面的“派人”搭配更紧密、语气也更符合命令句。
  terminology: “约帕”、“西门”和“彼得”均为通行且恰当的名称译法。“那位天使”可自然表达上下文中特指的天使，无须改动。
  issues:
