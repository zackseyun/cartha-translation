  text: ἀπήγγειλεν ⸀δὲ ἡμῖν πῶς εἶδεν τὸν ἄγγελον ἐν τῷ οἴκῳ αὐτοῦ σταθέντα καὶ ⸀εἰπόντα· Ἀπόστειλον εἰς ⸀Ἰόππην καὶ μετάπεμψαι Σίμωνα τὸν ἐπικαλούμενον Πέτρον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/013.yaml
  text: And he reported to us how he had seen the angel standing in his house and saying[a], ‘Send to Joppa and summon Simon, who is called Peter.’
translation:
  language: zh_hans
  text: 他向我们讲述他怎样看见那位天使站在他家里，说：“派人到约帕去，叫那称为彼得的西门来。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπήγγειλεν
  choice: 讲述
  rationale: 表示把所见之事转告并叙述给别人；“讲述”符合口述见闻的叙事语境，也比“报告”更自然。
- source_word: δὲ
  choice: （不另译）
  rationale: 此处是轻微的叙事连接词；汉语承接上下文时可不明译，避免生硬加入“而”或“于是”。
- source_word: πῶς
  choice: 怎样
  rationale: 保留原文引出所见经过的方式或内容色彩，不简化为单纯的“说他看见”。
- source_word: εἶδεν
  choice: 看见
  rationale: 汉语无需以过去完成时标示先于“讲述”的动作，时间先后由语境自然呈现。
- source_word: τὸν ἄγγελον
  choice: 那位天使
  rationale: 定冠词在语篇中指向哥尼流异象里那位特定的天使；“那位”既体现特指，也保持尊重而自然的表达。
- source_word: ἐν τῷ οἴκῳ αὐτοῦ
  choice: 在他家里
  rationale: 直接表达天使显现的地点；“家里”比“房屋中”更符合现代汉语叙事。
- source_word: σταθέντα
  choice: 站
  rationale: 表达天使在异象中的姿态；与“说”并列，形成自然紧凑的汉语结构。
- source_word: εἰπόντα
  choice: 说
  rationale: 与“站”共同说明所看见的天使及其行动，保留原文两个分词的关联而不使句子欧化。
- source_word: Ἀπόστειλον
  choice: 派人
  rationale: 原文命令“派遣”，宾语未明说；汉语必须较明确地表达派遣这一动作。“派人”未指定人数或身份，只将隐含施事自然显明。
- source_word: εἰς Ἰόππην
  choice: 到约帕去
  rationale: 表示目的地；“约帕”采用现代中文圣经中通行的地名译法。
- source_word: μετάπεμψαι
  choice: 请……来
  rationale: 该中动词意为派人把某人叫来、请来；“请……来”在现代汉语中自然表达使对方前来的结果，又避免“召来”可能带出的权威命令色彩。
- source_word: τὸν ἐπικαλούμενον Πέτρον
  choice: 那称为彼得的西门
  rationale: 按原文以“西门”为核心名称，以“称为彼得”加以辨认；保留彼得是其称呼这一信息。
