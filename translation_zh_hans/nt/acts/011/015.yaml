  text: ἐν δὲ τῷ ἄρξασθαί με λαλεῖν ἐπέπεσεν τὸ πνεῦμα τὸ ἅγιον ἐπ’ αὐτοὺς ὥσπερ καὶ ἐφ’ ἡμᾶς ἐν ἀρχῇ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/015.yaml
  text: And as I began to speak[c][b][a], the Holy Spirit fell on them just as it had on us at the beginning.
translation:
  language: zh_hans
  text: 我刚开始说话[a]，圣灵就降在他们身上，正像起初也降在我们身上一样[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“当我开始说话时”。原文结构既可表达“正当……时”，也可表达“当……时”。
    reason: lexical_alternative
  - marker: b
    text: “起初”很可能指圣灵最初降临在门徒身上的时候，也就是五旬节。参使徒行传2章。
    reason: cross_reference
lexical_decisions:
- source_word: ἐν δὲ τῷ ἄρξασθαί με λαλεῖν
  choice: 我刚开始说话
  rationale: ἐν加冠词化不定式在这里表示与主句同时发生的时间，可译为“当……时”或“正……的时候”；“刚开始”自然地表达圣灵是在彼得开口之初便降下。δέ在叙事衔接中不必机械译出。
- source_word: ἐπέπεσεν
  choice: 就降在
  rationale: ἐπιπίπτω与ἐπί连用，生动表示圣灵临到人。“降在”保留原文意象；“就”体现事件紧接彼得开始说话而发生。
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: 圣灵
  rationale: 这是现代汉语中对该希腊称谓准确、通行且庄重的表达。
- source_word: ὥσπερ καὶ ἐφ’ ἡμᾶς
  choice: 正像……也降在我们身上一样
  rationale: ὥσπερ表示明确而紧密的比较，καί表示“也”；汉语补出前文隐含的动词，使对照自然清楚，同时保留两次经历的对应关系。
- source_word: ἐν ἀρχῇ
  choice: 起初
  rationale: 直译其时间意义，不在正文中把所指事件解释得过窄；结合上下文，很可能指门徒最初经历圣灵降临之时。
theological_decisions:
- issue: “起初”（ἐν ἀρχῇ）所指的事件
  choice: 正文保留概括性的“起初”，脚注说明很可能指五旬节时圣灵最初降临在门徒身上
  alternative: 泛指早先或最初，而不明确联系五旬节
  rationale: 彼得是在比较哥尼流一家与“我们”的经历，使徒行传的叙事背景强烈指向五旬节；但原文本身只说“起初”，所以正文不直接加入“五旬节”。
- issue: 圣灵“降在”人的表述
  choice: 保留原文“降在……身上”的意象
  alternative: 译为“临到”或“降临在”
  rationale: 这样既反映ἐπέπεσεν的生动表达，也避免额外界定这一经历的性质或模式。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“刚……就……”清楚呈现两件事紧接发生；“正像……一样”自然传达原文的比较结构。正文保留“起初”的开放性，以免把脚注中的可能所指直接写入经文。
