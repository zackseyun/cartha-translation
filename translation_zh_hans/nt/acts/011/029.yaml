  text: τῶν δὲ μαθητῶν καθὼς εὐπορεῖτό τις ὥρισαν ἕκαστος αὐτῶν εἰς διακονίαν πέμψαι τοῖς κατοικοῦσιν ἐν τῇ Ἰουδαίᾳ ἀδελφοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/029.yaml
  text: So the disciples determined[a], each according to his ability[b], to send relief to the brothers living in Judea.
translation:
  language: zh_hans
  text: 于是，门徒们决定，各人按自己的能力[a]，给住在犹太地的弟兄们[b]送去援助。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“各人按照自己的经济状况”或“各人量力而行”。
    reason: lexical_alternative
  - marker: b
    text: “弟兄们”在这里很可能指住在犹太地的信徒群体，可能包括男女信徒。
    reason: lexical_alternative
lexical_decisions:
- source_word: μαθητῶν
  choice: 门徒们
  rationale: 这是《使徒行传》中对耶稣跟随者的常用称呼；“门徒”准确、通行，也符合现代中文圣经语体。
- source_word: καθὼς εὐπορεῖτό τις
  choice: 各人按自己的能力
  rationale: 该短语表示各人按照自己拥有的财力或资源行事；结合后面的ἕκαστος αὐτῶν，用“各人按自己的能力”自然地表达按个人经济条件量力而行。
- source_word: ὥρισαν
  choice: 决定
  rationale: ὁρίζω在此指作出决定或定意；“决定”保留其审慎决断之意，同时符合现代普通话。
- source_word: ἕκαστος αὐτῶν
  choice: 各人
  rationale: 保留原文逐一分配的含义；“他们中的”在中文语境中无需明说。
- source_word: εἰς διακονίαν πέμψαι
  choice: 送去援助
  rationale: διακονία在此指为有需要的信徒提供实际帮助，πέμψαι指送出；“送去援助”自然表达上下文中的赈济行动，又不限定援助的具体形式。
- source_word: τοῖς κατοικοῦσιν ἐν τῇ Ἰουδαίᾳ
  choice: 给住在犹太的
  rationale: 直接表达分词短语“那些住在犹太的人”，中文简洁自然。
- source_word: ἀδελφοῖς
  choice: 弟兄们
  rationale: 保留希腊文阳性复数的亲属称谓及初期教会的群体用语；其在语境中可能涵盖整个信徒群体，另以脚注说明。
theological_decisions:
- issue: ἀδελφοῖς是否仅指男性，还是泛指犹太地区的信徒群体
  choice: 正文译作“弟兄们”
  alternative: 弟兄姊妹；信徒同伴
  rationale: 原文采用阳性复数ἀδελφοῖς，而早期基督徒用语中该词也可泛指男女信徒。正文保留原文形式，脚注说明可能的包容范围，不在翻译中消除这一张力。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“于是”承接上文，“送去援助”清楚表达实际赈济，却不擅自限定援助是金钱、食物或其他物资。
