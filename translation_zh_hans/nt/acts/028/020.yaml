  text: διὰ ταύτην οὖν τὴν αἰτίαν παρεκάλεσα ὑμᾶς ἰδεῖν καὶ προσλαλῆσαι, ἕνεκεν γὰρ τῆς ἐλπίδος τοῦ Ἰσραὴλ τὴν ἅλυσιν ταύτην περίκειμαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/020.yaml
  text: For this reason[a], therefore, I asked to see you and to speak with you, for it is because of the hope of Israel that I am wearing this chain.
translation:
  language: zh_hans
  text: 因此，我为了这个缘故请你们来会面交谈；因为我是为了以色列的盼望[a]戴着这条锁链。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 另译“以色列所怀的盼望”。这里很可能指保罗所宣讲的、与上帝的约和复活有关的盼望。
    reason: 说明属格结构的另一种理解，同时不在正文中限定这盼望的具体所指。
lexical_decisions:
- source_word: διὰ ταύτην οὖν τὴν αἰτίαν
  choice: 所以，我就是为这缘故
  rationale: “所以”表达οὖν的推论作用，“为这缘故”保留明确的因果短语；用“就是”使二者在现代汉语中衔接自然，并保留原文略带强调的逻辑连接。
- source_word: παρεκάλεσα ὑμᾶς ἰδεῖν καὶ προσλαλῆσαι
  choice: 请你们来见面交谈
  rationale: παρεκάλεσα在这里指请求或邀请当地犹太领袖前来；“见面交谈”自然表达ἰδεῖν和προσλαλῆσαι所指的会面与双向谈话。补出“来”符合叙事情境，却不改变请求的内容。
- source_word: ἕνεκεν γὰρ
  choice: 因为我正是为
  rationale: “因为”保留γάρ的解释作用，“为”表达ἕνεκεν的缘由，“正是”突出这缘由与保罗所戴锁链之间的直接关系。
- source_word: τῆς ἐλπίδος τοῦ Ἰσραήλ
  choice: 以色列的盼望
  rationale: 保持属格短语的简洁与开放性，不在正文中把它限定为复活、弥赛亚或某一项盟约应许。
- source_word: τὴν ἅλυσιν ταύτην περίκειμαι
  choice: 戴着这条锁链
  rationale: 单数“这条锁链”对应原文；“戴着”传达περίκειμαι所含‘环绕、加在身上’的具体形象，避免仅作抽象的“被囚”。
theological_decisions:
- issue: “以色列的盼望”的具体所指
  choice: 以色列的盼望
  alternative: 以色列所盼望的；以色列对复活的盼望；以色列对弥赛亚的盼望
  rationale: 该短语可能涵盖赐给以色列的盟约性盼望，并在本书语境中涉及复活和弥赛亚，但希腊文保持凝练而含蓄；正文不把它缩窄为单一教义所指。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“见面交谈”避免生硬直译，“戴着这条锁链”则保留保罗言语中的具体形象。
