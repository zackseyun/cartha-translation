id: ACT.28.6
reference: Acts 28:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οἱ δὲ προσεδόκων αὐτὸν μέλλειν πίμπρασθαι ἢ καταπίπτειν ἄφνω νεκρόν. ἐπὶ πολὺ δὲ αὐτῶν προσδοκώντων καὶ θεωρούντων μηδὲν ἄτοπον εἰς αὐτὸν γινόμενον, ⸀μεταβαλόμενοι ἔλεγον ⸂αὐτὸν εἶναι θεόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/006.yaml
  text: But they were expecting him to swell up or suddenly fall down dead. But after they had waited a long time and saw that nothing unusual was happening to him[a], they changed their minds and began saying that he was a god.
translation:
  language: zh_hans
  text: 他们以为保罗会肿起来，或是突然倒地而死。可是，他们等了很久，见他没有出现任何异常[a]，就改变了看法，说他是个神。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “没有出现任何异常”也可译作“没有发生什么反常的事”或“没有什么不妥”。
    reason: 词语ἄτοπον的含义较宽，可指异常、反常或不妥；正文不宜过度限定。
lexical_decisions:
- source_word: προσεδόκων
  choice: 以为……会
  rationale: 未完成时表示他们持续预期某种结果；现代汉语用“以为……会”自然地表达这种预期。
- source_word: πίμπρασθαι
  choice: 肿起来
  rationale: 该词本可与燃烧、发炎有关，但在毒蛇咬伤的语境中指身体肿胀最为贴切。
- source_word: καταπίπτειν ἄφνω νεκρόν
  choice: 突然倒地而死
  rationale: 同时保留突然性、倒下的动作和死亡的结果，且避免口语色彩过重。
- source_word: ἐπὶ πολὺ
  choice: 等了很久
  rationale: 结合 προσδοκώντων，将持续一段很长时间的等候明确而自然地译出。
- source_word: θεωρούντων
  choice: 见
  rationale: 该词表示仔细观察；在本句中，简洁的“见”表达观察后所得的认知。
- source_word: μηδὲν ἄτοπον
  choice: 没有发生任何异常
  rationale: ἄτοπος 可指反常、不寻常或不妥；这里保留宽泛含义，不限定为伤害。
- source_word: μεταβαλόμενοι
  choice: 改变了看法
  rationale: 表示他们的判断发生逆转；“改变了看法”比单说“改变”明确，也符合庄重的现代汉语。
- source_word: ἔλεγον
  choice: 说
  rationale: 未完成时可表示持续或开始说；汉语叙事中“说”已能自然承接他们改变看法后的言论，无须强行指定为起始或反复。
- source_word: θεόν
  choice: 个神
  rationale: 在当地人的多神信仰语境中，不带冠词的 θεόν 指众神中的一位；量词“个”在“是个神”中自然，并避免误解为独一的上帝。
theological_decisions:
- issue: 如何翻译 αὐτὸν εἶναι θεόν，避免把当地人的错误判断理解为基督教对保罗身份的宣认
  choice: 说他是个神
  alternative: 说他就是上帝；说他具有神性
  rationale: 叙事记录的是当地人在多神信仰框架下作出的错误结论。“是个神”既符合语境，也不把保罗等同于独一的上帝；同时比“具有神性”更贴近名词 θεόν。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“保罗”补出代词所指，使单节独立阅读时更清晰；后文仍用“他”避免重复。正文脚注标记与脚注完全对应。
