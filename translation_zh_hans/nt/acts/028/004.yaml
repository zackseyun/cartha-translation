  text: ὡς δὲ εἶδον οἱ βάρβαροι κρεμάμενον τὸ θηρίον ἐκ τῆς χειρὸς αὐτοῦ, ⸂πρὸς ἀλλήλους ἔλεγον⸃· Πάντως φονεύς ἐστιν ὁ ἄνθρωπος οὗτος ὃν διασωθέντα ἐκ τῆς θαλάσσης ἡ δίκη ζῆν οὐκ εἴασεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/004.yaml
  text: When the islanders saw the creature hanging from his hand[a], they said to one another, “Surely this man is a murderer, whom Justice has not allowed to live[d][c][b], though he was brought safely from the sea.”
translation:
  language: zh_hans
  text: 当地人看见那动物悬在他的手上，就彼此说：“这个人必定是个杀人犯；他虽然从海里死里逃生，报应[a]却不容他活着。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “报应”所译的希腊文指施行惩罚的正义；这里很可能被人格化，也可能反映当地人对某位神祇的理解。
    reason: cultural_note
lexical_decisions:
- source_word: βάρβαροι
  choice: 当地人
  rationale: 这里是当时希腊人对不说希腊语者的惯常称呼，并非现代意义上的道德贬称。“当地人”自然地指马耳他的本地居民，也避免“野蛮人”的误导性含义。
- source_word: κρεμάμενον
  choice: 悬在
  rationale: 保留动物从保罗手上垂悬或附着的直观画面，同时不武断判定其具体姿态。
- source_word: τὸ θηρίον
  choice: 那动物
  rationale: θηρίον在此是泛称；虽然上下文表明它是毒蛇，本节仍未再次具体称其为蛇，因此用“动物”保留原文措辞。
- source_word: πρὸς ἀλλήλους ἔλεγον
  choice: 就彼此说
  rationale: 明确表达“彼此”，并以自然的汉语叙事句式呈现未完成过去时；无需强行译出持续或反复意味。
- source_word: Πάντως
  choice: 必定
  rationale: 表达当地人根据眼前情形作出的强烈推断。
- source_word: φονεύς
  choice: 杀人犯
  rationale: 准确表达故意杀人者，且是现代汉语中自然清楚的称谓。
- source_word: διασωθέντα
  choice: 死里逃生
  rationale: 结合海难语境，传达διασῴζω所含的安然脱险之意；汉语中的主动式表达自然，并未赋予该词救恩论含义。
- source_word: ἡ δίκη
  choice: ‘公义’
  rationale: δίκη在此很可能被人格化为施行报应的力量。“公义”保留其正义、报应的观念，引号提示人格化用法而不把特定异教神祇身份直接写入正文。
- source_word: ζῆν οὐκ εἴασεν
  choice: 不容他活着
  rationale: 简洁自然地表达“不准他继续活下去”。
- source_word: ἐκ τῆς θαλάσσης
  choice: 从海里
  rationale: 直接对应ἐκ τῆς θαλάσσης，并与“死里逃生”自然搭配，指从海难中脱险。
theological_decisions:
- issue: δίκη的人格化
  choice: 正文译作带引号的“公义”，并以脚注说明其人格化和可能的异教观念背景。
  alternative: 译作普通名词“公义”、译作“报应”，或明确译作“正义女神”。
  rationale: 原文报道的是当地人的判断，不等于叙述者认可其异教世界观。带引号的“公义”既显出人格化，又不超出原文而断定某一具体神祇。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“当地人”避免将βάρβαροι误解为“野蛮人”；引语保持当地人强烈推断的语气。正文中的脚注标记与脚注完全对应。
