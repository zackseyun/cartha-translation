lexical_decisions:
- source_word: καταχθέντες
  choice: 靠岸后
  rationale: κατάγω在航海语境中指船驶入港口或靠岸。“靠岸后”自然、简明地保留了其航海含义，也符合分词所表达的先行动作。
- source_word: εἰς Συρακούσας
  choice: 在叙拉古
  rationale: εἰς本有“进入、到”的方向含义；与中文航海用语“在……靠岸”搭配时，用“在叙拉古”最自然，并清楚表达船抵达该港口城市。
- source_word: ἐπεμείναμεν
  choice: 我们在那里停留了
  rationale: ἐπιμένω意为继续留在某处或停留。“停留”符合旅行叙事的现代汉语表达；“在那里”明示上下文蕴含的地点，但未增加新的内容。
- source_word: ἡμέρας τρεῖς
  choice: 三天
  rationale: 宾格表示持续的时长。中文在“停留了”之后直接说“三天”，即可自然表达持续时间。
- source_word: Συρακούσας
  choice: 叙拉古
  rationale: 采用现代中文圣经及历史地名中通行的音译“叙拉古”。
