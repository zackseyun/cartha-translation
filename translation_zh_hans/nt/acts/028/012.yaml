  text: 我们在叙拉古[a]靠岸后，在那里停留了三天。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“到了叙拉古港”。原文所用动词在这里具有航海含义，指船驶入港口或靠岸。
