source:
  edition: SBLGNT
  text: ἐπαχύνθη γὰρ ἡ καρδία τοῦ λαοῦ τούτου, καὶ τοῖς ὠσὶν βαρέως ἤκουσαν, καὶ τοὺς ὀφθαλμοὺς αὐτῶν ἐκάμμυσαν· μήποτε ἴδωσιν τοῖς ὀφθαλμοῖς καὶ τοῖς ὠσὶν ἀκούσωσιν καὶ τῇ καρδίᾳ συνῶσιν καὶ ἐπιστρέψωσιν, καὶ ἰάσομαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/027.yaml
  text: For the heart of this people has become dull[a], and with their ears they heard heavily, and they closed their eyes; otherwise they might see with their eyes and hear with their ears and understand with their heart and turn back[b], and I would heal them.
translation:
  language: zh_hans
  text: 因为这百姓的心已经变得迟钝，耳朵听不进去，他们也闭上了自己的眼睛；不然[a]，他们或许会用眼睛看见，用耳朵听见，心里明白，回转过来[b]，我就会医治他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不然”或译“免得”。这里的希腊语连词可以带有较强的“免得、以免”意味。
    reason: 保留μήποτε在以赛亚引文中可能具有的较强目的或阻止语气。
  - marker: b
    text: “回转过来”也可译作“回头”“归回”，按此处语境也含有“悔改”的意思。
    reason: 说明ἐπιστρέφω的词义范围，同时不在正文中过度限定。
lexical_decisions:
- source_word: ἐπαχύνθη
  choice: 已经变得迟钝
  rationale: 该词本义为“变厚、变肥”，此处比喻内心麻木、反应迟钝。“变得迟钝”既传达比喻含义，也保留状态变化。
- source_word: καρδία
  choice: 心
  rationale: 保留圣经的人论用语，并与后文“心里明白”形成原文中的概念呼应。
- source_word: βαρέως ἤκουσαν
  choice: 耳朵听不进去
  rationale: 原文直译近于“沉重地听”；现代汉语用“听不进去”自然表达听觉迟钝和不肯领受的语境含义，同时不把它仅仅解释成生理听力问题。
- source_word: ἐκάμμυσαν
  choice: 闭上了
  rationale: 准确表达主动闭眼的动作，保留经文对人的责任所作的陈述。
- source_word: μήποτε
  choice: 不然
  rationale: 在现代汉语中自然引出可能出现却被阻断的结果；原词也可带有较强的“免得”意味，另以脚注保留。
- source_word: ἐπιστρέψωσιν
  choice: 回转过来
  rationale: 保留“转回、归回”的方向性意象及归向上帝的语境含义，不将它过窄地限定为某一神学术语。
- source_word: ἰάσομαι
  choice: 我就会医治他们
  rationale: 未来时在μήποτε所引出的连锁结构中具有条件结果意味；“就会”在汉语中清楚呈现这种关系。
theological_decisions:
- issue: 以赛亚引文中上帝审判的旨意与人的责任之间的张力
  choice: 正文用“不然”，脚注保留“免得”的较强目的或阻止意味
  alternative: 正文译作“免得”或“为要不让他们”
  rationale: 原文μήποτε在此可体现审判性刚硬的张力，但上下文也明确说百姓闭上自己的眼睛。正文不把争议单向解决，脚注则保存较强的原文可能性。
- issue: ἐπιστρέψωσιν所表达的归转
  choice: 回转过来
  alternative: 回头、归回、悔改
  rationale: “回转过来”兼顾方向性比喻与属灵归转的含义，避免把词义直接收窄为特定教义术语。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“心”“医治”等经文核心意象；避免生硬直译“耳朵沉重地听”，改用自然的“耳朵听不进去”。平行分句尽量维持原文“眼睛—耳朵—心”的递进结构。
