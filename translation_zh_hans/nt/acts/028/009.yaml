  text: τούτου ⸀δὲ γενομένου καὶ οἱ λοιποὶ οἱ ⸂ἐν τῇ νήσῳ ἔχοντες ἀσθενείας⸃ προσήρχοντο καὶ ἐθεραπεύοντο,
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/009.yaml
  text: And after this happened[a], the rest of those on the island who had diseases also came and were healed.
translation:
  language: zh_hans
  text: 这事发生以后，岛上其余患病的人[a]也都前来，得了医治。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“患有疾病的人”；也可译作“生病的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τούτου δὲ γενομένου
  choice: 这事发生以后
  rationale: 以自然的汉语表达独立属格所表示的时间先后关系；“这事”回指前述医治事件，δὲ在此起叙事转换作用，不必硬译。
- source_word: οἱ λοιποὶ οἱ ἐν τῇ νήσῳ
  choice: 岛上其余……的人
  rationale: 保留λοιποί所表达的“其余、其他”之意，并按现代汉语习惯表达ἐν τῇ νήσῳ所指的岛上居民。
- source_word: ἔχοντες ἀσθενείας
  choice: 患病的人
  rationale: 原文直译为“有疾病的人”；“患病的人”简洁自然，同时不限定疾病的具体种类。
- source_word: προσήρχοντο
  choice: 都前来
  rationale: 未完成时可描写多人陆续前来的情形；“都前来”在汉语中自然传达这一群体性的重复行动，而不增添原文未明说的对象。
- source_word: καὶ ἐθεραπεύοντο
  choice: 也都……得了医治
  rationale: καί把这些人的经历与前一医治事件相连，译作“也”；被动式ἐθεραπεύοντο译作“得了医治”，保留承受医治的语态，并以自然汉语概括陆续发生的结果。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通俗的叙事语言。“得了医治”保留被动含义及经文语体，又不刻意说明施行医治者；“前来”不补出原文未明说的“到保罗那里”。
