  text: ὁ μὲν οὖν ἀποτινάξας τὸ θηρίον εἰς τὸ πῦρ ἔπαθεν οὐδὲν κακόν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/005.yaml
  text: So he[a], after shaking the creature off into the fire, suffered no harm.
translation:
  language: zh_hans
  text: 于是，保罗把那动物[a]甩进火里，自己一点也没有受伤。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“那野兽”或“那活物”；希腊词含义较宽泛，不过上下文表明这里指的是一条蛇。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ μὲν οὖν
  choice: 于是，保罗
  rationale: 冠词在这里作代词用，所指是保罗；μέν与οὖν共同起轻微的承接、续述作用。“于是”自然体现叙事推进，明说“保罗”则避免汉语中主语含混。
- source_word: ἀποτινάξας
  choice: 把……甩进
  rationale: 该不定过去时分词所表达的动作先于主句动作；汉语用顺承结构自然呈现这一先后关系。“甩”准确传达迅速抖落、摆脱之意。
- source_word: τὸ θηρίον
  choice: 那动物
  rationale: θηρίον是较宽泛的动物称谓，常可指野兽；上下文虽明确所指为蛇，本节却没有使用“蛇”或“毒蛇”的专门词，因此正文保留其词义宽度。
- source_word: εἰς τὸ πῦρ
  choice: 进火里
  rationale: 直接表达εἰς加宾格所表示的朝向和进入，符合现代汉语习惯。
- source_word: ἔπαθεν οὐδὲν κακόν
  choice: 自己一点也没有受伤
  rationale: πάσχω与οὐδὲν κακόν合起来表示没有遭受任何伤害或不良影响。“一点也没有受伤”简明自然；补出“自己”可清楚区分保罗与被甩入火中的动物。
