base_translation:
  language: en
  yaml_path: translation/nt/acts/028/016.yaml
  text: When we entered Rome[a], Paul was permitted to stay by himself with the soldier guarding him.
translation:
  language: zh_hans
  text: 我们进入罗马后[a]，保罗获准独自居住，并有一名士兵看守他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本在“罗马”之后加上：“百夫长把囚犯交给御营的统领；但”。
    reason: textual_variant
lexical_decisions:
- source_word: Ὅτε δὲ
  choice: ……后
  rationale: Ὅτε引出时间背景，δὲ只是轻微承接；汉语以“……后”自然衔接上下文，不另译δὲ。
- source_word: εἰσήλθομεν εἰς Ῥώμην
  choice: 我们进了罗马
  rationale: 保留εἰσέρχομαι与εἰς所表达的进入方向，比单说“抵达罗马”更贴近原文。
- source_word: ἐπετράπη τῷ Παύλῳ
  choice: 保罗获准
  rationale: 准确表达ἐπιτρέπω被动式所指的许可，同时符合现代汉语表达。
- source_word: μένειν καθ’ ἑαυτὸν
  choice: 独自居住
  rationale: μένειν在此涉及保罗在罗马的居留安排；καθ’ ἑαυτόν表示与其他囚犯分开，并非无人陪伴，因为随后说明有士兵看守。
- source_word: σὺν τῷ φυλάσσοντι αὐτὸν στρατιώτῃ
  choice: 由一名士兵看守
  rationale: 将希腊语字面的“与看守他的士兵同在”自然转换为汉语；定冠词可指当时负责看守的士兵，但汉语首次提及时用“一名”更自然。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“独自居住”与“由一名士兵看守”并置，保留保罗获准分开居住却仍受拘押的张力。脚注说明SBLGNT正文未采纳、但部分抄本所见的较长读法。
