  text: γνωστὸν οὖν ⸂ἔστω ὑμῖν⸃ ὅτι τοῖς ἔθνεσιν ἀπεστάλη ⸀τοῦτο τὸ σωτήριον τοῦ θεοῦ· αὐτοὶ καὶ ⸀ἀκούσονται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/028.yaml
  text: Therefore let it be known to you that this salvation of God has been sent to the Gentiles[b][a]; they also will listen.
translation:
  language: zh_hans
  text: 所以，你们应当知道：神的这救恩已经传到外邦人那里；他们也必听[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们也会听见。”这里的动词可指“听见”或“聆听”，在上下文中也可暗示接受。
    reason: lexical_alternative
lexical_decisions:
- source_word: γνωστὸν οὖν ἔστω ὑμῖν
  choice: 所以，你们应当知道
  rationale: 保留οὖν的推论关系，并以现代汉语自然表达γνωστὸν ἔστω ὑμῖν这一带有郑重宣告意味的惯用语。
- source_word: τοῖς ἔθνεσιν
  choice: 外族人
  rationale: 本段处于犹太人与非犹太人的对照中，指犹太民族以外的人；“外族人”清楚表达语境所指，又较符合普通现代读者的用语。
- source_word: ἀπεστάλη
  choice: 已经传给
  rationale: 被动形式表示已经完成的差遣或送达。鉴于主语是“救恩”，汉语用“传给”较自然，也保留其如今已经临到外族人的语境意义。
- source_word: τοῦτο τὸ σωτήριον τοῦ θεοῦ
  choice: 神的这救恩
  rationale: 将σωτήριον按名词性用法译为“救恩”，不收窄为“救恩的信息”；“神的”保留属格在来源、归属或性质上的相关含义。
- source_word: αὐτοὶ καὶ ἀκούσονται
  choice: 他们也会听从
  rationale: ἀκούω可指听见，也可在语境中指听取、接受；“听从”体现与前文拒绝相对的积极回应，但不额外断言所有人都必然归信。καί译作“也”，保留强调。
theological_decisions:
- issue: σωτήριον在本节中的含义
  choice: 译作“救恩”
  alternative: “救恩的信息”
  rationale: 原词本身表示救恩。上下文虽涉及宣讲，却没有要求把它限定为信息；保留“救恩”可承载神拯救行动的完整幅度。
- issue: τοῦ θεοῦ属格的关系
  choice: 译作“神的”，并加注说明可能强调来源
  alternative: “从神而来的”
  rationale: 希腊语属格可表达来源，也可表达归属或特征。正文采用较开放的表达，避免只确定为其中一种。
- issue: ἀκούσονται的语用力度
  choice: 译作“会听从”
  alternative: “会听见”
  rationale: 上下文将外族人的预期反应与一些犹太人的拒绝相对照，因此倾向于接受性的聆听；同时脚注保留单纯“听见”的词义可能。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“所以”自然承接前文推论；“应当知道”保留公开宣告的语气。脚注标记均置于相关正文之后。
