- source_word: δευτεραῖοι
  choice: 第二天
  rationale: 保留原文明确的第二日时间表达，不改写为可能略显含混的“次日”。
- source_word: ἤλθομεν
  choice: 我们就到了
  rationale: 结合目的地表达抵达；“就”使南风出现后航程推进的叙事衔接自然，但不添加新的因果断言。
- source_word: Ποτιόλους
  choice: 部丢利
  rationale: 采用该古代地名在中文圣经传统中通行的音译。
