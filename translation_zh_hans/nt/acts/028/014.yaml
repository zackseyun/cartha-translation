  text: οὗ εὑρόντες ἀδελφοὺς παρεκλήθημεν ⸀παρ’ αὐτοῖς ἐπιμεῖναι ἡμέρας ἑπτά· καὶ οὕτως εἰς τὴν Ῥώμην ἤλθαμεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/014.yaml
  text: There we found brothers, and we were invited to stay with them seven days. And so we came to Rome.
translation:
  language: zh_hans
  text: 在那里，我们找到了弟兄们[a]，并被邀请在他们那里住七天。就这样，我们来到了罗马。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“弟兄姊妹”；希腊原文作“弟兄们”，这里很可能泛指同信的人。
    reason: 说明希腊语阳性复数的字面形式及其在此语境中可能涵盖的群体。
lexical_decisions:
- source_word: οὗ
  choice: 在那里
  rationale: 这是地点关系副词，回指前文的部丢利；译作“在那里”符合现代汉语叙事习惯。
- source_word: εὑρόντες
  choice: 我们找到了
  rationale: 不定过去时分词与主句同一主语，改用汉语限定动词，清楚表达先发生的动作。
- source_word: ἀδελφοὺς
  choice: 弟兄们
  rationale: 保留希腊语阳性复数的基本表达；在本段语境中指当地的同信者，性别涵盖范围另以脚注说明。
- source_word: παρεκλήθημεν
  choice: 受邀
  rationale: 保留被动语态，并按接待住宿的语境表达对方的请求或邀请；不把语气强化为“恳求”。
- source_word: παρ’ αὐτοῖς
  choice: 与他们同住
  rationale: παρά加与格在此表示与这些信徒一起住宿；结合ἐπιμεῖναι译为“与他们同住”自然明确。
- source_word: ἐπιμεῖναι
  choice: 同住
  rationale: 在旅行和接待语境中表示停留、住下；与παρ’ αὐτοῖς合译，避免生硬直译。
- source_word: ἡμέρας ἑπτά
  choice: 七天
  rationale: 宾格表示持续时段，现代汉语可直接置于“同住”之后。
- source_word: καὶ οὕτως
  choice: 就这样
  rationale: 既可承接前述行程方式，也推动叙事至抵达罗马；“就这样”保留其概括和过渡作用。
- source_word: εἰς τὴν Ῥώμην ἤλθαμεν
  choice: 我们来到了罗马
  rationale: εἰς加宾格表示到达目的地；“来到了罗马”保留第一人称旅行叙事，并自然表达抵达。
theological_decisions:
- issue: ἀδελφοὺς所指的群体
  choice: 当地的同信者，正文保留“弟兄们”
  alternative: 亲生兄弟；泛指犹太同胞；正文直接译作“弟兄姊妹”或“信徒”
  rationale: 《使徒行传》的旅行与接待语境表明这里最可能指当地基督徒群体；但希腊语字面为阳性复数“弟兄们”，故正文不直接扩写，以脚注说明其语境涵义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“受邀与他们同住”兼顾希腊语被动形式和汉语自然表达；“就这样”保留καὶ οὕτως可能兼具方式概括与叙事过渡的含义。
