  text: Καὶ διασωθέντες τότε ⸀ἐπέγνωμεν ὅτι ⸀Μελίτη ἡ νῆσος καλεῖται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/001.yaml
  text: After we had been brought safely through[d][c][b][a], we then learned that the island was called Malta.
translation:
  language: zh_hans
  text: 我们脱险以后[a]，才得知这座岛名叫马耳他[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我们平安获救以后”或“我们安全脱险以后”。希腊文动词着重表示经历危险后得以安全获救。
    reason: lexical_alternative
  - marker: b
    text: 希腊文作Μελίτη（Melitē），传统上认定为今日的马耳他。
    reason: cultural_note
lexical_decisions:
- source_word: διασωθέντες
  choice: 脱险以后
  rationale: 该词为διασῴζω的不定过去时被动分词，表示经历危险后安全获救、脱险；“脱险以后”在现代汉语中自然，并清楚交代这一行动先于“得知”。被动语态的色彩在汉语中不宜机械表达，相关可能译法列入脚注。
- source_word: τότε
  choice: 才
  rationale: τότε标示叙事先后。结合前置的“以后”，“才”自然表达脱险之后他们方得知岛名的时间关系。
- source_word: ἐπέγνωμεν
  choice: 得知
  rationale: 此处表示获得先前不知道的信息，即弄清岛的名称；“得知”比“认出”更符合语境。
- source_word: Μελίτη
  choice: 马耳他
  rationale: Μελίτη是该岛的希腊文名称，传统上认定为今日的马耳他；采用现代汉语通行地名。
- source_word: ἡ νῆσος
  choice: 这座岛
  rationale: “这座岛”符合汉语指称眼前所在岛屿的自然表达；希腊文有定冠词，直译为“那岛”并非必要。
- source_word: καλεῖται
  choice: 名叫
  rationale: 现在时被动语态表示该岛被称为这一名称；汉语“名叫”不强制标示时态，能自然保留原文的命名含义。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“脱险以后，才得知”简洁呈现分词动作先于主要动词的叙事次序；“名叫”也避免把希腊文现在时在汉语中不必要地改成明确的过去时。
