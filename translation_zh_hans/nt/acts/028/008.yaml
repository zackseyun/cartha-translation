  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐγένετο δὲ τὸν πατέρα τοῦ Ποπλίου πυρετοῖς καὶ ⸀δυσεντερίῳ συνεχόμενον κατακεῖσθαι, πρὸς ὃν ὁ Παῦλος εἰσελθὼν καὶ προσευξάμενος ἐπιθεὶς τὰς χεῖρας αὐτῷ ἰάσατο αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/008.yaml
  text: It happened that the father of Publius was lying sick with fevers and dysentery. Paul went in to him[a], and after praying and laying his hands on him, healed him.
translation:
  language: zh_hans
  text: 当时，部百流的父亲因阵阵发烧和痢疾缠身，正卧病在床。[a]保罗进去看他，祷告后把双手按在他身上，治好了他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “缠身”也可译作“受……折磨”或“被……困住”。希腊文的分词表示他持续受这些疾病侵扰；“发烧”在原文中为复数，可能指反复发作。
    reason: 说明 συνεχόμενον 的持续受困含义，并交代 πυρετοῖς 的复数形式。
lexical_decisions:
- source_word: ἐγένετο δὲ
  choice: 当时
  rationale: 作为叙事承接语，简洁引出接下来发生的事；不增添原文没有的明确时间副词“现在”。
- source_word: πατέρα τοῦ Ποπλίου
  choice: 部百流的父亲
  rationale: 保留希腊文的属格关系，并采用现代中文圣经读者较熟悉的人名译法。
- source_word: πυρετοῖς
  choice: 阵阵发烧
  rationale: 希腊文使用复数，可能指反复发作的热病；“阵阵发烧”比单数的“发烧”更能体现这一点，又不武断指定具体疾病。
- source_word: δυσεντερίῳ
  choice: 痢疾
  rationale: 这是该医学用语直接、清楚且现代读者易懂的对应词。
- source_word: συνεχόμενον
  choice: 缠身
  rationale: 表达被疾病困住、折磨的持续状态，中文自然，同时保留分词所含的受困意味。
- source_word: κατακεῖσθαι
  choice: 正卧病在床
  rationale: 兼顾躺卧姿态和患病语境；“正”体现持续状态，但不把完全失去行动能力说得过满。
- source_word: πρὸς ὃν ὁ Παῦλος εἰσελθὼν
  choice: 保罗进去看他
  rationale: 自然表达保罗进入病人所在之处并到他那里；“看他”在此表示探视，不增添诊疗含义。
- source_word: προσευξάμενος
  choice: 祷告后
  rationale: 清楚呈现不定过去时分词相对于主要动作的先行动作。
- source_word: ἐπιθεὶς τὰς χεῖρας αὐτῷ
  choice: 把双手按在他身上
  rationale: 保留原文“手”的复数，并用中文中自然、熟悉的按手表达。
- source_word: ἰάσατο αὐτόν
  choice: 治好了他
  rationale: 直接表达医治的结果，不额外规定医治是否即时，也不添加技术性的神迹或圣礼标签。
theological_decisions:
- issue: 保罗医治行为的性质
  choice: 按叙事次序直述保罗祷告、按手并治好病人
  alternative: 明确称为神迹，或改写为临床意义上的康复
  rationale: 经文本身陈述祷告、按手和医治，却未在本节明确说明是否即时，也未加上技术性的神迹或圣礼解释；译文保留这一叙事主张及其张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“阵阵发烧和痢疾缠身”保留原文疾病复数及持续侵扰的意味；“卧病在床”符合现代汉语习惯。脚注标记放在所解释的疾病短语之后。
