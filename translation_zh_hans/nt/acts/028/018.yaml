  text: οἵτινες ἀνακρίναντές με ἐβούλοντο ἀπολῦσαι διὰ τὸ μηδεμίαν αἰτίαν θανάτου ὑπάρχειν ἐν ἐμοί·
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/018.yaml
  text: who[a], after examining me, wanted to release me because there was no basis for the death penalty in my case.
translation:
  language: zh_hans
  text: 他们审问我以后，原想释放我，因为在我的案件中找不到任何判处死刑的依据[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为他们找不到任何足以判处我死刑的罪名（或指控）。”
    reason: αἰτία在司法语境中既可指判刑的“依据”，也可指针对被告的“罪名（指控）”；原文允许这两种相近表达。
lexical_decisions:
- source_word: οἵτινες
  choice: 他们
  rationale: 承接上文所指的罗马官员。现代汉语不宜生硬复制关系代词结构，用“他们”自然开启本句；原词可能具有的定性语气在此并不突出。
- source_word: ἀνακρίναντές με
  choice: 审问了我以后
  rationale: 不定过去时分词表示先于主要动词发生的行动；“审问”保留司法调查的语境，“以后”清楚表达时间先后。
- source_word: ἐβούλοντο
  choice: 原想
  rationale: 未完成过去时表达过去持续或既定的意愿；“原想”既自然，又与下文因反对而未能释放的叙事相衔接，但不额外断言其内在动机。
- source_word: ἀπολῦσαι
  choice: 释放我
  rationale: 在司法和拘押语境中指解除羁押、放人；“释放”准确而庄重。
- source_word: διὰ τὸ ... ὑπάρχειν
  choice: 因为……找不到
  rationale: 带冠词的不定式结构在此表示原因。汉语用“因为”明确因果关系；结合司法审查语境，将“没有存在”自然表达为“找不到”。
- source_word: μηδεμίαν αἰτίαν θανάτου
  choice: 任何判处死刑的依据
  rationale: αἰτία在司法语境中可指理由、根据或指控，θανάτου表明该事项足以导致死亡刑罚。“判处死刑的依据”保留法律含义，同时用脚注保留“该死的罪名”这一词义可能。
- source_word: ἐν ἐμοί
  choice: 在我的案子中
  rationale: 字面为“在我里面/在我身上”，此处是法庭语境，意为就保罗的案件而言；“在我的案子中”避免被误解为对其内在品格的描述。
