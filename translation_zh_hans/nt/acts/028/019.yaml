source:
  edition: SBLGNT
  text: ἀντιλεγόντων δὲ τῶν Ἰουδαίων ἠναγκάσθην ἐπικαλέσασθαι Καίσαρα, οὐχ ὡς τοῦ ἔθνους μου ἔχων τι ⸀κατηγορεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/019.yaml
  text: But because the Jews objected[b][a], I was compelled to appeal to Caesar—not because I had anything to accuse my nation of.
translation:
  language: zh_hans
  text: 但犹太人反对[a][b]，我就不得不上诉于凯撒；这并不是因为我有什么事要控告自己的民族。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “反对”也可译作“反驳”或“与我作对”。
    reason: lexical_alternative
  - marker: b
    text: 这里的“犹太人”按本案的上下文，指反对并控告保罗的犹太人，并不是对所有犹太人的笼统称呼。
    reason: cultural_note
lexical_decisions:
- source_word: ἀντιλεγόντων
  choice: 反对
  rationale: 现在时分词构成属格独立结构，说明促使保罗采取行动的情势；“反对”自然地涵盖法律语境中的异议和阻挠，同时不把词义限缩为单纯口头反驳。
- source_word: δὲ
  choice: 但
  rationale: 承接上文并形成轻微转折，现代汉语用“但”简洁自然。
- source_word: τῶν Ἰουδαίων
  choice: 犹太人
  rationale: 原文未明说“领袖”或“犹太地区的人”，故正文保留直接称谓；具体所指由上下文及脚注说明。
- source_word: ἠναγκάσθην
  choice: 我就不得不
  rationale: 表达被动承受的压力和行动上的必要性；相比“被迫”，这更符合自然现代汉语，又保留并非主动选择的意味。
- source_word: ἐπικαλέσασθαι Καίσαρα
  choice: 上诉于凯撒
  rationale: 这是使徒行传中的法律用语，指向皇帝提出上诉；“上诉于凯撒”准确并保留原文称号。
- source_word: οὐχ ὡς
  choice: 这并不是因为
  rationale: 在此引出对动机的澄清；此译法符合汉语表达，并保留保罗否认敌意目的的语气。
- source_word: τοῦ ἔθνους μου
  choice: 自己的民族
  rationale: ἔθνος在此指保罗所属的民族共同体；“自己的民族”保留民族性和群体性，也使汉语指代清楚。
- source_word: ἔχων τι κατηγορεῖν
  choice: 我有什么事要控告
  rationale: 保留司法性的“控告”，并以自然汉语表达“有任何可提出的指控”这一含义。
theological_decisions:
- issue: “犹太人”这一族群及宗教称谓的具体所指
  choice: 正文保留“犹太人”，并以脚注说明此处按语境指保罗案件中的犹太反对者。
  alternative: 译作“犹太领袖”或“犹太地区的人”。
  rationale: Ἰουδαίων本身没有“领袖”一词，也不宜在正文中擅自缩窄范围；但上下文并非泛指所有犹太人，因此用脚注防止不当概括。
- issue: 保罗上诉凯撒的动机
  choice: 译为“这并不是因为我有什么事要控告自己的民族”，保留其否认控告本民族之意。
  alternative: 译为“并不是说我对自己的民族有什么指控”。
  rationale: οὐχ ὡς引出对可能误解的否定；所选译文自然表达动机澄清，不扩大为对民族无任何意见的绝对断言。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“不得不上诉于凯撒”保留法律语境和受迫意味；分号呈现原文后半句对动机的澄清。脚注标记均置于相关词语之后。
