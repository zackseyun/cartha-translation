id: ACT.28.22
reference: Acts 28:22
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἀξιοῦμεν δὲ παρὰ σοῦ ἀκοῦσαι ἃ φρονεῖς, περὶ μὲν γὰρ τῆς αἱρέσεως ταύτης γνωστὸν ⸂ἡμῖν ἐστιν⸃ ὅτι πανταχοῦ ἀντιλέγεται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/022.yaml
  text: But we consider it proper to hear from you what you think[a], for concerning this sect it is known to us that it is spoken against everywhere.
translation:
  language: zh_hans
  text: 不过，我们认为应该听听你本人的看法，因为关于这个教派[a]，我们知道它到处都遭人非议。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“派别”或“运动”。希腊语αἵρεσις在这里不一定具有后来“异端”一词的专门含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀξιοῦμεν
  choice: 我们认为应该
  rationale: 表达说话者对合宜性的判断，并保留礼貌、正式的语气；避免译成过强的“要求”或较弱的“希望”
- source_word: παρὰ σοῦ ἀκοῦσαι
  choice: 听听你本人的
  rationale: παρά加属格强调直接从保罗本人那里听取意见；“你本人”自然地呈现这一来源意味
- source_word: ἃ φρονεῖς
  choice: 看法
  rationale: φρονέω在此指个人的观点或见解；“看法”符合现代汉语表达
- source_word: αἱρέσεως
  choice: 教派
  rationale: 此处指被辨识的宗教群体或派别，并非后世技术意义上的“异端”；“教派”能较自然地呈现当时的社会宗教含义
- source_word: γνωστὸν ἡμῖν ἐστιν
  choice: 我们知道
  rationale: 以自然现代汉语表达希腊文“这事为我们所知”的意思，不增加“众所周知”等原文没有的强调
- source_word: πανταχοῦ
  choice: 到处
  rationale: 简明自然地表达广泛的地点范围
- source_word: ἀντιλέγεται
  choice: 遭人非议
  rationale: 保留被动意味以及人们以言语反对、议论该群体的语义；比单纯“遭反对”更能体现λέγω的言说成分
theological_decisions:
- issue: αἵρεσις的译法
  choice: 教派
  alternative: 异端；派别；运动
  rationale: 上下文是犹太领袖从外部称呼基督徒群体，并不是在作后世教会意义上的正式异端裁定。“教派”避免把后来的教义技术含义带入经文；脚注保留“派别、运动”等可能性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“不过”承接前文并体现δέ的转折；“听听”使汉语流畅，但整体仍保持礼貌正式。“遭人非议”突出言语上的反对，同时不把语义缩窄为正式定罪。
