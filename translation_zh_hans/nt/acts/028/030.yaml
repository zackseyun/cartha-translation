  text: ⸀Ἐνέμεινεν ⸀δὲ διετίαν ὅλην ἐν ἰδίῳ μισθώματι, καὶ ἀπεδέχετο πάντας τοὺς εἰσπορευομένους πρὸς αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/030.yaml
  text: And he stayed for two whole years in his own rented lodging[a], and he welcomed all who came in to him[b],
translation:
  language: zh_hans
  text: 保罗在自己租的住处住了整整两年[a]，接待所有到他那里来的人[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在自己租来的住处住了整整两年。”希腊语μίσθωμα指租来的住处或住宿处，不一定特指独立住宅。
    reason: lexical_alternative
  - marker: b
    text: 直译：“接待所有进到他那里的人。”这里可能着重描写来访者进入保罗所住的地方。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐνέμεινεν
  choice: 住了
  rationale: 这里表示在某处持续居住或停留；结合租住房屋的语境，“住了”比“停留了”更自然，同时保留其持续居留之意。
- source_word: δὲ
  choice: 不单独译出
  rationale: δέ在这里是轻微的叙事连接词，并非强烈转折。现代汉语接续上文时无需机械译作“于是”或“但”，省译更流畅。
- source_word: διετίαν ὅλην
  choice: 整整两年
  rationale: 准确表达时间延续两年，并保留ὅλην对完整时段的强调。
- source_word: ἐν ἰδίῳ μισθώματι
  choice: 在自己租住的房子里
  rationale: μίσθωμα指租来的住处；“租住的房子”是自然的现代汉语，也表达ἰδίῳ所指由他自己安排或使用的住处，并不暗示房屋归他所有。
- source_word: ἀπεδέχετο
  choice: 接待
  rationale: 未完成时表示持续或惯常发生的行动；“接待”自然体现他不断接见来访者，也含有欢迎、接纳的语气。
- source_word: πάντας τοὺς εἰσπορευομένους πρὸς αὐτόν
  choice: 所有前来见他的人
  rationale: 既表达πάντας的周全范围，也用“前来见他”自然传达来访者进入其住处、到他那里去的空间意味。
theological_decisions:
- issue: 本节希腊文未明说主语姓名
  choice: 补出“保罗”
  alternative: 译作“他”
  rationale: 中文跨越段落或独立引用时使用“他”可能指代不清；按明确的叙事语境补出“保罗”，不增加有争议的神学解释。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“整整两年”保留原文对完整时段的强调；“接待”体现未完成时所描写的持续、惯常行动。句末保留逗号，因为本节语法和叙事在下一节继续。
