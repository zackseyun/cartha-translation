  to: 三天后，保罗召集了犹太人的领袖[a]。他们聚集后，保罗对他们说：“弟兄们[b]，我虽然没有做过任何违背本族或祖传习俗[c]的事，却从耶路撒冷以囚犯身份被交在罗马人手中[d]。”
