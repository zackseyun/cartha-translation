  naturalness: 修订后仍为庄重、自然的现代汉语。“犹太人的领袖”“他们聚集后”“弟兄们，我……”均通顺；“从耶路撒冷以囚犯身份被交在罗马人手中”准确保留原文的来源、身份和“交在……手中”意象。
