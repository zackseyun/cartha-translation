  text: Ἐγένετο δὲ μετὰ ἡμέρας τρεῖς συγκαλέσασθαι ⸀αὐτὸν τοὺς ὄντας τῶν Ἰουδαίων πρώτους· συνελθόντων δὲ αὐτῶν ἔλεγεν πρὸς αὐτούς· ⸂Ἐγώ, ἄνδρες ἀδελφοί⸃, οὐδὲν ἐναντίον ποιήσας τῷ λαῷ ἢ τοῖς ἔθεσι τοῖς πατρῴοις δέσμιος ἐξ Ἱεροσολύμων παρεδόθην εἰς τὰς χεῖρας τῶν Ῥωμαίων,
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/017.yaml
  text: It happened that after three days he called together the leading men of the Jews[a]. And when they had come together, he said to them, “I, brothers, though I had done nothing against the people or the customs of our fathers[d][c][b], was delivered as a prisoner from Jerusalem into the hands of the Romans.”
translation:
  language: zh_hans
  text: 三天后，保罗召集了犹太人的领袖[a]。他们聚集后，保罗对他们说：“弟兄们[b]，我虽然没有做过任何违背本族或祖传习俗[c]的事，却从耶路撒冷以囚犯身份被交在罗马人手中[d]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“犹太人中有地位的人”或“犹太人的首领”。
    reason: lexical_alternative
  - marker: b
    text: 原文“弟兄们”是保罗对他所召集的犹太男性领袖的称呼，表达同胞之间的认同。
    reason: cultural_note
  - marker: c
    text: 或译“祖先的传统”。
    reason: lexical_alternative
  - marker: d
    text: 或译“从耶路撒冷被移交给罗马人”。原文直译为“从耶路撒冷被交在罗马人的手中”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ μετὰ ἡμέρας τρεῖς
  choice: 三天后
  rationale: Ἐγένετο δὲ在这里是路加常用的叙事衔接结构；现代汉语不必逐字译为“事情发生了”，以“三天后”自然承载时间推进。
- source_word: συγκαλέσασθαι αὐτὸν
  choice: 保罗召集了
  rationale: 将不定式结构自然转换为汉语谓语；明确主语“保罗”可避免代词所指不清，且不增添实质信息。
- source_word: τοὺς ὄντας τῶν Ἰουδαίων πρώτους
  choice: 当地犹太人的领袖
  rationale: πρώτους表示地位显要、居领导地位的人，而非时间上的“最先者”；“当地”由罗马场景隐含，帮助现代读者识别这批犹太代表。
- source_word: συνελθόντων δὲ αὐτῶν
  choice: 他们聚集以后
  rationale: 将属格独立结构译成自然的时间从句。
- source_word: Ἐγώ, ἄνδρες ἀδελφοί
  choice: 弟兄们，我
  rationale: ἄνδρες ἀδελφοί是对在场犹太男性领袖既尊重又强调同胞关系的称呼；汉语以“弟兄们”自然表达，Ἐγώ的强调由随后显出的“我”保留。
- source_word: οὐδὲν ἐναντίον ποιήσας
  choice: 虽然没有做过任何违背……的事
  rationale: 上下文具有让步意味：保罗虽未犯所述之事，却被移交；“违背”兼顾行为上的反对与违反。
- source_word: τῷ λαῷ
  choice: 本民族
  rationale: 这里指犹太民族；“本民族”体现保罗与听众的共同身份，同时避免将λαός泛化为不明确的“人民”。
- source_word: τοῖς ἔθεσι τοῖς πατρῴοις
  choice: 祖传习俗
  rationale: 简洁表达由祖先传承下来的惯例，兼顾ἔθεσι与πατρῴοις。
- source_word: δέσμιος
  choice: 被当作囚犯
  rationale: 表达保罗被移交时的受拘押身份，而不把词义缩窄为字面的“戴着锁链”。
- source_word: ἐξ Ἱεροσολύμων παρεδόθην εἰς τὰς χεῖρας τῶν Ῥωμαίων
  choice: 在耶路撒冷被……交在罗马人手中
  rationale: “交在……手中”保留εἰς τὰς χεῖρας的形象和法律拘押意味；“在耶路撒冷”按汉语表达交接发生地，源文ἐξ同时带有从耶路撒冷转出的起点意味。
theological_decisions:
- issue: ἄνδρες ἀδελφοί的受众性别与同胞称呼
  choice: 弟兄们
  alternative: 弟兄姊妹们；同胞们
  rationale: 此处直接受话者是受召集的犹太男性领袖；“弟兄们”既符合语法性别和历史场景，也保留保罗所表达的群体连带关系。
- issue: οὐδὲν ἐναντίον ποιήσας的逻辑关系
  choice: 按让步关系译为“虽然……却……”
  alternative: 按伴随情况译为“我没有做过……，却……”或“我既没有做过……”
  rationale: 上下文突出保罗无过却被交付的张力；让步译法使这种语篇关系清楚，但不对其清白作超出本句的神学推论。
- issue: παρεδόθην是否暗示神学性的“交付”
  choice: 按司法与拘押语境译为“被交在罗马人手中”
  alternative: 被交付给罗马人；被移交给罗马人
  rationale: 本句描述从耶路撒冷方面转入罗马拘押的事件，不额外引入神圣被动或救赎论含义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。为避免叙事起句生硬，未逐字翻译Ἐγένετο δὲ；以“三天后”直接推进叙事。主句补出“保罗”以明确指代。保留“交在……手中”的源文意象，并用脚注说明更顺畅的替代译法。
