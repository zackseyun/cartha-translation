  text: καὶ οἱ μὲν ἐπείθοντο τοῖς λεγομένοις οἱ δὲ ἠπίστουν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/024.yaml
  text: And some were persuaded by what was being said[a], but others disbelieved.
translation:
  language: zh_hans
  text: 有些人被所讲的话说服了，另一些人却不信。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不信”也可理解为“不肯相信”。
    reason: ἀπιστέω可表示不相信，也可能在语境中含有拒绝相信的意味；正文采用较少解释性的译法。
lexical_decisions:
- source_word: ἐπείθοντο
  choice: 信服了
  rationale: 该词为未完成时中间／被动形式，表示他们受到所讲内容的劝服。“信服”既保留被说服、被劝服的含义，也不直接把它限定为完整的救恩意义上的信心。汉语不必机械标出持续体。
- source_word: τοῖς λεγομένοις
  choice: 听了所讲的
  rationale: 带冠词的现在时被动分词指当时正在讲述的内容。“所讲的”贴近原文，“听了”使汉语关系自然清楚，并未增添原文之外的信息。
- source_word: ἠπίστουν
  choice: 不信
  rationale: 该未完成时动词可表示不相信、不信，也可能带有不肯相信的语气。“不信”直接而克制，避免把意志上的拒绝写死；相关可能性收入脚注。
- source_word: οἱ μὲν ... οἱ δὲ
  choice: 有些人……另一些人却……
  rationale: 准确表达同一群体中两种相反的反应，并以“却”体现 μέν…δέ 的对照。
- source_word: καὶ
  choice: （不单独译出）
  rationale: καί 在此承接上文。现代汉语中直接续述更自然，句意的连贯并未因此丢失。
theological_decisions:
- issue: 两种反应的性质
  choice: 译为“信服”与“不信”，只陈述听众对保罗所讲内容的不同反应。
  alternative: 把前者明确译成得救意义上的“相信”，把后者明确译成顽固地“拒绝相信”。
  rationale: 原文在叙事层面呈现相反反应，却没有在本节中进一步界定各人的最终属灵状况；译文因此保留这种神学张力。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“信服”与“不信”形成简洁对照；避免生硬直译希腊语未完成时，也避免加入原文未明确表达的宗派性或教义性判断。
