  text: οἳ καὶ πολλαῖς τιμαῖς ἐτίμησαν ἡμᾶς καὶ ἀναγομένοις ἐπέθεντο τὰ πρὸς ⸂τὰς χρείας⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/010.yaml
  text: They also honored us greatly[a], and when we were setting sail[c][b], they put on board what we needed.
translation:
  language: zh_hans
  text: 他们也多方礼遇我们[a]；到我们要开船的时候[b]，又把我们所需的物品放到船上[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文较直译为“以许多礼遇礼遇我们”，重复使用同源的“尊荣”用语，以加强语气。
    reason: lexical_alternative
  - marker: b
    text: 或译：“到我们要出海的时候。”这里的分词是航海用语，指乘船开始航程。
    reason: lexical_alternative
  - marker: c
    text: 或译：“又供应我们所需要的。”原文较直译为“又把应付需要的物品放上去”；“船上”由航海语境表明。
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλαῖς τιμαῖς
  choice: 多方礼遇
  rationale: 该与格短语表示多种具体的尊敬或礼遇；译作“多方礼遇”既保留复数所表达的多种尊荣表现，又符合现代汉语习惯。
- source_word: ἐτίμησαν
  choice: 礼遇
  rationale: τιμάω意为尊敬、给予尊荣；结合其同源名词τιμαῖς，合译为“多方礼遇我们”，自然表达原文的强调。
- source_word: ἀναγομένοις
  choice: 到我们要开船的时候
  rationale: ἀνάγω在航海语境中指船启航、出海；“开船”清楚保留其航海含义，并以时间从句表达与格分词的情境关系。
- source_word: ἐπέθεντο
  choice: 放到船上
  rationale: ἐπιτίθημι的中间语态在此指把物品放上去；船虽为语境隐含，汉语明说“船上”可自然传达具体动作。
- source_word: τὰ πρὸς τὰς χρείας
  choice: 我们所需的物品
  rationale: 该结构指满足需要的各样东西或给养；“所需的物品”保留其具体复数含义，同时避免汉语中重复说“需要之需”的生硬表达。
