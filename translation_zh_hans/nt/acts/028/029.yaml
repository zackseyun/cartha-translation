  yaml_path: translation/nt/acts/028/029.yaml
  text: And when he had [a]said these things, the Jews departed, having a great dispute among themselves.
translation:
  language: zh_hans
  text: 保罗说完这些话后，犹太人离去了，他们彼此间有很大的争论。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节整节不见于一些早期重要的希腊抄本，包括四世纪的《西奈抄本》和《梵蒂冈抄本》，以及通常定年为六至七世纪的蒲草纸抄本P74；早期科普特文译本也没有本节。但拜占庭多数文本以及早期拉丁文和叙利亚文译本收录了本节。它很可能是后来的抄写者为补足犹太领袖离去这一叙事结尾而增添的文字。
    reason: textual_critical
lexical_decisions:
- source_word: συζήτησις
  choice: 争论
  rationale: 该词可指讨论、辩论或争辩；这里犹太人对保罗的信息意见分歧，“争论”既保留其互动性质，也体现 πολλήν 所表达的强烈程度。
- source_word: ἀπέρχομαι
  choice: 离去
  rationale: 这是常见的离开、走开的动词；“离去”自然、庄重，也符合本段场景收束时的叙事语气。
- source_word: ἐν ἑαυτοῖς
  choice: 彼此间
  rationale: 按语境指犹太人内部相互争论；“彼此间”比直译“在他们自己里面”更符合现代汉语，同时不额外说明争论的具体内容。
theological_decisions:
- issue: 本节的文本存疑
  choice: 依据指定的拜占庭希腊文本将本节收入正文，并以脚注说明抄本证据
  alternative: 因早期重要希腊抄本缺少本节而不列入正文或置于括号中
  rationale: 所指定的原文版本收录本节，因此正文予以翻译；同时，早期抄本与古译本之间的重要差异必须明确呈现，以免掩盖文本传统的张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“有一番激烈的争论”对应 πολλὴν…συζήτησιν，避免过于书面化的“展开重大辩论”，也不把争论具体解释为敌意冲突。主语“保罗”由上下文补出，以符合汉语表达并明确 αὐτοῦ 的指代。
