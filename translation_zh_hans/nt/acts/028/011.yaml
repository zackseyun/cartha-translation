  source_fidelity: 译文准确呈现了时间、启航、该船已在岛上过冬，以及船的识别标志。将 παρασήμῳ 译为较宽泛的“标志”是审慎的，避免把未能确定的具体形制限定为“船首像”。但“船以……为标志”在现代汉语中搭配不够自然，宜改为“船的标志是……”。
  naturalness: “亚历山大船”不符合现代汉语通常的船只来源表达；“从亚历山大来的船”更清楚自然。改后句法也更顺畅，分号后的“船的标志是……”明确说明其所指。
  terminology: “狄奥斯库里”可保留为直接对应 Διοσκούροι 的专名。脚注中将其简单释为“宙斯的儿子们”容易造成神话谱系的过度简化；宜仅说明这是希腊罗马神话中的卡斯托耳和波吕丢刻斯这一对孪生神祇，并校正拉丁名为“波吕克斯”。
