  to: 三个月后，我们乘一艘在岛上过冬、从亚历山大来的船启航；船的标志是狄奥斯库里。[a]
  rationale: 修订仅改善现代汉语表达并校正脚注中的神话专名说明，保留原文对于船只标志具体形制的未定性，也不把上文语境中的岛名补入正文。
