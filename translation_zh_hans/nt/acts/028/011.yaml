  text: Μετὰ δὲ τρεῖς μῆνας ⸀ἀνήχθημεν ἐν πλοίῳ παρακεχειμακότι ἐν τῇ νήσῳ Ἀλεξανδρίνῳ, παρασήμῳ Διοσκούροις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/011.yaml
  text: After three months we set sail in an Alexandrian ship that had wintered on the island[a], with the Dioscuri as its figurehead.
translation:
  language: zh_hans
  text: 三个月后，我们乘一艘在岛上过冬、从亚历山大来的船启航；船的标志是狄奥斯库里。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “狄奥斯库里”指希腊罗马神话中的一对孪生神祇卡斯托耳和波吕丢刻斯；后者的拉丁名为波吕克斯。
    reason: 解释现代读者可能不熟悉的希腊神话专名，并说明船上标志所指；不把标志的具体形制限定为船首像。
lexical_decisions:
- source_word: Μετὰ δὲ τρεῖς μῆνας
  choice: 三个月后
  rationale: μετά加宾格表示一段时间之后；δέ在此仅作轻微承接，汉语无需另译，行文更自然。
- source_word: ἀνήχθημεν
  choice: 我们……启航
  rationale: ἀνάγω在航海语境中指驶离港岸、出海；“启航”简洁而符合现代汉语叙事。
- source_word: ἐν πλοίῳ … Ἀλεξανδρίνῳ
  choice: 乘一艘……亚历山大船
  rationale: ἐν在此表示乘用的船只；Ἀλεξανδρίνῳ说明船来自或隶属亚历山大。“乘一艘亚历山大船”自然且保留原文信息。
- source_word: παρακεχειμακότι ἐν τῇ νήσῳ
  choice: 在岛上过冬的
  rationale: παραχειμάζω的完成时分词表示该船此前留在岛上度过冬季；“过冬”准确简明。岛屿承接上文所指的马耳他，但正文不补出原文未明说的名称。
- source_word: παρασήμῳ
  choice: 以……为标志
  rationale: παράσημος可指船上的识别标记、徽号或船首像；原文没有明确限定其具体形式，因此采用范围较宽的“标志”，避免把可能性收窄为“船首像”。
- source_word: Διοσκούροις
  choice: 狄奥斯库里
  rationale: 直接音译这一希腊神话专名，避免把它解释性地改写为“双子神”；脚注说明其身份和较熟悉的名字。
theological_decisions:
- issue: 异教船徽Διοσκούροις的表达
  choice: 狄奥斯库里
  alternative: 双子神／卡斯托耳和波吕丢刻斯
  rationale: 经文是在客观报告船的异教标志，并非表示认同。保留专名最贴近希腊文，也不把神话称号误当作经文的神学断言；脚注为普通读者提供必要解释。
- issue: παρασήμῳ是否具体译作船首像
  choice: 标志
  alternative: 船首像
  rationale: 该词可指徽号、标记或船首装饰，具体形态并不确定。“标志”保留原文的语义宽度和历史不确定性。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。“启航”“过冬”清楚自然；以分号呈现船只及其标志的附加说明。脚注标记紧随相关专名之后，避免误指“岛”。
