base_translation:
  language: en
  yaml_path: translation/nt/acts/028/003.yaml
  text: But when Paul had gathered a bundle of sticks and put them on the fire[b][a], a viper came out because of the heat and fastened onto his hand.
translation:
  language: zh_hans
  text: 保罗捡来一些枯枝，放在火上。一条蝰蛇因火的热[a]出来，就缠附在他的手上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“出于这热”。希腊语介词可较字面地这样翻译；这里很可能表示原因，即蝰蛇因火的热而出来。
    reason: lexical_alternative
  - marker: b
    text: 或译“抓住了他的手”或“咬住了他的手”。希腊语动词较宽泛，可指抓住、攀附或附着，并未明确说明如何附着。
    reason: lexical_alternative
lexical_decisions:
- source_word: συστρέψαντος
  choice: 捡来
  rationale: 此处表示保罗把燃料收集到一起；“捡来”符合拾取枯枝生火的具体语境，也自然体现先于后续动作发生。
- source_word: φρυγάνων τι πλῆθος
  choice: 一些枯枝
  rationale: φρύγανα 指可作燃料的干枝、灌木碎枝，τι πλῆθος 表示数量不确定；“一些枯枝”准确自然，不把原文未明确的形状限定为“一捆”。
- source_word: ἐπιθέντος ἐπὶ τὴν πυράν
  choice: 放在火上
  rationale: 直截了当地表达把所捡枯枝加到火堆上的动作，符合现代汉语叙事。
- source_word: ἔχιδνα
  choice: 一条蝰蛇
  rationale: ἔχιδνα 特指蝰蛇一类的毒蛇；采用较具体的名称，保留原词信息。
- source_word: ἀπὸ τῆς θέρμης
  choice: 因热气
  rationale: ἀπό 字面可表示“从”，在此也可理解为热气促使蛇出来；正文以自然的因果表达呈现，同时用脚注保留来源义的可能。
- source_word: ἐξελθοῦσα
  choice: 钻了出来
  rationale: 该分词修饰蝰蛇；“钻了出来”符合蛇从枯枝中受热而出的场景，行文自然。
- source_word: καθῆψε τῆς χειρὸς αὐτοῦ
  choice: 紧紧附在他的手上
  rationale: καθάπτω 可指抓住、附着于；此译法保留蛇附在手上的画面，而不把动词本身收窄为明确的“咬”。
