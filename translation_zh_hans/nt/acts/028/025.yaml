  text: ἀσύμφωνοι δὲ ὄντες πρὸς ἀλλήλους ἀπελύοντο, εἰπόντος τοῦ Παύλου ῥῆμα ἓν ὅτι Καλῶς τὸ πνεῦμα τὸ ἅγιον ἐλάλησεν διὰ Ἠσαΐου τοῦ προφήτου πρὸς τοὺς πατέρας ⸀ὑμῶν
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/025.yaml
  text: 'And since they were disagreeing with one another, they were leaving after Paul had said one final word: “The Holy Spirit spoke rightly through Isaiah the prophet to your fathers'
translation:
  language: zh_hans
  text: 他们彼此意见不一；保罗说了最后一句话[a]以后，他们就纷纷离去。保罗说：“圣灵借着以赛亚先知对你们的先祖[b]说得对：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“一句话”，这里指保罗临别时所说的总结性话语。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“你们的父辈”，这里指以色列人的先祖。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσύμφωνοι δὲ ὄντες πρὸς ἀλλήλους
  choice: 他们彼此意见不一
  rationale: 直接表达彼此不一致的状态，既保留相互性的含义，也符合现代汉语习惯。
- source_word: ἀπελύοντο
  choice: 他们就纷纷离去
  rationale: 未完成时描写众人正在散去的情景；“纷纷离去”自然传达聚会散场、各自离开的过程。
- source_word: εἰπόντος τοῦ Παύλου
  choice: 保罗说了……以后
  rationale: 以时间从句表达属格独立结构，并保留保罗说完这句话后众人才离去的先后关系。
- source_word: ῥῆμα ἓν
  choice: 最后一句话
  rationale: 字面为“一句话”；在此是引出临别的总结性话语，译为“最后一句话”可传达其语篇功能，并以脚注保留字面形式。
- source_word: Καλῶς
  choice: 说得对
  rationale: 这里评价圣灵所说内容的正确性；“说得对”比“说得好”更明确，也符合现代汉语表达。
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: 圣灵
  rationale: 采用现代中文圣经语境中对该明确称谓的标准译法。
- source_word: διὰ Ἠσαΐου τοῦ προφήτου
  choice: 借着以赛亚先知
  rationale: διά加属格表示媒介或施行途径；“借着”准确保留圣灵通过先知发言的关系。
- source_word: πρὸς τοὺς πατέρας ὑμῶν
  choice: 对你们的先祖
  rationale: 此处指以色列人的前代先祖；“先祖”在现代汉语中庄重自然，脚注说明原文直译为“父辈”。
theological_decisions:
- issue: 圣灵与先知话语的施事关系
  choice: 圣灵借着以赛亚先知……说
  alternative: 以赛亚先知受圣灵感动说
  rationale: 原文明确以圣灵为说话者、以以赛亚为媒介；译文保持这一语法和神学张力，不增添原文未明说的“感动”。
- issue: “你们的父辈”的所指
  choice: 你们的先祖
  alternative: 你们的父辈
  rationale: 语境所指是以色列人的历代先祖。“先祖”自然传达此历史群体所指，同时用脚注保留原文男性亲属词的字面信息。
- issue: καλῶς的评价含义
  choice: 说得对
  alternative: 说得好
  rationale: “说得对”保留对先知话语正确性的肯定；“说得好”在中文中也可能只评价表达方式，较易产生歧义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“纷纷离去”呈现未完成时所描写的散去过程；末尾保留冒号和未闭合引号，因为保罗所引述的话延续到下一节。
