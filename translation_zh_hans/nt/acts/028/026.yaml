  text: ⸀λέγων· Πορεύθητι πρὸς τὸν λαὸν τοῦτον καὶ εἰπόν· Ἀκοῇ ἀκούσετε καὶ οὐ μὴ συνῆτε, καὶ βλέποντες βλέψετε καὶ οὐ μὴ ἴδητε·
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/026.yaml
  text: 'saying[a], ‘Go to this people and say: You will indeed hear, but you will never understand; and seeing, you will indeed see[b], but you will never perceive.’'
translation:
  language: zh_hans
  text: 说[a]：“你去见这百姓，对他们说：你们必定听见，却绝不明白；必定看见[b]，却绝不看清。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “说”在原文中是分词，承接上一节的话，并引出下面的引语。
    reason: grammar
  - marker: b
    text: 原文直译可作“看着，你们必定看见，却绝不会看见”。原文重复使用“看见”一词；末一个“看见”在这里也可含有内在看清、领会之意。
    reason: alternative_reading
lexical_decisions:
- source_word: λέγων
  choice: 说
  rationale: 现在分词承接上一节并引出引语；汉语用“说”自然地保留这一衔接。
- source_word: Πορεύθητι πρὸς τὸν λαὸν τοῦτον
  choice: 你到这百姓那里去
  rationale: πορεύθητι在此是表示移动的命令；λαὸν τοῦτον保留先知话语中集合性的“这百姓”，而不改成较口语化的“这些人”。
- source_word: καὶ εἰπόν
  choice: 对他们说
  rationale: 直译命令“并且说”；补出“对他们”符合现代汉语表达，也明确承接“这百姓”。
- source_word: Ἀκοῇ ἀκούσετε
  choice: 你们听是会听见
  rationale: 名词与同源动词连用，是希伯来式强调结构；此译保留重复和强调，同时较为自然。
- source_word: οὐ μὴ συνῆτε
  choice: 却绝不会明白
  rationale: οὐ μή加虚拟式表达强烈否定；“绝不会”传达其力度，συνίημι译作“明白”。
- source_word: βλέποντες βλέψετε
  choice: 看是会看见
  rationale: 分词与同源限定动词形成重复，与前句构成平行；“看是会看见”既保留修辞，又符合现代汉语。
- source_word: οὐ μὴ ἴδητε
  choice: 却绝不会看清
  rationale: ἴδητε本义仍属“看见”，语境中可涉及领会；“看清”既保留视觉词汇，又可表达未能洞察的含义。
theological_decisions:
- issue: 以赛亚引文中的感官行为与内在领会之间的张力
  choice: 用“听见／明白”和“看见／看清”呈现外在感知与内在领会的对照
  alternative: 末句译作“却绝不会领会”或“却绝不会看见”
  rationale: “看清”不完全抽象化为“领会”，也不把末句局限为生理视觉，因而保留ὁράω在此语境中的真实歧义和先知话语的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“这百姓”保留先知引文的集体称谓；“听是会听见／看是会看见”有意保留原文同源词重复和两句之间的平行结构。
