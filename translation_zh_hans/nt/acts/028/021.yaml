  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οἱ δὲ πρὸς αὐτὸν εἶπαν· Ἡμεῖς οὔτε γράμματα περὶ σοῦ ἐδεξάμεθα ἀπὸ τῆς Ἰουδαίας, οὔτε παραγενόμενός τις τῶν ἀδελφῶν ἀπήγγειλεν ἢ ἐλάλησέν τι περὶ σοῦ πονηρόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/021.yaml
  text: But they said to him[a], “We have received no letters from Judea about you[b], nor has any of the brothers who came reported or spoken anything evil about you.”
translation:
  language: zh_hans
  text: 但他们对他说：“我们既没有收到从犹太地寄来、提到你的信，也没有任何一位前来的弟兄[a]报告过或说过你什么坏话。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“弟兄”可能指从犹太地来的犹太同胞；原文没有明确说他们是基督徒。
    reason: 保留 τῶν ἀδελφῶν 在此处的指称歧义，避免加入原文未明确给出的群体身份。
lexical_decisions:
- source_word: οἱ δὲ πρὸς αὐτὸν εἶπαν
  choice: 但他们对他说
  rationale: 保留 δέ 在对话中的轻微转折作用；“对他说”自然对应 πρὸς αὐτὸν，且不以人名替代原文代词。
- source_word: οὔτε ... οὔτε
  choice: 既没有……也没有
  rationale: 以现代汉语自然的关联结构保留原文两项并列否定。
- source_word: γράμματα περὶ σοῦ
  choice: 提到你的信
  rationale: γράμματα 在此指书信；περὶ σοῦ 表示内容涉及保罗。“提到你的信”比“关于你的信”更自然，也不暗示整封信只谈论他。
- source_word: ἐδεξάμεθα ἀπὸ τῆς Ἰουδαίας
  choice: 收到从犹太地寄来
  rationale: δέχομαι 在书信语境中指收到；“寄来”自然表达书信从犹太地而来，但不额外指定寄信人。
- source_word: παραγενόμενός τις τῶν ἀδελφῶν
  choice: 任何一位前来的弟兄
  rationale: “前来”表达 παραγίνομαι 的到达含义，同时不在正文中擅自补出原文未明说的出发地；“弟兄”保留 ἀδελφῶν 的称谓及其指称上的开放性。
- source_word: ἀπήγγειλεν ἢ ἐλάλησέν τι
  choice: 报告过或说过
  rationale: 分别用“报告”和“说”轻度保留两个动词的区别，不把二者合并为一个动作。
- source_word: περὶ σοῦ πονηρόν
  choice: 你什么坏话
  rationale: 按现代汉语习惯表达“有关你的坏事或不利言论”；“坏话”保留 πονηρόν 的负面评价，而不过度强化为正式控告。
theological_decisions:
- issue: τῶν ἀδελφῶν 所指的人群
  choice: 正文译为“弟兄”，不明确限定为基督徒
  alternative: 译为“犹太同胞”或“基督徒弟兄”
  rationale: 说话者是罗马的犹太人领袖，所指很可能是从犹太地前来的人，但原文没有明确说明这些“弟兄”是否为基督徒。保留称谓并用脚注说明，可避免把某一种身份判断写入正文。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“既没有……也没有……”清楚呈现原句结构；“前来的弟兄”简洁自然，并避免补入原文未明说的“从那里”或“到这里”。
