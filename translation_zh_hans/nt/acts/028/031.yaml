  text: κηρύσσων τὴν βασιλείαν τοῦ θεοῦ καὶ διδάσκων τὰ περὶ τοῦ κυρίου Ἰησοῦ Χριστοῦ μετὰ πάσης παρρησίας ἀκωλύτως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/031.yaml
  text: proclaiming the kingdom of God and teaching the things concerning the Lord Jesus the Messiah with all boldness[a], unhindered.
translation:
  language: zh_hans
  text: 放胆宣讲神的国，教导有关主耶稣这位弥赛亚[a]的事，毫无阻碍。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“主耶稣基督。”希腊语“Χριστός”既可作称号，意为“弥赛亚”，在某些语境中也可作为近乎专名的称谓，译作“基督”。
    reason: 保留 Χριστός 在称号用法与名称化用法之间的真实语义张力。
lexical_decisions:
- source_word: κηρύσσων
  choice: 宣讲
  rationale: 保留公开、郑重传扬信息的含义，也与表示教导的 διδάσκων 相区分；现在分词承接上文，概括保罗持续进行的事工。
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: 神的国
  rationale: 这是现代中文圣经语境中自然且广为理解的表达，同时容纳 βασιλεία 所含的王权、统治及国度层面。
- source_word: διδάσκων
  choice: 教导
  rationale: 直接表达持续施教的行动，并与“宣讲”并列。
- source_word: τὰ περὶ
  choice: 有关……的事
  rationale: 自然呈现希腊语“关于……的诸事”这一结构，不将具体内容过度展开。
- source_word: τοῦ κυρίου Ἰησοῦ Χριστοῦ
  choice: 主耶稣这位弥赛亚
  rationale: κύριος 译作基督论称号“主”；Χριστός 在此保留其称号义，以“这位弥赛亚”构成自然的中文同位表达。
- source_word: μετὰ πάσης παρρησίας
  choice: 全然坦荡无惧
  rationale: 兼顾 παρρησία 所含公开坦然与勇敢无惧的语义，并以“全然”体现 πάσης 的加强作用。
- source_word: ἀκωλύτως
  choice: 毫无阻碍
  rationale: 准确保留结尾副词的强调位置和使徒行传全书收束时“不受拦阻”的力度。
theological_decisions:
- issue: 基督论称号 Χριστός 的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处 Χριστός 与“主耶稣”连用，仍可理解为称号；正文用“弥赛亚”显明其语义，同时以脚注保留已名称化的传统译法“基督”，不消除原文可能兼具的称号与名称色彩。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。正文不补出希腊文未明说的主语，以承接上文；末尾两个短语保持并列和递进，突出保罗坦然传讲且福音不受阻碍的结局。
