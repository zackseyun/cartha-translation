revisions:
- from: 他们和保罗约定了一个日子，就有更多的人来到他的住处。保罗从早到晚向他们讲解，郑重见证上帝的国，并根据摩西律法和众先知的书，劝他们相信有关耶稣的事。[a]
  to: 他们同保罗约定了一个日子后，更多的人来到保罗住的地方。保罗从早到晚向他们讲解，郑重地为上帝的国作见证，并根据摩西的律法和先知书，就耶稣的事劝说他们。[a]
  rationale: 修订仅限于消除“相信有关耶稣的事”所增加的具体化，并改善“律法和先知书”的汉语表达。句子仍保留保罗以以色列圣经为依据、就耶稣劝说听众的句法联系，也不判定劝说是否成功。
