  text: Ταξάμενοι δὲ αὐτῷ ἡμέραν ⸀ἧκον πρὸς αὐτὸν εἰς τὴν ξενίαν πλείονες, οἷς ἐξετίθετο διαμαρτυρόμενος τὴν βασιλείαν τοῦ θεοῦ πείθων τε ⸀αὐτοὺς περὶ τοῦ Ἰησοῦ ἀπό τε τοῦ νόμου Μωϋσέως καὶ τῶν προφητῶν ἀπὸ πρωῒ ἕως ἑσπέρας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/023.yaml
  text: After they had arranged a day with him[a], more of them came to him at his lodging. To them he was explaining, solemnly testifying about the kingdom of God and persuading them concerning Jesus from both the Law of Moses and the Prophets[c][b], from morning until evening.
translation:
  language: zh_hans
  text: 他们同保罗约定了一个日子后，更多的人来到保罗住的地方。保罗从早到晚向他们讲解，郑重地为上帝的国作见证，并根据摩西的律法和先知书，就耶稣的事劝说他们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “劝说他们”也可译作“劝服他们”或“设法说服他们”。原文描述保罗持续劝说他们，不一定表示所有人最终都被说服。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταξάμενοι δὲ αὐτῷ ἡμέραν
  choice: 他们和保罗约定了一个日子
  rationale: 中动词组表示双方定下会面的日期；将代词明确为“保罗”，可避免现代汉语中的指代含混。
- source_word: ἧκον πρὸς αὐτὸν εἰς τὴν ξενίαν
  choice: 来到他的住处
  rationale: ξενία指寄居或住宿的地方；“住处”自然、准确，也不额外断定房屋性质。
- source_word: πλείονες
  choice: 更多的人
  rationale: 保留比较级含义，表示这次来的人比先前更多，而非仅笼统地说“许多人”。
- source_word: ἐξετίθετο
  choice: 讲解
  rationale: 未完成时描写持续进行的阐释；“讲解”比“阐述”更易懂，同时保持庄重。
- source_word: διαμαρτυρόμενος
  choice: 郑重见证
  rationale: 保留该分词所含恳切、严肃作证的语气。
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: 上帝的国
  rationale: 采用现代汉语中透明而庄重的固定表达。
- source_word: πείθων τε αὐτοὺς περὶ τοῦ Ἰησοῦ
  choice: 劝他们相信有关耶稣的事
  rationale: πείθω表示劝服、使人信服；此译表达保罗的劝服行动，但不暗示所有听众最终都被说服。
- source_word: ἀπό τε τοῦ νόμου Μωϋσέως καὶ τῶν προφητῶν
  choice: 根据摩西律法和众先知的书
  rationale: ἀπό在此表示论证的来源或根据；“众先知的书”使现代读者明白这是指以色列圣经中的先知著作，而非在场的先知。
- source_word: ἀπὸ πρωῒ ἕως ἑσπέρας
  choice: 从早到晚
  rationale: 准确自然地表达整个白昼的时间跨度，不把 πρωΐ过度具体化为黎明。
theological_decisions:
- issue: 上帝的国与有关耶稣之事的关系
  choice: 将两者呈现为保罗同一次持续讲解与见证中的相连内容
  alternative: 把两者处理成彼此无关的两个讲题
  rationale: 希腊文句法把见证上帝的国和劝服听众有关耶稣的事连接在同一活动中；译文保留这种联系，而不进一步建立经文本身未明说的神学体系。
- issue: πείθων是否表示劝服已经成功
  choice: 译为“劝他们相信”，侧重劝服行动而不保证结果
  alternative: 译为“说服了他们”，暗示听众均已接受
  rationale: 现在分词描述持续的劝服行为；后文显示听众反应不一，因此不应把行为结果写死。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“和保罗约定”及“他的住处”避免生硬直译；句序略作调整，把“从早到晚”置于保罗持续讲解之前，使汉语结构清晰。脚注标记已在正文中出现。
