  text: οἵ ⸀τε βάρβαροι παρεῖχον οὐ τὴν τυχοῦσαν φιλανθρωπίαν ἡμῖν, ⸀ἅψαντες γὰρ πυρὰν προσελάβοντο πάντας ἡμᾶς διὰ τὸν ὑετὸν τὸν ἐφεστῶτα καὶ διὰ τὸ ψῦχος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/002.yaml
  text: And the local people showed us extraordinary kindness[b][a], for they lit a fire and welcomed all of us because of the rain that had set in and because of the cold.
translation:
  language: zh_hans
  text: 当地人待我们格外友善[a][b]；因雨已经下起来，又因天冷，他们生起火来，接待我们所有人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “当地人”原文为“βάρβαροι”，指不说希腊语的人；这里指岛上的本地居民，并不一定含有“野蛮”或“未开化”的意思。
    reason: lexical_alternative
  - marker: b
    text: “格外友善”也可译作“待我们不是一般地友善”。
    reason: lexical_alternative
lexical_decisions:
- source_word: βάρβαροι
  choice: 当地人
  rationale: 此词在这里主要指不说希腊语的本地居民，并不必然含有野蛮、未开化之意。“当地人”符合现代汉语表达，也避免“蛮族”等词带来的贬义。
- source_word: οὐ τὴν τυχοῦσαν φιλανθρωπίαν
  choice: 待我们格外友善
  rationale: οὐ τὴν τυχοῦσαν 是“非同寻常、并不一般”的习语，φιλανθρωπία 指对人的仁厚与善意；“格外友善”自然表达了当地人给予非常善待的意思。
- source_word: παρεῖχον
  choice: 待……友善
  rationale: παρέχω 与 φιλανθρωπία 搭配，表示给予或表现出善意；合译为“待我们……友善”符合现代汉语习惯。
- source_word: ἅψαντες
  choice: 生起
  rationale: ἅπτω 与 πυρά 连用表示点燃火堆；“生起火来”自然准确，并保留其作为接待行动的背景关系。
- source_word: πυρὰν
  choice: 火
  rationale: πυρά 可指火或火堆；上下文未要求明确译作大型篝火，因此采用宽泛自然的“火”。
- source_word: προσελάβοντο
  choice: 接待
  rationale: 此处表示把遇难者接纳到身边并给予照顾。“接待”兼顾接纳与款待之意，且不额外暗示提供住宿。
- source_word: πάντας ἡμᾶς
  choice: 我们所有人
  rationale: 保留 πάντας 的整体强调，说明船上这一行人无一被排除。
- source_word: διὰ τὸν ὑετὸν τὸν ἐφεστῶτα
  choice: 因为当时……下雨
  rationale: ἐφεστῶτα 表明雨已经来到并仍在持续；“当时下雨”以自然汉语表达现场正在经历的雨势，不过不额外限定为暴雨。
- source_word: διὰ τὸ ψῦχος
  choice: 因为当时……寒冷
  rationale: ψῦχος 指寒冷或冷天气；与下雨并列译作“又下雨又寒冷”，简洁地保留双重原因。
- source_word: οἵ τε
  choice: 当地人
  rationale: τε 承接前文并推进叙事；中文经文分节中不必机械译出连接词，句子衔接仍然清楚。
