source:
  edition: SBLGNT
  text: κἀκεῖθεν οἱ ἀδελφοὶ ἀκούσαντες τὰ περὶ ἡμῶν ⸀ἦλθαν εἰς ἀπάντησιν ἡμῖν ἄχρι Ἀππίου Φόρου καὶ Τριῶν Ταβερνῶν, οὓς ἰδὼν ὁ Παῦλος εὐχαριστήσας τῷ θεῷ ἔλαβε θάρσος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/015.yaml
  text: And from there the brothers[a], when they heard about us, came to meet us as far as Appius Forum and Three Taverns. When Paul saw them, he gave thanks to God and took courage.
translation:
  language: zh_hans
  text: 那里的弟兄们[a]听见我们的消息后，就出来迎接我们，一直来到亚比乌广场和三馆。保罗见了他们，就感谢神，得了勇气。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“弟兄姊妹们”。希腊文直译为“弟兄们”；这是对同信者的常用称呼，在具体语境中也可包括女性。
    reason: 说明原文形式与语境中可能具有的包容范围。
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: 那里的
  rationale: 承接行程叙事并表达空间来源；与后面的“弟兄们”自然衔接。
- source_word: οἱ ἀδελφοὶ
  choice: 弟兄们[a]
  rationale: 保留希腊文阳性复数的亲属称谓及早期基督徒群体内部的称呼；脚注说明语境中可包括女性。
- source_word: ἀκούσαντες τὰ περὶ ἡμῶν
  choice: 听见我们的消息
  rationale: 将时间性分词自然译为汉语顺承结构；τὰ περὶ ἡμῶν指有关保罗一行的情况或消息。
- source_word: ἦλθαν εἰς ἀπάντησιν ἡμῖν
  choice: 就出来迎接我们
  rationale: 准确表达前往与来者会合的惯用语义；“出来迎接”符合他们从罗马方向前来的场景。
- source_word: ἄχρι Ἀππίου Φόρου καὶ Τριῶν Ταβερνῶν
  choice: 一直来到亚比乌市场和三馆
  rationale: ἄχρι标明迎接者所到的路程范围；采用简明且有传统辨识度的地名译法。
- source_word: οὓς ἰδὼν ὁ Παῦλος
  choice: 保罗见了他们
  rationale: 明确关系代词所指的是前述弟兄们，并以自然汉语表达时间顺序。
- source_word: εὐχαριστήσας τῷ θεῷ
  choice: 就感谢神
  rationale: 将分词与主句动作按先后顺承表达，并保留明确的受事对象“神”。
- source_word: ἔλαβε θάρσος
  choice: 壮起胆来
  rationale: 贴近“获得勇气”的语义，同时使用自然、庄重的现代汉语，避免把它弱化为一般性的“受到鼓励”。
theological_decisions:
- issue: ἀδελφοί是否显明译出女性信徒
  choice: 弟兄们[a]
  alternative: 弟兄姊妹们；信徒们
  rationale: 正文保留原文阳性复数形式及其群体称谓色彩，不把可能的包容意义直接改写进正文；脚注交代该称呼在语境中可包括女性。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语体。“亚比乌市场”和“三馆”作为地名简洁易读；“壮起胆来”保留原文获得勇气的动态表达。
