base_translation:
  language: en
  yaml_path: translation/nt/acts/028/007.yaml
  text: In the area around that place there were lands belonging to the chief man of the island[a], named Publius[c][b], who welcomed us and hosted us courteously for three days.
translation:
  language: zh_hans
  text: 那地方周围有些田产，属于岛上首要的人物[a]，名叫部百流。他接待了我们，又殷勤地款待我们三天。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “首要的人物”也可译作“岛上的最高长官”。希腊语可能指岛上地位最高或最有权势的人，也可能是当地的正式称号。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐν δὲ τοῖς περὶ τὸν τόπον ἐκεῖνον
  choice: 那地方周围
  rationale: περὶ τὸν τόπον 表示该地点附近的区域；δέ在此是轻微的叙事衔接，中文无需机械译出。
- source_word: ὑπῆρχεν χωρία
  choice: 有些田产
  rationale: χωρία在此指附近的土地或地产；“田产”既表达不动产含义，也保留其复数所暗示的多处产业，避免限定为单纯田地。
- source_word: τῷ πρώτῳ τῆς νήσου
  choice: 岛上的首要人物
  rationale: πρῶτος在这里表示地位居首或身份显要的人，可能带有职衔意味；“首要人物”保留这种含义而不武断指定具体官职。
- source_word: ὀνόματι Ποπλίῳ
  choice: 名叫部百流
  rationale: ὀνόματι加与格引出姓名；“部百流”采用中文圣经传统中对Publius的通行译名。
- source_word: ἀναδεξάμενος ἡμᾶς
  choice: 他接待了我们
  rationale: 该分词表示接纳来客；“接待”自然地传达迎入和款待的语境。
- source_word: τρεῖς ἡμέρας
  choice: 三天
  rationale: 宾格表示时间延续；中文直接说“款待我们三天”即可表达“为期三天”。
- source_word: φιλοφρόνως ἐξένισεν
  choice: 殷勤款待
  rationale: φιλοφρόνως表示友善、体贴地，ξενίζω表示把人当客人招待；“殷勤款待”简洁自然地合并表达二者。
