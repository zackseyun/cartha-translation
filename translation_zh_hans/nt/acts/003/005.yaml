base_translation:
  language: en
  yaml_path: translation/nt/acts/003/005.yaml
  text: So he fixed his attention on them[a], expecting to receive something from them.
translation:
  language: zh_hans
  text: 那人就注视着他们[a]，期待从他们那里得到点什么。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“留意他们”，又或“定睛看着他们”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: 那人就
  rationale: ὁ回指前文那位瘸腿的人；δέ是较轻的叙事连接词。译作“那人就”既明确指代，也自然承接彼得的话。
- source_word: ἐπεῖχεν
  choice: 注视着
  rationale: 此处ἐπέχω表示把注意力集中于某人；未完成时体现持续状态。“注视着”在现代汉语中兼顾专注观看与持续留意。
- source_word: αὐτοῖς
  choice: 他们
  rationale: 指彼得和约翰，与“注视着”自然搭配。
- source_word: προσδοκῶν
  choice: 期待
  rationale: 现在分词表达与注视同时发生的伴随状态，含有所盼望地等候之意。
- source_word: τι
  choice: 点什么
  rationale: 表示不特定但有所预期的东西；结合语境可能是施舍，但原文并未明说，故不将其具体化。
- source_word: παρ’ αὐτῶν
  choice: 从他们那里
  rationale: παρά加属格表示来源；此译法清楚自然。
- source_word: λαβεῖν
  choice: 得到
  rationale: 不定式说明他所期待之事。此处“得到”比“拿”更符合接受别人给予之物的语境，也比书面色彩较重的“领受”更自然。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“那人”避免汉语中代词指向不清；“点什么”保留原文τι的非特指性，不提前说明他所期待的是钱或施舍。
