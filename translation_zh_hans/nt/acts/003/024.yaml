  text: καὶ πάντες δὲ οἱ προφῆται ἀπὸ Σαμουὴλ καὶ τῶν καθεξῆς ὅσοι ἐλάλησαν καὶ κατήγγειλαν τὰς ἡμέρας ταύτας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/024.yaml
  text: And all the prophets from Samuel and those after him[a], as many as spoke[c][b], also announced these days.
translation:
  language: zh_hans
  text: 从撒母耳起，及后来接续而来的所有先知，凡说过话的，都宣告了这些日子[c][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 或译：“传扬”；按上下文也可理解为“预告”。
    reason: lexical_alternative
  - marker: c
    text: “这些日子”也可译作“这些时期”，指彼得讲话中正在应验的这个时期。
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες δὲ οἱ προφῆται
  choice: 众先知
  rationale: δέ在这里主要承接上文，现代汉语无需另译；πάντες由“众”并结合后文“凡……都……”表达其全称范围。
- source_word: ἀπὸ Σαμουὴλ
  choice: 从撒母耳起
  rationale: ἀπό标示先知序列的起点；“从……起”在现代汉语中自然且明确。
- source_word: τῶν καθεξῆς
  choice: 后来接续他的
  rationale: καθεξῆς表示依次延续；补出“他”指向撒母耳，使汉语关系清楚，同时不限定具体的继承方式。
- source_word: ὅσοι ἐλάλησαν
  choice: 凡发言的
  rationale: ὅσοι表达涵盖所有相关对象的范围，“凡……的”准确传达其全称意味；ἐλάλησαν仅指说话或发言，不额外解释为预言。
- source_word: καὶ κατήγγειλαν
  choice: 也都宣告了
  rationale: καταγγέλλω指公开宣告或传扬；译作“宣告”保留其基本语义，避免直接收窄为“预言”。“也”体现连接关系，“都”与“凡”呼应。
- source_word: τὰς ἡμέρας ταύτας
  choice: 这些日子
  rationale: 直译时间表达，保留它可指彼得讲话中当前应验时期的含义，而不在正文中将其解释得更具体。
theological_decisions:
- issue: 先知所宣告的当前救恩历史时期
  choice: 这些日子
  alternative: 这些时期
  rationale: 原文使用“日子”，正文保留其具体意象及末世性含义的开放度，不明说为某一套神学分期。
- issue: 先知言说与预告的关系
  choice: 发言……宣告
  alternative: 说预言……预告
  rationale: 原文ἐλάλησαν与κατήγγειλαν本身并不必然要求译成技术性的“说预言”或“预告”；采用较宽的措辞，既符合先知语境，也不把上下文推论写进词义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“从……起”“凡……都……”使长句关系清楚；避免古奥的“尔后”“凡所言者”等表达。正文保留原文对“宣告”和“这些日子”的语义开放度。
