  source_fidelity: 译文准确传达了从撒母耳开始、其后先知、说话及宣告“这些日子”的基本内容；但“以及”与“从……起”搭配不顺，且“凡发言的”在此处既不自然，也弱化了ὅσοι ἐλάλησαν所表达的“凡说过话的／所有曾说话的”范围结构。
  naturalness: 应改为更合乎现代普通话句法的“从撒母耳起，及后来接续而来的所有先知，凡说过话的，都……”。“发言”偏现代会议语境，不适合此处先知言说的庄重叙述。
  terminology: “先知”“撒母耳”“宣告”“这些日子”均恰当。“宣告”可保留，不必将κατήγγειλαν限定为“预言”；为与审校轨迹一致，宜为其增设“传扬／预告”的词汇替代注。
