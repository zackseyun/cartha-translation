  - severity: low
    issue: 脚注未覆盖“宣告”的词汇替代
    rationale: 英语审校轨迹为κατήγγειλαν保留“传扬／预告”的替代可能。中文正文采用“宣告”时，增设相应脚注可更完整地保留该词在先知语境中的语义开放度。
  revised_text: 从撒母耳起，及后来接续而来的所有先知，凡说过话的，都宣告了这些日子[c][b]。
