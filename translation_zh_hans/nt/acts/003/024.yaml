revisions:
- from: 从撒母耳起，以及后来接续他的众先知[a]，凡发言的，也都宣告了这些日子[b]。
  to: 从撒母耳起，及后来接续而来的所有先知，凡说过话的，都宣告了这些日子[c][b]。
  rationale: 调整句法以清楚表达“从撒母耳起”与“其后接续者”的范围，并将“发言”改为中性、庄重且更符合先知语境的“说过话”。保留“宣告”和“这些日子”，避免将原文直接解释为技术性的预言或特定神学分期；补足“宣告”的替代译法脚注。
