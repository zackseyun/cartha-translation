source:
  edition: SBLGNT
  text: ὑμεῖς ἐστε ⸀οἱ υἱοὶ τῶν προφητῶν καὶ τῆς διαθήκης ἧς ⸂διέθετο ὁ θεὸς⸃ πρὸς τοὺς πατέρας ⸀ὑμῶν, λέγων πρὸς Ἀβραάμ Καὶ ἐν τῷ σπέρματί σου ⸀ἐνευλογηθήσονται πᾶσαι αἱ πατριαὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/025.yaml
  text: You are the sons of the prophets and of the covenant that God made with your fathers[a], saying to Abraham[b], ‘And in your offspring all the families of the earth will be blessed.’
translation:
  language: zh_hans
  text: 你们是众先知的子孙，也是承受那约的人[a]；这约是上帝同你们的祖先所立的。他对亚伯拉罕说：“地上万族都要因你的后裔[b]得福。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“众先知和那约的儿子”。此处指承接众先知的信息和盟约应许的人，不必限于众先知的亲生儿子。
    reason: lexical_alternative
  - marker: b
    text: “后裔”原文也可直译为“种子”，可统称亚伯拉罕的后代，也可带有一位代表性后裔的含义。“因你的后裔”也可译作“在你的后裔里”。
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὶ
  choice: 承受人
  rationale: 原文直译为“儿子们”，在这里是盟约继承者的表达，并非仅指亲生儿子。译作“承受人”可在现代汉语中自然表达其继承先知应许和盟约的身份，同时以脚注保留原文意象。
- source_word: τῶν προφητῶν
  choice: 众先知
  rationale: 属格与“承受人”相连，表示听众承接众先知所传的应许与产业，不必理解为众先知肉身上的后代。
- source_word: διαθήκης
  choice: 约
  rationale: 在亚伯拉罕及列祖的语境中，διαθήκη 指上帝所设立的盟约；“约”是简洁、通行且符合圣经语境的现代汉语表达。
- source_word: διέθετο ὁ θεὸς πρὸς τοὺς πατέρας ὑμῶν
  choice: 上帝与你们的祖先所立的
  rationale: διατίθεμαι 与 διαθήκη 连用表示立约；πρός 在此按立约双方的关系译作“与”。πατέρες 译作“祖先”，比“父亲们”更准确地表达以色列先祖。
- source_word: λέγων πρὸς Ἀβραάμ
  choice: 他曾对亚伯拉罕说
  rationale: 将希腊语分词结构转换为自然的汉语独立分句，并明确主语仍是上帝。
- source_word: σπέρματί
  choice: 后裔
  rationale: “后裔”可作集合称谓，也不排除由一位代表性后裔集中体现应许，较能保留原词在本段及更广圣经语境中的张力。
- source_word: ἐνευλογηθήσονται
  choice: 都要……得福
  rationale: 准确表达将来时被动语态；“得福”比生硬的“被祝福”更符合现代汉语，同时保留福分来自上帝的含义。
- source_word: πᾶσαι αἱ πατριαὶ τῆς γῆς
  choice: 地上万族
  rationale: πατριαί 指家族、宗族群体；“万族”自然表达 πᾶσαι 的普遍范围，也保留亚伯拉罕应许面向全地各族的意义。
theological_decisions:
- issue: υἱοὶ 的盟约继承者意象及代表性阳性表达
  choice: 正文译作“承受人”，脚注说明原文直译为“儿子”
  alternative: 众先知和那约的儿子／子孙
  rationale: 汉语“约的儿子”极不自然，“子孙”又容易被误解为生物血统。译作“承受人”呈现该表达在语境中的盟约继承含义，脚注则保留原文的阳性亲属意象。
- issue: σπέρμα 的集合义与单数代表义
  choice: 后裔
  alternative: 种子／子孙／一位后裔
  rationale: “后裔”在汉语中既可集合使用，也可指代表性的后代，不强行限定为纯复数群体或单一弥赛亚个体，因而保留原文可能承载的神学张力。
- issue: ἐν τῷ σπέρματί 的关系含义
  choice: 因你的后裔
  alternative: 在你的后裔里
  rationale: “因”在现代汉语中自然表达福分借着亚伯拉罕后裔临到万族的含义；脚注列出较贴近介词形式的译法，以免排除“在……里”的理解。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“承受人”避免了“约的儿子”在汉语中的生硬感，同时由脚注保留原文意象；“地上万族”“得福”简洁而具有经文宣告的语体。
