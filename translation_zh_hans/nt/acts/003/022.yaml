id: ACT.3.22
reference: Acts 3:22
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Μωϋσῆς ⸀μὲν εἶπεν ὅτι Προφήτην ὑμῖν ἀναστήσει κύριος ὁ ⸀θεὸς ἐκ τῶν ἀδελφῶν ὑμῶν ὡς ἐμέ· αὐτοῦ ἀκούσεσθε κατὰ πάντα ὅσα ἂν λαλήσῃ πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/022.yaml
  text: Moses indeed said[a], ‘The Lord God will raise up for you a prophet from among your brothers, like me[b]. You shall listen to him in everything he says to you.’
translation:
  language: zh_hans
  text: 摩西的确说过：“主上帝[b]要从你们的弟兄[a]中，为你们兴起一位像我一样的先知。无论他对你们说什么，你们都要听从他。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄”也可译作“同胞以色列人”。希腊原文采用阳性亲属称谓，在这里泛指同属圣约群体的人。
    reason: lexical_alternative
  - marker: b
    text: 这里引用《申命记》18:15，但措辞略有不同；值得注意的是，《使徒行传》的希腊文本作“主上帝”，而不是“主你的上帝”。
    reason: cross_reference
lexical_decisions:
- source_word: Μωϋσῆς
  choice: 摩西
  rationale: 采用现代汉语中通行的圣经人名译法。
- source_word: μὲν
  choice: 的确
  rationale: 保留该语气词在论述推进中的强调作用，同时使现代汉语表达自然。
- source_word: εἶπεν ὅτι
  choice: 说过：“……”
  rationale: 以直接引语自然呈现引用公式；“过”也符合摩西先前说过这话的语境。
- source_word: Προφήτην
  choice: 一位……先知
  rationale: 原文无冠词，译作“一位先知”，不在正文中预先解释为特定称号“那位先知”。
- source_word: ἀναστήσει
  choice: 兴起
  rationale: 保留与《申命记》引文的传统动词联系；此处主要指使一位先知出现、承担使命，不把复活含义强加为首要解释。
- source_word: κύριος ὁ θεὸς
  choice: 主上帝
  rationale: 忠实反映《使徒行传》此处的希腊文；原文没有“你们的”，因此不按《申命记》措辞补入。
- source_word: ἐκ τῶν ἀδελφῶν ὑμῶν
  choice: 从你们的弟兄中
  rationale: 保留阳性亲属称谓及ἐκ的来源含义；脚注说明这里可指同胞以色列人。
- source_word: ὡς ἐμέ
  choice: 像我一样
  rationale: 按通常的比较意义翻译，指将来的先知与摩西相像。
- source_word: αὐτοῦ ἀκούσεσθε
  choice: 你们都要听从他
  rationale: 将将来时在圣约引文中的命令语气译出；“听从”比单纯“听见”更能表达顺服地听。
- source_word: κατὰ πάντα ὅσα ἂν λαλήσῃ πρὸς ὑμᾶς
  choice: 无论他对你们说什么
  rationale: 用自然现代汉语表达κατὰ πάντα与不定关系结构的全面、无例外之意。
theological_decisions:
- issue: 《申命记》18章引文及其弥赛亚指向
  choice: 正文保留“一位……先知”，不直接增译为“弥赛亚”或作为称号的“那位先知”。
  alternative: 在正文中明确译作“弥赛亚”或“那位先知”。
  rationale: 彼得在上下文中把这段经文应用于耶稣，但本节引文本身仍写“一位先知”；译文不应把上下文的身份认定直接增添进引文措辞。
- issue: ἀδελφῶν的群体范围
  choice: 译作“弟兄”，并以脚注说明可指同胞以色列人。
  alternative: 正文直接译作“同胞以色列人”或“弟兄姊妹”。
  rationale: 原文是阳性复数亲属称谓，在圣约民族语境中具有代表性；正文保留其形式，脚注交代实际范围。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“的确说过”保留论述强调；“兴起”“听从”兼顾原文关联与现代可懂度。脚注标记放在各自直接说明的词语之后。
