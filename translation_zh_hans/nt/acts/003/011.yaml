  yaml_path: translation/nt/acts/003/011.yaml
  text: While he was holding on to Peter and John[a], all the people, utterly astonished[b], ran together to them at the portico called Solomon’s.
translation:
  language: zh_hans
  text: 那人正紧紧抓住彼得和约翰[a]，众人都惊讶万分，一齐跑到他们所在的、称为“所罗门廊”的柱廊那里[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那人正紧紧拉住彼得和约翰。”原文动词可表示紧握或抓住不放。
    reason: lexical_alternative
  - marker: b
    text: “柱廊”指圣殿范围内有顶盖的列柱长廊；这处柱廊传统上称为“所罗门廊”。
    reason: cultural_note
lexical_decisions:
- source_word: Κρατοῦντος δὲ αὐτοῦ
  choice: 那人正紧紧拉着
  rationale: 属格独立结构与现在分词表示与主句同时发生的动作；κρατέω在此有抓住、紧握不放之意。“紧紧拉着”自然地保留身体上的抓持，又不过度推断那人的情绪或动机。
- source_word: τὸν Πέτρον καὶ τὸν Ἰωάννην
  choice: 彼得和约翰
  rationale: 采用现代汉语圣经传统中通行的人名音译。
- source_word: συνέδραμεν
  choice: 一齐跑到
  rationale: συντρέχω兼有奔跑和聚拢之意；“一齐跑到”保留快速移动及众人汇聚的含义。
- source_word: πᾶς ὁ λαὸς
  choice: 众人都
  rationale: 在圣殿场景中指在场的民众；“众人都”符合现代汉语表达，也保留πᾶς的整体性。
- source_word: πρὸς αὐτούς
  choice: 到他们那里
  rationale: πρός加宾格在此表示向着某人移动；此译符合自然汉语。
- source_word: ἐπὶ τῇ στοᾷ
  choice: 在……柱廊
  rationale: στοά指有顶盖、由柱子构成或围成的长廊；“柱廊”比“门廊”更准确地呈现圣殿建筑环境。
- source_word: τῇ καλουμένῃ Σολομῶντος
  choice: 称为“所罗门廊”的
  rationale: καλουμένῃ表示“被称为”；“所罗门廊”作为地点名称清楚自然，并补足汉语所需的名称形式。
- source_word: ἔκθαμβοι
  choice: 惊讶万分
  rationale: ἔκθαμβος表达强烈的惊异；“惊讶万分”保留其强度，并以汉语状语自然连接众人的行动。
