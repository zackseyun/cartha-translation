  text: τὸν δὲ ἀρχηγὸν τῆς ζωῆς ἀπεκτείνατε, ὃν ὁ θεὸς ἤγειρεν ἐκ νεκρῶν, οὗ ἡμεῖς μάρτυρές ἐσμεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/015.yaml
  text: but you killed the Author of life[a], whom God raised from the dead[b], of which we are witnesses.
translation:
  language: zh_hans
  text: 你们却杀了生命的创始者[a]，神使他从死人中复活；我们是这事的见证人。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “创始者”或译“元首”“引领者”或“开创者”。希腊语ἀρχηγός可包含开创、领导或居首等含义。
    reason: lexical_alternative
  - marker: b
    text: “这事的见证人”也可译作“他的见证人”。希腊原文可能指复活的主本人，也可能指他复活这件事。
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: 却
  rationale: 承接上文的指控，同时凸显“杀了”与神使他复活之间的反差；“却”在现代汉语中自然有力，但不过度强化为更激烈的转折。
- source_word: ἀρχηγὸν τῆς ζωῆς
  choice: 生命的创始者
  rationale: ἀρχηγός可兼有开创、引领和居首之意。“创始者”突出其与生命之起源的关系，也保留庄重的称号感；其他可能含义收入脚注。
- source_word: ἀπεκτείνατε
  choice: 你们……杀了
  rationale: 直译其简单过去时陈述，措辞直接；不采用“谋杀”，以免加入原动词本身未明确表达的法律定性。
- source_word: ἤγειρεν ἐκ νεκρῶν
  choice: 使他从死人中复活了
  rationale: 准确表达神使耶稣从死者中起来的复活宣告。“从死人中”较贴近ἐκ νεκρῶν，而“复活”符合现代汉语的圣经语境。
- source_word: οὗ ἡμεῖς μάρτυρές ἐσμεν
  choice: 我们就是这事的见证人
  rationale: 将οὗ理解为指向紧邻的复活事实；“就是”体现显式主语ἡμεῖς所带的强调，“见证人”保留名词结构。
theological_decisions:
- issue: 基督论称号ἀρχηγὸς τῆς ζωῆς的译法
  choice: 生命的创始者
  alternative: 生命的元首／生命的引领者／生命的开创者
  rationale: 原词同时涉及起源、领导和居首，正文选用最能呈现“杀死与生命相关的那一位”这一悖论的自然中文，并以脚注保留真实的词义宽度。
- issue: 关系代词οὗ的所指
  choice: 指复活这件事
  alternative: 指复活的耶稣本人
  rationale: οὗ在语法上可能关联所述之人，也可能关联他复活这一事实。正文按紧邻的复活陈述译作“这事”，脚注明示另一种可能，不消除原文歧义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。保留彼得指控的直接力度，以分号维持原句连续推进的结构；避免生硬照搬英语“Author”，并通过脚注保存ἀρχηγός及οὗ的语义张力。
