source:
  edition: SBLGNT
  text: ἰδὼν δὲ ⸀ὁ Πέτρος ἀπεκρίνατο πρὸς τὸν λαόν· Ἄνδρες Ἰσραηλῖται, τί θαυμάζετε ἐπὶ τούτῳ, ἢ ἡμῖν τί ἀτενίζετε ὡς ἰδίᾳ δυνάμει ἢ εὐσεβείᾳ πεποιηκόσιν τοῦ περιπατεῖν αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/012.yaml
  text: But when Peter saw it[a], he answered the people, “Men of Israel, why do you marvel at this[b], or why do you stare at us as though by our own power or godliness we had made him walk?”
translation:
  language: zh_hans
  text: 彼得见状，就对百姓说：“以色列人哪[a]，你们为什么对这件事感到惊奇？又为什么目不转睛地看着我们[b]，好像我们凭自己的能力或敬虔[c]使这个人行走似的？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“以色列男子们”，是当时公开讲话中的称呼方式。
    reason: gendered_source_form
  - marker: b
    text: “目不转睛地看着”也可译为“定睛看着”；原文动词表示持续、专注地注视。
    reason: lexical_alternative
  - marker: c
    text: “敬虔”也可译为“虔诚”，指对神的敬畏及由此表现出的虔敬生活。彼得否认这次医治出于使徒自身的这种素质。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν δὲ ὁ Πέτρος
  choice: 彼得见状
  rationale: ἰδών是先于主句动作的过去时分词，未明说宾语；“见状”自然表达彼得看见现场情形及群众反应，δὲ的轻微转折或推进由中文语序和“就”体现，无须生硬译作“但是”。
- source_word: ἀπεκρίνατο πρὸς τὸν λαόν
  choice: 就对百姓说
  rationale: ἀποκρίνομαι在此是对群众反应作出回应，并非回答一个明说的问题；“对百姓说”符合现代汉语叙事习惯。
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: 以色列人哪
  rationale: 保留对以色列群体的直接称呼，并采用自然庄重的中文呼语；阳性称呼ἄνδρες的字面形式在脚注交代。
- source_word: τί θαυμάζετε ἐπὶ τούτῳ
  choice: 你们为什么对这件事感到惊奇
  rationale: θαυμάζω表示惊讶、诧异；“感到惊奇”准确而通俗，τοῦτο指眼前的医治事件。
- source_word: ἢ ἡμῖν τί ἀτενίζετε
  choice: 为什么目不转睛地看着我们
  rationale: ἀτενίζω强调持续、专注地注视；“目不转睛地看着”保留其力度，又比单纯“看”更准确。
- source_word: ὡς ἰδίᾳ δυνάμει ἢ εὐσεβείᾳ
  choice: 好像我们是凭自己的能力或敬虔
  rationale: ὡς引出彼得所否定的错误设想；ἰδίᾳ强调属于使徒自身，εὐσέβεια指向对神的敬畏与虔敬生活。
- source_word: πεποιηκόσιν τοῦ περιπατεῖν αὐτόν
  choice: 使这个人行走
  rationale: πεποιηκόσιν与不定式表达被群众归给彼得和约翰的成就或结果；“使这个人行走”简洁保留其致使意义。
theological_decisions:
- issue: εὐσεβείᾳ是否暗示医治源于使徒的属灵功德
  choice: 敬虔
  alternative: 虔诚
  rationale: “敬虔”保留该词对神的敬畏与虔敬生活这一宗教内涵；句子的否定结构清楚表明，彼得否认医治出于使徒自身的属灵素质，但不引入后期关于功德的术语体系。
- issue: Ἄνδρες Ἰσραηλῖται的阳性呼语如何处理
  choice: 正文译作“以色列人哪”，脚注说明字面形式
  alternative: 以色列男子们
  rationale: “以色列男子们”虽更贴近形式，却不符合自然现代汉语公共称呼；正文采用庄重自然的群体呼语，脚注保存原文明确的阳性形式，避免无声抹平。
- issue: 医治的施事来源
  choice: 保留“好像”所引出的错误归因，不在本节补明真正施事者
  alternative: 增译“其实是神使他行走”
  rationale: 本节只否定医治出于使徒自己的能力或敬虔，真正来源在后文展开；不提前增补，以保留讲章论证的推进和本节的张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事与讲论语体。“彼得见状”简练承接上文；两个反问句保留彼得公开纠正群众误解的力度。“目不转睛”传达ἀτενίζω的持续凝视，“敬虔”维持宗教语义而不加入宗派性解释。
