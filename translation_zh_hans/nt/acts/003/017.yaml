base_translation:
  language: en
  yaml_path: translation/nt/acts/003/017.yaml
  text: And now[a], brothers, I know that you acted in ignorance, just as your rulers also did.
translation:
  language: zh_hans
  text: 如今，弟兄们[a]，我知道你们这样做是出于无知；你们的领袖也是如此。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“弟兄姊妹们”；希腊文直译为“弟兄们”，也可能以这一称呼代表在场更广泛的男女听众。
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ νῦν
  choice: 现在
  rationale: 在此作为话语转折，从前面的指控转入当前的劝告；现代汉语用“现在”已能自然表达这一推进，不必生硬保留连接词“并且”。
- source_word: ἀδελφοί
  choice: 弟兄们
  rationale: 忠实保留阳性复数称呼的字面形式；在本段语境中也可能以代表性方式称呼更广泛的以色列听众，故以脚注说明。
- source_word: οἶδα
  choice: 我知道
  rationale: 直接、自然地表达彼得所宣称的认知。
- source_word: κατὰ ἄγνοιαν
  choice: 出于无知
  rationale: 表达他们的行为是在缺乏认识的状态和影响下发生的，同时不把无知解释成完全无罪。
- source_word: ἐπράξατε
  choice: 才这样做的
  rationale: 结合上文所述之事，以“这样做”自然承接；不在本节另行补入希腊文没有明说的具体宾语。
- source_word: ὥσπερ καὶ
  choice: 也是如此
  rationale: 简洁表达比较兼追加之意，即听众如此行，他们的领袖同样如此。
- source_word: οἱ ἄρχοντες ὑμῶν
  choice: 你们的领袖
  rationale: 在耶路撒冷的政治—宗教语境中，指拥有权威的领导者；“领袖”比“统治者”更符合现代汉语称谓，同时保留其权威含义。
theological_decisions:
- issue: 彼得所说的“无知”是否免除听众及其领袖的罪责
  choice: 译作“出于无知”，承认无知是其行动的因素，但不暗示他们因此完全无罪。
  alternative: 译作“不知不觉地”或“因为你们不知道”，可能更容易被理解为淡化责任。
  rationale: 本节承认他们缺乏认识，而下文仍呼吁他们悔改（3:19）；译文应保留无知与责任并存的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“出于无知才这样做”比直译式“在无知中行事”自然，并保留原因或行为特征之间适度的语义开放性；分号使百姓与领袖之间的比较关系清楚。
