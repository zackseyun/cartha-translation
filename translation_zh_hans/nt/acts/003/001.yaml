  yaml_path: translation/nt/acts/003/001.yaml
  text: Peter and John were going up to the temple at the hour of prayer[a], the ninth hour.
translation:
  language: zh_hans
  text: 彼得和约翰正上圣殿去，在祷告的时辰，就是第九时[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “第九时”按当时从日出约六时起算，约为下午三点。
    reason: cultural_note
lexical_decisions:
- source_word: δὲ
  choice: 不单独译出
  rationale: 此处是轻微的叙事连接词，并无强烈转折；现代汉语承接上文时可自然省略，避免加入原文没有的显著时间词或转折词。
- source_word: ἀνέβαινον
  choice: 正上……去
  rationale: 未完成时表达当时正在进行的行动；“上……去”也保留了前往耶路撒冷圣殿的方向性惯用表达。
- source_word: εἰς τὸ ἱερὸν
  choice: 上圣殿去
  rationale: ἱερόν指圣殿区域或院宇，不专指内殿；正文采用通顺而常见的“圣殿”，不作过度技术化处理。
- source_word: ἐπὶ τὴν ὥραν τῆς προσευχῆς
  choice: 参加……祷告的时辰
  rationale: 该介词短语表示他们在指定的祷告时间前往圣殿；补出“参加”使现代汉语中的目的关系清楚，同时不改变事件内容。
- source_word: τὴν ἐνάτην
  choice: 申初
  rationale: “第九时”按当时从日出约六时起算，约为下午三点；“申初”以简洁的传统汉语时辰表达保留古代计时色彩，现代换算置于脚注。
