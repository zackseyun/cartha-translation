base_translation:
  language: en
  yaml_path: translation/nt/acts/003/004.yaml
  text: And Peter[a], together with John, fixed his gaze on him and said, “Look at us.”
translation:
  language: zh_hans
  text: 彼得同约翰一起定睛看着他，说：“看我们！”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀτενίσας
  choice: 定睛看着
  rationale: 该词表示目光专注地投向某人，不只是随意一看。“定睛看着”自然地保留了这种凝视和专注。
- source_word: δὲ
  choice: 不单独译出
  rationale: 这里的δέ是轻微的叙事连接词。现代汉语可借语序自然承接上文，若硬译为“于是”或“但”反而可能增加原文没有的因果或转折意味。
- source_word: σὺν τῷ Ἰωάννῃ
  choice: 同约翰一起
  rationale: σύν加与格表示陪同。“同约翰一起”清楚表达约翰与彼得一同行动，同时仍以彼得为句法上的主要人物。
- source_word: εἶπεν
  choice: 说
  rationale: 此处是普通的说话动词，“说”直接、自然。
- source_word: Βλέψον
  choice: 看
  rationale: 这是对一人的直接命令，要求他把注意力转向彼得和约翰。“看”简洁自然，力度与语境相称。
- source_word: εἰς αὐτόν
  choice: 看着他
  rationale: 介词εἰς在视觉动词后标明目光所投向的对象；现代汉语用“看着他”最为自然。
- source_word: εἰς ἡμᾶς
  choice: 看我们
  rationale: 在视觉动词后，εἰς表示视线指向的对象。“看我们”是自然、明确的现代汉语表达。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重而口语自然的现代标准汉语。以“定睛看着”与普通命令“看”区分原文两个视觉动词的语义强度；未添加原文没有的礼貌词“请”。
