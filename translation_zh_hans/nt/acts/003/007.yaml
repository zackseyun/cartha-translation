  text: καὶ πιάσας αὐτὸν τῆς δεξιᾶς χειρὸς ἤγειρεν ⸀αὐτόν· παραχρῆμα δὲ ἐστερεώθησαν ⸂αἱ βάσεις αὐτοῦ⸃ καὶ τὰ ⸀σφυδρά,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/007.yaml
  text: And taking him by the right hand[a], he raised him up; and immediately his feet and ankles were strengthened.
translation:
  language: zh_hans
  text: 彼得握住他的右手，扶他起来；他的双脚和脚踝[a]立刻就有了力量。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：踝骨。
    reason: σφυδρά可指踝部，亦可较具体地译为“踝骨”；正文采用自然且不作过度解剖限定的“脚踝”。
lexical_decisions:
- source_word: πιάσας
  choice: 抓住
  rationale: 表达实际握住并用力相助的动作，比“拉着”更贴近原词，又不带“抓捕”的负面意味。
- source_word: τῆς δεξιᾶς χειρός
  choice: 他的右手
  rationale: 按汉语习惯补出所属关系；原文指彼得抓住那人的右手。
- source_word: ἤγειρεν αὐτόν
  choice: 把他扶起来
  rationale: 在此具体场景中自然表达彼得借手使他起身，同时保留实际动作，不将其扩写为“医好”。
- source_word: παραχρῆμα
  choice: 立刻
  rationale: 准确表达医治即时发生，行文简洁自然。
- source_word: ἐστερεώθησαν
  choice: 有了力量
  rationale: 保留被动结果所表达的力量得到恢复，又比生硬的“被坚固”更符合现代汉语。
- source_word: αἱ βάσεις αὐτοῦ
  choice: 他的双脚
  rationale: βάσεις在人体语境中指用于站立的脚部；译作“双脚”自然清楚，并与后面的脚踝区分。
- source_word: τὰ σφυδρά
  choice: 脚踝
  rationale: 该词指脚踝或踝部；“脚踝”准确、通俗，不强行限定为踝骨。
theological_decisions:
- issue: 医治性质的表述
  choice: 具体叙述双脚和脚踝立刻恢复力量
  alternative: 译作“立刻得了医治”或明说是上帝使其强健
  rationale: 原文通过身体部位得到力量来叙述事件，并未在本句直接说明施动者或使用“医治”一词；译文不额外解释神迹的机制或神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“扶起来”符合善意援助的场景；“有了力量”避免直译腔，同时保留原文对身体功能即时恢复的具体描写。
