  text: ὃν δεῖ οὐρανὸν μὲν δέξασθαι ἄχρι χρόνων ἀποκαταστάσεως πάντων ὧν ἐλάλησεν ὁ θεὸς διὰ ⸀στόματος τῶν ἁγίων ⸂ἀπ’ αἰῶνος αὐτοῦ προφητῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/021.yaml
  text: whom heaven must receive until the times of the restoration of all things that God spoke through the mouth of his holy prophets from of old.
translation:
  language: zh_hans
  text: 他必须被接到天上，直到万物复兴的时期；正如上帝自古以来借着他圣先知的口所说到的这一切[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译可作：“直到万物复兴的时期，即上帝自古以来借着他圣先知的口所说到的一切。”关系代词的属格形式可能反映与“万物”相连的格吸引；本译文保留上帝借先知所说与“万物复兴”之间的关联，而不界定复兴的范围或方式。
    reason: 更准确说明ὧν与πάντων的句法关联，并避免把神所说的内容不必要地限定为“复兴的时期”或某一特定神学解释。
lexical_decisions:
- source_word: ὃν δεῖ οὐρανὸν μὲν δέξασθαι
  choice: 他必须被接到天上
  rationale: 保留“必须”的神圣必然性，并以自然汉语表达“天接纳他”这一希腊语拟人化结构；不译成“留在天上”，以免把“接纳”悄然改成“拘留、停留”。
- source_word: ἄχρι χρόνων
  choice: 直到……之时
  rationale: χρόνων为复数，表示所定的时期；汉语用单数式“之时”更自然，且不损失其时段含义。
- source_word: ἀποκαταστάσεως πάντων
  choice: 万物复兴
  rationale: 保留“恢复、重建到应有状态”的核心语义，并采用现代中文圣经语境中自然而庄重的表达；不将其解释为某一特定系统神学主张。
- source_word: διὰ στόματος
  choice: 借着……的口
  rationale: 保留原文以“口”为媒介的希伯来式表达，中文清楚可懂且庄重。
- source_word: ἀπ’ αἰῶνος
  choice: 自古以来
  rationale: 表达“从久远的世代起”，比逐字的“从永世”更符合此处论及古代先知的语境。
theological_decisions:
- issue: ἀποκατάστασις πάντων的范围
  choice: 万物复兴
  alternative: 一切得救／普世复原
  rationale: 原文表明“万物”的复兴，却没有在本节界定其具体范围或方式；译文不加入普救论或其他教派性解释。
- issue: ὧν的关系指向
  choice: 上帝……所说的万物复兴
  alternative: 万物，就是上帝……所说的那些事
  rationale: 希腊语因关系代词的格吸引而具有一定句法张力；正文采用自然汉语，同时用脚注保留“上帝所说的”可侧重修饰“万物”或整件“万物复兴”之事的可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“被接到天上”比“天必须接纳他”更符合汉语习惯，同时保留原文δέξασθαι的接纳动作；“圣先知”保留原文对先知的修饰及“他的”所表达的归属关系。
