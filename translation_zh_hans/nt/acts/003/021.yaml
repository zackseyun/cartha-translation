- from: 他必须被接到天上，直到上帝自古以来借着他圣先知的口所说的万物复兴之时[a]。
  to: 他必须被接到天上，直到万物复兴的时期；正如上帝自古以来借着他圣先知的口所说到的这一切[a]。
  rationale: 将末尾关系从句改为“正如……所说到的这一切”，使其在现代汉语中自然地回指“万物复兴”，并以分号避免把“上帝所说的”误附着于“时期”。“时期”也较好地涵盖χρόνων的复数／时段含义。脚注改为简明说明格吸引及保留的语义开放性。
