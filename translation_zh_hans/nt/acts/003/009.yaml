base_translation:
  language: en
  yaml_path: translation/nt/acts/003/009.yaml
  text: And all the people saw him walking and praising God,
translation:
  language: zh_hans
  text: 众人都看见他一边行走，一边赞美上帝。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: 众人
  rationale: 句首连接词承接上文；中文叙事中省略“于是/并且”更自然，也不额外强化时间或逻辑关系。
- source_word: εἶδεν
  choice: 看见
  rationale: 直接表达众人对这个已得医治之人的亲眼所见，符合此处简单的叙事语义。
- source_word: πᾶς ὁ λαὸς
  choice: 众人都
  rationale: 表达单数集合名词与 πᾶς 所具有的整体意义；“众人”在现代汉语中比“全体百姓”更贴合现场语境，同时不把 λαός 缩窄为单纯的“群众”。
- source_word: αὐτὸν
  choice: 他
  rationale: 指向上文得医治的那个人，作“看见”的宾语。
- source_word: περιπατοῦντα
  choice: 行走
  rationale: 保留现在分词所描写的持续可见动作，并突出先前不能行走的人如今正在走路这一医治结果。
- source_word: καὶ αἰνοῦντα
  choice: 一边……一边赞美
  rationale: 两个现在分词并列，描写众人同时看见的动作；用“一边……一边……”自然呈现其同时性而不改变内容。
- source_word: τὸν θεόν
  choice: 上帝
  rationale: 作为赞美的明确对象；“上帝”是现代标准普通话中清楚、庄重且通行的 θεός 译法。
theological_decisions: []
