source:
  edition: SBLGNT
  text: καί τις ἀνὴρ χωλὸς ἐκ κοιλίας μητρὸς αὐτοῦ ὑπάρχων ἐβαστάζετο, ὃν ἐτίθουν καθ’ ἡμέραν πρὸς τὴν θύραν τοῦ ἱεροῦ τὴν λεγομένην Ὡραίαν τοῦ αἰτεῖν ἐλεημοσύνην παρὰ τῶν εἰσπορευομένων εἰς τὸ ἱερόν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/002.yaml
  text: And a certain man[a], lame from his mother’s womb, was being carried, whom they would place every day at the gate of the temple called Beautiful, to ask for alms from those entering into the temple[c][b],
translation:
  language: zh_hans
  text: 有一个人，生来腿瘸，常被人抬着；每天有人把他放在圣殿区[a]一个叫“美门”[b]的门口，好让他向进入圣殿区的人求施舍。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣殿区”原文指整个圣殿建筑群及其院落，不专指内殿。
    reason: cultural_note
  - marker: b
    text: “美门”按字面可译为“美丽的（门）”；这是这座门的名称。
    reason: lexical_alternative
lexical_decisions:
- source_word: τις ἀνὴρ
  choice: 有一个人
  rationale: τις与ἀνήρ引入一个身份尚未说明、但具体存在的人；“有一个人”符合现代汉语叙事习惯。
- source_word: χωλὸς ἐκ κοιλίας μητρὸς αὐτοῦ ὑπάρχων
  choice: 生来腿瘸
  rationale: 该短语直译为“从母腹就是瘸的”，惯用意义是自出生便如此；“生来腿瘸”自然、准确，也保留其先天且持续的状态。
- source_word: ἐβαστάζετο
  choice: 常有人抬着他来
  rationale: 未完成时被动语态表示过去反复或持续发生的动作；结合下文“每天”，以“常有人抬着他来”自然表达惯常动作。
- source_word: ἐτίθουν καθ’ ἡμέραν
  choice: 他们每天把他放在
  rationale: 未完成时配合“每天”表示惯常重复；汉语用“每天把他放在”即可清楚表达。
- source_word: θύραν τοῦ ἱεροῦ
  choice: 圣殿区……的门口
  rationale: θύρα在建筑语境中指门；ἱερόν指整个圣殿范围而非内殿，译作“圣殿区”以保留原文区别。
- source_word: τὴν λεγομένην Ὡραίαν
  choice: 一个叫“美门”的
  rationale: Ὡραία是这座门的称名，基本义为美丽、美好；“美门”简洁自然，并由脚注提示其字面含义。
- source_word: τοῦ αἰτεῖν ἐλεημοσύνην
  choice: 让他……求施舍
  rationale: 属格冠词化不定式表达目的；“让他……求施舍”在汉语中自然地说明被安置在那里的目的。
- source_word: παρὰ τῶν εἰσπορευομένων εἰς τὸ ἱερόν
  choice: 向进圣殿区的人
  rationale: παρά加属格表示求取的对象或来源；现在分词描写正在进入的人，译文简明保留这一点。
theological_decisions:
- issue: ἱερόν所指范围
  choice: 圣殿区
  alternative: 圣殿
  rationale: 原文使用ἱερόν而非通常专指内殿或圣所的ναός；“圣殿区”能避免把地点误解为内殿，同时不加入宗派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。将较生硬的“从母腹就瘸”译为“生来腿瘸”，并用“圣殿区”准确区分ἱερόν与内殿。
