  text: ὑμῖν πρῶτον ⸂ἀναστήσας ὁ θεὸς⸃ τὸν παῖδα ⸀αὐτοῦ ἀπέστειλεν αὐτὸν εὐλογοῦντα ὑμᾶς ἐν τῷ ἀποστρέφειν ἕκαστον ἀπὸ τῶν πονηριῶν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/026.yaml
  text: To you first[a], God, having raised up his servant[b], sent him to bless you by turning each of you from your wicked ways.
translation:
  language: zh_hans
  text: 神兴起[a]他的仆人[b]后，先差遣他来赐福给你们，使你们各人离开自己的恶行。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “兴起”也可指神兴起一位仆人或使他出现，不一定专指使他从死人中复活。
    reason: alternative_reading
  - marker: b
    text: 希腊语παῖς也可译作“孩子”；但这里的“仆人”可能呼应以赛亚书中的仆人。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμῖν πρῶτον
  choice: 先……到你们这里来
  rationale: 保留“首先临到你们”的优先次序和与格所表达的对象，指彼得面前的犹太听众；同时采用自然的现代汉语语序。
- source_word: ἀναστήσας
  choice: 兴起
  rationale: “兴起”既可让人联想到从死里复起，也可表示使一位受差遣者出现、将他立起来，因而没有在正文中消除希腊文的歧义。
- source_word: τὸν παῖδα αὐτοῦ
  choice: 他的仆人
  rationale: παῖς既可指仆人，也可指孩子；本段可能呼应以赛亚书的“仆人”，故正文采用“仆人”，而把另一词义列入脚注。
- source_word: ἀπέστειλεν αὐτόν
  choice: 差他到你们这里来
  rationale: “差”自然表达奉差遣而来；补出“到你们这里来”清楚呈现与格ὑμῖν所指的对象，而未增添额外神学含义。
- source_word: εὐλογοῦντα ὑμᾶς
  choice: 赐福给你们
  rationale: 将分词按其随差遣而来的目的或结果自然译出，保持动作主体为受差遣的那一位。
- source_word: ἐν τῷ ἀποστρέφειν ἕκαστον
  choice: 使你们各人回转
  rationale: ἐν加冠词不定式在此说明赐福实现的方式；“使……回转”既表达转离的动作，也保留ἕκαστον逐一、个别的分配意义。
- source_word: ἀπὸ τῶν πονηριῶν ὑμῶν
  choice: 离开自己的恶行
  rationale: 复数πονηρίαι在此指各人具体的邪恶表现；“恶行”简洁自然，并与“各人……自己的”相呼应。
theological_decisions:
- issue: ἀναστήσας用于耶稣时的含义
  choice: 正文译作“兴起”，不明确限定为复活或设立、使之出现
  alternative: “使他从死人中复活”或“立起／兴起他”
  rationale: 该动词在使徒行传中可能指从死里复活，也可能呼应神兴起先知或拯救者的说法；较宽的译法保留原文的神学张力。
- issue: παῖς的基督论含义
  choice: 译作“仆人”
  alternative: “孩子”或“儿子”
  rationale: “仆人”较能呈现可能存在的以赛亚仆人背景；“孩子”虽有词汇依据，却会削弱这一呼应，而“儿子”在本节中比希腊词本身更明确，容易加入原文未明说的称谓。
- issue: 回转动作与赐福的关系
  choice: 译作“赐福给你们，使你们各人回转”
  alternative: “在你们各人回转、离开恶行时赐福给你们”
  rationale: ἐν τῷ ἀποστρέφειν最自然地表达赐福所借以实现的方式，并可由受差遣者使众人转离恶行；不过其结构也可被理解为紧密相伴的情形，正文不进一步扩展其机制。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“先差他到你们这里来”避免生硬直译开头的与格结构；“各人……自己的恶行”清楚保留逐一指向听众的语气。脚注标记均紧随所解释的词语。
