id: ACT.3.8
reference: Acts 3:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἐξαλλόμενος ἔστη καὶ περιεπάτει, καὶ εἰσῆλθεν σὺν αὐτοῖς εἰς τὸ ἱερὸν περιπατῶν καὶ ἁλλόμενος καὶ αἰνῶν τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/008.yaml
  text: And leaping up, he stood and began to walk, and he entered the temple with them, walking and jumping and praising God.
translation:
  language: zh_hans
  text: 他一跃而起，站稳了，开始行走；随后和他们一同进了圣殿，一边走，一边跳跃，一边赞美上帝。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξαλλόμενος
  choice: 一跃而起
  rationale: 该词表示跃起、跳起来；译文保留动作的突然性和活力，并与后文一般性的ἁλλόμενος有所区分。
- source_word: ἔστη
  choice: 站稳了
  rationale: 基本义为“站立”；在瘸腿者刚得医治的语境中，“站稳了”自然传达他已能立足，但不额外解释医治机制。
- source_word: περιεπάτει
  choice: 开始行走
  rationale: 未完成时在此可表达动作开始并持续；译作“开始行走”符合叙事推进。
- source_word: τὸ ἱερόν
  choice: 圣殿
  rationale: ἱερόν通常指整个圣殿区域，而非专指圣所建筑；现代汉语以“圣殿”自然概括此处地点。
- source_word: ἁλλόμενος
  choice: 跳跃
  rationale: 表示跳、跃；用“跳跃”与“行走”并列，呈现得医治之人的身体动作和喜悦。
- source_word: αἰνῶν τὸν θεόν
  choice: 赞美上帝
  rationale: 直译并保留公开颂赞上帝的含义。
theological_decisions:
- issue: 是否把动作解释为医治已经完全或即时完成
  choice: 仅按原文叙述他站立、行走和跳跃
  alternative: 加入“完全得了医治”等解释性措辞
  rationale: 原文本节以动作展示结果，却没有在此直接使用“完全医治”的措辞；不把叙事证据改写成额外的神学断语。
translation_notes:
  register: 采用现代、庄重而流畅的叙事汉语。“一边走，一边跳跃，一边赞美”保留原文三个并列分词的节奏；分号帮助呈现先站立行走、后进入圣殿的叙事层次。
