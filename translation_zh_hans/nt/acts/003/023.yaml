  text: ἔσται δὲ πᾶσα ψυχὴ ἥτις ⸀ἂν μὴ ἀκούσῃ τοῦ προφήτου ἐκείνου ἐξολεθρευθήσεται ἐκ τοῦ λαοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/023.yaml
  text: And every person who does not listen to that prophet will be utterly destroyed from among the people[a].
translation:
  language: zh_hans
  text: 凡不听从那位先知的人，都必从百姓中被彻底除灭[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“必从百姓中被剪除。”
    reason: “剪除”保留了旧约盟约用语的色彩，也可表达从群体中除去；正文则更直接体现ἐξολεθρευθήσεται所带的强烈毁灭意味。
lexical_decisions:
- source_word: πᾶσα ψυχὴ
  choice: 凡……的人，都
  rationale: ψυχή在这里按希腊语习惯指一个人，而非专指与身体相对的“灵魂”。用“凡……的人，都”自然表达“每一个人”的普遍范围。
- source_word: ἥτις ἂν μὴ ἀκούσῃ
  choice: 不听从
  rationale: 此结构表示不定关系，即“任何不……的人”。ἀκούω在本段不仅指听见，也含有听取、顺从之意；“听从”简明保留这种回应性的含义。
- source_word: τοῦ προφήτου ἐκείνου
  choice: 那位先知
  rationale: “那位”回指上一节所说像摩西的先知；不另加专名或称号，以免超出希腊文本。
- source_word: ἐξολεθρευθήσεται
  choice: 必……被彻底除灭
  rationale: 该动词为将来被动式，表达彻底毁灭或除去，语气强于一般的“除去”。“彻底除灭”保留其严厉程度，同时以脚注列出具有旧约盟约背景的“剪除”。
- source_word: ἐκ τοῦ λαοῦ
  choice: 从百姓中
  rationale: ἐκ表示从群体内部被除去；“从百姓中”准确表达这一群体性范围。原文没有物主代词，因此不增译“他的百姓”。
theological_decisions:
- issue: 拒绝那位先知所招致审判的性质
  choice: 译作“从百姓中被彻底除灭”，表明严厉的毁灭与除去，但不界定其具体方式和时间。
  alternative: 将其限定为被逐出盟约群体，或明确解释为末日的最终审判。
  rationale: 经文清楚宣告严重审判，却未在本节具体说明这是现世、盟约群体层面还是末世性的审判；译文保留这种神学张力，不替文本作进一步限定。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“凡……的人，都……”符合中文普遍条件句习惯；“那位先知”明确回指而不作额外神学标示。
