- from: 彼得却说：“金银我都没有，但我所有的，我给你：奉拿撒勒人耶稣弥赛亚的名，起来行走！”
  to: 彼得说：“金银我没有；但我有的，我就给你：奉拿撒勒人耶稣，就是弥赛亚[a]的名，行走！”
  rationale: 删除原文未明说的“起来”，弱化无必要的转折，并将“我有的”调整为更自然且不缩窄其所指的汉语。保留“金银”“奉……的名”“弥赛亚”和“拿撒勒人”的关键措辞；为两个称谓的常见替代译法补充脚注。
