  text: εἶπεν δὲ Πέτρος· Ἀργύριον καὶ χρυσίον οὐχ ὑπάρχει μοι, ὃ δὲ ἔχω τοῦτό σοι δίδωμι· ἐν τῷ ὀνόματι Ἰησοῦ Χριστοῦ τοῦ Ναζωραίου ⸀περιπάτει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/006.yaml
  text: 'But Peter said[a], “Silver and gold I do not have, but what I do have, this I give to you: in the name of Jesus the Messiah the Nazarene[b], walk.”'
translation:
  language: zh_hans
  text: 彼得说：“金银我没有；但我有的，我就给你：奉拿撒勒人耶稣，就是弥赛亚[a]的名，行走！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弥赛亚”或译“基督”。希腊文Χριστός意为“受膏者”。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀργύριον καὶ χρυσίον
  choice: 金银
  rationale: 希腊文明确并列银与金，汉语惯用“金银”自然地保留两种贵金属及其代表钱财的含义。
- source_word: οὐχ ὑπάρχει μοι
  choice: 我都没有
  rationale: 该结构表达拥有；“我都没有”在现代汉语中自然，并与前面的“金银”呼应。
- source_word: ὃ δὲ ἔχω τοῦτό σοι δίδωμι
  choice: 但我所有的，我给你
  rationale: 保留关系代词与指示代词形成的强调，同时避免过度生硬。
- source_word: ἐν τῷ ὀνόματι
  choice: 奉……的名
  rationale: “奉……的名”是自然、庄重的汉语表达，可保留名号以及所含权柄的双重意味，而不将其缩减为单纯的“凭权柄”。
- source_word: Ἰησοῦ Χριστοῦ
  choice: 耶稣弥赛亚
  rationale: Χριστός在此名号宣告中仍有称号意味；译为“弥赛亚”保留其“受膏者”的身份内涵。
- source_word: τοῦ Ναζωραίου
  choice: 拿撒勒人
  rationale: 直接传达Ναζωραῖος所指的地域身份，也符合现代汉语称谓习惯。
- source_word: περιπάτει
  choice: 起来行走
  rationale: 希腊文正文只有“行走”的命令；鉴于对象原本不能行走，汉语加入“起来”可自然表达命令的起始意味，但不把后文动作细节引入本节。
theological_decisions:
- issue: Χριστοῦ在医治宣告中的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 这里与耶稣的名及拿撒勒人称号连用，但仍突出其身份称号；“弥赛亚”保留希腊词所承载的犹太受膏者意义，“基督”则是传统音译性称法。
- issue: ἐν τῷ ὀνόματι所表达的关系
  choice: 奉……的名
  alternative: 凭……的权柄
  rationale: 原文既可涉及权柄，也保留“名”的神学意涵；正文不将其单义化。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事和直接引语。“金银”较“银子和金子”简洁自然；命令句使用“起来行走”，符合医治场景中的现代汉语表达。
