    rationale: 原文只有“行走”的现在时命令；“起来”虽合乎上下文，却未在本节明说。
  - severity: low
    issue: “却说”过度表达δὲ的对比。
    rationale: 此处δὲ可仅为叙事承接，译作“彼得说”即可，不应强加转折。
  - severity: low
    issue: “我所有的”较容易被理解为彼得全部财物。
    rationale: 原文是“我所拥有的／我有的”的强调性表述；“我有的，我就给你”更自然且更贴近语义。
