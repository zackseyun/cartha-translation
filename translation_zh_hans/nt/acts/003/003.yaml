  text: ὃς ἰδὼν Πέτρον καὶ Ἰωάννην μέλλοντας εἰσιέναι εἰς τὸ ἱερὸν ἠρώτα ἐλεημοσύνην ⸀λαβεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/003.yaml
  text: When he saw Peter and John about to go into the temple, he began asking to receive alms.
translation:
  language: zh_hans
  text: 他看见彼得和约翰正要进入圣殿[a]，便向他们求施舍。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊语ἱερόν指圣殿的整个范围或建筑群，并非专指内殿。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: 他
  rationale: 关系代词回指上一节所说的瘸腿男子；汉语在此用“他”承接上下文，比保留关系从句结构更自然。
- source_word: ἰδὼν
  choice: 看见
  rationale: 不定过去时分词在此表示与主句相关的时间情境；“他看见……便……”自然呈现先看见、随后求施舍的叙事关系。
- source_word: Πέτρον καὶ Ἰωάννην
  choice: 彼得和约翰
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: μέλλοντας εἰσιέναι
  choice: 正要进入
  rationale: μέλλω加不定式在此表示迫近的行动；“正要进入”准确传达二人即将进去的情景，同时不必强化为主观意图。
- source_word: εἰς τὸ ἱερόν
  choice: 进入圣殿
  rationale: “圣殿”是自然且通行的中文表达；ἱερόν在此指整个圣殿区域而非专指内殿，具体范围以脚注说明。
- source_word: ἠρώτα
  choice: 便向他们求
  rationale: 未完成时可描写当时正在进行或反复发生的请求。中文“便向他们求”在叙事中自然承接前一动作，又不额外断定请求是刚刚开始。
- source_word: ἐλεημοσύνην
  choice: 施舍
  rationale: 此词指给穷人的周济财物；“施舍”在现代汉语中简洁清楚，也符合乞求钱财的场景。
- source_word: λαβεῖν
  choice: 求施舍
  rationale: 不定式表示请求取得施舍的内容。汉语“向他们求施舍”已自然包含“求得、领受”的意思，若逐字加上“得到”会显得累赘。
