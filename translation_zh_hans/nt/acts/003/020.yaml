revisions:
- from: 好使安舒的时日从主面前来到，并使他差遣那为你们预先选定的[a]弥赛亚耶稣来。
  to: 使安舒的时日从主面前而来，并差遣那为你们预先指定的弥赛亚耶稣。
  rationale: 将不清晰的使令式“并使他差遣”改为与前句并列、以主为语境中共同施事的“并差遣”。将“预先选定”调整为“预先指定”，更贴近分词在本节中的指定／预备含义。脚注随修订后的短语设置，保留与格的替代理解。
