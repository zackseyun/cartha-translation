  text: ὅπως ἂν ἔλθωσιν καιροὶ ἀναψύξεως ἀπὸ προσώπου τοῦ κυρίου καὶ ἀποστείλῃ τὸν προκεχειρισμένον ὑμῖν χριστὸν Ἰησοῦν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/020.yaml
  text: so that times of refreshing may come from the presence of the Lord[a], and that he may send the Messiah appointed for you, Jesus,
translation:
  language: zh_hans
  text: 使安舒的时日从主面前而来，并差遣那为你们预先指定的弥赛亚耶稣。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅπως ἂν
  choice: 好使
  rationale: 引出与上文悔改呼召相连的目的或结果；“好使”自然保留这一从属关系，不把语气说得过于确定。
- source_word: ἔλθωσιν
  choice: 来到
  rationale: 不定过去时虚拟语气受ὅπως ἄν支配；汉语由“好使”表达其目的和未实现的语气。
- source_word: καιροὶ
  choice: 时日
  rationale: καιρός指某种时期、时机或季节；“时日”在庄重而现代的汉语中较自然，也不额外限定为某种特定末世时间表。
- source_word: ἀναψύξεως
  choice: 安舒
  rationale: 该词可指舒畅、复苏或得缓解；“安舒”兼顾解除困乏与重新振作的意象，且适合经文语体。
- source_word: ἀπὸ προσώπου τοῦ κυρίου
  choice: 从主面前
  rationale: πρόσωπον本义为“面”，此处构成表示临在或面前的惯用语；“从主面前”保留原文意象，同时在汉语中可理解为从主的临在而来。
- source_word: ἀποστείλῃ
  choice: 使他差遣
  rationale: 与ἔλθωσιν并列，同受ὅπως ἄν支配；“并使他差遣”保留句法联系，其中“他”按语境指主。
- source_word: προκεχειρισμένον
  choice: 预先选定的
  rationale: 完成时被动分词表达已经作出的选择或指定；“预先选定”明确呈现προ-及完成时所含的先前指定意味。
- source_word: ὑμῖν
  choice: 为你们
  rationale: 与格可表示“为你们”或“向你们”；正文采用“为你们”，自然表达这项指定与听众的关系及益处。
- source_word: χριστὸν
  choice: 弥赛亚
  rationale: 此处χριστός作为耶稣的称号使用；译为“弥赛亚”显明其受膏君王的称号性质和犹太语境。
- source_word: Ἰησοῦν
  choice: 耶稣
  rationale: 采用该人名的标准现代汉语译法。
theological_decisions:
- issue: χριστὸν在此应译作称号还是采用传统音译形式
  choice: 弥赛亚
  alternative: 基督
  rationale: 这里χριστός带定语并与“耶稣”同位，重点在其弥赛亚身份；译出称号含义可保留原文的宣告力度，而不把它仅当作姓名的一部分。
- issue: προκεχειρισμένον ὑμῖν的关系和时间意味
  choice: 为你们预先选定的
  alternative: 为你们所立的；向你们指定的
  rationale: 分词的词形和完成时态支持先前已经指定的含义，而与格本身容许“为你们”或“向你们”两种理解。正文呈现较直接的“为你们”，脚注保留另一种关系理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“安舒的时日”保留原文的复苏与缓解意象；“从主面前”刻意保留πρόσωπον的“面前”表达，同时自然传达主的临在。脚注标记紧随其实际所说明的短语。
