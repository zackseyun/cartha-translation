id: ACT.3.10
reference: Acts 3:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐπεγίνωσκον ⸀δὲ αὐτὸν ὅτι ⸀οὗτος ἦν ὁ πρὸς τὴν ἐλεημοσύνην καθήμενος ἐπὶ τῇ Ὡραίᾳ Πύλῃ τοῦ ἱεροῦ, καὶ ἐπλήσθησαν θάμβους καὶ ἐκστάσεως ἐπὶ τῷ συμβεβηκότι αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/010.yaml
  text: And they recognized him[a], that this was the man who used to sit for alms at the Beautiful Gate of the temple[b], and they were filled with amazement and astonishment at what had happened to him.
translation:
  language: zh_hans
  text: 众人认出他来，知道他就是那个一向坐在圣殿的美门[a]那里求施舍的人；因着发生在他身上的事，他们都充满了惊奇和诧异。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣殿”原文指整个圣殿区域，并非专指内殿。
    reason: cultural_note
lexical_decisions:
- source_word: ἐπεγίνωσκον
  choice: 认出
  rationale: 未完成时在叙事中描写众人逐渐或相继辨认出此人；“认出”比直译为“认识”更准确地表达身份确认。
- source_word: δὲ
  choice: （不单独译出）
  rationale: 此处是轻微的叙事连接词；汉语承接上文时无需机械译作“于是”或“而”，省略更自然，也不增添对比意味。
- source_word: οὗτος ἦν
  choice: 他就是
  rationale: 保留指示代词所带的确认和强调意味，同时符合现代汉语表达。
- source_word: ὁ πρὸς τὴν ἐλεημοσύνην καθήμενος
  choice: 那一向坐在……求人施舍的人
  rationale: 冠词加现在分词构成名词性描述；结合上下文，“一向坐在”体现其惯常状态，而“求人施舍”自然表达坐在那里求取周济。
- source_word: ἐλεημοσύνην
  choice: 施舍
  rationale: 在此指给穷人的钱财或赠予；“施舍”是现代汉语中明确、易懂且符合语境的对应词。
- source_word: ἐπὶ τῇ Ὡραίᾳ Πύλῃ
  choice: 在圣殿美门旁
  rationale: Ὡραία在此为门的称名，译作传统且简洁的“美门”；介词短语表示他所在的位置，“旁”符合汉语空间表达。
- source_word: τοῦ ἱεροῦ
  choice: 圣殿
  rationale: ἱερόν指整个圣殿区域，而非专指内殿；正文采用通行的“圣殿”，并以脚注说明其范围。
- source_word: ἐπλήσθησαν
  choice: 充满了
  rationale: 保留被动动词与情绪名词搭配的形象，汉语也自然。
- source_word: θάμβους καὶ ἐκστάσεως
  choice: 惊奇和诧异
  rationale: 两个词都表达强烈震惊；并列译出以保留原文的累加强调，并避免把ἐκστάσις误解为神秘宗教体验。
- source_word: ἐπὶ τῷ συμβεβηκότι αὐτῷ
  choice: 因着发生在他身上的事
  rationale: 完成时分词指已经发生且影响仍在的事件；“因着”清楚表达此处的原因关系。
theological_decisions: []
