id: ACT.3.18
reference: Acts 3:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς ἃ προκατήγγειλεν διὰ στόματος πάντων τῶν ⸀προφητῶν παθεῖν τὸν χριστὸν ⸀αὐτοῦ ἐπλήρωσεν οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/018.yaml
  text: But God thus fulfilled what he had announced beforehand through the mouth of all the prophets[b][a], that his Messiah would suffer.
translation:
  language: zh_hans
  text: 然而，神就这样应验了他借所有先知的口[a]预先宣告的事：他的弥赛亚[b]将要受苦。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“借所有先知”。希腊文直译为“借所有先知的口”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文作“他的基督”；这里译作“他的弥赛亚”，因为 Χριστός 在此用作称号。
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: 然而
  rationale: 承接上文，并突出神的作为与听众先前所做之事之间的转折。
- source_word: προκατήγγειλεν
  choice: 预先宣告
  rationale: 兼顾 προ- 的预先含义和 καταγγέλλω 的公开宣告意味。
- source_word: διὰ στόματος πάντων τῶν προφητῶν
  choice: 借所有先知的口
  rationale: 保留原文“借……的口”这一具体的圣经表达，同时明确译出 πάντων“所有”。
- source_word: παθεῖν
  choice: 将要受苦
  rationale: 将不定式自然表达为预先宣告的内容；不增添原文未明说的“必须”等情态意义。
- source_word: τὸν χριστὸν αὐτοῦ
  choice: 他的弥赛亚
  rationale: Χριστός 在此作为称号，译作“弥赛亚”；αὐτοῦ 表明这位弥赛亚属于神或由神所立。
- source_word: ἐπλήρωσεν
  choice: 应验了
  rationale: 在预言实现的语境中，“应验”自然、准确，也保留经文成就的含义。
- source_word: οὕτως
  choice: 就这样
  rationale: 表达神以刚才所述的方式使预先宣告的事得以应验。
theological_decisions:
- issue: Χριστός 的称号性质
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处处于彼得面向犹太听众的宣讲中，Χριστός 主要作为受膏者的称号；“弥赛亚”更清楚地保留这一语境。
- issue: παθεῖν 是否含有必然性
  choice: 将要受苦
  alternative: 必须受苦
  rationale: 原文不定式陈述预告的内容，本身没有明确加入“必须”的情态；因此不在译文中强化神学必然性。
- issue: οὕτως 所指的方式
  choice: 就这样应验了
  alternative: 应验了这些事
  rationale: 把 οὕτως 与“应验”相连，保留其方式含义，但不进一步限定它究竟只指受苦还是包括上文整段事件。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“然而”保留上下文转折；冒号清楚引出神预先宣告的内容。“借所有先知的口”略带圣经语体，但普通读者仍容易理解。
