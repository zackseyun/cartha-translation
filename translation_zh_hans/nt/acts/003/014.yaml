  yaml_path: translation/nt/acts/003/014.yaml
  text: But you denied the Holy and Righteous One[a], and asked for a murderer to be granted to you,
translation:
  language: zh_hans
  text: 但你们竟否认了那位圣洁、公义者，反而要求把一个杀人犯释放给你们[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译作“准给你们”或“赐给你们”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς δὲ
  choice: 但你们竟
  rationale: “但”保留δέ与上文的转折；明说“你们”体现ὑμεῖς的强调。“竟”以自然汉语传达责问中的强烈反差，但不另添事实内容。
- source_word: τὸν ἅγιον καὶ δίκαιον
  choice: 那位圣洁、公义者
  rationale: 定冠词与两个形容词构成实体化称谓，指向耶稣。“那位……者”在现代汉语中庄重自然，也保留两个形容词共同描述同一位的句法。
- source_word: ἠρνήσασθε
  choice: 否认了
  rationale: ἀρνέομαι在此表示否认、拒不承认或弃绝耶稣；“否认”最直接，并保留原文可兼具言语否认与关系 repudiation 的张力。
- source_word: ᾐτήσασθε
  choice: 要求
  rationale: αἰτέω基本义为请求、求取；在彼拉多审判及释放囚犯的语境中，“要求”比“请求”更符合群众施压的场景，同时没有达到“命令”的强度。
- source_word: ἄνδρα φονέα
  choice: 一个杀人犯
  rationale: φονεύς明确指杀人者；汉语“一个杀人犯”自然地表达ἄνδρα的男性个体指称及φονέα的身份，无须生硬译作“一个是杀人犯的男人”。
- source_word: χαρισθῆναι ὑμῖν
  choice: 把……赐给你们
  rationale: χαρίζομαι的被动不定式表示作为恩惠而赐予、准予。“赐给你们”保留动词较宽的施惠含义；具体为释放则由语境和脚注说明。
theological_decisions:
- issue: “圣洁、公义者”的基督论称谓性质
  choice: 译作“那位圣洁、公义者”，按实体化称谓理解
  alternative: 译作“那位圣洁而公义的人”，仅视为一般描述
  rationale: 希腊文单一定冠词统领两个实体化形容词，并在上下文中特指耶稣。译文体现其称谓性，但不把两个形容词拆成两位，也不加入原文没有的教义解释。
- issue: χαρισθῆναι的司法语境含义
  choice: 正文译作“赐给你们”
  alternative: 按语境明确译作“释放给你们”
  rationale: 该动词本身比“释放”宽，含作为恩惠而准予之意；正文保留这一词义宽度，脚注交代在本段司法语境中的具体所指。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“但……竟……反而……”凸显原句中圣洁公义者与杀人犯之间的尖锐对比；避免生硬照搬希腊语词序。脚注标记置于所解释的“赐给你们”之后。
