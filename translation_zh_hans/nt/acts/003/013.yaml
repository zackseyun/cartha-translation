source:
  edition: SBLGNT
  text: ὁ θεὸς Ἀβραὰμ καὶ ⸂Ἰσαὰκ καὶ⸃ Ἰακώβ, ὁ θεὸς τῶν πατέρων ἡμῶν, ἐδόξασεν τὸν παῖδα αὐτοῦ Ἰησοῦν, ὃν ὑμεῖς ⸀μὲν παρεδώκατε καὶ ⸀ἠρνήσασθε κατὰ πρόσωπον Πιλάτου, κρίναντος ἐκείνου ἀπολύειν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/013.yaml
  text: The God of Abraham and Isaac and Jacob[a], the God of our fathers, has glorified his servant Jesus, whom you handed over and denied before Pilate, when he had decided to release him.
translation:
  language: zh_hans
  text: 亚伯拉罕、以撒和雅各的神，我们祖先的神，已经荣耀了他的仆人[a]耶稣；你们却把他交出去，又在彼拉多面前否认了他；彼拉多已决定释放他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “仆人”也可译作“孩子”。希腊语παῖς可指孩子，也可指仆人；这里很可能呼应以赛亚书中“仆人”的称谓。
    reason: 保留原词的词义歧义，并说明正文译法所依据的互文背景。
lexical_decisions:
- source_word: ὁ θεὸς Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ
  choice: 亚伯拉罕、以撒和雅各的神
  rationale: 保留出埃及记3:6所见的盟约称谓；用现代汉语自然的并列方式表达希腊文重复的καί。
- source_word: ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: 我们祖先的神
  rationale: πατέρων在这里指以色列先祖；“祖先”比“父辈”更准确，也比“列祖”更符合普通现代读者的语言习惯。
- source_word: ἐδόξασεν
  choice: 已经荣耀了
  rationale: “荣耀”保留δοξάζω在此处的神学分量；“已经”自然表达已发生之行动及其当前意义，而不把时态解释得过细。
- source_word: τὸν παῖδα αὐτοῦ Ἰησοῦν
  choice: 他的仆人耶稣
  rationale: παῖς既可指孩子，也可指仆人；本段很可能呼应以赛亚书中耶和华仆人的语言，因此正文采用“仆人”，并以脚注保留词义歧义。
- source_word: παρεδώκατε
  choice: 把他交了出去
  rationale: 准确表达παραδίδωμι将耶稣交给当权者处置的意思，同时避免用“出卖”过度解释行为动机。
- source_word: ἠρνήσασθε
  choice: 否认了他
  rationale: 直接对应ἀρνέομαι，并保留新约中“否认”用语的关联；不强化为“弃绝”。
- source_word: κατὰ πρόσωπον Πιλάτου
  choice: 当着彼拉多的面
  rationale: 自然传达该习语所表达的公开、面对面的场景，比字面译作“在彼拉多面前”更鲜明而不失庄重。
- source_word: κρίναντος ἐκείνου ἀπολύειν
  choice: 尽管彼拉多已经决定要释放他
  rationale: 分词结构在语境中带有明显的让步反差：彼拉多决定释放耶稣，你们却否认并交出他；“决定要释放”准确体现司法裁断语境。
theological_decisions:
- issue: 耶稣称谓παῖς的译法
  choice: 仆人
  alternative: 孩子
  rationale: “仆人”最能保留可能的以赛亚书“仆人”互文，同时不把本词径自等同于表达神圣子身份的“儿子”；脚注保留“孩子”这一真实词义可能。
- issue: ἐδόξασεν的汉语体貌表达
  choice: 已经荣耀了
  alternative: 荣耀了
  rationale: 希腊文简单过去时本身不规定汉语必须加“已经”，但此处“已经”能自然突出神已施行且仍具现实意义的行动，不额外规定荣耀行动的具体方式。
- issue: κρίναντος分词结构的逻辑关系
  choice: 尽管
  alternative: 当……时
  rationale: 希腊文分词本身可容纳时间或让步理解；上下文的强烈反差支持让步译法，但并不改变彼拉多先已作出释放决定这一基本陈述。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“祖先”兼顾准确性与普及度；“当着彼拉多的面”清楚呈现场景；用“却”和“尽管”体现原句的对照张力。脚注标记置于产生歧义的“仆人耶稣”之后。
