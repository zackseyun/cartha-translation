base_translation:
  language: en
  yaml_path: translation/nt/acts/003/019.yaml
  text: Therefore repent and turn back[a], so that your sins may be wiped away,
translation:
  language: zh_hans
  text: 所以，你们要悔改，回转，好使你们的罪得以涂抹[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “涂抹”也可译作“擦去”。
    reason: lexical_alternative
lexical_decisions:
- source_word: μετανοήσατε
  choice: 要悔改
  rationale: 不定过去时主动命令式要求作出明确、果断的回应。“悔改”在现代中文中自然地保留了思想、意向与生命方向改变的道德和圣约意味，又不与后面的“回转”重复。
- source_word: οὖν
  choice: 所以
  rationale: 承接上文论证并引出结论；“所以”比“因此”更符合自然现代汉语，同时清楚表达推论关系。
- source_word: ἐπιστρέψατε
  choice: 回转归向上帝
  rationale: 不定过去时主动命令式，与“悔改”并列。ἐπιστρέφω在此含转回、归回之意；补出语境中隐含的方向“归向上帝”，使现代中文表达完整，同时保留主动回应，避免译成可能带被动意味的“归信”。
- source_word: πρὸς τὸ ἐξαλειφθῆναι
  choice: 好使……被涂抹
  rationale: πρός加冠词化不定式可表达目的并带结果意味。“好使”保留这一目的／结果关联，而不把它强化为超出原文的单一因果机制。
- source_word: ἐξαλειφθῆναι
  choice: 被涂抹
  rationale: 被动不定式。“涂抹”保留擦去书写记录的形象，也自然承接罪债或罪行记录被除去的语境；脚注提供更直白的现代说法。
- source_word: ἁμαρτίας
  choice: 罪
  rationale: 准确对应复数ἁμαρτίας的集合意义；汉语通常以“你们的罪”自然涵盖多项罪行，无须机械标明复数。
theological_decisions:
- issue: 悔改、回转与罪得除去之间的关系
  choice: 译作“好使你们的罪被涂抹”，保留原文所表达的目的／结果联系。
  alternative: 译作“为使你们的罪得以涂抹”，或采用更强的直接因果措辞。
  rationale: 本节把悔改和回转作为命令，并将其与罪被除去相联，但没有在此完整说明救恩次序或具体机制。译文保留这种联系，不引入宗派性的体系化解释。
- issue: 回转的对象是否明说
  choice: 在正文中译明“归向上帝”。
  alternative: 仅译“回转”或“转回”。
  rationale: 希腊文此处未明列宾语，但讲章语境清楚指向归向上帝。现代汉语单说“回转”容易显得方向不明；补明语境隐含对象是为表达自然，而非增加新的教义主张。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“悔改”保留经文的道德与信仰分量；“回转归向上帝”清楚表达方向性；“涂抹”保留原文意象，并用脚注说明现代词义。正文中的脚注标记[a]已与脚注对应。
