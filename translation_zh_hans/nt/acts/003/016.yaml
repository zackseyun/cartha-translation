source:
  edition: SBLGNT
  text: καὶ ⸀ἐπὶ τῇ πίστει τοῦ ὀνόματος αὐτοῦ τοῦτον ὃν θεωρεῖτε καὶ οἴδατε ἐστερέωσεν τὸ ὄνομα αὐτοῦ, καὶ ἡ πίστις ἡ δι’ αὐτοῦ ἔδωκεν αὐτῷ τὴν ὁλοκληρίαν ταύτην ἀπέναντι πάντων ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/016.yaml
  text: And on the basis of faith in his name[a], his name itself has made strong this man whom you see and know[c][b]; and the faith that is through him has given him this wholeness in the presence of all of you.
translation:
  language: zh_hans
  text: 因着信他的名[a]，他的名使这个你们所看见、所认识的人得以强健；并且，那借着他而有的信，使他在你们众人面前得到这样的完全康健[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “信”也可译作“信靠”。原文πίστις可指“信”“信靠”，在不同语境中也可表示“忠信”。
    reason: lexical_alternative
  - marker: b
    text: “完全康健”也可译作“完全健全”或“完整无缺的健康”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τῇ πίστει
  choice: 因着……信
  rationale: ἐπί加与格在此表示根据或基础。“因着”既保留信是医治之根据的含义，也符合现代汉语表达。
- source_word: πίστει τοῦ ὀνόματος αὐτοῦ
  choice: 对他名的信
  rationale: 属格结构在语境中指向对耶稣之名的信靠。“对……的信”保留“信”这一核心术语，同时脚注说明也可理解为“信靠”。
- source_word: τὸ ὄνομα αὐτοῦ
  choice: 他的名
  rationale: 保留希腊文以“他的名”为主语的表达，以及“名”所承载的本人和权柄之意，不直接释写成“耶稣本人”或“他名的能力”。
- source_word: ἐστερέωσεν
  choice: 使……强健了
  rationale: 该动词表示使之坚固、强壮；这里指瘸腿者身体得到可见的恢复。“强健”自然地传达这一结果。
- source_word: θεωρεῖτε καὶ οἴδατε
  choice: 你们所看见、所认识
  rationale: 分别保留亲眼看见和熟知、认得这两层公开见证的含义。
- source_word: ἡ πίστις ἡ δι’ αὐτοῦ
  choice: 那借着他而有的信
  rationale: 保留δι’ αὐτοῦ“借着他”的中介或施行含义，同时不明确断定这信属于得医治者还是使徒，也不把它完全解释成由耶稣产生的信。
- source_word: ὁλοκληρίαν
  choice: 完全康健
  rationale: 该词表示完整、健全或全然恢复健康；结合医治语境，“完全康健”清楚而庄重。
- source_word: ἀπέναντι πάντων ὑμῶν
  choice: 在你们众人面前
  rationale: 突出医治发生于众目睽睽之下，是公开可见、无法否认的事实。
theological_decisions:
- issue: 信与医治主体的关系
  choice: 保留“对他名的信”“他的名”以及“借着他而有的信”三重表述，不指明是谁的信。
  alternative: 明确译成那人的信、使徒的信，或耶稣所赐的信。
  rationale: 希腊文把医治归于耶稣的名，并两次提到信，却未在本节明确指出信的人是谁。译文应保留这一神学张力。
- issue: “名”的转喻含义
  choice: 正文保留“他的名”。
  alternative: 译成“耶稣本人”或“他名的能力”。
  rationale: 《使徒行传》中的“名”常指向耶稣本人及其权柄；直保留“名”能保存路加有意的措辞和重复。
- issue: δι’ αὐτοῦ的开放性
  choice: 译作“借着他而有的”。
  alternative: 译作“由他所赐的”或“对他的”。
  rationale: 原文可强调信借着耶稣而来或借着他的中介发生；正文不将其收窄为单一解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留“他的名”的重复，以呈现原文强调；用“强健”和“完全康健”对应两个不同词语，并避免把信的主体或来源解释得超过原文。
