  text: ὁ μὲν οὖν Φῆστος ἀπεκρίθη τηρεῖσθαι τὸν Παῦλον ⸂εἰς Καισάρειαν⸃, ἑαυτὸν δὲ μέλλειν ἐν τάχει ἐκπορεύεσθαι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/004.yaml
  text: Festus therefore answered that Paul was being kept in Caesarea, and that he himself was about to leave shortly.
translation:
  language: zh_hans
  text: 非斯都回答说，保罗正被拘押在凯撒利亚，而他自己不久就要离开。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τηρεῖσθαι
  choice: 正被拘押
  rationale: 在司法羁押的语境中，该词表示保罗处于看守之下；“被拘押”比笼统的“被留在”更自然准确，同时不额外说明拘押地点或方式。
- source_word: εἰς Καισάρειαν
  choice: 在凯撒利亚
  rationale: 此处虽有方向性介词 εἰς，但与表示看守的动词连用可表达保罗被拘押于凯撒利亚；按现代汉语习惯译为处所表达。
- source_word: ἐν τάχει
  choice: 很快
  rationale: 简明表达即将发生之意，与 μέλλειν 共同构成“很快就要”。
- source_word: ἐκπορεύεσθαι
  choice: 动身前往那里
  rationale: 原词意为出去、启程；上下文所指目的地是凯撒利亚。汉语补出“那里”使指向清楚，但不添加原文以外的新目的地。
theological_decisions: []
