  text: But I found that he had done nothing deserving death; and because he himself appealed to the Emperor[a], I decided to send him.
translation:
  language: zh_hans
  text: 但我查明，他没有做过任何应受死刑的事；他本人已经向皇帝[a]上诉，所以我决定把他送去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“奥古斯都”。希腊语称号“塞巴斯托斯”（Σεβαστός）在这里指罗马皇帝。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατελαβόμην
  choice: 我查明
  rationale: 在司法审查语境中表示经过了解而得出判断。“查明”自然地体现非斯都调查后的认定，又不把它强化为正式判决。
- source_word: μηδὲν ἄξιον ... θανάτου
  choice: 没有做过什么该死的事
  rationale: 准确表达没有任何行为应受死刑；“该死的事”在此是端正而简洁的司法性表述，避免加入原文没有明说的“死刑罪”。
- source_word: πεπραχέναι
  choice: 做过
  rationale: 保留 πράσσω 的宽泛动作含义，由“该死”提供司法语境；完成时态通过“过”体现。
- source_word: αὐτοῦ δὲ τούτου ἐπικαλεσαμένου
  choice: 而他本人既已……上诉
  rationale: “他本人”体现 αὐτοῦ τούτου 的强调；“既已”表达属格独立结构所交代的既成情形，并保留其可兼具时间和原因的关系，不将其单一化为纯因果。
- source_word: τὸν Σεβαστόν
  choice: 皇帝
  rationale: Σεβαστός 是罗马皇帝的称号，在本处指当时的罗马皇帝而非历史人物奥古斯都；正文用“皇帝”最清楚自然。
- source_word: ἔκρινα
  choice: 我就决定
  rationale: 这里指非斯都作出的程序性决定。“决定”符合现代汉语，“就”自然承接上诉这一情形。
- source_word: πέμπειν
  choice: 把他送去
  rationale: 宾语由上下文明确，汉语中补出“他”使句意完整；“送去”保留目的地未在本节明说的特点。
