  text: περὶ οὗ ἀσφαλές τι γράψαι τῷ κυρίῳ οὐκ ἔχω· διὸ προήγαγον αὐτὸν ἐφ’ ὑμῶν καὶ μάλιστα ἐπὶ σοῦ, βασιλεῦ Ἀγρίππα, ὅπως τῆς ἀνακρίσεως γενομένης σχῶ τί ⸀γράψω·
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/026.yaml
  text: Concerning him I have nothing definite to write to my lord[a]. Therefore I have brought him before you all, and especially before you, King Agrippa, so that, after the examination has taken place[b], I may have something to write.
translation:
  language: zh_hans
  text: 关于这个人，我没有什么确切的事可以呈给皇帝[a]。因此，我把他带到你们面前，特别是带到你面前，亚基帕王，好让查问以后[b]，我便有可写的内容。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或直译“呈给我的主上”。希腊文用“主上”这一尊称；在这里指罗马皇帝。
    reason: alternative_reading
  - marker: b
    text: “查问”也可译作“审查”或“听审”，指对保罗案件所作的司法调查。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσφαλές τι
  choice: 什么确切的事
  rationale: ἀσφαλές表示可靠、确定或确切之事；在行政司法语境中，指可写入呈文的明确案情。
- source_word: τῷ κυρίῳ
  choice: 主上
  rationale: κύριος在此是对罗马皇帝的尊称，并非神学称谓；“主上”既保留尊称性质，也符合中文的上呈语境。
- source_word: προήγαγον αὐτὸν ἐφ’ ὑμῶν
  choice: 我把他带到你们面前
  rationale: 体现将保罗带到在场众人面前之意，并以“你们”保留复数，与随后单数的亚基帕形成对照。
- source_word: καὶ μάλιστα ἐπὶ σοῦ
  choice: 尤其是带到你面前
  rationale: 保留μάλιστα对亚基帕的特别强调，也使与前一分句的对应关系清楚自然。
- source_word: τῆς ἀνακρίσεως γενομένης
  choice: 审问过后
  rationale: ἀνάκρισις在这里指司法性的查问、审查或听审；用“审问”简洁传达法律调查色彩。
- source_word: σχῶ τί γράψω
  choice: 我可以有些事可写
  rationale: 保留σχῶ“可以有”和τί γράψω“可写之事”的结构与目的意味，不把内容擅自具体化为罪名。
theological_decisions:
- issue: 非神学、帝国语境中的κύριος
  choice: 主上
  alternative: 皇帝
  rationale: 原文使用尊称κύριος而未直接使用“皇帝”一词。“主上”保存原文称谓方式，脚注则明确所指，避免读者误认为此处指神或基督。
translation_notes:
  register: 采用现代、庄重而易懂的司法行政语体。“主上”略带正式色彩，以对应向皇帝呈文的场景；其具体所指由脚注明示。句式保留“你们”与“你”的复数、单数对照，并维持原文从缺乏确切材料到安排审问的因果与目的关系。
