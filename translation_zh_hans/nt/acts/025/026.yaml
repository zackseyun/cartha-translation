  to: 关于这个人，我没有什么确切的事可以呈给皇帝[a]。因此，我把他带到你们面前，特别是带到你面前，亚基帕王，好让查问以后[b]，我便有可写的内容。
  rationale: 修订仅处理现代汉语的自然度与法律语义的准确范围。“皇帝”在正文中明确指称，脚注保留原文κύριος的尊称形式；“查问以后”保留属格绝对结构的时间关系和司法调查性质。其余内容保留原译的复数“你们”与单数“你”的对照，以及未具体化呈报内容的原文含义。
