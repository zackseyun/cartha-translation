  text: αἰτούμενοι χάριν κατ’ αὐτοῦ ὅπως μεταπέμψηται αὐτὸν εἰς Ἰερουσαλήμ, ἐνέδραν ποιοῦντες ἀνελεῖν αὐτὸν κατὰ τὴν ὁδόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/003.yaml
  text: asking a favor against him[a], that he would have him brought to Jerusalem, while setting an ambush to kill him on the way.
translation:
  language: zh_hans
  text: 向非斯都求一项不利于保罗的恩惠，要他把保罗送到耶路撒冷去；他们正设下埋伏，要在路上杀害保罗。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“要他派人把保罗召到耶路撒冷去。”这个希腊语动词既可指“派人去召”，也可指“安排把人带来”。
    reason: 保留μεταπέμψηται在“派人召来”和“安排带来”之间的词义幅度。
lexical_decisions:
- source_word: αἰτούμενοι χάριν κατ’ αὐτοῦ
  choice: 请求非斯都给他们一个对付保罗的方便
  rationale: “请求……给一个方便”自然表达“求取一项恩惠或通融”；“对付保罗”保留κατά在此处针对、敌对的语境力量。根据上文补出“非斯都”和“保罗”，以免现代汉语中代词指向不清。
- source_word: ὅπως μεταπέμψηται αὐτὸν εἰς Ἰερουσαλήμ
  choice: 就是派人把他带到耶路撒冷
  rationale: ὅπως在这里引出所求之事；μεταπέμψηται可指“派人去叫来”或“安排带来”，译文用“派人把他带到”表达非斯都安排转送保罗的意思，同时以脚注保留词义的另一种理解。
- source_word: ἐνέδραν ποιοῦντες
  choice: 他们同时设下埋伏
  rationale: 分词表示与请求同时进行的伴随行动；“同时”既清楚连接动作，又不把关系收窄为单纯时间从句。
- source_word: ἀνελεῖν αὐτὸν
  choice: 要……杀死他
  rationale: ἀναιρέω在本语境中明确指杀死；“杀死”直接而不过度添加“谋杀”等法律或道德定性。
- source_word: κατὰ τὴν ὁδόν
  choice: 在路上
  rationale: 这是自然、简洁的现代汉语方向与行程表达，符合伏击发生于押送途中这一语境。
