  text: καί φησιν ὁ Φῆστος· Ἀγρίππα βασιλεῦ καὶ πάντες οἱ συμπαρόντες ἡμῖν ἄνδρες, θεωρεῖτε τοῦτον περὶ οὗ ⸀ἅπαν τὸ πλῆθος τῶν Ἰουδαίων ⸀ἐνέτυχόν μοι ἔν τε Ἱεροσολύμοις καὶ ἐνθάδε, ⸀βοῶντες μὴ δεῖν ⸂αὐτὸν ζῆν⸃ μηκέτι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/024.yaml
  text: And Festus says[a], “King Agrippa, and all the men present with us, you see this man, about whom the whole body of the Jews petitioned me, both in Jerusalem and here[b], shouting that he ought no longer to live.”
translation:
  language: zh_hans
  text: 非斯都说：“亚基帕王，和与我们一同在场的各位男士，你们看这个人：关于这个人，全体犹太民众[a]在耶路撒冷和这里都向我陈情，高声呼喊说，他不该再活着了[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“犹太人的全体民众”。希腊文采用集合性的说法，是非斯都对反对者所作的概括，不一定是说每一个犹太人都无一例外。
    reason: 说明集合性表达的范围，避免将修辞性的整体概括误读为绝对普遍断言。
  - marker: b
    text: 或译：“他不应当继续活下去。”
    reason: 呈现希腊文关于“不再活着”的另一种较直译表达。
lexical_decisions:
- source_word: φησιν
  choice: 说
  rationale: 保留希腊文叙事中的历史现在时；汉语“说”在引出现场讲话时自然明快。
- source_word: συμπαρόντες ἡμῖν ἄνδρες
  choice: 与我们一同在场的诸位男士
  rationale: 既表达共同在场，也保留ἄνδρες对男性与会者的明确称呼和正式语气。
- source_word: θεωρεῖτε τοῦτον
  choice: 你们看这个人
  rationale: 表达非斯都当场请众人注意保罗；比“看哪”更符合现代汉语。
- source_word: ἅπαν τὸ πλῆθος τῶν Ἰουδαίων
  choice: 犹太民众全体
  rationale: 保留πλῆθος的群体性及ἅπαν的整体修辞，同时以脚注说明这不必解释为每个犹太人无一例外。
- source_word: ἐνέτυχόν μοι
  choice: 向我陈情
  rationale: 体现向掌权者正式提出请求的司法语境，避免把它误解为保罗本人所作的法律上诉。
- source_word: ἔν τε Ἱεροσολύμοις καὶ ἐνθάδε
  choice: 在耶路撒冷和这里都
  rationale: 自然体现希腊文“既……又……”的并列结构；“这里”指当时所在的凯撒利亚。
- source_word: βοῶντες
  choice: 高声喊着说
  rationale: 传达持续而强烈的公开呼喊，保留原文的鲜明力度。
- source_word: μὴ δεῖν αὐτὸν ζῆν μηκέτι
  choice: 他不该再活着了
  rationale: 保留δεῖ所表达的应当或必要性，不将其擅自具体化为正式的死刑判决措辞。
theological_decisions:
- issue: 敌对司法语境中的“犹太人”
  choice: 按原文保留对犹太民众这一群体的指称，并用脚注说明其整体性修辞
  alternative: 改译为“犹太领袖”或理解为每个犹太人无一例外
  rationale: 希腊文明说τῶν Ἰουδαίων，不能无文本依据地缩窄为领袖；但ἅπαν τὸ πλῆθος是非斯都对反对群体的概括，不应据此作超出语境的普遍断言。
- issue: 反对者要求保罗死亡的措辞力度
  choice: 他不该再活着了
  alternative: 必须处死他
  rationale: 原文表达他不应继续活着，却没有在本句中直接使用“处死”一词；译文保留其强烈含义而不将隐含要求改成明说的判决术语。
translation_notes:
  register: 采用现代、庄重而可朗读的法庭陈述语体。“诸位男士”“向我陈情”体现正式场合；“高声喊着说”则保留现场冲突的力度。
