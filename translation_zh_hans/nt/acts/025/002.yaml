    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνεφάνισάν
  choice: 陈告……的事
  rationale: 该动词基本义为向人说明、使人知晓；在向总督申诉的司法语境中带有陈情控告的意味。“陈告保罗的事”保留法律色彩，又不把原文过度限定为正式起诉。
- source_word: τε
  choice: 于是
  rationale: 作为连接叙事的附着小品词，承接上一节非斯都到达耶路撒冷的背景；“于是”在中文中自然呈现这一衔接。
- source_word: οἱ ἀρχιερεῖς
  choice: 祭司长
  rationale: 这是指耶路撒冷祭司领袖群体的惯用称谓；中文通常以“祭司长”表示该复数群体。
- source_word: οἱ πρῶτοι τῶν Ἰουδαίων
  choice: 犹太人的首领
  rationale: πρῶτοι在此指社会及政治地位显要的人。“首领”自然表达其领袖和显贵身份，同时保留“犹太人的”这一属格结构。
- source_word: κατὰ τοῦ Παύλου
  choice: 保罗的事
  rationale: κατά加属格在本语境中表明针对保罗的敌对陈告；这一方向由“陈告”及上下文体现，脚注进一步明示其可译为控告保罗。
- source_word: παρεκάλουν
  choice: 恳求
  rationale: 未完成时体现持续或反复请求；“恳求”比普通“请求”更有力度，也符合他们随后所求之事。
