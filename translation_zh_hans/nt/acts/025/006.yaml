id: ACT.25.6
reference: Acts 25:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Διατρίψας δὲ ἐν αὐτοῖς ἡμέρας ⸂οὐ πλείους ὀκτὼ⸃ ἢ δέκα, καταβὰς εἰς Καισάρειαν, τῇ ἐπαύριον καθίσας ἐπὶ τοῦ βήματος ἐκέλευσεν τὸν Παῦλον ἀχθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/006.yaml
  text: After spending among them no more than eight or ten days[a], he went down to Caesarea, and on the next day, after taking his seat on the tribunal, he ordered Paul to be brought in.
translation:
  language: zh_hans
  text: 他在他们那里逗留了不超过八到十天，便下到凯撒利亚。第二天，他坐上审判席[a]，下令把保罗带来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在审判台上就座”。“审判席”所译的希腊语指官员审案时所用的正式座位或审判台。
    reason: 说明司法术语的具体所指，并保留“座位”与“审判台”之间的词义范围。
lexical_decisions:
- source_word: Διατρίψας
  choice: 逗留了
  rationale: 分词表示先于主句发生的动作；“逗留”自然表达在某处住了一段时日。
- source_word: ἐν αὐτοῖς
  choice: 在他们那里
  rationale: 兼顾与前文所述众人同处及身在其所在地的含义，比单说“和他们一起”更适合这里的场景。
- source_word: ἡμέρας οὐ πλείους ὀκτὼ ἢ δέκα
  choice: 不超过八到十天
  rationale: 保留否定比较级所表达的上限，也以现代汉语自然呈现“八或十天”这种约数说法，避免误译成精确天数。
- source_word: καταβὰς εἰς Καισάρειαν
  choice: 下到凯撒利亚
  rationale: 保留从耶路撒冷前往凯撒利亚时使用的方向性旅行用语“下去”。
- source_word: τῇ ἐπαύριον
  choice: 第二天
  rationale: 简洁、自然地表达抵达后的次日。
- source_word: καθίσας ἐπὶ τοῦ βήματος
  choice: 坐上审判席
  rationale: βῆμα在本司法语境中指官员审案时所坐的正式座位或所在的审判台；“坐上审判席”既保留具体意象，也清楚传达司法行为。
- source_word: ἐκέλευσεν τὸν Παῦλον ἀχθῆναι
  choice: 下令把保罗带来
  rationale: 准确表达正式命令和被动带到审理现场的动作；汉语主动处置式更自然，并未补入原文没有的行动者。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“便”衔接先后动作，“下令”体现行政司法场景的正式性。未沿用英文咨询层中误置于天数之后的脚注标记，而将相关词义说明正确标在“审判席”之后。
