  text: συνελθόντων ⸀οὖν ἐνθάδε ἀναβολὴν μηδεμίαν ποιησάμενος τῇ ἑξῆς καθίσας ἐπὶ τοῦ βήματος ἐκέλευσα ἀχθῆναι τὸν ἄνδρα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/017.yaml
  text: So when they had come together here[a], I made no delay, but on the next day I sat on the judgment seat and ordered the man to be brought.
translation:
  language: zh_hans
  text: 所以，他们在这里聚齐后，我没有耽搁，第二天就坐上审判席[a]，下令把那人带来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“坐在审判台上。”希腊语βῆμα可指官员审案时所坐的正式席位，也可指设有该席位的审判台。
    reason: 说明司法术语βῆμα兼有审判席位和审判台的含义。
lexical_decisions:
- source_word: συνελθόντων
  choice: 他们……聚齐后
  rationale: 这是属格独立结构中的不定过去时分词，主语由上下文补出，指控告保罗的人；“聚齐后”自然表达众人会合以及动作先于主句发生。
- source_word: οὖν
  choice: 所以
  rationale: 承接并推进非斯都的陈述，也带有从前文引出的意味；“所以”符合现代汉语叙述。
- source_word: ἐνθάδε
  choice: 在这里
  rationale: 直接表达地点副词的含义，不额外指定他们从何处而来。
- source_word: ἀναβολὴν μηδεμίαν ποιησάμενος
  choice: 我没有耽搁
  rationale: 这是表示不作拖延或延期的惯用表达；译文简洁自然，并保留司法办理事务的语境。
- source_word: τῇ ἑξῆς
  choice: 第二天
  rationale: 此时间用语在上下文中指紧接着的次日；汉语无须补出介词。
- source_word: καθίσας ἐπὶ τοῦ βήματος
  choice: 坐上审判席
  rationale: βῆμα在此指官员审案时所坐的正式司法席位或其高台；“审判席”既准确又便于现代读者理解。
- source_word: ἐκέλευσα
  choice: 下令
  rationale: 表达官员发出正式命令，符合司法行政语境。
- source_word: ἀχθῆναι
  choice: 带来
  rationale: ἄγω的被动不定式表示使那人被带到审判者面前；汉语“下令把……带来”已自然表达被动使役关系，不增添原文没有的“带进来”。
- source_word: τὸν ἄνδρα
  choice: 那人
  rationale: 指上下文中的保罗；“那人”保留原文普通而明确的指称，不增添“被告”等解释性身份。
theological_decisions: []
