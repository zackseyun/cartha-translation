  text: ὡς δὲ πλείους ἡμέρας ⸀διέτριβον ἐκεῖ, ὁ Φῆστος τῷ βασιλεῖ ἀνέθετο τὰ κατὰ τὸν Παῦλον λέγων· Ἀνήρ τίς ἐστιν καταλελειμμένος ὑπὸ Φήλικος δέσμιος,
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/014.yaml
  text: And as they stayed there many days[a], Festus laid before the king the matters concerning Paul, saying[b], “There is a certain man left behind by Felix as a prisoner,”
translation:
  language: zh_hans
  text: 他们在那里住了好些日子，非斯都就把有关保罗的事[a]呈报给王[b]，说：“有一个人被腓力斯留下，仍是囚犯。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“保罗的案件”。原文也可较具体地指保罗所涉的法律案件。
    reason: lexical_alternative
  - marker: b
    text: 或译“向王陈述”。原文有把事情提交给对方说明、供其考虑的意味，不只是一般地提供消息。
    reason: lexical_alternative
lexical_decisions:
- source_word: πλείους ἡμέρας
  choice: 好些日子
  rationale: 这个比较级时间短语在此按习惯用法表示一段较长的时间；“好些日子”自然地保留“多日／数日”的弹性。
- source_word: διέτριβον
  choice: 住
  rationale: διατρίβω在这里指在某地逗留、度过一段时间；“住”配合地点和时段，简洁自然。
- source_word: ἀνέθετο
  choice: 向王陈明
  rationale: 该中动词表示把事情提交给某人说明、供其考虑；“陈明”比单纯的“告知”更能体现正式呈报的意味。
- source_word: τὰ κατὰ τὸν Παῦλον
  choice: 保罗的事
  rationale: 此惯用语泛指与保罗有关的事情，在语境中可能特指他的案件；正文不把含义限定得过窄。
- source_word: Ἀνήρ τίς
  choice: 有一个人
  rationale: 保留不定但特指某人的介绍方式，同时符合现代汉语直接引语的表达。
- source_word: καταλελειμμένος
  choice: 留下
  rationale: 完成时被动分词表示腓力斯离任后，此人仍处于被留下的状态；“留下”不额外加入“遗弃”的情感色彩。
- source_word: δέσμιος
  choice: 囚犯
  rationale: 直接表达此人的受拘禁身份，并与“留下”构成自然的汉语结构。
- source_word: βασιλεῖ
  choice: 王
  rationale: 原文只用头衔“王”，本节不重述亚基帕的名字；译文保持这一指称方式。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“好些日子”避免把πλείους机械译成严格比较级；“保罗的事”在正文中保留原文可泛指相关事务、也可特指案件的含混性。脚注标记依其实际所释词语放置。
