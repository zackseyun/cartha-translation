  text: ὁ Φῆστος δὲ ⸂θέλων τοῖς Ἰουδαίοις⸃ χάριν καταθέσθαι ἀποκριθεὶς τῷ Παύλῳ εἶπεν· Θέλεις εἰς Ἱεροσόλυμα ἀναβὰς ἐκεῖ περὶ τούτων ⸀κριθῆναι ἐπ’ ἐμοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/009.yaml
  text: But Festus[a], wanting to do the Jews a favor, answered Paul and said[c][b], “Do you want to go up to Jerusalem and there be judged before me concerning these things?”
translation:
  language: zh_hans
  text: 可是，非斯都想给犹太人一个人情[a]，就回答保罗说：“你愿意上耶路撒冷去，在我面前为这些事受审吗？”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “犹太人”在这里按上下文主要指控告保罗的犹太领袖或代表，并非不加区别地指所有犹太人。“给……一个人情”也可译作“向……示好”或“施恩惠给……”。
    reason: 说明称谓在本段叙事中的具体所指，并解释χάριν καταθέσθαι所含的施惠、安抚意味。
  - marker: b
    text: “受审”也可译作“受审判”或“让你的案件受审”。“在我面前”可指在非斯都面前并在其权柄下审理，未必限定他是唯一裁判者。
    reason: 说明司法用语及ἐπ’ ἐμοῦ在临在与司法权柄之间的含义范围。
lexical_decisions:
- source_word: θέλων
  choice: 想
  rationale: 现在时分词说明非斯都当时持续的意愿或动机；“想”自然简洁，不额外强化其意图。
- source_word: τοῖς Ἰουδαίοις
  choice: 犹太人
  rationale: 保留希腊文较宽泛的族群与宗教称谓；上下文所指主要是控告保罗的犹太领袖或代表，相关限定放在脚注中说明。
- source_word: χάριν καταθέσθαι
  choice: 讨……的欢心
  rationale: 该习语可表示施惠以取得好感。在本段政治司法语境中，“讨……的欢心”自然表达非斯都迁就控告方、争取其好感的动机，但不必理解为更强烈的贬义。
- source_word: ἀποκριθεὶς τῷ Παύλῳ εἶπεν
  choice: 就回答保罗说
  rationale: 保留叙事中的回答分词与说话动词；现代汉语虽略显重复，却符合庄重的圣经叙事表达。
- source_word: Θέλεις
  choice: 你愿意
  rationale: 此处询问保罗是否愿意接受所提安排；“愿意”比“想要”更符合正式司法语境，也保留由保罗作出同意与否的意味。
- source_word: εἰς Ἱεροσόλυμα ἀναβὰς
  choice: 上耶路撒冷去
  rationale: 保留ἀναβαίνω的“上去”意象，既符合耶路撒冷的地理位置，也符合传统叙事用语。
- source_word: περὶ τούτων
  choice: 为这些事
  rationale: 保持指称宽泛，不把原文未明确说出的内容收窄为“这些指控”。
- source_word: κριθῆναι
  choice: 受审
  rationale: 在司法语境中，被动式κρίνω自然指接受审理；“受审”比字面“被判断”更符合现代汉语法律表达，同时保留案件尚待审理的含义。
- source_word: ἐπ’ ἐμοῦ
  choice: 当着我的面
  rationale: 表达案件在非斯都面前并由其主持审理；不武断限定为完全“由我裁决”，从而保留该介词短语在临在与权柄之间的幅度。
theological_decisions:
- issue: “犹太人”可能引起对整个族群的泛化理解
  choice: 正文保留“犹太人”，脚注说明上下文具体指向控告保罗的犹太领袖或代表。
  alternative: 正文译作“犹太领袖”或“犹太控告者”。
  rationale: 原文使用宽泛称谓τοῖς Ἰουδαίοις，正文不应无提示地收窄；但上下文清楚显示并非不加区别地指每一位犹太人，因此用脚注防止反犹式泛化。
- issue: ἐπ’ ἐμοῦ所表达的司法角色
  choice: 译为“当着我的面”，保留非斯都在场并主持案件的含义。
  alternative: 译为“由我审判”或“在我面前”。
  rationale: “由我审判”可能过度确定非斯都是唯一裁判者；“当着我的面”较自然地保存其临在和权柄两方面的含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“可是”承接前文并突出非斯都动机的转折；直接引语保持正式司法场景的语气。所有脚注标记均已置于正文相应位置。
