source:
  edition: SBLGNT
  text: ἀπορούμενος δὲ ἐγὼ τὴν περὶ ⸀τούτων ζήτησιν ἔλεγον εἰ βούλοιτο πορεύεσθαι εἰς ⸀Ἱεροσόλυμα κἀκεῖ κρίνεσθαι περὶ τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/020.yaml
  text: And since I was at a loss about the investigation concerning these matters[b][a], I asked whether he wanted to go to Jerusalem and be judged there concerning them.
translation:
  language: zh_hans
  text: 我对这些事的查究感到困惑[a]，就问他是否愿意去耶路撒冷，在那里为这些事受审[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我对有关这些事的争议感到困惑。”
    reason: ζήτησις可指查究、问题或争议；ἀπορέω可表示困惑、不知如何处理。
  - marker: b
    text: 也可译作“在那里就这些事接受裁决”。
    reason: κρίνεσθαι的含义较宽，可指在司法程序中受审，或由人对案件作出裁决。
lexical_decisions:
- source_word: ἀπορούμενος
  choice: 感到为难
  rationale: 表达非斯都面对如何处理相关查究时的困惑和无从措置；在现代汉语中自然，也不把语义收窄为单纯的知识不足。
- source_word: ζήτησιν
  choice: 查究
  rationale: 该词可指查问、探究，也可指争议；本节处于司法行政语境，“查究”保留调查审理的色彩，又不像“调查”那样过度制度化。
- source_word: περὶ τούτων
  choice: 对这些事／为这些事
  rationale: 两处均指前述案件相关事项；依汉语搭配分别译出，以避免生硬重复，同时保持指称一致。
- source_word: ἔλεγον
  choice: 就问
  rationale: 字面为“我说”，但后接由 εἰ 引出的间接问句，语用上是提出询问，故译为“问”。
- source_word: εἰ βούλοιτο
  choice: 愿不愿意
  rationale: βούλομαι 在这里表示意愿；“愿不愿意”自然呈现间接问句，并保留自愿与否的重点。
- source_word: πορεύεσθαι
  choice: 去
  rationale: 简明自然地表达前往某地。
- source_word: Ἱεροσόλυμα
  choice: 耶路撒冷
  rationale: 采用现代中文圣经及通行用法中的标准地名。
- source_word: κἀκεῖ
  choice: 在那里
  rationale: 明确保留“并且在那里”的地点信息，按现代汉语语序置于谓语之前。
- source_word: κρίνεσθαι
  choice: 受审
  rationale: 此处为司法语境中的被动审断；“受审”比“被审判”更自然，也不预断裁决结果。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以“可是”承接 δέ 的转折，以“就”呈现分词所带的情境或因由关系；不将 ζήτησις 明确限定为“争议”或仅仅“调查”，并通过脚注保留词义张力。
