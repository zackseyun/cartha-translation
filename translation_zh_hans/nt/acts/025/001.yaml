  yaml_path: translation/nt/acts/025/001.yaml
  text: So Festus[a], after arriving in the province, went up from Caesarea to Jerusalem after three days,
translation:
  language: zh_hans
  text: 非斯都到了任[a]，过了三天，就从凯撒利亚上耶路撒冷去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“进入该省”或“抵达该省”。希腊语也可能含有开始治理该省的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: Φῆστος
  choice: 非斯都
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: οὖν
  choice: 就
  rationale: 在叙事推进中承接上文；中文以“就”自然表达其衔接和顺承作用。
- source_word: ἐπιβὰς τῇ ἐπαρχείᾳ
  choice: 到任该省
  rationale: 该短语字面可指进入或抵达省区，语境中也暗含非斯都开始履任；“到任该省”兼顾抵达与就职含义，但以脚注保留词义范围。
- source_word: ἐπαρχείᾳ
  choice: 省
  rationale: 指罗马帝国的行政省份；“省”简明且符合历史语境。
- source_word: μετὰ τρεῖς ἡμέρας
  choice: 三天后
  rationale: 自然表达μετά加宾格的时间后续关系，且不额外断定是否采用包含式计日。
- source_word: ἀνέβη
  choice: 上……去
  rationale: 保留前往耶路撒冷惯用的“上去”表达，也符合从凯撒利亚到耶路撒冷海拔升高的地理情形。
- source_word: εἰς Ἱεροσόλυμα
  choice: 耶路撒冷
  rationale: 作为“上……去”的目的地，中文无需另加“到”；地名采用标准译名。
- source_word: ἀπὸ Καισαρείας
  choice: 从凯撒利亚
  rationale: 准确表达ἀπό所标示的出发地点，并采用标准地名译法。
