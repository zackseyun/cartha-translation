  text: ζητήματα δέ τινα περὶ τῆς ἰδίας δεισιδαιμονίας εἶχον πρὸς αὐτὸν καὶ περί τινος Ἰησοῦ τεθνηκότος, ὃν ἔφασκεν ὁ Παῦλος ζῆν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/019.yaml
  text: Rather[a], they had certain disputes with him about their own religion and about a certain Jesus who had died, whom Paul claimed to be alive.
translation:
  language: zh_hans
  text: 不过，他们同他有一些争议，是关于他们自己的宗教[a]，也关于一个名叫耶稣、已经死去的人；保罗却声称他还活着。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他们自己的迷信”。希腊词既可中性地指宗教，也可由局外人用来表达较为贬抑的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητήματα
  choice: 争论的……事
  rationale: 该词指有争议的问题，而非中性的询问；此译保留对立性，又符合非斯都概述控告内容的语境。
- source_word: δέ
  choice: 不过
  rationale: 承接上文，表明实际控告与非斯都原先预期的罪状相反；“不过”在现代汉语中自然表达转折和修正。
- source_word: τινα
  choice: 一些
  rationale: 保留不定、非特指的语气，比生硬的“某些”更符合现代汉语。
- source_word: περὶ τῆς ἰδίας δεισιδαιμονίας
  choice: 有关他们自己宗教的事
  rationale: δεισιδαιμονία可中性地指宗教，也可带“迷信”的贬义。正文采用“宗教”以免强化原文未必具有的贬斥，同时用“他们自己”保留非斯都作为局外人的疏离口吻。
- source_word: εἶχον πρὸς αὐτόν
  choice: 同他争论
  rationale: 表达他们与保罗之间存在争议，不额外加入原文在此处并未明确表达的正式法律含义。
- source_word: καὶ περί τινος Ἰησοῦ
  choice: 以及一个……名叫耶稣的人
  rationale: τινος体现非斯都对耶稣疏远、不熟悉的称呼；汉语用“一个……名叫耶稣的人”比“某个耶稣”更自然，同时保留其距离感。
- source_word: τεθνηκότος
  choice: 已经死去
  rationale: 完成时分词表示死亡所造成的状态；“已经死去”自然地与后文“还活着”构成对照。
- source_word: ὃν ἔφασκεν ὁ Παῦλος ζῆν
  choice: 保罗却声称他还活着
  rationale: φάσκω表示声称、断言；此译保留这是非斯都转述保罗主张的视角，并以“却……还”清楚呈现死亡与活着的反差。
theological_decisions:
- issue: 非斯都话语中δεισιδαιμονία的译法
  choice: 宗教
  alternative: 迷信；宗教礼俗
  rationale: 这是外邦官员对犹太信仰的概述。译作“宗教”避免加入现代汉语“迷信”过强的贬义；词语可能具有的负面色彩则在脚注中说明。
- issue: 复活主张的表述
  choice: 保罗却声称他还活着
  alternative: 保罗说他还活着
  rationale: 本句是非斯都的转述，不是叙事者在此从自身立场直接断言。用“声称”忠实传达φάσκω的报告性和非斯都的保留态度，但并不否定《使徒行传》其他经文对复活的肯定。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语言。“不过……只是”衔接上文的对比；“他们自己”保留非斯都的局外人视角；分号帮助读者辨明宗教争议与有关耶稣的具体争议。
