- from: 不过，他们同他争论的，只是一些有关他们自己宗教[a]的事，以及一个已经死去、名叫耶稣的人；保罗却声称他还活着。
  to: 不过，他们同他有一些争议，是关于他们自己的宗教[a]，也关于一个名叫耶稣、已经死去的人；保罗却声称他还活着。
  rationale: 删除“只是”，避免加入原文未明说的限制意味；将两个争议事项改为平行的“关于……也关于……”结构，以清楚对应两个 περί 短语。保留“宗教”及脚注对“迷信”这一可能贬义的说明，也保留“声称”所反映的非斯都转述保罗主张时的保留语气。
