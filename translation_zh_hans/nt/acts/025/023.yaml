source:
  edition: SBLGNT
  text: Τῇ οὖν ἐπαύριον ἐλθόντος τοῦ Ἀγρίππα καὶ τῆς Βερνίκης μετὰ πολλῆς φαντασίας καὶ εἰσελθόντων εἰς τὸ ἀκροατήριον σύν ⸀τε χιλιάρχοις καὶ ἀνδράσιν τοῖς κατ’ ⸀ἐξοχὴν τῆς πόλεως καὶ κελεύσαντος τοῦ Φήστου ἤχθη ὁ Παῦλος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/023.yaml
  text: So on the next day, Agrippa and Bernice came with great pomp and entered the audience hall with both the military tribunes and the prominent men of the city, and at Festus's command Paul was brought in.
translation:
  language: zh_hans
  text: 第二天，亚基帕和百尼基带着盛大的排场[a]来到，同千夫长和城中的显要人物[b]一起进入听审厅。非斯都下令后，保罗就被带了进来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“大张声势地”或“极其隆重地”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“城中的头面人物”。原文所用名词明确指男性。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ οὖν ἐπαύριον
  choice: 第二天
  rationale: 这是表示时间的结构，意为“次日”。上下文的叙事承接在简体中文中无需机械译出 οὖν，句意仍然清楚自然。
- source_word: ἐλθόντος
  choice: 来到
  rationale: 该词虽为属格独立结构中的不定过去时分词，但汉语以谓语“来到”表达更自然，也保留了人物到场的动作。
- source_word: Ἀγρίππα ... Βερνίκης
  choice: 亚基帕和百尼基
  rationale: 采用现代中文圣经语境中通行且易于辨认的人名音译；原文此处没有“王”或其他头衔，故不增译。
- source_word: μετὰ πολλῆς φαντασίας
  choice: 带着盛大的排场
  rationale: φαντασία 在这里指公开露面时显眼而隆重的外在铺陈。“盛大的排场”既传达华丽声势，也不过度增添明确的贬义判断。
- source_word: εἰσελθόντων εἰς τὸ ἀκροατήριον
  choice: 进入听审厅
  rationale: ἀκροατήριον 是供听审或公开聆听之处；“听审厅”简洁地体现本段正式听审的场景，且比“礼堂”更准确。
- source_word: σύν τε χιλιάρχοις
  choice: 同千夫长……一起
  rationale: χιλίαρχος 是统领约千人的高级军官，路加著作中传统而准确的汉语对应为“千夫长”。τε 将这组人与下组显要人物并列，汉语用“同……和……一起”自然体现。
- source_word: ἀνδράσιν τοῖς κατ’ ἐξοχὴν τῆς πόλεως
  choice: 城中的显要人物
  rationale: κατ’ ἐξοχήν 表示出众、居显位。“显要人物”准确表达其社会地位；原文 ἀνδράσιν 指男性，但汉语若直译“显要男子”生硬，因此采用自然的集合性表达，并在脚注说明。
- source_word: κελεύσαντος τοῦ Φήστου
  choice: 非斯都下令后
  rationale: 将属格独立结构按汉语时序译出，既保留非斯都发令的权威性，也清楚交代保罗被带入的直接背景。
- source_word: ἤχθη ὁ Παῦλος
  choice: 保罗就被带了进来
  rationale: ἤχθη 是 ἄγω 的被动形式，表示保罗由人带入；被动表达保留他并非自行入场这一含义。“就”自然衔接命令与执行。
theological_decisions: []
