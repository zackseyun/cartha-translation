  text: περὶ οὗ γενομένου μου εἰς Ἱεροσόλυμα ἐνεφάνισαν οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι τῶν Ἰουδαίων, αἰτούμενοι κατ’ αὐτοῦ ⸀καταδίκην·
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/015.yaml
  text: Concerning him[a], when I arrived in Jerusalem, the chief priests and the elders of the Jews informed me, asking for a sentence of condemnation against him.
translation:
  language: zh_hans
  text: 就这个人，我到了耶路撒冷时，众祭司长和犹太人的长老向我陈明情况，要求作出针对他的定罪判决[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“要求定他的罪”或“要求作出对他不利的判决”。
    reason: 原文καταδίκη指司法上的定罪或不利判决；译法保留其法律语境，并反映中文表达的不同可能。
lexical_decisions:
- source_word: περὶ οὗ
  choice: 关于这个人
  rationale: περί加属格关系代词回指保罗，并把他作为下文陈述的话题；“关于这个人”既明确回指，又符合现代汉语叙事表达。
- source_word: γενομένου μου εἰς Ἱεροσόλυμα
  choice: 我到耶路撒冷后
  rationale: 属格独立结构表达时间，γίνομαι与εἰς加地点在此表示抵达；译文简洁传达“我到达以后”。
- source_word: ἐνεφάνισαν
  choice: 向我陈述了有关他的事
  rationale: 该词在行政、司法语境中表示向权力机关报告或陈明事情。此译法保留“使我知晓”的基本意义，同时避免把未明说的具体指控过度加入正文。
- source_word: οἱ ἀρχιερεῖς
  choice: 众祭司长
  rationale: 复数指犹太教中的主要祭司领袖；“众祭司长”可避免被误解为只有一位大祭司。
- source_word: οἱ πρεσβύτεροι τῶν Ἰουδαίων
  choice: 犹太人的长老
  rationale: 忠实保留属格结构，指犹太群体中的长老领袖，不额外限定其民族或宗教内涵。
- source_word: αἰτούμενοι
  choice: 要求
  rationale: 分词表示与陈述同时发生的请求；在向总督提出司法诉求的语境中，“要求”自然且力度合宜。
- source_word: κατ’ αὐτοῦ
  choice: 判他
  rationale: κατά加属格在司法语境中具有针对、反对某人的含义；汉语将对象置于“判……有罪”结构中最自然。
- source_word: καταδίκην
  choice: 判他有罪的裁决
  rationale: 该名词指司法上的定罪或有罪判决；此译法明确表达他们所求的是正式的不利裁决，而非一般性的谴责。
theological_decisions: []
