  naturalness: 原句整体通顺、庄重。“罗马人的惯例，不是在……”略显书面而可理解；改为“罗马人没有这样的惯例：……”更自然，也清楚保留否定和先后条件。
  terminology: “被控告的人”比“被告”更贴近ὁ κατηγορούμενος，且避免把古代程序直接等同于现代法庭术语。“控告他的人”准确对应τοὺς κατηγόρους；“申辩”“指控”和“交出去”均适切。
