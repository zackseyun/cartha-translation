  text: πρὸς οὓς ἀπεκρίθην ὅτι οὐκ ἔστιν ἔθος Ῥωμαίοις χαρίζεσθαί τινα ⸀ἄνθρωπον πρὶν ἢ ὁ κατηγορούμενος κατὰ πρόσωπον ἔχοι τοὺς κατηγόρους τόπον τε ἀπολογίας λάβοι περὶ τοῦ ἐγκλήματος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/016.yaml
  text: To them I answered that it is not the custom of the Romans to hand over any man before the accused has the accusers face to face and receives an opportunity for a defense concerning the charge[a][b].
translation:
  language: zh_hans
  text: 我回答他们说：“罗马人没有这样的惯例：在被控告的人还没有与控告他的人当面对质，并且还没有机会就所受的指控申辩以前，就把任何人交出去[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “交出去”也可译作“作为人情交付某人”；希腊语动词可指为满足请求而把某人交付出去。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθος
  choice: 惯例
  rationale: 指既定的司法习惯或通行做法；“惯例”自然、庄重，并符合行政司法语境。
- source_word: Ῥωμαίοις
  choice: 罗马人的
  rationale: 与ἔθος构成领属意义，指罗马人所遵行的司法惯例，不特意缩窄为某一群官员。
- source_word: χαρίζεσθαί
  choice: 交出去
  rationale: 此处指应请求把某人交给控告方，含有作为人情或恩惠而交付的意味；正文采用符合司法语境的自然表达，并以脚注保留词义层次。
- source_word: τινα ἄνθρωπον
  choice: 任何人
  rationale: 原文为泛指，在此法律语境中并非特指男性；现代汉语用“任何人”准确自然。
- source_word: ὁ κατηγορούμενος
  choice: 被告
  rationale: 实体化分词指受控告的人；“被告”简洁且适合法律语境。
- source_word: τοὺς κατηγόρους
  choice: 原告
  rationale: 指提出控告的人；与“被告”相对，采用“原告”使司法关系清楚，同时不加入原文没有的身份细节。
- source_word: κατὰ πρόσωπον ἔχοι
  choice: 当面对质
  rationale: 原文强调被告面对控告者；“当面对质”以自然现代汉语表达直接会面的法律场景。
- source_word: τόπον τε ἀπολογίας λάβοι
  choice: 并有机会……申辩
  rationale: τόπος在此不是物理地点，而是机会或余地；ἀπολογία指针对控罪所作的辩护。
- source_word: περὶ τοῦ ἐγκλήματος
  choice: 为所受的指控
  rationale: ἔγκλημα指法律上的控告或罪名；此译法明确申辩所针对的是提出的指控，而不预断其成立。
