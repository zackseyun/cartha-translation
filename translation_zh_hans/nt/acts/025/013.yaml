  text: After some days had passed[a], King Agrippa and Bernice arrived at Caesarea to greet Festus.
translation:
  language: zh_hans
  text: 过了些日子，亚基帕王和百尼基来到凯撒利亚，问候非斯都。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἡμερῶν δὲ διαγενομένων τινῶν
  choice: 过了些日子
  rationale: 这是属格独立结构，交代后续事件的时间背景；δέ仅有轻微承接作用，现代汉语无需另加“于是”或“后来”。
- source_word: Ἀγρίππας ὁ βασιλεὺς
  choice: 亚基帕王
  rationale: 按现代汉语中君王名号的自然次序表达，同时保留βασιλεύς所指的王衔。
- source_word: Βερνίκη
  choice: 百尼基
  rationale: 采用现代中文圣经及相关文献中较通行、易辨认的音译。
- source_word: κατήντησαν εἰς Καισάρειαν
  choice: 来到凯撒利亚
  rationale: 该动词与εἰς共同表达抵达目的地；“来到”自然简洁，并保留行程抵达之意。
- source_word: ἀσπασάμενοι τὸν Φῆστον
  choice: 向非斯都问候
  rationale: ἀσπάζομαι在此表示见面致意；分词可理解为伴随情形或此行目的，译文以自然汉语表达，但不加入原文未明说的正式拜会或致敬意味。
- source_word: Φῆστον
  choice: 非斯都
  rationale: 采用现代中文圣经中常见的罗马人名音译。
