  text: εἰ μὲν ⸀οὖν ἀδικῶ καὶ ἄξιον θανάτου πέπραχά τι, οὐ παραιτοῦμαι τὸ ἀποθανεῖν· εἰ δὲ οὐδέν ἐστιν ὧν οὗτοι κατηγοροῦσίν μου, οὐδείς με δύναται αὐτοῖς χαρίσασθαι· Καίσαρα ἐπικαλοῦμαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/011.yaml
  text: If[a], then, I am doing wrong and have done anything deserving death, I do not refuse to die. But if there is nothing to the things these men are accusing me of, no one can hand me over to them as a favor. I appeal to Caesar.
translation:
  language: zh_hans
  text: 我若在行不义，又做过什么应受死刑惩罚的事，我不拒绝去死；但若他们控告我的这些事全无根据，就没有人能把我作为人情交给他们。[a]我向凯撒上诉。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“就没有人能为了讨好他们而把我交给他们。”原文动词兼有“作为恩惠给予”和“交付”的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδικῶ
  choice: 做了不义的事
  rationale: 该词在此兼有道德与司法上的“行不义、犯法”之意；结合审讯语境译为“做了不义的事”，既自然，也不把罪名具体化。希腊语为现在时，但在条件句中主要表达保罗当前是否处于违法有罪的状态，汉语无需机械标示进行体。
- source_word: ἄξιον θανάτου πέπραχά τι
  choice: 犯了什么该死的罪
  rationale: ἄξιον θανάτου 表示应受死刑或配受死；πέπραχά τι 指已经做过某事且与当前审判相关。译文以自然的法律语境表达其整体意义，同时保留 τι 的不确定性。
- source_word: οὐ παραιτοῦμαι τὸ ἀποθανεῖν
  choice: 我并不拒绝死
  rationale: παραιτοῦμαι 在这里是拒绝、推辞之意；直译式表达保留保罗在假设有罪时愿意接受死亡判决的力度。
- source_word: οὐδέν ἐστιν ὧν οὗτοι κατηγοροῦσίν μου
  choice: 他们控告我的这些事若全无根据
  rationale: οὐδέν ἐστιν 表示所控告之事并不存在或没有实质根据。“全无根据”符合现代汉语法庭语境，又没有额外断定超出原文的信息。
- source_word: χαρίσασθαι
  choice: 把我交给他们作人情
  rationale: 该动词含有出于恩惠而给予、让与的意味；在此司法语境中，所指是把保罗交给控告者以讨好他们。“作人情”保留交付与施惠两层含义。
- source_word: Καίσαρα ἐπικαλοῦμαι
  choice: 我要向凯撒上诉
  rationale: 这是罗马法律中的正式上诉用语。“向凯撒上诉”在现代汉语中准确、清楚；“要”体现此处当场提出上诉的宣告语气。
- source_word: μὲν οὖν ... δὲ
  choice: 若确实……；但……若
  rationale: 用“确实”传达 μὲν οὖν 对第一种条件的确认性铺陈，用“但”引出相反条件，保持论证结构而不生硬逐词对应。
theological_decisions:
- issue: 保罗对死刑与司法权的条件性陈述
  choice: 保留“若有该死之罪，就不拒绝死”的条件结构，同时明确拒绝无根据地被交给控告者。
  alternative: 将这句话仅理解为修辞表达，不认为保罗对司法处死的正当性作任何条件性承认。
  rationale: 原文直接设置有罪与指控无据两种相反情形。译文不把本节扩展为普遍的死刑教义，只呈现保罗在本案中的法律论证与条件性接受。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语，保留法庭陈述的严谨与力度。“凯撒”为读者熟悉的传统称谓；“作人情”是自然现代用语，并由脚注补明其讨好控告者的司法政治含义。
