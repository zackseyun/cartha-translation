  to: 我若在行不义，又做过什么应受死刑惩罚的事，我不拒绝去死；但若他们控告我的这些事全无根据，就没有人能把我作为人情交给他们。[a]我向凯撒上诉。
  rationale: 修订除去“确实”这一未由原文明确要求的强化语，并以“在行不义／做过”分别反映现在时 ἀδικῶ 与完成时 πέπραχά。以“应受死刑惩罚的事”表达 ἄξιον θανάτου 的法律含义；调整“作为人情交给他们”的语序，使其更自然地表达 χαρίσασθαι 所含的施惠、讨好意味。其余保留原有的司法语气、条件对比和正式上诉用语。
