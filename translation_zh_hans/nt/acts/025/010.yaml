  text: εἶπεν δὲ ὁ Παῦλος· ⸂Ἐπὶ τοῦ βήματος Καίσαρος ἑστώς⸃ εἰμι, οὗ με δεῖ κρίνεσθαι. Ἰουδαίους οὐδὲν ⸀ἠδίκησα, ὡς καὶ σὺ κάλλιον ἐπιγινώσκεις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/010.yaml
  text: But Paul said[a], “I am standing before Caesar’s tribunal, where I ought to be judged. I have done no wrong to the Jews[c][b], as you yourself know very well.”
translation:
  language: zh_hans
  text: 保罗却说：“我正站在凯撒的审判台前[a]，我理当在这里受审。我在任何事上都没有亏待犹太人[b]，这一点你自己也十分清楚[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “审判台”也可译作“法庭”。希腊语βῆμα可指官员的审判席，也可转指施行审判的法庭。
    reason: lexical_alternative
  - marker: b
    text: 或译：“我丝毫没有亏负犹太人”，或“我没有犯过任何得罪犹太人的事”。
    reason: lexical_alternative
  - marker: c
    text: “十分清楚”直译为“更清楚”或“知道得更确切”。
    reason: lexical_alternative
lexical_decisions:
- source_word: βῆμα
  choice: 审判台
  rationale: 这个词既可指官员施行审判时所坐的席位，也可转指其法庭或审判机关。“审判台”保留了原文的具体形象，同时在上下文中清楚传达正式司法场合。
- source_word: Καίσαρος
  choice: 凯撒的
  rationale: Καῖσαρ在这里是罗马皇帝的称号。“凯撒”既贴近原文，也保留保罗上诉于罗马皇权的历史和法律背景。
- source_word: ἑστώς εἰμι
  choice: 我正站
  rationale: 完成时分词与εἰμί构成迂说结构，突出保罗当前所处的法律地位。“正站”在中文中自然地表达他此刻已处于凯撒审判权之下。
- source_word: οὗ
  choice: 在这里
  rationale: 关系副词回指凯撒的审判台，表明这正是应当审理保罗案件的司法场所。“在这里”符合现代汉语表达。
- source_word: δεῖ
  choice: 理当
  rationale: δεῖ表达必要性或应然性；此处关乎适当的司法管辖权。“理当”兼具法律程序上的正当与必要之意。
- source_word: κρίνεσθαι
  choice: 受审
  rationale: 被动不定式在司法语境中指接受审判或审理。“受审”比逐字的“被判断”更符合现代汉语法律表达。
- source_word: Ἰουδαίους
  choice: 犹太人
  rationale: 这里指保罗被控得罪的犹太人，并未明确限定为犹太当局或犹太地区居民，因此采用范围同样宽泛的“犹太人”。
- source_word: οὐδὲν ἠδίκησα
  choice: 我没有做过任何对不起……的事
  rationale: ἀδικέω涵盖行不义、亏负、伤害或冒犯他人，兼有道德和法律意味。此译自然明白，并保留其较宽的语义范围。
- source_word: ὡς καὶ σὺ κάλλιον ἐπιγινώσκεις
  choice: 这也是你自己十分清楚的
  rationale: καὶ σὺ突出“你自己”，ἐπιγινώσκεις表示确切知道，κάλλιον字面为比较级“更清楚/更好”，在此可按惯用语气表达为“十分清楚”。脚注保留其比较级形式。
theological_decisions:
- issue: 保罗关于适当审判权的陈述
  choice: 我理当在这里受审
  alternative: 我必须在这里受审
  rationale: 原文δεῖ可表示必须或理当；结合保罗正在主张凯撒法庭具有适当管辖权的语境，“理当”保留应然与必要之间的张力，而不把它解释为神学上的必然安排。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“凯撒”保留罗马历史称号；“审判台”“受审”“理当”共同呈现本节的司法语境。句式避免过度古雅，也不把保罗关于管辖权的陈述扩展为特定教义判断。
