base_translation:
  language: en
  yaml_path: translation/nt/acts/025/005.yaml
  text: Therefore[a], let those among you who are able go down with me, and if there is anything wrong in the man[b], let them accuse him.
translation:
  language: zh_hans
  text: “所以，”他说，“你们中间有权势的人[a]跟我一同下去吧；这人若有什么不当之处，就控告他[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你们中间有能力的人”或“你们中间的领袖”。希腊语“有权势的人”也可指有能力、具地位或能胜任的人。
    reason: lexical_alternative
  - marker: b
    text: “控告他”也可译为“对他提出指控”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ οὖν
  choice: 所以……人
  rationale: οὖν承接上文并引出结论，译为“所以”；定冠词与形容词构成名词性短语，在汉语中自然表达为“……的人”。
- source_word: ἐν ὑμῖν ... δυνατοὶ
  choice: 你们中间有能力的人
  rationale: δυνατοί既可指有能力者，也可指有权势或地位者。正文采用较宽泛的“有能力的人”，避免在行政司法语境中擅自限定为领袖或权贵，并以脚注保留其他可能。
- source_word: φησίν
  choice: 他说
  rationale: 这是插入语，标明话语归属。汉语用引号间的“他说”既自然，也明确保留原文的叙事标记。
- source_word: συγκαταβάντες
  choice: 跟我一同下去
  rationale: 该分词表示一同下去；“一同”体现σύν的共同意味，“下去”保留从耶路撒冷往凯撒利亚的惯用地理说法。结合上文，同行对象是非斯都，因此补出“我”。
- source_word: εἴ τί ἐστιν ἐν τῷ ἀνδρὶ
  choice: 这人若有什么
  rationale: “若有什么”保留条件和不定意味；“这人”自然表达带定冠词的ἀνήρ，同时保持说话者对保罗略显疏离的称呼。
- source_word: ἄτοπον
  choice: 不当之处
  rationale: ἄτοπον可指不妥、错误或不正当之事。“不当之处”保持宽泛，不把原文过度收窄为已经证实的犯罪。
- source_word: κατηγορείτωσαν αὐτοῦ
  choice: 就控告他
  rationale: κατηγορέω在本段司法语境中指控告或提出指控；“控告他”简洁自然，并保留第三人称命令语气。
theological_decisions: []
