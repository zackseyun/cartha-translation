  text: τότε ὁ Φῆστος συλλαλήσας μετὰ τοῦ συμβουλίου ἀπεκρίθη· Καίσαρα ἐπικέκλησαι, ἐπὶ Καίσαρα πορεύσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/012.yaml
  text: Then Festus[a], after conferring with the council, answered, “You have appealed to Caesar; to Caesar you will go.”
translation:
  language: zh_hans
  text: 于是，非斯都同议会商议后，回答说：“你已经向凯撒上诉了；你就要到凯撒那里去[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你就要到凯撒面前去。”这句话带有法律含义，指在提出上诉后前往皇帝的审判权威面前。
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: 于是
  rationale: 表示叙事顺序及前后承接；“于是”比“那时”更自然地引出非斯都随后的处理。
- source_word: συλλαλήσας
  choice: 商议后
  rationale: 不定过去时分词表示先于主句发生的动作；此处处于司法行政语境，用“商议”准确表达共同讨论、磋商之意。
- source_word: μετὰ τοῦ συμβουλίου
  choice: 同议会
  rationale: συμβούλιον 指参与审议或提供意见的议事机构；译作“议会”简洁，并且不把原文没有明说的“他的”加入正文。
- source_word: ἀπεκρίθη
  choice: 回答说
  rationale: 保留叙事中的回应动作，也自然引出直接引语，符合庄重的庭审语境。
- source_word: Καίσαρα
  choice: 凯撒
  rationale: 保留罗马皇帝的称号及本段的法律历史背景；“凯撒”也是现代中文圣经语境中的通行译名。
- source_word: ἐπικέκλησαι
  choice: 既已向……上诉
  rationale: 完成时中间语态在这里具有明确的法律含义，即诉诸凯撒的司法权；“既已”体现已作出且现仍有效的上诉。
- source_word: ἐπὶ Καίσαρα
  choice: 到凯撒那里
  rationale: 配合 πορεύσῃ 表达朝向所诉诸的权威而去；正文保留动作方向，脚注说明其也可表达前往凯撒的审判席前。
- source_word: πορεύσῃ
  choice: 就要……去
  rationale: 忠实表达将来时的移动含义；不译成“将被送去”，以免加入原动词未明说的被动程序。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而清楚的现代标准汉语。直接引语保持简洁有力，并以“既已……就要……”再现原文前后两句的法律逻辑。脚注标记置于其所说明的短语之后。
