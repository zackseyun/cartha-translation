  text: ⸂τοῦ Παύλου ἀπολογουμένου⸃ ὅτι Οὔτε εἰς τὸν νόμον τῶν Ἰουδαίων οὔτε εἰς τὸ ἱερὸν οὔτε εἰς Καίσαρά τι ἥμαρτον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/008.yaml
  text: 'Paul made his defense: “I have sinned in nothing against either the law of the Jews[a], or the temple, or Caesar.”'
translation:
  language: zh_hans
  text: 保罗申辩说：“无论是犹太人的律法、圣殿，还是凯撒，我都没有犯过任何罪[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我丝毫没有触犯犹太人的律法、圣殿或凯撒。”
    reason: 词义备选：ἥμαρτον在此司法语境中也可表达“犯过错、触犯”。
lexical_decisions:
- source_word: ἀπολογουμένου
  choice: 保罗申辩说
  rationale: 该分词属格独立结构交代保罗在法庭上的答辩；“申辩”自然保留司法语境，“说”引出其答辩内容。
- source_word: ὅτι
  choice: 用冒号和直接引语表达
  rationale: 这里的ὅτι引出申辩内容；现代汉语用冒号及引号比直译为“即”或“说他”更自然。
- source_word: νόμον τῶν Ἰουδαίων
  choice: 犹太人的律法
  rationale: 保留属格结构及正式语气，不把其范围过度限定为民族、地域或宗教意义。
- source_word: ἱερὸν
  choice: 圣殿
  rationale: 此词通常指圣殿建筑群，而非专指内层圣所；“圣殿”是本语境中清楚且通行的译法。
- source_word: Καίσαρά
  choice: 凯撒
  rationale: 保留原文的君王称号，符合罗马司法政治语境；不直接释作“皇帝”，以免抹去原文称谓。
- source_word: τι
  choice: 什么
  rationale: 与否定表达连用，传达在任何方面都没有犯罪的全面否认，符合自然汉语。
- source_word: ἥμαρτον
  choice: 犯过什么罪
  rationale: “犯罪”保留ἁμαρτάνω常有的罪与过犯意味，同时在法庭语境中也能表达触犯或得罪某一对象。
- source_word: οὔτε ... οὔτε ... οὔτε
  choice: 无论是……、……，还是……，都没有
  rationale: 以现代汉语自然的关联结构清楚保留原文三重并列否定。
theological_decisions:
- issue: ἥμαρτον的法律含义与道德含义
  choice: 译作“没有犯过什么罪”
  alternative: “没有犯过任何过错”或“没有触犯”
  rationale: 上下文是司法申辩，但原词仍是通常表示“犯罪”的ἁμαρτάνω。正文保留“罪”的词义联系，不将其缩减为纯技术性的法律用语；脚注提示司法语境下可理解为“触犯”。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“申辩”体现法庭场景；三项并列对象用“无论是……还是……”组织，使口语可懂而不失正式。脚注标记已置于正文相关句末。
