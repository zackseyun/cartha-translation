base_translation:
  language: en
  yaml_path: translation/nt/acts/025/022.yaml
  text: Then Agrippa said to Festus[a], “I myself would like to hear the man.” “Tomorrow,” he says[c][b], “you will hear him.”
translation:
  language: zh_hans
  text: 亚基帕对非斯都说：“我本人也想听听这个人说话[a]。”非斯都说[b]：“明天你会听他讲话[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我本人也”也可译作“我本人想听听这个人说话”或“我也想听听这个人说话”；原文既可强调“我本人”，也可突出“我也”。
    reason: lexical_alternative
  - marker: b
    text: 原文用历史现在时，直译为“他说”；这里按中文叙事习惯译作“非斯都说”。
    reason: lexical_alternative
  - marker: c
    text: 直译为“你会听他”或“你会听他说话”，指亲自听这个人发言。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγρίππας
  choice: 亚基帕
  rationale: 采用现代中文圣经语境中通行的人名音译。
- source_word: δὲ
  choice: 不单独译出
  rationale: 此处主要承接叙事；中文直接转入亚基帕的发言更自然，也不损失明显的转折信息。
- source_word: πρὸς τὸν Φῆστον
  choice: 对非斯都说
  rationale: 原文省略了明确的说话动词，但中文需补出“说”，才能自然标明受话对象并引出直接引语。
- source_word: Ἐβουλόμην
  choice: 想
  rationale: 未完成时在此表达较为委婉的意愿；“想”简洁自然，结合语境可传达“愿意、想要”的意思，不机械仿译其时态形态。
- source_word: καὶ αὐτὸς
  choice: 我自己也
  rationale: 同时保留καί可能具有的附加义“也”和αὐτός的强调义“自己”，不强行排除其中任何一面。
- source_word: τοῦ ἀνθρώπου ἀκοῦσαι
  choice: 听听这个人
  rationale: ἀκούω接属格可表示亲自听某人说话；“听听这个人”保留原文简洁表达，而脚注说明其语境含义。
- source_word: Αὔριον
  choice: 明天
  rationale: 直接对应时间副词。
- source_word: φησίν
  choice: 非斯都说
  rationale: 明确中文叙事中的说话者；正文用自然的过去叙事表达，脚注保留原文历史现在时的信息。
- source_word: ἀκούσῃ αὐτοῦ
  choice: 你就会听他申述
  rationale: 在审讯语境中，短语指听保罗本人发言或陈述；“申述”使中文意思清楚，同时以脚注保留较直译的可能。
