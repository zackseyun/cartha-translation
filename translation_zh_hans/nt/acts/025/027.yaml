id: ACT.25.27
reference: Acts 25:27
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἄλογον γάρ μοι δοκεῖ πέμποντα δέσμιον μὴ καὶ τὰς κατ’ αὐτοῦ αἰτίας σημᾶναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/027.yaml
  text: For it seems unreasonable to me[a], when sending a prisoner, not also to indicate the charges against him.
translation:
  language: zh_hans
  text: 因为在我看来，押送一个囚犯，却不同时说明[a]对他的指控，是不合理的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “说明”或译“明确列出”。
    reason: 词义可涵盖一般的指明或较具体的列明；正文保留较宽泛的表达，脚注提供更明确的司法语境译法。
lexical_decisions:
- source_word: ἄλογον
  choice: 不合理的
  rationale: 这里指做法不合情理、不妥当；“不合理”符合非斯都对行政程序的判断，也避免“荒谬”所带的过强语气。
- source_word: δοκεῖ μοι
  choice: 在我看来
  rationale: 保留原文带有个人判断色彩的委婉表达，比直接译作“我认为”更贴近其语气。
- source_word: πέμποντα
  choice: 押送
  rationale: 在囚犯和司法移送的语境中，“押送”比一般的“送”更准确自然；句中以情境性表达呈现分词的功能。
- source_word: δέσμιον
  choice: 一个囚犯
  rationale: 该词指受到拘押的人；“囚犯”是现代汉语法律语境中清楚、通顺的对应词。
- source_word: μὴ καὶ
  choice: 却不同时
  rationale: “同时”保留 καί 的附加意味，“却不”则自然呈现押送囚犯与未附指控之间的不协调。
- source_word: τὰς κατ’ αὐτοῦ αἰτίας
  choice: 对他的指控
  rationale: αἰτία 在司法语境中指控罪或控告理由；“对他的指控”准确且符合现代汉语习惯。
- source_word: σημᾶναι
  choice: 说明
  rationale: 该词可表示指明、告知；“说明”适合正式行政语境，同时不强行加入原文未明确表达的详尽程度。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的司法行政语体。“因为在我看来……是不合理的”保留原文先提出评价、后说明情形的结构；“押送……却不同时……”使汉语关系清晰自然。脚注标记置于其实际对应的“说明”之后。
