    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ οὗ
  choice: 控告他的人
  rationale: 将介词短语所指的保罗自然融入“控告他的人”中，保留指称关系，也避免生硬的“关于他”。
- source_word: σταθέντες
  choice: 站起来时
  rationale: 不定过去时分词在此具有时间意义；“站起来时”既贴近原文，也符合庭审陈述的场景。
- source_word: οἱ κατήγοροι
  choice: 控告……的人
  rationale: 准确表达法律语境中提出控告者的身份，同时比“检察官”更宽泛，不额外设定其正式职务。
- source_word: οὐδεμίαν αἰτίαν ἔφερον
  choice: 并没有提出任何……指控
  rationale: 该法律用语表示提出罪名或控告；“提出……指控”自然、清楚，并保留司法语气。
- source_word: ὧν ἐγὼ ὑπενόουν
  choice: 我原以为会有的
  rationale: ὑπονοέω在此可表示预料、猜想或怀疑；未完成时指先前持续的预想。“原以为会有”在汉语中自然呈现这种背景性预期。
- source_word: πονηρῶν
  choice: 恶行
  rationale: 原词为中性复数，泛指邪恶或不当之事。“恶行”比“罪行”更少限定于法定犯罪，同时适合此处控告语境。
