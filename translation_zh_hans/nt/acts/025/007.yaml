source:
  edition: SBLGNT
  text: παραγενομένου δὲ αὐτοῦ περιέστησαν ⸀αὐτὸν οἱ ἀπὸ Ἱεροσολύμων καταβεβηκότες Ἰουδαῖοι, πολλὰ καὶ βαρέα αἰτιώματα ⸀καταφέροντες ἃ οὐκ ἴσχυον ἀποδεῖξαι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/007.yaml
  text: And when he arrived[a], the Jews who had come down from Jerusalem stood around him[b], bringing many serious charges that they were not able to prove.
translation:
  language: zh_hans
  text: 他一到，那些从耶路撒冷下来的犹太人[a]就围在他身边[b]，提出许多严重的指控，却无法证实。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “犹太人”也可译作“犹太地区的人”。这里指从耶路撒冷下来控告保罗的人。
    reason: lexical_alternative
  - marker: b
    text: 或译：“站在他周围”。原文动词可指众人环绕某人站立；在这里，这种姿态也可能带有施压意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενομένου δὲ αὐτοῦ
  choice: 他一到
  rationale: 这是属格独立结构，表示时间背景。“他一到”以自然简洁的现代汉语呈现先后关系，同时保留原文代词，没有自行补出人名。
- source_word: οἱ ἀπὸ Ἱεροσολύμων καταβεβηκότες Ἰουδαῖοι
  choice: 那些从耶路撒冷下来的犹太人
  rationale: 保留“从耶路撒冷下来”这一符合当地地势及叙事习惯的表达。Ἰουδαῖοι在此指来自耶路撒冷的犹太控告者；译作“犹太人”最符合上下文，同时以脚注保留“犹太地区的人”这一词义可能。
- source_word: περιέστησαν αὐτὸν
  choice: 围在他身边
  rationale: περιίστημι描写众人站在某人四周。“围在他身边”自然呈现法庭场景中的空间姿态，又不额外断定他们具有原文未明说的暴力意图。
- source_word: πολλὰ καὶ βαρέα αἰτιώματα
  choice: 许多严重的指控
  rationale: αἰτιώματα在此是法律语境中的控告或罪名；βαρέα表示分量重、性质严重。“许多严重的指控”准确、清楚且符合现代法律语体。
- source_word: καταφέροντες
  choice: 提出
  rationale: 该分词在法律语境中表示提出或加以控告。与“指控”搭配时，“提出”是自然庄重的现代汉语。
- source_word: ἃ οὐκ ἴσχυον ἀποδεῖξαι
  choice: 却无法证实
  rationale: ἰσχύω加不定式表示有能力做某事，ἀποδείκνυμι在此表示以证据证明。“无法证实”简洁呈现他们不能证明这些指控；“却”表达原句在语义上的反差。
theological_decisions: []
