  text: τοῦ δὲ Παύλου ἐπικαλεσαμένου τηρηθῆναι αὐτὸν εἰς τὴν τοῦ Σεβαστοῦ διάγνωσιν, ἐκέλευσα τηρεῖσθαι αὐτὸν ἕως οὗ ⸀ἀναπέμψω αὐτὸν πρὸς Καίσαρα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/021.yaml
  text: But when Paul appealed to be kept in custody for the decision of the Emperor[a], I ordered that he be kept in custody until I send him to Caesar.
translation:
  language: zh_hans
  text: 但保罗提出上诉，要求将自己羁押，等候皇帝[a]裁决，我就下令继续羁押他，直到我把他送交凯撒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作“塞巴斯托斯”（Σεβαστός），是与罗马皇帝尊号“奥古斯都”相当的希腊语称号。
    reason: 说明原文使用的是皇帝尊号，并保留其历史称谓信息。
lexical_decisions:
- source_word: ἐπικαλεσαμένου
  choice: 提出上诉
  rationale: 在罗马司法语境中，该词指正式行使上诉权；“提出上诉”既准确又符合现代汉语法律表达。
- source_word: τηρηθῆναι / τηρεῖσθαι
  choice: 继续受押 / 拘押起来
  rationale: 两处都指官方羁押，而非一般的看守或保护。依据各自句法分别采用自然汉语表达，同时保留重复出现的羁押含义。
- source_word: διάγνωσιν
  choice: 裁决
  rationale: 此处指司法上的审断或决定；“裁决”能体现司法语境，又不限定具体审理程序。
- source_word: Σεβαστοῦ
  choice: 皇帝
  rationale: Σεβαστός在这里是罗马皇帝的尊号，而非人名。“皇帝”对现代读者最自然清楚；原词的字面尊号信息收入脚注。
- source_word: ἀναπέμψω
  choice: 送往
  rationale: 该词在此指把保罗送交更高的皇权当局；“送往”自然传达移送之意，不过度强调其字面方向。
- source_word: πρὸς Καίσαρα
  choice: 到凯撒那里
  rationale: Καίσαρ在本段作为皇帝的称号使用；保留“凯撒”符合《使徒行传》的历史措辞，也与前面的“皇帝”形成原文所具有的称谓变化。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“继续受押，等候……裁决”清楚呈现上诉后的羁押状态；后半句保留原文再次提及拘押的表达。
