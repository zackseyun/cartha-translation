    rationale: 原文先说保罗要求被羁押以等候皇帝裁决，后说费斯都下令一直羁押他至送交凯撒；后者应表达维持拘押，而非重新开始拘押。
  - severity: low
    issue: 脚注将Σεβαστός释为“至尊者”。
    rationale: Σεβαστός是希腊语中对应Augustus的皇帝尊号；以“至尊者”作为确定字面义不够稳妥，也不如说明其称号性质准确。
  - severity: low
    issue: “送往凯撒那里”略口语化。
    rationale: “送交凯撒”在正式叙事和司法移送语境中更简洁自然。
