revisions:
- from: 但保罗提出上诉，要求继续受押，等候皇帝[a]裁决，我就下令把他拘押起来，直到我把他送往凯撒那里。
  to: 但保罗提出上诉，要求将自己羁押，等候皇帝[a]裁决，我就下令继续羁押他，直到我把他送交凯撒。
  rationale: 修订维持原文的法律语境、保罗上诉后等候皇帝裁决的目的，以及费斯都持续羁押保罗直至送交凯撒的次序。脚注改为历史语言说明，避免把皇帝尊号过度固定为某一字面释义。
