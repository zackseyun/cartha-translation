  text: Ὡς δὲ ἔμελλον αἱ ἑπτὰ ἡμέραι συντελεῖσθαι, οἱ ἀπὸ τῆς Ἀσίας Ἰουδαῖοι θεασάμενοι αὐτὸν ἐν τῷ ἱερῷ συνέχεον πάντα τὸν ὄχλον καὶ ἐπέβαλον ⸂ἐπ’ αὐτὸν τὰς χεῖρας⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/027.yaml
  text: As the seven days were about to be completed[a], the Jews from Asia, seeing him in the temple, stirred up the whole crowd and laid hands on him[c][b],
translation:
  language: zh_hans
  text: 那七天快要结束的时候，从亚细亚来的犹太人[a]看见保罗在圣殿区[b]里，就煽动全体群众[c]，并伸手抓住他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚细亚”指当时罗马帝国的亚细亚行省，位于今天土耳其西部，并非泛指现代的亚洲。
    reason: cultural_note
  - marker: b
    text: 这里的“圣殿区”指圣殿建筑群及其院区，并非专指内殿。
    reason: cultural_note
  - marker: c
    text: 或译：“使全体群众陷入混乱。”希腊语动词既可侧重煽动、搅扰，也可侧重使人混乱。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ ἔμελλον αἱ ἑπτὰ ἡμέραι συντελεῖσθαι
  choice: 那七天快要结束的时候
  rationale: 保留 μέλλω 所表达的临近状态，以及 συντελεῖσθαι 所表达的完成、终结之意；现代汉语自然明白，又不把上下文所指的洁净期直接加入正文。
- source_word: οἱ ἀπὸ τῆς Ἀσίας Ἰουδαῖοι
  choice: 从亚细亚来的犹太人
  rationale: 准确表达来源；采用传统地名“亚细亚”，并以脚注说明这里指罗马行省，避免被理解为现代亚洲。
- source_word: θεασάμενοι αὐτὸν
  choice: 看见保罗
  rationale: 分词表示他们看见他之后或当时所作的反应。汉语补出本节所指的保罗，比重复“他”更清楚，且不增加解释性内容。
- source_word: ἐν τῷ ἱερῷ
  choice: 在圣殿区里
  rationale: ἱερόν 指整个圣殿建筑群或院区，而非专指内殿；“圣殿区”兼顾准确性与现代汉语的可读性。
- source_word: συνέχεον πάντα τὸν ὄχλον
  choice: 煽动全群人
  rationale: συγχέω 在此群体冲突场景中可表示煽动、搅扰，也可着重于使人混乱；正文采用符合事件进展的“煽动”，脚注保留另一语义侧重。
- source_word: ἐπέβαλον ἐπ’ αὐτὸν τὰς χεῖρας
  choice: 下手抓住他
  rationale: 该习语表示强行把手加在某人身上并控制住他；“下手抓住”保留动作色彩，也自然表达强制拘拿的含义。
theological_decisions: []
