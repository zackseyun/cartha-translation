  register: 采用现代、庄重而易懂的叙事文体。“那七天快要结束的时候”自然呈现临近完成的时间背景；“圣殿区”避免现代读者把 ἱερόν 误解为内殿；“下手抓住”传达强制性，又保留原文身体动作的形象。
