  verdict: revise
  source_fidelity: 整体忠实呈现这是他人转述、针对保罗的指控，并保留“摩西”作为律法和祖传实践的转喻。“所有住在外族人中间的犹太人”准确对应散居列国中的犹太人。惟“他们听说”较弱，未充分体现κατηχήθησαν所指被告知、被传授的报告；“那些习俗”中的指示词在原文无明确对应，宜改为“祖传习俗”。
  naturalness: “遵照那些习俗生活”在现代汉语中搭配略显生硬；“也不要遵守祖传习俗”更自然、庄重，且准确表达περιπατεῖν的生活行为含义。“被告知”虽略正式，适合本段耶路撒冷长老向保罗说明传言的语境。
  terminology: “背弃摩西”恰当地保留原文措辞和指控力度，不应在正文直接释作“背弃摩西律法”。“外族人”可理解，但“列国中”更直接对应κατὰ τὰ ἔθνη，也避免把ἔθνη仅限于与犹太人相对的个体“外族人”。“祖传习俗”准确体现ἔθεσιν在本处的犹太传统实践语境。
