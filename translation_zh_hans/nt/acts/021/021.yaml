  text: κατηχήθησαν δὲ περὶ σοῦ ὅτι ἀποστασίαν διδάσκεις ἀπὸ Μωϋσέως τοὺς κατὰ τὰ ἔθνη πάντας Ἰουδαίους, λέγων μὴ περιτέμνειν αὐτοὺς τὰ τέκνα μηδὲ τοῖς ἔθεσιν περιπατεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/021.yaml
  text: But they have been informed about you that you are teaching all the Jews among the Gentiles to forsake Moses[c][b][a], telling them not to circumcise their children nor to walk according to the customs.
translation:
  language: zh_hans
  text: 可是，他们已经听人说，你教导所有住在列国中的犹太人背弃摩西[a][b]，叫他们不要给自己的孩子行割礼，也不要遵守祖传习俗[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“教导人叛离摩西。”原文使用名词ἀποστασία，意为背离、离弃。
    reason: lexical_alternative
  - marker: b
    text: 这里的“摩西”代指摩西律法以及犹太人祖传的生活规范。
    reason: cultural_note
  - marker: c
    text: 或译：“也不要照着祖传习俗行事。”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατηχήθησαν
  choice: 他们听说
  rationale: 这里的被动式表示众人从口头传述中得知有关保罗的消息；“听说”符合现代汉语表达，也不暗示消息已经证实。
- source_word: ἀποστασίαν ... ἀπὸ Μωϋσέως
  choice: 背弃摩西
  rationale: ἀποστασία表示离弃、背离；“背弃摩西”自然传达指控的力度，同时保留“摩西”这一转喻，不在正文中直接扩写为“摩西律法”。
- source_word: τοὺς κατὰ τὰ ἔθνη πάντας Ἰουδαίους
  choice: 所有住在外族人中间的犹太人
  rationale: 明确表达散居于各民族之中的犹太人；“外族人”在此兼顾ἔθνη的族群含义和犹太语境。
- source_word: λέγων
  choice: 叫他们
  rationale: 该分词引出被指控的教导内容；“叫他们”简洁自然，并清楚指向前述犹太人。
- source_word: μὴ περιτέμνειν αὐτοὺς τὰ τέκνα
  choice: 不要给自己的孩子行割礼
  rationale: 保留τέκνα的“孩子”，不擅自缩窄为“儿子”；“自己的”传达αὐτούς在此与孩子构成的所属关系。
- source_word: μηδὲ τοῖς ἔθεσιν περιπατεῖν
  choice: 也不要遵照那些习俗生活
  rationale: περιπατεῖν在此指生活行事；译为“生活”比直译“行走”更符合现代普通话，同时“遵照”表达与习俗相符而行。
theological_decisions:
- issue: 关于保罗与摩西律法关系的指控性质
  choice: 把本句译成别人所传述的指控：“教导……背弃摩西”。
  alternative: 译作“教导人叛离摩西”或扩写为“离弃摩西律法”。
  rationale: 经文是在报告别人对保罗的说法，并未在本节判定指控真假。正文保留指控的力度和“摩西”的转喻，不把它改写成译者的教义结论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“可是”承接上文并体现δέ的转折；“听说”保持传闻性质；正文不使用较生硬的“叛教”，以免把一般性的背离误读为后世技术性神学术语。所有脚注标记均置于相关正文之后。
