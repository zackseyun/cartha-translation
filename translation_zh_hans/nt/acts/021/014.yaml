  text: μὴ πειθομένου δὲ αὐτοῦ ἡσυχάσαμεν εἰπόντες· ⸂Τοῦ κυρίου τὸ θέλημα⸃ ⸀γινέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/014.yaml
  text: And since he would not be persuaded[a], we became quiet, saying, “The Lord’s will be done.”
translation:
  language: zh_hans
  text: 他既不肯听劝，我们便不再劝他，说：“愿主的旨意成就。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ πειθομένου δὲ αὐτοῦ
  choice: 他既不肯听劝
  rationale: 这是属格独立结构；在上下文中，πειθομένου表示保罗不接受众人的劝阻。“不肯听劝”自然表达持续劝说未能使他改变决定，也保留其主动不让步的语境含义。
- source_word: ἡσυχάσαμεν
  choice: 我们便不再说了
  rationale: 此处指众人停止劝阻、安静下来。这样既表达不定过去时所指的停止动作，也比直译“安静了”更符合现代汉语语境。
- source_word: εἰπόντες
  choice: 只说
  rationale: 分词与主句紧密相连，说明他们停止劝阻时所说的话；“只说”自然体现不再争劝、转而顺服的语气。
- source_word: Τοῦ κυρίου
  choice: 主的
  rationale: κύριος按通常圣经用语译为“主”；不在正文中进一步明确所指，从而保留希腊文的表达范围。
- source_word: τὸ θέλημα
  choice: 旨意
  rationale: θέλημα在此指主所意欲、所定意的事。“旨意”是现代中文圣经语境中自然、庄重且易懂的表达。
- source_word: γινέσθω
  choice: 愿……成就
  rationale: 现在时命令式在这一祈愿式表达中表示顺服并盼望主的旨意得以实现。“愿……成就”保留祈愿语气，比单纯“发生”更贴合原文功能。
theological_decisions:
- issue: κύριος的译法与所指
  choice: 主
  alternative: 主人
  rationale: “主”是κύριος在此类叙事和信仰表达中的常规对应。上下文很可能指主耶稣，但原文没有在本节明说，因此译文不增添“耶稣”。
- issue: “愿主的旨意成就”的语气
  choice: 保留祈愿与顺服兼具的表达
  alternative: 主的旨意必会成就
  rationale: γινέσθω是命令式，用于第三人称祈愿，并非直陈预言；译为“愿……成就”保留众人顺服主旨意的神学张力，而不改成确定性陈述。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不再说了”按语境表达停止劝阻；全句避免过度古雅，也不额外明确“主”的具体所指。
