source:
  edition: SBLGNT
  text: ⸂τότε ἀπεκρίθη⸃ ὁ Παῦλος· Τί ποιεῖτε κλαίοντες καὶ συνθρύπτοντές μου τὴν καρδίαν; ἐγὼ γὰρ οὐ μόνον δεθῆναι ἀλλὰ καὶ ἀποθανεῖν εἰς Ἰερουσαλὴμ ἑτοίμως ἔχω ὑπὲρ τοῦ ὀνόματος τοῦ κυρίου Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/013.yaml
  text: Then Paul answered[a], “What are you doing[b], weeping and breaking my heart? For I am ready not only to be bound but even to die in Jerusalem for the name of the Lord Jesus.”
translation:
  language: zh_hans
  text: 于是保罗回答说：“你们哭着，使我的心碎了[a]，这是什么意思呢？为了主耶稣的名[b]，我已经准备好，不但在耶路撒冷被捆绑，甚至死在那里。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使我的心碎了”所译的希腊语动词有压碎、击碎的意味，比一般的伤心更强烈。
    reason: lexical_alternative
  - marker: b
    text: “主耶稣的名”是圣经中的惯用表达，可指主耶稣本人、他的权柄，以及与他相连的使命。
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε ἀπεκρίθη ὁ Παῦλος
  choice: 于是保罗回答说
  rationale: 以自然的现代汉语叙事句式表达时间推进和答话动作；“于是”对应 τότε，“回答说”准确传达 ἀπεκρίθη。
- source_word: Τί ποιεῖτε κλαίοντες
  choice: 你们为什么这样哭
  rationale: 希腊语直译近于“你们哭着，这是在做什么？”这里采用汉语自然的责问方式，保留保罗带着感情的劝止语气。
- source_word: συνθρύπτοντές μου τὴν καρδίαν
  choice: 叫我的心都碎了
  rationale: 保留“心被击碎”的比喻，并以现代汉语常用表达传达该动词强烈的内在痛苦。
- source_word: δεθῆναι
  choice: 被捆绑
  rationale: 直接表达 δέω 的被动含义，不扩大解释为“被监禁”。
- source_word: εἰς Ἰερουσαλήμ
  choice: 在耶路撒冷……在那里
  rationale: 按语境表达保罗准备在耶路撒冷遭遇捆绑和死亡；汉语用地点结构比直译方向介词更自然。
- source_word: ἑτοίμως ἔχω
  choice: 准备
  rationale: 该习语表示已经处于预备好的状态；结合“不但……甚至也……”译得简洁自然。
- source_word: ὑπὲρ τοῦ ὀνόματος
  choice: 为了……的名
  rationale: 既表达 ὑπέρ 的缘故、目的含义，也保留圣经中“名”所承载的身份与权柄意涵。
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: 主耶稣
  rationale: κύριος 在这里是对耶稣的称号，译作“主”准确、庄重，也符合现代中文基督教通用表达。
theological_decisions:
- issue: κύριος 用于耶稣时的译法
  choice: 主耶稣
  alternative: 耶稣主人
  rationale: “主”保留这一基督论称号的庄重与神学分量；“主人”在现代汉语中会造成不恰当的人际或所有权联想。
- issue: 是否保留“主耶稣的名”这一表达
  choice: 为了主耶稣的名
  alternative: 为了主耶稣／为了主耶稣的事业
  rationale: 原文明确使用“名”这一圣经惯用语，可指向耶稣本人、他的权柄以及与他相连的使命；正文不将其缩窄为单一解释。
- issue: 保罗所预备承受之事的范围
  choice: 不但准备被捆绑，甚至也准备死
  alternative: 准备殉道
  rationale: 原文明说捆绑和死亡，却没有在本句中使用“殉道”的专门术语；直译具体内容可避免加入超出本句的神学标签。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你们为什么这样哭”自然呈现责问和劝止的语气；“叫我的心都碎了”保留原文强烈的情感比喻；后半句用“不但……甚至也……”清楚表现递进，并保留“主耶稣的名”这一具有神学分量的圣经表达。
