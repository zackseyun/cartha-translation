  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὡς δὲ ἠκούσαμεν ταῦτα, παρεκαλοῦμεν ἡμεῖς τε καὶ οἱ ἐντόπιοι τοῦ μὴ ἀναβαίνειν αὐτὸν εἰς Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/012.yaml
  text: When we heard these things[a], we and the local people urged him not to go up to Jerusalem.
translation:
  language: zh_hans
  text: 我们听见这些事，就和当地人一起劝他[a]不要上耶路撒冷去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “劝”也可译作“恳求”；原文动词在这里也可含有恳切央求的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἠκούσαμεν ταῦτα
  choice: 我们听见这些事，就
  rationale: ὡς引出时间情境，δέ轻微推进叙事；“就”使现代汉语衔接自然。ταῦτα保留复数所指，回指前述预言的内容。
- source_word: παρεκαλοῦμεν
  choice: 劝
  rationale: παρακαλέω在此表示劝说、敦促，也可能带有恳切请求的语气。“劝”正文自然且不过度强化情绪，其他语气可能性收入脚注。未完成时在这里描写当时持续进行的劝说，但汉语无须机械加上“一再”。
- source_word: ἡμεῖς τε καὶ οἱ ἐντόπιοι
  choice: 我们……和当地人一起
  rationale: 保留叙述者一行与当地居民共同劝说这两个群体；“当地人”是现代汉语中清楚自然的表达。
- source_word: τοῦ μὴ ἀναβαίνειν αὐτὸν
  choice: 劝他不要上……去
  rationale: 属格冠词不定式说明劝说的内容；μή表达否定，αὐτόν指保罗。“不要上……去”在汉语中自然，并保留ἀναβαίνω的方向含义。
- source_word: εἰς Ἰερουσαλήμ
  choice: 耶路撒冷
  rationale: 按通行现代汉语专名译法处理；与“上……去”合用，表达前往耶路撒冷这一目的地。
theological_decisions:
- issue: 前往耶路撒冷的方向性用语
  choice: 上耶路撒冷去
  alternative: 到耶路撒冷去
  rationale: 原文使用ἀναβαίνειν（上去），是前往耶路撒冷的惯用方向表达。保留“上”较贴近原文，也不额外赋予神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“当地人一起”清楚区分并联合两个劝说群体；“上耶路撒冷去”既符合汉语表达，也保留原文的方向性惯用语。
