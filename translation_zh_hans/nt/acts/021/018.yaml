  text: τῇ δὲ ἐπιούσῃ εἰσῄει ὁ Παῦλος σὺν ἡμῖν πρὸς Ἰάκωβον, πάντες τε παρεγένοντο οἱ πρεσβύτεροι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/018.yaml
  text: On the next day[a], Paul went in with us to James[b], and all the elders were present.
translation:
  language: zh_hans
  text: 第二天，保罗同我们一起进去见雅各；众长老都到了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“众长老都在场。”原文动词既可着重表示他们来到，也可表示他们在场。
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ δὲ ἐπιούσῃ
  choice: 第二天
  rationale: 这是表示次日的惯用时间表达；“第二天”自然、准确，也无需把连接词 δέ 生硬译出。
- source_word: εἰσῄει
  choice: 去见
  rationale: 该动词表示向内进入；与 πρὸς Ἰάκωβον 连用时，现代汉语用“去见雅各”最自然，同时不添加地点等原文未说明的信息。
- source_word: σὺν ἡμῖν
  choice: 和我们一同
  rationale: 准确表达 σύν 加与格所表示的陪同关系。
- source_word: πρὸς Ἰάκωβον
  choice: 见雅各
  rationale: πρός 加宾格表示朝向某人；结合 εἰσῄει，译为“去见雅各”符合汉语习惯，不在正文增添雅各的身份说明。
- source_word: πάντες τε
  choice: 也都
  rationale: τέ 在此温和地连接后句；“也”自然承接前一行动，“都”对应 πάντες。
- source_word: παρεγένοντο
  choice: 到了
  rationale: παραγίνομαι 可着重表示到达，也可表示在场；正文采用自然的“到了”，并以脚注保留“都在场”的可能。
- source_word: οἱ πρεσβύτεροι
  choice: 众长老
  rationale: “长老”是教会语境中透明且通行的对应词；“众”与后面的“都”共同自然表达 πάντες，而不引入后世宗派职制名称。
theological_decisions:
- issue: Ἰάκωβον 的身份
  choice: 仅译作“雅各”
  alternative: “主的兄弟雅各”或“耶路撒冷教会的领袖雅各”
  rationale: 本节只记人名，并未附加身份；正文不补入上下文虽可推知、但此处未明说的信息。
- issue: οἱ πρεσβύτεροι 的教会职分含义
  choice: 译作“众长老”
  alternative: “众司祭”或“众教会领袖”
  rationale: “长老”保留原词在初期教会中的职分含义，又不把后世特定宗派制度带入经文。
- issue: παρεγένοντο 的动作与状态含义
  choice: 正文译作“到了”，脚注保留“都在场”
  alternative: 正文译作“都在场”
  rationale: 该动词可表示来到、到达，也可表示在场；两种理解在此都成立，故不应默默消除其词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“去见雅各”符合普通话表达；分号清楚呈现两个相连的叙事分句。脚注标记置于正文对应句末。
