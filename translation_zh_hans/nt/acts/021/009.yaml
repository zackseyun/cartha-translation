base_translation:
  language: en
  yaml_path: translation/nt/acts/021/009.yaml
  text: He had four unmarried daughters who were prophesying.
translation:
  language: zh_hans
  text: 他有四个未婚的女儿[a]，都说预言。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文较直译作：“四个童女”（即处女）。
    reason: 保留παρθένοι较直接的“童女／处女”义，并说明正文“未婚的”所采用的是其常见的社会身份含义。
lexical_decisions:
- source_word: τούτῳ
  choice: 他
  rationale: 与格单数指向上文的腓利；结合存在句ἦσαν，现代汉语自然表达为“他有”。
- source_word: δὲ
  choice: 不另译
  rationale: 此处是轻微的承接语气，汉语可由句间衔接自然体现。
- source_word: ἦσαν
  choice: 有
  rationale: τούτῳ…ἦσαν θυγατέρες是与格领属结构，现代汉语宜译作“他有……女儿”。
- source_word: θυγατέρες
  choice: 女儿
  rationale: 准确表达标准的亲属称谓。
- source_word: τέσσαρες
  choice: 四个
  rationale: 基数词，直接限定“女儿”。
- source_word: παρθένοι
  choice: 未婚的
  rationale: 该词可指童女或处女，也常包含未婚女子的社会身份；正文用“未婚的”较自然，较直译的“处女”收入脚注以保留词义信息。
- source_word: προφητεύουσαι
  choice: 都说预言
  rationale: 现在主动分词、阴性复数，修饰四个女儿，表示她们从事说预言的活动；“都”清楚表明该分词涉及四人。
theological_decisions:
- issue: παρθένοι在女性说预言语境中的译法
  choice: 未婚的
  alternative: 处女
  rationale: 经文同时陈述她们的身份状况和说预言的活动，却没有说明二者之间的神学关系。“未婚的”不把后世对守贞的评价带入正文；脚注保留较直译的“处女”。
- issue: προφητεύουσαι所表达的活动
  choice: 说预言
  alternative: 作先知
  rationale: 分词描述她们正在或惯常进行的活动，并未在此明确授予制度化称号；译作“说预言”保留这一语法重点。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“说预言”比“讲预言”更符合常见圣经语域，同时避免把分词直接名词化为“女先知”。
