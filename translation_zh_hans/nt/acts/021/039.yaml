base_translation:
  language: en
  yaml_path: translation/nt/acts/021/039.yaml
  text: But Paul said[a], “I am indeed a Jewish man, a citizen of Tarsus in Cilicia, of no insignificant city. And I beg you, permit me to speak to the people.”
translation:
  language: zh_hans
  text: 保罗说：“我是犹太人，是基利家的大数人，也是一座并非无名之城的公民。我求你准许我向百姓说话。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄνθρωπος μέν εἰμι Ἰουδαῖος
  choice: 我是犹太人
  rationale: 现代汉语以“我是犹太人”自然表达身份；不机械译出ἄνθρωπος为“男人”，而μέν的强调由上下文和判断句体现。
- source_word: Ταρσεὺς τῆς Κιλικίας
  choice: 生在基利家的大数
  rationale: Ταρσεύς表示大数人；结合后面的πολίτης，先交代其出身地，再明确公民身份，符合汉语表达。
- source_word: οὐκ ἀσήμου πόλεως
  choice: 这座颇有名望之城
  rationale: 希腊文以曲言法表达“大数并非无名小城”；汉语直译“不是无名的城”略显生硬，因此用“颇有名望”保留克制而肯定的语气。
- source_word: πολίτης
  choice: 公民
  rationale: 准确表达城邦或城市公民身份，不弱化为普通居民。
- source_word: δέομαι δέ σου
  choice: 求你
  rationale: 体现恳切请求，同时符合保罗对罗马军官说话的庄重语境。
- source_word: ἐπίτρεψόν μοι λαλῆσαι
  choice: 准许我……讲话
  rationale: “准许”体现请求授权的正式语气；“讲话”适合面向公众发言的场景。
- source_word: πρὸς τὸν λαόν
  choice: 对百姓
  rationale: λαός直指民众；在使徒行传的犹太语境中，“百姓”比“人群”更能保留其群体含义。
theological_decisions:
- issue: Ἰουδαῖος的身份含义
  choice: 犹太人
  alternative: 犹太地人
  rationale: 保罗随即说明自己来自基利家的大数，因此这里是在表明犹太民族与宗教群体身份，并非声称来自犹太地区。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事语言。“生在基利家的大数”与后文“公民”共同呈现原文的大数人及城市公民身份；整体避免古奥措辞。
