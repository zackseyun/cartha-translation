  yaml_path: translation/nt/acts/021/022.yaml
  text: What then is to be done? They will certainly hear that you have come[a].
translation:
  language: zh_hans
  text: 那么，该怎么办呢？他们一定会听说你来了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“那么，这是什么呢？”这个希腊语表达在此是问：面对当前情况，该怎么办。
    reason: lexical_alternative
lexical_decisions:
- source_word: τί οὖν ἐστιν;
  choice: 那么，该怎么办呢？
  rationale: 原文直译近于“那么，这是什么呢？”，但此处是针对当前局面询问下一步应如何处理。译作“该怎么办呢”自然表达其语用功能，同时以脚注保留字面形式。
- source_word: πάντως
  choice: 一定
  rationale: 此处副词强调接下来之事必然发生；“一定”在现代汉语中自然、明确。
- source_word: ἀκούσονται
  choice: 他们……会听说
  rationale: 该将来时形式在这里具有主动意义。主语在希腊文中省略，须由上下文补出“他们”；就保罗到来的消息而言，汉语用“听说”比单说“听见”更自然。
- source_word: ὅτι
  choice: （引出“你来了”这一消息内容）
  rationale: 此词引出所听说的内容，并非表示原因，因此不译作“因为”。
- source_word: ἐλήλυθας
  choice: 你来了
  rationale: 希腊文完成时强调保罗已经来到、如今在场的结果状态。汉语“来了”简洁自然，也能传达已经到达并在此的含义。
theological_decisions: []
