base_translation:
  language: en
  yaml_path: translation/nt/acts/021/016.yaml
  text: And some of the disciples from Caesarea also went with us, bringing us to Mnason, a certain Cypriot, an early disciple, with whom we were to stay.
translation:
  language: zh_hans
  text: 一些从凯撒利亚来的门徒也和我们同行，领我们到一位名叫拿孙的塞浦路斯人那里住宿[a]；他是一位早期的门徒[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“领我们到拿孙那里……好让我们住宿”，也可能理解为“带我们到拿孙家里”。希腊文分词和表示接待住宿的动词容许这些意思相近的译法。
    reason: lexical_alternative
  - marker: b
    text: 或译：“一位作门徒已久的人”。这句话可能是说拿孙作门徒已有很长时间，或许从较早的时候起就作门徒。
    reason: lexical_alternative
lexical_decisions:
- source_word: συνῆλθον δὲ καὶ τῶν μαθητῶν
  choice: 还有一些门徒也……同行
  rationale: καί与属格复数τῶν μαθητῶν在此表达其中一部分人也加入同行；“同行”自然传达συνέρχομαι与σὺν ἡμῖν共同构成的陪伴行程之意。
- source_word: ἀπὸ Καισαρείας
  choice: 从凯撒利亚来的
  rationale: 明确这些门徒来自凯撒利亚，也符合现代汉语修饰语的自然位置。
- source_word: ἄγοντες
  choice: 带我们到
  rationale: 该分词说明这些门徒同行时所起的作用，即引领或带领叙述者一行前往住宿之处。
- source_word: παρ’ ᾧ ξενισθῶμεν
  choice: 到……那里住宿
  rationale: ξενίζω在此指作客、得到接待住宿；目的性虚拟式表示预定或打算住宿，汉语以“到……那里住宿”简洁表达。
- source_word: Μνάσωνί τινι Κυπρίῳ
  choice: 塞浦路斯人拿孙
  rationale: τινι用来引入此前未提及的人物；现代汉语通常不必生硬译作“某一个”。“塞浦路斯人”准确表达Κυπρίῳ。
- source_word: ἀρχαίῳ μαθητῇ
  choice: 一位早期的门徒
  rationale: 保留ἀρχαῖος的时间含义，同时不进一步断言拿孙必定属于最初一批门徒。
theological_decisions:
- issue: ἀρχαίῳ μαθητῇ的时间含义
  choice: 一位早期的门徒
  alternative: 一位作门徒已久的人
  rationale: 原语既可侧重他来自运动早期，也可侧重其门徒资历长久；正文采用简洁的“早期的门徒”，脚注保留另一种理解，避免过度确定其具体历史身份。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“同行”“住宿”简明自然；人名依常见中文圣经译名作“拿孙”，地名作“凯撒利亚”。正文重组希腊语较紧凑的句法，以分号清楚连接人物身份说明，同时保留两处真实语义弹性于脚注。
