  text: καὶ ἀσπασάμενος αὐτοὺς ἐξηγεῖτο καθ’ ἓν ἕκαστον ὧν ἐποίησεν ὁ θεὸς ἐν τοῖς ἔθνεσιν διὰ τῆς διακονίας αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/019.yaml
  text: And after greeting them[b][a], he began to relate one by one the things that God had done among the Gentiles through his ministry.
translation:
  language: zh_hans
  text: 保罗问候了他们，就逐一[b]讲述上帝借着他的服事在外邦人[a]中所做的事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “外邦人”也可译作“列邦”；这里指非犹太人。
    reason: lexical_alternative
  - marker: b
    text: “逐一讲述”也可译作“详细说明”或“逐项述说”。希腊文动词表示持续展开的讲述；“逐一”对应其后“一项一项”的表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπασάμενος
  choice: 问候了他们，就
  rationale: 不定过去时分词表示先于主要动作发生的问候；用“……了，就……”自然地保留动作次序。
- source_word: ἐξηγεῖτο
  choice: 详细讲述出来
  rationale: 该未完成时动词表示持续展开的叙述；结合下文逐项陈说的短语，“详细讲述”兼顾“讲述、说明”的语义及过程性。
- source_word: καθ’ ἓν ἕκαστον
  choice: 一件一件地
  rationale: 保留该短语逐项、逐一陈述的分配含义，且符合现代汉语习惯。
- source_word: ὧν ἐποίησεν ὁ θεὸς
  choice: 上帝……所做的事
  rationale: 明确以上帝为行动主体，并把关系结构自然译成汉语“所”字结构。
- source_word: ἐν τοῖς ἔθνεσιν
  choice: 在外族人中
  rationale: 此处指犹太人以外的各族人；“外族人”比地缘政治意义的“列国”更符合上下文，同时保留相对于犹太群体的含义。
- source_word: διὰ τῆς διακονίας αὐτοῦ
  choice: 借着他的服事
  rationale: διά加属格表达途径或媒介；“服事”既能涵盖保罗的使徒工作，也不把原词过度限定为制度化职分。
theological_decisions:
- issue: 保罗宣教报告中的行动主体
  choice: 上帝是施行这些事的主体，保罗的服事是上帝工作的途径。
  alternative: 把这些成果表述为保罗自己在外族人中所成就的事。
  rationale: ὁ θεὸς是ἐποίησεν的明确主语，而διὰ τῆς διακονίας αὐτοῦ表明保罗的服事是媒介；译文同时保留神的主动作为与人的参与。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“一件一件地详细讲述出来”略有语义强化，但分别承载καθ’ ἓν ἕκαστον的逐项含义和ἐξηγεῖτο的持续、详述色彩。脚注标记置于相关句末，正文中均有对应标记。
