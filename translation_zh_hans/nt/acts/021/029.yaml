  text: ἦσαν γὰρ ⸀προεωρακότες Τρόφιμον τὸν Ἐφέσιον ἐν τῇ πόλει σὺν αὐτῷ, ὃν ἐνόμιζον ὅτι εἰς τὸ ἱερὸν εἰσήγαγεν ὁ Παῦλος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/029.yaml
  text: For they had previously seen Trophimus the Ephesian in the city with him[a], and they supposed that Paul had brought him into the temple.
translation:
  language: zh_hans
  text: 因为他们先前看见以弗所人特罗非摩和保罗一起在城里，就以为保罗把他带进了圣殿[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里译作“圣殿”的希腊词，可以指整个圣殿建筑群或院区，不一定只指里面的圣所。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν … προεωρακότες
  choice: 先前看见
  rationale: 周说结构表达相对于后续判断更早发生的动作；“先前看见”自然传达这一时间关系。
- source_word: Τρόφιμον τὸν Ἐφέσιον
  choice: 以弗所人特罗非摩
  rationale: 保留同位语所表达的籍贯身份，同时符合现代汉语人名表达习惯。
- source_word: ἐν τῇ πόλει
  choice: 在城里
  rationale: 这里指耶路撒冷城中，与圣殿区域相区别；“在城里”简洁自然。
- source_word: σὺν αὐτῷ
  choice: 和保罗一起
  rationale: 希腊文直译为“和他一起”，所指在上下文中是保罗；汉语明说“保罗”可避免连续代词造成歧义，不改变原意。
- source_word: ἐνόμιζον
  choice: 以为
  rationale: 表示根据所见作出的推断，并非确知；“以为”准确而自然地保留这种误判意味。
- source_word: εἰς τὸ ἱερὸν
  choice: 进了圣殿
  rationale: 主文采用通行、易懂的“圣殿”；ἱερόν可指整个圣殿建筑群或其院区，具体范围在脚注说明。
- source_word: εἰσήγαγεν
  choice: 把他带进了
  rationale: 准确表达领人进入某处的动作；“了”在“以为”所引出的从句中自然呈现该动作被认为已经发生。
theological_decisions:
- issue: ἱερόν在对保罗指控中的范围
  choice: 主文译作“圣殿”，脚注说明可指圣殿建筑群或院区
  alternative: 圣殿院区；圣殿范围
  rationale: ἱερόν并非专指内殿的ναός。保留通顺的传统称呼，同时说明其较广的空间含义，有助于准确理解针对外族人进入禁区的指控，而不把范围误限于内殿。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“因为……就……”保留γάρ的解释作用，并清楚呈现众人由先前所见而作出推断的逻辑。为避免汉语代词指向含混，将σὺν αὐτῷ按上下文明示为“和保罗一起”。
