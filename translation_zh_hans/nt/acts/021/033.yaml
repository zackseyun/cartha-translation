base_translation:
  language: en
  yaml_path: translation/nt/acts/021/033.yaml
  text: Then the commander came up[a], seized him, and ordered him to be bound with two chains[b], and was asking who he was and what he had done.
translation:
  language: zh_hans
  text: 于是，千夫长[a]走上前来，抓住保罗，下令用两条锁链把他捆起来[b]，又询问他是谁，做了什么事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “千夫长”指罗马军队中的高级军官；该词字面意思是“统领一千人的人”。
    reason: lexical_alternative
  - marker: b
    text: “两条锁链”可能呼应使徒行传21:11中关于保罗将在耶路撒冷被捆绑的预言。
    reason: cross_reference
lexical_decisions:
- source_word: χιλίαρχος
  choice: 千夫长
  rationale: 这是罗马军队中统领一支大队的军官称谓；“千夫长”是中文圣经语境中通行而简洁的对应，脚注补充其实际职衔含义。
- source_word: ἐγγίσας
  choice: 走上前来
  rationale: 分词表示先靠近、继而采取行动；此译法自然呈现叙事中的移动。
- source_word: ἐπελάβετο αὐτοῦ
  choice: 拿住保罗
  rationale: 此处指实际抓住并控制保罗；“拿住”既体现强制性，也符合现代叙事用语。为避免中文代词指向不清，明示“保罗”。
- source_word: ἐκέλευσε δεθῆναι
  choice: 命人……捆绑他
  rationale: 保留军官发令以及保罗被捆绑的被动含义，同时采用自然中文句式。
- source_word: ἁλύσεσι δυσί
  choice: 用两条锁链
  rationale: 直译数量和拘押器具，不在正文中解释其与前文预言的可能呼应。
- source_word: ἐπυνθάνετο
  choice: 询问
  rationale: 未完成时表示当时正在进行的查问；中文“并询问”在叙事中自然表达这一过程，无须机械加入“不断”。
- source_word: τίς εἴη
  choice: 他是谁
  rationale: 过去时动词后的间接问句；现代汉语无需另行标示希腊语间接问句中的愿望式。
- source_word: τί ἐστιν πεποιηκώς
  choice: 做了什么事
  rationale: 周说式完成结构指已经做成且与当前局面相关的事；“做了什么事”保留完成意味并符合自然汉语。
theological_decisions:
- issue: “两条锁链”与使徒行传21:11预言的关系
  choice: 正文只译作“两条锁链”，脚注说明可能的呼应
  alternative: 在正文中明确说这是预言的应验
  rationale: 原文没有明说此处旨在标示预言应验，因此保留可能联系而不将其确定化。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。用“保罗”替代第一个可能含混的“他”，使中文指代清楚；保留叙事动作顺序及原文对查问内容的开放表达。
