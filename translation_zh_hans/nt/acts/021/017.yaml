  yaml_path: translation/nt/acts/021/017.yaml
  text: When we arrived in Jerusalem[a], the brothers welcomed us gladly.
translation:
  language: zh_hans
  text: 我们到了耶路撒冷，弟兄们[a]欣然接待了我们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“弟兄姊妹”；希腊文直译为“弟兄们”，也可泛指信徒群体。
    reason: 词义范围及性别包容性说明
lexical_decisions:
- source_word: Γενομένων δὲ ἡμῶν εἰς Ἱεροσόλυμα
  choice: 我们到了耶路撒冷
  rationale: 该独立属格结构在这里交代抵达的时间和情境；译作“我们到了”既符合现代汉语，也保留了到达目的地的含义。δέ在此主要起叙事衔接作用，无须机械译出。
- source_word: ἀσμένως
  choice: 欣然
  rationale: 该副词表示乐意、欢喜地做某事；“欣然”简洁、庄重，并自然修饰“接待”。
- source_word: ἀπεδέξαντο
  choice: 接待了
  rationale: 此处指友善地迎接并接纳来访者；“接待”比泛泛的“接受”更准确地表达待客语境。
- source_word: οἱ ἀδελφοί
  choice: 弟兄们
  rationale: 保留希腊文阳性复数亲属称谓在早期基督徒群体中的惯用表达；该词在此也可能泛指包括女性在内的众信徒，因此以脚注说明其包容性用法。
theological_decisions:
- issue: 耶路撒冷基督徒群体中ἀδελφοί的性别范围
  choice: 弟兄们
  alternative: 弟兄姊妹；信徒们
  rationale: 正文保留原文的阳性复数形式及其群体代表性，不将其直接中性化；同时，早期基督徒用语中的ἀδελφοί可能包括女性信徒，故在脚注中保留这一可能范围。
translation_notes:
  register: 采用现代、自然而庄重的叙事语体。“欣然接待”准确传达欢迎时的喜悦与乐意；句序贴合汉语表达，同时保留原文先抵达、后受接待的叙事推进。
