  text: ὃς ἐξαυτῆς παραλαβὼν στρατιώτας καὶ ἑκατοντάρχας κατέδραμεν ἐπ’ αὐτούς, οἱ δὲ ἰδόντες τὸν χιλίαρχον καὶ τοὺς στρατιώτας ἐπαύσαντο τύπτοντες τὸν Παῦλον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/032.yaml
  text: He immediately took soldiers and centurions and ran down to them[a], and when they saw the tribune and the soldiers, they stopped beating Paul.
translation:
  language: zh_hans
  text: 他立刻带着士兵和百夫长，赶忙跑下去，到他们那里；他们一看见千夫长[a]和士兵，就不再殴打保罗。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “千夫长”也可译作“军事护民官”或“指挥官”；希腊词 χιλίαρχος 在这里指一名罗马军官，通常统领一个步兵营（cohort）。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξαυτῆς
  choice: 立刻
  rationale: 表达行动毫不迟延，现代汉语自然简洁，也保留叙事的紧迫感。
- source_word: παραλαβὼν
  choice: 带着
  rationale: 该分词表示军官带领士兵和百夫长一同前往；“带着”比单说“带”更自然地体现随行。
- source_word: στρατιώτας
  choice: 士兵
  rationale: 准确表达普通军人的复数，较“军队”或“部队”具体。
- source_word: ἑκατοντάρχας
  choice: 百夫长
  rationale: 采用通行的罗马军职译名，并保留复数所指的多名军官。
- source_word: κατέδραμεν ἐπ’ αὐτούς
  choice: 跑下去到人群那里
  rationale: 既保留动词所表达的迅速奔跑，也体现从营楼一带向下移动；将代词按语境译作“人群”，避免汉语中指代不清，同时不强化敌意。
- source_word: χιλίαρχον
  choice: 千夫长
  rationale: 这是中文圣经语境中清楚而简洁的罗马军职称谓；脚注说明其实际职能，以免读者按字面误解。
- source_word: ἐπαύσαντο
  choice: 停止
  rationale: 自然表达动作中止，符合现代标准汉语。
- source_word: τύπτοντες
  choice: 殴打
  rationale: 该现在分词表示持续、反复击打；“殴打”比“打”更明确地传达暴力行为。
