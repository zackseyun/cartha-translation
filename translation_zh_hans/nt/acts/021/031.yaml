  rationale: 修订以“正设法”保留ζητούντων的持续企图，以“该营的指挥官”自然表达χιλίαρχος τῆς σπείρης，并把具体罗马军制置于脚注。将“骚乱起来了”改为“陷入了混乱”，更完整保留συγχύννεται的扰乱／混乱语义，避免无根据地强化为全城暴动或强调起始。
