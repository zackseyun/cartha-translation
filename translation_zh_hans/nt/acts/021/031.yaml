  text: ζητούντων ⸀τε αὐτὸν ἀποκτεῖναι ἀνέβη φάσις τῷ χιλιάρχῳ τῆς σπείρης ὅτι ὅλη ⸀συγχύννεται Ἰερουσαλήμ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/031.yaml
  text: And as they were seeking to kill him[b][a], a report went up to the commander of the cohort that all Jerusalem was in an uproar.
translation:
  language: zh_hans
  text: 众人正设法杀保罗的时候，有消息传到该营的指挥官[a]那里，说整个耶路撒冷都陷入了混乱[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “该营的指挥官”所译的词指罗马军中的一名保民官，负责指挥一队罗马军（cohort）。
    reason: cultural_note
  - marker: b
    text: “陷入了混乱”也可译作“陷入动荡”或“处于骚乱之中”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητούντων τε αὐτὸν ἀποκτεῖναι
  choice: 众人正想杀保罗的时候
  rationale: 属格独立结构和现在时分词表示与主句同时进行的行动。“正想杀”自然表达持续企图；按上下文明确代词所指为保罗，避免中文孤立经文中的指代含混。
- source_word: ἀνέβη φάσις
  choice: 有消息传到
  rationale: 希腊文直译为“消息上去”，可能隐含消息传往地势较高的营楼；中文用“传到”自然表达消息抵达，同时不把隐含地点写入正文。
- source_word: τῷ χιλιάρχῳ τῆς σπείρης
  choice: 营队长
  rationale: χιλίαρχος在这里指统领σπεῖρα的罗马军官；“营队长”兼顾历史军制与现代可懂性，避免“千夫长”被误解为精确统领一千人。
- source_word: ὅτι ὅλη Ἰερουσαλήμ
  choice: 说整个耶路撒冷
  rationale: 保留以城市代居民的转喻和原文“整个”的强调，不扩写为“全城的人”。
- source_word: συγχύννεται
  choice: 都骚乱起来了
  rationale: 该动词可指陷入混乱、动荡；结合群众暴动的语境，“骚乱起来”自然传达全城受到扰乱的状态，并保留起事与混乱的语义范围。
theological_decisions: []
