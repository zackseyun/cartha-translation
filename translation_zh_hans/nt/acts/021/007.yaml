base_translation:
  language: en
  yaml_path: translation/nt/acts/021/007.yaml
  text: We[a], having finished the voyage from Tyre, arrived at Ptolemais, and after greeting the brothers, we stayed with them one day.
translation:
  language: zh_hans
  text: 我们从推罗出发，走完这段航程，抵达多利买；问候弟兄们[a]后，在他们那里住了一天。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“弟兄姊妹”；希腊文直译为“弟兄们”，这个阳性复数也可泛指同为信徒的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡμεῖς δὲ
  choice: 我们
  rationale: 显明叙事主体；δέ在这里承接行程，中文不必生硬译出“但”或“于是”。
- source_word: τὸν πλοῦν διανύσαντες ἀπὸ Τύρου
  choice: 从推罗完成航程
  rationale: διανύω表示走完、完成，πλοῦς特指水路航程；保留分词所表达的先行动作。
- source_word: κατηντήσαμεν εἰς Πτολεμαΐδα
  choice: 抵达了多利买
  rationale: καταντάω在旅行语境中指到达目的地；“多利买”采用通行的中文圣经地名译法。
- source_word: ἀσπασάμενοι
  choice: 问候了……以后
  rationale: ἀσπάζομαι在此指见面问候；用“以后”自然表达不定过去分词相对于主句的先后关系。
- source_word: τοὺς ἀδελφοὺς
  choice: 弟兄们
  rationale: 保留希腊文阳性复数的形式及早期基督徒群体称谓；其所指可能包括女性，另以脚注说明。
- source_word: ἐμείναμεν ἡμέραν μίαν παρ’ αὐτοῖς
  choice: 就和他们住了一天
  rationale: μένω在旅行住宿语境中自然译作“住”；παρά加与格表示与他们同在，ἡμέραν μίαν表示时长一天。
theological_decisions:
- issue: 基督徒群体称谓ἀδελφοὺς的性别范围
  choice: 弟兄们
  alternative: 弟兄姊妹；信徒们
  rationale: 原文为阳性复数，但在早期基督徒用语中可能广指同属群体的信徒。正文保留原词的性别形式，脚注保留其可能较广的指称范围，不将其静默限定为只有男性，也不在正文中直接扩写。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“完成航程”较贴近原文，但仍符合现代汉语；分号呈现抵达与探访当地信徒两个相连的叙事步骤。
