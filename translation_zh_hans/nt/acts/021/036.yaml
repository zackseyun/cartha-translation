base_translation:
  language: en
  yaml_path: translation/nt/acts/021/036.yaml
  text: For the crowd of the people was following[a], shouting, “Take him away!”
translation:
  language: zh_hans
  text: 因为一大群百姓跟在后面，高喊着：“除掉他！”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把他带走！”
    reason: 原文命令语可表示将某人除去，也可理解为把他带离现场。
lexical_decisions:
- source_word: ἠκολούθει
  choice: 跟在后面
  rationale: 未完成时表示过去正在持续的动作；“跟在后面”在现代汉语中自然地传达群众一路尾随的情景。
- source_word: γὰρ
  choice: 因为
  rationale: 保留本节对上文所述情形的解释关系。
- source_word: τὸ πλῆθος τοῦ λαοῦ
  choice: 一大群百姓
  rationale: 既表达 πλῆθος 的群体和人数众多之意，也保留 τοῦ λαοῦ 较为中性的“百姓”，避免擅自译成带贬义的“暴民”。
- source_word: κράζοντες
  choice: 高喊着
  rationale: 以伴随状态表达众人跟随时持续发出的强烈喊声，措辞有力而不过分口语化。
- source_word: Αἶρε αὐτόν
  choice: 除掉他！
  rationale: 此处命令式不是单指把人举起，而是敌意地要求将他除去；“除掉他”保留其可指赶走、处置乃至杀死的语义张力。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“一大群百姓”保持中性，不预先把群众定性为“暴民”；引语则保留原文强烈而含有歧义的敌意。
