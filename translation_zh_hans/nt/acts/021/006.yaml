base_translation:
  language: en
  yaml_path: translation/nt/acts/021/006.yaml
  text: After we had said farewell to one another[a], we boarded the ship[b], and they returned to their own homes.
translation:
  language: zh_hans
  text: 我们彼此道别[a]后，就上了船；他们则回自己家去了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“彼此辞别”。这个希腊语表达既可指问候，也可指辞别；这里的启程语境更支持“道别”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“到自己的（事物／地方）”，是指回到自己家或自己所属之处的习语。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπησπασάμεθα ἀλλήλους
  choice: 我们彼此道别
  rationale: 该表达可指问候或辞别；这里处于启程离开的语境，因此译作“彼此道别”最自然，同时用脚注保留词义范围。
- source_word: ἐνέβημεν
  choice: 上了船
  rationale: 该动词在此表示登上船只；“上了船”是现代汉语中简洁自然的说法。
- source_word: πλοῖον
  choice: 船
  rationale: 该词可泛指船或较大的船只；现代汉语“船”不必过度限定船只大小，适合本处。
- source_word: ὑπέστρεψαν
  choice: 回……去了
  rationale: 该动词表示返回；“回自己家去了”自然呈现叙事中的反向行动。
- source_word: εἰς τὰ ἴδια
  choice: 回自己家去了
  rationale: 字面为“到自己的事物／地方”，是指回到自己所属之处的习语；依语境译作“自己家”清楚自然，并以脚注说明原文措辞。
