  text: τῇ δὲ ἐπαύριον ἐξελθόντες ⸀ἤλθομεν εἰς Καισάρειαν, καὶ εἰσελθόντες εἰς τὸν οἶκον Φιλίππου τοῦ εὐαγγελιστοῦ ὄντος ἐκ τῶν ἑπτὰ ἐμείναμεν παρ’ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/008.yaml
  text: On the next day we departed and came to Caesarea[a], and entering the house of Philip the evangelist, who was one of the seven, we stayed with him.
translation:
  language: zh_hans
  text: 第二天，我们离开，来到凯撒利亚。进了传福音者腓利的家，我们就住在他那里；腓利是那七个人中的一个。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 指先前在耶路撒冷被选立服事的七个人之一（见使徒行传6:3–6）。
    reason: cross_reference
lexical_decisions:
- source_word: τῇ δὲ ἐπαύριον
  choice: 第二天
  rationale: 以自然的现代汉语交代叙事时间顺序；上下文已足以体现δέ的承接作用，无须另译。
- source_word: ἐξελθόντες ἤλθομεν εἰς Καισάρειαν
  choice: 我们出发前往凯撒利亚
  rationale: 将先行分词与主要动词按汉语行程叙述习惯整合，既表达离开原地，也保留朝目的地行进并抵达的整体意义。
- source_word: Καισάρειαν
  choice: 凯撒利亚
  rationale: 采用现代中文圣经地名的通行音译；正文不添加“海滨”等原文没有的限定语。
- source_word: εἰσελθόντες εἰς τὸν οἶκον Φιλίππου
  choice: 我们进了……腓利的家
  rationale: 按动作先后自然表达；οἶκος在接待旅客的语境中译作“家”比“房屋”自然。
- source_word: Φιλίππου
  choice: 腓利
  rationale: 采用该新约人名的通行中文译名。
- source_word: τοῦ εὐαγγελιστοῦ
  choice: 传福音者
  rationale: 准确表达εὐαγγελιστής所指的传扬福音者，又避免使用现代汉语中可能显得过于制度化的职衔。
- source_word: ὄντος ἐκ τῶν ἑπτὰ
  choice: 他是那七个人中的一个
  rationale: 保留定冠词所指向的、读者已知的七人群体，并用“人”明确汉语所需的类别，不把该称谓解释成特定教会职分。
- source_word: ἐμείναμεν παρ’ αὐτῷ
  choice: 就住在他那里
  rationale: 在旅行与接待语境中，“住在他那里”自然传达与腓利同住、受其接待之意，不额外限定停留时长。
theological_decisions:
- issue: 腓利作为“那七个人中的一个”的身份
  choice: 保留历史性表述“他是那七个人中的一个”，并以脚注指向使徒行传6:3–6
  alternative: 将其明确译作“七位执事之一”或把“七人”作为正式职衔
  rationale: 原文只说腓利属于“那七人”，虽明显回指使徒行传第6章，却没有在本节称他们为某一正式职分；因此不引入后来的教会制度术语。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“传福音者”兼顾词义清晰和称谓性质；分号使腓利的身份补充不致打断主要行程叙述。
