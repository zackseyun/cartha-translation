base_translation:
  language: en
  yaml_path: translation/nt/acts/021/040.yaml
  text: 'And when he had given permission[a], Paul, standing on the steps, motioned with his hand to the people. And when a great silence had come, he addressed them in the Hebrew language, saying:'
translation:
  language: zh_hans
  text: 千夫长准许后，保罗站在台阶上，举手向百姓示意。一片寂静后，他用希伯来语[a]对他们说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“亚兰语”。希腊原文直译为“希伯来方言（或语言）”；在这里可能是指当时当地通行、通常称为亚兰语的闪族语言。
    reason: 保留τῇ Ἑβραΐδι διαλέκτῳ在字面称呼与语境所指之间的真实歧义。
lexical_decisions:
- source_word: ἐπιτρέψαντος δὲ αὐτοῦ
  choice: 千夫长准许后
  rationale: 这是独立属格结构，表达时间关系；代词所指是上文的千夫长。译出所指对象，使现代中文清楚自然。
- source_word: ἑστὼς ἐπὶ τῶν ἀναβαθμῶν
  choice: 站在台阶上
  rationale: 完成时分词在此描述保罗所处的位置；ἀναβαθμοί指通往营楼的台阶。
- source_word: κατέσεισε τῇ χειρὶ τῷ λαῷ
  choice: 向百姓摆手
  rationale: κατασείω表示用手示意，语境中意在使众人安静或引起注意；“摆手”简洁自然，同时保留动作本身。
- source_word: τῷ λαῷ
  choice: 百姓
  rationale: λαός的基本义为“人民、百姓”；这里指聚集的人群，但不必在正文中改译为解释性较强的“群众”。
- source_word: πολλῆς δὲ σιγῆς γενομένης
  choice: 众人完全安静下来后
  rationale: 第二个独立属格结构表示众人进入非常安静的状态；此译保留状态变化的意味，并符合现代汉语表达。
- source_word: προσεφώνησεν
  choice: 对他们说
  rationale: 该动词在这里指公开向人讲话；结合后面的λέγων，合译为“对他们说”可避免中文重复而不损失信息。
- source_word: τῇ Ἑβραΐδι διαλέκτῳ
  choice: 用希伯来语
  rationale: 直按希腊文保留“希伯来”这一称呼；διάλεκτος可指语言或方言。此处实际所指可能是亚兰语，另以脚注说明，不在正文中消解歧义。
- source_word: λέγων
  choice: 说：
  rationale: 该分词引出下一节的直接引语；中文以冒号自然承接后文。
theological_decisions: []
