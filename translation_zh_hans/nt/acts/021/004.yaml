  text: ⸂ἀνευρόντες δὲ τοὺς⸃ μαθητὰς ἐπεμείναμεν αὐτοῦ ἡμέρας ἑπτά, οἵτινες τῷ Παύλῳ ἔλεγον διὰ τοῦ πνεύματος μὴ ⸀ἐπιβαίνειν εἰς ⸀Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/004.yaml
  text: After finding the disciples[a], we stayed there seven days. They kept telling Paul through the Spirit not to go up to Jerusalem.
translation:
  language: zh_hans
  text: 我们找到门徒后，就在那里停留了七天。他们借着圣灵一再对保罗说，不要上耶路撒冷去。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可理解为：圣灵启示了保罗将要受苦，门徒便据此劝他不要继续前往耶路撒冷。
    reason: 保留διὰ τοῦ πνεύματος与劝阻内容之间可能存在的解释空间，并避免消解与《使徒行传》其他相关经文的张力。
lexical_decisions:
- source_word: ἀνευρόντες
  choice: 找到……后
  rationale: 不定过去时分词表示先于主句的动作；这样译既保留先后关系，也符合现代汉语表达。
- source_word: τοὺς μαθητάς
  choice: 那里的门徒
  rationale: “门徒”保留《使徒行传》中 μαθητής 的常用称谓；“那里的”在汉语中自然交代所找到的人，但不增添“信徒”等更宽泛概念。
- source_word: ἐπεμείναμεν αὐτοῦ ἡμέρας ἑπτά
  choice: 就在那里住了七天
  rationale: ἐπιμένω 表示停留，αὐτοῦ 在此表地点“那里”，时间宾格说明持续七天。
- source_word: οἵτινες
  choice: 他们
  rationale: 回指前面的门徒；另起一句可使现代汉语清楚流畅，同时不改变指代。
- source_word: ἔλεγον
  choice: 一再告诉
  rationale: 未完成时可表示持续或反复发生的动作；“一再告诉”体现这一语气。
- source_word: διὰ τοῦ πνεύματος
  choice: 借着圣灵
  rationale: διά 加属格在此表示媒介或施事；《使徒行传》的语境表明 πνεῦμα 指圣灵。译文不进一步判定圣灵所启示的是苦难本身，还是禁止前往的命令。
- source_word: μὴ ἐπιβαίνειν εἰς Ἱεροσόλυμα
  choice: 不要上耶路撒冷去
  rationale: ἐπιβαίνω 在旅行语境中表示前往或踏上；“上耶路撒冷去”既符合经文中前往耶路撒冷的惯用方向表达，也自然传达目的地。
theological_decisions:
- issue: “借着圣灵”与门徒劝阻保罗之间的关系
  choice: 正文直译为“他们借着圣灵一再告诉保罗，不要上耶路撒冷去”
  alternative: 圣灵启示保罗将要受苦，而门徒据此劝他不要去
  rationale: 原文在语法上把门徒的话与圣灵联系起来，却没有解释这与徒19:21、20:22-23所述保罗受圣灵催促前行之间的张力。正文保留原句力度，脚注提示另一种可能理解，不替读者消解这一神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“住了七天”比“停留七日”更贴近日常表达；“一再告诉”保留未完成时的持续或反复意味。脚注标记置于整句劝阻之后，使其明确关联“借着圣灵”与劝阻内容的解释问题。
