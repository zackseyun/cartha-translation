  text: περὶ δὲ τῶν πεπιστευκότων ἐθνῶν ἡμεῖς ⸀ἀπεστείλαμεν ⸀κρίναντες φυλάσσεσθαι αὐτοὺς τό τε εἰδωλόθυτον ⸀καὶ αἷμα καὶ πνικτὸν καὶ πορνείαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/025.yaml
  text: But concerning the Gentiles who have believed[a], we sent word, having decided that they should keep themselves from what is sacrificed to idols, and from blood, and from what is strangled[c][b], and from sexual immorality.
translation:
  language: zh_hans
  text: 至于已经信主的外邦人，我们已经传信给他们，并作出决定：他们应当远离献给偶像的食物、血、勒死的牲畜，以及淫乱。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περὶ δὲ
  choice: 至于
  rationale: 自然引出与前文犹太信徒议题相对的新话题，保留温和的转折，而不过度强化对立。
- source_word: τῶν πεπιστευκότων ἐθνῶν
  choice: 已经信主的外族人
  rationale: “已经信主”表达完成而结果持续的完成时分词；“外族人”在本语境中指非犹太人，较“列国”准确。
- source_word: ἡμεῖς ἀπεστείλαμεν
  choice: 我们已经传信给他们
  rationale: 保留强调性的“我们”；ἀπεστείλαμεν本身未明说所寄之物，因此用“传信”而不在正文中补作“写信”，同时借语境自然补出接受者。
- source_word: κρίναντες
  choice: 并作出决定
  rationale: 表达使徒会议经过审议而正式决定；汉语以并列结构呈现，比直译为“判断了以后”自然。
- source_word: φυλάσσεσθαι αὐτοὺς
  choice: 他们应当远离
  rationale: 兼顾反身性的“保守自己不沾染”和禁戒含义，现代汉语清楚庄重。
- source_word: τό τε εἰδωλόθυτον
  choice: 祭过偶像之物
  rationale: 保留希腊文较宽泛的“被献给偶像之物”，不把正文限定为某一种肉食。
- source_word: αἷμα
  choice: 血
  rationale: 按原文简洁直译，不在正文中额外解释为食用血。
- source_word: πνικτόν
  choice: 勒死的牲畜
  rationale: 该词指未经放血、以勒死或窒息方式杀死的动物；此译比“勒死之物”更符合现代汉语。
- source_word: πορνείαν
  choice: 淫乱
  rationale: 在圣经伦理语境中概括不合正当规范的性行为，简洁、庄重，且不狭义限定为婚前性行为。
theological_decisions:
- issue: 使徒决定中各项禁令的性质与持续范围
  choice: 在正文中直接保留四项禁令，不说明其期限或系统性神学依据。
  alternative: 将饮食相关禁令解释为暂时的团契安排，或解释为永久普遍有效的律法。
  rationale: 本节只重申此前作出的决定，并未在此解释每项禁令的完整理由和持续期限；译文不应替经文解决这一神学张力。
- issue: πορνείαν的范围
  choice: 译作“淫乱”，保留其涵盖不正当性行为的宽度。
  alternative: 限定译作“婚前性行为”或在此专指与偶像崇拜相关的性行为。
  rationale: 该词本身范围较广，本节也没有明确将其缩限到某一种行为。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话；句式保持使徒决定的正式语气，同时避免生硬的希腊语序。原文未明说书信作为ἀπεστείλαμεν的宾语，故正文用“传信”，不另加脚注。
