source:
  edition: SBLGNT
  text: οἱ δὲ ἀκούσαντες ἐδόξαζον τὸν ⸀θεόν, ⸂εἶπόν τε⸃ αὐτῷ· Θεωρεῖς, ἀδελφέ, πόσαι μυριάδες εἰσὶν ⸂ἐν τοῖς Ἰουδαίοις⸃ τῶν πεπιστευκότων, καὶ πάντες ζηλωταὶ τοῦ νόμου ὑπάρχουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/020.yaml
  text: When they heard this[a], they glorified God, and they said to him, “You see, brother, how many myriads there are among the Jews who have believed[b], and they are all zealous for the law.”
translation:
  language: zh_hans
  text: 他们听了这番话，就把荣耀归给神，又对他说：“弟兄，你看，犹太人中已经相信的人有多少万[a]，而且他们都对律法热心。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文可指以一万为单位的数目，也可泛指极大数目。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: 听了这番话
  rationale: 不定过去时分词表达先于主句的动作；宾语由上文保罗的陈述补足。“这番话”在现代汉语中自然清楚。
- source_word: ἐδόξαζον τὸν θεόν
  choice: 把荣耀归给神
  rationale: 保留 δοξάζω“使得荣耀、归荣耀”的神学分量，同时采用自然的现代汉语表达。
- source_word: εἶπόν τε αὐτῷ
  choice: 又对他说
  rationale: τέ承接叙事，译作“又”；αὐτῷ保留为代词，不在正文中额外明示保罗。
- source_word: Θεωρεῖς
  choice: 你看
  rationale: 这里是引导对方注意眼前情况的修辞性用法，“你看”简洁自然。
- source_word: ἀδελφέ
  choice: 弟兄
  rationale: 单数呼格，直接称呼男性保罗；“弟兄”符合早期信徒之间的称谓。
- source_word: πόσαι μυριάδες
  choice: 有多少万人
  rationale: μυριάς本义可指一万，复数也可泛指极多的人。“多少万人”既保留以万计数的形象，也符合汉语表达；其精确与宽泛含义在脚注说明。
- source_word: ἐν τοῖς Ἰουδαίοις
  choice: 犹太人中
  rationale: 此处重点是信徒的犹太民族及宗教身份，而非单纯居住在犹太地区；地理性理解留在脚注。
- source_word: τῶν πεπιστευκότων
  choice: 已经相信的
  rationale: 完成时分词表示他们已经信而处于相信的状态；不补入希腊文未明说的“主”或“耶稣”。
- source_word: ζηλωταὶ τοῦ νόμου ὑπάρχουσιν
  choice: 都对律法热心
  rationale: ζηλωτής表达强烈热忱，ὑπάρχω在此作系词；译文不进一步解释他们如何实践或维护律法。
theological_decisions:
- issue: ἐν τοῖς Ἰουδαίοις的所指
  choice: 犹太人中
  alternative: 犹太地区的人中／犹太地人中
  rationale: 上下文谈论这些信徒对摩西律法的热心，民族—宗教身份较地理身份更切合；脚注保留地理理解的可能。
- issue: μυριάδες的数值力度
  choice: 多少万人
  alternative: 成千上万的人／多少个一万人
  rationale: 原词既可按一万为单位理解，也可泛指极大的数目。“多少万人”保留原文的万数表达而不强行断定精确人数。
- issue: πεπιστευκότων所相信的对象
  choice: 已经相信的
  alternative: 已经信主的／已经成为信徒的
  rationale: 希腊文在本节未明说宾语。正文保留这种省略，避免把语境中可合理推知的对象写成原文明说的内容。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“把荣耀归给神”和“对律法热心”保留原文的宗教语义，又避免古奥表达。脚注标记紧随各自说明的词语，纠正咨询层中标记位置与注释内容不对应的问题。
