  to: 他们听了这番话，就把荣耀归给神，又对他说：“弟兄，你看，犹太人中已经相信的人有多少万[a]，而且他们都对律法热心。”
  rationale: 仅作两项安全修订：使“已经相信的人”在现代汉语中更自然，并重写脚注a以准确反映 μυριάδες 的数值与泛称弹性。脚注b虽在本节修订后的正文中不再设标记，保留其内容会造成无锚点脚注，因此不应随修订稿保留；地理性替代义可在后续需要时重新加设锚点。
