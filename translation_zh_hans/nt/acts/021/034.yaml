translation_notes:
  register: 采用现代、自然而庄重的叙事语体。“有的喊这个，有的喊那个”传达人群说法纷乱；“千夫长”和“保罗”按近距离上下文明确希腊文代词指向，以免中文含混。所有脚注标记均已置于正文相应位置。
