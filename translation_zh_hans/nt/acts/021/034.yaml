base_translation:
  language: en
  yaml_path: translation/nt/acts/021/034.yaml
  text: But some in the crowd were shouting one thing[a], and others another. Since he was not able to learn the facts because of the uproar[b], he ordered him to be brought into the barracks.
translation:
  language: zh_hans
  text: 人群中有的喊这个，有的喊那个。千夫长由于喧闹，无法查明实情[a]，就下令把保罗带进营房[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“确切情况”或“事情的真相”。
    reason: lexical_alternative
  - marker: b
    text: “营房”指罗马军队驻扎的营房，很可能位于与圣殿区相连的堡垒建筑群内。
    reason: cultural_note
lexical_decisions:
- source_word: ἄλλοι δὲ ἄλλο τι ἐπεφώνουν ἐν τῷ ὄχλῳ
  choice: 人群中有的喊这个，有的喊那个
  rationale: 保留ἄλλοι…ἄλλο τι的分举对比，并以“喊”体现未完成时所描写的持续喧嚷；“人群”中性地对应ὄχλος。
- source_word: μὴ δυναμένου δὲ αὐτοῦ γνῶναι
  choice: 千夫长……无法查明
  rationale: 属格独立结构在此说明随后命令的原因；根据上文明确代词所指为千夫长，而“查明”比抽象的“知道”更符合调查事实的语境。
- source_word: τὸ ἀσφαλές
  choice: 实情
  rationale: 该词指确实、可靠的情况；“实情”自然简洁，同时脚注保留“确切情况”等可能表达。
- source_word: διὰ τὸν θόρυβον
  choice: 因场面混乱
  rationale: θόρυβος在这里不只是声音大，也包含骚动与混乱；此译贴合冲突现场。
- source_word: ἐκέλευσεν ἄγεσθαι αὐτὸν
  choice: 就下令把保罗带进
  rationale: 体现不定式的被动含义和命令的决定性；依上下文将代词明确为“保罗”，不额外指定执行者。
- source_word: εἰς τὴν παρεμβολήν
  choice: 带进营楼
  rationale: 在《使徒行传》此处指圣殿区旁罗马驻军所在的营房建筑；“营楼”兼顾军事驻地及具体建筑语境，避免“营地”给人临时驻扎之感。
