base_translation:
  language: en
  yaml_path: translation/nt/acts/021/023.yaml
  text: 'Therefore do what we tell you: we have four men who are under a vow of their own[a][b].'
translation:
  language: zh_hans
  text: 所以，你要照我们告诉你的去做：我们这里有四个男子，他们有誓愿在身[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们许了愿。”希腊文直译近于“有一个愿在他们自己身上”。
    reason: lexical_alternative
  - marker: b
    text: 从较广的上下文看，这可能是拿细耳人所许的一类誓愿；但本节本身只说“誓愿”，没有注明具体种类。
    reason: cultural_note
lexical_decisions:
- source_word: τοῦτο οὖν
  choice: 所以
  rationale: οὖν表示承接上文所得出的推论；“所以”自然地保留这一逻辑关系，τοῦτο的指向则由后面的命令内容表达。
- source_word: ποίησον ὅ σοι λέγομεν
  choice: 你要照我们告诉你的去做
  rationale: 既保留命令语气，也以现代汉语自然表达关系从句所指的行动内容。
- source_word: εἰσὶν ἡμῖν
  choice: 我们这里有
  rationale: 该存在句加与格可自然理解为“我们有”，但“我们这里有”也保留这些人与说话群体相关或在其间的语境意味。
- source_word: ἄνδρες τέσσαρες
  choice: 四个人
  rationale: 上下文明确所指为男性；现代汉语在无须特别强调性别时以“四个人”更自然，且没有改变所指。
- source_word: εὐχὴν ἔχοντες
  choice: 许了愿
  rationale: 希腊文直译为“有一个愿”，在此表示他们处于誓愿约束之下；“许了愿”是自然、清楚的汉语表达。
- source_word: ἀφ’ ἑαυτῶν
  choice: 他们自己
  rationale: 该短语修饰誓愿与他们自身的关系；“他们自己许了愿”简洁表达誓愿是他们本人所许、由他们承担，同时不添加誓愿种类。
theological_decisions:
- issue: 誓愿的具体性质
  choice: 正文只译作“许了愿”
  alternative: “许了拿细耳人的愿”
  rationale: 后续语境可能令人联想到拿细耳人一类的誓愿，但本节仅使用泛称εὐχή，不应在正文中把具体类别写死。
- issue: ἀφ’ ἑαυτῶν与誓愿的关系
  choice: 译为“他们自己许了愿”
  alternative: “身上有愿”或“为自己所许的愿”
  rationale: 原句措辞不寻常，可能侧重誓愿在他们自己身上；正文采用自然汉语表达主体与誓愿的关系，脚注提示较贴近字面的形式，以免掩盖原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“所以”承接上文推论；“照我们告诉你的去做”保持直接命令语气。正文避免生硬直译，并用脚注保存εὐχὴν ἔχοντες ἀφ’ ἑαυτῶν的字面特点及誓愿类别上的未决性。
