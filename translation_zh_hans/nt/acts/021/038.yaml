  text: οὐκ ἄρα σὺ εἶ ὁ Αἰγύπτιος ὁ πρὸ τούτων τῶν ἡμερῶν ἀναστατώσας καὶ ἐξαγαγὼν εἰς τὴν ἔρημον τοὺς τετρακισχιλίους ἄνδρας τῶν σικαρίων;
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/038.yaml
  text: Then you are not the Egyptian who some days ago stirred up a revolt and led the four thousand men of the assassins out into the wilderness?[a]
translation:
  language: zh_hans
  text: “这么说，你不是前些日子煽动叛乱、带领那四千名刺客[a]到旷野去的那个埃及人吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“短刀党人”；希腊文为“西卡里人”，指以暗藏短刀行刺而闻名的一群人。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἄρα
  choice: 这么说，你不是……吗
  rationale: 该组合以否定疑问表达说话者根据保罗会说希腊话而作出的推断；“这么说”自然传达推论语气，同时保留疑问形式。
- source_word: ὁ Αἰγύπτιος
  choice: 那个埃及人
  rationale: 冠词指向双方所知的特定人物；现代汉语用“那个”可清楚表达这种特指。
- source_word: πρὸ τούτων τῶν ἡμερῶν
  choice: 前些日子
  rationale: 这是表示不久以前的时间说法；“前些日子”自然且不把时间范围说得过于精确。
- source_word: ἀναστατώσας
  choice: 煽动叛乱
  rationale: 该词可指扰乱、使局势动荡；此处涉及政治性暴动，用“煽动叛乱”切合上下文。
- source_word: ἐξαγαγὼν
  choice: 带领……到……去
  rationale: 分词表示领人从一处出去并前往另一处；汉语如此表达较自然，也保留其首领角色。
- source_word: εἰς τὴν ἔρημον
  choice: 到旷野去
  rationale: ἔρημος指荒凉、无人居住之地，不一定是沙漠；“旷野”较准确地保留其范围。
- source_word: τοὺς τετρακισχιλίους ἄνδρας
  choice: 那四千名
  rationale: 冠词使这批人具有特指性；“那四千名”在汉语中自然体现这一点。“名”已表达所指为人，无须机械重复“男人”。
- source_word: τῶν σικαρίων
  choice: 刺客
  rationale: σικάριοι指以暗藏短刀行刺而闻名的一群人；“刺客”能让现代普通读者直接理解，历史称谓及字面含义在脚注中保留。
