  text: ἐκινήθη τε ἡ πόλις ὅλη καὶ ἐγένετο συνδρομὴ τοῦ λαοῦ, καὶ ἐπιλαβόμενοι τοῦ Παύλου εἷλκον αὐτὸν ἔξω τοῦ ἱεροῦ, καὶ εὐθέως ἐκλείσθησαν αἱ θύραι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/030.yaml
  text: And the whole city was stirred up[a], and a crowd of the people formed; and after seizing Paul, they dragged him outside the temple[c][b], and immediately the doors were shut.
translation:
  language: zh_hans
  text: 全城都骚动起来，百姓纷纷聚拢[a]。他们抓住保罗，拖着他出了圣殿区[b]；随即，门都关上了[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文所用的词含有众人突然奔集到一处的意思。
    reason: lexical_note
  - marker: b
    text: 这里的“圣殿区”指圣殿建筑群及其院区，不是专指内殿。
    reason: cultural_note
  - marker: c
    text: 也可译作“大门”；在这里，这个词可指圣殿区域的出入口之门。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκινήθη
  choice: 骚动起来
  rationale: 此处被动形式描述全城受到震动、陷入骚动，并非单指位置移动；“骚动起来”自然地表达群体性的动荡。
- source_word: ἡ πόλις ὅλη
  choice: 全城
  rationale: 简洁保留“整个城市”的范围，也符合现代汉语习惯。
- source_word: ἐγένετο συνδρομὴ τοῦ λαοῦ
  choice: 百姓纷纷聚拢
  rationale: συνδρομή含有众人奔集、汇聚之意；“纷纷聚拢”既表现突然聚集的动态，也避免将其仅静态化为已经形成的“人群”。
- source_word: ἐπιλαβόμενοι τοῦ Παύλου
  choice: 他们抓住保罗
  rationale: 分词表示众人先以强力抓住保罗；汉语顺承句式足以表达这一动作与随后拖行的关系。
- source_word: εἷλκον
  choice: 把他拖出
  rationale: 未完成过去时呈现拖行过程；“拖”保留动作的强制性，汉语无需另加进行标记也能自然表达该场景。
- source_word: ἔξω τοῦ ἱεροῦ
  choice: 拖出圣殿区
  rationale: ἱερόν在这里指圣殿建筑群或院区，而非专指内殿；“圣殿区”在正文中直接保留这一空间范围。
- source_word: εὐθέως
  choice: 立刻
  rationale: 准确表达动作紧接发生，且为自然、庄重的现代汉语。
- source_word: ἐκλείσθησαν αἱ θύραι
  choice: 各道门立刻关上了
  rationale: 复数θύραι指通往圣殿区域的门或门口；“各道门”保留复数，又适合圣殿场景。
theological_decisions: []
