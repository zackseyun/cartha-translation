  text: ὅτε δὲ ἐγένετο ἐπὶ τοὺς ἀναβαθμούς, συνέβη βαστάζεσθαι αὐτὸν ὑπὸ τῶν στρατιωτῶν διὰ τὴν βίαν τοῦ ὄχλου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/035.yaml
  text: When he came to the steps[a], it happened that he was being carried by the soldiers because of the violence of the crowd[b],
translation:
  language: zh_hans
  text: 他来到台阶那里[a]时，由于人群的暴力冲撞，士兵们不得不抬着他走。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “台阶”很可能是指通往罗马军营的楼梯（参21:34、37）。
    reason: cross_reference
lexical_decisions:
- source_word: ὅτε δὲ
  choice: 他到了……那里
  rationale: ὅτε引出时间从句，δέ在此仅作轻微衔接；中文可借句序自然表达，不必另译“但”或“这时”。
- source_word: ἐγένετο ἐπὶ τοὺς ἀναβαθμούς
  choice: 他到了台阶那里
  rationale: γίνομαι与ἐπί加宾格在此表示到达某处；这样译既自然，也保留叙事中的空间转换。
- source_word: ἀναβαθμούς
  choice: 台阶
  rationale: 该词指向上通行的阶梯或楼梯；“台阶”简洁，并与上文军营的场景相符。
- source_word: συνέβη βαστάζεσθαι
  choice: 只得把他抬起来
  rationale: συνέβη引出因现场情势而产生的结果，结合διὰ所说明的原因，中文“只得”自然表达由人群暴力造成的实际必要；“抬起来”体现βαστάζεσθαι的被动承载含义。
- source_word: ὑπὸ τῶν στρατιωτῶν
  choice: 士兵们
  rationale: ὑπό引出被动动作的施事者；转换为中文主动句可避免生硬，同时不改变参与者关系。
- source_word: διὰ τὴν βίαν τοῦ ὄχλου
  choice: 由于人群的暴力冲撞
  rationale: διά加宾格表示原因；βία可指暴力或强力，在骚乱语境中“暴力冲撞”比单说“暴力”更具体自然，又不把ὄχλος强化译成“暴徒”。
