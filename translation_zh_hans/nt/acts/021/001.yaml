  text: Ὡς δὲ ἐγένετο ἀναχθῆναι ἡμᾶς ἀποσπασθέντας ἀπ’ αὐτῶν, εὐθυδρομήσαντες ἤλθομεν εἰς τὴν ⸀Κῶ, τῇ δὲ ἑξῆς εἰς τὴν Ῥόδον, κἀκεῖθεν εἰς Πάταρα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/001.yaml
  text: After we had torn ourselves away from them and put out to sea[a], we ran a straight course and came to Cos, and on the next day to Rhodes, and from there to Patara.
translation:
  language: zh_hans
  text: 我们依依不舍地与他们分别后，就开船出海，直航到哥士[a]；第二天到了罗得，又从那里到了帕大喇。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “哥士”也可译作“科斯”。
    reason: 保留Κῶ（Cos/Kos）的常见中文音译异体，并对应英文审校轨迹的词汇替代说明。
lexical_decisions:
- source_word: Ὡς δὲ ἐγένετο
  choice: ……后，就
  rationale: 这一叙事惯用结构引出随后发生的事件；用“……后，就”自然表达时间承接关系。
- source_word: ἀποσπασθέντας ἀπ’ αὐτῶν
  choice: 依依不舍地与他们分别
  rationale: ἀποσπάω本有拉开、扯离之意；此处结合送别语境，表达分别之艰难，同时避免生硬直译为“把自己撕开”。
- source_word: ἀναχθῆναι
  choice: 开船出海
  rationale: ἀνάγω在航海语境中指驶离岸边、出海；该译法清楚自然。
- source_word: εὐθυδρομήσαντες
  choice: 直航
  rationale: 该航海动词表示沿直线或直接航行；“直航”简洁保留其航海意味。
- source_word: ἤλθομεν εἰς
  choice: 到
  rationale: 旅行叙事中表示抵达某地，现代汉语用“到”简练流畅。
- source_word: Κῶ
  choice: 哥士
  rationale: 采用中文圣经地名的通行传统译名。
- source_word: τῇ δὲ ἑξῆς
  choice: 第二天
  rationale: 准确表达“次日”，并与行程叙述自然衔接。
- source_word: Ῥόδον
  choice: 罗得
  rationale: 采用中文圣经地名的通行传统译名。
- source_word: κἀκεῖθεν
  choice: 又从那里
  rationale: 体现καί与ἐκεῖθεν合成词所表达的连接和起点意义。
- source_word: Πάταρα
  choice: 帕特拉
  rationale: 按希腊文Πάταρα音译，采用清楚的现代地名形式。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的行程叙述。“依依不舍”传达ἀποσπάω在上下文中的强烈离别意味，但不将希腊语被动形式机械译出。地名兼顾中文读者的传统熟悉度与原文音值。
