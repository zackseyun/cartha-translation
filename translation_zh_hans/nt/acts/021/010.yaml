  yaml_path: translation/nt/acts/021/010.yaml
  text: While we were staying there for several days, a prophet named Agabus came down from Judea.
translation:
  language: zh_hans
  text: 我们在那里又住了好些天的时候，有一位名叫亚迦布的先知从犹太地下来。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιμενόντων
  choice: 我们在那里又住了
  rationale: 现在时属格复数分词与后文构成属格独立结构，具有时间意义；其隐含主语按上下文是保罗及同行者，因此译作“我们”。“又住了”表达继续停留。
- source_word: δὲ
  choice: 不单独译出
  rationale: δέ在这里主要起轻微的叙事衔接作用，其功能已自然融入汉语句序，无须机械译作“于是”或“但”。
- source_word: ἡμέρας πλείους
  choice: 好些天
  rationale: 这是表示时段的宾格。πλείους在语境中指额外延续的一段日子；“好些天”既自然，也保留了时日不短但数目不确指的含义。
- source_word: κατῆλθέν
  choice: 下来
  rationale: 保留κατέρχομαι的方向性；从内陆较高地区的犹太前往沿海的凯撒利亚，惯常称为“下来”。
- source_word: τις
  choice: 一位
  rationale: 不定代词引入新人物；与“先知”搭配时，“一位”是自然且得体的现代汉语表达。
- source_word: ἀπὸ τῆς Ἰουδαίας
  choice: 从犹太
  rationale: 直接表达来源地；“犹太”是本书地理区域Ἰουδαία的通行译名。
- source_word: προφήτης
  choice: 先知
  rationale: 采用该身份称谓的标准译法，不作解释性扩写。
- source_word: ὀνόματι Ἅγαβος
  choice: 名叫亚迦布
  rationale: ὀνόματι在此是“名叫”的惯用表达；“亚迦布”沿用中文圣经中Agabus的通行音译。
