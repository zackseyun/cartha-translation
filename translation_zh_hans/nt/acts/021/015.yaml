    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ τὰς ἡμέρας ταύτας
  choice: 过了这些日子
  rationale: μετά加宾格表示时间上的先后，指前述那段日子之后。“过了这些日子”既贴近原文，也符合现代汉语叙事习惯。
- source_word: ἐπισκευασάμενοι
  choice: 收拾行装
  rationale: 该词可泛指为旅程作准备或装备妥当，在旅行语境中也可能包括整理行李。“收拾行装”自然具体，但不将含义严格限定为打包，因此以脚注保留较宽泛的理解。
- source_word: ἀνεβαίνομεν
  choice: 上……去
  rationale: 未完成时在此用于过去叙事；“上耶路撒冷去”保留前往耶路撒冷时惯用的上行表达及方向意味。
- source_word: εἰς Ἱεροσόλυμα
  choice: 耶路撒冷
  rationale: εἰς表示朝向目的地的移动；与“上……去”组合为自然的现代汉语。
