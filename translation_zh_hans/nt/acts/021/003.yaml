  text: ⸀ἀναφάναντες δὲ τὴν Κύπρον καὶ καταλιπόντες αὐτὴν εὐώνυμον ἐπλέομεν εἰς Συρίαν, καὶ ⸀κατήλθομεν εἰς Τύρον, ἐκεῖσε γὰρ ⸂τὸ πλοῖον ἦν⸃ ἀποφορτιζόμενον τὸν γόμον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/003.yaml
  text: After sighting Cyprus and leaving it on our left[a], we sailed on to Syria and came down to Tyre[d][c][b], for there the ship was unloading its cargo.
translation:
  language: zh_hans
  text: 望见塞浦路斯后，我们把它留在左边，继续航行到叙利亚，并来到推罗[a]，因为船正在那里卸货[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“下到推罗”；也可译“抵达推罗”。
    reason: lexical_alternative
  - marker: b
    text: 也可译“因为船正在那里卸下货物”或“因为船正在那里被卸货”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναφάναντες
  choice: 望见
  rationale: 该不定过去时分词表示先于主句动作发生的事；在航海语境中，“望见”自然表达陆地进入视野。
- source_word: καταλιπόντες αὐτὴν εὐώνυμον
  choice: 把它留在左边
  rationale: εὐώνυμον意为“在左边”；此处指船继续航行时，塞浦路斯位于航线左侧。译文保留原文方位表达，避免使用较专业的航海术语。
- source_word: ἐπλέομεν εἰς Συρίαν
  choice: 继续航行前往叙利亚
  rationale: 未完成时描写航程的持续；“继续航行”在现代汉语中自然体现这一过程。
- source_word: κατήλθομεν εἰς Τύρον
  choice: 在推罗靠岸
  rationale: κατέρχομαι本义可为“下来、下到”，在航海行程中可指抵达、靠岸。“靠岸”符合上下文，也不把此处误解为地势方向；脚注保留较直译的可能。
- source_word: ἐκεῖσε
  choice: 在那里
  rationale: 指向推罗这一目的地，并说明船停靠该处的原因。
- source_word: ἀποφορτιζόμενον
  choice: 要……卸下
  rationale: 与ἦν构成迂回结构，可理解为船正在或预定卸货。结合γάρ说明停靠原因，“要在那里卸下”符合汉语叙事，同时脚注保留主动与被动理解的差异。
- source_word: τὸν γόμον
  choice: 货物
  rationale: γόμος指船所装运的货载；“货物”是普通现代汉语中清楚自然的对应词。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“望见”“把它留在左边”“靠岸”“卸下货物”兼顾航海语境与普通读者的可理解性；对κατήλθομεν和ἀποφορτιζόμενον的语义及语态差异以脚注保留。
