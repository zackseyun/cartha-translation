  text: Μέλλων τε εἰσάγεσθαι εἰς τὴν παρεμβολὴν ὁ Παῦλος λέγει τῷ χιλιάρχῳ· Εἰ ἔξεστίν μοι εἰπεῖν ⸀τι πρὸς σέ; ὁ δὲ ἔφη· Ἑλληνιστὶ γινώσκεις;
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/037.yaml
  text: As Paul was about to be brought into the barracks[a], he said to the tribune, “Is it permitted for me to say something to you?” And he said[c][b], “Do you know Greek?”
translation:
  language: zh_hans
  text: 保罗将要被带进兵营[a]时，对千夫长[b]说：“我可以对你说句话吗？”千夫长说：“你懂希腊语吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “兵营”指罗马驻军的军事营区。
    reason: cultural_note
  - marker: b
    text: “千夫长”是罗马军官的传统译法，也可译作“指挥官”。
    reason: cultural_note
lexical_decisions:
- source_word: Μέλλων τε εἰσάγεσθαι
  choice: 将要被带进
  rationale: μέλλω与现在时被动不定式连用，表示即将发生的动作；“被带进”保留了εἰσάγεσθαι的被动语态。
- source_word: παρεμβολή
  choice: 营房
  rationale: 在耶路撒冷的罗马军事语境中，此词指驻军所在的营区或营房，而非一般意义的野外营地；“营房”自然、明确。
- source_word: χιλίαρχος
  choice: 千夫长
  rationale: 该词指罗马军队中统率约一千人或一个军团大队的高级军官；“千夫长”既保留原词形式，也符合中文圣经历史语境。
- source_word: Εἰ ἔξεστίν μοι εἰπεῖν τι πρὸς σέ
  choice: 我可以对你说句话吗？
  rationale: 原文以εἰ引出委婉的许可请求。中文用“可以……吗”自然传达礼貌询问；“说句话”准确表达εἰπεῖν τι，而不显生硬。
- source_word: Ἑλληνιστὶ γινώσκεις
  choice: 你懂希腊语吗？
  rationale: Ἑλληνιστί指希腊语，γινώσκεις在语言语境中表示懂得或掌握；“你懂希腊语吗”兼顾字义与现代汉语习惯。
theological_decisions: []
