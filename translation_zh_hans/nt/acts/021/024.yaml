id: ACT.21.24
reference: Acts 21:24
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: τούτους παραλαβὼν ἁγνίσθητι σὺν αὐτοῖς καὶ δαπάνησον ἐπ’ αὐτοῖς ἵνα ⸀ξυρήσονται τὴν κεφαλήν, καὶ ⸀γνώσονται πάντες ὅτι ὧν κατήχηνται περὶ σοῦ οὐδέν ἐστιν, ἀλλὰ στοιχεῖς καὶ αὐτὸς ⸂φυλάσσων τὸν νόμον⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/024.yaml
  text: Take these men[a], purify yourself along with them, and pay their expenses so that they may shave their heads. Then everyone will know that there is nothing to the things they have been told about you[b], but that you yourself also are living in observance of the law.
translation:
  language: zh_hans
  text: 你带上这些人，与他们一同行洁净礼，并替他们支付费用，好让他们剃头。这样，众人就会知道，他们所听到的关于你的那些说法[a]毫无根据；相反，你自己也循规而行，遵守律法[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “所听到”所译的希腊词也可指“受到教导”或“获知”。这里是指流传到他们耳中的有关保罗的说法。
    reason: lexical_alternative
  - marker: b
    text: “循规而行”直译有“按行列而行”的意思，即生活行事与遵守律法相一致。
    reason: lexical_alternative
lexical_decisions:
- source_word: τούτους παραλαβὼν
  choice: 你带这些人一起去
  rationale: 结合上一节所说的四个人，明确补出“人”；“带……一起去”自然表达 παραλαμβάνω 在此带有命令意味的伴随分词。
- source_word: ἁγνίσθητι σὺν αὐτοῖς
  choice: 和他们一同洁净自己
  rationale: 这里指礼仪上的洁净；用“洁净自己”表达形式上的被动而意义偏反身的命令，并保留 σύν 的共同参与含义。
- source_word: δαπάνησον ἐπ’ αὐτοῖς
  choice: 替他们支付费用
  rationale: 表达保罗要为这些人承担相关开支；不在正文中进一步断定费用的具体项目。
- source_word: ἵνα ξυρήσονται τὴν κεφαλήν
  choice: 好让他们剃头
  rationale: ἵνα 加将来时在通用希腊语中表达目的或预期结果；“好让”自然传达这一关系。希腊文单数“头”具有分配意义，汉语通常简洁说“剃头”。
- source_word: γνώσονται πάντες
  choice: 这样，众人就会知道
  rationale: “这样”清楚表达前述行动所产生的结果，同时保留 πάντες 的整体范围。
- source_word: ὧν κατήχηνται περὶ σοῦ
  choice: 他们所听到的关于你的那些说法
  rationale: κατηχέω 可指教导，也可泛指告知；本语境涉及有关保罗的传闻，故用“所听到的……说法”，并以脚注保留词义空间。
- source_word: οὐδέν ἐστιν
  choice: 全无其事
  rationale: 这是自然、庄重的现代汉语表达，表示相关说法并不属实，而不额外引入更强的判定。
- source_word: ἀλλὰ στοιχεῖς
  choice: 相反，你……也循规而行
  rationale: στοιχέω 的基本意象是按行列或准则而行；“循规而行”既保留其形象和持续生活方式，也避免仅译作抽象的“遵守”。
- source_word: καὶ αὐτὸς
  choice: 你自己也
  rationale: 同时保留 αὐτός 的强调和 καί 的附加意义。
- source_word: φυλάσσων τὸν νόμον
  choice: 遵守律法
  rationale: φυλάσσω 与 νόμος 连用时表示持守、遵行；“遵守律法”是准确自然的汉语表达。
- source_word: νόμον
  choice: 律法
  rationale: 上下文所指为犹太律法；“律法”保留经文用语，不在正文中加入“摩西的”这一解释性限定。
theological_decisions:
- issue: 本叙事中保罗与律法的关系
  choice: 译为“你自己也循规而行，遵守律法”
  alternative: 你自己也行事规矩，谨守律法
  rationale: 此句表达众人将从保罗参与洁净并承担费用一事所得出的认识。译文忠实呈现叙事中的可观察行为，不借此解决保罗书信及使徒行传其他段落中有关律法的更广泛神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“洁净自己”保留礼仪语境；“全无其事”自然表达传闻不实；将 στοιχεῖς 与 φυλάσσων 分别译作“循规而行，遵守”，避免把两个动词压缩成一个，也保留原文对生活方式与守律法的双重表述。
