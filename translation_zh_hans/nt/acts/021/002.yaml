  text: καὶ εὑρόντες πλοῖον διαπερῶν εἰς Φοινίκην ἐπιβάντες ἀνήχθημεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/002.yaml
  text: And after finding a ship crossing over to Phoenicia[a], we went aboard and set sail.
translation:
  language: zh_hans
  text: 我们找到一艘要渡海前往腓尼基的船[a]，就上了船，启航了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一艘开往腓尼基的船。”希腊原文直译为“一艘渡往腓尼基的船”。
    reason: 词义与表达方式的另一种译法
lexical_decisions:
- source_word: εὑρόντες
  choice: 找到
  rationale: 不定过去时分词表示先于主要动作发生；汉语按叙事顺序用“找到……就……”自然呈现这一先后关系。
- source_word: πλοῖον
  choice: 一艘……船
  rationale: 指适合地中海航行的船只；“船”是现代汉语中自然且不作过度限定的称呼。
- source_word: διαπερῶν
  choice: 要渡海前往
  rationale: 现在时分词修饰“船”，描述其正在执行或预定的跨海航程；“渡海前往”保留了 διαπεράω 的跨越含义，也符合汉语表达。
- source_word: εἰς Φοινίκην
  choice: 前往腓尼基
  rationale: εἰς 标明目的地；采用现代通行地名“腓尼基”。
- source_word: ἐπιβάντες
  choice: 上了船
  rationale: 航海语境中意为登船；不定过去时分词所表达的先行动作，通过“就……，启航”这一顺序自然体现。
- source_word: ἀνήχθημεν
  choice: 启航了
  rationale: ἀνάγω 在航海语境中意为离岸出海、开船；“启航”简洁、现代而庄重。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“要渡海前往”兼顾希腊文分词的动态含义和汉语中描述船只航向的自然表达；脚注保留较惯用的“开往”译法。
