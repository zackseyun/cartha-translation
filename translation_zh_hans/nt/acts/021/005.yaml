  text: ὅτε δὲ ἐγένετο ⸂ἐξαρτίσαι ἡμᾶς⸃ τὰς ἡμέρας, ἐξελθόντες ἐπορευόμεθα προπεμπόντων ἡμᾶς πάντων σὺν γυναιξὶ καὶ τέκνοις ἕως ἔξω τῆς πόλεως, καὶ θέντες τὰ γόνατα ἐπὶ τὸν αἰγιαλὸν ⸀προσευξάμενοι
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/005.yaml
  text: When it came time for us to complete those days[a], we departed and went on our way, while they all, with wives and children, were accompanying us as far as outside the city. And after kneeling down on the beach[b], we prayed.
translation:
  language: zh_hans
  text: 当我们住满那些日子、要离开的时候，便离开，继续上路。众人带着妻子儿女送我们，一直送到城外。我们就在海边跪下祷告。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγένετο ⸂ἐξαρτίσαι ἡμᾶς⸃ τὰς ἡμέρας
  choice: 我们住满了那些日子
  rationale: ἐγένετο 加不定式标示时点来到，ἐξαρτίζω 在此指完成一段规定的日子。汉语用“住满了那些日子”自然表达停留期届满，同时保留“那些日子”的具体指向。
- source_word: ἐξελθόντες ἐπορευόμεθα
  choice: 就出城继续上路
  rationale: 分词与未完成时主句先后表达离开和持续行程；“出城继续上路”兼顾两个动作，也与下文送到城外的场景衔接。
- source_word: προπεμπόντων ἡμᾶς πάντων
  choice: 众人……为我们送行
  rationale: προπέμπω 可指在某人启程时陪同并送别；本段显然是信徒陪伴他们离城，因此现代汉语“送行”最贴切。
- source_word: σὺν γυναιξὶ καὶ τέκνοις
  choice: 和妻子儿女一同
  rationale: πάντων 为阳性复数，语境呈现全家参与送行，故 γυναιξὶ 在此最自然指众人的妻子，而 τέκνοις 译作“儿女”以涵盖子女。
- source_word: ἕως ἔξω τῆς πόλεως
  choice: 一直送到城外
  rationale: 保留 ἕως 所表达的终点范围及 ἔξω τῆς πόλεως 的城界以外之意，且符合汉语送行场景。
- source_word: θέντες τὰ γόνατα
  choice: 跪下
  rationale: 这是表示屈膝跪地的惯用表达，直译“放下膝盖”在现代汉语中不自然。
- source_word: ἐπὶ τὸν αἰγιαλὸν
  choice: 在海滩上
  rationale: αἰγιαλός 指临海的岸边或沙滩；“海滩”清楚具体，同时以脚注保留“海岸”的可行译法。
- source_word: προσευξάμενοι
  choice: 祷告
  rationale: 该复数分词承接跪下的动作。汉语以并列谓语“跪下祷告”自然表达动作顺序，又不额外限定究竟哪些送行者参与祷告。
theological_decisions:
- issue: 祷告者的范围
  choice: 采用主语可随语境涵盖现场众人的“我们在海滩上跪下祷告”
  alternative: 明确限定为保罗一行人祷告
  rationale: προσευξάμενοι 在句法上与第一人称复数旅行叙事相连，但现场众人是否共同跪下祷告并未被希腊文排除；译文不额外缩窄参与者范围。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“住满了那些日子”略带经文语体，以保留原文对特定停留期的指称；“继续上路”“为我们送行”则保持自然汉语。所有脚注标记均置于相应正文词句之后。
