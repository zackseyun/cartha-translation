reference: Acts 21:28
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: κράζοντες· Ἄνδρες Ἰσραηλῖται, βοηθεῖτε· οὗτός ἐστιν ὁ ἄνθρωπος ὁ κατὰ τοῦ λαοῦ καὶ τοῦ νόμου καὶ τοῦ τόπου τούτου πάντας ⸀πανταχῇ διδάσκων, ἔτι τε καὶ Ἕλληνας εἰσήγαγεν εἰς τὸ ἱερὸν καὶ κεκοίνωκεν τὸν ἅγιον τόπον τοῦτον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/028.yaml
  text: shouting[a], “Men of Israel, help! This is the man who teaches everyone everywhere against the people and the law and this place. And besides that, he has even brought Greeks into the temple and has defiled this holy place.”
translation:
  language: zh_hans
  text: 他们喊道：“以色列同胞们，来帮忙！就是这个人，他到处教导众人反对百姓、律法和这地方。不仅如此，他还把希腊人带进了圣殿[a]，玷污了这圣地。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里译作“圣殿”的希腊词ἱερόν，指圣殿建筑群或院区，并非专指内殿。
    reason: 说明重要的词义范围和历史空间背景。
lexical_decisions:
- source_word: κράζοντες
  choice: 他们喊道
  rationale: 现在分词说明控告时的方式；“喊道”自然地传达公开而急迫的呼喊。
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: 以色列同胞们
  rationale: 这是对以色列男子的呼语。现代汉语中“以色列同胞们”自然、庄重，也保留了群体身份；若直译“以色列男人们”则明显生硬。
- source_word: βοηθεῖτε
  choice: 来帮忙！
  rationale: 命令式的紧急求助；不明确补出“我们”，以免加入原文没有明说的宾语。
- source_word: οὗτός ἐστιν ὁ ἄνθρωπος
  choice: 就是这个人
  rationale: 保留指认和控告的语气，在现代汉语中简洁有力。
- source_word: ὁ κατὰ τοῦ λαοῦ καὶ τοῦ νόμου καὶ τοῦ τόπου τούτου
  choice: 反对我们的人民、律法和这地方
  rationale: κατά加属格表示敌对或反对。上下文中的“人民”指以色列民，补入“我们的”使汉语指向清楚；“律法”指犹太人的律法，并保留“这地方”所指圣殿区域的现场感。
- source_word: πάντας πανταχῇ διδάσκων
  choice: 到处教导众人
  rationale: 同时保留πάντας“众人”和πανταχῇ“到处”的广泛范围，语序符合自然汉语。
- source_word: ἔτι τε καὶ
  choice: 不仅如此
  rationale: 表达进一步追加、加重控罪的修辞力量。
- source_word: Ἕλληνας
  choice: 希腊人
  rationale: 原词具体指“希腊人”，不泛化为“外邦人”。
- source_word: εἰσήγαγεν εἰς τὸ ἱερὸν
  choice: 把希腊人带进了圣殿
  rationale: 以完成体“带进了”表达所指控的既成行为。ἱερόν在此指整个圣殿建筑群或院区，相关精确含义列入脚注。
- source_word: κεκοίνωκεν
  choice: 玷污了
  rationale: κοινόω在礼仪洁净语境中指使之成为不洁或亵渎；“玷污”清楚传达这里的宗教性控告。
- source_word: τὸν ἅγιον τόπον τοῦτον
  choice: 这圣地
  rationale: 保留指示词和神圣性质；“圣地”在句中自然，并避免连续重复“地方”。
theological_decisions:
- issue: τοῦ νόμου所指的律法
  choice: 译作“律法”，按上下文理解为犹太人的律法
  alternative: 译作较泛化的“法律”或“规条”
  rationale: 耶路撒冷圣殿语境显示，控告所针对的是以色列所领受的律法；“律法”既明确又不额外限定为某一后世神学分类。
- issue: ἱερόν的范围
  choice: 正文译作“圣殿”，脚注说明指圣殿建筑群或院区
  alternative: 正文直接译作“圣殿院区”
  rationale: “圣殿”最适合流畅正文，但ἱερόν并非专指内殿；脚注保留这一对历史场景重要的词义区别。
- issue: 控告是否代表叙事者的事实判断
  choice: 按直接引语保留为群众提出的控告，不在译文中判定其真伪
  alternative: 用措辞暗示保罗确实做了这些事，或在正文中加入“声称”等解释
  rationale: 本节记录控告内容；译文应保留叙事张力，不把说话者的指控转化为叙事者的确认。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事语言。“来帮忙”“就是这个人”保留现场呼喊的急迫感；“律法”“圣殿”“玷污”维持经文语境所需的宗教用语。
