revisions:
- from: 于是，保罗带着那几个人，第二天同他们一起行了洁净礼，便进入圣殿区[a]，申报洁净期将在何时结束，也就是直到为他们每个人献上[b]供物为止。
  to: 于是，保罗带同那些人，第二天同他们一起行了洁净礼，便进入圣殿区[a]，申报洁净期届满的日期；洁净期一直到为他们每一个人献上[b]供物为止。
  rationale: 修订只调整时间关系和汉语句法：保留保罗作正式申报的动作，并将“直到为每一个人献上供物”明确为洁净期届满的终点。删除脚注中非必要的解释性补充，保留词汇替代信息。
