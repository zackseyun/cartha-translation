id: ACT.21.26
reference: Acts 21:26
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: τότε ὁ Παῦλος παραλαβὼν τοὺς ἄνδρας τῇ ἐχομένῃ ἡμέρᾳ σὺν αὐτοῖς ἁγνισθεὶς εἰσῄει εἰς τὸ ἱερόν, διαγγέλλων τὴν ἐκπλήρωσιν τῶν ἡμερῶν τοῦ ἁγνισμοῦ ἕως οὗ προσηνέχθη ὑπὲρ ἑνὸς ἑκάστου αὐτῶν ἡ προσφορά.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/026.yaml
  text: Then Paul took the men[a], and on the next day, having purified himself with them, he entered the temple, giving notice of the completion of the days of purification[b], until the offering was presented for each one of them.
translation:
  language: zh_hans
  text: 于是，保罗带同那些人，第二天同他们一起行了洁净礼，便进入圣殿区[a]，申报洁净期届满的日期；洁净期一直到为他们每一个人献上[b]供物为止。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣殿区”：希腊语ἱερόν指整个圣殿建筑群，并非专指内殿。也可译作“圣殿”。
    reason: lexical_alternative
  - marker: b
    text: “献上”也可译作“呈献”。
    reason: lexical_alternative
lexical_decisions:
- source_word: παραλαβὼν τοὺς ἄνδρας
  choice: 带着那几个人
  rationale: παραλαμβάνω在这里表示带同、带上；“带着”自然表达保罗与这些人一同行动。
- source_word: τῇ ἐχομένῃ ἡμέρᾳ
  choice: 第二天
  rationale: 这是现代汉语表达紧接着下一日的自然说法。
- source_word: σὺν αὐτοῖς ἁγνισθεὶς
  choice: 同他们一起行了洁净礼
  rationale: 上下文所指是礼仪性的洁净；此译法既表达共同参与，也避免把希腊语分词的语态过度限定为纯被动或单纯反身。
- source_word: εἰσῄει
  choice: 便进入
  rationale: 汉语叙事用简单动词更自然；希腊语未完成时在此可作背景性或过程性叙述，汉语不必用生硬的“正在进入”来强行标示。
- source_word: τὸ ἱερόν
  choice: 圣殿区
  rationale: ἱερόν指整个圣殿范围，而不是专指内殿（ναός）；“圣殿区”在正文中直接保留这一空间区别。
- source_word: διαγγέλλων
  choice: 申报
  rationale: 该词在此表示向有关人员作正式通知；“申报”符合礼仪程序的语境。
- source_word: τὴν ἐκπλήρωσιν τῶν ἡμερῶν τοῦ ἁγνισμοῦ
  choice: 洁净期将在何时结束
  rationale: 将名词结构自然转为汉语分句，表达规定的洁净日数达到终点，而不把它误解为抽象的“成全”。
- source_word: ἕως οὗ
  choice: 直到……为止
  rationale: 直接表达该程序的时间终点。
- source_word: προσηνέχθη
  choice: 献上
  rationale: προσφέρω在祭祀语境中指呈献供物；“献上”自然，并保留其敬拜礼仪色彩。
- source_word: ὑπὲρ ἑνὸς ἑκάστου αὐτῶν
  choice: 为他们每个人
  rationale: ὑπέρ在此表示为某人或代表某人；“为他们每个人”准确、简明。
- source_word: ἡ προσφορά
  choice: 供物
  rationale: προσφορά是一般性的献礼或供物，译作“供物”比“祭牲”更不限定具体种类。
theological_decisions:
- issue: 保罗参与圣殿洁净礼的神学含义
  choice: 按叙事本身直述保罗参与洁净程序
  alternative: 译文暗示保罗赞同或反对基督徒继续遵守圣殿礼仪
  rationale: 本节只叙述行动，没有直接评判这些礼仪在新约群体中的持续效力，因此不应把相关宗派结论加入译文。
- issue: εἰσῄει的未完成时体
  choice: 以自然汉语“便进入”表达叙事动作
  alternative: 译作“正进入”或“不断进入”，突出进行或反复意味
  rationale: 该未完成时可能具有过程性或背景性，但单节不足以确定反复进入；强行添加“正”或“不断”会缩窄原文可能性。
- issue: 洁净日期结束与献供物之间的句法关系
  choice: 用“也就是直到……为止”保留献供物作为时间终点的关系
  alternative: 明确译成保罗申报一个已经确定的结束日期，或祭司每日献祭
  rationale: 希腊语ἕως οὗ标明终点，但整句结构略显压缩；译文不额外指定申报的对象、祭司身份或献祭频率。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“行了洁净礼”“申报”“供物”保留圣殿礼仪语境，但避免古奥措辞。正文将原文压缩的时间结构适度展开，同时不增添祭司、祭物种类或律法效力等原文未明说的信息。
