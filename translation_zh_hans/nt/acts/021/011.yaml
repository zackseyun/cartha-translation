  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν πρὸς ἡμᾶς καὶ ἄρας τὴν ζώνην τοῦ Παύλου δήσας ⸀ἑαυτοῦ τοὺς πόδας καὶ τὰς χεῖρας εἶπεν· Τάδε λέγει τὸ πνεῦμα τὸ ἅγιον Τὸν ἄνδρα οὗ ἐστιν ἡ ζώνη αὕτη, οὕτως δήσουσιν ἐν Ἰερουσαλὴμ οἱ Ἰουδαῖοι καὶ παραδώσουσιν εἰς χεῖρας ἐθνῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/011.yaml
  text: 'And coming to us[a], and taking Paul’s belt, he bound his own feet and hands and said[b], “Thus says the Holy Spirit: ‘In this way the Jews in Jerusalem will bind the man to whom this belt belongs and will hand him over into the hands of the Gentiles.’”'
translation:
  language: zh_hans
  text: 他来到我们这里，拿起保罗的腰带，把自己的双脚和双手捆住，说：“圣灵这样说[a]：‘耶路撒冷的犹太人要这样捆绑这条腰带的主人——那人[b]，并把他交在外邦人手中。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这是圣灵所说的。”
    reason: 提供Τάδε λέγει在现代汉语中的自然替代表达。
  - marker: b
    text: 较直译：“这条腰带是谁的，那人……”
    reason: 显示οὗ ἐστιν ἡ ζώνη αὕτη的所属结构。
lexical_decisions:
- source_word: ζώνην
  choice: 腰带
  rationale: ζώνη指系在腰间的带子；“腰带”是现代汉语中清楚、自然的对应词。
- source_word: δήσας ἑαυτοῦ τοὺς πόδας καὶ τὰς χεῖρας
  choice: 把自己的双脚和双手捆住
  rationale: 保留ἑαυτοῦ的反身含义，表明亚迦布捆的是自己；“捆住”也与后文δήσουσιν形成词语呼应。
- source_word: Τάδε λέγει
  choice: 这样说
  rationale: 与“圣灵”合为“圣灵这样说”，既保留先知宣告的庄重语气，又符合现代汉语表达。
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: 圣灵
  rationale: 这是现代汉语中对该称谓的标准、庄重译法。
- source_word: Τὸν ἄνδρα οὗ ἐστιν ἡ ζώνη αὕτη
  choice: 拥有这条腰带的那个人
  rationale: 保留ἀνήρ所指的具体人物，并以自然汉语表达οὗ ἐστιν的所属关系。
- source_word: οὕτως
  choice: 也要这样
  rationale: 明确把亚迦布刚才的象征行动与即将发生的捆绑连接起来；“也”在汉语中自然显明这种对应。
- source_word: οἱ Ἰουδαῖοι
  choice: 犹太人
  rationale: 原文没有限定为领袖或某一群体，因此不增添原文未明说的范围。
- source_word: παραδώσουσιν
  choice: 把他交到
  rationale: 自然表达敌对情境中的移交，同时不把词义收窄为“出卖”。
- source_word: εἰς χεῖρας ἐθνῶν
  choice: 外族人手中
  rationale: 保留“交到……手中”这一受制于他人的意象；此处ἔθνη指犹太人以外的人。
theological_decisions:
- issue: 圣灵宣告的先知公式
  choice: 圣灵这样说
  alternative: 圣灵说的是这样
  rationale: 所选译法保留Τάδε λέγει所带的经文式先知宣告语气，不额外解释圣灵启示的方式。
- issue: ἑαυτοῦ的所指
  choice: 亚迦布捆住自己的双脚和双手
  alternative: 亚迦布捆住保罗的双脚和双手
  rationale: 反身代词自然回指分词δήσας的主语，即前文的亚迦布；这是以自身行动呈现预言的象征举动。
- issue: οἱ Ἰουδαῖοι的群体范围
  choice: 犹太人
  alternative: 犹太领袖／犹太地区的人
  rationale: 原文只说“犹太人”，不宜在译文中擅自限定为领袖，也不应无充分依据改为纯地域称谓。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“圣灵这样说”保留先知宣告的语体；“外族人”比传统的“外邦人”更便于普通现代读者理解，同时保持此处犹太人与非犹太人的对照。
