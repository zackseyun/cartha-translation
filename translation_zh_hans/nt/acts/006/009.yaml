  text: ἀνέστησαν δέ τινες τῶν ἐκ τῆς συναγωγῆς τῆς λεγομένης Λιβερτίνων καὶ Κυρηναίων καὶ Ἀλεξανδρέων καὶ τῶν ἀπὸ Κιλικίας καὶ Ἀσίας συζητοῦντες τῷ Στεφάνῳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/009.yaml
  text: But some of those from the synagogue called the Synagogue of the Freedmen[a], and of the Cyrenians and Alexandrians, and of those from Cilicia and Asia[b], stood up and began arguing with Stephen.
translation:
  language: zh_hans
  text: 可是，有些人站起来，同司提反辩论；他们来自称为“自由民会堂”[a]的会众，也有古利奈人、亚历山大人和来自基利家、亚细亚[b]的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “自由民”指获得自由的奴隶，也可能包括他们的后裔。原文中这些群体与“会堂”的具体分组关系存在句法上的不同理解，不能据此确定有几所会堂。
    reason: lexical_alternative
  - marker: b
    text: 这里的“亚细亚”指罗马帝国在小亚细亚西部的亚细亚行省，并非现代所说的亚洲。
    reason: cultural_note
lexical_decisions:
- source_word: ἀνέστησαν
  choice: 起来
  rationale: 保留“起身、起来”的具体意象；结合上下文，自然引出反对司提反的行动，而不额外强化为暴动。
- source_word: δέ
  choice: 可是
  rationale: 表示叙事转折：前文讲司提反施行奇事和神迹，此处转入有人反对他。
- source_word: τινες τῶν ἐκ τῆς συναγωγῆς
  choice: 有些人从……会堂的会众中
  rationale: 体现部分属格，说明这些人是该会堂相关群体中的一部分；补出“会众”使现代汉语语意清楚。
- source_word: συναγωγῆς
  choice: 会堂
  rationale: 采用现代中文圣经语境中通行且简洁的称呼，指犹太人的聚会群体或场所。
- source_word: τῆς λεγομένης
  choice: 那称为
  rationale: 忠实表达该分词对会堂名称的引介，语气中性，不译作带贬义的“所谓”。
- source_word: Λιβερτίνων
  choice: 自由民
  rationale: 此词指获释奴隶或其后裔所构成的群体；“自由民”既传达历史含义，也避免音译造成误解。
- source_word: Κυρηναίων καὶ Ἀλεξανδρέων
  choice: 古利奈人、亚历山大人
  rationale: 按来源地转为汉语居民称谓，简洁保留希腊文并列结构。
- source_word: τῶν ἀπὸ Κιλικίας καὶ Ἀσίας
  choice: 来自基利家和亚细亚的人
  rationale: ἀπό表示来源地；保留两个古代地名，并以脚注澄清“亚细亚”的历史地理范围。
- source_word: συζητοῦντες
  choice: 辩论起来
  rationale: 上下文不是中性的讨论，而是言语上的对抗；“辩论”保留交锋性质，同时不过度译成争吵。
- source_word: τῷ Στεφάνῳ
  choice: 跟司提反
  rationale: 该与格在συζητέω之后表示辩论的对象，现代汉语自然表达为“跟司提反”。
theological_decisions:
- issue: 会堂成员分组及会堂数量的句法歧义
  choice: 译作同一所“自由民会堂”的会众中包括各地来的人
  alternative: 理解为自由民、古利奈人、亚历山大人、基利家人和亚细亚人分别属于两个或多个会堂
  rationale: 希腊文只明确出现一个συναγωγή，但各并列属格的关系存在句法讨论空间。正文采用最直接、最易读的单一会堂理解，同时不加入原文没有的会堂数目。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“跟……辩论起来”适合叙事语体；地名沿用中文圣经中较通行的译名。正文所有脚注标记均已对应出现。
