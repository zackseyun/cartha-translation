  text: καὶ οὐκ ἴσχυον ἀντιστῆναι τῇ σοφίᾳ καὶ τῷ πνεύματι ᾧ ἐλάλει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/010.yaml
  text: And they were not able to withstand the wisdom and the Spirit by which he was speaking[a].
translation:
  language: zh_hans
  text: 他们无法抵挡司提反说话所凭的智慧和圣灵[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文“灵”可指圣灵，也可指司提反自己的灵或精神。关系从句在语法上直接修饰“灵”；较直译为：“他们无法抵挡那智慧和他藉之说话的灵。”
    reason: 保留 πνεύματι 的指称歧义，并说明关系从句与“灵”的语法联系。
lexical_decisions:
- source_word: ἴσχυον
  choice: 抵挡不住
  rationale: 未完成时配合否定表示持续或反复的无能为力；现代汉语用“抵挡不住”可与后面的不定式合并，自然表达“不能成功抗衡”。
- source_word: ἀντιστῆναι
  choice: 抵挡
  rationale: 此处指在辩论中与司提反对抗却无法站得住；“抵挡”既保留对抗意味，也不额外限定为武力冲突。
- source_word: σοφίᾳ
  choice: 所显出的智慧
  rationale: 定冠词指向司提反言语中具体表现出来的智慧；增补“所显出的”使汉语关系清楚，同时不把智慧仅仅等同于口才。
- source_word: πνεύματι
  choice: 圣灵的能力
  rationale: 上下文（徒6:5）支持将其理解为圣灵；“能力”为使中文句法自然所作的显化，表达圣灵使他说话的作用，但原词本身只是“灵”，故在脚注保留另一理解。
- source_word: ᾧ ἐλάλει
  choice: 说话时所显出的
  rationale: 关系代词为与格，可表示司提反藉着圣灵说话。中文若直译“他藉之说话”生硬，故将持续性的未完成时自然转为“说话时”，并以“所显出的”连接智慧与圣灵所赐的能力。
theological_decisions:
- issue: πνεύματι 是指圣灵还是司提反自己的灵
  choice: 圣灵
  alternative: 司提反说话时所表现的精神或灵
  rationale: 《使徒行传》6:5称司提反满有圣灵，且本节把智慧与灵并列为他言语无法被抗拒的根源，较支持圣灵之解；但希腊词本身未明说“圣”，因此以脚注保存真实歧义。
- issue: 智慧和圣灵是否都受关系从句 ᾧ ἐλάλει 支配
  choice: 将关系从句主要联系于紧邻的“圣灵”，同时让整句表达二者在说话中显明
  alternative: 理解为他凭智慧和灵二者说话
  rationale: 关系代词 ᾧ 为中性单数，在语法上最直接回指同为中性单数的 πνεύματι，而非阴性 σοφίᾳ；译文避免声称关系代词在语法上同时回指两者。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“抵挡不住”简洁有力；正文以自然汉语显明语义关系，脚注保留 πνεῦμα 的词义歧义及较形式对应的句法。
