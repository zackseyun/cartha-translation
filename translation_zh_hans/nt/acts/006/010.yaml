  rationale: 修订删除无原文对应的“能力”，并以“司提反说话所凭的智慧和圣灵”恢复智慧与灵作为对手无法抗衡的对象，同时自然表达司提反凭借灵说话。脚注保留正文采用“圣灵”所涉及的解释性判断，并说明原文关系从句直接联系“灵”。
