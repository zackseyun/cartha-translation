  naturalness: “他们无法抵挡司提反说话所凭的智慧和圣灵”是自然、庄重的现代书面汉语，适合叙事经文；“无法抵挡”恰当地表达在辩论中不能抗衡的意思。
  terminology: 正文采用“圣灵”，与《使徒行传》6:5的语境相符，但不将此判断绝对化；脚注保留“灵”可指司提反自身的灵或精神这一可能。删除“能力”，避免以解释性神学词汇替代原词。
