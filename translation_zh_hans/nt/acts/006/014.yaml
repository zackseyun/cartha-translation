id: ACT.6.14
reference: Acts 6:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἀκηκόαμεν γὰρ αὐτοῦ λέγοντος ὅτι Ἰησοῦς ὁ Ναζωραῖος οὗτος καταλύσει τὸν τόπον τοῦτον καὶ ἀλλάξει τὰ ἔθη ἃ παρέδωκεν ἡμῖν Μωϋσῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/014.yaml
  text: For we heard him saying that this Jesus the Nazarene will destroy this place and will change the customs that Moses handed down to us[a][b][c].
translation:
  language: zh_hans
  text: 因为我们听见他说：‘这个拿撒勒人耶稣[a]要毁坏这地方[b]，并改变摩西传给我们的习俗[c]。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这个拿撒勒的耶稣”。
    reason: lexical_alternative
  - marker: b
    text: “这地方”指圣殿。
    reason: cultural_note
  - marker: c
    text: 或译：“摩西传给我们的传统（或规例）”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκηκόαμεν
  choice: 我们听见
  rationale: 该完成时在这里表示他们声称亲耳听见，且所听见的内容仍与当前指控相关；现代汉语用“听见”自然简洁。
- source_word: γὰρ
  choice: 因为
  rationale: 保留本句对上文指控的解释和举证作用。
- source_word: αὐτοῦ λέγοντος
  choice: 他说
  rationale: 以自然汉语表达听见某人说话的结构，并保留直接听闻之意。
- source_word: Ἰησοῦς ὁ Ναζωραῖος οὗτος
  choice: 这个拿撒勒人耶稣
  rationale: “拿撒勒人”保留Ναζωραῖος的地域称谓；“这个”对应οὗτος，并传达控告者带有轻蔑色彩的强调。
- source_word: καταλύσει
  choice: 要毁坏
  rationale: 在“这地方”所指的圣殿语境中，καταλύω表示拆毁、毁坏；“毁坏”准确而通顺。
- source_word: τὸν τόπον τοῦτον
  choice: 这地方
  rationale: 直译为“这地方”，不在正文中把隐含所指直接解释为圣殿。
- source_word: ἀλλάξει
  choice: 要……改变
  rationale: 直接表达ἀλλάσσω的将来意义；与前面的“要毁坏”共同受“要”管辖，符合现代汉语习惯。
- source_word: τὰ ἔθη
  choice: 习俗
  rationale: 指群体承袭的惯例和宗教生活方式；“习俗”既自然，也避免把它过度限定为成文律例或抽象传统。
- source_word: ἃ παρέδωκεν ἡμῖν Μωϋσῆς
  choice: 摩西传给我们的
  rationale: παραδίδωμι在这里强调把承袭的惯例传递下来；“传给”简明地保留传承含义。
theological_decisions:
- issue: “这地方”的所指
  choice: 正文保留“这地方”，脚注说明是指圣殿。
  alternative: 直接译作“这圣殿”或“这圣所”。
  rationale: 原文使用一般名词τόπος；上下文虽明确指向圣殿，但正文不应把语境解释替代原有措辞。
- issue: 控告者提及耶稣时的语气
  choice: 译作“这个拿撒勒人耶稣”。
  alternative: 译作“拿撒勒的耶稣”或“那位拿撒勒人耶稣”。
  rationale: 保留οὗτος的指示强调以及控告话语中可能带有的轻蔑语气，同时不额外强化敌意。
- issue: 对摩西所传内容的性质
  choice: 译作“习俗”。
  alternative: 译作“传统”或“规例”。
  rationale: ἔθη可涵盖承袭的惯例和实践；“习俗”保持其范围，不把它等同于某一特定神学意义下的律法或传统。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。引号明确这是控告者转述司提反的话；正文保留原文的指示语气和“这地方”的含蓄所指，脚注仅提供必要的词义与文化说明。
