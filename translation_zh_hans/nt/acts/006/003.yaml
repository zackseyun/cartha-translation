revisions:
- from: 所以，弟兄们[b]，要从你们中间选出七个有好见证[a]、充满圣灵[c]和智慧的人来，我们好派他们负责这项事务[d]。
  to: 所以，弟兄们，你们要从中间选出七名有好见证、充满圣灵和智慧的男子，我们将委派他们负责这项事务。
  rationale: 修订仅处理两项可安全确定的源文对应：以“七名……男子”译出ἄνδρας的男性限定，并以“我们将委派”译出καταστήσομεν的未来、正式指定。保留“所以”作为上下文中δέ的自然衔接，保留“有好见证”及“圣灵”，并借脚注保留“灵”这一原文形式及其解释空间。由于正文未采用脚注标记，脚注集按原有语义完整保留，供排版时锚定相应词语。
