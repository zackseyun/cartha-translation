review_pass:
  verdict: revise
  source_fidelity: 草稿总体准确地保留了群体拣选、七人、良好见证、圣灵与智慧，以及使徒正式委派的结构。但“七个……的人”在现代汉语中不标明性别，未能体现ἄνδρας特指成年男性；此外，“我们好派”较像目的表达，弱化了καταστήσομεν的将来时正式委派。
  naturalness: 原句通顺，庄重自然。改为“七名……男子”虽略正式，却清楚、合乎现代书面圣经汉语；“我们将委派他们负责”也比“我们好派他们负责”更直接地对应原文。
  terminology: “弟兄们”“有好见证”“圣灵”“智慧”均适当。“有好见证”可保留其受他人正面见证的含义，并以脚注列出“有好名声”。“圣灵”是合乎路加—使徒行传语境的解释性译法，脚注须说明希腊原文此处仅作“灵”，未明说“圣”。
  issues:
  - severity: medium
    issue: “七个……的人”没有译出ἄνδρας的男性限定。
    rationale: ἄνδρας是ἀνήρ的宾格复数，指成年男性，并非泛指“人”。正文宜明确为“七名……男子”，而不应仅在词汇说明中承认后又在译文中省略。
  - severity: low
    issue: “我们好派他们负责”未充分表达καταστήσομεν的将来时正式委派。
    rationale: “好”在汉语中主要标示目的或便利；原文是“我们将委任／委派……管理”。改为“我们将委派他们负责”可保留未来行动及正式指定的意味。
  revised_text: 所以，弟兄们，你们要从中间选出七名有好见证、充满圣灵和智慧的男子，我们将委派他们负责这项事务。
  revised_footnotes:
