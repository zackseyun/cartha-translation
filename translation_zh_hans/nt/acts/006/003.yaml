  text: ἐπισκέψασθε ⸀δέ, ἀδελφοί, ἄνδρας ἐξ ὑμῶν μαρτυρουμένους ἑπτὰ πλήρεις ⸀πνεύματος καὶ σοφίας, οὓς ⸀καταστήσομεν ἐπὶ τῆς χρείας ταύτης·
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/003.yaml
  text: But brothers[a], select from among yourselves seven men who are well attested, full of the Spirit and wisdom[d][c][b], whom we will appoint over this duty.
translation:
  language: zh_hans
  text: 所以，弟兄们，你们要从中间选出七名有好见证、充满圣灵和智慧的男子，我们将委派他们负责这项事务。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπισκέψασθε
  choice: 选出
  rationale: 这里的中间语态命令式要求群体从自己人中察看并选定合适的人；“选出”自然地表达了辨认与拣选的结果。
- source_word: δέ
  choice: 所以
  rationale: δέ在这里承接上一节使徒提出的方案，并引出会众应采取的行动；结合语境译为“所以”，比机械译作“但是”更符合汉语篇章衔接。
- source_word: ἀδελφοί
  choice: 弟兄们
  rationale: 保留希腊文阳性呼语的形式；在本段群体性 خطاب中可能泛指更广的信徒群体，另以脚注说明。
- source_word: ἄνδρας
  choice: 人
  rationale: ἀνήρ在此明确指成年男性；现代汉语“七个人”本身不明确性别，因此结合“弟兄们”和脚注不足以完整体现原文，然而为自然表达主文采用“七个……的人”。
- source_word: ἐξ ὑμῶν
  choice: 从你们中间
  rationale: 明确这些人要从信徒群体内部选出。
- source_word: μαρτυρουμένους
  choice: 有好见证
  rationale: 保留“受到他人肯定作证”的词义色彩，同时是现代华人基督教语境中可理解的表达；“有好名声”列为脚注替代译法。
- source_word: πλήρεις πνεύματος καὶ σοφίας
  choice: 充满圣灵和智慧
  rationale: 路加—使徒行传的语境强烈指向上帝的灵；中文通常以“圣灵”清楚表达这一所指，但脚注注明原文直译为“灵”，以保留原文未出现ἁγίου这一事实。
- source_word: καταστήσομεν
  choice: 我们好派
  rationale: 表达使徒随后将正式指派这些人承担职责；“好”使希腊文目的性关系在汉语中自然显明。
- source_word: ἐπὶ τῆς χρείας ταύτης
  choice: 负责这项事务
  rationale: ἐπί与καθίστημι的组合表达受命管理或主管；χρεία在上下文中是每日供给的实际事务，不宜窄化为抽象的“需要”。
theological_decisions:
- issue: πνεύματος是泛指人的灵，还是特指圣灵
  choice: 圣灵
  alternative: 灵
  rationale: 路加—使徒行传中，这类赋能服事的语境通常指上帝的灵；但希腊文没有ἁγίου，因此脚注保留较贴近字面的“灵”，避免掩盖原文形式。
- issue: ἀδελφοί所称呼的范围
  choice: 弟兄们
  alternative: 弟兄姊妹们／众信徒
  rationale: 主文保留阳性希腊语形式，不把可能的群体性涵盖直接写进正文；脚注说明该称呼在语境中可能包括更广的信徒群体。
- issue: 本节是否设立后来制度化的教会职分
  choice: 仅译为派人负责这项事务
  alternative: 任命执事
  rationale: 原文没有使用“执事”这一职称；翻译不把后来的制度名称倒置进本节。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式按汉语习惯重组为“选出……来，我们好……”，同时保留群体拣选、使徒指派以及属灵与智慧资格之间的关系。所有脚注标记均置于对应词语之后。
