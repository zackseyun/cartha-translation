id: ACT.6.1
reference: Acts 6:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ἐν δὲ ταῖς ἡμέραις ταύταις πληθυνόντων τῶν μαθητῶν ἐγένετο γογγυσμὸς τῶν Ἑλληνιστῶν πρὸς τοὺς Ἑβραίους ὅτι παρεθεωροῦντο ἐν τῇ διακονίᾳ τῇ καθημερινῇ αἱ χῆραι αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/001.yaml
  text: In those days[a], as the disciples were increasing in number, a complaint arose from the Hellenists against the Hebrews[b], because their widows were being overlooked in the daily distribution.
translation:
  language: zh_hans
  text: 那些日子，门徒的人数不断增加。说希腊语的犹太人[a]向说希伯来语的犹太人发怨言，因为他们的寡妇在每天的供给中被忽略了。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文分别使用“希腊化的人”和“希伯来人”这两个群体称呼。这里很可能是指说希腊语的犹太人，与主要说亚兰语或希伯来语的犹太人相对。
    reason: 文化与语言背景说明；保留原文群体称呼所含的不确定性。
  - marker: b
    text: “供给”也可译作“服事”；“被忽略”也可译作“被疏于照顾”。
    reason: 说明διακονία的宽泛词义及παρεθεωροῦντο的可行译法。
lexical_decisions:
- source_word: Ἐν δὲ ταῖς ἡμέραις ταύταις
  choice: 那些日子
  rationale: 保留时间背景；δέ在此主要起轻微的叙事衔接作用，汉语无需另加“现在”或强转折词。
- source_word: πληθυνόντων τῶν μαθητῶν
  choice: 门徒的人数不断增加
  rationale: 以自然汉语表达属格独立结构所提供的背景情况，并用“不断”体现人数持续增长。
- source_word: ἐγένετο γογγυσμός
  choice: 发怨言
  rationale: γογγυσμός可指私下不满、抱怨或怨言；此处译法自然，也保留群体间不满的意味。
- source_word: τῶν Ἑλληνιστῶν
  choice: 说希腊语的犹太人
  rationale: Ἑλληνισταί在本处最可能指受希腊文化影响、以希腊语为主要语言的犹太人；正文采用可直接理解的表达，脚注说明原文名称及其解释上的限度。
- source_word: πρὸς τοὺς Ἑβραίους
  choice: 向说希伯来语的犹太人
  rationale: πρός标明怨言所针对的对象；“向……发怨言”符合现代汉语。Ἑβραῖοι与前一群体相对，可能主要指说亚兰语或希伯来语的犹太人。
- source_word: παρεθεωροῦντο
  choice: 被忽略了
  rationale: 未完成时被动语态表示持续或反复发生的处境；“被忽略”不预断这种待遇是否出于故意。
- source_word: ἐν τῇ διακονίᾳ τῇ καθημερινῇ
  choice: 在每天的供给中
  rationale: διακονία本义范围包括服事、服务；结合寡妇及后文饭食安排，此处具体指日常物资供给，但以脚注保留较宽的词义。
- source_word: αἱ χῆραι αὐτῶν
  choice: 他们的寡妇
  rationale: αὐτῶν最自然地回指说希腊语的犹太人，直译其群体归属关系。
theological_decisions:
- issue: Ἑλληνισταί与Ἑβραῖοι所指的群体身份
  choice: 正文译为“说希腊语的犹太人”与“说希伯来语的犹太人”，并以脚注交代这是原文群体称呼的可能含义。
  alternative: 音译或较形式化地译为“希利尼派”与“希伯来人”。
  rationale: 上下文是在早期犹太信徒内部区分语言文化群体。意译有助普通读者理解，但“说希伯来语”可能包含亚兰语，因此脚注保留历史和语言上的不确定性。
- issue: 每日διακονία的具体性质
  choice: 译为“每天的供给”。
  alternative: “每天的服事”或“每天的救济”。
  rationale: 后文涉及饭食与寡妇的需要，支持物质供给的语境；但原词本身较宽，脚注说明也可理解为日常服事，避免把制度细节说得过于确定。
- issue: 寡妇被忽略是否出于故意
  choice: 译为“被忽略了”，不说明动机。
  alternative: “受到冷落”或“被故意排除”。
  rationale: 被动动词陈述实际处境，却没有明确行为者或主观意图；译文不应额外判定歧视是故意的。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“发怨言”比“发生抱怨”更符合汉语叙事；分成两句以避免长句累赘。正文直接解释两个群体，脚注补充原文称谓及“希伯来语”可能涵盖亚兰语的情况。
