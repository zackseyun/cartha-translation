  text: οὓς ἔστησαν ἐνώπιον τῶν ἀποστόλων, καὶ προσευξάμενοι ἐπέθηκαν αὐτοῖς τὰς χεῖρας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/006.yaml
  text: These they set before the apostles[a], and after praying[b], they laid their hands on them.
translation:
  language: zh_hans
  text: 众人把这七人带到使徒面前[a]。使徒祷告后，就把手按在他们身上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“众人叫这七人站在使徒面前”。
    reason: lexical_alternative
  - marker: b
    text: “把手按在他们身上”可表示公开的委任或祝福；希腊文在这里仅说出这一行动，并未进一步界定其教会制度上的意义。
    reason: cultural_note
lexical_decisions:
- source_word: οὓς
  choice: 这七人
  rationale: 关系代词回指上一节刚选出的七人；用“这七人”使现代汉语衔接清楚，所增加的信息完全来自紧邻上文。
- source_word: ἔστησαν
  choice: 带到……面前
  rationale: ἵστημι在这里是使役用法，表示使人站在或将人置于某人面前；“带到……面前”自然表达公开呈交的场景，又不预先赋予正式任命的含义。
- source_word: ἐνώπιον τῶν ἀποστόλων
  choice: 使徒面前
  rationale: 准确表达“在使徒面前、在使徒在场之处”；“使徒”保留《使徒行传》中这一群体的通行称谓。
- source_word: προσευξάμενοι
  choice: 祷告后
  rationale: 不定过去时分词与主句动词同属一个隐含主语，通常表示先发生的动作；“祷告后”清楚表达先后次序。
- source_word: ἐπέθηκαν αὐτοῖς τὰς χεῖρας
  choice: 把手按在他们身上
  rationale: 贴近希腊语所描述的具体动作；不将其解释性改写为“按立”“委任”或“祝福”，从而保留经文本身未明确界定的礼仪意义。
theological_decisions:
- issue: 按手行动的性质
  choice: 仅译作“把手按在他们身上”
  alternative: 把他们按立了／委任了他们／为他们祝福
  rationale: 希腊文明确记述按手的行动，却没有在本句中进一步界定其教会制度或神学意义；描述行动本身可避免加入宗派性结论。
- issue: 祷告并按手者的身份
  choice: 正文明确为“使徒”
  alternative: 以含混的“他们”作主语，可能指众人或使徒
  rationale: 分词“祷告”与“按手”共用主语；按叙事衔接、最近的复数人物“使徒”以及行动场景，使徒是最自然的所指。此处明确主语是为现代汉语清晰度服务，并非增加某种按立教义。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“众人”承接上一节的会众；“这七人”明示关系代词的上文所指。句式分为两句，使行动主体和先后顺序清楚，同时避免把按手直接解释为特定宗派意义上的按立。
