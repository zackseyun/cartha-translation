base_translation:
  language: en
  yaml_path: translation/nt/acts/006/013.yaml
  text: They also set up false witnesses who said[c][b][a], “This man does not stop speaking against this holy place and the law,”
translation:
  language: zh_hans
  text: 他们又提出假见证人，声称：“这个人不断说攻击这圣所[a]和律法的话。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣所”在这里具体指圣殿。原文直译为“圣洁的地方”；正文的“这”反映控告者在当地语境中的所指。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστησάν
  choice: 推出
  rationale: 在审讯语境中表示使证人出面、将其带到众人面前作证；“推出”简洁地保留了安排并提出证人的意味。
- source_word: τε
  choice: 又
  rationale: 承接前文并增添下一项行动，现代汉语中“又”自然体现其附加作用。
- source_word: μάρτυρας ψευδεῖς
  choice: 假见证人
  rationale: 这是法律语境中的常用表达，指作虚假见证的人。
- source_word: λέγοντας
  choice: 说
  rationale: 用汉语连动结构自然引出假见证的内容。
- source_word: Ὁ ἄνθρωπος οὗτος
  choice: 这个人
  rationale: 直接对应原文，并保留控告者略带轻蔑而不过度强化的语气。
- source_word: οὐ παύεται
  choice: 不断
  rationale: 体现持续、没有停止的状态；比“从不停止”更自然，也不额外绝对化。
- source_word: λαλῶν ῥήματα
  choice: 说话
  rationale: 原文直译为“说言语”，在现代汉语中显得累赘；“说话”自然表达整个短语，同时保留持续发言的控告。
- source_word: κατὰ
  choice: 攻击
  rationale: 此处带属格，在敌对的法律控告中表示言论针对并反对圣所和律法；“攻击”比单纯“谈论”更准确。
- source_word: τοῦ τόπου τοῦ ἁγίου
  choice: 这圣所
  rationale: 原文是“这/那圣洁的地方”一类表达，语境明确指耶路撒冷圣殿；“这”体现现场所指，“圣所”既简洁又保留宗教场所含义。
- source_word: τοῦ νόμου
  choice: 律法
  rationale: 在犹太语境中指摩西律法；“律法”是现代中文圣经语体中清楚而通行的对应词。
theological_decisions:
- issue: “圣所”和“律法”的所指
  choice: 正文保留“这圣所和律法”，以语境指向耶路撒冷圣殿和摩西律法
  alternative: 扩写为“耶路撒冷圣殿和摩西律法”
  rationale: 原文没有直接说出“耶路撒冷”或“摩西”，不宜把语境解释写入正文；脚注说明“圣所”的具体所指即可。
- issue: 控告的强度
  choice: 译为“说话攻击”
  alternative: 译为“亵渎”或较弱的“谈论”
  rationale: κατά在此表达敌对指向，但原文并未使用“亵渎”一词；“攻击”保留法律控告的敌意而不将罪名强化。
translation_notes:
  register: 采用现代、庄重而易懂的叙事和法庭控告语体。“不断说话攻击”兼顾λαλῶν ῥήματα的明说成分与自然汉语，避免生硬的“说攻击的话”。
