- from: 公议会[a]里坐着的众人都定睛看他，见他的面容好像天使的面容。
  to: 公会[a]里坐着的众人都定睛看他，见他的面容好像天使的面容。
  rationale: 修订仅调整 συνέδριον 的中文机构名称及其脚注说明，使术语更合乎现代中文圣经用语，并纠正原脚注对意译与音译关系的表述。其余措辞忠实保留希腊文的总括、坐席状态、专注注视，以及“如同天使面容”的开放性比喻，未将其限定为光辉、安详或其他特质。
