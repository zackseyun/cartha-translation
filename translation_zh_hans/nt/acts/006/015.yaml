  source_fidelity: 译文准确传达了“众人”“坐着”“定睛看”“看见”“好像”及“天使的面容”这一未具体说明的比较。惟“公议会”并非现代中文圣经语境中最自然、最通行的称呼；此处的 συνέδριον 在上下文中指犹太人的公会／议事审判团体。
  naturalness: “公会里坐着的众人都定睛看他”自然、庄重，也清楚保留了原文的场景与注视的持续性。“面容好像天使的面容”保留重复，虽略带文言色彩，但适合经文叙事语体且不越过原文。
  terminology: 建议将“公议会”改为中文圣经中较通行的“公会”。原脚注将“公议会”说成“音译”为“撒赫德林”，术语说明不准确：“公议会”是意译性称呼，而 Sanhedrin 才是相关名称的拉丁字母拼写；脚注宜简明说明其为犹太人的统治性议事和审判机构，并保留 Sanhedrin 作为可选称呼。
