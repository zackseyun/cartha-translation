    rationale: 在现代汉语圣经传统及本节犹太法律—宗教机构的语境中，“公会”是更常见、辨识度更高的译名；“公议会”较生硬，且容易被理解为泛指公共议会。
  - severity: medium
    issue: 脚注中“也可音译为‘撒赫德林’”的表述不严谨
    rationale: “公议会”不是“撒赫德林”的音译。应将 Sanhedrin 作为该犹太统治议事机构的常用外文名称／别称处理，而不把意译词与音译关系混同。
