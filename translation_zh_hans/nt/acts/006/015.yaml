  text: καὶ ἀτενίσαντες εἰς αὐτὸν ⸀πάντες οἱ καθεζόμενοι ἐν τῷ συνεδρίῳ εἶδον τὸ πρόσωπον αὐτοῦ ὡσεὶ πρόσωπον ἀγγέλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/015.yaml
  text: And all who were sitting in the council[a], fixing their eyes on him, saw his face like the face of an angel.
translation:
  language: zh_hans
  text: 公会[a]里坐着的众人都定睛看他，见他的面容好像天使的面容。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “公会”指当时犹太人的统治性议事和审判机构；也常称为“公议会”（Sanhedrin）。
    reason: cultural_note
lexical_decisions:
- source_word: ἀτενίσαντες
  choice: 定睛看
  rationale: 该词表示专注而持续地注视；“定睛看”既保留其强度，也符合现代汉语叙事表达。
- source_word: πάντες οἱ καθεζόμενοι
  choice: 坐着的众人都
  rationale: 同时表达 πάντες 的全体性与 καθεζόμενοι 所描绘的坐席状态，中文语序自然。
- source_word: συνεδρίῳ
  choice: 公议会
  rationale: 此处指犹太人的最高议事及审判机构；“公议会”是中文圣经语境中清楚且相对简洁的称呼，脚注补充其性质。
- source_word: πρόσωπον
  choice: 面容
  rationale: 此处指司提反可见的脸；“面容”在连续两次出现时较为庄重自然，并避免“脸……脸”的口语重复感。
- source_word: ὡσεὶ
  choice: 好像
  rationale: 准确保留比较或相似之意，不把比拟解释为身份等同。
- source_word: ἀγγέλου
  choice: 天使
  rationale: 在此叙事语境中，ἄγγελος 最自然地指超自然的天使，而不是普通使者。
theological_decisions:
- issue: “好像天使的面容”所指的具体相似之处
  choice: 保留为未加说明的比喻，不具体界定相似之处
  alternative: 明确译成发光、安详无辜或带有属天威严
  rationale: 希腊文只陈述面容相似，并未说明究竟是光辉、安详、威严还是这些特征的结合；译文不替原文消除这一开放性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“定睛看”传达持续注视；“面容好像天使的面容”保留原文重复和比喻的开放性。
