id: ACT.6.8
reference: Acts 6:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Στέφανος δὲ πλήρης ⸀χάριτος καὶ δυνάμεως ἐποίει τέρατα καὶ σημεῖα μεγάλα ἐν τῷ λαῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/008.yaml
  text: Stephen[a], full of grace and power, was doing great wonders and signs among the people.
translation:
  language: zh_hans
  text: 司提反满有恩典[a]和能力，在百姓中不断行大奇事和神迹。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“满有信心和能力”，而不是“满有恩典和能力”。
    reason: textual_variant
lexical_decisions:
- source_word: δὲ
  choice: 不另译出
  rationale: 此处δέ是轻微的叙事衔接语，并非强烈转折。现代汉语可借新句和话题转换自然承接；若译作“但是”会夸大对比，译作“这时”又会加入原文没有明说的时间意味。
- source_word: πλήρης χάριτος καὶ δυνάμεως
  choice: 满有恩典和能力
  rationale: πλήρης接属格，表示司提反被这两种特质充满或以之为显著特征。“满有”在现代汉语中自然、庄重，也保留原文的充盈意味。
- source_word: χάριτος
  choice: 恩典
  rationale: 依据SBLGNT正文所读χάριτος直译。“恩典”既可涵盖上帝所赐的恩惠，也保留《使徒行传》中的神学与文学呼应；异文“信心”另载脚注。
- source_word: δυνάμεως
  choice: 能力
  rationale: δύναμις在此与奇事、神迹相连，指施行这些作为的力量。“能力”是自然且不夸饰的对应词，也可让上下文显明其来自上帝。
- source_word: ἐποίει
  choice: 不断行
  rationale: 未完成时表达过去持续或反复发生的行动。“不断行”比单纯的“行了”更清楚地传达这一体貌，同时保持汉语流畅。
- source_word: τέρατα καὶ σημεῖα
  choice: 奇事和神迹
  rationale: 保留路加常用的成对表达：τέρατα突出使人惊异的性质，σημεῖα突出指示意义。没有一概译成“神迹”，以免抹平两词的差别。
- source_word: μεγάλα
  choice: 大
  rationale: μεγάλα同时修饰“奇事”和“神迹”。汉语把“大”置于并列短语之前，可自然统摄两者，不另增“许多”等原文没有的数量含义。
- source_word: ἐν τῷ λαῷ
  choice: 在百姓中
  rationale: 介词短语表示这些作为发生的群体范围。“百姓”符合《使徒行传》中λαός对民众、尤其犹太民众的常见指称，也比“在人民里面”自然。
theological_decisions:
- issue: χάριτος与πίστεως的文本异文
  choice: 正文采用“恩典”
  alternative: 有些抄本作“信心”
  rationale: 所给SBLGNT正文读χάριτος，因此正文按原文译为“恩典”。πίστεως是具有解释意义的异文，故在脚注中保留，而不以传统或教义偏好取代正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“满有”保留经文语体但并不晦涩；“不断行”体现未完成时的持续或反复动作。脚注标记紧接异文所涉及的“恩典”，便于读者准确对应。
