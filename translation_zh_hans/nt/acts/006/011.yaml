  text: τότε ὑπέβαλον ἄνδρας λέγοντας ὅτι Ἀκηκόαμεν αὐτοῦ λαλοῦντος ῥήματα βλάσφημα εἰς Μωϋσῆν καὶ τὸν θεόν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/011.yaml
  text: Then they secretly induced men to say[a], “We have heard him speaking blasphemous words against Moses and God.”
translation:
  language: zh_hans
  text: 于是，他们暗中唆使几名男子说[a]：“我们听见他说亵渎摩西和上帝的话。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“怂恿几名男子说”或“暗中指使几名男子说”。希腊语动词含有暗中教唆、指使的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: 于是
  rationale: 承接上文并推进叙事，既表达时间先后，也符合现代汉语叙事习惯。
- source_word: ὑπέβαλον
  choice: 暗中唆使
  rationale: 该动词在此表示以隐秘、幕后方式怂恿或教唆别人；“暗中唆使”兼顾其使动意义和不正当、隐蔽的语气。
- source_word: ἄνδρας
  choice: 几个人
  rationale: ἀνήρ本指成年男子；但此处重点是他们所唆使的一些人。汉语“几个人”自然表达不定复数，不额外突出原文在本语境中并非重点的性别信息。
- source_word: λέγοντας
  choice: 说
  rationale: 该分词依附于“唆使”，自然译作“唆使几个人说”，清楚表达被唆使的具体行为。
- source_word: Ἀκηκόαμεν
  choice: 我们听见
  rationale: 希腊语完成时强调他们声称已经听见且可据此作证；现代汉语用“听见”最自然，语境已显示结果仍然有效。
- source_word: αὐτοῦ λαλοῦντος
  choice: 他说
  rationale: 听觉动词后的结构表示听见他在讲话；汉语“听见他说……”简洁自然，并由后面的宾语说明所说内容的性质。
- source_word: ῥήματα βλάσφημα
  choice: 亵渎……的话
  rationale: 采用汉语动宾结构重组“亵渎性的话语”，保留βλάσφημα在宗教与指控语境中的严重含义。
- source_word: εἰς Μωϋσῆν καὶ τὸν θεόν
  choice: 亵渎摩西和上帝
  rationale: εἰς在敌对指控语境中指向言语冒犯的对象；汉语直接以“亵渎”带出“摩西和上帝”最自然，也不减弱控告的力度。
theological_decisions:
- issue: 对司提反之控告的性质
  choice: 按叙事中这些人所说的话，译为“亵渎摩西和上帝的话”，保留控告的宗教和司法分量，但不暗示控告属实。
  alternative: 译为“毁谤摩西和上帝的话”。
  rationale: βλάσφημα既可涉及毁谤，也在此具有明显的宗教性“亵渎”含义。上下文表明这是被唆使者提出的控告，因此译文应忠实报告控告而不替叙述者认定其真实性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“暗中唆使”准确传达幕后教唆的语气；引语保持直接、有力。脚注标记已置于正文对应位置。
