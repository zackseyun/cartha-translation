source:
  edition: SBLGNT
  text: καὶ ἤρεσεν ὁ λόγος ἐνώπιον παντὸς τοῦ πλήθους, καὶ ἐξελέξαντο Στέφανον, ἄνδρα ⸀πλήρης πίστεως καὶ πνεύματος ἁγίου, καὶ Φίλιππον καὶ Πρόχορον καὶ Νικάνορα καὶ Τίμωνα καὶ Παρμενᾶν καὶ Νικόλαον προσήλυτον Ἀντιοχέα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/005.yaml
  text: And the proposal pleased the whole multitude[a], and they chose Stephen, a man full of faith and of the Holy Spirit, Philip, Prochorus, Nicanor, Timon, Parmenas, and Nicolaus[c][b], a proselyte of Antioch.
translation:
  language: zh_hans
  text: 这个提议得到全体会众的赞同；他们选出了司提反——一个满有信心[a]和圣灵的人——以及腓利、伯罗哥罗、尼迦挪、提门、巴米拿和来自安提阿、归信犹太教的尼哥拉[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “信心”也可译作“忠信”。希腊语πίστις可表示信靠，也可表示忠信。
    reason: lexical_alternative
  - marker: b
    text: “归信犹太教的人”指原为外族、后来接受犹太信仰的人。
    reason: cultural_note
lexical_decisions:
- source_word: ὁ λόγος
  choice: 这提议
  rationale: 指使徒刚才提出的安排；译作“提议”比抽象的“话”更准确，也自然承接上文。
- source_word: ἤρεσεν ... ἐνώπιον παντὸς τοῦ πλήθους
  choice: 得到全体会众的赞同
  rationale: 按现代汉语习惯表达该提议获得整个聚集群体认可的意思；“会众”在此仅指聚集的人群，不预设后世教会制度。
- source_word: ἐξελέξαντο
  choice: 他们选出了
  rationale: 直接表达中间语态在此所指的共同选取行动，不采用可能带有现代制度色彩的“选举”。
- source_word: πλήρης πίστεως
  choice: 满有信心
  rationale: πίστις在此最自然地指对神的信靠；“信心”是现代汉语中清楚而常用的表达，同时以脚注保留“忠信”的可能性。
- source_word: πνεύματος ἁγίου
  choice: 圣灵
  rationale: 《使徒行传》的语境表明这是指神的圣灵，而不是一般的属灵品质。
- source_word: προσήλυτον
  choice: 归信犹太教的人
  rationale: 直接说明其历史文化含义，较音译术语“入教者”更便于普通读者理解。
- source_word: Ἀντιοχέα
  choice: 安提阿人
  rationale: 以自然简洁的汉语表达尼哥拉与安提阿的地域身份。
- source_word: Στέφανον, Φίλιππον, Πρόχορον, Νικάνορα, Τίμωνα, Παρμενᾶν, Νικόλαον
  choice: 司提反、腓利、伯罗哥罗、尼迦挪、提门、巴米拿、尼哥拉
  rationale: 采用现代中文圣经读者较熟悉的人名译法，并用汉语列举方式清楚呈现七人属于同一组。
theological_decisions:
- issue: 司提反的πίστις应译作“信心”还是“忠信”
  choice: 信心
  alternative: 忠信
  rationale: 该词既可表示信靠，也可表示忠信；这里与“圣灵”并列描写司提反，主要译文采用较自然的“信心”，但不排除品格上“忠信”的含义，故在脚注保留。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“这提议”承接上文；用破折号限定说明司提反，避免将其描述误套用于其余六人；名单按现代汉语习惯排列，不机械复制希腊语的连续连词。
