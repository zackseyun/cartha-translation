revisions:
- from: 这提议得到全体会众的赞同。他们选出了司提反——一个满有信心[a]和圣灵的人——又选了腓利、伯罗哥罗、尼迦挪、提门、巴米拿和尼哥拉[b]；尼哥拉是安提阿人，也是归信犹太教的人。
  to: 这个提议得到全体会众的赞同；他们选出了司提反——一个满有信心[a]和圣灵的人——以及腓利、伯罗哥罗、尼迦挪、提门、巴米拿和来自安提阿、归信犹太教的尼哥拉[b]。
