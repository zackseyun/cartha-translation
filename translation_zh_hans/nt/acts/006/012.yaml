  naturalness: “文士”和“公会”均为现代中文读者及中文圣经语体中稳定、自然的历史称谓。“突然上前，抓住他”清晰自然；以分号连接两组连贯动作，避免“又……又……”造成的轻微重复。
  terminology: 建议将“经学家”改为“文士”，以对应γραμματεῖς这一犹太法律与经卷专家的历史职分，而非泛指现代学术意义的经学研究者。建议将“公议会”改为“公会”；脚注保留“议会”这一较宽泛的词义选项，并说明此处很可能是犹太公会。
