- from: 于是，他们煽动百姓、长老和经学家，又突然上前抓住他，把他带到公议会[a]面前。
  to: 他们煽动百姓、长老和文士；又突然上前，抓住他，把他带到公会[a]面前。
  rationale: 修订仅调整两个历史机构／职分术语，使其符合现代标准汉语和中文圣经的常用表达，并消除“公议会”可能造成的机构误联想。其余措辞保留原稿对希腊文动作力度、叙事顺序及“带到……面前”司法语境的准确表达。
