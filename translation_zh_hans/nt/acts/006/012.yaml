  text: συνεκίνησάν τε τὸν λαὸν καὶ τοὺς πρεσβυτέρους καὶ τοὺς γραμματεῖς, καὶ ἐπιστάντες συνήρπασαν αὐτὸν καὶ ἤγαγον εἰς τὸ συνέδριον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/012.yaml
  text: So they stirred up the people and the elders and the scribes[a], and coming upon him, they seized him and brought him before the Sanhedrin,
translation:
  language: zh_hans
  text: 他们煽动百姓、长老和文士；又突然上前，抓住他，把他带到公会[a]面前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“议会”。希腊语συνέδριον可泛指议事或审判机构；这里很可能特指犹太人的最高议事与审判机构，即公会。
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεκίνησάν
  choice: 煽动
  rationale: 表达使众人情绪激动并采取行动的使役意味；比“鼓动”更能体现此处的敌意，又不额外断定发生了暴力骚乱。
- source_word: τε
  choice: 于是
  rationale: 此处是轻微的叙事连接词；“于是”自然承接上文及其后果，不赋予该虚词过强的强调。
- source_word: τὸν λαὸν
  choice: 百姓
  rationale: 直接保留λαός所指的民众，不收窄为眼前的一小群“群众”。
- source_word: τοὺς πρεσβυτέρους
  choice: 长老
  rationale: 在耶路撒冷的宗教司法语境中，指有公认地位的犹太领袖，而非泛指年长男子。
- source_word: τοὺς γραμματεῖς
  choice: 经学家
  rationale: 指熟悉并讲授圣经及律法的专业人士；“经学家”在现代汉语中比音译式或传统色彩较浓的“文士”更易理解，同时保留其历史职分。
- source_word: ἐπιστάντες
  choice: 突然上前
  rationale: 体现ἐφίστημι在此处所含的突然而至、逼近之意，同时与随后“抓住”形成清楚的动作顺序。
- source_word: συνήρπασαν
  choice: 抓住
  rationale: 表达强行控制住某人；不增添原文未明确说明的“拖走”等动作细节。
- source_word: ἤγαγον
  choice: 带到
  rationale: 自然表达把人押送至某处或某机构面前；前文“抓住”已交代强制性，无须在此重复强化。
- source_word: τὸ συνέδριον
  choice: 公议会
  rationale: 在使徒行传的耶路撒冷语境中，特指犹太人的最高议事与审判机构；“公议会”既有历史专指性，也适合现代中文圣经语体。
theological_decisions:
- issue: συνέδριον所指的机构
  choice: 公议会
  alternative: 议会
  rationale: 上下文提到长老和经学家，地点又在耶路撒冷，因此这里最可能特指犹太公议会。正文采用专名，但脚注保留较宽泛的词义可能。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“经学家”兼顾历史职分与普通读者的可理解性；“公议会面前”明确表达他是被押到该审判机构受审，而非仅被带进某个建筑物。
