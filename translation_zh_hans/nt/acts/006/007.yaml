  text: Καὶ ὁ λόγος τοῦ θεοῦ ηὔξανεν, καὶ ἐπληθύνετο ὁ ἀριθμὸς τῶν μαθητῶν ἐν Ἰερουσαλὴμ σφόδρα, πολύς τε ὄχλος τῶν ἱερέων ὑπήκουον τῇ πίστει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/007.yaml
  text: And the word of God kept increasing[a], and the number of the disciples in Jerusalem kept multiplying greatly, and a large crowd of the priests were becoming obedient to the faith.
translation:
  language: zh_hans
  text: 神的道不断增长；在耶路撒冷，门徒的数目大大增多；有许多祭司也顺从这信仰[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“顺从信心”或“顺从信仰”。这里的“信仰”也可能指他们所接受的信仰内容或福音信息，而不只是内心的相信。
    reason: 保留τῇ πίστει可能具有的主观或客观含义，并说明它是“顺从”的对象，不误作“以信心”的方式表达。
lexical_decisions:
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: 神的道
  rationale: 保留圣经中“神的道”这一常见表达，既可指神所说的话，也可指所传讲的信息，不把含义过度限定为某一种。
- source_word: ηὔξανεν
  choice: 不断兴旺
  rationale: 未完成时表达持续发展；“兴旺”保留“道增长”的希腊语比喻，同时符合现代汉语的圣经语体。
- source_word: ἐπληθύνετο ὁ ἀριθμὸς τῶν μαθητῶν
  choice: 门徒的数目大大增加
  rationale: 明确保留“门徒的数目”这一结构及μαθηταί的“门徒”用语；“增加”自然表达人数持续扩展，并由“大大”传达σφόδρα的加强语气。
- source_word: ἐν Ἰερουσαλὴμ
  choice: 在耶路撒冷
  rationale: 直接表达地点，并前置以使汉语句序自然。
- source_word: πολύς τε ὄχλος τῶν ἱερέων
  choice: 一大群祭司也
  rationale: “一大群”保留ὄχλος的群体性，不仅抽象地说人数很多；“也”自然承接τε所表达的附加关系。
- source_word: ὑπήκουον
  choice: 渐渐顺从
  rationale: “顺从”准确表达ὑπακούω；“渐渐”体现未完成时所呈现的持续过程，但不把它仅理解为外在服从。
- source_word: τῇ πίστει
  choice: 这信仰
  rationale: 定冠词支持较客观的含义，即他们所接受和持守的信仰或福音信息；“这”在汉语中自然体现其特指性，同时脚注保留“信心”等可能理解。
theological_decisions:
- issue: τῇ πίστει中πίστις的主观或客观含义
  choice: 这信仰
  alternative: 信心；所信的信息
  rationale: 上下文及定冠词容许πίστις指基督徒所信的内容，而不只是个人内心的信靠。“这信仰”较能保留客观意义，但不明确增添“基督教”一词；脚注说明其他可能性，以保留原文张力。
- issue: ὑπήκουον所表达的是持续服从还是归信过程
  choice: 渐渐顺从
  alternative: 顺从；开始顺从
  rationale: 未完成时呈现持续或逐步发生的情形。“渐渐顺从”适合本节群体不断扩大的语境，同时避免断言每个人都经历同一种明确分阶段的归信过程。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“神的道”“门徒”“祭司”等核心术语保持稳定；用分号呈现原文先述神的道兴旺、再述人数增长的推进关系。
