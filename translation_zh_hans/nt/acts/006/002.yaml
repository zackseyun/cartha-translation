  text: προσκαλεσάμενοι δὲ οἱ δώδεκα τὸ πλῆθος τῶν μαθητῶν εἶπαν· Οὐκ ἀρεστόν ἐστιν ἡμᾶς καταλείψαντας τὸν λόγον τοῦ θεοῦ διακονεῖν τραπέζαις·
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/002.yaml
  text: So the Twelve called together the whole group of the disciples and said[c][b][a], “It is not right for us to abandon the word of God to serve tables.”
translation:
  language: zh_hans
  text: 于是，十二人召集全体门徒[a]，说：“我们撇下上帝的道，去管理饭食的事[c]，是不合宜的[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“众门徒”或“门徒会众”。
    reason: lexical_alternative
  - marker: b
    text: 或译“是不可取的”或“是不能令人满意的”。
    reason: lexical_alternative
  - marker: c
    text: 直译“服侍桌子”；按上下文，指办理群体膳食及相关资源分配等实际事务。
    reason: cultural_note
lexical_decisions:
- source_word: προσκαλεσάμενοι
  choice: 召集
  rationale: 该不定过去时中间语态分词表示十二人把门徒群体召来聚集；“召集”自然、简洁，也保留了召开集会的意味。
- source_word: δὲ
  choice: 于是
  rationale: 这里的 δέ 推进叙事，承接前文出现的问题，引出十二人的回应；“于是”比强转折词更符合语境。
- source_word: οἱ δώδεκα
  choice: 十二人
  rationale: 原文是对使徒核心群体的固定称呼，但没有明说“使徒”；译作“十二人”既保留这一称号，也避免增添原文未出现的名词。
- source_word: τὸ πλῆθος τῶν μαθητῶν
  choice: 全体门徒
  rationale: πλῆθος 在此指门徒组成的整体会众；“全体门徒”符合现代汉语，并表达其集合性的力量。脚注保留“众门徒”等可能译法。
- source_word: Οὐκ ἀρεστόν ἐστιν
  choice: 是不合宜的
  rationale: ἀρεστόν 可指令人满意、可接受或合宜；在此涉及职责安排是否恰当。“不合宜”表达适切性判断，又不把实际服侍说成在道德上错误。
- source_word: ἡμᾶς καταλείψαντας
  choice: 我们撇下
  rationale: καταλείπω 表示离开、留下不顾；“撇下”保留原文较强的语气，同时不直接解释成主观轻忽。
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: 上帝的道
  rationale: 这是透明且具有经文传统共鸣的译法；在《使徒行传》中也能自然指从上帝而来的宣讲信息。
- source_word: διακονεῖν
  choice: 服侍
  rationale: 该词在此表示实际服务；“服侍”是自然现代汉语，并未提前赋予后来制度化的教会职分含义。
- source_word: τραπέζαις
  choice: 饭桌
  rationale: 原文直译为复数“桌子”。结合分配饭食的近邻语境，“饭桌”在正文中较易理解，同时用脚注说明它可能涵盖群体膳食及资源分配等实际事务，避免把指涉限定得过死。
theological_decisions:
- issue: 使徒宣讲上帝之道与实际服务之间的优先次序
  choice: 译为“是不合宜的”，把这句话呈现为职责与呼召安排是否恰当的问题。
  alternative: 译为“是不对的”或“不是上帝所喜悦的”。
  rationale: 原文是在区分责任重点，并非贬低饭食和资源分配等实际服务的属灵价值。“不合宜”既保留使徒所作的明确判断，也避免暗示实际服务本身低人一等。
- issue: “饭桌”的具体所指
  choice: 正文保留具体意象“服侍饭桌”，脚注说明其语境范围。
  alternative: 直接释义为“管理饭食和款项的分配”。
  rationale: τραπέζαις 本身具有一定开放性，可能侧重供餐，也可能连带群体资源的管理。正文不把这一张力静默化解，解释留在脚注。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“十二人”保留原文称号的简洁性；“撇下上帝的道”维持原句的力度；“服侍饭桌”有意保留原文意象和一定歧义，并由脚注提供必要的文化语境。
