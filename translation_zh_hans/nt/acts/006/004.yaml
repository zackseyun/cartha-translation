  text: ἡμεῖς δὲ τῇ προσευχῇ καὶ τῇ διακονίᾳ τοῦ λόγου προσκαρτερήσομεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/004.yaml
  text: But we will devote ourselves to prayer and to the ministry of the word[a].
translation:
  language: zh_hans
  text: 但我们要专心祷告，并致力于传讲神话语的服事[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“话语的服事”。“服事”一词也可译为“职事”或“服务”；这里指传讲神话语的工作。
    reason: 保留 διακονία 的词义范围和原文“话语的服事”结构，同时说明其在本节语境中的所指。
lexical_decisions:
- source_word: ἡμεῖς
  choice: 我们
  rationale: 希腊文显式使用第一人称复数代词，带有强调和对比意味；中文以“我们”配合“但”自然表达这种对比，无须另加“我们自己”。
- source_word: δὲ
  choice: 但
  rationale: 承接上文把饭食方面的事务交给别人办理的安排，此处具有明显的对比作用，“但”最符合语境。
- source_word: τῇ προσευχῇ
  choice: 专心祷告
  rationale: 与 προσκαρτερέω 连用，表示持续专注的对象；中文用“专心祷告”自然表达恒常投入。
- source_word: διακονίᾳ
  choice: 传讲……的服事（在正文中动态表达为“传讲”）
  rationale: διακονία 可指“服事”或“职事”。在此指使徒围绕话语所承担的服事；正文用动词“传讲”使现代中文流畅，脚注保留较贴近形式的另一译法。
- source_word: τοῦ λόγου
  choice: 神的话语
  rationale: λόγος 在《使徒行传》的语境中指所宣讲的神的信息。原文虽未明说“神”，但中文补出所属关系可避免被误解为一般言谈，并符合本书对“这道／神的道”的用法。
- source_word: προσκαρτερήσομεν
  choice: 要专心
  rationale: 将来时主动直陈语气表达使徒接下来的坚定安排；“要专心”兼顾持续投入和郑重承诺。为使两个并列对象清楚，中文重复“专心”。
theological_decisions:
- issue: διακονία 在本节与上文饭食服事形成对照时的译法
  choice: 正文译为“传讲神的话语”，脚注保留“服事神的话语”
  alternative: “神话语的职事”或“话语的服事”
  rationale: 正文采用自然中文说明这项服事的实际内容，同时不把它处理成与“服事”无关的身份或圣职。脚注保留 διακονία 的“服事／职事”语义，避免引入经文本身没有明确规定的圣俗或教牧—平信徒区分。
- issue: τοῦ λόγου 是否补明为“神的话语”
  choice: 神的话语
  alternative: 这道；话语；信息
  rationale: 在本书语境中，λόγος 所指是使徒所宣讲的神的信息。补出“神的”是中文中的语境明示，不把它限定为某一特定教义体系；脚注所列直译仍让读者看见原文的简洁表达。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“但我们”保留与上文的对比；重复“专心”使两个并列重点在中文中清楚有力。避免生硬的“话语的服事”，同时用脚注呈现原文结构及词义张力。
