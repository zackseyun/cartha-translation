  naturalness: “专心祷告，并致力于传讲神话语的服事”是现代普通话中庄重、通顺的表达；“致力于”自然承载持续专注的将来承诺，并避免机械重复“专心”。
  terminology: “服事”对应 διακονία，避免把该词缩窄为制度性“职事”或仅仅“传讲”。“神话语”在《使徒行传》语境中可自然指 λόγος 所指的神所启示、所宣讲的信息；脚注保留较贴近原文结构的“话语的服事”，并说明“服事／职事”的词义选项。
