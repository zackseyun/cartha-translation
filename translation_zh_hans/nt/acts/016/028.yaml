  text: ἐφώνησεν δὲ ⸂φωνῇ μεγάλῃ ὁ Παῦλος⸃ λέγων· Μηδὲν πράξῃς σεαυτῷ κακόν, ἅπαντες γάρ ἐσμεν ἐνθάδε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/028.yaml
  text: But Paul shouted with a loud voice[a], saying, “Do not do yourself any harm, for we are all here.”
translation:
  language: zh_hans
  text: 保罗却高声喊道：“不要伤害自己，因为我们全都在这里！”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐφώνησεν
  choice: 喊道
  rationale: 此处指在紧急情势下高声发出话语；结合“φωνῇ μεγάλῃ”，译为“喊道”自然且有力度。
- source_word: δὲ
  choice: 却
  rationale: 承接上一节狱卒正要自杀的行动，并突出保罗及时制止的转折。
- source_word: φωνῇ μεγάλῃ
  choice: 大声
  rationale: 这是方式与格，译为“大声”既准确表达声音洪亮，也符合现代汉语习惯。
- source_word: λέγων
  choice: 道
  rationale: 该分词引出保罗所说的内容，融入“喊道”可避免生硬重复。
- source_word: Μηδὲν πράξῃς σεαυτῷ κακόν
  choice: 不要伤害自己
  rationale: 原文直译近于“不要对自己做任何坏事”，语义较宽；在此语境中明确指制止狱卒自伤，现代汉语用“不要伤害自己”准确自然。
- source_word: ἅπαντες
  choice: 全都
  rationale: 强调在场人员无一缺少；“全都”比单用“都”更能传达其总体性。
- source_word: γάρ
  choice: （不显译）
  rationale: γάρ说明不可自伤的理由。汉语中前后两句的因果关系在语境里清楚，直接说“我们全都在这里”更符合紧急喊话的自然表达。
- source_word: ἐνθάδε
  choice: 在这里
  rationale: 直接表达说话者所在的位置，简洁自然。
- source_word: ὁ Παῦλος
  choice: 保罗
  rationale: 采用现代中文圣经传统中通行的人名译法。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。保留“却”所表达的情节转折，并以短促有力的直接引语呈现紧急制止。原文禁令虽字面较宽，但上下文明确涉及自伤，因此正文采用自然的“不要伤害自己”，无需脚注。
