  text: ἀπήγγειλεν δὲ ὁ δεσμοφύλαξ τοὺς λόγους ⸀τούτους πρὸς τὸν Παῦλον, ὅτι Ἀπέσταλκαν οἱ στρατηγοὶ ἵνα ἀπολυθῆτε· νῦν οὖν ἐξελθόντες πορεύεσθε ἐν εἰρήνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/036.yaml
  text: 'And the jailer reported these words to Paul: “The magistrates have sent word that you may be released[a]. So now[b], come out and go in peace.”'
translation:
  language: zh_hans
  text: 狱卒把这些话告诉保罗：“官长[a]已经传话说，要释放你们。现在，你们出来，平安地走吧。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “官长”指腓立比城的行政长官；按罗马殖民城的官职制度，也可较专门地译作“裁判官”（praetors）。
    reason: cultural_note
lexical_decisions:
- source_word: ἀπήγγειλεν
  choice: 告诉
  rationale: 此处指狱卒把官长的信息转告保罗；“告诉”自然清楚，也不额外强化为正式公告。
- source_word: ὁ δεσμοφύλαξ
  choice: 狱卒
  rationale: 指负责看守监狱的人；“狱卒”简洁准确，符合叙事语境。
- source_word: τοὺς λόγους τούτους
  choice: 这些话
  rationale: 贴近希腊文复数表达，同时在现代汉语中自然。
- source_word: Ἀπέσταλκαν
  choice: 已经派人传话
  rationale: 完成时表示已经发生、其结果与当前相关。原文没有明说所差遣的对象；结合语境，译作“派人传话”可使汉语通顺，并以脚注说明原文的省略。
- source_word: οἱ στρατηγοὶ
  choice: 官长
  rationale: 在腓立比的罗马殖民地背景中，指当地最高行政官员；“官长”易懂且保留古代官职色彩，具体制度背景置于脚注。
- source_word: ἵνα ἀπολυθῆτε
  choice: 要释放你们
  rationale: 表达所传命令的内容；被动式在汉语中可自然转为以官长为隐含施事者的主动表达，不改变实际意义。
- source_word: νῦν οὖν
  choice: 现在
  rationale: 在上下文中兼具承接和推论作用；汉语用“现在”配合后续命令即可自然体现这一转折。
- source_word: ἐξελθόντες
  choice: 出来
  rationale: 分词与后面的命令语气连用，构成连续动作；译为“出来”简洁自然。
- source_word: πορεύεσθε
  choice: 走吧
  rationale: 表示离开、上路；句末“吧”符合狱卒转述许可后所发出的吩咐语气。
- source_word: ἐν εἰρήνῃ
  choice: 平安地
  rationale: 保留“在平安中离去”的惯用含义，表达不受伤害、安然离开的祝愿或许可。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。引语保持官长命令经狱卒转述时的简洁口吻；不把“平安”扩展为神学性祝福，以免超出本节语境。
