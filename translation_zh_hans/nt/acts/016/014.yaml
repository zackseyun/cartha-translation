  text: καί τις γυνὴ ὀνόματι Λυδία, πορφυρόπωλις πόλεως Θυατείρων σεβομένη τὸν θεόν, ἤκουεν, ἧς ὁ κύριος διήνοιξεν τὴν καρδίαν προσέχειν τοῖς λαλουμένοις ὑπὸ ⸀τοῦ Παύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/014.yaml
  text: And a certain woman named Lydia[a], a seller of purple cloth from the city of Thyatira, who worshiped God, was listening; the Lord opened her heart to pay attention to what was being spoken by Paul.
translation:
  language: zh_hans
  text: 有一位妇人，名叫吕底亚，来自推雅推喇城，是卖紫色布料的，敬拜上帝[a]；她正在聆听，主开启了她的心，使她留心保罗所讲的话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“敬畏上帝的人”。这个说法可能指敬奉以色列上帝的外邦人。
    reason: 保留 σεβομένη τὸν θεόν 的另一种译法，并说明该表达可能具有的历史群体含义，而不将其在正文中定为严格术语。
lexical_decisions:
- source_word: καί τις γυνὴ
  choice: 有一个……妇人
  rationale: 保留 τις 的不定指和引入新人物的叙事作用；现代汉语中不必生硬地译出“某一个”。
- source_word: ὀνόματι Λυδία
  choice: 名叫吕底亚
  rationale: 以现代汉语惯用方式表达 ὀνόματι 加人名的结构。
- source_word: πορφυρόπωλις
  choice: 卖紫色布料的
  rationale: 该词指经营紫色染料制品或布料的人；译作“紫色布料”清楚自然，同时不把商品过度限定为衣服。
- source_word: πόλεως Θυατείρων
  choice: 推雅推喇城
  rationale: 与“卖……的”结合表达她来自该城；保留 πόλεως 所明示的“城”。
- source_word: σεβομένη τὸν θεόν
  choice: 素来敬拜上帝
  rationale: σεβομένη 表示对上帝的敬奉；“素来”自然地体现分词所描述的持续身份或习惯，脚注保留其可能具有的群体称谓意味。
- source_word: ἤκουεν
  choice: 一直听着
  rationale: 用持续体表达未完成时所呈现的进行中动作，而非一次性的“听见”。
- source_word: ὁ κύριος
  choice: 主
  rationale: 忠实保留原文称谓，不擅自补明为“耶稣”或“上帝”。
- source_word: διήνοιξεν τὴν καρδίαν
  choice: 打开了她的心
  rationale: 保留原文意象，表达主使她内心能够领受。
- source_word: προσέχειν
  choice: 使她留心
  rationale: 准确表达专注、注意的词义；不扩大为已经“接受”或“回应”。
- source_word: τοῖς λαλουμένοις ὑπὸ τοῦ Παύλου
  choice: 保罗所讲的话
  rationale: 以自然汉语表达被动分词结构及保罗的施事关系；“所讲的话”保留言说内容的范围。
theological_decisions:
- issue: ὁ κύριος（“主”）所指的是谁
  choice: 正文仅译作“主”
  alternative: “主耶稣”或“上帝”
  rationale: 希腊文只写 ὁ κύριος。使徒行传中的“主”可能具有基督论指向，但此处也可概括地指神圣施事者，因此不在译文中消除原有的开放性。
- issue: σεβομένη τὸν θεόν 是否为半技术性称谓
  choice: 正文译作“素来敬拜上帝”
  alternative: “敬畏上帝的人”
  rationale: 正文采用普通读者容易理解的描述性表达，不把她的身份定型为严格的群体标签；脚注说明其可能特指敬奉以色列上帝的外邦人。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“妇人”略带经文叙事色彩但仍通俗；分号保留“她听着”与“主打开她的心”之间紧密而有区分的关系。脚注标记置于实际对应的“敬拜上帝”之后。
