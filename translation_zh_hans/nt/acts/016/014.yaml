  naturalness: 原句“有一个……妇人，是……卖……的，素来……”结构略显拗口；“她一直听着；主……”也使“听”的宾语在分号后才补出，衔接稍弱。改为单句，并使用“来自”“是卖……的”“正在聆听”，更合现代标准汉语且保留叙事进行性。
  terminology: “吕底亚”“推雅推喇”“保罗”和“主”均可保留。“主”不应擅自扩展为“主耶稣”或“上帝”。“敬拜上帝”可准确表达 σεβομένη τὸν θεόν；脚注保留其可能指敬奉以色列上帝的外邦人的历史性用法。
