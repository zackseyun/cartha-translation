  rationale: 修订明确“来自推雅推喇城”的来源关系，调整句法以符合自然现代汉语，并保留原文的单句推进、ἤκουεν 的进行性、ὁ κύριος 的未限定指称，以及“留心”而非“接受”或“回应”的语义限度。
