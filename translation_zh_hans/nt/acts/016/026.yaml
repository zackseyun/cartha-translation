base_translation:
  language: en
  yaml_path: translation/nt/acts/016/026.yaml
  text: Suddenly there was a great earthquake[a], so that the foundations of the prison were shaken; and immediately all the doors were opened[b], and everyone's chains were unfastened.
translation:
  language: zh_hans
  text: 忽然发生了大地震，震动了监牢的根基。所有的门立刻都开了，所有人的锁链也都松开了[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “锁链也都松开了”也可译作“捆锁也都解开了”。希腊文 δεσμά 可泛指锁链、镣铐等束缚物，ἀνέθη 可表示“松开”或“解开”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφνω
  choice: 忽然
  rationale: 准确传达事情突如其来的叙事语气，也是现代汉语中自然、庄重的表达。
- source_word: σεισμὸς ἐγένετο μέγας
  choice: 发生了大地震
  rationale: 保留 μέγας 的程度含义；“发生了”自然对应以 γίνομαι 构成的事件表达。
- source_word: ὥστε σαλευθῆναι τὰ θεμέλια τοῦ δεσμωτηρίου
  choice: 震动了监牢的根基
  rationale: 以结果性的动词结构自然表达 ὥστε 所引出的实际结果，同时保留监牢建筑根基受到震动的具体意象。
- source_word: παραχρῆμα
  choice: 立刻
  rationale: 传达事情随即发生，简洁且符合现代叙事语言。
- source_word: ἠνεῴχθησαν ... αἱ θύραι πᾶσαι
  choice: 所有的门……都开了
  rationale: 希腊文为被动形式，但汉语不标明施事者的“开了”自然表达门被打开后的结果，并未断定具体施事方式。
- source_word: πάντων τὰ δεσμὰ
  choice: 所有人的锁链
  rationale: πάντων 表示这些束缚属于在场的所有人；“所有人的”简明自然。δεσμά 在监禁语境中可具体译为“锁链”，但其范围也包括各种捆锁，因此加注说明。
- source_word: ἀνέθη
  choice: 松开了
  rationale: ἀνίημι 在此表示解除紧束或使其松脱；“松开了”保留结果含义，又不额外断言囚犯已经逃脱或获释。
