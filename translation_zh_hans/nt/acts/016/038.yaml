id: ACT.16.38
reference: Acts 16:38
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ⸀ἀπήγγειλαν δὲ τοῖς στρατηγοῖς οἱ ῥαβδοῦχοι τὰ ῥήματα ταῦτα· ⸂ἐφοβήθησαν δὲ⸃ ἀκούσαντες ὅτι Ῥωμαῖοί εἰσιν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/038.yaml
  text: So the rod-bearers reported these words to the magistrates[a], and they were afraid when they heard that they were Romans[c][b],
translation:
  language: zh_hans
  text: 执杖官把这些话报告给执政官[a]；执政官听说他们是罗马人[b]，就害怕了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “执政官”指腓立比城中主持城政的高级官员。
    reason: cultural_note
  - marker: b
    text: 或译“罗马公民”。原文作“罗马人”；在这里的法律语境中，重点是他们享有罗马公民受法律保护的身份。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγγειλαν
  choice: 报告
  rationale: 此处指执杖官把所得的信息正式转告城中官长；“报告”既符合不定过去时所述的完成事件，也适合行政语境。
- source_word: στρατηγοῖς
  choice: 执政官
  rationale: 在罗马殖民城腓立比，此词指主持城政的高级官员。“执政官”比泛称“官长”更能体现其职位，同时比音译或专门罗马官衔更易懂。
- source_word: ῥαβδοῦχοι
  choice: 执杖官
  rationale: 此词字面意为“持杖者”，指随侍执政官、执行命令并以束棒象征权力的公职人员。“执杖官”保留原文的具体形象，也表明他们具有官差身份。
- source_word: τὰ ῥήματα ταῦτα
  choice: 这些话
  rationale: 按原文直译，并自然回指上一节狱卒传达的要求。
- source_word: ἐφοβήθησαν
  choice: 就害怕了
  rationale: 忠实表达听闻消息后产生的惧怕；“就”自然呈现分词结构所含的时间与因果联系，而不额外界定恐惧程度。
- source_word: ἀκούσαντες
  choice: 听说
  rationale: 这里不是单指听见声音，而是获知他们具有罗马人身份；“听说”符合现代汉语的信息传达语境。
- source_word: Ῥωμαῖοί
  choice: 罗马人
  rationale: 原文实质化形容词直称“罗马人”。法律语境显示重点在罗马公民身份，但正文保留原文较简洁的措辞，并以脚注说明。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“执杖官”保留原文的文化形象，相关身份可由上下文理解；调整信息次序，将“听说他们是罗马人”置于“害怕”之前，使汉语因果关系清楚，同时不改变原意。
