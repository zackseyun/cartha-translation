  text: ἐξελθόντες δὲ ⸀ἀπὸ τῆς φυλακῆς εἰσῆλθον πρὸς τὴν Λυδίαν, καὶ ἰδόντες ⸂παρεκάλεσαν τοὺς ἀδελφοὺς⸃ καὶ ἐξῆλθαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/040.yaml
  text: After they came out of the prison[a], they went to Lydia, and when they saw the brothers, they encouraged them and departed.
translation:
  language: zh_hans
  text: 他们从监牢里出来，就到吕底亚那里去；见了弟兄们[a]，便劝勉他们，然后离开了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“弟兄姊妹们”。希腊原文是阳性复数，但可泛指包括女性在内的同信者。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντες δὲ ἀπὸ τῆς φυλακῆς
  choice: 他们从监牢里出来
  rationale: 将先行的过去时分词自然译为汉语顺承分句；“从监牢里出来”既保留介词所表达的离开来源，也符合现代汉语习惯。
- source_word: εἰσῆλθον πρὸς τὴν Λυδίαν
  choice: 就到吕底亚那里去
  rationale: 原文以人名作介词宾语，表示前往吕底亚所在之处。译作“到吕底亚那里去”自然且贴近原文，不明说原文未直接出现的“家”。
- source_word: ἰδόντες
  choice: 见了
  rationale: 以顺承结构表达过去时分词，清楚呈现他们见到众信徒之后才加以劝勉。
- source_word: παρεκάλεσαν
  choice: 劝勉
  rationale: παρακαλέω在此可涵盖鼓励、安慰和劝导；“劝勉”保留较宽的牧养语义，不把含义限缩为单纯安慰。
- source_word: τοὺς ἀδελφούς
  choice: 弟兄们
  rationale: 保留希腊文阳性复数的亲属隐喻及初期教会称谓；脚注说明该词在这里也可泛指包括女性在内的同信者。
- source_word: ἐξῆλθαν
  choice: 然后离开了
  rationale: 按叙事语境译作“离开”，避免与前面的“出来”重复；“然后”明确最后一个动作的顺序。
theological_decisions:
- issue: ἀδελφοί可能指男女混合的信徒群体
  choice: 正文译作“弟兄们”，并加脚注说明包容性所指
  alternative: 弟兄姊妹们；信徒们
  rationale: 正文保留原文阳性复数及其群体称谓形式，同时不让现代读者误以为必然只有男性；脚注保存原词在此可能包括女性信徒的真实语用范围。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“吕底亚那里”避免擅自补出“家”；分号和“然后”使动作次序清晰。
