  text: ὡς δὲ διεπορεύοντο τὰς πόλεις, ⸀παρεδίδοσαν αὐτοῖς φυλάσσειν τὰ δόγματα τὰ κεκριμένα ὑπὸ τῶν ἀποστόλων ⸀καὶ πρεσβυτέρων τῶν ἐν ⸀Ἱεροσολύμοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/004.yaml
  text: As they went through the cities[a], they delivered to them for observance the decrees that had been decided by the apostles and elders in Jerusalem.
translation:
  language: zh_hans
  text: 他们经过各城时，便把耶路撒冷的使徒和长老所议定的规条[a]交给他们遵守。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“决定”。希腊文指耶路撒冷会议所作出的正式裁定。
    reason: 说明 δόγματα 在本处的词义范围及可行译法。
lexical_decisions:
- source_word: διεπορεύοντο
  choice: 经过
  rationale: 未完成时描写他们持续走过一座又一座城；“经过各城”简洁自然，也保留行程推进的意味。
- source_word: παρεδίδοσαν
  choice: 交给
  rationale: 此词表示把已经领受的权威性内容传交给别人；“交给”保留传递、托付之意，又符合现代汉语。
- source_word: αὐτοῖς
  choice: 当地的人
  rationale: 希腊文只用代词，其所指可由上下文理解为各城中的信徒；汉语若连续使用多个“他们”容易混淆施事者与领受者，因此作最低限度的显明。
- source_word: φυλάσσειν
  choice: 遵守
  rationale: 此处指切实持守并实行这些规定，不是单纯保管；“遵守”准确表达其规范性。
- source_word: δόγματα
  choice: 规条
  rationale: 在本段指耶路撒冷会议形成并下达的正式规定。“规条”体现权威性，又避免让现代读者误解为后世技术意义上的“教义”。
- source_word: κεκριμένα
  choice: 所议定的
  rationale: 完成时被动分词表示这些事项已经作出决定，并继续有效；“所议定的”也自然呼应会议语境。
- source_word: ἀποστόλων καὶ πρεσβυτέρων
  choice: 使徒和长老
  rationale: 采用《使徒行传》中相应职分的通行译名，不额外界定其后世制度含义。
- source_word: τῶν ἐν Ἱεροσολύμοις
  choice: 耶路撒冷的
  rationale: 简洁表达介词短语对“使徒和长老”的地点限定。
theological_decisions:
- issue: 耶路撒冷会议决定的权威性质
  choice: 将 δόγματα 译为“规条”
  alternative: “决定”或“法令”
  rationale: “规条”既显示这些内容是要交给众人遵守的正式规定，也不把它们等同于后世意义上的教义体系或国家法令。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“交给当地的人遵守”避免连续多个“他们”造成指代混乱；不在正文中补入原文未明说的“教会”或“信徒”。
