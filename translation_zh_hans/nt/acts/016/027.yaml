  text: ἔξυπνος δὲ γενόμενος ὁ δεσμοφύλαξ καὶ ἰδὼν ἀνεῳγμένας τὰς θύρας τῆς φυλακῆς σπασάμενος ⸀τὴν μάχαιραν ἤμελλεν ἑαυτὸν ἀναιρεῖν, νομίζων ἐκπεφευγέναι τοὺς δεσμίους.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/027.yaml
  text: When the jailer woke up and saw the prison doors standing open[a], he drew his sword and was about to kill himself[b], supposing that the prisoners had escaped.
translation:
  language: zh_hans
  text: 狱卒醒来，看见监牢的门都敞开着[a]，就拔出刀来[b]，正要自杀，因为他以为囚犯们已经逃走了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较形式地译作“看见监牢的门都已经被打开了”。希腊文的完成时分词强调门被打开后所处的状态。
    reason: lexical_alternative
  - marker: b
    text: 希腊文μάχαιρα可指剑，也可指较短的刃器，如匕首；这里译作“刀”，以保留该词的形制宽度。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔξυπνος ... γενόμενος
  choice: 醒来
  rationale: 这一形容词与分词的组合表示进入清醒状态；“醒来”自然、准确地传达起始意义。
- source_word: ὁ δεσμοφύλαξ
  choice: 狱卒
  rationale: 指负责看守囚犯的人；“狱卒”简洁明确，比泛指的“守卫”更贴合语境。
- source_word: ἰδὼν ἀνεῳγμένας τὰς θύρας τῆς φυλακῆς
  choice: 看见监牢的门都敞开着
  rationale: 完成时被动分词强调门已经被打开后所处的状态；“敞开着”在现代汉语中自然地保留这一结果状态。
- source_word: σπασάμενος τὴν μάχαιραν
  choice: 拔出刀来
  rationale: σπάομαι 与 μάχαιρα 连用表示拔出兵器；“刀”保留 μάχαιρα 可指剑或较短刃器的词义宽度，避免在中文中将器物形制限定为“剑”。
- source_word: ἤμελλεν ἑαυτὸν ἀναιρεῖν
  choice: 正要自杀
  rationale: ἤμελλεν 表示行动迫在眉睫，ἀναιρεῖν 在此指杀死；“正要自杀”简洁清楚地表达他即将杀死自己。
- source_word: νομίζων
  choice: 因为他以为
  rationale: 该分词说明狱卒准备自杀的原因；“以为”体现这是他根据眼前情形所作、但并不正确的判断。
- source_word: ἐκπεφευγέναι
  choice: 已经逃走了
  rationale: 完成时不定式表达逃离已经发生并完成；“已经逃走了”直接传达这一时体意义。
- source_word: τοὺς δεσμίους
  choice: 囚犯们
  rationale: 在监牢语境中指被关押的人；“囚犯”是清楚自然的现代汉语对应词。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“狱卒”“监牢”“囚犯”保持监禁场景用语一致；“拔出刀来”不把 μάχαιρα 过度限定为特定形制的剑或匕首。
