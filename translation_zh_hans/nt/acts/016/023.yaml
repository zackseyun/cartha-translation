base_translation:
  language: en
  yaml_path: translation/nt/acts/016/023.yaml
  text: And after they had inflicted many blows on them[a], they threw them into prison[b], ordering the jailer to keep them securely.
translation:
  language: zh_hans
  text: 他们打了保罗和西拉许多下[a]，把他们扔进监牢[b]，并吩咐狱卒严密看守他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“鞭打了许多下”或“多次击打”。希腊原文只说明他们遭到多次击打，并未在这里具体说明所用的刑具。
    reason: lexical_alternative
  - marker: b
    text: “监牢”也可译作“监狱”；希腊原词泛指拘禁人的地方。
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλάς ... πληγὰς
  choice: 重重打了……许多下
  rationale: 原文指加在二人身上的多次击打，并未说明所用刑具。“打了许多下”保留次数多而方式未具体说明的含义；“重重”传达施打的强烈语气，但不把 πληγή 限定为鞭打。
- source_word: τε
  choice: 就
  rationale: τέ承接前文并连接本节连续发生的动作；汉语以“就”自然推进叙事，也体现击打之后随即下监的关系。
- source_word: ἐπιθέντες
  choice: 打了
  rationale: ἐπιτίθημι与πληγάς搭配，字面为“加上击打”，在此惯用地表示施打；译作“打了”自然清楚，并与后面的主要动词形成先后关系。
- source_word: ἔβαλον εἰς φυλακήν
  choice: 把他们扔进监牢
  rationale: βάλλω在此带有强行投入之意；“扔进”保留原文生动而粗暴的动作感，比“关进”更贴近措辞。
- source_word: φυλακήν
  choice: 监牢
  rationale: φυλακή在此指拘禁人的场所。“监牢”与“狱卒”搭配自然，并明确表达实际监禁，而非抽象的拘押状态。
- source_word: παραγγείλαντες
  choice: 吩咐
  rationale: 该分词表示投入监牢时所下的权威指令。“吩咐”在现代汉语中自然且具有命令力度。
- source_word: δεσμοφύλακι
  choice: 狱卒
  rationale: δεσμοφύλαξ指负责看管囚犯的人。“狱卒”简洁、准确，也符合本段叙事语体。
- source_word: ἀσφαλῶς
  choice: 严密
  rationale: 此处强调防止囚犯逃脱的牢靠看管，而不是保障他们的人身安全；“严密”准确体现羁押语境。
- source_word: τηρεῖν
  choice: 看守
  rationale: τηρέω在监牢语境中指看管、守住。“看守”与“严密”搭配自然，清楚表达不得让囚犯逃脱。
- source_word: αὐτούς
  choice: 保罗和西拉／他们
  rationale: 所指为保罗和西拉。句首明说二人可避免汉语连续使用代词造成指代不够清楚；后文用“他们”承接。
