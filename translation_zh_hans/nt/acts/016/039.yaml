  text: καὶ ἐλθόντες παρεκάλεσαν αὐτούς, καὶ ἐξαγαγόντες ἠρώτων ⸂ἀπελθεῖν ἀπὸ⸃ τῆς πόλεως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/039.yaml
  text: And they came and appealed to them[a], and after leading them out[b], they asked them to leave the city.
translation:
  language: zh_hans
  text: 于是，官长们来向他们好言相劝[a]，领他们出来以后，就请求他们离开那城[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“劝他们”“恳请他们”。这个希腊语动词在别的语境中也可表示“安慰”，但这里可能是指官长们在不当对待保罗和西拉之后，以缓和、安抚的态度劝请他们。
    reason: lexical_alternative
  - marker: b
    text: “请求”在希腊语中使用未完成时，可能表示持续或反复请求，也可译作“不断请他们”或“再三请他们”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθόντες
  choice: 来
  rationale: 不定过去时分词交代官长随后的行动；汉语用“来”自然承接上文，也清楚表现动作次序。
- source_word: παρεκάλεσαν
  choice: 好言相劝
  rationale: παρακαλέω 语义范围较广，可指劝说、恳求、勉励或安慰。此处官长先前不当对待保罗和西拉，如今态度缓和，带有安抚、劝请的意味；“好言相劝”比单纯“安慰”更合语境，又不夸大为“苦苦哀求”。
- source_word: αὐτούς
  choice: 他们
  rationale: 指保罗和西拉；按汉语自然译作代词“他们”。
- source_word: ἐξαγαγόντες
  choice: 领他们出来以后
  rationale: ἐξάγω 表示领出、带出；不定过去时分词表现其动作先于后面的请求，译作“领他们出来以后”可明确保留这一先后关系。
- source_word: ἠρώτων
  choice: 一再请
  rationale: ἐρωτάω 在此指请求；未完成时可表现持续或反复进行。“一再请”既体现礼貌请求，也保留该时态可能具有的持续、反复意味。
- source_word: ἀπελθεῖν ἀπὸ τῆς πόλεως
  choice: 离开那城
  rationale: 该不定式短语说明请求的内容。“离开那城”符合现代汉语表达，并准确传达从城中离去之意。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通俗的叙事语体。“官长们”根据近距离上文补明主语，使单节独立阅读时更清楚；“好言相劝”传达 conciliatory 语气。“一再请”在正文中适度呈现未完成时的可能含义，同时以脚注保留较中性的译法。
