  yaml_path: translation/nt/acts/016/030.yaml
  text: And after bringing them outside[a], he said, “Sirs[b], what must I do so that I may be saved?”
translation:
  language: zh_hans
  text: 他把他们带到外面后，说：“先生们[a]，我必须做什么，才能得救[b]？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “先生们”所译的希腊语在这里是对人的礼貌称呼，不是称神为“主”的神圣称号。
    reason: lexical_alternative
  - marker: b
    text: 或译：“我该做什么才能得救？”
    reason: lexical_alternative
lexical_decisions:
- source_word: προαγαγὼν αὐτοὺς ἔξω
  choice: 把他们领到外面
  rationale: προαγαγών是简单过去时分词，表示先于主句“说”发生的动作；“领到外面”自然表达将保罗和西拉带出去的动作及方向。
- source_word: ἔφη
  choice: 就说
  rationale: φημί的未完成时在叙事中可作普通的引语引介；“就说”既自然，也体现前后动作的承接。
- source_word: Κύριοι
  choice: 先生们
  rationale: κύριοι是复数呼格，此处是狱卒对保罗和西拉的礼貌称呼，并非称他们为神圣意义上的“主”。
- source_word: τί με δεῖ ποιεῖν
  choice: 我必须做什么
  rationale: δεῖ表达必要性，ποιεῖν说明所要做的事；“必须做什么”简洁保留原文的必要语气。
- source_word: ἵνα σωθῶ
  choice: 才可以得救
  rationale: ἵνα加简单过去时被动虚拟语气可表达目的或预期结果；“才可以得救”在现代汉语中自然，并保留被动意义，而不预先限定得救的具体教义机制。
theological_decisions:
- issue: 狱卒所问σωθῶ的含义
  choice: 得救
  alternative: 获救／被解救
  rationale: σῴζω可指从现实危险中获救，也可指更完整的属灵拯救。结合紧接着的16:31，本处以“得救”最合语境，同时不在译文中排除该词较宽的语义范围。
- issue: Κύριοι是否应译作神圣称号“主”
  choice: 先生们
  alternative: 诸位主／主人们
  rationale: 此处为对两个受话人的复数礼貌称呼。译成“先生们”可避免误使读者把它理解为对神的称号。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“先生们”符合社会性尊称；“我必须做什么，才可以得救”保留原文的必要语气、目的或结果关系以及被动含义。脚注标记按中文正文中的出现顺序重新编排。
