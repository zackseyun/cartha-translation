id: ACT.16.29
reference: Acts 16:29
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: αἰτήσας δὲ φῶτα εἰσεπήδησεν καὶ ἔντρομος γενόμενος προσέπεσεν τῷ Παύλῳ καὶ ⸀τῷ Σιλᾷ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/029.yaml
  text: Then[a], asking for lights, he rushed in, and trembling with fear he fell down before Paul and Silas[c][b],
translation:
  language: zh_hans
  text: 他叫人拿灯来，就冲了进去[a]；他吓得浑身发抖[b]，伏倒在保罗和西拉面前[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“跳了进去”。原文动词表示突然、迅猛地进入。
    reason: lexical_alternative
  - marker: b
    text: 原文形容他因恐惧而身体发抖。
    reason: lexical_clarification
  - marker: c
    text: 也可译作：“倒在保罗和西拉面前。”这里表示惊惧中的恳求或敬畏，不一定指敬拜。
    reason: alternative_reading
lexical_decisions:
- source_word: αἰτήσας
  choice: 叫人拿……来
  rationale: 不定过去时分词表示先于主要动作发生的请求；结合宾语“灯”，这样译自然地表达他吩咐或请求别人取来照明用具，又不额外说明受命者是谁。
- source_word: φῶτα
  choice: 灯
  rationale: 原文为复数，泛指照明之物，并未限定是油灯还是火把；现代汉语用“灯”可保留这种概括性，数量可由语境自然理解。
- source_word: εἰσεπήδησεν
  choice: 冲了进去
  rationale: 该动词表达突然、有力地进入；“冲了进去”既传达急迫迅猛的动作，也比生硬的“跳入”更符合现代汉语叙事。
- source_word: ἔντρομος γενόμενος
  choice: 吓得浑身发抖
  rationale: ἔντρομος兼有恐惧与身体颤抖之意，γενόμενος描述进入这种状态；此译自然保留两方面的含义。
- source_word: προσέπεσεν
  choice: 伏倒在……面前
  rationale: 该动词表示倒伏或俯伏在某人面前，可含惊惧、恳求或敬畏；此译呈现具体动作，但不把它直接解释为敬拜。
- source_word: τῷ Παύλῳ καὶ τῷ Σιλᾷ
  choice: 在保罗和西拉面前
  rationale: 与προσπίπτω连用的与格指动作所朝向的人；“在……面前”准确自然，且不增添原文没有明说的“脚前”。
theological_decisions:
- issue: 狱卒伏倒在保罗和西拉面前这一动作的性质
  choice: 译作“伏倒在保罗和西拉面前”，呈现惊惧中的俯伏或恳求姿态，不明确称为敬拜。
  alternative: 译作“敬拜保罗和西拉”或“向保罗和西拉下拜”。
  rationale: προσέπεσεν本身可指在惊惧、恳求或尊敬中伏在某人面前，并不必然表示宗教敬拜。上下文强调狱卒的震惊和恐惧，因此应保留动作及其可能含义，不加入原文未断定的神学解释。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事表达。“叫人拿灯来”符合汉语习惯；“冲了进去”传达动作的突发和急迫；分号使迅速进入与随后战栗俯伏的动作层次清楚。
