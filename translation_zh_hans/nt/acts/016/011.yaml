  text: Ἀναχθέντες ⸀οὖν ⸀ἀπὸ Τρῳάδος εὐθυδρομήσαμεν εἰς Σαμοθρᾴκην, τῇ ⸀δὲ ἐπιούσῃ εἰς ⸂Νέαν Πόλιν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/011.yaml
  text: So[a], after putting out to sea from Troas, we sailed straight to Samothrace, and on the following day to Neapolis,
translation:
  language: zh_hans
  text: 于是，我们从特罗亚开船，直航到撒摩特喇；第二天又到了尼亚波利。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀναχθέντες
  choice: 开船
  rationale: ἀνάγω在航海语境中指离岸出海、启航。“开船”简明自然，并与后面的“直航”衔接顺畅。
- source_word: οὖν
  choice: 于是
  rationale: οὖν在这里承接前文并推进叙事；“于是”符合现代汉语行程叙述的语气，不强化为严格的逻辑结论。
- source_word: ἀπὸ Τρῳάδος
  choice: 从特罗亚
  rationale: ἀπό表示出发地点；“特罗亚”采用通行的中文圣经地名译法。
- source_word: εὐθυδρομήσαμεν
  choice: 我们……直航
  rationale: 该动词指沿直线航行或直接驶往目的地。“直航”既保留航海含义和方向性，也符合简洁、庄重的现代汉语。
- source_word: εἰς Σαμοθρᾴκην
  choice: 到撒摩特喇
  rationale: εἰς表示目的地；“撒摩特喇”采用通行的中文圣经地名译法。
- source_word: τῇ δὲ ἐπιούσῃ
  choice: 第二天又
  rationale: 该时间短语意为“次日／第二天”；δέ在行程叙述中轻微承接下一阶段，以“又”自然表达。
- source_word: εἰς Νέαν Πόλιν
  choice: 到了尼亚波利
  rationale: Νέα Πόλις在此为专名，采用音译“尼亚波利”，不按字面译成“新城”；补出“到”以符合汉语表达。
