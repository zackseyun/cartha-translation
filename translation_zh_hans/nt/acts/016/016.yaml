  to: 有一次，我们往祷告的地方去时，一个有“皮同之灵”[a]的女奴迎面向我们走来。她靠占卜[b]不断为她的主人们带来许多收益。
  rationale: 修订相遇动词的汉语搭配，并以“不断为……带来许多收益”反映未完成时的持续获利及原文较宽的经济语义；其余译法和脚注均可保留。
