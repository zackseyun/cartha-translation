source:
  edition: SBLGNT
  text: Ἐγένετο δὲ πορευομένων ἡμῶν εἰς ⸀τὴν προσευχὴν παιδίσκην τινὰ ἔχουσαν πνεῦμα ⸀πύθωνα ⸀ὑπαντῆσαι ἡμῖν, ἥτις ἐργασίαν πολλὴν παρεῖχεν τοῖς κυρίοις αὐτῆς μαντευομένη·
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/016.yaml
  text: And it happened that, as we were going to the place of prayer, a certain slave girl who had a python spirit met us, and she was bringing much profit to her masters by fortune-telling.
translation:
  language: zh_hans
  text: 有一次，我们往祷告的地方去时，一个有“皮同之灵”[a]的女奴迎面向我们走来。她靠占卜[b]不断为她的主人们带来许多收益。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“有占卜之灵”。“皮同”是希腊文化中与神谕和占卜预言相关的特定称谓。
    reason: 保留文化专称并提供功能性解释。
  - marker: b
    text: 或译“行占卜之术”。
    reason: 提供 μαντευομένη 较正式的词义表达。
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: 有一次
  rationale: 作为路加叙事中引入事件的过渡语，“有一次”自然简洁，不采用古雅的“事情发生了”。
- source_word: πορευομένων ἡμῶν
  choice: 我们正……去
  rationale: 体现属格独立结构所表达的同时进行和持续背景。
- source_word: εἰς τὴν προσευχὴν
  choice: 往祷告的地方
  rationale: 此处带冠词的 προσευχή 很可能指固定的祷告场所，而不只是祷告这一行为。
- source_word: παιδίσκην τινά
  choice: 一个……女奴
  rationale: 上下文提到她有多位主人，并被用来谋利，明确译出其受奴役的社会身份。τινά 由不定表达“一个”自然体现。
- source_word: ἔχουσαν πνεῦμα πύθωνα
  choice: 有“皮同之灵”
  rationale: 将 πύθωνα 按文化专名“皮同”音译，以保留原文特定的希腊宗教文化用语；引号提示这是专称，脚注说明其含义。
- source_word: ὑπαντῆσαι ἡμῖν
  choice: 迎面遇见我们
  rationale: 既表达相遇，也保留 ὑπαντάω 所含迎面而来的意味。
- source_word: ἐργασίαν πολλὴν παρεῖχεν
  choice: 赚取了许多钱
  rationale: 在此经济语境中指带来大量收益；现代汉语以“赚取了许多钱”清楚表达实际含义。
- source_word: τοῖς κυρίοις αὐτῆς
  choice: 为她的主人们
  rationale: 复数“主人们”反映 τοῖς κυρίοις，并与女奴身份相呼应；此处 κύριος 不是神圣称号。
- source_word: μαντευομένη
  choice: 靠占卜
  rationale: 准确表达从事预言、卜问一类活动的分词，并说明主人获利的手段。
theological_decisions:
- issue: 如何翻译带有希腊宗教文化背景的 πνεῦμα πύθωνα
  choice: 有“皮同之灵”
  alternative: 有占卜之灵
  rationale: 主文保留原文“皮同”这一文化特定称谓，不把它直接化约为功能解释；脚注提供其占卜含义，避免读者误解为普通专名或单指蟒蛇。
- issue: 是否明确 παιδίσκη 的奴隶身份
  choice: 女奴
  alternative: 使女／婢女
  rationale: 她受多位主人控制并被用于营利，译作“女奴”较准确地呈现经文所述的剥削关系，且不弱化其受奴役身份。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“皮同之灵”刻意保留原文的文化陌生感，并以脚注解释；其余措辞尽量自然直接。“赚取了许多钱”比“带来许多利益”更符合普通现代汉语，也清楚呈现经济剥削。
