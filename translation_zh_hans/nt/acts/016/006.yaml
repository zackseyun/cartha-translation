  text: ⸀Διῆλθον δὲ τὴν Φρυγίαν ⸀καὶ Γαλατικὴν χώραν, κωλυθέντες ὑπὸ τοῦ ἁγίου πνεύματος λαλῆσαι τὸν λόγον ἐν τῇ Ἀσίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/006.yaml
  text: And they passed through the region of Phrygia and Galatia[b][a], having been forbidden by the Holy Spirit to speak the word in Asia.
translation:
  language: zh_hans
  text: 他们经过弗吕家和加拉太地区[b]；圣灵禁止他们在亚细亚[a]传讲这道。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“亚细亚”指小亚细亚西部的罗马亚细亚行省，不是现代所说的亚洲大陆。
    reason: cultural_note
  - marker: b
    text: 或译：“弗吕家—加拉太地区。”希腊文结构也可能是把它作为一个地区名称。
    reason: alternative_reading
lexical_decisions:
- source_word: Διῆλθον
  choice: 经过
  rationale: διέρχομαι表示穿行、经过某地；“经过”简洁自然，并保留穿越地区的方向感。
- source_word: δὲ
  choice: 以分号承接叙事，未单独译出
  rationale: δέ是轻微的叙事连接词；现代汉语在此无需机械译作“于是”或“而”，用分句衔接即可自然推进叙事。
- source_word: τὴν Φρυγίαν καὶ Γαλατικὴν χώραν
  choice: 弗吕家和加拉太地区
  rationale: χώρα意为地区、地域。此结构既可能指弗吕家与加拉太两个相关地域，也可能是一个复合的地区称谓；正文采用易懂译法，并以脚注保留语法上的另一种理解。
- source_word: κωλυθέντες
  choice: 禁止他们
  rationale: κωλύω的被动分词在此表示他们受到阻止或禁止；结合不定式“传讲”，译作“圣灵禁止他们”清楚表达原文的施事关系，又不额外说明禁止的具体方式。
- source_word: ὑπὸ τοῦ ἁγίου πνεύματος
  choice: 圣灵
  rationale: 带冠词的τοῦ ἁγίου πνεύματος在《路加福音—使徒行传》的语境中指圣灵；ὑπό加属格明确标示其为施事者。
- source_word: λαλῆσαι
  choice: 传讲
  rationale: λαλέω基本义为说、讲；与τὸν λόγον连用时，“传讲”在现代汉语中自然体现向人宣告信息的语境，同时不窄化为特定讲道形式。
- source_word: τὸν λόγον
  choice: 这道
  rationale: λόγος在此指前文语境中的福音信息。“道”保留《使徒行传》中这一用语的凝练表达，“这”使现代汉语句子自然，并表明所指是已知的信息。
- source_word: ἐν τῇ Ἀσίᾳ
  choice: 在亚细亚
  rationale: Ἀσία在此是罗马帝国行省名。正文保留历史专名“亚细亚”，脚注说明其范围，避免误解为现代的亚洲大陆。
theological_decisions:
- issue: 禁止行动中圣灵的施事身份
  choice: 圣灵禁止他们
  alternative: 他们被灵拦阻
  rationale: 原文以ὑπό加属格明确指出圣灵是禁止行动的施事者；主动式汉语表达清楚自然。译文不进一步说明圣灵如何禁止他们，也不加入原文未说的教义细节。
- issue: 分词与主要动作的逻辑关系
  choice: 用分号并列呈现“经过”与“禁止”
  alternative: 因为圣灵禁止他们……所以他们经过……
  rationale: κωλυθέντες可表达先行或伴随处境，但原文没有明示严格的因果连接词。避免加入“因为……所以……”，可保留行动次序及逻辑关系上的一定开放性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“弗吕家”“加拉太”“亚细亚”沿用常见圣经地名译法；以“传讲这道”兼顾原文措辞与现代汉语可读性。
