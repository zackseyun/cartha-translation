  text: Ἰδόντες δὲ οἱ κύριοι αὐτῆς ὅτι ἐξῆλθεν ἡ ἐλπὶς τῆς ἐργασίας αὐτῶν ἐπιλαβόμενοι τὸν Παῦλον καὶ τὸν Σιλᾶν εἵλκυσαν εἰς τὴν ἀγορὰν ἐπὶ τοὺς ἄρχοντας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/019.yaml
  text: But when her masters saw that their hope of profit had gone out[a], they seized Paul and Silas and dragged them into the marketplace before the rulers[b],
translation:
  language: zh_hans
  text: 她的主人们见自己获利的指望已经没有了[a]，就抓住保罗和西拉，把他们拖到市集广场的官长面前[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“他们营利的指望已经出去／离开了”；意指他们从她身上获利的希望已经落空。
    reason: 说明ἐξῆλθεν的“出去／离开”意象，以及ἐργασία在此指营利或收益。
  - marker: b
    text: “官长”在这里是对城市执政当局的一般称呼；下一节使用的是一个更具体的官职名称，常译作“地方官”。
    reason: 区分本节ἄρχοντες与下一节στρατηγοί，避免把两个不同的希腊词译成同一特定官职。
lexical_decisions:
- source_word: οἱ κύριοι αὐτῆς
  choice: 她的主人们
  rationale: κύριοι在此指掌控并利用这名婢女牟利的人。“主人们”自然传达当时的主仆及支配关系，同时不弱化其经济剥削意味。
- source_word: ἐξῆλθεν
  choice: 已经没有了
  rationale: 原义为“出去了、离开了”。中文若直译“出去了”容易显得生硬；结合他们收入来源消失的语境，用“已经没有了”表达结果完成态，并将原文措辞记录于脚注。
- source_word: ἡ ἐλπὶς τῆς ἐργασίας αὐτῶν
  choice: 赚钱的指望
  rationale: ἐλπίς为“指望”，ἐργασία在此按语境指营利、所得。“赚钱的指望”既保留“指望”，又以现代汉语清楚表达预期收益。
- source_word: ἐπιλαβόμενοι
  choice: 抓住
  rationale: 该分词表示强行拿住；“抓住”简明自然，并与随后“拖”形成连续的强制行动。
- source_word: εἵλκυσαν
  choice: 拖
  rationale: ἕλκω表示拉、拖，此处带明显强制意味；“拖”准确保留动作的粗暴性。
- source_word: ἀγορὰν
  choice: 市集广场
  rationale: ἀγορά兼有市场与城市公共广场的含义；“市集广场”同时呈现商业和公共司法场所的背景。
- source_word: ἐπὶ τοὺς ἄρχοντας
  choice: 带到官长面前
  rationale: ἄρχοντες是对城市执政当局的一般称呼。“官长”保留其概括性，不与下一节更具体的στρατηγοί混同；“面前”呈现被押去受审的方向和场景。
theological_decisions: []
