  text: τοῦτον ἠθέλησεν ὁ Παῦλος σὺν αὐτῷ ἐξελθεῖν, καὶ λαβὼν περιέτεμεν αὐτὸν διὰ τοὺς Ἰουδαίους τοὺς ὄντας ἐν τοῖς τόποις ἐκείνοις, ᾔδεισαν γὰρ ἅπαντες ⸂ὅτι Ἕλλην ὁ πατὴρ αὐτοῦ⸃ ὑπῆρχεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/003.yaml
  text: Paul wanted him to go out with him[a], and after taking him, he circumcised him because of the Jews who were in those places[c][b], for they all knew that his father was a Greek.
translation:
  language: zh_hans
  text: 保罗想要提摩太与他同行[a]，便带上他，因那些地方的犹太人[b]的缘故，给他行了割礼；因为他们全都知道提摩太的父亲是希腊人[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“跟他一同出去”；这里可指与他一同启程旅行。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“为了那些地方的犹太人”或“因为那些地方的犹太人”。
    reason: lexical_alternative
  - marker: c
    text: 原文作“希腊人”；在这里可能着重表明提摩太的父亲不是犹太人。
    reason: cultural_note
lexical_decisions:
- source_word: τοῦτον
  choice: 提摩太
  rationale: 指向上文的提摩太。中文若直译为“这个人”显得生硬，而连续使用“他”又容易与保罗混淆，因此在句首明确人名。
- source_word: ἠθέλησεν
  choice: 希望
  rationale: 自然表达保罗的意愿，不把语气强化为命令或既定决策。
- source_word: σὺν αὐτῷ ἐξελθεῖν
  choice: 跟他一同出行
  rationale: ἐξελθεῖν字面为“出去”，本处在旅行传道的叙事中指启程同行；“出行”既保留出发意象，也符合现代汉语。
- source_word: λαβὼν
  choice: 就带他去
  rationale: 该不定过去时分词表示先于主要动作发生的伴随步骤；中文以“就带他去”自然交代行动次序。
- source_word: περιέτεμεν
  choice: 给他行了割礼
  rationale: 直接、规范地表达“给某人施行割礼”，不作委婉化处理。
- source_word: διὰ τοὺς Ἰουδαίους
  choice: 因为当地的犹太人
  rationale: διά加宾格表示原因或动机；与后面的地点限定语合并为自然中文，同时不擅自解释保罗的更广泛目的。
- source_word: τοὺς ὄντας ἐν τοῖς τόποις ἐκείνοις
  choice: 当地的
  rationale: 简洁传达“在那些地方的”，指相关地区的犹太人，不额外断定他们定居于此。
- source_word: ᾔδεισαν γὰρ ἅπαντες
  choice: 他们全都知道
  rationale: 保留ἅπαντες的全面强调；后句说明前述行动的原因。
- source_word: Ἕλλην
  choice: 希腊人
  rationale: 采用该词直接的族群或文化称谓，不在正文中扩大翻译为“外邦人”。
- source_word: ὁ πατὴρ αὐτοῦ ὑπῆρχεν
  choice: 提摩太的父亲是
  rationale: ὑπῆρχεν在此以普通系词“是”表达最自然；重复人名可消除中文代词可能指向保罗的歧义。
theological_decisions:
- issue: 给提摩太行割礼与当地犹太人的关系
  choice: 只陈述保罗因当地犹太人都知道提摩太父亲是希腊人而采取这一行动。
  alternative: 把此举明确解释为救恩或立约身份所必需，或明确界定为纯粹的宣教权宜之计。
  rationale: 经文本身说明了直接原因，却没有在本节中给出更广泛的教义判断；译文因此保留与其他新约段落之间的叙事及神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。为避免连续代词造成指代混乱，两处使用“提摩太”；句法拆为两句，使原因关系清楚，同时保留原文未作进一步解释的动机张力。
