  text: καὶ παραλαβὼν αὐτοὺς ἐν ἐκείνῃ τῇ ὥρᾳ τῆς νυκτὸς ἔλουσεν ἀπὸ τῶν πληγῶν, καὶ ἐβαπτίσθη αὐτὸς καὶ οἱ αὐτοῦ ⸀πάντες παραχρῆμα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/033.yaml
  text: And taking them in that hour of the night[a], he washed their wounds, and he was baptized at once[c][b], he and all his household.
translation:
  language: zh_hans
  text: 他就在夜里的那个时辰[a]带着他们，洗了他们的伤处[b]；他和他全家的人[c]都立刻受了洗。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“在夜里的那个时辰”。这个说法突出事情发生在深夜。
    reason: lexical_alternative
  - marker: b
    text: 原文较直译作“从他们的伤处洗”。意思是他清洗了他们受伤的地方。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“他全家”。原文指属于他家户范围的所有人，不一定只指核心家庭成员。
    reason: alternative_reading
lexical_decisions:
- source_word: παραλαβὼν
  choice: 把他们带去
  rationale: 不定过去时分词表示狱卒先带领保罗和西拉，随后为他们清洗；“带去”自然地呈现动作次序，又不擅自补出具体地点。
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ τῆς νυκτός
  choice: 就在夜里的那个时辰
  rationale: 保留原文对夜间具体时刻的强调；“就在”也自然传达行动的即时性。
- source_word: ἔλουσεν ἀπὸ τῶν πληγῶν
  choice: 洗净他们的伤口
  rationale: 此结构按语境指清洗他们因受打而有的伤处。“洗净……伤口”符合现代汉语表达，同时以脚注说明原文较直译的形式。
- source_word: ἐβαπτίσθη
  choice: 受了洗
  rationale: 采用汉语基督教文本中自然且通行的被动表达，不把具体施洗方式带入译文。
- source_word: οἱ αὐτοῦ πάντες
  choice: 所有属他家中的人
  rationale: 原文直指所有属于他的人，语境为其家庭或家户范围；此译法比“全家”略为展开，也不限定为核心家庭或血亲。
- source_word: παραχρῆμα
  choice: 立刻
  rationale: 简洁准确地传达副词所强调的即时行动。
theological_decisions:
- issue: οἱ αὐτοῦ πάντες所指范围及其与受洗的关系
  choice: 译为“所有属他家中的人”，不说明其年龄、个人信仰告白情况或受洗方式
  alternative: “他全家的人”或“所有家属”
  rationale: 本节陈述狱卒及所有属于其家户范围的人受洗，却没有提供足以裁定后世有关家庭洗礼、婴儿洗礼或施洗方式争论的细节；译文保留这一范围上的张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“狱卒”根据上下文补明分词的主语；“就在……那个时辰”和“立刻”保留原文双重凸显的即时性。标点将照料伤口与受洗两个动作清楚分开。
