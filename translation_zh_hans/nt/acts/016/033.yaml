  rationale: 修订以“带着他们”保留παραλαβών的动作而不补出目的地；以“洗了他们的伤处”避免“洗净”所带来的完成程度强化；以“他全家的人”提供自然的现代汉语，同时由脚注保留οἱ αὐτοῦ πάντες所含较广的家户范围。脚注也删除了原文未明说的“污物”，并将夜间短语与“立刻”副词的不同作用分开。
