  naturalness: “所有属他家中的人”不合现代汉语习惯，也不够清楚。改为“他全家的人”自然；脚注可说明“全家”在此包括其家户中的所有人，不限于核心家庭。
  terminology: “狱卒”“受了洗”均合适，且“受了洗”不预设受洗方式。应保留“全家”的家户性范围，不加入年龄、信仰告白或教派性的推断。
