- from: 他领了这样的命令，就把他们扔进内牢[a]，又把他们的脚牢牢卡在木枷里[b]。
  to: 他接到这样的命令后，就把他们投入内牢[a]，又把他们的脚固定在木制足枷中[b]。
  rationale: 修订保留“这样的命令”、先后动作、“投入”的强烈处置意味和“内牢”的空间含义；仅以“木制足枷”澄清限制部位，并以“固定在”更贴切地表达使其受稳固拘束的动作。脚注也相应说明原文ξύλον的字面义与语境义。
