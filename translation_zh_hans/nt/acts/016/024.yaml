  source_fidelity: 译文整体准确传达了狱卒先领受命令、继而将保罗和西拉置于监禁处并拘束其脚的动作。为避免“木枷”在现代汉语中通常联想到套在颈部的枷具，宜明确为“木制足枷”；“固定”也比“卡在”更准确对应ἠσφαλίσατο的“使稳固、固定”。
  naturalness: “领了……就……”通顺，但“接到这样的命令后”更符合现代标准汉语的叙事表达。“把他们的脚牢牢卡在木枷里”稍显口语化且施事动作不够清晰，改为“把他们的脚固定在木制足枷中”更自然、庄重。
  terminology: “内牢”可用，准确表达ἐσωτέραν φυλακήν。将“木枷”改为“木制足枷”可消除其通常指颈枷的歧义，同时保留ξύλον所指木制拘束器具的语境化含义。
