  text: ὃς παραγγελίαν τοιαύτην ⸀λαβὼν ἔβαλεν αὐτοὺς εἰς τὴν ἐσωτέραν φυλακὴν καὶ τοὺς πόδας ⸂ἠσφαλίσατο αὐτῶν⸃ εἰς τὸ ξύλον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/024.yaml
  text: He[a], having received such an order[b], threw them into the inner prison and secured their feet in the stocks.
translation:
  language: zh_hans
  text: 他接到这样的命令后，就把他们投入内牢[a]，又把他们的脚固定在木制足枷中[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“最里面的牢房”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“木头（制的器具）”；此处指限制双脚的木制器具，即足枷。
    reason: cultural_note
lexical_decisions:
- source_word: παραγγελίαν τοιαύτην
  choice: 这样的命令
  rationale: παραγγελία指权威所下的命令或指示；“这样的命令”自然承接上文所述的严密看守要求。
- source_word: λαβὼν
  choice: 领了
  rationale: 不定过去时分词表示先于主要动作发生；“领了……就……”在现代汉语中自然体现这一先后关系。
- source_word: ἔβαλεν
  choice: 扔进
  rationale: βάλλω本义有“扔、投”之意；此处采用“扔进”，保留狱卒粗暴处置他们的力度，而不弱化为普通的“关进”。
- source_word: ἐσωτέραν φυλακήν
  choice: 内牢
  rationale: ἐσωτέραν是比较级，表示更靠里面的；“内牢”简洁地表达监牢内部更严密的区域，同时保留其可理解为最里面牢房的空间含义。
- source_word: ἠσφαλίσατο
  choice: 牢牢卡在
  rationale: ἀσφαλίζω表示使稳固、使无法脱开；结合木枷限制双脚的方式，“牢牢卡在”比抽象的“固定”更具体自然。
- source_word: τοὺς πόδας αὐτῶν
  choice: 他们的脚
  rationale: 忠实对应πούς的通常含义“脚”，不扩大为“腿”。
- source_word: εἰς τὸ ξύλον
  choice: 在木枷里
  rationale: ξύλον字面为“木头”或“木制物”，在监禁语境中指夹住双脚的木制拘束器具；“木枷”既清楚又符合汉语表达。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“领了……就……”呈现分词与主句的先后联系；“扔进”和“牢牢卡在”保留叙事中粗暴、严密看守的语气。脚注标记按其实际所注释的词语分别置于“内牢”和“木枷里”之后。
