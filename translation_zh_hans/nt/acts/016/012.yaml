id: ACT.16.12
reference: Acts 16:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ⸀κἀκεῖθεν εἰς Φιλίππους, ἥτις ἐστὶν ⸂πρώτη τῆς μερίδος⸃ Μακεδονίας πόλις, κολωνία. ἦμεν δὲ ἐν ⸀ταύτῃ τῇ πόλει διατρίβοντες ἡμέρας τινάς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/012.yaml
  text: and from there to Philippi[a], which is a leading city of the district of Macedonia, a Roman colony[b]. And we stayed in this city for some days.
translation:
  language: zh_hans
  text: 又从那里到了腓立比；这城是马其顿那一区的一座主要城市[a]，也是罗马殖民城[b]。我们在这城住了几天。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“马其顿那一区的第一座城市。”原文这一短语较难确定；“第一”可能指地位、显要程度或先后次序。
    reason: alternative_reading
  - marker: b
    text: 指罗马殖民城，即在罗马统治下获授特殊地位的城市。
    reason: cultural_note
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: 又从那里
  rationale: 保留 καί 的承接作用和 ἐκεῖθεν 的起点含义，使行程叙述自然连贯；“到了”承接上下文的移动动作，并非把该副词本身译成动词。
- source_word: εἰς Φιλίππους
  choice: 到了腓立比
  rationale: εἰς 加城市名表示行程目的地；“腓立比”采用现代中文圣经传统中通行的地名译法。
- source_word: ἥτις
  choice: 这城是
  rationale: 将带解释意味的关系代词转换为自然的中文分句，保留对腓立比身份的补充说明。
- source_word: πρώτη τῆς μερίδος Μακεδονίας πόλις
  choice: 马其顿那一区的一座主要城市
  rationale: πρώτη 在此可能表示首位、显要或次序，历史和句法含义存在争议；正文用“主要”表达其显要性，同时以脚注保留“第一座城市”的可能读法。μερίς 译作“区”，指马其顿境内的区域。
- source_word: κολωνία
  choice: 罗马殖民城
  rationale: 该词在此指腓立比正式的罗马殖民地身份；补出“罗马”可避免现代读者误解其所属政权。
- source_word: ἦμεν ... διατρίβοντες
  choice: 我们……住了
  rationale: 这一迂说结构表达一段持续停留的时间；“住了”在现代汉语中自然，并保留其延续含义。
- source_word: ἐν ταύτῃ τῇ πόλει
  choice: 在这城
  rationale: 保留指示词 ταύτῃ，同时采用简洁、庄重而自然的中文表达。
- source_word: ἡμέρας τινάς
  choice: 几天
  rationale: 表示不确指的一段日数；“几天”自然且不作过度精确的限定。
theological_decisions:
- issue: πρώτη 对腓立比地位的描述
  choice: 正文译为“一座主要城市”
  alternative: “那一区的第一座城市”
  rationale: 原文可能指地位显要，也可能指排行或行程次序。正文避免断言腓立比具有无争议的行政首府地位，脚注则保存较直译的另一种理解。
translation_notes:
  register: 采用现代、庄重、易懂的叙事体。“又从那里到了”承接前文行程；“罗马殖民城”明确古代制度含义。正文中的脚注标记 [a]、[b] 均与脚注对应。
