  text: καὶ καταγγέλλουσιν ἔθη ἃ οὐκ ἔξεστιν ἡμῖν παραδέχεσθαι οὐδὲ ποιεῖν Ῥωμαίοις οὖσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/021.yaml
  text: and they are proclaiming customs that it is not lawful for us to accept or practice[a], since we are Romans.
translation:
  language: zh_hans
  text: 他们还在宣扬一些习俗，而我们身为罗马人，不可以接受或实行这些习俗。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我们身为罗马人”也可译为“既然我们是罗马人”或“作为罗马人”。希腊文的分词短语说明控告者所提出的理由，即他们以自己是罗马人为由，称这些习俗不可接受或实行。
    reason: 词义及句法替代译法
lexical_decisions:
- source_word: καταγγέλλουσιν
  choice: 宣扬
  rationale: 该动词表示公开宣告或传扬；“宣扬”既保留公开传播的意味，也不把控告内容过度解释为正式教导。
- source_word: ἔθη
  choice: 规俗
  rationale: 指群体中形成的习俗或惯例。“规俗”在此兼顾习俗与规范性做法，适合公民和宗教层面的控告语境。
- source_word: οὐκ ἔξεστιν
  choice: 依法不得
  rationale: 该表达涉及法律上或社会规范上的许可。“依法不得”保留控告者使用的法律语气，但不表示叙述者认可其指控属实。
- source_word: παραδέχεσθαι
  choice: 接受
  rationale: 在本语境中指接纳这些规俗为可认可或可遵从的做法；“接受”自然且未将含义限缩为正式采纳。
- source_word: οὐδὲ ποιεῖν
  choice: 或实行
  rationale: ποιεῖν与ἔθη连用时表示实行或遵行某种规俗；“实行”比直译为“做”更符合现代汉语。
- source_word: Ῥωμαίοις οὖσιν
  choice: 我们身为罗马人
  rationale: 该与格分词短语表达控告者所提出的身份依据。“身为”在自然汉语中保留“作为罗马人”及其理由意味，而不额外断定相关法律事实。
- source_word: καὶ
  choice: 还
  rationale: 承接上一节的控告内容；汉语用“还”自然地表达追加指控。
theological_decisions:
- issue: 控告中禁令的性质
  choice: 用“依法不得”呈现法律—公民层面的控告，同时将其明确保留为控告者的说法
  alternative: 译作“我们不应该”或“我们不可以”
  rationale: 经文是在报道控告，并非由路加确认罗马法律确实如此；译文保留法律语气，却不扩展为叙述者的事实判断。
- issue: Ῥωμαίοις οὖσιν的逻辑关系
  choice: 译为“我们身为罗马人”，保留身份依据及潜在的原因意味
  alternative: 明确译为“既然我们是罗马人”
  rationale: 希腊文分词短语在语境中具有原因意味，但形式本身较含蓄；正文不把逻辑关系说得过满，脚注交代可能的明确译法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“规俗”避免仅指个人习惯；“依法不得”保留法政控告的正式色彩。分号式逻辑改用“而”连接，使中文句子流畅，同时维持原文相对从句与身份分词短语之间的张力。
