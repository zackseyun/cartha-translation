  text: καὶ προσαγαγόντες αὐτοὺς τοῖς στρατηγοῖς εἶπαν· Οὗτοι οἱ ἄνθρωποι ἐκταράσσουσιν ἡμῶν τὴν πόλιν Ἰουδαῖοι ὑπάρχοντες,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/020.yaml
  text: And after bringing them before the magistrates[a], they said, “These men are disturbing our city[b], being Jews,”
translation:
  language: zh_hans
  text: 他们把二人带到市政长官[a]面前，说：“这些人扰乱我们的城；他们是犹太人[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“裁判官”。在腓立比这类罗马殖民城中，此词指城市的主要市政官员；他们的称号相当于罗马的“裁判官”。
    reason: cultural_note
  - marker: b
    text: 或译“犹太地人”。希腊语一词既可泛指犹太人，也可指来自犹太地的人；这里的控告很可能针对他们的民族—宗教身份。
    reason: lexical_alternative
lexical_decisions:
- source_word: προσαγαγόντες
  choice: 把二人带到……面前
  rationale: 不定过去时分词表示先于主句“说”的动作；中文用连动结构自然表达这一先后关系。αὐτούς在上文明确指保罗和西拉，因此译作“二人”清楚而不增添姓名。
- source_word: στρατηγοῖς
  choice: 地方长官
  rationale: 这里不是通常意义上的军事将领，而是腓立比这座罗马殖民城的市政官员。“地方长官”对现代读者清楚，历史性称谓另见脚注。
- source_word: ἐκταράσσουσιν
  choice: 扰乱
  rationale: 该词表示造成严重骚动或混乱；“扰乱”保留指控的力度，也不作过度发挥。
- source_word: ἡμῶν τὴν πόλιν
  choice: 我们的城
  rationale: 保留ἡμῶν所表达的归属感和控告者强调本地共同体的修辞。
- source_word: Ἰουδαῖοι
  choice: 犹太人
  rationale: 在此散居地语境中，这个词最可能指民族—宗教身份；“犹太人”比仅指地域来源的“犹太地人”更符合控告内容。
- source_word: ὑπάρχοντες
  choice: 他们是
  rationale: 用独立分句保留分词所附带的身份说明，同时不擅自断定它究竟表示原因、让步还是单纯伴随情形。
- source_word: Οὗτοι οἱ ἄνθρωποι
  choice: 这些人
  rationale: 所指对象是保罗和西拉；中文“这些人”自然准确，并保留控告者指斥的语气。
theological_decisions:
- issue: Ἰουδαῖοι在带有敌意的民族—宗教控告中的译法
  choice: 犹太人
  alternative: 犹太地人
  rationale: 本节是在转述控告者对保罗和西拉的敌意说法，并非叙述者对所有犹太人的评断。腓立比语境中的指控着重他们的民族—宗教身份，与本地罗马公民身份形成对照。
- issue: ὑπάρχοντες与“扰乱”这一指控之间的逻辑关系
  choice: 以分号连接“他们是犹太人”，不明说逻辑关系
  alternative: 译作“因为他们是犹太人”或“身为犹太人”
  rationale: 希腊语分词可以表达伴随情形，也可能暗示控告的理由。独立分句保留这种张力，避免把控告者的排外逻辑解释得过于确定。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“地方长官”兼顾可读性和历史语境；分号使原文末尾“是犹太人”的突兀身份指控得以保留，并避免在正文中替控告者补出明确的因果关系。
