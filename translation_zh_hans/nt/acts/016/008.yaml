  text: So[a], passing by Mysia, they went down to Troas.
translation:
  language: zh_hans
  text: 于是，他们经过[a]每西亚，下到特罗亚。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“穿过每西亚”，或“越过每西亚”。希腊语分词可有几种相近的理解；基本意思是他们继续前行，没有在那里停留。
    reason: lexical_alternative
lexical_decisions:
- source_word: παρελθόντες
  choice: 经过
  rationale: 该词是 παρέρχομαι 的简单过去时主动分词，带宾格“每西亚”。这里可指经过、越过或从旁而过该地区；“经过”自然简洁，并保留他们继续前行而未在那里停留的基本叙事含义。
- source_word: δὲ
  choice: 于是
  rationale: δὲ 在此是轻微的叙事连接词。“于是”自然承接上文，但不赋予它强烈的转折意义。
- source_word: Μυσίαν
  choice: 每西亚
  rationale: 采用现代简体中文圣经地名的通行译名。
- source_word: κατέβησαν
  choice: 下到
  rationale: καταβαίνω 表示向下而行；“下到”既保留方向性，也符合前往某地的现代汉语表达，可能涉及朝海岸或较低地势移动。
- source_word: εἰς
  choice: 到
  rationale: εἰς 指向目的地；与城市名连用时译作“到”最自然。
- source_word: Τρῳάδα
  choice: 特罗亚
  rationale: 采用现代简体中文圣经地名的通行译名。
