  text: τοῦτο δὲ ἐποίει ἐπὶ πολλὰς ἡμέρας. διαπονηθεὶς ⸀δὲ Παῦλος καὶ ἐπιστρέψας τῷ πνεύματι εἶπεν· Παραγγέλλω σοι ⸀ἐν ὀνόματι Ἰησοῦ Χριστοῦ ἐξελθεῖν ἀπ’ αὐτῆς· καὶ ἐξῆλθεν αὐτῇ τῇ ὥρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/018.yaml
  text: And she kept doing this for many days[a]. But Paul, becoming greatly troubled, turned to the spirit and said[b], “I command you in the name of Jesus the Messiah to come out of her.” And it came out that very hour.
translation:
  language: zh_hans
  text: 她一连许多天都这样做。保罗不胜其扰，就转过身来，对那灵说：“我奉耶稣这位弥赛亚的名命令你，从她身上出来！”那灵就在那一刻离开了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐποίει ἐπὶ πολλὰς ἡμέρας
  choice: 一连许多天都这样做
  rationale: 未完成时表示过去持续或反复发生的动作；“一连许多天都这样做”自然地传达其延续性。
- source_word: διαπονηθεὶς
  choice: 深感烦扰
  rationale: 该词表达强烈的困扰、苦恼或不堪其扰，并非仅指轻微厌烦；“深感烦扰”保留了强度，也不擅自解释为愤怒。
- source_word: ἐπιστρέψας
  choice: 转过身来
  rationale: 这里描写保罗在说话前转身面向那灵；此译法在汉语中清楚自然。
- source_word: τῷ πνεύματι
  choice: 对那灵
  rationale: 希腊文只说“那灵”，没有明说“邪灵”或“鬼”；译文保留原文措辞，由上下文辨明其性质。
- source_word: Παραγγέλλω σοι
  choice: 我命令你
  rationale: παραγγέλλω在此表示带有权柄的命令；“我命令你”准确直接。
- source_word: ἐν ὀνόματι Ἰησοῦ Χριστοῦ
  choice: 奉弥赛亚耶稣的名
  rationale: “奉……的名”是现代汉语中表达凭其权柄行事的自然说法；Χριστός在此保留称号含义，译为“弥赛亚”，并按汉语习惯置于“耶稣”之前。
- source_word: ἐξελθεῖν ἀπ’ αὐτῆς
  choice: 从她身上出来
  rationale: 准确表达灵离开女子的命令，也符合汉语相关叙述的习惯。
- source_word: ἐξῆλθεν αὐτῇ τῇ ὥρᾳ
  choice: 那灵就在那一刻出来了
  rationale: 补出上下文隐含的主语“那灵”，避免汉语歧义；“就在那一刻”传达αὐτῇ τῇ ὥρᾳ所强调的即时性。
theological_decisions:
- issue: 命令公式中Χριστοῦ的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: Χριστός在此作为耶稣的称号，译作“弥赛亚”可直接保留“受膏者”的称号意义，而不把它处理成近似姓名的一部分。
- issue: 是否在正文中把πνεῦμα明确译为邪灵或鬼
  choice: 那灵
  alternative: 那邪灵；那个鬼
  rationale: 本节原文没有为πνεῦμα加“邪恶”之类的限定语。正文不增加原文未明说的定性，让上下文说明其为辖制使女的灵。
translation_notes:
  register: 采用庄重、清楚的现代标准普通话。“烦扰”保持较正式而易懂的语体；“奉……的名”自然表达凭借权柄。“那一刻”比逐字的“那一小时”更准确传达该希腊习语的即时含义。
