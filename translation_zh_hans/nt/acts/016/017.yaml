id: ACT.16.17
reference: Acts 16:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: αὕτη ⸀κατακολουθοῦσα τῷ Παύλῳ καὶ ἡμῖν ἔκραζεν λέγουσα· Οὗτοι οἱ ἄνθρωποι δοῦλοι τοῦ θεοῦ τοῦ ὑψίστου εἰσίν, οἵτινες καταγγέλλουσιν ⸀ὑμῖν ὁδὸν σωτηρίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/017.yaml
  text: She kept following Paul and us and crying out[a], saying, “These men are slaves of the Most High God, who are proclaiming to you the way of salvation.”
translation:
  language: zh_hans
  text: 她跟在保罗和我们后面，不住地喊着说：“这些人是至高上帝的奴仆，他们正向你们宣告得救的道路[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可理解为“一条得救的道路”。希腊语“道路”在这里没有冠词，单凭这一形式不能确定是定指还是不定指。
    reason: 保留ὁδὸν σωτηρίας在定指性上的真实歧义。
lexical_decisions:
- source_word: κατακολουθοῦσα
  choice: 跟在……后面
  rationale: 该词表示跟随；现在分词与未完成时主句相配，描写持续进行的动作。“跟在……后面”符合现代汉语习惯，持续意味由“不住地”及整句语境共同表达。
- source_word: ἔκραζεν
  choice: 不住地喊着
  rationale: 未完成时表示持续或反复发生，κράζω表示高声呼喊；“不住地喊着”兼顾声音强度和延续性。
- source_word: δοῦλοι
  choice: 奴仆
  rationale: δοῦλοι强调归属于主人并受其支配。“奴仆”既保留这种归属关系，也比现代汉语中的“奴隶”更适合此处宗教身份称谓，同时不弱化为一般的“仆人”。
- source_word: τοῦ θεοῦ τοῦ ὑψίστου
  choice: 至高上帝
  rationale: 保留ὕψιστος作为上帝称号的最高级含义，并采用自然、庄重的现代汉语表达。
- source_word: καταγγέλλουσιν
  choice: 正……宣告
  rationale: 该动词表示公开传报、宣讲；“宣告”保留公开而郑重的语气，“正”体现现在时动作。
- source_word: ὑμῖν
  choice: 向你们
  rationale: 将与格自然表达为宣告所面向的听众。
- source_word: ὁδὸν σωτηρίας
  choice: 得救的道路
  rationale: “道路”保留ὁδός的路径意象；“得救”以自然汉语表达σωτηρία。汉语名词短语本身不强制区分定指与不定指，因此正文可保留原文在此处的开放性。
theological_decisions:
- issue: ὁδὸν σωτηρίας的定指性
  choice: 得救的道路
  alternative: 一条得救的道路
  rationale: 希腊语ὁδόν前没有冠词，但无冠词并不必然等于不定指。现代汉语“得救的道路”不必明确标示“一条”或“那条”，因而能较自然地保留原文可能为定指或不定指的张力；脚注交代另一种理解，避免在正文中额外强化排他性或非排他性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“不住地喊着”呈现持续动作；“奴仆”保留归属和受支配的含义，又避免过度口语化。脚注标记置于实际存在歧义的“得救的道路”之后。
