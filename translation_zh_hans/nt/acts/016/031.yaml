revisions:
- from: 他们说：“要信主耶稣，你和你一家的人都必得救。”[a]
  to: 他们说：“信主耶稣，你和你全家必得救。”[a]
  rationale: 将“要信”简化为“信”，仍保留希腊文不定过去时命令的直接呼召，且更符合简洁的现代汉语经文语体。以“你和你全家”替代“你和你一家的人”，并删去“都”，使表达更自然，并避免在家庭得救方式上作超出本节的强化。脚注限于οἶκος的家户含义，不以注释解决经文保留的神学歧义。
