  text: οἱ δὲ εἶπαν· Πίστευσον ἐπὶ τὸν κύριον ⸀Ἰησοῦν, καὶ σωθήσῃ σὺ καὶ ὁ οἶκός σου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/031.yaml
  text: And they said[a], “Believe in the Lord Jesus[b], and you will be saved—you and your household.”
translation:
  language: zh_hans
  text: 他们说：“信主耶稣，你和你全家必得救。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “全家”指属于他家中的人，而不是房屋本身。
    reason: cultural_note
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: 他们说
  rationale: δέ在这里是轻微的叙事连接词；现代汉语无需硬译为“于是”或“但”，省略连接词更自然，也不增添原文没有强调的转折。
- source_word: Πίστευσον ἐπὶ τὸν
  choice: 要信
  rationale: πιστεύω与ἐπί加宾格表示把信心投向某一对象。“信”在现代汉语基督教语境中直接自然；用“要”表达不定过去时命令语气所要求的明确回应，同时不把体貌过度解释为一次性的心理行为。
- source_word: κύριον Ἰησοῦν
  choice: 主耶稣
  rationale: “主”保留κύριος在此处的尊称及基督论分量；Ἰησοῦν按现代汉语惯例译作“耶稣”。
- source_word: σωθήσῃ
  choice: 必得救
  rationale: 将σῴζω的将来时被动语态译为“必得救”，既表达应许的将来结果，也保留施救者未明说的神圣被动含义；在本段福音宣讲语境中，“得救”比单指现实脱险的“获救”更恰当。
- source_word: σὺ καὶ ὁ οἶκός σου
  choice: 你和你一家的人
  rationale: οἶκος在这里指家中的人员共同体，而非房屋建筑。“一家的人”是普通现代汉语中清楚自然的表达，同时不自行界定其中具体包括哪些成员。
theological_decisions:
- issue: “你和你一家的人”所得应许的范围与方式
  choice: 按原文直接保留“你和你一家的人都必得救”，不说明家人是否凭狱卒一人的信而自动得救。
  alternative: 译成“你信了，就会使你全家都得救”，或改写为“你和你家里每个信的人都会得救”。
  rationale: 原句把狱卒及其一家都纳入应许，却没有在本节单独交代应许如何落实。使徒行传16:32随后记载主的道也讲给他和他家里所有的人听。译文应保留本节的家庭范围及其神学张力，避免导入圣约式或严格个人主义的解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“要信”保持命令的直接性；“必得救”保持应许的确定性。脚注标记置于整句之后，说明“家”的群体含义，同时不替原文解决家庭得救方式的争议。
