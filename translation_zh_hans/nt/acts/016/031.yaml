review_pass:
  verdict: revise
  source_fidelity: 译文准确传达命令“信”、信靠对象“主耶稣”、将来被动的“得救”以及“你和你的家”的并列范围。惟“都”在汉语中容易使“你和你一家的人”显得是同受同一条件自动实现的断言；原文虽将二者并列在应许中，却未在本节明确这种机制。删去“都”可较少引导性，同时保留原句的张力。
  naturalness: “要信主耶稣”自然、庄重，但“你和你一家的人”略显冗长；现代标准汉语圣经语体中“你和你全家”更简洁自然，且“全家”可指家庭／家户成员而非建筑。
  terminology: “主耶稣”“得救”均为准确且符合现代汉语基督教文本惯例的核心术语。脚注中“不 是指房屋本身”可保留为文化说明；原有关于“自动得救”的释义虽意在避免教派化理解，却超出了词义脚注所需，宜删除，以免脚注替经文裁定争议。
  issues:
  - severity: low
    issue: “都必得救”可能在汉语中加强家庭成员自动、同条件得救的读感。
    rationale: σὺ καὶ ὁ οἶκός σου只是将“你”和“你的家户”并列于将来得救的应许中；本节没有明说实施机制。译作“你和你全家必得救”更贴近并列结构，较少添加汉语的分配性强调。
  - severity: medium
    issue: 脚注加入“本节没有说明家人是否会因他一人的信而自动得救”。
    rationale: 这属于正确的解释性谨慎，但不是原文中“家户”的词义说明，且会把特定神学争议前置。为保留原文歧义，脚注应仅说明“全家／家户”不是建筑物。
  revised_text: 他们说：“信主耶稣，你和你全家必得救。”[a]
  revised_footnotes:
  - marker: a
    text: “全家”指属于他家中的人，而不是房屋本身。
    reason: cultural_note
