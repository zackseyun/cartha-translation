id: ACT.16.10
reference: Acts 16:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὡς δὲ τὸ ὅραμα εἶδεν, εὐθέως ἐζητήσαμεν ἐξελθεῖν ⸀εἰς Μακεδονίαν, συμβιβάζοντες ὅτι προσκέκληται ἡμᾶς ὁ ⸀θεὸς εὐαγγελίσασθαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/010.yaml
  text: And when he had seen the vision[a], we immediately sought to go on into Macedonia[c][b], concluding that God had called us to proclaim the good news to them.
translation:
  language: zh_hans
  text: 他看见这异象后，我们立刻设法前往马其顿，断定神已经呼召我们向那里的人传福音。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς δὲ
  choice: ……后
  rationale: 在现代汉语中自然表达轻微承接和时间关系，不额外强化为“刚一……就”。
- source_word: τὸ ὅραμα
  choice: 这异象
  rationale: “异象”是启示性所见的通行译法；“这”承接上一节所述异象。
- source_word: εἶδεν
  choice: 他看见
  rationale: 保留第三人称单数，并以“后”明确该动作先于众人的行动。
- source_word: εὐθέως
  choice: 立刻
  rationale: 准确传达行动的即时性，且符合现代叙事语体。
- source_word: ἐζητήσαμεν
  choice: 我们设法
  rationale: 此处 ζητέω 表示着手谋求、力图实行；“设法”比字面的“寻求”更符合旅行语境，同时不把结果说得过满。
- source_word: ἐξελθεῖν εἰς Μακεδονίαν
  choice: 前往马其顿
  rationale: 自然表达离开现地、以马其顿为目的地的旅行行动；汉语无需机械保留“出去进入”的空间结构。
- source_word: συμβιβάζοντες
  choice: 断定
  rationale: 表达众人把异象中的线索综合起来而得出结论；不暗示未经思考的直觉。
- source_word: προσκέκληται
  choice: 已经呼召
  rationale: 保留完成时所表达的既成呼召及其当前效力；“呼召”也保留神主动差遣的力度。
- source_word: ὁ θεὸς
  choice: 神
  rationale: 采用现代中文圣经语体中自然、庄重的标准称谓，不添加解释性限定。
- source_word: εὐαγγελίσασθαι
  choice: 传福音
  rationale: 准确简明地表达宣告好消息，在现代汉语基督教语境中通俗而庄重。
- source_word: αὐτούς
  choice: 向那里的人
  rationale: 代词所指是马其顿的人；中文明确为“那里的人”可避免“向他们”因前文缺少复数先行词而显得突兀。
theological_decisions:
- issue: 叙事突然转为第一人称复数
  choice: 保留“我们立刻设法”
  alternative: 改为无人称叙述，或解释“我们”所包含的具体人员
  rationale: 原文明确转为第一人称复数；译文保留这一文本特征，但不据此加入任何作者身份理论。
- issue: 神的引导与人的推断之间的关系
  choice: 译为“断定神已经呼召我们”
  alternative: 译为“神正在引导我们”或把结论写成直接启示
  rationale: 原文一方面称神已经呼召，另一方面用分词表明众人是从异象推断出这一点；译文同时保留神的主动呼召和人的辨认过程。
translation_notes:
  register: 采用现代、简洁而庄重的叙事汉语。保留“他”到“我们”的人称转换，并避免机械直译希腊语空间表达。原始资料所列英文脚注标记与脚注内容明显错配，且正文标记顺序异常，因此不沿用；本节中文译文没有必须借脚注保留的实质歧义。
