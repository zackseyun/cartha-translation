  text: Κατήντησεν δὲ ⸀καὶ εἰς Δέρβην καὶ ⸀εἰς Λύστραν. καὶ ἰδοὺ μαθητής τις ἦν ἐκεῖ ὀνόματι Τιμόθεος, υἱὸς ⸀γυναικὸς Ἰουδαίας πιστῆς, πατρὸς δὲ Ἕλληνος,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/001.yaml
  text: He also came to Derbe and to Lystra[a]. And behold, a certain disciple was there named Timothy, the son of a believing Jewish woman, but of a Greek father[b],
translation:
  language: zh_hans
  text: 保罗也来到特庇，又来到路司得。看哪，那里有一个门徒，名叫提摩太；他的母亲是信主的犹太妇人[a]，父亲却是希腊人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“忠信的犹太妇人”。希腊语这个形容词既可表示“相信的”，也可表示“忠信的”；在《使徒行传》中，此处较可能是“相信的”，即信主的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατήντησεν δὲ καὶ
  choice: 保罗也来到
  rationale: καταντάω表示到达某地；“来到”自然地承接行程。希腊文省略主语，按上文叙事补出“保罗”，可避免中文指代含混。δὲ καὶ译作“也”，体现承接与递进。
- source_word: εἰς Δέρβην καὶ εἰς Λύστραν
  choice: 来到特庇，又来到路司得
  rationale: 重复“来到”体现原文两次εἰς的行程节奏，并使用通行地名译法。
- source_word: καὶ ἰδοὺ
  choice: 看哪
  rationale: 保留ἰδού吸引读者注意、增强叙事现场感的标记性；省去连接词καί，以符合现代汉语行文。
- source_word: μαθητής τις ἦν ἐκεῖ ὀνόματι Τιμόθεος
  choice: 那里有一个门徒，名叫提摩太
  rationale: “那里有”自然表达存在句及ἐκεῖ的地点意义；τις用“一个”引入特定但初次出现的人物，“门徒”为μαθητής在《使徒行传》中的标准译法。
- source_word: υἱὸς γυναικὸς Ἰουδαίας πιστῆς
  choice: 他母亲是信主的犹太人
  rationale: 将紧凑的属格结构转换为自然中文亲属陈述。“信主的”在本语境中表达πιστή较可能的“信徒、相信者”含义，同时不把它泛化为品格上的可靠。
- source_word: πατρὸς δὲ Ἕλληνος
  choice: 父亲却是希腊人
  rationale: 补足原文省略的系词，以自然中文呈现；“却”保留δέ所表达的父母背景对比，Ἕλλην直译为“希腊人”而非较宽泛的“外邦人”。
theological_decisions:
- issue: πιστῆς描述提摩太母亲时的含义
  choice: 信主的犹太人
  alternative: 忠信的犹太妇人
  rationale: πιστός既可指“相信的、信徒”，也可指“忠信的”。结合《使徒行传》的用法及提摩太作为门徒的叙境，此处较可能指她是信徒；脚注保留另一种词义可能，避免消除原文歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“看哪”有意保留原文醒目的话语标记。中文中补出承接上文的主语“保罗”，并将原文两个省略式亲属短语改写为完整分句，以提高可读性而不改变对比关系。
