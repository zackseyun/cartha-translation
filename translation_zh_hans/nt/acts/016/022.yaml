  text: καὶ συνεπέστη ὁ ὄχλος κατ’ αὐτῶν, καὶ οἱ στρατηγοὶ περιρήξαντες αὐτῶν τὰ ἱμάτια ἐκέλευον ῥαβδίζειν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/022.yaml
  text: And the crowd rose up together against them[a], and the magistrates, after tearing off their garments, were ordering them to be beaten with rods[b],
translation:
  language: zh_hans
  text: 民众一齐起来反对他们[a]；官长[b]扯下保罗和西拉的衣服，吩咐用杖打他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“一同攻击他们”。希腊语动词强调民众集体采取敌对行动。
    reason: lexical_alternative
  - marker: b
    text: 这里的“官长”指腓立比的罗马城市行政长官；更专门的称呼可译作“执政官”。
    reason: cultural_note
lexical_decisions:
- source_word: συνεπέστη
  choice: 一同起来反对
  rationale: 既保留复合动词所表达的集体行动，也传达针对保罗和西拉的敌对意味；不直接译成“一同攻击”，以免把动作的具体程度说得过满。
- source_word: ὄχλος
  choice: 民众
  rationale: 指聚集的人群；“民众”在现代汉语中自然、庄重，又不像“暴民”那样额外判定其群体性质。
- source_word: κατ’ αὐτῶν
  choice: 反对他们
  rationale: 表达κατά在此处的敌对含义，与“一同起来”连用自然。
- source_word: στρατηγοὶ
  choice: 官长
  rationale: 此词在腓立比指当地罗马城市行政长官；正文采用普通读者易懂的“官长”，具体背景置于脚注。
- source_word: περιρήξαντες
  choice: 扯掉
  rationale: 表达用力撕扯、剥去衣服的动作，并以汉语语序自然呈现其先于下令发生。
- source_word: αὐτῶν τὰ ἱμάτια
  choice: 他们的衣服
  rationale: 代词指保罗和西拉，ἱμάτια泛指其衣服；“衣服”比“衣袍”更自然，也不无根据地限定服装样式。
- source_word: ἐκέλευον
  choice: 吩咐
  rationale: 准确表达官长发出命令；在叙事语境中，“吩咐人……”自然体现使役关系，不过度强化未必明确的反复意味。
- source_word: ῥαβδίζειν
  choice: 用棍打
  rationale: 明确保留以棍杖施打这一罗马体罚方式，避免“鞭打”让人误以为使用的是鞭子。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“一同起来反对”保留原文集体敌对行动的力度与一定程度的含混；分号呈现民众行动与官长司法暴力之间紧密相连但主体不同的两个分句。
