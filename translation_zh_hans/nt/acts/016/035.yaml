  text: Ἡμέρας δὲ γενομένης ἀπέστειλαν οἱ στρατηγοὶ τοὺς ῥαβδούχους λέγοντες· Ἀπόλυσον τοὺς ἀνθρώπους ἐκείνους.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/035.yaml
  text: And when day came[a], the magistrates sent the rod-bearers, saying, “Release those men.”
translation:
  language: zh_hans
  text: 天亮时，地方官派持杖的侍从[a]来，说：“释放那两个人。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“束棒侍从”（拉丁语lictores）；他们是罗马地方官的正式侍从，携带束棒，作为权威的象征。
    reason: 说明ῥαβδούχους所指的罗马官员侍从及其历史称谓，同时保留正文“持杖的侍从”的可理解字面译法。
lexical_decisions:
- source_word: Ἡμέρας δὲ γενομένης
  choice: 天亮以后
  rationale: 这是属格独立结构，表示时间推进；“天亮以后”自然、清楚地表达“到了白天”的意思。上下文的衔接在中文叙事中无需另加“而”。
- source_word: ἀπέστειλαν
  choice: 派……来
  rationale: ἀποστέλλω在此指官长差派人员前往监牢；中文用“派……来”既自然，也保留差遣的含义。
- source_word: οἱ στρατηγοὶ
  choice: 官长
  rationale: 在腓立比这一罗马殖民城的语境中，该词指地方行政长官，并非通常意义上的军事将领；“官长”简洁且符合历史语境。
- source_word: τοὺς ῥαβδούχους
  choice: 持杖的侍从
  rationale: 该词字面意为“持杖者”，指罗马官长的正式侍从。“持杖的侍从”兼顾具体形象、官方身份和现代读者的可理解性。
- source_word: λέγοντες
  choice: 说
  rationale: 该分词引出官长所传达的命令；中文以“说”自然连接差派行动与信息内容。
- source_word: Ἀπόλυσον
  choice: 释放
  rationale: 这是单数命令式，命令收信者释放在押者；“释放”准确体现司法和拘押语境。
- source_word: τοὺς ἀνθρώπους ἐκείνους
  choice: 那两个人
  rationale: 所指的是保罗和西拉两人；中文补出“两”能自然、准确地表明上下文中明确的两名对象，而不增加身份判断。
theological_decisions: []
