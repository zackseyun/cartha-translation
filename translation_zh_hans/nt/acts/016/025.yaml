  yaml_path: translation/nt/acts/016/025.yaml
  text: About midnight Paul and Silas were praying and singing hymns to God[a], and the prisoners were listening to them.
translation:
  language: zh_hans
  text: 约在半夜，保罗和西拉一面祷告，一面唱诗赞美上帝；囚犯们正在听他们[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“囚犯们在专心听他们”。这里的希腊语动词可含留神或专注聆听的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατὰ δὲ τὸ μεσονύκτιον
  choice: 约在半夜
  rationale: κατά加时间宾格在这里表示大约处于某个时刻；δέ仅作轻微承接，不必另译。
- source_word: Παῦλος καὶ Σιλᾶς
  choice: 保罗和西拉
  rationale: 采用现代中文圣经语境中通行的人名音译。
- source_word: προσευχόμενοι
  choice: 一面祷告
  rationale: 现在时分词表示与主句动作同时持续进行；与“一面……一面……”配合，能自然表达两项同时发生的行动。
- source_word: ὕμνουν τὸν θεόν
  choice: 一面唱诗赞美上帝
  rationale: ὑμνέω指唱颂歌或诗歌赞美；补出“赞美”可清楚表达唱诗的对象和目的，同时保留“唱”的具体含义。
- source_word: ἐπηκροῶντο
  choice: 都在听着
  rationale: 未完成时表达持续动作。该动词还可带专心、留神聆听的意味，主文采用自然简洁的说法，并在脚注保留较强语气。
- source_word: οἱ δέσμιοι
  choice: 囚犯们
  rationale: δέσμιος在本叙事语境中指被囚禁的人；“囚犯”准确而自然。
