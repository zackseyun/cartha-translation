  text: ὡς δὲ ἐβαπτίσθη καὶ ὁ οἶκος αὐτῆς, παρεκάλεσεν λέγουσα· Εἰ κεκρίκατέ με πιστὴν τῷ κυρίῳ εἶναι, εἰσελθόντες εἰς τὸν οἶκόν μου ⸀μένετε· καὶ παρεβιάσατο ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/015.yaml
  text: And when she and her household were baptized[a], she urged us, saying, “If you have judged me to be faithful to the Lord, come into my house and stay.” And she prevailed upon us.
translation:
  language: zh_hans
  text: 她和她一家受了洗后，她恳请我们说：“你们若认定我是忠于主的人[a]，就请到我家里来住。”她再三坚持，终于说服了我们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“是信主的人。”希腊语此词可指忠信、可靠或有信心的。
    reason: πιστή在此具有词义上的弹性；正文采用“忠于主的人”，脚注说明其亦可理解为“信主的人”。
lexical_decisions:
- source_word: ὡς δὲ ἐβαπτίσθη καὶ ὁ οἶκος αὐτῆς
  choice: 她和她一家受洗以后
  rationale: ὡς δὲ在这里引出后续时间关系；单数动词先以吕底亚为中心，随后加上她的全家。现代汉语用并列主语自然表达，不改变经文对家庭成员构成及个别信仰状况的沉默。οἶκος此处指共同生活的家庭成员，而非房屋。
- source_word: παρεκάλεσεν
  choice: 她恳请我们
  rationale: παρακαλέω在此兼有请求和诚恳敦促之意；“恳请”既符合她邀请留宿的语境，也与下文更强烈的坚持相衔接。
- source_word: Εἰ κεκρίκατέ με πιστὴν τῷ κυρίῳ εἶναι
  choice: 你们若认定我是忠于主的
  rationale: κεκρίκατε的完成时表达已经形成的判断，译作“认定”；πιστή可指忠信、可信或相信，正文“忠于主”保留其关系性和品格层面的含义，并以脚注说明另一可能。
- source_word: εἰσελθόντες εἰς τὸν οἶκόν μου μένετε
  choice: 就请到我家里来住
  rationale: 分词εἰσελθόντες与命令式μένετε构成连贯邀请，现代汉语自然译为“到我家里来住”。此处οἶκος指实际住所，故译“家里”，与前文指家庭成员的“一家”区分。
- source_word: καὶ παρεβιάσατο ἡμᾶς
  choice: 她再三坚持，我们便答应了
  rationale: παραβιάζομαι表示强力敦促并最终使对方接受；此译体现她的坚持和劝请成功，又避免“强迫”所暗示的胁迫意味。
theological_decisions:
- issue: “她和她一家受洗”可能引出的洗礼对象争议
  choice: 照实陈述她和她一家受洗，不说明家庭成员的年龄或个人信仰状况
  alternative: 译文暗示其中有婴孩，或暗示每位成员都已作个人信仰宣认
  rationale: 原文没有交代这一家的具体构成，也未在本节展开洗礼教义；译文不替叙事补入后世争论的结论。
- issue: πιστή在吕底亚自述中的含义
  choice: 忠于主的
  alternative: 信主的人；在主面前可信的人
  rationale: 该形容词兼有相信、忠信和可靠等语义。“忠于主”保留其对主的归属与忠诚含义，脚注同时呈现“信主的人”这一合理理解，不将歧义单向解决。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事体。“一家”与“家里”分别呈现οἶκος的家庭成员义和住所义；“再三坚持，我们便答应了”清楚表达热切款待，而不造成强制胁迫的印象。
