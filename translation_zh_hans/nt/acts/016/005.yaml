  text: αἱ μὲν οὖν ἐκκλησίαι ἐστερεοῦντο τῇ πίστει καὶ ἐπερίσσευον τῷ ἀριθμῷ καθ’ ἡμέραν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/005.yaml
  text: So the churches were being strengthened in the faith and were increasing in number day by day[a].
translation:
  language: zh_hans
  text: 于是，众教会在信仰上不断得到坚固，人数也天天增加。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在信仰上”或译“在信心上”。希腊语既可能指教会共同持守的信仰及其生活，也可能较一般地指信心。
    reason: alternative_reading
lexical_decisions:
- source_word: αἱ μὲν οὖν
  choice: 于是
  rationale: 这一组小品词承接上文并作总结；“于是”自然地表达叙事上的承接和结果关系，不必把 μέν 单独译出。
- source_word: ἐκκλησίαι
  choice: 各地的教会
  rationale: 这里的复数指多个地方的基督徒群体；“教会”是现代汉语中清楚而通行的表达，补出“各地的”可自然体现复数而不改变所指。
- source_word: ἐστερεοῦντο
  choice: 不断得到坚固
  rationale: 未完成时被动语态表示过去持续发生的被坚固过程；“不断得到坚固”同时保留持续性和被动意义。
- source_word: τῇ πίστει
  choice: 在信仰上
  rationale: 定冠词及教会语境较支持共同持守的基督信仰这一含义；“在……上”自然表达此处与格所表示的方面或范围，同时脚注保留主观“信心”的可能。
- source_word: ἐπερίσσευον
  choice: 增加
  rationale: 该动词在这里与“人数”连用，表示数量增长；“增加”简明自然，持续意义由“天天”充分体现。
- source_word: τῷ ἀριθμῷ
  choice: 人数
  rationale: 此与格指出增长所涉及的方面；汉语直接译作“人数增加”比照搬“在数目上”更自然。
- source_word: καθ’ ἡμέραν
  choice: 天天
  rationale: 准确表达逐日、反复发生的增长，语言简洁而有动态感。
theological_decisions:
- issue: τῇ πίστει 中 πίστις 的含义
  choice: 信仰，即教会共同持守的信仰内容与生活
  alternative: 信心，即信徒对上帝的信靠
  rationale: 定冠词和教会群体的语境较倾向共同信仰这一理解，但希腊语也可能泛指信心；正文采用较可能的读法，脚注保留真实歧义。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“不断得到坚固”保留原文未完成时被动语态的持续意味；“人数也天天增加”以自然汉语表达逐日的数量增长。
