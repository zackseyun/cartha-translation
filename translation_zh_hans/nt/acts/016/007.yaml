source:
  edition: SBLGNT
  text: ἐλθόντες ⸀δὲ κατὰ τὴν Μυσίαν ἐπείραζον ⸀εἰς τὴν Βιθυνίαν ⸀πορευθῆναι καὶ οὐκ εἴασεν αὐτοὺς τὸ πνεῦμα ⸀Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/007.yaml
  text: But when they came to Mysia[a], they were trying to go into Bithynia, and the Spirit of Jesus did not permit them.
translation:
  language: zh_hans
  text: 可是，他们到了每西亚一带[a]，正试图进入庇推尼，耶稣的灵却不准他们去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“靠近每西亚”或“沿着每西亚”。这里的希腊语很可能是指他们到达了每西亚的边境一带。
    reason: 保留κατὰ τὴν Μυσίαν在地理描述中的词义选择及边境含义。
lexical_decisions:
- source_word: ἐλθόντες
  choice: 到了
  rationale: 不定过去时分词在此表示相对于后续行动在先的时间关系；“到了”以自然汉语交代行程次序。
- source_word: δὲ
  choice: 可是
  rationale: δέ表示叙事推进中轻微的转折；“可是”承接上文并引出他们再次受阻。
- source_word: κατὰ τὴν Μυσίαν
  choice: 每西亚一带[a]
  rationale: κατά加宾格用于地理描述时可指靠近、沿着或面对某地区。译作“一带”自然表达抵达每西亚边缘区域的可能含义，同时以脚注保留其他理解。
- source_word: ἐπείραζον
  choice: 正试图
  rationale: 未完成过去时呈现当时正在进行的尝试；“正试图”兼顾未完成体和意图未能实现的语义。
- source_word: εἰς τὴν Βιθυνίαν πορευθῆναι
  choice: 进入庇推尼
  rationale: εἰς表示朝向并进入该地区，πορεύομαι表示行进；“进入”简洁保留方向性。
- source_word: οὐκ εἴασεν αὐτοὺς
  choice: 却不准他们去
  rationale: ἐάω意为准许、容许；“不准”准确而自然，且不强化为更严厉的“禁止”。补出“去”使汉语宾语结构完整。
- source_word: τὸ πνεῦμα Ἰησοῦ
  choice: 耶稣的灵
  rationale: 直译属格结构，保留原文少见而明确的基督论表达，不将其同化为“圣灵”或笼统译作“灵”。
theological_decisions:
- issue: τὸ πνεῦμα Ἰησοῦ这一基督论短语的译法
  choice: 耶稣的灵
  alternative: 圣灵；灵
  rationale: 原文明确含有“耶稣”的属格限定。正文保留“耶稣的灵”，既忠于措辞，也不额外解释这一称谓与“圣灵”的关系，从而保留经文本身的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“正试图”体现未完成过去时；前置“可是”和后置“却”使转折在汉语中清楚自然。“每西亚”“庇推尼”采用常见圣经地名译法。
