  text: τῇ τε ἡμέρᾳ τῶν σαββάτων ἐξήλθομεν ἔξω τῆς ⸀πύλης παρὰ ποταμὸν οὗ ⸂ἐνομίζομεν προσευχὴν⸃ εἶναι, καὶ καθίσαντες ἐλαλοῦμεν ταῖς συνελθούσαις γυναιξίν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/013.yaml
  text: On the Sabbath day we went outside the gate beside the river[a], where we supposed there was a place of prayer, and after sitting down we were speaking to the women who had gathered there.
translation:
  language: zh_hans
  text: 安息日，我们出了城门，来到河边，以为那里有祷告的地方[a]。我们坐下后，就同聚集在那里的妇女交谈。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以为那里有祷告。”希腊语“祷告”一词既可指祷告这件事，也可指专供祷告的地方；本节语境较支持后一种意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ τε ἡμέρᾳ τῶν σαββάτων
  choice: 安息日
  rationale: 这是通用希腊语中表示安息日的惯用说法；不按字面生硬译作“众安息日之日”。
- source_word: ἐξήλθομεν ἔξω τῆς πύλης
  choice: 我们出了城门
  rationale: ἐξέρχομαι与ἔξω共同表达向外而去。“城”虽未单独明说，但πύλη在此叙事环境中指城门，译作“城门”符合现代汉语，也清楚表达空间关系。
- source_word: παρὰ ποταμόν
  choice: 来到河边
  rationale: παρά加宾格在这里表示移动至河流旁边；“来到河边”自然传达目的地和移动方向。
- source_word: οὗ ἐνομίζομεν προσευχὴν εἶναι
  choice: 以为那里有祷告的地方
  rationale: νομίζω意为“以为、认为”；προσευχή既可指祷告，也可指划作祷告之用的场所。上下文描述河边一处聚集地点，因此正文采用后者，同时以脚注保留词义歧义。
- source_word: καὶ καθίσαντες
  choice: 我们坐下后
  rationale: 不定过去时分词通常表示先于主要动词发生的动作；“坐下后”清楚呈现先后次序。
- source_word: ἐλαλοῦμεν
  choice: 讲论
  rationale: 未完成时呈现持续进行的言说。“讲论”在语体上庄重自然，又不把内容过度限定为正式讲道。
- source_word: ταῖς συνελθούσαις γυναιξίν
  choice: 向聚集在那里的妇女
  rationale: 分词指已经聚集起来的妇女；“在那里”根据紧接的地点语境补出，使中文自然顺畅。
theological_decisions:
- issue: προσευχή在本处的含义
  choice: 正文译作“祷告的地方”
  alternative: 译作“祷告”或进一步解释为“会堂”
  rationale: 本节叙述河边一处有人聚集的地点，而προσευχή在希腊化时期的犹太语境中可指祷告场所。译作“祷告的地方”最符合上下文，但不将其制度化地解释为原文没有明说的“会堂”；脚注保留“祷告”这一词义可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式按叙事顺序自然展开；“讲论”保留未完成时所表达的持续言说，同时避免把一般交谈或教导过度解释为正式讲道。
