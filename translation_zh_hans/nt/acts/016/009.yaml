base_translation:
  language: en
  yaml_path: translation/nt/acts/016/009.yaml
  text: 'And a vision appeared to Paul in the night: a certain Macedonian man was standing and urging him[a], saying[c][b], “Come over into Macedonia and help us.”'
translation:
  language: zh_hans
  text: 夜间，有异象向保罗显现：一名马其顿人站在那里，恳求保罗，说：“请过来，到马其顿帮助我们。”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 希腊原文直译：“跨到马其顿来，帮助我们。”这里的分词与命令语气连用，中文译作“请过来”以表达其惯用含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅραμα
  choice: 异象
  rationale: 在《使徒行传》的叙事语境中，指具有启示性质的所见经历；“异象”是现代中文圣经语体中自然且准确的对应词，又不把它限定为梦境或客观显形。
- source_word: διὰ νυκτός
  choice: 夜间
  rationale: 该短语表示异象发生的时间。“夜间”简洁自然，保留夜里的场景，不额外断定这是睡梦。
- source_word: τῷ Παύλῳ ὤφθη
  choice: 向保罗显现
  rationale: ὁράω的被动式与与格连用，在这里宜按惯用义译为“向……显现”，比生硬的“被保罗看见”更符合原文事件的呈现方式。
- source_word: ἀνὴρ Μακεδών τις
  choice: 一名马其顿男子
  rationale: ἀνήρ明确指成年男性，Μακεδών标明其马其顿身份，τις在此提供不定指；“一名”已经自然表达这种不定性，无须使用可能暗示身份已知的“某个”。
- source_word: ἑστώς
  choice: 站在那里
  rationale: 保留分词所描绘的持续站立姿态，并用“在那里”使中文场景叙述自然，不增加具体地点。
- source_word: παρακαλῶν
  choice: 恳求
  rationale: 语境是迫切请求援助；“恳求”体现呼吁的 earnest force，同时不像“哀求”那样额外强化悲苦情绪。
- source_word: λέγων
  choice: 说
  rationale: 作为引出直接引语的分词，现代中文自然译作“说”。
- source_word: Διαβάς
  choice: 请过来
  rationale: 该不定过去时分词与命令语气“帮助”连用，表达先跨越而来、继而施助的请求；“请过来”在中文中自然传达跨到他们所在一边的意思。
- source_word: εἰς Μακεδονίαν
  choice: 到马其顿
  rationale: 自然表达εἰς所指向的进入目的地；中文无需机械译作“进入马其顿”。
- source_word: βοήθησον ἡμῖν
  choice: 帮助我们
  rationale: 直接、清楚地保留第二人称单数命令与第一人称复数受益者。
theological_decisions:
- issue: ὅραμα与ὤφθη所描述之经历的性质
  choice: 译作“有异象向保罗显现”，确认经文所说的启示性经历，但不界定其具体发生机制。
  alternative: 梦、内心感动、客观显形
  rationale: 原文明确称之为ὅραμα，并说它向保罗显现；译文既不应将其弱化为一般印象，也不应超出经文断定它必是梦境或某种客观物质显现。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“异象”保留启示性质；“一名马其顿男子”准确表达性别、地域身份和不定指；直接引语用“请”自然体现恳求语气。所有脚注标记均置于正文相应词句之后。
