source:
  edition: SBLGNT
  text: ἀναγαγών τε αὐτοὺς εἰς τὸν ⸀οἶκον παρέθηκεν τράπεζαν καὶ ⸀ἠγαλλιάσατο πανοικεὶ πεπιστευκὼς τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/034.yaml
  text: And after bringing them up into the house[a], he set a meal before them and rejoiced greatly with his whole household[b], having believed in God.
translation:
  language: zh_hans
  text: 他把他们带上去，领进屋里，就摆上饭食给他们吃[a]。他既信了神，就和全家人一同满心欢喜[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“给他们摆上桌席”，这是指预备饭食款待他们。
    reason: lexical_alternative
  - marker: b
    text: 原文也可着重表示全家人都参与这欢喜；有些人认为，这句话暗示全家人也一同信了神。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀναγαγών
  choice: 把他们带上去
  rationale: 该不定过去时分词在此表示空间上的向上移动，并先于主要动作发生；中文用“把他们带上去”自然保留这一动作。
- source_word: εἰς τὸν οἶκον
  choice: 进了屋里
  rationale: 定冠词所指由上下文确定，即禁卒的住处；“屋里”不额外明说所有关系，同时符合现代汉语表达。
- source_word: παρέθηκεν τράπεζαν
  choice: 摆上饭食给他们吃
  rationale: 原文直译近于“摆上桌席”，是供应食物、款待客人的惯用表达；此译清楚传达实际含义，也保留款待场景。
- source_word: ἠγαλλιάσατο
  choice: 满心欢喜
  rationale: 该动词表示强烈、洋溢的喜乐；“满心欢喜”自然、庄重，并体现其强度。
- source_word: πανοικεὶ
  choice: 和全家人一同
  rationale: 该副词表示“连同全家”或“全家一起”，在句中最直接修饰欢喜这一动作。
- source_word: πεπιστευκὼς τῷ θεῷ
  choice: 既信了神
  rationale: 完成时分词指向已经发生并具有持续结果的信；“既……就……”保留与主句的紧密关系，却不把它限定为纯粹时间或纯粹因果。
theological_decisions:
- issue: 全家人与欢喜及相信之间的范围关系
  choice: 正文明确禁卒和全家人一同欢喜，而用单数主语表达禁卒已经信神。
  alternative: 也可理解为全家人都参与了相信，因而全家一同欢喜；或理解为禁卒因全家相信而欢喜。
  rationale: πανοικεὶ直接可修饰单数动词“欢喜”，而单数阳性分词πεπιστευκώς在语法上最直接指禁卒。正文不把“相信”明确扩展至全家，但脚注保留原文可能引发的范围理解。
translation_notes:
  register: 采用现代、自然而庄重的简体中文。“就摆上饭食给他们吃”体现叙事次序和款待含义；“既信了神”较贴近分词结构，又避免武断地只作因果解释。正文与所有脚注标记相互对应。
