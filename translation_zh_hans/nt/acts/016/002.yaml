  text: He was well spoken of by the brothers in Lystra and Iconium[a].
translation:
  language: zh_hans
  text: 他受到路司得和以哥念的弟兄们的称赞[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“弟兄姐妹”，指那两处地方的信徒。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: 他
  rationale: 关系代词回指上一节的提摩太；汉语在独立成节时用“他”更自然。
- source_word: ἐμαρτυρεῖτο
  choice: 都称赞他
  rationale: 此处被动形式表示提摩太从当地信徒那里得到良好评价；汉语主动表达更自然，并保留“受到好评”的含义。
- source_word: ὑπὸ
  choice: 由施事者转为主语表达
  rationale: ὑπό加属格标明被动句的施事者；译文将“弟兄们”改作主动句主语。
- source_word: τῶν ἐν Λύστροις καὶ Ἰκονίῳ
  choice: 路司得和以哥念的
  rationale: 介词短语限定“弟兄们”，指身处这两座城的信徒群体。
- source_word: ἀδελφῶν
  choice: 弟兄们
  rationale: 保留希腊文阳性复数的亲属称谓及初期教会群体用语；脚注说明它在这里可能兼指男女信徒。
theological_decisions:
- issue: 如何表达指基督徒群体的 ἀδελφῶν
  choice: 弟兄们
  alternative: 弟兄姐妹／信徒
  rationale: 正文保留原文阳性复数形式，不把其性别表达直接中性化；同时用脚注交代该词在教会语境中可广指当地同信的人。
translation_notes:
  register: 采用现代、简洁而庄重的普通话。“称赞他”自然传达有利见证和良好声誉；“弟兄们”保留原文教会亲属称谓，并以脚注说明可能的包容性所指。
