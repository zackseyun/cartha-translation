source:
  edition: SBLGNT
  text: ὁ δὲ Παῦλος ἔφη πρὸς αὐτούς· Δείραντες ἡμᾶς δημοσίᾳ ἀκατακρίτους, ἀνθρώπους Ῥωμαίους ὑπάρχοντας, ἔβαλαν εἰς φυλακήν· καὶ νῦν λάθρᾳ ἡμᾶς ἐκβάλλουσιν; οὐ γάρ, ἀλλὰ ἐλθόντες αὐτοὶ ⸀ἡμᾶς ἐξαγαγέτωσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/037.yaml
  text: But Paul said to them[a], “After beating us publicly without trial, though we are Roman citizens, they threw us into prison; and now are they sending us out secretly? No indeed! Rather[c][b], let them come themselves and lead us out.”
translation:
  language: zh_hans
  text: 保罗却对他们说：“他们没有定我们的罪[a]，就当众打了我们；我们是罗马公民[b]，他们竟把我们关进监牢。现在又想偷偷地把我们赶出去吗？绝对不行！叫他们亲自来领我们出去[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“没有判我们有罪”；也可按语境译作“未经审判”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“是罗马人的人”；这里指拥有罗马公民身份及其法律保障。
    reason: cultural_note
  - marker: c
    text: 或译：“带我们出去”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Δείραντες
  choice: 打了
  rationale: 该动词泛指殴打；上下文已说明官方施打，不必在本节中过度具体化为“鞭打”。
- source_word: δημοσίᾳ
  choice: 当众
  rationale: 直接表达公开施罚的含义，符合现代汉语叙事。
- source_word: ἀκατακρίτους
  choice: 没有定我们的罪
  rationale: 准确保留“未经司法定罪”的核心意义，避免把词义收窄为必然“未经审判”。
- source_word: ἀνθρώπους Ῥωμαίους ὑπάρχοντας
  choice: 我们是罗马公民
  rationale: 在此法律语境中指具有罗马公民身份及相应保障的人；汉语无需机械保留“人”。
- source_word: ἔβαλαν εἰς φυλακήν
  choice: 把我们关进监牢
  rationale: 自然表达投入监禁的动作；“竟”由语境承载保罗控诉的强烈语气。
- source_word: λάθρᾳ
  choice: 偷偷地
  rationale: 体现暗中、避人耳目的含义，口吻自然且与公开受罚形成对照。
- source_word: ἐκβάλλουσιν
  choice: 把我们赶出去
  rationale: 保留ἐκβάλλω所带的驱赶意味，也适合反问语气。
- source_word: οὐ γάρ
  choice: 绝对不行
  rationale: 表达强烈而断然的拒绝。
- source_word: ἐλθόντες αὐτοὶ
  choice: 叫他们亲自来
  rationale: 保留αὐτοὶ对官长本人到场的强调。
- source_word: ἡμᾶς ἐξαγαγέτωσαν
  choice: 领我们出去
  rationale: 贴近“带领出去”的基本义；并以脚注保留“带我们出去”的可能表达。
theological_decisions:
- issue: 保罗援引罗马身份的法律含义
  choice: 译作“罗马公民”
  alternative: 罗马人
  rationale: 此处重点是两人所享有的罗马公民法律保障；“罗马公民”能自然、准确地传达这层法律身份。
- issue: ἀκατακρίτους所指的司法状态
  choice: 没有定我们的罪
  alternative: 未经审判；没有被判罪
  rationale: 原词明确表示未被定罪，但未单独说明是否完全没有任何审理程序；正文保留这一范围，避免把程序细节说得过满。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。用“却”“竟”“绝对不行”呈现保罗鲜明的抗议语气；正文按希腊文论证次序先说未经定罪和公开受打，再点明罗马公民身份。所有脚注标记均置于相应正文处。
