  text: καὶ ἐλάλησαν αὐτῷ τὸν λόγον τοῦ ⸀κυρίου ⸀σὺν πᾶσι τοῖς ἐν τῇ οἰκίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/032.yaml
  text: And they spoke the word of the Lord to him[c][b][a], together with all who were in his house.
translation:
  language: zh_hans
  text: 他们把主的道讲给他和他家里所有的人听。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “主的道”也可理解为“来自主的信息”或“关于主的信息”。
    reason: alternative_reading
  - marker: b
    text: “他家里所有的人”也可译作“他的全家人”；原文既可着眼于家中在场的人，也可能涵盖他的家属和家中成员。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλάλησαν
  choice: 讲给……听
  rationale: λαλέω在这里指向人传讲福音信息；“讲给……听”既自然，又清楚表达与格受众，比“宣告”少一层公开宣讲的意味。
- source_word: αὐτῷ
  choice: 给他……听
  rationale: 与格单数代词指狱卒；配合“讲给……听”，自然表达说话的对象。
- source_word: τὸν λόγον
  choice: 道
  rationale: λόγος在此指所传讲的信息。“道”是现代中文圣经语境中常见而庄重的对应，能保留新约惯用表达；“信息”虽更直白，却会削弱原文措辞的连贯性。
- source_word: τοῦ κυρίου
  choice: 主的
  rationale: 保留希腊文属格表达，不限定为“来自主”或“关于主”，从而保留其真实语义空间。
- source_word: σὺν πᾶσι τοῖς ἐν τῇ οἰκίᾳ αὐτοῦ
  choice: 和他家里所有的人
  rationale: σύν表示“与……一同”；在本句中，这些人也在听道。中文将他们与“他”并列为受众，既清楚自然，又保留共同在场、共同领受信息的意义。
- source_word: οἰκίᾳ
  choice: 家里
  rationale: οἰκία可指房屋或家庭。“他家里所有的人”保留地点性的具体表达，同时在中文中自然指当时在家中的众人；“全家人”则可能过早限定为家庭成员。
theological_decisions:
- issue: “主的道”的属格含义
  choice: 译作“主的道”，不明确限定道是来自主、属于主，还是关于主。
  alternative: 来自主的信息；关于主的信息
  rationale: λόγον τοῦ κυρίου的属格可包含来源、归属或内容等关联。正文保留较开放的表达，避免把原文的神学张力收窄为单一解释。
- issue: 家中众人是否同为受话者
  choice: 将“他”和“他家里所有的人”并列为听道者。
  alternative: 译作“他们对他讲主的道，他家里所有的人也都在场”。
  rationale: 虽然σύν在形式上是“与……一同”，上下文和句义表明家中众人不仅在场，也是信息的听众；中文并列处理能自然清楚地传达这一点，而不把他们降为旁观者。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“讲给……听”避免生硬的“向……讲说”；“主的道”保留新约术语及属格歧义。“他家里所有的人”比“全家人”更贴近原文的地点性表达。
