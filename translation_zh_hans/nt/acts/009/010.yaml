id: ACT.9.10
reference: Acts 9:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ἦν δέ τις μαθητὴς ἐν Δαμασκῷ ὀνόματι Ἁνανίας, καὶ εἶπεν πρὸς αὐτὸν ⸂ἐν ὁράματι ὁ κύριος⸃· Ἁνανία. ὁ δὲ εἶπεν· Ἰδοὺ ἐγώ, κύριε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/010.yaml
  text: There was a disciple in Damascus named Ananias, and the Lord said to him in a vision, “Ananias.” And he said, “Here I am, Lord.”
translation:
  language: zh_hans
  text: 在大马士革有一个门徒，名叫亚拿尼亚。主在异象中对他说：“亚拿尼亚！”他回答：“主啊，我在这里。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἦν δέ
  choice: 有
  rationale: 未完成时配合δέ引入新场景和人物；中文叙事用“有”即可自然承接上下文，不另加带明显时间意义的“当时”或“现在”。
- source_word: τις μαθητὴς
  choice: 一个门徒
  rationale: τις在此为不定指，用“一个”自然引入此前未出现的人物；不译作较生硬且可能增添强调的“某一个”。
- source_word: ἐν Δαμασκῷ
  choice: 在大马士革
  rationale: 按地点义直译，并采用现代中文通行地名。
- source_word: ὀνόματι Ἁνανίας
  choice: 名叫亚拿尼亚
  rationale: ὀνόματι用于说明姓名；“名叫”简洁自然。Ἁνανίας采用中文圣经传统中通行的音译“亚拿尼亚”。
- source_word: εἶπεν πρὸς αὐτόν
  choice: 对他说
  rationale: 准确表达λέγω与πρός加宾格的直接言说结构。
- source_word: ἐν ὁράματι
  choice: 在异象中
  rationale: 表示主向亚拿尼亚说话时所处的启示性情境；“在异象中”既贴近原文，也符合自然中文。
- source_word: ὁ κύριος
  choice: 主
  rationale: 定冠词所指的κύριος在本段语境中是向亚拿尼亚显现并说话的复活之主；中文专称“主”通常不需另译冠词。
- source_word: Ἁνανία
  choice: 亚拿尼亚
  rationale: 呼格姓名；用感叹号体现直接呼唤的语气，而不增加原文信息。
- source_word: Ἰδοὺ ἐγώ
  choice: 我在这里
  rationale: 这是回应呼唤、表示听候的惯用语；“我在这里”自然传达其功能，避免逐字译成不自然的“看哪，是我”。
- source_word: κύριε
  choice: 主啊
  rationale: 呼格κύριε在此回应异象中之主的呼唤；“主啊”保留直接称呼及基督论含义。
theological_decisions:
- issue: 异象中ὁ κύριος与κύριε的所指
  choice: 两处均译为“主”，指复活的耶稣
  alternative: 理解为较泛指的神圣称谓，或把κύριε译作“先生”
  rationale: 使徒行传第9章的连续语境表明，说话者是向亚拿尼亚显现并差遣他的主；译作“主”保留原文的基督论力度，同时不在正文中增补“耶稣”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。将希腊文由καί连接的内容分为三个中文句子，以避免连串“并且”造成生硬，同时保持事件顺序和语义关系。
