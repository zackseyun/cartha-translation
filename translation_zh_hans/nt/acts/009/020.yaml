id: ACT.9.20
reference: Acts 9:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ εὐθέως ἐν ταῖς συναγωγαῖς ἐκήρυσσεν τὸν ⸀Ἰησοῦν ὅτι οὗτός ἐστιν ὁ υἱὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/020.yaml
  text: And immediately in the synagogues he began proclaiming Jesus[b][a], that he is the Son of God.
translation:
  language: zh_hans
  text: 他随即在各会堂里宣讲耶稣，说：“这位就是上帝的儿子。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐθέως
  choice: 随即
  rationale: 自然而庄重地表达行动紧接前事发生，保留叙事中的迅速感。
- source_word: ἐν ταῖς συναγωγαῖς
  choice: 在各会堂里
  rationale: 保留地点意义和复数形式；“各会堂”在现代汉语中自然地表示不止一处会堂。
- source_word: ἐκήρυσσεν
  choice: 宣讲
  rationale: 表达公开传扬信息的含义，比单纯的“讲”明确，也避免把动作限定为现代教会讲道形式。希腊语未明确编码“开始”，故正文不增补。
- source_word: τὸν Ἰησοῦν
  choice: 耶稣
  rationale: 保留直接宾语结构，以紧凑方式表达耶稣既是宣讲的对象，也是宣讲内容的中心。
- source_word: ὅτι
  choice: 说
  rationale: 在汉语中自然引出所宣讲的具体内容；使用引号清楚呈现内容从句。
- source_word: οὗτός
  choice: 这位
  rationale: 保留指示代词的辨认和强调作用，同时比“这一个”自然、比单用“他”更贴近原文。
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: 上帝的儿子
  rationale: 直接保留属格关系和基督论称号，不作解释性扩展。
theological_decisions:
- issue: 扫罗宣讲中的基督论称号
  choice: 上帝的儿子
  alternative: 上帝之子
  rationale: “上帝的儿子”准确、清楚，并为普通现代读者所理解；不削弱或扩展原文明确的基督论宣告。
- issue: οὗτός的指示和强调作用
  choice: 这位就是
  alternative: 他是
  rationale: “这位就是”保留原文指示代词的辨认语气，并借“就是”自然呈现其强调力，而不加入原文没有的身份说明。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“随即”衔接紧凑；“宣讲”体现公开传扬；“这位就是”既自然又保留原文οὗτός的指示强调。
