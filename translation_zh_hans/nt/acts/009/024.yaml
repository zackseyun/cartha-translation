  text: ἐγνώσθη δὲ τῷ Σαύλῳ ἡ ἐπιβουλὴ αὐτῶν. ⸂παρετηροῦντο δὲ καὶ⸃ τὰς πύλας ἡμέρας τε καὶ νυκτὸς ὅπως αὐτὸν ἀνέλωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/024.yaml
  text: But their plot became known to Saul[a]. They were also watching the gates day and night so that they might kill him.
translation:
  language: zh_hans
  text: 但扫罗得知了他们的阴谋。他们还日夜监视城门[a]，要杀死他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文只说“门”；根据上下文，指城门。
    reason: 说明“城”由本段的城市语境补足，并非原文明确说出。
lexical_decisions:
- source_word: ἐγνώσθη
  choice: 知道了
  rationale: 该词为不定过去时被动形式，直译是“被扫罗知道了”。现代汉语用“扫罗知道了”更自然，仍表达阴谋进入他认知这一结果，不具体说明消息来源。
- source_word: ἐπιβουλή
  choice: 阴谋
  rationale: 指针对他人的敌对图谋；下文明确其目的在于杀害扫罗，因此“阴谋”准确而自然。
- source_word: παρετηροῦντο
  choice: 监视
  rationale: 未完成时表达持续进行的行动；“监视”比“把守”更直接保留密切观察、伺机行动的语义。
- source_word: πύλας
  choice: 各城门
  rationale: 原文为复数“门”；结合大马士革的城市语境，所指是城门。汉语译作“各城门”自然地体现复数，脚注说明“城”来自上下文。
- source_word: ἡμέρας τε καὶ νυκτός
  choice: 日夜
  rationale: 简洁、自然地表达昼夜持续监视。
- source_word: ὅπως
  choice: 要
  rationale: 在此引出监视城门的目的；“要”在现代汉语中清楚表达目的关系。
- source_word: ἀνέλωσιν
  choice: 杀死
  rationale: ἀναιρέω在本语境中明确指夺取性命；“杀死”直接、准确，不弱化其意。
- source_word: δὲ
  choice: 但
  rationale: 标示叙事中的轻微转折：有人谋害扫罗，但这阴谋被他知道了。
- source_word: καὶ
  choice: 还
  rationale: 表示进一步的行动：他们不但策划阴谋，还持续监视城门。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“日夜监视”保留持续 surveillance 的意味；避免使用较古雅的“谋害之计”“昼夜守候”等表达。
