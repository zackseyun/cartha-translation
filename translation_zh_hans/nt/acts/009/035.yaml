id: ACT.9.35
reference: Acts 9:35
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ εἶδαν αὐτὸν πάντες οἱ κατοικοῦντες Λύδδα καὶ τὸν ⸀Σαρῶνα, οἵτινες ἐπέστρεψαν ἐπὶ τὸν κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/035.yaml
  text: And all those living in Lydda and Sharon saw him[b][a], and they turned to the Lord.
translation:
  language: zh_hans
  text: 住在吕大和沙仑[a]的人都看见了他，就归向了主[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “沙仑”也可译作“沙仑平原”。
    reason: lexical_alternative
  - marker: b
    text: “归向了主”也可译作“转向了主”；原词在这里含有悔改、信靠而转向主的意思，但不一定表示他们先前曾属于主。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδαν
  choice: 看见了
  rationale: 此处为ὁράω的简单过去时，最自然地表示当地居民看见了得医治后的以尼雅；“看见了”直接保留视觉感知之意。
- source_word: πάντες οἱ κατοικοῦντες
  choice: 住在……的人都
  rationale: 带冠词的分词作名词用，指所有居住在那里的人；此表达符合现代汉语语序，也保留“所有”的范围。
- source_word: Λύδδα
  choice: 吕大
  rationale: 采用该地名在中文圣经传统中通行且易于辨认的译名。
- source_word: τὸν Σαρῶνα
  choice: 沙仑
  rationale: 指沙仑地区或平原；正文用通行地名“沙仑”，不机械表达希腊语冠词，其他可能译法收入脚注。
- source_word: οἵτινες
  choice: 就
  rationale: 该关系代词承接前述众人并引出其响应；汉语以“就”自然表达看见之后随即发生的叙事结果，同时避免生硬重复“他们”。
- source_word: ἐπέστρεψαν ἐπὶ τὸν κύριον
  choice: 归向了主
  rationale: ἐπιστρέφω搭配ἐπί和宾格，在《使徒行传》中常表示人在悔改与信心中转向主。“归向”保留这一圣经性意象，又不强行断定他们先前曾离弃主。
- source_word: κύριον
  choice: 主
  rationale: 按新约中κύριος作为称号的通常译法处理；上下文很可能指复活的耶稣，但正文不增添原文没有的名字。
theological_decisions:
- issue: “主”的所指
  choice: 正文只译作“主”
  alternative: 主耶稣
  rationale: 《使徒行传》第9章的上下文强烈指向耶稣，但希腊原文只有τὸν κύριον；因此保留原文称号及其语境所指，不在正文增词。
- issue: ἐπέστρεψαν的力度与方向
  choice: 归向了
  alternative: 转向了；回转归向了；信了
  rationale: “归向”既表达向主转回、悔改和信靠的方向，又不把词义收窄为某一套神学术语，也不明确预设这些人从前已经属于主。
- issue: “都”的范围
  choice: 保留πάντες，译为“人都”
  alternative: 当地居民看见他，便归向了主
  rationale: 原文明确使用πάντες，正文应保留其全称表述，不因现代读者可能将其理解为修辞性概括而擅自弱化。
translation_notes:
  register: 采用自然、庄重而简明的现代标准汉语。“吕大”“沙仑”沿用中文圣经读者熟悉的地名形式；以“归向”保留原文的方向性和神学张力。所有脚注标记均置于正文相关词语之后。
