  timestamp: '2026-07-14T03:29:36Z'
review_pass:
  verdict: revise
  source_fidelity: “病倒”可能指突然昏倒或倒下，较原文ἀσθενήσασαν（患病、生病）更具体；“洗净”也带有原文未明确的“彻底洗净”意味。改为“患了病，后来死了”和“洗过身后”，保留患病在先、死亡在后的叙事次序，并准确表达死后洗身的语境。
  naturalness: 原译整体通顺庄重，但“她病倒死了”在现代汉语中略显生硬，且容易理解为“因突然倒下而死亡”。“她患了病，后来死了”更自然清楚；“有人给她洗过身后”也符合叙事中对死者身体处理的汉语表达。
  terminology: “安放在楼上的一间房里”准确、自然，未把无冠词的ὑπερῴῳ误作某个特定的“上楼”。脚注可简洁说明“上层房间”的词义，不必加入“著名房间”的解释性否定。
  issues:
  - severity: medium
    issue: “病倒死了”把患病表述得过于具体，且汉语搭配略生硬。
    rationale: ἀσθενέω在此表示患病，并不特别表示昏倒或倒下；原文随后才陈述死亡。
  - severity: low
    issue: “洗净后”可能附加“洗得干净、彻底”的含义。
    rationale: λούσαντες仅说明已经洗过她（在此语境即洗身），并未强调洗净的结果。
  revised_text: 那些日子，她患了病，后来死了。有人给她洗过身后，把她安放在楼上的一间房里[a]。
