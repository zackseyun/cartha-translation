revisions:
- from: 那些日子，她病倒死了。人们给她洗净后，把她安放在楼上的一间房里[a]。
  to: 那些日子，她患了病，后来死了。有人给她洗过身后，把她安放在楼上的一间房里[a]。
  rationale: 修订仅调整“患病”和“洗过”的表达，使其更贴近希腊文的语义范围和动作次序，并改善现代汉语的自然度。保留“安放”及“楼上的一间房里”，因为这两处准确传达死后放置与上层房间的含义；脚注标记仍紧随所说明的词组。
