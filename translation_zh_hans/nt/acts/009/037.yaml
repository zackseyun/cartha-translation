  text: ἐγένετο δὲ ἐν ταῖς ἡμέραις ἐκείναις ἀσθενήσασαν αὐτὴν ἀποθανεῖν· λούσαντες δὲ ⸂ἔθηκαν αὐτὴν⸃ ἐν ὑπερῴῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/037.yaml
  text: In those days it happened that she became sick and died. After washing her[a], they laid her in an upstairs room.
translation:
  language: zh_hans
  text: 那些日子，她患了病，后来死了。有人给她洗过身后，把她安放在楼上的一间房里[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文可指楼上或上层的一间房。
    reason: 说明ὑπερῴῳ的空间含义，并保留其泛指性质。
lexical_decisions:
- source_word: ἐγένετο
  choice: （以自然叙事句式表达，不另译）
  rationale: 此处是引出事件的叙事结构；汉语直接说“那些日子，她……”更自然，无须硬译成“事情发生了”。
- source_word: δὲ
  choice: （不单独译出）
  rationale: 这是轻微的叙事衔接词；本节在现代汉语中无需添加“如今”或“但是”，上下文即可体现承接。
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: 那些日子
  rationale: 贴近原文的时间表达，也符合自然、庄重的现代汉语。
- source_word: ἀσθενήσασαν
  choice: 病倒
  rationale: 这里表示她患病，并与随后的死亡构成事件次序；“病倒”简洁自然。
- source_word: ἀποθανεῖν
  choice: 死了
  rationale: 忠实保留原文直白的死亡陈述，不以较委婉的“去世”弱化措辞。
- source_word: λούσαντες
  choice: 给她洗净后
  rationale: 不定过去时分词表示这一动作先于“安放”；上下文清楚表明这是她死后所做的处理，但译文不额外加入原文没有的“遗体”一词。
- source_word: ἔθηκαν αὐτὴν
  choice: 把她安放
  rationale: τίθημι表示放置；在丧葬语境中，“安放”比一般性的“放”更自然庄重，同时没有加入埋葬之意。
- source_word: ἐν ὑπερῴῳ
  choice: 在楼上的一间房里
  rationale: ὑπερῷον指楼上或上层的房间；此译法清楚表达空间位置，也避免让读者误以为是某个特指的著名“楼房”。
theological_decisions:
- issue: ὑπερῴῳ是否应采用传统上可能带有特指意味的译法
  choice: 楼上的一间房里
  alternative: 楼房里／那间楼房里
  rationale: 该词在此不承载特殊神学含义，原文也没有冠词；采用泛指的空间描述，避免无根据地指向某个特定房间。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“病倒死了”保留原文简洁的事件次序；“安放”适合死后处理的语境，但不暗示已经下葬。脚注标记置于其所解释的“楼上的一间房里”之后。
