source:
  edition: SBLGNT
  text: ἀναστὰς δὲ Πέτρος συνῆλθεν αὐτοῖς· ὃν παραγενόμενον ἀνήγαγον εἰς τὸ ὑπερῷον, καὶ παρέστησαν αὐτῷ πᾶσαι αἱ χῆραι κλαίουσαι καὶ ἐπιδεικνύμεναι χιτῶνας καὶ ἱμάτια ὅσα ἐποίει μετ’ αὐτῶν οὖσα ἡ Δορκάς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/039.yaml
  text: So Peter got up and went with them[a]. When he arrived, they took him up to the upper room, and all the widows stood beside him[c][b], weeping and showing the tunics and garments that Dorcas made while she was with them.
translation:
  language: zh_hans
  text: 彼得就起身，和他们一同去了。他到了以后，他们领他上到楼上的房间。所有寡妇都站在他身旁[a]，一边哭，一边把多加[b]还和她们在一起时所做的里衣和外衣[c]给他看。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“站在他面前”。希腊语可作较正式的理解；这里的情景也可能是寡妇们在哀痛中聚集到彼得身边。
    reason: lexical_alternative
  - marker: b
    text: 多加是希腊名字；在使徒行传9:36，她也叫大比大。
    reason: cross_reference
  - marker: c
    text: “里衣和外衣”对应两个不同的希腊语衣物名称，通常分别指内层衣物和外层衣物。
    reason: cultural_note
lexical_decisions:
- source_word: ἀναστὰς
  choice: 起身
  rationale: 在此引出彼得回应请求而采取的行动；“起身”自然、简洁，也保留了动作含义。
- source_word: συνῆλθεν αὐτοῖς
  choice: 和他们一同去了
  rationale: 按上下文表示彼得与使者同行；此译既体现“一同”，又符合现代汉语表达。
- source_word: παραγενόμενον
  choice: 到了以后
  rationale: 该分词在这里表达相对于主句动作的时间关系。
- source_word: ἀνήγαγον
  choice: 领他上楼
  rationale: 动词含向上带领之意；结合楼上房间的场景，译为“领他上楼”清楚自然。
- source_word: ὑπερῷον
  choice: 楼上的房间
  rationale: 指楼上或房屋上层的房间；避免使用现代建筑意义较强的特定房型名称。
- source_word: παρέστησαν αὐτῷ
  choice: 都站在他身旁
  rationale: 保留站立并靠近彼得的场景；希腊语也可理解为“站在他面前”，故加注说明。
- source_word: πᾶσαι αἱ χῆραι
  choice: 所有寡妇
  rationale: 准确表达整个寡妇群体，措辞简明。
- source_word: κλαίουσαι
  choice: 一边哭
  rationale: 现在分词描绘她们持续哀哭的状态；与后一个分词并列译作“一边……一边……”。
- source_word: ἐπιδεικνύμεναι
  choice: 给他看
  rationale: 表示把衣物展示给彼得看；现代汉语自然明白。
- source_word: χιτῶνας καὶ ἱμάτια
  choice: 里衣和外衣
  rationale: 两个词通常分别指贴身或内层衣物与外层衣物；这样既保留区别，也比音译古代服装名称更易懂。
- source_word: ὅσα ἐποίει
  choice: 所做的
  rationale: ὅσα涵盖她所做的这些衣物，未完成时描写她生前持续进行的活动；汉语结合“还和她们在一起时”即可自然传达背景，不强行限定为习惯体。
- source_word: μετ’ αὐτῶν οὖσα
  choice: 还和她们在一起时
  rationale: 贴近原文“她与她们同在时”，同时在上下文中自然暗示多加尚在人世之时，不额外解释。
theological_decisions:
- issue: 多加的名字及其与大比大的关系
  choice: 正文保留希腊名“多加”，注释说明她也叫“大比大”
  alternative: 正文直接写“大比大”或并列两个名字
  rationale: 本节原文使用Δορκάς；保留该名字忠于本节措辞，并借交叉参照帮助读者确认人物身份。
- issue: 寡妇相对于彼得的站立位置
  choice: 站在他身旁
  alternative: 站在他面前
  rationale: παρίστημι在此可表示站在旁边，也可能较正式地表示站在面前；正文依哀悼场景采用自然表达，注释保留另一种可能。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“众人”承接未明说的复数主语，指陪同或接待彼得的人；“一边哭，一边……给他看”重现两个同时进行的分词动作。所有注释标记均置于其所解释的词句之后。
