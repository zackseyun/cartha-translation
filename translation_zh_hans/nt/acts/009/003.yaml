id: ACT.9.3
reference: Acts 9:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐν δὲ τῷ πορεύεσθαι ἐγένετο αὐτὸν ἐγγίζειν τῇ Δαμασκῷ, ⸂ἐξαίφνης τε αὐτὸν περιήστραψεν⸃ φῶς ⸀ἐκ τοῦ οὐρανοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/003.yaml
  text: As he was traveling[a], it happened that he was drawing near to Damascus, and suddenly a light from heaven flashed around him.
translation:
  language: zh_hans
  text: 他在路上行进，快到大马士革的时候，忽然有一道光从天上[a]闪耀在他四周。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“天空”。希腊语οὐρανός既可指“天上”，也可指“天空”；在这里，“天上”很可能表明这光的神圣来源。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν δὲ τῷ πορεύεσθαι
  choice: 他在路上行进
  rationale: ἐν加冠词化不定式表示与主句同时发生的动作；译为“在路上行进”自然表达“当他前行时”。δέ仅作轻微的叙事衔接，中文无需生硬地另加连接词。
- source_word: ἐγένετο αὐτὸν ἐγγίζειν τῇ Δαμασκῷ
  choice: 快到大马士革的时候
  rationale: ἐγένετο在这里兼具路加常用的叙事推进功能；中文若直译“事情发生了，他正在接近”会显得累赘，因此以时间结构自然承载。现在时不定式ἐγγίζειν所表达的接近过程用“快到”体现，并不表示已经进城。
- source_word: ἐξαίφνης τε
  choice: 忽然
  rationale: ἐξαίφνης表示突发性；τε是轻微连接，中文语序已足以表达承接关系。
- source_word: περιήστραψεν
  choice: 闪耀在他四周
  rationale: 该复合动词表示光照或闪射在某人周围；“闪耀在他四周”兼顾事件的突然性和环绕效果。
- source_word: φῶς
  choice: 一道光
  rationale: 量词“道”符合现代汉语对突然出现之光的自然表达，不额外规定其物质形态。
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: 从天上
  rationale: οὐρανός可指天、天空或天界；在此启示性场景中，“天上”既自然，也保留光来自神圣领域的可能含义。
theological_decisions:
- issue: 启示性场景中οὐρανός的含义
  choice: 从天上
  alternative: 从天空
  rationale: 上下文表明这是一次超自然相遇，“天上”较能保留其神圣来源的意味；脚注同时说明该词也可按可见天空理解，以免把词义歧义完全消除。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“快到……的时候”避免直译ἐγένετο所造成的欧化句式；脚注标记置于其实际说明的“天上”之后。
