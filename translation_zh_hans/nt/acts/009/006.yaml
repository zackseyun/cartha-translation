  text: ἀλλὰ ἀνάστηθι καὶ εἴσελθε εἰς τὴν πόλιν, καὶ λαληθήσεταί σοι ⸂ὅ τί⸃ σε δεῖ ποιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/006.yaml
  text: But get up and enter the city[a], and you will be told what you must do.
translation:
  language: zh_hans
  text: 不过，你起来，进城去[a]；你会被告知你必须做什么。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“将会向你说你必须做什么。”原文为未指明施事者的将来被动式；“必须”译自表示必要性的词。
    reason: 说明原文被动式未指明说话者，并保留δεῖ的必要性语气。
lexical_decisions:
- source_word: ἀλλὰ
  choice: 可是
  rationale: 表示转折，从扫罗的问题转到主对他的命令；“可是”在现代汉语中简洁自然。
- source_word: ἀνάστηθι
  choice: 你起来
  rationale: 该词为命令式；结合扫罗倒在地上的语境，“起来”准确而自然。
- source_word: εἴσελθε εἰς τὴν πόλιν
  choice: 进城去
  rationale: 合并表达动词和方向介词，既保留“进入城里”的意义，也符合现代汉语命令句习惯。
- source_word: λαληθήσεταί σοι
  choice: 必有人告诉你
  rationale: 希腊文为将来时被动结构，未说明说话者是谁；汉语用无定主语“有人”自然表达这种未指明的施事者，“必”体现将来陈述的确定性。
- source_word: ὅ τί
  choice: 什么
  rationale: 引出所要告知的内容，汉语用“什么”简明自然。
- source_word: σε δεῖ ποιεῖν
  choice: 你该做什么
  rationale: “该”表达必要性和义务，同时保持自然；其必要性的来源不在译文中另作限定。
theological_decisions:
- issue: δεῖ在神圣指引语境中的力度
  choice: 该
  alternative: 必须
  rationale: “该”保留应当和必要之意，又避免在汉语中产生比上下文更强的强制语气；译文不进一步断定这种必要性的具体性质或来源。
- issue: λαληθήσεταί的未明施事者
  choice: 必有人告诉你
  alternative: 你必会被告知
  rationale: 保留原文没有指明谁来告诉扫罗这一点；不把施事者直接解释为神、耶稣或某个特定的人。
translation_notes:
  register: 采用现代、庄重而口语自然的普通话。“你起来，进城去”保持连续命令的明快节奏；正文以自然汉语表达，脚注补充原文被动结构和必要性措辞。
