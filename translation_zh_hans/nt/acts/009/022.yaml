  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Σαῦλος δὲ μᾶλλον ἐνεδυναμοῦτο καὶ ⸀συνέχυννεν ⸀τοὺς Ἰουδαίους τοὺς κατοικοῦντας ἐν Δαμασκῷ, συμβιβάζων ὅτι οὗτός ἐστιν ὁ χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/022.yaml
  text: But Saul kept gaining strength all the more and was confounding the Jews living in Damascus[a], proving that this one is the Messiah.
translation:
  language: zh_hans
  text: 可是，扫罗越发刚强，使住在大马士革的犹太人困惑不解，论证耶稣就是弥赛亚[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“基督”。希腊文Χριστός在这里是称号，意为“受膏者”。
    reason: 说明称号的另一种传统译法，并保留其犹太弥赛亚语境。
lexical_decisions:
- source_word: μᾶλλον ἐνεδυναμοῦτο
  choice: 越发刚强有力
  rationale: μᾶλλον表达程度不断增强，未完成时ἐνεδυναμοῦτο描写持续的发展过程；此译自然保留“越来越强”的动态，并不明确断定力量来自自身还是外在赐予。
- source_word: συνέχυννεν
  choice: 使……无言以对
  rationale: 该动词有使人困惑、陷入混乱之意；在辩论语境中，此译表达扫罗的论证令对方无法作答的结果，同时避免生硬地译成“使混乱”。
- source_word: τοὺς Ἰουδαίους τοὺς κατοικοῦντας ἐν Δαμασκῷ
  choice: 住在大马士革的犹太人
  rationale: 准确限定此处所指的是大马士革当地的犹太人，避免把叙述泛化为所有犹太人。
- source_word: συμβιβάζων
  choice: 论证
  rationale: 该分词在此表示把证据或论点结合起来，从而得出结论；“论证”既体现方法，也保留其逻辑与证据性质。
- source_word: οὗτός ἐστιν
  choice: 耶稣就是
  rationale: 希腊文直译为“这一位就是”；中文若单译“这一位”会因本节缺少显式先行词而显得含混。依据紧接上文9:20所指的耶稣，明示“耶稣”使指代自然清楚，而“就是”保留指认和强调作用。
- source_word: ὁ χριστός
  choice: 弥赛亚
  rationale: 此处Χριστός带冠词并作为身份称号，指所应许的受膏者；“弥赛亚”能保留犹太语境中的称号意义。
theological_decisions:
- issue: Χριστός作为称号的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 这里的ὁ χριστός是身份断言，不是姓名式用法；译作“弥赛亚”更清楚地呈现扫罗正在证明耶稣就是所应许的受膏者，同时以脚注保留传统译名。
- issue: 扫罗变得刚强有力的施事来源
  choice: 不明确说明力量来源
  alternative: 他不断得到力量
  rationale: ἐνεδυναμοῦτο可作中间或被动理解，原文没有在本句明说是扫罗自身增强还是蒙神加力；“越发刚强有力”保留这一语法与神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“可是”承接前文并体现δέ的转折推进；“无言以对”符合现代汉语辩论语境，但不把经文扩写成正式辩论场景。脚注标记已置于“弥赛亚”之后。
