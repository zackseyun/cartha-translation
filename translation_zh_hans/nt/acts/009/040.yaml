id: ACT.9.40
reference: Acts 9:40
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐκβαλὼν δὲ ἔξω πάντας ὁ Πέτρος ⸀καὶ θεὶς τὰ γόνατα προσηύξατο, καὶ ἐπιστρέψας πρὸς τὸ σῶμα εἶπεν· Ταβιθά, ἀνάστηθι. ἡ δὲ ἤνοιξεν τοὺς ὀφθαλμοὺς αὐτῆς, καὶ ἰδοῦσα τὸν Πέτρον ἀνεκάθισεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/040.yaml
  text: But Peter put them all outside[a], knelt down and prayed, and turning toward the body said, “Tabitha, arise.” Then she opened her eyes, and when she saw Peter, she sat up.
translation:
  language: zh_hans
  text: 彼得叫众人都出去，便跪下祷告。随后，他转向遗体，说：“大比大，起来吧！[a]”她就睁开眼睛；一看见彼得，便坐了起来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“起身吧”。希腊语这个命令在本处可译作“起来”或“起身”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκβαλὼν δὲ ἔξω πάντας
  choice: 彼得叫众人都出去
  rationale: 表达彼得将现场所有人请出房间这一具体行动；“叫……出去”自然清楚，也避免用“赶出去”过度强调强制意味。
- source_word: θεὶς τὰ γόνατα
  choice: 跪下
  rationale: 这是表示屈膝跪地的惯用表达；现代汉语以“跪下”最为自然。
- source_word: προσηύξατο
  choice: 祷告
  rationale: 直接对应 προσεύχομαι 的常用含义，无须增添原文未明说的对象或内容。
- source_word: ἐπιστρέψας πρὸς τὸ σῶμα
  choice: 转向遗体
  rationale: 保留彼得身体转向的动作；在本段死亡语境中，“遗体”比“身体”更自然，同时没有使用语气更强的“尸体”。
- source_word: Ταβιθά
  choice: 大比大
  rationale: 采用该亚兰人名在现代中文圣经传统中通行且易辨认的音译。
- source_word: ἀνάστηθι
  choice: 起来吧
  rationale: 既可表示起身，也在本语境中承载恢复生命的含义；“起来吧”是庄重而自然的现代汉语，并保留原词在此处的语义张力。
- source_word: ἤνοιξεν τοὺς ὀφθαλμοὺς αὐτῆς
  choice: 她就睁开眼睛
  rationale: 准确传达她张开双眼的动作，并以“就”自然推进叙事。
- source_word: ἰδοῦσα τὸν Πέτρον
  choice: 一看见彼得
  rationale: 将分词自然转换为时间性表达，清楚呈现看见彼得之后坐起的顺序。
- source_word: ἀνεκάθισεν
  choice: 便坐了起来
  rationale: 该词指从躺卧姿势坐起；“坐了起来”是准确自然的中文表达。
- source_word: δὲ / καί
  choice: 便／随后／就／便
  rationale: 按上下文用现代汉语的叙事连接词呈现事件发展，不把 δέ 误解为强烈转折。
theological_decisions:
- issue: 恢复生命语境中命令语 ἀνάστηθι 的译法
  choice: 起来吧
  alternative: 起身吧；站起来
  rationale: 原词可指起身、站起，也能在此神迹语境中与恢复生命相呼应。“起来吧”既不把动作局限为站立，也不在原文之外直接加入“复活”等神学说明。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。短句与顺序连接词保留叙事节奏；将脚注标记置于其实际所说明的“起来吧”之后。
