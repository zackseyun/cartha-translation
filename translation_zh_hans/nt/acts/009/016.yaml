  text: ἐγὼ γὰρ ὑποδείξω αὐτῷ ὅσα δεῖ αὐτὸν ὑπὲρ τοῦ ὀνόματός μου παθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/016.yaml
  text: For I will show him how much he must suffer for my name[a].
translation:
  language: zh_hans
  text: 因为我要让他知道，他必须为我的名[a]受多少苦。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为了我的名”或“因我的名”。
    reason: 保留ὑπέρ在此处所表达的缘故或目的的语义色彩。
lexical_decisions:
- source_word: ἐγὼ
  choice: 我
  rationale: 保留显式第一人称代词；与将来时动词相配，体现原文中主语的强调。
- source_word: γὰρ
  choice: 因为
  rationale: 说明前一句话的理由；现代汉语中“因为”比“原来”更直接自然。
- source_word: ὑποδείξω
  choice: 要让……知道
  rationale: ὑποδείκνυμι可指展示、指明或使人知道；此处译法符合现代汉语表达，也保留耶稣将向扫罗显明此事的含义。
- source_word: αὐτῷ
  choice: 他
  rationale: 按汉语语序作为“让……知道”结构中的对象。
- source_word: ὅσα
  choice: 多少
  rationale: 在δεῖ与不定式的结构中表示受苦的程度或分量；“多少”自然且不把它限定为一份具体事项清单。
- source_word: δεῖ
  choice: 必须
  rationale: 准确表达必要性，同时不进一步断定这种必要性的具体性质。
- source_word: ὑπὲρ
  choice: 为
  rationale: 此处可表达为了、因着或代表；正文用含义宽广而简洁的“为”，其细微差异以脚注保留。
- source_word: τοῦ ὀνόματός μου
  choice: 我的名
  rationale: 直译“我的名”，保留“名”所包含的本人、权柄及公开认信等丰富含义。
- source_word: παθεῖν
  choice: 受……苦
  rationale: πάσχω在此表示遭受苦难；“受苦”是准确、自然且庄重的现代汉语。
theological_decisions:
- issue: δεῖ所表达的必要性
  choice: 必须
  alternative: 注定要；被指定要
  rationale: 原文表明必要性，却没有在本句中明确界定这是逻辑、护理还是预定层面的必要；“必须”保留这种神学张力，不额外加入更强的决定论含义。
- issue: ὑπὲρ τοῦ ὀνόματός μου与受苦原因或目的的关系
  choice: 为我的名
  alternative: 为了我的名；因我的名；代表我的名
  rationale: ὑπέρ可包含缘故、目的或代表的意味；正文不将其压缩为单一解释，脚注列出主要可能表达。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“受多少苦”保持原文ὅσα的程度表达；脚注标记置于完整句之后。
