  text: καὶ πεσὼν ἐπὶ τὴν γῆν ἤκουσεν φωνὴν λέγουσαν αὐτῷ Σαοὺλ Σαούλ, τί με διώκεις;
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/004.yaml
  text: And falling to the ground, he heard a voice saying to him, “Saul, Saul, why are you persecuting me?”
translation:
  language: zh_hans
  text: 他倒在地上，听见有声音对他说：“扫罗！扫罗！你为什么迫害我？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεσὼν ἐπὶ τὴν γῆν
  choice: 倒在地上
  rationale: 不定过去时分词结合表示趋向的介词短语，描写他倒向地面；“倒在地上”既准确表达动作结果，也符合现代汉语叙事习惯。
- source_word: ἤκουσεν φωνὴν
  choice: 听见有声音
  rationale: φωνή在随后的直接引语语境中指可辨识的话音，而非一般声响；“听见有声音”自然保留了希腊文未在本节明说说话者身份的表达。
- source_word: λέγουσαν αὐτῷ
  choice: 对他说
  rationale: 以自然汉语表达分词λέγουσαν及与格αὐτῷ的关系，引出后面的直接引语。
- source_word: Σαοὺλ Σαούλ
  choice: 扫罗！扫罗！
  rationale: 按通行中文圣经人名译法音译，并保留重复呼唤所传达的强调和迫切感；用感叹号呈现呼语语气。
- source_word: τί
  choice: 为什么
  rationale: τί在此与动词连用，具有询问原因的副词性功能，现代汉语自然译作“为什么”。
- source_word: με
  choice: 我
  rationale: 直接保留第一人称宾格的指向，不扩写为“我的子民”或“我的门徒”，以保存原文的神学张力。
- source_word: διώκεις
  choice: 迫害
  rationale: 现在时在语境中指扫罗正在持续进行的敌对行动；汉语动词本身无需另加进行标记。“迫害”比宽泛的“追赶”更符合《使徒行传》中的语境。
theological_decisions:
- issue: 说话者与扫罗所攻击之人的认同
  choice: 保留“迫害我”的直接说法，不作解释性扩写。
  alternative: 译作“迫害我的门徒”或“迫害我的子民”。
  rationale: 原文以με直接说“我”，使说话者亲自认同受迫害的群体；译文应保存这一神学力度与张力，而不在正文中替作者解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“他倒在地上”顺应汉语动作次序；直接引语保留重复呼名和质问的力度。本节无须脚注。
