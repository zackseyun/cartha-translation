  text: λαβόντες δὲ ⸂οἱ μαθηταὶ αὐτοῦ⸃ νυκτὸς ⸂διὰ τοῦ τείχους καθῆκαν αὐτὸν⸃ χαλάσαντες ἐν σπυρίδι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/025.yaml
  text: But his disciples took him by night and lowered him through the wall in a large basket[a][b].
translation:
  language: zh_hans
  text: 但他的门徒趁夜带着他，把他放在一个大筐里，经由城墙把他缒了下去[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“穿过城墙”。希腊文直译为“穿过城墙”；这很可能是指城墙上的洞口或窗户。
    reason: lexical_alternative
  - marker: b
    text: 希腊文连续用了两个表示“放下”的词，形成生动的重复，着重描写他们帮助他逃走的方式。
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβόντες
  choice: 带着
  rationale: 这里表示门徒将扫罗带在身边并着手帮助他逃走；“带着”符合现代汉语叙事，也不过度强调抓握动作。
- source_word: δὲ
  choice: 但
  rationale: δέ在这里承接前文谋害扫罗的情节，并引出门徒采取的相反行动；译作“但”能自然体现这一轻微转折。
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: 他的门徒
  rationale: 明确保留αὐτοῦ的所属关系，并以“门徒”对应μαθηταί。
- source_word: νυκτός
  choice: 趁夜
  rationale: 这是表示时间的属格；“趁夜”既表达在夜间行动，也自然暗示逃脱行动借夜色进行。
- source_word: διὰ τοῦ τείχους
  choice: 从城墙的开口
  rationale: διά加属格表示经由或穿过；按实际场景译作“从城墙的开口”使现代读者易于理解，同时用脚注说明原文只直说“穿过城墙”。
- source_word: καθῆκαν αὐτόν
  choice: 把他……缒了下去
  rationale: καθίημι在这里指从高处放下。“缒下去”准确而简洁地表达借绳索等将人从高处垂放下去。
- source_word: χαλάσαντες
  choice: 放在一个大筐里
  rationale: 该分词与καθῆκαν语义重叠，并以ἐν σπυρίδι说明放下的方式。正文采用自然汉语整合其含义，脚注保留希腊文双重下降表达的修辞信息。
- source_word: ἐν σπυρίδι
  choice: 放在一个大筐里
  rationale: σπυρίς指筐，通常是较大的筐；加“大”既反映词义，也符合容纳一个人的实际场景。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“缒了下去”略带书面色彩，但能准确传达从高处用绳索垂放的动作；“大筐”比“篮子”更符合σπυρίς的尺寸和载人场景。
