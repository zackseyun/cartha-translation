  text: ἐξίσταντο δὲ πάντες οἱ ἀκούοντες καὶ ἔλεγον· Οὐχ οὗτός ἐστιν ὁ πορθήσας ⸀ἐν Ἰερουσαλὴμ τοὺς ἐπικαλουμένους τὸ ὄνομα τοῦτο, καὶ ὧδε εἰς τοῦτο ἐληλύθει ἵνα δεδεμένους αὐτοὺς ἀγάγῃ ἐπὶ τοὺς ἀρχιερεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/021.yaml
  text: And all who heard him were amazed and were saying[a], “Isn’t this the man who devastated in Jerusalem those who call on this name? And had he not come here for this purpose[b], that he might bring them bound to the chief priests?”
translation:
  language: zh_hans
  text: 凡听见扫罗的人都惊讶不已，说：“这不就是那个曾在耶路撒冷大肆摧残呼求这名[a]的人的人吗？他到这里来，不也正是为了把他们捆绑起来，押到祭司长们那里吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “呼求这名”也可译作“求告这名”。这是圣经中的惯用表达，指向对耶稣之名的呼求，也含有承认并倚靠他名的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξίσταντο
  choice: 都惊讶不已
  rationale: 表达未完成时所呈现的持续惊讶状态；“惊讶不已”自然、清楚，也保留了该动词较强的语气。
- source_word: πάντες οἱ ἀκούοντες
  choice: 凡听见扫罗的人
  rationale: 分词实词化，指所有听见扫罗讲话的人；按上文补出“扫罗”，使现代汉语指代清楚。
- source_word: πορθήσας
  choice: 大肆摧残
  rationale: 该动词带有猛烈破坏、蹂躏之意，强于一般的“逼迫”；“大肆摧残”既保留力度，又不暗示这些人已全被杀害。
- source_word: τοὺς ἐπικαλουμένους τὸ ὄνομα τοῦτο
  choice: 呼求这名之人
  rationale: 保留“呼求某名”这一圣经惯用表达，可涵盖向耶稣呼求以及公开承认、倚靠其名的意味。
- source_word: εἰς τοῦτο
  choice: 正是为了
  rationale: 自然表达目的，并以“正是”体现原文所指的特定目的。
- source_word: ἐληλύθει
  choice: 他到这里来
  rationale: 汉语通常不以形态标示过去完成；上下文已表明他此前来到这里，因此这样译自然且不损失时序。
- source_word: δεδεμένους
  choice: 把他们捆绑起来
  rationale: 保留完成时被动分词所表达的被捆绑状态，而不具体限定为锁链。
- source_word: ἀγάγῃ ἐπὶ τοὺς ἀρχιερεῖς
  choice: 押到祭司长们那里
  rationale: “押到”符合把被捆绑者带往掌权者处的语境；“那里”保留向祭司长们而去的方向，不额外断定正式审判程序。
- source_word: ἀρχιερεῖς
  choice: 祭司长们
  rationale: 此复数指第二圣殿时期的祭司长阶层或祭司首领，并非同时有多位在任大祭司。
theological_decisions:
- issue: 是否把“这名”明说为“耶稣的名”
  choice: 正文保留“这名”
  alternative: 耶稣的名
  rationale: 原文以指示语保留所指对象，语境已清楚指向耶稣；不在正文中补明，可保存原文的修辞和敬虔含义。
- issue: 如何表达扫罗从前行为的严重程度
  choice: 大肆摧残
  alternative: 逼迫；毁灭
  rationale: πορθέω比普通的“逼迫”强烈，但“毁灭”在汉语中容易被理解为彻底消灭；“大肆摧残”较准确地保留两者之间的力度。
- issue: 第二个并列分句是否仍作反问
  choice: 译作“他到这里来，不也正是为了……吗？”
  alternative: 译作陈述句“他到这里来，正是为了……”
  rationale: 该分句与前面的否定反问相连，整体最自然地理解为听众惊讶时提出的连续反问；这样译也保留原文的修辞张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“大肆摧残”保留原文强烈语气；“呼求这名”有意保存圣经惯用语，并以脚注帮助普通读者理解。
