base_translation:
  language: en
  yaml_path: translation/nt/acts/009/005.yaml
  text: And he said[a], “Who are you, Lord?” And he said, “I am Jesus, whom you are persecuting.”
translation:
  language: zh_hans
  text: 他说[a]：“主啊，你是谁？”那一位说：“我就是你所逼迫的耶稣。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “主”也可译作“先生”。希腊语κύριε可以是表示尊敬的称呼；在这里，说话者的身份尚未向扫罗显明。
    reason: 保留原文称呼在礼貌尊称与“主”之间的真实语义空间。
lexical_decisions:
- source_word: εἶπεν δέ
  choice: 他说
  rationale: 按现代汉语叙事习惯译出隐含主语；δέ在此是轻微的叙事衔接，汉语无需机械译作“于是”或“但”。
- source_word: Τίς εἶ
  choice: 你是谁
  rationale: 直接、自然地保留疑问句的人称指向。
- source_word: κύριε
  choice: 主啊
  rationale: κύριε既可作尊称，也可指“主”；正文采用新约语境中庄重而常见的“主啊”，同时以脚注保留“先生”的可能。
- source_word: ὁ δέ
  choice: 那位说
  rationale: 希腊文冠词ὁ在此实质上代指先前发声者；译作“那位”既补足现代汉语所需的指称，又不提前把发言者直接标明为耶稣。
- source_word: Ἐγώ εἰμι Ἰησοῦς
  choice: 我就是……耶稣
  rationale: 以“就是”自然表达带显明主语的自我认定，突出回答“你是谁”，但不额外赋予该短语独立的神学含义。
- source_word: ὃν σὺ διώκεις
  choice: 你所逼迫的
  rationale: “所”字结构清楚保留关系从句；“逼迫”准确表达διώκω在此持续敌对、迫害的含义，显式的σὺ由“你”体现。
theological_decisions:
- issue: 扫罗尚未知道说话者身份时，κύριε应如何译出
  choice: 主啊
  alternative: 先生
  rationale: 该称呼本身允许尊称和宗教性称呼两种理解。正文“主啊”符合启示场景及κύριος的一贯译法，但脚注保留“先生”，避免把扫罗此刻的认识程度说得过满。
- issue: 耶稣把对其门徒的逼迫说成对自己的逼迫
  choice: 我就是你所逼迫的耶稣
  alternative: 我就是耶稣，你所逼迫的那一位
  rationale: 紧贴关系从句ὃν σὺ διώκεις，不弱化耶稣与受逼迫者之间由经文本身建立的认同，也不另加解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“主啊”保留呼格语气；“那位说”避免连续使用含混的“他说”，也不抢先揭示身份。
