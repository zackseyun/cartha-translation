  text: γνωστὸν δὲ ἐγένετο καθ’ ὅλης ⸀τῆς Ἰόππης, καὶ ⸂ἐπίστευσαν πολλοὶ⸃ ἐπὶ τὸν κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/042.yaml
  text: And it became known throughout all Joppa, and many believed in the Lord.
translation:
  language: zh_hans
  text: 这事传遍了整个约帕，许多人信了主。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνωστὸν ... ἐγένετο
  choice: 这事传遍了
  rationale: 原文为非人称表达，意为“这事为人所知”。结合 καθ’ ὅλης τῆς Ἰόππης，译作“这事传遍了”自然表达消息广为人知的结果，又不指定传播者。
- source_word: δὲ
  choice: （不单独译出）
  rationale: δέ在此是轻微的叙事连接词。汉语承接上下文时无需机械译作“而且”或“于是”；用整句顺接更自然。
- source_word: καθ’ ὅλης τῆς Ἰόππης
  choice: 整个约帕
  rationale: κατά加属格表示遍及某一区域，ὅλης强调全境；“传遍了整个约帕”兼顾分布范围和现代汉语习惯。
- source_word: Ἰόππης
  choice: 约帕
  rationale: 采用中文圣经传统且通行的新约地名译法“约帕”。
- source_word: ἐπίστευσαν πολλοὶ
  choice: 许多人就信了
  rationale: πιστεύω的不定过去时在叙事中指向相信这一事件；“就信了”自然呈现由前述事件带来的结果，同时不额外规定信心的方式。
- source_word: ἐπὶ τὸν κύριον
  choice: 信了主
  rationale: πιστεύω加ἐπί及宾格表示以某人为信靠对象。现代汉语“信了主”自然传达归信和信靠之意；“信靠主”虽更显明信赖含义，但会比原文动词增加表达成分。
- source_word: κύριον
  choice: 主
  rationale: “主”保留κύριος在《使徒行传》中的尊称及基督论分量，不弱化为“主人”。
theological_decisions:
- issue: πιστεύω + ἐπί τὸν κύριον的表达
  choice: 信了主
  alternative: 信靠主；相信主
  rationale: “信了主”是自然、简洁的现代中文基督教叙事用语，表达以主为信仰和信靠对象，同时不把经文本身未展开的教义内容加入译文。
- issue: κύριος的称谓
  choice: 主
  alternative: 主人
  rationale: “主”准确保留该称谓在本段对耶稣的尊称和神学意义；“主人”在现代汉语中容易产生雇佣或所有权语境，分量不足。
- issue: 因果或结果关系的呈现
  choice: 用“就”连接“许多人信了主”
  alternative: 仅用“并且”；用“因此”
  rationale: 原文καί本身只是连接，但叙事次序自然暗示前述消息传开后许多人相信。“就”轻度呈现这一语篇推进，不像“因此”那样把严格因果关系说得过满。
translation_notes:
  register: 采用现代、简洁而庄重的叙事体。“传遍了整个约帕”比直译“在整个约帕为人所知”更符合普通读者的汉语表达；“信了主”保留传统神学措辞，同时清楚易懂。
