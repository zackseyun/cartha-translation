id: ACT.9.26
reference: Acts 9:26
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Παραγενόμενος δὲ ⸀εἰς Ἰερουσαλὴμ ⸀ἐπείραζεν κολλᾶσθαι τοῖς μαθηταῖς· καὶ πάντες ἐφοβοῦντο αὐτόν, μὴ πιστεύοντες ὅτι ἐστὶν μαθητής.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/026.yaml
  text: And when he came to Jerusalem[a], he was trying to join the disciples, but they were all afraid of him, not believing that he was a disciple.
translation:
  language: zh_hans
  text: 他到了耶路撒冷，试图与门徒来往[a]；可是大家都害怕他，不相信他是门徒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“设法与门徒联结在一起。”
    reason: 说明 κολλᾶσθαι 的较直译含义，即贴近、联结或依附；正文的“来往”在此指寻求获门徒群体接纳，并不表示正式入会。
lexical_decisions:
- source_word: Παραγενόμενος
  choice: 他到了
  rationale: 不定过去时分词交代主句行动之前的情境；“到了”自然表达抵达及先后关系。
- source_word: δὲ
  choice: 就
  rationale: 此处是较弱的叙事连接词；结合汉语句式用“就”承接抵达后的行动，不强化为明显转折。
- source_word: εἰς Ἰερουσαλήμ
  choice: 耶路撒冷
  rationale: εἰς 表示朝向并抵达城市；汉语“到了耶路撒冷”已自然包含方向意义。
- source_word: ἐπείραζεν
  choice: 设法
  rationale: 未完成过去时表示当时正在尝试的行动；“设法”既表达努力尝试，也避免误解为“试探”。
- source_word: κολλᾶσθαι
  choice: 加入……中间
  rationale: 该词有联结、贴近、归入某群体的含义；此处指他寻求被门徒群体接纳，而非正式的组织入会。
- source_word: τοῖς μαθηταῖς
  choice: 门徒
  rationale: 指耶路撒冷当地已知的门徒群体；“门徒”是使徒行传中 μαθητής 准确且通行的译法。
- source_word: καὶ πάντες ἐφοβοῦντο αὐτόν
  choice: 可是大家都怕他
  rationale: καί 在语境中引出与他尝试加入相反的反应；“可是”自然显出这一对比，未完成过去时则由语境表达持续状态。
- source_word: μὴ πιστεύοντες
  choice: 不相信
  rationale: 现在时分词说明众人害怕他的原因；汉语并列分句简洁保留这一因果联系。
- source_word: ὅτι ἐστὶν μαθητής
  choice: 他是门徒
  rationale: 希腊文用现在时 ἐστίν；汉语无需时态回移，“是门徒”既自然又贴近原文。
theological_decisions:
- issue: 扫罗试图与耶路撒冷信徒建立何种关系
  choice: 译作“加入门徒中间”
  alternative: “与门徒们联结在一起”或“和门徒们来往”
  rationale: 原文描述扫罗寻求归入并亲近门徒群体，没有明确指向正式会籍、礼仪或教会制度；正文保留群体接纳的含义，同时避免加入后世制度概念。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“设法”体现持续尝试，“门徒”沿用使徒行传的核心称谓。分号呈现扫罗的行动与众人的反应之间的明显对照；脚注标记紧随其所解释的短语。
