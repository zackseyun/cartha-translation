  text: Ἐγένετο δὲ Πέτρον διερχόμενον διὰ πάντων κατελθεῖν καὶ πρὸς τοὺς ἁγίους τοὺς κατοικοῦντας Λύδδα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/032.yaml
  text: As Peter was passing through all of them, he also went down to the saints living in Lydda.
translation:
  language: zh_hans
  text: 彼得巡行各处时，也下到吕大，到住在吕大的圣徒那里去。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “各处”原文直译为“所有的（……）”，所指内容省略；也可能理解为“众人”。
    reason: 保留διὰ πάντων因省略中心词而产生的真实歧义。
lexical_decisions:
- source_word: διὰ πάντων
  choice: 走遍各处
  rationale: 原文直译近于“经过所有的（……）”，所指名词省略；结合彼得巡行探访的语境，用“走遍各处”表达自然，同时以脚注保留原文所指可能存在的歧义。
- source_word: κατελθεῖν καὶ πρὸς
  choice: 也下到……去见
  rationale: 保留καί的“也”和κατελθεῖν的下行意象；πρός表示前往这些圣徒那里，译作“去见”符合现代汉语。
- source_word: τοὺς ἁγίους
  choice: 圣徒
  rationale: 这是使徒行传对信徒群体的称呼；“圣徒”准确保留其分别为圣的神学内涵。
- source_word: Λύδδα
  choice: 吕大
  rationale: 采用该地名在简体中文圣经传统中的通行译名。
theological_decisions:
- issue: “圣徒”的身份用语
  choice: 圣徒
  alternative: 信徒／属上帝的人
  rationale: 原文ἅγιοι具有“圣洁、分别出来的人”的明确宗教含义；保留传统且易懂的“圣徒”，不将其改释为某一特定教派的圣品身份。
- issue: διὰ πάντων中省略成分的指向
  choice: 正文译作“各处”，脚注说明也可能指“众人”
  alternative: 走遍他们众人中间
  rationale: 上下文较支持地域性的巡行，但原文πάντων本身没有明说“地方”，故不应完全掩盖另一种语法可能。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“彼得走遍各处的时候”顺畅呈现希腊文的背景分词结构；不机械译出Ἐγένετο δὲ的叙事套语，以免形成生硬的“事情发生了”。脚注标记已在正文中对应出现。
