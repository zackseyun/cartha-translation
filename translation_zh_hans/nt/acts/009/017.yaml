source:
  edition: SBLGNT
  text: ἀπῆλθεν δὲ Ἁνανίας καὶ εἰσῆλθεν εἰς τὴν οἰκίαν, καὶ ἐπιθεὶς ἐπ’ αὐτὸν τὰς χεῖρας εἶπεν· Σαοὺλ ἀδελφέ, ὁ κύριος ἀπέσταλκέν με, ⸀Ἰησοῦς ὁ ὀφθείς σοι ἐν τῇ ὁδῷ ᾗ ἤρχου, ὅπως ἀναβλέψῃς καὶ πλησθῇς πνεύματος ἁγίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/017.yaml
  text: So Ananias went and entered the house, and laying his hands on him he said, “Brother Saul, the Lord has sent me—Jesus, the one who appeared to you on the road by which you were coming—so that you may regain your sight and be filled with the Holy Spirit.”
translation:
  language: zh_hans
  text: 于是，亚拿尼亚就去，进了那所房子，把双手按在扫罗身上，说：“扫罗弟兄，在你来的路上向你显现的主，就是耶稣，差我来，叫你重见光明，并且被圣灵充满。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπῆλθεν δὲ
  choice: 于是……就去
  rationale: δέ在这里推进叙事，并承接前文主的吩咐；“于是……就”自然表达这一承接关系，不把ἀπέρχομαι过度译成强调离开的“离去”。
- source_word: εἰσῆλθεν εἰς τὴν οἰκίαν
  choice: 进了那所房子
  rationale: 忠实表达进入特指房屋的动作，也符合现代汉语叙事习惯。
- source_word: ἐπιθεὶς ἐπ’ αὐτὸν τὰς χεῖρας
  choice: 把手按在扫罗身上
  rationale: 保留按手这一明确的身体动作；将代词具体化为“扫罗”，可避免汉语中的指代含混。
- source_word: Σαοὺλ ἀδελφέ
  choice: 扫罗弟兄
  rationale: 自然保留呼格中的亲属式称呼及其接纳、团契意味，同时不进一步界定其具体性质。
- source_word: ὁ κύριος ἀπέσταλκέν με
  choice: 主……差我来
  rationale: “差我来”以自然汉语表达差遣及其当前目的；希腊语完成时的现实关联由语境和“来”体现。
- source_word: Ἰησοῦς ὁ ὀφθείς σοι
  choice: 向你显现的主，就是耶稣
  rationale: 将Ἰησοῦς理解为对“主”的同位说明，同时保留ὁ ὀφθείς σοι的识别作用；中文重排可清楚表达耶稣就是差遣者，而不抹去原文同位结构。
- source_word: ἐν τῇ ὁδῷ ᾗ ἤρχου
  choice: 在你来这里的路上
  rationale: ὁδός按字面译为“路”；ἤρχου为未完成时，表示当时正在前来的过程。“这里”是为汉语自然度补出的指向，不改变扫罗正前往大马士革的语境。
- source_word: ὅπως
  choice: 叫
  rationale: 在现代庄重汉语中自然引出差遣的目的，相当于“使得”。
- source_word: ἀναβλέψῃς
  choice: 重见光明
  rationale: 在失明与医治的语境中表示恢复视力；“重见光明”是自然、清楚的现代汉语表达，而非仅指“抬头看”。
- source_word: πλησθῇς πνεύματος ἁγίου
  choice: 被圣灵充满
  rationale: 保留被动语态以及“充满”的圣经性表达；“圣灵”明确指神的灵，汉语不需要冠词。
theological_decisions:
- issue: Ἰησοῦς与ὁ κύριος的句法关系
  choice: “向你显现的主，就是耶稣，差我来”
  alternative: “主差我来——就是在路上向你显现的耶稣——”
  rationale: 原文将“耶稣”置于“主差我来”之后，作为对“主”的同位识别。中文用“就是”明确同位关系，同时不增添原文以外的基督论说明。
- issue: 无冠词πνεύματος ἁγίου的译法
  choice: 圣灵
  alternative: 圣洁的灵
  rationale: 使徒行传的上下文指向神的圣灵；希腊语无冠词不要求不定意义，而汉语专名式称呼本来也不用冠词。
- issue: ἀδελφέ的关系含义
  choice: 扫罗弟兄
  alternative: 兄弟扫罗
  rationale: “扫罗弟兄”是现代汉语中自然且庄重的直接称呼，保留接纳与亲近意味，但不武断限定为族裔关系或正式教会身份。
translation_notes:
  register: 采用现代、庄重、易懂的叙事文体。句序按汉语习惯适度调整，以清楚呈现“耶稣”对“主”的同位说明；未设置脚注，因为主要词义与句法可在正文中自然且忠实地表达。
