revisions:
- from: 主对他说：“起来，到那条叫‘直街’的街上去，在犹大的家里找一个名叫扫罗的，他是大数人[a]，因为看哪，他正在祷告。”
  to: 主对他说：“起来，到那条名叫‘直街’的街道上去，在犹大的家里找一个名叫扫罗、来自大数的人[a]，因为你看，他正在祷告。”
  rationale: 修订仅改善现代汉语的句法与语篇衔接：将扫罗的姓名和籍贯合并为“人”的定语，并将“因为看哪”调整为“因为你看”。这保留了Σαῦλον ὀνόματι Ταρσέα、γάρ、ἰδού及现在时祷告动作的意义；脚注锚点移至“大数的人”之后，直接对应籍贯形容词。
