  text: ὁ δὲ κύριος πρὸς αὐτόν· ⸀Ἀναστὰς πορεύθητι ἐπὶ τὴν ῥύμην τὴν καλουμένην Εὐθεῖαν καὶ ζήτησον ἐν οἰκίᾳ Ἰούδα Σαῦλον ὀνόματι Ταρσέα, ἰδοὺ γὰρ προσεύχεται,
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/011.yaml
  text: And the Lord said to him[a], “Get up and go to the street called Straight, and in the house of Judas look for a man named Saul, from Tarsus, for behold, he is praying.”
translation:
  language: zh_hans
  text: 主对他说：“起来，到那条名叫‘直街’的街道上去，在犹大的家里找一个名叫扫罗、来自大数的人[a]，因为你看，他正在祷告。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“大数的扫罗。”希腊文形容词Ταρσέα表明扫罗来自大数。
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: 主
  rationale: 按新约常用称谓译为“主”；上下文指复活的耶稣，但本节希腊文只写“主”，因此不在正文中增补“耶稣”。
- source_word: Ἀναστὰς πορεύθητι
  choice: 起来，到……去
  rationale: 不定过去时分词与命令式连用，整体表达起身并前往的命令；“起来……去”自然且保留动作次序。
- source_word: ῥύμην τὴν καλουμένην Εὐθεῖαν
  choice: 那条叫‘直街’的街
  rationale: ῥύμη指城内街道；Εὐθεῖαν在此用作街名。译作“直街”既体现名称含义，又符合现代汉语地名表达。
- source_word: ἐν οἰκίᾳ Ἰούδα
  choice: 在犹大的家里
  rationale: 保留ἐν的处所含义；“家里”比“房屋中”更符合现代汉语，同时不改变所指地点。
- source_word: ζήτησον
  choice: 找
  rationale: 此处指寻找或询问某人；“找”简明自然，而“找到”会过度强调结果。
- source_word: Σαῦλον ὀνόματι Ταρσέα
  choice: 一个名叫扫罗的，他是大数人
  rationale: ὀνόματι标明名字，Ταρσέα是表示籍贯的形容词。“大数人”忠实表达其来自大数，并用分句保持汉语清晰。
- source_word: ἰδοὺ γὰρ
  choice: 因为看哪
  rationale: γάρ说明命令的理由，ἰδού引起注意；“因为看哪”同时保留两者的语篇功能和略显庄重的语气。
- source_word: προσεύχεται
  choice: 他正在祷告
  rationale: 现在时在此突出扫罗当时正在进行的行动，故用“正在祷告”。
theological_decisions:
- issue: κύριος所指对象
  choice: 正文只译“主”
  alternative: 主耶稣
  rationale: 上下文足以表明说话者，但本节本身只有κύριος；不显明补入“耶稣”，以保留原文措辞。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”略带经文语体，用来保留ἰδού的提示作用；街名加引号以便普通读者辨识。
