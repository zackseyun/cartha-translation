  naturalness: 原文“又向他求取给大马士革各会堂的信函，好让他若发现”在现代汉语中搭配生硬：“求取给……”的定语关系不清，“好让他若……”也不够顺畅。改用“求取写给……的书信，以便他若发现……”可保留目的和条件，且更自然庄重。
