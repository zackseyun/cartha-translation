  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ᾐτήσατο παρ’ αὐτοῦ ἐπιστολὰς εἰς Δαμασκὸν πρὸς τὰς συναγωγάς, ὅπως ἐάν τινας εὕρῃ τῆς ὁδοῦ ὄντας, ἄνδρας τε καὶ γυναῖκας, δεδεμένους ἀγάγῃ εἰς Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/002.yaml
  text: and asked him for letters to the synagogues in Damascus[a], so that if he found any belonging to the Way, both men and women, he might bring them bound to Jerusalem.
translation:
  language: zh_hans
  text: 又向他求取写给大马士革各会堂的书信，以便他若发现任何属于这道的人，无论男女，都把他们捆绑起来，带到耶路撒冷。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ᾐτήσατο παρ’ αὐτοῦ
  choice: 向他求取
  rationale: αἰτέω与παρά加属格表示向某人请求取得某物；“向他求取”既保留来源关系，也符合现代汉语表达。
- source_word: ἐπιστολὰς
  choice: 信函
  rationale: 按词义译为“信函”，不在正文中额外加入原文未明说的“授权书”等解释。
- source_word: εἰς Δαμασκὸν πρὸς τὰς συναγωγάς
  choice: 给大马士革各会堂
  rationale: 两个介词短语共同说明信函的目的地和收件对象；合并表达可避免生硬重复，同时保留各会堂为复数。
- source_word: ὅπως ἐάν
  choice: 好让他若
  rationale: “好让”表达目的，“若”保留ἐάν与虚拟式所表达的条件和不确定性。
- source_word: τινας τῆς ὁδοῦ ὄντας
  choice: 任何属于这道的人
  rationale: 条件句中的τινας译为“任何……的人”；以“属于这道”保留属格关系，并将“这道”作为早期基督徒群体的历史称谓。
- source_word: ἄνδρας τε καὶ γυναῖκας
  choice: 无论男女
  rationale: 明确涵盖男人和女人，保留原文强调扫罗拘捕范围之广的作用，同时表达自然简洁。
- source_word: δεδεμένους
  choice: 把他们捆绑起来
  rationale: 完成时被动分词描写他们处于被捆绑的状态；“捆绑起来”不擅自具体化为锁链。
- source_word: ἀγάγῃ εἰς Ἰερουσαλήμ
  choice: 带到耶路撒冷
  rationale: ἄγω在此指把被拘者带往指定地点；“带到”准确且符合现代汉语习惯。
theological_decisions:
- issue: τῆς ὁδοῦ作为早期基督徒群体的称谓
  choice: 这道
  alternative: 这道路；这道的追随者
  rationale: “这道”简洁保留历史称谓及其一定程度的含混性，没有把它直接解释成某一后来的宗派名称；脚注说明其用法。
- issue: ἄνδρας τε καὶ γυναῖκας明确提及两性
  choice: 无论男女
  alternative: 男人和女人
  rationale: 保留原文明确包括男女双方的意义，不笼统改译为“人们”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“信函”比“书信”稍显公文语境，却未额外断定其法律性质；“好让他若发现”同时保留目的与条件。经文承接上一节，因此以“又”起句，并保留代词“他”。
