lexical_decisions:
- source_word: λαβὼν τροφὴν
  choice: 吃过东西
  rationale: 该短语字面为“取了食物”，在此自然指进食；“吃过东西”既保留先后关系，也符合现代汉语表达。
- source_word: ἐνίσχυσεν
  choice: 恢复了体力
  rationale: 结合扫罗此前三日不吃不喝的语境，此动词表示他因进食而重新有了力量；这样译清楚自然，同时以脚注保留“得了力量”的形式可能。
- source_word: Ἐγένετο δὲ
  choice: 此后，他……一起住了
  rationale: 这里主要是叙事过渡，并非强调“事情发生”；“此后”自然承接前句，而“住了”按汉语习惯表达一段时间内与门徒同在。
- source_word: μετὰ τῶν ἐν Δαμασκῷ μαθητῶν
  choice: 和大马士革的门徒一起
  rationale: μετά加属格表示相伴；ἐν Δαμασκῷ修饰门徒，说明他们所在之处。
- source_word: ἡμέρας τινάς
  choice: 些日子
  rationale: 宾格短语表示持续时间，指未明确限定的一段日子；“些日子”避免把时长具体化为“几天”。
