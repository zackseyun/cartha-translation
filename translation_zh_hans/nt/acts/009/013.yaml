  text: ἀπεκρίθη δὲ Ἁνανίας· Κύριε, ⸀ἤκουσα ἀπὸ πολλῶν περὶ τοῦ ἀνδρὸς τούτου, ὅσα κακὰ ⸂τοῖς ἁγίοις σου ἐποίησεν⸃ ἐν Ἰερουσαλήμ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/013.yaml
  text: But Ananias answered[a], “Lord, I have heard from many about this man, how much evil he has done to your saints in Jerusalem.”
translation:
  language: zh_hans
  text: 但亚拿尼亚回答说：“主啊，我从许多人那里听说，这个人在耶路撒冷对你的圣徒做了多少恶事。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη δὲ
  choice: 但……回答说
  rationale: δέ在此轻微转折，承接亚拿尼亚迟疑的回应；“回答说”自然对应ἀποκρίνομαι。
- source_word: Κύριε
  choice: 主啊
  rationale: 这是亚拿尼亚在异象中直接称呼复活的耶稣；“主啊”既符合现代汉语呼语，也保留其尊称和神学分量。
- source_word: ἤκουσα ἀπὸ πολλῶν περὶ τοῦ ἀνδρὸς τούτου
  choice: 我听许多人说起这个人
  rationale: 将ἀπὸ πολλῶν自然表达为消息来自许多人，不补入“来源”等抽象概念；“这个人”保留指示语气。
- source_word: ὅσα κακὰ
  choice: 做了多少恶事
  rationale: ὅσα与复数κακά兼有数量、程度及道德评价；“多少恶事”在中文中自然，并保留其范围之广。
- source_word: τοῖς ἁγίοις σου
  choice: 你的圣徒
  rationale: “圣徒”是新约中ἅγιοι指信徒群体的通行译法，并保留“你的”所表达的归属关系。
- source_word: ἐποίησεν
  choice: 加害了……做了
  rationale: ποιέω本义宽泛，但与κακά及间接受词连用表示对某人行恶；正文用“加害……做恶事”清楚呈现希腊语关系。
- source_word: ἐν Ἰερουσαλήμ
  choice: 在耶路撒冷
  rationale: 直接保留地点意义。
theological_decisions:
- issue: Κύριε所指及称谓力度
  choice: 把它译作亚拿尼亚对耶稣的直接称呼“主啊”
  alternative: 仅作一般敬称“先生”或“主人”
  rationale: 紧接上下文，亚拿尼亚是在异象中回应复活的耶稣；“主”符合叙事语境，但不额外展开经文未明说的教义结论。
- issue: τοῖς ἁγίοις σου的群体称谓
  choice: 你的圣徒
  alternative: 你的圣民／你的圣洁之人
  rationale: “圣徒”保留ἅγιοι的宗教性和群体性，也避免泛化成不含“圣”语义的“你的子民”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“但”体现亚拿尼亚面对命令时的迟疑转折；保留“主”“圣徒”等新约核心称谓。脚注标记置于相关句末。
