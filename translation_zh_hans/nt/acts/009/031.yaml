source:
  edition: SBLGNT
  text: ⸂Ἡ μὲν οὖν ἐκκλησία καθ’ ὅλης τῆς Ἰουδαίας καὶ Γαλιλαίας καὶ Σαμαρείας εἶχεν εἰρήνην οἰκοδομουμένη, καὶ πορευομένη τῷ φόβῳ τοῦ κυρίου καὶ τῇ παρακλήσει τοῦ ἁγίου πνεύματος ἐπληθύνετο⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/031.yaml
  text: So then the church throughout all Judea and Galilee and Samaria had peace and was being built up[a]; and walking in the fear of the Lord and in the encouragement of the Holy Spirit[b], it was multiplying.
translation:
  language: zh_hans
  text: 这样，遍及犹太、加利利和撒玛利亚全境的教会享有平安，并不断被建立起来[a]；又在敬畏主和圣灵的鼓励[b]中行事，人数不断增多。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“众教会”。
    reason: textual_variant
  - marker: b
    text: “鼓励”也可译作“安慰”或“劝勉”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκκλησία
  choice: 教会
  rationale: SBLGNT正文采用单数，指分布于三个地区的教会整体；中文以单数“教会”保留这种集体意义。
- source_word: καθ’ ὅλης τῆς Ἰουδαίας καὶ Γαλιλαίας καὶ Σαμαρείας
  choice: 遍及犹太、加利利和撒玛利亚全境
  rationale: κατά加属格在此表示地域分布，“遍及”自然传达其含义，“全境”也体现ὅλης。
- source_word: εἶχεν εἰρήνην
  choice: 得享平安
  rationale: 准确表达教会处于平安安稳的状态，并避免将其窄化为单纯停止活动。
- source_word: οἰκοδομουμένη
  choice: 不断被建立起来
  rationale: 保留原文现在时被动分词所表达的持续过程及建造隐喻。
- source_word: πορευομένη
  choice: 而行
  rationale: 在“敬畏主而行”中自然表达处世、生活方式，同时保留行走隐喻。
- source_word: τῷ φόβῳ τοῦ κυρίου
  choice: 敬畏主
  rationale: “敬畏”兼具畏惧、尊崇和顺服的经文意涵，比单纯译作“尊敬”更能保留原文张力。
- source_word: τῇ παρακλήσει τοῦ ἁγίου πνεύματος
  choice: 在圣灵的鼓励下
  rationale: παράκλησις可指鼓励、安慰或劝勉；“鼓励”在教会被建立并增长的语境中自然，但其他义项收入脚注。
- source_word: ἐπληθύνετο
  choice: 人数不断增多
  rationale: 明确表达未完成时所呈现的持续数量增长；中文无需机械保留“繁殖”的字面形象。
theological_decisions:
- issue: ἐκκλησία的数与所指
  choice: 采用集体单数“教会”
  alternative: 异文作复数“众教会”
  rationale: 所给SBLGNT正文及相关分词、动词均为单数，呈现跨越各地区的一个教会整体；重要复数异文列入脚注。
- issue: “敬畏主”的含义
  choice: 保留“敬畏主”这一具有开放度的表达
  alternative: 明确解释为“怀着对主的崇敬”或“惧怕主”
  rationale: 原文φόβος既不能被弱化为一般尊敬，也不宜被限定为恐怖；直译保留敬虔、尊崇与畏惧的张力。
- issue: 圣灵之παράκλησις的含义
  choice: 正文译作“鼓励”
  alternative: “安慰”或“劝勉”
  rationale: 该词语义范围宽广；“鼓励”最适合本节平安、建立和增长的脉络，同时用脚注保存其他真实可能。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“这样”承接上文；第二分句重复“教会”，避免多个连续分词在中文中造成主语不清。“不断”分别体现建造与增长的持续性。
