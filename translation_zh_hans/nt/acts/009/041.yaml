  text: δοὺς δὲ αὐτῇ χεῖρα ἀνέστησεν αὐτήν, φωνήσας δὲ τοὺς ἁγίους καὶ τὰς χήρας παρέστησεν αὐτὴν ζῶσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/041.yaml
  text: And giving her his hand[a], he raised her up; then he called the saints and the widows and presented her alive.
translation:
  language: zh_hans
  text: 彼得向她伸出手[a]，扶她起来；随后叫来众圣徒和寡妇，把她活生生地呈现在他们面前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把手给她，使她起来。”这里的希腊语动词可指使人起来或站起；在本段语境中，也与复活的用语彼此呼应。
    reason: lexical_alternative
lexical_decisions:
- source_word: δοὺς ... χεῖρα
  choice: 伸手给她
  rationale: 直译为“把手给她”不合现代汉语习惯；“伸手给她”自然表达彼得将手递给她、帮助她起身，同时保留原文“给……手”的动作方向，避免误译成先“拉住她的手”。
- source_word: ἀνέστησεν
  choice: 扶她起来
  rationale: ἀνίστημι可指使人起来、使人站起，也能与复活语汇产生呼应。此处紧接“伸手给她”，首先描写彼得帮助她起身的具体动作；脚注保留“使她起来”的形式及其复活语境中的回响。
- source_word: φωνήσας
  choice: 随后叫来
  rationale: 表示彼得召来有关的人；用“随后”自然体现不定过去分词所表达的先行动作，即先叫来他们，再把她呈现在他们面前。
- source_word: τοὺς ἁγίους
  choice: 众圣徒
  rationale: 保留新约中对属神群体的常用称呼“圣徒”，不以解释性的“信徒”替代；“众”使复数在汉语中清楚自然。
- source_word: τὰς χήρας
  choice: 寡妇
  rationale: 直接表达原词，并保留她们与“众圣徒”分列的叙事安排，呼应上文中特别提到的寡妇群体。
- source_word: παρέστησεν
  choice: 呈现在他们面前
  rationale: παρίστημι在此表示将她带到众人面前、呈给他们看。“呈现在他们面前”比单说“给他们看”更完整，也避免“把她呈上”可能产生的物化或仪式色彩。
- source_word: ζῶσαν
  choice: 活生生地
  rationale: ζῶσαν作宾语补足成分，强调彼得呈给众人的是活着的她。“活生生地”在现代汉语中有力而自然地传达复生后的生命状态。
theological_decisions:
- issue: 复活语境中ἀνέστησεν的表达
  choice: 正文译作“扶她起来”，并以脚注保留“使她起来”及复活语汇的回响
  alternative: 使她起来／叫她起来
  rationale: 原文在本节直接描写彼得递手后使她起身，但该动词在更广的语境中也可承载“起来、复起”的复活色彩。正文不把这一动作直接扩大为彼得使她复活，因为她在前一节已经恢复生命；同时借脚注保存词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“众圣徒”保留新约群体称谓；“活生生地呈现在他们面前”增强汉语自然度，并准确表达ζῶσαν的宾语补足功能。
