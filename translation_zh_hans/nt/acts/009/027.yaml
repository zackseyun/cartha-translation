  to: 巴拿巴却拉住他，带他去见使徒，向他们讲述他如何在路上看见主，主又如何对他说话，并如何在大马士革奉耶稣的名放胆讲话。
  rationale: 修订不改变经文含义或神学指向，只改善“拉着”的动作对应及长句的汉语句法。保留“主”而不直接替换为“耶稣”，以维持原文称号；同时保留“奉耶稣的名”这一圣经习语。
