  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Βαρναβᾶς δὲ ἐπιλαβόμενος αὐτὸν ἤγαγεν πρὸς τοὺς ἀποστόλους, καὶ διηγήσατο αὐτοῖς πῶς ἐν τῇ ὁδῷ εἶδεν τὸν κύριον καὶ ὅτι ἐλάλησεν αὐτῷ καὶ πῶς ἐν Δαμασκῷ ἐπαρρησιάσατο ἐν τῷ ὀνόματι ⸀τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/027.yaml
  text: But Barnabas took hold of him and brought him to the apostles, and told them how on the road he had seen the Lord, and that he had spoken to him, and how in Damascus he had spoken boldly in the name of Jesus.
translation:
  language: zh_hans
  text: 巴拿巴却拉住他，带他去见使徒，向他们讲述他如何在路上看见主，主又如何对他说话，并如何在大马士革奉耶稣的名放胆讲话。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιλαβόμενος
  choice: 拉着他
  rationale: 保留“抓住、拉住”的具体动作，同时在本语境中自然表达巴拿巴主动接纳并带领扫罗，而非敌意地抓捕。
- source_word: ἤγαγεν πρὸς τοὺς ἀποστόλους
  choice: 带他去见使徒
  rationale: ἄγω可指领去或带到；“带他去见使徒”符合现代汉语表达，也体现巴拿巴将扫罗引见给使徒。
- source_word: διηγήσατο
  choice: 都向使徒述说了一遍
  rationale: 该动词有详细叙述、讲述之意；“述说了一遍”比单纯“告诉”更能体现复述事情经过。
- source_word: πῶς ἐν τῇ ὁδῷ
  choice: 怎样在路上
  rationale: 这里指前往大马士革途中的道路，并非把“道路”作为信仰群体的专称。
- source_word: εἶδεν τὸν κύριον
  choice: 看见了主
  rationale: 忠实表达简单过去事件；“主”保留κύριος在上下文中的基督论分量。
- source_word: ὅτι ἐλάλησεν αὐτῷ
  choice: 主怎样对他说了话
  rationale: 明确承接上文，以“主”为动词主语，避免汉语中代词连续出现造成指代含混；πῶς与ὅτι在此共同引出巴拿巴叙述的内容。
- source_word: ἐπαρρησιάσατο
  choice: 放胆讲话
  rationale: 表达自由、公开而勇敢地说话，不将其范围缩窄为专门的“讲道”。
- source_word: ἐν τῷ ὀνόματι τοῦ Ἰησοῦ
  choice: 奉耶稣的名
  rationale: 采用自然且庄重的汉语圣经惯用表达，保留凭耶稣的权柄并与他公开认同的含义。
- source_word: Ἰησοῦ
  choice: 耶稣
  rationale: 采用现代汉语中通行的人名译法。
theological_decisions:
- issue: 扫罗在路上所见“主”的所指
  choice: “主”指复活的耶稣
  alternative: 把“主”理解为较笼统的神圣称谓
  rationale: 《使徒行传》第9章的直接上下文将扫罗路上的相遇对象认定为耶稣，本节末尾“奉耶稣的名”也加强了这一联系；正文仍保留“主”这一称号。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“拉着他”保留原文动作感；后半句调整为汉语自然的信息次序，并用“都……述说了一遍”统摄三项叙述内容。
