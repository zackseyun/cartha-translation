id: ACT.9.7
reference: Acts 9:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οἱ δὲ ἄνδρες οἱ συνοδεύοντες αὐτῷ εἱστήκεισαν ἐνεοί, ἀκούοντες μὲν τῆς φωνῆς μηδένα δὲ θεωροῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/007.yaml
  text: The men traveling with him stood speechless[a], hearing the voice but seeing no one.
translation:
  language: zh_hans
  text: 与扫罗同行的人呆站在那里，说不出话来；他们听见了声音[a]，却看不见任何人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “声音”也可译作“声响”或“说话声”。希腊词既可指人的声音，也可泛指声响。另参22:9。
    reason: 保留φωνή的词义幅度，并提示本节与使徒行传22:9之间需要由读者观察的表面张力。
lexical_decisions:
- source_word: οἱ δὲ ἄνδρες
  choice: 人
  rationale: 结合后面的限定成分译为“与扫罗同行的人”，自然表达这群男子；δέ仅作轻微承接，不另加“但”或“这时”，以免夸大转折或加入原文没有的时间词。
- source_word: οἱ συνοδεύοντες αὐτῷ
  choice: 与扫罗同行
  rationale: συνοδεύω指陪同某人走一段路或一同旅行；“同行”简洁、自然，并保留旅途语境。代词在中文中明确为“扫罗”，避免连续代词造成指代含混。
- source_word: εἱστήκεισαν
  choice: 呆站在那里
  rationale: 该动词的过去完成时在此具有状态意义，描写他们站着的情形；“呆站”也与下文因震惊而说不出话的状态自然衔接，但没有增添他们已经倒地或停步等原文未明说的动作。
- source_word: ἐνεοί
  choice: 说不出话来
  rationale: ἐνεός表示不能说话或哑然无语，在此很可能是受震惊所致。“说不出话来”比单纯“沉默”更准确，也比“哑巴”更符合暂时状态。
- source_word: ἀκούοντες μὲν τῆς φωνῆς
  choice: 听见了声音
  rationale: φωνή可指人的嗓音、说话声，也可泛指声音或声响。中文“声音”自然保留这一语义幅度，不在正文中为协调使徒行传22:9而强行限定为“声响”或“话语”。
- source_word: μηδένα δὲ θεωροῦντες
  choice: 却看不见任何人
  rationale: θεωρέω在此指看见或察看；μηδένα明确表示没有看见任何一个人。“却”自然呈现μέν…δέ结构中听见与看不见之间的对照。
theological_decisions:
- issue: 使徒行传9:7与22:9对同行者所听见之事的表面张力
  choice: 正文译作“听见了声音”，保留φωνή既可指嗓音也可指一般声响的开放性
  alternative: 明确译作“听见了说话声”或“听见了声响”，以某一种意义解释两处经文的关系
  rationale: 原文没有明确说明同行者是否听懂所说的话。中文“声音”与希腊词一样具有一定语义宽度，既忠于本节，也不借翻译预先消解与22:9之间的张力；脚注提示词义范围，供读者比较。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事表达。“呆站在那里，说不出话来”传达震惊下的站立与失语状态；分号清楚区分人物状态和他们听见、看不见的经历。
