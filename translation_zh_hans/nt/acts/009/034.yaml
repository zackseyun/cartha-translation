  rationale: 修正称号与人名的中文语序，使表达自然，同时保留Χριστός的称号含义。保留“医治你”以对应希腊文现在时在医治宣告中的当下效力，避免擅自确定为完成体。更新脚注b，使其准确解释“铺设／整理卧具”及反身与格的意义。
