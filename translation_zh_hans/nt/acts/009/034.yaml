  naturalness: “弥赛亚耶稣”不符合现代标准汉语中人名加称号的自然表达。“耶稣这位弥赛亚医治你”庄重、清晰且自然。“自己把床铺好”可表达整理卧具，保留命令的直接性。
  terminology: “弥赛亚”适宜译出Χριστός的称号含义；采用“耶稣这位弥赛亚”而非将“弥赛亚”置于名字之前。人名“以尼雅”可保留。脚注a应相应说明“耶稣基督”为传统、可行译法。脚注b原称“直译”却未完整反映στρῶσον的宾语所指及σεαυτῷ，需修正。
