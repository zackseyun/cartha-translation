  text: καὶ εἶπεν αὐτῷ ὁ Πέτρος· Αἰνέα, ἰᾶταί σε Ἰησοῦς ⸀Χριστός· ἀνάστηθι καὶ στρῶσον σεαυτῷ· καὶ εὐθέως ἀνέστη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/034.yaml
  text: And Peter said to him[a], “Aeneas, Jesus the Messiah heals you[b]. Get up and make your bed.” And immediately he got up.
translation:
  language: zh_hans
  text: 彼得对他说：“以尼雅，耶稣这位弥赛亚医治你。起来，自己把床铺好！”他立刻就起来了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰᾶταί
  choice: 医治你了
  rationale: 这是ἰάομαι的现在时直陈式，在此宣告中具有当下生效的施为意味。汉语用“医治你了”既表达医治此刻成为事实，又不将其明确改写为进行体或纯粹完成体。
- source_word: Χριστός
  choice: 弥赛亚
  rationale: 此处Χριστός用于耶稣的称号。译作“弥赛亚”保留其称号含义；在汉语中置于“耶稣”之前组成“弥赛亚耶稣”，比把“基督”当作姓名的一部分更能显出称号性质。
- source_word: ἀνάστηθι
  choice: 起来
  rationale: ἀνίστημι的不定过去时命令式；“起来”自然、直接，也切合以尼雅原先卧床的处境。
- source_word: στρῶσον σεαυτῷ
  choice: 自己把床铺好
  rationale: στρώννυμι指铺设或整理床铺，σεαυτῷ强调他亲自为自己做。此译自然地保留了恢复行动能力的意味。
- source_word: εὐθέως
  choice: 立刻
  rationale: 准确表达动作随即发生，并符合现代汉语叙事习惯。
- source_word: ἀνέστη
  choice: 起来了
  rationale: 与前面的命令“起来”形成清楚呼应，并自然叙述命令即时实现的结果。
- source_word: Αἰνέα
  choice: 以尼雅
  rationale: 采用该希腊人名在简体中文圣经语境中通行且易辨认的音译。
theological_decisions:
- issue: 医治宣告中Χριστός的译法
  choice: 弥赛亚耶稣
  alternative: 耶稣基督
  rationale: 原文Ἰησοῦς Χριστός既可按传统译为“耶稣基督”，也可突出Χριστός的称号含义。正文选“弥赛亚耶稣”以保留称号功能，同时以脚注列出传统译法，避免把有依据的两种理解压平。
- issue: ἰᾶταί所表达的医治时态
  choice: 医治你了
  alternative: 正在医治你／已经医治了你
  rationale: 希腊文用现在时，但在此直接宣告中，重点是医治当下生效。正文不把它限定为持续过程，也不强化为先已完成的事件。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。直接引语简洁有力；“自己把床铺好”保留σεαυτῷ所强调的亲自行动。人名采用通行译名“以尼雅”。
