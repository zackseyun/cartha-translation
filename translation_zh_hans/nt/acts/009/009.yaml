  yaml_path: translation/nt/acts/009/009.yaml
  text: And for three days he was without sight[a], and he neither ate nor drank.
translation:
  language: zh_hans
  text: 他三天都看不见，也没有吃，也没有喝。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“不看见”。这里指扫罗不能看见。
    reason: 说明希腊文分词短语的较直译表达，并澄清其语境含义，而不在正文中强化为“瞎了”。
lexical_decisions:
- source_word: ἦν ἡμέρας τρεῖς
  choice: 有三天
  rationale: ἡμέρας τρεῖς是时间延续的宾格，现代汉语自然译为“有三天”；无需把ἦν强化为“持续”或“留在”。
- source_word: μὴ βλέπων
  choice: 看不见
  rationale: 分词短语直指“不能看见”的状态；“看不见”自然、准确，也避免在正文中改用原文未出现的形容词“瞎了”。
- source_word: οὐκ ἔφαγεν
  choice: 不吃
  rationale: 与后面的否定动词并列。结合“三天”这一持续时段，汉语用“不吃”自然表达这段时间内没有进食。
- source_word: οὐδὲ ἔπιεν
  choice: 也不喝
  rationale: οὐδὲ承接前一否定句，译作“也不喝”符合现代汉语并列否定的表达。
