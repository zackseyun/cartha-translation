  text: Ὁ δὲ Σαῦλος ἔτι ἐμπνέων ἀπειλῆς καὶ φόνου εἰς τοὺς μαθητὰς τοῦ κυρίου, προσελθὼν τῷ ἀρχιερεῖ
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/001.yaml
  text: But Saul[a], still breathing threats and murder against the disciples of the Lord, came to the high priest
translation:
  language: zh_hans
  text: 扫罗仍然满怀着针对主的门徒的威吓和杀意，来到大祭司那里。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: 仍然……，便……
  rationale: 本词在这里推动叙事，并略带转折或承接作用。汉语不必机械译作“但是”；结合ἔτι，用“仍然”承接上文，再以“便”引出扫罗的行动，较为自然。
- source_word: ἔτι
  choice: 仍然
  rationale: 表示扫罗敌视主门徒的状态仍在持续。
- source_word: ἐμπνέων
  choice: 喷吐着
  rationale: 保留原文以呼吸描写敌意的鲜明比喻；“喷吐着”在现代汉语中能自然表达这种不断向外发出的凶狠气势。
- source_word: ἀπειλῆς
  choice: 威吓
  rationale: 既可指威胁的言语，也可表达恐吓行为；与本句强烈、凝练的语气相称。
- source_word: φόνου
  choice: 杀气
  rationale: 原词可指杀人、凶杀。此处与“喷吐着”连用，“杀气”在汉语中既保留致人于死的暴力意味，也使呼吸比喻自然成立；脚注说明其较直译的范围。
- source_word: εἰς τοὺς μαθητὰς
  choice: 对主的门徒
  rationale: εἰς在敌对语境中指向行为的对象，译作“对”符合现代汉语表达。
- source_word: μαθητὰς τοῦ κυρίου
  choice: 主的门徒
  rationale: “门徒”是使徒行传语境中的准确常用称谓；属格表明他们归属于主、跟随主。
- source_word: προσελθὼν τῷ ἀρχιερεῖ
  choice: 便去见大祭司
  rationale: 分词表示扫罗前往或接近大祭司，为下一节的请求作铺垫。“去见”比生硬的“走近”更符合此处人物接洽的语境。
- source_word: ἀρχιερεῖ
  choice: 大祭司
  rationale: 这是ἀρχιερεύς单数形式在该历史与宗教语境中的标准译法。
theological_decisions:
- issue: τοῦ κυρίου中κύριος的译法
  choice: 主
  alternative: 主人
  rationale: 在路加—使徒行传的这一语境中，κύριος指耶稣；“主”既是准确、惯常的称谓，也不额外加入宗派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“喷吐着威吓和杀气”保留原文强烈的呼吸意象，同时避免生硬直译成“呼吸着威吓和凶杀”。经文末尾保留承接下一节的未完叙事感。
