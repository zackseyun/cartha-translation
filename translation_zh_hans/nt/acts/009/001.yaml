revisions:
- from: 扫罗仍然对主的门徒喷吐着威吓和杀气[a]，便去见大祭司。
  to: 扫罗仍然满怀着针对主的门徒的威吓和杀意，来到大祭司那里。
  rationale: 修订以“威吓和杀意”对应ἀπειλῆς καὶ φόνου，避免“杀气”所带来的气势义取代杀人义；以“针对主的门徒”表达敌对语境中εἰς的指向；以“来到大祭司那里”对应προσελθὼν τῷ ἀρχιερεῖ。原文没有脚注锚点以外的结构性限制，故保留单一词汇替代脚注。
