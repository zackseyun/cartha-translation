  text: ἐγγὺς δὲ οὔσης Λύδδας τῇ Ἰόππῃ οἱ μαθηταὶ ἀκούσαντες ὅτι Πέτρος ἐστὶν ἐν αὐτῇ ἀπέστειλαν ⸂δύο ἄνδρας⸃ πρὸς αὐτὸν παρακαλοῦντες· Μὴ ⸀ὀκνήσῃς διελθεῖν ἕως ⸀ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/038.yaml
  text: Since Lydda was near Joppa[a], the disciples, hearing that Peter was there, sent two men to him, urging, “Do not delay to come to us.”
translation:
  language: zh_hans
  text: 吕大离约帕很近，门徒听说彼得在那里，就派两个人去见他，恳求说：“请不要耽搁，到我们这里来。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “请不要耽搁”也可译作“请不要犹豫”。原文动词既可表示迟延，也可表示犹豫；这里按紧急邀请的语境译作“耽搁”。
    reason: 词义存在真实的语境选择，脚注保留另一合理译法。
lexical_decisions:
- source_word: ἐγγὺς δὲ οὔσης Λύδδας τῇ Ἰόππῃ
  choice: 吕大离约帕很近
  rationale: 以自然的汉语背景分句表达属格独立结构；上下文已足以显出这一地理情况与随后行动的关联，不额外强化为明确因果。δὲ 在此承担轻微衔接作用，汉语中不必机械译出。
- source_word: Λύδδας / Ἰόππῃ
  choice: 吕大 / 约帕
  rationale: 采用现代中文圣经语境中通行的希腊地名译法。
- source_word: οἱ μαθηταὶ
  choice: 门徒
  rationale: 准确表达 Acts 中 μαθηταί 所指的信徒群体，也是现代中文基督教文本中清楚而通行的称呼。
- source_word: ἀκούσαντες ὅτι Πέτρος ἐστὶν ἐν αὐτῇ
  choice: 听说彼得在那里
  rationale: ἀκούσαντες 表示先于主句行动的伴随背景；“听说”自然传达他们得到消息之意。“那里”回指吕大。
- source_word: ἀπέστειλαν δύο ἄνδρας πρὸς αὐτόν
  choice: 就派两个人去见他
  rationale: “派两个人”直接对应动词和宾语；补出“去见”自然表达 πρὸς αὐτόν 的趋向和目的。
- source_word: παρακαλοῦντες
  choice: 恳求说
  rationale: 此处是带有急迫感的郑重请求；“恳求”比一般的“请求”更能体现语气，又不必夸张为哀求。
- source_word: Μὴ ὀκνήσῃς
  choice: 请不要耽搁
  rationale: ὀκνέω 可指迟延、犹豫或畏缩；在请求立即赶路的语境中，“不要耽搁”最贴切，同时以脚注保留“不要犹豫”的可能。
- source_word: διελθεῖν ἕως ἡμῶν
  choice: 快到我们这里来
  rationale: 该短语表示前往说话者所在之处；“到我们这里来”符合汉语指示视角。“快”把“不耽搁”在中文请求中的实际急迫性自然呈现出来，并非另加新的动作。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语自然的叙事语言。“吕大离约帕很近”避免生硬复制希腊语属格独立结构；引语中的“请不要耽搁，快到我们这里来”体现急切但不过度渲染。
