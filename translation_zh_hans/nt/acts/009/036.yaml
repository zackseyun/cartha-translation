base_translation:
  language: en
  yaml_path: translation/nt/acts/009/036.yaml
  text: In Joppa there was a disciple named Tabitha[a], which translated is called Dorcas. She was full of good works and acts of mercy that she was doing.
translation:
  language: zh_hans
  text: 在约帕有一位女门徒，名叫大比大[a]；这名字翻译出来叫作多加。她常常行善，多施慈惠。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “多加”是与“大比大”对应的希腊名字；这两个名字的意思都是“羚羊”。
    reason: 说明原文所列名字的对应关系及共同词义，不额外断定原文未明说的语言标签。
lexical_decisions:
- source_word: μαθήτρια
  choice: 女门徒
  rationale: 该名词是明确的阴性形式，也是新约中唯一一次出现。汉语“门徒”本身不标性别，因此加“女”可准确传达原文信息，且表达自然。
- source_word: Ἐν Ἰόππῃ
  choice: 在约帕
  rationale: 采用现代中文圣经传统中通行的地名音译，并准确表达地点。
- source_word: ὀνόματι Ταβιθά
  choice: 名叫大比大
  rationale: “名叫”自然表达希腊语与格命名结构；“大比大”采用通行的中文音译。
- source_word: διερμηνευομένη λέγεται Δορκάς
  choice: 这名字翻译成希腊话叫作多加
  rationale: 原文说明闪语名字与希腊语名字的对应关系；补出“希腊话”使现代读者清楚，同时保留命名公式，而不只译为词义“羚羊”。
- source_word: πλήρης ἔργων ἀγαθῶν
  choice: 常常行善
  rationale: 这里的“充满善行”描述她一贯有许多善行。中文用“常常行善”自然地传达这种习惯性和丰富性。
- source_word: ἐλεημοσυνῶν ὧν ἐποίει
  choice: 周济穷人
  rationale: ἐλεημοσύνη在此指向有需要者施舍、赒济；未完成时ἐποίει表示持续或惯常所做。中文“周济穷人”具体、自然，并与前面的习惯性表达相连。
- source_word: δέ
  choice: 不单独译出
  rationale: δέ在此主要推动叙事发展。中文直接以地点短语起句即可自然承接上下文，无须机械加入“现在”或“于是”。
theological_decisions:
- issue: μαθήτρια的阴性信息
  choice: 女门徒
  alternative: 门徒
  rationale: 现代汉语的“门徒”没有语法性别，若只译“门徒”会遗漏原文罕见而明确的阴性形式；译作“女门徒”准确且不生硬。
- issue: ἐλεημοσυνῶν的范围
  choice: 周济穷人
  alternative: 怜悯人的事；施舍
  rationale: 该词可泛指慈惠，也常特指向穷人施舍。此处所述行为及后文寡妇展示衣物的语境支持实际赒济；此译不把它限定为某种宗教制度。
- issue: πλήρης与未完成时ἐποίει所表达的持续性
  choice: 她常常行善，周济穷人
  alternative: 她满有善行和所行的赒济
  rationale: 自然中文难以照搬“充满……她所做的”结构；“常常”保存了她善行丰富且持续、惯常的意义，没有将其解释为一次性行动。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“女门徒”保留原文显明的性别信息；“常常行善，周济穷人”以自然汉语呈现善行丰富和持续施行赒济的含义。
