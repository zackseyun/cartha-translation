  terminology: “慈惠”适当地涵盖ἐλεημοσύναι所指的怜悯性施予或救济行动，不不必要地限缩为金钱施舍或特定对象。“多加”及“大比大”可保留；脚注应避免把原文未明说的语言标签作为正文事实。
