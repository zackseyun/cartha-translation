  text: ἠγέρθη δὲ ⸀Σαῦλος ἀπὸ τῆς γῆς, ἀνεῳγμένων ⸀δὲ τῶν ὀφθαλμῶν αὐτοῦ ⸀οὐδὲν ἔβλεπεν· χειραγωγοῦντες δὲ αὐτὸν εἰσήγαγον εἰς Δαμασκόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/008.yaml
  text: But Saul got up from the ground[a], and though his eyes were open, he saw nothing. So they led him by the hand and brought him into Damascus.
translation:
  language: zh_hans
  text: 扫罗从地上起来；他的眼睛虽然睁开了，却什么也看不见。他们便牵着他的手，领他进了大马士革。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠγέρθη
  choice: 起来
  rationale: 此处不定过去时被动形式在叙事中作不及物理解，指扫罗从倒地的状态起身；“起来”自然且准确，不必译出被动语态。
- source_word: ἀπὸ τῆς γῆς
  choice: 从地上
  rationale: γῆ在当前场景中指扫罗倒下所在的地面，并非宇宙意义的“地球”或地理意义的“土地”。
- source_word: ἀνεῳγμένων ... τῶν ὀφθαλμῶν αὐτοῦ
  choice: 他的眼睛虽然睁开了
  rationale: 属格独立结构表达伴随情形；结合下文的失明，“虽然……却……”自然呈现眼睛已睁开但仍不能看见的反差。
- source_word: οὐδὲν ἔβλεπεν
  choice: 却什么也看不见
  rationale: 表达完全无法看见；“看不见”在现代汉语中比直译为“没有看见任何东西”更符合这里持续失明的状态。
- source_word: χειραγωγοῦντες
  choice: 拉着他的手领他
  rationale: 该动词特指牵手引领需要帮助的人；此译保留具体动作，也符合现代汉语习惯。
- source_word: εἰσήγαγον εἰς Δαμασκόν
  choice: 领他进了大马士革
  rationale: εἰσάγω表示带领进入；“进了”清楚保留进入城中的方向和结果。
- source_word: Σαῦλος
  choice: 扫罗
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: Δαμασκόν
  choice: 大马士革
  rationale: 采用现代中文通行的地名译法。
- source_word: δὲ
  choice: ；／却／便
  rationale: 本节三处δέ分别承担叙事推进、轻微转折和后续动作衔接的作用；按汉语语篇习惯以标点及不同连接成分表达，不机械重复同一词。
theological_decisions: []
