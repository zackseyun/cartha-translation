base_translation:
  language: en
  yaml_path: translation/nt/acts/009/014.yaml
  text: And here he has authority from the chief priests to bind all who call on your name[a].
translation:
  language: zh_hans
  text: 他在这里也有从祭司长们那里得到的权柄，可以捆绑所有呼求你名[a]的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“所有求告你名的人。”这个希腊语表达是圣经中常见的惯用语，指呼求或求告某人，往往用于祷告。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧδε
  choice: 在这里
  rationale: 这是地点副词，指亚拿尼亚所在的大马士革；“在这里”自然且准确。
- source_word: ἐξουσίαν
  choice: 权柄
  rationale: 这里指祭司长所授予的正式权限；“权柄”既保留官方授权之意，也符合庄重的圣经语体。
- source_word: παρὰ τῶν ἀρχιερέων
  choice: 从祭司长们那里得到的
  rationale: παρά加属格表示来源。复数“祭司长们”保留原文数，并指耶路撒冷的祭司领袖群体。
- source_word: δῆσαι
  choice: 捆绑
  rationale: 保留动词“捆绑”的原始意象；语境表明其实际目的在于拘捕，但不以解释性译法取代原文措辞。
- source_word: πάντας τοὺς ἐπικαλουμένους
  choice: 所有呼求……的人
  rationale: 带冠词的分词构成名词性表达。“呼求”保留ἐπικαλέομαι在圣经中祈求、求告某人的惯用含义。
- source_word: τὸ ὄνομά σου
  choice: 你名
  rationale: 直译原文，同时保留“名”代表所呼求之对象及其权柄的圣经表达。
theological_decisions:
- issue: 对耶稣说“呼求你名”的含义
  choice: 保留“呼求你名”的表达
  alternative: 向你祷告；求告你的权柄；所有认同你的人
  rationale: 该短语在圣经及早期基督徒用语中可表示在祷告或敬拜中求告，也含归属与效忠意味。直译既保留其指向耶稣的神学分量，也不把其含义缩窄或扩写成原文未明说的教义解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“权柄”与“捆绑”略带圣经语体，以保留原文的正式授权和具体动作意象；其余句法调整为自然汉语。
