  yaml_path: translation/nt/acts/009/028.yaml
  text: And he was with them in Jerusalem, going in and going out, speaking boldly in the name of the Lord.
translation:
  language: zh_hans
  text: 他和他们在耶路撒冷出入，奉主的名放胆讲论。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦν μετ’ αὐτῶν
  choice: 和门徒一起
  rationale: 未完成时ἦν与μετά加属格表示持续的相交和同行；结合上文以“门徒”明示代词所指，中文自然且不增加“住下”的含义。
- source_word: εἰσπορευόμενος καὶ ἐκπορευόμενος
  choice: 出入
  rationale: 两个分词构成惯用搭配，描写经常而公开地来往活动；“出入”简洁保留了成对动作，也符合现代汉语表达。
- source_word: εἰς Ἰερουσαλήμ
  choice: 在耶路撒冷
  rationale: 此处εἰς在“出入”的惯用结构中表示活动范围；译作地点短语可避免使人误以为他反复进城。
- source_word: παρρησιαζόμενος
  choice: 放胆传讲
  rationale: 该动词指坦然无惧、公开地发言；“放胆”体现勇气与无所顾忌，“传讲”在语境中自然表达其宣讲行为。
- source_word: ἐν τῷ ὀνόματι
  choice: 奉……的名
  rationale: “奉……的名”是自然且庄重的中文圣经用语，可保留代表、权柄和宣认等多重含义，不把短语限缩为单一解释。
- source_word: τοῦ κυρίου
  choice: 主
  rationale: 原文使用称号κύριος而非名字Ἰησοῦ；保留译为“主”，不在正文中将所指直接改写为“耶稣”。
theological_decisions:
- issue: “主”的所指
  choice: 正文保留“主”这一称号，语境中所指为耶稣。
  alternative: 在正文中明确译作“耶稣”。
  rationale: 希腊文为κυρίου；保留原有称号既忠于文本，也保存《路加福音—使徒行传》中该称号的神学分量，避免把称号静默替换为专名。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“出入”凝练呈现希腊文成对分词的惯用意义；“奉主的名放胆传讲”保持中文流畅，同时保留原文关于名、权柄及公开无惧发言的丰富含义。
