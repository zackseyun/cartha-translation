  text: ἐλάλει τε καὶ συνεζήτει πρὸς τοὺς Ἑλληνιστάς· οἱ δὲ ἐπεχείρουν ⸂ἀνελεῖν αὐτόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/029.yaml
  text: And he was speaking and debating with the Hellenists[a], but they were attempting to kill him.
translation:
  language: zh_hans
  text: 他不断地同说希腊话的犹太人[a]交谈并辩论；他们却企图杀死他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“希利尼人”，指说希腊语的犹太人。
    reason: 保留Ἑλληνισταί的传统音译，同时说明其在《使徒行传》中的社会语言群体含义，避免误解为泛指希腊人或某一宗派。
lexical_decisions:
- source_word: ἐλάλει
  choice: 不断……讲论
  rationale: 未完成时表示持续或反复进行的言说；“不断……讲论”既体现叙事中的持续性，也保持庄重自然。
- source_word: τε καὶ
  choice: 、
  rationale: 该组合连接两个并列的未完成时动词；中文用顿号并列“讲论、辩论”，简洁自然地表达两项相连的活动。
- source_word: συνεζήτει
  choice: 辩论
  rationale: 此词在本语境中指带有争辩性质的讨论，不只是中性的交谈；“辩论”也与随后敌对者企图杀他的情节相称。
- source_word: πρὸς τοὺς Ἑλληνιστάς
  choice: 跟说希腊话的犹太人
  rationale: πρός在讨论类动词后表示与某些人互动，译作“跟”符合现代汉语；Ἑλληνισταί在《使徒行传》中最自然地指说希腊话的犹太人。
- source_word: οἱ δὲ
  choice: 他们却
  rationale: δέ在这里形成明显转折；“却”突出他的讲论、辩论与对方杀人企图之间的反差。
- source_word: ἐπεχείρουν
  choice: 企图
  rationale: 该词表示着手或试图采取行动；“企图”准确传达敌对意图。未完成时的持续性由上下文可自然领会，避免中文表达累赘。
- source_word: ἀνελεῖν αὐτόν
  choice: 杀死他
  rationale: ἀναιρέω在此意为杀害或除掉；“杀死他”清楚直接，不弱化暴力含义。
theological_decisions:
- issue: Ἑλληνιστάς所指群体的身份
  choice: 说希腊话的犹太人
  alternative: 希利尼派的人；希腊人
  rationale: 《使徒行传》6:1以Ἑλληνισταί指与说希伯来语或亚兰语的犹太人有别的希腊语犹太群体。直译为“说希腊话的犹太人”可避免让读者误以为这里泛指外邦希腊人，同时脚注保留传统音译。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“不断”体现前两个未完成时动词的持续或反复动作；分号呈现前后强烈转折。主文使用解释性称谓，脚注保留传统术语。
