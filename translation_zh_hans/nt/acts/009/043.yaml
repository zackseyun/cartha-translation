  text: And he stayed in Joppa for many days with a certain Simon[a], a tanner.
translation:
  language: zh_hans
  text: 于是，彼得在约帕一个名叫西门的硝皮匠家里住了许多天。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“彼得与一个名叫西门的硝皮匠同住。”原文可指住在某人那里或其家中。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ... μεῖναι
  choice: 住了
  rationale: 这是常见的“ἐγένετο + 不定式”叙事结构；中文直接以“住了”为谓语，既自然，也准确表达持续居留的意思。主语“彼得”根据上文补出，以避免中文中主语不明。
- source_word: δὲ
  choice: 此后
  rationale: δὲ在这里是轻微的叙事连接词，并非强烈转折；“此后”自然承接前文并推进叙事。
- source_word: ἡμέρας ἱκανὰς
  choice: 许多天
  rationale: ἱκανός修饰时间时表示数量不少或相当长；“许多天”简明自然，不额外限定具体时长。
- source_word: ἐν Ἰόππῃ
  choice: 在约帕
  rationale: 按现代中文圣经地名的通行形式，将Ἰόππη音译为“约帕”。
- source_word: παρά τινι Σίμωνι
  choice: 住在一个名叫西门的……家里
  rationale: παρά加与格在此可表示住在某人那里或其家中；τινι表不特指。“一个名叫西门的……家里”符合现代中文表达，并明确这里是寄居之处。
- source_word: βυρσεῖ
  choice: 硝皮匠
  rationale: βυρσεύς特指加工、鞣制兽皮的人；“硝皮匠”比宽泛的“皮革工匠”更准确，也保留其具体职业含义。
