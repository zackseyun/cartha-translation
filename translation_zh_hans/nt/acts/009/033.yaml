  text: εὗρεν δὲ ἐκεῖ ἄνθρωπόν τινα ⸂ὀνόματι Αἰνέαν⸃ ἐξ ἐτῶν ὀκτὼ κατακείμενον ἐπὶ ⸀κραβάττου, ὃς ἦν παραλελυμένος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/033.yaml
  text: And there he found a certain man named Aeneas[a], bedridden for eight years, who was paralyzed.
translation:
  language: zh_hans
  text: 他在那里遇见一个人，名叫以尼雅。这人瘫痪，已经在褥子上躺了八年[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“卧床已经八年。”“褥子”也可指垫子或简易床铺。
    reason: 说明κατακείμενον ἐπὶ κραβάττου既可按具体形象翻译，也可用汉语惯用语概括；同时保留κραβάττος所指卧具的词义范围。
lexical_decisions:
- source_word: εὗρεν δὲ ἐκεῖ
  choice: 他在那里遇见
  rationale: δέ承接叙事，现代汉语不必机械译出“于是”或“而”；εὗρεν在此指遇到、发现某人，译作“遇见”自然且不增加刻意寻找的含义。
- source_word: ἄνθρωπόν τινα
  choice: 一个人
  rationale: τις引入此前未提及的特定人物；现代汉语用“一个人”即可自然表达，不采用较生硬的“某一个人”。
- source_word: ὀνόματι Αἰνέαν
  choice: 名叫以尼雅
  rationale: 按汉语习惯表达姓名结构，并采用基督教中文传统中较通行的人名音译“以尼雅”。
- source_word: ἐξ ἐτῶν ὀκτώ
  choice: 已经……八年
  rationale: 该短语表示持续八年的时段；“已经……八年”准确表达延续状态，符合现代汉语。
- source_word: κατακείμενον ἐπὶ κραβάττου
  choice: 在褥子上躺了
  rationale: 保留原文“躺在简易卧具上”的具体形象，而非仅概括为“卧床不起”。“褥子”在普通现代汉语中可理解，也与可铺卧的垫褥相符。
- source_word: ὃς ἦν παραλελυμένος
  choice: 这人……是瘫痪的
  rationale: 明确表达原文所述的持续身体状况；用“这人”承接关系代词，使汉语句子清楚自然。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。保留“褥子”的具体形象，并以脚注提供更顺畅的概括译法；不把瘫痪与卧床合并成单一陈述，以维持原文两层描述。
