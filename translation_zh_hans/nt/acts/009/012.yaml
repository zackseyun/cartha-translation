  text: καὶ εἶδεν ⸂ἄνδρα ἐν ὁράματι Ἁνανίαν ὀνόματι⸃ εἰσελθόντα καὶ ἐπιθέντα αὐτῷ ⸀χεῖρας ὅπως ἀναβλέψῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/012.yaml
  text: and he has seen in a vision a man named Ananias coming in and laying his hands on him so that he might regain his sight[a][b].
translation:
  language: zh_hans
  text: 他在异象中看见一位名叫亚拿尼亚的人进来，把手按在扫罗身上，好让扫罗恢复视力[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“好让扫罗再看见。”
    reason: 词义上的另一种直译；在本段语境中是恢复视力的意思。
lexical_decisions:
- source_word: εἶδεν
  choice: 看见
  rationale: 不在汉语中额外标明完成体；上下文已表明这是扫罗先前在异象中所见、而今仍与当前行动相关的事。
- source_word: ἄνδρα
  choice: 一个人
  rationale: 这里指成年男子亚拿尼亚；现代汉语用“一个人”自然清楚，姓名已明确其身份。
- source_word: ἐν ὁράματι
  choice: 在异象中
  rationale: 准确表达所见之事发生的领域或媒介，并保留圣经语体。
- source_word: Ἁνανίαν ὀνόματι
  choice: 名叫亚拿尼亚
  rationale: 自然传达希腊语“名为亚拿尼亚”的身份说明。
- source_word: εἰσελθόντα
  choice: 进来
  rationale: 分词描述异象中亚拿尼亚进入扫罗所在之处；“进来”简洁自然，不强行规定与按手动作之间更精细的时间先后。
- source_word: ἐπιθέντα αὐτῷ χεῖρας
  choice: 把手按在他身上
  rationale: 保留实际的按手动作，同时采用现代汉语易懂的表达，不额外赋予礼仪、圣礼或特定医治机制的含义。
- source_word: ὅπως
  choice: 使
  rationale: 在汉语中自然表达目的或预期结果，不必机械译作“为要”。
- source_word: ἀναβλέψῃ
  choice: 能恢复视力
  rationale: 在扫罗失明的医治语境中，该词指恢复视觉；此译法比字面的“再看见”更明确自然。
theological_decisions:
- issue: 按手动作是否应被赋予特定的礼仪或医治神学含义
  choice: 把手按在他身上
  alternative: 按手在他身上
  rationale: 原文陈述身体动作，却没有在本节界定其礼仪性质或作用方式；译文保留动作本身，不引入宗派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“异象”“亚拿尼亚”沿用通行圣经用语；句式保持叙事流畅，并避免用“已经”等体貌标记过度解释希腊语不定过去时。
