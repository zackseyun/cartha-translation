  text: εἶπεν δὲ πρὸς αὐτὸν ὁ κύριος· Πορεύου, ὅτι σκεῦος ἐκλογῆς ⸂ἐστίν μοι⸃ οὗτος τοῦ βαστάσαι τὸ ὄνομά μου ἐνώπιον ⸀ἐθνῶν ⸀τε καὶ βασιλέων υἱῶν τε Ἰσραήλ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/015.yaml
  text: But the Lord said to him[a], “Go[b], because this man is a chosen instrument of mine to carry my name before the Gentiles and kings and the sons of Israel,”
translation:
  language: zh_hans
  text: 主对他说：“去吧！因为这人是我所拣选的器皿，要在外邦人[a]、君王和以色列子孙[b]面前传扬我的名。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “外邦人”也可译作“列国”。
    reason: lexical_alternative
  - marker: b
    text: “以色列子孙”是圣经中对以色列民的传统称呼，泛指以色列人民。
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: 主
  rationale: 现代中文圣经语体中对该称号最自然、庄重的译法；本叙事语境指以神圣权柄说话的复活之耶稣。
- source_word: Πορεύου
  choice: 去吧
  rationale: 准确传达命令语气；句末“吧”使现代汉语表达自然，但不削弱指令力度。
- source_word: σκεῦος ἐκλογῆς ἐστίν μοι
  choice: 是我所拣选的器皿
  rationale: 保留“器皿”这一圣经隐喻及 μοι 所表达的归属关系，同时将属格 ἐκλογῆς 自然译为“所拣选的”，避免引入后世系统神学含义。
- source_word: τοῦ βαστάσαι τὸ ὄνομά μου
  choice: 要……传扬我的名
  rationale: βαστάσαι 字面为“承载、带着”，与“我的名”连用时指公开带出并宣扬其名；“传扬”在中文中清楚表达使命目的，同时保留“我的名”而不加以释义。
- source_word: ἐνώπιον
  choice: 在……面前
  rationale: 保留原文空间性与公开作见证的含义，中文自然。
- source_word: ἐθνῶν
  choice: 外族人
  rationale: 因其与“以色列子孙”并列对照，此处指以色列以外各族的人；“外族人”比“外邦人”更符合现代普通话，同时脚注保留“列国”这一可能译法。
- source_word: βασιλέων
  choice: 君王
  rationale: 准确保留具体的王权称谓，语体庄重自然。
- source_word: υἱῶν Ἰσραήλ
  choice: 以色列子孙
  rationale: 保留原文亲属性群体称谓及传统圣经表达；脚注说明其集体所指，避免误解为仅限男性。
- source_word: τε ... καὶ ... τε
  choice: 、……和……
  rationale: 以现代汉语列举结构自然连接三组对象，无须机械重现每个希腊语连接粒子。
theological_decisions:
- issue: ἐκλογῆς 可能被过度套入后世“拣选论”争议
  choice: 是我所拣选的器皿
  alternative: 是我拣选的工具；是我的拣选之器皿
  rationale: 经文明说这人被主选中承担使命，但并未在此系统论述救恩中的个人拣选；本译法保留神主动选择的陈述而不扩大其教义范围。
- issue: “我的名”所指的代表、见证与宣告含义
  choice: 传扬我的名
  alternative: 带着我的名；承载我的名
  rationale: 原文意象容许“承载”与“带到人前”的理解；中文若直译“承载我的名”较生硬。“传扬”贴合使徒行传的宣教语境，但仍保留“我的名”，不把其丰富含义缩减为单一教义命题。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“器皿”“我的名”“以色列子孙”等具有重要圣经意象或传统背景的表达，并用脚注澄清可能不够直观之处。
