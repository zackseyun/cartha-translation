  text: καὶ εὐθέως ἀπέπεσαν ⸂αὐτοῦ ἀπὸ τῶν ὀφθαλμῶν⸃ ⸀ὡς λεπίδες, ἀνέβλεψέν τε καὶ ἀναστὰς ἐβαπτίσθη,
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/018.yaml
  text: And immediately something like scales fell from his eyes[a], and he regained his sight; then he got up and was baptized,
translation:
  language: zh_hans
  text: 立刻，有鳞片似的东西从他眼睛上掉下来[a]，他就恢复了视力；随后，他起来受了洗。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“仿佛有鳞片从他眼睛上掉下来。”希腊文使用比较说法，描述其看起来像鳞片，并非确认那就是实际的鳞片。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: 立刻
  rationale: 准确表达事件随即发生，符合现代汉语叙事习惯。
- source_word: ἀπέπεσαν
  choice: 掉下来
  rationale: 表达从眼睛上脱落、落下的动作；与“从他眼睛上”连用自然清楚。
- source_word: αὐτοῦ ἀπὸ τῶν ὀφθαλμῶν
  choice: 从他眼睛上
  rationale: 保留ἀπό所表达的分离关系，并以自然汉语说明东西从眼睛表面脱落。
- source_word: ὡς λεπίδες
  choice: 有鳞片一样的东西
  rationale: ὡς表示比较而非确认其实体；“一样的东西”既保留鳞片的具体意象，也避免断言确有鳞片。
- source_word: ἀνέβλεψεν
  choice: 恢复了视力
  rationale: 在失明得医治的语境中，ἀναβλέπω指重新看见，而非单纯抬头看。
- source_word: τε καὶ
  choice: 就……；随后
  rationale: 以自然汉语连接恢复视力、起来和受洗这一连串动作，并保留叙事顺序。
- source_word: ἀναστάς
  choice: 起来
  rationale: 以简洁自然的方式表达先起身、继而受洗。
- source_word: ἐβαπτίσθη
  choice: 受了洗
  rationale: 准确表达被动语态，并采用现代汉语基督教语境中通行且不限定施洗方式的说法。
theological_decisions:
- issue: 如何在不限定宗派性施洗方式的前提下翻译βαπτίζω
  choice: 受了洗
  alternative: 受了浸
  rationale: 原文在本节并未说明施洗的具体方式。“受了洗”忠实表达动作及被动语态，同时避免加入原文没有明确规定的宗派性解释。
translation_notes:
  register: 采用庄重、流畅的现代标准汉语。“立刻”“恢复了视力”“受了洗”清楚易懂；用“有鳞片一样的东西”保留原文的比喻性质及其真实的指称不确定性。
