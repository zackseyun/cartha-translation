  text: ἐπιγνόντες δὲ οἱ ἀδελφοὶ κατήγαγον αὐτὸν εἰς Καισάρειαν καὶ ἐξαπέστειλαν αὐτὸν εἰς Ταρσόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/030.yaml
  text: When the brothers learned this[a], they brought him down to Caesarea and sent him off to Tarsus.
translation:
  language: zh_hans
  text: 弟兄们[a]得知这事，就带他下到凯撒利亚，又送他往大数去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“弟兄姊妹”。希腊文直译为“弟兄们”，但在这里可能泛指信徒群体。
    reason: 词义替代及指称范围说明
lexical_decisions:
- source_word: ἐπιγνόντες
  choice: 得知这事
  rationale: 该不定过去时分词说明弟兄们随后采取行动的缘由；宾语由上一节隐含提供，汉语补出“这事”可使语意自然清楚。
- source_word: οἱ ἀδελφοὶ
  choice: 弟兄们
  rationale: 保留希腊文阳性复数的直接表达；在《使徒行传》的语境中，这个词也可能泛指信徒群体，因此用脚注说明其涵盖范围。
- source_word: κατήγαγον
  choice: 带他下到
  rationale: κατάγω含有“带下去”的方向意味，此处很可能也呼应前往沿海地区的地理移动；“带他下到”保留了这一成分。
- source_word: Καισάρειαν
  choice: 凯撒利亚
  rationale: 采用现代中文圣经地名的通行译名；本节语境无须扩写为“海滨凯撒利亚”。
- source_word: ἐξαπέστειλαν
  choice: 送他往……去
  rationale: ἐξαποστέλλω表示将人送出或送往别处；“送他往……去”自然地体现从凯撒利亚继续送行的叙事动作。
- source_word: Ταρσόν
  choice: 大数
  rationale: 采用现代中文圣经传统中广为人知的城市译名。
theological_decisions:
- issue: 混合性别的信徒群体中ἀδελφοί的译法
  choice: 弟兄们
  alternative: 弟兄姊妹；众信徒
  rationale: 正文保留希腊文阳性复数的形式，不直接将其改写为包容性释义；同时以脚注交代该词在此语境中可能广泛指信徒群体，以保存原文形式与语境范围之间的张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“得知这事”承接上文；“带他下到”保留原文的方向性；句式简洁，符合叙事文体。
