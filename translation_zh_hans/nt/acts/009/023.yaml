  text: Ὡς δὲ ἐπληροῦντο ἡμέραι ἱκαναί, συνεβουλεύσαντο οἱ Ἰουδαῖοι ἀνελεῖν αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/023.yaml
  text: When many days had passed[c][b][a], the Jews conspired to kill him.
translation:
  language: zh_hans
  text: 过了许多日子[a]，犹太人[b]一同商议，要杀掉他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“许多日子将满的时候”或“许多日子满了以后”。
    reason: lexical_alternative
  - marker: b
    text: 原文作“犹太人”；这里按上下文是指反对扫罗的一群人，并非毫无例外地泛指所有犹太人。
    reason: cultural_note
lexical_decisions:
- source_word: Ὡς δὲ
  choice: 过了……
  rationale: 在叙事中引出时间上的转折；汉语用“过了……”自然表达，无须单独译出语气较轻的 δέ。
- source_word: ἐπληροῦντο ἡμέραι ἱκαναί
  choice: 过了许多日子
  rationale: πληρόω 的未完成时被动态以“日子”为主语，表达一段时间逐渐过去或满了；ἱκαναί 在这里指数量可观。“过了许多日子”自然清楚，同时以脚注保留较贴近形式的译法。
- source_word: συνεβουλεύσαντο
  choice: 一同商议
  rationale: 该词表示共同商议；杀人的目的使敌对意图已十分明确。“一同商议”既保留词义，也避免把动作预先强化为中文里法律色彩较强的“密谋”。
- source_word: οἱ Ἰουδαῖοι
  choice: 犹太人
  rationale: 原文没有进一步限定为领袖或犹太地区居民，因此正文保留群体称呼，并以脚注说明这里按语境不是泛指所有犹太人。
- source_word: ἀνελεῖν
  choice: 杀掉
  rationale: 这里指夺去性命。“杀掉”直接、现代，也不额外加入“谋杀”的法律或道德定性。
- source_word: αὐτόν
  choice: 他
  rationale: 宾格代词，按上下文指扫罗。
theological_decisions:
- issue: 敌对叙事中 οἱ Ἰουδαῖοι 的译法
  choice: 犹太人
  alternative: 犹太领袖；犹太地区的人
  rationale: 正文不把原文未限定的称呼缩窄为“领袖”，也不依据单节经文改释为地域身份；脚注则防止读者误解为所有犹太人无一例外。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“一同商议，要杀掉他”保留共同筹划及其明确目的；脚注只处理原文措辞的可译空间和群体称呼的语境范围。
