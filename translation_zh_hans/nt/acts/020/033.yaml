  text: ἀργυρίου ἢ χρυσίου ἢ ἱματισμοῦ οὐδενὸς ἐπεθύμησα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/033.yaml
  text: I coveted no one's silver or gold or clothing[a].
translation:
  language: zh_hans
  text: 我从未贪图过任何人的金银或衣物。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我从未想要过任何人的金银或衣物。”
    reason: 说明ἐπιθυμέω也可采用较中性的“想要”，保留词义范围及原文可能的语气差异。
lexical_decisions:
- source_word: ἀργυρίου
  choice: 银
  rationale: 该词本义为“银”；与“金”和“衣物”并列时，指具体贵重财物。汉语用“金银”并列表达自然，同时保留具体意象。
- source_word: χρυσίου
  choice: 金
  rationale: 直接对应“金”，并与“银”和“衣物”共同构成财物清单。
- source_word: ἱματισμοῦ
  choice: 衣物
  rationale: 指衣服、服饰；“衣物”是自然、庄重的现代汉语，也能体现古代衣服作为贵重财产的语境。
- source_word: οὐδενὸς
  choice: 任何人的
  rationale: 该属格形式在这里修饰所列财物，表示保罗不贪图任何人所有的东西；译作“任何人的”准确且符合现代汉语习惯。
- source_word: ἐπεθύμησα
  choice: 贪图过
  rationale: ἐπιθυμέω本可泛指“想要”，但在保罗为自己的操守辩白、否认觊觎他人财物的语境中带有负面的伦理含义。“贪图”保留这种含义，同时不过度强化为具体侵占行为。
- source_word: ἢ ... ἢ ... ἢ
  choice: 金银或衣物
  rationale: 希腊文用重复的ἢ逐项连接。在否定句中，汉语将“银、金”自然合并为“金银”，再以“或”连接“衣物”，既保留各类财物，又避免生硬重复。
theological_decisions:
- issue: ἐπιθυμέω用于他人财物时的道德色彩
  choice: 译作“贪图”
  alternative: 译作“想要”或“渴求”
  rationale: 上下文是保罗申明自己不受贪欲驱使。“贪图”体现对他人财物的不正当欲望，符合此处伦理语气，却不额外引入特定教派解释。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“我从未……过”清楚表达不定过去时在此对保罗既往行为的概括；“金银”符合汉语惯用搭配，“衣物”比“衣裳”或“服饰”更中性。
