  text: Καὶ νῦν ἰδοὺ ἐγὼ οἶδα ὅτι οὐκέτι ὄψεσθε τὸ πρόσωπόν μου ὑμεῖς πάντες ἐν οἷς διῆλθον κηρύσσων τὴν ⸀βασιλείαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/025.yaml
  text: And now, look, I know that none of you among whom I went about proclaiming the kingdom will see my face again.
translation:
  language: zh_hans
  text: 如今，你们看，我知道：你们众人，就是我曾在你们中间来往、宣讲神国的人，都不会再见到我的面了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ νῦν ἰδοὺ
  choice: 现在，看哪
  rationale: 保留承接语气和引人注意的命令式表达；“看哪”庄重而清楚，也不将其弱化为单纯填充语。
- source_word: διῆλθον
  choice: 曾在其中来往
  rationale: 表达保罗在这些人中间各处走动、开展事工的含义，同时保留原文关系从句的结构。
- source_word: κηρύσσων
  choice: 宣讲
  rationale: 体现公开传扬、宣告的信息传播动作，符合使徒行传的语境。
- source_word: τὴν βασιλείαν
  choice: 神国
  rationale: 原文直作“国度”，在此语境中所指为神的国；译作“神国”自然明确，且与新约常用表达一致。
- source_word: οὐκέτι ὄψεσθε τὸ πρόσωπόν μου
  choice: 以后都不会再见到我的面了
  rationale: 保留“见我的面”这一原文惯用表达，并用“以后……再”自然传达οὐκέτι的时间与否定意味。
theological_decisions:
- issue: “国度”的所指
  choice: 神国
  alternative: 国度
  rationale: 上下文中保罗宣讲的是神的国；明示“神”可避免现代汉语中“国度”所指不清，同时不增添宗派性解释。
- issue: 保罗关于不再相见之话的确定性
  choice: 我知道……以后都不会再见到
  alternative: 我想……大概不会再见到
  rationale: οἶδα是明确的“知道”，原文没有不确定语气，因此不应为协调后续叙事而弱化。
translation_notes:
  register: 采用现代、庄重而可懂的普通话。“看哪”略带经文语体，用来对应ἰδοὺ的强调功能；其余句式尽量自然流畅。
