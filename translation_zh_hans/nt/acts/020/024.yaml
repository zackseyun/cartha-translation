id: ACT.20.24
reference: Acts 20:24
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἀλλ’ οὐδενὸς ⸀λόγου ⸀ποιοῦμαι τὴν ⸀ψυχὴν τιμίαν ἐμαυτῷ ὡς ⸀τελειῶσαι τὸν δρόμον ⸀μου καὶ τὴν διακονίαν ἣν ἔλαβον παρὰ τοῦ κυρίου Ἰησοῦ, διαμαρτύρασθαι τὸ εὐαγγέλιον τῆς χάριτος τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/024.yaml
  text: 'But I do not count my life as of any value to myself[c][b][a], if only I may finish my course and the ministry that I received from the Lord Jesus: to testify to the gospel of the grace of God.'
translation:
  language: zh_hans
  text: 但我并不以自己的性命为宝贵[a]，只求能跑完我的赛程[b]，完成我从主耶稣所领受的服事，就是为上帝恩典的福音郑重作见证[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “性命”也可译作“生命”。原文所用的词有时可译作“灵魂”，但这里指保罗甘愿为完成使命而舍弃的今世生命。
    reason: lexical_alternative
  - marker: b
    text: “赛程”也可译作“路程”。原文可指跑者必须坚持到底、跑完全程的赛程。
    reason: lexical_alternative
  - marker: c
    text: “郑重作见证”也可译作“作见证”或“郑重证明”。原文动词带有认真、严肃见证的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδενὸς λόγου ποιοῦμαι ... τιμίαν ἐμαυτῷ
  choice: 我并不以……为宝贵
  rationale: 这一表达保留了“不看作对自己有价值或宝贵”的评价含义，同时符合现代汉语习惯。
- source_word: ψυχήν
  choice: 性命
  rationale: 上下文涉及保罗甘愿面对苦难和死亡；“性命”指今世生命，避免无端引入灵魂与身体的二分。
- source_word: ὡς τελειῶσαι
  choice: 只求能……完成
  rationale: 希腊文结构简略，突出保罗压倒一切的目标；“只求能”保留这种强烈愿望，而不把它限定为单纯的目的从句。
- source_word: δρόμον
  choice: 赛程
  rationale: 该词可指要跑完的路程或赛程；“赛程”保留了运动竞赛的隐喻，并与“跑完”自然搭配。
- source_word: διακονίαν
  choice: 服事
  rationale: 这里指保罗从主耶稣领受并要完成的受托服务；“服事”比泛指的“任务”更贴近原词，又未额外指定教会职衔。
- source_word: παρὰ τοῦ κυρίου Ἰησοῦ
  choice: 从主耶稣所领受
  rationale: παρά加属格表示来源；译文清楚表明这项服事来自主耶稣。
- source_word: διαμαρτύρασθαι
  choice: 郑重作见证
  rationale: 该动词不只表示一般陈述，也常带有严肃、郑重见证的语气；此译法在现代汉语中清楚自然。
- source_word: εὐαγγέλιον τῆς χάριτος τοῦ θεοῦ
  choice: 上帝恩典的福音
  rationale: 保留属格结构及其可能的丰富含义，既可理解为以恩典为内容的福音，也可理解为由上帝恩典所彰显或赋予特征的福音。
theological_decisions:
- issue: ψυχή在保罗自述中的含义
  choice: 性命
  alternative: 灵魂
  rationale: 本节焦点是保罗为完成使命而不顾死亡危险，并非讨论非物质的灵魂；“性命”最符合语境。
- issue: ὡς τελειῶσαι的语气
  choice: 只求能跑完……完成
  alternative: 为要跑完……完成；以致跑完……完成
  rationale: 该结构表达保罗首要而强烈的目标。译作“只求能”既传达其修辞力度，也不把语法关系过度限定为纯粹目的或结果。
- issue: τῆς χάριτος τοῦ θεοῦ的属格关系
  choice: 上帝恩典的福音
  alternative: 关于上帝恩典的福音
  rationale: 直译式的属格表达保留“福音”与“恩典”之间可能兼具内容、来源或特征的关系，避免只确定为“关于”的内容属格。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“性命”“只求能”“跑完我的赛程”便于普通读者理解；“服事”保留受托服务的含义而不引入特定宗派职衔。全句维持原文从个人舍己、完成赛程与服事，到说明服事内容的递进结构。
