  text: διαμαρτυρόμενος Ἰουδαίοις τε καὶ Ἕλλησιν τὴν ⸀εἰς θεὸν μετάνοιαν καὶ ⸀πίστιν εἰς τὸν κύριον ἡμῶν ⸀Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/021.yaml
  text: solemnly testifying to both Jews and Greeks about repentance toward God and faith in our Lord Jesus[a].
translation:
  language: zh_hans
  text: 向犹太人和希腊人郑重作证：人应当向上帝悔改，并信靠我们的主耶稣。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “信靠”也可译作“信”。
    reason: lexical_alternative
lexical_decisions:
- source_word: διαμαρτυρόμενος
  choice: 郑重作证
  rationale: 该词兼有作见证与严肃、恳切申明的意味；“郑重作证”保留了这两层语气。
- source_word: Ἰουδαίοις τε καὶ Ἕλλησιν
  choice: 向犹太人和希腊人
  rationale: 保留路加所用的族群配对，不将Ἕλλησιν泛化译成“外族人”；τε καὶ所表达的兼括范围由“和”自然呈现。
- source_word: μετάνοιαν
  choice: 悔改
  rationale: 在此语境中指人转向上帝的心志与生命方向的改变；“悔改”是现代汉语中准确、凝练且通行的对应词。
- source_word: εἰς θεόν
  choice: 向上帝
  rationale: εἰς表达方向和归向；与“悔改”连用时，“向上帝悔改”自然地呈现以上帝为归向。
- source_word: πίστιν
  choice: 信靠
  rationale: 此处有明确的对象“我们的主耶稣”，所以“信靠”能自然表达将信心置于某人身上的关系性含义；脚注保留较形式对应的“信”。
- source_word: εἰς τὸν κύριον ἡμῶν Ἰησοῦν
  choice: 信靠我们的主耶稣
  rationale: πίστις与εἰς加人物宾语表示指向并置于此对象的信；中文用“信靠”无需另译介词，同时保留“我们的主耶稣”这一称号结构。
- source_word: κύριον
  choice: 主
  rationale: “主”保留κύριος在此处的基督论称号分量，也是新约汉语表达中的自然对应。
theological_decisions:
- issue: πίστις εἰς的译法
  choice: 信靠我们的主耶稣
  alternative: 信我们的主耶稣
  rationale: 这里不是“基督的信/信实”的属格争议，因为耶稣明确是εἰς所引出的信仰对象。“信靠”较清楚呈现信心投向并倚赖耶稣的意思，而脚注保留简洁的形式对应。
- issue: 悔改与信的关系
  choice: 以“并”连接两个并列内容
  alternative: 将后者解释为前者的结果或方式
  rationale: 希腊文以καί并列“向上帝悔改”与“信靠我们的主耶稣”，未明确规定二者的逻辑先后，译文不额外加以解释。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“劝他们”补明两个抽象名词所承载的见证内容，使中文句法完整；不加入原文未明示的神学先后关系。
