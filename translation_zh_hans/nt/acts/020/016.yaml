  text: ⸀κεκρίκει γὰρ ὁ Παῦλος παραπλεῦσαι τὴν Ἔφεσον, ὅπως μὴ γένηται αὐτῷ χρονοτριβῆσαι ἐν τῇ Ἀσίᾳ, ἔσπευδεν γὰρ εἰ δυνατὸν ⸀εἴη αὐτῷ τὴν ἡμέραν τῆς πεντηκοστῆς γενέσθαι εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/016.yaml
  text: For Paul had decided to sail past Ephesus[a], so that he might not have to spend time in Asia; for he was hurrying to be in Jerusalem, if possible[b], on the day of Pentecost.
translation:
  language: zh_hans
  text: 因为保罗已经决定乘船驶过以弗所[a]，免得在亚细亚耽搁；他急着赶路，若可能的话，要在五旬节那天到达耶路撒冷[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“亚细亚”指小亚细亚西部的罗马亚细亚行省，不是现代所说的亚洲。
    reason: cultural_note
  - marker: b
    text: 或译：“到五旬节那天能在耶路撒冷。”希腊语既可强调在那天抵达，也可强调到那天已在那里。
    reason: alternative_reading
lexical_decisions:
- source_word: κεκρίκει
  choice: 已经决定
  rationale: 以“已经决定”体现过去完成时，表明这是保罗在所叙航程之前已经作出的决定。
- source_word: παραπλεῦσαι τὴν Ἔφεσον
  choice: 乘船越过以弗所
  rationale: παραπλέω明确指从海上经过而不停靠；“乘船越过”既保留航海含义，也不误解为进入以弗所。
- source_word: ὅπως μὴ γένηται αὐτῷ χρονοτριβῆσαι
  choice: 免得在……耽搁时间
  rationale: 这一结构表达避免在那里耗费或耽误时间；中文用“免得……耽搁时间”自然简洁。
- source_word: ἐν τῇ Ἀσίᾳ
  choice: 在亚细亚
  rationale: 保留新约时代罗马行省的传统中文专名，并以脚注说明并非现代亚洲。
- source_word: ἔσπευδεν
  choice: 他正赶路
  rationale: 未完成时表示持续进行的急切行动；旅行语境中“正赶路”比单说“急切”更具体自然。
- source_word: εἰ δυνατὸν εἴη αὐτῷ
  choice: 希望可能的话
  rationale: 保留条件性，并与ἔσπευδεν所表达的努力目标自然衔接，不把可能性说成确定结果。
- source_word: τὴν ἡμέραν τῆς πεντηκοστῆς
  choice: 在五旬节那天
  rationale: 直译时间表达，同时采用现代中文圣经读者熟悉的节期名称。
- source_word: γενέσθαι εἰς Ἱεροσόλυμα
  choice: 到达耶路撒冷
  rationale: 该表达可指来到或身在耶路撒冷；正文选用符合行程叙述的“到达”，并以脚注保留“届时身在”的可能理解。
- source_word: Ἱεροσόλυμα
  choice: 耶路撒冷
  rationale: 采用通行的现代中文地名译法。
- source_word: πεντηκοστῆς
  choice: 五旬节
  rationale: 这是新约语境中该犹太节期的通行中文名称。
theological_decisions:
- issue: γενέσθαι εἰς Ἱεροσόλυμα与五旬节日期的关系
  choice: 在五旬节那天到达耶路撒冷
  alternative: 到五旬节那天能在耶路撒冷
  rationale: 希腊语既可突出在该日抵达，也可突出到该日已身在当地；正文按旅行语境译为“到达”，脚注保留另一种可能，避免消除原文歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“亚细亚”保留历史专名并加文化说明；“正赶路，希望可能的话”传达持续的急切和未确定性；正文及脚注共同保留到达日期与届时在场之间的真实歧义。
