base_translation:
  language: en
  yaml_path: translation/nt/acts/020/007.yaml
  text: On the first day of the week[a], when we had gathered to break bread, Paul was speaking to them, intending to depart the next day[b], and he prolonged the message until midnight.
translation:
  language: zh_hans
  text: 一周的第一天，我们聚集擘饼时，保罗与他们讲论；因为第二天就要离开，他把讲论延长到半夜。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 原文“因为第二天就要离开”是分词短语；它可说明保罗延长讲论的缘由，也可较中性地理解为当时的情形。
    reason: syntactical_ambiguity
lexical_decisions:
- source_word: Ἐν δὲ τῇ μιᾷ τῶν σαββάτων
  choice: 一周的第一天
  rationale: 这是通用的希腊语时间习语，指一周的第一天；δὲ仅作轻微衔接，中文无需生硬译出。
- source_word: συνηγμένων ἡμῶν
  choice: 我们聚在一起
  rationale: 属格独立结构交代主要行动发生时的情境，并保留第一人称复数的叙事视角。
- source_word: κλάσαι ἄρτον
  choice: 擘饼
  rationale: 不定式表达聚集的目的。“擘饼”保留原文习语，既不将其限定为普通聚餐，也不直接等同于某种宗派所界定的圣礼。
- source_word: διελέγετο αὐτοῖς
  choice: 与他们讲论
  rationale: 未完成时态表示持续进行；διαλέγομαι含有讲说、交谈或讨论的互动意味，“与他们讲论”比单向的“讲道”更贴近原文。
- source_word: μέλλων ἐξιέναι τῇ ἐπαύριον
  choice: 因为第二天就要离开
  rationale: μέλλω加不定式表达即将发生之事；“就要离开”体现临近性。分词在语境中可作原因性理解，但其句法关系并非毫无歧义，因此附注列出较中性的译法。
- source_word: παρέτεινέν τε τὸν λόγον μέχρι μεσονυκτίου
  choice: 他把话一直讲到半夜
  rationale: παρατείνω表示延长，λόγος在此指所讲的话或讲论；中文用“把话一直讲到”自然表达持续至半夜的意思。
theological_decisions:
- issue: “擘饼”在早期基督徒聚会中的含义
  choice: 保留“擘饼”这一习语
  alternative: 一起用饭；举行主餐
  rationale: 该短语可以指共同用饭，也可能带有主餐意味。正文不把它收窄为单一解释，以保留原文的神学开放性。
- issue: 保罗次日离开与延长讲论之间的关系
  choice: 按语境译出原因关系：“因为第二天就要离开”
  alternative: 用并列或伴随结构表达：“他第二天就要离开，并把话一直讲到半夜”
  rationale: μέλλων是环境分词，可自然理解为解释保罗延长讲论的原因，但原文没有明示因果连词，故以脚注保留较少解释性的可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“讲论”保留互动意味；“擘饼”作为必要的源文习语由脚注说明。分号帮助读者看清聚会背景、保罗讲论及延长至半夜之间的关系。
