  text: Ἡμεῖς δὲ ⸀προελθόντες ⸀ἐπὶ τὸ πλοῖον ἀνήχθημεν ἐπὶ τὴν Ἆσσον, ἐκεῖθεν μέλλοντες ἀναλαμβάνειν τὸν Παῦλον, οὕτως γὰρ ⸂διατεταγμένος ἦν⸃ μέλλων αὐτὸς πεζεύειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/013.yaml
  text: But we[a], having gone ahead to the ship, set sail for Assos, intending to take Paul on board from there, for so he had arranged[b], since he himself intended to go by land.
translation:
  language: zh_hans
  text: 我们先行登船，启航前往亚朔，打算从那里接保罗上船；因为保罗原是这样安排的，他自己打算走陆路前往[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “保罗原是这样安排的”也可译作“原是这样安排好的”。希腊语在形式上是被动语态，未明说由谁安排；按上下文，也很可能是指保罗事先作了这样的安排或吩咐。“走陆路前往”也可译作“步行前往”；原文这个动词在这里特意与同行者乘船前往形成对照。
    reason: alternative_reading; lexical_alternative
lexical_decisions:
- source_word: προελθόντες
  choice: 先到
  rationale: 不定过去时分词表示先于主要动作发生，且带有叙述者一行先行、与保罗分开的意味；“先到”自然简洁。
- source_word: ἐπὶ τὸ πλοῖον
  choice: 到船上
  rationale: ἐπί与趋向动作连用可表示登上、到船上；此译明确表达登船。
- source_word: ἀνήχθημεν
  choice: 启航
  rationale: ἀνάγω在航海语境中指驶离岸边、出海；“启航”符合现代汉语旅行叙事。
- source_word: ἐπὶ τὴν Ἆσσον
  choice: 前往亚朔
  rationale: 表示航行目的地；“亚朔”采用通行的中文圣经地名译法。
- source_word: μέλλοντες ἀναλαμβάνειν
  choice: 打算……接……上船
  rationale: μέλλω在此表达计划或意图；ἀναλαμβάνω结合航海语境指把某人接上船。
- source_word: ἐκεῖθεν
  choice: 在那里
  rationale: 该副词本可有“从那里”的离格意味；汉语说“在那里接某人上船”更自然，也清楚表明登船地点。
- source_word: διατεταγμένος ἦν
  choice: 保罗原是这样安排的
  rationale: 这是διατάσσω的迂回式过去完成被动结构；上下文很可能以保罗为相关主体，译文表达他事先作出的安排，同时以脚注保留形式上的被动可能。
- source_word: μέλλων αὐτὸς πεζεύειν
  choice: 因为他自己打算步行前往
  rationale: πεζεύω指徒步或走陆路，与同行者乘船形成对照；αὐτός带强调意味，故译“他自己”。分词在此说明前述安排的原因。
- source_word: δὲ
  choice: （不另译）
  rationale: δέ在此标示叙事推进并轻微对比“我们”与保罗；汉语通过“我们先……”以及后句转到保罗，已自然体现这种关系，若硬译“但是”反显生硬。
theological_decisions:
- issue: διατεταγμένος ἦν的施事与语态
  choice: 正文译作“保罗原是这样安排的”
  alternative: “原是这样安排好的”
  rationale: 上下文紧接着说明保罗自己的出行意图，因此把安排归于保罗最为连贯；但希腊语形式为被动，未明说施事，故脚注保留非人称被动理解，不把含义绝对化。
translation_notes:
  register: 采用自然、庄重的现代标准汉语，以短句清楚呈现旅行次序。“启航”“接……上船”保留航海场景；“原是”表达先前已经作出的安排。正文不强行复制希腊语分词结构，而保留其时间、目的和原因关系。
