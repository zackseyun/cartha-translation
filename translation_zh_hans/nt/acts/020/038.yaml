revisions:
- from: 他们尤其因他所说的那句话而悲痛[a]，就是他们将不再见到他的面[b]。随后，他们陪送他到船上[c]。
  to: 他们尤其因他所说的那句话而悲痛[a]：他们将不再见到他的面容[b]。他们陪送他到船边[c]。
  rationale: 修订使内容从句在汉语中更清晰，将不自然的“他的面”调整为“他的面容”，并将“到船上”收敛为不额外断定送行者登船的“到船边”。其余内容、语气和原文的未来预期均予保留。
