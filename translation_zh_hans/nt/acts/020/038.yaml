  text: ὀδυνώμενοι μάλιστα ἐπὶ τῷ λόγῳ ᾧ εἰρήκει ὅτι οὐκέτι μέλλουσιν τὸ πρόσωπον αὐτοῦ θεωρεῖν. προέπεμπον δὲ αὐτὸν εἰς τὸ πλοῖον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/038.yaml
  text: grieving especially over the word that he had spoken[a], that they would no longer see his face[d][c][b]. And they were accompanying him to the ship.
translation:
  language: zh_hans
  text: 他们尤其因他所说的那句话而悲痛[a]：他们将不再见到他的面容[b]。他们陪送他到船边[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文较直译作“因他所说的话”；也可译作“因为他所说的话”。
    reason: lexical_alternative
  - marker: b
    text: 直译作“将不再看见他的脸（面）”；这是表示以后不能再相见的亲切说法。
    reason: lexical_alternative
  - marker: c
    text: “陪送”也可译作“护送”或“为他送行”；原词可表示陪同某人走一程，以示敬重和告别。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀδυνώμενοι
  choice: 悲痛
  rationale: 该词表示内心的痛苦、忧伤；“悲痛”符合离别语境，也保留了原文较强的情感色彩。
- source_word: μάλιστα
  choice: 尤其
  rationale: 表明使他们悲痛的首要原因，现代汉语中简洁自然。
- source_word: ἐπὶ τῷ λόγῳ ᾧ εἰρήκει
  choice: 因他所说的那句话
  rationale: 既保留 λόγος 的名词形式和关系从句，又以自然汉语表达其原因意味。
- source_word: οὐκέτι μέλλουσιν
  choice: 将不再
  rationale: μέλλω 在此表达从当时视角所预期的将来，οὐκέτι 表示“不再”；“将不再”自然地兼顾两者，不强化为“永远不会”。
- source_word: τὸ πρόσωπον αὐτοῦ θεωρεῖν
  choice: 见到他的面
  rationale: 保留原文“他的面”这一富有人际情感的具体表达；“见到”适合此处 θεωρέω 的一般视觉意义。
- source_word: προέπεμπον
  choice: 陪送
  rationale: 该动词可指陪同、护送或送行；“陪送”兼有陪伴前往和郑重送别之意，并适合未完成时所描写的行动。
- source_word: εἰς τὸ πλοῖον
  choice: 到船上
  rationale: 在“陪送”之后，“到船上”自然表达目的地；πλοῖον 在此海行语境中可概括译作“船”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“那句话”承接前文保罗关于今后不能再相见的宣告；“见到他的面”保留原文具体而富有感情的表达。“随后”用于顺接末句的叙事推进，不赋予 δέ 过强的转折意味。
