  text: There were many lamps in the upper room where we were gathered[a].
translation:
  language: zh_hans
  text: 我们聚集的那间楼上房间里有许多灯[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“火把”。希腊语这个词也可泛指可携带的照明物，但在室内的语境中，“灯”更为可能。
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: 不单独译出
  rationale: δέ在这里是轻微的叙事连接词；中文承接上下文时无需另加“现在”或“但是”，以免引入原文没有的时间或转折意味。
- source_word: λαμπάδες
  choice: 灯
  rationale: λαμπάς可指灯或火把；室内楼房的语境更可能指照明用的灯，但以脚注保留“火把”这一词义可能。
- source_word: ἱκαναὶ
  choice: 许多
  rationale: 这里形容灯的数量相当多；“许多”自然地表达数量意义，不误译成表示够用的“足够”。
- source_word: ἐν τῷ ὑπερῴῳ
  choice: 那间楼上的房间里
  rationale: ὑπερῷον指房屋上层的房间；此译法是自然、明确的现代汉语，并保留具体地点。
- source_word: οὗ
  choice: ……的那间
  rationale: 将地点关系从句整合为中文定语结构，清楚表达“我们聚集之处”就是这间楼上的房间。
- source_word: ἦμεν συνηγμένοι
  choice: 我们聚集
  rationale: 完成时被动分词与未完成时系词共同描写众人已经聚到一起并处于聚集状态；中文“我们聚集”简洁自然，且保留第一人称复数见证者视角。
- source_word: ἦσαν
  choice: 点着
  rationale: 原文直译为“有许多灯”；在室内叙事中，中文说“点着许多灯”更自然，也表达这些灯作为光源存在于现场，但不额外说明其用途。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通俗的叙事语言。“楼上的房间”比“楼房”或较古雅的“楼上房间/楼厅”更明确自然；调整语序以符合汉语信息结构，同时保留“我们”的第一人称叙述。
