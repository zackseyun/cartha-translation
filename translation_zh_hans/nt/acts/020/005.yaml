base_translation:
  language: en
  yaml_path: translation/nt/acts/020/005.yaml
  text: These men went on ahead and were waiting for us in Troas[a].
translation:
  language: zh_hans
  text: 这些人先行，在特罗亚等候我们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较为直译：“这些人先行后，在特罗亚等候我们。”
    reason: 词汇及句法的直译备选，体现希腊文分词προσελθόντες先于主要动作发生。
lexical_decisions:
- source_word: οὗτοι
  choice: 这些人
  rationale: 阳性复数指示代词，回指前文所列的同行者；译作“这些人”既明确所指，也符合现代汉语表达。
- source_word: δὲ
  choice: 不单独译出
  rationale: δέ在此是轻微的衔接词；汉语无须加“但”或“而”，句意仍衔接自然，且可避免赋予不必要的转折意味。
- source_word: προσελθόντες
  choice: 先行
  rationale: 在本段旅行叙事中，该分词表示这些人走在叙述者一行前面；“先行”简洁保留先发生的动作，并与随后等候他们相呼应。
- source_word: ἔμενον
  choice: 等候
  rationale: μένω的基本义是“停留、留下”，但在这里带人称宾语ἡμᾶς，并处于旅行语境中，意为留下等待他们抵达；“等候”自然传达未完成时所描述的持续状态。
- source_word: ἡμᾶς
  choice: 我们
  rationale: 第一人称复数宾格代词，直接译为“我们”。
- source_word: ἐν Τρῳάδι
  choice: 在特罗亚
  rationale: ἐν加地名与格表示地点；“在特罗亚”是自然、准确的现代汉语表达。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而简明的现代标准汉语。“先行”比“先走一步”更适合经文语体；“等候”清楚表达旅行语境中的持续等待。脚注标记已置于正文相应位置。
