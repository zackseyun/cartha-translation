  text: ἀναβὰς δὲ καὶ κλάσας ⸀τὸν ἄρτον καὶ γευσάμενος ἐφ’ ἱκανόν τε ὁμιλήσας ἄχρι αὐγῆς, οὕτως ἐξῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/011.yaml
  text: Then he went upstairs[a], broke the bread, and ate; and after talking for a long time, until dawn[b], he departed.
translation:
  language: zh_hans
  text: 随后，保罗上了楼，掰开饼[a]，吃了[b]；他谈了许久，直到天亮，才离去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “掰开饼”也可理解为一起用餐；有人认为这里也包括主的晚餐。
    reason: alternative_reading
  - marker: b
    text: “吃了”原文也可译作“尝了”或“进食”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναβὰς
  choice: 上了楼
  rationale: 该词表示向上移动；结合上下文，保罗先前下楼，此处是回到楼上的聚会处。“上了楼”符合现代汉语叙事习惯，又不额外明说原文未明示的“回去”。
- source_word: κλάσας τὸν ἄρτον
  choice: 掰开饼
  rationale: 直译具体动作及带冠词的“饼”，同时不把这个短语直接解释为普通聚餐或主餐，保留其可能含义。
- source_word: γευσάμενος
  choice: 吃了
  rationale: 该词本义可指“尝”，在用餐语境中也常指吃或进食。“吃了”自然地表达此处含义，脚注保留其较字面的译法。
- source_word: ἐφ’ ἱκανόν
  choice: 许久
  rationale: 该习语表示相当长的一段时间；“许久”简洁、自然，并符合叙事语体。
- source_word: ὁμιλήσας
  choice: 谈了
  rationale: 该词在这里指交谈或长时间讲话。“谈了”既可涵盖交谈，也不把场景限定为正式讲道。
- source_word: ἄχρι αὐγῆς
  choice: 直到天亮
  rationale: 准确表达持续到黎明或破晓，且为现代汉语常用说法。
- source_word: οὕτως ἐξῆλθεν
  choice: 才离去
  rationale: “离去”表达ἐξῆλθεν的叙事结果；“才”承接此前直到天亮的一连串行动，自然体现 οὕτως 的顺承总结作用，但不生硬直译为“就这样”。
theological_decisions:
- issue: κλάσας τὸν ἄρτον是否应明确译为主餐
  choice: 正文中性地译为“掰开饼”，不作圣礼性质的明确说明。
  alternative: 可理解为一起用餐，也有人理解为其中包括主餐。
  rationale: 《使徒行传》中的这一表达可能带有主餐含义，但本节本身不足以排除普通共同用餐。中性译法保留原文的神学张力。
translation_notes:
  register: 采用现代、庄重而自然的叙事汉语。为避免代词指向在单节引用时不清楚，以“保罗”承接上下文中的主语；分号保留动作序列与随后长谈之间的节奏。脚注标记依其实际所注释的词语分别置于“饼”和“吃了”之后。
