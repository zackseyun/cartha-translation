  text: From Miletus he sent to Ephesus and called for the elders of the church[a].
translation:
  language: zh_hans
  text: 保罗从米利都派人到以弗所，请教会的长老们到他那里来[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“派人请教会的长老们来。”原文把“派人到以弗所”和“召来”结合起来，意思是他派人传话，请长老们到他那里去。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ δὲ τῆς Μιλήτου
  choice: 保罗从米利都
  rationale: ἀπό加属格表示出发地点，译为“从米利都”。δέ是轻微的承接词，中文不必生硬明译；依据上下文补出主语“保罗”，使本节独立阅读时自然清楚。
- source_word: πέμψας εἰς Ἔφεσον
  choice: 派人到以弗所
  rationale: πέμψας是修饰主句动词的简过去分词，表示先行或伴随的差遣行动；原文未明说所派的是人还是信息，但语境表明是借人传召。译作“派人到”符合现代汉语，并保留目的地。
- source_word: μετεκαλέσατο
  choice: 请……来
  rationale: 该中动态动词表示召人到自己这里来，即“派人请来、召来”。“请……来”自然表达保罗要求长老前来，也避免“命令召见”可能带出的强制色彩。
- source_word: τοὺς πρεσβυτέρους
  choice: 长老
  rationale: 这里指以弗所教会中受认可的带领者，而不只是年长男子；“长老”是准确且通行的译法，也不预设后世特定宗派体制。
- source_word: τῆς ἐκκλησίας
  choice: 教会的
  rationale: ἐκκλησία在使徒行传的语境中指基督徒群体；“教会”是现代中文最自然、稳定的对应词。
theological_decisions:
- issue: πρεσβυτέρους在教会语境中的含义
  choice: 译为作为教会带领者的“长老”
  alternative: 译为“年长的人”或音译性质较强的“司铎”
  rationale: 上下文显示保罗所召的是以弗所教会受认可的领袖。译作“长老”保留原词及早期教会语境，同时不把后世任何特定宗派的职制强加于经文。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“请……来”清楚表达召到保罗所在之处；脚注说明希腊文句法以及可行的另一种中文组织方式。
