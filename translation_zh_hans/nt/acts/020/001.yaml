id: ACT.20.1
reference: Acts 20:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Μετὰ δὲ τὸ παύσασθαι τὸν θόρυβον ⸀μεταπεμψάμενος ὁ Παῦλος τοὺς μαθητὰς καὶ ⸀παρακαλέσας, ἀσπασάμενος ἐξῆλθεν ⸀πορεύεσθαι ⸀εἰς Μακεδονίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/001.yaml
  text: After the uproar had ceased[a], Paul sent for the disciples, and after encouraging them and saying farewell, he departed to go to Macedonia.
translation:
  language: zh_hans
  text: 骚乱平息以后，保罗请门徒来，劝勉了他们，又向他们告别[a]，就动身前往马其顿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“向他们问安”。希腊语这个词既可指问候，也可在离别的语境中指辞别。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ τὸ παύσασθαι τὸν θόρυβον
  choice: 骚乱平息以后
  rationale: μετά加冠词化不定式表示时间上的先后；“骚乱”准确体现以弗所事件中θόρυβος所指的公众骚动，“平息以后”自然表达事件结束后才发生下文。
- source_word: μεταπεμψάμενος
  choice: 请……来
  rationale: 该中间语态分词指派人把某人叫到自己这里；“请门徒来”符合现代汉语表达，也比单纯“召集”更能保留派人去请的意味。
- source_word: τοὺς μαθητὰς
  choice: 门徒
  rationale: 保留路加在《使徒行传》中对耶稣跟随者的惯用称呼，不泛化为“信徒”。
- source_word: παρακαλέσας
  choice: 劝勉了
  rationale: παρακαλέω可涵盖劝导、鼓励和安慰；“劝勉”在此告别及骚乱后的语境中保留其较宽的扶持、坚固之意。
- source_word: ἀσπασάμενος
  choice: 向他们告别
  rationale: ἀσπάζομαι通常可指问候，但在即将离开的语境中可表示辞别；正文采用符合叙事情境的“告别”，并以脚注保留词义上的另一可能。
- source_word: ἐξῆλθεν πορεύεσθαι εἰς Μακεδονίαν
  choice: 就动身前往马其顿
  rationale: ἐξέρχομαι在旅行叙事中表示离开、启程，后接πορεύεσθαι及目的地；“动身前往”简洁自然地呈现出发和行程目的。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准普通话。句序基本顺随希腊文的时间与动作推进；将脚注标记置于其实际说明的“告别”之后，以免误指“骚乱平息”。
