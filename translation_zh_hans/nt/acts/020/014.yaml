  text: ὡς δὲ ⸀συνέβαλλεν ἡμῖν εἰς τὴν Ἆσσον, ἀναλαβόντες αὐτὸν ἤλθομεν εἰς Μιτυλήνην,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/014.yaml
  text: And when he met us at Assos[a], we took him on board and came to Mitylene.
translation:
  language: zh_hans
  text: 他在亚朔[a]与我们会合后，我们接他上船，来到米推利尼。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在亚朔与我们相遇”，也可译“到亚朔来同我们会合”。希腊语动词可表示相遇或聚到一起；这里是说保罗在那里重新加入同行的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: συνέβαλλεν
  choice: 与我们会合
  rationale: 该动词在此旅行叙事中表示保罗与同行的人相遇、重新会合。“会合”自然传达双方聚到一起的意思，同时不把它过度解释为事先约定见面。
- source_word: ἡμῖν
  choice: 与我们
  rationale: 与 συνέβαλλεν 连用，指乘船同行的叙事者一行人；汉语自然表达为“与我们”。
- source_word: εἰς τὴν Ἆσσον
  choice: 在亚朔
  rationale: εἰς 通常表示趋向，但在会合这一语境中，目的地同时是会合地点，现代汉语用“在亚朔”最自然。
- source_word: ἀναλαβόντες
  choice: 接他上船
  rationale: 上下文是海上行程，该分词表示同行者把保罗接到船上；“接他上船”清楚表达语境隐含的信息。
- source_word: αὐτόν
  choice: 他
  rationale: 所指是上文的保罗，使用代词即可自然衔接。
- source_word: ἤλθομεν
  choice: 来到
  rationale: 该不定过去时陈述一行人到达下一地点；“来到”符合汉语旅行叙事，也不额外强化抵达本身。
- source_word: εἰς Μιτυλήνην
  choice: 米推利尼
  rationale: 作为 ἤλθομεν 的目的地，合译为“来到米推利尼”；采用现代中文音译地名。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而清楚的现代标准汉语。“接他上船”依据航海上下文适度明示隐含信息；脚注保留 συνέβαλλεν 在“相遇”与“会合”之间的词义幅度。
