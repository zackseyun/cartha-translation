  text: καὶ ἐξ ὑμῶν αὐτῶν ἀναστήσονται ἄνδρες λαλοῦντες διεστραμμένα τοῦ ἀποσπᾶν τοὺς μαθητὰς ὀπίσω ⸀ἑαυτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/030.yaml
  text: and from among your own selves men will arise[a], speaking twisted things, to draw away the disciples after themselves.
translation:
  language: zh_hans
  text: 从你们自己中间，也会有人起来，说歪曲的话[a]，要把门徒拉走，使他们跟从自己。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“说悖谬的话”或“说扭曲的话”。
    reason: διεστραμμένα指被扭曲、乖谬或偏离正直的事物；脚注保留自然的词义表达范围。
lexical_decisions:
- source_word: ἐξ ὑμῶν αὐτῶν
  choice: 你们自己中间
  rationale: 保留ἐξ与强调性的αὐτῶν所表达的内部来源，突出危险将从以弗所群体自身出现。
- source_word: ἀναστήσονται
  choice: 必有人起来
  rationale: 此处ἀνίστημι为将来时，表示有人将兴起或出现；“必有人起来”自然地保留预告语气。
- source_word: ἄνδρες
  choice: 有人
  rationale: 希腊文ἄνδρες为阳性复数，语境指将兴起的男子；汉语“有人”与后文所指相连，表达自然，并未把范围扩展为所有人。
- source_word: λαλοῦντες
  choice: 说
  rationale: 直接表达分词所描述的言语活动；汉语无需机械保留进行体。
- source_word: διεστραμμένα
  choice: 歪曲真理的话
  rationale: 该中性复数分词实词化，指被扭曲、偏离正直真实的内容。“歪曲真理的话”在现代汉语中清楚自然，但“真理”为语境性补明，因此列出脚注中的较形式对应译法。
- source_word: τοῦ ἀποσπᾶν
  choice: 要把……拉走
  rationale: 保留τοῦ加不定式的目的意义，也保留ἀποσπάω所含从原处拉开、使之分离的形象。
- source_word: τοὺς μαθητὰς
  choice: 门徒
  rationale: “门徒”是《使徒行传》中μαθηταί的稳定对应词，指耶稣的跟从者。
- source_word: ὀπίσω ἑαυτῶν
  choice: 使他们跟从自己
  rationale: 该习语表示跟随与效忠，而非单纯处于身后；此译清楚传达这些人意图建立个人追随群体。
theological_decisions:
- issue: 错误教师言论的性质
  choice: 说歪曲真理的话
  alternative: 说歪曲的话；说悖谬的话；说扭曲的话
  rationale: 原文未指明某一种具体异端，而是广泛描述偏离、扭曲的言论；正文保持这种广度，不将其限定为某一教义争论。
- issue: ἄνδρες的性别表达
  choice: 有人起来
  alternative: 有男人起来；有些人兴起
  rationale: 原词为阳性复数；但现代汉语在此用“男人”会产生不自然且过度凸显性别的效果。“有人”按具体语境承接原文所指，不据此建立超出经文的性别主张。
- issue: 个人追随的目的
  choice: 使他们跟从自己
  alternative: 跟在他们后面
  rationale: ὀπίσω ἑαυτῶν在此关乎归附和追随。译文明确其目的，同时不进一步断定这些人具体采用何种手段。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“就是……也……”承接上下文并加强内部危险的语气；“拉走”保留原文的分离意象，“使他们跟从自己”则自然表达希腊语习语。脚注标记[a]已置于对应短语之后。
