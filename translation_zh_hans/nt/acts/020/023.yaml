base_translation:
  language: en
  yaml_path: translation/nt/acts/020/023.yaml
  text: except that the Holy Spirit testifies to me in city after city[c][b][a], saying that chains and afflictions await me.
translation:
  language: zh_hans
  text: 不过，圣灵在一座又一座城里向我郑重作证[a]，说捆锁[b]和患难正等着我[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在一座又一座城里”也可译作“逐城”或“在各城”。希腊语表达的是随着所到城市而反复发生的见证。
    reason: lexical_alternative
  - marker: b
    text: “捆锁”也可译作“锁链”或“束缚”，具体指向遭拘禁的处境。
    reason: lexical_alternative
  - marker: c
    text: 有些抄本在“我”一词的位置或有无方面略有差异，但整体意思仍是捆锁和患难正在等着保罗。
    reason: textual_variant
lexical_decisions:
- source_word: πλὴν ὅτι
  choice: 不过
  rationale: 承接上一节并引出唯一的限制或转折；现代汉语中“不过”自然、简洁，也保留了原文的转折限定作用。
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: 圣灵
  rationale: 现代中文圣经语体中对这一定指短语的标准译法。
- source_word: κατὰ πόλιν
  choice: 在一座又一座城里
  rationale: κατά加单数名词具有逐处分配的含义；此译法表达在接连不同城市中反复发生，又不把范围强化为毫无例外的“每一座城”。
- source_word: διαμαρτύρεταί μοι
  choice: 向我郑重作证
  rationale: διαμαρτύρομαι带有郑重见证、明确申明之意；“作证”保留见证语义，“郑重”反映其加强色彩，且不将其缩窄为“警告”。
- source_word: λέγον
  choice: 说
  rationale: 直接引出圣灵所作见证的内容，符合现代汉语表达。
- source_word: δεσμὰ
  choice: 捆锁
  rationale: 保留原词所指锁链、束缚的具体意象，同时可自然指向被拘禁的处境。
- source_word: θλίψεις
  choice: 患难
  rationale: 表达压力、困苦与苦难，庄重而通俗，且不把含义局限为一般的“麻烦”。
- source_word: με
  choice: 我
  rationale: 按SBLGNT正文，将第一人称宾格理解为“捆锁和患难”等候的对象。
- source_word: μένουσιν
  choice: 正等着
  rationale: 在此表示某些事已在前面等候、将临到保罗；“正等着”自然地传达这种前瞻性和确定感。
theological_decisions:
- issue: “圣灵”的施事性质
  choice: 将圣灵译为主动向保罗郑重作证并说话的施事者
  alternative: 理解为非人格性的属灵影响
  rationale: 原文以“作证”和“说”描述圣灵，语法和叙述均呈现主动施事，不需在译文中额外加入超出本节的神学说明。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“郑重作证”保留原文动词的加强语气；“在一座又一座城里”呈现逐地反复的分配意义；“捆锁和患难”兼顾具体意象与传统经文语感。
