base_translation:
  language: en
  yaml_path: translation/nt/acts/020/015.yaml
  text: And from there[a], after setting sail, on the next day we came opposite Chios; on the following day we touched at Samos[b]; and on the day after that we came to Miletus.
translation:
  language: zh_hans
  text: 我们从那里开船，第二天来到基奥岛对面[a]；又过一天，我们在萨摩斯岛停靠[b]；再过一天，我们来到米利都。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在基奥岛对面”或“在基奥岛外海”。原文表示船到了与该岛相对的位置，不一定曾在那里靠岸。
    reason: lexical_alternative
  - marker: b
    text: 或译“在萨摩斯岛靠岸”。这里的动词是航海用语，可指把船靠近岸边或途中停靠。
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: 我们从那里
  rationale: κἀκεῖθεν 是 καί 与 ἐκεῖθεν 的缩合；中文以承接上下文的语序表达其连接和出发点，无须机械译出“并且”。
- source_word: ἀποπλεύσαντες
  choice: 开船
  rationale: 该不定过去时分词表示先于主句动作发生的启航行动；“开船”自然简明，并保留航海语境。
- source_word: τῇ ἐπιούσῃ
  choice: 第二天
  rationale: 这是表示时间的与格结构，指启航后的次日。
- source_word: κατηντήσαμεν ἄντικρυς Χίου
  choice: 来到基奥岛对面
  rationale: καταντάω 在旅行叙事中表示抵达；ἄντικρυς 指处于岛的对面或近海相对位置，并不表明登岛。
- source_word: τῇ δὲ ἑτέρᾳ
  choice: 又过一天
  rationale: 该表达推进逐日行程；此译法符合现代汉语叙事，也避免连续重复“第二天”。
- source_word: παρεβάλομεν εἰς Σάμον
  choice: 我们停靠萨摩斯岛
  rationale: παραβάλλω 在航海语境中可指船靠近、靠岸或途中停泊；“停靠”保留其航海含义，却不额外断定停留时长。
- source_word: τῇ δὲ ἐχομένῃ
  choice: 再过一天
  rationale: 该省略名词的分词结构表示紧接着的下一日；“再过一天”清楚呈现连续三日的行程。
- source_word: ἤλθομεν εἰς Μίλητον
  choice: 我们来到米利都
  rationale: ἔρχομαι 与 εἰς 组成普通的到达目的地表达；“来到”自然贴合行程叙事。
- source_word: Χίου / Σάμον / Μίλητον
  choice: 基奥岛／萨摩斯岛／米利都
  rationale: 采用现代中文圣经地名中清楚易懂的音译；对基奥和萨摩斯加“岛”，明确原文地理所指，米利都则为城市。
theological_decisions: []
