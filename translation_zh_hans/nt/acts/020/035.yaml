source:
  edition: SBLGNT
  text: πάντα ὑπέδειξα ὑμῖν ὅτι οὕτως κοπιῶντας δεῖ ἀντιλαμβάνεσθαι τῶν ἀσθενούντων, μνημονεύειν τε τῶν λόγων τοῦ κυρίου Ἰησοῦ ὅτι αὐτὸς εἶπεν Μακάριόν ἐστιν μᾶλλον διδόναι ἢ λαμβάνειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/035.yaml
  text: In everything I showed you that by laboring in this way it is necessary to help the weak[a], and to remember the words of the Lord Jesus, that he himself said, ‘It is more blessed to give than to receive.’
translation:
  language: zh_hans
  text: 我在各方面都向你们作了示范：必须这样劳苦，来扶助软弱的人[a]，也要记住主耶稣的话；他亲自说过：‘施比受更有福。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“支持软弱的人”。原文动词可以指持续地扶持，不只是一次性的帮助。
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: 凡事
  rationale: 在此作副词性理解，修饰“作了示范”，表达保罗在各方面、凡事上的榜样。
- source_word: ὑπέδειξα
  choice: 给你们作了示范
  rationale: 该词既可指“指明”，也可指以行动“示范”；上下文谈保罗亲手劳作，因此译出榜样意味。
- source_word: οὕτως κοπιῶντας
  choice: 这样辛劳
  rationale: οὕτως回指保罗刚才所述的劳作方式；κοπιάω强调辛苦、竭力劳作，不淡化为一般的“工作”。
- source_word: δεῖ
  choice: 必须
  rationale: 保留该词所表达的必要性和责任感，同时使现代汉语简洁自然。
- source_word: ἀντιλαμβάνεσθαι
  choice: 扶助
  rationale: 既表达给予帮助，也可体现扶持、支持的持续意味，比单纯“帮助”更贴近该中动词在此处的语义。
- source_word: τῶν ἀσθενούντων
  choice: 软弱的人
  rationale: 保留ἀσθενέω的宽泛含义，不限定为贫穷、患病或灵性软弱。
- source_word: μνημονεύειν τε
  choice: 也要记住
  rationale: τε将此不定式与前面的责任并列；“也要”自然表达其协调关系。
- source_word: τῶν λόγων τοῦ κυρίου Ἰησοῦ
  choice: 主耶稣的话
  rationale: λόγοι在此指耶稣所说的话；κύριος按其称号译为“主”。
- source_word: αὐτὸς εἶπεν
  choice: 他亲自说过的
  rationale: “亲自”保留αὐτός的强调，突出这句话出自主耶稣本人。
- source_word: Μακάριόν ἐστιν μᾶλλον διδόναι ἢ λαμβάνειν
  choice: 施比受更有福
  rationale: 采用简洁、庄重且在现代汉语中易懂的对偶表达；“更有福”准确保留比较结构及μακάριος的福分含义。
theological_decisions:
- issue: “软弱的人”的范围
  choice: 保留为宽泛的“软弱的人”
  alternative: 穷人／病人／信心软弱的人
  rationale: 原文τῶν ἀσθενούντων本身没有限定软弱的具体类别；上下文虽涉及劳作与供给，却不足以把它专指贫穷、疾病或灵性状况。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“作了示范”体现保罗以自身劳作为榜样；“扶助”兼顾清晰度与持续支持的语义；引语采用凝练对偶句式。
