  text: And they took the boy away alive[a], and were not a little comforted.
translation:
  language: zh_hans
  text: 他们把那少年活着带走了，并且大受安慰。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“并非适度地受到安慰”，是一种以否定表达强烈肯定的说法，意思是“受到极大的安慰”。
    reason: 说明οὐ μετρίως的否定式强调修辞，并保留παρεκλήθησαν的被动意义。
lexical_decisions:
- source_word: ἤγαγον
  choice: 带走了
  rationale: ἄγω可指领、带或带走；这里指众人将已经恢复生命的孩子带离现场。“带走了”符合上下文，也不额外说明目的地。
- source_word: παῖδα
  choice: 孩子
  rationale: παῖς可指孩子、少年或仆人。这里回指犹推古，并无仆役之意；“孩子”自然保留其年龄较轻的意味。
- source_word: ζῶντα
  choice: 活着
  rationale: 该分词作宾语补足语，说明众人带走他时他的状态；“活着”直接体现他已不再处于死亡状态。
- source_word: παρεκλήθησαν
  choice: 深感安慰
  rationale: παρακαλέω可表示鼓励、劝勉或安慰；鉴于众人刚经历犹推古坠楼及恢复生命之事，此处以“安慰”最合语境。
- source_word: οὐ μετρίως
  choice: 深感
  rationale: 该否定式委婉强调程度，字面近于“并非一般地”，实际表示极其、非常；“深感”以自然现代汉语传达其强调语气，脚注保留原文修辞。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“把……活着带走了”清楚呈现宾语当时的状态；“深感安慰”避免生硬照译，同时借脚注保留原文的否定式强调。
