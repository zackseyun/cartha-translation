  text: διὸ γρηγορεῖτε, μνημονεύοντες ὅτι τριετίαν νύκτα καὶ ἡμέραν οὐκ ἐπαυσάμην μετὰ δακρύων νουθετῶν ἕνα ἕκαστον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/031.yaml
  text: Therefore stay alert[a], remembering that for three years, night and day, I did not stop admonishing each one with tears.
translation:
  language: zh_hans
  text: 所以，你们要警醒，记住：三年之久，我昼夜不停地流着泪劝诫[a]每一个人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “劝诫”也可译作“警告”；希腊文这个词既可指带有纠正意味的警告，也可指规劝教导。
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: 所以
  rationale: 承接上文的警告并引出结论；“所以”自然清楚地保留推论关系。
- source_word: γρηγορεῖτε
  choice: 要警醒
  rationale: 现在时命令语气要求持续保持警觉；“警醒”既自然，又保留守望防备的意味。
- source_word: μνημονεύοντες
  choice: 记住
  rationale: 分词说明警醒时相伴的行动，也可能带有借着记念而警醒的意味；汉语用并列祈使表达较自然。
- source_word: τριετίαν
  choice: 三年来
  rationale: 表达时间延续范围，符合现代汉语习惯。
- source_word: νύκτα καὶ ἡμέραν
  choice: 昼夜
  rationale: 简洁自然地表达持续不断，并保留原文“夜与日”的整体意义。
- source_word: οὐκ ἐπαυσάμην
  choice: 不停地
  rationale: 准确表达保罗从未停止这一行动，现代汉语流畅。
- source_word: μετὰ δακρύων
  choice: 流着泪
  rationale: 将眼泪伴随其劝诫行动的情感力度自然呈现出来。
- source_word: νουθετῶν
  choice: 劝诫
  rationale: 兼含教导、规劝和纠正性警告，比单用“教导”或“警告”更能保留其牧养语义。
- source_word: ἕνα ἕκαστον
  choice: 每一个人
  rationale: 保留原文对逐一个别关怀的强调，不额外补入原文未明说的“你们中”。
theological_decisions:
- issue: νουθετῶν 的牧养与纠正意味
  choice: 劝诫
  alternative: 警告；教导
  rationale: “劝诫”兼顾关怀性的规劝与纠正性的提醒，避免把原文缩窄为单纯警告或一般知识传授。
- issue: μνημονεύοντες 与主命令的关系
  choice: 用“记住”与“要警醒”相接
  alternative: 译作“要借着记念……保持警醒”
  rationale: 原文分词可表达伴随方式或手段；正文保留较宽泛的连接，不强行限定为唯一的逻辑关系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“警醒”保留经文的守望意味；“劝诫”兼顾牧养关怀与纠正力度。脚注标记置于全句末，说明核心词义的可选译法。
