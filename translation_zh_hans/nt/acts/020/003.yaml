source:
  edition: SBLGNT
  text: ποιήσας τε μῆνας τρεῖς· γενομένης ⸂ἐπιβουλῆς αὐτῷ⸃ ὑπὸ τῶν Ἰουδαίων μέλλοντι ἀνάγεσθαι εἰς τὴν Συρίαν ἐγένετο ⸀γνώμης τοῦ ὑποστρέφειν διὰ Μακεδονίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/003.yaml
  text: After spending three months there[a], when a plot was made against him by the Jews as he was about to sail for Syria[d][c][b], he decided to return through Macedonia.
translation:
  language: zh_hans
  text: 他在那里[a]住了三个月。正要乘船前往叙利亚时，犹太人[b]设下计谋要害他[c]，他就决定取道马其顿返回[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在那里”是根据上一节保罗身在希腊的语境补出的；原文直译为“住了三个月”。
    reason: contextual_supplied_word
  - marker: b
    text: 这里的“犹太人”按上下文指参与谋害保罗的那群犹太人，并不是不加区别地指所有犹太人。
    reason: cultural_note
  - marker: c
    text: 或译：“有人策划阴谋要害他。”
    reason: lexical_alternative
  - marker: d
    text: “取道马其顿返回”也可译作“经马其顿回去”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσας τε μῆνας τρεῖς
  choice: 住了三个月
  rationale: ποιέω与时间长度连用，表示度过一段时间；结合上一节保罗身在希腊的语境，译作“住了三个月”自然清楚。
- source_word: γενομένης ἐπιβουλῆς αὐτῷ
  choice: 设下计谋要害他
  rationale: ἐπιβουλή指针对某人的敌对阴谋；此译在现代汉语中明确表达其恶意和对象，同时保留事件发生的情境关系。
- source_word: ὑπὸ τῶν Ἰουδαίων
  choice: 犹太人
  rationale: 原文明确使用带定冠词的复数“犹太人”，正文不擅自改成“犹太人的反对者”或“一些犹太人”；其语境所指另以脚注说明。
- source_word: μέλλοντι ἀνάγεσθαι εἰς τὴν Συρίαν
  choice: 正要乘船前往叙利亚时
  rationale: μέλλω表达即将发生，ἀνάγομαι在旅行叙事中指启航或乘船出发；译文兼顾临近性、海路语境和目的地。
- source_word: ἐγένετο γνώμης τοῦ ὑποστρέφειν
  choice: 他就决定……返回
  rationale: ἐγένετο γνώμης是形成决定或主意的习语，属格冠词不定式说明决定的内容；“决定……返回”简洁自然。
- source_word: διὰ Μακεδονίας
  choice: 取道马其顿
  rationale: διά加属格在此表示经过的路线；“取道”准确表达经由马其顿返回。
theological_decisions:
- issue: 冲突叙事中“犹太人”的所指范围
  choice: 正文保留“犹太人”，脚注说明这里按语境指谋害保罗的那群人。
  alternative: 译作“一些犹太人”或“犹太人的反对者”。
  rationale: 原文没有明说“一些”或“反对者”，因此正文保留原有群体称谓；同时避免现代读者把特定情境中的行动不当地归于所有犹太人。
- issue: 阴谋与保罗改变行程之间的关系
  choice: 按原文次序表明阴谋出现后，他决定改由马其顿返回。
  alternative: 明确补写他是“为了躲避阴谋”而改变路线。
  rationale: 上下文强烈暗示因果关系，但希腊文主要以情境结构和“就”连接事件，没有明说目的；译文不进一步补入动机。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“住了三个月”“正要乘船”“取道马其顿”符合当代普通话表达；避免生硬照搬希腊语属格独立结构，也不把原文仅暗示的因果关系过度明说。
