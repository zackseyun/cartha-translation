  text: ⸀καθεζόμενος δέ τις νεανίας ὀνόματι Εὔτυχος ἐπὶ τῆς θυρίδος, καταφερόμενος ὕπνῳ βαθεῖ διαλεγομένου τοῦ Παύλου ἐπὶ πλεῖον, κατενεχθεὶς ἀπὸ τοῦ ὕπνου ἔπεσεν ἀπὸ τοῦ τριστέγου κάτω καὶ ἤρθη νεκρός.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/009.yaml
  text: And a certain young man named Eutychus[a], sitting in the window, was sinking into a deep sleep while Paul was speaking at length; and being overcome by sleep, he fell down from the third story and was picked up dead.
translation:
  language: zh_hans
  text: 有一个名叫犹推古的年轻人，坐在窗台上。保罗长时间讲论的时候，他渐渐陷入沉睡；后来被睡意压倒，就从三楼掉了下去。他被抬起来时，已经死了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他被带起时，已经死了”。这里的希腊动词可指“抬起”或“带起”。
    reason: 保留ἤρθη的词汇替代可能性，不在正文中规定是否已被搬离现场。
lexical_decisions:
- source_word: καθεζόμενος δέ τις νεανίας ὀνόματι Εὔτυχος
  choice: 有一个名叫犹推古的年轻人，坐在窗台上
  rationale: 以自然现代汉语交代人物、姓名和姿势；τις的非特指意义由“有一个”表达，νεανίας译作“年轻人”。
- source_word: ἐπὶ τῆς θυρίδος
  choice: 坐在窗台上
  rationale: θυρίς指窗户或窗洞；结合随后坠楼的情节，“窗台上”比笼统的“窗户那里”更清楚，但不额外描写窗户结构。
- source_word: καταφερόμενος ὕπνῳ βαθεῖ
  choice: 渐渐沉沉入睡
  rationale: 表达现在分词所呈现的渐进过程，并保留βαθεῖ“深沉”的意味。
- source_word: διαλεγομένου τοῦ Παύλου ἐπὶ πλεῖον
  choice: 保罗讲了很久
  rationale: 此处διαλέγομαι指持续讲论，ἐπὶ πλεῖον表示时间延长；译文简洁呈现其伴随背景。
- source_word: κατενεχθεὶς ἀπὸ τοῦ ὕπνου
  choice: 被睡意压倒
  rationale: 与前面的渐渐入睡形成推进，表现睡眠最终完全控制了他。
- source_word: ἔπεσεν ἀπὸ τοῦ τριστέγου κάτω
  choice: 从三楼掉了下去
  rationale: τρίστεγον指第三层，κάτω强调向下；现代汉语“从三楼掉了下去”自然清楚。
- source_word: ἤρθη νεκρός
  choice: 人们把他扶起来时，他已经死了
  rationale: αἴρω的被动形式表示被抬起、扶起或带起；按坠落后的现场动作译作“扶起来”，νεκρός则明确译作“死了”，不作弱化。
theological_decisions:
- issue: νεκρός是否应弱化为“像是死了”或“看来已经死了”
  choice: 他已经死了
  alternative: 看来已经死了
  rationale: 希腊文直接使用νεκρός，没有表示表象或不确定性的限定语；译文保留叙事的明确陈述及其与后文之间的张力。
- issue: ἤρθη是否暗示搬走尸体
  choice: 把他扶起来
  alternative: 把他抬走
  rationale: αἴρω语义可涵盖抬起、扶起或带走；上下文并未明确说明搬离现场，因此不把“走”加入正文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。句子分为两层，以分号呈现从困倦到坠落的推进；专名采用常见中文音译“犹推古”。
