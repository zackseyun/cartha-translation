  yaml_path: translation/nt/acts/020/037.yaml
  text: They all wept a great deal, threw their arms around Paul’s neck, and kept kissing him.
translation:
  language: zh_hans
  text: 众人都痛哭不已，扑上去搂住保罗的脖子，连连亲吻他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἱκανὸς δὲ κλαυθμὸς ἐγένετο πάντων
  choice: 众人都痛哭不已
  rationale: ἱκανός修饰κλαυθμός，表示哭泣程度很深；πάντων表明在场众人无一例外。“痛哭不已”以自然现代汉语传达强烈而持续的哭泣。
- source_word: ἐπιπεσόντες ἐπὶ τὸν τράχηλον τοῦ Παύλου
  choice: 搂着保罗的颈项
  rationale: 该表达描写扑到某人颈项上相拥的动作。“搂着……的颈项”保留明确的颈项意象，同时符合汉语表达习惯。
- source_word: κατεφίλουν αὐτόν
  choice: 连连亲吻他
  rationale: καταφιλέω表示热切亲吻，未完成时态在此呈现持续或反复的动作；“连连亲吻”清楚传达反复性而不过度解释。
