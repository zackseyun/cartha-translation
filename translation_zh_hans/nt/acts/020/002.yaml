  yaml_path: translation/nt/acts/020/002.yaml
  text: After passing through those regions and encouraging them with many words[a], he came into Greece.
translation:
  language: zh_hans
  text: 他经过那些地区，以许多话劝勉他们，随后来到希腊。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διελθὼν
  choice: 走遍了
  rationale: 不定过去时分词表示先于主句动作发生的行动；“走遍了”自然表达他经过各地的行程，也符合上下文中巡访各处的意思。
- source_word: τὰ μέρη ἐκεῖνα
  choice: 那些地区
  rationale: μέρη在这里指若干地域；“那些地区”是现代汉语中自然、准确的地理表达。
- source_word: παρακαλέσας
  choice: 鼓励
  rationale: παρακαλέω可表示鼓励、劝勉或安慰。此处采用意义较宽的“鼓励”，保留保罗坚固信徒的牧养语气，不将其限缩为责劝或安慰。
- source_word: αὐτοὺς
  choice: 当地的信徒
  rationale: 代词所指是上述地区中的门徒或信徒。汉语若只译为“他们”，指代略显含混，因此适度明示为“当地的信徒”。
- source_word: λόγῳ πολλῷ
  choice: 用许多话
  rationale: 较贴近希腊文“用很多言语”的形式，同时可自然理解为长时间或多方劝勉；相关语义可能性在脚注中说明。
- source_word: ἦλθεν εἰς τὴν Ἑλλάδα
  choice: 来到希腊
  rationale: 表达进入希腊这一目的地的动作；现代汉语无需另译介词所强调的“进入”，即可准确传达。
- source_word: δὲ
  choice: 然后
  rationale: δέ是轻微的承接连接词；结合分词与主句的先后关系，以“然后”自然呈现叙事推进。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“走遍了……然后来到……”清楚呈现希腊文分词动作与主句动作的先后次序；正文保留“用许多话”的具体措辞，脚注则说明其可能表达长篇或充分劝勉。
