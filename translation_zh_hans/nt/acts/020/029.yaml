source:
  edition: SBLGNT
  text: ἐγὼ ⸀οἶδα ὅτι εἰσελεύσονται μετὰ τὴν ἄφιξίν μου λύκοι βαρεῖς εἰς ὑμᾶς μὴ φειδόμενοι τοῦ ποιμνίου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/029.yaml
  text: I know that after my departure fierce wolves will come in among you[b][a], not sparing the flock.
translation:
  language: zh_hans
  text: 我知道，我离开以后[a]，必有凶暴的狼[b]进入你们中间，不顾惜羊群。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“我来到（或到达）以后”；按上下文，这里指保罗离开他们以后。
    reason: lexical_alternative
  - marker: b
    text: “凶暴”也可译作“凶猛”；原文形容词可表达严酷、凶狠或残暴。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶδα
  choice: 我知道
  rationale: 表达保罗确信的认知，而非推测；“我知道”直接、自然。
- source_word: εἰσελεύσονται
  choice: 必有……进入
  rationale: 将来时表示将发生的事；“进入”保留侵入群体内部的动态，配合“狼”和“羊群”的意象。
- source_word: μετὰ τὴν ἄφιξίν μου
  choice: 我离开以后
  rationale: ἄφιξις通常涉及来到或抵达，但本段语境指保罗不再与他们同在之后；正文按语境译为“离开”，脚注保留原词表层意义造成的张力。
- source_word: λύκοι βαρεῖς
  choice: 凶暴的狼
  rationale: 保留原文的狼群隐喻；βαρεῖς在这里表示严酷、凶狠、带来伤害，而不是字面的“沉重”。
- source_word: εἰς ὑμᾶς
  choice: 进入你们中间
  rationale: 既保留εἰς所表达的进入方向，也自然说明这些“狼”将侵入听众所在的群体。
- source_word: μὴ φειδόμενοι
  choice: 不顾惜
  rationale: 贴近“不宽容、不放过”的含义，简洁表达其无情伤害羊群的行为。
- source_word: τοῦ ποιμνίου
  choice: 羊群
  rationale: 保留牧养意象，并与“狼”构成原文鲜明的比喻关系。
theological_decisions:
- issue: “狼”的隐喻所指
  choice: 正文保留“凶暴的狼”，不直接解释为假教师、逼迫者或其他特定人物。
  alternative: 译作“毁坏教会的人”或“假教师”。
  rationale: 本节只使用隐喻，并未明确限定所指；保留隐喻既维持警告的力度，也避免加入比原文更窄的神学解释。
- issue: ἄφιξις在本句中的含义
  choice: 正文按语境译为“离开”，并以脚注注明其通常的字面意义。
  alternative: 译作“来到”或“到达”。
  rationale: 上下文谈到保罗不再在他们中间以后将发生的危险，因此“离开”最符合语篇意义；脚注则诚实保留该名词通常表示“来到、到达”的词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式简洁，保留“狼—羊群”的牧养隐喻；“不顾惜”兼具自然度和经文语体的凝练感。
