  yaml_path: translation/nt/acts/020/026.yaml
  text: Therefore I testify to you on this day that I am innocent of the blood of all[a][b].
translation:
  language: zh_hans
  text: 所以，我今天向你们郑重作证：我不沾任何人的血债[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我没有沾任何人的血。”这里的希腊语习语表示不承担关乎他人的罪责或责任。
    reason: lexical_alternative
  - marker: b
    text: 这一说法很可能呼应以西结书中守望者与血债的意象（如结3:18–19；33:6–9）。
    reason: cross_reference
lexical_decisions:
- source_word: διότι
  choice: 所以
  rationale: 结合上文，本词引出保罗根据自己从未退缩、忠实宣讲而作出的结论；“所以”自然表达推论关系。
- source_word: μαρτύρομαι
  choice: 郑重作证
  rationale: 该形式在此带有庄严的亲身见证或声明意味；加“郑重”可传达其严肃语气，而不限定为法庭场景。
- source_word: ὑμῖν
  choice: 向你们
  rationale: 自然对应间接受词，不额外引入“在你们面前”所可能带出的公开审判色彩。
- source_word: ἐν τῇ σήμερον ἡμέρᾳ
  choice: 今天
  rationale: 希腊语是带庄重色彩的“在今日这一天”；现代汉语用“今天”最自然，整句的庄严感由“郑重作证”保留。
- source_word: καθαρός … ἀπὸ τοῦ αἵματος πάντων
  choice: 无论什么人的血，都与我无关
  rationale: 直译是“洁净，不沾所有人的血”，属于血债或责任方面的习语。所选表达在现代汉语中自然地表明保罗不承担任何人的血债责任，同时以“血”保留原文意象和互文空间。
- source_word: πάντων
  choice: 无论什么人
  rationale: 阳性复数在语境中泛指所有相关的人；此译保留范围的全面性，且避免生硬的“所有人的血”。
theological_decisions:
- issue: “不沾所有人的血”的含义
  choice: 保留“血”的意象，同时用“与我无关”表达保罗不负血债或失职责任
  alternative: 译作“我对任何人的灭亡都没有责任”或仅指未参与任何人的肉身死亡
  rationale: 上下文关乎保罗忠实宣讲并完成警戒、教导的责任，措辞很可能呼应以西结书守望者的血债意象。正文不把“血”直接解释为“灭亡”，以免消除原文的形象和神学张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“郑重作证”承载原句的见证语气；“无论什么人的血，都与我无关”既让普通读者易懂，又保留“血”这一圣经习语及其可能的以西结书互文。所有脚注标记均置于正文相应位置。
