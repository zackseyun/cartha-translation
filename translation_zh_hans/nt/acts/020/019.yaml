  text: δουλεύων τῷ κυρίῳ μετὰ πάσης ταπεινοφροσύνης ⸀καὶ δακρύων καὶ πειρασμῶν τῶν συμβάντων μοι ἐν ταῖς ἐπιβουλαῖς τῶν Ἰουδαίων·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/019.yaml
  text: serving the Lord with all humility and with tears and trials that happened to me through the plots of the Jews[a][b].
translation:
  language: zh_hans
  text: 我服侍主，凡事谦卑，流着眼泪，也经历了在犹太人的阴谋中所临到我的试炼[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“考验”；这个词也可指“诱惑”，但这里是指因反对和敌意而来的外在试炼。
    reason: lexical_alternative
  - marker: b
    text: 这里指策划伤害保罗的某些犹太反对者，并不是泛指所有犹太人。
    reason: cultural_note
lexical_decisions:
- source_word: δουλεύων
  choice: 服侍
  rationale: 现在分词描述保罗持续服侍的状态；“服侍”在现代汉语中自然，也保留了对主忠诚尽职的含义，而不刻意强化奴隶身份。
- source_word: τῷ κυρίῳ
  choice: 主
  rationale: 按原文保留称号“主”；在《使徒行传》的语境中最自然地指主耶稣，但正文不作原文未明说的增补。
- source_word: μετὰ πάσης ταπεινοφροσύνης
  choice: 凡事谦卑
  rationale: μετά加属格表示伴随的态度或方式，πάσης加强“谦卑”的全面程度；“凡事谦卑”简洁自然，并保留这种全面性。
- source_word: δακρύων
  choice: 流着眼泪
  rationale: 将具体的复数名词译成自然的汉语动态表达，保留保罗讲话中的情感力度。
- source_word: πειρασμῶν
  choice: 种种试炼
  rationale: 此处与敌对者的谋害相连，所指是外来的患难与考验，而不是犯罪的诱惑；复数用“种种”自然体现。
- source_word: τῶν συμβάντων μοι
  choice: 临到我的
  rationale: 定冠词分词短语限定这些试炼是发生在保罗身上的；“临到我的”准确、庄重且符合经文语体。
- source_word: ἐν ταῖς ἐπιβουλαῖς
  choice: 因……的谋害
  rationale: ἐν在这里可表达处境、手段或原因；上下文表明这些谋害导致保罗遭遇试炼，因此以“因”传达其因果—手段关系。
- source_word: τῶν Ἰουδαίων
  choice: 犹太人的
  rationale: 原文通常指“犹太人”，正文不擅自缩窄为“犹太领袖”；脚注说明此处是参与谋害保罗的特定反对者，并非泛指全体犹太人。
- source_word: ἐπιβουλαῖς
  choice: 谋害
  rationale: 该词指暗中策划伤害人的计谋；“谋害”比泛泛的“计谋”更能传达这里敌对阴谋的性质。
theological_decisions:
- issue: “犹太人”可能引发的反犹误读
  choice: 正文直译为“犹太人”，并用脚注限定其语境所指。
  alternative: 译为“犹太领袖”或“犹太地人”。
  rationale: 希腊文明确使用Ἰουδαίων，未把对象限定为领袖；但语境只涉及谋害保罗的特定犹太反对者，不能扩大为对全体犹太人的概括。
- issue: πειρασμῶν在此指“试炼”还是“诱惑”
  choice: 试炼
  alternative: 诱惑；考验
  rationale: 这些经历由敌对者的谋害引起，语境侧重外在患难；“试炼”保留受考验的含义，又不误导为内在犯罪诱惑。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“凡事谦卑”保留πάσης的全面语气；“流着眼泪”使并列方式自然；整句延续前文第一人称叙述，同时不补入原文没有明说的身份或教义限定。
