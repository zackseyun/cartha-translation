base_translation:
  language: en
  yaml_path: translation/nt/acts/020/036.yaml
  text: And after saying these things, he knelt down with them all and prayed.
translation:
  language: zh_hans
  text: 说完这些话，保罗就同众人一起跪下祷告。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: 就
  rationale: 在叙事中承接前文并引出随后发生的动作；中文用“就”自然体现语境中的先后衔接，不额外强化因果关系。
- source_word: ταῦτα εἰπὼν
  choice: 说完这些话
  rationale: 不定过去时分词表示先于主句动作发生；“说完这些话”既自然，也准确表达动作的完成和先后次序。
- source_word: θεὶς τὰ γόνατα αὐτοῦ
  choice: 跪下
  rationale: 原文直译为“放下他的双膝”，是表示屈膝跪下的惯用说法；“跪下”简洁准确，不加入“扑倒”等原文没有的强烈动态。
- source_word: σὺν πᾶσιν αὐτοῖς
  choice: 同众人一起
  rationale: σύν加与格表示陪同，πᾶσιν强调在场全体；“同众人一起”保留共同参与及全体性的重点。
- source_word: προσηύξατο
  choice: 祷告
  rationale: προσεύχομαι是表示向神祷告的常用动词；“祷告”是现代中文圣经语体中直接、庄重且易懂的表达。
- source_word: αὐτοῦ
  choice: 保罗
  rationale: 希腊文以第三人称代词指向前文明确的保罗。中文若连续使用隐含主语，可能使“同众人一起跪下”的行动主体略显模糊；明示“保罗”可自然厘清指代而不改变意义。
theological_decisions: []
translation_notes:
  register: 采用现代、简洁而庄重的叙事语体。“同众人一起跪下祷告”保留全体共同跪下并祷告的画面；不把跪下解释为某种特定礼仪，也不添加祷告对象或内容。
