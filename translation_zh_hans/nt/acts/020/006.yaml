  text: ἡμεῖς δὲ ἐξεπλεύσαμεν μετὰ τὰς ἡμέρας τῶν ἀζύμων ἀπὸ Φιλίππων, καὶ ἤλθομεν πρὸς αὐτοὺς εἰς τὴν Τρῳάδα ἄχρι ἡμερῶν πέντε, ⸀οὗ διετρίψαμεν ἡμέρας ἑπτά.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/006.yaml
  text: But we sailed away from Philippi after the days of Unleavened Bread[a], and came to them at Troas within five days, where we stayed seven days.
translation:
  language: zh_hans
  text: 除酵节过后，我们从腓立比乘船出发，历时五天到了特罗亚，同他们相见；我们在那里停留了七天。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξεπλεύσαμεν
  choice: 乘船出发
  rationale: 该动词明确表示乘船离开；“乘船出发”自然表达从腓立比启程的动作。
- source_word: μετὰ τὰς ἡμέρας τῶν ἀζύμων
  choice: 过了除酵节
  rationale: 原文直译为“除酵的日子之后”，所指是犹太人的除酵节期；此译法简明自然，并保留时间关系。
- source_word: ἀπὸ Φιλίππων
  choice: 从腓立比
  rationale: ἀπό表示起点；“腓立比”是该城通行的中文译名。
- source_word: ἤλθομεν πρὸς αὐτοὺς
  choice: 与他们会合
  rationale: 原文表示来到他们那里；在旅行叙事中，“与他们会合”自然传达抵达同伴所在之处的语境含义。
- source_word: εἰς τὴν Τρῳάδα
  choice: 到特罗亚
  rationale: εἰς在这里标明目的地；“到特罗亚”符合现代汉语表达。
- source_word: ἄχρι ἡμερῶν πέντε
  choice: 五天后
  rationale: 该短语表示直到抵达为止历时五天。正文采用自然的汉语表达，脚注保留“用了五天”这一更直接呈现行程时长的译法。
- source_word: οὗ
  choice: 在那里
  rationale: 关系副词回指特罗亚；中文以“在那里”衔接更自然。
- source_word: διετρίψαμεν ἡμέρας ἑπτά
  choice: 住了七天
  rationale: διατρίβω在旅行语境中表示停留或住一段时间；“住了七天”通顺且准确。
