base_translation:
  language: en
  yaml_path: translation/nt/acts/020/004.yaml
  text: And Sopater son of Pyrrhus[a], a Berean, accompanied him; and Aristarchus and Secundus from Thessalonica; and Gaius of Derbe, and Timothy[b]; and Tychicus and Trophimus from Asia.
translation:
  language: zh_hans
  text: 陪同保罗同行的有：庇哩亚人、毕罗斯的儿子所巴特；帖撒罗尼迦人亚里达古和西公都；来自特庇的该犹，还有提摩太；以及亚细亚省人[a]推基古和特罗非摩。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚细亚省”指当时罗马帝国的亚细亚行省，主要位于今天土耳其西部，并非今日所说的亚洲大陆。
    reason: cultural_note
lexical_decisions:
- source_word: συνείπετο δὲ αὐτῷ
  choice: 陪同保罗的有
  rationale: 未完成时的 συνέπομαι 表示随同、结伴同行；中文用“陪同……的有”自然引出名单。αὐτῷ 在语境中指保罗，为避免中文代词指向不清，明示其名。
- source_word: Σώπατρος Πύρρου Βεροιαῖος
  choice: 庇哩亚人毕罗斯的儿子所巴特
  rationale: Πύρρου 是属格，最自然地作父名称谓“毕罗斯的儿子”；Βεροιαῖος 表示来自庇哩亚。
- source_word: Θεσσαλονικέων δὲ Ἀρίσταρχος καὶ Σεκοῦνδος
  choice: 帖撒罗尼迦人亚里达古和西公都
  rationale: Θεσσαλονικέων 是复数属格，将两人归入帖撒罗尼迦人之中；中文以“帖撒罗尼迦人”简洁保留这一群体归属。
- source_word: Γάϊος Δερβαῖος καὶ Τιμόθεος
  choice: 特庇人该犹和提摩太
  rationale: Δερβαῖος 直接修饰该犹，表示他来自特庇；原文没有明确给提摩太标注同一籍贯，因此不把“特庇人”扩展到提摩太。
- source_word: Ἀσιανοὶ δὲ Τυχικὸς καὶ Τρόφιμος
  choice: 亚细亚省人推基古和特罗非摩
  rationale: Ἀσιανοί 在这里指罗马帝国亚细亚行省的人；正文加入“省”以免现代读者误解为今日亚洲大陆。
- source_word: δέ ... δέ ... δέ
  choice: 有……，……，以及……
  rationale: 重复的 δέ 在名单中起分组、递加作用；用中文列举结构表达，不机械重复转译。
