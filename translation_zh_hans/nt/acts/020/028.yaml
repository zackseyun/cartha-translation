source:
  edition: SBLGNT
  text: ⸀προσέχετε ἑαυτοῖς καὶ παντὶ τῷ ποιμνίῳ, ἐν ᾧ ὑμᾶς τὸ πνεῦμα τὸ ἅγιον ἔθετο ἐπισκόπους, ποιμαίνειν τὴν ἐκκλησίαν τοῦ ⸀θεοῦ, ἣν περιεποιήσατο διὰ τοῦ ⸂αἵματος τοῦ ἰδίου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/028.yaml
  text: Pay careful attention to yourselves and to all the flock[a], in which the Holy Spirit has appointed you overseers, to shepherd the church of God[c][b], which he obtained through the blood of his own.
translation:
  language: zh_hans
  text: 你们要留意自己，也要留意全群；圣灵已经在这羊群中立你们作监督，为要牧养上帝的教会[a]，就是他借着自己儿子的血为自己赢得的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“主的教会”。
    reason: textual_variant
  - marker: b
    text: 原文直译作“借着他自己的（那一位）的血”；“他自己的那一位”通常理解为“他的儿子”。传统上也译作“借着他自己的血”。
    reason: alternative_reading
lexical_decisions:
- source_word: προσέχετε ἑαυτοῖς
  choice: 要谨慎自守
  rationale: 现在时命令语气表达持续警醒；“谨慎自守”自然地保留了反身对象“自己”，又不把语气过度军事化。
- source_word: παντὶ τῷ ποιμνίῳ
  choice: 整个羊群
  rationale: 保留牧养的群羊比喻，并以“整个”表达 παντί 的整体范围。
- source_word: ἐν ᾧ
  choice: 在这羊群中
  rationale: 忠实表达监督者被安置在羊群之中，而不是置身群体之外。
- source_word: ἔθετο ἐπισκόπους
  choice: 立你们作监督
  rationale: ἔθετο 在此表示委任、安置；“监督”保留职能含义，避免直接套用后世教制称谓。
- source_word: ποιμαίνειν
  choice: 要牧养
  rationale: 保留与“羊群”呼应的牧者意象，也清楚表达委任的目的。
- source_word: τὴν ἐκκλησίαν τοῦ θεοῦ
  choice: 上帝的教会
  rationale: 依照所给 SBLGNT 正文翻译 θεοῦ；重要异文“主的教会”列入脚注。
- source_word: περιεποιήσατο
  choice: 所取得的
  rationale: 表达为自己获得、据为己有的含义，同时避免把原词限定为纯商业性的“购买”。
- source_word: διὰ τοῦ αἵματος
  choice: 借着……的血
  rationale: 表达 διά 加属格在此所含的途径或凭借意义，并保留献祭与救赎色彩。
- source_word: τοῦ ἰδίου
  choice: 他自己那一位的
  rationale: 以“那一位”呈现实词化形容词的用法，不在正文中擅自补出“儿子”，也不直接改成“他自己的血”，从而保留原文紧缩表达及其解释张力。
theological_decisions:
- issue: τοῦ αἵματος τοῦ ἰδίου 的所指与句法关系
  choice: 正文译作“他自己那一位的血”
  alternative: “他自己儿子的血”；传统译法为“他自己的血”
  rationale: τοῦ ἰδίου 可作实词化形容词，意为“属于他自己的那一位”，常被理解为他的儿子；也有悠久传统把整句理解为上帝以自己的血取得教会。正文不明加“儿子”，也不把所有格关系改写成“自己的血”，以保留原文的简约和基督论张力。
- issue: τοῦ θεοῦ 的文本异文
  choice: 采用“上帝的教会”
  alternative: “主的教会”
  rationale: 所给 SBLGNT 正文为 θεοῦ，故正文从之；κύριου 的异文具有释经意义，置于脚注。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“自守、羊群、监督、牧养、教会”维持本节连贯的牧养意象和早期教会语境；对末句刻意保留原文罕见而重要的表达张力，并用脚注帮助普通读者理解。
