  text: ὡς δὲ παρεγένοντο πρὸς αὐτὸν εἶπεν αὐτοῖς· Ὑμεῖς ἐπίστασθε ἀπὸ πρώτης ἡμέρας ἀφ’ ἧς ἐπέβην εἰς τὴν Ἀσίαν πῶς μεθ’ ὑμῶν τὸν πάντα χρόνον ἐγενόμην,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/018.yaml
  text: When they came to him[a], he said to them[b], “You yourselves know how I lived among you the whole time from the first day that I set foot in Asia,”
translation:
  language: zh_hans
  text: 他们来到保罗那里，保罗就对他们说：“你们自己知道，自从我踏上亚细亚[a]的第一天起，我在你们中间一直是怎样为人的[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“亚细亚”指小亚细亚西部的罗马亚细亚行省，不是现代所说的亚洲大陆。
    reason: cultural_note
  - marker: b
    text: 或译：“我一直怎样与你们同在。”希腊语表达可以侧重保罗的生活为人，也可以侧重他一直与他们同在。
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεγένοντο πρὸς αὐτόν
  choice: 他们来到保罗那里
  rationale: 表达众长老来到保罗面前的动作；用“保罗”明确汉语中的代词所指，使叙述自然清楚。
- source_word: Ὑμεῖς ἐπίστασθε
  choice: 你们自己知道
  rationale: “你们自己”保留显式人称代词Ὑμεῖς的强调语气，“知道”准确表达亲身了解。
- source_word: ἀπὸ πρώτης ἡμέρας ἀφ’ ἧς ἐπέβην
  choice: 自从我踏进……的第一天起
  rationale: “踏进”保留ἐπιβαίνω在旅行语境中的生动画面，同时自然标示时间起点。
- source_word: εἰς τὴν Ἀσίαν
  choice: 亚细亚
  rationale: 沿用中文圣经地理名称“亚细亚”，正文不扩写为现代“亚洲”，并以脚注说明它指罗马行省。
- source_word: πῶς μεθ’ ὑμῶν τὸν πάντα χρόνον ἐγενόμην
  choice: 我一直怎样和你们相处
  rationale: “怎样……相处”自然传达保罗在他们中间的生活表现；“一直”表达τὸν πάντα χρόνον的持续性，同时脚注保留“始终与你们同在”的结构性可能。
theological_decisions:
- issue: ἐγενόμην在此强调生活方式还是持续同在
  choice: 正文译作“怎样和你们相处”
  alternative: “怎样始终与你们同在”
  rationale: 上下文偏向保罗在他们中间的行事为人，但希腊语本身也可突出他持续与他们同在；正文采用兼顾关系与行为的自然表达，脚注保留另一侧重点。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“相处”比“为人”更自然，又能涵盖在群体中生活和行事的意思；保留“你们自己”的强调。脚注标记均置于相关正文位置。
