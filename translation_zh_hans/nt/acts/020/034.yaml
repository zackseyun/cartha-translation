  yaml_path: translation/nt/acts/020/034.yaml
  text: You yourselves know that these hands served my needs and the needs of those who were with me[a].
translation:
  language: zh_hans
  text: 你们自己知道，这双手供给了我和与我同在之人所需的一切[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这双手服事了我和与我同在之人的需要。”这里的希腊语动词可强调实际的服务，因而含有供应生活所需的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ
  choice: 你们自己
  rationale: 独立主格代词与动词并用，带有强调意味；“你们自己”自然保留这一重点。
- source_word: γινώσκετε
  choice: 知道
  rationale: 现在时直陈语气在此表示听众对保罗行事为人的直接了解，用“知道”简洁自然。
- source_word: ταῖς χρείαις μου
  choice: 我的需要
  rationale: χρεία指实际生活所需；结合并列结构，在译文中合并表达为“我……的需要”。
- source_word: τοῖς οὖσι μετ’ ἐμοῦ
  choice: 与我同在之人
  rationale: 贴近冠词化分词的指称意义，不将其进一步限定为某种特定身份的“同工”或“同伴”。
- source_word: ὑπηρέτησαν
  choice: 服事了
  rationale: 该动词指提供服务或帮助；以“这双手”为主语时，“服事”保留原文生动表达，而物质供给的含义由上下文及脚注说明。
- source_word: αἱ χεῖρες αὗται
  choice: 我这双手
  rationale: “这双手”保留指示语气；汉语为明确身体所属自然补出“我”，并以“双”符合现代汉语习惯。
theological_decisions: []
