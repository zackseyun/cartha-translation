  text: καταβὰς δὲ ὁ Παῦλος ἐπέπεσεν αὐτῷ καὶ συμπεριλαβὼν εἶπεν· Μὴ θορυβεῖσθε, ἡ γὰρ ψυχὴ αὐτοῦ ἐν αὐτῷ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/010.yaml
  text: But Paul went down and fell upon him[a], and embracing him said, “Do not be alarmed[b], for his life is in him.”
translation:
  language: zh_hans
  text: 保罗却下去，伏在他身上，又把他抱住，说：“不要慌乱，因为他的生命[a]在他里面[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“灵魂”。希腊词ψυχή可指“生命”“自我”或“灵魂”；这里讨论他是死是活，所以正文译作“生命”。
    reason: lexical_alternative
  - marker: b
    text: 保罗的话既可能表示这青年其实没有死，也可能表示他的生命已经恢复；希腊原文没有明确判定是哪一种情况。
    reason: alternative_reading
lexical_decisions:
- source_word: καταβὰς δὲ ὁ Παῦλος
  choice: 保罗却下去
  rationale: καταβὰς表示保罗从楼上所在之处下去；δὲ承接前文并带轻微转折，用“却”自然地引出他的回应。
- source_word: ἐπέπεσεν αὐτῷ
  choice: 伏在他身上
  rationale: 既保留具体的身体动作，也保留可能使人联想到先知施行复苏行动的叙事措辞；比“扑到他身上”更庄重，也较少暗示猛烈碰撞。
- source_word: συμπεριλαβὼν
  choice: 又把他抱住
  rationale: 表达环抱、搂住的动作，现代汉语自然清楚，并保留动作中的亲近与关切。
- source_word: Μὴ θορυβεῖσθε
  choice: 不要慌乱
  rationale: θορυβεῖσθε在此可指因惊恐而骚动或陷入混乱；“不要慌乱”兼顾众人的情绪和现场的扰动。
- source_word: ἡ ψυχὴ αὐτοῦ
  choice: 他的生命
  rationale: ψυχή可指生命、自我或灵魂；本段关注青年是否活着，因此“生命”最切合语境，也避免加入经文没有强调的人论含义。
- source_word: ἐν αὐτῷ ἐστιν
  choice: 在他里面
  rationale: 贴近希腊文的陈述方式，不增添“仍然”或“已经回来”等词，从而不判定他先前究竟未死还是已经复生。
theological_decisions:
- issue: 生死语境中ψυχή的含义
  choice: 正文译为“生命”
  alternative: “灵魂”
  rationale: 上下文所关切的是犹推古的生命状况。“生命”符合ψυχή在此类语境中的常见意义，并避免把本句处理成关于灵魂与身体关系的技术性教义陈述。
- issue: 保罗的话是否表示犹推古从未真正死去，还是已经恢复生命
  choice: 正文保持“他的生命在他里面”的中性表达
  alternative: “他还活着”或“他的生命已经回来了”
  rationale: 希腊文只说他的生命在他里面，没有明确说明生命一直未曾离开，还是已经恢复；译文不替原文消除这一张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“伏在他身上”保留原文动作及其可能的经文呼应；末句刻意不加“还”“仍”或“重新”，以保存原文对青年生命状态的真实含混。
