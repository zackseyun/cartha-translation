  text: ὡς οὐδὲν ὑπεστειλάμην τῶν συμφερόντων τοῦ μὴ ἀναγγεῖλαι ὑμῖν καὶ διδάξαι ὑμᾶς δημοσίᾳ καὶ κατ’ οἴκους,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/020.yaml
  text: how I did not shrink back from declaring to you anything that was profitable and teaching you publicly and from house to house,[a]
translation:
  language: zh_hans
  text: 我怎样毫不退缩地向你们宣讲一切对你们有益的事，又在公众场合和挨家挨户教导你们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “毫不退缩”或译“毫无保留”。
    reason: ὑπεστειλάμην既可强调没有退却、畏缩，也可强调没有扣留或隐瞒当讲的内容。
lexical_decisions:
- source_word: ὡς
  choice: 我怎样
  rationale: ὡς承接上文的回顾，引出保罗事奉方式的具体内容；“我怎样”既保留从属关系，也符合现代汉语表达。
- source_word: ὑπεστειλάμην
  choice: 毫不退缩
  rationale: 该中间语态形式可表达退却、畏缩或有所保留。“毫不退缩”保留其形象性，并与后面的双重否定自然衔接。
- source_word: τῶν συμφερόντων
  choice: 凡对你们有益的
  rationale: συμφέρω在此指有益、有帮助之事；译文保留宽泛意义，不把益处明确限定为经济、实用或某一类属灵内容。
- source_word: τοῦ μὴ ἀναγγεῖλαι
  choice: 没有一样不向你们宣讲
  rationale: 该带冠词的不定式说明保罗没有因退缩而不做的事。汉语用“没有一样不……”自然传达原文否定结构。
- source_word: ἀναγγεῖλαι
  choice: 宣讲
  rationale: ἀναγγέλλω可指报告、宣布或使人知道；“宣讲”适合此处公开事奉的语境，同时仍与“教导”有所区别。
- source_word: διδάξαι
  choice: 教导
  rationale: 直接表达διδάσκω的基本含义，并与“宣讲”并列，呈现原文两个不定式所指的相关活动。
- source_word: δημοσίᾳ
  choice: 在公众场合
  rationale: 该词表示公开地、在公共场合；此译法自然清楚，避免较书面的“公开地”。
- source_word: κατ’ οἴκους
  choice: 挨家挨户
  rationale: κατά加复数宾格在此具有逐一、分配意味；“挨家挨户”保留保罗在各家之间进行教导的重复性和个人性。
theological_decisions:
- issue: “有益的”所涵盖的范围
  choice: 在正文中保留宽泛的“凡对你们有益的”
  alternative: 明确译成“凡在属灵上对你们有益的”
  rationale: 上下文确实是保罗对以弗所信徒的牧养事奉，益处主要具有属灵和牧养性质；但原词本身仅说明“有益”，正文不应加入原文未明说的限定。
- issue: ὑπεστειλάμην的语气
  choice: 毫不退缩
  alternative: 毫无保留
  rationale: “退缩”保留动词可能含有的畏缩、退却意象；“保留”更强调没有扣留信息。正文采用前者，并在脚注中提供后者，以保存词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“宣讲”与“教导”分别对应两个希腊语动词；冒号帮助读者理解后文是“毫不退缩”的具体说明。
