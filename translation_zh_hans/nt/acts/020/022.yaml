  text: καὶ νῦν ἰδοὺ ⸂δεδεμένος ἐγὼ⸃ τῷ πνεύματι πορεύομαι εἰς Ἰερουσαλήμ, τὰ ἐν αὐτῇ συναντήσοντά ⸀μοι μὴ εἰδώς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/022.yaml
  text: And now, behold, bound in the Spirit, I am going to Jerusalem, not knowing what will happen to me there,
translation:
  language: zh_hans
  text: 如今，看哪，我受灵的约束[a]，正往耶路撒冷去，不知道在那里会有什么事临到我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我在灵里受约束”。这里的“灵”既可能指保罗自己的灵，也可能指圣灵；整句话也可理解为“我受圣灵催促”。
    reason: 保留τῷ πνεύματι所指及其与δεδεμένος关系上的真实歧义。
lexical_decisions:
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留这一话语标记所表达的强调和郑重转折；这一说法虽略显庄重，但现代读者仍容易理解。
- source_word: δεδεμένος
  choice: 被捆绑
  rationale: 保留δέω完成时被动分词的捆绑意象，不把它直接解释成较强的“催促”或“迫使”。
- source_word: τῷ πνεύματι
  choice: 在灵里
  rationale: 贴近希腊语与格短语，并避免在正文中过早断定是保罗自己的心灵还是圣灵；可能的所指与工具性理解在脚注中说明。
- source_word: πορεύομαι
  choice: 正往……去
  rationale: 自然表达现在时所指的正在进行或即将实行的行程。
- source_word: τὰ ἐν αὐτῇ συναντήσοντά μοι
  choice: 在那里会有什么事临到我
  rationale: 既保留“临到／遇上”的原文意象，也以自然汉语表达在耶路撒冷等待保罗的未知遭遇。
- source_word: μὴ εἰδώς
  choice: 不知道
  rationale: 直接、自然地表达伴随主要动作的分词结构。
- source_word: Ἰερουσαλήμ
  choice: 耶路撒冷
  rationale: 采用现代中文圣经及一般用语中通行的地名译法。
theological_decisions:
- issue: τῷ πνεύματι所指的是圣灵还是保罗自己的心灵
  choice: 正文译作“在灵里”，保留所指的开放性
  alternative: “心灵受到束缚”或“受圣灵催促／约束”
  rationale: 《使徒行传》的语境使圣灵成为很可能的所指，尤其下一节提到圣灵的见证；但此处希腊语形式本身并未排除保罗自己的心灵，也可带有凭借圣灵而受约束的含义，因此不在正文中消除这一张力。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“看哪”保留原文的强调语气；“在灵里被捆绑”略带原文色彩，以保存其意象与神学歧义，脚注则帮助普通读者理解不同可能。
