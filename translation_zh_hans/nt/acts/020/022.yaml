  source_fidelity: 译文准确传达保罗正前往耶路撒冷、却不知道将在那里遭遇何事。惟“在灵里被捆绑”在现代汉语中容易被理解为处于某种属灵状态，而较难自然表达δεδεμένος与τῷ πνεύματι之间“受灵约束／束缚”的关系。
  naturalness: “现在，看哪”与“在灵里被捆绑”均带有较强的逐词对应痕迹；改为“如今，看哪，我受灵的约束”仍保留庄重语体、强调标记和原文隐喻，同时更合乎现代普通话。
  terminology: “灵”不在正文中明确为“圣灵”，以保留τῷ πνεύματι可能指保罗自己的灵、圣灵，或带有圣灵推动意味的歧义。脚注相应避免把替代解释表述得过于确定。
  issues:
