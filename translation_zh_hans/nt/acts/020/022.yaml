- from: 现在，看哪，我在灵里被捆绑[a]，正往耶路撒冷去，不知道在那里会有什么事临到我。
  to: 如今，看哪，我受灵的约束[a]，正往耶路撒冷去，不知道在那里会有什么事临到我。
  rationale: 修订仅改善汉语中“灵”与“受捆绑”之间关系的表达，并以脚注保存原文未决的所指和语义关系。“受灵的约束”保留δεδεμένος的受约束／束缚意象，未在正文把“灵”定为圣灵，也未把较强的“催促”解释当作唯一译法。
