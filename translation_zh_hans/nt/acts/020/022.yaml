    issue: “在灵里被捆绑”关系表达生硬且可能误导
    rationale: 汉语“在……里被捆绑”首先描写受捆绑发生的范围或状态，未能自然呈现希腊语中“被／受灵约束”的可能关系。改为“受灵的约束”较自然，也不将“灵”的指涉定为圣灵。
  - severity: low
    issue: “现在”与“看哪”并列略显直译
    rationale: “如今”更适合庄重叙述语境，并能自然保留καὶ νῦν的转折推进；“看哪”保留ἰδοὺ的强调。
