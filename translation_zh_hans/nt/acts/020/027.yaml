  text: οὐ γὰρ ὑπεστειλάμην τοῦ μὴ ἀναγγεῖλαι ⸂πᾶσαν τὴν βουλὴν τοῦ θεοῦ ὑμῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/027.yaml
  text: For I did not shrink back from declaring to you the whole counsel of God[a].
translation:
  language: zh_hans
  text: 因为我没有避而不向你们宣讲上帝的整个旨意[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “上帝的整个旨意”也可译作“上帝的整个计划”、“上帝的整个目的”或“上帝的整个心意”。
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: 因为
  rationale: 承接并说明上一节的根据；在单节呈现中，“因为”自然保留了γάρ的因果连接作用。
- source_word: ὑπεστειλάμην
  choice: 没有避而不……
  rationale: ὑποστέλλω的中间语态在此表示畏缩、退避，以致不去做某事。“没有避而不”既保留退缩的意象，也与20:20的同词用法保持一致。
- source_word: τοῦ μὴ ἀναγγεῖλαι
  choice: 不……宣讲
  rationale: 带μή的冠词不定式补足ὑπεστειλάμην，说明保罗没有退避不做的事。ἀναγγέλλω在此庄重的教导语境中译为“宣讲”。
- source_word: πᾶσαν
  choice: 全部的
  rationale: 修饰单数名词βουλή，强调内容的完整、毫无保留。
- source_word: βουλὴν τοῦ θεοῦ
  choice: 上帝全部的旨意
  rationale: βουλή可指谋划、计划、目的或旨意。“旨意”是现代汉语中自然且庄重的概括性表达，但其计划、目的等可能含义以脚注保留。
- source_word: ὑμῖν
  choice: 向你们
  rationale: 与“宣讲”搭配，清楚表达受事者是以弗所的众长老。
theological_decisions:
- issue: βουλὴ τοῦ θεοῦ的含义范围
  choice: 上帝的旨意
  alternative: 上帝的全盘计划／全部谋划／全部心意
  rationale: 该词组可能侧重上帝的谋划、目的、计划或意愿。正文采用涵盖面较广且符合现代汉语圣经语体的“旨意”，脚注列出其他可能译法，避免把经文限定为某一种神学范畴。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“避而不……宣讲”保留原文退缩或有所保留的意味；前置“上帝全部的旨意”突出πᾶσαν所表达的完整性，同时维持自然可读的汉语句式。
