  text: καὶ τὰ νῦν παρατίθεμαι ⸀ὑμᾶς τῷ ⸀θεῷ καὶ τῷ λόγῳ τῆς χάριτος αὐτοῦ, τῷ δυναμένῳ ⸀οἰκοδομῆσαι καὶ δοῦναι ⸀τὴν κληρονομίαν ἐν τοῖς ἡγιασμένοις πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/032.yaml
  text: And now I entrust you to God and to the word of his grace[a], which is able to build up and to give the inheritance among all those who have been sanctified.
translation:
  language: zh_hans
  text: 现在，我把你们托付给上帝和他恩典的道；这道能[a]造就你们，并使你们在所有已经分别为圣的人中承受产业。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他能造就你们，并使你们在所有已经分别为圣的人中承受产业。”这里的“他”指上帝；主文则将“能”主要理解为指“他恩典的道”。
    reason: 保留τῷ δυναμένῳ所指对象的真实语法歧义。
lexical_decisions:
- source_word: παρατίθεμαι
  choice: 托付
  rationale: 中间语态表达把听众交在另一位的照管之下；“托付给”是现代汉语中自然、庄重且准确的表达。
- source_word: τῷ λόγῳ τῆς χάριτος αὐτοῦ
  choice: 他恩典的道
  rationale: 保留原文属格结构及 λόγος 的神学分量；“道”在此可指所宣讲的信息，同时比单译“信息”更贴近原文。
- source_word: τῷ δυναμένῳ
  choice: 这道能
  rationale: 主文按最近的先行词“他恩典的道”理解该单数分词；原文也可能主要指上帝，因此以脚注保留另一种理解。
- source_word: οἰκοδομῆσαι
  choice: 造就你们
  rationale: 该词在此为属灵意义上的建立、培育；宾语虽未明说，却可由上文“你们”自然补出，使中文完整清楚。
- source_word: δοῦναι τὴν κληρονομίαν
  choice: 赐下那份产业
  rationale: “赐下”符合上帝施予的语境；“产业”保留 κληρονομία 在圣经中的承受之份这一意涵，“那份”体现定冠词的特指。
- source_word: ἐν τοῖς ἡγιασμένοις πᾶσιν
  choice: 在所有已经分别为圣的人中
  rationale: 用动词性表达保留完成时被动态，即已经被分别为圣且其结果持续；“在……中”直接呈现 ἐν 的群体范围含义。
theological_decisions:
- issue: τῷ δυναμένῳ所指的是上帝，还是“他恩典的道”
  choice: 主文译作“这道能”，指向最近的先行词“他恩典的道”
  alternative: 也可译作“他能”，主要指上帝
  rationale: 希腊文语法容许两种理解。最近的先行词是“道”，且经文可以把造就人的功效归于上帝恩典的道；但赐产业的终极施行者是上帝。主文采用近指理解，并用脚注保存真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“分别为圣”较“圣徒”更明确保留完成时被动态；分号帮助读者辨明托付对象与后续关系从句。
