base_translation:
  language: en
  yaml_path: translation/nt/acts/013/005.yaml
  text: And when they arrived at Salamis[a], they proclaimed the word of God in the synagogues of the Jews[b]; and they also had John as an assistant.
translation:
  language: zh_hans
  text: 他们到了撒拉米[a]，在犹太人的会堂里宣讲上帝的道；他们也带着约翰作助手[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“来到撒拉米以后”。
    reason: lexical_alternative
  - marker: b
    text: “助手”也可译作“帮手”或“侍从”。
    reason: lexical_alternative
lexical_decisions:
- source_word: γενόμενοι ἐν Σαλαμῖνι
  choice: 到了撒拉米
  rationale: 该表达由γίνομαι的不定过去时分词与地点短语构成，在这里自然表示抵达某地；中文用“到了”简洁地传达其先于主句行动发生的背景。
- source_word: κατήγγελλον
  choice: 宣讲
  rationale: καταγγέλλω指公开宣告、传扬；“宣讲”既保留公开传播信息的意味，也符合本节会堂语境，同时不限定为某种固定讲道形式。
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: 上帝的道
  rationale: 保留原文属格结构及λόγος作为上帝信息、话语的开放含义；“上帝的道”是庄重而通行的中文表达。
- source_word: ἐν ταῖς συναγωγαῖς τῶν Ἰουδαίων
  choice: 在犹太人的各会堂里
  rationale: 复数冠词短语表明不止一处会堂，故译“各会堂”；Ἰουδαίων在此为族群—宗教意义，译作“犹太人”比“犹太地人”准确。
- source_word: εἶχον δὲ καὶ Ἰωάννην
  choice: 他们也带着约翰
  rationale: 直译为“他们也有约翰”在现代中文中生硬；旅行叙事里“带着约翰”自然表达约翰随行并承担职分，同时保留καί的附加意味。
- source_word: ὑπηρέτην
  choice: 作助手
  rationale: ὑπηρέτης可指助手、侍从或服事者；“助手”符合团队事工与旅行语境，并避免“仆人”可能带来的奴役含义。
