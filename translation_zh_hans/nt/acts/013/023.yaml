id: ACT.13.23
reference: Acts 13:23
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: τούτου ὁ θεὸς ἀπὸ τοῦ σπέρματος κατ’ ἐπαγγελίαν ἤγαγεν τῷ Ἰσραὴλ ⸂σωτῆρα Ἰησοῦν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/023.yaml
  text: From this man's offspring[a], God has brought to Israel a Savior, Jesus[b], according to promise.
translation:
  language: zh_hans
  text: 神照着应许[b]，从这个人的后裔[a]中，为以色列带来了一位救主，就是耶稣。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “后裔”原文直译为“种子”，这里指大卫的后代。
    reason: lexical_alternative
  - marker: b
    text: “照着应许”也可译作“按照所应许的”或“正如神所应许的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τούτου
  choice: 这个人的
  rationale: 属格指回上一节的大卫；译作“这个人的”既明确所指是人，也保留与“后裔”的所属关系。
- source_word: ἀπὸ τοῦ σπέρματος
  choice: 从……后裔中
  rationale: σπέρμα本义为“种子”，也可指后裔；本节谈大卫的谱系，“后裔”符合现代汉语表达，同时保留血统含义。
- source_word: κατ’ ἐπαγγελίαν
  choice: 照着应许
  rationale: 表示神的行动与先前的应许相符；原文未明说应许的具体内容，因此正文不补作“给大卫的应许”。
- source_word: ἤγαγεν
  choice: 带来
  rationale: ἄγω的直接含义是“带来、领来”。这里译作“带来”，避免用“兴起”而可能让读者误以为专指复活。
- source_word: τῷ Ἰσραήλ
  choice: 为以色列
  rationale: 与格既可表达对象，也带有受益意味；“为以色列”在现代汉语中自然，并恰当地体现此处的受益关系。
- source_word: σωτῆρα
  choice: 一位救主
  rationale: σωτήρ可指拯救者；在此基督论语境中，“救主”是准确、庄重且通行的译法。
- source_word: Ἰησοῦν
  choice: 耶稣
  rationale: 按现代汉语圣经人名的通行形式音译。
theological_decisions:
- issue: 耶稣与大卫之约的关系
  choice: 保留“照着应许”这一概括说法，将耶稣的大卫后裔身份与神的应许相连。
  alternative: 明确扩译为“照着给大卫的应许”或“为要应验给大卫的应许”。
  rationale: 上下文使读者能够理解这与大卫有关，但本节原文没有明说应许的接受者，也没有使用“应验”一词，因此不在正文中补足。
- issue: ἤγαγεν是否译作“兴起”
  choice: 译作“带来”。
  alternative: 译作“兴起”或“使……出现”。
  rationale: “带来”较直接对应ἄγω，也不把本节提前限定为复活用语；神使救主临到以色列的神学含义仍得到保留。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“这个人”承接上一节的大卫；“就是耶稣”自然呈现“救主”与“耶稣”的同位关系。脚注标记按其实际说明对象安置。
