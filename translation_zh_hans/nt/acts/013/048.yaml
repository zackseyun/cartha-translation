  text: ἀκούοντα δὲ τὰ ἔθνη ⸀ἔχαιρον καὶ ἐδόξαζον τὸν λόγον τοῦ ⸀κυρίου, καὶ ἐπίστευσαν ὅσοι ἦσαν τεταγμένοι εἰς ζωὴν αἰώνιον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/048.yaml
  text: When the Gentiles heard this[a], they began rejoicing and glorifying the word of the Lord, and all who had been appointed for eternal life believed.
translation:
  language: zh_hans
  text: 外邦人听见这话，就欢喜起来，颂扬主的道；凡被指定归入永生的人[a]都信了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“凡倾向于永生的人”。这个希腊语分词可有不同理解；但在这里理解为被动意义的“被指定”，是较直接的译法。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούοντα
  choice: 听见这话
  rationale: 该现在分词在句中表示伴随情境；根据上文补出“这话”，使现代汉语表达完整自然。
- source_word: τὰ ἔθνη
  choice: 外族人
  rationale: 上下文所指是有别于犹太人的非犹太人；“外族人”既传达这一语境含义，也比音译式或较陈旧的称谓更便于普通读者理解。
- source_word: ἔχαιρον
  choice: 欢喜起来
  rationale: 未完成时可呈现持续或起始性的叙事动作；“欢喜起来”在此自然表达听闻之后出现的欢喜反应。
- source_word: ἐδόξαζον
  choice: 颂扬
  rationale: δοξάζω在此以“主的道”为宾语，含尊崇、赞扬之意；“颂扬”比直译为“荣耀”更符合现代汉语搭配，同时保留敬重与赞美的力度。
- source_word: τὸν λόγον τοῦ κυρίου
  choice: 主的道
  rationale: λόγος在这里指所宣讲的信息；“道”保留圣经惯用语及其神学意味，并能自然地指主的信息。
- source_word: ἐπίστευσαν
  choice: 信了
  rationale: 简洁对应不定过去时陈述的信从行动，不额外补入原文未明说的对象或过程。
- source_word: ὅσοι
  choice: 凡……的人都
  rationale: 准确表达该关系代词的数量概括力，也符合现代汉语习惯。
- source_word: τεταγμένοι
  choice: 被指定
  rationale: 该词是τάσσω的完成时被动分词；“被指定”保留被动语态以及先前已形成状态的含义，不把经文扩展成完整的预定论陈述。
- source_word: εἰς ζωὴν αἰώνιον
  choice: 得永生
  rationale: εἰς在此表达所指向的结果或归向；“得永生”是自然、清楚的汉语表达，并与“被指定”顺畅衔接。
theological_decisions:
- issue: τεταγμένοι所表达的是外在指定，还是人对永生的内在趋向
  choice: 被指定得永生
  alternative: 倾向于追求永生
  rationale: 完成时被动分词最直接的理解是已经被指定或安排。正文保留这一语法力量，但不说明指定者、方式或完整的预定教义；另将有争议的“倾向”理解列入脚注，以保存解释上的张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“外族人”清楚表达非犹太人的语境身份；“主的道”保留圣经语体而不显生硬。分号呈现前后两个相关但各自完整的叙事重点。
