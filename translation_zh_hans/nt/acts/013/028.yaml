base_translation:
  language: en
  yaml_path: translation/nt/acts/013/028.yaml
  text: And though they found no basis for a death sentence[b][a], they asked Pilate to have him executed.
translation:
  language: zh_hans
  text: 他们虽然找不到任何足以判处死刑的罪状[a]，还是请求彼拉多处死他[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“找不到任何足以判死刑的罪名”，或“找不到任何判处死刑的法律根据”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“把他杀死”。
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδεμίαν αἰτίαν θανάτου
  choice: 找不到任何该判死刑的罪状
  rationale: αἰτία在司法语境中可指控罪、案件或法律根据；与θανάτου连用，表示足以判处死刑的罪状或依据。此译自然地传达法律含义，同时保留“罪状”和“依据”之间的词义空间。
- source_word: εὑρόντες
  choice: 虽然找不到
  rationale: 不定过去时分词在主句动作之前发生；结合上下文具有让步意味，即他们没有找到死罪根据，却仍请求处死耶稣。用“虽然”明示这种张力。
- source_word: ᾐτήσαντο
  choice: 请求
  rationale: αἰτέω表示请求或要求；此处对象是彼拉多，且涉及司法处决，采用“请求”比日常口吻的“问”更合适。
- source_word: Πιλᾶτον
  choice: 彼拉多
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: ἀναιρεθῆναι αὐτόν
  choice: 处死他
  rationale: ἀναιρέω在此指杀死或除掉；在罗马司法语境中，“处死”准确而简洁地表达执行死刑的含义。
- source_word: καὶ
  choice: 还是
  rationale: καί本身承接叙事；中文句内以“虽然……还是……”自然呈现其连接作用及上下文中的让步张力，而不另加句首“并且”。
theological_decisions:
- issue: 是否明确表达分词结构的让步意味
  choice: 他们虽然……还是……
  alternative: 他们找不到……便请求……／他们找不到……，却请求……
  rationale: 希腊文分词形式本身可作一般情状或时间理解，但上下文清楚形成“没有死罪依据，仍要求处死”的张力。“虽然……还是……”将其自然呈现，并未增添教派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“该判死刑的罪状”保留司法语境；“处死”简洁明确。所有脚注标记均置于正文相关词句之后。
