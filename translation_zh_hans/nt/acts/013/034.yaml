  text: ὅτι δὲ ἀνέστησεν αὐτὸν ἐκ νεκρῶν μηκέτι μέλλοντα ὑποστρέφειν εἰς διαφθοράν, οὕτως εἴρηκεν ὅτι Δώσω ὑμῖν τὰ ὅσια Δαυὶδ τὰ πιστά.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/034.yaml
  text: 'And that he raised him from the dead, no longer about to return to decay, he has spoken in this way: ‘I will give you the holy and sure blessings of David.’'
translation:
  language: zh_hans
  text: 至于神使他从死人中复活，不再归于朽坏，神曾这样说：“我要把大卫那圣洁、可靠的恩惠赐给你们。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我要把大卫那可靠的慈爱赐给你们。”此语引自《以赛亚书》55:3。希腊语短语可指与大卫有关、圣洁而可靠的盟约恩惠或应许。
    reason: 希腊短语τὰ ὅσια Δαυὶδ τὰ πιστά含义简略，并带有《以赛亚书》55:3的引文背景；脚注保留“慈爱”这一传统译法，并说明其盟约语境。
lexical_decisions:
- source_word: ἀνέστησεν αὐτὸν ἐκ νεκρῶν
  choice: 使他从死人中复活
  rationale: ἐκ νεκρῶν明确指复活；“使……复活”自然表达使役含义，并保留神主动施行的行动。
- source_word: μηκέτι μέλλοντα ὑποστρέφειν εἰς διαφθοράν
  choice: 使他不再归于朽坏
  rationale: “不再”体现μηκέτι，“归于”对应ὑποστρέφειν；在复活语境中，“朽坏”准确表达διαφθορά所指的身体腐朽，又保留圣经语体。
- source_word: οὕτως εἴρηκεν
  choice: 神曾这样说
  rationale: “这样说”自然引出下文引语；“曾”适度体现完成时所指向的既已说出、现仍有效的经文话语。中文为避免连续两个“他”造成指代混乱，按上下文明确主语为神。
- source_word: Δώσω ὑμῖν
  choice: 我要……赐给你们
  rationale: 忠实表达第一人称将来应许；“赐给”比普通的“给”更符合神赐下福分的庄重语境。
- source_word: τὰ ὅσια Δαυὶδ τὰ πιστά
  choice: 大卫那圣洁、可靠的福分
  rationale: 该短语承接以赛亚书55:3，所指是与大卫相关、确实可信的神圣盟约恩惠。“福分”自然承载中性复数实体化用法，同时不把含义过度限定为某一种教义术语；“圣洁、可靠”分别呈现ὅσια与πιστά。
theological_decisions:
- issue: 如何翻译以赛亚书55:3引文τὰ ὅσια Δαυὶδ τὰ πιστά
  choice: 大卫那圣洁、可靠的福分
  alternative: 大卫那可靠的慈爱；应许给大卫的圣洁、可靠之事
  rationale: 希腊短语简略而具有多义性，可指与大卫有关的神圣恩惠、可靠的慈爱或盟约应许。正文采用自然且较宽的“福分”，既配合保罗关于复活的论证，也不把“大卫”与这些福分之间的关系擅自限定为所有、受领或应许对象；脚注保留传统及盟约语境中的其他理解。
- issue: ἀνέστησεν的主语是否明说为神
  choice: 明说“神”
  alternative: 保留代词“他”
  rationale: 希腊文主语承接上下文，指神；若逐字写成“他使他复活”，现代汉语指代含混。明确“神”是为消除目标语歧义，并未增加新的神学断言。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“从死人中复活”“归于朽坏”保留使徒行传论证所需的复活与身体腐朽意象；引文用“福分”避免生硬的“圣物”或容易被理解为品德评价的“怜悯”。
