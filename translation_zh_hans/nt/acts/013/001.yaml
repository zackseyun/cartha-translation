source:
  edition: SBLGNT
  text: Ἦσαν ⸀δὲ ἐν Ἀντιοχείᾳ κατὰ τὴν οὖσαν ἐκκλησίαν προφῆται καὶ διδάσκαλοι ὅ τε Βαρναβᾶς καὶ Συμεὼν ὁ καλούμενος Νίγερ, καὶ Λούκιος ὁ Κυρηναῖος, Μαναήν τε Ἡρῴδου τοῦ τετραάρχου σύντροφος καὶ Σαῦλος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/001.yaml
  text: 'In Antioch[a], in the church there, there were prophets and teachers: Barnabas, Simeon who was called Niger, Lucius the Cyrenian, Manaen, a close companion of Herod the tetrarch[c][b], and Saul.'
translation:
  language: zh_hans
  text: 在安提阿的教会中，有先知和教师：巴拿巴，称为尼结[a]的西面，古利奈人路求[b]，与分封王希律一同长大的马念[c]，以及扫罗。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “尼结”是一个拉丁语名字，意思是“黑色”或“黑”。这里将其作为别名音译，而不在正文中意译。
    reason: lexical_alternative
  - marker: b
    text: 古利奈位于北非；“古利奈人”指来自古利奈的人。
    reason: cultural_note
  - marker: c
    text: 或译“分封王希律的养兄弟”，也可理解为“分封王希律的亲密同伴”。原词通常指与某人一同受养育或一同长大的人。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἦσαν δὲ
  choice: 有几位
  rationale: Ἦσαν是表示存在的主要动词；δὲ是轻微的承接词。汉语按自然叙述不必另加“现在”或强转折词。“几位”配合后面的人员名单，使存在句通顺。
- source_word: ἐν Ἀντιοχείᾳ κατὰ τὴν οὖσαν ἐκκλησίαν
  choice: 在安提阿当地的教会中
  rationale: 合并两个地点表达，既保留安提阿这一地点，也自然表达当地现有的教会；避免把κατά机械译为“按照”。
- source_word: ἐκκλησίαν
  choice: 教会
  rationale: 在《使徒行传》的语境中指当地的基督徒群体；“教会”是现代汉语中清楚而通行的译法。
- source_word: προφῆται καὶ διδάσκαλοι
  choice: 先知和教师
  rationale: 直接保留经文所列的两类服事者，不引入后期教会制度上的额外含义。
- source_word: Συμεὼν ὁ καλούμενος Νίγερ
  choice: 称为尼结的西面
  rationale: “西面”对应Συμεών，与Σίμων所对应的“西门”有所区别；καλούμενος自然译为“称为”。Νίγερ作为拉丁语别名音译，并以脚注说明词义。
- source_word: Λούκιος ὁ Κυρηναῖος
  choice: 古利奈人路求
  rationale: ὁ Κυρηναῖος表示来自古利奈的人；汉语用“古利奈人”简明自然，并保留传统上易识别的人名“路求”。
- source_word: Μαναήν
  choice: 马念
  rationale: 采用现代中文圣经读者较熟悉的传统音译。
- source_word: Ἡρῴδου τοῦ τετραάρχου
  choice: 分封王希律
  rationale: τετραάρχης是罗马统治体系下的地方统治者称号；“分封王”是中文圣经语境中通行且易懂的表达。原文只称“希律”，不擅自补入“安提帕”。
- source_word: σύντροφος
  choice: 一同长大的
  rationale: 该词可指自幼一同受养育或一同长大的人。正文采用关系明确但不过度限定其法律或家庭身份的译法，并在脚注列出其他可能理解。
- source_word: Σαῦλος
  choice: 扫罗
  rationale: 采用该人物在《使徒行传》这一阶段通行的中文名称。
theological_decisions:
- issue: 安提阿教会中“先知和教师”的性质
  choice: 按原文直接译为“先知和教师”，视为当地教会中被如此描述的服事者。
  alternative: 将其解释为后世制度中有固定层级和权限的正式圣职。
  rationale: 本节列出这些人的服事类别，却没有界定后期教会组织架构；译文不加入宗派性的职分体系。
- issue: 马念与希律的关系
  choice: 译为“与分封王希律一同长大的”。
  alternative: “分封王希律的养兄弟”或“分封王希律的亲密同伴”。
  rationale: σύντροφος通常涉及共同成长或共同受养育，但不足以确定两人具有正式的养兄弟关系；正文保留共同成长这一核心含义，脚注说明可能的较宽或较窄理解。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。句式以“在……中，有……”自然呈现希腊文存在句，并用冒号引出名单。人名采用中文圣经传统中较易识别的译名；对“尼结”、古利奈及σύντροφος的文化和词义信息放入脚注，避免正文臃肿或过度解释。
