source:
  edition: SBLGNT
  text: οἱ δὲ Ἰουδαῖοι παρώτρυναν τὰς σεβομένας ⸀γυναῖκας τὰς εὐσχήμονας καὶ τοὺς πρώτους τῆς πόλεως καὶ ἐπήγειραν διωγμὸν ἐπὶ τὸν Παῦλον ⸀καὶ Βαρναβᾶν, καὶ ἐξέβαλον αὐτοὺς ἀπὸ τῶν ὁρίων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/050.yaml
  text: But the Jews stirred up the devout women of high standing and the leading men of the city[b][a], and stirred up persecution against Paul and Barnabas and drove them out of their district.
translation:
  language: zh_hans
  text: 可是，犹太人煽动那些敬虔而显贵的妇女[a]和城中的首要人物，挑起对保罗和巴拿巴的迫害，并把他们赶出当地的地区[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“敬畏上帝的妇女”。这里的词可指敬拜以色列的上帝、可能与会堂有关联的妇女；经文并未明说她们的族裔或正式身份。
    reason: lexical_alternative
  - marker: b
    text: 或译“赶出他们的辖区”或“赶过他们的边界”。希腊语可指地域边界，也可指边界以内的地区。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ Ἰουδαῖοι
  choice: 可是，犹太人
  rationale: δέ承接上文并形成明显转折；“可是”自然体现叙事方向的转变。
- source_word: παρώτρυναν
  choice: 煽动了
  rationale: 表达主动唆使并激起敌对行动的含义，力度与语境相符。
- source_word: τὰς σεβομένας γυναῖκας
  choice: 敬畏上帝……的妇女
  rationale: 在《使徒行传》的语境中，σέβομαι常指敬拜以色列的上帝、与会堂有关联的人；译文明确其敬虔对象，同时脚注保留较宽泛的译法。
- source_word: τὰς εὐσχήμονας
  choice: 身份尊贵的
  rationale: 兼顾社会地位和公众声望，比单纯的“受人尊敬”更能体现此处社会影响力。
- source_word: τοὺς πρώτους τῆς πόλεως
  choice: 城里的首要人物
  rationale: 指城中居于前列、具有权势或地位的人；希腊语阳性复数在此也可能按群体通称理解，中文不强行补入“男性”。
- source_word: ἐπήγειραν διωγμὸν
  choice: 挑起……迫害
  rationale: 保留使迫害兴起的使动含义，并避免在中文中重复使用“煽动”而显得生硬。
- source_word: ἐπὶ τὸν Παῦλον καὶ Βαρναβᾶν
  choice: 对保罗和巴拿巴
  rationale: 在“迫害”的搭配中自然表达敌对行动所针对的对象。
- source_word: ἐξέβαλον
  choice: 赶出了
  rationale: 体现强制驱逐的力度，且符合现代汉语叙事表达。
- source_word: ἀπὸ τῶν ὁρίων αὐτῶν
  choice: 赶出了当地的境界
  rationale: ὅρια可指边界，也可转指边界以内的地区；“当地的境界”保留这种空间含义，脚注列出自然的替代译法。
theological_decisions:
- issue: σεβομένας是否作为特定宗教身份术语处理
  choice: 敬畏上帝的妇女
  alternative: 虔诚的妇女／敬拜上帝的妇女
  rationale: 此词在《使徒行传》中常用于与犹太会堂有关联、敬拜以色列上帝的人，但经文本身未明确说明她们的族裔或正式身份；正文呈现宗教指向，脚注避免把“外邦归附者”等推断写入正文。
- issue: τοὺς πρώτους的性别表达
  choice: 城里的首要人物
  alternative: 城里的首要男人／城里的领袖
  rationale: 原文为语法上的阳性复数，可指当地居首位的人；上下文没有足够依据要求中文明确断定全为男性，因此采用自然而不额外限定性别的表达。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“煽动”“挑起”“赶出”形成递进，保留原文敌对行动的力度；两个脚注标记均紧随相关词语。
