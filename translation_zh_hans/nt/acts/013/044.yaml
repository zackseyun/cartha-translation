id: ACT.13.44
reference: Acts 13:44
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Τῷ ⸀δὲ ἐρχομένῳ σαββάτῳ σχεδὸν πᾶσα ἡ πόλις συνήχθη ἀκοῦσαι τὸν λόγον τοῦ ⸀κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/044.yaml
  text: On the coming Sabbath[b][a], nearly the whole city gathered together to hear the word of the Lord.
translation:
  language: zh_hans
  text: 到了下一个安息日[a]，几乎全城的人都聚集起来，要听主的道[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“接下来的安息日”或“随后的安息日”。
    reason: lexical_alternative
  - marker: b
    text: “主的道”也可理解为“主的信息”；按上下文，也可能包含“关于主的信息”的意思。
    reason: alternative_reading
lexical_decisions:
- source_word: Τῷ δὲ ἐρχομένῳ σαββάτῳ
  choice: 到了下一个安息日
  rationale: 该与格结构表示时间；ἐρχομένῳ可指“来到的、接下来的”。“到了下一个安息日”在现代汉语中自然，也符合上下文的时间推进。
- source_word: σχεδὸν
  choice: 几乎
  rationale: 准确表达“差不多、几近”的程度，保留原文并非绝对全数的限定。
- source_word: πᾶσα ἡ πόλις
  choice: 全城的人
  rationale: 原文按字面是“全城”，实际泛指城中居民；补出“的人”符合现代汉语习惯，同时保留概括性、带夸张色彩的表达。
- source_word: συνήχθη
  choice: 都聚集起来
  rationale: 该被动形式在此具有不及物含义，指众人聚到一起；“聚集起来”自然体现共同集合的动作。
- source_word: ἀκοῦσαι
  choice: 要听
  rationale: 不定式表示聚集的目的；“要听”简洁自然地表达“为了听”。
- source_word: τὸν λόγον
  choice: 道
  rationale: λόγος在《使徒行传》中常指所宣讲的福音信息。“道”是简洁、庄重且能维持路加重复用语的中文表达。
- source_word: τοῦ κυρίου
  choice: 主的
  rationale: 保留属格的简洁结构，不明确限定为“来自主”或“关于主”，从而维持原文可能重叠的含义。
theological_decisions:
- issue: κύριος的译法
  choice: 主
  alternative: 主人
  rationale: “主”是中文圣经语境中κύριος的自然对应，也符合《使徒行传》的宣讲用语；原文没有要求进一步限定所指。
- issue: τὸν λόγον τοῦ κυρίου的属格含义
  choice: 主的道
  alternative: 主所传的信息；关于主的信息
  rationale: 保留简洁的属格结构，使其既可理解为属于或来自主的信息，也可在上下文中包含关于主的信息，避免替原文消除语义张力。
translation_notes:
  register: 采用现代、庄重而通顺的标准普通话。“全城的人”避免把城市本身当作动作主体；“主的道”保留《使徒行传》中反复出现的宣讲术语及属格歧义。脚注标记依正文出现顺序排列。
