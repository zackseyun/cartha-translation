base_translation:
  language: en
  yaml_path: translation/nt/acts/013/008.yaml
  text: But Elymas the magician opposed them—for that is how his name is translated—seeking to turn the proconsul away from the faith[a][b].
translation:
  language: zh_hans
  text: 但那名叫以吕马的术士（这名字翻译出来就是“术士”[b]）反对他们，企图使方伯离开信仰[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使方伯不信。”希腊文既可指使他离开这信仰，也可泛指阻止他作出相信的回应。
    reason: alternative_reading
  - marker: b
    text: 原文说明“以吕马”是翻译或解释出来的名字；其确切词源并不确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθίστατο
  choice: 反对
  rationale: 未完成时描写持续进行的对抗；“反对”自然、清楚，又不增添原文没有的强烈色彩。
- source_word: δὲ
  choice: 但
  rationale: 承接上文，并凸显以吕马的阻挠与方伯寻求听神之道之间的反差。
- source_word: αὐτοῖς
  choice: 他们
  rationale: 保留希腊文代词，所指可由上下文明确为巴拿巴和扫罗。
- source_word: Ἐλύμας ὁ μάγος
  choice: 术士以吕马
  rationale: “以吕马”按音译处理；μάγος在此指从事法术的人，“术士”既通俗又保留其历史语境，避免现代舞台“魔术师”的联想。
- source_word: οὕτως γὰρ μεθερμηνεύεται τὸ ὄνομα αὐτοῦ
  choice: 他的名字翻译出来就是这个意思
  rationale: μεθερμηνεύεται可指翻译或解释；此译保留作者对名字的说明，同时不武断断定其确切词源。
- source_word: ζητῶν
  choice: 想要
  rationale: 该分词表达伴随反对行动的企图或目的；“想要”符合现代汉语叙事。
- source_word: διαστρέψαι
  choice: 使……偏离
  rationale: 此处以人为宾语，并接ἀπό说明所离开的对象，因此译作“使……偏离”比“歪曲”更贴切。
- source_word: τὸν ἀνθύπατον
  choice: 方伯
  rationale: ἀνθύπατος是罗马行省的特定官衔；“方伯”为中文圣经传统中较熟悉且简洁的历史称谓。
- source_word: ἀπὸ τῆς πίστεως
  choice: 偏离这信仰
  rationale: 定冠词及语境较支持特指正在传讲的信仰；用“这信仰”自然表达其特指性，并以脚注保留也可理解为使方伯不去相信。
theological_decisions:
- issue: πίστις在ἀπὸ τῆς πίστεως中的所指
  choice: 这信仰
  alternative: 信；相信
  rationale: 定冠词和上下文可指基督信仰这一具体内容，但短语也可能侧重方伯相信福音的回应。正文采用较可能的特指读法，脚注保留另一层含义，避免消除原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“术士”避免“魔术师”的娱乐表演含义；“方伯”保留罗马官衔的历史准确性。破折号呈现原文解释名字的插入语。所有脚注标记均置于正文相应位置。
