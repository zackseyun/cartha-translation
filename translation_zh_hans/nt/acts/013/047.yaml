  text: οὕτως γὰρ ἐντέταλται ἡμῖν ὁ κύριος· Τέθεικά σε εἰς φῶς ἐθνῶν τοῦ εἶναί σε εἰς σωτηρίαν ἕως ἐσχάτου τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/047.yaml
  text: 'For so the Lord has commanded us: ‘I have set you as a light for the nations[b][a], so that you may be for salvation to the end of the earth.’'
translation:
  language: zh_hans
  text: '因为主这样吩咐我们：


    “我已立你作列国之光[a]，


    使你成为救恩，直到地极[b]。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“作外邦人的光”。希腊语ἐθνῶν既可指“列国”，也常可指“外邦人”。
    reason: lexical_alternative
  - marker: b
    text: 也可译“直到大地最远之处”。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως γὰρ
  choice: 因为……这样
  rationale: γὰρ说明保罗和巴拿巴采取行动的依据；οὕτως指下文所引命令的内容与方式。此译自然保留因果和引介作用。
- source_word: ἐντέταλται
  choice: 曾这样吩咐
  rationale: 该完成时表达已经颁下、现今仍具效力的命令。“吩咐”既体现权威，也比“下令”更适合经文引语的庄重语境。
- source_word: ὁ κύριος
  choice: 主
  rationale: 此处指引文中发言的神；“主”保留其权威与神学含义。
- source_word: Τέθεικά σε
  choice: 我已立你
  rationale: τίθημι的完成时表示已经确立的任命。“立……作……”简洁地表达设立和委任的含义。
- source_word: εἰς φῶς ἐθνῶν
  choice: 作列国之光
  rationale: εἰς在此表示任命的身份或作用；“列国”保留ἐθνῶν可指各民族或外邦人的宽广含义，另一可能译法列入脚注。
- source_word: τοῦ εἶναί σε εἰς σωτηρίαν
  choice: 使你成为救恩
  rationale: τοῦ加不定式表达目的或结果。“成为救恩”贴近希腊文的凝练表达，不擅自解释为“传扬救恩”或“带来救恩”，从而保留所指角色与救恩之间的张力。
- source_word: ἕως ἐσχάτου τῆς γῆς
  choice: 直到地极
  rationale: 该单数短语指大地最远的边界。“地极”简洁、庄重，也符合现代汉语中可理解的经文表达；较直白的译法列入脚注。
theological_decisions:
- issue: 以赛亚仆人经文如何应用于保罗和巴拿巴的使命
  choice: 引文继续使用单数“你”，不在正文中说明“你”具体指谁，也不改写成复数。
  alternative: 将引文直接改写为对使徒们的命令，或在译文中明确认定受话者。
  rationale: 希腊文直接引用单数形式的经文，却没有明说仆人经文与使徒使命之间的关系。保留单数和未明说的指向，可避免替原文消解其神学张力。
- issue: εἰς σωτηρίαν所表达的身份、工具或结果关系
  choice: 译为“成为救恩”。
  alternative: 译为“带来救恩”或“传扬救恩”。
  rationale: 原文表达凝练，可涉及身份、使命或结果。正文采用贴近原文而不过度阐释的说法，避免把关系限定为传播或工具作用。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。引文按诗行排布，以呈现其经文引用性质；保留单数“你”和“成为救恩”的凝练措辞，不补入原文没有明说的对象、方式或神学解释。
