  source_fidelity: 译文整体忠实呈现了两个同时进行的分词、圣灵直接说话、为圣灵而作的分别，以及先前已经发出的呼召。“现在”可合理体现δή所带的催促/即时语气。惟“好去做我已经召他们去做的工作”在汉语中重复，且“好去做”略将“分别出来”与后面的工作处理为额外目的链；原文更直接地说把他们分别出来，归于/为了那工作。
  naturalness: “他们事奉主、禁食的时候”基本自然，但“当他们事奉主并禁食的时候”更清楚地标明两项并行动作。“为着我所召他们去从事的工作”既庄重自然，也避免连续重复“去做”。
  terminology: “事奉主”“禁食”“圣灵”“分别出来”“巴拿巴”“扫罗”均符合现代标准汉语基督教文本的通行用语。脚注准确保留λειτουργούντων可理解为“敬拜主”的语义可能，且没有把该词限缩为正式礼仪。
