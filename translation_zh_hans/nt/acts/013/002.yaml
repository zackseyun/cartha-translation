  text: λειτουργούντων δὲ αὐτῶν τῷ κυρίῳ καὶ νηστευόντων εἶπεν τὸ πνεῦμα τὸ ἅγιον· Ἀφορίσατε δή μοι τὸν Βαρναβᾶν ⸀καὶ Σαῦλον εἰς τὸ ἔργον ὃ προσκέκλημαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/002.yaml
  text: While they were ministering to the Lord and fasting[a], the Holy Spirit said, “Set apart for me Barnabas and Saul for the work to which I have called them.”
translation:
  language: zh_hans
  text: 当他们事奉主并禁食的时候，圣灵说：“现在要为我把巴拿巴和扫罗分别出来，为着我所召他们去从事的工作。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λειτουργούντων
  choice: 事奉
  rationale: 该分词指承担服务，常带敬拜或礼仪色彩。“事奉”既保留服事的含义，也能自然传达向主敬拜、献上服事的语境，而不把它限定为某种正式礼仪。
- source_word: τῷ κυρίῳ
  choice: 主
  rationale: 与“事奉”搭配时，汉语“事奉主”自然表达该服事所指向的对象；κύριος按通行神学用语译为“主”。
- source_word: νηστευόντων
  choice: 禁食
  rationale: 准确表达为宗教目的而不进食，并与“事奉”同为当时正在进行的活动。
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: 圣灵
  rationale: 采用现代汉语基督教语境中的标准译名，并保留圣灵作为说话主体的表达。
- source_word: Ἀφορίσατε
  choice: 分别出来
  rationale: 表达从群体中划分出来、留作特定用途之意，同时不将其过度具体化为按立或任命某种教会职分。
- source_word: δή
  choice: 现在
  rationale: δή加强命令的紧迫性或即时性；译作“现在”可在自然汉语中体现这一语气。
- source_word: μοι
  choice: 为我
  rationale: 表达这次分别是为了圣灵的目的和差遣，符合与ἀφορίσατε搭配的与格含义。
- source_word: Βαρναβᾶν καὶ Σαῦλον
  choice: 巴拿巴和扫罗
  rationale: 采用现代简体中文圣经人名的通行音译。
- source_word: εἰς τὸ ἔργον
  choice: 去做……的工作
  rationale: ἔργον含义宽泛；“工作”保留其开放性，不预先缩窄为某种技术性的“事工”或职分。
- source_word: ὃ προσκέκλημαι αὐτούς
  choice: 我已经召他们去做的
  rationale: “已经召”体现完成时所表达的先前呼召及其当前效力；“去做”使汉语关系结构清楚自然。
theological_decisions:
- issue: λειτουργούντων在共同禁食和受差遣语境中的含义
  choice: 事奉主
  alternative: 敬拜主；服事主
  rationale: 原词兼有服务与敬拜、礼仪方面的色彩。“事奉主”在现代汉语中可以兼顾这两方面，又不把经文限定为正式礼仪活动；脚注保留“敬拜”的可能理解。
- issue: τὸ πνεῦμα τὸ ἅγιον的主体性
  choice: 圣灵说
  alternative: 无人格化的转述，如“有感动临到他们”
  rationale: 希腊文直接以圣灵为说话的主语，因此译文也直接保留这一表达，不将其弱化为人的内在感受。
- issue: ἀφορίσατε……εἰς τὸ ἔργον所表示的差遣
  choice: 为我……分别出来……去做……工作
  alternative: 任命……担任事工
  rationale: 经文表达为特定工作而分别和差遣，却没有明确使用按立或授予技术性教会职分的语言，因此不引入后来的制度类别。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“事奉主”保留原词兼具服事与敬拜的语义张力；“分别出来”避免过度制度化；以“现在”体现δή的即时语气。
