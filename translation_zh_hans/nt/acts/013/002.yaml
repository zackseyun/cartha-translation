  rationale: 仅作轻微的句法和文体修订。“并”明确两个分词所表达的并行活动；末句改为“为着我所召他们去从事的工作”，消除“去做……去做”的重复，并保留工作性质未明、呼召已先行发出的含义。脚注锚点和内容维持不变。
