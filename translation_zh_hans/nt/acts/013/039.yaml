  yaml_path: translation/nt/acts/013/039.yaml
  text: In him everyone who believes is justified[a].
translation:
  language: zh_hans
  text: 在他里面，所有信的人都得以称义[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“借着这一位，所有信的人都得以称义。”希腊语ἐν τούτῳ可较直译为“在这一位里面”或“借着这一位”；按上下文，这一位指耶稣。
    reason: 保留ἐν τούτῳ可作范围性或工具性理解的可能，并说明其在上下文中的所指。
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: 在他里面
  rationale: τούτῳ在紧接的上下文中回指耶稣；译作“在他里面”既保留ἐν的表达，也以自然的现代汉语呈现其人称所指。
- source_word: πᾶς ὁ πιστεύων
  choice: 所有信的人
  rationale: 带冠词的现在时分词在此作名词性、泛指用法；“所有信的人”自然地表达其普遍范围，又不把分词的体貌过度解释为某种特定行为模式。
- source_word: δικαιοῦται
  choice: 都被称为义
  rationale: 被动形式表明人领受这一判定；“称为义”保留δικαιόω在此语境中的法庭性含义，也避免把它窄化为单纯的无罪释放或解释成道德改造。
theological_decisions:
- issue: ἐν τούτῳ的所指及语义
  choice: 以人称方式回指耶稣：“在他里面”
  alternative: “借着这一位”或较直译的“在这一位里面”
  rationale: 前文以耶稣为赦罪宣告所借着的那一位，本句延续这一焦点。“在他里面”保留联合或范围层面的表达；脚注同时交代可能的工具性译法，不将希腊语的语义张力静默消除。
- issue: δικαιοῦται的神学语义
  choice: 法庭性表达：“被称为义”
  alternative: “被判为义”、“得以称义”或“被判无罪”
  rationale: 本节完整语境将摩西律法不能带来的结果与在耶稣里所得的称义相对照。“被称为义”保留司法判定意味，又不将其缩减为仅仅宣告无罪，也不混同于道德更新。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“被称为义”承接中文基督教语汇，但句法清楚；用“所有信的人”而非较书面的“凡信者”。脚注只说明真实存在的原文歧义。
