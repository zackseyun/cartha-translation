  text: ὃν δὲ ὁ θεὸς ἤγειρεν οὐκ εἶδεν διαφθοράν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/037.yaml
  text: But the one whom God raised up did not see decay[a].
translation:
  language: zh_hans
  text: 但上帝所复活的那一位，并没有经历朽坏[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“没有看见朽坏”。“朽坏”也可译作“腐朽”，这里指身体死后的腐坏；这一措辞呼应《诗篇》16:10的希腊文。
    reason: 说明原文惯用表达、词义范围及经文互文。
lexical_decisions:
- source_word: ὃν
  choice: 他……的那一位
  rationale: 关系代词指向前文所论的耶稣，并在关系从句中作宾语；这一表达在现代汉语中明确而自然。
- source_word: δὲ
  choice: 但
  rationale: 承接上一节大卫经历朽坏的陈述，清楚表达对比。
- source_word: ὁ θεὸς
  choice: 上帝
  rationale: 现代标准普通话中自然、庄重的 θεός 对应词。
- source_word: ἤγειρεν
  choice: 使……复活
  rationale: 本段将大卫死后朽坏与耶稣不见朽坏相对照，语境明确指上帝使耶稣从死人中复活；如此表达比字面的“使……起来”更自然，也没有超出语境。
- source_word: οὐκ εἶδεν
  choice: 并没有经历
  rationale: “看见朽坏”是闪语式表达；汉语用“经历”能自然传达进入或遭受某种状态的含义，而脚注保留较直译的措辞及经文呼应。
- source_word: διαφθοράν
  choice: 朽坏
  rationale: 该词在此指身体死后的腐朽；“朽坏”既符合现代汉语经文语体，也能保留与诗篇16:10希腊文本的词语呼应。
theological_decisions:
- issue: ἤγειρεν 的复活含义
  choice: 使……复活，指上帝使耶稣从死人中复活
  alternative: 兴起、使其出现或设立
  rationale: 紧邻语境把死后经历朽坏的大卫与没有经历朽坏的耶稣对比，因此这里的复活含义由上下文决定。
- issue: οὐκ εἶδεν διαφθοράν 的表达
  choice: 并没有经历朽坏
  alternative: 没有看见朽坏；没有遭受腐朽
  rationale: 正文采用自然汉语表达死亡与身体腐朽的关系，同时通过脚注保留希腊文较直译的形式和诗篇互文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“朽坏”保留经文语体和诗篇互文，“经历”则避免生硬照搬希腊语惯用法。
