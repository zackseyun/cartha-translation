  text: προκηρύξαντος Ἰωάννου πρὸ προσώπου τῆς εἰσόδου αὐτοῦ βάπτισμα μετανοίας ⸂παντὶ τῷ λαῷ⸃ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/024.yaml
  text: before his coming[b][a], John had proclaimed to all the people of Israel a baptism of repentance.
translation:
  language: zh_hans
  text: 在他到来[a]以前，约翰已经向以色列全体百姓宣讲悔改的洗礼[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在他出现以前。”原文是一个表示先于某人来到的习语，字面涉及“在他进入的面前”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“为悔改而受的洗礼。”
    reason: lexical_alternative
lexical_decisions:
- source_word: προκηρύξαντος
  choice: 已经……宣讲
  rationale: 该词为不定过去时分词，在此表示约翰先行公开宣告；用“已经……宣讲”自然表达相对于随后到来之事的时间先后，并保留公开传讲的意味。
- source_word: πρὸ προσώπου τῆς εἰσόδου αὐτοῦ
  choice: 在他到来以前
  rationale: 该短语字面涉及“在他进入的面前”，实际是表示先于某人来到的习语；“在他到来以前”既自然，也保留代词所指由上下文确定。
- source_word: εἰσόδου
  choice: 到来
  rationale: εἴσοδος本义可指进入、入场；本处指那一位的来到或出现，译作“到来”符合现代汉语。
- source_word: βάπτισμα μετανοίας
  choice: 悔改的洗礼
  rationale: 保留希腊语属格结构的开放性，使其既可表达以悔改为特征的洗礼，也不排除与悔改目的相关的理解。
- source_word: παντὶ τῷ λαῷ Ἰσραήλ
  choice: 向以色列全体百姓
  rationale: “向”体现与宣讲相关的间接对象；“全体百姓”同时表达παντί和λαῷ，指以色列这一整体民族。
- source_word: Ἰωάννου
  choice: 约翰
  rationale: 采用现代中文圣经传统中该人名的标准译法。
theological_decisions:
- issue: “他到来”中代词“他”的所指
  choice: 保留代词“他”，由上下文指向耶稣，即大卫后裔中的救主
  alternative: 在本节中直接译为“耶稣到来”
  rationale: 使徒行传13:23–25的语境足以确定所指，但本节希腊文本没有重复名字；保留代词可避免添加原文未明说的专名。
- issue: βάπτισμα μετανοίας中属格的关系
  choice: 译作“悔改的洗礼”，保留关系上的一定开放性
  alternative: 译作“使人悔改的洗礼”或“为悔改而受的洗礼”
  rationale: 原文属格可理解为性质、内容或目的等相关关系；不宜在正文中无依据地限定洗礼与悔改之间的精确神学关系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“宣讲”比“宣告”更贴合约翰公开传道的语境；“全体百姓”避免把παντί弱化为泛指。脚注标记均紧随相应短语。
