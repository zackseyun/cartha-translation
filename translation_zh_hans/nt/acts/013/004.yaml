  text: ⸀Αὐτοὶ μὲν οὖν ἐκπεμφθέντες ὑπὸ τοῦ ⸂ἁγίου πνεύματος⸃ κατῆλθον ⸀εἰς Σελεύκειαν, ἐκεῖθέν ⸀τε ἀπέπλευσαν ⸁εἰς Κύπρον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/004.yaml
  text: So they[a], having been sent out by the Holy Spirit, went down to Seleucia, and from there sailed away to Cyprus.
translation:
  language: zh_hans
  text: 于是，他们既受圣灵差遣，就下到塞琉西亚；从那里开船往塞浦路斯去。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Αὐτοὶ μὲν οὖν
  choice: 于是，他们
  rationale: 显式代词略带强调，μὲν οὖν承接上文并推进叙事；“于是，他们”自然表达这种承接关系，而不过度强化为“他们自己”。
- source_word: ἐκπεμφθέντες
  choice: 奉……差遣
  rationale: 该词为不定过去时被动分词，表示差遣先于后续行程；“奉……差遣”保留被动含义，并以自然中文衔接主句。
- source_word: ὑπὸ τοῦ ἁγίου πνεύματος
  choice: 奉圣灵
  rationale: ὑπό加属格标明施事者；上下文把圣灵呈现为主动差遣者，现代中文惯称“圣灵”。
- source_word: κατῆλθον εἰς Σελεύκειαν
  choice: 下到塞琉西亚
  rationale: κατέρχομαι含有“下去、下到”的具体方向感，在此可能指从内陆前往沿海；保留“下”而不额外解释地势。
- source_word: ἐκεῖθέν τε ἀπέπλευσαν εἰς Κύπρον
  choice: 又从那里乘船前往塞浦路斯
  rationale: ἐκεῖθεν表示出发点，τε连接后续行动，ἀποπλέω指乘船离去；“乘船前往”自然表达航海启程及目的地。
theological_decisions:
- issue: ἁγίου πνεύματος的译法
  choice: 圣灵
  alternative: 圣洁的灵
  rationale: 《使徒行传》的语境将其呈现为实施差遣的神圣位格性行动者；译作惯用专名“圣灵”符合原文所指，同时不在经文本身加入额外的教义说明。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语体。保留“下到”的空间方向感；地名按现代中文圣经通行形式译为“塞琉西亚”和“塞浦路斯”。
