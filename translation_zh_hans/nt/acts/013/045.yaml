  text: ἰδόντες δὲ οἱ Ἰουδαῖοι τοὺς ὄχλους ἐπλήσθησαν ζήλου καὶ ἀντέλεγον τοῖς ⸀ὑπὸ Παύλου ⸀λαλουμένοις ⸀βλασφημοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/045.yaml
  text: But when the Jews saw the crowds[a], they were filled with jealousy and began contradicting what was spoken by Paul[c][b], blaspheming.
translation:
  language: zh_hans
  text: 但犹太人看见群众[a]，就满心嫉妒[b]，反驳保罗所讲的话[c]，并且说亵渎的话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里指本段叙事中反对保罗的当地犹太人群体，并非泛指所有犹太人。
    reason: cultural_note
  - marker: b
    text: 或译“满心热忱”；但本处语境支持负面的“嫉妒”。
    reason: lexical_alternative
  - marker: c
    text: 直译“保罗所讲的话”；也可译“保罗正在讲的话”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες δὲ
  choice: 但……看见
  rationale: 以时间关系表达不定过去时分词ἰδόντες，并用“但”体现δέ承接上文时的转折。
- source_word: οἱ Ἰουδαῖοι
  choice: 犹太人
  rationale: 原文并未限定为领袖；正文保留群体称谓，脚注说明这是叙事现场中反对保罗的当地犹太人群体。
- source_word: τοὺς ὄχλους
  choice: 这些人群
  rationale: 保留ὄχλοι的复数含义；“这些”自然指向当时聚集来听道的群众。
- source_word: ἐπλήσθησαν ζήλου
  choice: 满心嫉妒
  rationale: 贴近“被……充满”的强烈程度，同时用自然汉语表达；ζῆλος可指热心或嫉妒，本处敌对语境支持后者。
- source_word: ἀντέλεγον
  choice: 反驳
  rationale: 未完成时表示持续进行的对抗性言语；汉语“反驳”自然传达其含义，不强行加入原文未明说的起始体。
- source_word: τοῖς ὑπὸ Παύλου λαλουμένοις
  choice: 保罗所讲的话
  rationale: 将带冠词的被动分词结构自然化为汉语关系结构，保留其所指为保罗讲论的内容。
- source_word: βλασφημοῦντες
  choice: 并且说亵渎的话
  rationale: 分词表示伴随反驳而发生的行为；不补明亵渎对象，从而保留原文的开放性。
theological_decisions:
- issue: οἱ Ἰουδαῖοι可能被过度理解为对所有犹太人的概括
  choice: 正文译“犹太人”，脚注限定其叙事所指
  alternative: 译作“犹太领袖”或“犹太地人”
  rationale: 原文仅说“犹太人”，不足以缩窄为领袖；但上下文所指是当地具体的反对群体，并非历世历代所有犹太人。
- issue: ζῆλος的褒贬歧义
  choice: 嫉妒
  alternative: 热心
  rationale: 看见人群之后随即反驳并说亵渎的话，语境明显偏向负面义；脚注仍保留词语本身可译“热心”的可能。
- issue: βλασφημοῦντες的对象
  choice: 不补出亵渎对象
  alternative: 译为“亵渎保罗”或“亵渎神”
  rationale: 希腊文没有明说对象；不应擅自判定其直接针对保罗、信息或神。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“满心嫉妒”兼顾希腊语结构的力度与汉语自然度；“说亵渎的话”比单用书面化的“亵渎着”更易懂，同时不增补原文未说明的对象。
