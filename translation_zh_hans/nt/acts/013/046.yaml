source:
  edition: SBLGNT
  text: παρρησιασάμενοί ⸀τε ὁ Παῦλος καὶ ὁ Βαρναβᾶς εἶπαν· Ὑμῖν ἦν ἀναγκαῖον πρῶτον λαληθῆναι τὸν λόγον τοῦ θεοῦ· ⸀ἐπειδὴ ἀπωθεῖσθε αὐτὸν καὶ οὐκ ἀξίους κρίνετε ἑαυτοὺς τῆς αἰωνίου ζωῆς, ἰδοὺ στρεφόμεθα εἰς τὰ ἔθνη·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/046.yaml
  text: So Paul and Barnabas spoke boldly and said[a], “It was necessary that the word of God be spoken first to you. Since you are rejecting it and judging yourselves unworthy of eternal life, look, we are turning to the Gentiles.”
translation:
  language: zh_hans
  text: 保罗和巴拿巴放胆地说：“上帝的道必须先传讲给你们。既然你们拒绝它，又断定自己不配得永生，看哪，我们就转向外邦人[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“列国”。这里指与会堂听众相对的非犹太人。
    reason: 保留τὰ ἔθνη的字面译法及其在当前语境中的族群所指。
lexical_decisions:
- source_word: παρρησιασάμενοί
  choice: 放胆说
  rationale: 该分词表达坦然无惧、公开直言的言说方式；与εἶπαν合译为“放胆说”，既保留其方式含义，也符合现代汉语叙事习惯。
- source_word: Ὑμῖν ἦν ἀναγκαῖον πρῶτον λαληθῆναι
  choice: 本来必须先讲给你们
  rationale: 保留“必须”的必要性、“先”的次序性及ὑμῖν所标明的首要听众；“本来”自然表达未完成时ἦν在此语境中的既定必要。
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: 上帝的道
  rationale: “道”是中文圣经语体中对λόγος的传统且可理解的表达，在此指从上帝而来的信息；用“上帝的道”也便于后文代词明确回指。
- source_word: ἐπειδὴ ἀπωθεῖσθε αὐτὸν
  choice: 既然你们拒绝这道
  rationale: ἐπειδή引出原因；ἀπωθεῖσθε表示将其推开、拒斥，现时形态体现正在显明的拒绝。“这道”明确回指阳性单数αὐτόν所对应的λόγον。
- source_word: οὐκ ἀξίους κρίνετε ἑαυτοὺς τῆς αἰωνίου ζωῆς
  choice: 判定自己不配得永生
  rationale: 保留κρίνετε的判断、裁定意味和ἑαυτούς的反身力量，不把判断主体改成保罗；“不配得永生”符合现代汉语搭配。
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留引人注意并强调下文转折行动的语用力量，同时维持庄重的经文语体。
- source_word: στρεφόμεθα εἰς τὰ ἔθνη
  choice: 我们就转向外族人
  rationale: στρεφόμεθα表达转向新的宣讲对象；本段以会堂听众和非犹太人相对照，因此用“外族人”表达ἔθνη在此处的人群含义，而不是地理意义上的国家。
theological_decisions:
- issue: τὰ ἔθνη在救恩历史语境中的所指
  choice: 外族人
  alternative: 列国／万民
  rationale: 直接语境把会堂中的犹太听众与非犹太人相对照。“外族人”既表达族群对比，又避免让现代读者误解为政治意义上的国家；脚注保留“列国”的字面可能。
- issue: “判定自己不配得永生”的判断主体
  choice: 听众因拒绝这道而判定自己不配得永生
  alternative: 保罗宣判他们客观上不配得永生
  rationale: 希腊文明确使用反身代词ἑαυτούς，将判断行为归于听众自己；译文保留这一语法和神学张力，不外加更广泛的教义结论。
- issue: 首先向犹太听众宣讲的必要性
  choice: “必须先”保留神圣计划或使命所含的必要性，但不在正文中解释其来源
  alternative: 仅译作时间上的“先讲给你们”
  rationale: ἀναγκαῖον不只是时间顺序，还明确表达必要性；正文保留这种力量，同时不擅自说明该必要性的完整神学依据。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“放胆说”“上帝的道”“永生”“看哪”保留圣经叙事语感；“外族人”比“外邦人”更贴近日常现代汉语，同时以脚注呈现“列国”这一词义可能。
