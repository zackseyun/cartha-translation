  text: ὡς δὲ ἐτέλεσαν πάντα τὰ περὶ αὐτοῦ γεγραμμένα, καθελόντες ἀπὸ τοῦ ξύλου ἔθηκαν εἰς μνημεῖον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/029.yaml
  text: And when they had carried out all that had been written concerning him[a], they took him down from the tree and laid him in a tomb.
translation:
  language: zh_hans
  text: 当他们成就了经上所写一切关于他的事，就把他从树[a]上取下来，安放在坟墓里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“十字架”。希腊文ξύλον本义可指“树”或“木头”，在此语境中也可指木制的刑具；这一用词可能呼应《申命记》21:23。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: ……之后，就……
  rationale: 此处引出后续事件，并具有时间意义；用“之后，就”自然表达动作的先后关系，也保持叙事连贯。
- source_word: ἐτέλεσαν
  choice: 成就
  rationale: τελέω在这里指使所记之事达到完成。译作“成就”既适合人的复数行动主体，也保留这些行动应验经上记载的含义。
- source_word: πάντα τὰ περὶ αὐτοῦ γεγραμμένα
  choice: 经上关于他所写的一切
  rationale: γεγραμμένα表示已经写下并持续有效的内容；上下文指圣经中关于耶稣的记载，补出“经上”可使现代汉语读者清楚理解其所指。
- source_word: καθελόντες
  choice: 把他……取下来
  rationale: 该过去时分词表示先于主要动词发生的动作；汉语用连续谓语自然呈现动作次序。
- source_word: ἀπὸ τοῦ ξύλου
  choice: 从木架上
  rationale: ξύλον本义可指木头、树木，也可指木制的刑具。此处译作“木架”既符合受刑语境，又不直接以更专门的“十字架”取代原词；脚注保留其他可能译法及其经文呼应。
- source_word: ἔθηκαν
  choice: 安放
  rationale: τίθημι基本义为放置；用于安葬遗体时，“安放”自然、庄重。
- source_word: εἰς μνημεῖον
  choice: 在坟墓里
  rationale: μνημεῖον在此指埋葬遗体的墓穴；“坟墓”是现代汉语中清楚而通行的表达。
theological_decisions:
- issue: 受难语境中 ξύλον 的译法
  choice: 木架
  alternative: 树；十字架
  rationale: 原文使用ξύλον而非σταυρός。“木架”保留木制刑具的词义及受刑语境，同时避免直接与较专门的“十字架”同化。脚注说明直译“树”和按语境译“十字架”均有依据，并保留其可能呼应《申命记》21:23的张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“经上”明确所写内容的圣经背景；“成就”保留应验与完成之间的语义张力；“安放”符合安葬场景。
