  text: καὶ ἡμεῖς ὑμᾶς εὐαγγελιζόμεθα τὴν πρὸς τοὺς πατέρας ἐπαγγελίαν γενομένην
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/032.yaml
  text: And we ourselves proclaim to you the good news of the promise made to the fathers,[a]
translation:
  language: zh_hans
  text: 我们也向你们宣告好消息，就是那向列祖所作的应许。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“祖先”。希腊文作“父亲们”，这里指以色列的列祖。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: 也
  rationale: 承接上文，并自然体现保罗和同伴如今同样承担宣告的行动；在现代汉语中比句首直译为“并且”更顺畅。
- source_word: ἡμεῖς
  choice: 我们
  rationale: 希腊文显式使用代词，带有一定强调；汉语“我们也”已借助“也”自然体现这种突出，无须生硬增译“我们自己”。
- source_word: ὑμᾶς
  choice: 向你们
  rationale: 按汉语习惯，将所宣告的对象表达为“向你们”。
- source_word: εὐαγγελιζόμεθα
  choice: 宣告好消息
  rationale: 保留“宣布喜讯”的动词意义，且避免仅用教会术语“传福音”而弱化本句与“应许”的直接联系。
- source_word: τὴν ... ἐπαγγελίαν
  choice: 好消息，就是……应许
  rationale: 将“应许”保留为宣告内容，并用“就是”清楚呈现希腊文中该应许作为好消息内容的句法关系。
- source_word: πρὸς τοὺς πατέρας
  choice: 向列祖
  rationale: “列祖”是现代中文圣经语境中自然、庄重的 covenant-historical 表达，也保留了以色列先辈这一群体指向；希腊文没有所有格，因此不增译“我们的”。
- source_word: γενομένην
  choice: 所立的
  rationale: 与“应许”搭配自然，表达该应许曾向列祖作出；不译为“成就”，以免提前引入下一节才明确陈述的实现。
theological_decisions:
- issue: πατέρες 的圣约历史含义
  choice: 列祖
  alternative: 祖先
  rationale: “列祖”较贴近希腊文的阳性亲属称谓，并能自然指向以色列的先辈；“祖先”意思正确但较宽泛，因此列为脚注替代。
- issue: γενομένην 是否含有应许成就之意
  choice: 所立的
  alternative: 所成就的
  rationale: 分词在本节修饰“应许”，表示应许曾被作出；应许的成就在下一节陈述，故本节不预先解释为“成就”。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“宣告好消息”兼顾原词的喜讯含义与公开传达的动作；“列祖”保留经文的圣约历史语境。脚注标记已置于正文相应位置。
