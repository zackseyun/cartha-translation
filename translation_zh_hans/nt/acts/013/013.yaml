  text: Ἀναχθέντες δὲ ἀπὸ τῆς Πάφου οἱ ⸀περὶ Παῦλον ἦλθον εἰς Πέργην τῆς Παμφυλίας· Ἰωάννης δὲ ἀποχωρήσας ἀπ’ αὐτῶν ὑπέστρεψεν εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/013.yaml
  text: After setting sail from Paphos[a], those with Paul came to Perga in Pamphylia; but John, departing from them[b], returned to Jerusalem.
translation:
  language: zh_hans
  text: 保罗一行人[a]从帕福起航[b]，来到旁非利亚的别加；约翰却离开了他们，回耶路撒冷去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“保罗周围的人”，即与保罗同行的人。
    reason: lexical_alternative
  - marker: b
    text: “起航”也可译作“驶离”或“出海”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναχθέντες
  choice: 起航
  rationale: ἀνάγω在航海行程的语境中指船只离岸、出海。“起航”自然简洁，并保留明确的航海含义。
- source_word: οἱ περὶ Παῦλον
  choice: 保罗一行人
  rationale: οἱ περὶ加宾格表示以某人为核心、与其同行的一群人。“保罗一行人”符合现代汉语叙事习惯，也不额外界定同行者的身份。
- source_word: ἦλθον
  choice: 来到
  rationale: ἔρχομαι可依叙事视角译作“来”或“去”；“来到”在中文行程叙事中自然，并表达抵达目的地。
- source_word: Πέργην τῆς Παμφυλίας
  choice: 旁非利亚的别加
  rationale: 属格说明别加所在的地区；“旁非利亚的别加”清楚表达地理关系，并沿用常见中文圣经地名。
- source_word: ἀποχωρήσας ἀπ’ αὐτῶν
  choice: 离开了他们
  rationale: ἀποχωρέω可指离开或退出。此处用中性的“离开”，不从本节自行推断约翰的动机或作道德评价。
- source_word: ὑπέστρεψεν
  choice: 回……去了
  rationale: ὑποστρέφω意为返回。“回耶路撒冷去了”是自然的现代汉语叙述。
- source_word: Ἱεροσόλυμα
  choice: 耶路撒冷
  rationale: 采用该城通行的现代中文译名。
theological_decisions:
- issue: 约翰离队是否暗示背弃或失职
  choice: 中性译为“离开了他们”
  alternative: “撇下他们”或“擅自离队”
  rationale: 本节只陈述约翰离开同行者并返回耶路撒冷，没有说明动机。后文虽可能对这次离队有所评价，但不应把该评价预先加入本节。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“一行人”简明传达群体结构；分号保留原句两项行动之间的转折。“却”对应δέ在约翰行动处的对比作用。脚注标记依其实际所解释的词语放置，避免把“保罗一行人”和“起航”的注释错配。
