  yaml_path: translation/nt/acts/013/018.yaml
  text: And for about forty years he put up with them in the wilderness[a].
translation:
  language: zh_hans
  text: 又在旷野容忍他们[a]，约有四十年。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“照顾他们”，而不是“容忍他们”。
    reason: textual_variant
lexical_decisions:
- source_word: καί
  choice: 又
  rationale: 承接前文的历史叙述；现代汉语用“又”自然表达事件的继续。
- source_word: ὡς
  choice: 约
  rationale: 与时间量词连用时表示概数，保留原文“约有”的含义。
- source_word: τεσσερακονταετῆ χρόνον
  choice: 四十年
  rationale: 指一段四十年的时期；汉语直接说“四十年”最自然。
- source_word: ἐτροποφόρησεν
  choice: 容忍
  rationale: SBLGNT正文所印的动词最自然地表示忍受、宽容，符合以色列人在旷野屡次悖逆的叙事背景；异文所支持的“照顾”另列脚注。
- source_word: αὐτοὺς
  choice: 他们
  rationale: 指前文的以色列民，使用普通复数代词即可。
- source_word: ἐν τῇ ἐρήμῳ
  choice: 在旷野
  rationale: “旷野”是中文圣经地理语境中自然且准确的表达，也保留与以色列漂流传统的互文联系。
theological_decisions:
- issue: 上帝在旷野中对待以色列民之行动的含义
  choice: 容忍他们
  alternative: 照顾他们
  rationale: 所给SBLGNT正文为ἐτροποφόρησεν，支持“忍受、容忍”的意思，不应在正文中淡化为单纯的养育或照料。不过，重要的抄本异文支持“照顾”，故在脚注中透明呈现。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“容忍”准确传达正文动词的负重忍耐意味；“旷野”保留圣经历史叙述的传统地理色彩。
