source:
  edition: SBLGNT
  text: λυθείσης δὲ τῆς συναγωγῆς ἠκολούθησαν πολλοὶ τῶν Ἰουδαίων καὶ τῶν σεβομένων προσηλύτων τῷ Παύλῳ καὶ τῷ Βαρναβᾷ, οἵτινες προσλαλοῦντες ⸀αὐτοῖς ἔπειθον· αὐτοὺς ⸀προσμένειν τῇ χάριτι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/043.yaml
  text: After the synagogue had been dismissed[a], many of the Jews and devout proselytes followed Paul and Barnabas, who, speaking with them[c][b], were urging them to continue in the grace of God.
translation:
  language: zh_hans
  text: 散会以后[a]，有许多犹太人和敬虔的皈依犹太教者跟随保罗和巴拿巴。二人与他们交谈，劝他们继续留在上帝的恩典中。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“会堂的聚会结束以后。”这里的希腊文所指的可能是聚集的会众散去，而不是会堂建筑本身。
    reason: lexical_alternative
  - marker: b
    text: 或译：“劝勉他们继续留在上帝的恩典中。”
    reason: lexical_alternative
lexical_decisions:
- source_word: λυθείσης ... τῆς συναγωγῆς
  choice: 散会以后
  rationale: 属格独立结构表示先发生的情形；此处 συναγωγή 指聚集的会众或聚会，而非建筑物。“散会”自然表达 λυθείσης 所指聚会结束的意思，同时避免把建筑物说成被解散。
- source_word: ἠκολούθησαν
  choice: 跟随
  rationale: 直接保留动词既可指实际随行、又可能带有进一步追随意味的语义，不把它缩窄为单纯“陪同”。
- source_word: τῶν Ἰουδαίων καὶ τῶν σεβομένων προσηλύτων
  choice: 犹太人和虔诚的归信者
  rationale: 两个带冠词的部分属格都受 πολλοί 支配。“归信者”在本句指归入犹太教的人；“虔诚”表达 σεβομένων 的敬虔含义，并避免与《使徒行传》中尚未正式归信的敬畏上帝者混同。
- source_word: προσλαλοῦντες αὐτοῖς
  choice: 与他们交谈
  rationale: 分词表示伴随并持续的言语行动；“交谈”自然体现言语针对这些跟随者，也不过度强化 πρός 前缀。
- source_word: ἔπειθον
  choice: 劝
  rationale: 未完成时态显示持续进行的劝导。此处后接不定式，语境偏向劝勉；“劝”同时保留试图说服对方的意味。
- source_word: αὐτοὺς προσμένειν
  choice: 他们要继续活在
  rationale: προσμένω 表示留下、持续或坚持。结合后面的“上帝的恩典”，“继续活在”在现代汉语中较自然地表达持续处于恩典之中的意思。
- source_word: τῇ χάριτι τοῦ θεοῦ
  choice: 上帝的恩典中
  rationale: 保留“恩典”这一核心神学用语和原文与格所表达的关系，不将其限定为主观恩惠、福音信息或某种具体教义机制。
theological_decisions:
- issue: “继续在上帝的恩典中”的含义
  choice: 继续活在上帝的恩典中
  alternative: 持守上帝恩典的信息；继续蒙上帝恩待
  rationale: 原文可以兼含上帝施恩的行动、恩宠，以及由这恩典所塑造的生活领域。译文保留较宽的表达，不把它单独解释为福音信息或个人蒙恩状态。
- issue: “跟随”是否仅指实际随行
  choice: 保留“跟随”
  alternative: 随同；跟着走
  rationale: 上下文首先可指散会后随保罗和巴拿巴而去，但该动词本身也可带追随意味；采用“跟随”以保留这种自然的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“散会以后”简洁自然；“虔诚的归信者”保留其归入犹太教者的身份；后半句拆为两句，明确关系代词所指的是保罗和巴拿巴，并避免汉语长句生硬。所有脚注标记均已置于正文。
