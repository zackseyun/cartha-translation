  text: αὐτοὶ δὲ διελθόντες ἀπὸ τῆς Πέργης παρεγένοντο εἰς Ἀντιόχειαν ⸂τὴν Πισιδίαν⸃, καὶ ⸀εἰσελθόντες εἰς τὴν συναγωγὴν τῇ ἡμέρᾳ τῶν σαββάτων ἐκάθισαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/014.yaml
  text: But they went on from Perga and came to Antioch in Pisidia[a], and on the Sabbath day they entered the synagogue and sat down.
translation:
  language: zh_hans
  text: 他们从别加继续前行，来到彼西底的安提阿[a]。安息日，他们进了会堂，坐了下来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“彼西底安提阿”。希腊文直译为“彼西底的安提阿”。
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ δὲ
  choice: 他们
  rationale: δέ在这里承接行程叙事，至多带轻微转折；现代汉语无需机械译出“但”。αὐτοί明确主语，译为“他们”即可，不作生硬强调。
- source_word: διελθόντες ἀπὸ τῆς Πέργης
  choice: 从别加继续前行
  rationale: διέρχομαι在旅行叙事中表示继续经过或前行；此译既表达从别加出发，又保留行程延续之意。
- source_word: παρεγένοντο
  choice: 来到
  rationale: παραγίνομαι在旅行语境中表示到达某地；“来到”自然简洁。
- source_word: Ἀντιόχειαν τὴν Πισιδίαν
  choice: 彼西底的安提阿
  rationale: 按希腊语结构直译，以地区限定同名城市；同时用脚注保留可译作地区形容语的表达。
- source_word: εἰσελθόντες εἰς τὴν συναγωγήν
  choice: 他们进了会堂
  rationale: 将希腊语分词自然转换为汉语顺承分句；“会堂”是现代中文中对犹太会堂的通行译法。
- source_word: τῇ ἡμέρᾳ τῶν σαββάτων
  choice: 安息日
  rationale: 这是指犹太安息日的惯用表达；希腊语虽用复数形式σαββάτων，现代汉语自然译作单数“安息日”。
- source_word: ἐκάθισαν
  choice: 坐了下来
  rationale: 表达简单过去动作，并体现开始入座的动作感，符合会堂场景。
