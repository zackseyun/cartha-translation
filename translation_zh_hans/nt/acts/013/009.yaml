  text: Σαῦλος δέ, ὁ καὶ Παῦλος, πλησθεὶς πνεύματος ⸀ἁγίου ἀτενίσας εἰς αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/009.yaml
  text: But Saul[a], who was also called Paul, filled with the Holy Spirit, looked intently at him
translation:
  language: zh_hans
  text: 但扫罗[a]，也就是保罗，被圣灵充满，定睛看着他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“又名保罗”。
    reason: 原文ὁ καὶ Παῦλος说明扫罗同时也是保罗，但可自然理解并译为“又名保罗”。
lexical_decisions:
- source_word: Σαῦλος
  choice: 扫罗
  rationale: 按现代中文圣经人名的通行音译处理此专名。
- source_word: δέ
  choice: 但
  rationale: 表示叙事推进中轻微的转折：前文以吕马抵挡使徒，此处转向扫罗的回应。
- source_word: ὁ καὶ Παῦλος
  choice: 也就是保罗
  rationale: 保留同一人物另有“保罗”这一名字的同位说明；原文并未明说“称为”，因此正文不增添这一动词。
- source_word: πλησθεὶς
  choice: 被……充满
  rationale: 保留不定过去时被动分词的被动意义，同时采用自然的现代汉语表达。
- source_word: πνεύματος ἁγίου
  choice: 圣灵
  rationale: 在《使徒行传》的语境中指神的圣灵；中文专名惯例无需添加冠词。
- source_word: ἀτενίσας
  choice: 定睛看着
  rationale: 表达持续、专注凝视的含义，语气庄重而自然。
- source_word: εἰς αὐτόν
  choice: 看着他
  rationale: 与“定睛”连用，自然表达目光明确投向以吕马。
theological_decisions:
- issue: πνεύματος ἁγίου的所指
  choice: 圣灵
  alternative: 一个圣洁的灵
  rationale: 路加在此类赋能语境中的用法明确指向神的圣灵，而非不定的属灵存在。
- issue: ὁ καὶ Παῦλος是否包含“称为”
  choice: 也就是保罗
  alternative: 又名保罗
  rationale: 希腊文确认扫罗同时也是保罗，却没有明示“被称为”这一动词；正文保留较贴近形式的表达，脚注提供自然的解释性译法。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“被圣灵充满”保留原文被动结构；“定睛看着”准确传达专注凝视，又符合中文圣经叙事语体。
