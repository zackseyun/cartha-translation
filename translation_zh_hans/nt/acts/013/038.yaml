  text: γνωστὸν οὖν ἔστω ὑμῖν, ἄνδρες ἀδελφοί, ὅτι διὰ τούτου ὑμῖν ἄφεσις ἁμαρτιῶν καταγγέλλεται, καὶ ἀπὸ πάντων ὧν οὐκ ἠδυνήθητε ⸀ἐν νόμῳ Μωϋσέως δικαιωθῆναι
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/038.yaml
  text: Therefore let it be known to you[a], brothers, that through this one forgiveness of sins is proclaimed to you, and from all the things from which you could not be justified by the law of Moses[c][b], everyone who believes is justified.
translation:
  language: zh_hans
  text: 所以，弟兄们[a]，你们要知道：借着这一位[b]，赦罪正向你们宣告；在一切你们不能靠摩西律法得称为义的事上，凡信的人都借着这一位得称为义[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“弟兄们”也可能是对整个聚集群体的称呼，可理解为“弟兄姊妹们”。
    reason: lexical_alternative
  - marker: b
    text: “这一位”指上文刚刚提到的耶稣。
    reason: cross_reference
  - marker: c
    text: “得称为义”也可译作“被宣告为义”。
    reason: lexical_alternative
lexical_decisions:
- source_word: γνωστὸν οὖν ἔστω ὑμῖν
  choice: 所以……你们要知道
  rationale: 以自然的现代汉语表达这一无人称命令结构，同时保留 οὖν 的承接意味和郑重宣告的语气。
- source_word: ἄνδρες ἀδελφοί
  choice: 弟兄们
  rationale: 保留原文阳性复数的家人式称呼；是否包含在场女性，另以脚注说明。
- source_word: διὰ τούτου
  choice: 借着这一位
  rationale: 保留阳性单数指示代词的形式，并让读者从上文辨认其所指，不擅自补入“人”或姓名。
- source_word: ἄφεσις ἁμαρτιῶν
  choice: 罪得赦免
  rationale: 这是现代汉语中清楚而庄重的表达，比“罪的释放”自然，也比“罪的赦免”置于此句更顺畅。
- source_word: καταγγέλλεται
  choice: 向你们宣告
  rationale: 体现现在时被动语态及公开传扬的意味。
- source_word: ἀπὸ πάντων ὧν
  choice: 从中……的一切事
  rationale: 尽量保留 ἀπό 与关系代词结构所表达的“从这些事中脱离”的关系，同时使汉语可以理解。
- source_word: οὐκ ἠδυνήθητε
  choice: 不能
  rationale: 直接表达原文过去时形式在此处所指的无能为力；汉语无需机械标明时态。
- source_word: ἐν νόμῳ Μωϋσέως
  choice: 凭摩西律法
  rationale: ἐν 在这里可表达手段或范围；“凭”自然地呈现借律法不能得称为义的意思，同时不将两种语义可能性过度拆分。
- source_word: δικαιωθῆναι
  choice: 得称为义
  rationale: 保留司法性和神学张力，既不简化为道德改善，也不只译作一般性的“获判无罪”。
theological_decisions:
- issue: δικαιωθῆναι 与摩西律法的关系
  choice: 得称为义
  alternative: 被判定为义
  rationale: “得称为义”是现代中文基督教语境中可理解且较为开放的表达，保留司法宣告的可能，也不把该词缩减为纯粹内在的道德改变。
- issue: ἄνδρες ἀδελφοί 的性别范围
  choice: 弟兄们
  alternative: 弟兄姊妹们
  rationale: 正文保留阳性复数形式；原称呼在具体听众中是否具有包含女性的群体性用法，留在脚注中说明。
- issue: 所给原文片段在 δικαιωθῆναι 处结束
  choice: 以破折号标示句意尚待下文完成，不补入未见于所给原文的“凡信的人都得称为义”
  alternative: 依据下一节补全完整句子
  rationale: 所给 SBLGNT 证据在语法结构尚未完结处截止。为忠于本次提供的原文，不把后续希腊文当作本节正文补入；破折号明确保留这种未完结状态。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“借着这一位”有意保留原文指示代词的回指方式。由于用户所给希腊文本在一个跨节延续的句法结构中截止，正文以破折号提示下文承接，避免擅自加入未包含在该原文证据中的后续分句。
