  text: ὁ δὲ θεὸς ἤγειρεν αὐτὸν ἐκ νεκρῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/030.yaml
  text: But God raised him from the dead.
translation:
  language: zh_hans
  text: 但上帝使他从死里复活了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: 但
  rationale: 在上下文中与前述人把耶稣处死的行动形成鲜明对比；“但”自然保留其转折意味。
- source_word: θεὸς
  choice: 上帝
  rationale: 该名词在此明确作行动主体，指上帝。
- source_word: ἤγειρεν
  choice: 使……复活了
  rationale: ἐγείρω用于复活语境时表示使人从死亡中起来；现代汉语用“使……复活”既自然，也清楚表达上帝主动使耶稣复活。
- source_word: αὐτὸν
  choice: 他
  rationale: 代词承接紧邻上下文中的耶稣，译作“他”即可。
- source_word: ἐκ νεκρῶν
  choice: 从死人中
  rationale: 较直接地保留ἐκ与复数νεκρῶν所表达的“从死人当中”之意，同时与“复活”构成自然的汉语表达。
theological_decisions:
- issue: 复活表述
  choice: 但上帝使他从死人中复活了。
  alternative: 但上帝使他从死里复活了。
  rationale: 正文明确把耶稣的复活归于上帝的行动。“从死人中”较贴近希腊语复数表达，又不额外说明复活的方式或性质；“从死里”更符合传统汉语习惯，但较弱化“从死人当中”的字面意象。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。句子简洁，保留原文中人的处置与上帝行动之间的转折；不添加原文未明说的解释。
