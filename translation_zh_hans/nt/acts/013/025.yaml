  text: ὡς δὲ ἐπλήρου ⸀Ἰωάννης τὸν δρόμον, ἔλεγεν· ⸂Τί ἐμὲ⸃ ὑπονοεῖτε εἶναι; οὐκ εἰμὶ ἐγώ· ἀλλ’ ἰδοὺ ἔρχεται μετ’ ἐμὲ οὗ οὐκ εἰμὶ ἄξιος τὸ ὑπόδημα τῶν ποδῶν λῦσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/025.yaml
  text: And as John was completing his course[a], he kept saying, ‘What do you suppose me to be? I am not he. But look, one is coming after me[b], the sandals of whose feet I am not worthy to untie.’
translation:
  language: zh_hans
  text: 约翰快要走完自己的路程时，一再说：“你们以为我是谁？我不是[a]。但看哪，有一位在我之后来到；我连解他脚上的鞋[b]也不配。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可将隐含的意思明确译为：“我不是基督。”希腊文没有明说约翰所否认的身份，但上下文指向基督。
    reason: alternative_reading
  - marker: b
    text: 有些抄本和译本更具体地译作“解开他的鞋带”；但这里采用的希腊正文只说“解他脚上的鞋”，没有出现“鞋带”一词。
    reason: textual_variant
lexical_decisions:
- source_word: ἐπλήρου ... τὸν δρόμον
  choice: 将要走完自己的路程
  rationale: “走完路程”保留道路或赛程的比喻，可指约翰受托的事工与人生历程；“将要”结合未完成时态和语境，表达正在接近完成。
- source_word: ἔλεγεν
  choice: 一再说
  rationale: 未完成时在这里可表示持续或反复的言说；“一再说”自然地传达这种概括性的反复动作。
- source_word: Τί ἐμὲ ὑπονοεῖτε εἶναι;
  choice: 你们以为我是谁？
  rationale: ὑπονοεῖτε 表示猜想、认为；中文询问一个人的身份时用“是谁”最自然，也保留听众在判断约翰身份的含义。
- source_word: οὐκ εἰμὶ ἐγώ
  choice: 我不是
  rationale: 原文省略了所否认的身份，并强调“我”；中文保留省略，不在正文中直接补出“基督”。
- source_word: ἀλλ’ ἰδοὺ
  choice: 但看哪
  rationale: “看哪”保留 ἰδού 提请注意的功能，同时具有庄重而清楚的经文语体。
- source_word: ἔρχεται μετ’ ἐμὲ
  choice: 有一位在我以后来
  rationale: 补出隐含的主语“有一位”，使中文完整自然；“来”保留现在时所带的临近与鲜明感。
- source_word: οὗ ... τὸ ὑπόδημα τῶν ποδῶν λῦσαι
  choice: 解他脚上的鞋
  rationale: 正文保留“脚上的鞋”和“解”的表达，不把本版希腊正文未明说的“鞋带”加入译文。
- source_word: ἄξιος
  choice: 配
  rationale: 在“连……也不配”的结构中，“配”自然准确地表达资格或配得程度，并突出约翰的自谦。
theological_decisions:
- issue: οὐκ εἰμὶ ἐγώ 所否认的身份
  choice: 正文译作“我不是”，保留原文省略
  alternative: 我不是基督／我不是那一位
  rationale: 上下文强烈指向弥赛亚身份，但希腊文没有明说宾语。正文不替原文消除这种省略，脚注说明最可能的所指。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“走完自己的路程”保留原文比喻；“一再说”体现未完成时的反复意味；“我不是”有意保留原文在身份问题上的省略。脚注标记分别放在其实际说明的词句之后。
