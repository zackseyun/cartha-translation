  terminology: “神的旨意”“睡了”“朽坏”均合乎现代汉语圣经语域，也没有附加教义性解释。“列祖”比泛称“祖先”更准确地保留原文的父祖／先祖习语。脚注a恰当地保留两个与格短语可有不同关联的可能性。
