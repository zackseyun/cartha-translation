  text: Δαυὶδ μὲν γὰρ ἰδίᾳ γενεᾷ ὑπηρετήσας τῇ τοῦ θεοῦ βουλῇ ἐκοιμήθη καὶ προσετέθη πρὸς τοὺς πατέρας αὐτοῦ καὶ εἶδεν διαφθοράν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/036.yaml
  text: For David[a], after serving God's purpose in his own generation[d][c][b], fell asleep and was gathered to his fathers and saw decay.
translation:
  language: zh_hans
  text: 大卫在自己那一代，为神的旨意效力之后，就睡了，被归入他的列祖中，也见了朽坏[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: d
    text: 即他的身体经历了腐朽；参下一节所作的对比。
    reason: cross_reference
lexical_decisions:
- source_word: ἰδίᾳ γενεᾷ
  choice: 在自己那一代
  rationale: 保留与格短语所表达的时代范围，即大卫在其所处的世代中服事；措辞自然，也不擅自把该世代解释为服事的受益对象。
- source_word: ὑπηρετήσας τῇ τοῦ θεοῦ βουλῇ
  choice: 为神的旨意效力之后
  rationale: ὑπηρετέω表示服事、效力；βουλή在此可指旨意、计划或定意。“为神的旨意效力”既保留服事关系，又比“服事旨意”更符合现代汉语。
- source_word: ἐκοιμήθη
  choice: 就睡了
  rationale: 保留原文以睡眠婉指死亡的圣经性隐喻，不直接平化为“死了”。
- source_word: προσετέθη πρὸς τοὺς πατέρας αὐτοῦ
  choice: 归到他的祖先那里
  rationale: 以自然汉语传达闪语式表达“被加到列祖那里”，即在死亡中与先祖同列；“祖先”比现代语境中的“父亲们”准确。
- source_word: εἶδεν διαφθοράν
  choice: 见了朽坏
  rationale: 保留“见朽坏”的直译和与前后诗篇引文的关键词呼应；这里指大卫的身体经历腐朽。
theological_decisions:
- issue: 两个与格短语与ὑπηρετήσας的句法关系
  choice: 大卫在自己那一代，为神的旨意效力
  alternative: 大卫按着神的旨意服事了自己那一代的人
  rationale: 主译把ἰδίᾳ γενεᾷ理解为时间或范围，把τῇ τοῦ θεοῦ βουλῇ理解为服事所指向的对象；但原文两个与格短语可有不同搭配，故用脚注保留另一种历史悠久且语法上可能的理解。
- issue: 大卫死亡的表达
  choice: 睡了
  alternative: 死了
  rationale: 原文特意使用κοιμάομαι的死亡婉语；保留隐喻可维持经文语言及其神学张力，却不据此附加有关死后状态的教义解释。
- issue: διαφθορά所指
  choice: 见了朽坏
  alternative: 身体腐朽了
  rationale: 直译保留与13:35、37的明确对照；脚注说明语境所指是身体腐朽，但正文不将原文意象改写为解释。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“为神的旨意效力”避免生硬的“服事旨意”，同时尽量保留ὑπηρετέω的服事含义；“睡了”“见了朽坏”刻意保存原文意象及上下文呼应。
