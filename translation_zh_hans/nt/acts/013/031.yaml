base_translation:
  language: en
  yaml_path: translation/nt/acts/013/031.yaml
  text: He appeared for many days to those who had gone up with him from Galilee to Jerusalem[b][a], who are now his witnesses to the people.
translation:
  language: zh_hans
  text: 他多日向那些曾同他从加利利上到耶路撒冷去的人显现[a]；这些人如今向百姓为他作见证[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他多日被这些人看见。”希腊语动词采用被动形式，在复活显现的语境中也常译作“显现”。
    reason: lexical_alternative
  - marker: b
    text: 这里的“百姓”按上下文很可能特指以色列民，即犹太百姓。
    reason: cultural_note
lexical_decisions:
- source_word: ὃς
  choice: 他
  rationale: 关系代词承接上一节的耶稣。中文在独立呈现本节时以“他”起句自然，也明确保留所指。
- source_word: ὤφθη
  choice: 显现
  rationale: 该动词虽为被动形式，在复活显现语境中通常具有“显现”的意义；此译自然，并保留事件的客观性。脚注补充较形式对应的译法。
- source_word: ἐπὶ ἡμέρας πλείους
  choice: 一连多日
  rationale: 表达持续多日的时间范围，比单说“多日”更自然地传达历时意义。
- source_word: τοῖς συναναβᾶσιν αὐτῷ
  choice: 那些曾同他……上……去的人
  rationale: 保留共同随行及先于显现发生的行动；“上耶路撒冷”也保留原文的行程表达。
- source_word: ἀπὸ τῆς Γαλιλαίας εἰς Ἰερουσαλήμ
  choice: 从加利利上耶路撒冷去
  rationale: 直接表达起点和终点，同时保留ἀναβαίνω所含“上去”的传统地理及旅程用语。
- source_word: οἵτινες
  choice: 这些人
  rationale: 另起分句，清楚指出前述群体正是现今承担见证职责的人。
- source_word: νῦν
  choice: 如今
  rationale: 标明相对于过去显现事件而言，他们目前所具有的见证人身份。
- source_word: μάρτυρες αὐτοῦ
  choice: 为他作见证
  rationale: 在中文中自然表达这些人是关于耶稣的见证人；不把属格过度限定为单一语法类别。
- source_word: πρὸς τὸν λαόν
  choice: 在百姓面前
  rationale: 表达见证所面对的对象和公开场域；“向百姓作见证”亦可，但此译更顺畅。
- source_word: λαόν
  choice: 百姓
  rationale: 保留原文未明说族名的措辞；结合《使徒行传》语境，很可能特指以色列民，故以脚注说明。
theological_decisions:
- issue: 复活显现用语的性质
  choice: 显现
  alternative: 被人看见
  rationale: “显现”符合ὤφθη在复活叙事中的常见用法，又不削弱上下文所强调的历史见证；脚注保留被动形式的译法。
- issue: “百姓”的范围
  choice: 百姓
  alternative: 以色列百姓／犹太民众
  rationale: 上下文很可能指以色列民，但原文只用λαός，正文不把语境推断直接扩写进去，以免消除原文的措辞空间。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“一连多日”清楚表达持续时间；“从加利利上耶路撒冷去”保留圣经时代前往耶路撒冷常用的“上去”说法。脚注标记均紧随其所说明的正文内容。
