  text: ὃς ἦν σὺν τῷ ἀνθυπάτῳ Σεργίῳ Παύλῳ, ἀνδρὶ συνετῷ. οὗτος προσκαλεσάμενος Βαρναβᾶν καὶ Σαῦλον ἐπεζήτησεν ἀκοῦσαι τὸν λόγον τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/007.yaml
  text: who was with the proconsul Sergius Paulus[a], an intelligent man[b]. This man summoned Barnabas and Saul and sought to hear the word of God.
translation:
  language: zh_hans
  text: 他和行省总督士求·保罗在一起。士求·保罗是个有见识的人[a]。他召巴拿巴和扫罗来，要求听上帝的话语[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“聪明的人”、“明达的人”或“审慎的人”。
    reason: lexical_alternative
  - marker: b
    text: 或译“上帝的信息”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθυπάτῳ
  choice: 行省总督
  rationale: 这里指罗马元老院行省的最高长官，即 proconsul。译作“行省总督”既交代其行政身份，也比传统的“方伯”更便于现代普通读者理解。
- source_word: σὺν
  choice: 和……在一起
  rationale: 直接表达陪同或交往关系，不额外限定二人的具体关系。
- source_word: ἀνδρὶ συνετῷ
  choice: 是个明达的人
  rationale: “明达”兼有聪慧、理解力和审慎辨别之意，保留 συνετός 的语义宽度，同时避免把它解释成特定的道德或属灵评价。
- source_word: οὗτος
  choice: 他
  rationale: 希腊文指示代词承接对士求·保罗的插入描述；中文分句后用“他”自然清楚，无须生硬重复“这个人”。
- source_word: προσκαλεσάμενος
  choice: 召来
  rationale: 表示叫巴拿巴和扫罗到自己这里来，保留总督主动召见的意味，但不强化为带有强制色彩的传唤。
- source_word: ἐπεζήτησεν
  choice: 想
  rationale: 本词在此表达积极的愿望或寻求；现代汉语“想听”自然地呈现其意愿，不夸大为持续追求。
- source_word: ἀκοῦσαι
  choice: 听
  rationale: 忠实表达聆听并领受所传信息的动作。
- source_word: λόγον τοῦ θεοῦ
  choice: 上帝的话
  rationale: 保留“话/道”与“上帝”的属格结构及熟悉的圣经表达；语境中指来自上帝、关乎上帝的信息。
- source_word: Σεργίῳ Παύλῳ
  choice: 士求·保罗
  rationale: 采用现代中文圣经中较通行的人名音译，并用间隔号标示复名。
- source_word: Βαρναβᾶν καὶ Σαῦλον
  choice: 巴拿巴和扫罗
  rationale: 采用现代中文圣经通行的人名音译。
theological_decisions:
- issue: λόγον τοῦ θεοῦ 的译法
  choice: 上帝的话
  alternative: 上帝的信息
  rationale: “上帝的话”较贴近希腊文形式，并保留这一表达在《使徒行传》中的经文互文；脚注说明语境上也可理解为所传的信息，不将其收窄为某一系统神学概念。
- issue: συνετός 对士求·保罗的评价
  choice: 明达的人
  alternative: 聪明的人；有见识的人；审慎的人
  rationale: 原词可指聪明、有理解力或审慎。“明达”保留这些相邻含义，不把叙述者的正面评价过度解释为道德美德或属灵身份。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。将希腊文较长的关系从句和分词结构拆成三个短句，使所指清楚、朗读顺畅；不补入原文未说明的身份关系或神学判断。
