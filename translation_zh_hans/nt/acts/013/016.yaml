  text: ἀναστὰς δὲ Παῦλος καὶ κατασείσας τῇ χειρὶ εἶπεν· Ἄνδρες Ἰσραηλῖται καὶ οἱ φοβούμενοι τὸν θεόν, ἀκούσατε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/016.yaml
  text: So Paul stood up[a], and motioning with his hand said, “Men of Israel and you who fear God, listen.”
translation:
  language: zh_hans
  text: 保罗便站起来，用手示意，说：“各位以色列男士，以及敬畏上帝的人[a]，请听！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “敬畏上帝的人”也可译作“敬神者”。这个说法在此很可能指与会堂有联系的外邦敬拜者。
    reason: 说明词语的另一种译法及其可能的历史语境，同时保留原文表达的开放性。
lexical_decisions:
- source_word: ἀναστὰς
  choice: 站起来
  rationale: 此处是不定过去时分词，描述保罗发言前起身的具体动作；“站起来”自然、明确。
- source_word: δὲ
  choice: 便
  rationale: δέ在这里推进叙事，并无强烈转折；“便”能自然衔接上文和保罗随后的发言。
- source_word: κατασείσας τῇ χειρὶ
  choice: 举手示意
  rationale: 该短语指用手势吸引注意或示意安静；“举手示意”符合现代汉语习惯，又避免译成“挥手”所可能带来的剧烈动作意味。
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: 以色列的各位男士
  rationale: 保留ἄνδρες明确的男性称呼和Ἰσραηλῖται的身份指称，同时用现代汉语中可理解的呼语表达。
- source_word: οἱ φοβούμενοι τὸν θεόν
  choice: 敬畏上帝的人
  rationale: 保留分词短语“敬畏”的动词意味，不在正文中直接将其术语化为固定群体名称。
- source_word: ἀκούσατε
  choice: 请听
  rationale: 该不定过去时命令式要求听众专心聆听；“请听”直接而庄重，也适合公开讲话的语境。
theological_decisions:
- issue: 会堂讲话中以色列人与敬畏上帝者的区分
  choice: “以色列的各位男士，以及敬畏上帝的人”
  alternative: “以色列人和敬神者”
  rationale: 希腊文区分了以色列人和另一群被描述为敬畏上帝的人；后者在此语境中很可能是与会堂有联系的外邦敬拜者。正文保留这一区分，但不把可能的社会群体含义绝对化。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“举手示意”适合公开发言场景；“各位男士”保留原文男性呼语，不改写为性别中性的称呼。
