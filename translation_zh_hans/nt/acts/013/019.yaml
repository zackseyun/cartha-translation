base_translation:
  language: en
  yaml_path: translation/nt/acts/013/019.yaml
  text: And after destroying seven nations in the land of Canaan[a], he gave them their land as an inheritance.
translation:
  language: zh_hans
  text: 他推翻了迦南地的七个民族以后，就把他们的土地赐给以色列人作产业。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他把他们的土地分给以色列人作为产业。”希腊语动词可着重指把土地按产业分给人或划分给人。
    reason: lexical_alternative
lexical_decisions:
- source_word: καθελὼν
  choice: 推翻了
  rationale: καθαιρέω在征服迦南的历史语境中表示使列国败亡、被除去；“推翻”既保留其强烈语气，也比“毁灭”更能避免暗示每个居民都被杀尽。
- source_word: ἔθνη ἑπτὰ
  choice: 七个民族
  rationale: ἔθνη可指国家、民族或各族；这里指迦南地的七族，“七个民族”在现代汉语中清楚自然。
- source_word: ἐν γῇ Χανάαν
  choice: 迦南地
  rationale: 保留γῇ“地”的含义，并采用中文圣经历史叙事中自然且通行的地名表达。
- source_word: κατεκληρονόμησεν
  choice: 赐给……作产业
  rationale: 该动词可表示按产业分配、使人承受为业；正文以自然汉语表达上帝将土地交给以色列人承受，同时用脚注保留其“分配、划拨”的词义侧重。
- source_word: τὴν γῆν αὐτῶν
  choice: 他们的土地
  rationale: αὐτῶν回指刚提到的七个民族，直译为“他们的土地”简洁而明确。
theological_decisions:
- issue: 两个动作的主语及承受土地的人
  choice: 上帝是“推翻”和“赐给”的主语；以色列人是承受土地的人。
  alternative: 只译作“把他们的土地分配了”，不明说承受者。
  rationale: 上下文连续叙述上帝为以色列所行的事。希腊文没有明说间接宾语，但历史语境表明承受土地的是以色列；补出“以色列人”属于为现代汉语清楚表达所作的语境性明示，并非增加新的神学主张。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“作产业”保留圣经土地承受主题；“推翻”表达征服与除去，避免使用可能过度限定杀戮范围的措辞。
