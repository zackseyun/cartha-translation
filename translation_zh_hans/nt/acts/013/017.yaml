id: ACT.13.17
reference: Acts 13:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ θεὸς τοῦ λαοῦ τούτου ⸀Ἰσραὴλ ἐξελέξατο τοὺς πατέρας ἡμῶν, καὶ τὸν λαὸν ὕψωσεν ἐν τῇ παροικίᾳ ἐν γῇ ⸀Αἰγύπτου, καὶ μετὰ βραχίονος ὑψηλοῦ ἐξήγαγεν αὐτοὺς ἐξ αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/017.yaml
  text: The God of this people Israel chose our fathers[a], and made the people great during their sojourn in the land of Egypt[d][c][b], and with an uplifted arm he led them out from it.
translation:
  language: zh_hans
  text: 这以色列民的神拣选了我们的先祖[a]；他们寄居埃及地期间，神使这民兴盛[b]，又用大能的膀臂[c]领他们出了埃及[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我们的父祖”。希腊文直译为“我们的父亲们”。
    reason: lexical_alternative
  - marker: b
    text: 或译“高举这民”或“使这民增多”。
    reason: lexical_alternative
  - marker: c
    text: 直译“用高举的膀臂”；这是出埃及传统中的说法，表示神以大能施行拯救。
    reason: cultural_note
  - marker: d
    text: 或译“带他们从那里出来”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ θεὸς τοῦ λαοῦ τούτου Ἰσραήλ
  choice: 这以色列民的神
  rationale: 按中文自然语序表达限定关系，并保留“这民”与“以色列”的同位含义。
- source_word: ἐξελέξατο
  choice: 拣选
  rationale: “拣选”准确传达主动选取之意，也符合庄重而通行的圣经语体。
- source_word: τοὺς πατέρας ἡμῶν
  choice: 我们的先祖
  rationale: 在现代汉语中，“先祖”自然指民族历史中的男性祖辈；脚注保留较字面的“父祖”。
- source_word: ὕψωσεν
  choice: 使这民兴盛
  rationale: ὑψόω在此可涉及抬举、壮大或增多；“兴盛”较自然，并避免把含义限制为地位提升或人数增长。
- source_word: ἐν τῇ παροικίᾳ ἐν γῇ Αἰγύπτου
  choice: 他们寄居埃及地期间
  rationale: παροικία强调以外来者身份居留；“寄居”保留这一含义，“期间”清楚表达时间关系。
- source_word: μετὰ βραχίονος ὑψηλοῦ
  choice: 用大能的膀臂
  rationale: 这是出埃及传统中表明神施展能力施行拯救的意象；中文采用可懂且保留身体隐喻的表达。
- source_word: ἐξήγαγεν αὐτοὺς ἐξ αὐτῆς
  choice: 领他们出了埃及
  rationale: ἐξάγω含领出、带出之意；明确重复“埃及”比代词“那里”更自然清楚。
theological_decisions:
- issue: πατέρες所指的祖辈
  choice: 我们的先祖
  alternative: 我们的父祖
  rationale: “先祖”在现代中文中清楚表达以色列历史中的祖辈，不改变经文的群体认同；脚注说明字面措辞。
- issue: ὕψωσεν在埃及背景中的含义
  choice: 使这民兴盛
  alternative: 高举这民；使这民增多
  rationale: 原词容许地位被提升和群体壮大等理解；正文以“兴盛”保留一定语义宽度，脚注列出较窄的可能译法。
- issue: μετὰ βραχίονος ὑψηλοῦ的意象
  choice: 用大能的膀臂
  alternative: 用高举的膀臂
  rationale: 该短语沿用出埃及的神圣拯救意象。“大能”传达惯用含义，同时保留“膀臂”这一原文隐喻。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“拣选”“寄居”“膀臂”保留适度的圣经历史语感；句式经重组以符合中文叙事节奏，同时保留原文各动作的顺序与语义张力。
