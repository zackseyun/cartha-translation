reference: Acts 13:26
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ἄνδρες ἀδελφοί, υἱοὶ γένους Ἀβραὰμ καὶ οἱ ἐν ὑμῖν φοβούμενοι τὸν θεόν, ⸀ἡμῖν ὁ λόγος τῆς σωτηρίας ταύτης ⸀ἐξαπεστάλη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/026.yaml
  text: Brothers[a], sons of the family of Abraham, and those among you who fear God[c][b], to us the message of this salvation has been sent.
translation:
  language: zh_hans
  text: 弟兄们[a]，亚伯拉罕家族的子孙，以及你们中间敬畏上帝的人[b]，这救恩的信息[c]已经被传给我们了。[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊语可直译为“诸位男士、弟兄们”。这是男性形式的称呼，但在公开讲话中可能指在场的更广泛听众。
    reason: lexical_alternative
  - marker: b
    text: 也可译为“你们中间的敬畏上帝者”。这可能指依附犹太会堂、敬拜以色列上帝的外邦人；原文也可作一般性的描述。
    reason: cultural_note
  - marker: c
    text: “信息”也可译为“话语”。
    reason: lexical_alternative
  - marker: d
    text: 有些古抄本作“已经被传给你们了”。
    reason: textual_variant
lexical_decisions:
- source_word: Ἄνδρες ἀδελφοί
  choice: 弟兄们
  rationale: 这是向听众发出的男性复数称呼。现代中文用“弟兄们”自然庄重，也保留原文的性别形式；原文较直译的形式及其可能涵盖更广泛会众的语用范围见脚注。
- source_word: υἱοὶ γένους Ἀβραὰμ
  choice: 亚伯拉罕家族的子孙
  rationale: υἱοί 字面为“儿子”，γένος 指家系、族类或后裔群体；“家族的子孙”在现代中文中自然表达血统归属，又不采用容易误解为仅指直接儿子的僵硬说法。
- source_word: οἱ ἐν ὑμῖν φοβούμενοι τὸν θεόν
  choice: 你们中间敬畏上帝的人
  rationale: 按描述性意义直译 φοβούμενοι τὸν θεόν，不把它强行处理为专门历史称号；同时仍容许其指依附会堂、敬拜以色列上帝的外邦人。
- source_word: ἡμῖν
  choice: 给我们／传给我们
  rationale: 与被动动词 ἐξαπεστάλη 配合，表达信息被差遣到“我们”这里的方向性。正文采用自然汉语“传给我们”。
- source_word: ὁ λόγος
  choice: 信息
  rationale: λόγος 在宣讲语境中可指“话语”或“信息”；“信息”较自然地表达所传讲的内容，另在脚注保留“话语”这一形式对应。
- source_word: τῆς σωτηρίας ταύτης
  choice: 这救恩的
  rationale: 保留指示词 ταύτης 与 σωτηρία 的标准神学用语“救恩”；属格与 λόγος 相连，可理解为有关或承载这救恩的信息。
- source_word: ἐξαπεστάλη
  choice: 已经传给……了
  rationale: 不定过去时被动态表示这信息已经被差遣而来；中文以“已经……了”表达已成事实及其当前关联，“传给”符合信息传达的自然搭配。
theological_decisions:
- issue: φοβούμενοι τὸν θεόν 是描述语还是半技术性群体称号
  choice: 正文译作“你们中间敬畏上帝的人”
  alternative: “你们中间那些‘敬畏上帝者’”
  rationale: 原文既可作一般描述，也可能在会堂处境中特指亲近犹太信仰的外邦人。正文保留描述性，不把历史身份定死；脚注说明其可能背景。
- issue: Ἄνδρες ἀδελφοί 的性别与听众范围
  choice: 正文译作“弟兄们”
  alternative: “诸位弟兄”或“弟兄姊妹们”
  rationale: 原文在语法和词汇形式上均为阳性。译作“弟兄们”保留这一形式，不擅自加上“姊妹”；脚注说明公开讲话中实际指称范围可能包括更广泛的在场听众。
- issue: 第一人称复数 ἡμῖν 的文本变体
  choice: 正文采用 SBLGNT 的“给我们”
  alternative: 部分抄本所支持的“给你们”
  rationale: 按所给 SBLGNT 正文翻译 ἡμῖν，同时以脚注透明呈现重要代词异文，避免掩盖其对受领者表述的影响。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“救恩”“敬畏上帝”保留经文传统且仍为现代读者可理解的表达；句式尽量贴近希腊文呼语与宣告结构，同时将被动差遣自然处理为信息“传给”受领者。
