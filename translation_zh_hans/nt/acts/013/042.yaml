base_translation:
  language: en
  yaml_path: translation/nt/acts/013/042.yaml
  text: As they were going out[b][a], they were urging that these words be spoken to them on the next Sabbath.
translation:
  language: zh_hans
  text: 他们出去时[b][a]，他们恳求在下一个安息日把这些话讲给他们听。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本更明确地写作：“保罗和巴拿巴出去的时候，众人恳求他们在下一个安息日讲这些话。”
    reason: textual_variant
  - marker: b
    text: 或译：“他们离开时，他们请求在将到的安息日把这些事讲给他们听。”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐξιόντων δὲ αὐτῶν
  choice: 他们出去的时候
  rationale: 以时间从句自然表达带属格分词结构；“出去”贴近现在分词的动作过程，而代词“他们”不在正文中明定所指。δέ作为轻微衔接词自然融入从句。
- source_word: παρεκάλουν
  choice: 众人恳求
  rationale: 未完成时表示持续或反复请求；“恳求”体现παρακαλέω在此处诚恳请求的语气。汉语若只写“他们恳求”，多重代词会使句意近乎无法辨认，因此按语境用“众人”标示提出请求的一方，同时以脚注说明文本异读及所指问题。
- source_word: εἰς τὸ μεταξὺ σάββατον
  choice: 在下一个安息日
  rationale: 该表达在此指随后来到的安息日；此译法符合现代汉语时间表达。
- source_word: λαληθῆναι αὐτοῖς
  choice: 再讲……给他们
  rationale: 被动不定式直译为“被讲给他们”在现代汉语中生硬，改用自然的主动请求结构；“再”从下一个安息日重复讲论的语境自然显出。
- source_word: τὰ ῥήματα ταῦτα
  choice: 这些话
  rationale: 贴近ῥήματα的言语、话语之义，也保持与刚才会堂讲论的直接联系。
theological_decisions:
- issue: 本节代词的所指及相关文本异读
  choice: 正文保留“他们出去”这一代词表述，并按叙事语境将请求者译作“众人”；脚注交代更明确的异读及代词所指的困难。
  alternative: 正文明确译为“保罗和巴拿巴出去时，众人恳求……”；或全用代词而不指明任何一方。
  rationale: SBLGNT正文在属格独立结构中仅有αὐτῶν，并未明说姓名；但现代汉语若两方都用“他们”，会造成表达失效。译文尽量保留第一处代词，同时用语境可识别的“众人”使句子可懂，并以脚注公开文本证据与另一种理解，不把异读悄然写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“安息日”为通行圣经用语；“恳求”保留请求的恳切程度。脚注标记全部置于正文相关位置。
