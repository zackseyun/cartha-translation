id: ACT.13.11
reference: Acts 13:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ νῦν ἰδοὺ χεὶρ κυρίου ἐπὶ σέ, καὶ ἔσῃ τυφλὸς μὴ βλέπων τὸν ἥλιον ἄχρι καιροῦ. παραχρῆμα ⸀δὲ ⸀ἔπεσεν ἐπ’ αὐτὸν ἀχλὺς καὶ σκότος, καὶ περιάγων ἐζήτει χειραγωγούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/011.yaml
  text: And now[a], behold, the hand of the Lord is upon you, and you will be blind, not seeing the sun for a time. Immediately a mist and darkness fell upon him, and going about[c][b], he was seeking people to lead him by the hand.
translation:
  language: zh_hans
  text: 现在，看哪[a]，主的手[b]临到你身上；你将失明，暂时[c]看不见太阳。立刻，雾气和黑暗降在他身上；他四处走动，寻找人牵着他的手领路。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “看哪”也可译作“注意”。
    reason: lexical_alternative
  - marker: b
    text: “主的手”是圣经中的惯用说法，表示主主动施展能力；这里用于审判。
    reason: cultural_note
  - marker: c
    text: 或译“一段时期”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留原文唤起注意的鲜明语气，同时采用现代读者仍能理解的庄重圣经用语。
- source_word: χεὶρ κυρίου
  choice: 主的手
  rationale: 保留原文具体的圣经意象，不直接释为“审判”或“惩罚”。
- source_word: ἔσῃ τυφλὸς
  choice: 你将成为瞎子
  rationale: 在自然汉语中表达即将发生的失明，也与随后立刻应验的叙述相呼应。
- source_word: μὴ βλέπων τὸν ἥλιον
  choice: 看不见太阳
  rationale: 保留原文对“太阳”的明确提及，不泛化为“看不见光”。
- source_word: ἄχρι καιροῦ
  choice: 暂时
  rationale: 简洁自然地表达一段未明确长度的有限时期；脚注保留更贴近字面的另一译法。
- source_word: παραχρῆμα
  choice: 立刻
  rationale: 准确传达事件当即发生的突然性。
- source_word: ἀχλὺς καὶ σκότος
  choice: 雾气和黑暗
  rationale: 保留两个并列名词及其具体意象，不将二者合并为一般性的“昏暗”。
- source_word: περιάγων
  choice: 到处走动
  rationale: 贴近该分词的行动含义，避免把上下文暗示的“摸索”直接写入正文。
- source_word: ἐζήτει χειραγωγούς
  choice: 寻找人牵着他的手领路
  rationale: 展开表达 χειραγωγός 所指的“牵手引导者”，比笼统的“向导”更具体。
theological_decisions:
- issue: “主的手”的含义
  choice: 正文保留“主的手”这一意象
  alternative: 主的审判临到你／主要击打你
  rationale: 上下文表明这是主施行审判的大能，但原文采用含蓄的圣经惯用语；译文不应把意象替换成单一解释。
- issue: 失明持续时间
  choice: 译作“暂时”，并以脚注保留“直到某个时候”
  alternative: 直到指定的时候／一段时期
  rationale: ἄχρι καιροῦ 表明失明并非永久，却没有具体说明期限；译文不补入原文未明说的时长或终点。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“看哪”和“主的手”等原文鲜明意象；叙事部分使用自然简洁的现代汉语，并避免把语境中的推断（如“摸索”）写成原文明说的内容。
