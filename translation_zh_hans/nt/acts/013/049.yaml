  text: And the word of the Lord was being spread throughout the whole region[a].
translation:
  language: zh_hans
  text: 主的道正在传遍整个地区[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “主的道”或译“主的信息”。
    reason: lexical_alternative
lexical_decisions:
- source_word: διεφέρετο
  choice: 传遍了
  rationale: 未完成时被动式描写主的道在当时持续被传播，并且传播范围逐步遍及全境。汉语“传遍了”自然保留被动含义和遍及的结果；持续过程可由叙事语境体现。
- source_word: δὲ
  choice: 不单独译出
  rationale: δέ在此是轻微的叙事连接词，并不表示明显转折。现代汉语承接上文时省译更自然，且不损失命题内容。
- source_word: ὁ λόγος
  choice: 道
  rationale: λόγος在《使徒行传》中常指所宣讲的福音信息。“道”保留路加著作中反复出现的圣经用语，同时脚注说明其语境义。
- source_word: τοῦ κυρίου
  choice: 主的
  rationale: 属格结构译为“主的”，既可表示这道出于或属于主，也不排除它是关于主的信息；κύριος按其在本段的基督论语境译作“主”。
- source_word: δι’ ὅλης τῆς χώρας
  choice: 传遍了那一带
  rationale: διά加属格表示贯穿某一地域，ὅλης强调范围完整；χώρα指周围地区而非现代民族国家。“那一带”是清楚自然的现代汉语地域表达。
theological_decisions:
- issue: κύριος的译法
  choice: 主
  alternative: 主人
  rationale: “主”保留《使徒行传》中该称谓的基督论和圣经互文色彩；“主人”会不当地把意义缩窄为一般社会身份。
- issue: λόγος的语境意义
  choice: 道
  alternative: 信息
  rationale: “道”保留路加反复使用的关键表达及其神学厚度，而“信息”更直接说明其所指，却会削弱文学呼应；因此将“信息”列作脚注中的释义选择。
translation_notes:
  register: 采用现代、简洁而庄重的叙事语言。“那一带”比“全国”或“国家”更准确地表达χώρα所指的周边地区；句子不机械补出连接词，以符合自然汉语。
