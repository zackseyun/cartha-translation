  text: ⸀διότι καὶ ἐν ἑτέρῳ λέγει· Οὐ δώσεις τὸν ὅσιόν σου ἰδεῖν διαφθοράν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/035.yaml
  text: Therefore he also says in another psalm[c][b][a], ‘You will not let your Holy One see decay.’
translation:
  language: zh_hans
  text: 因此，也在另一篇诗篇[a]中说：“你必不让你的圣者[b]见到朽坏[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文只说“在另一个（地方）中”，也可译作“在另一处”或“在另一段经文中”。
    reason: lexical_alternative
  - marker: b
    text: “圣者”也可译作“忠信者”或“虔诚者”。
    reason: lexical_alternative
  - marker: c
    text: “朽坏”也可译作“败坏”或“腐朽”。
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: 因此
  rationale: 结合上下文，此词在这里引出由前文而来的推论；“因此”比表示原因的“因为”更符合论证推进。
- source_word: καὶ
  choice: 也
  rationale: 表示另加一处经文作为论据，用“也”自然地体现附加作用。
- source_word: ἐν ἑτέρῳ
  choice: 在另一篇诗篇中
  rationale: 希腊文只说“在另一个……中”，所省略的名词须由语境补出；引文出自诗篇，因此正文补作“诗篇”，同时以脚注保留“另一处/另一段”的可能表达。
- source_word: λέγει
  choice: 他说
  rationale: 保留希腊文现在时的经文引用公式及隐含的阳性主语；在此语境中可理解为神说，而不是改译为“经上说”。
- source_word: Οὐ δώσεις
  choice: 你必不让
  rationale: δίδωμι与不定式连用时具有“准许、任凭”的惯用义；“不让”既自然又准确。“必”体现陈述将来时的确定语气。
- source_word: τὸν ὅσιόν σου
  choice: 你的圣者
  rationale: ὅσιος可指对神圣洁、虔诚或忠信的人。“圣者”简洁保留其圣洁含义，也符合本段将此诗应用于耶稣的语境；其他词义在脚注说明。
- source_word: ἰδεῖν
  choice: 见到
  rationale: 保留ὁράω“看见”的基本意象；“见到朽坏”也能表达遭遇或经历朽坏，而不直接改成解释性的“经历”。
- source_word: διαφθοράν
  choice: 朽坏
  rationale: 本段论及复活，与尸身腐朽相关；“朽坏”在现代中文中清楚而庄重，同时保留“败坏”的词义可能。
theological_decisions:
- issue: 诗篇引文中τὸν ὅσιόν σου所指及其弥赛亚含义
  choice: 译作“你的圣者”
  alternative: 你的忠信者；你的虔诚者
  rationale: 保罗在上下文中将这句话用于耶稣的复活。“圣者”能够体现这里的指向，却不在词义中加入超出原文的教义解释；脚注保留“忠信者”等词义。
- issue: ἐν ἑτέρῳ之后省略名词的补足
  choice: 正文补作“另一篇诗篇”
  alternative: 另一处；另一段经文
  rationale: 原文有意简略，但所引内容确实来自诗篇。补出“诗篇”有助于普通读者辨明所指；脚注同时注明希腊文的省略，避免把补足误当作明说。
- issue: λέγει的隐含主语
  choice: 保留为“他说”
  alternative: 经上说；其中说
  rationale: 希腊文未明说主语；“他”保留其语法形式及神作为说话者的可能性，不将其无声改定为“经上”。
translation_notes:
  register: 采用现代、庄重而易懂的书面语。“见到朽坏”有意保留诗篇引文的意象和措辞张力；标点按现代简体中文规范处理。
