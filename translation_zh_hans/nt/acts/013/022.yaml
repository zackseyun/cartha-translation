  to: 他废掉扫罗以后，就为他们兴起大卫作王；并且为他作见证，说：“我找到了耶西的儿子大卫；他是合我心意的人[a]，必遵行我一切的旨意[b]。”
  rationale: 修订仅处理汉语中‘为大卫作见证’可能产生的语义歧义，并使两则脚注更准确、克制地反映希腊原文。其余译文忠实自然，保留原文的王权语境、见证语气与θελήματα的复数信息。
