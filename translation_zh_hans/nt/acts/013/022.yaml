  text: καὶ μεταστήσας αὐτὸν ἤγειρεν ⸂τὸν Δαυὶδ αὐτοῖς⸃ εἰς βασιλέα, ᾧ καὶ εἶπεν μαρτυρήσας· Εὗρον Δαυὶδ τὸν τοῦ Ἰεσσαί, ἄνδρα κατὰ τὴν καρδίαν μου, ὃς ποιήσει πάντα τὰ θελήματά μου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/022.yaml
  text: And after removing him[a], he raised up David for them as king, to whom he also bore witness and said, ‘I have found David the son of Jesse, a man according to my heart[b], who will do all my will.’
translation:
  language: zh_hans
  text: 他废掉扫罗以后，就为他们兴起大卫作王；并且为他作见证，说：“我找到了耶西的儿子大卫；他是合我心意的人[a]，必遵行我一切的旨意[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“一个照着我心的人。”也可理解为“一个合乎我心意的人”；此处可指他与神的心意相合。
    reason: 说明希腊语κατὰ τὴν καρδίαν μου的字面表达及其在上下文中的含义，避免将解释绝对化。
  - marker: b
    text: 希腊原文“旨意”用复数，可指神各样的旨意或意愿。
    reason: 保留θελήματα的复数信息，而正文采用自然的中文表达。
lexical_decisions:
- source_word: μεταστήσας αὐτόν
  choice: 废掉扫罗以后
  rationale: 此处指神撤去扫罗的王位；“废掉”在君王语境中自然明确。原文代词依上下文指扫罗，译出其名可避免中文指代含混。
- source_word: ἤγειρεν
  choice: 兴起
  rationale: 保留圣经中神使领袖出现、担当使命的表达；下文“作王”排除了复活之意。
- source_word: αὐτοῖς εἰς βασιλέα
  choice: 为他们……作王
  rationale: “为他们”表达与格所含的对象或受益关系，“作王”自然传达其角色。
- source_word: ᾧ καὶ εἶπεν μαρτυρήσας
  choice: 又为大卫作见证说
  rationale: 关系代词形式上为与格，但语义是神为或论到大卫作见证；中文明说“大卫”较清楚，也保留见证含义。
- source_word: Εὗρον
  choice: 我找到了
  rationale: 简洁表达已完成的寻找及其结果。
- source_word: τὸν τοῦ Ἰεσσαί
  choice: 耶西的儿子
  rationale: 原文省略“儿子”，但这是希腊语中表示父子关系的惯常结构。
- source_word: ἄνδρα κατὰ τὴν καρδίαν μου
  choice: 合我心意的人
  rationale: 这是现代汉语自然且庄重的表达，传达其与神的心意相合，同时不把它窄化为情感上的喜爱。
- source_word: ὃς ποιήσει
  choice: 必遵行
  rationale: “必”体现将来时，“遵行”适合以人的行动回应神旨意的语境，比直译“做”更自然。
- source_word: πάντα τὰ θελήματά μου
  choice: 我一切的旨意
  rationale: θελήματα为复数，表示神各项旨意、意愿或所定之事；中文以“一切的旨意”既自然，也保留复数的总体意味。
theological_decisions:
- issue: 大卫“合神心意”的含义
  choice: 合我心意的人
  alternative: 一个照着我心的人
  rationale: “合我心意”贴近κατά的符合、依照之意，同时避免将经文解释为大卫在一切品格上都完全无瑕，或仅指情感亲近。
- issue: 神“兴起”大卫的含义
  choice: 兴起大卫作王
  alternative: 立大卫作王
  rationale: “兴起”保留ἐγείρω的圣经语感及神主动使领袖出现的含义；“作王”明确这里不是复活用语。
- issue: 大卫将实行神的意愿
  choice: 必遵行我一切的旨意
  alternative: 必成就我所有的意愿
  rationale: 不把这句话扩展成大卫绝无失败的系统性断言，只按引文表达神对其将实行诸般旨意的见证。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“废掉”符合王权语境；“兴起……作王”和“合我心意”保留圣经语感，但不使用生硬欧化结构。引号采用中文全角标点。
