  yaml_path: translation/nt/acts/013/020.yaml
  text: For about four hundred and fifty years[a]. And after these things he gave judges until Samuel the prophet.
translation:
  language: zh_hans
  text: 约四百五十年[a]。这些事以后，他赐下士师，直到先知撒母耳。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或按另一种连接方式译作：“这些事以后，他赐下士师，约四百五十年，直到先知撒母耳。”这里希腊文的句法和标点存在争议。
    reason: alternative_reading
lexical_decisions:
- source_word: ὡς
  choice: 约
  rationale: ὡς用于数词前，表明数字是约数；“约”简洁自然地保留这一语气。
- source_word: ἔτεσι τετρακοσίοις καὶ πεντήκοντα
  choice: 四百五十年
  rationale: 该与格短语表示时间长度；用汉字写出年数，既保留原文内容，也符合庄重的经文体例。
- source_word: καὶ μετὰ ταῦτα
  choice: 这些事以后
  rationale: 自然表达叙事的先后次序，并保留复数指示语ταῦτα所指的前述诸事；句首的καί无需机械译为“并且”。
- source_word: ἔδωκεν
  choice: 赐下
  rationale: δίδωμι本义为“给”；这里主语是神，对象是以色列的士师。“赐下”既保留“给予”的意象，也符合现代汉语中谈论神之供应的自然表达，且不将其窄化为单纯的行政“任命”。
- source_word: κριτὰς
  choice: 士师
  rationale: 此词指以色列王国建立以前的士师；“士师”是准确且通行的历史与经卷用语，比泛称“领袖”更能保留时代背景。
- source_word: ἕως
  choice: 直到
  rationale: 直接表达士师时期所延续至的终点。
- source_word: Σαμουὴλ τοῦ προφήτου
  choice: 先知撒母耳
  rationale: 属格同位语以身份称号说明撒母耳；“先知撒母耳”是自然、庄重的现代汉语表达。
theological_decisions:
- issue: “约四百五十年”在这一文本和句法困难经节中的位置及所修饰的内容
  choice: 按照所提供的SBLGNT文本，将“约四百五十年”作为承接上文的独立时间短语，随后另起一句：“这些事以后，他赐下士师，直到先知撒母耳。”
  alternative: 按另一种标点或文本理解，把四百五十年直接连于士师时期：“此后约有四百五十年，他赐给他们士师，直到先知撒母耳。”
  rationale: 所提供的希腊文本把时间短语置于“这些事以后”之前，但该短语与上下文的句法关系历来有争议。正文忠实反映给定文本的次序，不以年代协调来消除张力；另一种连接方式则在脚注中明确保留。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“约四百五十年”有意保留原文中突出的独立时间短语及其不完全明确的衔接；“赐下士师”保留圣经叙事中的给予意象，同时避免添加原文未明说的间接宾语。脚注标记[a]已在正文对应位置出现。
