  text: εἶπεν· Ὦ πλήρης παντὸς δόλου καὶ πάσης ῥᾳδιουργίας, υἱὲ διαβόλου, ἐχθρὲ πάσης δικαιοσύνης, οὐ παύσῃ διαστρέφων τὰς ⸀ὁδοὺς κυρίου τὰς εὐθείας;
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/010.yaml
  text: And he said[a], “You who are full of every kind of deceit and every kind of villainy, son of the devil, enemy of all righteousness, will you not stop twisting the straight ways of the Lord?”
translation:
  language: zh_hans
  text: 他说：“你这充满各样诡诈和各样奸恶的人，魔鬼之子，一切公义[a]的仇敌！你还不停止歪曲主正直的道路吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“正义”。希腊词在不同语境中可指公义或正义。
    reason: lexical_alternative
lexical_decisions:
- source_word: πλήρης παντὸς δόλου
  choice: 充满各样诡诈
  rationale: πλήρης加属格表示被某事物充满或以其为特征；δόλος指欺骗、诡诈或奸计。“各样”自然表达παντός的全面含义。
- source_word: πάσης ῥᾳδιουργίας
  choice: 一切奸恶
  rationale: ῥᾳδιουργία指不择手段、奸诈邪恶的行径，不只是泛指邪恶；“奸恶”既保留尖锐的道德谴责，也与“诡诈”有所区别。
- source_word: υἱὲ διαβόλου
  choice: 魔鬼之子
  rationale: υἱέ直译为“儿子”；“……之子”保留圣经语境中表示归属或品性相似的表达，并维持斥责的力度。
- source_word: ἐχθρὲ πάσης δικαιοσύνης
  choice: 一切公义的仇敌
  rationale: δικαιοσύνη在此主要指道德上的正直、公义；“公义”保留其神学和伦理含义。“正义”作为可能译法列入脚注。
- source_word: οὐ παύσῃ
  choice: 你还不停止……吗
  rationale: 将带斥责意味的将来时反问译为现代汉语的“还不停止……吗”，保留质问语气，又不加强成“永远不停止”。
- source_word: διαστρέφων
  choice: 歪曲
  rationale: διαστρέφω表示使原本正直的事物偏斜、扭曲；“歪曲”在现代汉语中可自然用于道路所代表的教导或行事方式。
- source_word: τὰς ὁδοὺς κυρίου τὰς εὐθείας
  choice: 主的正道
  rationale: ὁδοί既可指道路，也可比喻行事方式；εὐθείας强调笔直、正直。“正道”在简体中文中简洁自然，同时兼顾道路意象和道德含义。
- source_word: Ὦ
  choice: 你这……的人
  rationale: Ὦ引出强烈的直接称呼。现代汉语以“你这……的人”自然呈现其呼告和斥责语气，避免古雅生硬的音译式叹词。
theological_decisions:
- issue: δικαιοσύνη的译法
  choice: 公义
  alternative: 正义
  rationale: 此处所说的是与一切正直、合宜之事为敌，范围偏向道德和属灵层面的“公义”；同时，原词也可突出公平正直的“正义”，故在脚注中保留这一可能。
translation_notes:
  register: 采用现代、庄重而有力度的斥责语气。“你这……的人”承接连续的呼格称谓；“魔鬼之子”“公义的仇敌”保留原文鲜明的平行结构。标点将前三项指控与末尾反问清楚分开。
