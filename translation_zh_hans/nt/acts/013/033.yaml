source:
  edition: SBLGNT
  text: ὅτι ταύτην ὁ θεὸς ἐκπεπλήρωκεν τοῖς τέκνοις ⸀ἡμῶν ἀναστήσας Ἰησοῦν, ὡς καὶ ἐν τῷ ⸂ψαλμῷ γέγραπται τῷ δευτέρῳ⸃· Υἱός μου εἶ σύ, ἐγὼ σήμερον γεγέννηκά σε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/033.yaml
  text: 'that God has fulfilled this for our children by raising up Jesus[a], as it is also written in the second Psalm: ‘You are my Son[b]; today I have begotten you.’'
translation:
  language: zh_hans
  text: 神已经为我们的儿女[a]成就了这事，藉着兴起耶稣[b]，正如《诗篇》第二篇所记：“你是我的儿子；我今日生了你。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“为我们，就是他们的儿女”；另一些抄本支持“为我们的儿女”。
    reason: textual_variant
  - marker: b
    text: 也可译作“使耶稣从死人中复活”；这里的希腊语也可能指神兴起耶稣，即使他出现或受立。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκπεπλήρωκεν
  choice: 已经……成就了
  rationale: 以“已经……了”体现完成时所表达的已完成且仍具现实意义的行动；“成就”也保留路加—使徒行传中应许得以实现的语义。
- source_word: ταύτην
  choice: 这事
  rationale: 希腊文只用指示代词，回指上文的应许；“这事”在现代汉语中自然，同时不把“应许”一词直接增补进正文。
- source_word: τοῖς τέκνοις ἡμῶν
  choice: 为我们的儿女
  rationale: 按所给SBLGNT正文直译与顺译；τέκνα在语境中也可指后代。相关抄本异文及“为我们这些作儿女的”这一读法收入脚注。
- source_word: ἀναστήσας Ἰησοῦν
  choice: 就是使耶稣兴起
  rationale: “兴起”保留ἀνίστημι在本处可能指使耶稣从死人中复活，也可能指使他出现、被立起承担使命的张力；“就是”使分词结构与前面的“成就”自然衔接。
- source_word: γέγραπται
  choice: 所记
  rationale: 采用现代汉语常用的经文引介表达，传达圣经中已有并持续有效的记载。
- source_word: ψαλμῷ ... τῷ δευτέρῳ
  choice: 《诗篇》第二篇
  rationale: 贴近希腊文“第二篇诗篇”，并符合现代中文引用圣经篇章的习惯。
- source_word: Υἱός μου εἶ σύ
  choice: 你是我的儿子
  rationale: 按自然汉语语序准确表达父子身份宣告，不另加解释。
- source_word: σήμερον γεγέννηκά σε
  choice: 我今日生了你
  rationale: “生了你”直接对应γεννάω，并保留《诗篇》2:7的互文与基督论分量；“今日”保持庄重的经文语体。
theological_decisions:
- issue: ἀναστήσας Ἰησοῦν在本段中的含义
  choice: 正文译为“使耶稣兴起”，保留复活与使其出现、承担使命之间的歧义
  alternative: 明确译作“使耶稣从死人中复活”，或“兴起、设立耶稣”
  rationale: 下节会明确谈及从死人中复活，而《使徒行传》也可用ἀνίστημι表示神兴起一位领袖或拯救者。因此正文不预先裁定，脚注列出两种理解。
- issue: “我今日生了你”的基督论含义
  choice: 直接保留《诗篇》2:7的引文，不作解释性扩写
  alternative: 解释为君王登基、被立为子，或解释为复活中的公开印证
  rationale: 翻译不应在正文中解决后来的神学争论；直译既保留原引文，也让本段自身的语境承担解释功能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“成就了这事”“使耶稣兴起”兼顾原文结构和汉语可读性；引文用“今日”维持诗篇语体。脚注标记紧邻各自所说明的词组，避免英文咨询层中标记位置与脚注内容不一致的问题。
