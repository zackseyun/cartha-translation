  to: 神已经为我们的儿女[a]成就了这事，藉着兴起耶稣[b]，正如《诗篇》第二篇所记：“你是我的儿子；我今日生了你。”
  rationale: 修订仅校正脚注a对抄本异文的表达、脚注b的汉语误用，并将“就是使耶稣兴起”调整为“藉着兴起耶稣”，以更贴合原文的分词结构。正文仍不将“兴起”解释性限定为复活，也不在诗篇引文中加入神学说明。
