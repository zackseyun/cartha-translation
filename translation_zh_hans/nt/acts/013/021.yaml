  text: κἀκεῖθεν ᾐτήσαντο βασιλέα, καὶ ἔδωκεν αὐτοῖς ὁ θεὸς τὸν Σαοὺλ υἱὸν Κίς, ἄνδρα ἐκ φυλῆς Βενιαμίν, ἔτη τεσσεράκοντα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/021.yaml
  text: And from there they asked for a king[a], and God gave them Saul son of Kish, a man from the tribe of Benjamin[b], for forty years.
translation:
  language: zh_hans
  text: 后来，他们求一个王[a]，上帝就把基士的儿子扫罗赐给他们；他是便雅悯支派的人。扫罗作王四十年[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从那里，他们求一个王。”原文开头的词既可表示“从那里”，也可在历史叙述中用作承接次序的过渡语。
    reason: lexical_alternative
  - marker: b
    text: 这里的“四十年”按原文保留。有读者指出，将这一时段与旧约中的相关资料比较时，可能会产生年代方面的问题。
    reason: cross_reference
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: 此后
  rationale: 该词承接前面的历史叙述，可兼有“从那里”和“随后”的过渡意味；本处描述历史次序，译作“此后”更符合现代汉语叙事，脚注保留较直译的可能。
- source_word: ᾐτήσαντο βασιλέα
  choice: 他们请求立一个王
  rationale: 中间语态表明百姓为自己提出请求；“请求”不把语气强化为“强求”，“立一个王”则自然表达所求的是君王统治。
- source_word: ἔδωκεν αὐτοῖς ὁ θεὸς
  choice: 上帝就把……赐给他们
  rationale: 保留“上帝”为明确主语以及 δίδωμι 的“给予”意象；“赐给”在此庄重自然，也体现这是上帝对请求的回应，而不窄化为“任命”。
- source_word: τὸν Σαοὺλ υἱὸν Κίς
  choice: 基士的儿子扫罗
  rationale: 按现代中文圣经人名惯例音译，并以自然的中文亲属结构表达父子关系。
- source_word: ἄνδρα ἐκ φυλῆς Βενιαμίν
  choice: 他是便雅悯支派的人
  rationale: ἀνήρ 在此指扫罗本人；单独成句可避免生硬的同位语堆叠，并清楚保留其支派出身。
- source_word: ἔτη τεσσεράκοντα
  choice: 扫罗作王四十年
  rationale: 原文为表时段的宾格短语，最自然地关联上帝把扫罗赐给他们作王这件事。中文补出“扫罗作王”以明确时段所指，不改变原句的历史断言。
theological_decisions:
- issue: ἔτη τεσσεράκοντα（四十年）的修饰关系及年代问题
  choice: 译为“扫罗作王四十年”，把时段理解为扫罗的统治期。
  alternative: 较形式化地译作“赐给他们四十年”，或将该时段宽泛地理解为这一历史阶段。
  rationale: 按希腊文语序，该时段最自然地修饰上帝赐下扫罗作王一事。译文保留路加所述的“四十年”，不因与旧约材料比较时可能产生的年代问题而进行调和。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“此后”顺畅承接历史次序；分号及后续短句清楚交代扫罗的父系、支派与统治时长。正文中的[a]、[b]均与脚注对应。
