base_translation:
  language: en
  yaml_path: translation/nt/acts/013/003.yaml
  text: Then[a], after fasting and praying and laying their hands on them, they sent them off.
translation:
  language: zh_hans
  text: 于是，他们禁食、祷告，并按手在二人身上之后，就打发二人去了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “打发二人去了”也可译作“让他们离去了”“释放了他们”或“遣散了他们”。在本段语境中，是指让巴拿巴和扫罗离开并启程执行所受的工作。
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: 于是
  rationale: 表示承接上文先知性的指示及随后采取的行动；“于是”在现代汉语中自然地兼具时间与叙事推进作用。
- source_word: νηστεύσαντες
  choice: 禁食
  rationale: 不定过去时分词表示在主要动作之前或作为其预备而进行的行动；与后续并列动作合译，汉语无需机械增添“之后”。
- source_word: προσευξάμενοι
  choice: 祷告
  rationale: 与“禁食”并列，保留共同体为差派所作的属灵预备，表达简洁自然。
- source_word: ἐπιθέντες τὰς χεῖρας αὐτοῖς
  choice: 按手在二人身上
  rationale: 保留具体的按手动作，不把它解释为某种特定的圣礼、按立或教会制度；“二人”明确指上文的巴拿巴和扫罗。
- source_word: ἀπέλυσαν
  choice: 让他们出发了
  rationale: 该动词本义可指释放、遣散或让人离去；在宣教行程的语境中，“让他们出发”自然表达准许并送其启程，同时不把教会塑造成使命的最终发起者。
- source_word: αὐτοῖς
  choice: 二人
  rationale: 此与格代词在按手短语中指巴拿巴和扫罗；用“二人”避免连续使用“他们”而产生施事者与受事者混淆。
theological_decisions:
- issue: 按手行动的性质
  choice: 只描述“按手在二人身上”，不附加制度性定义
  alternative: 译作“按立他们”“为他们祝福”或“正式委任他们”
  rationale: 经文本身记载禁食、祷告、按手和让他们出发，却没有界定这一行动是否属于按立、祝福或特定圣礼；应保留其神学张力。
- issue: ἀπέλυσαν所表达的差派关系
  choice: 译为“让他们出发了”
  alternative: “差遣他们出去”“释放了他们”或“遣散了他们”
  rationale: 上文是圣灵吩咐分别巴拿巴和扫罗，因此这里不宜用可能暗示教会是使命最终发起者的强释义；“让他们出发”既符合语境，也保留“释放／让离去”的词义空间。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“于是”衔接上文；“按手”沿用普通华语基督教读者熟悉且贴近原文的表达，但不作宗派性解释。脚注保留ἀπέλυσαν的词义幅度。
