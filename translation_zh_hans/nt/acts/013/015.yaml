id: ACT.13.15
reference: Acts 13:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: μετὰ δὲ τὴν ἀνάγνωσιν τοῦ νόμου καὶ τῶν προφητῶν ἀπέστειλαν οἱ ἀρχισυνάγωγοι πρὸς αὐτοὺς λέγοντες· Ἄνδρες ἀδελφοί, εἴ ⸀τίς ἐστιν ⸂ἐν ὑμῖν λόγος⸃ παρακλήσεως πρὸς τὸν λαόν, λέγετε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/015.yaml
  text: After the reading of the Law and the Prophets[a], the synagogue rulers sent word to them, saying, “Brothers, if there is among you any word of encouragement for the people[b], speak.”
translation:
  language: zh_hans
  text: 宣读完律法书和先知书之后，会堂的主管们派人对他们说：“弟兄们，你们中间若有什么劝勉众人的话[a]，就请讲吧。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “劝勉”也可译作“鼓励”或“劝诫”；原文词语可包含这些意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνάγνωσιν
  choice: 宣读
  rationale: 这里指会堂聚会中公开诵读经书；“宣读”自然体现出声、公开阅读的场景。
- source_word: τοῦ νόμου καὶ τῶν προφητῶν
  choice: 律法书和先知书
  rationale: 指犹太经书的两个公认部分；中文加“书”可清楚表明这里所说的是经书，而非抽象律法或先知本人。
- source_word: ἀρχισυνάγωγοι
  choice: 会堂的主管们
  rationale: 指负责管理会堂及聚会秩序的人；“主管”准确而不暗示民政统治权。
- source_word: ἀπέστειλαν ... πρὸς αὐτοὺς
  choice: 派人对他们说
  rationale: 原文直译为“差遣到他们那里”，随后接直接引语；中文用“派人对他们说”自然表达由主管传话这一动作，同时不把传话者强行具体化。
- source_word: Ἄνδρες ἀδελφοί
  choice: 弟兄们
  rationale: 这是对男性同胞兼同信群体的尊敬、亲切称呼；中文“弟兄们”保留其阳性和群体关系，避免生硬直译为“男人弟兄们”。
- source_word: εἴ τίς ἐστιν ἐν ὑμῖν λόγος
  choice: 你们中间若有什么……话
  rationale: 保留原文较为非人称的结构“你们中间若有任何话”，不改写成只有某个人“有话要说”。
- source_word: λόγος παρακλήσεως
  choice: 劝勉……的话
  rationale: παράκλησις可涵盖鼓励、安慰和劝诫；“劝勉”在此正式发言的邀请中较为自然，并保留其督促与鼓励的双重色彩。
- source_word: πρὸς τὸν λαόν
  choice: 众人
  rationale: 指在场的会众，是这番话的对象；融入“劝勉众人的话”符合现代汉语表达。
- source_word: λέγετε
  choice: 就请讲吧
  rationale: 这是邀请对方向会众发言的命令式；加“请”体现语境中的礼貌邀请，“讲吧”自然传达发言许可。
theological_decisions:
- issue: 会堂场景中的性别化称呼
  choice: 弟兄们
  alternative: 弟兄姊妹们
  rationale: Ἄνδρες ἀδελφοί在语法和语境上均为阳性，并直接称呼保罗及其同行者；译文保留阳性，不将其泛化为男女兼称。
- issue: παράκλησις的语义范围
  choice: 劝勉
  alternative: 鼓励；劝诫；安慰
  rationale: 该词在此可兼指鼓励与劝诫，不能仅凭上下文排除其中一面；正文采用覆盖面较广的“劝勉”，脚注说明其语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“宣读”“会堂的主管们”交代正式宗教聚会场景；直接引语保持礼貌且自然。脚注标记[a]已置于对应词组之后。
