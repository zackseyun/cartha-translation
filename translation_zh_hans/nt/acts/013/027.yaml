source:
  edition: SBLGNT
  text: οἱ γὰρ κατοικοῦντες ἐν Ἰερουσαλὴμ καὶ οἱ ἄρχοντες αὐτῶν τοῦτον ἀγνοήσαντες καὶ τὰς φωνὰς τῶν προφητῶν τὰς κατὰ πᾶν σάββατον ἀναγινωσκομένας κρίναντες ἐπλήρωσαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/027.yaml
  text: For those who live in Jerusalem and their rulers[a], because they did not recognize this one and by condemning him fulfilled the voices of the prophets that are read every Sabbath[b],
translation:
  language: zh_hans
  text: 因为住在耶路撒冷的人和他们的官长[a]不认识这一位，也不明白每逢安息日所诵读的众先知的话[b]；他们定了他的罪，就使这些话应验了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他”。希腊文直译为“这一位”，可能强调说话者这里所指的耶稣。
    reason: lexical_alternative
  - marker: b
    text: 或译“众先知的声音”。希腊文直译为“众先知的声音”；这里指先知的宣告或话语。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ κατοικοῦντες ἐν Ἰερουσαλὴμ
  choice: 住在耶路撒冷的人
  rationale: 该分词短语作名词使用，指一群居民；此译法符合现代汉语，又保留“居住”的基本含义。
- source_word: οἱ ἄρχοντες αὐτῶν
  choice: 他们的官长
  rationale: ἄρχοντες在此指具有治理和审判权柄的人；“官长”兼顾其领导与司法职能。
- source_word: τοῦτον
  choice: 这一位
  rationale: 保留希腊文指示代词的明确指向及强调意味，而不弱化为普通代词“他”。
- source_word: ἀγνοήσαντες
  choice: 不认识……也不明白
  rationale: 此处既涉及未认出耶稣的身份，也涉及未领会先知宣告的意义；按汉语习惯分别用“认识”和“明白”表达同一动词在两个宾语前的语境含义。
- source_word: τὰς φωνὰς τῶν προφητῶν
  choice: 众先知之声
  rationale: φωνάς直译为“声音”；保留这一鲜明说法，呈现先知借经文持续发声的意象。
- source_word: τὰς κατὰ πᾶν σάββατον ἀναγινωσκομένας
  choice: 每逢安息日所诵读的
  rationale: 准确表达经文在每个安息日公开宣读的惯常实践；“诵读”比单纯“读”更能体现公共礼仪场景。
- source_word: κρίναντες
  choice: 定了他的罪
  rationale: 上下文所指不是一般判断，而是对耶稣作出有罪判决；补出隐含宾语，使汉语清楚自然。
- source_word: ἐπλήρωσαν
  choice: 使这些话应验了
  rationale: πληρόω在此表示使先知的宣告得到应验；“这些话”回指前面的“众先知之声”，避免汉语中“应验声音”的生硬表达。
- source_word: γὰρ
  choice: 因为
  rationale: γάρ说明前文所述之事的缘由；“因为”在现代汉语中自然地保留解释关系。
theological_decisions:
- issue: 对耶稣及先知之声的“不认识”
  choice: 不认识这一位，也不明白……众先知之声
  alternative: 只译作“不认识这一位”，把“众先知之声”单纯看作“应验”的宾语
  rationale: 希腊文词序允许“众先知之声”与“这一位”一同受ἀγνοήσαντες支配，同时它又在意义上成为ἐπλήρωσαν所应验的内容。译文保留居民和官长既未认出耶稣、也未领会先知宣告这一层张力。
- issue: 定罪与预言应验的关系
  choice: 他们定了他的罪，反而使这些话应验了
  alternative: 他们定罪之后，使这些话应验了
  rationale: 分词κρίναντες可表达伴随或方式；“反而”呈现其行动在不自知中成就先知宣告的语境关系，但不把他们的责任解释为无罪。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句首“因为”保留本节与上文的解释关系；以分号理清较长的希腊句法。“这一位”和“众先知之声”较为形式对应，并分别用脚注说明更自然的替代译法。
