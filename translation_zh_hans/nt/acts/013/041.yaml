  naturalness: 原译庄重而可懂；但“向你们详述这件事”稍显书面且脚注没有记录该词的详细讲述义。改为“把这件事详细讲给你们听”更符合现代标准汉语，也使“这件事”明确回指神所施行的作为。
  terminology: “藐视的人”“灭亡”“绝不会相信”均恰当，不预设特定教义解释。“一件事”虽自然，但“一个作为”更能在中文中保留ἔργον所指神所成就之行动，而不把内容具体化为拯救或审判。
