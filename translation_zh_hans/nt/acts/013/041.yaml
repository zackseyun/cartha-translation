  text: Ἴδετε, οἱ καταφρονηταί, καὶ θαυμάσατε καὶ ἀφανίσθητε, ὅτι ἔργον ⸂ἐργάζομαι ἐγὼ⸃ ἐν ταῖς ἡμέραις ὑμῶν, ⸀ἔργον ὃ οὐ μὴ πιστεύσητε ἐάν τις ἐκδιηγῆται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/041.yaml
  text: Look[a], you scoffers, and marvel, and perish; for I am doing a work in your days[c][b], a work that you will certainly not believe if someone tells it to you.
translation:
  language: zh_hans
  text: “你们这些藐视的人，要看，要惊奇，要灭亡！因为我在你们的日子正在成就一个作为；即使有人把这件事详细讲给你们听，你们也绝不会相信。”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灭亡”也可译作“消失”或“被毁灭”。这里引自《哈巴谷书》1:5的希腊文本，带有遭毁灭的严厉警告。
    reason: lexical_alternative
  - marker: b
    text: “详细讲给你们听”也可译作“向你们充分叙述”或“向你们详加说明”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἴδετε
  choice: 要看
  rationale: 复数不定过去时命令式，用来郑重唤起听众注意；“要看”简明、自然，也保留命令语气。
- source_word: οἱ καταφρονηταί
  choice: 你们这些藐视的人
  rationale: 该词指以轻蔑态度看待或拒绝的人；“藐视的人”比“嘲笑的人”更直接保留词根所表达的轻蔑，同时不限定为言语讥讽。
- source_word: θαυμάσατε
  choice: 要惊奇
  rationale: 命令式带有先知性、近乎反讽的震惊意味；“惊奇”既通顺，也不过度解释为敬畏或赞叹。
- source_word: ἀφανίσθητε
  choice: 并且灭亡
  rationale: 该被动命令式可表示消失、归于无有或遭毁灭；此处警告语境支持“灭亡”，同时其语义范围在脚注中说明。
- source_word: ἔργον
  choice: 一件事
  rationale: 这里指神所施行的重大作为。汉语若直译为“一件工作”不够自然；“一件事”与“行”搭配流畅，并保留所指行动的宽泛性。
- source_word: ἐργάζομαι ἐγώ
  choice: 我正在行
  rationale: 现在时配合显明的主语ἐγώ，突出说话者亲自在当时施行；“我正在行”兼顾持续体与强调。
- source_word: ἐν ταῖς ἡμέραις ὑμῶν
  choice: 在你们的日子
  rationale: 保留原文的闪语式时间表达及对当代听众的直接性，现代中文仍可理解。
- source_word: οὐ μὴ πιστεύσητε
  choice: 你们也绝不会相信
  rationale: οὐ μή加虚拟式表达强烈否定；“绝不会”清楚传达其强调力度。
- source_word: ἐάν τις ἐκδιηγῆται ὑμῖν
  choice: 即使有人向你们详述这件事
  rationale: ἐάν在此配合强烈否定可自然译为让步性的“即使”；ἐκδιηγέομαι含充分讲述、详细叙说之意，因此译作“详述”。
theological_decisions:
- issue: 如何呈现引自《哈巴谷书》希腊文本的审判警告
  choice: 采用直接而严厉的“灭亡”，并保留“绝不会相信”的强调否定
  alternative: 将ἀφανίσθητε译为“消失”或“归于无有”，弱化其明确的毁灭色彩
  rationale: 这段引文在《使徒行传》的语境中是对拒绝神作为者的严肃警告；译文应保留这种力度，但不进一步界定灭亡的具体神学机制。
- issue: ἔργον所指的神圣行动
  choice: 译为“我正在行一件事”，不在正文中明说该事的具体内容
  alternative: 解释性译为“我正在施行拯救”或“我正在施行审判”
  rationale: 上下文有助于读者理解其所指，但本节原文本身只说ἔργον；保留宽泛表达可避免替原文消解拯救与审判并存的张力。
translation_notes:
  register: 采用庄重而现代的先知宣告语体。连续使用“要看，要惊奇，并且灭亡”保留原文三个命令式的突兀力度；避免古雅的“看哪”和较口语化的“你们这些嘲笑人的”。脚注标记已置于正文。
