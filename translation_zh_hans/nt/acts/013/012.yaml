  text: τότε ἰδὼν ὁ ἀνθύπατος τὸ γεγονὸς ἐπίστευσεν ἐκπλησσόμενος ἐπὶ τῇ διδαχῇ τοῦ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/012.yaml
  text: Then[a], when the proconsul saw what had happened, he believed[b], being astonished at the teaching of the Lord.
translation:
  language: zh_hans
  text: 于是，行省总督看见所发生的事[a]，就信了，并对主的教导[b]感到惊叹。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“已经发生的事”。
    reason: lexical_alternative
  - marker: b
    text: “主的教导”也可理解为“主所赐的教导”或“有关主的教导”；希腊文属格可有不止一种理解。
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: 那时
  rationale: 作为时间兼叙事推进副词，承接上一事件；“那时”简洁自然。
- source_word: ἰδὼν
  choice: 看见
  rationale: 将不定过去时分词按汉语习惯纳入时间关系：“看见……就……”，兼顾先后与语境中的因果联系。
- source_word: ὁ ἀνθύπατος
  choice: 行省总督
  rationale: 指罗马元老院行省的 proconsul；“行省总督”比泛称“官长”更能保留其历史职衔，同时便于现代读者理解。
- source_word: τὸ γεγονός
  choice: 所发生的事
  rationale: 完成时分词名词化，指已经发生并呈现在眼前的事件；此译法自然，并体现事件已经发生。
- source_word: ἐπίστευσεν
  choice: 就信了
  rationale: 原文未明说相信的对象，因此不增补“信主”或“相信福音”；“就”顺畅表达叙事结果。
- source_word: ἐκπλησσόμενος
  choice: 感到惊叹
  rationale: 现在时分词描述伴随主句的反应；“感到惊叹”体现强烈惊异，又符合现代汉语。
- source_word: ἐπὶ τῇ διδαχῇ
  choice: 对……教导……感到惊叹
  rationale: ἐπί加与格表示惊叹所针对的对象或缘由；这一结构在汉语中自然，也不把关系过度限定为纯粹原因。
- source_word: τοῦ κυρίου
  choice: 主的
  rationale: 保留属格结构，使其可理解为属于或来自主的教导，也容许按语境理解为有关主的教导；不在正文中强行消除歧义。
theological_decisions:
- issue: πιστεύω未明说宾语
  choice: 译作“就信了”，不补出相信的对象
  alternative: “就信了主”或“就相信了这信息”
  rationale: 上下文表明这是对福音信息的信，但希腊文没有明说宾语；保留简洁表达可避免加入原文未限定的神学说明。
- issue: “主的教导”中属格的含义
  choice: 正文保留“主的教导”
  alternative: “主所赐的教导”或“有关主的教导”
  rationale: τοῦ κυρίου可能带有主观、所属或内容方面的含义；正文采用可容纳多重理解的表达，并以脚注提示。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“行省总督”保留罗马官职的历史准确性；句式以“看见……就……”呈现叙事推进，并用分号清楚连接其相信与惊叹的反应。
