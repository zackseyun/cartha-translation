  source_fidelity: 正文基本保留了行程终点、所遇之人的不定性，以及“行邪术者／假先知／犹太人”三个并列身份。可是“走遍了全岛，直到帕福”在汉语中把“走遍”与“直到”并列得不够顺畅；改为“他们走遍全岛，来到帕福”更自然地表达行程终于帕福。原文未明确说在帕福才遇见此人，虽可由语境推知，故不把“在那里”写入正文，以免显性补足。
  naturalness: “一个人，是行邪术的，也是个假先知，是犹太人”重复使用“是”，略显拖沓。将这些同位描述整合为“一个行邪术的犹太人；他是个假先知”更合现代标准汉语，也不改变各描述的范围。
  terminology: “行邪术的”可准确传达此处带负面语境的 μάγος；“假先知”“犹太人”均恰当。“巴耶稣”作为专名音译可保留。原脚注称“也可连写作‘巴耶稣’”，前后字形完全相同，未能实际说明英文审校轨迹中的连字符／连写异文，须改正。
