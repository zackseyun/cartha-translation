  text: διελθόντες δὲ ⸀ὅλην τὴν νῆσον ἄχρι Πάφου εὗρον ⸀ἄνδρα τινὰ μάγον ψευδοπροφήτην Ἰουδαῖον ᾧ ὄνομα ⸀Βαριησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/006.yaml
  text: And after they had gone through the whole island as far as Paphos[a], they found a certain man, a magician, a false prophet, a Jew, whose name was Bar-Jesus.
translation:
  language: zh_hans
  text: 他们走遍全岛，来到帕福，遇见一个行邪术的犹太人；他是个假先知，名叫巴耶稣。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “巴耶稣”所对应的希腊文名字也可拼作 Barjesus；这个名字可能反映闪语的父名结构，意为“耶稣之子”或“约书亚之子”。
    reason: 说明英文审校轨迹所记的 Bar-Jesus／Barjesus 拼写变体及该专名可能的闪语含义；正文保留音译，不把不完全确定的词源解释当作经文本义。
lexical_decisions:
- source_word: διελθόντες δὲ ὅλην τὴν νῆσον ἄχρι Πάφου
  choice: 他们走遍了全岛，直到帕福
  rationale: 以顺承叙事表达分词与主句的关系；“走遍”自然传达 διελθόντες 与 ὅλην 的合意，“直到”保留 ἄχρι 所标示的地理终点。
- source_word: εὗρον ἄνδρα τινὰ
  choice: 在那里遇见一个人
  rationale: “遇见”适合旅途中碰到某人的语境；τινά 的不定性由“一个人”自然表达，无须生硬译作“某一个人”。“在那里”是汉语衔接所需，指帕福，并未增添实质信息。
- source_word: μάγον
  choice: 行邪术的
  rationale: 本语境中的 μάγος 指从事法术、秘术的人；“行邪术的”通俗清楚，并保留上下文的负面意味，避免现代“魔术师”使人联想到舞台表演。
- source_word: ψευδοπροφήτην
  choice: 假先知
  rationale: 直接保留其自称或被视为先知、实为虚假的宗教含义。
- source_word: Ἰουδαῖον
  choice: 犹太人
  rationale: 此处作同位说明，指明此人的族群或宗教身份；上下文没有理由限定为地理意义的“犹太地区人”。
- source_word: ᾧ ὄνομα Βαριησοῦ
  choice: 名叫巴耶稣
  rationale: 以现代汉语常用姓名句式表达希腊语习语；Βαριησοῦ 作为专名音译，不在正文中直接解释其闪语构成。
theological_decisions:
- issue: Βαριησοῦ 这一专名是否按含义翻译
  choice: 音译为“巴耶稣”
  alternative: 译作“耶稣之子”或“约书亚之子”
  rationale: 原文在此把它作为人名使用；按含义翻译会替正文判定其闪语词源，并模糊“耶稣／约书亚”所对应的同名关系。相关可能含义置于脚注更稳妥。
- issue: μάγον 的性质
  choice: 译作“行邪术的”
  alternative: “术士”或“魔法师”
  rationale: 该词可用于不同类型的秘术从业者；本节与“假先知”并列，语境明显负面。“行邪术的”既传达此点，又不额外断定更具体的法术类别。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“也是个”使多个同位描述在汉语中层次清楚；保留“行邪术的”“假先知”“犹太人”三项身份说明，不合并或弱化。
