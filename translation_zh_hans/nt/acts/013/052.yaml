  yaml_path: translation/nt/acts/013/052.yaml
  text: And the disciples were filled with joy and the Holy Spirit[a].
translation:
  language: zh_hans
  text: 门徒们也不断地被喜乐和圣灵充满。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“门徒们也充满了喜乐和圣灵。”这是较简略的译法。希腊语动词为未完成时被动语态，暗示这种被充满的情形是持续或反复发生的。
    reason: 说明未完成时被动语态的持续或反复含义，并提供较简略的汉语译法。
lexical_decisions:
- source_word: οἵ τε
  choice: 也
  rationale: τε承接上文并推进叙事；现代汉语用“也”自然表达这种连接和延续关系。
- source_word: μαθηταὶ
  choice: 门徒们
  rationale: μαθηταί在本段指信从福音的人；“门徒”是准确、通行且易懂的译法，加“们”明确其复数。
- source_word: ἐπληροῦντο
  choice: 不断充满
  rationale: 该动词为未完成时被动态，表示过去一段时间内持续或反复发生的情形。“不断充满”自然保留未完成体的持续或反复意味；汉语在此不强行使用生硬的被动句式。
- source_word: χαρᾶς
  choice: 喜乐
  rationale: χαρά表示喜悦、欢欣；“喜乐”在现代中文中庄重而清楚，也适合本处信徒群体的处境。
- source_word: πνεύματος ἁγίου
  choice: 圣灵
  rationale: 在《使徒行传》的语境中，该短语指在教会使命中运行的神圣之灵；“圣灵”是现代中文准确而通行的称谓。
theological_decisions:
- issue: πνεύματος ἁγίου是指人格性的圣灵，还是泛指一种圣洁的灵性状态
  choice: 圣灵
  alternative: 圣洁的灵／圣洁之灵
  rationale: 《使徒行传》一贯将πνεῦμα ἅγιον用于那位引导并赋能教会使命的圣灵；本处上下文也支持这一明确指称，但中文无须另加冠词。
- issue: “充满”是否同时支配“喜乐”和“圣灵”
  choice: 保留并列结构：“充满喜乐和圣灵”
  alternative: “满心喜乐，并被圣灵充满”
  rationale: 原文以同一个动词支配χαρᾶς与πνεύματος ἁγίου。保留并列可避免把原文拆成两个不同谓语，从而不必要地解释二者之间的关系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不断充满”兼顾希腊语未完成时的持续或反复意味；保留“喜乐和圣灵”的并列，避免超出原文拆解句意。
