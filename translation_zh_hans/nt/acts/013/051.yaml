base_translation:
  language: en
  yaml_path: translation/nt/acts/013/051.yaml
  text: But they shook off the dust from their feet against them and went to Iconium[a].
translation:
  language: zh_hans
  text: 他们便抖落脚上的尘土，以此反对他们，就往以哥念去了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 抖落脚上的尘土是一种象征性的举动，表示与拒绝这信息的人划清界限，并作为反对他们的见证。
    reason: cultural_note
lexical_decisions:
- source_word: οἱ δὲ
  choice: 他们却
  rationale: δέ在此表示轻微转折并推进叙事；带冠词的分词结构所指的是上文的保罗和巴拿巴，汉语用“他们”自然明确。
- source_word: ἐκτιναξάμενοι
  choice: 跺掉
  rationale: ἐκτινάσσω表示用力抖落；动作涉及脚上的尘土，现代汉语“跺掉”简洁自然，也保留动作的力度。
- source_word: τὸν κονιορτὸν τῶν ποδῶν
  choice: 脚上的尘土
  rationale: κονιορτός指松散的尘土；属格τῶν ποδῶν表示尘土所在或附着之处，译作“脚上的尘土”符合汉语表达。
- source_word: ἐπ’ αὐτοὺς
  choice: 表示反对那些人
  rationale: ἐπί加宾格在这一象征性举动中带有针对、反对的意味；如此翻译保留其敌对或见证性的方向，同时不在正文中明确解释为审判。
- source_word: ἦλθον εἰς Ἰκόνιον
  choice: 往以哥念去了
  rationale: ἦλθον叙述向目的地移动，εἰς标明方向；“往……去了”是自然的现代汉语叙事表达。“以哥念”采用通行圣经地名译法。
theological_decisions:
- issue: 跺掉脚上尘土这一象征性举动的含义
  choice: 正文只表达该举动针对并反对那些人，具体文化和神学含义置于脚注
  alternative: 译为“作为反对他们的见证”或“表示对他们的审判”
  rationale: 希腊文明确记载动作及其针对对象，却没有在本节直接说明其完整象征意义。避免把“见证”或“审判”等解释直接写入正文，可保留原文的简洁与张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“跺掉”具体呈现从脚上用力除去尘土的动作；脚注解释文化背景而不使正文过度释义。
