  source_fidelity: “跺掉”通常指跺脚，不是ἐκτινάσσω所指的抖落动作；宜改为“抖落”。“表示反对那些人”可传达ἐπ’ αὐτούς的针对性，但将其与动作分开后稍显解释性，改为“以此反对他们”较紧凑，并保留该象征举动的方向。
  naturalness: 修订后采用自然、庄重的现代汉语叙事表达。“以哥念”是通行地名译法。“然后”并非错误，但希腊语分词与主句的衔接以“便／就”更贴合。
