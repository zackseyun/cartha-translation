  yaml_path: translation/nt/acts/013/040.yaml
  text: 'Therefore watch out[a], lest what has been spoken in the prophets come upon you:'
translation:
  language: zh_hans
  text: 所以，你们要当心，免得先知书上所说的临到你们：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βλέπετε
  choice: 你们要当心
  rationale: 这是第二人称复数现在时命令式，在此用于郑重警告。“你们要当心”既保留持续警醒的语气，也符合现代汉语表达。
- source_word: οὖν
  choice: 所以
  rationale: 承接上文的宣告并引出由此而来的警告；“所以”自然清楚地表达推论关系。
- source_word: μὴ ἐπέλθῃ
  choice: 免得……临到你们
  rationale: μή加不定过去时虚拟式接在命令之后，表达所警戒、力求避免的结果；“临到你们”保留ἐπέρχομαι在审判语境中迫近并降临的意味。
- source_word: τὸ εἰρημένον
  choice: 所说的
  rationale: 带冠词的中性单数完成时被动分词作名词使用，指已经说出且仍然有效的话；汉语“所说的”简洁自然，并可由后文引文具体说明其内容。
- source_word: ἐν τοῖς προφήταις
  choice: 众先知书中
  rationale: ἐν直译为“在……中”。鉴于下文即将引用《哈巴谷书》，此处自然指先知书这一经文集合；“众先知书中”保留文本所在之处的含义，避免只按施事者理解。
theological_decisions:
- issue: “众先知”的所指
  choice: 理解为先知书这一经文集合
  alternative: 主要理解为说话的众先知本人
  rationale: 保罗紧接着引用《哈巴谷书》，上下文支持经卷集合的理解。不过脚注保留“众先知所说”的可能译法，以免消除希腊短语在文本位置与说话者之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你们要当心”传达直接警告；句末保留冒号，因为下一节将给出警告的具体引文。
