  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὥστε καὶ ἐπὶ τοὺς ἀσθενοῦντας ⸀ἀποφέρεσθαι ἀπὸ τοῦ χρωτὸς αὐτοῦ σουδάρια ἢ σιμικίνθια καὶ ἀπαλλάσσεσθαι ἀπ’ αὐτῶν τὰς νόσους, τά τε πνεύματα τὰ πονηρὰ ⸀ἐκπορεύεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/012.yaml
  text: so that even handkerchiefs or work aprons were carried away from his body to the sick[a], and the diseases left them[b], and the evil spirits went out.
translation:
  language: zh_hans
  text: 以致，甚至有手帕或工作围裙从保罗身上被拿去给病人，疾病就离开他们，邪灵也出去了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥστε
  choice: 甚至……就……
  rationale: 承接上一节所述非同寻常的神迹，表达由此产生的结果；汉语不必机械译出“以致”，用“甚至”配合后面的“就”自然体现递进和结果。
- source_word: ἐπὶ τοὺς ἀσθενοῦντας
  choice: 拿去给病人
  rationale: 指物件被带到患病者那里；“给病人”符合现代汉语的移动方向表达。
- source_word: ἀποφέρεσθαι
  choice: 拿去
  rationale: 保留物件从保罗身边被带走、送往病人那里的动作，又比“被带离”更自然。
- source_word: ἀπὸ τοῦ χρωτὸς αὐτοῦ
  choice: 保罗贴身用过的
  rationale: χρώς直指皮肤或身体表面；在本语境中，这一表达说明布件曾贴着保罗的身体。“贴身用过的”自然传达接触来源，并避免生硬的“从他的皮肤”。明确“保罗”也消除汉语代词指向不清。
- source_word: σουδάρια
  choice: 手帕
  rationale: 指擦汗、擦脸之类的小布；“手帕”是简洁且易懂的现代对应词。
- source_word: σιμικίνθια
  choice: 工作围裙
  rationale: 该词指劳动时所穿戴的围裙或工作服饰；“工作围裙”既交代用途，也不过度扩充。
- source_word: ἀπαλλάσσεσθαι
  choice: 离开他们
  rationale: 以疾病为主语，直译其解除、离去之意，同时保留原文将疾病拟作离开患者的表达。
- source_word: νόσους
  choice: 疾病
  rationale: 准确表达各种病症，保留复数集合意义；汉语“疾病”无需形式上的复数标记。
- source_word: πνεύματα τὰ πονηρά
  choice: 邪灵
  rationale: 现代汉语中对敌对、邪恶灵体的清楚而庄重的表达；语境已使其所指明确，无须强加定指标记。
- source_word: ἐκπορεύεσθαι
  choice: 出去了
  rationale: 保留邪灵从受害者身上出去的常见叙事表达，并与前句的结果结构协调。
theological_decisions:
- issue: 经由保罗贴身布件发生医治与赶鬼之事的性质
  choice: 按叙事直接陈述布件被拿给病人后，疾病离开、邪灵出去
  alternative: 把布件解释成圣物或某种固定的施恩机制；或将事件弱化为纯粹象征
  rationale: 经文本身陈述超自然事件，却没有解释其机制，也没有建立敬奉遗物的教义。译文既不添加后世教义，也不淡化路加的叙述。
- issue: 疾病与邪灵的关系
  choice: 保留为并列的两个结果
  alternative: 将所有疾病都解释为邪灵所致，或把邪灵出去并入疾病痊愈之中
  rationale: 希腊文分别陈述疾病离开和邪灵出去，译文不应把二者等同或合并。
translation_notes:
  register: 采用自然、庄重、易懂的现代标准汉语。“贴身用过的”避免“从他的皮肤拿去”在汉语中的生硬感，同时保留布件与保罗身体接触这一关键信息。经文较短，正文已能清楚传达词义，因此不设脚注。
