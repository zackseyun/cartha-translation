  text: τοῦτο δὲ ἐγένετο ἐπὶ ἔτη δύο, ὥστε πάντας τοὺς κατοικοῦντας τὴν Ἀσίαν ἀκοῦσαι τὸν λόγον τοῦ ⸀κυρίου, Ἰουδαίους τε καὶ Ἕλληνας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/010.yaml
  text: This continued for two years[a], so that all who lived in Asia heard the word of the Lord, both Jews and Greeks.
translation:
  language: zh_hans
  text: 这件事持续了两年，以致所有住在亚细亚[a]的人，无论是犹太人还是希腊人，都听见了主的道。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“亚细亚”是指小亚细亚西部的罗马亚细亚行省，不是现代所说的亚洲大陆。
    reason: cultural_note
lexical_decisions:
- source_word: τοῦτο δὲ ἐγένετο
  choice: 这事持续了
  rationale: ἐγένετο本可译为“发生”或“成了”，但结合上一节，τοῦτο指保罗持续教导的安排；与“持续了两年”相连，既符合上下文，也合乎现代汉语。
- source_word: ἐπὶ ἔτη δύο
  choice: 两年
  rationale: ἐπί加时间宾格表示持续的时段；汉语用“持续了两年”自然准确。
- source_word: ὥστε
  choice: 因此
  rationale: ὥστε在此引出前述活动所产生的结果。“因此”清楚表达结果关系，同时避免暗示这只是预期目的。
- source_word: πάντας τοὺς κατοικοῦντας τὴν Ἀσίαν
  choice: 所有住在亚细亚的人
  rationale: 保留πάντας的普遍范围和κατοικοῦντας“居住”的含义；Ἀσία按传统地名译作“亚细亚”，并以脚注说明其历史地理所指。
- source_word: ἀκοῦσαι
  choice: 都听见了
  rationale: 直译ἀκούω的结果性不定式；加“都”与πάντας呼应，使汉语句意清楚。
- source_word: τὸν λόγον
  choice: 道
  rationale: λόγος在《使徒行传》中常指所传扬的福音信息。“道”保留路加反复使用这一词语的神学和文学联系，也符合中文圣经语体。
- source_word: τοῦ κυρίου
  choice: 主的
  rationale: 属格自然修饰λόγον，译作“主的道”；κύριος在此保留为“主”，不额外限定其所指。
- source_word: Ἰουδαίους τε καὶ Ἕλληνας
  choice: 无论犹太人还是希腊人
  rationale: τε καὶ将两个群体并列包括在内；此译法自然表达二者都涵盖在“所有……的人”之中。
theological_decisions:
- issue: “亚细亚”的地理所指
  choice: 正文保留“亚细亚”，脚注说明是罗马帝国的亚细亚行省
  alternative: 理解为现代亚洲大陆或更广泛的亚洲地区
  rationale: 《使徒行传》中的Ἀσία通常指罗马行省，而非现代所称的亚洲大陆。正文保留历史地名，脚注防止时代错置。
- issue: “所有住在亚细亚的人”的范围
  choice: 保留经文的概括性全称表达
  alternative: 解释为每一个居民都亲自直接听过保罗讲道
  rationale: πάντας明确采用全称语言，但本节没有交代每个人听道的具体方式。译文不削弱其修辞范围，也不额外断定人人都直接从保罗本人听见。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“这事”承接上一节的教导活动；“主的道”保留《使徒行传》的惯用表达。脚注标记紧随“亚细亚”，使其明确对应地名。
