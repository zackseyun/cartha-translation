id: ACT.19.36
reference: Acts 19:36
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἀναντιρρήτων οὖν ὄντων τούτων δέον ἐστὶν ὑμᾶς κατεσταλμένους ὑπάρχειν καὶ μηδὲν προπετὲς πράσσειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/036.yaml
  text: Therefore[a], since these things are undeniable[c][b], it is necessary for you to remain calm and to do nothing rash.
translation:
  language: zh_hans
  text: 因此，既然这些事无可争辩[a]，你们就必须保持镇定[b]，不可做任何轻率的事[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不容反驳”或“无可否认”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“安静下来”或“保持冷静”。
    reason: lexical_alternative
  - marker: c
    text: 或译：“不可鲁莽行事”或“不可仓促行事”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναντιρρήτων
  choice: 无可争辩
  rationale: 该词表示无法合理反驳或争议；“无可争辩”自然、庄重，并保留原文的强烈语气。
- source_word: οὖν
  choice: 因此
  rationale: 标明本句是从前文论述所得出的结论，符合城里书记正式劝告的语气。
- source_word: ὄντων τούτων
  choice: 既然这些事
  rationale: 将属格独立结构按其因由意味自然地译出，同时不增添“事实”等原文没有的名词。
- source_word: δέον ἐστίν
  choice: 必须
  rationale: 这个无人称结构表达必要或应有的义务；“必须”简洁地保留其约束力。
- source_word: κατεσταλμένους ὑπάρχειν
  choice: 保持镇定
  rationale: 完成时分词与ὑπάρχειν结合，描述处于安定、克制的状态；“保持镇定”既涵盖平静，也符合对骚动群众的劝告。
- source_word: μηδὲν προπετὲς πράσσειν
  choice: 不可做任何轻率的事
  rationale: προπετής指未经慎思、仓促冒进；此译法直接保留μηδέν的全称否定和 πράσσειν 的行动意味。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“因此……既然……”保留原句的推论与因由关系；后半句以“必须……不可……”呈现书记对群众郑重而克制的劝告。
