  yaml_path: translation/nt/acts/019/015.yaml
  text: But the evil spirit answered them[a], “Jesus I know, and Paul I recognize—but who are you?”
translation:
  language: zh_hans
  text: 邪灵却回答他们：“耶稣，我认识；保罗，我也知道[a]；可你们是谁？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“耶稣，我认识；保罗，我也有所了解。”原文在“认识”耶稣和“知道”保罗两处使用了不同的动词，语气可能略有区别。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθὲν δὲ ... εἶπεν αὐτοῖς
  choice: 却回答他们
  rationale: 将分词与限定动词构成的希腊语言说引介合并为自然的现代汉语；“回答”保留回应之意，“却”体现δέ在此处的转折。
- source_word: τὸ πνεῦμα τὸ πονηρόν
  choice: 邪灵
  rationale: 在本语境中指具有位格的邪恶灵体；“邪灵”简洁、清楚，也符合现代汉语常用表达。
- source_word: Τὸν Ἰησοῦν γινώσκω
  choice: 耶稣，我认识
  rationale: “认识”直接表达γινώσκω所含的认识、熟知之意；将“耶稣”前置并用停顿突出，保留原文语序的强调。
- source_word: τὸν Παῦλον ἐπίσταμαι
  choice: 保罗，我也知道
  rationale: 用“知道”区别于前句的“认识”，反映原文改用ἐπίσταμαι，同时不武断界定邪灵对保罗所知的程度。补出“也”使并列关系在汉语中自然明确。
- source_word: ὑμεῖς δὲ τίνες ἐστέ
  choice: 可你们是谁
  rationale: “你们”明确保留ὑμεῖς的复数和强调；“可”自然表达与耶稣、保罗形成的鲜明对比。
theological_decisions:
- issue: 邪灵话语中γινώσκω与ἐπίσταμαι的区别
  choice: 分别译作“认识”和“知道”
  alternative: 两者都译作“认识”；或将后者译作“听说过”
  rationale: 原文有意使用两个不同动词。采用两个常用而不过度具体化的汉语词，既保留修辞差异，也避免把后者解释成仅仅听闻，或据此建立有关邪灵知识程度的教义判断。
translation_notes:
  register: 采用现代、庄重且口语可懂的叙事语言。引语中的前置宾语和停顿保留原文的强调与对比；“认识／知道”的搭配体现词汇差异，但不将其解释得过细。
