  text: ἠγάγετε γὰρ τοὺς ἄνδρας τούτους οὔτε ἱεροσύλους οὔτε βλασφημοῦντας τὴν θεὸν ⸀ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/037.yaml
  text: For you have brought these men here who are neither temple robbers nor blasphemers of our goddess[a].
translation:
  language: zh_hans
  text: 你们把这些人带到这里来，他们既没有盗窃庙宇的财物，也没有亵渎我们的女神。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠγάγετε
  choice: 你们把……带到这里来
  rationale: 这是ἄγω的简单过去时，在现场讲话中指听众已经完成的行动；汉语用“把……带到这里来”自然体现动作及其现场指向。
- source_word: γὰρ
  choice: （不单独译出）
  rationale: γάρ引出对上文的解释或理由；本句在现代汉语中借语序和语气即可自然承接，硬译“因为”会使单节显得悬空。
- source_word: τοὺς ἄνδρας τούτους
  choice: 这些人
  rationale: ἀνήρ在此指被带来的男子；“这些人”在公共集会的直接指称中自然明确，不必添入原文没有的身份信息。
- source_word: οὔτε ... οὔτε
  choice: 既没有……也没有……
  rationale: 准确保留两个并列否定，在现代汉语中自然流畅。
- source_word: ἱεροσύλους
  choice: 抢劫庙宇
  rationale: 该词具体指盗取庙宇或圣所财物的人；用动词短语配合后面的分词结构，比名词“庙宇劫匪”更符合汉语表达。
- source_word: βλασφημοῦντας
  choice: 亵渎
  rationale: 该分词指以侮辱、诋毁性言语冒犯神明；“亵渎”简洁保留其宗教和法律语境。
- source_word: τὴν θεὸν ἡμῶν
  choice: 我们的女神
  rationale: 上下文所指是以弗所人的亚底米；θεός在此带阴性冠词且实际指女性神祇，译作“女神”最准确自然。
theological_decisions:
- issue: 如何翻译指亚底米的τὴν θεὸν ἡμῶν
  choice: 我们的女神
  alternative: 我们的神
  rationale: 说话者是以弗所城的官员，所指明确为亚底米。译作“女神”忠实于语法与语境，也避免让读者误以为这里指独一的真神；这只是语境性翻译，并不表示认同异教信仰。
translation_notes:
  register: 采用现代、庄重而口语自然的公共讲话语体。“可”承接现场辩护的转折关系，使两个否定事实与听众把人带来的行动形成自然对照；不添加原文没有的罪名或评价。
