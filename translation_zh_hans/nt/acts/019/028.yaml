  text: Ἀκούσαντες δὲ καὶ γενόμενοι πλήρεις θυμοῦ ἔκραζον λέγοντες· Μεγάλη ἡ Ἄρτεμις Ἐφεσίων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/028.yaml
  text: When they heard this and became full of wrath[a], they were crying out, saying, “Great is Artemis of the Ephesians!”
translation:
  language: zh_hans
  text: 他们听见这话，便怒气填胸[a]，不断呼喊说：“以弗所人的亚底米是伟大的！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“满腔怒火”、“满怀愤怒”。希腊文直译为“变得充满怒气”，表示强烈的愤怒。
    reason: 词义替代译法，并说明原文的“充满”意象与情绪强度。
lexical_decisions:
- source_word: Ἀκούσαντες
  choice: 他们听见这话
  rationale: 不定过去时分词交代主句行动发生的背景；“这话”依据上文补出希腊文省略的宾语，符合现代汉语表达。
- source_word: δὲ
  choice: 便
  rationale: 此处是轻微承接，兼有事件推进意味；译作“便”自然连接听见与随后的反应，不强化为明显转折。
- source_word: γενόμενοι πλήρεις θυμοῦ
  choice: 怒气填胸
  rationale: 保留“变得充满θυμός”的充满意象，同时以自然庄重的汉语表达强烈愤怒。
- source_word: θυμοῦ
  choice: 怒气
  rationale: θυμός在此表示强烈的愤怒、盛怒；“怒气”既能与“填胸”搭配，也保留其情绪强度。
- source_word: ἔκραζον
  choice: 不断呼喊
  rationale: 未完成过去时表示持续或反复的动作；“不断”明确传达其延续性。
- source_word: λέγοντες
  choice: 说
  rationale: 分词引出呼喊的具体内容；汉语用“呼喊说”简洁自然。
- source_word: Μεγάλη ἡ Ἄρτεμις Ἐφεσίων
  choice: 以弗所人的亚底米是伟大的！
  rationale: 将无系词的欢呼句译为自然、可反复呼喊的汉语，同时准确保留“以弗所人的”这一复数属格关系。
- source_word: Ἄρτεμις
  choice: 亚底米
  rationale: 采用该希腊女神在中文圣经语境中通行的音译，避免误译为泛称。
- source_word: Ἐφεσίων
  choice: 以弗所人的
  rationale: 希腊文为复数属格，具体指以弗所人；此译比“以弗所的”更贴近原文形式与所指。
theological_decisions:
- issue: 如何翻译异教群众的欢呼而不构成译者的神学认同
  choice: 以弗所人的亚底米是伟大的！
  alternative: 以弗所人的亚底米真伟大！
  rationale: 忠实保留群众直接、强烈的宣告，并让它清楚处于引号内的报道话语中；不淡化其偶像崇拜内容，也不添加译者的评断。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“不断呼喊”体现未完成过去时的持续性；引语保留群众口号的直接和有力。
