  to: 市政书记官使人群安静下来后，说：“以弗所人哪，谁不知道以弗所城是大女神阿耳忒弥斯和那从天而降之物的庙宇守护城[a]呢？”
  rationale: 修正神名的中英混杂与残缺音译，并将νεωκόρος作为以弗所城的单一宗教性称号处理。保留“从天而降之物”的含混性，避免在正文增添“神像”或“圣石”等原文未明说的限定。
