  text: καταστείλας δὲ ⸂ὁ γραμματεὺς τὸν ὄχλον⸃ φησίν· Ἄνδρες Ἐφέσιοι, τίς γάρ ἐστιν ⸀ἀνθρώπων ὃς οὐ γινώσκει τὴν Ἐφεσίων πόλιν νεωκόρον οὖσαν τῆς ⸀μεγάλης Ἀρτέμιδος καὶ τοῦ διοπετοῦς;
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/035.yaml
  text: But after the city clerk had quieted the crowd, he said, “Men of Ephesus, for what man is there who does not know that the city of the Ephesians is temple-keeper of the great Artemis and of the image fallen from heaven?”
translation:
  language: zh_hans
  text: 市政书记官使人群安静下来后，说：“以弗所人哪，谁不知道以弗所城是大女神阿耳忒弥斯和那从天而降之物的庙宇守护城[a]呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “庙宇守护城”也可译作“神庙的守护者”。希腊语这个称号指一座城市被认可为某神庙或某种祭祀的照管者。“从天而降之物”直译自希腊语；原文没有说明其具体为何物，在这里可能指与阿耳忒弥斯崇拜有关、被认为从天而降的神像或圣物。
    reason: lexical_alternative
lexical_decisions:
- source_word: καταστείλας
  choice: 使……安静下来后
  rationale: 不定过去时分词表示先于主句动词发生的动作；此译自然地保留了先后次序，也符合书记官平息喧闹人群的语境。
- source_word: ὁ γραμματεὺς
  choice: 城里的书记官
  rationale: 这里指以弗所的市政官员，而非犹太教文士。“城里的书记官”既避免误解，又用普通读者可懂的方式表达其行政身份。
- source_word: Ἄνδρες Ἐφέσιοι
  choice: 以弗所人哪
  rationale: 保留正式呼语的语气；现代汉语无需机械补出“男人们”，此处所称是聚集的以弗所民众。
- source_word: τίς γάρ ἐστιν ἀνθρώπων ὃς οὐ γινώσκει
  choice: 谁不知道
  rationale: 希腊文是预期无人否认的反问；简洁的汉语反问准确传达其修辞力量。
- source_word: νεωκόρον
  choice: 神庙的守护者
  rationale: 该词在此是城市的宗教荣衔，表示获认可为某神庙或祭祀的照管者；“神庙的守护者”比生硬的“守庙者”更自然。
- source_word: τῆς μεγάλης Ἀρτέμιδος
  choice: 大女神亚 Artemis
  rationale: 表达带定冠词和形容词的尊称；“女神”说明本地异教神祇的身份，不表示叙述者认同其信仰主张。
- source_word: τοῦ διοπετοῦς
  choice: 那从天上落下之物
  rationale: 该形容词名词化使用，原文没有明说究竟是神像、圣物还是别的物件；采用较为形式对应的译法，保留真实歧义。
theological_decisions:
- issue: 如何翻译有关 Artemis 和 διοπετές 的异教祭祀主张
  choice: 按书记官的口吻直接报道该城是大女神神庙及“从天上落下之物”的守护者
  alternative: 译为“从天上落下的神像”或“从天上落下的圣石”
  rationale: 这是人物在特定城邦宗教背景下所说的话，并非叙述者对该主张真实性的认可。原文没有明确补出“神像”或“圣石”，正文保留“之物”，脚注说明可能所指，可避免过度释义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以反问句再现书记官安抚群众并诉诸共同认知的语气；对市政职衔和异教宗教荣衔作可理解的表达，同时用脚注保存词义范围及原文对 διοπετές 所指对象的含混性。
