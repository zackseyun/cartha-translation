  naturalness: “亚 Artemis”不合现代汉语，必须改正。“城里的书记官”可以理解，但“市政书记官”更简洁准确。以“庙宇守护城”表达城市作为νεωκόρος的荣衔，虽属较正式用语，配合脚注可保持自然和准确。
  terminology: Ἀρτέμις统一译为“阿耳忒弥斯”。νεωκόρος译作“庙宇守护城”，并在脚注说明这是授予城市的宗教性称号，而非指个人守卫。διοπετές仍译“从天而降之物”，不在正文擅自具体化为神像或圣石。
