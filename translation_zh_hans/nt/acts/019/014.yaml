  text: ἦσαν δέ ⸀τινος Σκευᾶ Ἰουδαίου ἀρχιερέως ἑπτὰ ⸀υἱοὶ τοῦτο ποιοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/014.yaml
  text: There were seven sons of a Jewish chief priest named Sceva doing this[a].
translation:
  language: zh_hans
  text: 有一位名叫士基瓦的犹太祭司长，他的七个儿子正这样做。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“大祭司”。希腊语这个词既可指大祭司，也可较宽泛地指祭司长或属于大祭司阶层的人。
    reason: 保留ἀρχιερεύς在此处可能的两种含义，避免将不确定的职衔解释写死在正文中。
lexical_decisions:
- source_word: ἦσαν δέ
  choice: 也在
  rationale: 未完成时配合δέ承接上文，表示这些人当时也在从事同样的事；中文以“也在”自然体现叙事延续，不另加原文没有的时间副词。
- source_word: τινος Σκευᾶ
  choice: 一个名叫士基瓦的
  rationale: τινος引入一位此前未特指的人；译作“一个名叫……”既保留不定性，也符合现代汉语习惯。
- source_word: Ἰουδαίου
  choice: 犹太
  rationale: 此处主要指民族—宗教身份，而非单纯地理上的犹太地居民。
- source_word: ἀρχιερέως
  choice: 祭司长
  rationale: 该词可指大祭司，也可较宽泛地指高级祭司或祭司长；正文采用“祭司长”，避免断言士基瓦担任唯一的大祭司职分。
- source_word: ἑπτὰ υἱοὶ
  choice: 他的七个儿子
  rationale: 直接表达亲属关系和人数；在中文中补出代词“他的”，清楚连接士基瓦。
- source_word: τοῦτο ποιοῦντες
  choice: 做这事
  rationale: 单数指示代词τοῦτο回指紧邻上文所述行为；“做这事”简洁并保留回指。
theological_decisions:
- issue: ἀρχιερεύς用于士基瓦时的含义
  choice: 祭司长
  alternative: 大祭司
  rationale: ἀρχιερεύς既可特指大祭司，也可较宽泛地指高级祭司人物。士基瓦并无其他资料证明曾任耶路撒冷唯一的大祭司，因此正文不用“大祭司”作确定判断，并以脚注保留另一可能。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“也在”承接上文，“有一个……他的七个儿子”按自然汉语重组原文所有关系。专名Σκευᾶ采用常见中文圣经音译“士基瓦”。
