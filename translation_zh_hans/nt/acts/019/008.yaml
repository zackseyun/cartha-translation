  text: Εἰσελθὼν δὲ εἰς τὴν συναγωγὴν ἐπαρρησιάζετο ἐπὶ μῆνας τρεῖς διαλεγόμενος καὶ ⸀πείθων περὶ τῆς βασιλείας τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/008.yaml
  text: And entering the synagogue[a], he spoke boldly for three months[b], reasoning and persuading them about the kingdom of God.
translation:
  language: zh_hans
  text: 他进了会堂，一连三个月放胆讲论，就上帝的国与人讨论、劝导。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἰσελθὼν δὲ
  choice: 他进了
  rationale: 不定过去时分词交代主句行动的背景；现代汉语用顺承结构自然表达。δὲ在此仅轻微推进叙事，无须另译为强转折词。
- source_word: τὴν συναγωγήν
  choice: 会堂
  rationale: 本词在此特指犹太人的会堂；结合《使徒行传》的语境，译作“会堂”准确而简洁。
- source_word: ἐπαρρησιάζετο
  choice: 放胆讲论
  rationale: 未完成时表示持续进行的公开、勇敢发言；“放胆讲论”既保留胆量与坦然之意，也符合庄重的现代汉语表达。
- source_word: ἐπὶ μῆνας τρεῖς
  choice: 连续三个月
  rationale: ἐπί加宾格表示一段持续时间；“连续三个月”自然呈现其延续性。
- source_word: διαλεγόμενος
  choice: 与人讨论
  rationale: 该分词包含对话、推理和论证的意味；“讨论”保留互动性，又避免“争辩”可能带来的过强对抗色彩。
- source_word: πείθων
  choice: 劝说众人
  rationale: 该词表示以言语促使听者接受某种主张。“劝说”描述劝服行动本身，不强行断定所有听众最终都被说服；“众人”明确原文根据语境省略的听众对象。
- source_word: περὶ τῆς βασιλείας τοῦ θεοῦ
  choice: 就上帝的国
  rationale: περί加属格表示所谈论和劝说的主题。“上帝的国”保留新约中的核心固定表达，同时不把βασιλεία的内涵缩减为单纯地域或抽象统治。
theological_decisions:
- issue: πείθων是否表示劝说的行动或已经成功说服的结果
  choice: 译作“劝说众人”，不明说结果
  alternative: “说服众人”或“试图劝服众人”
  rationale: 希腊文可强调劝服活动，却未在本句明确说明所有听众都接受了信息；“劝说”既不预断成功，也不额外加入“试图”所突出的未成功意味。
- issue: βασιλεία τοῦ θεοῦ的译法
  choice: 上帝的国
  alternative: 上帝的统治
  rationale: βασιλεία兼有国度与掌权的语义。“上帝的国”是准确且易懂的固定表达，并保留原词在具体国度与动态统治之间的丰富内涵。
- issue: πείθων的宾语在原文中省略
  choice: 按语境补出“众人”
  alternative: 不补宾语
  rationale: 会堂中的听众是明显的隐含对象；现代汉语补出“众人”可避免句意残缺，不增加新的神学判断。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。句式保留原文行动的推进：进入会堂、持续放胆讲论，并通过讨论和劝说展开事奉。未采用带有强烈对抗意味的措辞，也未把劝说误写成必然成功的结果。
