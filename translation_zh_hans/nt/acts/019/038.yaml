revisions:
- from: 所以，若底米丢和跟他一起的工匠对任何人有控告，法庭正在开庭[a]，也有总督[b]，让他们彼此提出控告。
  to: 那么，若底米丢和跟他一起的工匠对任何人有控告，法庭正在审理案件[a]，也有罗马行省的代行执政官[b]；就让他们彼此控告吧。
  rationale: 修订以“那么，若”自然呈现原文的承接和条件关系；以“正在审理案件”表达正式司法会议正在举行；并以“罗马行省的代行执政官”准确对应ἀνθύπατοι，避免把专门的罗马官职泛化为一般“总督”。脚注保留“开庭”这一自然替代译法，并说明复数的制度性用法而不强行解释为多个官员同时在场。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T03:29:50Z'
review_pass:
  verdict: revise
  source_fidelity: 译文整体准确传达了条件句、司法程序及相互提告的意思。不过，ἀνθύπατοι 特指罗马的“proconsuls”（前执政官／代行执政官），仅译“总督”未能保留这一明确的罗马官职性质；脚注“在任”也将原文较宽的“有／可用、在场”收窄了。
  naturalness: “所以，若”在现代汉语中略显生硬；“那么，若”更自然。“法庭正在开庭”可以理解，但“法庭正在审理案件”较准确地表达正式举行的司法审讯。“让他们彼此提出控告”可懂，改为“就让他们彼此控告吧”更简洁自然，且保留命令语气。
  terminology: “工匠”“控告”及人名“底米丢”均可。将ἀνθύπατοι译为“罗马行省的代行执政官”能在现代汉语中明确其专门官职，同时保留原文复数；不应把它泛化为一般“总督”。
  issues:
  - severity: medium
    issue: ἀνθύπατοι译作“总督”过于宽泛。
    rationale: 该词是罗马行政官职 proconsul，不只是泛指任何行省总督。正文应体现其罗马官职属性；脚注可说明复数可能是制度性泛称。
  - severity: low
    issue: “所以，若”与“也有总督在任”的表达不够贴合语气和语义范围。
    rationale: εἰ μὲν οὖν更自然可译作“那么，若”；ἀνθύπατοί εἰσιν直译为“有……”，并不明确限定为“在任”。
  revised_text: 那么，若底米丢和跟他一起的工匠对任何人有控告，法庭正在审理案件[a]，也有罗马行省的代行执政官[b]；就让他们彼此控告吧。
