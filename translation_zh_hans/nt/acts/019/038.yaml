  text: εἰ μὲν οὖν Δημήτριος καὶ οἱ σὺν αὐτῷ τεχνῖται ἔχουσιν πρός τινα λόγον, ἀγοραῖοι ἄγονται καὶ ἀνθύπατοί εἰσιν, ἐγκαλείτωσαν ἀλλήλοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/038.yaml
  text: If[a], then, Demetrius and the craftsmen with him have a complaint against anyone, court sessions are being held and there are proconsuls[b]; let them bring charges against one another.
translation:
  language: zh_hans
  text: 那么，若底米丢和跟他一起的工匠对任何人有控告，法庭正在审理案件[a]，也有罗马行省的代行执政官[b]；就让他们彼此控告吧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“法庭正在开庭。”希腊语ἀγοραῖοι ἄγονται指正式举行的司法审理。
    reason: lexical_alternative
  - marker: b
    text: 或译：“也有代行执政官在场／可用。”这里的复数可能是对行省代行执政官这一职务或行政安排的概括说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ μὲν οὖν
  choice: 所以，若
  rationale: 以自然的现代汉语表达推论、承接和条件关系；μέν不宜机械地另译。
- source_word: Δημήτριος
  choice: 底米丢
  rationale: 采用中文圣经传统中通行且易辨认的人名音译。
- source_word: οἱ σὺν αὐτῷ τεχνῖται
  choice: 跟他一起的工匠
  rationale: τεχνῖται指有手艺的工匠；“跟他一起”保留σὺν αὐτῷ，而不额外限定他们与底米丢的关系。
- source_word: ἔχουσιν πρός τινα λόγον
  choice: 对任何人有控告
  rationale: 该短语在语境中指法律上的申诉或案件；“有控告”明确传达司法含义。
- source_word: τινα
  choice: 任何人
  rationale: 在一般性的法律程序陈述中表达不定对象。
- source_word: ἀγοραῖοι ἄγονται
  choice: 法庭正在开庭
  rationale: 该惯用语指正式召开的司法审理；译文自然清楚，并保留程序正在正常进行之意。
- source_word: ἀνθύπατοί εἰσιν
  choice: 也有总督
  rationale: ἀνθύπατος是罗马元老院行省的最高长官，中文通常称“总督”；保留原文复数所体现的一般性或制度性表述，不擅自改为单数。
- source_word: ἐγκαλείτωσαν
  choice: 让他们……提出控告
  rationale: 该动词具有司法语境中的正式指控含义；“提出控告”符合现代汉语法律表达。
- source_word: ἀλλήλοις
  choice: 彼此
  rationale: 保留 reciprocal pronoun 的相互性；与“提出控告”连用，自然表达依法互相申诉。
