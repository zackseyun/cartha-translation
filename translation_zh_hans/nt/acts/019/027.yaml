source:
  edition: SBLGNT
  text: οὐ μόνον δὲ τοῦτο κινδυνεύει ἡμῖν τὸ μέρος εἰς ἀπελεγμὸν ἐλθεῖν, ἀλλὰ καὶ τὸ τῆς μεγάλης θεᾶς ⸂Ἀρτέμιδος ἱερὸν⸃ εἰς οὐθὲν λογισθῆναι, μέλλειν ⸀τε καὶ καθαιρεῖσθαι ⸂τῆς μεγαλειότητος⸃ αὐτῆς, ἣν ὅλη ἡ Ἀσία καὶ ἡ οἰκουμένη σέβεται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/027.yaml
  text: And not only is this trade of ours in danger of coming into disrepute, but also the temple of the great goddess Artemis may be counted as nothing, and even her majesty—whom all Asia and the world worships—may be brought down.
translation:
  language: zh_hans
  text: 不但我们这一行有陷入非议的危险，就连大神阿耳忒弥斯的神庙也可能被看得一文不值；甚至她的威荣[b]也有被贬损的危险——全亚细亚和普天下[a]都敬拜她。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“有人居住的世界”。希腊语常指当时人所知的有人居住之地，尤其是较广泛的罗马世界。
    reason: lexical_alternative
  - marker: b
    text: 或译“宏伟”“伟大”。这里指阿耳忒弥斯备受尊崇的地位或显赫荣耀遭到贬损。
    reason: lexical_alternative
lexical_decisions:
- source_word: κινδυνεύει
  choice: 有……的危险
  rationale: 保留动词表示“处于危险、面临风险”的现在时语气，并符合现代汉语表达。
- source_word: τὸ μέρος
  choice: 我们这一行
  rationale: 本义较宽，但在底米丢谈论工匠生计的语境中指其行业或营生；“这一行”自然且准确。
- source_word: εἰς ἀπελεγμὸν ἐλθεῖν
  choice: 落得声名狼藉
  rationale: 表达陷入受鄙视、受指责或名誉扫地的境地，保留商业利益与社会声望同时受损的意味。
- source_word: ἱερὸν
  choice: 神庙
  rationale: 此处指以弗所著名的阿耳忒弥斯神庙及其圣所范围；“神庙”最清楚。
- source_word: εἰς οὐθὲν λογισθῆναι
  choice: 被看得一文不值
  rationale: 传达“被算为无足轻重、毫无价值”的评价意味；中文习语自然有力，而未增加被毁坏之意。
- source_word: μέλλειν τε καὶ καθαιρεῖσθαι τῆς μεγαλειότητος αὐτῆς
  choice: 甚至她的威荣也将被贬损
  rationale: 希腊文结构紧缩，指阿耳忒弥斯的崇高地位或宏伟荣耀将被拉下、削弱；此译保留即将发生的危机感，也避免限定为实体建筑被拆毁。
- source_word: ὅλη ἡ Ἀσία
  choice: 全亚细亚
  rationale: 指罗马的亚细亚行省；沿用圣经地名“亚细亚”，避免误解为现代整个亚洲。
- source_word: ἡ οἰκουμένη
  choice: 普天下
  rationale: 自然表达当时人所理解的有人居住之世界，并保留底米丢夸张而宏大的修辞。
- source_word: σέβεται
  choice: 敬拜
  rationale: 该词在这里表示对女神的宗教性尊崇；“敬拜”准确呈现异教崇拜语境。
theological_decisions:
- issue: 如何表达异教人物对阿耳忒弥斯的宗教称谓和敬拜
  choice: 大神阿耳忒弥斯……都敬拜她
  alternative: 所谓大神阿耳忒弥斯……都尊崇她
  rationale: 这是对底米丢言论的直接转述。原文没有“所谓”等疏离限定，因此照实保留他的称谓和宗教用语，既不认可其主张，也不擅自淡化。
- issue: καθαιρεῖσθαι与τῆς μεγαλειότητος αὐτῆς的紧缩关系
  choice: 她的威荣也将被贬损
  alternative: 她也将从崇高的地位上被拉下来
  rationale: 原文可理解为她的尊荣被削减，或她从宏伟尊位上被拉下。正文采用自然且接近英语审校层的表达，脚注保留“宏伟、伟大”等词义空间，不把它解释成神庙的物理拆毁。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“我们这一行”贴合演说者对同行工匠的口吻；“声名狼藉”“一文不值”传达原文强烈的煽动性修辞。破折号明确末尾关系从句修饰阿耳忒弥斯。所有脚注标记均已置于正文相应词语之后。
