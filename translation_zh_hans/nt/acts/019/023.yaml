base_translation:
  language: en
  yaml_path: translation/nt/acts/019/023.yaml
  text: At that time there arose no small disturbance concerning the Way[a].
translation:
  language: zh_hans
  text: 那时，围绕着这道[a]，发生了一场不小的骚乱。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“这条道路”。这里指基督信仰及其群体；《使徒行传》中多次用“道”作这样的称呼。
    reason: 说明词义备选及其在《使徒行传》中的称谓用法。
lexical_decisions:
- source_word: Ἐγένετο
  choice: 引起了
  rationale: γίνομαι在这里引出一件事件的发生；结合περὶ所表明的缘由，译为“引起了”使现代汉语自然，同时保留事件突发的动态感。
- source_word: δὲ
  choice: 不单独译出
  rationale: δέ是轻微的叙事衔接语；本句以“那时”自然承接上下文，若另加“却”会过度强化转折，加“于是”则可能增添因果色彩。
- source_word: κατὰ τὸν καιρὸν ἐκεῖνον
  choice: 那时
  rationale: 准确而简洁地表达“在那一段时候”，符合现代汉语叙事习惯。
- source_word: τάραχος
  choice: 骚乱
  rationale: τάραχος指扰乱、动荡或骚动；“骚乱”能体现随后群众事件的规模，又不预先限定为法律意义上的“暴乱”。
- source_word: οὐκ ὀλίγος
  choice: 不小的
  rationale: 保留原文以否定表达肯定的曲言形式，没有直接平滑为“很大”。
- source_word: περὶ
  choice: 因
  rationale: περί加属格指出骚乱所围绕的事项；在本处译作“因”符合汉语表达，表示这场骚乱与“这道”有关，而不过度细化具体因果机制。
- source_word: τῆς ὁδοῦ
  choice: 这道
  rationale: ὁδός在《使徒行传》中反复用作对基督信仰及其群体的称呼。“这道”既保留“道路/道路之道”的词义关联，也让中文读者看出它是特定称谓。
theological_decisions:
- issue: τῆς ὁδοῦ是否作为基督徒运动的称谓处理
  choice: 这道
  alternative: 这条道路
  rationale: 上下文及《使徒行传》的反复用法表明，这里不是普通道路，而是对基督信仰及其群体的称谓。“这道”保持称谓功能，却不增添宗派性解释；脚注说明其所指。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语；保留“不小的”这一原文曲言，并用“骚乱”呈现τάραχος的社会动荡含义。
