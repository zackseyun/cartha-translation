source:
  edition: SBLGNT
  text: Δημήτριος γάρ τις ὀνόματι, ἀργυροκόπος, ποιῶν ναοὺς ἀργυροῦς Ἀρτέμιδος παρείχετο τοῖς τεχνίταις ⸂οὐκ ὀλίγην ἐργασίαν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/024.yaml
  text: For a certain man named Demetrius[a], a silversmith who made silver shrines of Artemis[b], was providing the craftsmen with no small business.
translation:
  language: zh_hans
  text: 原来，有一个名叫底米丢的银匠，制造阿耳忒弥斯的银制神龛[a]，给工匠们带来不少生意[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“阿耳忒弥斯的银制神庙”，也可能指“阿耳忒弥斯神庙的银制模型”。原文所用的词是ναούς（“神龛／神庙”）；在这里很可能指与阿耳忒弥斯崇拜有关的小型工艺品。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“不是少量的生意（或收益）”，是一种曲言表达，意思是生意或收益相当可观。
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: 原来
  rationale: 承接上文并引出解释性背景；“原来”在现代汉语叙事中自然地保留了该连接词的说明作用。
- source_word: Δημήτριος
  choice: 底米丢
  rationale: 按希腊人名音译，并采用现代中文圣经读者较熟悉的形式。
- source_word: ἀργυροκόπος
  choice: 银匠
  rationale: 准确表示以银为材料制作器物的工匠，简洁自然。
- source_word: ναοὺς ἀργυροῦς Ἀρτέμιδος
  choice: 阿耳忒弥斯的银制神龛
  rationale: ναός可指神庙或神龛；在此商业制作语境中，“银制神龛”最自然，也不把这些物件的具体形态说得过于确定。以脚注保留“神庙”及“神庙模型”的可能。
- source_word: Ἀρτέμιδος
  choice: 阿耳忒弥斯
  rationale: 直接音译希腊神名，不以罗马对应神名“狄安娜”替代。
- source_word: παρείχετο
  choice: 带来
  rationale: 表达底米丢持续为同行提供商业活动或收益的意思；结合叙事语境用自然汉语呈现未完成时的惯常作用。
- source_word: τοῖς τεχνίταις
  choice: 给工匠们
  rationale: τεχνίτης指从事该行业的熟练手艺人；“工匠”准确且符合现代汉语。
- source_word: οὐκ ὀλίγην ἐργασίαν
  choice: 不少生意
  rationale: 保留原文“不是少量”的曲言表达，同时以“生意”呈现ἐργασία在此处可指商业活动、营生或收益的语境含义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“原来”保留γάρ对上文的解释作用；“不少生意”既自然，也保留原文曲言的修辞色彩。脚注标记均置于所说明的词组之后。
