  text: οὓς συναθροίσας καὶ τοὺς περὶ τὰ τοιαῦτα ἐργάτας εἶπεν· Ἄνδρες, ἐπίστασθε ὅτι ἐκ ταύτης τῆς ἐργασίας ἡ εὐπορία ⸀ἡμῖν ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/025.yaml
  text: After gathering them together[a], along with the workmen occupied with such things, he said, “Men, you know that from this business we have our prosperity.
translation:
  language: zh_hans
  text: 他把他们和从事这类工作的工人召集起来，说：“各位，你们知道，我们的富裕来自这门生意。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们靠这门行当获得财富。”
    reason: ἐργασία在此可指行业、行当或经营活动；εὐπορία可指财富或富足。此译文保留行业带来财富的含义。
lexical_decisions:
- source_word: συναθροίσας
  choice: 召集起来
  rationale: 该不定过去时分词表示先于主句动作发生的行动；汉语用连动结构“召集起来……说”自然表达其先后关系。
- source_word: τοὺς περὶ τὰ τοιαῦτα ἐργάτας
  choice: 从事这类工作的工人
  rationale: 保留ἐργάτας“工人”的宽泛含义，并以“从事这类工作”自然表达περὶ τὰ τοιαῦτα，避免把原文进一步限定为某一种工匠。
- source_word: Ἄνδρες
  choice: 各位
  rationale: 原词是对在场男性的称呼；现代汉语公开讲话中“各位”庄重自然，语境已清楚表明听众是被召集的工人，故不采用生硬的“男人们”。
- source_word: ἐπίστασθε
  choice: 你们知道
  rationale: 直接表达听众已经掌握或意识到的事实，符合此处劝说语气。
- source_word: ἐκ ταύτης τῆς ἐργασίας
  choice: 从这门生意
  rationale: ἐργασία可指工作、行业或经营活动；此处涉及带来经济收益的商业活动，“这门生意”在现代汉语中清楚而自然。
- source_word: ἡ εὐπορία ἡμῖν ἐστιν
  choice: 我们的富裕……来的
  rationale: εὐπορία指富足、财力充裕或财富；用“我们的富裕是……来的”既保留经济繁荣之意，也自然表达其来源关系。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事和直接引语。“各位”符合普通话讲话场景；“这门生意”体现商业语境而不过度指定为制造神龛的手艺。脚注标记[a]已置于正文相应句末。
