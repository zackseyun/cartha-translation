base_translation:
  language: en
  yaml_path: translation/nt/acts/019/029.yaml
  text: And the city was filled with confusion[a], and they rushed together into the theater, dragging along Gaius and Aristarchus, Macedonians who were Paul’s traveling companions.
translation:
  language: zh_hans
  text: 全城都陷入了混乱[a]。众人强行抓住保罗的旅伴、马其顿人该犹和亚里达古，一齐冲进剧场。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“全城充满了骚乱。”
    reason: 保留συγχύσεως可侧重“混乱、骚乱、纷乱”的词义范围；原文直译为“城被混乱充满”。
lexical_decisions:
- source_word: ἐπλήσθη ἡ πόλις τῆς συγχύσεως
  choice: 全城陷入一片混乱
  rationale: 按希腊语表达全城被混乱充满的状态；中文用“陷入一片混乱”自然传达突发且遍及全城的失序局面，同时不过度指明施动者。
- source_word: ὥρμησάν τε
  choice: 众人……冲进
  rationale: ὁρμάω表示迅猛、突然的行动；“冲进”既体现力度，也与目的地“剧场”自然搭配。
- source_word: ὁμοθυμαδόν
  choice: 一齐
  rationale: 此处强调群众集体采取行动，不含正面的和谐意味；“一齐”简洁准确。
- source_word: τὸ θέατρον
  choice: 剧场
  rationale: θέατρον指公共剧场；“剧场”直接对应原文，不具体化为希腊文未明说的“圆形剧场”。
- source_word: συναρπάσαντες
  choice: 强行拉走了
  rationale: 该分词包含猛然抓住、强制带走之意；“强行拉走”兼顾暴力控制和随人群移动的语境。
- source_word: Γάϊον καὶ Ἀρίσταρχον
  choice: 该犹和亚里达古
  rationale: 采用中文圣经人名的通行音译，便于读者辨认。
- source_word: Μακεδόνας
  choice: 马其顿人
  rationale: 直接表达二人的地域身份。
- source_word: συνεκδήμους Παύλου
  choice: 保罗的旅伴
  rationale: συνεκδήμος指与某人一同离乡旅行的人；“旅伴”自然简明，并准确表达他们与保罗同行的关系。
