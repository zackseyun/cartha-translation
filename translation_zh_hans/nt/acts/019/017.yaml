source:
  edition: SBLGNT
  text: τοῦτο δὲ ἐγένετο γνωστὸν πᾶσιν Ἰουδαίοις τε καὶ Ἕλλησιν τοῖς κατοικοῦσιν τὴν Ἔφεσον, καὶ ⸀ἐπέπεσεν φόβος ἐπὶ πάντας αὐτούς, καὶ ἐμεγαλύνετο τὸ ὄνομα τοῦ κυρίου Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/017.yaml
  text: And this became known to all the Jews and Greeks living in Ephesus[a], and fear fell upon them all[b], and the name of the Lord Jesus was being magnified.
translation:
  language: zh_hans
  text: 这事为所有住在以弗所的犹太人和希腊人所知；惧怕临到他们众人[a]，主耶稣的名也受到尊崇[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“敬畏临到他们众人。”
    reason: φόβος既可指惧怕，也可在此语境中带有敬畏意味。
  - marker: b
    text: 或译：“主耶稣的名也被尊为大”或“也大受尊重”。
    reason: ἐμεγαλύνετο可较贴近形式地译为“被尊为大”，也可按语义译为“大受尊重”；正文采用较自然且庄重的“受到尊崇”。
lexical_decisions:
- source_word: τοῦτο
  choice: 这事
  rationale: 单数指示代词回指上文所述事件；“这事”在中文中自然且指向明确。
- source_word: ἐγένετο γνωστὸν
  choice: 被……知道了
  rationale: 表达“变为人所知”的起始、结果含义，同时保持现代中文自然。
- source_word: πᾶσιν Ἰουδαίοις τε καὶ Ἕλλησιν
  choice: 所有……犹太人和希腊人
  rationale: 与γνωστόν搭配的与格表示得知此事的人；保留“犹太人和希腊人”这两个群体，不把Ἕλληνες解释性改译为“外族人”。
- source_word: τοῖς κατοικοῦσιν τὴν Ἔφεσον
  choice: 住在以弗所的
  rationale: 自然表达κατοικέω所指的居住，并修饰犹太人和希腊人两个群体。
- source_word: ἐπέπεσεν φόβος ἐπὶ πάντας αὐτούς
  choice: 惧怕临到他们众人
  rationale: 保留ἐπιπίπτω的动态意象和πάντας αὐτούς的全称范围；“惧怕”不预先限定为敬畏或恐慌。
- source_word: φόβος
  choice: 惧怕
  rationale: 该词可涵盖害怕、敬畏或惊惧；“惧怕”在本处较宽泛，避免把反应单向解释为宗教敬畏或极度恐慌。
- source_word: ἐμεγαλύνετο
  choice: 越发受到尊崇
  rationale: 以自然中文表达未完成时所呈现的持续发展，并传达“使为大、尊为大”的公开尊荣含义。
- source_word: τὸ ὄνομα
  choice: 名
  rationale: 保留原文“名”的圣经语汇及其所包含的名声、权柄和尊荣意蕴，不窄化为“声誉”。
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: 主耶稣的
  rationale: κύριος在此是耶稣的称号，译作“主”；属格自然连接为“主耶稣的名”。
theological_decisions:
- issue: κύριος用于耶稣时的译法
  choice: 主
  alternative: 主人
  rationale: 本处作为基督论称号，译作“主”既准确又保留其神学分量，避免解释性改写。
- issue: τὸ ὄνομα应直译为“名”还是意译为“声誉”
  choice: 主耶稣的名
  alternative: 主耶稣的声誉
  rationale: “名”是原文明确用词，并具有比现代“声誉”更丰富的身份、权柄及尊荣意蕴，应予保留。
- issue: φόβος所指的是害怕还是敬畏
  choice: 惧怕
  alternative: 敬畏
  rationale: 上下文容许害怕、震撼与敬畏等色彩；正文采用较宽泛的“惧怕”，不消除原文张力，并在脚注列出另一可能。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“被……知道了”贴近原文结构；分号清楚呈现事件传开后产生的两项结果。脚注标记均紧随所说明的正文措辞。
