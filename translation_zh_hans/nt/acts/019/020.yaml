  text: οὕτως κατὰ κράτος ⸂τοῦ κυρίου ὁ λόγος⸃ ηὔξανεν καὶ ἴσχυεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/020.yaml
  text: So the word of the Lord was growing mightily and prevailing[a].
translation:
  language: zh_hans
  text: 主的道就这样大有能力地兴旺，且不断得胜[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大有能力地”也可译作“强有力地”；“不断得胜”也可译作“日益强盛”。
    reason: 说明κατὰ κράτος的副词性用法，并保留ἴσχυεν可表示强盛或占优势的词义幅度。
lexical_decisions:
- source_word: οὕτως
  choice: 就这样
  rationale: 承接前文焚烧邪术书籍等事件，表达这些事所带来的结果；“就这样”自然保留了推论和总结的语气。
- source_word: κατὰ κράτος
  choice: 大有能力地
  rationale: 这一习语表示带着强大的力量或产生强劲的效力；在句中作副词性修饰，主要与“增长”相连，也可理解为涵盖“增长”和“强盛”两个动词。
- source_word: τοῦ κυρίου
  choice: 主的
  rationale: 直译希腊文的称号，不在正文中补出“耶稣”；上下文虽指向主耶稣，译文仍保留原文措辞。
- source_word: ὁ λόγος
  choice: 道
  rationale: 此处指所宣讲的福音信息；“主的道”既符合《使徒行传》中反复出现的表达，也保持庄重而通行的圣经用语。
- source_word: ηὔξανεν
  choice: 增长
  rationale: 未完成时呈现持续发展的过程；汉语借助“日益”等全句语境传达不断进展的意味。
- source_word: ἴσχυεν
  choice: 日益强盛
  rationale: 该词表示有力量、强盛或占优势；“日益强盛”与“增长”自然并列，并体现未完成时所表达的持续进展，同时不把含义收窄为单纯的胜利。
theological_decisions:
- issue: τοῦ κυρίου中“主”的具体所指
  choice: 正文仅译“主”
  alternative: 主耶稣
  rationale: 上下文很可能指主耶稣，但希腊文只写“主”；不在译文中补明所指，可避免超出原文并保留其表达方式。
- issue: “道”增长并强盛的拟人化表达
  choice: 保留“主的道……增长，日益强盛”
  alternative: 主的信息传播得越来越广，影响越来越大
  rationale: 原文把“道”作为两个动词的主语；保留这一表达可维持路加叙事中“道”主动推进的神学意象，而不将其解释性地改写为传播范围或社会影响。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“主的道”保留《使徒行传》的关键词组；“大有能力地增长”略带圣经语体，但能较直接地呈现原文κατὰ κράτος与“增长”的关系。脚注标记已在正文中对应出现。
