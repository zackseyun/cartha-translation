lexical_decisions:
- source_word: ἦσαν
  choice: 有
  rationale: 结合人数统计的语境，用中文存现句“有”自然表达希腊文“他们是／存在”的意思。
- source_word: δὲ
  choice: 不单独译出
  rationale: δέ在此是轻微的衔接词，并无明显转折；现代汉语中省译更流畅，也不损失实质意义。
- source_word: οἱ πάντες
  choice: 一共
  rationale: 该短语概括全组人数；“一共”符合现代汉语报告总数时的习惯表达，并保留总结意味。
- source_word: ἄνδρες
  choice: 男人
  rationale: ἀνήρ在这里明确指男性，不宜泛化为“人”；“男人”在现代汉语中准确、自然。
- source_word: ὡσεὶ
  choice: 约
  rationale: 保留原文对人数的近似表达；“约”简洁而庄重。
- source_word: δώδεκα
  choice: 十二个
  rationale: 准确表达基数，并以量词“个”构成自然的现代汉语人数表述。
