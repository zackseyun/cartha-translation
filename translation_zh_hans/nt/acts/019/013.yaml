  naturalness: “周游各处”是对περιερχομένων自然而准确的现代汉语表达。将援引名号的动作表述为“在……身上援引……的名”既保留原文结构，也避免把“有邪灵”改写为较强的“被附身”。“我凭着……严令你们”在中文中庄重、清楚，并与赶鬼语境相称。
  terminology: 保留“犹太”“邪灵”“主耶稣”“保罗”等既有且恰当的术语。“驱鬼者”较“赶鬼者”稍庄重，适合叙事语体，但不改变含义。“主耶稣的名”忠实表达τὸ ὄνομα τοῦ κυρίου Ἰησοῦ。
