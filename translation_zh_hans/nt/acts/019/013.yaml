source:
  edition: SBLGNT
  text: ἐπεχείρησαν δέ τινες ⸀καὶ τῶν περιερχομένων Ἰουδαίων ἐξορκιστῶν ὀνομάζειν ἐπὶ τοὺς ἔχοντας τὰ πνεύματα τὰ πονηρὰ τὸ ὄνομα τοῦ κυρίου Ἰησοῦ λέγοντες· ⸀Ὁρκίζω ὑμᾶς τὸν Ἰησοῦν ⸀ὃν Παῦλος κηρύσσει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/013.yaml
  text: But some also of the itinerant Jewish exorcists attempted to invoke the name of the Lord Jesus over those who had evil spirits[a], saying, “I adjure you by Jesus[d][c][b], whom Paul proclaims.”
translation:
  language: zh_hans
  text: 有一些周游各处的犹太驱鬼者，也试图在那些有邪灵的人身上援引主耶稣的名，说：“我凭着保罗所传的耶稣，严令你们[a]！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “严令你们”所译的词也可表示“使你们受誓言约束”或“郑重嘱令你们”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεχείρησαν
  choice: 试着
  rationale: 表达采取行动、作出尝试之意，同时保留此举未必成功的含义。
- source_word: τινες καὶ τῶν περιερχομένων Ἰουδαίων ἐξορκιστῶν
  choice: 还有一些游行各处的犹太赶鬼者
  rationale: “一些”对应 τινες，“还有”表达 καὶ 的附加意味；“游行各处”体现 περιερχομένων 往来各地的意思，“赶鬼者”是现代汉语中清楚自然的称呼。
- source_word: ὀνομάζειν ἐπὶ ... τὸ ὄνομα
  choice: 向……呼求……的名
  rationale: 这里不是单纯说出名字，而是在赶鬼时把这名用于有关的人身上；“呼求……的名”既体现调用此名的作用，也符合自然汉语。
- source_word: τοὺς ἔχοντας τὰ πνεύματα τὰ πονηρά
  choice: 那些有邪灵的人
  rationale: 贴近字面“有邪灵的人”，避免用“被附身”把原文表达得更强。
- source_word: τὰ πνεύματα τὰ πονηρά
  choice: 邪灵
  rationale: “邪灵”是现代中文圣经语境中清楚、简洁的对应语，表达 πονηρά 的邪恶性质。
- source_word: τὸ ὄνομα τοῦ κυρίου Ἰησοῦ
  choice: 主耶稣的名
  rationale: 保留 κύριος 的基督论称号“主”，并采用自然的中文属格结构。
- source_word: Ὁρκίζω ὑμᾶς τὸν Ἰησοῦν
  choice: 我凭……耶稣命令你们
  rationale: ὁρκίζω 表示凭某人使对方受誓言约束或作出严正命令；“凭……命令”在现代中文中可懂，并保留赶鬼宣告的庄严力度。
- source_word: ὃν Παῦλος κηρύσσει
  choice: 保罗所传的
  rationale: κηρύσσει 指公开宣讲、传扬；“所传的”简明自然，同时保留关系从句对耶稣的限定。
theological_decisions:
- issue: τοῦ κυρίου Ἰησοῦ 中 κύριος 的译法
  choice: 主耶稣
  alternative: 耶稣主人
  rationale: “主”既是中文中确立的称号，也保留《使徒行传》此处的尊称及神学分量；“主人”在本语境中不自然且容易误导。
- issue: 是否把 τοὺς ἔχοντας τὰ πνεύματα τὰ πονηρά 明说为邪灵附身
  choice: 那些有邪灵的人
  alternative: 那些被邪灵附身的人
  rationale: 原文直说他们“有邪灵”；虽在上下文中很可能指邪灵控制，但正文不把这一关系解释得比希腊文更强。
- issue: ὁρκίζω 的誓言性与命令性
  choice: 我凭……命令你们
  alternative: 我凭……叫你们起誓／我严令你们
  rationale: 此处是赶鬼者对邪灵使用的拘束性宣告。“命令”使普通读者容易理解，而脚注说明原词还带有使对方受誓言约束、严正嘱令的意味。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“游行各处”略带书面色彩，用来准确表达这些赶鬼者往来各地的性质；引语保持严肃的赶鬼宣告语气。
