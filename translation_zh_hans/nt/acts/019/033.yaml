base_translation:
  language: en
  yaml_path: translation/nt/acts/019/033.yaml
  text: And from the crowd they brought forward Alexander[a], since the Jews had pushed him forward; and Alexander, motioning with his hand[b], wanted to make a defense to the assembly.
translation:
  language: zh_hans
  text: 人群中有人把亚历山大带到前面[a]，因为犹太人把他推了出来。亚历山大用手示意，想向民众[b]申辩。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“人群中有人推举亚历山大……犹太人把他推到前面。”希腊原文连续使用两个意义相关的动词，描写亚历山大被公开带到众人面前。
    reason: lexical_alternative
  - marker: b
    text: “民众”也可译为“集会的民众”。这里的词带有公共、城邦群体的意味，与本节前面的“人群”并非同一个词。
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεβίβασαν
  choice: 把……带到前面
  rationale: 在本句中以亚历山大为宾语，并与“从人群中”连用，指把他公开带到前面，而非教导或劝说。
- source_word: προβαλόντων αὐτὸν τῶν Ἰουδαίων
  choice: 因为犹太人把他推了出来
  rationale: 属格独立结构说明亚历山大为何被带到前面；“推了出来”保留公开推出之意，但不必理解为暴力推搡。
- source_word: κατασείσας τὴν χεῖρα
  choice: 用手示意
  rationale: 该表达指以手势引起注意或使众人安静；译文不把经文未明说的“请大家安静”写入正文。
- source_word: ἤθελεν ἀπολογεῖσθαι
  choice: 想……申辩
  rationale: ἤθελεν表达意愿或意图，并不表示行动已经完成；“申辩”保留公开答辩、自我辩护的语气。
- source_word: τῷ δήμῳ
  choice: 向民众
  rationale: δῆμος在这里指具有公共或城邦色彩的民众，与前面的普通“人群”有所区别；“民众”自然且保留这种公共含义。
- source_word: ὄχλου
  choice: 人群
  rationale: ὄχλος指聚集的一大群人；“人群”符合现代汉语，并与后面的“民众”形成适度区分。
- source_word: Ἀλέξανδρον / Ἀλέξανδρος
  choice: 亚历山大
  rationale: 采用现代汉语中通行的希腊人名译法。
