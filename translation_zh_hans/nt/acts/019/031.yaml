  text: τινὲς δὲ καὶ τῶν Ἀσιαρχῶν, ὄντες αὐτῷ φίλοι, πέμψαντες πρὸς αὐτὸν παρεκάλουν μὴ δοῦναι ἑαυτὸν εἰς τὸ θέατρον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/031.yaml
  text: And even some of the Asiarchs[a], being his friends[c][b], sent word to him and urged him not to venture into the theater.
translation:
  language: zh_hans
  text: 甚至亚细亚省的首领[a]中，也有几位是保罗的朋友；他们派人去劝保罗[b]，一再劝他不要亲自进入剧场[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚细亚省的首领”原文为一个专门称号，指罗马亚细亚省中与省级公共活动及敬拜有关的显要人物。
    reason: cultural_note
  - marker: b
    text: 原文直译为“派到他那里去”，没有明说所派之人的身份。
    reason: lexical_alternative
  - marker: c
    text: 或译：“不要置身于剧场中”或“不要到剧场去。”
    reason: lexical_alternative
lexical_decisions:
- source_word: τινὲς δὲ καὶ τῶν Ἀσιαρχῶν
  choice: 甚至亚细亚省的长官中，也有几位
  rationale: τινές表示群体中未明确指出的几位；καί在此带有递进、出人意料的意味，译作“甚至……也”。Ἀσιάρχης是罗马亚细亚省内显要人物所具的专门称号；正文采用易懂的功能性表达，并以脚注补充其历史背景。
- source_word: ὄντες αὐτῷ φίλοι
  choice: 是保罗的朋友
  rationale: 保留φίλοι所表达的真实友好关系，而不弱化为仅仅“对他友善”；根据上下文明确代词所指为保罗，以免汉语含混。
- source_word: πέμψαντες πρὸς αὐτὸν
  choice: 托人传话给他
  rationale: 原文只明说“派遣/送到他那里”，未明说所差之人或信息；上下文显然涉及间接传讯。“托人传话”是自然汉语，并用脚注说明原文的省略。
- source_word: παρεκάλουν
  choice: 一再劝
  rationale: παρακαλέω在此表示恳切劝阻；未完成时可体现持续或反复进行，故以“一再劝”传达其体貌，不夸张为“苦苦哀求”。
- source_word: μὴ δοῦναι ἑαυτὸν εἰς τὸ θέατρον
  choice: 不要进入剧场
  rationale: 字面结构是“不要把自己交给/置于剧场中”，语境所指是不要亲自进入聚众骚乱的剧场。“不要进入剧场”自然明确，同时脚注保留较贴近字面的表达。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“剧场”指以弗所供公众集会和演出的场所，并非现代意义上专供电影放映的影院。分号使背景说明与主要动作层次清楚。
