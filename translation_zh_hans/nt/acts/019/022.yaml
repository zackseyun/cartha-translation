  text: ἀποστείλας δὲ εἰς τὴν Μακεδονίαν δύο τῶν διακονούντων αὐτῷ, Τιμόθεον καὶ Ἔραστον, αὐτὸς ἐπέσχεν χρόνον εἰς τὴν Ἀσίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/022.yaml
  text: So after sending into Macedonia two of those who were ministering to him—Timothy and Erastus—he himself stayed for a time in Asia[a].
translation:
  language: zh_hans
  text: 于是，保罗派了两个服侍他的人，就是提摩太和以拉都，前往马其顿；他自己则在亚细亚[a]停留了一段时间。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“亚细亚”指小亚细亚西部的罗马亚细亚行省，并非现代所说的亚洲大陆。
    reason: cultural_note
lexical_decisions:
- source_word: ἀποστείλας δὲ
  choice: 于是……派了……；……则
  rationale: 不定过去时分词表示先于主句的行动；δέ在此轻微推进叙事，并与后面的强调代词形成自然衔接。中文用“于是”及分号后的“则”清楚表达行动次序和人物对照。
- source_word: εἰς τὴν Μακεδονίαν
  choice: 前往马其顿
  rationale: εἰς表示朝向目的地；现代汉语以“前往”自然表达进入该地区的方向性。
- source_word: δύο τῶν διακονούντων αὐτῷ
  choice: 两个服侍他的人
  rationale: 保留διακονέω的一般性服侍含义，不将二人明确制度化为某种职分，也不弱化为单纯的行政助手。
- source_word: Τιμόθεον καὶ Ἔραστον
  choice: 提摩太和以拉都
  rationale: 采用现代中文圣经语境中通行且易辨认的人名译法。
- source_word: αὐτὸς
  choice: 他自己
  rationale: 显明原文强调代词的对比作用：两位同工被差往马其顿，而保罗本人仍留下。
- source_word: ἐπέσχεν χρόνον
  choice: 停留了一段时间
  rationale: 该短语在语境中表示在某处继续逗留一段时间；此译法自然、准确，并不暗示不必要的耽搁。
- source_word: εἰς τὴν Ἀσίαν
  choice: 在亚细亚
  rationale: 尽管εἰς通常表达方向，但与ἐπέσχεν χρόνον连用时语义为所在地；“亚细亚”指罗马行省，正文保留历史地名，并以脚注澄清。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“服侍他的人”贴近原文关系表达，同时避免把διακονούντων解释为特定教会职分。以分号呈现派遣同工与保罗本人留下之间的对照。
