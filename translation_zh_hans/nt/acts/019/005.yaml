base_translation:
  language: en
  yaml_path: translation/nt/acts/019/005.yaml
  text: And when they heard this[a], they were baptized in the name of the Lord Jesus.
translation:
  language: zh_hans
  text: 他们听了这话后，就受洗归入主耶稣的名下[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“奉主耶稣的名受洗。”
    reason: 提供εἰς τὸ ὄνομα较传统、较惯用的中文表达。
lexical_decisions:
- source_word: ἀκούσαντες
  choice: 听见以后
  rationale: 不定过去时分词在这里表示时间先后。希腊文没有明说所听见的内容，中文也可自然承接上文而不补出“这话”。
- source_word: δὲ
  choice: 就
  rationale: δέ是轻微的叙事连接词；结合前面的时间短语译作“就”，自然表达事件推进，不强化转折。
- source_word: ἐβαπτίσθησαν
  choice: 受洗
  rationale: 不定过去时被动语态；“受洗”是现代中文自然且庄重的被动表达。
- source_word: εἰς τὸ ὄνομα
  choice: 归入……的名下
  rationale: εἰς具有趋向、进入或归属的意味；“归入……的名下”既保留这种方向与认同关系，也比生硬的“进入名字”更符合中文。
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: 主耶稣
  rationale: κύριος在此是耶稣的称号，译为“主”；Ἰησοῦ按中文通行译名译为“耶稣”。
theological_decisions:
- issue: 洗礼用语 εἰς τὸ ὄνομα 的表达
  choice: 归入主耶稣的名下
  alternative: 奉主耶稣的名
  rationale: 正文保留εἰς的趋向、归属和认同意味，不把路加的措辞直接处理成较常见的仪式性表达；脚注列出自然且传统的另一译法，不据此断定特定洗礼公式。
translation_notes:
  register: 采用现代、简洁而庄重的叙事中文。“听见以后”承接上文，不补希腊文未明说的宾语；“归入……的名下”力求兼顾原文结构与普通读者的可理解性。
