  yaml_path: translation/nt/acts/019/011.yaml
  text: And God was doing extraordinary miracles through the hands of Paul,[a]
translation:
  language: zh_hans
  text: 神借着保罗的手，行了非同寻常的神迹[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“不寻常的有能力的作为。”
    reason: 说明Δυνάμεις可指有能力的作为，以及οὐ τὰς τυχούσας“不寻常的”的强调；正文以“神迹”自然表达本处所指的神奇事件。
lexical_decisions:
- source_word: Δυνάμεις
  choice: 神迹
  rationale: 该词为复数，在《使徒行传》的这一语境中指彰显能力的超自然作为；“神迹”是现代汉语中清楚、自然的事件性表达。
- source_word: τε
  choice: 又
  rationale: τε承接上文并推进叙事；“又”能自然表达连接和补充关系。
- source_word: οὐ τὰς τυχούσας
  choice: 非同寻常的
  rationale: 这一习语直译为“不是普通的”，在此修饰神迹；“非同寻常的”既保留否定式所带的强调，也符合现代汉语表达。
- source_word: ὁ θεὸς
  choice: 神
  rationale: 希腊文明确以神为施行动作的主语，译文保留这一神圣行动主体。
- source_word: ἐποίει
  choice: 行了
  rationale: ποιέω在神迹语境中自然译为“行”；希腊文未完成时表示过去持续或反复发生的行动，汉语可由叙事语境理解，不宜机械添加“不断”。
- source_word: διὰ τῶν χειρῶν Παύλου
  choice: 借着保罗的手
  rationale: διά加属格表示媒介；保留“手”的具体意象，同时清楚表明保罗是神施行神迹所借用的人。
- source_word: Παύλου
  choice: 保罗
  rationale: 采用现代中文圣经传统中通行的人名译法。
theological_decisions:
- issue: 施行神迹的主体
  choice: 神是施行神迹者，保罗是神所借用的媒介。
  alternative: 将保罗表述为独立施行神迹者。
  rationale: ὁ θεὸς是ἐποίει的语法主语，而διὰ τῶν χειρῶν Παύλου表示借着保罗的手而行；译文保留两者的区别。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“借着保罗的手”略带经文风格，但保留了原文的具体意象与神为主体、保罗为媒介的结构。
