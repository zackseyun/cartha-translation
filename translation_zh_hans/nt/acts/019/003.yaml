  text: εἶπέν ⸀τε· Εἰς τί οὖν ἐβαπτίσθητε; οἱ δὲ εἶπαν· Εἰς τὸ Ἰωάννου βάπτισμα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/003.yaml
  text: And he said[a], “Into what then were you baptized?” And they said, “Into John's baptism.”
translation:
  language: zh_hans
  text: 于是他说：“那么，你们受洗是归入什么呢？”他们说：“归入约翰的洗礼。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那么，你们受的是什么洗礼呢？”他们说：“约翰的洗礼。”
    reason: 提供符合现代汉语习惯的表达；正文保留原文在问句和答句中重复出现的εἰς及其平行结构。
lexical_decisions:
- source_word: εἶπέν τε
  choice: 于是他问
  rationale: λέγω在直接引出问句时可自然译为“问”；τε轻微承接上文，译作“于是”，使对话衔接自然。
- source_word: Εἰς τί οὖν
  choice: 那么……归入什么呢
  rationale: οὖν表示根据前文作出的推论，译作“那么”；εἰς τί直译为“归入什么”，并与回答中的εἰς保持呼应。
- source_word: ἐβαπτίσθητε
  choice: 你们受洗
  rationale: 准确表达βαπτίζω不定过去时被动语态；现代汉语以“受洗”自然体现被动含义。
- source_word: Εἰς τὸ Ἰωάννου βάπτισμα
  choice: 是归入约翰的洗礼
  rationale: 保留重复的εἰς所表达的“归入”，也保留Ἰωάννου修饰βάπτισμα的结构和问答之间的平行。
- source_word: βάπτισμα
  choice: 洗礼
  rationale: “洗礼”是现代汉语中对此仪式准确而通行的称呼；此处由“约翰的”限定，不必加入后期教会含义。
theological_decisions:
- issue: 是否在问句和答句中保留重复出现的εἰς
  choice: 两处都译作“归入”
  alternative: 意译为“你们受的是什么洗呢？”／“约翰的洗。”
  rationale: 保留原文问答的平行结构及洗礼所指向的关联，同时不进一步界定这种“归入”的神学性质。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“归入什么”略带原文结构色彩，但仍可理解，并有意保留希腊文问答中的措辞呼应；脚注提供更口语化的表达。
