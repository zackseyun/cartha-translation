  text: ἐπιγνόντες δὲ ὅτι Ἰουδαῖός ἐστιν φωνὴ ἐγένετο μία ἐκ πάντων ⸀ὡς ἐπὶ ὥρας δύο κραζόντων· Μεγάλη ἡ Ἄρτεμις Ἐφεσίων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/034.yaml
  text: But when they recognized that he was a Jew[a], one voice arose from them all, crying out for about two hours, “Great is Artemis of the Ephesians!”
translation:
  language: zh_hans
  text: 但他们认出他是犹太人[a]，众人就异口同声地呼喊了约两个小时：“以弗所人的亚底米真伟大！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“来自犹太地区的人”。希腊语这个词既可指犹太人，也可指来自犹太地区的人；这里较可能是较广的民族—宗教含义。
    reason: 保留Ἰουδαῖος的地域性词义这一真实的词汇替代可能。
lexical_decisions:
- source_word: ἐπιγνόντες
  choice: 他们认出
  rationale: 不定过去时分词表示先于随后呼喊发生的识别；“认出”自然地表达群众辨明亚历山大的身份。
- source_word: δὲ
  choice: 但
  rationale: 承接上文亚历山大试图申辩的情景，并突出群众认出其身份后出现的转折。
- source_word: Ἰουδαῖός
  choice: 犹太人
  rationale: 在以弗所这一侨居地语境中，该词较可能指民族—宗教身份，而非专指来自犹太地区的人；脚注保留后一种词义可能。
- source_word: φωνὴ ἐγένετο μία ἐκ πάντων
  choice: 众人就异口同声
  rationale: 以自然现代汉语表达所有人发出“同一个声音”的希腊语意象，保留群众一致呼喊的重点。
- source_word: ὡς ἐπὶ ὥρας δύο
  choice: 约两个小时
  rationale: ὡς用于度量语时表示约数，“约”保留时间并非精确计量的语气。
- source_word: κραζόντων
  choice: 呼喊
  rationale: 现在时分词刻画持续进行的高声喊叫；结合时长表达，用“呼喊了”在汉语中自然呈现持续动作。
- source_word: Μεγάλη ἡ Ἄρτεμις Ἐφεσίων
  choice: 以弗所人的亚底米是伟大的！
  rationale: 保留亚底米这一专名、Ἐφεσίων的所属关系及颂扬式断言；措辞庄重而仍为现代读者可懂。
theological_decisions:
- issue: Ἰουδαῖος所指的身份
  choice: 犹太人
  alternative: 犹太地区的人
  rationale: 本节焦点是以弗所群众对亚历山大民族—宗教身份的反应，而非他的地理籍贯；正文采用语境中更可能的“犹太人”，并用脚注保留真实存在的地域性读法。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“异口同声”简洁传达希腊文“众人发出同一个声音”的集体一致性；神名采用中文圣经中通行且清楚的音译“亚底米”，避免古雅感过重的感叹格式。
