base_translation:
  language: en
  yaml_path: translation/nt/acts/019/002.yaml
  text: And he said to them[a], “Did you receive the Holy Spirit when you believed?” And they said to him, “No[b], we have not even heard that there is a Holy Spirit.”
translation:
  language: zh_hans
  text: 他问他们：“你们信的时候领受了圣灵吗？[a]”他们回答：“没有，我们甚至没有听说有圣灵。[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们信了以后领受了圣灵吗？”希腊文分词在这里可带有略有不同的时间意味。
    reason: lexical_alternative
  - marker: b
    text: 或译：“我们甚至没有听说是否有圣灵”；也可按语境理解为：“我们甚至没有听说圣灵已经赐下。”
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπέν τε πρὸς αὐτούς
  choice: 他问他们
  rationale: λέγω的基本义是“说”，但后接直接问句，现代汉语自然表达为“问”；τέ在此轻微承接上文，无须机械译出。
- source_word: Εἰ πνεῦμα ἅγιον ἐλάβετε πιστεύσαντες
  choice: 你们信的时候领受了圣灵吗？
  rationale: 不定过去时分词πιστεύσαντες与主要动词ἐλάβετε具有时间关系；“信的时候”保留其弹性，不强定为严格的先后次序或同一瞬间。
- source_word: πνεῦμα ἅγιον
  choice: 圣灵
  rationale: 本处指上帝的圣灵；现代中文基督教语境惯用“圣灵”，无需添加冠词含义。
- source_word: οἱ δὲ πρὸς αὐτόν
  choice: 他们回答
  rationale: 原文省略了可由语境补出的言说动词；“回答”符合问答语境。δέ仅作轻微转接，中文无需另译“但”。
- source_word: Ἀλλ’ οὐδ’
  choice: 没有，我们甚至没有
  rationale: ἀλλά与οὐδέ共同加强否定；以“没有”先直接回答，再用“甚至没有”表达递进，符合现代汉语习惯。
- source_word: οὐδ’ εἰ πνεῦμα ἅγιον ἔστιν ἠκούσαμεν
  choice: 我们甚至没有听说有圣灵
  rationale: 直译保留οὐδὲ εἰ的简练与一定歧义；不在正文中补入原文未明说的“圣灵已经赐下”。
theological_decisions:
- issue: 信与领受圣灵之间的时间关系
  choice: 信的时候
  alternative: 信了以后；信的时候／一信就
  rationale: πιστεύσαντες与ἐλάβετε的时间关系并未单独确立严格的先后或瞬时同步；正文避免预先裁定相关教义争议，脚注交代可能的时间语气。
- issue: 这些人对圣灵所知为何
  choice: 没有听说有圣灵
  alternative: 没有听说是否有圣灵；没有听说圣灵已经赐下
  rationale: 原文表达简短，可指不知道有圣灵，也可能在语境中涉及不知道圣灵已临到或赐下。正文采用最直接的译法，脚注保存其他理解，不把解释写进经文。
translation_notes:
  register: 采用现代、庄重而自然的普通话。“领受”保留经文语体且通俗可懂；问答结构简洁。所有脚注标记均置于正文相应句后。
