id: ACT.19.1
reference: Acts 19:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν τῷ τὸν Ἀπολλῶ εἶναι ἐν Κορίνθῳ Παῦλον διελθόντα τὰ ἀνωτερικὰ μέρη ⸀ἐλθεῖν εἰς Ἔφεσον καὶ ⸀εὑρεῖν τινας μαθητάς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/001.yaml
  text: It happened that while Apollos was in Corinth[a], Paul passed through the inland regions and came to Ephesus and found some disciples[b],
translation:
  language: zh_hans
  text: 亚波罗在哥林多的时候，保罗穿过内陆地区[a]，来到以弗所，遇见了几位门徒[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“较高的地区”“内地”；这里很可能指经过较高地带的内陆路线，而不是沿海路线。
    reason: lexical_alternative
  - marker: b
    text: 这里没有说明他们是谁的“门徒”；接下来的经文表明，他们与约翰的洗礼有关。
    reason: cross_reference
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: （以整句叙事结构表达，不单独译出）
  rationale: 这是路加常用的叙事承接语。现代汉语直接以“亚波罗……的时候，保罗……”展开更自然，也保留了事件发生和叙事推进的作用；若机械译作“事情发生了”会显得生硬。
- source_word: ἐν τῷ τὸν Ἀπολλῶ εἶναι ἐν Κορίνθῳ
  choice: 亚波罗在哥林多的时候
  rationale: 带冠词的不定式结构表示同时发生的时间背景；“……的时候”准确而自然。
- source_word: διελθόντα τὰ ἀνωτερικὰ μέρη
  choice: 穿过内陆地区
  rationale: διέρχομαι表示从一片区域中经过；ἀνωτερικά字面可指“较高的”，在此地理语境中很可能指内陆或高地路线。正文采用清楚自然的“内陆地区”，脚注保留其他可能。
- source_word: ἐλθεῖν εἰς Ἔφεσον
  choice: 来到以弗所
  rationale: 准确表达向以弗所行进并抵达；用有限动词符合现代汉语叙事习惯。
- source_word: καὶ εὑρεῖν
  choice: 遇见了
  rationale: εὑρίσκω在此可表示找到或遇见。按旅行叙事语境译为“遇见了”自然，并不额外暗示保罗事先有意搜寻这些人。
- source_word: τινας μαθητάς
  choice: 几位门徒
  rationale: τινας是不定数量，译作“几位”；μαθητάς保留为“门徒”，不在本节提前说明他们是谁的门徒。
theological_decisions:
- issue: μαθητάς所指门徒的身份
  choice: 正文只译“门徒”，不加“耶稣的”或“约翰的”
  alternative: 约翰的几个门徒；几个耶稣的门徒
  rationale: 希腊原文在本节没有限定他们是谁的门徒；后文才交代他们与约翰的洗礼有关。译文应保留这里的未明确性和后续叙事张力。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语体。“穿过”避免“走遍”可能带来的遍历全境之意；将[a]置于“内陆地区”之后，使脚注明确对应τὰ ἀνωτερικὰ μέρη。
