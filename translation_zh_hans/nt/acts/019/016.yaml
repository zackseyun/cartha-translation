  text: καὶ ⸀ἐφαλόμενος ⸂ὁ ἄνθρωπος ἐπ’ αὐτοὺς⸃ ἐν ᾧ ἦν τὸ πνεῦμα τὸ πονηρὸν ⸂κατακυριεύσας ἀμφοτέρων⸃ ἴσχυσεν κατ’ αὐτῶν, ὥστε γυμνοὺς καὶ τετραυματισμένους ἐκφυγεῖν ἐκ τοῦ οἴκου ἐκείνου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/016.yaml
  text: And the man in whom the evil spirit was leaped on them[a], and after overpowering both of them, prevailed against them[c][b], so that they fled out of that house naked and wounded.
translation:
  language: zh_hans
  text: 里面有恶灵的那个人猛扑到他们身上[a]，制伏了他们两人[b]，并胜过了他们，以致他们赤着身子、带着伤，从那所房子里逃了出去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “猛扑”也可译作“跳到他们身上”或“跃起扑向他们”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文直译为“他们两人”。虽然上下文提到士基瓦的多个儿子，本节原文却明确使用表示“两者”的词，因此译文保留“两人”。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐφαλόμενος
  choice: 猛扑到……身上
  rationale: 该不定过去时分词描写突然跃起扑击的动作；“猛扑”在现代汉语中自然、鲜明，也保留暴力性。
- source_word: ὁ ἄνθρωπος
  choice: 那……人
  rationale: 原文为阳性单数，指叙事中的那名男子；汉语用“那……人”既明确所指，也能自然承接定语。
- source_word: ἐν ᾧ ἦν τὸ πνεῦμα τὸ πονηρόν
  choice: 恶灵附在身上的
  rationale: 原文直述恶灵在此人里面。汉语以“附在身上”自然表达这种内在控制关系，同时避免采用更具技术性或宗派色彩的术语。
- source_word: τὸ πνεῦμα τὸ πονηρόν
  choice: 恶灵
  rationale: “恶灵”是现代汉语中清楚、通行的对应语，符合赶鬼叙事语境。
- source_word: κατακυριεύσας
  choice: 制伏了
  rationale: 该词表示取得支配、压倒对方；“制伏”准确表现武力压制，并与后面的“胜过”有所区分。
- source_word: ἀμφοτέρων
  choice: 他们两人
  rationale: 原文明确表示“两者、两人”；译文保留这一数字细节，不因上文提到更多人而将其改成“所有人”。
- source_word: ἴσχυσεν κατ’ αὐτῶν
  choice: 胜过了他们
  rationale: 表达此人比他们更强并占了上风；译法保留其为独立谓语，不与前面的“制伏”合并。
- source_word: γυμνούς
  choice: 赤着身子
  rationale: 原文描述裸体状态；此译法直白而不粗俗，也不擅自解释为衣服被撕掉。
- source_word: τετραυματισμένους
  choice: 带着伤
  rationale: 完成时被动分词表示他们已受伤并处于受伤状态；“带着伤”能自然呈现逃离时仍然受伤的结果。
- source_word: ἐκφυγεῖν
  choice: 逃了出去
  rationale: 该词兼有逃脱与离开的意义；结合ἐκ及房屋，“逃了出去”自然表达从屋内逃出。
- source_word: ἐκ τοῦ οἴκου ἐκείνου
  choice: 从那所房子里
  rationale: 准确表达从前述特定房屋内部离开。
theological_decisions:
- issue: 如何表达恶灵与那人的关系
  choice: 那恶灵附在身上的人
  alternative: 那被恶灵附身的人；那里面有恶灵的人
  rationale: 原文说恶灵“在”那人里面。“附在身上”在现代汉语中清楚自然，又不把该表达固定成后世的技术术语。
- issue: ἀμφοτέρων与较大群体之间的范围张力
  choice: 他们两人
  alternative: 他们所有人；他们当中的两个人
  rationale: 希腊文明确使用“双方／两人”，尽管较宽的上下文提到士基瓦的多个儿子。译文保留原文数字，不自行消解叙事张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。句序依照希腊文的动作推进：猛扑、制伏、胜过，继而说明他们赤身带伤逃出。保留“他们两人”与上下文之间的张力，不作调和。
