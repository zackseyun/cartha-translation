  text: ἱκανοὶ δὲ τῶν τὰ περίεργα πραξάντων συνενέγκαντες τὰς βίβλους κατέκαιον ἐνώπιον πάντων· καὶ συνεψήφισαν τὰς τιμὰς αὐτῶν καὶ εὗρον ἀργυρίου μυριάδας πέντε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/019.yaml
  text: And many of those who had practiced magic arts brought their books together and were burning them in front of everyone[b][a]; and they totaled up their value and found it to be fifty thousand pieces of silver.
translation:
  language: zh_hans
  text: 又有许多曾行邪术的人，把书卷带到一起，当众焚烧；他们合算这些书卷的价值，算出共值五万银子[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“五万银子的五个一万”，即五万银子；这里以银计价，原文没有说明具体是哪一种银币或面额。
    reason: 说明ἀργυρίου未指定具体货币单位，并解释μυριάδας πέντε为五万。
lexical_decisions:
- source_word: ἱκανοὶ
  choice: 许多
  rationale: 此处表示人数众多，译为“许多”自然简明，符合叙事语体。
- source_word: τὰ περίεργα πραξάντων
  choice: 曾行邪术的人
  rationale: 该表达字面涉及“奇异、特殊之事”，但以弗所语境中的咒术书卷、赶鬼和邪灵表明这里指施行法术；“行邪术”既清楚又保留负面的宗教语境。
- source_word: συνενέγκαντες τὰς βίβλους
  choice: 把书卷带来
  rationale: συνενέγκαντες指把物品带到一起；中文“把书卷带来”已自然包含集中于现场之意。“书卷”比现代装订书更符合古代书写载体，同时不限定具体形制。
- source_word: κατέκαιον
  choice: 焚烧
  rationale: 未完成过去时呈现正在进行的公开焚烧场面；汉语在“当众焚烧”的叙事结构中无需另加“正在”，仍可自然表达过程性。
- source_word: ἐνώπιον πάντων
  choice: 当众
  rationale: 准确表达“在所有人面前”的公开性质，且简洁、自然、庄重。
- source_word: συνεψήφισαν τὰς τιμὰς αὐτῶν
  choice: 众人算出这些书卷的价值
  rationale: 动词表示合算、汇总；补出“众人”承接前文参与者，避免中文无主句含混。“这些书卷”明确代词所指。
- source_word: ἀργυρίου μυριάδας πέντε
  choice: 合计五万银币
  rationale: μυριάδας πέντε即“五个一万”，为五万；ἀργυρίου只表明以银计价，并未指明具体币种。“银币”便于现代读者理解，脚注说明面额不详。
theological_decisions:
- issue: τὰ περίεργα所指活动的性质
  choice: 邪术
  alternative: 法术；隐秘术法；奇异之事
  rationale: 上下文涉及游行赶鬼者、邪灵以及法术书卷，因此不是普通的好奇行为。“邪术”准确传达此处所述的巫术性实践，又不引入某一宗派特有术语。
- issue: 焚书行为的公开性与叙事描述
  choice: 当众焚烧
  alternative: 在众人面前烧掉
  rationale: ἐνώπιον πάντων明确强调公开发生；译文只叙述参与者的行动，不额外把它扩展为普遍教义命令。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“书卷”保留古代背景，“当众焚烧”简洁呈现公开且持续进行的场景。脚注标记紧随“五万银币”，对应币值单位的不确定性。
