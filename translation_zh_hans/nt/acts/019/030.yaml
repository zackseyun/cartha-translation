  text: But when Paul wanted to go in among the assembly[a], the disciples would not let him.
translation:
  language: zh_hans
  text: 保罗想要进入民众中间[a]，门徒却不让他进去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“进入集会中”或“进入人群中”。希腊语δῆμος在这里的城邦公共事务语境中，可以指聚集的公众或公民集会。
    reason: lexical_alternative
lexical_decisions:
- source_word: Παύλου δὲ
  choice: 保罗……却
  rationale: Παύλου是保罗的通行中文译名；δέ在此表示与前文情势的轻微转折，中文把“却”放在主句中，更自然地体现这种对比。
- source_word: βουλομένου
  choice: 想要
  rationale: 该词在属格独立结构中表达保罗当时的意愿或打算；“想要”简明自然，并不把意愿强化为已经作出的决定。
- source_word: εἰσελθεῖν
  choice: 到……中间去
  rationale: 表达进入聚集人群之中的动作，符合此处剧场内的叙事情境。
- source_word: εἰς τὸν δῆμον
  choice: 到会众中间去
  rationale: δῆμος在以弗所的公民集会语境中可指聚集的公众或民众大会；“会众”保留有组织的公共集会意味，而“中间”自然表达进入聚集者当中。
- source_word: οὐκ εἴων αὐτὸν
  choice: 不让他去
  rationale: 未完成时εἴων体现门徒持续阻拦或坚持不许可；“不让他去”在现代汉语中自然地传达这一含义。
- source_word: οἱ μαθηταί
  choice: 门徒们
  rationale: 直译为“门徒”，不擅自补出“他的”，也不宽泛化为“信徒”；加“们”使复数在中文中清楚自然。
