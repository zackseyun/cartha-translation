  text: καὶ ἐπιθέντος αὐτοῖς τοῦ ⸀Παύλου χεῖρας ἦλθε τὸ πνεῦμα τὸ ἅγιον ἐπ’ αὐτούς, ἐλάλουν τε γλώσσαις καὶ ἐπροφήτευον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/006.yaml
  text: And when Paul laid his hands on them[a], the Holy Spirit came upon them, and they began speaking in tongues and prophesying.
translation:
  language: zh_hans
  text: 保罗给他们按手时，圣灵就降在他们身上；他们便开始说方言[a]，也说预言。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译作“语言”。希腊语γλῶσσα可指“舌头”或“语言”；本节中的用法可译为“方言”或“语言”，但没有进一步说明这种言语的性质。
    reason: 保留γλώσσαις的词义范围及神学解释上的开放性，并除去“舌音”这一不恰当的现代汉语释义。
lexical_decisions:
- source_word: ἐπιθέντος αὐτοῖς τοῦ Παύλου χεῖρας
  choice: 保罗给他们按手时
  rationale: 将属格独立结构自然地译为时间从句，同时保留“按手”这一原文惯用表达。
- source_word: ἦλθε τὸ πνεῦμα τὸ ἅγιον ἐπ’ αὐτούς
  choice: 圣灵就降在他们身上
  rationale: “降在……身上”准确表达ἔρχομαι与ἐπί所含的临到方向，也符合现代汉语中对圣灵临到的自然表述；“就”连接前一时间从句，但不额外说明因果机制。
- source_word: ἐλάλουν
  choice: 他们便说起……来
  rationale: 以“说起……来”自然呈现叙事中未完成过去时可有的起始兼持续意味，同时避免加入原文没有明说的时间长度。
- source_word: γλώσσαις
  choice: 方言
  rationale: “方言”保留该词在此处可指“舌音/方言”或“语言”的传统语义张力，不把它限定为已知人类语言或狂喜式言语；脚注说明可能的另一译法。
- source_word: ἐπροφήτευον
  choice: 说预言
  rationale: 直接表达先知性发言，措辞通俗而庄重；与前一未完成过去时并列，理解为当时进行的活动。
- source_word: τε ... καί
  choice: 并且
  rationale: 自然连接说方言与说预言这两项紧密并列的表现。
theological_decisions:
- issue: 使徒行传19:6中γλώσσαις的性质
  choice: 正文译作“方言”，不判定其究竟是已知的人类语言还是其他形式的受感言语。
  alternative: 译作“语言”或“别种语言”，从而更强调可识别的人类语言。
  rationale: γλῶσσα既可表示舌头，也可转指语言；本节本身不足以解决相关神学争议，因此正文与脚注共同保留原文的开放性。
- issue: 圣灵临到与保罗按手之间的关系
  choice: 译作“保罗给他们按手时，圣灵就降在他们身上”。
  alternative: 采用更强的因果措辞，如“因为保罗按手，圣灵便降临”。
  rationale: 原文以时间性的属格独立结构叙述事件先后或伴随关系，并未在本句中明确阐释圣灵临到的圣礼性或因果机制，故不作超出文本的教义推断。
- issue: 两个未完成过去时的体貌
  choice: 将ἐλάλουν译为“说起……来”，并把ἐπροφήτευον自然并列为“说预言”。
  alternative: 两者均明确译成“不断地……”，或均只用简单完成体。
  rationale: 原文描写当时展开的活动；汉语无需机械地为两个动词重复体貌标记。现译文既显出言语活动的开始，也不夸大其持续程度。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“按手”“圣灵”“说预言”为现代中文圣经语境中清楚且通行的表达；分号使圣灵临到与随后两项言语表现之间的叙事关系清晰，又不增添原文未说明的因果解释。
