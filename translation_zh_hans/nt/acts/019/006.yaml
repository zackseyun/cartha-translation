- from: 保罗给他们按手时，圣灵就降在他们身上；他们便说起方言[a]来，并且说预言。
  to: 保罗给他们按手时，圣灵就降在他们身上；他们便开始说方言[a]，也说预言。
  rationale: 修订仅澄清脚注的词义说明，并使“开始”自然统领“说方言”和“说预言”两项并列的言语表现；不改变事件次序，也不就方言的性质或按手与圣灵临到的教义关系作额外断定。
