  text: καὶ γὰρ κινδυνεύομεν ἐγκαλεῖσθαι στάσεως περὶ τῆς σήμερον μηδενὸς αἰτίου ὑπάρχοντος περὶ οὗ οὐ δυνησόμεθα ⸀ἀποδοῦναι λόγον ⸀περὶ τῆς συστροφῆς ταύτης. καὶ ταῦτα εἰπὼν ἀπέλυσεν τὴν ἐκκλησίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/040.yaml
  text: For indeed we are in danger of being charged with rioting over what happened today[a], since there is no cause for it, and we will not be able to give an account for this commotion. And after saying these things[c][b], he dismissed the assembly.
translation:
  language: zh_hans
  text: 事实上，因今天发生的事，我们有被控骚乱[a]的危险；既然没有任何理由可让我们为这场骚动[b]作出交代。”他说完这些话，就解散了集会[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“叛乱”或“暴动”。希腊语词可指严重的社会动乱；这里译作“骚乱”，较符合眼前公众喧闹的情形。
    reason: lexical_alternative
  - marker: b
    text: 或译“这次聚众”或“这场骚乱”。原词指喧乱地聚集在一起，与本节后面较正式的“集会”用词不同。
    reason: lexical_alternative
  - marker: c
    text: 这里译作“集会”的希腊语词，在别处常译作“教会”；但此处指以弗所的公众集会。
    reason: cross_reference
lexical_decisions:
- source_word: κινδυνεύομεν
  choice: 恐怕会
  rationale: 表达当前所面临的真实危险，同时符合城镇书记警告众人的自然汉语语气。
- source_word: ἐγκαλεῖσθαι
  choice: 被控
  rationale: 保留该动词在本段公民与司法语境中的法律含义。
- source_word: στάσεως
  choice: 骚乱
  rationale: 指危害公共秩序的群体骚乱；既保留其严重性，也避免将其过度限定为政治性的“叛乱”。
- source_word: περὶ τῆς σήμερον
  choice: 今天的事
  rationale: 原文表达简略，按汉语习惯补出“事”，指当天发生的事件。
- source_word: μηδενὸς αἰτίου ὑπάρχοντος
  choice: 毫无正当理由
  rationale: 表达不存在可为这场骚动辩护的合法或合理根据，并保留司法语境。
- source_word: ἀποδοῦναι λόγον
  choice: 作出交代
  rationale: 自然呈现向主管当局说明并承担答复责任的含义。
- source_word: συστροφῆς
  choice: 骚动
  rationale: 在此指喧乱的聚集；“骚动”贴合上下文，也与后面的正式“集会”相区别。
- source_word: ἐκκλησίαν
  choice: 集会
  rationale: 此处指以弗所的公众集会，而不是基督徒教会；“集会”保留其公共、集合意义。
- source_word: ἀπέλυσεν
  choice: 解散
  rationale: 符合主持人结束并遣散公众集会的语境。
- source_word: καὶ γὰρ
  choice: 其实
  rationale: 以自然汉语承接前文并突出说明理由的语气。
