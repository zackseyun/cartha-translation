  text: πολλοί τε τῶν πεπιστευκότων ἤρχοντο ἐξομολογούμενοι καὶ ἀναγγέλλοντες τὰς πράξεις αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/018.yaml
  text: And many of those who had believed were coming[a], confessing and disclosing their practices.
translation:
  language: zh_hans
  text: 又有许多已经相信的人陆续前来，承认并公开说明自己所行的事。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“自己的行为”或“自己做过的事”。
    reason: 词义备选：πράξεις既可指行为，也可指所做的事。
lexical_decisions:
- source_word: πολλοί
  choice: 许多
  rationale: 自然、简洁地表达数量多，不额外强化程度。
- source_word: τε
  choice: 又
  rationale: 承接上文叙事，并表达本句所述情形也随之发生。
- source_word: τῶν πεπιστευκότων
  choice: 已经信的人
  rationale: 保留完成时分词所含的先前相信及其持续状态，避免直接采用技术性的群体称谓。
- source_word: ἤρχοντο
  choice: 前来
  rationale: 结合上下文表达他们来到众人面前；希腊语未完成时所呈现的持续或陆续发生之意由整句叙事体现，不用“不断”过度限定。
- source_word: ἐξομολογούμενοι
  choice: 承认
  rationale: 表达坦白、承认之意，同时不擅自把宾语明确限定为“罪”。
- source_word: ἀναγγέλλοντες
  choice: 公开说明
  rationale: 表达将事情报告、说出、使人知道，并与“承认”形成自然区分。
- source_word: τὰς πράξεις αὐτῶν
  choice: 自己所行的事
  rationale: 忠实保留πρᾶξις可指行为、所做之事的宽泛意义；上下文可使读者联想到法术活动，但正文不将其明确窄化。
theological_decisions:
- issue: πεπιστευκότων应译为固定群体称谓，还是突出先前相信并持续处于相信状态
  choice: 已经信的人
  alternative: 信徒
  rationale: 完成时分词自然指向先前发生、结果仍存的相信；此译法不额外引入固定的教会身份称谓。
- issue: τὰς πράξεις αὐτῶν是否专指罪、法术活动，还是泛指他们所行的事
  choice: 自己所行的事
  alternative: 自己的法术活动；自己的罪；自己的行径
  rationale: 上下文确与法术有关，但名词本身较宽泛；正文保留语义范围，让上下文提供具体色彩。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“承认并公开说明”保留两个并列分词的区别；“自己所行的事”略具经文语体，但普通读者仍易理解。
