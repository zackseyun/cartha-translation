  text: καὶ θεωρεῖτε καὶ ἀκούετε ὅτι οὐ μόνον Ἐφέσου ἀλλὰ σχεδὸν πάσης τῆς Ἀσίας ὁ Παῦλος οὗτος πείσας μετέστησεν ἱκανὸν ὄχλον, λέγων ὅτι οὐκ εἰσὶν θεοὶ οἱ διὰ χειρῶν γινόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/026.yaml
  text: And you see and hear that not only in Ephesus but in almost all of Asia[a], this Paul has persuaded and turned away a considerable crowd[b], saying that gods made by hands are not gods.
translation:
  language: zh_hans
  text: 你们看见，也听见：这个保罗不仅在以弗所，而且几乎在全亚细亚[a]，劝服并使相当多的人改变了立场，说由人手所造的不是神。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚细亚”指罗马帝国的亚细亚行省，位于今天土耳其西部，并非现代所说的整个亚洲。
    reason: historical_geography
  - marker: b
    text: 直译为“借着手造成的”；这里指由人加工制作、被当作神明敬拜的偶像。
    reason: cultural_note
lexical_decisions:
- source_word: θεωρεῖτε καὶ ἀκούετε
  choice: 你们看见，也听见了
  rationale: 保留两个并列的感知动词，以及底米丢诉诸众人亲见亲闻之事实的现场感；汉语用“了”自然表达他们已经见闻到的情形。
- source_word: οὐ μόνον Ἐφέσου ἀλλὰ σχεδὸν πάσης τῆς Ἀσίας
  choice: 不但在以弗所，而且几乎在整个亚细亚
  rationale: 按上下文将属格结构自然处理为地点范围；“几乎”对应 σχεδόν，同时保留“以弗所—亚细亚”的递进。
- source_word: ὁ Παῦλος οὗτος
  choice: 这个保罗
  rationale: 保留指示词 οὗτος 在底米丢控诉语境中略带轻蔑、疏离的语气，不额外强化成辱骂。
- source_word: πείσας μετέστησεν
  choice: 劝服了……使他们转变
  rationale: πείσας 表示借着劝说，μετέστησεν 表示使人从原有立场转到另一立场；译文保留二者关系，又不擅自补明他们具体离开什么。
- source_word: ἱκανὸν ὄχλον
  choice: 相当多的人
  rationale: 表达人数多到不可忽视；比直译为“足够的一群人”自然，也符合此处群众规模的含义。
- source_word: οἱ διὰ χειρῶν γινόμενοι
  choice: 人手所造的
  rationale: 保留“借着手造成”的人造性质；汉语省去上下文已否定的重复名词，仍清楚指向人工制造、被奉为神的形像。
- source_word: οὐκ εἰσὶν θεοὶ
  choice: 并不是神
  rationale: 直接保留对其神明身份的否定，不添加“真正的”等解释性限定。
theological_decisions:
- issue: 如何表达保罗对人工制造之神像的否定
  choice: 人手所造的并不是神
  alternative: 人手所造的算不得神
  rationale: 原文直接否定人造之物具有神的身份。“并不是神”清楚而克制；没有把论断扩展为本节未明说的形而上解释。
- issue: 是否明确补出众人离弃偶像崇拜
  choice: 使他们转变
  alternative: 使他们离弃偶像崇拜
  rationale: μετέστησεν 表示使其改变立场，但本句未在动词后明说离开什么；正文保留这种概括性，避免把上下文推论写进经文本身。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事语言。“这个保罗”保留演说者带有敌意的指称；“相当多的人”比“相当大的一群人”更符合现代汉语。句末不加引号，因为原文 λέγων ὅτι 以间接引语引出内容。
