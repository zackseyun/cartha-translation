id: ACT.19.9
reference: Acts 19:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὡς δέ τινες ἐσκληρύνοντο καὶ ἠπείθουν κακολογοῦντες τὴν ὁδὸν ἐνώπιον τοῦ πλήθους, ἀποστὰς ἀπ’ αὐτῶν ἀφώρισεν τοὺς μαθητάς, καθ’ ἡμέραν διαλεγόμενος ἐν τῇ σχολῇ ⸀Τυράννου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/009.yaml
  text: But when some became hardened and disobedient[a], speaking evil of the Way before the crowd, he withdrew from them and set apart the disciples[c][b], reasoning daily in the lecture hall of Tyrannus.
translation:
  language: zh_hans
  text: 可是，有些人渐渐变得刚硬，不肯信从[a]，还在众人面前诋毁这道[b]。保罗就离开他们，使门徒与他们分开，每天在推喇奴的讲堂[c]里讲论。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“不信”或“不肯听从”。原词可同时带有拒绝相信和拒绝服从的意味。
    reason: lexical_alternative
  - marker: b
    text: “这道”是《使徒行传》中对早期耶稣信仰群体及其生活道路的一种称呼。
    reason: cultural_note
  - marker: c
    text: 或译“推喇奴的学堂”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσκληρύνοντο
  choice: 渐渐变得刚硬
  rationale: 未完成时表示持续发展的状态或过程；“渐渐变得刚硬”保留这种逐步抗拒的意味，又不武断判定是谁使他们刚硬。
- source_word: ἠπείθουν
  choice: 不肯信从
  rationale: ἀπειθέω兼有“不信”和“不服从、不听从”的语义；“不肯信从”在现代汉语中同时保留认知与意志层面的抗拒。
- source_word: κακολογοῦντες
  choice: 诋毁
  rationale: 该分词指公开说恶言攻击；“诋毁”简洁自然，不必限定为法律意义上的诽谤。
- source_word: τὴν ὁδὸν
  choice: 这道
  rationale: “道”可自然表达ὁδός的道路意象，并在《使徒行传》的语境中作为耶稣运动的称谓；加“这”使中文能清楚指向他们正在攻击的信仰道路，而不扩充其教义内容。
- source_word: ἐνώπιον τοῦ πλήθους
  choice: 在众人面前
  rationale: 准确保留其公开、当众的场景，表达自然。
- source_word: ἀποστὰς ἀπ’ αὐτῶν
  choice: 离开他们
  rationale: 表达保罗与敌对者决定性地分离；中文用顺承句自然呈现希腊文的分词结构。
- source_word: ἀφώρισεν τοὺς μαθητάς
  choice: 使门徒与他们分开
  rationale: 明确表达保罗把门徒从敌对群体中分别出来，避免“把门徒分别出来”可能产生的生硬或宗教术语化色彩。
- source_word: καθ’ ἡμέραν
  choice: 每天
  rationale: 自然准确地表达每日持续进行的活动。
- source_word: διαλεγόμενος
  choice: 讲论
  rationale: διαλέγομαι在本语境指有理据的讲解、讨论或辩论；“讲论”既能涵盖论证性，也不把场景过度塑造成争吵。
- source_word: ἐν τῇ σχολῇ Τυράννου
  choice: 在推喇奴的讲堂里
  rationale: σχολή在此指用于教学或讲论的场所；“讲堂”比现代意义的“学校”更贴合场景。Τυράννου按人名音译为“推喇奴”。
theological_decisions:
- issue: “这道”是否作为基督徒运动的称谓
  choice: 采用“这道”，并用脚注说明其历史性称谓功能
  alternative: 译作普通意义的“这条道路”或“这种教导”
  rationale: 《使徒行传》中“道”多次成为早期耶稣跟随者及其信仰生活的特定称谓；“这道”保留路加的表达，同时避免在正文中加入“基督教”等时代较晚的名称。
- issue: ἀπειθέω中信与顺服的张力
  choice: 译作“不肯信从”
  alternative: 仅译作“不信”或“不服从”
  rationale: 原词可涉及拒绝相信，也可涉及拒绝听从；合译保留两者之间的神学与意志张力，不将其缩减为纯粹认知判断或单纯行为违抗。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“渐渐变得刚硬”呈现持续过程；“不肯信从”保留原词的语义张力；“讲堂”和“讲论”使古代教学讨论场景清楚可感。所有脚注标记均置于正文相应词语之后。
