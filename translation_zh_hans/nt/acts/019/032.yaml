base_translation:
  language: en
  yaml_path: translation/nt/acts/019/032.yaml
  text: So then some were shouting one thing and some another[a], for the assembly was in confusion, and most of them did not know why they had come together.
translation:
  language: zh_hans
  text: 于是，有人喊这个，有人喊那个[a]；因为聚集的人群一片混乱，大多数人不知道他们为什么聚集在一起。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “聚集的人群”也可译作“集会”或“人群”。原文所用的词是 ἐκκλησία，此处指城中的公众集会，并非教会。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλοι μὲν οὖν ἄλλο τι ἔκραζον
  choice: 于是，有人喊这个，有人喊那个
  rationale: 以自然汉语表达分配式对比“有些人……另一些人……”，并用“喊”结合上下文传达未完成时所描写的持续喧嚷；“于是”简洁承接前文。
- source_word: ἐκκλησία
  choice: 会众
  rationale: 此处指以弗所城中聚集的公众群体，并非基督徒教会。“会众”保留“聚集起来的人群”之意；脚注说明其非教会用法，以免误解。
- source_word: συγκεχυμένη
  choice: 一片混乱
  rationale: 该完成时被动分词描写聚集者已经陷入并处于混乱的状态；“一片混乱”自然传达其结果状态。
- source_word: οἱ πλείους
  choice: 大多数人
  rationale: 该比较级名词化使用，意为在场者中的多数；“大多数人”清楚自然。
- source_word: τίνος ἕνεκα
  choice: 为什么
  rationale: 此习语表示“为了什么缘故”；“为什么”是现代汉语最简洁自然的对应表达。
- source_word: συνεληλύθεισαν
  choice: 聚集在一起
  rationale: 该词为 συνέρχομαι 的过去完成时，表示此前已经聚集；汉语通常由语境和“不知道为什么聚集”自然体现先后关系，无须机械增添“已经”。
theological_decisions:
- issue: ἐκκλησία 在本节的所指
  choice: 按公共聚集的人群理解，译作“会众”并加注
  alternative: 译作“教会”
  rationale: 叙事语境是城中骚乱及公众集会，不是基督徒教会；但保留与该希腊词通常教会用法之间的词汇联系。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“有人喊这个，有人喊那个”保留原文喧乱中的交错呼喊；分号呈现呼喊与原因说明之间的关系。
