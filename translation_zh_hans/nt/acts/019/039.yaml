revisions:
- from: 但你们若还要追究别的事[a]，就应当在合法召集的公民大会上解决。
  to: 但你们若还要提出别的事[a]，将在依法举行的公民大会中解决。
  rationale: 修订以“提出别的事”避免把宽泛的 ἐπιζητεῖτε 限定为追责性“追究”，并以“将在……中解决”对应未来被动 ἐπιλυθήσεται。保留“公民大会”以反映本处 ἐκκλησία 的城邦公共集会含义，同时将其依法举行的性质明确纳入正文与脚注。
