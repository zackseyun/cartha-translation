    issue: “追究”对 ἐπιζητεῖτε 的语义限制偏强。
    rationale: 该动词可指寻求、要求或提出；本句并未明确指追查责任或提起控诉。“提出别的事”保留其开放的附加事项含义。
  - severity: medium
    issue: “就应当在……解决”弱化了 ἐπιλυθήσεται 的将来时被动陈述。
    rationale: 原文说该事项“将被解决”；虽处于程序性讲话中，但不必增添“应当”的义务语气。
  - severity: low
    issue: 脚注没有直接说明 ἐννόμῳ 的“依法举行／合乎法律”含义。
    rationale: 正文修订后脚注应同时交代该集会的合法程序性质及其非教会性质。
