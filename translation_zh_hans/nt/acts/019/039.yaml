review_pass:
  verdict: revise
  source_fidelity: 草稿正确把 ἐκκλησίᾳ 置于以弗所的公民政治语境，而非译为“教会”。但“追究”较易带出追责、追查乃至诉讼的意味，超过 ἐπιζητεῖτε 在此处较宽泛的“寻求／提出额外事项”；“应当……解决”将未来被动的陈述性表达强化为规范性义务。
  naturalness: “合法召集的公民大会”可懂，但略显冗重；“依法举行的公民大会”在现代汉语中更顺畅，也贴近“合乎法律的集会”。“若你们还要提出别的事”自然表达在当前事项之外另有诉求。
  terminology: “公民大会”在本节语境中可保留，准确表明这不是基督徒教会。应以脚注说明其为依法举行的城邦集会，避免读者把“大会”误作现代代议机关。
  issues:
