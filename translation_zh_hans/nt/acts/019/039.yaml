  text: εἰ δέ τι ⸀περαιτέρω ἐπιζητεῖτε, ἐν τῇ ἐννόμῳ ἐκκλησίᾳ ἐπιλυθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/039.yaml
  text: But if you seek anything further[a], it will be settled in the lawful assembly.
translation:
  language: zh_hans
  text: 但你们若还要提出别的事[a]，将在依法举行的公民大会中解决。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“若还要寻求别的事”或“若还要查问别的事”。“依法举行的公民大会”指合乎法律程序的城邦公民集会，并非基督徒教会。
    reason: 说明“提出”的译法保留 ἐπιζητεῖτε 的广义，并说明 ἐννόμῳ ἐκκλησίᾳ 在本处指依法举行的公民集会。
lexical_decisions:
- source_word: περαιτέρω
  choice: 还……别的
  rationale: 表示在当前事项之外另有事情；结合 τι 译为“还……别的事”，符合现代汉语表达，并保留附加之意。
- source_word: ἐπιζητεῖτε
  choice: 追究
  rationale: 此词可指寻求、查问或谋求；在城邦事务与争议处理的语境中，“追究”自然体现继续要求处理某事，但不把它限定为正式诉讼。
- source_word: ἐννόμῳ
  choice: 合法召集的
  rationale: 表示合乎法律、依法举行；修饰公民大会时译为“合法召集的”，明确所说的是依法组成或召开的会议。
- source_word: ἐκκλησίᾳ
  choice: 公民大会
  rationale: 本处指以弗所依法召集的城邦集会，并非基督徒教会。“公民大会”准确传达其公共、政治性质，也避免“教会”的误解。
- source_word: ἐπιλυθήσεται
  choice: 就应当……解决
  rationale: 将来时被动形式表示事情将在相应会议中得到解决。上下文具有程序规范意味，汉语以“应当……解决”自然传达应循合法途径办理，同时保留被动结果的核心含义。
- source_word: τι
  choice: 别的事
  rationale: 条件句中的不定代词，与 περαιτέρω 合译为“别的事”，指当前问题以外任何附加事项。
theological_decisions:
- issue: 非基督教城邦语境中 ἐκκλησία 的译法
  choice: 公民大会
  alternative: 集会；教会
  rationale: 上下文所指是以弗所依法召集的公民政治集会，不是基督徒群体。译作“公民大会”避免教会论联想，并保留该词在本处的公共集会含义。
- issue: 未来被动语气与程序要求
  choice: 就应当在……解决
  alternative: 将在……解决
  rationale: ἐπιλυθήσεται 形式上是未来被动，但本句由城里的书记说明合法程序，带有规范性。中文加入“应当”能自然呈现这一语用功能，而不把它解释为神学命令。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“合法召集的公民大会”比单说“合法集会”更清楚地交代以弗所城邦制度背景；正文不采用现代司法专门词“法庭”，以免过度诠释。
