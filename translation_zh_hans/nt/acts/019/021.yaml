source:
  edition: SBLGNT
  text: Ὡς δὲ ἐπληρώθη ταῦτα, ἔθετο ὁ Παῦλος ἐν τῷ πνεύματι διελθὼν τὴν Μακεδονίαν καὶ Ἀχαΐαν πορεύεσθαι εἰς ⸀Ἱεροσόλυμα, εἰπὼν ὅτι Μετὰ τὸ γενέσθαι με ἐκεῖ δεῖ με καὶ Ῥώμην ἰδεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/021.yaml
  text: After these things were completed[a], Paul resolved in the Spirit to go to Jerusalem after passing through Macedonia and Achaia, saying, “After I have been there[b], I must also see Rome.”
translation:
  language: zh_hans
  text: 这些事结束后，保罗在灵里[a]定意，先经过马其顿和亚该亚，然后前往耶路撒冷。他说：“我到那里以后，也必须去看看罗马。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在灵里”也可理解为“在自己的心里”，或指在圣灵的引导下。
    reason: 原文可指保罗内在的定意，也可指圣灵的引导，所指并未明确。
lexical_decisions:
- source_word: ἐπληρώθη
  choice: 办完
  rationale: 此处指前述事务告一段落、完成，并非预言“应验”；“这些事办完以后”自然清楚。
- source_word: ἔθετο
  choice: 定意
  rationale: τίθημι 的中间语态在此表示为自己立定意向；“定意”保留慎重、坚决的意味。
- source_word: ἐν τῷ πνεύματι
  choice: 在灵里
  rationale: 希腊文没有明示是保罗自己的灵还是圣灵；“在灵里”不加代词，尽量保留原文歧义，并以脚注说明。
- source_word: διελθὼν
  choice: 经过
  rationale: 不定过去时分词与前往耶路撒冷的计划相连，表示先途经马其顿和亚该亚；汉语用“要经过……前往……”自然呈现路线和次序。
- source_word: πορεύεσθαι
  choice: 前往
  rationale: 表达有目的地去往某处，适合旅行语境。
- source_word: Ἱεροσόλυμα
  choice: 耶路撒冷
  rationale: 现代中文圣经地名的标准译名。
- source_word: Μετὰ τὸ γενέσθαι με ἐκεῖ
  choice: 我到了那里以后
  rationale: 带宾格主语的冠词不定式结构表示先到达并身处那里；中文以“到了那里以后”自然表达。
- source_word: δεῖ
  choice: 必须
  rationale: 保留路加—使徒行传中常见的必要性或使命性语气，不把其神学来源解释得过于明确。
- source_word: ἰδεῖν
  choice: 去看看
  rationale: 原义为“看见”；在旅行语境中暗含到访。“去看看罗马”既符合现代汉语，也保留“看”的用词。
theological_decisions:
- issue: ἐν τῷ πνεύματι 所指为何
  choice: 在灵里
  alternative: 在自己的心灵里；在圣灵感动下
  rationale: 原文没有物主代词，也没有明确标示专指圣灵，既可能指保罗内心的定意，也可能指圣灵的引导。正文采用不明示所指的“在灵里”，脚注保存两种可能。
- issue: δεῖ 所表达的必要性
  choice: 也必须去看看罗马
  alternative: 也需要去看看罗马
  rationale: δεῖ 的力度强于一般需要，在路加著作中有时含神圣计划的意味；译作“必须”保留其力度，却不在正文中额外断定必要性的来源。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“定意”略带经文语体但仍为现代读者熟悉；句子拆为两句，避免汉语主句负担过重。正文中的脚注标记[a]与脚注相对应。
