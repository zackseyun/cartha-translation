  to: 保罗说：“约翰施行悔改的洗礼，告诉百姓当信那位在他以后来的，就是耶稣。”
  rationale: 修订仅处理汉语句法和脚注措辞：“那位”补足指称结构；“施行悔改的洗礼”避免“施行的是”的迂回表达；“当信”自然传达约翰宣告中要求／劝告的语气。保留“就是耶稣”对后来者的明确指认，并保留脚注以反映原文同源结构。
