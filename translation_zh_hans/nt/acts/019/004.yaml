  terminology: “悔改的洗礼”“百姓”“信”“耶稣”均恰当，语体庄重而现代。“施洗／洗”的同源表达可在脚注中说明；脚注的“施了悔改的洗”不够自然，改作“施了一个悔改的洗礼”。
