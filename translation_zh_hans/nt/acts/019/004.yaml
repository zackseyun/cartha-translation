  text: εἶπεν δὲ Παῦλος· ⸀Ἰωάννης ἐβάπτισεν βάπτισμα μετανοίας, τῷ λαῷ λέγων εἰς τὸν ἐρχόμενον μετ’ αὐτὸν ἵνα πιστεύσωσιν, τοῦτ’ ἔστιν εἰς ⸀τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/004.yaml
  text: And Paul said[a], “John baptized with a baptism of repentance, telling the people to believe in the one coming after him—that is, in Jesus.”
translation:
  language: zh_hans
  text: 保罗说：“约翰施行悔改的洗礼，告诉百姓当信那位在他以后来的，就是耶稣。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐβάπτισεν βάπτισμα μετανοίας
  choice: 施行的是悔改的洗礼
  rationale: 以现代汉语自然表达同源词结构，保留“洗礼”与“悔改”的明确关系；不进一步断定这洗礼产生何种神学功效。
- source_word: τῷ λαῷ
  choice: 百姓
  rationale: λαός在这里是集合性称呼；“百姓”自然且不擅自补明为“以色列人”或缩窄为“群众”。
- source_word: λέγων
  choice: 并告诉
  rationale: 分词表示约翰施洗时伴随的宣告；“并告诉”在汉语中自然引出后面的信仰要求。
- source_word: εἰς τὸν ἐρχόμενον μετ’ αὐτὸν
  choice: 信那在他以后来的
  rationale: πιστεύω与εἰς连用，表达以某人为信靠对象；“在他以后来的”保留时间及承接次序的含义。
- source_word: ἵνα πιστεύσωσιν
  choice: 要信
  rationale: 在λέγων之后可表达所吩咐或劝告的内容；“告诉百姓要信”简洁自然，同时保留目的或要求的语气。
- source_word: τοῦτ’ ἔστιν
  choice: 就是
  rationale: 直接呈现解释和指认关系，把“在他以后来的”明确指向耶稣。
- source_word: εἰς τὸν Ἰησοῦν
  choice: 耶稣
  rationale: 承接前面的“信”，完整意义为“信耶稣”；原文只有人名，没有“基督”或“弥赛亚”等称号，因此不增补。
theological_decisions:
- issue: 约翰的洗礼与信耶稣之间的关系
  choice: 将约翰所施的洗礼描述为“悔改的洗礼”，并把他同时传讲的信息表述为要百姓信那位后来者，即耶稣。
  alternative: 把约翰的洗礼解释为本身就产生基督徒的信仰，或不明确指出后来者就是耶稣。
  rationale: 句法区分了约翰施行的洗礼与他伴随发出的宣告，而τοῦτ’ ἔστιν εἰς τὸν Ἰησοῦν又明确认定那位后来者是耶稣。译文不对洗礼的功效作原文以外的教义推断。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“施行的是悔改的洗礼”适合公开诵读，也保留原文的重点；“就是耶稣”简洁呈现解释性指认。
