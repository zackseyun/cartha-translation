  text: ἀναγνόντες δὲ ἐχάρησαν ἐπὶ τῇ παρακλήσει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/031.yaml
  text: And when they had read it[a], they rejoiced because of its encouragement.
translation:
  language: zh_hans
  text: 众人读了信，就因信中的劝慰而欢喜。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “劝慰”也可译作“鼓励”“劝勉”或“安慰”；“因信中的劝慰而欢喜”也可译作“为其中的劝慰而欢喜”。
    reason: 保留παράκλησις的词义范围，以及ἐπί所表达的原因或所针对之事这两种相近理解。
lexical_decisions:
- source_word: ἀναγνόντες
  choice: 读了信
  rationale: 该不定过去时主动分词表示先于主句动作发生的动作。原文未明说宾语，但上文清楚指向使徒和长老所写的信，因此在中文中补出“信”，使表达自然明确。
- source_word: δὲ
  choice: 就
  rationale: δέ在此作轻微承接，不强调转折；结合前面的时间性分词，用“就”自然呈现叙事推进和动作先后。
- source_word: ἐχάρησαν
  choice: 欢喜
  rationale: χαίρω在此表示产生喜乐。“欢喜”既保留其情感力度，也符合庄重而通顺的现代汉语。
- source_word: ἐπὶ
  choice: 因
  rationale: ἐπί加与格在此可表示喜乐的缘由或根据；“因”简洁地传达这种因果关系，同时不排除“为……而欢喜”的理解。
- source_word: τῇ παρακλήσει
  choice: 信中的劝慰
  rationale: παράκλησις可涵盖鼓励、劝勉和安慰。“劝慰”兼顾劝勉与慰藉两方面；补出“信中的”表明其来源于上文的信，但不把该词的意义限缩为单一方面。
theological_decisions:
- issue: παράκλησις在本句中兼具劝勉、鼓励或安慰的可能
  choice: 正文采用“劝慰”，脚注保留其他译法
  alternative: 鼓励；劝勉；安慰
  rationale: 上下文显示这封信使听众得着振奋和宽慰，但原词本身语义较宽。采用“劝慰”并列出替代译法，可避免把经文的作用只限定为安慰或命令。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语。“读了信，就……”自然表达分词与主句的先后关系；“信中的”是依据上文补出的语境信息。
