base_translation:
  language: en
  yaml_path: translation/nt/acts/015/033.yaml
  text: And after spending some time there[a], they were sent off in peace from the brothers to those who had sent them.
translation:
  language: zh_hans
  text: 他们住了一段时间后，弟兄们[a]就平安地送他们到差派他们的人那里去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄们”也可理解为“弟兄姊妹们”；希腊原文作“弟兄”，在这里很可能泛指信徒群体。
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσαντες ... χρόνον
  choice: 住了一段时间
  rationale: 这是表示停留一段时间的希腊语习惯表达；中文用“住了一段时间”自然地传达其意，地点可由上下文得知，无须增译“在那里”。
- source_word: δὲ
  choice: 便
  rationale: δέ在此轻微推进叙事；“便”自然连接停留与送行两个动作，不赋予过强转折意味。
- source_word: ἀπελύθησαν
  choice: 让他们……离去
  rationale: 此处指代表完成任务后由信徒群体送行，并非获释或正式解职；“让他们离去”既保留被动关系的含义，又符合现代汉语表达。
- source_word: μετ’ εἰρήνης
  choice: 平安离去
  rationale: “平安”保留原文和平、善意与祝福相伴的意味，并与“离去”自然搭配。
- source_word: ἀπὸ τῶν ἀδελφῶν
  choice: 弟兄们
  rationale: 原文为阳性复数“弟兄”，在此很可能泛指安提阿的信徒群体；正文保留其词形对应，脚注说明可能的包容性所指。
- source_word: πρὸς τοὺς ἀποστείλαντας αὐτούς
  choice: 回到差派他们的人那里
  rationale: 该冠词化分词指先前差派他们的人。“回到”虽非独立词项，却由πρός所指的返程关系及叙事语境明确支持，使中文方向表达完整自然。
theological_decisions:
- issue: ἀδελφοί的包容性所指
  choice: 弟兄们
  alternative: 弟兄姊妹们；众信徒
  rationale: 此处无须对群体性别构成作教义化判断。正文保留原文阳性复数形式，同时以脚注交代该词在此可能包容整个信徒群体，以保存词形与语境之间的张力。
translation_notes:
  register: 采用自然、庄重而清楚的现代标准汉语。“住了一段时间”简洁交代停留，“让他们平安离去”体现群体善意送行的场景；避免使用较生硬的“遣散”或容易误解为从拘禁中获释的“释放”。
