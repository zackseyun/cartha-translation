id: ACT.15.25
reference: Acts 15:25
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἔδοξεν ἡμῖν γενομένοις ὁμοθυμαδὸν ⸀ἐκλεξαμένοις ἄνδρας πέμψαι πρὸς ὑμᾶς σὺν τοῖς ἀγαπητοῖς ἡμῶν Βαρναβᾷ καὶ Παύλῳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/025.yaml
  text: it seemed good to us[a], having come to one accord, to choose men and send them to you with our beloved Barnabas and Paul[b],
translation:
  language: zh_hans
  text: 我们达成一致[a]，认为应当选出几名男子[b]，派他们同我们亲爱的巴拿巴和保罗一起到你们那里去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“同心一致”或“同心合意”。
    reason: lexical_alternative
  - marker: b
    text: 原文特指男性；这里所选的是男代表。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδοξεν
  choice: 认为应当
  rationale: δοκέω与不定式在这里表达共同商议后所认可的做法。“认为应当”符合现代汉语公函语气，既保留审议和认可之意，也不强化为命令。
- source_word: γενομένοις ὁμοθυμαδόν
  choice: 达成一致
  rationale: γενομένοις体现进入或达成某种状态，ὁμοθυμαδόν表示同心一致；“达成一致”简洁地保留了由商议而形成共识的过程。
- source_word: ἐκλεξαμένοις
  choice: 选出
  rationale: 该词表示经过选择而挑出人选。译文依汉语习惯将它与πέμψαι组成“选出……派……”的连续行动。
- source_word: ἄνδρας
  choice: 几名男子
  rationale: ἀνήρ在此特指成年男性，而非泛指人；上下文所指是犹大和西拉。译作“男子”保留原文明确的性别信息。
- source_word: πέμψαι πρὸς ὑμᾶς
  choice: 派他们……到你们那里去
  rationale: “他们”承接前面的“几名男子”，是汉语自然表达所需；πρός在此表示受派前往的对象或目的地。
- source_word: σὺν
  choice: 同……一起
  rationale: 明确表达这些受选之人与巴拿巴、保罗同行。
- source_word: τοῖς ἀγαπητοῖς ἡμῶν
  choice: 我们亲爱的
  rationale: 保留ἀγαπητός所表达的爱与亲近，同时符合现代汉语称呼人的自然方式。
- source_word: Βαρναβᾷ καὶ Παύλῳ
  choice: 巴拿巴和保罗
  rationale: 采用现代中文圣经人名的通行译法。
theological_decisions:
- issue: 耶路撒冷会议书信中的集体审议语气
  choice: 我们……认为应当
  alternative: 我们决定／这是我们的命令
  rationale: ἔδοξεν ἡμῖν表达群体共同认可的判断。“认为应当”保留审议后的认定，不把本分句本身强化为原文未明说的命令公式。
- issue: 群体合一的性质
  choice: 达成一致
  alternative: 完全一致／成为一心
  rationale: ὁμοθυμαδόν表达同心或一致，γενομένοις又含形成该状态之意；译文不进一步界定这种一致是程序上的全票通过还是更广义的同心。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“达成一致，认为应当”保留集体商议的公函语气；“选出……派……”避免堆叠分词造成的生硬，同时保持原文行动次序。
