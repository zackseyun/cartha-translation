  text: διὸ ἐγὼ κρίνω μὴ παρενοχλεῖν τοῖς ἀπὸ τῶν ἐθνῶν ἐπιστρέφουσιν ἐπὶ τὸν θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/019.yaml
  text: Therefore I judge that we should not trouble those from among the Gentiles who are turning to God[b][a],
translation:
  language: zh_hans
  text: 所以，我认为不该为难那些从外邦人中归向上帝的人[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “外邦人”也可译作“列国”；这里指非犹太人。
    reason: lexical_alternative
  - marker: b
    text: “我认为不该为难”也可译作“我的判断是，不要为难”。
    reason: alternative_reading
lexical_decisions:
- source_word: διὸ
  choice: 所以
  rationale: 承接雅各前面的论证并引出结论；“所以”自然地保留推论关系。
- source_word: ἐγὼ κρίνω
  choice: 我认为
  rationale: 保留原文明确的第一人称单数，并表达雅各经过考虑后作出的判断；现代汉语中自然且庄重。
- source_word: μὴ παρενοχλεῖν
  choice: 不该为难
  rationale: 原词指给人增添麻烦、造成困扰；“不该为难”既传达否定建议的实际效力，也不把语气强化为骚扰或迫害。
- source_word: τοῖς ἀπὸ τῶν ἐθνῶν
  choice: 那些在外族人中……的人
  rationale: 保留所指的是出自非犹太群体的一些人，而不是把整个群体笼统地作为对象。
- source_word: ἐθνῶν
  choice: 外族人
  rationale: 本段犹太语境中指非犹太人；“外族人”比直译“列国”更清楚，同时避免使用现代读者较陌生的术语。
- source_word: ἐπιστρέφουσιν ἐπὶ τὸν θεόν
  choice: 归向上帝
  rationale: 保留“转向”的动态意象和朝向上帝的方向性，不采用可能带入后期技术含义的“皈依”。
theological_decisions:
- issue: 雅各的话是个人意见，还是向全体会众提出的共同决定
  choice: 译作“我认为不该为难”，保留雅各本人作判断的声音，同时让不定式内容呈现对群体行动的建议。
  alternative: “我的判断是，我们不该为难”或“我判定不要为难”
  rationale: 原文明确使用第一人称单数 ἐγὼ κρίνω，但 μὴ παρενοχλεῖν 是其判断的内容，并会规范会众如何对待归向上帝的外族人；译文不将它缩减为纯私人看法，也不把主语明确扩展成原文未写出的“我们”。
translation_notes:
  register: 采用现代、自然而庄重的普通话。“归向上帝”保留原文进行中的转向意象；“不该为难”适合会众商议语境。脚注标记按正文首次涉及的词语顺序排列。
