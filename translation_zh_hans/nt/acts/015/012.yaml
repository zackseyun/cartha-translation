base_translation:
  language: en
  yaml_path: translation/nt/acts/015/012.yaml
  text: And the whole assembly fell silent[a], and they listened to Barnabas and Paul as they related what signs and wonders God had done among the Gentiles through them.
translation:
  language: zh_hans
  text: 于是，全体会众都静下来，聆听巴拿巴和保罗讲述上帝借着他们在外邦人[a]中所行的一切神迹奇事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “外邦人”也可按字面译作“列邦”；本节在耶路撒冷会议的语境中，特指犹太人以外的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐσίγησεν
  choice: 安静下来
  rationale: 不定过去时在叙事中呈现会众转入安静的动作；“安静下来”自然地保留这一动态意义。
- source_word: πᾶν τὸ πλῆθος
  choice: 全体会众
  rationale: 这里指耶路撒冷会议中聚集议事的群体；“会众”比“群众”更符合场景，也比“众人”更明确。
- source_word: ἤκουον
  choice: 听
  rationale: 未完成时表示持续聆听；汉语在“安静下来，听……”的结构中已能自然表达专心、持续聆听。
- source_word: Βαρναβᾶ καὶ Παύλου
  choice: 巴拿巴和保罗
  rationale: 采用现代中文圣经人名的通行译法。
- source_word: ἐξηγουμένων
  choice: 讲述
  rationale: 该词表示详述、报告所发生的事；“讲述”保留叙事性，不额外引入“解释”的诠释意味。
- source_word: ὅσα ἐποίησεν ὁ θεὸς
  choice: 上帝……所行的
  rationale: 关系代词ὅσα统摄后面的“神迹奇事”，中文以“所行的神迹奇事”自然表达，并明确保留上帝为施行者。
- source_word: σημεῖα καὶ τέρατα
  choice: 神迹奇事
  rationale: 这是《使徒行传》中常见的成对用语；该译法庄重、通行，并保留两词并列。
- source_word: ἐν τοῖς ἔθνεσιν
  choice: 在外族人中
  rationale: 会议语境特指犹太人以外的各族人；“外族人”在现代汉语中较易理解，同时脚注保留“列国”的词义可能。
- source_word: δι’ αὐτῶν
  choice: 借着他们
  rationale: διά加属格表示媒介；“借着他们”清楚表明上帝是主要行动者，巴拿巴和保罗是他施行这些事所使用的人。
theological_decisions:
- issue: 使徒宣教中的神圣行动主体
  choice: 上帝是施行神迹奇事的主体，并借着巴拿巴和保罗行事。
  alternative: 把巴拿巴和保罗表述为神迹奇事的主要施行者。
  rationale: 希腊文以ὁ θεὸς作ἐποίησεν的主语，以δι’ αὐτῶν说明巴拿巴和保罗是媒介；译文保留这种主次关系，同时不否认他们的实际参与。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“于是”承接前文议论后的叙事转折；“全体会众都安静下来”符合会议场景。“神迹奇事”保留路加常用的固定并列语。脚注标记置于相关句末，说明“外族人”的词义与语境。
