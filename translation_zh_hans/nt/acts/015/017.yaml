  terminology: 将ἔθνη译为“外邦人”，并在脚注保留“列国”的可能性，既对应本章非犹太人被接纳的语境，也不抹去引文的民族/列国含义。保留“称为我名下的”，这是中文圣经语体中可理解的归属惯用表达；脚注以较贴近原文的说法说明。
