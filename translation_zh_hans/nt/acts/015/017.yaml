  to: 好让其余的人和所有称为我名下的外邦人都寻求主。这是成就这些事的主所说的。[a][b][c]
  rationale: 修订“外族人”为“外邦人”，以准确表达本段中ἔθνη指非犹太人的上下文含义，同时以脚注保留“列国”。重组末句为“这是成就这些事的主所说的”，使“成就这些事的”清楚修饰“主”，并以自然的中文保留先知宣告公式及现在分词所表达的主之作为。脚注标记集中置于引文末尾，分别仍对应词义替代、名被称在其上的惯用语及《阿摩司书》引文背景。
