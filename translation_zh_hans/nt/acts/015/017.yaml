  text: ὅπως ἂν ἐκζητήσωσιν οἱ κατάλοιποι τῶν ἀνθρώπων τὸν κύριον, καὶ πάντα τὰ ἔθνη ἐφ’ οὓς ἐπικέκληται τὸ ὄνομά μου ἐπ’ αὐτούς, λέγει ⸀κύριος ποιῶν ⸀ταῦτα
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/017.yaml
  text: so that the remnant of mankind may seek the Lord[a], even all the Gentiles on whom my name has been called, says the Lord[c][b], who does these things
translation:
  language: zh_hans
  text: 好让其余的人和所有称为我名下的外邦人都寻求主。这是成就这些事的主所说的。[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “外邦人”或译“列国”。希腊语ἔθνη可以指两者；这里采用“外邦人”，因为耶路撒冷会议正在讨论非犹太人的接纳。
    reason: alternative_reading
  - marker: b
    text: “称为我名下的”直译为“我的名曾被称在他们身上的”，表示他们归属于主。
    reason: lexical_alternative
  - marker: c
    text: 这句话呼应《阿摩司书》9:12，采用了希腊文译本所反映的形式，强调列国或外邦人承载主的名。
    reason: cross_reference
lexical_decisions:
- source_word: ὅπως ἂν
  choice: 好让
  rationale: 引出目的或预期结果；“好让”在现代汉语中自然，也保留了虚拟语气所表达的目的色彩。
- source_word: ἐκζητήσωσιν
  choice: 寻求
  rationale: 表达主动、认真地寻求；汉语中的“寻求”已足以承载此意，不额外加入“竭力”等可能过度强化的词。
- source_word: οἱ κατάλοιποι τῶν ἀνθρώπων
  choice: 其余的人
  rationale: κατάλοιποι 指剩余下来的人；“其余的人”既贴近原文，也自然地表达泛指人类而非仅指男性。
- source_word: τὸν κύριον
  choice: 主
  rationale: 按现代中文圣经语体将 κύριος 译为“主”，在此先知引文中所指清楚。
- source_word: πάντα τὰ ἔθνη
  choice: 所有……外族人
  rationale: ἔθνη 可指“列国”或“外族人”。耶路撒冷会议的直接议题是非犹太人的接纳，因此正文采用“外族人”，并在脚注保留“列国”这一可能译法。
- source_word: ἐφ’ οὓς ἐπικέκληται τὸ ὄνομά μου ἐπ’ αὐτούς
  choice: 称为我名下的
  rationale: 这是表示归属和身份认同的惯用语。“称为我名下”在中文里较自然，同时保留他们归属于主、带有主之名的含义；脚注说明其较直译的形式。
- source_word: λέγει κύριος
  choice: 这是……主说的
  rationale: 保留先知宣告的公式用语，并按汉语语序自然表达。
- source_word: ποιῶν ταῦτα
  choice: 成就这些事的
  rationale: 现在分词修饰“主”，表明主是这些事的施行者；“成就”较自然地传达神使所宣告之事实现的主动作为。
theological_decisions:
- issue: ἔθνη 在犹太人与非犹太人共同被接纳的语境中如何翻译
  choice: 外族人
  alternative: 列国
  rationale: 本章讨论非犹太信徒是否需要接受割礼，因此“外族人”能直接传达经文在当前语境中的指向；但先知引文的词本身也可表示“列国”，故在脚注中保留。
- issue: 神的名“称在”人身上的惯用语
  choice: 称为我名下的
  alternative: 我的名曾被称在他们身上的
  rationale: 正文采用自然且仍保留归属意味的中文表达，不把它解释成某一特定教义机制；脚注给出贴近希腊语结构的译法，以保存其盟约性和身份归属的语言张力。
- issue: οἱ κατάλοιποι τῶν ἀνθρώπων 的集体范围
  choice: 其余的人
  alternative: 人类中剩余的人
  rationale: 原文泛指人，并不限定男性。“其余的人”避免性别误读，也不额外规定这里的“剩余者”必须具有某种特定神学定义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“好让……都寻求主”调整了语序，使并列主语在中文中清楚；“外族人”比传统的“外邦人”更符合当代普通读者用语，同时以脚注保留“列国”。所有脚注标记均置于正文相应位置。
