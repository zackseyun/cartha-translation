source:
  edition: SBLGNT
  text: Τότε ἔδοξε τοῖς ἀποστόλοις καὶ τοῖς πρεσβυτέροις σὺν ὅλῃ τῇ ἐκκλησίᾳ ἐκλεξαμένους ἄνδρας ἐξ αὐτῶν πέμψαι εἰς Ἀντιόχειαν σὺν ⸀τῷ Παύλῳ καὶ Βαρναβᾷ, Ἰούδαν τὸν ⸀καλούμενον Βαρσαββᾶν καὶ Σιλᾶν, ἄνδρας ἡγουμένους ἐν τοῖς ἀδελφοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/022.yaml
  text: 'Then it seemed good to the apostles and the elders, together with the whole church, to choose men from among them and send them to Antioch with Paul and Barnabas: Judas, who was called Barsabbas, and Silas, men who were leading among the brothers.'
translation:
  language: zh_hans
  text: 于是，使徒和长老同全教会认为这样做合宜：从他们中间选出几个人，派他们同保罗和巴拿巴一起到安提阿去；所选的是称为巴撒巴的犹大和西拉，他们是在弟兄[a][b]中居领导地位的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在弟兄中作带领的人。”
    reason: lexical_alternative
  - marker: b
    text: 这里的“弟兄”很可能泛指信徒群体，包括女性。
    reason: cultural_note
lexical_decisions:
- source_word: ἔδοξε
  choice: 一致认为，应当
  rationale: 在共同商议的语境中自然表达“认为这样合宜”，既体现集体判断，也不强化为正式法令。
- source_word: πρεσβυτέροις
  choice: 长老
  rationale: 这是现代中文教会语境中自然且通行的对应词。
- source_word: σὺν ὅλῃ τῇ ἐκκλησίᾳ
  choice: 同全教会
  rationale: 保留全体教会共同参与的意思，不额外引入特定教会治理模式。
- source_word: ἐκλεξαμένους ἄνδρας ἐξ αὐτῶν
  choice: 从他们中间选出几个人
  rationale: “从他们中间”表明代表出自耶路撒冷群体；ἄνδρας所指确为男性，但下文姓名已明确其性别，中文以“几个人”表达更自然。
- source_word: πέμψαι εἰς Ἀντιόχειαν
  choice: 派他们……前往安提阿
  rationale: 自然表达差派及目的地。
- source_word: καλούμενον Βαρσαββᾶν
  choice: 称为巴撒巴的
  rationale: 保留该分词对犹大别称的描述功能。
- source_word: ἄνδρας ἡγουμένους ἐν τοῖς ἀδελφοῖς
  choice: 这两人在弟兄中担任带领的工作
  rationale: 保留ἡγουμένους表示实际承担带领职责的分词意味，同时避免把它固定化为未经文本明确规定的正式职衔。
- source_word: ἀδελφοῖς
  choice: 弟兄
  rationale: 保留希腊文阳性复数形式，并用脚注说明此称呼在本语境中可能广指信徒群体。
theological_decisions:
- issue: 全教会参与决定的程度
  choice: 使徒、长老同全教会一致认为此举合宜
  alternative: 只有使徒和长老作出正式决定，全教会仅在场
  rationale: σὺν ὅλῃ τῇ ἐκκλησίᾳ最自然地把全教会纳入ἔδοξε所表达的共同判断，但译文不据此推导某种特定治理体制。
- issue: ἀδελφοῖς的范围
  choice: 正文译作“弟兄”，脚注说明可能包括整个信徒群体
  alternative: 正文译作“弟兄姊妹”或“信徒”
  rationale: 既保留原文的阳性复数形式，也不掩盖早期基督徒群体称谓可能具有的广义代表性。
- issue: ἡγουμένους是否指正式职分
  choice: 译作“担任带领的工作”
  alternative: 译作“领袖”或“首领”
  rationale: 原文明确说明二人在群体中发挥带领作用，却未在此明确给出正式职衔；译文保留这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以“于是”承接叙事；将较长的希腊语句分为两句，提升中文可读性，同时保留使徒、长老、全教会、所选代表及其带领角色之间的关系。
