  text: 他经过叙利亚和基利家，坚固众教会。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διήρχετο
  choice: 走遍
  rationale: 未完成时表示持续穿行于这些地区；“走遍”在现代汉语中自然地表达巡行各处，但不额外限定具体行程或时长。
- source_word: δὲ
  choice: 不单独译出
  rationale: δέ在此是轻微的叙事连接词；汉语承接上文时省略更自然，且不损失叙事推进作用。
- source_word: Συρίαν
  choice: 叙利亚
  rationale: 该地区名称的现代汉语通行译名。
- source_word: Κιλικίαν
  choice: 基利家
  rationale: 该地区名称在中文圣经传统中的通行译名，也便于读者识别。
- source_word: ἐπιστηρίζων
  choice: 坚固
  rationale: 该分词表示他巡行时伴随进行的行动，即使信徒群体更加稳固；“坚固”保留其支持、巩固之意，不将含义缩减为情感上的鼓励。
- source_word: τὰς ἐκκλησίας
  choice: 各地的教会
  rationale: 此处指叙利亚和基利家境内多个地方性的基督徒群体；“各地的教会”自然表达复数，并避免被误读为单一机构。
