  text: Συνήχθησάν ⸀τε οἱ ἀπόστολοι καὶ οἱ πρεσβύτεροι ἰδεῖν περὶ τοῦ λόγου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/006.yaml
  text: So the apostles and the elders gathered together to consider this matter[a][b].
translation:
  language: zh_hans
  text: 于是，使徒和长老聚集起来[a]，要审议这件事[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“集合”或“会合”。希腊文动词在形式上是被动语态（“被聚集”），但在这里通常表示众人聚集、开会。
    reason: lexical_alternative
  - marker: b
    text: 直译“要看关于这话”。这里的“话”指正在讨论的事情或争议。
    reason: lexical_alternative
lexical_decisions:
- source_word: Συνήχθησάν
  choice: 聚集起来
  rationale: 该词形式上是简单过去时被动语态，但在此语境中自然表示众人聚集、开会；“聚集起来”既保留群体会合之意，也符合现代汉语表达。
- source_word: τε
  choice: 于是
  rationale: τε在这里轻微承接上文，推动叙事从先前的争论转到领袖聚集商议；“于是”自然体现这种衔接，而不过分强调因果。
- source_word: οἱ ἀπόστολοι
  choice: 使徒
  rationale: 在《使徒行传》中指公认的使徒领袖；“使徒”是准确且通行的译法。
- source_word: οἱ πρεσβύτεροι
  choice: 长老
  rationale: 此处指群体中受认可的领袖，而不只是年长男子；“长老”保留当时教会领袖的称谓，又不强加后世宗派制度。
- source_word: ἰδεῖν
  choice: 审议
  rationale: 该不定式字面义为“看”，在这里表示对争议事项加以察看、考虑。“审议”符合会议语境，并未预先断言已经作出决定。
- source_word: περὶ τοῦ λόγου τούτου
  choice: 这件事
  rationale: λόγος可指话语、信息或事项；此处回指先前提出的争议问题，因此译作“这件事”清楚自然。
theological_decisions:
- issue: 耶路撒冷会议中πρεσβύτεροι的制度含义
  choice: 译作“长老”，不附加后世宗派性的职制定义。
  alternative: 将其技术性地译作带有后期教会职制含义的“司铎”或其他特定称号。
  rationale: 经文表明他们是耶路撒冷教会中受认可的领袖，却没有在本节界定后世发展出的具体教政结构。
- issue: 聚会的审议目的
  choice: 译作“要审议这件事”，表达对问题进行察看和考虑的过程。
  alternative: 译作“要裁决这件事”，预先强调最终判决；或拘泥字面译作“要看关于这话”。
  rationale: ἰδεῖν在此表示着手考察问题；“审议”既切合会议情境，也避免在叙事的这一刻把结果说成已经预定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“于是”承接上文，“聚集起来”自然表达会合；“审议”保留考察和商议的意味，同时不把本节说成已经作出裁决。所有脚注标记均置于正文对应位置。
