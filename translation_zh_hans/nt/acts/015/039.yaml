source:
  edition: SBLGNT
  text: ἐγένετο ⸀δὲ παροξυσμὸς ὥστε ἀποχωρισθῆναι αὐτοὺς ἀπ’ ἀλλήλων, τόν τε Βαρναβᾶν παραλαβόντα τὸν Μᾶρκον ἐκπλεῦσαι εἰς Κύπρον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/039.yaml
  text: And there arose such a sharp disagreement that they separated from one another[a], and Barnabas took Mark and sailed away to Cyprus,
translation:
  language: zh_hans
  text: 于是二人起了激烈的争执[a]，以致彼此分开。巴拿巴带着马可，乘船前往塞浦路斯；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“激烈的冲突”。希腊语这个词可指强烈的激怒或尖锐的冲突。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: 起了
  rationale: 用现代汉语自然地引出新发生的事态，同时保留叙事推进感。
- source_word: δὲ
  choice: 于是
  rationale: 此处是较弱的叙事连接词；“于是”承接上文并推进事件，不把对比意味说得过重。
- source_word: παροξυσμὸς
  choice: 激烈的争执
  rationale: 该词在此指保罗与巴拿巴之间尖锐而强烈的冲突；“激烈的争执”清楚、自然，既不淡化，也不作道德评断。
- source_word: ὥστε
  choice: 以致
  rationale: 准确表达ὥστε加不定式所表示的结果关系。
- source_word: ἀποχωρισθῆναι αὐτοὺς ἀπ’ ἀλλήλων
  choice: 彼此分开
  rationale: 简明表达双方因争执而分道行动的结果，并保留相互关系。
- source_word: τόν τε Βαρναβᾶν
  choice: 巴拿巴
  rationale: τε引出分开后双方行动的第一项，下一节才叙述保罗一方；汉语不必另加过强的连接语。
- source_word: παραλαβόντα τὸν Μᾶρκον
  choice: 带着马可
  rationale: 分词表示伴随主要动作的行动；“带着”自然表达把马可一同带走，且不把“马可”扩充为原文此处没有的“约翰·马可”。
- source_word: ἐκπλεῦσαι
  choice: 乘船前往
  rationale: ἐκπλέω表示乘船离港出发；结合目的地译为“乘船前往”，自然传达海路启程之意。
- source_word: εἰς Κύπρον
  choice: 前往塞浦路斯
  rationale: 按εἰς的方向和目的地意义翻译。
theological_decisions:
- issue: 使徒同工之间冲突的叙事呈现
  choice: 直译为“激烈的争执”，不淡化双方真实而尖锐的冲突，也不附加道德评断。
  alternative: 激烈的冲突；严重的争吵
  rationale: 经文明确记载巴拿巴与保罗之间发生了强烈分歧。译文应保留这一张力，不为协调人物形象而弱化，也不超出词义而加重。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“二人”依据上下文明确争执双方；“以致”保留程度导致结果的结构。末尾用分号，提示巴拿巴的行动与下一节保罗的行动构成并列的两部分。
