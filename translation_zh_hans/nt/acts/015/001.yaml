  text: Καί τινες κατελθόντες ἀπὸ τῆς Ἰουδαίας ἐδίδασκον τοὺς ἀδελφοὺς ὅτι Ἐὰν μὴ ⸀περιτμηθῆτε τῷ ἔθει ⸀τῷ Μωϋσέως, οὐ δύνασθε σωθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/001.yaml
  text: And some men came down from Judea and were teaching the brothers[a], “Unless you are circumcised according to the custom of Moses, you cannot be saved.”
translation:
  language: zh_hans
  text: 有些人从犹太地区下来，教导弟兄们[a]说：“你们若不按照摩西的惯例受割礼，就不能得救。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“弟兄姊妹”；希腊文直译为“弟兄们”，这里很可能泛指信主的群体。
    reason: 说明ἀδελφοὺς的阳性复数形式，以及它在此处很可能涵盖女性信徒的群体性用法。
lexical_decisions:
- source_word: Καί
  choice: （不单独译出）
  rationale: 此处καί承接叙事。现代汉语以直接起句更自然，无须机械译作“于是”或“并且”，上下文的连续性仍然清楚。
- source_word: τινες
  choice: 有几个人
  rationale: 表示人数未明的某些人；“有几个人”符合现代汉语叙事习惯，也不额外说明其身份。
- source_word: κατελθόντες ἀπὸ τῆς Ἰουδαίας
  choice: 从犹太下来
  rationale: 保留古代叙事按地势使用“下来”的表达，同时明确出发地为犹太。
- source_word: ἐδίδασκον
  choice: 教导
  rationale: 未完成时态描写当时持续或反复进行的活动；汉语在此无需添加“不断”，以免强化原文语气。
- source_word: τοὺς ἀδελφοὺς
  choice: 弟兄们
  rationale: ἀδελφοί为阳性复数，在使徒行传中常用来称信徒群体。“弟兄们”保留原词形式，其可能包含姊妹的群体性用法在脚注说明。
- source_word: Ἐὰν μὴ περιτμηθῆτε
  choice: 若不……受割礼
  rationale: 自然表达带否定条件的结构，并保留被动形式所指的割礼行为。
- source_word: τῷ ἔθει τῷ Μωϋσέως
  choice: 按照摩西的规例
  rationale: ἔθος指既定的习俗、惯例或规例。此处涉及宗教实践，“规例”比日常色彩较强的“习俗”更贴合语境，同时不扩展为“摩西所传下来的律法”。
- source_word: οὐ δύνασθε σωθῆναι
  choice: 就不能得救
  rationale: 自然表达能力否定；σωθῆναι在本段争论中具有救恩含义，“得救”准确而不额外界定其神学机制。
theological_decisions:
- issue: 耶路撒冷会议争议中σωθῆναι的含义
  choice: 得救
  alternative: 获救／蒙拯救
  rationale: 上下文争论割礼是否为救恩所必需，因此译作“得救”保留明确的救恩论分量，同时不预先裁定整场争论的细节。
- issue: ἀδελφοὺς所指群体的性别范围
  choice: 正文译“弟兄们”，脚注说明可能泛指信徒群体
  alternative: 弟兄姊妹／信徒们
  rationale: 正文保留希腊文阳性复数的形式；脚注则呈现该称谓在语境中很可能包含女性信徒，避免把这种可能的包容性静默抹去。
- issue: 说话者主张割礼与得救之间的关系
  choice: 保留其绝对主张：“若不……就不能得救”
  alternative: 若不……就不能加入神的子民
  rationale: 原文明确使用σωθῆναι，而不是仅谈群体成员资格。译文应如实呈现这些人的主张，不把叙述者后续对该主张的评议提前写入本节。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“从犹太下来”保留路加地理叙事的方向表达；“规例”兼顾宗教语境与普通读者的可理解性。
