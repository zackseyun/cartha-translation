base_translation:
  language: en
  yaml_path: translation/nt/acts/015/026.yaml
  text: men who have given up their lives for the name of our Lord Jesus the Messiah[a][b].
translation:
  language: zh_hans
  text: 他们为我们的主耶稣弥赛亚的名，不惜性命。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把自己的性命交了出去。”希腊原文直译近于“交出自己的性命”，这里指使自己置身于死亡的危险中。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθρώποις
  choice: 他们
  rationale: 本节在句法上承接25节所说的巴拿巴和保罗；中文以“他们”自然指回二人，无须另加带有性别色彩的名词。
- source_word: παραδεδωκόσι τὰς ψυχὰς αὐτῶν
  choice: 不惜性命
  rationale: παραδίδωμι的完成时主动分词字面有“交出”之意，与ψυχή连用时表示使自己置身致命危险。“不惜性命”既表达甘冒生命危险的强烈语气，也不误称二人已经死亡。
- source_word: ὑπὲρ
  choice: 为
  rationale: 此处接属格，表示所为的缘故；“为”简洁自然。
- source_word: τοῦ ὀνόματος
  choice: ……的名
  rationale: 保留圣经中“名”的表达，使其关于本人、权柄和尊荣的丰富含义不被缩窄。
- source_word: τοῦ κυρίου ἡμῶν
  choice: 我们主
  rationale: κύριος译为“主”，保留其基督论分量及新约惯用称号。
- source_word: Ἰησοῦ Χριστοῦ
  choice: 耶稣弥赛亚
  rationale: Χριστός在此正式称号序列中仍具有“受膏者、弥赛亚”的称号功能；中文“耶稣弥赛亚”简洁地保留其含义，而不把它处理成姓氏。
theological_decisions:
- issue: Χριστοῦ在κυρίου ἡμῶν Ἰησοῦ Χριστοῦ中的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 原词是称号，意为“受膏者”。译作“弥赛亚”可明确传达其称号意义；“基督”虽为中文教会传统常用音译，但较容易被现代读者当作固定姓名的一部分。
- issue: παραδεδωκόσι是否表示已经牺牲
  choice: 译作“不惜性命”，表示甘冒致命危险
  alternative: 译作“献出了性命”，可能表示已经死亡
  rationale: 巴拿巴和保罗当时仍然活着，故不能把该表达处理为已经丧生；同时保留原文“交出生命”所含的强烈献身意味。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“不惜性命”比“冒生命危险”更贴近原文的强烈语气，同时不会暗示二人已经死亡。保留“为……的名”这一圣经表达，并以脚注说明原文较直译的说法。
