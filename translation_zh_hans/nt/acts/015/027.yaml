base_translation:
  language: en
  yaml_path: translation/nt/acts/015/027.yaml
  text: Therefore we have sent Judas and Silas[b][a], who themselves will report the same things by word of mouth.
translation:
  language: zh_hans
  text: 所以，我们已经差派犹大和西拉；他们本人也会口头[a]说明同样的事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“借着话语”，即以口头方式传达，与这封书面信件相配合。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεστάλκαμεν
  choice: 已经差派
  rationale: 希腊语完成时表明差派已经发生，并与当前情形相关。“已经差派”在现代汉语中自然地保留了这一结果性。
- source_word: οὖν
  choice: 所以
  rationale: 承接上文议会所作的决定，表达由此得出的行动；“所以”清楚自然。
- source_word: Ἰούδαν καὶ Σιλᾶν
  choice: 犹大和西拉
  rationale: 采用现代中文圣经人名的通行译法。
- source_word: αὐτοὺς
  choice: 他们本人
  rationale: 保留代词的强调意味，表明这两位受差者会亲自证实书信所述内容。
- source_word: διὰ λόγου
  choice: 口头
  rationale: 直译为“借着话语”，在此与书面信件形成对照，指口头传达。
- source_word: ἀπαγγέλλοντας
  choice: 也会……说明
  rationale: 现在分词修饰犹大和西拉，说明他们受差后所要做的事；用汉语有限动词表达更自然。“说明”适合传达并证实信中内容。
- source_word: τὰ αὐτά
  choice: 同样的事
  rationale: 直接保留原文所指的“相同内容”，不把它窄化为某一种特定形式的“信息”或“决定”。
