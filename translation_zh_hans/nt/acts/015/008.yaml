  text: καὶ ὁ καρδιογνώστης θεὸς ἐμαρτύρησεν αὐτοῖς ⸀δοὺς τὸ πνεῦμα τὸ ἅγιον καθὼς καὶ ἡμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/008.yaml
  text: And God[a], who knows the heart, bore witness to them by giving them the Holy Spirit just as he did to us,
translation:
  language: zh_hans
  text: 鉴察人心的上帝借着把圣灵赐给他们，正如也赐给我们一样，为他们作了见证，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καρδιογνώστης
  choice: 那位洞察人心的
  rationale: 该罕见复合词指知道人内心者。译作“洞察人心”既自然庄重，也保留上帝透彻知道人内在实情的含义；“那位”体现希腊语定冠词及其称谓性质。
- source_word: θεὸς
  choice: 上帝
  rationale: θεός在此指上帝；καρδιογνώστης带定冠词，作为对“上帝”的同位性描述。
- source_word: ἐμαρτύρησεν
  choice: 作了见证
  rationale: 保留μαρτυρέω的见证、证实意味，符合本段中上帝以行动确认他们的论证语境。
- source_word: αὐτοῖς
  choice: 为他们
  rationale: 与“作见证”搭配时，汉语“为他们作了见证”自然表达有利于并确认他们的含义；所指对象由上下文确定，不在正文中增译为“外族人”。
- source_word: δοὺς
  choice: 把……赐给他们
  rationale: 该不定过去时分词说明上帝如何作见证。汉语以连续谓语自然表达其方式关系，无需生硬增添“借着”。
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: 圣灵
  rationale: 这是现代汉语基督教语境中对该固定称谓的标准、清楚译法。
- source_word: καθὼς καὶ ἡμῖν
  choice: 正如赐给我们一样
  rationale: 希腊文省略了从前文承接的“赐给”；汉语补出该动词，使比较关系完整，并以“也”表达καί的包含意味。
theological_decisions:
- issue: 上帝把圣灵同样赐给他们，以此为他们作见证
  choice: 保留“他们”和“我们”的原文对照，不在本节内明确增译群体身份。
  alternative: 把“他们”解释性译为“外族人”。
  rationale: αὐτοῖς本身只是代词，其具体所指由上下文提供。保留代词既忠于原文，也避免把上下文信息直接写入本节。
- issue: καρδιογνώστης与θεὸς的句法关系
  choice: 译作“那位洞察人心的上帝”，将该称谓作为上帝的限定性描述。
  alternative: 译作“上帝，就是洞察人心的那一位”。
  rationale: 两种理解在意义上接近；正文选择自然紧凑的定语结构，同时不添加超出原文的神学说明。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“洞察人心”比“知道人心”更能体现复合词所含的透彻认知意味，又不显古奥。保留句末逗号，以对应本节在原段落中尚未结束的句法延续。
