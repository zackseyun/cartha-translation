  naturalness: “洞察人心”自然庄重，但“鉴察人心”是现代汉语圣经语体中更稳定、贴切的表达。加入“借着”可清楚标示“赐下圣灵”是上帝作见证的方式，语句仍保持现代书面语的流畅。
  terminology: “上帝”“圣灵”“作见证”均适切且前后一致。“鉴察人心”准确表达καρδιογνώστης的神圣属性，不必另加解释性脚注。
