  text: ἀλλὰ ἐπιστεῖλαι αὐτοῖς τοῦ ⸀ἀπέχεσθαι τῶν ἀλισγημάτων τῶν εἰδώλων καὶ τῆς πορνείας καὶ ⸀τοῦ πνικτοῦ καὶ τοῦ αἵματος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/020.yaml
  text: but to write to them to abstain from the pollutions of idols[a], and from sexual immorality, and from what has been strangled[c][b], and from blood.
translation:
  language: zh_hans
  text: 而要写信吩咐他们禁戒与偶像有关的污秽[a]、淫乱[b]、勒死之物[c]和血。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“偶像所造成的玷污”。有些译本将其具体译为“祭过偶像的食物”，但这里的希腊语含义较宽。
    reason: lexical_alternative
  - marker: b
    text: 希腊语也可泛指各种不合正当规范的性行为；有人认为这里较具体地指律法所禁止的性结合。
    reason: alternative_reading
  - marker: c
    text: 直译“被勒死的”，指被勒死、因而血没有适当放尽的动物。
    reason: cultural_note
lexical_decisions:
- source_word: ἐπιστεῖλαι
  choice: 写信告诉
  rationale: 此词在耶路撒冷会议拟写书信的语境中指以书面传达。“写信告诉”既保留书信含义，也符合现代汉语表达。
- source_word: ἀπέχεσθαι
  choice: 禁戒
  rationale: 该中间语态不定式表示主动约束自己、远离某事物；“禁戒”简洁地传达道德及规约语境中的含义。
- source_word: ἀλισγημάτων τῶν εἰδώλων
  choice: 与偶像有关的污秽
  rationale: ἀλίσγημα 指污秽、玷污，尤其可带有祭祀方面的意味；属格 τῶν εἰδώλων 表明其与偶像的来源或关联。此译法保留原文较宽的范围，不将其直接缩限为祭偶像之物。
- source_word: πορνείας
  choice: 淫乱
  rationale: πορνεία 可广指不合正当规范的性行为。“淫乱”是现代中文圣经及一般宗教语境中可理解且较为宽泛的表达，并未限定为婚前性行为。
- source_word: τοῦ πνικτοῦ
  choice: 勒死之物
  rationale: πνικτός 在这里作名词用，指被勒死、血未适当流尽的动物。“勒死之物”贴近原文形式，不在正文中增添“肉”等隐含信息。
- source_word: τοῦ αἵματος
  choice: 血
  rationale: 原文简洁地说禁戒“血”。上下文可涉及食用，但译文不把原文未明说的动作加入正文。
theological_decisions:
- issue: 与偶像有关之禁令的范围
  choice: 译作“与偶像有关的污秽”，保留较宽泛的祭祀性玷污含义。
  alternative: 祭过偶像的食物
  rationale: 原文使用 ἀλισγημάτων τῶν εἰδώλων，而不是别处更明确表示“祭偶像之物”的 εἰδωλόθυτα；不宜在正文中将范围缩窄。
- issue: πορνεία 在使徒谕令中的范围
  choice: 译作较宽泛的“淫乱”。
  alternative: 不合法的婚姻或律法禁止的性结合
  rationale: 该词既可泛指性方面的不道德，也有人认为此处特指受禁止的性结合。正文保留词义广度，脚注提示较窄的理解。
- issue: 这些禁令的性质和持续时限
  choice: 仅陈述应当禁戒的项目，不说明其时限。
  alternative: 为犹太人与外族人共同用餐而设的暂时措施；或对所有信徒永久有效的命令
  rationale: 本节列出禁令，却未在本节解释其完整神学依据及持续时限，因此译文不替经文裁定。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“而要”承接上文的转折；“写信告诉”自然地表达书面传达；“勒死之物”略带正式色彩，以保持原文名词化表达和未明说“肉”的特点。所有解释性限定均置于脚注，正文保留原文的广度与神学张力。
