  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: γενομένης ⸀δὲ στάσεως καὶ ζητήσεως οὐκ ὀλίγης τῷ Παύλῳ καὶ τῷ Βαρναβᾷ πρὸς αὐτοὺς ἔταξαν ἀναβαίνειν Παῦλον καὶ Βαρναβᾶν καί τινας ἄλλους ἐξ αὐτῶν πρὸς τοὺς ἀποστόλους καὶ πρεσβυτέρους εἰς Ἰερουσαλὴμ περὶ τοῦ ζητήματος τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/002.yaml
  text: And after no small dissension and debate had arisen between Paul and Barnabas and them[c][b][a], they appointed Paul and Barnabas and some others from among them to go up to the apostles and elders in Jerusalem about this issue.
translation:
  language: zh_hans
  text: 保罗和巴拿巴同他们发生了不小的争执和辩论[a]；于是，他们指定保罗、巴拿巴和他们中的另外一些人上耶路撒冷[b]，为这个问题[c]去见使徒和长老。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“不小的争执和辩论”，用否定“小”来强调争议相当激烈。
    reason: lexical_alternative
  - marker: b
    text: “上耶路撒冷”是当时说前往耶路撒冷时常用的表达。
    reason: cultural_note
  - marker: c
    text: “这个问题”也可译作“这件事”或“这项争议”。
    reason: lexical_alternative
lexical_decisions:
- source_word: γενομένης δὲ
  choice: 发生了……于是
  rationale: 这是属格独立结构，交代主句行动发生的背景。“发生了……于是”符合现代汉语叙事习惯，也保留了事件之间的承接关系。
- source_word: στάσεως καὶ ζητήσεως
  choice: 争执和辩论
  rationale: στάσις表示尖锐的对立或纷争，ζήτησις在这里表示争论、辩论；两个词并列，既体现关系上的冲突，也体现言语上的交锋。
- source_word: οὐκ ὀλίγης
  choice: 不小的
  rationale: 直译希腊文的曲言强调法，以否定“小”来强调争执和辩论相当严重。
- source_word: τῷ Παύλῳ καὶ τῷ Βαρναβᾷ πρὸς αὐτούς
  choice: 保罗、巴拿巴和他们之间
  rationale: 自然表达争议双方；“他们”承接上一节从犹太来的那些人，同时避免加入希腊文没有明确表达的更强敌对意味。
- source_word: ἔταξαν
  choice: 众人决定派
  rationale: τάσσω在此表示作出安排或决定，让指定的人前往。译作“决定派”既体现有组织的差派，又不把具体制度或权力结构写得过重。“众人”按上下文补出未明说的主语。
- source_word: ἀναβαίνειν
  choice: 上耶路撒冷
  rationale: 保留前往耶路撒冷惯用“上去”的地理和文化表达。
- source_word: τινας ἄλλους ἐξ αὐτῶν
  choice: 他们中间另外几个人
  rationale: 准确表达这些同行者是从当地群体中选出的其他成员，不额外限定其身份。
- source_word: τοὺς ἀποστόλους καὶ πρεσβυτέρους
  choice: 使徒和长老
  rationale: 采用《使徒行传》中这两个群体称谓的通行译法，保持其叙事和职分含义。
- source_word: περὶ τοῦ ζητήματος τούτου
  choice: 就这个问题商议
  rationale: ζήτημα指正在争论、需要处理的问题；“就这个问题商议”在现代汉语中自然，并保留其尚待裁断的性质。
theological_decisions:
- issue: 争议双方的识别
  choice: 译为保罗、巴拿巴和“他们”之间的争执，“他们”指向上一节从犹太来的人。
  alternative: 可较宽泛地译为“保罗和巴拿巴同他们发生了争执和辩论”。
  rationale: 此处理依照紧邻语境确认代词所指，但不进一步推断各方的制度身份或神学立场。
- issue: ἔταξαν所体现的群体行动
  choice: 译作“众人决定派”，表达群体作出安排并差派代表。
  alternative: 可译作“他们安排”或“他们指定”。
  rationale: 经文呈现的是有组织地回应争议，但没有详细说明决策程序或教会治理模式，因此译文不作超出原文的制度化解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“不小的”保留原文修辞；“上耶路撒冷”保留原文惯用说法，并以脚注说明；句式按汉语信息顺序调整，使争议背景、群体决定和差派目的层次清楚。
