  yaml_path: translation/nt/acts/015/038.yaml
  text: But Paul insisted that they should not take along this man[a], who had withdrawn from them from Pamphylia and had not gone with them to the work.
translation:
  language: zh_hans
  text: 但保罗坚持不该带上这个人[a]；他曾在旁非利亚离开他们，没有和他们一同去做那工作。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这个曾在旁非利亚离弃他们的人”。希腊语分词可表达较强的负面意味；正文采用诠释较少的“离开”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠξίου
  choice: 坚持不该
  rationale: 未完成时态结合争议语境，表达保罗持续而坚定的判断；“坚持”比“认为合宜”更能传达语气力度。
- source_word: ἀποστάντα
  choice: 曾……离开他们
  rationale: ἀφίσταμαι在此基本义为离开、退出；正文采用较少诠释性的“离开”，不直接定性为“擅自离弃”，并以脚注保留较强译法。
- source_word: ἀπ’ αὐτῶν ἀπὸ Παμφυλίας
  choice: 曾在旁非利亚离开他们
  rationale: 两个ἀπό短语分别指出与同行者分离，以及分离所关联的旁非利亚地点；现代汉语用“在旁非利亚离开他们”自然清楚，也符合徒13:13的叙事背景。
- source_word: μὴ συνελθόντα αὐτοῖς
  choice: 没有和他们一同去
  rationale: 保留συνέρχομαι的同行含义，并按汉语行程叙述自然译作“一同去”。
- source_word: εἰς τὸ ἔργον
  choice: 去做那工作
  rationale: “那工作”保留定冠词所指的具体事工，同时“去做”比生硬的“进入那工作”更符合现代汉语。
- source_word: μὴ συμπαραλαμβάνειν τοῦτον
  choice: 不该带上这个人
  rationale: 以“不该”承接保罗坚持的内容；“带上”准确表达共同携带、同行之意，“这个人”保留τοῦτον的指示意味。
