id: ACT.15.21
reference: Acts 15:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Μωϋσῆς γὰρ ἐκ γενεῶν ἀρχαίων κατὰ πόλιν τοὺς κηρύσσοντας αὐτὸν ἔχει ἐν ταῖς συναγωγαῖς κατὰ πᾶν σάββατον ἀναγινωσκόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/021.yaml
  text: For from ancient generations Moses has had those who proclaim him in every city[a], being read in the synagogues every Sabbath.
translation:
  language: zh_hans
  text: 因为自古以来，摩西在各城都有传讲他的人[a]，每逢安息日，他都在会堂里被诵读。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为：“摩西……有传讲他的人……他被诵读。”这里“摩西”是转喻，指与摩西相关的著作或律法。
    reason: 说明原文保留的人称表达及其转喻含义，防止读者误以为是在传讲或诵读摩西本人。
lexical_decisions:
- source_word: Μωϋσῆς
  choice: 摩西
  rationale: 采用现代汉语中通行的圣经人名译法，并保留原文以“摩西”代指其著作的转喻。
- source_word: γὰρ
  choice: 因为
  rationale: 承接上文，为前述判断说明理由；“因为”在现代汉语中自然地表达解释或因由。
- source_word: ἐκ γενεῶν ἀρχαίων
  choice: 自古以来
  rationale: 自然表达从古代世代延续至今的时间意义，虽未逐字保留“世代”的复数形式，却准确传达该习语。
- source_word: κατὰ πόλιν
  choice: 在各城
  rationale: κατά加单数名词具有逐一分布的意义；“在各城”简洁地表达每一座城的范围。
- source_word: τοὺς κηρύσσοντας αὐτὸν
  choice: 传讲他的人
  rationale: 保留κηρύσσω的公开宣讲意味，也保留αὐτόν对“摩西”的人称指代，不在正文中直接改写为“摩西律法”。
- source_word: ἔχει
  choice: 都有
  rationale: 表达从古时延续至当前的稳定状况；与“自古以来”配合，现代汉语无需另用完成体也能呈现持续意义。
- source_word: ἐν ταῖς συναγωγαῖς
  choice: 在会堂里
  rationale: “会堂”是συναγωγή在犹太宗教语境中的标准译法，“里”使处所表达自然。
- source_word: κατὰ πᾶν σάββατον
  choice: 每逢安息日
  rationale: 准确表达逐个安息日反复发生的规律性，符合现代汉语习惯。
- source_word: ἀναγινωσκόμενος
  choice: 他都……被诵读
  rationale: 保留现在时被动分词的意义及以“摩西”代其著作的转喻；“诵读”适合会堂公开宣读经文的场景，并避免擅自将分词明确处理为因果从句。
theological_decisions:
- issue: “摩西”的转喻所指
  choice: 正文保留“摩西／他”，不直接替换成“摩西律法”或“摩西的著作”。
  alternative: 译作“摩西的律法在各城都有传讲的人……每逢安息日都在会堂里被诵读”。
  rationale: 希腊文明确使用“摩西”和阳性代词，以人物代指与他相关的著作或律法。保留这种转喻更忠实于原文，也避免在正文中把所指范围解释得过窄。
- issue: 末尾分词与前句的逻辑关系
  choice: 以并列而紧密衔接的汉语分句表达，不明定为“因为”或“既然”。
  alternative: 译作“因为每逢安息日，他都在会堂里被诵读”。
  rationale: ἀναγινωσκόμενος在语境中可带解释或原因意味，但其分词形式本身没有将关系完全明说；正文保留这种开放性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“自古以来”“在各城”“每逢安息日”清楚易懂；保留“摩西／他”的原文转喻，并以脚注解释。
