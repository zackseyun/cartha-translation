  text: ἔδοξεν γὰρ τῷ ⸂πνεύματι τῷ ἁγίῳ⸃ καὶ ἡμῖν μηδὲν πλέον ἐπιτίθεσθαι ὑμῖν βάρος πλὴν ⸂τούτων τῶν ἐπάναγκες⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/028.yaml
  text: For it seemed good to the Holy Spirit and to us to place on you no greater burden than these necessary things:[a][b]
translation:
  language: zh_hans
  text: 因为圣灵和我们决定，除了这些必要的事以外，不再把别的重担加在你们身上：[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为圣灵和我们认为合宜，除了这些必要的事以外，不再把别的重担加在你们身上。”希腊语ἔδοξεν……καὶ ἡμῖν是表示认可或作出决定的惯用表达。
    reason: lexical_alternative
  - marker: b
    text: “这些必要的事”也可译作“这些要紧的事”或“这些必要的要求”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδοξεν
  choice: 认为……是好的（译作“都认为……不该”）
  rationale: 该非人称表达可表示“认为合宜”或“作出决定”。正文采用自然的现代汉语表达，保留圣灵与使徒会议共同认可这一决定的语气，而不把它弱化为随意意见。
- source_word: τῷ πνεύματι τῷ ἁγίῳ
  choice: 圣灵
  rationale: 与ἔδοξεν构成“圣灵认为合宜”的结构，呈现圣灵的位格性行动；“圣灵”是现代汉语的标准称谓。
- source_word: καὶ ἡμῖν
  choice: 和我们都
  rationale: 与“圣灵”并列，明确表达圣灵和说话者共同认可；“都”使汉语句法自然，但不取消二者的并列关系。
- source_word: μηδὲν πλέον
  choice: 不该再……别的
  rationale: 结合βάρος表达“不增加更多／额外的重担”。此译法在现代汉语中自然，并保留增添额外负担的比较含义。
- source_word: ἐπιτίθεσθαι
  choice: 加在
  rationale: 原词意为放置、加诸，与“重担”构成自然的负担隐喻；比“强加”较少加入制度性或负面色彩。
- source_word: ὑμῖν
  choice: 你们身上
  rationale: 明确指出承受重担的对象，并符合汉语“把重担加在……身上”的习惯表达。
- source_word: βάρος
  choice: 重担
  rationale: 这里比喻加给外邦信徒的义务。“重担”既准确保留隐喻，也符合庄重而通俗的现代汉语。
- source_word: πλὴν
  choice: 除了
  rationale: 在否定结构后引出例外；汉语用“除了……不……”清楚自然地表达这一限制。
- source_word: τούτων τῶν ἐπάναγκες
  choice: 以下这些必要的事
  rationale: 该短语前指／引出下一节列举的具体事项。“必要的事”贴近原文而不过度界定这些要求的性质；加入“以下”符合书信中引出后文清单的汉语表达。
theological_decisions:
- issue: 圣灵与会议决定的关系
  choice: 保留圣灵与“我们”并列，共同认为此决定合宜。
  alternative: 把这句话仅理解为人的共识，或把圣灵处理为非位格性的影响。
  rationale: 希腊文以两个并列的与格成分连接于ἔδοξεν，文本将决定同时归于圣灵和使徒会议。译文不进一步解释二者如何共同作出决定。
- issue: 对外邦信徒之规定的效力与范围
  choice: 表达除了所列必要事项外，不再增加别的重担。
  alternative: 理解为完全没有任何义务，或理解为全面施加摩西律法。
  rationale: 原文既称这些事项为必要，也明确限制所加的负担；译文保留这两方面的张力，不导入后来的律法与恩典体系。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“圣灵和我们都认为”保留原文的并列结构；“重担加在你们身上”保留原文隐喻。正文中的[a][b]与脚注标记一一对应。
