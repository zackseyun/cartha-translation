  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节不见于现存最早的一批希腊文抄本，包括三世纪的蒲草纸抄本𝔓74以及四世纪的西奈抄本和梵蒂冈抄本，也不见于早期科普特文译本；但拜占庭多数文本、一些较晚的亚历山大文本和西方文本的抄本，以及拉丁文和叙利亚文传统都收录了本节。它可能是后来的抄写员增添的，用来解释：既然第33节说西拉和犹大已经离开，为什么第40节西拉仍留在安提阿，从而能与保罗同行。
    reason: textual_critical
lexical_decisions:
- source_word: δοκέω（Ἔδοξε…τῷ Σίλᾳ）
  choice: 西拉认为最好
  rationale: 该动词以无人称形式配与格，表示某人认为某种做法合宜或作出相应决定。“认为最好”既传达其惯用意义，又避免现代汉语中生硬的“在西拉看来是好的”。
- source_word: ἐπιμένω（ἐπιμεῖναι）
  choice: 留
  rationale: 此处指继续停留在一个地点；“留在那里”简洁自然，并准确表达西拉没有随其他人离开的意思。
- source_word: αὐτοῦ
  choice: 在那里
  rationale: 此词在这里作地点副词，回指上下文中的安提阿。
- source_word: δέ
  choice: 但
  rationale: δέ在此标示与上一节所述离去形成转折；译作“但”符合语篇关系。
