translation:
  language: zh_hans
  text: 这些事自古以来就是已知的[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本的写法较完整，作“从亘古以来就是已知的”，或“他从古时就使这些事为人所知”。
    reason: textual_variant
lexical_decisions:
- source_word: γνωστὰ
  choice: 已知的
  rationale: 这是中性复数形容词，在无系词分句中作表语；“已知的”直接保留其状态含义，不把它扩展为“使人知道”，也不强化为“众所周知”。按上下文补出“这些事”，以自然表达中性复数所指。
- source_word: ἀπ’
  choice: 从
  rationale: ἀπό在此标明时间的起点；“从”简洁地保留这一时间关系。
- source_word: αἰῶνος
  choice: 古时
  rationale: 在这个时间短语中，αἰών可指久远的过去或古代。“古时”符合本处简短措辞，也不把经文直接解释为较强的“亘古”或“永恒”。
theological_decisions:
- issue: 这句简短经文所表达之知晓的时间范围
  choice: 译为“从古时就是已知的”，仅表达这些事早已为人所知的状态，不扩写为关于上帝永恒预知的教义性陈述。
  alternative: “从亘古就已知道”，或“他从古时就使这些事为人所知”。
  rationale: SBLGNT正文极为简短，只作γνωστὰ ἀπ’ αἰῶνος。译文应保留这种简洁和未明说知晓主体的特点，不纳入较长异文中的词语，也不以神学推论填补句意；较长读法收入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“这些事”承接上下文，并对应γνωστὰ的中性复数；“就是已知的”保留原文无系词短句的凝练感。脚注标记已在正文中标出。
