  text: μετὰ δὲ τὸ σιγῆσαι αὐτοὺς ἀπεκρίθη Ἰάκωβος λέγων· Ἄνδρες ἀδελφοί, ἀκούσατέ μου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/013.yaml
  text: And after they became silent[a], James answered, saying, “Brothers[b], listen to me.”
translation:
  language: zh_hans
  text: 他们安静下来以后[a]，雅各回应说：“诸位弟兄[b]，请听我说。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他们停止说话以后”。希腊文所指的是前面发言的人不再讲话之后。
    reason: lexical_alternative
  - marker: b
    text: 希腊文直译为“男人们，弟兄们”，是正式的阳性呼语；这里指在场的弟兄们，不过当时更广泛的聚会中也有其他人在场。
    reason: cultural_note
lexical_decisions:
- source_word: μετὰ δὲ τὸ σιγῆσαι αὐτοὺς
  choice: 他们安静下来以后
  rationale: μετά加冠词化不定式表示后续时间，即“……以后”；σιγάω在这里指停止说话、归于安静。“安静下来以后”既保留时序，也不额外限定他们先前发言的方式。
- source_word: ἀπεκρίθη
  choice: 回应说
  rationale: ἀποκρίνομαι可指回答或作出回应。这里雅各是在前面众人发言之后接着讲话，“回应说”比单纯“回答”更适合没有明确提问的议事语境。
- source_word: Ἰάκωβος
  choice: 雅各
  rationale: 采用现代中文圣经传统中对新约人名Ἰάκωβος的通行译名“雅各”。
- source_word: λέγων
  choice: 说
  rationale: 该分词引出直接引语；中文用“回应说”自然表达其叙事功能，无须机械译成“说道”。
- source_word: Ἄνδρες ἀδελφοί
  choice: 诸位弟兄
  rationale: 两个呼格均为阳性复数。ἄνδρες在正式讲话中可加强对听众的称呼；“诸位弟兄”以自然、庄重的现代中文保留正式且男性化的称呼，脚注说明其字面形式。
- source_word: ἀκούσατέ μου
  choice: 请听我说
  rationale: 不定过去时命令式要求听众专心听取。“请听我说”准确表达命令语气，同时符合中文正式发言的礼貌表达。
theological_decisions:
- issue: 公开集会讲话中的阳性呼格
  choice: 正文译作“诸位弟兄”
  alternative: “弟兄姊妹”或字面译作“男人们，弟兄们”
  rationale: 原文ἄνδρες与ἀδελφοί都是阳性复数，不能无根据扩展为“弟兄姊妹”；但逐词并列译成“男人们，弟兄们”在现代中文中生硬且容易误解。“诸位弟兄”保留男性称呼和正式语气，字面结构则在脚注中交代。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“诸位弟兄”适合正式议事场合；“回应说”保持叙事衔接，避免把ἀπεκρίθη误读为对某个明确问题作答。
