  source_fidelity: 译文总体准确呈现属格独立结构、彼得起身发言、较早时期的拣选、外邦人听闻福音并相信。惟“上帝就在你们中间选定，要让……”在现代汉语中“选定”缺少宾语，且与后接目的结构衔接不稳；宜改为“作出拣选，使……”，既保留原文未明说被拣选者的含蓄，也使句法完整。
  naturalness: “外族人”在现代汉语通常带有相对于说话者的泛称，未能稳定传达犹太人与非犹太人这一语境对照；“外邦人”为圣经现代汉语中清楚、惯常且不失自然的对应语。“福音的信息”也比“福音之道”更直接表达 λόγος 的“信息”义。
  terminology: 建议以“外邦人”对应 τὰ ἔθνη，并在脚注保留“列国”。“弟兄们”可保留，且脚注准确说明其男性复数的惯用称呼性质。“上帝”及“福音”均合适。
