- from: 经过许多辩论之后，彼得站起来对他们说：“弟兄们[a]，你们知道，早在从前[b]，上帝就在你们中间选定，要让外族人[c]借着我的口听见福音之道，并且相信。”
  to: 经过许多辩论之后，彼得站起来，对他们说：“弟兄们[a]，你们知道，很早以前[b]，上帝曾在你们中间作出拣选，使外邦人[c]借着我的口听见福音的信息，并且相信。”
  rationale: 修订主要处理中文句法和术语精确性：“作出拣选”避免为原文未明说的被拣选者补出“我”，同时顺畅引出目的；“外邦人”准确表达耶路撒冷会议中 τὰ ἔθνη 的非犹太人所指；“福音的信息”更自然地表达 τὸν λόγον τοῦ εὐαγγελίου。脚注标记均保留并与正文锚点一致。
