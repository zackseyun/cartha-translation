    rationale: ἐξελέξατο 的被选对象虽可由“借着我的口”推知为彼得，但希腊文此处未明说。中文“选定”一般要求明示宾语；改作“在你们中间作出拣选，使……”可自然保留原文的含蓄。
  - severity: medium
    issue: “外族人”不够精确对应本节 τὰ ἔθνη 的语境所指。
    rationale: 本段讨论犹太人与非犹太信徒；“外邦人”是现代汉语圣经语境中较稳定、明确的表达。“外族人”易理解为任意不同民族的外国人。
  - severity: low
    issue: “福音之道”较为文言化，且“道”可能弱化 λόγος 在此处的“信息/消息”义。
    rationale: “福音的信息”现代、清楚，并完整传达“福音的消息/信息”。
