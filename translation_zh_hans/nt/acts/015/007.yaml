language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: πολλῆς δὲ ⸀ζητήσεως γενομένης ἀναστὰς Πέτρος εἶπεν πρὸς αὐτούς· Ἄνδρες ἀδελφοί, ὑμεῖς ἐπίστασθε ὅτι ἀφ’ ἡμερῶν ἀρχαίων ⸂ἐν ὑμῖν ἐξελέξατο ὁ θεὸς⸃ διὰ τοῦ στόματός μου ἀκοῦσαι τὰ ἔθνη τὸν λόγον τοῦ εὐαγγελίου καὶ πιστεῦσαι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/007.yaml
  text: And after much debate had taken place[a], Peter stood up and said to them, “Brothers[c][b], you know that from ancient days God chose among you that through my mouth the Gentiles should hear the word of the gospel and believe.”
translation:
  language: zh_hans
  text: 经过许多辩论之后，彼得站起来，对他们说：“弟兄们[a]，你们知道，很早以前[b]，上帝曾在你们中间作出拣选，使外邦人[c]借着我的口听见福音的信息，并且相信。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“男人们，弟兄们”。这是希腊语的男性复数称呼；“弟兄们”保留其形式和亲属式语气，但这一惯用称呼也可能代表更广的与会群体。
    reason: lexical_alternative
  - marker: b
    text: 或译“从早些时候起”。
    reason: lexical_alternative
  - marker: c
    text: 或译“列国”。这里指非犹太民族的人，因此正文译作“外邦人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλῆς ... ζητήσεως γενομένης
  choice: 经过许多辩论之后
  rationale: 属格独立结构表示先于彼得发言的情形；“辩论”既体现议事中的争议，也不夸大为敌对冲突。
- source_word: ἀναστὰς
  choice: 站起来
  rationale: 具体、自然地表达彼得发言前起身的动作。
- source_word: Ἄνδρες ἀδελφοί
  choice: 弟兄们
  rationale: 这是男性复数的惯用称呼；正文保留其亲属式语气，避免擅自扩写为“弟兄姊妹”。
- source_word: ἐπίστασθε
  choice: 你们知道
  rationale: 直接表达听众已经知晓此事。
- source_word: ἀφ’ ἡμερῶν ἀρχαίων
  choice: 早在从前
  rationale: 表达相对于会议当时而言较早、众人熟知的一段时期，同时避免现代汉语中“远古”所暗示的极其久远年代。
- source_word: ἐν ὑμῖν ἐξελέξατο ὁ θεὸς
  choice: 上帝就在你们中间选定
  rationale: 保留“在你们中间”和上帝主动选择的含义；不在正文中明添希腊文未明说的宾语“我”。
- source_word: διὰ τοῦ στόματός μου
  choice: 借着我的口
  rationale: 保留原文生动的工具性表达，突出彼得作为宣讲者。
- source_word: τὰ ἔθνη
  choice: 外族人
  rationale: 本段语境指犹太人以外的人；“外族人”在现代汉语中清楚传达这一对照，而脚注保留“列国”的字面可能。
- source_word: τὸν λόγον τοῦ εὐαγγελίου
  choice: 福音之道
  rationale: 兼顾 λόγος 的信息或话语含义与 εὐαγγέλιον 的“福音”，措辞庄重且为普通读者所能理解。
- source_word: πιστεῦσαι
  choice: 相信
  rationale: 与“听见”并列，直接保留不定式所表达的信从回应，不扩展为更具解释性的神学措辞。
theological_decisions:
- issue: Ἄνδρες ἀδελφοί 的男性复数称呼及其代表范围
  choice: 正文译作“弟兄们”，脚注说明其字面形式
  alternative: “各位弟兄”或“弟兄姊妹们”
  rationale: 保留原文明确的男性复数形式和群体亲属语气，不把可能的广泛适用范围直接扩写进正文。
- issue: τὰ ἔθνη 在耶路撒冷会议语境中的所指
  choice: 外族人
  alternative: 列国
  rationale: 上下文讨论的是非犹太信徒，因此正文应清楚显示犹太人与非犹太人的区别，同时以脚注保留该词较宽的词义。
- issue: ἐν ὑμῖν ἐξελέξατο 后选择对象在句法上的含蓄
  choice: 译作“在你们中间选定”，不明添“我”
  alternative: “从你们中间拣选了我”
  rationale: 上下文和“借着我的口”强烈暗示彼得是被选用的人，但希腊文本没有明写宾语；正文保留这种含蓄，避免把推论写成明文。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“经过许多辩论之后”符合会议场景；彼得的称呼和陈述保持正式口吻。正文中的脚注标记依次紧随相关词语，且每个标记均有对应脚注。
