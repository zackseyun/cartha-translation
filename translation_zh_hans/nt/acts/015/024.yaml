  text: ἐπειδὴ ἠκούσαμεν ὅτι τινὲς ἐξ ἡμῶν ⸀ἐξελθόντες ἐτάραξαν ὑμᾶς λόγοις ἀνασκευάζοντες τὰς ψυχὰς ⸀ὑμῶν οἷς οὐ διεστειλάμεθα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/024.yaml
  text: Since we have heard that some went out from us and troubled you with words[a], unsettling your souls, to whom we gave no instructions[b],
translation:
  language: zh_hans
  text: 因我们听说，有些人从我们中间出去，用言语搅扰你们，扰乱你们的心[a]；我们并没有吩咐他们[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“扰乱你们的心神”。原文直指“你们的心魂／内在自我”，这里指人的内在心灵，并非只指情绪。
    reason: lexical_alternative
  - marker: b
    text: 或译：“我们并没有命令他们。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπειδὴ ἠκούσαμεν
  choice: 我们听说
  rationale: ἐπειδή引出这封信作出说明的缘由；汉语以“我们听说”自然表达已经获悉且与当前有关的消息，无须生硬地另译“因为”。
- source_word: τινὲς ἐξ ἡμῶν ἐξελθόντες
  choice: 有些人从我们这里出去
  rationale: 保留这些人与耶路撒冷群体的来源关系及ἐξελθόντες所表达的离开动作，同时不暗示他们获得授权。
- source_word: ἐτάραξαν ὑμᾶς λόγοις
  choice: 用言语搅扰你们
  rationale: 保留λόγοις的工具性含义；“搅扰”传达ἐτάραξαν所指的困扰和动荡。
- source_word: ἀνασκευάζοντες τὰς ψυχὰς ὑμῶν
  choice: 使你们内心混乱
  rationale: ἀνασκευάζω在此表示扰乱、动摇；ψυχή指人的内在生命或整个人的内在状态，译作“内心”比“灵魂”更符合现代汉语语境，又避免仅限于情绪。
- source_word: οἷς οὐ διεστειλάμεθα
  choice: 我们并没有吩咐他们
  rationale: 直接保留关系从句的否定内容，说明这些人并未受发信者吩咐；不添加原文没有的让步连词或“这样做”。
theological_decisions:
- issue: 是否明说这些搅扰者没有使徒群体的授权
  choice: 我们并没有吩咐他们
  alternative: 这些人并未奉我们的命令
  rationale: 原文明确否认发信者曾向这些人下达吩咐。正文维持主动句和原文措辞，不进一步解释其制度地位；“未获授权”的含义由上下文自然显出。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“从我们这里出去”保留来源与离开的双重信息；以分号清楚连接对搅扰行为的陈述和对吩咐关系的否认。
