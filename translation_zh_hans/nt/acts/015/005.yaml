  text: ἐξανέστησαν δέ τινες τῶν ἀπὸ τῆς αἱρέσεως τῶν Φαρισαίων πεπιστευκότες, λέγοντες ὅτι δεῖ περιτέμνειν αὐτοὺς παραγγέλλειν τε τηρεῖν τὸν νόμον Μωϋσέως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/005.yaml
  text: But some of those from the party of the Pharisees who had believed stood up[a], saying that it is necessary to circumcise them and to command them to keep the law of Moses.
translation:
  language: zh_hans
  text: 可是，法利赛派[a]中有些已经信了的人站起来，说：“必须给他们行割礼，并吩咐他们遵守摩西的律法。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“法利赛教派”。这里的希腊语指一个公认的派别或学派，不一定含有后来专门术语“异端”的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξανέστησαν
  choice: 站起来
  rationale: 在议事场景中，此词自然指起身发言；“站起来”既保留叙事动作，也不额外加入“反对”或“坚持”等语气。
- source_word: τινες
  choice: 有些
  rationale: 对应不定复数代词，不添加原文没有明确表达的性别信息。
- source_word: τῶν ἀπὸ τῆς αἱρέσεως τῶν Φαρισαίων
  choice: 法利赛派中
  rationale: 此处 αἵρεσις 指一个可辨识的群体、派别或学派；“派”简洁自然，并避免误导读者把它理解为后世技术意义上的“异端”。
- source_word: πεπιστευκότες
  choice: 已经信了的人
  rationale: 完成时主动分词表达先前相信而其状态持续至今；采用动词性表达，保留这些人已经相信却仍主张外邦人受割礼、守律法的张力。
- source_word: λέγοντες
  choice: 说
  rationale: 中性地引出其发言内容，不把语气强化为“宣称”或“坚持”。
- source_word: δεῖ
  choice: 必须
  rationale: 准确表达非人称动词所表示的必要性，同时像原文一样不明说这种必要性的依据或来源。
- source_word: περιτέμνειν αὐτούς
  choice: 给他们行割礼
  rationale: 直接保留主动不定式结构；现代汉语中“给某人行割礼”自然明确。
- source_word: παραγγέλλειν
  choice: 吩咐
  rationale: 表达带有权威性的指令；比“教导”更有命令意味，又比“勒令”少了原文没有的强硬色彩。
- source_word: τε τηρεῖν
  choice: 并……遵守
  rationale: τε 连接相关的不定式，τηρέω 在律法语境中指持守、遵行；“遵守”是现代汉语中自然的法律表达。
- source_word: τὸν νόμον Μωϋσέως
  choice: 摩西的律法
  rationale: 直接反映希腊语属格结构，清楚且符合现代中文圣经语域。
theological_decisions:
- issue: 犹太群体语境中 αἵρεσις 的译法
  choice: 派
  alternative: 教派
  rationale: 这里是在说明法利赛人的群体归属，并非判定他们为后世教会术语所说的“异端”。“派”自然、中性；脚注保留“教派”这一可行译法。
- issue: πεπιστευκότες 的时态与神学张力
  choice: 已经信了的人
  alternative: 信徒
  rationale: 动词性译法既反映完成时所表达的既成且持续状态，也保留经文中的张力：这些人已经信了，却仍主张外邦人必须受割礼并遵守摩西律法；译文不替作者评断其信仰真伪。
- issue: δεῖ 所表达之必要性的来源
  choice: 必须
  alternative: 应当
  rationale: 原文表达强烈必要性，却没有在此句说明其权威来源。“必须”保留其主张的力度，而不暗示叙述者认可这一主张。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“可是”承接上文并表达转折；引语保持简洁有力。脚注标记紧随其所说明的“法利赛派”，便于读者准确对应。
