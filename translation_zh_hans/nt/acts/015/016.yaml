id: ACT.15.16
reference: Acts 15:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα ἀναστρέψω καὶ ἀνοικοδομήσω τὴν σκηνὴν Δαυὶδ τὴν πεπτωκυῖαν καὶ τὰ ⸀κατεσκαμμένα αὐτῆς ἀνοικοδομήσω καὶ ἀνορθώσω αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/016.yaml
  text: After these things I will return[a], and I will rebuild the fallen tent of David; I will rebuild its ruins, and I will restore it[b],
translation:
  language: zh_hans
  text: “这些事以后，我要回来，重建大卫那倒塌的帐幕[a][b]；我要重建它被拆毁的部分，使它重新立起来。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “帐幕”或译“帐篷”。希腊语这个词可表示帐篷或帐幕。
    reason: lexical_alternative
  - marker: b
    text: “大卫的帐幕”是先知性的比喻，表达与大卫的家系或王权相关的复兴。
    reason: cross_reference
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: 这些事以后
  rationale: 保留复数指示语的形式和引文中的时间推进，同时符合现代汉语表达。
- source_word: ἀναστρέψω
  choice: 我要回来
  rationale: 此处取“返回、回来”之义，保留上帝以第一人称作出的应许；不把它泛化为“转向”。
- source_word: ἀνοικοδομήσω
  choice: 重建
  rationale: 准确表达“再次建造”，也保留整句反复出现的复兴意象。
- source_word: τὴν σκηνὴν Δαυὶδ
  choice: 大卫……的帐幕
  rationale: σκηνή可指帐幕或帐篷；“帐幕”自然、庄重，并保留原文的先知性比喻，不直接解释为大卫的王朝或国度。
- source_word: τὴν πεπτωκυῖαν
  choice: 那倒塌的
  rationale: 完成时分词描写因倒塌而持续处于破败状态；“倒塌的”与帐幕搭配自然。
- source_word: τὰ κατεσκαμμένα αὐτῆς
  choice: 其中被拆毁之处
  rationale: 保留中性复数完成时被动分词所表达的被拆毁部分，较“废墟”更直接呈现被动含义，也避免把帐幕意象过度实体化。
- source_word: ἀνορθώσω αὐτήν
  choice: 把它重新立起来
  rationale: ἀνορθόω本义包含扶正、重新竖立；在倒塌帐幕的语境中，这一译法具体保留原有图像，同时也传达恢复之意。
theological_decisions:
- issue: “大卫的帐幕”的比喻含义
  choice: 正文保留“大卫……的帐幕”这一比喻
  alternative: 直接译为“大卫的王朝”或“大卫倒塌的国度”
  rationale: 引文借倒塌帐幕的重建表达与大卫家系或王权相关的恢复，但希腊文本没有直接把比喻改写成王朝或国度，因此正文不替读者消解其先知性张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“这些事以后”略带引文语体，以保留希腊文结构；“重新立起来”使倒塌、拆毁、重建的连续图像清晰可感。脚注标记均置于其所说明的“大卫……的帐幕”之后。
