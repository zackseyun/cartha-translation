  text: Ἰούδας τε καὶ Σιλᾶς, καὶ αὐτοὶ προφῆται ὄντες, διὰ λόγου πολλοῦ παρεκάλεσαν τοὺς ἀδελφοὺς καὶ ἐπεστήριξαν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/032.yaml
  text: Judas and Silas[a], who were themselves prophets, encouraged the brothers at length and strengthened them.
translation:
  language: zh_hans
  text: 犹大和西拉二人也是先知。他们用许多话劝勉弟兄们[a]，使他们坚定。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“弟兄姐妹”；希腊文作“弟兄们”，在这里可能指整个信徒群体。
    reason: 说明原文阳性复数“弟兄们”的字面形式，以及它在早期信徒群体语境中可能包括男女信徒。
lexical_decisions:
- source_word: Ἰούδας τε καὶ Σιλᾶς
  choice: 犹大和西拉
  rationale: 采用《使徒行传》中这两个人名通行、易辨认的中文译法；τε καὶ 在此自然地连接二人。
- source_word: καὶ αὐτοὶ προφῆται ὄντες
  choice: 自己也是先知
  rationale: 保留 αὐτοὶ 的强调以及 καὶ 的“也”义，并直接译出 προφῆται，不弱化其先知身份。分词结构作为二人的背景说明处理，不强行限定为原因或时间关系。
- source_word: διὰ λόγου πολλοῦ
  choice: 用许多话
  rationale: 贴近原文“借着许多言语”的表达，同时在现代汉语中自然，表明他们作了较长、较充分的口头劝勉。
- source_word: παρεκάλεσαν
  choice: 劝勉
  rationale: παρακαλέω 在此兼有鼓励、劝导之意；“劝勉”适合先知对信徒群体的言语服事，也保持庄重而通俗的语体。
- source_word: τοὺς ἀδελφοὺς
  choice: 弟兄们
  rationale: 保留希腊文阳性复数的字面形式；此词在早期基督徒群体中可能统指男女信徒，因此以脚注说明其可能的包容范围。
- source_word: ἐπεστήριξαν
  choice: 坚固他们
  rationale: 该动词表示使人坚定、稳固；“坚固”既保留其力度，也与前面的“劝勉”区分为另一项行动。
theological_decisions:
- issue: 混合信徒群体中 ἀδελφοὺς 的译法
  choice: 弟兄们
  alternative: 弟兄姐妹；信徒们
  rationale: 原文采用阳性复数“弟兄”，但在当时教会语境中可代表整个信徒群体。正文保留原文形式，脚注提示可能包括女性，避免在正文中消除词形信息或缩窄实际指称。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“用许多话”较直接地保留原文表达；以分号清楚区分身份背景与随后行动，同时不把分词结构过度解释为明确的因果关系。
