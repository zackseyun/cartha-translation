  text: Μετὰ δέ τινας ἡμέρας εἶπεν ⸂πρὸς Βαρναβᾶν Παῦλος⸃· Ἐπιστρέψαντες δὴ ἐπισκεψώμεθα τοὺς ⸀ἀδελφοὺς κατὰ ⸂πόλιν πᾶσαν⸃ ἐν αἷς κατηγγείλαμεν τὸν λόγον τοῦ κυρίου, πῶς ἔχουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/036.yaml
  text: After some days[a], Paul said to Barnabas, “Let us return now and visit the brothers in every city where we proclaimed the word of the Lord, and see how they are.”
translation:
  language: zh_hans
  text: 过了些日子，保罗对巴拿巴说：“我们现在回去吧，探望我们从前宣讲主的话的各城里的弟兄[a]，看看他们近况如何。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“弟兄姊妹”。希腊文直译为“弟兄”，这里可能用阳性称谓代表整个信徒群体。
    reason: 说明原文的性别形式与其可能具有的包容性指称。
lexical_decisions:
- source_word: Μετὰ δέ τινας ἡμέρας
  choice: 过了些日子
  rationale: μετά加宾格时间短语表示此后一段时间；“过了些日子”自然保留了间隔时间的不确定性。
- source_word: εἶπεν πρὸς Βαρναβᾶν Παῦλος
  choice: 保罗对巴拿巴说
  rationale: 按现代汉语自然语序清楚标明说话者和对象，准确表达εἶπεν πρὸς。
- source_word: Ἐπιστρέψαντες δὴ ἐπισκεψώμεθα
  choice: 我们现在回去吧，探望
  rationale: 分词Ἐπιστρέψαντες与劝勉虚拟式连用，整体构成共同提议；“回去吧”表达劝勉语气，“现在”传达δή的推动和即时意味，“探望”兼含亲自察看与关切。
- source_word: τοὺς ἀδελφοὺς
  choice: 弟兄
  rationale: 保留希腊文阳性亲属称谓的形式；此处很可能泛指包括女性在内的信徒群体，故以脚注说明。
- source_word: κατὰ πόλιν πᾶσαν ἐν αἷς
  choice: 我们从前宣讲主的话的各城里
  rationale: “各城”表达κατά的逐一、分布意义；调整定语位置，使句子符合现代汉语表达。
- source_word: κατηγγείλαμεν τὸν λόγον τοῦ κυρίου
  choice: 我们从前宣讲主的话
  rationale: “宣讲”体现καταγγέλλω公开传扬的力度；“主的话”准确保留λόγος τοῦ κυρίου的属格关系，并维持新约常用表达。
- source_word: πῶς ἔχουσιν
  choice: 看看他们近况如何
  rationale: 该习语询问人的状况；“近况如何”自然表达其关切意味，又不限定为身体、属灵或其他某一方面。
theological_decisions:
- issue: ἀδελφοί用于可能包括男女的信徒群体
  choice: 正文译作“弟兄”，脚注说明可能包括姊妹
  alternative: 弟兄姊妹；信徒
  rationale: 正文保留原文的阳性亲属称谓及群体家庭意象，同时借脚注说明其代表性用法，避免把女性排除在指称之外。
- issue: κύριος的译法
  choice: 主
  alternative: 主人
  rationale: 此处是基督徒宣讲之信息所属或所关乎的“主”；“主”既符合新约语境，也不额外限定τοῦ κυρίου的属格关系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“回去吧，探望”保留共同提议的语气和动作关系；“近况如何”比生硬的“他们怎样”更符合汉语习惯，同时保留所问状况的开放性。
