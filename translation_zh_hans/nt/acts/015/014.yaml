source:
  edition: SBLGNT
  text: Συμεὼν ἐξηγήσατο καθὼς πρῶτον ὁ θεὸς ἐπεσκέψατο λαβεῖν ἐξ ἐθνῶν ⸀λαὸν τῷ ὀνόματι αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/014.yaml
  text: Simeon has recounted how God first visited the Gentiles to take from them a people for his name[a][b][c].
translation:
  language: zh_hans
  text: 西缅[a]讲述了上帝起初怎样眷顾外邦人[b]，要从他们中间取出一群归在自己名下[c]的子民。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “西缅”也可译作“西门”；雅各在这里使用的是“西缅”这一形式。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“从列国中”或“从万民中”；在本段语境中指非犹太人。
    reason: lexical_alternative
  - marker: c
    text: “归在自己名下”指属于上帝、以他的名为身份标志。
    reason: cultural_note
lexical_decisions:
- source_word: Συμεὼν
  choice: 西缅
  rationale: 按本节所用的希腊形式音译为“西缅”，不与更常见的“西门”统一，以保留原文形式上的区别。
- source_word: ἐξηγήσατο
  choice: 讲述了
  rationale: 该动词表示把事情叙述、陈明出来；这里概括西缅刚才向会众所作的陈述，“讲述了”自然且准确。
- source_word: καθὼς
  choice: 怎样
  rationale: 在叙述类动词之后引出所述内容及其方式；“怎样”保留原文的表达，同时符合现代汉语习惯。
- source_word: πρῶτον
  choice: 起初
  rationale: 表示上帝转向外族人的初始阶段；“起初”在句中自然，也不把含义限定为单一瞬间的“第一次”。
- source_word: ἐπεσκέψατο
  choice: 眷顾
  rationale: 该词不只是一般性的看望，也含有带着关切而介入、施恩的意味；“眷顾”保留这一圣经语境中的积极内涵。
- source_word: λαβεῖν
  choice: 选取
  rationale: 不定式表达上帝眷顾的目的。原义是“取、取得”；在从外族人中形成一群子民的语境下，“选取”较自然，同时保留主动取出的含义。
- source_word: ἐξ ἐθνῶν
  choice: 从外族人中间
  rationale: 使徒行传十五章的语境是非犹太人的接纳；“外族人”清楚表达与犹太人相对的群体，“中间”则明确保留ἐξ的来源含义。
- source_word: λαὸν
  choice: 一群……子民
  rationale: λαός指作为整体、归属于上帝的民。“一群……子民”在现代汉语中自然，并保留其群体与圣约归属意味。
- source_word: τῷ ὀνόματι αὐτοῦ
  choice: 归于他名下
  rationale: 保留“名”的意象，同时以自然汉语表达属于上帝、与他的名相联的意思，避免直接淡化为“归给自己”。
theological_decisions:
- issue: ἐξ ἐθνῶν应译为“外族人”还是“万国”
  choice: 外族人
  alternative: 万国／列国
  rationale: 本章直接讨论非犹太人是否被接纳的问题。“外族人”准确呈现犹太人与非犹太人的对照，同时脚注保留“列国”的字面可能。
- issue: τῷ ὀνόματι αὐτοῦ是否意译为“归给自己”
  choice: 归于他名下
  alternative: 归给自己
  rationale: 原文的“名”带有归属和身份认同的圣经性意味。正文保留“名”，既不抹平其神学内涵，也用现代汉语传达其基本意义。
- issue: ἐπεσκέψατο是否只译作中性的“访问”
  choice: 眷顾
  alternative: 看顾／临到
  rationale: 该词在此指上帝带着关切和目的采取行动。“眷顾”呈现这一积极意味，但不进一步规定这种介入的具体方式。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“眷顾”保留上帝主动关怀与介入的经文语感；“归于他名下”既保留原文“名”的意象，又避免生硬的逐字结构。所有脚注标记均置于正文相应句末。
