  text: νῦν οὖν τί πειράζετε τὸν θεόν, ἐπιθεῖναι ζυγὸν ἐπὶ τὸν τράχηλον τῶν μαθητῶν ὃν οὔτε οἱ πατέρες ἡμῶν οὔτε ἡμεῖς ἰσχύσαμεν βαστάσαι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/010.yaml
  text: Now then[c][b][a], why are you testing God by putting a yoke on the neck of the disciples that neither our fathers nor we have been able to bear?
translation:
  language: zh_hans
  text: 那么，你们为什么要试探上帝，把连我们的祖先和我们都无力承受的轭放在门徒的颈项上呢？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “轭”在这里比喻强加给人的义务或要求；本节没有进一步说明其具体范围。
    reason: metaphor_note
lexical_decisions:
- source_word: νῦν οὖν
  choice: 那么
  rationale: 承接上文并引出推论，符合现代汉语论辩语气；不机械译出“现在”，以免被误解为单纯的时间指示。
- source_word: τί πειράζετε τὸν θεόν
  choice: 为什么要试探上帝
  rationale: τί在此构成带责问意味的“为什么”；πειράζω以“试探”保留对上帝作出不当考验的语义。
- source_word: ἐπιθεῖναι ζυγὸν ἐπὶ τὸν τράχηλον
  choice: 把……轭，放在……的颈项上
  rationale: 保留“轭”和“颈项”的鲜明隐喻，并用自然汉语表达不定式所说明的试探方式。
- source_word: τῶν μαθητῶν
  choice: 门徒
  rationale: 这是使徒行传中μαθητής的常规、清楚译法。
- source_word: οὔτε οἱ πατέρες ἡμῶν οὔτε ἡμεῖς
  choice: 连我们的祖先和我们都
  rationale: 用“连……都”自然传达两个οὔτε并列否定的强调；“祖先”准确指以色列先前世代，也避免现代汉语将“父亲”误解为直系父辈。
- source_word: ἰσχύσαμεν βαστάσαι
  choice: 无力承受
  rationale: 表达没有能力负担此轭；“承受”既与轭的负重意象相合，也适用于所加义务。
theological_decisions:
- issue: “轭”具体所指的范围
  choice: 在正文中保留“轭”的隐喻，不界定其具体范围
  alternative: 直接解释为整套摩西律法，或较窄地解释为割礼及相关要求
  rationale: 上下文表明这是加在门徒身上的宗教义务，但本节自身未精确限定其范围；保留隐喻可避免把特定教义解释写入正文。
- issue: “试探上帝”的语气
  choice: 译作“试探上帝”
  alternative: 译作“考验上帝”或“把上帝置于考验之中”
  rationale: 此处带责备意味，并非中性的检验；“试探”保留了这种神学和修辞张力。
translation_notes:
  register: 采用现代、庄重而口语可懂的普通话。“颈项”比“脖子”略庄重，并能维持经文意象；句末“呢”体现原文反问语气。
