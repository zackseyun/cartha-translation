source:
  edition: SBLGNT
  text: γράψαντες διὰ χειρὸς ⸀αὐτῶν· Οἱ ἀπόστολοι καὶ οἱ ⸀πρεσβύτεροι ἀδελφοὶ τοῖς κατὰ τὴν Ἀντιόχειαν καὶ Συρίαν καὶ Κιλικίαν ἀδελφοῖς τοῖς ἐξ ἐθνῶν χαίρειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/023.yaml
  text: 'Having written by their hand: “The apostles and the elder brothers[a], to the brothers from among the Gentiles in Antioch and Syria and Cilicia[c][b], greetings.”'
translation:
  language: zh_hans
  text: 他们写了如下的信，托这两人带去[a]：“使徒和长老弟兄们[b]，向住在安提阿、叙利亚和基利家各地的外邦弟兄们[c]问安。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“借着他们的手”，指托他们经手或带去；“这两人”承接上文受差遣的犹大和西拉。
    reason: 解释希腊语习语及其在上下文中的指代。
  - marker: b
    text: 原文也可理解为“使徒和长老们——弟兄们”；“弟兄们”可能是对使徒和长老的称呼或同位说明。也有译本按不同分组译为“使徒、长老和弟兄们”。
    reason: 保留 πρεσβύτεροι ἀδελφοί 的句法和群体划分歧义，避免正文断定为独立第三群体或仅指作长老者。
  - marker: c
    text: 这里的“弟兄们”可统指信仰群体成员，包括女性。
    reason: 说明阳性复数亲属称谓在群体称呼中的包容性用法。
lexical_decisions:
- source_word: γράψαντες
  choice: 他们写了信
  rationale: 不定过去时分词承接上文，表示他们随后写成信函；汉语用顺承句比硬译为分词结构自然。
- source_word: διὰ χειρὸς αὐτῶν
  choice: 交在这两人手中
  rationale: 保留“借着他们的手”这一希腊语用手表达经办、递送的习语意象，同时依上文将代词明确为受托送信的两人。
- source_word: ἀπόστολοι
  choice: 使徒
  rationale: 这是《使徒行传》中对耶路撒冷受认可之使者领袖的惯常称呼。
- source_word: πρεσβύτεροι ἀδελφοὶ
  choice: 作长老的弟兄
  rationale: 既保留 πρεσβύτεροι 在本语境中作为群体职分“长老”的意义，也反映 ἀδελφοί 与其紧密相连、可作同位说明的句法；脚注保留另一种标点和分组理解。
- source_word: τοῖς κατὰ τὴν Ἀντιόχειαν καὶ Συρίαν καὶ Κιλικίαν
  choice: 向安提阿、叙利亚和基利家各地……
  rationale: κατά 加宾格在此表示分布于所列地点和地区；“各地”自然体现分布范围。
- source_word: ἀδελφοῖς τοῖς ἐξ ἐθνῶν
  choice: 外族人中的弟兄
  rationale: ἐξ 表明这些信徒出自非犹太各民族；“外族人”在现代汉语中清楚表达 ἔθνη 的族群对照，同时避免把它误解为现代国家概念。
- source_word: χαίρειν
  choice: 问安
  rationale: χαίρειν 在书信开头是固定问候语，不宜在此直译为“要喜乐”。
theological_decisions:
- issue: πρεσβύτεροι ἀδελφοὶ 所指的群体及句法关系
  choice: 作长老的弟兄
  alternative: 长老们——弟兄们；或“长老和弟兄们”
  rationale: 现有希腊文本在 πρεσβύτεροι 与 ἀδελφοί 之间没有连词或第二个冠词，较自然地可将“弟兄”看作对长老的同位说明；但原文标点并非作者所加，也可能把“弟兄”理解为对使徒和长老的称呼或同位语。正文不增添第三个并列群体，脚注保留此歧义。
- issue: 复数 ἀδελφοί 是否包括女性信徒
  choice: 弟兄
  alternative: 弟兄姊妹；信徒同道
  rationale: 正文保留原文阳性复数的亲属称谓；在初期教会书信语境中，该词常可统指整个信徒群体，包括女性，因此以脚注说明其包容性所指。
translation_notes:
  register: 采用现代、庄重而易懂的书信语体。“交在这两人手中”保留原文的“手”之意象，并结合上文消除汉语代词含混；引文采用自然的中文发信人—收信人—问候格式。
