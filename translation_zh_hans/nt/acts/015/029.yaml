id: ACT.15.29
reference: Acts 15:29
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἀπέχεσθαι εἰδωλοθύτων καὶ αἵματος καὶ ⸀πνικτῶν καὶ πορνείας· ἐξ ὧν διατηροῦντες ἑαυτοὺς εὖ πράξετε. ἔρρωσθε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/029.yaml
  text: to abstain from food sacrificed to idols[a], from blood, from what has been strangled, and from sexual immorality. If you keep yourselves from these things, you will do well[d][c][b]. Farewell.
translation:
  language: zh_hans
  text: 要禁戒祭献给偶像的食物[a]、血、被勒死的动物[b]和淫乱[c]。你们若保守自己远离这些事，就会做得好。愿你们安好[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“献给偶像之物”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“勒死的肉”或“被勒死之物”。
    reason: lexical_alternative
  - marker: c
    text: 译作“淫乱”的希腊词可作广义理解；但有些解释者根据《利未记》的禁令，认为这里特指某些不合律法的性关系或婚姻。
    reason: alternative_reading
  - marker: d
    text: 或译：“保重。”希腊原文是书信结尾的惯用语，也有“安好”的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέχεσθαι
  choice: 禁戒
  rationale: 此处不定式承接上文命令的内容，表示持续远离所列事项。“禁戒”简洁庄重，也符合现代中文圣经语体。
- source_word: εἰδωλοθύτων
  choice: 祭过偶像的食物
  rationale: 该词指献给偶像之物，语境中尤指食物或肉类；此译清楚表达祭祀背景，同时以脚注保留较宽泛的词义。
- source_word: αἵματος
  choice: 血
  rationale: 希腊文仅用“血”，因此正文保持简洁，不额外限定为食用血或带血的肉。
- source_word: πνικτῶν
  choice: 勒死之物
  rationale: 该形容词作名词使用，指被勒死的动物或其肉；“勒死之物”保留原文较宽的指称范围。
- source_word: πορνείας
  choice: 淫乱
  rationale: πορνεία可广指不合伦理的性行为；“淫乱”在现代中文中简明庄重，又不把含义缩限为某一种行为。
- source_word: ἐξ ὧν
  choice: 不沾染这些事
  rationale: 这一关系短语回指前述各项；与“保守自己”连用时，“不沾染这些事”在中文中自然地表达远离之意。
- source_word: διατηροῦντες ἑαυτούς
  choice: 你们若保守自己
  rationale: 原文为分词结构，可表达条件或方式；译作条件句符合中文表达，也没有排除方式性的联系。
- source_word: εὖ πράξετε
  choice: 就做得好了
  rationale: 此习语表示如此行是妥当、可嘉的；“做得好了”自然保留劝勉语气，不将其解释为物质上的兴旺。
- source_word: ἔρρωσθε
  choice: 愿你们安好
  rationale: 该词字面与强健、安好有关，在这里是书信结尾的惯用语；此译兼顾告别功能和原词色彩。
theological_decisions:
- issue: 使徒谕令中πορνεία的范围
  choice: 正文采用较宽泛的“淫乱”
  alternative: 特指不合律法的婚姻或《利未记》18章所禁的亲属结合
  rationale: 本节本身没有明确把该词缩限为某一种性方面的过犯，因此正文保留通常的宽泛词义，并在脚注说明语境中特指的解释。
- issue: 饮食禁令中πνικτῶν的所指
  choice: 译作较宽泛的“勒死之物”
  alternative: 明确译为“勒死动物的肉”
  rationale: 原词是复数形容词的名词性用法，可指被勒死之物；正文不补入原文未明说的“肉”，但脚注说明其常见理解。
- issue: ἔρρωσθε作为书信结语的表达
  choice: 译作“愿你们安好”
  alternative: 译作纯粹告别语“再会”或较字面的“要刚强”
  rationale: 这里首先是惯用的书信结束语；“愿你们安好”既发挥中文结语功能，也保留其健康、强健的词源意味。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“禁戒”“保守自己”保留使徒书信的正式劝诫语气；结尾用“愿你们安好”避免生硬的古典告别词。所有脚注标记均置于正文相应位置。
