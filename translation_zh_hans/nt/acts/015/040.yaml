  text: Παῦλος δὲ ἐπιλεξάμενος Σιλᾶν ἐξῆλθεν παραδοθεὶς τῇ χάριτι τοῦ ⸀κυρίου ὑπὸ τῶν ἀδελφῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/040.yaml
  text: But Paul chose Silas and departed[b][a], having been commended by the brothers to the grace of the Lord.
translation:
  language: zh_hans
  text: 保罗却选了西拉，便启程；弟兄们[a]把保罗托付给主的恩典[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄们”按语境也可能泛指信徒群体，包括女性。
    reason: cultural_note
  - marker: b
    text: “托付给主的恩典”也可译作“交托在主的恩典中”。
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: 却
  rationale: 承接上一节巴拿巴的离去，并表达温和的对比。
- source_word: ἐπιλεξάμενος
  choice: 选了
  rationale: 自然表达保罗亲自选定西拉，并保留该动作先于出发的关系。
- source_word: Σιλᾶν
  choice: 西拉
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: ἐξῆλθεν
  choice: 出发了
  rationale: 在旅行叙事中表示动身、启程；“出发了”比字面的“出去了”更符合现代汉语。
- source_word: παραδοθεὶς
  choice: 把他交托
  rationale: 该被动分词在此表示信徒群体将保罗托付于主的眷顾；中文改用主动句，使施事者与受事者清楚而自然。
- source_word: τῇ χάριτι
  choice: 在主的恩典中
  rationale: 保留“恩典”这一神学名词；“交托在……中”自然表达将人置于主恩典的护佑之下，而不将其释义化为“恩慈照顾”。
- source_word: τοῦ κυρίου
  choice: 主的
  rationale: 原文只说“主”，未明确限定所指，因此不增补“耶稣”或“神”。
- source_word: ὑπὸ τῶν ἀδελφῶν
  choice: 弟兄们
  rationale: 保留阳性复数称谓的形式，同时以脚注说明其在信徒群体语境中可能具有更广的涵盖范围。
theological_decisions:
- issue: “主”的所指
  choice: 仅译作“主”
  alternative: 主耶稣；神
  rationale: 原文 κύριος 未作进一步说明；译文保留其开放性，不替原文消除可能的神学张力。
- issue: “弟兄们”的范围
  choice: 正文译作“弟兄们”，脚注说明可能泛指信徒群体
  alternative: 弟兄姊妹；信徒们
  rationale: 正文保留 ἀδελφῶν 的语法形式，脚注则交代其在当时群体称谓中可能包括女性。
- issue: παραδοθεὶς 的含义
  choice: 交托在主的恩典中
  alternative: 蒙弟兄们称许；被委托给主的恩典
  rationale: 此处重点是群体将保罗托付于主恩典的护佑；“交托”也保留“委付、托付”的词义，不把它缩减为单纯的认可或推荐。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“便出发了”保持叙事流畅；分号呈现保罗出发与群体交托之间的紧密关系。所有脚注标记均置于正文相应词句之后。
