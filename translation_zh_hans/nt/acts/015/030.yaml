  text: Οἱ μὲν οὖν ἀπολυθέντες ⸀κατῆλθον εἰς Ἀντιόχειαν, καὶ συναγαγόντες τὸ πλῆθος ἐπέδωκαν τὴν ἐπιστολήν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/030.yaml
  text: So[a], after being sent off, they went down to Antioch, and after gathering the multitude[c][b], they delivered the letter.
translation:
  language: zh_hans
  text: 于是，他们奉命离开后，下到安提阿；召集众人[a]后，便把信交给他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “众人”也可译作“会众”或“聚集的人群”，指安提阿聚集起来的群体。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολυθέντες
  choice: 受差遣后
  rationale: 该分词可表示被放行、遣走；在本段语境中，这些人奉耶路撒冷会议之命携信出发，因此“受差遣后”自然地表达正式遣行，同时不把意思窄化为单纯“获释”。
- source_word: κατῆλθον
  choice: 下到
  rationale: 保留动词“下去”的方向含义，也符合从海拔较高的耶路撒冷前往安提阿的地理表达。
- source_word: συναγαγόντες
  choice: 召集了
  rationale: 简明表达先召集、后交信的动作次序；“召集”也比“聚集”更清楚地体现主语主动使众人集合。
- source_word: τὸ πλῆθος
  choice: 众人
  rationale: 原短语指安提阿聚集起来的群体，可能是信徒会众；“众人”在现代汉语中自然，也避免擅自将其制度化为特定教会术语。
- source_word: ἐπέδωκαν
  choice: 交给
  rationale: 表示将信正式递交给聚集的人；“交给”自然清楚，并保留受领对象。
- source_word: ἐπιστολήν
  choice: 信
  rationale: “信”是现代汉语对该词在此处最自然的对应，较“书信”简洁，且不带不必要的宗教文体色彩。
theological_decisions:
- issue: τὸ πλῆθος所指群体的性质
  choice: 正文译作“众人”，脚注说明也可理解为“会众”或“聚集的人群”
  alternative: 直接译作“会众”
  rationale: 上下文很可能指安提阿的信徒群体，但原词本身没有明确指定正式的教会组织称谓，因此保留其指称范围。
translation_notes:
  register: 采用自然、庄重的现代标准普通话。“于是”承接上文；以“下到”保留原文的地理方向感。正文只为确有歧义的“众人”设置脚注，避免对清楚且可直接保留的方向表达作不必要注释。
