base_translation:
  language: en
  yaml_path: translation/nt/acts/015/037.yaml
  text: But Barnabas wanted to take along also John[a], who was called Mark.
translation:
  language: zh_hans
  text: 可是，巴拿巴想把那称为马可的约翰也带上。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“约翰，也叫马可。”
    reason: 原文可自然理解为用另一个名字辨明约翰的身份；此译法在中文中更直接，同时保留正文中καὶ（“也”）所修饰位置可能产生的表达差异。
lexical_decisions:
- source_word: Βαρναβᾶς
  choice: 巴拿巴
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: δὲ
  choice: 可是
  rationale: 在叙事中承接上文并引出巴拿巴与保罗随后不同的主张，表达温和的转折。
- source_word: ἐβούλετο
  choice: 想
  rationale: 表达巴拿巴的意愿或打算；中文“想”自然简洁，又不把语气强化为已经决定。
- source_word: συμπαραλαβεῖν
  choice: 带上
  rationale: 该复合动词表示带某人同行；“带上”符合现代汉语叙事习惯。
- source_word: καὶ
  choice: 也
  rationale: 修饰宾语，突出巴拿巴想把约翰也列入同行者之中。
- source_word: Ἰωάννην
  choice: 约翰
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: τὸν καλούμενον Μᾶρκον
  choice: 那称为马可的
  rationale: 保留分词短语的识别作用，说明这位约翰另有“马可”这一称呼，而不将καὶ移入该短语。
- source_word: Μᾶρκον
  choice: 马可
  rationale: 采用现代中文圣经中通行的人名音译。
theological_decisions: []
