  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἀλλὰ διὰ τῆς χάριτος τοῦ κυρίου Ἰησοῦ πιστεύομεν σωθῆναι καθ’ ὃν τρόπον κἀκεῖνοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/011.yaml
  text: But through the grace of the Lord Jesus we believe that we will be saved[b][a], just as they also will be.
translation:
  language: zh_hans
  text: 相反，我们相信，我们是借着主耶稣的恩典得救，正如他们一样。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“相反，我们相信，我们将借着主耶稣的恩典得救，正如他们也将得救一样。”
    reason: 原文的不定式可在语境中理解为指向将来的得救；此译法也把比较句中省略的谓语补出。
lexical_decisions:
- source_word: ἀλλὰ
  choice: 不！
  rationale: 承接上文的反问并作强烈转折；中文用“不！”自然地否定把轭加给外族门徒的主张，同时保留原文的对比力度。
- source_word: διὰ τῆς χάριτος
  choice: 是借着……的恩典
  rationale: διά加属格表示途径或凭借；“借着”保留其工具、媒介意义，并以“是……得救”的结构形成自然中文。
- source_word: χάριτος
  choice: 恩典
  rationale: 此处指使人得救的神圣恩惠；“恩典”准确、庄重，也是现代中文读者熟悉的表达。
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: 主耶稣的
  rationale: 按属格结构修饰“恩典”，表达这恩典属于或来自主耶稣，不额外扩展其神学含义。
- source_word: πιστεύομεν
  choice: 我们相信
  rationale: 表达说话者共同持有的确信；“相信”是 πιστεύω 在此语境中最自然的对应。
- source_word: σωθῆναι
  choice: 我们得救
  rationale: 不定式依附于“相信”，中文改用分句以求自然；“得救”保留被动含义，同时不强行限定为现在或将来。
- source_word: καθ’ ὃν τρόπον
  choice: ……一样
  rationale: 简洁自然地表达方式上的比较，即双方以同样的方式得救。
- source_word: κἀκεῖνοι
  choice: 他们也一样
  rationale: κἀκεῖνοι由 καὶ 与 ἐκεῖνοι 合成，明确保留“他们也”；“一样”承接前句所述借恩典得救的方式，并保持原文从“我们”到“他们”的比较方向。
theological_decisions:
- issue: 彼得话语中比较的方向
  choice: 保留“我们”按“他们也”同样的方式得救这一方向
  alternative: 他们会像我们一样得救
  rationale: 原文先说“我们相信（我们）得救”，继而以“他们也”作比较。这样翻译保留上下文的重要强调：外族人不必先成为犹太人；犹太人与外族人同样借主耶稣的恩典得救。
- issue: 得救的时间指向
  choice: 正文采用时间上较中性的“我们得救”
  alternative: 我们将会得救
  rationale: σωθῆναι是不定式，本身不明确标示将来时。上下文容许末后得救的指向，但不宜在正文中把时间意义说得比希腊文更确定，因此以脚注交代可作将来理解。
- issue: 恩典、相信与得救的关系
  choice: 只陈述得救借着主耶稣的恩典，并保留“我们相信”的原句结构
  alternative: 加入“唯独恩典”“唯独信心”或有关行为与救恩次序的解释
  rationale: 经文明说恩典，并以“我们相信”引出所信的内容；译文不加入本节没有明说的宗派性公式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不！”体现彼得对上文主张的鲜明反驳；“他们也一样”简洁保留希腊文的省略和比较方向。正文避免用“将”锁定时间，脚注提供合理的将来时理解。
