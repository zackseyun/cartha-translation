  text: καὶ τούτῳ συμφωνοῦσιν οἱ λόγοι τῶν προφητῶν, καθὼς γέγραπται·
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/015.yaml
  text: 'And with this the words of the prophets agree[a], just as it is written:'
translation:
  language: zh_hans
  text: 众先知的话也与此相符，正如经上所记：[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“众先知的话也赞同这一点。”希腊文的与格结构可表达先知的话与前述之事一致。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: 也
  rationale: 承接上文，并表明先知的话进一步印证前述之事；现代汉语中“也”比直译为“并且”更自然。
- source_word: τούτῳ
  choice: 与此
  rationale: 该与格指向前文所述之事，具体所指保持宽泛；与 συμφωνοῦσιν 搭配译为“与此相符”符合汉语习惯。
- source_word: συμφωνοῦσιν
  choice: 相符
  rationale: 表达彼此一致、协调之意；在人的陈述与经文之间，“相符”自然且准确。
- source_word: οἱ λόγοι
  choice: 话
  rationale: 这里指先知所说并记载下来的言语；译作“话”直接、清楚。
- source_word: τῶν προφητῶν
  choice: 众先知的
  rationale: 属格表示这些话出自先知；“众先知”也自然反映复数。
- source_word: καθὼς
  choice: 正如
  rationale: 引出与前述内容相对应的经文引证，并保留比较、印证的语气。
- source_word: γέγραπται
  choice: 经上所记
  rationale: 这是引述圣经的惯用公式；“经上所记”在现代中文中庄重、简洁，也体现完成时所含的现存效力。
theological_decisions:
- issue: τούτῳ 在雅各讲话中的所指
  choice: 译作宽泛的“此”，指向前文所述的事情或陈述，不加具体限定。
  alternative: 明确译作“外族人归信这件事”、“彼得的话”或“上帝的计划”。
  rationale: 希腊文没有明确限定所指；保留“此”可避免把某一种解释写入正文，并保存原文的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“众先知的话”保留原文复数与属格关系；“与此相符”避免过度拟人化，也不缩窄“此”的具体所指。脚注标记置于引文冒号之后，说明本节正文整体措辞的另一种表达。
