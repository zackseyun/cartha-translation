  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: παραγενόμενοι δὲ εἰς ⸀Ἱεροσόλυμα ⸀παρεδέχθησαν ⸀ἀπὸ τῆς ἐκκλησίας καὶ τῶν ἀποστόλων καὶ τῶν πρεσβυτέρων, ἀνήγγειλάν τε ὅσα ὁ θεὸς ἐποίησεν μετ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/004.yaml
  text: When they arrived in Jerusalem[a], they were welcomed by the church and the apostles and the elders, and they reported all that God had done with them.
translation:
  language: zh_hans
  text: 他们到了耶路撒冷，受到教会、使徒和长老的接待，并报告了上帝同他们一起所做的一切。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“上帝借着他们所做的一切”，或“上帝在他们中间所做的一切”。希腊原文直译为“上帝同他们一起所做的一切”。
    reason: 说明μετ’ αὐτῶν可被理解为工具性或处所性；正文保留其基本的“与……一起”含义及其开放性。
lexical_decisions:
- source_word: παραγενόμενοι δὲ εἰς Ἱεροσόλυμα
  choice: 他们到了耶路撒冷
  rationale: 不定过去时分词交代先于主要动作发生的情形；“到了”自然表达抵达之意。δέ是轻微的承接词，其语篇功能融入中文句序，不另行硬译。
- source_word: παρεδέχθησαν
  choice: 受到……的接待
  rationale: 该被动式在此表示耶路撒冷的信徒群体接纳并款待来者；“受到……的接待”既保留被动关系，也符合庄重自然的现代汉语。
- source_word: ἀπὸ τῆς ἐκκλησίας καὶ τῶν ἀποστόλων καὶ τῶν πρεσβυτέρων
  choice: 教会、使徒和长老
  rationale: ἀπό在被动结构中标明接待者。ἐκκλησία在此指基督徒群体，译作“教会”；πρεσβύτεροι指群体中受认可的领袖，译作“长老”，不引入特定宗派制度。
- source_word: ἀνήγγειλάν τε
  choice: 他们又报告了
  rationale: ἀναγγέλλω表示把事情陈述或报告出来；“报告”适合向教会及其领袖述说事工经过的语境。“又”表达τε与前句的连接。
- source_word: ὅσα ὁ θεὸς ἐποίησεν
  choice: 上帝……所做的一切
  rationale: ὅσα概括报告的全部内容；ποιέω含义宽泛，译作“做”不过度具体化。希腊语不定过去时所指行动先于报告发生，中文凭语境和“了”即可清楚表达。
- source_word: μετ’ αὐτῶν
  choice: 同他们
  rationale: μετά加属格的基本意义是“与……同在／同……一起”。译作“同他们”保留原文开放性，不限定为工具性的“借着他们”或处所性的“在他们中间”。
theological_decisions:
- issue: μετ’ αὐτῶν所表达的上帝行动与使者之间的关系
  choice: 上帝同他们所做的一切
  alternative: 上帝借着他们所做的一切；上帝在他们中间所做的一切
  rationale: 原文明确以上帝为行动主体，却只用“同他们”描述保罗和巴拿巴与这行动的关系。正文保留这种神学上的克制和张力，不擅自将其完全解释为工具性或处所性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以分号区分“受到接待”和“报告”两个并列主要动作；避免古雅表达和带有特定宗派色彩的职衔。
