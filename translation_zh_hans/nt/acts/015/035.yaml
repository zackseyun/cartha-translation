  text: Παῦλος δὲ καὶ Βαρναβᾶς διέτριβον ἐν Ἀντιοχείᾳ διδάσκοντες καὶ εὐαγγελιζόμενοι μετὰ καὶ ἑτέρων πολλῶν τὸν λόγον τοῦ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/035.yaml
  text: But Paul and Barnabas stayed in Antioch[a], teaching and proclaiming the good news of the word of the Lord[c][b], with many others also.
translation:
  language: zh_hans
  text: 但保罗和巴拿巴留在安提阿[a]，同许多其他人一起教导、传扬主的道[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在安提阿住了一段时间。”原文动词可着重表示在那里停留一段时期。
    reason: lexical_alternative
  - marker: b
    text: “传扬”也可译作“传福音”或“宣告好消息”。原文动词指宣布或传扬好消息。
    reason: lexical_alternative
  - marker: c
    text: “主的道”是《使徒行传》中常见的说法，也可译作“主的信息”。
    reason: lexical_alternative
lexical_decisions:
- source_word: διέτριβον
  choice: 仍住
  rationale: 未完成时表示他们持续在当地停留；“仍住”既承接前文的转折，也自然表达一段时间内留在安提阿。
- source_word: διδάσκοντες
  choice: 教导人
  rationale: 保留分词所表达的持续伴随活动；补出汉语中自然的泛指宾语“人”，不限定具体对象。
- source_word: εὐαγγελιζόμενοι
  choice: 宣讲……这一好消息
  rationale: 该动词表示宣布好消息；此译法清楚保留其语义，并使后面的“主的道”自然充当所宣讲的内容。
- source_word: μετὰ καὶ ἑτέρων πολλῶν
  choice: 与许多其他人一同
  rationale: 准确表达保罗和巴拿巴还有许多同工，并保留καί的添加意味。
- source_word: τὸν λόγον
  choice: 道
  rationale: λόγος在此可指“话语”或“信息”；“主的道”是《使徒行传》中可辨识的惯用表达，也保持文学与神学上的连贯。
- source_word: τοῦ κυρίου
  choice: 主的
  rationale: 按原文保留κύριος的称号“主”，不在正文中进一步限定所指。
theological_decisions:
- issue: “主的道”中“主”的所指
  choice: 保持为“主”，不进一步指明
  alternative: 明确译作“主耶稣的道”或泛指“上帝的信息”
  rationale: 《使徒行传》中的“主”常可特别指耶稣，但本句原文仅用κύριος；保持称号可避免消除原有的指称张力。
- issue: “主的道”与“宣讲好消息”的句法关系
  choice: 译作“宣讲主的道这一好消息”
  alternative: 译作“传福音，宣讲主的道”，将二者处理为并列活动
  rationale: 原文只有两个分词“教导”和“传好消息”，而“主的道”最自然地作两者相关的内容，尤其直接作εὐαγγελιζόμενοι的宾语；本译避免凭空增加第三项活动。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“仍住”自然呈现持续停留；“宣讲”兼具公开传扬的力度与当代可懂性。脚注标记均置于正文相应词组之后。
