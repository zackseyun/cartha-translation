  source_fidelity: 草稿基本保留了持续停留、教导、传扬以及有许多其他人共同参与的要素，但“仍住”所含的“仍然”比διέτριβον本身更强；“宣讲主的道这一好消息”也把“好消息”与“主的道”作了不够自然、且略显解释性的同位处理。
  naturalness: “与许多其他人一同教导人，宣讲主的道这一好消息”在现代汉语中修饰范围和搭配均较生硬。将共同参与者前置，并以“教导、传扬主的道”并列，可更自然地表达原文两个分词及其内容。
  terminology: “保罗”“巴拿巴”“安提阿”“主的道”均合适。“主的道”保留了λόγος τοῦ κυρίου的传统而中性的表达；“传扬”可表达εὐαγγελίζομαι的宣告好消息之义，相关语义可在脚注说明。
