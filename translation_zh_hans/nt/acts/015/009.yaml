  text: καὶ ⸀οὐθὲν διέκρινεν μεταξὺ ἡμῶν τε καὶ αὐτῶν, τῇ πίστει καθαρίσας τὰς καρδίας αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/009.yaml
  text: And he made no distinction between us and them[a], having cleansed their hearts by faith.
translation:
  language: zh_hans
  text: 他没有在我们和他们之间作任何区别，借着信心[a]洁净了他们的心。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“凭着信心”。希腊语与格可表示手段或媒介。
    reason: 保留τῇ πίστει在工具或媒介表达上的译法差异。
lexical_decisions:
- source_word: οὐθὲν διέκρινεν
  choice: 不区分
  rationale: οὐθὲν与διέκρινεν合成“毫无分别对待”的表达；译为“不区分”自然简洁，也保留上帝没有在两群人之间作区别的意思。
- source_word: μεταξὺ ἡμῶν τε καὶ αὐτῶν
  choice: 我们和他们
  rationale: μεταξύ及τε…καί表示两方之间；现代汉语在“不区分”之后直接说“我们和他们”最自然，无须机械补出“在……之间”。
- source_word: τῇ πίστει
  choice: 凭着信心
  rationale: πίστις在此译为“信心”；与格很可能表示手段或凭借。“凭着”保留其工具性，同时以脚注提示“借着”这一同样可能的表达。
- source_word: καθαρίσας
  choice: 洁净了
  rationale: 不定过去时分词描述与主句密切相关的行动。汉语用并列谓语“洁净了”比“已经洁净”或“洁净之后”更自然，也避免过度限定其时间关系。
- source_word: τὰς καρδίας αὐτῶν
  choice: 他们的心
  rationale: καρδία指人的内在生命或内心；“心”既忠实于原文意象，也符合现代汉语圣经语体。
theological_decisions:
- issue: πίστις的译法
  choice: 信心
  alternative: 信靠；忠信
  rationale: 本处不是“基督的信/忠信”一类所有格争议结构，语境指上帝藉信使外族人的心得洁净，因此“信心”最为清楚，同时不额外引入宗派性解释。
- issue: τῇ πίστει与洁净行动的关系
  choice: 凭着信心
  alternative: 借着信心
  rationale: 将与格理解为手段或媒介，但不进一步断定信心是人的功德或独立成因；译文保留上帝为洁净行动主体这一神学张力。
- issue: καθαρίσας的时间关系
  choice: 以并列谓语表达
  alternative: 洁净了他们的心之后；既洁净了他们的心
  rationale: 希腊语不定过去时分词可表达先行动作，也可概括与主句相伴的行动。正文不强行锁定严格先后次序。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不区分我们和他们”简洁呈现彼得所强调的上帝不作族群区别；“洁净……的心”保留原文的洁净与内心意象。脚注标记紧随其实际所说明的“凭着信心”，避免指代含混。
