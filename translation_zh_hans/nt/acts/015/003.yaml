id: ACT.15.3
reference: Acts 15:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οἱ μὲν οὖν προπεμφθέντες ὑπὸ τῆς ἐκκλησίας διήρχοντο τήν ⸀τε Φοινίκην καὶ Σαμάρειαν ἐκδιηγούμενοι τὴν ἐπιστροφὴν τῶν ἐθνῶν, καὶ ἐποίουν χαρὰν μεγάλην πᾶσι τοῖς ἀδελφοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/003.yaml
  text: So then[a], having been sent on their way by the church, they passed through both Phoenicia and Samaria, describing in detail the conversion of the Gentiles[b], and they brought great joy to all the brothers.
translation:
  language: zh_hans
  text: 于是，他们由教会送行，经过腓尼基和撒玛利亚，详细讲述外邦人的归信[a]，使所有弟兄[b]都大大喜乐。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “归信”也可译作“转向”。这里指外邦人转向上帝。
    reason: lexical_alternative
  - marker: b
    text: 这里的“弟兄”很可能泛指信徒，包括女性。
    reason: lexical_alternative
lexical_decisions:
- source_word: προπεμφθέντες
  choice: 由教会送行
  rationale: προπέμπω在旅行语境中不只是“差派”，也可指为人送行、帮助其继续旅程。“由教会送行”自然保留这一含义，又不额外断定教会派人一路护送。
- source_word: ἐκκλησίας
  choice: 教会
  rationale: 本节指当地的基督徒群体；“教会”是现代汉语中清楚且符合《使徒行传》语境的表达。
- source_word: διήρχοντο
  choice: 经过
  rationale: 未完成时描写他们行经这些地区的持续旅程；“经过”简洁自然。
- source_word: τήν τε Φοινίκην καὶ Σαμάρειαν
  choice: 腓尼基和撒玛利亚
  rationale: τε…καί把两个地区并列相连；汉语用“和”即可自然表达两者皆包括在内。地名采用通行译名。
- source_word: ἐκδιηγούμενοι
  choice: 详细讲述
  rationale: 这个复合动词带有充分、详尽叙述的意味，“详细讲述”比单纯“讲述”更能体现其语气。
- source_word: τὴν ἐπιστροφὴν τῶν ἐθνῶν
  choice: 外邦人的归信
  rationale: ἐπιστροφή本义涉及转向，此处指非犹太人转向上帝、接受福音。“归信”表达宗教语境中的转向，同时不把它扩展为某套后期教义定义；“转向”作为较直译的可能保留在脚注。ἐθνῶν在本章犹太人与非犹太人的对照中译为“外邦人”。
- source_word: ἐποίουν χαρὰν μεγάλην
  choice: 使……都大大喜乐
  rationale: ποιέω加名词在这里表达使某种情感产生；“使……大大喜乐”自然传达“带来极大的喜乐”。
- source_word: πᾶσι τοῖς ἀδελφοῖς
  choice: 所有弟兄
  rationale: 保留希腊文阳性复数的形式及初期教会的亲属称谓；该词在此很可能泛指信徒群体，包括女性，故在脚注中说明。
theological_decisions:
- issue: ἐπιστροφή如何表达外邦人对福音的回应
  choice: 归信
  alternative: 转向
  rationale: “归信”在现代汉语中能简明表达外邦人转向上帝并相信福音的事件，同时不把经文限定为后期神学体系中的技术概念；脚注保留源词“转向”的形象。
- issue: ἀδελφοί在可能包含男女的信徒群体中如何翻译
  choice: 弟兄
  alternative: 弟兄姊妹；信徒
  rationale: 正文保留原文阳性复数和亲属称谓，避免以解释性表达取代原文形式；脚注说明其语境范围很可能包括女性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“于是”承接上文；句子按汉语习惯组织，同时保留送行、途经两地、详述归信消息及众信徒喜乐的行动次序。脚注标记均放在所解释的词语之后。
