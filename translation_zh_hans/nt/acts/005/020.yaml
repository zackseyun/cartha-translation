  text: Πορεύεσθε καὶ σταθέντες λαλεῖτε ἐν τῷ ἱερῷ τῷ λαῷ πάντα τὰ ῥήματα τῆς ζωῆς ταύτης.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/020.yaml
  text: Go and stand in the temple[c][b][a], and speak to the people all the words of this life.
translation:
  language: zh_hans
  text: “你们去，站在圣殿里[a]，把这生命的一切话语都讲给百姓听。”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣殿”原文指整个圣殿区域，并非专指内殿或圣所；也可译为“圣殿院内”或“圣殿区域”。
    reason: lexical_alternative
  - marker: b
    text: “这生命的一切话语”也可理解为“关于这生命的一切话语”。这里的“生命”可能指福音所传扬的生命。
    reason: alternative_reading
lexical_decisions:
- source_word: Πορεύεσθε
  choice: 你们去
  rationale: 以自然直接的复数命令语气表达行动指令；中文虽不必显明动词形态，加入“你们”可体现原文复数。
- source_word: σταθέντες
  choice: 站在
  rationale: 该不定过去时分词在此很可能表示伴随情形，与命令“去”共同构成连续行动；译作“站在”自然且不必生硬地译成“站定以后”。
- source_word: λαλεῖτε
  choice: 讲给……听
  rationale: λαλέω本义宽泛，指说话、讲述；此处译作“讲给百姓听”符合现代汉语，不额外加入“宣告”的传令色彩。
- source_word: ἐν τῷ ἱερῷ
  choice: 在圣殿院区里
  rationale: ἱερόν指整个圣殿建筑群或范围，并非专指内殿；“圣殿院区”能避免现代读者误解为进入圣所内部。
- source_word: τῷ λαῷ
  choice: 给百姓
  rationale: λαός在语境中指圣殿里的民众；“百姓”直接、庄重，也不擅自将其扩展为“以色列百姓”。
- source_word: πάντα τὰ ῥήματα
  choice: 一切话
  rationale: 保留πᾶς与ῥῆμα的表达，不简化成较具解释性的“全部信息”。
- source_word: τῆς ζωῆς ταύτης
  choice: 这生命的
  rationale: 保留属格结构及其紧凑的开放性，既可理解为关于这生命的话，也可理解为属于或带来这生命的话。
theological_decisions:
- issue: τῆς ζωῆς ταύτης（“这生命”）的含义
  choice: 保留“这生命的一切话”这一含蓄表达
  alternative: 关于这生命的一切话；这新生命的信息；赐生命的信息
  rationale: 原文可能指使徒所传福音中的生命、在耶稣里所得的生命，或带来生命的信息，但并未明确限定。正文保留其神学张力，脚注提示一种自然的句法理解而不替原文作最终裁定。
translation_notes:
  register: 采用现代、庄重而口语可懂的命令句。“去，站在……，把……讲给……”呈现原文行动次序；“圣殿院区”用于准确传达ἱερόν的范围。所有脚注标记均已置于正文。
