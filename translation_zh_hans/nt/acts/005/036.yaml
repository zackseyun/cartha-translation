  text: πρὸ γὰρ τούτων τῶν ἡμερῶν ἀνέστη Θευδᾶς, λέγων εἶναί τινα ἑαυτόν, ᾧ ⸀προσεκλίθη ⸂ἀνδρῶν ἀριθμὸς ὡς⸃ τετρακοσίων· ὃς ἀνῃρέθη, καὶ πάντες ὅσοι ἐπείθοντο αὐτῷ διελύθησαν καὶ ἐγένοντο εἰς οὐδέν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/036.yaml
  text: For before these days Theudas rose up[a], claiming to be somebody, and a number of men, about four hundred, joined him. He was killed[c][b], and all who had been persuaded by him were scattered and came to nothing.
translation:
  language: zh_hans
  text: 因为在这些日子以前，丢大兴起，自称是个人物[a]；约有四百名男子归附了他[b]。他被杀后，所有受他劝服的人[c]都四散了，归于乌有。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“自称是个了不起的人。”原文是表示自己有身份、有分量的习语。
    reason: lexical_alternative
  - marker: b
    text: 或译：“投奔了他”或“拥护他”。
    reason: lexical_alternative
  - marker: c
    text: 或译：“所有跟随他的人。”更直译为“所有受他劝服的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸ γὰρ τούτων τῶν ἡμερῶν
  choice: 因为在这些日子以前
  rationale: πρό加属格表示在某段时间之前；γάρ保留为“因为”，延续迦玛列说明理由的论证。“这些日子以前”贴近原文的指示性表达。
- source_word: ἀνέστη
  choice: 起来
  rationale: 此处指一个领袖或运动兴起、出现，并非复活；“起来”既保留原文修辞力度，也符合汉语叙事表达。
- source_word: Θευδᾶς
  choice: 丢大
  rationale: 采用现代中文圣经读者较熟悉的人名音译。
- source_word: λέγων εἶναί τινα ἑαυτόν
  choice: 自称是个人物
  rationale: 该表达是说丢大把自己说成有身份、有分量的人；“是个人物”自然传达其自我抬高，同时脚注保留更明说的译法。
- source_word: ᾧ προσεκλίθη
  choice: 归附了他
  rationale: 该动词表示人转而依附、站到某位领袖一边；“归附”比泛泛的“加入”更能体现这种依附关系。
- source_word: ἀνδρῶν ἀριθμὸς ὡς τετρακοσίων
  choice: 约有四百名男子
  rationale: ὡς表示约数；ἀνδρῶν在此明确指男性，因此译作“男子”，不泛化为“人”。
- source_word: ὃς ἀνῃρέθη
  choice: 他被杀以后
  rationale: ἀναιρέω在此意为杀死；保留被动意义，并用“以后”自然连接随后发生的溃散。
- source_word: πάντες ὅσοι ἐπείθοντο αὐτῷ
  choice: 所有受他劝服的人
  rationale: 保留πείθω的被说服、被争取过去的含义，而不直接简化为一般性的“跟随”。
- source_word: διελύθησαν
  choice: 都四散了
  rationale: 描述追随者群体解体、分散；“四散”在现代汉语中简洁自然。
- source_word: ἐγένοντο εἰς οὐδέν
  choice: 最终归于乌有
  rationale: 这是表示彻底失败、化为无有的习语；“归于乌有”自然传达该运动毫无结果地消亡。
theological_decisions:
- issue: 迦玛列讲话中有关丢大的历史陈述
  choice: 按希腊文本将此事直接译为迦玛列论证中的历史实例，不在正文中加入不确定语气。
  alternative: 在译文中暗示这项记载可能不确定，或按外部历史重构改写其时间关系。
  rationale: 本节是在转述迦玛列的论证。翻译应呈现现有希腊文本，不在正文中替读者作历史协调或评断。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“是个人物”“四散”“归于乌有”均为当代读者可自然理解的表达；“归附”略带正式色彩，用来准确呈现追随者依附领袖的关系。所有脚注标记均放在其所说明的词组之后。
