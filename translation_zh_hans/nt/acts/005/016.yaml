  text: συνήρχετο δὲ καὶ τὸ πλῆθος τῶν πέριξ ⸀πόλεων Ἰερουσαλήμ, φέροντες ἀσθενεῖς καὶ ὀχλουμένους ὑπὸ πνευμάτων ἀκαθάρτων, οἵτινες ἐθεραπεύοντο ἅπαντες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/016.yaml
  text: And even the multitude from the towns around Jerusalem was coming together[a], bringing the sick and those troubled by unclean spirits[b], and they were all being healed.
translation:
  language: zh_hans
  text: 耶路撒冷周围各城镇的群众也聚集而来[a]，带着病人和受污灵搅扰的人[b]；他们全都得了医治。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“耶路撒冷周围各城镇的群众也在聚集。”
    reason: συνήρχετο可侧重从各处前来会合，也可侧重聚集这一进行中或反复发生的动作。
  - marker: b
    text: 或译：“受污灵折磨的人”。
    reason: ὀχλουμένους可表示受搅扰、侵扰；在上下文中也可译为“受折磨”。
lexical_decisions:
- source_word: συνήρχετο
  choice: 不断聚集而来
  rationale: 未完成时表示过去持续或反复发生的行动；“不断聚集而来”兼顾聚集和前来的动态。
- source_word: τὸ πλῆθος
  choice: 许多人
  rationale: 此处指数量众多的人群；“许多人”在现代汉语中自然，也能与后面的复数分词相协调。
- source_word: τῶν πέριξ πόλεων Ἰερουσαλήμ
  choice: 耶路撒冷周围城镇的
  rationale: 表达来自耶路撒冷附近各聚居地的人；按汉语习惯与“许多人”组合，来源关系由“聚集而来”的语境清楚呈现。
- source_word: φέροντες
  choice: 带着
  rationale: 现在分词说明众人前来时带来患病和受搅扰者；“带着”自然简洁，不预设他们是否需要被抬来。
- source_word: ἀσθενεῖς
  choice: 病人
  rationale: 在医治语境中指患病者，“病人”是清楚自然的现代汉语。
- source_word: ὀχλουμένους
  choice: 受……搅扰的人
  rationale: 保留该词受困扰、侵扰的宽泛含义，不以“折磨”过度限定其强度。
- source_word: ὑπὸ πνευμάτων ἀκαθάρτων
  choice: 受污灵
  rationale: “污灵”简洁保留ἀκάθαρτος的不洁含义，并明确所指为灵体，而非仅仅心理状态。
- source_word: οἵτινες
  choice: 他们
  rationale: 回指刚提到的病人和受污灵搅扰的人；另起分句符合现代汉语表达。
- source_word: ἐθεραπεύοντο
  choice: 得了医治
  rationale: 保留被动受医治的意义；与未完成时相配，置于持续聚集的叙事框架中，表达反复发生的医治。
- source_word: ἅπαντες
  choice: 全都
  rationale: 明确强调所带来的这些人无一例外都得医治。
theological_decisions:
- issue: πνευμάτων ἀκαθάρτων的所指
  choice: 污灵
  alternative: 不洁的灵
  rationale: 保留路加—使徒行传中对邪恶灵体的常用称谓，不将其心理化或纯粹比喻化；“污灵”比“邪灵”更直接保留ἀκάθαρτος的词义。
- issue: ἅπαντες的范围
  choice: 他们全都得了医治
  alternative: 所有人都得了医治
  rationale: “他们”明确回指病人和受污灵搅扰的人，保留经文在本场景中的完整范围，同时避免扩展为现场所有人。
- issue: 医治陈述的体貌
  choice: 不断聚集而来……他们全都得了医治
  alternative: 他们全都不断得到医治
  rationale: 希腊文未完成时呈现持续或反复的过去行动；汉语把持续性主要放在聚集过程上，同时用“全都得了医治”自然表达每批被带来者的结果，不暗示单个人的医治过程必然漫长。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“不断聚集而来”呈现未完成时的持续或反复意味；“污灵”保留原文“不洁之灵”的圣经语义，又避免冗长。所有脚注标记均已置入正文。
