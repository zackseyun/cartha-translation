  yaml_path: translation/nt/acts/005/006.yaml
  text: Then the young men rose[a], wrapped him up, carried him out, and buried him.
translation:
  language: zh_hans
  text: 年轻人[a]就起身，把他裹好，抬出去埋葬了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“较年轻的人”。希腊语νεώτεροι在形式上是比较级，既可指“较年轻的人”，也可泛指“年轻人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστάντες
  choice: 起身
  rationale: 不定过去时分词表示他们起来采取行动；“起身”自然简洁，也保留动作先后关系。
- source_word: δὲ
  choice: 就
  rationale: δέ在此推动叙事进展；“就”自然连接前文与随后的行动。
- source_word: οἱ νεώτεροι
  choice: 年轻人
  rationale: νεώτεροι虽为比较级形式，可指“较年轻的人”，也可泛指“年轻人”；正文采用现代汉语更自然的“年轻人”，并以脚注保留比较级含义。
- source_word: συνέστειλαν
  choice: 把他裹好
  rationale: συστέλλω在此语境指收拢或包裹遗体；“裹好”清楚表达实际动作，又避免扩译为完整的殡葬预备。
- source_word: αὐτὸν
  choice: 他
  rationale: 代词所指为亚拿尼亚；汉语直接译作“他”。
- source_word: ἐξενέγκαντες
  choice: 抬出去
  rationale: ἐκφέρω指把遗体带出；“抬出去”符合多人搬运遗体的语境，比泛泛的“带出去”更具体自然。
- source_word: ἔθαψαν
  choice: 埋葬了
  rationale: θάπτω意为埋葬；“埋葬了”是清楚、庄重且通行的现代汉语表达。
