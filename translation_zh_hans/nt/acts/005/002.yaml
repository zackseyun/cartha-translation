base_translation:
  language: en
  yaml_path: translation/nt/acts/005/002.yaml
  text: And he kept back some of the price[a], with his wife also knowing it, and bringing a certain part[b], he laid it at the apostles’ feet.
translation:
  language: zh_hans
  text: 他私自截留了价款的一部分[a]，他的妻子也知情；他把其中一部分拿来，放在使徒们脚旁[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“暗中把部分价款留为己有”；原文动词含有私下为自己扣留或侵占的意思。
    reason: lexical_alternative
  - marker: b
    text: 直译“放在使徒们的脚旁”；这是把钱摆在使徒们面前的具体说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνοσφίσατο
  choice: 私自截留了
  rationale: 该动词含有暗中为自己扣留、侵占的负面意味。“私自截留”既传达隐瞒和不当占有，也不额外限定为某种法律意义上的盗窃。
- source_word: ἀπὸ τῆς τιμῆς
  choice: 价款的一部分
  rationale: τιμή在本语境中指卖产所得的价款；ἀπό与动词结合，表示从价款中截留。译作“价款”比泛化为“所得”更贴近原词。
- source_word: συνειδυίης καὶ τῆς γυναικός
  choice: 他的妻子也知情
  rationale: 属格独立结构表达伴随情况，说明妻子知道此事。“也”对应καί；“知情”在现代汉语中简洁自然，并保留她明知此举的含义。
- source_word: ἐνέγκας μέρος τι
  choice: 他把其中一部分拿来
  rationale: 不定代词τι使数额保持不确定；“其中一部分”自然表达从价款中取出某一部分。用“拿来”体现不定过去分词所表示、先于主要动作发生的行为。
- source_word: παρὰ τοὺς πόδας τῶν ἀποστόλων ἔθηκεν
  choice: 放在使徒脚前
  rationale: 保留原文具体的空间意象及《使徒行传》上下文中把款项交由使徒处置的表达，不抽象改写为“交给使徒”。
theological_decisions:
- issue: 亚拿尼亚行为的道德性质
  choice: 以“私自截留”表达隐瞒并为自己扣留的负面含义
  alternative: 中性地译作“留下了一部分”
  rationale: νοσφίζομαι及叙事语境表明，这并非单纯保留自己有权支配的钱，而是带有欺瞒性质的扣留；译文应传达这种道德力度，同时不增添超出经文的教义判断。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“私自截留”保留原文的道德负面色彩；分号呈现妻子知情这一伴随情况与随后交款动作之间的叙事层次。
