  text: μετὰ τοῦτον ἀνέστη Ἰούδας ὁ Γαλιλαῖος ἐν ταῖς ἡμέραις τῆς ἀπογραφῆς καὶ ἀπέστησε ⸀λαὸν ὀπίσω αὐτοῦ· κἀκεῖνος ἀπώλετο καὶ πάντες ὅσοι ἐπείθοντο αὐτῷ διεσκορπίσθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/037.yaml
  text: After this[a], Judas the Galilean rose up in the days of the census and drew away people after him. He also perished[b], and all who were persuaded by him were scattered.
translation:
  language: zh_hans
  text: 此后，加利利人犹大在登记[a]的日子里兴起，拉拢一批人跟从他。他也丧命了；凡受他劝服的人，全都四散了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“人口普查”。希腊语所用的词可指人口普查或官方登记。
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ τοῦτον
  choice: 此后
  rationale: μετά加宾格在此表示时间上的先后，承接前述人物及事件；“此后”比“在他以后”更自然，也保留了所指对象可能涵盖前述事件的余地。
- source_word: ἀνέστη
  choice: 兴起
  rationale: 此处指一名领袖出现并发起行动，不是复活用语。“兴起”既符合上下文，也保留原文的动态感。
- source_word: Ἰούδας ὁ Γαλιλαῖος
  choice: 加利利人犹大
  rationale: 按现代汉语圣经人名惯例译作“犹大”，并以“加利利人”表达附加于姓名后的地域称谓。
- source_word: ἐν ταῖς ἡμέραις τῆς ἀπογραφῆς
  choice: 在户口登记的日子里
  rationale: ἀπογραφή可指官方登记或人口统计。“户口登记”在现代汉语中清楚表达行政登记之意，并以脚注保留“人口普查”的译法。
- source_word: ἀπέστησε λαὸν ὀπίσω αὐτοῦ
  choice: 拉拢一些人跟从他
  rationale: 使役形式ἀπέστησε在此有使人离开原有立场、转而追随的含义；“拉拢……跟从他”自然表达这一动作，又不额外明说“叛乱”。λαόν无冠词，故译作“一些人”，避免理解为全体民众。
- source_word: κἀκεῖνος ἀπώλετο
  choice: 他也灭亡了
  rationale: κἀκεῖνος有“那人也”的承接、强调意味；ἀπώλετο表示遭毁灭或死亡，但未说明死法，因此不具体译成“被杀”。
- source_word: πάντες ὅσοι ἐπείθοντο αὐτῷ
  choice: 凡被他说服的人
  rationale: ἐπείθοντο表示受其劝服、被其争取过去；直译为“被他说服”可保留它与前句“跟从”不同的词义。
- source_word: διεσκορπίσθησαν
  choice: 全都四散了
  rationale: 该被动形式意为被驱散或分散。“四散了”符合现代汉语叙事表达，并保留群体瓦解的图景。
theological_decisions:
- issue: 如何描述犹大所领导运动的政治性质
  choice: 译为他“兴起，拉拢一些人跟从他”，不直接称其发动叛乱
  alternative: 译为“起来造反”或“带领人叛乱”
  rationale: 历史背景可能涉及反抗行动，但本节希腊文本没有明确使用“叛乱”一词。译文只表达他兴起并使人转而追随，避免把背景资料写入正文。
- issue: ἀπώλετο是否明确表示被杀
  choice: 译为“灭亡了”
  alternative: 译为“被杀了”或“死了”
  rationale: 原词说明他归于毁灭、丧命，却未交代方式。“灭亡了”保留原文较宽泛且略带毁灭意味的措辞。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“此后”“兴起”“灭亡”“四散”等词适合历史叙事；“拉拢”传达争取他人转而追随的含义，同时避免添加原文未明说的政治定性。脚注标记均置于相关词语之后。
