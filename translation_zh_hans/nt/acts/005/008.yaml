base_translation:
  language: en
  yaml_path: translation/nt/acts/005/008.yaml
  text: But Peter answered her[a], “Tell me, did you sell the land for this much?” And she said, “Yes, for this much.”
translation:
  language: zh_hans
  text: 彼得回答她说：“你告诉我，你们卖那块地[a]是这个价钱吗？”她说：“是的，就是这个价钱。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “地”也可译为“产业”或“田地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη δὲ πρὸς αὐτὴν Πέτρος
  choice: 彼得问她
  rationale: ἀποκρίνομαι在对话叙事中常引出回应；此处彼得随即发问，现代汉语用“问她”比直译“回答她说”自然。δέ所标示的叙事推进无需另加生硬连接词。
- source_word: Εἰπέ μοι
  choice: （由直接问句表达）
  rationale: 原意为“告诉我”；在汉语中直接提出后面的封闭式问题，已自然包含要求对方作答之意，避免“你告诉我”略显累赘。
- source_word: εἰ
  choice: ……吗
  rationale: εἰ引出间接的是非问句，汉语用句末“吗”自然表达。
- source_word: τοσούτου
  choice: 这个价钱
  rationale: 该词指向此前提到的具体金额；“这个价钱”保留指示意义，也符合买卖语境。
- source_word: τὸ χωρίον
  choice: 那块地
  rationale: χωρίον可指一块土地、田地或地产；结合上文出售产业的语境，“那块地”自然且不过度限定其用途。
- source_word: ἀπέδοσθε
  choice: 你们卖
  rationale: ἀποδίδωμι在商业语境中可表示出售；动词为第二人称复数，译作“你们”明确包括撒非喇和亚拿尼亚。
- source_word: Ναί, τοσούτου
  choice: 是的，就是这个价钱
  rationale: 保留简明肯定和τοσούτου的重复；“就是”自然强化她对所问金额的确认。
