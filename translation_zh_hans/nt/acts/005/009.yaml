source:
  edition: SBLGNT
  text: ὁ δὲ ⸀Πέτρος πρὸς αὐτήν· Τί ὅτι συνεφωνήθη ὑμῖν πειράσαι τὸ πνεῦμα κυρίου; ἰδοὺ οἱ πόδες τῶν θαψάντων τὸν ἄνδρα σου ἐπὶ τῇ θύρᾳ καὶ ἐξοίσουσίν σε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/009.yaml
  text: But Peter said to her[a], “Why did you agree together to test the Spirit of the Lord? Look, the feet of those who buried your husband are at the door[b], and they will carry you out.”
translation:
  language: zh_hans
  text: 彼得对她说：“你们为什么商定要试探主的灵[b]呢？看，埋葬你丈夫的那些人的脚就在门口，他们要把你抬出去。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 这里的“主的灵”很可能指圣灵；原文没有直接写“圣灵”。
    reason: 说明与使徒行传5:3的关联，同时保留本节属格表达本身的措辞。
lexical_decisions:
- source_word: Τί ὅτι
  choice: 为什么
  rationale: 这一问句结构在此引出责备并询问缘由；“为什么”自然传达其语气，不增添原文没有的解释。
- source_word: συνεφωνήθη ὑμῖν
  choice: 你们彼此商定
  rationale: 被动形式与ὑμῖν结合，表达双方达成一致。“彼此商定”保留共同协议的含义，也不直接强化为较具解释性的“串通”。
- source_word: πειράσαι
  choice: 试探
  rationale: πειράζω可表示试验、考验或试探；此处指企图验证或挑战主的灵是否会察知并施行审判，“试探”符合现代汉语的经文语境，同时保留其负面意味。
- source_word: τὸ πνεῦμα κυρίου
  choice: 主的灵
  rationale: 按属格结构直译，保留其与“主”的关系；结合使徒行传5:3，所指很可能是圣灵，但正文不将原文扩写为“圣灵”。
- source_word: ἰδοὺ
  choice: 看
  rationale: 作为引人注意的语篇标记，“看”简洁、现代，并保留紧迫感。
- source_word: οἱ πόδες
  choice: 脚
  rationale: 原文明确说“脚”，形成生动而不祥的画面；不改写为“脚步声”或仅说“人已经到了”。
- source_word: τῶν θαψάντων
  choice: 埋葬……的那些人
  rationale: 分词指刚埋葬亚拿尼亚的人；译文不额外加入原文未明说的“男人”。
- source_word: τὸν ἄνδρα σου
  choice: 你丈夫
  rationale: ἀνήρ依此处夫妻关系的上下文明确指“丈夫”。
- source_word: ἐπὶ τῇ θύρᾳ
  choice: 在门口
  rationale: 表达他们已近在入口处，符合现代汉语习惯。
- source_word: ἐξοίσουσίν σε
  choice: 他们也要把你抬出去
  rationale: ἐκφέρω意为带出或抬出；埋葬语境使“抬出去”自然呈现死亡的暗示，同时不增译“尸体”。
theological_decisions:
- issue: “主的灵”的所指
  choice: 保留“主的灵”，让上下文表明其很可能指圣灵
  alternative: 直接译作“圣灵”，或理解为主属灵的临在
  rationale: 使徒行传5:3明确提到圣灵，支持此处同一所指；但原文在本节写的是“主的灵”，因此正文保留原有措辞，不作解释性扩写。
- issue: 彼得指控的力度
  choice: 译作“彼此商定”
  alternative: 译作“彼此串通”或“合谋”
  rationale: 上下文显明二人共同欺骗，指控十分严厉；然而συμφωνέω本身首先表示达成一致，因此由上下文承担其罪责力度，不把动词过度解释为“合谋”。
- issue: “试探”主的灵的含义
  choice: 保留“试探”，不具体解释他们企图验证什么
  alternative: 扩译为“试试看主的灵是否知道”或“挑战主的灵”
  rationale: 原文保留了行为方式与目的之间的张力；直译可避免把一种合理推断写进正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“彼此商定”保持责备语气但不过度定性；保留“脚已经在门口”这一略带闪语色彩的生动画面，以传达原文突然而不祥的效果。
