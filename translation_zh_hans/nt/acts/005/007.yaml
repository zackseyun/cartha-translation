base_translation:
  language: en
  yaml_path: translation/nt/acts/005/007.yaml
  text: After an interval of about three hours, his wife came in, not knowing what had happened.
translation:
  language: zh_hans
  text: 大约过了三个小时，他的妻子进来，还不知道所发生的事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: 过了
  rationale: Ἐγένετο在这里与时间间隔结构合用，推进叙事，并非表达“成为”；δέ是轻微的承接连词。汉语用“过了”自然承接上文，无须另加生硬的“于是”或“现在”。
- source_word: ὡς ὡρῶν τριῶν διάστημα
  choice: 大约……三个小时
  rationale: διάστημα表示一段间隔时间，ὡς与数量连用在此表达约数；译作“大约过了三个小时”既保留近似性，也符合现代汉语叙事习惯。
- source_word: ἡ γυνὴ αὐτοῦ
  choice: 他的妻子
  rationale: 上下文明确指亚拿尼亚的配偶，因此γυνή在此应译作“妻子”，而不是泛指“女人”。
- source_word: μὴ εἰδυῖα
  choice: 还不知道
  rationale: 该分词描述她进来时所处的无知状态；“还不知道”自然表达与主句同时存在的状态，并承接此前已经发生的事。
- source_word: τὸ γεγονὸς
  choice: 所发生的事
  rationale: 完成时分词名词化，指此前已经发生的事件；“所发生的事”保留其概括性，不额外明说亚拿尼亚之死。
- source_word: εἰσῆλθεν
  choice: 进来
  rationale: εἰσέρχομαι表示进入；依叙事视角译作“进来”自然、准确。
theological_decisions: []
