id: ACT.5.21
reference: Acts 5:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἀκούσαντες δὲ εἰσῆλθον ὑπὸ τὸν ὄρθρον εἰς τὸ ἱερὸν καὶ ἐδίδασκον. Παραγενόμενος δὲ ὁ ἀρχιερεὺς καὶ οἱ σὺν αὐτῷ συνεκάλεσαν τὸ συνέδριον καὶ πᾶσαν τὴν γερουσίαν τῶν υἱῶν Ἰσραήλ, καὶ ἀπέστειλαν εἰς τὸ δεσμωτήριον ἀχθῆναι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/021.yaml
  text: When they heard this[a], they entered the temple courts at daybreak and were teaching. But when the high priest arrived, and those with him, they called together the Sanhedrin and the whole council of the sons of Israel, and sent to the prison to have them brought.
translation:
  language: zh_hans
  text: 他们听见这话，就在黎明时进入圣殿院中，正在教导。大祭司和同他一起的人到了，就召集公议会和以色列子孙的全体长老团[a]，又派人到监牢去，把他们带来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以色列子孙的全体长老团”也可译作“以色列的全体长老团”或“以色列的整个长老团”。这里也可能是对“公议会”的进一步说明，而不一定另指一个完全不同的团体。
    reason: 保留γερουσία的集体性译法选择，以及它与前面的συνέδριον之间可能存在的同位或扩充关系。
lexical_decisions:
- source_word: ἀκούσαντες
  choice: 他们听见这话
  rationale: 不定过去时分词在此表示先于主句的动作，并回指上一节天使的吩咐；“听见这话”自然且不把“听见”进一步解释为“听从”。
- source_word: ὑπὸ τὸν ὄρθρον
  choice: 在黎明时
  rationale: 这是表示清晨破晓时分的时间短语；译文简洁地保留其时间指向。
- source_word: εἰς τὸ ἱερόν
  choice: 进入圣殿院内
  rationale: ἱερόν指整个圣殿范围，而不是专指圣所的ναός；“圣殿院内”既便于理解，也保留这一区别。
- source_word: ἐδίδασκον
  choice: 教导众人
  rationale: 未完成时表示当时持续进行的教导；汉语结合叙事语境自然表达其延续性。“众人”为使不及物式表达在汉语中自然，并未限定具体听众。
- source_word: Παραγενόμενος
  choice: 到了
  rationale: 不定过去时分词引出随后发生的事件；“到了”自然表达大祭司一行抵达的时间关系。
- source_word: οἱ σὺν αὐτῷ
  choice: 同他一起的人
  rationale: 直译陪同大祭司的人，不擅自确定他们更具体的身份。
- source_word: συνεκάλεσαν
  choice: 召集
  rationale: 准确表达召来并使议事群体聚集之意，符合现代汉语正式叙事语体。
- source_word: τὸ συνέδριον
  choice: 公议会
  rationale: 在本语境中指犹太人的最高议事机构；采用现代中文圣经读者较熟悉的历史称谓。
- source_word: πᾶσαν τὴν γερουσίαν τῶν υἱῶν Ἰσραήλ
  choice: 以色列子孙的全体长老
  rationale: γερουσία在此指长老组成的团体；“全体长老”比“元老院”自然，也保留该短语与“公议会”并列或补充说明的可能性。“以色列子孙”保留原文传统的亲属—民族称谓。
- source_word: τὸ δεσμωτήριον
  choice: 监牢
  rationale: 准确、自然地表达拘禁人的处所。
- source_word: ἀχθῆναι αὐτούς
  choice: 要把他们带来
  rationale: 被动不定式表示派人前往监牢的目的；汉语用使役结构自然表达“使他们被带来”，并保留代词所指由上下文确定。
theological_decisions:
- issue: τῶν υἱῶν Ἰσραήλ的民族称谓
  choice: 以色列子孙的
  alternative: 以色列的；以色列人的
  rationale: 原文采用字面为“以色列众子”的传统民族称谓。正文保留其亲属性表达，不将其无声改写为一般国族形容语；脚注提供更符合现代汉语习惯的整体译法。
- issue: 公议会与全体长老之间的关系
  choice: 以“和”并列，保留两个受词的表面句法
  alternative: 把后者理解为前者的补充说明，即“公议会，也就是以色列的全体长老”
  rationale: 原文以καί连接τὸ συνέδριον和πᾶσαν τὴν γερουσίαν，二者可能指两个有重叠的群体，也可能是扩充或同位式说明。正文不替原文消除这种张力，脚注提示另一种理解。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“圣殿院内”区分ἱερόν所指的圣殿范围与圣所本身；“公议会”保留历史语境。句法按两个连续场景展开，并用“又”自然连接召集议会与派人提押的动作。
