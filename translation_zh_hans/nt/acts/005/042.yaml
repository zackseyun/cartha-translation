  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: πᾶσάν τε ἡμέραν ἐν τῷ ἱερῷ καὶ κατ’ οἶκον οὐκ ἐπαύοντο διδάσκοντες καὶ εὐαγγελιζόμενοι ⸂τὸν χριστὸν Ἰησοῦν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/042.yaml
  text: And every day[a], in the temple and from house to house, they did not stop teaching and proclaiming the good news that Jesus is the Messiah.
translation:
  language: zh_hans
  text: 他们天天在圣殿里，也在各家中，不住地教导人，传扬耶稣是弥赛亚的好消息[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“传扬耶稣这位弥赛亚的好消息”，也可理解为“传扬耶稣为弥赛亚”。
    reason: 原文τὸν χριστὸν Ἰησοῦν可按宾语短语较形式化地表达，也可把它理解为所宣告的内容。
lexical_decisions:
- source_word: πᾶσάν τε ἡμέραν
  choice: 天天
  rationale: 表达时间延续和惯常反复之意，也以“也”承接上文，符合现代汉语叙事。
- source_word: ἐν τῷ ἱερῷ
  choice: 在圣殿里
  rationale: ἱερόν指圣殿建筑群，而非仅指圣所；“在圣殿里”简洁自然，并避免无根据地限缩为某一院落。
- source_word: κατ’ οἶκον
  choice: 在各家中
  rationale: 保留κατά配单数名词所具有的分配意味，表明活动在一户户人家中进行，同时避免把它过度具体化为现代意义的“登门逐户传道”。
- source_word: οὐκ ἐπαύοντο
  choice: 不住地
  rationale: 反映未完成时所表达的持续状态；现代汉语中自然有力，并与“天天”共同保留原文的强调。
- source_word: διδάσκοντες
  choice: 教导人
  rationale: “教导”准确表达持续施教；补出汉语语法所需的泛指受事“人”，不限定具体对象。
- source_word: εὐαγγελιζόμενοι
  choice: 传扬……的好消息
  rationale: 兼顾动词“宣告好消息”的词义和福音性内涵，比单用宗教术语“传福音”更透明。
- source_word: τὸν χριστὸν Ἰησοῦν
  choice: 耶稣是弥赛亚
  rationale: 将Χριστός作为称号译出其含义“弥赛亚”；在εὐαγγελιζόμενοι之后，以内容从句自然表达宣告的核心主张，同时用脚注保留宾语短语的另一种句法呈现。
theological_decisions:
- issue: Χριστός的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处Χριστός明显作为称号，指出耶稣的受膏者身份；“弥赛亚”保留该称号的语义，避免将它当作姓名的一部分。
- issue: τὸν χριστὸν Ἰησοῦν在εὐαγγελιζόμενοι之后的句法功能
  choice: 将其表达为所传好消息的内容：“耶稣是弥赛亚”
  alternative: 将其作为直接宾语短语：“传扬弥赛亚耶稣的好消息”
  rationale: 原文可理解为宣告内容，也可较形式化地保留为宾语短语。正文采用自然清楚的内容表达，脚注保存真实的句法余地。
translation_notes:
  register: 采用现代、庄重而通俗的叙事语体。“天天……不住地”保留原文对持续行动的双重强调；“在各家中”既自然，也保留分配性表达的范围，不把场景窄化为单一家庭或现代式逐户探访。
