  text: And he said to them[a], “Men of Israel, be careful what you are about to do with these men.”
translation:
  language: zh_hans
  text: 他对他们说：“以色列人哪，你们要谨慎考虑将要怎样对待这些人。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以色列人哪，你们自己要当心，关于这些人将要做什么。”
    reason: 保留προσέχετε ἑαυτοῖς的反身警戒意味，并反映ἐπὶ τοῖς ἀνθρώποις τούτοις与τί μέλλετε πράσσειν可作较贴近原文语序的表达。
lexical_decisions:
- source_word: εἶπέν τε πρὸς αὐτούς
  choice: 他对他们说
  rationale: τέ仅作轻微的叙事连接；现代汉语不必机械译出“并且”。πρὸς αὐτούς与“说”连用，表示话语对象，译为“对他们说”自然准确。
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: 以色列诸位
  rationale: 这是对以色列男性议员的正式称呼。“以色列诸位”既符合现代汉语的庄重称谓，也由语境保留其男性听众所指，避免生硬的“以色列男人们”。
- source_word: προσέχετε ἑαυτοῖς
  choice: 请谨慎考虑
  rationale: 该命令式带反身与警戒意味，要求听众约束自己、慎重行事。结合后面的间接疑问句，译为“请谨慎考虑”最为自然，并保留劝诫语气。
- source_word: ἐπὶ τοῖς ἀνθρώποις τούτοις
  choice: 处置这些人
  rationale: ἐπί加与格在此指出谨慎所涉及的对象；结合πράσσειν，汉语用“处置这些人”自然表达对他们采取行动，同时不额外强化为“攻击”或“反对”。
- source_word: τί μέλλετε πράσσειν
  choice: 要怎样处置
  rationale: μέλλω加不定式表达即将或有意采取的行动，τί询问行动内容。译为“要怎样处置”在现代汉语中兼顾未来意向和警戒语气。
