  rationale: 将不够自然且可能引起术语误解的“公议会”改为“议会”，并以脚注说明其具体所指。将“带来”微调为“带进来”，使汉语叙事中的场景转换更清楚；其余句法与用词保留原文的动作次序、司法场景和正式语体。
