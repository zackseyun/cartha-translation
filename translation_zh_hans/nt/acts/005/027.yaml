  yaml_path: translation/nt/acts/005/027.yaml
  text: After bringing them in, they stood them before the council, and the high priest questioned them.
translation:
  language: zh_hans
  text: 他们把使徒带进来后，让他们站在议会[a]面前。大祭司询问他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊词指犹太人的统治和审判议会，传统上称为“犹太公会”（Sanhedrin）。
    reason: 说明此处“议会”的具体历史所指，并保留传统名称作为参考。
lexical_decisions:
- source_word: Ἀγαγόντες
  choice: 把使徒带来后
  rationale: 不定过去时主动分词表示先于主句动作发生的时间关系。“带来后”自然地呈现先后次序；按上下文将代词所指明示为“使徒”，避免现代汉语中连续两个“他们”造成歧义。
- source_word: δὲ
  choice: 就
  rationale: δέ在这里是轻微的叙事连接词。“就”结合前面的“后”，自然推进叙事，不赋予原文没有的强烈转折意味。
- source_word: ἔστησαν
  choice: 叫他们站在……面前
  rationale: ἵστημι在此为及物用法，意为使人站立或将人置于某处。此译保留“站”的具体画面，也符合受审场景中的现代汉语表达。
- source_word: ἐν τῷ συνεδρίῳ
  choice: 在公议会面前
  rationale: συνέδριον在此指犹太人的统治及审判议会。“公议会”是简明而可识别的译名；介词ἐν按与ἔστησαν搭配后的实际空间及司法关系译作“在……面前”。
- source_word: ἐπηρώτησεν
  choice: 询问
  rationale: ἐπερωτάω意为问或询问。在司法语境中，“询问”比普通的“问”正式，又不像“审讯”或“盘问”那样额外强化语气。
- source_word: ὁ ἀρχιερεὺς
  choice: 大祭司
  rationale: 准确对应此处单数的ἀρχιερεύς，指主持问话的大祭司。
theological_decisions:
- issue: συνέδριον的译法
  choice: 公议会
  alternative: 议会；音译作“犹太公会”
  rationale: 采用能表达该词“议事、审判机构”含义的传统中文名称，同时用脚注说明其具体所指；不把音译式专名当作唯一可能的词义。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“叫他们站在……面前”保留原文具体动作和司法场景；分为两句，使动作次序与主语转换清晰。
