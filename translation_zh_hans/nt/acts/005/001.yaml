  text: Ἀνὴρ δέ τις Ἁνανίας ὀνόματι σὺν Σαπφίρῃ τῇ γυναικὶ αὐτοῦ ἐπώλησεν κτῆμα
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/001.yaml
  text: But a man named Ananias[a], with Sapphira his wife, sold a piece of property.
translation:
  language: zh_hans
  text: 可是，有一个名叫亚拿尼亚的人，和他的妻子撒非喇一起卖了一处产业[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“一份财产”；希腊语这个词可泛指所有物，也可指一处不动产。
    reason: 说明κτῆμα的词义范围，避免正文中的“产业”被理解为只指某一种土地或房产。
lexical_decisions:
- source_word: Ἀνὴρ δέ τις
  choice: 可是，有一个人
  rationale: Ἀνήρ在这里是叙事中引入人物的“人”，τις表示不定指；δέ承接上文巴拿巴的正面事例，并带出下文的对照，因此译作“可是”。
- source_word: Ἁνανίας ὀνόματι
  choice: 名叫亚拿尼亚
  rationale: ὀνόματι构成“名叫／名为”的习语；人名Ἁνανίας按现代中文圣经通行形式音译为“亚拿尼亚”。
- source_word: σὺν Σαπφίρῃ τῇ γυναικὶ αὐτοῦ
  choice: 和妻子撒非喇一起
  rationale: σύν表示伴同；γυνή在此有物主限定，明确指“妻子”。Σαπφίρη按通行中文形式音译为“撒非喇”。
- source_word: ἐπώλησεν
  choice: 卖了
  rationale: πωλέω的不定过去时在叙事中表示已经发生的出售行为，现代汉语自然译为“卖了”。
- source_word: κτῆμα
  choice: 一处产业
  rationale: κτῆμα可指所有物或不动产；结合使徒行传4—5章出售田产的语境，“一处产业”既具体自然，又避免擅自限定为田地、房屋或庄园。词义较宽的一面以脚注说明。
theological_decisions:
- issue: 与上文巴拿巴事例的叙事对照
  choice: 将δέ译为“可是”
  alternative: 可译为“这时”或“而”以弱化对照
  rationale: 上下文把巴拿巴的奉献与亚拿尼亚夫妇随后发生的事件并置；“可是”保留δέ在此处温和但清楚的转折作用，同时不提前加入对人物动机的判断。
- issue: 妻子在出售行为中的参与程度
  choice: 译作“他和妻子撒非喇一起卖了”
  alternative: 可较形式化地译作“亚拿尼亚连同他的妻子撒非喇卖了”
  rationale: σύν明确表示伴同，却没有在本节细说二人各自承担的角色；“一起”保留共同参与的基本含义，不进一步界定责任或行动细节。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“可是”清楚连接上文的对照；补出代词“他”以使长主语后的句子更符合现代汉语习惯，不改变原文指涉。脚注标记紧接其所解释的“产业”。
