  text: παραγενόμενος δέ τις ἀπήγγειλεν αὐτοῖς ὅτι Ἰδοὺ οἱ ἄνδρες οὓς ἔθεσθε ἐν τῇ φυλακῇ εἰσὶν ἐν τῷ ἱερῷ ἑστῶτες καὶ διδάσκοντες τὸν λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/025.yaml
  text: But someone came and reported to them[a], “Look, the men whom you put in prison are standing in the temple and teaching the people.”
translation:
  language: zh_hans
  text: 这时，有人来向他们报告说：“看哪！你们关进监牢的那些人，正站在圣殿里[a]教导百姓。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“圣殿院区里”；希腊语ἱερόν指整个圣殿建筑群，并非专指内部的圣所。
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενόμενος δέ τις
  choice: 这时，有人来
  rationale: 以自然的现代汉语表达不定主语及来临动作；“这时”体现δέ所标示的叙事推进和局势转折，不作过强对比。
- source_word: ἀπήγγειλεν αὐτοῖς
  choice: 向他们报告说
  rationale: 保留代词“他们”，不把上下文所指的议会成员明说出来；“报告”符合向当权者传递消息的语境。
- source_word: Ἰδοὺ
  choice: 看哪
  rationale: 保留原文引人注意和表达惊异的语气；“看哪”庄重而在现代圣经语体中仍清楚可懂。
- source_word: οἱ ἄνδρες οὓς ἔθεσθε ἐν τῇ φυλακῇ
  choice: 你们关进监牢的那些人
  rationale: 按汉语关系结构重组句序；“关进监牢”自然传达ἔθεσθε与地点补语的合义，“那些人”明确回指先前被囚者。
- source_word: εἰσὶν ἐν τῷ ἱερῷ ἑστῶτες
  choice: 正站在圣殿里
  rationale: “正”自然体现εἰσὶν与现在分词所描写的当下状态；“圣殿”正文保持传统简洁译法，并以脚注说明ἱερόν的范围。
- source_word: διδάσκοντες τὸν λαόν
  choice: 教导百姓
  rationale: 准确表达持续进行的教导行动；“百姓”符合λαός在本段所指的民众，并保持庄重自然的语体。
