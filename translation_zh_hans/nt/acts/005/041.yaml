  text: οἱ μὲν οὖν ἐπορεύοντο χαίροντες ἀπὸ προσώπου τοῦ συνεδρίου ὅτι ⸂κατηξιώθησαν ὑπὲρ τοῦ ὀνόματος⸃ ἀτιμασθῆναι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/041.yaml
  text: So they went on their way from the presence of the council[a], rejoicing that they had been counted worthy to be dishonored for the Name.
translation:
  language: zh_hans
  text: 于是，他们离开公议会，欢欢喜喜，因为自己竟被认为有资格为这名[a]受辱。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作“这名”，是出于敬意而省略具体所指的表达；按上下文，所指为耶稣的名。
    reason: 说明原文对“这名”的敬称式绝对用法及其上下文所指，避免把解释性明确化当作字面异译。
lexical_decisions:
- source_word: ἐπορεύοντο
  choice: 离开
  rationale: 未完成时在叙事中描写他们从公议会那里离去；中文用“离开”自然简洁，并与介词短语“从……面前”顺畅衔接。
- source_word: χαίροντες
  choice: 心里欢喜
  rationale: 现在分词表示离开时伴随的状态；“心里欢喜”保留其动态和情感色彩，也符合现代汉语表达。
- source_word: ἀπὸ προσώπου τοῦ συνεδρίου
  choice: 从公议会面前
  rationale: 保留“从……面前”的临在意象，同时以“公议会”指当时审理使徒的犹太最高议事机构。
- source_word: κατηξιώθησαν
  choice: 被算为配得
  rationale: 保留不定过去时被动语态及其评判意味，不明说评判者是谁；“竟”传达此处受辱反被视为殊荣的反常张力。
- source_word: ὑπὲρ
  choice: 为
  rationale: 此处表示受辱所关联或缘由的对象；“为”简洁自然，也不把含义过度限定为代替。
- source_word: τοῦ ὀνόματος
  choice: 这名
  rationale: 原文绝对使用“这名／那名”，没有明说“耶稣”；“这名”承接上下文，同时保留原文敬称式的含蓄表达。
- source_word: ἀτιμασθῆναι
  choice: 受辱
  rationale: 准确表达被动承受羞辱、名誉受损的意思，并保留荣辱框架，与“配得”形成原文刻意的张力。
theological_decisions:
- issue: “这名”所指为何
  choice: 正文保留“这名”，不直接补出“耶稣的名”
  alternative: 为耶稣的名；为他的名
  rationale: 希腊文只写 τοῦ ὀνόματος（“这名／那名”），上下文显然指向耶稣，但此节本身保持敬称式省略。正文保留省略，脚注说明所指，既清楚又不消除原文的含蓄。
- issue: 谁认定使徒“配得”
  choice: 保留被动式“被算为配得”，不明说施事者
  alternative: 被上帝算为配得
  rationale: 原文没有明说被动动作的施事者。虽然语境可理解为上帝的认可，译文不应把这一推断直接写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“被算为配得为这名受辱”刻意保留原文中“配得”与“受辱”并置的神学张力；“公议会”采用中文圣经与历史叙述中常见的机构名称。
