  text: ὁ θεὸς τῶν πατέρων ἡμῶν ἤγειρεν Ἰησοῦν, ὃν ὑμεῖς διεχειρίσασθε κρεμάσαντες ἐπὶ ξύλου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/030.yaml
  text: The God of our fathers raised up Jesus[b][a], whom you killed by hanging on a tree.
translation:
  language: zh_hans
  text: 我们祖先的神使耶稣复活[a]；你们却把他挂在木头上[b]杀害了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“兴起耶稣”。这里的动词可以指复活，但本节希腊原文没有明说“从死人中”。
    reason: lexical_alternative
  - marker: b
    text: 或译“十字架”。希腊原文作“木头”，可能呼应《申命记》21:23。
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: 我们祖先的神
  rationale: 保留以色列圣约历史的惯用表达；现代汉语中“祖先”比直译“父辈”更自然，也可涵盖历代先祖。
- source_word: ἤγειρεν
  choice: 使……复起
  rationale: ἐγείρω在上下文中明显可指复活，但本节没有明说“从死人中”；“复起”既让复活含义可闻，又不补入原文没有的成分。
- source_word: Ἰησοῦν
  choice: 耶稣
  rationale: 采用现代中文圣经传统通行的人名译法。
- source_word: διεχειρίσασθε
  choice: 杀害了
  rationale: 该动词在此表示以暴力手段置人于死地；“杀害”直接清楚，并与随后说明手段的分词短语自然衔接。
- source_word: κρεμάσαντες ἐπὶ ξύλου
  choice: 把他挂在木头上
  rationale: 保留分词所表达的手段，并按字面译出ξύλον，使申命记21:23的潜在呼应不被“十字架”这一解释性译法遮蔽。
theological_decisions:
- issue: ἤγειρεν是否应明确译成“使他从死人中复活”
  choice: 使耶稣复起
  alternative: 使耶稣从死人中复活／兴起耶稣
  rationale: 上下文强烈指向复活，但原文在本节未出现“从死人中”；正文保留词义张力，脚注说明可能含义。
- issue: ξύλον应直译还是解释为十字架
  choice: 木头
  alternative: 十字架／树木
  rationale: 原文不用σταυρός而用ξύλον；“木头”保留其词汇形式及对申命记咒诅经文的可能呼应，同时脚注交代所指。
translation_notes:
  register: 采用自然、庄重的现代标准普通话。“却”呈现两小句之间神使耶稣复起与听众杀害耶稣的鲜明对照。“复起”略带经文语体，但仍易懂，并用于避免把原文未明说的“从死人中”直接补入正文。
