  text: καὶ τὰ νῦν λέγω ὑμῖν, ἀπόστητε ἀπὸ τῶν ἀνθρώπων τούτων καὶ ⸀ἄφετε αὐτούς· (ὅτι ἐὰν ᾖ ἐξ ἀνθρώπων ἡ βουλὴ ⸀αὕτη ἢ τὸ ἔργον τοῦτο, καταλυθήσεται,
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/038.yaml
  text: And now I tell you[a], keep away from these men and leave them alone; for if this plan or this work is from men, it will be overthrown[b],
translation:
  language: zh_hans
  text: 如今我告诉你们：你们要远离这些人，任凭他们吧；因为这计划或这行动若是出于人[a]，就必被摧毁[b]；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“源于人”或“由人而来”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“就会被毁灭”或“就会归于无有”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ νῦν
  choice: 至于现在
  rationale: 这是引出当前劝告的惯用时间表达；译作“至于现在”既自然，也保留了话语转换的作用。
- source_word: ἀπόστητε ἀπὸ τῶν ἀνθρώπων τούτων
  choice: 不要管这些人
  rationale: 此处命令的实际意思是与这些人拉开距离、不再介入或干涉；结合下句“任凭他们吧”，这样译成现代汉语较为顺畅。
- source_word: ἄφετε αὐτούς
  choice: 任凭他们吧
  rationale: 语境所表达的是停止干涉或追究他们，而不只是让他们离开；“任凭他们吧”传达了这一语用含义。
- source_word: ὅτι
  choice: 因为
  rationale: 引出迦玛列提出这项劝告的理由。
- source_word: ἐὰν ᾖ ἐξ ἀνθρώπων
  choice: 若是出于人
  rationale: ἐξ表示来源；“出于人”简洁保留了本节与下一节“出于神”之间的对照，同时“人”在汉语中可泛指人类。
- source_word: βουλή
  choice: 计划
  rationale: 可指谋划、意图或目的；“计划”清楚自然，并可与后面的“行动”相区分。
- source_word: ἔργον
  choice: 行动
  rationale: 此处指实际进行的事业或活动；“行动”比字面上的“工作”更适合这一运动及其作为的语境。
- source_word: καταλυθήσεται
  choice: 就必被摧毁
  rationale: 保留将来被动形式，并表达瓦解、毁坏或归于无有的含义。
theological_decisions:
- issue: ἐξ ἀνθρώπων所表达的来源
  choice: 出于人
  alternative: 源于人；出于人意
  rationale: 原文将人的来源与下一节神的来源相对照。译文不把它限定为某些男性，也不额外解释为人的意志，从而保留原文简洁而广泛的来源含义。
- issue: 计划与行动若出于人时的结局
  choice: 就必被摧毁
  alternative: 就会自行瓦解；终必归于无有
  rationale: 原文是将来被动语态，没有明说施事者。译文保留被动，不擅自断定它必然自行消亡或明确由神摧毁。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“不要管这些人，任凭他们吧”避免生硬直译，并呈现停止干涉的语境含义；分号和条件句结构保留原文论证尚未结束的感觉，因为句意延续至下一节。
