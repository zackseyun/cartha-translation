  yaml_path: translation/nt/acts/005/022.yaml
  text: But when the officers arrived, they did not find them in the prison; so they returned and reported,
translation:
  language: zh_hans
  text: 可是，差役到了监牢，没有在那里找到他们，就回来报告说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραγενόμενοι
  choice: 到了
  rationale: 该分词说明差役抵达监牢；“到了”自然简洁，并保留叙事中的时间先后关系。
- source_word: ὑπηρέται
  choice: 差役
  rationale: 这里指受犹太领袖差遣、执行公务的人员，并非一般仆人；“差役”既体现其职务身份，也避免把原文进一步具体化为“圣殿警卫”。
- source_word: οὐχ εὗρον
  choice: 没有……找到
  rationale: 准确表达在预期地点搜寻却未见其人的叙事情境，符合现代汉语习惯。
- source_word: ἐν τῇ φυλακῇ
  choice: 在那里
  rationale: 前句已明确说“监牢”，用“在那里”自然承接，同时仍指向原文带定冠词的特定监牢，避免中文重复生硬。
- source_word: ἀναστρέψαντες
  choice: 回来
  rationale: 语境表明他们从监牢返回差遣者那里；“回来”简洁地表达这一动作。
- source_word: ἀπήγγειλαν
  choice: 报告说
  rationale: 该动词表示带回并陈述消息；“报告说”符合公务语境，也自然引出下一节的直接引语。
- source_word: δέ
  choice: 可是／于是
  rationale: 第一个 δέ 突出预期与结果之间的反差，译作“可是”；第二个 δέ 主要连接后续动作，结合事件顺序译作“于是”。
theological_decisions: []
translation_notes:
