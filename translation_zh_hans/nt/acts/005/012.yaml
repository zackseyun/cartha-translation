  text: Διὰ δὲ τῶν χειρῶν τῶν ἀποστόλων ἐγίνετο σημεῖα καὶ τέρατα ⸂πολλὰ ἐν τῷ λαῷ⸃· καὶ ἦσαν ὁμοθυμαδὸν ⸀ἅπαντες ἐν τῇ Στοᾷ Σολομῶντος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/012.yaml
  text: Many signs and wonders were being done among the people through the hands of the apostles[b][a], and they were all together in Solomon’s Portico.
translation:
  language: zh_hans
  text: 有许多神迹奇事借着使徒的手在民众中发生。众人都同心合意[a]地在所罗门柱廊内[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“同心一致”。原文既表达共同心志，也可包含共同聚集的情形。
    reason: lexical_alternative
  - marker: b
    text: “所罗门柱廊”也可译作“所罗门廊”，指圣殿区域内有顶的柱廊。
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ ... τῶν χειρῶν τῶν ἀποστόλων
  choice: 借着使徒的手
  rationale: 保留希腊文具体的“手”这一表达，并准确体现 διά 加属格所表达的凭借或施行媒介。
- source_word: δὲ
  choice: 不单独译出
  rationale: 此处主要承接叙事，并非强烈转折；现代汉语无需机械加入“现在”或“但是”。句间推进已由上下文自然体现。
- source_word: ἐγίνετο
  choice: 不断发生
  rationale: 未完成过去时表示过去一段时间内持续或反复出现的活动；“不断发生”比单纯“发生”更能体现这一体貌。
- source_word: σημεῖα καὶ τέρατα
  choice: 神迹奇事
  rationale: 采用简明而通行的对应表达，既保留“记号性作为”和“令人惊异之事”的组合，也不额外添加原文没有的解释。
- source_word: πολλὰ
  choice: 许多
  rationale: 自然地修饰成组出现的“神迹奇事”，表达数量众多。
- source_word: ἐν τῷ λαῷ
  choice: 在民众中
  rationale: 表达这些事发生的范围；“民众”在现代汉语中自然，也不把 λαός 的所指进一步限定为原文未明说的族群。
- source_word: ὁμοθυμαδὸν
  choice: 同心聚在
  rationale: “同心”体现共同心志，“聚在”结合所在地点表达共同聚集，兼顾该副词在本句中的双重语感。
- source_word: ἅπαντες
  choice: 众人都
  rationale: 表达全体性，同时不在译文中明确限定究竟仅指使徒还是更广泛的信徒群体。
- source_word: Στοᾷ Σολομῶντος
  choice: 所罗门廊下
  rationale: στοά 指有柱的有顶长廊；“廊下”自然表达人在该建筑空间中，也符合现代中文叙事习惯。
theological_decisions:
- issue: “众人都”所指的群体
  choice: 保留隐含所指，不限定为使徒或全体信徒
  alternative: 明确译作“使徒们都”或“所有信徒都”
  rationale: 希腊文没有明说 ἅπαντες 的先行对象。译作“众人都”保存其开放性，避免在翻译中解决原文未明确解决的问题。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“借着使徒的手”有意保留原文具体意象；“不断发生”体现未完成时的持续或反复性。“众人都”保留隐含主语所指的歧义。
