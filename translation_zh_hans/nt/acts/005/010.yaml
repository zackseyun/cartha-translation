  text: ἔπεσεν δὲ παραχρῆμα ⸀πρὸς τοὺς πόδας αὐτοῦ καὶ ἐξέψυξεν· εἰσελθόντες δὲ οἱ νεανίσκοι εὗρον αὐτὴν νεκράν, καὶ ἐξενέγκαντες ἔθαψαν πρὸς τὸν ἄνδρα αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/010.yaml
  text: Then she immediately fell at his feet and died. When the young men came in, they found her dead, and they carried her out and buried her beside her husband.
translation:
  language: zh_hans
  text: 她立刻倒在彼得脚前，断了气。年轻人进来，见她已经死了，就把她抬出去，埋在她丈夫旁边。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραχρῆμα
  choice: 立刻
  rationale: 准确表达事情当即发生，符合现代汉语叙事习惯。
- source_word: πρὸς τοὺς πόδας αὐτοῦ
  choice: 在彼得脚前
  rationale: 代词所指由上文明确是彼得；译出姓名可使单节中文自然清楚，同时保留方位关系。
- source_word: ἐξέψυξεν
  choice: 断了气
  rationale: 原词直指生命气息终止；“断了气”自然、庄重，也比笼统的“死了”更贴近原文措辞。
- source_word: οἱ νεανίσκοι
  choice: 年轻人
  rationale: 保留对这些人的年龄描述，不额外赋予职分。
- source_word: πρὸς τὸν ἄνδρα αὐτῆς
  choice: 在她丈夫旁边
  rationale: 此处πρός表达安葬位置邻近；现代汉语用“旁边”清楚自然。
theological_decisions:
- issue: ἐξέψυξεν是否仅译为“死了”
  choice: 断了气
  alternative: 死了
  rationale: 选择保留原词关于气息终止的具体表达，但不据此引申任何灵魂或死亡状态的教义。
- issue: αὐτοῦ的指称
  choice: 彼得
  alternative: 他
  rationale: 上下文指向彼得没有实质歧义；单节呈现时明说姓名可避免中文代词指向不清，不改变叙事内容。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。保留原文连续叙事的节奏，不添加因果解释或神学评断。
