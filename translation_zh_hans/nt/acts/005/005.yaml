id: ACT.5.5
reference: Acts 5:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἀκούων δὲ ὁ Ἁνανίας τοὺς λόγους τούτους πεσὼν ἐξέψυξεν· καὶ ἐγένετο φόβος μέγας ἐπὶ πάντας τοὺς ⸀ἀκούοντας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/005.yaml
  text: But when Ananias heard these words[a], he fell down and died. And great fear came upon all who heard.
translation:
  language: zh_hans
  text: 亚拿尼亚一听见这些话，就倒下断了气。[a] 所有听见的人都非常惧怕。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “断了气”也可译作“死了”或“咽了气”。原词带有气息离去、生命终止的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούων δὲ ὁ Ἁνανίας
  choice: 亚拿尼亚一听见
  rationale: 现在时分词在这里表达时间背景，并与随即发生的动作紧密相连；“一听见”自然传达即时性。δέ主要推动叙事，汉语无需机械译出连接词。
- source_word: τοὺς λόγους τούτους
  choice: 这些话
  rationale: 所指是彼得刚才说的话；“这些话”准确、自然。
- source_word: πεσὼν
  choice: 就倒下
  rationale: 保留身体倒下的具体意象，并用“就”表现该动作与听见彼得的话之间紧接发生的关系。
- source_word: ἐξέψυξεν
  choice: 断了气
  rationale: 该动词本义带有气息离去、停止呼吸而死的意象；“断了气”在现代汉语中自然、明确地表示死亡，又比单译“死了”更贴近原词形象。
- source_word: ἐγένετο φόβος μέγας ἐπὶ πάντας
  choice: 所有……的人都非常惧怕
  rationale: 把希腊语“极大的惧怕临到所有人”的结构转化为自然汉语，同时保留强烈程度与涵盖全体的范围。
- source_word: τοὺς ἀκούοντας
  choice: 听见的人
  rationale: 实词化分词指所有听见此事或消息的人；原文没有明说所听见的宾语，因此译文也不加限定。
- source_word: Ἁνανίας
  choice: 亚拿尼亚
  rationale: 采用现代中文圣经中通行的人名音译。
theological_decisions:
- issue: 亚拿尼亚死亡的机制
  choice: 直述他倒下并断气，不说明死亡由何种具体机制导致
  alternative: 译成“上帝击杀了他”或“他因惊吓而死”
  rationale: 原文只叙述他听见这些话后倒下死亡，没有明确解释是上帝直接击杀、审判导致，还是生理性休克；译文保留这种叙事张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“一听见……就……”清楚呈现动作的紧接关系；“断了气”既通俗易懂，也保留ἐξέψυξεν的呼吸意象。脚注标记置于相关短语之后。
