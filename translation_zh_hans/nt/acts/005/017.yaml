  text: Ἀναστὰς δὲ ὁ ἀρχιερεὺς καὶ πάντες οἱ σὺν αὐτῷ, ἡ οὖσα αἵρεσις τῶν Σαδδουκαίων, ἐπλήσθησαν ζήλου
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/017.yaml
  text: But the high priest rose up[a], and all those with him—that is[b], the party of the Sadducees—and were filled with jealousy.
translation:
  language: zh_hans
  text: 可是，大祭司起来了，和他在一起的众人——就是撒都该派[a]——都满心嫉妒[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“撒都该教派”或“撒都该宗派”。希腊语这个词可指派别、学派或宗派。
    reason: lexical_alternative
  - marker: b
    text: 或译“嫉恨”。这个希腊词也可指“热心”，但这里的上下文倾向于敌对的含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναστὰς
  choice: 起来采取行动
  rationale: 该不定过去时分词在这里惯用于引出果断行动；译作“起来采取行动”既保留叙事推进力，也避免让现代读者误以为只是从座位上站起。
- source_word: δὲ
  choice: 可是
  rationale: 承接上文百姓对使徒的积极反应，表达温和而明确的转折。
- source_word: ὁ ἀρχιερεὺς
  choice: 大祭司
  rationale: 这是该犹太宗教职分在现代汉语中的通行准确译法。
- source_word: πάντες οἱ σὺν αὐτῷ
  choice: 所有跟他一起的人
  rationale: 保留这些人与大祭司结盟、同属一方的关系，不额外断定其具体身份。
- source_word: ἡ οὖσα αἵρεσις τῶν Σαδδουκαίων
  choice: 就是撒都该派的人
  rationale: 该同位语说明前述群体属于撒都该人的派别；“派”自然易懂，也不带后来“异端”一词的教义定罪意味。
- source_word: ἐπλήσθησαν
  choice: 满心
  rationale: 自然表达“被……充满”的希腊语结构，同时保留情绪完全占据他们内心的强度。
- source_word: ζήλου
  choice: 嫉妒
  rationale: ζῆλος可指热心、妒忌或嫉恨；在敌对使徒的语境中，负面意义最合适。
theological_decisions:
- issue: αἵρεσις所指的群体性质
  choice: 派
  alternative: 教派；宗派
  rationale: 这里指第二圣殿时期犹太教内部一个可辨识的群体，并非后世教会语境中被定罪的“异端”；“派”保留社会宗教分群含义而不附加教义判断。
- issue: ζῆλος在本节中的感情色彩
  choice: 嫉妒
  alternative: 嫉恨；热心
  rationale: 该词本身可有正面或负面含义，但此处随后的逮捕行动表明它表达敌意驱动的妒忌；脚注仍提示其词义范围。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“起来采取行动”呈现路加叙事中Ἀναστὰς的惯用推进功能；调整语序，使“大祭司”和同党共同成为后续行动及情绪的主体。所有脚注标记均置于正文相应词语之后。
