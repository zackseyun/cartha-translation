base_translation:
  language: en
  yaml_path: translation/nt/acts/005/029.yaml
  text: But Peter and the apostles answered[a], “We must obey God rather than men.”
translation:
  language: zh_hans
  text: 彼得和众使徒回答说：“我们必须服从上帝，胜过服从人。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπαν
  choice: 回答说
  rationale: 希腊语以分词加限定动词构成叙事中的答话公式；“回答说”在现代汉语中自然，也保留了回应前文命令的功能。
- source_word: δὲ
  choice: （不单独译出）
  rationale: δὲ在此表示轻微转折或话语推进；上下文中的回应关系以及引语本身已自然呈现这一转折，若机械译为“但是”会使中文略显生硬。
- source_word: Πέτρος καὶ οἱ ἀπόστολοι
  choice: 彼得和众使徒
  rationale: “彼得”采用通行译名；“使徒”是此处ἀπόστολοι所指特定群体的通行且准确的称呼。“众”使复数在中文中清楚自然。
- source_word: Πειθαρχεῖν
  choice: 服从
  rationale: πειθαρχέω指顺服具有权柄者；“服从”准确表达权柄与顺从的关系，并适合此处公会命令的语境。
- source_word: δεῖ
  choice: 我们必须
  rationale: δεῖ表达必要性或义务；不定式的隐含主体由说话者构成，译作“我们必须”符合中文表达并与语境一致。
- source_word: θεῷ
  choice: 上帝
  rationale: 采用现代汉语中清楚、庄重的通行称谓，作“服从”的对象。
- source_word: μᾶλλον ἢ
  choice: 而不是
  rationale: 该比较结构在此表示两种权威要求冲突时应选择服从上帝；“而不是”简洁自然地表达这种优先取舍。
- source_word: ἀνθρώποις
  choice: 人
  rationale: ἄνθρωποι在此泛指与上帝相对的人，语境中特别包括发令的人间权威；中文“人”本身不限定性别，并保留“上帝—人”的鲜明对照。
theological_decisions:
- issue: 服从上帝与服从人的关系
  choice: 译为“服从上帝，而不是服从人”
  alternative: “服从上帝，胜过服从人”
  rationale: μᾶλλον ἢ建立优先性的对照；在当前命令冲突的语境中，“而不是”准确传达必须选择服从上帝，但不把经文扩展为在一切情况下都否定人间权威。
- issue: ἀνθρώποις是否特指男性
  choice: 译为泛指的“人”
  alternative: “人们”或“人间权威”
  rationale: 该词在此与上帝形成类别对照，泛指人类一方；“人”既忠于原文，也不额外把所指缩限为男性，或把解释性的“权威”直接写入正文。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“回答说”符合叙事体；引语保持原文的强制义务和鲜明对照。无需脚注，因为中文“人”已自然涵盖原文ἀνθρώποις的泛指意义，不存在英语“men”可能引起的性别歧义。
