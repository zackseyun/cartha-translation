  yaml_path: translation/nt/acts/005/018.yaml
  text: And they laid hands on the apostles and put them in public custody[a].
translation:
  language: zh_hans
  text: 他们就下手拿住使徒，把他们拘押在公设监所里[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把他们置于公共拘禁之下。”原文可泛指看守或拘禁，并不一定专指监牢建筑。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέβαλον τὰς χεῖρας ἐπὶ
  choice: 下手拿住
  rationale: 保留“把手加在……身上”这一惯用语的动作色彩，同时以“拿住”清楚表达本段中敌意拘捕的含义，避免被误解为按手祝福或差派。
- source_word: ἀποστόλους
  choice: 使徒
  rationale: 在《使徒行传》中，该词是耶稣所差派之人的固定称谓；“使徒”准确保留其称号意义。
- source_word: ἔθεντο
  choice: 拘押
  rationale: τίθημι在此与表示拘禁的短语连用；译作“拘押”符合现代汉语，也明确表达把人置于看守之下的动作。
- source_word: ἐν τηρήσει
  choice: 在……监所里
  rationale: τήρησις可指看守、拘禁状态或拘禁处所。“监所”能自然表达实际羁押，又不像“监狱”那样把原文限定为某一种特定建筑。
- source_word: δημοσίᾳ
  choice: 公共
  rationale: 该阴性与格形式与τηρήσει相配，表示公共或公用的拘禁处所；“公共”保留修饰语，不进一步解释为某一具体行政机构。
