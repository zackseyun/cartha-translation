  text: ἄγγελος δὲ κυρίου ⸀διὰ νυκτὸς ⸀ἤνοιξε τὰς θύρας τῆς φυλακῆς ἐξαγαγών τε αὐτοὺς εἶπεν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/019.yaml
  text: But an angel of the Lord opened the doors of the prison during the night, brought them out, and said,
translation:
  language: zh_hans
  text: 但是，夜间有一位主的天使打开了监狱的门，把他们带出来，说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄγγελος
  choice: 一位天使
  rationale: 此词没有冠词；结合天使开启监门并带使徒出来的语境，指天上的使者。“一位”自然传达非特指形式，又不把它泛化为人间的“使者”。
- source_word: κυρίου
  choice: 主的
  rationale: κύριος在“主的天使”这一固定圣经表达中宜译作“主”，既忠于原文，也符合现代中文圣经语体。
- source_word: διὰ νυκτός
  choice: 在夜间
  rationale: διά加属格在此表示时间。“在夜间”准确、自然，不额外暗示具体时刻。
- source_word: ἤνοιξε
  choice: 打开了
  rationale: ἀνοίγω直接表示“打开”；不译作“开锁”，以免加入原文没有说明的方式。
- source_word: τὰς θύρας τῆς φυλακῆς
  choice: 监狱的门
  rationale: 保留“门”的复数意义在中文中通常无需显式量化；“监狱的门”自然地表达该属格结构。
- source_word: ἐξαγαγών
  choice: 把他们带出来
  rationale: ἐξάγω表示使人从里面出来；“带出来”准确自然，也不额外强调引领方式。
- source_word: τε
  choice: 并列关系由逗号承接
  rationale: τε为较轻的连接成分。现代中文以连续谓语和逗号表达最自然，无须机械增添“并且”。
- source_word: εἶπεν
  choice: 说
  rationale: 叙事中的λέγω不定过去时自然译为“说”；冒号提示下节接续其话语内容。
theological_decisions:
- issue: ἄγγελος在本节所指的性质
  choice: 天上的天使
  alternative: 人的使者
  rationale: 开启监门并把被囚者带出的超自然语境强烈支持天使之义，因此译作“天使”；但不添加原文未明说的身份或等级。
- issue: κύριος的译法与所指
  choice: 主
  alternative: 主人
  rationale: “主的天使”是与原文相符且为读者熟悉的圣经表达。“主人”在此会造成世俗主仆关系的误解；译文不进一步明确“主”具体指父或子，以保留原文的指称空间。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“可是”承接上一节的囚禁情节并表达δὲ的转折；句末用冒号，因为下一节给出天使所说的话。未设脚注，正文也无脚注标记。
