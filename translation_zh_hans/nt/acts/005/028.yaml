  source_fidelity: 正文整体准确传达了命令的强调、禁止内容、“这名”、耶路撒冷被教导充满，以及将“这人的血”归于他们的血责意象。惟“严严地吩咐”不是自然的现代普通话搭配，宜改为“严厉地吩咐”。“竟”虽为可接受的责备性语气补足，但原文的重点在“看哪”的指示和控诉，改用“看，你们已经……”可更贴近而不额外强化惊讶。
