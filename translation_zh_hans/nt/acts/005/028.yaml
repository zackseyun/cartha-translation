source:
  edition: SBLGNT
  text: ⸀λέγων· Παραγγελίᾳ παρηγγείλαμεν ὑμῖν μὴ διδάσκειν ἐπὶ τῷ ὀνόματι τούτῳ, καὶ ἰδοὺ πεπληρώκατε τὴν Ἰερουσαλὴμ τῆς διδαχῆς ὑμῶν, καὶ βούλεσθε ἐπαγαγεῖν ἐφ’ ἡμᾶς τὸ αἷμα τοῦ ἀνθρώπου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/028.yaml
  text: saying[a], “We strictly ordered you not to teach in this name, and look, you have filled Jerusalem with your teaching, and you intend to bring this man's blood upon us.”
translation:
  language: zh_hans
  text: 说：“我们曾严厉地吩咐你们，不可奉这名教导人。看，你们已经使耶路撒冷充满了你们的教导，还想把这个人的血归到我们身上[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 意即“要我们为这个人的死负责”。原文说“把这个人的血归到我们身上”，这是指要我们承担与其死亡有关的血债或责任。
    reason: 说明“把血归到某人身上”所表达的血责含义，同时保留正文的原文意象，不将其解释性意思置入正文。
lexical_decisions:
- source_word: Παραγγελίᾳ παρηγγείλαμεν
  choice: 我们严严地吩咐过你们
  rationale: 同源名词与动词连用加强命令的语气；“严严地吩咐”在现代汉语中自然地保留这种强调。
- source_word: μὴ διδάσκειν
  choice: 不可……教导人
  rationale: 忠实表达命令中禁止教导的内容，不额外解释为“停止教导”。
- source_word: ἐπὶ τῷ ὀνόματι τούτῳ
  choice: 奉这个名
  rationale: “奉……名”可表达以该名所代表的权柄和依据行事，也保留使徒行传中“名”的重要意象。
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留原文引人注意且带有责问意味的语气；“看哪”庄重而仍为现代读者所理解。
- source_word: πεπληρώκατε τὴν Ἰερουσαλὴμ τῆς διδαχῆς ὑμῶν
  choice: 你们竟使自己的教导充满了耶路撒冷
  rationale: 保留“充满”的比喻以及完成时所表达的既成结果；“竟”传达说话者惊讶和指责的语气。
- source_word: βούλεσθε
  choice: 还想
  rationale: 表达意愿或企图，符合上下文中的指控口吻，同时不强化为“决意”。
- source_word: ἐπαγαγεῖν ἐφ’ ἡμᾶς
  choice: 归到我们身上
  rationale: 与“血”搭配时，“归到……身上”既自然，也保留把责任或罪责加在某人身上的意象。
- source_word: τὸ αἷμα τοῦ ἀνθρώπου τούτου
  choice: 这个人的血
  rationale: 保留原文的血之意象及“这个人”所带的疏离、轻蔑口吻，不在正文中直接释为死亡责任。
- source_word: λέγων
  choice: 说
  rationale: 这是承接上一节的分词，简洁译为“说”，使引语自然开始。
theological_decisions:
- issue: “把这个人的血归到我们身上”所暗示的责任
  choice: 正文保留“血归到我们身上”的原文意象
  alternative: 译作“要我们为这个人的死负责”
  rationale: 该表达惯指流血罪责或对其死亡负有责任；保留原有意象可避免在正文中把隐含意义完全明说，同时用脚注帮助普通读者理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“严严地吩咐”“奉这个名”“看哪”保留经文的强调、权柄与责问色彩；整体避免古奥句法和宗派化术语。
