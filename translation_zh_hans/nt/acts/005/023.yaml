  text: saying[a], “We found the prison securely locked, and the guards standing at the doors; but when we opened it, we found no one inside.”
translation:
  language: zh_hans
  text: 他们说：“我们发现监牢锁得严严实实[a]，守卫站在门口；可是打开门后，却发现里面一个人也没有。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“监牢锁得极为严密。”希腊原文强调监牢已经锁上，并且安全防范十分严密。
    reason: lexical_alternative
lexical_decisions:
- source_word: δεσμωτήριον
  choice: 监牢
  rationale: 指拘禁人的处所；“监牢”在现代汉语中自然、清楚，也符合叙事场景。
- source_word: κεκλεισμένον ἐν πάσῃ ἀσφαλείᾳ
  choice: 严密地锁着
  rationale: κεκλεισμένον 表达已经关闭并保持该状态，ἐν πάσῃ ἀσφαλείᾳ 强调防范周全；此译兼顾状态与安全程度。
- source_word: φύλακας ἑστῶτας
  choice: 守卫也站着
  rationale: φύλακες 在拘禁场景中指守卫；ἑστῶτας 描写他们站在岗位上的可见状态，不额外加入“奉命把守”等解释。
- source_word: ἐπὶ τῶν θυρῶν
  choice: 在门前
  rationale: ἐπί 加属格在此表示靠近门的位置；“在门前”符合现代汉语表达，并保留守卫所在地点的画面。
- source_word: ἀνοίξαντες
  choice: 打开门后
  rationale: 不定过去时分词在此表达先于主句的动作。原文未明说宾语，汉语补出承接上文的“门”，比以单数“监牢”为宾语更自然。
- source_word: ἔσω
  choice: 里面
  rationale: 作副词表示监牢内部；“里面”清楚自然。
- source_word: οὐδένα
  choice: 一个人也没有
  rationale: 以汉语否定结构传达 οὐδένα 的全面否定和强调意味。
- source_word: λέγοντες ὅτι
  choice: 他们说：
  rationale: 该分词结构承接上一节并引出报告内容；现代汉语用“他们说”自然地引入直接引语。
