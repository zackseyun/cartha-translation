  text: εἰ δὲ ἐκ θεοῦ ἐστιν, οὐ ⸀δυνήσεσθε καταλῦσαι ⸀αὐτούς·) μήποτε καὶ θεομάχοι εὑρεθῆτε. ἐπείσθησαν δὲ αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/039.yaml
  text: But if it is from God[a], you will not be able to overthrow them. You may even be found to be fighting against God.” So they were persuaded by him[c][b],
translation:
  language: zh_hans
  text: 但若这事出于神，你们就不能摧毁[a]他们[c]；免得你们竟被发现是与神争战的人[b]。”他们被他说服了，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “摧毁”也可译作“瓦解”或“推翻”。
    reason: lexical_alternative
  - marker: b
    text: “与神争战的人”直译为“与神为敌者”或“敌对神的人”。
    reason: lexical_alternative
  - marker: c
    text: “他们”最自然是指使徒；也有人将其广义理解为使徒所代表的运动或工作。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ θεοῦ
  choice: 出于神
  rationale: ἐκ表示来源；“出于神”自然地保留了迦玛列所提出的判断标准，即这事是否源自神。
- source_word: δυνήσεσθε
  choice: 你们就不能
  rationale: 该词为将来时，表达将来的能力或可能性；汉语在“若……就……”结构中用“不能”即可自然体现这一含义。
- source_word: καταλῦσαι
  choice: 摧毁
  rationale: 此处指使人或其行动归于失败、瓦解。“摧毁”既可用于人所推动的事业，也能与其人身对象搭配，并保留较强的对抗意味。
- source_word: αὐτούς
  choice: 他们
  rationale: 原文是阳性复数代词，最自然地回指使徒，而不是抽象的计划或工作；正文保留人称复数，脚注说明可能的广义理解。
- source_word: μήποτε
  choice: 免得……竟
  rationale: μήποτε引出对不良结果的警告；“免得……竟”在现代汉语中保留了警戒语气和可能性，并体现καί所加强的意外意味。
- source_word: θεομάχοι
  choice: 与神争战的人
  rationale: 该词字面意为“与神争战者”。用解释性的名词短语表达，既自然，又保留其严肃而强烈的神学含义。
- source_word: εὑρεθῆτε
  choice: 被发现是
  rationale: 被动形式表示最终被显明、被认定处于某种身份或状态；“被发现是”贴近原文表达。
- source_word: ἐπείσθησαν δὲ αὐτῷ
  choice: 众人听从了他
  rationale: πείθομαι在此表示因其劝说而接受意见。“听从了他”比直译“被他说服”更符合现代汉语，同时保留议会采纳迦玛列劝告的意思。
theological_decisions:
- issue: 警告中αὐτούς所指的对象
  choice: 正文译作“他们”，最直接指向受审的使徒。
  alternative: 也可结合上一节的“这计划、这工作”，广义理解为使徒所代表的运动或工作。
  rationale: 阳性复数代词在语法上最自然地指人，因此不将其改成抽象的“这事”；脚注保留语境中较广理解的可能性，避免把迦玛列的话扩展为对任何自称属神之运动的笼统保证。
- issue: μήποτε καὶ θεομάχοι εὑρεθῆτε的语气
  choice: 译为警告：“免得你们竟被发现是与神争战的人。”
  alternative: 可译为较弱的可能性陈述：“你们甚至可能被发现是在与神争战。”
  rationale: μήποτε通常引出应当避免的结果。采用“免得”保留其警戒力量，但不把“出于神”说成已经确定的事实，因而维持迦玛列论证中的条件性和神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“若……就……”呈现条件句，以“免得……竟”表达警告；“与神争战的人”保留原文复合词的力度。句末逗号承接下一节叙事。
