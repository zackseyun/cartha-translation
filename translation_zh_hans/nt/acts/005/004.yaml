id: ACT.5.4
reference: Acts 5:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οὐχὶ μένον σοὶ ἔμενεν καὶ πραθὲν ἐν τῇ σῇ ἐξουσίᾳ ὑπῆρχεν; τί ὅτι ἔθου ἐν τῇ καρδίᾳ σου τὸ πρᾶγμα τοῦτο; οὐκ ἐψεύσω ἀνθρώποις ἀλλὰ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/004.yaml
  text: While it remained unsold[a], did it not remain yours? And after it was sold[b], was it not under your authority? Why is it that you have set this matter in your heart? You have not lied to men but to God.
translation:
  language: zh_hans
  text: 田地还留着的时候，不是仍归你吗？卖了以后，所得的价款不也由你支配吗？[a]你为什么存心做这事呢？你不是向人撒谎，而是向上帝撒谎。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“卖了以后，不也是在你的权下吗？”上下文表明这里指卖田所得仍由他处置。
    reason: 说明原文的简略表达及其上下文所指，避免将“所得的价款”误认为原文显式出现的名词。
lexical_decisions:
- source_word: μένον / ἔμενεν
  choice: 还留着／仍归
  rationale: 前者表达出售前田地仍被保留的状态，后者按汉语习惯表达其所有权；既照顾希腊文的重复，也避免生硬直译。
- source_word: σοὶ
  choice: 归你
  rationale: 与 μένω 连用时表示该产业仍属亚拿尼亚所有；“归你”是现代汉语自然的所有关系表达。
- source_word: πραθέν
  choice: 卖了以后
  rationale: 保留不定过去时被动分词的被动意义，并用汉语时间分句自然衔接下文。
- source_word: ἐν τῇ σῇ ἐξουσίᾳ ὑπῆρχεν
  choice: 所得的价款不也由你支配吗
  rationale: ἐξουσία 表示权柄、权利或支配权。上下文所指是出售后的财物，译为“由你支配”准确表达亚拿尼亚有权决定如何处置所得价款。
- source_word: τί ὅτι
  choice: 为什么
  rationale: 该结构引出责问；现代汉语用“为什么”即可自然传达其质问语气。
- source_word: ἔθου ἐν τῇ καρδίᾳ σου τὸ πρᾶγμα τοῦτο
  choice: 你为什么存心做这事呢
  rationale: “存心”保留“在心里”的内在意图与决意，不把该表达仅仅弱化为一闪而过的想法；“这事”保持 πρᾶγμα 的宽泛性。
- source_word: οὐκ ἐψεύσω ἀνθρώποις ἀλλὰ τῷ θεῷ
  choice: 你不是向人撒谎，而是向上帝撒谎
  rationale: ψεύδομαι 加与格表示“向……撒谎”；“人”自然涵盖一般人类，并清楚保留“人—上帝”的对比。
theological_decisions:
- issue: 本节与使徒行传5:3关于圣灵的关系
  choice: 按本节原文直译为“向上帝撒谎”，不在正文中增添“也就是向圣灵”。
  alternative: 译为“向上帝，也就是向圣灵撒谎”。
  rationale: 本节明说 θεῷ（上帝）；其与上一节的神学关系应由上下文呈现，不宜把解释性同位语加入正文。
- issue: 亚拿尼亚对产业及售款的所有权和处置权
  choice: 明确表达田地仍归他，出售所得也由他支配。
  alternative: 仅笼统表达他曾占有产业，不突出其决定权。
  rationale: 彼得责备的重点不是亚拿尼亚没有交出全部财产，而是他的欺骗；ἐξουσία 所表达的实际处置权应予保留。
- issue: ἀνθρώποις 的泛指意义
  choice: 译为“人”。
  alternative: 译为“男人”或“人类”。
  rationale: 这里泛指人，与上帝形成对比，并非只指男性；现代汉语“人”准确且自然。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“田地”由上文产业语境补明；“存心做这事”保留内在蓄意的意味，但不额外断定具体心理过程。
