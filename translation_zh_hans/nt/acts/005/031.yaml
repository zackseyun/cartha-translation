  text: τοῦτον ὁ θεὸς ἀρχηγὸν καὶ σωτῆρα ὕψωσεν τῇ δεξιᾷ αὐτοῦ, ⸀τοῦ δοῦναι μετάνοιαν τῷ Ἰσραὴλ καὶ ἄφεσιν ἁμαρτιῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/031.yaml
  text: God exalted this one to his right hand as Leader and Savior[a], to give repentance to Israel and forgiveness of sins.
translation:
  language: zh_hans
  text: 上帝把这一位高举到自己右边[a]，立他为领袖和救主，为要赐给以色列人悔改和罪得赦免。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“上帝用自己的右手把这一位高举，立他为领袖和救主。”希腊原文也可能表示“用他的右手”，但这里更可能是指把耶稣高举到上帝右边、处于最高尊荣的地位。
    reason: 保留 τῇ δεξιᾷ αὐτοῦ 的工具性替代读法。
lexical_decisions:
- source_word: τοῦτον
  choice: 这一位
  rationale: 保留指示代词的强调语气，明确回指耶稣；比单用“他”更贴近原文。
- source_word: ἀρχηγὸν
  choice: 领袖
  rationale: 此词可指居首位、带领者或开创者；在与“救主”并列及受高举的语境中，“领袖”自然清楚，又不把词义限定为世俗君王。
- source_word: σωτῆρα
  choice: 救主
  rationale: 符合新约基督论语境，兼具施行拯救者与救恩意义。
- source_word: ὕψωσεν
  choice: 高举
  rationale: 这里重在上帝使耶稣升至尊荣和权柄的地位，而非仅指复活；“高举”保留此含义。
- source_word: τῇ δεξιᾷ αὐτοῦ
  choice: 在自己的右边
  rationale: 按上下文理解为处于上帝右边的尊荣地位；希腊语与格也可能表示凭借方式，故将该可能性列入脚注。
- source_word: τοῦ δοῦναι
  choice: 为要赐给
  rationale: 带冠词不定式表达目的；“为要”明确保留目的关系，“赐给”也符合恩赐性的语境。
- source_word: μετάνοιαν
  choice: 悔改
  rationale: “悔改”是现代汉语基督教语境中准确且自然的固定译法，表达转离罪而归向上帝，不宜弱化为单纯改变想法。
- source_word: τῷ Ἰσραὴλ
  choice: 给以色列人
  rationale: 与“赐给”自然搭配，表达领受者；此处“以色列”指以色列民，译作“以色列人”更符合现代汉语。
- source_word: ἄφεσιν ἁμαρτιῶν
  choice: 罪得赦免
  rationale: 准确表达罪被宽赦，且与前面的“悔改”并列时比名词化的“罪的赦免”更自然。
theological_decisions:
- issue: 耶稣在上帝右边受高举的含义
  choice: 正文理解为上帝把耶稣高举到自己右边的至高尊荣与权柄地位。
  alternative: 也可把与格短语理解为方式或工具，即“上帝用自己的右手高举了他”。
  rationale: “高举”及新约常见的右边登位意象更支持位置性的理解，但希腊语与格本身容许工具性解释，因此不在正文中消除该歧义，而以脚注保存。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“这一位”保留原文强调；“立为”使“高举……为领袖和救主”的关系在汉语中清楚。“上帝”与“自己的”共同明确动作主体和右边所属。
