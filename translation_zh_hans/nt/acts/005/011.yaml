base_translation:
  language: en
  yaml_path: translation/nt/acts/005/011.yaml
  text: And great fear came upon the whole church and upon all who heard these things[a].
translation:
  language: zh_hans
  text: 于是，整个教会和所有听见这些事的人都大大惧怕[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “教会”也可译作“会众”或“群体”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: 于是……都大大惧怕
  rationale: γίνομαι与φόβος及ἐπί连用，表达惧怕临到一群人。汉语用“都大大惧怕”自然呈现事件的发生及其普遍影响，避免生硬直译为“惧怕发生了”。
- source_word: φόβος μέγας
  choice: 大大惧怕
  rationale: 上下文紧接亚拿尼亚和撒非喇受审判而死，φόβος在此以“惧怕”最贴切；μέγας用程度副词“大大”表达强烈程度。
- source_word: ἐφ’ ὅλην τὴν ἐκκλησίαν
  choice: 整个教会……都
  rationale: ἐκκλησία在《使徒行传》中指信徒群体，以“教会”表达其语境所指；ὅλην译为“整个”，保留影响范围的全面性。汉语的“都”自然承载ἐπί所表达的临及关系。
- source_word: πάντας τοὺς ἀκούοντας ταῦτα
  choice: 所有听见这些事的人
  rationale: 保留πάντας的全称范围和ταῦτα的复数指示；分词ἀκούοντας在汉语中自然译作关系结构“听见……的人”。
theological_decisions:
- issue: ἐκκλησία的译法
  choice: 教会
  alternative: 会众；集会
  rationale: 此词在本节指基督徒群体，“教会”是现代汉语中明确而通行的对应词；脚注列出“会众”或“集会”，保留该词本有的群体、聚集含义，而不额外引入特定教会制度观。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“于是”连接前文审判事件；两个并列对象共用“都大大惧怕”，使句子符合自然汉语，同时保留“整个”和“所有”的全面范围。
