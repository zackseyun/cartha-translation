  yaml_path: translation/nt/acts/005/033.yaml
  text: But when they heard this, they were enraged and wanted to kill them.
translation:
  language: zh_hans
  text: 可是，他们听见这话，就怒不可遏[a]，想要杀死他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文的字面意象为“被锯开”或“被切开”，形容一种极其强烈、带有敌意的激愤。
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ δὲ
  choice: 可是，他们
  rationale: δέ在此标志从使徒的申辩转向听众的敌对反应，译作“可是”体现轻微转折；冠词在这里实词化，指前文所述的听众。
- source_word: ἀκούσαντες
  choice: 听见这话
  rationale: 不定过去时分词在此表示时间关系；“这话”自然补出语境中所听见的内容。
- source_word: διεπρίοντο
  choice: 怒不可遏
  rationale: 该词的字面意象是“被锯透”，在本语境中表达强烈而敌对的激愤。“怒不可遏”清楚传达其语用力度，同时以脚注保留原文意象。
- source_word: ἐβούλοντο
  choice: 想要
  rationale: 未完成时表达持续或正在形成的意愿；“想要”自然呈现其杀人的意图，而不过度强化为已经作出的正式决定。
- source_word: ἀνελεῖν
  choice: 杀死
  rationale: ἀναιρέω在这里明确指夺取生命；“杀死”直接、清楚，符合现代汉语。
- source_word: αὐτούς
  choice: 他们
  rationale: 代词回指正在受审的使徒，直译为“他们”，不在正文中额外明说所指。
theological_decisions:
- issue: διεπρίοντο所表达的是悔悟刺心还是敌对暴怒
  choice: 正文译为“怒不可遏”
  alternative: “心被刺痛”或“心如刀割”
  rationale: 随后“想要杀死他们”的行动意图表明这里是强烈的敌对激愤。中文“心被刺痛”容易被理解为悔悟或良心受责，因此正文传达语境中的情绪功能，脚注则保留原词的强烈切割意象。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“怒不可遏”比照搬“被锯透”更易为普通读者理解，又借脚注保留原文鲜明的比喻。
