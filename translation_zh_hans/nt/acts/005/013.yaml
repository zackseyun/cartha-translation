  text: τῶν δὲ λοιπῶν οὐδεὶς ἐτόλμα κολλᾶσθαι αὐτοῖς, ἀλλ’ ἐμεγάλυνεν αὐτοὺς ὁ λαός,
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/013.yaml
  text: But none of the rest dared to join them; rather, the people held them in high esteem.
translation:
  language: zh_hans
  text: 至于其余的人，没有一个敢与他们接近；百姓却尊重他们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῶν δὲ λοιπῶν
  choice: 至于其余的人
  rationale: 保留属格结构所标示的群体范围；“其余的人”不武断限定为非信徒、慕道者或其他特定群体。
- source_word: κολλᾶσθαι αὐτοῖς
  choice: 和他们联合
  rationale: κολλάομαι有紧密依附、加入之意；“联合”既表达关系上的靠拢，也避免过度明确为正式加入某一组织。
- source_word: ἐμεγάλυνεν αὐτοὺς ὁ λαός
  choice: 百姓都十分敬重他们
  rationale: 按语境将μεγαλύνω表达为尊崇、看重，而非字面的“使他们为大”；“百姓”对应ὁ λαός。
theological_decisions:
- issue: “其余的人”所指群体的身份
  choice: 保留为“其余的人”
  alternative: “其他非信徒”或“其他人”
  rationale: 原文没有明确说明他们的信仰身份，故不作神学性补足。
- issue: κολλᾶσθαι是否表示正式加入教会
  choice: 译作“联合”
  alternative: “加入他们”
  rationale: 原词可表示依附或结交，不一定专指正式成员资格；译文保留这一语义张力。
- issue: ἀλλά的转折力度
  choice: 译作“然而”
  alternative: “反而”
  rationale: 此处对照的是无人敢贸然联合与百姓普遍敬重；“然而”自然呈现转折，又不额外强化逻辑。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。分号保留原句两部分之间的鲜明对照；不添加脚注，因为本节的歧义可由正文措辞直接保留。
