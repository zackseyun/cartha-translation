  text: μᾶλλον δὲ προσετίθεντο πιστεύοντες τῷ κυρίῳ πλήθη ἀνδρῶν τε καὶ γυναικῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/014.yaml
  text: And even more believers in the Lord were being added—multitudes of both men and women[a].
translation:
  language: zh_hans
  text: 信靠主的人越发不断地加添进来，就是大批大批的男男女女[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“越来越多的人加入了信靠主者的行列”，或“信靠主的人越发增多”。希腊语动词表示人数持续增加；其形式可理解为“加入”，也可带被动意味，暗示上帝可能是把他们加添进来的那一位。
    reason: 说明原文动词的持续体貌，以及中动／被动理解的可能性；不在正文中明定隐含施动者。
lexical_decisions:
- source_word: μᾶλλον
  choice: 越来越多
  rationale: 表达比较和持续增长的意味，在现代汉语中自然清楚。
- source_word: δὲ
  choice: 然而
  rationale: 本词在此承接上文，同时带有轻微转折：尽管旁人不敢贸然接近，信主的人数仍继续增长。
- source_word: προσετίθεντο
  choice: 被加添进来
  rationale: 保留未完成时所表达的持续过程，也保留中被动形式可能具有的被动意味，而不擅自明说施动者是上帝。
- source_word: πιστεύοντες τῷ κυρίῳ
  choice: 信主的人
  rationale: 分词作名词用；与格表示信靠所指向的对象。译法简洁自然，并保留“主”这一称号。
- source_word: πλήθη
  choice: 许许多多
  rationale: 传达复数名词所强调的庞大人数，且适合现代汉语叙事。
- source_word: ἀνδρῶν τε καὶ γυναικῶν
  choice: 男女都有
  rationale: 保留 τε καί 对男女两类人的并列强调，同时使汉语表达流畅。
theological_decisions:
- issue: “主”（τῷ κυρίῳ）的所指
  choice: 保留“主”，在本语境中自然指向复活的耶稣
  alternative: 把“主”较宽泛地理解为上帝
  rationale: 《使徒行传》的传福音摘要常以“主”指耶稣；正文不直接扩写为“耶稣”，以免消除原文称号本身的表达空间。
- issue: προσετίθεντο 的语态和体貌
  choice: 译作持续性的被动表达“被加添进来”
  alternative: 译作“加入”或“人数不断增多”
  rationale: 未完成时表明过程持续发生；中被动形式容许“加入”的理解，但被动译法也保留了上帝可能是隐含施动者的神学意味，同时不将其明说。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“被加添进来”略带经文语感，是为保留原文被动表达及其未明说施动者的张力；“男女都有许许多多”避免生硬直译“男人和女人的群众”。
