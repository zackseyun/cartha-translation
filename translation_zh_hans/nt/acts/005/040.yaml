id: ACT.5.40
reference: Acts 5:40
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ προσκαλεσάμενοι τοὺς ἀποστόλους δείραντες παρήγγειλαν μὴ λαλεῖν ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ καὶ ⸀ἀπέλυσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/040.yaml
  text: And after summoning the apostles[a], they beat them, ordered them not to speak in the name of Jesus, and released them.
translation:
  language: zh_hans
  text: 于是，他们把使徒叫来，打了一顿，命令他们不可奉耶稣的名[a]讲话，然后释放了他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“谈论耶稣的名”，或“以耶稣的名为依据讲话”。这个希腊语表达既可指所讲的内容与耶稣有关，也可包含凭他的权柄讲话之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενοι
  choice: 把……叫来
  rationale: 不定过去时中间语态分词表示先于主要动词发生的动作；“把……叫来”自然地交代了他们先召使徒到面前。
- source_word: τοὺς ἀποστόλους
  choice: 使徒
  rationale: “使徒”是现代汉语基督教语境中对 ἀπόστολος 的通行译法，在本段具体指受差遣为耶稣作见证的那些人。
- source_word: δείραντες
  choice: 打了一顿
  rationale: δέρω 表示殴打、痛打，但本身未明确规定具体的司法鞭刑方式；“打了一顿”既传达实际受到的身体暴力，也避免过度具体化为某一种刑罚。
- source_word: παρήγγειλαν
  choice: 命令
  rationale: παραγγέλλω 在这里表示正式下令；“命令”保留了公议会所施加的强制性。
- source_word: μὴ λαλεῖν
  choice: 不可……讲话
  rationale: μή 加不定式表达禁令的内容；“不可……讲话”忠实保留“说、讲”的宽泛含义，没有擅自限定为讲道或教导。
- source_word: ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ
  choice: 奉耶稣的名
  rationale: “奉……的名”是自然且庄重的汉语圣经表达，可涵盖与耶稣有关并凭其权柄发言的意思；脚注保留希腊语介词结构可能包含的其他侧重。
- source_word: ἀπέλυσαν
  choice: 释放了他们
  rationale: ἀπολύω 在拘押与审讯的语境中表示解除拘禁、准其离去；“释放”比口语化的“让他们走”更符合本段场景。
theological_decisions:
- issue: ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ 所表达的关系
  choice: 奉耶稣的名
  alternative: 关于耶稣的名；以耶稣的名为依据
  rationale: 该短语既可能侧重谈论与耶稣之名有关的事，也可能包含凭耶稣的权柄发言之意。正文采用兼具惯用性和神学内涵的“奉耶稣的名”，并以脚注说明语义范围，避免只保留其中一种解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“打了一顿”虽较直白，但准确自然，且不把原文未说明的殴打方式具体化。“于是”和“然后”清楚呈现动作次序，同时避免生硬复制希腊语分词结构。
