  source_fidelity: 正文准确呈现了动作次序：先召来使徒，继而殴打、下令禁止、最后释放。“打了一顿”对应 δείραντες，避免将原文未明说的殴打方式具体化为“鞭打”。“释放了他们”也恰当反映拘押／审讯语境中的 ἀπέλυσαν。
  naturalness: 译文为自然、庄重且易懂的现代标准汉语。“把使徒叫来”“命令他们不可……”“然后释放了他们”叙事连贯。“于是”可自然承接上文的叙事发展，并未实质添加原文没有的因果内容。
