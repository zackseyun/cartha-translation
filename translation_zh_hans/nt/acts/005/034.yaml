  text: ἀναστὰς δέ τις ἐν τῷ συνεδρίῳ Φαρισαῖος ὀνόματι Γαμαλιήλ, νομοδιδάσκαλος τίμιος παντὶ τῷ λαῷ, ἐκέλευσεν ἔξω ⸀βραχὺ τοὺς ⸀ἀνθρώπους ποιῆσαι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/034.yaml
  text: But a Pharisee named Gamaliel stood up in the council[a], a teacher of the law honored by all the people[b], and ordered the men to be put outside for a short time.
translation:
  language: zh_hans
  text: 但在议会[a]中，有一个法利赛人站起来，名叫迦玛列；他是一位受全体民众敬重的律法教师。他吩咐人把那些人暂时带到外面去。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “议会”在此指犹太人的最高议事和审判机构，即犹太公会。
    reason: cultural_note
  - marker: b
    text: 希腊语字面上近似“使那些人在外面片刻”，是一种惯用表达，意思是命人暂时将他们带离会场。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς δέ
  choice: 可是……站了起来
  rationale: ἀναστὰς表示在会众中起身发言或采取行动；“站了起来”保留其具体动作。δέ在此引出叙事转折，译作“可是”自然地承接前文。
- source_word: τις ἐν τῷ συνεδρίῳ Φαρισαῖος
  choice: 公议会里有一个法利赛人
  rationale: τις用于引入新人物，汉语以“有一个”自然表达；συνέδριον在此指犹太人的最高议事和审判机构，正文采用通行而易懂的“公议会”。
- source_word: ὀνόματι Γαμαλιήλ
  choice: 名叫迦玛列
  rationale: 这是ὀνόματι加专名的惯用结构；“名叫”符合现代汉语表达。“迦玛列”沿用中文圣经中此人名的通行译法。
- source_word: νομοδιδάσκαλος
  choice: 律法教师
  rationale: 该复合名词指教导律法的人；“律法教师”直接、清楚，不额外将其解释成官职或特定宗派身份。
- source_word: τίμιος παντὶ τῷ λαῷ
  choice: 受到全体民众的敬重
  rationale: τίμιος在这里表示社会声望和尊敬；παντὶ τῷ λαῷ保留为“全体民众”，不擅自增补“以色列人”等限定。
- source_word: ἐκέλευσεν
  choice: 吩咐
  rationale: κελεύω表示带权威的指令；“吩咐”在此司法会议场景中既有命令意味，又符合自然汉语。
- source_word: ἔξω βραχὺ τοὺς ἀνθρώπους ποιῆσαι
  choice: 把这些人暂时带到外面去
  rationale: 希腊语直译近似“使这些人在外面片刻”，实际是命人暂时将他们带离会场。主动处置式“吩咐人把……”在汉语中自然，并保留暂时移出的意思。
theological_decisions:
- issue: τοὺς ἀνθρώπους所指对象及性别信息
  choice: 这些人
  alternative: 这些男人／众使徒
  rationale: 上下文所指是受审的使徒，他们是男性；但现代汉语“人”本身不标语法性别，而“这些男人”在此突兀且容易误添强调。“众使徒”虽明确，却把上下文信息直接代入原文较一般的称呼。因此正文译作“这些人”，不改变实际所指。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“可是”呈现叙事转折；分号避免连续定语过长。“民众”比“百姓”更符合现代标准汉语，同时保留λαός在此指当地整体民众的宽泛含义。脚注按正文首次出现次序重新编号，使文化说明紧随“公议会”，惯用语说明紧随相关动作。
