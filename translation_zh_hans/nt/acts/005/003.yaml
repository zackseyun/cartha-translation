  text: εἶπεν δὲ ⸀ὁ Πέτρος· Ἁνανία, διὰ τί ἐπλήρωσεν ὁ Σατανᾶς τὴν καρδίαν σου, ψεύσασθαί σε τὸ πνεῦμα τὸ ἅγιον καὶ ⸀νοσφίσασθαι ἀπὸ τῆς τιμῆς τοῦ χωρίου;
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/003.yaml
  text: But Peter said[a], “Ananias[d][c][b], why has Satan filled your heart to lie to the Holy Spirit and to keep back some of the price of the land?”
translation:
  language: zh_hans
  text: 彼得却说：“亚拿尼亚，为什么撒但充满了你的心，使你向圣灵说谎，又私自扣留那块地卖价的一部分[a]呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “私自扣留”也可译作“私自留下”或“扣留”；“卖价”也可译作“售地所得的钱”。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ ὁ Πέτρος
  choice: 彼得却说
  rationale: δέ在这里表示轻微转折；“却”自然承接上文，并突出彼得对亚拿尼亚的质问。
- source_word: διὰ τί
  choice: 为什么
  rationale: 这是现代汉语中直接、自然的疑问表达。
- source_word: ἐπλήρωσεν ὁ Σατανᾶς τὴν καρδίαν σου
  choice: 撒但充满了你的心
  rationale: 保留原文中撒但作主语及“充满心”的比喻，不将其解释为附身、完全控制或亚拿尼亚毫无责任。
- source_word: ψεύσασθαί σε τὸ πνεῦμα τὸ ἅγιον
  choice: 使你欺骗圣灵
  rationale: ψεύδομαι接人的宾格可指向某人说谎；汉语“欺骗圣灵”比“向圣灵说谎”更自然，同时保留其直接、具人格性的对象关系。
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: 圣灵
  rationale: 采用现代汉语基督教语境中通行、庄重的译法。
- source_word: νοσφίσασθαι
  choice: 私自留下了一部分
  rationale: 该词含暗中为自己扣留之意；“私自留下”保留不当占留的语义，又避免使用过于法律化的“侵吞”或“挪用”。
- source_word: ἀπὸ τῆς τιμῆς
  choice: 从……卖价中……一部分
  rationale: ἀπό加属格表达从整体中取出一部分；在售地语境中，“卖价”准确说明τιμή所指。
- source_word: τοῦ χωρίου
  choice: 那块地
  rationale: χωρίον可指一块地、田地或地产；结合上下文，译作“那块地”自然且不过度限定。
theological_decisions:
- issue: 撒但充满亚拿尼亚之心的能动关系
  choice: 直译为“撒但充满了你的心”
  alternative: “你为什么让撒但充满你的心”或“撒但为什么控制了你”
  rationale: 原文以撒但为动词主语，同时上下文仍追究亚拿尼亚的责任；译文不加入“容让”，也不解释为不可抗拒的控制，以保留张力。
- issue: 对圣灵说谎的含义
  choice: 译为“欺骗圣灵”
  alternative: “向圣灵说谎”或“在圣灵面前说谎”
  rationale: 原文直接以圣灵为ψεύδομαι的对象。“欺骗圣灵”在现代汉语中自然地保留这种直接、具人格性的指向；“在圣灵面前”会减弱原文关系。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事语言。“撒但”“圣灵”沿用通行圣经用语；保留“充满了你的心”的原文比喻。脚注只说明νοσφίζομαι及τιμή在本语境中的可选译法。
