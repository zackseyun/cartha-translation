  text: ὡς δὲ ἤκουσαν τοὺς λόγους τούτους ὅ ⸀τε στρατηγὸς τοῦ ἱεροῦ καὶ οἱ ἀρχιερεῖς, διηπόρουν περὶ αὐτῶν τί ἂν γένοιτο τοῦτο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/024.yaml
  text: When the captain of the temple and the chief priests heard these words[a], they were perplexed about them, wondering what this might come to.
translation:
  language: zh_hans
  text: 圣殿守卫长和祭司长们听见这些话后，对这些事困惑不解，不知道这事究竟会有什么结果。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不知道这事会发展成什么样。”希腊语表达的是对这件事最终结果的疑问。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἤκουσαν
  choice: 听见……就
  rationale: 以现代汉语自然的紧缩复句表达时间推进和叙事承接；ἤκουσαν在这里指听到刚才的报告。
- source_word: τοὺς λόγους τούτους
  choice: 这些话
  rationale: 贴近λόγους的字面表达，同时可自然指向守卫所作的报告。
- source_word: ὅ τε στρατηγὸς τοῦ ἱεροῦ
  choice: 圣殿守卫长
  rationale: στρατηγός指负责圣殿治安与守卫事务的官长；此译比容易引起现代军衔联想的“队长”更明确。
- source_word: οἱ ἀρχιερεῖς
  choice: 众祭司长
  rationale: 在第二圣殿时期语境中，复数ἀρχιερεῖς通常指祭司领袖群体，而非多位同时在任的大祭司。
- source_word: διηπόρουν
  choice: 困惑不解
  rationale: 表达διαπορέω所含的强烈疑惑和无所适从；上下文中的持续状态由句意自然体现。
- source_word: περὶ αὐτῶν
  choice: 为这些事
  rationale: 保留代词指向的弹性，可指所听见的话，也可指话中报告的事件；不将其过度限定为某一对象。
- source_word: τί ἂν γένοιτο τοῦτο
  choice: 不知道这事究竟会有什么结果
  rationale: 将ἄν加愿望式所表达的未定结果译成自然汉语，同时保留对事态后果的疑问。
theological_decisions: []
