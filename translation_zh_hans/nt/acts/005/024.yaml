  register: 采用自然、庄重而易懂的现代标准汉语。“圣殿守卫长”体现其职务范围；“众祭司长”保持当时宗教领袖群体的历史含义。正文保留περὶ αὐτῶν指向上的适度含混，并以脚注说明末句的另一种自然译法。
