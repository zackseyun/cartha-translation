  text: τότε ἀπελθὼν ὁ στρατηγὸς σὺν τοῖς ὑπηρέταις ⸀ἤγαγεν αὐτούς, οὐ μετὰ βίας, ἐφοβοῦντο γὰρ τὸν λαόν, ⸀μὴ λιθασθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/026.yaml
  text: Then the captain went with the officers and brought them[a], not with force, for they were afraid of the people, lest they be stoned.
translation:
  language: zh_hans
  text: 于是，圣殿守卫长[a]同差役前去，把使徒带来，却没有使用武力，因为他们怕百姓用石头打他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为“守卫长”，这里指负责维持圣殿秩序的官员。
    reason: 说明该职称的语境含义，避免误解为罗马军官。
lexical_decisions:
- source_word: στρατηγὸς
  choice: 圣殿守卫长
  rationale: 本词在《使徒行传》的语境中指负责维持圣殿秩序的官员，并非罗马军队的将领；“圣殿守卫长”既交代职务范围，也保留其主管身份。
- source_word: ὑπηρέταις
  choice: 差役
  rationale: 这里指随同守卫长执行公务的下属人员；“差役”能自然体现其执法性质，又不把他们过度具体化为现代警察。
- source_word: ἤγαγεν αὐτούς
  choice: 把使徒带来
  rationale: ἄγω可指带领或带来；根据上下文，他们被带到议会面前。“使徒”明确了代词所指，但不额外添加原文没有明确表达的“进去”。
- source_word: οὐ μετὰ βίας
  choice: 却没有使用武力
  rationale: 准确表达行动不是以强制暴力方式进行；“却”自然呈现这一方式与预期逮捕手段之间的反差。
- source_word: ἐφοβοῦντο γὰρ τὸν λαόν
  choice: 因为他们怕百姓
  rationale: 未完成时在此表达当时持续起作用的惧怕；“百姓”保留 λαός 对当地民众的通常称呼。
- source_word: μὴ λιθασθῶσιν
  choice: 怕百姓用石头打死自己
  rationale: μή加虚拟式在惧怕动词之后表示所担心的结果；被动含义用自然中文表达，并以“自己”清楚指回守卫长和差役。
- source_word: τότε ἀπελθὼν
  choice: 于是……前去
  rationale: 将分词与主要动词合并为自然的叙事顺序，同时保留 τότε 的承接作用。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“差役”和“使用武力”符合执法场景；末句用“自己”消除中文代词可能造成的错误指向，同时不改变原文所表达的受威胁者。
