id: ACT.5.32
reference: Acts 5:32
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἡμεῖς ⸀ἐσμεν μάρτυρες τῶν ῥημάτων τούτων, καὶ τὸ ⸀πνεῦμα τὸ ἅγιον ὃ ἔδωκεν ὁ θεὸς τοῖς πειθαρχοῦσιν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/032.yaml
  text: And we are witnesses of these things[a], and so is the Holy Spirit[c][b], whom God has given to those who obey him.
translation:
  language: zh_hans
  text: 我们是这些事的见证人[a]；上帝赐给顺从他的人的圣灵，也为这些事作见证[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这些事”也可译作“这些话”或“这些事情”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文直译为“圣灵也是”；“作见证”承接前一句的意思。
    reason: alternative_reading
lexical_decisions:
- source_word: μάρτυρες
  choice: 见证人
  rationale: 保留使徒亲历并作证的含义，也符合《使徒行传》中的见证语境。
- source_word: ῥημάτων
  choice: 事
  rationale: ῥῆμα可指“话、事情、事件”；此处回指使徒所宣告的内容和先前所述事件，译作“这些事”在现代汉语中自然，并保留范围上的弹性。
- source_word: πνεῦμα τὸ ἅγιον
  choice: 圣灵
  rationale: 这是现代汉语基督教语境中通行且自然的对应表达。
- source_word: ἔδωκεν
  choice: 赐给
  rationale: 用于上帝把圣灵给予人的语境，既自然又保持原文“给予”的含义；汉语无需强行标示希腊语不定过去时。
- source_word: πειθαρχοῦσιν
  choice: 顺从
  rationale: πειθαρχέω表示服从权威；“顺从”准确承接5:29中顺从上帝而非人的语境。
- source_word: αὐτῷ
  choice: 他
  rationale: 按原文以代词回指上帝，在汉语中指向清楚。
theological_decisions:
- issue: 圣灵是否与使徒一同被表述为见证者
  choice: 补出“也为这些事作见证”
  alternative: 直译为“圣灵也是”，或“以及圣灵”
  rationale: 第二个分句在希腊文中省略谓语，语义从前句“是见证人”承接而来。汉语补出“作见证”可清楚表达这种并列关系，不额外引入内容。
- issue: 关系代词ὃ与圣灵的指称
  choice: 按汉语自然句法改组为“上帝赐给顺从他的人的圣灵”
  alternative: 译为“圣灵，他是上帝赐给顺从他的人的”
  rationale: ὃ因与中性名词πνεῦμα语法一致而用中性形式；现代汉语没有对应的语法性别。采用定语结构既明确圣灵是所赐者，也避免不自然或带额外解释色彩的代词选择。
- issue: 圣灵赐予对象的表述
  choice: “顺从他的人”
  alternative: “服从上帝的人”
  rationale: 保留原文代词，同时清楚表达πειθαρχέω所含的服从权威之意；不将此句扩展为对得救条件或顺从程度的系统性说明。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“我们是……见证人”保留原文名词结构；后半句为避免汉语中的悬空并列，明确补出原文隐含的“作见证”。所有脚注标记均已置于正文。
