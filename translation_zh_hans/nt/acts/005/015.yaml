  text: ὥστε ⸂καὶ εἰς⸃ τὰς πλατείας ἐκφέρειν τοὺς ἀσθενεῖς καὶ τιθέναι ἐπὶ ⸀κλιναρίων καὶ κραβάττων, ἵνα ἐρχομένου Πέτρου κἂν ἡ σκιὰ ⸀ἐπισκιάσῃ τινὶ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/015.yaml
  text: so that they even carried the sick out into the streets and laid them on cots and mats[a], so that as Peter was coming by[c][b], even his shadow might overshadow some of them.
translation:
  language: zh_hans
  text: 以致人们甚至把病人抬到街道上[a]，安放在床和褥垫上[b]，好让彼得经过时，甚至他的影子也会落在他们中的一个人身上[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“公共广场上”。希腊语πλατείας可指宽阔的街道，也可指开阔的公共场所。
    reason: lexical_alternative
  - marker: b
    text: 或译“床和铺盖”。原文用两个不同的词，指两类卧具或可供躺卧的物件。
    reason: lexical_alternative
  - marker: c
    text: 本节记述的是众人的意图：他们这样安放病人，是盼望彼得经过时，甚至他的影子会落在其中一人身上；本节并未明确说影子本身使人痊愈。
    reason: cross_reference
lexical_decisions:
- source_word: ὥστε
  choice: 以致
  rationale: 承接上文，表达使徒影响不断扩大的结果；“以致”自然保留结果含义。
- source_word: καὶ εἰς τὰς πλατείας
  choice: 甚至……到街道上
  rationale: καί在此加强语气；πλατεῖαι可指宽阔街道或公共空地，正文采用符合行经场景的“街道”，并以脚注保留另一可能。
- source_word: ἐκφέρειν
  choice: 抬到
  rationale: 表示把病人从屋内带到外面；“抬到”符合病人需要由人搬运的具体场景。
- source_word: τοὺς ἀσθενεῖς
  choice: 病人
  rationale: 在医治语境中指患病、身体衰弱的人，而非泛指软弱者。
- source_word: τιθέναι
  choice: 安放
  rationale: 表达把病人放置在卧具上，并带有有意安排位置的语感。
- source_word: ἐπὶ κλιναρίων καὶ κραβάττων
  choice: 在小床和褥垫上
  rationale: 保留原文两种卧具的区别；“小床”和“褥垫”是现代中文中清楚而不过度技术化的表达。
- source_word: ἵνα
  choice: 好让
  rationale: 表达众人这样安置病人的目的或期待。
- source_word: ἐρχομένου Πέτρου
  choice: 彼得经过时
  rationale: 属格独立结构描写彼得行经他们附近；“经过时”简洁传达持续移动的场景。
- source_word: κἂν
  choice: 哪怕
  rationale: 突出众人所期待的最低限度接触：即使只是影子遮到也好；“哪怕”在中文中自然保留这种语气。
- source_word: ἡ σκιὰ
  choice: 他的影子
  rationale: 按字面指彼得的影子，没有将其解释为象征。
- source_word: ἐπισκιάσῃ
  choice: 能遮到
  rationale: 保留“投影遮在其上”的基本图像；“能”配合目的从句和虚拟语气，表达所期待的可能性，而不断言已经发生。
- source_word: τινὶ αὐτῶν
  choice: 他们中间的某个人
  rationale: 准确反映单数不定代词与复数属格的组合，指聚集者中的任何一个人，避免“有些人”可能带来的复数化。
theological_decisions:
- issue: 本节是否断言彼得的影子本身具有医治能力
  choice: 译文只陈述众人的目的和期待，不断言影子实施了医治。
  alternative: 采用暗示彼得的影子实际具有或施行医治能力的措辞。
  rationale: 原文以ἵνα加虚拟式呈现众人安放病人的目的；本节本身没有明确说影子使人痊愈。译文保留这一叙事限度，同时不否认上下文所记载的众多医治。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“以致”承接上文结果，“好让”清楚标示众人的目的；“哪怕”保留κἂν所表达的最低期待。“遮到”维持影子覆盖身体的具体图像，且避免把期待写成已经成就的医治事实。
