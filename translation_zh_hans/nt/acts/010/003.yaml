id: ACT.10.3
reference: Acts 10:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἶδεν ἐν ὁράματι φανερῶς ὡσεὶ ⸀περὶ ὥραν ἐνάτην τῆς ἡμέρας ἄγγελον τοῦ θεοῦ εἰσελθόντα πρὸς αὐτὸν καὶ εἰπόντα αὐτῷ· Κορνήλιε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/003.yaml
  text: He saw clearly in a vision[a], about the ninth hour of the day, an angel of God coming in to him and saying to him[b], “Cornelius.”
translation:
  language: zh_hans
  text: 他在异象中清楚地[b]看见：约在白天第九时[a]，上帝的一位天使进到他面前，对他说：“哥尼流！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 按现代计时，约为下午三点。
    reason: cultural_note
  - marker: b
    text: 或译：“明明地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδεν
  choice: 看见
  rationale: 不定过去时直陈语气，叙述一次具体的看见；“看见”自然且保留异象经历的具体性。
- source_word: ἐν ὁράματι
  choice: 在异象中
  rationale: ὅραμα指所见的异象或超自然景象；“在异象中”准确、庄重，也不额外限定其发生方式。
- source_word: φανερῶς
  choice: 清楚地
  rationale: 该副词强调所见清晰、明确；“清楚地”符合现代汉语，同时保留“明明地”等近义理解的余地。
- source_word: ὡσεὶ περὶ ὥραν ἐνάτην τῆς ἡμέρας
  choice: 约在白天第九时
  rationale: 保留原文按日出后计时的表达；“约”综合传达ὡσεὶ与περὶ所表达的近似含义，现代时间换算置于脚注。
- source_word: ἄγγελον τοῦ θεοῦ
  choice: 上帝的一位天使
  rationale: 异象语境表明ἄγγελος在此是属天的使者；“天使”比泛称“使者”更准确，且不作超出原文的扩展。
- source_word: εἰσελθόντα πρὸς αὐτὸν
  choice: 进到他面前
  rationale: 兼顾εἰσέρχομαι所含“进入”的动作和πρὸς αὐτόν所指向的本人；中文表达简洁自然。
- source_word: καὶ εἰπόντα αὐτῷ
  choice: 对他说
  rationale: 原文为与前一分词并列的不定过去时分词；中文转换为顺承谓语，更符合自然叙事，又不改变动作关系。
- source_word: Κορνήλιε
  choice: 哥尼流
  rationale: 这是Κορνήλιος的呼格形式；采用现代中文圣经人名的通行音译，以直接称呼和感叹号体现呼格语气。
theological_decisions:
- issue: 本节ἄγγελος的性质
  choice: 属天的天使
  alternative: 人的使者
  rationale: 本节明确说是在异象中看见“上帝的”ἄγγελος，紧接着的叙事也支持超自然使者这一通常含义；译文仅作“天使”，不附加其等级或本质等原文未说明的教义内容。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。冒号引出异象的具体内容，使“清楚地看见”自然统摄后文；脚注标记分别紧随其实际说明的词语，避免英文咨询层中标记与注释内容错位的问题。
