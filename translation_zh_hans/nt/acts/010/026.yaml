source:
  edition: SBLGNT
  text: ὁ δὲ Πέτρος ⸂ἤγειρεν αὐτὸν⸃ λέγων· Ἀνάστηθι· καὶ ἐγὼ αὐτὸς ἄνθρωπός εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/026.yaml
  text: But Peter raised him up[a], saying, “Stand up[c][b]; I too am a man.”
translation:
  language: zh_hans
  text: 彼得却扶他起来[a]，说：“起来吧[b]！我自己也是人[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “扶他起来”也可译作“把他拉起来”或“使他起来”。
    reason: lexical_alternative
  - marker: b
    text: “起来吧”也可译作“站起来”。
    reason: lexical_alternative
  - marker: c
    text: 或译：“连我自己也是人。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγειρεν αὐτὸν
  choice: 扶他起来
  rationale: ἐγείρω在此指使俯伏在地的哥尼流起身。“扶他起来”符合当下的身体动作，也比“叫他起来”更贴近及物结构，同时不具体断定彼得用了何种动作。
- source_word: Ἀνάστηθι
  choice: 起来吧
  rationale: ἀνίστημι的命令式在此直接要求哥尼流起身。“起来吧”是自然、庄重而不过分生硬的现代汉语。
- source_word: καὶ ἐγὼ αὐτὸς
  choice: 我自己也是
  rationale: καί表达“也”，αὐτός加强主语“我”的语气。“我自己也是”保留了彼得将自己包括在普通人之中的强调。
- source_word: ἄνθρωπός εἰμι
  choice: 是人
  rationale: ἄνθρωπος在这里强调彼得与哥尼流同属人类。“是人”直接简洁；不译作“不过是人”，以免加入原文没有明说的限制语气。
- source_word: δὲ
  choice: 却
  rationale: δέ承接上一节哥尼流俯伏在彼得脚前的举动，并标示彼得与之相反的纠正反应；“却”自然体现这一轻微转折。
theological_decisions:
- issue: 彼得对俯伏敬礼的回应
  choice: 译文呈现彼得制止这一举动，并以自己同样是人为理由。
  alternative: 也可仅理解为彼得谦逊地请哥尼流起身，而不进一步推论其神学意义。
  rationale: “我自己也是人”保留经文本身的理由，显明彼得拒绝被抬高到超越人类的地位，但不额外加入关于敬拜、圣职或圣徒尊崇的体系性结论。
translation_notes:
  register: 采用现代标准普通话和简体中文，语气自然、庄重、易懂。“却”体现上下文中的纠正性转折；引语保留简洁直接的口吻。所有脚注标记均置于相应正文之后。
