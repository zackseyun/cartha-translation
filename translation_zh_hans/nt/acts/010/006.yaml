base_translation:
  language: en
  yaml_path: translation/nt/acts/010/006.yaml
  text: He is lodging with a certain Simon[a], a tanner, whose house is by the sea.
translation:
  language: zh_hans
  text: 他住在一个名叫西门的皮匠家里；他的房子在海边。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ξενίζεται
  choice: 住在……家里
  rationale: 此处为现在时中间/被动形式，表示作为客人寄住或受接待；“住在……家里”在现代汉语中自然，也保留了寄居于他人住所的含义。
- source_word: παρά τινι Σίμωνι
  choice: 在一个名叫西门的……家里
  rationale: παρά加与格表示与某人同住或在某人处，τις带不定意味；汉语用“一个名叫西门的”自然表达这位人物此前未被特指。
- source_word: βυρσεῖ
  choice: 皮匠
  rationale: βυρσεύς指加工兽皮、鞣制皮革的人；“皮匠”简明且较“皮革工人”更贴近这一具体职业。
- source_word: ᾧ ἐστιν οἰκία
  choice: 他的房子
  rationale: 关系代词结构说明该房子属于西门；译为“他的房子”符合现代汉语表达，并保持指代清楚。
- source_word: παρὰ θάλασσαν
  choice: 在海边
  rationale: παρά加宾格在此表示临近；“在海边”准确而自然。
- source_word: οὗτος
  choice: 他
  rationale: οὗτος承接上文所指的人；现代汉语以“他”回指最自然，无须生硬译作“这人”。
theological_decisions: []
