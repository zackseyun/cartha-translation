base_translation:
  language: en
  yaml_path: translation/nt/acts/010/045.yaml
  text: And the believers from the circumcision who had come with Peter were astonished[c][b][a], because the gift of the Holy Spirit had been poured out even on the Gentiles.
translation:
  language: zh_hans
  text: 同彼得一起来的那些受过割礼的信徒[a]都惊讶不已，因为圣灵的恩赐竟然也[b]已经浇灌[c]在外邦人身上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“出于割礼的信徒”，指具有犹太背景的信徒；也可译“受割礼者中的信徒”。
    reason: lexical_alternative
  - marker: b
    text: 或译“也”。原文可表示附加；结合众人的惊讶，也可理解为强调：“竟然连外邦人也……”。
    reason: lexical_alternative
  - marker: c
    text: 原文动词为完成时，强调浇灌已经发生，其结果仍然存在；也可译“浇灌了”。
    reason: aspectual_clarification
lexical_decisions:
- source_word: ἐξέστησαν
  choice: 惊讶不已
  rationale: 该动词在此表达强烈的惊异；“惊讶不已”自然、庄重，也比“失去常态”等字面表达更符合本段语境。
- source_word: οἱ ἐκ περιτομῆς πιστοὶ
  choice: 受割礼的信徒
  rationale: 原文直译为“出于割礼的信徒”，在本段指具有犹太背景、以割礼为群体标志的信徒；正文采用现代汉语中清楚自然的表达，并以脚注保留原文构式。
- source_word: ὅσοι συνῆλθαν τῷ Πέτρῳ
  choice: 同彼得一起来的那些
  rationale: συνέρχομαι与彼得的与格在此表示同行；此定语限定上述信徒，即随彼得来到哥尼流家的人。
- source_word: καὶ ἐπὶ τὰ ἔθνη
  choice: 竟也……在外族人身上
  rationale: ἔθνη在本章与受割礼者相对，指非犹太人；καί具有附加义，而上下文的惊讶使其自然带有“竟然连……也”的强调意味。“竟也”传达此语用效果，同时脚注保留单纯“也”的可能。
- source_word: ἡ δωρεὰ τοῦ ἁγίου πνεύματος
  choice: 圣灵的恩赐
  rationale: “圣灵的恩赐”保持属格结构，不强行判定是“圣灵这份恩赐”还是“圣灵所赐的恩赐”，从而保留原文可能具有的语义张力。
- source_word: ἐκκέχυται
  choice: 已经浇灌
  rationale: 完成时被动态表示浇灌已经发生且结果仍然可见；“已经浇灌”在汉语叙事中自然地表达完成及现存结果。
theological_decisions:
- issue: ἔθνη在犹太信徒与非犹太人之对比中的所指
  choice: 外族人
  alternative: 列国；外邦人；非犹太人
  rationale: 使徒行传第10章的直接对比是受割礼的犹太信徒与未受割礼的非犹太人。“外族人”清楚表达这一所指，又避免把词义扩展为抽象的国家实体。
- issue: τοῦ ἁγίου πνεύματος属格关系
  choice: 圣灵的恩赐
  alternative: 圣灵这份恩赐；圣灵所赐的恩赐
  rationale: 原文属格本身可理解为圣灵就是所赐的礼物，也可理解为与圣灵相关或由圣灵而来的恩赐；采用未加解释的属格表达，不在翻译中排除任一理解。
- issue: ἐκκέχυται的完成体意义
  choice: 已经浇灌
  alternative: 浇灌了；一直浇灌
  rationale: 保留行动已经完成并产生持续结果的意义，不将其误解为单纯过去事件或持续进行的动作。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“惊讶不已”传达强烈反应；“浇灌”保留经文中圣灵降下的传统意象。句序按现代汉语调整，将同行者的限定语前置，但保留原文各语义成分及因果关系。
