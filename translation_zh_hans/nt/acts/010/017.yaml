  text: Ὡς δὲ ἐν ἑαυτῷ διηπόρει ὁ Πέτρος τί ἂν εἴη τὸ ὅραμα ὃ εἶδεν, ⸀ἰδοὺ οἱ ἄνδρες οἱ ἀπεσταλμένοι ⸀ὑπὸ τοῦ Κορνηλίου διερωτήσαντες τὴν οἰκίαν ⸀τοῦ Σίμωνος ἐπέστησαν ἐπὶ τὸν πυλῶνα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/017.yaml
  text: While Peter was inwardly perplexed as to what the vision that he had seen might mean[a], behold, the men who had been sent by Cornelius, having asked directions to Simon’s house[b], stood at the gate.
translation:
  language: zh_hans
  text: 彼得心里正在困惑，不知道自己所见的异象究竟是什么意思[a]。看哪，哥尼流所差来的人已经问过西门的家在哪里，正站在大门口[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“自己所见的异象究竟是什么。”希腊文直译更接近这种说法，但这里很可能是指异象的含义或意义。
    reason: lexical_alternative
  - marker: b
    text: 或译：“门道。”希腊文这个词可指房屋的大门、门道或入口区域。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ
  choice: 正在……时
  rationale: 以进行中的时间背景承接叙事；中文通过“正在”及后句的发展自然表达轻微的转折推进，无须另加“如今”。
- source_word: ἐν ἑαυτῷ
  choice: 心里
  rationale: 自然表达彼得内在的思索和困惑。
- source_word: διηπόρει
  choice: 正在困惑
  rationale: 保留未完成时所表达的持续状态，也体现该动词较强的茫然、不解之意。
- source_word: τί ἂν εἴη
  choice: 究竟是什么意思
  rationale: 按语境表达彼得在探究异象的含义；希腊文较直译可作“究竟是什么”，故加脚注保留其歧义。
- source_word: τὸ ὅραμα ὃ εἶδεν
  choice: 自己所见的异象
  rationale: 简洁自然地保留关系从句和彼得亲自看见异象的意思。
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留原文引人注意、使叙事场景突然转向的标记。
- source_word: οἱ ἄνδρες οἱ ἀπεσταλμένοι ὑπὸ τοῦ Κορνηλίου
  choice: 哥尼流所差来的人
  rationale: 忠实表达被动分词的差遣关系，同时符合现代汉语习惯。
- source_word: διερωτήσαντες τὴν οἰκίαν τοῦ Σίμωνος
  choice: 已经打听到西门的家
  rationale: 不把分词机械译作“问了”，而是自然表达他们询问位置并找到该住处，且保留该动作先于站在门口发生。
- source_word: ἐπέστησαν ἐπὶ τὸν πυλῶνα
  choice: 正站在门口
  rationale: 表达他们来到后站在入口处；“门口”在现代汉语中可自然涵盖大门或门道区域。
