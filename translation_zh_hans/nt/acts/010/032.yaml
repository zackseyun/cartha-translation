  text: πέμψον οὖν εἰς Ἰόππην καὶ μετακάλεσαι Σίμωνα ὃς ἐπικαλεῖται Πέτρος· οὗτος ξενίζεται ἐν οἰκίᾳ Σίμωνος βυρσέως παρὰ ⸀θάλασσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/032.yaml
  text: Therefore send to Joppa and summon Simon[a], who is called Peter. He is lodging in the house of Simon, a tanner[b], by the sea.
translation:
  language: zh_hans
  text: 所以，你要派人到约帕去，请那位称为彼得的西门来[a]。他正作客于制革匠西门在海边的家里[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把那位称为彼得的西门召来。”原文动词指叫人把某人请到自己这里来。
    reason: lexical_alternative
  - marker: b
    text: 或译：“住在……家里”；原文含有作为客人受接待的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: πέμψον
  choice: 派人
  rationale: 不定过去时命令式要求采取直接行动；结合后文所派使者的语境，“派人”比单说“派”更符合现代汉语。
- source_word: οὖν
  choice: 所以
  rationale: 承接前面的启示，表明由此得出的指示；“所以”自然保留推论关系。
- source_word: εἰς Ἰόππην
  choice: 到约帕去
  rationale: εἰς与地名连用表示方向；“到约帕去”是自然、明确的普通话表达。
- source_word: μετακάλεσαι
  choice: 请……来
  rationale: 该中间语态动词表示叫人把某人请到自己这里来；“请……来”既保留方向意味，也符合使者受命邀请彼得的语境。
- source_word: Σίμωνα ὃς ἐπικαλεῖται Πέτρος
  choice: 那位称为彼得的西门
  rationale: 忠实表达彼得是这位西门所用或为人所知的另一个名字，不额外加入“又名”等原文未明说的关系。
- source_word: οὗτος
  choice: 他
  rationale: 指回前句的西门彼得；现代汉语用“他”比“这个人”自然。
- source_word: ξενίζεται
  choice: 正在……作客
  rationale: 该形式在此表示彼得作为客人受人接待；“作客”比普通的“住”更能体现款待语义，“正在”表达现在时态。
- source_word: ἐν οἰκίᾳ Σίμωνος βυρσέως
  choice: 在……一个制革匠西门的家里
  rationale: 保留οἰκία的“家/房屋”概念，并清楚说明另一位西门以制革为业。
- source_word: παρὰ θάλασσαν
  choice: 海边
  rationale: παρά加宾格在此表示临近海的地点；“海边”简洁自然。
theological_decisions: []
