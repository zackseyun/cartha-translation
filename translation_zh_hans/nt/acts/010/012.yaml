  text: ἐν ᾧ ὑπῆρχεν πάντα τὰ τετράποδα ⸂καὶ ἑρπετὰ τῆς γῆς καὶ⸃ πετεινὰ τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/012.yaml
  text: In it were all the four-footed animals and reptiles of the earth[c][b][a], and birds of the sky.
translation:
  language: zh_hans
  text: 其中[a]有各样四足动物、地上爬行的动物[b]和天空中的飞鸟[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在那里面”。
    reason: lexical_alternative
  - marker: b
    text: 或译“地上的爬虫”。
    reason: lexical_alternative
  - marker: c
    text: 或译“天上的飞鸟”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: 其中
  rationale: 关系代词回指彼得异象中所见、如同大布的物体；“其中”自然地保留了处所含义，也不把该物体进一步解释为容器。
- source_word: ὑπῆρχεν
  choice: 有
  rationale: 这里的未完成时表示这些动物存在于其中；汉语用“有”简洁自然，避免采用含义更强的“装着”。
- source_word: πάντα
  choice: 各样
  rationale: πάντα统摄所列动物类别。“各样”在汉语列举语境中表达全面广泛的范围，同时避免让“所有”被误解为世上每一只动物都在其中。
- source_word: τὰ τετράποδα
  choice: 四足动物
  rationale: 直译其“四只脚的动物”之义；“四足动物”清楚、现代，也不像“四足兽”那样可能把范围限得过窄。
- source_word: ἑρπετὰ τῆς γῆς
  choice: 地上爬行的动物
  rationale: ἑρπετά的范围可广于现代生物分类中的“爬行动物”；此译保留“爬行之物”的广义及τῆς γῆς的地上属性。
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: 天空中的飞鸟
  rationale: πετεινά在此动物分类中自然指飞鸟；οὐρανός按可见空间译作“天空”，不赋予属灵天界的含义。
- source_word: καὶ ... καὶ
  choice: 、……和
  rationale: 按现代汉语列举习惯连接三个类别，清楚体现希腊文各项之间的并列关系。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事用语。“四足动物”和“地上爬行的动物”保留古代动物分类的表达，不将其强行套入现代生物学类别；脚注标记均紧随相关词组。
