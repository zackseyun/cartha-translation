base_translation:
  language: en
  yaml_path: translation/nt/acts/010/040.yaml
  text: God raised this one on the third day and granted him to become visible[b][a],
translation:
  language: zh_hans
  text: 这一位[a]，神在第三天使他复活，又使他显现出来[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他”或“这位”；原文的指示代词置于句首，带有强调意味。
    reason: lexical_alternative
  - marker: b
    text: 或译“又让他显现”或“又使他成为可见的”；原文直译为“赐给他成为可见的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτον
  choice: 这人
  rationale: 指示代词置于句首，着重指向上文所说的耶稣。“这人”既保留指示和强调作用，也符合现代汉语表达。
- source_word: ὁ θεὸς
  choice: 神
  rationale: 作句子的主语；译为“神”简洁直接。
- source_word: ἤγειρεν
  choice: 使他复活
  rationale: 在复活语境中，ἐγείρω表示使死人起来；“使他复活”在现代汉语中清楚表达神的行动。
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: 在第三天
  rationale: 保留时间与格的通常意义，不额外限定日期算法。
- source_word: ἔδωκεν
  choice: 使……得以
  rationale: 此处与不定式结构连用，含有赐予、使之成为可能的意思；“使……得以”比逐字译作“给”自然，也没有把表达简化为单纯的“出现”。
- source_word: αὐτὸν
  choice: 他
  rationale: 指向耶稣，采用现代汉语通常的人称代词。
- source_word: ἐμφανῆ
  choice: 显现
  rationale: ἐμφανής表示可见、显明；在复活后向人显现的语境中，“显现”自然且保留其被看见、显明出来的含义。
- source_word: γενέσθαι
  choice: 得以显现
  rationale: γίνομαι带有成为、进入某种状态的动态意味；“得以显现”在自然汉语中保留这一变化和实现的语气。
theological_decisions:
- issue: 复活的表述
  choice: 这人，神在第三天使他复活
  alternative: 神在第三天使他复活
  rationale: 保留原文句首指示代词的强调，同时直接陈述神使耶稣复活，不增添原文以外的解释。
- issue: 复活后的显现
  choice: 又使他得以显现
  alternative: 又使他出现／又使他成为可见的
  rationale: 原文将“复活”与随后“得以显现”并列区分；所选译法保留这种区分，也兼顾ἔδωκεν与ἐμφανῆ γενέσθαι的表达，不预先断定显现方式。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“这人”保留原文句首的强调；“使他得以显现”避免生硬直译，同时维持复活与显现之间的区分。
