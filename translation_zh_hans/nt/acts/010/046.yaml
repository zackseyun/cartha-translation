  language: zh_hans
  text: 因为他们听见这些人用方言说话，并尊上帝为大[a]。于是彼得回应说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“用语言说话”。希腊语γλῶσσα可指“舌头”或“语言”；这里的用法未明确这种言语的具体性质。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουον
  choice: 听见
  rationale: 未完成时描写当时持续发生的听闻；现代汉语用“听见”配合后续并列动作即可自然表达，不必生硬加入“正在”。
- source_word: γὰρ
  choice: 因为
  rationale: 说明上一节判断的依据；“因为”在现代汉语中清楚自然地表达解释关系。
- source_word: αὐτῶν
  choice: 这些人
  rationale: 该代词回指前文刚提到的人；汉语补出“这些人”比单用“他们”更能避免与听者混淆，同时不加入“外族人”等解释性称谓。
- source_word: λαλούντων
  choice: 说话
  rationale: 与“尊……为大”同为听见的内容；“说话”是自然、直接的对应。
- source_word: γλώσσαις
  choice: 用方言
  rationale: γλῶσσα可指舌头，也可指语言；“说方言”是中文圣经语境中可识别的表达，但可能被理解为不同语言或特殊言语，因此以脚注保留“用各种语言”的可能。
- source_word: μεγαλυνόντων
  choice: 尊上帝为大
  rationale: 保留μεγαλύνω“使为大、颂扬”的字面意象及敬拜意味，比单译“赞美”更贴近原词。
- source_word: τὸν θεόν
  choice: 上帝
  rationale: 直接宾语，采用现代标准汉语中庄重且通行的称呼。
- source_word: τότε
  choice: 于是
  rationale: 既标示随后发生的事件，也自然承接前述依据及彼得的回应。
- source_word: ἀπεκρίθη
  choice: 回应说
  rationale: ἀποκρίνομαι可表示回答或作出回应；此处没有明说先前有人提问，“回应说”既贴近原义，也符合汉语叙事习惯。
- source_word: Πέτρος
  choice: 彼得
  rationale: 采用通行的中文人名译法。
theological_decisions:
- issue: γλώσσαις在圣灵所赐言语语境中的含义
  choice: 用方言
  alternative: 用各种语言
  rationale: 原词及短语可以指语言，也形成了“说方言”的特定表达。正文不把它明确限定为已知的人类语言或忘我式言语；脚注保留词义上的另一种理解，以维持原文的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“尊上帝为大”有意保留原文的字面意象；冒号保留本节与下一节彼得言语的衔接。
