  text: καὶ συνομιλῶν αὐτῷ εἰσῆλθεν, καὶ εὑρίσκει συνεληλυθότας πολλούς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/027.yaml
  text: And talking with him[a], he entered and found many gathered together.
translation:
  language: zh_hans
  text: 彼得同他说着话，便进去了，看见许多人已经聚集在一起。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文在“进去了”之后改用历史现在时，直译为“就看见许多人已经聚集在一起”，使叙述更显生动。
    reason: 说明希腊文由不定过去时转为历史现在时的叙事特点；正文按自然中文叙事处理。
lexical_decisions:
- source_word: συνομιλῶν
  choice: 同他说着话
  rationale: 现在时分词表示与“走了进去”同时进行的动作；“说着话”自然传达持续交谈的意味。
- source_word: αὐτῷ
  choice: 同他
  rationale: 与 συνομιλέω 连用的与格表示交谈的对象；“同他”保留原文代词，也符合现代汉语表达。
- source_word: εἰσῆλθεν
  choice: 便走了进去
  rationale: 不定过去时主干动词推进叙事；“走了进去”自然清楚，“便”衔接同时发生的交谈动作。
- source_word: εὑρίσκει
  choice: 看见
  rationale: 原文采用历史现在时，使叙述更生动；中文正文用完成体叙事的“看见”较为顺畅，并在脚注说明时态特点。
- source_word: συνεληλυθότας
  choice: 已经聚集在那里
  rationale: 完成时主动分词既表明众人先前已经聚集，也突出彼得进去时他们正处于聚集的状态；“已经”保留完成后的结果状态。
- source_word: πολλούς
  choice: 许多人
  rationale: 该形容词作名词使用，指人数众多的人；中文补出“人”清楚自然。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。主语“彼得”承接上文明确补出，避免汉语连续使用“他”造成指代混乱；宾语仍保留原文的代词“他”。
