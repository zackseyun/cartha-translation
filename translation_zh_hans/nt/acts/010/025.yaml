id: ACT.10.25
reference: Acts 10:25
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὡς δὲ ἐγένετο τοῦ εἰσελθεῖν τὸν Πέτρον, συναντήσας αὐτῷ ὁ Κορνήλιος πεσὼν ἐπὶ τοὺς πόδας προσεκύνησεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/025.yaml
  text: And when Peter entered[a], Cornelius met him and fell at his feet and paid him homage.
translation:
  language: zh_hans
  text: 彼得进去的时候，哥尼流迎接他，俯伏在他脚前，向他下拜。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“敬拜他。”希腊语动词按语境既可指敬拜，也可指俯伏致敬。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἐγένετο τοῦ εἰσελθεῖν τὸν Πέτρον
  choice: 彼得进去的时候
  rationale: 这一希腊语叙事习语交代彼得进入时发生的事；译成“……的时候”自然地保留时间关系，不生硬复现原文结构。δέ在汉语连续叙事中无需另加连接词。
- source_word: συναντήσας αὐτῷ
  choice: 迎接他
  rationale: συναντάω在这里指哥尼流前来与彼得相会；结合彼得来访的场景，“迎接”比单纯“遇见”更符合动作方向和现代汉语表达。
- source_word: πεσὼν ἐπὶ τοὺς πόδας
  choice: 俯伏在他脚前
  rationale: 保留哥尼流伏倒在彼得脚前的具体姿态及自我卑抑意味；“俯伏”庄重而易懂。
- source_word: προσεκύνησεν
  choice: 向他下拜
  rationale: προσκυνέω可指敬拜，也可指俯伏致敬。“下拜”与前面的身体姿态相合，并保留过度尊崇的严肃性，同时不在正文中预先断定这是专属神明的敬拜；另一可能译法收入脚注。
theological_decisions:
- issue: 如何表达哥尼流对彼得所行的 προσκυνέω
  choice: 向他下拜
  alternative: 敬拜他
  rationale: 该动词的语义范围包括俯伏致敬和敬拜。下一节彼得以自己也是人为由制止哥尼流，说明这一举动不当；但本节本身未明确界定哥尼流的主观神学理解。因此正文保留可见行为及其敬崇意味，脚注注明较强的译法，避免消除原文张力或作教义性过度判断。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。“俯伏在他脚前，向他下拜”清楚呈现动作，也保留 προσκυνέω 在“敬拜”与“俯伏致敬”之间的语义张力。
