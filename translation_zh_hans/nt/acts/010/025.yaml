  naturalness: “彼得进去的时候，哥尼流迎接他，俯伏在他脚前，向他下拜”是自然、庄重且符合现代标准汉语圣经叙事语体的表达。“进去的时候”在此上下文中清楚指进入哥尼流所在之处。
