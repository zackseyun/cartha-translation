  text: ὑμεῖς οἴδατε τὸ γενόμενον ῥῆμα καθ’ ὅλης τῆς Ἰουδαίας, ⸀ἀρξάμενος ἀπὸ τῆς Γαλιλαίας μετὰ τὸ βάπτισμα ὃ ἐκήρυξεν Ἰωάννης,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/037.yaml
  text: You yourselves know the thing that happened throughout all Judea[a], beginning from Galilee after the baptism that John proclaimed[b],
translation:
  language: zh_hans
  text: 你们自己知道那件发生在整个犹太地区的事[a]，就是在约翰所宣讲的洗礼之后，从加利利开始的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“传遍整个犹太地区的信息”。希腊词ῥῆμα可指“话、信息”或“事情”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文的“开始”在句法上衔接较为突兀，但清楚表明这事以加利利为起点。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς οἴδατε
  choice: 你们自己知道
  rationale: 显明主语“你们”带有强调作用；译作“你们自己”既保留强调，也符合现代汉语表达。οἴδατε在此具有现在时意义，译作“知道”。
- source_word: τὸ γενόμενον ῥῆμα
  choice: 那件……的事
  rationale: ῥῆμα可指“话、信息、事情”；与γενόμενον结合并按上下文指向有关耶稣的一连串公开事件，正文译作“事”，同时以脚注保留“信息传开”的可能理解。
- source_word: καθ’ ὅλης τῆς Ἰουδαίας
  choice: 传遍了整个犹太
  rationale: κατά加属格表示遍及某区域；结合ῥῆμα的语义，译作“传遍”能自然表达此事为全境所知，但比单纯的“发生在”略带传播意味，故脚注说明另一译法。
- source_word: ἀρξάμενος ἀπὸ τῆς Γαλιλαίας
  choice: 从加利利开始的
  rationale: ἀπό保留起点含义。分词在希腊文中与前文的句法搭配不规整；汉语以“从……开始的”承接“事”，不额外指定其他主语。
- source_word: μετὰ τὸ βάπτισμα
  choice: 洗礼以后
  rationale: μετά加宾格在此表示时间先后；“洗礼”是现代汉语基督教语境中清楚而通行的对应词。
- source_word: ὃ ἐκήρυξεν Ἰωάννης
  choice: 约翰宣讲洗礼
  rationale: 关系代词ὃ指向“洗礼”；κηρύσσω具有公开宣告、传讲之意。“宣讲”保留其公开传播色彩，又避免把它局限为讲坛讲道。
theological_decisions:
- issue: ῥῆμα在彼得概述中的含义
  choice: 正文译作“事”，涵盖众所周知的事件及与之相伴的信息。
  alternative: 可译为“传遍整个犹太的信息”或“发生在整个犹太的事”。
  rationale: 上下文既涉及可被人知道的公开事件，又容许“话语／信息”的词义。正文不把它缩减为单一话语，脚注则保留原词的真实多义性。
- issue: ἀρξάμενος的句法所指
  choice: 在汉语中用“从加利利开始的”修饰前面的“事”。
  alternative: 可处理为独立说明：“这事从加利利开始。”
  rationale: 原文分词为阳性，而前面的ῥῆμα为中性，句法搭配较为突兀；译文传达清楚的起点意义，却不借此加入原文没有明说的神学解释。
- issue: 约翰所“宣讲”的内容
  choice: 译作“约翰宣讲洗礼”。
  alternative: 可译作“约翰所传讲的洗礼”或“约翰宣告要人受的洗礼”。
  rationale: 关系代词直接指向βάπτισμα。正文维持原文简洁，不补入洗礼方式、对象或教派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“整个犹太”保留地域名称及全境范围；句末改为完整汉语句号，虽本节在更大句法单元中继续，单节呈现仍自然可读。所有脚注标记均已置于正文相应位置。
