  text: καὶ θεωρεῖ τὸν οὐρανὸν ἀνεῳγμένον καὶ ⸀καταβαῖνον σκεῦός τι ὡς ὀθόνην μεγάλην τέσσαρσιν ⸀ἀρχαῖς καθιέμενον ἐπὶ τῆς γῆς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/011.yaml
  text: and he sees heaven opened[a], and something like a large sheet descending, being lowered by its four corners to the earth[c][b],
translation:
  language: zh_hans
  text: 他看见天已经开了[a]，有一件东西降下来，像一大块布[b]，从四个角被放下，落到地上[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “天”也可译作“天空”。希腊语 οὐρανός 可指天空或天上；这里处于异象和启示的语境中。
    reason: lexical_alternative
  - marker: b
    text: “一件东西”也可译作“某件器物”或“一个器皿”。希腊语 σκεῦός τι 的所指并不明确。
    reason: lexical_alternative
  - marker: c
    text: “从四个角被放下”也可译作“由四端被放下”。
    reason: lexical_alternative
lexical_decisions:
- source_word: θεωρεῖ
  choice: 他看见
  rationale: 用现代汉语自然表达叙事现在时所带来的现场感，不采用较古雅的“观看”或“看见了”。
- source_word: οὐρανὸν ἀνεῳγμένον
  choice: 天开了
  rationale: “天”在中文中可兼有天空与属天领域的意味，既适合异象语境，也保留原文 οὐρανός 的一定语义张力；“开了”自然表达其开启状态。
- source_word: καταβαῖνον
  choice: 降下来
  rationale: 自然、清楚地表达持续向下移动，比“下降”更符合普通现代汉语叙事。
- source_word: σκεῦός τι
  choice: 有个东西
  rationale: σκεῦος 语义宽泛，τι 又使所指不确定；“东西”避免武断限定为器皿或容器。
- source_word: ὡς ὀθόνην μεγάλην
  choice: 仿佛一大块布
  rationale: ὡς 明示比拟；ὀθόνη 可指大片布或布单。“一大块布”自然且不额外指定材质或用途。
- source_word: τέσσαρσιν ἀρχαῖς
  choice: 由四角
  rationale: ἀρχαί 在此指边端；对于仿佛大布的物体，“四角”最合乎中文图像表达，同时脚注保留“四端”的可能。
- source_word: καθιέμενον
  choice: 垂降
  rationale: 表达被动地向下放落，并避免与前面的“降下来”完全重复；“垂降”保持异象叙述的庄重感。
- source_word: ἐπὶ τῆς γῆς
  choice: 到地上
  rationale: 结合向下运动，ἐπί 表示朝向并到达地面；“到地上”比“到大地”更自然，又不必断定已经落地。
theological_decisions:
- issue: 异象语境中 οὐρανός 的译法
  choice: 天
  alternative: 天空；天上
  rationale: “天”既可指可见天空，也可指神圣启示所从出的属天领域，能在现代中文中保留原词的歧义；正文不把它收窄为纯气象意义的“天空”，脚注说明两种理解。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准普通话。保留异象叙事的现场感与 σκεῦός τι 的不确定性；以“天”兼顾 οὐρανός 的天空／天上两义，并用脚注明示词义选择。所有脚注标记均已置于正文。
