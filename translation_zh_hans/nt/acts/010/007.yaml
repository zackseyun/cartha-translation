  text: ὡς δὲ ἀπῆλθεν ὁ ἄγγελος ὁ λαλῶν ⸀αὐτῷ, φωνήσας δύο τῶν ⸀οἰκετῶν καὶ στρατιώτην εὐσεβῆ τῶν προσκαρτερούντων αὐτῷ
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/007.yaml
  text: When the angel who was speaking to him had gone away[a], he called two of his household servants and a devout soldier from among those attending him.
translation:
  language: zh_hans
  text: 那位跟他说话的天使离开后，哥尼流叫来两个家仆[a]，又从常在他身边侍候的人中叫来一个虔诚的士兵。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “家仆”也可译作“家中的奴仆”。希腊语οἰκέτης指属于家庭、以奴仆身份服役的人；这里用“家仆”是为使汉语表达自然，同时保留其家庭服役的背景。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἀπῆλθεν
  choice: 离开后
  rationale: 以自然的汉语时间结构表达天使离去在先、哥尼流召人在后的关系；δέ不必机械译出。
- source_word: ὁ ἄγγελος ὁ λαλῶν αὐτῷ
  choice: 那位跟他说话的天使
  rationale: 上下文明确指异象中的天上使者，故译“天使”；关系结构保留其作为先前说话者的辨识作用。
- source_word: φωνήσας
  choice: 叫来
  rationale: 表达召唤人到面前的动作，并使本节在现代汉语中顺畅；施事者“哥尼流”由上下文补明。
- source_word: δύο τῶν οἰκετῶν
  choice: 两个家仆
  rationale: οἰκέτης指隶属于家庭、从事服役的人；“家仆”简洁保留家庭服役背景，也不掩盖其可能具有奴仆身份。
- source_word: στρατιώτην εὐσεβῆ
  choice: 一个虔诚的士兵
  rationale: εὐσεβής表示敬虔、虔敬，译作“虔诚”自然且不额外加入“敬畏上帝”等原词未明说的限定。
- source_word: τῶν προσκαρτερούντων αὐτῷ
  choice: 从常在他身边侍候的人中
  rationale: “从……人中”体现部分属格；“常在他身边侍候”兼顾προσκαρτερέω所含持续、专心随侍之意。
theological_decisions:
- issue: ἄγγελος在本段中的性质
  choice: 天使
  alternative: 使者
  rationale: 使徒行传10章的直接语境明确描述哥尼流异象中的天上来使，因此采用“天使”，而非泛称“使者”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“跟他说话”较口语自然，“侍候”则保留随身服役的语义。补出“哥尼流”以避免连续两个男性指称造成歧义；末句虽承接下一节的差遣动作，本节仍按汉语表达成完整句。
