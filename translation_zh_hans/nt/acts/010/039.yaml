  text: καὶ ⸀ἡμεῖς μάρτυρες πάντων ὧν ἐποίησεν ἔν τε τῇ χώρᾳ τῶν Ἰουδαίων ⸀καὶ Ἰερουσαλήμ· ὃν καὶ ἀνεῖλαν κρεμάσαντες ἐπὶ ξύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/039.yaml
  text: And we are witnesses of all that he did both in the land of the Jews and in Jerusalem[a]. They also put him to death by hanging him on a tree.
translation:
  language: zh_hans
  text: 我们是他在犹太人之地和耶路撒冷所做的一切事的见证人。他们把他挂在木头上[a]，处死了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“树上”；也可按事件背景意译为“十字架上”。希腊文用的是“木头／树木”一词，可能呼应《申命记》21:23。
    reason: 说明 ξύλον 的词义范围及其可能的旧约呼应，同时避免正文直接消除原文的表达张力。
lexical_decisions:
- source_word: μάρτυρες
  choice: 见证人
  rationale: 既准确表达亲眼见证并作证的人，也符合现代汉语中法律性、见证性的语境。
- source_word: πάντων ὧν ἐποίησεν
  choice: 他……所做一切事
  rationale: 保留 πάντων 的全面含义，并以自然的汉语关系结构表达。
- source_word: ἔν τε τῇ χώρᾳ τῶν Ἰουδαίων
  choice: 在犹太人之地
  rationale: χώρα 可指土地、地区或地域；“犹太人之地”保留属格结构及地域含义，不把它过度限定为罗马行政区“犹太省”。
- source_word: καὶ Ἰερουσαλήμ
  choice: 和耶路撒冷
  rationale: 汉语中前置的“在”可自然统摄两个并列地点，无须重复。
- source_word: ἀνεῖλαν
  choice: 处死了
  rationale: 表达此处“杀死、除掉”的意思，并符合执行死刑的语境，语体庄重而不古奥。
- source_word: κρεμάσαντες ἐπὶ ξύλου
  choice: 把他挂在木头上
  rationale: 以方式关系连接“处死”，并保留 ξύλον 的“木头／树木”措辞及其可能引发的经文呼应，而不直接改译为“十字架”。
theological_decisions:
- issue: 受难语境中 ξύλου 的译法
  choice: 木头
  alternative: 树；十字架
  rationale: 原文使用 ξύλον，而非 σταυρός。“木头”保留其“木材／树木”的词义范围以及对《申命记》21:23 的可能呼应；直接译作“十字架”虽合乎事件背景，却会把原文含蓄的关联解释得更明确。
translation_notes:
  register: 采用现代、庄重而通俗的书面汉语。“犹太人之地”略带经文语体，但仍易懂，并保留原文地域属格的开放性；“挂在木头上处死”清楚表达分词所说明的处死方式。
