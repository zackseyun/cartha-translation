base_translation:
  language: en
  yaml_path: translation/nt/acts/010/029.yaml
  text: Therefore I came without objection when I was sent for[a]. So I ask[b], for what reason did you send for me?
translation:
  language: zh_hans
  text: 所以，我应召而来，毫无异议[a]。现在我想问：你们为什么请我来[b]？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“毫不犹豫地”。希腊文更确切的意思是“不反对”或“不争辩”。
    reason: lexical_alternative
  - marker: b
    text: 直译“你们为了什么缘故请我来？”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ καὶ
  choice: 所以
  rationale: 承接彼得此前对上帝指示的说明，表达由此得出的行动；καί的轻微强调不宜在汉语中生硬直译，融入句势。
- source_word: ἀναντιρρήτως
  choice: 毫无异议地
  rationale: 保留该词“不反对、不争辩”的核心意义，比“毫不犹豫”更贴近希腊文，同时现代汉语仍能自然理解。
- source_word: ἦλθον
  choice: 我就……来了
  rationale: 直陈彼得已经前来；“就”自然体现前因后果和随即响应的语气。
- source_word: μεταπεμφθείς
  choice: 有人来请我
  rationale: 以汉语主动式自然表达希腊文被动分词“被派人召来／被请来”，并与后文“请我来”保持词义呼应。
- source_word: πυνθάνομαι οὖν
  choice: 现在我想问
  rationale: πυνθάνομαι表示询问，οὖν在此兼具承接和转折到提问的作用；“现在”使汉语话语推进自然，不重复使用“所以”。
- source_word: τίνι λόγῳ
  choice: 为什么
  rationale: 自然表达“出于什么缘故／为着什么事”的询问；较逐字的“为了什么缘故”在现代汉语中略显累赘，具体形式在脚注说明。
- source_word: μετεπέμψασθέ με
  choice: 你们……请我来
  rationale: 表达“派人召我来”的意义；“请我来”符合当前场景和现代汉语习惯，也与前半句形成呼应。
