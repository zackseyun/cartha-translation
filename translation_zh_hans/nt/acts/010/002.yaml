  text: εὐσεβὴς καὶ φοβούμενος τὸν θεὸν σὺν παντὶ τῷ οἴκῳ αὐτοῦ, ⸀ποιῶν ἐλεημοσύνας πολλὰς τῷ λαῷ καὶ δεόμενος τοῦ θεοῦ διὰ παντός,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/002.yaml
  text: devout and fearing God with all his household[a], doing many acts of charity for the people and praying to God continually[b],
translation:
  language: zh_hans
  text: 他是个虔诚人，和全家人都敬畏上帝[a]，多多周济百姓[b]，又常常向上帝祷告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “敬畏上帝”也可能是当时一种可识别的描述，指敬拜以色列上帝的外邦人。
    reason: lexical_alternative
  - marker: b
    text: “周济”所译的希腊词常特指向贫困或有需要的人施舍；原文说“许多”。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐσεβὴς
  choice: 虔诚人
  rationale: 表达在宗教生活中显出的敬虔，现代汉语自然且庄重；名词化表述也顺应本节对哥尼流的连续描写。
- source_word: φοβούμενος τὸν θεὸν
  choice: 敬畏上帝
  rationale: 保留希腊文分词短语的动作意味和圣经惯用语，不将其弱化为一般性的“尊敬”；同时不在正文中过度限定其是否为专门身份称谓。
- source_word: σὺν παντὶ τῷ οἴκῳ αὐτοῦ
  choice: 和全家人都
  rationale: οἶκος在此指整个家庭或家属群体，而不是房屋；“和全家人都”在现代汉语中简洁自然。
- source_word: ποιῶν ἐλεημοσύνας πολλὰς
  choice: 常常周济
  rationale: ἐλεημοσύνη在此主要指向有需要者施舍、救济；“周济”准确传达慈善给予。“常常”在汉语中自然表达其大量、反复施行，避免生硬的“做许多施舍”。
- source_word: τῷ λαῷ
  choice: 百姓
  rationale: 定冠词加λαός在《使徒行传》的犹太语境中可指以色列民或犹太百姓；“百姓”保留这一群体指向，又不在正文中加入原文未明说的限定词。
- source_word: δεόμενος τοῦ θεοῦ
  choice: 向上帝祷告
  rationale: δέομαι可表示恳求或祈求；在敬虔生活的语境中，“祷告”最清楚自然，并以“向”表达其对象。
- source_word: διὰ παντός
  choice: 不断
  rationale: 该惯用语表示持续而经常，不必理解为每一刻都毫无间断；“不断”简洁而有分量。
theological_decisions:
- issue: 哥尼流“敬畏上帝”的表述是否作为专门身份称谓
  choice: 正文译作“敬畏上帝”，脚注说明可能的历史性称谓含义
  alternative: 正文译作“敬畏上帝的人”或“敬神者”
  rationale: 希腊文既可按通常意义描述对上帝的敬畏，也可能是当时对敬拜以色列上帝的外邦人的可识别说法。正文保留动词性表达，脚注呈现历史语境中的可能含义，不将含混之处单向解决。
- issue: τῷ λαῷ所指的群体
  choice: 译作“百姓”
  alternative: 译作“犹太百姓”或“人民”
  rationale: 在路加—使徒行传的相关语境中，“百姓”很可能指犹太百姓，但本节本身没有明加“犹太”一词；保留较含蓄的群体称呼，避免把语境推论直接写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以分号连接哥尼流的品格与持续行动，使句子清晰流畅。正文中的[a]、[b]与脚注一一对应。
