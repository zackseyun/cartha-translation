source:
  edition: SBLGNT
  text: ἐξαυτῆς οὖν ἔπεμψα πρὸς σέ, σύ τε καλῶς ἐποίησας παραγενόμενος. νῦν οὖν πάντες ἡμεῖς ἐνώπιον τοῦ θεοῦ πάρεσμεν ἀκοῦσαι πάντα τὰ προστεταγμένα σοι ὑπὸ τοῦ ⸀κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/033.yaml
  text: So I sent for you at once[a], and you did well to come. Now then[b], we are all here before God to hear everything that has been commanded to you by the Lord.
translation:
  language: zh_hans
  text: 所以，我立刻派人去请你；你肯前来，实在很好。现在，我们大家都在这里，在上帝面前，要听主[a]所吩咐你的一切。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“主”在上下文中很可能指耶稣；也有人把它较宽泛地理解为上帝。
    reason: 保留κύριος所指对象在原文中的含蓄性，避免正文替读者作出明确判定。
lexical_decisions:
- source_word: ἐξαυτῆς
  choice: 立刻
  rationale: 准确表达“立即、毫不耽搁”的意思，在现代汉语中自然简洁。
- source_word: οὖν
  choice: 所以／现在
  rationale: 第一个οὖν承接上文并表示结果，译作“所以”；νῦν οὖν用于转入当前情境，合译为“现在”，避免生硬重复。
- source_word: ἔπεμψα πρὸς σέ
  choice: 派人去请你
  rationale: 原文直译为“派人到你那里”，上下文表明哥尼流派使者请彼得前来；此译自然地表达该语境含义。
- source_word: καλῶς ἐποίησας παραγενόμενος
  choice: 你来了，真是太好了
  rationale: 保留对彼得到来的肯定，同时比直译“你来做得好”更符合现代汉语表达。
- source_word: πάντες ἡμεῖς
  choice: 我们大家
  rationale: 体现原文对全体在场者的强调。
- source_word: ἐνώπιον τοῦ θεοῦ πάρεσμεν
  choice: 都在这里，在上帝面前
  rationale: 既表达πάρεσμεν的“在场”，也保留众人自觉处于上帝面前的庄重意味。
- source_word: πάντα τὰ προστεταγμένα σοι
  choice: 吩咐你的一切话
  rationale: προστάσσω含有权威性的命令或指示；“吩咐”在此自然，并保留其权威色彩。“一切话”明示众人要听所传达的全部内容。
- source_word: ὑπὸ τοῦ κυρίου
  choice: 主吩咐
  rationale: 将被动结构自然转为汉语主动表达，同时不增添原文没有明说的身份名称。
theological_decisions:
- issue: τοῦ κυρίου（“主”）所指为何
  choice: 正文只译作“主”
  alternative: 明确译作“主耶稣”或按较宽泛理解译作“上帝”
  rationale: 希腊文只写“主”。上下文很可能指耶稣，但正文不应加入原文未明说的名字；保留“主”可维持原文的指称张力，并以脚注提示可能理解。
translation_notes:
  register: 采用现代、庄重而口语自然的普通话。“你来了，真是太好了”传达哥尼流真诚的肯定；“在上帝面前”保留聚会场景的肃穆感。
