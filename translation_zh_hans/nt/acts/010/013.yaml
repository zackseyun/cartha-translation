  yaml_path: translation/nt/acts/010/013.yaml
  text: 'And a voice came to him: “Get up[a], Peter; kill and eat.”'
translation:
  language: zh_hans
  text: 又有声音对他说：“彼得，起来，宰[a]了吃！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “宰”也可译作“献祭”。原文这个动词既可指献祭，也可指宰杀；在这个异象中，因上下文谈到吃动物，这里更可能是指宰杀动物供食用。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: 有
  rationale: 与“声音”连用时表示声音出现或传来；现代汉语用“有声音”自然地保留事件的发生感。
- source_word: φωνὴ
  choice: 声音
  rationale: 此处指能传达命令、可以辨识的话语声，而非一般声响。
- source_word: πρὸς αὐτόν
  choice: 对他说
  rationale: πρός加宾格在言语语境中表示话语指向某人；译作“对他说”符合现代汉语表达。
- source_word: Ἀναστάς
  choice: 起来
  rationale: 该不定过去时分词在这里具有命令作用，并与后面的命令形成连续动作；“起来”简洁自然。
- source_word: Πέτρε
  choice: 彼得
  rationale: Πέτρος的呼格，采用现代中文圣经人名的通行译法。
- source_word: θῦσον
  choice: 宰
  rationale: θύω既可指献祭，也可指宰杀动物；异象的直接语境是把动物处理后食用。“宰”比泛指的“杀”更贴合宰杀动物供食用的情景，同时不强加祭祀含义。
- source_word: φάγε
  choice: 吃
  rationale: 直接命令语气；“吃”准确、简洁且自然。
- source_word: καὶ
  choice: 又
  rationale: 句首καί承接前面的叙事；“又”在中文中自然表达进一步发生的事件。
theological_decisions:
- issue: θῦσον是否应在正文中译为带有献祭含义的词
  choice: 正文译作“宰”
  alternative: “献祭”或“杀”
  rationale: 上下文直接涉及动物与进食，并未明确命令彼得举行礼仪性的祭祀，因此正文不采用“献祭”。但θύω确实可有献祭义，故在脚注中保留这一真实的词义可能性。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。直接引语保持命令的力度；用“宰了吃”体现连续动作，也符合普通读者的日常理解。
