  yaml_path: translation/nt/acts/010/008.yaml
  text: And after explaining everything to them, he sent them to Joppa.
translation:
  language: zh_hans
  text: 他把一切都向他们说明以后，就派他们去约帕。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξηγησάμενος
  choice: 说明以后
  rationale: 该不定过去时中间语态分词表示先于主句动作发生的行动；“说明以后”自然地表达时间先后，也保留了把事情详尽讲明的含义。
- source_word: ἅπαντα
  choice: 一切
  rationale: 中性复数在此概括全部相关事情；“一切”简洁、自然，并保留原文的全面性。
- source_word: αὐτοῖς
  choice: 向他们
  rationale: 与“说明”搭配时，汉语用“向他们”自然表达说明的对象。
- source_word: ἀπέστειλεν
  choice: 派
  rationale: 这里指哥尼流差遣手下执行任务；“派”比单纯的“送”更准确，也不额外引入紧迫意味。
- source_word: εἰς τὴν Ἰόππην
  choice: 去约帕
  rationale: εἰς表示朝向目的地的移动；“去约帕”是现代汉语中自然的表达，地名按通行圣经译名译作“约帕”。
theological_decisions: []
