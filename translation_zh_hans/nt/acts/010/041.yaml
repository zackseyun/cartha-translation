base_translation:
  language: en
  yaml_path: translation/nt/acts/010/041.yaml
  text: not to all the people[a], but to witnesses who had been chosen beforehand by God—to us[b], who ate and drank with him after he rose from the dead.
translation:
  language: zh_hans
  text: 他没有向所有百姓显现，只向上帝预先拣选[a]的见证人显现；这些见证人就是我们，即那些在他从死人中复活[b]以后曾和他一同吃喝的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“预先任命”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“从死人中被复活”。这里的希腊语自然可译为“从死人中复活”，不过新约其他地方也有被动式的表达。
    reason: alternative_reading
lexical_decisions:
- source_word: οὐ παντὶ τῷ λαῷ
  choice: 不是向所有百姓显现
  rationale: παντί与λαῷ的与格结构限定显现的对象范围，并与后面的见证人形成对比。“所有百姓”自然保留了这一范围；“显现”由上下文所支配的动词意义补出，使本节在中文中语法完整。
- source_word: μάρτυσι
  choice: 见证人
  rationale: μάρτυς在《使徒行传》中通常指亲眼经历并为此作证的人；“见证人”准确、清楚，也符合本节复活见证的语境。
- source_word: τοῖς προκεχειροτονημένοις ὑπὸ τοῦ θεοῦ
  choice: 向上帝预先拣选的
  rationale: 完成时被动分词表达上帝事先作出的选择，其效力延续到当时。“预先拣选”简洁自然；该词也可侧重任命或指定，故列入脚注。
- source_word: ἡμῖν
  choice: 就是向我们这些……的人
  rationale: ἡμῖν与“见证人”同位，具体说明这些见证人是谁。中文用“就是向我们”明确呈现同位关系。
- source_word: οἵτινες
  choice: 我们这些……的人
  rationale: οἵτινες引出描述这群见证人的关系从句；这一结构在中文中自然表达其特征，而不额外加强语气。
- source_word: συνεφάγομεν καὶ συνεπίομεν αὐτῷ
  choice: 和他一同吃喝
  rationale: 两个带συν-的复合动词强调共同进食饮用。“和他一同吃喝”具体保留了复活后同席相交及身体真实性的见证。
- source_word: μετὰ τὸ ἀναστῆναι αὐτὸν ἐκ νεκρῶν
  choice: 在他从死人中复活以后
  rationale: μετά加冠词不定式表示时间上的“以后”；ἀναστῆναι在此自然作不及物意义“起来、复活”。“从死人中复活”贴近原文，也保留新约常见的复活表达。
theological_decisions:
- issue: ἀναστῆναι αὐτὸν ἐκ νεκρῶν中的复活表述
  choice: 在他从死人中复活以后
  alternative: 在他从死人中被使复活以后
  rationale: 本节的希腊语形式自然表达“他复活了”，因此正文采用主动式中文。这并不否认其他经文所说上帝使他复活，只是不把别处的被动表述代入本节。脚注保留可能的被动理解。
- issue: 复活后共同吃喝的意义
  choice: 按具体动作直译为“和他一同吃喝”
  alternative: 与他一同用餐
  rationale: 原文分别提到吃与喝，具体措辞突出了见证人与复活后的耶稣真实相处；译文不将这一陈述抽象化，也不额外作教义解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“百姓”比“民众”更能承接λαός在使徒行传中的用法；“所有百姓”避免“全体人民”可能带来的现代政治语感。句中两次补出“显现”，依据上一节所支配的语义，使单节中文完整清晰。脚注标记均放在对应词语之后。
