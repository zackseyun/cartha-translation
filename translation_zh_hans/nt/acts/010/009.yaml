  text: Τῇ δὲ ἐπαύριον ὁδοιπορούντων ἐκείνων καὶ τῇ πόλει ἐγγιζόντων ἀνέβη Πέτρος ἐπὶ τὸ δῶμα προσεύξασθαι περὶ ὥραν ἕκτην.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/009.yaml
  text: On the next day[a], while those men were traveling and drawing near to the city, Peter went up on the housetop to pray, about the sixth hour.
translation:
  language: zh_hans
  text: 第二天，他们还在路上，快到那城的时候，彼得上到屋顶去祷告。那时约是第六时[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 按当时犹太人的日间计时法，约为正午。
    reason: cultural_note
lexical_decisions:
- source_word: Τῇ δὲ ἐπαύριον
  choice: 第二天
  rationale: 以自然的汉语时间短语表达“次日”；δέ在此主要承接叙事，无须机械译出，以免显得生硬或误作强转折。
- source_word: ὁδοιπορούντων ἐκείνων
  choice: 他们还在路上
  rationale: 这是属格独立结构，表示与主句同时发生的背景动作；“他们”承接上文哥尼流所派的人，“还在路上”自然表达其行程尚在继续。
- source_word: τῇ πόλει ἐγγιζόντων
  choice: 快到那城的时候
  rationale: 保留ἐγγίζω“临近、接近”的意义；“那城”在汉语中自然指向上文的约帕，并不擅自补出城名。
- source_word: ἀνέβη
  choice: 上到
  rationale: 按简单过去叙事动作处理，并与房屋可供活动的平顶相配。
- source_word: ἐπὶ τὸ δῶμα
  choice: 房顶
  rationale: δῶμα在此指可登上的平屋顶；“房顶”简明、现代，也保留当地建筑背景。
- source_word: προσεύξασθαι
  choice: 去祷告
  rationale: 不定式表示彼得上房顶的目的，用“去祷告”符合现代汉语表达。
- source_word: περὶ ὥραν ἕκτην
  choice: 约是第六时
  rationale: 保留原文按日间时辰计时的文化表达，并以“约”体现περί的近似含义；实际约为正午，置于脚注说明。
