  text: καὶ νῦν πέμψον ⸂ἄνδρας εἰς Ἰόππην⸃ καὶ μετάπεμψαι Σίμωνά ⸂τινα ὃς ἐπικαλεῖται Πέτρος⸃·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/005.yaml
  text: And now send men to Joppa and summon a certain Simon who is called Peter[a].
translation:
  language: zh_hans
  text: 现在，你要派几名男子到约帕去，请一位名叫西门、又称彼得的人来。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“请一个名叫西门、被称为彼得的人来。”
    reason: 保留ἐπικαλεῖται可译为“又称”或“被称为”的表达差异。
lexical_decisions:
- source_word: καὶ νῦν
  choice: 现在
  rationale: 在本句中承接上文并引出随即要采取的行动；现代汉语用“现在”即可自然体现其话语推进作用，不必机械译出καί。
- source_word: πέμψον ἄνδρας
  choice: 你要派几个人
  rationale: πέμψον是单数命令式，译作“你要派”；ἄνδρας明确指男性复数，但汉语“几个人”在此自然，也没有把他们解释性地称为“使者”。
- source_word: εἰς Ἰόππην
  choice: 到约帕去
  rationale: 准确表达εἰς加地名的方向意义，并采用现代汉语常见的地点表达。
- source_word: μετάπεμψαι
  choice: 请……来
  rationale: 该中动态命令式表示派人去请某人前来；“请……来”比“召来”更自然，也避免额外加入强制意味。
- source_word: Σίμωνά τινα
  choice: 一位名叫西门……的人
  rationale: τινα引入一位尚未具体说明、但可辨认的人；此译比直译“一位某某西门”更符合现代汉语。
- source_word: ὃς ἐπικαλεῖται Πέτρος
  choice: 又称彼得
  rationale: 简洁表达彼得是此人被称呼或为人所知的名字，同时保留西门与彼得两个称名之间的关系。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“你要派……请……来”保留两个命令式的力度；正文中的脚注标记与脚注相对应。
