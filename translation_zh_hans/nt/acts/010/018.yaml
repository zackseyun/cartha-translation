  text: And they called out and asked whether Simon[a], who is called Peter, was staying here.
translation:
  language: zh_hans
  text: 他们呼喊着，问西门，就是称为彼得的那位，是否住在这里[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在这里作客”“寄宿在这里”。希腊语动词含有作为客人受接待并住宿的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνήσαντες
  choice: 在门外喊了一声
  rationale: 该不定过去时分词表示先出声呼唤，随后询问。中文用“喊了一声”自然地表达向屋内呼喊；“在门外”由叙事情境可明确推知，也使动作在现代汉语中更顺畅。
- source_word: ἐπυνθάνοντο
  choice: 问
  rationale: 该未完成时中间语态表示他们当时进行询问；此处中文简洁用“问”即可，叙事语境已能体现过程。
- source_word: εἰ
  choice: 是不是
  rationale: 引出间接疑问；“是不是”符合现代口语化叙事，也准确保留是否未定的语气。
- source_word: Σίμων ὁ ἐπικαλούμενος Πέτρος
  choice: 那位称为彼得的西门
  rationale: 保留西门本名和彼得这一称呼之间的限定关系；“称为”对应现在时被动分词，不额外解释为姓氏或改名。
- source_word: ἐνθάδε
  choice: 在这里
  rationale: 直接、自然地表达该处所副词。
- source_word: ξενίζεται
  choice: 作客
  rationale: 该动词表示在别人那里受接待、以客人身份住宿。“作客”比单纯“住”更能保留款待和寄居的语义，同时在现代中文中简洁自然。
