  naturalness: “问……是不是……”符合现代汉语，但“在这里作客”在这个间接问句中略显不够自然，且“作客”有时可指访问而不必住宿。“是否住在这里”更顺畅；脚注可保留其作为客人受接待住宿的语义。
  terminology: “西门”和“彼得”均为通行且恰当的人名译法。“称为彼得的西门”可理解，但改为“西门，就是称为彼得的那位”更自然地呈现原文的同位说明，并避免将“彼得”误解为一般性称谓。
