source:
  edition: SBLGNT
  text: καὶ φησί· Κορνήλιε, εἰσηκούσθη σου ἡ προσευχὴ καὶ αἱ ἐλεημοσύναι σου ἐμνήσθησαν ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/031.yaml
  text: And he said[a], ‘Cornelius, your prayer has been heard, and your alms have been remembered before God.’
translation:
  language: zh_hans
  text: 他就说：“哥尼流，你的祷告已经蒙垂听，你的周济[a]也在上帝面前蒙了记念。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“施舍”“慈善捐助”。希腊词指因怜悯而向有需要的人给予财物或提供帮助。
    reason: lexical_alternative
lexical_decisions:
- source_word: φησί
  choice: 他就说
  rationale: 希腊文用叙事性现在时，现代汉语叙事中自然译为“他就说”，不机械保留现在时。
- source_word: Κορνήλιε
  choice: 哥尼流
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: εἰσηκούσθη
  choice: 已经蒙垂听
  rationale: 保留不定过去时被动语态，并用“已经”表达祷告获垂听及其当前关联；“蒙垂听”符合庄重而自然的宗教语域。
- source_word: ἡ προσευχὴ
  choice: 你的祷告
  rationale: 保留原文单数，并采用现代汉语中通行、清楚的对应词。
- source_word: αἱ ἐλεημοσύναι
  choice: 你的周济
  rationale: 该词指向有需要者所施行的怜悯性给予或善行。“周济”简洁表达具体援助，又不把经文扩展为功德教义；汉语集合性名词无需机械体现希腊文复数。
- source_word: ἐμνήσθησαν
  choice: 蒙了记念
  rationale: 保留被动表达和圣经中“记念”的关系性意象，不弱化为仅仅“注意到”。
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: 在上帝面前
  rationale: 直接保留原文“在……面前”的临在与鉴察含义，避免解释性扩写。
theological_decisions:
- issue: 哥尼流周济行为的意义
  choice: 译作“周济”，表明对贫困者的具体怜悯与援助。
  alternative: 施舍；慈善捐助；怜悯人的善行
  rationale: 原文肯定这些行为在上帝面前被记念，却未在本节说明其与功德或得救机制的关系，因此不作教义性增补。
- issue: 上帝“记念”的表述
  choice: 保留“在上帝面前蒙了记念”。
  alternative: 上帝已经留意；上帝已经注意到
  rationale: “记念”保存原文的圣经性、关系性语言及神学张力，同时被动式不明说施事者，符合原文形式。
- issue: 被动语态所隐含的施事者
  choice: 以“蒙垂听”“蒙了记念”保留神圣被动。
  alternative: 上帝已经垂听你的祷告，也记念你的周济
  rationale: 上下文清楚指向上帝，但原文两处均用被动语态；译文不将隐含主语显明化，以免消除原文表达特点。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“哥尼流”为通行专名译法；“上帝”与项目用语保持一致。“蒙垂听”“记念”保留圣经语体，但句法仍符合现代汉语。脚注标记紧随“周济”，明确其所解释的词。
