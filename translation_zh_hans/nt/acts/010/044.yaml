id: ACT.10.44
reference: Acts 10:44
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ἔτι λαλοῦντος τοῦ Πέτρου τὰ ῥήματα ταῦτα ἐπέπεσε τὸ πνεῦμα τὸ ἅγιον ἐπὶ πάντας τοὺς ἀκούοντας τὸν λόγον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/044.yaml
  text: While Peter was still speaking these words[a], the Holy Spirit fell upon all those hearing the word.
translation:
  language: zh_hans
  text: 彼得还在说这些话的时候，圣灵就降在所有听这道的人身上[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：圣灵就临到所有听这道的人。
    reason: ἐπέπεσε既可较形象地译为“降在……身上”，也可按其在圣灵降临语境中的意义译为“临到”。
lexical_decisions:
- source_word: Ἔτι λαλοῦντος τοῦ Πέτρου
  choice: 彼得还在说……的时候
  rationale: 以时间从句表达属格独立结构；“还在”保留ἔτι与现在分词所体现的持续动作，并显明彼得说话与圣灵降临同时发生。
- source_word: τὰ ῥήματα ταῦτα
  choice: 这些话
  rationale: ῥήματα在此指彼得正在说出的言语；“这些话”直接、自然，也与后面的λόγος有所区分。
- source_word: ἐπέπεσε
  choice: 降在……身上
  rationale: ἐπιπίπτω本有“落到、降到……之上”的生动意象；“降在……身上”符合现代汉语的圣经叙事语体，并比单纯“临到”更贴近原文措辞。
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: 圣灵
  rationale: 这是现代中文对该定冠词短语的标准、清楚译法。
- source_word: ἐπὶ πάντας τοὺς ἀκούοντας
  choice: 所有听……的人身上
  rationale: “所有”保留πάντας的全称范围；“听……的人”表达现在分词所描写的当时正在聆听者。
- source_word: τὸν λόγον
  choice: 这道
  rationale: λόγος在此指彼得所传讲的信息。“道”保留原词的传统对应和神学分量；加“这”使中文自然，并明确指向当下所听的宣讲内容。
theological_decisions:
- issue: 圣灵动作ἐπέπεσε的译法
  choice: 圣灵就降在……身上
  alternative: 圣灵就临到……
  rationale: 正文保留路加用词的具体、生动形象，不进一步界定这事件的教义机制；脚注提供较顺畅但意象较弱的译法。
- issue: 宣讲语境中λόγος的译法
  choice: 这道
  alternative: 这信息
  rationale: “这道”较贴近λόγος，并在上下文中自然指彼得所传的内容；不把它限制为单个词语，也不额外加入原文没有明说的教义标签。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“还在……的时候……就……”清楚呈现动作的同时性；“降在……身上”保留原文叙事力度，“这道”保持简洁的圣经语体。
