source:
  edition: SBLGNT
  text: ⸂τῇ δὲ⸃ ἐπαύριον ⸀εἰσῆλθεν εἰς τὴν Καισάρειαν. ὁ δὲ Κορνήλιος ἦν προσδοκῶν αὐτοὺς συγκαλεσάμενος τοὺς συγγενεῖς αὐτοῦ καὶ τοὺς ἀναγκαίους φίλους.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/024.yaml
  text: On the next day he entered Caesarea[a]. Now Cornelius was expecting them and had called together his relatives and close friends.
translation:
  language: zh_hans
  text: 第二天，他进了凯撒利亚[a]。哥尼流正等候他们，并且已经召集了自己的亲属和密友。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文这里用单数动词“他进了”，后面却用复数代词“他们”；这可能是以彼得为主要人物，同时表明哥尼流所等候的也包括彼得的同行者。
    reason: 保留原文单复数转换，避免在正文中擅自统一。
lexical_decisions:
- source_word: τῇ δὲ ἐπαύριον
  choice: 第二天
  rationale: 这是表示“次日”的惯用时间短语；δέ在此仅承接叙事，汉语无需另译。
- source_word: εἰσῆλθεν
  choice: 他进了
  rationale: 保留希腊文不定过去时主动直陈语气第三人称单数，以彼得为主要叙事人物；“进了”自然表达进入该城。
- source_word: Καισάρειαν
  choice: 凯撒利亚
  rationale: 采用现代中文圣经及历史地名中通行的音译。
- source_word: ὁ δὲ Κορνήλιος
  choice: 哥尼流
  rationale: δέ表示轻微的叙事焦点转换；中文换句和主语转换已足以体现，无需硬译为“但是”或“这时”。
- source_word: ἦν προσδοκῶν αὐτούς
  choice: 正等候他们
  rationale: 周说式未完成时表示持续进行的等候与期待；αὐτούς明确为复数，指彼得及同行者。
- source_word: συγκαλεσάμενος
  choice: 并且已经召集了
  rationale: 不定过去时中间语态分词所述行动先于当时的等候；“已经”清楚呈现这一时间关系，而“召集”保留聚集众人的含义。
- source_word: τοὺς συγγενεῖς αὐτοῦ
  choice: 自己的亲属
  rationale: συγγενεῖς指有亲属关系的人；“亲属”准确、庄重且符合现代汉语。
- source_word: τοὺς ἀναγκαίους φίλους
  choice: 密友
  rationale: ἀναγκαῖος修饰朋友时指关系亲密、亲近或可信赖，并非字面的“必要的”；“密友”简洁自然。
theological_decisions: []
