base_translation:
  language: en
  yaml_path: translation/nt/acts/010/015.yaml
  text: 'And a voice came to him again a second time: “What God has made clean[a], you must not call common.”'
translation:
  language: zh_hans
  text: 第二次又有声音对他说：“神所洁净的，你不可当作凡俗之物[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你不可当作不洁之物”或“你不可视为污秽”。
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνὴ
  choice: 有声音
  rationale: 希腊文无冠词；中文用“有声音”自然引出再次临到彼得的话语，而不额外指明说话者。
- source_word: πάλιν ἐκ δευτέρου
  choice: 又……第二次
  rationale: 同时保留 πάλιν 与 ἐκ δευτέρου 略带重复的强调，中文仍然通顺。
- source_word: πρὸς αὐτόν
  choice: 对他说
  rationale: 按中文言语表达习惯译出话语指向彼得的意思。
- source_word: Ἃ
  choice: ……的
  rationale: 以“神所洁净的”概括中性复数关系代词所指的一切对象，避免生硬的“那些东西”。
- source_word: ἐκαθάρισεν
  choice: 所洁净的
  rationale: “洁净”保留礼仪洁净语境，也表达神已经施行的决定性行动。
- source_word: σὺ μὴ κοίνου
  choice: 你不可当作不洁
  rationale: 显明 σὺ 对彼得的强调，并把 κοινόω 理解为把某物视为礼仪上凡俗、受玷污；现代中文“当作不洁”比直译“当作俗物”更易懂，细微词义另见脚注。
theological_decisions:
- issue: 彼得异象中的洁净与凡俗用语
  choice: 正文译作“不可当作不洁”
  alternative: 不可当作凡俗／不可视为污秽
  rationale: κοινόω 与 καθαρίζω 在本节形成对照，但 κοινόω 并非单纯等同于 ἀκάθαρτος。正文优先采用现代读者易懂且符合洁净语境的“不洁”，脚注保留“凡俗”和“污秽”等词义层次，避免抹去原文范畴上的张力。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“又……第二次”有意保留原文略显重复的强调；“洁净／不洁”使异象中的礼仪洁净对照清楚，同时以脚注说明 κοινόω 的“凡俗、受玷污”含义。
