id: ACT.10.14
reference: Acts 10:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ δὲ Πέτρος εἶπεν· Μηδαμῶς, κύριε, ὅτι οὐδέποτε ἔφαγον πᾶν κοινὸν ⸀καὶ ἀκάθαρτον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/014.yaml
  text: But Peter said, “By no means, Lord, because I have never eaten anything common and unclean.”
translation:
  language: zh_hans
  text: 彼得却说：“主啊，绝对不可！因为我从来没有吃过任何凡俗和不洁净的东西。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μηδαμῶς
  choice: 绝对不可
  rationale: 表达强烈、断然的拒绝，比单纯的“不”更贴近希腊语语气，也符合现代汉语表达。
- source_word: κύριε
  choice: 主啊
  rationale: 保留呼格及彼得对异象中发声者的称呼；不把此处的指称进一步解释化。
- source_word: ὅτι
  choice: 因为
  rationale: 按其因果功能直译，明确彼得拒绝的理由，并与经审定的英语咨询层一致。
- source_word: κοινὸν
  choice: 凡俗
  rationale: 此词在礼仪语境中指未分别为圣、因而不可食用之物；“凡俗”保留这一概念，并避免与一般意义的“普通”混淆。
- source_word: καὶ ἀκάθαρτον
  choice: 和不洁净的
  rationale: 严格保留SBLGNT正文的连接词καί（“和”），不改译为“或”，从而不消解原文措辞可能产生的语义张力。
theological_decisions:
- issue: “凡俗”和“不洁净”之间的关系
  choice: 译作“凡俗和不洁净的东西”
  alternative: “凡俗或不洁净的东西”
  rationale: SBLGNT所列正文为καί，通常意为“和”；采用“和”忠实呈现原文，不在译文中预先判断两者是重叠属性还是并列类别。
- issue: κύριε的身份指向
  choice: 译作“主啊”
  alternative: “先生”或直接明说“主耶稣啊”
  rationale: 上下文是来自天上的异象和声音，但本节本身没有明说说话者身份；“主啊”既符合用词，也保留指称上的含蓄。
translation_notes:
  register: 采用自然、庄重且易懂的现代标准汉语。“彼得却说”保留δέ的转折；感叹号体现Μηδαμῶς的强烈拒绝。全句不添加原文没有的解释性内容。
