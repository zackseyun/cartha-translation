lexical_decisions:
- source_word: Ἀνὴρ δέ τις
  choice: 有一个人
  rationale: τις以不定方式引入新人物；“有一个人”符合现代汉语叙事习惯。δέ在此仅作轻微场景转换，不必机械译出，以免加入过强的时间或转折意味。
- source_word: ἐν Καισαρείᾳ
  choice: 在凯撒利亚
  rationale: 直接表达地点；“凯撒利亚”采用通行的中文地名译法。
- source_word: ὀνόματι Κορνήλιος
  choice: 名叫哥尼流
  rationale: 自然表达希腊语“名为哥尼流”的结构，并采用通行的人名译法。
- source_word: ἑκατοντάρχης
  choice: 百夫长
  rationale: 这是罗马军官职衔的标准中文译名，简明且具有历史准确性。
- source_word: ἐκ σπείρης
  choice: ……营的一名
  rationale: σπεῖρα在此指罗马军队单位；“营”简洁自然，并借脚注补充其历史含义。ἐκ表示此人隶属于该单位。
- source_word: τῆς καλουμένης Ἰταλικῆς
  choice: 所谓“意大利营”
  rationale: “所谓”对应被动分词καλουμένης，表示该单位被这样称呼；补出“营”使形容词Ἰταλικῆς所修饰的军事单位在汉语中清楚明确。
