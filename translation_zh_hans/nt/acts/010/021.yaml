  yaml_path: translation/nt/acts/010/021.yaml
  text: So Peter went down to the men and said[a], “Look, I am the one you are looking for. Why are you here?”
translation:
  language: zh_hans
  text: 于是，彼得下到那些人那里，说：“看，我就是你们要找的人。你们为什么在这里？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταβὰς
  choice: 下去
  rationale: 不定过去时分词表示彼得从房顶或上层下到访客所在之处；“下去”保留方向感，并符合现代汉语叙事。
- source_word: δὲ
  choice: 于是
  rationale: 此处主要推进叙事，而非表达强烈转折；“于是”自然承接上文。
- source_word: πρὸς τοὺς ἄνδρας
  choice: 见那些人
  rationale: πρός加宾格表示朝向那些人移动；结合后续对话，“下去见那些人”比机械译作“到那些人那里”更自然。
- source_word: Ἰδοὺ
  choice: 看
  rationale: 作为引起对方注意的语篇标记，“看”保留其提示语气，且不采用古雅的“看哪”。
- source_word: ἐγώ εἰμι ὃν ζητεῖτε
  choice: 我就是你们要找的人
  rationale: 准确表达彼得确认自己正是他们寻找的对象；“就是”自然体现强调。
- source_word: τίς ἡ αἰτία δι’ ἣν πάρεστε
  choice: 你们为什么到这里来？
  rationale: 原文直指他们在场的原因；现代汉语用“为什么到这里来”自然表达原因与到场情境，同时不把 πάρειμι 误解为单纯的移动动词。
