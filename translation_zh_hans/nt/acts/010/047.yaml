  text: Μήτι τὸ ὕδωρ ⸂δύναται κωλῦσαί⸃ τις τοῦ μὴ βαπτισθῆναι τούτους οἵτινες τὸ πνεῦμα τὸ ἅγιον ἔλαβον ⸀ὡς καὶ ἡμεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/047.yaml
  text: Surely no one can withhold the water so that these people should not be baptized[b][a], can they? For they have received the Holy Spirit just as we have.
translation:
  language: zh_hans
  text: “这些人既然和我们一样领受了圣灵，谁还能阻止用水给他们施洗呢？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这些人和我们一样领受了圣灵，谁能禁止用水给他们施洗呢？”
    reason: 保留κωλύω可译为“禁止”，并以自然汉语表达不可阻止这些人受水洗之意。
lexical_decisions:
- source_word: Μήτι
  choice: 谁还能……呢？
  rationale: Μήτι引出预期否定回答的反问；汉语用“谁还能……呢”自然表达“当然没有人能”的语气。
- source_word: τὸ ὕδωρ
  choice: 水
  rationale: 原文有定冠词，语境明确指施洗所用的水；现代汉语中直接说“水”更自然，限定性由“用水施洗”体现。
- source_word: δύναται κωλῦσαί τις
  choice: 谁还能拦着不给
  rationale: κωλύω可指阻拦、禁止；与“水”搭配时，“拦着不给”既保留阻止之意，也自然表达不让这些人接受水洗。
- source_word: τοῦ μὴ βαπτισθῆναι τούτους
  choice: 不给他们用水施洗
  rationale: 该带μή的冠词不定式表达阻止这些人受洗；译文保留被施洗的语义，同时符合汉语表达。
- source_word: τούτους
  choice: 这些人／他们
  rationale: 指眼前这一群人；不额外限定其性别。
- source_word: οἵτινες
  choice: 既然
  rationale: 关系代词在此不仅说明其身份，也带有论证性的因由色彩；“既然”清楚呈现彼得以他们已领受圣灵为依据的反问。
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: 圣灵
  rationale: 现代汉语基督教语境中的标准称谓，准确对应原文。
- source_word: ἔλαβον
  choice: 领受了
  rationale: 不定过去时指已经发生的领受；“了”体现该事件已完成，并与当前关于施洗的论证相关。
- source_word: ὡς καὶ ἡμεῖς
  choice: 和我们一样
  rationale: 保留外邦人领受圣灵与“我们”领受圣灵之间明确的同等比较。
theological_decisions:
- issue: 领受圣灵与水洗的叙事次序
  choice: 明确说这些人已经领受圣灵，彼得据此主张不可阻止他们接受水洗。
  alternative: 采用模糊表达，不清楚显示领受圣灵先于此次水洗。
  rationale: 本节的语法和论证以他们已经领受圣灵为施洗理由；译文保留这一叙事次序及其神学张力，不套入特定宗派的圣礼体系。
- issue: οἵτινες的关系或因由色彩
  choice: 译作“既然”，显明该事实构成反问的依据。
  alternative: 译作“他们……”，仅保留一般关系从句。
  rationale: οἵτινες在此描述这些人的关键特征，并在语境中具有明显的论证功能；“既然”没有改变事实内容，却使汉语逻辑更清楚。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。反问句保留原文预期否定回答的力度；以“用水施洗”避免生硬的“拦阻水”，脚注同时保存较贴近原文结构的译法。
