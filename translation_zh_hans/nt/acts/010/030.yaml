  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ ὁ Κορνήλιος ἔφη· Ἀπὸ τετάρτης ἡμέρας μέχρι ταύτης τῆς ὥρας ⸀ἤμην τὴν ⸀ἐνάτην προσευχόμενος ἐν τῷ οἴκῳ μου, καὶ ἰδοὺ ἀνὴρ ἔστη ἐνώπιόν μου ἐν ἐσθῆτι λαμπρᾷ
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/030.yaml
  text: And Cornelius said, “Four days ago, up to this hour, I was praying at the ninth hour in my house, and behold, a man stood before me in bright clothing.”
translation:
  language: zh_hans
  text: 哥尼流说：“四天前的这个时候，我正在家里祷告；当时是第九时[a]。看哪，有一个身穿明亮衣服的人站在我面前。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 即大约下午三点。
    reason: 文化背景说明：古代通常从日出开始计算白昼时辰。
lexical_decisions:
- source_word: ἔφη
  choice: 说
  rationale: 不定过去时在叙事中引出直接引语，现代汉语自然译作“说”。
- source_word: Ἀπὸ τετάρτης ἡμέρας μέχρι ταύτης τῆς ὥρας
  choice: 四天前的这个时候
  rationale: 这是从第四天前计算到当前同一时刻的时间表达；译文传达“四天前、就在这个时刻”的意思，避免生硬且容易误解为持续四天的“直到这个时候”。
- source_word: ἤμην ... προσευχόμενος
  choice: 我正在……祷告
  rationale: 迂回未完成时表示过去某一时刻正在进行的动作，“正在”准确体现其持续进行的体貌。
- source_word: τὴν ἐνάτην
  choice: 当时是第九时
  rationale: 保留原文化中的计时方式，并以独立分句自然连接祷告的时间背景；现代钟点换算置于脚注。
- source_word: ἐν τῷ οἴκῳ μου
  choice: 在家里
  rationale: 此处指哥尼流自己的住所；“在家里”比“在我的房屋里”更符合现代汉语，同时不损失地点含义。
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留该提示词所带来的现场感和突显作用，不把它直接解释成“忽然”。
- source_word: ἀνὴρ
  choice: 一个……人
  rationale: 按人物外在显现译作“一个人”，不在正文中先行解释其天使身份。
- source_word: ἔστη ἐνώπιόν μου
  choice: 站在我面前
  rationale: 直接传达其在说话者面前站立的姿态和位置，不弱化为仅仅“显现”。
- source_word: ἐν ἐσθῆτι λαμπρᾷ
  choice: 身穿明亮衣服
  rationale: λαμπρός 描写衣服明亮、发光的视觉效果；“明亮衣服”清楚自然，又不额外强化为超出原文的“光芒四射”。
theological_decisions:
- issue: 第九时的表达方式
  choice: 正文保留“第九时”，脚注说明约为下午三点
  alternative: 正文直接译为“下午三点左右”
  rationale: 保留原文的古代计时表达及叙事文化背景，同时用脚注帮助现代读者理解，不赋予该时辰额外的神学意义。
- issue: 明亮衣服之人的身份
  choice: 按本节表象译作“一个……人”
  alternative: 译作“一个天使”
  rationale: 原文在本节使用 ἀνήρ（人/男人），描述哥尼流所见的形象；译文不根据上下文提前明确其超自然身份，从而保留叙事措辞。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“看哪”有意保留原文的提示与现场感；其余句法按现代汉语调整，避免将时间短语误读为连续祷告四天。
