  text: τοῦ δὲ Πέτρου διενθυμουμένου περὶ τοῦ ὁράματος εἶπεν ⸂αὐτῷ τὸ πνεῦμα⸃· Ἰδοὺ ⸀ἄνδρες ⸀ζητοῦντές σε·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/019.yaml
  text: While Peter was still pondering the vision, the Spirit said to him, “Look, men are seeking you.”
translation:
  language: zh_hans
  text: 当彼得正在思量那异象的时候，圣灵对他说：“看，有几名男子正在找你[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“正在寻找你。”
    reason: ζητέω在此可自然译为“找”或较书面的“寻找”；两者都表示这些男子正在设法见到彼得。
lexical_decisions:
- source_word: διενθυμουμένου
  choice: 正思量
  rationale: 该现在时分词表示彼得当时持续进行的内心思考；“正思量”自然表达其持续性和审慎思索的意味，却不额外加入原文没有明说的“还”。
- source_word: περὶ τοῦ ὁράματος
  choice: 那个异象
  rationale: περί标明思考所围绕的内容；现代汉语可自然地说“思量那个异象”，不必机械译出“关于”。“那个”承接上文已经出现的异象。
- source_word: τὸ πνεῦμα
  choice: 圣灵
  rationale: 虽然本节希腊文没有ἅγιον，但在《使徒行传》第10章的叙事语境中，定冠词所指的“灵”是引导彼得的神之灵。汉语单说“那灵”既不自然，也容易被理解为泛指灵体；“圣灵”清楚传达语境中的所指。
- source_word: εἶπεν αὐτῷ
  choice: 对他说
  rationale: 直接、自然地对应“向他说”，并保留说话对象。
- source_word: Ἰδοὺ
  choice: 看
  rationale: 作为引起注意的话语标记，“看”在现代汉语中简洁自然，也保留了提示彼得注意当前情况的功能；“看哪”较为古雅。
- source_word: ἄνδρες
  choice: 几个男子
  rationale: ἀνήρ在这里特指成年男性，不是泛指人群；“男子”既保留性别信息，又比口语中的“几个男人”更适合庄重叙事。“几个”按希腊文不定复数自然表达，未指定确切数目。
- source_word: ζητοῦντές σε
  choice: 在找你
  rationale: ζητέω在此表示寻找某人。“在找你”是现代汉语最自然的进行性表达；较书面的“寻找你”列作脚注备选。
theological_decisions:
- issue: τὸ πνεῦμα的所指
  choice: 译作“圣灵”，指神的灵向彼得说话
  alternative: 译作“那灵”或“灵”
  rationale: 本章上下文把说话者呈现为主动引导彼得接纳外族人的神之灵。译作“圣灵”没有把说话降格为彼得内心一种不明确的感动，同时符合现代汉语对这一明确所指的通常表达。
- issue: ἄνδρες的性别信息
  choice: 保留为“男子”
  alternative: 译作不标性别的“人”或“来客”
  rationale: 原文使用特指男性的ἀνήρ，因此保留男性指称，不将其泛化。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“正思量”表达同步持续动作；引语中的“看”保留ἰδού的提示作用而避免过度古雅。“男子”准确保留原文性别信息。
