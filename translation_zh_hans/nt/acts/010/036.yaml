- from: 他把这信息传给以色列人[a]，借着耶稣基督[b]宣告和平的福音——这位就是万有的主。
  to: 他把这信息传给以色列人[a]，传扬借着耶稣基督[b]而来的和平——这位就是万有的主。
  rationale: 修订仅调整汉语句法和动词选择，使“借着耶稣基督”明确修饰“和平”，并以“传扬”呈现εὐαγγελιζόμενος的宣告好消息之意。保留“以色列人”的现代集体称谓及脚注中的字面替代；保留“这位就是万有的主”对οὗτός ἐστιν πάντων κύριος的强调。
