    rationale: διὰ Ἰησοῦ Χριστοῦ在此表达所宣告之和平是借着耶稣基督而有；草稿的词序可被读作借耶稣基督来实施“宣告”。将其置入“和平”的定语结构可消除歧义。
  - severity: low
