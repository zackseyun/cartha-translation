  text: τὸν λόγον ⸀ὃν ἀπέστειλεν τοῖς υἱοῖς Ἰσραὴλ εὐαγγελιζόμενος εἰρήνην διὰ Ἰησοῦ Χριστοῦ· οὗτός ἐστιν πάντων κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/036.yaml
  text: the message that he sent to the sons of Israel[c][b][a], proclaiming peace through Jesus the Messiah—he is Lord of all.
translation:
  language: zh_hans
  text: 他把这信息传给以色列人[a]，传扬借着耶稣基督[b]而来的和平——这位就是万有的主。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“以色列的子孙”。
    reason: lexical_alternative
  - marker: b
    text: “基督”意为“受膏者”，即“弥赛亚”。
    reason: title_clarification
lexical_decisions:
- source_word: τὸν λόγον
  choice: 这信息
  rationale: λόγος在这里指上帝传给以色列的宣告内容；译作“信息”比单独的“话”更自然，也保留其传播性。
- source_word: ὃν ἀπέστειλεν
  choice: 他把……传给
  rationale: 按上下文补出主语“他”，所指为上帝；“传给”自然表达ἀποστέλλω在信息语境中的“差送、发送”。
- source_word: τοῖς υἱοῖς Ἰσραήλ
  choice: 以色列人
  rationale: 该短语直译为“以色列的子孙”，在这里是对以色列民的惯用集体称呼；正文采用现代汉语自然说法，直译保留于脚注。
- source_word: εὐαγγελιζόμενος εἰρήνην
  choice: 宣告和平的福音
  rationale: εὐαγγελίζομαι不只是一般“宣告”，还含有传好消息的意义；“和平的福音”兼顾动词的福音内涵及εἰρήνην的宾语关系。
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: 借着耶稣基督
  rationale: διά加属格表示媒介或途径；“借着”准确表达此义。“基督”是现代中文圣经语域中Χριστός的通行称谓。
- source_word: οὗτός
  choice: 这位
  rationale: 不用普通代词“他”，而用敬重且自然的“这位”，以保留希腊文指示代词对耶稣本人的强调。
- source_word: πάντων κύριος
  choice: 万有的主
  rationale: πάντων可涵盖一切人和一切事物；“万有”既简洁又能表达其普遍范围，“主”保留κύριος在本句中的权威与神学分量。
theological_decisions:
- issue: Χριστός在Ἰησοῦ Χριστοῦ中的表达
  choice: 耶稣基督
  alternative: 弥赛亚耶稣／耶稣弥赛亚
  rationale: “基督”是Χριστός在现代中文基督教语境中的标准称谓，兼具专称与头衔色彩；脚注说明其“受膏者／弥赛亚”之义，避免读者只把它理解为姓氏。
- issue: κύριος的表达
  choice: 主
  alternative: 主人／统治者
  rationale: “主”最能同时保留权柄含义和本句基督论陈述的分量，不把其意义缩减为一般社会关系中的主人。
- issue: οὗτός的强调作用
  choice: 这位就是万有的主
  alternative: 他是万有的主
  rationale: “这位”保留指示代词的强调，“就是”自然呈现系词陈述的鲜明语气，但不额外界定“万有”的具体范围。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。正文保留原文较长的宣告结构，并用破折号突出末尾“这位就是万有的主”的强调。因本节在希腊文中承接上文，中文依上下文补出“他”作主语。
