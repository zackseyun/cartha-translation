  terminology: 以“恍惚状态”译 ἔκστασις，既保留其不同于普通惊讶的意识状态，也不把下文的异象预先译入正文或引入特定神秘主义解释。脚注保留“出神”作为可行译法，并说明其与随后的异象相关，适当且不越过原文。
