  text: ἐγένετο δὲ πρόσπεινος καὶ ἤθελεν γεύσασθαι· παρασκευαζόντων δὲ ⸀αὐτῶν ⸀ἐγένετο ἐπ’ αὐτὸν ἔκστασις,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/010.yaml
  text: He became very hungry and wanted to eat[a]; but while they were preparing it[b], a trance came over him.
translation:
  language: zh_hans
  text: 他饿极了，想吃点东西[a]。他们正准备饭食时，他陷入了恍惚状态[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“想尝点东西”。希腊语动词本义可指“尝”，但在这里是进食的意思。
    reason: lexical_alternative
  - marker: b
    text: 或译“出神”。所译的希腊语词可指人脱离平常知觉的状态；这里与随后出现的启示性异象有关。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο δὲ πρόσπεινος
  choice: 他饿极了
  rationale: πρόσπεινος表示强烈的饥饿；“饿极了”自然地保留了这一加强语气。ἐγένετο在此表示状态的出现，汉语无须生硬直译为“变得”。
- source_word: ἤθελεν γεύσασθαι
  choice: 想吃点东西
  rationale: γεύομαι本义可指“尝”，但在此语境中指进食；“吃点东西”既符合现代汉语习惯，也不过度指明具体食物。
- source_word: παρασκευαζόντων δὲ αὐτῶν
  choice: 他们正在预备饭食的时候
  rationale: 属格独立结构表示与主句同时发生的动作。“他们”对应αὐτῶν；根据彼得等候进食的上下文，将未明说的预备对象译为“饭食”，使汉语清楚自然。
- source_word: ἐγένετο ἐπ’ αὐτὸν ἔκστασις
  choice: 他进入了出神的状态
  rationale: 该结构表示一种体验临到彼得。ἔκστασις在本段指伴随启示性异象的非常意识状态；“进入了出神的状态”比“狂喜”更贴合语境，也比“惊讶”准确。
theological_decisions:
- issue: ἔκστασις所指彼得经历的性质
  choice: 出神的状态
  alternative: 恍惚状态；狂喜；惊讶
  rationale: 下文随即叙述启示性的异象，因此这里不只是情绪上的惊讶。“出神的状态”表达脱离平常知觉状态的含义，却不引入后世神秘主义体系，也不进一步界定其心理或生理机制。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“饿极了”和“想吃点东西”自然明快；“出神的状态”保留原文对非常意识状态的表达，并由脚注避免读者将其误解为普通的走神。
