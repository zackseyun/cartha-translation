source:
  edition: SBLGNT
  text: ὁ δὲ ἀτενίσας αὐτῷ καὶ ἔμφοβος γενόμενος εἶπεν· Τί ἐστιν, κύριε; εἶπεν δὲ αὐτῷ· Αἱ προσευχαί σου καὶ αἱ ἐλεημοσύναι σου ἀνέβησαν εἰς μνημόσυνον ⸀ἔμπροσθεν τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/004.yaml
  text: But he stared at him[a], and becoming afraid, said, “What is it, Lord?” And he said to him, “Your prayers and your acts of mercy have gone up as a memorial before God.”
translation:
  language: zh_hans
  text: 他定睛看着天使，害怕起来，说：“主啊，什么事？”天使对他说：“你的祷告和周济[a]已经上达上帝面前，成为记念。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“施舍”。原文特指向贫困者所作的慈惠捐助。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀτενίσας
  choice: 定睛看着
  rationale: 表达持续而专注地注视，符合此处人物面对异象时的反应，也自然庄重。
- source_word: ἔμφοβος γενόμενος
  choice: 害怕起来
  rationale: 保留 γενόμενος 所表达的状态变化，不将恐惧程度强化为“惊恐万分”。
- source_word: Τί ἐστιν
  choice: 什么事？
  rationale: 在直接问询天使来意的语境中，这是现代汉语最简洁自然的表达。
- source_word: κύριε
  choice: 主啊
  rationale: 保留尊称的庄重语气；在此可理解为对天上使者的敬称，不必视为明确的基督论宣认。
- source_word: ἐλεημοσύναι
  choice: 周济
  rationale: 该词在此尤其指向穷人施舍、赒济；“周济”简洁明确，并保留慈惠行动的含义。
- source_word: ἀνέβησαν
  choice: 已经上达到
  rationale: 保留向上升达的形象，以及完成而结果仍然有效的语感。
- source_word: εἰς μνημόσυνον
  choice: 蒙他记念
  rationale: 以自然汉语表达其在上帝面前成为记念的意义，同时不把该短语限定为某一种祭祀术语。
- source_word: ἔμπροσθεν τοῦ θεοῦ
  choice: 到上帝面前
  rationale: 直接呈现进入上帝面前、为上帝所鉴察的空间性表达。
theological_decisions:
- issue: 哥尼流称天使为 κύριε 的语力
  choice: 译作“主啊”，作为对天上使者的敬称
  alternative: 先生；主人
  rationale: 保留原词的尊崇语气及叙事场景的庄重感，同时不在正文中附加这是对耶稣之信仰告白的解释。
- issue: 祷告和周济“上达”与“记念”的关系
  choice: 译作“已经上达到上帝面前，蒙他记念”
  alternative: 已经升到上帝面前，作为记念；已经成为上帝面前的记念祭
  rationale: 保留向上升达及蒙上帝记念的祭礼性回声，却不把含义收窄成明说的祭物或据此建立功德论。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“定睛看着”“上达到上帝面前”保留原文形象；“周济”较“善行”更准确地指向救助贫困者。为避免代词指向含混，按上文语境两次明说“天使”。
