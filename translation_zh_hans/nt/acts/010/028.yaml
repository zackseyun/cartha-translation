id: ACT.10.28
reference: Acts 10:28
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἔφη τε πρὸς αὐτούς· Ὑμεῖς ἐπίστασθε ὡς ἀθέμιτόν ἐστιν ἀνδρὶ Ἰουδαίῳ κολλᾶσθαι ἢ προσέρχεσθαι ἀλλοφύλῳ· κἀμοὶ ὁ θεὸς ἔδειξεν μηδένα κοινὸν ἢ ἀκάθαρτον λέγειν ἄνθρωπον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/028.yaml
  text: And he said to them[a], “You yourselves know how unlawful it is for a Jewish man to associate with or visit a foreigner[b]; but God has shown me to call no person common or unclean.”
translation:
  language: zh_hans
  text: 他对他们说：“你们自己知道，一个犹太人同外族人交往，或前往他那里，是不合规矩的[a]；但上帝已经指示我，不可把任何人称为凡俗的或不洁净的[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不合规矩”也可译作“不被允许”或“不合法”；原词可指违背公认规范或习俗，未明确说明是触犯哪一条成文律法。
    reason: 保留ἀθέμιτος所指规范性质的语义幅度，避免把犹太习俗与成文律法直接等同。
  - marker: b
    text: “凡俗的”所译的词与“不洁净的”不同；前者在犹太洁净用语中可指没有分别为圣或受到玷污，后者则是通常表示“不洁净”的词。
    reason: 说明κοινός与ἀκάθαρτος的词义区别，并保留原文成对的洁净范畴。
lexical_decisions:
- source_word: ἔφη τε πρὸς αὐτούς
  choice: 他对他们说
  rationale: τέ仅作轻微承接；现代汉语无须机械译出“并且”，简洁引出彼得的话更自然。
- source_word: Ὑμεῖς ἐπίστασθε
  choice: 你们自己知道
  rationale: 明确译出强调性的Ὑμεῖς，以“自己”保留语气重心。
- source_word: ὡς ἀθέμιτόν ἐστιν
  choice: 是不合规矩的
  rationale: ἀθέμιτος指不被许可、违背既有规范或习俗；此处未必专指成文律法，因此“不合规矩”既保留约束力，也避免过度断定为触犯律法。
- source_word: ἀνδρὶ Ἰουδαίῳ
  choice: 一个犹太人
  rationale: 保留单数代表性；汉语“犹太人”在此自然表达其身份，无须生硬强调男性，因为上下文说话者彼得本为男性，而命题重点在犹太身份。
- source_word: κολλᾶσθαι
  choice: 同……交往
  rationale: 该词本有依附、联合之意，此处指社会往来；“交往”准确且符合现代汉语。
- source_word: ἢ προσέρχεσθαι
  choice: 或登门拜访
  rationale: 结合彼得进入哥尼流家中的语境，προσέρχεσθαι指走近、前往其处；“登门拜访”清楚表达实际行动，同时不把它与一般交往混同。
- source_word: ἀλλοφύλῳ
  choice: 外族人
  rationale: ἀλλόφυλος直指属于另一民族或族群的人；“外族人”比“外邦人”更贴近词面，也避免预先套入专门神学术语。
- source_word: κἀμοὶ ὁ θεὸς ἔδειξεν
  choice: 但上帝已经指示我
  rationale: κἀμοί字面为“也向我”，语境中与先前惯例形成转折，故用“但”；“已经指示”表达启示对当前行动持续有效。
- source_word: μηδένα ... ἄνθρωπον
  choice: 不可把任何人
  rationale: μηδένα与不定式λέγειν连用，表达不得如此称呼任何一个人；“任何人”准确体现普遍的人类指称。
- source_word: κοινὸν ἢ ἀκάθαρτον
  choice: 凡俗的或不洁净的
  rationale: κοινός在犹太洁净语境中不是普通意义的“共同”，而是相对于分别为圣而言的“凡俗”；仍与ἀκάθαρτος“不洁净”分别译出，保留两种洁净范畴。
- source_word: λέγειν
  choice: 称为
  rationale: 保留其“说、称说”的直接语义，不扩译成“看作”或“认为”，以免消除原文在称谓与判断之间的张力。
theological_decisions:
- issue: 犹太边界规范的性质
  choice: 译为“不合规矩”，呈现彼得所说的约束性规范，却不明确断言这是摩西律法的成文禁令。
  alternative: 译为“不合法”或“律法所禁止”
  rationale: ἀθέμιτος可指不被准许或违反规范，但本节没有说明具体法条；较宽而有力的译法可保留其究竟指律法、传统还是公认习俗的空间。
- issue: 异象对人的应用
  choice: 明确译出“不可把任何人称为凡俗的或不洁净的”。
  alternative: 仅解释为饮食洁净规定被废除，或泛化为不可歧视人
  rationale: 原文由彼得亲自把启示应用于ἄνθρωπον“人”；译文应保留这一直接的人论应用，同时不额外推演其全部神学后果。
- issue: κοινός与ἀκάθαρτος的区分
  choice: 分别译作“凡俗的”和“不洁净的”。
  alternative: 两者都译成“不洁净的”或合并为“不洁”
  rationale: 原文使用两个不同的洁净范畴；分别翻译能保留其并列关系和潜在张力，不以解释取代文本。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“登门拜访”贴合彼得进入外族人家中的场景；“外族人”保留ἀλλόφυλος的族群含义；“凡俗的”虽较书面，却能在现代中文中较准确地区别于“不洁净的”。所有脚注标记均已置于正文相应位置。
