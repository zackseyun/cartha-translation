  text: εἰσκαλεσάμενος οὖν αὐτοὺς ἐξένισεν. Τῇ δὲ ἐπαύριον ⸀ἀναστὰς ἐξῆλθεν σὺν αὐτοῖς, καί τινες τῶν ἀδελφῶν τῶν ἀπὸ Ἰόππης συνῆλθον αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/023.yaml
  text: So he invited them in and gave them lodging[a]. The next day he got up and went out with them[b], and some of the brothers from Joppa went with him.
translation:
  language: zh_hans
  text: 于是彼得请他们进来，留他们住下[a]。第二天，他起身，同他们一起出发；有些来自约帕的弟兄也与他同行[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“款待他们住宿”；希腊文在这里特指接待客人并让他们住下。
    reason: lexical_alternative
  - marker: b
    text: “弟兄”译自希腊文阳性复数ἀδελφῶν；在早期基督徒的用语中，这个词有时也可广指同为信徒的人，即“弟兄姊妹”。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσκαλεσάμενος
  choice: 请他们进来
  rationale: 中间语态分词表示彼得让他们进入自己所住的地方；“请他们进来”自然地表达邀请和接纳。
- source_word: οὖν
  choice: 于是
  rationale: 承接前文并表示叙事上的结果；“于是”符合现代汉语叙事习惯，又不过分强化逻辑推论。
- source_word: ἐξένισεν
  choice: 留他们住下
  rationale: 此处指以住宿款待来客；“留他们住下”明确表达提供住处，也适合彼得当时住在别人家中的语境。
- source_word: Τῇ δὲ ἐπαύριον
  choice: 第二天
  rationale: 简洁自然地表达次日，忠实保留叙事时间顺序。
- source_word: ἀναστὰς ἐξῆλθεν
  choice: 起身……出发
  rationale: ἀναστὰς表示起身，ἐξῆλθεν字面为出去；在旅行语境中合译为“起身……出发”，既保留两个动作，又符合自然汉语。
- source_word: σὺν αὐτοῖς
  choice: 和他们一同
  rationale: 直接表达彼得与来使同行。
- source_word: τινες
  choice: 几个
  rationale: 表示数目不定的一部分人；在可数的人群语境中，“几个”比“有些”更自然。
- source_word: ἀδελφῶν
  choice: 弟兄
  rationale: 保留希腊文阳性复数的群体称谓及早期基督徒的亲属式用语；其可能广指信徒的含义留在脚注说明。
- source_word: τῶν ἀπὸ Ἰόππης
  choice: 来自约帕的
  rationale: 清楚表达这些弟兄的所在地或来源，语序符合现代汉语。
- source_word: συνῆλθον αὐτῷ
  choice: 也跟他一起去了
  rationale: 在旅程语境中表示陪同彼得前往；“跟他一起去了”自然明确，并保留共同出行之意。
theological_decisions:
- issue: 教会群体称谓ἀδελφῶν是否应作包容性翻译
  choice: 正文译为“弟兄”
  alternative: “弟兄姊妹”或“信徒”
  rationale: 该词在形式上是阳性复数，正文保留这一语言特征，不预先断定同行者为男女混合群体；同时承认早期基督徒用语中该词有时可泛指信徒，因此在脚注中保存这一可能性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“约帕”沿用常见圣经地名译法。分号使次日出发与约帕弟兄同行两个紧密相关的叙事动作层次清楚。
