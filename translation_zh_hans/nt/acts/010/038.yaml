id: ACT.10.38
reference: Acts 10:38
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ἰησοῦν τὸν ἀπὸ Ναζαρέθ, ὡς ἔχρισεν αὐτὸν ὁ θεὸς πνεύματι ἁγίῳ καὶ δυνάμει, ὃς διῆλθεν εὐεργετῶν καὶ ἰώμενος πάντας τοὺς καταδυναστευομένους ὑπὸ τοῦ διαβόλου, ὅτι ὁ θεὸς ἦν μετ’ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/038.yaml
  text: 'Jesus of Nazareth: how God anointed him with the Holy Spirit and with power[a]; he went about doing good and healing all who were oppressed by the devil[c][b], because God was with him.'
translation:
  language: zh_hans
  text: 就是拿撒勒人耶稣，神怎样用圣灵和能力膏了他；他走遍各地行善，医好所有受魔鬼压制的人，因为神与他同在。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰησοῦν τὸν ἀπὸ Ναζαρέθ
  choice: 拿撒勒人耶稣
  rationale: 该短语按来源地识别耶稣；“拿撒勒人耶稣”是现代汉语中自然、庄重且为读者熟悉的表达，也保留了ἀπό所含的地域来源意义。
- source_word: ὡς
  choice: 怎样
  rationale: 此处引出关于耶稣的叙述内容；“怎样”既体现解释性展开，也保留希腊文压缩句式的一点开放性，不将其简化为单纯的“神膏了他”这一事实陈述。
- source_word: ἔχρισεν
  choice: 膏了
  rationale: 保留χρίω的受膏意象及其弥赛亚和圣灵赋能的经文共鸣，而不擅自扩写为“立为弥赛亚”或仅译作“赐能力”。
- source_word: πνεύματι ἁγίῳ καὶ δυνάμει
  choice: 用圣灵和能力
  rationale: 两个与格均表达施行膏立所用或所凭的媒介；“用……和……”在汉语中简洁自然，并保持“圣灵”与“能力”的区分。
- source_word: διῆλθεν
  choice: 走遍各地
  rationale: 此动词在这里描述耶稣巡行各处的事工；“走遍各地”比字面的“经过”更准确地传达持续巡行的语境。
- source_word: εὐεργετῶν
  choice: 行善
  rationale: 简洁地表达施惠、使人得益的行动，符合现代汉语圣经语体，又不把善行限定为某一种形式。
- source_word: ἰώμενος
  choice: 医好
  rationale: 直接表达实际的医治结果；与后接受压制的人搭配自然清楚。
- source_word: πάντας τοὺς καταδυναστευομένους
  choice: 所有受……压制的人
  rationale: καταδυναστεύω含有强力辖制、压迫之意；“受压制”既清楚又保留其严厉支配的力度。
- source_word: ὑπὸ τοῦ διαβόλου
  choice: 受魔鬼压制
  rationale: διάβολος在此指作为位格性邪恶者的魔鬼；“魔鬼”是清楚、通行的标准译法。
- source_word: ὅτι ὁ θεὸς ἦν μετ’ αὐτοῦ
  choice: 因为神与他同在
  rationale: ὅτι在此给出耶稣行善医治的原因或根据；“因为”明确表达因果关系，而“与他同在”忠实保留原文措辞。
theological_decisions:
- issue: 耶稣受膏与其身份、使命的关系
  choice: 保留“膏了他”的经文意象，不作教义性扩写。
  alternative: 译成“立他为弥赛亚”或仅译成“赐他能力”。
  rationale: 原文陈述神用圣灵和能力膏耶稣。“膏”保存弥赛亚意义与圣灵赋能之间的张力，同时不加入本节未明说的解释。
- issue: “圣灵”的所指
  choice: 将πνεύματι ἁγίῳ译为位格性的“圣灵”。
  alternative: 译作非位格性的“圣洁之灵”或泛指的属灵力量。
  rationale: 《使徒行传》中该表达通常指圣灵，且本节把“圣灵”和“能力”并列，因而不应将二者合并为一种抽象力量。
- issue: “因为神与他同在”的因果意义
  choice: 明确保留因果关系，同时不借此对基督身份作超出本节的推论。
  alternative: 弱化为并列性的“神也与他同在”，或反过来扩写为系统性的基督论说明。
  rationale: 原文以ὅτι说明耶稣行善和医治事工的根据。译文应如实保留这一陈述，却不将它解释为否定或穷尽耶稣更完整的身份。
- issue: 希腊文ὃς与前文耶稣的衔接
  choice: 在汉语中另起分句，用“他”继续指耶稣。
  alternative: 按形式直译为“那一位走遍各地行善……”的关系从句。
  rationale: 希腊文关系代词回指耶稣；汉语用“他”衔接更自然清晰，不改变所指或命题关系。
translation_notes:
  register: 采用现代、庄重、易懂的普通话圣经语体。“就是拿撒勒人耶稣，神怎样……”承接上文被省略的句法背景；分号使受膏与巡回事工两个描述层次清晰，同时避免生硬照搬希腊文关系从句。
