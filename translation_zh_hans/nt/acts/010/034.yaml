  text: Ἀνοίξας δὲ Πέτρος τὸ στόμα εἶπεν· Ἐπ’ ἀληθείας καταλαμβάνομαι ὅτι οὐκ ἔστιν προσωπολήμπτης ὁ θεός,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/034.yaml
  text: Then Peter opened his mouth and said[b][a], “Truly I understand that God is not one who shows partiality,”
translation:
  language: zh_hans
  text: 彼得就开口说：“我确实明白了：上帝不偏待人[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “偏待人”也可译作“不徇情面”或“不偏袒人”；原文指不因人的身份、地位或外在条件而区别对待。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνοίξας ... τὸ στόμα
  choice: 开口说
  rationale: 这是引出正式或郑重发言的惯用表达。现代汉语“开口说”既保留原文意象，也自然易懂。
- source_word: δὲ
  choice: 就
  rationale: 此处承接叙事并推进情节；“就”符合现代汉语叙事习惯，不赋予过强的转折意味。
- source_word: Ἐπ’ ἀληθείας
  choice: 确实
  rationale: 表达彼得对所领悟之事的真实确认；“确实”自然、庄重，也保留强调语气。
- source_word: καταλαμβάνομαι
  choice: 我明白了
  rationale: 此处指彼得领会、认识到一个事实。“明白了”能自然传达形成认识的语境；句末动态助词“了”由上下文支持，但不额外加入明确的时间副词。
- source_word: προσωπολήμπτης
  choice: 偏待人
  rationale: 该词指按人的身份或外在条件徇私偏袒。“偏待人”是简洁而熟悉的中文表达，并保留其涉及对待人的关系性含义。
- source_word: ὁ θεός
  choice: 上帝
  rationale: 采用现代标准汉语中清楚、通行的神称；在此作句子主语。
theological_decisions:
- issue: 如何表达上帝不按人的身份偏袒，同时不预先限定上下文的神学范围
  choice: 上帝不偏待人
  alternative: 上帝不徇情面／上帝不偏袒任何人
  rationale: “不偏待人”忠实表达上帝不因人的身份而偏袒的陈述，并保留下一节对各国之人的具体展开，不将其收窄为某一后期教义体系。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事语言。“开口说”保留原文较郑重的发言引语；“我确实明白了”传达彼得此刻形成并确认的认识。脚注标记已置于相关词语之后。
