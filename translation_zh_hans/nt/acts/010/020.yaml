base_translation:
  language: en
  yaml_path: translation/nt/acts/010/020.yaml
  text: But get up[a], go down, and go with them, doubting nothing, because I have sent them.
translation:
  language: zh_hans
  text: 但你起来，下去，和他们一同去，毫不迟疑[a]，因为是我差他们来的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“不作分别”。希腊语分词既可表示不疑惑或不迟疑，也可表示不作区分；后一种理解可能呼应本章犹太人与外邦人的主题。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: 不过
  rationale: 承接彼得先前的困惑，并转折到圣灵要求他采取的行动；“不过”简洁自然。
- source_word: ἀναστὰς
  choice: 起来
  rationale: 不定过去时分词在此与后续命令连用，表达立即起身行动；现代汉语用“起来”自然明确。
- source_word: κατάβηθι
  choice: 下去
  rationale: 保留从房顶往下移动的空间方向；“下去”比不标方向的“去”更贴近原文。
- source_word: πορεύου σὺν αὐτοῖς
  choice: 跟他们一同去
  rationale: 准确表达同行之意，同时保持现代汉语的自然语序。
- source_word: μηδὲν διακρινόμενος
  choice: 不要迟疑
  rationale: 在眼前语境中，彼得正对异象感到困惑，而使者已经来到，因此这里最自然地指不要犹疑或踌躇；原词也可能涉及区别对待，故在脚注保留该义。
- source_word: ὅτι
  choice: 因为
  rationale: 明确引出彼得应当同行的原因。
- source_word: ἐγὼ ἀπέσταλκα αὐτούς
  choice: 是我差他们来的
  rationale: “是我”体现显式主语ἐγώ的强调，“差……来的”自然表达已完成且当前仍具效力的差遣：这些人如今正以受差者的身份来到。
theological_decisions:
- issue: μηδὲν διακρινόμενος与外族人接纳主题的关系
  choice: 正文译作“不要迟疑”，突出彼得当下不应犹疑。
  alternative: 也可译作“不要区别对待”。
  rationale: 紧邻语境强调彼得的困惑以及圣灵命令他与来人同行，因此“不要迟疑”较为直接；但整章同时展开犹太人与外族人之间不应受歧视性区分的主题。脚注保留后一种理解，以免消除原文真实的词义张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。命令序列以短句推进，保留原文紧凑、直接的语气；脚注标记置于产生歧义的短语之后。
