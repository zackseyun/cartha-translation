  text: τοῦτο δὲ ἐγένετο ἐπὶ τρίς, καὶ ⸀εὐθὺς ἀνελήμφθη τὸ σκεῦος εἰς τὸν οὐρανόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/016.yaml
  text: This happened three times[b][a], and immediately the vessel was taken up into heaven.
translation:
  language: zh_hans
  text: 这事发生了三次，那器物[a]随即被接到天上[b]去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“那块布”。希腊语作“器物”或“容器”；上文则把它描述为像一块大布。
    reason: lexical_alternative
  - marker: b
    text: 或译“天空”。希腊语在这里既可指天空，也可指天上的领域；异象的语境较支持“天上”。
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦτο
  choice: 这事
  rationale: 中性指示代词回指先前所述异象中的整个事件；“这事”在现代汉语中自然，也保留其回指作用。
- source_word: δὲ
  choice: 不单独译出
  rationale: 此处是轻微的叙事连接词；汉语按句意自然衔接即可，若硬译为“但”或“而”反会加强原文没有的转折。
- source_word: ἐγένετο
  choice: 发生了
  rationale: γίνομαι在这里表示事件发生；“发生了”准确、自然，符合叙事语体。
- source_word: ἐπὶ τρίς
  choice: 三次
  rationale: 表示同一事件重复三次；“三次”简明地保留原文次数，不额外说明每次的具体过程。
- source_word: εὐθὺς
  choice: 随即
  rationale: 表达紧接着发生的动作；“随即”既保留迅速性，又适合庄重而流畅的叙事。
- source_word: ἀνελήμφθη
  choice: 被接到……去了
  rationale: 保留不定过去时被动语态及向上的方向，而不擅自补出施事者；“接到……去了”比“拿上去”更符合异象语境。
- source_word: τὸ σκεῦος
  choice: 那器物
  rationale: σκεῦος是含义较宽的名词，可指器具、容器或物件；“器物”保留这种概括性，避免把本节没有使用的“布”直接写入正文。
- source_word: εἰς τὸν οὐρανόν
  choice: 到天上
  rationale: εἰς表示进入或朝向；异象语境支持“天上”，同时脚注保留“天空”这一词义可能。
theological_decisions:
- issue: οὐρανός在彼得异象中的所指
  choice: 天上
  alternative: 天空
  rationale: 该词既可指天空，也可指天上的领域；异象从天而降又被接回的语境较支持“天上”，但不排除空间性的“天空”，因此在脚注中保留另一译法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“器物”有意保留原文σκεῦος的宽泛含义；被动句不补明是谁把它接走，以维持原文的含蓄。
