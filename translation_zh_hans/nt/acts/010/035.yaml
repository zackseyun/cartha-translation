  rationale: 修订“各国”为“各民族”，以更贴合ἔθνος的族群含义；修订“行正义”为“行公义”，以避免把δικαιοσύνη限缩为司法或社会正义，并保留其道德正直的范围。重组句首为“但在……中，凡……的人，都……”，使中文转折和句法自然，同时不改变原文对神悦纳敬畏他并行公义之人的陈述，也不处理经文未明言的教义问题。
