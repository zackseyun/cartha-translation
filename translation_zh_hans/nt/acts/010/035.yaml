  text: ἀλλ’ ἐν παντὶ ἔθνει ὁ φοβούμενος αὐτὸν καὶ ἐργαζόμενος δικαιοσύνην δεκτὸς αὐτῷ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/035.yaml
  text: but in every nation the one who fears him and does what is righteous is acceptable to him[a][b][c].
translation:
  language: zh_hans
  text: 但在各民族中，凡敬畏他、行公义[a]的人，都蒙他悦纳[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “行公义”也可译作“行义”或“实行公义”。希腊文δικαιοσύνη通常指“公义／正直”，在某些语境也可译作“正义”。
    reason: lexical_alternative
  - marker: b
    text: “蒙他悦纳”也可译作“是他所悦纳的”或“是他可以接纳的”。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλ’
  choice: 而是
  rationale: 承接上一节“神不偏待人”的否定陈述，表达转折后的正面说明；中文用“而是”自然清楚。
- source_word: ἐν παντὶ ἔθνει
  choice: 各国中
  rationale: 保留παντί的周遍、分配意义和ἔθνος在此处的民族／国家群体含义，同时避免套用现代民族国家的狭义概念。
- source_word: ὁ φοβούμενος αὐτὸν
  choice: 敬畏他的人
  rationale: 将冠词化现在分词译为泛指的人；“敬畏”兼顾畏惧与对神的尊崇，不削弱其圣经语义。
- source_word: καὶ ἐργαζόμενος δικαιοσύνην
  choice: 行正义
  rationale: ἐργάζομαι表示实行、践行；“行正义”简洁自然，并保留δικαιοσύνη的名词性与道德实践含义。
- source_word: δεκτὸς αὐτῷ ἐστιν
  choice: 蒙他悦纳
  rationale: 表达δεκτός“可接纳、受欢迎”的意义；“蒙……悦纳”自然庄重，也体现αὐτῷ所指向的神是接纳者。
theological_decisions:
- issue: 本节是否宣称人凭行为赚得救恩
  choice: 直译神不分国族地悦纳敬畏他、行正义的人，不加入关于功德或救恩次序的解释。
  alternative: 译成“凭这些行为赢得神的接纳”，或解释为“这些行为证明他已有得救的信心”。
  rationale: 原文把敬畏神、实行正义与蒙神悦纳并列陈述，却没有说明因果机制；译文保留这一神学张力，不替经文解决更广泛的教义争论。
- issue: δεκτός是“可蒙悦纳”还是“已被接纳”
  choice: 蒙他悦纳
  alternative: 是他所悦纳的／是他可以接纳的
  rationale: δεκτός为表语形容词，可表示“可接受、受欢迎”；中文“蒙他悦纳”较自然，但可能略偏向实际被接纳，因此以脚注保留较形式对应的表达。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“各国中”保持跨国族的语境；“敬畏”沿用成熟且清楚的圣经用语；“行正义”避免生硬的“做公义”，并以脚注保留“公义”这一常见对应词。
