  text: τούτῳ πάντες οἱ προφῆται μαρτυροῦσιν, ἄφεσιν ἁμαρτιῶν λαβεῖν διὰ τοῦ ὀνόματος αὐτοῦ πάντα τὸν πιστεύοντα εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/043.yaml
  text: All the prophets testify about him that everyone who believes in him receives forgiveness of sins through his name[a].
translation:
  language: zh_hans
  text: 众先知都为他作见证[a]：凡信靠他的人，都借着他的名得到罪的赦免。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为他作见证”也可译作“论到他作见证”。
    reason: τούτῳ与μαρτυροῦσιν连用时，见证的内容是关于耶稣；主文采用自然的中文圣经语体，脚注说明较明确的表达。
lexical_decisions:
- source_word: τούτῳ
  choice: 为他
  rationale: 此与“作见证”连用的与格指向耶稣，可表达为替他、关于他作见证；“为他作见证”在现代汉语中自然，也保留见证对他的有利指向。
- source_word: πάντες οἱ προφῆται
  choice: 众先知都
  rationale: 准确表达全体先知的一致见证；“众……都”比逐字译作“所有的先知”更符合自然汉语。
- source_word: μαρτυροῦσιν
  choice: 作见证
  rationale: 保留该动词的证言和证明意味，也是现代中文圣经语境中清楚而庄重的表达。
- source_word: ἄφεσιν ἁμαρτιῶν
  choice: 罪的赦免
  rationale: 这是新约固定表达的自然译法，同时保留赦免的关系性与司法性含义。
- source_word: λαβεῖν
  choice: 得到
  rationale: 不定式陈述先知见证的内容；译成有限动词“得到”，可自然表达凡信者领受赦免这一普遍事实。
- source_word: διὰ τοῦ ὀνόματος αὐτοῦ
  choice: 借着他的名
  rationale: 保留原文“借着……的名”的中介性圣经用语，不擅自扩展为“借着他的权柄”等解释性说法。
- source_word: πάντα τὸν πιστεύοντα
  choice: 凡信他的人
  rationale: 单数阳性分词在此为泛指且具逐一涵盖的作用；“凡……的人”不限定性别，也自然体现普遍范围。
- source_word: εἰς αὐτόν
  choice: 信他
  rationale: πιστεύω与εἰς连用表示信靠指向某人；现代汉语“信他”简洁自然，并不只表示相信关于他的某项事实。
theological_decisions:
- issue: 赦免的范围与信的关系
  choice: 凡信耶稣的人，都借着他的名得到罪的赦免。
  alternative: 可用更强的教义性措辞解释救恩机制。
  rationale: 译文保持原文明确陈述的耶稣、信与罪得赦免之间的关系，不加入原文未说明的宗派性救恩机制。
- issue: 阳性单数分词的泛指范围
  choice: 凡信他的人
  alternative: 凡信他的男人
  rationale: 原文阳性单数在此是代表全体的泛指，并非排除女性；采用性别准确且自然的中文表达。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。句首保留先知见证的强调位置，以冒号引出见证内容；使用“众……都”和“凡……都”形成自然清晰的对应。
