id: ACT.10.42
reference: Acts 10:42
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ παρήγγειλεν ἡμῖν κηρύξαι τῷ λαῷ καὶ διαμαρτύρασθαι ὅτι ⸀οὗτός ἐστιν ὁ ὡρισμένος ὑπὸ τοῦ θεοῦ κριτὴς ζώντων καὶ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/042.yaml
  text: And he commanded us to proclaim to the people and to testify solemnly that this is the one appointed by God as judge of the living and the dead[a].
translation:
  language: zh_hans
  text: 他吩咐我们向百姓宣讲，并郑重作证：他就是上帝指定为审判活人和死人的审判者[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他就是上帝所命定、作活人和死人审判者的那一位。”
    reason: 词汇替代：ὁ ὡρισμένος可译为“所指定的”，也可译为“所命定的”；后者语气较庄重，但可能带有更强的神学联想。
lexical_decisions:
- source_word: παρήγγειλεν
  choice: 吩咐
  rationale: 该动词表示带有权威的命令或嘱咐。“吩咐”在现代汉语中自然庄重，也保留了权威性，不弱化为一般的“教导”。
- source_word: κηρύξαι
  choice: 宣讲
  rationale: κηρύσσω侧重公开传扬、宣告。“宣讲”既体现公开传播，也避免把含义局限于现代礼拜中的讲道。
- source_word: τῷ λαῷ
  choice: 向百姓
  rationale: 原文有定冠词，语境中指彼得所面对的犹太百姓，但本节没有明说“以色列”。译作“百姓”既符合语境，也不过度明示。
- source_word: διαμαρτύρασθαι
  choice: 郑重作证
  rationale: 该词表达严肃、恳切地作见证。“郑重作证”同时保留见证行为和加强的语气。
- source_word: οὗτός
  choice: 他就是
  rationale: 指示代词在此强调前文所说的耶稣。汉语用“他就是”自然地保留指认和强调作用。
- source_word: ὁ ὡρισμένος
  choice: 指定
  rationale: ὁρίζω的完成时被动分词表示已经被确定、委任，并持续具有这一身份。“指定”清楚表达这一点，且不额外引入后期神学术语色彩。
- source_word: ὑπὸ τοῦ θεοῦ
  choice: 上帝指定
  rationale: 这是被动结构中的施事者，直译为由上帝指定；汉语改用主动表达更自然，意义不变。
- source_word: κριτὴς
  choice: 审判者
  rationale: 保留原文的名词谓语，明确表达耶稣被指定所具有的身份，而不只描述一次审判行动。
- source_word: ζώντων καὶ νεκρῶν
  choice: 活人和死人
  rationale: 直接保留原文成对表达，庄重而清楚，表明其审判权涵盖所有人。
theological_decisions:
- issue: 耶稣受上帝指定施行审判的含义
  choice: 他就是上帝指定为审判活人和死人的审判者
  alternative: 他就是上帝所命定、作活人和死人审判者的那一位
  rationale: 译文明确保留上帝指定耶稣、耶稣具有普世审判者身份这两层意思，同时不扩展为本节未直接陈述的后期教义表述。“指定”与“命定”均可表达ὁρίζω，此处正文采用现代汉语更清楚自然的“指定”。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“向百姓宣讲”体现公开宣告，“郑重作证”保留原文加强语气；句末以“审判者”保留κριτής的身份性名词表达。
