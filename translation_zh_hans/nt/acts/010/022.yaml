revisions:
- from: 他们说：“哥尼流百夫长是个义人，敬畏上帝，并且得到全体犹太人民的称赞。他蒙一位圣天使指示，请你到他家里去，听你要说的话。”
  to: 他们说：“哥尼流是一位百夫长，是个义人，敬畏上帝，并且得到全体犹太人民的称赞。他蒙一位圣天使指示，把你请到他家里去，并听你所说的话。”
  rationale: 修订只解决汉语句法所造成的施事歧义，并使开头的同位介绍更自然。仍保留“蒙……指示”所表达的神圣传达、圣天使的明确修饰，以及“话”的开放性，未将其限定为讲道或信息。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T03:29:32Z'
review_pass:
  verdict: revise
  source_fidelity: 草稿准确传达了哥尼流的军职、义人及敬畏上帝的品格、他在犹太人中的好名声，以及圣天使所传达的指示。不过末句“请你到他家里去，听你要说的话”在汉语中会使“听”的施事不清，甚至容易读成彼得去听自己所说的话；原文两个不定式的执行者都是哥尼流，须明确保留。
  naturalness: “哥尼流百夫长是个义人”略显压缩，改为“哥尼流是一位百夫长，是个义人”更符合现代汉语的介绍性叙述。将末句改为“指示他把你请到他家里去，并听你所说的话”，可清楚呈现行动者和语义关系。
  terminology: “百夫长”“义人”“敬畏上帝”“圣天使”均合乎庄重的现代汉语圣经语域，也没有引入额外的教义判断。“全体犹太人民”恰当表达此处指族群的ἔθνος。
