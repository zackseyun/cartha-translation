    rationale: 原文的“召你到他家里”和“听从你而来的话”都以哥尼流为行动者；现译的祈使式“请你到……”之后接“听你……”，容易造成彼得是“听”的行动者的误读。
  - severity: low
    issue: “哥尼流百夫长是个义人”结构略不自然
    rationale: 原文是对哥尼流身份和品格的同位描述；汉语以“哥尼流是一位百夫长，是个义人”分开表达更顺畅清晰。
