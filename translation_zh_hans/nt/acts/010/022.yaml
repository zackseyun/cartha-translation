  text: οἱ δὲ εἶπαν· Κορνήλιος ἑκατοντάρχης, ἀνὴρ δίκαιος καὶ φοβούμενος τὸν θεὸν μαρτυρούμενός τε ὑπὸ ὅλου τοῦ ἔθνους τῶν Ἰουδαίων, ἐχρηματίσθη ὑπὸ ἀγγέλου ἁγίου μεταπέμψασθαί σε εἰς τὸν οἶκον αὐτοῦ καὶ ἀκοῦσαι ῥήματα παρὰ σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/022.yaml
  text: They said[a], “Cornelius, a centurion, a righteous man and one who fears God, and who is well spoken of by the whole nation of the Jews[e][d][c][b], was divinely instructed by a holy angel to summon you to his house and to hear words from you.”
translation:
  language: zh_hans
  text: 他们说：“哥尼流是一位百夫长，是个义人，敬畏上帝，并且得到全体犹太人民的称赞。他蒙一位圣天使指示，把你请到他家里去，并听你所说的话。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἑκατοντάρχης
  choice: 百夫长
  rationale: 这是罗马军官职衔在现代汉语圣经语境中的通行译法，简洁而准确。
- source_word: ἀνὴρ δίκαιος
  choice: 是个义人
  rationale: 保留 δίκαιος 的道德与宗教含义；“义人”是自然、庄重且为普通读者熟悉的表达。
- source_word: φοβούμενος τὸν θεόν
  choice: 敬畏上帝
  rationale: 保留原文的动词性和圣经惯用语，同时不把哥尼流的身份进一步归入后来的神学类别。
- source_word: μαρτυρούμενος
  choice: 得到……的称赞
  rationale: 被动分词表示别人为他作正面见证；此处译为“得到……的称赞”符合现代汉语习惯。
- source_word: ὑπὸ ὅλου τοῦ ἔθνους τῶν Ἰουδαίων
  choice: 全体犹太人民
  rationale: ἔθνος 在这里指族群或人民，而非现代政治国家；这一译法避免“犹太国”的误解。
- source_word: ἐχρηματίσθη
  choice: 蒙……指示
  rationale: 该动词在此表示领受来自神的传达或指示；“蒙……指示”保留被动意义及神圣来源，而不窄化为警告。
- source_word: ἀγγέλου ἁγίου
  choice: 一位圣天使
  rationale: 明确呈现原文中的 ἁγίου，并以自然汉语保留天使的圣洁属性。
- source_word: μεταπέμψασθαί σε εἰς τὸν οἶκον αὐτοῦ
  choice: 请你到他家里去
  rationale: μεταπέμπομαι 指派人去请或召来某人；在使者直接对彼得说话的场景中，“请你到他家里去”自然表达了召请和目的地，且语气不被不必要地强化。
- source_word: ἀκοῦσαι ῥήματα παρὰ σοῦ
  choice: 听你要说的话
  rationale: 贴近“听从你而来的话语”，又比生硬的“听你的言语”更符合现代汉语；不将内容过度限定为讲章或正式信息。
theological_decisions:
- issue: 如何表达哥尼流的虔诚而不引入后期教义分类
  choice: 是个义人，敬畏上帝
  alternative: 是个虔诚人／是个公义且敬畏上帝的人
  rationale: 原文以犹太道德与宗教用语肯定哥尼流，却没有在本节界定其救恩或圣约地位；译文保留这种肯定及其神学张力。
- issue: ἐχρηματίσθη 的神圣来源
  choice: 蒙一位圣天使指示
  alternative: 受一位圣天使警告／从一位圣天使领受神谕
  rationale: 上下文是传达行动指令，并非明显的危险警告；“指示”既体现神圣传达，也避免把“神谕”这一较专门概念强加给普通读者。
translation_notes:
  register: 采用现代标准普通话的庄重叙事语体。句式按汉语信息结构分开处理连续的希腊分词和不定式，避免欧化长句；“百夫长、义人、敬畏上帝、圣天使”等保留圣经历史语域，同时确保普通现代读者容易理解。
