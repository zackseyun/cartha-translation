  text: προσέταξεν ⸀δὲ αὐτοὺς ⸂ἐν τῷ ὀνόματι Ἰησοῦ Χριστοῦ βαπτισθῆναι⸃. τότε ἠρώτησαν αὐτὸν ἐπιμεῖναι ἡμέρας τινάς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/048.yaml
  text: So he ordered them to be baptized in the name of Jesus the Messiah[a]. Then they asked him to remain for some days.
translation:
  language: zh_hans
  text: 于是，他吩咐他们奉耶稣这位弥赛亚[a]的名受洗。随后，他们请他留下几天。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶稣这位弥赛亚”传统译作“耶稣基督”。
    reason: 保留Χριστός的传统汉语译法，同时说明正文采用了称号意义更明确的译法。
lexical_decisions:
- source_word: προσέταξεν
  choice: 吩咐
  rationale: 该词表示带有权威的指示；“吩咐”在现代汉语中自然庄重，也保留其权威语气。
- source_word: δὲ
  choice: 于是
  rationale: 此处主要推进叙事，并承接上文的结果，而非表达强烈转折。
- source_word: ἐν τῷ ὀνόματι
  choice: 奉……的名
  rationale: “奉……的名”是自然且沿用已久的汉语表达，可涵盖权柄、归属和宣认等含义，不把原文收窄为单一解释。
- source_word: Ἰησοῦ Χριστοῦ
  choice: 耶稣这位弥赛亚
  rationale: Χριστοῦ在这里具有称号性质；“这位”使称号与人名的关系在现代汉语中清楚自然，同时保留“弥赛亚”的称号含义。
- source_word: βαπτισθῆναι
  choice: 受洗
  rationale: 准确体现不定式的被动意义，并采用现代汉语中通行而不过度限定施洗方式的表达。
- source_word: τότε
  choice: 随后
  rationale: 表示接下来发生的事；“随后”可清楚标明先后次序，并避免与前句“于是”重复。
- source_word: ἠρώτησαν
  choice: 请
  rationale: 此处指请求某人留下；汉语“请”比直译为“问”更符合语境，又不夸大恳求的强度。
- source_word: ἐπιμεῖναι
  choice: 住
  rationale: 在此语境中指继续停留一段时间；“住”简洁自然。
- source_word: ἡμέρας τινάς
  choice: 几天
  rationale: 保留原文对时长的不确定性，不武断限定为确切的少数或多数天。
theological_decisions:
- issue: 洗礼表述中Χριστοῦ的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处Χριστός作为耶稣的称号具有宣认意味，因此正文译出称号的含义；同时以脚注保留汉语圣经传统中通行的“基督”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“奉……的名受洗”保留原文神学表达的开放性；代词“他”依上下文指彼得，不在正文中额外补名。
