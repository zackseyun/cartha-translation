source:
  edition: SBLGNT
  text: οἵ ⸀τε ὄχλοι ἰδόντες ὃ ⸀ἐποίησεν Παῦλος ἐπῆραν τὴν φωνὴν αὐτῶν Λυκαονιστὶ λέγοντες· Οἱ θεοὶ ὁμοιωθέντες ἀνθρώποις κατέβησαν πρὸς ἡμᾶς
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/011.yaml
  text: And when the crowds saw what Paul had done[a], they raised their voices, saying in the Lycaonian language, “The gods, having become like men[b], have come down to us!”
translation:
  language: zh_hans
  text: 群众看见保罗所做的事，就提高嗓门，用吕高尼话说：“众神变得和人一样，降到我们这里来了！”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἵ τε ὄχλοι ἰδόντες
  choice: 群众看见……就
  rationale: τέ承接上文；不定过去时分词ἰδόντες在此表示主句动作发生的时间和缘由。汉语用“看见……就”自然地保留事件次序。ὄχλοι虽为复数，汉语集合名词“群众”无需标明复数。
- source_word: ὃ ἐποίησεν Παῦλος
  choice: 保罗所做的事
  rationale: 关系从句指上一节保罗施行的医治；此译不额外添加“神迹”等解释性词语。
- source_word: ἐπῆραν τὴν φωνὴν αὐτῶν
  choice: 提高嗓门
  rationale: 原文直译为“抬高他们的声音”，是高声说话的习语。“提高嗓门”既保留原有意象，也符合现代汉语表达。
- source_word: Λυκαονιστί
  choice: 用吕高尼话
  rationale: 该副词表示以吕高尼当地语言说话；“吕高尼话”简明自然。
- source_word: Οἱ θεοὶ
  choice: 众神
  rationale: θεοί为复数，指群众所信奉的异教神明；“众神”清楚保留复数。
- source_word: ὁμοιωθέντες ἀνθρώποις
  choice: 变得和人一样
  rationale: ὁμοιωθέντες是ὁμοιόω的不定过去时被动分词，表达成为或被显为与人相似。此译保留变化及相似之意，同时避免生硬的“被做成像人”。ἀνθρώποις泛指人类，故译“人”而非特指男性。
- source_word: κατέβησαν πρὸς ἡμᾶς
  choice: 降到我们这里来了
  rationale: καταβαίνω表示从上而下地来到；句末“来了”符合群众当下惊叹的语气，并传达行动与当前处境的关联。
theological_decisions:
- issue: 如何呈现路司得群众的异教解释，而不引入基督教道成肉身的专门含义
  choice: 众神变得和人一样，降到我们这里来了
  alternative: 众神取了人的形体，降到我们这里来了
  rationale: 经文是在转述群众对保罗和巴拿巴的错误理解。“变得和人一样”贴近ὁμοιωθέντες ἀνθρώποις所表达的相似关系，又不使用“道成肉身”或“取了人的形体”等可能带有更强基督论联想的措辞。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事表达。引语保留群众激动的惊叹语气；不添加原文没有的神学评判，因为后文将由叙事本身纠正他们的认识。
