  text: οὗτος ⸀ἤκουσεν τοῦ Παύλου λαλοῦντος· ὃς ἀτενίσας αὐτῷ καὶ ἰδὼν ὅτι ⸂ἔχει πίστιν⸃ τοῦ σωθῆναι
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/009.yaml
  text: This man listened to Paul speaking[a], who, looking intently at him and seeing that he had faith to be saved,
translation:
  language: zh_hans
  text: 这人听保罗讲道。保罗定睛看他，见他有信心可以得医治[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“可以得救”。希腊语这个动词既可指“拯救”，也可指“医治”；这里的上下文侧重身体得医治。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτος
  choice: 这人
  rationale: 指回上一节那位生来瘸腿的人；“这人”在现代汉语中自然，也保留明确指称。
- source_word: ἤκουσεν
  choice: 听
  rationale: 表达他听保罗讲话这一事件；汉语“听”在此语境中可自然包含留心听的意味，无须强化为“专心听”。
- source_word: τοῦ Παύλου λαλοῦντος
  choice: 保罗讲道
  rationale: 字面为“保罗说话”；上下文是公开传讲福音，译作“讲道”自然庄重，同时不增添具体讲论内容。
- source_word: ἀτενίσας αὐτῷ
  choice: 定睛看他
  rationale: 保留动词所表达的专注凝视；“定睛看”是自然且庄重的现代汉语。
- source_word: ἰδὼν
  choice: 见
  rationale: 保留感知动词的具体表达，同时容纳保罗辨识其信心的语境含义。
- source_word: ἔχει πίστιν
  choice: 有信心
  rationale: πίστις在这里指此人相信并期待领受上帝帮助的回应，并非其自身的忠信；“有信心”是准确自然的对应。
- source_word: τοῦ σωθῆναι
  choice: 可以得医治
  rationale: σῴζω可指拯救，也可指医治、恢复健康；紧接着的神迹叙事明确涉及瘸腿者身体康复，因此正文采用“得医治”，并以脚注保留较宽的“得救”可能。
theological_decisions:
- issue: 医治叙事中 σωθῆναι 的含义
  choice: 身体得医治（“可以得医治”）
  alternative: 较广义的得救（“可以得救”）
  rationale: 直接语境及下一节都指向身体恢复。正文采用“得医治”以清楚表达当下叙事意义，但原词具有“拯救／使痊愈”的较宽语义范围，因此用脚注保留神学张力，避免断言这里完全不含更广的救恩回响。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“讲道”符合使徒行传公开宣讲的场景；以两个短分句理顺希腊语关系从句在汉语中的指代，避免把“他”误解为那位瘸腿的人。经文在下一节续接，故句末保留逗号。
