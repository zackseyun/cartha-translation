  text: χειροτονήσαντες δὲ αὐτοῖς ⸂κατ’ ἐκκλησίαν πρεσβυτέρους⸃ προσευξάμενοι μετὰ νηστειῶν παρέθεντο αὐτοὺς τῷ κυρίῳ εἰς ὃν πεπιστεύκεισαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/023.yaml
  text: And after appointing elders for them in every church[a], and praying with fasting, they entrusted them to the Lord[c][b], in whom they had believed.
translation:
  language: zh_hans
  text: 二人在各教会中为信徒选立长老[a]，并祷告禁食之后，就把他们交托给他们所信靠的主[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “选立”或译“任命”。这个希腊词在某些语境中可指以举手方式选出，但本节未明确说明具体程序。
    reason: alternative_reading
  - marker: b
    text: “把他们交托”中的“他们”也可能专指刚被选立的长老，而不是各教会的信徒整体。
    reason: alternative_reading
lexical_decisions:
- source_word: χειροτονήσαντες
  choice: 选立
  rationale: 此词在这里表示拣选并设立人担任职分；“选立”既保留选择与任命两方面的含义，也不限定具体采用举手表决或其他教会治理程序。
- source_word: κατ’ ἐκκλησίαν
  choice: 在各教会
  rationale: κατά与单数名词构成分配用法，表示逐个地方教会；“在各教会”自然传达每个教会都有长老被设立。
- source_word: πρεσβυτέρους
  choice: 长老
  rationale: 在教会语境中指获认可的教会带领者，而不只是年长男子；“长老”是现代中文清楚且通行的译法。
- source_word: προσευξάμενοι μετὰ νηστειῶν
  choice: 并且祷告、禁食
  rationale: 两个行动伴随选立长老，并在“交托”之前发生；中文以并列动词自然表达祷告伴随着禁食。
- source_word: παρέθεντο
  choice: 交托
  rationale: 中间语态在此表示将人托付于另一位的看顾；“交托”准确保留这种关系性的含义。
- source_word: τῷ κυρίῳ
  choice: 给……主
  rationale: 与“交托”连用，表示被托付给谁看顾；κύριος按此处基督信仰语境译为“主”。
- source_word: εἰς ὃν πεπιστεύκεισαν
  choice: 他们所信的
  rationale: πιστεύω εἰς表示以某人为信靠对象；过去完成时指此前已经发生并持续有效的信靠，中文“所信的”在语境中自然涵盖这一点。
- source_word: αὐτοῖς ... αὐτοὺς
  choice: 为他们……把他们
  rationale: 保留原文代词，不在正文中强行判定第二个“他们”专指众信徒还是新立的长老；脚注说明其指代歧义。
theological_decisions:
- issue: χειροτονήσαντες是否规定了特定的教会选举方式
  choice: 译作“选立长老”
  alternative: 译作“举手选出长老”或“任命长老”
  rationale: 词源和某些语境可涉及举手表决，但在本节中也可泛指选立或任命。正文不引入原文没有明确规定的宗派治理模式。
- issue: παρέθεντο αὐτοὺς中“他们”的指代
  choice: 正文保留“把他们交托”，较自然地让人理解为各教会的信徒
  alternative: 专指刚被选立的长老
  rationale: 上下文聚焦门徒和各地教会，因而整体信徒是较自然的所指；不过最近的复数名词是“长老”，故在脚注中保留另一种可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“二人”承接上下文中的保罗和巴拿巴，避免连续多个“他们”造成主体混淆。句法按希腊文行动次序表达：选立长老并祷告禁食，随后交托。正文保留代词指代上的真实歧义，并以脚注说明。
