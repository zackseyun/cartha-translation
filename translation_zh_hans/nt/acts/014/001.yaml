  text: Ἐγένετο δὲ ἐν Ἰκονίῳ κατὰ τὸ αὐτὸ εἰσελθεῖν αὐτοὺς εἰς τὴν συναγωγὴν τῶν Ἰουδαίων καὶ λαλῆσαι οὕτως ὥστε πιστεῦσαι Ἰουδαίων τε καὶ Ἑλλήνων πολὺ πλῆθος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/001.yaml
  text: In Iconium they entered together into the synagogue of the Jews and spoke in such a way that a great multitude of both Jews and Greeks believed[a].
translation:
  language: zh_hans
  text: 在以哥念，他们一同进了犹太人的会堂[a]，并且如此讲论，以致有许多犹太人和希腊人信了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“犹太会堂”。希腊文直译为“犹太人的会堂”。
    reason: 词语的另一种译法；说明原文属格结构。
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: （不单独译出）
  rationale: 这一叙事结构主要承接上下文，并引出随后发生的事；现代汉语无需机械译作“事情发生了”或另加“现在”。
- source_word: ἐν Ἰκονίῳ
  choice: 在以哥念
  rationale: 按地点状语直译，地名采用现代中文圣经中通行的音译。
- source_word: κατὰ τὸ αὐτό
  choice: 一同
  rationale: 在本句中自然表示保罗和巴拿巴共同采取行动；“一同”简洁清楚，也避免误解为“照样”。
- source_word: εἰσελθεῖν αὐτοὺς
  choice: 他们……进了
  rationale: 将依附于叙事结构的不定式按现代汉语转换为限定谓语，并保留原文代词，不擅自补入姓名。
- source_word: εἰς τὴν συναγωγὴν τῶν Ἰουδαίων
  choice: 进了犹太人的会堂
  rationale: 明确保留属格“犹太人的”，贴近原文；“犹太会堂”作为自然的替代译法收入脚注。
- source_word: λαλῆσαι
  choice: 讲论
  rationale: 此处指公开传讲；“讲论”比笼统的“说话”更符合语境，又不额外补出原文未明说的内容。
- source_word: οὕτως ὥστε
  choice: 如此……以致
  rationale: 保留原文所表达的方式及其结果，同时不擅自说明他们究竟以何种方式或能力讲论。
- source_word: πιστεῦσαι
  choice: 信了
  rationale: 直接对应相信、信从的回应，既符合叙事中的归信语境，也不补出原文省略的宾语。
- source_word: Ἰουδαίων τε καὶ Ἑλλήνων πολὺ πλῆθος
  choice: 许多犹太人和希腊人都
  rationale: 以自然现代汉语表达两类人中有大量的人相信；“都”对应 τε καὶ 对两组人的并列涵盖，不表示每一个犹太人和希腊人都相信。
theological_decisions:
- issue: πιστεῦσαι在归信叙事中的含义
  choice: 信了
  alternative: 相信了这信息；归信了
  rationale: 原文没有明说所信的宾语。“信了”保留这种简洁性，并延续 πιστ- 词族通常以“信”表达的对应关系，避免加入超出本节措辞的解释。
- issue: οὕτως ὥστε所表达的方式与结果
  choice: 如此讲论，以致……信了
  alternative: 讲了道，结果……信了
  rationale: 所选译法同时保留“如此”的方式意味和“以致”的结果意味，不把人的相信简化为纯粹机械因果，也不削弱叙述所呈现的结果联系。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“如此讲论，以致”略带书面色彩，但清楚保留希腊文的方式—结果结构；全句避免古奥表达，也不添加原文未明说的讲道内容或能力来源。
