source:
  edition: SBLGNT
  text: καὶ λέγοντες· Ἄνδρες, τί ταῦτα ποιεῖτε; καὶ ἡμεῖς ὁμοιοπαθεῖς ἐσμεν ὑμῖν ἄνθρωποι, εὐαγγελιζόμενοι ὑμᾶς ἀπὸ τούτων τῶν ματαίων ἐπιστρέφειν ἐπὶ ⸀θεὸν ζῶντα ὃς ἐποίησεν τὸν οὐρανὸν καὶ τὴν γῆν καὶ τὴν θάλασσαν καὶ πάντα τὰ ἐν αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/015.yaml
  text: and saying[a], “Men, why are you doing these things? We also are men with the same nature as you, bringing you good news to turn from these worthless things to the living God[c][b], who made the heaven and the earth and the sea and everything in them.”
translation:
  language: zh_hans
  text: 他们说：“各位，为什么做这些事呢？我们也是和你们一样的人。[a]我们向你们传好消息，为要你们离弃这些虚妄的事，[b]归向那位活着的上帝；他创造了天[c]、地、海和其中的一切。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们也是与你们同受人世处境的人。”原文强调保罗和巴拿巴与听众同属凡人，并非神明。
    reason: lexical_alternative
  - marker: b
    text: “这些虚妄的事”在本段语境中包括偶像以及徒然无效的异教崇拜。
    reason: cultural_note
  - marker: c
    text: “天”也可译为“诸天”；希腊文在此用单数，属于圣经中常见的创造表述。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες
  choice: 各位
  rationale: 这是对现场人群的直接呼语。现代汉语用“各位”自然庄重，也避免生硬的“男人们”；上下文并不要求借此强调听众性别。
- source_word: ὁμοιοπαθεῖς ... ἄνθρωποι
  choice: 不过是人，和你们有同样的人性
  rationale: 表达保罗和巴拿巴与听众同属凡人、共有人的处境，突出他们并非神明；不把词义缩窄为仅有“同样的感受”。
- source_word: εὐαγγελιζόμενοι
  choice: 向你们传好消息
  rationale: 保留动词“宣告好消息”的基本意义，同时采用普通读者易懂的现代汉语，避免把后期教会术语预先带入。
- source_word: ἀπὸ τούτων τῶν ματαίων
  choice: 离弃这些虚妄之物
  rationale: “虚妄之物”兼具空洞、徒劳和无价值的评价色彩，并保留原文没有直接使用“偶像”一词的宽泛表达。
- source_word: ἐπιστρέφειν ἐπὶ θεὸν ζῶντα
  choice: 归向那位永活的上帝
  rationale: “离弃……归向……”自然呈现方向转换；“永活”与无生命、无效的敬拜对象形成鲜明对照。
- source_word: ἐποίησεν τὸν οὐρανὸν καὶ τὴν γῆν καὶ τὴν θάλασσαν καὶ πάντα τὰ ἐν αὐτοῖς
  choice: 创造了天、地、海和其中的一切
  rationale: “创造”在此准确表达上帝的创世作为；保留天、地、海以及其中万有的完整并列结构，同时符合现代汉语习惯。
theological_decisions:
- issue: 保罗和巴拿巴与受神圣尊荣之间的对比
  choice: 我们也不过是人，和你们有同样的人性
  alternative: 我们也是与你们性情相同的人
  rationale: 译文明确拒绝把使徒视为神明，并保留“共有人的本性和处境”的含义；“性情相同”容易被误解为脾气、情绪相同。
- issue: “虚妄之物”的范围
  choice: 主文保留宽泛的反偶像崇拜措辞
  alternative: 这些偶像
  rationale: 语境确实涉及异教献祭和偶像崇拜，但希腊文使用的是 substantivized adjective，范围比直接写“偶像”更广，因此主文不应过度限定。
- issue: “永活的上帝”的对比意义
  choice: 保留“永活”而不明说“真神”或“活神”
  alternative: 活着的上帝
  rationale: “永活”是自然、庄重的汉语神学表达，传达持续有生命并能行动的上帝，与虚妄无力之物形成对比，又不额外加入原文没有的“真”。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“各位”适合公开劝阻的现场呼语；“不过是人”强化反对神化使徒的语用重点；“离弃……归向……”以自然汉语呈现原文的方向性。所有脚注标记均置于与说明直接相关的主文位置。
