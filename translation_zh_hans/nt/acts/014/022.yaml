id: ACT.14.22
reference: Acts 14:22
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐπιστηρίζοντες τὰς ψυχὰς τῶν μαθητῶν, παρακαλοῦντες ἐμμένειν τῇ πίστει καὶ ὅτι διὰ πολλῶν θλίψεων δεῖ ἡμᾶς εἰσελθεῖν εἰς τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/022.yaml
  text: strengthening the souls of the disciples[a], encouraging them to remain in the faith[c][b], and saying that through many afflictions we must enter the kingdom of God.
translation:
  language: zh_hans
  text: 坚固门徒的心，劝勉他们持守这信仰，并说：“我们必须经历许多患难，才能进入上帝的国。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们必须经过许多患难，进入上帝的国。”
    reason: “经历……才能进入”自然表达了希腊文的路径与必要关系；直译“经过……进入”则更贴近原句结构，也避免读者把“才能”误解为功德条件。
lexical_decisions:
- source_word: ἐπιστηρίζοντες
  choice: 坚固
  rationale: 表达使人更加坚定、持续得到巩固的意思；与“门徒的心”搭配自然，也不引入正式设立之意。
- source_word: τὰς ψυχὰς τῶν μαθητῶν
  choice: 门徒的心
  rationale: ψυχή在此指人的内在生命与整个人格状态。现代汉语用“心”较自然，保留属灵和内在层面，同时避免把人机械地分为灵魂与身体。
- source_word: παρακαλοῦντες
  choice: 劝勉
  rationale: 兼具鼓励与敦促的语气，适合后接“持守”，也符合患难语境中的扶持性劝告。
- source_word: ἐμμένειν τῇ πίστει
  choice: 持守这信仰
  rationale: ἐμμένειν表示继续留在、恒常坚持；定冠词使πίστις较可能指门徒共同领受的信仰。“这信仰”在现代汉语中比单说“信德”或“信心”更能体现其明确所指。
- source_word: διὰ πολλῶν θλίψεων
  choice: 经历许多患难
  rationale: διά加属格表达经过或借着；汉语“经历许多患难”自然地呈现通往上帝国度途中必经苦难的意思。θλῖψις指压力、困苦、逼迫或患难，此处用涵盖面较广的“患难”。
- source_word: δεῖ ἡμᾶς
  choice: 我们必须
  rationale: 保留非人称必要性的强度，却不额外说明这种必要性的机制或来源。
- source_word: εἰσελθεῖν εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: 进入上帝的国
  rationale: “进入……国”是自然现代汉语，也忠实表达朝向并进入该领域；“上帝的国”保留βασιλεία兼具国度与统治的传统表达。
theological_decisions:
- issue: 带定冠词的πίστις所指
  choice: 这信仰
  alternative: 信心
  rationale: τῇ使其较可能指门徒所领受并共同持守的信仰，而不只指主观相信的行为；“这”表达语境中的确定所指，但不把它过度技术化为后世教义体系。
- issue: δεῖ所表达的必要性
  choice: 我们必须经历许多患难，才能进入上帝的国
  alternative: 我们进入上帝的国，必须经过许多患难
  rationale: 保留进入国度与许多患难之间的必要关系，不扩展为苦难赚取救恩，也不说明其背后的预定机制。
- issue: 患难与进入上帝国度的关系
  choice: 必须经历许多患难，才能进入
  alternative: 必须借着许多患难进入
  rationale: “经历……才能进入”在汉语中清楚表达διά的路径意义；这里的“才能”表示必经关系，并非把患难说成取得国度的功德或原因。
translation_notes:
  register: 采用现代、庄重而易懂的叙事用语。“坚固门徒的心”比“坚固门徒的灵魂”更符合现代汉语习惯；引号补明ὅτι所引出的言说内容。主文保留“患难”“上帝的国”等圣经语域中通行且清楚的表达。
