  yaml_path: translation/nt/acts/014/025.yaml
  text: And after speaking the word in Perga[a], they went down to Attalia,
translation:
  language: zh_hans
  text: 他们在别加传讲了这道，就下到亚大利。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαλήσαντες
  choice: 传讲了
  rationale: 该词是简单过去时主动分词，表示先于主句动作发生的行动；中文用“传讲了……就……”自然表达先后关系。“传讲”符合宣讲信息的语境，同时不采用比原词更强的“宣告”。
- source_word: τὸν λόγον
  choice: 这道
  rationale: 在使徒行传的宣教语境中，λόγος指所传的福音信息。“道”保留路加著作中反复出现的基督教用语；加“这”使现代汉语表达自然，又不增补原文没有的“主的”。
- source_word: ἐν Πέργῃ
  choice: 在别加
  rationale: ἐν加城市名表示行动发生的地点，直译并自然表达为“在别加”。
- source_word: κατέβησαν
  choice: 下到
  rationale: καταβαίνω表示向下行，可能反映从内陆的别加前往沿海亚大利的地势变化。“下到”既保留方向含义，也适合中文旅行叙事。
- source_word: εἰς Ἀττάλειαν
  choice: 亚大利
  rationale: εἰς标明目的地；与“下到”连用时，中文无需另加“往”，即可自然表达前往亚大利。
- source_word: καὶ
  choice: 就
  rationale: καί承接旅行叙事；结合前置分词，译作“就”可自然连接先后动作，不额外强化因果关系。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“这道”沿用圣经语境中熟悉的表达；整句保持简洁，并保留从别加向亚大利“下去”的地理方向感。
