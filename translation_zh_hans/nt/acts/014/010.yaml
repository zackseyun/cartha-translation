  yaml_path: translation/nt/acts/014/010.yaml
  text: He said in a loud voice[b][a], “Stand upright on your feet.” And he leaped up and began walking.
translation:
  language: zh_hans
  text: 他大声说：“起来，双脚站直！”那人就一跃而起，走了起来。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那人就跳了起来，继续行走。”末一个动词为未完成时，可能强调持续行走，也可能强调开始行走。
    reason: lexical_alternative
lexical_decisions:
- source_word: μεγάλῃ φωνῇ
  choice: 大声
  rationale: 该与格短语表示说话的方式；“大声说”是现代汉语自然、清楚的表达，也保留了话语响亮而公开的意味。
- source_word: Ἀνάστηθι
  choice: 起来
  rationale: ἀνίστημι的简单过去时命令式要求这人起身；“起来”与下文“双脚站直”衔接自然，并保留动作的直接性。
- source_word: ἐπὶ τοὺς πόδας σου ὀρθός
  choice: 双脚站直
  rationale: 该短语要求人用自己的双脚直立。“双脚站直”符合现代汉语习惯，也明确表达ὀρθός所指的挺直、直立姿势。
- source_word: ἥλατο
  choice: 一跃而起
  rationale: ἅλλομαι表示突然跃起；“一跃而起”保留了叙事中动作的迅速和鲜明。
- source_word: περιεπάτει
  choice: 走了起来
  rationale: 未完成时可表示持续行走，也可在此语境中突出动作的开始；“走了起来”自然地表达医治后开始行走，同时以脚注保留另一种理解。
theological_decisions:
- issue: 神迹叙述与姿势命令
  choice: 按原文直接叙述命令及其立即发生的身体反应，不作神学性扩充。
  alternative: 在译文中明说医治的施行者、机制或神学意义。
  rationale: 希腊文只记载响亮的命令，以及那人随即跃起并行走；译文应保留神迹的具体性和即时性，却不加入本节未明说的解释。
- issue: περιεπάτει未完成时的语气
  choice: 正文译为“走了起来”，突出动作的开始。
  alternative: 译为“走着”或“不断行走”，突出动作的持续。
  rationale: 未完成时在上下文中可有起始或持续意味；正文采用较自然的起始表达，脚注保留持续性理解，避免把语法张力完全消除。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“大声说”“一跃而起”“走了起来”自然流畅；命令句简洁有力。未使用古雅的“立于双足之上”等表达。
