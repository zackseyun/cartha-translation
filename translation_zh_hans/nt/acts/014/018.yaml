  text: καὶ ταῦτα λέγοντες μόλις κατέπαυσαν τοὺς ὄχλους τοῦ μὴ θύειν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/018.yaml
  text: Even by saying these things, they barely restrained the crowds from sacrificing to them.
translation:
  language: zh_hans
  text: 他们说了这些话，也只能勉强制止群众向他们献祭。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ταῦτα λέγοντες
  choice: 即使说了这些话
  rationale: καί 在这里结合 μόλις 表达让步意味；译作“即使”自然呈现：他们虽已如此劝阻，仍几乎无法制止群众。
- source_word: μόλις κατέπαυσαν
  choice: 也只是勉强制止
  rationale: μόλις 表示“好不容易、勉强”；καταπαύω 在此指使群众停止既定行动，译作“制止”准确而自然。
- source_word: τοὺς ὄχλους
  choice: 众人
  rationale: 复数形式指现场聚集的群众；“众人”符合现代中文叙事表达。
- source_word: τοῦ μὴ θύειν αὐτοῖς
  choice: 向他们献祭
  rationale: 该属格不定式补充说明所制止的行为；θύω 在宗教语境中是“献祭”，αὐτοῖς 指巴拿巴和保罗。
theological_decisions:
- issue: 群众献祭的对象
  choice: 保留“向他们”，承接上下文中的巴拿巴和保罗
  alternative: 明说“向巴拿巴和保罗”
  rationale: 原文使用代词 αὐτοῖς；保留代词既忠实于句法，也不加入原文未重复的信息。
- issue: 劝阻行动的困难程度
  choice: “即使……也只是勉强”
  alternative: “说了这些话以后，他们才勉强……”
  rationale: 前者保留原句中可能具有的让步张力，强调这些话仍不足以轻易阻止群众，而不把 μόλις 弱化为单纯的时间结果。
translation_notes:
  register: 采用简洁、庄重而通俗的现代汉语。“即使……也只是勉强”突出原文的让步语气和 μόλις 所表达的艰难程度。
