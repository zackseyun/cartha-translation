  text: κἀκεῖθεν ἀπέπλευσαν εἰς Ἀντιόχειαν, ὅθεν ἦσαν παραδεδομένοι τῇ χάριτι τοῦ θεοῦ εἰς τὸ ἔργον ὃ ἐπλήρωσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/026.yaml
  text: And from there they sailed to Antioch[b][a], where they had been committed to the grace of God for the work that they had fulfilled.
translation:
  language: zh_hans
  text: 他们从那里乘船前往安提阿；他们先前曾从安提阿被交托给上帝的恩典[a]，去做那已经完成[b]的工作。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被交托给”也可译作“被托付给”。
    reason: lexical_alternative
  - marker: b
    text: “完成”也可译作“履行完毕”。
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: 他们从那里
  rationale: 既保留叙事承接关系，也自然表达从前一地点离开的空间含义。
- source_word: ἀπέπλευσαν
  choice: 乘船回到
  rationale: ἀποπλέω明确表示乘船离去；结合安提阿是本次行程的出发地，用“回到”自然呈现此次航行为返程，而不改变目的地。
- source_word: εἰς Ἀντιόχειαν
  choice: 安提阿
  rationale: 按现代汉语通行译名音译地名；与移动动词连用，表达航行的目的地。
- source_word: ὅθεν
  choice: 他们先前就是从那里出发
  rationale: ὅθεν含“从那里”之意，所指为刚提到的安提阿。补出“出发”使其来源义在汉语中清楚，并避免两个“那里”所指混淆。
- source_word: ἦσαν παραδεδομένοι
  choice: 被交托给
  rationale: 这一迂回过去完成时表示在本次工作以前已经发生的交托，并对随后工作持续有效；“被交托给”保留被动含义，也不额外规定教会礼仪或差派方式。
- source_word: τῇ χάριτι τοῦ θεοῦ
  choice: 上帝的恩典
  rationale: 保留属格结构及其神学分量；与“被交托给”相连，表达他们被置于上帝恩典的眷顾之下。
- source_word: εἰς τὸ ἔργον
  choice: 去做……的工作
  rationale: εἰς在此表达目的，“工作”直接对应ἔργον，不用“使命”等解释性更强的词。
- source_word: ὃ ἐπλήρωσαν
  choice: 如今已经完成的
  rationale: πληρόω在此指把工作做完；“已经完成”准确呈现完成体意义，并以“如今”自然显明叙事回顾的时间对比。
theological_decisions:
- issue: 保罗和巴拿巴先前被交托的性质
  choice: 被交托给上帝的恩典
  alternative: 被托付给上帝的恩典／被众人托付、蒙上帝施恩
  rationale: 原文被动式没有明说执行交托的人，却明确指出他们被交付给“上帝的恩典”。正文保留这一重心，不补出教会、会众或特定差派礼仪，也不把上帝的恩典仅处理为一般帮助。
- issue: 工作的完成程度
  choice: 已经完成
  alternative: 已经履行
  rationale: 此处πληρόω可表达完成或履行。上下文是在总结本次行程，“完成”自然且准确，同时脚注保留“履行”的可行译法。
translation_notes:
  register: 采用庄重而流畅的现代标准汉语。“乘船回到”符合叙事语境；分号呈现返抵安提阿与回顾先前交托之间的关系。“从那里出发”明确ὅθεν的来源义，但不补出原文未明说的交托者。所有脚注标记均紧随相关词语。
