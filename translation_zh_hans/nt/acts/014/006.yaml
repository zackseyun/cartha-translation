    reason: lexical_alternative
lexical_decisions:
- source_word: συνιδόντες
  choice: 他们发觉了这事
  rationale: 该不定过去时分词表示他们意识到或察觉了上一节所说的危险；中文从上下文补出“这事”，既自然，也保留原文简略的指代。
- source_word: κατέφυγον
  choice: 就逃往
  rationale: καταφεύγω可指为避难而逃走；此处叙事重点是面对危险紧急离开，因此译作“逃往”简洁直接，并保留目的地方向。
- source_word: εἰς
  choice: 往
  rationale: 与移动动词连用时，εἰς标明目的地；“往”符合现代汉语表达。
- source_word: τὰς πόλεις τῆς Λυκαονίας
  choice: 吕高尼的各城
  rationale: 属格自然理解为该地区所属或境内的城；“吕高尼的各城”保留原文结构，并为后面的同位说明作铺垫。
- source_word: Λύστραν καὶ Δέρβην
  choice: 路司得、特庇
  rationale: 采用中文圣经传统中通行的地名音译；两座城作为“吕高尼的各城”的同位说明。
- source_word: τὴν περίχωρον
  choice: 周围地区
  rationale: περίχωρος在这里名词化，指所提各城附近的区域；“周围地区”自然且范围足够宽泛。
- source_word: καὶ ... καὶ
  choice: ——路司得、特庇以及
  rationale: 破折号清楚标示两座城是前述“各城”的具体说明，“以及”则连接随后补充的周围地区。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“发觉了这事”自然表达由不知到知的语义；地名沿用通行译名。主句以“就”体现分词所交代的先行情形与随后逃离之间的紧密联系。
