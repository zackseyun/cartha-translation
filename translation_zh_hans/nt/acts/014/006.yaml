  text: when they learned of it[a], they fled to the cities of Lycaonia—Lystra and Derbe—and the surrounding region,
translation:
  language: zh_hans
  text: 他们察觉到这事[a]后，就逃往吕高尼的路司得和特庇两城，以及周边地区。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
