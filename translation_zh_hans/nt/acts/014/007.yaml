  text: And there they were preaching the good news[a].
translation:
  language: zh_hans
  text: 他们也在那里传扬好消息[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“宣讲福音”。
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖ
  choice: 也在那里
  rationale: κἀκεῖ由καί与ἐκεῖ结合而成，可表示“也在那里”或“并且在那里”。结合上文叙事，“也在那里”既保留连接与增补意味，又符合现代汉语表达。
- source_word: εὐαγγελιζόμενοι
  choice: 传扬好消息
  rationale: εὐαγγελίζω表示宣告好消息，在《使徒行传》的语境中特指福音信息。“传扬好消息”保留动词的宣告意味，也避免仅以教会术语表达。
- source_word: ἦσαν
  choice: （由“传扬”的语境表达持续动作）
  rationale: ἦσαν与现在分词构成迂回式未完成时，表示过去持续进行的行动。汉语通常不必机械加入“正在”；简洁的“传扬”结合叙事语境自然表达其持续性。
theological_decisions: []
translation_notes:
  register: 采用现代、简明而庄重的叙事语言。“传扬”比“传讲”略突出公开宣告的含义；正文保留“好消息”的词汇本义，脚注给出读者熟悉的“福音”。
