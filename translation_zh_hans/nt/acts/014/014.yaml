  text: ἀκούσαντες δὲ οἱ ἀπόστολοι Βαρναβᾶς καὶ Παῦλος, διαρρήξαντες τὰ ἱμάτια ⸀αὐτῶν ⸀ἐξεπήδησαν εἰς τὸν ὄχλον κράζοντες
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/014.yaml
  text: But when the apostles Barnabas and Paul heard, they tore their garments and rushed out into the crowd, crying out,
translation:
  language: zh_hans
  text: 可是，使徒巴拿巴和保罗听见了，就撕裂衣服[a]，冲进人群里[b]，大声喊道：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 撕裂衣服在当时通常表示悲痛、惊骇，或强烈抗议把人当作神明般尊崇的行为。
    reason: cultural_note
  - marker: b
    text: 或译：“猛然跃进人群里”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: 听见了，就
  rationale: 不定过去时分词在此表示先于主句动作发生的时间背景；译为“听见了，就”自然地呈现行动次序。
- source_word: δὲ
  choice: 可是
  rationale: 承接上文群众要献祭的举动，并突出使徒截然相反的反应；“可是”符合现代汉语叙事。
- source_word: οἱ ἀπόστολοι Βαρναβᾶς καὶ Παῦλος
  choice: 使徒巴拿巴和保罗
  rationale: 保留希腊文同位结构，直接称巴拿巴和保罗为“使徒”，不对称谓范围作额外限定。
- source_word: διαρρήξαντες τὰ ἱμάτια αὐτῶν
  choice: 撕裂衣服
  rationale: 准确保留这一强烈而具有文化含义的动作；其表达的悲痛、惊骇或抗议由脚注说明。
- source_word: ἐξεπήδησαν
  choice: 冲进
  rationale: 该动词表示突然、有力的动作；结合εἰς所指方向，“冲进”既传达急迫感，也避免加入原文未明说的“出来”。
- source_word: εἰς τὸν ὄχλον
  choice: 人群里
  rationale: εἰς表示进入人群之中；与“冲进”组合为自然的现代汉语。
- source_word: κράζοντες
  choice: 大声喊道
  rationale: 现在时分词表示与冲入人群同时进行的高声呼喊；下一节接续其喊话内容，因此用“喊道：”。
theological_decisions:
- issue: “使徒”是否指巴拿巴和保罗
  choice: 保留“使徒巴拿巴和保罗”
  alternative: 改作“巴拿巴和保罗这两位使徒”，或将“使徒”解释为较宽泛的受差遣者
  rationale: 希腊文在本节直接以同位结构把巴拿巴和保罗称为使徒。译文保留这一称呼及其张力，不引入后来的使徒职分范围之争。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“可是”体现叙事转折；“冲进人群里”保留动作的突然和急迫，同时忠于希腊文所明示的进入方向。所有脚注标记均置于正文相关表达之后。
