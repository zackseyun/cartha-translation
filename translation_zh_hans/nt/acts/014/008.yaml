base_translation:
  language: en
  yaml_path: translation/nt/acts/014/008.yaml
  text: And in Lystra a certain man was sitting[a], powerless in his feet, lame from his mother's womb, who had never walked.
translation:
  language: zh_hans
  text: 在路司得，有一个人坐着；他的双脚无力[a]，从母腹起就是瘸腿的，从来没有行走过。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他的双脚没有力气。”希腊文先强调双脚缺乏力量，随后才明确说他是瘸腿的。
    reason: lexical_alternative
lexical_decisions:
- source_word: Καί
  choice: 在路司得，有……
  rationale: 希腊文以简单连接词承接上文；中文叙事在此不必机械译出“又”，以场景短语自然衔接。
- source_word: τις ἀνὴρ
  choice: 有一个人
  rationale: 既保留人物未具名的不定性，也自然引入一个具体人物。
- source_word: ἀδύνατος ... τοῖς ποσίν
  choice: 他的双脚无力
  rationale: 先保留ἀδύνατος所表达的缺乏力量，再由后面的χωλός明确说明他瘸腿，维持原文层层描述的次序。
- source_word: ἐν Λύστροις
  choice: 在路司得
  rationale: 采用现代中文圣经地名的通行音译。
- source_word: ἐκάθητο
  choice: 坐着
  rationale: 未完成时描绘当时持续的状态；“坐着”简洁自然，不添加原文没有的“那里”。
- source_word: χωλὸς ἐκ κοιλίας μητρὸς αὐτοῦ
  choice: 从母腹里就是瘸腿的
  rationale: 保留“从母腹”这一形象表达，同时用“就是”自然表明这是先天状况。
- source_word: οὐδέποτε περιεπάτησεν
  choice: 从来没有走过路
  rationale: 准确表达截至当时一生从未行走的事实；“走过路”在现代汉语中比单说“走过”更完整自然。
