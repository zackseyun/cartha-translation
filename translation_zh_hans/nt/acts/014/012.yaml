  text: ἐκάλουν τε ⸀τὸν Βαρναβᾶν Δία, τὸν δὲ Παῦλον Ἑρμῆν, ἐπειδὴ αὐτὸς ἦν ὁ ἡγούμενος τοῦ λόγου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/012.yaml
  text: And they were calling Barnabas Zeus[a], and Paul Hermes[b], because he was the chief speaker.
translation:
  language: zh_hans
  text: 众人称巴拿巴为宙斯[a]，称保罗为赫尔墨斯[b]，因为保罗是主要发言的人[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 宙斯是希腊神名；有些传统译本采用其罗马对应神名“朱庇特”。
    reason: alternative_reading
  - marker: b
    text: 赫尔墨斯是希腊神名；有些传统译本采用其罗马对应神名“墨丘利”。
    reason: alternative_reading
  - marker: c
    text: 原文也可译作“因为保罗带头讲话”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάλουν
  choice: 称……为
  rationale: 未完成时描写当时持续进行的称呼行为；汉语用叙事语境中的“称……为”自然表达，不生硬添加进行体标记。
- source_word: Δία
  choice: 宙斯
  rationale: 直接采用希腊神名，不以罗马对应神名“朱庇特”替代。
- source_word: Ἑρμῆν
  choice: 赫尔墨斯
  rationale: 直接采用希腊神名，不以罗马对应神名“墨丘利”替代。
- source_word: ἐπειδὴ
  choice: 因为
  rationale: 明确引出众人把保罗认作赫尔墨斯的原因。
- source_word: αὐτὸς
  choice: 保罗
  rationale: 希腊语代词带有区别、强调作用；汉语复现人名可清楚表明讲话者是保罗而非巴拿巴。
- source_word: ὁ ἡγούμενος τοῦ λόγου
  choice: 主要是……在讲话
  rationale: 该短语直指在言语活动中居主导地位的人；此译法自然表达保罗担当主要发言者，同时避免把 λόγος 神学化为“道”。
theological_decisions:
- issue: 异教神祇名称的译法
  choice: 正文采用“宙斯”和“赫尔墨斯”
  alternative: “朱庇特”和“墨丘利”
  rationale: 原文使用希腊神名；采用其通行中文译名可忠实保留原文所指，不受拉丁传统译名影响。
- issue: λόγος 在本节中的含义
  choice: 译作“讲话”，指发言行为
  alternative: 译作“道”或“信息”
  rationale: 上下文是在说明众人为何把保罗视为赫尔墨斯，重点是他担当主要发言者；不应在此无根据地赋予 λόγος 专门的神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“主要是保罗在讲话”比名词化的“首席发言人”更符合自然汉语，也保留原文所表达的主导发言角色。
