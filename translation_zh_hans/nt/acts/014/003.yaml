revisions:
- from: 于是，他们在那里住了相当长的一段时间，倚靠主放胆讲论[a]；主为他恩典的道作见证，使神迹奇事借着他们的手施行出来。
  to: 因此，他们仍在那里停留了相当长一段时间，倚靠主放胆讲论[a]；主为他恩典的道作见证，使神迹奇事借着他们的手发生。
  rationale: 修订仅改善承接关系和现代汉语表达：以“因此，他们仍在那里停留”反映οὖν及语境中的持续行动；以“停留”准确表达διέτριψαν；以“使……发生”清楚表达διδόντι γίνεσθαι与“借着他们的手”的媒介关系。其余关键术语和脚注所保留的歧义均维持不变。
