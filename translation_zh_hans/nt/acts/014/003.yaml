id: ACT.14.3
reference: Acts 14:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἱκανὸν μὲν οὖν χρόνον διέτριψαν παρρησιαζόμενοι ἐπὶ τῷ κυρίῳ τῷ μαρτυροῦντι ⸀τῷ λόγῳ τῆς χάριτος αὐτοῦ, διδόντι σημεῖα καὶ τέρατα γίνεσθαι διὰ τῶν χειρῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/003.yaml
  text: So they stayed there a considerable time[a], speaking boldly for the Lord, who was bearing witness to the word of his grace, granting signs and wonders to be done through their hands.
translation:
  language: zh_hans
  text: 因此，他们仍在那里停留了相当长一段时间，倚靠主放胆讲论[a]；主为他恩典的道作见证，使神迹奇事借着他们的手发生。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “倚靠主放胆讲论”也可译作“为主放胆讲论”或“在主里放胆讲论”。原文可能强调他们放胆的依据、所属范围，或与主的关系。
    reason: 保留ἐπὶ τῷ κυρίῳ在依据、范围和关联方面的多义性。
lexical_decisions:
- source_word: ἱκανὸν ... χρόνον
  choice: 相当长的一段时间
  rationale: 这一习语表示一段颇为可观的时间；此译自然清楚，又不把时长说得过于确定。
- source_word: διέτριψαν
  choice: 在那里住了
  rationale: 此处指在一个地方停留、度过一段时间；结合上下文补出“在那里”，符合汉语叙事表达。
- source_word: παρρησιαζόμενοι
  choice: 放胆讲论
  rationale: 该词强调公开、无惧地发言；“放胆讲论”保留其勇敢言说的意味，也符合《使徒行传》的宣讲语境。
- source_word: ἐπὶ τῷ κυρίῳ
  choice: 倚靠主
  rationale: ἐπί加与格在这里可表示依据、倚靠或关联。“倚靠主”清楚表达他们放胆言说的根基，同时以脚注保留其他可能理解。
- source_word: τῷ κυρίῳ
  choice: 主
  rationale: 原文只有κύριος，故不补入“耶稣”或“神”，以免超出原文的明确程度。
- source_word: τῷ μαρτυροῦντι
  choice: 作见证
  rationale: 现在分词描写主在他们传讲期间持续给予证实；“作见证”保留该词的见证和证实意味。
- source_word: τῷ λόγῳ τῆς χάριτος αὐτοῦ
  choice: 为他恩典的道
  rationale: 保留“恩典的道”这一属格结构，不把它限定为仅指“关于恩典的信息”或仅指“满有恩典的话”。
- source_word: χάριτος
  choice: 恩典
  rationale: 在路加—使徒行传的语境中，该词承载上帝所赐恩惠的神学分量，“恩典”是准确而通行的译法。
- source_word: διδόντι
  choice: 使
  rationale: 这里表示主赐予、促成神迹奇事发生；汉语以“使……施行出来”自然表达其授权和成就。
- source_word: σημεῖα καὶ τέρατα
  choice: 神迹奇事
  rationale: 这是固定的圣经词组，兼顾事件作为凭据和令人惊异的两方面。
- source_word: γίνεσθαι
  choice: 施行出来
  rationale: 结合“借着他们的手”，此译比单说“发生”更自然，并表明这些作为得以实现。
- source_word: διὰ τῶν χειρῶν αὐτῶν
  choice: 借着他们的手
  rationale: 保留原文具体的身体意象，并清楚表达他们是神迹奇事得以施行的媒介。
theological_decisions:
- issue: “主”的具体所指
  choice: 仅译作“主”，不进一步明确身份
  alternative: 译作“主耶稣”，或按更宽泛的意义理解为神
  rationale: 叙事语境很可能指复活的耶稣，但原文只写“主”；正文保留原文的称谓和明确程度。
- issue: ἐπὶ τῷ κυρίῳ所表达的关系
  choice: 译作“倚靠主”
  alternative: 译作“为主”或“在主里”
  rationale: 该介词结构可能表示依据、范围或关联。“倚靠主”突出放胆的根基；脚注保留服务对象或属灵范围的可能理解，避免消除原文张力。
- issue: “他恩典的道”的属格关系
  choice: 保留“他恩典的道”
  alternative: 译作“关于他恩典的信息”或“他满有恩典的道”
  rationale: 原文可指以恩典为内容、由恩典所赋予特征，或属于主的恩典之道；保留属格表达可避免只确定其中一种。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“相当长的一段时间”自然表达时长；“恩典的道”“神迹奇事”“借着他们的手”保留重要的圣经用语和原文意象。分号呈现两个紧密相连的动作：使徒倚靠主放胆讲论，主则以神迹奇事为所传的道作见证。
