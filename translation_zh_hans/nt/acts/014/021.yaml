  text: Εὐαγγελισάμενοί τε τὴν πόλιν ἐκείνην καὶ μαθητεύσαντες ἱκανοὺς ὑπέστρεψαν εἰς τὴν Λύστραν καὶ ⸀εἰς Ἰκόνιον καὶ ⸁εἰς Ἀντιόχειαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/021.yaml
  text: And after proclaiming the good news in that city and making many disciples[a], they returned to Lystra and to Iconium and to Antioch,
translation:
  language: zh_hans
  text: 他们在那城传了福音[a]，使许多人成为门徒，然后返回路司得、以哥念和安提阿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在那城宣讲了福音”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐαγγελισάμενοί
  choice: 传了福音
  rationale: 不定过去时分词表示先于主要动词发生的行动；“传了福音”自然、简洁，并准确表达向人宣告好消息的含义。
- source_word: τε
  choice: 以句内衔接表达，未单独译出
  rationale: τε在此轻微承接上文并连接后续行动；汉语无需机械译作“并且”，借语序即可体现连贯。
- source_word: τὴν πόλιν ἐκείνην
  choice: 那城
  rationale: 直译指示短语，按上下文回指特庇；“那城”简洁且符合圣经叙事语体。
- source_word: μαθητεύσαντες
  choice: 使……成为门徒
  rationale: 该动词具有使人成为门徒的主动、使役含义；此译法比“训练门徒”更准确，也避免将其窄化为后续教导。
- source_word: ἱκανοὺς
  choice: 许多人
  rationale: 在人数语境中表示相当多的人；“许多人”自然体现数量可观。
- source_word: ὑπέστρεψαν
  choice: 返回
  rationale: 准确表达回程行动，并以“然后”明确两个分词所述行动先于主要动词。
- source_word: εἰς τὴν Λύστραν καὶ εἰς Ἰκόνιον καὶ εἰς Ἀντιόχειαν
  choice: 路司得、以哥念和安提阿
  rationale: 三个εἰς均表示目的地。现代汉语可由一个“返回”统摄并列地名，无须重复“到”，同时保留原文行程次序。
theological_decisions:
- issue: μαθητεύσαντες的行动含义
  choice: 使许多人成为门徒
  alternative: 教导了许多门徒
  rationale: 原文是使役性的μαθητεύω，重点在使人成为门徒，而不只是对已经成为门徒的人进行教导；此处按词义保留其主动结果，不额外规定成为门徒的具体仪式或过程。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。保留传统通行地名“路司得、以哥念、安提阿”。用“传福音”这一广为理解的基督教用语表达εὐαγγελίζω；以“然后”自然呈现两个不定过去时分词与主要动词之间的先后关系。
