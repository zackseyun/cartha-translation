  text: κυκλωσάντων δὲ ⸂τῶν μαθητῶν αὐτὸν⸃ ἀναστὰς εἰσῆλθεν εἰς τὴν πόλιν. καὶ τῇ ἐπαύριον ἐξῆλθεν σὺν τῷ Βαρναβᾷ εἰς Δέρβην.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/020.yaml
  text: But after the disciples had gathered around him[a], he got up and went into the city[b]. And on the next day he went out with Barnabas to Derbe.
translation:
  language: zh_hans
  text: 但门徒围着他以后[a]，他就起来[b]，进了城。第二天，他和巴拿巴一同离开那里，前往特庇。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“门徒把他围住以后”或“门徒环绕着他以后”。
    reason: lexical_alternative
  - marker: b
    text: “起来”也可译作“起身”或“站起来”。这里很可能指保罗从地上起来；经文并未明确说他复活。
    reason: alternative_reading
lexical_decisions:
- source_word: κυκλωσάντων
  choice: 围在……身边
  rationale: 该词本义是环绕、围住。这里主语是门徒，用“围在他身边”既保留空间上的环绕之意，也避免“包围”在现代汉语中可能带出的敌意。
- source_word: δὲ
  choice: 但
  rationale: δέ承接上一节保罗被石头打、拖到城外并被认为已死的情节，表示轻微转折；“但”自然地突出随后发生的意外转变。
- source_word: τῶν μαθητῶν
  choice: 门徒
  rationale: μαθητής在《使徒行传》中通常指跟从并学习的人；“门徒”是准确且通行的圣经用语。
- source_word: ἀναστὰς
  choice: 起来
  rationale: ἀνίστημι的过去时分词在此首先描写保罗身体上的动作。“起来”自然简洁，不把经文本身没有明说的复活或被神使其复生之意加入译文。
- source_word: εἰσῆλθεν εἰς τὴν πόλιν
  choice: 进了城
  rationale: 准确表达进入城内的动作，符合现代汉语叙事习惯，也保留了移动方向。
- source_word: τῇ ἐπαύριον
  choice: 第二天
  rationale: 该时间短语意为接下来的一天；“第二天”是自然、明确的现代汉语表达。
- source_word: ἐξῆλθεν … εἰς Δέρβην
  choice: 往特庇去了
  rationale: ἐξέρχομαι本含“出去、离开”之意，但在汉语中结合目的地译作“往特庇去了”更为自然；离开当前城市的动作可由上下文和目的地清楚体现。
- source_word: σὺν τῷ Βαρναβᾷ
  choice: 和巴拿巴一同
  rationale: σύν加与格表示陪同；“和……一同”清楚传达两人同行。
- source_word: Δέρβην
  choice: 特庇
  rationale: 采用该地名在现代简体中文圣经传统中的通行音译。
theological_decisions:
- issue: ἀναστὰς是否应译得暗示复活或神迹性的复生
  choice: 按普通身体动作译为“他就起来”
  alternative: “他复活了”或“他被扶起来了／被使其起来了”
  rationale: 希腊文ἀναστὰς本身常指起身；虽然保罗在上一节遭石击并被以为已死，使这一恢复显得非同寻常，但本节没有明确说他复活、被神使其复生，也没有说明别人扶他起来。因此译文保持叙事上的克制和原文留下的张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“围在他身边”避免敌意色彩；“起来，进了城”保持动作顺序；人名、地名使用简体中文圣经中的通行译名。
