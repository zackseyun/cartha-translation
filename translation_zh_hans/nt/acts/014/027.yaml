  source_fidelity: 原文的事件顺序、上帝为行动主体、μετ᾽ αὐτῶν的“与他们一同”、以及向外邦人打开“信心之门”的比喻，均应保留。草稿基本准确，但“外族人”未充分体现本段犹太人与非犹太人之间的叙事语境；“外邦人”是更准确且在现代中文圣经语体中稳定的对应词。
  naturalness: “述说……又述说……”在现代汉语中重复而显得滞涩。改为“报告……并且报告……”或将后项并入同一“报告”的宾语更自然。将脚注b紧随“外邦人”放置，能使脚注锚点明确对应其所说明的词。
  terminology: 建议将πίστις译为“信心”，而非较宽泛、较制度化的“信仰”；“信心之门”既保留θύρα πίστεως的简练属格比喻，也不预断其究竟强调信靠、进入信仰或福音机会。“外邦人”准确表达此处ἔθνεσιν指非犹太人，而不带“外族人”可能有的社会排斥或族群泛指意味。
