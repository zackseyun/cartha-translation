  to: 他们到了以后，召集了教会，就报告上帝与他们一同所做的一切，以及他怎样为外邦人[b]打开了信心之门。
  rationale: 修订以“报告”自然统领原文ἀνήγγελλον后的两个并列内容，保留上帝“与他们一同所做”的措辞，不将μετά解释为单纯工具性的“借着”。以“外邦人”准确传达本段非犹太人的语境，并以“信心之门”保留θύραν πίστεως的比喻与属格关系。脚注a仍说明μετ᾽ αὐτῶν的替代译法；脚注b移至“外邦人”后，使锚点与注释内容一致。
