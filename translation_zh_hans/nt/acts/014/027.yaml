    rationale: 中文可用一个“报告”统领两个内容从句；脚注应紧邻所注词语，以免锚点指向不清。
  - severity: low
    issue: “信仰”较“信心”宽泛。
    rationale: 此处πίστις宜以“信心”保留其通常的信靠含义及与原文比喻的开放关系。
