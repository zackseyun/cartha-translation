base_translation:
  language: en
  yaml_path: translation/nt/acts/014/027.yaml
  text: And when they arrived and gathered the church together[a], they reported all that God had done with them[b], and that he had opened a door of faith to the Gentiles.
translation:
  language: zh_hans
  text: 他们到了以后，召集了教会，就报告上帝与他们一同所做的一切，以及他怎样为外邦人[b]打开了信心之门。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “外邦人”也可译为“列国”。
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενόμενοι
  choice: 他们到了以后
  rationale: 以自然的现代汉语表达先于主句发生的简单过去分词，保留时间先后关系，同时不补出原文未明说的地点。
- source_word: συναγαγόντες τὴν ἐκκλησίαν
  choice: 召集教会
  rationale: 指把当地基督徒群体召集起来；“教会”是《使徒行传》中ἐκκλησία的常用对应词。
- source_word: ἀνήγγελλον
  choice: 述说
  rationale: 符合向教会回顾所经历之事的语境，也能体现未完成过去时所呈现的叙述过程。
- source_word: ὅσα
  choice: 一切
  rationale: 简洁、自然地表达“所有……的事”。
- source_word: ἐποίησεν ὁ θεὸς μετ’ αὐτῶν
  choice: 上帝与他们一同成就的一切
  rationale: 保留μετά“与……一起”的直接含义，明确上帝是行动者，又不把使徒的作用过度解释为工具性中介。
- source_word: ἤνοιξεν
  choice: 打开了
  rationale: 保留开门的比喻，并以完成体表达已经发生的神圣行动。
- source_word: τοῖς ἔθνεσιν
  choice: 为外族人
  rationale: 本段叙事重点是非犹太人获准进入信仰群体；“外族人”比现代政治意义上的“列国”更能传达此处含义，也比传统术语更便于普通读者理解。
- source_word: θύραν πίστεως
  choice: 信仰之门
  rationale: 保留原文的门之比喻和属格结构，不将其单一解释为“相信的机会”或“进入信仰的门径”。
- source_word: πίστεως
  choice: 信仰
  rationale: 此处表示对上帝和福音的信靠；“信仰”与“门”搭配自然，并保留πίστις在该短语中的语义开放性。
theological_decisions:
- issue: μετ’ αὐτῶν所表达的上帝行动与使徒参与之间的关系
  choice: 上帝与他们一同成就
  alternative: 上帝借着他们成就
  rationale: 原文直译为“与他们”；正文保留这种共同参与的表达，既以上帝为主语，也不把保罗和巴拿巴的作用明确限定为工具性。
- issue: ἔθνεσιν的所指
  choice: 外族人
  alternative: 列国
  rationale: 在《使徒行传》的犹太人与非犹太人语境中，该词主要指非犹太人；脚注保留“列国”这一更贴近词形的译法。
- issue: θύραν πίστεως中属格πίστεως的关系
  choice: 信仰之门
  alternative: 通往信仰的门／使人可以相信的门
  rationale: 保留原文简练而开放的比喻，不在正文中限定它究竟强调进入信仰、产生信心，还是传福音的机会。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语体。“召集教会”保留初期基督徒群体的称谓；“外族人”避免读者把ἔθνη误解为现代民族国家；“信仰之门”保留原文比喻及其神学张力。
