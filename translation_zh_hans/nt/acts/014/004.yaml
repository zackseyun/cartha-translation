  rationale: 修订将“全城的人”改为“城里的民众”，避免把原文的集合性名词绝对化；将“分裂成了两派”调整为“分成了两边”，更直接对应社会分化及随后两组人的对照。保留“犹太人”“使徒”和“站在……一边”，以忠实而自然地表达原文的阵营归属。脚注保留ἐσχίσθη的较直译替代说法。
