  text: ἐσχίσθη δὲ τὸ πλῆθος τῆς πόλεως, καὶ οἱ μὲν ἦσαν σὺν τοῖς Ἰουδαίοις οἱ δὲ σὺν τοῖς ἀποστόλοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/004.yaml
  text: But the people of the city were divided[a], and some were with the Jews and some with the apostles.
translation:
  language: zh_hans
  text: 可是，城里的民众分成了两边：有的站在犹太人一边，有的站在使徒一边。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“城里的民众分裂了”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσχίσθη
  choice: 分裂成了两派
  rationale: 该被动形式表示“被分开、发生分裂”。结合后文彼此对立的两方，译为“分裂成了两派”自然清楚，也保留社会群体分化的含义。
- source_word: τὸ πλῆθος τῆς πόλεως
  choice: 全城的人
  rationale: πλῆθος 在这里泛指城中的民众，而非某一时刻聚集的一群人；“全城的人”符合现代汉语表达。
- source_word: δὲ
  choice: 可是
  rationale: δὲ 在此承接上文并表示转折，指出先前传道产生影响后，城中民众却形成对立阵营。
- source_word: οἱ μὲν ... οἱ δὲ
  choice: 有的……有的……
  rationale: 这一关联结构把民众分为相互对照的两部分；“有的……有的……”简洁自然。
- source_word: σὺν
  choice: 站在……一边
  rationale: σύν 本义为“与……在一起”，本语境涉及阵营归属；“站在……一边”明确传达支持和结盟之意。
- source_word: Ἰουδαίοις
  choice: 犹太人
  rationale: 本节没有把所指范围限定为领袖，因此不增译为“犹太领袖”；“犹太人”直接对应原文。
- source_word: ἀποστόλοις
  choice: 使徒
  rationale: 这是《使徒行传》中已经确立的称谓，本章14节也以此称呼巴拿巴和保罗；保留“使徒”最能对应叙事用语。
theological_decisions:
- issue: “使徒”的指称与范围
  choice: 保留“使徒”，作为叙事中对保罗和巴拿巴的称呼。
  alternative: 译作较宽泛的“受差遣者”或“使者”。
  rationale: 本章14节明确称巴拿巴和保罗为“使徒”。直接翻译该词可保留路加的表述，同时不额外界定这一称号的教义范围。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“分裂成了两派”与后面的两组人相呼应；“站在……一边”比单译“与……在一起”更自然地表达阵营归属。脚注保留较贴近原文句法的译法。
