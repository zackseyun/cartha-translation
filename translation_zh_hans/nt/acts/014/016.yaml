  text: ὃς ἐν ταῖς παρῳχημέναις γενεαῖς εἴασεν πάντα τὰ ἔθνη πορεύεσθαι ταῖς ὁδοῖς αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/016.yaml
  text: In past generations he allowed all the nations to walk in their own ways[a].
translation:
  language: zh_hans
  text: 在过去的世代，他容许万国走自己的道路。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“容许所有外邦人走自己的道路。”
    reason: “外邦人”反映ἔθνη在犹太人与非犹太人对比语境下的可能理解；“容许”也可译为“准许”或“任凭”，但正文保留较中性的许可含义。
lexical_decisions:
- source_word: ὃς
  choice: 他
  rationale: 关系代词所指的是上一节的永生神。汉语在此用“他”承接前文，比直译为“那一位”更自然清楚。
- source_word: ἐν ταῖς παρῳχημέναις γενεαῖς
  choice: 在过去的世代
  rationale: 准确表达已经过去的历代，语言庄重而不古奥。
- source_word: εἴασεν
  choice: 容许
  rationale: 表达准许、任凭之意，不暗示神赞同万国所行的道路，也不强化为神主动使他们如此行。
- source_word: πάντα τὰ ἔθνη
  choice: 万国
  rationale: 保留ἔθνη的群体和民族范围；“万国”简洁自然，也避免把本句过早限定为专门的犹太人与外族人对比。
- source_word: πορεύεσθαι ταῖς ὁδοῖς αὐτῶν
  choice: 各行其道
  rationale: 保留“行走—道路”的隐喻，并以现代汉语常用表达传达各民族按自己的道路而行；“各”也自然体现αὐτῶν的分配性和所属关系。
theological_decisions:
- issue: 神的容许与道德认可
  choice: 译为“容许万国各行其道”
  alternative: 译成神赞同万国的道路，或神决定并促使万国如此行
  rationale: εἴασεν表示允许或任凭，并不等于认可，也没有明确表达因果决定。译文保留神的主权、宽容与人的责任之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“各行其道”自然保留原文的道路隐喻；脚注呈现“外族人”和较直译措辞的可能性。
