  rationale: 修订以“有犹太人……来到”贴近原文而不添加数量或急迫性的限定；以“说服众人”忠实呈现πείσαντες，避免将敌对语境推演为原文未明确说明的“煽动”。“然后”清楚表达说服、石击、拖至城外的叙事次序。脚注保留攻击者的判断与保罗实际是否死亡之间的文本区分。
