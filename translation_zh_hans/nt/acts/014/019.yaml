  text: Ἐπῆλθαν δὲ ἀπὸ Ἀντιοχείας καὶ Ἰκονίου Ἰουδαῖοι, καὶ πείσαντες τοὺς ὄχλους καὶ λιθάσαντες τὸν Παῦλον ἔσυρον ἔξω τῆς πόλεως, ⸀νομίζοντες αὐτὸν τεθνηκέναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/019.yaml
  text: But Jews came from Antioch and Iconium[a], and after persuading the crowds and stoning Paul, they dragged him outside the city, supposing that he was dead.
translation:
  language: zh_hans
  text: 但有犹太人从安提阿和以哥念来到；他们说服众人，用石头打保罗，然后把他拖到城外，以为他已经死了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以为他已经死去。”希腊文只说明那些人的判断，并没有明确说保罗实际上死了。
    reason: 说明完成时不定式的译法，并保留经文对保罗是否实际死亡的开放性。
lexical_decisions:
- source_word: Ἐπῆλθαν δὲ
  choice: 可是……赶来
  rationale: δέ在上下文中标志情势逆转，译作“可是”自然体现轻度转折；ἐπῆλθαν在此指敌对者从别城来到，“赶来”既表达移动，也贴合紧迫而敌对的叙事语境。
- source_word: Ἰουδαῖοι
  choice: 有些犹太人
  rationale: 原文无不定代词，但这里所指是从两城来的特定犹太人，并非全体犹太人；加入“有些”符合现代汉语表达，也避免不必要的群体泛化。
- source_word: πείσαντες τοὺς ὄχλους
  choice: 煽动了众人
  rationale: πείθω基本义为说服、劝服；在此敌对和暴力语境中，“煽动”自然传达他们说服群众转而攻击保罗的作用，但不增添具体手段。ὄχλους为复数，汉语用集合性的“众人”更自然。
- source_word: λιθάσαντες τὸν Παῦλον
  choice: 他们用石头打保罗
  rationale: λιθάζω指以石头击打，通常具有处死意图。“用石头打”是清楚、自然的现代汉语，也避免仅用“石刑”而过度强调正式司法程序。
- source_word: ἔσυρον ἔξω τῆς πόλεως
  choice: 又把他拖到城外
  rationale: ἔσυρον是不完成时，描写拖拽过程；汉语用“拖”充分表现暴力动作。“到城外”清楚表达动作所达到的位置。
- source_word: νομίζοντες αὐτὸν τεθνηκέναι
  choice: 以为他已经死了
  rationale: νομίζοντες只陈述攻击者的判断；τεθνηκέναι为完成时不定式，突出死亡后的状态。“已经死了”兼顾完成性和自然汉语表达，不断言保罗事实上死亡。
theological_decisions:
- issue: 本节是否断言保罗实际死亡
  choice: 正文仅说攻击者“以为他已经死了”
  alternative: 有人据此推断保罗确实死去，后来又复活或苏醒
  rationale: 希腊文以νομίζοντες明确将死亡作为攻击者的判断，而非叙述者确认的事实。译文保留这一认识层面的限定，不替经文解决其未明确说明的问题。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“可是”承接上文的有利局面并形成转折；分为两句以避免连续分词结构在汉语中显得拥挤。脚注标记置于相关判断之后。
