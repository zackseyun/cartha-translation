  text: ὡς δὲ ἐγένετο ὁρμὴ τῶν ἐθνῶν τε καὶ Ἰουδαίων σὺν τοῖς ἄρχουσιν αὐτῶν ὑβρίσαι καὶ λιθοβολῆσαι αὐτούς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/005.yaml
  text: And when an attempt was made by both the Gentiles and the Jews[a], together with their rulers, to mistreat them and to stone them[b],
translation:
  language: zh_hans
  text: 当外邦人和犹太人[a]连同他们的首领企图[b]凌辱他们，并用石头打他们时，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “犹太人”在某些语境中也可译作“犹太地区的人”。这里更可能是指作为一个群体的犹太反对者，并非特指来自犹太地区的人。
    reason: lexical_alternative
  - marker: b
    text: “企图”也可译作“猛然冲上去”或“发动袭击”。希腊语ὁρμή可指猛烈的冲动、行动或攻势；这里译作“企图”，是因为后面的“凌辱”和“用石头打”表达的是他们意图实施的行动，而非本节已经完成的行动。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: 后来，当……时
  rationale: 以“后来”承接叙事，以“当……时”保留ὡς引出的时间从句；不把δέ强化为明显转折。
- source_word: ἐγένετο ὁρμὴ
  choice: 企图
  rationale: 此处ὁρμή可指冲动、猛然行动或袭击；与两个不定式所表达的预定行动结合，“企图”自然传达敌对行动已经酝酿或发动，却不暗示凌辱和用石头打已经完成。脚注保留更具暴力动态感的理解。
- source_word: τῶν ἐθνῶν τε καὶ Ἰουδαίων
  choice: 外族人和犹太人
  rationale: 上下文将ἔθνη与Ἰουδαῖοι并列，所指是非犹太人与犹太人，而非政治意义上的“列国”；τε καί所强调的双方共同参与由“和”自然表达。
- source_word: σὺν τοῖς ἄρχουσιν αὐτῶν
  choice: 连同他们的官长
  rationale: “连同”准确表达共同参与；“官长”保留ἄρχοντες所含的公共或群体权威意味，也不限定为某一种具体官职。
- source_word: ὑβρίσαι
  choice: 凌辱
  rationale: ὑβρίζω包含傲慢、侮辱性的虐待，可能不止是言语羞辱；“凌辱”兼有侮辱与伤害意味。
- source_word: καὶ λιθοβολῆσαι
  choice: 并用石头打
  rationale: 直译投石攻击的动作，不擅自加入“打死”，因原文未明确说明结果。
- source_word: αὐτούς
  choice: 他们
  rationale: 保留代词形式，其先行对象由上下文确定为保罗和巴拿巴。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“后来，当……时”保留本节作为时间从句、在下一节才完成句意的结构；末尾逗号体现其未完待续。用“外族人”清楚表达非犹太人，用“官长”保留原文较正式的权威称谓。
