  text: ⸀καίτοι οὐκ ἀμάρτυρον ⸀αὑτὸν ἀφῆκεν ⸀ἀγαθουργῶν, οὐρανόθεν ὑμῖν ὑετοὺς διδοὺς καὶ καιροὺς καρποφόρους, ἐμπιπλῶν τροφῆς καὶ εὐφροσύνης τὰς καρδίας ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/017.yaml
  text: Yet he did not leave himself without witness[a], doing good by giving you rains from heaven and fruitful seasons[c][b], filling your hearts with food and gladness.
translation:
  language: zh_hans
  text: 然而，他没有让自己毫无见证[a]；他行善，从天上赐给你们雨水和结果实的时节[b]，以食物和喜乐充满你们[c]的心。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “毫无见证”也可译作“没有证词”。原文强调神并没有让自己处于没有见证的状态。
    reason: lexical_alternative
  - marker: b
    text: “结果实的时节”也可译作“丰产的季节”。
    reason: lexical_alternative
  - marker: c
    text: 有些抄本作“我们的心”；本译文依《希腊文新约：SBL版》译作“你们的心”。
    reason: textual_variant
lexical_decisions:
- source_word: καίτοι
  choice: 然而
  rationale: 表达承接上文的让步转折：尽管神容许万国各行其道，他仍为自己留下见证。
- source_word: οὐκ ἀμάρτυρον αὑτὸν ἀφῆκεν
  choice: 他并没有不为自己留下见证
  rationale: 保留原文的否定结构、反身意义和见证性语义，表明神没有让自己处于无人见证的状态。
- source_word: ἀγαθουργῶν
  choice: 他施行善事
  rationale: 分词说明神如何为自己作见证；“施行善事”庄重自然，也突出主动的恩惠行动。
- source_word: οὐρανόθεν ὑμῖν ὑετοὺς διδοὺς
  choice: 从天上赐给你们雨水
  rationale: “从天上”兼顾可见天空与神圣来源；汉语以集合名词“雨水”自然表达希腊语复数所指的反复降雨。
- source_word: καιροὺς καρποφόρους
  choice: 结果实的时节
  rationale: 既保留“时节”的适时性，也明确表达农业上的产出，避免“丰收季节”过度预设结果规模。
- source_word: ἐμπιπλῶν τροφῆς καὶ εὐφροσύνης τὰς καρδίας ὑμῶν
  choice: 使你们的心因食物和喜乐而满足
  rationale: 用“满足”表达充满、饱足之意；“因食物和喜乐”在现代汉语中较自然，同时保留食物与喜乐共同构成神恩惠的表述。
theological_decisions:
- issue: 本节中普遍启示的性质
  choice: 神借着创造秩序中的供应与恩惠为自己作见证
  alternative: 只描述不具神学含义的自然过程
  rationale: 原文明确说神没有不为自己留下见证，并把降雨、结果实的时节、食物和喜乐描述为他的行动；译文维持这一指向，但不扩展成超出本节的系统教义。
- issue: 食物、喜乐与“心”的关系
  choice: 保留二者都与人的心被满足相关的原文结构
  alternative: 将食物仅联系身体、将喜乐仅联系内心
  rationale: 原文以一个“充满”统摄“食物和喜乐”，宾语是“你们的心”；不应在译文中人为拆分。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“没有不……留下见证”略带原文式的双重否定，但在汉语中仍清楚，并保存原文强调。分号将核心陈述与其后说明神如何作见证的分词结构连接起来。
