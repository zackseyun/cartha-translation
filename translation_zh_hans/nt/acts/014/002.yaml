  text: οἱ δὲ ⸀ἀπειθήσαντες Ἰουδαῖοι ἐπήγειραν καὶ ἐκάκωσαν τὰς ψυχὰς τῶν ἐθνῶν κατὰ τῶν ἀδελφῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/002.yaml
  text: But the Jews who were disobedient stirred up the Gentiles and poisoned their minds against the brothers[a][b][c].
translation:
  language: zh_hans
  text: 但那些拒绝相信[a]的犹太人煽动外邦人，使他们对弟兄们[c]心怀恶意[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“不顺从”。希腊文可指不肯相信所传的信息；在这里很可能是指拒绝福音。
    reason: lexical_alternative
  - marker: b
    text: 希腊文作“使外邦人的心灵变坏”；这里指败坏他们内在的态度，使他们对弟兄们怀有恶意。
    reason: lexical_alternative
  - marker: c
    text: 这里的“弟兄们”很可能泛指信徒群体，包括女性。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπειθήσαντες
  choice: 拒绝相信
  rationale: 该词兼有不信与不顺从的意味；在使徒宣讲的语境中，重点是拒绝相信所传的信息，同时保留其意志性的拒绝意味。
- source_word: Ἰουδαῖοι
  choice: 犹太人
  rationale: 直译该词；上下文限定为当地反对使徒信息的那部分犹太人，并非泛指所有犹太人。
- source_word: ἐπήγειραν
  choice: 煽动
  rationale: 自然表达其挑动他人产生敌意的使动含义。
- source_word: ἐκάκωσαν
  choice: 使……心怀恶意
  rationale: 该动词以“心/生命内在”为宾语，并与“敌对”连用，表示使人的内在态度变坏、产生恶意；此译法比字面“加害”更符合句法语境。
- source_word: τὰς ψυχὰς
  choice: 他们心怀
  rationale: ψυχή在此指内在心态或倾向，并非技术意义上的“灵魂”；融入汉语谓语表达更自然。
- source_word: τῶν ἐθνῶν
  choice: 外族人
  rationale: 在犹太人与非犹太人的对照中指非犹太人；“外族人”保留群体对照且为现代读者易懂。
- source_word: κατὰ τῶν ἀδελφῶν
  choice: 敌对弟兄们
  rationale: κατά在此表示反对、敌对；ἀδελφοί是早期基督徒对信徒群体的称呼，形式上保留“弟兄们”，其可能涵盖女性的范围以脚注说明。
theological_decisions:
- issue: ἀπειθήσαντες兼有“不信”与“不顺从”的语义张力
  choice: 拒绝相信
  alternative: 不顺从／悖逆
  rationale: 福音宣讲语境使“拒绝相信”更为突出；脚注保留“不顺从”的可能，避免抹平原词的语义张力。
- issue: ἀδελφῶν是否只指男性
  choice: 弟兄们
  alternative: 弟兄姊妹／信徒
  rationale: 正文贴近希腊文阳性复数形式；脚注说明此早期基督徒群体称谓可能统指男女信徒。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“煽动……使……心怀恶意，敌对……”清楚呈现两个并列动词及其结果；正文保留原文的群体称谓，并用脚注交代词义范围与歧义。
