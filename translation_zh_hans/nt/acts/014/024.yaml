  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διελθόντες
  choice: 经过
  rationale: 这是διέρχομαι的不定过去时主动分词，所述行动在主句动词之前发生。汉语用“经过……，来到……”即可自然表达先后关系，无须另加“之后”。
- source_word: τὴν Πισιδίαν
  choice: 彼西底
  rationale: 地区名按现代中文圣经常见译名音译。
- source_word: ἦλθον
  choice: 来到
  rationale: 在行程叙事中自然表达抵达下一地区，并与后面的方向短语顺畅衔接。
- source_word: εἰς τὴν Παμφυλίαν
  choice: 来到旁非利亚
  rationale: εἰς表示朝向并进入某地；汉语“来到”已包含抵达该地区的方向和进入意味，避免生硬直译为“进入”。
- source_word: καὶ
  choice: （不单独译出）
  rationale: καί承接前文行程。现代汉语在句首省略简单连接词更自然，而叙事连续性仍由语境和动词次序清楚表达。
