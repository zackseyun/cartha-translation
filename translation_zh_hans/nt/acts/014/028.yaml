  text: 他们和门徒一起住了不少日子[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“相当长的一段时间”或“颇有些日子”。希腊原文直译为“不是短时间”，采用了曲言法。
