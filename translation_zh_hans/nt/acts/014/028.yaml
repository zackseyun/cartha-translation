lexical_decisions:
- source_word: διέτριβον
  choice: 住了
  rationale: 未完成时在此表示持续逗留；“住了”在现代汉语叙事中自然，并保留在当地停留一段时间的含义。
- source_word: δὲ
  choice: 未单独译出
  rationale: δέ是轻微的叙事连接词；本节中文独立成句时省译更自然，句意及与上文的承接关系并未受损。
- source_word: χρόνον οὐκ ὀλίγον
  choice: 不少日子
  rationale: 原文以曲言法表达相当长的一段时间。“不少”保留“不是少”的修辞形态；“日子”符合汉语对一段居留时间的自然表达。
- source_word: σὺν τοῖς μαθηταῖς
  choice: 和门徒一起
  rationale: 忠实表达σύν加与格的共同相处之意；“门徒”依上下文指当地的信徒群体。
