  text: ὅ ⸀τε ἱερεὺς τοῦ Διὸς τοῦ ὄντος πρὸ τῆς ⸀πόλεως ταύρους καὶ στέμματα ἐπὶ τοὺς πυλῶνας ἐνέγκας σὺν τοῖς ὄχλοις ἤθελεν θύειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/013.yaml
  text: And the priest of Zeus[a], whose temple was before the city[b], brought bulls and wreaths to the gates and wanted to offer sacrifice with the crowds.
translation:
  language: zh_hans
  text: 城外宙斯庙[b]的祭司把公牛和花环[a]带到城门口，想要和群众一起献祭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “花环”也可译作“花冠”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“在城前的宙斯”；很可能是指位于城前或城外的宙斯庙或神祠。
    reason: alternative_reading
lexical_decisions:
- source_word: ὅ τε
  choice: （承接上文，不单独译出）
  rationale: ὅ τε在这里以惯用方式推进叙事。汉语无需机械加译“于是”或“并且”，直接承接上文更自然。
- source_word: ἱερεὺς τοῦ Διὸς
  choice: 宙斯庙的祭司
  rationale: Ζεύς是希腊神名，应译为“宙斯”，不改用罗马对应神名“朱庇特”。结合后接地点短语，用“宙斯庙的祭司”可自然表达其祭司身份。
- source_word: τοῦ ὄντος πρὸ τῆς πόλεως
  choice: 城外宙斯庙
  rationale: 该属格分词短语在形式上修饰“宙斯”，但语境很可能指宙斯的庙宇或神祠位于城前、城外。正文补出“庙”以便现代汉语读者理解，并以脚注保留原文形式及可能的表达。
- source_word: ταύρους
  choice: 公牛
  rationale: ταῦρος明确指公牛；在献祭场景中直译为“公牛”准确自然。
- source_word: στέμματα
  choice: 花环
  rationale: 指节庆或献祭仪式所用的环状花饰，也可理解为“花冠”；正文采用现代汉语较常用的“花环”。
- source_word: ἐπὶ τοὺς πυλῶνας
  choice: 带到城门口
  rationale: ἐπί与动作方向相连，表示带到门楼或城门处。汉语“城门口”自然；虽原文为复数，汉语名词在此无须标明数量。
- source_word: ἐνέγκας
  choice: 把……带到
  rationale: 不定过去时分词交代主句动作的背景或先行动作；汉语用连动结构表达，比直译“带来以后”更流畅。
- source_word: σὺν τοῖς ὄχλοις
  choice: 和群众一起
  rationale: 表示祭司与聚集的人群共同参与。“群众”在汉语中可作集合称谓，不必机械体现希腊文复数。
- source_word: ἤθελεν θύειν
  choice: 想要……献祭
  rationale: θέλω加不定式表达意愿或意图；θύω在祭祀语境中指献上祭牲，译为“献祭”保留宗教行为的含义。
theological_decisions:
- issue: τοῦ ὄντος πρὸ τῆς πόλεως的所指
  choice: 正文理解为位于城外的宙斯庙，译作“城外宙斯庙”。
  alternative: 按形式直译为“在城前的宙斯”，或译为“城前宙斯的祭司”。
  rationale: 希腊文形式上说“在城前的宙斯”，可能以神庙所在地来称呼该神；结合祭司准备献祭的叙事，指城前或城外的宙斯庙最为通顺。由于原文没有明说“庙”，脚注保留其字面形式和歧义，避免把推断伪装成明文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“献祭”准确体现祭祀语境；“城门口”比生硬保留复数的说法更符合现代汉语。脚注标记均置于其实际说明的词语之后。
