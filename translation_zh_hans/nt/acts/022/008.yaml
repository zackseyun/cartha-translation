base_translation:
  language: en
  yaml_path: translation/nt/acts/022/008.yaml
  text: And I answered[a], ‘Who are you, Lord?’ And he said to me, ‘I am Jesus the Nazarene[b], whom you are persecuting.’
translation:
  language: zh_hans
  text: 我回答：“主啊[a]，你是谁？”他对我说：“我就是你正在迫害的拿撒勒人[b]耶稣。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“先生”。希腊语κύριε既可作尊称，也可作“主”这一称号。
    reason: alternative_reading
  - marker: b
    text: 或译“拿撒勒的耶稣”或“来自拿撒勒的耶稣”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθην
  choice: 我回答说
  rationale: ἀποκρίνομαι在此表示对先前话语作答；“回答说”自然地引出后面的直接引语。
- source_word: Τίς εἶ
  choice: 你是谁
  rationale: 直接保留疑问代词与系词的含义，符合现代汉语问句习惯。
- source_word: κύριε
  choice: 主啊
  rationale: 保留κύριος常见的称谓“主”，并以语气词“啊”自然表达直接呼语；此词也可能只是尊称，因此用脚注保留“先生”的可能。
- source_word: εἶπέν τε πρὸς ἐμέ
  choice: 他对我说
  rationale: λέγω πρὸς ἐμέ自然译为“对我说”；τε的连接作用由上下文衔接体现，无须生硬增添连接词。
- source_word: Ἐγώ εἰμι
  choice: 我就是
  rationale: 用于身份确认时，“我就是”比单纯“我是”更自然，并体现ἐγώ明说所带的强调。
- source_word: Ἰησοῦς
  choice: 耶稣
  rationale: 采用现代中文圣经及普通读者熟悉的标准音译。
- source_word: ὁ Ναζωραῖος
  choice: 拿撒勒人耶稣
  rationale: “拿撒勒人”简洁保留带冠词称号的地域关联，也符合现代汉语表达；其他可能译法收入脚注。
- source_word: ὃν σὺ διώκεις
  choice: 你正在迫害的
  rationale: διώκω在此指敌意性的逼迫或迫害；“正在”自然表达希腊语现在时所指的持续行动，关系从句在汉语中置于中心语之前。
theological_decisions:
- issue: 扫罗称呼声音为κύριε时的含义
  choice: 主啊
  alternative: 先生
  rationale: “主”保留本词在叙事及基督论语境中的重要含义；但扫罗此刻尚在询问说话者身份，κύριε也可能只是尊称。正文不消解这层张力，并在脚注中注明另一译法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。直接引语标点符合简体中文规范；避免不必要的教派术语，同时以脚注保留κύριε和Ναζωραῖος的真实词义幅度。
