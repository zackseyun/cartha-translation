source:
  edition: SBLGNT
  text: Ἁνανίας δέ τις ἀνὴρ ⸀εὐλαβὴς κατὰ τὸν νόμον μαρτυρούμενος ὑπὸ πάντων τῶν κατοικούντων Ἰουδαίων,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/012.yaml
  text: A certain man[a], Ananias, devout according to the law, well spoken of by all the Jews living there,
translation:
  language: zh_hans
  text: 有一个名叫亚拿尼亚的人，按着律法敬虔，受到所有住在那里的犹太人的称赞。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “犹太人”或译“犹太地人”；若此词按族群—地域意义理解，而非宗教—群体身份理解，后者可作为另一种译法。
    reason: 保留Ἰουδαῖοι在不同语境中可指“犹太人”或“犹太地人”的词义幅度。
lexical_decisions:
- source_word: Ἁνανίας
  choice: 亚拿尼亚
  rationale: 采用现代中文圣经人名的通行音译，清楚指称这一人物。
- source_word: δέ
  choice: 不单独译出
  rationale: δέ在此表示轻微的叙事衔接；中文上下文无需另加“现在”或“于是”，省译更自然，也不虚增时间或次序含义。
- source_word: τις ἀνὴρ
  choice: 有一个人
  rationale: 保留τις所表达的未特指引入，同时明确ἀνήρ所指的是男性；“有一个人”符合现代中文叙事习惯。
- source_word: εὐλαβὴς κατὰ τὸν νόμον
  choice: 按着律法敬虔
  rationale: 把敬虔与律法之间的限定关系保留下来，既贴近原文，也避免把它扩写为对其行为或得救地位的额外判断。
- source_word: μαρτυρούμενος
  choice: 有好名声
  rationale: 该被动分词表示别人对他作出有利见证；“有好名声”自然传达公众的正面评价，同时保留被评价的含义。
- source_word: ὑπὸ πάντων τῶν κατοικούντων Ἰουδαίων
  choice: 在所有住在那里的犹太人中
  rationale: 保留πάντων的周全语气；“那里”依据上下文指大马士革，却不在本节中擅自补出地名。Ἰουδαίων在此主要指当地犹太群体。
theological_decisions:
- issue: Ἰουδαίων的身份含义
  choice: 犹太人
  alternative: 犹太地人
  rationale: 上下文谈的是住在大马士革、能为亚拿尼亚作见证的群体，重点在其族群与宗教共同体身份，而非来自犹太地区的地理身份；脚注保留另一种词义可能。
- issue: κατὰ τὸν νόμον对敬虔的限定
  choice: 按着律法敬虔
  alternative: 在律法方面虔诚
  rationale: 原文明确按照或依照律法来描述亚拿尼亚的敬虔；直译这一关系，不进一步判定这里所说的律法遵守具有何种神学功用。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“有一个人，名叫……”自然引入人物；分号把人物介绍与两项描述清楚连接。“按着律法敬虔”和“有好名声”避免古奥措辞，也不添加原文没有的神学解释。
