  text: 他们高声喊叫，甩动外衣[a]，并把尘土抛向空中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“把衣服扔开”或“扔衣服”。希腊语可指把衣服扔开，也可指因激动而挥甩衣服。
    reason: lexical_alternative
lexical_decisions:
- source_word: κραυγαζόντων
  choice: 高声喊叫
  rationale: 现在时主动分词描写人群持续进行的喧嚷；“高声喊叫”自然地传达公开而激烈的呼喊。
- source_word: τε
  choice: 一边……一边……又……
  rationale: τέ与后续的καί连接几个同时进行的动作；用汉语并列结构清楚表达其连续协调关系。
- source_word: αὐτῶν
  choice: 他们
  rationale: 原文属格复数在此作分词结构的逻辑主语；汉语明说“他们”更自然。
- source_word: ῥιπτούντων
  choice: 甩动
  rationale: 该词可指扔、抛或甩；“甩动”适合人群激动中的动作，同时避免把究竟是扔开衣服还是挥甩衣服定死，另以脚注列出可能译法。
- source_word: τὰ ἱμάτια
  choice: 外衣
  rationale: ἱμάτια通常指穿在外面的衣服；“外衣”比泛称“衣服”更具体，又不过度限定款式。
- source_word: κονιορτὸν
  choice: 尘土
  rationale: 准确表达细尘、尘土，也符合这一激烈示威动作的语境。
- source_word: βαλλόντων
  choice: 扬
  rationale: 与“尘土”和“到空中”搭配时，“扬”是自然的现代汉语，传达人把尘土抛撒起来的动作。
- source_word: εἰς τὸν ἀέρα
  choice: 到空中
  rationale: 贴近原文方向含义，也符合现代汉语习惯。
