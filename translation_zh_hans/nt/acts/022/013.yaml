base_translation:
  language: en
  yaml_path: translation/nt/acts/022/013.yaml
  text: He came to me[a], and standing by me said to me, ‘Brother Saul, receive your sight.’ And in that very hour I received my sight and looked at him.
translation:
  language: zh_hans
  text: 他来到我这里，站在我旁边，对我说：“扫罗弟兄，你恢复视力吧！”就在那一刻，我恢复了视力，并看见了他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恢复视力”两处原文使用同一个动词；也可译作“重见光明”。这个词还可表示“抬头看”，但这里失明和得医治的上下文支持恢复视力之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν πρὸς ἐμέ
  choice: 他来到我这里
  rationale: 以自然的汉语叙事表达不定过去时分词及 πρός 加宾格所表示的趋向，保留亚拿尼亚来到保罗面前的动作。
- source_word: ἐπιστάς
  choice: 站在我旁边
  rationale: 表达来到近旁并站定的空间含义，也与随后的说话自然衔接。
- source_word: Σαοὺλ ἀδελφέ
  choice: 扫罗弟兄
  rationale: 按现代汉语习惯音译人名，并用“弟兄”保留呼格所表达的亲近及信仰群体关系，不将其处理成正式头衔。
- source_word: ἀνάβλεψον
  choice: 你重见光明吧
  rationale: 该动词可指“抬头看”，也可指恢复视力；本段失明与医治的语境明确支持后者。祈使句末用“吧”，使直接命令在现代汉语中自然庄重。
- source_word: αὐτῇ τῇ ὥρᾳ
  choice: 就在那一刻
  rationale: 保留事件发生时间的即时性和强调；相较字面的“就在那一小时”，“那一刻”更符合现代汉语对即时事件的表达。
- source_word: ἀνέβλεψα
  choice: 我重见光明
  rationale: 与前面的 ἀνάβλεψον 保持词义呼应，明确表示视力恢复，而非单纯抬头。
- source_word: εἰς αὐτόν
  choice: 看着他
  rationale: 保留视线朝向亚拿尼亚的方向性，并自然承接视力恢复这一动作。
- source_word: κἀγώ
  choice: 我
  rationale: 在“就在那一刻，我……”的汉语结构中已经自然表达承接关系，无须机械加入“而我也”。
