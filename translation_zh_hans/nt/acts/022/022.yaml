base_translation:
  language: en
  yaml_path: translation/nt/acts/022/022.yaml
  text: They were listening to him up to this statement, and they raised their voices, saying, “Take such a man away from the earth, for it was not fitting for him to live.”
translation:
  language: zh_hans
  text: 他们一直听保罗说话，直到他说到这句话，就高声喊道：“把这样的人从世上除掉！他不该活着！”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἤκουον
  choice: 一直听
  rationale: 未完成时表示过去持续进行的动作；“一直听”自然地体现他们此前持续听保罗讲话。
- source_word: ἄχρι τούτου τοῦ λόγου
  choice: 说到这句话
  rationale: λόγος在此指保罗话语中的这一句或这一要点；该表达符合现代汉语叙事习惯，也明确这是引发反应的内容。
- source_word: ἐπῆραν τὴν φωνὴν αὐτῶν λέγοντες
  choice: 就高声喊道
  rationale: 该短语是提高嗓音发出呼喊的惯用表达；合译为“高声喊道”准确而自然。
- source_word: Αἶρε ἀπὸ τῆς γῆς τὸν τοιοῦτον
  choice: 这样的人，应当从世上除掉
  rationale: αἶρε在敌意命令中意为移走、除掉；ἀπὸ τῆς γῆς在此不是单纯迁离某地，而是要求将他从活人中除去。“这样的人”保留τὸν τοιοῦτον的鄙夷语气。
- source_word: οὐ γὰρ καθῆκεν αὐτὸν ζῆν
  choice: 他不该活着
  rationale: καθῆκεν表达合宜、应当之意；结合暴民要求处死他的语境，“不该活着”既简洁自然，也保留其规范判断的力度。
