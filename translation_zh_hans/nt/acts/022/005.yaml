  text: ὡς καὶ ὁ ἀρχιερεὺς μαρτυρεῖ μοι καὶ πᾶν τὸ πρεσβυτέριον· παρ’ ὧν καὶ ἐπιστολὰς δεξάμενος πρὸς τοὺς ἀδελφοὺς εἰς Δαμασκὸν ἐπορευόμην ἄξων καὶ τοὺς ἐκεῖσε ὄντας δεδεμένους εἰς Ἰερουσαλὴμ ἵνα τιμωρηθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/005.yaml
  text: as also the high priest and the whole council of elders can testify for me. From them I also received letters to the brothers in Damascus[a], and I was traveling there to bring also those who were there, bound, to Jerusalem so that they might be punished.
translation:
  language: zh_hans
  text: 大祭司和全体长老议会也可以为我作证。我还从他们那里领了写给大马士革弟兄们的信[a]，正前往那里，要把在那里、已经被捆绑的人也带到耶路撒冷，使他们受惩罚。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“弟兄姊妹们”。希腊原文作“弟兄们”，但在某些语境中可泛指较广泛的群体。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς καὶ
  choice: 也
  rationale: 在汉语中用“也”自然承接上文，并表达保罗所说之事还可由这些权威人士佐证。
- source_word: ὁ ἀρχιερεὺς
  choice: 大祭司
  rationale: 这是该历史和宗教语境中对最高祭司职分的标准现代汉语称谓。
- source_word: μαρτυρεῖ μοι
  choice: 可以为我作证
  rationale: 表达这些人能够为保罗刚才的陈述提供佐证；“为我”体现与格 μοι 在此处的支持、佐证关系。
- source_word: πᾶν τὸ πρεσβυτέριον
  choice: 全体长老议会
  rationale: πρεσβυτέριον 指长老组成的集体或议事机构，不只是所有年长者；此译清楚保留其群体性。
- source_word: παρ’ ὧν
  choice: 从他们那里
  rationale: 自然回指大祭司和全体长老议会。
- source_word: ἐπιστολὰς
  choice: 信
  rationale: 保留基本词义；这些信具有授权性质可由上下文推知，无须在正文中增译。
- source_word: πρὸς τοὺς ἀδελφοὺς
  choice: 给大马士革弟兄们的
  rationale: 保留 ἀδελφοί 的阳性复数形式及群体称谓；其所指可能是大马士革的同族或相关社群成员，较宽泛的可能性置于脚注。
- source_word: ἐπορευόμην
  choice: 前往那里
  rationale: 以自然汉语表达未完成过去时所描写的在途行动。
- source_word: ἄξων
  choice: 要……带到
  rationale: 将随运动动词使用的将来分词译作目的，准确表达此行意图。
- source_word: τοὺς ἐκεῖσε ὄντας
  choice: 在那里的人
  rationale: 简洁呈现实词化分词短语，指身在大马士革的那些人。
- source_word: δεδεμένους
  choice: 捆绑起来
  rationale: 表达使他们处于被捆绑、受拘押的状态，不擅自具体化为锁链。
- source_word: ἵνα τιμωρηθῶσιν
  choice: 受惩罚
  rationale: 自然表达目的从句中的被动受罚含义，同时不添加原文未说明的具体刑罚。
theological_decisions:
- issue: ἀδελφοί 在此处是否包括更广泛的社群成员
  choice: 弟兄们
  alternative: 弟兄姊妹们；同胞
  rationale: 正文保留希腊文阳性复数的直观群体称谓，不把可能的混合性别范围或同族身份直接写入正文；脚注提示该词在某些语境下可泛指更广泛的群体。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“全体长老议会”避免含混地理解为一般老人群体；后半句按自然汉语重排为“捆绑起来，带到……受惩罚”，同时保留原文的行动目的和 καί 的“也”。
