  text: ἔπεσά τε εἰς τὸ ἔδαφος καὶ ἤκουσα φωνῆς λεγούσης μοι· Σαοὺλ Σαούλ, τί με διώκεις;
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/007.yaml
  text: I fell to the ground and heard a voice saying to me, ‘Saul, Saul, why are you persecuting me?’
translation:
  language: zh_hans
  text: 我就倒在地上，听见有声音对我说：“扫罗！扫罗！你为什么迫害我？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπεσά τε εἰς τὸ ἔδαφος
  choice: 我就倒在地上
  rationale: ἔπεσα是简单过去时态的叙事动词；“倒在地上”自然表达向地面倒下。τε承接上文，用“就”体现叙事上的连接与推进，不作生硬的逐词对应。
- source_word: ἤκουσα φωνῆς
  choice: 听见有声音
  rationale: ἀκούω后接属格φωνῆς，在此表示听见声音；中文用“听见有声音”自然，也保留声音首次出现时的不定性。
- source_word: λεγούσης μοι
  choice: 对我说
  rationale: 现在分词说明这声音当时所说的话，μοι明确指出说话的对象是“我”；中文以“对我说”简洁表达同时发生的动作。
- source_word: Σαοὺλ Σαούλ
  choice: 扫罗！扫罗！
  rationale: 采用现代中文圣经语境中通行的人名译法，并保留两次呼名所具有的强调和直接呼唤语气。
- source_word: τί με διώκεις
  choice: 你为什么迫害我？
  rationale: τί在此询问行动的原因，译作“为什么”；διώκεις在上下文中指敌对性的追逼和迫害，且现在时体现持续进行的行为，中文“迫害”准确自然。
theological_decisions:
- issue: 说话者如何认定扫罗对信徒的迫害
  choice: 保留直接的第一人称“迫害我”
  alternative: 解释性译为“迫害我的子民”或“迫害我的门徒”
  rationale: 原文直接使用με（“我”），把扫罗的迫害与说话者本人联系起来。译文不加解释，以保留原句的神学力度与张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我就倒在地上”延续叙事语流；直接引语以感叹号体现重复呼名的呼唤力度，但不额外扩展原文含义。
