  text: Ἐγένετο δέ μοι πορευομένῳ καὶ ἐγγίζοντι τῇ Δαμασκῷ περὶ μεσημβρίαν ἐξαίφνης ἐκ τοῦ οὐρανοῦ περιαστράψαι φῶς ἱκανὸν περὶ ἐμέ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/006.yaml
  text: It happened that as I was traveling and drawing near to Damascus[a], about noon, suddenly a bright light from heaven flashed around me,
translation:
  language: zh_hans
  text: “我在路上前行、快到大马士革的时候，大约正午，忽然有一道强光[a]从天上照在我四周。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一道大光。”希腊语这一表达可以着重说明光的规模，也可以着重说明光的强度。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δέ μοι
  choice: 事情是这样发生的
  rationale: 以自然的汉语引出保罗亲历事件的叙述，保留 ἐγένετο 的事件引入作用和 μοι 所体现的第一人称经历；δέ 的轻微承接意味由上下文和句式自然表达，不另加过强的时间词。
- source_word: πορευομένῳ καὶ ἐγγίζοντι τῇ Δαμασκῷ
  choice: 我一路前行，快到大马士革时
  rationale: 两个现在分词描写当时持续进行并彼此重叠的动作；“快到”自然表达 ἐγγίζω 加与格所指的接近目的地。
- source_word: περὶ μεσημβρίαν
  choice: 大约正午
  rationale: περί 表示约略时间，μεσημβρία 指正午；措辞简洁，并保留时间的近似性。
- source_word: ἐξαίφνης
  choice: 忽然
  rationale: 准确表达事件突如其来的性质。
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: 从天上
  rationale: 既符合现代汉语习惯，也保留 οὐρανός 在启示性语境中可能包含的超越性来源，不缩减为纯气象意义的“天空”。
- source_word: περιαστράψαι
  choice: 照亮了……四周
  rationale: 表达复合动词所含的环绕照射之意；突发性已由“忽然”明确表达。
- source_word: φῶς ἱκανὸν
  choice: 一道强光
  rationale: ἱκανός 在此可指光的强度或显著程度；“强光”是自然现代汉语，同时以脚注保留“大光”这一可能译法。
- source_word: περὶ ἐμέ
  choice: 我的四周
  rationale: 直接表达光环绕说话者的空间关系。
theological_decisions:
- issue: ἐκ τοῦ οὐρανοῦ 中 οὐρανός 的含义
  choice: 从天上
  alternative: 从天空
  rationale: 路加—使徒行传的用法及保罗蒙启示的上下文支持保留超越性或神圣来源的意味；“天上”不把该表达限定为单纯的大气现象，同时也未额外说明其神学性质。
translation_notes:
  register: 采用现代、庄重而适合口述见证的普通话。用“事情是这样发生的”承接叙事，以“大约正午”“忽然”等日常清楚的措辞保持原句节奏。脚注标记置于其实际说明的“强光”之后。
