  text: καὶ ὅτε ⸀ἐξεχύννετο τὸ αἷμα Στεφάνου τοῦ μάρτυρός σου, καὶ αὐτὸς ἤμην ἐφεστὼς καὶ συνευδοκῶν ⸀καὶ φυλάσσων τὰ ἱμάτια τῶν ἀναιρούντων αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/020.yaml
  text: And when the blood of Stephen your witness was being poured out[a], I myself was standing by and approving, and guarding the cloaks of those who were killing him.
translation:
  language: zh_hans
  text: 并且，当你的见证人[a]司提反的血正被倾流时，我本人当时站在一旁，表示赞同，并看守那些杀他之人的外衣。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “见证人”也可译作“殉道者”。希腊语原词可指作见证的人，后来在基督徒的用法中，尤其与因所作见证而死的人联系起来。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεχύννετο
  choice: 被流出来
  rationale: 采用未完成时被动表达当时正在发生的过程，并保留ἐκχέω“倾倒、流出”的鲜明意象；中文以“血被流出来”表达虽较庄重，却能贴近原文。
- source_word: αἷμα
  choice: 血
  rationale: 直接对应原词，符合现代汉语的自然表达。
- source_word: μάρτυρός
  choice: 见证人
  rationale: 保留μάρτυς在本句中的基本词义“见证人”，不把后来专指因信仰而死者的称谓直接写入正文。
- source_word: ἐφεστὼς
  choice: 站在旁边
  rationale: 表达在场并站于近旁的场景，不额外推断保罗所处的具体位置或职能。
- source_word: συνευδοκῶν
  choice: 表示赞同
  rationale: 体现共同认可、赞成的主动意味，比单纯“同意”更清楚。
- source_word: φυλάσσων
  choice: 看守
  rationale: 准确表达φυλάσσω对物件加以守护、照看的含义。
- source_word: ἱμάτια
  choice: 外衣
  rationale: ἱμάτια在此指行刑者脱下的外层衣物；“外衣”比泛称“衣服”更具体，也符合当时场景。
- source_word: ἀναιρούντων
  choice: 杀
  rationale: 自然、直接地表达ἀναιρέω在此处“杀死”的含义，不加入“谋杀”等原词未明说的法律或道德定性。
- source_word: αὐτὸς
  choice: 我自己
  rationale: 保留代词的强调作用，突出说话者亲自在场并参与赞同。
theological_decisions:
- issue: 如何翻译指司提反的μάρτυς
  choice: 见证人
  alternative: 殉道者
  rationale: 原词的基本意义是“见证人”，而上下文中的死亡使其与后来“殉道者”的基督教用法形成明显联系。正文保留基本词义，脚注交代另一种理解，以免把后来的术语无提示地带入正文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“表示赞同”清楚传达参与认可；“看守……外衣”保持具体场景。脚注标记置于与μάρτυς相关的“见证人司提反”之后，以明确其所注释的词语。
