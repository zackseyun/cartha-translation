  to: 并且，当你的见证人[a]司提反的血正被倾流时，我本人当时站在一旁，表示赞同，并看守那些杀他之人的外衣。
  rationale: 修订“被流出来”为“正被倾流”，以自然汉语表达原文未完成时被动的持续过程，并保留“倾倒／倾流”的形象；删除无必要的“也”，以“我本人”呈现αὐτός的强调；将脚注标记移至“见证人”后，校正其词汇注释锚点。其余表达忠实保留原文的句法关系和具体行动。
