  terminology: “见证人”可保留为μάρτυς的基本义，并以脚注提供“殉道者”这一在本语境中相关的替代译法。“外衣”“看守”“杀他的人”均准确而自然。脚注锚点应紧随“见证人”，而非置于整项从句末尾。
