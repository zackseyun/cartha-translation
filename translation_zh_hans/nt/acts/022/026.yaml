  register: 采用庄重而通顺的现代标准汉语。军职使用中文圣经传统中清楚而准确的“百夫长”和“千夫长”；问句保持紧迫的口吻，同时以脚注保留μέλλω在临近行动与行动意图之间的语义张力。
