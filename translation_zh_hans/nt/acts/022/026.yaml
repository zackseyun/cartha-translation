  text: ἀκούσας δὲ ὁ ἑκατοντάρχης προσελθὼν ⸂τῷ χιλιάρχῳ ἀπήγγειλεν⸃ λέγων· ⸀Τί μέλλεις ποιεῖν; ὁ γὰρ ἄνθρωπος οὗτος Ῥωμαῖός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/026.yaml
  text: When the centurion heard this[a], he went to the commander and reported it, saying[b], “What are you about to do? For this man is a Roman citizen.”
translation:
  language: zh_hans
  text: 百夫长听见这话，就上前向千夫长报告说：“你要做什么[a]？因为这个人是罗马公民[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你正要做什么？”或“你打算做什么？”希腊语原文既可指即将采取的行动，也可指有意采取的行动。
    reason: lexical_alternative
  - marker: b
    text: 直译：“这个人是罗马人。”在这里是指他拥有罗马公民身份。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: 听见这话
  rationale: 不定过去时分词交代先于主要动作发生的情境；“听见这话”自然承接上一节保罗所说的话。
- source_word: ἑκατοντάρχης
  choice: 百夫长
  rationale: 这是ἑκατοντάρχης所指的罗马军职，也是现代中文圣经和历史叙述中准确、通行的译法。
- source_word: προσελθὼν
  choice: 上前向
  rationale: 表达朝上级军官走近的动作，同时使中文叙事简洁顺畅。
- source_word: χιλιάρχῳ
  choice: 千夫长
  rationale: 沿用中文读者熟悉的罗马军职译名；比泛称“长官”更具体，也避免使用生僻音译。
- source_word: ἀπήγγειλεν
  choice: 报告
  rationale: 该词表示把消息正式告知他人；“报告”符合军队上下级之间的语境。
- source_word: λέγων
  choice: 说
  rationale: 以自然中文引出报告的直接内容，不机械保留希腊语分词结构。
- source_word: Τί μέλλεις ποιεῖν;
  choice: 你要做什么？
  rationale: μέλλω加不定式可指即将采取的行动，也可指意图；中文“要做什么”能够较自然地保留这两种可能。
- source_word: ὁ γὰρ ἄνθρωπος οὗτος
  choice: 这个人可是
  rationale: “这个人”准确指明该成年男子；“可是”在警告式话语中自然体现γάρ所引出的理由，并突出该事实对长官行动的制约。
- source_word: Ῥωμαῖός ἐστιν
  choice: 是罗马公民
  rationale: 字面为“是罗马人”，但本段法律和军事语境关注的是其罗马公民身份；明译为“罗马公民”可避免被误解为族裔或居住地。
