  text: οἱ δὲ σὺν ἐμοὶ ὄντες τὸ μὲν φῶς ⸀ἐθεάσαντο τὴν δὲ φωνὴν οὐκ ἤκουσαν τοῦ λαλοῦντός μοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/009.yaml
  text: Those who were with me saw the light[a], but they did not hear the voice of the one speaking to me.
translation:
  language: zh_hans
  text: 和我在一起的人看见了那光，却没有听见对我说话的那个人的声音。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“却没有听懂对我说话的那个人所说的话。”参见使徒行传9:7，那里说保罗的同行者听见了声音；两处的差别可能在于：他们听见了声响，却没有听懂说话者所说的话。
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ σὺν ἐμοὶ ὄντες
  choice: 与我同行的人
  rationale: 自然表达“那些与我在一起的人”，不额外加入原文没有明说的性别信息；结合行程语境译作“同行”简洁清楚。δέ的转折关系由后文“却”体现，不另加时间性连接词。
- source_word: τὸ μὲν φῶς
  choice: 那光
  rationale: φῶς直译为“光”；不用“强光”或“亮光”，因为本节本身没有相应修饰语。μέν与后面的δέ构成对照，在汉语中以“却”自然呈现。
- source_word: ἐθεάσαντο
  choice: 看见了
  rationale: θεάομαι在此指实际看见；“看见了”符合现代汉语，也不加入刻意观看的含义。
- source_word: τὴν δὲ φωνὴν
  choice: 声音
  rationale: φωνή可指“声音”或“嗓音/话音”。因后接“那位对我说话者”，这里译“声音”既保留其语义范围，也明确与一位说话者有关。
- source_word: οὐκ ἤκουσαν
  choice: 没有听见
  rationale: ἀκούω的直接常用义是“听见”。不在正文中改译为“没有听懂”，以免消解与使徒行传9:7之间的表面张力；可能的理解义放在脚注说明。
- source_word: τοῦ λαλοῦντός μοι
  choice: 那位对我说话者的
  rationale: 以“那位……者”保留未明说姓名的指称，并用“对我说话”体现λαλοῦντος现在分词所表达的进行性动作以及μοι的受事关系。
theological_decisions:
- issue: 本节与使徒行传9:7关于同行者是否听见声音的表面张力
  choice: 正文译作“没有听见……的声音”
  alternative: “没有听懂……的声音”或“没有听清……的话”
  rationale: 本节希腊文最直接的表层意义是“没有听见声音”，尤其φωνή受“那位对我说话者”限定。不过ἀκούω在语境中也可涉及领会，使徒行传9:7则说同行者听见声音。正文保留直接措辞，脚注说明另一种可能，从而不在翻译中强行调和两处叙述。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“与我同行的人……却……”清楚呈现原文的对照结构；正文保持简洁，脚注保留词义可能性及与平行叙事之间的张力。
