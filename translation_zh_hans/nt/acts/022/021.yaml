  naturalness: “他对我说”及“去吧”自然。改为“因为我要把你差到远方的外邦人那里去”，可清楚表达命令的理由，句法也更顺畅。
  terminology: 将“外族人”改为“外邦人”，保留其在犹太—非犹太历史语境中的特定含义；脚注仅保留与原词相符的“列国”词汇替代，不采用“万族”这一不够贴切的替代词。
