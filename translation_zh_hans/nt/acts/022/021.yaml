  yaml_path: translation/nt/acts/022/021.yaml
  text: And he said to me[a], ‘Go, because I will send you far away to the Gentiles.’
translation:
  language: zh_hans
  text: 他对我说：“你去吧，因为我要把你差到远方的外邦人那里去。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “外邦人”或译“列国”。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν πρός με
  choice: 他对我说
  rationale: λέγω与πρός加宾格在此引出对受话者所说的直接引语；“对我说”自然并忠实保留叙事表达。
- source_word: Πορεύου
  choice: 去吧
  rationale: πορεύομαι的现在时中动命令式在此是惯用命令，意为动身、离去；“去吧”符合现代汉语口吻，也保留命令语气。
- source_word: ὅτι
  choice: （不单独译出，以前后句关系表达理由）
  rationale: ὅτι在此可引出命令的理由。汉语用“去吧！我要……”自然呈现因由关系；若硬译“因为”，语势较生硬。
- source_word: ἐγὼ
  choice: 我
  rationale: 原文显式主语ἐγώ带有一定强调；汉语“我要差你”在语境中自然地承载这一强调，不另加排版标示。
- source_word: εἰς ἔθνη
  choice: 到……外族人那里去
  rationale: ἔθνη在使徒行传的宣教语境中指犹太人以外的族群。“外族人”较通俗地表达这一历史性群体区别，同时避免把它误解为现代政治国家。
- source_word: μακρὰν
  choice: 远方
  rationale: μακράν表示距离遥远；置于目的地短语“远方的外族人”中，汉语简洁自然，并保留地理距离感。
- source_word: ἐξαποστελῶ
  choice: 要差
  rationale: ἐξαποστέλλω的将来时表示将要差遣出去。“要差”既表达将来意向，也保留受命被派出的意味。
- source_word: σε
  choice: 你
  rationale: 作为差遣动作的第二人称单数宾语，直译为“你”。
theological_decisions:
- issue: 使徒使命语境中ἔθνη的译法
  choice: 外族人
  alternative: 列国／万族
  rationale: 上下文所指是非犹太人，而非单纯的政治国家。“外族人”在现代普通话中可清楚呈现犹太人与其他族群的历史性区别；脚注保留“列国／万族”的词汇可能性，以免掩盖原词的群体与民族双重范围。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“去吧”自然表达命令；“差”保留差遣含义。“外族人”比音译式宗教术语更便于普通读者理解。脚注标记置于整句之后，并在脚注中保留ἔθνη的词义幅度。
