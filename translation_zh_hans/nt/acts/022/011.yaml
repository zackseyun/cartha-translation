  text: ὡς δὲ οὐκ ἐνέβλεπον ἀπὸ τῆς δόξης τοῦ φωτὸς ἐκείνου, χειραγωγούμενος ὑπὸ τῶν συνόντων μοι ἦλθον εἰς Δαμασκόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/011.yaml
  text: And since I could not see because of the brightness of that light[a], I came into Damascus being led by the hand by those who were with me.
translation:
  language: zh_hans
  text: 我因那光强烈的光芒而看不见，于是由跟我同行的人牵着手，进了大马士革。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνέβλεπον
  choice: 看不见
  rationale: 此处结合强光使保罗失去视力的语境，表达实际无法看见，而不只是不能注视；未完成时态描写当时持续的状态。
- source_word: ἀπὸ τῆς δόξης τοῦ φωτὸς ἐκείνου
  choice: 因那光的荣辉
  rationale: ἀπό在此表示原因；δόξα指那光可见而强烈的辉耀。“荣辉”既保留“荣耀”的语义色彩，也自然表达导致失明的灿烂光辉。脚注提供更偏物理效果的译法。
- source_word: χειραγωγούμενος
  choice: 由……牵着手
  rationale: 明确保留复合动词中“用手引领”的生动细节，并以现代汉语自然表达。
- source_word: ὑπὸ τῶν συνόντων μοι
  choice: 由跟我同行的人
  rationale: 忠实表达“与我同在、随我同行的人”，不额外赋予该群体正式身份。
- source_word: ἦλθον εἰς Δαμασκόν
  choice: 进了大马士革
  rationale: 保留εἰς所含进入某地的方向感，同时符合现代汉语叙事习惯。
- source_word: ὡς δὲ
  choice: 我因……，就……
  rationale: 在汉语中用“因……就……”体现此处的因果背景，并自然承接上下文；不机械另译δέ。
theological_decisions:
- issue: 神显语境中δόξα的译法
  choice: 荣辉
  alternative: 亮光；荣耀；光辉
  rationale: “荣辉”保留δόξα可能具有的神显和荣耀意味，同时在“那光的荣辉”这一搭配中清楚指向可见的强烈辉耀，避免只译“亮度”而削弱原文潜在的神学张力，也避免单译“荣耀”造成过度抽象。
translation_notes:
  register: 采用自然、庄重的现代标准普通话。“牵着手”保留原文的具体动作；“进了大马士革”简洁呈现进入城中的方向性。主文与脚注共同保留δόξα的可见光辉和“荣耀”两方面含义。
