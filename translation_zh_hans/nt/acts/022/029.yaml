  text: εὐθέως οὖν ἀπέστησαν ἀπ’ αὐτοῦ οἱ μέλλοντες αὐτὸν ἀνετάζειν· καὶ ὁ χιλίαρχος δὲ ἐφοβήθη ἐπιγνοὺς ὅτι Ῥωμαῖός ἐστιν καὶ ὅτι ⸂αὐτὸν ἦν⸃ δεδεκώς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/029.yaml
  text: Therefore those who were about to examine him withdrew from him at once[b][a], and the tribune also became afraid when he realized that he was a Roman citizen and that he had bound him.
translation:
  language: zh_hans
  text: 于是，那些正要审问保罗的人立刻退开了[a]。千夫长[b]得知保罗是罗马公民，而且自己已经捆绑了他，也害怕起来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “审问”在这里具体可指“用鞭打来审讯”；上文说明了他们准备采用的手段。
    reason: lexical_alternative
  - marker: b
    text: “千夫长”是罗马军队的军官称号，名义上统领约一千名士兵，但实际人数可能不同；也可译作“指挥官”。
    reason: cultural_note
lexical_decisions:
- source_word: εὐθέως οὖν
  choice: 于是……立刻
  rationale: “于是”承接上文并表达结果，“立刻”准确传达行动的即时性，符合现代汉语叙事习惯。
- source_word: ἀπέστησαν ἀπ’ αὐτοῦ
  choice: 退开了
  rationale: 自然表达这些人停止逼近并离开保罗的动作，较“从他那里离去”更符合本处情境。
- source_word: οἱ μέλλοντες αὐτὸν ἀνετάζειν
  choice: 那些正要审问保罗的人
  rationale: μέλλω加不定式表示即将进行的行动；ἀνετάζω指正式审讯。正文保留其基本含义，脚注依据上文说明审讯所用的手段。为避免连续代词造成指代不清，将αὐτόν明确译为“保罗”。
- source_word: χιλίαρχος
  choice: 千夫长
  rationale: 采用中文圣经及历史叙述中通行、简洁的罗马军职称谓；脚注说明这是统领一支部队的高级军官称号，并不必然表示实际统领人数恰好为一千。
- source_word: ἐφοβήθη
  choice: 也害怕起来
  rationale: 既表达恐惧，也体现不定过去时所呈现的反应起点；“也”对应καὶ…δὲ，表明千夫长同样作出反应。
- source_word: ἐπιγνοὺς
  choice: 得知
  rationale: 表达千夫长此时确知保罗身份的因果背景，简洁自然。
- source_word: Ῥωμαῖός ἐστιν
  choice: 保罗是罗马公民
  rationale: 此处关注的是法律身份而非族裔，“罗马公民”准确传达语境含义；重复“保罗”使中文指代清楚。
- source_word: αὐτὸν ἦν δεδεκώς
  choice: 自己已经捆绑了他
  rationale: “已经”体现完成时所强调的既成行为及其持续后果；“自己”点明千夫长对该行为负有责任，同时不额外断定是他亲手还是下令捆绑。
