source:
  edition: SBLGNT
  text: κἀγὼ εἶπον· Κύριε, αὐτοὶ ἐπίστανται ὅτι ἐγὼ ἤμην φυλακίζων καὶ δέρων κατὰ τὰς συναγωγὰς τοὺς πιστεύοντας ἐπὶ σέ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/019.yaml
  text: And I said[a], ‘Lord[b], they themselves know that in every synagogue I was imprisoning and beating those who believe in you.’
translation:
  language: zh_hans
  text: 我就说：“主啊，他们自己知道，我从一个会堂到另一个会堂[a]，把那些信靠你的人[b]关进监牢，并且殴打他们。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在各会堂里”；希腊文在这里具有分配意味，表示这事在多个会堂反复发生。
    reason: lexical_alternative
  - marker: b
    text: 或译：“相信你的人”或“信赖你的人”。
    reason: alternative_reading
lexical_decisions:
- source_word: κἀγὼ εἶπον
  choice: 我就说
  rationale: κἀγώ是καὶ ἐγώ的缩合；结合叙事语境译为“我就说”，自然承接上文，也保留第一人称主语。
- source_word: Κύριε
  choice: 主啊
  rationale: κύριος的呼格；此处保罗向异象中的耶稣说话。“主啊”既自然庄重，也保留原文的尊称及其基督论分量。
- source_word: αὐτοὶ ἐπίστανται
  choice: 他们自己知道
  rationale: αὐτοί带强调意味，指出这些人亲自知道保罗从前的行为；“他们自己知道”在现代汉语中准确自然。
- source_word: ἤμην φυλακίζων καὶ δέρων
  choice: 把……关进监牢，并且殴打他们
  rationale: 未完成时的迂说结构表达过去持续或反复发生的行动。汉语借“从一个……到另一个……”所呈现的反复场景和并列动词自然传达这种惯常性。
- source_word: κατὰ τὰς συναγωγάς
  choice: 从一个会堂到另一个会堂
  rationale: κατά加复数宾格在此具有分配意义，表示行动反复遍及多个会堂；该译法比单纯的“在各会堂里”更清楚地传达逐处进行的意味。
- source_word: τοὺς πιστεύοντας ἐπὶ σέ
  choice: 那些信靠你的人
  rationale: πιστεύω加ἐπί及宾格表示信心或信赖指向某人。“信靠你”兼顾相信与倚靠的语义，又不将原文限定为单纯的认知认同。
theological_decisions:
- issue: 对耶稣的κύριος称呼
  choice: 主啊
  alternative: 主人啊
  rationale: “主”是该称呼在本语境中最自然且传统稳定的译法，保留对复活之耶稣的尊称和潜在基督论分量，而不额外扩展原文。
- issue: πιστεύοντας ἐπὶ σέ所表达的信心关系
  choice: 信靠你的人
  alternative: 信你的人
  rationale: “信靠”较充分体现ἐπί所表达的指向和倚赖，同时仍保留“相信”与“信赖”之间原有的语义张力。
- issue: 保罗从前逼迫行为的体貌
  choice: 以分配性地点短语配合连续动作，表达反复发生的行为
  alternative: 我一向把……关进监牢并殴打他们
  rationale: 原文ἤμην加两个现在分词突出过去持续或惯常的行动。正文避免加入原文没有的“一向”，而由“从一个会堂到另一个会堂”和动作并列自然体现反复性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“关进监牢”比“囚禁”更具体自然；“殴打”准确表达δέρω的一般身体击打含义，不擅自限定为司法性的鞭打。所有注脚标记均置于对应正文之后。
