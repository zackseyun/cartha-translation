id: ACT.22.14
reference: Acts 22:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ὁ θεὸς τῶν πατέρων ἡμῶν προεχειρίσατό σε γνῶναι τὸ θέλημα αὐτοῦ καὶ ἰδεῖν τὸν δίκαιον καὶ ἀκοῦσαι φωνὴν ἐκ τοῦ στόματος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/014.yaml
  text: And he said[a], ‘The God of our fathers has appointed you to know his will, to see the Righteous One[b], and to hear a voice from his mouth,’
translation:
  language: zh_hans
  text: 他就说：“我们祖先的上帝已经选定了你[a]，要你明白他的旨意，看见那位义者[b]，并听见从他口中发出的声音。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“委任了你”。希腊语动词可指为某项任务拣选或任命一个人。
    reason: lexical_alternative
  - marker: b
    text: “义者”是对耶稣的称号；也可译作“公义者”。
    reason: alternative_reading
lexical_decisions:
- source_word: προεχειρίσατό
  choice: 已经选定了
  rationale: 该动词表示为某一使命拣选或任命某人；“选定”兼顾选择和委派的含义，又不把“预先”的时间意味强加给原文。
- source_word: γνῶναι
  choice: 明白
  rationale: 这里指认识、领会上帝的旨意；现代汉语中“明白他的旨意”比“知道他的旨意”更自然，同时没有扩展为完全理解。
- source_word: τὸ θέλημα αὐτοῦ
  choice: 他的旨意
  rationale: “旨意”是现代中文圣经语体中自然且庄重的表达，保留了θέλημα可指意愿或所定目的的宽度。
- source_word: ἰδεῖν
  choice: 看见
  rationale: 直接表达实际看见，避免使用较古雅的“得见”或“瞻仰”。
- source_word: τὸν δίκαιον
  choice: 那位义者
  rationale: 定冠词加形容词实体化，在《使徒行传》中作为耶稣的称号使用；“那位”体现特指，“义者”保留称号的凝练形式。
- source_word: ἀκοῦσαι φωνὴν
  choice: 听见……声音
  rationale: φωνή没有冠词，不宜擅自明确为“那声音”；下文“从他口中”表明这是发出的言语之声。
- source_word: ἐκ τοῦ στόματος αὐτοῦ
  choice: 从他口中发出的
  rationale: 保留原文具体的“从他口中”，强调保罗将直接听见他说话，而不简化成“从他那里”。
- source_word: Ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: 我们祖先的上帝
  rationale: πατέρων在此指以色列历代先祖；现代汉语“祖先”自然准确，并保留亚拿尼亚与保罗共有的以色列传承。
theological_decisions:
- issue: τὸν δίκαιον是基督论称号还是一般描述
  choice: 译作称号“那位义者”，在上下文中指耶稣
  alternative: 译作描述性的“那个义人”或称号“那位公义者”
  rationale: 《使徒行传》3:14和7:52也以此表达指耶稣，称号用法有充分的语境依据；译文仍保留δίκαιος的基本意义，不进一步解释其神学内涵。
- issue: πατέρων是否按字面译为“父辈”
  choice: 译作“祖先”
  alternative: 译作“先祖”或“父辈”
  rationale: 此处是以色列圣约历史中的群体性称呼，并非仅指近世父辈；“祖先”在现代普通话中清楚自然，也没有削弱原文所指的历史传承。
- issue: προεχειρίσατό是否包含预定或预先拣选的时间含义
  choice: 译作“已经选定了”，不加入“预先”
  alternative: 译作“预先拣选了”或“委任了”
  rationale: 该词在此重点是为随后列出的目的选定保罗；原句不足以要求译文突出时间上的预先性，避免借翻译解决相关神学问题。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“祖先的上帝”自然传达以色列共同的历史信仰；“那位义者”保留称号感；全句依照原文三个不定式的并列结构，用“要你……看见……并听见……”清楚呈现使命内容。脚注标记紧跟各自所解释的词语。
