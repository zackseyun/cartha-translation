id: ACT.22.16
reference: Acts 22:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ νῦν τί μέλλεις; ἀναστὰς βάπτισαι καὶ ἀπόλουσαι τὰς ἁμαρτίας σου ἐπικαλεσάμενος τὸ ὄνομα ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/016.yaml
  text: And now why are you waiting? Rise[a], be baptized, and wash away your sins[b], calling on his name.
translation:
  language: zh_hans
  text: 现在你还等什么呢？[a]起来，受洗，洗去你的罪，呼求他的名。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“你为什么还耽搁呢？”
    reason: lexical_alternative
  - marker: b
    text: “呼求他的名”也可更明确地理解为“借着呼求他的名”或“在呼求他的名时”；原文没有完全限定它与“受洗、洗去你的罪”的关系。
    reason: alternative_reading
lexical_decisions:
- source_word: τί μέλλεις
  choice: 你还等什么呢
  rationale: 这里的问句在语境中是催促对方不要再耽搁，并非询问将来的打算；这一表达自然地传达了责问和催促的语气。
- source_word: ἀναστὰς
  choice: 起来
  rationale: 这个不定过去时分词伴随后面的命令，在汉语中用命令式“起来”最自然，也保留了紧迫语气。
- source_word: βάπτισαι
  choice: 受洗
  rationale: 这个中间语态命令式在现代汉语中自然译为“受洗”，既简洁，也不额外说明施洗者。
- source_word: ἀπόλουσαι
  choice: 洗去
  rationale: 该词表示洗掉、除去；与“你的罪”搭配时，“洗去”直接保留原文的洗涤意象。
- source_word: τὰς ἁμαρτίας σου
  choice: 你的罪
  rationale: 直译保留ἁμαρτία的一般新约含义，不扩展为“罪行”或加入解释。
- source_word: ἐπικαλεσάμενος
  choice: 呼求
  rationale: 原文分词可表示伴随情形或方式。汉语以并列而不加“借着”“同时”等连接词，尽量保留它与前述命令之间关系的开放性。
- source_word: τὸ ὄνομα αὐτοῦ
  choice: 他的名
  rationale: 原文使用代词αὐτοῦ，而没有在本节明说“主”或“耶稣”；译文照样使用代词，所指由上下文判定。
theological_decisions:
- issue: 洗礼、洗去罪与呼求他的名三者之间的关系
  choice: 保留原文中两个命令式与一个分词的次序，不在正文中明定“洗去罪”究竟以洗礼、呼求，还是整组行动为方式。
  alternative: 可将“呼求他的名”明确译为“借着呼求他的名”，或将洗礼明确表述为洗去罪的方式。
  rationale: 原文语法容许对分词与两个命令之间的关系作不同理解，而这一关系涉及有争议的神学解释。译文不应以连接词预先解决原文保留的张力。
translation_notes:
  register: 采用现代、自然而庄重的标准普通话。“你还等什么呢”传达催促语气；连续使用“起来，受洗，洗去……，呼求……”保持原文简短有力的节奏，并避免用解释性连接词消除语法与神学上的张力。
