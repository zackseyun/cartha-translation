  text: ἀπεκρίθη ⸀δὲ ὁ χιλίαρχος· Ἐγὼ πολλοῦ κεφαλαίου τὴν πολιτείαν ταύτην ἐκτησάμην. ὁ δὲ Παῦλος ἔφη· Ἐγὼ δὲ καὶ γεγέννημαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/028.yaml
  text: But the tribune answered[a], “I acquired this citizenship for a large sum.” But Paul said[b], “But I was even born with it.”
translation:
  language: zh_hans
  text: 千夫长回答说：“我用一大笔钱取得了这公民身份。”[a] 保罗却说：“我生来就有这公民身份。”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我是用一大笔钱取得这公民身份的。”
    reason: 保留πολλοῦ κεφαλαίου表示为取得该身份所付高额代价的另一种自然表达。
  - marker: b
    text: 直译：“但我也／甚至已经出生了。”原文未明说“公民身份”，须由上下文补足。
    reason: 说明γεγέννημαι的完成时形式、καί可带的强调意味，以及原文省略的对象。
lexical_decisions:
- source_word: χιλίαρχος
  choice: 千夫长
  rationale: 这是罗马军队中统领约一千人的军官称谓；“千夫长”既保留历史职衔，也为中文圣经读者所熟悉。
- source_word: πολλοῦ κεφαλαίου
  choice: 花了一大笔钱
  rationale: 该属格短语表示付出巨额钱财；这样表达符合现代汉语，也自然地与“取得”衔接。
- source_word: πολιτείαν
  choice: 公民身份
  rationale: 这里指罗马公民的法律身份，而非一般的政治生活或品行。
- source_word: ἐκτησάμην
  choice: 取得
  rationale: 该中动词表示为自己获得；“取得”保留其宽泛含义，没有把动词本身过度具体化为“买得”，而钱财这一途径已由上文说明。
- source_word: καὶ γεγέννημαι
  choice: 而我是生来就有的
  rationale: 完成时被动态字面为“我甚至是被生下来的”，上下文省略了公民身份；中文以“生来就有”自然表达凭出生即拥有该身份，并体现强调性的καί。
- source_word: δέ
  choice: 却／而
  rationale: 两个δέ在对话中兼有承接和轻微转折作用；首处不必机械译出，第二处用“却说”，保留保罗与千夫长取得身份方式的对比。
- source_word: ἔφη
  choice: 说
  rationale: 采用不额外增加语气强度的普通言说动词。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语自然的叙事语言。“千夫长”保留历史职衔；保罗的话按中文习惯补出“有的”，但通过脚注交代原文省略。
