id: ACT.22.10
reference: Acts 22:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἶπον δέ· Τί ποιήσω, κύριε; ὁ δὲ κύριος εἶπεν πρός με· Ἀναστὰς πορεύου εἰς Δαμασκόν, κἀκεῖ σοι λαληθήσεται περὶ πάντων ὧν τέτακταί σοι ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/010.yaml
  text: Then I said[a], ‘What should I do, Lord?’ And the Lord said to me, ‘Get up and go into Damascus[b], and there you will be told about everything that has been appointed for you to do.’
translation:
  language: zh_hans
  text: 我说：“主啊，我该做什么[a]？”主对我说：“起来，进大马士革去。在那里，有人会把一切指定要你做的事[b]告诉你。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我当做什么？”
    reason: lexical_alternative
  - marker: b
    text: 或译：“安排你去做的事。”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί ποιήσω
  choice: 我该做什么
  rationale: 这是商议性的简单过去时虚拟语气，表达保罗寻求下一步应当采取的行动；“我该做什么”符合现代汉语，也保留求指引的意味。
- source_word: κύριε / ὁ ... κύριος
  choice: 主啊 / 主
  rationale: 在大马士革路上的叙事语境中，这一称呼指向耶稣；译作“主”既符合《使徒行传》的用法，也不削弱其基督论分量。
- source_word: Ἀναστὰς
  choice: 起来
  rationale: 该分词与“去”构成连续命令；“起来”自然地表达先起身、再前往。
- source_word: πορεύου εἰς Δαμασκόν
  choice: 进大马士革去
  rationale: 既表达πορεύομαι的前往动作，也体现εἰς所带出的进入城中的方向感。
- source_word: κἀκεῖ
  choice: 在那里
  rationale: 直接表达καὶ ἐκεῖ所指的地点和后续次序，现代汉语自然清楚。
- source_word: λαληθήσεται
  choice: 有人会……告诉你
  rationale: 这是带与格σοι的将来时被动形式。汉语用不定施事者“有人会……告诉你”自然呈现被动含义，同时不擅自指明说话者身份。
- source_word: περὶ πάντων
  choice: 把一切……事
  rationale: περί加属格引出告知的内容；结合关系从句，译为“一切……事”简洁自然。
- source_word: τέτακταί σοι ποιῆσαι
  choice: 指定要你做的事
  rationale: τέτακται是τάσσω的完成时被动，表示这些事已经被设定或指定，并持续有效；“指定要你做”保留被动和托付意味，又不额外强化为某一特定预定论体系。
theological_decisions:
- issue: τέτακταί所表达的神圣安排与使命
  choice: 指定要你做的事
  alternative: 安排你去做的事；吩咐你做的事
  rationale: “指定”保留保罗将要执行之事已经被设定的含义，但不把经文扩展为更强的系统神学命题；“吩咐”会偏重命令，“安排”则较弱化τάσσω的指定意味。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留直接引语和“主”的重复称谓；用“有人会……告诉你”自然表达希腊文未明说施事者的被动句，不擅自补明是谁传达。
