base_translation:
  language: en
  yaml_path: translation/nt/acts/022/015.yaml
  text: For you will be a witness for him to all people of what you have seen and heard[a][b].
translation:
  language: zh_hans
  text: 因为你要为他[b]向所有人[a]见证你所看见和所听见的事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“向所有男子”；希腊语使用阳性复数形式，在这里泛指人类，并不限于男性。
    reason: lexical_alternative
  - marker: b
    text: 或译“向他”。这里的希腊语与格可以有彼此相近的不同理解。
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 在这里引出对前文使命的解释；“因为”自然地保留了其说明理由的作用。
- source_word: ἔσῃ μάρτυς
  choice: 你将……作见证
  rationale: 原文直译为“你将是见证人”。汉语用“作见证”更自然，也能准确表达受命见证的意义。
- source_word: αὐτῷ
  choice: 为他
  rationale: 与“作见证”连用时，可表示保罗代表他、为他作见证；同时用脚注保留与格也可理解为“向他”的可能性。
- source_word: πρὸς πάντας ἀνθρώπους
  choice: 向所有人
  rationale: πρός表示见证所面向的对象；ἄνθρωποι在此泛指人，不限于男性。
- source_word: ὧν ἑώρακας καὶ ἤκουσας
  choice: 述说你所看见、所听见的
  rationale: 补出“述说”使汉语句法完整，并把所见所闻明确呈现为见证的内容；“所看见”也保留了完成时所强调的既有经历。
theological_decisions:
- issue: αὐτῷ所指及其与“见证”的关系
  choice: 译作“为他”，理解为保罗要为主耶稣作见证
  alternative: 译作“向他”，较直接保留希腊语与格形式
  rationale: 上下文是亚拿尼亚转述保罗从主所领受的使命。“为他”在现代汉语中更自然地表达代表他、为他作见证，同时脚注保留原文与格的另一种近义理解，不额外扩展教义含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“作见证，述说……”避免生硬重复，同时保留见证使命及其内容。脚注标记紧随各自涉及的词语。
