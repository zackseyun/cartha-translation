  text: καὶ ἰδεῖν αὐτὸν λέγοντά μοι· Σπεῦσον καὶ ἔξελθε ἐν τάχει ἐξ Ἰερουσαλήμ, διότι οὐ παραδέξονταί ⸀σου μαρτυρίαν περὶ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/018.yaml
  text: and I saw him saying to me[a], ‘Hurry and get out of Jerusalem quickly, because they will not accept your testimony about me.’
translation:
  language: zh_hans
  text: 我看见他对我说：“赶快，尽快离开耶路撒冷，因为他们不会接受[a]你关于我所作的见证。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “接受”也可译作“领受”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδεῖν
  choice: 我又看见
  rationale: 该不定式在叙事结构中承接前文的异象叙述；汉语用限定动词“我又看见”自然地表达这一延续关系。
- source_word: αὐτὸν λέγοντά μοι
  choice: 他对我说
  rationale: 保留代词“他”，不在本节中增补“主”或“耶稣”；“对我说”自然表达分词结构及说话对象。
- source_word: Σπεῦσον καὶ ἔξελθε ἐν τάχει
  choice: 赶快，迅速离开
  rationale: 原文以命令“赶快”和短语“迅速”叠加强调紧迫性；译文保留这种双重催促，同时避免古雅措辞。
- source_word: ἐξ Ἰερουσαλήμ
  choice: 离开耶路撒冷
  rationale: ἐξ表示从城中出去；现代汉语以“离开耶路撒冷”清楚自然地传达这一方向。
- source_word: οὐ παραδέξονταί
  choice: 他们不会接受
  rationale: παραδέχομαι在此指接纳、认可某人的见证；“接受”适合现代汉语语境，也保留“领受”这一词义可能，列于脚注。
- source_word: σου μαρτυρίαν περὶ ἐμοῦ
  choice: 你为我作的见证
  rationale: περὶ ἐμοῦ表示见证所关乎的对象；“为我作的见证”在汉语中自然，并保留见证的宣告意味。
theological_decisions:
- issue: 异象中“他”的所指
  choice: 正文保留“他”
  alternative: 明确译为“主”或“耶稣”
  rationale: 上下文能够辨明说话者，但本节希腊文使用代词；保留代词可避免在正文中加入原文没有的称谓。
- issue: μαρτυρία的表达
  choice: 见证
  alternative: 证言
  rationale: “见证”既能涵盖保罗关于耶稣的宣告，也保留该词可能具有的作证意味；“证言”容易使语域过度局限于法庭。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留原文“赶快／迅速”的双重紧迫感，并在正文中维持代词所指由上下文辨明的表达。
