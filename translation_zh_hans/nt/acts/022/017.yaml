  text: Ἐγένετο δέ μοι ὑποστρέψαντι εἰς Ἰερουσαλὴμ καὶ προσευχομένου μου ἐν τῷ ἱερῷ γενέσθαι με ἐν ἐκστάσει
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/017.yaml
  text: And it happened to me that[a], after I had returned to Jerusalem and while I was praying in the temple, I fell into a trance[b],
translation:
  language: zh_hans
  text: 后来，我回到耶路撒冷后，在圣殿[a]里祷告时，进入了恍惚状态[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文所用的词指整个圣殿建筑群或圣殿范围，不专指内殿。
    reason: cultural_note
  - marker: b
    text: 或译：“出神了。”原文表达进入或陷入“出神／恍惚”的状态，指一种特殊的意识状态。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δέ μοι
  choice: 后来，我……
  rationale: 这是推进叙事并引出保罗亲身经历的表达；现代汉语不必机械译作“有一件事发生在我身上”，用“后来”衔接上下文更自然。
- source_word: ὑποστρέψαντι εἰς Ἰερουσαλὴμ
  choice: 我回到耶路撒冷
  rationale: 不定过去时分词所指动作先于主要事件；汉语借语序即可清楚表达先回去、后祷告并进入异象状态的时序。
- source_word: καὶ προσευχομένου μου
  choice: 在……祷告的时候
  rationale: 属格独立结构表示与主要事件同时发生的持续动作。
- source_word: ἐν τῷ ἱερῷ
  choice: 在圣殿区
  rationale: ἱερόν通常指整个圣殿建筑群或范围，并非特指内殿；“圣殿区”在正文中兼顾准确与可懂性。
- source_word: γενέσθαι με ἐν ἐκστάσει
  choice: 进入了异象状态
  rationale: γίνομαι与ἐν ἐκστάσει组合表示进入某种状态；ἔκστασις在本叙事中指伴随异象的特殊意识状态。此译法避免现代“出神”可能带来的走神含义，也不额外解释其机制。
theological_decisions:
- issue: 保罗所经历的ἐκστάσει的性质
  choice: 异象状态
  alternative: 出神；恍惚；进入忘我状态
  rationale: 经文本节确认保罗在祷告中进入一种与异象相关的特殊状态，却未界定其心理或生理机制。“异象状态”传达叙事含义，同时不作超出原文的神学判断。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“后来”承担叙事转折功能；用“圣殿区”明确ἱερόν的范围。句末保留逗号，因为本节语法和叙事内容延续至下一节。
