  text: ἐκέλευσεν ⸂ὁ χιλίαρχος εἰσάγεσθαι αὐτὸν⸃ εἰς τὴν παρεμβολήν, ⸀εἴπας μάστιξιν ἀνετάζεσθαι αὐτὸν ἵνα ἐπιγνῷ δι’ ἣν αἰτίαν οὕτως ἐπεφώνουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/024.yaml
  text: The tribune ordered him to be brought into the barracks[a], saying that he should be examined by scourging[b], so that he might find out for what reason they were shouting against him like this.
translation:
  language: zh_hans
  text: 千夫长命令把他带进营房[a]，并吩咐用鞭子拷问他[b]，好查明众人为什么这样冲着他喊叫。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“军营”或“堡垒”。这里指耶路撒冷的罗马驻军营区。
    reason: cultural_note
  - marker: b
    text: 也可译作“用鞭子审讯他”。希腊原文把审问与明确的鞭打手段结合在一起。
    reason: lexical_alternative
lexical_decisions:
- source_word: χιλίαρχος
  choice: 千夫长
  rationale: 这是当时罗马军队中的军官称谓；“千夫长”是中文圣经语境中简明且具有历史色彩的对应词。
- source_word: παρεμβολή
  choice: 营房
  rationale: 本词可指军营或驻军处；在耶路撒冷的具体语境中，指罗马军队驻扎的营房区域。
- source_word: εἰσάγεσθαι αὐτόν
  choice: 把他带进
  rationale: 保留被动含义，即由他人将他带到里面；中文用兼语式表达更自然。
- source_word: εἴπας
  choice: 吩咐人
  rationale: 该分词引出千夫长进一步下达的命令；译为“吩咐人”可使中文施事关系清楚。
- source_word: μάστιξιν
  choice: 用鞭打
  rationale: 复数与格表示审问所采用的手段，指严厉鞭打；“用鞭打”明确保留工具或方式含义。
- source_word: ἀνετάζεσθαι
  choice: 审问
  rationale: 本词表示查问、审讯；与“用鞭打”连用，呈现以肉刑逼供的场景，而不把肉刑含义塞入动词本身。
- source_word: ἐπιγνῷ
  choice: 查明
  rationale: 目的从句表达千夫长想要确切弄清缘由；“查明”符合调查语境。
- source_word: δι’ ἣν αἰτίαν
  choice: 为什么
  rationale: 原文询问原因；译为“为什么”自然明白，并避免擅自限定为正式的法律控罪。
- source_word: οὕτως
  choice: 这样
  rationale: 保留原文对当时喊叫方式或强烈程度的指示意味。
- source_word: ἐπεφώνουν αὐτῷ
  choice: 冲着他喊叫
  rationale: 未完成时体现持续喊叫；“冲着他”在中文中传达针对他的敌对喊声，同时不额外补入具体指控内容。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事用语。“千夫长”保留罗马军职的历史色彩；“用鞭打来审问”直接呈现原文所述的强制审讯方式。脚注标记已按正文所对应的词语重新匹配：营房为[a]，鞭打审问为[b]。
