  text: ὡς δὲ ⸀προέτειναν αὐτὸν τοῖς ἱμᾶσιν εἶπεν πρὸς τὸν ἑστῶτα ἑκατόνταρχον ὁ Παῦλος· Εἰ ἄνθρωπον Ῥωμαῖον καὶ ἀκατάκριτον ἔξεστιν ὑμῖν μαστίζειν;
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/025.yaml
  text: But when they had stretched him out with the straps[a], Paul said to the centurion standing there, “Is it lawful for you to flog a Roman citizen who is uncondemned?”
translation:
  language: zh_hans
  text: 他们用皮条把保罗拉开时，保罗对站在旁边的百夫长说：“鞭打一个未经定罪的罗马公民[a]，对你们来说是否合法？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“罗马人”；在这里的法律语境中，所指的是罗马公民身份。
    reason: 说明原文“罗马人”的字面措辞，以及该措辞在本句法律语境中的所指。
lexical_decisions:
- source_word: προέτειναν αὐτὸν τοῖς ἱμᾶσιν
  choice: 用皮带把保罗拉直绑好
  rationale: προτείνω 描写为施行鞭打而把人拉直、伸展开，ἱμᾶσιν 指皮带。此译既呈现拉直身体的动作，也自然表达皮带用于固定人的场景。
- source_word: τὸν ἑστῶτα ἑκατόνταρχον
  choice: 站在旁边的百夫长
  rationale: ἑστῶτα 表示当时站在近旁；ἑκατόνταρχος 是罗马军队的百夫长。
- source_word: ἄνθρωπον Ῥωμαῖον
  choice: 罗马公民
  rationale: 希腊文形式上是“罗马人”，但在保罗质问是否合法的语境中，焦点是其受法律保护的罗马公民身份；脚注保留原文较直译的表达。
- source_word: ἀκατάκριτον
  choice: 没有定罪的
  rationale: 该词指未经司法判决而被定罪；此译简明，并保留法律意味。
- source_word: ἔξεστιν ὑμῖν
  choice: 你们也可以……吗
  rationale: ἔξεστιν 在此询问法律上是否许可。汉语反问中的“可以”自然承载合法许可之意，“也”凸显即使对方是未定罪的罗马公民，是否仍可如此行。
- source_word: μαστίζειν
  choice: 鞭打
  rationale: μαστίζω 指严厉地用鞭抽打；“鞭打”是现代汉语中清楚、庄重且力度适当的表达。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“拉直绑好”具体呈现受刑前的动作；保罗的话译为自然的汉语反问，同时保留其法律诉求。
