source:
  edition: SBLGNT
  text: Τῇ δὲ ἐπαύριον βουλόμενος γνῶναι τὸ ἀσφαλὲς τὸ τί κατηγορεῖται ⸀ὑπὸ τῶν Ἰουδαίων ἔλυσεν ⸀αὐτόν, καὶ ἐκέλευσεν ⸀συνελθεῖν τοὺς ἀρχιερεῖς καὶ ⸀πᾶν τὸ ⸀συνέδριον, καὶ καταγαγὼν τὸν Παῦλον ἔστησεν εἰς αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/030.yaml
  text: But on the next day[a], wanting to know for certain what he was being accused of by the Jews, he released him and ordered the chief priests and the whole council to assemble; and bringing Paul down[b], he set him before them.
translation:
  language: zh_hans
  text: 第二天，千夫长想确切查明保罗受犹太人[a]控告的事，就解开了他，并命令祭司长和公议会[b]全体成员集合；他又把保罗带下来，叫他站在他们面前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“犹太人”；按本节语境，是指控告保罗的那些犹太人，并非不加区别地指所有犹太人。也可译作“犹太领袖”或“犹太地人”。
    reason: lexical_alternative
  - marker: b
    text: “公议会”指耶路撒冷的犹太最高议政和审判机构，又称“犹太公会”。
    reason: cultural_note
lexical_decisions:
- source_word: Τῇ δὲ ἐπαύριον
  choice: 第二天
  rationale: 自然表达时间推进；δέ在此主要承接并转换叙事场景，无须生硬译出。
- source_word: βουλόμενος γνῶναι τὸ ἀσφαλές
  choice: 想确切知道
  rationale: 保留βουλόμενος所表达的意愿，并以“确切”传达τὸ ἀσφαλές所指的可靠、确定事实。
- source_word: τὸ τί κατηγορεῖται
  choice: 控告保罗什么
  rationale: 以自然的汉语主动结构表达希腊语被动式，同时保留所要查明的是控告内容。
- source_word: ὑπὸ τῶν Ἰουδαίων
  choice: 犹太人
  rationale: 按原文保留Ἰουδαῖοι的基本称谓，不在正文中擅自缩窄为“犹太领袖”；脚注说明语境所指。
- source_word: ἔλυσεν αὐτόν
  choice: 解开他
  rationale: λύω在上下文中首先指解除保罗身上的捆绑；“解开”比笼统的“释放”更能保留具体动作，也不暗示他已脱离罗马拘押。
- source_word: ἐκέλευσεν συνελθεῖν
  choice: 命令……集合
  rationale: 准确表达κελεύω的权威命令语气和 συνελθεῖν 的聚集含义。
- source_word: τοὺς ἀρχιερεῖς
  choice: 祭司长
  rationale: 采用现代中文圣经语境中通行且准确的称谓，指主要的祭司领袖。
- source_word: πᾶν τὸ συνέδριον
  choice: 全公议会
  rationale: “公议会”明确指耶路撒冷的犹太议政审判机构，并保留πᾶν“全体”的含义。
- source_word: καταγαγὼν τὸν Παῦλον
  choice: 把保罗带下去
  rationale: 保留κατά复合动词所表达的向下移动，可能是从营楼带到会议地点。
- source_word: ἔστησεν εἰς αὐτούς
  choice: 叫他站在他们面前
  rationale: 清楚表达使役意义，即千夫长安排保罗站到议会众人面前。
theological_decisions:
- issue: 使徒行传中Ἰουδαίων的译法
  choice: 犹太人
  alternative: 犹太领袖；犹太地人
  rationale: 原文用一般族群称谓，但本节语境针对的是控告保罗的特定群体，并非不加区别地指所有犹太人。正文保留原词范围，脚注交代语境，以免在正文中提前消解其可能范围。
- issue: ἔλυσεν αὐτόν所指的解除程度
  choice: 解开他
  alternative: 释放他
  rationale: 前文涉及保罗被捆绑，而后文显示他仍由千夫长带领和控制。“解开”保留具体动作，避免让读者误以为保罗已获完全自由。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。为避免连续分词结构造成欧化长句，将原文整理为两个汉语句子；补出“千夫长”和“保罗”以明确代词所指。脚注标记按其实际说明对象放置，而非沿用咨询层中错位的标记位置。
