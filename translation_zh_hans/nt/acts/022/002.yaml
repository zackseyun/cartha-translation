  text: Ἀκούσαντες δὲ ὅτι τῇ Ἑβραΐδι διαλέκτῳ προσεφώνει αὐτοῖς μᾶλλον παρέσχον ἡσυχίαν. καὶ φησίν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/002.yaml
  text: 'But when they heard that he was addressing them in the Hebrew language[a], they became even more quiet. And he said:'
translation:
  language: zh_hans
  text: 众人听见他用希伯来语[a]向他们讲话，就越发安静了。保罗说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“亚兰语”。希腊原文作“希伯来语”；在这里可能指犹太地区通行的闪族语言，常被理解为亚兰语。
    reason: 说明原文称谓与其可能实际所指之间的歧义。
lexical_decisions:
- source_word: Ἀκούσαντες δὲ
  choice: 众人听见……就
  rationale: 不定过去时分词交代主句发生的情境和原因；用“听见……就”自然呈现时间承接。δὲ在此是轻微的叙事转折，汉语无须另加“但是”。
- source_word: τῇ Ἑβραΐδι διαλέκτῳ
  choice: 用希伯来语
  rationale: 按希腊文本保留“希伯来”的明确措辞；此表达在该语境中也可能泛指犹太地区通行的闪语，即亚兰语，故以脚注说明。
- source_word: προσεφώνει αὐτοῖς
  choice: 向他们讲话
  rationale: 未完成时表示正在持续、且以听众为对象的讲话；“向他们讲话”现代、自然，并保留定向发言之意。
- source_word: μᾶλλον παρέσχον ἡσυχίαν
  choice: 就越发安静了
  rationale: 原文习语直译近于“表现出更多安静”；“越发安静”自然表达比较和加强的语气。
- source_word: καὶ φησίν
  choice: 保罗说：
  rationale: 将叙事中的历史现在时按现代汉语习惯译为过去叙述；依据上下文明示说话者为保罗，使引语起始清楚。
theological_decisions:
- issue: “希伯来语”的具体所指
  choice: 正文保留“希伯来语”
  alternative: 直接译作“亚兰语”
  rationale: Ἑβραΐδι明确使用“希伯来”这一名称，但在当时语境中可能指亚兰语。正文不替原文消除这一历史语言学上的张力，以脚注交代可能所指。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“越发安静”简洁保留程度递增；末句用“保罗说”衔接下文长篇讲话，避免汉语中单独使用“他说”可能产生的指代含混。
