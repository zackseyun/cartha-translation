id: ACT.22.3
reference: Acts 22:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ⸀Ἐγώ εἰμι ἀνὴρ Ἰουδαῖος, γεγεννημένος ἐν Ταρσῷ τῆς Κιλικίας, ἀνατεθραμμένος δὲ ἐν τῇ πόλει ταύτῃ παρὰ τοὺς πόδας Γαμαλιήλ, πεπαιδευμένος κατὰ ἀκρίβειαν τοῦ πατρῴου νόμου, ζηλωτὴς ὑπάρχων τοῦ θεοῦ καθὼς πάντες ὑμεῖς ἐστε σήμερον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/003.yaml
  text: I am a Jewish man[a], born in Tarsus of Cilicia, but brought up in this city at the feet of Gamaliel, educated according to the strictness of the law of our fathers[b], being zealous for God just as all of you are today.
translation:
  language: zh_hans
  text: “我是犹太人，生在基利家的大数，却在这座城里长大，在迦玛列脚前受教[a]，严格按照祖传的律法[b]接受训练。我对神满腔热忱，正如你们众人今天一样。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在迦玛列脚前”是当时表示跟随老师学习、接受教导的说法。
    reason: cultural_note
  - marker: b
    text: 也可译作“先祖的律法”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ Ἰουδαῖος
  choice: 我是犹太人
  rationale: 汉语“犹太人”在此已自然表达保罗的身份；若译为“犹太男子”虽更逐字，却显得生硬，并无助于本句重点。
- source_word: γεγεννημένος ἐν Ταρσῷ τῆς Κιλικίας
  choice: 生在基利家的大数
  rationale: 简洁保留出生地及其所属地区；“基利家的大数”符合汉语地名表达习惯。
- source_word: ἀνατεθραμμένος δὲ ἐν τῇ πόλει ταύτῃ
  choice: 却在这座城里长大
  rationale: ἀνατρέφω在此指养育、成长；“却”体现出生于大数与成长于耶路撒冷之间的对照。
- source_word: παρὰ τοὺς πόδας Γαμαλιήλ
  choice: 在迦玛列脚前受教
  rationale: 保留原文鲜明的师徒图像，同时补出汉语所需的“受教”，使其意义清楚自然。
- source_word: πεπαιδευμένος κατὰ ἀκρίβειαν
  choice: 严格……接受训练
  rationale: πεπαιδευμένος指系统性的教导和塑造；副词化的“严格”自然传达ἀκρίβεια所含的严谨、精确之意。
- source_word: τοῦ πατρῴου νόμου
  choice: 祖传的律法
  rationale: πατρῷος指从先祖承袭而来；“祖传的律法”不额外补入原文没有明说的“我们”，同时保留共同传统的语境。
- source_word: ζηλωτὴς ὑπάρχων τοῦ θεοῦ
  choice: 我对神满腔热忱
  rationale: 表达ζηλωτής所指强烈而持续的热忱，避免“奋锐党人”等可能引入政治派别含义的说法。
- source_word: καθὼς πάντες ὑμεῖς ἐστε σήμερον
  choice: 正如你们众人今天一样
  rationale: 保留保罗与听众之间的直接比较，也使“今天”明确修饰听众当前表现出的热忱。
theological_decisions:
- issue: 如何表达πατρῴου νόμου所指的共同犹太传统
  choice: 祖传的律法
  alternative: 我们祖先的律法
  rationale: “祖传的律法”准确表达承袭自先祖的律法传统，也保留希腊文形容词本身未明确标出的领属关系；共同身份可由说话语境体现。
- issue: 是否把ζηλωτής理解为特定政治宗教派别身份
  choice: 对神满腔热忱
  alternative: 是神的奋锐党人
  rationale: 此处重点是对神的热忱；采用一般描述可避免把后世或技术性的派别含义带入经文。
- issue: 是否保留“在迦玛列脚前”的字面图像
  choice: 在迦玛列脚前受教
  alternative: 师从迦玛列
  rationale: 字面图像反映古代门徒在教师座前学习的场景；加上“受教”既保留图像，又让现代读者立即明白其含义。
translation_notes:
  register: 采用现代、庄重而口语可懂的演说语体。保留保罗向同胞陈述身份时的直接语气，并以“却”呈现出生地与成长地的对照；脚注标记均置于相关短语之后。
