base_translation:
  language: en
  yaml_path: translation/nt/acts/022/001.yaml
  text: Men[a], brothers and fathers, hear now my defense to you.
translation:
  language: zh_hans
  text: 诸位弟兄和父老，请听我现在向你们所作的申辩。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“请听我现今向你们所作的辩护。”
    reason: “现今”可表达νυνί的即时性；“辩护”是ἀπολογία在此处的可行近义译法。
lexical_decisions:
- source_word: Ἄνδρες ἀδελφοὶ καὶ πατέρες
  choice: 诸位弟兄和父老
  rationale: 这是对男性同胞及受尊敬长者的郑重称呼。“诸位”自然承载Ἄνδρες在呼语中的直接称谓作用；“弟兄”和“父老”分别保留ἀδελφοί与πατέρες的亲族性、敬重性表达，同时避免生硬地译成“男人们”。
- source_word: ἀκούσατέ
  choice: 请听
  rationale: 该词是复数命令式；加“请”符合现代汉语公开陈述中的郑重请求语气，并未削弱其呼吁听取的力量。
- source_word: μου … ἀπολογίας
  choice: 我……所作的申辩
  rationale: ἀπολογία指针对指控所作的辩护或答辩，不是表示歉意。“申辩”适合此处正式公开陈述的语境；“我所作的”体现μου与名词之间的所属关系。
- source_word: πρὸς ὑμᾶς
  choice: 向你们
  rationale: 保留申辩面向听众、对听众而发的关系，现代汉语自然清楚。
- source_word: νυνὶ
  choice: 现在
  rationale: 准确表达话语发生于当下的即时性。
theological_decisions: []
