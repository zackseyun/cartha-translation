base_translation:
  language: en
  yaml_path: translation/nt/acts/022/027.yaml
  text: So the tribune came up and said to him[a], “Tell me, are you a Roman?” And he said[b], “Yes.”
translation:
  language: zh_hans
  text: 于是，千夫长[a]上前，对他说：“告诉我，你是罗马人[b]吗？”他回答：“是的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“军队指挥官”。希腊词 χιλίαρχος 在这里指一位罗马军官；传统上常译作“千夫长”。
    reason: lexical_alternative
  - marker: b
    text: 这里的“罗马人”是指在法律上拥有罗马公民身份的人；上下文清楚表明了这一点。
    reason: cultural_note
lexical_decisions:
- source_word: προσελθὼν
  choice: 走到他跟前
  rationale: 该不定过去时分词表示千夫长先走近保罗，然后开口；“走到他跟前”自然地保留了这一动作和先后关系。
- source_word: δὲ
  choice: 于是
  rationale: 此处主要推进叙事，并非表达强烈转折；“于是”符合现代汉语叙事习惯。后一个 δὲ 借助“他回答”自然体现，无须机械另译。
- source_word: χιλίαρχος
  choice: 千夫长
  rationale: 该词在本处指统领罗马军队一个营级单位的军官；“千夫长”简洁并保留历史称谓，脚注说明其职务性质及可选译法。
- source_word: εἶπεν αὐτῷ
  choice: 对他说
  rationale: 保留了言说动作和间接宾语 αὐτῷ。
- source_word: Λέγε μοι
  choice: 告诉我
  rationale: 命令式动词与第一人称间接宾语在现代汉语中自然译作“告诉我”，保留直接盘问的语气。
- source_word: σὺ
  choice: 你
  rationale: 希腊文明确使用第二人称代词，带有一定强调；汉语问句中的“你”已能自然体现其焦点，无须生硬扩写为“你本人”。
- source_word: Ῥωμαῖος
  choice: 罗马人
  rationale: 该形容词在这里名词化使用；上下文表明所问的是法律意义上的罗马公民身份。正文保留简洁的“罗马人”，并以脚注澄清。
- source_word: Ναί
  choice: 是的
  rationale: 直接对应简短的肯定回答，不增添原文没有的内容。
