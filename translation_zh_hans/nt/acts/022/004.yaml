  text: ὃς ταύτην τὴν ὁδὸν ἐδίωξα ἄχρι θανάτου, δεσμεύων καὶ παραδιδοὺς εἰς φυλακὰς ἄνδρας τε καὶ γυναῖκας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/004.yaml
  text: I persecuted this Way to the death[a], binding and delivering both men and women into prisons[b],
translation:
  language: zh_hans
  text: 我曾迫害这道路[a]，直到死地[b]，把男人和女人都捆绑起来，交到监牢里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这道路”直译作“这条路”。在《使徒行传》中，这个说法常指基督信仰及其群体。
    reason: lexical_alternative
  - marker: b
    text: 直译“直到死亡”。这句话指迫害达到极端、致命的程度，但未说明保罗是否亲自杀人，或死亡如何发生。
    reason: lexical_alternative
lexical_decisions:
- source_word: ταύτην τὴν ὁδὸν
  choice: 这道路
  rationale: ὁδός本义为“道路”，在《使徒行传》中又常作为基督信仰及其群体的称谓。“这道路”既保留原文意象，也让上下文中的专称意味可被读者辨认。
- source_word: ἐδίωξα
  choice: 我曾迫害
  rationale: 此处指敌意追捕和压迫信徒，“迫害”准确表达语境中的负面含义。
- source_word: ἄχρι θανάτου
  choice: 直到置人于死地
  rationale: 该短语表示迫害达到死亡的极端程度；这一译法保留其致命性质，同时不武断断言保罗亲手杀人。
- source_word: δεσμεύων
  choice: 捆绑起来
  rationale: 保留δέω所指的实际捆绑动作，比单译“逮捕”更贴近原文的具体形象。
- source_word: παραδιδοὺς εἰς φυλακὰς
  choice: 交进监牢
  rationale: 表达把人移交拘禁的动作；“交进”反映παραδίδωμι与εἰς所含的交付和进入之意。汉语用集合性单数“监牢”更自然，无须机械复制希腊语复数。
- source_word: ἄνδρας τε καὶ γυναῖκας
  choice: 无论男女
  rationale: 自然地保留原文明确涵盖男人和女人的强调。
theological_decisions:
- issue: 是否把ἡ ὁδός译作普通名词，还是基督信仰运动的准专称
  choice: 译作“这道路”并加注说明其专称用法
  alternative: “这条路”或“这个信仰群体”
  rationale: 《使徒行传》多次以“道路”指基督信仰及跟从者。正文保留字面意象，脚注交代其语境功能，避免直接替换成解释性更强的“基督教”。
- issue: ἄχρι θανάτου是否断言保罗亲自杀人
  choice: 表达迫害严重到使人死亡，但不明确断言他亲手行杀戮
  alternative: “至死不休”或“直到死亡”
  rationale: 原文强调迫害所达到的致命程度，却没有在本句具体说明保罗以何种方式导致死亡；译文应保留这一界限。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“这道路”略带标记性，以保留原文作为群体称谓的用法；分号和前置的“无论男女”使希腊语分词结构在中文中清晰自然。
