  text: ἐπιλαβόμενος δὲ τῆς χειρὸς αὐτοῦ ὁ χιλίαρχος καὶ ἀναχωρήσας κατ’ ἰδίαν ἐπυνθάνετο· Τί ἐστιν ὃ ἔχεις ἀπαγγεῖλαί μοι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/019.yaml
  text: So the commander took him by the hand and[a], drawing aside in private, began asking[b], “What is it that you have to report to me?”
translation:
  language: zh_hans
  text: 于是，千夫长握住他的手，私下走到一旁，问他：“你有什么事要向我报告？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιλαβόμενος ... τῆς χειρὸς αὐτοῦ
  choice: 拉着他的手
  rationale: 该分词与手的属格连用，表示抓住或拉住某人的手。“拉着他的手”自然保留具体动作，又不暗示粗暴用力。
- source_word: δὲ
  choice: 于是
  rationale: δέ在这里推动叙事向前发展；“于是”符合现代汉语叙事衔接，不赋予过强的因果意味。
- source_word: ὁ χιλίαρχος
  choice: 千夫长
  rationale: χιλίαρχος指罗马军队中统领约千人的高级军官。“千夫长”是中文圣经语境中清楚且通行的职衔。
- source_word: ἀναχωρήσας κατ’ ἰδίαν
  choice: 走到一旁私下
  rationale: ἀναχωρέω表达离开或退到一边，κατ’ ἰδίαν表达私下；此译同时保留移动和避开旁人的情景，且不额外补出希腊文未明说的宾语。
- source_word: ἐπυνθάνετο
  choice: 问
  rationale: 未完成时可呈现询问过程或起始意味，但本句直接引出问题，现代汉语用“问”最自然；若译成“开始询问”会显得偏重。
- source_word: Τί ἐστιν ὃ ἔχεις ἀπαγγεῖλαί μοι
  choice: 你有什么事要向我报告？
  rationale: 把希腊文直译式的“是什么……？”自然转换为现代汉语疑问句；“报告”保留ἀπαγγέλλω传达、禀报信息的语义，也符合军事行政场景。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“千夫长”保留历史职衔；整句按汉语语序整合两个分词结构，不添加原文没有的神学解释。
