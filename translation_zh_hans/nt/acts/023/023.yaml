source:
  edition: SBLGNT
  text: Καὶ προσκαλεσάμενός ⸂τινας δύο⸃ τῶν ἑκατονταρχῶν εἶπεν· Ἑτοιμάσατε στρατιώτας διακοσίους ὅπως πορευθῶσιν ἕως Καισαρείας, καὶ ἱππεῖς ἑβδομήκοντα καὶ δεξιολάβους διακοσίους, ἀπὸ τρίτης ὥρας τῆς νυκτός,
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/023.yaml
  text: And calling two of the centurions to him[a], he said, “Prepare two hundred soldiers to go as far as Caesarea, and seventy horsemen and two hundred spearmen[b], at the third hour of the night.”
translation:
  language: zh_hans
  text: 他叫来两个百夫长，对他们说：“预备二百名士兵、七十名骑兵和二百名持矛兵[a]，让他们在夜里第三时[b]出发前往凯撒利亚。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “持矛兵”所对应的原文是一个罕见词，确切含义不明；也可译作“右手护卫”。
    reason: 保留罕见军事术语的词义不确定性，并避免“枪兵”在现代汉语中可能引起的火器联想。
  - marker: b
    text: 即入夜后的第三个小时，按当时犹太人的计时方式，约为晚上九点。
    reason: 解释古代计时方式，帮助现代读者理解。
lexical_decisions:
- source_word: προσκαλεσάμενός
  choice: 叫来
  rationale: 表达中间语态分词所含的召到自己跟前之意，并以自然的现代汉语衔接主句“说”。
- source_word: τινας δύο τῶν ἑκατονταρχῶν
  choice: 两个百夫长
  rationale: τινας δύο在此不必生硬译出“某两个”；“百夫长”是该罗马军职通行而准确的汉语名称。
- source_word: Ἑτοιμάσατε
  choice: 预备
  rationale: 保留军令的直接语气，庄重而易懂。
- source_word: στρατιώτας διακοσίους
  choice: 二百名士兵
  rationale: 准确表达数目和一般步兵类别，并与随后列出的骑兵及特殊兵种区分。
- source_word: ὅπως πορευθῶσιν
  choice: 让他们……出发
  rationale: 以自然汉语保留ὅπως加虚拟式所表达的目的和命令安排。
- source_word: ἕως Καισαρείας
  choice: 一直前往凯撒利亚
  rationale: “一直”体现ἕως所含的到达范围终点之意，又避免汉语“一直到”可能被误解为时间延续。
- source_word: ἱππεῖς ἑβδομήκοντα
  choice: 七十名骑兵
  rationale: 明确指军队中的乘骑部队，比“骑马的人”更符合军事语境。
- source_word: δεξιολάβους διακοσίους
  choice: 二百名枪兵[a]
  rationale: 该罕见军职词的确切含义有争议；正文采用军事语境中较通行、易懂的“枪兵”，并以脚注保留不确定性及另一种可能。
- source_word: ἀπὸ τρίτης ὥρας τῆς νυκτός
  choice: 在夜里第三时[b]出发
  rationale: ἀπό标明行动起始时间；正文保留古代计时方式，并通过“出发”清楚显示这是启程时间。
