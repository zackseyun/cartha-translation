  to: 所以，你不要被他们说动，因为他们中间有四十多人正埋伏等候他；这些人已经起誓，使自己落在咒诅之下[a]，在杀死他以前，不吃也不喝。现在他们已经准备好了，正等着你作出的承诺[b]。
