source:
  edition: SBLGNT
  text: σὺ οὖν μὴ πεισθῇς αὐτοῖς, ἐνεδρεύουσιν γὰρ αὐτὸν ἐξ αὐτῶν ἄνδρες πλείους τεσσεράκοντα, οἵτινες ἀνεθεμάτισαν ἑαυτοὺς μήτε φαγεῖν μήτε πιεῖν ἕως οὗ ἀνέλωσιν αὐτόν, καὶ νῦν ⸂εἰσιν ἕτοιμοι⸃ προσδεχόμενοι τὴν ἀπὸ σοῦ ἐπαγγελίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/021.yaml
  text: So do not be persuaded by them, for more than forty men from among them are lying in ambush for him, who have bound themselves under a curse neither to eat nor to drink until they have killed him. And now they are ready, waiting for the promise from you.
translation:
  language: zh_hans
  text: 所以，你不要被他们说动，因为他们中间有四十多人正埋伏等候他；这些人已经起誓，使自己落在咒诅之下[a]，在杀死他以前，不吃也不喝。现在他们已经准备好了，正等着你作出的承诺[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“已经以咒诅约束自己”。希腊语的说法指他们起誓，并且若不履行誓言，便使自己落在咒诅之下。
    reason: lexical_alternative
  - marker: b
    text: 即等候你表示同意或作出授权。
    reason: lexical_alternative
lexical_decisions:
- source_word: πεισθῇς
  choice: 被他们说动
  rationale: 保留被动语态及“受劝而改变决定”的含义，比单纯译作“听从”更贴近原文，在现代汉语中也自然。
- source_word: ἐνεδρεύουσιν
  choice: 正埋伏等着杀他
  rationale: “埋伏”保留具体的伏击意象；结合宾语和上下文补出“等着杀”，清楚表达敌意目的。
- source_word: ἐξ αὐτῶν ἄνδρες πλείους τεσσεράκοντα
  choice: 他们中间有四十多人
  rationale: 自然表达这些人出自前述群体，并准确保留人数超过四十。
- source_word: ἀνεθεμάτισαν ἑαυτοὺς
  choice: 已经发誓自陷于咒诅
  rationale: 兼顾誓言与自我咒诅两层含义，避免将该表达淡化为一般性的起誓。
- source_word: μήτε φαγεῖν μήτε πιεῖν
  choice: 不吃也不喝
  rationale: 以自然汉语保留原文两个并列否定项。
- source_word: ἕως οὗ ἀνέλωσιν αὐτόν
  choice: 在杀死他以前
  rationale: ἀναιρέω在此明确指暴力杀害；时间表达保留誓言持续到行动完成为止的意思。
- source_word: εἰσιν ἕτοιμοι
  choice: 已经准备好了
  rationale: 直接而自然地表达当前已处于准备就绪的状态。
- source_word: προσδεχόμενοι τὴν ἀπὸ σοῦ ἐπαγγελίαν
  choice: 只等你答应
  rationale: 按语境，ἐπαγγελία指千夫长对请求作出同意或承诺；“只等你答应”比直译“等候来自你的应许”更符合现代汉语，同时以脚注说明语义范围。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“被他们说动”保留原文被动劝服的意味；“发誓自陷于咒诅”保留古代誓约中自我咒诅的严肃色彩。主文避免生硬照搬“来自你的应许”，以语境明确的“你答应”表达，并用脚注保存词义说明。
