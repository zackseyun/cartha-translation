  text: But on the next day[a], after letting the horsemen go on with him, they returned to the barracks.
translation:
  language: zh_hans
  text: 次日，他们让骑兵继续同他前行，便返回军营[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“营房”。希腊语词可指军营、营地或军事驻地；这里很可能指耶路撒冷的罗马驻军设施或堡垒。
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ δὲ ἐπαύριον
  choice: 第二天
  rationale: 该时间短语意为“第二天”或“次日”；δέ在此是轻微的叙事承接，现代汉语无需另译为强转折词。
- source_word: ἐάσαντες
  choice: 让
  rationale: ἐάω在此表示允许或任由；结合后接不定式，译作“让……继续前行”自然，并保留其先于主句动作发生的关系。
- source_word: τοὺς ἱππεῖς
  choice: 骑兵
  rationale: ἱππεῖς指骑马的军人；“骑兵”是现代汉语中清楚、简洁的军事称谓。
- source_word: ἀπέρχεσθαι σὺν αὐτῷ
  choice: 同他继续前行
  rationale: ἀπέρχεσθαι表示离去或继续上路，σὺν αὐτῷ表示与他同行；此处骑兵继续护送，而其余士兵返回，因此译作“同他继续前行”。保留代词“他”，不把上下文中的保罗直接写入正文。
- source_word: ὑπέστρεψαν
  choice: 自己就返回
  rationale: ὑποστρέφω意为返回或折返；加“自己”清楚区分返回者与继续前行的骑兵，“就”自然表达分词动作之后的主句进展。
- source_word: εἰς τὴν παρεμβολήν
  choice: 返回营房
  rationale: παρεμβολή可指军营或军队驻扎处；在本段语境中指耶路撒冷的罗马驻军设施，正文用“营房”具体自然，同时以脚注保留“军营”这一较宽泛的词义。
