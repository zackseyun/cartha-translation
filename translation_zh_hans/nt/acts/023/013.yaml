  yaml_path: translation/nt/acts/023/013.yaml
  text: There were more than forty who had formed this conspiracy[a].
translation:
  language: zh_hans
  text: 策划这场阴谋的有四十多人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλείους τεσσεράκοντα
  choice: 四十多人
  rationale: 比较级 πλείους 与数词 τεσσεράκοντα 连用，表示“多于四十”。“四十多人”是自然、准确的现代汉语表达，也无需补出原文没有明说的“人”作为独立名词。
- source_word: συνωμοσίαν
  choice: 密谋
  rationale: συνωμοσία 指共同策划的秘密图谋或阴谋。“密谋”既体现秘密合谋的含义，又能自然地与“参与”搭配；不把上下文中的起誓细节额外加入本词。
- source_word: ποιησάμενοι
  choice: 参与
  rationale: ποιέω 的不定过去时中间语态分词与 συνωμοσίαν 构成“作成/结成这场密谋”的意思。汉语说“参与这场密谋”较自然，表达这些人共同形成并加入该密谋；若直译为“制造密谋”则不够地道。
- source_word: ἦσαν δὲ
  choice: 有
  rationale: ἦσαν 在此作存在句，译为“有”。δέ 是轻微的承接词，本句在汉语语流中无需另译“而”或“当时”。
- source_word: οἱ ταύτην τὴν συνωμοσίαν ποιησάμενοι
  choice: 参与这场密谋的
  rationale: 冠词加分词短语具有名词化作用，指“那些作成这场密谋的人”。译成汉语“参与这场密谋的”并以后接存在句，简洁自然，并保留其所指。
theological_decisions: []
