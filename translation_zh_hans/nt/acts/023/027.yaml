  text: τὸν ἄνδρα τοῦτον συλλημφθέντα ὑπὸ τῶν Ἰουδαίων καὶ μέλλοντα ἀναιρεῖσθαι ὑπ’ αὐτῶν ἐπιστὰς σὺν τῷ στρατεύματι ⸀ἐξειλάμην, μαθὼν ὅτι Ῥωμαῖός ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/027.yaml
  text: This man was seized by the Jews and was about to be killed by them[a], and I came with the troops and rescued him, having learned that he is a Roman.
translation:
  language: zh_hans
  text: 这个人被犹太人[a]抓住，正要被他们杀死；我得知他是罗马人后，带着部队赶到，把他救了出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“犹太地区的人”。希腊词既可指民族和宗教意义上的犹太人，也可指犹太地区的居民；本处最可能指耶路撒冷敌对保罗的犹太人群。
    reason: 保留Ἰουδαίων在民族—宗教与地理意义之间的词义可能。
lexical_decisions:
- source_word: συλλημφθέντα
  choice: 被……抓住
  rationale: 这里的被动分词表示遭人擒拿；“抓住”自然清楚，也不把行动限定为正式依法逮捕。
- source_word: Ἰουδαίων
  choice: 犹太人
  rationale: 此词既可指民族—宗教意义上的犹太人，也可指地理意义上的犹太地区居民；本处指耶路撒冷敌对保罗的人群，正文采用现代汉语中较通行的“犹太人”，并以脚注保留另一可能。
- source_word: μέλλοντα ἀναιρεῖσθαι
  choice: 正要被他们杀死
  rationale: μέλλω加不定式表示事情即将发生，ἀναιρέω在此意为杀死；“正要被……杀死”准确传达迫在眉睫的危险。
- source_word: ἐπιστὰς
  choice: 赶到
  rationale: 该分词在此表达来到现场并介入；“赶到”既符合紧急情境，也比单纯“来到”更自然。
- source_word: σὺν τῷ στρατεύματι
  choice: 带着部队
  rationale: στράτευμα指一支军事力量或分队；“部队”保留军事含义，又不武断限定人数或编制。
- source_word: ἐξειλάμην
  choice: 把他救了出来
  rationale: ἐξαιρέω的中间语态在此意为从危险中解救；“救了出来”自然地表达从即将被杀的处境中救出。
- source_word: μαθὼν
  choice: 我得知
  rationale: 不定过去时分词表示得知这一情况，并在句中与赶到和施救相连；汉语以“得知……便……”顺畅表达百夫长书信中所声称的行动次序。
- source_word: Ῥωμαῖός ἐστιν
  choice: 他是罗马人
  rationale: Ῥωμαῖος直译为“罗马人”；在此法律语境中蕴含罗马公民身份，但正文不额外扩写为“罗马公民”。
theological_decisions:
- issue: 千夫长书信中的历史与修辞呈现
  choice: 按书信本身的说法，译成他得知保罗是罗马人后带兵施救。
  alternative: 按照使徒行传21—22章更完整的叙事，改写或弱化其得知保罗身份的时间次序。
  rationale: 本节记录革老丢·吕西亚在信中对事件的自我陈述，带有美化自身行为的修辞色彩。译文应保留希腊文所呈现的说法，不替作者消解它与前文叙事之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“抓住”“正要被杀死”“赶到”“救了出来”清楚传达紧迫行动；分号划分保罗所遭遇的危险与千夫长自述的介入。脚注标记[a]已在正文相应词后出现。
