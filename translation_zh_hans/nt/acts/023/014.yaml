  text: οἵτινες προσελθόντες τοῖς ἀρχιερεῦσιν καὶ τοῖς πρεσβυτέροις εἶπαν· Ἀναθέματι ἀνεθεματίσαμεν ἑαυτοὺς μηδενὸς γεύσασθαι ἕως οὗ ἀποκτείνωμεν τὸν Παῦλον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/014.yaml
  text: These men came to the chief priests and the elders and said[a], “We have bound ourselves under a curse to taste nothing until we kill Paul.”
translation:
  language: zh_hans
  text: 这些人来到祭司长和长老那里，说：“我们以咒诅自己来起誓[a]：在杀死保罗以前，什么也不尝。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“我们以咒诅咒诅了自己，不尝任何东西，直到我们杀死保罗。”原文以同源词加强语气，指以自己若违誓便受咒诅为担保所立的誓言。
    reason: 说明原文同源名词与动词构成的加强语气，以及其自我咒诅式誓言的含义。
lexical_decisions:
- source_word: οἵτινες
  choice: 这些人
  rationale: 承接上一节参与密谋的人；用“这些人”明确所指，也符合现代汉语叙事习惯。
- source_word: προσελθόντες
  choice: 来到……那里
  rationale: 该不定过去时分词表示先于“说”发生的动作；此译自然呈现他们前去接洽领袖。
- source_word: τοῖς ἀρχιερεῦσιν καὶ τοῖς πρεσβυτέροις
  choice: 祭司长和长老
  rationale: 两词在此均指犹太群体中具有公认身份的领袖；采用现代中文圣经语境中清楚而通行的称谓。
- source_word: Ἀναθέματι ἀνεθεματίσαμεν ἑαυτοὺς
  choice: 我们已经发誓咒诅自己
  rationale: 同源名词与动词连用，表达带有自我咒诅的严厉誓言；此译保留“咒诅”及自指成分，避免后世教会术语“绝罚”。
- source_word: μηδενὸς γεύσασθαι
  choice: 什么也不吃
  rationale: 原文直义为“什么也不尝”；在誓言禁食的语境中，“什么也不吃”是自然、明确的现代汉语表达。
- source_word: ἕως οὗ ἀποκτείνωμεν τὸν Παῦλον
  choice: 若不杀死保罗，就……
  rationale: 原文按时间界限直译为“直到我们杀死保罗”；汉语誓言常用“若不……就……”表达同一约束关系，同时保留预期行动而不另加“谋杀”等法律或道德定性。
theological_decisions:
- issue: Ἀναθέματι ἀνεθεματίσαμεν ἑαυτοὺς 所表达的誓言性质
  choice: 发誓咒诅自己
  alternative: 使自己受咒诅／以严誓约束自己
  rationale: 该短语指以灾祸临到自己为担保的自我咒诅式誓言，并非后世教会意义上的“绝罚”。正文保留其严厉性，脚注说明其具体含义。
- issue: 誓言的句法表达
  choice: 若不杀死保罗，就什么也不吃
  alternative: 在杀死保罗以前，什么也不尝
  rationale: 原文以“直到”设定禁食的终点；所选汉语结构更像自然的誓言措辞，但不改变其内容与条件关系。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“发誓咒诅自己”刻意保留原文自我咒诅的力度；正文将希腊语“直到……”结构自然转换为汉语“若不……就……”，并以脚注提供较直译形式。
