  text: Σαδδουκαῖοι ⸀μὲν γὰρ λέγουσιν μὴ εἶναι ἀνάστασιν ⸀μήτε ἄγγελον μήτε πνεῦμα, Φαρισαῖοι δὲ ὁμολογοῦσιν τὰ ἀμφότερα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/008.yaml
  text: For the Sadducees say there is no resurrection[a], nor angel nor spirit, but the Pharisees acknowledge both.
translation:
  language: zh_hans
  text: 原来，撒都该人说，没有复活，也没有天使或灵；法利赛人却承认这两者[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或理解为“法利赛人却承认这三样”，即复活、天使和灵。希腊原文作“这两者”，最直接指天使和灵，但也有人根据上下文作较宽的理解。
    reason: 保留 τὰ ἀμφότερα 的直接语义与上下文中三项并列所产生的解释张力。
lexical_decisions:
- source_word: Σαδδουκαῖοι
  choice: 撒都该人
  rationale: 采用现代中文圣经中通行的犹太教派名称音译，清楚自然。
- source_word: μὲν γὰρ
  choice: 原来
  rationale: 在这里引出对上一节冲突原因的解释；“原来”自然表达说明背景的语气，也与后面的“却”形成对照。
- source_word: λέγουσιν μὴ εἶναι
  choice: 说，没有
  rationale: 以自然的现代汉语表达间接陈述和存在否定，不额外加入“主张”等较强语气。
- source_word: ἀνάστασιν
  choice: 复活
  rationale: 指复活这一事实或教义范畴；中文无须添加不定冠词，也不限定为某一次复活。
- source_word: μήτε ἄγγελον μήτε πνεῦμα
  choice: 也没有天使或灵
  rationale: 保留两个单数类别及并列否定的意义；在共同受“没有”支配的否定结构中，“或”是自然、准确的现代汉语表达。
- source_word: Φαρισαῖοι
  choice: 法利赛人
  rationale: 采用现代中文圣经中通行的犹太教派名称音译。
- source_word: ὁμολογοῦσιν
  choice: 承认
  rationale: 此处表示认同、肯定这些事物真实存在；“承认”贴合语境，并避免“宣认”可能带来的礼仪性或宗派性色彩。
- source_word: τὰ ἀμφότερα
  choice: 这两者
  rationale: 直译希腊语“二者”，最直接回指紧邻的“天使”和“灵”；同时以脚注保留其可能概括前述三项的语境理解。
theological_decisions:
- issue: 法利赛人所承认的“这两者”范围
  choice: 正文按 τὰ ἀμφότερα 译为“这两者”，最直接指天使和灵。
  alternative: 理解为法利赛人承认前述三样，即复活、天使和灵。
  rationale: 希腊原文明确使用表示“二者”的 ἀμφότερα，而不是“三者”或“全部”；其最近的先行项是由 μήτε…μήτε 连接的“天使”和“灵”。不过，句子整体及上下文也涉及复活，故不在正文中消除张力，而以脚注保留较宽的理解。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“原来……却……”清楚呈现解释与对比关系；“天使或灵”避免生硬重复，同时保持否定范围明确。
