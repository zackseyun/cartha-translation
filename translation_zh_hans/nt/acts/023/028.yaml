  text: βουλόμενός ⸀τε ⸀ἐπιγνῶναι τὴν αἰτίαν δι’ ἣν ἐνεκάλουν αὐτῷ, ⸀κατήγαγον εἰς τὸ συνέδριον αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/028.yaml
  text: And wanting to know the charge for which they were accusing him[a], I brought him down to their council.
translation:
  language: zh_hans
  text: 我又想查明他们控告他的缘由，就把他带下去，到他们的议会[a]那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他们的公议会”。希腊语 συνέδριον 指议会或议事机构；在此语境中，很可能是指耶路撒冷的犹太统治议会。
    reason: lexical_alternative
lexical_decisions:
- source_word: βουλόμενός
  choice: 想
  rationale: 表达千夫长的意愿和动机；现代汉语自然简洁，不额外强化为“决意”。
- source_word: τε
  choice: 又
  rationale: 轻度承接上文，使这封正式报告的叙述连贯，同时不赋予过强的因果关系。
- source_word: ἐπιγνῶναι
  choice: 确知
  rationale: 既表达“知道”，也保留该动词在此可能含有进一步查明、准确得知的意味。
- source_word: τὴν αἰτίαν δι’ ἣν
  choice: 他们控告他的缘由
  rationale: 在法律语境中，αἰτία指控告的根据或缘由；这样译成自然汉语，并避免把原文关系生硬地译成“所控告他的罪名”。
- source_word: ἐνεκάλουν αὐτῷ
  choice: 他们控告他
  rationale: ἐγκαλέω带有提出控诉的法律意味；未完成时态所呈现的持续背景，在汉语语境中由整句叙事自然体现。
- source_word: κατήγαγον
  choice: 带他下到
  rationale: 保留κατά所含的向下移动这一空间细节；“带”符合押送保罗前往议会的情境。
- source_word: τὸ συνέδριον αὐτῶν
  choice: 他们的议会
  rationale: 直译为其所属群体的“议会”，保留συνέδριον的一般词义；具体指耶路撒冷的犹太统治议会，则在脚注中说明。
