base_translation:
  language: en
  yaml_path: translation/nt/acts/023/031.yaml
  text: So the soldiers[a], according to what had been ordered them[b], took Paul and brought him by night to Antipatris.
translation:
  language: zh_hans
  text: 于是，士兵就照着所受的吩咐，带着保罗，在夜间把他送到安提帕底。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οἱ μὲν οὖν στρατιῶται
  choice: 于是，士兵
  rationale: οὖν承接上文并推进叙事，译作“于是”自然；μέν在此预示下一节的对照或承接，汉语无需单独明译。
- source_word: κατὰ τὸ διατεταγμένον αὐτοῖς
  choice: 照着所领受的命令
  rationale: 保留διατάσσω完成时被动分词所表达的先前命令及被动含义，同时符合现代汉语表达。
- source_word: ἀναλαβόντες τὸν Παῦλον
  choice: 带上保罗
  rationale: ἀναλαμβάνω在此表示把保罗带上同行，作为主句动作之前的伴随行动；“带上”简洁自然，也不额外加入“押送”等原文未明说的色彩。
- source_word: ἤγαγον
  choice: 把他送到
  rationale: ἄγω可指领、带或送往；结合目的地和士兵护送的语境，“送到”自然表达将保罗带往指定地点，但不强化原文未明确说明的方式。
- source_word: διὰ νυκτός
  choice: 连夜
  rationale: διὰ加属格νυκτός表示在夜间；“连夜”在此自然表达夜间赶路，但不必断言旅程持续了整夜。
- source_word: Ἀντιπατρίδα
  choice: 安提帕底
  rationale: 按现代中文圣经地名的常见音译处理该专名。
