base_translation:
  language: en
  yaml_path: translation/nt/acts/023/002.yaml
  text: But the high priest Ananias ordered those standing by him to strike him on the mouth[a].
translation:
  language: zh_hans
  text: 可是，大祭司亚拿尼亚却吩咐站在他旁边的人打保罗的嘴[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“扇保罗的嘴。”希腊文动词可泛指击打；译作“扇”也有可能，但更具体地限定了击打方式。
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: 可是……却
  rationale: 在叙事中承接保罗上一句自辩，并突出大祭司突然而敌对的反应；汉语用“可是……却”自然表达这一轻度转折。
- source_word: ὁ ἀρχιερεὺς
  choice: 大祭司
  rationale: 这是该职分在现代汉语中的标准称谓。
- source_word: Ἁνανίας
  choice: 亚拿尼亚
  rationale: 按中文圣经人名的通行音译处理。
- source_word: ἐπέταξεν
  choice: 吩咐
  rationale: 表达有权者发出命令；“吩咐”在本叙事语境中自然庄重，同时保留权威语气。
- source_word: τοῖς παρεστῶσιν αὐτῷ
  choice: 站在他旁边的人
  rationale: 保留 παρίστημι 分词在此处的临近、在场含义；代词“他”依语法指大祭司亚拿尼亚。
- source_word: τύπτειν
  choice: 打
  rationale: τύπτω 泛指击打；“打”是现代汉语中自然且不过度限定具体方式的对应词。
- source_word: αὐτοῦ τὸ στόμα
  choice: 打保罗的嘴
  rationale: 希腊文直译为“打他的嘴”；为避免连续代词导致指代含混，以“保罗”明示受击者，同时保留嘴作为击打部位。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“打保罗的嘴”保留原文动作与部位；正文不把动作具体化为“扇耳光”，将这一可能译法置于脚注。
