  text: ὁ μὲν οὖν χιλίαρχος ἀπέλυσε τὸν ⸀νεανίσκον παραγγείλας μηδενὶ ἐκλαλῆσαι ὅτι ταῦτα ἐνεφάνισας πρὸς ⸀ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/022.yaml
  text: So the commander dismissed the young man[a], instructing him, “Tell no one that you have reported these things to me.”
translation:
  language: zh_hans
  text: 于是，千夫长让那个年轻人离开，并吩咐他：“不要告诉任何人，你已经把这些事报告给我了[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“告诉了我”，或“使我知道了这些事”。
    reason: 保留ἐνεφάνισας可表示“报告、告知、使人知道”的词义范围。
lexical_decisions:
- source_word: χιλίαρχος
  choice: 千夫长
  rationale: 这是罗马军官的职衔，通常统率约一营兵力。“千夫长”保留原文职衔的形式和权威意味，也符合现代中文圣经语境。
- source_word: ἀπέλυσε
  choice: 让……离开
  rationale: 此处指结束会面后打发年轻人离去，不必理解为从拘押中释放；“让……离开”自然且不引入拘禁含义。
- source_word: νεανίσκον
  choice: 年轻人
  rationale: 该词指较年轻的男性；“年轻人”现代、自然，也避免“少年”可能暗示年龄过小。
- source_word: παραγγείλας
  choice: 嘱咐
  rationale: 该分词表示给出明确指示。“嘱咐”适合当面交代的语境，同时下文的禁止语句仍清楚体现命令性质。
- source_word: μηδενὶ ἐκλαλῆσαι
  choice: 不要告诉任何人
  rationale: 原文禁止向任何人泄露此事；这一译法简洁自然，准确传达否定范围。
- source_word: ἐνεφάνισας
  choice: 报告
  rationale: 该动词表示使人知道、向有关人士报告；在向军官提供情报的语境中，“报告”贴切，同时以脚注保留较宽泛的词义。
- source_word: ταῦτα
  choice: 这些事
  rationale: 保留复数指示，回指年轻人刚才所说的消息。
- source_word: πρὸς ἐμέ
  choice: 给我
  rationale: 原文介词短语表示信息传达的对象；现代中文说“报告给我”自然清楚。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“于是”承接上文；将分词结构译为“并嘱咐他说”，使中文流畅。“千夫长”保留罗马军职称谓。脚注标记置于其所说明的“报告给我了”之后。
