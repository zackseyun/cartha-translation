  text: Τῇ δὲ ἐπιούσῃ νυκτὶ ἐπιστὰς αὐτῷ ὁ κύριος εἶπεν· ⸀Θάρσει, ὡς γὰρ διεμαρτύρω τὰ περὶ ἐμοῦ εἰς Ἰερουσαλὴμ οὕτω σε δεῖ καὶ εἰς Ῥώμην μαρτυρῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/011.yaml
  text: But on the following night[a], the Lord stood by him and said, “Take courage, for just as you have testified about me in Jerusalem[b], so you must also testify in Rome.”
translation:
  language: zh_hans
  text: 到了次日夜里，主站在他身旁，说：“要有勇气[a]！你在耶路撒冷怎样为我的事作了见证，也必须照样在罗马作见证。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“要振作起来！”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ δὲ ἐπιούσῃ νυκτί
  choice: 到了次日夜里
  rationale: ἐπιούσῃ与νυκτί合用，指接下来的那个夜晚；用“到了”自然承接叙事，并以“次日夜里”准确表达时间。δέ仅具轻微转接作用，不必强化为明显对比。
- source_word: ἐπιστὰς αὐτῷ
  choice: 站在他身旁
  rationale: ἐφίστημι在此表示来到并站在某人近旁。“站在他身旁”既保留具体动作，也传达主亲自临近保罗，而不解释性地改成“向他显现”。
- source_word: ὁ κύριος
  choice: 主
  rationale: 按使徒行传的叙事用语译作“主”；不擅自扩写为“主耶稣”，同时上下文中“有关我的事”自然表明说话者的身份。
- source_word: Θάρσει
  choice: 要有勇气
  rationale: 现在时命令语气是在鼓励保罗保持勇气。“要有勇气”是自然、清楚而庄重的现代汉语。
- source_word: διεμαρτύρω
  choice: 作了见证
  rationale: 该词可指郑重地作证或见证。译作“作了见证”，与后面的μαρτυρῆσαι保持同一词族在中文中的呼应；完成体“了”反映在耶路撒冷已经发生的见证。
- source_word: τὰ περὶ ἐμοῦ
  choice: 有关我的事
  rationale: 保留希腊文“关于我的那些事”的范围，不将其缩窄成某一项教义或单一事件。
- source_word: εἰς Ἰερουσαλήμ
  choice: 在耶路撒冷
  rationale: εἰς与城市名连用时可按通用希腊语习惯表达活动发生的地点；现代汉语以“在”最自然。
- source_word: οὕτω
  choice: 照样
  rationale: 明确表达保罗过去在耶路撒冷与将来在罗马作见证之间的对应关系。
- source_word: σε δεῖ
  choice: 你……必须
  rationale: δεῖ表达必要性，在使徒行传语境中常含上帝旨意中的必要；“必须”清楚传达其力度，却不额外解释为宿命或预定。
- source_word: καὶ εἰς Ῥώμην μαρτυρῆσαι
  choice: 也必须……在罗马作见证
  rationale: καί表明罗马是进一步的见证地点；μαρτυρέω译作“作见证”，与前面的διεμαρτύρω形成可见的词语呼应。
theological_decisions:
- issue: ὁ κύριος所指的身份
  choice: 正文只译作“主”，让“有关我的事”及使徒行传上下文表明这是复活的耶稣。
  alternative: 直接译作“主耶稣”。
  rationale: “主耶稣”符合上下文所指，却比本节希腊文本说得更明确；保留“主”可忠实维持原文的表达方式，而不损害其基督论含义。
- issue: δεῖ所表达的必要性
  choice: 译作“必须”，保留神圣计划中必要性的意味，但不说明其实现机制。
  alternative: 译作“注定”或“你有必要”。
  rationale: “注定”容易加入宿命论色彩，“有必要”又可能削弱δεῖ的力度；“必须”在两者之间最贴近原文。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。“次日夜里”比“第二天晚上”更贴近原文的时间表达；“为有关我的事作见证”略带书面色彩，但能自然保留τὰ περὶ ἐμοῦ的宽泛含义。保留“他”而不在正文补出“保罗”，以忠实对应本节代词并避免不必要的显化。
