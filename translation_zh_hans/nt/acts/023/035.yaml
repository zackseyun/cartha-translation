base_translation:
  language: en
  yaml_path: translation/nt/acts/023/035.yaml
  text: “I will hear your case,” he said[b][a], “when your accusers also arrive.” And he ordered that he be kept under guard in Herod’s praetorium.
translation:
  language: zh_hans
  text: 他说：“等控告你的人也到了，我就审理你的案子[a]。”随后，他下令把保罗看守在希律宫的总督府[b]内。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我就把你的陈述听完。”原文动词可有听取到底、听完之意；这里处于司法审理的语境。
    reason: lexical_alternative
  - marker: b
    text: “总督府”原文指罗马总督的官邸或行政驻地；这里很可能是凯撒利亚的希律宫殿，当时由罗马总督使用。
    reason: cultural_note
lexical_decisions:
- source_word: Διακούσομαί σου
  choice: 我就审理你的案子
  rationale: διακούω可指把一方的话听完；在司法语境中，“审理你的案子”自然表达正式听审之意，同时不在正文中强行加入“彻底”等程度词。
- source_word: ὅταν καὶ οἱ κατήγοροί σου παραγένωνται
  choice: 等控告你的人也到了
  rationale: ὅταν加虚拟式表示将来的条件或时点；καί保留为“也”，κατήγοροί准确译作司法语境中的“控告你的人”。
- source_word: κελεύσας
  choice: 随后，他下令
  rationale: 将不定过去时分词按叙事顺序转为独立谓语，使现代汉语流畅；“随后”表达伴随而后续的命令。
- source_word: ἐν τῷ πραιτωρίῳ τοῦ Ἡρῴδου
  choice: 在希律的总督府里
  rationale: πραιτώριον指罗马总督的官邸或行政驻地；此处为凯撒利亚的希律宫殿建筑群，当时供总督使用，“总督府”兼顾功能与可懂性。
- source_word: φυλάσσεσθαι αὐτόν
  choice: 把保罗看守
  rationale: φυλάσσεσθαι在此表示受监管、拘押；“看守”不额外暗示刑罚。为避免连续代词造成指代不清，按上下文将αὐτόν明确为“保罗”。
theological_decisions: []
