source:
  edition: SBLGNT
  text: ἐγένετο δὲ κραυγὴ μεγάλη, καὶ ἀναστάντες ⸂τινὲς τῶν γραμματέων⸃ τοῦ μέρους τῶν Φαρισαίων διεμάχοντο λέγοντες· Οὐδὲν κακὸν εὑρίσκομεν ἐν τῷ ἀνθρώπῳ τούτῳ· εἰ δὲ πνεῦμα ἐλάλησεν αὐτῷ ἢ ⸀ἄγγελος—
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/009.yaml
  text: Then a great outcry arose[a], and some of the scribes of the party of the Pharisees stood up and contended, saying, “We find nothing wrong in this man[b]. But if a spirit or an angel has spoken to him—”
translation:
  language: zh_hans
  text: 于是，爆发了一阵大声喧嚷。法利赛派的一些文士站起来，激烈争辩说：“我们看不出这个人有什么过错。可是，若有灵[a]或天使曾对他说话——”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灵”也可泛指灵界存在；有人将其理解为“圣灵”，但它在这里与“天使”并列，较倾向于一般意义。
    reason: alternative_reading
  - marker: b
    text: 希腊原文的这句话在这里突然中断，没有说完。
    reason: source_clarification
lexical_decisions:
- source_word: κραυγὴ μεγάλη
  choice: 大声喧嚷
  rationale: κραυγή可指喊叫、喧嚷或骚动；此处用“大声喧嚷”自然地传达声音之大和群体骚动。
- source_word: ἀναστάντες
  choice: 站起来
  rationale: 保留其具体动作，也符合议事场合起身发言的语境。
- source_word: τινὲς τῶν γραμματέων
  choice: 几个经学家
  rationale: γραμματεῖς在此指熟悉并讲授犹太律法的人；“经学家”比传统的“文士”更便于现代读者理解，又不增加原文没有的职衔。
- source_word: τοῦ μέρους τῶν Φαρισαίων
  choice: 法利赛派的
  rationale: μέρος在这里指议会中的一方或派别；简洁译为“法利赛派的”，清楚表达这些经学家的阵营归属。
- source_word: διεμάχοντο
  choice: 激烈争辩
  rationale: 该词表示强烈争执，未完成时态又呈现持续进行的动作；“激烈争辩”兼顾力度和自然表达。
- source_word: Οὐδὲν κακὸν εὑρίσκομεν ἐν τῷ ἀνθρώπῳ τούτῳ
  choice: 我们看不出这个人有什么过错
  rationale: 在审议语境中，κακόν指可归咎的恶行或过错；此译自然，并保留“没有发现”的判断意味。
- source_word: εἰ δὲ
  choice: 可是，如果
  rationale: 保留原文的转折和条件结构，不把未完成的话改写成完整的反问句。
- source_word: πνεῦμα
  choice: 灵
  rationale: 此处与“天使”并列，较可能泛指灵界存在；“灵”保留原词本身的含混性，不擅自明确为“圣灵”。
- source_word: ἐλάλησεν αὐτῷ
  choice: 对他说过话
  rationale: 准确表达一次可能已经发生、而与当前争论有关的说话事件。
- source_word: ἄγγελος
  choice: 天使
  rationale: 与“灵”并列的超自然语境表明此处指天使，而不是普通的人间使者。
theological_decisions:
- issue: πνεῦμα在“灵或天使”中的含义
  choice: 译作“灵”，泛指灵界存在，同时保留词义空间
  alternative: 译作“圣灵”
  rationale: 它与“天使”并列，且原文没有冠词，语境更支持一般意义的“灵”；但主文不加解释性限定，以免过度消除歧义。
- issue: 末尾条件句是否补全
  choice: 以破折号保留中断的条件句
  alternative: 补成完整反问句：“难道不是有灵或天使对他说过话吗？”
  rationale: 希腊文本到ἄγγελος后戛然而止。保留未完成结构，既忠于文本形态，也不替说话者补入原文没有的结论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“经学家”避免“文士”在现代汉语中可能造成的误解；“激烈争辩”传达现场冲突的力度。末句保留破折号，以呈现原文的突然中断。
