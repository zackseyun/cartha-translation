source:
  edition: SBLGNT
  text: τότε ὁ Παῦλος πρὸς αὐτὸν εἶπεν· Τύπτειν σε μέλλει ὁ θεός, τοῖχε κεκονιαμένε· καὶ σὺ κάθῃ κρίνων με κατὰ τὸν νόμον, καὶ παρανομῶν κελεύεις με τύπτεσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/003.yaml
  text: Then Paul said to him[a], “God is about to strike you, you whitewashed wall! And do you sit judging me according to the law, and yet in violation of the law command me to be struck?”
translation:
  language: zh_hans
  text: 于是，保罗对他说：“神就要击打你这粉饰的墙！你坐在那里，照着律法审判我，自己却违背律法，命令人打我吗？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τύπτειν σε μέλλει ὁ θεός
  choice: 神就要击打你
  rationale: μέλλει与不定式连用，通常表达将要发生或迫近的行动；“就要”保留临近性，τύπτειν译为“击打”，也与本节后半句的同一词根呼应。
- source_word: τοῖχε κεκονιαμένε
  choice: 你这粉饰的墙
  rationale: 直译其墙被涂抹、粉刷的形象；“粉饰”在现代汉语中也可暗示外表堂皇而实质败坏，同时不把隐喻的具体含义写死。
- source_word: κάθῃ
  choice: 你坐在那里
  rationale: 保留“坐”的具体动作；补出“在那里”使汉语自然，并加强当面对质的语气，不改变原意。
- source_word: κρίνων με κατὰ τὸν νόμον
  choice: 照着律法审判我
  rationale: κατά在此表示以律法为准则；“照着律法”与下文“违背律法”形成清晰对照。
- source_word: παρανομῶν
  choice: 自己却违背律法
  rationale: 表达行为与律法相悖；加入“自己却”自然呈现希腊文并列结构中的强烈反差。
- source_word: κελεύεις με τύπτεσθαι
  choice: 命令人打我
  rationale: 保留κελεύεις的命令含义；汉语用“命令人打我”自然表达被动不定式，不必生硬地译作“命令我被击打”。
- source_word: τότε ὁ Παῦλος πρὸς αὐτὸν εἶπεν
  choice: 于是，保罗对他说
  rationale: 简明保留叙事推进和说话对象；“于是”符合上下文中τότε的承接功能。
theological_decisions:
- issue: “神就要击打你”是宣告还是咒愿
  choice: 译为将临行动的宣告，不作弱化或扩写
  alternative: “愿神击打你”
  rationale: μέλλει加不定式最自然地表示将要或迫近的行动，而不是愿望语气；译文不额外判断保罗这番话在道德或神学上的性质。
translation_notes:
  register: 采用现代、庄重而直接的法庭对质语体。“粉饰的墙”保留原文鲜明隐喻；反问句维持保罗责斥的力度。“神就要击打你”已在正文中体现μέλλει的迫近意味，因此无需另加脚注。
