  yaml_path: translation/nt/acts/023/034.yaml
  text: After reading it and asking what province he was from[a], and learning that he was from Cilicia,
translation:
  language: zh_hans
  text: 腓力斯读了信，又问保罗来自哪个行省；得知他来自基利家后，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναγνοὺς
  choice: 读了信
  rationale: 该不定过去时分词表示先于后续动作发生的阅读；宾语由上文的书信补出，使中文自然清楚。
- source_word: δὲ
  choice: 不单独译出
  rationale: 此处是轻微的承接词，中文可借叙事语序自然体现其衔接作用。
- source_word: καὶ ἐπερωτήσας
  choice: 又问
  rationale: καί连接连续动作；ἐπερωτάω表示直接询问，译为“又问”简洁自然。
- source_word: ἐκ ποίας ἐπαρχείας ἐστὶν
  choice: 是哪个行省的人
  rationale: ἐπαρχία指罗马行政区划中的行省；此译保留行政含义，同时符合现代汉语表达。
- source_word: καὶ πυθόμενος
  choice: 得知
  rationale: πυνθάνομαι在此表示通过询问获知信息；“得知”准确呈现动作结果。
- source_word: ὅτι ἀπὸ Κιλικίας
  choice: 他来自基利家
  rationale: ἀπό加地名表示来源；补出主语“他”以符合汉语句法。
- source_word: Κιλικίας
  choice: 基利家
  rationale: 采用该古代罗马行省名称在中文圣经传统中的通行译名。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。原文由一连串分词构成，且句意延续至下一节；中文用“读了……又问……得知……后”保持动作顺序，并以逗号保留未完句式。为避免本节单独呈现时主语含混，按上下文补出“腓力斯”和“保罗”。
