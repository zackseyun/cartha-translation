  text: μηνυθείσης δέ μοι ἐπιβουλῆς εἰς τὸν ⸀ἄνδρα ἔσεσθαι ⸀ἐξαυτῆς ἔπεμψα πρὸς σέ, παραγγείλας καὶ τοῖς κατηγόροις ⸀λέγειν πρὸς αὐτὸν ἐπὶ ⸀σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/030.yaml
  text: And when I was informed that there would be a plot against the man[a], I sent him to you at once, also ordering his accusers to state their case before you.
translation:
  language: zh_hans
  text: 有人向我报告，将有阴谋要害这个人，我就立刻把他送到你那里，同时吩咐控告他的人到你面前提出对他的控告。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“到你面前陈明对他的控诉。”希腊原文直译为“在你面前向他／针对他说话”；在这里的诉讼语境中，指提出控告。
    reason: lexical_alternative
lexical_decisions:
- source_word: μηνυθείσης
  choice: 有人向我报告
  rationale: 这是 μηνύω 的不定过去时被动属格独立结构，表示伴随的时间或情境；用主动式的非特指主语“有人”符合现代汉语习惯，也保留了消息来自他人的含义。
- source_word: ἐπιβουλῆς εἰς τὸν ἄνδρα
  choice: 有阴谋要害这个人
  rationale: ἐπιβουλή 指敌意的图谋；εἰς 在此表示敌意所针对的对象。“要害这个人”自然表达阴谋的攻击方向，但不把方式具体化为“伏击”。
- source_word: ἔσεσθαι
  choice: 将有
  rationale: 未来时不定式表达所报告内容中的即将发生之事；“将有”简洁保留未来意味。
- source_word: ἐξαυτῆς
  choice: 立刻
  rationale: 该副词表示行动毫不延迟；“立刻”是现代汉语中自然、庄重而清楚的表达。
- source_word: ἔπεμψα πρὸς σέ
  choice: 我就……把他送到你这里
  rationale: 原文未明说宾语，但上下文清楚指保罗；汉语补出“他”使句子完整。“到你这里”准确表达 πρὸς σέ 的方向。
- source_word: παραγγείλας καὶ τοῖς κατηγόροις
  choice: 同时吩咐控告他的人
  rationale: 不定过去时分词表示与送走保罗相伴的另一行动，καί 表示附加；“同时吩咐”自然体现这种关系。“控告他的人”清楚说明 κατήγοροι 的司法角色。
- source_word: λέγειν πρὸς αὐτὸν ἐπὶ σοῦ
  choice: 到你面前陈明对他的控诉
  rationale: 该短语字面为“在你面前对着／针对他说话”，在司法语境中指提出控告。“陈明对他的控诉”传达法庭含义，同时脚注保留较贴近字面的可能理解。
