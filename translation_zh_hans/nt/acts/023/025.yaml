lexical_decisions:
- source_word: γράψας
  choice: 他写了
  rationale: 这是 γράφω 的不定过去时分词，主语承接上一节；汉语叙事中用限定动词“写了”自然地表达该动作。
- source_word: ἐπιστολὴν
  choice: 一封信
  rationale: ἐπιστολή 指书面通信；“信”是现代汉语中清楚、自然且符合本段语境的表达。
- source_word: ἔχουσαν
  choice: 格式如下
  rationale: 该现在时分词修饰“信”，字面为“具有”；结合后文即将引述信件内容，汉语用“格式如下”顺畅地保留其指向。
- source_word: τύπον
  choice: 格式
  rationale: τύπος 在这里可指信件的形式、样式或措辞。“格式”较贴近原词，同时不把含义过早限定为“内容”或“原文”。
- source_word: τοῦτον
  choice: 如下
  rationale: 指示词向后指向紧接着出现的信件正文；“如下”是现代汉语中自然的前指表达。
theological_decisions: []
translation_notes:
