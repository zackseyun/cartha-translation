  text: Γενομένης δὲ ἡμέρας ποιήσαντες ⸂συστροφὴν οἱ Ἰουδαῖοι⸃ ἀνεθεμάτισαν ἑαυτοὺς λέγοντες μήτε φαγεῖν μήτε πιεῖν ἕως οὗ ἀποκτείνωσιν τὸν Παῦλον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/012.yaml
  text: When day came[a], the Jews formed a conspiracy and bound themselves under a curse[b], saying that they would neither eat nor drink until they had killed Paul.
translation:
  language: zh_hans
  text: 天亮后，犹太人[a]密谋，并以咒诅约束自己[b]，发誓说，在杀死保罗以前，绝不吃喝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“犹太人”；这里按上下文是指参与这项阴谋的一群犹太人，并非泛指全体犹太人。
    reason: cultural_note
  - marker: b
    text: 或译：“使自己受咒诅。”这是以自身若不履行誓言便愿受惩罚来约束自己的誓言。
    reason: lexical_alternative
lexical_decisions:
- source_word: Γενομένης δὲ ἡμέρας
  choice: 天一亮
  rationale: 这是属格独立结构，表示时间转换。“天一亮”自然简洁，准确表达白昼来到。
- source_word: ποιήσαντες συστροφὴν
  choice: 结党密谋
  rationale: 此处指为刺杀而有组织地联合谋划。“结党密谋”兼顾聚合与阴谋两层含义，避免“聚众”可能带来的公开骚乱意味。
- source_word: οἱ Ἰουδαῖοι
  choice: 犹太人
  rationale: 正文保留希腊文的明确称谓，不擅自改成“犹太领袖”或“几个犹太人”；脚注说明上下文所指是参与阴谋的特定一群人。
- source_word: ἀνεθεμάτισαν ἑαυτοὺς
  choice: 发誓使自己受咒诅
  rationale: 该动词表示以自我咒诅来约束誓言，即若不履行便愿受审判；此译法同时保留誓言功能和自我咒诅的力度。
- source_word: λέγοντες μήτε φαγεῖν μήτε πιεῖν
  choice: 说……绝不吃也不喝
  rationale: 不定式结构说明誓言的内容；“绝不吃也不喝”自然表达成对否定及其坚决语气。
- source_word: ἕως οὗ ἀποκτείνωσιν τὸν Παῦλον
  choice: 在杀死保罗以前
  rationale: 表达誓言解除以前必须达成的终点，不额外说明阴谋最终是否得逞。
theological_decisions:
- issue: “犹太人”的指称范围
  choice: 正文直译为“犹太人”，脚注按上下文限定为参与阴谋的一群犹太人
  alternative: 正文译为“一些犹太人”或“犹太领袖”
  rationale: 原文使用带冠词的 οἱ Ἰουδαῖοι，却没有明说“一些”或“领袖”；正文保留原文形式，脚注避免读者误以为泛指整个犹太民族。
- issue: 自我咒诅式誓言的性质
  choice: 译为“发誓使自己受咒诅”
  alternative: 仅译为“郑重发誓”
  rationale: 原词含有若违誓便招致咒诅的自我约束意味，仅说“郑重发誓”会削弱其语义和宗教文化力度。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“结党密谋”清楚表达秘密合谋；“发誓使自己受咒诅”虽略具解释性，却能保留原文自我咒诅式誓言的双重含义。所有脚注标记均已置于正文相应位置。
