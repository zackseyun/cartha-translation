base_translation:
  language: en
  yaml_path: translation/nt/acts/023/010.yaml
  text: And when a great dispute arose[a], the commander, fearing that Paul might be torn apart by them, ordered the troops to go down, seize him from among them[c][b], and bring him into the barracks.
translation:
  language: zh_hans
  text: 发生了激烈的争执[a]，千夫长怕保罗被他们撕碎[b]，就命令士兵下去，把他从他们中间抢出来，带进营楼[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “争执”也可译作“纷争”或“骚乱”；原词可指尖锐的内部冲突，在某些语境中也可指动乱。
    reason: lexical_alternative
  - marker: b
    text: “撕碎”也可译作“扯成碎片”，原文用词十分强烈而形象。
    reason: lexical_alternative
  - marker: c
    text: “营楼”原文也可直译为“军营”；这里指耶路撒冷的罗马驻军营房。
    reason: cultural_note
lexical_decisions:
- source_word: πολλῆς δὲ γινομένης στάσεως
  choice: 争执越来越激烈
  rationale: 属格独立结构交代随后行动的情势；στάσις在此指公议会内部迅速加剧、已趋暴力的冲突。“争执越来越激烈”既自然表达过程，也保留πολλῆς所表示的强烈程度。
- source_word: φοβηθεὶς
  choice: 怕
  rationale: 不定过去时分词说明千夫长下令的动机；现代汉语用“怕……就……”简洁自然。
- source_word: ὁ χιλίαρχος
  choice: 千夫长
  rationale: 这是罗马军职称谓，通常指统领约一营兵力的军官；“千夫长”沿用通行且易识别的圣经译名。
- source_word: μὴ διασπασθῇ ὁ Παῦλος ὑπ’ αὐτῶν
  choice: 怕保罗被他们撕碎
  rationale: μή加虚拟式表达所担心的可能后果；“撕碎”保留διασπάω强烈而形象的暴力意味，但不把担忧写成已经发生的事实。
- source_word: ἐκέλευσεν
  choice: 命令
  rationale: 准确体现军事语境中的正式指令。
- source_word: τὸ στράτευμα
  choice: 士兵
  rationale: 原词是集合名词，指受命行动的军队；汉语以“士兵”表达这一群体最自然。
- source_word: καταβὰν
  choice: 下去
  rationale: 保留从营楼所在高处下到议会现场的空间方向，并按汉语顺序纳入连续动作。
- source_word: ἁρπάσαι αὐτὸν ἐκ μέσου αὐτῶν
  choice: 把他从众人中抢出来
  rationale: ἁρπάζω表示迅速而强力地夺出；“抢出来”比中性的“带出来”更能体现士兵从冲突人群中强行救出保罗的力度。
- source_word: ἄγειν τε
  choice: 带进
  rationale: 表达士兵护送保罗到指定地点，且与目的地“营楼”自然搭配。
- source_word: τὴν παρεμβολήν
  choice: 营楼
  rationale: παρεμβολή本可指军营，但在本段指耶路撒冷罗马驻军所在的营房建筑；“营楼”既切合城市中的军事设施，也与上下移动的叙事相符。
