  text: ἔφη τε ὁ Παῦλος· Οὐκ ᾔδειν, ἀδελφοί, ὅτι ἐστὶν ἀρχιερεύς· γέγραπται γὰρ ⸀ὅτι Ἄρχοντα τοῦ λαοῦ σου οὐκ ἐρεῖς κακῶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/005.yaml
  text: And Paul said, “I did not know, brothers, that he is the high priest; for it is written, ‘You shall not speak evil of a ruler of your people.’”
translation:
  language: zh_hans
  text: 保罗说：“弟兄们，我不知道他是大祭司；因为经上记着：‘不可说你百姓的领袖的坏话[a]。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不可辱骂你百姓的领袖。”
    reason: 词义替代：κακῶς λέγω既可宽泛地指说坏话，也可较强地指辱骂或毁谤。
lexical_decisions:
- source_word: ἔφη τε
  choice: 保罗说
  rationale: τέ是轻微的连接词，汉语叙事中无需机械译出；“保罗说”自然引出直接引语。
- source_word: Οὐκ ᾔδειν
  choice: 我不知道
  rationale: 直接保留οἶδα在此处表达的认知意义，也不擅自解释保罗为何不知道。
- source_word: ἀδελφοί
  choice: 弟兄们
  rationale: 呼格复数为阳性，且保罗是在公议会中对男性成员发言；“弟兄们”既符合语境，也保留原文称呼。
- source_word: ὅτι ἐστὶν ἀρχιερεύς
  choice: 他是大祭司
  rationale: 保留ἐστίν的现在时表达，并以“大祭司”对应该职分；不改成过去时，也不解释保罗是否认出了亚拿尼亚。
- source_word: γέγραπται γὰρ
  choice: 因为经上记着
  rationale: 采用现代中文熟悉的经文引用格式，体现完成时被动所表达的既定、持续有效的书面记载。
- source_word: Ἄρχοντα
  choice: 领袖
  rationale: ἄρχων泛指掌权或治理者；“领袖”在此能自然表达百姓中的治理者，同时避免把词义限定为某一具体官职。
- source_word: τοῦ λαοῦ σου
  choice: 你百姓
  rationale: 贴近原文的第二人称所有关系及λαός的群体、盟约色彩；在引文体中“你百姓”简洁自然。
- source_word: οὐκ ἐρεῖς κακῶς
  choice: 不可说……的坏话
  rationale: 未来直陈式在律法引文中具有命令作用；这一译法保留“恶言相向、说坏话”的宽泛含义，不把它收窄为某一种辱骂行为。
theological_decisions:
- issue: 是否以包容性称谓翻译ἀδελφοί
  choice: 弟兄们
  alternative: 弟兄姊妹们
  rationale: 原词为阳性复数，且当前语境是保罗向公议会成员发言；译作“弟兄们”准确而自然。
- issue: 如何处理保罗所说“不知道他是大祭司”
  choice: 按原文直译，不补充原因
  alternative: 译成“不知道他当时是大祭司”或解释为“没有认出”
  rationale: 原文并未说明保罗是不了解其身份、没有认出此人，还是另有含义；直译可保留这一真实的解释张力。
- issue: 经文禁令的语义范围
  choice: 不可说你百姓领袖的坏话
  alternative: 不可辱骂你百姓的领袖
  rationale: κακῶς λέγω可涵盖说坏话、恶言毁谤或辱骂；正文采用较宽泛且易懂的表达，脚注列出语气更强的可能译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留直接引语和经文引用的层次；“经上记着”体现正式的引用语气，“说……的坏话”则避免生硬古奥。
