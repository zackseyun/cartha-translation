base_translation:
  language: en
  yaml_path: translation/nt/acts/023/017.yaml
  text: So Paul called one of the centurions and said[a], “Take this young man to the commander, for he has something to report to him.”
translation:
  language: zh_hans
  text: 于是，保罗叫来一个百夫长，对他说：“请把这个年轻人带到千夫长那里，因为他有事要向千夫长报告[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “报告”也可译作“告诉”。希腊文这个词可指报告、宣布或告诉；此处涉及转达紧急消息，所以正文译作“报告”。
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: 叫来
  rationale: 该不定过去时中间语态分词表示保罗先把人叫到自己跟前；“叫来”自然准确，也比单用“叫”更清楚地表达趋近含义。
- source_word: δὲ
  choice: 于是
  rationale: 此处主要承接上文、推进叙事，并非强调转折；“于是”符合现代汉语叙事习惯。
- source_word: ἕνα τῶν ἑκατονταρχῶν
  choice: 一个百夫长
  rationale: ἑκατοντάρχης是罗马军队的军衔，汉语惯译“百夫长”；“一个”结合语境自然表达“其中一位”。
- source_word: ἔφη
  choice: 对他说
  rationale: φημί是普通的言说动词；补出“对他”符合汉语表达，所指对象由希腊文语境明确。
- source_word: νεανίαν
  choice: 年轻人
  rationale: νεανίας指年轻男性；“年轻人”现代、清楚且不显古雅。
- source_word: ἄπαγε
  choice: 请把……带到
  rationale: ἀπάγω在此是命令对方领着年轻人前往长官处；“带到”符合汉语场景。加入“请”使直接命令在现代汉语中自然庄重，并未改变命令语气。
- source_word: πρὸς τὸν χιλίαρχον
  choice: 到千夫长那里
  rationale: χιλίαρχος本义为统领约千人的军官，在本段指罗马军团的高级军官；“千夫长”与“百夫长”形成清楚的军阶对应，也延续常用圣经历史称谓。
- source_word: ἔχει γὰρ ἀπαγγεῖλαί τι αὐτῷ
  choice: 因为他有事要向千夫长报告
  rationale: ἔχει加不定式表达“有某事要做”，ἀπαγγέλλω可指报告、传达或告诉。语境是转达紧急情报，因此正文用“报告”；将代词明确为“千夫长”可避免汉语中两个“他”造成歧义。
theological_decisions: []
translation_notes:
  register: 采用现代、自然而庄重的叙事语言。保留“百夫长”“千夫长”这组历史军衔称谓；为避免连续代词所指不清，末句重复“千夫长”。脚注标记已置于正文相应词后。
