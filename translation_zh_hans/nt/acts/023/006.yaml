source:
  edition: SBLGNT
  text: Γνοὺς δὲ ὁ Παῦλος ὅτι τὸ ἓν μέρος ἐστὶν Σαδδουκαίων τὸ δὲ ἕτερον Φαρισαίων ⸀ἔκραζεν ἐν τῷ συνεδρίῳ· Ἄνδρες ἀδελφοί, ἐγὼ Φαρισαῖός εἰμι, υἱὸς ⸀Φαρισαίων· περὶ ἐλπίδος καὶ ἀναστάσεως νεκρῶν ⸀ἐγὼ κρίνομαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/006.yaml
  text: But Paul[a], knowing that one part were Sadducees and the other Pharisees, cried out in the council, “Men, brothers, I am a Pharisee, a son of Pharisees[c][b]. It is concerning the hope and resurrection of the dead that I am being judged.”
translation:
  language: zh_hans
  text: 保罗知道公议会中一部分人是撒都该人，另一部分是法利赛人，就在公议会[a]中高声说：“诸位弟兄，我是法利赛人，是法利赛人之子[b]。我因盼望和死人复活的事受审[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“议会”。这里的希腊词可特指犹太人的最高议会。
    reason: lexical_alternative
  - marker: b
    text: 也可理解为“法利赛人父母的儿子”或“法利赛人的后代”。
    reason: alternative_reading
  - marker: c
    text: 或译：“我因盼望死人复活而受审。”
    reason: alternative_reading
lexical_decisions:
- source_word: Γνοὺς
  choice: 知道
  rationale: 以简洁自然的中文表达不定过去时分词所交代的行动背景和原因，不把它扩展为正文未明说的推断过程。
- source_word: τὸ ἓν μέρος ... τὸ δὲ ἕτερον
  choice: 其中一部分……另一部分
  rationale: 保留原文将公议会成员分成两部分的表达，同时符合现代汉语习惯。
- source_word: Σαδδουκαίων / Φαρισαίων
  choice: 撒都该人／法利赛人
  rationale: 采用现代中文圣经及相关文献中通行的犹太教派名称。
- source_word: ἔκραζεν
  choice: 高声说
  rationale: 表达 κράζω 所含的响亮、公开发言之意，又避免过度口语化。
- source_word: ἐν τῷ συνεδρίῳ
  choice: 在公议会中
  rationale: 按本段司法语境将 συνέδριον 译为特指犹太统治议会的“公议会”；脚注保留较宽泛的译法。
- source_word: Ἄνδρες ἀδελφοί
  choice: 诸位弟兄
  rationale: “诸位”体现正式的男性群体称呼，配合“弟兄”表达保罗对同胞的称谓；中文无需生硬重复“男人、弟兄”。
- source_word: Φαρισαῖός εἰμι
  choice: 我是法利赛人
  rationale: 直接保留现在时的身份陈述。
- source_word: υἱὸς Φαρισαίων
  choice: 法利赛人之子
  rationale: 较为贴近“儿子”的家族性比喻，并保留复数“法利赛人”所容许的父母、家族或传承方面的歧义；脚注说明其他可能译法。
- source_word: περὶ ἐλπίδος καὶ ἀναστάσεως νεκρῶν
  choice: 因为有关盼望和死人复活的事
  rationale: 保留 ἐλπίδος 与 ἀναστάσεως 由 καί 并列的形式，不在正文中将二者明确合并为“复活的盼望”。
- source_word: κρίνομαι
  choice: 我受审
  rationale: 自然表达现在被动式所指的当前司法处境，比“我正在被审判”更符合现代汉语。
theological_decisions:
- issue: “υἱὸς Φαρισαίων”所表达的关系
  choice: 译作“法利赛人之子”，不限定为父母双方、某一位家长或较广的祖先传承。
  alternative: “法利赛人父母的儿子”或“法利赛人的后代”。
  rationale: 原文复数属格与“儿子”的习语可有不止一种历史指向；正文保留其家族和传承色彩，不添加无法确定的具体家世。
- issue: “盼望”与“死人复活”的关系
  choice: 正文保留“盼望和死人复活”的并列结构。
  alternative: “我受审，是因为盼望死人复活。”
  rationale: 原文以 καί 连接两个属格名词，既可理解为两个紧密相关的事项，也可能合起来表达以复活为内容的盼望；不应在正文中消除这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“公议会”“诸位弟兄”“受审”符合公开司法场景；仅在“法利赛人之子”处保留适度书面色彩，以维持原文家族习语的开放性。
