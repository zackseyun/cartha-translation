  text: οἵτινες εἰσελθόντες εἰς τὴν Καισάρειαν καὶ ἀναδόντες τὴν ἐπιστολὴν τῷ ἡγεμόνι παρέστησαν καὶ τὸν Παῦλον αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/033.yaml
  text: When they entered Caesarea and delivered the letter to the governor[b][a], they also presented Paul to him.
translation:
  language: zh_hans
  text: 他们进了凯撒利亚，把信呈交给总督，又把保罗带到他面前。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἵτινες
  choice: 他们
  rationale: 承接上一节护送保罗的骑兵；现代汉语用明确主语自然清楚。
- source_word: εἰσελθόντες
  choice: 进了
  rationale: 不定过去时分词表示先于主句动作发生；“进了凯撒利亚”简洁自然。
- source_word: Καισάρειαν
  choice: 凯撒利亚
  rationale: 采用该地名通行的中文音译，不在正文中增添“海滨”等原文未明说的限定。
- source_word: ἀναδόντες
  choice: 呈交
  rationale: 这里指向官员正式递送公函；“呈交”兼顾正式语境和现代可读性。
- source_word: ἐπιστολήν
  choice: 信
  rationale: 准确而自然地表达公函性质的书面信息，无须译得过于专门。
- source_word: ἡγεμόνι
  choice: 总督
  rationale: 符合腓力斯作为罗马行省长官的语境，也是现代中文圣经及一般历史叙述中的清楚称谓。
- source_word: παρέστησαν
  choice: 带到……面前
  rationale: 在司法和行政语境中表示把某人带到权威者面前；这样译比直译“呈上保罗”更符合现代汉语。
- source_word: καὶ
  choice: 又
  rationale: 体现第二个 καί 的附加关系：除呈交书信外，还把保罗带到总督面前。
- source_word: Παῦλον
  choice: 保罗
  rationale: 采用 Παῦλος 的通行中文译名。
- source_word: αὐτῷ
  choice: 他面前
  rationale: 代词指总督；与“带到”搭配时译作“他面前”自然，并准确表达正式带见的场景。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“呈交”保留官方递送的正式色彩，“带到他面前”清楚传达法律行政场景。原文两处分词动作与主句动词之间的顺序，以“进了……把……又把……”自然呈现。
