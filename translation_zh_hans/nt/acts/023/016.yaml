base_translation:
  language: en
  yaml_path: translation/nt/acts/023/016.yaml
  text: But when Paul’s sister’s son heard of the ambush[c][b][a], he came and entered the barracks and reported it to Paul.
translation:
  language: zh_hans
  text: 可是，保罗的外甥[a]听说了这场伏击[b]，就来到军营[c]，进去把这事报告给保罗。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“保罗的姐妹的儿子”；希腊文并未说明这位姐妹是姐姐还是妹妹。
    reason: lexical_alternative
  - marker: b
    text: “伏击”也可译作“埋伏”或“阴谋”；希腊原文较具体地指设伏袭击。
    reason: lexical_alternative
  - marker: c
    text: “军营”也可译作“营房”或“营楼”；在本段语境中，可能特指罗马驻军的营房。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσας
  choice: 听说了
  rationale: 不定过去时分词在这里表示先于主要动作发生的情形；“听说了”自然地表达他获悉伏击计划。
- source_word: δὲ
  choice: 可是
  rationale: δέ承接叙事并带轻微转折：前文的阴谋如今被人听见。“可是”比单纯的“于是”更能体现这一转折。
- source_word: ὁ υἱὸς τῆς ἀδελφῆς Παύλου
  choice: 保罗姐姐的儿子
  rationale: 原文直译为“保罗姐妹的儿子”。现代汉语必须按年龄关系选用“姐姐”或“妹妹”，而原文并未说明；正文采用较顺口的“姐姐”，并以脚注保留不确定性。
- source_word: τὴν ἐνέδραν
  choice: 这场伏击
  rationale: ἐνέδρα具体指埋伏、伏击，而不只是泛泛的阴谋；指前文所述的伏杀计划。
- source_word: παραγενόμενος
  choice: 来到
  rationale: 该分词表示到达现场，先于随后进入营楼的动作；译为“来到”简洁自然。
- source_word: εἰσελθὼν εἰς τὴν παρεμβολὴν
  choice: 进入营楼
  rationale: παρεμβολή可指军营或营房；本段背景是耶路撒冷的罗马驻军营楼，因此“营楼”较准确地指向该处设施，同时以脚注注明较宽泛的译法。
- source_word: ἀπήγγειλεν
  choice: 把这事报告给
  rationale: ἀπαγγέλλω表示把获知的信息传报出来；“报告给”符合向被拘押的保罗通报紧急消息的语境，宾语“这事”由上下文补出。
- source_word: τῷ Παύλῳ
  choice: 保罗
  rationale: 与“报告给”组成自然的汉语间接宾语结构。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。保留原文连续动作的次序，并避免把ἐνέδρα弱化为泛指的“计划”。亲属称谓因汉语必须区分姐姐和妹妹而原文不作区分，需在出版审校时考虑是否改用“保罗的外甥”以避免正文过度确定；但“外甥”会丢失原文明说“姐妹之子”的表达方式。
