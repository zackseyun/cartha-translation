  text: εἶπεν δὲ ὅτι Οἱ Ἰουδαῖοι συνέθεντο τοῦ ἐρωτῆσαί σε ὅπως αὔριον ⸂τὸν Παῦλον καταγάγῃς εἰς τὸ συνέδριον⸃ ὡς ⸀μέλλον τι ἀκριβέστερον πυνθάνεσθαι περὶ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/020.yaml
  text: He said[a], “The Jews have agreed to ask you to bring Paul down to the Sanhedrin tomorrow[b], as though they were going to inquire more accurately about him.”
translation:
  language: zh_hans
  text: 他回答说：“犹太人已经商定，要请你明天把保罗带下去，送到公议会[a]，好像要更仔细地查问有关他的事。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “公议会”也可译作“议会”；这里指犹太人的最高议事机构。
    reason: lexical_alternative
lexical_decisions:
- source_word: συνέθεντο
  choice: 已经商定
  rationale: 中间语态表示共同达成协议或定下计划；“商定”自然保留了共同谋划之意，同时不把词本身过度译成“密谋”。
- source_word: τοῦ ἐρωτῆσαί σε
  choice: 要请你
  rationale: 带冠词不定式说明其商定之事；ἐρωτάω在这里是向千夫长提出请求，译作“请你”符合现代汉语。
- source_word: καταγάγῃς
  choice: 把保罗带下去，送到
  rationale: 保留κατά-所表达的向下移动方向；补出“送到”使目的地关系在汉语中清楚自然。
- source_word: συνέδριον
  choice: 公议会
  rationale: 此处指耶路撒冷的犹太最高议事机构；“公议会”是中文圣经语境中较为通行且易懂的专名，并以脚注说明也可泛译为“议会”。
- source_word: ὡς
  choice: 假装
  rationale: 这里引出表面声称而非真实的目的；“假装”自然表达其托词性质，符合上下文中的诱杀阴谋。
- source_word: μέλλον τι ἀκριβέστερον πυνθάνεσθαι περὶ αὐτοῦ
  choice: 要更仔细地查问他的事
  rationale: πυνθάνομαι表示通过询问而查明，ἀκριβέστερον是比较级“更仔细／更确切”；此译兼顾动作、比较意味和自然汉语。
- source_word: Οἱ Ἰουδαῖοι
  choice: 犹太人
  rationale: 直接保留希腊文措辞，不擅自限定为“犹太领袖”；上下文表明所指是参与该计划的特定一群犹太人，并非全体犹太人。
theological_decisions:
- issue: 敌对叙事中“犹太人”的所指
  choice: 保留“犹太人”
  alternative: 犹太领袖／犹太地区的人
  rationale: 原文仅说Οἱ Ἰουδαῖοι，翻译不应无据缩窄其所指；应由上下文限定为参与谋害保罗计划的那一群人，而非作整体族群判断。
- issue: ὡς所表达的虚假意图
  choice: 译为“假装要”
  alternative: 好像要／声称要
  rationale: 后续语境明确这项请求是诱使保罗进入伏击的托词；“假装”把原文ὡς在此处的表面理由准确、简洁地传达出来，但不增添具体阴谋细节。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“带下去”保留原文的方向感；“查问他的事”比“了解更准确的事”更符合现代汉语，也体现πυνθάνομαι所含的询问查明之意。
