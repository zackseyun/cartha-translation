  text: ὃν εὗρον ἐγκαλούμενον περὶ ζητημάτων τοῦ νόμου αὐτῶν, μηδὲν ⸀δὲ ἄξιον θανάτου ἢ δεσμῶν ⸂ἔχοντα ἔγκλημα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/029.yaml
  text: I found that he was being accused concerning questions of their law[b][a], but charged with nothing deserving death or imprisonment.
translation:
  language: zh_hans
  text: 我查明，他是就有关他们律法的一些问题[a]受到指控；但他并没有任何足以判处死刑或监禁[b]的罪名。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“有关他们律法的一些争议”。
    reason: lexical_alternative
  - marker: b
    text: “监禁”直译为“锁链”。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὗρον
  choice: 我查明
  rationale: 这里指千夫长经过查问后得出的结论；“查明”比单纯的“发现”更符合司法调查语境，同时保留第一人称。
- source_word: ἐγκαλούμενον
  choice: 他受指控
  rationale: 保留被动含义，表明有人正在对他提出控告，但不暗示指控已经成立。
- source_word: περὶ ζητημάτων
  choice: 因有关……的一些问题
  rationale: ζητήματα可指问题、争议或争论事项；正文采用较中性的“问题”，不把争议性质说得过死，并以脚注保留另一译法。
- source_word: τοῦ νόμου αὐτῶν
  choice: 他们律法
  rationale: 保留αὐτῶν的所属意义和罗马官员看待犹太律法的外部视角；“律法”符合本书相关语境。
- source_word: μηδὲν ... ἄξιον θανάτου ἢ δεσμῶν
  choice: 没有任何足以判处死刑或监禁的
  rationale: ἄξιον表达应得或足以招致某种刑罚；“监禁”自然传达δεσμά在司法语境中的实际含义，脚注注明其字面措辞。
- source_word: ἔχοντα ἔγκλημα
  choice: 他并没有任何……罪名
  rationale: 在此表示没有可据以控告或定罪的罪状；“罪名”符合现代汉语法律语境，又不误译成已经被判有罪。
theological_decisions: []
translation_notes:
