  text: Claudius Lysias[a], to the most excellent governor Felix, greetings.
translation:
  language: zh_hans
  text: 克劳狄·吕西亚，向尊贵的[a]总督腓力斯问安。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“致腓力斯总督阁下。”希腊语“κρατίστῳ”是正式的尊称。
    reason: lexical_alternative
lexical_decisions:
- source_word: Κλαύδιος Λυσίας
  choice: 克劳狄·吕西亚
  rationale: 按现代汉语圣经人名的常见音译方式处理罗马姓名，并以间隔号清楚区分两个名字。
- source_word: τῷ κρατίστῳ
  choice: 尊贵的
  rationale: κρατίστῳ是正式书信中对高级官员的尊称；“尊贵的”既保留敬称语气，又符合自然、庄重的现代汉语。
- source_word: ἡγεμόνι
  choice: 总督
  rationale: ἡγεμών在此指罗马地方治理官员；“总督”清楚传达其职权，同时避免用更具体的罗马技术官衔过度限定原文。
- source_word: Φήλικι
  choice: 腓力斯
  rationale: 采用现代中文圣经传统中易于辨认的音译。
- source_word: χαίρειν
  choice: 问安
  rationale: χαίρειν在书信开头是惯用问候语，并非字面命令“要喜乐”；“问安”自然体现中文正式书信的开头语气。
