  yaml_path: translation/nt/acts/023/004.yaml
  text: Those standing nearby said[a], “Are you insulting God’s high priest?”
translation:
  language: zh_hans
  text: 站在旁边的人说：“你侮辱神的大祭司吗？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你辱骂神的大祭司吗？”
    reason: λοιδορέω可译为“侮辱”或更强调言语攻击的“辱骂”；后者更直接凸显说话层面的凌辱。
lexical_decisions:
- source_word: οἱ δὲ παρεστῶτες
  choice: 站在旁边的人却
  rationale: 定冠词化分词指当时站在保罗身旁的人；“站在旁边的人”自然保留了空间含义。δέ在这里承接并带出回应，用“却”体现轻微的转折。
- source_word: εἶπαν
  choice: 说
  rationale: 不定过去时在叙事中表示一次发生的言语行动，现代汉语用“说”即可自然表达。
- source_word: ἀρχιερέα
  choice: 大祭司
  rationale: 此处指犹太人的大祭司；“大祭司”是现代中文圣经语境中准确而通行的称谓。
- source_word: τοῦ θεοῦ
  choice: 神的
  rationale: 属格表示该职分与神的关系；“神的大祭司”忠实保留原文表达，同时不额外断言神认可担任此职者的一切行为。
- source_word: λοιδορεῖς
  choice: 侮辱
  rationale: 该动词指以言语辱骂、凌辱他人。“侮辱”是现代中文中清楚自然的表达，也保留了言语攻击的责斥意味。
theological_decisions:
- issue: τοῦ θεοῦ用来修饰大祭司时的含义
  choice: 译作“神的大祭司”
  alternative: “属于神的大祭司”或“神所设立的大祭司”
  rationale: 原文表明大祭司这一职分与神相关，却没有在此进一步说明神对该任职者个人行为的认可程度；因此不加入“所设立”等解释性措辞。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“竟”传达宾语前置问句所具有的责问和惊讶语气，但避免加入“竟敢”所可能带来的额外挑战意味。
