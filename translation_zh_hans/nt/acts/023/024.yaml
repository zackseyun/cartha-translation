lexical_decisions:
- source_word: κτήνη
  choice: 牲口
  rationale: 该词泛指供骑乘或驮载的动物，并未限定为马；“牲口”在此保留种类上的宽泛性，脚注说明其具体用途。
- source_word: τε
  choice: 又要
  rationale: 承接上一节的一连串命令；“又要”自然体现附加指令的连接作用。
- source_word: παραστῆσαι
  choice: 预备
  rationale: 在命令语境中表示使牲口备妥可用；“预备”简洁传达这一实际含义。
- source_word: ἵνα
  choice: 好让
  rationale: 明确表达目的关系，同时符合现代汉语叙事语气。
- source_word: ἐπιβιβάσαντες
  choice: 扶保罗骑上
  rationale: 该分词表示使保罗骑上前述牲口；“扶……骑上”自然呈现使役意义与先后关系，但不额外说明他为何需要搀扶。
- source_word: διασώσωσι
  choice: 安全送到
  rationale: 兼顾护送过程与平安抵达的含义，比单译“救”更切合军事押送的语境。
- source_word: πρὸς
  choice: 到……那里
  rationale: 表示朝向某人并到其面前；现代汉语用“到……那里”清楚自然。
- source_word: ἡγεμόνα
  choice: 总督
  rationale: 在罗马行省行政语境中指治理该地的高级官员；“总督”是清楚而通行的称谓。
