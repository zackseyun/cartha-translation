  text: τοῦτο δὲ αὐτοῦ ⸀λαλοῦντος ἐγένετο στάσις τῶν Φαρισαίων ⸂καὶ Σαδδουκαίων⸃, καὶ ἐσχίσθη τὸ πλῆθος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/007.yaml
  text: And as he was saying this[a], a dispute arose between the Pharisees and Sadducees[b], and the assembly was divided.
translation:
  language: zh_hans
  text: 保罗正说这话的时候，法利赛人和撒都该人之间起了争执[a]，会众就分裂了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“纷争”或“冲突”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“人群分成了两派”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δὲ αὐτοῦ λαλοῦντος
  choice: 保罗正说这话的时候
  rationale: 属格独立结构中的现在分词表示与主句同时发生的动作；补出上文明确的主语“保罗”，使现代汉语自然清楚。
- source_word: ἐγένετο
  choice: 起了
  rationale: 与“争执”搭配，表达争端发生、出现，符合现代汉语叙事习惯。
- source_word: στάσις
  choice: 争执
  rationale: 此词在这里指群体之间的纷争或对立；“争执”既贴合当下的辩论冲突，也通俗自然。
- source_word: τῶν Φαρισαίων καὶ Σαδδουκαίων
  choice: 法利赛人和撒都该人之间
  rationale: 希腊文以属格说明纷争所涉及的双方；汉语用“之间”明确表达两个群体彼此对立。
- source_word: ἐσχίσθη
  choice: 分裂了
  rationale: 被动形式本义为“被劈开、裂开”，用于群体时表示分成对立阵营；“分裂了”保留其形象与社会含义。
- source_word: τὸ πλῆθος
  choice: 会众
  rationale: 这里指聚集在公议会场合的人群；“会众”比泛指性的“人群”更能体现这一有组织的聚集，同时不把它严格等同于公议会本身。
theological_decisions: []
