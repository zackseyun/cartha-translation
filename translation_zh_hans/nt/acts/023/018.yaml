source:
  edition: SBLGNT
  text: ὁ μὲν οὖν παραλαβὼν αὐτὸν ἤγαγεν πρὸς τὸν χιλίαρχον καὶ φησίν· Ὁ δέσμιος Παῦλος προσκαλεσάμενός με ἠρώτησεν τοῦτον τὸν ⸀νεανίαν ἀγαγεῖν πρὸς σέ, ἔχοντά τι λαλῆσαί σοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/018.yaml
  text: So he took him and brought him to the commander and said[a], “The prisoner Paul called me to him and asked me to bring this young man to you[b], because he has something to say to you.”
translation:
  language: zh_hans
  text: 于是，那百夫长带着年轻人来到千夫长[a]那里，说：“囚犯保罗把我叫去，请我带这个年轻人来见你，因为他有话要对你说。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “千夫长”指罗马军队中的高级军官，传统上也译作“护民官”。
    reason: cultural_note
lexical_decisions:
- source_word: παραλαβὼν αὐτὸν ἤγαγεν
  choice: 带着年轻人来到
  rationale: 两个动词共同描写百夫长接手并把年轻人带到长官面前；中文用“带着……来到”自然表达这一连贯动作，并借明确宾语避免连续代词造成歧义。
- source_word: χιλίαρχον
  choice: 千夫长
  rationale: 这是罗马军队高级军官的称谓；“千夫长”是中文圣经传统中较为熟悉且简洁的译法，脚注补充其历史含义，避免让读者按字面误解为实际统领恰好一千人。
- source_word: φησίν
  choice: 说
  rationale: 原文为叙事性历史现在时；中文叙事中的“说”不需标明时态，表达自然。
- source_word: Ὁ δέσμιος Παῦλος
  choice: 囚犯保罗
  rationale: δέσμιος指被拘禁的人；“囚犯保罗”简明保留原文对保罗在押身份的强调。
- source_word: προσκαλεσάμενός με
  choice: 把我叫去
  rationale: 中间语态分词表示保罗叫百夫长到自己那里；“把我叫去”自然表达朝向保罗的动作。
- source_word: ἠρώτησεν
  choice: 请
  rationale: ἠρωτάω在此表示请求而非询问；“请我……”准确体现其语用功能。
- source_word: νεανίαν
  choice: 年轻人
  rationale: νεανίας指年轻男子；“年轻人”是现代汉语中自然、准确且不过度限定年龄的表达。
- source_word: ἔχοντά τι λαλῆσαί σοι
  choice: 因为他有话要对你说
  rationale: 该分词短语修饰年轻人，并说明带他来见千夫长的缘由；“有话要对你说”自然保留其内容未明的表达。
