  text: νῦν οὖν ὑμεῖς ἐμφανίσατε τῷ χιλιάρχῳ σὺν τῷ συνεδρίῳ ⸀ὅπως ⸂καταγάγῃ αὐτὸν εἰς⸃ ὑμᾶς ὡς μέλλοντας διαγινώσκειν ἀκριβέστερον τὰ περὶ αὐτοῦ· ἡμεῖς δὲ πρὸ τοῦ ἐγγίσαι αὐτὸν ἕτοιμοί ἐσμεν τοῦ ἀνελεῖν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/015.yaml
  text: Now therefore[a], you, together with the council, make it known to the commander so that he may bring him down to you, as though you were about to examine more carefully the things concerning him[c][b]. But we are ready to kill him before he comes near.
translation:
  language: zh_hans
  text: 因此，现在你们要同公议会一起向千夫长表明，好叫他把那人带下来，到你们这里来[a]，假称你们要更确切地查明有关他的事[b]。至于我们，我们已经准备好，要在他走近以前[c]杀掉他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “把那人带下来，到你们这里来”也可译作“把那人带到你们面前”；原文动词含有“带下来”的方向意味。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“假装要更仔细地审查他的案情”。这里的话表明，进一步审查只是他们提出的托词。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“在他到达以前”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμφανίσατε
  choice: 向……提出
  rationale: 此处是不定过去时主动命令式，指向掌权者正式陈明一项安排或请求。“提出”在汉语中自然，并由后面的目的从句交代所提出的内容。
- source_word: χιλιάρχῳ
  choice: 千夫长
  rationale: 指罗马军队中统领一支大队的军官；“千夫长”保留历史职衔，也是简体中文圣经语境中通行且简洁的称呼。
- source_word: σὺν τῷ συνεδρίῳ
  choice: 和公议会一起
  rationale: σύν表达共同参与；συνέδριον在此指犹太人的最高议事和审判机构，“公议会”既保留具体历史所指，也避免泛化为任何普通议会。
- source_word: καταγάγῃ αὐτὸν εἰς ὑμᾶς
  choice: 把那人带下来，到你们这里来
  rationale: 保留κατάγω所含“带下来”的方向意味，同时用“到你们这里来”明确目的地；“那人”承接上下文所指的保罗，但不把原文代词直接替换为专名。
- source_word: ὡς μέλλοντας
  choice: 假称你们要
  rationale: ὡς加分词在本语境中表达对外声称、实际并非如此的意图；“假称”简洁地显出设谋中的托词，而非把它误作真实目的。
- source_word: διαγινώσκειν ἀκριβέστερον
  choice: 更确切地查明
  rationale: διαγινώσκω可指经过审查而查明或判定，ἀκριβέστερον强调更高程度的准确、确切；此译兼顾司法语境和比较级。
- source_word: τὰ περὶ αὐτοῦ
  choice: 有关他的事
  rationale: 贴近原文宽泛表达，不径直限定为“他的案件”，从而避免超出措辞本身的具体化。
- source_word: πρὸ τοῦ ἐγγίσαι αὐτόν
  choice: 在他走近以前
  rationale: 保留ἐγγίζω的空间性“走近、接近”；原文没有明说到达哪一地点，因此正文不补足目的地。
- source_word: τοῦ ἀνελεῖν αὐτόν
  choice: 杀掉他
  rationale: ἀναιρέω在此明确指杀死；“杀掉”直接自然，又不额外加入“谋杀”等评价性词语。
