  text: ἀτενίσας δὲ ⸂ὁ Παῦλος τῷ συνεδρίῳ⸃ εἶπεν· Ἄνδρες ἀδελφοί, ἐγὼ πάσῃ συνειδήσει ἀγαθῇ πεπολίτευμαι τῷ θεῷ ἄχρι ταύτης τῆς ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/001.yaml
  text: And Paul[a], looking intently at the council, said, “Brothers, I have lived before God with an entirely good conscience up to this day.”
translation:
  language: zh_hans
  text: 保罗定睛看着公议会，说：“弟兄们，我直到今天在上帝面前，始终凭着完全无愧的良心行事为人[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我在上帝面前以公民的身份行事。”原文动词可含公民生活或以公民身份行事的意味。
    reason: 保留 πεπολίτευμαι 可能具有的公民语义，而不让这一较不确定的色彩支配正文。
lexical_decisions:
- source_word: ἀτενίσας
  choice: 定睛看着
  rationale: 表达有意识地持续注视，既保留该分词的力度，也符合现代汉语叙事表达。
- source_word: δὲ
  choice: 不单独译出
  rationale: 此处是轻微的叙事连接词；汉语直接承接上文更自然，无须机械译作“于是”或“而”。
- source_word: τῷ συνεδρίῳ
  choice: 议会
  rationale: 在本语境中指犹太人的统治议事机构；采用普通名词译法，避免以音译名称增加解释性。
- source_word: Ἄνδρες ἀδελφοί
  choice: 弟兄们
  rationale: 这是对男性听众的惯用称呼；汉语“弟兄们”自然传达直接呼语，不机械保留双重呼格。
- source_word: πάσῃ συνειδήσει ἀγαθῇ
  choice: 怀着完全无愧的良心
  rationale: 以方式状语表达该与格短语，并用“完全”体现 πάσῃ 的全面、加强语气；“无愧的良心”是自然且庄重的汉语表达。
- source_word: πεπολίτευμαι
  choice: 行事为人
  rationale: 概括该动词在此处“度日、为人、行事”的伦理含义，也能承载完成时对过去直至现在的回顾；其潜在的公民语义另以脚注保留。
- source_word: τῷ θεῷ
  choice: 在上帝面前
  rationale: 表达保罗的生活是在与上帝的关系中、受上帝鉴察而度过；与良心语境相合，同时保留关系与审视意味。
- source_word: ἄχρι ταύτης τῆς ἡμέρας
  choice: 直到今天
  rationale: 清楚表达从过去延续至说话当日的时间界限。
theological_decisions:
- issue: 如何理解保罗用 πεπολίτευμαι 所作的自我陈述
  choice: 译为他在上帝面前一贯如何行事为人的伦理性陈述
  alternative: 译为“在上帝面前尽公民的本分”，突出该动词的公民语义；或把整句理解为绝对无罪的宣称
  rationale: 该动词可能带有公民生活的色彩，但此处与“良心”相连，重点在保罗于上帝面前的生活方式。正文不把公民隐喻绝对化，也不把“无愧的良心”扩展为超出原文的绝对无罪主张。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“定睛看着”“行事为人”“在上帝面前”兼顾经文语体与当代可读性；句序略作汉语化调整，使时间短语和良心陈述清晰自然。
