revisions:
- from: 保罗定睛看着议会，说：“弟兄们，我在上帝面前行事为人[a]，直到今天都怀着完全无愧的良心。”
  to: 保罗定睛看着公议会，说：“弟兄们，我直到今天在上帝面前，始终凭着完全无愧的良心行事为人[a]。”
  rationale: 修订将特定的犹太议事机构译为“公议会”，并重组后半句，使“直到今天”“在上帝面前”“凭着完全无愧的良心”都自然地修饰“行事为人”。脚注删去“尽本分”这一额外解释，改为更贴近原动词的公民身份／生活语感。
