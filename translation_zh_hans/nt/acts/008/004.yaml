  text: Οἱ μὲν οὖν διασπαρέντες διῆλθον εὐαγγελιζόμενοι τὸν λόγον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/004.yaml
  text: So those who had been scattered went through the region proclaiming the word[a][b][c].
translation:
  language: zh_hans
  text: 因此，那些被分散的人到各处去，传扬这道[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “传扬”所译的希腊语动词含有“宣告好消息”的意思；“这道”即有关耶稣的信息。也可译作“宣讲福音信息”。
    reason: 说明动词εὐαγγελίζομαι的“报好消息”语义，并澄清λόγος在本节中的所指及可行译法。
lexical_decisions:
- source_word: Οἱ μὲν οὖν
  choice: 因此，那些……的人
  rationale: οὖν承接上文信徒因迫害而分散的情形，带有推论和推进叙事的作用；μέν在这里主要组织话语，普通话不必另加对应词。
- source_word: διασπαρέντες
  choice: 被分散
  rationale: 这是διασπείρω的简过去时被动分词，表示这些人先因迫害而被迫散开；保留被动形式，也不额外明说施动者。
- source_word: διῆλθον
  choice: 到各处去
  rationale: διέρχομαι在此表示从一处到另一处活动。译作“到各处去”自然地表达其巡行性质，同时不添加原文没有明确说出的“地区”。
- source_word: εὐαγγελιζόμενοι
  choice: 传扬
  rationale: 该分词说明他们一路所做的事，其动词本身含有宣告好消息的意思。“传扬”与宾语“这道”搭配自然，相关语义在脚注中说明。
- source_word: τὸν λόγον
  choice: 这道
  rationale: λόγος在本段语境中指基督信仰的信息，即有关耶稣的信息。“这道”保留路加叙事中简洁而有神学分量的用语；译成“上帝的道”则会加入本节未出现的限定语。
theological_decisions:
- issue: εὐαγγελιζόμενοι τὸν λόγον中“宣告好消息”与“道”的关系
  choice: 传扬这道
  alternative: 宣讲福音信息
  rationale: 希腊文以τὸν λόγον作εὐαγγελιζόμενοι的直接宾语；“传扬这道”保留“道”这一关键词，并避免造出原文没有的所属关系。动词所含“报好消息”的意味则通过脚注交代。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“到各处去”比“走遍各地”更少暗示已经遍及所有地方；“这道”承接上下文，简洁且符合《使徒行传》的叙事用语。
