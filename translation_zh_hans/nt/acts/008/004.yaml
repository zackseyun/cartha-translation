  source_fidelity: 译文准确反映了原文的主要结构和语义：οὖν以“因此”承接上文；被动分词διασπαρέντες译为“被分散的人”，未擅自补出施动者；διῆλθον以“到各处去”表达从一处到另一处的行进；εὐαγγελιζόμενοι τὸν λόγον译为“传扬这道”，保留了“道”为动词直接宾语，避免了将原文误构为“关于这道的好消息”。脚注适当说明εὐαγγελίζομαι所包含的报好消息语义，并将λόγος的具体所指限定为语境中的耶稣信息。
  naturalness: “因此，那些被分散的人到各处去，传扬这道。”在现代标准普通话中自然、简洁，且保有适合经文叙事的庄重语体。“这道”虽带有圣经语域色彩，但在《使徒行传》语境中通顺且能维持路加用语的凝练性。
  terminology: “传扬这道”是对εὐαγγελιζόμενοι τὸν λόγον的稳妥处理：既不把“道”扩写为原文未明说的“上帝的道”，也不因译作“宣讲福音”而完全消隐λόγος。脚注所用“有关耶稣的信息”属于必要的语境说明，不作为正文的额外限定。
