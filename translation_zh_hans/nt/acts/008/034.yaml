base_translation:
  language: en
  yaml_path: translation/nt/acts/008/034.yaml
  text: Then the eunuch answered Philip and said[a], “I ask you, about whom does the prophet say this—about himself or about someone else?”
translation:
  language: zh_hans
  text: 太监对腓利说：“请问[a]，先知说这话，是指谁呢？是指他自己，还是指别人？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “请问”也可译作“我求你”。希腊语原文表达恭敬的请求，也可带有更恳切的语气。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ … εἶπεν
  choice: 太监对腓利说
  rationale: ἀποκριθείς与后面的εἶπεν构成常见的叙事性言语公式；汉语只译作“对……说”即可自然表达回应，不必重复译成“回答……说”。δὲ在此主要推进叙事，无须另加明显转折词。
- source_word: ὁ εὐνοῦχος
  choice: 太监
  rationale: 该词明确指被阉割的男子；“太监”是现代汉语中简明、通行的对应词，也保留了路加对人物身份的具体称呼，而不泛化为“官员”。
- source_word: Δέομαί σου
  choice: 请问
  rationale: δέομαι在此表达郑重而有礼的请求。“请问”符合当前问句语境，既传达礼貌恳求，也避免把语气无根据地强化为哀求。
- source_word: περὶ τίνος
  choice: 是指谁呢
  rationale: περί加属格表示所谈论或所指的对象；结合引用经文的语境，“是指谁”比直译“是关于谁”更自然准确。句末“呢”体现询问语气。
- source_word: ὁ προφήτης λέγει τοῦτο
  choice: 先知说这话
  rationale: 保留定指的“先知”和τοῦτο所指向的刚才那段经文；“说这话”是自然、直接的现代汉语。
- source_word: περὶ ἑαυτοῦ ἢ περὶ ἑτέρου τινός
  choice: 是指他自己，还是指别人
  rationale: 准确保留反身指称与另一人的二选一对比；“别人”自然对应ἑτέρου τινός，且不额外限定其身份。
