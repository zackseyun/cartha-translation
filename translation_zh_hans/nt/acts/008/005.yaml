  text: Φίλιππος δὲ κατελθὼν εἰς ⸀τὴν πόλιν τῆς Σαμαρείας ἐκήρυσσεν αὐτοῖς τὸν χριστόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/005.yaml
  text: Philip went down to the city of Samaria and proclaimed the Messiah to them[a][b].
translation:
  language: zh_hans
  text: 腓利下到撒马利亚城[a][b]，向那里的人宣讲弥赛亚。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“撒马利亚的一座城。”希腊文可理解为撒马利亚地区内的一座城，也可理解为名为“撒马利亚”的城。
    reason: alternative_reading
  - marker: b
    text: 旧译作：“到撒马利亚城去。”
    reason: previous_rendering
lexical_decisions:
- source_word: δὲ
  choice: 不单独译出
  rationale: 这是推进叙事的轻微连接词；现代汉语在本句中省略更自然，且上下文已足以体现叙事承接，不宜增添带有明确时间意味的“这时”。
- source_word: κατελθὼν
  choice: 下到
  rationale: 保留 κατέρχομαι 的方向含义，并把希腊语先行分词自然处理为与主句相连的动作。
- source_word: τὴν πόλιν τῆς Σαμαρείας
  choice: 撒马利亚城
  rationale: 贴近带冠词的“撒马利亚的城”，在简洁自然的汉语中可指撒马利亚地区那座特定的城，也可能被理解为名叫撒马利亚的城；原文可能指该地区某一座城的理解另见脚注。
- source_word: ἐκήρυσσεν
  choice: 宣讲
  rationale: 表达 κηρύσσω 公开宣告、传扬的含义，同时避免过于专门化或口号化的措辞。
- source_word: αὐτοῖς
  choice: 向那里的人
  rationale: 明确与格代词所指的听众；若直译为“向他们”，汉语中缺少紧邻的复数先行词，表达较生硬。
- source_word: τὸν χριστόν
  choice: 弥赛亚
  rationale: 此处有冠词，且处于宣讲内容中，Χριστός 主要作为称号使用；译作“弥赛亚”能保留其犹太受膏者背景。
theological_decisions:
- issue: Χριστός 的称号含义
  choice: 弥赛亚
  alternative: 基督
  rationale: 本句把所宣讲的对象表述为“那位受膏者”，称号意味明显；“弥赛亚”比已经较具专名色彩的“基督”更直接呈现该称号，同时不额外界定腓利宣讲内容的范围。
- issue: “撒马利亚城”的所指
  choice: 正文采用较确定的“撒马利亚城”，脚注保留地区内某一座城的理解
  alternative: 撒马利亚的一座城
  rationale: τὴν πόλιν 带定冠词，支持正文的确定表达；但属格 τῆς Σαμαρείας 仍可指撒马利亚地区，不能排除“一座城”的理解，因此不在正文中消除这一真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“下到”保留地理方向感；“向那里的人”使代词指向在汉语中清楚；脚注标记紧随存在翻译问题的地名短语。
