  yaml_path: translation/nt/acts/008/023.yaml
  text: For I see that you are in the gall of bitterness and the bond of unrighteousness[a][b].
translation:
  language: zh_hans
  text: 因为我看出，你正陷在苦毒的胆汁中[b]，并受不义的束缚[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不义的束缚”也可译作“不义的锁链”或“邪恶的桎梏”。
    reason: lexical_alternative
  - marker: b
    text: “苦毒的胆汁”是鲜明的比喻，可能呼应《旧约》中“胆汁和苦毒”的措辞（参《申命记》29:18七十士译本）。
    reason: cross_reference
lexical_decisions:
- source_word: εἰς
  choice: 处在……中／被……捆绑
  rationale: 在ὁρῶ σε ὄντα这一结构中，εἰς描述所处的状态。前半句用“处在……中”，后半句按汉语习惯用“被……捆绑”，自然表达同一状态关系。
- source_word: γὰρ
  choice: 因为
  rationale: γάρ说明彼得作出前述斥责的缘由；“因为”清楚保留因果衔接。
- source_word: χολὴν πικρίας
  choice: 苦毒的胆汁
  rationale: 保留χολή“胆汁”的鲜明意象及πικρίας的属格关系，不将其弱化为一般的“苦毒”；这一表达也可能呼应《申命记》29:18七十士译本中有毒苦物的意象。
- source_word: σύνδεσμον ἀδικίας
  choice: 被不义捆绑
  rationale: σύνδεσμος指束缚、捆绑之物；ἀδικία在此可指不义、邪恶或不公。“被不义捆绑”符合现代汉语，同时保留道德与属灵状态的广度。
- source_word: ὁρῶ
  choice: 我看出
  rationale: 此处不仅是视觉上的“看见”，也含辨明西门处境之意；“看出”兼顾原词和自然汉语。
- source_word: σε ὄντα
  choice: 你正处在
  rationale: ὁρῶ之后的宾格加分词结构表达所看出的内容；译为“我看出，你正……”自然地呈现西门当下的状态。
theological_decisions:
- issue: 对西门道德与属灵状态的比喻性描述
  choice: 保留“苦毒的胆汁”和“被不义捆绑”两个强烈意象。
  alternative: 解释性地译为“满心恶毒，成了罪的奴隶”或“充满苦毒，被罪辖制”。
  rationale: 原文使用紧凑而含义丰富的比喻，并未明确展开一套关于罪或属灵身份的教义说明。保留意象可维持经文的严厉语气、旧约回响及其真实的解释空间。
- issue: ἀδικία的语义范围
  choice: 译作“不义”。
  alternative: 译作“不公”或“邪恶”。
  rationale: “不义”既可涵盖个人的邪恶，也不排除不公正之意，避免把这里限定为纯社会性不公或某一种特定罪行。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“胆汁”刻意保留原文较陌生、尖锐的比喻；后半句使用“被不义捆绑”以避免“在……捆绑中”的生硬，同时脚注补出更形式对应的译法。所有脚注标记均置于正文。
