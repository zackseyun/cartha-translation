id: ACT.8.18
reference: Acts 8:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ⸀ἰδὼν δὲ ὁ Σίμων ὅτι διὰ τῆς ἐπιθέσεως τῶν χειρῶν τῶν ἀποστόλων δίδοται τὸ ⸀πνεῦμα προσήνεγκεν αὐτοῖς χρήματα
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/018.yaml
  text: But when Simon saw that the Spirit was given through the laying on of the apostles’ hands[a], he offered them money,
translation:
  language: zh_hans
  text: 西门看见圣灵是借着使徒按手赐下的，就拿钱给他们，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδὼν
  choice: 看见
  rationale: 不定过去时分词在此表示先于主句动作发生的情形；汉语用“看见……就……”自然地呈现先后关系。
- source_word: δὲ
  choice: （不单独译出）
  rationale: δέ在此表示叙事推进并略带转折；汉语借“……就……”的句式自然衔接，无须机械加“但是”。
- source_word: διὰ τῆς ἐπιθέσεως τῶν χειρῶν τῶν ἀποστόλων
  choice: 借着使徒按手
  rationale: διά加属格表示途径或媒介；“按手”是自然、简洁且符合上下文的汉语表达，同时不把使徒说成圣灵的终极赐予者。
- source_word: δίδοται
  choice: 赐下
  rationale: 现在时被动式置于过去叙事中，汉语按叙事语境译为“赐下”；保留被动含义而不增添施事者。
- source_word: τὸ πνεῦμα
  choice: 圣灵
  rationale: 希腊文直译为“那灵”，但紧接前文8:15、17可明确判断所指为圣灵；现代汉语用“圣灵”最自然，也避免“灵”单独出现时可能产生的歧义。
- source_word: προσήνεγκεν αὐτοῖς χρήματα
  choice: 就拿钱给他们
  rationale: προσφέρω在此指拿出、递上或给予钱财；“拿钱给他们”比“献上钱”更符合西门企图以钱换取能力的具体语境，且不引入敬拜或奉献意味。
theological_decisions:
- issue: τὸ πνεῦμα的所指
  choice: 圣灵
  alternative: 那灵／灵
  rationale: 原文虽只写τὸ πνεῦμα，但上下文明确指向圣灵。汉语直接译“圣灵”属于语境明示，而不是增加不同的神学内容。
- issue: 赐下圣灵时使徒按手的作用
  choice: 圣灵是借着使徒按手赐下的
  alternative: 使徒按手赐下圣灵
  rationale: 保留διά所表达的媒介关系和δίδοται的被动语态，不将使徒表述为圣灵的终极来源，也不在本节之外推导圣礼性或非圣礼性的结论。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“看见……就……”使动作顺序清楚；句末保留逗号，以衔接下一节西门提出的请求。
