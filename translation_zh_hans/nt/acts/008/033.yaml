  text: ἐν τῇ ⸀ταπεινώσει ἡ κρίσις αὐτοῦ ἤρθη· ⸀τὴν γενεὰν αὐτοῦ τίς διηγήσεται; ὅτι αἴρεται ἀπὸ τῆς γῆς ἡ ζωὴ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/033.yaml
  text: In his humiliation justice was taken away from him[b][a]. Who will recount his generation? For his life is taken from the earth.
translation:
  language: zh_hans
  text: 他受屈辱时，公正的审判被剥夺了[a]。至于他的世代，谁能述说呢[b]？因为他的生命从地上被夺去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他的审判被撤去了。”
    reason: lexical_alternative
  - marker: b
    text: “他的世代”也可理解为“他的后代”或“与他同时代的人”；希腊文保留了《以赛亚书》五十三章引文中的歧义。
    reason: alternative_reading
lexical_decisions:
- source_word: ταπεινώσει
  choice: 受屈辱时
  rationale: 该词表示卑微、受压低或受屈辱的处境；译为“受屈辱时”既自然，也保留受苦与降卑的含义。
- source_word: κρίσις
  choice: 公道
  rationale: 此处可指审判、司法裁决或应得的公正待遇。“公道被夺去”在现代汉语中自然地表达他未获公正对待，同时保留司法意味。
- source_word: ἤρθη
  choice: 被夺去了
  rationale: 被动形式表示某物遭移除或剥夺；“被夺去了”明确传达损失与剥夺。
- source_word: γενεὰν
  choice: 世代
  rationale: γενεά 可指世代、后代或同时代的人。“世代”保留《以赛亚书》引文中的真实歧义，不在正文中替读者作出解释性选择。
- source_word: διηγήσεται
  choice: 述说
  rationale: 该动词指详细讲述或叙说；“述说”简洁、庄重，适合反问句。
- source_word: αἴρεται
  choice: 被夺去
  rationale: 现在时被动形式带有鲜明的叙述感；中文不必机械标示时态，“被夺去”保留被动与除去之意。
- source_word: γῆς
  choice: 地上
  rationale: 在“生命从……被夺去”的表达中，“地上”自然地指人世或地上的生命领域，也符合引文语境。
- source_word: ζωὴ
  choice: 生命
  rationale: 此处直接指他的生命被除去；“生命”准确而庄重。
theological_decisions:
- issue: “他的世代”（τὴν γενεὰν αὐτοῦ）的解释
  choice: 正文保留“他的世代”这一形式上含混的表达
  alternative: 可理解为“他的后代”或“与他同时代的人”
  rationale: 这一《以赛亚书》引文的短语本身难解，可能涉及后代、同时代的人或其世代。保留“世代”可避免在正文中消除原文的神学与释义张力。
- issue: κρίσις 的含义
  choice: 译为“公道”
  alternative: 可译为“审判”或“裁决”
  rationale: 语境强调他在受屈辱时被剥夺公正待遇。“公道”能自然传达司法与道德层面的亏缺；脚注同时保留较形式对应的“审判”译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“公道被夺去”比“正义被拿走”更符合汉语习惯；“他的世代”虽略带引文式语感，但为保留原文歧义而有意采用，并以脚注说明可能含义。
