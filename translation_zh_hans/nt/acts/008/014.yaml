  text: Ἀκούσαντες δὲ οἱ ἐν Ἱεροσολύμοις ἀπόστολοι ὅτι δέδεκται ἡ Σαμάρεια τὸν λόγον τοῦ θεοῦ, ἀπέστειλαν πρὸς ⸀αὐτοὺς Πέτρον καὶ Ἰωάννην,
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/014.yaml
  text: When the apostles in Jerusalem heard that Samaria had received the word of God, they sent Peter and John to them,
translation:
  language: zh_hans
  text: 在耶路撒冷的使徒听说撒玛利亚领受了神的道，就差派彼得和约翰到他们那里去。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀκούσαντες δὲ
  choice: 听说……就
  rationale: 不定过去时分词交代主句行动之前的情形；“听说……就……”自然表达先后关系。δέ在此是轻微的叙事衔接，中文无需另加“如今”或“但是”。
- source_word: οἱ ἐν Ἱεροσολύμοις ἀπόστολοι
  choice: 耶路撒冷的使徒
  rationale: 简洁自然地表达这些使徒当时在耶路撒冷，并不将其解释为特殊类别或固定称号。
- source_word: δέδεκται
  choice: 领受了
  rationale: 完成时表示已经接受且结果仍然有效；“领受”既贴合δέχομαι，也符合现代中文的圣经语体。
- source_word: ἡ Σαμάρεια
  choice: 撒玛利亚
  rationale: 保留原文地名借代当地居民的表达，不缩窄为“撒玛利亚人”或明确扩展为“撒玛利亚地区”。
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: 神的道
  rationale: 保留λόγος的传统且有神学分量的表达；在这里指所传讲、来自神的信息，但正文不以“信息”作解释性改写。
- source_word: ἀπέστειλαν
  choice: 差派
  rationale: 准确表达有目的地派遣彼得和约翰；比一般的“送”更适合此处语境。
- source_word: πρὸς αὐτοὺς
  choice: 到他们那里去
  rationale: 表达πρός加宾格所指的方向；“他们”承接由“撒玛利亚”借代的当地居民。
- source_word: Πέτρον καὶ Ἰωάννην
  choice: 彼得和约翰
  rationale: 采用现代中文圣经中通行的人名译法。
theological_decisions:
- issue: “撒玛利亚”的借代用法
  choice: 保留“撒玛利亚领受了神的道”
  alternative: 译作“撒玛利亚人领受了神的道”或“撒玛利亚地区领受了神的道”
  rationale: 希腊文以地名作主语，集合性地指当地居民。保留这种表达更贴近原文，也避免将所指不必要地限定为族群或地域。
- issue: λόγος译为“道”还是“信息”
  choice: 神的道
  alternative: 神的信息
  rationale: “神的道”保留原文措辞及其经文传统中的神学意涵，同时在上下文中自然指神所传出的信息。
- issue: 本节与圣灵领受次序的关系
  choice: 仅陈述撒玛利亚已经领受神的道以及使徒随后受差派
  alternative: 在译文中加入关于归信、洗礼或领受圣灵之次序的解释
  rationale: 本节本身未说明使徒被差派的全部目的，也未建立普遍性的教义次序；译文不应预先替后文解决这一张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“领受”“神的道”“差派”保持适度的圣经语体，但句法自然简洁。原文地名借代居民所造成的轻微张力予以保留。
