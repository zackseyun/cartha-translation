  text: Εἶπεν δὲ ὁ Φίλιππος, Εἰ πιστεύεις ἐξ ὅλης τῆς καρδίας, ἔξεστιν. Ἀποκριθεὶς δὲ εἶπεν, Πιστεύω τὸν υἱὸν τοῦ θεοῦ εἶναι τὸν Ἰησοῦν Χριστόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/037.yaml
  text: And Philip[a] said, “If you believe with all your heart, you may.” And he answered and said, “I believe that Jesus is the Messiah, the Son of God.”
translation:
  language: zh_hans
  text: 腓利[a]说：“你若全心相信，就可以。”他回答说：“我相信耶稣基督是上帝的儿子。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节不见于现存最早的希腊文抄本，包括三世纪的纸草抄本以及四世纪的《西奈抄本》和《梵蒂冈抄本》，早期科普特文译本也没有本节；但拜占庭多数文本传统和拉丁文传统收录了它，二世纪末的爱任纽以及三世纪的居普良等早期教父也曾引用类似内容。学者常认为，这是一段早期洗礼礼仪中的问答，后来被纳入《使徒行传》的叙事正文。
    reason: textual_critical
lexical_decisions:
- source_word: ἔξεστιν
  choice: 就可以
  rationale: 该无人称动词表示获准或可行；这里承接求受洗的请求，用“就可以”自然表达允许受洗，而不过分法律化。
- source_word: ἐξ ὅλης τῆς καρδίας
  choice: 全心
  rationale: 保留“心”这一圣经意象，并以现代汉语常用的“全心”表达完全、真诚的信靠。
- source_word: Πιστεύω
  choice: 我相信
  rationale: 在信仰告白语境中，“相信”既准确对应动词 πιστεύω，也自然表达对耶稣身份的承认与信靠。
- source_word: τὸν Ἰησοῦν Χριστόν
  choice: 耶稣基督
  rationale: 希腊文把 Ἰησοῦν Χριστόν 作为完整宾语置于间接陈述中；“耶稣基督”保留其常见称谓形式，并避免为配合英语修订而改变原文句法。
- source_word: τὸν υἱὸν τοῦ θεοῦ
  choice: 上帝的儿子
  rationale: 直译这一身份称号；“上帝”符合现代标准普通话的庄重公共表达。
theological_decisions:
- issue: Χριστός 在本句中应译作称号“弥赛亚”还是与 Ἰησοῦς 合译为“耶稣基督”
  choice: 耶稣基督
  alternative: 耶稣是弥赛亚，是上帝的儿子
  rationale: 原文结构是“我相信耶稣基督是上帝的儿子”，其中 τὸν Ἰησοῦν Χριστόν 整体作宾语，τὸν υἱὸν τοῦ θεοῦ 作表语。译作“耶稣基督”最直接保留该句法，不额外把“弥赛亚”变成与“上帝的儿子”并列的表语。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准普通话。“全心相信，就可以”简洁承接上文关于受洗的请求；保留原文“回答说”的叙事形式。正文脚注标记紧随“腓利”，与所提供的审校层位置一致。
