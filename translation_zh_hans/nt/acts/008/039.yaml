source:
  edition: SBLGNT
  text: ὅτε δὲ ἀνέβησαν ἐκ τοῦ ὕδατος, πνεῦμα κυρίου ἥρπασεν τὸν Φίλιππον, καὶ οὐκ εἶδεν αὐτὸν οὐκέτι ὁ εὐνοῦχος, ἐπορεύετο γὰρ τὴν ὁδὸν αὐτοῦ χαίρων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/039.yaml
  text: And when they came up out of the water[a], the Spirit of the Lord carried Philip away, and the eunuch saw him no longer, for he went on his way rejoicing.
translation:
  language: zh_hans
  text: 他们从水里上来时，主的灵把腓利带走了[a]。太监再也没有见到他了，便欢欢喜喜地继续上路。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“突然把腓利夺走了。”原文动词可强调迅速而有力地移走。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβησαν ἐκ τοῦ ὕδατος
  choice: 从水里上来
  rationale: 保留ἀναβαίνω与ἐκ所表达的从水中向上、向外移动的空间意义，同时不对洗礼的具体方式作额外推断。
- source_word: πνεῦμα κυρίου
  choice: 主的灵
  rationale: 在《路加福音—使徒行传》的语境中，此短语自然指亲自施行神圣作为的主之灵；译文不增添原文没有的称谓。
- source_word: ἥρπασεν
  choice: 把腓利带走了
  rationale: 正文以自然庄重的现代汉语表达腓利因神圣介入而被移走；该动词所含突然、强力攫取的语气在脚注中保留。
- source_word: οὐκ εἶδεν αὐτὸν οὐκέτι
  choice: 再也看不见他
  rationale: 准确表达从此以后太监不再见到腓利，符合现代汉语叙事习惯。
- source_word: ὁ εὐνοῦχος
  choice: 太监
  rationale: 直接对应原文明确使用的身份称呼，并保持与上文人物指称的一致。
- source_word: ἐπορεύετο τὴν ὁδὸν αὐτοῦ
  choice: 继续上路
  rationale: 未完成时表示行程仍在持续；此处ὁδός指所走的路程，而非仅强调实体道路。
- source_word: χαίρων
  choice: 欢欢喜喜地
  rationale: 以自然汉语保留现在分词所表达的伴随状态，说明他继续赶路时充满喜乐。
- source_word: γάρ
  choice: 便
  rationale: γάρ在此承接并解释太监未再见腓利后仍继续行程的叙事发展；汉语若直译为“因为”会造成不自然甚至误导性的因果关系，故按语篇功能译为“便”。
theological_decisions:
- issue: πνεῦμα κυρίου是指圣灵，还是来自主的非人格力量
  choice: 译作“主的灵”，体现有位格的神圣行动者
  alternative: 理解为来自主的一种非人格力量
  rationale: 《路加福音—使徒行传》的通常用法支持这是主的灵亲自施行作为；译文保持原文称谓，不另加“圣”字来扩大措辞。
- issue: ἥρπασεν是否应明确译出神迹式的突然移走
  choice: 正文译作“把腓利带走了”，由主的灵这一主语显明神圣介入
  alternative: 译作“突然把腓利夺走了”，更突出迅猛、强力的意味
  rationale: 正文兼顾清楚、庄重与自然，不淡化事件的超自然性质；原动词较强的力度则以脚注保留，避免把某一种动作图景写死。
translation_notes:
  register: 采用现代、庄重而通顺的简体中文。“从水里上来”保留空间表达而不预设洗礼方式；“继续上路”符合叙事语体；脚注明示ἁρπάζω较强的语气。
