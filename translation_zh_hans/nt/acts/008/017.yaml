base_translation:
  language: en
  yaml_path: translation/nt/acts/008/017.yaml
  text: Then they laid their hands on them, and they were receiving the Holy Spirit.
translation:
  language: zh_hans
  text: 于是，他们给这些人按手，这些人便领受了圣灵。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 两个希腊语动词均为未完成时。较形式化地也可译为：“那时，他们正在给这些人按手，这些人也正在领受圣灵。”未完成体可描绘进行、持续或反复的情景；正文按汉语叙事习惯译出。
    reason: 保留两个未完成时可能表达的进行、持续或反复意味，且不在正文中把具体情景固定为“逐一”或“不断”。
lexical_decisions:
- source_word: τότε
  choice: 于是
  rationale: 表示叙事中的时间推进及前后承接；“于是”在现代汉语中自然地呈现接下来发生的事，又不额外强调因果关系。
- source_word: ἐπετίθεσαν τὰς χεῖρας ἐπ’ αὐτούς
  choice: 他们给这些人按手
  rationale: “按手”是现代中文圣经语境中自然且庄重的固定表达。“给这些人”明确动作的对象，也避免连续使用多个“他们”造成指代含混。
- source_word: ἐλάμβανον
  choice: 便领受了
  rationale: “领受”贴合 λαμβάνω 在此处接受神所赐之物的语境；“便”表现其与按手在叙事中的紧密衔接。汉语以“了”自然叙述已发生的事件；希腊语未完成体可能包含的持续或反复意味在脚注中保留。
- source_word: πνεῦμα ἅγιον
  choice: 圣灵
  rationale: 在《路加福音—使徒行传》的语境中，此语指神所赐的圣灵。现代汉语通常不需冠词，译作“圣灵”即可明确表达该所指，而不会误解为泛指的“一个圣洁的灵”。
theological_decisions:
- issue: πνεῦμα ἅγιον 是指神的圣灵，还是泛指某个圣洁的灵
  choice: 圣灵
  alternative: 一个圣洁的灵
  rationale: 本节紧接使徒为撒玛利亚信徒祈求领受圣灵的上下文，所指是神所赐的圣灵；译作“一个圣洁的灵”会误导读者。
- issue: 如何体现两个未完成时动词的体貌
  choice: 正文采用自然的汉语叙事表达，并以脚注说明持续或反复的可能意味
  alternative: 正文译为“他们不断给这些人按手，这些人也不断领受圣灵”
  rationale: 两个希腊语动词均为未完成时，可能描绘持续或逐次发生的场景，但原文并未明说“不断”或“逐一”。正文不把这种解释固定下来，脚注则保留其体貌信息和真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“给这些人按手”比直译“把手放在他们身上”更符合中文基督教语境中的习惯表达；重复“这些人”是为消除两个复数代词可能造成的指代歧义。
