  yaml_path: translation/nt/acts/008/008.yaml
  text: And there was great joy in that city.
translation:
  language: zh_hans
  text: 那城里有极大的喜乐。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγένετο
  choice: 充满了
  rationale: 这里的“ἐγένετο + 主格名词”表示一种情形出现、存在。结合地点短语，译为“城里充满了喜乐”符合现代汉语表达，也传达喜乐广泛而显著的状态。
- source_word: δὲ
  choice: 于是
  rationale: δέ在此承接上文叙事，并呈现前述医治与释放所带来的结果；“于是”自然连接上下文，但不赋予过强的逻辑含义。
- source_word: πολλὴ χαρά
  choice: 充满了喜乐
  rationale: πολλή修饰抽象名词χαρά，表示程度或数量很大。汉语用“充满了喜乐”比“有大喜乐”更自然，同时保留其强度。
- source_word: ἐν τῇ πόλει ἐκείνῃ
  choice: 那城里
  rationale: πόλις指上文提到的城，ἐκείνῃ具有指示作用；“那城里”简洁、自然，并准确限定喜乐发生的地点。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“喜乐”保留经文语体及χαρά的积极宗教语感，又不额外说明喜乐的主体或神学原因。
