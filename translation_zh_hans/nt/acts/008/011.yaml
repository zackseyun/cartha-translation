  - severity: medium
    issue: “魔术”不适合作为μαγείαις的正文对应。
    rationale: 现代汉语“魔术”主要指娱乐性表演或戏法；原文指魔法性实践，但本节不界定其机制。用“法术”可较中性地保留这一范围。
