  naturalness: “他们一直留意他，因为他曾长期用法术使他们惊奇”是自然、现代而庄重的叙事汉语。“曾长期”表达先前持续发生、与随后持续关注相关的情状，避免“长久以来一直”的重复。
  terminology: 以“法术”对应μαγείαις，避免“魔术”的表演戏法联想，也不以“邪术”在正文中预先加强道德或形上判断。脚注保留“魔法”和“巫术”作为可行替代。
