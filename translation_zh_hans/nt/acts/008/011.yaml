base_translation:
  language: en
  yaml_path: translation/nt/acts/008/011.yaml
  text: And they paid attention to him because for a considerable time he had amazed them with his magic arts[a][b].
translation:
  language: zh_hans
  text: 他们一直留意他，因为他曾长期用法术[a][b]使他们惊奇。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“相当长的一段时间”。
    reason: lexical_alternative
  - marker: b
    text: “法术”或译：“魔法”或“巫术”。
    reason: lexical_alternative
lexical_decisions:
- source_word: προσεῖχον
  choice: 一直听从
  rationale: 该未完成时动词表示持续地留意、听从某人；结合上下文，不仅是观看，也含重视其言行之意。
- source_word: αὐτῷ
  choice: 他
  rationale: 作 προσέχω 的与格宾语，汉语自然表达为“听从他”。
- source_word: διὰ τὸ ἱκανῷ χρόνῳ
  choice: 因为他长久以来
  rationale: διά 加冠词不定式表示原因；ἱκανῷ χρόνῳ 指相当长的一段时间，以“长久以来”自然表达其持续性。
- source_word: ταῖς μαγείαις
  choice: 用魔术
  rationale: μαγεία 指魔法或巫术活动；“魔术”在现代汉语中自然可懂，但可能让人联想到表演性戏法，故以脚注保留“邪术”这一译法。
- source_word: ἐξεστακέναι
  choice: 一直……使……惊奇
  rationale: 完成时不定式表示先前造成、且效果延续的惊异；结合时间短语，在汉语中用“一直……使他们惊奇”表达这种持续影响。
- source_word: αὐτούς
  choice: 他们
  rationale: 指前文所说的众人，是 ἐξεστακέναι 的宾语。
theological_decisions:
- issue: μαγείαις 所指行为的性质
  choice: 译作“魔术”，不判定这些行为究竟是骗术、超自然的邪术，还是二者兼有
  alternative: 邪术
  rationale: 本节只称其为 μαγεία，并描述它使众人惊奇的效果，没有进一步界定其实际机制；正文与脚注共同保留这种张力。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。“一直听从”体现未完成时的持续性；两个脚注标记均置于正文相应信息之后。
