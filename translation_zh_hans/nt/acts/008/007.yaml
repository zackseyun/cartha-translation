  naturalness: “被污灵附着的人”可以理解，但现代普通话中用于灵体附身的搭配略显生硬。“有污灵的人身上的污灵”既自然清楚，也避免把原文较宽泛的“有污灵”具体化为某一种附着机制。删去“也”后，第二分句的协调关系更简洁。
  terminology: “污灵”恰当保留“unclean”的措辞特色，宜维持。“得了医治”适合本句被动、庄重的叙事语体。“瘫痪的”和“瘸腿的”清楚且符合现代用语。
