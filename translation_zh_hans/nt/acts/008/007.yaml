  text: ⸀πολλοὶ γὰρ τῶν ἐχόντων πνεύματα ἀκάθαρτα βοῶντα φωνῇ μεγάλῃ ⸀ἐξήρχοντο, πολλοὶ δὲ παραλελυμένοι καὶ χωλοὶ ἐθεραπεύθησαν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/007.yaml
  text: For many who had unclean spirits[a], they came out crying with a loud voice; and many who were paralyzed and lame were healed.
translation:
  language: zh_hans
  text: 因为许多有污灵的人身上的污灵大声喊叫着出来了；又有许多瘫痪的和瘸腿的得了医治。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλοὶ γὰρ τῶν ἐχόντων
  choice: 因为许多被……附着的人
  rationale: γάρ承接上文，译为“因为”；此处属格结构指拥有污灵、即受其侵扰的人。中文用“被……附着”自然交代人与灵的关系，也为后文“从他们身上出来”提供清楚的指向。
- source_word: πνεύματα ἀκάθαρτα
  choice: 污灵
  rationale: “污灵”简洁保留ἀκάθαρτα的礼仪与道德不洁意味，也是现代中文圣经语境中易懂的表达；不扩译为“邪灵”，以免抹去原词的措辞特色。
- source_word: βοῶντα φωνῇ μεγάλῃ
  choice: 大声喊叫着
  rationale: 保留分词所表达的伴随动作，并按中性复数一致关系明确由污灵发声。
- source_word: ἐξήρχοντο
  choice: 从他们身上出来了
  rationale: 未完成时在叙事中概括许多个案发生的动作；中文用“出来了”自然表达赶鬼场景，并补出“从他们身上”以消除主语和来源的歧义。
- source_word: παραλελυμένοι
  choice: 瘫痪的
  rationale: 表达完成被动分词所指的持续身体状态，措辞现代而清楚。
- source_word: χωλοὶ
  choice: 瘸腿的
  rationale: 准确表达行走障碍，相比单字“瘸的”更自然、明确。
- source_word: ἐθεραπεύθησαν
  choice: 得了医治
  rationale: 保留被动意义，不在本分句中另行指定施行医治者；“得了医治”符合庄重而通俗的叙事语体。
theological_decisions:
- issue: 喊叫并出来的是污灵还是受附者
  choice: 将污灵明确作为“大声喊叫”和“出来”的主体
  alternative: 受污灵附着的人喊叫，而污灵从他们身上出来
  rationale: 中性复数分词βοῶντα在语法上自然与中性复数πνεύματα ἀκάθαρτα一致，因此喊叫者是污灵。中文重复“污灵”以避免代词指向不明。
- issue: 污灵与人的关系如何表述
  choice: 被污灵附着的人
  alternative: 有污灵的人
  rationale: 原文直译为“有污灵的人”，但现代中文可能被误解为一般性拥有；“被污灵附着”按语境清楚表达受其控制或侵扰，同时不细化其具体机制。
translation_notes:
  register: 采用现代、庄重且适合公开诵读的叙事中文。首句适度重组希腊语属格结构，明确污灵是喊叫并出来的主体；保留“因为”与上文的解释关系，并以“还有”自然推进第二组医治事例。
