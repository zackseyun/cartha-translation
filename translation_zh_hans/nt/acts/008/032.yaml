  text: ἡ δὲ περιοχὴ τῆς γραφῆς ἣν ἀνεγίνωσκεν ἦν αὕτη· Ὡς πρόβατον ἐπὶ σφαγὴν ἤχθη, καὶ ὡς ἀμνὸς ἐναντίον τοῦ ⸀κείραντος αὐτὸν ἄφωνος, οὕτως οὐκ ἀνοίγει τὸ στόμα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/032.yaml
  text: 'The passage of Scripture that he was reading was this: “Like a sheep he was led to slaughter[a], and like a lamb before the one shearing it is silent[b], so he does not open his mouth.”'
translation:
  language: zh_hans
  text: 他所读的那段经文是这样：“他像羊被牵去宰杀[a]，又像羔羊在给它剪毛的人面前默不作声[b]；他也照样不开口。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“被牵到宰杀之处”。
    reason: 原文ἐπὶ σφαγήν可理解为朝向宰杀，也可较具体地表达为到宰杀之处。
  - marker: b
    text: 或译“在剪毛者面前静默无声”；希腊文直译为“在剪它毛的人面前无声”。
    reason: 说明分词结构及ἄφωνος较贴近字面的译法。
lexical_decisions:
- source_word: περιοχὴ τῆς γραφῆς
  choice: 那段经文
  rationale: περιοχή在这里指正在诵读的一段特定经文；“那段经文”符合现代汉语习惯，也保留了“圣经中的一段”这一含义。
- source_word: ἀνεγίνωσκεν
  choice: 所读的
  rationale: 未完成时表示当时正在进行的阅读；结合上文，“他所读的”在汉语中自然地承接该持续动作。
- source_word: Ὡς πρόβατον ἐπὶ σφαγὴν ἤχθη
  choice: 他像羊被牵去宰杀
  rationale: 保留ὡς的明喻、ἤχθη的被动意义，以及朝向宰杀的动态；“羊”与下文“羔羊”也保持原文的词汇区别。
- source_word: ἀμνὸς
  choice: 羔羊
  rationale: ἀμνός特指幼羊，译作“羔羊”以区别于较宽泛的πρόβατον“羊”。
- source_word: ἐναντίον τοῦ κείραντος αὐτὸν
  choice: 在给它剪毛的人面前
  rationale: 贴近原文“在剪它毛的那人面前”的分词结构，同时采用自然、清楚的现代汉语。
- source_word: ἄφωνος
  choice: 默不作声
  rationale: 这里不是强调生理上不能发声，而是描写羔羊保持沉默；“默不作声”准确且庄重。
- source_word: οὕτως οὐκ ἀνοίγει τὸ στόμα αὐτοῦ
  choice: 他也这样不开口
  rationale: “这样”承接前面的比喻，并保留ἀνοίγει的现在时表达，不将经文引语改成过去时。
theological_decisions:
- issue: 以赛亚书53章的引文在上下文中指向耶稣
  choice: 本节只按引文形式呈现受苦者的比喻，不在译文中直接加上“耶稣”或“弥赛亚”
  alternative: 在本节明说这是指耶稣这位受苦的仆人
  rationale: 后续叙事会说明腓利如何从这段经文传讲耶稣；本节本身只引述经文，因此不提前消除原有的叙事推进与指代张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语；引文保持诗性排比，用“羊／羔羊”保留原文词汇差异，并以分号清楚呈现比喻与结论。
