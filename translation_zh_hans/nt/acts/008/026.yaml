  text: Ἄγγελος δὲ κυρίου ἐλάλησεν πρὸς Φίλιππον λέγων· Ἀνάστηθι καὶ πορεύου κατὰ μεσημβρίαν ἐπὶ τὴν ὁδὸν τὴν καταβαίνουσαν ἀπὸ Ἰερουσαλὴμ εἰς Γάζαν· αὕτη ἐστὶν ἔρημος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/026.yaml
  text: An angel of the Lord spoke to Philip[a], saying[b], “Get up and go south to the road that goes down from Jerusalem to Gaza.” This is a deserted road.
translation:
  language: zh_hans
  text: 主的一位天使对腓利说：“起来，往南[a]走，到那条从耶路撒冷下到迦萨的路上去。”这条路很荒僻[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在正午”。这个希腊语短语既可指方向“南方”，也可指时间“正午”。
    reason: alternative_reading
  - marker: b
    text: 或译“这是旷野”，可能是说这条路线经过荒野，而不一定是强调道路本身荒僻。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄγγελος δὲ κυρίου
  choice: 主的一位天使
  rationale: Ἄγγελος为无冠词单数，在此自然表达为“一位天使”；κυρίου译作“主的”，保留神圣权柄的含义。δὲ仅作轻微叙事衔接，现代汉语中无需机械译出。
- source_word: ἐλάλησεν πρὸς Φίλιππον λέγων
  choice: 对腓利说
  rationale: 汉语用一个引述结构即可自然涵盖限定动词“说话”和分词“说着”，避免生硬重复。
- source_word: Ἀνάστηθι καὶ πορεύου
  choice: 起来，……走
  rationale: 简洁传达两个命令及立即行动的语气。
- source_word: κατὰ μεσημβρίαν
  choice: 向南
  rationale: μεσημβρία既可表示方向“南方”，也可表示时间“正午”；与行进命令连用时，方向义较合语境，同时以脚注保留时间义。
- source_word: ἐπὶ τὴν ὁδὸν
  choice: 到……路上去
  rationale: 自然表达朝向并抵达特定道路的行动。
- source_word: τὴν καταβαίνουσαν ἀπὸ Ἰερουσαλὴμ εἰς Γάζαν
  choice: 那条从耶路撒冷下到迦萨的路
  rationale: “下到”保留从地势较高的耶路撒冷下行这一常见地理表达。
- source_word: αὕτη ἐστὶν ἔρημος
  choice: 这条路很荒僻
  rationale: 阴性指示代词最自然地回指阴性名词ὁδός；“荒僻”传达无人居住、少有人行的含义，又不把可能的“旷野”义排除在脚注之外。
theological_decisions:
- issue: “主的天使”中“主”及天使的身份
  choice: 按原文译为“主的一位天使”，只表达这位天使属于主或奉主差遣
  alternative: “神所差来的天使”，或把它理解为一位特定的启示性形象
  rationale: 原文表明其神圣来源或隶属关系，却没有进一步界定其身份；译文不作超出文本的神学认定。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言；省略无须在汉语中明说的轻微连接词δὲ，并把λέγων融入自然的直接引语结构。脚注标记紧跟各自所说明的词语。
