  naturalness: “他们下去后，就为那些人祷告，好让他们领受圣灵。”在现代标准汉语中流畅、庄重且清楚。以“他们”承接上文比逐字复制关系代词结构更自然；“那些人”能清晰区别祷告者与代祷对象。
