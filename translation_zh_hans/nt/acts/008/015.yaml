id: ACT.8.15
reference: Acts 8:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οἵτινες καταβάντες προσηύξαντο περὶ αὐτῶν ὅπως λάβωσιν πνεῦμα ἅγιον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/015.yaml
  text: who came down and prayed for them so that they might receive the Holy Spirit[a][b].
translation:
  language: zh_hans
  text: 他们下去后[a]，就为那些人祷告，好让他们领受圣灵。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “下去后”也可译作“下去，就……”，将分词与主要动词表达为连续动作。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: 他们
  rationale: 承接上一节所说的彼得和约翰。现代汉语不宜生硬照搬希腊语关系从句，用“他们”衔接自然，也不增添原文没有的信息。
- source_word: καταβάντες
  choice: 下去后
  rationale: 不定过去时分词通常表示先于主要动词发生的动作；“下去后”清楚保留先下去、再祷告的时间次序。
- source_word: προσηύξαντο
  choice: 祷告
  rationale: 准确表达 προσεύχομαι，汉语无需另行体现其中间语态形式。
- source_word: περὶ αὐτῶν
  choice: 为那些人
  rationale: 在祷告语境中，περί 加属格表示为他人代求；“为那些人”既自然，又清楚区分祷告者和受益者。
- source_word: ὅπως
  choice: 好让
  rationale: 表达祷告的目的或所求结果，保留原文的目的关系，同时符合现代汉语表达。
- source_word: λάβωσιν
  choice: 领受
  rationale: 对应不定过去时虚拟式；“领受”是现代汉语基督教语境中自然且庄重的说法。目的关系已由“好让”表达，无需另加表示不确定性的词。
- source_word: πνεῦμα ἅγιον
  choice: 圣灵
  rationale: 按《使徒行传》的叙事语境，此处指上帝所赐的圣灵，而非泛指某个圣洁的灵；汉语专名通常不需冠词。
theological_decisions:
- issue: πνεῦμα ἅγιον 是泛指“圣洁的灵”，还是指神圣位格圣灵
  choice: 圣灵
  alternative: 一个圣洁的灵
  rationale: 本段及《使徒行传》的整体语境所指是赐给信徒的圣灵。“圣灵”准确识别语境中的所指，但不在经文之外扩展关于领受圣灵方式或次序的教义。
- issue: ὅπως λάβωσιν 是否应译成带有额外不确定意味的表达
  choice: 好让他们领受
  alternative: 使他们或许能领受
  rationale: 虚拟式在 ὅπως 引导的目的从句中属于正常句法；译文表达目的即可，不额外暗示祷告是否会蒙应允。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“下去后”保留动作先后关系；“为那些人祷告”明确代求含义；“领受圣灵”符合本段语境，同时不把关于圣灵赐予的系统神学结论加入经文。
