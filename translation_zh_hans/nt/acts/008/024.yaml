  naturalness: 整体庄重自然，但“你们所说的事有一样临到我”搭配略显生硬；以“你们所说的事有任何一件临到我”更合现代标准汉语，也更清楚体现μηδέν与属格关系结构的“所说诸事中没有一件”。
