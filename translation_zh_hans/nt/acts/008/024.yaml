  rationale: 仅作汉语表达的轻微润饰，将“有一样”改为“有任何一件”，使否定范围及“在你们所说的事中”的关系更清晰自然。其余译文忠实保留原文的语义、语体和“主”的未定所指，无须增补脚注。
