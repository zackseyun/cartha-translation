  text: ἀποκριθεὶς δὲ ὁ Σίμων εἶπεν· Δεήθητε ὑμεῖς ὑπὲρ ἐμοῦ πρὸς τὸν κύριον ὅπως μηδὲν ἐπέλθῃ ἐπ’ ἐμὲ ὧν εἰρήκατε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/024.yaml
  text: But Simon answered[a], “You pray to the Lord for me, so that nothing of what you have said may come upon me.”
translation:
  language: zh_hans
  text: 西门却回答说：“请你们为我向主祈求，免得你们所说的事有任何一件临到我。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Σίμων εἶπεν
  choice: 西门却回答说
  rationale: ἀποκριθείς与εἶπεν构成引出回应的惯用表达；译作“回答说”自然保留回应意味。δέ在彼得的责备与西门的回应之间形成轻微转折，故译“却”。
- source_word: Δεήθητε ὑμεῖς
  choice: 请你们……祈求
  rationale: Δεήθητε是祈求、代求之意；显式代词ὑμεῖς带有强调，译文以“请你们”突出西门要彼得和约翰替他祈求。
- source_word: ὑπὲρ ἐμοῦ πρὸς τὸν κύριον
  choice: 为我向主祈求
  rationale: ὑπὲρ ἐμοῦ表示代表某人或为某人代求；πρός表示祈求所朝向的对象。此处依中文习惯整合为“为我向主祈求”。
- source_word: ὅπως μηδὲν ἐπέλθῃ ἐπ’ ἐμὲ
  choice: 免得……有一样临到我
  rationale: ὅπως在此引出所求避免的结果；μηδέν是否定性的“没有一件”，ἐπέλθῃ ἐπ’ ἐμέ保留某事、尤其不利之事“临到”某人的庄重语气。
- source_word: ὧν εἰρήκατε
  choice: 你们所说的事
  rationale: 关系代词属格结构与μηδέν相连，指他们所说诸事中没有一样；完成时强调这些话已经说出并仍与眼前处境相关，现代汉语无需另加时态标记。
theological_decisions:
- issue: τὸν κύριον（“主”）的所指
  choice: 主
  alternative: 上帝；主耶稣
  rationale: 希腊文本只称“主”，没有进一步明确是指上帝还是复活的耶稣。译文保留原文的称谓和所指范围，不作超出文本的限定。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“祈求”适合向主代求的语境；“临到我”保留审判或灾祸来到身上的严肃意味，同时不把原文未明说的内容具体化。
