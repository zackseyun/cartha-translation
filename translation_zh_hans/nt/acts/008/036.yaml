base_translation:
  language: en
  yaml_path: translation/nt/acts/008/036.yaml
  text: And as they were going along the road, they came to some water, and the eunuch says, “Look, water! What prevents me from being baptized?”
translation:
  language: zh_hans
  text: 他们沿路前行，来到一处有水的地方。那宦官说：“看，这里有水！有什么阻止我受洗呢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ εὐνοῦχος
  choice: 那太监
  rationale: “太监”是现代汉语中对宫廷阉官的通行称呼，符合本段人物身份；保留定冠语所指的已知人物。
- source_word: τι ὕδωρ
  choice: 一处有水的地方
  rationale: 希腊语表示遇见某处水源，并未说明水体种类或大小；此译自然且不作过度限定。
- source_word: φησιν
  choice: 说
  rationale: 原文用历史现在时增强叙事现场感；汉语叙事用“说”即可自然呈现，不必生硬标示时态。
- source_word: τί κωλύει με βαπτισθῆναι
  choice: 有什么能阻止我受洗呢
  rationale: 保留疑问句及被动不定式的含义，既不预断答案，也不补入原文未明说的受洗条件。
theological_decisions:
- issue: 受洗是否存在未明说的前提条件
  choice: 不补充任何条件，只译为“有什么能阻止我受洗呢？”
  alternative: 补入信心告白或其他受洗资格说明
  rationale: 本节的SBLGNT正文没有这些内容；应保持问题本身的开放性，不依据后期异文或宗派立场加以解释。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“沿路前行”简洁传达行程延续；“看，这里有水！”保留人物发现水源时直接而鲜明的语气。
