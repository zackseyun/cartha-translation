id: ACT.8.22
reference: Acts 8:22
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: μετανόησον οὖν ἀπὸ τῆς κακίας σου ταύτης, καὶ δεήθητι τοῦ ⸀κυρίου εἰ ἄρα ἀφεθήσεταί σοι ἡ ἐπίνοια τῆς καρδίας σου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/022.yaml
  text: Therefore repent of this wickedness of yours[a], and pray to the Lord, if perhaps the intent of your heart may be forgiven you.
translation:
  language: zh_hans
  text: 所以，你要悔改，离弃你的这项恶行，并恳求主，或许你心里的意图[a]会得蒙赦免。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “意图”或译“意念”。
    reason: ἐπίνοια可表示内在的思想、意念，也可侧重目的或打算；正文依上下文采用“意图”，脚注保留较宽泛的词义。
lexical_decisions:
- source_word: μετανόησον
  choice: 悔改
  rationale: 不定过去时命令语气要求作出明确、果断的回应；“悔改”简洁保留道德和属灵分量。
- source_word: οὖν
  choice: 所以
  rationale: 承接彼得先前的责备，表明这里是由上文引出的结论；“所以”符合现代汉语叙事。
- source_word: ἀπὸ τῆς κακίας σου ταύτης
  choice: 离弃你的这项恶行
  rationale: ἀπό带有离开、转离之意；κακία在此指道德上的邪恶。“这项恶行”既保留指示和领属关系，也自然指向西门刚才所做的事。
- source_word: δεήθητι
  choice: 恳求
  rationale: δέομαι表示迫切请求；“恳求”比一般的“祷告”更能体现请求的恳切，同时适合以主为对象。
- source_word: τοῦ κυρίου
  choice: 主
  rationale: κύριος按基督教语境译为“主”，但不在正文中进一步限定所指，从而保留叙事本身的开放性。
- source_word: εἰ ἄρα
  choice: 或许
  rationale: 该组合表达带保留的可能性，而非确定保证；“或许”在现代汉语中简明自然地保留这种审慎语气。
- source_word: ἀφεθήσεταί σοι
  choice: 会得到赦免
  rationale: 保留将来被动形式及赦免由外而来的含义；与“或许”连用，不把结果说成必然。
- source_word: ἡ ἐπίνοια
  choice: 意图
  rationale: ἐπίνοια可指思想、意念或谋划；上下文关乎西门内在的动机和打算，“意图”较好兼顾认知与意志层面。
- source_word: τῆς καρδίας σου
  choice: 你心里的
  rationale: 以自然现代汉语表达属格所指的内在来源，同时保留“心”在经文中的人格与意志含义。
theological_decisions:
- issue: 蒙赦免的确定程度
  choice: 用“或许……会得到赦免”保留彼得措辞中的条件性与审慎语气。
  alternative: 将其译成悔改祈求后必然得到赦免，或译成几乎不可能得到赦免。
  rationale: εἰ ἄρα与将来被动式共同形成带保留的表达；原文既没有明确保证结果，也没有宣告赦免不可能，因此译文不向任何一端作额外推断。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“悔改，离弃……”既传达悔改命令，也显出ἀπό的转离方向；分号使“恳求主”与其后带保留的赦免可能性关系清楚。
