  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Πέτρος δὲ εἶπεν πρὸς αὐτόν· Τὸ ἀργύριόν σου σὺν σοὶ εἴη εἰς ἀπώλειαν ὅτι τὴν δωρεὰν τοῦ θεοῦ ἐνόμισας διὰ χρημάτων κτᾶσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/020.yaml
  text: But Peter said to him[a], “May your silver perish with you[b], because you thought you could acquire the gift of God with money.”
translation:
  language: zh_hans
  text: 彼得却对他说：“愿你的银钱和你一同灭亡！因为你竟以为可以用钱财取得上帝的恩赐。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀργύριόν
  choice: 银钱
  rationale: 原词本义为“银子”，也常指银币或钱财；“银钱”既保留具体意象，又让现代读者自然理解为金钱，并与后文“钱财”避免机械重复。
- source_word: σὺν σοὶ
  choice: 和你一同
  rationale: 直接保留钱财与西门一同落入灭亡的严厉宣告。
- source_word: εἴη εἰς ἀπώλειαν
  choice: 愿……灭亡
  rationale: 以“愿”体现希腊文祈愿式所表达的咒诅性愿望；“灭亡”保留毁灭、败亡的力度，却不擅自限定为永恒定罪。
- source_word: δωρεὰν τοῦ θεοῦ
  choice: 上帝的恩赐
  rationale: “恩赐”自然表达由上帝赐下而非可用钱购买之物，也符合庄重的经文语体。
- source_word: ἐνόμισας
  choice: 你竟以为
  rationale: “以为”准确表达认为、设想；加入“竟”自然传达彼得责备中的震惊和反诘力度，而不改变命题内容。
- source_word: διὰ χρημάτων
  choice: 用钱财
  rationale: διά加属格表示手段；“用钱财”是现代汉语中自然清楚的表达。
- source_word: κτᾶσθαι
  choice: 取得
  rationale: 原词表示获得、取得。“取得”不把商业性的“购买”直接写入动词，而由“用钱财”明确其付费获取的含义。
- source_word: δὲ
  choice: 却
  rationale: 承接上节西门的请求并标明彼得回应中的强烈转折。
theological_decisions:
- issue: 彼得对西门及其钱财之宣告的性质
  choice: 译作祈愿式的严厉咒诅：“愿你的银钱和你一同灭亡”
  alternative: 译作对毁灭的陈述性预言，或采用明确指向地狱、永刑的措辞
  rationale: εἴη是祈愿式，宜保留愿望或咒诅的语气。ἀπώλεια表示灭亡、毁灭，但本节本身没有明确界定其终末性质，因此不额外加入“下地狱”等教义性限定。
translation_notes:
  register: 采用自然、庄重而直接的现代标准汉语。“银钱”保留原文“银”的具体措辞；“钱财”则流畅表达后半句的支付手段。感叹号体现原句严厉的咒诅语气。
