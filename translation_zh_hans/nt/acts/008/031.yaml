  text: ὁ δὲ εἶπεν· Πῶς γὰρ ἂν δυναίμην ἐὰν μή τις ⸀ὁδηγήσει με; παρεκάλεσέν τε τὸν Φίλιππον ἀναβάντα καθίσαι σὺν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/031.yaml
  text: And he said[a], “How could I[b], unless someone guides me?” Then he urged Philip to come up and sit with him.
translation:
  language: zh_hans
  text: 他回答说：“若没有人指引[a]我，我怎么能明白呢？”于是，他恳请[b]腓利上车来，与他同坐。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “指引”也可译作“带领”。原文动词既可指实际带路，也可指引导人理解。
    reason: lexical_alternative
  - marker: b
    text: “恳请”也可译作“邀请”或“请求”。原文动词可表示较恳切的请求，也可表示邀请。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πῶς γὰρ ἂν δυναίμην
  choice: 我怎么能明白呢
  rationale: 虚拟语气配合ἄν表达潜在可能性；结合上文“你明白吗”，中文补出“明白”可自然承接语境，同时保留在缺少指引时不能领会的语气。
- source_word: ἐὰν μή τις ὁδηγήσει με
  choice: 要是没有人指引我
  rationale: ὁδηγέω既可指带路，也可指引导人理解；“指引”保留这两层意象，避免直接窄化为“讲解”。
- source_word: παρεκάλεσέν
  choice: 请
  rationale: παρακαλέω在此表示郑重请求或邀请。“请”符合现代汉语叙事语体；其较恳切的语力在脚注中说明。
- source_word: τε
  choice: 于是
  rationale: τέ轻度连接后续动作；“于是”自然体现叙事推进及回应关系。
- source_word: ἀναβάντα
  choice: 上车来
  rationale: ἀναβαίνω本义为上去；语境中的交通工具是车，译为“上车来”既保留向上的动作，也使中文清楚自然。
- source_word: καθίσαι σὺν αὐτῷ
  choice: 和他一起坐
  rationale: 按σύν加与格的基本关系翻译，不额外断定具体座位位置。
- source_word: Φίλιππον
  choice: 腓利
  rationale: 采用现代中文圣经中通行的人名译法。
theological_decisions:
- issue: 理解经文是否依赖人的引导
  choice: 保留“要是没有人指引我，我怎么能明白呢”的条件性反问
  alternative: 译成绝对教义性陈述，如“没有教师就无人能懂圣经”
  rationale: 原文是人物在具体情境中的反问，并未在此建立普遍且绝对的解释权教义，因此不作神学扩张。
translation_notes:
  register: 采用现代、庄重而自然的叙事用语。“明白”依照紧接的上文语境补出，使中文问句完整；“上车来”明确原文上行动作在本段所指的车辆。所有脚注标记均置于相关正文之后。
