  text: Σαῦλος δὲ ἐλυμαίνετο τὴν ἐκκλησίαν κατὰ τοὺς οἴκους εἰσπορευόμενος, σύρων τε ἄνδρας καὶ γυναῖκας παρεδίδου εἰς φυλακήν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/003.yaml
  text: But Saul was ravaging the church[a], entering house after house; dragging off both men and women[b], he was handing them over to prison.
translation:
  language: zh_hans
  text: 扫罗却不断残害教会，挨家挨户进入[a]，把男女都拖走，交付监禁。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“进到一家又一家”。原文表达逐户而行的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλυμαίνετο
  choice: 不断残害
  rationale: 该动词语气强烈，指严重摧残、肆意破坏，不宜弱化为一般的“逼迫”；未完成时态体现持续或反复发生的行动，因此用“不断”表达。
- source_word: τὴν ἐκκλησίαν
  choice: 教会
  rationale: 此处指信徒群体；“教会”是现代汉语中明确、通行且符合《使徒行传》语境的译法。
- source_word: κατὰ τοὺς οἴκους
  choice: 挨家挨户
  rationale: κατά与复数名词连用具有逐一、分配性的含义；“挨家挨户”自然传达扫罗接连搜查多户人家的意思。
- source_word: εἰσπορευόμενος
  choice: 进去
  rationale: 该分词说明扫罗残害教会的具体方式；与“挨家挨户”连用，简明自然。
- source_word: σύρων
  choice: 拖走
  rationale: σύρω表示用力拖拽；“拖走”兼顾强制动作和把人从家中带离的语境。
- source_word: ἄνδρας καὶ γυναῖκας
  choice: 男人和女人都
  rationale: 保留原文明确提及两类人的表达，并以“都”突出扫罗并不因性别而有所区别。
- source_word: παρεδίδου
  choice: 送进
  rationale: 原文表示把人交付监禁；“送进监牢”在现代汉语中自然，也传达反复将人置于官方拘押之下的结果。
- source_word: εἰς φυλακήν
  choice: 监牢
  rationale: 此处φυλακή指拘禁之所或监禁状态；“监牢”准确、庄重，并与“送进”搭配自然。
theological_decisions:
- issue: 如何表达扫罗归信前行为的严重程度
  choice: 不断残害教会
  alternative: 不断逼迫教会
  rationale: λυμαίνομαι的力度强于泛指的“逼迫”，描绘的是持续、暴烈的摧残；采用强烈措辞忠实于本节本身，又不借此加入有关扫罗后来身份的神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“可是……却”承接上文并突出扫罗与当时局势中的其他行动形成转折；“挨家挨户”“拖走”保留原文行动的反复性和暴力感。
