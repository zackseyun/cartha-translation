  text: καὶ ἀναστὰς ἐπορεύθη, καὶ ἰδοὺ ἀνὴρ Αἰθίοψ εὐνοῦχος δυνάστης ⸀Κανδάκης βασιλίσσης Αἰθιόπων, ὃς ἦν ἐπὶ πάσης τῆς γάζης αὐτῆς, ὃς ἐληλύθει προσκυνήσων εἰς Ἰερουσαλήμ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/027.yaml
  text: So he got up and went[a]. And behold, an Ethiopian man, a eunuch, a high official of Candace, queen of the Ethiopians, who was over all her treasury, had come to Jerusalem to worship[b],
translation:
  language: zh_hans
  text: 于是腓利起身去了。看哪，有一个埃塞俄比亚人，是个太监[a]，也是埃塞俄比亚女王甘大基[b]手下的高官，掌管她的全部库藏。他曾到耶路撒冷敬拜，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“宫廷官员”。这个希腊词在某些语境中可以泛指王室官员，但这里很可能仍含“太监”的字面意思。
    reason: lexical_alternative
  - marker: b
    text: “甘大基”可能是这一王朝历代女王的称号，而不是个人名字。
    reason: cultural_note
lexical_decisions:
- source_word: ἀναστὰς ἐπορεύθη
  choice: 起身去了
  rationale: 保留分词在先、主要动词在后的动作次序，同时采用自然的现代汉语叙事表达。
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 明确保留原文引人注意的叙事标记及路加生动、略显庄重的文风。
- source_word: ἀνὴρ Αἰθίοψ
  choice: 一个埃塞俄比亚人
  rationale: “人”在汉语中已自然表达此人为男性，避免生硬重复为“一个埃塞俄比亚男人”。
- source_word: εὐνοῦχος
  choice: 太监
  rationale: 采用该词首要的字面和社会身份含义；其较宽泛的“宫廷官员”义另列脚注。
- source_word: δυνάστης
  choice: 高官
  rationale: 表达此人具有权势和高级官职，又不把他误译成独立的统治者。
- source_word: Κανδάκης βασιλίσσης Αἰθιόπων
  choice: 埃塞俄比亚女王甘大基
  rationale: 按现代汉语自然语序处理属格结构，并沿用容易辨识的中文音译；“甘大基”可能是王室称号，见脚注。
- source_word: ἐπὶ πάσης τῆς γάζης αὐτῆς
  choice: 掌管她的全部财库
  rationale: ἐπί在此表示负责、主管；γάζα可指财宝或财库，此处结合行政职责译作“财库”。
- source_word: ἐληλύθει προσκυνήσων εἰς Ἰερουσαλήμ
  choice: 曾到耶路撒冷敬拜
  rationale: “曾到”体现完成时所指的先前行动，目的分词自然译为“敬拜”。
theological_decisions:
- issue: εὐνοῦχος应按字面译为“太监”，还是泛译为“宫廷官员”
  choice: 正文译作“太监”
  alternative: 宫廷官员
  rationale: 字面义最有词汇依据，也保留此人的身体和社会身份所形成的叙事张力；δυνάστης已经明确说明其官员地位，因此不宜把两个词合并淡化。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“看哪”有意保留原文的注意标记；“太监”与“高官”分别对应两个希腊词，避免合并其身份信息。句末逗号保留本节与下一节在句法和叙事上的连续性。
