  text: προσδραμὼν δὲ ὁ Φίλιππος ἤκουσεν αὐτοῦ ἀναγινώσκοντος ⸂Ἠσαΐαν τὸν προφήτην⸃ καὶ εἶπεν· Ἆρά γε γινώσκεις ἃ ἀναγινώσκεις;
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/030.yaml
  text: So Philip ran up and heard him reading Isaiah the prophet[a], and said, “Do you really understand what you are reading?”
translation:
  language: zh_hans
  text: 腓利就跑上前去，听见他正在读先知以赛亚的书，便说：“你所读的，你真的明白吗？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你所读的，你究竟明白吗？”希腊语中的语气词使腓利的问题带有强调意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: προσδραμὼν
  choice: 跑上前去
  rationale: 该不定过去时分词表示迅速朝目标跑去；“跑上前去”既保留动作的鲜明感，也符合现代汉语叙事表达。
- source_word: δὲ
  choice: 就
  rationale: 这里的δέ推进叙事；结合上文的命令，“就”自然表达随即采取行动，但不过度强化因果关系。
- source_word: ἤκουσεν αὐτοῦ ἀναγινώσκοντος
  choice: 听见他在读
  rationale: ἀκούω加属格分词表示听见对方正在进行阅读。原文没有明说“朗读”，因此不将其显化。
- source_word: Ἠσαΐαν τὸν προφήτην
  choice: 先知以赛亚的书
  rationale: 希腊语字面为“先知以赛亚”，在“读”之后指其著作或书卷。汉语补出“的书”，清楚自然，同时不具体限定所读段落。
- source_word: εἶπεν
  choice: 说
  rationale: 采用λέγω的直接对应词“说”；后面的疑问句已清楚表明这是发问，无须改作“问道”。
- source_word: Ἆρά γε
  choice: 真的
  rationale: 两个小词共同使问题带有探询和强调意味；“真的”在现代汉语中自然保留这种力度。
- source_word: γινώσκεις
  choice: 明白
  rationale: 此处指领会所读内容的意义，而非仅仅知道或认识；“明白”准确且通俗。
- source_word: ἃ ἀναγινώσκεις
  choice: 你读的
  rationale: 关系代词ἃ指正在阅读的内容；汉语用“你读的”简洁表达该宾语，并与后面的“明白”自然衔接。
theological_decisions: []
