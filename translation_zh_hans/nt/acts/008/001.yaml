source:
  edition: SBLGNT
  text: Σαῦλος δὲ ἦν συνευδοκῶν τῇ ἀναιρέσει αὐτοῦ. Ἐγένετο δὲ ἐν ἐκείνῃ τῇ ἡμέρᾳ διωγμὸς μέγας ἐπὶ τὴν ἐκκλησίαν τὴν ἐν Ἱεροσολύμοις· πάντες δὲ διεσπάρησαν κατὰ τὰς χώρας τῆς Ἰουδαίας καὶ Σαμαρείας πλὴν τῶν ἀποστόλων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/001.yaml
  text: Saul was approving of his execution. And on that day a great persecution arose against the church in Jerusalem[a], and they were all scattered throughout the regions of Judea and Samaria, except the apostles.
translation:
  language: zh_hans
  text: 扫罗也赞同杀害他这件事。就在那一天，耶路撒冷的教会遭到大规模迫害；除了使徒以外，众人都分散到犹太和撒玛利亚各地。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σαῦλος
  choice: 扫罗
  rationale: 采用现代中文圣经读者熟悉的标准人名译法。
- source_word: συνευδοκῶν
  choice: 也赞同
  rationale: 与ἦν连用，表示扫罗当时持续持赞同态度；“赞同”传达认可和同意，却不夸大为亲手参与。“也”承接上文，并对应δέ的连接作用。
- source_word: τῇ ἀναιρέσει αὐτοῦ
  choice: 杀害他
  rationale: ἀναίρεσις指夺去性命、置人于死地这一行为。“杀害”保留行为性及语境中的负面色彩，又避免“处决”可能暗示合法司法程序。
- source_word: Ἐγένετο ... διωγμὸς μέγας
  choice: 遭到大规模迫害
  rationale: 将希腊语“发生了大迫害”按现代汉语习惯转换为教会“遭到大规模迫害”，保留迫害的严重程度与发生事实。
- source_word: ἐπὶ τὴν ἐκκλησίαν τὴν ἐν Ἱεροσολύμοις
  choice: 耶路撒冷的教会遭到
  rationale: ἐπί在敌对语境中表示迫害针对该教会；定语结构自然译为“耶路撒冷的教会”。
- source_word: πάντες ... διεσπάρησαν
  choice: 众人都分散
  rationale: 保留πάντες的整体性陈述，并由后面的使徒例外加以限定；被动式按自然汉语表达为“分散”。
- source_word: κατὰ τὰς χώρας τῆς Ἰουδαίας καὶ Σαμαρείας
  choice: 到犹太和撒玛利亚各地
  rationale: χώρας在此指地域、地区；“各地”简洁自然，κατά表达散布遍及这些地域。
- source_word: πλὴν τῶν ἀποστόλων
  choice: 除了使徒以外
  rationale: 直接保留πλήν所标明的例外范围。
theological_decisions:
- issue: ἀναιρέσει αὐτοῦ对司提反之死的定性
  choice: 杀害他
  alternative: 处决他／杀死他／他的死
  rationale: 原词强调把人置于死地的行为。“杀害”在本语境中自然且不将其弱化为单纯“死亡”；同时不用可能暗示司法合法性的“处决”。
- issue: πάντες（众人／所有人）的范围
  choice: 除了使徒以外，众人都分散
  alternative: 除了使徒以外，所有信徒都分散／每个人都分散
  rationale: 保留原文概括性的“众人”，并让原文明确的使徒例外限定其范围；不额外加入“信徒”，也不把表达绝对化为毫无例外的每一个人。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“就在那一天”保留事件紧接司提反之死发生的时间强调；分号呈现迫害发生与众人分散之间紧密的叙事关系。无脚注，因此正文不设脚注标记。
