  yaml_path: translation/nt/acts/008/019.yaml
  text: saying[a], “Give me also this authority, so that anyone on whom I lay my hands may receive the Holy Spirit.”
translation:
  language: zh_hans
  text: 说：“也把这权柄[a]赐给我，使我给谁按手，谁就能领受圣灵。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“能力”。希腊文 exousia 可指权柄、权利或行事的能力；此处译为“权柄”，以保留该词所含的权限或受托行事之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: 说
  rationale: 现在分词承接上一节并引出西门的话；汉语叙事中用“说”自然简洁，无需机械保留分词形式。
- source_word: Δότε
  choice: 赐给
  rationale: δίδωμι的第二人称复数不定过去时命令式，基本义为“给”；这里西门向使徒索求属灵权柄，“赐给”语体庄重自然，同时不额外说明其获取方式。
- source_word: κἀμοί
  choice: 也……我
  rationale: κἀμοί由καί与ἐμοί缩合而成，突出西门要求自己也获得同样的权柄；“也把……赐给我”保留这一包含意味。
- source_word: ἐξουσίαν
  choice: 权柄[a]
  rationale: ἐξουσία可指权柄、权限或行事的权能；“权柄”既保留受托或有权行事的含义，也避免与更直接表示能力的词混同。
- source_word: ταύτην
  choice: 这
  rationale: 指向西门刚观察到的特定权柄；“这权柄”准确自然。
- source_word: ἵνα
  choice: 使
  rationale: 引出西门所求权柄的目的或预期结果；“使”凝练地保留目的关系。
- source_word: ᾧ ἐὰν
  choice: 无论给谁……谁
  rationale: 关系代词与ἐάν构成不定概括表达；汉语以“无论给谁……谁就……”清楚表达任何对象均适用的条件关系。
- source_word: ἐπιθῶ τὰς χεῖρας
  choice: 给谁按手
  rationale: “按手”是现代汉语圣经语境中自然且具体的固定表达，保留原文把手放在某人身上的动作。
- source_word: λαμβάνῃ
  choice: 就可以领受
  rationale: ἵνα后的现在时虚拟语气表达所求的结果；“可以领受”保留可能、获准或得以发生的语气，不把结果写成无条件事实。
- source_word: πνεῦμα ἅγιον
  choice: 圣灵
  rationale: 虽无冠词，但《使徒行传》的语境明确指神的灵；汉语专名“圣灵”无需冠词，也不会产生“一位圣洁的灵”的误解。
theological_decisions:
- issue: ἐξουσίαν在此应译为“权柄”还是“能力”
  choice: 权柄
  alternative: 能力
  rationale: 该词可涵盖实际行事的权能，但其核心语义包括权限、权利或受托权柄。译作“权柄”保留原词特色；上下文已经表明西门认为这种权柄会产生实际果效。脚注注明“能力”这一可行译法。
- issue: 无冠词的πνεῦμα ἅγιον是否可能指“一位圣洁的灵”
  choice: 圣灵
  alternative: 一个圣洁的灵
  rationale: 本段承接8:15—18，所指明确是神的圣灵。希腊语无冠词并不要求不定解释；译作“一个圣洁的灵”会违背叙事语境。
- issue: λαμβάνῃ是否应译成确定结果
  choice: 可以领受
  alternative: 就领受
  rationale: 虚拟语气位于ἵνα目的从句中，表达西门想取得的能力及预期结果。“可以领受”避免把他的请求表述成叙述者对按手必然生效的神学断言。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“按手”“领受圣灵”保留通行且清楚的圣经表达；句式以“无论……谁就……”自然呈现希腊语的不定关系结构。
