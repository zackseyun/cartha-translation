  yaml_path: translation/nt/acts/008/028.yaml
  text: And he was returning[a], seated in his chariot[b], and was reading Isaiah the prophet.
translation:
  language: zh_hans
  text: 他正在返回，坐在他的车里，读着[a]先知以赛亚的书。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 古代人阅读时常常出声，因此也可理解为“朗读着”；不过，本句的希腊文动词本身没有明确表示“出声”。
    reason: cultural_note
lexical_decisions:
- source_word: ἦν τε ὑποστρέφων
  choice: 他正在返回
  rationale: ἦν与现在分词构成迂回时态，表示过去某时正在持续的动作；“正在返回”保留这一进行意味，不增添原文未明说的“回家”。τέ仅作轻微连接，汉语中无需硬译。
- source_word: καθήμενος
  choice: 坐在
  rationale: 表示他旅途中的姿势；现代汉语用“坐在”自然清楚，也保留分词所表达的伴随状态。
- source_word: ἐπὶ τοῦ ἅρματος αὐτοῦ
  choice: 自己的车上
  rationale: ἐπί加属格在此表示位于车辆之上；“车上”符合现代汉语习惯。“车”保留ἅρμα在本处作为古代乘用车辆的宽泛含义，避免用“马车”增添原文未明说的牵引方式。
- source_word: ἀνεγίνωσκεν
  choice: 读着
  rationale: 未完成时表示持续进行的动作。“读着”自然体现其延续性；古代阅读常会出声，但该动词在本句并未明确要求译成“朗读”。
- source_word: τὸν προφήτην Ἠσαΐαν
  choice: 先知以赛亚的书
  rationale: 希腊文直译为“先知以赛亚”，此处以作者代指其著作；汉语补出“的书”，可清楚表达他正在读以赛亚的著作，而非读一个人，同时保留“先知以赛亚”的称谓与原文词序。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“正在返回……读着”保留希腊文未完成体所呈现的持续场景；句式简洁，符合叙事文体。
