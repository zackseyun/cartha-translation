  text: Ἀνὴρ δέ τις ὀνόματι Σίμων προϋπῆρχεν ἐν τῇ πόλει μαγεύων καὶ ⸀ἐξιστάνων τὸ ἔθνος τῆς Σαμαρείας, λέγων εἶναί τινα ἑαυτὸν μέγαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/009.yaml
  text: A certain man named Simon had previously been in the city practicing magic and astonishing the people of Samaria[a], saying that he himself was someone great[b],
translation:
  language: zh_hans
  text: 有一个名叫西门的人，先前在那城里行魔法，使撒马利亚的民众惊奇[a]，自称是个大人物[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “行魔法”也可译作“行法术”或“施行巫术”；希腊语动词指从事魔法技艺。
    reason: lexical_alternative
  - marker: b
    text: 或译：“说自己是个了不起的人。”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνὴρ δέ τις
  choice: 有一个……的人
  rationale: Ἀνήρ明确指男子；τις表示不定，现代汉语用“有一个……的人”自然引入新人物。δέ的轻微转折或承接作用可由上下文体现，不必生硬译出。
- source_word: ὀνόματι Σίμων
  choice: 名叫西门
  rationale: 这是现代汉语表达“名为某人”的自然说法；Σίμων按通行圣经人名译作“西门”。
- source_word: προϋπῆρχεν
  choice: 先前就在
  rationale: 保留该词相对于前文事件的先在时间意义；“就在”也自然地连接地点短语，但不额外断定持续了多久。
- source_word: ἐν τῇ πόλει
  choice: 在那城里
  rationale: 定冠词所指是上下文刚提到的城；汉语用“那城”明确回指，比孤立的“城里”更自然。
- source_word: μαγεύων
  choice: 行邪术
  rationale: 指从事魔法技艺。“行邪术”是简洁、庄重且易懂的现代汉语表达，同时避免擅自说明其超自然来源。
- source_word: ἐξιστάνων
  choice: 使……惊奇
  rationale: 保留ἐξίστημι在此处使役性的“使人惊异、震惊”含义，并与进行中的活动相配。
- source_word: τὸ ἔθνος τῆς Σαμαρείας
  choice: 撒马利亚人
  rationale: 此处ἔθνος指撒马利亚的民众整体；译作“撒马利亚人”比“撒马利亚民族”更自然，也避免现代政治意味。
- source_word: λέγων
  choice: 还自称
  rationale: 结合其言说内容，汉语“自称”自然表达他说自己具有某种身份或地位；“还”承接前面的行为，不增加新的时间含义。
- source_word: εἶναί τινα ἑαυτὸν μέγαν
  choice: 是个了不起的人
  rationale: “是个……的人”体现τινα的“某个有分量的人”之意；“了不起”传达μέγαν所指的显要或重要，同时由“自称”保留ἑαυτόν的自我抬高意味。
theological_decisions:
- issue: 西门所行之术的性质
  choice: 行邪术
  alternative: 行法术／施行巫术
  rationale: 原文说明他从事魔法技艺，却没有在本节界定其力量来源，也没有明确称之为欺骗或鬼魔作为。译文保留负面色彩，但不加入经文未明说的神学判断。
- issue: 西门自我宣称的含义
  choice: 自称是个了不起的人
  alternative: 说自己是个大人物
  rationale: 原文可指伟大、重要或有地位的人，并未具体说明称号。“了不起的人”保留一定宽度，避免把它固定为政治或社会身份。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“先前就在”交代此人早已在城中活动；用连续分句保持原文叙事推进。所有脚注标记均置于相关词句之后。
