base_translation:
  language: en
  yaml_path: translation/nt/acts/008/002.yaml
  text: But devout men buried Stephen and made great lamentation over him[a][b].
translation:
  language: zh_hans
  text: 但有几位敬虔的男子安葬了司提反[a]，并为他举行了盛大的哀悼[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“收殓了司提反”或“把司提反移去安葬”；希腊语动词既可强调处置遗体的过程，也可指向安葬这一结果。
    reason: lexical_alternative
  - marker: b
    text: “盛大的哀悼”可包括公开而有声的悲恸表达，不只是内心的哀伤。
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεκόμισαν
  choice: 安葬了
  rationale: 该动词在这里指人死后收殓、移送并安葬遗体的行动；正文采用现代汉语自然的“安葬”，同时以脚注保留“收殓”或“移去安葬”的词义可能。
- source_word: δέ
  choice: 未单独译出
  rationale: δέ在此是轻微的叙事转折或承接。现代汉语若译作“但是”会显得对比过强；通过另起叙事句自然体现转换。
- source_word: ἄνδρες εὐλαβεῖς
  choice: 有些虔诚的人
  rationale: ἄνδρες在此指男性，但现代汉语“虔诚的人”自然表达其敬虔特征；“有些”使不定复数在叙事中更顺畅，不暗示全部人。
- source_word: ἐποίησαν κοπετὸν μέγαν
  choice: 大大哀哭
  rationale: 这是表示强烈哀悼的搭配；“大大哀哭”既保留μέγαν的强度，也比逐字译作“作了大哀悼”更符合现代汉语，并能传达外显的悲恸。
- source_word: ἐπ’ αὐτῷ
  choice: 为他
  rationale: 与哀悼用语连用时，ἐπί加与格表示哀悼所针对的人；“为他”在汉语中简洁自然。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“安葬”自然概括上下文中的遗体处置；以脚注保存原词的词义幅度。“大大哀哭”保留哀悼的强烈程度及可能的公开外显性质。
