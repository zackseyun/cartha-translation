  to: 西门自己也信了；他受洗以后，一直与腓利在一起。看见神迹和大能之事[a]正在发生，他就惊叹不已。
  rationale: 修订仅收敛对γινομένας的体貌表达，以“正在发生”传达观察中的进行性，避免“不 断”可能带出的重复频率；并微调脚注替代译法，使其更准确反映δυνάμεις作为大能彰显/作为的语义。其余表达保留原文的强调、时序、持续性及对西门之“信”的神学开放性。
