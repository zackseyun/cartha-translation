source:
  edition: SBLGNT
  text: ὁ δὲ Σίμων καὶ αὐτὸς ἐπίστευσεν, καὶ βαπτισθεὶς ἦν προσκαρτερῶν τῷ Φιλίππῳ, θεωρῶν τε ⸂σημεῖα καὶ δυνάμεις μεγάλας γινομένας⸃ ἐξίστατο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/013.yaml
  text: And Simon himself also believed[a], and after being baptized he continued with Philip, and as he saw signs and great works of power happening, he was amazed.
translation:
  language: zh_hans
  text: 西门自己也信了；他受洗以后，一直与腓利在一起。看见神迹和大能之事[a]正在发生，他就惊叹不已。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大能之事”也可译作“大有能力的作为”。这里的希腊词可指能力的彰显，也可指神迹奇事。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ αὐτὸς
  choice: 自己也
  rationale: 兼顾αὐτός的强调意味和καί的附加意味，突出连西门也作出了回应。
- source_word: ἐπίστευσεν
  choice: 信了
  rationale: 直接表达πιστεύω的含义，不额外判定西门的信是否真实或持久。
- source_word: βαπτισθεὶς
  choice: 受洗以后
  rationale: 不定过去时被动分词所表达的动作先于后面的持续状态；这样译符合现代汉语的时序表达。
- source_word: ἦν προσκαρτερῶν τῷ Φιλίππῳ
  choice: 一直和腓利在一起
  rationale: 迂回未完成时表示持续状态；此译体现西门不断留在腓利身边，同时避免用“跟随”过度暗示正式门徒身份。
- source_word: θεωρῶν
  choice: 他看见
  rationale: 表达持续观察，并自然引出使西门惊叹的所见之事。
- source_word: σημεῖα
  choice: 神迹
  rationale: “神迹”是中文圣经语境中对σημεῖον自然且通行的表达，并保留其指向性和超常含义。
- source_word: δυνάμεις μεγάλας
  choice: 大能之事
  rationale: 较贴近“强大能力的彰显”，不像单译“奇迹”那样消解σημεῖα与δυνάμεις之间的用词区别。
- source_word: γινομένας
  choice: 不断有……发生
  rationale: 体现现在分词所描写的正在发生、反复呈现的事件。
- source_word: ἐξίστατο
  choice: 惊叹不已
  rationale: 体现未完成时所表示的持续震惊，也传达ἐξίστημι在此处强烈惊异的语气。
theological_decisions:
- issue: 西门的“信”是否应译成足以判定其真实归信的说法
  choice: 仅译为“信了”
  alternative: “真正信了”或“只是表示相信”
  rationale: 本节明确说西门信了并受了洗，但后文引发对其属灵状况的疑问。译文不超出希腊文，保留叙事中的神学张力。
- issue: 西门持续与腓利同在是否应表述为正式的门徒关系
  choice: 译作“一直和腓利在一起”
  alternative: “一直跟随腓利”或“专心作腓利的门徒”
  rationale: προσκαρτερέω表达持续留在、依附或专注于某人；中性表述既保留持续性，也不预先断定其门徒身份的性质。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“自己也”保留原文强调；“一直……”“不断有……发生”“惊叹不已”共同呈现各动词和分词的持续意味。脚注标记置于其实际说明的“大能之事”之后，以免误指“信了”。
