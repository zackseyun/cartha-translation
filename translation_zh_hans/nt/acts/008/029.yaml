base_translation:
  language: en
  yaml_path: translation/nt/acts/008/029.yaml
  text: Then the Spirit said to Philip[a], “Go over and join this chariot.”
translation:
  language: zh_hans
  text: 圣灵对腓利说：“你上前去，贴近这辆车[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“靠近并紧随这辆车。”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ
  choice: 对……说
  rationale: δέ在这里承接叙事进程，并无明显转折；现代汉语无需另译“然后”也能自然表达事件推进。εἶπεν在直接引语前自然译为“说”。
- source_word: τὸ πνεῦμα
  choice: 圣灵
  rationale: 原文直译为“那灵”；在《使徒行传》的启示和引导语境中，所指是圣灵。中文以“圣灵”可明确而自然地表达该指称，避免“那灵”可能造成的歧义。
- source_word: τῷ Φιλίππῳ
  choice: 对腓利
  rationale: 与“说”搭配，准确表达与格间接受词；Φίλιππος采用中文圣经中通行的人名译法“腓利”。
- source_word: Πρόσελθε
  choice: 上前去
  rationale: 该不定过去时命令式要求腓利朝车辆所在处移动；“上前去”既表达接近，也符合当时场景中的自然汉语。
- source_word: κολλήθητι
  choice: 靠近
  rationale: κολλάομαι含贴近、依附或紧随之意。此处命令腓利接近并靠着车辆行动；“靠近”自然且不过度限定动作持续时间。
- source_word: τῷ ἅρματι τούτῳ
  choice: 那辆车
  rationale: ἅρμα在此指供人乘坐的有轮车辆；现代汉语用“车”比“战车”准确，因为上下文并非军事场景。τούτῳ虽为近指，但中文从腓利的视角自然用远指“那辆”，指向他要走近的车辆。
theological_decisions:
- issue: τὸ πνεῦμα的所指
  choice: 圣灵
  alternative: 那灵
  rationale: 在《使徒行传》中，这类向信徒发出具体指引的“灵”通常指圣灵。译作“圣灵”明确所指，但没有增加任何关于说话方式的解释。
- issue: κολλήθητι所表达的动作
  choice: 靠近
  alternative: 贴近并跟着
  rationale: 原词可包含紧贴或紧随的意味，但本节本身没有明说持续多久。正文保留较宽的“靠近”，避免把后续动作过度写入命令。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。句式适合叙事和直接引语；不使用生硬的“贴附于”或容易误解为军用车辆的“战车”。
