  text: ⸀οὐδέπω γὰρ ἦν ἐπ’ οὐδενὶ αὐτῶν ἐπιπεπτωκός, μόνον δὲ βεβαπτισμένοι ὑπῆρχον εἰς τὸ ὄνομα τοῦ ⸀κυρίου Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/016.yaml
  text: For he had not yet fallen upon any of them[b][a]; they had only been baptized into the name of the Lord Jesus.
translation:
  language: zh_hans
  text: 因为圣灵还没有降临在他们任何人身上；他们只奉主耶稣的名受了洗[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“受洗归入主耶稣的名下。”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδέπω
  choice: 还没有
  rationale: 自然表达截至当时尚未发生的动作。
- source_word: ἐπ’ οὐδενὶ αὐτῶν
  choice: 在他们任何人身上
  rationale: 保留ἐπί与间接受格所表达的临到某人身上的空间意象，同时符合现代汉语习惯。
- source_word: ἐπιπεπτωκός
  choice: 降临
  rationale: 该动词在《使徒行传》中用于圣灵临到人；中文“降临”自然庄重，并保留从上而临的意象。
- source_word: μόνον
  choice: 只
  rationale: 清楚标示受洗与圣灵尚未降临之间的限制和对照。
- source_word: βεβαπτισμένοι ὑπῆρχον
  choice: 受了洗
  rationale: 以自然汉语表达此前已经完成、其结果仍然存在的受洗状态。
- source_word: εἰς τὸ ὄνομα
  choice: 奉……的名
  rationale: 这是现代汉语中表达以某人之名受洗的惯用说法；脚注保留更贴近εἰς空间意象的译法。
- source_word: κυρίου Ἰησοῦ
  choice: 主耶稣
  rationale: 准确、自然地表达κύριος Ἰησοῦ这一称号。
theological_decisions:
- issue: ἐπιπεπτωκός的省略主语
  choice: 正文补出“圣灵”
  alternative: 仅译作“还没有降临在他们任何人身上”，不明说主语
  rationale: 希腊文主语承接上一节的“圣灵”；中文补出所指可避免歧义，又没有加入上下文以外的神学判断。
- issue: 洗礼与“名”的介词表达
  choice: 奉主耶稣的名受洗
  alternative: 受洗归入主耶稣的名下
  rationale: 正文采用自然、通行的现代汉语，不借本节裁断后来的洗礼程式或圣礼神学争论；脚注保存εἰς较直译的归入意味。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“因为”保留γάρ与上文的解释关系；分号呈现两个分句之间的对照。
