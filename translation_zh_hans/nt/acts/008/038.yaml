  text: καὶ ἐκέλευσεν στῆναι τὸ ἅρμα, καὶ κατέβησαν ἀμφότεροι εἰς τὸ ὕδωρ ὅ τε Φίλιππος καὶ ὁ εὐνοῦχος, καὶ ἐβάπτισεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/038.yaml
  text: And he ordered the chariot to stop[a], and both Philip and the eunuch went down into the water, and he baptized him.
translation:
  language: zh_hans
  text: 于是，他吩咐马车停下；腓利和太监二人都下到水中[a]，腓利就给他施洗。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“下到水边”；但希腊语介词通常表示进入水中的移动。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκέλευσεν
  choice: 吩咐
  rationale: 表示发出命令；“吩咐”符合现代汉语叙事语体，也保留其权威意味。
- source_word: στῆναι τὸ ἅρμα
  choice: 马车停下
  rationale: στῆναι在此表示使车辆停止；译作“马车停下”自然清楚。ἅρμα直指当时的车乘，现代汉语用“马车”比“战车”更符合本段旅行场景。
- source_word: κατέβησαν ἀμφότεροι
  choice: 两个人都下到
  rationale: 既表达καταβαίνω的向下移动，也保留ἀμφότεροι对两人共同参与的明确强调。
- source_word: εἰς τὸ ὕδωρ
  choice: 到水里
  rationale: εἰς通常表达朝向内部的移动，“到水里”保留这一方向性，但不据此额外断定施洗方式。
- source_word: ὅ τε Φίλιππος καὶ ὁ εὐνοῦχος
  choice: 腓利和太监
  rationale: 明确列出共同下水的两个人，并与前面的“两个人都”形成自然对应。
- source_word: εὐνοῦχος
  choice: 太监
  rationale: 保留该词在本叙事中的通常含义及上下文的称谓连续性，不泛化为“官员”。
- source_word: ἐβάπτισεν αὐτόν
  choice: 腓利就给他施了洗
  rationale: 希腊文主语由上下文指向腓利；汉语补出“腓利”可避免代词歧义。“施洗”是中性且通行的圣经用语，不擅自规定具体方式。
theological_decisions:
- issue: 是否用译文断定洗礼的具体方式
  choice: 保留“两个人都下到水里”和“施了洗”，不添加浸没、浇水或点水等说明
  alternative: 把βαπτίζω译为“浸入水中”，或把εἰς弱化为仅仅“到了水边”
  rationale: 原文明确说两人下到水里，随后腓利为太监施洗，却没有在本句中用额外措辞详述具体操作。译文应同时保留方向信息和神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“于是”承接前文；分号使停车与下水两个连续动作层次清楚。用“太监”保持原词和上下文称谓，用“施洗”避免宗派化地规定方式。
