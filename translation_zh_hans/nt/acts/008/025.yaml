revisions:
- from: 他们郑重作证，讲说了主的道之后，就返回耶路撒冷；一路上又在撒玛利亚人的许多村庄传扬福音。
  to: 他们郑重作证并讲说主的道之后，正返回耶路撒冷；同时，他们在许多撒玛利亚人的村庄传扬福音。
  rationale: 修订仅移除原文未明说的“一路上”和语气稍强的“又”，并以“正返回……；同时，他们……传扬”表达两个未完成时的并行、持续行动。保留隐含复数主语为“他们”，不补入彼得和约翰的姓名；保留“主的道”“传扬福音”和“撒玛利亚人的村庄”等关键术语。
