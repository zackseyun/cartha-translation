  text: Οἱ μὲν οὖν διαμαρτυράμενοι καὶ λαλήσαντες τὸν λόγον τοῦ κυρίου ⸀ὑπέστρεφον εἰς ⸀Ἱεροσόλυμα, πολλάς τε κώμας τῶν Σαμαριτῶν ⸀εὐηγγελίζοντο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/025.yaml
  text: So[a], after they had solemnly testified and spoken the word of the Lord, they were returning to Jerusalem[b], and were proclaiming the good news in many Samaritan villages.
translation:
  language: zh_hans
  text: 他们郑重作证并讲说主的道之后，正返回耶路撒冷；同时，他们在许多撒玛利亚人的村庄传扬福音。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαμαρτυράμενοι
  choice: 郑重作证
  rationale: 该词表示严肃而有分量地作见证；“郑重作证”保留其强调意味，又不将其限定为“警告”。
- source_word: λαλήσαντες
  choice: 讲说了
  rationale: 与直接宾语“主的道”搭配自然，忠实表达说出、宣讲之意，不作过度解释。
- source_word: τὸν λόγον τοῦ κυρίου
  choice: 主的道
  rationale: “道”是现代中文圣经语境中对 λόγος 的简明、庄重表达，也保留其作为所传信息的神学意味。
- source_word: ὑπέστρεφον
  choice: 就返回
  rationale: 用“返回”表达回程；希腊语未完成时所体现的行进过程，结合后面的沿途传扬，由整句结构自然呈现。
- source_word: πολλάς τε κώμας τῶν Σαμαριτῶν
  choice: 撒玛利亚人的许多村庄
  rationale: 保留属格结构所明确表达的族群关系，比单说“撒玛利亚许多村庄”更清楚。
- source_word: εὐηγγελίζοντο
  choice: 传扬福音
  rationale: 准确表达宣告好消息的动词意义；“传扬福音”在现代中文中自然、清楚，并保留未完成时所指持续进行的行动。
theological_decisions:
- issue: 隐含主语的身份
  choice: 译作“他们”，不补出姓名
  alternative: 明确译作“彼得和约翰”
  rationale: 上下文指向彼得和约翰，但本节希腊文只含隐含的复数主语；译文不加入原文未明说的姓名。
- issue: 两项未完成时行动的关系
  choice: 以“返回……；一路上又……传扬”表达回程中持续传福音
  alternative: 将返回和传扬处理为彼此分开的先后行动
  rationale: ὑπέστρεφον 与 εὐηγγελίζοντο 均为未完成时，最自然地呈现为并行、持续的行动；“一路上”使这种关系在中文中清楚而不生硬。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“郑重作证”保留原文力度；分号和“一路上又”清楚呈现他们返程时在许多村庄持续传福音。
