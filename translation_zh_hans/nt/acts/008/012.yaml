revisions:
- from: 可是，当他们相信了正在传扬福音的腓利时——他所传的是关于上帝的国和耶稣这位弥赛亚之名[a]的福音——男男女女便陆续受了洗。
  to: 可是，当他们相信腓利所传的、关于上帝的国和耶稣这位弥赛亚的名[a]的福音时，男人和女人都陆续受了洗。
  rationale: 修订将原文的传福音分词及其内容合并为中文自然的定语结构，避免重复；调整“名”的名词链和性别并列表达。保留“陆续受了洗”以体现未完成时被动语态所表达的持续或相继发生的动作。
