  text: ὅτε δὲ ἐπίστευσαν τῷ Φιλίππῳ εὐαγγελιζομένῳ ⸀περὶ τῆς βασιλείας τοῦ θεοῦ καὶ τοῦ ὀνόματος Ἰησοῦ Χριστοῦ, ἐβαπτίζοντο ἄνδρες τε καὶ γυναῖκες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/012.yaml
  text: But when they believed Philip as he proclaimed the good news about the kingdom of God and the name of Jesus the Messiah[a], they were being baptized, both men and women.
translation:
  language: zh_hans
  text: 可是，当他们相信腓利所传的、关于上帝的国和耶稣这位弥赛亚的名[a]的福音时，男人和女人都陆续受了洗。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“耶稣基督的名。”希腊文Χριστός意为“受膏者”，在这里作为称号，正文译作“弥赛亚”。
    reason: 说明传统译法，并交代正文保留称号意义的依据。
lexical_decisions:
- source_word: ὅτε δὲ
  choice: 可是，当……时
  rationale: ὅτε引出时间从句，δέ表示轻微转折或叙事推进；这样既保留关系，也不把转折说得过强。
- source_word: ἐπίστευσαν τῷ Φιλίππῳ
  choice: 他们相信了……腓利
  rationale: πιστεύω后接与格，在这里指相信腓利这位传讲者，而不是以腓利为信仰对象；保留“相信腓利”，避免直接改写成只相信某项信息。
- source_word: εὐαγγελιζομένῳ
  choice: 正在传扬福音的
  rationale: 现在时分词修饰腓利，描写他们相信他时他正在传扬福音；“传扬福音”自然保留了该动词宣告好消息的含义。
- source_word: περὶ τῆς βασιλείας τοῦ θεοῦ καὶ τοῦ ὀνόματος Ἰησοῦ Χριστοῦ
  choice: 关于上帝的国和耶稣这位弥赛亚之名
  rationale: περί引出福音的内容；“上帝的国”保留传统而透明的表达，“……之名”则保留ὄνομα可能包含其身份、权柄和所代表之人的丰富含义。
- source_word: ἐβαπτίζοντο
  choice: 便陆续受了洗
  rationale: 未完成时被动态表示过去持续或反复发生的受洗行动；“陆续”自然体现多人相继受洗，而不把它译成一次性的简单过去事件。
- source_word: ἄνδρες τε καὶ γυναῖκες
  choice: 男男女女
  rationale: τε……καί明确包括男人和女人；“男男女女”是现代汉语中自然、清楚且兼具叙事感的概括。
theological_decisions:
- issue: Ἰησοῦ Χριστοῦ中Χριστοῦ的译法
  choice: 耶稣这位弥赛亚
  alternative: 耶稣基督
  rationale: Χριστός在这里可听作称号而非姓氏式名称；正文用“这位弥赛亚”明确保留“受膏者”称号的含义，脚注同时列出汉语传统译法，不消除两种表达之间的张力。
- issue: “耶稣……之名”的含义
  choice: 保留“之名”
  alternative: 释义为“耶稣的身份和权柄”
  rationale: ὄνομα可涵盖名字、身份、权柄及其所代表的人。正文不将多义性缩减为单一神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。破折号补明腓利所传福音的内容，使较长的希腊分词结构在中文中层次清楚；“陆续受了洗”体现未完成时体。
