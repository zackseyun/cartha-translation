  naturalness: “耶稣这位弥赛亚之名”中“之”使名词链显得生硬；“男男女女”偏口语化且不如“男人和女人”准确对应原文的并列。改为单一的“腓利所传的福音”结构，并用“耶稣这位弥赛亚的名”和“男人和女人都”可使行文更自然庄重。
  terminology: 保留“上帝的国”“福音”“受洗”和“弥赛亚”。Χριστός在此作为称号，以“耶稣这位弥赛亚”呈现；“名”保留原文ὄνομα的开放含义，不将其限定解释为身份或权柄。
