  text: ᾧ προσεῖχον ⸀πάντες ἀπὸ μικροῦ ἕως μεγάλου λέγοντες· Οὗτός ἐστιν ἡ Δύναμις τοῦ θεοῦ ἡ ⸀καλουμένη Μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/010.yaml
  text: They all paid attention to him[a], from the least to the greatest, saying, “This man is the power of God that is called Great.”
translation:
  language: zh_hans
  text: 众人，从小到大，都留意他，说：“这人就是上帝的能力，即那被称为‘大’的能力。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这就是所谓‘上帝的大能’。”希腊原文也可较紧凑地理解为一个称号。
    reason: alternative_reading
lexical_decisions:
- source_word: ᾧ προσεῖχον
  choice: 都留心听他
  rationale: προσέχω在这里表示把注意力集中在某人身上、听从或留意他。“留心听他”符合现代汉语表达，也不至于强化为效忠或信奉。
- source_word: πάντες
  choice: 众人……都
  rationale: 明确表达原文所指群体的全体成员，并采用自然的汉语呼应结构。
- source_word: ἀπὸ μικροῦ ἕως μεγάλου
  choice: 无论尊卑
  rationale: 这是涵盖整个社会范围的两极并举表达。“无论尊卑”避免“从小到大”被误解为年龄，同时保留不分地位高低的含义。
- source_word: λέγοντες
  choice: 说
  rationale: 分词表示他们在留心听他的同时所说的话；汉语用并列谓语“说”最自然。
- source_word: Οὗτός
  choice: 这人
  rationale: 指向西门本人。“这人”在现代汉语中清楚自然，并保留指示意味。
- source_word: ἡ Δύναμις τοῦ θεοῦ
  choice: 上帝……的能力
  rationale: 保留定冠词短语的称号色彩和群众对西门所作的惊人断言；译文把这一断言明确置于引语中，不把它当作叙述者的认定。
- source_word: ἡ καλουμένη Μεγάλη
  choice: 那称为‘大能’的
  rationale: καλουμένη表示被这样称呼或冠名，Μεγάλη在这里具有称号性质。用引号标明“大能”是名称，同时保留修饰“能力”的希腊语结构。
- source_word: Μεγάλη
  choice: 大能
  rationale: 单译“大”在汉语称号中生硬；“大能”既与δύναμις的语义呼应，也自然呈现其作为尊号的功能，而不把群众的说法升级为叙述者认可的神学称号。
theological_decisions:
- issue: 群众的话应译成正式的神圣称号，还是对西门身份的描述性断言
  choice: 译作“这人就是上帝那称为‘大能’的能力”
  alternative: “这就是所谓‘上帝的大能’”
  rationale: 原文是在报道群众对西门的称誉，并非叙述者认可该说法。正文保留“上帝的能力”及“称为大能”之间的语法关系和称号色彩；脚注列出较紧凑、整体称号式的理解，以保存原文可能产生的表达张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“无论尊卑”传达原文两极并举的社会范围；引语中的称号加引号，以帮助读者辨明这是群众对西门的称呼。脚注标记已在正文中对应出现。
