id: ACT.8.35
reference: Acts 8:35
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἀνοίξας δὲ ὁ Φίλιππος τὸ στόμα αὐτοῦ καὶ ἀρξάμενος ἀπὸ τῆς γραφῆς ταύτης εὐηγγελίσατο αὐτῷ τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/035.yaml
  text: Then Philip opened his mouth[a], and beginning from this Scripture[b], he proclaimed the good news about Jesus to him.
translation:
  language: zh_hans
  text: 于是，腓利开口，从这段经文讲起[a]，向他传讲关于耶稣的福音[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以这段经文为起点。”
    reason: lexical_alternative
  - marker: b
    text: 直译：“向他传福音——耶稣。”也就是传讲关于耶稣的福音。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνοίξας ... τὸ στόμα αὐτοῦ
  choice: 开口
  rationale: 这是表示开始说话的惯用语。“开口”既保留希腊文的形象和叙事庄重感，也符合现代汉语表达。
- source_word: δὲ
  choice: 于是
  rationale: 此处用于推进叙事。“于是”自然承接前文太监的提问，并不过度强化时间或因果关系。
- source_word: ἀρξάμενος ἀπὸ τῆς γραφῆς ταύτης
  choice: 从这段经文讲起
  rationale: ἀπό表明讲解的起点；“从……讲起”在现代汉语中自然，并忠实表达腓利以刚才所读经文为起点。
- source_word: γραφῆς
  choice: 经文
  rationale: γραφή在此指神圣经典中的文字。结合上下文所引用的具体段落，“这段经文”比单说“这书写”清楚自然，同时不改变其圣经属性。
- source_word: εὐηγγελίσατο
  choice: 传讲……的福音
  rationale: 该动词意为宣告好消息。“传讲……的福音”保留其宣告福音的力度，也避免“布道”等可能带有较强制度色彩的说法。
- source_word: αὐτῷ
  choice: 向他
  rationale: 按原文保留代词，所指由上下文可清楚辨认，无须在本节增添“太监”或“官员”。
- source_word: τὸν Ἰησοῦν
  choice: 关于耶稣
  rationale: 在εὐαγγελίζομαι之后，宾格可表示所传好消息的内容。译作“关于耶稣的福音”使现代读者清楚理解耶稣是宣讲的内容和中心；脚注保留希腊文更直接的结构。
theological_decisions:
- issue: εὐηγγελίσατο αὐτῷ τὸν Ἰησοῦν的含义
  choice: 向他传讲关于耶稣的福音
  alternative: 向他传讲耶稣
  rationale: 希腊文直接把“耶稣”置于传福音动词之后，表明耶稣是所宣告福音的内容和中心。正文采用自然清楚的现代汉语，脚注则保存原文简洁而有力的表达，未进一步限定腓利讲论的具体范围。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“开口”保留原文惯用表达；“从这段经文讲起”自然呈现讲解的起点；正文清楚表达耶稣是福音宣讲的中心，并以脚注保留希腊文结构。
