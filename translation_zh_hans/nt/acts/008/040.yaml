  text: Φίλιππος δὲ εὑρέθη εἰς Ἄζωτον, καὶ διερχόμενος εὐηγγελίζετο τὰς πόλεις πάσας ἕως τοῦ ἐλθεῖν αὐτὸν εἰς Καισάρειαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/040.yaml
  text: But Philip was found at Azotus[a], and as he passed through, he was proclaiming the good news to all the cities until he came to Caesarea.
translation:
  language: zh_hans
  text: 腓利却在亚锁都被发现[a]。他一路经过各城，不断传扬福音，直到来到凯撒利亚。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“出现在亚锁都。”希腊文直译为“在亚锁都被发现”；结合上下文，这可能暗示他被神突然转移到那里，但本句并未明说。
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: 却
  rationale: 承接上一节圣灵把腓利提走的叙述，并以轻微转折引出他随后所在之处；“却”在现代汉语中自然保留这一连接作用。
- source_word: εὑρέθη
  choice: 被人发现
  rationale: 按被动语态直译其基本意义，同时避免把上下文所暗示的超自然转移明确解释成“突然出现”。汉语补出泛指施事“人”，使被动表达自然。
- source_word: εἰς Ἄζωτον
  choice: 在亚锁都
  rationale: εἰς在表示发现或处于某状态的结构中可指结果所在之处；译作“在”符合现代汉语地点表达。地名采用通行圣经译名“亚锁都”。
- source_word: διερχόμενος
  choice: 一路经过各城
  rationale: 分词表示与传扬福音同时发生的行程；“一路经过”自然呈现他沿途行进的动态，并与后面的各城相接。
- source_word: εὐηγγελίζετο
  choice: 不断传扬福音
  rationale: 未完成时呈现持续或反复进行的行动；“不断”体现这一体貌。“传扬福音”准确、通行且普通读者易懂。
- source_word: τὰς πόλεις πάσας
  choice: 各城
  rationale: 表达沿途所有城市的集合与分布意义；“各城”比逐字译作“所有的城市”更自然简洁。
- source_word: ἕως τοῦ ἐλθεῖν αὐτὸν
  choice: 直到来到
  rationale: ἕως加带冠词不定式标明持续行动的终点；汉语“直到来到”保留这一界限关系。
- source_word: εἰς Καισάρειαν
  choice: 来到凯撒利亚
  rationale: εἰς与ἔρχομαι共同表示目的地；汉语以“来到”自然表达抵达。地名采用通行译名“凯撒利亚”。
theological_decisions:
- issue: 是否把εὑρέθη明确译成腓利神奇地显现或被转移到亚锁都
  choice: 正文保留中性的“被人发现”
  alternative: “出现在亚锁都”或“发现自己已在亚锁都”
  rationale: 上下文强烈暗示神的超自然作为，但本节希腊文本本身只说腓利“被发现”。正文不把暗示提升为明说，脚注则交代可理解为“出现在”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“一路……不断……”流畅呈现沿途持续传福音的行动；正文保留原文对超自然转移方式的含蓄表达。
