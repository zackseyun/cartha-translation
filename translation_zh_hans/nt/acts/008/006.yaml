base_translation:
  language: en
  yaml_path: translation/nt/acts/008/006.yaml
  text: And the crowds with one accord paid close attention to what was being said by Philip[b][a], as they heard him and saw the signs that he was doing.
translation:
  language: zh_hans
  text: 众人听着腓利所讲的话，又看着他所行的神迹时，都齐心[b]留意[a]他所讲的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “留意”也可译作“注意”或“听从”。
    reason: lexical_alternative
  - marker: b
    text: “齐心”也可译作“一致地”或“一同”；原文强调众人共同一致的反应。
    reason: lexical_alternative
lexical_decisions:
- source_word: προσεῖχον
  choice: 留意
  rationale: 这里指把注意力集中在某事上并持续听从；“留意”简洁自然，并由上下文体现未完成时所描写的持续状态。
- source_word: δὲ
  choice: 未单独译出，以“就”衔接
  rationale: δέ在这里是轻微的叙事连接词；汉语按事件关系用“就”承接，更自然，也不误加转折意味。
- source_word: οἱ ὄχλοι
  choice: 众人
  rationale: 指聚集的人群。现代汉语中“众人”自然明白，也符合此处群体性的语境。
- source_word: τοῖς λεγομένοις ὑπὸ τοῦ Φιλίππου
  choice: 腓利所讲的
  rationale: 保留被动结构所表达的内容和腓利作为说话者的关系，同时避免生硬的“被腓利所说的事”。
- source_word: ὁμοθυμαδὸν
  choice: 齐心
  rationale: 表达众人共同一致的反应，比仅译作“一起”更能保留原词所强调的同心一致。
- source_word: ἐν τῷ ἀκούειν αὐτοὺς καὶ βλέπειν
  choice: 众人听见……又看见
  rationale: ἐν τῷ加不定式在此表示伴随或时间情境。αὐτούς最自然地作为两个不定式的宾格主语，指众人，而不是译成“听见他”；听见的内容根据上文补明为“腓利所说的话”。
- source_word: τὰ σημεῖα
  choice: 神迹
  rationale: σημεῖον本义是具有指示意义的“记号、征兆”；在本段超自然作为的语境中，“神迹”是现代中文圣经语体中自然且易懂的对应词，并保留其彰显、印证的功能。
- source_word: ἃ ἐποίει
  choice: 他所行的
  rationale: “行神迹”是自然庄重的搭配；上下文中的并列叙述可承载未完成时所表示的持续、反复行动。
theological_decisions:
- issue: σημεῖα是否明确译为超自然神迹
  choice: 神迹
  alternative: 记号
  rationale: 本节及紧邻上下文描述污灵出去和瘫痪、瘸腿者得医治，因此这里的“记号”具体表现为超自然作为；译作“神迹”符合语境，但不额外规定其系统神学意义。
- issue: αὐτούς在不定式结构中的句法角色
  choice: 理解为“众人”是“听见、看见”的主语
  alternative: 理解为听见的宾语，译作“听见他”
  rationale: αὐτούς为复数宾格，与前面的“众人”相应，可在ἐν τῷ加不定式结构中作逻辑主语；若指腓利作宾语，通常应为单数αὐτόν。这样处理既遵从所给希腊文本，也避免依照英文咨询层擅改数。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语体。为避免主句与时间从句机械重复，前半句说“腓利所说的话”，后半句用“他所讲的”回指同一内容；“听见……又看见……就……”清楚呈现众人因耳闻目睹而共同留意的叙事关系。
