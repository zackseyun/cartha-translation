  text: οὐκ ἔστιν σοι μερὶς οὐδὲ κλῆρος ἐν τῷ λόγῳ τούτῳ, ἡ γὰρ καρδία σου οὐκ ἔστιν εὐθεῖα ⸀ἔναντι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/021.yaml
  text: You have neither part nor share in this matter, because your heart is not right before God.
translation:
  language: zh_hans
  text: 在这件事上，你没有分，也没有份；因为你的心在上帝面前不正。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μερίς
  choice: 分
  rationale: 保留“所分得的部分、参与之分”的基本意象，并与后面的近义词构成并列。
- source_word: κλῆρος
  choice: 份
  rationale: 本义可指抽签所得之份或产业份额；此处与μερίς并列，表达完全无分无份，不具体化为抽签。
- source_word: ἐν τῷ λόγῳ τούτῳ
  choice: 在这事上
  rationale: λόγος在此语境中更自然地指眼前所谈及的事，而非单指言语或信息。
- source_word: εὐθεῖα
  choice: 正
  rationale: 表达正直、端正以及与上帝要求相合的状态，保留原文对内心状况的判断。
- source_word: ἔναντι τοῦ θεοῦ
  choice: 在上帝面前
  rationale: 直译其关系性和审判性视角，表明判断以属上帝的察看为准。
theological_decisions:
- issue: “分”和“份”所指的范围
  choice: 保留近义并列，不明确限定为救恩、职分或圣灵的恩赐
  alternative: 译作“在这道上没有任何关系或权利”
  rationale: 原文用μερίς与κλῆρος加强排除之意，但没有在本节单独界定所指范围；译文不应替原文消除这种语境张力。
- issue: “心不正”的性质
  choice: 译为“你的心在上帝面前不正”
  alternative: 译为“你在上帝面前动机不纯”
  rationale: “动机不纯”虽符合上下文，却缩窄了καρδία与εὐθεῖα的整体性含义；保留“心”与“不正”更忠实。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“既没有分，也没有份”保留原文两个近义名词的修辞力度；全节句式简洁，适合公开诵读。
