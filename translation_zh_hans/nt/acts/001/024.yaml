id: ACT.1.24
reference: Acts 1:24
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ προσευξάμενοι εἶπαν Σὺ κύριε καρδιογνῶστα πάντων, ἀνάδειξον ὃν ἐξελέξω, ἐκ τούτων τῶν δύο ἕνα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/024.yaml
  text: And after praying[a], they said, “You, Lord, knower of the hearts of all[b], show which one of these two you have chosen,”
translation:
  language: zh_hans
  text: 他们祷告之后，说：“主啊[b]，你洞察众人的心；求你指明[a]你从这两人中所拣选的那一位。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “指明”也可译作“指定”或“显明”；这个动词既可表示使人知道，也可表示公开指定。
    reason: lexical_alternative
  - marker: b
    text: 这里的“主”可以理解为泛指神，也可以理解为特指耶稣；希腊文本没有明确说明所指。
    reason: alternative_reading
lexical_decisions:
- source_word: προσευξάμενοι
  choice: 祷告之后
  rationale: 不定过去时分词通常表示先于主句动作发生的行动；“祷告之后”既自然，也清楚保留先祷告、后开口说话的次序。
- source_word: Σὺ κύριε
  choice: 主啊，你
  rationale: “主啊”自然表达呼格；随后明说“你”，保留希腊文显式人称代词所带的强调，同时不额外判定所指是谁。
- source_word: καρδιογνῶστα πάντων
  choice: 你知道众人的心
  rationale: 以现代汉语自然表达复合名词“知心者”的含义，并保留 πάντων 所指的“众人”。这里的“心”指人的内在思想、意愿和动机。
- source_word: ἀνάδειξον
  choice: 指明
  rationale: 在求主确认两位候选人中哪一位已蒙拣选的语境里，“指明”兼有使人知道、明确指出之意，又不把该词过度限定为正式任命。
- source_word: ὃν ἐξελέξω
  choice: 你所拣选的那一个
  rationale: 关系代词与动词共同指向主已经拣选的人；“所拣选的那一个”在汉语中自然，并保留该拣选先于求主指明这一行动的语意。
- source_word: ἐκ τούτων τῶν δύο ἕνα
  choice: 这两个人中……那一个
  rationale: 清楚表达从眼前两位候选人中选出一位。结合上下文补出量词“个人”，符合现代汉语习惯，不增添身份或职分信息。
theological_decisions:
- issue: 祷告中“主”的所指
  choice: 正文仅译作“主”，不明确指定是父神还是复活的耶稣。
  alternative: 可理解为对神一般性的称呼，也可理解为特指复活的耶稣。
  rationale: 希腊文只说 Σὺ κύριε，本节没有明说所指。保留这一称呼及其开放性，避免替经文消除真实的释义张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“祷告之后，说”保留原文行动次序；分号使称呼主为洞察人心者与随后的祈求层次清楚。脚注标记放在实际涉及的词语之后：[a]对应“指明”，[b]对应“主”，以避免标记与注释内容错位。
