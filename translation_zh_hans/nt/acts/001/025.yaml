source:
  edition: SBLGNT
  text: λαβεῖν τὸν ⸀τόπον τῆς διακονίας ταύτης καὶ ἀποστολῆς, ⸀ἀφ’ ἧς παρέβη Ἰούδας πορευθῆναι εἰς τὸν τόπον τὸν ἴδιον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/025.yaml
  text: to take the place of this ministry and apostleship[b][a], from which Judas turned aside to go to his own place.
translation:
  language: zh_hans
  text: 来接替这项服事和使徒职分；犹大偏离了这项服事和使徒职分[a]，往自己的地方去了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “偏离”也可译作“离开”或“背弃”。希腊文动词可表示偏离或离开这项服事和使徒职分。
    reason: lexical_alternative
  - marker: b
    text: “自己的地方”可能只是指属于犹大的去处，也可能更含蓄地指他所当受的审判之处。
    reason: alternative_reading
lexical_decisions:
- source_word: λαβεῖν τὸν τόπον
  choice: 来接替
  rationale: 此处不定式承接上文祷告的内容，指获选者接任空缺的职分。“接替”自然表达承担前任位置，也保留上下文中的职位转换。
- source_word: διακονίας
  choice: 服事
  rationale: διακονία 指受托的服务；“服事”在现代中文中既清楚又能体现其服务性质，不把它局限为制度化的教会职位。
- source_word: ἀποστολῆς
  choice: 使徒职分
  rationale: 此处指使徒的委任与职分，而非一般意义的差遣或使命；“使徒职分”准确而庄重。
- source_word: ἀφ’ ἧς παρέβη
  choice: 犹大偏离了这职分
  rationale: παραβαίνω 在此表示越离、离弃先前承担的服事与使徒职分。“偏离”保留偏离正途的意味，同时不将其过度解释为某一技术性的教义术语。
- source_word: πορευθῆναι
  choice: 往……去了
  rationale: πορεύομαι 的基本意义是去、前往；中文以“往……去了”自然表达其方向与结果。
- source_word: εἰς τὸν τόπον τὸν ἴδιον
  choice: 往自己的地方去了
  rationale: 直译并保留原文简短而含蓄的表达，不在正文中断定这是坟墓、审判之地或其他特定归宿。
theological_decisions:
- issue: “自己的地方”是否明确指犹大的最终刑罚
  choice: 正文保留“自己的地方”的含混表达
  alternative: 明确译作坟墓、地狱、受审判之处，或他应得的归宿
  rationale: 希腊文没有明说该地方为何处。保留含混可避免把可能带有审判意味的措辞确定化为原文未明确陈述的教义结论。
- issue: 犹大与使徒职分分离的性质
  choice: 译作“偏离了这职分”
  alternative: 译作“离开了”“背弃了”或“违犯了”
  rationale: 原动词可表示越界、偏离或离开。此处译文既呈现犹大主动偏离职分，也避免仅凭该动词决定其离开的精确神学性质。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“这项服事和使徒职分”将两个并列名词视为同一空缺角色的两个方面；分号帮助呈现后半句对犹大的说明。所有脚注标记均置于相关正文之后。
