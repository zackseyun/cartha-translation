source:
  edition: SBLGNT
  text: εἶπεν ⸀δὲ πρὸς αὐτούς· Οὐχ ὑμῶν ἐστιν γνῶναι χρόνους ἢ καιροὺς οὓς ὁ πατὴρ ἔθετο ἐν τῇ ἰδίᾳ ἐξουσίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/007.yaml
  text: But he said to them[b][a], “It is not for you to know times or seasons that the Father has set by his own authority.”
translation:
  language: zh_hans
  text: 耶稣却对他们说：“父凭自己的权柄[b]所定的时期或时刻[a]，不是你们可以知道的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “时期或时刻”也可译作“时间或所定的时机”。希腊文用了两个相关的时间词：χρόνοι可侧重一段时期，καιροί可侧重特定、合宜或指定的时刻；这里未必是在作严格的术语区分。
    reason: lexical_alternative
  - marker: b
    text: “凭自己的权柄”原文直译为“在自己的权柄中”。此处表示这些时间由父按其自身的权柄设定。
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: 却
  rationale: 表示从门徒的提问转到耶稣的纠正性回答，带有温和的转折意味；“却”在现代汉语中自然简洁。
- source_word: Οὐχ ὑμῶν ἐστιν γνῶναι
  choice: 不是你们可以知道的
  rationale: 表达这种知识不属于门徒获知的范围或权限；避免译成更强的“你们无权知道”，以免过度解释。
- source_word: χρόνους
  choice: 时期
  rationale: χρόνος在这里可指延续的时间或时段；“时期”能与后面的“时刻”形成自然而不过度技术化的区别。
- source_word: καιρούς
  choice: 时刻
  rationale: καιρός常指适宜、指定或关键的时间点；“时刻”保留与“时期”的相关而有别的含义。
- source_word: ὁ πατὴρ
  choice: 父
  rationale: 原文是带冠词的“父”，并没有“我的”；中文按圣经语境采用称谓“父”。
- source_word: ἔθετο
  choice: 所定的
  rationale: τίθημι在此有设定、确定之意；“所定的”简洁表达父已经确定这些时间。
- source_word: ἐν τῇ ἰδίᾳ ἐξουσίᾳ
  choice: 凭自己的权柄
  rationale: ἐξουσία指权柄、权限或主权；“凭自己的权柄”自然表达父依其自身权柄作出设定，同时脚注保留介词短语较直译的可能。
theological_decisions:
- issue: χρόνους与καιρούς这一对时间词的译法
  choice: 时期或时刻
  alternative: 时间或所定的日期；时候或日期
  rationale: 保留两个相关但并不完全相同的词，又不建立原文未明确给出的末世时间分类。“时期”偏向时间段，“时刻”偏向特定或关键之时。
- issue: ἐν τῇ ἰδίᾳ ἐξουσίᾳ所表达的父的权柄
  choice: 凭自己的权柄
  alternative: 在自己的权柄中；由自己的权柄掌管
  rationale: 清楚表达这些时间由父按其自身权柄设定，同时不加入经文没有明说的系统神学表述。
- issue: “不是你们可以知道的”所涉及的限制
  choice: 保留对门徒获知范围或权限的限制
  alternative: 你们无权知道；你们不可能知道
  rationale: 原文惯用语重点不只是认知能力，也涉及这知识并不属于他们；所选译法避免把它绝对化为认知上的不可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“父”保留原文称谓；“时期或时刻”兼顾词义区别与汉语可读性。主句调整为中文自然语序，将父所定的时间置于前部。
