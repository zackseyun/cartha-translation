source:
  edition: SBLGNT
  text: γέγραπται γὰρ ἐν βίβλῳ ψαλμῶν· Γενηθήτω ἡ ἔπαυλις αὐτοῦ ἔρημος καὶ μὴ ἔστω ὁ κατοικῶν ἐν αὐτῇ, καί· Τὴν ἐπισκοπὴν αὐτοῦ ⸀λαβέτω ἕτερος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/020.yaml
  text: For it is written in the book of Psalms[a], ‘Let his dwelling place become desolate, and let there be no one dwelling in it,’ and[c][b], ‘Let another take his office.’
translation:
  language: zh_hans
  text: 因为《诗篇》上写着：“愿他的住处变为荒凉，无人住在其中”；又说：“愿别人接替他的职分。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “职分”所译的希腊词也可译作“监督之职”或“职位”。这里指犹大原先承担、如今需要由别人接替的职责，并不必然是后期教会制度中的特定职称。
    reason: alternative_reading
lexical_decisions:
- source_word: γέγραπται
  choice: 写着
  rationale: 这是新约引用经文的常用完成时被动表达；“写着”自然地保留了所写之言持续有效的意味。
- source_word: ἐν βίβλῳ ψαλμῶν
  choice: 《诗篇》上
  rationale: 自然、清楚地标明引文来源；现代中文通常以《诗篇》指这卷经书，无须生硬译作“诗篇书卷中”。
- source_word: Γενηθήτω
  choice: 愿……变为
  rationale: 保留不定过去时命令式在诗篇引文中的祈愿或咒诅语气，并符合庄重的中文引文风格。
- source_word: ἔπαυλις
  choice: 住处
  rationale: 概括住所、居所之义，在现代中文中简明自然，也适合诗篇引文的语域。
- source_word: ἔρημος
  choice: 荒凉
  rationale: 表达该处被弃而无人居住的状态，并保留经文庄重凝练的语气。
- source_word: μὴ ἔστω ὁ κατοικῶν ἐν αὐτῇ
  choice: 无人住在其中
  rationale: 忠实表达“其中不要有居住者”，同时避免不自然的欧化句式。
- source_word: ἐπισκοπή
  choice: 职分
  rationale: 此处指犹大原有、现需由别人承担的职责或职位；“职分”既自然庄重，又不预设后期教会制度中的技术性职称。
- source_word: λαβέτω ἕτερος
  choice: 愿别人接替
  rationale: 结合空缺职分的上下文，“接替”自然表达由另一人取得并承担该职分；“愿”保留命令式引文的祈愿语气。
theological_decisions:
- issue: 使徒职位语境中ἐπισκοπή的译法
  choice: 职分
  alternative: 监督之职；职位
  rationale: 原词可指监督、照管的职责，也可指相应职务。此处应用诗篇于犹大留下的空缺，“职分”传达其角色和责任，却不把后期特定教职制度读入经文。脚注保留较贴近词源的译法。
translation_notes:
  register: 采用现代、庄重而易懂的经文语体。两处诗篇引文以分号和“又说”清楚衔接；避免使用可能使普通读者误解为后期固定教阶的术语。
