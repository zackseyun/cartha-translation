  text: καὶ ταῦτα εἰπὼν βλεπόντων αὐτῶν ἐπήρθη καὶ νεφέλη ὑπέλαβεν αὐτὸν ἀπὸ τῶν ὀφθαλμῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/009.yaml
  text: And after he said these things[a], as they were watching, he was lifted up[c][b], and a cloud took him out of their sight.
translation:
  language: zh_hans
  text: 他说完这些话，正当他们观看的时候，他被举起来了[a]；一朵云彩把他从他们眼前接去了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“被接上去”。
    reason: lexical_alternative
  - marker: b
    text: “接去”也可译“接走”。云在圣经的一些场景中与上帝的临在有关，不过本节没有明确说明这里的云具有这一含义。
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: καὶ
  choice: （按汉语叙事衔接省略直译）
  rationale: καὶ承接上文；现代汉语在此无需另加“于是”或“然后”，以免强化原文没有明确表达的时间关系。
- source_word: ταῦτα εἰπὼν
  choice: 说完这些话
  rationale: ταῦτα为复数，回指耶稣先前所说的内容；不拘泥于“这些事”，译作“这些话”更符合汉语语境。分词所表达的先行动作以“说完”自然呈现。
- source_word: βλεπόντων αὐτῶν
  choice: 他们正看着的时候
  rationale: 属格独立结构表示与主句同时发生的伴随情形；“正……的时候”既体现持续观看，也符合现代汉语表达。
- source_word: ἐπήρθη
  choice: 被举了起来
  rationale: 保留被动语态及可见的向上运动，不明确补出施事者，也不预先将其解释为某种固定的神学用语。
- source_word: νεφέλη
  choice: 一朵云
  rationale: 原文为无冠词单数名词；译作“一朵云”自然且不在正文中明定其象征意义。
- source_word: ὑπέλαβεν
  choice: 把他接去
  rationale: 该动词在此可有“接住、接走、接去”之意；“接去”既表达云承接他的动作，也与随后离开视线的结果相连，同时保留一定语义张力。
- source_word: ἀπὸ τῶν ὀφθαλμῶν αὐτῶν
  choice: 使他离开了他们的视线
  rationale: 这是符合现代汉语的表达，传达他不再处于他们肉眼可见范围之内，而不生硬直译为“从他们的眼睛那里”。
theological_decisions:
- issue: ἐπήρθη是否采用更具传统神学色彩的升天表达
  choice: 被举了起来
  alternative: 被接上去
  rationale: 正文贴近动词的基本图像及被动形式，描述可见的向上运动，却不补明动作的施行者；脚注保留另一种可行译法。
- issue: 是否在正文中明确说明云象征上帝的临在
  choice: 仅译作“一朵云”
  alternative: 带有上帝临在象征意义的云
  rationale: 圣经中的云确实可能具有神显关联，但本节没有明说；因此不把这一解释写入正文，只在脚注中提示可能的经文回响。
- issue: ὑπέλαβεν所描绘的是遮蔽、承接还是带走
  choice: 把他接去
  alternative: 把他接住
  rationale: 原词允许“接纳、承接、接去”等理解。正文采用能自然说明他随即离开门徒视线的“接去”，脚注保留较贴近“承接”的译法，避免将动作细节绝对化。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。句式保持简洁叙事感；以“被举了起来”保留原文被动及向上运动，以“接去”呈现ὑπέλαβεν的开放语义，不在正文中加入未明说的神学解释。
