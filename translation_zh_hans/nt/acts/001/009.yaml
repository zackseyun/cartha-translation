  naturalness: “被举了起来”可以理解，但“被举起来了”更合现代汉语叙事习惯。“一朵云”可用；“云彩”在庄重的经文语体中较自然。“把他接住”在现代汉语中容易理解为防止坠落的接住，不宜作为此处的主要词汇备选。
  terminology: 不应在正文中把云明说为上帝临在的象征。保留“被举起来了”而不补出施事者，恰当地保留原文被动形式及其叙事开放性。“接去”可保留，脚注宜以“接走”说明可行的自然替代译法。
