revisions:
- from: 他说完这些话，他们正看着的时候，他就被举了起来[a]；一朵云把他接去[b]，使他离开了他们的视线。
  to: 他说完这些话，正当他们观看的时候，他被举起来了[a]；一朵云彩把他从他们眼前接去了[b]。
  rationale: 修订使汉语更简洁自然，并将“从他们眼前”直接归入云承接、带离耶稣的动作，较准确地对应原文的句法和叙事效果。脚注删除在现代汉语中容易误导的“接住”，同时继续以审慎措辞保留云可能具有的经文关联，而不将其写入正文。
