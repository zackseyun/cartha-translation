  yaml_path: translation/nt/acts/001/015.yaml
  text: And in those days Peter stood up in the midst of the brothers and said (the number of names together was about one hundred twenty),[a]
translation:
  language: zh_hans
  text: 那些日子，彼得在弟兄们[a]中间站起来说（当时聚集在一起的总人数约有一百二十人）：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄们”也可理解为“弟兄姊妹”；希腊原文作“弟兄们”，但这里聚集的信徒群体可能也包括女性。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: 站起来
  rationale: 这里的过去时分词引出彼得发言前的具体动作；“站起来”自然、清楚，也符合群体聚会中的发言场景。
- source_word: ἐν μέσῳ
  choice: 在……中间
  rationale: 保留彼得置身于聚集群体之中的空间意味，同时符合现代汉语表达。
- source_word: ἀδελφῶν
  choice: 弟兄们
  rationale: 保留希腊文阳性复数的形式；鉴于上下文中的群体也可能包括女性信徒，以脚注说明其可能具有包容性。
- source_word: ὄχλος ὀνομάτων
  choice: 人
  rationale: 该短语字面为“名字的群体”，实际是以“名字”指被登记或数点的人。直译成“名字的数目”在现代汉语中生硬，因此按其习语意义译作“人”。
- source_word: ἐπὶ τὸ αὐτό
  choice: 聚在一起
  rationale: 表达众人共同聚集的状态，不把该短语过度限定为某一个具体地点。
- source_word: ὡς ἑκατὸν εἴκοσι
  choice: 约有一百二十人
  rationale: ὡς用于数目前表示约数；“约有”是自然、准确的现代汉语。
- source_word: τε
  choice: 当时
  rationale: τε承接叙述并引入括注信息；汉语中不必机械译作“并且”，以“当时”自然连接该背景说明。
theological_decisions:
- issue: 聚集群体中ἀδελφῶν的性别指向
  choice: 正文译作“弟兄们”，脚注说明也可能泛指弟兄姊妹
  alternative: 正文直接译作“弟兄姊妹”或“信徒们”
  rationale: 正文保留原文阳性复数的形式，同时不排除其在此处可能包括女性信徒；脚注保存这一语义与语境张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。括号保留原文插入的背景说明；“约有一百二十人”按希腊习语的实际意义表达，避免生硬的“名字的数目”。
