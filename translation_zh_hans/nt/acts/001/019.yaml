  text: καὶ γνωστὸν ἐγένετο πᾶσι τοῖς κατοικοῦσιν Ἰερουσαλήμ, ὥστε κληθῆναι τὸ χωρίον ἐκεῖνο τῇ ⸀ἰδίᾳ διαλέκτῳ αὐτῶν Ἁκελδαμάχ, τοῦτ’ ἔστιν Χωρίον Αἵματος.—
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/019.yaml
  text: And it became known to all those living in Jerusalem[a], so that in their own language that field was called Akeldamach, that is[b], Field of Blood.
translation:
  language: zh_hans
  text: 所有住在耶路撒冷的人都知道了这件事，以致那块田在他们自己的语言[a]中被称为“哈刻大玛赫”[b]，意思是“血田”。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在他们自己的方言中”。希腊语 διάλεκτος 既可指某地区的方言，也可较宽泛地指一种语言。
    reason: lexical_alternative
  - marker: b
    text: “哈刻大玛赫”按本节希腊文 Ἁκελδαμάχ 的形式音译；中文圣经传统中更常见的译名是“亚革大马”。
    reason: alternative_reading
lexical_decisions:
- source_word: γνωστὸν ἐγένετο
  choice: 这件事传遍了
  rationale: 该无人称结构表示事情变得为人所知；“传遍了”在现代汉语中自然地表达众人都知道的结果，又没有增添事情如何传开的细节。
- source_word: πᾶσι τοῖς κατοικοῦσιν Ἰερουσαλήμ
  choice: 所有住在耶路撒冷的人
  rationale: 直接保留 πᾶσι 的全称范围，并以自然现代汉语表达 κατοικοῦσιν 的居住含义。
- source_word: ὥστε
  choice: 因此
  rationale: 此处引出实际结果；“因此”在汉语中简洁地衔接广为人知与田地得名，按结果关系理解，而非另立神学或逻辑推论。
- source_word: κληθῆναι
  choice: 被称为
  rationale: 保留希腊语被动语态及“称呼、叫作”的基本意义。
- source_word: τὸ χωρίον ἐκεῖνο
  choice: 那块田
  rationale: χωρίον 可指一块地或田地；译作“田”与本句随后给出的“血田”保持词义呼应。
- source_word: τῇ ἰδίᾳ διαλέκτῳ αὐτῶν
  choice: 用他们自己的语言
  rationale: διάλεκτος 可指语言，也可指方言；正文采用较宽泛自然的“语言”，并以脚注保存“方言”的可能性。
- source_word: Ἁκελδαμάχ
  choice: 哈刻大玛赫
  rationale: 按 SBLGNT 所载希腊语形式音译，保留词尾 χ；脚注同时说明现代中文圣经中更常见的传统译名。
- source_word: τοῦτ’ ἔστιν
  choice: 意思是
  rationale: 自然表达原文引出释义的公式，同时明确后面的“血田”是前面名称的含义。
- source_word: Χωρίον Αἵματος
  choice: 血田
  rationale: 简洁对应“田地/田”与“血”的属格结构，并作为地名释义加引号。
