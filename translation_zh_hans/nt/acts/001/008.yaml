  text: ἀλλὰ λήμψεσθε δύναμιν ἐπελθόντος τοῦ ἁγίου πνεύματος ἐφ’ ὑμᾶς, καὶ ἔσεσθέ ⸀μου μάρτυρες ἔν τε Ἰερουσαλὴμ καὶ ἐν πάσῃ τῇ Ἰουδαίᾳ καὶ Σαμαρείᾳ καὶ ἕως ἐσχάτου τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/008.yaml
  text: But you will receive power when the Holy Spirit has come upon you[a], and you will be my witnesses in Jerusalem, and in all Judea and Samaria, and to the end of the earth.
translation:
  language: zh_hans
  text: 可是，圣灵降临在你们身上时，你们必领受能力，并且要在耶路撒冷、在整个犹太地区和撒玛利亚，直到地极，作我的见证人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “直到地极”也可译作“直到大地最远之处”。希腊原文用单数，按惯用法指全地最遥远的地方。
    reason: 说明ἕως ἐσχάτου τῆς γῆς的单数形式、惯用含义及直译选择。
lexical_decisions:
- source_word: ἀλλὰ
  choice: 可是
  rationale: 承接第7节形成转折；“可是”自然清楚，又保留较庄重的叙述语气。
- source_word: λήμψεσθε δύναμιν
  choice: 你们必领受能力
  rationale: λαμβάνω在此指接受所赐之物；“领受”适合圣经语境而仍为现代汉语。“能力”保留δύναμις宽泛的赋能力量之义。
- source_word: ἐπελθόντος τοῦ ἁγίου πνεύματος ἐφ’ ὑμᾶς
  choice: 圣灵降临在你们身上时
  rationale: 以时间从句表达属格独立结构；“降临在……身上”体现ἐπέρχομαι与ἐπί所表达的临到，同时避免把关系解释得过细。
- source_word: ἔσεσθέ μου μάρτυρες
  choice: 要……作我的见证人
  rationale: 忠实表达将来时和属格μου；“见证人”指为耶稣作证的人，不预先引入后来“殉道者”的词义发展。
- source_word: ἔν τε Ἰερουσαλὴμ καὶ ἐν πάσῃ τῇ Ἰουδαίᾳ καὶ Σαμαρείᾳ
  choice: 在耶路撒冷、整个犹太和撒玛利亚
  rationale: 保留具体地域及πάσῃ所强调的全部范围；汉语用并列地名自然承接共同的介词“在”。
- source_word: ἕως ἐσχάτου τῆς γῆς
  choice: 直到地极
  rationale: 希腊文为单数，表示大地最远之处；“地极”在现代汉语中简洁自然，也保留该惯用语的整体含义。
theological_decisions:
- issue: πνεῦμα的神圣位格所指
  choice: 圣灵
  alternative: 圣神／神圣的灵
  rationale: 上下文中的τοῦ ἁγίου πνεύματος是确定的神圣所指；“圣灵”是现代汉语最通行、且不依赖特定宗派的译法。
- issue: 见证使命的地域范围
  choice: 保留从耶路撒冷经犹太和撒玛利亚直到地极的具体地域展开
  alternative: 将这些地点纯粹象征化
  rationale: 原文列出实际地名并以全球性的远端收束；译文不把这种次序扩展为经文未明说的教会论方案。
- issue: 能力与圣灵降临的时间关系
  choice: “圣灵降临在你们身上时，你们必领受能力”
  alternative: 把能力解释为人自身已有的才干
  rationale: 属格独立结构将领受能力与圣灵临到相联；译文保留这一关系，但不额外规定其具体表现形式。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“必领受”兼顾应许语气与将来时；“作我的见证人”自然表达身份和使命。脚注标记置于整节末尾，明确对应“直到地极”。
