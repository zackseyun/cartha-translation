base_translation:
  language: en
  yaml_path: translation/nt/acts/001/012.yaml
  text: Then they returned to Jerusalem from the mount called Olivet[a], which is near Jerusalem[b], a Sabbath day’s journey away.
translation:
  language: zh_hans
  text: 于是，他们从那称为橄榄山的山上回到耶路撒冷。这山靠近耶路撒冷，离耶路撒冷有一个安息日的路程[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一个安息日的路程”指当时犹太人按惯例可在安息日行走的距离。
    reason: cultural_note
lexical_decisions:
- source_word: Τότε
  choice: 于是
  rationale: 作为叙事中的时间连接词，表示紧接前文发生的下一件事；“于是”自然地承接事件次序。
- source_word: ὑπέστρεψαν εἰς Ἰερουσαλὴμ
  choice: 他们……回到耶路撒冷
  rationale: ὑποστρέφω表示返回，εἰς表示朝向目的地；合译符合现代汉语叙事习惯。
- source_word: ἀπὸ ὄρους
  choice: 从……山上
  rationale: ἀπό表示出发处，ὄρος指山；“从山上”在此准确表达他们离开该处返回城中。
- source_word: τοῦ καλουμένου Ἐλαιῶνος
  choice: 那座称为橄榄山的山
  rationale: 保留“被称为”的结构和地点名称；Ἐλαιῶνος与橄榄相关，在汉语圣经地名传统及现代用法中自然对应“橄榄山”。
- source_word: ὅ ἐστιν ἐγγὺς Ἰερουσαλὴμ
  choice: 这山靠近耶路撒冷
  rationale: 将关系从句另起一句，使所指清楚，并以现代汉语自然表达地理上的接近。
- source_word: σαββάτου ἔχον ὁδόν
  choice: 相距一个安息日的路程
  rationale: 这是犹太文化中的距离说法；译文保留原有文化意象，不把它直接换算成现代长度单位。
theological_decisions:
- issue: σαββάτου ἔχον ὁδόν所表达的犹太安息日距离习语
  choice: 一个安息日的路程
  alternative: 安息日可走的路程
  rationale: 原文以“安息日”修饰“路程”，指当时惯常认可的安息日行程距离。正文采用较贴近原文而仍可理解的表达，并以脚注说明其文化含义，避免把解释直接写进经文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“橄榄山”沿用通行中文地名；将较长的希腊语句分成两句，以提升清晰度，同时保留原文的地点关系和安息日距离习语。
