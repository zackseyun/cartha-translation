  text: καὶ ὅτε εἰσῆλθον, ⸂εἰς τὸ ὑπερῷον ἀνέβησαν⸃ οὗ ἦσαν καταμένοντες, ὅ τε Πέτρος καὶ ⸂Ἰωάννης καὶ Ἰάκωβος⸃ καὶ Ἀνδρέας, Φίλιππος καὶ Θωμᾶς, Βαρθολομαῖος καὶ Μαθθαῖος, Ἰάκωβος Ἁλφαίου καὶ Σίμων ὁ ζηλωτὴς καὶ Ἰούδας Ἰακώβου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/013.yaml
  text: 'And when they had entered[a], they went up to the upstairs room where they were staying: Peter, John, James, and Andrew; Philip and Thomas; Bartholomew and Matthew; James the son of Alphaeus, and Simon the Zealot, and Judas the son of James.'
translation:
  language: zh_hans
  text: 他们进去后，就上楼到他们所住的那间房里；彼得、约翰、雅各和安得烈，腓力和多马，巴多罗买和马太，亚勒腓的儿子雅各、奋锐党的西门，以及雅各的儿子犹大[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“犹大是雅各的兄弟。”希腊文只说“雅各的犹大”，没有明说两人的亲属关系。
    reason: alternative_reading
lexical_decisions:
- source_word: εἰσῆλθον
  choice: 进城后
  rationale: 动词本身只表示“进入”，宾语由上文耶路撒冷补足；中文用“进城后”自然交代先于上楼发生的动作。
- source_word: εἰς τὸ ὑπερῷον ἀνέβησαν
  choice: 就上楼进了……房间
  rationale: 同时保留ἀνέβησαν的向上移动和εἰς所表达的进入目的地，现代汉语表达清楚自然。
- source_word: ὑπερῷον
  choice: 楼上的房间
  rationale: 指建筑上层的房间；避免将其固化为带有后世传统联想的专名“楼房”。在整句中调整为“上楼进了……房间”以免重复。
- source_word: οὗ ἦσαν καταμένοντες
  choice: 他们所住的
  rationale: καταμένω表示持续停留或居住；“所住的”简洁体现当时落脚于此，不额外断定长期定居。
- source_word: Σίμων ὁ ζηλωτὴς
  choice: 奋锐党的西门
  rationale: ζηλωτής在此作为辨识性称号；“奋锐党”是现代中文圣经读者较熟悉且明确的译法。
- source_word: Ἰάκωβος Ἁλφαίου
  choice: 亚勒腓的儿子雅各
  rationale: 属格在使徒名单中自然理解为父子关系，中文明确补出“儿子”以便辨识。
- source_word: Ἰούδας Ἰακώβου
  choice: 雅各的儿子犹大
  rationale: 属格本身未明说关系；使徒名单的命名方式使父子关系较为可能，但脚注保留“兄弟”的可能。
theological_decisions:
- issue: Ἰούδας Ἰακώβου所指的亲属关系
  choice: 雅各的儿子犹大
  alternative: 雅各的兄弟犹大
  rationale: 希腊文仅作“雅各的犹大”，没有明说是儿子还是兄弟。名单中以父名辨识人物较为自然，因此正文采用“儿子”，同时以脚注保存原文的含混性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。人名沿用中文圣经中通行的译名；名单以中文顿号和连接词组织，不机械复制希腊文反复出现的καί。脚注标记置于相关姓名之后。
