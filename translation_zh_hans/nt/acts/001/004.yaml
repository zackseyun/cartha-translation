  text: καὶ συναλιζόμενος παρήγγειλεν αὐτοῖς ἀπὸ Ἱεροσολύμων μὴ χωρίζεσθαι, ἀλλὰ περιμένειν τὴν ἐπαγγελίαν τοῦ πατρὸς ἣν ἠκούσατέ μου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/004.yaml
  text: And while staying with them[a], he ordered them not to depart from Jerusalem, but to wait for the promise of the Father, which you heard from me.
translation:
  language: zh_hans
  text: 耶稣和他们在一起的时候[a]，吩咐他们不要离开耶路撒冷，而要等候父的应许，就是你们从我这里听见的那应许。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“与他们聚集的时候”；有人把这句话理解为“和他们一同吃饭的时候”。
    reason: lexical_alternative
lexical_decisions:
- source_word: συναλιζόμενος
  choice: 和他们在一起的时候
  rationale: 该分词的具体词义有争议，但在语境中明确表示耶稣与使徒同在。正文采用自然且较概括的表达，避免武断限定为聚集或一同吃饭，并在脚注保留其他可能。
- source_word: παρήγγειλεν
  choice: 吩咐
  rationale: 此动词表示带有权威的指令。“吩咐”在现代汉语中自然、庄重，并保留其命令力度。
- source_word: ἀπὸ Ἱεροσολύμων μὴ χωρίζεσθαι
  choice: 不要离开耶路撒冷
  rationale: 结合 χωρίζεσθαι 与 ἀπό，意思是在地点上不要离开耶路撒冷；此译法清楚自然。
- source_word: περιμένειν
  choice: 等候
  rationale: 表达怀着期待等待某事实现，符合本节语境，也具有适合经文的庄重语体。
- source_word: τὴν ἐπαγγελίαν τοῦ πατρὸς
  choice: 父的应许
  rationale: 直接保留属格结构的开放性，既可理解为父所作的应许，也不把应许提前解释成具体的“恩赐”。
- source_word: ἣν ἠκούσατέ μου
  choice: 就是“你们从我这里听见的”
  rationale: μου 在 ἀκούω 后自然表示信息来源。“从我这里听见的”忠实简洁；加引号将后半句自然标示为耶稣所指的既往话语，同时不补出原文未明说的内容。
theological_decisions:
- issue: συναλιζόμενος 对耶稣复活后活动的具体描述
  choice: 正文概括译为“和他们在一起的时候”
  alternative: “与他们聚集的时候”或“和他们一同吃饭的时候”
  rationale: 该词的构形和解释存在词汇困难。正文保留确定的核心意思，即耶稣当时与使徒同在，不借此处额外强化聚集或进食这一较具体的理解；脚注列出真实的词义可能。
- issue: “父的应许”中属格的关系
  choice: 保留为“父的应许”
  alternative: “父所应许的”或“父所应许的恩赐”
  rationale: 原文没有在该短语本身明确补出“恩赐”，因此不在正文中提前解释，以保留其表达张力，由后文语境说明所应许的内容。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“耶稣”在希腊文中由上下文隐含，汉语为避免主语含混而明确补出；“而要”清楚呈现 μὴ…ἀλλά… 的对比。正文脚注标记与脚注完全对应。
