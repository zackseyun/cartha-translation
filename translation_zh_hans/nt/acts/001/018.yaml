base_translation:
  language: en
  yaml_path: translation/nt/acts/001/018.yaml
  text: So this man acquired a field with the wages of unrighteousness[a], and falling headlong he burst open in the middle[c][b], and all his intestines spilled out.
translation:
  language: zh_hans
  text: 这人用不义的报酬得了一块田地[a]；他脸朝下倒下[b]，身体中部裂开，所有内脏都流了出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “得了”也可译作“取得了”。原文并未明确表示这块田是犹大亲自购买的，也可能是指田地借着与他有关的那笔钱归在他名下。
    reason: alternative_reading
  - marker: b
    text: “脸朝下倒下”也可译作“俯伏下来”或“头朝前跌落”。原文可指俯伏、面朝下的姿势；在此处也可能描述头朝前的跌落。
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὗτος μὲν οὖν
  choice: 这人
  rationale: Οὗτος回指犹大；μέν οὖν承接上文。汉语在此不必生硬加入“所以”，分号后的“后来”足以使叙述自然衔接。
- source_word: ἐκτήσατο
  choice: 得了
  rationale: κτάομαι表示取得或获得所有权。“得了”保留宽泛含义，不把取得方式限定为犹大亲自购买。
- source_word: χωρίον
  choice: 一块田地
  rationale: χωρίον可指田地或一片地产；“一块田地”在此清楚自然，也与上下文相称。
- source_word: ἐκ μισθοῦ τῆς ἀδικίας
  choice: 用不义的报酬
  rationale: μισθός可指工价、报酬或酬金，ἀδικία指不义或恶行；此译保留原文的道德意味，同时符合现代汉语表达。
- source_word: πρηνὴς γενόμενος
  choice: 头朝下摔落
  rationale: πρηνής可表示俯伏、面朝下或头朝前的状态；结合事件进程，“头朝下摔落”表达最可能的动态含义，同时以脚注保留词义范围。
- source_word: ἐλάκησεν μέσος
  choice: 腹部裂开
  rationale: λακάω表示迸裂、裂开，μέσος指身体中部。“腹部裂开”比逐字的“中间裂开”更自然，并由随后内脏流出这一叙述支持。
- source_word: ἐξεχύθη πάντα τὰ σπλάγχνα αὐτοῦ
  choice: 五脏全都流了出来
  rationale: ἐκχέω表示倾出、流出；σπλάγχνα指体内脏器。“五脏”是现代汉语可理解的集合说法，比“肠子”更能保留原词较宽的范围。
theological_decisions:
- issue: 犹大与田地取得之间的关系
  choice: 译作“得了一块田地”，不说明他是否亲自购买
  alternative: “买了一块田地”或“用他的钱买了一块田地”
  rationale: ἐκτήσατο表达取得、获得，不必限定为直接购买。这样既忠于本节，也不在译文中替读者调和《马太福音》27:5–8。
- issue: 犹大死亡过程的具体姿势
  choice: 正文译作“头朝下摔落”，脚注说明也可理解为俯伏或面朝下
  alternative: “俯伏下来”或“面朝下倒下”
  rationale: πρηνὴς γενόμενος存在状态与动态表达上的余地；正文采用语境中较自然的理解，但不把其余可能性隐去。
translation_notes:
  register: 采用现代、庄重而直接的叙事语言。保留原文对死亡场景的强烈描写，但避免古奥词语；“不义的报酬”保留原文带有道德判断的名词结构。
