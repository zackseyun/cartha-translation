  to: 因为他原是列在我们中间，并且在这项服事中得了一份[a]。
  rationale: 修订以“原是”中性表达犹大先前被计入使徒群体的状态，删除“本来”可能附加的对比色彩；以“在这项服事中得了一份”直接表达他获得该服事的份额，而不强化所有权。脚注重述κλῆρος的词义范围，保留歧义且使汉语更自然。
