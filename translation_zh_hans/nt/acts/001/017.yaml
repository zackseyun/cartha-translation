  text: ὅτι κατηριθμημένος ἦν ⸀ἐν ἡμῖν καὶ ἔλαχεν τὸν κλῆρον τῆς διακονίας ταύτης.—
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/017.yaml
  text: For he was numbered among us and received a share in this ministry[a].
translation:
  language: zh_hans
  text: 因为他原是列在我们中间，并且在这项服事中得了一份[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“得了这项服事中抽签所得的份额。”希腊语κλῆρος可指“签”，也可指由此引申的“所分得的份额”。
    reason: 保留κλῆρος可指抽签用的“签”及其引申义“所分得的份额”的词义差异，同时避免暗示本句明确叙述了一次抽签。
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 承接上文，说明犹大为何与此事有关；现代汉语用“因为”自然地保留因果、解释意味。
- source_word: κατηριθμημένος ἦν
  choice: 本来列在
  rationale: 该迂说结构表达他曾处于被计入使徒群体的状态。“列在”保留被动与成员身份的意味，“本来”则自然体现其先前既成的处境。
- source_word: ἐν ἡμῖν
  choice: 我们中间
  rationale: 表示被纳入“我们”这一群体，而不只是与他们相处或在他们附近。
- source_word: ἔλαχεν
  choice: 领受了
  rationale: λαγχάνω可指抽签所得或获分配所得；“领受了”在中文中自然，同时避免擅自断定此处明确描述了一次抽签。
- source_word: τὸν κλῆρον
  choice: 属于他的一份
  rationale: κλῆρος既可指“签”，也可引申为所分得的份额。“属于他的一份”清楚表达参与和获分配的份额，并以脚注保留原词的语义张力。
- source_word: τῆς διακονίας ταύτης
  choice: 这项服事中
  rationale: διακονία在此指使徒所承担的服务与职分。“服事”兼顾教会语境和现代中文可懂性，与“一份”搭配自然。
theological_decisions:
- issue: 犹大与使徒群体及其服事的关系
  choice: 经文明确说他曾被列在使徒群体中，并在这项服事中领受一份。
  alternative: 将此理解为他只是与使徒群体有外在联系。
  rationale: κατηριθμημένος ἦν ἐν ἡμῖν与ἔλαχεν τὸν κλῆρον共同表明真实的群体成员身份和服事份额；译文不据此进一步断定其蒙认可、忠信到底或最终结局等教义问题。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“本来列在我们中间”表达先前真实的群体归属；“这项服事中属于他的一份”避免生硬直译，同时由脚注保留“签／份额”的歧义。
