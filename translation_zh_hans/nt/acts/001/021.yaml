  text: δεῖ οὖν τῶν συνελθόντων ἡμῖν ἀνδρῶν ἐν παντὶ χρόνῳ ⸀ᾧ εἰσῆλθεν καὶ ἐξῆλθεν ἐφ’ ἡμᾶς ὁ κύριος Ἰησοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/021.yaml
  text: Therefore[a], it is necessary that one of the men who accompanied us during all the time in which the Lord Jesus went in and out among us[b],
translation:
  language: zh_hans
  text: 因此，有必要从那些在主耶稣在我们中间出入的整个期间一直与我们在一起的男人中——
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεῖ
  choice: 有必要
  rationale: 保留无人称必要性表达，也不在本节提前补入下一节才出现的谓语内容。
- source_word: οὖν
  choice: 所以
  rationale: 自然地标明彼得根据上文得出的结论。
- source_word: τῶν συνελθόντων ἡμῖν ἀνδρῶν
  choice: 从这些人中——他们……都与我们同行
  rationale: 属格结构与下一节相接；“同行”自然表达长期共同相处和参与，同时“这些人”在本语境中指男性候选人。
- source_word: ἐν παντὶ χρόνῳ ᾧ
  choice: 在……的整个期间
  rationale: 指从始至终的整段时期，而非每一个零散时刻。
- source_word: εἰσῆλθεν καὶ ἐξῆλθεν ἐφ’ ἡμᾶς
  choice: 出入于我们中间
  rationale: 保留原文带闪族色彩的形象，指耶稣在门徒群体中的持续生活与活动。
- source_word: ὁ κύριος Ἰησοῦς
  choice: 主耶稣
  rationale: “主”保留 κύριος 在《使徒行传》中作为尊称和基督论称号的分量，中文无需另译希腊冠词。
theological_decisions:
- issue: κύριος 作为基督论称号的译法
  choice: 主耶稣
  alternative: 耶稣老师
  rationale: “主”既符合新约通行用语，也保留此称号的尊荣及神学分量；“老师”会缩窄其含义。
- issue: ἀνδρῶν 的性别所指
  choice: 这些人（脚注说明为男人）
  alternative: 这些男人
  rationale: ἀνήρ 明确指男性；正文采用自然的现代汉语“这些人”，脚注明示原词的男性含义，避免将其误解为不分性别的泛称。
- issue: 本节与下一节之间未完的句法
  choice: 用破折号保留未完结构
  alternative: 提前补译“选出一位”
  rationale: 希腊文的必要性结构到下一节才完成；不把下一节内容提前并入本节，以保留原有分节及句法张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。为忠实呈现本节在希腊文中尚未完成、须接续下一节的句法，以破折号收束本节；“出入于我们中间”保留原文意象，并用脚注解释。
