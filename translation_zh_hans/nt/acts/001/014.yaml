  text: οὗτοι πάντες ἦσαν προσκαρτεροῦντες ὁμοθυμαδὸν τῇ ⸀προσευχῇ σὺν γυναιξὶν καὶ ⸀Μαριὰμ τῇ μητρὶ τοῦ Ἰησοῦ καὶ ⸀σὺν τοῖς ἀδελφοῖς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/014.yaml
  text: All of these were continually devoting themselves with one accord to prayer[a], together with the women, and Mary the mother of Jesus[c][b], and with his brothers.
translation:
  language: zh_hans
  text: 这些人都同心合意[a]地持续祷告，妇女们[b]、耶稣的母亲马利亚和他的弟兄们[c]也都在其中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“齐心一致”或“同心同意”；希腊文不仅表示众人聚在一起，也强调他们有共同的心志和目标。
    reason: lexical_alternative
  - marker: b
    text: 或译“妇女”。希腊文这里没有冠词，但这句话很可能指与门徒一同聚集的一群为人所知的妇女。
    reason: lexical_alternative
  - marker: c
    text: “弟兄们”译自希腊文adelphoi。有些人认为这里也可能泛指近亲或亲族；本节本身没有进一步说明。
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτοι πάντες
  choice: 这些人都
  rationale: 既保留οὗτοι的指示意味，也表达πάντες所强调的全体，符合现代汉语语序。
- source_word: ἦσαν προσκαρτεροῦντες
  choice: 恒切
  rationale: 迂回未完成时结构表达持续进行的状态；“恒切”兼顾持续、专注和坚持不懈之意，并可自然地修饰“祷告”。
- source_word: ὁμοθυμαδόν
  choice: 同心合意
  rationale: 表达共同聚集之外更深一层的共同心志与目标，也呼应此词在《使徒行传》中的重要用法。
- source_word: τῇ προσευχῇ
  choice: 祷告
  rationale: 在προσκαρτερέω之后，间接受格表示持续专注的对象；汉语不必机械体现冠词。
- source_word: σὺν γυναιξίν
  choice: 和他们在一起的还有妇女们
  rationale: 明确表达σύν所指的共同参与；“妇女们”自然地指向与门徒群体有关的一群妇女，同时以脚注保留原文无冠词的特点。
- source_word: Μαριὰμ τῇ μητρὶ τοῦ Ἰησοῦ
  choice: 耶稣的母亲马利亚
  rationale: 以自然的汉语同位结构清楚说明马利亚的身份。
- source_word: σὺν τοῖς ἀδελφοῖς αὐτοῦ
  choice: 以及耶稣的弟兄们
  rationale: ἀδελφοί为阳性复数，此处直译为“弟兄们”；重复“耶稣”可避免汉语代词指向不清，同时不判定他们与耶稣的具体亲属关系。
theological_decisions:
- issue: 耶稣的ἀδελφοί所指的具体亲属关系
  choice: 译作“耶稣的弟兄们”，不进一步界定关系
  alternative: 耶稣的近亲、亲属或兄弟姐妹
  rationale: ἀδελφοί通常指弟兄，但不同传统对这里的具体亲属关系理解不一。正文按原词通常含义翻译，脚注说明较宽泛的可能性，不把任何宗派立场写进正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“恒切祷告”简洁表达持续不懈的行动；分号使共同祷告的核心陈述与参与者名单层次清楚。脚注标记均紧随其所说明的词语。
