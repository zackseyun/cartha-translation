  text: καὶ ὡς ἀτενίζοντες ἦσαν εἰς τὸν οὐρανὸν πορευομένου αὐτοῦ, καὶ ἰδοὺ ἄνδρες δύο παρειστήκεισαν αὐτοῖς ἐν ⸂ἐσθήσεσι λευκαῖς⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/010.yaml
  text: And as they were gazing intently into heaven while he was going[a], behold, two men stood by them in white clothing[b],
translation:
  language: zh_hans
  text: 当他离去时，他们正目不转睛地望着天[a]；看哪，有两名身穿白衣[b]的男子站在他们身旁。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“天空”或“天上”。希腊词既可指天空，也可指天上；在此升天的语境中，译作“天”保留这种开放性。
    reason: lexical_alternative
  - marker: b
    text: 或译“白色衣裳”或“白色长衣”。原文泛指衣服，并未明确衣服的具体样式。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀτενίζοντες
  choice: 目不转睛地望着
  rationale: 该分词表示持续、专注地注视，不只是一般的观看；这一表达自然地保留了动作的持续性和专注程度。
- source_word: οὐρανόν
  choice: 天
  rationale: οὐρανός既可指天空，也可指天上；“天”在现代汉语中保留了这种语义开放性，并适合升天的叙事语境。
- source_word: πορευομένου αὐτοῦ
  choice: 他渐渐离去的时候
  rationale: 属格独立结构表达与注视同时发生的动作；“离去”保留移动之意，“渐渐”体现未完成过程，但不加入目的地。
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 这是引导读者注意下文的叙事标记；“看哪”保留其醒目而庄重的语气。
- source_word: ἄνδρες δύο
  choice: 两个人
  rationale: 原文明确使用表示成年男性的ἀνήρ；汉语“人”与后置数量结构结合自然，而本句不把他们直接译作天使，以免超出本节明说的内容。
- source_word: παρειστήκεισαν
  choice: 站在他们旁边
  rationale: 该动词在此表示已经在近旁站立；不译作“出现”，避免加入原文未明说的显现方式。
- source_word: ἐσθήσεσι λευκαῖς
  choice: 身穿白衣
  rationale: ἐσθής泛指衣服或衣裳；“白衣”简洁自然，不擅自具体化为长袍。
theological_decisions:
- issue: 升天语境中οὐρανός的译法
  choice: 天
  alternative: 天空；天上
  rationale: “天”既能承载升天语境中的神学指向，也保留“天空”的可感含义，不把原词的语义张力过早限定为单一空间概念。
- issue: 两人的身份
  choice: 两个人
  alternative: 两个天使；两个男人
  rationale: 本节原文称他们为ἄνδρες，而没有直接称为天使。正文保留表层措辞，让其身份由上下文呈现；“两个人”在汉语叙事中比“两个男人”更庄重自然。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“正当……的时候”呈现同时发生的动作，“看哪”保留原文突出的叙事提示。所有脚注标记均置于相应正文词语之后。
