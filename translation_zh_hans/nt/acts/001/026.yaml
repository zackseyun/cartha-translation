source:
  edition: SBLGNT
  text: καὶ ἔδωκαν κλήρους ⸀αὐτοῖς, καὶ ἔπεσεν ὁ κλῆρος ἐπὶ Μαθθίαν, καὶ συγκατεψηφίσθη μετὰ τῶν ἕνδεκα ἀποστόλων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/026.yaml
  text: And they cast lots for them[a], and the lot fell to Matthias[b], and he was counted with the eleven apostles.
translation:
  language: zh_hans
  text: 他们就为二人抽签[a]，签落在马提亚身上，他便与十一位使徒同列[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“给他们签”；意思是为这两人抽签。
    reason: lexical_alternative
  - marker: b
    text: 或译“被列入十一位使徒之中”，也可译“被加入十一位使徒之中”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκαν κλήρους αὐτοῖς
  choice: 为二人抽签
  rationale: 原文直译近似“给他们签”，在此语境中指为前文两位候选人以签作出选择。“为二人抽签”符合现代汉语习惯，也保留了以签选人的具体方式。
- source_word: κλήρους / ὁ κλῆρος
  choice: 签
  rationale: 这里的 κλῆρος 指用于选定人选的签，不是产业或份额；译作“签”可自然衔接“抽签”和“签落在……身上”。
- source_word: ἔπεσεν ὁ κλῆρος ἐπὶ Μαθθίαν
  choice: 签落在马提亚身上
  rationale: 贴近希腊文“签落在……之上”的意象，同时是清楚自然的现代汉语表达。
- source_word: Μαθθίαν
  choice: 马提亚
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: συγκατεψηφίσθη
  choice: 同列
  rationale: 该动词表示被一同计算、列入某群体。“同列”简洁庄重，保留被算入使徒群体的含义，又不额外强化任命仪式或神学机制。
- source_word: μετὰ τῶν ἕνδεκα ἀποστόλων
  choice: 与十一位使徒
  rationale: μετά 加属格表示“与……一起”；“与十一位使徒同列”准确表达马提亚被算在原有十一人之中。
theological_decisions:
- issue: 是否把 συγκατεψηφίσθη 译成带有更强神圣任命或制度性授职意味的措辞
  choice: 他便与十一位使徒同列
  alternative: 他便被加入十一位使徒之中；他便被列入十一位使徒之中
  rationale: 经文叙述抽签结果及马提亚被算入使徒群体，并未在此动词中明确说明任命的神学机制。“同列”保留这一叙事限度和潜在张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“抽签—签落在”保留原文的重复和具体意象；“同列”避免冗长，也不超出原文作神学推断。
