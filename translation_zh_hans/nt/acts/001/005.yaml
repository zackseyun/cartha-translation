  text: ὅτι Ἰωάννης μὲν ἐβάπτισεν ὕδατι, ὑμεῖς δὲ ⸂ἐν πνεύματι βαπτισθήσεσθε⸃ ἁγίῳ οὐ μετὰ πολλὰς ταύτας ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/005.yaml
  text: For John baptized with water[a], but you will be baptized in the Holy Spirit not many days from now.
translation:
  language: zh_hans
  text: 因为约翰用水施洗，但再过不多几天，你们要在圣灵里受洗[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“用圣灵受洗”。希腊语介词可理解为“在……里”，也可理解为“用”。
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 本词承接上一节，说明耶稣吩咐门徒等候的理由；译作“因为”既自然，也保留其解释、因果功能。
- source_word: ἐβάπτισεν
  choice: 施洗
  rationale: 采用现代汉语中通行的宗教用语，并不把施洗的具体方式限定为“浸入”，从而避免加入原文未明确规定的宗派性理解。
- source_word: ὕδατι
  choice: 用水
  rationale: 无介词与格在这里自然表达媒介或工具；“用水施洗”符合汉语习惯，也与下文的圣灵形成对照。
- source_word: ἐν πνεύματι ἁγίῳ
  choice: 在圣灵里
  rationale: 直观保留介词ἐν所可能表达的领域含义，同时不排除媒介含义；“圣灵”在本语境中指特定的神圣之灵，无须另加冠词对应语。
- source_word: βαπτισθήσεσθε
  choice: 你们就要……受洗
  rationale: 保留第二人称复数、将来时和被动语态，也维持与约翰“施洗”的词汇联系；“就要”配合临近的时间表达。
- source_word: οὐ μετὰ πολλὰς ταύτας ἡμέρας
  choice: 从现在起不多几天
  rationale: 用自然的现代汉语表达“这些日子之后不久”的临近时间意义，并明确ταύτας在语境中的指示作用。
theological_decisions:
- issue: 如何翻译神学含义敏感的ἐν πνεύματι ἁγίῳ
  choice: 在圣灵里受洗
  alternative: 受圣灵的洗／用圣灵施洗
  rationale: ἐν既可能表示所处的领域，也可能表示媒介或工具。正文采用较贴近介词表面的“在圣灵里”，脚注说明另一种自然理解，以免替读者消除原文保留的神学张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“施洗／受洗”沿用普通读者熟悉的圣经用语；句式保留原文“约翰……但你们……”的对照，并以“从现在起不多几天”清楚表达时间临近。
