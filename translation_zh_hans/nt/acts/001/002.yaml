  text: ἄχρι ἧς ἡμέρας ἐντειλάμενος τοῖς ἀποστόλοις διὰ πνεύματος ἁγίου οὓς ἐξελέξατο ἀνελήμφθη·
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/002.yaml
  text: until the day when[a], after giving commands through the Holy Spirit to the apostles whom he had chosen, he was taken up.
translation:
  language: zh_hans
  text: 直到他借着圣灵[a]向他所拣选的使徒发出吩咐后被接上去的那一天。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “借着圣灵”也可译作“由圣灵”；希腊语在这里可表达媒介或施事。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄχρι ἧς ἡμέρας
  choice: 直到……的那一天
  rationale: 保留原文所标明的时间终点，同时采用自然的现代汉语句式。
- source_word: ἐντειλάμενος
  choice: 吩咐了……随后
  rationale: ἐντέλλομαι 表示下令、嘱咐；用“吩咐”既保留其权威性，也适合耶稣对使徒说话的语境。“随后”体现分词所表达的动作先于主句。
- source_word: τοῖς ἀποστόλοις
  choice: 使徒
  rationale: “使徒”是《路加福音—使徒行传》中 ἀπόστολος 的通行且准确译法，指耶稣所选立的特定群体。
- source_word: διὰ πνεύματος ἁγίου
  choice: 借着圣灵
  rationale: διά 加属格可表达媒介或施事；“借着”贴近原文，又不额外限定圣灵发挥作用的具体方式。
- source_word: οὓς ἐξελέξατο
  choice: 自己所拣选的
  rationale: “所拣选的”清楚修饰使徒；“自己”自然地略为体现中间语态，但不将其过度解释为特殊神学含义。
- source_word: ἀνελήμφθη
  choice: 被接上去
  rationale: 保留被动语态和向上的方向，不补入本节没有明说的“天上”。
theological_decisions:
- issue: 耶稣的吩咐与圣灵之间的关系
  choice: 耶稣借着圣灵吩咐使徒
  alternative: 耶稣由圣灵吩咐使徒
  rationale: 句法上 διὰ πνεύματος ἁγίου 最自然地修饰 ἐντειλάμενος，表示吩咐所借的媒介或施事。“借着”保留这两种相关细微含义，不进一步作教义性界定。
- issue: ἀνελήμφθη 所指的目的地
  choice: 被接上去
  alternative: 被接到天上去
  rationale: 本节只明确表达“被接上去”，并未写出目的地；译文不借用徒1:11补足“天上”。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“直到……的那一天”承接上一节，作为跨节句的一部分；保留“被接上去”的被动表达及原文未明说目的地的含蓄。
