  naturalness: 原句“直到他借着圣灵吩咐了自己所拣选的使徒，随后被接上去的那一天”可理解，但“吩咐了……使徒”的搭配和“随后”的位置不够顺畅。改为“向……发出吩咐后被接上去”能清楚表达分词动作先于主句，同时保持跨节句的书面语体。
  terminology: “圣灵”“使徒”“被接上去”均合乎现代中文圣经语体，并忠实对应原文。保留“借着圣灵”，不把媒介／施事的细微语义作教义化限定。
