  to: 直到他借着圣灵[a]向他所拣选的使徒发出吩咐后被接上去的那一天。
  rationale: 修订仅改善现代汉语句法，并使脚注锚点对应其所说明的短语。“发出吩咐后”明确保留原文分词所表示的先行行动；“被接上去”继续保留被动语态，且不补入本节未明说的目的地。
