  text: καὶ ἔστησαν δύο, Ἰωσὴφ τὸν καλούμενον Βαρσαββᾶν, ὃς ἐπεκλήθη Ἰοῦστος, καὶ Μαθθίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/023.yaml
  text: 'And they put forward two: Joseph called Barsabbas[a], who was also called Justus, and Matthias.'
translation:
  language: zh_hans
  text: 于是，他们提出[a]了两个人：一个是约瑟，称为巴撒巴，又叫犹士都；另一个是马提亚。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “提出”也可译作“推举”或“使两人站在面前”。这里大概是指把他们作为候选人提出来。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστησαν
  choice: 推举
  rationale: 此处是把人选置于众人面前，作为候选人提出；“推举”自然体现遴选语境，又不表示他们此时已经正式任命二人。
- source_word: δύο
  choice: 两个人
  rationale: 直译数词，并按汉语习惯补出量词和所指的人。
- source_word: καλούμενον
  choice: 称为
  rationale: 用于引出约瑟的另一个称呼，语体庄重自然。
- source_word: Βαρσαββᾶν
  choice: 巴撒巴
  rationale: 按通行中文圣经人名译法音译。
- source_word: ἐπεκλήθη
  choice: 又叫
  rationale: 引出第二个附加名字；“又”自然表达此人与前述称呼之间的并列关系。
- source_word: Ἰοῦστος
  choice: 犹士都
  rationale: 按通行中文圣经人名译法音译。
- source_word: Μαθθίαν
  choice: 马提亚
  rationale: 按通行中文圣经人名译法音译。
- source_word: καὶ ... καὶ
  choice: 于是……另一个是
  rationale: 首个 καί 承接叙事，译作“于是”；后一个 καί 连接两位候选人，按现代汉语名单结构译作“另一个是”。
theological_decisions:
- issue: ἔστησαν 是否表示已经任命
  choice: 译为“推举”，理解为提出候选人
  alternative: “任命了”或“选立了”
  rationale: 上下文显示最终人选尚待抽签决定，因此不宜把本节表述成已经完成正式任命；同时保留该动词“使站在面前、提出”的程序性含义。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“一个是……另一个是……”帮助普通读者辨明两位候选人；脚注保留 ἔστησαν 的词义范围，避免把候选程序误解为已经正式任命。
