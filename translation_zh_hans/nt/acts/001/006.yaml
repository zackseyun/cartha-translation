  text: Οἱ μὲν οὖν συνελθόντες ⸀ἠρώτων αὐτὸν λέγοντες· Κύριε, εἰ ἐν τῷ χρόνῳ τούτῳ ἀποκαθιστάνεις τὴν βασιλείαν τῷ Ἰσραήλ;
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/006.yaml
  text: So when they had come together[a], they asked him, saying, “Lord, is it at this time that you are restoring the kingdom to Israel?”
translation:
  language: zh_hans
  text: 于是，那些聚集在一起的人问他：“主啊，你是在这时候把国度恢复给以色列吗？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为以色列恢复国度”。希腊语的与格既可表示受益者（“为以色列”），也可较直接地表示恢复的归属对象（“给以色列”）。
    reason: 保留 τῷ Ἰσραήλ 的语法与词义歧义。
lexical_decisions:
- source_word: Οἱ μὲν οὖν συνελθόντες
  choice: 于是，他们聚在一起后
  rationale: 将 συνελθόντες 按时间关系处理；“于是”自然承接上文，表达 μὲν οὖν 的叙事推进作用，而不逐字硬译各虚词。
- source_word: ἠρώτων αὐτὸν λέγοντες
  choice: 就问他说
  rationale: 用自然的汉语叙事表达未完成时 ἠρώτων 和引出问话的分词 λέγοντες；原文在此未必强调反复或持续询问，因此不刻意译成“不断问”。
- source_word: Κύριε
  choice: 主啊
  rationale: 保留 κύριος 作为对耶稣的尊称及其神学分量；呼格语境用“啊”符合现代汉语直接称呼的表达。
- source_word: ἐν τῷ χρόνῳ τούτῳ
  choice: 在这时候
  rationale: χρόνος 指当前的时期或时机，不限于瞬间；“在这时候”自然且不增加解释。
- source_word: ἀποκαθιστάνεις
  choice: 恢复
  rationale: 该词表示使某事回到先前状态；“恢复”直接保留这一含义。“你是……吗”的问句结构体现原文现在时所问的当前行动或计划。
- source_word: τὴν βασιλείαν
  choice: 国度
  rationale: βασιλεία 可指王权、统治或国度；本句与“以色列”及“恢复”连用，译作“国度”既保留门徒所期待的具体性，也不擅自限定为纯政治或纯属灵意义。
- source_word: τῷ Ἰσραήλ
  choice: 给以色列
  rationale: 用“把国度恢复给以色列”直接表达与格可能指向的归还对象，同时以脚注保留受益意义“为以色列”的可能性。
theological_decisions:
- issue: 门徒对于以色列国度之恢复的期待具有什么性质
  choice: 直译为“把国度恢复给以色列”，不说明这是政治性的还是属灵性的恢复
  alternative: 为以色列恢复国度；恢复以色列的国
  rationale: 本节记录门徒的问题，并未在问题本身中判定或纠正他们期待的每一层含义；译文应保留这种历史与神学张力。
- issue: τῷ Ἰσραήλ 的与格关系
  choice: 正文译作“给以色列”
  alternative: 为以色列
  rationale: 希腊语与格既可较直接地理解为国度恢复“给以色列”，也可理解为以色列的利益而恢复；正文与脚注共同保留此歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“于是……就……”使句子衔接自然；问句保持直接，不加入对国度性质、时间安排或门徒动机的解释。脚注标记置于相关问句末尾。
