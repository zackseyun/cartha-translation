revisions:
- from: 从约翰施洗[a]开始，直到他离开我们、被接上去的那一天，这些人中必须有一位与我们一同成为他复活的见证人[b]。
  to: 从约翰施洗[a]起，直到他从我们这里被接上去的那一天，这些人中必须有一位成为与我们一同见证他复活的人[b]。
  rationale: 修订将“从我们这里”纳入“被接上去”这一单一事件，避免额外并列谓语；并把“与我们一同”的共同见证关系明确呈现。正文以自然的动词结构表达“见证他的复活”，脚注保留更贴近原文名词性结构的译法。
