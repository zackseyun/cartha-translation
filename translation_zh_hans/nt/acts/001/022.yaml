  - severity: medium
    issue: “与我们一同成为他复活的见证人”中“与我们一同”修饰范围略不清晰。
    rationale: σὺν ἡμῖν说明新选立者与现有群体共同承担见证；改作“成为与我们一同见证他复活的人”可更自然明确地传达该关系。
  - severity: low
