  text: ἀρξάμενος ἀπὸ τοῦ βαπτίσματος Ἰωάννου ἕως τῆς ἡμέρας ἧς ἀνελήμφθη ἀφ’ ἡμῶν, μάρτυρα τῆς ἀναστάσεως αὐτοῦ ⸂σὺν ἡμῖν γενέσθαι⸃ ἕνα τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/022.yaml
  text: beginning from the baptism of John until the day when he was taken up from us[b][a], one of these must become a witness with us of his resurrection.
translation:
  language: zh_hans
  text: 从约翰施洗[a]起，直到他从我们这里被接上去的那一天，这些人中必须有一位成为与我们一同见证他复活的人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“从约翰所施行的洗礼起”。
    reason: lexical_alternative
  - marker: b
    text: 直译“成为与我们一同作他复活的见证人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρξάμενος ἀπὸ
  choice: 从……开始
  rationale: 以现代汉语自然表达分词所引出的时间起点，并与后面的“直到”构成完整时段。
- source_word: τοῦ βαπτίσματος Ἰωάννου
  choice: 约翰施洗
  rationale: 在本语境中指约翰所施行的洗礼；“约翰施洗”简洁自然，同时用脚注保留较形式对应的译法。
- source_word: ἕως τῆς ἡμέρας ἧς
  choice: 直到……的那一天
  rationale: 准确而自然地表达时间终点及关系从句。
- source_word: ἀνελήμφθη ἀφ’ ἡμῶν
  choice: 他离开我们、被接上去
  rationale: “被接上去”保留被动形式及向上的意象，不扩写为“升到天上”；“离开我们”自然表达ἀφ’ ἡμῶν。
- source_word: μάρτυρα τῆς ἀναστάσεως αὐτοῦ
  choice: 他复活的见证人
  rationale: 保留见证人与“他的复活”之间的属格关系，同时符合现代汉语习惯。
- source_word: σὺν ἡμῖν γενέσθαι
  choice: 与我们一同成为
  rationale: 表达获选者加入现有使徒群体，共同承担见证职责。
- source_word: ἕνα τούτων
  choice: 这些人中……有一位
  rationale: “一位”清楚指人且语体庄重；“这些人”承接上一节所列候选者。
- source_word: γενέσθαι（受上一节 δεῖ 支配）
  choice: 必须……成为
  rationale: 本节句法承接上一节的“必须”；补出“必须”才能在独立引述时完整传达原句的必要性。
theological_decisions:
- issue: 是否补出上一节支配本节不定式的 δεῖ
  choice: 译出“必须”
  alternative: 只译“成为”，使本节作为独立经节时句意不完整
  rationale: 这是恢复跨节延续的句法力量，并非加入新的神学判断。
- issue: 如何表达耶稣被接升的事件
  choice: “被接上去”
  alternative: “升到天上”或“被带走”
  rationale: 所选译法保留原文被动语态和向上意味，却不补入本节没有明说的目的地；也避免“被带走”丢失上升意象。
- issue: 见证与复活的关系
  choice: “他复活的见证人”
  alternative: “为他的复活作见证的人”
  rationale: 正文较贴近原文属格结构；脚注列出自然的功能性表达，不把两者的细微语法差异绝对化。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“被接上去”保留《路加福音—使徒行传》叙事中的被动与上升意象；标点将“离开我们”与“被接上去”紧密连接，避免误读为两个彼此无关的事件。
