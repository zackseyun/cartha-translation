review_pass:
  verdict: revise
  source_fidelity: 原译准确保留了由上一节δεῖ延续而来的“必须”、约翰施洗至耶稣被接上去的时间范围，以及候选人加入现有见证群体的意思。不过“离开我们、被接上去”把原文单一的被动事件拆成两个并列谓语；“与我们一同成为他复活的见证人”也较容易被理解为共同‘成为’某种人，而非成为加入我们、共同作见证的一人。
  naturalness: “从约翰施洗起”比“从约翰施洗开始”更凝练、符合现代庄重书面语。“成为与我们一同见证他复活的人”清楚表达共同见证的关系，也避免“他复活的见证人”在现代汉语中属格关系略显含混的问题。
  terminology: 保留“施洗”“被接上去”“复活”“见证”等恰当且前后一致的经文用语。“被接上去”保留ἀνελήμφθη的被动和上升意象，不增添本节未明说的目的地。
  issues:
