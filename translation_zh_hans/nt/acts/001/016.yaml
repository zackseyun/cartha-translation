  text: Ἄνδρες ἀδελφοί, ἔδει πληρωθῆναι τὴν ⸀γραφὴν ἣν προεῖπε τὸ πνεῦμα τὸ ἅγιον διὰ στόματος Δαυὶδ περὶ Ἰούδα τοῦ γενομένου ὁδηγοῦ τοῖς συλλαβοῦσιν ⸀Ἰησοῦν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/016.yaml
  text: Men[a], brothers, it was necessary for the Scripture to be fulfilled, which the Holy Spirit spoke beforehand through the mouth of David concerning Judas, who became a guide to those who arrested Jesus[c][b],
translation:
  language: zh_hans
  text: 各位弟兄，圣灵借着大卫的口[a]早先论到犹大的经上的话，必须应验；犹大后来成了那些捉拿耶稣之人的向导。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “借着大卫的口”意为圣灵借着大卫说话。
    reason: cultural_note
lexical_decisions:
- source_word: Ἄνδρες ἀδελφοί
  choice: 各位弟兄
  rationale: 这是对在场男性群体的正式称呼。“各位弟兄”在现代汉语中自然、庄重，也保留了原文阳性复数称呼的语境；若逐词译作“男人们，弟兄们”则不符合汉语称呼习惯。
- source_word: ἔδει
  choice: 必须
  rationale: 表达非人称的必要性，不进一步说明这种必要性的机制或来源，从而保留原文的神学张力。
- source_word: πληρωθῆναι
  choice: 应验
  rationale: 这是汉语圣经语境中表达经文达到其所指成就的自然用语，也保留了路加—使徒行传中的经文应验含义。
- source_word: τὴν γραφὴν
  choice: 那段经文
  rationale: 此处单数指下文将引用的特定圣经话语。“那段经文”比单说“圣经”更清楚，也不把 γραφή 降格为普通文字。
- source_word: προεῖπε
  choice: 早先……所说
  rationale: 贴近“事先说过”的基本含义，避免直接译成“预言”而使其成为过度技术化的先知术语。
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: 圣灵
  rationale: 现代标准汉语中对原文这一称谓的通行且准确表达。
- source_word: διὰ στόματος Δαυὶδ
  choice: 借着大卫的口
  rationale: 保留原文生动的身体意象和工具性表达，清楚呈现圣灵是说话者、大卫是其话语媒介。
- source_word: περὶ Ἰούδα
  choice: 论到犹大
  rationale: 准确表达 περί 加属格所引出的谈论对象，并与本节庄重语体相称。
- source_word: τοῦ γενομένου ὁδηγοῦ
  choice: 犹大成了……向导
  rationale: 保留 γίνομαι 的“成为”含义，并不因汉语表达而擅自加入“那个”或“唯一的”等确定性。
- source_word: τοῖς συλλαβοῦσιν Ἰησοῦν
  choice: 那些捉拿耶稣之人
  rationale: 在逮捕语境中，“捉拿”自然表达 συλλαμβάνω 的抓捕、拘拿含义，同时保留分词所指的一群人。
theological_decisions:
- issue: 经文应验的必要性
  choice: 译作“必须应验”，不说明这种必要性如何形成
  alternative: 译成“因上帝预定而必然发生”或仅译作“理当应验”
  rationale: 原文明确表达必要性，却未在本节解释神圣预定、预知与人类责任之间的机制；译文不替原文消除这层张力。
- issue: 默示话语中的神圣与人类施事者
  choice: 保留“圣灵……借着大卫的口……所说”
  alternative: 译作“大卫受圣灵感动写下”
  rationale: 原文以圣灵为说话者，以大卫的口为媒介。所选表达同时保留两重施事关系，也不把“说”改释成原文此处未明说的“写”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事讲话语体。“各位弟兄”符合汉语公开发言的称呼习惯；分号用来清楚呈现经文必须应验与犹大成为向导之间紧密相连但层次有别的内容。
