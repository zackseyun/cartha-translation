  naturalness: “圣灵早先借着大卫的口，论到犹大所说的那段经文”在现代汉语中容易短暂误读为大卫“论到犹大所说”。将工具性短语紧接“圣灵”，并将“早先”置于“论到”前，可清楚体现圣灵是说话者、大卫是媒介。“经上的话”比“那段经文”更自然，也保留γραφὴ在此作为圣经话语的性质。
