  naturalness: “他们还说”在这里不如“他们又说”自然；“这位……耶稣，你们看见他怎样……，他也要……”虽可理解，但汉语中显得悬置且略拗口。修订后保持现代、庄重且易懂的表达。
  terminology: “加利利人哪”“这位耶稣”“被接到天上去”“照着……的样子来”均适切。“天上”在本段升天语境中可接受。脚注正确说明“同一位”是传统性、解释性的扩充，而非原文显明词语。
