revisions:
- from: 他们还说：“加利利人哪，你们为什么站着望天呢？这位从你们那里被接到天上去的耶稣[a]，你们看见他怎样往天上去，他也要照样来。”
  to: 他们又说：“加利利人哪，你们为什么站着望天呢？这位从你们那里被接到天上去的耶稣[a]，会照着你们看见他往天上去的样子来。”
  rationale: 修订“还说”为“又说”，并重组末句为“会照着你们看见他往天上去的样子来”。这既保留将来时、被动的“被接”、两个“天上”的方向性，以及来临与离去在方式上的对应，也使现代汉语句法更清楚自然。未将“来”扩展为“再来”，以避免增加原文字面未明说的成分。
