  text: οἳ καὶ εἶπαν· Ἄνδρες Γαλιλαῖοι, τί ἑστήκατε ⸀βλέποντες εἰς τὸν οὐρανόν; οὗτος ὁ Ἰησοῦς ὁ ἀναλημφθεὶς ἀφ’ ὑμῶν εἰς τὸν οὐρανὸν οὕτως ἐλεύσεται ὃν τρόπον ἐθεάσασθε αὐτὸν πορευόμενον εἰς τὸν οὐρανόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/011.yaml
  text: They also said[a], “Men of Galilee, why do you stand looking into heaven? This Jesus, who was taken up from you into heaven, will come in the same way that you saw him going into heaven.”
translation:
  language: zh_hans
  text: 他们又说：“加利利人哪，你们为什么站着望天呢？这位从你们那里被接到天上去的耶稣[a]，会照着你们看见他往天上去的样子来。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或按传统译作“这同一位耶稣”。希腊原文明确说“这位耶稣”；“同一位”是为强调身份相同而作的解释性补充。
    reason: 词义替代译法
lexical_decisions:
- source_word: Ἄνδρες Γαλιλαῖοι
  choice: 加利利人哪
  rationale: 这是直接称呼。现代汉语用“加利利人哪”自然、庄重；上下文中的受话者是男性门徒，但汉语“人”无需另加生硬的性别标记。
- source_word: τί ἑστήκατε βλέποντες
  choice: 为什么站着望
  rationale: ἑστήκατε 表示持续站立的当前状态，βλέποντες 表示同时进行的观看；“站着望”简洁保留两层动作。
- source_word: εἰς τὸν οὐρανόν
  choice: 天上
  rationale: οὐρανός 可指天空或天；升天与再来的语境支持“天上”，既符合叙事方向，也保留神学含义。
- source_word: οὗτος ὁ Ἰησοῦς
  choice: 这位……耶稣
  rationale: 直接表达指示词 οὗτος，不在正文中加入原文没有明说的“同一位”；“位”使现代汉语称谓自然且尊重。
- source_word: ὁ ἀναλημφθεὶς ἀφ’ ὑμῶν
  choice: 从你们那里被接到天上去的
  rationale: 被动形式保留耶稣是被接上去的含义；“从你们那里”表达与门徒所在之处的分离。
- source_word: οὕτως ἐλεύσεται ὃν τρόπον
  choice: 你们看见他怎样……，他也要照样来
  rationale: “怎样……照样”自然呈现原文关于方式的对应关系，并明确表达未来的来临。
- source_word: ἐθεάσασθε
  choice: 你们看见
  rationale: θεάομαι 在此指亲眼观看；“看见”清楚自然，不用较古雅的“观看”或“目睹”。
- source_word: πορευόμενον
  choice: 往……去
  rationale: 表达耶稣正在离去、上行的动作，不额外加入原文未明说的细节。
theological_decisions:
- issue: 升天与再来语境中 οὐρανός 的含义
  choice: 天上
  alternative: 天空
  rationale: 该词虽可指可见的天空，但本段叙述耶稣被接上去并应许再来，“天上”更能兼顾空间方向与上下文的神学含义。
- issue: οὗτος ὁ Ἰησοῦς 是否加入“同一位”
  choice: 这位耶稣
  alternative: 这同一位耶稣
  rationale: 原文明确含有“这位”，却没有独立表示“同一”的词。正文采用较直接的译法，并在脚注保留传统上强调身份连续性的表达。
- issue: 再来与升天之间的对应关系
  choice: 怎样往天上去……也要照样来
  alternative: 将会回来
  rationale: 原文强调来临的方式与门徒所见离去方式相对应；“照样来”保留这种关联，不进一步界定其所有神学细节。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事语言。“望天”比“凝望天空”更贴近原词的一般力度；“哪”保留直接呼告的语气。句序按现代汉语调整，但保留升天与再来在方式上的明确对应。
