  text: Τὸν μὲν πρῶτον λόγον ἐποιησάμην περὶ πάντων, ὦ Θεόφιλε, ὧν ἤρξατο ⸀ὁ Ἰησοῦς ποιεῖν τε καὶ διδάσκειν
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/001.yaml
  text: In the first account[a], O Theophilus, I wrote about all that Jesus began both to do and to teach,
translation:
  language: zh_hans
  text: 提阿非罗啊，我在前一卷[a]中记述了耶稣开始所做和所教的一切，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“第一篇记述”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὸν μὲν πρῶτον λόγον
  choice: 前一卷
  rationale: λόγος在此指一部成文的叙述作品，而不是单个“话语”；πρῶτον与上下文构成前后两卷的顺序关系。“前一卷”自然地指向《路加福音》，并保留其与本卷相对的篇章框架。脚注列出“第一篇记述”，以保存“第一”这一可能表达。
- source_word: ἐποιησάμην
  choice: 记述了
  rationale: ποιέω与λόγος搭配，在这里表示写成或编成一篇叙述。“记述了”既符合中文书面表达，也体现其内容是对事件的叙写。
- source_word: περὶ πάντων ... ὧν
  choice: ……的一切
  rationale: περί加属格表示所论及的内容，πάντων与关系代词ὧν相连。中文用“……的一切”自然整合这一结构，同时不把叙事范围夸大为绝对穷尽。
- source_word: ὦ Θεόφιλε
  choice: 提阿非罗啊
  rationale: ὦ明确标示呼语；“啊”保留直接称呼的语气，又不增添原文没有的“亲爱的”等情感修饰。人名采用现代中文圣经中通行的音译。
- source_word: ἤρξατο
  choice: 开始
  rationale: 原文明确使用“开始”，应予保留；它可能暗示耶稣的工作在《使徒行传》中延续，但译文不将这一含义明说。
- source_word: ποιεῖν τε καὶ διδάσκειν
  choice: 所做和所教
  rationale: τε καί连接“做”与“教”两个并列方面。中文无需机械加入“既……又……”，用“所做和所教”简洁保留耶稣的行动与教导之并列。
- source_word: ὁ Ἰησοῦς
  choice: 耶稣
  rationale: 采用现代中文基督教文献中通行的人名译法。
theological_decisions:
- issue: ἤρξατο（“开始”）是否暗示耶稣的工作在《使徒行传》中继续
  choice: 正文保留“开始”，不进一步解释其延续方式。
  alternative: 省略“开始”，译作“耶稣所做和所教的一切”；或明说“耶稣开始做、后来借使徒继续做的一切”。
  rationale: “开始”是希腊文的明确措辞，既不可省略，也不宜扩写。这样可保留耶稣 earthly ministry 与使徒见证之间可能存在的连续性及其神学张力，而不替文本作出解释。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“前一卷”适合两卷作品的开篇衔接；句末保留逗号，因为本节在原叙事中继续进入下一节。
