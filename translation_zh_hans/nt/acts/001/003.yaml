  text: οἷς καὶ παρέστησεν ἑαυτὸν ζῶντα μετὰ τὸ παθεῖν αὐτὸν ἐν πολλοῖς τεκμηρίοις, δι’ ἡμερῶν τεσσεράκοντα ὀπτανόμενος αὐτοῖς καὶ λέγων τὰ περὶ τῆς βασιλείας τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/003.yaml
  text: To them he also presented himself alive after he had suffered[a], by many proofs[b], appearing to them over forty days and speaking about the kingdom of God.
translation:
  language: zh_hans
  text: 他受苦以后，也用许多证据[a]向他们显明自己活着；在四十天内[b]，他向他们显现，并讲论上帝国度的事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“许多确凿的凭据”。这里的希腊词指足以确立事实的证据。
    reason: lexical_alternative
  - marker: b
    text: 或译“四十天之久”。原文表示这些显现发生在这段时期内。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἷς
  choice: 向他们
  rationale: 关系代词复数与格回指上一节的使徒；原文此处没有明说“男人”，所以译作“他们”，既承接上下文，也不增添词义。
- source_word: παρέστησεν ἑαυτὸν ζῶντα
  choice: 向他们显明自己是活着的
  rationale: παρίστημι 加反身代词表示把自己呈现、显明出来；ζῶντα 作宾语补足语，说明他显现时是活着的。此译法自然地表达复活后的生命状态。
- source_word: μετὰ τὸ παθεῖν αὐτὸν
  choice: 他受难以后
  rationale: μετά 加冠词化不定式表示时间先后，即在他经历苦难之后。“受难”在此简洁表达耶稣所受的苦与死亡，同时避免较生硬的“受苦以后”。
- source_word: ἐν πολλοῖς τεκμηρίοις
  choice: 用许多证据
  rationale: ἐν 在此可表凭借或方式；τεκμήριον 指足以确立事实的凭据。“证据”是现代汉语中清楚自然的表达，其较强的确证意味在脚注中说明。
- source_word: δι’ ἡμερῶν τεσσεράκοντα
  choice: 在四十天期间
  rationale: διά 加属格表示贯穿一段时间，意指显现分布在四十天这一时期内，而不必理解为毫无间断地持续四十天。
- source_word: ὀπτανόμενος αὐτοῖς
  choice: 他向他们显现
  rationale: ὀπτάνομαι 在复活叙事中通常表示“显现”；主动式汉语表达自然，也保留耶稣被他们看见的意思。
- source_word: λέγων τὰ περὶ τῆς βασιλείας τοῦ θεοῦ
  choice: 并讲论上帝国度的事
  rationale: τὰ περὶ 表示“有关……的事”；“讲论”体现持续教导的语气。βασιλεία 兼有王权统治与国度领域的含义，译作“国度”保留这种常见的圣经表达。
theological_decisions:
- issue: 复活陈述与证据的效力
  choice: 直陈耶稣受难以后显明自己是活着的，并以许多证据支持这一事实。
  alternative: 译成“用许多无可置疑的凭据显明自己活着”。
  rationale: 原文明确陈述耶稣在受难之后仍活着，并使用 τεκμήριον 这一强证据词；正文不加入“无可置疑”等更绝对的修饰，而以脚注交代该词的确证意味。
- issue: βασιλεία τοῦ θεοῦ 的表达
  choice: 上帝国度
  alternative: 上帝的统治
  rationale: βασιλεία 可侧重统治权，也可指国度；“上帝国度”保留原文可能包含的两方面，不在本节中把含义限缩为抽象的统治行为。
- issue: οἷς 所指对象的性别表达
  choice: 他们
  alternative: 这些男人
  rationale: 上下文表明所指的是使徒，但 οἷς 本身没有名词“男人”；译作“他们”准确承接先行词，也避免在本节增添原文没有明说的成分。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“受难”“显现”“上帝国度”与基督教语境相符，但句法保持自然；分号呈现“显明自己活着”与随后两个分词所述方式和活动之间的紧密联系。
