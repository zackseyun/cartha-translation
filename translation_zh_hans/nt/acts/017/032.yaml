id: ACT.17.32
reference: Acts 17:32
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ἀκούσαντες δὲ ἀνάστασιν νεκρῶν οἱ μὲν ἐχλεύαζον οἱ δὲ εἶπαν Ἀκουσόμεθά σου ⸂περὶ τούτου καὶ πάλιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/032.yaml
  text: When they heard of the resurrection of the dead[a], some mocked, but others said, “We will hear you again about this.”
translation:
  language: zh_hans
  text: 他们听见死人复活的事，有些人就讥笑，另一些人却说：“关于这件事，我们还要再听你讲。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们以后还要听你讲这件事。”
    reason: καὶ πάλιν可着重表示另一次、以后再听；正文则用“还要再”保留“再次”的明示语气。
lexical_decisions:
- source_word: Ἀκούσαντες δὲ
  choice: 他们听见……事
  rationale: 以时间性从句自然引出听众的反应；δὲ在此仅作轻微叙事推进，普通话无需另加“现在”等词。
- source_word: ἀνάστασιν νεκρῶν
  choice: 死人复活
  rationale: 自然表达涉及死人的复活这一概念，不把无冠词结构强行处理为某一次不定的事件，也不扩展其教义含义。
- source_word: οἱ μὲν ... οἱ δὲ
  choice: 有些人……另一些人却……
  rationale: 清楚保留两个听众群体之间的对照。
- source_word: ἐχλεύαζον
  choice: 就讥笑
  rationale: 准确表达嘲弄、讥讽的反应；不强加“开始”这一可能但并非必须的未完成时体解释。
- source_word: Ἀκουσόμεθά σου
  choice: 我们还要再听你讲
  rationale: ἀκούω后接属格人称代词，表示听某人说话；“听你讲”是现代普通话中自然且明确的表达。
- source_word: περὶ τούτου καὶ πάλιν
  choice: 关于这件事……还要再……
  rationale: 既保留“关于这件事”的话题范围，也明确体现καὶ πάλιν所含“再次”的意思；中文调整语序以求自然。
theological_decisions:
- issue: 在异教背景听众面前“复活”用语的含义
  choice: 死人复活
  alternative: 从死人中复活
  rationale: ἀνάστασιν νεκρῶν自然指涉及死人的复活这一概念；译文不把它限定为某一个人从死人中复活，也不对听众理解或回应的真实动机作教义性推断。
- issue: 第二群听众的态度
  choice: 仅直译他们愿意再听，不说明是真诚兴趣还是委婉推辞
  alternative: 将话语解释为真诚求知或拖延拒绝
  rationale: 原文只记录其话语，语境容许不同理解；译文保留这种叙事上的含混。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“讥笑”简洁明确；引语保持口语自然，但不把第二群人的话解释成真诚邀请或委婉拒绝。
