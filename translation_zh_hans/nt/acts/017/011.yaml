id: ACT.17.11
reference: Acts 17:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οὗτοι δὲ ἦσαν εὐγενέστεροι τῶν ἐν Θεσσαλονίκῃ, οἵτινες ἐδέξαντο τὸν λόγον μετὰ πάσης προθυμίας, ⸀τὸ καθ’ ἡμέραν ἀνακρίνοντες τὰς γραφὰς εἰ ἔχοι ταῦτα οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/011.yaml
  text: These were more noble-minded than those in Thessalonica[a], for they received the word with all eagerness[b], examining the Scriptures daily to see whether these things were so.
translation:
  language: zh_hans
  text: 这些人比帖撒罗尼迦的人更为高尚[a]，因为他们以十分热切的心领受这道[b]，天天查考圣经，要看这些事是否真是这样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “更为高尚”也可译作“更为高贵”。希腊文既可指较可嘉的品格或态度，也可指较高的社会身份；后者在这里可能性较小。
    reason: 保留εὐγενέστεροι的词义范围及真实歧义。
  - marker: b
    text: “领受这道”也可译作“欣然接受这信息”。
    reason: 说明δέχομαι与λόγος在此可采用的自然替代译法。
lexical_decisions:
- source_word: εὐγενέστεροι
  choice: 更为开明可嘉
  rationale: 该比较级既可指身份高贵，也可指品格或态度高尚。下文以热切领受并查考圣经说明其可嘉之处，因此正文采用描述其开放而审慎态度的译法，同时用脚注保留社会身份的较弱可能。
- source_word: οἵτινες
  choice: 他们
  rationale: 此处关系代词引出对前述评价的解释；汉语用分号后接“他们”即可自然表达这种说明关系，无须生硬添加因果词。
- source_word: ἐδέξαντο τὸν λόγον
  choice: 领受了这道
  rationale: “领受”表达δέχομαι在此欢迎、接受之意；“这道”保留λόγος在《使徒行传》中的经文用语及神学回响，又由语境明确指所传的信息。
- source_word: μετὰ πάσης προθυμίας
  choice: 十分热切地
  rationale: προθυμία含欣然、乐意、热切之意，πάσης在此加强程度；“十分热切地”自然传达其全然积极的态度。
- source_word: τὸ καθ’ ἡμέραν
  choice: 天天
  rationale: 该短语作副词，表示逐日反复的行动；“天天”简明自然，并保留习惯性。
- source_word: ἀνακρίνοντες
  choice: 查考
  rationale: ἀνακρίνω可指审查、调查或细究；与“圣经”搭配时，“查考”既符合现代汉语经文语体，也体现认真核验，而不必加入原文未明说的“仔细”。
- source_word: τὰς γραφὰς
  choice: 圣经
  rationale: 此处复数γραφαί指犹太人的神圣经卷；现代汉语以“圣经”最为清楚、通行。
- source_word: εἰ ἔχοι ταῦτα οὕτως
  choice: 要看看这些事是否果真如此
  rationale: εἰ加间接问句表达核验所听内容是否确实如此；“果真如此”保留对事实状态的查证，不将其过度抽象化为一般真假判断。
theological_decisions:
- issue: εὐγενέστεροι在本节中的含义
  choice: 主要译为态度或品格更可嘉，并以“开明”体现其愿意聆听又审慎查证
  alternative: 出身或社会地位更高贵
  rationale: 紧接的分句以热切领受信息和天天查考圣经刻画这些人，支持品格与态度的理解；但词语本身确可涉及高贵身份，故脚注保留歧义。
- issue: λόγος的译法
  choice: 这道
  alternative: 这信息
  rationale: “道”在汉语圣经语境中可理解为所传讲的话或信息，并保留λόγος在《使徒行传》中的叙事与神学连贯性；脚注提供更日常的表达。
- issue: 领受与查考之间的关系
  choice: 并列保留热切接受与持续核验两方面
  alternative: 将查考解释为怀疑或无条件相信
  rationale: 原文同时肯定他们热切领受和每日查考，译文不把二者对立，也不替原文裁定其心理动机。
translation_notes:
  register: 采用现代、庄重而通俗的叙事语体。“开明可嘉”避免把原文直接限定为贵族出身，又不把它弱化成单纯“思想开放”；“领受这道”“查考圣经”保留熟悉的经文表达。所有脚注标记均已在正文出现。
