  text: διανοίγων καὶ παρατιθέμενος ὅτι τὸν χριστὸν ἔδει παθεῖν καὶ ἀναστῆναι ἐκ νεκρῶν, καὶ ὅτι οὗτός ἐστιν ⸂ὁ χριστός, ὁ⸃ Ἰησοῦς ὃν ἐγὼ καταγγέλλω ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/003.yaml
  text: explaining and demonstrating that the Messiah had to suffer and rise from the dead[a], and that this Jesus, whom I proclaim to you[b], is the Messiah.
translation:
  language: zh_hans
  text: 向他们讲解并举证，说明弥赛亚[a]必须受苦，并从死人中复活[b]；并说明：“我向你们所宣告的这位耶稣，就是弥赛亚。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弥赛亚”两处或译“基督”。
    reason: alternative_reading
  - marker: b
    text: 或译：“从死人中被复活。”这里的希腊文使用主动形式，直译为“从死人中起来”；新约其他经文也说上帝使耶稣复活。
    reason: lexical_alternative
lexical_decisions:
- source_word: διανοίγων
  choice: 讲解
  rationale: 此处指保罗把经文的含义阐明；“讲解”自然清楚，也符合会堂中根据经文辩论的语境。
- source_word: παρατιθέμενος
  choice: 举证
  rationale: 该词在此表示把依据摆在听众面前，以支持所讲解的内容；“举证”保留论证意味，又不夸大为形式逻辑上的证明。
- source_word: τὸν χριστόν / ὁ χριστός
  choice: 弥赛亚
  rationale: 两处 Χριστός 都是称号，指犹太人所盼望的受膏者；译作“弥赛亚”能清楚保留本节的犹太经文背景。
- source_word: ἔδει
  choice: 必须
  rationale: 表达由上帝旨意和经文所显明的必要性；“必须”简洁而有力度。
- source_word: παθεῖν
  choice: 受苦
  rationale: 准确表达 πάσχω，指弥赛亚所要经历的苦难。
- source_word: ἀναστῆναι ἐκ νεκρῶν
  choice: 从死人中复活
  rationale: ἀναστῆναι 是主动形式的不定式；“复活”在现代汉语中可作不及物动词，既自然，也保留“起来”的主动表述。
- source_word: καταγγέλλω
  choice: 宣告
  rationale: 保留公开传扬、郑重宣布的含义，不把表达限缩为特定形式的讲道。
- source_word: οὗτός ἐστιν ... Ἰησοῦς
  choice: 这位耶稣，就是
  rationale: 以自然汉语突出指示代词及判断关系，清楚表达保罗所宣告的耶稣就是弥赛亚。
theological_decisions:
- issue: Χριστός 在本节两次作为称号出现
  choice: 两处均译“弥赛亚”
  alternative: 两处均译“基督”
  rationale: 本节的论点是经文所预告的受膏者必须受苦并复活，而耶稣正是这一位；“弥赛亚”更直接显出称号及犹太经文语境，同时在脚注保留传统译法“基督”。
- issue: ἀναστῆναι 的语态含义
  choice: 从死人中复活
  alternative: 从死人中被复活
  rationale: 希腊文在这里使用主动形式，直译为“起来”；正文因此不改成被动表达。这并不否定新约其他经文所说上帝使耶稣复活。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“讲解并举证”保留两个并列分词的层次；分号和引语使保罗所论证的两项内容清楚可辨。脚注按中文正文首次出现的位置重新编号。
