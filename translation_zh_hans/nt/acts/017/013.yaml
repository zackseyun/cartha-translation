revisions:
- from: 可是，从帖撒罗尼迦来的犹太人得知，保罗也在庇哩亚宣讲了上帝的道，就也来到那里，煽动并扰乱群众。
  to: 可是，从帖撒罗尼迦来的犹太人得知保罗也在庇哩亚宣讲上帝的道后，也来到那里，煽动、扰乱群众。
  rationale: 仅作汉语句法和标点调整：以“得知……后”明确时间及逻辑衔接，将原文κἀκεῖ的“也”置于“来到那里”之前，并用顿号并列两个参与分词所表达的行动。未改变原文的主体、地点递进、被宣讲的信息或群众受扰的含义。
