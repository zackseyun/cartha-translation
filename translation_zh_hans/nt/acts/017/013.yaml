source:
  edition: SBLGNT
  text: ὡς δὲ ἔγνωσαν οἱ ἀπὸ τῆς Θεσσαλονίκης Ἰουδαῖοι ὅτι καὶ ἐν τῇ Βεροίᾳ κατηγγέλη ὑπὸ τοῦ Παύλου ὁ λόγος τοῦ θεοῦ, ἦλθον κἀκεῖ σαλεύοντες ⸂καὶ ταράσσοντες⸃ τοὺς ὄχλους.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/013.yaml
  text: But when the Jews from Thessalonica learned that the word of God had been proclaimed by Paul in Berea also[a], they came there too[b], stirring up and troubling the crowds.
translation:
  language: zh_hans
  text: 可是，从帖撒罗尼迦来的犹太人得知保罗也在庇哩亚宣讲上帝的道后，也来到那里，煽动、扰乱群众。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς δὲ
  choice: 可是，……得知……就
  rationale: 以“可是”承接上文并表现叙事中的轻微转折；用“得知……就”自然表达时间关系。
- source_word: ἔγνωσαν
  choice: 得知
  rationale: 这里指获悉一项消息，而非静态地“知道”。
- source_word: οἱ ἀπὸ τῆς Θεσσαλονίκης Ἰουδαῖοι
  choice: 从帖撒罗尼迦来的犹太人
  rationale: 明确限定为来自帖撒罗尼迦的那群犹太人，避免泛指所有犹太人。
- source_word: ὅτι καὶ ἐν τῇ Βεροίᾳ
  choice: 也在庇哩亚
  rationale: καί强调庇哩亚是继帖撒罗尼迦之后另一个宣讲地点。
- source_word: κατηγγέλη
  choice: 宣讲了
  rationale: 该动词的被动形式在汉语中宜按施事者“保罗”转为主动表达；“宣讲”保留公开传扬的含义。“了”自然交代这一事件先于他们得知消息。
- source_word: ὑπὸ τοῦ Παύλου
  choice: 保罗
  rationale: 原文以ὑπό加属格标明被动句的施事者；汉语主动句将其作为主语。
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: 上帝的道
  rationale: 保留这一熟悉而富有神学内涵的圣经表达，同时不把λόγος过度限定为某种后期技术概念。
- source_word: ἦλθον κἀκεῖ
  choice: 就也来到那里
  rationale: “也”保留κἀκεῖ中“连那里也去”的延伸意味；“就”顺畅连接得知消息后的行动。
- source_word: σαλεύοντες
  choice: 煽动
  rationale: 在群众语境中表示鼓动并造成社会骚动，比字面的“摇动”自然准确。
- source_word: καὶ ταράσσοντες
  choice: 并扰乱
  rationale: 保留第二个并列分词，表达进一步造成混乱和不安，而不与“煽动”合并。
- source_word: τοὺς ὄχλους
  choice: 群众
  rationale: 中性地表达聚集的人群，不采用带有过强贬义的“暴民”。
theological_decisions:
- issue: ὁ λόγος τοῦ θεοῦ的表达
  choice: 上帝的道
  alternative: 上帝的信息
  rationale: “上帝的道”既保留原文的固定属格结构和神学回响，也仍可在本段语境中理解为所宣讲的神圣信息，而不额外限定其含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。句式按现代汉语重组为主动句，忠实保留地点递进、行动主体以及“煽动／扰乱”两个相互加强但并不完全相同的动作。
