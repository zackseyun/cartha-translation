    issue: 句法连接略显生硬
    rationale: “得知，……，就也来到那里”的逗号串联使嵌入的消息内容和主要叙事动作界线不够清晰；“得知……后，也来到那里”更合现代汉语叙事句法。
  revised_text: 可是，从帖撒罗尼迦来的犹太人得知保罗也在庇哩亚宣讲上帝的道后，也来到那里，煽动、扰乱群众。
