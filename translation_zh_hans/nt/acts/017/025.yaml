  text: οὐδὲ ὑπὸ χειρῶν ⸀ἀνθρωπίνων θεραπεύεται προσδεόμενός τινος, αὐτὸς διδοὺς πᾶσι ζωὴν καὶ πνοὴν ⸂καὶ τὰ⸃ πάντα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/025.yaml
  text: Nor is he served by human hands[a], as though he needed anything, since he himself gives to all life and breath and all things.
translation:
  language: zh_hans
  text: 也不受人手服侍[a]，好像他缺少什么似的；反倒是他自己把生命、气息和万物赐给众人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “服侍”也可译作“供奉”。希腊原词可指在宗教语境中向神明所作的侍奉；这里强调神并不依赖人的供奉或服侍。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ
  choice: 也不
  rationale: 承接上一节的否定陈述，现代汉语用“也不”自然地表达递进关系。
- source_word: ὑπὸ χειρῶν ἀνθρωπίνων
  choice: 人手
  rationale: 保留原文具体的“人的手”意象，同时用简洁自然的现代汉语表达。
- source_word: θεραπεύεται
  choice: 需要……来服侍
  rationale: 此处不是“医治”，而是指接受人的服务或宗教性侍奉；结合后文“好像他缺少什么”，译文突出神并不依赖这种服侍。脚注保留“敬奉”这一宗教语境更鲜明的可能译法。
- source_word: προσδεόμενός τινος
  choice: 好像他缺少什么似的
  rationale: 保留分词所表达的设想或反事实语气，而不把它改写成较直接的“他什么都不缺”。
- source_word: αὐτὸς
  choice: 是他自己
  rationale: 保留强调代词的对比力量：不是神从人领受所需，反而是神亲自赐予。
- source_word: διδοὺς
  choice: 赐给
  rationale: 在论及神为生命来源的语境中，“赐给”自然庄重，并将分词关系转化为流畅的汉语谓语。
- source_word: πᾶσι
  choice: 众人
  rationale: 在保罗向人类听众论述神赐生命与气息的语境中，“众人”是自然且范围广泛的表达。
- source_word: ζωὴν καὶ πνοὴν
  choice: 生命、气息
  rationale: 直接保留两个并列概念；“气息”准确表达受造生命对呼吸的依赖，不误释为“灵”。
- source_word: καὶ τὰ πάντα
  choice: 和万物
  rationale: “万物”以庄重、简洁的方式保留原文涵盖一切的总体性表达。
theological_decisions:
- issue: θεραπεύεται应译为一般性的“服侍”，还是明确宗教性的“敬奉”
  choice: 正文译作“服侍”，脚注列出“敬奉”
  alternative: 受人手敬奉
  rationale: 原词在这里可指宗教环境中的侍奉，但保罗论证的重点是神不依赖人的服事或供奉。“服侍”保留较宽的词义范围，脚注则提示其宗教语境，避免把经文仅限于内在的敬拜观念。
- issue: πᾶσι所指的范围
  choice: 众人
  alternative: 万有
  rationale: 本段紧接着论及全人类，且“生命、气息”直接描述人的受赐与依赖；“众人”在汉语中清楚自然，同时不削弱其普遍范围。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“好像……似的”保留原文的设想语气；分号呈现前后鲜明对比。“需要人手来服侍他”兼顾汉语自然度与后文“不缺少什么”的论证关系。
