id: ACT.17.31
reference: Acts 17:31
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ⸀καθότι ἔστησεν ἡμέραν ἐν ᾗ μέλλει κρίνειν τὴν οἰκουμένην ἐν δικαιοσύνῃ ἐν ἀνδρὶ ᾧ ὥρισεν, πίστιν παρασχὼν πᾶσιν ἀναστήσας αὐτὸν ἐκ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/031.yaml
  text: because he has fixed a day on which he is going to judge the inhabited world in righteousness by a man whom he appointed[b][a], having given proof to all by raising him from the dead.
translation:
  language: zh_hans
  text: 因为他已经定下一个日子，要在那日借着他所指定的一个人，按公义[a]审判普天下；他使这人从死人中复活，借此向所有人提供了确据[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “按公义”也可译作“按公正”。
    reason: lexical_alternative
  - marker: b
    text: “提供了确据”也可译作“提供了证明”或“使所有人有了把握”；原文较直译为“把信（或信心）给所有人”，但这里指借着使他从死人中复活而给出的公开确证。
    reason: alternative_reading
lexical_decisions:
- source_word: καθότι
  choice: 因为
  rationale: 承接上文，说明上帝命令众人悔改的原因；“因为”自然地保留因果关系。
- source_word: ἔστησεν ἡμέραν
  choice: 已经定下一个日子
  rationale: ἵστημι在此指设定、指定；“定下”既清楚又体现日期已经确定。
- source_word: ἐν ᾗ μέλλει κρίνειν
  choice: 要在那日……审判
  rationale: μέλλει加不定式表达预定将要发生的行动；“要”保留未来及意定色彩，符合现代汉语。
- source_word: τὴν οἰκουμένην
  choice: 普天下
  rationale: οἰκουμένη指有人居住的世界，语境强调全人类所处的世界；“普天下”自然、庄重，并保留普世范围。
- source_word: ἐν δικαιοσύνῃ
  choice: 按公义
  rationale: “按公义”在审判语境中自然表达审判所依循的公义准则，同时以脚注保留“按公正”的可能译法。
- source_word: ἐν ἀνδρὶ ᾧ ὥρισεν
  choice: 借着他所指定的一个人
  rationale: ἐν在此表达施行审判所借的媒介；ἀνήρ明确指男性，且无冠词，因此译作“一个人”；ὥρισεν译作“指定”。
- source_word: πίστιν παρασχὼν πᾶσιν
  choice: 向所有人提供了确据
  rationale: πίστιν παρέχειν在此语境中是提供保证或确据，而不是使所有人产生主观信心；“确据”保留保证与公开证实的语义，脚注列出其他可能表达。
- source_word: ἀναστήσας αὐτὸν ἐκ νεκρῶν
  choice: 他使这人从死人中复活，借此
  rationale: 不定过去时分词在此说明上帝提供确据的方式；“借此”明确复活是确据的根据，而“从死人中复活”贴近原文。
theological_decisions:
- issue: δικαιοσύνη在审判语境中的译法
  choice: 按公义
  alternative: 按公正
  rationale: δικαιοσύνη可强调公义或公正；正文保留其常见神学用语“公义”，脚注呈现审判语境中自然的“公正”。
- issue: πίστις在πίστιν παρασχὼν πᾶσιν中的译法
  choice: 确据
  alternative: 证明；较直译为“信”或“信心”
  rationale: 该搭配在本句表示上帝借复活向众人提供保证或证据。直译“给所有人信心”容易误解为所有人都获得了主观信仰，因此正文采用“确据”，并在脚注保留词面及语境替代译法。
- issue: ἀνήρ的性别及定指性
  choice: 一个人
  alternative: 那个人
  rationale: 原文使用明确表示男性的ἀνήρ，且名词无冠词；“一个人”保留形式上的非定指表达，不在译文中直接补明其身份。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“普天下”体现οἰκουμένη的普世范围；分号将预定的审判与借复活所给的确据连接起来。所有代词均依原文保留，没有在正文中直接补出“耶稣”。
