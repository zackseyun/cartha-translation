revisions:
- from: 因为我一路走来，仔细察看你们所敬拜的各种对象，甚至发现一座祭坛，上面刻着：“献给一位不认识的神。”[a] 所以，你们不认识却仍敬拜的，我现在就向你们宣告。[b]
  to: 因为我经过各处，仔细察看你们所敬奉的对象时，发现一座祭坛，上面刻着：“献给一位未知的神。”[a] 因此，你们在无知中所敬拜的，我向你们宣告。[b]
  rationale: 修订将可能误指神自身“不认识”的“不认识的神”改为“未知的神”，从而准确传达铭文含义；删除原文未明说的“现在就”；并以“在无知中所敬拜的”保留ἀγνοοῦντες的方式意味及ὃ的中性、非人格化语法。脚注相应澄清冠词问题与中性关系代词，不对雅典人敬拜的神学性质作额外判断。
