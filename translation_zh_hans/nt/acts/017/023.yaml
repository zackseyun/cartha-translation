    rationale: 汉语中“不认识的神”易被读作该神不认识某对象，而Ἀγνώστῳ θεῷ意为“未知的神／人所不认识的神”。应改为“未知的神”。
  - severity: low
    issue: “现在就”属无根据增译
    rationale: ἐγὼ强调主语“我”，καταγγέλλω为“宣告”；本节没有明确对应“现在就”的词语。删去可避免添加即时性。
  - severity: low
    issue: 脚注a关于汉语冠词的表述不够准确
    rationale: 希腊文无冠词是重要信息，但现代汉语没有与希腊语冠词一一对应的冠词系统；脚注宜说明“一位／那位”是译文中可作的语境化处理。
