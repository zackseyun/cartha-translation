source:
  edition: SBLGNT
  text: διερχόμενος γὰρ καὶ ἀναθεωρῶν τὰ σεβάσματα ὑμῶν εὗρον καὶ βωμὸν ἐν ᾧ ἐπεγέγραπτο· Ἀγνώστῳ θεῷ. ⸀ὃ οὖν ἀγνοοῦντες εὐσεβεῖτε, ⸀τοῦτο ἐγὼ καταγγέλλω ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/023.yaml
  text: For as I was passing through and observing your objects of worship[a], I even found an altar on which had been inscribed, ‘To an unknown god.’ Therefore[b], what you worship in ignorance—this I proclaim to you.
translation:
  language: zh_hans
  text: 因为我经过各处，仔细察看你们所敬奉的对象时，发现一座祭坛，上面刻着：“献给一位未知的神。”[a] 因此，你们在无知中所敬拜的，我向你们宣告。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“献给那位未知的神”。希腊文铭文没有定冠词；汉语可依语境用“一位”或“那位”来表达。
    reason: lexical_alternative
  - marker: b
    text: 也可按汉语较自然地译作“你们所敬拜却不认识的那一位”。但希腊文使用中性关系代词，正文保留较非人格化的“所敬拜的”。
    reason: alternative_reading
lexical_decisions:
- source_word: διερχόμενος
  choice: 一路走来
  rationale: 以自然的汉语表达行经各处的持续动作，并与随后“仔细察看”构成连贯的背景。
- source_word: ἀναθεωρῶν
  choice: 仔细察看
  rationale: 体现该词所含的专注观察之意，而不只是随意看见。
- source_word: τὰ σεβάσματα
  choice: 所敬拜的各种对象
  rationale: 保留复数及宽泛所指，可涵盖宗教崇敬对象、圣物或设施，避免缩窄为“神像”或“庙宇”。
- source_word: βωμὸν
  choice: 祭坛
  rationale: βωμός在此指用于宗教祭献的坛，译为“祭坛”准确且通行。
- source_word: ἐπεγέγραπτο
  choice: 上面刻着
  rationale: 以符合祭坛铭文的现代汉语表达被动且先已题写的状态。
- source_word: Ἀγνώστῳ θεῷ
  choice: 献给一位不认识的神
  rationale: 符合奉献铭文语境；“一位”自然反映希腊文无冠词，同时保留“不认识”与下文ἀγνοοῦντες的词义呼应。
- source_word: ὃ οὖν
  choice: 所以，……的
  rationale: “所以”表达οὖν的推论关系；采用“……的”作为名词性结构，尽量保留中性关系代词ὃ的非人格化表达。
- source_word: ἀγνοοῦντες
  choice: 不认识
  rationale: 既可表达缺乏认识，也与铭文中的Ἀγνώστῳ形成清楚的修辞呼应。
- source_word: εὐσεβεῖτε
  choice: 敬拜
  rationale: 在祭坛和宗教敬虔的语境中，“敬拜”清楚自然；不将其弱化为一般性的“尊敬”。
- source_word: καταγγέλλω
  choice: 宣告
  rationale: 传达公开而郑重地宣布信息之意，适合保罗演说的语境。
theological_decisions:
- issue: 中性关系代词ὃ的所指
  choice: 译为“你们不认识却仍敬拜的”，不直接人格化
  alternative: “你们不认识却敬拜的那一位”
  rationale: 原文使用中性关系代词ὃ，而非阳性“那一位”。正文保留这种语法上的非人格化和神学张力，不提前替保罗明确其所指为人格化对象；脚注说明常见的自然化译法。
- issue: 雅典人的敬拜与保罗所宣告者之间的关系
  choice: 保留“敬拜的……我向你们宣告”这一修辞连接
  alternative: 明确译成“你们无意中已经敬拜真神”
  rationale: 原文建立了演说上的连接，却没有在本节详细界定雅典人的敬拜是否构成对真神的真实认识；译文不额外作神学判断。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“一路走来，仔细察看”保持演说叙述的流畅感；“各种对象”补足复数和宽泛语义。“不认识”在铭文与后半句中重复，用来保留希腊文ἄγνωστος/ἀγνοέω的修辞呼应。所有脚注标记均置于正文相关位置。
