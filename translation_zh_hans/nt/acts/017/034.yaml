  text: τινὲς δὲ ἄνδρες κολληθέντες αὐτῷ ἐπίστευσαν, ἐν οἷς καὶ Διονύσιος ὁ Ἀρεοπαγίτης καὶ γυνὴ ὀνόματι Δάμαρις καὶ ἕτεροι σὺν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/034.yaml
  text: But some men joined him and believed[a], among whom were also Dionysius the Areopagite, and a woman named Damaris[b], and others with them.
translation:
  language: zh_hans
  text: 不过，有些男子亲近保罗[a]，并且信了。其中有亚略巴古人狄奥尼修[b]、一个名叫大马哩的女人，以及同他们在一起的其他人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亲近保罗”也可译作“依附他”或“紧紧跟随他”；希腊语表示他们与保罗有密切的个人联系。
    reason: lexical_alternative
  - marker: b
    text: “亚略巴古人”可能指亚略巴古议事会的成员，或泛指与该机构有关的人。
    reason: cultural_note
lexical_decisions:
- source_word: τινὲς δὲ ἄνδρες
  choice: 不过，有几个男人
  rationale: δὲ承接上文并形成轻微转折，译作“不过”；τινὲς表示其中一部分人；ἄνδρες在此明确为阳性复数，故保留“男人”，也与后面单独提到的女人相呼应。
- source_word: κολληθέντες αὐτῷ
  choice: 归附了他
  rationale: κολλάομαι表示贴近、依附或与某人紧密联合；“归附”简洁地表达这些人与保罗建立紧密联系并站到他这一边。代词“他”保留原文表达，所指由上下文确定为保罗。
- source_word: ἐπίστευσαν
  choice: 信了
  rationale: 直接表达πιστεύω的叙事含义，不擅自补出信仰对象或完整的教义表述。
- source_word: ἐν οἷς καὶ
  choice: 其中有
  rationale: 自然地引出信者中的具名例子，并保留其属于前述群体的关系。
- source_word: Διονύσιος
  choice: 狄奥尼修
  rationale: 按希腊语人名作现代汉语音译。
- source_word: ὁ Ἀρεοπαγίτης
  choice: 亚略巴古议员
  rationale: 该称号通常指亚略巴古议事会的成员；正文采用清楚易懂的表达，同时以脚注保留也可能泛指与该机构有关之人的余地。
- source_word: γυνὴ ὀνόματι Δάμαρις
  choice: 一个名叫大马哩的女人
  rationale: 自然、准确地保留人物的性别和姓名。
- source_word: ἕτεροι σὺν αὐτοῖς
  choice: 和他们在一起的其他人
  rationale: 保留ἕτεροι所指的其他人，以及σύν表达的共同关系，不限定这些人的性别或身份。
theological_decisions:
- issue: πιστεύω在本节中的信仰含义
  choice: 信了
  alternative: 有了信仰；归信了
  rationale: 经文肯定他们对保罗宣讲的回应是真实的相信，却没有在本句明说信仰对象或给出更完整的教义公式；“信了”既忠实又避免添加原文未明说的内容。
- issue: κολληθέντες与ἐπίστευσαν之间的关系
  choice: 分别译为“归附了他，并且信了”
  alternative: 合并为“跟随他信了”
  rationale: 原文分别陈述他们与保罗紧密联合及他们相信这两件事；分开翻译可避免把信仰对象误解为保罗，也保留叙事中的双重动作。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“不过”体现与前文讥诮或观望者的对比；人名采用贴近希腊语的汉语音译。脚注标记紧跟各自所说明的词语，避免把有关“亚略巴古”的注释误挂在人名“大马哩”之后。
