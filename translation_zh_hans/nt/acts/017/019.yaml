id: ACT.17.19
reference: Acts 17:19
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐπιλαβόμενοί ⸀τε αὐτοῦ ἐπὶ τὸν Ἄρειον Πάγον ἤγαγον, λέγοντες· Δυνάμεθα γνῶναι τίς ἡ καινὴ αὕτη ἡ ὑπὸ σοῦ λαλουμένη διδαχή;
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/019.yaml
  text: So they took hold of him and brought him to the Areopagus, saying, “May we know what this new teaching is that is being spoken by you?”
translation:
  language: zh_hans
  text: 他们就拉住他，把他带到亚略巴古[a]，说：“我们可以知道你所讲的这新教导是什么吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚略巴古”可指这座山丘本身，也可指与其相关的议事会；传统译名亦作“亚略巴古山”。
    reason: cultural_note
lexical_decisions:
- source_word: ἐπιλαβόμενοί
  choice: 拉住
  rationale: 既保留主动接触并带走他的动作，也不把语气强化为正式逮捕；比“抓捕”中性，又比单纯“邀请”更贴近原文。
- source_word: τε
  choice: 就
  rationale: 作为轻微连接词，承接上文并推动叙事；现代汉语用“就”自然流畅。
- source_word: ἐπὶ τὸν Ἄρειον Πάγον
  choice: 到亚略巴古
  rationale: 音译专名，不在正文中断定所指仅是山丘还是与之相关的议事会，以保留原文可能的双重指涉。
- source_word: ἤγαγον
  choice: 带到
  rationale: 准确表达朝某目的地领去或带去，并与“拉住他”自然衔接。
- source_word: λέγοντες
  choice: 说
  rationale: 以自然汉语表达伴随主要动作发生的言说。
- source_word: Δυνάμεθα γνῶναι
  choice: 我们可以知道……吗
  rationale: 兼顾字面上的“能够”和语境中的礼貌询问，不将其处理成单纯能力问题。
- source_word: καινὴ
  choice: 新
  rationale: 简明表达听众认为这教导新颖或此前不熟悉，不额外加入贬义。
- source_word: ἡ ὑπὸ σοῦ λαλουμένη
  choice: 你所讲的
  rationale: 自然地传达被动分词与施事短语“由你讲说”的含义；汉语关系结构无需机械复制希腊语被动态。
- source_word: διδαχή
  choice: 教导
  rationale: 现代、清楚且不过度技术化；比“教义”更符合此处泛指所传讲内容的语境。
theological_decisions:
- issue: 保罗被带到亚略巴古时行动的强度
  choice: 译作“拉住他，把他带到”，表示明确而较有力度的身体行动，但不定性为逮捕
  alternative: “抓住他”或“请他一同去”
  rationale: ἐπιλαμβάνομαι 可指抓住或带领；上下文显示询问与好奇，却不足以证明正式拘捕，因此避免过度强化或弱化。
- issue: Ἄρειος Πάγος 的具体所指
  choice: 正文保留专名“亚略巴古”
  alternative: “亚略巴古山”或“亚略巴古议事会”
  rationale: 该名称可能指山丘本身，也可能指与之相关的议事机构；正文不替原文消除这一历史语义上的含混。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。问句保留礼貌探询语气；“你所讲的”比机械被动式自然，同时忠实传达原文。
