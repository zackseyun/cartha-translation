  text: πολλοὶ μὲν οὖν ἐξ αὐτῶν ἐπίστευσαν, καὶ τῶν Ἑλληνίδων γυναικῶν τῶν εὐσχημόνων καὶ ἀνδρῶν οὐκ ὀλίγοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/012.yaml
  text: Therefore many of them believed[b][a], and not a few of the prominent Greek women and men.
translation:
  language: zh_hans
  text: 所以，他们中有许多人信了；有身份的希腊妇女和男子也不少。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “有身份的”也可译作“受人尊重的”或“社会地位较高的”；“不少”是委婉说法，意为人数相当多。
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ μὲν οὖν
  choice: 所以……有许多人
  rationale: μὲν οὖν承接上一节并表明结果；“所以”自然体现推论和过渡，不逐一生硬翻出虚词。
- source_word: ἐξ αὐτῶν
  choice: 他们中
  rationale: 保留ἐξ的部分整体关系，并自然回指前文所说的人。
- source_word: ἐπίστευσαν
  choice: 信了
  rationale: 直接对应πιστεύω；信的对象由上下文补足，不在本节中加入额外的教义表述。
- source_word: τῶν Ἑλληνίδων γυναικῶν τῶν εὐσχημόνων
  choice: 有身份的希腊妇女
  rationale: γυναῖκες在此指妇女而非妻子；εὐσχήμων在本语境主要表示受尊重或社会地位较高，“有身份的”兼顾社会地位与现代汉语的自然表达。
- source_word: καὶ ἀνδρῶν οὐκ ὀλίγοι
  choice: 和男子也不少
  rationale: 保留οὐκ ὀλίγοι“不少”的曲言表达；按希腊文最自然的句法，形容词“有身份的”直接修饰妇女，而不强行扩展到男子。
theological_decisions:
- issue: 是否把ἐπίστευσαν译成带有明确基督教教义对象的表述
  choice: 信了
  alternative: 信了弥赛亚／相信了这信息
  rationale: 原文本节没有明说信的对象，宜由上下文理解，不补入本节未明载的教义内容。
- issue: εὐσχημόνων是否同时修饰妇女和男子
  choice: 只明确修饰“希腊妇女”
  alternative: 译作“有身份的希腊妇女和男子”
  rationale: 希腊文τῶν εὐσχημόνων在性、数、格上与γυναικῶν一致，而ἀνδρῶν另以属格阳性出现；因此不把该修饰语无标记地延伸到男子。
translation_notes:
  register: 采用现代、庄重而通俗的简体中文。“信了”简洁承接上下文；分号清楚区分两组信的人，同时保留原句推进关系。
