  text: ζητεῖν τὸν ⸀θεὸν εἰ ἄρα γε ψηλαφήσειαν αὐτὸν καὶ εὕροιεν, καί γε οὐ μακρὰν ἀπὸ ἑνὸς ἑκάστου ἡμῶν ὑπάρχοντα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/027.yaml
  text: that they should seek God[a], if perhaps they might grope for him and find him—though indeed he is not far from each one of us.
translation:
  language: zh_hans
  text: 为要使他们寻求上帝，或许能在摸索中寻到他[a]；其实，他离我们每一个人都不远。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “摸索”也可译作“用手探寻”。希腊语动词含有凭触摸寻找的意思，可使人联想到在视线不清或黑暗中探寻。
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητεῖν
  choice: 为要使他们寻求
  rationale: 承接前文所表达的目的，以“为要使”自然呈现不定式的目的意味。
- source_word: τὸν θεόν
  choice: 上帝
  rationale: 此处指独一的上帝；汉语不需对应希腊语冠词。
- source_word: εἰ ἄρα γε
  choice: 或者可以
  rationale: 保留试探性和不确定意味，同时符合现代汉语表达。
- source_word: ψηλαφήσειαν
  choice: 摸索着
  rationale: 该词带有用手触摸、在视线受限时探寻的形象；“摸索着”既保留隐喻，也自然易懂。
- source_word: καὶ εὕροιεν
  choice: 找到他
  rationale: 与前一愿望式动词并列，其可能意味由“可以”统摄，无须重复。
- source_word: καί γε
  choice: 其实
  rationale: 引出与人试探性摸索形成对照的事实说明，体现此处带强调色彩的转折。
- source_word: οὐ μακρὰν ἀπὸ ἑνὸς ἑκάστου ἡμῶν
  choice: 他离我们每一个人都不远
  rationale: 直接表达上帝的临近，并以“每一个人”保留ἑνὸς ἑκάστου的逐一、分配性强调。
- source_word: ὑπάρχοντα
  choice: 他……不远
  rationale: 该分词说明上帝实际处于不远的状态；汉语以完整谓语句自然呈现。
theological_decisions:
- issue: 上帝可被寻见与人的有限寻求
  choice: 同时保留“或者可以摸索着找到他”的试探性，以及“其实，他……都不远”的确定陈述。
  alternative: 把人的寻求译成较有把握的“就能找到”，或把“摸索”弱化为普通的“寻找”。
  rationale: 原文并置人的认知局限与上帝真实的临近；译文不把这种张力化约为必然找到或完全不可企及。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“摸索着”保留原文的触觉意象；分号突出人的试探性寻求与上帝实际临近之间的对照。脚注标记置于整节末尾，对正文中的“摸索着”作说明。
