  text: διελέγετο μὲν οὖν ἐν τῇ συναγωγῇ τοῖς Ἰουδαίοις καὶ τοῖς σεβομένοις καὶ ἐν τῇ ἀγορᾷ κατὰ πᾶσαν ἡμέραν πρὸς τοὺς παρατυγχάνοντας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/017.yaml
  text: So he was reasoning in the synagogue with the Jews and those who worshiped God[b][a], and in the marketplace every day with those who happened to be there.
translation:
  language: zh_hans
  text: 于是，他在会堂里同犹太人和敬拜上帝的人[a]讲论，也天天在市集[b]同碰巧在那里的人讲论。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“敬畏上帝的人”，指参与犹太人敬拜的外族人。
    reason: lexical_alternative
  - marker: b
    text: “市集”也是人们聚集的城市公共空间，并不只是买卖货物的地方。
    reason: cultural_note
lexical_decisions:
- source_word: διελέγετο
  choice: 讲论
  rationale: 未完成时表示持续或反复进行的活动；“讲论”既保留对话交流的意味，也能涵盖以理据阐明、论证的语气，且比“辩论”较少预设敌对意味。
- source_word: μὲν οὖν
  choice: 于是
  rationale: 承接上文并推进叙事；“于是”符合现代汉语篇章衔接习惯，不过度强化严格的因果推论。
- source_word: συναγωγῇ
  choice: 会堂
  rationale: 此处指犹太人的会堂这一明确的宗教聚会场所；“会堂”是简体中文圣经语境中自然且通行的表达。
- source_word: τοῖς Ἰουδαίοις
  choice: 犹太人
  rationale: 这里指会堂中的犹太群体，并非特指来自犹太地区的人。
- source_word: τοῖς σεβομένοις
  choice: 敬拜上帝的人
  rationale: 分词本身意为“敬拜、尊崇的人”，在《使徒行传》的会堂语境中通常指参与犹太敬拜的外族人；补出“上帝”使现代中文意思完整，同时以脚注保留术语性译法。
- source_word: ἀγορᾷ
  choice: 市集
  rationale: 该词指兼具商业和公共 civic 活动功能的城市广场；正文采用易懂的“市集”，脚注说明其范围不限于买卖场所。
- source_word: κατὰ πᾶσαν ἡμέραν
  choice: 天天
  rationale: 自然简洁地表达每天反复进行的活动。
- source_word: πρὸς τοὺς παρατυγχάνοντας
  choice: 同碰巧在那里的人
  rationale: 保留这些人偶然在场或正好遇上的含义，不将范围缩窄为仅仅路过的人。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“讲论”避免把场景写成单向演说，也不把互动过度定性为激烈争辩；两个地点均由同一动词统摄，中文中为清晰起见重复“讲论”。
