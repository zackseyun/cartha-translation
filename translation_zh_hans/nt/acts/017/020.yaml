  yaml_path: translation/nt/acts/017/020.yaml
  text: For you are bringing some strange things to our ears[b][a]. Therefore we want to know what these things mean.
translation:
  language: zh_hans
  text: 因为你把一些陌生的事传到我们耳中[a]，所以我们想知道这些事究竟是什么意思[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “陌生的事”也可译作“新奇的事”“外来的事”或“异乎寻常的事”。原文指使听者感到不熟悉或异样的内容，也可能含有因其新鲜或来自外界而陌生的意思。
    reason: lexical_alternative
  - marker: b
    text: 原文按字面结构近于“这些事想要是什么”，是询问这些事有什么含义或意义的表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: ξενίζοντα τινα
  choice: 一些新奇的事
  rationale: ξενίζοντα 在这里指听者觉得陌生、异乎寻常的内容；“新奇”自然地表达因新鲜或外来而令人陌生的意味，同时 τινα 译作“一些”，保留不确定性。
- source_word: εἰσφέρεις εἰς τὰς ἀκοὰς ἡμῶν
  choice: 你把……带进我们耳中
  rationale: 保留原文“带进”和“耳中”的具体比喻，也符合现代汉语的可理解性。
- source_word: βουλόμεθα οὖν γνῶναι
  choice: 所以我们想知道
  rationale: “所以”表达 οὖν 的推论关系；“想知道”自然传达 βουλόμεθα 与 γνῶναι。
- source_word: τίνα θέλει ταῦτα εἶναι
  choice: 这些事究竟是什么意思
  rationale: 该结构字面近于“这些事想要是什么”，在语境中是询问其含义或意义；加入“究竟”使询问语气自然，但不增添新的命题内容。
- source_word: γάρ
  choice: 因为
  rationale: γάρ 承接上一节，说明他们为何觉得需要进一步了解；“因为”清楚呈现解释关系。
