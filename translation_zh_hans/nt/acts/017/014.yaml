  text: εὐθέως δὲ τότε τὸν Παῦλον ἐξαπέστειλαν οἱ ἀδελφοὶ πορεύεσθαι ⸀ἕως ἐπὶ τὴν θάλασσαν· ⸂ὑπέμεινάν τε⸃ ὅ τε Σιλᾶς καὶ ὁ Τιμόθεος ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/014.yaml
  text: Then the brothers immediately sent Paul away to go as far as the sea[b][a], but both Silas and Timothy remained there.
translation:
  language: zh_hans
  text: 于是，弟兄们[a]立刻送保罗离开，让他前往海边[b]；西拉和提摩太却仍留在那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“弟兄姊妹们”；希腊文作“弟兄们”，也可统指一同信主的人。
    reason: lexical_alternative
  - marker: b
    text: 或译“到海边去”或“朝海边去”；希腊文可表示一路行至海岸，但没有进一步说明。
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθέως δὲ τότε
  choice: 于是……立刻
  rationale: 既自然表达叙事推进，也保留行动迅速的语义。
- source_word: ἐξαπέστειλαν
  choice: 送……离开
  rationale: 体现复合动词中使人离开当地的意味，同时符合现代汉语表达。
- source_word: οἱ ἀδελφοὶ
  choice: 弟兄们
  rationale: 保留希腊文阳性复数的形式；在本语境中也可能统指当地信徒，故以脚注说明。
- source_word: πορεύεσθαι
  choice: 让他前往
  rationale: 在“送”之后自然表达不定式所说明的行动目的。
- source_word: ἕως ἐπὶ τὴν θάλασσαν
  choice: 前往海边
  rationale: 表达朝海岸行进的意思，同时不认定保罗是否随后乘船。
- source_word: ὑπέμεινάν
  choice: 仍留在
  rationale: 本处指继续停留，而非忍受苦难；“仍”也清楚呈现与保罗离开的对比。
- source_word: ὅ τε Σιλᾶς καὶ ὁ Τιμόθεος
  choice: 西拉和提摩太
  rationale: 汉语并列结构已自然涵盖两者，无须生硬加入“二人都”。
- source_word: ἐκεῖ
  choice: 那里
  rationale: 直接、自然地对应处所副词。
theological_decisions:
- issue: ἀδελφοί对信徒群体的称呼
  choice: 弟兄们
  alternative: 弟兄姊妹们；信徒们
  rationale: 正文保留原文阳性复数的源语形态，不排除该词在语境中统指男女信徒；包容性理解置于脚注，避免正文替原文消解范围上的可能性。
- issue: 保罗前往海边的具体方式和目的地
  choice: 前往海边
  alternative: 到海边去；朝海边去；一路到海边
  rationale: 原文措辞可指抵达海岸，也可着重朝海岸移动，并未明确说明是否乘船，因此不在正文中补入海路旅行。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“于是……立刻”顺畅承接上下文；“却仍留在那里”明确呈现保罗离去与两位同工留下的对比。脚注标记依英文资料顺序附在相关短语后，但按标记分别列为[a]、[b]。
