source:
  edition: SBLGNT
  text: οἱ δὲ ⸀καθιστάνοντες τὸν Παῦλον ⸀ἤγαγον ἕως Ἀθηνῶν, καὶ λαβόντες ἐντολὴν πρὸς τὸν Σιλᾶν καὶ ⸀τὸν Τιμόθεον ἵνα ὡς τάχιστα ἔλθωσιν πρὸς αὐτὸν ἐξῄεσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/015.yaml
  text: Those who were escorting Paul brought him as far as Athens[a], and after receiving instructions for Silas and Timothy to come to him as quickly as possible[b], they departed.
translation:
  language: zh_hans
  text: 护送保罗的人把他一直带到雅典[a]。他们领受了给西拉和提摩太的嘱咐，要二人尽快到保罗那里去[b]，随后就离开了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把他带到雅典。”原文ἕως含有“直至、直到”的意思，正文用“一直带到”保留陪同至该目的地的语感。
    reason: lexical_alternative
  - marker: b
    text: “嘱咐”也可译作“命令”或“指示”；原文ἐντολή可带有较强的权威意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: καθιστάνοντες
  choice: 护送
  rationale: 此处分词指这些人陪同保罗前往下一目的地；结合上下文，很可能也含有保障旅途安全、将他送达的意味。“护送”自然凝练，并区别于主句ἤγαγον所表达的“带到”。
- source_word: ἤγαγον
  choice: 把他……带到
  rationale: 不定过去时主句描述将保罗送达雅典这一完成的行动。现代汉语用“把他……带到”自然清楚。
- source_word: ἕως Ἀθηνῶν
  choice: 一直带到雅典
  rationale: ἕως与地名连用表示所达到的界限或终点。“一直……到”保留护送者陪保罗直至该地的语感；也可简译为“带到雅典”。
- source_word: λαβόντες ἐντολήν
  choice: 领受了……嘱咐
  rationale: λαβόντες在叙事中表示先于离开发生的行动。ἐντολή可指命令或指示；在同工传话的语境中，“嘱咐”既保留一定分量，又不无根据地强化为权威命令。
- source_word: πρὸς τὸν Σιλᾶν καὶ τὸν Τιμόθεον
  choice: 给西拉和提摩太的
  rationale: πρός在这里标明嘱咐的接收者。“给……的嘱咐”符合现代汉语表达。
- source_word: ἵνα ὡς τάχιστα ἔλθωσιν πρὸς αὐτόν
  choice: 要二人尽快到保罗那里去
  rationale: ἵνα从句说明嘱咐的内容，ὡς τάχιστα表达高度紧迫性。“尽快”自然传达“越快越好”。为避免中文代词指向含混，将αὐτόν明确译为“保罗”。
- source_word: ἐξῄεσαν
  choice: 随后就离开了
  rationale: 未完成过去时在段落末尾叙述护送者启程离去。“随后就离开了”符合中文叙事，并清楚连接前面的领受嘱咐。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“护送”与“带到”分别呈现分词和主句动词；后半句调整为符合汉语习惯的顺序。正文中的[a]、[b]均有对应脚注。
