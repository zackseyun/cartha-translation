  text: κατὰ δὲ τὸ εἰωθὸς τῷ Παύλῳ εἰσῆλθεν πρὸς αὐτοὺς καὶ ἐπὶ σάββατα τρία διελέξατο αὐτοῖς ἀπὸ τῶν γραφῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/002.yaml
  text: And according to Paul's custom[a], he went in to them, and on three Sabbaths he reasoned with them from the Scriptures[c][b],
translation:
  language: zh_hans
  text: 保罗照着自己一贯的做法，进去见他们；在三个安息日[a]，他根据圣经同他们辩论[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“历经三个安息日”或“一连三个安息日”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“与他们讨论”或“同他们对话”。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ δὲ τὸ εἰωθὸς τῷ Παύλῳ
  choice: 保罗照自己的惯例
  rationale: 该结构表达保罗一贯的做法。“照自己的惯例”自然、简洁，并保留习惯性的含义。δέ在此主要承接叙事，汉语无需单独译出。
- source_word: εἰσῆλθεν πρὸς αὐτοὺς
  choice: 进去见他们
  rationale: 保留εἰσέρχομαι“进入”的动作，也以“见他们”表达πρὸς αὐτούς所指的趋向；不在本节明说原文未重复出现的“会堂”或“犹太人”。
- source_word: ἐπὶ σάββατα τρία
  choice: 一连三个安息日
  rationale: 自然表达行动分布在连续三个安息日，也保留该短语可能侧重时间延续的空间，并以脚注列出另一种译法。
- source_word: διελέξατο αὐτοῖς
  choice: 与他们辩论
  rationale: διαλέγομαι在《使徒行传》中指以论证、讨论的方式交谈。“辩论”保留推理与说服的力度，但未必含有敌意；脚注注明较中性的可能译法。
- source_word: ἀπὸ τῶν γραφῶν
  choice: 根据圣经
  rationale: ἀπό在此表明论证所依据或取材的来源。“根据圣经”是自然的现代汉语，并保留γραφαί作为公认神圣经卷的含义。
theological_decisions:
- issue: “他们”的所指
  choice: 正文保留代词“他们”
  alternative: 明确译作“会堂里的人”或“犹太人”
  rationale: 上下文表明场景是犹太人的会堂，但本节本身只用代词。保留“他们”避免把上下文信息直接增补为本节的明说内容。
- issue: διαλέγομαι所表达的互动性质
  choice: 译作“辩论”，并以脚注保留“讨论”的可能
  alternative: 与他们讨论／同他们对话
  rationale: 该词可涵盖讨论、推论和论辩。此处从圣经展开论证，故正文采用较有论证力度的“辩论”，但不把它理解为必然敌对的争吵。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“进去见他们”需结合上文的会堂场景理解；正文不越过希腊文本补明对象。“一连三个安息日”符合现代汉语习惯，脚注保留时间短语的另一种理解。
