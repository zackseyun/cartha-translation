  text: Ἐν δὲ ταῖς Ἀθήναις ἐκδεχομένου αὐτοὺς τοῦ Παύλου, παρωξύνετο τὸ πνεῦμα αὐτοῦ ἐν αὐτῷ ⸀θεωροῦντος κατείδωλον οὖσαν τὴν πόλιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/016.yaml
  text: While Paul was waiting for them in Athens[b][a], his spirit was provoked within him as he saw that the city was full of idols.
translation:
  language: zh_hans
  text: 保罗在雅典等候他们的时候，看见这城满是偶像[b]，心里十分激愤[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “心里十分激愤”直译近于“他的灵在他里面受到强烈激动”；也可译作“内心受到强烈震动”或“心里很受刺激”。希腊语动词表示尖锐而强烈的内在反应。
    reason: lexical_alternative
  - marker: b
    text: “这城满是偶像”也可译作“这城充斥着偶像”或“这城遍布偶像”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκδεχομένου
  choice: 等候
  rationale: 该分词与“保罗”构成属格独立结构，交代当时的持续状态；“等候”自然地表达他正在等待同伴。
- source_word: παρωξύνετο
  choice: 十分激愤
  rationale: 未完成时中间／被动形式描写持续而强烈的内在反应；“激愤”兼有受刺激、愤慨和不安之意，不把感受窄化为单纯悲伤。
- source_word: τὸ πνεῦμα αὐτοῦ ἐν αὐτῷ
  choice: 心里
  rationale: 直译近于“他的灵在他里面”；此处指保罗内在的精神与情感反应。现代汉语用“心里”简洁自然，又不暗示这里明确指圣灵。
- source_word: θεωροῦντος
  choice: 看见
  rationale: 该分词表示与激愤同时发生的观察；“看见”符合现代汉语叙事，也保留其亲眼观察之意。
- source_word: κατείδωλον
  choice: 满城都是偶像
  rationale: 该形容词表示遍布偶像、充斥偶像；结合“城”译成“满城都是偶像”，清楚自然，并避免直接加入“全城沉溺于偶像崇拜”等较强解释。
- source_word: πόλιν
  choice: 城
  rationale: 原文说“这城”，所指即前文的雅典；在“满城”中表达最为自然。
- source_word: δὲ
  choice: 不单独译出
  rationale: δὲ在此主要承担叙事过渡作用；中文承接上下文时无需机械加入“如今”或“但是”。
theological_decisions:
- issue: “他的灵”的所指
  choice: 以“心里”表达保罗本人内在的反应
  alternative: 译作“他的灵在他里面”，或理解为圣灵的推动
  rationale: 属格“他的”以及“在他里面”首先指向保罗自身的内在反应；经文没有明确说这是圣灵的行动，因此正文不加入该神学判断。
- issue: 保罗内在反应的性质
  choice: 译作“十分激愤”
  alternative: “很忧愁”或“受到强烈震动”
  rationale: παρωξύνετο含尖锐刺激、激动或愤慨的语义；“激愤”保留其力度，但脚注列出其他可能侧重，以免把复杂反应绝对化。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“满城都是偶像”比“看见这城是遍布偶像的”更符合汉语表达；“心里十分激愤”避免生硬直译，同时通过脚注保留原文“灵在他里面”及动词可能涵盖的忧伤、震动等语义。正文脚注按相关短语依次标注。
