  text: ἐν αὐτῷ γὰρ ζῶμεν καὶ κινούμεθα καὶ ἐσμέν, ὡς καί τινες τῶν καθ’ ὑμᾶς ποιητῶν εἰρήκασιν· Τοῦ γὰρ καὶ γένος ἐσμέν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/028.yaml
  text: For in him we live and move and exist, as even some of your own poets have said, ‘For we also are his offspring.’
translation:
  language: zh_hans
  text: 因为我们在他里面生活、行动、存在，正如你们中间也有些诗人说过：“我们也是他的后裔。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν αὐτῷ
  choice: 在他里面
  rationale: 保留希腊文的空间性隐喻及其神学张力，不将其弱化为“靠着他”。
- source_word: ζῶμεν καὶ κινούμεθα καὶ ἐσμέν
  choice: 生活、行动、存在
  rationale: 对应三个并列动词，保留递进与节奏；将 ἐσμέν 译为“存在”，以区别于前面的“生活”，并表达本体性的存有。
- source_word: τῶν καθ’ ὑμᾶς ποιητῶν
  choice: 你们中间……诗人
  rationale: 自然表达这些诗人与听众所属文化群体的关系，同时避免把 καθ’ ὑμᾶς 过度限定为私人归属。
- source_word: γένος
  choice: 后裔
  rationale: 在引诗语境中自然表达出自同一源头或族类的含义；不采用可能暗示生物学亲子关系的“儿女”。
theological_decisions:
- issue: “在他里面”与人的生存依赖
  choice: 直译为“在他里面”，保留范围、关系和依存等多重可能含义
  alternative: 靠着他
  rationale: 原文 ἐν αὐτῷ 的表达比单纯工具性或因果性更宽，不宜在译文中提前消解。
- issue: “他的后裔”是否等同于救赎性儿女身份
  choice: 采用“后裔”
  alternative: 儿女
  rationale: 此处引用异教诗人的话来说明人类与创造主的关系，并不必然断言特定的救赎或收养身份；“后裔”较能保留原文 γένος 的宽度。
translation_notes:
  register: 采用现代、庄重而易懂的普通话；三个动词用顿号排列，保留希腊文简洁而有力的节奏。引语使用中文全角标点，不增设原文没有的脚注。
