  yaml_path: translation/nt/acts/017/009.yaml
  text: And after taking security from Jason and the others[a], they released them.
translation:
  language: zh_hans
  text: 城里的官长从耶孙和其余的人那里收取了足够的担保[a]，就把这些人释放了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“足额”。这里很可能指为保证行为安宁守法而交付的法律担保或保证。
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβόντες
  choice: 收取了……就
  rationale: 不定过去时分词表示先于主句动作发生的行动；用“收取了……就”自然呈现先后次序。
- source_word: τὸ ἱκανὸν
  choice: 足额的保金
  rationale: 此语在当前司法语境中很可能指为确保守法或和平行为而提供的足够担保；“保金”保留其法律、财务性质，“足额”对应定冠词中性形容词实体化表达的“足够之物”。
- source_word: παρὰ τοῦ Ἰάσονος καὶ τῶν λοιπῶν
  choice: 从耶孙和其余的人那里
  rationale: παρά加属格表示来源；“其余的人”忠实表达 λοιποί，指同一事件中与耶孙一起被扣留的其他人。
- source_word: ἀπέλυσαν
  choice: 释放了
  rationale: 在司法或市政处置的语境中，ἀπολύω意为放走、释放；“释放”庄重自然，也符合上下文。
- source_word: αὐτούς
  choice: 他们
  rationale: 复数宾格代词回指耶孙和其余被扣留的人；现代汉语用“他们”即可清楚表达。
