  text: τοὺς μὲν οὖν χρόνους τῆς ἀγνοίας ὑπεριδὼν ὁ θεὸς τὰ νῦν ⸀παραγγέλλει τοῖς ἀνθρώποις ⸀πάντας πανταχοῦ μετανοεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/030.yaml
  text: Therefore[a], having overlooked the times of ignorance, God now commands all people everywhere to repent[b],
translation:
  language: zh_hans
  text: 所以，上帝从前不追究[a]无知的时代，如今却吩咐所有的人[b]，无论在哪里，都要悔改。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不追究”也可译作“忽略”或“越过”。这里的意思是，上帝从前容忍那些无知的时代，并非认可它们。
    reason: lexical_alternative
  - marker: b
    text: 原文“人”在这里泛指人类，并不限于男性。
    reason: lexical_alternative
lexical_decisions:
- source_word: τοὺς μὲν οὖν χρόνους
  choice: 所以……那……时代……如今却
  rationale: “所以”承接上文；μὲν与τὰ νῦν形成从前与如今的温和对比，用“如今却”在现代汉语中自然呈现这一转折。
- source_word: τῆς ἀγνοίας
  choice: 无知的
  rationale: 保留“无知”这一概括性表达，不在正文中增添“对上帝”的解释。
- source_word: ὑπεριδὼν
  choice: 从前不追究
  rationale: 表达上帝对以往时代暂未施行追究的含义，同时避免让人误以为上帝认可或赞同当时的罪。
- source_word: ὁ θεὸς
  choice: 上帝
  rationale: 直接译出主语，采用现代标准普通话中庄重而通行的称呼。
- source_word: τὰ νῦν
  choice: 如今却
  rationale: 突出当前与以往时代的对比，并与汉语句式自然衔接。
- source_word: παραγγέλλει
  choice: 吩咐
  rationale: 保留带有权威的命令意味；“吩咐”庄重自然，适合上帝向人发出的要求。
- source_word: τοῖς ἀνθρώποις πάντας πανταχοῦ
  choice: 各处所有的人
  rationale: 同时保留对象、全体范围和地域范围；“人”在此泛指全人类，并不限于男性。
- source_word: μετανοεῖν
  choice: 悔改
  rationale: “悔改”是现代汉语中对该词的标准表达，兼顾思想、态度和生命方向的转变，而不把含义缩减为单纯改变想法。
theological_decisions:
- issue: 上帝从前如何对待“无知的时代”
  choice: 译作“不追究”，表示上帝从前暂未施行追究，并非认可那些行为。
  alternative: 忽略；宽容；置之不理
  rationale: ὑπεριδών保留了上帝暂且越过、容忍而未立即追究的张力；随后的普世悔改命令表明这并不是道德上的赞同或完全免罪。
- issue: 悔改命令的范围
  choice: “各处所有的人”，指向全人类。
  alternative: 各处所有男人；各地所有外族人
  rationale: τοῖς ἀνθρώποις πάντας πανταχοῦ具有普遍范围，既不局限于男性，也不应无明文依据地限于外族人。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“从前……如今却……”清楚呈现经文的救赎历史对比；“不追究”避免“忽略”可能带来的冷漠或认可之意，同时不把正文扩写成神学解释。
