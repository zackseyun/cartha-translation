  text: Διοδεύσαντες δὲ τὴν Ἀμφίπολιν καὶ ⸀τὴν Ἀπολλωνίαν ἦλθον εἰς Θεσσαλονίκην, ὅπου ⸀ἦν συναγωγὴ τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/001.yaml
  text: After passing through Amphipolis and Apollonia[a], they came to Thessalonica[b], where there was a synagogue of the Jews.
translation:
  language: zh_hans
  text: 他们经过暗妃波里和亚波罗尼亚，来到帖撒罗尼迦；那里有一座犹太人的会堂。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διοδεύσαντες
  choice: 经过
  rationale: 该词为不定过去时主动分词，表示先于主要动词“来到”发生的行动。汉语以“经过……来到……”自然地表达先后关系，也保留途经这些城市的含义。
- source_word: δὲ
  choice: 不另译
  rationale: 此处是轻微的叙事连接词，并无明显转折；汉语连续叙事无需添加“但是”或“于是”。
- source_word: Ἀμφίπολιν
  choice: 暗妃波里
  rationale: 按现代中文圣经地名的通行音译处理。
- source_word: Ἀπολλωνίαν
  choice: 亚波罗尼亚
  rationale: 按现代中文圣经地名的通行音译处理。
- source_word: ἦλθον
  choice: 他们……来到
  rationale: 该词是不定过去时直陈语气第三人称复数。译作“来到”直接表达向目的地移动；“他们”补出希腊语动词中包含的复数主语信息。
- source_word: εἰς Θεσσαλονίκην
  choice: 来到帖撒罗尼迦
  rationale: εἰς与城名连用表示移动的目的地；“来到”符合现代汉语叙事习惯。
- source_word: ὅπου
  choice: 那里
  rationale: 以地点指示语引出后续处所分句，比直译为“在那个地方”更自然。
- source_word: συναγωγὴ
  choice: 一座……会堂
  rationale: 原文名词前无冠词；“一座”自然表达当地有一处会堂，同时不把它限定为唯一或特指的会堂。
- source_word: τῶν Ἰουδαίων
  choice: 犹太人的
  rationale: 属格短语表示该会堂与当地犹太群体的归属或关联；此处不是专指犹太地区的居民。
theological_decisions:
- issue: 叙事语境中Ἰουδαίων的表达
  choice: 犹太人的
  alternative: 犹太民族的；犹太地人的
  rationale: 上下文指帖撒罗尼迦当地与会堂相关的犹太群体。“犹太地人的”会造成地域误解，“犹太民族的”则比原句在此处所表达的范围更宽。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语体；以“经过……来到……”紧凑呈现分词与主要动词的关系，不增添原文未说明的停留活动，也不点明原文仅以复数动词表示的具体人物姓名。
