source:
  edition: SBLGNT
  text: ὁ θεὸς ὁ ποιήσας τὸν κόσμον καὶ πάντα τὰ ἐν αὐτῷ, οὗτος οὐρανοῦ καὶ γῆς ⸂ὑπάρχων κύριος⸃ οὐκ ἐν χειροποιήτοις ναοῖς κατοικεῖ
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/024.yaml
  text: The God who made the world and everything in it[a], being Lord of heaven and earth, does not dwell in temples made by hands.
translation:
  language: zh_hans
  text: 那创造了世界和其中万物的神，身为天地的主，不住在人手所造的庙宇[a]里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人手所造的”也可译作“用手造的”，指人建造的庙宇。
    reason: 说明χειροποιήτοις的字面形象和实际所指。
lexical_decisions:
- source_word: ποιήσας
  choice: 创造
  rationale: 该不定过去时分词修饰“神”；译为“创造”既自然，也准确表达神使世界及其中万物存在的行动。
- source_word: κόσμον
  choice: 世界
  rationale: 此处指受造界整体；“世界”是现代汉语中自然、涵盖面也足够广的表达。
- source_word: πάντα τὰ ἐν αὐτῷ
  choice: 其中万物
  rationale: 保留πάντα的全面性，并以简洁自然的汉语说明世界内的一切。
- source_word: ὑπάρχων κύριος
  choice: 身为……的主
  rationale: ὑπάρχων表达既有身份或状态；“身为”保留分词结构，不将其明确解释为原因。
- source_word: οὐρανοῦ καὶ γῆς
  choice: 天地
  rationale: “天地”是汉语中概括天与地的庄重而自然的固定表达。
- source_word: χειροποιήτοις
  choice: 人手所造的
  rationale: 该词指由人的手制成；此译法保留原文“手造”的形象，同时明确建造者是人。
- source_word: ναοῖς
  choice: 殿宇
  rationale: ναός指作为神明居所的庙殿或圣所；“殿宇”适合当时多神庙背景，也避免把范围不必要地限于某一种宗教建筑。
- source_word: κατοικεῖ
  choice: 住
  rationale: κατοικέω意为居住、安居；“住”是清楚自然的现代汉语，并保留神不居于人造庙殿这一直接陈述。
theological_decisions:
- issue: 神的超越性与圣殿中的居住
  choice: 直译为神“不住在人手所造的殿宇里”
  alternative: 意译为神“不受任何殿宇限制”
  rationale: 原文直接否定创造天地的主居住在人造庙殿中，却没有在本节明确展开“限制”的概念；采用直接陈述可避免添加超出原文的神学解释。
- issue: ὑπάρχων分词与主句的逻辑关系
  choice: 译作“身为天地的主”
  alternative: 译作“既然是天地的主”
  rationale: 希腊文分词可在语境中带有原因意味，但形式本身没有明确标出因果；“身为”保留这种潜在联系而不将其锁定为因果关系。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。“其中万物”“天地的主”保持经文气韵；“殿宇”兼顾雅正与雅典宗教场景。脚注标记置于其所解释的“人手所造的殿宇”之后。
