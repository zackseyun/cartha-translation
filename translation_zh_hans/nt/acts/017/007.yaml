  text: οὓς ὑποδέδεκται Ἰάσων· καὶ οὗτοι πάντες ἀπέναντι τῶν δογμάτων Καίσαρος πράσσουσι, βασιλέα ⸂ἕτερον λέγοντες⸃ εἶναι Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/007.yaml
  text: These men[a], whom Jason has welcomed, are all acting against Caesar’s decrees[c][b], saying that there is another king—Jesus.
translation:
  language: zh_hans
  text: 耶孙接待了这些人[a]；他们全都违背凯撒的法令[b]行事，说另有一位王[c]，就是耶稣。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“收留了”或“接纳了”。原文动词可指接待客人、给予款待。
    reason: lexical_alternative
  - marker: b
    text: 或译：“谕令”。原文所指的是官方颁布的决定或条例。
    reason: lexical_alternative
  - marker: c
    text: 也可译作：“不同的一位王。”原文说的是“另一位王”，将耶稣呈现为凯撒以外的王权宣称，因此带有竞争王权的控告意味。
    reason: alternative_reading
lexical_decisions:
- source_word: ὑποδέδεκται
  choice: 接待了
  rationale: 该动词可指接纳客人、给予款待；完成时表明耶孙已经接待他们，而这一行动仍构成当前控告他的依据。“接待了”自然、准确，也不额外补入原文未明说的地点。
- source_word: ἀπέναντι
  choice: 违背
  rationale: 该词与属格连用，在这里表示与权威命令相抵触。“违背”符合控告语境，并比“反对”更清楚地表达违反法令的意思。
- source_word: δογμάτων
  choice: 法令
  rationale: 在罗马政治语境中，该词指官方颁布的决定、谕令或条例。“法令”庄重而通俗，适合现代汉语。
- source_word: πράσσουσι
  choice: 行事
  rationale: 现在时描写这些人被指控的一贯或正在持续的行为。“行事”与“违背……法令”搭配自然，同时保留动词的行动意味。
- source_word: βασιλέα ἕτερον
  choice: 另有一位王
  rationale: βασιλεύς明确是“王”，ἕτερον指出另一位有别于凯撒的王权宣称。“另有一位王”既自然，也保留控告中的政治对立意味。
- source_word: λέγοντες
  choice: 说
  rationale: 该分词说明他们被控以何种方式违背法令，即宣称另有一位王。“说”保持原文中性的陈述力度，不擅自加强为“煽动”或削弱为“认为”。
- source_word: εἶναι Ἰησοῦν
  choice: 就是耶稣
  rationale: 原文以“耶稣”置于句末，明确指出所谓另一位王是谁。“就是耶稣”符合现代汉语，并保留句末辨明身份的强调。
- source_word: οὗτοι πάντες
  choice: 他们全都
  rationale: 该短语把控告扩大到所指的全部人。“他们全都”在承接前句“这些人”时自然，并保留 πάντες 的概括性强调。
theological_decisions:
- issue: 称耶稣为“王”所带有的政治性控告
  choice: 直译为“另有一位王，就是耶稣”，保留其与凯撒权威相冲突的表面政治含义。
  alternative: 将“王”弱化为“领袖”或“统治者”，或把王权明确限定为纯属灵意义。
  rationale: 原文把这项指控直接联系到凯撒的法令，并明确使用 βασιλεύς（王）。译文不应消除政治与神学之间的张力，也不应替叙述者判定控告的全部含义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。分号保留原句中耶孙的接待行为与众人所受政治控告之间的紧密联系；末尾“就是耶稣”保留原文句末揭示身份的强调。
