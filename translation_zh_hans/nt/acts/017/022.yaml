  text: Σταθεὶς ⸀δὲ Παῦλος ἐν μέσῳ τοῦ Ἀρείου Πάγου ἔφη· Ἄνδρες Ἀθηναῖοι, κατὰ πάντα ὡς δεισιδαιμονεστέρους ὑμᾶς θεωρῶ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/022.yaml
  text: So Paul[a], standing in the midst of the Areopagus, said, “Men of Athens, I see that in every way you are very religious.”
translation:
  language: zh_hans
  text: 保罗就站在亚略巴古中间，说：“雅典的各位男士，我看你们在各方面都格外敬畏神明[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“太迷信”，也可译“比别人更敬畏神明”。原文用词可带贬义，也可带正面意味。
    reason: 保留δεισιδαιμονεστέρους可作贬义“迷信”、相对正面“敬畏神明”，以及比较级可作真正比较或强调程度的歧义。
lexical_decisions:
- source_word: Σταθεὶς
  choice: 站在
  rationale: 该不定过去时分词在此交代保罗发言时的姿态和场景；译为“站在”自然简洁，不对其体貌作过度展开。
- source_word: δὲ
  choice: 于是
  rationale: δέ在此是较弱的叙事衔接词；“于是”符合现代汉语的行文节奏，又不赋予原文过强的转折意味。
- source_word: ἐν μέσῳ τοῦ Ἀρείου Πάγου
  choice: 在亚略巴古当中
  rationale: 保留原文的空间表述“在……当中”，避免直接解释为“在议会面前”，因为“亚略巴古”既可能让人想到地点，也可能让人想到相关议事机构。
- source_word: Ἀρείου Πάγου
  choice: 亚略巴古
  rationale: 按希腊名称音译，避免采用源自罗马文化对应称谓的“马尔斯山”；“亚略巴古”也兼容地点与机构的语境联想。
- source_word: ἔφη
  choice: 说
  rationale: φημί的未完成时在这里用作一般的引语引介；现代汉语以“说”最自然。
- source_word: Ἄνδρες Ἀθηναῖοι
  choice: 雅典的各位男士
  rationale: 既表达正式呼语，也保留ἄνδρες明确的男性所指；比生硬的“雅典男人们”更符合庄重、自然的现代汉语。
- source_word: κατὰ πάντα
  choice: 在各方面
  rationale: 准确表达该短语广泛、逐项涵盖的范围，且符合现代汉语习惯。
- source_word: ὡς
  choice: （融入“我看你们……”的宾语结构）
  rationale: ὡς在此引出保罗观察所得的内容；汉语无需另加对应虚词，直接接宾语分句最为自然。
- source_word: δεισιδαιμονεστέρους
  choice: 格外敬畏神明
  rationale: 该比较级可指格外虔敬，也可能含“迷信”的贬义。“格外敬畏神明”在正文中保留保罗开场时较策略、未明说褒贬的语气；其他可能含义收入脚注。
- source_word: θεωρῶ
  choice: 我看
  rationale: θεωρέω在此表示通过观察而作出的判断；“我看”简洁自然，也适合公开演说的语体。
theological_decisions:
- issue: 保罗以δεισιδαιμονεστέρους描述雅典人宗教态度时的褒贬语气
  choice: 正文译为相对中性、略带正面色彩的“格外敬畏神明”
  alternative: “太迷信”或“比别人更敬畏神明”
  rationale: 这个希腊词在语义上可褒可贬，且比较级既可能表达程度很高，也可能保留真正的比较意味。上下文中的开场辞可能具有修辞上的策略性，因此正文不武断地定为贬义，并用脚注保存其他读法。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“雅典的各位男士”保留正式男性呼语；“亚略巴古”采用音译；整体维持公开演说开场的简洁和礼貌，同时由脚注保存关键词的语义张力。
