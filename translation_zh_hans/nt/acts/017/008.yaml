lexical_decisions:
- source_word: ἐτάραξαν
  choice: 使……受到扰动
  rationale: ταράσσω表示使人不安、受搅扰或引发社会性的骚动。“受到扰动”既可涵盖群众的骚动，也可涵盖官员的不安，而不把程度说得过重。
- source_word: δὲ
  choice: 就
  rationale: δὲ在此是较弱的叙事连接词；结合分词短语译成“听见……就……”，使现代汉语自然流畅。
- source_word: ὄχλον
  choice: 众人
  rationale: ὄχλος指聚集的人群。“众人”自然且中性，不额外加入“暴民”所含的敌意。
- source_word: πολιτάρχας
  choice: 城里的官员
  rationale: πολιτάρχης是马其顿地方行政长官的称号。“城里的官员”让现代读者易懂，同时以脚注说明其特定历史称谓。
- source_word: ἀκούοντας ταῦτα
  choice: 听见这些话
  rationale: 现在分词ἀκούοντας同时修饰“众人”和“官员”，译作时间背景；ταῦτα为复数，在本语境中“这些话”比机械的“这些事”更自然，所指是刚才听到的指控。
