  text: 保罗就这样从他们中间离开了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“于是，保罗从他们中间离开了。”
    reason: 保留οὕτως可按上下文译作“于是”的叙事连接用法。
lexical_decisions:
- source_word: οὕτως
  choice: 于是
  rationale: 此处承接前文并结束保罗在亚略巴古的发言场景；“于是”自然地表达叙事推进及由此而来的结果，同时不把连接关系说得过强。
- source_word: ὁ Παῦλος
  choice: 保罗
  rationale: 采用现代中文圣经及基督教语境中通行的人名译法。
- source_word: ἐξῆλθεν
  choice: 离开了
  rationale: ἐξέρχομαι在此指从一群人当中出去、离去；“离开了”符合现代汉语叙事习惯，并与后面的“从他们中间”自然搭配。
- source_word: ἐκ μέσου αὐτῶν
  choice: 从他们中间
  rationale: 保留原文“从……中间”的空间和群体意味，表明保罗离开当时聚集的听众。
