id: ACT.17.5
reference: Acts 17:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ⸂ζηλώσαντες δὲ οἱ Ἰουδαῖοι καὶ προσλαβόμενοι⸃ τῶν ἀγοραίων ⸂ἄνδρας τινὰς⸃ πονηροὺς καὶ ὀχλοποιήσαντες ἐθορύβουν τὴν πόλιν, ⸂καὶ ἐπιστάντες⸃ τῇ οἰκίᾳ Ἰάσονος ἐζήτουν αὐτοὺς ⸀προαγαγεῖν εἰς τὸν δῆμον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/005.yaml
  text: But the Jews[a], becoming jealous and taking along some wicked men from the marketplace, formed a mob and were throwing the city into an uproar; and coming to Jason’s house, they were seeking to bring them out to the assembly.
translation:
  language: zh_hans
  text: 但那些犹太人[a]因嫉妒，就拉拢了广场上一些恶人，聚众闹事，搅乱了全城。他们来到耶孙家，想把他们带出来，带到民众大会[b]面前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里指帖撒罗尼迦那些反对保罗和西拉的犹太人，并非泛指所有犹太人。
    reason: 语境澄清，防止把特定叙事中的群体泛化。
  - marker: b
    text: 或译“带到民众面前”。希腊文 δῆμος 指公开聚集的公民群体或民众大会，并非泛指一群人。
    reason: 保留该词可能兼具公众和公民大会含义的词汇歧义。
lexical_decisions:
- source_word: ζηλώσαντες
  choice: 起了嫉妒
  rationale: 将不定过去时分词理解为引发后续行动的动机；“起了嫉妒”自然表达其起始意味。
- source_word: οἱ Ἰουδαῖοι
  choice: 犹太人
  rationale: 按希腊原文直译，不擅自缩小为“犹太领袖”；上下文表明所指是帖撒罗尼迦犹太人中的一部分。
- source_word: προσλαβόμενοι
  choice: 拉拢了
  rationale: 该中动态分词表示把人招到自己一边；“拉拢”符合敌对行动的语境，又不必推断为正式雇用。
- source_word: τῶν ἀγοραίων
  choice: 广场上
  rationale: ἀγοραῖος 指与市集或公共广场有关的人；此处译作“广场上”简明自然，避免增添“游手好闲”等原文未明说的判断。
- source_word: ἄνδρας τινὰς πονηρούς
  choice: 一些恶人
  rationale: 保留 τινάς 的不定性及 πονηρούς 的负面道德评价；汉语“人”在此可自然涵盖原文所指的男性。
- source_word: ὀχλοποιήσαντες
  choice: 聚众闹事
  rationale: 该词是“聚成群众”，语境带有暴乱和滋事意味；“聚众闹事”比中性的“聚集群众”更贴合上下文。
- source_word: ἐθορύβουν τὴν πόλιν
  choice: 使全城陷入骚乱
  rationale: 未完成时表示持续造成扰乱；这一译法保留动作的进行性和 θορυβέω 的强烈程度。
- source_word: ἐπιστάντες τῇ οἰκίᾳ Ἰάσονος
  choice: 来到耶孙家
  rationale: ἐφίστημι 在此可表示来到或突然临到；不译作“袭击”，以免加入词义本身未必包含的暴力程度。
- source_word: ἐζήτουν
  choice: 想
  rationale: 结合不定式表达他们试图达到的目的；中文“想……带出来”自然传达持续寻求或企图之意。
- source_word: αὐτοὺς
  choice: 保罗和西拉
  rationale: 代词所指由上文明确为保罗和西拉；汉语补明所指可避免与紧邻的耶孙等人混淆。
- source_word: προαγαγεῖν
  choice: 带出来
  rationale: 保留从屋内带出并带到公众面前的方向意味。
- source_word: εἰς τὸν δῆμον
  choice: 交给民众大会
  rationale: δῆμος 在此不是泛指一群人，而是公开聚集的公民群体或民众大会；“交给”自然表达带到其面前处置的意图。
theological_decisions:
- issue: 冲突叙事中 οἱ Ἰουδαῖοι 的范围
  choice: 犹太人，并加脚注说明语境范围
  alternative: 犹太领袖；犹太地人
  rationale: 原文没有“领袖”一词，不应在正文中擅自缩小；同时脚注澄清这是当地反对使徒的一部分犹太人，避免将叙事中的特定群体泛化为所有犹太人。
- issue: αὐτοὺς 的指代
  choice: 正文明确为“保罗和西拉”
  alternative: 他们
  rationale: 原文使用代词，所指由上下文可辨；中文若只写“他们”，容易误指刚出现的恶人或耶孙家的人，因此补明指代而不改变事件内容。
- issue: δῆμος 的公共政治含义
  choice: 民众大会
  alternative: 民众；公众面前
  rationale: 保留其公共、公民集会层面的含义，不把它弱化为普通人群，也不进一步断定为具有特定法律权限的正式法庭。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“聚众闹事”“陷入骚乱”传达连续升级的公共扰乱；“耶孙”沿用现代中文圣经常见人名译法。正文中的[a]、[b]均与脚注对应。
