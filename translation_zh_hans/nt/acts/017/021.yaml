  text: All the Athenians and the foreigners staying there would spend their time in nothing else than telling or hearing something newer[a].
translation:
  language: zh_hans
  text: 雅典人和住在那里的外来人全都只把时间花在谈论或听说一些更新奇的事上[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一些新鲜事。”希腊文用的是比较级“更新的”，可能表达他们不断追逐最新奇事物的心态。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀθηναῖοι δὲ πάντες
  choice: 所有雅典人
  rationale: πάντες明确表达全称；δὲ在这里是轻微的转折或补充性连接，中文若硬译“而/不过”会显得突兀，因此依上下文关系不另加显性连接词。
- source_word: οἱ ἐπιδημοῦντες ξένοι
  choice: 住在那里的外乡人
  rationale: ἐπιδημοῦντες指当时身处或旅居当地，并不必然表示永久定居；“住在那里的”自然保留其当地停留之意，ξένοι译为“外乡人”。
- source_word: εἰς οὐδὲν ἕτερον ηὐκαίρουν
  choice: 除了……以外，什么事都不肯花时间去做
  rationale: 该结构表示他们不把闲暇或时间用于其他任何事；未完成时体现惯常状态。“不肯花时间”在现代汉语中自然表达其专注于此的语用意味，但不将其强化为绝对能力上的不能。
- source_word: λέγειν τι ἢ ἀκούειν
  choice: 谈论或听闻一些……的事
  rationale: 保留两个并列不定式“说”和“听”的对称关系；“谈论”比孤立的“说”更符合此处交换消息或观念的语境，“听闻”则自然承接所听到的新事。
- source_word: τι καινότερον
  choice: 一些更新奇的事
  rationale: 保留καινότερον的比较级形式，而非直接弱化为“新事”；“更新奇”既表达相较于此前所闻之事更为新近、新颖，也符合中文对新奇消息的自然说法。
