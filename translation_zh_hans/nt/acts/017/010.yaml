id: ACT.17.10
reference: Acts 17:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Οἱ δὲ ἀδελφοὶ εὐθέως ⸀διὰ νυκτὸς ἐξέπεμψαν τόν τε Παῦλον καὶ τὸν Σιλᾶν εἰς Βέροιαν, οἵτινες παραγενόμενοι εἰς τὴν συναγωγὴν ⸂τῶν Ἰουδαίων ἀπῄεσαν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/010.yaml
  text: Then the brothers immediately sent both Paul and Silas away by night to Berea[a], and when they arrived[c][b], they went into the synagogue of the Jews.
translation:
  language: zh_hans
  text: 弟兄们[a]立即趁夜[b]把保罗和西拉二人送往庇哩亚。他们到了那里，就进了犹太人的会堂[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“弟兄姊妹们”；希腊文直译“弟兄们”，也可泛指较广的信徒群体。
    reason: lexical_alternative
  - marker: b
    text: 或译“在夜间”。
    reason: lexical_alternative
  - marker: c
    text: 或译“犹太会堂”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδελφοὶ
  choice: 弟兄们
  rationale: 保留希腊文阳性复数及信仰群体中的亲属式称呼；此词在具体语境中也可能泛指包括女性在内的信徒群体，故以脚注说明。
- source_word: εὐθέως
  choice: 立即
  rationale: 准确传达行动迅速、没有耽搁的含义，也符合现代汉语叙事习惯。
- source_word: διὰ νυκτός
  choice: 趁夜
  rationale: 表达行动发生在夜间，并自然带出借夜色启程的语境；“夜间”也是可行的较中性译法。
- source_word: ἐξέπεμψαν
  choice: 送往
  rationale: 结合目的地“庇哩亚”表达把二人送离原地并前往另一地点；比单纯“打发”更自然且不带贬义。
- source_word: τόν τε Παῦλον καὶ τὸν Σιλᾶν
  choice: 保罗和西拉二人
  rationale: 用“二人”体现 τε…καί 将两人并列合举的作用，同时保持中文自然。
- source_word: Βέροιαν
  choice: 庇哩亚
  rationale: 采用中文圣经传统中较为通行、易于识别的地名译法。
- source_word: οἵτινες παραγενόμενοι
  choice: 他们到了那里
  rationale: 将关系代词与时间性分词按自然汉语拆成续述句，清楚保留抵达后才采取下一行动的时序。
- source_word: συναγωγὴν τῶν Ἰουδαίων
  choice: 犹太人的会堂
  rationale: 直接呈现属格结构，指庇哩亚当地犹太群体的会堂，不含贬义或神学评断。
- source_word: ἀπῄεσαν
  choice: 就进了
  rationale: 与带方向意义的 εἰς 及“会堂”搭配，译作“进了”最合乎汉语；“就”自然体现抵达后的紧接行动。
theological_decisions:
- issue: ἀδελφοὶ 在可能包含男女的信徒群体中如何表达
  choice: 正文译作“弟兄们”
  alternative: “弟兄姊妹们”或“信徒们”
  rationale: 正文保留原文阳性复数和亲属式群体称谓，不直接扩展原词形式；同时用脚注保留其可能泛指更广信徒群体的语用范围。
- issue: τῶν Ἰουδαίων 的表达
  choice: “犹太人的”
  alternative: “犹太会堂”
  rationale: 透明保留原文属格关系；这里是在辨明当地会堂所属的群体，并非对犹太人作神学评价。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“趁夜”简洁地表达夜间行动，“到了那里，就进了”使希腊文分词结构在汉语中自然顺畅。所有脚注标记均置于正文相应词语之后。
