reference: Acts 17:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: τινὲς δὲ καὶ τῶν Ἐπικουρείων ⸀καὶ Στοϊκῶν φιλοσόφων συνέβαλλον αὐτῷ, καί τινες ἔλεγον· Τί ἂν θέλοι ὁ σπερμολόγος οὗτος λέγειν; οἱ δέ· Ξένων δαιμονίων δοκεῖ καταγγελεὺς εἶναι· ὅτι τὸν Ἰησοῦν καὶ τὴν ἀνάστασιν εὐηγγελίζετο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/018.yaml
  text: Some of the Epicurean and Stoic philosophers also engaged with him[a], and some were saying, “What is this babbler trying to say?” But others said[d][c][b], “He seems to be a proclaimer of foreign deities,” because he was proclaiming the good news about Jesus and the resurrection.
translation:
  language: zh_hans
  text: 还有一些伊壁鸠鲁派和斯多葛派的哲学家同他交谈、辩论[a]。有些人说：“这个拾人牙慧的家伙[b]究竟想说什么？”另一些人却说：“他似乎是在宣扬外来的神明[c][d]。”这是因为保罗在传扬关于耶稣和复活的福音。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“同他讨论”或“同他争辩”；希腊语动词既可指交谈讨论，也可指争论。
    reason: lexical_alternative
  - marker: b
    text: 原文是一个贬义词，字面与“捡种子的”有关，用来讥讽那些搜集、转述零碎见闻或观念的人。
    reason: cultural_note
  - marker: c
    text: “外来的神明”也可译作“陌生的神”或“外来的鬼神”。这里说话的人是按当时异教观念所理解的神性存在，并不一定指基督教语境中的邪灵。
    reason: alternative_reading
  - marker: d
    text: 有些解释认为，雅典人听见保罗宣讲“耶稣和复活”时，可能误以为“复活”是另一位神明。
    reason: alternative_reading
lexical_decisions:
- source_word: συνέβαλλον αὐτῷ
  choice: 同他交谈辩论
  rationale: 该动词在此可指讨论、交谈或争辩；“交谈辩论”既体现哲学讨论的互动性，也不把语气限定为纯粹敌对的争执。
- source_word: σπερμολόγος
  choice: 拾人牙慧的家伙
  rationale: 原词字面与“捡种子的”有关，在此是贬称，讥讽某人东拼西凑、转述零碎观念。“拾人牙慧的家伙”在现代汉语中自然地传达这种轻蔑意味。
- source_word: Τί ἂν θέλοι ... λέγειν
  choice: 究竟想说什么
  rationale: ἄν加愿望式带有揣测意味，在此语境中也含不屑；“究竟想说什么”是自然汉语，并保留说话者的质疑语气。
- source_word: Ξένων δαιμονίων
  choice: 外来的神明
  rationale: 在雅典异教徒的言语框架中，δαιμόνια指神性存在，不宜直接套用后来基督教语境中的“邪灵”；“神明”可自然表达其所理解的陌生神祇。
- source_word: καταγγελεὺς
  choice: 宣扬
  rationale: 原词指公开宣告的人。汉语以“是在宣扬……”表达谓语结构，比名词性“宣扬者”更自然，同时保留公开传布之意。
- source_word: εὐηγγελίζετο
  choice: 在传扬……的福音
  rationale: 该动词明确含有宣告好消息之意；“传扬……的福音”保留其福音性含义，而不弱化为泛指的讲论。
- source_word: ἀνάστασιν
  choice: 复活
  rationale: 此处按路加的叙述指保罗信息的内容，译作普通名词“复活”，不在正文中预先判定雅典人是否将其误听为神名。
- source_word: Ἐπικουρείων καὶ Στοϊκῶν φιλοσόφων
  choice: 伊壁鸠鲁派和斯多葛派的哲学家
  rationale: 采用现代汉语通行的哲学流派名称，清楚保留原文所指的两个学派。
theological_decisions:
- issue: 异教言语语境中δαιμόνια的译法
  choice: 外来的神明
  alternative: 外来的鬼神；陌生的神；外来的邪灵
  rationale: 这句话报道雅典人按自身宗教范畴作出的判断。“神明”避免把基督教语境中邪恶灵体的含义强加于他们，同时脚注保留词义范围。
- issue: 是否将ἀνάστασις按人格化神名处理
  choice: 复活
  alternative: “复活”女神或名为“复活”的神明
  rationale: 原文的解释句首先陈述保罗所传信息的内容，并未明说“复活”是神名；正文保留普通名词，脚注说明雅典人可能产生的误解。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“拾人牙慧的家伙”保留原话的轻蔑语气；“交谈辩论”维持原动词介于讨论与争辩之间的语义张力。脚注标记均置于与其解释直接相关的位置。
