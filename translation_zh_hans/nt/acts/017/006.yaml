  text: μὴ εὑρόντες δὲ αὐτοὺς ⸀ἔσυρον Ἰάσονα καί τινας ἀδελφοὺς ἐπὶ τοὺς πολιτάρχας, βοῶντες ὅτι Οἱ τὴν οἰκουμένην ἀναστατώσαντες οὗτοι καὶ ἐνθάδε πάρεισιν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/006.yaml
  text: But when they did not find them[a], they dragged Jason and some brothers before the city authorities, shouting[c][b], “These men who have turned the world upside down have come here also,”
translation:
  language: zh_hans
  text: 可是，他们没有找到保罗和西拉，就把耶孙和几位弟兄[a]拖到城里的官长[b]面前，高喊：“这些搅乱天下[c]的人，也来到这里了！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄”在这里指同信徒；按具体语境，这一群体也可能包括女性。
    reason: lexical_alternative
  - marker: b
    text: 原文所用的称号是“政治官”（politarch），是马其顿地区城市官员的地方称号。
    reason: cultural_note
  - marker: c
    text: 或译“有人居住的世界”；这里可指当时人所知的文明世界，通常尤指罗马世界。
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ εὑρόντες δὲ αὐτοὺς
  choice: 可是，他们找不到保罗和西拉
  rationale: 不定过去时分词说明先于主句动作发生的情形；“找不到”自然传达搜寻未果。代词按上文所指明译为“保罗和西拉”，避免现代中文指代不清。
- source_word: ἔσυρον
  choice: 拖到
  rationale: σύρω含强行拖拉之意；“拖到”保留了动作的强制性和粗暴感。
- source_word: τινας ἀδελφοὺς
  choice: 几位弟兄
  rationale: ἀδελφοί在此指基督徒群体中的同信者；正文保留其字面称谓，同时以脚注说明语境含义及可能涵盖的范围。
- source_word: ἐπὶ τοὺς πολιτάρχας
  choice: 到城里的官长面前
  rationale: πολιτάρχης是马其顿地方城市官员的特定称号；功能性译法使现代读者易懂，脚注保留其地方制度背景。
- source_word: βοῶντες
  choice: 高喊
  rationale: 该分词描写大声公开呼叫；“高喊”简洁地保留声音强度，并与主句同时进行。
- source_word: οἱ τὴν οἰκουμένην ἀναστατώσαντες
  choice: 那些搅乱天下的人
  rationale: ἀναστατόω表示造成动乱、扰乱秩序；“搅乱天下”既有控告语气，也保留原文的强烈夸张。οἰκουμένη指有人居住的世界，语境中常指当时已知或罗马统治下的世界。
- source_word: οὗτοι καὶ ἐνθάδε πάρεισιν
  choice: 也到这里来了
  rationale: πάρειμι可表示已经来到并在场；“到这里来了”自然呈现到达和现身的意味，καί译作“也”。
theological_decisions: []
