  text: γένος οὖν ὑπάρχοντες τοῦ θεοῦ οὐκ ὀφείλομεν νομίζειν χρυσῷ ἢ ἀργύρῳ ἢ λίθῳ, χαράγματι τέχνης καὶ ἐνθυμήσεως ἀνθρώπου, τὸ θεῖον εἶναι ὅμοιον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/029.yaml
  text: Therefore[a], since we are God’s offspring, we ought not to think that the Divine Being is like gold or silver or stone[b], an image formed by human skill and imagination.
translation:
  language: zh_hans
  text: 所以，我们既是上帝的后裔，就不该以为神明[a]像用金、银或石头制成、出于人的技艺和构想的雕刻物[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“神性”“神本身”。希腊语 τὸ θεῖον 泛指神圣者或神性；在保罗这里的论证中，所指的是真神。
    reason: lexical_alternative
  - marker: b
    text: 或译“雕刻物”“镌刻出来的东西”。
    reason: lexical_alternative
lexical_decisions:
- source_word: γένος
  choice: 后裔
  rationale: 表达人与上帝之间的源出和亲属关系，承接上一节的引文；又避免“种族”所带来的族群含义。
- source_word: οὖν
  choice: 所以
  rationale: 清楚标明本节是根据前文作出的推论，且符合现代汉语表达。
- source_word: ὑπάρχοντες
  choice: 既是
  rationale: 该分词在语境中具有原因意味；“既是”自然表达“由于我们是”。
- source_word: τοῦ θεοῦ
  choice: 上帝的
  rationale: 自然表达属格关系，并与上下文所指的独一真神相符。
- source_word: οὐκ ὀφείλομεν
  choice: 不该
  rationale: 保留道德和理性上的应然意味，而不是仅表达禁止或没有义务。
- source_word: νομίζειν
  choice: 以为
  rationale: 简明自然地表达认定、设想之意。
- source_word: χρυσῷ ἢ ἀργύρῳ ἢ λίθῳ
  choice: 像金、银或石头
  rationale: 逐一保留原文所列的三种材料，并让后面的同位说明指出它们被制成偶像。
- source_word: χαράγματι
  choice: 雕刻出来的像
  rationale: 既表达雕刻、镌刻而成之物，也明确其在本语境中的形像或偶像性质。
- source_word: τέχνης
  choice: 技艺
  rationale: 表达制作工艺或技巧，与雕刻行为自然搭配。
- source_word: ἐνθυμήσεως
  choice: 构想
  rationale: 兼顾心中的思考、设计和想象，比单用“想象”更贴近制像过程。
- source_word: ἀνθρώπου
  choice: 人凭
  rationale: 将单数泛指自然处理为人类或人的活动，不限定为某一男性个体。
- source_word: τὸ θεῖον
  choice: 神明
  rationale: 保留该中性实词在哲学和宗教语境中的宽泛表达；在保罗论证中实际指向真神，但不把原词直接改写成较技术性的“神性”或较明确的“上帝”。
theological_decisions:
- issue: τὸ θεῖον 在一神论论证与希腊哲学式措辞之间的张力
  choice: 神明
  alternative: 神性；神本身；上帝
  rationale: “神明”在现代汉语中可指神圣者或神祇，能反映保罗面对雅典听众时采用的宽泛措辞；脚注说明此处在论证中指真神，避免正文把词义过早限定为抽象的“神性”或直接等同于专名“上帝”。
- issue: 人与上帝为 γένος 的含义
  choice: 上帝的后裔
  alternative: 上帝的族类；上帝的儿女
  rationale: “后裔”保留源出和亲属关系的修辞，却不把本节扩展为关于救赎性儿女身份的明确陈述。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“所以……既……就……”呈现推论关系；“也就是”使“金、银或石头”与后面的雕刻物说明自然衔接。所有脚注标记均已置于正文相应位置。
