    rationale: 希腊文在“有些人被说服并归附保罗和西拉”之后，以属格结构列出同样归附的“许多敬畏上帝的希腊人”和“不少显要妇女”。“此外，还有……”只表达存在或数量，未清楚表达他们也被说服并归附；补出“也如此”能在不增添额外神学含义的情况下保留原文句法关系。
  - severity: low
