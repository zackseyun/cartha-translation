  text: καί τινες ἐξ αὐτῶν ἐπείσθησαν καὶ προσεκληρώθησαν τῷ Παύλῳ καὶ τῷ Σιλᾷ, τῶν τε σεβομένων Ἑλλήνων ⸂πλῆθος πολὺ⸃ γυναικῶν τε τῶν πρώτων οὐκ ὀλίγαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/004.yaml
  text: And some of them were persuaded and joined Paul and Silas[a], along with a large number of the God-fearing Greeks and not a few of the leading women.
translation:
  language: zh_hans
  text: 他们中间有些人被说服，就归附了保罗和西拉[a]；又有大批敬畏上帝的希腊人和不少显要妇女也如此。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译为“被分派归给保罗和西拉”；此词带有“掣签分派”的词根意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: τινες ἐξ αὐτῶν
  choice: 他们中间有些人
  rationale: 自然表达部分结构，并承接上文会堂中的听众。
- source_word: ἐπείσθησαν
  choice: 被说服了
  rationale: 保留πείθω的被动语态和“受到劝服”的词义，不将其直接改译为更明确的“信了”。
- source_word: προσεκληρώθησαν
  choice: 加入保罗和西拉的行列
  rationale: 此罕见动词表示被归入、与某人联合；主文采用现代汉语中清楚自然的表达，较直译则收入脚注。
- source_word: τῶν τε σεβομένων Ἑλλήνων
  choice: 许多敬畏上帝的希腊人
  rationale: 在《使徒行传》的语境中，指敬拜以色列之上帝、与犹太会堂有所联系的外族人；“敬畏上帝”准确表达其宗教背景。
- source_word: πλῆθος πολὺ
  choice: 许多
  rationale: 以简洁自然的现代汉语表达人数众多。
- source_word: γυναικῶν τε τῶν πρώτων
  choice: 有地位的妇女
  rationale: πρῶτος在此指社会地位或声望，而非时间上的先后。
- source_word: οὐκ ὀλίγαι
  choice: 不少
  rationale: 保留原文以否定表达肯定的修辞方式，又符合现代汉语习惯。
- source_word: τε ... τε
  choice: 此外，还有……以及……
  rationale: 清楚呈现后两类人都被列为附加群体，同时使汉语句式流畅。
theological_decisions:
- issue: 是否用明确表示归信的词翻译ἐπείσθησαν
  choice: 被说服了
  alternative: 信了
  rationale: 原文使用πείθω而非πιστεύω；所选译法保留词汇区别，也不否定上下文中的归信含义。
- issue: 是否明确σεβομένων Ἑλλήνων所敬畏的对象
  choice: 敬畏上帝的希腊人
  alternative: 虔敬的希腊人
  rationale: 《使徒行传》的历史语境表明这是与犹太会堂有关、敬拜以色列之上帝的希腊人；明确“上帝”有助于现代读者理解，而不额外加入宗派解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“被说服了”保留原文被动形式；“不少”保留路加的含蓄强调；“有地位的妇女”清楚表达社会声望。
