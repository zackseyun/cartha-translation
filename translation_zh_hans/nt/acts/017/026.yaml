  text: ἐποίησέν τε ἐξ ⸀ἑνὸς πᾶν ἔθνος ἀνθρώπων κατοικεῖν ἐπὶ ⸂παντὸς προσώπου⸃ τῆς γῆς, ὁρίσας προστεταγμένους καιροὺς καὶ τὰς ὁροθεσίας τῆς κατοικίας αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/026.yaml
  text: And he made from one man every nation of mankind to live on the whole face of the earth[a], having determined their appointed times and the boundaries of their dwelling place[b],
translation:
  language: zh_hans
  text: 他从一人造出人类各族，使他们住在全地之上[a]，并预先定下他们的时期[b]和居住地的疆界。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“从同一血脉而出”，而不是“从一个”。正文依照 SBLGNT 的“从一个”，并按中文表达译作“从一人”。
    reason: textual_variant
  - marker: b
    text: 也可译作“为他们定下的时期”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησέν
  choice: 造出
  rationale: 这里的 ποιέω 表示使人类各族由共同源头而出；“造出”自然地传达上帝的创造作为，又不特别限定为“从无创造”。
- source_word: ἐξ ἑνὸς
  choice: 从一人
  rationale: 希腊文直译为“从一个”，所指是人；中文用“一人”补足必要语意，同时不采用异文“一种血脉”，也不把“一人”明确限定为男性。
- source_word: πᾶν ἔθνος ἀνθρώπων
  choice: 人类各族
  rationale: ἔθνος 在此指各个民族或族群，ἀνθρώπων 表明其共同属于人类；“人类各族”简洁、自然，并保留多族同源的重点。
- source_word: κατοικεῖν
  choice: 使他们住
  rationale: 不定式在此表达上帝使各族居住于全地的结果或安排；补出“使他们”符合现代汉语句法。
- source_word: ἐπὶ παντὸς προσώπου τῆς γῆς
  choice: 在全地之上
  rationale: 原文是“在地的整个表面上”的惯用表达；“全地之上”既保留其空间范围，也避免生硬照译“全地的脸面”。
- source_word: ὁρίσας
  choice: 定下
  rationale: 该分词表示划定、确定；“定下”兼顾时期与疆界两项宾语，语气自然而庄重。
- source_word: προστεταγμένους καιρούς
  choice: 他们预定的时期
  rationale: καιροί 指具有特定意义的时期或时段，προστεταγμένους 表示已经指定、安排；“预定的时期”保留先行安排之意，“他们”从上下文补出。
- source_word: τὰς ὁροθεσίας τῆς κατοικίας αὐτῶν
  choice: 居住的疆界
  rationale: ὁροθεσία 指划定的界限，κατοικία 指居住之处；“居住的疆界”在中文中自然地表达各族居住地域的边界。
theological_decisions:
- issue: ἐξ ἑνὸς 所指是否应在译文中明确
  choice: 从一人
  alternative: 从一个；从一位祖先
  rationale: 原文只有“从一个”，没有“血”字。中文单说“从一个”语意悬空，因此译作“从一人”；“一人”保留共同人类源头的意思，同时不像“一位男性”那样过度明确性别或身份。
- issue: προστεταγμένους καιρούς 与各族的关系
  choice: 他们预定的时期
  alternative: 为他们定下的时期；指定的时节
  rationale: 原文可理解为各族所对应的、已经指定的时期。正文沿用所有关系较含蓄的表达，不进一步断定这些时期具体是民族兴衰、居留年代还是季节。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“人类各族”避免把代表全人类的词误解为仅指男性；“全地之上”保留圣经语体但不生硬。分号呈现原文两项相关的神圣作为，并使长句层次清楚。
