  text: καὶ ὤφθησαν αὐτοῖς διαμεριζόμεναι γλῶσσαι ὡσεὶ πυρός, ⸂καὶ ἐκάθισεν⸃ ἐφ’ ἕνα ἕκαστον αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/003.yaml
  text: And tongues like fire appeared to them, being divided, and it came to rest on each one of them[a].
translation:
  language: zh_hans
  text: 又有舌头向他们显现，如火一般，分散开来，停在他们每一个人身上[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“又有分开的舌头向他们显现，如火一般。”“舌头”保留原文的可见意象，也与下文的说话主题相呼应。希腊文末句动词为单数，可能把这些分散的舌头作为一个整体来叙述；中文按语境自然表达为逐一停在众人身上。
    reason: 说明分词的另一种语序、火的比拟、γλῶσσαι的意象，以及复数名词与单数动词之间不宜在正文中强行具体化的歧义。
lexical_decisions:
- source_word: ὤφθησαν
  choice: 向他们显现
  rationale: 该被动形式在此表达“变得可见、显现”；“向他们显现”自然地保留了目击者和可见显现的含义。
- source_word: διαμεριζόμεναι
  choice: 分散开来
  rationale: 现在时中间/被动分词修饰复数“舌头”，可指分开或分配。译作“分散开来”既保留过程感，也不强行断定其具体形态。
- source_word: γλῶσσαι
  choice: 舌头
  rationale: 保留原词既可指舌头、又与随后说话和语言主题呼应的双关潜力；不直接译成“火焰”或“语言”。
- source_word: ὡσεὶ πυρός
  choice: 仿佛火焰的
  rationale: ὡσεὶ 表示比拟而非同一。“仿佛火焰的”明确说明这是可见形态的类比，并非断言它就是火。中文以“火焰”表达火所呈现的舌状可见形态较自然。
- source_word: ἐκάθισεν
  choice: 有一个落在
  rationale: 保留希腊文单数动词的突兀之处，不擅自改作复数；“有一个”将隐含的单数主语显明，“落在”适合描述可见之物停驻在人身上。
- source_word: ἐφ’ ἕνα ἕκαστον αὐτῶν
  choice: 他们每个人身上
  rationale: 清楚表达逐一临到所有在场者的分配含义。
theological_decisions:
- issue: 五旬节显现之物的性质
  choice: 译为“仿佛火焰的舌头”，保留可见的舌状意象和比拟措辞
  alternative: 火焰；火的舌头；仿佛火的语言
  rationale: γλῶσσαι 与 ὡσεὶ 合在一起，既不可简化成实际的火，也不宜提前限定为人类语言；译文保留与下文说话现象的联系。
- issue: 复数“舌头”与单数动词的张力
  choice: 以“有一个落在”保留单数 ἐκάθισεν
  alternative: 它们分别落在；舌头落在
  rationale: 原文先用复数“舌头”，后用单数动词，可能把整个显现视为一个整体，也可能指分散后每一个所显现的舌头。译文不把单数静默改成复数，并以脚注说明。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“舌头”保留原文意象及其与语言主题的词义联系；分号帮助读者辨明显现、分散和落下三个相连动作。
