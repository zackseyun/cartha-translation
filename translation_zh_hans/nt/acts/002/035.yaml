translation:
  language: zh_hans
  text: 直到我使你的仇敌作你的脚凳。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“直到我把你的仇敌置为你脚的脚凳。”
    reason: lexical_alternative
  - marker: b
    text: 本句呼应《诗篇》110:1；这节经文属于有关君王登基、并具有弥赛亚意义的诗篇。
    reason: cross_reference
lexical_decisions:
- source_word: ἕως ἂν
  choice: 直到
  rationale: 该组合指向将来的一个时间界限；“直到”简洁自然地表达此前状态持续至该时点。
- source_word: θῶ
  choice: 使……作
  rationale: θῶ源自τίθημι，基本义为“放置”，但与宾语及表语“脚凳”连用时，“使……作”既符合汉语习惯，也保留其使役关系。
- source_word: τοὺς ἐχθρούς σου
  choice: 你的仇敌
  rationale: 直接对应原文，保留个人敌对及君王面对反对者的语境；“仇敌”也符合庄重的经文语体。
- source_word: ὑποπόδιον
  choice: 脚凳
  rationale: 这是该词的通常含义，保留诗篇引文中以仇敌成为脚凳来表现降服的具体意象。
- source_word: τῶν ποδῶν σου
  choice: 你的脚凳
  rationale: 原文直译近于“你双脚的脚凳”。现代汉语用“你的脚凳”更自然，且未将这一意象解释性扩写为“踩在脚下”。
theological_decisions:
- issue: 诗篇110:1引文中的君王降敌意象
  choice: 保留“使你的仇敌作你的脚凳”这一具体比喻。
  alternative: 直到我把你的仇敌完全降服在你脚下。
  rationale: 本句引用诗篇110:1，具有君王登基及弥赛亚语境。保留“脚凳”可维持互文和神学张力，不在正文中将比喻直接解释为“完全降服”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“仇敌”和“脚凳”保留原文诗歌及君王语境的具体意象；句式简洁，以便与上下文中的引文自然衔接。
