  text: ἑτέροις τε λόγοις πλείοσιν διεμαρτύρατο, καὶ παρεκάλει ⸀αὐτοὺς λέγων· Σώθητε ἀπὸ τῆς γενεᾶς τῆς σκολιᾶς ταύτης.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/040.yaml
  text: And with many other words he solemnly testified and kept urging them[a], saying, “Be saved from this crooked generation.”
translation:
  language: zh_hans
  text: 彼得还用许多别的话郑重作证，不住地劝他们说：“你们要从这个弯曲的世代中得救。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们要救自己脱离这个弯曲的世代。”希腊文动词是被动形式，直译为“要得救”；但这个命令也呼召听众作出回应。
    reason: alternative_reading
lexical_decisions:
- source_word: ἑτέροις τε λόγοις πλείοσιν
  choice: 还用许多别的话
  rationale: 保留ἑτέροις“别的”和πλείοσιν“许多”的含义，并以现代汉语自然表达彼得继续讲话的方式。
- source_word: διεμαρτύρατο
  choice: 郑重作证
  rationale: 体现διαμαρτύρομαι所含的郑重、恳切见证之意，又不把它仅仅解释为“警告”。
- source_word: παρεκάλει
  choice: 不住地劝
  rationale: 未完成时表示持续或反复的行动；“不住地劝”兼顾持续体和劝勉语气。
- source_word: αὐτοὺς
  choice: 他们
  rationale: 直指彼得当时的听众，按普通代词译出。
- source_word: Σώθητε
  choice: 你们要……得救
  rationale: 保留不定过去时被动命令式的被动语态；“要……得救”既表达真实的呼召，也不将其改成自主自救。
- source_word: ἀπὸ τῆς γενεᾶς τῆς σκολιᾶς ταύτης
  choice: 从这个弯曲的世代中
  rationale: “从……中”表达分离；“世代”保留γενεά的时代及同代人含义，“弯曲”保留σκολιός鲜明的道德隐喻。
theological_decisions:
- issue: Σώθητε的语态与施事关系
  choice: 你们要从这个弯曲的世代中得救
  alternative: 你们要救自己脱离这个弯曲的世代
  rationale: 希腊文是被动命令式。正文保留被动形式，以免强化为人凭自己施行拯救；同时，命令语气仍保留听众必须回应的张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“郑重作证”保留见证性语气，“不住地劝”清楚呈现持续行动。正文保留“得救”的被动形式，并用脚注交代可见于其他译法的主动表达。
