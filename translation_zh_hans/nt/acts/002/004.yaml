revisions:
- from: 众人都被圣灵充满，就开始用别的舌语[a]说话，照着圣灵所赐给他们的表达。
  to: 他们全都被圣灵充满，开始说起别的方言[a]来；圣灵不断赐给他们说话的能力。
  rationale: 修订以“别的方言”替换不自然且可能带有专门神学联想的“别的舌语”，并以脚注保留“别的语言”的译法及上下文线索。“圣灵不断赐给他们说话的能力”将“照着／如同”、持续性的“赐给”及“说出来”的意思用自然汉语整合表达；“能力”是为使该汉语句子通顺而作的必要显化，指向原文所说圣灵所赐的发言能力，不限定所说内容为预言或其他类别。
