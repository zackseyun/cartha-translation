base_translation:
  language: en
  yaml_path: translation/nt/acts/002/004.yaml
  text: And they were all filled with the Holy Spirit and began to speak in other tongues[a], as the Spirit was giving them utterance.
translation:
  language: zh_hans
  text: 他们全都被圣灵充满，开始说起别的方言[a]来；圣灵不断赐给他们说话的能力。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“别的语言”。希腊语此词可指“舌头”或“语言”；下文表明，听众所听见的是他们各自的语言。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπλήσθησαν
  choice: 被……充满
  rationale: 该词在此表示众人被圣灵充满、得着能力；用被动表达保留原文语态，也符合现代汉语习惯。
- source_word: πάντες
  choice: 众人都
  rationale: 准确表达在场群体的全体性，同时比“所有人”更适合庄重的叙事语体。
- source_word: πνεύματος ἁγίου
  choice: 圣灵
  rationale: 使徒行传的上下文明确指向那位施行行动、赐下表达的神圣之灵；汉语专名“圣灵”自然明确。
- source_word: ἤρξαντο λαλεῖν
  choice: 就开始……说话
  rationale: 保留动作起始之意；“就”自然承接前句所述圣灵充满的事件。
- source_word: ἑτέραις γλώσσαις
  choice: 用别的舌语
  rationale: “舌语”保留γλῶσσα在本节中“舌头／语言”的词汇张力，不预先完全解释为普通人类语言；“别的”对应ἑτέραις。脚注说明其也可译为“别的语言”。
- source_word: καθὼς
  choice: 照着
  rationale: 表达他们说话的方式和程度取决于圣灵所赐，较单纯的“正如”更符合此处句法关系。
- source_word: ἐδίδου
  choice: 所赐给
  rationale: 以汉语关系结构自然表达未完成过去时的持续赐予；“赐”适合圣灵作为施事者的庄重语境，但不额外增添神学含义。
- source_word: ἀποφθέγγεσθαι
  choice: 表达
  rationale: 该词指发声说出、郑重讲说；“表达”与“赐给他们”搭配自然，并避免重复前面的“说话”。
- source_word: αὐτοῖς
  choice: 他们
  rationale: 保留原文间接受词，明确圣灵把表达能力赐给众人。
theological_decisions:
- issue: πνεύματος ἁγίου是指具有行动主体性的圣灵，还是泛指一种圣洁的灵。
  choice: 圣灵
  alternative: 圣洁的灵
  rationale: 上下文中圣灵是应许的实现，也是主动赐予众人表达的行动者，因此译作专指的“圣灵”，不将其处理为一种非人格化的状态。
- issue: γλώσσαις应译为“舌语”还是“语言”。
  choice: 舌语
  alternative: 语言
  rationale: 原词本身可指舌头或语言。本节采用“舌语”以保留词汇上的开放性，让2:6–11的后续叙事说明听众把这些话听作自己所用的语言；脚注同时提供自然的替代译法。
- issue: ἀποφθέγγεσθαι是否应明确译为预言或受默示的话。
  choice: 表达
  alternative: 宣讲／受感说话
  rationale: 该词可带有郑重、公开发言的意味，但本节没有单凭此词把内容限定为预言；采用较宽的“表达”，避免加入原文未明确限定的言语类别。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“众人都……就开始……”保持事件推进的节奏；“舌语”配脚注保存原词的语义张力，同时由后文语境加以说明。
