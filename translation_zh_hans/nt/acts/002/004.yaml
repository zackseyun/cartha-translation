review_pass:
  verdict: revise
  source_fidelity: 原译“众人都被圣灵充满，就开始……”基本传达了ἐπλήσθησαν、πάντες与ἤρξαντο的叙事推进。但“舌语”并非现代标准汉语中对γλώσσαις的中性、自然对应词，且容易带入特定现象的既定理解。末句“照着圣灵所赐给他们的表达”句法悬空，未清楚表达καθὼς、未完成时ἐδίδου及不定式ἀποφθέγγεσθαι所构成的“圣灵持续赐给他们说话的能力／话语，他们便照此说”的关系。
  naturalness: “用别的舌语说话”及“所赐给他们的表达”均不够自然；后者尤其不能独立构成完整谓语结构。改为“开始说起别的方言来；圣灵不断赐给他们说话的能力”符合现代庄重叙事汉语，并明确末句的语法关系。
  terminology: “圣灵”准确且为现代汉语圣经的通行专名。“方言”是汉语圣经传统中对应本处γλώσσαις的常用词，但本身可能被理解为方言或语言，故以脚注列出“别的语言”，并说明下文的理解，较能保留原文在本节的词汇开放性。
  issues:
  - severity: medium
    issue: “舌语”不适合作为正文的中性现代汉语译词。
    rationale: “舌语”在现代汉语中不属自然通用表达，且常被用作对特定宗教言语现象的技术性称呼；这会比γλώσσαις本身更早地限定含义。
  - severity: high
    issue: “照着圣灵所赐给他们的表达”句法不完整，且未充分表达末句。
    rationale: “表达”不能自然地作为“赐给他们”的宾语并由“照着”引出说话动作；原文意为圣灵持续赐给他们发言／说出的能力或话语。修订须明确这一关系。
  - severity: low
    issue: 未呈现ἐδίδου的持续性。
    rationale: 汉语不必机械标示时态，但“不断赐给”可自然呈现未完成时所显示的持续赐予。
  revised_text: 他们全都被圣灵充满，开始说起别的方言[a]来；圣灵不断赐给他们说话的能力。
