  text: ἐξίσταντο δὲ πάντες καὶ ⸀διηπόρουν, ἄλλος πρὸς ἄλλον λέγοντες· Τί ⸀θέλει τοῦτο εἶναι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/012.yaml
  text: And they all were amazed and perplexed[a], saying to one another, “What does this mean?”
translation:
  language: zh_hans
  text: 众人都惊讶不已，困惑不解，彼此说：“这是什么意思？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 按字面近似为“这要成为什么？”这是一个习惯表达，意思是“这是什么意思？”或“这件事有什么意义？”。
    reason: 说明希腊语τί θέλει τοῦτο εἶναι的字面形式与习语义，并避免将不自然的中文措辞误作精确直译。
lexical_decisions:
- source_word: ἐξίσταντο
  choice: 惊讶不已
  rationale: 该动词在此表示因所见之事而震惊、诧异；未完成时体现持续的反应。“惊讶不已”自然传达这种强烈而延续的惊异，又避免把词源性的表达误解为精神失常。
- source_word: δὲ
  choice: 不单独译出
  rationale: δὲ在此是轻微的叙事连接词；现代汉语承接上文时无需机械译作“而”或“但是”，省译使行文更自然，也不制造原文没有的强烈转折。
- source_word: πάντες
  choice: 众人都
  rationale: 既表明在场群体，也保留πάντες所强调的全体性。
- source_word: διηπόρουν
  choice: 困惑不解
  rationale: 该词表示十分迷惑、拿不准如何理解；“困惑不解”准确表达持续的茫然，并与前面的惊讶形成自然搭配。
- source_word: ἄλλος πρὸς ἄλλον
  choice: 彼此
  rationale: 这是现代汉语表达相互关系最简洁自然的说法。
- source_word: λέγοντες
  choice: 问道
  rationale: 分词字面为“说着”，但其后内容是直接疑问句；译作“问道”自然明确，同时不改变话语内容。
- source_word: Τί θέλει τοῦτο εἶναι;
  choice: 这是什么意思？
  rationale: τί θέλει + 不定式在此是询问某事的含义或意义的习语。正文按现代汉语习惯译出其实际语义，较字面译法清楚而不过度释义。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“惊讶不已，困惑不解”保留两个并列反应；问句简明易懂。脚注说明希腊语习语，以免正文采用生硬的字面表达。
