  text: ἦσαν δὲ προσκαρτεροῦντες τῇ διδαχῇ τῶν ἀποστόλων καὶ τῇ ⸀κοινωνίᾳ, τῇ κλάσει τοῦ ἄρτου καὶ ταῖς προσευχαῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/042.yaml
  text: And they were devoting themselves to the apostles' teaching and the fellowship[c][b][a], to the breaking of bread and the prayers.
translation:
  language: zh_hans
  text: 他们一直专心于使徒的教导、彼此相交[a]、掰饼[b]和祷告[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“共同分享”、“共同参与”或“共融”。
    reason: lexical_alternative
  - marker: b
    text: “掰饼”可以泛指一同用餐；许多人认为这里也包括主的晚餐。
    reason: alternative_reading
  - marker: c
    text: 或译“那些固定的祷告”；原文的冠词可能暗示已有公认的祷告时间或形式。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν δὲ προσκαρτεροῦντες
  choice: 他们恒心持守
  rationale: “ἦσαν”加现在分词构成迂回未完成时，表达过去持续、惯常的行动；“恒心持守”兼顾持续性和坚定投入的含义。句首的δέ在此主要承接叙事，汉语不必机械译作“但是”。
- source_word: τῇ διδαχῇ τῶν ἀποστόλων
  choice: 使徒的教导
  rationale: διδαχή在此指使徒所给予的教导；译作“教导”比“教义”更自然，也避免赋予原文未必具有的系统化意味。
- source_word: τῇ κοινωνίᾳ
  choice: 彼此相交
  rationale: κοινωνία可涵盖共同参与、分享和群体生活。“彼此相交”在正文中保留广义的共同关系，不把它局限为财物分享或圣礼意义；其他可能含义收入脚注。
- source_word: τῇ κλάσει τοῦ ἄρτου
  choice: 掰饼
  rationale: 直译保留路加—使徒行传中较固定的表达，不在正文中预先断定它只指一般共同用餐或专指主餐。
- source_word: ταῖς προσευχαῖς
  choice: 祷告
  rationale: 复数带冠词，可能指群体中已有固定时间或形式的祷告。汉语正文用“祷告”较自然，而冠词可能包含的特指意味在脚注说明。
theological_decisions:
- issue: κλάσει τοῦ ἄρτου是否应明确译为主餐或圣餐
  choice: 正文译作“掰饼”
  alternative: 主餐；圣餐；包括主餐在内的共同用餐
  rationale: 该短语可指共同进餐，在基督徒群体语境中也可能包含纪念耶稣的主餐；本节措辞不足以排除其中任何一面，因此正文不采用带特定宗派色彩的窄化解释。
- issue: κοινωνία是否应限定为财物分享或圣礼性的共融
  choice: 正文译作“彼此相交”，保留较宽泛的群体含义
  alternative: 分享财物；共同参与；共融
  rationale: 这里列举群体持续投入的核心实践。κοινωνία可能同时涉及关系、属灵参与和物质分享；将它限定为其中一项会过早消除原文的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“恒心持守”保留持续而坚定的语气；“彼此相交”和“掰饼”保留原文的宽度，并借脚注说明其可能含义。各项用逗号并列，末项加“并且”，使中文节奏清楚。
