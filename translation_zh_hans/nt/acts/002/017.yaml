  text: Καὶ ἔσται ἐν ταῖς ἐσχάταις ἡμέραις, λέγει ὁ θεός, ἐκχεῶ ἀπὸ τοῦ πνεύματός μου ἐπὶ πᾶσαν σάρκα, καὶ προφητεύσουσιν οἱ υἱοὶ ὑμῶν καὶ αἱ θυγατέρες ὑμῶν, καὶ οἱ νεανίσκοι ὑμῶν ὁράσεις ὄψονται, καὶ οἱ πρεσβύτεροι ὑμῶν ⸀ἐνυπνίοις ἐνυπνιασθήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/017.yaml
  text: And it will be in the last days[a], says God, that I will pour out from my Spirit on all flesh, and your sons and your daughters will prophesy, and your young men will see visions[b], and your old men will dream dreams.
translation:
  language: zh_hans
  text: '上帝说：


    “在末后的日子，


    我要把我的灵倾注在所有人身上[a]。


    你们的儿子和女儿都要说预言；


    你们的青年男子要看见异象，


    你们的老年男子要做梦。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“我要从我的灵倾注在所有血肉身上”。“所有血肉”是先知性用语，泛指所有人或全人类；“从”表达来源，不必理解为上帝的灵被分割。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ταῖς ἐσχάταις ἡμέραις
  choice: 在末后的日子
  rationale: 保留末世性的时间用语，同时采用现代汉语中自然、庄重的表达。
- source_word: λέγει ὁ θεός
  choice: 上帝说
  rationale: 准确传达现在时的引述公式；汉语采用自然语序。
- source_word: ἐκχεῶ ἀπὸ τοῦ πνεύματός μου
  choice: 我要从我的灵倾注出来
  rationale: 保留“倾注”的具体比喻，并尽量体现ἀπό所表达的来源；脚注说明更常见的意译。
- source_word: ἐπὶ πᾶσαν σάρκα
  choice: 浇在凡有血肉的人身上
  rationale: 既保留σάρξ的先知性“血肉”意象，也用“人”明确此处指广泛的人类，而不是肉体物质本身。
- source_word: προφητεύσουσιν
  choice: 要说预言
  rationale: 直接保留先知性言说的含义，避免淡化为泛指的属灵发言。
- source_word: οἱ υἱοὶ ὑμῶν καὶ αἱ θυγατέρες ὑμῶν
  choice: 你们的儿子和女儿
  rationale: 保留原文明确列举男女两类后代的结构和强调。
- source_word: οἱ νεανίσκοι ὑμῶν
  choice: 你们的青年男子
  rationale: 体现名词的阳性和年龄含义，并与后面的老年男子形成对照。
- source_word: ὁράσεις ὄψονται
  choice: 要看见异象
  rationale: 以自然汉语表达同源词结构的意义，同时保留“异象”这一先知性用语。
- source_word: οἱ πρεσβύτεροι ὑμῶν
  choice: 你们的老年男子
  rationale: 此处与青年男子构成年龄对比，不译作可能让人联想到职分的“长老”。
- source_word: ἐνυπνίοις ἐνυπνιασθήσονται
  choice: 要做梦
  rationale: 用现代汉语自然表达同源词强调；不译“异梦”，以免现代读者误解为奇怪的梦。
theological_decisions:
- issue: “凡有血肉的”所指范围
  choice: 正文保留“血肉”意象，同时补出“人”以表明这是泛指人类的先知性惯用语。
  alternative: 译作“所有人”或“全人类”。
  rationale: 这样既维持与约珥书预言的互文联系，也不把应许限制于某一性别、年龄或社会类别。
- issue: πνεῦμα在上帝倾注行动中的所指
  choice: 译作“我的灵”。
  alternative: 译作“我的气息”或将其理解为非人格性的能力。
  rationale: 说话者是上帝，语境指上帝的灵；汉语无需借助大小写，也不额外加入超出原文的定义。
- issue: ἀπό在“从我的灵”中的含义
  choice: 正文保留来源表达“从我的灵倾注出来”。
  alternative: 译作“把我的灵倾注下来”。
  rationale: 原文确有ἀπό，保留其措辞可避免无声地抹去“从”的表达；同时不据此断言上帝的灵可被分割。
translation_notes:
  register: 采用现代、庄重而易懂的普通话，并按诗性引文分行。保留“末后的日子”“倾注”“血肉”“说预言”“异象”等关键意象；以“青年男子／老年男子”呈现原文的性别与年龄对照。
