  text: γενομένης δὲ τῆς φωνῆς ταύτης συνῆλθε τὸ πλῆθος καὶ συνεχύθη, ὅτι ⸀ἤκουον εἷς ἕκαστος τῇ ἰδίᾳ διαλέκτῳ λαλούντων αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/006.yaml
  text: And when this sound occurred[a], the crowd came together and was bewildered[b], because each one was hearing them speaking in his own dialect.
translation:
  language: zh_hans
  text: 这声音响起时[a]，人群聚集起来，感到困惑，因为人群中的每一个人都听见他们用各人自己本地的方言说话[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “声音”所译的希腊词也可指“响声”或“嗓音”；此处指一种可听见的现象。
    reason: lexical_alternative
  - marker: b
    text: 或译“各人自己本地的语言”。希腊词既可指一种语言，也可指某地或某群体的方言。
    reason: lexical_alternative
lexical_decisions:
- source_word: γενομένης δὲ τῆς φωνῆς ταύτης
  choice: 这声音一响起
  rationale: 属格独立结构表达时间背景；φωνή在此指可听见的现象。“声音”不武断限定为人的嗓音或无意义的响声，“一响起”则自然呈现事件的发生及叙事推进。
- source_word: συνῆλθε τὸ πλῆθος
  choice: 人群就聚集过来
  rationale: συνέρχομαι表示众人来到一处；“聚集过来”既保留移动和汇聚之意，也符合现代汉语叙事习惯。“就”自然衔接前面的时间从句。
- source_word: συνεχύθη
  choice: 困惑不解
  rationale: 该被动形式在此描述人群因异常现象而陷入迷惑或混乱。“困惑不解”自然表达认知上的茫然，又不额外加入恐惧或惊慌。
- source_word: ἤκουον εἷς ἕκαστος
  choice: 每个人听见
  rationale: εἷς ἕκαστος具有强调个体的分配意义；“每个人”准确而自然。ἤκουον为未完成时，语境中的持续情形由整句呈现，汉语无需生硬添加“正在”。
- source_word: τῇ ἰδίᾳ διαλέκτῳ
  choice: 自己本地的方言
  rationale: διάλεκτος可指语言，也常指某地或某群体特有的言语形式。“本地的方言”贴近本节及下文的地域语言语境；“自己”对应ἰδίᾳ，并与“每个人”的分配结构相连。
- source_word: λαλούντων αὐτῶν
  choice: 他们所说的
  rationale: 保留说话者为复数“他们”，不把其身份限定为使徒；采用汉语关系结构，使“每个人”所听见的是自己本地的方言这一关系清楚自然。
theological_decisions:
- issue: 五旬节听见的是“方言”还是独立“语言”
  choice: 正文译作“自己本地的方言”，并用脚注保留“语言”的可能
  alternative: 自己本地的语言
  rationale: διάλεκτος的语义范围可涵盖语言和方言；本段强调各人出生地区的言语，正文采用较贴近该词地域色彩的“方言”，但不借译文判定现代语言学意义上的语言与方言界线。
- issue: “自己的”所指对象
  choice: 使“自己”明确回指听见的每个人
  alternative: 译成可能让“自己的”回指说话者“他们”的结构
  rationale: 希腊文εἷς ἕκαστος与τῇ ἰδίᾳ διαλέκτῳ构成分配关系，意思是各人听见自己的本地方言，而不是说话者各自惯用的方言。汉语句式据此消除不必要的指代歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“一响起”“聚集过来”使事件进程自然清楚；“困惑不解”避免古奥表达。末句调整为符合汉语习惯的关系结构，同时保留原文对“每个人”的强调，并避免把说话者身份缩窄为使徒。
