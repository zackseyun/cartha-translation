  yaml_path: translation/nt/acts/002/028.yaml
  text: You made known to me the paths of life[b][a]; you will fill me with gladness with your presence.
translation:
  language: zh_hans
  text: 你使我知道生命的道路[a]；你必使我在你面前充满喜乐[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“生命的路径”。
    reason: lexical_alternative
  - marker: b
    text: 原文按字面为“与你的面（脸）”；这里“面”是指亲身临在，故译为“在你面前”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώρισάς μοι
  choice: 你已使我知道
  rationale: 以“使我知道”保留 γνωρίζω 的使役意味；不定过去时在诗篇引文中可自然译作“已……”，μοι 则融入“我”中。
- source_word: ὁδοὺς ζωῆς
  choice: 生命的道路
  rationale: 保留 ὁδούς 的复数意义所表达的路径概念；中文集合式的“道路”自然庄重，也避免“生活方式”一类误解。
- source_word: πληρώσεις με εὐφροσύνης
  choice: 你必使我……充满喜乐
  rationale: 以“必”表达将来直陈语气；“充满喜乐”自然传达 πληρόω 加内容属格的结构，εὐφροσύνη 的欢欣意味也得到保留。
- source_word: μετὰ τοῦ προσώπου σου
  choice: 在你面前
  rationale: 原文直译为“与你的面同在”，是表示亲身临在的惯用语；“在你面前”既保留“面”的意象，又是自然的现代汉语。
theological_decisions:
- issue: 诗篇引文中神临在惯用语的译法
  choice: 在你面前
  alternative: 因你的同在
  rationale: “在你面前”保留 προσώπου（面）的原文意象及与神直接相对的关系意味，不把经文进一步解释成某一种神学表述；脚注说明其惯用含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。分号保留两句诗行的平行关系；用“你必”呈现未来语气。所有脚注标记均置于正文中对应位置。
