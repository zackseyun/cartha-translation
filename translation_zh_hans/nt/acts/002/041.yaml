reference: Acts 2:41
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οἱ μὲν ⸀οὖν ἀποδεξάμενοι τὸν λόγον αὐτοῦ ἐβαπτίσθησαν, καὶ προσετέθησαν ⸀ἐν τῇ ἡμέρᾳ ἐκείνῃ ψυχαὶ ὡσεὶ τρισχίλιαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/041.yaml
  text: So those who received his word were baptized[a], and about three thousand souls were added on that day.
translation:
  language: zh_hans
  text: 于是，那些领受他话语的人都受了洗；那一天，又增添了约三千人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“灵魂”；这里是计算人数的常见说法，也可译作“人们”。
    reason: 说明 ψυχαί 的字面形式和语境义，避免读者把“人”误认为遗漏了原文信息，也避免将“灵魂”过度理解为技术性的人论陈述。
lexical_decisions:
- source_word: οἱ μὲν οὖν
  choice: 于是，那些……的人
  rationale: 这一组合承接彼得先前的宣讲及听众的回应，表示叙事推进并带有结果意味。“于是”在现代汉语中自然简洁，又不过分强化逻辑推论。
- source_word: ἀποδεξάμενοι
  choice: 领受
  rationale: 该词表示积极、欣然地接纳所听见的信息。“领受”既保留正面回应的意味，也适合庄重而通俗的经文语体；不将其窄化为单纯的理性“同意”。
- source_word: τὸν λόγον αὐτοῦ
  choice: 他的话语
  rationale: 此处指彼得所宣讲的信息。“话语”贴近 λόγος，同时在上下文中可自然理解为所传的信息；保留“他的”，不把指代对象直接改写为“彼得”。
- source_word: ἐβαπτίσθησαν
  choice: 都受了洗
  rationale: 准确表达不定过去时被动态所述的事件。“受洗”是现代汉语中自然、通行的表达，不额外说明施洗方式、功效或神学机制；“都”使中文主语与谓语衔接清楚。
- source_word: προσετέθησαν
  choice: 又增添了
  rationale: 表达人数被加入、群体有所增加的结果。希腊文在本节没有明说加到谁或哪个群体中，因此中文也不补出“教会”或“他们中间”；采用汉语无施事句式，避免生硬的“被加添”。
- source_word: ψυχαὶ
  choice: 人
  rationale: ψυχή 的复数在这里是计算人的常见表达，并非必然要作关于人之构成的技术性陈述。现代汉语用“人”最自然准确；脚注保留原文直译“灵魂”，以呈现词汇形式及其可能引起的张力。
- source_word: ὡσεὶ τρισχίλιαι
  choice: 约三千人
  rationale: ὡσεί 表示近似数量，“约三千”是自然、准确的现代汉语表达。
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: 那一天
  rationale: 按现代汉语时间状语的自然形式翻译，并维持其对前述五旬节当天的指向。
theological_decisions:
- issue: 是否明确补出“增添”所指向的群体
  choice: 不补出对象，只译作“又增添了”
  alternative: “加入了他们”或“加入了教会”
  rationale: 上下文表明这些人归入信徒群体，但本节希腊文本身没有明说对象。保留省略可避免把上下文推论写成经文明文，也不预先限定其教会论含义。
- issue: ψυχαί 是否应译成带有技术性人论意味的“灵魂”
  choice: 正文译作“人”，脚注说明原文直译
  alternative: 正文译作“灵魂”
  rationale: 这里 ψυχαί 用于计数人，是常见的转喻用法。中文“约三千个灵魂”容易被理解为专指非物质部分，超出语境所要求的含义；脚注则保留原词的字面信息。
- issue: 受洗的方式与功效
  choice: 仅译作“受了洗”
  alternative: 补充具体施洗方式，或说明洗礼在此产生的神学功效
  rationale: ἐβαπτίσθησαν 陈述他们接受了洗礼，却没有在本节说明具体方式或系统阐释其功效。译文不引入宗派性限定。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“领受他的话语”略带经文语体，但仍属现代通行表达；“又增添了约三千人”顺应汉语习惯，同时保留原文未说明加入对象和施事者的含蓄性。脚注标记置于“人”之后，与所解释的 ψυχαί 对应。
