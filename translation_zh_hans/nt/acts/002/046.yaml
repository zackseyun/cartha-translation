source:
  edition: SBLGNT
  text: καθ’ ἡμέραν τε προσκαρτεροῦντες ὁμοθυμαδὸν ἐν τῷ ἱερῷ, κλῶντές τε κατ’ οἶκον ἄρτον, μετελάμβανον τροφῆς ἐν ἀγαλλιάσει καὶ ἀφελότητι καρδίας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/046.yaml
  text: And day by day[a], continuing together with one purpose in the temple courts, and breaking bread from house to house, they were sharing meals with gladness and simplicity of heart[d][c][b],
translation:
  language: zh_hans
  text: 他们天天同心合意地不断在圣殿[a]里聚集，又挨家挨户擘饼[b]，怀着欢喜和纯朴的心一同用饭[c][d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的希腊词指整个圣殿范围，包括院落，并非专指内殿。
    reason: cultural_note
  - marker: b
    text: “擘饼”可以指普通的共同用餐；也有人认为这里包括主餐（圣餐）。
    reason: alternative_reading
  - marker: c
    text: 直译为“享用食物”。
    reason: lexical_alternative
  - marker: d
    text: “纯朴的心”也可译为“真诚的心”或“慷慨的心”。
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: 天天
  rationale: κατά加宾格在此表达逐日反复发生；“天天”自然、简明，并保留持续性。
- source_word: προσκαρτεροῦντες
  choice: 坚持……聚集
  rationale: 现在时分词表示持续、恒常的行动；结合地点短语，译为“坚持……聚集”比单说“留在”更符合此处群体活动的语境，同时不引入额外的敬虔意味。
- source_word: ὁμοθυμαδόν
  choice: 同心合意地
  rationale: 兼顾共同参与和共同心志，是现代汉语中自然且庄重的表达。
- source_word: ἐν τῷ ἱερῷ
  choice: 在圣殿里
  rationale: ἱερόν指整个圣殿范围而非内殿；正文采用汉语常用说法，并以脚注澄清。
- source_word: κλῶντές ... ἄρτον
  choice: 擘饼
  rationale: 保留路加—使徒行传中的固定表达及其可能具有的普通聚餐与圣餐双重回响，不在正文中限定解释。
- source_word: κατ’ οἶκον
  choice: 挨家挨户
  rationale: 表达κατά的分配意义，表明这行动在各家中反复进行，而非只在自己家里。
- source_word: μετελάμβανον τροφῆς
  choice: 一同用饭
  rationale: 未完成时表示持续进行；μεταλαμβάνω与食物属格表示领受、享用食物。结合群体语境，“一同用饭”自然表达共同进食，但不把动词过度强化为分配食物。
- source_word: ἐν ἀγαλλιάσει
  choice: 怀着欢喜
  rationale: 表达强烈而积极的喜乐，同时保持现代汉语的自然程度。
- source_word: ἀφελότητι καρδίας
  choice: 纯朴的心
  rationale: 紧贴该词所含的单纯、不矫饰、坦诚之意，同时保留它也可能指真诚或慷慨的语义空间。
theological_decisions:
- issue: “擘饼”是否应明确译为主餐或圣餐
  choice: 正文保留“擘饼”这一较宽泛的表达
  alternative: 明确译作普通聚餐，或明确译作举行主餐（圣餐）
  rationale: 紧接着的τροφῆς支持共同进食的语境，但“擘饼”在早期基督徒群体生活中也可能具有主餐的回响。正文不消除这种张力，脚注说明两种可能。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“同心合意”“擘饼”保留了熟悉的圣经语体；“坚持……聚集”“挨家挨户”“一同用饭”则使句意对普通读者清楚自然。脚注标记均置于正文相关词语之后。
