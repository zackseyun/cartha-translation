  text: Ἄνδρες ἀδελφοί, ἐξὸν εἰπεῖν μετὰ παρρησίας πρὸς ὑμᾶς περὶ τοῦ πατριάρχου Δαυίδ, ὅτι καὶ ἐτελεύτησεν καὶ ἐτάφη, καὶ τὸ μνῆμα αὐτοῦ ἔστιν ἐν ἡμῖν ἄχρι τῆς ἡμέρας ταύτης·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/029.yaml
  text: Men[a], brothers, I may speak to you with boldness about the patriarch David, that he both died and was buried, and his tomb is among us to this day.
translation:
  language: zh_hans
  text: 诸位弟兄[a]，关于先祖大卫，我可以坦率地对你们说：他确实死了，也被埋葬了；他的坟墓直到今天还在我们这里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“男人们，弟兄们”，是对在场以色列同胞的正式称呼。
    reason: 保留原文双重阳性呼语的形式信息，同时避免正文出现不自然的现代汉语。
lexical_decisions:
- source_word: Ἄνδρες ἀδελφοί
  choice: 诸位弟兄
  rationale: 这是对同胞听众的正式称呼。现代汉语若逐字译作“男人们，弟兄们”会生硬且造成误解；“诸位弟兄”自然、庄重，并保留阳性同胞称谓，脚注说明希腊文的双重称呼。
- source_word: ἐξὸν εἰπεῖν
  choice: 我可以……说
  rationale: 表达获准或有自由发言，而不只是具备说话能力；“我可以说”符合现代汉语习惯。
- source_word: μετὰ παρρησίας
  choice: 坦率地
  rationale: παρρησία在这里强调公开、无所隐讳地直言；“坦率地”比“大胆地”更直接体现言说方式，同时不排除勇气与确信。
- source_word: περὶ τοῦ πατριάρχου Δαυίδ
  choice: 关于先祖大卫
  rationale: πατριάρχης指受尊崇的民族先祖。“先祖”在现代汉语圣经语境中自然清楚，也避免“族长”可能使人只想到家族首领。原文没有“我们的”，故不增补。
- source_word: καὶ ἐτελεύτησεν καὶ ἐτάφη
  choice: 他确实死了，也埋葬了
  rationale: 两个καί共同突出死亡与埋葬这两项事实；汉语用“确实……也……”自然传达强调，第二个被动式按汉语习惯译为“埋葬了”。
- source_word: τὸ μνῆμα αὐτοῦ
  choice: 他的坟墓
  rationale: μνῆμα在本处指可辨认的埋葬地点；“坟墓”比“纪念碑”准确，也比单说“墓”略为庄重。
- source_word: ἔστιν ἐν ἡμῖν
  choice: 还在我们这里
  rationale: 表示该墓仍存在于说话者和听众所在的地方或群体中。“在我们这里”保留地点性，且比直译“在我们中间”更适合指坟墓。
- source_word: ἄχρι τῆς ἡμέρας ταύτης
  choice: 直到今天
  rationale: 自然传达从过去延续到彼得说话当日的时间含义。
theological_decisions:
- issue: 开头双重阳性呼语的表达
  choice: 诸位弟兄[a]
  alternative: 男人们，弟兄们；弟兄姊妹们
  rationale: 原文ἄνδρες ἀδελφοί是两个阳性复数呼格，用来正式称呼在场的以色列同胞。逐字保留两个名词在现代汉语中极不自然；译为“弟兄姊妹们”则会明确加入原文未说出的女性形式。因此正文采用自然且性别准确的“诸位弟兄”，并用脚注保存双重称呼这一形式信息。
- issue: 大卫之死与坟墓在论证中的明确性
  choice: 明确陈述他死了、埋葬了，并且坟墓仍在当地
  alternative: 将“死了”弱化为“寿终”，或将坟墓理解为纯象征
  rationale: 本节以可陈述的死亡、埋葬和仍存的坟墓为后续关于复活的论证铺路；译文保持原文的历史性陈述，不预先扩展后续神学结论。
translation_notes:
  register: 采用现代、庄重而适合公开宣讲的普通话。“诸位弟兄”体现正式呼语；“坦率地”传达直言无讳；句中用冒号引出彼得所陈述的内容，使长句在汉语中清楚流畅。
