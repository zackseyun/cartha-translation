base_translation:
  language: en
  yaml_path: translation/nt/acts/002/044.yaml
  text: And all the believers were together and had all things in common,[a]
translation:
  language: zh_hans
  text: 所有信徒都聚在一起[a]，凡物公用。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“都在同一个地方。”这个希腊语表达可以指众人同在或聚集。
    reason: 保留 ἐπὶ τὸ αὐτό 在共同聚集与处于同一地点之间的词义幅度。
lexical_decisions:
- source_word: πάντες
  choice: 所有
  rationale: 修饰名词化分词“信的人”，译作“所有”既保留全称范围，也符合现代汉语表达。
- source_word: δὲ
  choice: 不单独译出
  rationale: 此处主要承接上文，并无强烈转折；汉语叙事中省略连接词更自然，且不损失语义。
- source_word: οἱ πιστεύοντες
  choice: 信的人
  rationale: 现在时分词名词化，指相信并归属这一群体的人；“信的人”贴近原文，又比带有较固定宗教术语色彩的表达更直接。
- source_word: ἦσαν ἐπὶ τὸ αὐτό
  choice: 聚在一起
  rationale: 该表达可表示共同聚集，也可能着重于身处同一地点；正文采用自然的“聚在一起”，并以脚注保留地点意义的可能性。
- source_word: εἶχον
  choice: 有
  rationale: 未完成时描写当时持续或惯常的状态；汉语用“有”即可由语境自然体现这种状态。
- source_word: ἅπαντα κοινά
  choice: 一切共有
  rationale: 简洁保留“一切”与“共同拥有、共同使用”的核心含义，不额外限定具体财物范围或运作方式。
theological_decisions:
- issue: 群体共有生活的性质
  choice: 按叙事性陈述处理，描述信徒当时一切共有的生活状态。
  alternative: 将本节译成对所有基督徒群体都具有普遍约束力的经济制度命令。
  rationale: 希腊文是在叙述当时的情形，并未使用命令形式；译文既不把它弱化为偶尔分享，也不增添普遍制度性规定。
translation_notes:
  register: 采用现代、简洁而庄重的叙事语言。“聚在一起”通俗自然；“一切共有”凝练地保留原文结构及共同生活的张力。
