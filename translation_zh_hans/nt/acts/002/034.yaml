  text: οὐ γὰρ Δαυὶδ ἀνέβη εἰς τοὺς οὐρανούς, λέγει δὲ αὐτός· Εἶπεν ⸀ὁ κύριος τῷ κυρίῳ μου· Κάθου ἐκ δεξιῶν μου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/034.yaml
  text: For David did not ascend into the heavens[a], but he himself says, ‘The Lord said to my Lord, “Sit at my right hand,”’
translation:
  language: zh_hans
  text: '大卫并没有升到诸天[a]，但他自己说：


    “主对我主说：


    ‘你坐在我的右边，’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 见诗篇110:1。在希伯来文本中，第一个“主”代表神名“耶和华”；可参看译作：“耶和华对我主说。”
    reason: 说明旧约引文的希伯来文本背景及一种可行译法。
lexical_decisions:
- source_word: ἀνέβη
  choice: 升到
  rationale: 在本段语境中指升上天；“升到”自然明白，也保留向上升的动作和经文互文意味。
- source_word: τοὺς οὐρανούς
  choice: 诸天
  rationale: 希腊文为复数。“诸天”保留原文形式及圣经语体，同时在现代中文中仍可理解。
- source_word: λέγει δὲ αὐτός
  choice: 但他自己却说
  rationale: “但……却”表达 δέ 与前句的轻微转折，“他自己”保留 αὐτός 的强调；用现在时“说”引出仍具现时效力的经文引语。
- source_word: ὁ κύριος
  choice: 主
  rationale: 希腊文本用 κύριος；正文据希腊文译作“主”。所引诗篇的希伯来文本在此处是神名耶和华，另以脚注说明。
- source_word: τῷ κυρίῳ μου
  choice: 对我主
  rationale: 保留第二个 κύριος 与所有格“我的”的结构，也维持彼得论证中的弥赛亚含义；中文引语中“对我主说”简洁庄重。
- source_word: Κάθου
  choice: 你坐
  rationale: 以自然的中文命令表达该现在时中间语态命令式；补出“你”使直接引语清楚。
- source_word: ἐκ δεξιῶν μου
  choice: 在我的右边
  rationale: 该短语惯指尊荣与权柄的位置。“在我的右边”是自然中文，并准确传达其习惯意义。
theological_decisions:
- issue: 诗篇110:1引文中两处 κύριος 的译法
  choice: 正文两处都译作“主”：“主对我主说”。
  alternative: 第一处译作“耶和华”：“耶和华对我主说”。
  rationale: 《使徒行传》的希腊文本两处均用 κύριος，正文优先呈现所译原文，不直接把希伯来文本中的神名带入正文；但第一处在诗篇110:1的希伯来文本中代表神名耶和华，这一重要背景在脚注中保留。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“诸天”略带经文语体，用来保留希腊文复数；其余措辞力求自然。引号与分行呈现诗篇引文，末尾逗号保留本节与下一节未完的句法衔接。
