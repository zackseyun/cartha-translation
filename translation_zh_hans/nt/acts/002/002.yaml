  text: καὶ ἐγένετο ἄφνω ἐκ τοῦ οὐρανοῦ ἦχος ὥσπερ φερομένης πνοῆς βιαίας καὶ ἐπλήρωσεν ὅλον τὸν οἶκον οὗ ἦσαν καθήμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/002.yaml
  text: And suddenly there came from heaven a sound like that of a violent rushing wind[a], and it filled the whole house where they were sitting.
translation:
  language: zh_hans
  text: 忽然，有一种响声从天上传来，好像强劲的风急速吹过，充满了他们所坐的整座房子。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“好像强劲的风被吹送而来。”希腊文把这响声比作强劲、移动的气流；经文没有明确说当时实际有风。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: 有……下来
  rationale: 结合ἐκ τοῦ οὐρανοῦ，以现代汉语自然表达一个响声突然出现并从天而来的事件；不采用生硬的“发生了”。
- source_word: ἄφνω
  choice: 忽然
  rationale: 准确传达事件的突发性，简洁而庄重。
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: 从天上下来
  rationale: “天上”既可指上空，也保留来自属天领域的可能含义；“下来”符合汉语对声音来源和移动方向的自然表达。
- source_word: ἦχος
  choice: 响声
  rationale: 比“噪音”中性，也不像“轰鸣”那样过度限定声音性质。
- source_word: ὥσπερ
  choice: 仿佛
  rationale: 明确保留比喻关系，不把所听见的响声直接等同于实际的风。
- source_word: φερομένης πνοῆς βιαίας
  choice: 一阵猛烈刮来的风
  rationale: “猛烈”表达βιαίας的强劲力量，“刮来”自然呈现φερομένης所含的运动感；“一阵”符合现代汉语对风的量化习惯。
- source_word: ἐπλήρωσεν
  choice: 充满了
  rationale: 保留响声为动词的主语，表达声音遍及整个空间。
- source_word: ὅλον τὸν οἶκον
  choice: 整座房子
  rationale: 自然表达ὅλον的整体性；“座”适合作为房屋的量词。
- source_word: οὗ ἦσαν καθήμενοι
  choice: 他们坐着的
  rationale: 简洁、自然地表达所在地点及当时持续的坐姿状态。
theological_decisions:
- issue: 所描述的现象究竟是风声还是实际的风
  choice: 正文以“仿佛”保留比喻：响声像一阵猛烈刮来的风。
  alternative: 把经文译成有一阵实际的猛烈大风充满房子。
  rationale: 希腊文ὥσπερ明确引出比较；经文断言的是从天上来的响声，并未明确说现场出现了实际的风。译文不应消除这种区别。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“响声”保持中性，“仿佛”清楚标示明喻；句式按汉语信息顺序调整，同时保留声音从天而来、充满整座房子的叙事推进。
