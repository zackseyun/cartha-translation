  text: τῇ δεξιᾷ οὖν τοῦ θεοῦ ὑψωθεὶς τήν τε ἐπαγγελίαν τοῦ ⸂πνεύματος τοῦ ἁγίου⸃ λαβὼν παρὰ τοῦ πατρὸς ἐξέχεεν τοῦτο ⸀ὃ ⸀ὑμεῖς βλέπετε καὶ ἀκούετε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/033.yaml
  text: Therefore[a], having been exalted to the right hand of God, and having received from the Father the promise of the Holy Spirit[b], he has poured out this that you yourselves are seeing and hearing.
translation:
  language: zh_hans
  text: 所以，他既被高举到上帝的右边[a]，又从父那里领受了圣灵的应许[b]，就将这倾倒下来——这正是你们所看见、所听见的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“借着上帝的右手”。这里的希腊语与格既可表示位置，即“到上帝的右边”，也可表示方式或凭借，即“借着上帝的右手”。
    reason: alternative_reading
  - marker: b
    text: 也可理解为“关于圣灵的应许”；按上下文，也可能是指圣灵本身作为所应许的恩赐。
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ δεξιᾷ τοῦ θεοῦ
  choice: 到上帝的右边
  rationale: 与上下文中弥赛亚升高、坐在上帝右边的登基意象相合；希腊语与格也可能表示“借着上帝的右手”，故在脚注保留。
- source_word: οὖν
  choice: 所以
  rationale: 自然表达由前文复活与大卫预言所推出的结论。
- source_word: ὑψωθεὶς
  choice: 被高举
  rationale: 保留被动语态，并传达升高、尊荣和登基的含义。
- source_word: τήν τε ἐπαγγελίαν τοῦ πνεύματος τοῦ ἁγίου
  choice: 所应许的圣灵
  rationale: 按语义自然表达圣灵是所应许并被赐下的礼物；原结构也可能指关于圣灵的应许，故以脚注保留。
- source_word: λαβὼν παρὰ τοῦ πατρὸς
  choice: 从父领受了
  rationale: 保留παρά加属格所表达的来源，并反映分词动作先于主要动词。
- source_word: ἐξέχεεν
  choice: 浇灌下来
  rationale: “浇灌”延续本段引用约珥书的意象；“下来”在汉语中自然呈现从高处赐下的语境，但不另行指定对象。
- source_word: τοῦτο
  choice: 这一切
  rationale: 希腊语为单数指示代词，所指是听众正在目睹和听见的整体事件；现代汉语用“这一切”较自然，又不把它明确改写为“圣灵”或“恩赐”。
- source_word: ὑμεῖς βλέπετε καὶ ἀκούετε
  choice: 你们现在所看见、所听见的
  rationale: 显明主语“你们”以保留强调，“现在”传达两个现在时动词所指的当下经验。
theological_decisions:
- issue: τῇ δεξιᾷ τοῦ θεοῦ表示被高举“到上帝右边”还是“借着上帝的右手”
  choice: 到上帝的右边
  alternative: 借着上帝的右手
  rationale: 紧接着的诗篇110篇引文突出基督在上帝右边的登基，因此正文采用处所解释；与格容许的工具解释则留在脚注中。
- issue: τὴν ἐπαγγελίαν τοῦ πνεύματος τοῦ ἁγίου是“所应许的圣灵”还是“关于圣灵的应许”
  choice: 所应许的圣灵
  alternative: 关于圣灵的应许
  rationale: 下文“浇灌”最自然地指圣灵作为所应许的恩赐；但属格结构本身仍可理解为有关圣灵的应许，所以不在脚注中消除这一张力。
- issue: τοῦτο的指代范围
  choice: 这一切
  alternative: 这事；这圣灵
  rationale: 保留指示词的开放性，使其可指五旬节时可见可闻的整体彰显，而不把希腊文未明说的名词加进正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“被高举”“领受”“浇灌”保留经文的升高与圣灵倾注意象；句式按汉语重组，避免机械复制希腊语连续分词结构。所有脚注标记均已置于正文对应位置。
