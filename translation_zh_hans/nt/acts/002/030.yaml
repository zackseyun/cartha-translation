  text: προφήτης οὖν ὑπάρχων, καὶ εἰδὼς ὅτι ὅρκῳ ὤμοσεν αὐτῷ ὁ θεὸς ἐκ καρποῦ τῆς ὀσφύος ⸀αὐτοῦ καθίσαι ἐπὶ ⸂τὸν θρόνον⸃ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/030.yaml
  text: Therefore[a], being a prophet and knowing that God had sworn to him with an oath to seat one from the fruit of his loins on his throne,
translation:
  language: zh_hans
  text: 所以，大卫既是先知，又知道上帝曾向他起誓，要使他腰间所出的一个后裔[a]坐在他的宝座上，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他腰间所出的一个后裔”，直译为“从他腰间的果实中”。这是指血缘后裔的习语。
    reason: 说明ἐκ καρποῦ τῆς ὀσφύος的字面表达及其血缘含义。
lexical_decisions:
- source_word: προφήτης
  choice: 先知
  rationale: 现代汉语中对凭上帝启示发言之人的标准译法，准确而自然。
- source_word: οὖν
  choice: 所以
  rationale: 承接上文关于大卫的论述，清楚表达推论关系；比“因此”更符合自然叙述语体。
- source_word: ὑπάρχων
  choice: 既是
  rationale: 与后面的“又知道”构成自然的汉语并列结构，也保留该分词所表达的背景或原因。
- source_word: εἰδὼς
  choice: 又知道
  rationale: 与ὑπάρχων并列；用汉语谓语结构表达，比机械保留分词形式更自然。
- source_word: ὅρκῳ ὤμοσεν αὐτῷ ὁ θεός
  choice: 上帝曾向他起誓
  rationale: “起誓”本身已包含ὅρκῳ ὤμοσεν的庄严誓言含义，避免汉语中“以誓言起誓”的生硬重复；“曾”标明相对于彼得所述时点的先行事件。
- source_word: ἐκ καρποῦ τῆς ὀσφύος αὐτοῦ
  choice: 从他腰间所出的后裔中
  rationale: 既保留“腰间所出”的具体血缘意象，又以“后裔”使现代读者明确这是指亲生后代。
- source_word: καθίσαι
  choice: 立一位坐
  rationale: 该不定式以“上帝”为隐含施事者，带有使其就座、设立为王的意味；“立一位坐在”保留这种使动和登位色彩。
- source_word: ἐπὶ τὸν θρόνον αὐτοῦ
  choice: 在他的宝座上
  rationale: 自然表达登基掌权；末尾“他的”依语境最自然地指大卫，同时不在正文中额外解释。
theological_decisions:
- issue: 大卫之约的弥赛亚君王应许
  choice: 保留“后裔”和“宝座”的王朝性语言，不直接加入“弥赛亚”或“基督”。
  alternative: 译作“要使弥赛亚坐在他的宝座上”。
  rationale: 本节表述的是上帝向大卫所起的誓；彼得在下文将其应用于耶稣。译文让上下文作出基督论指向，不把下文的明示提前加入本节。
- issue: 宝座所属者
  choice: 保留“他的宝座”，依语境指大卫的宝座。
  alternative: 明译为“大卫的宝座”。
  rationale: 希腊文使用代词αὐτοῦ。保留代词既忠于形式，也避免消除原文虽不大却真实存在的指代空间。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“大卫”在希腊文中由上文明确，本节主语省略；中文为避免代词指涉含混而补出其名。“立一位坐在”兼顾καθίσαι的使动意味与王位语境。保留句末逗号，因为本节在希腊文和叙事上接续下一节。
