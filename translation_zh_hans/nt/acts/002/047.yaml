  source_fidelity: 译文准确传达了两个现在分词所描写的持续状态：“赞美上帝”与“得到全体民众的好感”。“主天天把正在得救的人加到他们中间”恰当反映 προσετίθει 的未完成体、καθ’ ἡμέραν 的逐日性，以及 τοὺς σῳζομένους 的现在时被动、过程性表达。对 ἐπὶ τὸ αὐτό 采取“加入现有群体”的上下文释义，并以脚注保留“聚在一起／在同一处”的可能性，符合原文的句法与文本解释上的不确定性。
  naturalness: 现代普通话自然、清楚且保持适度庄重。“得到全体民众的好感”和“加到他们中间”均通顺；“正在得救的人”虽较书面，但在此有效保留原文的进行性和被动意义。
  terminology: “上帝”对应 θεός，“主”对应 κύριος，译名和宗教语域一致。译文没有把“正在得救”改成静态、完成式的“得救者”，也未对救恩过程作超出语法本身的教义推断。
