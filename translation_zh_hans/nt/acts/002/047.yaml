source:
  edition: SBLGNT
  text: αἰνοῦντες τὸν θεὸν καὶ ἔχοντες χάριν πρὸς ὅλον τὸν λαόν. ὁ δὲ κύριος προσετίθει τοὺς σῳζομένους καθ’ ἡμέραν ⸂ἐπὶ τὸ αὐτό⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/047.yaml
  text: praising God and having favor with all the people[a]. And the Lord was adding day by day those who were being saved to them.
translation:
  language: zh_hans
  text: 他们赞美上帝，也得到全体民众的好感。主天天把正在得救的人加到他们中间[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “加到他们中间”所对应的希腊语短语也可理解为“聚在一起”或“在同一处”。
    reason: 保留 ἐπὶ τὸ αὐτό 在本句中的句法与语义歧义。
lexical_decisions:
- source_word: αἰνοῦντες τὸν θεόν
  choice: 赞美上帝
  rationale: 现在分词承接上文，描写群体持续进行的活动；“赞美上帝”自然、庄重，也保留动作含义。
- source_word: ἔχοντες χάριν πρὸς ὅλον τὸν λαόν
  choice: 得到全体民众的好感
  rationale: ἔχειν χάριν πρός 在此表示受到他人的善意或认可，而非主动向人施恩；“全体民众”保留 ὅλον τὸν λαόν 的整体范围。
- source_word: ὁ δὲ κύριος
  choice: 主
  rationale: κύριος 按新约叙事中的通常用法译作“主”；δέ 在中文中无需机械译出，句间转接已足够清楚。
- source_word: προσετίθει
  choice: 天天把……加到
  rationale: 未完成过去时表示持续或反复发生的行动；与 καθ’ ἡμέραν 合译为“天天把……加到”，在现代汉语中自然体现这种反复性。
- source_word: τοὺς σῳζομένους
  choice: 正在得救的人
  rationale: 现在时被动分词将这些人呈现为正在经历拯救；“正在得救”保留过程性与被动意义，不把它改写成静态的“得救者”。
- source_word: καθ’ ἡμέραν
  choice: 天天
  rationale: 简洁自然地表达逐日、反复发生的意思。
- source_word: ἐπὶ τὸ αὐτό
  choice: 加到他们中间
  rationale: 结合 προσετίθει，语境很可能指加入已有的信徒群体。“他们中间”比“他们的人数中”少一层解释性增补；该短语也可表示“聚在一起”或“在同一处”，故以脚注保留歧义。
theological_decisions:
- issue: τοὺς σῳζομένους 中救恩动作的体貌
  choice: 正在得救的人
  alternative: 已经得救的人；得救者
  rationale: 希腊文现在时被动分词具有进行中的动作色彩。译文只反映该处的语法观察角度，不借此裁定有关救恩次序或完成阶段的教派争论。
- issue: ἐπὶ τὸ αὐτό 的句法和所指
  choice: 加到他们中间
  alternative: 使正在得救的人聚在一起；加到他们的人数中
  rationale: 在 προσετίθει 之后，加入现有群体最符合上下文，但 ἐπὶ τὸ αὐτό 本身常可表示“聚在一起”或“在同一处”。正文采用语境中较可能且较少增补的表达，并在脚注中保存真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“全体民众”避免“百姓”可能带来的古雅感；“正在得救的人”虽略带书面色彩，却有助于忠实保留原文的进行与被动意义。
