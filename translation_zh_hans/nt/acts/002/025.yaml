  text: Δαυὶδ γὰρ λέγει εἰς αὐτόν· Προορώμην τὸν κύριον ἐνώπιόν μου διὰ παντός, ὅτι ἐκ δεξιῶν μού ἐστιν ἵνα μὴ σαλευθῶ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/025.yaml
  text: For David says concerning him, ‘I kept seeing the Lord before me continually, because he is at my right hand, so that I may not be shaken.’
translation:
  language: zh_hans
  text: 因为大卫论到他这样说：“我常看见[a]主[b]在我面前，因为他在我右边，使我不致动摇。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我预先看见”。这个希腊动词在某些语境中可指“预见”，但这里前后语句更支持持续看见或一直把主置于自己面前的意思。
    reason: lexical_alternative
  - marker: b
    text: 彼得在这里引用《诗篇》16:8。该诗篇的希伯来文本此处使用的是上帝的圣名，通常译作“耶和华”。
    reason: cross_reference
lexical_decisions:
- source_word: λέγει εἰς αὐτόν
  choice: 论到他说
  rationale: 这里的 εἰς αὐτόν 是引述语中的关系用法，表示大卫所说的话是论到此人，并非直接对他说话。
- source_word: Προορώμην
  choice: 我总看见
  rationale: 未完成时配合 διὰ παντός，表达持续或惯常的动作；“总看见”在现代汉语中自然地保留这种持续意味，同时不把该词限定为预知未来。
- source_word: κύριον
  choice: 主
  rationale: 按希腊文本直译为“主”，不在正文中进一步指明所指，从而保留引文在本段中的神学张力。
- source_word: ἐνώπιόν μου
  choice: 在我面前
  rationale: 保留原文的空间与关系意象，表达自然清楚。
- source_word: διὰ παντός
  choice: 总
  rationale: 表示一直、始终；与“看见”结合，简洁地传达持续性。
- source_word: ἐκ δεξιῶν μού
  choice: 在我右边
  rationale: 准确表达处于右侧的位置，也保留可能含有扶持、保护意味的传统意象，而不把该含义明说出来。
- source_word: ἵνα μὴ σαλευθῶ
  choice: 使我不至动摇
  rationale: 保留 ἵνα 所表达的目的或结果关系；“动摇”传达被撼动、失去稳固状态的比喻。
theological_decisions:
- issue: 彼得引用诗篇时“主”所指为何
  choice: 正文保留“主”，不作进一步身份说明
  alternative: 译作“耶和华”或直接解释为“弥赛亚”
  rationale: 彼得在本段中以基督论方式运用诗篇，但此处希腊文本本身是 κύριον。正文不以解释替代引文措辞，以保留希腊引文、希伯来诗篇背景和彼得论证之间的张力。
- issue: ἵνα μὴ σαλευθῶ 的目的与结果色彩
  choice: 使我不至动摇
  alternative: 所以我必不动摇；免得我动摇
  rationale: “使我不至”既可自然表达结果，也保留目的意味，不把虚拟式过度处理为确定的简单将来。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“论到他说”保留引述公式；引文句式简洁，并保有诗篇语言的节奏。所有脚注标记均已置于正文相应词语之后。
