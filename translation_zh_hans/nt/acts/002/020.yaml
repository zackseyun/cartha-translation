base_translation:
  language: en
  yaml_path: translation/nt/acts/002/020.yaml
  text: The sun will be turned into darkness[a], and the moon into blood, before the great and glorious day of the Lord comes.
translation:
  language: zh_hans
  text: 在主那大而显著[a]的日子来到以前，太阳要变为黑暗，月亮要变为血。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “显著”也可译作“显明”、“辉煌”或“引人注目”；原词既可指清楚显现，也可指光辉盛大。
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταστραφήσεται
  choice: 要变为
  rationale: 表达将来被动所指的状态转变；汉语无需生硬使用被动标记，也不说明转变的机制。
- source_word: εἰς σκότος
  choice: 变为黑暗
  rationale: 保留εἰς所表达的结果状态，并采用自然的现代汉语。
- source_word: εἰς αἷμα
  choice: 变为血
  rationale: 保留原文鲜明、直接的先知性意象，不解释为“血红色”。
- source_word: πρὶν ἢ ἐλθεῖν
  choice: 来到以前
  rationale: 准确表达一事发生在另一事件之前的时间关系。
- source_word: ἡμέραν κυρίου
  choice: 主……的日子
  rationale: 保留先知传统中“主的日子”这一固定意象，并避免译成可能让现代读者误解为星期日的说法。
- source_word: μεγάλην
  choice: 伟大
  rationale: 直接传达μέγας的基本意义，同时保持庄重的先知性语体。
- source_word: ἐπιφανῆ
  choice: 显赫
  rationale: 该词可指清楚显现、引人注目，也可带有辉煌盛大之意；“显赫”在现代汉语中较自然，并能兼顾“引人瞩目”与“光辉盛大”的语义。
theological_decisions:
- issue: 约珥书引文背景下ἡμέραν κυρίου的表达
  choice: 主……的日子
  alternative: 主日
  rationale: “主的日子”是指上帝介入、审判或拯救的先知性用语；不译作“主日”，以免带入后来指星期日的教会用法。
- issue: 末世语境中ἐπιφανῆ的多重语义
  choice: 显赫
  alternative: 显明；辉煌；引人瞩目
  rationale: 原词兼有显现可见、引人注目和辉煌盛大的可能含义。“显赫”用于正文以保持自然庄重，其余重要语义以脚注保留，不把原文的张力限定为单一解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。为使复杂的后置时间结构在汉语中清楚自然，加入“这一切都发生在”，没有增加新的事件内容；同时保留“变为黑暗”“变为血”的强烈先知性意象。
