id: ACT.2.27
reference: Acts 2:27
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὅτι οὐκ ἐγκαταλείψεις τὴν ψυχήν μου εἰς ⸀ᾅδην, οὐδὲ δώσεις τὸν ὅσιόν σου ἰδεῖν διαφθοράν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/027.yaml
  text: because you will not abandon my soul to Hades[c][b][a], nor will you let your Holy One see decay.
translation:
  language: zh_hans
  text: 因为你必不把我的生命撇在阴间[a]，也不让你的圣者[b]见朽坏[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “阴间”译自希腊语ᾅδης（海地斯），指死者所在之处；本段所引诗篇的希伯来文本用“阴府”（Sheol）。
    reason: 保留希腊原文与希伯来诗篇背景的差异，并避免与“地狱”混同。
  - marker: b
    text: “圣者”也可译作“忠信者”或“虔诚者”。
    reason: ὅσιος兼有圣洁、虔诚和忠信的词义范围。
  - marker: c
    text: 这里的“朽坏”指身体腐朽、分解；传统也常译作“败坏”。
    reason: 明确διαφθορά在本段复活语境中的身体性含义，避免被理解为道德败坏。
lexical_decisions:
- source_word: ἐγκαταλείψεις
  choice: 撇在
  rationale: 这里指把人留弃在某个境地或地方。“撇在”自然地表达不予遗弃、任其留在其中的意思，并与后面的地点短语顺畅衔接。
- source_word: τὴν ψυχήν μου
  choice: 我的生命
  rationale: ψυχή在这段诗篇引文中可指人的生命或其自身。“我的生命”符合现代汉语，也避免把本句过度限定为对灵魂与身体关系的技术性陈述。
- source_word: εἰς ᾅδην
  choice: 在阴间
  rationale: ᾅδης在此指死者所在之处，并非后世语境中专指刑罚之地的“地狱”。受汉语动词“撇在”的搭配要求，εἰς自然译为“在”；脚注说明希腊词及其希伯来背景。
- source_word: δώσεις
  choice: 让
  rationale: δίδωμι与不定式连用时在这里表示准许或容让；“让”是清楚自然的现代汉语表达。
- source_word: τὸν ὅσιόν σου
  choice: 你的圣者
  rationale: ὅσιος可表示对神圣洁、虔诚或忠信的人。“你的圣者”保留主要词义，也符合彼得在上下文中把这话用于耶稣的基督论指向，而不增添原文之外的解释。
- source_word: ἰδεῖν διαφθοράν
  choice: 见朽坏
  rationale: 保留“见”的原文意象；“朽坏”在上下文中指身体的腐朽，较“败坏”更不易被误解为道德败坏。
theological_decisions:
- issue: 复活语境中ᾅδης的译法
  choice: 阴间
  alternative: 死者之境；海地斯；坟墓；地狱
  rationale: “阴间”能表达死者所在之处，同时避免把ᾅδης直接等同于最终刑罚之地。“坟墓”会把范围收窄到埋葬地点；脚注保留希腊用词及诗篇希伯来文本“阴府”的背景。
- issue: τὸν ὅσιόν σου的基督论指向
  choice: 你的圣者
  alternative: 你忠信的人；你的虔诚者
  rationale: “圣者”保留ὅσιος的圣洁含义及本章对耶稣的指认；脚注同时保留“忠信者”这一真实词义可能，避免把词义范围默默缩窄。
- issue: ψυχή的人论含义
  choice: 生命
  alternative: 灵魂；我本人
  rationale: 本句并不要求读者把ψυχή理解为与身体分离的技术性实体；“生命”保留其在死亡与复活语境中的自然含义，同时不否认“灵魂”这一可能译法。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“撇在阴间”和“见朽坏”略带诗歌引文的凝练感，但仍为普通读者可理解；不使用“地狱”，以免加入原文在此没有明确表达的刑罚含义。
