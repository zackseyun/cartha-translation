    rationale: κτήματα可特别指土地或地产，但其基本义可指取得的产业、持有物；本节与ὑπάρξεις并列时，译作“产业”能保留类别区别而不限定为农田。
  - severity: medium
    issue: “所得的”将αὐτά的含蓄所指确定为售卖所得。
    rationale: 这在语境中可成立，但原文代词没有明确说“所得”；宜在正文保留“这些”，并以脚注说明其可能所指。
  - severity: medium
