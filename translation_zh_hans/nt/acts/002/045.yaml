  verdict: revise
  source_fidelity: 原文两个未完成时动词（ἐπίπρασκον、διεμέριζον）描写持续或反复的变卖与分派；κτήματα不宜限定为“田产”，应译得较宽，如“产业”。αὐτά的所指在语法上保持简略，既可能回指产业和财物，也可在变卖的语境中涵盖其所得。草稿将其明确为“所得的”，虽有脚注说明，却不必要地缩窄了原文的含蓄。
  naturalness: 草稿的“把所得的分给众人，照各人的需要分配”重复使用“分给／分配”，且后半句缺少自然的承接对象，显得累赘。修订为一个连贯的按需分派结构，更符合现代标准汉语。
  terminology: “产业和财物”较“田产和财物”更准确地区分κτήματα与ὑπάρξεις，同时不把前者限定为农业土地。“众人”和“按各人的需要”均合乎经文语义与庄重现代语体。
