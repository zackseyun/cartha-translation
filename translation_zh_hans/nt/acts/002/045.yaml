revisions:
- from: 他们不断变卖自己的田产和财物，把所得的分给众人[a]，照各人的需要分配。
  to: 他们不断地变卖产业和财物，并按各人的需要把这些分给众人[a]。
  rationale: 修订以“不断地”体现两个未完成时所显示的持续或反复实践；以“产业和财物”保留两个所有物名词的区别，且不把κτήματα过度限定为田地。将分派动作合并为“按各人的需要把这些分给众人”，既忠实表达按需分配，也避免草稿的重复。脚注锚定在“这些”处，准确对应原文代词的歧义。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T03:29:19Z'
