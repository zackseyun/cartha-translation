  text: καὶ τὰ κτήματα καὶ τὰς ὑπάρξεις ἐπίπρασκον καὶ διεμέριζον αὐτὰ πᾶσιν καθότι ἄν τις χρείαν εἶχεν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/045.yaml
  text: And they were selling their property and possessions and distributing them to all[a], as anyone had need.
translation:
  language: zh_hans
  text: 他们不断地变卖产业和财物，并按各人的需要把这些分给众人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这些”直译为“它们”。原文可指前述的产业和财物；在变卖的语境中，也可涵盖变卖所得。
    reason: 保留代词αὐτά所指的语义含蓄，避免正文将其限定为售卖所得。
lexical_decisions:
- source_word: κτήματα
  choice: 田产
  rationale: 该词常指所取得并持有的产业，尤其可指土地等不动产；译作“田产”能与后面的“财物”保持类别上的区别。
- source_word: ὑπάρξεις
  choice: 财物
  rationale: 该词指一个人所拥有的东西或财产；“财物”在现代汉语中自然，也可与“田产”相区分。
- source_word: ἐπίπρασκον
  choice: 不断变卖
  rationale: 未完成时体现过去持续或反复发生的行动；“不断变卖”比单纯的“卖了”更能传达这一体貌。
- source_word: διεμέριζον
  choice: 分给／分配
  rationale: 该动词在此表示按需要把财物或售卖所得分派给群体中的人；采用“分给……分配”使中文自然，并保留分派之意。
- source_word: αὐτά
  choice: 所得的
  rationale: 代词字面可回指田产和财物，但在变卖之后，语境也可理解为售卖所得；正文用“所得的”使行动逻辑清楚，同时以脚注说明原文较含蓄。
- source_word: πᾶσιν
  choice: 众人
  rationale: 与格复数表示接受者；“众人”简洁地保留其广泛范围，而后面的按需条件说明并非人人所得相同。
- source_word: καθότι ἄν τις χρείαν εἶχεν
  choice: 照各人的需要分配
  rationale: 该结构表达依任何人的实际需要而给予；此译法自然，并保留不特定个体及按需分配的含义。
theological_decisions:
- issue: 信徒分享财物的性质
  choice: 译文描述持续、反复地变卖并按需要分配的做法，不把它表述为一项废除私人所有权的普遍命令。
  alternative: 将本节理解为所有基督徒都必须实行完全公有制。
  rationale: 两个未完成时动词呈现持续或反复的实践；经文说他们变卖并分配，却没有明确宣称私人所有权已完全废除，也没有在本节中将此规定为普世制度。译文因此保持描述性，不加入文本未明说的社会经济 doctrine。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不断变卖”呈现希腊语未完成时的持续或反复意味；“田产和财物”尽量保留两个所有物名词的区别。正文中的“所得的”属于语境性明确化，已用脚注保存原文代词的含蓄。
