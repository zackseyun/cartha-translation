base_translation:
  language: en
  yaml_path: translation/nt/acts/002/008.yaml
  text: And how is it that each of us hears in our own native language?[a]
translation:
  language: zh_hans
  text: 那么，我们怎么会各自听见自己的母语呢？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们各自在自己出生于其中的方言中听见。”其中“方言”也可译为“语言”。
    reason: 保留διάλεκτος可指“方言”或“语言”的词义空间，并反映ἐν ᾗ ἐγεννήθημεν与该词相连的原文结构。
lexical_decisions:
- source_word: πῶς
  choice: 怎么会
  rationale: 此处引出带有惊讶意味的疑问；“怎么会”比单纯的“怎么”更自然地传达这种语气。
- source_word: ἡμεῖς…ἕκαστος
  choice: 我们……各自
  rationale: 保留ἡμεῖς的强调性包容和ἕκαστος的逐一、分配意义，同时符合现代汉语表达。
- source_word: ἀκούομεν
  choice: 听见
  rationale: 表示众人实际听到某种言语；“听见”自然传达感知到声音及其语言内容。
- source_word: τῇ ἰδίᾳ διαλέκτῳ ἡμῶν
  choice: 自己……的方言
  rationale: ἰδίᾳ强调各人自己的；διάλεκτος可指语言或方言。此处保留较贴近原文的“方言”，不预先消除其词义范围。
- source_word: ἐν ᾗ ἐγεννήθημεν
  choice: 出生之地的
  rationale: 原文直译为“我们在其中出生的”，关系代词所指为阴性的διάλεκτος；汉语若说“在其中出生的方言”不自然，因此译为“出生之地的方言”，表达与出生地相联系的本地方言，同时在脚注保留更直译形式。
theological_decisions: []
translation_notes:
  register: 采用现代、自然而庄重的口语化疑问句。“那么”承接上文；句末“呢”表达惊讶而不过分强化。正文以“方言”贴近διάλεκτος，脚注补出“语言”的可能译法和关系从句的直译。
