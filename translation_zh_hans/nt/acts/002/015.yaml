  text: οὐ γὰρ ὡς ὑμεῖς ὑπολαμβάνετε οὗτοι μεθύουσιν, ἔστιν γὰρ ὥρα τρίτη τῆς ἡμέρας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/015.yaml
  text: For these are not drunk[a], as you suppose, for it is the third hour of the day.
translation:
  language: zh_hans
  text: 这些人并没有像你们所想的那样喝醉，因为现在才是白天的第三个小时[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 按犹太人的计时方法，约为上午九点。
    reason: cultural_note
lexical_decisions:
- source_word: οὐ γὰρ
  choice: 并不……因为
  rationale: οὐ否定醉酒的判断；γάρ承接上文并引出解释，汉语用后半句“因为”自然呈现论证关系。
- source_word: ὡς ὑμεῖς ὑπολαμβάνετε
  choice: 像你们所想的那样
  rationale: 保留ὡς的比较表达、ὑμεῖς的直接复数称呼，以及ὑπολαμβάνετε在此“以为、认为”的含义。
- source_word: οὗτοι
  choice: 这些人
  rationale: 现代汉语单说“这些”容易显得残缺；补出量词性中心语“人”明确指向在场群体，并未限定性别。
- source_word: μεθύουσιν
  choice: 喝醉了
  rationale: 自然表达被指控的醉酒状态，也保留动词与结果状态相结合的含义。
- source_word: ἔστιν γὰρ ὥρα τρίτη τῆς ἡμέρας
  choice: 因为现在不过是白天的第三个小时
  rationale: 保留犹太计时法的原有说法；“现在”使ἔστιν在语境中的时间指向清楚，“不过”传达以时辰尚早来反驳指控的语用力量。
- source_word: ὥρα τρίτη
  choice: 第三个小时
  rationale: 正文不直接换算成现代钟点，以保留源文的历史计时表达；换算信息置于脚注。
theological_decisions: []
