  text: 但另一些人讥笑着说：“他们喝足了甜酒[a]！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“新酒”。希腊语γλεῦκος指甜的新酒；传统译作“新酒”，但“甜酒”更能表达其甜味。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτεροι
  choice: 另一些人
  rationale: 该词在这里作名词用，指人群中的另一部分人；“另一些人”自然地表达与前述人群的区别。
- source_word: δὲ
  choice: 但
  rationale: 在语境中与前一节众人的惊讶和询问形成对比，用“但”最贴切。
- source_word: διαχλευάζοντες
  choice: 讥笑着
  rationale: 该分词表示带有轻蔑意味的嘲弄；“讥笑着”既保留语气，也符合现代汉语表达。
- source_word: ἔλεγον
  choice: 说
  rationale: 希腊语未完成时态可表示当时持续或反复的言说；汉语在此用“讥笑着说”即可由语境自然呈现其过程性。
- source_word: ὅτι
  choice: 直接引语引号
  rationale: ὅτι引出所说的内容；现代汉语在此采用直接引语更自然。
- source_word: Γλεύκους
  choice: 甜酒
  rationale: γλεῦκος指甜的新鲜酒或甜酒；“甜酒”比“新酒”更直接呈现其词义重点，同时以脚注保留传统译法。
- source_word: μεμεστωμένοι
  choice: 灌满了
  rationale: 完成时被动分词描述他们被酒充满后的状态；“灌满了”在嘲讽醉酒的语境中自然有力，并保留“充满”的意象。
- source_word: εἰσίν
  choice: （体现在“灌满了”中）
  rationale: 系词与完成时被动分词共同构成状态表达；汉语无需另译“是”，由“灌满了”自然承载。
