  text: καὶ ἔσται πᾶς ὃς ⸀ἐὰν ἐπικαλέσηται τὸ ὄνομα κυρίου σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/021.yaml
  text: And it shall be that everyone who calls on the name of the Lord will be saved[a].
translation:
  language: zh_hans
  text: 到那时，凡求告主名的，都必得救。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“无论谁求告主名，都必得救”。这句话呼应约珥书2:32；在那里，“主”指耶和华，而彼得在这里把这段经文用于他对耶稣的宣讲中。
    reason: alternative_reading
lexical_decisions:
- source_word: ἔσται
  choice: 到那时
  rationale: 此处是引文中的将来表达，承接前文末世性预告；“到那时”在现代汉语中自然、庄重，也避免生硬直译为“将要发生”。
- source_word: πᾶς ὃς ἐὰν
  choice: 凡……的，都
  rationale: 这一结构表达不限定对象的普遍条件；“凡……的，都”准确保留其普遍范围，并符合现代汉语习惯。
- source_word: ἐπικαλέσηται
  choice: 求告
  rationale: ἐπικαλέω与“名”连用时，指在敬拜和倚赖中呼求、祈求；“求告”保留了圣经表达的宗教内涵，又为现代读者所理解。
- source_word: τὸ ὄνομα
  choice: 名
  rationale: 保留“求告……名”这一圣经惯用语，不将“名”释义化，以保存其代表身份、权柄和临在的丰富含义。
- source_word: κυρίου
  choice: 主
  rationale: κύριος译为“主”，既忠实于希腊文本，也保留其在约珥书原语境与使徒行传基督论语境之间的指涉张力。
- source_word: σωθήσεται
  choice: 必得救
  rationale: 将来被动形式在这一应许中可自然译为“必得救”；既表达确定的将来结果，也保留拯救、解救的救恩含义。
theological_decisions:
- issue: 彼得引用约珥书时“主”的指涉
  choice: 正文只译作“主”，不明确限定所指。
  alternative: 在约珥书原语境中明确作“耶和华”，或在使徒行传的宣讲语境中明确作“耶稣”。
  rationale: 希腊文本本身使用κύριος。约珥书原语境所指是耶和华，而彼得在这里把引文置于以耶稣为中心的宣讲中。正文保留“主”，可忠实保存这种真实的互文关系和神学张力，而不替读者预先消解。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“到那时”承接预言语境；“求告主名”和“必得救”保留圣经惯用表达。脚注标记已在正文中以[a]标出。
