  text: Ἀκούσαντες δὲ κατενύγησαν ⸂τὴν καρδίαν⸃, εἶπόν τε πρὸς τὸν Πέτρον καὶ τοὺς λοιποὺς ἀποστόλους· Τί ⸀ποιήσωμεν, ἄνδρες ἀδελφοί;
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/037.yaml
  text: When they heard this[a], they were pierced to the heart, and they said to Peter and the rest of the apostles, “What should we do[b], brothers?”
translation:
  language: zh_hans
  text: 他们听见这话，内心如被刺痛[a]，就对彼得和其余的使徒说：“弟兄们[b]，我们该怎么办？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“心中深受刺痛”。希腊语形容一种尖锐而强烈的内心触动或痛苦。
    reason: lexical_alternative
  - marker: b
    text: 希腊语直译“诸位男子，弟兄们”。这是惯用的称呼，可按语境译为“弟兄们”；在某些语境中也可能具有较广泛的群体指称。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσαντες
  choice: 他们听见这话
  rationale: 不定过去时分词引出众人听完彼得前述讲话后的反应；“这话”由上下文自然补出，使现代汉语完整顺畅。
- source_word: δὲ
  choice: 不单独译出
  rationale: 此处主要推进叙事，并无强烈转折；汉语靠句序即可自然衔接，无须机械加入“于是”或“但”。
- source_word: κατενύγησαν τὴν καρδίαν
  choice: 心如被刺
  rationale: 保留原文“刺入/刺痛内心”的鲜明隐喻，同时表达强烈的内在触动、痛苦或自觉有罪，而不把其神学含义收窄为单一解释。
- source_word: εἶπόν τε
  choice: 就……说
  rationale: τε紧密连接听见、内心受触动和开口询问；“就”符合汉语叙事中的连续反应。
- source_word: πρὸς τὸν Πέτρον καὶ τοὺς λοιποὺς ἀποστόλους
  choice: 对彼得和其余的使徒
  rationale: “其余的”准确表明彼得之外的其他使徒，并保留原文对彼得的单独点名。
- source_word: Τί ποιήσωμεν
  choice: 我们该怎么办
  rationale: 不定过去时虚拟语气在此表示商议，询问应采取什么行动；“该怎么办”是自然、清楚的现代汉语。
- source_word: ἄνδρες ἀδελφοί
  choice: 弟兄们
  rationale: 这是惯用的呼语；正文保留阳性亲属称谓，脚注说明其较直译形式及语境中可能具有的广泛指称。
theological_decisions:
- issue: κατενύγησαν τὴν καρδίαν所表达的内在反应
  choice: 保留“心如被刺”的隐喻
  alternative: 译为“深感悔悟”或“深受责备”
  rationale: 原文描写尖锐而深刻的内心触动，却没有在本节明说其完整神学性质；保留隐喻可避免提前限定为悔改、定罪感或一般悲痛中的任何一种。
- issue: ἄνδρες ἀδελφοί的性别指向
  choice: 正文译作“弟兄们”
  alternative: “弟兄姊妹们”或“各位弟兄”
  rationale: 原文在语法形式上为阳性，正文不将其直接扩展为明确包含女性的称呼；同时以脚注保留这种惯用呼语在具体语境中可能广泛指向群体成员的可能性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“心如被刺”保留原文隐喻，避免口语色彩较强的“扎心”；将呼语“弟兄们”置于直接引语开头，符合汉语习惯，同时不改变其修辞功能。
