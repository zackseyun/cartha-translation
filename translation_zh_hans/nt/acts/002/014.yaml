review_pass:
  verdict: revise
  source_fidelity: 草稿总体传达了彼得与十一人同在、提高声音并要求听众留心的意思。但“彼得和那十一个使徒一同站起来”容易表明十二人都站起，而希腊文的“站立”语法上首先描写彼得；“犹太同胞”将“犹太地的男子”（Ἄνδρες Ἰουδαῖοι）的地域性称呼泛化为族群同胞，也未保留阳性呼语。
  naturalness: “提高声音”“请明白这件事”“侧耳听我的话”均自然且适合庄重的公开讲话。“彼得同那十一个人站着”清楚自然，并避免将站立动作不必要地扩展给十一人。“犹太地的各位男士”虽较正式，但在演说呼语中自然，且较准确对应原文。
  terminology: “耶路撒冷”与“彼得”正确。原文此处只说“那十一个”，没有在本节明说“使徒”；为避免增补，正文保留“那十一个人”。“郑重说道”可接受，但“向他们宣告说”更直接体现公开、郑重发言，并保留对听众的指向。
  issues:
  - severity: medium
    issue: “彼得和那十一个使徒一同站起来”改变了分词的修饰关系，并增补“使徒”。
    rationale: Σταθεὶς 为单数，直接修饰彼得；σὺν τοῖς ἕνδεκα 表示彼得与十一人同在。原文未在本节称他们为“使徒”。
  - severity: medium
    issue: “犹太同胞”未充分对应Ἄνδρες Ἰουδαῖοι。
    rationale: 该正式呼语含阳性复数的“男士”及“犹太地/Judean”身份；“同胞”改为较宽泛的族群亲称，也抹平与随后“所有住在耶路撒冷的人”之间的原有表述区别。
  - severity: low
    issue: “向众人”略作语境性扩展。
    rationale: αὐτοῖς直译为“向他们”；虽上下文可指在场群众，正文使用代词可避免明确扩展指称。
