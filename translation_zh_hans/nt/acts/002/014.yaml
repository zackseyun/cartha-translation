  text: Σταθεὶς δὲ ⸀ὁ Πέτρος σὺν τοῖς ἕνδεκα ἐπῆρεν τὴν φωνὴν αὐτοῦ καὶ ἀπεφθέγξατο αὐτοῖς· Ἄνδρες Ἰουδαῖοι καὶ οἱ κατοικοῦντες Ἰερουσαλὴμ ⸀πάντες, τοῦτο ὑμῖν γνωστὸν ἔστω καὶ ἐνωτίσασθε τὰ ῥήματά μου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/014.yaml
  text: 'But Peter[a], standing with the eleven, raised his voice and declared to them: “Men of Judea and all who dwell in Jerusalem, let this be known to you[b], and give ear to my words.”'
translation:
  language: zh_hans
  text: 彼得同那十一个人站着，提高声音，向他们宣告说：“犹太地的各位男士，以及所有住在耶路撒冷的人，请你们明白这件事，并侧耳听我的话。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σταθεὶς δὲ ὁ Πέτρος
  choice: 彼得……站起来
  rationale: 不定过去时分词交代彼得采取站立姿态、开始公开发言；“站起来”比直译“站着”更自然，也可体现与上文讥诮者之间的转折。汉语不必机械译出 δὲ。
- source_word: σὺν τοῖς ἕνδεκα
  choice: 和那十一个使徒一同
  rationale: σύν 加与格表示陪同。“那十一个”指其余使徒；补出“使徒”可避免现代读者误解，同时不改变所指。
- source_word: ἐπῆρεν τὴν φωνὴν αὐτοῦ
  choice: 提高声音
  rationale: 这是表示大声公开讲话的惯用表达；“提高声音”在现代汉语中自然，并保留原文意象。
- source_word: ἀπεφθέγξατο αὐτοῖς
  choice: 向众人郑重说道
  rationale: 该动词指清楚、响亮而有分量地发言。“郑重说道”保留庄重公开宣告的语气，但不单凭此词明说其言语受默示；αὐτοῖς 依语境译为“向众人”。
- source_word: Ἄνδρες Ἰουδαῖοι
  choice: 犹太同胞
  rationale: 这是面向犹太男性听众的正式称呼。汉语“犹太同胞”自然传达共同族群身份和公开致辞语气；若译“犹太男人”则容易产生不合语境的性别对比。
- source_word: οἱ κατοικοῦντες Ἰερουσαλὴμ πάντες
  choice: 所有住在耶路撒冷的人
  rationale: 准确表达现在分词所指的居民以及 πάντες 的全称范围。
- source_word: τοῦτο ὑμῖν γνωστὸν ἔστω
  choice: 请明白这件事
  rationale: 命令式结构要求听众认识并清楚了解下文所解释的事。“请明白”在汉语公开讲话中自然，保留劝令语气。
- source_word: ἐνωτίσασθε τὰ ῥήματά μου
  choice: 侧耳听我的话
  rationale: ἐνωτίσασθε 是要求专心聆听的命令。“侧耳听”保留其以耳专注聆听的形象和正式语体；“我的话”直接对应 τὰ ῥήματά μου。
theological_decisions:
- issue: Ἄνδρες 的性别和称呼方式
  choice: 犹太同胞
  alternative: 犹太男子
  rationale: 原文形式明确为阳性复数称呼，但在当时公共演说中可作为对男性代表听众的惯常呼语。现代汉语若作“犹太男子”会不自然地突出男女区别；“犹太同胞”保留族群内称呼，却不据此断言现场没有女性。
- issue: ἀπεφθέγξατο 是否应在译文中明确表示受圣灵感动
  choice: 郑重说道
  alternative: 受圣灵感动宣告
  rationale: 上下文确实涉及圣灵降临，但该动词本身主要刻画响亮、庄重的发言。译文不额外加入“受圣灵感动”，以免消除词义和叙事之间的张力。
- issue: “那十一个”的身份是否补明
  choice: 那十一个使徒
  alternative: 那十一个人
  rationale: 这里显然是彼得之外的十一位使徒。补明身份帮助普通读者理解，并不引入宗派性解释。
translation_notes:
  register: 采用自然、庄重的现代标准汉语，适合公开宣读。保留彼得提高声音、郑重发言和要求听众专心聆听的修辞力度；本节没有必须以脚注保存的文本异读或实质性词义歧义。
