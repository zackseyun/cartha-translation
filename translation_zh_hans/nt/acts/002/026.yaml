source:
  edition: SBLGNT
  text: διὰ τοῦτο ηὐφράνθη ⸂ἡ καρδία μου⸃ καὶ ἠγαλλιάσατο ἡ γλῶσσά μου, ἔτι δὲ καὶ ἡ σάρξ μου κατασκηνώσει ἐπ’ ἐλπίδι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/026.yaml
  text: Because of this my heart was glad[a], and my tongue rejoiced; moreover, even my flesh will dwell in hope.
translation:
  language: zh_hans
  text: 因此，我的心欢喜，我的舌头欢腾；并且，连我的肉身也要安居在盼望中。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我的身体也要在盼望中安歇。”
    reason: 说明 σάρξ 可按所指译作“身体”，κατασκηνώσει 在此也可结合死亡语境理解为“安歇”。脚注标记置于相关分句之后。
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: 因此
  rationale: 表达所依据的原因及由此得出的结果，符合本段引诗的自然衔接。
- source_word: ηὐφράνθη ἡ καρδία μου
  choice: 我的心欢喜
  rationale: 保留“心”的圣经人观用语；用“欢喜”自然表达不及物的喜乐状态。
- source_word: ἠγαλλιάσατο ἡ γλῶσσά μου
  choice: 我的舌头欢腾
  rationale: 按原文保留“舌头”的诗歌意象，并以“欢腾”体现动词所含的强烈喜乐。
- source_word: ἔτι δὲ καὶ
  choice: 并且，连……也
  rationale: 同时传达语意的递进与对“肉身”的强调。
- source_word: ἡ σάρξ μου
  choice: 我的肉身
  rationale: 此处 σάρξ 指有形的身体存在，并无伦理意义；“肉身”既贴近原词，也避免误解为“罪性”。
- source_word: κατασκηνώσει
  choice: 要安居
  rationale: 保留“搭帐居住、安然栖居”的意象；“安居”在现代汉语中自然，并未将含义收窄为单纯的安歇。
- source_word: ἐπ’ ἐλπίδι
  choice: 在盼望中
  rationale: 可表达处于盼望的境况以及以盼望为依托，且不额外加入“确信”等解释性限定。
theological_decisions:
- issue: 复活语境中 σάρξ 的译法
  choice: 我的肉身
  alternative: 我的身体
  rationale: 本节引自诗篇，后文将其用于复活。原词在这里是身体层面的用语，而非伦理性的“罪性”；正文保留“肉身”，脚注列出较通俗的“身体”。
- issue: κατασκηνώσει ἐπ’ ἐλπίδι 的意象
  choice: 要安居在盼望中
  alternative: 要在盼望中安歇
  rationale: “安居”保留原文居住、扎营的意象，也让死亡与复活盼望之间的张力由上下文呈现；“安歇”虽符合诗句语境，却更偏向解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“心、舌头、肉身、盼望”等诗性与圣经性意象；用分号呈现前后递进关系。
