  text: καί γε ἐπὶ τοὺς δούλους μου καὶ ἐπὶ τὰς δούλας μου ἐν ταῖς ἡμέραις ἐκείναις ἐκχεῶ ἀπὸ τοῦ πνεύματός μου, καὶ προφητεύσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/018.yaml
  text: Even on my male slaves and my female slaves in those days I will pour out from my Spirit[b][a], and they will prophesy.
translation:
  language: zh_hans
  text: 甚至在那些日子，我也要把我的灵[b]浇灌在我的男奴和女奴身上[a]，他们要说预言。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “男奴和女奴”也可译作“男仆和女仆”。希腊语词可指仆人或奴隶；正文用“奴”，以保留这里所强调的低下社会身份。
    reason: lexical_alternative
  - marker: b
    text: 希腊文作“从我的灵……浇灌”；其中“从”对应希腊文介词，也常按自然汉语译作“把我的灵浇灌”。
    reason: lexical_alternative
lexical_decisions:
- source_word: καί γε
  choice: 甚至……也
  rationale: 这一粒子组合承接上文并加强语气；“甚至……也”自然地表达递进和出人意料的强调。
- source_word: ἐπὶ τοὺς δούλους μου καὶ ἐπὶ τὰς δούλας μου
  choice: 在我的男奴和女奴身上
  rationale: “男奴、女奴”保留 δοῦλος/δούλη 所指的受奴役身份、希腊文明确的性别区分，以及“我的”这一所属表达；“在……身上”自然对应两次 ἐπί。
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: 在那些日子
  rationale: 直接保留时间短语及指示语气，符合现代汉语习惯。
- source_word: ἐκχεῶ
  choice: 我要……浇灌
  rationale: 保留倾倒、丰沛赐下的意象；在圣灵语境中，“浇灌”是清楚而庄重的现代汉语表达。
- source_word: ἀπὸ τοῦ πνεύματός μου
  choice: 把我的灵
  rationale: 正文采用自然汉语搭配“把我的灵浇灌在……身上”；希腊文 ἀπό 的“从”义在脚注中明示，以免生硬地把“从我的灵中”强加进正文。
- source_word: προφητεύσουσιν
  choice: 他们就要说预言
  rationale: 直接保留“说预言”这一圣经术语；“就要”表达未来结果，并自然衔接圣灵的浇灌。
theological_decisions:
- issue: δοῦλος/δούλη 在圣灵浇灌语境中的身份含义
  choice: 男奴和女奴
  alternative: 男仆和女仆；男仆人和女仆人
  rationale: 此处成对列举男性和女性奴隶，突出神的恩赐临到社会地位低下者；“奴”比“仆”更清楚地保留受奴役的社会身份，同时不超出词义范围。
- issue: ἀπὸ τοῦ πνεύματός μου 的表达
  choice: 正文作“把我的灵……浇灌”，脚注注明希腊文直译含“从”
  alternative: 从我的灵中倾注；倾注我的灵的一部分
  rationale: ἀπό 确有“从”义，但汉语若直作“从我的灵中浇灌”较生硬，也可能让读者过度推断为可分割的“一部分”。正文保留浇灌圣灵的核心意象，脚注保存原文形式上的含混，不据此建立额外教义判断。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“甚至……也”体现递进强调；“男奴和女奴”保留原文的社会身份与性别对举；句序略按汉语调整，使“浇灌在……身上”自然清晰。
