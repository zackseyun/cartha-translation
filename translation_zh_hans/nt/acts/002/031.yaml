id: ACT.2.31
reference: Acts 2:31
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: προϊδὼν ἐλάλησεν περὶ τῆς ἀναστάσεως τοῦ χριστοῦ ὅτι ⸂οὔτε ἐγκατελείφθη⸃ εἰς ⸀ᾅδην ⸀οὔτε ἡ σὰρξ αὐτοῦ εἶδεν διαφθοράν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/031.yaml
  text: 'Foreseeing this[a], he spoke about the resurrection of the Messiah: that he was neither abandoned to Hades[d][c][b], nor did his flesh see decay.'
translation:
  language: zh_hans
  text: 他预见此事，便谈论弥赛亚[a]的复活，说：“他没有被遗弃在阴间[b]，他的肉身也没有经历朽坏[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弥赛亚”对应希腊文 Christos，意为“受膏者”；传统译作“基督”。
    reason: alternative_reading
  - marker: b
    text: “阴间”指死者所在的领域，并不特指最终受审判之地。原文介词的基本意思是“到、进入”；在“被遗弃”这一结构中，整句也可自然理解为“没有被弃留在阴间”。
    reason: lexical_alternative
  - marker: c
    text: “经历朽坏”直译为“看见朽坏”，指身体腐烂。
    reason: lexical_alternative
lexical_decisions:
- source_word: προϊδὼν
  choice: 预先看见了这事
  rationale: 不定过去时分词表示在说话之前已经预见；“这事”由上下文补出，使现代汉语自然，同时保留预见未来之意。
- source_word: ἐλάλησεν περὶ
  choice: 就谈到
  rationale: λαλέω 表示说话，περί 加属格表示“关于”；“谈到”自然地合并表达二者。
- source_word: τῆς ἀναστάσεως
  choice: 复活
  rationale: 直接表达从死亡中复起，在本段是彼得解释诗篇的核心。
- source_word: τοῦ χριστοῦ
  choice: 弥赛亚
  rationale: 此处 Χριστός 在彼得诉诸经文的论证中具有“受膏者”的称号意味；“弥赛亚”比已较姓名化的“基督”更明显地保留这一点。
- source_word: οὔτε ἐγκατελείφθη
  choice: 没有被撇
  rationale: ἐγκαταλείπω 的被动式可指被遗弃、留下；“被撇”既保留被动和遗弃意味，也适合诗篇引文的庄重语体。
- source_word: εἰς ᾅδην
  choice: 在阴间
  rationale: ᾅδης 指死者所在的领域；与“被撇”连用时，汉语以“撇在阴间”最自然。εἰς 本身带有“到、进入”的方向意味，相关差异在脚注说明。
- source_word: ἡ σὰρξ αὐτοῦ
  choice: 他的肉身
  rationale: σάρξ 在此具体指弥赛亚会朽坏的身体，而非伦理意义上的罪性；“肉身”保留其身体性及与诗篇引文的词汇联系。
- source_word: εἶδεν διαφθοράν
  choice: 经历朽坏
  rationale: 原文直译为“看见朽坏”，是闪语式表达；“经历朽坏”在现代汉语中自然清楚，并保留身体腐朽的含义。
theological_decisions:
- issue: Χριστός 的称号含义
  choice: 弥赛亚
  alternative: 基督
  rationale: 彼得是在解释经文所预告的受膏者，因此称号意味突出；脚注保留传统译法，避免将两者误作不同对象。
- issue: ᾅδης 所指的领域
  choice: 阴间
  alternative: 死者的领域；地狱
  rationale: 这里指死者所在之处，并不特指最终受审判之地；采用“阴间”可避免与“地狱”混同。
- issue: εἰς ᾅδην 与被动动词的关系
  choice: 被撇在阴间
  alternative: 被撇到阴间
  rationale: εἰς 通常有方向意味，但在这段诗篇引文的被动结构中，也可按结果状态自然译为“在阴间”；脚注保留这一真实的翻译张力。
- issue: σάρξ 的具体含义
  choice: 肉身
  alternative: 身体
  rationale: 此处论及尸身是否腐朽，是字面的身体用法；“肉身”比“身体”更直接对应 σάρξ，同时不引入罪性含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“就谈到”承接分词与主句的时间关系；引号标明彼得对大卫话语内容的转述。保留“弥赛亚、阴间、肉身”等具有经文和神学分量的词，同时以脚注解释可能引起误解之处。
