  text: Φρυγίαν τε καὶ Παμφυλίαν, Αἴγυπτον καὶ τὰ μέρη τῆς Λιβύης τῆς κατὰ Κυρήνην, καὶ οἱ ἐπιδημοῦντες Ῥωμαῖοι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/010.yaml
  text: Phrygia and Pamphylia[a], Egypt and the parts of Libya toward Cyrene, and the visiting Romans[b],
translation:
  language: zh_hans
  text: 弗吕家和旁非利亚、埃及，以及靠近古利奈[a]的利比亚各地区，还有旅居的罗马人[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“古利奈一带的利比亚各地区。”
    reason: κατὰ Κυρήνην说明利比亚这些地区与古利奈的地域关系；“一带”是“靠近”的自然替代，保留其范围弹性。
  - marker: b
    text: 或译：“暂住的罗马人”或“来访的罗马人”。
    reason: ἐπιδημοῦντες可指暂时停留、旅居或来访；不应把Ῥωμαῖοι限定为来自罗马城。
lexical_decisions:
- source_word: Φρυγίαν
  choice: 弗吕家
  rationale: 采用现代中文圣经地名的通行译名，指小亚细亚内陆地区。
- source_word: τε καὶ
  choice: 、
  rationale: 此处连接地名清单；中文以顿号自然呈现并列关系，不必机械译出“和”。
- source_word: Παμφυλίαν
  choice: 旁非利亚
  rationale: 采用现代中文圣经地名的通行译名。
- source_word: Αἴγυπτον
  choice: 埃及
  rationale: 采用该国家的现代中文标准名称。
- source_word: τὰ μέρη τῆς Λιβύης
  choice: 利比亚各地
  rationale: μέρη可指各部分、各地区；“各地”既简洁自然，也保留区域复数的含义。
- source_word: τῆς κατὰ Κυρήνην
  choice: 靠近古利奈的
  rationale: κατά加地名在此说明利比亚相关区域与古利奈的地理关系；“靠近”保留其范围弹性，不把它限定为明确政区。
- source_word: οἱ ἐπιδημοῦντες
  choice: 旅居这里的
  rationale: 该分词指暂时停留或作为外来者居住的人；“旅居这里的”自然表达其临时在场，而不暗示永久定居。
- source_word: Ῥωμαῖοι
  choice: 罗马人
  rationale: 采用该族群或地域身份的标准中文称呼。
