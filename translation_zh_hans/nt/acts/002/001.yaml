  text: Καὶ ἐν τῷ συμπληροῦσθαι τὴν ἡμέραν τῆς πεντηκοστῆς ἦσαν ⸂πάντες ὁμοῦ⸃ ἐπὶ τὸ αὐτό,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/001.yaml
  text: And when the day of Pentecost had fully come[a], they were all together in one place.
translation:
  language: zh_hans
  text: 当五旬节那一天来到时[a]，他们全都聚集在同一个地方。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“当五旬节那一天完全来到时。”
    reason: συμπληροῦσθαι可着重该日正在达到／来到的过程，也可按该日完全来到的结果表达。
lexical_decisions:
- source_word: συμπληροῦσθαι
  choice: 正临到
  rationale: 现在时被动不定式与ἐν τῷ构成时间表达，带有过程意味。“正临到”在现代汉语中自然，同时保留节期之日趋于成就、到来的动态；不把它单纯处理为已经完成的结果。
- source_word: πεντηκοστῆς
  choice: 五旬节
  rationale: 这是该犹太节期在新约语境中的固定名称，也比按希伯来背景译作“七七节”更直接对应此处的希腊词。
- source_word: πάντες
  choice: 全都
  rationale: 表明上文所指群体无一例外；“全都”符合现代汉语叙事习惯。
- source_word: ὁμοῦ
  choice: 聚集
  rationale: 表达众人共同在一起的状态。结合汉语句法译为“聚集”，比机械重复“在一起”更自然。
- source_word: ἐπὶ τὸ αὐτό
  choice: 在同一个地方
  rationale: 该短语既可表示“在同一处”，也可表示“在一起”。因ὁμοῦ已表达共同聚集，此处保留地点意味，避免两个近义表达完全重叠。
theological_decisions:
- issue: ἦσαν所含主语的身份
  choice: 他们全都聚集在同一个地方
  alternative: 众人全都聚集在同一个地方
  rationale: 希腊文没有再次明说主语，而是承接上文。现代汉语需要补出“他们”以使叙述完整，但不进一步限定这群人的范围，从而避免加入原文未明说的身份判断。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“正临到”保留原文时间结构的动态意味；“全都聚集在同一个地方”清楚区分共同聚集与同处一地两个相关信息。
