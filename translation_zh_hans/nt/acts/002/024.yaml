  text: ὃν ὁ θεὸς ἀνέστησεν λύσας τὰς ὠδῖνας τοῦ θανάτου, καθότι οὐκ ἦν δυνατὸν κρατεῖσθαι αὐτὸν ὑπ’ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/024.yaml
  text: whom God raised up[a], having loosed the pains of death[b], because it was not possible for him to be held by it.
translation:
  language: zh_hans
  text: 神使他复活，解除了死亡的痛苦[a]，因为他不可能被死亡拘禁[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “痛苦”所译的希腊语也可指“产痛”或“阵痛”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“被它拘禁”；这个代词最自然是指“死亡”。
    reason: alternative_reading
lexical_decisions:
- source_word: ὃν
  choice: 他
  rationale: 关系代词回指上一节的耶稣。中文以“他”承接上下文，比勉强保留关系从句更自然。
- source_word: ὁ θεὸς ἀνέστησεν
  choice: 神……使他复活了
  rationale: ἀνέστησεν在此指神使耶稣从死人中起来；“使他复活”清楚表达其使役关系和复活语境，同时不额外扩展原文。
- source_word: λύσας
  choice: 解除了
  rationale: λύω本义为解开、释放；此处分词说明伴随主句发生或实现主句的行动。“解除”保留解开束缚的意象，且符合现代汉语。
- source_word: τὰς ὠδῖνας τοῦ θανάτου
  choice: 死亡的痛苦
  rationale: ὠδίν可指剧痛，特别是产痛；正文采用语境中通顺而不过度限定的“痛苦”，并在脚注保留“产痛”的词义和意象。
- source_word: καθότι
  choice: 因为
  rationale: 引出神使他复活的原因；“因为”是现代汉语中最自然直接的对应。
- source_word: οὐκ ἦν δυνατὸν
  choice: 不可能
  rationale: 准确表达希腊语非人称结构“不可能”，并保持解释性的语气。
- source_word: κρατεῖσθαι
  choice: 被……拘禁
  rationale: κρατέω在被动态中表示被抓住、控制或扣留。“拘禁”能自然表达死亡持续扣住他的权势意象。
- source_word: ὑπ’ αὐτοῦ
  choice: 被死亡
  rationale: 代词最自然地回指前面的“死亡”。中文正文明确说“死亡”，避免“被它拘禁”的生硬和指代不清；脚注说明原文形式。
theological_decisions:
- issue: ὑπ’ αὐτοῦ的所指
  choice: 理解为“被死亡”
  alternative: 按字面译作“被它”；语法形式也可能被误读为“被他”
  rationale: 最近且语义最连贯的先行词是“死亡”；整句说明死亡不能继续拘禁耶稣。正文明确所指，脚注保留原文代词形式。
- issue: ὠδῖνας的含义
  choice: 正文译作“痛苦”
  alternative: “产痛”或“阵痛”
  rationale: 该词可特指分娩之痛，也可泛指剧痛。正文不强行凸显分娩意象，以“痛苦”保持语境通顺；脚注保留其真实词义范围及可能的意象。
- issue: λύσας与ἀνέστησεν的关系
  choice: 译为“神解除了……，使他复活了”
  alternative: “神使他复活，解除了……”或“神借着解除……使他复活”
  rationale: 分词可表达伴随行动或方式。正文采用自然并列次序，不把两者之间的逻辑关系限定得超过原文。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“使他复活”清楚传达神是行动者；“解除”与“拘禁”共同保留原文中死亡如同束缚、扣押人的具体意象。所有脚注标记均置于相关正文之后。
