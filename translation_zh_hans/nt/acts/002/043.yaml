  text: ⸀Ἐγίνετο δὲ πάσῃ ψυχῇ φόβος, πολλά ⸀τε τέρατα καὶ σημεῖα διὰ τῶν ἀποστόλων ἐγίνετο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/043.yaml
  text: And fear came upon every soul[a], and many wonders and signs were being done through the apostles.
translation:
  language: zh_hans
  text: 惧怕临到每一个人[a]；许多奇事和神迹借着使徒行出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“众人都心生敬畏”。希腊文直译为“惧怕临到每一个魂”，即“每一个人”。
    reason: 说明φόβος在此可译为“敬畏”，并保留πάσῃ ψυχῇ的字面表达及其实际所指。
lexical_decisions:
- source_word: Ἐγίνετο ... φόβος
  choice: 惧怕临到
  rationale: 以自然的现代汉语表达未完成时所描写的持续出现或形成的状态，同时保留“临到”这一动态意味。
- source_word: δὲ
  choice: 以分号承接，不另译
  rationale: 此处主要起叙事承接作用，并非强烈转折；汉语用分句衔接更自然，若硬译“但是”会夸大对比。
- source_word: πάσῃ ψυχῇ
  choice: 每一个人
  rationale: ψυχή在此以闪语式表达指每一个个体；译作“每一个人”清楚自然，脚注保留其字面形式。
- source_word: φόβος
  choice: 惧怕
  rationale: φόβος可涵盖害怕与敬畏。正文采用直接对应的“惧怕”，不把含义单方面限定为较温和的“敬畏”。
- source_word: πολλά
  choice: 许多
  rationale: 准确、自然地表达数量众多。
- source_word: τέρατα
  choice: 奇事
  rationale: 突出这些作为令人惊奇之事的性质，并与σημεῖα所表达的指示功能保持区别。
- source_word: σημεῖα
  choice: 神迹
  rationale: “神迹”是现代汉语圣经语境中对σημεῖον的通行表达，兼具超常事件及其指向意义；与“奇事”并列自然。
- source_word: διὰ τῶν ἀποστόλων
  choice: 借着使徒
  rationale: 保留διά加属格所表达的媒介或代理关系，使徒是这些事发生所借助的媒介，而不把他们表述为最终力量来源。
- source_word: ἐγίνετο
  choice: 不断发生
  rationale: 用“不断”体现未完成时所描写的持续或反复情形；“发生”贴合γίνομαι在事件语境中的意义，又避免加入原文没有明说的主语。
theological_decisions:
- issue: φόβος是“惧怕”还是“敬畏”
  choice: 惧怕
  alternative: 敬畏
  rationale: 使徒所行奇事和神迹引起的φόβος可能同时含有畏惧与敬畏。正文采用较直接的“惧怕”，脚注提示“敬畏”这一语境上可能的理解，以保留原文张力。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“借着使徒不断发生”略带经文语体，但能准确保留使徒作为媒介、事件持续发生以及最终施行者未明说的特点。
