base_translation:
  language: en
  yaml_path: translation/nt/acts/002/023.yaml
  text: this man[a], delivered up according to the determined plan and foreknowledge of God[b], you killed by nailing him to a cross through the hands of lawless men.
translation:
  language: zh_hans
  text: 这人[a]是按着神所定的旨意和预知被交出的；你们借着不法之人的手，把他钉在十字架上杀了。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这人”也可译作“这一位”或“他”。
    reason: lexical_alternative
  - marker: b
    text: “杀了”也可译作“处死了”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτον
  choice: 这人
  rationale: 指彼得话语中的耶稣；保留指示词的现场指向性，同时符合现代汉语表达。
- source_word: τῇ ὡρισμένῃ βουλῇ
  choice: 按着……所定的旨意
  rationale: 与格在此表达依据或准则；ὡρισμένῃ 表示已经定下，βουλή 表示旨意、谋划或计划。“所定的旨意”自然庄重，也保留神主动定意的含义。
- source_word: καὶ προγνώσει
  choice: 和预知
  rationale: πρόγνωσις 表示预先知道；“预知”简洁准确，并不额外界定它与“旨意”的逻辑关系。
- source_word: τοῦ θεοῦ
  choice: 神的
  rationale: 属格同时修饰“所定的旨意”和“预知”；汉语用“神所定的旨意和预知”自然表达这一关系。
- source_word: ἔκδοτον
  choice: 被交出
  rationale: 表示被交付、交出去；保留被动意义，不在译文中擅自补明交出者。
- source_word: διὰ χειρὸς ἀνόμων
  choice: 借不法之人的手
  rationale: διά 加属格表达中介或施行者；“借……的手”既保留 χειρός 的单数集合性意象，也符合汉语习惯。ἀνόμων 译作“不法之人”，保留其不受律法约束或违背律法的语义。
- source_word: προσπήξαντες
  choice: 把他钉在十字架上
  rationale: 该分词表示钉住、固定；在处决耶稣的语境中明确译出“十字架”，传达原词所隐含的具体刑罚方式。
- source_word: ἀνείλατε
  choice: 你们……杀了
  rationale: ἀναιρέω 在此意为杀死、处死；“杀了”直接有力，保留彼得对听众责任的指控。
theological_decisions:
- issue: 神的主权与人的责任之间的关系
  choice: 同时保留耶稣按神所定的旨意和预知被交出，以及听众对杀害耶稣所负的责任。
  alternative: 淡化神的定意，或把责任完全归给“不法之人”而弱化“你们”的责任。
  rationale: 希腊文本并列陈述神所定的旨意与预知，也直接以第二人称复数说“你们杀了”。译文不按某一神学体系消解这种张力。
- issue: ἔκδοτον 的隐含施事者
  choice: 采用“被交出”，不明确补出是谁交出耶稣。
  alternative: 译作“神把他交出”或“他被犹大交出”。
  rationale: 本句将被交出置于神的旨意和预知之下，却没有在语法上明说直接施事者；保留被动可避免过度阐释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“按着”保留经文语体的庄重感；“借不法之人的手”自然表达间接施行，同时保留原文“手”的意象。主句采用“既……就……”以清楚呈现前置分词性描述与主要指控之间的关系。
