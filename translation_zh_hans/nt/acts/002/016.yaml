lexical_decisions:
- source_word: ἀλλὰ
  choice: 而是
  rationale: 承接上文并纠正众人的误解；现代汉语用“而是”自然体现反驳和更正。
- source_word: τοῦτό ἐστιν
  choice: 是……这话
  rationale: 保留指示代词与系词的判断结构，不译作较具解释性的“意思是”。
- source_word: τὸ εἰρημένον
  choice: 所说的这话
  rationale: 将带冠词的完成时被动分词按名词性结构处理；汉语“所说的这话”自然表达先前已经说出的内容。被动施事关系在与“先知约珥”组合时可自然表述。
- source_word: διὰ τοῦ προφήτου Ἰωήλ
  choice: 先知约珥所说的
  rationale: διά加属格可表示借着中介者或由某人说出。正文采用自然简洁的汉语“先知约珥所说的”，脚注保留更明确体现中介意义的译法。
- source_word: Ἰωήλ
  choice: 约珥
  rationale: 采用现代中文圣经传统通行的人名译法。
theological_decisions:
- issue: διὰ τοῦ προφήτου Ἰωήλ所表达的先知中介关系
  choice: 先知约珥所说的
  alternative: 借着先知约珥所说的
  rationale: 正文选择自然的现代汉语，同时不明确断定约珥是信息的最终源头；脚注指出原文也可更显明地表达先知作为传话中介的角色，以保存希腊语的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事用语。“而是”准确衔接彼得对上文误解的纠正；“这话”也自然引出下文的约珥书引文。
