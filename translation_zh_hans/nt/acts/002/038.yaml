  text: Πέτρος δὲ ⸂πρὸς αὐτούς· Μετανοήσατε⸃, καὶ βαπτισθήτω ἕκαστος ὑμῶν ⸀ἐπὶ τῷ ὀνόματι Ἰησοῦ Χριστοῦ εἰς ἄφεσιν ⸀τῶν ἁμαρτιῶν ⸀ὑμῶν, καὶ λήμψεσθε τὴν δωρεὰν τοῦ ἁγίου πνεύματος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/038.yaml
  text: And Peter said to them[a], “Repent, and let each of you be baptized in the name of Jesus the Messiah for the forgiveness of your sins[b], and you will receive the gift of the Holy Spirit.”
translation:
  language: zh_hans
  text: 彼得对他们说：“你们要悔改，每个人都要奉耶稣这位弥赛亚的名受洗，使你们的罪得赦免[a]；并且你们会领受圣灵的恩赐。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使你们的罪得赦免”直接表达希腊文中指向赦免的短语。这里洗礼与赦罪究竟如何相关，历来有不同理解；译文不进一步判定其功效、次序或象征意义。
    reason: theological_ambiguity
lexical_decisions:
- source_word: Μετανοήσατε
  choice: 你们要悔改
  rationale: 该词是复数不定过去时命令式，要求听众作出明确回应。“悔改”在现代汉语中简洁地保留了思想、意志和行为转向的含义。
- source_word: βαπτισθήτω ἕκαστος ὑμῶν
  choice: 每个人都要……受洗
  rationale: 以“每个人”体现ἕκαστος的逐一分配意味，以“要……受洗”保留第三人称单数被动命令式的命令语气。
- source_word: ἐπὶ τῷ ὀνόματι
  choice: 奉……的名
  rationale: “奉……的名”是现代汉语中自然且庄重的表达，可涵盖依据、权柄和公开归属等可能意味，而不把其中一种解释写死。
- source_word: Ἰησοῦ Χριστοῦ
  choice: 耶稣弥赛亚
  rationale: 在彼得的宣讲语境中，Χριστός仍具有称号功能；译作“弥赛亚”可传达“受膏者”的身份含义，而非仅作为固定姓名的一部分。
- source_word: εἰς ἄφεσιν τῶν ἁμαρτιῶν ὑμῶν
  choice: 使你们的罪得赦免
  rationale: 此译自然表达εἰς所指向的目标或结果，并保留“罪得赦免”的核心语义；脚注说明本句未进一步裁定洗礼与赦罪之间的神学机制。
- source_word: λήμψεσθε
  choice: 你们就会领受
  rationale: 对应将来时直陈式所表达的应许；“领受”比“收到”更符合所赐之物来自上帝的庄重语境。
- source_word: τὴν δωρεὰν τοῦ ἁγίου πνεύματος
  choice: 圣灵这份恩赐
  rationale: 该结构可能表示“圣灵这一恩赐”，也可能表示“圣灵所赐的恩赐”。主文采用较自然、并与上下文相称的同位理解，同时以脚注保留属格关系的另一种可能。
theological_decisions:
- issue: 洗礼与赦罪在εἰς ἄφεσιν τῶν ἁμαρτιῶν ὑμῶν中的关系
  choice: 译作“使你们的罪得赦免”，并以脚注说明不进一步界定二者的神学机制
  alternative: 译作“因为你们的罪已经得赦免”或加入关于洗礼功效、次序、象征意义的解释
  rationale: εἰς通常表达趋向、目的或结果；不能在没有明文依据的情况下改译为回顾既成事实的“因为”。同时，经文本身未详述洗礼如何与赦罪相关，译文不应代替经文解决宗派争议。
- issue: Χριστοῦ的称号性质
  choice: 译作“弥赛亚”
  alternative: 译作“基督”
  rationale: 本章宣讲集中论证耶稣是上帝所立的弥赛亚，因此称号含义在此仍然鲜明；“弥赛亚”直接显明这一含义。
- issue: τοῦ ἁγίου πνεύματος的属格关系
  choice: 主文采用同位理解：“圣灵这份恩赐”
  alternative: “圣灵所赐的恩赐”
  rationale: 彼得应许听众领受圣灵本身的理解与《使徒行传》紧邻语境相合，但希腊语属格形式本身允许另一理解，因此在脚注中保留该歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“奉……的名受洗”保留圣经语体但不显陈旧；“每个人都要”自然体现原文由复数命令转为分配性单数命令的结构。主文只设置一个脚注标记[a]，与脚注表完全对应。
