  text: Ἦσαν δὲ ⸀ἐν Ἰερουσαλὴμ κατοικοῦντες Ἰουδαῖοι, ἄνδρες εὐλαβεῖς ἀπὸ παντὸς ἔθνους τῶν ὑπὸ τὸν οὐρανόν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/005.yaml
  text: There were Jews living in Jerusalem[b][a], devout men from every nation under heaven.
translation:
  language: zh_hans
  text: 有犹太人[a]住在耶路撒冷；他们是敬虔的男子，来自天下[b]各国。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “犹太人”也可译作“犹太地人”；但本节说他们来自天下各国，因此这里更可能是广义的族群和宗教称呼。
    reason: alternative_reading
  - marker: b
    text: “天下”是圣经惯用语，意思是遍及全世界。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦσαν δὲ
  choice: 有
  rationale: 用存在句自然承接叙事；δέ的轻微衔接作用由上下文和分号体现，不另加可能被误解为时间词的“现在”或“当时”。
- source_word: ἐν Ἰερουσαλὴμ κατοικοῦντες
  choice: 住在耶路撒冷
  rationale: κατοικέω表示居住、定居；“住在”是现代汉语中自然、清楚的表达，也不暗示只是短暂停留。
- source_word: Ἰουδαῖοι
  choice: 犹太人
  rationale: 结合“来自天下各国”，这里较自然地指散居各地、具有共同族群与宗教身份的犹太人，而不只是犹太地区的居民。
- source_word: ἄνδρες εὐλαβεῖς
  choice: 敬虔的男子
  rationale: “敬虔”表达对上帝虔诚、敬畏的品格；“男子”保留ἀνήρ明确的男性含义，不泛化为“人们”。
- source_word: ἀπὸ παντὸς ἔθνους
  choice: 来自……各国
  rationale: ἔθνος在这里指世上不同国家或族群；“各国”符合路加这句话的广泛地域含义，也较为自然。
- source_word: τῶν ὑπὸ τὸν οὐρανόν
  choice: 天下
  rationale: “天下”是自然的汉语惯用语，既保留“天之下”的意象，也表达遍及全世界的意思。
theological_decisions:
- issue: Ἰουδαῖοι的范围
  choice: 犹太人
  alternative: 犹太地人
  rationale: 这些人被说成来自天下各国，语境指向散居各地的犹太人，因此不宜限缩为来自犹太地区的人。
- issue: ἄνδρες的性别含义
  choice: 男子
  alternative: 人
  rationale: 原文使用特指成年男性的ἀνήρ，而非泛指人的词；译作“男子”保留这一明确含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。将较长的希腊语同位结构分成两个相连分句，使汉语自然清楚，同时保留“男子”的性别信息以及“天下”的圣经意象。
