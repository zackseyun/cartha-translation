  text: Πάρθοι καὶ Μῆδοι καὶ Ἐλαμῖται, καὶ οἱ κατοικοῦντες τὴν Μεσοποταμίαν, Ἰουδαίαν τε καὶ Καππαδοκίαν, Πόντον καὶ τὴν Ἀσίαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/009.yaml
  text: Parthians and Medes and Elamites[a], and those living in Mesopotamia, Judea and Cappadocia, Pontus and Asia[b],
translation:
  language: zh_hans
  text: 帕提亚人、米底人、以拦人，以及住在美索不达米亚、犹太和加帕多家[a]、本都和亚细亚[b]的人，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “犹太和加帕多家”中的希腊语连接词也可简单理解为“和”，但可能略带“以及”的附加意味。
    reason: lexical_alternative
  - marker: b
    text: 这里的“亚细亚”指小亚细亚西部的罗马行省亚细亚，不是现代所说的亚洲大陆。
    reason: cultural_note
lexical_decisions:
- source_word: Πάρθοι
  choice: 帕提亚人
  rationale: 采用现代汉语中通行的族名音译，保留原文所列民族的名称。
- source_word: Μῆδοι
  choice: 米底人
  rationale: 采用通行的汉语族名，指来自米底地区的人。
- source_word: Ἐλαμῖται
  choice: 以拦人
  rationale: 采用通行的汉语族名，指来自以拦的人。
- source_word: οἱ κατοικοῦντες
  choice: 住在……的人
  rationale: 带冠词的现在分词作名词使用，指居住在随后各地区的人；此译自然并保留其分词含义。
- source_word: τὴν Μεσοποταμίαν
  choice: 美索不达米亚
  rationale: 采用现代汉语通行的地名译法。
- source_word: Ἰουδαίαν
  choice: 犹太
  rationale: 保留其地区名称，不扩展为民族或宗教意义。
- source_word: τε καὶ
  choice: 和
  rationale: 该组合连接“犹太”与“加帕多家”，可带轻微的附加意味；正文以自然的汉语连词表达，并在脚注说明。
- source_word: Καππαδοκίαν
  choice: 加帕多家
  rationale: 采用中文圣经传统中通行且可识别的地区名称。
- source_word: Πόντον
  choice: 本都
  rationale: 采用通行的汉语地区名称。
- source_word: τὴν Ἀσίαν
  choice: 亚细亚
  rationale: 采用历史地名“亚细亚”，并以脚注明确这里所指的是罗马行省，而非现代亚洲大陆。
