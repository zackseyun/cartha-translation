  text: καὶ δώσω τέρατα ἐν τῷ οὐρανῷ ἄνω καὶ σημεῖα ἐπὶ τῆς γῆς κάτω, αἷμα καὶ πῦρ καὶ ἀτμίδα καπνοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/019.yaml
  text: 'And I will give wonders in the heaven above and signs on the earth below: blood and fire and a cloud of smoke.'
translation:
  language: zh_hans
  text: 我要在上面的天上显出奇事，在下面的地上显出征兆：有血，有火，有烟雾。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δώσω
  choice: 使……出现
  rationale: 字面义是“给予”，但与“奇事、神迹”搭配时，现代汉语用“使……出现”更自然，也准确表达上帝使这些现象显现；避免“赐下”可能带来的恩赐意味。
- source_word: τέρατα
  choice: 奇事
  rationale: 指使人惊异、敬畏的异常现象；“奇事”既保留其超常色彩，也不将其局限为医治等“神迹奇事”。
- source_word: ἐν τῷ οὐρανῷ ἄνω
  choice: 在上面的天上
  rationale: 保留原文“天上／地上”和“上面／下面”的垂直对应及先知性语体；οὐρανός在此可指天或天空，但宇宙性上下对照适合译作“天上”。
- source_word: σημεῖα
  choice: 神迹
  rationale: 表示具有指示意义的可见征兆；“神迹”符合圣经语境中σημεῖον的常见中文表达，并与“奇事”形成自然搭配。
- source_word: ἐπὶ τῆς γῆς κάτω
  choice: 在下面的地上
  rationale: 与“上面的天上”构成原文明确的宇宙性对照；γῆ在此宜理解为“大地”，而非局部土地。
- source_word: αἷμα καὶ πῦρ
  choice: 血，有火
  rationale: 保留具体而强烈的末世性意象；在汉语中重复“有”可使列举清楚、庄重。
- source_word: ἀτμίδα καπνοῦ
  choice: 烟雾
  rationale: ἀτμίς指蒸气、雾气，与καπνός组合表示可见的烟气；“烟雾”简洁自然，也比“烟的蒸气”更符合现代汉语。
theological_decisions:
- issue: 约珥引文中宇宙位置的表达
  choice: 上面的天上……下面的地上
  alternative: 上面的天空……下面的土地
  rationale: 原文将οὐρανός与γῆ对举，呈现宇宙性的先知异象；译作“天上／地上”保留其广度，同时不预先断定这些现象仅属气象或地方性事件。
- issue: δώσω与奇事、神迹的关系
  choice: 使……出现
  alternative: 赐下……
  rationale: 原文的主动者是上帝，但“给予”的具体方式没有展开。“使……出现”既保留上帝主动施行的意义，也避免“赐下”在中文中可能暗示这些现象是恩惠或从天降到地上。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“上面的天上／下面的地上”的平行结构，并用冒号引出血、火、烟雾这些具体征象。
