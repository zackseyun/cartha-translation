base_translation:
  language: en
  yaml_path: translation/nt/acts/002/011.yaml
  text: both Jews and proselytes[a], Cretans and Arabs—we hear them speaking in our own languages the mighty works of God.
translation:
  language: zh_hans
  text: 有犹太人和归信犹太教的人，也有克里特人和阿拉伯人——我们听见他们用我们自己的语言[a]述说上帝伟大的作为。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“舌头”。希腊词既可指人的舌头，也可指语言；这里的上下文强调听众听见自己所熟悉的语言。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰουδαῖοί
  choice: 犹太人
  rationale: 此处指散居各地、来到耶路撒冷的犹太群体，并非仅指犹太地区的居民；“犹太人”准确表达其民族与宗教身份。
- source_word: τε καὶ
  choice: 有……和……，也有……和……
  rationale: 结合本节承接上文列举各地来客的句法，用自然汉语呈现并列与配对关系，避免生硬直译。
- source_word: προσήλυτοι
  choice: 归信犹太教的人
  rationale: 指由外族归信或加入犹太教的人；此译法比音译或笼统的“归信者”更清楚，也没有加入原文未明说的礼仪细节。
- source_word: Κρῆτες
  choice: 克里特人
  rationale: 指克里特岛的居民，采用现代汉语通行地名。
- source_word: Ἄραβες
  choice: 阿拉伯人
  rationale: 现代汉语对该族群的通行称呼。
- source_word: ἀκούομεν
  choice: 我们听见
  rationale: 保留现在时的现场感，同时符合现代汉语叙述习惯。
- source_word: λαλούντων αὐτῶν
  choice: 他们……述说
  rationale: λαλέω本义较宽，可指说话；由于宾语是上帝伟大的作为，“述说”在汉语中自然且不额外规定其言说形式。
- source_word: ταῖς ἡμετέραις γλώσσαις
  choice: 用我们自己的语言
  rationale: 上下文强调来自不同地区的人听懂各自的语言；“我们自己的”保留ἡμετέραις的强调意味。
- source_word: τὰ μεγαλεῖα
  choice: 伟大的作为
  rationale: 该词指宏大、非凡之事，语境中是上帝所行的大事；“伟大的作为”庄重自然，又不把所指局限为某一种神迹。
- source_word: τοῦ θεοῦ
  choice: 上帝
  rationale: 属格表明这些伟大作为属于上帝或由上帝施行；汉语以“上帝伟大的作为”自然表达这一关系。
theological_decisions:
- issue: 五旬节语境中γλώσσαις的含义
  choice: 可辨认的人类语言
  alternative: “舌头”或无法由通常语言辨认的灵 ecstatic 言语
  rationale: 紧邻上下文反复强调各地听众听见自己的本地语言，因此正文译为“语言”；脚注保留该希腊词也可直译为“舌头”的词义空间，不借此裁定其他经文中相关现象的性质。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“归信犹太教的人”避免使用普通读者不熟悉的“进教者／改宗者”；破折号保留原句从族群名单转入众人共同惊叹内容的转折。脚注标记置于其实际说明的“语言”之后。
