  source_fidelity: “神已经使他复活了”准确传达ἀνέστησεν在此处的复活含义，也保留神为施事者。但οὗ是阳性单数属格关系代词，语法上回指“这位耶稣”，不能在正文中改作“这事”。上下文说明见证特别涉及复活，却不改变该关系代词的人称回指。
  naturalness: “神使这位耶稣复活了；我们众人都是这位耶稣的见证人。”庄重、清晰，符合现代标准汉语。重复“这位耶稣”虽较原文显性，但避免“他的见证人”在汉语中可能产生的归属歧义。
  terminology: “神”“复活”“见证人”用语恰当。“使……复活”准确表达此处及物动词的复活意义；不宜以“这事”取代原文明确的人称关系代词。
  issues:
