  - severity: medium
    issue: 脚注将“见证这位耶稣”和“见证他复活这件事”表述为原文形式上并列的歧义。
    rationale: 原文关系代词的性数排除了直接回指“这件事”的可能。可在释义中说明语境，但不应以脚注制造原文没有的指代歧义。
