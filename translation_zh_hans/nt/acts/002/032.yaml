  text: τοῦτον τὸν Ἰησοῦν ἀνέστησεν ὁ θεός, οὗ πάντες ἡμεῖς ἐσμεν μάρτυρες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/032.yaml
  text: God raised up this Jesus[a], of whom we all are witnesses.
translation:
  language: zh_hans
  text: 神使这位耶稣复活了；我们众人都是这位耶稣的见证人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτον τὸν Ἰησοῦν
  choice: 这位耶稣
  rationale: 保留指示词 τοῦτον 的特指和强调作用，明确指向上文所说的耶稣；“这位”在现代汉语中自然且庄重。
- source_word: ἀνέστησεν
  choice: 使他复活了
  rationale: 此处由神作主语、耶稣作宾语，动词在上下文中明确指从死里复活；“使他复活”既保留及物结构，也避免“兴起”可能产生的歧义。
- source_word: ὁ θεός
  choice: 神
  rationale: 直接保留明确的施事主语，不添加原文没有的解释。
- source_word: οὗ
  choice: 这事的
  rationale: 希腊文关系代词为单数属格，形式上可指耶稣，语义上见证的焦点则是刚陈述的复活事实；正文用“这事”使现代汉语顺畅，并以脚注保留另一种直接理解。
- source_word: πάντες ἡμεῖς
  choice: 我们众人
  rationale: 保留 πάντες 与显式代词 ἡμεῖς 的强调，比单说“我们”更充分体现“我们全体”的含义。
- source_word: ἐσμεν μάρτυρες
  choice: 都是……的见证人
  rationale: 保留系词加名词的结构以及 μάρτυρες 的身份性表达，不改写为单纯的动词“见证”。
theological_decisions:
- issue: 复活表述
  choice: 神已经使他复活了
  alternative: 神使这位耶稣起来了
  rationale: ἀνέστησεν 在本段语境中指复活。正文明确表达这一意义，同时不加入复活方式或进一步的教义解释。
- issue: 见证的对象
  choice: 这事的见证人
  alternative: 他的见证人
  rationale: οὗ 在语法上可回指“这位耶稣”，但结合复活陈述，也可理解为对其复活之事作见证。正文采用汉语中更自然的事件指向，脚注保留形式上更直接的人称回指，以维持原文的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“这位耶稣”保留指示强调；“使他复活”清楚传达上下文中的复活含义；分号呈现原句两个紧密相连的分句。
