  text: ὑμῖν γάρ ἐστιν ἡ ἐπαγγελία καὶ τοῖς τέκνοις ὑμῶν καὶ πᾶσι τοῖς εἰς μακρὰν ὅσους ἂν προσκαλέσηται κύριος ὁ θεὸς ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/039.yaml
  text: For the promise is for you and for your children and for all who are far off[b][a], as many as the Lord our God calls.
translation:
  language: zh_hans
  text: 因为这应许是给你们、给你们的儿女，也给一切在远方的人[a]，就是凡主我们的上帝所召的人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“一切远离的人”。这个说法可指地理上遥远的人，也可指在与上帝立约的关系上疏远的人，或兼有两层意思。
    reason: lexical_alternative
  - marker: b
    text: 或译“凡我们主上帝所召的人”或“主我们的上帝无论召多少人”。希腊文的表达指范围不定却具涵盖性：凡主我们的上帝所召的人。
    reason: alternative_reading
lexical_decisions:
- source_word: γάρ
  choice: 因为
  rationale: 承接彼得上一节的劝告并说明其根据；现代汉语用“因为”能自然呈现这一因果连接。
- source_word: ἐπαγγελία
  choice: 这应许
  rationale: 原文所说的是“应许”本身；虽紧接上一节所提圣灵的恩赐，却不宜直接改译为“所应许的恩赐”。指示词“这”使汉语承接上下文更自然。
- source_word: τέκνοις
  choice: 儿女
  rationale: τέκνα通常指儿女，也可涵盖后代；“儿女”保留亲属关系，又不限定年龄。
- source_word: πᾶσι τοῖς εἰς μακράν
  choice: 一切远方之人
  rationale: 保留“在远处”的宽泛意象，不限定为散居犹太人或外邦人，也兼顾其圣经互文色彩。
- source_word: ὅσους ἂν προσκαλέσηται
  choice: 凡……所召的人
  rationale: ὅσους ἂν加虚拟式表示不确定而具有涵盖性的范围；“凡……的人”是自然汉语，并避免把呼召的方式作宗派化解释。
- source_word: κύριος ὁ θεὸς ἡμῶν
  choice: 主我们的上帝
  rationale: 直接保留“主”与“我们的上帝”的同位关系，不增加原文没有的解释。
theological_decisions:
- issue: “远方之人”的范围
  choice: 宽泛译作“一切远方之人”，不在正文中限定其身份。
  alternative: 专指远地的散居犹太人；专指外邦人；兼指地理上和圣约关系上的疏远者。
  rationale: 原句可唤起地理距离，也可能含有与上帝子民疏远的意味；本节没有明确排除其中任何一层，故保留张力。
- issue: ὅσους ἂν προσκαλέσηται中的神圣呼召
  choice: 译作“凡主我们的上帝所召的人”，只陈述呼召及其范围。
  alternative: 解释为特定神学体系中的有效呼召；或解释为普遍邀请。
  rationale: 希腊文明确把领受应许的人与上帝的召联系起来，却未在本节界定这种呼召的运作方式，因此不引入宗派立场。
- issue: “凡……所召的人”与“一切远方之人”的句法关系
  choice: 用“就是给”表明后半句进一步界定应许所及的人。
  alternative: 把两者译成彼此独立的两组人。
  rationale: ὅσους ἂν προσκαλέσηται在句中限定前述范围；汉语补出“就是给”可清楚传达这一关系，而未改变原文所述对象。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“这应许”“儿女”“远方之人”兼顾可懂度与经文语体；正文避免使用会预先限定外邦人、散居犹太人或特定救恩论体系的措辞。
