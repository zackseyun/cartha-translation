  - severity: low
    issue: ‘上帝借着大能……向你们证实的一个人’有轻微搭配歧义。
    rationale: 可将‘经上帝’用于‘证实’，并把‘借着他’明确连到‘施行’；如此既更自然，也避免将‘大能’误当作单纯抽象工具。
