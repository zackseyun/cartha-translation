source:
  edition: SBLGNT
  text: Ἄνδρες Ἰσραηλῖται, ἀκούσατε τοὺς λόγους τούτους. Ἰησοῦν τὸν Ναζωραῖον, ἄνδρα ⸂ἀποδεδειγμένον ἀπὸ τοῦ θεοῦ⸃ εἰς ὑμᾶς δυνάμεσι καὶ τέρασι καὶ σημείοις οἷς ἐποίησεν δι’ αὐτοῦ ὁ θεὸς ἐν μέσῳ ὑμῶν, ⸀καθὼς αὐτοὶ οἴδατε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/022.yaml
  text: 'Men of Israel[a], hear these words: Jesus the Nazarene, a man attested to you by God with miracles and wonders and signs that God did through him in your midst[b], just as you yourselves know—'
translation:
  language: zh_hans
  text: “以色列人哪，你们要听这些话：拿撒勒人耶稣[a]，是一位经上帝借着他在你们中间所施行的大能、奇事和神迹[b]向你们证实的人，正如你们自己所知道的——”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“拿撒勒的耶稣”。希腊语 Ναζωραῖος 可表示与拿撒勒相关的身份或称号。
    reason: lexical_alternative
  - marker: b
    text: “大能”也可译“异能”或“有力的作为”。希腊语 δυνάμεσι 在这里指彰显能力的超常作为。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: 以色列人哪
  rationale: 这是对以色列男子的直接呼语。现代汉语以“以色列人哪”自然表达郑重呼告；上下文中的听众范围不另行窄化，而呼语语气由“哪”保留。
- source_word: ἀκούσατε τοὺς λόγους τούτους
  choice: 请听这些话
  rationale: 保留命令听众留心的语气，也按 λόγους 直译为“这些话”，不扩译成“这信息”。
- source_word: Ἰησοῦν τὸν Ναζωραῖον
  choice: 拿撒勒人耶稣
  rationale: Ναζωραῖος 是与拿撒勒相关的称号或身份描述；“拿撒勒人耶稣”在中文中既简洁，又保留其描述性，而不强行限定为单纯的出生地表达。
- source_word: ἄνδρα
  choice: 一个人
  rationale: 明确保留原文对耶稣作为“人”的称述，不以较含混的“这一位”替代。
- source_word: ἀποδεδειγμένον ἀπὸ τοῦ θεοῦ εἰς ὑμᾶς
  choice: 是上帝……向你们证实的
  rationale: ἀποδείκνυμι 在此表示公开显示、证明或证实；“向你们证实”保留 εἰς ὑμᾶς 的指向，并让上帝作为证实者。
- source_word: δυνάμεσι καὶ τέρασι καὶ σημείοις
  choice: 大能、奇事和神迹
  rationale: 保留三项并列。δυνάμεις 原义侧重能力及其彰显，译作“大能”可保留这一层面；“奇事”和“神迹”分别传达令人惊异和作为记号的含义。
- source_word: οἷς ἐποίησεν δι’ αὐτοῦ ὁ θεὸς
  choice: 这些事是上帝借着他……施行的
  rationale: 明确以上帝为施行者，以耶稣为中介，忠实保留 ὁ θεός 与 δι’ αὐτοῦ 所表达的施事关系。
- source_word: ἐν μέσῳ ὑμῶν
  choice: 在你们中间
  rationale: 自然表达事情发生于听众当中，也与前面的“向你们”有所区分。
- source_word: καθὼς αὐτοὶ οἴδατε
  choice: 正如你们自己知道的
  rationale: “你们自己”保留 αὐτοί 的强调语气。
theological_decisions:
- issue: ἄνδρα 所表达的基督人性
  choice: 在正文中明确译作“一个人”
  alternative: 译作“这一位”或省略
  rationale: 原文明确称耶稣为 ἄνδρα。保留这一用语忠实呈现彼得此处对耶稣真实人性的陈述，同时不据此否定新约其他经文对其身份的陈述。
- issue: 神迹句中的施事关系
  choice: 以上帝为主语，并译出“借着他”
  alternative: 把耶稣写成这些事的直接主语，或模糊施事者
  rationale: 原文明确以上帝为主语，δι’ αὐτοῦ 则把耶稣表述为上帝施行这些事所借着的那一位。译文保留本节自身的神学张力，不用其他经文的表述将其改写。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“哪”保留公开讲论中的郑重呼告；句末破折号显示本节的话尚未结束。正文中的两个脚注标记均紧随所说明的词语。
