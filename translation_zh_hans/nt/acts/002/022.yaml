  source_fidelity: 译文总体准确保留了呼语、耶稣的称号、‘人’、上帝的施事地位、‘借着他’以及听众亲知的强调。不过，‘上帝借着大能、奇事和神迹向你们证实的一个人’的修饰关系略显松散，容易暂时读成上帝‘借着大能’这一抽象方式证实；后面的‘这些事是……施行的’虽不误义，却将原文紧密的关系从句拆成较重复的独立句。
  naturalness: 建议将神迹三项置入‘上帝借着他在你们中间所施行的……’这一完整定语结构中，使现代汉语句法更顺畅，也更清楚地对应原文的关系从句。‘经上帝……向你们证实的人’庄重自然，适合彼得公开讲论的语体。
  terminology: ‘以色列人哪’、‘拿撒勒人耶稣’、‘大能、奇事和神迹’及‘上帝’均可保留。‘经上帝……证实的人’保留 ἄνδρα 的‘人’和 ἀποδεδειγμένον 的公开证实含义，不把上帝借着耶稣施行的作为改写为耶稣独自施行。
