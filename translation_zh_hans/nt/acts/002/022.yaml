revisions:
- from: “以色列人哪，请听这些话：拿撒勒人耶稣[a]，是上帝借着大能、奇事和神迹[b]向你们证实的一个人；这些事是上帝借着他在你们中间施行的，正如你们自己知道的——”
  to: “以色列人哪，你们要听这些话：拿撒勒人耶稣[a]，是一位经上帝借着他在你们中间所施行的大能、奇事和神迹[b]向你们证实的人，正如你们自己所知道的——”
  rationale: 修订将原文‘借着大能、奇事和神迹，……上帝借着他在你们中间施行’整合为汉语中清晰的定语结构。这样保留三项并列、上帝为施行者、耶稣为中介及‘向你们’的受向，同时维持‘一位……人’对 ἄνδρα 的明确表达和句末未完的语势。
