  text: ἀσφαλῶς οὖν γινωσκέτω πᾶς οἶκος Ἰσραὴλ ὅτι καὶ κύριον ⸂αὐτὸν καὶ χριστὸν⸃ ⸂ἐποίησεν ὁ θεός⸃, τοῦτον τὸν Ἰησοῦν ὃν ὑμεῖς ἐσταυρώσατε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/036.yaml
  text: Therefore let all the house of Israel know for certain that God has made him both Lord and Messiah—this Jesus whom you crucified[a][b].
translation:
  language: zh_hans
  text: 所以，以色列全家都要确实知道：上帝已经使这位耶稣成为主和弥赛亚[a][b]——就是你们钉十字架的那一位。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“基督”。希腊语 Χριστός（Christos）在这里是称号，意为“受膏者”；因彼得正向以色列全家讲话，正文译作“弥赛亚”。
    reason: alternative_reading
  - marker: b
    text: “使……成为”也可译为“立……为”或“定……为”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσφαλῶς
  choice: 确切
  rationale: 表达确定无疑的认识，保留彼得宣告中的强调语气，也符合现代汉语表达。
- source_word: οὖν
  choice: 所以
  rationale: 承接前文关于耶稣复活与高升的论证，清楚标明推论关系。
- source_word: γινωσκέτω
  choice: 都要……知道
  rationale: 保留第三人称命令式的劝告与宣告力度；主语虽为集合性的单数，中文以“都要”自然涵盖全体。
- source_word: πᾶς οἶκος Ἰσραήλ
  choice: 以色列全家
  rationale: 保留圣经中指整个盟约群体的“家”之意，同时采用自然、庄重的现代汉语语序。
- source_word: κύριον
  choice: 主
  rationale: 既表达至高权柄，也呼应上文所引用经文中的“主”；译作“主人”会削弱此处的尊荣与称号意味。
- source_word: Χριστόν
  choice: 弥赛亚
  rationale: 此处在对以色列全家的讲话中明显作为称号使用；“弥赛亚”比音译称谓“基督”更直接显明其受膏者称号之意。
- source_word: ἐποίησεν
  choice: 已经使……成为
  rationale: 保留 ποιέω 的基本语义及已完成行动对当前的意义；不在正文中改译为解释性更强的“立为”，以免过早消除原文可能引起的张力。
- source_word: τοῦτον τὸν Ἰησοῦν
  choice: 这位耶稣
  rationale: 保留指示词的特指和强调作用；“这位”在中文中自然且庄重。
- source_word: ὃν ὑμεῖς ἐσταυρώσατε
  choice: 就是你们钉十字架的那一位
  rationale: 直接保留第二人称复数的责问力度，并以关系分句自然回指耶稣。
theological_decisions:
- issue: “上帝使他成为主、成为弥赛亚”与基督论的关系
  choice: 正文直译为“已经使……成为”，注释说明在上下文中指上帝使耶稣高升并公开确立其救赎历史中的身份与权柄。
  alternative: 正文解释性译作“立他为主、为弥赛亚”，或将其理解为耶稣的神性本质在此刻才发生改变。
  rationale: 原文 ἐποίησεν 应当保留其直接语义，不宜因神学顾虑而弱化；但上下文聚焦复活、高升和公开宣告，并不要求把这句话理解为耶稣本质的改变。注释既防止误读，也不取代正文的真实措辞。
- issue: Χριστός 的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 彼得面对“以色列全家”宣告耶稣的身份，此处称号意味鲜明；“弥赛亚”更直接呈现犹太受膏君王的背景，同时以注释保留传统译名“基督”。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“以色列全家”保留原文的群体性圣经用语；“确切知道”体现 ἀσφαλῶς 的强调；破折号突出末尾“你们钉十字架”的对照和责问。所有注脚标记均在正文出现。
