  text: ἐξίσταντο ⸀δὲ καὶ ἐθαύμαζον ⸀λέγοντες· ⸀Οὐχ ἰδοὺ ⸀πάντες οὗτοί εἰσιν οἱ λαλοῦντες Γαλιλαῖοι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/007.yaml
  text: And they were astonished and amazed[a], saying, “Look, are not all these who are speaking Galileans?”
translation:
  language: zh_hans
  text: 他们又惊愕又诧异，说：“看哪[a]，这些说话的不都是加利利人吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们看。”
    reason: 词汇异译：ἰδού是引人注意的用语，可按汉语语境译为“看哪”或“你们看”。
lexical_decisions:
- source_word: ἐξίσταντο
  choice: 惊愕
  rationale: 此处表示因眼前之事而极其震惊；“惊愕”既保留较强语气，也能与下一个表示惊奇的动词区分。
- source_word: δὲ
  choice: 又
  rationale: δέ在这里是轻微的叙事连接词；结合καί译作“又……又……”，自然呈现两个并列且累加的反应。
- source_word: καὶ
  choice: 又
  rationale: 连接两个未完成时动词，表示众人的双重持续反应；汉语“又……又……”清楚自然。
- source_word: ἐθαύμαζον
  choice: 诧异
  rationale: 表示因非同寻常之事而惊奇；“诧异”与“惊愕”并列，避免将两个不同动词合并为一个意思。
- source_word: λέγοντες
  choice: 说
  rationale: 该现在分词引出他们所说的话；现代汉语用“说”简洁自然。
- source_word: Οὐχ
  choice: 不……吗
  rationale: οὐχ引导预期肯定回答的否定问句；汉语“不……吗”保留这一问句取向。
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 这是引人注意的指示语。“看哪”保留其郑重、突显作用，同时在经文语体中清楚可懂。
- source_word: πάντες οὗτοί
  choice: 这些……都
  rationale: 以汉语常用的周遍结构“这些……都”表达整组人，无需添加原文没有的“男人”等限定。
- source_word: οἱ λαλοῦντες
  choice: 说话的
  rationale: 名词化的现在分词指正在说话的那些人；“说话的”自然保留进行中的动作。
- source_word: Γαλιλαῖοι
  choice: 加利利人
  rationale: 直接表达地域身份，不增添有关口音、教育或社会地位的推断。
theological_decisions:
- issue: “加利利人”所隐含的地域或社会意味
  choice: 只译作“加利利人”，不加解释性修饰
  alternative: 译作“来自北方的加利利人”或“没有学问的加利利人”
  rationale: 本节只说明听众因说话者全是加利利人而诧异，却没有明说诧异的具体原因；直译地域称谓可保留原文的含蓄和张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“又惊愕又诧异”保留原文两个并列反应；问句使用“不都是……吗”体现预期肯定回答的语气。
