base_translation:
  language: en
  yaml_path: translation/nt/acts/024/011.yaml
  text: as you are able to ascertain[a], that it has been no more than twelve days since I went up to Jerusalem to worship,
translation:
  language: zh_hans
  text: 你可以查明：我上耶路撒冷去敬拜到现在，还不超过十二天。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δυναμένου σου ἐπιγνῶναι
  choice: 你可以查明
  rationale: 属格独立结构表达腓力斯有能力核实事实；“查明”符合司法申辩语境，也保留了“能够确定”的含义。
- source_word: οὐ πλείους εἰσίν μοι ἡμέραι δώδεκα
  choice: 不超过十二天
  rationale: 这是希腊语表示已经过时间的习惯说法；现代汉语用“不超过十二天”自然、准确。
- source_word: ἀφ’ ἧς
  choice: 从……到现在
  rationale: 标明计算时段的起点；与汉语的时间表达配合，清楚传达“自从”的意思。
- source_word: ἀνέβην
  choice: 我上
  rationale: 保留前往耶路撒冷惯用的“上去”方向表达，同时避免在本句中使用累赘的“上到”。
- source_word: προσκυνήσων
  choice: 敬拜
  rationale: 将表目的的将来分词译入“上耶路撒冷敬拜”结构；不补出原文省略的敬拜对象。
- source_word: εἰς Ἰερουσαλήμ
  choice: 耶路撒冷
  rationale: 与“上”组合为现代汉语自然的目的地表达“上耶路撒冷”。
