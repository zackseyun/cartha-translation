  text: εὑρόντες γὰρ τὸν ἄνδρα τοῦτον λοιμὸν καὶ κινοῦντα ⸀στάσεις πᾶσι τοῖς Ἰουδαίοις τοῖς κατὰ τὴν οἰκουμένην πρωτοστάτην τε τῆς τῶν Ναζωραίων αἱρέσεως,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/005.yaml
  text: For we have found this man to be a plague, stirring up riots among all the Jews throughout the inhabited world, and also a ringleader of the sect of the Nazarenes,
translation:
  language: zh_hans
  text: 我们发现这人像瘟疫一样，在普天下所有犹太人中煽动骚乱，又是拿撒勒人这一派的头目。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λοιμόν
  choice: 如同瘟疫
  rationale: 该词本义为“瘟疫”，在此作强烈贬义比喻，指危害公众的人；保留原告方刻意尖锐的措辞，并加“如同”使现代汉语自然。
- source_word: κινοῦντα στάσεις
  choice: 煽动骚乱
  rationale: στάσεις在司法控告语境中指骚乱、叛乱或暴动；“煽动骚乱”准确表达κινοῦντα的主动挑起含义，也不把指控强化为已经定罪的“叛乱”。
- source_word: τὴν οἰκουμένην
  choice: 普天下
  rationale: 指当时人所认知的有人居住的世界，常具体关涉罗马世界；“普天下”符合庄重叙事语体，并保留控词的夸张范围。
- source_word: πρωτοστάτην
  choice: 头目
  rationale: 该词指站在最前面的人、首领；控告语境带贬义，“头目”比中性的“领袖”更能传达原话语气。
- source_word: αἱρέσεως
  choice: 派
  rationale: 在此指犹太教内部被辨认出的派别或集团；不用现代语境中预设谬误或异端判断的“异端”，避免加入原文未明说的神学裁断。
- source_word: τῶν Ναζωραίων
  choice: 拿撒勒派
  rationale: 直指“拿撒勒人的派别”，即以拿撒勒人耶稣为标识的群体；采用汉语中简洁自然的派别名称。
theological_decisions:
- issue: αἵρεσις是否译作“异端”
  choice: 派
  alternative: 异端
  rationale: 原词可指党派、宗派，语境虽为敌对指控，却不必然包含后世教义分类意义上的“异端”；因此保留历史与神学上的开放性。
- issue: 控告内容是否作为事实陈述
  choice: 保留原告方直接陈述的形式
  alternative: 加上“据称”等距离化措辞
  rationale: 本节是帖土罗陈述控词的一部分，原文以直接断言表达控方立场；译文不额外插入叙述者评判，也不暗示这些指控已被证实。
translation_notes:
  register: 采用现代、庄重而清楚的法庭控告语体。“如同瘟疫”“煽动骚乱”“头目”共同保留原告言辞的攻击性；句法略作汉语化，仍维持三个并列指控。
