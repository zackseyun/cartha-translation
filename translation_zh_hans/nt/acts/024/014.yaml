  text: ὁμολογῶ δὲ τοῦτό σοι ὅτι κατὰ τὴν ὁδὸν ἣν λέγουσιν αἵρεσιν οὕτως λατρεύω τῷ πατρῴῳ θεῷ, πιστεύων πᾶσι τοῖς κατὰ τὸν νόμον καὶ ⸂τοῖς ἐν⸃ τοῖς προφήταις γεγραμμένοις,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/014.yaml
  text: But I confess this to you[a], that according to the Way, which they call a sect, so I worship the God of our fathers, believing everything written in the Law and in the Prophets[b],
translation:
  language: zh_hans
  text: 但我向你承认：我按着他们称为“教派”[a]的这道路，敬拜列祖的上帝；我也相信凡律法和先知书上所记载的一切。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “教派”也可译作“派别”。这里的希腊词指一个派别或群体，不必然含有后世“异端”一词的教义定罪意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμολογῶ
  choice: 承认
  rationale: 这里指保罗在腓力斯面前公开确认自己的立场；“承认”保留正式陈述的语气，又不必然暗示认罪。
- source_word: κατὰ τὴν ὁδόν
  choice: 按着……这道路
  rationale: “道路”是《使徒行传》中早期基督徒群体及其信仰生活的称谓；“按着”表达 κατά 所指的遵循与一致。
- source_word: αἵρεσιν
  choice: 教派
  rationale: 此处指一个宗教派别或群体，是对方所用的称呼；避免译作带有后世教义定罪意味的“异端”。
- source_word: οὕτως λατρεύω
  choice: 正是……敬拜
  rationale: οὕτως 回指前面的“按着这道路”，说明保罗敬拜的方式；“正是”使这一关联在现代汉语中清楚自然。
- source_word: τῷ πατρῴῳ θεῷ
  choice: 我们祖先的上帝
  rationale: πατρῷος 表示祖传、先祖所敬奉的；结合犹太共同体语境，译为“我们祖先的上帝”，表达与以色列先祖信仰的延续。
- source_word: πιστεύων
  choice: 并且相信
  rationale: 该现在分词说明保罗敬拜上帝时所持的信念；汉语用并列结构比直译为分词更自然，同时保留其紧密联系。
- source_word: πᾶσι τοῖς ... γεγραμμένοις
  choice: 所记载的一切
  rationale: 表达凡已写下并存于经卷中的全部内容，保留 πᾶσι 的全面性。
- source_word: κατὰ τὸν νόμον καὶ τοῖς ἐν τοῖς προφήταις
  choice: 律法书和先知书中
  rationale: 这里指犹太圣经的两类经卷；加“书”可让现代读者明确这是经籍名称，并保持两者平行。
theological_decisions:
- issue: 保罗与犹太信仰及“这道路”的关系
  choice: 把“这道路”呈现为保罗敬拜以色列祖先之上帝并相信律法书和先知书的方式
  alternative: 把基督信仰呈现为与犹太信仰相对立的独立宗教
  rationale: 本节明确把按着“这道路”敬拜，与敬拜祖先的上帝、相信犹太经书连在一起；译文保留这种延续性，不把后世宗教分界带入经文。
- issue: αἵρεσις 是否具有后世“异端”的教义定罪含义
  choice: 译为“教派”，保留对方将“这道路”视作派别的说法
  alternative: 译为“异端”
  rationale: 在本处，该词主要表示派别或党派；译作“异端”会过早加入后世技术性的教义判定。
translation_notes:
  register: 采用现代、庄重而易懂的法庭陈述语体。“我正是按着……敬拜”略作汉语语序调整，以清楚保留 οὕτως 对前文的回指。“律法书和先知书”作为经卷类别处理。
