  text: τινὲς δὲ ἀπὸ τῆς Ἀσίας Ἰουδαῖοι, οὓς ⸀ἔδει ἐπὶ σοῦ παρεῖναι καὶ κατηγορεῖν εἴ τι ἔχοιεν πρὸς ⸀ἐμέ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/019.yaml
  text: But there are some Jews from Asia who ought to have been present before you and to accuse me[b][a], if they had anything against me.
translation:
  language: zh_hans
  text: 可是，有些从亚细亚[a]来的犹太人，他们本该到你面前出庭，并控告我[b]；若他们有什么事要控告我，就该由他们提出。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“亚细亚”指小亚细亚西部的罗马行省，不是现代所说的亚洲大陆。
    reason: cultural_note
  - marker: b
    text: “控告我”也可译作“向我提出指控”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τινὲς δὲ
  choice: 可是，有几个
  rationale: δὲ承接上文并带有转折意味，译作“可是”；τινὲς表示未具体指明的一些人，译作“有几个”自然清楚。
- source_word: ἀπὸ τῆς Ἀσίας Ἰουδαῖοι
  choice: 从亚细亚来的犹太人
  rationale: Ἀσία在这里指罗马帝国的亚细亚行省；正文保留传统地名“亚细亚”，并以脚注澄清其历史地理含义。
- source_word: ἔδει
  choice: 本该
  rationale: 未完成时的非人称必要表达在语境中含有应当如此却未实现的意味；“本该”简洁保留这种未履行的义务。
- source_word: ἐπὶ σοῦ παρεῖναι
  choice: 到你面前来
  rationale: 在司法场景中表示亲自来到审判官面前；此译法自然，也保留“在场／出庭”的含义。
- source_word: κατηγορεῖν
  choice: 控告我
  rationale: 这是司法用语，指提出指控；“控告”既准确又适合本段审讯语境。
- source_word: εἴ τι ἔχοιεν πρὸς ἐμέ
  choice: 如果他们真有什么事要告我
  rationale: 保留条件句及其潜在、存疑意味；“有什么事要告我”不把τι限定为某一项正式罪名，而“真”自然传达该条件所含的质疑语气。
