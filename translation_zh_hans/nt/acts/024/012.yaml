  text: καὶ οὔτε ἐν τῷ ἱερῷ εὗρόν με πρός τινα διαλεγόμενον ἢ ⸀ἐπίστασιν ποιοῦντα ὄχλου οὔτε ἐν ταῖς συναγωγαῖς οὔτε κατὰ τὴν πόλιν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/012.yaml
  text: And they found me neither in the temple arguing with anyone nor stirring up a crowd[b][a], neither in the synagogues nor throughout the city.
translation:
  language: zh_hans
  text: 他们没有发现我在圣殿里同任何人争辩[a]，或聚集人群[b]；也没有发现我在各会堂里或全城各处这样做。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“同任何人辩论”或“同任何人讨论”。这个希腊语动词可指讲论、讨论或辩论；这里是保罗针对扰乱公众秩序的指控进行申辩，因此正文采用较具对抗意味的“争辩”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“引起群众骚动”或“使群众聚集起来”。这个希腊语表达指造成群众聚集或公共骚动，但不一定意味着已经发生暴乱。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱερῷ
  choice: 圣殿
  rationale: 这里的 ἱερόν 通常指圣殿建筑群，而不特指内殿；“圣殿”是现代汉语中自然且通行的译法。
- source_word: εὗρόν με
  choice: 他们并没有发现我
  rationale: 保留法庭申辩的陈述语气；否定词 οὔτε 统摄此动词及后续地点。
- source_word: πρός τινα διαλεγόμενον
  choice: 同任何人争辩
  rationale: διαλέγομαι 可指交谈、讨论、辩论或争辩；控告与申辩的语境略偏向带争议性的公开辩论，但其词义弹性以脚注保留。
- source_word: ἐπίστασιν ποιοῦντα ὄχλου
  choice: 煽动群众
  rationale: 该表达指使群众聚集、骚动或引发公众骚乱；“煽动群众”符合指控语境，同时不强化为暴动。
- source_word: ὄχλου
  choice: 群众
  rationale: 不定指的一群人；“群众”比“暴民”中性，避免加入原文未必具有的暴力意味。
- source_word: συναγωγαῖς
  choice: 各会堂
  rationale: 复数形式译为“各会堂”，符合当时犹太会堂的语境。
- source_word: κατὰ τὴν πόλιν
  choice: 全城各处
  rationale: κατά 加宾格在此表达遍及某区域，“全城各处”自然传达分布性的空间范围。
