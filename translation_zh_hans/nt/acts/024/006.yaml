base_translation:
  language: en
  yaml_path: translation/nt/acts/024/006.yaml
  text: He even tried to defile the temple[a], and we seized him,
translation:
  language: zh_hans
  text: 他甚至企图玷污圣殿[a]，我们把他抓住了，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本在这里增添较长的文字，其中包括：他们本想按照自己的律法审判保罗，但千夫长吕西亚从他们手中把他夺走了。
    reason: textual_variant
lexical_decisions:
- source_word: ὃς
  choice: 他
  rationale: 关系代词承接前文所指的保罗；本节是未完的控告语句，现代汉语用“他”重新起句更自然。
- source_word: καὶ
  choice: 甚至
  rationale: 在控告语境中具有递进、加强语气的作用，表达“连圣殿也企图玷污”。
- source_word: τὸ ἱερὸν
  choice: 圣殿
  rationale: ἱερόν在这里指整个圣殿范围，而非专指内殿；“圣殿”是简明、通行的译法。
- source_word: ἐπείρασεν
  choice: 企图
  rationale: 此处表示尝试做某事；“企图”符合控告的语境，也与不定式自然衔接。
- source_word: βεβηλῶσαι
  choice: 玷污
  rationale: 指使圣物或圣地失去神圣、受到亵渎；“玷污”能够保留圣殿洁净方面的指控，且易于理解。
- source_word: ὃν
  choice: 他
  rationale: 宾格关系代词仍指保罗；汉语以“他”作“抓住”的宾语最自然。
- source_word: ἐκρατήσαμεν
  choice: 我们就抓住了
  rationale: κρατέω在此指强行抓住、控制；“抓住”保留动作性和敌对色彩。“就”自然连接企图与抓捕，但不额外断定严格的因果关系。
theological_decisions:
- issue: 使徒行传24:6短读本与较长拜占庭读本之间的文本差异
  choice: 正文只翻译SBLGNT所载的短句，并以逗号结尾，衔接下节。
  alternative: 部分抄本续有他们想按自己的律法审判保罗，以及千夫长吕西亚从他们手中把他夺去等内容；具体措辞因文本传统而异。
  rationale: 正文以指定的SBLGNT希腊文本为准，不把较晚或证据较弱的扩展内容并入正文；同时用脚注告知读者这一重要异文。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“企图玷污圣殿”保持法庭控告的语气；“抓住”比“逮捕”更贴近原文的动作色彩。正文保留句末逗号，因为希腊短读本在此处仍与后文的控告陈述相连。
