  text: κληθέντος δὲ αὐτοῦ ἤρξατο κατηγορεῖν ὁ Τέρτυλλος λέγων· Πολλῆς εἰρήνης τυγχάνοντες διὰ σοῦ καὶ ⸀διορθωμάτων γινομένων τῷ ἔθνει τούτῳ διὰ τῆς σῆς προνοίας
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/002.yaml
  text: 'And when he had been summoned[a], Tertullus began to accuse him, saying: “Since through you we are enjoying much peace[b], and reforms are being brought to this nation through your foresight,”'
translation:
  language: zh_hans
  text: 他被传唤后，帖土罗就开始控告他，说：“我们因你享有极大的安宁，这个民族也因你的远见[b]而有了种种改革[a]；”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “改革”或译“改进”或“纠正措施”。
    reason: lexical_alternative
  - marker: b
    text: “远见”或译“审慎谋划”或“护理”。这里的希腊词指统治者的预先筹划或行政安排，并非必然指神的护理。
    reason: lexical_alternative
lexical_decisions:
- source_word: κληθέντος δὲ αὐτοῦ
  choice: 他被传来后
  rationale: 这是属格独立结构，交代帖土罗开始控告前的情形；在司法语境中，“传来”比一般的“叫来”更贴切。代词所指是保罗。
- source_word: ἤρξατο κατηγορεῖν
  choice: 就开始控告他
  rationale: 保留起始体意义；“控告”直接体现法庭语境，又不像“起诉”那样加入更具体的法律程序含义。
- source_word: ὁ Τέρτυλλος
  choice: 帖土罗
  rationale: 采用现代中文圣经人名的通行音译。
- source_word: Πολλῆς εἰρήνης τυγχάνοντες
  choice: 我们……享有极大的安宁
  rationale: τυγχάνω与属格连用，表示享有或得到；“极大的安宁”自然传达πολλῆς εἰρήνης，也保留帖土罗奉承性的政治措辞。
- source_word: διὰ σοῦ
  choice: 因你
  rationale: διά加属格表示媒介或施事；中文“因你”简洁自然，表明这安宁被归功于腓力斯。
- source_word: διορθωμάτων
  choice: 种种改革
  rationale: διόρθωμα可指改革、改进或纠正措施；“种种改革”符合政治行政语境，并保留复数含义。
- source_word: γινομένων τῷ ἔθνει τούτῳ
  choice: 这个民族……有了
  rationale: γίνομαι在此表示改革为这个民族发生、实现；“有了”不额外明说施行方式，同时在现代中文中自然。
- source_word: τῷ ἔθνει τούτῳ
  choice: 这个民族
  rationale: ἔθνος在此指罗马治理下的犹太民族；“民族”比“外邦”或笼统的“人民”更符合政治语境。
- source_word: διὰ τῆς σῆς προνοίας
  choice: 因你的远见
  rationale: πρόνοια在这里指统治者的预见、筹划或审慎治理；“远见”保留奉承意味，也避免使人误解为神学意义上的护理。
theological_decisions:
- issue: 非神学行政语境中πρόνοια的译法
  choice: 远见
  alternative: 护理；审慎谋划
  rationale: 这里是帖土罗对人间统治者腓力斯的奉承，并非宣称神的护理。“远见”既传达预先筹划之意，也不引入原文没有的神学含义。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话，保留法庭陈述和奉承性语气。句末用分号，提示帖土罗的话在下一节继续，避免把本节误作完整句。
