  text: ἅμα καὶ ἐλπίζων ὅτι χρήματα δοθήσεται αὐτῷ ὑπὸ τοῦ ⸀Παύλου· διὸ καὶ πυκνότερον αὐτὸν μεταπεμπόμενος ὡμίλει αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/026.yaml
  text: At the same time he was hoping that money would be given to him by Paul[a]; therefore he also sent for him more often and talked with him.
translation:
  language: zh_hans
  text: 同时，腓力斯也指望保罗会给他钱[a]；因此，他更频繁地把保罗召来，和他交谈。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 按本节语境，更具体地说，也可理解为“他指望保罗贿赂他”。希腊原文只说“钱”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅμα καὶ
  choice: 同时……也
  rationale: 表达与上文所述情形同时发生，并自然保留 καί 的附加语气。
- source_word: ἐλπίζων
  choice: 指望
  rationale: 现在分词表示腓力斯持续抱有的期待；“指望”在叙事中自然，也能体现其有所图求。
- source_word: χρήματα
  choice: 钱
  rationale: 原词明确指金钱，并未直接使用“贿赂”一词；正文采用“钱”以避免把语境暗示写成明说。
- source_word: δοθήσεται αὐτῷ ὑπὸ τοῦ Παύλου
  choice: 保罗会给他
  rationale: 中文主动式比逐字保留希腊文被动式更自然，同时完整表达钱的来源是保罗、接受者是腓力斯。
- source_word: διὸ καὶ
  choice: 因此
  rationale: 清楚表达后续反复召见保罗是由期待得钱所导致；其中附加关系已由上下文和前句的“也”自然体现。
- source_word: πυκνότερον
  choice: 更频繁地
  rationale: 保留比较级所表示的频率增加；措辞准确而符合现代书面汉语。
- source_word: μεταπεμπόμενος
  choice: 把保罗召来
  rationale: 该中动态分词表示派人叫某人来；结合保罗受拘押的处境，“召来”简洁自然。
- source_word: ὡμίλει αὐτῷ
  choice: 和他交谈
  rationale: 该动词表示彼此谈话或交谈，而非正式演说；“交谈”保留互动性质。
theological_decisions:
- issue: 是否在正文中明确把腓力斯所期待的钱译为“贿赂”
  choice: 正文译作“钱”，由语境显出行贿受贿的含义
  alternative: 译作“贿赂”，或“指望保罗贿赂他”
  rationale: 上下文强烈暗示腓力斯有受贿的腐败动机，但希腊文 χρήματα 本身只说“钱”。保留正文的词义宽度，可避免将合理推论提升为原文明说，并以脚注说明具体语境。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“腓力斯”明确主语，避免中文连续代词造成歧义；“把保罗召来，和他交谈”体现反复召见及对话性质。
