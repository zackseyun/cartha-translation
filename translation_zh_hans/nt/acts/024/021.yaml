  text: ἢ περὶ μιᾶς ταύτης φωνῆς ἧς ἐκέκραξα ⸂ἐν αὐτοῖς ἑστὼς⸃ ὅτι Περὶ ἀναστάσεως νεκρῶν ἐγὼ κρίνομαι σήμερον ⸀ἐφ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/021.yaml
  text: 'or about this one statement that I shouted while standing among them: ‘It is concerning the resurrection of the dead that I am being judged before you today.’[a][b]'
translation:
  language: zh_hans
  text: 除非是关于我站在他们中间时高声喊出的这一句话：‘我今天在你们面前因死人复活的事受审。’[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一句话”或译“一个呼喊”或“一个声音”；希腊词既可指所说的话，也可指发出这话的声音或呼喊。
    reason: lexical_alternative
  - marker: b
    text: “死人复活”或译“从死人中复活”。
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνῆς
  choice: 一句话
  rationale: φωνή本可指“声音、呼喊”，但此处由περὶ引出，并紧接所说的具体内容，因此译为“一句话”更自然，同时用脚注保留词义范围。
- source_word: ἐκέκραξα
  choice: 高声喊
  rationale: κράζω表示大声公开发言；“高声喊”既保留音量和力度，也适合当时公开申辩的场景。
- source_word: ἐν αὐτοῖς ἑστὼς
  choice: 站在他们中间时
  rationale: 保留ἑστώς的伴随情状和ἐν αὐτοῖς的空间意义，现代汉语表达自然。
- source_word: ἀναστάσεως νεκρῶν
  choice: 死人复活
  rationale: 忠实保留属格结构所表达的普遍性议题，不在正文中缩窄为只指耶稣复活；脚注注明也可理解为“从死人中复活”。
- source_word: κρίνομαι
  choice: 受审
  rationale: 现在时被动语态表示保罗当下正接受司法审理；“受审”比逐字的“被判断”更符合现代汉语法庭语境。
- source_word: ἐφ’ ὑμῶν
  choice: 在你们面前
  rationale: 司法语境中表示来到权威或审判者面前；此译法避免过度断定在场众人都是直接施行审判者。
- source_word: ἢ
  choice: 要不然
  rationale: 承接上一节，提出控告者或许能指出的唯一事项；“要不然”在汉语中清楚体现这种接续和例外意味。
- source_word: μιᾶς ταύτης
  choice: 这一句
  rationale: 体现“一”与指示词结合所强调的单一性和特指性。
- source_word: σήμερον
  choice: 今天
  rationale: 采用清楚自然的现代汉语时间表达。
theological_decisions:
- issue: 争议所涉及的复活范围
  choice: 正文译作“死人复活”，保持一般性的表述。
  alternative: 具体理解为耶稣从死人中复活，或以耶稣复活为普遍复活盼望的基础。
  rationale: 希腊文περὶ ἀναστάσεως νεκρῶν本身用语宽泛。本节不宜加入原文没有明说的限定，尽管《使徒行传》整体确实把保罗的信息与耶稣复活联系起来。
translation_notes:
  register: 采用现代、庄重而易懂的法庭申辩语体。“要不然，就说出……有什么不对”补足汉语表达所需的承接关系，但不增添具体罪名；引语中的“为了……的事”自然表达περί所指的审理缘由。
