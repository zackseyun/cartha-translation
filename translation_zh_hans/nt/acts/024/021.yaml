  naturalness: “站在他们中间时高声喊的这一句话”和“因……的事受审”在现代标准汉语中自然、庄重。改为“除非是关于……这一句话”能更自然地保留其承接上文的法庭申辩句式，也避免补入“说出……有什么不对”的命令式措辞。
  terminology: “死人复活”适当地保留了ἀνάστασις νεκρῶν的概括性，不将其限缩为耶稣的复活；“受审”符合κρίνομαι的司法语境。“一句话”可用，脚注保留“呼喊／声音”的词汇可能性。
