  yaml_path: translation/nt/acts/024/015.yaml
  text: having hope in God—which these men themselves also accept—that there is going to be a resurrection of both the righteous and the unrighteous[a].
translation:
  language: zh_hans
  text: 我对上帝怀着盼望；这些人自己也同样承认这盼望：将来义人和不义的人都要复活。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这些人自己也同样期待（或等候）这盼望。”这里的动词可表示“期待、等候”，也可表示“接受、承认”；本句强调双方共有这种盼望。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπίδα ἔχων εἰς τὸν θεόν
  choice: 我对上帝存着盼望
  rationale: 保留ἐλπίς的名词表达及盼望以上帝为指向和对象的含义；“对上帝存着盼望”在现代汉语中自然、庄重。
- source_word: ἣν καὶ αὐτοὶ οὗτοι προσδέχονται
  choice: 就是这些人自己也同样期待的
  rationale: ἣν回指“盼望”；“这些人自己”保留αὐτοὶ与οὗτοι的强调，指现场的控告者。προσδέχονται在此译作“期待”，既表达共同的末世盼望，也保留等候之意。
- source_word: ἀνάστασιν
  choice: 复活
  rationale: 这是现代汉语中表达死人重新起来的标准且准确用语。
- source_word: μέλλειν ἔσεσθαι
  choice: 将来……要
  rationale: 传达将要发生的未来意义，同时避免用“即将”不必要地暗示时间极其临近。
- source_word: δικαίων τε καὶ ἀδίκων
  choice: 义人和不义的人都
  rationale: “都”体现τε καὶ所表示的两类兼包关系；“义人”和“不义的人”清楚保留原文的道德对照。
theological_decisions:
- issue: 保罗所说复活的范围
  choice: 义人和不义的人都要复活
  alternative: 笼统译为所有人复活，不明说两类人的区别
  rationale: 原文明列义人和不义的人两类，因此译文保留其普遍范围和道德区分，却不加入关于两者复活时间、次序或审判方式的后期教义解释。
- issue: προσδέχονται表达认同还是等候
  choice: 期待
  alternative: 接受、承认
  rationale: 该动词可以表达等候、期待，也可在语境中指认可这一盼望。“期待”更直接保留其词汇本义；脚注说明语境中也可能侧重共同接受或承认这一信念。
translation_notes:
  register: 采用现代、清楚而庄重的法庭陈述语体。破折号标明插入的关系从句，使“就是这些人自己也同样期待的”明确回指“盼望”，同时避免生硬照搬希腊语序。
