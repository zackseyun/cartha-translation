base_translation:
  language: en
  yaml_path: translation/nt/acts/024/001.yaml
  text: After five days[a], the high priest Ananias came down with some elders and a certain orator named Tertullus, and they brought charges against Paul before the governor.
translation:
  language: zh_hans
  text: 五天后，大祭司亚拿尼亚带着几位长老和一位名叫帖土罗的辩士[a]下来。他们在总督面前控告保罗。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“演说家”或“法律代言人”；希腊语这个词可指公共演说者，也可指在诉讼中代表一方发言的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ πέντε ἡμέρας
  choice: 五天后
  rationale: μετά加宾格表示一段时间过去之后；译为“五天后”自然简洁。δέ仅轻微推进叙事，在汉语中无需另加连接词。
- source_word: κατέβη
  choice: 下来
  rationale: 保留καταβαίνω的下行方向，也符合从耶路撒冷前往凯撒利亚的地理叙述。
- source_word: ὁ ἀρχιερεὺς Ἁνανίας
  choice: 大祭司亚拿尼亚
  rationale: ἀρχιερεύς指犹太人的大祭司职分；人名按现代汉语圣经通行形式音译。
- source_word: μετὰ πρεσβυτέρων τινῶν
  choice: 带着几位长老
  rationale: πρεσβύτεροι在此指犹太领袖；τινῶν表示其中若干人，译作“几位”自然且不扩大范围。
- source_word: ῥήτορος Τερτύλλου τινός
  choice: 一个名叫帖土罗的讼辩人
  rationale: ῥήτωρ可指公共演说者，也可指法庭中的诉讼代言人；本节处于司法控告场景，“讼辩人”兼顾演说与法律代理色彩，并以脚注保留词义范围。
- source_word: οἵτινες ἐνεφάνισαν
  choice: 他们……控告
  rationale: οἵτινες回指前述一行人；ἐμφανίζω在司法语境中表示正式陈告或提出控诉，译为“控告”准确自然。
- source_word: τῷ ἡγεμόνι κατὰ τοῦ Παύλου
  choice: 在总督面前控告保罗
  rationale: ἡγεμών指罗马总督；κατά加属格在司法语境中意为“针对、控告”，汉语以“在总督面前控告保罗”表达法庭场景。
theological_decisions: []
