  text: Μετὰ δὲ ἡμέρας τινὰς παραγενόμενος ὁ Φῆλιξ σὺν Δρουσίλλῃ τῇ ⸀ἰδίᾳ γυναικὶ οὔσῃ Ἰουδαίᾳ μετεπέμψατο τὸν Παῦλον καὶ ἤκουσεν αὐτοῦ περὶ τῆς εἰς Χριστὸν ⸀Ἰησοῦν πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/024.yaml
  text: After some days[a], Felix came with Drusilla, his own wife, who was Jewish[b], and sent for Paul and heard him concerning faith in Messiah Jesus.
translation:
  language: zh_hans
  text: 过了些日子，腓力斯和自己的妻子土西拉一同来到；土西拉是犹太人。腓力斯召保罗来，听他讲论对弥赛亚[a]耶稣的信心[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“基督耶稣”。希腊语“基督”在这里是称号，意思是“弥赛亚”。
    reason: alternative_rendering
  - marker: b
    text: “信心”也可译作“信靠”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ ἡμέρας τινὰς
  choice: 过了些日子
  rationale: μετά加宾格构成时间表达，意为“过了些日子”；δέ仅有轻微的叙事承接作用，汉语无需另加显著连接词。
- source_word: παραγενόμενος
  choice: 前来
  rationale: 该分词以腓力斯为主语，表示他来到现场；“前来”符合现代汉语叙事表达。
- source_word: σὺν Δρουσίλλῃ τῇ ἰδίᾳ γυναικὶ
  choice: 同自己的妻子土西拉
  rationale: σύν表示陪同；“自己的妻子”保留ἰδίᾳ的强调意味，同时维持自然语序。
- source_word: οὔσῃ Ἰουδαίᾳ
  choice: 土西拉是犹太人
  rationale: 将希腊语分词结构拆为独立分句，使身份说明在现代汉语中清楚自然，又不限定其仅指族裔或宗教归属。
- source_word: μετεπέμψατο
  choice: 叫人把保罗召来
  rationale: 该中动态动词表示派人去请或传召某人；此译法明确表达腓力斯命人召见保罗。
- source_word: ἤκουσεν αὐτοῦ
  choice: 听保罗讲论
  rationale: ἀκούω接属格在此可表示听某人讲话；结合后面的περί短语，“听……讲论”比直译“听他”更符合汉语。
- source_word: περὶ τῆς εἰς Χριστὸν Ἰησοῦν πίστεως
  choice: 讲论对弥赛亚耶稣的信心
  rationale: περί引出谈论的主题；πίστις与εἰς加宾格表示指向弥赛亚耶稣的信，译作“对……的信心”既保留名词形式，也避免扩写为一套教义体系。
- source_word: Χριστὸν Ἰησοῦν
  choice: 弥赛亚耶稣
  rationale: Χριστός在这里仍带有称号意义，因此译出“弥赛亚”，并保留原文“称号＋名字”的次序。
theological_decisions:
- issue: Χριστός的译法
  choice: 弥赛亚耶稣
  alternative: 基督耶稣；耶稣弥赛亚
  rationale: 此处Χριστός可辨识为称号，主文采用“弥赛亚”以显明其意义；脚注保留汉语传统译名“基督耶稣”。
- issue: τῆς εἰς Χριστὸν Ἰησοῦν πίστεως的理解
  choice: 对弥赛亚耶稣的信心
  alternative: 信靠弥赛亚耶稣；弥赛亚耶稣的信实
  rationale: πίστις配合εἰς加宾格，最自然地表示指向某对象的信，故不译作耶稣自身的“信实”；但“信心”与“信靠”的词义重叠在脚注中保留。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。将修饰土西拉的分词结构拆成独立分句，以免长串定语造成歧义；人名采用通行圣经译名“腓力斯”“土西拉”。
