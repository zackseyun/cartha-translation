  text: διαλεγομένου δὲ αὐτοῦ περὶ δικαιοσύνης καὶ ἐγκρατείας καὶ τοῦ κρίματος τοῦ ⸀μέλλοντος ἔμφοβος γενόμενος ὁ Φῆλιξ ἀπεκρίθη· Τὸ νῦν ἔχον πορεύου, καιρὸν δὲ μεταλαβὼν μετακαλέσομαί σε·
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/025.yaml
  text: But as he was discussing righteousness and self-control and the coming judgment, Felix became afraid and answered, “For now, go away. When I get an opportunity, I will summon you.”
translation:
  language: zh_hans
  text: 保罗讲论公义、节制和将来的审判时，腓力斯害怕起来，回答说：“你现在先走吧；等有了机会，我会叫你来。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαλεγομένου
  choice: 讲论
  rationale: 表示保罗就这些主题进行论述或交谈；“讲论”自然庄重，又不把语义限缩为正式辩论。
- source_word: δικαιοσύνης
  choice: 公义
  rationale: 保留该词在伦理和神学层面的广度，不仅指一般的正直行为。
- source_word: ἐγκρατείας
  choice: 节制
  rationale: 准确表达克制欲望、约束自己的含义，也是现代中文熟悉的伦理用语。
- source_word: τοῦ κρίματος τοῦ μέλλοντος
  choice: 将来的审判
  rationale: 直接体现定冠词结构所指向的未来审判，不额外说明审判者或结果。
- source_word: ἔμφοβος γενόμενος
  choice: 害怕起来
  rationale: 表达腓力斯因所听见的内容而进入惧怕状态，符合叙事语势。
- source_word: Τὸ νῦν ἔχον
  choice: 现在先
  rationale: 这是惯用表达，意为“就目前而言”；译为“现在先”符合现代汉语对话语气。
- source_word: καιρὸν μεταλαβών
  choice: 等有了机会
  rationale: 表达获得适当时机或空暇的意思，同时保留时机未定的语气。
- source_word: μετακαλέσομαί
  choice: 会再叫……来
  rationale: 该动词表示派人召来；在本段官员对囚犯的语境中，“再叫你来”自然且准确。
theological_decisions:
- issue: “公义”所指的范围
  choice: 保留概括性的“公义”
  alternative: 译为“为人正直”或明确解释为“神的义”
  rationale: 原文未明确限定是人的伦理正直、神的公义，还是更广的义之主题，因此不在正文中替作者作出神学限定。
- issue: 未来审判的表述
  choice: 将来的审判
  alternative: 即将来到的审判
  rationale: μέλλοντος 可表达未来或将临；此处“将来的”既自然，也避免擅自强化时间上的迫近程度。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。人物对白使用自然口语，但保留腓力斯作为官员下令和允诺召见的语气。无须脚注。
