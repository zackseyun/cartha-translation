  text: παρ’ οὗ δυνήσῃ αὐτὸς ἀνακρίνας περὶ πάντων τούτων ἐπιγνῶναι ὧν ἡμεῖς κατηγοροῦμεν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/008.yaml
  text: From him[a], by examining him yourself[b], you will be able to learn about all these things of which we accuse him.
translation:
  language: zh_hans
  text: 你亲自审问他[a]，就能从他那里查明我们控告他的这一切事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本在第7节及本节开头另有一段话，大意是：千夫长吕西亚强行把保罗从他们手中夺走，又吩咐控告他的人到你这里来。SBLGNT正文不收录这段话。
    reason: textual_variant
lexical_decisions:
- source_word: παρ’ οὗ
  choice: 从他那里
  rationale: παρά接属格表示信息的来源；“从他那里”自然地表明腓力斯可由保罗本人得知相关情况。
- source_word: δυνήσῃ
  choice: 就能
  rationale: δύναμαι的将来时表示随后具备的能力；“就能”也自然承接亲自审问这一条件或途径。
- source_word: αὐτὸς
  choice: 亲自
  rationale: 强调受话者本人采取行动；现代汉语中“亲自”比直译为“你自己”更适合司法语境。
- source_word: ἀνακρίνας
  choice: 审问
  rationale: ἀνακρίνω在司法语境中指审查、讯问；“审问”兼顾法律场景和对当事人的询问。希腊语不明确限定其与主句动作是方式还是先后关系，中文顺序保留两者自然关联。
- source_word: περὶ πάντων τούτων
  choice: 这一切事
  rationale: περί接属格表示“关于”，πάντων τούτων涵盖前述全部指控事项；在“查明……事”的汉语结构中无需另译“关于”。
- source_word: ἐπιγνῶναι
  choice: 查明
  rationale: ἐπιγινώσκω在此司法场景指经过调查而确知；“查明”比泛指的“知道”更贴合语境，同时不过度强化为绝对、完全的认识。
- source_word: ὧν ἡμεῖς κατηγοροῦμεν αὐτοῦ
  choice: 我们控告他的
  rationale: κατηγορέω接人的属格，表示控告某人；“我们控告他的这一切事”保留控告者、被告和各项指控之间的关系，并以自然汉语整合关系从句。
