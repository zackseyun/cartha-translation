  text: δι’ ἐτῶν δὲ πλειόνων ⸂ἐλεημοσύνας ποιήσων εἰς τὸ ἔθνος μου παρεγενόμην⸃ καὶ προσφοράς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/017.yaml
  text: After several years I came to bring alms to my nation[a], and offerings.
translation:
  language: zh_hans
  text: 过了多年，我来到，是要周济我的同胞，并献上供物。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δι’ ἐτῶν δὲ πλειόνων
  choice: 过了多年
  rationale: διά加属格在此表示一段时间过去之后；πλειόνων在这一表达中自然译为“多年”。δέ仅作轻微承接，中文无需另加明显转折词。
- source_word: ἐλεημοσύνας ποιήσων
  choice: 要周济
  rationale: ποιέω与ἐλεημοσύνη构成“施行赒济、给予慈善捐助”的习惯表达。“周济”简洁地传达帮助穷困者的含义，同时避免把ποιέω生硬地直译为“做”。
- source_word: εἰς τὸ ἔθνος μου
  choice: 我的同胞
  rationale: ἔθνος在此指保罗所属的犹太民族。现代汉语用“我的同胞”自然表达他对本民族之人的指称，也符合赒济行为以人为受益者的语境。
- source_word: παρεγενόμην
  choice: 我来
  rationale: παραγίνομαι在此表示来到或抵达；“我来”简明自然，并保留保罗陈述来意的语气。
- source_word: προσφοράς
  choice: 供物
  rationale: προσφορά指献上的礼物，常有敬拜或祭祀语境。“供物”保留其宗教性，又不擅自限定具体种类。
theological_decisions:
- issue: 保罗带到耶路撒冷的慈善行为性质
  choice: 译为“周济”，并以脚注说明是给穷困者的慈善捐助
  alternative: 施舍；赈济；给穷人的捐助
  rationale: 此处主要是词义问题而非教义判断。“周济”在现代中文中清楚而庄重，既表达对贫困者的实际帮助，也不把原文限定为某种特定教会制度。
- issue: “供物”的具体性质
  choice: 保留宽泛的“供物”
  alternative: 祭物；献给上帝的礼物
  rationale: 原文只用προσφοράς，没有进一步说明供物的种类或礼仪形式；译文不应补入原文未明说的限定。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“我来，是要……”自然呈现目的关系；“同胞”比“我的民族”更符合现代汉语习惯，同时保留保罗指本族之人的含义。
