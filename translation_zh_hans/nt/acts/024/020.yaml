- from: 不然，就让这些人自己说，我站在公议会面前时，他们查出我有什么不义的行为。[a]
  to: 或者，让这些人自己说：当我站在议会面前时，他们查出我有什么不法之处。[a]
  rationale: 将ἢ译为“或者”，直接保留其引出替代性挑战的作用；以“让这些人自己说”表达带强调的第三人称命令；以“当我站在议会面前时”对应时间性的στάντος μου ἐπὶ τοῦ συνεδρίου；并以“不法之处”在自然现代汉语中表达宽泛的ἀδίκημα。脚注保留并澄清“公议会”这一替代术语。
