  source_fidelity: 原译总体准确保留了“这些人自己”的强调、第三人称命令式的质询语气，以及保罗在犹太议事机构前受审时所涉的过错。可是，ἢ在此引出并列的另一项挑战，译为“或者”比带有条件后果色彩的“不然”更贴切。ἀδίκημα在司法语境中译作“不法之处”较自然，也保留其未被具体定性的宽泛性。
  naturalness: “不然，就让……”在现代汉语中略显将前文处理成条件句；“或者，让……”更顺畅。将时间状语提前并使用冒号，可使法庭辩护式的挑战更清晰自然。
  terminology: “议会”是对 συνέδριον清楚且中性的主文译法；脚注给出“公议会”这一术语性替代，并说明其所指的犹太议事和审判机构。“不法之处”避免了“不义”可能引出的主要道德或神学联想，也不将原文收窄为特定罪名。
  issues:
