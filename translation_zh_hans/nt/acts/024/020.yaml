  - severity: low
    issue: “不义的行为”在现代司法语境中不够自然。
    rationale: ἀδίκημα指不正当或违法的行为、过错；“不法之处”更符合上下文的指控与查验语境，并维持原词的语义宽度。
  - severity: low
    issue: 现有脚注虽说明“公议会”，但未明确提供其作为主文“议会”的术语性替代。
    rationale: 修订后的脚注同时给出替代译名和机构说明，能与词汇替代型脚注的功能相符。
