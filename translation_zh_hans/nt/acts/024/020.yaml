  yaml_path: translation/nt/acts/024/020.yaml
  text: Or let these men themselves say what wrongdoing they found when I stood before the council,[a]
translation:
  language: zh_hans
  text: 或者，让这些人自己说：当我站在议会面前时，他们查出我有什么不法之处。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “议会”也可译作“公议会”；这里指犹太人的议事和审判机构。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: 不然
  rationale: 承接保罗上一句的辩护，引出另一项要求；“不然”自然体现这里的选择、转折语气。
- source_word: αὐτοὶ οὗτοι
  choice: 这些人自己
  rationale: “这些人”保留指示对象，“自己”体现原文代词的强调意味。
- source_word: εἰπάτωσαν
  choice: 就让……说
  rationale: 保留第三人称命令式在法庭辩论中的直接挑战语气。
- source_word: τί εὗρον
  choice: 查出……有什么
  rationale: εὗρον 表示发现；结合司法语境译作“查出”自然，同时不把原文过度具体化为正式定罪。
- source_word: ἀδίκημα
  choice: 不义的行为
  rationale: 兼顾该词“错误、违法或不正当行为”的宽泛含义，避免使用“罪行”而把法律严重程度说得过强。
- source_word: στάντος μου
  choice: 我……时
  rationale: 以时间从句表达属格分词结构，简洁呈现保罗当时受审陈述的情境。
- source_word: ἐπὶ τοῦ συνεδρίου
  choice: 站在公议会面前
  rationale: 这里指犹太人的最高议事和审判机构；“在……面前”准确体现出庭受审的关系。
