  text: And the Jews also joined in the charge[a], asserting that these things were so.
translation:
  language: zh_hans
  text: 犹太人也随声附和，声称这些事确是如此。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνεπέθεντο
  choice: 加入控告
  rationale: 该动词可指与人一同攻击或发难；在审讯的语境中，这里是指犹太人加入先前对保罗提出的控告。“加入控告”既保留其对抗意味，也符合司法场景，同时不把动作误解为肢体攻击。
- source_word: δὲ καὶ
  choice: 也
  rationale: δὲ在此轻微推进叙事，καὶ表示犹太人也参与其中；现代汉语用一个“也”即可自然表达两者在本句中的衔接作用。
- source_word: οἱ Ἰουδαῖοι
  choice: 犹太人
  rationale: 直译该群体称谓；上下文已明确是到场控告保罗的犹太人，无须在正文中额外限定为“犹太控告者”。
- source_word: φάσκοντες
  choice: 断言
  rationale: 该分词引出他们支持控告时所说的内容。“断言”能表达其肯定陈述的语气，也适合司法语境。
- source_word: ταῦτα οὕτως ἔχειν
  choice: 这些事确实如此
  rationale: 这是表示“事情正是这样／确为事实”的习惯表达。“这些事”保留ταῦτα较宽泛的指代，不将其收窄为“这些罪状”；“确实如此”自然传达οὕτως ἔχειν。
