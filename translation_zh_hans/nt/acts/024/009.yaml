  naturalness: 原句整体可理解，但“加入控告”不如“随声附和”合乎现代标准汉语的常用表达。修订句简洁、庄重，并保持叙事和司法场景的语体。
  terminology: “犹太人”保留原文οἱ Ἰουδαῖοι在本段对到场群体的称呼；不额外添加“控告者”等原文未明说的限定。“声称”准确传达φάσκοντες的陈述／主张语气，避免“断言”可能带来的过强正式色彩。
  issues:
