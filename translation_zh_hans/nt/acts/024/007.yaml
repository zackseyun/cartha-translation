lexical_decisions:
- source_word: παρελθών (παρέρχομαι)
  choice: 赶来
  rationale: 此处不定过去时分词表示吕西亚来到现场并随即采取行动；译作“赶来”符合叙事情境，也使汉语表达自然紧凑。
- source_word: χιλίαρχος
  choice: 千夫长
  rationale: 这是罗马军队的高级军官职称，字面意为统领约一千人的长官；“千夫长”是中文圣经传统中明确而熟悉的对应词。
- source_word: μετὰ πολλῆς βίας
  choice: 用强力
  rationale: βία在这里指强制性的力量；“用强力”保留原文对武力介入的强调，同时不额外断定其行为带有恶意暴力。
- source_word: ἐκ τῶν χειρῶν ἡμῶν ἀπήγαγεν
  choice: 把他从我们手中带走了
  rationale: ἀπάγω表示带走或押走；结合“从我们手中”，此译既保留原文意象，也自然传达吕西亚将保罗强行带离控告者掌控的意思。
- source_word: δέ
  choice: 可是
  rationale: δέ在此承接并转折前文所述行动；“可是”自然呈现吕西亚介入所造成的转折。
