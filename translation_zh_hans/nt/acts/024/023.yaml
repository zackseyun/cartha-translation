  text: ⸀διαταξάμενος τῷ ἑκατοντάρχῃ τηρεῖσθαι ⸀αὐτὸν ἔχειν τε ἄνεσιν καὶ μηδένα κωλύειν τῶν ἰδίων αὐτοῦ ⸀ὑπηρετεῖν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/023.yaml
  text: And he ordered the centurion to keep him in custody[a], yet to let him have some freedom[b], and to prevent none of his own people from attending to his needs.
translation:
  language: zh_hans
  text: 他吩咐百夫长看守保罗，并准他有一些自由[a]，又不得拦阻他的人中任何一人来服侍他[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“让他得到舒缓”或“给予他宽待”。希腊语ἄνεσις可指舒缓、安适，或从严格拘禁中获得一定程度的自由。
    reason: lexical_alternative
  - marker: b
    text: 直译“属于他自己的人”。这很可能指保罗的同伴或支持者；他们获准为他提供服务或实际帮助。
    reason: lexical_alternative
lexical_decisions:
- source_word: διαταξάμενος
  choice: 他吩咐
  rationale: 该词是过去时中间语态分词，在叙事中自然译为主要动作“吩咐”，既传达命令的权威性，也避免生硬保留希腊语分词结构。
- source_word: τῷ ἑκατοντάρχῃ
  choice: 百夫长
  rationale: 这是罗马军队中该级军官的通行、准确译名。
- source_word: τηρεῖσθαι αὐτόν
  choice: 看守保罗
  rationale: τηρέω在此指拘押状态下加以看守；“看守”简洁表达监管之意。根据上下文以“保罗”明确代词所指，避免连续多个“他”造成歧义。
- source_word: ἔχειν τε ἄνεσιν
  choice: 同时给他一些宽松
  rationale: ἄνεσις可指舒缓、宽松或一定程度的自由；在拘押语境中，“一些宽松”既表明待遇从宽，又不暗示完全获释。
- source_word: τε ... καὶ
  choice: 同时……也
  rationale: 该关联结构并列两项安排：给保罗宽松待遇，以及不阻止他自己的人照料他。中文以“同时……也”自然连接，不额外强化原文未明确标出的转折。
- source_word: μηδένα κωλύειν
  choice: 也不可拦阻……任何一个
  rationale: 保留了μηδένα的全称否定和κωλύειν“阻拦、妨碍”的含义。
- source_word: τῶν ἰδίων αὐτοῦ
  choice: 他自己人中的任何一个
  rationale: 原文只说“属于他自己的人”，没有明确限定为亲属、朋友或同工；“自己人”在现代中文中可宽泛指与保罗关系密切、支持他的人。
- source_word: ὑπηρετεῖν αὐτῷ
  choice: 来照料他
  rationale: ὑπηρετέω在这里指提供服务或实际帮助；“照料”符合被拘押者接受生活协助的语境，又避免“服侍”可能带来的宗教职分联想。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“一些宽松”保留ἄνεσις在舒缓待遇与有限自由之间的语义幅度；“自己人”则避免把关系过度限定为亲属、朋友或教会同工。
