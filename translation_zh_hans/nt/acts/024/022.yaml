  text: ⸂Ἀνεβάλετο δὲ αὐτοὺς ὁ Φῆλιξ⸃, ἀκριβέστερον εἰδὼς τὰ περὶ τῆς ὁδοῦ, ⸀εἴπας· Ὅταν Λυσίας ὁ χιλίαρχος καταβῇ διαγνώσομαι τὰ καθ’ ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/022.yaml
  text: But Felix, having a more accurate knowledge about the Way, put them off, saying, “When Lysias the commander comes down, I will decide your case.”
translation:
  language: zh_hans
  text: 腓力斯对这道路的事有较准确的了解，就暂缓审理他们的案件[a]，说：“等千夫长吕西亚下来，我再裁决你们的事。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“就把审理延期了”。原文动词在这里可指推迟或暂缓司法程序。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνεβάλετο … αὐτούς
  choice: 暂缓审理他们的案件
  rationale: ἀναβάλλομαι在此为司法语境中的延期、暂缓；αὐτούς直接指当事人。中文若直译“拖延他们”不自然，因此以“审理他们的案件”明确语境，同时保留对象所指。
- source_word: ἀκριβέστερον εἰδὼς
  choice: 了解得更确切
  rationale: 保留ἀκριβέστερον的比较意味，表达腓力斯对相关情况已有较准确、较深入的了解，而不额外说明比较对象。
- source_word: τὰ περὶ τῆς ὁδοῦ
  choice: 对这道路的事
  rationale: “道路”保留使徒行传中对基督信仰群体及其生活道路的早期称呼；加“这”使现代汉语自然，但不把它直接释为后来的特定名称。
- source_word: Ὅταν … καταβῇ
  choice: 等……下来
  rationale: 表达ὅταν加虚拟式所指的未来情形；“下来”保留古代叙事中从耶路撒冷前往凯撒利亚的地理表达。
- source_word: χιλίαρχος
  choice: 千夫长
  rationale: 这是罗马军官称号的传统且易懂的汉语译法，比泛称“指挥官”更能保留历史职衔。
- source_word: διαγνώσομαι
  choice: 我再裁决
  rationale: 该词在司法语境中指经过查明后作出判定；“裁决”准确传达法律含义，“再”自然承接延期审理。
- source_word: τὰ καθ’ ὑμᾶς
  choice: 你们的事
  rationale: 较贴近原文“关于你们的事项”，并保留其可指案件整体或相关争议事项的宽度；上下文已清楚表明是司法案件。
theological_decisions:
- issue: “道路”是否直接释为“基督教”
  choice: 正文保留“这道路”，以脚注说明其历史用法
  alternative: 译作“基督教”或“基督信仰”
  rationale: 原文使用ἡ ὁδός这一早期称谓；保留其措辞可避免用较晚形成的名称替换原文，并保存使徒行传自身的表达特色。
translation_notes:
  register: 采用现代、庄重而清楚的司法叙事语体。“千夫长”为兼顾历史准确性与中文圣经传统的职衔译法；“裁决”明确法律场景。正文只设置一处确有帮助的词义脚注，且标记已在正文出现。
