base_translation:
  language: en
  yaml_path: translation/nt/acts/024/013.yaml
  text: Nor can they prove to you the things of which they are now accusing me[a].
translation:
  language: zh_hans
  text: 他们也无法向你证实他们现在控告我的事[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“向你提出”或“向你证明”。希腊语动词可指把某事呈上、提出或确立；这里是在法律语境中，表示为控告提供依据，使其成立。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ
  choice: 也……无法
  rationale: 承接上一节保罗的申辩，以递进否定表达“也不能”，符合现代汉语语序。
- source_word: παραστῆσαι
  choice: 证实
  rationale: 该词本可指“呈上、提出、表明或确立”；在审讯语境中，指为控告提供依据、使之成立，因此译作“证实”既自然又保留法律语境。
- source_word: δύνανταί
  choice: 无法
  rationale: 表达能力上的不能；与否定词合译为“无法”，简洁自然。
- source_word: σοι
  choice: 向你
  rationale: 保留与格所指的陈述对象，即总督腓力斯；“向你”比“在你面前”更直接，且不过度解释。
- source_word: περὶ ὧν
  choice: ……的事
  rationale: 指他们控告保罗所涉及的事项；汉语用“控告我的事”自然地表达关系结构，同时不把原文进一步限定为具体罪名。
- source_word: νυνὶ
  choice: 现在
  rationale: 准确保留当前正在进行的司法控告这一时间含义。
- source_word: κατηγοροῦσίν μου
  choice: 控告我的
  rationale: κατηγορέω在此具有法律上的控告含义；以“控告我”准确、清楚地表达，定语化后与“事”衔接。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的法庭陈述语体。将希腊语句首的连续否定按汉语习惯处理为“也无法”，并保留“现在”和“向你”等信息；不补入原文未明说的罪名或证据。
