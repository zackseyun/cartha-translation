base_translation:
  language: en
  yaml_path: translation/nt/acts/024/004.yaml
  text: But[a], so that I may not delay you any further[b], I beg you to hear us briefly, in your graciousness.
translation:
  language: zh_hans
  text: 不过，为免不再耽搁您太久，我恳请您本着您的宽容，听我们作简短陈述。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα δὲ μὴ
  choice: 不过，为免
  rationale: “不过”表达 δέ 的轻微转折；“为免”自然保留 ἵνα μή 所表达的目的。
- source_word: ἐπὶ πλεῖόν σε ἐγκόπτω
  choice: 再耽搁你
  rationale: ἐπὶ πλεῖόν 表示“更久、进一步”，ἐγκόπτω 在这里指占用总督更多时间；“再耽搁你”简洁而符合正式听审语境。
- source_word: παρακαλῶ
  choice: 我恳请你
  rationale: 体现说话人在法庭陈词中的郑重、谦恭请求，比普通的“请”更能传达恳求语气。
- source_word: ἀκοῦσαί σε ἡμῶν
  choice: 听我们……陈述
  rationale: 直译核心意义“听我们”，并以“陈述”明确此处是司法听审中的发言，不增加实质内容。
- source_word: συντόμως
  choice: 简短
  rationale: 表示言语或所用时间的简短；与“陈述”搭配自然。
- source_word: τῇ σῇ ἐπιεικείᾳ
  choice: 以宽厚之心
  rationale: ἐπιείκεια 可涵盖宽厚、公允、温和及审判时的从宽；此译保留对官长宽厚态度的礼貌诉求，又避免把意义限定为单纯的社交礼貌。
theological_decisions: []
