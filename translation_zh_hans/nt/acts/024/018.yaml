  text: ἐν ⸀αἷς εὗρόν με ἡγνισμένον ἐν τῷ ἱερῷ, οὐ μετὰ ὄχλου οὐδὲ μετὰ θορύβου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/018.yaml
  text: In these things they found me purified in the temple[a], not with a crowd nor with an uproar[b],
translation:
  language: zh_hans
  text: 就在这期间[a]，他们在圣殿里发现我已经洁净了[b]，既没有人群，也没有骚乱。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在这些事中”。希腊文关系短语可较直译为“在其中”。
    reason: lexical_alternative
  - marker: b
    text: 这里的“洁净”指按礼仪规条所作的洁净。
    reason: cultural_note
lexical_decisions:
- source_word: ἐν αἷς
  choice: 在这些事期间
  rationale: 保留关系短语对上文诸事的回指，也用“期间”自然表达其可能具有的时间含义；希腊文也可较形式化地译作“在这些事上”。
- source_word: εὗρόν με
  choice: 他们发现我
  rationale: 按 εὑρίσκω 在叙事语境中的通常意义翻译，表示那些人遇见保罗时所见的情形。
- source_word: ἡγνισμένον
  choice: 已经洁净了
  rationale: 体现完成时被动分词所表示的既成状态；仪式性的含义由脚注说明，以免正文过度扩充。
- source_word: ἐν τῷ ἱερῷ
  choice: 在圣殿里
  rationale: ἱερόν 指圣殿建筑群或院区，并非专指内殿；“圣殿里”是自然且不过度具体的译法。
- source_word: οὐ μετὰ ὄχλου
  choice: 既没有带着人群
  rationale: 保留 μετά 的伴随含义和 ὄχλος 的中性意义，不将其强化为“暴民”。
- source_word: οὐδὲ μετὰ θορύβου
  choice: 也没有引起骚乱
  rationale: θόρυβος 在此法律申辩语境中指喧闹、扰乱秩序的骚动；汉语用“引起骚乱”能自然表达保罗否认制造公共混乱的意思。
theological_decisions:
- issue: ἡγνισμένον 所指的洁净性质
  choice: 正文译作“已经洁净了”，脚注说明为礼仪上的洁净
  alternative: 已经行过洁净礼
  rationale: 希腊词在本段圣殿语境中具有礼仪含义，但正文保留原文简洁表达，避免把解释直接并入经文。
translation_notes:
  register: 采用现代、庄重而易懂的法律申辩语气。“在这些事期间”保留原文回指略显含混的特点；“已经洁净了”保持简洁，并以脚注交代礼仪背景。
