  yaml_path: translation/nt/acts/024/010.yaml
  text: 'Then Paul answered[a], after the governor had nodded to him to speak: “Knowing that for many years you have been a judge over this nation, I gladly make my defense concerning myself.'
translation:
  language: zh_hans
  text: 总督向保罗点头，示意他说话，保罗便回答说：“我知道你担任这个民族的审判官已有多年，所以我欣然[a]为自己的事申辩。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“坦然”或“满有信心地”。这个副词可以表示乐意、振作、勇敢或有把握，并不只指心里高兴。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπεκρίθη τε ὁ Παῦλος
  choice: 保罗便回答说
  rationale: ἀποκρίνομαι表示回答、回应；τε轻微承接叙事，用“便”自然推进情节，不过分强化连接。
- source_word: νεύσαντος αὐτῷ τοῦ ἡγεμόνος λέγειν
  choice: 总督示意保罗说话
  rationale: 属格独立结构表达时间背景；νεύω可指点头或示意。“示意”保留动作的功能，又不武断限定为点头。
- source_word: ἡγεμόνος
  choice: 总督
  rationale: 此处指罗马行省统治当局；“总督”符合《使徒行传》的历史政治语境，也是现代中文清楚自然的称谓。
- source_word: Ἐκ πολλῶν ἐτῶν
  choice: 多年来
  rationale: 该时间表达指从过去延续至今的一段较长时期；“多年来”简洁而自然。
- source_word: ὄντα σε κριτὴν τῷ ἔθνει τούτῳ
  choice: 你多年来一直审理本民族的案件
  rationale: κριτής本义为审判者，但此处与ἔθνος构成治理和司法语境。中文若直译为“作本民族的审判官”略显生硬；以“一直审理……的案件”表达其长期司法职能，并避免“统治”所带来的语义扩大。
- source_word: τῷ ἔθνει τούτῳ
  choice: 本民族
  rationale: ἔθνος在此指犹太民族。保罗作为犹太人发言，用“本民族”自然体现“这个民族”与说话者的关系，同时不额外加入解释。
- source_word: ἐπιστάμενος
  choice: 我知道
  rationale: 该分词说明保罗申辩时欣然或有把握的依据；中文用独立谓语更自然。
- source_word: εὐθύμως
  choice: 欣然
  rationale: 该副词可表达乐意、振作、有勇气或有信心。“欣然”保留积极、甘愿申辩的语气；其他可能含义以脚注说明。
- source_word: τὰ περὶ ἐμαυτοῦ ἀπολογοῦμαι
  choice: 为自己的事申辩
  rationale: ἀπολογέομαι是司法语境中的申辩、答辩；“申辩”保持法庭语域，τὰ περὶ ἐμαυτοῦ则自然译作“自己的事”。
