  rationale: 将“常常”改为“始终”，以准确反映 διὰ παντός 所表达的不断持续；将“众人”调整为“人”，使“在上帝和人面前”的关系性对举更符合现代汉语，同时保留原文泛指全体人类／他人的范围。其余措辞忠实、自然，无须改动。
