source:
  edition: SBLGNT
  text: ἐν τούτῳ ⸀καὶ αὐτὸς ἀσκῶ ἀπρόσκοπον συνείδησιν ⸀ἔχειν πρὸς τὸν θεὸν καὶ τοὺς ἀνθρώπους διὰ παντός.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/016.yaml
  text: In view of this[a], I myself also strive always to have a blameless conscience before God and men.
translation:
  language: zh_hans
  text: 因此[a]，我自己也始终竭力，在上帝和人面前保持良心无愧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在这方面”。
    reason: ἐν τούτῳ 既可理解为承接上文的推论“因此”，也可较直接地表示“在这方面”。
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: 因此
  rationale: 该短语承接上文所说对义人和不义之人都将复活的盼望，并引出保罗相应的实践；“因此”自然表达这种承接和推论关系，同时以脚注保留较直译的可能。
- source_word: καὶ αὐτὸς
  choice: 我自己也
  rationale: “也”保留 καί 的附加意味，“我自己”体现 αὐτός 对主语的强调。
- source_word: ἀσκῶ
  choice: 竭力
  rationale: 该词表示操练、勤勉实践或努力达到目标；“竭力”在此自然传达持续而认真的道德努力。
- source_word: ἀπρόσκοπον συνείδησιν
  choice: 良心无愧
  rationale: ἀπρόσκοπον 在这里描述良心不致绊跌、无可指责；汉语“良心无愧”简洁自然，并能表达在上帝和人面前不受良心谴责的意思。
- source_word: ἔχειν
  choice: 保持
  rationale: 直义是“有”，但与持续努力及“常常”结合时，“保持”更符合现代汉语，也表达不断持有这种良心状态。
- source_word: πρὸς τὸν θεὸν καὶ τοὺς ἀνθρώπους
  choice: 在上帝和众人面前
  rationale: πρός 在此表示所面对的关系和责任范围；“在……面前”是自然且庄重的汉语表达。“众人”准确体现 ἀνθρώπους 泛指人类或他人。
- source_word: διὰ παντός
  choice: 常常
  rationale: 该短语表示持续不断或在一切时候；“常常”以自然汉语传达持续性，避免把句子写得过于绝对化或生硬。
theological_decisions:
- issue: ἀνθρώπους 的泛指范围
  choice: 众人
  alternative: 人们；世人
  rationale: 该阳性复数名词在此泛指一般的人，并非仅指男性。“众人”既保留群体性的表达，也自然涵盖所有人，不引入性别限制。
- issue: 无愧良心与行为完全无罪之间的关系
  choice: 良心无愧
  alternative: 无可指责的良心
  rationale: 译文忠实表达保罗努力在上帝和人面前持守不受良心控告的状态，但不把本句扩展解释为自称绝对无罪。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“竭力”“良心无愧”“在……面前”适合公开诵读；语序把“常常”置于努力行为之前，使持续性自然覆盖整项实践。
