  naturalness: 原句总体自然庄重；改为“始终竭力”可使持续范围清楚覆盖保罗的努力，也比“常常竭力”更符合现代汉语语义。
  terminology: “上帝”“良心”“竭力”均恰当。“众人”可以泛指人，但本句“在上帝和人面前”的对举在汉语中更凝练自然，且不改变 ἀνθρώπους 的泛指含义。“良心无愧”适合表达 ἀπρόσκοπον συνείδησιν。
  issues:
