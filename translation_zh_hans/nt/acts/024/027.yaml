  text: Διετίας δὲ πληρωθείσης ἔλαβεν διάδοχον ὁ Φῆλιξ Πόρκιον Φῆστον· θέλων τε ⸀χάριτα καταθέσθαι τοῖς Ἰουδαίοις ὁ Φῆλιξ κατέλιπε τὸν Παῦλον δεδεμένον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/027.yaml
  text: But when two years had been completed[a], Felix was succeeded by Porcius Festus; and because Felix wanted to lay up favor with the Jews, he left Paul bound.
translation:
  language: zh_hans
  text: 两年期满后，波求·非斯都接替了腓力斯的职位。腓力斯想赢得犹太人的好感[a]，便把仍受捆绑的保罗留下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“向犹太人施惠”。这个希腊语表达既可指赢得他们的好感，也可指向他们施惠。
    reason: lexical_alternative
lexical_decisions:
- source_word: Διετίας δὲ πληρωθείσης
  choice: 两年期满后
  rationale: 以自然简洁的汉语表达属格独立结构所表示的时间背景，同时保留“满、完成”的含义。
- source_word: ἔλαβεν διάδοχον ὁ Φῆλιξ
  choice: 波求·非斯都接替了腓力斯的职位
  rationale: 原文直译为“腓力斯得了一个继任者”；汉语用“接替……的职位”更自然，也清楚表达官职交接。
- source_word: Πόρκιον Φῆστον
  choice: 波求·非斯都
  rationale: 按现代汉语圣经人名的通行音译处理，并以间隔号区分双名。
- source_word: θέλων
  choice: 想
  rationale: 该分词说明腓力斯留下保罗的动机；汉语用“想”自然地呈现这一目的关系。
- source_word: χάριτα καταθέσθαι τοῖς Ἰουδαίοις
  choice: 赢得犹太人的好感
  rationale: 这一习语可指取得对方的善意，也可理解为施惠于对方；正文采用符合此处政治语境的“赢得……好感”，并以脚注保留另一解释。
- source_word: κατέλιπε
  choice: 留在
  rationale: 表示腓力斯离任时使保罗继续处于原有状态，不加入“遗弃”等更强含义。
- source_word: δεδεμένον
  choice: 捆锁之中
  rationale: 保留完成时被动分词所强调的持续受捆绑状态，同时避免把具体刑具限定为“锁链”。
theological_decisions:
- issue: χάριτα καταθέσθαι 的关系指向
  choice: 赢得犹太人的好感
  alternative: 给犹太人一个人情／向犹太人施惠
  rationale: 原文习语容许“获取善意”和“施予恩惠”两种相近理解；正文不把腓力斯的动机神学化，脚注保留真实的词义张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“两年期满后”简明交代时间；“接替了……的职位”符合现代叙事习惯；“留在捆锁之中”保留原文对保罗持续受束缚状态的强调。脚注标记紧接其所解释的争议短语，避免英文资料中标记位置与注释内容不相符的问题。
