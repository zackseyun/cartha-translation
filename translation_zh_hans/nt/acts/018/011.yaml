base_translation:
  language: en
  yaml_path: translation/nt/acts/018/011.yaml
  text: So he stayed there a year and six months, teaching the word of God among them.
translation:
  language: zh_hans
  text: 于是，保罗在那里住了一年零六个月，在他们中间教导上帝的话。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκάθισεν
  choice: 住了
  rationale: 该动词字面可指“坐下”，但在这里与一段持续时间连用，按叙事语境表示停留、居住；“住了”符合现代汉语，也自然承接地点“在那里”。
- source_word: δὲ
  choice: 于是
  rationale: δέ是较弱的连接词；结合上文主的鼓励和保罗随后的行动，“于是”自然表达叙事推进及轻微的结果关系，而不过度强化转折。
- source_word: ἐνιαυτὸν καὶ μῆνας ἓξ
  choice: 一年零六个月
  rationale: 这是表示持续时间的宾格结构；“一年零六个月”准确、自然地表达整段时长。
- source_word: διδάσκων
  choice: 教导
  rationale: 现在分词表示保罗居住期间持续进行的伴随行动；汉语用“在……教导”可简洁保留其延续性。
- source_word: ἐν αὐτοῖς
  choice: 在他们中间
  rationale: ἐν加与格在此表示社会群体中的位置；“在他们中间”比字面的“在他们里面”更符合汉语，并保留保罗置身该群体开展教导的含义。
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: 上帝的话
  rationale: λόγος在《使徒行传》中常指从上帝而来的宣讲信息；“上帝的话”既保留圣经传统用语及神学内涵，也为现代读者所熟悉。
