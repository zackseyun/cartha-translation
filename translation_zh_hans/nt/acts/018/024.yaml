  text: Ἰουδαῖος δέ τις Ἀπολλῶς ὀνόματι, Ἀλεξανδρεὺς τῷ γένει, ἀνὴρ λόγιος, κατήντησεν εἰς Ἔφεσον, δυνατὸς ὢν ἐν ταῖς γραφαῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/024.yaml
  text: A certain Jew named Apollos[a], an Alexandrian by birth, an eloquent man, arrived in Ephesus, being mighty in the Scriptures.
translation:
  language: zh_hans
  text: 有一个犹太人来到以弗所，名叫亚波罗，是亚历山大人。他能言善辩[a]，精通圣经。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“很有学问”。希腊词λόγιος既可形容人善于言辞，也可形容人有学问。
    reason: 保留λόγιος在“能言善辩”和“有学问”之间真实存在的词义歧义。
lexical_decisions:
- source_word: Ἰουδαῖος
  choice: 犹太人
  rationale: 这里指亚波罗的族群和宗教身份，不是单指来自犹太地区的人。
- source_word: δέ
  choice: 不单独译出
  rationale: δέ在此主要承接叙事、引入新人物；现代汉语另起叙述即可自然体现这一功能，不必加上可能带有时间或转折意味的连接词。
- source_word: τις
  choice: 有一个
  rationale: 既自然地引入新人物，也保留不定代词的轻微不特指意味。
- source_word: Ἀπολλῶς ὀνόματι
  choice: 名叫亚波罗
  rationale: 符合现代汉语介绍人物姓名的惯常表达。
- source_word: Ἀλεξανδρεὺς τῷ γένει
  choice: 是亚历山大人
  rationale: 表达其出生地或籍贯；避免把γένος机械译成现代语境中容易误解的“种族”。
- source_word: ἀνὴρ λόγιος
  choice: 他能言善辩
  rationale: λόγιος可指善于言辞，也可指有学问；正文采用前一义，并用脚注保留后一义。汉语无需重复用“男人”指称已经明确为男性的亚波罗。
- source_word: κατήντησεν εἰς Ἔφεσον
  choice: 来到以弗所
  rationale: καταντάω在这里表示抵达目的地；“来到”简洁自然。
- source_word: δυνατὸς ὢν ἐν ταῖς γραφαῖς
  choice: 精通圣经
  rationale: 该短语说明亚波罗在圣经方面能力很强；“精通”自然传达δυνατός的强度，而γραφαί在此指犹太人的神圣经典。
theological_decisions:
- issue: ταῖς γραφαῖς所指的经典范围
  choice: 圣经
  alternative: 经书／诸书卷
  rationale: 在此犹太背景中，该复数名词惯指神圣经典，即当时已有的圣经书卷；译作“圣经”不把后来的具体正典范围强加于经文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。为使句子自然，将主要动作“来到以弗所”提前，并另起一句交代亚波罗的才干；未增加原文没有的时间副词或强转折词。
