  text: εἰ δὲ ⸀ζητήματά ἐστιν περὶ λόγου καὶ ὀνομάτων καὶ νόμου τοῦ καθ’ ὑμᾶς, ὄψεσθε αὐτοί· ⸀κριτὴς ἐγὼ τούτων οὐ βούλομαι εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/015.yaml
  text: But if these are questions about a word and names and your own law[a], you yourselves will see to it; I do not want to be a judge of these things.
translation:
  language: zh_hans
  text: 但如果是关于某个说法[a]、名称和你们自己的律法的争议问题，你们自己去处理吧；我不愿作这些事的审判者。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “某个说法”也可译作“某个信息”或“教导”。希腊语λόγος含义宽泛，在这里可能指有争议的说法、教导或所用的词语。
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητήματά
  choice: 所争论的
  rationale: ζήτημα指有待查问或裁断的争议事项。结合司法语境译为“所争论的”，既体现争议性，也不把语气强化为敌对冲突。
- source_word: περὶ λόγου
  choice: 字句
  rationale: λόγος语义宽泛，在此可能指言辞、说法、教义或信息。“字句”与后面的“名称”自然并列，并尽量保留迦流把此事视为用语或教导之争的含混性；脚注列出其他可能。
- source_word: ὀνομάτων
  choice: 名称
  rationale: ὀνόματα是复数，可指名字、称号或称谓。“名称”较自然，并保留具体所指未明的特点。
- source_word: νόμου τοῦ καθ’ ὑμᾶς
  choice: 你们自己的律法
  rationale: καθ’ ὑμᾶς表明这是属于或适用于控告者群体的律法，并体现迦流将其与罗马司法管辖区分开的态度。
- source_word: ὄψεσθε αὐτοί
  choice: 你们就自己处理吧
  rationale: 未来中间态在此为惯用表达，意为自行照管或处理；αὐτοί带强调。“就自己处理吧”符合现代汉语，也传达命令式语用效果。
- source_word: κριτὴς
  choice: 审断
  rationale: κριτής本义为“审判者”。汉语若直译“作这些事的审判者”较生硬，改以动词“审断”自然表达迦流拒绝担任裁决者的意思。
- source_word: οὐ βούλομαι εἶναι
  choice: 我不愿意
  rationale: βούλομαι表达意愿；“不愿意”准确保留其个人不肯承担该角色的语气，且不过度强化为正式拒绝。
- source_word: τούτων
  choice: 这些事
  rationale: 指回前述关于字句、名称和律法的争议事项；“这些事”宽泛而清楚。
theological_decisions:
- issue: 迦流所说λόγος的范围
  choice: 正文译作“字句”，脚注说明也可指“言论、教导或信息”
  alternative: 直接译为“道理”“教义”或“信息”
  rationale: 上下文表明这是迦流眼中的犹太人内部争议，但λόγος本身没有明确限定为某一教义或福音信息。正文保留其与术语争议相关的可能，脚注呈现更广语义，避免替原文消除含混。
translation_notes:
  register: 采用现代、庄重而易懂的司法语体。“所争论的是……”使复数ζητήματα在汉语中表达自然；“你们就自己处理吧”体现αὐτοί的强调和迦流的拒绝态度。脚注标记[a]已置于与λόγος相关的译文之后。
