  text: ⸂ἀλλὰ ἀποταξάμενος καὶ⸃ ⸀εἰπών· ⸀Πάλιν ἀνακάμψω πρὸς ὑμᾶς τοῦ θεοῦ θέλοντος ἀνήχθη ἀπὸ τῆς Ἐφέσου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/021.yaml
  text: but after taking leave and saying[a], “I will return to you again[b], if God wills,” he set sail from Ephesus.
translation:
  language: zh_hans
  text: 但他辞别他们，并说[a]：“我还会回到你们这里来，若是上帝愿意[b]。”他便从以弗所启航。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本没有“并说：‘我还会回到你们这里来，若是上帝愿意。’”
    reason: textual_variant
  - marker: b
    text: “若是上帝愿意”也可译作“上帝若愿意”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: 但
  rationale: 承接上文以弗所人请他多住些日子的请求，表达转折。
- source_word: ἀποταξάμενος
  choice: 辞别他们时
  rationale: 表达不定过去时中动态分词所指的辞行，并使汉语叙述自然流畅；宾语“他们”由语境补出。
- source_word: καὶ εἰπών
  choice: 说
  rationale: 与前面的辞别动作相连，引出保罗临行所说的话；不机械重复分词结构。
- source_word: Πάλιν ἀνακάμψω πρὸς ὑμᾶς
  choice: 我还会回到你们这里来
  rationale: “还会”传达 πάλιν 的“再次”之意，“回到你们这里来”自然表达 ἀνακάμπτω 与 πρὸς ὑμᾶς 的方向。
- source_word: τοῦ θεοῦ θέλοντος
  choice: 若是上帝愿意
  rationale: 按属格独立结构表达条件或依存关系，明确保留“上帝”，不改成“主”。
- source_word: ἀνήχθη
  choice: 启航了
  rationale: 该词在旅行叙事中指船只离岸出海；“启航”准确而简洁。
- source_word: ἀπὸ τῆς Ἐφέσου
  choice: 从以弗所
  rationale: 直接表达出发地点，并采用通行中文地名。
theological_decisions:
- issue: 保罗的行程计划取决于上帝的旨意
  choice: 若是上帝愿意
  alternative: 上帝若愿意
  rationale: 保留 τοῦ θεοῦ θέλοντος 所表达的条件与依存关系，不把“上帝”替换为异文或传统表达中的“主”，也不将其解释为确定的神谕。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“辞别”“启航”保持《使徒行传》旅行叙事的文体，同时避免生硬直译希腊语分词结构。
