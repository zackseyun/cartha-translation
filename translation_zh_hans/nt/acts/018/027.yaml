  text: βουλομένου δὲ αὐτοῦ διελθεῖν εἰς τὴν Ἀχαΐαν προτρεψάμενοι οἱ ἀδελφοὶ ἔγραψαν τοῖς μαθηταῖς ἀποδέξασθαι αὐτόν· ὃς παραγενόμενος συνεβάλετο πολὺ τοῖς πεπιστευκόσιν διὰ τῆς χάριτος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/027.yaml
  text: And when he wanted to go across to Achaia[a], the brothers encouraged him and wrote to the disciples to welcome him. When he arrived[b], he greatly helped those who had believed through grace.
translation:
  language: zh_hans
  text: 他想要前往亚该亚时，弟兄们[b]便鼓励他，并写信给那里的门徒，请他们接待他。他到了以后，大大帮助了那些因着恩典信了的人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他因着恩典，大大帮助了那些信了的人。”希腊语“因着恩典”也可能修饰他的“帮助”，而不是这些人的“信”。
    reason: alternative_reading
  - marker: b
    text: “弟兄们”也可能泛指较广的信徒群体，包括女性；希腊文使用阳性复数形式。
    reason: lexical_alternative
lexical_decisions:
- source_word: βουλομένου δὲ αὐτοῦ
  choice: 他想要……时
  rationale: 以时间性从句表达属格独立结构，同时保留 βούλομαι 所含的意愿，不把它强化为已经决定或计划。
- source_word: διελθεῖν εἰς τὴν Ἀχαΐαν
  choice: 前往亚该亚
  rationale: 准确表达前往该地区的行动；中文不必硬译为“经过”或明确添加原文未说出的“渡海”。
- source_word: προτρεψάμενοι
  choice: 鼓励他
  rationale: 该词在此表示支持性的劝勉；“鼓励”符合上下文，语气也比“催促”温和。
- source_word: οἱ ἀδελφοὶ
  choice: 弟兄们
  rationale: 保留希腊文阳性复数的表层形式，同时以脚注说明早期基督徒群体用语可能具有较广的涵盖范围。
- source_word: ἔγραψαν τοῖς μαθηταῖς
  choice: 写信给那里的门徒
  rationale: γράψαν 可自然译为“写信”，与格表明收信对象；“那里”由前述目的地自然承接，并未改变指向。
- source_word: ἀποδέξασθαι αὐτόν
  choice: 请他们接待他
  rationale: ἀποδέχομαι 在此指友善欢迎和接纳来访者；“接待”在中文教会与一般语境中都自然。
- source_word: ὃς παραγενόμενος
  choice: 他到了以后
  rationale: 以顺畅的时间结构表达关系代词加分词的衔接，并清楚延续同一人物。
- source_word: συνεβάλετο πολὺ
  choice: 大大帮助了
  rationale: 中间语态形式在本句表示给予显著帮助；该译法简明而保留程度副词 πολὺ。
- source_word: τοῖς πεπιστευκόσιν
  choice: 那些……而信的人
  rationale: 表达已经进入信仰状态的一群人；现代汉语不必生硬标出希腊文完成时态，但仍保留其信仰身份。
- source_word: διὰ τῆς χάριτος
  choice: 因着恩典
  rationale: 保留 διά 加属格所表达的媒介或凭借关系，也不擅自补入原文没有明说的“上帝的”。
theological_decisions:
- issue: διὰ τῆς χάριτος 的修饰对象
  choice: 主文将其连接于“而信的人”，即“那些因着恩典而信的人”
  alternative: 连接于亚波罗的帮助，即“他因着恩典，大大帮助了那些信的人”
  rationale: 就词序和语境而言，修饰“信的人”较为自然，但希腊文在句法上容许另一种连接方式，因此不在正文中消除其真实歧义，而将另一读法保留在脚注。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“前往”“接待”“因着恩典”等措辞兼顾自然度与经文语体；正文中的[a]、[b]均与相应脚注准确对应。
