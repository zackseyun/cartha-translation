base_translation:
  language: en
  yaml_path: translation/nt/acts/018/007.yaml
  text: And after leaving there[a], he entered the house of a man named Titius Justus, who worshiped God[b], whose house was next to the synagogue.
translation:
  language: zh_hans
  text: 他离开那里，进了一个名叫提提·犹士都的人家里。这人敬拜上帝[a]，他的家与会堂相邻[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“敬畏上帝”或“敬奉上帝”。希腊语描述此人敬奉以色列的上帝。
    reason: lexical_alternative
  - marker: b
    text: 或译：“紧挨着会堂”或“与会堂接界”。
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταβὰς ἐκεῖθεν
  choice: 离开那里
  rationale: 不定过去时分词与地点副词合起来表示从先前所在之处转移；“离开那里”自然地保留了主动作之前的行动次序。
- source_word: εἰσῆλθεν εἰς οἰκίαν τινὸς
  choice: 进了一个……的人的家
  rationale: 准确表达进入某人住所；“家”在现代汉语中比“房屋”更自然，下文仍可清楚说明其与会堂的空间关系。
- source_word: ὀνόματι Τιτίου Ἰούστου
  choice: 名叫提提·犹士都
  rationale: 按希腊语音译专名，并用现代汉语常用的“名叫”引出姓名。
- source_word: σεβομένου τὸν θεόν
  choice: 这人敬拜上帝
  rationale: σέβομαι在此描述此人敬奉以色列的上帝；采用描述性表达，不把可能的社会宗教身份标签直接写入正文。
- source_word: συνομοροῦσα τῇ συναγωγῇ
  choice: 与会堂相邻
  rationale: συνομορέω表示毗连、接界；“相邻”庄重自然，并保留究竟只是紧邻还是共界的细微开放性。
theological_decisions:
- issue: σεβόμενος τὸν θεόν是否应译为一个准术语身份
  choice: 译作“敬拜上帝”
  alternative: “敬畏上帝”或“敬奉上帝的人”
  rationale: 原文明确表达他对上帝的敬奉，却未必要求将其定性为特定群体的正式成员；描述性译法避免过度界定。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。把较长的希腊语关系从句拆成两句，以免现代汉语中连续使用“其人……其家……”显得生硬；不增添原文未明说的宗派或身份判断。
