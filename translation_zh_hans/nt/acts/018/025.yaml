id: ACT.18.25
reference: Acts 18:25
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οὗτος ἦν κατηχημένος τὴν ὁδὸν τοῦ κυρίου, καὶ ζέων τῷ πνεύματι ἐλάλει καὶ ἐδίδασκεν ἀκριβῶς τὰ περὶ τοῦ ⸀Ἰησοῦ, ἐπιστάμενος μόνον τὸ βάπτισμα Ἰωάννου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/025.yaml
  text: This man had been instructed in the way of the Lord[a], and being fervent in spirit, he was speaking and teaching accurately the things concerning Jesus, knowing only the baptism of John.
translation:
  language: zh_hans
  text: 这人已经受过主之道的教导，心灵火热[a]，准确地讲论和教导有关耶稣的事，只知道约翰的洗礼。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在圣灵里火热。”这里也可能是指圣灵，而不是他自己的心灵。
    reason: 保留τῷ πνεύματι可指人的心灵或圣灵的歧义。
lexical_decisions:
- source_word: κατηχημένος
  choice: 已经受过……教导
  rationale: 完成时被动分词表示他先前领受了教导，其结果持续至当时；此译法自然，也不引入后世“教理讲授”的技术含义。
- source_word: τὴν ὁδὸν τοῦ κυρίου
  choice: 主之道
  rationale: 保留“道路/道”这一早期基督徒用语及属格关系；“主之道”在现代中文中庄重而简明。
- source_word: ζέων τῷ πνεύματι
  choice: 心灵火热
  rationale: ζέων本指沸腾，转指热切；此处与πνεῦμα连用，可指人的内在心灵，也可能指圣灵。正文采用自然的“心灵火热”，另以脚注保留圣灵之解。
- source_word: ἐλάλει καὶ ἐδίδασκεν
  choice: 讲论并……教导
  rationale: 两个未完成时描写持续或惯常的活动；“讲论”对应λαλέω，“教导”对应διδάσκω，并避免把前者强化为“宣讲”。
- source_word: ἀκριβῶς
  choice: 准确地
  rationale: 在本段叙事中主要表示所教内容正确、精确，并与他知识范围仍有限形成张力。
- source_word: τὰ περὶ τοῦ Ἰησοῦ
  choice: 有关耶稣的事
  rationale: 贴近原文的宽泛表达，不擅自限定为耶稣生平、福音或某套特定教义。
- source_word: ἐπιστάμενος μόνον τὸ βάπτισμα Ἰωάννου
  choice: 只知道约翰的洗礼
  rationale: 按分词结构直译其知识范围的限制，不强行加入原文未明确标出的让步连词“虽然”。
theological_decisions:
- issue: ζέων τῷ πνεύματι中的τῷ πνεύματι指人的心灵还是圣灵
  choice: 正文译作“心灵火热”，理解为内在热忱
  alternative: “在圣灵里火热”，理解为圣灵的工作
  rationale: 希腊文自身未以大小写区别二者，语法上两解皆有可能。正文采用较自然的惯用理解，同时用脚注明示圣灵之解，以保留神学张力。
- issue: 亚波罗教导准确，却只知道约翰的洗礼
  choice: 并列保留“准确”与“只知道”的张力
  alternative: 把“准确”弱化为“认真”，或补入“虽然”明确让步关系
  rationale: 原文既肯定其教导的准确性，又指出其知识范围有限；译文不应替作者消解这一叙事张力，也不必把分词关系限定为让步。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“主之道”保留原文“道路”的早期基督徒用语；句法尽量紧凑，并让“准确教导”与“只知道约翰的洗礼”自然并存。
