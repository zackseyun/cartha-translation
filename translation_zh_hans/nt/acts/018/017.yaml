  text: ἐπιλαβόμενοι δὲ ⸀πάντες Σωσθένην τὸν ἀρχισυνάγωγον ἔτυπτον ἔμπροσθεν τοῦ βήματος· καὶ οὐδὲν τούτων τῷ Γαλλίωνι ⸀ἔμελεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/017.yaml
  text: Then they all seized Sosthenes[a], the synagogue ruler, and beat him in front of the tribunal. But Gallio paid no attention to these things.
translation:
  language: zh_hans
  text: 于是，众人抓住了会堂主管所提尼[a]，在审判台前不断殴打他；迦流却对这些事毫不在意。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“所有希腊人”，而不是仅作“众人”。较早的抄本所支持的读法较短，没有说明这群人的身份。
    reason: textual_variant
lexical_decisions:
- source_word: ἐπιλαβόμενοι
  choice: 抓住
  rationale: 该词表示抓住、拿住；这里紧接着发生殴打，因此“抓住”自然传达敌意行动。
- source_word: πάντες
  choice: 众人
  rationale: 原文仅用复数实体化形容词“所有人”，没有明说是哪一群人；“众人”保留其总体性和指称上的未确定性。
- source_word: Σωσθένην
  choice: 所提尼
  rationale: 采用现代中文圣经语境中通行、易辨认的人名音译。
- source_word: τὸν ἀρχισυνάγωγον
  choice: 会堂主管
  rationale: 指负责管理犹太会堂的主要官员；“会堂主管”比“管会堂的”更简洁，也比“会堂统治者”更符合现代汉语。
- source_word: ἔτυπτον
  choice: 不断殴打
  rationale: 未完成时描写持续或反复的击打；“不断殴打”明确呈现其过程性。
- source_word: ἔμπροσθεν τοῦ βήματος
  choice: 在审判台前
  rationale: βῆμα在此指罗马官员处理案件时所在的司法台座；“审判台”既保留具体空间意象，也交代司法场景。
- source_word: οὐδὲν τούτων τῷ Γαλλίωνι ἔμελεν
  choice: 迦流却对这些事毫不在意
  rationale: μέλει与间接受格构成“某事为某人所关切”的表达；否定形式自然译为“毫不在意”。
- source_word: καί
  choice: 却
  rationale: 这里连接群众的暴力与迦流的漠不关心，语义上带明显反差；“却”在中文中自然体现这一转折。
theological_decisions:
- issue: πάντες（“所有人”）所指群体的身份
  choice: 正文译作“众人”，不说明他们是希腊人还是犹太人。
  alternative: 译作“所有希腊人”或按上下文明确为其他群体。
  rationale: SBLGNT正文只有πάντες，没有明确名词；不能把抄本变体或解释传统中的群体身份写入正文。脚注说明异文，同时保留最早可重建文本的含混性。
- issue: 迦流的反应强度
  choice: 译作“毫不在意”。
  alternative: “没有理会”或“并不关心”。
  rationale: 原文表达这些事对迦流全然不是关切事项；“毫不在意”准确表达强否定，但不进一步断定他的动机或道德评价。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“会堂主管”和“审判台”清楚呈现历史制度背景；以“不断殴打”表达未完成时的持续或反复动作。正文中的[a]与脚注对应。
