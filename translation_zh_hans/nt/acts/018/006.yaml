  text: ἀντιτασσομένων δὲ αὐτῶν καὶ βλασφημούντων ἐκτιναξάμενος τὰ ἱμάτια εἶπεν πρὸς αὐτούς· Τὸ αἷμα ὑμῶν ἐπὶ τὴν κεφαλὴν ὑμῶν· καθαρὸς ἐγώ· ἀπὸ τοῦ νῦν εἰς τὰ ἔθνη πορεύσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/006.yaml
  text: But when they opposed and reviled him, he shook out his garments and said to them, “Your blood be on your own heads. I am innocent. From now on I will go to the Gentiles.”
translation:
  language: zh_hans
  text: 可是，他们反对并辱骂时，保罗就抖了抖自己的衣服，对他们说：“你们的血归在你们自己头上[b]！我没有责任。从今以后，我要到外邦人那里去[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “你们的血归在你们自己头上”是责任用语，意思是后果由他们自己承担。
    reason: cultural_note
  - marker: c
    text: “外邦人”原文也可直译为“列国”；这里指犹太人以外的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντιτασσομένων
  choice: 反对
  rationale: 该分词表示他们主动抵制保罗所传的信息；“反对”简洁自然，并保留敌对意味。
- source_word: βλασφημούντων
  choice: 辱骂
  rationale: 该词可指亵渎，也可指恶意毁谤或辱骂。原文没有明说受词，因此正文不补出“保罗”或“神”，以保留语义上的开放性。
- source_word: ἐκτιναξάμενος τὰ ἱμάτια
  choice: 抖了抖衣服
  rationale: 贴近原文所描写的象征性动作，同时符合现代汉语表达；此举表示与对方划清责任。
- source_word: Τὸ αἷμα ὑμῶν ἐπὶ τὴν κεφαλὴν ὑμῶν
  choice: 你们的血归到你们自己头上
  rationale: 保留原文庄严的责任宣告和身体意象，不将其完全意译；“自己”传达责任由他们承担。
- source_word: καθαρὸς ἐγώ
  choice: 我没有责任
  rationale: καθαρός在这里是比喻用法，表示保罗不再为其后果负责；这样译比字面的“我是洁净的”更清楚，也比“我是无辜的”更准确地衔接前一句的责任惯用语。
- source_word: ἀπὸ τοῦ νῦν
  choice: 从今以后
  rationale: 自然表达一个明确的事工转折点。
- source_word: εἰς τὰ ἔθνη
  choice: 到外族人那里去
  rationale: 在会堂听众的语境中，τὰ ἔθνη指犹太人以外的各族人；“外族人”比“列国”更清楚，同时避免较生硬的宗教术语。
- source_word: πορεύσομαι
  choice: 我要……去
  rationale: 表达将来的行动意向，符合现代汉语习惯。
theological_decisions:
- issue: “你们的血归到你们自己头上”的责任公式
  choice: 保留血归到头上的惯用意象，并以脚注说明其责任含义
  alternative: 直接意译为“后果由你们自己负责”，或理解为更强烈的咒诅
  rationale: 该话语是庄严的责任声明，表明保罗已尽见证之责；保留原有意象可避免将它过度弱化为普通口语，也不把它强化成原文未必要求的咒诅。
- issue: βλασφημούντων的对象和性质
  choice: 正文译为不带明示受词的“辱骂”
  alternative: “亵渎”或“辱骂保罗”
  rationale: 原文未明说受词，该词既可能涉及亵渎性言语，也可能指敌意辱骂。正文不补定对象，脚注保留“亵渎”的可能，以维护原文的歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“可是”承接上文并表现转折；“我没有责任”清楚传达καθαρὸς的比喻意义。保留“血归到头上”的圣经式庄严意象，并用脚注帮助普通读者理解。
