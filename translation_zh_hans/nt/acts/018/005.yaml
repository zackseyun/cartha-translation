  text: Ὡς δὲ κατῆλθον ἀπὸ τῆς Μακεδονίας ὅ τε Σιλᾶς καὶ ὁ Τιμόθεος, συνείχετο τῷ ⸀λόγῳ ὁ Παῦλος, διαμαρτυρόμενος τοῖς Ἰουδαίοις ⸀εἶναι τὸν χριστὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/005.yaml
  text: But when Silas and Timothy came down from Macedonia[a], Paul was occupied with the word[b], solemnly testifying to the Jews that Jesus is the Messiah.
translation:
  language: zh_hans
  text: 西拉和提摩太从马其顿下来时，保罗正专注于这道[a]，郑重向犹太人作证，证明耶稣就是弥赛亚[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“被这道催迫”，或“全心投入传道”。希腊语动词可表示被某事占据、催迫，或全神贯注于某事。
    reason: lexical_alternative
  - marker: b
    text: 希腊语作“基督”。这里该词用作称号，因此译为“弥赛亚”，以保留其“受膏者”的含义。
    reason: alternative_reading
lexical_decisions:
- source_word: Ὡς δὲ
  choice: ……时
  rationale: ὡς在这里引出时间从句，δέ承担叙事衔接作用；现代汉语用“……时”自然表达时间推进，无须生硬译出转折词。
- source_word: κατῆλθον ἀπὸ τῆς Μακεδονίας
  choice: 从马其顿下来
  rationale: 保留κατέρχομαι的“下来”这一行程表达，也符合《使徒行传》的旅行叙事风格。
- source_word: ὅ τε Σιλᾶς καὶ ὁ Τιμόθεος
  choice: 西拉和提摩太
  rationale: τε…καί把二人并列为共同主语；汉语用“和”即可清楚、自然地表达。
- source_word: συνείχετο
  choice: 正专注于
  rationale: 该未完成时形式表示保罗当时持续被某事占据、全神投入；“正专注于”自然表达持续状态，同时避免将其过度解释为外在强迫。
- source_word: τῷ λόγῳ
  choice: 这道
  rationale: λόγος在路加著作中常指所宣讲的福音信息；“道”保留其经文用语和神学含义，“这”使汉语表达自然。
- source_word: διαμαρτυρόμενος
  choice: 郑重作证
  rationale: διαμαρτύρομαι带有强调、严肃见证的语气；“郑重作证”兼顾其见证含义和加强语气。
- source_word: τοῖς Ἰουδαίοις
  choice: 向犹太人
  rationale: 此处指作为族群和宗教群体的犹太人，并非专指犹太地区居民。
- source_word: εἶναι τὸν χριστὸν Ἰησοῦν
  choice: 耶稣就是弥赛亚
  rationale: χριστός在这里带冠词并作表语，明确是称号；“就是”自然表达认定关系并体现论证重点。
theological_decisions:
- issue: Χριστός应译为称号还是近似专名
  choice: 弥赛亚
  alternative: 基督
  rationale: 本句向犹太人宣告耶稣的身份，带冠词的χριστός作表语，称号意义突出；译作“弥赛亚”可清楚保留“受膏者”和所应许之君的语境。
- issue: συνείχετο τῷ λόγῳ所表达的投入是否带有强制意味
  choice: 正专注于这道
  alternative: 被这道催迫／全心投入传道
  rationale: 希腊语可表达被占据、受催迫或全神贯注；正文采用不预断动力来源的表达，并用脚注保留其他可能。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“这道”延续《使徒行传》中λόγος指福音信息的常见表达；脚注分别保留συνείχετο的词义幅度和χριστός的直译形式。
