source:
  edition: SBLGNT
  text: ⸀κατήντησαν δὲ εἰς Ἔφεσον, κἀκείνους κατέλιπεν αὐτοῦ, αὐτὸς δὲ εἰσελθὼν εἰς τὴν συναγωγὴν ⸀διελέξατο τοῖς Ἰουδαίοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/019.yaml
  text: They came to Ephesus[a], and he left them there[c][b]; but he himself entered into the synagogue and reasoned with the Jews.
translation:
  language: zh_hans
  text: 他们到了以弗所[a]。他把他们留在那里[b]，自己却进了会堂，跟犹太人讲论[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“抵达以弗所。”有些抄本作“他到了以弗所”。
    reason: 兼顾κατήντησαν的词义表达，以及此处复数“他们”与单数“他”的抄本异文。
  - marker: b
    text: “他们”指上一节提到的同行者百基拉和亚居拉。
    reason: 说明代词所承接的上文对象，而不把名字增补进正文。
  - marker: c
    text: 或译：“跟犹太人讨论”或“同犹太人对话”。希腊文所表达的是带有推理和交流意味的谈论。
    reason: 呈现διαλέγομαι的语义范围，并避免把它仅仅理解为敌对争辩。
lexical_decisions:
- source_word: κατήντησαν
  choice: 到了
  rationale: 该动词表示抵达或到达目的地；“到了以弗所”自然简洁，并保留复数主语“他们”所承接的叙事线索。
- source_word: δὲ
  choice: （首处不单独译出）／却
  rationale: 首处δὲ主要承接叙事，汉语用句序即可自然表达；第二处带有轻微对比，以“却”表现他本人采取的行动与同行者被留下之间的对照。
- source_word: κἀκείνους
  choice: 他们
  rationale: κἀκείνους是καὶ ἐκείνους的缩合，回指上一节提到的同行者。正文保留代词，不把百基拉和亚居拉的名字直接增补进本节。
- source_word: κατέλιπεν
  choice: 留
  rationale: 该词在这里指把人留在某地；与“在那里”合用，准确而自然。
- source_word: αὐτοῦ
  choice: 在那里
  rationale: 这里是表示地点的副词性用法，指以弗所。
- source_word: αὐτὸς
  choice: 自己
  rationale: 该强调代词突出他本人，与被留在当地的同行者形成对比。
- source_word: εἰσελθὼν
  choice: 进了
  rationale: 分词表示先行或背景动作；现代汉语以连续谓语“进了……讲论”自然呈现，无须机械译成分词结构。
- source_word: συναγωγήν
  choice: 会堂
  rationale: 在本段犹太背景中指犹太会堂；“会堂”是现代中文圣经语境中清楚、通行的称呼。
- source_word: διελέξατο
  choice: 讲论
  rationale: 该中间语态动词在《使徒行传》中常指通过交谈、论述来沟通或推理。“讲论”既保留理性交流的意味，也避免“争辩”所带来的过强敌对色彩。
- source_word: τοῖς Ἰουδαίοις
  choice: 跟犹太人
  rationale: 按其一般族群兼宗教身份称谓直接翻译；原文没有把范围限定为领袖。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“到了”“留在那里”“进了会堂”符合普通现代汉语；“讲论”略带正式色彩，适合公开宗教谈话的场景。正文保留原文的代词和强调关系，不把上下文中的姓名直接代入。
