source:
  edition: SBLGNT
  text: οὗτός τε ἤρξατο παρρησιάζεσθαι ἐν τῇ συναγωγῇ· ἀκούσαντες δὲ αὐτοῦ ⸂Πρίσκιλλα καὶ Ἀκύλας⸃ προσελάβοντο αὐτὸν καὶ ἀκριβέστερον αὐτῷ ἐξέθεντο τὴν ⸂ὁδὸν τοῦ θεοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/026.yaml
  text: And he began to speak boldly in the synagogue. But when Priscilla and Aquila heard him[a], they took him aside and explained the way of God to him more accurately.
translation:
  language: zh_hans
  text: 他开始在会堂里放胆讲道。百基拉和亚居拉听见他讲道后，就把他接到身边[a]，更准确地向他讲解上帝的道路。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “把他接到身边”也可译作“把他带到一旁”“带同他”或“接待他”。希腊文动词既可表示接纳某人，也可表示把某人带到自己身边。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός τε ἤρξατο
  choice: 他开始
  rationale: οὗτος承接上文的亚波罗，现代汉语用“他”自然；τέ的轻微连接作用不必机械译出。ἤρξατο明确表示“开始”。
- source_word: παρρησιάζεσθαι
  choice: 放胆讲道
  rationale: 该动词表示公开、坦然且勇敢地发言；结合会堂语境，“放胆讲道”既自然，也保留其公开宣讲的意味。
- source_word: ἐν τῇ συναγωγῇ
  choice: 在会堂里
  rationale: 准确表达地点；“会堂”是现代中文圣经语境中对犹太会堂的通行称呼。
- source_word: ἀκούσαντες δὲ αὐτοῦ
  choice: 百基拉和亚居拉听见后
  rationale: 分词在此具有时间意义。δέ表示叙事推进，在中文中由语序和“后”自然体现，无须硬译为“但是”。
- source_word: Πρίσκιλλα καὶ Ἀκύλας
  choice: 百基拉和亚居拉
  rationale: 采用现代中文圣经读者熟悉的人名译法，并保留原文先列百基拉、后列亚居拉的次序。
- source_word: προσελάβοντο αὐτὸν
  choice: 就把他接到身边
  rationale: προσλαμβάνομαι可指接纳、带在身边或带到一旁。“接到身边”保留接纳与私下带开两方面的可能，不把原文含义过度限定为“拉到一旁”。
- source_word: ἀκριβέστερον
  choice: 更准确地
  rationale: 保留比较级，表明所作讲解比亚波罗先前掌握的内容更加精确；不额外暗示其原有认识完全错误。
- source_word: ἐξέθεντο
  choice: 讲解
  rationale: ἐκτίθημι中动语态在此意为阐明、解释；“讲解”清楚、自然且庄重。
- source_word: τὴν ὁδὸν τοῦ θεοῦ
  choice: 上帝的道
  rationale: ὁδός本义为“道路”，在使徒行传语境中也可指信仰之道或上帝所指示的道路。“上帝的道”在中文中自然，并保留该表达作为信仰道路与教导的复合意味。
- source_word: αὐτῷ
  choice: 向他
  rationale: 作为ἐξέθεντο的间接受词，现代汉语自然表达为“向他讲解”。
theological_decisions:
- issue: 百基拉和亚居拉如何对待亚波罗
  choice: 译为“把他接到身边”，正文不限定为公开纠正或单纯款待
  alternative: 把他带到一旁；接待他；把他带回去
  rationale: προσελάβοντο语义可涵盖接纳、带同或带到身边；随后是进一步讲解，因此很可能涉及较私下的教导，但正文不应加入原文未明说的地点、家宅或权柄结构。脚注交代主要可能。
- issue: “上帝的道”的范围
  choice: 保留为概括性的信仰道路/教导表达
  alternative: 明确解释为完整的基督教福音；仅理解为一般道德生活方式
  rationale: 上下文表明它与亚波罗所传讲的信仰信息有关，但本节没有逐项界定其内容；译文不将其窄化为某一教义公式。
- issue: “更准确”对亚波罗原有教导的评价
  choice: 保留比较级，不说明他此前完全错误
  alternative: 译成“纠正他的错误”或“把正确的道告诉他”
  rationale: ἀκριβέστερον强调精确程度有所提高，未必表示先前所知全然虚假；译文保留这种张力。
translation_notes:
  register: 采用自然、庄重的现代标准普通话。“放胆讲道”保留公开勇敢发言的力度；“接到身边”避免把有歧义的动作过早限定为私下拉开或在家接待。正文中的脚注标记[a]与脚注对应。
