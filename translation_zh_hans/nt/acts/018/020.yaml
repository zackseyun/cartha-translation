  yaml_path: translation/nt/acts/018/020.yaml
  text: But when they asked him to stay for a longer time[a], he did not consent,
translation:
  language: zh_hans
  text: 他们请他多留一段时间，他却没有答应[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“没有同意”或“没有应允”。希腊语动词指对请求表示同意或首肯。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρωτώντων δὲ αὐτῶν
  choice: 他们请他……，他却
  rationale: 以时间背景中的请求和主句之间的轻微转折来表达属格独立结构及 δὲ；中文不必机械译出“当……时”，并按上下文补明请求对象为保罗。
- source_word: ἐπὶ πλείονα χρόνον
  choice: 多住些日子
  rationale: 保留 πλείονα 的比较、延长意味，同时采用现代汉语旅行叙事中自然的说法；“日子”在此泛指一段时间，并非限定具体天数。
- source_word: μεῖναι
  choice: 住
  rationale: 在请旅人延长停留的语境中，“住”比“留下”或“停留”更口语自然，又不失庄重。
- source_word: οὐκ ἐπένευσεν
  choice: 没有答应
  rationale: ἐπινεύω 表示对请求表示同意；“没有答应”准确表达未予首肯，避免“拒绝”可能带出的较强硬语气。
