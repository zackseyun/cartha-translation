base_translation:
  language: en
  yaml_path: translation/nt/acts/018/004.yaml
  text: And he was reasoning in the synagogue every Sabbath and persuading Jews and Greeks[a][b][c].
translation:
  language: zh_hans
  text: 他每逢安息日都在会堂里讲论[a]，劝说犹太人和希腊人[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“与人讨论”或“辩论”。这个希腊语动词可指以推理为基础的对话、讨论或辩论。
    reason: lexical_alternative
  - marker: b
    text: 或译“试图说服”。这里的未完成时可侧重持续进行的劝说，并不明确说明结果。
    reason: lexical_alternative
  - marker: c
    text: 这里的“希腊人”可能指与会堂有联系的人；也有人较宽泛地理解为“外邦人”。
    reason: alternative_reading
lexical_decisions:
- source_word: διελέγετο
  choice: 与人辩论
  rationale: 该未完成时动词描写反复、持续的活动，可指通过对话、推理或辩论来阐明观点。“与人辩论”在现代汉语中自然，也保留了论证和互动的意味；其他可能译法见脚注。
- source_word: δὲ
  choice: 不单独译出
  rationale: 这里的δέ只是轻微承接上文，并不表示强烈转折。汉语叙事无需用连接词也能自然推进。
- source_word: ἐν τῇ συναγωγῇ
  choice: 在会堂里
  rationale: 直接表达ἐν加与格的地点意义；按上下文，“会堂”指犹太会堂。
- source_word: κατὰ πᾶν σάββατον
  choice: 每逢安息日
  rationale: κατά与πᾶν在此具有逐次、分配意义；“每逢”自然地表达每一个安息日反复发生的行动。
- source_word: ἔπειθέν
  choice: 劝说
  rationale: 未完成时描写持续或反复进行的劝服行动。“劝说”着重过程，不必断定每次都成功，同时不像“试图说服”那样把未明说的未成功意味写入正文。
- source_word: τε
  choice: 以逗号连接，不单独译出
  rationale: τε平顺地连接“辩论”和“劝说”两个动作；汉语用逗号即可自然体现这种衔接。
- source_word: Ἰουδαίους
  choice: 犹太人
  rationale: 这里指犹太民族及宗教群体，“犹太人”是现代汉语中准确、通行的表达。
- source_word: Ἕλληνας
  choice: 希腊人
  rationale: 忠实保留Ἕλληνες的直接词义，不在正文中将其泛化为“外族人”，也不擅自具体化为“敬畏上帝的人”。
theological_decisions:
- issue: 会堂语境中Ἕλληνας所指的群体
  choice: 译作“希腊人”，不进一步限定
  alternative: 外族人；敬畏上帝的希腊人
  rationale: 经文本身只称他们为Ἕλληνες。会堂语境暗示他们可能是与会堂有联系的非犹太人，但没有明确称他们为“敬畏上帝的人”；正文因此保留原文的概括性，脚注说明可能范围。
- issue: ἔπειθέν是否表示劝服已经成功
  choice: 用过程性的“劝说”保留开放性
  alternative: 试图说服；说服了
  rationale: 未完成时突出持续或反复的行动，本节没有明确交代结果。“试图说服”可能过度强调未成功，“说服了”则可能过度强调成功。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“每逢……都……”体现反复发生的行动；“与人辩论”保留论证与互动色彩；“劝说”避免预先判定成功或失败。所有脚注标记均置于正文相应词语之后。
