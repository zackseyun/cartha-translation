  text: λέγοντες ὅτι Παρὰ τὸν νόμον ⸂ἀναπείθει οὗτος⸃ τοὺς ἀνθρώπους σέβεσθαι τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/013.yaml
  text: saying[b][a], “This man is persuading people to worship God contrary to the law.”
translation:
  language: zh_hans
  text: 说：“这个人劝人敬拜上帝，违背律法。[a][b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“违反律法”或“与律法相违”。
    reason: lexical_alternative
  - marker: b
    text: 控告者很可能是指犹太人的律法，不过希腊原文只说“律法”。
    reason: cultural_note
lexical_decisions:
- source_word: λέγοντες ὅτι
  choice: 说：“……”
  rationale: 分词引出控告的内容；汉语用“说”配直接引语，自然地表达原文结构。
- source_word: Παρὰ τὸν νόμον
  choice: 违背了律法
  rationale: παρά加宾格在此表示与律法相悖或违反律法；这一译法保留控告中的法律意味，同时脚注列出可行替代译法。
- source_word: ἀναπείθει
  choice: 劝
  rationale: 表达说服、劝服之意，不加入原文未必包含的“迷惑”这一负面判断；汉语在此无需把希腊语现在时机械译成进行体。
- source_word: οὗτος
  choice: 这个人
  rationale: 保留指示词在当面控告中的指向性，又避免“这家伙”等过度贬义表达。
- source_word: τοὺς ἀνθρώπους
  choice: 人
  rationale: 此处为泛指人群，并非专指男性；简洁的“人”符合现代汉语表达。
- source_word: σέβεσθαι τὸν θεόν
  choice: 敬拜上帝
  rationale: σέβομαι在这一宗教语境中指向对上帝的敬奉或崇拜；“敬拜”清楚且庄重。
- source_word: τὸν νόμον
  choice: 律法
  rationale: 原文仅作“律法”，没有明说“犹太人的”或“我们的”；正文不补足语境所暗示但未明言的限定。
theological_decisions:
- issue: 控告中“律法”的所指
  choice: 正文保留“律法”，不明确添加“犹太人的”
  alternative: 犹太人的律法；我们的律法
  rationale: 从上下文看，控告者很可能是指犹太律法，但希腊文本只说τὸν νόμον。译文保留这一表述，具体所指以脚注说明，避免把解释写入正文。
- issue: 泛指的ἀνθρώπους
  choice: 人
  alternative: 男人；众人
  rationale: 阳性复数在此泛指人，并不限定男性；译作“人”准确而自然。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“劝人敬拜上帝”避免把控告者可能暗含的负面态度扩写成“迷惑人”。脚注标记依中文阅读习惯置于相关句末。
