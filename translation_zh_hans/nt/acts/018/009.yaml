  text: εἶπεν δὲ ὁ κύριος ⸂ἐν νυκτὶ δι’ ὁράματος⸃ τῷ Παύλῳ· Μὴ φοβοῦ, ἀλλὰ λάλει καὶ μὴ σιωπήσῃς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/009.yaml
  text: And the Lord said to Paul in the night through a vision[a], “Do not be afraid, but keep speaking and do not be silent,”
translation:
  language: zh_hans
  text: 夜里，主借着异象[a]对保罗说：“不要怕，只管继续讲，不要沉默，”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在异象中”。希腊文直译为“借着异象”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ κύριος
  choice: 主
  rationale: 保留 κύριος 的称号形式；在《使徒行传》的语境中很自然地指复活的耶稣，但正文不增译“耶稣”。
- source_word: ἐν νυκτὶ
  choice: 夜里
  rationale: 表达时间意义，符合现代汉语习惯，也忠实对应希腊文的时间短语。
- source_word: δι’ ὁράματος
  choice: 借着异象
  rationale: διά 加属格在此表示媒介或方式；“借着异象”既保留这一结构，也自然清楚。
- source_word: Μὴ φοβοῦ
  choice: 不要怕
  rationale: 以现代汉语常用的禁止表达传达原文命令语气，简洁有力。
- source_word: ἀλλὰ λάλει
  choice: 只管继续讲
  rationale: “继续讲”体现现在命令式所含的持续行动；“只管”自然承接 ἀλλά 所表达的转折和鼓励。
- source_word: καὶ μὴ σιωπήσῃς
  choice: 不要沉默
  rationale: 保留与“继续讲”相并列的禁止命令，不额外强化体貌含义。
theological_decisions:
- issue: “主”的所指
  choice: 正文译作“主”，不增补“耶稣”
  alternative: 主耶稣
  rationale: 希腊文仅作 ὁ κύριος。上下文很可能指复活的耶稣，但译文保留原文称号及其基督论分量，不把解释直接写入正文。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“只管继续讲”传达持续说话的命令，并与“不要怕”“不要沉默”形成清晰有力的并列。句末逗号按所给经节片段保留其未完的引语衔接。
