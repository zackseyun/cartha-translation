id: ACT.18.12
reference: Acts 18:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Γαλλίωνος δὲ ⸂ἀνθυπάτου ὄντος⸃ τῆς Ἀχαΐας κατεπέστησαν ⸂ὁμοθυμαδὸν οἱ Ἰουδαῖοι⸃ τῷ Παύλῳ καὶ ἤγαγον αὐτὸν ἐπὶ τὸ βῆμα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/012.yaml
  text: But while Gallio was proconsul of Achaia[a], the Jews rose up together against Paul and brought him before the tribunal[b],
translation:
  language: zh_hans
  text: 迦流做亚该亚总督的时候，犹太人[a]同心起来攻击保罗，把他带到审判台前[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“犹太人”；这里指当地起来攻击保罗的犹太群体，并非泛指所有犹太人。
    reason: cultural_note
  - marker: b
    text: “审判台”指官员审理案件时所用的司法台座，也可译作“法庭”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Γαλλίωνος
  choice: 迦流
  rationale: 采用现代中文圣经中较为通行的专名音译，指罗马官员 Gallio。
- source_word: δὲ
  choice: （不单独译出）
  rationale: 此处主要承接并推进叙事；现代汉语以句式自然转换即可表达，不必机械译作“但是”。
- source_word: ἀνθυπάτου ὄντος
  choice: 做……总督的时候
  rationale: 将属格独立结构自然译为时间背景，同时保留其任职期间之意。
- source_word: ἀνθύπατος
  choice: 总督
  rationale: 指元老院行省的罗马执政官级长官；“总督”比音译或生硬的官衔更易懂，且与亚该亚的行政语境相符。
- source_word: Ἀχαΐας
  choice: 亚该亚
  rationale: 采用该罗马行省名称的通行中文音译。
- source_word: κατεπέστησαν
  choice: 起来攻击
  rationale: 表达针对保罗采取敌对行动的意味，但不额外断定已经发生身体暴力。
- source_word: ὁμοθυμαδὸν
  choice: 同心
  rationale: 保留众人一致、共同行动的含义；在此敌对语境中，“同心”自然且简洁。
- source_word: οἱ Ἰουδαῖοι
  choice: 犹太人
  rationale: 忠实保留原文宽泛表述，不擅自缩窄为“犹太领袖”；脚注说明此处语境中的实际所指。
- source_word: τῷ Παύλῳ
  choice: 攻击保罗
  rationale: 与 κατεπέστησαν 连用时，间接受格标明敌对行动所针对的对象。
- source_word: ἤγαγον αὐτὸν
  choice: 把他带到
  rationale: ἄγω 表示带领或带去；不采用“拖去”，以免加入原文没有明确表达的强暴色彩。
- source_word: ἐπὶ τὸ βῆμα
  choice: 带到审判台前
  rationale: βῆμα 在此指官员审理案件的司法台座；“审判台前”既保留具体形象，也清楚传达法律场景。
theological_decisions:
- issue: 冲突叙事中 οἱ Ἰουδαῖοι 的所指
  choice: 犹太人
  alternative: 犹太领袖／当地一些犹太人
  rationale: 原文没有明说领袖，也没有“一些”这一限定，因此正文保留其字面宽度；脚注则防止读者把当地参与此次行动的群体泛化为所有犹太人。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。以“做……总督的时候”自然呈现时间背景；“审判台前”兼顾罗马司法场景的具体性与普通读者的可理解性。
