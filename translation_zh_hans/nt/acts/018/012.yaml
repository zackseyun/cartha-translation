  source_fidelity: 正文准确表达了属格独立结构所提供的时间背景（“……的时候”）、迦流在亚该亚的总督职分、犹太群体一致针对保罗的敌对行动，以及将保罗带至βῆμα前的司法场景。“总督”虽较“方伯”或“代总督”宽泛，但作为现代汉语中对ἀνθύπατος的自然历史性表达，在本节语境下可接受；“审判台前”也恰当保留了βῆμα的司法审理含义。
