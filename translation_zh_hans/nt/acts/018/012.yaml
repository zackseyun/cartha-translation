  terminology: 专名“迦流”“亚该亚”采用通行译名。“犹太人”忠实对应οἱ Ἰουδαῖοι，且脚注避免将此处当地参与行动者误读为对所有犹太人的泛称。“审判台”准确传达βῆμα在此处的官方司法台座／审理席位。
