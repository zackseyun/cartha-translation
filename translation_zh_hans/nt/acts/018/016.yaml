  text: καὶ ἀπήλασεν αὐτοὺς ἀπὸ τοῦ βήματος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/016.yaml
  text: And he drove them away from the judgment seat[a].
translation:
  language: zh_hans
  text: 于是，他把他们从审判台前赶了出去。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “审判台”也可译作“法庭”或“审判席”；希腊文βῆμα指官员审案时所坐的正式席位或所在的高台。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: 于是
  rationale: 此处承接迦流拒绝审理的前文，并引出随后的行动；“于是”以自然汉语表达叙事上的顺承，不额外加入因果判断。
- source_word: ἀπήλασεν
  choice: 赶了出去
  rationale: 该动词表示以权威驱离；“赶了出去”保留动作的强制意味，比“打发走”或“遣散”更有力度，同时符合现代汉语表达。
- source_word: αὐτοὺς
  choice: 他们
  rationale: 代词沿用上下文所指的人，不在本节中擅自明确为某一群体。
- source_word: ἀπὸ τοῦ βήματος
  choice: 从审判台前
  rationale: βῆμα在此指官员审理案件所用的正式座位或高台，也可转指法庭；“从审判台前”既保留具体空间意象，也表明他们被逐出审理案件的区域。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“赶了出去”体现原文动作的强制性；“审判台前”保留一世纪司法场景的具体意象，并用脚注说明其转喻范围。
