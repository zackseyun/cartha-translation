  text: καὶ ποιήσας χρόνον τινὰ ἐξῆλθεν, διερχόμενος καθεξῆς τὴν Γαλατικὴν χώραν καὶ Φρυγίαν, ⸀στηρίζων πάντας τοὺς μαθητάς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/023.yaml
  text: And after spending some time there[a], he departed and traveled from place to place through the Galatian region and Phrygia, strengthening all the disciples.
translation:
  language: zh_hans
  text: 他停留了一段时间后，便离开了，依次经过[a]加拉太地区和弗吕家，坚固所有的门徒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“逐处经过”，也可译“按次序经过”。原文没有交代具体的次序或路线。
    reason: καθεξῆς可指接连逐处前行，也可强调按次序行进。
lexical_decisions:
- source_word: ποιήσας χρόνον τινά
  choice: 停留了一段时间后
  rationale: ποιέω与χρόνος构成惯用表达，意为度过或停留一段时间。译文不补出原文未明说的地点，同时以自然汉语表达先后关系。
- source_word: ἐξῆλθεν
  choice: 就离开了
  rationale: 在旅行叙事中，ἐξέρχομαι在此表示离开原先所在之处、启程上路；“离开了”比直译“出去了”更符合现代汉语。
- source_word: διερχόμενος καθεξῆς
  choice: 依次走过[a]
  rationale: διέρχομαι表示经过、走遍某地，καθεξῆς强调连续或按次序前行。“依次走过”保留行程的连续性，又不强行断定具体路线。
- source_word: τὴν Γαλατικὴν χώραν
  choice: 加拉太地区
  rationale: χώρα指地区、地域；此译法避免把“加拉太”过度限定为某一精确的行政建制。
- source_word: καὶ Φρυγίαν
  choice: 和弗吕家
  rationale: 采用通行地名音译；语义上与前面的“地区”并列，汉语无需机械重复量词。
- source_word: στηρίζων
  choice: 使……坚固起来
  rationale: στηρίζω意为使坚定、稳固或加强；此处指门徒在信仰与门徒身份上得到巩固，但译文不额外限定具体方式。
- source_word: πάντας τοὺς μαθητάς
  choice: 所有的门徒
  rationale: “门徒”是《使徒行传》中μαθητής的通行对应词，“所有的”明确保留πάντας的整体范围。
theological_decisions: []
translation_notes:
