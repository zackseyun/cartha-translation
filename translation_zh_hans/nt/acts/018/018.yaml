  text: Ὁ δὲ Παῦλος ἔτι προσμείνας ἡμέρας ἱκανὰς τοῖς ἀδελφοῖς ἀποταξάμενος ἐξέπλει εἰς τὴν Συρίαν, καὶ σὺν αὐτῷ Πρίσκιλλα καὶ Ἀκύλας, κειράμενος ⸂ἐν Κεγχρεαῖς τὴν κεφαλήν⸃, εἶχεν γὰρ εὐχήν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/018.yaml
  text: After Paul had remained many more days[a], he said farewell to the brothers and sailed away for Syria, and with him were Priscilla and Aquila. In Cenchreae he had his head shaved[e][d][c][b], for he had a vow.
translation:
  language: zh_hans
  text: 保罗又住了许多日子，才向弟兄姊妹告别，乘船前往叙利亚；百基拉和亚居拉与他同行。他在坚革哩剪了头发[a]，因为他有愿在身[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“剃了头”。希腊语可以泛指剪、剃或修剪头发，并不一定表示完全剃光。
    reason: lexical_alternative
  - marker: b
    text: 有些解释认为剪头发并有愿在身的是亚居拉，而不是保罗；不过按希腊语句法，这个动作最自然地指向保罗。
    reason: alternative_reading
  - marker: c
    text: 原文只说“一个愿”，没有明确说明这是拿细耳愿。
    reason: cultural_note
lexical_decisions:
- source_word: προσμείνας ἡμέρας ἱκανὰς
  choice: 又住了许多日子
  rationale: 分词表示启航前持续停留；ἔτι体现“又、还”，ἱκανὰς表示相当多的日子。中文不补原文未明说的“在那里”。
- source_word: τοῖς ἀδελφοῖς
  choice: 弟兄姊妹
  rationale: ἀδελφοί采用男性复数形式，但在这里指信徒群体；现代汉语用“弟兄姊妹”自然传达群体包含男女的语用含义。
- source_word: ἀποταξάμενος
  choice: 告别
  rationale: 该中间语态分词在此意为向人辞行；“告别”简洁而自然。
- source_word: ἐξέπλει εἰς τὴν Συρίαν
  choice: 乘船前往叙利亚
  rationale: ἐκπλέω指乘船离开、启航；译文同时表达交通方式和目的地。
- source_word: σὺν αὐτῷ Πρίσκιλλα καὶ Ἀκύλας
  choice: 百基拉和亚居拉与他同行
  rationale: 保留原文伴随关系，并用完整汉语分句清楚表达二人与保罗同行。
- source_word: κειράμενος … τὴν κεφαλήν
  choice: 剪了头发
  rationale: κείρω可指剪、剃或修剪毛发；“剪了头发”保留动作程度上的词义宽度，不强行确定为完全剃光。
- source_word: ἐν Κεγχρεαῖς
  choice: 在坚革哩
  rationale: 采用该地名在中文圣经传统中通行且可辨识的音译。
- source_word: εἶχεν γὰρ εὐχήν
  choice: 因为他许过一个愿
  rationale: 直陈其有誓愿，并以自然汉语说明该愿已经立下；不把 εὐχή 特定化为拿细耳愿。
theological_decisions:
- issue: κειράμενος所指的人
  choice: 正文理解为保罗剪了头发
  alternative: 有些解释认为剪发的是亚居拉
  rationale: 阳性单数分词最自然地承接全句主语保罗；亚居拉虽在近处也是阳性单数，却不是主要控制主语，因此把另一理解置于脚注。
- issue: εὐχή的具体性质
  choice: 只译作“一个愿”
  alternative: 拿细耳愿或类似拿细耳人的誓愿
  rationale: 原文没有说明誓愿的种类；正文不引入经文未明确给出的礼仪类别。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。将较长的希腊语句分为两句，以保持叙事清晰；保留“愿”的非特定性及剪发动作程度上的词义空间。
