  yaml_path: translation/nt/acts/018/003.yaml
  text: And because he was of the same trade[a], he stayed with them and worked, for they were tentmakers by trade.
translation:
  language: zh_hans
  text: 他因与他们同业，就住在他们那里，并和他们一起做工；原来他们是以制造帐篷[a]为业的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“从事皮革制作”；希腊语这个词也可能较宽泛地指制造帐篷或从事相关手艺。
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὸ ὁμότεχνον εἶναι
  choice: 因与他们同业
  rationale: διά加冠词化不定式表示原因；ὁμότεχνος指从事相同手艺或行业。“与他们同业”简洁自然，并保留因果关系。
- source_word: ἔμενεν παρ’ αὐτοῖς
  choice: 住在他们那里
  rationale: μένω在本叙事语境中指保罗与亚居拉、百基拉同住；“住在他们那里”比“留在他们身边”更符合现代汉语居住语境。
- source_word: ἠργάζετο
  choice: 做工
  rationale: ἐργάζομαι在此指从事手艺劳动；“做工”自然地表达以手艺谋生，也与未完成时所描写的持续活动相合。
- source_word: σκηνοποιοί
  choice: 制造帐篷
  rationale: 该词通常理解为制造帐篷的人；正文采用传统且最可能的含义，同时用脚注保留“皮革工”等较宽泛的可能性。
- source_word: τῇ τέχνῃ
  choice: 以……为业
  rationale: τέχνη指手艺或行业；“以……为业”自然表明制造帐篷是他们的职业，而非一次性的活动。
