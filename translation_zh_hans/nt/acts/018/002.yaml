  source_fidelity: 正文准确呈现了保罗找到亚居拉、其本都出身、亚居拉夫妇从意大利新近而来、克劳狄的命令，以及保罗随后前往他们那里这一叙事顺序。“离开罗马”恰当地保留了χωρίζεσθαι ἀπὸ τῆς Ῥώμης的较宽含义，未在正文中强化为“驱逐”。但末句“他就到他们那里去”缺少已然动作的表达，未能反映προσῆλθεν的过去时叙事动作。
  naturalness: 整体清楚、庄重，拆句也合乎现代汉语。将末句改为“他便到他们那里去了”可消除未完成式/将来式般的读感，并保持自然叙事语气。
  terminology: “犹太人”“亚居拉”“百基拉”“本都”“意大利”“罗马”均可接受；“原籍本都”自然地传达Ποντικὸν τῷ γένει。“克劳狄”是可用的现代译名。脚注的替代译法没有把“被逐出”误置为正文。
