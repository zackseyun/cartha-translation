  text: καὶ εὑρών τινα Ἰουδαῖον ὀνόματι Ἀκύλαν, Ποντικὸν τῷ γένει, προσφάτως ἐληλυθότα ἀπὸ τῆς Ἰταλίας καὶ Πρίσκιλλαν γυναῖκα αὐτοῦ διὰ τὸ ⸀διατεταχέναι Κλαύδιον χωρίζεσθαι πάντας τοὺς Ἰουδαίους ⸀ἀπὸ τῆς Ῥώμης, προσῆλθεν αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/002.yaml
  text: And he found a Jew named Aquila[a], a native of Pontus, who had recently come from Italy with Priscilla his wife because Claudius had ordered all the Jews to leave Rome; and he went to them.
translation:
  language: zh_hans
  text: 他找到一个犹太人，名叫亚居拉，原籍本都。不久前，亚居拉和妻子百基拉从意大利来，因为克劳狄下令所有犹太人离开罗马[a]。他便到他们那里去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“被逐出罗马。”希腊文较为字面地说“与罗马分离”。
    reason: 说明χωρίζεσθαι ἀπό既可自然译为“离开”，也可能按命令的强制语境理解为“被逐出”。
lexical_decisions:
- source_word: εὑρών τινα Ἰουδαῖον
  choice: 找到一个犹太人
  rationale: 忠实表达不定代词与分词的基本含义，并以自然的现代汉语承接上下文中的主语。
- source_word: ὀνόματι Ἀκύλαν
  choice: 名叫亚居拉
  rationale: 采用现代汉语介绍姓名的常用表达；“亚居拉”沿用通行圣经人名译法。
- source_word: Ποντικὸν τῷ γένει
  choice: 原籍本都
  rationale: τῷ γένει在这里表示出身或地域来源；“原籍”比硬译为“按血统”更符合语境，也不武断断定出生地点。
- source_word: προσφάτως ἐληλυθότα ἀπὸ τῆς Ἰταλίας
  choice: 不久前……从意大利来
  rationale: 表达完成分词所指的先前到来及其当前相关性，同时保持简洁自然。
- source_word: καὶ Πρίσκιλλαν γυναῖκα αὐτοῦ
  choice: 亚居拉和妻子百基拉
  rationale: καί把百基拉与亚居拉一同关联于从意大利而来；补出姓名可消除汉语句法歧义而不增添新信息。
- source_word: διὰ τὸ διατεταχέναι Κλαύδιον
  choice: 因为克劳狄下令
  rationale: διά加冠词化不定式表示原因，διατάσσω在此指统治者所下的命令。
- source_word: χωρίζεσθαι πάντας τοὺς Ἰουδαίους ἀπὸ τῆς Ῥώμης
  choice: 所有犹太人离开罗马
  rationale: 保留χωρίζεσθαι与ἀπό所表达的分离结果；“离开”自然清楚，也避免在正文中把被动驱逐的方式说得比希腊文更明确。
- source_word: προσῆλθεν αὐτοῖς
  choice: 他就到他们那里去
  rationale: 表达朝向亚居拉夫妇而去的叙事动作；“就”自然衔接前面的发现。
theological_decisions:
- issue: Ἰουδαῖον／Ἰουδαίους的身份含义
  choice: 犹太人
  alternative: 犹太地人
  rationale: 本节涉及住在罗马并受皇帝命令影响的犹太群体，重点是族群—宗教身份，而非仅指来自犹太地的居民。
- issue: 克劳狄命令的措辞强度
  choice: 离开罗马
  alternative: 被逐出罗马
  rationale: “被逐出”符合该命令可能产生的实际效果，但χωρίζεσθαι ἀπό本身较字面地表示与罗马分离；正文保留较宽的措辞，并用脚注说明较强的理解。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。人名、地名使用简体中文圣经语境中通行的译名；拆分较长的希腊文句子以提高可读性，同时保留事件顺序和因果关系。
