  text: καὶ κατελθὼν εἰς Καισάρειαν, ἀναβὰς καὶ ἀσπασάμενος τὴν ἐκκλησίαν, κατέβη εἰς Ἀντιόχειαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/022.yaml
  text: And after going down to Caesarea[a], he went up and greeted the church, then went down to Antioch.
translation:
  language: zh_hans
  text: 他下到凯撒利亚，随后上去问候教会[a]，然后下到安提阿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里很可能指耶路撒冷的教会。许多译本在此明确译出“耶路撒冷”，但希腊原文并未提到这个地名。
    reason: 说明“上去”及“教会”所暗示的可能地点，同时保留原文未明说目的地的含蓄性。
lexical_decisions:
- source_word: κατελθὼν
  choice: 到了……以后
  rationale: 不定过去时分词表示先于主要动词的行动。此处结合抵达港口的语境，用“到了……以后”较符合现代汉语；后续“上去”“下到”仍保留路加叙事中的方向表达。
- source_word: Καισάρειαν
  choice: 凯撒利亚
  rationale: 采用该地名在现代中文圣经中的通行译名；上下文所指为沿海的凯撒利亚。
- source_word: ἀναβὰς
  choice: 上去
  rationale: 保留原文的方向含义，不在正文中补出原文未明说的目的地“耶路撒冷”。
- source_word: ἀσπασάμενος
  choice: 问候
  rationale: 直接表达该动词在此处“致意、问安”的常见含义，比“探望”更少解释成分。
- source_word: τὴν ἐκκλησίαν
  choice: 教会
  rationale: 在《使徒行传》指基督徒群体时，“教会”是自然且通行的现代中文表达。
- source_word: κατέβη
  choice: 下到
  rationale: 保留原文的方向和地势表达，也与前面的“上去”形成对应。
- source_word: Ἀντιόχειαν
  choice: 安提阿
  rationale: 采用现代中文圣经中的通行地名；上下文所指为叙利亚的安提阿，但正文无需加以限定。
theological_decisions:
- issue: 是否把“上去”的隐含目的地明确译为耶路撒冷
  choice: 正文不明说目的地，只译“上去”
  alternative: 译作“上耶路撒冷去”
  rationale: 从凯撒利亚“上去”、问候“教会”，随后“下到”安提阿，这一行程很可能指前往耶路撒冷；然而希腊文没有明确写出“耶路撒冷”。因此正文保留原文的含蓄性，并用脚注说明较可能的理解。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“到了……以后”使句首分词结构符合中文习惯；“上去”“下到”保留原文的地理方向感。脚注标记紧接“教会”，清楚说明其可能所指。
