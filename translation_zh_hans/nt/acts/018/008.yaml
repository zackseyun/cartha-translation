  text: Κρίσπος δὲ ὁ ἀρχισυνάγωγος ἐπίστευσεν τῷ κυρίῳ σὺν ὅλῳ τῷ οἴκῳ αὐτοῦ, καὶ πολλοὶ τῶν Κορινθίων ἀκούοντες ἐπίστευον καὶ ἐβαπτίζοντο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/008.yaml
  text: But Crispus[a], the synagogue ruler, believed in the Lord together with his whole household, and many of the Corinthians, hearing, were believing and were being baptized.
translation:
  language: zh_hans
  text: 会堂主管基利司布和他全家都信了主。还有许多哥林多人听了以后，也陆续信主并受洗。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“还有许多哥林多人听见后，就信主并受洗。”希腊文的时态把许多人信主、受洗的情形描写为持续展开的过程。
    reason: 说明较简洁、较合中文习惯的译法，并交代原文现在分词及未完成时所呈现的展开性；不补足原文未明说的听闻对象。
lexical_decisions:
- source_word: Κρίσπος
  choice: 基利司布
  rationale: 采用现代中文圣经语境中可辨识的人名音译，并对应希腊文专名。
- source_word: ἀρχισυνάγωγος
  choice: 会堂主管
  rationale: 指负责带领或管理犹太会堂的人；“主管”自然简明，又不对具体行政职能作过度限定。
- source_word: ἐπίστευσεν τῷ κυρίῳ
  choice: 信了主
  rationale: πιστεύω加与格在中文中自然译作“信了”；κύριος保留为“主”，不在正文中扩写为“主耶稣”。
- source_word: σὺν ὅλῳ τῷ οἴκῳ αὐτοῦ
  choice: 他全家也和他一起信了
  rationale: οἶκος在此指家庭或家中成员，而非房屋；补出第二个“信了”，使中文关系清楚，同时保留全家共同参与的概括表达。
- source_word: πολλοὶ τῶν Κορινθίων
  choice: 许多哥林多人
  rationale: 自然表达部分属格，即哥林多人中有许多人作出回应。
- source_word: ἀκούοντες
  choice: 听了以后
  rationale: 以自然中文表达与后续动作同时或相连的分词关系；原文未明说所听内容，译文也不补出。
- source_word: ἐπίστευον
  choice: 陆续相信
  rationale: 未完成时描绘许多人不断作出回应；“陆续”在自然中文中体现展开和重复的动态。
- source_word: ἐβαπτίζοντο
  choice: 接受了洗礼
  rationale: 表达未完成时所呈现的持续、多人陆续发生的过程，并以“接受”保留其被动受洗之意。
theological_decisions:
- issue: “他全家也和他一起”所涵盖的家庭信仰范围
  choice: 按家庭整体作概括陈述，不说明每位成员信仰的具体方式，也不把该短语直接延伸到全家受洗。
  alternative: 明确断言家中每个人都以相同方式亲自相信，或据此断言全家都受了洗。
  rationale: 希腊文说基利司布与全家一同信主，却没有进一步说明家庭中每个人的具体情形；后半句受洗的主语是许多哥林多人。译文避免引入有关家庭信仰或洗礼的宗派结论。
- issue: “主”的所指
  choice: 正文只译作“主”。
  alternative: 扩写为“主耶稣”。
  rationale: 《使徒行传》的语境表明所指是耶稣，但本节希腊文只用κύριος；因此保留原文称号。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“陆续相信，并且接受了洗礼”兼顾中文流畅度、未完成时的展开性及受洗动词的被动意义。脚注标记置于相关分句末尾。
