base_translation:
  language: en
  yaml_path: translation/nt/acts/018/014.yaml
  text: But as Paul was about to open his mouth[a], Gallio said to the Jews, “If it were some wrongdoing or a serious crime, O Jews[c][b], I would reasonably put up with you.
translation:
  language: zh_hans
  text: 保罗正要开口[a]，迦流却对犹太人说：“犹太人哪，如果这事涉及什么违法行为或恶劣的罪行[b]，我本可容忍你们[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“正要说话。”原文直译为“正要张开口”，是开始说话的惯用表达。
    reason: lexical_alternative
  - marker: b
    text: 或译：“邪恶的罪行”或“恶意的犯罪行为”。原文用一个表示犯罪恶行的词，并以“邪恶的”加以修饰。
    reason: lexical_alternative
  - marker: c
    text: 或译：“我理当容忍你们”或“我自然会听你们申诉。”原文可指容忍、忍耐；在这里的法庭语境中，可指迦流若面对实际的违法或犯罪案件，就会有理由听取他们的陈诉。
    reason: lexical_alternative
lexical_decisions:
- source_word: μέλλοντος δὲ τοῦ Παύλου ἀνοίγειν τὸ στόμα
  choice: 保罗正要开口
  rationale: 属格独立结构配合 μέλλω 和不定式表示即将发生；“开口”既保留原文惯用语，又是自然的现代汉语。δὲ 所含的轻微转折由后面的“却”表达，凸显保罗尚未发言，迦流便先开口。
- source_word: Γαλλίων
  choice: 迦流
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: πρὸς τοὺς Ἰουδαίους
  choice: 对犹太人说
  rationale: 忠实保留原文“对犹太人”的宽泛称呼，不擅自增添“控告者”等解释性限定。
- source_word: ἀδίκημά τι
  choice: 什么违法行为
  rationale: ἀδίκημα 可指不法之事、侵权或违法行为；在迦流审案的司法语境中，“违法行为”自然且不过度限定具体罪名。
- source_word: ῥᾳδιούργημα πονηρόν
  choice: 邪恶的罪行
  rationale: 保留 πονηρόν 的道德评价“邪恶”，并以“罪行”表达 ῥᾳδιούργημα 所指的恶劣犯罪行为，避免仅译作“严重”而丢失原词的善恶色彩。
- source_word: ὦ Ἰουδαῖοι
  choice: 犹太人哪
  rationale: 用现代汉语呼语“哪”体现 ὦ 的直接称呼和修辞语气，同时保持庄重。
- source_word: κατὰ λόγον
  choice: 理当
  rationale: 该短语表示合乎情理、有正当理由；“理当”简洁表达“有充分理由如此”的反事实判断。
- source_word: ἀνεσχόμην ὑμῶν
  choice: 耐心听你们
  rationale: ἀνέχομαι 字面可指容忍、忍受；在法庭语境中，所容忍的是听取他们的陈诉。“耐心听你们”使隐含对象清楚，同时保留迦流略显不耐烦的口吻。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“却”体现叙事中的轻微转折；引语保留迦流作为官员的司法口吻，并以“犹太人哪”传达原文呼语。脚注说明“开口”和“耐心听”的惯用及语境性处理。
