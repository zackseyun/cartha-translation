  yaml_path: translation/nt/acts/018/001.yaml
  text: After this[a], he left Athens and went to Corinth.
translation:
  language: zh_hans
  text: 这些事以后，保罗离开雅典，来到哥林多。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: 这事以后
  rationale: 这是叙事中常见的时间承接语；“这事以后”自然地表达前后次序，同时保留原文“这些事以后”的基本结构。
- source_word: χωρισθεὶς
  choice: 离开
  rationale: χωρίζω 的不定过去时被动分词在这里按惯用法表示离开某地；汉语用“离开”即可自然准确地传达意思，无须勉强译出被动形式。
- source_word: ἐκ τῶν Ἀθηνῶν
  choice: 雅典
  rationale: ἐκ 表示从某处出来；与“离开”搭配时，现代汉语自然地直接说“离开雅典”。
- source_word: ἦλθεν
  choice: 来到
  rationale: ἔρχομαι 表示来、到达；“来到”既符合叙事视角，也清楚表达保罗抵达下一座城市。
- source_word: εἰς Κόρινθον
  choice: 哥林多
  rationale: εἰς 表示朝向或进入某地；与“来到”搭配时，目的地直接作宾语最符合现代汉语习惯。
