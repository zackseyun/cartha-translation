  text: διότι ἐγώ εἰμι μετὰ σοῦ καὶ οὐδεὶς ἐπιθήσεταί σοι τοῦ κακῶσαί σε, διότι λαός ἐστί μοι πολὺς ἐν τῇ πόλει ταύτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/010.yaml
  text: because I am with you[a], and no one will attack you to harm you[b], because I have many people in this city.
translation:
  language: zh_hans
  text: 因为我与你同在；没有人会袭击你、伤害你[a]，因为在这城里有许多属我的人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“没有人会向你下手，加害于你。”
    reason: lexical_alternative
  - marker: b
    text: “在这城里有许多属我的人”很可能指哥林多城中属于主的人，也包括那些后来将要相信的人。
    reason: cross_reference
lexical_decisions:
- source_word: διότι
  choice: 因为
  rationale: 两次出现都引出原因：先说明主为何吩咐保罗继续传讲，后说明主为何应许保守他；“因为”自然保留因果关系。
- source_word: ἐγώ εἰμι μετὰ σοῦ
  choice: 我与你同在
  rationale: 明确的主语ἐγώ带有强调意味；汉语用明说的“我”即可自然传达重点，不必加“亲自”等原文没有的限定。
- source_word: οὐδεὶς ἐπιθήσεταί σοι
  choice: 没有人会袭击你
  rationale: ἐπιτίθημι与间接受格σοι在此表示针对保罗的敌对行动；“袭击你”清楚、现代，也与随后表示目的或结果的不定式衔接。
- source_word: τοῦ κακῶσαί σε
  choice: 伤害你
  rationale: 带冠词的不定式说明敌对行动所要达到的目的或结果；“伤害”保留其宽泛含义，不局限于身体损伤。
- source_word: λαός
  choice: 属我的人
  rationale: λαός在这里是集合性用语，指归于说话者的一群人；结合ἐστί μοι译成“属我的人”，比“许多百姓”更自然，也保留归属含义。
- source_word: ἐστί μοι πολὺς
  choice: 有许多属我的人
  rationale: εἰμί加与格μοι可表达拥有或归属；现代汉语以“有许多属我的人”自然传达，而不照搬希腊语结构。
- source_word: ἐν τῇ πόλει ταύτῃ
  choice: 在这城里
  rationale: 准确保留πόλις的城市含义和ταύτῃ的近指意味；“这城里”简洁自然。
theological_decisions:
- issue: “在这城里有许多属我的人”的范围和时间指向
  choice: 正文保留主宣称城中有许多人属他的说法，不明确限定这些人是否都已经信主。
  alternative: 将其明确解释为当时尚未信、但将来必会相信的人，或仅指已经归信的人。
  rationale: 上下文表明这群人的存在支持保罗继续传讲，但原句没有明说每个人当时的信仰状态。脚注提示可能包括后来将信的人，同时避免在正文中消除这一神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“袭击你、伤害你”清楚表达敌对行动及其目的；“属我的人”自然呈现λαός与μοι所表达的集体归属，同时由脚注保留这些人是否已经信主的解释空间。
