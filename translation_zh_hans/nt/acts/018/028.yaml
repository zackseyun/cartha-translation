  text: εὐτόνως γὰρ τοῖς Ἰουδαίοις διακατηλέγχετο δημοσίᾳ ἐπιδεικνὺς διὰ τῶν γραφῶν εἶναι τὸν χριστὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/028.yaml
  text: For he powerfully refuted the Jews in public[b][a], demonstrating through the Scriptures that Jesus is the Messiah.
translation:
  language: zh_hans
  text: 因为他当众有力地驳倒犹太人，借着圣经证明耶稣就是弥赛亚[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“弥赛亚就是耶稣。”该希腊语不定式分句在汉语中可按这两种语序表达。
    reason: lexical_alternative
  - marker: b
    text: 希腊语χριστός传统译为“基督”；此处该词用作称号，所以译为“弥赛亚”。
    reason: alternative_reading
lexical_decisions:
- source_word: εὐτόνως
  choice: 有力地
  rationale: 表达论辩的强度和说服力，既包含“强而有力”，也不把重点缩减为单纯情绪激烈。
- source_word: διακατηλέγχετο
  choice: 驳倒
  rationale: 该词表示以充分论证彻底反驳对方；“驳倒”比“反驳”更能体现论证奏效的含义。希腊语未完成时所呈现的持续或反复行动，由上下文承载，不生硬添加“不断”。
- source_word: τοῖς Ἰουδαίοις
  choice: 犹太人
  rationale: 直接保留原文的群体称谓；在本段语境中，实际所指是与亚波罗公开辩论的犹太人，并非对所有犹太人的概括判断。
- source_word: δημοσίᾳ
  choice: 当众
  rationale: 自然、简洁地表达行动在公开场合进行。
- source_word: ἐπιδεικνὺς
  choice: 证明
  rationale: 分词说明他借何种论证来驳倒对方，含有提出证据、清楚展示结论的意思。
- source_word: διὰ τῶν γραφῶν
  choice: 借着圣经
  rationale: διά加属格表示媒介或凭借；“借着圣经”表明经文是论证所凭借的依据。
- source_word: τὸν χριστὸν
  choice: 弥赛亚
  rationale: χριστός在这里是称号，指经文所应许的受膏者；“弥赛亚”能清楚保留犹太经文背景。
- source_word: Ἰησοῦν
  choice: 耶稣
  rationale: 采用现代中文圣经及一般读者熟悉的标准译名。
- source_word: εἶναι τὸν χριστὸν Ἰησοῦν
  choice: 耶稣就是弥赛亚
  rationale: 这是自然的现代汉语语序，也符合本段以经文确认耶稣身份的论证方向；希腊语不定式结构容许另一种焦点次序，故以脚注保留。
theological_decisions:
- issue: χριστός作为称号的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 本句论证的是耶稣与经文所应许受膏者之间的身份关系，因此译作“弥赛亚”较能显明称号功能和犹太经文背景，同时以脚注交代希腊词的传统对应。
- issue: 不定式分句中身份命题的汉语语序
  choice: 耶稣就是弥赛亚
  alternative: 弥赛亚就是耶稣
  rationale: 两种表述在指称关系上相通，但信息焦点略有差异。正文采用较自然且契合宣讲语境的语序，脚注保留原文容许的另一种表达，避免过度消除歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“当众有力地驳倒”紧凑呈现公开论辩及其成效；“借着圣经证明”保持论证方式清晰。正文所有脚注标记均置于相关身份命题之后。
