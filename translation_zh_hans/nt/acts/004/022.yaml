  text: ἐτῶν γὰρ ἦν πλειόνων τεσσεράκοντα ὁ ἄνθρωπος ἐφ’ ὃν ⸀γεγόνει τὸ σημεῖον τοῦτο τῆς ἰάσεως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/022.yaml
  text: For the man on whom this sign of healing had happened was more than forty years old[a].
translation:
  language: zh_hans
  text: 因为这个医治的记号发生在那人身上，而那人已经超过四十岁了[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这个医治的记号”也可译作“这个医治的神迹”或“这个医治的奇事”。
    reason: 保留σημεῖον及其与ἴασις组合时可能采用的不同表达；“记号”保留其指示、印证意味。
lexical_decisions:
- source_word: ἐτῶν ... πλειόνων τεσσεράκοντα
  choice: 已经四十多岁了
  rationale: 这是表达年龄的希腊语习惯结构，直指年龄超过四十岁；“四十多岁”是自然、准确的现代汉语表达。
- source_word: γὰρ
  choice: 因为
  rationale: γάρ在此说明上一节众人无法否认这事并归荣耀给神的缘由；“因为”清楚保留其解释关系。
- source_word: ὁ ἄνθρωπος
  choice: 那人
  rationale: 这里指上下文中已经提到的那名男子；“那人”既明确又符合现代汉语叙述习惯。
- source_word: ἐφ’ ὃν
  choice: 在那人身上
  rationale: ἐπί加宾格在这里标明事件所临到或影响的对象；此译法直接而自然。
- source_word: γεγόνει
  choice: 发生
  rationale: γίνομαι的过去完成时把医治神迹作为已经发生的事件来叙述，并未在本句中明说施行者；汉语按上下文用“发生”即可自然表达，同时避免额外强化施事。
- source_word: τὸ σημεῖον τοῦτο τῆς ἰάσεως
  choice: 这个医治的神迹
  rationale: σημεῖον含有作为标志、印证的意味，在本语境中又明确指超自然的医治；“医治的神迹”在现代汉语中自然易懂，并以脚注保留“记号”等较贴近词面意义的译法。
theological_decisions:
- issue: 医治语境中σημεῖον的译法
  choice: 神迹
  alternative: 记号；奇事
  rationale: “神迹”自然表达这里超常医治的性质，也可在汉语圣经语境中承载其印证意义；脚注列出“记号”，以保留σημεῖον所强调的指示和见证功能，避免把词义仅限于令人惊奇的事件。
- issue: γεγόνει是否明示施行者
  choice: 发生
  alternative: 被施行；被行出来
  rationale: 原文使用γίνομαι，着重事件已经发生，并未在本句语法中明确指定施行者。“发生”保留这种事件焦点；神的能力和使徒的参与则由上下文说明。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“因为”承接上一节的论证；“而他已经四十多岁了”突出此人长期残疾背景下这次医治的显著性。脚注标记[a]已在正文中对应出现。
