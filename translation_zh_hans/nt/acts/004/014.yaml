base_translation:
  language: en
  yaml_path: translation/nt/acts/004/014.yaml
  text: And seeing the man who had been healed standing with them[a], they had nothing to say in reply.
translation:
  language: zh_hans
  text: 他们看见那得了医治的人和彼得、约翰一同站着，就无从反驳了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“就说不出反对的话来”，或“就没有什么可反对的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τε
  choice: 就
  rationale: τε承接上一节的叙事发展。汉语在“看见……”条件后用“就”自然连接主句，不必机械译出“并且”。
- source_word: ἄνθρωπον
  choice: 那……的人
  rationale: 指上文中特定的男性；现代汉语以“那……的人”结合后置修饰语来明确所指。
- source_word: βλέποντες
  choice: 他们看见
  rationale: 现在分词表示与主句同时发生的情形；译为“他们看见”符合自然汉语，并保留其作为主句背景的作用。
- source_word: σὺν αὐτοῖς
  choice: 和彼得、约翰一同
  rationale: σύν加与格表示陪同。代词αὐτοῖς按近接上下文明确为彼得和约翰，可避免汉语“和他们”指代含混。
- source_word: ἑστῶτα
  choice: 站着
  rationale: ἵστημι的完成时分词在此描述持续的站立状态，“站着”简洁自然。
- source_word: τεθεραπευμένον
  choice: 得了医治
  rationale: θεραπεύω的完成时被动分词指已经完成且结果持续的医治；“得了医治”保留被动意义，也符合神迹叙事的庄重语体。
- source_word: οὐδὲν
  choice: 无话
  rationale: οὐδέν表达完全没有可用来回应的内容；与“可驳”组合成自然汉语。
- source_word: εἶχον ἀντειπεῖν
  choice: 无话可驳
  rationale: ἔχω加不定式表示没有什么能够说，ἀντειπεῖν带有反驳、反对或回应的意味。“无话可驳”简练地保留其对抗性，同时脚注列出较中性的可能译法。
