  text: εἰ ἡμεῖς σήμερον ἀνακρινόμεθα ἐπὶ εὐεργεσίᾳ ἀνθρώπου ἀσθενοῦς, ἐν τίνι οὗτος ⸀σέσωσται,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/009.yaml
  text: If we are being examined today concerning a good deed done to a sick man[b][a], by what means this man has been healed—
translation:
  language: zh_hans
  text: 如果我们今天因向一个病弱的人所行的善事而受审问，就是问这人是靠什么得了医治[a][b]——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“得了拯救”或“得以康复”。希腊语动词可指蒙拯救、获救或得医治；这里的直接语境主要指身体得医治。
    reason: lexical_alternative
  - marker: b
    text: 本句也可译为：“如果我们今天因向一个病弱的人所行的善事而受审问，就这人是靠什么得了医治一事受审问——”
    reason: syntactic_alternative
lexical_decisions:
- source_word: ἀνακρινόμεθα
  choice: 受审问
  rationale: 该词在这里带有司法或调查性问讯的意味。“受审问”既保留正式场合的法律色彩，又不把语气强化为已经正式受审判或遭严厉审讯。
- source_word: ἐπὶ εὐεργεσίᾳ
  choice: 因……行了善事
  rationale: ἐπί加与格在此表示受审问的缘由或事项；εὐεργεσία指有益于人的善行。此译自然呈现使徒因善举而被问讯的反讽。
- source_word: ἀνθρώπου ἀσθενοῦς
  choice: 给一个病弱的人
  rationale: 该属格短语说明善行所惠及的对象。ἀσθενής可指软弱、患病或身体衰弱；结合先前瘸腿者得恢复的语境，“病弱”比单说“生病”更宽泛，也避免擅自改成原文未直接使用的“残疾”。
- source_word: ἐν τίνι
  choice: 靠什么
  rationale: ἐν加疑问代词在这里可表示凭借的途径、能力或施行者。“靠什么”保留原文的宽度，不预先把它限定为“靠谁”；下一节才明确指出耶稣基督。
- source_word: σέσωσται
  choice: 得了医治
  rationale: σῴζω可表示拯救、救助、使痊愈。这里直接谈论那位身体得恢复的人，因此正文采用“得了医治”；其更广的“得救”语义保留在脚注中。
theological_decisions:
- issue: 医治语境中σέσωσται（σῴζω）的译法
  choice: 得了医治
  alternative: 得了拯救；得以康复
  rationale: 眼前所指是先前瘸腿之人的身体恢复，因此“医治”是本节首要含义。不过，σῴζω在《使徒行传》中也有“拯救、得救”的含义；脚注保留这种词义交叠，既不淡化其神学回响，也不把救恩含义强行替代本节直接的身体医治语境。
- issue: ἐν τίνι所指的是手段还是施行者
  choice: 靠什么
  alternative: 靠谁
  rationale: 希腊语表达本身可以询问凭借的途径或施行者，而下一节的回答指向耶稣。正文采用较宽的“靠什么”，让叙事中的回答自行明确其人格性对象。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“如果……而受审问”保留原文条件句，并以句末破折号表明彼得的话尚未说完。“查问”把后半句理解为对“受审问”内容的具体说明，避免中文中逗号连接造成并列事项的误读。
