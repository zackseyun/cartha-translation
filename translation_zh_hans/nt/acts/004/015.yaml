  yaml_path: translation/nt/acts/004/015.yaml
  text: But after ordering them to go outside the council[a], they began conferring with one another[b],
translation:
  language: zh_hans
  text: 于是，他们吩咐彼得和约翰到公议会[a]外面去，然后彼此商议[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “公议会”或译“议会”或“犹太公议会”。希腊语 συνέδριον 既可指犹太人的统治议会，也可指该议会开会的场所或会议。
    reason: lexical_alternative
  - marker: b
    text: “彼此商议”也可译作“他们内部讨论”或“彼此磋商”。
    reason: lexical_alternative
lexical_decisions:
- source_word: κελεύσαντες
  choice: 吩咐
  rationale: 不定过去时分词表示先于主句动作发生的命令；“吩咐”自然表达当权者下令，又不过度强化语气。
- source_word: δὲ
  choice: 于是
  rationale: 此处主要推动叙事并呈现从公开审问转入内部商议；“于是”比强转折词更符合希腊语 δὲ 的轻微承接功能。
- source_word: αὐτοὺς
  choice: 彼得和约翰
  rationale: 原文为“他们”，所指是彼得和约翰。中文在连续出现多个复数主体时补明姓名，可避免与公议会成员混淆。
- source_word: ἔξω τοῦ συνεδρίου
  choice: 到公议会外面
  rationale: συνέδριον 在此可指犹太人的统治议会，也可指其开会的场所或会场；正文采用中文圣经语境中易懂的“公议会”，并保留“外面”的空间表达。
- source_word: ἀπελθεῖν
  choice: 去
  rationale: 与 ἔξω 搭配，译为“到……外面去”符合现代汉语，也避免“离开到外面”的累赘。
- source_word: συνέβαλλον
  choice: 商议
  rationale: 未完成时表示持续进行的动作；此语境下 συμβάλλω 指共同讨论、磋商或斟酌，译作“商议”简洁而准确。
- source_word: πρὸς ἀλλήλους
  choice: 彼此
  rationale: 表达参与者相互之间进行商议；“彼此商议”是自然、庄重的现代汉语。
theological_decisions: []
