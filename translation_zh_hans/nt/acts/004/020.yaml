  text: οὐ δυνάμεθα γὰρ ἡμεῖς ἃ εἴδαμεν καὶ ἠκούσαμεν μὴ λαλεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/020.yaml
  text: For we are not able not to speak about what we have seen and heard[a].
translation:
  language: zh_hans
  text: 因为我们不能不把所看见、所听见的说出来。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为我们无法对所看见、所听见的保持沉默。”
    reason: 提供较意译而自然的汉语表达，说明“不能不……说”所表示的是无法保持沉默，同时不取代正文对原文结构的保留。
lexical_decisions:
- source_word: οὐ δυνάμεθα ... μὴ λαλεῖν
  choice: 我们不能不说出来
  rationale: 保留原文“不能……不说”的结构和无力保持沉默的语气；“说出来”在现代汉语中自然，也表明所见所闻是发言的内容。
- source_word: γὰρ
  choice: 因为
  rationale: 表示本句是对上文的解释或理由；“因为”在现代汉语中清楚自然。
- source_word: ἡμεῖς
  choice: 我们
  rationale: 保留原文明确写出的第一人称复数主语；汉语无需再加“我们自己”，以免过度强化。
- source_word: ἃ
  choice: 所……的
  rationale: 用汉语名词化结构概括使徒见闻的内容，避免生硬译成“那些事物”。
- source_word: εἴδαμεν καὶ ἠκούσαμεν
  choice: 所看见、所听见的
  rationale: 并列保留亲历见证的两个方面，不额外加入原文没有明说的“亲眼”“亲耳”。
- source_word: λαλεῖν
  choice: 说出来
  rationale: 此处指把所见所闻说出；“说出来”比单说“说”更符合现代汉语，同时不过度限定为讲道、宣告或叙述。
theological_decisions:
- issue: 使徒发言的必然性应译为“不能不说”，还是仅表达坚定意愿
  choice: 译作“我们不能不说出来”，表达无法保持沉默
  alternative: 译作“我们决意要说”或“我们不会停止传讲”
  rationale: οὐ δυνάμεθα与μὴ λαλεῖν直接构成“不能不说”的意思，重点是无法缄默，而不只是主观意愿。译文保留这种张力，不把它弱化为决定或承诺。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“不能不说出来”保留原文近似双重否定的力度；前置“我们所看见、所听见的”突出见证内容，并维持自然可懂的句式。
