source:
  edition: SBLGNT
  text: οἱ δὲ προσαπειλησάμενοι ἀπέλυσαν αὐτούς, μηδὲν εὑρίσκοντες τὸ πῶς ⸀κολάσωνται αὐτούς, διὰ τὸν λαόν, ὅτι πάντες ἐδόξαζον τὸν θεὸν ἐπὶ τῷ γεγονότι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/021.yaml
  text: So after further threatening them[a], they released them, finding no way to punish them because of the people, since everyone was glorifying God for what had happened.
translation:
  language: zh_hans
  text: 于是，他们又恐吓了使徒一番[a]，便把他们释放了。他们因民众的缘故，找不到办法惩罚他们，因为众人都为所发生的事归荣耀给上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“再次恐吓他们”，或“又加以恐吓”。希腊语 προσαπειλησάμενοι 表示在先前的威吓之外，又增加或加重威吓。
    reason: lexical_alternative
lexical_decisions:
- source_word: προσαπειλησάμενοι
  choice: 又恐吓了使徒一番
  rationale: προσ- 表明在先前的警告和威吓之外又加以恐吓；“又……一番”在现代汉语中自然地表达附加或加重的意味。宾语按上下文明确为使徒，以避免连续代词造成含混。
- source_word: ἀπέλυσαν αὐτούς
  choice: 把他们释放了
  rationale: ἀπολύω 在此指当局将被拘押者放走；“释放”符合司法和羁押语境。
- source_word: μηδὲν εὑρίσκοντες τὸ πῶς κολάσωνται αὐτούς
  choice: 找不到办法惩罚他们
  rationale: μηδὲν 与 τὸ πῶς 合起来并非单指“什么也找不到”，而是找不到如何施行惩罚的办法；此译保留目的和可能性的语意，同时符合汉语表达。
- source_word: διὰ τὸν λαόν
  choice: 因民众的缘故
  rationale: διά 加宾格在这里表示原因；λαός 指较广泛的百姓或民众，而非仅指现场的一群人。
- source_word: πάντες
  choice: 众人
  rationale: πάντες 泛指所有相关民众；“众人”简洁、自然，并保留概括性的全称意味。
- source_word: ἐδόξαζον τὸν θεόν
  choice: 都……归荣耀给上帝
  rationale: δοξάζω 表示尊崇并把荣耀归给上帝；“归荣耀给”比单纯“赞美”更直接保留原词的荣耀语义。未完成时态在此呈现当时持续或普遍发生的反应，由语境和“都”自然体现。
- source_word: ἐπὶ τῷ γεγονότι
  choice: 为所发生的事
  rationale: ἐπί 与与格在此表示归荣耀给上帝的缘由；γεγονότι 指已经发生且仍具现实影响的事件。“为所发生的事”简洁保留这一因由关系。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“于是”承接前文；主句用“释放”体现拘押背景。“归荣耀给上帝”保留路加—使徒行传中 δοξάζω 的神学与修辞色彩。
