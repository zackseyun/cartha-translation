  text: Λαλούντων δὲ αὐτῶν πρὸς τὸν λαὸν ἐπέστησαν αὐτοῖς οἱ ⸀ἱερεῖς καὶ ὁ στρατηγὸς τοῦ ἱεροῦ καὶ οἱ Σαδδουκαῖοι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/001.yaml
  text: While they were speaking to the people[a], the priests and the captain of the temple and the Sadducees came upon them[b],
translation:
  language: zh_hans
  text: 他们正对百姓说话时，祭司们、圣殿守卫长[a]和撒都该人来到他们跟前[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣殿守卫长”是负责维持圣殿区域秩序和安全的官员。
    reason: cultural_note
  - marker: b
    text: “来到他们跟前”也可译作“走上前来”；希腊文动词可表示突然来到或走近，此处语境显示官员前来打断他们。
    reason: lexical_alternative
lexical_decisions:
- source_word: Λαλούντων δὲ αὐτῶν
  choice: 他们正……说话时
  rationale: 将属格独立结构自然地译为时间从句；“正……时”表达动作正在进行。δέ在此主要推进叙事，不另加生硬的连接词。
- source_word: πρὸς τὸν λαὸν
  choice: 对百姓
  rationale: λαός在圣殿场景中指聚集的民众；“百姓”准确、自然，也避免把它过度具体化为单纯的“人群”。
- source_word: ἐπέστησαν αὐτοῖς
  choice: 来到他们跟前
  rationale: ἐφίστημι可指来到、走近或突然出现；此译法保留官员前来打断讲话的场景，同时不把动词本身强化为“对付”或“质问”。
- source_word: οἱ ἱερεῖς
  choice: 祭司们
  rationale: 原文是普通的“祭司”，并非“祭司长”，因此不加入原文没有的等级含义。
- source_word: ὁ στρατηγὸς τοῦ ἱεροῦ
  choice: 圣殿守卫长
  rationale: στρατηγός指负责指挥的官员；结合圣殿职务背景，“圣殿守卫长”比字面的“圣殿长官”更易懂，并由脚注说明其职责。
- source_word: οἱ Σαδδουκαῖοι
  choice: 撒都该人
  rationale: 采用现代中文圣经中通行的群体名称音译。
theological_decisions:
- issue: 官员到来是否应直接译出敌对意味
  choice: 采用中性的“来到他们跟前”
  alternative: “上前对付他们”或“前来质问他们”
  rationale: 后文显明这些人的反对态度，但本节动词本身主要叙述他们来到现场。中性译法保留叙事张力，不提前强化敌意。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“百姓”“祭司们”“撒都该人”沿用通行圣经用语；脚注标记按其实际说明对象放置，分别置于“圣殿守卫长”和“来到他们跟前”之后。
