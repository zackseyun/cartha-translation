  text: πολλοὶ δὲ τῶν ἀκουσάντων τὸν λόγον ἐπίστευσαν, καὶ ἐγενήθη ⸀ὁ ἀριθμὸς τῶν ἀνδρῶν ⸀ὡς χιλιάδες πέντε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/004.yaml
  text: But many of those who had heard the message believed[b][a], and the number of the men became about five thousand.
translation:
  language: zh_hans
  text: 但听见这道[a]的人中，有许多信了；男子[b]的数目达到约五千。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “道”也可译作“信息”；这里指使徒所传讲的信息。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“男子的数目”，可能是指所统计的男性人数，而非包括男女在内的总人数。
    reason: cultural_note
lexical_decisions:
- source_word: πολλοὶ δὲ
  choice: 但……有许多
  rationale: δὲ承接上文使徒遭反对和被拘押的情境，带出转折；πολλοί保留不确定但数量可观的含义。
- source_word: τῶν ἀκουσάντων τὸν λόγον
  choice: 听见这道的人中
  rationale: 分词结构译为自然的汉语定语结构；λόγος在这里指使徒所宣讲的信息，译作“道”可保留其传统且较宽的语义，并由脚注说明。
- source_word: ἐπίστευσαν
  choice: 信了
  rationale: 直接传达πιστεύω的简洁表达，不额外补出信仰对象，也不将其扩展为更系统化的神学措辞。
- source_word: ἐγενήθη ὁ ἀριθμὸς
  choice: 数目……有
  rationale: 以自然现代汉语表达人数达到某一结果的状态，避免生硬直译为“数目成为”。
- source_word: τῶν ἀνδρῶν
  choice: 男人的数目
  rationale: ἀνήρ通常特指成年男性，因此不泛化为“人”或“信徒”；脚注说明这可能是男性人数的统计。
- source_word: ὡς χιλιάδες πέντε
  choice: 约有五千
  rationale: ὡς用于数字前表示约数，“约有五千”准确且自然。
theological_decisions:
- issue: τῶν ἀνδρῶν所指统计对象的性别范围
  choice: 男人的数目
  alternative: 人数／信徒人数
  rationale: 原文使用通常指男性的ἀνδρῶν，应保留性别限定。这并不裁定整个信徒群体是否包括女性，只反映本节统计数字的措辞。
- issue: πιστεύω是否明说信仰对象
  choice: 信了
  alternative: 信了这道／信了主
  rationale: 原文此处未明说宾语；简洁译作“信了”保留语法上的开放性，避免从上下文补入特定对象。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“这道”承接使徒的宣讲；“男人”明确保留原文的男性用语。脚注标记依其所解释内容分别置于“道”和“男人的数目”之后。
