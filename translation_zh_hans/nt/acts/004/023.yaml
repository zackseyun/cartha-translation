id: ACT.4.23
reference: Acts 4:23
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ἀπολυθέντες δὲ ἦλθον πρὸς τοὺς ἰδίους καὶ ἀπήγγειλαν ὅσα πρὸς αὐτοὺς οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι εἶπαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/023.yaml
  text: After they were released[a], they went to their own people and reported all that the chief priests and the elders had said to them.
translation:
  language: zh_hans
  text: 他们获释后，就回到自己人那里[a]，把祭司长和长老对他们所说的一切都报告了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“自己的同伴那里”；直译：“自己的人那里”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπολυθέντες
  choice: 他们获释后
  rationale: 不定过去时被动分词表示先于主句动作发生的事；“获释后”自然地保留被动和时间关系，也符合受拘押后被释放的语境。
- source_word: δὲ
  choice: 不另行译出
  rationale: δέ是轻微的衔接词；汉语中“……后，就……”已自然承载叙事推进功能，若另加“而”或“于是”会显得累赘。
- source_word: ἦλθον
  choice: 就回到
  rationale: ἔρχομαι可依叙述视角译作“来”或“去”；上下文表明彼得和约翰回到所属群体，“回到”在现代汉语中最自然，同时不改变目的地。
- source_word: πρὸς τοὺς ἰδίους
  choice: 自己人那里
  rationale: τοὺς ἰδίους直译为“自己的人”，指他们所属的同伴或群体。“自己人”保留原文未明确界定群体范围的特点，脚注补充较直译的理解。
- source_word: ἀπήγγειλαν
  choice: 报告了
  rationale: ἀπαγγέλλω表示把消息或事情转告、禀报；“报告”适合此处完整复述官长言语的语境。
- source_word: ὅσα
  choice: 一切
  rationale: ὅσα涵盖所说的全部内容；“一切”简洁而保留其周全意义。
- source_word: πρὸς αὐτοὺς
  choice: 对他们
  rationale: λέγω与πρός加宾格在此表示向某人说话；“对他们”准确保留对象关系，不把敌意额外译入。
- source_word: οἱ ἀρχιερεῖς
  choice: 祭司长
  rationale: 复数ἀρχιερεῖς指居领导地位的祭司权贵；“祭司长”是准确且通行的中文称谓，并非指多位在任大祭司。
- source_word: οἱ πρεσβύτεροι
  choice: 长老
  rationale: 此处指公议机构中的犹太领袖，而非泛指年长者；“长老”保留其制度性称谓。
- source_word: εἶπαν
  choice: 所说的
  rationale: 汉语定中结构已清楚表明这些话先于“报告”发生，无须机械使用过去完成式。
