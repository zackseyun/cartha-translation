id: ACT.4.27
reference: Acts 4:27
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: συνήχθησαν γὰρ ἐπ’ ἀληθείας ⸂ἐν τῇ πόλει ταύτῃ⸃ ἐπὶ τὸν ἅγιον παῖδά σου Ἰησοῦν, ὃν ἔχρισας, Ἡρῴδης τε καὶ Πόντιος Πιλᾶτος σὺν ἔθνεσιν καὶ λαοῖς Ἰσραήλ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/027.yaml
  text: For truly in this city Herod and Pontius Pilate[a], together with the Gentiles and the peoples of Israel, were gathered against your holy servant Jesus, whom you anointed[b],
translation:
  language: zh_hans
  text: 因为希律和本丢·彼拉多，连同外邦人和以色列的众民[b]，果真在这城里聚集起来，敌对你所膏立的圣仆[a]耶稣。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “仆”也可译作“孩子”。希腊词παῖς可指仆人，也可指孩子；这里很可能呼应以赛亚书关于上帝仆人的话。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“列国和以色列的众民”。原文中“外邦人／列国”和“以色列的众民”均为复数表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήχθησαν
  choice: 聚集起来
  rationale: 保留不定过去时所表达的已发生事件；汉语用“聚集起来”自然呈现多人结成合力的动作，而不擅自指明使动者。
- source_word: γὰρ
  choice: 因为
  rationale: 承接上一节所引诗篇，并说明该经文如何在耶稣受难事件中应验；“因为”清楚表达论证关系。
- source_word: ἐπ’ ἀληθείας
  choice: 果真
  rationale: 这是表示“确实、实在”的副词性短语；“果真”既有强调作用，也自然承接前文预言。
- source_word: ἐν τῇ πόλει ταύτῃ
  choice: 在这城里
  rationale: 直接保留地点指示，不在正文中补出上下文已可辨明的“耶路撒冷”。
- source_word: ἐπὶ τὸν
  choice: 敌对
  rationale: 在“聚集”这一带有敌意的语境中，ἐπί加宾格表示行动所针对的对象；“敌对”准确传达其对抗意味。
- source_word: τὸν ἅγιον παῖδά σου
  choice: 你的圣仆
  rationale: ἅγιος译为“圣”，表明分别为圣、属于上帝；παῖς虽可指孩子，但本段与以赛亚书仆人意象及《使徒行传》相邻用法相呼应，故正文采用“仆”。
- source_word: Ἰησοῦν
  choice: 耶稣
  rationale: 采用现代中文圣经通行人名译法。
- source_word: ὃν ἔχρισας
  choice: 你所膏立的
  rationale: χρίω本义为“膏抹”；“膏立”在现代中文宗教语境中兼顾膏抹行动及受命含义，并保留弥赛亚关联，而不直接把动词改译为名号。
- source_word: Ἡρῴδης τε καὶ Πόντιος Πιλᾶτος
  choice: 希律和本丢·彼拉多
  rationale: 采用现代中文通行专名，并自然表达τε καὶ的并列关系。
- source_word: σὺν ἔθνεσιν καὶ λαοῖς Ἰσραήλ
  choice: 连同外族人和以色列各族
  rationale: ἔθνη在与以色列对举时指非以色列人，译作“外族人”较普通读者易懂；λαοί是复数，故以“各族”保留复数特征。
theological_decisions:
- issue: 用于耶稣的παῖς如何译出
  choice: 圣仆
  alternative: 圣子／圣童
  rationale: παῖς本身可指仆人或孩子，但这里的祷告很可能呼应以赛亚书的耶和华仆人传统，且《使徒行传》3:13、3:26、4:27、4:30形成一致用法。“圣仆”保留这一经文联系；脚注同时注明真实存在的词义歧义，不以“圣子”替代原词而预先作神学解释。
- issue: ἔθνη与以色列并列时的表达
  choice: 外族人
  alternative: 列国／万族
  rationale: 此处重点是非以色列人与以色列群体共同参与敌对行动。“外族人”清楚表达族群对举，同时脚注保留“列国”这一可能译法。
- issue: “膏立”所承载的弥赛亚含义
  choice: 保留动词“膏立”
  alternative: 立为弥赛亚／委任
  rationale: 原文使用χρίω动词而非Χριστός名词；直译其膏抹行动既让弥赛亚意味自然浮现，又避免把隐含关联直接改成称号。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“果真”保留原文强调语气；“在这城里”不补明耶路撒冷，以维持原文指示方式；句序略按汉语习惯调整，但保留希律、彼拉多、外族人与以色列各族共同敌对耶稣的结构。脚注标记均紧随其所说明的词组。
