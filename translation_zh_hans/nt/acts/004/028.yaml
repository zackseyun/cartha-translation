base_translation:
  language: en
  yaml_path: translation/nt/acts/004/028.yaml
  text: to do whatever your hand and your purpose had predestined to happen[a].
translation:
  language: zh_hans
  text: 为要成就你的手和你的旨意所预定要发生的一切[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “所预定”或译“预先所定”“预先决定”。希腊语动词表示事先作出决定。
    reason: 说明προώρισεν的词义范围，并提供较少神学术语色彩的译法。
lexical_decisions:
- source_word: ποιῆσαι
  choice: 为要做成
  rationale: 不定式承接上文，表达那些人聚集行动所达成的结果，也可带目的色彩；“做成”比单说“做”更自然地指向事件的实现，同时不把目的与结果之间的张力完全消除。
- source_word: ὅσα
  choice: 一切
  rationale: 中性复数关系代词在这里概括上文与耶稣受难有关的全部事情；“一切”简洁自然，并保留其广泛范围。
- source_word: ἡ χείρ σου
  choice: 你亲手
  rationale: 保留“手”这一具体的圣经意象，表达上帝的能力与作为；加“亲”使现代汉语更自然，但不将比喻直接解释成“能力”。
- source_word: ἡ βουλή
  choice: 你的旨意
  rationale: βουλή指经过筹划的意向、计划或决断。“旨意”适合以尊称语境表达上帝有意的安排，同时避免仅译成较弱的“想法”。
- source_word: προώρισεν
  choice: 预先所定
  rationale: 该动词表示事先划定或决定。“预先所定”保留时间上的在先性和决定性的力度，又比直接套用体系化神学术语稍为中性。
- source_word: γενέσθαι
  choice: 要发生
  rationale: 这里指相关事件成为事实；“发生”是自然的现代汉语表达，比“成为”更符合事件语境。
theological_decisions:
- issue: προώρισεν在上帝主权与人的责任并存的语境中如何表达
  choice: 预先所定
  alternative: 预定；预先决定
  rationale: 原文明确肯定上帝事先的决定，同时上文也把行动归于希律、彼拉多、外族人和以色列民。译文保留这种张力，不进一步说明上帝的预定与人的责任如何协调，也不导入特定宗派体系。
- issue: “你的手”和“你的旨意”作为共同主语的关系
  choice: 你亲手和你的旨意预先所定
  alternative: 你凭能力、按旨意预先决定
  rationale: 按原文并列结构保留“手”和“旨意”，不把“手”完全释义为能力，也不重组为工具与准则关系，以免消除原文富有张力的拟人表达。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“你亲手”保留圣经中的具体意象；“旨意”符合祷告语境。“为要做成”与上文句法相接，在单节呈现时也能表明目的或结果关系。脚注标记已在正文中以[a]标出。
