source:
  edition: SBLGNT
  text: παρέστησαν οἱ βασιλεῖς τῆς γῆς καὶ οἱ ἄρχοντες συνήχθησαν ἐπὶ τὸ αὐτὸ κατὰ τοῦ κυρίου καὶ κατὰ τοῦ χριστοῦ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/026.yaml
  text: The kings of the earth took their stand[a], and the rulers were gathered together against the Lord and against his Messiah.
translation:
  language: zh_hans
  text: 世上的君王站出来，统治者聚集在一起，反对主，也反对他的弥赛亚[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“基督”；希腊文χριστός意为“受膏者”。
    reason: 说明χριστός在此既可按新约惯用称号译为“基督”，也保留其源自《诗篇》引文的字面意义。
lexical_decisions:
- source_word: παρέστησαν
  choice: 站出来
  rationale: 此处呼应《诗篇》2:2，表达君王有意采取敌对立场，而不只是身体上的站立；“站出来”在现代汉语中自然地传达这种公开对抗的意味。
- source_word: οἱ βασιλεῖς τῆς γῆς
  choice: 世上的君王
  rationale: βασιλεῖς明确指君王；在这处《诗篇》引文中，γῆ具有广泛的世界性含义，因此译作“世上的君王”。
- source_word: οἱ ἄρχοντες
  choice: 统治者
  rationale: 与“君王”构成平行，又保留其掌权、治理的政治含义。
- source_word: συνήχθησαν ἐπὶ τὸ αὐτό
  choice: 聚集在一起
  rationale: 自然表达众人会合、联合行动的意思；希腊语的被动形式在此可具有不及物意味，若硬译为“被聚集”会使现代汉语生硬，并可能无端暗示一位明确的召集者。
- source_word: κατὰ
  choice: 敌对
  rationale: 两次κατά都表示带有敌意的反对；重复“敌对”保留原文平行结构和强调。
- source_word: κυρίου
  choice: 主
  rationale: 在经文引语中指上帝，并承载κύριος在圣经语境中的称号意义。
- source_word: χριστοῦ αὐτοῦ
  choice: 他的弥赛亚
  rationale: χριστός在《诗篇》2篇的引文中是称号，字面意为“受膏者”；“弥赛亚”既保留其称号性质，也清楚表达其弥赛亚语境。
theological_decisions:
- issue: 《诗篇》2篇引文中χριστός的译法
  choice: 弥赛亚
  alternative: 基督；受膏者
  rationale: 这里的χριστός不是单纯作为名字使用，而是“主所膏立者”的称号。“弥赛亚”能保留旧约背景中的君王与救赎盼望；脚注同时说明“基督”和字面意义“受膏者”，避免掩盖希腊词的语义范围。
- issue: “他的”所指为何
  choice: 保留代词“他的”
  alternative: 主的
  rationale: αὐτοῦ自然回指前面的“主”。保留代词既忠实于原文，也不额外改写其关系表达。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“站出来”体现公开采取敌对立场；“聚集在一起”避免生硬的被动句。保留“敌对……也敌对……”的重复，以呈现原文的平行和力度。
