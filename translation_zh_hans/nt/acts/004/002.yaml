source:
  edition: SBLGNT
  text: διαπονούμενοι διὰ τὸ διδάσκειν αὐτοὺς τὸν λαὸν καὶ καταγγέλλειν ἐν τῷ Ἰησοῦ τὴν ἀνάστασιν ⸂τὴν ἐκ⸃ νεκρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/002.yaml
  text: being greatly disturbed because they were teaching the people and proclaiming in Jesus the resurrection from the dead,[a]
translation:
  language: zh_hans
  text: 他们因那两人教导百姓，并宣告死人复活的事，以耶稣为明证，就十分恼怒。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“宣告死人复活的事在耶稣身上得以显明。”希腊语“在耶稣里”也可理解为“借着耶稣”；这短语可能特别指耶稣本人的复活，也可能指以他的复活为明证的死人复活。
    reason: 保留ἐν τῷ Ἰησοῦ的句法与语义开放性，避免将其限定为单指耶稣的复活或单指借着耶稣而有的复活。
lexical_decisions:
- source_word: διαπονούμενοι
  choice: 十分恼怒
  rationale: 该分词表示强烈的不满、烦恼或愤慨；“十分恼怒”既传达其强度，也符合现代汉语叙事语体。
- source_word: διὰ τὸ διδάσκειν
  choice: 因……教导
  rationale: διά加带冠词不定式表达原因；用“因”引出原因，简洁而准确。
- source_word: αὐτοὺς
  choice: 那两人
  rationale: 代词回指上文的彼得和约翰。汉语若内外两组人物都译作“他们”容易混淆，因此依上下文译为“那两人”，没有直接重复姓名。
- source_word: τὸν λαὸν
  choice: 百姓
  rationale: λαός在这里指作为整体的民众；“百姓”比“人群”更能保留这一集体含义。
- source_word: καταγγέλλειν
  choice: 宣告
  rationale: 该词表示公开传扬、宣布；“宣告”庄重自然，并保留公开宣讲的语气。
- source_word: ἐν τῷ Ἰησοῦ
  choice: 在耶稣里
  rationale: 直译介词短语，以保留它可能表示复活在耶稣身上得到显明、以耶稣为中心，或借着耶稣而有的开放性。
- source_word: ἀνάστασιν
  choice: 复活的事
  rationale: “复活”准确对应名词；加“的事”使“宣告在耶稣里从死人中复活”在现代汉语中更顺畅，而不限定其所指范围。
- source_word: τὴν ἐκ νεκρῶν
  choice: 从死人中复活
  rationale: 保留ἐκ所表达的“从……中出来”之意；“从死人中复活”清楚表达从死者当中复起。
theological_decisions:
- issue: ἐν τῷ Ἰησοῦ与复活宣告的关系
  choice: 译作“在耶稣里”，让正文保留原文介词短语的开放性。
  alternative: “借着耶稣”或“就耶稣而言”
  rationale: ἐν在此可能指复活在耶稣身上得到显明，也可能带有以他为领域、中心或媒介的意味。正文不把它收窄为单一解释，脚注说明较具体的可能含义。
- issue: “从死人中复活”的范围
  choice: 措辞既可指耶稣本人的复活，也可指在他里面得到确证的死人复活。
  alternative: 仅指耶稣复活，或仅指末日普遍复活
  rationale: 原文能同时唤起耶稣的复活及以他为根据的复活盼望，因此不在译文中排除其中任何一面。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“那两人”避免与本句主语“他们”混淆；“在耶稣里”略带浓缩性，但为保留原文真实的神学与句法张力而有意采用，并由脚注辅助说明。
