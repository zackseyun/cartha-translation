  text: λέγοντες· Τί ⸀ποιήσωμεν τοῖς ἀνθρώποις τούτοις; ὅτι μὲν γὰρ γνωστὸν σημεῖον γέγονεν δι’ αὐτῶν πᾶσιν τοῖς κατοικοῦσιν Ἰερουσαλὴμ φανερόν, καὶ οὐ δυνάμεθα ⸀ἀρνεῖσθαι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/016.yaml
  text: saying[a], “What should we do with these men? For indeed, a notable sign has happened through them, evident to all who live in Jerusalem, and we cannot deny it.”
translation:
  language: zh_hans
  text: 他们说：“我们该怎样处置这两个人呢？因为，借着他们发生了一个众所周知的记号[a]；这对所有住在耶路撒冷的人都是显而易见的，我们也无法否认。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“一个显著的记号”。希腊语 γνωστόν 可指“已知的、众所周知的”，在这里指公开为人所知。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: 他们说
  rationale: 现在时分词承接上文并引出议会成员所说的话；现代汉语叙事用“他们说”自然清楚。
- source_word: Τί ποιήσωμεν τοῖς ἀνθρώποις τούτοις
  choice: 我们该怎样处置这两个人呢
  rationale: 不定过去时虚拟语气构成商议性问句；“该怎样”表达商议语气，“处置”体现 ποιέω 加与格在此处“怎样对待”的惯用含义。上下文明确所指为彼得和约翰，故译“两个人”。
- source_word: ὅτι μὲν γὰρ
  choice: 因为
  rationale: 在汉语中以“因为”自然表达解释理由的功能；原文的强调意味由整句断定语气体现，避免生硬叠加“的确”。
- source_word: γνωστὸν σημεῖον
  choice: 一个众所周知的神迹
  rationale: γνωστόν 在此指公开知晓、无法否认；“众所周知”与后面的“所有住在耶路撒冷的人都清楚”相呼应。σημεῖον 译作“神迹”，在使徒行传的语境中既指超常事件，也保留其作为指向性记号的常用圣经语义。
- source_word: γέγονεν δι’ αὐτῶν
  choice: 他们行了
  rationale: 完成时表示已经发生且结果仍然明显；διά 加属格表示借着他们发生。汉语“他们行了”简洁自然，但不必然断言能力独立源于他们。
- source_word: πᾶσιν τοῖς κατοικοῦσιν Ἰερουσαλὴμ φανερόν
  choice: 这是所有住在耶路撒冷的人都清楚的
  rationale: 准确表达该事向耶路撒冷全体居民公开显明；“清楚”符合现代汉语口吻。
- source_word: οὐ δυνάμεθα ἀρνεῖσθαι
  choice: 我们也无法否认
  rationale: 忠实表达能力上的否定；汉语可承接前文而不另补宾语。
theological_decisions:
- issue: σημεῖον 在公开医治事件中的含义
  choice: 神迹
  alternative: 记号；奇事
  rationale: “神迹”在现代中文圣经语境中能自然指称具有超常性质并指向神作为的事件。它比单独的“记号”更符合本段议会承认医治事实的语境，同时仍未具体解释其神学所指。
- issue: δι’ αὐτῶν 所表达的施事关系
  choice: 他们行了
  alternative: 借着他们发生了
  rationale: 选择自然简明的现代汉语表述；上下文已将使徒视为神施行医治的媒介，此译法不对能力来源作额外教义断定。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“处置”体现议会在商议如何对付彼得和约翰；整体保留其一方面敌对、另一方面无法否认公开神迹的张力。
