  text: οὐδὲ γὰρ ἐνδεής τις ⸀ἦν ἐν αὐτοῖς· ὅσοι γὰρ κτήτορες χωρίων ἢ οἰκιῶν ὑπῆρχον, πωλοῦντες ἔφερον τὰς τιμὰς τῶν πιπρασκομένων
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/034.yaml
  text: For there was not even any needy person among them[a], for as many as were owners of fields or houses were selling them and bringing the proceeds of what was sold.
translation:
  language: zh_hans
  text: 因为他们中间连一个缺乏的人也没有；凡拥有田地或房屋的，都把田地或房屋卖掉，并将所卖之物的价款[a]带来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“所卖之物的价钱”。这里指售卖所得的款项。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ γὰρ
  choice: 因为……连……也没有
  rationale: 用“因为”保留γάρ承接上文的解释作用，并以“连……也没有”表达οὐδέ的强调。
- source_word: ἐνδεής
  choice: 缺乏的人
  rationale: 表达处于缺少、需要帮助状态的人，不把词义过度收窄为固定社会身份意义上的“穷人”。
- source_word: τις ἦν ἐν αὐτοῖς
  choice: 他们中间……一个……人也没有
  rationale: 采用自然的现代汉语存在句，同时保留“在他们中间”的群体范围。
- source_word: ὅσοι
  choice: 凡……的，都
  rationale: 准确表达该关系代词涵盖所述类别中每一人的分配性语气。
- source_word: κτήτορες χωρίων ἢ οἰκιῶν
  choice: 拥有田地或房屋的
  rationale: “拥有”自然表达所有关系；“田地或房屋”具体保留两类产业。
- source_word: πωλοῦντες
  choice: 把产业卖掉
  rationale: 承接前述田地或房屋，以“产业”避免笨拙重复；与主句连用，保留持续或反复发生的行动场景。
- source_word: ἔφερον
  choice: 拿来
  rationale: 在共同体奉献的叙事语境中自然传达“带来”；具体拿到何处由下一节说明，本节不提前补入。
- source_word: τὰς τιμὰς τῶν πιπρασκομένων
  choice: 卖得的款项
  rationale: τιμή字面可指“价钱”，此处复数结合出售行为，指售卖所得的钱；“卖得的款项”在现代汉语中清楚自然。
theological_decisions:
- issue: 出售产业的范围与性质
  choice: “凡拥有田地或房屋的，都把产业卖掉”按原文描述该群体中的做法，不补入强制、一次性出售全部财产等含义。
  alternative: 译成“人人都卖掉自己所有的一切”。
  rationale: 原文ὅσοι限定于拥有田地或房屋的人，且未出现“全部”或强制命令；应保留叙事陈述的范围，不作神学扩张。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“连一个……也没有”保留强调，“凡……的，都……”清楚呈现原文结构；分号区分结果陈述与其解释。脚注标记紧接其所解释的“款项”。
