    rationale: 现代汉语“一心一意”通常强调专心或专注于一事，不是主要表达群体内在生命与意志的合一。
  - severity: low
    issue: 首句句号削弱原文的连贯对比
    rationale: 原文以καί连接合一、无人称财物为己有与一切共有；中文用分号可更好保留叙述关系。
  - severity: low
