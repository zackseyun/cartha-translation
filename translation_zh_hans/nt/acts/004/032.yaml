  text: Τοῦ δὲ πλήθους τῶν πιστευσάντων ἦν ⸀καρδία καὶ ⸀ψυχὴ μία, καὶ οὐδὲ εἷς τι τῶν ὑπαρχόντων ⸀αὐτῷ ἔλεγεν ἴδιον εἶναι, ἀλλ’ ἦν αὐτοῖς ⸀πάντα κοινά.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/032.yaml
  text: The multitude of those who had believed were of one heart and soul[a], and not even one of them said that anything belonging to him was his own[b], but all things were held in common among them.
translation:
  language: zh_hans
  text: 众多已经信的人同心合意[a]；没有一个人说，他所拥有的任何东西是他自己的[b]，反而一切都是他们共有的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“一颗心、一个心灵”，表示众人在内心和志向上合一。
    reason: 保留原文习语的具体意象。
  - marker: b
    text: 原文采用单数“他”，逐一指群体中的每个人。
    reason: 说明希腊文分配性单数的表达方式。
lexical_decisions:
- source_word: πλῆθος τῶν πιστευσάντων
  choice: 信了的众人
  rationale: πλῆθος表示人数众多的群体；“众人”在现代汉语中自然地保留其群体和数量意味。分词πιστευσάντων译作“信了的”，保留其动词性质及此前已经相信的含义。
- source_word: καρδία καὶ ψυχὴ μία
  choice: 一心一意
  rationale: 原文直译为“一颗心、一个魂”，是表达内在生命与志向高度一致的习语。“一心一意”在现代汉语中自然、庄重，并由脚注保留原文意象。
- source_word: οὐδὲ εἷς
  choice: 没有一个人
  rationale: 保留οὐδὲ εἷς的强调意味，说明群体中无一例外。
- source_word: τι τῶν ὑπαρχόντων αὐτῷ
  choice: 他拥有的任何东西
  rationale: ὑπάρχοντα在此指属于某人的财物或所有物；此译法既涵盖财产，又不把范围不必要地限于某类物品。
- source_word: ἴδιον εἶναι
  choice: 是他私有的
  rationale: ἴδιον指归个人自己所有，与后文的“共有”形成明确对照；“私有的”保留所有权层面的张力，却不加入特定政治制度的含义。
- source_word: πάντα κοινά
  choice: 一切都是大家共有的
  rationale: 保留原文系词结构和κοινά的共同、共有含义；没有改写为更具行动色彩的“把一切都分给大家”。
theological_decisions:
- issue: 耶路撒冷信徒群体中的财物共有
  choice: 按叙事本身描述信徒不把个人财物视为仅供自己私有，并且一切为群体共有。
  alternative: 译成“他们共同拥有一切”，或弱化为仅仅乐意偶尔分享。
  rationale: 原文一方面否定任何人把所有物称为私有，另一方面肯定“一切共有”。译文保留两者的张力，不把经文套入后世某种政治、经济或宗派制度，也不削弱其共同生活的实际程度。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“一心一意”避免生硬直译，同时以脚注保存“心”和“魂”的原文意象；“私有”与“共有”形成清楚对照，但不引入后世制度性术语。
