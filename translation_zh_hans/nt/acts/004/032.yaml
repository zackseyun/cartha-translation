revisions:
- from: 信了的众人都一心一意[a]。没有一个人说，他拥有的任何东西是他私有的[b]；相反，一切都是大家共有的。
  to: 众多已经信的人同心合意[a]；没有一个人说，他所拥有的任何东西是他自己的[b]，反而一切都是他们共有的。
  rationale: 修订以“众多已经信的人”自然表达πλῆθος τῶν πιστευσάντων，并以“同心合意”准确表达群体在心与心灵（ψυχή）的合一。后半句保留原文强调的“没有一个人”、分配性单数和“共有”，同时避免将该叙述套入任何后世政治、经济或宗派制度。
