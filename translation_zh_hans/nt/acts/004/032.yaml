  naturalness: “信了的众人”可懂但略显生硬；“众多已经信的人”和“同心合意”更合现代汉语的庄重叙事语体。“他拥有的任何东西是他私有的”不够顺畅，改为“他所拥有的任何东西是他自己的”更自然。
  terminology: 以“同心合意”表达“心和魂/心灵为一”的整体合一，脚注保留原文意象。以“是他自己的”对应ἴδιον，避免“私有”可能带入后世制度性联想；“共有”保留κοινά的财物共同性。
