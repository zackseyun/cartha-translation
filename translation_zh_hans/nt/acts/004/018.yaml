  text: καὶ καλέσαντες αὐτοὺς παρήγγειλαν ⸀τὸ καθόλου μὴ φθέγγεσθαι μηδὲ διδάσκειν ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/018.yaml
  text: And after calling them in[a], they ordered them not to speak at all nor teach in the name of Jesus.
translation:
  language: zh_hans
  text: 他们把二人叫来，命令他们绝不可奉耶稣的名说话，也不可教导人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“命令他们绝不可说任何话，也不可奉耶稣的名教导人。”
    reason: 希腊语中“奉耶稣的名”这一短语可理解为统摄“说话”和“教导人”，也可按其位置主要与“教导人”相连；此译法保留后一种可能的句法范围。
lexical_decisions:
- source_word: καλέσαντες αὐτούς
  choice: 他们把二人叫来
  rationale: 不定过去时分词在此表示先于主要动词发生的动作；结合庭审语境，“叫来”自然传达召回或传入的意思。“二人”依据上文明确所指，使中文表达自然。
- source_word: παρήγγειλαν
  choice: 命令
  rationale: 该动词表示具有权威性的明确指令；“命令”准确保留其强制语气。
- source_word: τὸ καθόλου μὴ φθέγγεσθαι
  choice: 绝不可……发言
  rationale: καθόλου强化禁令的全面性；“绝不可”在现代中文中自然而有力。φθέγγομαι表示出声说话或发言，此处译为“发言”符合公开听证与宣讲的语境，同时不把含义限定为某一种宣讲形式。
- source_word: μηδὲ διδάσκειν
  choice: 也不可教导人
  rationale: μηδέ连接第二项受禁行为；补出中文宾语“人”，使表达自然，但不增添特定对象。
- source_word: ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ
  choice: 奉耶稣的名
  rationale: 该短语可表示以耶稣之名为依据、凭其权柄或与其名相关；“奉耶稣的名”是简洁自然的中文对应，并保留名称与权柄之间的关联。
theological_decisions:
- issue: 禁令涵盖的范围
  choice: 正文把“奉耶稣的名”理解为同时关联“发言”和“教导人”，呈现禁止一切奉耶稣之名发言和教导的全面命令。
  alternative: 按希腊语词序，也可理解为绝不可说任何话，并且不可奉耶稣的名教导人。
  rationale: τὸ καθόλου强化禁令，而句末介词短语在句法上最自然地可统摄两个并列不定式；不过其紧邻第二个动词，也留下另一种范围理解，因此用脚注保留。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“绝不可”传达禁令的强烈程度；“发言”与“教导人”保持两个受禁行动的区分。正文脚注标记与脚注完全对应。
