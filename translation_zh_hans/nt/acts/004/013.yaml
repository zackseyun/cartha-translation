  to: 他们见彼得和约翰放胆说话，又看出他们是没有受过正规训练的普通人[a]，便感到惊奇；又认出他们是曾与耶稣在一起的人。
  rationale: 修订限定“正规训练”的历史语境，改善“认出”的汉语句法，并保留原文对彼得和约翰大胆言说、身份反差及他们曾与耶稣同在的完整信息。
