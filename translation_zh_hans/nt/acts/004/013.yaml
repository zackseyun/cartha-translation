  naturalness: 原句可懂，但“他们也认出，这两个人……”在现代汉语中略显断裂，“认出”最好直接带出所认出的身份或关系。将并列分词关系整理为“见……又看出……便……；又认出……”更流畅，且不改变原文的叙事推进。
  terminology: 彼得、约翰、耶稣等名称规范。“没有受过正规训练的普通人”比“没有受过正规学术训练，只是普通人”更自然，也避免把ἀγράμματοι狭隘或现代化为泛指的“学术”教育。脚注保留“并不一定表示不识字”的必要澄清，同时将“官方身份”调整为较贴近ἰδιῶται的“专业或公职身份”。
