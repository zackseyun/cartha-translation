  text: Θεωροῦντες δὲ τὴν τοῦ Πέτρου παρρησίαν καὶ Ἰωάννου καὶ καταλαβόμενοι ὅτι ἄνθρωποι ἀγράμματοί εἰσιν καὶ ἰδιῶται, ἐθαύμαζον, ἐπεγίνωσκόν τε αὐτοὺς ὅτι σὺν τῷ Ἰησοῦ ἦσαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/013.yaml
  text: As they observed the boldness of Peter and John[a], and realized that they were uneducated and ordinary men, they were astonished, and they recognized that they had been with Jesus.
translation:
  language: zh_hans
  text: 他们见彼得和约翰放胆说话，又看出他们是没有受过正规训练的普通人[a]，便感到惊奇；又认出他们是曾与耶稣在一起的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“没有受过经学训练的平民”。原文指他们未受正规的经学或文士训练，也不具专业或公职身份；并不一定表示他们不识字。
    reason: 说明ἀγράμματοι和ἰδιῶται在当时的教育与社会语境中的含义，避免误解为二人必定不识字或缺乏一般能力。
lexical_decisions:
- source_word: Θεωροῦντες
  choice: 看到
  rationale: 此词表示带着注意和判断的观察；结合下文“知道”，译作自然的“看到”即可体现领袖们观察后的反应。
- source_word: παρρησίαν
  choice: 放胆发言
  rationale: 在《使徒行传》的语境中，此词兼有公开直言和勇敢无惧之意；“放胆发言”比单说“胆量”更明确地呈现言说语境。
- source_word: καταλαβόμενοι
  choice: 知道
  rationale: 该分词表示他们经过观察而领会到彼得和约翰的处境；“知道”在现代汉语中简洁自然，不额外强化推断过程。
- source_word: ἀγράμματοι
  choice: 没有受过正规学术训练
  rationale: 这里主要不是断言二人不识字，而是说他们没有接受经学、文士一类的正规训练；此译避免现代读者误解为文盲。
- source_word: ἰδιῶται
  choice: 普通人
  rationale: 此词在这里强调二人没有专家、专业人士或官员的身份；“普通人”保留其非精英、非专业的社会定位，同时避免“无知”等贬义。
- source_word: ἐθαύμαζον
  choice: 很惊讶
  rationale: 未完成时描写他们持续的惊异反应；“很惊讶”符合现代汉语叙事表达。
- source_word: ἐπεγίνωσκον
  choice: 认出
  rationale: 此动词表示辨认或确认；“认出”保留他们从彼得和约翰的表现及身份中作出识别的意味。
- source_word: σὺν τῷ Ἰησοῦ ἦσαν
  choice: 曾跟耶稣在一起
  rationale: 这是对二人先前与耶稣相处、相随这一关系的回顾；“曾”清楚表达相对于当时场景的先前经历。
- source_word: δὲ ... τε
  choice: 又……也
  rationale: 这些小词主要连接观察、惊讶和认出的叙事步骤，不必添加原文没有的强转折或显著时间标记。
theological_decisions:
- issue: 彼得和约翰的社会与教育身份
  choice: 译为“没有受过正规学术训练，只是普通人”
  alternative: “没有学问的平民”或“不识字、没有学识的人”
  rationale: 原文所强调的是他们没有正规的经学或文士训练，也不具专业、官方身份，并非判定他们缺乏智力、完全不识字或在道德上无知。此译保留公议会眼中的身份反差，而不加入贬义判断。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“放胆发言”明确体现παρρησία的公开言说性质；分号区分领袖们的惊讶与随后对二人先前跟随耶稣这一事实的确认。脚注标记紧随其所解释的身份描述。
