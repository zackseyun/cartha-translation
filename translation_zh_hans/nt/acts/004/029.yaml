  text: καὶ τὰ νῦν, κύριε, ἔπιδε ἐπὶ τὰς ἀπειλὰς αὐτῶν καὶ δὸς τοῖς δούλοις σου μετὰ παρρησίας πάσης λαλεῖν τὸν λόγον σου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/029.yaml
  text: And now[a], Lord, look upon their threats and grant your servants to speak your word with all boldness,
translation:
  language: zh_hans
  text: 如今，主啊，求你留意他们的威吓，赐你的仆人[a]能以十足的胆量讲说你的话语。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“奴仆”或“奴隶”。希腊语δοῦλος可指属于主人的人；这里按祷告中谦卑服事上帝的语境译作“仆人”。
    reason: 说明δοῦλος的词义范围及正文取舍。
lexical_decisions:
- source_word: καὶ τὰ νῦν
  choice: 现在
  rationale: 这是祷告中的话语转折，表示“如今”或“就当前情势而言”；译作“现在”自然地从前文转入当下的祈求。连接词 καί 在汉语中无需机械译出。
- source_word: κύριε
  choice: 主啊
  rationale: 这是祷告中对上帝的直接称呼；“主啊”既符合新约惯用译法，也保留呼格语气。
- source_word: ἔπιδε ἐπὶ
  choice: 求你留意
  rationale: 该表达请求上帝看顾、注意眼前之事。“留意”准确传达其关注之意；加“求你”使希腊语命令式在汉语祷告语境中自然且庄重。
- source_word: τὰς ἀπειλὰς αὐτῶν
  choice: 他们的威吓
  rationale: ἀπειλή 指以伤害相逼的威胁；“威吓”在此既清楚又保留对方恐吓使徒的行为色彩。
- source_word: δὸς
  choice: 赐
  rationale: 字面义为“给”，但此处所求的是上帝赐予说话的勇气与能力；“赐”符合现代汉语祷告用语。
- source_word: τοῖς δούλοις σου
  choice: 你的仆人
  rationale: δοῦλος 可指奴隶，也可在与上帝的关系中表达归属、顺服和服事。“仆人”在本祷告语境中自然，同时以脚注说明该词更强的身份含义。
- source_word: μετὰ παρρησίας πάσης
  choice: 满有胆量地
  rationale: παρρησία 在此指公开、无惧地说话，πάσης 加强程度。“满有胆量地”保留其充分、毫不畏缩的意味。
- source_word: λαλεῖν
  choice: 讲说
  rationale: 该不定式说明所求恩赐的目的或内容，即开口说出信息。“讲说”保留普通的说话含义，不额外强化为“宣告”。
- source_word: τὸν λόγον σου
  choice: 你的话语
  rationale: λόγος 在《使徒行传》中常指来自上帝、被传讲的信息。“话语”保留原文的圣经表达及其神学内涵，又不将其范围过早限定为某一术语。
theological_decisions:
- issue: 如何翻译指上帝之人的 δοῦλος
  choice: 你的仆人
  alternative: 你的奴仆／你的奴隶
  rationale: 原词含有属于主人并受其支配的身份意味，但本节祷告首先突出对上帝谦卑顺服、为他服事的姿态。正文用“仆人”较自然，脚注则保留“奴仆／奴隶”的可能性，避免削弱原词的归属意味。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“求你……并赐……”使两个希腊语命令式在汉语中衔接自然；整体保留原句由关注威吓转向求赐胆量的结构。
