  text: ἀλλ’ ἵνα μὴ ἐπὶ πλεῖον διανεμηθῇ εἰς τὸν λαόν, ⸀ἀπειλησώμεθα αὐτοῖς μηκέτι λαλεῖν ἐπὶ τῷ ὀνόματι τούτῳ μηδενὶ ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/017.yaml
  text: But so that it may not spread any further among the people, let us warn them not to speak any longer to anyone in this name.
translation:
  language: zh_hans
  text: 不过，为了不让这事在民众中进一步传开，我们就威吓[a]他们，叫他们不可再奉这名向任何人讲论。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“威胁他们”。希腊文这个动词指带有恐吓意味的威胁，尤其可指当权者施加威势。
    reason: lexical_alternative
lexical_decisions:
- source_word: διανεμηθῇ
  choice: 传开
  rationale: 该词本义涉及分布、扩散；此处隐含的主语是使徒所传的信息或相关消息，译作“传开”自然地表达其传播之意，同时不把隐含内容明说出来。
- source_word: ἐπὶ πλεῖον
  choice: 进一步
  rationale: 保留这一短语表示从当前程度继续扩展的比较含义；“进一步”符合现代汉语表达。
- source_word: λαός
  choice: 民众
  rationale: 此处指一般百姓，尤其是当时的犹太公众；“民众”既宽泛又适合议会场景的正式语体。
- source_word: ἀπειλησώμεθα
  choice: 警告
  rationale: 该动词基本义带有“威吓、威胁”的强制色彩，但在“不许……”这一官府禁令结构中，“警告”更符合自然汉语；其较强语气以脚注保留。
- source_word: μηκέτι λαλεῖν
  choice: 不许再……讲论
  rationale: “再”保留 μηκέτι 从此以后不再做某事的时间意味；“不许”配合议会作出禁令的语境，清楚表达禁止。
- source_word: ἐπὶ τῷ ὀνόματι τούτῳ
  choice: 奉这个名
  rationale: “奉……名”在中文圣经语境中自然表达凭借、关联或代表某名所具有的权柄；保留“这个名”这一刻意避称耶稣的措辞。
- source_word: μηδενὶ ἀνθρώπων
  choice: 向任何人
  rationale: 该与格表示讲话的对象；在否定禁令中，“向任何人”准确、自然，也保留泛指而不带性别限定。
theological_decisions:
- issue: ἀπειλησώμεθα 所表达的议会强制语气
  choice: 正文译作“警告”，脚注说明也可译作“威吓”或“威胁”
  alternative: 正文直接译作“威胁”或“威吓”
  rationale: 司法权威实施恐吓的意味不可抹去，但现代汉语“威胁他们不许……”略显生硬；正文采用流畅的“警告”，并以脚注保存原词较强的威慑意味，避免把它弱化为普通劝告。
- issue: ἐπὶ τῷ ὀνόματι τούτῳ 的权柄与关联含义
  choice: 译作“奉这个名”
  alternative: 译作“关于这个名”或“凭这个名”
  rationale: 介词结构可表达以该名为根据、与该名相联而讲话；“奉这个名”保留权柄和代表性的可能含义，却不在正文中将其进一步解释为某一种神学命题。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“这事”承接上下文，却不把希腊文省略的主语过度具体化；“奉这个名”保留原文对耶稣之名的间接指称及其语义张力。
