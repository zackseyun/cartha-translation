  yaml_path: translation/nt/acts/004/003.yaml
  text: And they laid hands on them and put them in custody until the next day[b][a], for it was already evening.
translation:
  language: zh_hans
  text: 他们就下手拿住二人[a]，把他们拘押起来[b]，直到第二天，因为那时已经是晚上了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“抓住他们”。希腊语习语直译为“把手加在他们身上”，这里指带敌意地强行拿住。
    reason: lexical_alternative
  - marker: b
    text: 或译“把他们关起来”或“将他们置于看守之下”。希腊语表示将人置于监管之下，并未说明具体关押在什么设施中。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέβαλον αὐτοῖς τὰς χεῖρας
  choice: 动手抓住二人
  rationale: 这个希腊习语直译为“把手加在他们身上”，在本段敌对且带有司法性质的语境中表示强行拿住。“动手抓住”既保留身体行动的色彩，又符合现代汉语表达；“逮捕”虽能传达结果，却会弱化原文的习语形象。
- source_word: αὐτοῖς
  choice: 二人
  rationale: 复数代词在上下文中指彼得和约翰。汉语用“二人”可明确所指，也避免连续使用多个“他们”造成歧义。
- source_word: ἔθεντο εἰς τήρησιν
  choice: 把他们拘押起来
  rationale: τήρησις表示看守、监管或拘禁，但没有说明具体关押设施。“拘押起来”清楚表达官方扣留，同时不擅自具体化为监牢。
- source_word: εἰς τὴν αὔριον
  choice: 直到第二天
  rationale: 该短语表示拘押延续至次日。“直到第二天”符合现代汉语叙事，也准确保留时间界限。
- source_word: ἦν γὰρ ἑσπέρα ἤδη
  choice: 因为那时已经是晚上了
  rationale: γάρ引出延后处理的原因，ἑσπέρα明确指晚上。“那时已经是晚上了”自然、清楚，不把原文解释得更宽泛或更具体。
