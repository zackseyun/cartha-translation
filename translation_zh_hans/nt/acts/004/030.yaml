revisions:
- from: 你伸出手来施行医治，使神迹奇事借着你圣仆耶稣的名成就。[a]
  to: 当你伸出手来施行医治，又借着你圣仆耶稣[a]的名使神迹奇事发生时。
  rationale: 修订保留 ἐν τῷ + 不定式结构的时间／伴随意义，并使“伸手医治”与“神迹奇事发生”在汉语中保持并列。保留“圣仆”作为正文的最佳语境译法，同时以不预设 υἱός（子）含义的脚注替代译文保留 païs 的词义歧义。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T03:29:33Z'
review_pass:
  verdict: revise
  source_fidelity: 正文将 ἐν τῷ + 不定式所表达的同时情形处理为“你……使……”，容易读成“伸手医治”是“使神迹奇事成就”的直接因果关系，未充分保留原文两个并列不定式所描写的情形。修订以“当……又……时”明确保留其时间／伴随关系。
  naturalness: 修订后的句子仍可作为第29节祷告的延续；“发生”是现代汉语中对 γίνεσθαι 的自然、非过度施事化表达。“神迹奇事”及“借着……的名”保留庄重且通行的经文语体。
  terminology: “圣仆”可恰当传达 παῖς 在本处与《以赛亚书》仆人主题的呼应。脚注中的“圣子”不宜作为词汇替代项，因为“子”在汉语神学用语中通常对应 υἱός，并会消除 παῖς 的“孩子／仆人”歧义；改为“圣洁的孩子”。脚注锚点移至“圣仆耶稣”后，以准确标示歧义所在。
  issues:
  - severity: medium
    issue: 并列结构被改写为直接因果关系
    rationale: 原文 ἐν τῷ τὴν χεῖρά σου ἐκτείνειν … καὶ σημεῖα καὶ τέρατα γίνεσθαι 描述伸手医治与神迹奇事发生的同时情形。草稿“你伸出手来施行医治，使神迹奇事……成就”可理解为前项导致后项。
  - severity: medium
    issue: 脚注替代译文“圣子”过度神学化
    rationale: παῖς 的另一基本词义是“孩子／儿女”，不是通常对应 υἱός 的“子”。使用“圣子”会引入汉语既定的基督论术语，未能中性保留原词歧义。
  - severity: low
    issue: 脚注标记位置与说明对象不一致
    rationale: 脚注说明的是“圣仆”的词义选择，标记应紧随“圣仆耶稣”，不应置于全句末。
