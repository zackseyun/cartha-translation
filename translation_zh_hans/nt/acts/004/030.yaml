  text: ἐν τῷ τὴν χεῖρά ⸀σου ἐκτείνειν σε εἰς ἴασιν καὶ σημεῖα καὶ τέρατα γίνεσθαι διὰ τοῦ ὀνόματος τοῦ ἁγίου παιδός σου Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/030.yaml
  text: while you stretch out your hand for healing[a], and signs and wonders are done through the name of your holy servant Jesus.
translation:
  language: zh_hans
  text: 当你伸出手来施行医治，又借着你圣仆耶稣[a]的名使神迹奇事发生时。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣仆”也可译为“圣洁的孩子”。希腊语 païs 可指“仆人”或“孩子”；这里采用“仆人”，因为《使徒行传》的表述呼应《以赛亚书》中“仆人”的语言。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τῷ ... ἐκτείνειν
  choice: 你伸出……来
  rationale: ἐν τῷ 加不定式在此表达与前文祈求同时发生的情形；汉语用连动结构自然承接第29节，又不必生硬加入“当……时”。
- source_word: τὴν χεῖρά σου
  choice: 你的手
  rationale: 保留圣经中“伸手”表示上帝行动与能力的意象，不作解释性扩展。
- source_word: εἰς ἴασιν
  choice: 施行医治
  rationale: 表达 εἰς 的目的指向和 ἴασις 的“医治”含义；“施行医治”符合庄重而自然的现代汉语。
- source_word: σημεῖα καὶ τέρατα
  choice: 神迹奇事
  rationale: 这是《使徒行传》中常见的固定组合；译法简洁自然，也保留两项并列的表达。
- source_word: γίνεσθαι
  choice: 成就
  rationale: γίνομαι 表示这些事发生、实现；“成就”在祷告语境中自然，并避免将其明确改写为某人主动“行”神迹。
- source_word: διὰ τοῦ ὀνόματος
  choice: 借着……的名
  rationale: 准确表达 διά 加属格的媒介或途径意义，同时保留“名”所承载的圣经性权柄意涵而不加以明说。
- source_word: τοῦ ἁγίου παιδός σου Ἰησοῦ
  choice: 你圣仆耶稣
  rationale: παῖς 可指孩子或仆人；本段及《使徒行传》相关经文呼应以赛亚书的仆人主题，因此正文采用“圣仆”，同时以脚注保留“圣子”的词义可能。
theological_decisions:
- issue: 如何翻译用于耶稣的 παῖς
  choice: 圣仆
  alternative: 圣子
  rationale: παῖς 本身兼有“仆人”和“孩子”两种可能；《使徒行传》3:13、3:26和本节与以赛亚书“仆人”语言的呼应使“圣仆”更合语境，但词汇歧义应由脚注明示，不以正文排除另一可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你伸出手来……使……”使本节作为第29节祷告的延续保持顺畅；“神迹奇事”和“借着……的名”保留《使徒行传》的典型圣经措辞。脚注标记置于存在词义歧义的“圣仆”之后。
