  text: οὗτός ἐστιν ὁ λίθος ὁ ἐξουθενηθεὶς ὑφ’ ὑμῶν τῶν ⸀οἰκοδόμων, ὁ γενόμενος εἰς κεφαλὴν γωνίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/011.yaml
  text: This is the stone that was rejected by you[a], the builders, which has become the cornerstone.
translation:
  language: zh_hans
  text: 他就是那块被你们这些建造的人所弃绝的石头，却成了房角的首石。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“房角石”或“顶石”；直译为“角的头”。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός
  choice: 他就是
  rationale: 指示代词在近文中着重指向耶稣；中文用“他就是”既自然，也保留直接认定的语气。
- source_word: λίθος
  choice: 石头
  rationale: 保留诗篇118:22的建筑比喻；“磐石”会超出此处通常的词义。
- source_word: ἐξουθενηθεὶς
  choice: 所轻视弃绝的
  rationale: 该词含有视为无足轻重、鄙弃之意；“轻视弃绝”兼顾对待态度和在建筑比喻中的实际结果。
- source_word: ὑφ’ ὑμῶν τῶν οἰκοδόμων
  choice: 你们这些建造者所
  rationale: 明确保留复数第二人称的直接指责，并让“你们”与“建造者”保持同位关系。
- source_word: γενόμενος
  choice: 却成了
  rationale: “成了”表达身份或地位的转变；“却”呈现被弃绝与获尊荣之间原文隐含的强烈反差。
- source_word: κεφαλὴν γωνίας
  choice: 房角的首石
  rationale: 较贴近“角的头”这一原文意象，同时在现代中文中仍可理解为房角处居首要地位的石头，避免把有争议的具体建筑位置完全定死。
theological_decisions:
- issue: 诗篇118:22引文中 κεφαλὴ γωνίας 的建筑意象
  choice: 房角的首石
  alternative: 房角石；顶石；直译“角的头”
  rationale: 原短语所指的具体建筑构件存在争议。“房角的首石”保留其居首、受尊崇的意义及房角意象，但不武断认定为地基角石或顶部压顶石；其他可能译法列入脚注。
translation_notes:
  register: 采用现代、庄重且口语可懂的表达。“你们这些建造者”保留彼得当面对听众的指责；“轻视弃绝”传达动词兼有鄙视和拒用的语义。脚注标记已置于正文相关短语之后。
