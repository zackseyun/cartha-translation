  text: ὁ ⸂τοῦ πατρὸς ἡμῶν⸃ διὰ ⸂πνεύματος ἁγίου⸃ στόματος Δαυὶδ παιδός σου εἰπών· Ἱνατί ἐφρύαξαν ἔθνη καὶ λαοὶ ἐμελέτησαν κενά;
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/025.yaml
  text: 'who[a], through the Holy Spirit, by the mouth of David your servant, said: ‘Why did the nations rage[b], and the peoples devise vain things?’'
translation:
  language: zh_hans
  text: '他[a]借着圣灵，藉你仆人大卫的口说：

    “列国为什么狂怒[b]？

    万民为什么图谋虚妄之事？”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“我们的祖先大卫，你的仆人”，使这段导语成为：“他借着圣灵，藉我们祖先、你仆人大卫的口说。”
    reason: textual_variant
  - marker: b
    text: “图谋”也可译作“思想”或“默想”。希腊语动词可指反复思想；在这里也可指谋划、图谋。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ⸂τοῦ πατρὸς ἡμῶν⸃
  choice: 他[a]
  rationale: 以代词承接第24节所称的神，使中文引文导语自然连贯；有文本争议的“我们的祖先”不强行纳入正文，而在脚注中保留。
- source_word: διὰ πνεύματος ἁγίου
  choice: 借着圣灵
  rationale: διά加属格表示媒介或施事；“借着圣灵”既保留工具性含义，也明确提到圣灵。
- source_word: στόματος Δαυὶδ
  choice: 藉你仆人大卫的口
  rationale: 保留圣经中“藉……的口”这一先知性传话表达，同时按自然中文把“你仆人”与“大卫”组合。
- source_word: παιδός σου
  choice: 你仆人
  rationale: παῖς可指孩子或仆人；此处称大卫，结合旧约中“大卫是神的仆人”的用法，译作“仆人”最合语境。
- source_word: εἰπών
  choice: 说
  rationale: 该不定过去时分词用于引出引文，中文自然译为限定动词“说”。
- source_word: Ἱνατί
  choice: 为什么
  rationale: 直接保留引文中的疑问语气。
- source_word: ἐφρύαξαν
  choice: 狂怒
  rationale: 该词描写喧腾、暴烈而反抗的骚动；“狂怒”简洁传达其激烈和敌对色彩。
- source_word: ἔθνη
  choice: 列国
  rationale: 此处为诗篇引文，泛指敌对的众国，并非专指社会宗教意义上的外邦人；“列国”也符合庄重的诗体。
- source_word: λαοὶ
  choice: 万民
  rationale: 保留复数群体概念，并与“列国”形成自然的诗歌平行句。
- source_word: ἐμελέτησαν
  choice: 图谋
  rationale: 该词本可指默想、思量；在敌对行动的语境中表示盘算、策划，故译“图谋”，并以脚注保留另一词义。
- source_word: κενά
  choice: 虚妄之事
  rationale: κενά表示空洞、徒然、不能成就目的的事；“虚妄之事”兼顾形式对应与诗篇引文的庄重语体。
theological_decisions:
- issue: 引文导语中τοῦ πατρὸς ἡμῶν的文本形式
  choice: 正文以“他”承接第24节的神，不纳入“我们的祖先”一语。
  alternative: 按部分抄本译作“他借着圣灵，藉我们祖先、你仆人大卫的口说”。
  rationale: 该短语在抄本传统中有争议，在SBLGNT所呈现的位置也形成困难结构。正文保留清楚的主语承接，脚注则完整说明异文，避免把有争议的细节定为唯一读法。
- issue: 圣灵与大卫在诗篇话语中的作用
  choice: 译作神“借着圣灵，藉你仆人大卫的口说”。
  alternative: 简化为“神借大卫说”。
  rationale: 正文保留原文所呈现的双重媒介表达：圣灵是神说话的媒介，大卫的口是话语发出的途径；不进一步构建原文未明说的灵感理论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“列国／万民”保留诗篇引文的平行结构；“借着／藉……的口”避免连续重复而不改变含义。正文与两个脚注标记[a]、[b]完全对应。
