  terminology: “圣灵”“仆人”“列国”“万民”符合现代标准汉语圣经语域；“虚妄之事”适合κενά及诗篇引语。脚注中将ἐμελέτησαν的较中性义项表述为“思量”或“反复思想”较“思想”更明确。
