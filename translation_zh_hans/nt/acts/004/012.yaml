  text: καὶ οὐκ ἔστιν ἐν ἄλλῳ οὐδενὶ ἡ σωτηρία, ⸀οὐδὲ γὰρ ὄνομά ἐστιν ἕτερον ⸂ὑπὸ τὸν οὐρανὸν⸃ τὸ δεδομένον ἐν ἀνθρώποις ἐν ᾧ δεῖ σωθῆναι ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/012.yaml
  text: And there is salvation in no one else[a], for there is no other name under heaven given among men by which we must be saved.
translation:
  language: zh_hans
  text: 除他以外，别无救恩；因为在天下人间，没有赐下别的名，我们必须靠着这名得救。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在这名里”。
    reason: 保留ἐν ᾧ较形式对应的译法；该短语也可理解为“靠着这名”，表示得救的凭借。
lexical_decisions:
- source_word: σωτηρία
  choice: 拯救
  rationale: 在彼得关于耶稣的宣告中，此词既指救拔，也承载完整的救恩含义；“拯救”自然、明确，并与后面的“得救”相呼应。
- source_word: ἐν ἄλλῳ οὐδενί
  choice: 除他以外……别无
  rationale: 这一表达明确排除任何其他人。“除他以外，别无拯救”以自然中文保留了原文对救恩唯一归属的强调。
- source_word: ὄνομα
  choice: 名
  rationale: 保留原文的“名”，不改写为“人”或“权柄”，使其关于身份、权柄和启示的丰富含义保持含蓄。
- source_word: ὑπὸ τὸν οὐρανόν
  choice: 天下
  rationale: “天下”是自然庄重的中文表达，准确传达原文“天之下”的普世范围。
- source_word: δεδομένον ἐν ἀνθρώποις
  choice: 赐在人间
  rationale: “在人间”表达ἐν ἀνθρώποις所指的人类范围，避免把ἐν过度限定为“给”，同时自然涵盖所有人。
- source_word: ἐν ᾧ
  choice: 靠着这名
  rationale: 此处关系代词回指“名”；“靠着”自然表达得救的凭借或媒介，而脚注保留较形式对应的译法。
- source_word: δεῖ σωθῆναι ἡμᾶς
  choice: 我们必须……得救
  rationale: “必须”保留δεῖ所表达的必要性；“得救”准确传达被动不定式σωθῆναι。
theological_decisions:
- issue: 救恩与耶稣的唯一关系
  choice: “除他以外，别无拯救”
  alternative: “没有别的得救之道”
  rationale: 原文直接说救恩不在任何别的人里面，并以没有别的名为根据。所选译文保留这种指向人的排他性，不把它抽象化为一般的“道路”。
- issue: “名”与得救方式的关系
  choice: “靠着这名得救”
  alternative: “在这名里得救”
  rationale: “靠着”以自然中文传达ἐν ᾧ可能具有的凭借含义；脚注保留“在……里”的形式对应，以免完全消除原文介词表达的张力。
- issue: ἀνθρώποις的涵盖范围
  choice: “人间”
  alternative: “人类中间”
  rationale: ἀνθρώποις在此泛指人类，而非仅指男性；“人间”以庄重、简洁的现代中文传达这一普遍范围。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“天下”“人间”保留宣告式语气；整体避免生硬照搬希腊语序，同时保留“名”的圣经意象及原文明确的排他性。
