  text: τότε Πέτρος πλησθεὶς πνεύματος ἁγίου εἶπεν πρὸς αὐτούς· Ἄρχοντες τοῦ λαοῦ καὶ ⸀πρεσβύτεροι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/008.yaml
  text: Then Peter, filled with the Holy Spirit, said to them, “Rulers of the people and elders,”
translation:
  language: zh_hans
  text: 那时，彼得被圣灵充满，对他们说：“百姓的官长和长老们：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: 那时
  rationale: 作为时间与叙事推进标记，承接前文并引出彼得的答辩；“那时”自然庄重。
- source_word: Πέτρος
  choice: 彼得
  rationale: 采用现代中文圣经与基督教语境中通行的人名译法。
- source_word: πλησθεὶς πνεύματος ἁγίου
  choice: 被圣灵充满
  rationale: 保留 πλησθεὶς 的被动意义，并以自然中文表达其与属格 πνεύματος ἁγίου 的关系。
- source_word: εἶπεν πρὸς αὐτούς
  choice: 对他们说
  rationale: 直接而自然地呈现希腊文叙事中的说话公式。
- source_word: Ἄρχοντες τοῦ λαοῦ
  choice: 百姓的官长
  rationale: “官长”体现 ἄρχοντες 在本段司法及治理场景中的权威身份；“百姓”直接对应 λαός。
- source_word: πρεσβύτεροι
  choice: 长老们
  rationale: 本处指公认的治理群体，而非泛指年长男子；加“们”使中文呼语自然。
theological_decisions:
- issue: πνεύματος ἁγίου 的所指
  choice: 圣灵
  alternative: 圣洁的灵／圣灵之力
  rationale: 《使徒行传》的上下文将此语指向使见证者得能力并说话的神圣之灵；“圣灵”准确而不额外解释其作用方式。
- issue: πλησθεὶς 的施事者是否明说
  choice: 采用“被圣灵充满”，不另加“神使”
  alternative: 神使彼得被圣灵充满
  rationale: 希腊文保留被动结构而未明说施事者；译文也不补出原文未明言的主语。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。以冒号收束本节未完的正式呼语，使其自然衔接下一节的讲话内容。
