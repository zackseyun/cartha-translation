  text: ὑπάρχοντος αὐτῷ ἀγροῦ πωλήσας ἤνεγκεν τὸ χρῆμα καὶ ἔθηκεν ⸀παρὰ τοὺς πόδας τῶν ἀποστόλων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/037.yaml
  text: Since he owned a field[b][a], he sold it and brought the money and laid it at the apostles’ feet.
translation:
  language: zh_hans
  text: 他有一块田地[a]，卖了以后，就把钱[b]拿来，放在使徒脚前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他拥有一块田地”或“他有一块田地”。原文的属格独立结构交代背景情形。
    reason: lexical_alternative
  - marker: b
    text: 或译：“所得的钱”或“款项”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπάρχοντος αὐτῷ ἀγροῦ
  choice: 他有一块田地
  rationale: 该属格独立结构交代背景情形；ὑπάρχω与间接宾语αὐτῷ在此表示拥有。译为“他有一块田地”既自然，也不把背景关系过度限定为明确的因果。
- source_word: ἀγροῦ
  choice: 一块田地
  rationale: ἀγρός可指田地或一片土地；“一块田地”直接、宽泛，也符合现代汉语量词习惯。
- source_word: πωλήσας
  choice: 卖了以后
  rationale: 不定过去时分词表示该动作先于后面的主要动作；“卖了以后”清楚传达动作次序，宾语可由上文自然补足。
- source_word: ἤνεγκεν
  choice: 拿来
  rationale: φέρω在此指把东西带到使徒那里；“拿来”符合汉语叙事语境。
- source_word: τὸ χρῆμα
  choice: 所得的钱
  rationale: χρῆμα指钱财，在本语境中即出售田地所得。正文用“所得的钱”自然明确，同时脚注保留较直译的“钱”。
- source_word: ἔθηκεν
  choice: 放在
  rationale: τίθημι意为放置；与“脚前”搭配时，“放在”是自然且准确的现代汉语。
- source_word: παρὰ τοὺς πόδας τῶν ἀποστόλων
  choice: 在使徒脚前
  rationale: 保留原文具体的空间意象，不仅描述实际动作，也容许读者体会交由使徒管理的叙事含义，而不把该含义直接写入正文。
theological_decisions:
- issue: 是否保留把钱放在使徒脚前的具体表达
  choice: 保留“放在使徒脚前”
  alternative: 意译为“交给使徒”
  rationale: 原文既呈现具体动作，也可能暗含将财物交由使徒处置；保留原有意象可兼顾两者，并避免加入额外的教会制度解释。
- issue: 属格独立结构是否明确表达因果
  choice: 译作背景陈述“他有一块田地”
  alternative: 译作“因为他有一块田地”
  rationale: 原结构主要提供背景情形，语境可以让人感受到关联，但未必明确标记原因；不强加“因为”可保存其开放性。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“卖了以后，就……”清楚表达先后关系；“使徒脚前”保留原文具象表达。所有脚注标记均已置于正文对应位置。
