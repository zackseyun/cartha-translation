  text: ⸀Ἰωσὴφ δὲ ὁ ἐπικληθεὶς Βαρναβᾶς ἀπὸ τῶν ἀποστόλων, ὅ ἐστιν μεθερμηνευόμενον υἱὸς παρακλήσεως, Λευίτης, Κύπριος τῷ γένει,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/036.yaml
  text: Joseph[a], who was called Barnabas by the apostles—which translated means son of encouragement—a Levite, a native of Cyprus,
translation:
  language: zh_hans
  text: 约瑟——使徒称他为巴拿巴，翻译出来就是“鼓励之子”[a]——是利未人，原籍塞浦路斯。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“劝勉之子”“安慰之子”或“慰藉之子”。原文这个词可指鼓励、劝勉或安慰。
    reason: 保留παράκλησις的语义范围，不将名字释义限定为单一含义。
lexical_decisions:
- source_word: Ἰωσὴφ
  choice: 约瑟
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: δὲ
  choice: 有一位
  rationale: δέ在此是轻微的叙事转接；中文通过引入新人物的句式自然体现，不另加容易显得突兀的“现在”或过强转折词。
- source_word: ἐπικληθεὶς Βαρναβᾶς ἀπὸ τῶν ἀποστόλων
  choice: 使徒称他为巴拿巴
  rationale: 准确表达这个称呼来自使徒；不加入原文没有明确表达的“又”或“也”。
- source_word: ὅ ἐστιν μεθερμηνευόμενον
  choice: 翻译出来就是
  rationale: 以自然现代汉语保留路加对该名字所作的明确释义。
- source_word: υἱὸς παρακλήσεως
  choice: 劝慰之子
  rationale: “劝慰”兼顾παράκλησις所含劝勉、鼓励和安慰的语义范围，避免在正文中过度限定为其中一义。
- source_word: Λευίτης
  choice: 利未人
  rationale: 采用该支派及宗教身份的通行中文名称。
- source_word: Κύπριος τῷ γένει
  choice: 出生于塞浦路斯
  rationale: τῷ γένει表明出身或出生地；此译法简洁自然，也避免将其误解为仅仅居住在那里。
theological_decisions:
- issue: παρακλήσεως在“巴拿巴”释义中的含义
  choice: 正文译作“劝慰”，兼顾劝勉与安慰
  alternative: 可分别译作“劝勉”“鼓励”或“安慰”
  rationale: 该词本身具有劝勉、鼓励、安慰等相互关联的含义，本节没有要求把它收窄为单一神学意义，因此正文采用涵盖面较广的表达，并在脚注列出可能译法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“劝慰”虽略带书面色彩，但在此名字释义中简洁而自然，并能同时承载劝勉与安慰两方面。原文第36节在句法上与下一节紧密相连；中文为便于按节阅读，分作两个简短陈述句，但不改变人物身份与出身信息。
