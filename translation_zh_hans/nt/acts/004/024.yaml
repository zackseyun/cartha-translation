  text: οἱ δὲ ἀκούσαντες ὁμοθυμαδὸν ἦραν φωνὴν πρὸς τὸν θεὸν καὶ εἶπαν· Δέσποτα, ⸀σὺ ὁ ποιήσας τὸν οὐρανὸν καὶ τὴν γῆν καὶ τὴν θάλασσαν καὶ πάντα τὰ ἐν αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/024.yaml
  text: When they heard this[a], they lifted their voices together to God and said, “Master, you are the one who made heaven and earth and sea[b], and everything in them,”
translation:
  language: zh_hans
  text: 众人听见后，就同心合意地向上帝高声说：“主宰[a]啊，你是创造天、地、海和其中万物的那一位，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “主宰”原文为 Δέσποτα，是强调绝对权柄的称号；不同于通常译作“主”的 κύριος。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: 听见后
  rationale: 不补出希腊文未明说的宾语，以简洁的时间性表达体现不定过去时分词在上下文中的作用。
- source_word: ὁμοθυμαδόν
  choice: 同心合意地
  rationale: 表达众人意念一致、共同行动；比单说“一起”更充分，又不把它误解为正式表决中的“全体一致”。
- source_word: ἦραν φωνήν
  choice: 高声说
  rationale: 这是群体发声的惯用表达；结合后面的“说”，译为“高声说”自然，也避免生硬直译为“举起声音”。
- source_word: πρὸς τὸν θεόν
  choice: 向上帝
  rationale: 在祷告语境中表示言语所指向的对象，译作“向上帝”清楚自然。
- source_word: Δέσποτα
  choice: 主宰
  rationale: “主宰”体现该称号所强调的绝对权柄，并与通常译作“主”的 κύριος 保持词义区别。
- source_word: σὺ ὁ ποιήσας
  choice: 你是……的那一位
  rationale: 保留人称代词加冠词化分词的强调和识别作用，突出所呼求的上帝正是创造者。
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν καὶ τὴν θάλασσαν
  choice: 天、地、海
  rationale: 采用简洁庄重的创造用语，并保留三个受造领域的并列结构。
- source_word: πάντα τὰ ἐν αὐτοῖς
  choice: 其中万物
  rationale: 自然、完整地表达天、地、海中一切所有之物。
theological_decisions:
- issue: 如何翻译对上帝的称号 Δέσποτα
  choice: 主宰
  alternative: 主；至高的主
  rationale: “主宰”既表达绝对权柄，也不添加原文没有的第二个称号，并保留它与 κύριος 的词汇区别。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“同心合意地”体现群体合一，“高声说”符合现代汉语表达。句末保留逗号，因为原文的祷告在下一节继续。
