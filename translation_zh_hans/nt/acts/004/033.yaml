  text: καὶ ⸂δυνάμει μεγάλῃ⸃ ἀπεδίδουν τὸ μαρτύριον οἱ ἀπόστολοι ⸂τῆς ἀναστάσεως τοῦ κυρίου Ἰησοῦ⸃, χάρις τε μεγάλη ἦν ἐπὶ πάντας αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/033.yaml
  text: And with great power the apostles were giving their testimony about the resurrection of the Lord Jesus[a], and great favor was upon them all.
translation:
  language: zh_hans
  text: 使徒以大能不断地为主耶稣的复活作见证；有大恩惠[a]临到他们所有人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恩惠”也可译作“恩典”或“好感”。原文没有说明其来源；它可指神所赐的恩典、人们对信徒的好感，或可能兼有二者。
    reason: lexical_alternative
lexical_decisions:
- source_word: δυνάμει μεγάλῃ
  choice: 以大能
  rationale: 工具或方式与格，表示使徒作见证所凭借或表现出的能力。“大能”符合《路加福音—使徒行传》中 δύναμις 的常见语感，又不把含义限定为神迹。
- source_word: ἀπεδίδουν
  choice: 不断……作
  rationale: 未完成时表示持续或反复进行的行动；结合 μαρτύριον，汉语自然表达为“不断作见证”。
- source_word: τὸ μαρτύριον
  choice: 作见证
  rationale: 与 ἀποδίδωμι 构成“提出、作出见证”的表达；现代汉语用“作见证”比直译“交付见证”自然。
- source_word: τῆς ἀναστάσεως
  choice: 为……的复活
  rationale: 属格说明见证的内容或所指对象；“为……的复活作见证”清楚表达使徒见证耶稣已经复活。
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: 主耶稣
  rationale: 按 κύριος 的称号义译为“主”，属格与“复活”相连，即主耶稣的复活。
- source_word: χάρις μεγάλη
  choice: 大蒙恩惠
  rationale: χάρις 可指恩典、恩惠或好感；“大蒙恩惠”保留其正面惠顾的宽广含义，同时避免明确限定来源是神还是人。
- source_word: ἐπὶ πάντας αὐτούς
  choice: 众人都……蒙
  rationale: 表达 χάρις 临到并覆庇整个群体；“众人都”自然保留 πάντας 的整体强调。
theological_decisions:
- issue: χάρις 的含义和来源
  choice: 恩惠临到整个群体，但不明确其来源
  alternative: 明确译作神的恩典，或译作众人的好感
  rationale: 原文没有说明 χάρις 来自神还是人，也可能兼含两者；正文用“恩惠”，脚注交代“恩典／好感”的可能性，以保留原文的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“以大能”保留经文语体；“不断……作见证”呈现未完成时的持续性；分号使两个并列陈述层次清楚。
