  text: καὶ ἐτίθουν παρὰ τοὺς πόδας τῶν ἀποστόλων· διεδίδετο δὲ ἑκάστῳ καθότι ἄν τις χρείαν εἶχεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/035.yaml
  text: and they were laying them at the apostles’ feet[b][a], and it was being distributed to each one according as anyone had need.
translation:
  language: zh_hans
  text: 他们把所得的款项[a]放在使徒脚前[b]；按各人的需要，分给每一个人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “所得的款项”原文没有明说，是按上一节的语境补出的，指变卖产业所得的价款。
    reason: cross_reference
  - marker: b
    text: 或译“交到使徒面前”。原文直译为“放在使徒脚旁／脚前”，保留了将所得交由使徒监管的具体画面。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐτίθουν
  choice: 放在
  rationale: 未完成时表示当时持续或反复发生的行动；现代汉语通常借上下文表达这种体貌，无须机械加入“不断”。
- source_word: παρὰ τοὺς πόδας τῶν ἀποστόλων
  choice: 在使徒脚前
  rationale: 保留希腊文具体的空间意象，同时自然表达把款项交由使徒管理。
- source_word: διεδίδετο
  choice: 分给
  rationale: 希腊文是未完成时被动式，描写持续或惯常的分配；汉语用无明确施事者的“分给”可自然传达其被动、非聚焦施事者的性质。
- source_word: ἑκάστῳ
  choice: 给每一个人
  rationale: 保留单数与逐一分配的含义。
- source_word: καθότι ἄν τις χρείαν εἶχεν
  choice: 照各人的需要
  rationale: 表达分配与每个人实际需要相对应的比例或准则，简洁而忠实。
- source_word: τις
  choice: 各人
  rationale: 此处为泛指，不限定性别；“各人”与后面的逐一分配自然衔接。
- source_word: χρείαν
  choice: 需要
  rationale: 准确表达 χρεία 的通常含义，现代读者易懂。
theological_decisions:
- issue: 是否明确补出被放下并分配的对象
  choice: 在第一分句补作“所得的款项”，第二分句沿用语境而不重复宾语
  alternative: 完全不补宾语，或补作“卖地卖房所得的钱”
  rationale: 原文宾语承接上一节而省略。汉语若完全省略会显得突兀；“所得的款项”使句意完整，又不把对象过度限定为某一种财产所得。脚注说明此词为按上文补出。
- issue: 是否明确分配者
  choice: 不补出具体施事者
  alternative: 译作“使徒就分给”或“他们就分给”
  rationale: 原文 διεδίδετο 为被动式，没有明说由谁分配；不指明施事者可保留原文的开放性，避免把使徒的监管直接等同于亲自执行每次分配。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“使徒脚前”保留原文意象；分号呈现放下款项与按需分配两个紧密相连的动作。
