id: ACT.4.19
reference: Acts 4:19
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ δὲ Πέτρος καὶ Ἰωάννης ἀποκριθέντες ⸂εἶπον πρὸς αὐτούς⸃· Εἰ δίκαιόν ἐστιν ἐνώπιον τοῦ θεοῦ ὑμῶν ἀκούειν μᾶλλον ἢ τοῦ θεοῦ, κρίνατε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/019.yaml
  text: But Peter and John answered and said to them[a], “If it is right in the sight of God to listen to you rather than to God, judge for yourselves.”
translation:
  language: zh_hans
  text: 彼得和约翰却回答他们说：“在上帝面前，听从你们而不听从上帝是否合宜，你们自己判断吧。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “听从”也可按语境理解为“服从”。希腊文动词的字面意思是“听”，这里含有听从权威、照其命令行事的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ Πέτρος καὶ Ἰωάννης
  choice: 彼得和约翰却
  rationale: δέ在这里承接上文并形成轻微转折；“却”自然地表现二人对当权者命令的回应。
- source_word: ἀποκριθέντες εἶπον πρὸς αὐτούς
  choice: 回答他们说
  rationale: 保留分词加限定动词的表达层次，同时符合现代汉语叙事习惯。
- source_word: δίκαιόν
  choice: 合宜
  rationale: 此处指在上帝的评判下是否正当、合理；“合宜”既自然，又保留道德和判断意味。
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: 在上帝面前
  rationale: 直接保留原文空间隐喻及其接受上帝评判的含义。
- source_word: ἀκούειν
  choice: 听从
  rationale: ἀκούω的基本义是听，但此处涉及是否遵从权威的命令；“听从”既保留“听”的词形联系，也自然传达服从语境。
- source_word: μᾶλλον ἢ
  choice: ……而不……
  rationale: 在此二者择一的比较语境中，现代汉语用“听从你们而不听从上帝”自然表达“宁可前者而非后者”的对照。
- source_word: κρίνατε
  choice: 你们自己判断吧
  rationale: 命令式要求听者作出评断；“自己”明确其直接挑战的语用力量，“吧”使汉语命令语气庄重而自然。
theological_decisions:
- issue: ἀκούειν在服从人的权威与服从上帝的对照中应译为多强的服从用语
  choice: 正文译作“听从”，脚注说明也可理解为“服从”
  alternative: 直接译作“服从你们而不服从上帝”
  rationale: 原文使用通常表示“听、聆听”的ἀκούω，但上下文显然包含遵从命令之意。“听从”在现代汉语中同时保留听的词义和服从的语境，不把原文强化为更明确的服从动词。
translation_notes:
  register: 采用现代、清晰而庄重的叙事和直接引语。“在上帝面前”保留原文的评判意象；“是否合宜，你们自己判断吧”符合普通读者可理解的现代标准汉语。
