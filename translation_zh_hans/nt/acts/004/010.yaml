revisions:
- from: 你们众人和以色列全体百姓都应当知道：这人能健全地站在你们面前，是靠着拿撒勒人耶稣——弥赛亚[a]的名；这位耶稣，你们把他钉在十字架上，神却使他从死人中复活了。正是靠着他[b]，这人才健全地站在你们面前[c]。
  to: 你们众人和以色列全体百姓都当知道：这人健康地站在你们面前，是借着拿撒勒人耶稣——弥赛亚——的名，也就是借着这位你们钉在十字架上、神却使他从死人中复活的耶稣。
  rationale: 修订删除了重复的医治结论，并将原文的结构以自然汉语重组：先说明凭借耶稣之名，再以关系从句保留“你们钉十字架／神使复活”的对照，最后以“借着这位耶稣”表达ἐν τούτῳ的首选指向。脚注保留其也可指“这名”的语义可能。
