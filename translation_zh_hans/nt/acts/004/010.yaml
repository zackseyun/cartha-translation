    text: “借着这位耶稣”也可译作“借着这名”。希腊语 ἐν τούτῳ 可能指耶稣本人，也可能更具体地承接前面所说耶稣的“名”。
    reason: lexical_alternative
  - marker: c
    text: “健康地”也可译作“完全康复地”或“健全地”。希腊语 ὑγιής 表示身体完好或恢复健康。
    reason: lexical_alternative
