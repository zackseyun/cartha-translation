source:
  edition: SBLGNT
  text: γνωστὸν ἔστω πᾶσιν ὑμῖν καὶ παντὶ τῷ λαῷ Ἰσραὴλ ὅτι ἐν τῷ ὀνόματι Ἰησοῦ Χριστοῦ τοῦ Ναζωραίου, ὃν ὑμεῖς ἐσταυρώσατε, ὃν ὁ θεὸς ἤγειρεν ἐκ νεκρῶν, ἐν τούτῳ οὗτος παρέστηκεν ἐνώπιον ὑμῶν ὑγιής.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/010.yaml
  text: let it be known to all of you and to all the people of Israel that in the name of Jesus the Messiah the Nazarene[a], whom you crucified[c][b], whom God raised from the dead—by this name this man stands before you healthy.
translation:
  language: zh_hans
  text: 你们众人和以色列全体百姓都当知道：这人健康地站在你们面前，是借着拿撒勒人耶稣——弥赛亚——的名，也就是借着这位你们钉在十字架上、神却使他从死人中复活的耶稣。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνωστὸν ἔστω
  choice: 都应当知道
  rationale: 以现代汉语自然表达公开宣告式的命令语气，同时保留其庄重和明确的力度。
- source_word: πᾶσιν ὑμῖν καὶ παντὶ τῷ λαῷ Ἰσραήλ
  choice: 你们众人和以色列全体百姓
  rationale: 保留现场听众与更广泛的以色列百姓这两层对象。
- source_word: ἐν τῷ ὀνόματι
  choice: 靠着……的名
  rationale: 既保留“名”的原文意象，也在此医治语境中传达凭借其权能或有效施行的工具含义。
- source_word: Ἰησοῦ Χριστοῦ
  choice: 耶稣——弥赛亚
  rationale: 将 Χριστός 作为称号译为“弥赛亚”，破折号帮助现代读者识别它不是姓氏。
- source_word: τοῦ Ναζωραίου
  choice: 拿撒勒人
  rationale: 直接保留 Ναζωραῖος 的称谓形式，并自然地标明耶稣与拿撒勒的关联。
- source_word: ὃν ὑμεῖς ἐσταυρώσατε
  choice: 你们把他钉在十字架上
  rationale: 直接保留彼得对听众的指控和主动施事关系。
- source_word: ὃν ὁ θεὸς ἤγειρεν ἐκ νεκρῶν
  choice: 神却使他从死人中复活了
  rationale: 明确保留神的施事角色，并用自然汉语表达复活；“却”呈现与前句人类行为之间的鲜明对照。
- source_word: ἐν τούτῳ
  choice: 正是靠着他
  rationale: 将指示代词理解为回指刚才所说的耶稣，并表达工具或凭借关系；“靠着这名”这一可能理解收入脚注。
- source_word: οὗτος παρέστηκεν ἐνώπιον ὑμῶν ὑγιής
  choice: 这人才健全地站在你们面前
  rationale: “站在”表达完成时所强调的当前可见状态；“健全”涵盖身体已经恢复正常、完好的意思。
theological_decisions:
- issue: Χριστός 应译作称号还是姓名化形式
  choice: 弥赛亚
  alternative: 基督
  rationale: 本段面对以色列领袖公开宣告耶稣的身份，称号含义仍然突出；脚注保留传统姓名化译法。
- issue: ἐν τούτῳ 的所指
  choice: 靠着他
  alternative: 靠着这名
  rationale: 阳性单数指示代词可自然回指刚提到的耶稣本人，但也可能承接“名”；正文选择前者，脚注保存后者，避免消除原文歧义。
- issue: 复活表述中的施事者
  choice: 神却使他从死人中复活了
  alternative: 神却叫他从死人中起来了
  rationale: 保留原文明确的神圣施事和从死人中复起的宣告，不加入原文没有的教义解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“你们众人”“以色列全体百姓”保留公开宣告的广度；“钉在十字架上”与“神却使他……复活”形成原文的指控与反转。正文中的所有脚注标记均已对应列出。
