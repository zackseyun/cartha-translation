id: ACT.4.7
reference: Acts 4:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ στήσαντες αὐτοὺς ἐν ⸀τῷ μέσῳ ἐπυνθάνοντο· Ἐν ποίᾳ δυνάμει ἢ ἐν ποίῳ ὀνόματι ἐποιήσατε τοῦτο ὑμεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/007.yaml
  text: And after setting them in the midst[a], they began asking, “By what power or in what name did you do this?”
translation:
  language: zh_hans
  text: 他们叫二人站在当中，就问[a]：“你们是凭什么能力，或奉谁的名做这事的？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“不断询问”或“盘问”。希腊语未完成时可强调询问正在持续，不一定表示询问刚刚开始。
    reason: 说明ἐπυνθάνοντο的未完成时既可具有持续含义，也可能按语境理解为开始询问；正文采用较中性的译法以保留这种可能性。
lexical_decisions:
- source_word: στήσαντες
  choice: 叫二人站
  rationale: 该不定过去时分词表示先于盘问发生的动作。“叫……站”自然表达使役含义，并以“就”呈现动作的先后衔接。
- source_word: αὐτοὺς
  choice: 二人
  rationale: 代词指上文的彼得和约翰。译作“二人”可避免与执行审问的“他们”混淆，又不必在本节重复姓名。
- source_word: ἐν τῷ μέσῳ
  choice: 在当中
  rationale: 保留原文“在中间”的空间意象，符合公议会审问的场景，且不扩译为较具解释性的“在他们面前”。
- source_word: ἐπυνθάνοντο
  choice: 就问
  rationale: 未完成时可表示持续、开始或背景中的询问。“就问”在正文中保持自然和相对中性，时态层面的可能含义在脚注说明。
- source_word: Ἐν ποίᾳ δυνάμει
  choice: 凭什么能力
  rationale: ἐν在此具有工具性含义，汉语用“凭”自然；δύναμις直译为“能力”，不改译为更接近ἐξουσία的“权柄”。
- source_word: ἢ ἐν ποίῳ ὀνόματι
  choice: 或奉谁的名
  rationale: “奉……的名”保留圣经中代表某人、倚仗其名而行的表达；汉语以“谁”询问名字所属者，比“奉什么名”更自然。
- source_word: ἐποιήσατε τοῦτο
  choice: 做这事
  rationale: 忠实保留原文概括性的“这事”，让上下文说明所指的医治，不在正文中添加解释。
- source_word: ὑμεῖς
  choice: 你们
  rationale: 明确译出原文显式主语。汉语问句中的“你们”已有一定强调效果，无须加上语气较重的“你们自己”。
theological_decisions:
- issue: δύναμις应译为“能力”还是解释为“权柄”
  choice: 能力
  alternative: 权柄
  rationale: 原文使用δύναμις，通常指力量或能力；与之并列的“奉谁的名”已经包含代表性权威的含义。译作“能力”可保留两项询问之间的区别。
- issue: “奉谁的名”是否应明确指某人的授权
  choice: 保留“奉谁的名”的开放表达
  alternative: 凭谁的权柄
  rationale: 原文以“名”表达，可能兼有代表、倚仗和调用其名等含义。正文不把它收窄为单一的“授权”概念。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“在当中”保留审问场景的空间表达；“凭什么能力，或奉谁的名”兼顾自然汉语与原文两项并列询问。
