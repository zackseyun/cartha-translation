  text: Ἐγένετο δὲ ἐπὶ τὴν αὔριον συναχθῆναι αὐτῶν τοὺς ἄρχοντας καὶ ⸀τοὺς πρεσβυτέρους καὶ ⸁τοὺς γραμματεῖς ⸀ἐν Ἰερουσαλήμ
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/005.yaml
  text: And it happened that on the next day their rulers and elders and scribes were gathered together in Jerusalem,[a]
translation:
  language: zh_hans
  text: 第二天，他们的官长、长老和经学家在耶路撒冷聚集起来。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“集合”或“聚到一起”。希腊语动词在形式上是被动语态（“被聚集在一起”）。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: （融入句式，不另译）
  rationale: 这是推进叙事的惯用结构。现代汉语直接以“第二天”承接上文更自然；若硬译为“事情发生了”，反而显得累赘。
- source_word: ἐπὶ τὴν αὔριον
  choice: 第二天
  rationale: 准确表达“次日、翌日”的时间意义，也符合现代汉语叙事习惯。
- source_word: συναχθῆναι
  choice: 聚集起来
  rationale: 表达多人集合在一起的事件；汉语这一不及物表达自然，同时不强行指定是谁召集他们。希腊语的被动形式及其他可译法在脚注中说明。
- source_word: αὐτῶν
  choice: 他们的
  rationale: 保留原文的关系代词，同时不在本节内擅自明确“他们”所指的具体群体。
- source_word: τοὺς ἄρχοντας
  choice: 官长
  rationale: 在此指具有治理权柄的犹太领袖。“官长”既体现其权威身份，也比泛称“领袖”更贴近制度语境。
- source_word: τοὺς πρεσβυτέρους
  choice: 长老
  rationale: 这里指群体中获认可的领导者，并非仅指年长男性；“长老”是准确而通行的对应词。
- source_word: τοὺς γραμματεῖς
  choice: 经学家
  rationale: 这里指精通并讲解犹太律法与经文的专业群体。“经学家”在现代汉语中比“文士”更易懂，又不把其职能窄化为单纯抄写。
- source_word: ἐν Ἰερουσαλήμ
  choice: 在耶路撒冷
  rationale: 直接、自然地表达地点。
theological_decisions:
- issue: αὐτῶν（“他们的”）所指为何
  choice: 保留“他们的”，不明确其先行对象
  alternative: 省略该代词，或具体译成“犹太人的官长”
  rationale: 原文保留了关系指向，却未在本节中明说先行对象。译文因此保留代词，以免把上下文推断写成原文的明示内容。
- issue: συναχθῆναι 的被动形式是否明示召集者
  choice: 正文译作“聚集起来”，脚注说明希腊语为被动形式
  alternative: 译作“被召集到一起”
  rationale: “被召集”容易使汉语读者认为原文明确暗示某位外在召集者；“聚集起来”保留集合事件而不补出施事者，脚注则保留其语法形式所带来的张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“经学家”取代较古雅且可能令人误解为抄写员的“文士”；整体语序按自然汉语组织，同时保留“他们的”这一原文关系表达。
