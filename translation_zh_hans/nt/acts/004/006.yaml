  text: (καὶ ⸂Ἅννας ὁ ἀρχιερεὺς καὶ Καϊάφας καὶ Ἰωάννης καὶ Ἀλέξανδρος⸃ καὶ ὅσοι ἦσαν ἐκ γένους ἀρχιερατικοῦ),
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/006.yaml
  text: and Annas the high priest[a], and Caiaphas, and John, and Alexander, and all who were of the high-priestly family,
translation:
  language: zh_hans
  text: 并有大祭司亚那、该亚法、约翰、亚历山大，以及所有出身于大祭司世家的人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἅννας
  choice: 亚那
  rationale: 采用现代中文圣经中通行的人名译法，按希腊文音译。
- source_word: ὁ ἀρχιερεὺς
  choice: 大祭司
  rationale: 保留希腊文对亚那所用的明确称号，不因当时实际任职者的历史问题而改写为“前任大祭司”等解释性表达。
- source_word: Καϊάφας
  choice: 该亚法
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: Ἰωάννης
  choice: 约翰
  rationale: 采用现代中文通行的传统译名；不依据可能的闪语背景另译。
- source_word: Ἀλέξανδρος
  choice: 亚历山大
  rationale: 采用现代中文通行的人名译法。
- source_word: ὅσοι ἦσαν
  choice: 所有成员
  rationale: 结合ἐκ γένους的家族语境，以自然中文表达所有属于该亲族群体的人。
- source_word: ἐκ γένους ἀρχιερατικοῦ
  choice: 大祭司家族的
  rationale: γένος可指家族、宗族或世系；此处译作“大祭司家族”既自然，也保留其亲族归属含义，而不误解为这些人全都担任大祭司。
theological_decisions:
- issue: 亚那在当时职务状况存在历史疑问，但经文称他为ὁ ἀρχιερεύς
  choice: 直接译作“大祭司亚那”
  alternative: “前任大祭司亚那”或“祭司长亚那”
  rationale: 希腊文明确把“大祭司”作为亚那的称号。译文不应为协调历史资料而加入“前任”，也不应弱化为其他职称，应保留原文的张力。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。正文承接上一节的名单结构，用“还有……以及……”表达希腊文连续的καί；“大祭司家族的所有成员”避免让读者误以为每个人都担任大祭司。
