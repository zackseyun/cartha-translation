source:
  edition: SBLGNT
  text: καὶ δεηθέντων αὐτῶν ἐσαλεύθη ὁ τόπος ἐν ᾧ ἦσαν συνηγμένοι, καὶ ἐπλήσθησαν ἅπαντες ⸂τοῦ ἁγίου πνεύματος⸃, καὶ ἐλάλουν τὸν λόγον τοῦ θεοῦ μετὰ παρρησίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/031.yaml
  text: And when they had prayed[a], the place in which they were gathered was shaken[b], and they were all filled with the Holy Spirit and were speaking the word of God with boldness.
translation:
  language: zh_hans
  text: 他们祷告完了，聚集的地方就震动起来；众人都被圣灵充满，放胆传讲上帝的道。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “放胆”也可译作“坦然无惧地”或“公开直率地”；原词强调毫无畏惧、坦然公开地说话。
    reason: lexical_alternative
lexical_decisions:
- source_word: δεηθέντων αὐτῶν
  choice: 他们祷告完了
  rationale: 该属格独立结构以不定过去时分词交代先于主句发生的背景动作；“祷告完了”自然地表达“在他们祷告之后”，又符合群体祷告的语境。
- source_word: ἐσαλεύθη
  choice: 震动起来
  rationale: 不定过去时被动语态表明聚集之处受到震动；此译保留了动词在本处明显的物理力度。
- source_word: ὁ τόπος ἐν ᾧ ἦσαν συνηγμένοι
  choice: 聚集的地方
  rationale: 以简洁自然的汉语表达“他们处于聚集状态的地方”；ἦσαν与完成时被动分词的组合着重于当时已经聚在一起的状态。
- source_word: ἐπλήσθησαν ἅπαντες
  choice: 众人都被……充满
  rationale: 保留被动意义以及ἅπαντες对全体成员的强调，也延续路加著作中“被圣灵充满”的固定表达。
- source_word: τοῦ ἁγίου πνεύματος
  choice: 圣灵
  rationale: 在πίμπλημι之后，该属格自然表示所充满的内容；“被圣灵充满”是准确、通顺且为现代汉语读者熟悉的表达。
- source_word: ἐλάλουν
  choice: 传讲
  rationale: 未完成时描写持续进行的言说；结合宾语“上帝的道”，这里不是一般交谈，而是宣讲。汉语无需额外加入“不断”，仍可由上下文呈现持续性。
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: 上帝的道
  rationale: 保留路加常用表达的圣经语汇和神学分量；在此指所宣讲的来自上帝的信息。
- source_word: μετὰ παρρησίας
  choice: 放胆
  rationale: παρρησία在《使徒行传》中强调公开、无惧而坦然的言说；“放胆传讲”自然准确，也避免把重点仅缩减为主观自信。
theological_decisions:
- issue: 圣灵充满的表达
  choice: 众人都被圣灵充满
  alternative: 众人都由圣灵充满
  rationale: 该属格在πίμπλημι之后最自然地表示充满的内容。“被圣灵充满”保留经文所说的神圣赋能，却不把它限定为某一宗派所主张的特定后续经验。
- issue: ἐλάλουν的体貌
  choice: 传讲
  alternative: 开始传讲／讲了
  rationale: 希腊语未完成时侧重持续进行的宣讲，而非仅仅开始或一次性的言说。汉语以“传讲”配合叙事上下文表达该行动，不擅自加入起始含义。
- issue: “上帝的道”的所指
  choice: 上帝的道
  alternative: 上帝的信息
  rationale: “道”既可按语境指所传扬的信息，也保留路加用语的经文内部联系；不在本节中把其含义进一步限定。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“聚集的地方”避免生硬复刻希腊语关系从句；分号呈现震动与圣灵充满、放胆传讲之间紧密相连而又有层次的叙事推进。脚注标记置于其所说明的“放胆传讲”之后。
