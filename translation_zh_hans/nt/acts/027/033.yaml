  text: Ἄχρι δὲ οὗ ⸂ἡμέρα ἤμελλεν⸃ γίνεσθαι παρεκάλει ὁ Παῦλος ἅπαντας μεταλαβεῖν τροφῆς λέγων· Τεσσαρεσκαιδεκάτην σήμερον ἡμέραν προσδοκῶντες ἄσιτοι διατελεῖτε, μηθὲν προσλαβόμενοι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/033.yaml
  text: Until the day was about to dawn[a], Paul kept urging them all to take some food, saying, “Today is the fourteenth day that you have continued in suspense without eating, having taken nothing.”
translation:
  language: zh_hans
  text: 直到天将亮时，保罗一直劝众人吃些东西，说：“你们一直在等候[a]，今天已经是第十四天了；你们没有进食，什么也没有吃。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“焦灼地等待”。希腊语词可指等待或期待；在风暴的处境中，也可能带有不安等候的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄχρι δὲ οὗ ἡμέρα ἤμελλεν γίνεσθαι
  choice: 天快亮的时候
  rationale: 这一时间结构指白昼即将来到之际；现代汉语用“天快亮的时候”自然表达临近黎明，不把ἄχρι οὗ机械译成生硬的“直到……为止”。
- source_word: παρεκάλει
  choice: 不断劝
  rationale: 未完成时表示持续或反复的动作；“不断劝”既体现延续性，也符合保罗催促众人进食的语境。
- source_word: ἅπαντας
  choice: 大家
  rationale: 指船上的所有人；“大家”在现代汉语中自然且完整地传达全体范围。
- source_word: μεταλαβεῖν τροφῆς
  choice: 吃点东西
  rationale: 该短语表示摄取食物或营养；“吃点东西”自然表达部分量和实际进食。
- source_word: Τεσσαρεσκαιδεκάτην σήμερον ἡμέραν
  choice: 今天已经是第十四天了
  rationale: 保留原文对“今天”和“第十四天”的强调，同时符合现代汉语的时间表达。
- source_word: προσδοκῶντες
  choice: 悬着心等待
  rationale: 基本义是等待、期待；风暴语境使这种等待带有不安。“悬着心等待”保留等待义并自然呈现语境中的焦灼感。
- source_word: ἄσιτοι διατελεῖτε
  choice: 一直……没有吃东西
  rationale: διατελεῖτε表示持续处于某状态，ἄσιτοι表示未进食；此译法避免“禁食”可能带来的自愿宗教行为含义。
- source_word: μηθὲν προσλαβόμενοι
  choice: 什么也没有进食
  rationale: 该分词短语进一步说明他们没有摄取任何食物；译文保留其加强和解释前句的作用。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准普通话。“悬着心等待”比单纯“等待”更贴合风暴中的叙事情境，但没有把该分词提升为专门的神学含义。原文“没有吃东西，什么也没有进食”本有近义叠加，译文予以保留，以呈现保罗话语的强调。
