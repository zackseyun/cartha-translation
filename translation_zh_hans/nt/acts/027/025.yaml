  text: διὸ εὐθυμεῖτε, ἄνδρες· πιστεύω γὰρ τῷ θεῷ ὅτι οὕτως ἔσται καθ’ ὃν τρόπον λελάληταί μοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/025.yaml
  text: Therefore[a], take courage, men, for I believe God that it will be just as it has been told to me.
translation:
  language: zh_hans
  text: 因此，各位男士，要振作！因为我相信上帝[a]，事情将照着所告诉我的那样发生。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我信靠上帝”。希腊语结构可侧重信赖上帝，也可侧重相信上帝所说的话。
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: 所以
  rationale: 承接前文的保证，并引出基于此保证的劝勉；“所以”清楚而自然地表达推论关系。
- source_word: εὐθυμεῖτε
  choice: 要振作起来
  rationale: 这是在海难危机中发出的命令，要求众人恢复勇气和信心；现代汉语“振作起来”自然有力。
- source_word: ἄνδρες
  choice: 诸位
  rationale: 作为呼语，向船上的众人直接讲话。“诸位”在现代汉语中庄重自然；上下文已明确听众群体，避免使用生硬的“男士们”或增添原文没有的亲属称谓。
- source_word: πιστεύω τῷ θεῷ
  choice: 我信上帝
  rationale: πιστεύω加与格可表达相信或信靠某人，即把上帝的话当真。“我信上帝”保留了对上帝本人的信赖以及相信其话语的双重可能。
- source_word: ὅτι
  choice: 因为
  rationale: 在此承接前面的劝勉，说明保罗叫众人振作的理由；其后的句子同时说明他信上帝的具体表现。汉语用“因为”最自然地呈现论证关系。
- source_word: οὕτως ἔσται καθ’ ὃν τρόπον
  choice: 事情必会照着……那样发生
  rationale: 表达将来的事与先前所说的话完全相符；“照着……那样发生”保留比较和对应关系。
- source_word: λελάληταί μοι
  choice: 对我所说的
  rationale: 保留完成时被动语态的核心意义：这话已经对保罗说出，并在当前仍然有效；不明说发言者，以免超出本句语法。
theological_decisions:
- issue: πιστεύω τῷ θεῷ的含义
  choice: 我信上帝
  alternative: 我信靠上帝；我相信上帝所说的话
  rationale: 希腊语与格结构直接以“上帝”为相信或信靠的对象，既有人际信赖的意味，也含有把上帝所说的话当真的意思。正文保留简洁而有张力的表达，脚注说明其可能侧重。
- issue: λελάληταί μοι的说话者
  choice: 采用不明说施事者的表达“对我所说的”
  alternative: 照着上帝对我所说的；照着天使对我所说的
  rationale: 本句使用被动语态，没有直接指出是谁说话。虽然前文提到上帝的使者，保罗又说自己信上帝，但正文不应替原文消除这一含蓄关系。
translation_notes:
  register: 采用现代、庄重而易懂的口吻。“诸位”适合作为危急场景中的公开呼语；感叹号体现命令的急切和鼓舞意味。
