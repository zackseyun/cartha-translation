  text: εἶπεν ὁ Παῦλος τῷ ἑκατοντάρχῃ καὶ τοῖς στρατιώταις· Ἐὰν μὴ οὗτοι μείνωσιν ἐν τῷ πλοίῳ, ὑμεῖς σωθῆναι οὐ δύνασθε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/031.yaml
  text: Paul said to the centurion and the soldiers[a], “Unless these men remain in the ship, you cannot be saved.”
translation:
  language: zh_hans
  text: 保罗对百夫长和士兵们说：“这些人若不留在船上，你们就不能得救[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“获救”。希腊文直译为“得救”，这里指在船难中保全性命。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκατοντάρχῃ
  choice: 百夫长
  rationale: 这是罗马军队军官职衔的标准中文译法，简洁且为中文圣经读者所熟悉。
- source_word: οὗτοι
  choice: 这些人
  rationale: 指上下文中企图离船的水手；补出“人”符合现代汉语表达，也不改变指称范围。
- source_word: μείνωσιν
  choice: 留
  rationale: 在“留在船上”这一结构中自然、直接地表达继续待在原处的意思。
- source_word: πλοίῳ
  choice: 船
  rationale: 本段所指是航海用的大船；“船”在现代汉语中自然明确，也避免不必要的文体生硬。
- source_word: σωθῆναι
  choice: 得救
  rationale: 保留σῴζω较宽广的“被救、得救”措辞，同时由风暴和船难的语境限定为身体获救、保全性命；脚注说明可选译法。
- source_word: οὐ δύνασθε
  choice: 不能
  rationale: 准确而自然地表达带否定的能力动词，保留保罗警告的直接语气。
theological_decisions:
- issue: σωθῆναι在此应译成明确指身体脱险的词，还是保留较宽广的“得救”。
  choice: 得救
  alternative: 获救；保全性命
  rationale: 直接语境清楚指船难中的身体存活，并非在专论永恒救恩；但“得救”能保留希腊词本身较宽的语义范围，不把译文缩窄为解释性转述。脚注可防止读者误解。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“百夫长”保留历史职衔；“士兵们”与“这些人”使参与者清楚；条件句按汉语习惯译为“若不……就不能……”。
