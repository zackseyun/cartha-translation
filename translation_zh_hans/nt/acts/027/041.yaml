  text: περιπεσόντες δὲ εἰς τόπον διθάλασσον ⸀ἐπέκειλαν τὴν ναῦν, καὶ ἡ μὲν πρῷρα ἐρείσασα ἔμεινεν ἀσάλευτος, ἡ δὲ πρύμνα ἐλύετο ὑπὸ τῆς ⸀βίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/041.yaml
  text: But falling into a place where two seas met[a], they ran the ship aground; and the bow, having stuck fast, remained immovable, but the stern was being broken up by the force.
translation:
  language: zh_hans
  text: 但他们遇到一处两片水域交汇之处[a]，便把船搁浅了。船头牢牢卡住，纹丝不动；船尾却在强力冲击下逐渐破裂。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“一处位于两片水域之间的地方”。这里的希腊语表达很少见，可能指水道、沙洲，或两片水域、两股水流交会的地方。
    reason: lexical_alternative
lexical_decisions:
- source_word: περιπεσόντες
  choice: 撞上了
  rationale: 该不定过去时分词在此描述船突然遭遇不利地点；“撞上”自然表达意外进入并碰上该处的情形，又不把动作限定为撞击某一明确物体。
- source_word: τόπον διθάλασσον
  choice: 一处两水交汇之地
  rationale: διθάλασσος罕见，涉及两片水域、两股水流或两海之间/交会之处。“两水交汇之地”保留基本意象，同时不武断具体化为沙洲或水道。
- source_word: ἐπέκειλαν τὴν ναῦν
  choice: 使船搁了浅
  rationale: ἐπικέλλω是航海用语，指使船搁浅或冲滩；此译简洁、符合现代汉语。
- source_word: πρῷρα
  choice: 船头
  rationale: 现代汉语中清楚自然的船舶前部称谓。
- source_word: ἐρείσασα
  choice: 卡住
  rationale: ἐρείδω在此表示船头牢牢嵌住或抵住；“卡住”准确传达固定不动的结果。
- source_word: ἔμεινεν ἀσάλευτος
  choice: 纹丝不动
  rationale: 表达船头持续牢固、无法摇动的状态，形象而不失庄重。
- source_word: πρύμνα
  choice: 船尾
  rationale: 现代汉语对船舶后部的标准通俗称谓。
- source_word: ἐλύετο
  choice: 被……冲散了
  rationale: 未完成时被动态描写船尾在外力作用下逐渐解体；“冲散”兼顾受力与破裂过程。
- source_word: ὑπὸ τῆς βίας
  choice: 被那股冲力
  rationale: βία意为强力、猛烈作用。原文未明说波浪，因此译作“那股冲力”，既结合海上语境又不补入未明示的施力者。
