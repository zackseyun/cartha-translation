revisions:
- from: 但他们撞上了一处两水交汇之地[a]，就使船搁了浅。船头卡住，纹丝不动，船尾却被那股冲力冲散了。
  to: 但他们遇到一处两片水域交汇之处[a]，便把船搁浅了。船头牢牢卡住，纹丝不动；船尾却在强力冲击下逐渐破裂。
  rationale: 修订避免将“遭遇某处”具体译成直接“撞击”，改善“使船搁了浅”的语法搭配，并以“逐渐破裂”反映船尾持续解体的未完成时。脚注保留διθάλασσον在“交会”与“之间”等理解上的不确定性；未将原文未明说的施力者指定为波浪。
