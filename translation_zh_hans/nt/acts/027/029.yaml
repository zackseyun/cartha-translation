  text: φοβούμενοί τε ⸂μή που κατὰ⸃ τραχεῖς τόπους ἐκπέσωμεν ἐκ πρύμνης ῥίψαντες ἀγκύρας τέσσαρας ηὔχοντο ἡμέραν γενέσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/029.yaml
  text: And fearing that we might run aground on rocky places[b][a], they dropped four anchors from the stern and prayed for day to come.
translation:
  language: zh_hans
  text: 他们恐怕船会在险恶之处搁浅[a]，就从船尾抛下四个锚，祈求天亮[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“恐怕船会被冲到崎岖险恶之处。”
    reason: lexical_alternative
  - marker: b
    text: 直译：“祈求白昼来到”；意思是迫切盼望天亮。
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβούμενοί τε
  choice: 他们又怕
  rationale: 以原因性的分词说明随后抛锚和祈求的动机；“又”承接上文，并自然表达 τε 的叙事连接作用。
- source_word: μή που κατὰ τραχεῖς τόπους ἐκπέσωμεν
  choice: 船会撞上险峻的礁石
  rationale: 海事语境中的 ἐκπίπτω 指船被风浪带向并撞上危险地带；τραχεῖς τόπους 字面为“崎岖、险峻之处”，此处译作“险峻的礁石”便于现代读者理解，但以脚注保留较宽泛的可能。
- source_word: ἐκ πρύμνης
  choice: 从船尾
  rationale: πρύμνα 明确指船尾；采用普通现代汉语，不使用较生僻的航海术语。
- source_word: ῥίψαντες ἀγκύρας τέσσαρας
  choice: 抛下四个锚
  rationale: 准确表达先行的抛锚动作，也符合汉语航海叙述习惯。
- source_word: ηὔχοντο
  choice: 祈求
  rationale: εὔχομαι 可表示祈祷或愿望；在此用“祈求”保留向神祷告的通常含义，同时其宾语内容表现他们迫切盼望天亮。
- source_word: ἡμέραν γενέσθαι
  choice: 天快亮
  rationale: 字面意思是“白昼来到／成为白昼”；“天快亮”以自然汉语表达他们迫切祈求黎明来到，脚注补出较直译的说法。
theological_decisions:
- issue: ηὔχοντο 是向神祷告，还是单纯盼望
  choice: 祈求
  alternative: 盼望
  rationale: 该动词通常可指祷告，译作“祈求”保留其宗教含义；但本句未明说祈求对象，因此不增添“向神”等原文没有的成分。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“船尾”“抛下四个锚”具体清楚；正文以“撞上险峻的礁石”传达海上危险，脚注则保留 τραχεῖς τόπους 未明确限定为礁石的语义宽度。所有脚注标记均已置于正文相应位置。
