base_translation:
  language: en
  yaml_path: translation/nt/acts/027/021.yaml
  text: Since they had gone a long time without food, then Paul stood up among them and said, “Men, you should have listened to me and not set sail from Crete, and so have avoided this damage and loss.”
translation:
  language: zh_hans
  text: 众人已经很久没有进食了[a]。保罗便站在他们中间，说：“诸位，你们本该听从我[b]，不从克里特起航，从而避免这次伤害和损失[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“众人已经禁食多时”。希腊语ἀσιτία既可指缺少食物，也可指不进食；在这场风暴的语境中，更可能是指长时间没有吃东西。
    reason: lexical_alternative
  - marker: b
    text: 或译“服从我”。这个动词可指服从指示或权威；这里是指听取保罗先前的劝告。
    reason: lexical_alternative
  - marker: c
    text: “伤害和损失”这两个词并列，可能分别侧重所受的损害和物质上的损失。
    reason: cultural_note
lexical_decisions:
- source_word: Πολλῆς τε ἀσιτίας ὑπαρχούσης
  choice: 众人已有很长时间没有吃东西
  rationale: 属格独立结构交代保罗发言时的处境。ἀσιτία既可指缺少食物，也可指禁食；风暴航程的语境更可能指众人长时间未进食。
- source_word: σταθεὶς ὁ Παῦλος ἐν μέσῳ αὐτῶν
  choice: 保罗就站在他们中间
  rationale: 既保留保罗起身、站定并公开讲话的叙事动作，也用现代汉语自然表达ἐν μέσῳ αὐτῶν。
- source_word: Ἔδει μέν, ὦ ἄνδρες
  choice: 诸位，你们本该
  rationale: ἔδει表示过去本应采取却未采取的行动；“本该”简洁保留责备语气。“诸位”是对船上这群男子自然、庄重的当面称呼。
- source_word: πειθαρχήσαντάς μοι
  choice: 听从我的话
  rationale: πειθαρχέω可表示服从，也可表示听从劝告；此处保罗先前提出航行建议，“听从我的话”兼顾顺从与采纳劝告的含义。
- source_word: μὴ ἀνάγεσθαι ἀπὸ τῆς Κρήτης
  choice: 不要从克里特起航
  rationale: ἀνάγω在航海语境中指开船出海；“起航”准确而自然。
- source_word: κερδῆσαί τε τὴν ὕβριν ταύτην καὶ τὴν ζημίαν
  choice: 这样就能避免这次伤害和损失
  rationale: κερδαίνω本义涉及获得或得益，此处按语境表示因听从劝告而免遭后果。“避免”符合现代汉语习惯；“伤害和损失”保留ὕβρις与ζημία并列而又有区别的表达。
