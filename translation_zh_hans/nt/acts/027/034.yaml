  text: διὸ παρακαλῶ ὑμᾶς ⸀μεταλαβεῖν τροφῆς, τοῦτο γὰρ πρὸς τῆς ὑμετέρας σωτηρίας ὑπάρχει· οὐδενὸς γὰρ ὑμῶν θρὶξ ⸀ἀπὸ τῆς κεφαλῆς ⸀ἀπολεῖται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/034.yaml
  text: Therefore I urge you to take some food[a], for this is for your preservation; for not a hair from the head of any of you will perish.
translation:
  language: zh_hans
  text: 所以我劝你们吃点东西，因为这有助于你们保全性命[a]；你们中没有一个人会失去一根头发。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“有助于你们得救。”这里的希腊语词可指得救、获救、安全或保全；在本段海难的语境中，主要指身体得以存活。
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: 所以
  rationale: 承接前文并引出基于当前处境的劝告；“所以”自然地保留了推论关系。
- source_word: παρακαλῶ
  choice: 我劝
  rationale: 表达保罗恳切敦促众人采取行动的语气，现代汉语自然且不过分强硬。
- source_word: μεταλαβεῖν τροφῆς
  choice: 吃点东西
  rationale: 该短语指进食、摄取食物；此译法具体、自然，也符合众人久未进食的上下文。
- source_word: τοῦτο γὰρ πρὸς τῆς ὑμετέρας σωτηρίας ὑπάρχει
  choice: 因为这有助于你们保全性命
  rationale: πρός与属格在此表示关乎或有利于某事；“有助于”避免把进食说成获救的唯一原因，同时传达其对生存的重要性。
- source_word: σωτηρίας
  choice: 保全性命
  rationale: σωτηρία可指拯救、获救、安全或保存；海难语境首先指身体得以存活。“保全性命”清楚表达语境义，同时以脚注保留较宽的词义。
- source_word: οὐδενὸς γὰρ ὑμῶν
  choice: 你们任何人
  rationale: 保留原文逐一涵盖众人的分配意味，现代汉语表达自然。
- source_word: θρὶξ ἀπὸ τῆς κεφαλῆς
  choice: 连一根头发
  rationale: 这是表示毫发无损的惯用说法；汉语无需重复“从头上”，即可自然传达原文意象。
- source_word: ἀπολεῖται
  choice: 不会失落
  rationale: ἀπόλλυμι在此为将来时，意为失去或毁损；“不会失落”可与“一根头发”自然搭配，并保留原文关于完全安全的保证。
theological_decisions:
- issue: σωτηρία在本节中的含义
  choice: 正文按海难语境译为身体上的“保全性命”
  alternative: “得救”或“救恩”
  rationale: 上下文关注船上众人能否在海难中存活，因此正文采用身体获救的意义；但σωτηρία本身词义较宽，脚注保留“得救”等译法，避免抹去原词可能引发的神学联想，也避免在正文中误导为专指属灵救恩。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“吃点东西”符合口语劝告场景；“保全性命”保持一定庄重感。分号保留原文由进食劝告转入安全保证的逻辑推进。
