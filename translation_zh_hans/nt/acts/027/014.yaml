  yaml_path: translation/nt/acts/027/014.yaml
  text: But not long after[b][a], a typhonic wind called Euraquilo rushed down against it.
translation:
  language: zh_hans
  text: 然而，不久之后，一阵名叫“友拉革罗”的狂暴暴风猛地向岛上袭来。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“友罗革吕顿”，而不是“友拉革罗”。
    reason: textual_variant
  - marker: b
    text: 或译“猛烈的东北风”。这个名称很可能指从东北方刮来的风暴，但希腊文本把它作为专名。
    reason: lexical_alternative
lexical_decisions:
- source_word: μετ’ οὐ πολὺ
  choice: 不久
  rationale: 这是表示短时间之后的惯用语；“不久”简洁自然，准确传达时间间隔很短。
- source_word: δὲ
  choice: 然而
  rationale: 在叙事推进中带有轻微转折，突出天气突然恶化。
- source_word: ἔβαλεν κατ’ αὐτῆς
  choice: 从岛上猛冲下来
  rationale: 动词本义涉及猛烈投掷，描述风时表示强劲袭来；结合上文沿克里特岛航行的语境，阴性代词最自然地回指该岛，κατά可表达风从高处或陆地方向冲下来的动势。
- source_word: ἄνεμος τυφωνικὸς
  choice: 狂暴旋风
  rationale: τυφωνικός形容猛烈、旋转翻腾如旋风的暴风；“狂暴旋风”以现代汉语自然表达其强度和风暴特征，又避免套用严格的现代气象分类。
- source_word: ὁ καλούμενος
  choice: 称为
  rationale: 保留希腊文将随后词语作为名称或称号引出的结构。
- source_word: Εὐρακύλων
  choice: 友拉革罗
  rationale: 按专名音译，并采用现代中文圣经读者较熟悉的译名；不在正文中把专名直接解释成风向。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“狂暴旋风”保留风势猛烈且翻腾的形象；正文将阴性代词按近处语境落实为“岛”，脚注则保留风名可能表达东北风的词义信息。
