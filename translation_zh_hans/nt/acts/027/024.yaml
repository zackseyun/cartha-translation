source:
  edition: SBLGNT
  text: λέγων· Μὴ φοβοῦ, Παῦλε· Καίσαρί σε δεῖ παραστῆναι, καὶ ἰδοὺ κεχάρισταί σοι ὁ θεὸς πάντας τοὺς πλέοντας μετὰ σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/024.yaml
  text: saying, ‘Do not be afraid, Paul. You must stand before Caesar, and look, God has granted to you all those sailing with you.’
translation:
  language: zh_hans
  text: 说：‘保罗，不要害怕！你必须站在凯撒面前。看哪，神已经把所有和你一同航行的人都赐给你了。’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεῖ
  choice: 必须
  rationale: 表达由神旨意所定的必然性，同时保持现代汉语自然简洁。
- source_word: παραστῆναι
  choice: 站在……面前
  rationale: 保留原文‘站立于某人面前’的法庭语境，不扩译为‘受审’。
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留引人注意的语用功能，也符合庄重而易懂的经文语体。
- source_word: κεχάρισταί σοι
  choice: 已经把……赐给你了
  rationale: 完成时表示已经施予且结果仍然有效；‘赐给’保留恩惠、施予的含义。
- source_word: τοὺς πλέοντας μετὰ σοῦ
  choice: 和你一同航行的人
  rationale: 准确呈现当时正在同行航行的人，而不笼统改作‘同船的人’。
theological_decisions:
- issue: 神‘赐给’保罗同船众人的含义
  choice: 直译为‘把所有和你一同航行的人都赐给你了’
  alternative: ‘答应保全所有与你同船之人的性命’
  rationale: 原文没有明说‘保全性命’，虽上下文支持这一结果，正文仍保留 κεχάρισται 的恩赐表达及其神学张力，避免把隐含意义直接写入。
- issue: 保罗必须站在凯撒面前的必然性
  choice: ‘必须’
  alternative: ‘将要’
  rationale: δεῖ 不只是预测，也含神所定的必要性；用‘必须’保留这一层面而不另加解释。
translation_notes:
  register: 采用现代、庄重且普通读者易懂的简体中文。保留直接引语的紧迫感与安慰语气；不添加原文未明说的‘受审’或‘性命得救’。
