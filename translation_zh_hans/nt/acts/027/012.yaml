  text: ἀνευθέτου δὲ τοῦ λιμένος ὑπάρχοντος πρὸς παραχειμασίαν οἱ πλείονες ἔθεντο βουλὴν ἀναχθῆναι ⸀ἐκεῖθεν, εἴ πως δύναιντο καταντήσαντες εἰς Φοίνικα παραχειμάσαι, λιμένα τῆς Κρήτης βλέποντα κατὰ λίβα καὶ κατὰ χῶρον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/012.yaml
  text: And because the harbor was unsuitable for wintering[a], the majority decided to put out from there[c][b], if somehow they might reach Phoenix and spend the winter there—a harbor of Crete facing southwest and northwest.
translation:
  language: zh_hans
  text: 这港口不适合过冬，所以大多数人决定从那里启航，看看能否到达菲尼克斯，在那里过冬；菲尼克斯是克里特岛的一处港口，朝向西南和西北。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 末尾的方位说法较难确定。传统上译作“朝向西南和西北”；也有人把第二个方位更具体地理解为“西北偏西”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνευθέτου
  choice: 不适合
  rationale: 表示该港口对于眼前的过冬目的并不合宜；“不适合”自然、准确，也保留实际航海处境。
- source_word: πρὸς παραχειμασίαν
  choice: 过冬
  rationale: 指在港中度过冬季；现代汉语用“过冬”简洁清楚。
- source_word: οἱ πλείονες
  choice: 大多数人
  rationale: 实词化的比较级指群体中的较大部分；译作“大多数人”明确而自然。
- source_word: ἔθεντο βουλήν
  choice: 决定
  rationale: 该习语表达共同作出打算或决议；“决定”传达其核心意义。
- source_word: ἀναχθῆναι ἐκεῖθεν
  choice: 从那里开船
  rationale: ἀνάγω在航海语境中指船离港出海；“开船”是普通现代读者易懂的航行表达。
- source_word: εἴ πως δύναιντο
  choice: 盼望或许能
  rationale: εἴ πως与愿望式共同表达带着期望的不确定可能；此译同时保留企望与未定性。
- source_word: καταντήσαντες εἰς Φοίνικα
  choice: 到达腓尼基
  rationale: 分词表示抵达目的地；“到达”准确顺畅。
- source_word: Φοίνικα
  choice: 腓尼基
  rationale: 按希腊地名Φοῖνιξ音译，并与现代中文圣经地名惯例相符；上下文已说明它是克里特岛港口，不会与地区名称混淆。
- source_word: παραχειμάσαι
  choice: 在那里过冬
  rationale: 表示在目的地度过冬季；补出“在那里”符合汉语表达并对应语境。
- source_word: βλέποντα κατὰ λίβα καὶ κατὰ χῶρον
  choice: 朝向西南和西北
  rationale: 按传统理解，将两个航海方位词译为港口朝向；χῶρος的具体方位仍有争议，故以脚注说明。
theological_decisions: []
