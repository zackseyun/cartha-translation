id: ACT.27.9
reference: Acts 27:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ἱκανοῦ δὲ χρόνου διαγενομένου καὶ ὄντος ἤδη ἐπισφαλοῦς τοῦ πλοὸς διὰ τὸ καὶ τὴν νηστείαν ἤδη παρεληλυθέναι, παρῄνει ὁ Παῦλος
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/009.yaml
  text: Since considerable time had passed and the voyage was already dangerous[a], because even the Fast had already gone by, Paul was advising them[b],
translation:
  language: zh_hans
  text: 过了相当长的一段时间，航行已经很危险，因为连禁食日[a]也已经过去了。保罗就劝告众人说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“那禁食”，通常指犹太人每年赎罪日的禁食；这个日期也表明当时已进入海上航行日渐危险的季节。
    reason: cultural_note
lexical_decisions:
- source_word: Ἱκανοῦ ... χρόνου διαγενομένου
  choice: 过了相当长的一段时间
  rationale: 这一独立属格结构表示已有一段颇长的时间过去；译文自然表达时间的明显延误，同时不夸大具体时长。
- source_word: ὄντος ἤδη ἐπισφαλοῦς τοῦ πλοὸς
  choice: 航行已经很危险
  rationale: πλοῦς在这里指海上航行或航程，ἐπισφαλής表示处境不安全、风险很高；此译法清楚而贴合上下文。
- source_word: διὰ τὸ καὶ τὴν νηστείαν ἤδη παρεληλυθέναι
  choice: 因为连禁食日也已经过去了
  rationale: διά加带冠词的不定式说明航行危险的时令缘由；καί译为“连……也”，保留强调语气，完成时不定式则以“已经过去了”表达。
- source_word: τὴν νηστείαν
  choice: 禁食日
  rationale: 原文直译为“那禁食”，带定冠词，可能指犹太人熟知的年度赎罪日禁食。正文保留其约定俗成的简称，具体背景放入脚注。
- source_word: παρῄνει
  choice: 劝告
  rationale: παραινέω可指劝告、规劝或敦促。这里引出保罗下一节的发言，“劝告”既自然，也不把语气强化为原文未明确表达的严厉警告。
theological_decisions:
- issue: “禁食日”的具体所指
  choice: 正文译作“禁食日”，脚注说明通常理解为赎罪日的禁食
  alternative: 正文直接译作“赎罪日的禁食”
  rationale: 原文只说“那禁食”，虽普遍被理解为赎罪日，却没有明说节日名称。正文不把高度可能的文化所指写成原文明确陈述的内容，从而保留文本的表达方式。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“相当长的一段时间”自然传达显著的时间流逝；句末用“说：”承接下一节保罗的直接引语。
