  text: τῇ τε ἑτέρᾳ κατήχθημεν εἰς Σιδῶνα, φιλανθρώπως τε ὁ Ἰούλιος τῷ Παύλῳ χρησάμενος ἐπέτρεψεν πρὸς τοὺς φίλους ⸀πορευθέντι ἐπιμελείας τυχεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/003.yaml
  text: And on the next day we put in at Sidon[a], and Julius, treating Paul kindly[b], permitted him to go to his friends and receive care.
translation:
  language: zh_hans
  text: 第二天，我们在西顿靠岸。犹流很仁慈地对待保罗[a]，准许他到朋友那里去，得到照料[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “很仁慈地对待”也可译作“以人道的方式对待”，强调犹流以仁厚的态度对待一个囚犯。
    reason: lexical_alternative
  - marker: b
    text: “得到照料”也可译作“得到关照”或“获得帮助”；希腊文可泛指从朋友那里得到所需的照顾和援助。
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ τε ἑτέρᾳ
  choice: 第二天
  rationale: 这是叙事中的时间与格表达，指紧接着的次日；“第二天”自然清楚。
- source_word: κατήχθημεν εἰς Σιδῶνα
  choice: 我们在西顿靠岸
  rationale: κατάγω在航海语境中指船驶近陆地、停靠港口；“在西顿靠岸”保留了明确的航海含义。
- source_word: φιλανθρώπως … χρησάμενος
  choice: 很仁慈地对待
  rationale: 该组合表示以仁厚、人道的方式待人；“仁慈地对待”符合现代汉语，也保留对囚犯施以人道待遇的意味。
- source_word: ἐπέτρεψεν
  choice: 准许
  rationale: 准确表达给予许可，且适合军官准许在押人员行动的语境。
- source_word: πρὸς τοὺς φίλους
  choice: 到朋友那里去
  rationale: 定冠词所指的是保罗在西顿的朋友或相识者；汉语不必强加原文未明说的领属代词。
- source_word: πορευθέντι
  choice: 去
  rationale: 与ἐπέτρεψεν相连，表示获准进行的行动；汉语自然译作“准许他……去”。
- source_word: ἐπιμελείας τυχεῖν
  choice: 得到照料
  rationale: 该短语可广指获得照顾、关怀或所需帮助；“得到照料”简洁自然，并保留其宽泛含义。
theological_decisions: []
