  text: Ὡς δὲ τεσσαρεσκαιδεκάτη νὺξ ἐγένετο διαφερομένων ἡμῶν ἐν τῷ Ἀδρίᾳ, κατὰ μέσον τῆς νυκτὸς ὑπενόουν οἱ ναῦται προσάγειν τινὰ αὐτοῖς χώραν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/027.yaml
  text: When the fourteenth night had come[a], as we were being driven along in the Adriatic Sea[b], about midnight the sailors began to suspect that some land was drawing near to them.
translation:
  language: zh_hans
  text: 到了第十四夜，当我们在亚得里亚海[a]上随波漂流时，约在半夜，水手们开始猜想，有一片陆地正向他们靠近[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 古代“亚得里亚”一名可泛指这一带的地中海中部水域，并不只限于今日所称的亚得里亚海。
    reason: cultural_note
  - marker: b
    text: 原文直译为“有一片陆地正向他们靠近”；意思是水手们猜想船正接近陆地。
    reason: lexical_alternative
lexical_decisions:
- source_word: τεσσαρεσκαιδεκάτη νὺξ ἐγένετο
  choice: 到了第十四夜
  rationale: 这是自然的现代汉语时间表达，既保留“第十四夜”的次序，也传达ἐγένετο所表示的这段时间已经来到。
- source_word: διαφερομένων ἡμῶν
  choice: 我们仍……漂流
  rationale: 被动分词描写持续且不由人控制的移动；“漂流”在风暴和航海语境中自然表达船只受外力带动，“仍”体现过程仍在继续。
- source_word: ἐν τῷ Ἀδρίᾳ
  choice: 在亚德里亚海上
  rationale: 采用通行地名，便于现代读者理解；古代“亚德里亚”的范围可能比今日所谓亚得里亚海更广，另以脚注说明。
- source_word: κατὰ μέσον τῆς νυκτός
  choice: 约在半夜
  rationale: 保留κατά在此所含的约略意味，避免将时间说得过分精确。
- source_word: ὑπενόουν
  choice: 开始觉得
  rationale: 未完成时可表现认识逐渐形成或刚开始出现；“觉得”也保留判断尚未完全确定的意味。
- source_word: οἱ ναῦται
  choice: 水手们
  rationale: 现代汉语中自然、清楚的航海人员称谓。
- source_word: προσάγειν τινὰ αὐτοῖς χώραν
  choice: 某处陆地正在向他们靠近
  rationale: 保留希腊文以“某处陆地”为不定主语、向水手靠近的观察视角；“某处”体现τινά所表达的未知和不确定。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。句子分为两句，以免时间、背景和水手的判断层层嵌套而显得生硬；同时保留原文把陆地描写为向水手靠近的航海观察视角。
