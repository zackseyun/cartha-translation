  text: λέγων αὐτοῖς· Ἄνδρες, θεωρῶ ὅτι μετὰ ὕβρεως καὶ πολλῆς ζημίας οὐ μόνον τοῦ φορτίου καὶ τοῦ πλοίου ἀλλὰ καὶ τῶν ψυχῶν ἡμῶν μέλλειν ἔσεσθαι τὸν πλοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/010.yaml
  text: saying to them[a], “Men, I perceive that the voyage is about to be with disaster and great loss, not only of the cargo and the ship[b], but also of our lives.”
translation:
  language: zh_hans
  text: 对他们说：“各位，我看这次航行将会遭遇灾难，蒙受重大损失；不但货物和船只会受损，连我们的性命也会丧失。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγων αὐτοῖς
  choice: 对他们说
  rationale: 以自然的汉语承接叙事，保留分词表示伴随动作的作用。
- source_word: Ἄνδρες
  choice: 各位
  rationale: 这是对船上众人的阳性复数称呼；现代汉语用“各位”庄重自然，又不额外引入身份或敬称。
- source_word: θεωρῶ
  choice: 我看
  rationale: 此处指根据情势作出的观察和判断，并非单纯视觉所见；“我看”在现代汉语中可自然表达这种判断。
- source_word: μετὰ ὕβρεως καὶ πολλῆς ζημίας
  choice: 将会遭遇灾难，蒙受重大损失
  rationale: ὕβρις 在海难语境中表示猛烈的伤害、灾害，ζημία 表示损失或损害；此译兼顾航程本身的险恶及其造成的损失。
- source_word: οὐ μόνον τοῦ φορτίου καὶ τοῦ πλοίου ἀλλὰ καὶ
  choice: 不但货物和船只会受损……也
  rationale: 属格成分受“损失”之意支配；汉语补出“会受损”，清楚说明损失所涉及的对象。
- source_word: τῶν ψυχῶν ἡμῶν
  choice: 我们的性命
  rationale: ψυχή 在沉船和死亡危险的语境中指人的生命；“性命”准确传达肉身生命受到威胁，而非特指非物质的灵魂。
- source_word: μέλλειν ἔσεσθαι
  choice: 将会
  rationale: 表达即将发生或预期将发生之事；“将会”符合保罗基于判断而提出警告的语气。
- source_word: τὸν πλοῦν
  choice: 这次航行
  rationale: πλοῦς 指海上航程；加“这次”使汉语指称自然，所指仍是当前拟议的航行。
theological_decisions:
- issue: τῶν ψυχῶν ἡμῶν 是否译作“我们的灵魂”
  choice: 我们的性命
  alternative: 我们的灵魂
  rationale: 上下文讨论海难和死亡风险，ψυχή 此处是“生命、性命”的常见语境义；译作“灵魂”会不必要地引入灵魂论含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“各位”适合作为对船上众人的直接称呼；以“遭遇灾难，蒙受重大损失”呈现原文两个相关但不完全同义的名词。原文结构把货物、船和众人的性命都置于损失范围内；汉语分句补明“会受损”和“会有危险”，避免生硬，同时保留由财物递进至生命的强调。
