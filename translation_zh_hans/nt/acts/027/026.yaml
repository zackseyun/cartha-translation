  text: εἰς νῆσον δέ τινα δεῖ ἡμᾶς ἐκπεσεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/026.yaml
  text: But we must run aground on some island[a].
translation:
  language: zh_hans
  text: 不过，我们必定会在某个岛上搁浅[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“被冲到某个岛上。”
    reason: 词语 ἐκπεσεῖν 在航海语境中既可侧重船只搁浅，也可侧重受风浪驱使而冲上岸。
lexical_decisions:
- source_word: δέ
  choice: 不过
  rationale: 表示承接中的轻微转折；结合上文，用“不过”自然地引出仍须发生的事。
- source_word: δεῖ
  choice: 必定会
  rationale: 保留“必须、势必要”的必然性；在这里这必然性与保罗所传达的神圣预告有关，但译文不额外明说其来源。
- source_word: ἡμᾶς
  choice: 我们
  rationale: 这是 δεῖ 加不定式结构中的逻辑主语，现代汉语自然译为“我们”。
- source_word: εἰς νῆσον τινα
  choice: 在某个岛上
  rationale: τινα 表示未指明的岛；与航海语境中的 ἐκπεσεῖν 合译为“在某个岛上搁浅”，既自然又保留地点的不确定性。
- source_word: ἐκπεσεῖν
  choice: 搁浅
  rationale: 该词在航海语境中可指船被冲离航向、冲上岸或搁浅；“搁浅”是简洁自然的现代汉语航海表达，脚注保留另一种可能的侧重。
theological_decisions:
- issue: δεῖ 所表达之必然性的来源
  choice: 译作“必定会”，保留强烈的必然性而不在正文补出来源
  alternative: 译作“必须”或补译为“按神的安排必须”
  rationale: 原文只明说必要性，并未在本句重述其神学来源；结合上下文可理解为神所预定或宣告的必然，但不宜在正文中增补。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“搁浅”准确契合航海语境；“某个岛”保留原文的不确定性。
