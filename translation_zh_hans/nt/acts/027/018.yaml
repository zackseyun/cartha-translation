    reason: lexical_alternative
lexical_decisions:
- source_word: σφοδρῶς
  choice: 猛烈地
  rationale: 该副词强化风暴造成的危急程度；“猛烈地”既自然，也传达强烈、危险的冲击。
- source_word: χειμαζομένων
  choice: 被风暴……颠簸
  rationale: 该被动分词表示遭遇风暴并受其侵袭；译文保留被动含义，并用现代汉语中适合船只处境的“颠簸”表达。
- source_word: ἡμῶν
  choice: 我们
  rationale: 与分词构成属格独立结构，汉语自然转换为以“我们”为主语的从句。
- source_word: τῇ ἑξῆς
  choice: 第二天
  rationale: 这是表示随后一天的常用时间表达；“第二天”简洁自然。
- source_word: ἐκβολὴν
  choice: 把货物抛进海里
  rationale: 该名词是航海用语，指为减轻船重而把船上物品抛出；“货物”由航海语境所含的通常意义补明，并以脚注说明。
- source_word: ἐποιοῦντο
  choice: 开始……抛
  rationale: 未完成时描写当时展开并持续的行动；结合叙事推进，译作“开始”可自然呈现行动的起始，同时避免生硬直译为“进行抛弃”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“被风暴猛烈地颠簸”保留原文的被动受袭状态；“抛进海里”符合现代汉语表达。脚注标记置于其实际解释的“抛货”动作之后。
