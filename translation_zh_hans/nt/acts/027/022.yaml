  text: καὶ τὰ νῦν παραινῶ ὑμᾶς εὐθυμεῖν, ἀποβολὴ γὰρ ψυχῆς οὐδεμία ἔσται ἐξ ὑμῶν πλὴν τοῦ πλοίου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/022.yaml
  text: And now I urge you to take courage[a], for there will be no loss of life among you[b], except for the ship.
translation:
  language: zh_hans
  text: 现在我劝你们振作起来[a]，因为你们中间没有一个人会丧命[b]；不过这艘船会损失。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“鼓起勇气”、“打起精神”或“保持勇气”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“不会有任何生命的损失”；这里的“生命”指肉身性命，并非特指灵魂。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ νῦν
  choice: 现在
  rationale: 这是惯用的时间表达，引出保罗此刻的劝勉；“现在”简洁自然。
- source_word: παραινῶ
  choice: 我劝
  rationale: 该词表示带有劝勉意味的建议；“我劝”既保留语气力度，也符合现代汉语表达。
- source_word: εὐθυμεῖν
  choice: 振作起来
  rationale: 该动词指保持良好精神、鼓起勇气；在海上风暴的处境中，“振作起来”自然地传达其含义。
- source_word: ἀποβολὴ
  choice: 损失／丧失
  rationale: 此处指遭受损失，而非字面意义上的“丢弃”；与ψυχῆς搭配时译为“丧命”，与船相对时译为“损失”。
- source_word: ψυχῆς
  choice: 人会丧命
  rationale: ψυχή在这里指肉身生命；译作“丧命”避免令人误以为专指非物质的“灵魂”。
- source_word: οὐδεμία ἔσται
  choice: 没有一个……会
  rationale: 保留未来时态及完全否定的强调，现代汉语表达清楚自然。
- source_word: ἐξ ὑμῶν
  choice: 你们中间
  rationale: 表示在这一群人之中无人丧命；“你们中间”符合汉语习惯。
- source_word: πλὴν τοῦ πλοίου
  choice: 只会损失这艘船
  rationale: πλήν引出例外；按汉语自然表达将含义明确为人员无损而船会损失，并避免“除了船”可能造成的搭配生硬。
theological_decisions:
- issue: ψυχή在本节中的所指
  choice: 按肉身生命理解，译作“丧命”
  alternative: 译作“灵魂”
  rationale: 风暴与沉船的上下文明确涉及人的生死，并非讨论灵魂与身体的区分。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“振作起来”适合危难中的劝勉语境；“没有一个人会丧命，只会损失这艘船”自然呈现原文中人员与船只的鲜明对照。
