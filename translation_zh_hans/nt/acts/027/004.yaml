  yaml_path: translation/nt/acts/027/004.yaml
  text: And from there[a], after putting out to sea, we sailed under the lee of Cyprus, because the winds were against us.
translation:
  language: zh_hans
  text: 我们从那里起航，沿塞浦路斯岛的背风一侧航行[a]，因为风势对我们不利。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们在塞浦路斯岛的背风一侧航行。”希腊语动词是航海用语，指船在岛屿的背风一侧航行。
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: 我们从那里
  rationale: 自然表达 καί 与 ἐκεῖθεν 所承接的叙事关系；中文以句序体现连接，不必生硬译出“于是又”。
- source_word: ἀναχθέντες
  choice: 开船
  rationale: ἀνάγω 在航海语境中指驶离港岸、出海；“开船”通俗自然，也不把动作过度具体化为“起锚”。
- source_word: ὑπεπλεύσαμεν
  choice: 沿着……的背风面航行
  rationale: ὑποπλέω 是航海用语，在此指从岛屿遮风的一侧航行；该译法既准确，又比音译式或含混的“从下面航行”清楚。
- source_word: τὴν Κύπρον
  choice: 塞浦路斯岛
  rationale: 采用现代汉语通行地名“塞浦路斯”，并补出“岛”以使航海地理关系清楚。
- source_word: διὰ τὸ τοὺς ἀνέμους εἶναι ἐναντίους
  choice: 因为风向对我们不利
  rationale: διά 加带冠词不定式结构表示原因；ἐναντίους 在航海语境中表示风势相逆。“风向对我们不利”自然传达逆风处境，而不必将复数形式机械译为“诸风”。
