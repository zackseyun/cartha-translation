  yaml_path: translation/nt/acts/027/030.yaml
  text: And when the sailors were seeking to escape from the ship and had lowered the skiff into the sea under the pretense of being about to lay out anchors from the bow[b][a],
translation:
  language: zh_hans
  text: 水手们正想逃离这船，便把小艇放到海里，假装要从船头[a]放下几只锚。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“船首”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τῶν ναυτῶν
  choice: 水手们
  rationale: 现代汉语中对船上操船人员最自然、明确的称呼。
- source_word: ζητούντων φυγεῖν
  choice: 想要逃离
  rationale: ζητέω接不定式在此表示企图或意图；结合弃船语境，“想要逃离”自然且不夸大行动是否成功。
- source_word: ἐκ τοῦ πλοίου
  choice: 逃离船只
  rationale: 按现代汉语习惯与φυγεῖν合译，清楚表达他们要弃船逃走。
- source_word: χαλασάντων τὴν σκάφην
  choice: 把小艇放到海里
  rationale: σκάφη指大船所带的小船；“小艇”比“救生艇”少一层现代设备含义，χαλάω则译为“放到”。
- source_word: προφάσει ὡς
  choice: 假装
  rationale: 该结构表明他们以虚假的理由掩饰真正企图；“假装”在中文中简洁自然。
- source_word: ἐκ πρῴρης
  choice: 从船头
  rationale: πρῷρα指船的前端；“船头”是普通读者易懂的现代用语，同时保留航海方位。
- source_word: ἀγκύρας μελλόντων ἐκτείνειν
  choice: 要……抛下锚来
  rationale: μέλλω表示即将或打算，ἐκτείνω在此航海语境中指把锚布放出去；“抛下锚”符合现代汉语表达，并保留复数概念的语境含义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“小艇”避免把古代船载小船具体化为现代“救生艇”；“船头”比技术性较强的“船首”更通俗，后者列入脚注。
