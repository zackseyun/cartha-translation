  text: Then all of them became encouraged and also took food[a][b].
translation:
  language: zh_hans
  text: 于是，大家都振作起来，自己也吃了些食物[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“他们自己也取用了食物”，强调众人跟着保罗的榜样进食。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὔθυμοι
  choice: 振作起来
  rationale: 该词表示变得有勇气、精神好转。结合此前众人的恐惧和保罗的劝勉，“振作起来”自然地表达士气恢复，同时避免“高兴起来”显得过于轻快。
- source_word: δὲ
  choice: 于是
  rationale: 这里主要推进叙事，并非表示强烈转折；“于是”也自然承接众人看到保罗进食之后的反应。
- source_word: γενόμενοι
  choice: 起来
  rationale: 与“振作”组合为“振作起来”，表达进入一种新的精神状态，符合该不定过去时分词与表语形容词的结构。
- source_word: πάντες
  choice: 大家都
  rationale: 明确表示船上全体人员，现代汉语中简洁自然。
- source_word: καὶ αὐτοὶ
  choice: 自己也
  rationale: 保留附加和强调意味，表明众人也照着保罗的榜样进食。
- source_word: προσελάβοντο
  choice: 吃了些
  rationale: 该动词与“食物”连用时实际指进食；译为“吃了些食物”比直译“取了食物”更符合现代汉语，同时“些”避免暗示吃完或吃饱。
- source_word: τροφῆς
  choice: 食物
  rationale: 这里指供人食用、补充体力的食物；“食物”准确且通俗。
