  text: And when they had eaten enough[c][b][a], they began to lighten the ship by throwing the wheat into the sea.
translation:
  language: zh_hans
  text: 他们吃饱以后[a]，就开始[c]把麦子[b]抛进海里，以减轻船的重量。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们吃得满足以后”或“他们吃足了食物以后”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“粮食”。原文用词可以泛指谷物，但此处很可能特指麦子。
    reason: lexical_alternative
  - marker: c
    text: 或译：“他们不断把麦子抛进海里，以减轻船的重量”或“他们把麦子抛进海里，以减轻船的重量”。原文的未完成时可以强调动作的过程，也可以强调动作的开始。
    reason: lexical_alternative
lexical_decisions:
- source_word: κορεσθέντες … τροφῆς
  choice: 吃饱以后
  rationale: 该短语表达因进食而得到饱足；用“吃饱以后”自然传达不定过去时分词的先行或时间关系，也保留“得到饱足”的含义。
- source_word: δὲ
  choice: 就
  rationale: 此处是推动叙事的轻微连接词；汉语用“就”自然衔接吃饱与随后采取的行动，不宜译成强转折。
- source_word: ἐκούφιζον τὸ πλοῖον
  choice: 开始减轻船的载重
  rationale: 未完成时可突出动作正在展开或开始发生；“开始减轻船的载重”既表达起始意味，也比直译“使船轻省”更符合现代汉语。
- source_word: ἐκβαλλόμενοι
  choice: 把……抛进
  rationale: 该现在时分词说明减轻载重的方式；汉语调整语序，以“把”字结构清楚呈现具体行动。
- source_word: τὸν σῖτον
  choice: 麦子
  rationale: σῖτος可泛指谷物，但常特指小麦；本段航运语境支持“麦子”，同时以脚注保留较宽泛的可能。
- source_word: εἰς τὴν θάλασσαν
  choice: 抛进海里
  rationale: 直接、自然地表达向海中的方向。
