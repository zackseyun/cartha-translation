  text: παρέστη γάρ μοι ταύτῃ τῇ ⸀νυκτὶ τοῦ θεοῦ, οὗ ⸀εἰμι, ᾧ καὶ λατρεύω, ⸀ἄγγελος
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/023.yaml
  text: For this very night an angel of the God to whom I belong and whom I also worship stood by me[b][a],
translation:
  language: zh_hans
  text: 因为就在今夜，我所归属、也所敬拜的上帝的一位天使站在我身旁。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρέστη
  choice: 站在我身旁
  rationale: 保留动词表示来到并站在旁边的空间意味；比“向我显现”少一层解释，同时符合本段天使突然临近保罗的叙事情境。
- source_word: γάρ
  choice: 因为
  rationale: 承接上文，为保罗的确信说明理由，清楚保留其解释性连接作用。
- source_word: ταύτῃ τῇ νυκτί
  choice: 就在今天夜里
  rationale: “就在”自然传达指示词所带的即时和强调意味。
- source_word: τοῦ θεοῦ
  choice: 那位上帝的
  rationale: 将属格理解为修饰“天使”，说明天使属于并受差于上帝；“那位”也自然引出随后两个修饰上帝的关系表达。
- source_word: οὗ εἰμι
  choice: 我所归属
  rationale: 希腊文直译为“我是属他的”；“我所归属”以现代汉语表达归属关系，又不额外强化其神学内涵。
- source_word: ᾧ καὶ λατρεύω
  choice: 也所敬拜
  rationale: λατρεύω用于上帝时通常指宗教性的侍奉或敬拜；“敬拜”清楚传达其神圣礼仪意味，并以脚注保留“事奉”这一可行译法。
- source_word: ἄγγελος
  choice: 一位天使
  rationale: 神所赐安慰与启示的叙事情境明确支持超自然使者之义，而非普通的人间信使。
theological_decisions:
- issue: οὗ εἰμι所表达的归属关系
  choice: 我所归属
  alternative: 我是属他的
  rationale: 正文采用自然的现代汉语表达保罗属于上帝，同时用脚注保存原文简洁而带张力的字面结构，不将其扩展为特定宗派的救恩论表述。
- issue: λατρεύω的宗教性含义
  choice: 敬拜
  alternative: 事奉
  rationale: “敬拜”凸显该动词指向上帝时的宗教性行为；但原词也可涵盖神圣的服侍，因此在脚注中保留“事奉”，避免把词义不必要地缩窄。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“就在今天夜里”保留原文的即时强调；“站在我身旁”保留空间意象。关系修饰语置于“那位上帝”之前，虽结构较长，但意思清楚，并保持原文中保罗既归属上帝又敬拜上帝的双重陈述。
