    text: 直译：“先把自己投下去，到陆地上去。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκατοντάρχης
  choice: 百夫长
  rationale: 这是罗马军官职衔在现代汉语圣经语境中的通行译法，简洁且准确。
- source_word: βουλόμενος
  choice: 想要
  rationale: 表达百夫长当时的意愿，语气自然，不把意愿强化为已经决定的意图。
- source_word: διασῶσαι
  choice: 救
  rationale: 此处指使保罗免遭杀害、保全其性命；“救”简明地传达该语境含义。
- source_word: ἐκώλυσεν αὐτοὺς τοῦ βουλήματος
  choice: 阻止他们实行那个打算
  rationale: 明确表达百夫长阻止士兵付诸行动；“那个打算”自然回指上一节杀死囚犯的打算。
- source_word: ἐκέλευσέν τε
  choice: 并下令
  rationale: 符合军官发出命令的叙事场景，也保留原文命令语气。
- source_word: τοὺς δυναμένους κολυμβᾶν
  choice: 会游泳的人
  rationale: 现代汉语自然简洁地标明船上具备游泳能力的那一群人。
- source_word: ἀπορίψαντας
  choice: 跳下船
  rationale: 原义是把自己从船上抛下；在此海难场景中，“跳下船”自然准确，且不必补入原文未明说的“海里”。
- source_word: πρώτους
  choice: 先
  rationale: 保留行动次序，表示会游泳者要在其他人之前离船。
- source_word: ἐπὶ τὴν γῆν ἐξιέναι
  choice: 游到岸上
  rationale: 结合会游泳者跳船的语境，以自然汉语表达从水中前往并登上陆地；具体动作由上下文合理补足。
