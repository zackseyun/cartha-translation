  text: τό τε πέλαγος τὸ κατὰ τὴν Κιλικίαν καὶ Παμφυλίαν διαπλεύσαντες κατήλθομεν εἰς Μύρα τῆς Λυκίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/005.yaml
  text: After sailing across the open sea along Cilicia and Pamphylia[b][a], we came down to Myra in Lycia.
translation:
  language: zh_hans
  text: 我们航过基利家和旁非利亚沿岸的外海[a]，就下到吕基亚的每拉[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“基利家和旁非利亚近海的外海”。
    reason: lexical_alternative
  - marker: b
    text: “下到”也可按旅行语境译作“抵达”；希腊原文直译为“下到”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πέλαγος
  choice: 外海
  rationale: 该词特指远离岸边或较开阔的海域；“外海”既保留航海语境中的具体含义，也符合现代汉语表达。
- source_word: τὸ κατὰ τὴν Κιλικίαν καὶ Παμφυλίαν
  choice: 基利家和旁非利亚一带的
  rationale: κατά加宾格在此描述与这两个沿海地区相对或沿其一带的航线；“一带的”自然表达地理关联，同时不把具体航线限定得过死。
- source_word: διαπλεύσαντες
  choice: 航行穿过
  rationale: 不定过去时分词表示先于主句动作完成的海上行程；汉语以顺承结构自然呈现其时间关系。
- source_word: κατήλθομεν
  choice: 我们……下到
  rationale: 保留κατέρχομαι的方向性“下来、下到”，没有直接改释为“抵达”；“就”清楚连接前后两个动作。
- source_word: Μύρα τῆς Λυκίας
  choice: 吕家的每拉
  rationale: 属格表明每拉位于吕家地区；“吕家的每拉”简洁保留原文结构，在现代汉语中仍可理解为地理隶属关系。
- source_word: τε
  choice: 隐含于句子衔接中
  rationale: τε在这里轻微承接上文，汉语无需另加实词，以自然的叙事连贯表达其功能。
