  language: zh_hans
  text: 我们驶到一个名叫高大[a]的小岛背风处，才勉强能够控制住船上的小艇。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从一个名叫高大的小岛背风面驶过。”原文采用航海用语，指船驶到岛屿遮挡风势的一侧。
    reason: lexical_alternative
lexical_decisions:
- source_word: νησίον ... τι
  choice: 一个……小岛
  rationale: νησίον 是指小岛的指小形式；译作“小岛”自然地保留其含义，τι 在此为不定指，无须另译为“某个”。
- source_word: δέ
  choice: （不单独译出）
  rationale: δέ 表示轻微的叙事转折或推进；中文借句序自然承接上文，若硬译“但是”反而可能加重对比。
- source_word: ὑποδραμόντες
  choice: 贴着……背风航行
  rationale: 这是航海用语，指船驶到岛屿遮挡风势的一侧；此译既表达航行动态，也明确岛屿提供避风条件，同时以脚注保存较直译的表达。
- source_word: καλούμενον Καῦδα
  choice: 名叫高大
  rationale: 按专名 Καῦδα 音译，并以现代中文自然表达其命名结构。
- source_word: ἰσχύσαμεν μόλις
  choice: 好不容易才
  rationale: 该组合表示仅勉强有能力完成后续动作；“好不容易才”自然表达艰难得手，而不误解为单纯体力不足。
- source_word: περικρατεῖς γενέσθαι
  choice: 控制住
  rationale: 意为取得掌控、成为其主人；在此指船员终于抓牢并控制小艇。“控制住”保留原文重点，未额外断定具体固定方式。
- source_word: τῆς σκάφης
  choice: 救生艇
  rationale: σκάφη 指附属于大船、当时很可能拖在船后的较小船只。中文“救生艇”使其用途和与大船的区别清楚，但不采用口语化的“小舢板”。
