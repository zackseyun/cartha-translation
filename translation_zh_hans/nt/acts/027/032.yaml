  yaml_path: translation/nt/acts/027/032.yaml
  text: Then the soldiers cut away the ropes of the skiff and let it fall off[a][b].
translation:
  language: zh_hans
  text: 于是，士兵们割断小艇的缆绳，任它漂走[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “漂走”也可译作“脱落”或“离船而去”；原文动词有“落出、脱离”的意思，在这里指小艇的缆绳被割断后离开大船。
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: 于是
  rationale: 表示叙事中紧接着发生的行动；“于是”在现代汉语中自然地兼顾时间推进和前后承接。
- source_word: ἀπέκοψαν
  choice: 割断
  rationale: 准确表达将绳索切断、使其分离的动作，也符合航海语境。
- source_word: οἱ στρατιῶται
  choice: 士兵们
  rationale: 直接对应复数主语，现代汉语清楚自然。
- source_word: τὰ σχοινία τῆς σκάφης
  choice: 小艇的缆绳
  rationale: σχοινία在此是系住船艇的绳索，译作“缆绳”切合航海场景；σκάφη指大船所带的较小船艇，译作“小艇”可与主船区分。
- source_word: εἴασαν αὐτὴν
  choice: 任它
  rationale: 保留ἐάω“让、任由”的许可性含义，代词明确回指小艇。
- source_word: ἐκπεσεῖν
  choice: 漂走
  rationale: ἐκπίπτω基本意象是脱离、落出；在本段海上语境中，小艇被割断缆绳后随海水离船而去，汉语“漂走”最自然，但以脚注保留较字面的理解。
