  text: ἐπιβάντες δὲ πλοίῳ Ἀδραμυττηνῷ ⸀μέλλοντι πλεῖν ⸀εἰς τοὺς κατὰ τὴν Ἀσίαν τόπους ἀνήχθημεν ὄντος σὺν ἡμῖν Ἀριστάρχου Μακεδόνος Θεσσαλονικέως·
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/002.yaml
  text: So we boarded an Adramyttian ship that was about to sail to the places along Asia, and put out to sea, with Aristarchus, a Macedonian from Thessalonica, being with us.
translation:
  language: zh_hans
  text: 于是，我们登上一艘来自亚大米田、正要开往亚细亚[a]沿岸各地[b]的船，便起航了。与我们同行的有马其顿的帖撒罗尼迦人亚里达古。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“亚细亚”指小亚细亚西部的罗马亚细亚行省，不是今天所说的亚洲。
    reason: cultural_note
  - marker: b
    text: 或译：“亚细亚沿岸的各港口”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιβάντες
  choice: 登上
  rationale: 在航海语境中指登船；“登上……船”自然，并保留其先于主句动作发生的次序。
- source_word: δὲ
  choice: 于是
  rationale: 此处承接上文、推进叙事，并无强烈转折；“于是”符合现代汉语叙事习惯。
- source_word: πλοίῳ Ἀδραμυττηνῷ
  choice: 一艘来自亚大米田的船
  rationale: 形容词表明船与亚大米田的归属或始发港关系；译作“来自亚大米田”比生造汉语地名形容词更清楚自然。
- source_word: μέλλοντι πλεῖν
  choice: 正要开往
  rationale: μέλλω加不定式可表示即将发生或计划中的行动；结合航程目的地，用“正要开往”简洁自然。
- source_word: εἰς τοὺς κατὰ τὴν Ἀσίαν τόπους
  choice: 开往亚细亚沿岸各地
  rationale: κατά加宾格在此具有沿着某一区域分布的地理含义；航海语境支持“沿岸各地”，但不在正文中进一步限定为“港口”，以免超出原文。
- source_word: Ἀσίαν
  choice: 亚细亚
  rationale: 此处指罗马的亚细亚行省；正文沿用圣经地名“亚细亚”，脚注说明其历史地理范围。
- source_word: ἀνήχθημεν
  choice: 我们就起航了
  rationale: ἀνάγω的被动形式在航海语境中是离港出航的惯用表达；汉语“起航”准确、流畅。
- source_word: ὄντος σὺν ἡμῖν
  choice: 同行的还有
  rationale: 属格独立结构表达伴随情况；“同行的还有”保留补充同行者的功能，同时避免生硬照搬结构。
- source_word: Ἀριστάρχου
  choice: 亚里达古
  rationale: 按现代中文圣经传统音译该人名。
- source_word: Μακεδόνος
  choice: 是马其顿人
  rationale: 该名词说明亚里达古的地域身份；以“是马其顿人”清楚表达。
- source_word: Θεσσαλονικέως
  choice: 一个帖撒罗尼迦人
  rationale: 原词指帖撒罗尼迦人；与“马其顿人”并列时，先给城市身份、后给较大地区身份，汉语较自然，也完整保留两项信息。
theological_decisions: []
