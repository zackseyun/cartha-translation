  text: Ὅτε δὲ ἡμέρα ἐγένετο, τὴν γῆν οὐκ ἐπεγίνωσκον, κόλπον δέ τινα κατενόουν ἔχοντα αἰγιαλὸν εἰς ὃν ⸀ἐβουλεύοντο εἰ ⸀δύναιντο ⸀ἐξῶσαι τὸ πλοῖον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/039.yaml
  text: When day came[a], they did not recognize the land, but they noticed a certain bay with a beach, into which they planned, if they could, to run the ship ashore.
translation:
  language: zh_hans
  text: 天亮时，他们认不出那片陆地，却看见一个有海滩的海湾；他们打算，如果办得到，就把船驶进那里，冲到岸上[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把船冲上岸。”这个希腊语动词指把船强行驶向岸边，使它冲到岸上。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅτε δὲ ἡμέρα ἐγένετο
  choice: 天亮以后
  rationale: 自然表达天光来临后的时间关系；δέ在此是轻微的叙事转接，无须另加生硬的连接词。
- source_word: τὴν γῆν οὐκ ἐπεγίνωσκον
  choice: 他们认不出那片陆地
  rationale: ἐπιγινώσκω在此指辨认或认出；γῆ直译为“陆地”，上下文自然涉及眼前的海岸地区。
- source_word: κόλπον δέ τινα κατενόουν
  choice: 却留意到一个……海湾
  rationale: κόλπος在航海语境中指海湾或港湾，τινα保留不特指意味；κατανοέω表达经过观察而注意到。
- source_word: ἔχοντα αἰγιαλὸν
  choice: 有海滩的
  rationale: αἰγιαλός指海岸或海滩；“海滩”具体且符合搁船上岸的场景，同时不擅自补出“沙质”。
- source_word: εἰς ὃν
  choice: 把船驶进海湾
  rationale: 以自然汉语明确εἰς的朝向及进入意味，并清楚交代关系代词所指的是海湾。
- source_word: ἐβουλεύοντο
  choice: 打算
  rationale: βουλεύομαι在此表示经过考虑而形成计划或意图；“打算”保留尚未付诸实现的意味。
- source_word: εἰ δύναιντο
  choice: 如果办得到
  rationale: 保留条件句所表达的能力与不确定性，避免将其说成已经决定或必能做到。
- source_word: ἐξῶσαι τὸ πλοῖον
  choice: 把船……冲上岸
  rationale: ἐξωθέω有推出、强行驱使之意；在此航海语境中指使船冲到岸上。“冲上岸”既传达用力驶船搁岸的动作，也符合现代汉语叙事。
