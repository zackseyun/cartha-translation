  text: μήτε δὲ ἡλίου μήτε ἄστρων ἐπιφαινόντων ἐπὶ πλείονας ἡμέρας, χειμῶνός τε οὐκ ὀλίγου ἐπικειμένου, λοιπὸν περιῃρεῖτο ⸂ἐλπὶς πᾶσα⸃ τοῦ σῴζεσθαι ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/020.yaml
  text: And when neither sun nor stars appeared for many days[a], and no small storm was pressing on us, from then on all hope of our being saved was gradually taken away.
translation:
  language: zh_hans
  text: 好些天来，太阳和星辰都没有显现，猛烈的风暴也不断地压在我们身上；此后，我们得以获救[a]的一切希望也逐渐被夺去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “获救”也可译作“得以逃生”。这里指从风暴和海难中保全性命。
    reason: 说明σῴζεσθαι在本段海难语境中的词义，并提供自然的译法选择。
lexical_decisions:
- source_word: μήτε…ἡλίου μήτε ἄστρων ἐπιφαινόντων
  choice: 太阳和星辰都没有出现
  rationale: ἐπιφαίνω在这里指天体显现或发光可见；“出现”自然地表达因阴云遮蔽而无法看见日月星辰的情形，也符合航海背景。
- source_word: ἐπὶ πλείονας ἡμέρας
  choice: 好些天
  rationale: 该短语表示持续多日；“好些天”是自然的现代汉语，并保留时间颇长的意味。
- source_word: χειμῶνός…οὐκ ὀλίγου
  choice: 猛烈的风暴
  rationale: χειμών在此航海语境中指暴风雨或恶劣天气，而非冬季；οὐκ ὀλίγου是曲言强调，直译“不小的”在汉语中较生硬，因此以“猛烈的”传达其强度。
- source_word: ἐπικειμένου
  choice: 一直压在我们身上
  rationale: 该分词描写风暴持续逼迫、重压众人的状态；“一直压在我们身上”既保留形象，也体现持续性。
- source_word: λοιπὸν
  choice: 到最后
  rationale: 这里标示事态发展到余下或最终阶段；“到最后”自然呈现由长期风暴所导致的绝望局面。
- source_word: περιῃρεῖτο
  choice: 渐渐消失了
  rationale: 未完成时被动态描写希望被逐步除去的过程；汉语用“渐渐消失了”自然表达持续丧失，而不误作瞬间事件。
- source_word: ἐλπὶς πᾶσα
  choice: 一切希望
  rationale: 保留πᾶσα所表达的全然性，说明并非只失去部分希望。
- source_word: τοῦ σῴζεσθαι ἡμᾶς
  choice: 我们获救
  rationale: 冠词不定式说明希望的内容；“获救”保留σῴζω较宽的语义，同时上下文清楚表明所指是海难中的性命保全。
theological_decisions:
- issue: 海难叙事中σῴζεσθαι的含义
  choice: 获救，即从风暴和海难中保全性命
  alternative: 得救；得以逃生
  rationale: 使徒行传27章的直接语境是风暴、沉船与生还，因此这里指身体和性命上的解救，不应在译文中擅自限定为属灵救恩；“获救”仍保留原词与其他语境的词汇联系。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“猛烈的风暴”把希腊语的曲言转化为汉语惯用表达；“渐渐消失”体现未完成时所呈现的过程。脚注标记置于其实际解释的“获救”之后。
