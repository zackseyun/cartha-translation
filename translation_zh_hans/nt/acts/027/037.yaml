  text: There were 276 persons in the ship in all[a].
translation:
  language: zh_hans
  text: 我们全船一共有二百七十六人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文可直译为：“我们，即船上所有的‘魂’，共有二百七十六。”这里的“魂”（也可指“性命”）在本句中指“人”或“人数”，并非专指非物质的灵魂。
    reason: 说明原文ψυχαί的字面形式及其在本句中的实际含义。
lexical_decisions:
- source_word: ἤμεθα
  choice: 我们……有
  rationale: 原文是第一人称复数“我们是／我们有”。汉语用“我们全船一共有”既自然，也保留叙述者本人在船上众人之中的含义。
- source_word: δὲ
  choice: 不单独译出
  rationale: 此处是轻微的叙事衔接语，并无明显转折；汉语承接上下文时省略更自然。
- source_word: αἱ πᾶσαι ψυχαὶ
  choice: 全船……人
  rationale: ψυχαί在人数统计中指一个个活人，即“人”，并非专指非物质的灵魂；πᾶσαι的总数含义由“全船一共”表达。
- source_word: ἐν τῷ πλοίῳ
  choice: 全船
  rationale: 以简洁自然的现代汉语表达“在船上”，并与人数总计的句式相配。
- source_word: διακόσιαι ἑβδομήκοντα ἕξ
  choice: 二百七十六
  rationale: 准确保留原文人数。正文采用中文数字，符合庄重、流畅的经文体例。
theological_decisions:
- issue: ψυχαί是否译作“灵魂”
  choice: 人
  alternative: 魂／性命
  rationale: 这里的词用于统计船上人数，所指是完整的人，并不是在区分人的物质与非物质部分。脚注保留原文措辞，避免遮蔽词汇形式。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“我们全船一共有”是常用的人数统计表达，同时保留原文第一人称复数和全体总数的意思。
