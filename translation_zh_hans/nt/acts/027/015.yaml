  text: συναρπασθέντος δὲ τοῦ πλοίου καὶ μὴ δυναμένου ἀντοφθαλμεῖν τῷ ἀνέμῳ ἐπιδόντες ἐφερόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/015.yaml
  text: And when the ship was caught and could not face the wind[a], we gave way and were driven along.
translation:
  language: zh_hans
  text: 船被风卷住，无法迎风而行；我们只好任由它随风漂流。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们便顺势而为，任船被风带着前行。”
    reason: ἐπιδόντες可表示顺势让步，ἐφερόμεθα则表示持续被外力带动；此译较直白地保留二者的组合。
lexical_decisions:
- source_word: συναρπασθέντος
  choice: 被风裹住
  rationale: 该不定过去时被动分词表示船突然受外力控制；结合上下文，译为“被风裹住”既体现被动和突发性，也不把后文所说的持续漂行提前说尽。
- source_word: τοῦ πλοίου
  choice: 船
  rationale: “船”是现代汉语中自然、清楚的对应词，适合本段航海叙事。
- source_word: μὴ δυναμένου
  choice: 无法
  rationale: 表达船在当时客观上没有能力采取后述行动，汉语用“无法”简洁自然。
- source_word: ἀντοφθαλμεῖν
  choice: 迎风而行
  rationale: 该动词本有“正面对着、迎着”的含义，在航海语境中指船无法顶着风势前进；“迎风而行”比字面译作“面对风”更符合现代汉语。
- source_word: τῷ ἀνέμῳ
  choice: 风
  rationale: 原词本身是“风”，虽上下文描述暴风，仍不在此处强化为“狂风”或“烈风”。
- source_word: ἐπιδόντες
  choice: 只好任风摆布
  rationale: 航海语境中表示不再抵抗而任由风势作用；补出“只好”传达情势所迫，“任风摆布”自然呈现顺势放任的动作。
- source_word: ἐφερόμεθα
  choice: 随风漂去
  rationale: 未完成时被动形式描写船持续受外力带动；“随风漂去”保留被动、持续且失去自主航向的意味。
- source_word: δέ
  choice: （不另译）
  rationale: δέ在此承接叙事；本节作为独立引文时，汉语不必机械加“于是”或“而”，句意仍连贯。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“迎风而行”和“随风漂去”清楚呈现航行情境，避免生硬的逐词对应；不加入原文未明说的神学解释。
