  yaml_path: translation/nt/acts/027/040.yaml
  text: And after casting off the anchors[a], they left them in the sea; at the same time loosening the ropes of the rudders, and hoisting the foresail to the wind[b], they made for the beach.
translation:
  language: zh_hans
  text: 他们弃下锚，让锚留在海里；同时松开舵桨的系索[a]，又升起船头的帆[b]，借着风向海滩驶去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“舵桨的系带”或“舵桨的固定物”；希腊语采用一个罕见的航海词，指固定操舵装置之物。
    reason: lexical_alternative
  - marker: b
    text: 或译“前帆”或“上帆”；这个希腊航海词具体指哪一种帆，不能确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: περιελόντες
  choice: 解开
  rationale: 该不定过去时分词表示先行的动作；在此航海语境中是解除锚的固定、将其放弃。原文未明确说割断锚索，因此不译作“砍断”。
- source_word: ἀγκύρας
  choice: 锚
  rationale: 普通航海名词，原文为复数；现代汉语以集合性名词“锚”表达已足够自然，后文重复“把锚留在海里”以明确宾语。
- source_word: εἴων εἰς τὴν θάλασσαν
  choice: 把锚留在海里
  rationale: ἐάω在这里表示任其留下或放弃；译文清楚表明水手没有收回锚。
- source_word: ἅμα
  choice: 同时
  rationale: 明确表达随后几个船上动作是同时进行的。
- source_word: ἀνέντες
  choice: 松开
  rationale: 表示解除先前的捆扎或固定；与“系索”搭配自然。
- source_word: ζευκτηρίας
  choice: 系索
  rationale: 这是罕见的航海术语，指系住或固定操舵装置之物；“系索”简洁易懂，同时脚注保留“系带、固定物”的可能。
- source_word: τῶν πηδαλίων
  choice: 舵桨的
  rationale: 古代船只通常用船尾两侧的操舵桨控制方向；“舵桨”比现代船舵更贴近历史实物，又能让普通读者理解其功能。
- source_word: ἐπάραντες
  choice: 升起
  rationale: 在帆船语境中表示把帆升起；现代汉语自然明白。
- source_word: ἀρτέμωνα
  choice: 船头的帆
  rationale: 该罕见航海词所指的具体帆型存在争议；正文采用描述性的宽泛表达，避免把不确定的船帆结构说得过于确定。
- source_word: τῇ πνεούσῃ
  choice: 迎风
  rationale: 原文为“向着正在吹的〔风〕”，省略了所修饰的名词；“升起……迎风”自然表达让帆受风的动作，不额外规定风向。
- source_word: κατεῖχον εἰς τὸν αἰγιαλόν
  choice: 向海滩驶去
  rationale: κατέχω在这里具有航海中朝目标把持航向的意思；αἰγιαλός特指海滩或岸滩，而不只是泛称陆岸。
