revisions:
- from: 一连多日，我们航行缓慢，好不容易才来到革尼土对面。由于风不容我们继续前行[a]，我们便从克里特岛背风的一侧航行[b]，经过撒摩尼附近。
  to: 一连多日，我们航行缓慢，好不容易才来到革尼土对面。由于风不容我们继续前行[a]，我们便在撒摩尼附近，沿着克里特岛的背风面航行[b]。
