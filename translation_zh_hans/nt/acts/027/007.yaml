  text: ἐν ἱκαναῖς δὲ ἡμέραις βραδυπλοοῦντες καὶ μόλις γενόμενοι κατὰ τὴν Κνίδον, μὴ προσεῶντος ἡμᾶς τοῦ ἀνέμου, ὑπεπλεύσαμεν τὴν Κρήτην κατὰ Σαλμώνην,
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/007.yaml
  text: For many days we were sailing slowly[a], and with difficulty we came opposite Cnidus. Since the wind did not allow us to go farther, we sailed under the lee of Crete[b], off Salmone.
translation:
  language: zh_hans
  text: 一连多日，我们航行缓慢，好不容易才来到革尼土对面。由于风不容我们继续前行[a]，我们便在撒摩尼附近，沿着克里特岛的背风面航行[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“由于风不容我们靠近。”原文也可能泛指风不容船继续按原航线前进。
    reason: lexical_alternative
  - marker: b
    text: 直译“在克里特之下航行”，指沿岛的背风面、受岛屿遮蔽的一侧航行。
    reason: cultural_note
lexical_decisions:
- source_word: ἐν ἱκαναῖς δὲ ἡμέραις
  choice: 一连多日
  rationale: ἐν加时间与格在此表示持续的一段时间；“一连多日”自然地传达航程长期受阻。
- source_word: βραδυπλοοῦντες
  choice: 我们航行缓慢
  rationale: 保留该分词明确的航海意象和行进缓慢之意，并与随后表示艰难的μόλις区分。
- source_word: μόλις γενόμενοι κατὰ τὴν Κνίδον
  choice: 好不容易才来到革尼土对面
  rationale: μόλις表达艰难、勉强；κατά加宾格在此航海语境中指来到与革尼土相对的海面。
- source_word: μὴ προσεῶντος ἡμᾶς τοῦ ἀνέμου
  choice: 由于风不容我们继续前行
  rationale: 该属格独立结构说明改变航线的原因；προσεάω可指容许接近或前进，正文采用符合上下文的自然表达，并以脚注保留词义范围。
- source_word: ὑπεπλεύσαμεν τὴν Κρήτην
  choice: 我们便从克里特岛背风的一侧航行
  rationale: ὑποπλέω在航海语境中指沿岛屿受遮蔽的下风侧航行；译文明确其实际含义，同时脚注保留字面形式。
- source_word: κατὰ Σαλμώνην
  choice: 经过撒摩尼附近
  rationale: κατά与海岸地标连用，表示船行至该岬角附近或外海；“经过……附近”是清楚自然的现代汉语。
- source_word: Κνίδον / Κρήτην / Σαλμώνην
  choice: 革尼土／克里特岛／撒摩尼
  rationale: 采用现代中文圣经地名中较易辨识的通行译名；为克里特补出“岛”以帮助普通读者理解地理关系。
