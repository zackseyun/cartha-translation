  yaml_path: translation/nt/acts/027/008.yaml
  text: And with difficulty coasting along it[a], we came to a certain place called Fair Havens, near which was a city named Lasea.
translation:
  language: zh_hans
  text: 我们好不容易才沿着克里特岛的海岸航行[a]，来到一个名叫“佳港”的地方；附近有一座名叫拉西亚的城。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们勉强沿着克里特岛的海岸航行，来到……”。希腊语“沿着……航行”是航海用语，指贴近海岸行船。
    reason: lexical_alternative
lexical_decisions:
- source_word: μόλις
  choice: 十分艰难
  rationale: 表达航程是在很大困难下才得以推进，保留叙事中航行受阻的强调；现代汉语自然明晰。
- source_word: τε
  choice: （由句势承接）
  rationale: 该连接词承接上文；汉语连续叙事无须机械译作“并且”，通过句序自然体现连接。
- source_word: παραλεγόμενοι
  choice: 沿着……岸边航行
  rationale: 此处是航海用语，指贴近海岸航行；明确译出“岸边”，比笼统的“经过”更准确。
- source_word: αὐτήν
  choice: 克里特岛
  rationale: 代词回指上文的克里特岛。汉语若只译“它”略显含混，明示所指有助理解，并未增添原文之外的对象。
- source_word: ἤλθομεν
  choice: 来到
  rationale: 直接表达抵达所述地点，符合汉语旅行叙事。
- source_word: εἰς τόπον τινά
  choice: 一个……地方
  rationale: 保留 τινά 的不定性，同时避免较生硬的“某一个地方”。
- source_word: καλούμενον
  choice: 名叫
  rationale: 自然引出地名，准确对应“被称为”。
- source_word: Καλοὺς Λιμένας
  choice: 佳港
  rationale: 按希腊地名的含义译出“良好/优美的港湾”，采用简洁且已有中文圣经传统基础的地名形式。
- source_word: ᾧ ἐγγὺς ἦν πόλις Λασαία
  choice: 附近有一座城，名叫拉西亚
  rationale: 保留地点邻近关系和 πόλις 的不定表达；将关系结构转为自然汉语分句。
