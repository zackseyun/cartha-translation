    issue: “而不听保罗所说的话”可能被读作彻底不听从保罗。
    rationale: μᾶλλον…ἢ 表示比较，不必然断言百夫长完全没有听取或考虑保罗的意见；“而不是”更准确保留比较关系。
  - severity: low
    issue: 脚注译文“受保罗所说的话劝服”搭配略生硬。
    rationale: 可改用“与保罗所说的话相比，他更受……劝服”，既保留较直接的“受劝服”译法，也使汉语句法自然。
  revised_text: 但百夫长更听信掌船的和船主，而不是保罗所说的话。[a]
