  text: ὁ δὲ ἑκατοντάρχης τῷ κυβερνήτῃ καὶ τῷ ναυκλήρῳ ⸂μᾶλλον ἐπείθετο⸃ ἢ τοῖς ⸀ὑπὸ Παύλου λεγομένοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/011.yaml
  text: But the centurion paid more attention to the pilot and the shipowner than to what was being said by Paul[a].
translation:
  language: zh_hans
  text: 但百夫长更听信掌船的和船主，而不是保罗所说的话。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“与保罗所说的话相比，百夫长更受掌船的和船主劝服。”
    reason: 保留 ἐπείθετο 可较直接译为“受劝服”的词义选择，以及原文比较结构。
lexical_decisions:
- source_word: ἑκατοντάρχης
  choice: 百夫长
  rationale: 这是罗马军官的标准中文历史称谓，准确且为普通读者熟悉。
- source_word: κυβερνήτῃ
  choice: 掌船的
  rationale: 指负责操舵、航行的人；用“掌船的”既自然，也避免与表示船主或主要经营者的 ναύκληρος 混同。
- source_word: ναυκλήρῳ
  choice: 船主
  rationale: 在此通常指船的所有者或主要经营者，与“掌船的”保留角色上的区别。
- source_word: μᾶλλον ἐπείθετο
  choice: 更听信
  rationale: 兼顾 μᾶλλον 的比较意义和 ἐπείθετο 所表达的受劝服、采信之意，也符合此处作航行决定的语境。
- source_word: τοῖς ὑπὸ Παύλου λεγομένοις
  choice: 保罗所说的话
  rationale: 自然表达带冠词的被动分词结构，焦点落在保罗提出的劝告内容上。
- source_word: δὲ
  choice: 但
  rationale: 明确承接上文并表现百夫长的反应与保罗警告之间的转折。
- source_word: ἢ
  choice: 而不
  rationale: 与“更听信”配合，清楚表达 μᾶλλον…ἢ 的比较结构。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“百夫长”为通行历史称谓；“掌船的”与“船主”区分两种海事角色。正文用“更听信……而不听……”自然传达比较和采信之意，脚注保留较形式对应的译法。
