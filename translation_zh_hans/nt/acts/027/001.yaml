  text: Ὡς δὲ ἐκρίθη τοῦ ἀποπλεῖν ἡμᾶς εἰς τὴν Ἰταλίαν, παρεδίδουν τόν τε Παῦλον καί τινας ἑτέρους δεσμώτας ἑκατοντάρχῃ ὀνόματι Ἰουλίῳ σπείρης Σεβαστῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/001.yaml
  text: When it was decided that we should sail for Italy[a], they handed over both Paul and some other prisoners to a centurion named Julius, of the Augustan Cohort.
translation:
  language: zh_hans
  text: 当决定让我们乘船前往意大利时，他们把保罗和另外一些囚犯交给一名名叫犹流、隶属奥古斯都营[a]的百夫长。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“皇帝营”；也可能是“塞巴斯特营”。希腊文“塞巴斯特”是与奥古斯都或皇帝有关的称号，但这里具体指哪一支部队，尚不能确定。
    reason: 保留σπείρης Σεβαστῆς在称号含义及具体历史单位上的不确定性。
lexical_decisions:
- source_word: Ὡς δὲ ἐκρίθη
  choice: 既然已经决定
  rationale: ἐκρίθη是不定过去时被动语态，在这里以无人称方式表示已经作出的决定；“既然……决定”自然承接上文，并保留ὡς δὲ在此所表达的情境衔接，而不另加原文没有的“现在”。
- source_word: τοῦ ἀποπλεῖν ἡμᾶς εἰς τὴν Ἰταλίαν
  choice: 让我们乘船前往意大利
  rationale: 带冠词的不定式说明决定的内容；“乘船前往”体现ἀποπλεῖν的海路含义，“我们”保留叙述者转入第一人称复数的措辞。
- source_word: παρεδίδουν
  choice: 他们就把……交给
  rationale: 表示将人正式移交监管；“交给”是现代汉语中清楚自然的表达。希腊文未明说主语，中文用“他们”保留其不特指性质。
- source_word: τόν τε Παῦλον καί τινας ἑτέρους δεσμώτας
  choice: 保罗和另外一些囚犯
  rationale: τε…καί连接保罗与其他囚犯；汉语直接用“和”已能自然表达并列，“另外一些”准确反映τινας ἑτέρους。
- source_word: ἑκατοντάρχῃ ὀνόματι Ἰουλίῳ
  choice: 一名百夫长，名叫犹流
  rationale: 与格标明接收监管者；“一名”适合首次引入此人。“百夫长”是通行且易懂的罗马军职译名，“犹流”采用中文圣经人名的惯用形式。
- source_word: σπείρης Σεβαστῆς
  choice: 御营
  rationale: σπεῖρα指罗马军队的营级单位，Σεβαστή可指“奥古斯都的”或“皇帝的”。“御营”简洁传达与皇帝相关的军队称号；因具体历史单位不能确定，以脚注保留较直译及地名解释的可能。
theological_decisions:
- issue: σπείρης Σεβαστῆς这一历史上存在争议的军队称号如何翻译
  choice: 御营
  alternative: “奥古斯都营”，或“塞巴斯特营”
  rationale: 这不是教义性术语，但确切所指仍有历史疑问。正文以自然简洁的“御营”表达它与皇帝称号的关联，脚注则保留字面称号和可能作为地名理解的方案，避免把不确定的历史辨认说成定论。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“既然已经决定”承接上下文；句序稍作汉语化处理，把所属军营置于百夫长之前。脚注标记[a]已在正文“御营”之后出现。
