  text: καὶ τῇ τρίτῃ αὐτόχειρες τὴν σκευὴν τοῦ πλοίου ⸀ἔρριψαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/019.yaml
  text: And on the third day they threw the ship’s gear overboard with their own hands[a].
translation:
  language: zh_hans
  text: 第三天，他们亲手把船上的器具抛进海里。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们自己把船上的装备抛了出去。”
    reason: 保留αὐτόχειρες可译为“自己”，以及σκευή可译为“装备”的表达选择。
lexical_decisions:
- source_word: τῇ τρίτῃ
  choice: 第三天
  rationale: 这是序数词与定冠词构成的时间用法；汉语以“第三天”自然表达经文所指的时间。
- source_word: αὐτόχειρες
  choice: 亲手
  rationale: 该词强调船上的人亲自用自己的手执行这项工作；“亲手”简洁自然，并保留其强调意味。
- source_word: τὴν σκευὴν τοῦ πλοίου
  choice: 船上的器具
  rationale: 在航海语境中，σκευή指船所用的器具或装备。“船上的器具”通俗清楚，也不把所指范围过度限定为某一种专门设备。
- source_word: ἔρριψαν
  choice: 抛进海里
  rationale: 动词本义是“扔、抛”；结合船只遇险的上下文，动作方向显然是从船上抛入海中，译文将这一语境信息自然明示。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通俗的叙事语言。“亲手”突出原文的强调，“器具”则避免使用普通读者可能不熟悉的航海术语。
