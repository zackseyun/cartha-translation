  text: κἀκεῖ εὑρὼν ὁ ⸀ἑκατοντάρχης πλοῖον Ἀλεξανδρῖνον πλέον εἰς τὴν Ἰταλίαν ἐνεβίβασεν ἡμᾶς εἰς αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/006.yaml
  text: There the centurion found an Alexandrian ship sailing for Italy[a], and he put us on board it.
translation:
  language: zh_hans
  text: 在那里，百夫长找到一艘开往意大利的亚历山大的船，便安排我们登上那艘船。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κἀκεῖ
  choice: 在那里
  rationale: 该词由连接词与地点副词组合而成，可译为“并且在那里”或“在那里”；中文叙事以“在那里”自然承接上文，连接关系仍清楚。
- source_word: εὑρὼν
  choice: 找到
  rationale: 不定过去时分词表示先于主句发生的动作；译成顺承的限定动词“找到”，符合现代汉语表达。
- source_word: ἑκατοντάρχης
  choice: 百夫长
  rationale: 这是罗马军队军官职衔的传统且准确译名，现代中文读者也较熟悉。
- source_word: πλοῖον Ἀλεξανδρῖνον
  choice: 一艘……亚历山大船
  rationale: 形容词可指船来自亚历山大或隶属该地；“亚历山大船”简洁保留这种地理关联，不进一步限定。
- source_word: πλέον εἰς τὴν Ἰταλίαν
  choice: 开往意大利的
  rationale: 现在时分词与目的地短语说明船正在航行或航向意大利；“开往”是自然的现代汉语航运用语，也保留目的地含义。
- source_word: ἐνεβίβασεν ἡμᾶς εἰς αὐτό
  choice: 就让我们上了船
  rationale: 动词带使役意义，表示使人登船；“让我们上了船”自然清楚，并体现百夫长安排众人登船。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“在那里……就……”清楚呈现先找到船、后安排登船的动作顺序；不添加原文没有说明的船籍、货船性质或具体航行状态。
