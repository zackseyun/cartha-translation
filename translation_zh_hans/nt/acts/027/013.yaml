  rationale: 修订仅提升中文的自然性和对叙事判断的准确传达：以“已如愿”避免把“取得所求”误读为已经完成整个行程或目标；以“近岸航行”自然表达比较副词在航海语境中的靠近海岸之意。其余译法均忠实于原文，故不增设脚注。
