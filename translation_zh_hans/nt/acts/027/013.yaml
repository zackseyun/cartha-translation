  yaml_path: translation/nt/acts/027/013.yaml
  text: And when a south wind began to blow gently[a], thinking that they had obtained their purpose, they weighed anchor and sailed along Crete[c][b], close inshore.
translation:
  language: zh_hans
  text: 这时，南风轻轻吹起；他们以为已如愿，便起锚，沿着克里特岛近岸航行。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑποπνεύσαντος
  choice: 轻轻吹起
  rationale: 该词描述风轻柔地吹动；“吹起”在本语境中也自然表达风开始吹的意味。
- source_word: νότου
  choice: 南风
  rationale: νότος在此指从南方吹来的风；汉语用“南风”简洁自然。
- source_word: δόξαντες
  choice: 他们以为
  rationale: 这里表示船员基于当时情势作出的主观判断，并不保证判断正确。
- source_word: τῆς προθέσεως κεκρατηκέναι
  choice: 已经达成了目的
  rationale: 该结构表达他们认为预定目标已经实现或计划已经有把握完成；“达成了目的”保留了πρόθεσις的目标、意图之义。
- source_word: ἄραντες
  choice: 起锚
  rationale: αἴρω本义为“提起”，航海语境中省略的宾语是锚；“起锚”是准确而自然的汉语航海表达。
- source_word: ἆσσον
  choice: 贴近岸边
  rationale: 该比较副词意为“更近”；结合沿岛岸航行的语境，指船靠近岸边。
- source_word: παρελέγοντο
  choice: 沿着……航行
  rationale: 该词在航海用法中指沿海岸航行；此译清楚表达船沿克里特岛岸线前进。
- source_word: τὴν Κρήτην
  choice: 克里特岛
  rationale: 原文直接以克里特为宾语；加入汉语地名常用的“岛”不改变所指，并使表达自然明确。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“起锚”保留航海语境的准确性；“他们以为”保留叙事中人的判断与随后事态之间的张力。原文不存在需要以脚注标示、且会实质影响理解的异文或不可兼顾歧义，因此不设脚注。
