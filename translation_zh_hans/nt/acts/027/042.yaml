lexical_decisions:
- source_word: βουλὴ ἐγένετο
  choice: 打算
  rationale: 此处表达士兵们形成的计划或主意；现代汉语用“打算”简洁自然，也保留尚未实施之意。
- source_word: τοὺς δεσμώτας
  choice: 囚犯
  rationale: 指受拘押、被押送的人；“囚犯”符合本段航运押解语境。
- source_word: ἐκκολυμβήσας διαφύγῃ
  choice: 游水逃脱
  rationale: ἐκκολυμβάω表示游泳离开或游水脱身，διαφεύγω表示成功逃脱；合译可保留动作及目的结果。
