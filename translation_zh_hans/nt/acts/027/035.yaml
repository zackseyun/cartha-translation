id: ACT.27.35
reference: Acts 27:35
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ⸀εἴπας δὲ ταῦτα καὶ λαβὼν ἄρτον εὐχαρίστησεν τῷ θεῷ ἐνώπιον πάντων καὶ κλάσας ἤρξατο ἐσθίειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/035.yaml
  text: And after saying these things and taking bread[a], he gave thanks to God in the presence of all, and after breaking it, he began to eat.
translation:
  language: zh_hans
  text: 说完这些话，他拿起饼来，在众人面前[a]感谢神；掰开后，就开始吃。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“当着大家的面”。
    reason: 说明ἐνώπιον πάντων可用较口语化的方式表达；两种译法都强调这一行为是在所有人面前公开进行。
lexical_decisions:
- source_word: εἴπας δὲ ταῦτα
  choice: 说完这些话
  rationale: 不定过去时分词表示先于主要动作发生的行为；“说完”自然体现先后次序。δέ在这里是轻微的叙事连接，中文无需另加“但是”等显著转折词。
- source_word: λαβὼν ἄρτον
  choice: 拿起饼来
  rationale: ἄρτον未带冠词，既不明确指整块饼，也不强调数量；“饼”保持原文的概括性，“拿起……来”符合现代汉语叙事表达。
- source_word: εὐχαρίστησεν τῷ θεῷ
  choice: 感谢神
  rationale: 直接表达εὐχαριστέω与间接受词τῷ θεῷ的通常含义，简洁而庄重。
- source_word: ἐνώπιον πάντων
  choice: 在众人面前
  rationale: 表达行为公开发生、众人都在场看见的含义；不把它解释为向众人致谢。
- source_word: κλάσας
  choice: 掰开后
  rationale: 不定过去时分词表示在开始吃以前先把饼掰开；中文可依前文自然省略宾语，同时仍清楚指向“饼”。
- source_word: ἤρξατο ἐσθίειν
  choice: 就开始吃
  rationale: 保留ἄρχομαι加不定式所表达的起始意义；“就”使动作承接自然。
theological_decisions:
- issue: “拿饼—感谢神—掰开—吃”是否应译出圣餐含义
  choice: 按船上公开进食的叙事动作平实翻译，不在正文中加入“圣餐”等术语
  alternative: 采用更具礼仪色彩的传统圣餐措辞，或直接说明这是圣餐
  rationale: 这些动作可能使读者联想到圣餐相关叙事，但本节没有明确称此举为圣餐。平实翻译既保留可能的呼应，也不把特定教义判断加入原文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“说完……拿起……感谢……掰开……开始吃”清楚保留原文动作顺序。代词“他”承接上下文中的保罗，不在本节额外补出专名。脚注标记置于其实际对应的短语“在众人面前”之后；英文咨询层中标记虽出现在bread之后，但脚注内容显然对应ἐνώπιον πάντων。
