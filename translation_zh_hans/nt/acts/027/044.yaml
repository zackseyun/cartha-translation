  text: καὶ τοὺς λοιποὺς οὓς μὲν ἐπὶ σανίσιν οὓς δὲ ἐπί τινων τῶν ἀπὸ τοῦ πλοίου· καὶ οὕτως ἐγένετο πάντας διασωθῆναι ἐπὶ τὴν γῆν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/044.yaml
  text: and the rest[a], some on planks and some on pieces from the ship. And so it happened that all were brought safely to land.
translation:
  language: zh_hans
  text: 其余的人，有的靠着木板，有的靠着从船上来的某些东西。就这样，所有人都平安上了岸。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “都平安上了岸”也可译作“都获救上了岸”或“都安全逃到岸上”。这里的希腊语动词指众人在海难中脱险。
    reason: lexical_alternative
lexical_decisions:
- source_word: τοὺς λοιποὺς
  choice: 其余的人
  rationale: 指上一节尚未提到的其余众人；此译法自然，并保留群体中剩余部分的含义。
- source_word: οὓς μὲν ... οὓς δὲ
  choice: 有的……有的……
  rationale: 准确表达希腊语相关结构对其余众人的分组，符合现代汉语叙事习惯。
- source_word: ἐπὶ σανίσιν
  choice: 靠着木板
  rationale: σανίς指木板；介词短语在海难语境中表示借助木板浮行。“靠着”自然表达这种方式，又不具体断定他们采取了何种姿势。
- source_word: ἐπί τινων τῶν ἀπὸ τοῦ πλοίου
  choice: 靠着船上的一些东西
  rationale: 原文只笼统指来自船上的某些物件，没有明确说是船体碎片；此译法保留其不确定性。
- source_word: οὕτως
  choice: 就这样
  rationale: 承接前述众人借助不同物件离船的方式，并引出最终结果。
- source_word: ἐγένετο
  choice: （由“就这样”及结果句共同表达）
  rationale: 这里的γίνομαι引出事情最终实现的结果；汉语无需机械译作“事情发生了”，用“就这样”连接结果更自然。
- source_word: πάντας διασωθῆναι
  choice: 所有人都平安
  rationale: διασῴζω在此指众人经历海难后安全脱险。译作“平安”清楚体现实际处境中的保全，避免无根据地突出属灵救恩含义。
- source_word: ἐπὶ τὴν γῆν
  choice: 上了岸
  rationale: γῆ在航海语境中指与海相对的陆地；“上了岸”是简洁自然的现代汉语表达。
theological_decisions:
- issue: διασωθῆναι是否带有属灵救恩含义
  choice: 按海难语境译为“平安上了岸”
  alternative: “都获救上了岸”或“都安全逃到岸上”
  rationale: 上下文明确叙述船难中的身体保全。译文保留“脱离危险并安全抵岸”的核心意思，而不加入此处原文语境没有明说的属灵救恩主张。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“船上的一些东西”刻意保留原文对物件种类的不确定性；句式简洁，延续使徒行传海难叙事的推进感。
