  text: ἣν ἄραντες βοηθείαις ἐχρῶντο ὑποζωννύντες τὸ πλοῖον· φοβούμενοί τε μὴ εἰς τὴν Σύρτιν ἐκπέσωσιν, χαλάσαντες τὸ σκεῦος, οὕτως ἐφέροντο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/017.yaml
  text: After hoisting it up[a], they used supporting cables to undergird the ship; and fearing that they might run aground on the Syrtis[c][b], they lowered the sea anchor and so were driven along.
translation:
  language: zh_hans
  text: 他们把小船拉上来以后，就用缆索从船底兜住船身，加以巩固。他们又怕船搁浅在赛尔提斯浅滩[a]，便放下船具[b]，船就这样随风漂流。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 赛尔提斯是北非海岸外一片以沙洲和浅滩著称的危险水域。
    reason: cultural_note
  - marker: b
    text: “船具”所指不详；也可能是帆具、索具或海锚。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἣν ἄραντες
  choice: 他们把小船拉上来以后
  rationale: 关系代词ἣν回指上一节的小船；中文明确补出“小船”可避免代词指向含混。ἄραντες表示先于主要动作发生的举起或拉上动作。
- source_word: βοηθείαις ἐχρῶντο ὑποζωννύντες τὸ πλοῖον
  choice: 就用缆索从船底兜住船身，加以巩固
  rationale: βοηθείαις在航海语境中指加固船体的辅助装置，具体做法是以缆索环兜船体；译文既表达技术动作，也保持现代中文易懂。
- source_word: μὴ εἰς τὴν Σύρτιν ἐκπέσωσιν
  choice: 船搁浅在赛尔提斯浅滩
  rationale: ἐκπίπτω在此指船被冲到危险水域而搁浅；Σύρτις是北非沿岸以沙洲和浅滩著称的地名。
- source_word: χαλάσαντες τὸ σκεῦος
  choice: 便放下船具
  rationale: σκεῦος本义宽泛，可指器具、装备或船具；所指究竟是海锚、帆具还是其他设备并不确定，因此正文保留原文的概括性。
- source_word: οὕτως ἐφέροντο
  choice: 任船这样被风吹着漂流
  rationale: 未完成时被动形式表示船持续受外力带动；上下文表明主要外力是风。“漂流”自然表达无法自主控制航向的状态。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通俗的叙事语言。“从船底兜住船身”具体呈现古代航海中用缆索加固船体的动作；对τὸ σκεῦος不作过度确定的技术性解释，并以脚注保留其词义歧义。
