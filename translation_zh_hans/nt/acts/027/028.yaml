  text: καὶ βολίσαντες εὗρον ὀργυιὰς εἴκοσι, βραχὺ δὲ διαστήσαντες καὶ πάλιν βολίσαντες εὗρον ὀργυιὰς δεκαπέντε·
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/028.yaml
  text: And after taking soundings[a], they found twenty fathoms; then after going a little farther and taking soundings again, they found fifteen fathoms.
translation:
  language: zh_hans
  text: 他们测量水深，测得二十噚[a]；又前行了一小段，再次测量水深，测得十五噚。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “噚”是量水深的单位，一噚约为1.8米。原文所说的测量，是把系有铅锤的测深索投入水中。
    reason: 解释古代航海长度单位及测深方法，帮助普通读者理解。
lexical_decisions:
- source_word: βολίσαντες
  choice: 测量水深
  rationale: 该词在航海语境中指用测深索投铅测量海水深度；译为“测量水深”自然清楚，并保留具体动作的功能含义。
- source_word: εὗρον
  choice: 测得
  rationale: 此处表示测量所得的结果；“测得”比直译“发现”更符合现代汉语航海测量语境。
- source_word: ὀργυιὰς
  choice: 噚
  rationale: ὀργυιά是约等于六英尺的长度单位，在此用于水深；“噚”是现代汉语中对应 fathom 的航海单位。
- source_word: εἴκοσι
  choice: 二十
  rationale: 直接翻译数词。
- source_word: βραχὺ
  choice: 不远
  rationale: 此处作副词，表示两次测量之间经过的距离很短；与“往前走了”搭配自然。
- source_word: διαστήσαντες
  choice: 往前走了
  rationale: 在航行叙事中表示继续前行、拉开一小段距离，并非静态的“分开”。
- source_word: πάλιν
  choice: 再次
  rationale: 明确表示测量动作重复发生。
- source_word: δεκαπέντε
  choice: 十五
  rationale: 直接翻译数词。
- source_word: καὶ ... δὲ ... καὶ
  choice: ……；又……，再次……
  rationale: 这一连接结构主要推进叙事，δὲ在此不必译出强烈转折；用分号和“又”体现先后衔接。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而清楚的现代标准汉语。“测得”简洁表达两次测深所得的结果；保留航海单位“噚”，并以脚注说明其近似公制长度和操作方式。
