id: ACT.7.34
reference: Acts 7:34
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἰδὼν εἶδον τὴν κάκωσιν τοῦ λαοῦ μου τοῦ ἐν Αἰγύπτῳ, καὶ τοῦ στεναγμοῦ ⸀αὐτοῦ ἤκουσα, καὶ κατέβην ἐξελέσθαι αὐτούς· καὶ νῦν δεῦρο ⸀ἀποστείλω σε εἰς Αἴγυπτον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/034.yaml
  text: I have surely seen the mistreatment of my people in Egypt[a], and I have heard their groaning, and I have come down to deliver them. And now come[b], I will send you to Egypt.
translation:
  language: zh_hans
  text: “我确实看见了我在埃及的百姓所受的虐待[a]，也听见了他们的呻吟；我下来是要搭救他们[b]。现在，来吧！我要差遣你到埃及去。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “虐待”也可译作“苦害”或“压迫”。
    reason: lexical_alternative
  - marker: b
    text: “搭救”也可译作“救出”或“解救”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν εἶδον
  choice: 我确实看见了
  rationale: 分词与限定动词重复同一词根，构成带有闪语色彩的强调表达，并呼应《出埃及记》3:7。译作“确实看见了”既传达强调，也符合现代汉语习惯。
- source_word: κάκωσιν
  choice: 所受的虐待
  rationale: 该词指恶劣对待、压迫或由此造成的苦难。“所受的虐待”清楚表达百姓是恶待的承受者，同时不把含义限定为某一种政治压迫。
- source_word: λαοῦ μου τοῦ ἐν Αἰγύπτῳ
  choice: 我在埃及的百姓
  rationale: 保留“我的百姓”所含的归属关系，并自然表达限定短语“在埃及的”。“百姓”庄重而通俗，也适合此处的群体所指。
- source_word: τοῦ στεναγμοῦ αὐτοῦ
  choice: 他们的呻吟
  rationale: 希腊文代词为单数，与作为集合名词的“百姓”呼应；现代汉语用复数“他们”指群体更自然。“呻吟”保留因受苦而发出的痛苦声音。
- source_word: κατέβην
  choice: 我下来
  rationale: 直接保留神说自己“下来”的拟人性空间语言，不将它解释为较抽象的“介入”或“施行拯救”。
- source_word: ἐξελέσθαι
  choice: 要搭救他们
  rationale: 此处中动不定式表示从危险或困境中救出。“搭救”是自然、明确的现代汉语，也保留主动救援的意味。
- source_word: δεῦρο
  choice: 来吧
  rationale: 该指示性用语在这里具有命令或召唤作用；“来吧”简洁自然，并能引出对摩西的差遣。
- source_word: ἀποστείλω σε εἰς Αἴγυπτον
  choice: 我要差遣你到埃及去
  rationale: 将将来时直译为“我要”，并以“差遣”表达受托执行使命；“到埃及去”符合汉语表达目的地的习惯。
theological_decisions:
- issue: 神“下来”的拟人性表述
  choice: 我下来
  alternative: 我降临／我介入
  rationale: 原文以空间动作描写神亲自采取行动。译文保留这一措辞及其神学张力，不将其抽象化，也不额外解释神如何“下来”。
- issue: ἐξελέσθαι所表达的拯救行动
  choice: 搭救他们
  alternative: 拯救他们／救他们脱离苦境
  rationale: “搭救”准确表达从危难中救出，又不额外补出原文未明说的脱离对象；“拯救”虽可行，但在现代语境中更容易带上专门的神学色彩。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。保留神谕中的强调、拟人性“下来”以及差遣语气。将与“搭救”有关的脚注标在相应词语之后，以准确对应其词汇说明。
