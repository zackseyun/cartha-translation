  text: κράξαντες δὲ φωνῇ μεγάλῃ συνέσχον τὰ ὦτα αὐτῶν, καὶ ὥρμησαν ὁμοθυμαδὸν ἐπ’ αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/057.yaml
  text: But crying out with a loud voice[a], they covered their ears and rushed together at him,
translation:
  language: zh_hans
  text: 他们却大声喊叫，捂住自己的耳朵，一齐[a]向他冲去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“同心一致地”。希腊语副词 ὁμοθυμαδόν 强调他们行动一致。
    reason: lexical_alternative
lexical_decisions:
- source_word: κράξαντες
  choice: 大声喊叫
  rationale: 不定过去时分词表示高声呼喊；汉语用连动结构自然地衔接后续动作，不额外限定为尖叫或哀号。
- source_word: δὲ
  choice: 却
  rationale: 表示叙事中的轻微转折，突出众人对司提反所见异象的敌对反应。
- source_word: φωνῇ μεγάλῃ
  choice: 大声
  rationale: 以自然现代汉语表达“用很大的声音”，同时保留音量强烈的含义。
- source_word: συνέσχον τὰ ὦτα αὐτῶν
  choice: 捂住自己的耳朵
  rationale: 该表达指把耳朵堵住、不肯再听；“捂住”清楚而自然，“自己的”对应 αὐτῶν，并避免指代含混。
- source_word: ὥρμησαν
  choice: 冲去
  rationale: 表达突然且有力地扑向目标；“冲去”保留动作力度，又不额外加入原文未明说的暴力程度。
- source_word: ὁμοθυμαδὸν
  choice: 一齐
  rationale: 表示众人以共同意向采取一致行动；“一齐”简洁自然，脚注补明其齐心一致的语义。
- source_word: ἐπ’ αὐτόν
  choice: 向他
  rationale: ἐπί 加宾格在此表示动作朝向某人；“向他冲去”符合现代汉语习惯，并由语境自然显出敌意。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。以“却”呈现转折，以连动句保留原文一连串迅速发生的动作；脚注标记紧接“一齐”，准确对应 ὁμοθυμαδόν。
