source:
  edition: SBLGNT
  text: οὗτός ἐστιν ὁ γενόμενος ἐν τῇ ἐκκλησίᾳ ἐν τῇ ἐρήμῳ μετὰ τοῦ ἀγγέλου τοῦ λαλοῦντος αὐτῷ ἐν τῷ ὄρει Σινᾶ καὶ τῶν πατέρων ἡμῶν, ὃς ἐδέξατο ⸀λόγια ζῶντα δοῦναι ⸀ἡμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/038.yaml
  text: This is the one who was in the assembly in the wilderness with the angel who was speaking to him on Mount Sinai[a], and with our fathers[c][b]; he received living oracles to give to us.
translation:
  language: zh_hans
  text: 这位就是那在旷野的会众中、与那在西奈山上对他说话的天使和我们的列祖[a]同在的人；他领受了有生命的话语[b]，要给我们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “列祖”指以色列人的先辈；也可译作“我们的祖先”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“活的神谕”或“赐生命的话语”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκκλησίᾳ
  choice: 会众
  rationale: 指旷野中聚集的以色列民；“会众”自然且贴近基本词义，又避免把后来的制度性“教会”概念直接带入此处。
- source_word: ἐρήμῳ
  choice: 旷野
  rationale: 符合以色列旷野经历的圣经语境，比“沙漠”更准确、自然。
- source_word: ἀγγέλου
  choice: 天使
  rationale: 西奈山语境所指是属天的使者，译作“天使”最为直接。
- source_word: λαλοῦντος
  choice: 对他说话的
  rationale: 用定语从句自然表达希腊文现在分词，并保留当时说话这一动态场景。
- source_word: ὄρει Σινᾶ
  choice: 西奈山
  rationale: 采用现代汉语中通行的地名形式。
- source_word: πατέρων ἡμῶν
  choice: 我们的先祖
  rationale: 此处指以色列人的列祖；“先祖”在现代汉语中庄重自然，并保留群体历史传承的含义。
- source_word: ἐδέξατο
  choice: 领受了
  rationale: “领受”适合摩西接受神圣启示的语境，也准确表达接受所得之物。
- source_word: λόγια
  choice: 圣言
  rationale: λόγια在这里指来自神的启示性言语；“圣言”比普通的“话语”更能表达其神圣来源，又比“神谕”更少引发现代汉语中的异教联想。
- source_word: ζῶντα
  choice: 活的
  rationale: 直接保留“有生命、活着”的表述，不将其提前解释为单一的“赐生命”。
- source_word: δοῦναι
  choice: 要传给
  rationale: 在启示传递的语境中，“传给”比机械的“给”更自然，表达摩西领受后交付给百姓的目的。
- source_word: ἡμῖν
  choice: 我们
  rationale: 保留司提反将自己和听众置于以色列共同历史中的第一人称复数。
- source_word: ὁ γενόμενος
  choice: 在一起的那一位
  rationale: 结合三个介词关系，用现代汉语自然表达摩西当时置身会众、天使和先祖中间；不采用生硬的“成为”。
theological_decisions:
- issue: ἐκκλησίᾳ用于旷野中的以色列时是否应译作“教会”
  choice: 会众
  alternative: 教会；聚会
  rationale: 经文首先描述旷野中聚集的以色列民。“会众”保留集合体含义，不预先断定其与新约教会在制度或神学上的同一性。
- issue: λόγια ζῶντα是否应解释性地译为“赐生命的话”
  choice: 活的圣言
  alternative: 活的话语；赐生命的圣言；活的神谕
  rationale: “活的圣言”保留原文的紧凑表达和神学张力，既可指这些言语本身是活的，也不排除其带来生命的含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“这人就是……那一位”延续本段对摩西的强调；第二句单列，使长句层次清楚。脚注标记均已在正文中出现。
