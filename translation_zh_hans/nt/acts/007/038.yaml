revisions:
- from: 这人就是在旷野的会众中，同那在西奈山上对他说话的天使，以及我们的先祖[a]在一起的那一位。他领受了活的圣言[b]，要传给我们。
  to: 这位就是那在旷野的会众中、与那在西奈山上对他说话的天使和我们的列祖[a]同在的人；他领受了有生命的话语[b]，要给我们。
  rationale: 修订使句法更准确地呈现摩西在旷野会众中、与天使和列祖同在的关系；将“传给”改为“给”以贴近 δοῦναι；并以更自然、较少教派色彩的“有生命的话语”译 λόγια ζῶντα。脚注锚点均保留并与相应词语对应。
