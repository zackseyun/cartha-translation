  text: καὶ ἐκβαλόντες ἔξω τῆς πόλεως ἐλιθοβόλουν. καὶ οἱ μάρτυρες ἀπέθεντο τὰ ἱμάτια ⸀αὐτῶν παρὰ τοὺς πόδας νεανίου καλουμένου Σαύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/058.yaml
  text: And after they had driven him out of the city[a], they were stoning him. And the witnesses laid their outer garments at the feet of a young man called Saul.
translation:
  language: zh_hans
  text: 他们把他赶出城外后，正用石头打他。那些证人把自己的外衣[a]放在一个名叫扫罗的年轻人脚边。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“衣服”或“斗篷”；希腊语所用的词广指外层衣物。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκβαλόντες
  choice: 把他赶出……
  rationale: 不定过去时分词表示先于主句发生的动作；“赶出”自然地表达了强行驱逐。
- source_word: ἔξω τῆς πόλεως
  choice: 城外
  rationale: 与“赶出”连用，简洁表达从城内被逐到城外的方向。
- source_word: ἐλιθοβόλουν
  choice: 用石头打他
  rationale: 符合现代汉语表达；上下文已呈现持续进行的投石行为，不必生硬加入“正在”或“不断”。
- source_word: οἱ μάρτυρες
  choice: 作证的人
  rationale: 此处指司法情境中作证并参与行刑的人；“作证的人”比可能带有教会术语色彩的“见证人”更清楚，也避免误解为“殉道者”。
- source_word: ἀπέθεντο
  choice: 放在
  rationale: 在衣物与“脚前”的搭配中自然表达脱下后放置的动作。
- source_word: τὰ ἱμάτια αὐτῶν
  choice: 自己的外衣
  rationale: ἱμάτια广指外层衣物；反身领属在汉语中用“自己的”表达自然、明确。
- source_word: παρὰ τοὺς πόδας
  choice: 脚前
  rationale: 自然、庄重地表达把物品放在某人脚边或脚旁。
- source_word: νεανίου
  choice: 一个……年轻人
  rationale: 准确表达相对年轻的男性，符合现代汉语。
- source_word: καλουμένου Σαύλου
  choice: 名叫扫罗的
  rationale: “名叫”是现代汉语中表达此希腊分词结构的自然说法。
theological_decisions:
- issue: 行刑场景中 μάρτυρες 的身份
  choice: 译作“作证的人”，按司法意义理解
  alternative: 译作“殉道者”或带教会职分色彩的“见证人”
  rationale: 本段中的 μάρτυρες 是参与司法程序的证人；译成“殉道者”会把该词后来形成的教会含义带入当前叙事。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“就”衔接先行的驱逐动作与随后展开的投石行为；全句避免文言化表达，同时保留司法场景及叙事推进。脚注标记紧随其所说明的“外衣”。
