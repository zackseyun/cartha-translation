  text: καὶ εἶπεν· Ἰδοὺ θεωρῶ τοὺς οὐρανοὺς ⸀διηνοιγμένους καὶ τὸν υἱὸν τοῦ ἀνθρώπου ἐκ δεξιῶν ἑστῶτα τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/056.yaml
  text: And he said[a], “Look, I see the heavens opened[b], and the Son of Man standing at the right hand of God.”
translation:
  language: zh_hans
  text: 他说：“看哪，我看见诸天敞开着[a]，人子[b]站在上帝的右边。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“诸天已经被打开”。希腊文使用完成时被动分词，强调在司提反的异象中，诸天已经开启，并仍处于敞开的状态。
    reason: lexical_alternative
  - marker: b
    text: “人子”是具有弥赛亚意义的称号，与《但以理书》7:13相呼应。
    reason: cross_reference
lexical_decisions:
- source_word: Ἰδοὺ
  choice: 看哪
  rationale: 用现代中文仍可自然理解的郑重感叹语，引起听者注意，并保留司提反宣告异象时的即时性。
- source_word: θεωρῶ
  choice: 我看见
  rationale: 表达现在进行中的亲眼观看，符合异象语境，又不额外强化为解释性的措辞。
- source_word: τοὺς οὐρανοὺς
  choice: 诸天
  rationale: 保留希腊文复数及其神学语域；“天空”容易把异象压缩为自然景象。
- source_word: διηνοιγμένους
  choice: 敞开着
  rationale: 希腊文为完成时被动分词，表示诸天已经被打开并处于敞开的状态；“敞开着”以自然中文呈现这一结果状态。
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: 人子
  rationale: 保留公认的基督论称号及其与《但以理书》7:13的呼应，不改写为较具解释性的“那位属人的”。
- source_word: ἐκ δεξιῶν
  choice: 在……的右边
  rationale: 自然表达尊荣和权柄的位置，同时保留经文传统意象；不扩写其象征意义。
- source_word: ἑστῶτα
  choice: 站
  rationale: 准确保留耶稣站立的姿态，不与其他经文常见的“坐在”表述调和。
- source_word: τοῦ θεοῦ
  choice: 上帝的
  rationale: 直接表达属格关系，不作无根据的增补。
theological_decisions:
- issue: 基督论称号 υἱὸς τοῦ ἀνθρώπου
  choice: 人子
  alternative: 那位属人的
  rationale: “人子”既贴近原文，也在中文圣经语境中明确保留其与《但以理书》及耶稣自称的互文关系。
- issue: 升高之耶稣的姿态
  choice: 站在上帝的右边
  alternative: 在上帝右边站立着
  rationale: 原文明说“站着”，因此不改为更常见的“坐在上帝右边”；译文保留此处特有的姿态及其神学张力。
- issue: 诸天被开启后的状态
  choice: 诸天敞开着
  alternative: 诸天已经被打开
  rationale: 译文体现完成时被动分词所强调的结果状态，同时避免断定经文没有说明的行动者或开启时刻。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“看哪”保留感叹的迫切感；“诸天”保留原文复数和异象语域；整体语序自然，并将脚注标记放在各自所解释的词语之后。
