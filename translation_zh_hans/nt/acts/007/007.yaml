source:
  edition: SBLGNT
  text: καὶ τὸ ἔθνος ᾧ ⸀ἐὰν ⸀δουλεύσουσιν κρινῶ ἐγώ, ⸂ὁ θεὸς εἶπεν⸃, καὶ μετὰ ταῦτα ἐξελεύσονται καὶ λατρεύσουσίν μοι ἐν τῷ τόπῳ τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/007.yaml
  text: And I will judge the nation that they will serve[a], God said[b], and after these things they will come out and worship me in this place.
translation:
  language: zh_hans
  text: 上帝说：“他们将要服侍[a]的那一国，我要审判；此后，他们要出来，在这地方敬拜我[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “服侍”也可译作“作奴仆服侍”或“受……奴役”。原文用的是“服侍”这一动词，但上下文指以色列人在埃及受奴役。
    reason: lexical_alternative
  - marker: b
    text: “敬拜我”也可译作“事奉我”。原文动词可指向上帝献上宗教性的服侍或敬拜。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθνος
  choice: 国
  rationale: 这里指奴役亚伯拉罕后裔的政治共同体；“国”简洁自然，也符合《创世记》15:14的呼应。
- source_word: ᾧ ἐὰν δουλεύσουσιν
  choice: 他们将要服侍的
  rationale: 保留 δουλεύω“服侍、作奴仆”的动词表达；上下文明确涉及受奴役，因此在脚注说明较强的奴役含义。
- source_word: κρινῶ ἐγώ
  choice: 我要审判
  rationale: 既保留 κρίνω 的司法意象，也借“我”体现原文显式主语 ἐγώ 所带的强调。
- source_word: ὁ θεὸς εἶπεν
  choice: 上帝说
  rationale: 清楚保留引语中的说话者标示；按现代汉语习惯置于引语之前。
- source_word: μετὰ ταῦτα
  choice: 此后
  rationale: 自然、庄重地表达前述事件之后的时间次序。
- source_word: ἐξελεύσονται
  choice: 他们要出来
  rationale: 保留“从……出来”的出离方向，呼应以色列脱离奴役之地。
- source_word: λατρεύσουσίν μοι
  choice: 敬拜我
  rationale: λατρεύω 用于对上帝的宗教性服侍；“敬拜”在现代汉语中能清楚传达这一含义。
- source_word: ἐν τῷ τόπῳ τούτῳ
  choice: 在这地方
  rationale: 直接保留 τόπος 与指示词 τούτῳ，不替读者判定具体所指。
theological_decisions:
- issue: 奴役语境中的 δουλεύω
  choice: 服侍
  alternative: 作奴仆／受奴役
  rationale: 正文保留原文的动词形式和“向某对象服侍”的结构，同时以脚注交代埃及奴役语境，避免淡化压迫，也不把原文直接改写成被动式。
- issue: 对上帝所用的 λατρεύω
  choice: 敬拜我
  alternative: 事奉我
  rationale: 该词在这里表示献给上帝的宗教性服侍；“敬拜”清楚表达其神圣礼仪含义，“事奉”则作为可成立的词义另列。
- issue: “这地方”的指向
  choice: 保留“这地方”
  alternative: 明确解释为西奈山、圣地或圣殿所在地
  rationale: 原文没有在本句内明确解释所指，且司提反的引述形成互文张力，因此不在正文中替读者消除歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“那一国”比“那个国家”略具经文语体色彩，但仍属当代通顺表达；引语标示按汉语习惯前置。
