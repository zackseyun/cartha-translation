  text: ‘难道你想像昨天杀那个埃及人那样杀我吗？’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ ... θέλεις
  choice: 难道你想……吗
  rationale: μὴ引导预期否定回答的疑问；“难道……吗”自然传达质问语气，同时保留问句形式。
- source_word: ἀνελεῖν / ἀνεῖλες
  choice: 杀 / 杀
  rationale: 在本语境中，ἀναιρέω明确指杀死；前后使用同一动词，保留原文的重复与指控力度。
- source_word: ὃν τρόπον
  choice: 像……一样
  rationale: 表达“以同样方式、正如”的比较关系，符合现代汉语习惯。
- source_word: ἐχθὲς
  choice: 昨天
  rationale: 直接对应时间副词，位置置于“杀那个埃及人”之前，表达自然。
- source_word: τὸν Αἰγύπτιον
  choice: 那个埃及人
  rationale: 定冠词在叙事语境中指向双方都知道的特定埃及人；“那个”在汉语中清楚体现这一特指。
