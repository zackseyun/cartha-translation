- source_word: κατέβη
  choice: 下到
  rationale: 保留动词“下去”的方向含义，也符合前往埃及的传统地理表达。
- source_word: Ἰακώβ
  choice: 雅各
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: εἰς Αἴγυπτον
  choice: 到埃及
  rationale: 自然表达进入或前往埃及；与“下到”连用，完整传达移动方向。
- source_word: ἐτελεύτησεν
  choice: 死了
  rationale: 直接、清楚地表达死亡，不采用委婉说法。
- source_word: αὐτός
  choice: 他
  rationale: 明确保留希腊文中的代词，所指为雅各。
- source_word: οἱ πατέρες ἡμῶν
  choice: 我们的列祖
  rationale: “列祖”在庄重而易懂的现代中文里可指以色列历史中的先祖，并较好保留 πατέρες 的父系历史色彩。
theological_decisions:
- issue: 在以色列历史语境中如何翻译 πατέρες
  choice: 我们的列祖
  alternative: 我们的祖先／我们的父辈
  rationale: “列祖”既保留原文所指的以色列先辈，也避免把它泛化为不带历史色彩的祖先；脚注说明其字面含义和可选译法，不额外引入宗派解释。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“后来”使两个并列句所表达的时间推进在中文中更自然；分号保留从雅各下埃及到他与列祖去世之间的叙事分界。
