  text: καὶ οὐκ ἔδωκεν αὐτῷ κληρονομίαν ἐν αὐτῇ οὐδὲ βῆμα ποδός, καὶ ἐπηγγείλατο δοῦναι αὐτῷ εἰς κατάσχεσιν αὐτὴν καὶ τῷ σπέρματι αὐτοῦ μετ’ αὐτόν, οὐκ ὄντος αὐτῷ τέκνου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/005.yaml
  text: And he gave him no inheritance in it[a], not even a foot's length, but promised to give it to him as a possession, and to his offspring after him[b], though he had no child.
translation:
  language: zh_hans
  text: 他没有在那地赐给亚伯拉罕任何产业，连一脚之地[a]也没有；却应许要把那地赐给亚伯拉罕以及他以后的后裔作产业，尽管[b]亚伯拉罕还没有孩子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一脚之地”是希腊语习语，意思是连最小的一片土地也没有。
    reason: lexical_alternative
  - marker: b
    text: “尽管”也可译为“当……时”。希腊语结构可以表示时间；这里的语境则突出亚伯拉罕虽没有孩子，却领受了关于后裔的应许。
    reason: alternative_reading
lexical_decisions:
- source_word: κληρονομίαν
  choice: 产业
  rationale: 既保留所得之地的法律和承受含义，也符合亚伯拉罕蒙应许得地的语境；比“财产”更能体现土地应许。
- source_word: οὐδὲ βῆμα ποδός
  choice: 连一脚之地也没有
  rationale: 这是表示最小一片土地的希腊习语。此译保留“脚”的形象，又以现代汉语自然表达“丝毫土地也没有”。
- source_word: ἐπηγγείλατο
  choice: 应许
  rationale: 准确表达上帝所作的郑重承诺，并符合圣经土地应许的语境。
- source_word: εἰς κατάσχεσιν
  choice: 作产业
  rationale: 表达将那地交给亚伯拉罕占有、持有的结果；与前面的“产业”形成清楚而自然的呼应。
- source_word: σπέρματι
  choice: 后裔
  rationale: 这里是集合意义，指亚伯拉罕以后所出的子孙；“后裔”在现代汉语中自然，也能承载亚伯拉罕之约的用语。
- source_word: μετ’ αὐτόν
  choice: 他以后的
  rationale: 清楚表达亚伯拉罕之后的世代承继关系，并与“后裔”自然搭配。
- source_word: οὐκ ὄντος αὐτῷ τέκνου
  choice: 尽管当时亚伯拉罕还没有孩子
  rationale: 属格独立结构可陈述时间或伴随情形；上下文突出应许与无子状态之间的反差，因此正文采用让步表达，同时以“当时”保留其时间背景。
- source_word: τέκνου
  choice: 孩子
  rationale: τέκνον不限于儿子；“孩子”准确保留其广义，也避免添加性别信息。
theological_decisions:
- issue: 亚伯拉罕无子与上帝应许之间的关系
  choice: 尽管当时亚伯拉罕还没有孩子
  alternative: 当时亚伯拉罕还没有孩子
  rationale: 希腊语结构本身可作时间性理解，但司提反叙述中的重点是上帝在亚伯拉罕尚无孩子时仍应许把地赐给他的后裔。正文呈现让步张力，脚注同时保留较中性的时间读法。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。为避免连续代词造成指代含混，两次明说“亚伯拉罕”；保留土地应许与当时无子之间的张力。
