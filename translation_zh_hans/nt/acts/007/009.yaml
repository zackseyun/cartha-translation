  text: Καὶ οἱ πατριάρχαι ζηλώσαντες τὸν Ἰωσὴφ ἀπέδοντο εἰς Αἴγυπτον· καὶ ἦν ὁ θεὸς μετ’ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/009.yaml
  text: And the patriarchs, being jealous of Joseph, sold him into Egypt; and God was with him,
translation:
  language: zh_hans
  text: 先祖们因嫉妒约瑟，把他卖到埃及；神与他同在。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πατριάρχαι
  choice: 众先祖
  rationale: 这里特指雅各的众子，即以色列民族的奠基先祖。“众先祖”既保留其历史身份，也比“族长们”更自然易懂。
- source_word: ζηλώσαντες
  choice: 因嫉妒约瑟
  rationale: 该分词在此说明卖掉约瑟的动机；“因嫉妒”准确表达 ζηλόω 在本语境中的负面情感和因果关系。
- source_word: ἀπέδοντο
  choice: 把他卖
  rationale: 结合《创世记》背景，此动词指将约瑟卖掉；明确译作“卖”比泛化的“交出去”更准确。
- source_word: εἰς Αἴγυπτον
  choice: 到埃及
  rationale: εἰς 表示朝向或进入某地；汉语“卖到埃及”自然地表达约瑟被卖后去往埃及的结果。
- source_word: ἦν ὁ θεὸς μετ’ αὐτοῦ
  choice: 神与他同在
  rationale: 简洁保留原文关于神临在的陈述；“他”的所指清楚，无须重复“约瑟”。
theological_decisions:
- issue: 约瑟受害时神的同在
  choice: 但神与他同在
  alternative: 并且神与他同在
  rationale: 原文 καί 连接两句，但语境形成明显反差：先祖出于嫉妒卖掉约瑟，神仍与他同在。“但”自然呈现这一语篇张力，却不进一步解释神的护理或苦难的意义。
translation_notes:
  register: 采用现代、庄重而通顺的书面汉语。“众先祖”兼顾历史神学含义与普通读者的可理解性；全句保持简洁，并突出人的背叛与神同在之间的反差。
