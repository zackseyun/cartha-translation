  naturalness: “众先祖”可理解，但现代汉语中“先祖们”更自然。“卖到埃及”通顺；以分号连接后句，庄重简洁，也保留原文并列叙述所形成的含蓄张力。
  terminology: πατριάρχαι在此指雅各的儿子们，即以色列的先祖；“先祖们”准确且易懂，不把该词误解为一般意义的祖先或现代社会语境的“族长”。“神与他同在”是固定而自然的圣经汉语表达。
