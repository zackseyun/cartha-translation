  text: εἶπεν δὲ αὐτῷ ὁ κύριος· Λῦσον τὸ ὑπόδημα τῶν ποδῶν σου, ὁ γὰρ τόπος ⸀ἐφ’ ᾧ ἕστηκας γῆ ἁγία ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/033.yaml
  text: Then the Lord said to him[a], ‘Take off the sandals from your feet, for the place on which you are standing is holy ground.’
translation:
  language: zh_hans
  text: 主对他说：“把你脚上的鞋脱下来[a]，因为你所站的地方是圣地。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“解开你脚上的鞋。”
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: 主
  rationale: 按新约希腊文 κύριος 译作“主”，既保持敬称，也不把希腊文本未明示的四字神名形式引入译文。
- source_word: Λῦσον
  choice: 脱下来
  rationale: λύω 字面有“解开、松开”之意；用于鞋履时，现代汉语自然表达为“脱下来”。
- source_word: τὸ ὑπόδημα τῶν ποδῶν σου
  choice: 你脚上的鞋
  rationale: ὑπόδημα 在希腊文中为单数，ποδῶν 为复数；汉语“鞋”本身不标明单复数，可自然保留原文的概括表达，并避免擅自明确为一只或两只。
- source_word: ὁ γὰρ τόπος ἐφ’ ᾧ ἕστηκας
  choice: 因为你所站的地方
  rationale: “因为”表达 γάρ 的解释关系；“你所站的地方”自然呈现 ἐφ’ ᾧ ἕστηκας，其中完成时在这里表示当前站立的状态。
- source_word: γῆ ἁγία
  choice: 圣地
  rationale: γῆ 在此指脚下特定地点的地面；“圣地”是简洁庄重的现代汉语表达，谓语结构也自然体现该地为圣。
theological_decisions:
- issue: 在出埃及记显现事件的引文中如何翻译 κύριος
  choice: 主
  alternative: 耶和华
  rationale: 本节现存希腊文写的是 κύριος，并未直接出现四字神名；译作“主”遵循新约原文，同时保留其神圣身份与旧约引文背景。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“把……脱下来”符合口语习惯，“你所站的地方是圣地”保持经文的肃穆语气。无需脚注；“鞋”在汉语中不强制标示单复数，因此可保存希腊文形式上的张力而不显生硬。
