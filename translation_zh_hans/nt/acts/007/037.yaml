  text: οὗτός ἐστιν ὁ Μωϋσῆς ὁ ⸀εἴπας τοῖς υἱοῖς Ἰσραήλ· Προφήτην ὑμῖν ἀναστήσει ⸂ὁ θεὸς⸃ ἐκ τῶν ἀδελφῶν ὑμῶν ὡς ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/037.yaml
  text: This is the Moses who said to the sons of Israel[a], ‘God will raise up for you a prophet from among your brothers[c][b], like me.’
translation:
  language: zh_hans
  text: 这就是那位曾对以色列子孙[a]说：“神要从你们的弟兄[b]中，为你们兴起一位像我一样的先知[c]。”的摩西。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以色列子孙”也可译作“以色列人”；希腊原文直译为“以色列的儿子们”。
    reason: lexical_alternative
  - marker: b
    text: 这里的“弟兄”指同属以色列民族的人；希腊原文为阳性复数。
    reason: cultural_note
  - marker: c
    text: 也有人结合申命记18:15及本书对耶稣的指向，将其理解为特指的“那位先知”；但希腊原文此处没有冠词。
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτός ἐστιν ὁ Μωϋσῆς
  choice: 这就是那位……的摩西
  rationale: 保留指示词和冠词结构所表达的强调、特指意味，同时采用自然的现代汉语句式。
- source_word: εἴπας
  choice: 说过以下这话的
  rationale: 将作定语的简过去主动分词译为关系性定语，并用“说过”体现已发生的言说。
- source_word: τοῖς υἱοῖς Ἰσραήλ
  choice: 对以色列子孙
  rationale: υἱοῖς 字面为“儿子们”，但该固定族群称谓在现代汉语圣经语境中以“以色列子孙”较自然，也保留原文的家族性表达。
- source_word: Προφήτην
  choice: 一位……先知
  rationale: 原文无冠词；译作“一位先知”最直接，不在正文中预先将其解释为专称“那位先知”。
- source_word: ἀναστήσει
  choice: 要……兴起
  rationale: “兴起”保留神使先知出现、承担使命的主动作为，也维持本段常见的经文措辞。
- source_word: ἐκ τῶν ἀδελφῶν ὑμῶν
  choice: 从你们的弟兄中
  rationale: “从……中”准确表达 ἐκ 加属格的群体内部来源；“弟兄”保留阳性复数及同族关系。
- source_word: ὡς ἐμέ
  choice: 像我一样
  rationale: 直接表达先知与摩西之间的类比，不补入原文未明说的方面。
theological_decisions:
- issue: 申命记18:15引文的弥赛亚意义
  choice: 正文译作“一位……先知”
  alternative: “那位先知”
  rationale: 使徒行传的语境赋予这段引文基督论意义，但此处 Προφήτην 无冠词。正文保留直译，不把语境中的认定直接写入名词形式。
- issue: “兴起”是否暗示复活
  choice: 按先知蒙神兴起的常规意义翻译
  alternative: 译成“使……复活”
  rationale: ἀνίστημι 可用于复活，但在申命记引文中直接意义是神从以色列人中兴起一位先知；不应在此消除词义与使徒行传复活主题之间可能存在的呼应。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“这就是那位……的摩西”保留原文强调辨认的语气；引文内部使用“兴起”“弟兄”等具有经文庄重感、同时仍易于普通读者理解的词语。脚注标记均置于正文对应词语之后。
