id: ACT.7.6
reference: Acts 7:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐλάλησεν ⸀δὲ οὕτως ὁ θεὸς ὅτι ἔσται τὸ σπέρμα αὐτοῦ πάροικον ἐν γῇ ἀλλοτρίᾳ, καὶ δουλώσουσιν αὐτὸ καὶ κακώσουσιν ἔτη τετρακόσια·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/006.yaml
  text: 'But God spoke in this way: that his offspring would be a foreign resident in a strange land[a], and they would enslave it and mistreat it for four hundred years.'
translation:
  language: zh_hans
  text: 但上帝这样说：他的后裔要寄居在别人的土地上[a]；那里的人要奴役他们，虐待他们四百年。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文采用集合单数，可较直译为：“他的后裔要成为别人的土地上的寄居者；他们要奴役它，虐待它四百年。”这里的“后裔”虽为单数形式，所指却是一群后代。
    reason: 说明σπέρμα、πάροικον和αὐτό的集合单数形式，并提供较形式对应的译法。
lexical_decisions:
- source_word: ἐλάλησεν δὲ οὕτως ὁ θεός
  choice: 但上帝这样说
  rationale: δέ在司提反叙述的推进中带轻微转折，译作“但”；οὕτως明确译作“这样”，保留引述的正式引入语。
- source_word: τὸ σπέρμα αὐτοῦ
  choice: 他的后裔
  rationale: σπέρμα是集合单数，指亚伯拉罕的后代；现代汉语用“后裔”自然表达这一集合意义，同时不必机械译成“种子”。
- source_word: πάροικον
  choice: 寄居
  rationale: πάροικος指住在不属于自己的地方、没有本地人身份的人；“寄居”兼顾居住与外来者身份，并适合此处旧约引语的庄重语域。
- source_word: ἐν γῇ ἀλλοτρίᾳ
  choice: 在别人的土地上
  rationale: ἀλλότριος基本义为“属于别人的、非自己的”；此译比笼统的“异国”更直接保留土地不属于他们这一层含义。
- source_word: δουλώσουσιν αὐτό
  choice: 那里的人要奴役他们
  rationale: δουλόω译作“奴役”，明确表达使人处于奴隶地位。希腊文主语未明说，汉语补出“那里的人”以避免误将“后裔”理解为施事者；αὐτό虽是配合集合单数σπέρμα的中性单数，汉语按所指群体自然译为“他们”。
- source_word: κακώσουσιν
  choice: 虐待
  rationale: κακόω在此表示使人受苦、恶待；“虐待”清楚有力，又不额外限定具体压迫方式。
- source_word: ἔτη τετρακόσια
  choice: 四百年
  rationale: 时长宾语在现代汉语中无需另加介词，直接置于谓语后即可表达持续时间。
theological_decisions:
- issue: 亚伯拉罕“后裔”的集合单数及其代词
  choice: 主文译作“后裔……他们”
  alternative: 形式对应地译作“后裔……它”，或用“子孙……他们”
  rationale: 希腊文σπέρμα与αὐτό均为单数形式，但σπέρμα在这里集合性地指许多后代。现代汉语用“他们”回指一群人较自然，不改变其集合所指；脚注说明原文的单数形式，以免这一文本特征被完全隐去。
- issue: 压迫者的未明示主语
  choice: 补作“那里的人”
  alternative: 译作“他们要奴役他们”，保留相同形式但造成指代歧义
  rationale: 希腊文第三人称复数动词的主语隐含为异地居民或掌权者，并非亚伯拉罕的后裔。补出中性的“那里的人”是汉语所需的指代澄清，不具体指定埃及人，从而不超出本节措辞。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“寄居”保留经文语域但仍属通行现代汉语；以分号呈现神谕内容的两部分。主文优先保证汉语指代清楚，脚注保存希腊文集合单数这一显著形式特征。
