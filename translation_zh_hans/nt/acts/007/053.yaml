  yaml_path: translation/nt/acts/007/053.yaml
  text: you who received the law as delivered by angels[a], and did not keep it.
translation:
  language: zh_hans
  text: 你们领受了借着天使传达的律法[a]，却没有遵守。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“按天使的安排领受了律法”，或“在天使的指示下领受了律法”。希腊语这一短语的具体含义较难确定；它表明律法的颁赐与天使的参与有关。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: 你们
  rationale: 结合随后两个第二人称复数动词，直接指向司提反的听众；汉语用“你们”即可自然承接上文并保留责备语气，无须生硬译成“你们这些人”。
- source_word: ἐλάβετε
  choice: 领受了
  rationale: 表示他们得到了律法。“领受”符合律法授予的语境，也不额外暗示他们甘愿接受。
- source_word: τὸν νόμον
  choice: 律法
  rationale: 此处指摩西律法；“律法”是现代中文圣经语境中清楚而庄重的表达。
- source_word: εἰς διαταγὰς ἀγγέλων
  choice: 借天使传达的
  rationale: 原短语结构和 διαταγαί 的确切语义较难确定；正文用自然中文表达其明确核心，即律法的颁赐与天使的中介参与有关，同时在脚注保留其他可能的理解。
- source_word: ἀγγέλων
  choice: 天使
  rationale: 上下文指参与律法颁赐的属天使者，而非普通的人间信使。
- source_word: οὐκ ἐφυλάξατε
  choice: 却没有遵守
  rationale: φυλάσσω 与律法连用时表示谨守、遵行；“遵守”是现代汉语中最自然明确的搭配，“却”传达 καί 在此处形成的强烈反差。
theological_decisions:
- issue: εἰς διαταγὰς ἀγγέλων 所表达的天使参与方式
  choice: 律法是借天使传达的
  alternative: 按天使的安排领受律法；奉天使的指示领受律法
  rationale: 经文明确把领受律法与天使联系起来，但介词 εἰς 和名词 διαταγαί 所表达的具体关系有争议。正文呈现天使中介这一核心意思，不进一步界定其运作方式；脚注保留词义和句法上的其他可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“领受—传达—遵守”保持经文的法律与盟约语境；正文简洁有力，保留司提反直接责备听众的语气。
