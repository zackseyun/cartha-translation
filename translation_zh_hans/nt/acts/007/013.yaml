  yaml_path: translation/nt/acts/007/013.yaml
  text: And on the second visit Joseph was recognized by his brothers[b][a], and Joseph’s family became known to Pharaoh.
translation:
  language: zh_hans
  text: 第二次去埃及时，约瑟被弟兄们认出来了[a]；约瑟的家族也为法老所知[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“约瑟向弟兄们表明了自己的身份。”希腊文动词采用被动形式，直译为“被认了出来”，但结合创世记的叙事，也可理解为约瑟让他们认出自己。
    reason: lexical_alternative
  - marker: b
    text: “家族”也可译作“亲族”或“族系”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ δευτέρῳ
  choice: 第二次去的时候
  rationale: 希腊文直译为“在第二次时”；结合上文弟兄们再次前往埃及的语境，补出“去”，使现代汉语自然明白。
- source_word: ἀνεγνωρίσθη
  choice: 被……认了出来
  rationale: 保留希腊文的被动形式及“辨认、认出”的基本意义；约瑟主动表明身份这一合乎创世记背景的理解列入脚注，不在正文中消除原文形式所容许的张力。
- source_word: ἀδελφοῖς
  choice: 弟兄
  rationale: 此处具体指约瑟的男性手足；“弟兄”准确、庄重，也符合圣经叙事语体。
- source_word: φανερὸν ἐγένετο
  choice: 为……所知
  rationale: 表达某事从不为人知到被知晓的变化，同时自然衔接与格“法老”。
- source_word: γένος
  choice: 家族
  rationale: 此处指约瑟所属的亲属群体；“家族”比“种族”准确，也比“族类”更符合现代汉语。
- source_word: τῷ Φαραώ
  choice: 为法老
  rationale: 以“为……所知”表达希腊文与格所标示的知情者。
