  text: ἀποστείλας δὲ Ἰωσὴφ μετεκαλέσατο ⸂Ἰακὼβ τὸν πατέρα αὐτοῦ⸃ καὶ πᾶσαν τὴν συγγένειαν ἐν ψυχαῖς ἑβδομήκοντα πέντε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/014.yaml
  text: Then Joseph sent and summoned Jacob his father and all his relatives[a], seventy-five persons in all.
translation:
  language: zh_hans
  text: 于是，约瑟派人去，请他的父亲雅各和所有亲属都来，共七十五人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 《旧约》有些经文所记的总数是“七十人”（例如《创世记》46:27和《出埃及记》1:5的希伯来文本）；本节《使徒行传》记作“七十五人”。
    reason: cross_reference
lexical_decisions:
- source_word: ἀποστείλας
  choice: 派人去
  rationale: 这是先于主要动词的简单过去时分词；原文未明说所派之人或所传之话。译作“派人去”自然表达约瑟采取行动传召家人，又不擅自补出“送信”等细节。
- source_word: δὲ
  choice: 于是
  rationale: 此处连接叙事并推动事件发展；“于是”符合现代汉语叙事习惯，也保留原文承接上文的作用。
- source_word: μετεκαλέσατο
  choice: 请……都来
  rationale: 该中动态动词表示叫人或派人请某人前来。结合“派人去”，译作“请……来”自然清楚；“召来”虽较贴近形式，却略显生硬或带有权威命令色彩。
- source_word: Ἰακὼβ τὸν πατέρα αὐτοῦ
  choice: 他的父亲雅各
  rationale: 按自然汉语调整同位结构的语序，明确雅各是约瑟的父亲。
- source_word: πᾶσαν τὴν συγγένειαν
  choice: 所有亲属
  rationale: συγγένεια指整个亲族或亲属群体。“亲属”比“家人”更能涵盖广泛亲族，又比“亲族”更常用。
- source_word: ἐν ψυχαῖς
  choice: 共……人
  rationale: 字面为“按人命/魂计”，在这里是统计人数的惯用表达。汉语用“共……人”准确传达计数意义，避免让“灵魂”产生并非本句重点的神学联想。
- source_word: ἑβδομήκοντα πέντε
  choice: 七十五
  rationale: 直接、准确地翻译原文数字，不与其他经文传统作无提示的协调。
theological_decisions:
- issue: 雅各家人数与《创世记》《出埃及记》部分文本传统的数字差异
  choice: 正文保留“七十五人”
  alternative: 七十人
  rationale: 《使徒行传》的希腊文本明确作“七十五”。希伯来文本的《创世记》46:27和《出埃及记》1:5常作“七十”，但译文不应暗中协调这一差异；正文忠实保留本节数字，并以脚注指出文本间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“派人去，请……都来”避免连续使用生硬的“差遣、召来”，同时保留两个动作；“亲属”兼顾准确与通俗。脚注标记[a]已在正文出现。
