id: ACT.7.42
reference: Acts 7:42
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἔστρεψεν δὲ ὁ θεὸς καὶ παρέδωκεν αὐτοὺς λατρεύειν τῇ στρατιᾷ τοῦ οὐρανοῦ, καθὼς γέγραπται ἐν βίβλῳ τῶν προφητῶν· Μὴ σφάγια καὶ θυσίας προσηνέγκατέ μοι ἔτη τεσσεράκοντα ἐν τῇ ἐρήμῳ, οἶκος Ἰσραήλ;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/042.yaml
  text: 'But God turned away and gave them over to serve the host of heaven[a], just as it is written in the book of the prophets: ‘Did you offer to me slain offerings and sacrifices for forty years in the wilderness[d][c][b], O house of Israel?’'
translation:
  language: zh_hans
  text: '但神就转身离开他们，任凭他们去敬奉天上的万象[a][b]，正如先知书中[c]所记：


    “以色列家啊，


    你们在旷野四十年间，


    难道曾把祭牲和祭物献给我吗？[d]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“敬拜天上的万象”。这里的希腊语动词既可指宗教性的事奉，也可指敬拜。
    reason: lexical_alternative
  - marker: b
    text: “天上的万象”是圣经中的一种说法，可指天体，也可延伸指偶像崇拜中与天体相联系的天上势力。
    reason: cultural_note
  - marker: c
    text: 或译“先知书卷中”。希腊语可指书或卷轴。
    reason: lexical_alternative
  - marker: d
    text: 引自《阿摩司书》5:25。
    reason: cross_reference
lexical_decisions:
- source_word: ἔστρεψεν
  choice: 转脸不顾
  rationale: 结合下文“把他们交出去”的审判语境，表达神转离他们的关系性含义，同时不把它弱化为单纯的身体转向。
- source_word: παρέδωκεν αὐτοὺς
  choice: 把他们交出去，任凭他们
  rationale: “交出去”保留司法性交付的力度；补入“任凭”使汉语句法自然，并避免误解为神主动迫使他们犯罪。
- source_word: λατρεύειν
  choice: 敬奉
  rationale: “敬奉”兼有宗教性服事和敬拜之意，可保留原词在“事奉”与“敬拜”之间的语义张力。
- source_word: τῇ στρατιᾷ τοῦ οὐρανοῦ
  choice: 天上的万象
  rationale: 这是汉语圣经语境中自然可懂的表达，涵盖受偶像崇拜的天体及与之相关的天上势力，而不把所指限于星辰或天使。
- source_word: ἐν βίβλῳ τῶν προφητῶν
  choice: 先知书中
  rationale: 自然表达收录众先知著作的书卷；脚注保留“书卷”的历史载体含义。
- source_word: Μὴ … προσηνέγκατέ μοι
  choice: 难道曾把……献给我吗
  rationale: 用“难道……吗”传达μή所引导、预期否定回答的反问，并保留“给我”的受事重点。
- source_word: σφάγια καὶ θυσίας
  choice: 祭牲和祭物
  rationale: “祭牲”体现σφάγια所指被宰杀的献祭牲畜；“祭物”表达θυσίας较一般的祭献含义，保留两词并列。
- source_word: ἔτη τεσσεράκοντα ἐν τῇ ἐρήμῳ
  choice: 在旷野四十年间
  rationale: 采用自然现代汉语，同时保留出埃及传统中的“旷野”用语和完整的时间范围。
theological_decisions:
- issue: 神在审判中的行动
  choice: 神“转脸不顾”并“把他们交出去，任凭他们”敬奉天上万象
  alternative: 神只是被动准许他们敬拜；或神主动使他们犯罪
  rationale: 相连的两个动词体现神对先前悖逆所施行的审判性弃置；译文保留神主动交付的严肃性，却不暗示神是偶像崇拜之罪的作者。
- issue: “天上的万象”的所指
  choice: 保留可涵盖天体及相关天上势力的概括表达
  alternative: 专指天使；或专指星辰
  rationale: 此处处于先知谴责偶像崇拜的语境，原短语并未把所指严格限定为某一类对象，因此正文不作过度具体化。
- issue: 阿摩司书反问的神学张力
  choice: 按希腊文保留“难道……献给我吗”的反问
  alternative: 解释为以色列完全没有献祭，或解释为他们虽献祭却并非真正献给神
  rationale: 经文本身的反问在旷野献祭传统与先知谴责之间形成张力；译文不在正文中替读者裁定其精确解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“转脸不顾”保持审判语气；“敬奉”兼顾宗教性服事与敬拜；引文按诗性行文分行，以显明先知书引语，同时避免古奥措辞。
