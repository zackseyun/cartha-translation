review_pass:
  verdict: revise
  source_fidelity: “转脸不顾他们”恰当地表达ἔστρεψεν在审判语境中的转离；“任凭他们敬奉天上的万象”也准确传达παρέδωκεν…λατρεύειν的审判性弃置及宗教性事奉。原文“把他们交出去，任凭他们”中的“交出去”在汉语中缺少明确的交付对象，且与“任凭”语义重复，容易造成句法和意义上的滞涩。改为“转身离开他们，任凭他们……”可完整、清楚地传达原句的两个动作，而不暗示神促成偶像崇拜。引文的否定预期反问、祭牲与祭物的并列、四十年及旷野均保留准确。
  naturalness: 修订后的正文采用庄重、通顺的现代标准汉语。“神就转身离开他们，任凭他们去敬奉……”比“把他们交出去，任凭他们……”自然，避免不完整的“交出去”搭配。引文分行适合先知性引语，措辞不显古奥。
  terminology: “敬奉”“天上的万象”“先知书”“祭牲和祭物”“旷野”均适切且前后一致。“天上的万象”保留原短语的概括性，不擅自限定为星辰或天使；相关脚注恰当地说明其在偶像崇拜语境中的所指。
  issues:
  - severity: medium
    issue: “把他们交出去”在汉语中缺少交付对象，且后接“任凭他们”造成表达重复。
    rationale: παρέδωκεν在此虽有“交付／交出”之义，但汉语“把他们交出去”通常需要说明交给谁或什么；原句随后以“任凭”说明结果，故可直接以“任凭他们”自然表达审判性的交付，避免句法悬空，同时不改变经文含义。
