  to: '但神就转身离开他们，任凭他们去敬奉天上的万象[a][b]，正如先知书中[c]所记：


    “以色列家啊，


    你们在旷野四十年间，


    难道曾把祭牲和祭物献给我吗？[d]”'
  rationale: 仅修订首句中不自然且交付对象不明的“把他们交出去，任凭他们”，改为“转身离开他们，任凭他们去敬奉”。这保留了ἔστρεψεν与παρέδωκεν所构成的审判性转离和弃置，且不扩大为神使他们犯罪。其余正文和全部脚注在源文忠实度、术语、语体及脚注锚点上均可保留。
