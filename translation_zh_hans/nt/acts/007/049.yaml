source:
  edition: SBLGNT
  text: Ὁ οὐρανός μοι θρόνος, ⸂ἡ δὲ⸃ γῆ ὑποπόδιον τῶν ποδῶν μου· ποῖον οἶκον οἰκοδομήσετέ μοι, λέγει κύριος, ἢ τίς τόπος τῆς καταπαύσεώς μου;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/049.yaml
  text: Heaven is my throne[a], and the earth is the footstool for my feet. What kind of house will you build for me, says the Lord, or what is the place of my rest?
translation:
  language: zh_hans
  text: 天是我的宝座，地是我脚下的脚凳。你们要为我建造怎样的房屋呢？主说：什么地方是我安息之处呢？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐρανός
  choice: 天
  rationale: 这里与“地”构成宇宙性的对举，指天上领域；现代汉语用“天”既自然，也保留引文的庄重感。
- source_word: θρόνος
  choice: 宝座
  rationale: 保留君王统治座位的比喻，也是现代汉语中清楚、庄重的标准对应词。
- source_word: γῆ
  choice: 地
  rationale: 与“天”相对，范围是全地，并非某一片“土地”。
- source_word: ὑποπόδιον τῶν ποδῶν μου
  choice: 我的脚凳
  rationale: “脚凳”自然保留原文意象；所属关系译为“我的”比“我双脚的脚凳”更符合现代汉语，同时以脚注说明原文的完整形式。
- source_word: ποῖον
  choice: 怎样的
  rationale: 表达对性质、种类的反问，不仅是在询问哪一座房屋。
- source_word: οἶκον
  choice: 房屋
  rationale: 原文是一般性的“房屋”；虽在语境中涉及圣殿，正文不直接译成“圣殿”，以免把语境所指写入词义。
- source_word: οἰκοδομήσετέ
  choice: 你们要……建造
  rationale: 对应将来时直陈语气，并在反问中保持直接的语势。
- source_word: κύριος
  choice: 主
  rationale: 按新约希腊文 κύριος 翻译为“主”，不以旧约引文背景改写为其他专名形式。
- source_word: τόπος τῆς καταπαύσεώς μου
  choice: 我安息的地方
  rationale: 贴近原文的属格结构，也保留“安息”可能具有的神学回响，不扩写为特定圣所。
theological_decisions:
- issue: 以赛亚引文中 κύριος 的译法
  choice: 主
  alternative: 耶和华
  rationale: 本节直接翻译的是新约希腊文，原文使用 κύριος；译作“主”既忠于现有文本，也不掩盖说话者是以色列的神。
- issue: οἶκος 是否明确译作圣殿
  choice: 房屋
  alternative: 殿宇／圣殿
  rationale: 上下文确实指向圣殿，但原词仍是“房屋”。保留较宽泛的措辞，可使反问本身的张力不被解释性译法提前消解。
- issue: “安息”是否解释为神的居所
  choice: 我安息的地方
  alternative: 我的安居之所
  rationale: 直译保留“安息”的概念及其潜在经文回响，不把它限定为永久居住或某一种神学意义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留“天—地”“宝座—脚凳”的平行意象，并用“怎样的房屋”呈现反问力度。将“主说”置于两个问题之间，尽量对应希腊文的位置；标点服务于中文可读性，不额外补入解释。
