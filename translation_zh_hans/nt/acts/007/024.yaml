  text: καὶ ἰδών τινα ἀδικούμενον ἠμύνατο καὶ ἐποίησεν ἐκδίκησιν τῷ καταπονουμένῳ πατάξας τὸν Αἰγύπτιον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/024.yaml
  text: And when he saw someone being wronged[b][a], he defended him and brought justice for the one being oppressed by striking down the Egyptian.
translation:
  language: zh_hans
  text: 他看见有人受欺负，就为那人挺身相助，并击打那个埃及人，为受压迫的人伸冤。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “伸冤”也可译作“报仇”或“主持公道”；“击打”按原文也可能结合上下文理解为“击倒”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδών
  choice: 看见
  rationale: 以时间背景自然衔接后续主要动作；汉语无需另加“当……时”也能清楚表达先后关系。
- source_word: τινα
  choice: 有人
  rationale: 保留不定代词的未指明性，不从上下文擅自补出“一个人”或“一个以色列人”。
- source_word: ἀδικούμενον
  choice: 受欺
  rationale: 表达遭受不公与侵害，简洁自然，并保留其道德层面的含义。
- source_word: ἠμύνατο
  choice: 为那人挺身辩护
  rationale: 该中动词表示出手援助、保护受害者；“挺身辩护”在此包含实际介入，而非仅指言语申辩。
- source_word: ἐποίησεν ἐκδίκησιν
  choice: 为……伸冤
  rationale: 此惯用语兼有报偿、报仇和维护公道的语义；“伸冤”突出为受害者采取行动，同时避免把经文直接处理成对私人报复的评价。
- source_word: τῷ καταπονουμένῳ
  choice: 为受压迫的人
  rationale: 保留持续遭受苛待、压制的意味，并体现与格所表达的受益对象。
- source_word: πατάξας
  choice: 击打
  rationale: 忠实保留动词本身“击打”的含义；上下文虽表明后果致命，本节的希腊词本身并未直接使用“杀死”。
- source_word: τὸν Αἰγύπτιον
  choice: 那个埃及人
  rationale: 定冠词指向具体的埃及人，译为“那个埃及人”符合现代汉语指称习惯。
theological_decisions:
- issue: 摩西行动中ἐκδίκησις的语义取向
  choice: 译作“为受压迫的人伸冤”
  alternative: 为受压迫的人报仇／替受压迫的人主持公道
  rationale: 原词可指报仇、惩治或伸张公道。正文采用“伸冤”，既保留替受害者施行报偿或维护公道的力度，也不额外断言经文是在认可私人复仇。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“挺身辩护”与“伸冤”避免过度法律化，也保留摩西实际介入和为受害者采取报偿行动的力度。脚注标记置于相关整句之后，涵盖ἐποίησεν ἐκδίκησιν与πατάξας的真实词义幅度。
