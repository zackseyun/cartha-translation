  rationale: 修订仅调整两个现代汉语措辞：“受欺”改为更自然的“受欺负”，“挺身辩护”改为更贴合实际援助含义的“挺身相助”。其余译文及脚注保留，以维持原文对报偿／伸冤和击打行为的语义幅度。
