  text: ᾧ οὐκ ἠθέλησαν ὑπήκοοι γενέσθαι οἱ πατέρες ἡμῶν, ἀλλὰ ἀπώσαντο καὶ ἐστράφησαν ⸂ἐν ταῖς καρδίαις⸃ αὐτῶν εἰς Αἴγυπτον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/039.yaml
  text: Our fathers were unwilling to become obedient to him[a], but rejected him and turned back in their hearts to Egypt[b],
translation:
  language: zh_hans
  text: 我们的先祖不肯顺从他，反而拒绝了他[a]，心里转向埃及[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拒绝了他”也可译作“把他推开”。原文动词带有将摩西推开、摒弃的意味。
    reason: lexical_alternative
  - marker: b
    text: 意思是，他们当时虽然仍在旷野，内心却渴望回到埃及。
    reason: cultural_note
lexical_decisions:
- source_word: ᾧ
  choice: 他
  rationale: 与格单数关系代词回指上一节的摩西；在“不肯顺从他”中自然表达“对他顺从”的关系。
- source_word: οὐκ ἠθέλησαν
  choice: 不肯
  rationale: 表达意志上的拒绝，比单纯的“不想”更贴合上下文，也符合现代汉语习惯。
- source_word: ὑπήκοοι γενέσθαι
  choice: 顺从
  rationale: 原文直译近于“成为顺从的”；汉语用“不肯顺从”既自然，也保留其服从摩西的核心含义。
- source_word: οἱ πατέρες ἡμῶν
  choice: 我们的先祖
  rationale: 指以色列历史上的前人；“先祖”较“父辈”更准确地涵盖历代祖先，并保持庄重语体。
- source_word: ἀπώσαντο
  choice: 拒绝了他
  rationale: 该中动词可表示推开、摒弃或拒绝；此处“拒绝了他”清楚表达众人对摩西的排斥，同时在脚注保留更具动作感的译法。
- source_word: ἐστράφησαν
  choice: 转向
  rationale: 表示方向或取向的转变；与“心里”和“埃及”连用，可自然表达内在回转。
- source_word: ἐν ταῖς καρδίαις αὐτῶν
  choice: 心里
  rationale: 保留圣经中“心”代表意愿、欲望和内在取向的惯用表达，同时符合现代汉语。
- source_word: εἰς Αἴγυπτον
  choice: 向埃及
  rationale: εἰς表示朝向埃及；“转向埃及”保留方向意义，而是否实际返回则由“心里”限定。
theological_decisions:
- issue: 以色列人“转向埃及”的性质
  choice: 心里转向埃及
  alternative: 心里回到埃及／一心想回埃及
  rationale: 原文明说这一转向发生在“心里”，所指是欲望、意志或归属上的内在回转。“心里转向埃及”保留这种叙事与神学张力，不把它窄化为仅仅怀念埃及，也不误作已经实际返回。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不肯”凸显意志上的抗拒；“反而”自然呈现ἀλλά所表达的转折；保留“心里转向埃及”这一圣经意象，不作过度解释。脚注标记均置于所说明的词句之后。
