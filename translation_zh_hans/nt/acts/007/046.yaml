id: ACT.7.46
reference: Acts 7:46
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὃς εὗρεν χάριν ἐνώπιον τοῦ θεοῦ καὶ ᾐτήσατο εὑρεῖν σκήνωμα τῷ ⸀θεῷ Ἰακώβ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/046.yaml
  text: who found favor before God and asked to find a dwelling place for the God of Jacob[a].
translation:
  language: zh_hans
  text: 他在神面前蒙恩，并祈求能为雅各的神寻得一个居所[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一个帐幕”。
    reason: 词义备选：σκήνωμα既可泛指居所，也可指帐幕式住所。
lexical_decisions:
- source_word: εὗρεν χάριν
  choice: 蒙恩
  rationale: 这是常见的关系性表达，指得到神的恩宠；“蒙恩”符合现代汉语的经文语体，也避免把“恩”理解为被发现的抽象事物。
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: 在神面前
  rationale: 保留原文“在……面前”的空间性表达，同时自然传达“在神眼中”的含义。
- source_word: ᾐτήσατο
  choice: 祈求
  rationale: 此处请求的对象是神；“祈求”比一般的“请求”更贴合语境，又不额外说明原文未明说的内容。
- source_word: εὑρεῖν
  choice: 寻得
  rationale: 保留原文“找到、寻得”的措辞，不将其解释性地改译为“建造”或“预备”。
- source_word: σκήνωμα
  choice: 居所
  rationale: 该词可指住处或帐幕式住所；“居所”保留其较宽泛的意义，并与下一节所说所罗门建造殿宇的叙述张力相容。
- source_word: τῷ θεῷ Ἰακώβ
  choice: 为雅各的神
  rationale: 与格在此自然表达受益或归属关系，译作“为”；“雅各的神”保留原文的圣约称谓。
theological_decisions:
- issue: 大卫所求建筑的性质
  choice: 译为“居所”，不提前限定为帐幕或圣殿。
  alternative: 译为“帐幕”或“殿宇”。
  rationale: σκήνωμα本身比特指圣殿的词更宽泛。司提反的叙述先说大卫求一个地方，下一节才说所罗门建造殿宇；使用“居所”可保留这种叙事和神学张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准普通话。“蒙恩”“祈求”“寻得”保持经文语体，但不过度古雅；“居所”避免过早把所求之物具体化为帐幕或圣殿。
