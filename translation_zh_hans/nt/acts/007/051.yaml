  text: Σκληροτράχηλοι καὶ ἀπερίτμητοι ⸀καρδίαις καὶ τοῖς ὠσίν, ὑμεῖς ἀεὶ τῷ πνεύματι τῷ ἁγίῳ ἀντιπίπτετε, ὡς οἱ πατέρες ὑμῶν καὶ ὑμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/051.yaml
  text: You stiff-necked people[a], uncircumcised in hearts and ears, you always resist the Holy Spirit; as your fathers did, so do you.
translation:
  language: zh_hans
  text: “你们这些硬着颈项、心和耳朵未受割礼的人！你们总是抗拒圣灵；你们的祖宗[a]怎样，你们也怎样。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译“你们的父辈”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Σκληροτράχηλοι
  choice: 硬着颈项
  rationale: 保留希腊文“颈项僵硬”的鲜明比喻及其旧约背景，同时采用现代中文仍能理解的庄重表达。
- source_word: ἀπερίτμητοι
  choice: 未受割礼
  rationale: 保留盟约性的割礼意象；这里不是泛指不洁，而是借先知性语言指责内在的悖逆。
- source_word: καρδίαις καὶ τοῖς ὠσίν
  choice: 心和耳朵
  rationale: 两个与格表示所涉及的方面；中文以“心和耳朵未受割礼”自然表达，并保留内在顽梗与不肯听从的双重意象。
- source_word: ἀεὶ
  choice: 总是
  rationale: 准确表达持续而反复的一贯行为。
- source_word: τῷ πνεύματι τῷ ἁγίῳ
  choice: 圣灵
  rationale: 这是《使徒行传》中对神圣之灵的常规特指，采用现代中文基督教语境中通行的称呼。
- source_word: ἀντιπίπτετε
  choice: 抗拒
  rationale: 表达主动抵挡、反对之意，既简洁又符合本句强烈的责备语气。
- source_word: οἱ πατέρες ὑμῶν
  choice: 你们的祖宗
  rationale: 此处指以色列先前的世代；“祖宗”在中文中比直译“父亲们”更自然准确，脚注注明希腊文形式。
- source_word: ὡς … καὶ ὑμεῖς
  choice: 怎样，你们也怎样
  rationale: 保留原文简练的比较结构，中文中自然补足其省略关系，而不把具体行为再次展开。
theological_decisions:
- issue: “圣灵”的所指
  choice: 作为特指的神圣位格，译作“圣灵”
  alternative: 理解为一般性的神圣能力、影响或心态
  rationale: 带冠词的希腊语短语在《使徒行传》的语境中通常特指圣灵；译文不另加解释性称谓。
- issue: 割礼意象的处理
  choice: 保留“心和耳朵未受割礼”的盟约比喻
  alternative: 意译为“心地顽梗、耳朵闭塞”等
  rationale: 原文有意沿用以色列先知传统中的盟约语言；保留比喻可维持其经文互文和神学张力。
- issue: πατέρες 的世代指称
  choice: 正文译作“祖宗”，脚注说明字面形式
  alternative: 直译为“父辈”或“父亲们”
  rationale: 语境指以色列历代先人而非听众各自的生父；“祖宗”既准确又符合庄重的现代中文。
translation_notes:
  register: 采用庄重而可懂的现代标准汉语。以感叹号体现开头称呼的强烈斥责；保留“硬着颈项”和“未受割礼”两项圣经性比喻，不将其弱化为抽象的“顽固”或“不肯听”。
