id: ACT.7.43
reference: Acts 7:43
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἀνελάβετε τὴν σκηνὴν τοῦ Μολὸχ καὶ τὸ ἄστρον τοῦ ⸀θεοῦ ⸀Ῥαιφάν, τοὺς τύπους οὓς ἐποιήσατε προσκυνεῖν αὐτοῖς. καὶ μετοικιῶ ὑμᾶς ἐπέκεινα Βαβυλῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/043.yaml
  text: And you took up the tent of Moloch and the star of the god Rephan[a], the images that you made to worship them[c][b], and I will deport you beyond Babylon.
translation:
  language: zh_hans
  text: 你们抬起了摩洛的帐棚和瑞番神的星[a]，那些你们造来敬拜它们的像[c]；我要把你们放逐到巴比伦以外[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些译本依据《阿摩司书》5:26的希伯来文，译作“你们的神瑞番”，而不是“瑞番神”。《使徒行传》本节的希腊文作“瑞番神”。
    reason: alternative_reading
  - marker: b
    text: 《使徒行传》本节作“巴比伦以外”；所引的《阿摩司书》5:27通常译作“大马士革以外”。
    reason: cross_reference
  - marker: c
    text: “像”也可译作“偶像”“形像”或“表征”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνελάβετε
  choice: 抬着
  rationale: 该词在这里指拿起并携带敬拜用的物件；“抬着”既自然，也保留了携带偶像崇拜器物的具体意味。
- source_word: σκηνὴν
  choice: 帐棚
  rationale: σκηνή的基本义是“帐棚”。这里不是指敬拜上帝的会幕，因此不用容易引起误解的“会幕”，也不在正文中采用解释性较强的“神龛”。
- source_word: Μολὸχ
  choice: 摩洛
  rationale: 依希腊文专名音译；不额外判定其与其他传统拼法之间的关系。
- source_word: ἄστρον
  choice: 星
  rationale: 保留ἄστρον直接、基本的词义，不在正文中将其解释为“星形偶像”或“星辰标志”。
- source_word: τοῦ θεοῦ Ῥαιφάν
  choice: 瑞番神的
  rationale: 希腊文表达的是“瑞番这位神的”，并非“你们的神瑞番”。中文以“瑞番神”自然表达其神祇身份，同时在脚注中说明与《阿摩司书》希伯来文措辞的差异。
- source_word: Ῥαιφάν
  choice: 瑞番
  rationale: 按《使徒行传》希腊文形式音译该专名。
- source_word: τύπους
  choice: 偶像
  rationale: τύπος可指形像、形体或表征；在制造并敬拜的语境中，“偶像”最清楚地传达其敬拜用途。脚注保留较宽泛的词义选择。
- source_word: ἐποιήσατε
  choice: 你们造来
  rationale: 保留直接指控：这些敬拜对象是听众祖先自己制造的；“造来”也自然连接后面的目的不定式。
- source_word: προσκυνεῖν αὐτοῖς
  choice: 敬拜
  rationale: προσκυνέω在宗教语境中自然译为“敬拜”；“就是你们造来敬拜的偶像”在现代汉语中已清楚表达αὐτοῖς所指的对象。
- source_word: μετοικιῶ
  choice: 我要把你们流放
  rationale: 该动词表示强制迁移、放逐；“流放”比中性的“迁移”更能体现审判和被掳的意味。
- source_word: ἐπέκεινα Βαβυλῶνος
  choice: 到巴比伦以外
  rationale: 忠实保留《使徒行传》希腊文的“巴比伦以外”，不按《阿摩司书》常见的“到大马士革以外”加以协调。
theological_decisions:
- issue: 司提反所引经文中流放地点与《阿摩司书》来源经文的常见措辞不同
  choice: 巴比伦以外
  alternative: 大马士革以外
  rationale: 《使徒行传》7:43的希腊文本明确写“巴比伦”，故正文应按本处原文翻译；脚注保留与《阿摩司书》5:27的差异，不将二者静默协调。
- issue: τοῦ θεοῦ Ῥαιφάν中神祇名称与所有关系的表达
  choice: 瑞番神的星
  alternative: 你们的神瑞番的星
  rationale: 《使徒行传》本节希腊文没有“你们的”，因此正文不从《阿摩司书》的希伯来文补入该词；相关来源差异在脚注中说明。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“帐棚”避免把异教敬拜物与上帝的会幕混淆；“流放”清楚表达强制迁徙和审判。“摩洛”“瑞番”按希腊文专名音译。正文中的脚注标记分别紧随相关词语，且全部与脚注对应。
