    rationale: τοὺς τύπους οὓς ἐποιήσατε προσκυνεῖν αὐτοῖς可清楚译为“那些你们造来敬拜它们的像”；这样保留“像”及其后的关系从句，而不把它简单等同为前面两个名词。
  revised_text: 你们抬起了摩洛的帐棚和瑞番神的星[a]，那些你们造来敬拜它们的像[c]；我要把你们放逐到巴比伦以外[b]。
