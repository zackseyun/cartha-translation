  rationale: 修订只去除了原文未表达的“还”，以完成体过去叙述对应ἀνελάβετε，并将τύπους及其关系从句明确译出。“瑞番神”与“巴比伦以外”及两项来源差异脚注均予保留；“放逐”继续准确表达μετοικιῶ所含的强制迁徙／流亡意味。
