lexical_decisions:
- source_word: οὐχὶ
  choice: 不都是……吗
  rationale: οὐχί引出预期肯定回答的反问；“不都是……吗”在现代汉语中自然保留这一修辞力量。
- source_word: ἡ χείρ μου
  choice: 我亲手
  rationale: χείρ本义为“手”，这里表示上帝亲自施行创造。“亲手”既保留具体的手之意象，也比生硬的“我的手”更符合汉语表达。
- source_word: ἐποίησεν
  choice: 造
  rationale: ποιέω在这里指创造、使之存在；“造”简洁自然，并符合上下文中的创造语境。
- source_word: ταῦτα πάντα
  choice: 这一切
  rationale: ταῦτα与πάντα合用，兼有指示和总括作用；“这一切”在现代汉语中完整、自然地表达其范围。
theological_decisions:
- issue: 关于上帝的拟人化表达
  choice: 译作“我亲手造”，保留“手”的形象并表达上帝亲自创造
  alternative: 意译为“这一切不都是我造的吗”或“这一切不都是我的能力造的吗”
  rationale: 本句呼应《以赛亚书》66:2。译作“亲手”保留经文的具体意象和神圣行动者的强调，同时避免把原文抽象化为“能力”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我亲手造”自然呈现原文“我的手造”的拟人化意象；反问句式预期肯定回答。
