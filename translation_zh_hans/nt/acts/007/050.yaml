  text: Did not my hand make all these things?[a][b]
translation:
  language: zh_hans
  text: 这一切不都是我手所造的吗？[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这一切不都是我造的吗？”
    reason: lexical_alternative
  - marker: b
