  text: ἦλθεν δὲ λιμὸς ἐφ’ ὅλην τὴν ⸀Αἴγυπτον καὶ Χανάαν καὶ θλῖψις μεγάλη, καὶ οὐχ ηὕρισκον χορτάσματα οἱ πατέρες ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/011.yaml
  text: A famine came over all Egypt and Canaan[a], and great distress, and our fathers could not find food.
translation:
  language: zh_hans
  text: 一场饥荒临到全埃及和迦南，并带来极大的困苦；我们的先祖[a]找不到食物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “先祖”原文直译为“父亲们”，这里指以色列人的祖先。
    reason: 说明希腊文的阳性亲属称谓及其语境所指。
lexical_decisions:
- source_word: ἦλθεν δὲ
  choice: 后来……临到
  rationale: δὲ承接叙事发展，ἦλθεν与“饥荒”连用表示事件发生；“后来……临到”在现代汉语中自然，也不增添强烈转折。
- source_word: λιμὸς
  choice: 饥荒
  rationale: 指大范围的食物短缺，而非个人感到饥饿。
- source_word: ἐφ’ ὅλην τὴν Αἴγυπτον καὶ Χανάαν
  choice: 临到全埃及和迦南
  rationale: ἐπί加宾格在此表示灾情扩及整个地域；“全埃及和迦南”保留其地理范围。
- source_word: θλῖψις μεγάλη
  choice: 极大的苦难
  rationale: 指饥荒带来的严重困苦；“苦难”保留该词较宽的语义，不限定为末世性的“患难”。
- source_word: οὐχ ηὕρισκον
  choice: 找不到
  rationale: 未完成时表示危机期间持续无法找到，汉语“找不到”自然传达这种实际无能。
- source_word: χορτάσματα
  choice: 食物
  rationale: 指可供食用的食物或供应；“食物”清楚宽泛，不武断限定为粮食或牲畜饲料。
- source_word: οἱ πατέρες ἡμῶν
  choice: 我们的先祖
  rationale: 语境指以色列的祖先；现代汉语“先祖”既保留家族及救恩历史指向，又比直译“我们的父亲们”更准确自然。
theological_decisions:
- issue: 祖先称谓中的阳性表达
  choice: 我们的先祖
  alternative: 我们的父辈
  rationale: 希腊文直译为“我们的父亲们”，此处实际指以色列先祖。“先祖”不把所指误解为说话者直接上一代，同时不改变其救恩历史身份。
translation_notes:
  register: 采用庄重、自然的现代标准汉语。“后来”承接前文叙事；分号呈现饥荒、重大苦难与先祖缺粮之间的紧密关系。脚注标记置于所解释的“先祖”之后。
