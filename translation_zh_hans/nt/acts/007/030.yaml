  text: Καὶ πληρωθέντων ἐτῶν τεσσεράκοντα ὤφθη αὐτῷ ἐν τῇ ἐρήμῳ τοῦ ὄρους Σινᾶ ⸀ἄγγελος ἐν φλογὶ πυρὸς βάτου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/030.yaml
  text: And after forty years had passed[a], an angel appeared to him in the wilderness of Mount Sinai[c][b], in a flame of fire from a bush.
translation:
  language: zh_hans
  text: 四十年期满后[a]，在西奈山的旷野里，有一位天使[c]在荆棘丛的火焰中[b]向他显现。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“四十年期满的时候。”
    reason: lexical_alternative
  - marker: b
    text: 原文直译可作：“在一丛荆棘的火焰中。”原文的压缩表达表明火焰与荆棘丛相关，呼应《出埃及记》3:2。
    reason: cross_reference
  - marker: c
    text: 有些解释者根据《出埃及记》3:2，将这里的天使与“耶和华的使者”联系起来；但《使徒行传》此处只说“一位天使”。
    reason: alternative_reading
lexical_decisions:
- source_word: πληρωθέντων ἐτῶν τεσσεράκοντα
  choice: 四十年满了以后
  rationale: 属格独立结构表达时间背景；“满了”既保留 πληρόω“达到完整、期满”的意味，也符合现代汉语表达。
- source_word: ὤφθη αὐτῷ
  choice: 向他显现
  rationale: ὤφθη 虽是被动形式，在神圣显现语境中常作不及物意义使用；“向他显现”比“被他看见”更自然，并准确表达与格 αὐτῷ。
- source_word: ἐν τῇ ἐρήμῳ τοῦ ὄρους Σινᾶ
  choice: 在西奈山的旷野里
  rationale: “旷野”符合出埃及叙事的地理语体，也不把该地过度限定为沙漠；“西奈山”是 Σινᾶ 的标准中文地名。
- source_word: ἄγγελος
  choice: 一位天使
  rationale: 此处指天上的使者；原文仅作不定的 ἄγγελος，因此不增译为“主的使者”。
- source_word: ἐν φλογὶ πυρὸς βάτου
  choice: 在荆棘丛的火焰中
  rationale: 保留“火焰”这一鲜明意象，并以自然汉语表达火焰与荆棘丛之间的压缩属格关系；具体关系仍在注释中说明。
theological_decisions:
- issue: 显现者 ἄγγελος 在神显叙事中的身份
  choice: 正文译作“一位天使”，不作进一步身份认定
  alternative: 主的使者
  rationale: 使徒行传此处只写 ἄγγελος，没有“主的”这一限定。出埃及记3:2的互文联系可在注释中指出，但不应在正文中补入原文未明说的神学身份。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“四十年满了以后”保留原文动词色彩；“向他显现”符合中文圣经叙事习惯。正文按原文保持天使身份及荆棘火焰关系的适度含混，必要说明置于脚注。
