source:
  edition: SBLGNT
  text: τότε ἐξελθὼν ἐκ γῆς Χαλδαίων κατῴκησεν ἐν Χαρράν. κἀκεῖθεν μετὰ τὸ ἀποθανεῖν τὸν πατέρα αὐτοῦ μετῴκισεν αὐτὸν εἰς τὴν γῆν ταύτην εἰς ἣν ὑμεῖς νῦν κατοικεῖτε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/004.yaml
  text: Then, after he had gone out from the land of the Chaldeans, he settled in Haran. And from there, after his father died, God moved him into this land in which you now live,
translation:
  language: zh_hans
  text: 于是，他离开迦勒底人的土地后，就住在哈兰。他父亲死后[b]，上帝[a]又使他从那里迁到你们现在居住的这片土地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文没有明说这个动词的主语；若不补出主语，可直译为“他又使他从那里迁到”。上下文表明所指的是上帝。
    reason: lexical_alternative
  - marker: b
    text: 司提反说，这次迁移发生在亚伯拉罕的父亲死后。相关的时间次序可参看《创世记》11:32；12:4。
    reason: cross_reference
lexical_decisions:
- source_word: τότε
  choice: 于是
  rationale: 作为时间兼叙事推进标记，承接前文并引出下一事件；现代汉语中自然庄重。
- source_word: ἐξελθὼν ἐκ γῆς Χαλδαίων
  choice: 离开迦勒底人的土地后
  rationale: 不压缩为“迦勒底”，保留γῆ与族名属格的完整表达；不定式式分词所表示的先行动作以“……后”呈现。
- source_word: κατῴκησεν ἐν Χαρράν
  choice: 就住在哈兰
  rationale: κατοικέω在此表示定居、居住；“住在”比“居于”更符合现代普通话，且上下文已清楚表达迁居。Χαρράν采用通行译名“哈兰”。
- source_word: κἀκεῖθεν
  choice: 又使他从那里
  rationale: 将καί与ἐκεῖθεν的连接和起点意义分别体现为“又”和“从那里”。
- source_word: μετὰ τὸ ἀποθανεῖν τὸν πατέρα αὐτοῦ
  choice: 他父亲死后
  rationale: 准确表达μετά加冠词不定式所标示的时间先后，措辞简洁自然。
- source_word: μετῴκισεν αὐτὸν
  choice: 上帝又使他……迁到
  rationale: μετοικίζω是使役动词，表示使人迁移或迁居。希腊文没有明说主语，但上文语境指向上帝；正文补出“上帝”以免汉语歧义，同时用脚注保留原文形式上的含混。
- source_word: εἰς τὴν γῆν ταύτην
  choice: 迁到……这片土地
  rationale: “迁到”体现εἰς所表达的趋向，“这片土地”保留γῆ的地理含义及指示语气。
- source_word: εἰς ἣν ὑμεῖς νῦν κατοικεῖτε
  choice: 你们现在居住的
  rationale: 按现代汉语将关系从句前置修饰“这片土地”；“居住”保持庄重而清楚的语体。
theological_decisions:
- issue: μετῴκισεν的主语是否明说
  choice: 正文译作“上帝又使他……迁到”，并加脚注说明希腊文未明说主语。
  alternative: 译作“他又使他迁到”，保留语法形式但在汉语中指代不清。
  rationale: 该动词为第三人称单数，原句没有明示主语；然而使徒行传7:2–3的语境以荣耀的上帝为行动者。正文补出“上帝”有助于汉语读者理解，脚注则保留原文真实的语法含混。
- issue: 司提反叙述中他拉去世与亚伯拉罕迁移的时间关系
  choice: 照原文译为“他父亲死后”，不作协调。
  alternative: 改写时间表达，以消除与创世记11:32、12:4之间表面上的年代张力。
  rationale: 翻译应忠实保存使徒行传此处明确呈现的叙事次序，不在正文中暗自调和；脚注提供相关经文供读者比较。
translation_notes:
  register: 采用现代、清楚而庄重的普通话。“迦勒底人的土地”保留原文的完整地理称谓；“住在”与“居住”避免古雅的“寄居、居于”，同时维持叙事语体。脚注标记均置于正文相应信息之后。
