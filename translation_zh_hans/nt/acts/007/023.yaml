  text: Ὡς δὲ ἐπληροῦτο αὐτῷ τεσσερακονταετὴς χρόνος, ἀνέβη ἐπὶ τὴν καρδίαν αὐτοῦ ἐπισκέψασθαι τοὺς ἀδελφοὺς αὐτοῦ τοὺς υἱοὺς Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/023.yaml
  text: When he was approaching forty years of age[a], it came into his heart to visit his brothers[c][b], the sons of Israel.
translation:
  language: zh_hans
  text: 他快满四十岁的时候，心里起了念头[a]，要去看望他的弟兄，也就是以色列子孙。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“心里起意”或“定意”。原文保留了表达内在意愿的惯用说法。
    reason: lexical_alternative
  - marker: b
    text: “弟兄”在这里指摩西的同族以色列人；“以色列子孙”说明了这群人的族群身份。也可译作“以色列人”。
    reason: cultural_note
lexical_decisions:
- source_word: Ὡς δὲ
  choice: ……的时候
  rationale: 以自然的汉语时间从句承接司提反的叙述；δέ的轻微转接作用由上下文和句式体现，不另加原文没有的“如今”。
- source_word: ἐπληροῦτο αὐτῷ τεσσερακονταετὴς χρόνος
  choice: 他快满四十岁
  rationale: 原文直译近于“他四十年的岁月将满”，未使用简单的“是四十岁”；此译保留时间正在满期的动态意味，同时符合现代汉语表达。
- source_word: ἀνέβη ἐπὶ τὴν καρδίαν αὐτοῦ
  choice: 心里起了念头
  rationale: 保留原文“上到心里”的意象核心及内在意愿的含义，又避免生硬直译成“上到他的心上”。
- source_word: ἐπισκέψασθαι
  choice: 去看望
  rationale: 在本处表示亲自前去探望自己的同胞，也可能含有关切、察看其处境之意；“看望”比单纯“访问”更符合语境。
- source_word: τοὺς ἀδελφοὺς αὐτοῦ
  choice: 他的弟兄
  rationale: 保留原文阳性复数的亲族称谓；后面的同位语说明所指是摩西的以色列同胞，并非只指亲生兄弟。
- source_word: τοὺς υἱοὺς Ἰσραήλ
  choice: 以色列子孙
  rationale: 保留圣经中这一族群称谓及其家族性语言；现代汉语中的“子孙”可统指以色列民族。
theological_decisions:
- issue: 亲族称谓与族群身份
  choice: 他的弟兄，也就是以色列子孙
  alternative: 他的以色列同胞
  rationale: 原文先用“弟兄”，再以“以色列的众子”作同位说明。正文保留两层表达，既呈现亲族关系，也明确其民族所指，不把阳性代表性语言误解为只包括男性。
- issue: 摩西内心意向的表达
  choice: 心里起了念头
  alternative: 他决定了
  rationale: 原文采用带意象的惯用语，表达内在意愿或定意；不直接译成“决定”，可避免把这一意向的坚定程度解释得超过原文。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“快满四十岁”呈现原文时间将满的动态表达；“心里起了念头”既通俗易懂，也保留原文的内心意象。正文中的脚注标记均紧随相关内容。
