  text: θεὶς δὲ τὰ γόνατα ἔκραξεν φωνῇ μεγάλῃ· Κύριε, μὴ στήσῃς αὐτοῖς ⸂ταύτην τὴν ἁμαρτίαν⸃· καὶ τοῦτο εἰπὼν ἐκοιμήθη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/060.yaml
  text: Then[a], kneeling down, he cried out with a loud voice, “Lord, do not hold this sin against them.” And after saying this[b], he fell asleep.
translation:
  language: zh_hans
  text: 他跪下，高声呼喊：“主啊，不要把这罪算在他们身上。”[a]说了这话，他就睡了。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要把这罪归到他们账上”，或“不要追究他们这项罪。”
    reason: lexical_alternative
  - marker: b
    text: “睡了”是原文用来婉指死亡的惯常说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: θεὶς δὲ τὰ γόνατα
  choice: 他跪下来
  rationale: 原文是“放下双膝”的惯用表达，意为跪下；译成“跪下来”自然、准确，并承接叙事进程。
- source_word: ἔκραξεν φωνῇ μεγάλῃ
  choice: 大声呼喊说
  rationale: κράζω表示高声呼喊，φωνῇ μεγάλῃ进一步强调声音洪亮；“大声呼喊”保留原文的力度。
- source_word: Κύριε
  choice: 主啊
  rationale: κύριε是呼格；结合上一节，司提反在向耶稣呼求。“主啊”保留新约中这一称谓的庄重性及其语境意义。
- source_word: μὴ στήσῃς αὐτοῖς ταύτην τὴν ἁμαρτίαν
  choice: 不要把这罪归在他们身上
  rationale: στήσῃς在这里有把罪归到某人账上、使其承担罪责之意。“归在他们身上”是自然的现代汉语，也保留司法或记账式意象；“这罪”明确呈现ταύτην。
- source_word: καὶ τοῦτο εἰπὼν
  choice: 说了这话
  rationale: 以简洁自然的汉语表达分词结构所表示的先后关系，并紧接前面的祷告。
- source_word: ἐκοιμήθη
  choice: 他就睡了
  rationale: κοιμάομαι在此以“睡去”婉指死亡。直保睡眠隐喻，避免直接改译为“死了”而抹平原文表达。
theological_decisions:
- issue: ἐκοιμήθη所用死亡婉语的处理
  choice: 他就睡了
  alternative: 他就死了
  rationale: 原文刻意用睡眠比喻司提反的死亡。保留这一比喻忠实呈现经文本身的语气与神学余韵，但不在正文中额外阐释有关死后状态的教义。
- issue: 司提反祷告中Κύριε的称呼
  choice: 主啊
  alternative: 主人啊
  rationale: 上下文表明这呼求是向耶稣发出的。“主啊”既准确保留κύριε的称谓，也不额外加入超出经文的教义说明。
- issue: “不要把这罪归在他们身上”的责任意象
  choice: 保留归罪意象
  alternative: 饶恕他们这项罪
  rationale: 原文没有直接使用“饶恕”一词，而是表达不要将这罪立在、归到他们身上；所选译法保留其司法或记账式张力，不把隐含意义改写成明说。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。短句保留现场的紧迫感；“大声呼喊”“主啊”“归在他们身上”兼顾自然表达与原文力度。正文中的[a]、[b]均与脚注对应。
