  naturalness: “上帝正借着他的手赐给他们拯救”虽可理解，但现代汉语中“赐给……拯救”搭配较不自然，且“明白”后直接接完整分句容易短暂歧义。使用“明白：上帝正借他的手解救他们”更清晰、自然，仍保留“手”作为施行媒介的意象。
  terminology: “弟兄们”保留阳性复数亲属称谓，脚注说明其指摩西的以色列同胞，合宜。“解救”在此埃及受压迫和摩西施行营救的直接语境中比“拯救”更具体；脚注保留“拯救／救恩”的词义可能性，不预断神学含义。
