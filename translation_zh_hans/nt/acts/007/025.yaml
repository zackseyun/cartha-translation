  text: ἐνόμιζεν δὲ συνιέναι τοὺς ⸀ἀδελφοὺς ὅτι ὁ θεὸς διὰ χειρὸς αὐτοῦ δίδωσιν ⸂σωτηρίαν αὐτοῖς⸃, οἱ δὲ οὐ συνῆκαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/025.yaml
  text: He supposed that his brothers understood that God was giving them deliverance through his hand[b][a], but they did not understand.
translation:
  language: zh_hans
  text: 他以为他的弟兄们[b]明白：上帝正借他的手解救他们；他们却不明白。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “弟兄们”指摩西的以色列同胞；希腊文使用阳性复数的亲属称谓。
    reason: cultural_note
lexical_decisions:
- source_word: ἐνόμιζεν
  choice: 以为
  rationale: 未完成时把摩西的想法作为叙事背景；现代汉语用“以为”自然表达他当时的判断，并与后文事实形成反差。
- source_word: συνιέναι / συνῆκαν
  choice: 明白／不明白
  rationale: 前后重复“明白”，保留希腊文同一词根形成的鲜明对照。
- source_word: ἀδελφοὺς
  choice: 弟兄们
  rationale: 保留希腊文阳性复数亲属称谓；此处具体指摩西的以色列同胞，脚注予以说明。
- source_word: διὰ χειρὸς αὐτοῦ
  choice: 借着他的手
  rationale: 既保留“手”的源语意象，也清楚表达上帝以摩西为施行拯救的媒介。
- source_word: δίδωσιν
  choice: 正……赐给
  rationale: 保留源语现在时所呈现的进行性，同时置于摩西过去的认识内容中；“赐给”符合上帝作为施予者的语境。
- source_word: σωτηρίαν
  choice: 拯救
  rationale: 该词可指救援、解救或救恩；“拯救”在中文中既适合以色列脱离压迫的具体处境，也不抹去本段较广的救恩意涵。
- source_word: οἱ δὲ οὐ συνῆκαν
  choice: 他们却不明白
  rationale: “却”准确标示摩西所想与实际反应之间的转折。
theological_decisions:
- issue: 摩西语境中 σωτηρία 的译法
  choice: 拯救
  alternative: 解救；救恩
  rationale: “拯救”兼顾出埃及背景中的实际救援与使徒行传中可能具有的神学回响，不把词义局限为纯属今世的解放，也不预先收窄为后世术语化的属灵“救恩”。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“借着他的手”有意保留源语意象；分号突出摩西的预期与同胞实际不明白之间的反差。
