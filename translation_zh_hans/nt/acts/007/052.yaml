    rationale: 原文此处以νῦν标示时间对照，但没有δέ或其他明确转折词；删去“却”可避免额外强化。
  - severity: low
    issue: “出卖他的人”较具体，且与“杀害他的人”并列时略显重复。
    rationale: προδόται基本义为背叛者；“背叛他、杀害他的人”自然地保留两个指控，并可在脚注列出“出卖他的人”这一语境化译法。
