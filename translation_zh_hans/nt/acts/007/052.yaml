revisions:
- from: 你们的先祖[c]没有迫害过哪一位先知呢？他们也杀了那些预先宣告那义者[a]将要来的人。如今，你们却成了出卖他的人[b]和杀害他的人。
  to: 你们的先祖[c]有哪一位先知没有迫害过呢？他们也杀了那些预先宣告那义者[a]将要来的人。如今，你们成了背叛他、杀害他的人[b]。
  rationale: 修订首句语序以形成现代汉语中清楚自然的反问，并明确“没有一位先知例外”的意思。末句删去原文未明示的“却”，以“背叛他、杀害他的人”简洁对应προδόται和φονεῖς，同时保留属格关系代词所指的“他”。其余措辞及脚注锚点均保留。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T03:29:32Z'
review_pass:
  verdict: revise
  source_fidelity: 整体忠实呈现原文的反问控诉、先祖杀害预告者、以及听众如今成为那义者的背叛者和杀害者。“那义者”适当地保留了称号性。原译“却”稍加重了原文未明说的转折；“出卖他的人”可行，但“背叛他”更贴近προδόται的较宽泛指控。
  naturalness: 首句“没有迫害过哪一位先知呢”在现代汉语中不如“有哪一位先知没有迫害过呢”自然、清晰；后者更明确保留“没有一位例外”的反问力量。末句可压缩为并列动词短语，使行文更符合现代庄重书面语。
  terminology: “先祖”“迫害”“预先宣告”“那义者”均合适。“那义者”与《使徒行传》中的称号性用语协调。以“背叛他”译προδόται，避免将其限定为一次具体的“出卖”行为，同时脚注保留该语境化替代译法。
