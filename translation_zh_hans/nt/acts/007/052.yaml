  text: τίνα τῶν προφητῶν οὐκ ἐδίωξαν οἱ πατέρες ὑμῶν; καὶ ἀπέκτειναν τοὺς προκαταγγείλαντας περὶ τῆς ἐλεύσεως τοῦ δικαίου οὗ νῦν ὑμεῖς προδόται καὶ φονεῖς ⸀ἐγένεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/052.yaml
  text: Which of the prophets did your fathers not persecute? And they killed those who announced beforehand the coming of the Righteous One[a], of whom you have now become betrayers and murderers[c][b],
translation:
  language: zh_hans
  text: 你们的先祖[c]有哪一位先知没有迫害过呢？他们也杀了那些预先宣告那义者[a]将要来的人。如今，你们成了背叛他、杀害他的人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “义者”也可译作“公义者”。
    reason: lexical_alternative
  - marker: b
    text: “背叛他的人”也可译作“出卖他的人”。
    reason: lexical_alternative
  - marker: c
    text: “先祖”原文较直译为“父辈”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τίνα τῶν προφητῶν
  choice: 哪一位先知
  rationale: 以自然的汉语反问保留部分属格结构的修辞力量，言外之意是先知无一未受迫害。
- source_word: ἐδίωξαν
  choice: 迫害
  rationale: 此处指对先知的敌意追逼和压迫，“迫害”准确而符合现代汉语用法。
- source_word: οἱ πατέρες ὑμῶν
  choice: 你们的先祖
  rationale: “先祖”既体现与听众的历史承继关系，也比直译“父辈”更自然；脚注说明原文较字面的表达。
- source_word: ἀπέκτειναν
  choice: 杀了
  rationale: 直接、清楚地表达主动杀死，避免文言或不必要的委婉说法。
- source_word: τοὺς προκαταγγείλαντας
  choice: 那些预先宣告……的人
  rationale: 同时保留 προ- 的时间先行含义和 καταγγέλλω 的公开宣告意味。
- source_word: περὶ τῆς ἐλεύσεως
  choice: 将要来
  rationale: 结合“预先宣告”转化为自然的汉语从句，准确表达所宣告的是那义者的来临。
- source_word: τοῦ δικαίου
  choice: 那义者
  rationale: 保留定冠词所指向的特定人物及称号性质；“义者”简洁、庄重，并可兼含公义与正直。
- source_word: νῦν
  choice: 如今
  rationale: 清楚呈现先祖过去的行为与听众当前罪责之间的时间对照。
- source_word: προδόται
  choice: 出卖他的人
  rationale: 在本语境中具体表达背叛并交出耶稣的行为，同时避免“叛徒”可能带入的政治含义。
- source_word: φονεῖς
  choice: 杀害他的人
  rationale: 表达应受谴责的致死行为；重复“他”使汉语指向清楚，并体现属格关系代词 οὗ。
- source_word: ἐγένεσθε
  choice: 成了
  rationale: 保留成为某种身份或状态的起始性含义，并与“如今”共同呈现其当前结果。
theological_decisions:
- issue: 将 τοῦ δικαίου 作为指向耶稣的称号
  choice: 那义者
  alternative: 那公义者；那位义人
  rationale: 上下文所指是先知预告其来临的特定人物耶稣。“那义者”保留称号性质，又不添加原文没有的解释。
- issue: οὗ 与“出卖者、杀人者”的关系
  choice: 出卖他的人和杀害他的人
  alternative: 他的出卖者和杀人者
  rationale: 原文属格关系代词同时关联两个谓语名词；自然汉语需把宾语“他”明确表达出来，而不改变指控内容。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。反问句保留司提反严厉的控诉语气；以“也”直接对应 καὶ，不额外加入“甚至”等强化成分。称号“那义者”保持原文的基督论指向和简洁张力。
