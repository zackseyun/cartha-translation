source:
  edition: SBLGNT
  text: οὗτος κατασοφισάμενος τὸ γένος ἡμῶν ἐκάκωσεν τοὺς ⸀πατέρας τοῦ ποιεῖν ⸂τὰ βρέφη ἔκθετα⸃ αὐτῶν εἰς τὸ μὴ ζῳογονεῖσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/019.yaml
  text: This man[a], having dealt shrewdly with our people, mistreated our fathers[c][b], causing their infants to be exposed so that they would not be kept alive.
translation:
  language: zh_hans
  text: 这人用诡计对付我们的同胞[a]，苦害我们的祖先[b]，使他们把自己的婴孩弃置在外[c]，不让婴孩存活。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “用诡计对付”也可译作“狡猾地算计”。希腊文强调以精明而欺诈的手段对待他们。
    reason: lexical_alternative
  - marker: b
    text: “祖先”直译为“父辈”。这里指以色列人的先人。
    reason: lexical_alternative
  - marker: c
    text: 指把婴孩遗弃在外，任其死亡。
    reason: cultural_note
lexical_decisions:
- source_word: οὗτος
  choice: 这人
  rationale: 承接上文所说的那位王，保留指示代词的明确指向，同时符合现代汉语表达。
- source_word: κατασοφισάμενος
  choice: 用诡计对付
  rationale: 该分词表示以精明而狡诈的手段加害或算计；“用诡计对付”清楚传达其负面含义，又保留行动方式。
- source_word: τὸ γένος ἡμῶν
  choice: 我们的同胞
  rationale: 这里指以色列这一族群。“我们的同胞”自然地表达共同民族身份，避免现代汉语“种族”可能引起的误解。
- source_word: ἐκάκωσεν
  choice: 苦害
  rationale: 该动词指使人受苦、受害；“苦害”既表达恶待及其伤害性，也适合本段严肃的历史叙述。
- source_word: τοὺς πατέρας
  choice: 我们的祖先
  rationale: 这里的“父辈”泛指以色列先人；译作“我们的祖先”在现代汉语中指向清楚，并以脚注保留直译可能。
- source_word: τοῦ ποιεῖν τὰ βρέφη ἔκθετα αὐτῶν
  choice: 使他们把自己的婴孩弃置在外
  rationale: 不把 τοῦ ποιεῖν 过度强化为“强迫”，而译出使役关系；“弃置在外”传达 ἔκθετα 所指的弃婴做法。
- source_word: εἰς τὸ μὴ ζῳογονεῖσθαι
  choice: 不让婴孩存活
  rationale: 表达目的或结果，并准确反映 ζῳογονεῖσθαι 的被保全性命、得以存活之意；补出“婴孩”以消除汉语代词歧义。
theological_decisions:
- issue: εἰς τό 加不定式所表达的目的或结果
  choice: 不让婴孩存活
  alternative: 以致婴孩不能存活
  rationale: 上下文显示弃婴是为使其死亡，目的意味较强；但正文不额外解释实施者的心理或责任层次。
- issue: τοῦ ποιεῖν 的使役强度
  choice: 使他们
  alternative: 强迫他们
  rationale: 希腊文可表达导致这种行为，但本身未必明确编码“强迫”的强度，因此采用较中性的使役表达，避免添加原文未明说的细节。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“苦害”比“虐待”涵盖面稍广，适合概括法老对以色列先人的恶待；“弃置在外”既保留古代弃婴习俗的具体形象，也由脚注说明其致死目的。
