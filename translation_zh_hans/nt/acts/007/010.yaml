  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἐξείλατο αὐτὸν ἐκ πασῶν τῶν θλίψεων αὐτοῦ, καὶ ἔδωκεν αὐτῷ χάριν καὶ σοφίαν ἐναντίον Φαραὼ βασιλέως Αἰγύπτου, καὶ κατέστησεν αὐτὸν ἡγούμενον ἐπ’ Αἴγυπτον ⸀καὶ ὅλον τὸν οἶκον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/010.yaml
  text: and rescued him from all his afflictions[a], and gave him favor and wisdom before Pharaoh king of Egypt[c][b], and appointed him ruler over Egypt and over all his household.
translation:
  language: zh_hans
  text: 又救他脱离一切患难[a]，使他在埃及王法老面前蒙恩[b]，并赐给他智慧，立他作统管埃及和法老全家上下的统治者[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一切困苦”。
    reason: lexical_alternative
  - marker: b
    text: “蒙恩”在这里指在法老眼中得到好感和眷顾；也可译作“得宠”。
    reason: lexical_alternative
  - marker: c
    text: “统治者”也可译作“治理者”或“总管”。“法老全家上下”指法老的整个家室或宫廷体系，不单指住宅。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξείλατο
  choice: 救……脱离
  rationale: 该中间态动词在这里表示从危险和困苦中施行解救；“救……脱离”自然、庄重，也保留主动拯救的含义。
- source_word: θλίψεων
  choice: 患难
  rationale: 此处概括约瑟所受的压迫、困苦与苦难；“患难”涵盖面较广，也不带不必要的末世论色彩。
- source_word: χάριν
  choice: 蒙恩
  rationale: 在法老面前的语境中，χάρις主要指得到有权势者的好感和眷顾；“蒙恩”既自然又保留“恩宠”的语义。
- source_word: σοφίαν
  choice: 智慧
  rationale: σοφία在此指法老所认可的智慧，尤其包括实际判断和治理才能。
- source_word: ἐναντίον
  choice: 在……面前
  rationale: 该介词表示处于某人的面前或眼中；“在埃及王法老面前”准确而自然。
- source_word: κατέστησεν
  choice: 立……作
  rationale: καθίστημι在这里指将人正式置于某种职分或权柄之下；“立……作”符合叙事语体。
- source_word: ἡγούμενον
  choice: 官长
  rationale: 该分词指掌权治理的人；“官长”能表达治理职分，而不把具体行政头衔规定得过细。
- source_word: ἐπ’ Αἴγυπτον
  choice: 统管埃及
  rationale: ἐπί加宾格在任命语境中表示对某领域拥有权柄；“统管”明确传达其管辖范围。
- source_word: ὅλον τὸν οἶκον αὐτοῦ
  choice: 法老全家
  rationale: οἶκος在这里指法老的家室、宫廷或家产体系，而非单指房屋；依最近的语境所指，将代词自然表达为“法老”。
theological_decisions:
- issue: 全节各单数动词的隐含主语
  choice: 正文不补出“上帝”，以连续谓语承接上文
  alternative: 明确译作“上帝救他……赐他……立他……”
  rationale: 希腊文没有在本节明说主语，但自然承接7:9“上帝却与他同在”。中文用“又救他……”延续上文，既保持连贯，也不把原文隐含的信息改成明说。
- issue: χάρις在此处的含义
  choice: 按法老对约瑟的有利看待译作“在……面前蒙恩”
  alternative: 译作较具神学术语色彩的“恩典”
  rationale: 本句的直接语境是约瑟在法老眼中得到好感；因此避免把χάρις限定为系统神学意义上的“恩典”。
- issue: αὐτοῦ在“全家”中的所指
  choice: 按句法近接和创世记背景理解为法老，译作“法老全家”
  alternative: 保留形式上的代词，译作“他的全家”
  rationale: 最近的阳性单数所指是法老，而且约瑟受任治理的是法老的家；中文若只说“他的全家”容易误解为约瑟自己的家。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“又……也……并……”保留希腊文连续并列的推进感；将“赐他恩宠和智慧”调整为“赐他智慧，也使他……蒙恩”，以符合现代汉语习惯，同时保持两项恩赐及其与法老面前处境的关系。所有脚注标记均置于相关词句之后。
