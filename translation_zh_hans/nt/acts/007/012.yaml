  text: ἀκούσας δὲ Ἰακὼβ ὄντα ⸂σιτία εἰς Αἴγυπτον⸃ ἐξαπέστειλεν τοὺς πατέρας ἡμῶν πρῶτον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/012.yaml
  text: But when Jacob heard that there was grain in Egypt[a], he sent out our fathers the first time.
translation:
  language: zh_hans
  text: 雅各听说埃及有粮食[a]，就第一次打发我们的祖先去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“食物”。希腊语σιτία也可泛指食物或给养，但在这里的上下文中很可能是指粮食。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: 听说
  rationale: 不定过去时分词在此表达先于主句动作发生的背景；汉语“听说……就……”自然地呈现事件次序。
- source_word: δὲ
  choice: 不单独译出
  rationale: δὲ在此主要标示叙事推进或轻微转折；本句汉语用“……就……”衔接更自然，若硬译“但是”会夸大对比。
- source_word: ὄντα ⸂σιτία εἰς Αἴγυπτον⸃
  choice: 埃及有粮食
  rationale: 将ἀκούω之后的宾格加分词结构自然译为间接陈述；εἰς在这一结构和语境中表达粮食在埃及可得，汉语译作“埃及有”最通顺。
- source_word: σιτία
  choice: 粮食
  rationale: 该词可指谷物，也可泛指食物或给养；约瑟与饥荒的语境倾向谷粮，但“粮食”既贴合语境，也保留一定词义宽度。
- source_word: ἐξαπέστειλεν
  choice: 打发……去
  rationale: 复合动词表示差派出去；“打发……去”在现代汉语叙事中自然，并体现出发远行的方向性。
- source_word: τοὺς πατέρας ἡμῶν
  choice: 我们的祖先
  rationale: 此处具体指雅各的儿子们，即以色列听众共同的男性先祖；“我们的祖先”在现代汉语中庄重自然，也不引入“族长”等额外称谓。
- source_word: πρῶτον
  choice: 第一次
  rationale: 指多次前往中的首次，并为后文第二次前往作铺垫；“第一次”清楚而自然。
theological_decisions:
- issue: τοὺς πατέρας ἡμῶν的称谓
  choice: 我们的祖先
  alternative: 我们的父辈／我们的列祖
  rationale: 所指是雅各的众子，即以色列历史中的男性先祖。“祖先”准确传达共同血统与历史身份，同时比“父辈”更符合年代距离，也比“列祖”更易为普通现代读者理解。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“听说……就……”呈现原文动作次序；“打发……去”保留差派外出的意味。脚注保留σιτία在“粮食”与较宽泛“食物、给养”之间的词义空间。
