base_translation:
  language: en
  yaml_path: translation/nt/acts/007/048.yaml
  text: 'But the Most High does not dwell in things made by hands[a], just as the prophet says:'
translation:
  language: zh_hans
  text: 然而，至高者并不居住在人手所造之物中[a]，正如先知所说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“人手所造的殿宇中。”希腊文的表达较为宽泛，意为“人手所造之物中”；不过此处直接的语境是圣殿。
    reason: 词义替代译法；说明该词可按直接语境理解为殿宇，但正文保留希腊文较宽泛的表达。
lexical_decisions:
- source_word: ἀλλ’
  choice: 然而
  rationale: 与上文所罗门建造殿宇形成鲜明转折；“然而”庄重自然，也有足够的转折力度。
- source_word: ὁ ὕψιστος
  choice: 至高者
  rationale: 保留这个具有称号性质的表达，不增添原文没有明说的“神”。
- source_word: ἐν χειροποιήτοις
  choice: 在人手所造的东西里
  rationale: χειροποιήτοις为复数，字义范围比“殿宇”更广；此译保留原文的宽泛表达，同时由上下文指向圣殿。
- source_word: κατοικεῖ
  choice: 住在
  rationale: 自然表达居住、居留之意，并适合描述神的临在与居所。
- source_word: καθὼς
  choice: 正如
  rationale: 清楚引出下文先知书的印证，体现对应关系。
- source_word: ὁ προφήτης λέγει
  choice: 先知所说
  rationale: 不擅自补出“以赛亚”；汉语用“正如先知所说”自然地保留原文现在时引用公式的功能。
theological_decisions:
- issue: 是否在正文中把 χειροποιήτοις 明确译为“人手所造的殿宇”
  choice: 保留较宽泛的“人手所造的东西”
  alternative: 人手所造的殿宇
  rationale: 虽然眼前语境谈论圣殿，但希腊文用词本身范围更广，也呼应圣经对人造宗教物件和建筑的批判；不宜在正文中将其含义收窄。
- issue: 是否将 ὁ ὕψιστος 扩译为“至高的神”
  choice: 至高者
  alternative: 至高的神
  rationale: 所指显然是神，但原文没有 θεός；采用“至高者”既清楚又不增添原文词语。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“人手所造的东西”略具直译色彩，但为保存原文复数形容词的宽泛意义而有意保留；脚注补充语境中较具体的译法。
