  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οὗτος ἐξήγαγεν αὐτοὺς ποιήσας τέρατα καὶ σημεῖα ἐν ⸀γῇ Αἰγύπτῳ καὶ ἐν Ἐρυθρᾷ Θαλάσσῃ καὶ ἐν τῇ ἐρήμῳ ἔτη τεσσεράκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/036.yaml
  text: This man led them out[a], performing wonders and signs in the land of Egypt and at the Red Sea and in the wilderness for forty years.
translation:
  language: zh_hans
  text: 这人带领他们出来，在埃及地、红海[a]和旷野，四十年间施行了奇事和神迹。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“芦苇海”。希腊文作“红海”（Ἐρυθρὰ Θάλασσα），这是新约和《七十士译本》对以色列人过海地点的惯常称呼。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτος
  choice: 这人
  rationale: 指回摩西，并保留司提反讲话中强调“这人”的修辞力量；比单用“他”更贴近原文。
- source_word: ἐξήγαγεν αὐτούς
  choice: 带领他们出来
  rationale: 准确表达“领出、带出”的意思，也自然呼应出埃及事件；不暗示摩西脱离上帝而独立施行拯救。
- source_word: ποιήσας
  choice: 施行了
  rationale: 以自然汉语表达不定过去时分词与主要动作的伴随关系，同时保留摩西作为这些行动的人间执行者。
- source_word: τέρατα καὶ σημεῖα
  choice: 奇事和神迹
  rationale: 分别传达τέρατα所强调的惊异性和σημεῖα所强调的标记、见证作用，并符合现代中文圣经语域。
- source_word: ἐν γῇ Αἰγύπτῳ
  choice: 在埃及地
  rationale: 保留γῇ“地”一词以及原文依次列举地点的结构。
- source_word: ἐν Ἐρυθρᾷ Θαλάσσῃ
  choice: 红海
  rationale: “红海”是Ἐρυθρὰ Θάλασσα在新约及《七十士译本》传统中的直接、通行译法；将希伯来语背景下可能的“芦苇海”列入脚注。
- source_word: ἐν τῇ ἐρήμῳ
  choice: 在旷野
  rationale: “旷野”符合以色列漂流叙事的传统语境，也不把地貌限缩为沙漠。
- source_word: ἔτη τεσσεράκοντα
  choice: 四十年间
  rationale: 自然表达原文的时间跨度，并保留其位于整串地点之后的概括性位置。
theological_decisions:
- issue: 指示代词所指及出埃及时的行动主体
  choice: 以“这人”明确指摩西是带领以色列人出来、施行奇事神迹的人间执行者
  alternative: 仅译“他”，弱化司提反对摩西身份的强调
  rationale: 原文οὗτος带有明确的回指和强调作用。译文陈述摩西在事件中的角色，但不据此断言他具有独立于上帝的能力。
- issue: “四十年”修饰范围
  choice: 保留在地点列举之后，以“四十年间”表达概括性的时间跨度
  alternative: 明确限定为只修饰在旷野期间
  rationale: 原文语序可使读者自然联想到旷野四十年，但句法上没有必要在译文中加入排他限定；保留其一定程度的结构张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“这人”保留原文强调，“奇事和神迹”沿用易懂的圣经叙事用语；地点并列和末尾时间短语尽量贴近希腊文结构。
