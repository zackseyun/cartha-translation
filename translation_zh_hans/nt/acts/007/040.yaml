  text: εἰπόντες τῷ Ἀαρών· Ποίησον ἡμῖν θεοὺς οἳ προπορεύσονται ἡμῶν· ὁ γὰρ Μωϋσῆς οὗτος, ὃς ἐξήγαγεν ἡμᾶς ἐκ γῆς Αἰγύπτου, οὐκ οἴδαμεν τί ⸀ἐγένετο αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/040.yaml
  text: saying to Aaron[a], ‘Make gods for us who will go before us, for this Moses[b], who led us out from the land of Egypt—we do not know what has happened to him.’
translation:
  language: zh_hans
  text: 他们对亚伦说：“为我们造些神[a]，让他们在我们前面行走。因为那个摩西，就是领我们出了埃及地的人，我们不知道他出了什么事。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“偶像”。希腊文直译为“神”，沿用了《出埃及记》的措辞，并保留百姓自己的说法，没有将其改成带有解释性的称呼。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰπόντες τῷ Ἀαρών
  choice: 他们对亚伦说
  rationale: 以自然的汉语叙事表达方式呈现分词结构及其受词，不生硬直译为“说着”。
- source_word: Ποίησον ἡμῖν
  choice: 给我们造些
  rationale: 准确传达命令语气以及受益对象；“造”适合制造可见神像的语境，同时不在正文中直接改称“偶像”。
- source_word: θεοὺς
  choice: 神
  rationale: 保留 θεός 复数在出埃及记引文中的字面意义和百姓自己的说法；汉语名词通常不以形态标明复数，由“些”明确其复数含义。
- source_word: οἳ προπορεύσονται ἡμῶν
  choice: 好走在我们前面
  rationale: 保留“走在前面”的空间意象，并以“好”自然表达关系从句在请求中的目的意味；不增译为较强的“带领”。
- source_word: ὁ γὰρ Μωϋσῆς οὗτος
  choice: 因为那个摩西
  rationale: “因为”表达 γάρ 的理由关系，“那个”传达 οὗτος 在此处带有疏离、轻慢色彩的指称。
- source_word: ὃς ἐξήγαγεν ἡμᾶς ἐκ γῆς Αἰγύπτου
  choice: 就是领我们出了埃及地的人
  rationale: 完整保留关系从句、引领出来的动作及“埃及地”的明示用词；“就是……的人”符合现代汉语。
- source_word: οὐκ οἴδαμεν τί ἐγένετο αὐτῷ
  choice: 我们不知道他遭遇了什么事
  rationale: 自然表达 τί ἐγένετο αὐτῷ，既可指发生在他身上的事，也保留其去向或命运不明的语感。
theological_decisions:
- issue: 在拜偶像语境中如何翻译 θεοὺς
  choice: 神
  alternative: 偶像
  rationale: 希腊文记述百姓自己的要求，用的是 θεοὺς，而非专指偶像的名词。正文保留“神”，既忠于出埃及记的措辞，也不提前替叙述者解释其对象；脚注说明语境中的另一种译法。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事语言。“那个摩西”保留原文略带疏离或轻慢的语气；句号将请求与理由分开，使较长引语在现代汉语中清晰易读。
