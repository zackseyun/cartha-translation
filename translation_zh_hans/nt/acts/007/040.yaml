revisions:
- from: 他们对亚伦说：“给我们造些神[a]，好走在我们前面。因为那个摩西，就是领我们出了埃及地的人，我们不知道他遭遇了什么事。”
  to: 他们对亚伦说：“为我们造些神[a]，让他们在我们前面行走。因为那个摩西，就是领我们出了埃及地的人，我们不知道他出了什么事。”
  rationale: 修正关系从句的汉语表达，避免“好”所可能引入的目的意味，并使“神”与“在我们前面行走”的关系明确。末句略作调整，以自然汉语保留原文对摩西情况或去向不明的开放含义。脚注锚点和内容保持正确。
