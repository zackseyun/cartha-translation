  text: τῇ τε ἐπιούσῃ ἡμέρᾳ ὤφθη αὐτοῖς μαχομένοις καὶ ⸀συνήλλασσεν αὐτοὺς εἰς εἰρήνην εἰπών· Ἄνδρες, ἀδελφοί ⸀ἐστε· ἱνατί ἀδικεῖτε ἀλλήλους;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/026.yaml
  text: And on the following day he appeared to them as they were fighting and was trying to reconcile them to peace[a], saying, ‘Men, you are brothers[b]; why are you wronging one another?’
translation:
  language: zh_hans
  text: 第二天，正当他们争斗时，摩西出现在他们面前，并试图劝他们和好，说：“二位，你们是弟兄[a]，为什么彼此欺负呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄”也可译作“同胞”；这里指他们同属以色列人，并不一定表示两人是亲兄弟。
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ τε ἐπιούσῃ ἡμέρᾳ
  choice: 第二天
  rationale: 简洁自然地表达叙事中的次日，与上下文的时间顺序吻合。
- source_word: ὤφθη αὐτοῖς
  choice: 摩西来到他们那里
  rationale: ὤφθη在叙事中可表示“出现、来到人前”；中文若直译为“向他们显现”容易带出超自然意味，因此按语境译为“来到他们那里”。补出“摩西”使中文指代清楚。
- source_word: αὐτοῖς μαχομένοις
  choice: 看见他们正在争斗
  rationale: 分词表示摩西出现时他们正处于争斗之中；“正在争斗”保留持续状态，“看见”自然衔接中文叙事。
- source_word: συνήλλασσεν αὐτοὺς εἰς εἰρήνην
  choice: 就想劝他们和好
  rationale: 未完成时结合下一节遭拒的语境，可作尝试义；“劝他们和好”自然表达使双方走向和平的行动，同时保留其努力未必成功。
- source_word: Ἄνδρες, ἀδελφοί ἐστε
  choice: 两位，你们是弟兄
  rationale: Ἄνδρες是对两名男子的称呼，现代中文用“两位”比“男人们”自然；“弟兄”保留同族、同胞关系的诉求。
- source_word: ἱνατί ἀδικεῖτε ἀλλήλους
  choice: 为什么彼此欺负呢
  rationale: ἀδικέω指亏负、伤害或不公正地对待；在实际争斗语境中，“彼此欺负”通俗自然，并保留相互加害的意味。
theological_decisions:
- issue: ἀδελφοί所表达的关系
  choice: 弟兄
  alternative: 同胞
  rationale: 这里首先诉诸两名以色列男子彼此如弟兄的共同身份；“弟兄”保留原文亲属隐喻，而不将其限定为血缘兄弟。
- issue: συνήλλασσεν的体貌
  choice: 想劝他们和好
  alternative: 劝他们和好
  rationale: 未完成时本身允许持续或尝试两种理解；下一节显示调解遭到拒绝，因此正文采用尝试义，但不据此加入额外神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。避免把ὤφθη译成可能暗示超自然显现的“显现”，并用“两位”自然处理Ἄνδρες的呼语。
