base_translation:
  language: en
  yaml_path: translation/nt/acts/007/016.yaml
  text: and they were carried over to Shechem and laid in the tomb that Abraham had bought for a price of silver from the sons of Hamor in Shechem[a].
translation:
  language: zh_hans
  text: 他们被迁到示剑，安放在一座坟墓里；这座坟墓是亚伯拉罕在示剑用银子从哈抹的子孙那里买下的[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 司提反这里的说法综合了若干细节。读者可比较《创世记》23章（亚伯拉罕向以弗仑购买麦比拉的墓地）和《创世记》33:19（雅各向哈抹的子孙购买示剑附近的一块地）。本节末尾“在示剑”在希腊文中也可能与“哈抹的子孙”相关。
    reason: cross_reference
lexical_decisions:
- source_word: μετετέθησαν
  choice: 被迁到
  rationale: 该词在此指先祖的遗骸被转移到另一地点；“被迁到”自然表达被动及地点转移，也不额外补出原文未明说的“遗骸”。
- source_word: Συχὲμ / Συχέμ
  choice: 示剑
  rationale: 采用现代中文圣经与相关地名的通行译名。
- source_word: ἐτέθησαν
  choice: 安放
  rationale: 在安葬语境中，“安放”比“放置”庄重自然，同时贴近 τίθημι 的基本意义。
- source_word: μνήματι
  choice: 坟墓
  rationale: μνῆμα 指埋葬之处；“坟墓”是普通现代读者易懂且符合语境的表达。
- source_word: ᾧ
  choice: 这坟墓
  rationale: 关系代词回指“坟墓”。汉语以重复名词并另起分句的方式，可清楚自然地呈现修饰关系。
- source_word: ὠνήσατο
  choice: 买来的
  rationale: 准确表达“购买”，并以“买来的”显示购买先于安放这一叙事关系。
- source_word: τιμῆς ἀργυρίου
  choice: 用银子
  rationale: 该短语表示以银为价款；“用银子”简明自然，又保留交易媒介，不将金额具体化。
- source_word: παρὰ τῶν υἱῶν Ἑμμὼρ
  choice: 从……哈抹子孙那里
  rationale: παρά 加属格表示来源；υἱοί 在家族或族裔语境中可指后裔，因此译为“子孙”比仅限亲生儿子的“儿子们”更自然。
- source_word: ἐν Συχέμ
  choice: 示剑的哈抹
  rationale: 将末尾介词短语理解为修饰哈抹，即“示剑的哈抹”；此处理符合希腊语词序，也不改变交易发生于示剑这一整体语境。
theological_decisions:
- issue: 与《创世记》中墓地购买记载之间的历史张力
  choice: 正文照希腊文本保留司提反的说法：亚伯拉罕从示剑的哈抹子孙那里买了坟墓。
  alternative: 按《创世记》33:19改为雅各在示剑向哈抹子孙买地，或按《创世记》23章改为亚伯拉罕在麦比拉向以弗仑买墓地。
  rationale: 翻译应呈现现存希腊文本，而非在正文中进行协调。相关记载的差异以脚注提示读者比较，保留文本本身的历史张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“被迁到……安放在……”保留两个希腊语被动动词；分号使较长的关系从句在中文中更清楚。脚注标记[a]已在正文相应位置出现。
