  yaml_path: translation/nt/acts/007/001.yaml
  text: Then the high priest said[a], “Are these things so?”
translation:
  language: zh_hans
  text: 于是大祭司说：“这些事果真如此吗？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“真是这样吗？”更明确地说，也可译为：“这些指控属实吗？”
    reason: 词义及语境上的可选译法；正文保留ταῦτα较宽泛的指称，脚注说明它在上下文中指向前述指控。
lexical_decisions:
- source_word: Εἶπεν
  choice: 问
  rationale: 字面是“说”，但这里直接引出问句；现代汉语用“问”更自然，也不改变叙事内容。
- source_word: δὲ
  choice: 就
  rationale: 此处承接前文并推进叙事，“就”自然表达大祭司随即回应。
- source_word: ὁ ἀρχιερεύς
  choice: 大祭司
  rationale: 这是该司法场景中对单数ἀρχιερεύς的标准译法，指主持审问者。
- source_word: Εἰ
  choice: 吗
  rationale: εἰ在此引导是非问句，汉语以句末疑问助词“吗”表达其功能。
- source_word: ταῦτα
  choice: 这些事
  rationale: 保留复数指称，回指前文所述指控，同时避免在正文中直接解释为“罪名”或“控告”。
- source_word: οὕτως ἔχει
  choice: 果真如此
  rationale: 该习语意为“确是这样、实情如此”；“果真如此”符合审问语境，并自然表达对前述事项真实性的询问。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而自然的司法问话语体。“问”比机械直译为“说”更符合现代汉语；“这些事”则保留原文指称的概括性。脚注标记置于完整问句之后。
