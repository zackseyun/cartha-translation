  text: ⸂ἐκτεθέντος δὲ αὐτοῦ ἀνείλατο αὐτὸν⸃ ἡ θυγάτηρ Φαραὼ καὶ ἀνεθρέψατο αὐτὸν ἑαυτῇ εἰς υἱόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/021.yaml
  text: But when he had been exposed[b][a], Pharaoh’s daughter took him up and raised him as her own son.
translation:
  language: zh_hans
  text: 他被弃置在外[a]以后，法老的女儿把他抱起来[b]，当作自己的儿子抚养[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“被放在外面”。原文描述婴孩被置于外面、暴露于危险中的处境，但没有明确说明行为者的动机。
    reason: lexical_alternative
  - marker: b
    text: 或译“把他收留下来”。这里的希腊动词在弃婴语境中可指抱起并接纳被弃置的孩子。
    reason: lexical_alternative
  - marker: c
    text: 原文直译“归自己作儿子”或“给自己作儿子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκτεθέντος
  choice: 被放在外面
  rationale: 该词在婴孩语境中指被放置在外、任其暴露于危险中。“被放在外面”保留动作本身及其历史文化含义，不以“遗弃”过度判定行为者的动机。
- source_word: δὲ
  choice: 以后（以句式体现叙事转折）
  rationale: δέ在此承接前文并带出情势转变。汉语用“……以后”自然推进叙事；法老女儿的营救与前面的弃置形成的转折由上下文清楚表达，不必生硬加上“但是”。
- source_word: ἀνείλατο
  choice: 把他抱了起来
  rationale: ἀναιρέω的中间语态在弃婴语境中可指将孩子抱起或收留。“抱了起来”先表达眼前的动作，避免提前把它直接译成后文才显明的“收养”。
- source_word: θυγάτηρ Φαραὼ
  choice: 法老的女儿
  rationale: 自然、准确地表达希腊文的属格关系。
- source_word: ἀνεθρέψατο
  choice: 抚养
  rationale: ἀνατρέφω表示养育、把孩子带大；“抚养”是现代汉语中自然且庄重的对应表达。
- source_word: ἑαυτῇ εἰς υἱόν
  choice: 当作自己的儿子
  rationale: ἑαυτῇ表明与法老女儿自己的关系，εἰς υἱόν表示所形成的身份或角色；“当作自己的儿子”自然表达这一结果，同时不必引入具体法律制度意义上的“正式收养”。
theological_decisions: []
