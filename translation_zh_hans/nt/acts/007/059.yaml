  text: καὶ ἐλιθοβόλουν τὸν Στέφανον ἐπικαλούμενον καὶ λέγοντα· Κύριε Ἰησοῦ, δέξαι τὸ πνεῦμά μου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/059.yaml
  text: And they were stoning Stephen as he called out and said[a], “Lord Jesus, receive my spirit.”
translation:
  language: zh_hans
  text: 他们正用石头打司提反的时候，司提反呼求着说[a]：“主耶稣，求你接纳我的灵。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “呼求着说”也可译为“求告并说”。原文的分词可更明确地表示在祷告中呼求或求告。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλιθοβόλουν
  choice: 不断用石头打
  rationale: 未完成时呈现持续进行的动作；“不断用石头打”在现代汉语中自然地保留这一持续意味。
- source_word: ἐπικαλούμενον
  choice: 呼求
  rationale: 该分词修饰司提反，在此指向主耶稣发出恳求，兼有呼唤与祷告中求告的意味；“呼求”比单纯“喊叫”更贴近原词。
- source_word: λέγοντα
  choice: 说
  rationale: 与ἐπικαλούμενον并列，直接引出司提反所说的话；译为“呼求说”简洁自然。
- source_word: Κύριε Ἰησοῦ
  choice: 主耶稣
  rationale: 保留直接称呼的庄重与基督论分量，不把κύριος弱化为一般的“主人”或“老师”。
- source_word: δέξαι
  choice: 求你接纳
  rationale: 命令式在祷告语境中表达恳求；加“求你”符合现代汉语祈求语气，“接纳”保留将自己的灵交托给对方的庄重意味。
- source_word: τὸ πνεῦμά μου
  choice: 我的灵
  rationale: 直译并保留此处关于人在死亡之际将其灵交托给主耶稣的表达，不改释为“生命”或“气息”。
theological_decisions:
- issue: 司提反对耶稣的呼求是否应明确呈现为向复活的耶稣发出的祷告式求告
  choice: 译作“司提反呼求说……主耶稣”
  alternative: “司提反喊着说”或“司提反求告他，说”
  rationale: 原文直接记载司提反称呼耶稣并求他接纳自己的灵。译文不应模糊这一对象；同时正文用自然的“呼求”，脚注说明其可带“求告”的含义，避免加入原文未明说的宾语。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“不断用石头打”保留未完成时的持续性；“呼求说”既自然，又保留求告的宗教语义。直接引语使用感叹号以体现临死呼求的迫切，未增加原文之外的教派性解释。
