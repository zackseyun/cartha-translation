  text: until another king arose over Egypt[b][a], who did not know Joseph.
translation:
  language: zh_hans
  text: 直到另一位统治埃及的王兴起；他不认识约瑟[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “不认识约瑟”也可能含有“不承认约瑟”或“不重视约瑟”的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄχρι οὗ
  choice: 直到
  rationale: 表示时间界限，说明先前的情形一直持续到另一位王出现；“直到”简洁自然。
- source_word: ἀνέστη
  choice: 兴起
  rationale: 保留“起来、兴起”的动词意象，同时在君王语境中自然表达其出现并掌权。
- source_word: βασιλεὺς ἕτερος
  choice: 另一位王
  rationale: 直接表达有一位与先前不同的新王出现，不额外强化“不同种类”的含义。
- source_word: ἐπ’ Αἴγυπτον
  choice: 统治埃及
  rationale: ἐπί加宾格在此与“王”连用，表示对埃及的管辖；明说“统治”比生硬的“在埃及之上”更符合现代汉语。
- source_word: οὐκ ᾔδει
  choice: 不认识
  rationale: 保留οἶδα的基本意义及原文的含混性；语境中也可能含有“不承认、不重视”之意。
- source_word: τὸν Ἰωσήφ
  choice: 约瑟
  rationale: 采用现代中文圣经中通行的人名译法。
theological_decisions: []
