  text: καὶ εἶπεν πρὸς αὐτόν· Ἔξελθε ἐκ τῆς γῆς σου καὶ ⸀ἐκ τῆς συγγενείας σου, καὶ δεῦρο εἰς ⸀τὴν γῆν ἣν ἄν σοι δείξω.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/003.yaml
  text: And he said to him[a], ‘Go out from your land and from your kindred, and come into the land that I will show you.’
translation:
  language: zh_hans
  text: 又对他说：“你要离开本地和亲族[a]，到我将要指给你的那地去。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“亲属”或“家族”。希腊文指一个人所属的血缘亲属群体。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν πρὸς αὐτόν
  choice: 对他说
  rationale: 保留希腊文的代词，不以“亚伯拉罕”替代；上下文已明确所指。
- source_word: Ἔξελθε ἐκ τῆς γῆς σου
  choice: 你要离开本地
  rationale: “离开”自然表达命令及从某处出去的方向；“本地”体现 γῆ 在此处所指的故土或地域，同时避免现代民族国家意味。
- source_word: συγγενείας
  choice: 亲族
  rationale: 该词指由血缘关系构成的亲属群体；“亲族”比“家人”范围更广，也比单说“亲戚”更能体现群体性。
- source_word: δεῦρο εἰς τὴν γῆν
  choice: 到……那地去
  rationale: 按现代汉语的叙述视点自然表达前往某地；希腊文 δεῦρο 的趋向色彩难以逐字保留，译句仍清楚呈现移动方向。
- source_word: ἣν ἄν σοι δείξω
  choice: 我将要指给你的
  rationale: 关系从句带 ἄν 和不定过去时虚拟语气，在此具有面向未来的非特指意味；“将要指给”自然表达未来指示，而不误传为不确定的“也许”。
theological_decisions: []
