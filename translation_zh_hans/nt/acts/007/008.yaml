  text: καὶ ἔδωκεν αὐτῷ διαθήκην περιτομῆς· καὶ οὕτως ἐγέννησεν τὸν Ἰσαὰκ καὶ περιέτεμεν αὐτὸν τῇ ἡμέρᾳ τῇ ὀγδόῃ, ⸀καὶ Ἰσαὰκ τὸν Ἰακώβ, ⸁καὶ Ἰακὼβ τοὺς δώδεκα πατριάρχας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/008.yaml
  text: And he gave him the covenant of circumcision. And so he fathered Isaac and circumcised him on the eighth day, and Isaac fathered Jacob, and Jacob the twelve patriarchs.
translation:
  language: zh_hans
  text: 神赐给他割礼之约。于是，亚伯拉罕生了以撒，并在第八天给他行了割礼；以撒生雅各，雅各生十二位先祖。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “十二位先祖”指雅各的十二个儿子，他们是以色列十二支派的祖先。
    reason: 帮助普通读者理解πατριάρχας在本节具体所指，同时不把解释性信息并入正文。
lexical_decisions:
- source_word: διαθήκην περιτομῆς
  choice: 割礼之约
  rationale: διαθήκη在本段救赎历史语境中指“约”；属格περιτομῆς界定此约以割礼为标记。“割礼之约”简洁、庄重，并与《创世记》17章的特定事件相符。
- source_word: οὕτως
  choice: 于是
  rationale: 承接神赐约一事并引出后续叙事，兼具顺承和结果意味；现代汉语自然流畅。
- source_word: ἐγέννησεν
  choice: 生了／生
  rationale: 在男性作主语的家谱语境中表示生育、成为父亲；汉语家谱常用“生”，简洁自然，无须添加希腊文未明说的“成为……的父亲”。首处用“生了”使句子更顺畅，后两处用“生”保持家谱式简练。
- source_word: περιέτεμεν
  choice: 给他行了割礼
  rationale: 准确表达περιτέμνω；“行割礼”是现代中文圣经和宗教历史语境中的标准说法，加“给他”明确受事者。
- source_word: τῇ ἡμέρᾳ τῇ ὀγδόῃ
  choice: 在第八天
  rationale: 按时间与格直译为自然汉语，不擅自补入“出生后”。
- source_word: πατριάρχας
  choice: 先祖
  rationale: πατριάρχης在此指以色列十二支派的祖先。“先祖”比“族长”更能直接体现家谱关系，也比音译或生硬术语更易为普通读者理解。
- source_word: Ἰσαὰκ / Ἰακώβ
  choice: 以撒／雅各
  rationale: 采用现代简体中文圣经传统中通行且易识别的人名译法。
- source_word: αὐτῷ / implied subject of ἐγέννησεν
  choice: 他／亚伯拉罕
  rationale: 希腊文以代词及承前省略的主语指亚伯拉罕。中文若连续使用“他”可能误指神，因此在“生了以撒”前明示“亚伯拉罕”，属于为消除目标语歧义所作的必要补明。
theological_decisions:
- issue: 亚伯拉罕之约的特指性
  choice: 译作“割礼之约”
  alternative: “一个割礼的约”／“以割礼为标记的约”
  rationale: 上下文指向神赐给亚伯拉罕、见于《创世记》17章的特定约。“割礼之约”保留原文紧凑的属格结构，不额外阐释割礼与约之间究竟是内容、标记还是特征的全部关系。
- issue: οὕτως与生育、割礼的逻辑联系
  choice: 译作“于是”
  alternative: “这样”／“因此”
  rationale: 原词可表达方式、顺承或结果。选“于是”保留叙事上的承接，避免用“因此”过度断定神赐约直接导致以撒出生。
- issue: 十二位πατριάρχας的身份称谓
  choice: 译作“十二位先祖”，并加注说明
  alternative: “十二位族长”／“十二位宗祖”
  rationale: “先祖”准确呈现他们作为以色列支派祖先的身份；脚注补明其历史所指，避免正文加入原文没有的“支派”等解释成分。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“割礼之约”“行了割礼”保留经文的盟约与礼仪用语；通过明示“亚伯拉罕”避免中文代词误指神。分号呈现从亚伯拉罕到雅各的家谱推进。
