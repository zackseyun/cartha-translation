  text: Ἐγὼ ὁ θεὸς τῶν πατέρων σου, ὁ θεὸς Ἀβραὰμ ⸀καὶ Ἰσαὰκ ⸁καὶ Ἰακώβ. ἔντρομος δὲ γενόμενος Μωϋσῆς οὐκ ἐτόλμα κατανοῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/032.yaml
  text: I am the God of your fathers[a], the God of Abraham and Isaac and Jacob[b]. Then Moses became terrified and did not dare to look closely.
translation:
  language: zh_hans
  text: “我是你列祖的上帝，就是亚伯拉罕、以撒和雅各的上帝。”摩西吓得发抖，不敢仔细观看。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “仔细观看”也可译作“仔细察看”或“细察”。希腊文动词既可指认真观看，也可指留心思考。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγὼ ὁ θεὸς τῶν πατέρων σου
  choice: 我是你列祖的上帝
  rationale: 希腊文是带强调代词的无系词身份宣告；汉语补出“是”最自然。“列祖”既表达摩西的先祖，也保留经文中的传统与盟约语感。
- source_word: ὁ θεὸς Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ
  choice: 就是亚伯拉罕、以撒和雅各的上帝
  rationale: “就是”自然引出同位说明；人名之间按现代汉语列举，同时保留末项前的“和”。
- source_word: ἔντρομος δὲ γενόμενος
  choice: 摩西吓得发抖
  rationale: ἔντρομος兼有恐惧与战栗之意；“吓得发抖”在现代汉语中自然表达其强烈程度，并以有限谓语顺畅呈现γενόμενος所表示的进入状态。δέ作为轻微叙事转折无需机械译出。
- source_word: οὐκ ἐτόλμα
  choice: 不敢
  rationale: 准确而自然地表达因恐惧而没有胆量采取行动；希腊文未完成时的持续意味由上下文足以体现。
- source_word: κατανοῆσαι
  choice: 仔细观看
  rationale: 在燃烧荆棘的视觉语境中，该词指专注、细察；此译既保留视觉动作，也体现认真观察的含义。
theological_decisions:
- issue: 出埃及记引文中的神圣自我宣告
  choice: 我是你列祖的上帝
  alternative: 我，你列祖的上帝
  rationale: 原文身份句没有明写系词，但现代汉语需补“是”才自然完整；这保留自我宣告的力度，不额外引入神学解释。
- issue: “列祖”与具体族长名单的关系
  choice: 就是亚伯拉罕、以撒和雅各的上帝
  alternative: 亚伯拉罕的上帝、以撒的上帝、雅各的上帝
  rationale: 希腊文本只在名单前出现一次“上帝”，故不重复补入；“就是”表明后半句具体说明前面的“列祖”。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“列祖”保留经文引用的传统语感；“吓得发抖”比单译“害怕”更充分表达ἔντρομος，同时保持口语可懂度。脚注标记已置于相关句末。
