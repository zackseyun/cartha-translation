  text: καὶ ἐμοσχοποίησαν ἐν ταῖς ἡμέραις ἐκείναις καὶ ἀνήγαγον θυσίαν τῷ εἰδώλῳ, καὶ εὐφραίνοντο ἐν τοῖς ἔργοις τῶν χειρῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/041.yaml
  text: And in those days they made a calf and offered a sacrifice to the idol[b][a], and they were rejoicing in the works of their hands.
translation:
  language: zh_hans
  text: 在那些日子，他们造了一头牛犊[a]，向那偶像献上祭物，并以自己双手所做的为乐[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“塑造了一头牛犊。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“因自己双手所做的而欢喜。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμοσχοποίησαν
  choice: 造了一头牛犊
  rationale: 该动词指制作或塑造牛犊。“造了一头牛犊”简洁自然；下文已明确称其为“偶像”，无须在此重复添加“像”。
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: 在那些日子
  rationale: 保留原文常见的时间表达，现代汉语中也自然明晰。
- source_word: ἀνήγαγον θυσίαν
  choice: 献祭
  rationale: 在祭祀语境中，该短语表示把祭物献上；“献祭”准确、凝练，并清楚传达宗教礼仪行为。
- source_word: τῷ εἰδώλῳ
  choice: 向那偶像
  rationale: 定冠词所指应是刚提到的牛犊；“那偶像”既明确回指，也保留 εἴδωλον 的贬义和对偶像崇拜的谴责。
- source_word: εὐφραίνοντο
  choice: 欢喜
  rationale: 表示欣喜、庆乐。原文未完成时所含的持续意味可由整句叙事语境承载；中文不宜机械增加体貌成分。
- source_word: ἐν τοῖς ἔργοις τῶν χειρῶν αὐτῶν
  choice: 因自己双手所做的
  rationale: 既保留“自己双手”这一反偶像崇拜的修辞意象，也用自然汉语表达 ἐν 在此可具有的缘由或所系对象之意。
theological_decisions:
- issue: 偶像崇拜用语及其修辞力度
  choice: 将 εἴδωλον 译为“偶像”，并保留“自己双手所做的”这一意象。
  alternative: 将其译为“像”，并把末句简化为“为自己所造的庆贺”。
  rationale: 司提反的话沿用圣经对偶像崇拜的批判性语言。“偶像”和“双手所做的”共同凸显人敬奉自己造物的荒谬，同时不额外加入原文没有的教义解释。
- issue: ἐν 与欢喜对象之间的关系
  choice: 译为“因自己双手所做的而欢喜”。
  alternative: 译为“以自己双手的作品为乐”。
  rationale: 介词结构可表达欢喜所围绕的对象或缘由。正文采用较自然的因由表达，脚注保留较贴近形式的另一译法，避免把细微语义限定得过死。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“造”“献祭”“偶像”均为普通读者熟悉的词；末句保留“双手所做的”这一圣经式意象，又避免生硬直译为“在他们手的作品中欢喜”。脚注标记均置于相应词句之后。
