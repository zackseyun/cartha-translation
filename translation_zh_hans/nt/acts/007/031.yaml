id: ACT.7.31
reference: Acts 7:31
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ δὲ Μωϋσῆς ἰδὼν ⸀ἐθαύμασεν τὸ ὅραμα. προσερχομένου δὲ αὐτοῦ κατανοῆσαι ἐγένετο φωνὴ ⸀κυρίου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/031.yaml
  text: 'When Moses saw it[a], he marveled at the sight. And as he came near to look closely[c][b], a voice of the Lord came:'
translation:
  language: zh_hans
  text: 摩西看见这景象[a]，就很惊奇。他走近要仔细察看时，主的声音传来[b][c]：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“这异象”。希腊词可指眼前可见的显现或异象；这里译作“景象”，因为摩西正对燃烧的荆棘作出反应。
    reason: lexical_alternative
  - marker: b
    text: 或译“有主的声音传来”。
    reason: lexical_alternative
  - marker: c
    text: 这里的场景呼应《出埃及记》第3章，因此也可按其所指译作“耶和华”；但本节希腊文写的是“主”（κύριος）。
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδὼν
  choice: 看见
  rationale: 不定过去时分词表示先于主句动作发生的动作；汉语以“看见……就……”自然呈现其时间关系。宾语由后面的“这景象”承接，无须另加代词。
- source_word: ἐθαύμασεν
  choice: 很惊奇
  rationale: θαυμάζω在此表达因异常景象而惊讶、诧异；“很惊奇”现代、易懂，同时保留惊叹意味。
- source_word: τὸ ὅραμα
  choice: 这景象
  rationale: ὅραμα可指所见的显现、景象或异象。此处摩西面对可见的燃烧荆棘，“景象”切合叙事，又不把它限定为内在异象。
- source_word: προσερχομένου
  choice: 他走近……时
  rationale: 属格独立结构表达同时发生的时间和伴随情形；“走近……时”自然保留摩西向前接近的动作。
- source_word: κατανοῆσαι
  choice: 要仔细察看
  rationale: κατανοέω含专注观察、仔细考察之意；“仔细察看”保留视觉语境及目的不定式的功能。
- source_word: ἐγένετο φωνὴ
  choice: 声音传来
  rationale: ἐγένετο加名词在此引入事件。“传来”是自然的汉语叙事表达，既不生硬直译为“有声音发生”，也不额外指定是谁听见。
- source_word: κυρίου
  choice: 主的
  rationale: κύριος按希腊文本译作“主”；属格短语φωνὴ κυρίου自然译为“主的声音”。不改作代表四字神名的“耶和华”。
theological_decisions:
- issue: 显现语境中κύριος的译法
  choice: 主
  alternative: 耶和华
  rationale: 本节希腊文写的是κύριος，而非希伯来文四字神名。虽场景呼应《出埃及记》第3章并指向以色列的神，正文仍按现存希腊措辞译作“主”，避免把互文所暗示的身份形式直接替换进正文。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语体。“这景象”保留ὅραμα在可见景象与异象之间的语义空间；“仔细察看”准确表达摩西走近的目的。脚注标记均置于相关正文之后。
