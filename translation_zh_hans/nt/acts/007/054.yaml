  text: Ἀκούοντες δὲ ταῦτα διεπρίοντο ταῖς καρδίαις αὐτῶν καὶ ἔβρυχον τοὺς ὀδόντας ἐπ’ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/054.yaml
  text: When they heard these things[a], they were cut to the heart and gnashed their teeth at him.
translation:
  language: zh_hans
  text: 他们听见这些话，心里如同被锯割[a]，就向司提反咬牙切齿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“心里极其恼怒”。希腊原文的动词直译为“被锯割”，形象地表达他们内心受到强烈刺激。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούοντες δὲ ταῦτα
  choice: 他们听见这些话
  rationale: 分词短语交代主句发生的情境，译为“听见”自然表达时间关系；δέ仅作轻微承接，汉语无需另加连接词；ταῦτα回指司提反先前所说的话。
- source_word: διεπρίοντο ταῖς καρδίαις αὐτῶν
  choice: 心里如同被锯割
  rationale: διεπρίοντο本义具有“锯开、锯割”的强烈意象，此处描述内心受到剧烈刺激、怒不可遏。“心里如同被锯割”既保留形象，也避免把情绪单一定解为悲痛或悔悟。
- source_word: ἔβρυχον τοὺς ὀδόντας
  choice: 咬牙切齿
  rationale: 现代汉语成语准确传达磨牙、切齿的动作及其敌意和愤怒。
- source_word: ἐπ’ αὐτόν
  choice: 向司提反
  rationale: ἐπί表示敌意所指向的对象。汉语若仅说“向他”也准确，但本节单独阅读时明确人名更清楚，所指由上下文确定。
theological_decisions:
- issue: διεπρίοντο所表达的内心反应
  choice: 保留“被锯割”的意象，不明确限定为悔恨或单纯愤怒
  alternative: 他们心里极其恼怒
  rationale: 该动词在此显然表示强烈的内在激动，而随后“咬牙切齿”显出敌意；但直译意象本身不宜被完全化约为某一种心理状态。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“如同被锯割”保留原文罕见而强烈的比喻；“咬牙切齿”为自然且有力度的现代汉语表达。
