  text: Καθὼς δὲ ἤγγιζεν ὁ χρόνος τῆς ἐπαγγελίας ἧς ⸀ὡμολόγησεν ὁ θεὸς τῷ Ἀβραάμ, ηὔξησεν ὁ λαὸς καὶ ἐπληθύνθη ἐν Αἰγύπτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/017.yaml
  text: But as the time of the promise that God had made to Abraham was drawing near[a], the people increased and multiplied in Egypt,
translation:
  language: zh_hans
  text: 但神向亚伯拉罕所作[a]的应许所定的时期渐渐临近时，百姓在埃及增长，人数增多。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “所作”也可译作“所应许”或“所承诺”。这里的希腊语动词可以表示作出或确认一项承诺；原词本身不一定含有“起誓”的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: Καθὼς δὲ
  choice: 但……时
  rationale: καθώς引出时间从句，δέ表示轻微转折或话语推进；用“但……时”同时保留这两层作用。
- source_word: ἤγγιζεν
  choice: 即将……时
  rationale: 未完成时描写逐渐临近的过程；现代汉语以“即将……时”自然表达临近状态。
- source_word: ὁ χρόνος τῆς ἐπαγγελίας
  choice: 应许即将应验时
  rationale: 直译“应许的日期”在现代汉语中容易被误解为作出应许的日期；结合上下文，以“应许即将应验时”表达该应许所指之时临近，不增添具体日期或方式。
- source_word: ὡμολόγησεν
  choice: 所作
  rationale: 此处ὁμολογέω与“应许”及领受者连用，表示公开作出或确认承诺。“所作的应许”自然、庄重，也避免用“起誓”强化原文没有明确表达的誓言含义。
- source_word: ὁ θεὸς τῷ Ἀβραάμ
  choice: 神向亚伯拉罕
  rationale: 保留神为主语，并以“向”自然表达与承诺动词连用的间接受词。
- source_word: ηὔξησεν ὁ λαὸς καὶ ἐπληθύνθη
  choice: 百姓日益兴旺，人数不断增多
  rationale: 以两个并列分句保留“增长”和“增多”的双重表达；“百姓”指此处作为整体的以色列民，而“人数不断增多”明确人口增长之意。
- source_word: ἐν Αἰγύπτῳ
  choice: 在埃及
  rationale: 按普通地点短语直接翻译。
theological_decisions:
- issue: ὡμολόγησεν如何描述神对亚伯拉罕的应许
  choice: 译为“所作的应许”
  alternative: “所应许的”“所承诺的”“所起誓应许的”
  rationale: 原词在此表示作出或宣告承诺。“所作的应许”准确传达神的承诺，同时不把它加强为原文未明确使用的起誓用语。
- issue: ὁ χρόνος τῆς ἐπαγγελίας所指的时间
  choice: 译为“应许即将应验时”
  alternative: “应许的日期渐渐临近时”
  rationale: 上下文关注应许所指向的实现阶段临近。此译法避免现代汉语把“应许的日期”误读成应许最初说出的日期，同时不具体断定应验的完整方式或范围。
translation_notes:
  register: 采用现代、庄重且便于普通读者理解的书面语。“即将应验时”使希腊语结构在汉语中自然清楚；“日益兴旺，人数不断增多”保留原文两个增长动词的并列修辞。
