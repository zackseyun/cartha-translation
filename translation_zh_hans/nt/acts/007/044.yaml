  text: Ἡ σκηνὴ τοῦ μαρτυρίου ἦν τοῖς πατράσιν ἡμῶν ἐν τῇ ἐρήμῳ, καθὼς διετάξατο ὁ λαλῶν τῷ Μωϋσῇ ποιῆσαι αὐτὴν κατὰ τὸν τύπον ὃν ἑωράκει,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/044.yaml
  text: The tent of testimony was with our fathers in the wilderness[a], just as the one speaking to Moses directed him to make it according to the pattern that he had seen[c][b],
translation:
  language: zh_hans
  text: 见证的帐幕[a]在旷野中与我们的先祖[b]同在，正如那位对摩西说话的[c]吩咐摩西照着他所看见的样式造它一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“见证帐棚”；传统上也常称“会幕”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译“我们的父辈”。
    reason: lexical_alternative
  - marker: c
    text: 或译“那位曾对摩西说话的”；也可按上下文理解为“对摩西说话的神（或主）”。原文没有明说这位说话者的身份。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἡ σκηνὴ τοῦ μαρτυρίου
  choice: 见证的帐幕
  rationale: 保留原文“帐幕”与“见证”的属格关系，既呈现可移动圣所的基本形象，也不直接用传统术语替代原文措辞。
- source_word: τοῖς πατράσιν ἡμῶν
  choice: 我们的先祖
  rationale: “先祖”自然表达以色列历史中的前辈，并保留原文所指的祖辈群体；脚注说明原文直译为“我们的父辈”。
- source_word: ἐν τῇ ἐρήμῳ
  choice: 在旷野中
  rationale: 采用现代汉语中自然且具有圣经地理语境的对应表达。
- source_word: καθὼς διετάξατο
  choice: 正如……所吩咐的
  rationale: “正如”表达对应关系，“吩咐”体现命令具有权威性，同时保持庄重自然。
- source_word: ὁ λαλῶν τῷ Μωϋσῇ
  choice: 那位对摩西说话的
  rationale: 按原文将分词结构名词化，不擅自补明说话者是“神”或“主”。
- source_word: ποιῆσαι αὐτὴν
  choice: 把它造出来
  rationale: 用自然现代汉语表达制造、建造帐幕的动作，并以“它”回指帐幕。
- source_word: κατὰ τὸν τύπον
  choice: 照着……样式
  rationale: “样式”能表达摩西受指示时所见的模型或范式，也符合本段建造圣所的语境。
- source_word: ὃν ἑωράκει
  choice: 摩西……所看见的
  rationale: 原文动词所省略的主语由上下文指向摩西；汉语补出“摩西”可避免“他”被误解为那位说话者，并保留先看见、后建造的关系。
theological_decisions:
- issue: “那位对摩西说话的”所指是谁
  choice: 不在正文中补明其身份
  alternative: 译作“对摩西说话的神”或“对摩西说话的主”
  rationale: 原文使用带冠词的分词，却没有在本节明说“神”或“主”；译文保留这一含蓄表达，不以解释取代原文。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“见证的帐幕”有意贴近原文并保留其圣经术语色彩；通过冒号重组长句，使命令内容在汉语中清楚，同时不改变原文逻辑。
