  text: But Solomon built a house for him[a].
translation:
  language: zh_hans
  text: 但所罗门为他建造了一所房屋[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 即圣殿；希腊文作“房屋”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Σολομῶν
  choice: 所罗门
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: δὲ
  choice: 但
  rationale: δέ在此承接叙事并带有轻微转折；“但”既自然，也能显出上下文中大卫有意建造而所罗门实际建成，以及随后关于至高者不住人手所造之处的张力。
- source_word: οἰκοδόμησεν
  choice: 建造了
  rationale: 此处具体指建筑物的营建，简明直译为“建造了”。
- source_word: αὐτῷ
  choice: 为他
  rationale: 与格代词在语境中指神；“为他建造”自然表达该建筑是为敬奉神而建。
- source_word: οἶκον
  choice: 一座殿宇
  rationale: οἶκος字面为“房屋、居所”，语境所指则是圣殿。“殿宇”既能让现代读者明确理解所指，又比“圣殿”略为保留“房屋/居所”的措辞；字面意义在脚注中注明。
theological_decisions:
- issue: οἶκον应译作一般性的“房屋”还是语境性的“殿宇/圣殿”
  choice: 殿宇
  alternative: 房屋；圣殿
  rationale: 原词并非专指圣殿的ναός或ἱερόν，而是普通的οἶκος；然而在此明确指所罗门所建的圣殿。主文用“殿宇”兼顾中文自然度和所指对象，脚注保留希腊文“房屋”的字面措辞，从而不抹去下一节关于神不住人手所造居所的神学张力。
translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语。“一座”符合中文建筑物量词习惯；代词“他”依上下文指神。
