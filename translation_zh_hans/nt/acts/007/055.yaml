source:
  edition: SBLGNT
  text: ὑπάρχων δὲ πλήρης πνεύματος ἁγίου ἀτενίσας εἰς τὸν οὐρανὸν εἶδεν δόξαν θεοῦ καὶ Ἰησοῦν ἑστῶτα ἐκ δεξιῶν τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/055.yaml
  text: But being full of the Holy Spirit[a], he gazed into heaven and saw the glory of God, and Jesus standing at the right hand of God[b],
translation:
  language: zh_hans
  text: 但司提反满有圣灵，就定睛望天，看见了上帝的荣耀，又看见耶稣站在上帝的右边[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在上帝的右边”是圣经中的惯用表达，表示处于尊荣和权柄的地位。
    reason: cross_reference
lexical_decisions:
- source_word: ὑπάρχων δὲ
  choice: 但司提反……
  rationale: δέ承接上文，并与敌对者的反应形成轻微对比，译作“但”；希腊文主语承前省略，中文补出“司提反”以避免歧义。ὑπάρχων表示当时持续处于某种状态，融入“满有”表达。
- source_word: πλήρης πνεύματος ἁγίου
  choice: 满有圣灵
  rationale: 这是《路加福音—使徒行传》中常见的表达，指司提反被圣灵充满、受圣灵支配的状态；“满有圣灵”自然庄重，也没有把圣灵化约为一种品质。
- source_word: ἀτενίσας εἰς τὸν οὐρανὸν
  choice: 定睛望天
  rationale: ἀτενίζω含专注凝视之意；“定睛望天”简洁保留动作的专注强度。此处οὐρανός处于异象语境，“天”兼具自然中文和超越性含义。
- source_word: εἶδεν δόξαν θεοῦ
  choice: 看见了上帝的荣耀
  rationale: 直译核心结构，保留“荣耀”这一重要圣经概念，不将其具体化为光辉或形象。
- source_word: καὶ Ἰησοῦν ἑστῶτα
  choice: 又看见耶稣站着
  rationale: 第二个καί连接同一动词所支配的另一宾语，中文补出“看见”使句法清楚。ἑστῶτα描述耶稣所处的站立姿态，不推断站立的特殊原因。
- source_word: ἐκ δεξιῶν τοῦ θεοῦ
  choice: 在上帝的右边
  rationale: ἐκ δεξιῶν是表示位置的固定表达。现代中文“在……右边”清楚自然，并保留右侧尊荣与权柄的圣经意象。
theological_decisions:
- issue: πνεύματος ἁγίου所指为何
  choice: 圣灵
  alternative: 圣洁的灵／圣洁心灵
  rationale: 按《路加福音—使徒行传》的用法和本段叙事，所指是圣灵，而非司提反个人的一种圣洁气质；译文不额外展开位格教义。
- issue: 耶稣与上帝的关系及位置意象
  choice: 耶稣站在上帝的右边
  alternative: 耶稣从上帝右边站起／耶稣站在上帝右手上
  rationale: 译文保持原文对“上帝”和“耶稣”的区分，也保留耶稣被高举的位置意象；不把ἑστῶτα解释为“站起”，因为原文只明确其站立状态。
- issue: “右边”意象的处理
  choice: 正文保留空间性表达，脚注说明惯用含义
  alternative: 正文直接释为“处于最高尊荣和权柄的地位”
  rationale: 原文既呈现异象中的位置，也承载尊荣与权柄的传统含义。保留图像并用脚注说明，避免以解释取代正文。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“定睛望天”保留原文凝视的力度；“上帝的右边”比“上帝的右手”更符合此处位置表达。正文中的脚注标记[a]与脚注完全对应。
