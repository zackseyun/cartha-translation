  text: ἣν καὶ εἰσήγαγον διαδεξάμενοι οἱ πατέρες ἡμῶν μετὰ Ἰησοῦ ἐν τῇ κατασχέσει τῶν ἐθνῶν ὧν ἐξῶσεν ὁ θεὸς ἀπὸ προσώπου τῶν πατέρων ἡμῶν ἕως τῶν ἡμερῶν Δαυίδ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/045.yaml
  text: which our fathers in turn brought in with Joshua at the dispossession of the nations that God drove out from before our fathers[b][a], until the days of David.
translation:
  language: zh_hans
  text: 这见证的帐幕，我们的祖先承接下来，同约书亚[a]带进了那片土地；当时，上帝从我们祖先面前赶出了各族，直到大卫的日子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作“耶稣”；“耶稣”和“约书亚”在希腊文中使用同一名称形式。这里指嫩的儿子约书亚。
    reason: alternative_reading
lexical_decisions:
- source_word: ἣν
  choice: 这帐幕
  rationale: 阴性单数关系代词回指上一节的“见证帐幕”。汉语明示所指，比生硬使用关系结构更清楚。
- source_word: εἰσήγαγον
  choice: 带进了那片土地
  rationale: εἰσάγω表示带入；依据进入迦南的语境补出“那片土地”，使汉语表达完整自然。
- source_word: διαδεξάμενοι
  choice: 承接下来
  rationale: 保留διαδέχομαι所含从前人手中接续领受的意思，而不只译成次序性的“随后”。
- source_word: οἱ πατέρες ἡμῶν
  choice: 我们的祖先
  rationale: 现代汉语中“祖先”自然表达历代先辈，也保留司提反与听众共同历史身份的语气。
- source_word: μετὰ Ἰησοῦ
  choice: 同约书亚
  rationale: Ἰησοῦ既可对应耶稣，也可对应约书亚；此处处于摩西以后进入迦南的历史背景，所指是嫩的儿子约书亚。
- source_word: ἐν τῇ κατασχέσει τῶν ἐθνῶν
  choice: 带进了那片土地；当时……赶出了那里的各族
  rationale: 该短语句法紧缩，κατάσχεσις可指取得、占有或占领。结合后面的关系从句，以进入土地及赶出当地各族来表达情境，同时避免误说祖先“占有各族”。
- source_word: ὧν ἐξῶσεν ὁ θεὸς
  choice: 上帝……赶出了那里的各族
  rationale: ἐξωθέω意为推出、逐出；“赶出”准确而通俗。关系代词ὧν以“那里的各族”自然承接。
- source_word: ἀπὸ προσώπου τῶν πατέρων ἡμῶν
  choice: 从我们祖先面前
  rationale: 保留带闪语色彩的空间性表达，同时在现代汉语中仍清楚可懂。
- source_word: ἕως τῶν ἡμερῶν Δαυίδ
  choice: 一直存留到大卫的日子
  rationale: 原文省略了明确主语和动词，范围可能承接帐幕在当地的存留。补出“一直存留”使汉语成句，并以脚注说明原文的简略和可能附着关系。
theological_decisions:
- issue: Ἰησοῦ的所指
  choice: 约书亚
  alternative: 耶稣
  rationale: 希腊语名称形式相同，但上下文讲以色列人在摩西之后进入那地，明确指嫩的儿子约书亚；脚注保留原文名称形式上的歧义。
- issue: διαδεξάμενοι的语力
  choice: 祖先承接帐幕以后将它带入
  alternative: 祖先依次把它带入
  rationale: 分词兼有接续和领受之意。“承接下来”保留从前代继承保管的意味，不将其淡化为单纯的时间次序。
- issue: ἕως τῶν ἡμερῶν Δαυίδ的附着与省略
  choice: 理解为帐幕一直存留到大卫时期
  alternative: 把“直到大卫的日子”宽泛连接于此前整个历史叙述
  rationale: 希腊文结尾简略，没有明说“存留”；根据上下文和下一节转入大卫，正文作自然补足，脚注公开说明原文形式，避免把解释伪装成明文。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“帐幕”“约书亚”“大卫”等沿用广为人知的圣经称谓；拆分希腊文长句以提高可读性，同时用分号维持历史叙述的连贯。所有脚注标记均已置于正文。
