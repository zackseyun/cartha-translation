  terminology: “帐幕”“约书亚”“上帝”“大卫”均符合现代中文圣经语域。“我们的祖先”恰当。脚注a正确说明希腊文Ἰησοῦ的名称形式，但“同一个名字”宜改为“同一名称形式”，以免在中文姓名层面造成不必要的表述混淆。
