  text: But the man who was wronging his neighbor pushed him away[a], saying, ‘Who appointed you ruler and judge over us?’
translation:
  language: zh_hans
  text: 可是，那正在欺负邻舍的人把他推开[a]，说：“谁立你作我们的首领和审判官？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“把他猛力推到一旁”。这个希腊词既可强调有力的身体动作，也可表达轻蔑地拒绝。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδικῶν
  choice: 欺负
  rationale: 现在分词表示正在发生的行为；“欺负”在叙事语境中自然表达不公正地伤害、亏待对方，也与随后的肢体冲突相称。
- source_word: πλησίον
  choice: 同胞
  rationale: 该词通常指邻舍或身边的人；此处上下文明确是以色列人彼此争斗，“同胞”自然表达这一关系，但不进一步限定具体身份。
- source_word: ἀπώσατο
  choice: 把他推开
  rationale: 该不定过去时中间语态动词可表达用力推开，也含排斥之意；正文采用具体的肢体动作，同时以脚注保留较强或较偏拒斥性的理解。
- source_word: κατέστησεν
  choice: 立
  rationale: 在“立某人作首领和审判官”的结构中，“立”简洁自然，准确表达任命、设立之意。
- source_word: ἄρχοντα
  choice: 首领
  rationale: 表达掌权、领导者的身份，与本节对摩西权柄的质疑相符。
- source_word: δικαστὴν
  choice: 审判官
  rationale: 直接表达负责裁断争端的人；与“首领”并列，保留原文的两个权柄角色。
- source_word: ἐφ’ ἡμῶν
  choice: 我们的
  rationale: 汉语“作我们的首领和审判官”自然表达对我们行使权柄，传达ἐπί加属格在此处的管辖意义。
