source:
  edition: SBLGNT
  text: ἐν ᾧ καιρῷ ἐγεννήθη Μωϋσῆς, καὶ ἦν ἀστεῖος τῷ θεῷ· ὃς ἀνετράφη μῆνας τρεῖς ἐν τῷ οἴκῳ τοῦ πατρός·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/020.yaml
  text: At that time Moses was born[a], and he was beautiful to God. He was brought up for three months in his father's house.
translation:
  language: zh_hans
  text: 那时，摩西出生了；他在上帝眼中是俊美的[a]。他在父亲家中被抚养了三个月。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文也可直译为“对上帝是俊美的”。“俊美”还可译作“美好”或“出众”；原文明说到上帝，因此正文予以保留。
    reason: 说明 ἀστεῖος τῷ θεῷ 的句法关系及词义范围，保留原文的真实歧义。
lexical_decisions:
- source_word: ἐν ᾧ καιρῷ
  choice: 那时
  rationale: 这是自然的现代汉语时间表达，准确保留原文所指的时段。
- source_word: ἐγεννήθη
  choice: 出生了
  rationale: γεννάω 的不定过去时被动语态在此指人的出生；译为“出生了”简明自然。
- source_word: Μωϋσῆς
  choice: 摩西
  rationale: 采用现代中文圣经与公众语境中通行的人名译法。
- source_word: ἀστεῖος
  choice: 俊美
  rationale: 该词可指外貌俊美，也可泛指美好、出众；“俊美”保留其最直接的描述意义，又不把它解释成某种特定的属灵品质。
- source_word: τῷ θεῷ
  choice: 在上帝眼中
  rationale: 将与格理解为评价或参照，明确保留原文对上帝的提及，同时使用自然中文表达。
- source_word: ὃς
  choice: 他
  rationale: 另起一句用“他”承接摩西，比机械保留关系代词结构更符合现代汉语。
- source_word: ἀνετράφη
  choice: 被抚养
  rationale: 保留动词的被动意义，表达摩西在家中受到养育。
- source_word: μῆνας τρεῖς
  choice: 三个月
  rationale: 汉语用时长宾语即可自然表达持续时间，无须另加介词。
- source_word: ἐν τῷ οἴκῳ τοῦ πατρός
  choice: 在父亲家中
  rationale: 自然保留父亲的家庭或住所这一含义，不额外指定抚养者。
theological_decisions:
- issue: ἀστεῖος τῷ θεῷ 的含义
  choice: 他在上帝眼中是俊美的
  alternative: 他对上帝来说是俊美的；他极其俊美；他是个出众的孩子
  rationale: 原文明确含有“上帝”，因此正文不将其淡化为纯粹的人间评价；同时，“在上帝眼中”保持评价关系，不进一步推断上帝的拣选、认可或其他神学含义。脚注说明该短语和形容词仍有其他可能理解。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“那时”简洁承接上下文；以分号连接出生与对摩西的描述，再另句叙述三个月的养育。避免使用生硬的“对上帝是俊美的”作为正文，也不把“俊美”神学化为“蒙上帝喜悦”或“为上帝所拣选”。
