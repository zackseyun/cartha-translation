  text: καὶ ἐπαιδεύθη ⸀Μωϋσῆς πάσῃ σοφίᾳ Αἰγυπτίων, ἦν δὲ δυνατὸς ἐν λόγοις καὶ ἔργοις ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/022.yaml
  text: And Moses was educated in all the wisdom of the Egyptians, and he was mighty in his words and deeds.
translation:
  language: zh_hans
  text: 摩西接受过埃及人的一切智慧方面的教育；他的言语和行为都大有能力。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：他在说话和行动上都大有能力。
    reason: 为ἐν λόγοις καὶ ἔργοις提供自然的汉语替代表达，同时保留正文“言语和行为”较贴近原文的并列结构。
lexical_decisions:
- source_word: ἐπαιδεύθη
  choice: 接受了……教育
  rationale: 该动词为被动语态，表示摩西受到培养和教导；“接受了……教育”既体现被动含义，也自然适合埃及学识这一语境。
- source_word: πάσῃ σοφίᾳ Αἰγυπτίων
  choice: 埃及人一切智慧
  rationale: 保留 πάσῃ 所表达的广泛范围，并将 Αἰγυπτίων 理解为智慧的归属或来源；此表达也避免把“智慧”缩窄为某一种知识。
- source_word: δυνατὸς
  choice: 大有能力
  rationale: 体现 δυνατός 的强势语义，又比“强大”更适合修饰言语和行为。
- source_word: ἐν λόγοις καὶ ἔργοις
  choice: 言语和行为
  rationale: 贴近希腊文的成对表达，同时是庄重、清楚的现代汉语；脚注提供更口语化的表达。
- source_word: αὐτοῦ
  choice: 他的
  rationale: 明确反映原文代词，使“言语和行为”都自然归属于摩西。
theological_decisions:
- issue: 摩西在“言语”上大有能力与出埃及记4:10之间的张力
  choice: 按本节本身译为“他的言语和行为都大有能力”
  alternative: 为配合出埃及记4:10而弱化为仅指名望、影响力或一般才干
  rationale: 司提反在本节明确描述摩西在言语和行为上的能力；译文不借助其他经文消解或改写这一表述，而保留经文之间真实存在的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“接受了……教育”清楚呈现被动语态；分号保留两个并列分句的平衡。“大有能力”具有适度的圣经文体色彩，但不显陈旧。
