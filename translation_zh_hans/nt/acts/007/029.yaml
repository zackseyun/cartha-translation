base_translation:
  language: en
  yaml_path: translation/nt/acts/007/029.yaml
  text: So Moses fled at this word[a], and became a sojourner in the land of Midian[b], where he fathered two sons.
translation:
  language: zh_hans
  text: 摩西因这句话[a]就逃走了，在米甸地寄居[b]，并在那里生了两个儿子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“听到这话就”。原文短语可表示这句话是摩西逃走的直接诱因。
    reason: lexical_alternative
  - marker: b
    text: 或译：“作了外乡人”或“以外来者身份居住”。原词指住在并非自己故土之地的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφυγεν
  choice: 逃走了
  rationale: 准确表达 φεύγω 的逃离之意，并以自然的现代汉语呈现叙事动作。
- source_word: δὲ
  choice: 就
  rationale: 此处 δέ 承接前文，并与触发摩西离开的事件相连；“就”自然体现叙事推进及轻微的结果意味。
- source_word: ἐν τῷ λόγῳ τούτῳ
  choice: 因这句话
  rationale: 该短语可指摩西因对方所说的话而逃走。“因这句话”保留 λόγος 的言语含义，并明确汉语中自然可感的触发关系；另以脚注保留较贴近形式的理解。
- source_word: ἐγένετο πάροικος
  choice: 寄居
  rationale: πάροικος 指居住在非本乡之地的外来者。“寄居”简洁、庄重，并保留身处异乡的意味，而不过度强调现代法律身份。
- source_word: ἐν γῇ Μαδιάμ
  choice: 在米甸地
  rationale: 保留 γῇ 的“地”这一地理表达，同时采用汉语圣经地名的通行形式“米甸”。
- source_word: οὗ
  choice: 在那里
  rationale: 明确回指米甸地，符合现代汉语叙事习惯。
- source_word: ἐγέννησεν
  choice: 生了
  rationale: γεννάω 在男性作主语时表示成为孩子的父亲。汉语“生了两个儿子”可自然地用于男性，且比“生育了”或“为父”更通俗流畅。
- source_word: υἱοὺς δύο
  choice: 两个儿子
  rationale: 直接、准确地表达原文。
