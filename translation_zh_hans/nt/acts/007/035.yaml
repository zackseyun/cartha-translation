id: ACT.7.35
reference: Acts 7:35
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Τοῦτον τὸν Μωϋσῆν, ὃν ἠρνήσαντο εἰπόντες· Τίς σε κατέστησεν ἄρχοντα καὶ δικαστήν, τοῦτον ὁ θεὸς ⸀καὶ ἄρχοντα καὶ λυτρωτὴν ⸂ἀπέσταλκεν σὺν⸃ χειρὶ ἀγγέλου τοῦ ὀφθέντος αὐτῷ ἐν τῇ βάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/035.yaml
  text: This Moses[a], whom they rejected, saying, ‘Who appointed you a ruler and a judge?’—this man God sent as both ruler and redeemer by the hand of the angel who appeared to him in the bush.
translation:
  language: zh_hans
  text: “这位摩西，就是他们曾拒绝、说‘谁立你作领袖和审判官？’的那一位，神却借着在荆棘中向他显现的天使之手，差派他作领袖和救赎者[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“解救者”。原文所用的词指使人获得释放或自由的人，也含有救赎的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠρνήσαντο
  choice: 拒绝
  rationale: 这里指以色列人不接受摩西的权柄，与《出埃及记》2:14的质问相呼应；“拒绝”比单纯的“否认”更准确自然。
- source_word: κατέστησεν
  choice: 立
  rationale: 此处问的是谁授予摩西职分和权柄；“立……作”既贴近原文，也符合现代汉语中的圣经叙事语体。
- source_word: ἄρχοντα
  choice: 领袖
  rationale: 该词指行使权柄的人。“领袖”在现代汉语中清楚自然，也保留本节前后重复同一职分所形成的反讽与强调。
- source_word: δικαστήν
  choice: 审判官
  rationale: 明确表达负责裁断的人，并比泛指性的“审判者”更能体现职分。
- source_word: λυτρωτὴν
  choice: 救赎者
  rationale: 该词指使人获得释放的人；“救赎者”保留释放与赎回的语义分量，同时不把摩西与基督的身份直接等同。
- source_word: ἀπέσταλκεν
  choice: 差派
  rationale: “差派”自然表达奉神授权执行使命，比一般的“派去”更能体现使命性；汉语不必机械表现希腊语完成时形式。
- source_word: σὺν χειρὶ
  choice: 借着……之手
  rationale: 保留原文带有闪语色彩的媒介表达，并显出天使在这次差派中的中介作用。
- source_word: ἀγγέλου
  choice: 天使
  rationale: 燃烧荆棘的叙事语境表明这里指属天的使者；“天使”是清楚而通行的译法。
- source_word: τοῦ ὀφθέντος αὐτῷ ἐν τῇ βάτῳ
  choice: 在荆棘中向他显现的
  rationale: ὀφθέντος虽为被动形式，在此惯用为“显现”；原句只说“荆棘”，故不增译“燃烧的”。
- source_word: Τοῦτον ... τοῦτον
  choice: 这位摩西……那一位……他
  rationale: 借前置的“这位摩西”和回指的“那一位”保留原文重复指示词的强调，同时避免汉语生硬重复。
- source_word: καὶ ἄρχοντα καὶ λυτρωτὴν
  choice: 作领袖和救赎者
  rationale: 两个并列职分都予以明确保留；汉语无需机械加入“既……又……”，上下文已充分表达双重身份。
theological_decisions:
- issue: 在救恩历史和摩西预表性语境中如何翻译 λυτρωτής
  choice: 救赎者
  alternative: 解救者；释放者
  rationale: “救赎者”保留该词所含的释放、赎回意味，也让路加笔下摩西作为神所差救赎代理人的分量自然呈现；同时，译文本身并未断言摩西与基督具有完全相同的身份或工作。
- issue: 神的差派与天使之手之间的关系
  choice: 神却借着……天使之手，差派他
  alternative: 神在……天使的帮助下差派他；神通过……天使差派他
  rationale: 保留原文的中介性表达而不暗示神需要天使“帮助”；差派的主体仍清楚是神。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“神却”体现被人拒绝与蒙神差派之间的鲜明转折；“借着……之手”有意保留原文的圣经性表达。引语和整句结构经过汉语化处理，但保留“这位摩西……那一位”的强调效果。
