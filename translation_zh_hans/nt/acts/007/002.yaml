  text: ὁ δὲ ἔφη· Ἄνδρες ἀδελφοὶ καὶ πατέρες, ἀκούσατε· Ὁ θεὸς τῆς δόξης ὤφθη τῷ πατρὶ ἡμῶν Ἀβραὰμ ὄντι ἐν τῇ Μεσοποταμίᾳ πρὶν ἢ κατοικῆσαι αὐτὸν ἐν Χαρράν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/002.yaml
  text: 'And he said[a], “Brothers and fathers, listen: the God of glory appeared to our father Abraham when he was in Mesopotamia[b], before he lived in Haran.”'
translation:
  language: zh_hans
  text: 司提反说：“诸位弟兄和父老，请听！荣耀的上帝在我们的祖先亚伯拉罕还在美索不达米亚、尚未定居哈兰以前，向他显现。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “定居”也可译作“居住”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἔφη
  choice: 司提反说
  rationale: δέ在此是轻微的叙事连接，汉语无须机械译出“于是”或“但”。根据上下文补出说话者“司提反”，使独立经节自然清楚。
- source_word: Ἄνδρες ἀδελφοὶ καὶ πατέρες
  choice: 各位弟兄、长辈
  rationale: 这是对公会听众中男性同胞及受尊敬年长者的正式称呼。“各位”传达ἄνδρες在呼语中的正式语气；“弟兄、长辈”比逐字译作“男人、弟兄和父亲”更符合现代汉语，同时保留男性及敬长意味。
- source_word: ἀκούσατε
  choice: 请听
  rationale: 这是要求听众注意的命令式；加“请”符合现代汉语正式陈词的礼貌与庄重语体，并未削弱其呼吁力度。
- source_word: Ὁ θεὸς τῆς δόξης
  choice: 荣耀的上帝
  rationale: 属格结构表示与荣耀的密切关系。“荣耀的上帝”自然且保留称号意味；不扩展为“满有荣耀的上帝”，以免过度解释。
- source_word: ὤφθη
  choice: 曾向他显现
  rationale: 在神显现的语境中，ὤφθη自然译为“显现”，比“被看见”合乎汉语，也不采用解释性更强的“启示自己”。“曾”标示过去事件。
- source_word: τῷ πατρὶ ἡμῶν Ἀβραὰμ
  choice: 向我们的祖先亚伯拉罕……向他
  rationale: πατήρ在此强调群体共同先祖身份，现代汉语用“祖先”比“父亲”准确自然。为配合较长的时间状语，先提出亚伯拉罕，末尾以“向他”承接。
- source_word: ὄντι ἐν τῇ Μεσοποταμίᾳ
  choice: 还住在美索不达米亚
  rationale: 分词表达当时所处情形；“还住在”与后面的“尚未”形成自然时间关系。Μεσοποταμία采用通行中文地名“美索不达米亚”。
- source_word: πρὶν ἢ κατοικῆσαι αὐτὸν ἐν Χαρράν
  choice: 尚未定居哈兰以前
  rationale: κατοικέω可指居住或定居；此处与亚伯拉罕迁居的叙事相连，“定居”自然，但“居住”也可能，故以脚注保存词义范围。Χαρράν采用通行译名“哈兰”。
theological_decisions:
- issue: 对听众的阳性正式称呼
  choice: 各位弟兄、长辈
  alternative: 诸位弟兄和父老；男人、弟兄和父亲
  rationale: 不将明确的男性听众中性化，同时避免逐字译法在现代汉语中产生“三类人”的误解。“长辈”表达πατέρες在正式称呼中的尊敬功能。
- issue: θεὸς τῆς δόξης的表达
  choice: 荣耀的上帝
  alternative: 荣耀之上帝；满有荣耀的上帝
  rationale: 保留该称号与“荣耀”的关系和潜在经文回响，又避免“满有”所增加的解释。“荣耀之上帝”较生硬，不符合普通现代汉语。
- issue: 亚伯拉罕在哈兰以前所处地点的陈述
  choice: 按经文直译为他在美索不达米亚时上帝向他显现
  alternative: 根据创世记叙事重新表述或协调地点次序
  rationale: 忠实保留司提反陈述本身，不借助释经协调来改写经文，也不消除其与其他叙事比较时可能产生的张力。
translation_notes:
  register: 采用现代、庄重而可朗读的法庭陈词语体。“各位弟兄、长辈，请听”既正式又自然；地名使用简体中文圣经语境中的通行形式。脚注标记置于相关整句末，正文与脚注完全对应。
