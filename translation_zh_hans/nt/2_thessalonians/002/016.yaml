id: 2TH.2.16
reference: 2 Thessalonians 2:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Αὐτὸς δὲ ὁ κύριος ἡμῶν Ἰησοῦς Χριστὸς καὶ ⸀θεὸς ⸀ὁ πατὴρ ἡμῶν, ὁ ἀγαπήσας ἡμᾶς καὶ δοὺς παράκλησιν αἰωνίαν καὶ ἐλπίδα ἀγαθὴν ἐν χάριτι,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/016.yaml
  text: May our Lord Jesus the Messiah himself[a], and God our Father, who loved us and gave us eternal encouragement and good hope by grace,
translation:
  language: zh_hans
  text: 愿我们的主耶稣弥赛亚亲自和我们的父神——他爱我们，并借着恩典赐给我们永远的鼓励[a]和美好的盼望——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “鼓励”也可译作“安慰”或“慰藉”。
    reason: παράκλησις 的语义范围包括鼓励、安慰和慰藉；正文依语境采用“鼓励”，脚注保留其他真实可能。
lexical_decisions:
- source_word: Αὐτὸς
  choice: 亲自
  rationale: 这里的 αὐτός 是强调用法；“亲自”自然保留了对主语亲身施行行动的强调。
- source_word: δὲ
  choice: 不单独译出
  rationale: δέ 在此仅作轻微的语篇过渡。现代汉语的祈愿句以“愿”起首已能自然承接上下文，硬译为“现在”会加入原文没有的时间意味，译为“但”则可能造成过强的转折。
- source_word: κύριος
  choice: 主
  rationale: “主”是 κύριος 用作耶稣称号时准确、通行且庄重的译法。
- source_word: Ἰησοῦς Χριστός
  choice: 耶稣弥赛亚
  rationale: Χριστός 在此仍具有称号“受膏者／弥赛亚”的语义；“耶稣弥赛亚”在简体中文中清楚保留这一称号，不把它仅当作姓名的一部分。
- source_word: θεὸς ὁ πατὴρ ἡμῶν
  choice: 我们的父上帝
  rationale: 这一表达同时保留 θεός 与 πατήρ，并以自然的现代汉语表明上帝是“我们的父”。
- source_word: ὁ ἀγαπήσας
  choice: 他爱了我们
  rationale: 以简单过去表达不定过去时分词所指的行动，同时用后置说明保留其与前面并列主语之间的句法张力。
- source_word: δοὺς
  choice: 赐给我们
  rationale: “赐给”符合恩典与盼望由上帝给予的语境，也保留了分词所表达的给予行动。
- source_word: παράκλησιν
  choice: 鼓励
  rationale: παράκλησις 可指鼓励、安慰或慰藉；本段着重使信徒的心坚定，“鼓励”贴合语境，其余合理含义列入脚注。
- source_word: αἰωνίαν
  choice: 永远的
  rationale: 准确表达 αἰώνιος 所指持久、无尽的性质，且是自然的现代汉语。
- source_word: ἐλπίδα ἀγαθήν
  choice: 美好的盼望
  rationale: “美好的”保留 ἀγαθή 的正面价值，“盼望”是 ἐλπίς 在此语境中的通行译法。
- source_word: ἐν χάριτι
  choice: 因恩典
  rationale: 将 ἐν 理解为方式或根据；“因恩典”简洁表达这些恩赐出于恩典，同时不作过度解释。
theological_decisions:
- issue: 单数分词“爱了……并赐给……”与“我们的主耶稣弥赛亚”和“我们的父上帝”这两个并列成分的关系
  choice: 把说明语后置，并以单数“他”承接，不明确限定其只指其中一位，也不扩写为“两位都”。
  alternative: 把说明语直接放在“我们的父上帝”之前，使其明确只修饰父上帝；或改写为“他们爱了我们”，明确将两位都作为施事者。
  rationale: 希腊文在并列主语之后使用单数的冠词化分词，既容许读者首先联系邻近的“父上帝”，又形成值得保留的句法与基督论张力。后置说明和单数“他”避免在译文中替原文作出更明确的神学裁断。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。经文在本节末尾本来就是未完句，祈愿的谓语延续到下一节，因此保留句末破折号结构，不擅自补足。脚注标记紧随其所说明的“鼓励”。
