id: 2TH.2.1
reference: 2 Thessalonians 2:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ἐρωτῶμεν δὲ ὑμᾶς, ἀδελφοί, ὑπὲρ τῆς παρουσίας τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ καὶ ἡμῶν ἐπισυναγωγῆς ἐπ’ αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/001.yaml
  text: We ask you[a], brothers, concerning the coming of our Lord Jesus the Messiah and our gathering together to him[b],
translation:
  language: zh_hans
  text: 弟兄们[b]，关于我们主耶稣基督[a]的来临，以及我们聚集到他那里这件事，我们请求你们：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “基督”意为“弥赛亚”，即“受膏者”。
    reason: lexical_alternative
  - marker: b
    text: “弟兄们”是保罗使用的称呼；在这里很可能指整个信徒群体，包括男性和女性。
    reason: scope_clarification
lexical_decisions:
- source_word: Ἐρωτῶμεν
  choice: 我们请求你们
  rationale: 这里引出的是郑重而温和的劝请，不是命令。“请求”比“命令”或“敦促”更贴近原词语气，也适合下文尚未说完的句式。
- source_word: δὲ
  choice: 不单独译出
  rationale: δὲ在这里主要标示话题转接；现代汉语可借称呼和句式自然过渡，若机械译作“现在”会误添时间意味。
- source_word: ἀδελφοί
  choice: 弟兄们
  rationale: 保留原文阳性复数称呼；保罗在此很可能面向整个信徒群体，其语境范围以脚注说明。
- source_word: ὑπὲρ
  choice: 关于
  rationale: 此处引出所谈论的事项，不表示受益关系；“关于”自然、准确。
- source_word: παρουσίας
  choice: 来临
  rationale: παρουσία可指临在或到来；在此末世语境中指主未来的到来。“来临”既清楚又保持庄重。
- source_word: κυρίου
  choice: 主
  rationale: 保留κύριος作为权柄与尊荣称号的常规新约用法。
- source_word: Ἰησοῦ Χριστοῦ
  choice: 耶稣基督
  rationale: 采用现代汉语基督教语境中自然且广为人知的固定称谓；脚注说明“基督”的称号含义，避免读者只把它理解为姓氏。
- source_word: ἐπισυναγωγῆς
  choice: 聚集
  rationale: 表达众信徒被聚集到基督那里，不额外赋予制度化“会众”或特定末世次序的含义。
- source_word: ἐπ’ αὐτόν
  choice: 到他那里
  rationale: 表达朝向基督并归聚于他的方向性；比单说“与他相聚”更贴近ἐπί加宾格的结构。
theological_decisions:
- issue: Χριστοῦ作为称号还是姓名成分
  choice: 正文译“基督”，并在脚注说明其意为“弥赛亚（受膏者）”
  alternative: 正文译“弥赛亚”
  rationale: “耶稣基督”在现代汉语中最自然、辨识度最高；脚注恢复称号的实义，避免把Χριστός默认为姓氏。
- issue: ἀδελφοί的指称范围
  choice: 正文译“弟兄们”，脚注说明很可能包括整个信徒群体
  alternative: 弟兄姊妹们
  rationale: 正文保留原文阳性称呼，同时不掩盖保罗通常借此称呼全体会众的语用范围。
- issue: 主的来临与信徒聚集之间的关系
  choice: 以“以及”并列，保持两者紧密相关但不界定其精确关系
  alternative: 译成“在他来临时聚集到他那里”
  rationale: 原文用καί协调两个事项，却没有明确说明二者的时间次序或同一关系；不应在翻译中加入特定末世论方案。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。句末用冒号，因为本节的“请求”内容在下一节继续展开；不把本节误写成完整独立句。
