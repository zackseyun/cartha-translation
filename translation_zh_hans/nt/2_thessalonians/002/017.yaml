  text: παρακαλέσαι ὑμῶν τὰς καρδίας καὶ ⸀στηρίξαι ἐν παντὶ ⸂ἔργῳ καὶ λόγῳ⸃ ἀγαθῷ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/017.yaml
  text: encourage your hearts and strengthen them in every good work and word[a][b].
translation:
  language: zh_hans
  text: 愿他鼓励你们的心，并使你们在一切善言善行上坚定。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “鼓励”也可译作“安慰”或“劝勉”。
    reason: lexical_alternative
  - marker: b
    text: “使……坚定”也可译作“坚固”或“坚立”。
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλέσαι
  choice: 鼓励
  rationale: 本词可表示鼓励、安慰或劝勉；结合16节“永远的安慰/鼓励”的语境，“鼓励”较能保留其宽广含义，不限于情感安慰或道德劝诫。
- source_word: καρδίας
  choice: 心
  rationale: 保留圣经常用的人论意象，指人的内在生命，而不将其缩减为情感或理智。
- source_word: στηρίξαι
  choice: 使……坚定
  rationale: 该词有使稳固、坚立之意；“使……坚定”在现代汉语中自然，也准确表达使信徒在言行上站立得稳。
- source_word: ἐν παντὶ
  choice: 在一切……上
  rationale: 表达坚定所涉及的范围或领域，符合此处ἐν加与格的用法。
- source_word: ἔργῳ καὶ λόγῳ
  choice: 善言善行
  rationale: 原文次序是“行为和言语”，但汉语固定而自然的并列表达是“言行”；与“一切”搭配时，“善言善行”简洁地传达每一种美善的言语和行为。
- source_word: ἀγαθῷ
  choice: 善
  rationale: 该形容词在意义上同时修饰“言”和“行”；“善”准确、简洁，并能自然构成“善言善行”。
theological_decisions:
- issue: 是否将καρδία解释为某一种现代心理范畴
  choice: 心
  alternative: 内心；心思
  rationale: 保留原文的人论意象及其宽广指向，不将其限定为情绪、思想或意志中的单一方面。
- issue: στηρίξαι应译为“坚定”还是“坚立”
  choice: 使……坚定
  alternative: 坚固；坚立
  rationale: “使……坚定”自然地表达上帝使人稳固的行动，又不额外引入特定教义含义。
- issue: ἔργῳ καὶ λόγῳ的排列
  choice: 善言善行
  alternative: 一切善行善言
  rationale: 原文先“行为”后“言语”，但汉语“言行”次序更自然；此调整不改变二者并列及ἀγαθῷ共同修饰二者的意义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“愿他”承接上一节的复合主语；本节虽未重复主语，汉译补出代词以形成完整祈愿句。“善言善行”为自然汉语搭配，虽调换原文名词次序，但保留其并列关系和共同受“善”修饰的结构。
