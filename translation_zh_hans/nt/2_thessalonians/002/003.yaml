    issue: “绝不会来到”略增语气强度。
    rationale: ἐὰν μὴ所表达的是“除非／若不……便不会”的必要前提；原文没有另一个相当于“绝不”的强化词。
  - severity: low
    issue: “他就是灭亡之子”将同位语改为显性的判断句。
    rationale: ὁ υἱὸς τῆς ἀπωλείας直接与“那不法之人”同位。用“就是那灭亡之子”可保留汉语自然度，同时较清楚地反映该结构。
  - severity: low
    issue: 脚注替代译法“离道”不够现代且可能产生不必要歧义。
    rationale: “离弃信仰”更清楚地表达“falling away”这一脚注所提示的宗教性理解，同时正文仍保留宽泛的“反叛”。
  revised_text: 不要让任何人以任何方式欺骗你们；因为那日不会来到，除非那场反叛先发生，并且那不法之人[b]——就是那灭亡之子——显露出来。
