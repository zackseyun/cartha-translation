reference: 2 Thessalonians 2:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: μή τις ὑμᾶς ἐξαπατήσῃ κατὰ μηδένα τρόπον· ὅτι ἐὰν μὴ ἔλθῃ ἡ ἀποστασία πρῶτον καὶ ἀποκαλυφθῇ ὁ ἄνθρωπος τῆς ⸀ἀνομίας, ὁ υἱὸς τῆς ἀπωλείας,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/003.yaml
  text: Let no one deceive you in any way[a], because that day will not come unless the rebellion comes first and the man of lawlessness is revealed[b], the son of destruction.
translation:
  language: zh_hans
  text: 不要让任何人以任何方式欺骗你们；因为那日不会来到，除非那场反叛先发生，并且那不法之人[b]——就是那灭亡之子——显露出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 有些抄本作“罪恶之人”，而不是“不法之人”。
    reason: textual_variant
lexical_decisions:
- source_word: ἐξαπατήσῃ
  choice: 欺骗
  rationale: 该动词表示欺骗或使人受迷惑；“欺骗”符合本节警告的语境，也不刻意强化前缀的语气。
- source_word: κατὰ μηδένα τρόπον
  choice: 用任何方式
  rationale: 这个短语加强禁令，表示无论以什么方式都不可受骗；现代汉语中清楚自然。
- source_word: ὅτι
  choice: 因为
  rationale: 此处引出不可受骗的理由，用“因为”能清楚呈现上下文的逻辑关系。
- source_word: ἐὰν μὴ ἔλθῃ
  choice: 除非……否则那日绝不会来到
  rationale: 原文省略了由上一节可知的主语“那日”。汉语补出这一主语，并用“除非……否则……”自然表达必要的先决条件。
- source_word: ἀποστασία
  choice: 那场反叛
  rationale: 该词可指反叛、背道或离弃。“反叛”保留较宽泛的含义，不预先把它限定为某一种宗教性或末世论解释；定冠词以量词结构“那场”体现。
- source_word: πρῶτον
  choice: 先
  rationale: 准确表达事件发生的先后次序，且符合现代汉语习惯。
- source_word: ἀποκαλυφθῇ
  choice: 显露出来
  rationale: 被动形式表示此人被显明、现身；“显露出来”自然，同时保留启示性语境中的显现意味。
- source_word: ὁ ἄνθρωπος τῆς ἀνομίας
  choice: 那不法之人
  rationale: 直接反映底本ἀνομίας“不法、无法无天”，并以单数的“人”指向特定人物；异文“罪恶之人”收入脚注。
- source_word: ὁ υἱὸς τῆς ἀπωλείας
  choice: 灭亡之子
  rationale: 保留原文带有闪语色彩的“……之子”表达，可表示一个以灭亡为特征或注定灭亡的人；比音译或较古旧的神学术语更透明。
theological_decisions:
- issue: 是否补出“那日”作为省略分句的主语
  choice: 依据上一节明确补出“那日”
  alternative: 保留省略，只译作“因为若不是……先发生”
  rationale: 上一节所说“主的日子”是清楚的语境先行词。汉语补出“那日”可避免句意残缺，并未增加超出直接上下文的解释。
- issue: ἀποστασία的含义
  choice: 正文译为较宽泛的“反叛”
  alternative: “背道”或“离道”
  rationale: 该词既可指反叛，也可指宗教上的背离。正文不把有争议的末世论含义过早限定，脚注则保留常见的宗教性理解。
- issue: τῆς ἀνομίας处的文本异文
  choice: 依SBLGNT译作“不法之人”
  alternative: 部分抄本作“罪恶之人”
  rationale: 所提供的希腊文本采用ἀνομίας，因此正文照译；重要且为人熟知的ἁμαρτίας异文在脚注说明。
- issue: ὁ υἱὸς τῆς ἀπωλείας的表达
  choice: 保留比喻形式“灭亡之子”
  alternative: 解释性地译为“注定灭亡的人”
  rationale: 原文既可表达此人以灭亡为特征，也可暗示其结局。保留原有形式可避免只选定其中一种关系，并保存经文的修辞力度。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“谁也不要……”直截了当地保留警告语气；将条件分句前置，并以“除非……否则……”重组希腊语的省略结构，使汉语读者能顺畅理解。破折号标明“他就是灭亡之子”与前面的“不法之人”同位，同时不削弱原文的郑重语气。
