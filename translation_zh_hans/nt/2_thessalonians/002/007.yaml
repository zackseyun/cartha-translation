  text: τὸ γὰρ μυστήριον ἤδη ἐνεργεῖται τῆς ἀνομίας· μόνον ὁ κατέχων ἄρτι ἕως ἐκ μέσου γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/007.yaml
  text: For the mystery of lawlessness is already at work[b][a]; only the one who now restrains will do so until he is out of the way.
translation:
  language: zh_hans
  text: 因为不法的奥秘已经在运行；只是如今那拦阻者[a]仍在拦阻，直到他不再在其间[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“如今正在拦阻的那一位”；希腊文没有说明这位拦阻者是谁。
    reason: alternative_reading
  - marker: b
    text: 或译“直到他被移除”或“直到他被挪去”。希腊文并未明确说明这是怎样发生的。
    reason: lexical_alternative
lexical_decisions:
- source_word: μυστήριον
  choice: 奥秘
  rationale: 保留保罗书信中隐藏而正在显明或发挥作用之实情的含义，不把它弱化为普通的谜团。
- source_word: ἐνεργεῖται
  choice: 已经在运行
  rationale: 表达这股力量现今已经持续发挥作用；“运行”简洁自然，也与“奥秘”这一抽象主语相配。
- source_word: ἀνομίας
  choice: 不法
  rationale: 直接对应ἀνομία，并保留本段有关违抗上帝秩序的主题联系，避免泛化为一般的邪恶。
- source_word: μόνον
  choice: 只是
  rationale: 自然地引出对前一句的限制性说明。
- source_word: ὁ κατέχων
  choice: 那拦阻者
  rationale: 保留阳性单数实词化分词所指的拦阻者，却不擅自判定其身份；正文另以“还会拦阻”补足希腊文省略的谓语。
- source_word: ἄρτι
  choice: 如今
  rationale: 清楚标明拦阻活动发生在当前阶段。
- source_word: ἕως ἐκ μέσου γένηται
  choice: 直到他不再居中
  rationale: 表达其最终不再处于其中或居间位置的状态，同时避免明确说他是自行离开还是被外力移除。
theological_decisions:
- issue: ὁ κατέχων（拦阻者）的身份
  choice: 笼统译作“那拦阻者”，不说明其身份
  alternative: 罗马政权、人类政府、圣灵、天使或保罗及使徒宣讲
  rationale: 本节希腊文提到一位男性单数的拦阻者，却没有指明他是谁；译文应保留这一末世论上的开放性。
- issue: ἕως ἐκ μέσου γένηται中的行动主体与方式
  choice: 译作“直到他不再居中”，不明说是谁使他离开
  alternative: “直到他被移除”或“直到他被挪去”
  rationale: γένηται与ἐκ μέσου说明不再处于中间或其间的结果，但没有明确指出外在施动者；正文不应替原文补定行动方式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不法的奥秘”保留保罗式神学措辞；“不再居中”略具凝练色彩，用以保存原文在离开方式和施动者方面的含混。所有脚注标记均置于其所解释的对应语句之后。
