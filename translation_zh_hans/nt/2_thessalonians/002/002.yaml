revisions:
- from: 不要轻易动摇，失去清醒的判断，也不要惊慌。无论有人声称是借着灵[a]、口传的信息，还是一封据说出自我们的信，只要说主的日子已经来到[b]，你们都不要受影响。
  to: 不要因有人借着灵[a]、借着口头传来的话，或借着一封仿佛出自我们的信，声称主的日子已经来到[b]，就很快失去镇定，或感到惊慌。
  rationale: 修订恢复原文“不要……，无论／不论借着……而声称……”的逻辑：三种所称来源及其信息内容构成信徒不应失去镇定或惊慌的诱因。“失去镇定”自然表达ἀπὸ τοῦ νοὸς与σαλευθῆναι在此语境中的合成含义；“感到惊慌”对应θροεῖσθαι。保留“灵”和“主的日子”的术语及原有脚注，以维持原文的语义开放性和完成时的持续现实意味。
