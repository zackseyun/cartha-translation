reference: 2 Thessalonians 2:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἰς τὸ μὴ ταχέως σαλευθῆναι ὑμᾶς ἀπὸ τοῦ νοὸς ⸀μηδὲ θροεῖσθαι μήτε διὰ πνεύματος μήτε διὰ λόγου μήτε δι’ ἐπιστολῆς ὡς δι’ ἡμῶν, ὡς ὅτι ἐνέστηκεν ἡ ἡμέρα τοῦ ⸀κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/002.yaml
  text: that you not be quickly shaken from your mind or alarmed[a], either by a spirit or by a message or by a letter as if from us[b], to the effect that the day of the Lord has come.
translation:
  language: zh_hans
  text: 不要因有人借着灵[a]、借着口头传来的话，或借着一封仿佛出自我们的信，声称主的日子已经来到[b]，就很快失去镇定，或感到惊慌。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “借着灵”也可理解为“借着属灵的言语”或“借着先知性的启示”；原文未明确指圣灵。
    reason: lexical_alternative
  - marker: b
    text: 或译：“已经临到，现今就在这里。”原文的完成时可表示有人声称主的日子已经到来，并且当下已经存在。
    reason: alternative_reading
lexical_decisions:
- source_word: ταχέως
  choice: 轻易
  rationale: 此处强调帖撒罗尼迦信徒不要迅速或轻率地受动摇；现代汉语用“轻易”自然地表达这种容易受影响的意味。
- source_word: σαλευθῆναι ὑμᾶς ἀπὸ τοῦ νοὸς
  choice: 动摇，失去清醒的判断
  rationale: σαλεύω保留“动摇”的形象；ἀπὸ τοῦ νοός是较含蓄的习语，可指偏离原有的理性认识或镇定心态。“失去清醒的判断”既可理解，又不把它缩减为单纯情绪上的不安。
- source_word: θροεῖσθαι
  choice: 惊慌
  rationale: 该动词表示受到扰乱、陷入惊恐；“惊慌”准确传达其情绪力度，并与前面的理性动摇形成呼应。
- source_word: πνεύματος
  choice: 灵
  rationale: 无冠词的πνεῦμα在此与口传信息和书信并列，很可能指所声称的属灵启示或先知性传言；正文保留较直译的“灵”，脚注说明其他可行理解。
- source_word: λόγου
  choice: 口传的信息
  rationale: λόγος与书信相对，语境中指口头传播的言论或教导。“口传的信息”比单独译作“话”更清楚。
- source_word: ἐπιστολῆς ὡς δι’ ἡμῶν
  choice: 一封据说出自我们的信
  rationale: 表达该书信被人声称来自保罗及同工，却不预先断言具体的作假方式；符合ὡς δι’ ἡμῶν的表面归属含义。
- source_word: ὡς ὅτι
  choice: 只要说
  rationale: 此结构引出前述媒介所传达的主张；汉语用“只要说……都不要”自然衔接劝诫，同时准确表明信息内容。
- source_word: ἐνέστηκεν
  choice: 已经来到
  rationale: 完成时表达某日已经到来并处于现实之中。“已经来到”清楚传达该主张，脚注保留“已经临到、现已在此”的持续现实时态意味。
- source_word: ἡ ἡμέρα τοῦ κυρίου
  choice: 主的日子
  rationale: 这是圣经中的末世性固定表达，不指每周的敬拜日；译作“主的日子”既准确又能避免与“主日”混淆。
theological_decisions:
- issue: ἐνέστηκεν所表达的末世主张
  choice: 主的日子已经来到
  alternative: 主的日子已经临到，现今就在这里
  rationale: 该完成时包含到来后现已存在的意味。正文采用自然而明确的“已经来到”，脚注保留其可能强调“现已在场”的解释分量。
- issue: πνεύματος在三种信息来源中的含义
  choice: 借着灵
  alternative: 借着属灵的言语或先知性启示；借着圣灵
  rationale: 原文没有冠词，语境很可能指有人宣称信息来自某种灵或属灵启示，但并未明确说明是圣灵。正文保留原文的开放性，脚注列出较解释性的译法。
- issue: ὡς δι’ ἡμῶν是否断定书信为伪造
  choice: 据说出自我们的信
  alternative: 仿佛是我们写的信；借着我们而来的信
  rationale: 原文表明信息被归到保罗一行名下，但本节本身没有详述这种归属是误解、误传还是蓄意伪造，因此不在正文中额外裁定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。由于本节在句法上承接第1节的劝求，中文将目的性不定式自然转换为直接劝诫；末句用“只要……都不要……”整合三个并列信息来源。避免传统用语“主日”，以免误解为每周礼拜日。
