  text: καὶ διὰ τοῦτο ⸀πέμπει αὐτοῖς ὁ θεὸς ἐνέργειαν πλάνης εἰς τὸ πιστεῦσαι αὐτοὺς τῷ ψεύδει,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/011.yaml
  text: And because of this[a], God sends them a working of delusion so that they may believe the lie,
translation:
  language: zh_hans
  text: 因此，上帝使一种迷惑人的力量临到他们，使他们相信那谎言，[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一种迷惑人的力量”也可译作“一种使人受迷惑的作用”“一种欺骗人的活动”，传统译法为“强烈的迷惑”。
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: 因此
  rationale: 承接上文他们不肯爱真理这一原因；“因此”在现代汉语中自然地兼具因果与推论色彩。
- source_word: πέμπει
  choice: 使……临到
  rationale: 表达上帝直接施行的动作，不弱化为仅仅许可；相较机械直译“差遣一种力量”，也更符合汉语搭配。
- source_word: ἐνέργειαν πλάνης
  choice: 一种迷惑人的力量
  rationale: ἐνέργεια指实际运作、产生作用的力量，πλάνη指迷惑、欺骗或使人走入错误；此译保留其主动且有效的作用，同时不把它简化为纯粹的内在错觉。
- source_word: εἰς τὸ πιστεῦσαι
  choice: 使他们相信
  rationale: 该结构可表达目的或结果；汉语“使”保持两者之间一定的开放性，并与前句行动自然衔接。
- source_word: τῷ ψεύδει
  choice: 那谎言
  rationale: 保留单数定冠词所体现的特指性，并与上下文有关那不法者的欺骗相联系；不泛化为“虚假之事”。
theological_decisions:
- issue: 上帝在审判性刚硬中的主动作用
  choice: 上帝使一种迷惑人的力量临到他们
  alternative: 上帝容许迷惑人的力量临到他们
  rationale: 希腊文明确以上帝为πέμπει（差遣、送出）的主语，不应弱化为单纯许可。译文保留上帝主动审判与人先前拒绝真理之间的神学张力。
- issue: εἰς τὸ πιστεῦσαι的目的与结果
  choice: 使他们相信
  alternative: 结果他们相信
  rationale: 原结构可以带有目的或结果意味；正文不以解释性措辞强行排除其中任何一面。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“临到”是普通读者可理解的圣经语体；整体避免生硬照搬希腊文属格结构，同时保留ἐνέργεια与πλάνη所表达的有效作用和迷惑性质。脚注标记置于其所说明的短语之后。
