source:
  edition: SBLGNT
  text: ἄρα οὖν, ἀδελφοί, στήκετε, καὶ κρατεῖτε τὰς παραδόσεις ἃς ἐδιδάχθητε εἴτε διὰ λόγου εἴτε δι’ ἐπιστολῆς ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/015.yaml
  text: So then[a], brothers, stand firm and hold fast to the traditions that you were taught, whether by word or by our letter.
translation:
  language: zh_hans
  text: 所以，弟兄们[a]，你们要站立得稳，坚守所教给你们的传统，无论是我们口头传授的，还是通过我们的书信传授的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“弟兄姊妹们”。希腊文直译为“弟兄们”，但这里很可能是称呼包括姊妹在内的全体会众。
    reason: 说明原文的阳性称呼形式及其很可能具有的包容性所指。
lexical_decisions:
- source_word: ἄρα οὖν
  choice: 所以
  rationale: 两个推论性小品词共同引出基于上文的结论。“所以”在现代汉语中自然、明确，也保留了承接和推论的作用。
- source_word: ἀδελφοί
  choice: 弟兄们
  rationale: 希腊文是阳性复数呼格，直译为“弟兄们”。保罗很可能借此称呼包括姊妹在内的全体会众，因此正文保留原文形式，并用脚注说明其所指范围。
- source_word: στήκετε
  choice: 站立得稳
  rationale: 该现在时命令语气要求持续坚定不移。“站立得稳”既保留站立的比喻，也自然表达坚忍和稳固。
- source_word: κρατεῖτε
  choice: 坚守
  rationale: 此词表示牢牢持守、不放弃。“坚守”简洁有力，适合与“站立得稳”并列。
- source_word: τὰς παραδόσεις
  choice: 传统
  rationale: παράδοσις指传递、交付下来的内容。“传统”保留了“传承下来”的词义，并与本节口头和书面两种传授方式相符；译作“教导”会削弱这一传承意味。
- source_word: ἃς ἐδιδάχθητε
  choice: 所教给你们的
  rationale: 原文为被动表达，说明帖撒罗尼迦信徒是受教者。汉语用“所教给你们的”更自然，同时准确保留他们接受教导的含义。
- source_word: εἴτε διὰ λόγου
  choice: 无论是我们口头传授的
  rationale: λόγος在这里与书信相对，指口头传达。“口头传授”清楚呈现这种对比；补出“我们”承接后半句的ἡμῶν，并符合两种方式都源自使徒群体的语境。
- source_word: εἴτε δι’ ἐπιστολῆς ἡμῶν
  choice: 还是通过我们的书信传授的
  rationale: 该短语指借着属于保罗及其同工的书信进行传授。此译保留介词的媒介意义和ἡμῶν的所属关系，也与前面的口头传授形成自然对称。
theological_decisions:
- issue: παράδοσις在有关使徒传统的神学讨论中的译法
  choice: 传统
  alternative: 教导；训示
  rationale: 原文明确指传递下来的内容，并同时包括口头和书面的使徒传授。“传统”最能保留词汇本义，却不把后世任何宗派对传统范围或权威的主张带入经文。
- issue: 混合会众中ἀδελφοί的称呼范围
  choice: 正文译“弟兄们”，脚注说明可能包括姊妹
  alternative: 弟兄姊妹们
  rationale: 正文保留希腊文阳性复数的形式，同时通过脚注交代保罗很可能是在称呼全体会众，从而兼顾原文形式与实际所指。
- issue: 口头与书面传授的关系
  choice: 并列保留“口头传授”和“通过我们的书信传授”
  alternative: 概括为“我们的教导”
  rationale: 原文明示两种传授媒介，译文不将其合并，也不进一步断定二者在本节以外的范围、延续方式或制度性地位。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“站立得稳、坚守”保留原文两个连续命令的力度；“传统”保留传承含义，不使用可能预先化解神学张力的释义性译法。
