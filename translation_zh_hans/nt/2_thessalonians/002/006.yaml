  text: καὶ νῦν τὸ κατέχον οἴδατε, εἰς τὸ ἀποκαλυφθῆναι αὐτὸν ἐν τῷ ⸀ἑαυτοῦ καιρῷ·
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/006.yaml
  text: And now you know what is restraining him[b][a], so that he may be revealed in his own time.
translation:
  language: zh_hans
  text: 现在，你们知道是什么在拦阻他[a]，好让他在他自己的时候[b]显露出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“是什么在阻挡他”。原文采用中性表达，在这里没有说明这股拦阻力量是什么。
    reason: lexical_alternative
  - marker: b
    text: 或译“在为他定下的时刻”。原文也可含合宜或指定时机的意思。
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ κατέχον
  choice: 是什么在拦阻他
  rationale: 带冠词的中性分词表示起拦阻作用的事物或力量，并未说明其身份。译为“是什么在拦阻他”，既符合现代汉语，也不把它擅自解释为某个人、政权、圣灵或其他特定力量。
- source_word: οἴδατε
  choice: 你们也知道
  rationale: 该完成时形式在此具有现在意义；“知道”直接表达保罗提醒读者，他们已经从先前的教导中知晓此事。
- source_word: εἰς τὸ ἀποκαλυφθῆναι αὐτόν
  choice: 好让他……显露出来
  rationale: 介词加带冠词不定式在此表达目的或结果。“好让”自然传达这种关系；被动式“显露出来”保留原文没有明说使其显露者的特点。
- source_word: ἐν τῷ ἑαυτοῦ καιρῷ
  choice: 在自己的时候
  rationale: καιρός可指合宜或指定的时机，ἑαυτοῦ强调属于他的时间。“在自己的时候”较贴近原文字面，并避免在正文中把“指定”的含义说得过满。
- source_word: νῦν
  choice: 现在
  rationale: 直接保留时间副词，并自然承接上下文。
- source_word: αὐτόν
  choice: 他
  rationale: 阳性代词回指上文将要显露的男性人物；只译作“他”，不额外确定其身份。
theological_decisions:
- issue: 拦阻者或拦阻力量的身份
  choice: 用“是什么在拦阻他”，不指明拦阻者的身份
  alternative: 将其解释为罗马政权、圣灵、天使性力量或上帝的旨意与护理
  rationale: 原文τὸ κατέχον为中性表达，本节没有说明其具体所指。中性译法保留历来存在的解释空间，不把某一神学立场写入正文。
- issue: 末世语境中καιρός的含义
  choice: 译为“自己的时候”
  alternative: 译为“为他指定的时候”或“合宜的时候”
  rationale: καιρός确可含有指定或合宜时机的意味，但原文没有明说是谁指定。正文采用较少解释性的表达，脚注提供可能的语义。
- issue: εἰς τό加不定式的目的与结果色彩
  choice: 译为“好让他……显露出来”
  alternative: 译为“结果他……显露出来”或“为使他……显露出来”
  rationale: 该结构在此可含目的并趋向结果。“好让”在现代汉语中通顺，同时没有明确断定拦阻力量本身具有自主目的。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“拦阻”保留经文语体的凝练感，又不显陈旧；“显露出来”准确反映被动语态。正文脚注标记按相关词语分别置于“拦阻他”和“自己的时候”之后。
