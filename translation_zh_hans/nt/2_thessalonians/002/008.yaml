revisions:
- from: 那时，那不法者将显露出来；主耶稣要用他口中的气息除灭他，并以自己来临时的显现使他归于无有。[a][b]
  to: 那时，那不法者将显露出来；主耶稣要用他口中的气息[a]杀灭他，并借着他来临的显现[b]使他归于无有。
  rationale: 修订仅校正“显现”与“来临”的原文句法关系，并使脚注锚点对应明确；同时以“杀灭”更准确呈现ἀναιρέω的语义力度。未改变末世敌对者的身份理解，也未对πνεῦμα或παρουσία的可争议词义作超出原文的神学限定。
