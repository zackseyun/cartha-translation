  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ τότε ἀποκαλυφθήσεται ὁ ἄνομος, ὃν ὁ κύριος ⸀Ἰησοῦς ⸀ἀνελεῖ τῷ πνεύματι τοῦ στόματος αὐτοῦ καὶ καταργήσει τῇ ἐπιφανείᾳ τῆς παρουσίας αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/008.yaml
  text: And then the lawless one will be revealed[a], whom the Lord Jesus will slay with the breath of his mouth and bring to nothing by the appearance of his coming[b],
translation:
  language: zh_hans
  text: 那时，那不法者将显露出来；主耶稣要用他口中的气息[a]杀灭他，并借着他来临的显现[b]使他归于无有。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “气息”或译“灵”。希腊词πνεῦμα可指“气息”，也可指“灵”；在这里的表达中，“气息”较为自然。
    reason: lexical_alternative
  - marker: b
    text: “他来临的显现”或译“他临在的彰显”。παρουσία在这里通常理解为“来临”，但也可表示“临在”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκαλυφθήσεται
  choice: 将显露出来
  rationale: 保留将来时被动含义，表达那不法者将被显明，同时不擅自指明施动者。
- source_word: ὁ ἄνομος
  choice: 那不法者
  rationale: 按带冠词的名词化形容词翻译，不从上下文添入本节原文没有的“人”。
- source_word: ἀνελεῖ
  choice: 除灭
  rationale: 此处表示杀死、除掉；“除灭”兼具审判语境所需的力度和庄重语体。
- source_word: τῷ πνεύματι τοῦ στόματος αὐτοῦ
  choice: 用他口中的气息
  rationale: πνεῦμα可指气息或灵；在“口中的……”这一表达及《以赛亚书》11:4的背景下，“气息”较为自然，同时以脚注保留另一可能。
- source_word: καταργήσει
  choice: 使他归于无有
  rationale: 表达使之失效、终止、归于无有的决定性结果，避免只译作一般性的“毁坏”。
- source_word: τῇ ἐπιφανείᾳ τῆς παρουσίας αὐτοῦ
  choice: 以自己来临时的显现
  rationale: ἐπιφάνεια译为可见的“显现”，παρουσία在末世语境中译为“来临”；该结构自然表达其来临本身的显现。
theological_decisions:
- issue: 末世敌对者的称谓
  choice: 那不法者
  alternative: 那不法的人
  rationale: 本节使用名词化形容词ὁ ἄνομος，并非上下文中更完整的称谓；因此不增添原文未明说的“人”。
- issue: 主耶稣施行审判的方式
  choice: 用他口中的气息
  alternative: 用他口中的灵
  rationale: “气息”最符合此处习语及先知性审判意象，但πνεῦμα的“灵”义仍属真实的词义可能，故在脚注中保留。
- issue: παρουσία的末世含义
  choice: 来临
  alternative: 临在
  rationale: 在本段末世语境中，“来临”最自然；“临在”属于该词的词义范围，故以脚注说明而不在正文中消除这一可能。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“那时”承接上下文；分号清楚呈现显露与审判两个层次。脚注标记均置于正文相关分句之后。
