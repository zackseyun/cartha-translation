  text: εἰς ⸀ὃ ἐκάλεσεν ὑμᾶς διὰ τοῦ εὐαγγελίου ἡμῶν, εἰς περιποίησιν δόξης τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/014.yaml
  text: to which he called you through our gospel[b][a], for obtaining the glory of our Lord Jesus the Messiah.
translation:
  language: zh_hans
  text: 上帝借着我们所传的福音呼召了你们，为要使你们获得我们主耶稣基督的荣耀。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “获得……的荣耀”也可译作“拥有……的荣耀”或“得享……的荣耀”。“基督”意为“受膏者”，也可译作“弥赛亚”。
    reason: 说明περιποίησις在此可指获得、拥有或享有，并交代Χριστός作为称号的含义与可选译法。
lexical_decisions:
- source_word: εἰς ὃ
  choice: 为此
  rationale: 介词短语回指上文所说的得救、成圣和信从真理，并表达呼召所指向的目标；“为此”在现代汉语中自然，也不把所指范围限定得过窄。
- source_word: ἐκάλεσεν
  choice: 呼召了
  rationale: 保留保罗书信中关于上帝救恩之召的常用表达，既不擅自加上“有效地”，也不弱化为一般性的“邀请”。
- source_word: διὰ τοῦ εὐαγγελίου ἡμῶν
  choice: 借着我们所传的福音
  rationale: διά加属格表示途径或媒介。“我们所传的”自然说明“我们的福音”是使徒所宣讲的福音，而不是属于他们的另一种福音。
- source_word: εἰς περιποίησιν δόξης
  choice: 使你们得享……的荣耀
  rationale: περιποίησις可表示取得、获得或拥有；“得享”兼顾获得并有分于荣耀的语义，在汉语中比“取得荣耀”更自然，同时不将其限定为单纯占有。
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: 我们主耶稣基督
  rationale: 采用现代中文圣经语域中清楚、庄重且通行的称谓；“基督”本身保留Χριστός作为受膏者称号的传统表达。
theological_decisions:
- issue: 上帝呼召的性质
  choice: 仅译作“呼召了”，不加神学限定
  alternative: “有效地呼召了”或“邀请了”
  rationale: 原文陈述上帝借福音呼召信徒，却未在本节说明该呼召在不同神学体系中的具体运作方式；译文保留这一张力。
- issue: περιποίησιν δόξης所表达的目标
  choice: 译作“得享……的荣耀”
  alternative: “获得……的荣耀”或“拥有……的荣耀”
  rationale: 该词可涵盖取得与拥有；“得享”表达信徒将有分于主的荣耀，但不把这种关系解释为与主同等或荣耀来源属于信徒自身。
- issue: Χριστοῦ的译法
  choice: 基督
  alternative: 弥赛亚
  rationale: 现代标准汉语中“耶稣基督”是自然且庄重的称谓，而“基督”仍是“受膏者”的传统音意用语；脚注说明其称号含义，避免被误解为普通姓氏。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“我们所传的福音”避免“我们的福音”可能引起的归属歧义；“得享荣耀”符合中文表达，同时保留原文关于获得、拥有或有分于荣耀的语义空间。
