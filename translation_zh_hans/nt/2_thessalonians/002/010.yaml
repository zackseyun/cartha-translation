  text: καὶ ἐν πάσῃ ἀπάτῃ ⸀ἀδικίας τοῖς ἀπολλυμένοις, ἀνθ’ ὧν τὴν ἀγάπην τῆς ἀληθείας οὐκ ἐδέξαντο εἰς τὸ σωθῆναι αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/010.yaml
  text: and with every deception of unrighteousness for those who are perishing[d][c][b][a], because they did not accept the love of the truth so as to be saved.
translation:
  language: zh_hans
  text: 又对那些正在灭亡的人[b]施展种种不义的欺骗[a]，因为他们没有接受[c]对真理的爱，为要得救[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“种种邪恶的骗术”。
    reason: lexical_alternative
  - marker: b
    text: “对那些正在灭亡的人”也可译作“在那些正在灭亡的人中间”。
    reason: lexical_alternative
  - marker: c
    text: “接受”也可译作“领受”或“欢迎”。
    reason: lexical_alternative
  - marker: d
    text: 或译：“使他们可以得救”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπάτῃ ἀδικίας
  choice: 不义的欺骗
  rationale: 保留名词结构和道德含义；ἀδικίας说明这种欺骗具有不义的性质。“欺骗”既可指欺骗行为，也可指骗人的手段，符合上下文。
- source_word: τοῖς ἀπολλυμένοις
  choice: 对那些正在灭亡的人
  rationale: 以“对”表达与格所指向的对象，同时用“正在灭亡”保留现在分词所呈现的持续状态，不把他们定性为命定灭亡的人。
- source_word: ἀνθ’ ὧν
  choice: 因为
  rationale: 这里自然引出他们受欺骗并走向灭亡的原因；“因为”在现代汉语中清楚表达其因果作用。
- source_word: τὴν ἀγάπην τῆς ἀληθείας
  choice: 对真理的爱
  rationale: 汉语需要明确所属关系；上下文最自然地指人对真理的爱，同时仍保留“爱”这一名词，而不简化为仅仅认同真理。
- source_word: ἐδέξαντο
  choice: 接受
  rationale: δέχομαι可表示接受、领受或欢迎；“接受”与抽象宾语“对真理的爱”搭配自然，也传达他们拒绝接受的责任。
- source_word: εἰς τὸ σωθῆναι αὐτούς
  choice: 以致得救
  rationale: 表达εἰς加冠词不定式所含的目的或结果意味，并保留σωθῆναι的被动语态。
theological_decisions:
- issue: “正在灭亡的人”是持续状态还是已经被注定的固定类别
  choice: 正在灭亡的人
  alternative: 注定灭亡的人；被毁灭的人
  rationale: ἀπολλυμένοις是现在时中间/被动分词，首先呈现持续中的状态；译文不加入预定论或其他救恩论体系所带来的额外判断。
- issue: “真理的爱”所表达的关系
  choice: 对真理的爱
  alternative: 真理所发出的爱；真理之爱
  rationale: 属格形式本身有一定压缩性，但上下文强烈支持“爱真理”的客观属格理解。现代汉语用“对真理的爱”可清楚传达这一点，而不把“爱”削弱为单纯的知识认同。
- issue: εἰς τὸ σωθῆναι αὐτούς表示目的还是结果
  choice: 以致得救
  alternative: 为要使他们得救
  rationale: “以致”可容纳目的与结果之间的语义张力，避免过度限定因果关系，同时明确救恩是他们本可达到的结局。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“施展”补足汉语句法中承接上文所需的动作表达，并与“欺骗”自然搭配；全句保留原文作为上文延续的“又”。脚注标明与格关系、δέχομαι以及目的—结果结构的合理译法。
