  source_fidelity: 译文准确传达了ἐν πάσῃ ἀπάτῃ ἀδικίας、与格所指对象、现在分词“正在灭亡”、以及“对真理的爱”。不过，“以致得救”在现代汉语中主要表达实际结果；置于“没有接受”之后，容易造成逻辑上似乎是“没有接受……结果得救”的误读。εἰς τὸ σωθῆναι αὐτούς在此应明确保留其目的取向，且αὐτούς指“他们”。
  naturalness: “又对……施展种种不义的欺骗”虽需借助上文的来临／作为来理解，但作为承接句仍庄重清楚。“因为他们没有接受对真理的爱，为要得救”在逻辑和句法上比原来的“以致得救”更清晰、自然。
  terminology: “不义”“真理”“爱”“得救”均恰当并保持保罗书信的庄重语域。“对真理的爱”自然表达此处最可能的客观属格，未将其简化为仅仅认同真理。
