revisions:
- from: 又对那些正在灭亡的人[b]施展种种不义的欺骗[a]，因为他们没有接受[c]对真理的爱，以致得救[d]。
  to: 又对那些正在灭亡的人[b]施展种种不义的欺骗[a]，因为他们没有接受[c]对真理的爱，为要得救[d]。
  rationale: 仅将末尾的“以致得救”改为“为要得救”。此修改消除汉语中否定行为与结果连接所造成的逻辑歧义，较准确地表达εἰς τὸ σωθῆναι αὐτούς的目的性，并维持救恩被动语态所指的“得救”，不引入额外教义判断。其余译文和脚注均可保留。
