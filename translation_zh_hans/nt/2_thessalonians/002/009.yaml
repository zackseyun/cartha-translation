  text: οὗ ἐστιν ἡ παρουσία κατ’ ἐνέργειαν τοῦ Σατανᾶ ἐν πάσῃ δυνάμει καὶ σημείοις καὶ τέρασιν ψεύδους
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/009.yaml
  text: whose coming is according to the working of Satan[b][a], with all power and signs and wonders of falsehood.
translation:
  language: zh_hans
  text: 这人的来临[a]，是按着撒但的运作，带着各样的能力、虚谎的神迹和奇事[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “来临”也可译作“到来”或“临在”。
    reason: lexical_alternative
  - marker: b
    text: “虚谎的”可理解为修饰“神迹和奇事”，指这些现象与虚谎或欺骗有关；这不一定表示它们全属伪造。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗ
  choice: 这人的
  rationale: 该属格关系代词回指上一节的“不法者”。译作“这人的”既承接上文，也自然引出其“来临”。
- source_word: παρουσία
  choice: 来临
  rationale: 在此末世语境中指某一人物的到来或显现；“来临”兼具庄重感与现代可读性，同时不把词义缩窄为静态的“同在”。
- source_word: κατ’ ἐνέργειαν
  choice: 照着……的运行
  rationale: κατά表达方式或相应关系，ἐνέργεια强调正在发挥作用的活动或运作；“照着……的运行”保留了原文的施动意味。
- source_word: τοῦ Σατανᾶ
  choice: 撒但的
  rationale: 采用新约专名的通行音译；属格表明这种运行属于或出于撒但。
- source_word: ἐν πάσῃ δυνάμει
  choice: 伴随着各样的能力
  rationale: ἐν在这里可表达伴随情形或所用方式；πάσῃ具有全面或各样之意。“能力”避免预先把δύναμις限定为“神迹”。
- source_word: σημείοις
  choice: 神迹
  rationale: 此词指具有指示意义、可被视为凭证的非凡现象；“神迹”是现代中文圣经语境中清楚而通行的对应词。
- source_word: τέρασιν
  choice: 奇事
  rationale: 表达使人惊异的非凡现象，并与“神迹”构成原文惯用的并列组合。
- source_word: ψεύδους
  choice: 虚谎的
  rationale: 属格表示这些现象带有虚谎、欺骗的性质或关联；此译法不武断断定它们只是伪造的把戏，也不断定其超自然性质。
theological_decisions:
- issue: 撒但性现象的性质
  choice: 保留“能力、神迹和虚谎的奇事”的表述，说明这些现象与虚谎相关，却不判定它们全是骗局或全是真实的超自然作为。
  alternative: 译成“假神迹”或“撒但所行的真实奇迹”，明确判定这些现象的本体性质。
  rationale: 希腊文说明不法者的来临照着撒但的运行，并伴有能力、神迹和与虚谎相关的奇事，却没有完整解释这些现象究竟如何发生。译文因此保留原文的神学张力。
- issue: παρουσία所指的动态与状态
  choice: 正文译作“来临”，注释保留“到来”或“临在”的可能。
  alternative: 正文直接译作“临在”，强调持续在场。
  rationale: 上下文较支持人物的到来或显现，但该词本身也可包含到达后临在的意涵，不宜完全抹去这一词义范围。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“这人的”明确承接上一节的“不法者”；“照着……的运行”略带经文语体，以保留原文κατ’ ἐνέργειαν的方式与运作关系。并列项保留“能力、神迹和奇事”的递进结构。
