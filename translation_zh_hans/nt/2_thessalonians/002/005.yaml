  text: οὐ μνημονεύετε ὅτι ἔτι ὢν πρὸς ὑμᾶς ταῦτα ἔλεγον ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/005.yaml
  text: Do you not remember that while I was still with you, I was telling you these things?
translation:
  language: zh_hans
  text: 你们不记得吗？我还和你们在一起的时候，常把这些事告诉你们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μνημονεύετε
  choice: 记得
  rationale: 该动词在反问中询问读者是否仍记得先前所受的教导；“记得”是现代汉语最自然、准确的表达。
- source_word: ἔτι ὢν πρὸς ὑμᾶς
  choice: 我还和你们在一起的时候
  rationale: ἔτι 表示当时仍持续的处境，ὢν πρὸς ὑμᾶς 表示亲身与他们同在；此译法自然呈现时间关系和“还”的延续意味。
- source_word: ταῦτα
  choice: 这些事
  rationale: 保留复数指示意义，回指上下文中保罗所讲的相关事项，同时符合现代汉语习惯。
- source_word: ἔλεγον
  choice: 常把……告诉
  rationale: 未完成时可表示过去持续或反复进行的讲述；“常……告诉”在汉语中清楚表达反复教导的意味，而不把它缩减为一次性的陈述。
- source_word: οὐ ... ὅτι
  choice: 你们不记得吗？……
  rationale: 以反问保留原文语气；汉语分作两句并用后句说明所记内容，比生硬套用“记得……吗”更自然。
