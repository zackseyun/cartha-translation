id: 2TH.2.4
reference: 2 Thessalonians 2:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ ἀντικείμενος καὶ ὑπεραιρόμενος ἐπὶ πάντα λεγόμενον θεὸν ἢ σέβασμα, ὥστε αὐτὸν εἰς τὸν ναὸν τοῦ ⸀θεοῦ καθίσαι ἀποδεικνύντα ἑαυτὸν ὅτι ἔστιν θεός.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/004.yaml
  text: the one who opposes and exalts himself over every so-called god or object of worship[a], so that he takes his seat in the temple of God[b], displaying himself as being God.
translation:
  language: zh_hans
  text: 那敌对并高抬自己、凌驾于一切称为神的或受敬拜的对象之上的人，以致坐在神的殿[a]里，表明自己是神[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “殿”也可译作“圣所”。
    reason: lexical_alternative
  - marker: b
    text: “是神”也可译作“是一位神”。
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἀντικείμενος
  choice: 他抵挡
  rationale: 定冠词加现在分词把动作主体化，表达这人持续与神及受敬拜者敌对；用“抵挡”保留动作含义，不擅自译成经文未明说的专名。
- source_word: ὑπεραιρόμενος
  choice: 高抬自己，超过
  rationale: 该分词含自我抬高之意；“高抬自己”保留反身色彩，“超过”自然承接ἐπί加宾格所表达的凌驾关系。
- source_word: ἐπὶ πάντα λεγόμενον θεὸν
  choice: 超过一切称为神的
  rationale: λεγόμενον仅说明这些对象被人称为神，并不肯定其真实性；“称为神的”比“一切神明”更贴近原文，也避免额外贬义。
- source_word: ἢ σέβασμα
  choice: 和受敬拜的对象
  rationale: σέβασμα泛指宗教敬奉的对象，不限于有位格的神祇。原文ἤ通常为“或”，但此处与否定性、穷尽性的“一切”结合，汉语用“和”更自然地涵盖两类对象，而不改变范围。
- source_word: ὥστε
  choice: 以致
  rationale: 引出前述自高所达到的结果；“以致”清楚表达结果关系，同时不把它过度解释为主观目的。
- source_word: εἰς τὸν ναὸν τοῦ θεοῦ καθίσαι
  choice: 坐在神的殿里
  rationale: εἰς与“坐”连用可表达进入并就座的结果。ναός可特指圣所，但“神的殿”自然、庄重，也不预先裁定这里是实体建筑还是象征性圣殿。
- source_word: ἀποδεικνύντα ἑαυτὸν
  choice: 显明自己
  rationale: ἀποδείκνυμι在此表示把自己公开展示为某种身份；“显明自己”保留公开自我呈现的意味，又不加上原文未必具有的正式宣告含义。
- source_word: ὅτι ἔστιν θεός
  choice: 是神
  rationale: 句末无冠词的θεός在本语境中可具有定指或性质性的力量。结合他坐在“神的殿”里这一高潮性举动，正文译为“神”最能传达其僭越主张；“一位神”仍属语法可能，收入脚注。
theological_decisions:
- issue: 句末θεός应译作“神”还是“一位神”
  choice: 神
  alternative: 一位神
  rationale: 上下文描写此人凌驾一切称为神或受敬拜的对象，并坐在神的殿里，因此“是神”较能体现其最高程度的亵渎性自我宣称；这只是呈现他的主张，并非肯定其真实神性。由于θεός没有冠词，“一位神”在语法上仍可能，故以脚注保留。
- issue: ναός应译作“殿”还是更具体的“圣所”
  choice: 神的殿
  alternative: 神的圣所
  rationale: ναός可指圣殿主体或较具体的圣所。“神的殿”在现代汉语中更自然，也不会替读者预先决定保罗所指是实体圣殿、内殿，还是象征性的神圣领域；“圣所”列入脚注作为较具体的词义选择。
- issue: ἤ在穷尽性表达中的汉语连接方式
  choice: 和
  alternative: 或
  rationale: 希腊文逐字为“或”，但在“一切……ἤ……”这一穷尽性范围中，两类对象都被包括。汉语译为“和”更清楚地表达其全面凌驾的对象范围；若译“或”也可保留原文表层形式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“高抬自己”“神的殿”保留经文的宗教语域；不把此人加上原文未出现的专名，也不裁定“神的殿”所指为何。脚注按中文正文出现顺序重新排列，以避免标记与内容错位。
