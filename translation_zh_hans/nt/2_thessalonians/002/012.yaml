  text: ἵνα κριθῶσιν ⸀πάντες οἱ μὴ πιστεύσαντες τῇ ἀληθείᾳ ἀλλὰ εὐδοκήσαντες ⸀τῇ ἀδικίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/012.yaml
  text: so that all may be judged who did not believe the truth but took pleasure in unrighteousness[a].
translation:
  language: zh_hans
  text: 使所有不信真理、反而喜爱不义的人都受审判[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“被定罪”。希腊语动词的字面意思较广，是“受审判”，但在这里的上下文中可含有受到不利判决的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: 使
  rationale: 引出与上文相连的目的或结果；“使”在现代汉语中简洁自然，也不刻意限定究竟是目的还是结果。
- source_word: κριθῶσιν
  choice: 受审判
  rationale: κρίνω 的被动形式基本义是“被审判”。上下文虽暗示不利的判决，但正文不直接强化为“被定罪”，以保留原文措辞的范围。
- source_word: πάντες
  choice: 所有……的人
  rationale: 与后面的两个带冠词分词结构共同表达一个完整群体；此句式符合现代汉语习惯。
- source_word: οἱ μὴ πιστεύσαντες τῇ ἀληθείᾳ
  choice: 不信真理的人
  rationale: πιστεύω 后接与格，在这里自然译作“信真理”；定冠词所指很可能是上文所说的特定真理，而不只是抽象的真实性。
- source_word: ἀλλὰ
  choice: 反而
  rationale: 突出拒绝真理与喜爱不义之间的强烈对照，比单用“却”更清楚地呈现取舍关系。
- source_word: εὐδοκήσαντες
  choice: 喜爱
  rationale: εὐδοκέω 在此包含乐意、以之为乐的意味；“喜爱”自然凝练，并保留意志和情感上的认同，不弱化为纯粹理智上的“赞同”。
- source_word: τῇ ἀδικίᾳ
  choice: 不义
  rationale: ἀδικία 可指不义、恶行或不公；“不义”保留保罗书信中的道德—神学语域，同时在现代中文圣经文体中清楚可懂。
theological_decisions:
- issue: κριθῶσιν 应译为“受审判”还是更具解释性的“被定罪”
  choice: 受审判
  alternative: 被定罪
  rationale: 上下文显然带有负面结局，但 κρίνω 本身更广泛地表示审判。正文采用“受审判”，避免把上下文暗示的定罪结果直接写进动词本身，并以脚注说明另一种可取译法。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“不义”保留原文的道德与神学分量；整体语序按汉语习惯调整，同时保留“拒绝真理—喜爱不义”的鲜明对照。
