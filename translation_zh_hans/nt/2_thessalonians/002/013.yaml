reference: 2 Thessalonians 2:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ἡμεῖς δὲ ὀφείλομεν εὐχαριστεῖν τῷ θεῷ πάντοτε περὶ ὑμῶν, ἀδελφοὶ ἠγαπημένοι ὑπὸ κυρίου, ὅτι εἵλατο ὑμᾶς ὁ θεὸς ⸀ἀπαρχὴν εἰς σωτηρίαν ἐν ἁγιασμῷ πνεύματος καὶ πίστει ἀληθείας,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/013.yaml
  text: But we ought always to give thanks to God for you[a], brothers beloved by the Lord, because God chose you as firstfruits for salvation through sanctification by the Spirit and faith in the truth[b],
translation:
  language: zh_hans
  text: 但我们应当常常为你们感谢上帝，蒙主所爱的弟兄们[a]，因为上帝拣选了你们作初熟的果子，使你们借着圣灵使人成圣，并借着对真理的信心而得救[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄们”译自阳性复数ἀδελφοί；这里的称呼可以包括整个信徒群体。
    reason: cultural_note
  - marker: b
    text: 有些抄本作：“因为上帝从起初拣选了你们，使你们得救。”正文依照“作初熟的果子”（ἀπαρχήν）这一读法；异文是“从起初”（ἀπ’ ἀρχῆς）。
    reason: textual_variant
lexical_decisions:
- source_word: Ἡμεῖς δὲ
  choice: 但我们
  rationale: δέ承接上文并形成对比；明说的ἡμεῖς带有强调意味。“但我们”在现代汉语中简洁地保留这两点。
- source_word: ὀφείλομεν
  choice: 应当
  rationale: 表达合宜的道德责任，不将语气强化为外在强制。
- source_word: εὐχαριστεῖν τῷ θεῷ πάντοτε περὶ ὑμῶν
  choice: 常常为你们感谢上帝
  rationale: 符合保罗书信中的感恩表达，也自然呈现πάντοτε、与格对象及περί短语。
- source_word: ἀδελφοὶ ἠγαπημένοι ὑπὸ κυρίου
  choice: 蒙主所爱的弟兄们
  rationale: “蒙……所爱”保留被动含义和温暖语气；“主”对应κύριος。“弟兄们”直接反映阳性复数形式，其群体指称范围另以脚注说明。
- source_word: εἵλατο
  choice: 拣选了
  rationale: 准确表达αἱρέομαι中间语态在此处“选择、拣选”的意思，同时不额外引入某一宗派的预定论体系。
- source_word: ἀπαρχὴν
  choice: 作初熟的果子
  rationale: 依SBLGNT正文ἀπαρχήν翻译，保留献上首批收成这一意象；异文ἀπ’ ἀρχῆς另见脚注。
- source_word: εἰς σωτηρίαν
  choice: 使你们……得救
  rationale: 以自然汉语表达εἰς所指向的目的或结果。
- source_word: ἐν ἁγιασμῷ πνεύματος
  choice: 借着圣灵的圣化
  rationale: 将ἐν理解为途径或媒介；“圣化”保留ἁγιασμός的过程性名词表达，πνεῦμα按此救恩语境理解为圣灵。
- source_word: πίστει ἀληθείας
  choice: 对真理的信
  rationale: 将ἀληθείας理解为πίστις的对象，即相信真理；避免含混成“真实的信”或“真理的信实”。
theological_decisions:
- issue: ἐν ἁγιασμῷ πνεύματος中πνεύματος的所指
  choice: 圣灵
  alternative: 人的灵
  rationale: 在保罗论及救恩与成圣的语境中，由圣灵施行圣化最为自然；不过希腊文本本身没有大小写之分，此译法属于语境判断。
- issue: εἵλατο ὑμᾶς ὁ θεὸς所表达的拣选
  choice: 上帝拣选了你们
  alternative: 上帝选定了你们／将你们取来归自己
  rationale: 保留经文本身清楚表达的上帝主动拣选，但不进一步规定其时间、机制或系统神学含义。
- issue: ἀπαρχήν与ἀπ’ ἀρχῆς的文本异文
  choice: 作初熟的果子
  alternative: 从起初
  rationale: 正文遵循所给SBLGNT的ἀπαρχήν，同时在脚注保存重要异文及其不同意义。
translation_notes:
  register: 采用现代、庄重且便于普通读者理解的书面汉语。“蒙主所爱的”保留牧养语气；“作初熟的果子”保留原文的农业与献祭意象；“圣化”虽略具神学色彩，但比单用“圣洁”更能表达ἁγιασμός在此处的作用或过程。
