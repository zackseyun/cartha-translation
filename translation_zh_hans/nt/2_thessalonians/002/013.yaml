revisions:
- from: 但我们应当常常为你们感谢上帝，蒙主所爱的弟兄们[a]，因为上帝拣选了你们作初熟的果子[b]，使你们借着圣灵的圣化和对真理的信而得救。
  to: 但我们应当常常为你们感谢上帝，蒙主所爱的弟兄们[a]，因为上帝拣选了你们作初熟的果子，使你们借着圣灵使人成圣，并借着对真理的信心而得救[b]。
  rationale: 仅作汉语措辞与句法的安全调整。修订保留原文的因果关系、拣选的表述、ἀπαρχήν的“初熟果子”意象、救恩目标，以及圣灵成圣和信真理这两个并列要素；未增加任何特定宗派对拣选或成圣的神学解释。脚注标记与内容均予保留，并继续准确呈现文本异文。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T03:56:13Z'
