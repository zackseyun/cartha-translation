  text: Εἰ δέ τις οὐχ ὑπακούει τῷ λόγῳ ἡμῶν διὰ τῆς ἐπιστολῆς, τοῦτον σημειοῦσθε, ⸀μὴ ⸀συναναμίγνυσθαι αὐτῷ, ἵνα ἐντραπῇ·
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/014.yaml
  text: And if anyone does not obey our word through this letter[a], take note of that person; do not associate with him[d][c][b], so that he may be ashamed.
translation:
  language: zh_hans
  text: 若有人不听从我们借这封信所传的话[a]，你们要留意这个人[b]，不要与他来往[c][d]，好使他感到羞愧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我们在这封信中所说的话”。希腊语短语也可侧重这封信是传达教导的途径。
    reason: lexical_alternative
  - marker: b
    text: “留意”也可译作“记下”或“标明”。
    reason: lexical_alternative
  - marker: c
    text: “不要与他来往”也可译作“不要和他交往”。
    reason: lexical_alternative
  - marker: d
    text: 这种做法的目的在于纠正。参第15节：仍要“劝戒他如同弟兄”。
    reason: cross_reference
lexical_decisions:
- source_word: ὑπακούει
  choice: 听从
  rationale: ὑπακούω在这里指服从、遵从带有权威的教导；“听从”在现代汉语中自然，同时兼有听取和遵行之意。
- source_word: τῷ λόγῳ ἡμῶν
  choice: 我们……所传的话
  rationale: λόγος在此指使徒所传达的教导或指示。“所传的话”既保留“话”的表达，也让其教导性质在中文中清楚可懂。
- source_word: διὰ τῆς ἐπιστολῆς
  choice: 借这封信
  rationale: διά加属格通常表示媒介或途径；“借这封信”表达这话是以当前这封信为传达方式。“这”由语境补出。
- source_word: σημειοῦσθε
  choice: 要留意
  rationale: 该中间语态命令式要求群体辨认并记下不顺从的人。“留意”是自然的现代汉语，又不把这里提前解释成某种正式教会法律程序。
- source_word: τοῦτον
  choice: 这个人
  rationale: 指示代词明确回指前述不听从的人；“这个人”在中文中清楚直接。
- source_word: μὴ συναναμίγνυσθαι αὐτῷ
  choice: 不要与他来往
  rationale: συναναμίγνυμι意为与人交往、混在一起。“不要与他来往”保留停止社交或群体交往的力度，又不擅自规定其制度形式。
- source_word: ἐντραπῇ
  choice: 自觉羞愧
  rationale: 这里的不定过去时被动虚拟语气位于目的从句中，表达那人因处置而感到羞愧。“自觉羞愧”侧重其内在羞愧感，不把行动译成以公开羞辱为目的。
- source_word: τις
  choice: 有人
  rationale: 不定代词表示任何可能出现的人；“若有人”符合中文条件句习惯。
- source_word: αὐτῷ
  choice: 他
  rationale: 希腊文为阳性单数代词，回指代表性的单数τις；中文用“他”准确承接原文语法。
theological_decisions:
- issue: μὴ συναναμίγνυσθαι αὐτῷ所命令之纪律行动的性质
  choice: 译为停止与不顺从者来往，保留群体纪律和纠正目的，但不界定为最严格意义上的正式革除。
  alternative: 将其明确译成正式逐出教会，或弱化为一般性的少接触。
  rationale: 下节仍要求把此人当弟兄劝戒，而非视为仇敌。因此，本节是针对信徒的纠正性疏离；原文并未使用后世教会法的专门术语。
- issue: ἐντραπῇ的目的和力度
  choice: 表达使当事人产生羞愧之感，并由上下文显示其纠正性。
  alternative: 把公开羞辱或最终定罪当作行动本身的目的。
  rationale: ἵνα引出的目的从句明确保留“羞愧”的严肃性；第15节又表明这种处置面向劝戒和挽回，而非报复性羞辱。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“借这封信所传的话”保留διά所表达的媒介关系；“不要与他来往”维持原文纪律性的力度，但避免引入后世制度化术语；“自觉羞愧”保留目的从句及其纠正取向。
