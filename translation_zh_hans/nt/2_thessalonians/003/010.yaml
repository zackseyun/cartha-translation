  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ γὰρ ὅτε ἦμεν πρὸς ὑμᾶς, τοῦτο παρηγγέλλομεν ὑμῖν, ὅτι εἴ τις οὐ θέλει ἐργάζεσθαι μηδὲ ἐσθιέτω.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/010.yaml
  text: 'For even when we were with you, we kept commanding you this: if anyone is not willing to work, neither let him eat.'
translation:
  language: zh_hans
  text: 因为我们跟你们在一起的时候，也一再这样吩咐你们：“谁不肯作工[a]，谁就不可吃饭[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文指“不愿意作工”，不是“不能作工”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“也不要吃。”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: 因为……也
  rationale: 用“因为”表达γάρ承接上文的解释作用，用“也”体现καί的强调；这样既保留逻辑关系，又符合现代汉语表达。
- source_word: ὅτε ἦμεν πρὸς ὑμᾶς
  choice: 我们跟你们在一起的时候
  rationale: πρός与人连用在这里表示与对方同在；“跟你们在一起”自然、清楚。
- source_word: τοῦτο παρηγγέλλομεν ὑμῖν
  choice: 一再这样吩咐你们
  rationale: “这样”保留τοῦτο指向随后命令内容的作用；“吩咐”传达παραγγέλλω的权威性，未完成时以“一再”体现过去持续或反复的行动。
- source_word: εἴ τις οὐ θέλει ἐργάζεσθαι
  choice: 谁不肯作工
  rationale: “谁……谁……”自然表达泛指条件句；“不肯”准确体现θέλει所涉及的意愿，而不是工作能力。“作工”在庄重而通俗的经文语体中简洁明确。
- source_word: μηδὲ ἐσθιέτω
  choice: 谁就不可吃饭
  rationale: “就”明确条件与后果，“不可”保留第三人称命令的禁止意味；“吃饭”比孤立的“吃”更符合现代汉语，同时可指日常所得的食物。
theological_decisions:
- issue: 经文针对的是不愿工作还是无力工作
  choice: 不肯作工
  alternative: 不能作工
  rationale: θέλει表示意愿；经文所针对的是不愿工作，并非因疾病、残障或其他原因而无力工作的人。
- issue: 条件句及命令的泛指范围
  choice: 谁不肯作工，谁就不可吃饭
  alternative: 若有人不愿工作，就不要让他吃饭
  rationale: “谁……谁……”保留单数泛指而不限定性别，也避免把希腊文命令的承受者过度明确为负责供饭的第三方。
- issue: μηδὲ ἐσθιέτω的命令含义
  choice: 不可吃饭
  alternative: 不要让他吃饭
  rationale: 希腊文第三人称命令可以理解为“他也不要吃”或“不要让他吃”；正文采用汉语中较凝练且保留一定施事歧义的“不可吃饭”，脚注列出直译式替代说法。
translation_notes:
  register: 采用现代、庄重而通俗的普通话。“一再这样吩咐”体现未完成时的持续或反复意味；引语使用简洁的格言式结构，便于朗读和理解。
