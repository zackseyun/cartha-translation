base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/011.yaml
  text: For we hear that some among you are walking disorderly[a], doing no work at all[b], but meddling.
translation:
  language: zh_hans
  text: 因为我们听说，你们中间有人行事不守规矩[a]，什么工作都不做，反倒多管闲事[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“过着游手好闲的生活”或“生活散漫”。希腊词可指行为失序或不受约束；在本段语境中，也可能特别指不肯工作的闲散状态。
    reason: lexical_alternative
  - marker: b
    text: 希腊原文在“做工”和“多管闲事”之间有构词上的双关，近似于说：他们不做工，却忙着管不该管的事。
    reason: wordplay
lexical_decisions:
- source_word: ἀκούομεν
  choice: 我们听说
  rationale: 现在时表示当下听到的消息或持续获知的情况；“我们听说”是自然的现代汉语。
- source_word: γάρ
  choice: 因为
  rationale: 说明前文劝勉的缘由；汉语以“因为”清楚表达其解释和因果衔接作用。
- source_word: τινας
  choice: 有人
  rationale: 指群体中未具体点明的一部分人；“有人”简洁自然。
- source_word: περιπατοῦντας
  choice: 生活得
  rationale: 此处 περιπατέω 是描述生活方式或行事为人的惯用语。译作“生活得”比直译“行走”更符合现代汉语，同时保留行为方式的含义。
- source_word: ἐν ὑμῖν
  choice: 你们中间
  rationale: 表示这些人身处帖撒罗尼迦信徒群体之中。
- source_word: ἀτάκτως
  choice: 不守规矩
  rationale: 该词可指行为失序、不受约束，也可在本段语境中含游手好闲之意。“不守规矩”保留较宽的行为层面，不把意义限缩为懒惰。
- source_word: μηδὲν ἐργαζομένους
  choice: 什么工都不做
  rationale: 体现 μηδέν 的全面否定，并以自然汉语明确表达完全不工作的意思。
- source_word: ἀλλὰ
  choice: 只管
  rationale: 在否定正常工作与从事不当活动之间形成鲜明转折；“只管”在汉语中自然承接“什么工都不做”。
- source_word: περιεργαζομένους
  choice: 多管闲事
  rationale: 表达介入不属自己分内之事的含义。希腊文与前面的 ἐργαζομένους 构成同根词语游戏，汉语正文难以完全重现，故在脚注说明。
