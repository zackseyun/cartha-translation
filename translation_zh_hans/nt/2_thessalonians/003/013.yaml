  text: ὑμεῖς δέ, ἀδελφοί, μὴ ⸀ἐγκακήσητε καλοποιοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/013.yaml
  text: But as for you[a], brothers, do not grow weary in doing good.
translation:
  language: zh_hans
  text: 但你们呢，弟兄们[a]，行善不要灰心。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“弟兄姊妹们”；希腊文直译为“弟兄们”，在这里可包括整个信徒群体。
    reason: 词义替代与包容范围说明
lexical_decisions:
- source_word: ὑμεῖς δέ
  choice: 但你们呢
  rationale: δέ承接上文关于不守规矩之人的话，表示转折；前置的ὑμεῖς带有强调。“但你们呢”在现代汉语中自然地保留了这种对比和强调。
- source_word: ἀδελφοί
  choice: 弟兄们
  rationale: 该阳性复数呼格直译为“弟兄们”。在保罗写给教会的称呼中，它可包括整个信徒群体；正文保留原文形式，并用脚注说明其包容范围。
- source_word: μὴ ἐγκακήσητε
  choice: 不要灰心
  rationale: μή加不定过去时虚拟语气在此构成禁止语；ἐγκακέω可指因持续做某事而疲倦、泄气或丧失勇气。“不要灰心”自然、庄重，也适合行善这一语境。
- source_word: καλοποιοῦντες
  choice: 行善
  rationale: 现在时分词表示持续进行的善行，也说明不可灰心所涉及的活动。“行善”简洁自然，并保留其道德实践含义。
theological_decisions:
- issue: 教会称呼ἀδελφοί的性别与包容范围
  choice: 正文译作“弟兄们”，脚注说明可包括姊妹
  alternative: 正文译作“弟兄姊妹们”
  rationale: 原文采用阳性复数“弟兄们”，而在当时的教会书信中通常可用来称呼包括男女在内的整个信徒群体。正文保留词形特征，脚注则避免读者误以为只指男性。
translation_notes:
  register: 采用现代、自然而庄重的普通话。“但你们呢”突出与上文所述不守规矩之人的对比；全句简洁有力，适合劝勉语气。
