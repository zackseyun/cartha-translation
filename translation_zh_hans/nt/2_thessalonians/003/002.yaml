  text: καὶ ἵνα ῥυσθῶμεν ἀπὸ τῶν ἀτόπων καὶ πονηρῶν ἀνθρώπων, οὐ γὰρ πάντων ἡ πίστις.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/002.yaml
  text: and that we may be delivered from wicked and evil men[b][a], for not all have faith.
translation:
  language: zh_hans
  text: 也使我们能摆脱那些不讲理、邪恶的人[a]，因为不是人人都有信心[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不讲理”或译“悖谬”。希腊文这个词也可表示“不合宜”或“荒谬”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“因为并非人人都忠信。”希腊文直译为“因为信心（或忠信）并非人人所有”。
    reason: alternative_reading
lexical_decisions:
- source_word: ῥυσθῶμεν
  choice: 使我们能摆脱
  rationale: 不定过去时被动虚拟式受ἵνα支配，表达祈求的目的；“摆脱”自然传达从敌对者手中获救、脱离其侵害之意，又不额外限定获救方式。
- source_word: ἀτόπων
  choice: 悖谬
  rationale: 该词可表示不合宜、荒谬或不讲理；与“邪恶”并列时，“悖谬”既保留其偏离正道的意味，也避免与πονηρῶν完全重叠。其“不讲理”的可能含义收入脚注。
- source_word: πονηρῶν
  choice: 邪恶
  rationale: 清楚表达该词通常具有的道德恶意，并与“悖谬”形成自然搭配。
- source_word: ἀνθρώπων
  choice: 人
  rationale: 这里指敌对使徒事工的人；现代汉语“人”自然准确，不需要像英语那样作语法性别选择。
- source_word: πίστις
  choice: 信心
  rationale: 在本语境中最自然地指信仰或相信；同时该词也可能表示忠信，故在脚注保留此歧义。
- source_word: οὐ γὰρ πάντων ἡ πίστις
  choice: 因为不是人人都有信心
  rationale: 希腊文直译近于“因为信心并非人人所有”；汉语补出“有”，既通顺，也不把原文扩大成更强的神学断言。
theological_decisions:
- issue: πίστις在省略式短语中的含义
  choice: 信心
  alternative: 忠信；相应可译为“因为并非人人都忠信”
  rationale: 上下文涉及敌对福音事工的人，“不是人人都有信心”较可能指他们不信；但πίστις本身可表达忠信或可靠，因此用脚注保留真实的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“悖谬邪恶”保持两个形容词的区别；“摆脱”比生硬的“被救出”更符合汉语习惯。所有脚注标记均置于相关词句之后。
