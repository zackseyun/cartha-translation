    reason: cultural_note
  revision_rationale: The revision preserves the Greek contrast and all key terms while retaining the connective and clarifying the syntax of the positive command in natural modern Mandarin. The footnote continues to explain the community sense of “弟兄” without overstating the implication of grammatical gender.
