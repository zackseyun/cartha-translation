id: 2TH.3.15
reference: 2 Thessalonians 3:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ μὴ ὡς ἐχθρὸν ἡγεῖσθε, ἀλλὰ νουθετεῖτε ὡς ἀδελφόν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/015.yaml
  text: And do not regard him as an enemy[b][a], but admonish him as a brother.
translation:
  language: zh_hans
  text: 并且不要把他当作仇敌，却要把他当作弟兄来劝诫。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄”在这里指信仰群体中的一位成员；原文用阳性单数，指前文提到的那个人。
    reason: cultural_note
lexical_decisions:
- source_word: ἡγεῖσθε
  choice: 把……当作
  rationale: 该词在这里表示将某人看作或归入某一类；“把……当作”是现代汉语中自然、准确的表达。
- source_word: ἐχθρόν
  choice: 仇敌
  rationale: 指敌对者；“仇敌”保留了原文较强的敌我类别意味，也符合庄重的经文语体。
- source_word: νουθετεῖτε
  choice: 劝诫
  rationale: 该词兼有劝告、警戒和纠正之意；“劝诫”既体现纠正力度，也保留对群体成员的关怀。
- source_word: ἀδελφόν
  choice: 弟兄
  rationale: 原文为阳性单数，直指信仰群体中的一名男性成员；保留“弟兄”，并以脚注说明其群体关系含义。
- source_word: ὡς
  choice: 当作
  rationale: 两处均标明看待或劝诫此人时所依据的身份类别；汉语用“当作”最自然。
- source_word: καὶ μὴ ... ἀλλὰ
  choice: 不要……却要……
  rationale: 既表达禁令与正面命令之间的鲜明对照，也使汉语衔接简洁自然；句首连接词在本节独立呈现时无需机械译出。
theological_decisions:
- issue: 对不服从教导之信徒采取纪律措施时的态度
  choice: 不可把此人归为仇敌，仍须按弟兄的身份劝诫他。
  alternative: 可将本句泛化为一般人际冲突中的劝告。
  rationale: 上下文（帖后3:14–15）谈的是群体对不听从书信教导者的纪律性疏远；“弟兄”表明纠正并不等于以敌意对待，也没有明确宣告此人已不属于信仰群体。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“劝诫”比“劝告”更能体现纠正和警戒的力度，又不像“斥责”那样暗示敌对态度。主句保留原文两次ὡς所形成的身份对照：“当作仇敌”与“当作弟兄”。
