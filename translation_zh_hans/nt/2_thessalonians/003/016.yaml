id: 2TH.3.16
reference: 2 Thessalonians 3:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Αὐτὸς δὲ ὁ κύριος τῆς εἰρήνης δῴη ὑμῖν τὴν εἰρήνην διὰ παντὸς ἐν παντὶ τρόπῳ. ὁ κύριος μετὰ πάντων ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/016.yaml
  text: May the Lord of peace himself give you peace at all times in every way[b][a]. The Lord be with all of you.
translation:
  language: zh_hans
  text: 愿平安之主亲自时时[a]以各种方式[b]赐给你们平安。愿主与你们众人同在。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “时时”或译“始终”。
    reason: lexical_alternative
  - marker: b
    text: “以各种方式”或译“在各方面”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτὸς
  choice: 亲自
  rationale: αὐτός在此作强调用法，突出赐平安的是主自己；“亲自”在现代汉语中自然保留这一强调。
- source_word: δὲ
  choice: 不另译
  rationale: δὲ在此仅作轻微转折或引入结尾祝福；汉语直接以“愿”起句即可自然体现语篇过渡，若硬译为“如今”或“但是”反而会增添原文没有的时间或强转折意味。
- source_word: ὁ κύριος τῆς εἰρήνης
  choice: 平安之主
  rationale: 保留属格短语的称号式表达，不扩译为“赐平安的主”；“之”字结构庄重、简洁，也能保留原文关系的开放性。
- source_word: δῴη
  choice: 愿……赐给
  rationale: 不定过去时愿望语气在祝祷中表达祈愿；以“愿……赐给”准确体现祝福而非陈述。
- source_word: τὴν εἰρήνην
  choice: 平安
  rationale: 现代汉语无需机械表达希腊语冠词；“赐给你们平安”自然清楚。
- source_word: διὰ παντὸς
  choice: 时时
  rationale: 该短语表达贯穿始终的时间持续性；“时时”简洁保留“在一切时候”的含义。
- source_word: ἐν παντὶ τρόπῳ
  choice: 以各种方式
  rationale: τρόπος指方式、样式；“以各种方式”自然表达其广泛的方式意义，同时避免改写成原文未明说的“在各种处境中”。
- source_word: μετὰ πάντων ὑμῶν
  choice: 与你们众人同在
  rationale: “你们众人”明确保留πάντων所强调的全体范围，且符合庄重祝福语体。
theological_decisions:
- issue: 祝福语中“主”的所指
  choice: 只译作“主”，不在正文中增补身份
  alternative: 明确译作“主耶稣”或泛化为“神”
  rationale: 原文仅有ὁ κύριος。上下文很可能指主耶稣，但译文不应超出本节措辞明确所指，以保留原文的表达范围。
- issue: 末句无显式动词的语气
  choice: 译为祝愿：“愿主……同在”
  alternative: 译为陈述：“主与你们众人同在”
  rationale: 该无动词句处于结尾祝祷中，语用上延续祈愿而不是作平直事实陈述；汉语补出“愿”可清楚传达其祝福功能。
- issue: “平安之主”中属格的关系
  choice: 保留称号式“平安之主”
  alternative: 解释性译为“赐平安的主”
  rationale: τῆς εἰρήνης可让读者理解主与平安的源头、赐予等关系，但原文本身没有把关系限定为单一解释；称号式翻译较能保留这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的祝祷语体。“平安之主”略带典雅色彩，但在普通现代读者可理解的范围内，并能避免解释性扩写。脚注标记按正文出现顺序排列。
