  text: πεποίθαμεν δὲ ἐν κυρίῳ ἐφ’ ὑμᾶς, ὅτι ἃ ⸀παραγγέλλομεν καὶ ποιεῖτε καὶ ποιήσετε.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/004.yaml
  text: And we have confidence in the Lord about you, that you are doing and will do what we command.
translation:
  language: zh_hans
  text: 但我们在主里深信：我们所吩咐的事，你们正在遵行，也必会遵行。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεποίθαμεν
  choice: 我们……有信心
  rationale: 保留完成时所表达的坚定、持续信念，同时符合现代汉语习惯。
- source_word: ἐν κυρίῳ
  choice: 在主里
  rationale: 直译并保留这信心以主为根基或范围的神学内涵，不把它简化为一般性的信任。
- source_word: ἐφ’ ὑμᾶς
  choice: 对你们
  rationale: 自然表达保罗以收信人为对象所怀的信心，也保留介词短语的简洁性。
- source_word: παραγγέλλομεν
  choice: 我们所吩咐的
  rationale: παραγγέλλω 在本段指带有权威的指示；“吩咐”比“建议”准确，也较“命令”自然庄重。
- source_word: ποιεῖτε καὶ ποιήσετε
  choice: 你们现在正在做，将来也会做
  rationale: 明确呈现现在时与将来时的对照；加入“现在”和“将来”只为在汉语中显明时态关系。
theological_decisions:
- issue: 保罗的信心与“在主里”的关系
  choice: 保留“在主里”，使信心最终以主为根基
  alternative: 译作“靠着主，我们相信你们”
  rationale: 原文“ἐν κυρίῳ”可涉及信心的范围、根基或联合关系；直译较能保留这种丰富性，避免只限定为手段。
- issue: ὅτι 从句表达信念还是信心的内容
  choice: 译作“相信……”，自然引出信心的具体内容
  alternative: 译作“就是你们……”
  rationale: 汉语中补出“相信”使句法清楚，但不改变原文内容从句的功能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“但”承接上文转折；“现在正在做，将来也会做”清楚传达原文现在与将来的并列。
