review_pass:
  verdict: revise
  source_fidelity: 原文 πεποίθαμεν 表达坚定的信赖；“深信”在现代汉语中比“对你们有信心”更准确、自然地传达保罗对收信者顺服情形的确信。ἐν κυρίῳ 保留为“在主里”。ὅτι 后的内容包括现在时 ποιεῖτε 与将来时 ποιήσετε，修订保留“正在……也必会……”的时态对照。παραγγέλλομεν 仍译为“所吩咐的事”，保留其权威性而不强化为不必要的法律性措辞。
  naturalness: 原译“在主里对你们有信心，相信我们所吩咐的，你们……”中“对你们有信心”容易理解为一般性的信任或信仰意义上的“信心”，且“所吩咐的”后直接接逗号，句法略显生硬。以“深信：我们所吩咐的事，你们正在遵行，也必会遵行”可使内容从句和宾语关系清晰，并保持庄重自然的书面语体。
  terminology: “主”“吩咐”“遵行”均适合本书信的庄重语域。“遵行”在此准确表达 ποιεῖν 对所受吩咐的实行，且不引入特定宗派解释。
