    rationale: 该说法可能被读作对人的一般信任，甚至与宗教性的“信心”混淆；原文在此是保罗在主里确信他们会实行所受吩咐。
  - severity: low
    issue: “我们所吩咐的，你们现在正在做”句法衔接生硬。
    rationale: 补出“事”并使用冒号引出确信的内容，使“所吩咐的”明确修饰其后的实行对象。
