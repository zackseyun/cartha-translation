id: 2TH.3.3
reference: 2 Thessalonians 3:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: πιστὸς δέ ἐστιν ὁ κύριος, ὃς στηρίξει ὑμᾶς καὶ φυλάξει ἀπὸ τοῦ πονηροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/003.yaml
  text: But the Lord is faithful[a], who will strengthen you and guard you from the evil one.
translation:
  language: zh_hans
  text: 但主是信实的；他必坚固你们，保护你们脱离那恶者。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“保护你们脱离邪恶。”希腊语“τοῦ πονηροῦ”既可理解为阳性的“那恶者”，也可理解为中性的“邪恶”。
    reason: alternative_reading
lexical_decisions:
- source_word: πιστὸς
  choice: 信实的
  rationale: 作表语描述主可靠、忠信；在上文“不是人人都有信心”的背景下，也保留“人不信—主信实”的对照。
- source_word: δέ
  choice: 但
  rationale: 承接上一节并表达转折，突出人的不信与主的信实之间的对比。
- source_word: ὁ κύριος
  choice: 主
  rationale: 保留原文称号，不在译文中进一步限定所指；在保罗书信语境中很可能指主耶稣。
- source_word: στηρίξει
  choice: 必坚固
  rationale: στηρίζω 可指使稳固、坚立或加强；“坚固”既贴近其核心意象，也自然适用于信徒。
- source_word: φυλάξει
  choice: 保护
  rationale: 表达看守、护卫之意；现代汉语中“保护……脱离”自然清楚。
- source_word: ἀπὸ
  choice: 脱离
  rationale: 表示使人远离或免受随后所说的危险，与“保护”搭配自然。
- source_word: τοῦ πονηροῦ
  choice: 那恶者
  rationale: 带冠词的形容词属格形式可作阳性“那恶者”，也可作中性“邪恶”。正文采用符合新约常见个人化用法的译法，并以脚注保留语法歧义。
theological_decisions:
- issue: τοῦ πονηροῦ 的所指
  choice: 那恶者
  alternative: 邪恶
  rationale: 希腊语形式在语法上既可理解为阳性的“那恶者”，也可理解为中性的“邪恶”。正文采用个人化理解，但用脚注明确保留另一种合理读法，不把原文的神学张力暗中消除。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“信实”“坚固”保留经文的神学分量；分号体现前半句宣告主的品格，后半句说明他将采取的行动。脚注标记置于相关短语之后。
