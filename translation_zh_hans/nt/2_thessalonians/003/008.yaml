  text: οὐδὲ δωρεὰν ἄρτον ἐφάγομεν παρά τινος, ἀλλ’ ἐν κόπῳ καὶ μόχθῳ ⸂νυκτὸς καὶ ἡμέρας⸃ ἐργαζόμενοι πρὸς τὸ μὴ ἐπιβαρῆσαί τινα ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/008.yaml
  text: nor did we eat bread from anyone free of charge[a], but with labor and hardship, working night and day so as not to burden any of you.
translation:
  language: zh_hans
  text: 也没有白白吃任何人的饭[a]；反而辛苦劳碌，昼夜做工，以免成为你们任何人的负担。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“也没有白白吃任何人的饼”。“饼”在这里也可泛指食物或生活供养。
    reason: lexical_alternative
lexical_decisions:
- source_word: δωρεὰν
  choice: 白吃
  rationale: 表示无偿取得、不付代价；与“饭”搭配自然简洁，并保留本段经济供养的语境。
- source_word: ἄρτον
  choice: 饭
  rationale: 原义为“饼、面包”，在此可转指日常食物或生活供养。汉语“吃……的饭”既保留具体饮食意象，也能自然表达接受供养。
- source_word: παρά τινος
  choice: 任何人的
  rationale: παρά加属格表示来源；结合汉语“吃任何人的饭”表达“从任何人那里获得食物或供养”。
- source_word: ἐν κόπῳ καὶ μόχθῳ
  choice: 辛苦劳碌
  rationale: 两个近义词叠加强调费力和艰辛；“辛苦劳碌”自然保留累积语势。
- source_word: νυκτὸς καὶ ἡμέρας
  choice: 昼夜
  rationale: 时间属格表达夜以继日的持续劳作；“昼夜”简洁庄重。
- source_word: ἐργαζόμενοι
  choice: 做工
  rationale: 分词说明使徒一行维持自身生活的方式；“做工”比泛指活动的“工作”更贴合劳动和自给的语境。
- source_word: πρὸς τὸ μὴ ἐπιβαρῆσαί
  choice: 免得加重……的负担
  rationale: 该结构表示目的，ἐπιβαρέω在此指给人增加物质或经济压力；此译法自然并明确保留“负担”的意象。
- source_word: τινα ὑμῶν
  choice: 你们任何人
  rationale: 不定代词单数配合属格代词，具有逐一分配的意义；“你们任何人”准确自然。
- source_word: οὐδὲ ... ἀλλ’
  choice: 也没有……反而
  rationale: 承接上文的否定并形成鲜明转折；“也没有……反而”在中文中清楚保留修辞关系。
theological_decisions: []
