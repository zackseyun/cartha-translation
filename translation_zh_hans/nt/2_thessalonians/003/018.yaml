  yaml_path: translation/nt/2_thessalonians/003/018.yaml
  text: The grace of our Lord Jesus Christ be with all of you[a].
translation:
  language: zh_hans
  text: 愿我们主耶稣基督的恩典与你们众人同在。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάρις
  choice: 恩典
  rationale: 这是保罗书信祝福语中的惯用词，指借着基督临到人的恩惠；“恩典”既准确，也符合现代中文基督教语境中的通行表达。
- source_word: κυρίου
  choice: 主
  rationale: 在这里是对耶稣的尊称，表达权柄与尊荣；“主”简洁、庄重，并保留其基督论含义。
- source_word: Ἰησοῦ Χριστοῦ
  choice: 耶稣基督
  rationale: “耶稣”按中文惯例音译；Χριστός本有“受膏者、弥赛亚”之意，但在这一固定祝福语中与“耶稣”紧密连用，现代中文自然表达为“耶稣基督”，不意味着抹去其称号背景。
- source_word: μετὰ πάντων ὑμῶν
  choice: 与你们众人同在
  rationale: μετά加属格表示“与……同在”；πάντων保留为“众人”，明确祝福涵盖整个群体。中文补出“愿”，使省略动词的希腊语祝福公式自然成立。
theological_decisions:
- issue: Χριστοῦ在结尾祝福语中的译法
  choice: 基督
  alternative: 弥赛亚
  rationale: Χριστός源自“受膏者”的称号，但在保罗这一固定称谓中也具有近似专名的用法。译作“基督”最符合现代中文的自然、庄重表达，同时仍承载传统称号含义；译作“弥赛亚”虽可凸显词源，却会使本节的惯用祝福语显得刻意。
- issue: 祝福语是否补出祈愿语气
  choice: 补出“愿”
  alternative: 省略“愿”，作“我们主耶稣基督的恩典与你们众人同在”
  rationale: 原文是书信结尾的祝福公式，虽无明示动词，语用上具有祈愿意味。中文补出“愿”可自然传达这一功能，而不把祝福改写为单纯陈述。
translation_notes:
  register: 采用现代、庄重而易懂的书信祝福语体。“你们众人”保留原文对全体收信人的强调；不添加原文没有的“阿们”。
