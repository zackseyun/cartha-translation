  text: οὐχ ὅτι οὐκ ἔχομεν ἐξουσίαν, ἀλλ’ ἵνα ἑαυτοὺς τύπον δῶμεν ὑμῖν εἰς τὸ μιμεῖσθαι ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/009.yaml
  text: not because we do not have the right, but in order to give ourselves to you as an example for you to imitate us.
translation:
  language: zh_hans
  text: 这并不是因为我们没有这权利[a]，而是要把我们自己给你们作榜样[b]，好让你们效法我们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“权柄”或“能力”；上下文较支持“正当权利”的意思。
    reason: lexical_alternative
  - marker: b
    text: 或译“典范”或“模范”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξουσίαν
  choice: 权利
  rationale: 本段语境谈到使徒及其同工有权获得生活供给，却自愿不使用这项权利；“权利”比“权柄”或“能力”更准确地表达这里的正当资格。
- source_word: ἑαυτοὺς
  choice: 自己
  rationale: 这是复数反身代词，指保罗和他的同工；汉语用“自己”自然地保留其反身含义。
- source_word: τύπον
  choice: 榜样
  rationale: 此处指可供他人仿效的行为典范；“榜样”既自然，也能表达其示范作用。
- source_word: δῶμεν
  choice: 使……成为
  rationale: 希腊语直译为“把自己给你们作榜样”。现代汉语用“使自己成为你们的榜样”较为自然，同时保留主动将自己呈为典范的含义。
- source_word: εἰς τὸ μιμεῖσθαι
  choice: 让你们效法
  rationale: 该结构表达目的或预期结果；“让你们效法”简洁地保留这一指向。
- source_word: μιμεῖσθαι ἡμᾶς
  choice: 效法我们
  rationale: 直接表达动词及其宾语，保留经文要求读者仿效保罗及其同工的明确含义。
- source_word: οὐχ ὅτι οὐκ
  choice: 这并不是因为我们没有
  rationale: 保留双重否定所引出的动机澄清，并与后面的正面目的形成清楚对照。
- source_word: ἀλλ’ ἵνα
  choice: 而是要
  rationale: 自然地表达与前句相对的积极目的，不把目的关系弱化为单纯结果。
theological_decisions:
- issue: ἐξουσίαν所指权利的性质
  choice: 保罗和同工拥有接受生活供给的正当权利，但在这里自愿不使用。
  alternative: 泛指使徒的权柄或能力。
  rationale: 上下文强调他们亲自劳作、不成为别人的负担，因此此处主要是获得供给的正当资格；译文不将其扩展为更宽泛的使徒权柄教义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“这并不是……而是……”清楚保留原文的修辞对比；“使自己成为你们的榜样，让你们效法我们”避免生硬直译，同时维持两层目的关系。
