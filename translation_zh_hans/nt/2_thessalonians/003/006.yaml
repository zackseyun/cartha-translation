  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Παραγγέλλομεν δὲ ὑμῖν, ἀδελφοί, ἐν ὀνόματι τοῦ κυρίου ⸀ἡμῶν Ἰησοῦ Χριστοῦ στέλλεσθαι ὑμᾶς ἀπὸ παντὸς ἀδελφοῦ ἀτάκτως περιπατοῦντος καὶ μὴ κατὰ τὴν παράδοσιν ἣν ⸀παρελάβοσαν παρ’ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/006.yaml
  text: We command you[a], brothers, in the name of our Lord Jesus the Messiah[e][d][c][b], to keep away from every brother who is walking disorderly and not according to the tradition that they received from us.
translation:
  language: zh_hans
  text: 弟兄们[a]，我们奉我们的主耶稣基督的名吩咐你们：要避开[b]每一个行事不守规矩、不遵照他们从我们领受的传统[c]的弟兄。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄们”直译原文的阳性复数称呼；保罗是在对整个教会说话。
    reason: lexical_alternative
  - marker: b
    text: “避开”也可译作“远离”；原文指使自己退出密切交往，并不明确使用正式革除会籍的术语。
    reason: lexical_alternative
  - marker: c
    text: 有些抄本作“你们从我们领受的”或“他从我们领受的”，使句法与上下文更整齐；这里所依据的文本作“他们从我们领受的”。
    reason: textual_variant
lexical_decisions:
- source_word: Παραγγέλλομεν
  choice: 我们……吩咐你们
  rationale: 该动词表示带有权威的指示；“吩咐”在现代中文中既保留使徒命令的分量，也比“命令”更符合此处庄重的教会语境。
- source_word: ἀδελφοί
  choice: 弟兄们
  rationale: 保留阳性复数称呼和初期教会的亲属语言；此称呼面向整个教会，另以脚注说明。
- source_word: ἐν ὀνόματι τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: 奉主耶稣基督的名
  rationale: “奉……的名”自然保留ἐν ὀνόματι的权威与庄严含义；Χριστός采用中文圣经及现代汉语中通行的称号“基督”。
- source_word: στέλλεσθαι ὑμᾶς ἀπὸ
  choice: 你们都要避开他
  rationale: 表达主动拉开距离、避免密切交往的意思，但不把它强化为正式革除会籍。
- source_word: παντὸς ἀδελφοῦ
  choice: 凡有弟兄……都……他
  rationale: 保留原文单数阳性的个体指向，并以自然中文“凡有……都……”表达παντός的周遍意义。
- source_word: ἀτάκτως περιπατοῦντος
  choice: 行事不守规矩
  rationale: “行事”自然传达“行走”作为生活方式的隐喻；“不守规矩”保留ἀτάκτως较宽的失序、不受约束之义，不提前缩窄为“懒惰”。
- source_word: μὴ κατὰ τὴν παράδοσιν
  choice: 不遵照……传统
  rationale: παράδοσις指传递下来的内容；“传统”直接保留这一概念，其使徒来源由下文限定。
- source_word: ἣν παρελάβοσαν παρ’ ἡμῶν
  choice: 他们从我们领受的
  rationale: 依SBLGNT所印παρελάβοσαν译为第三人称复数“他们领受”，虽与前面的单数“弟兄”形成不寻常的数转换，仍保留底本文本；异文另注。
theological_decisions:
- issue: Χριστοῦ在称号中的译法
  choice: 基督
  alternative: 弥赛亚
  rationale: 两者都表达“受膏者”的称号意义；“基督”是现代中文中对Χριστός最自然、庄重且广为理解的直接称号，不把它当作普通人名处理。
- issue: στέλλεσθαι ὑμᾶς ἀπό所要求的疏离范围
  choice: 避开
  alternative: 远离；退出与他的交往
  rationale: “避开”保留纪律性的社交距离，同时不擅自解释为正式开除或完全断绝一切接触。
- issue: 单数“弟兄”与复数“他们领受”的张力
  choice: 在正文中保留数的不一致
  alternative: 按异文译作“他从我们领受的”或“你们从我们领受的”
  rationale: 忠实呈现SBLGNT所印第三人称复数，不以顺畅为由静默改采用较整齐的异文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“奉……的名”“领受”保留使徒教导语境的正式色彩；“行事不守规矩”既自然又保留原文较宽的行为含义。所有脚注标记均置于正文相应句末。
