  text: Τὸ λοιπὸν προσεύχεσθε, ἀδελφοί, περὶ ἡμῶν, ἵνα ὁ λόγος τοῦ κυρίου τρέχῃ καὶ δοξάζηται καθὼς καὶ πρὸς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/001.yaml
  text: Finally[a], brothers, pray for us, that the word of the Lord may spread rapidly and be honored, just as it was among you[b],
translation:
  language: zh_hans
  text: 最后，弟兄们[a]，请为我们祷告，好让主的道迅速传开，并得到尊崇[b]，正如在你们那里所发生的一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄们”也可理解为“弟兄姊妹们”；希腊文直译为“弟兄们”，在这里可能代表性地称呼全体会众。
    reason: lexical_alternative
  - marker: b
    text: “迅速传开，并得到尊崇”直译为“奔跑并得荣耀”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὸ λοιπὸν
  choice: 最后
  rationale: 这是书信中引出末段劝勉的惯用转折语；“最后”符合现代汉语书信语体，并不必然表示全信只剩一句话。
- source_word: προσεύχεσθε
  choice: 请……祷告
  rationale: 现在时命令语气呼吁会众为保罗一行祷告；汉语用“请”表达郑重而自然的请求，持续意味可由语境体现。
- source_word: ἀδελφοί
  choice: 弟兄们
  rationale: 保留希腊文阳性复数称呼，同时以脚注说明它在这里可代表性地称呼全体会众。
- source_word: περὶ ἡμῶν
  choice: 为我们
  rationale: 与“祷告”连用时，περί加属格自然表示代求的对象。
- source_word: ἵνα
  choice: 好让
  rationale: 兼顾祷告内容与所求目的、结果的意味，语气自然。
- source_word: ὁ λόγος τοῦ κυρίου
  choice: 主的道
  rationale: “道”是现代中文圣经语境中对 λόγος 的庄重而通行的表达，可指所宣讲、出于主并关乎主的信息。
- source_word: τρέχῃ
  choice: 迅速传开
  rationale: 原意为“奔跑”，此处以拟人比喻描述主的道迅速进展；正文传达比喻所指，脚注保留字面形象。
- source_word: δοξάζηται
  choice: 得着荣耀
  rationale: 保留 δοξάζω 的“荣耀”语义以及被动形式，表示主的道受到尊崇、获得应有的回应。
- source_word: καθὼς καὶ πρὸς ὑμᾶς
  choice: 正如在你们那里一样
  rationale: 自然表达比较关系，也保留 καί 的“也、同样”意味；所省略的情形由“正如……一样”自然补足。
theological_decisions:
- issue: ἀδελφοί是否明确扩展为男女会众
  choice: 正文译“弟兄们”，脚注说明可能代表全体会众
  alternative: 弟兄姊妹们
  rationale: 既不抹去原文的阳性复数形式，也不否认该称呼在混合性别会众中可能具有代表性。
- issue: 是否在正文保留“道奔跑”的字面隐喻
  choice: 正文译“主的道迅速传开”，脚注注明字面表达
  alternative: 主的道奔跑
  rationale: “迅速传开”在现代汉语中清楚传达福音迅速进展的含义，而脚注保存原文鲜明的拟人形象，避免把解释冒充唯一可能的字面形式。
- issue: δοξάζηται用于“主的道”时的表达
  choice: 得着荣耀
  alternative: 受到尊崇
  rationale: “得着荣耀”更直接保留原文的神学词汇和被动意味；在此可理解为主的道被人尊重、接纳并彰显其荣耀。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“主的道”保留圣经语体；句式按中文习惯调整，但没有消除原文中“奔跑”和“得荣耀”的神学张力，字面形象由脚注交代。
