  text: τοῖς δὲ τοιούτοις παραγγέλλομεν καὶ παρακαλοῦμεν ⸂ἐν κυρίῳ Ἰησοῦ Χριστῷ⸃ ἵνα μετὰ ἡσυχίας ἐργαζόμενοι τὸν ἑαυτῶν ἄρτον ἐσθίωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/012.yaml
  text: To such people we command and urge in the Lord Jesus the Messiah that[a], working quietly[c][b], they should eat their own bread.
translation:
  language: zh_hans
  text: 我们在主耶稣基督[a]里命令并劝勉这样的人，叫他们安静地做工，吃自己的饭[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “基督”意为“受膏者”，也可译作“弥赛亚”。
    reason: 说明“基督”作为称号的含义及可行译法。
  - marker: b
    text: “吃自己的饭”指靠自己的劳动维持生活。
    reason: 说明“饭”在本语境中指日常食物和生计，保留其具体意象。
lexical_decisions:
- source_word: τοῖς δὲ τοιούτοις
  choice: 至于这样的人
  rationale: 承接上文所说不守规矩、游手好闲的人；“至于”自然体现 δέ 的轻微转折或话题转换，不添加时间意义。
- source_word: παραγγέλλομεν καὶ παρακαλοῦμεν
  choice: 我们……命令并劝勉
  rationale: 保留两个动词，兼顾使徒命令的权威性和恳切劝告的牧养语气。
- source_word: ἐν κυρίῳ Ἰησοῦ Χριστῷ
  choice: 在主耶稣基督里
  rationale: “在……里”保留 ἐν 所表达的关系、范围或权柄来源，不将其单一化为工具义；“基督”在现代中文圣经语境中仍是可识别的称号，意为受膏者。
- source_word: μετὰ ἡσυχίας ἐργαζόμενοι
  choice: 安静地做工
  rationale: 表达一种安分、平静、不扰乱群体的工作方式，与上文游手好闲并多管闲事形成对照。
- source_word: τὸν ἑαυτῶν ἄρτον ἐσθίωσιν
  choice: 吃自己的饭
  rationale: 中文“吃自己的饭”自然保留自食其力的具体意象；“饭”比直译“饼”更能表达 ἄρτος 在此所指的日常食物和生计。
theological_decisions:
- issue: Χριστός 的译法
  choice: 基督
  alternative: 弥赛亚
  rationale: Χριστός 在此仍具有“受膏者”的称号意义；现代标准中文中“耶稣基督”是自然且广为理解的称号组合，并未将其当作姓氏。脚注注明其含义，以保留标题功能。
- issue: 使徒劝令的力度
  choice: 同时保留“命令”和“劝勉”
  alternative: 合并译为“吩咐”或“劝告”
  rationale: 原文刻意并列权威命令与恳切劝勉，合并会削弱其中一面。
- issue: ἐν κυρίῳ 的关系
  choice: 在主耶稣基督里
  alternative: 奉主耶稣基督的名／靠着主耶稣基督
  rationale: 直译保留其可能兼有的联合、范围和权柄含义，避免只解释为奉名或凭借。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“安静地做工”不是要求绝对不出声，而是指安分、不扰乱别人地劳动。“吃自己的饭”口语自然，但仍保有经文的具体生活意象。
