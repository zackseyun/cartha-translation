base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/007.yaml
  text: For you yourselves know how you ought to imitate us[a], because we did not behave disorderly among you.
translation:
  language: zh_hans
  text: 你们自己知道该怎样效法我们，因为我们在你们中间并没有行事不守规矩[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 按本段语境，也可更具体地理解为“我们在你们中间并没有闲懒”。
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ
  choice: 自己
  rationale: 作为强调代词，突出帖撒罗尼迦信徒本身已经知道，汉语用“你们自己”自然保留其强调作用。
- source_word: γὰρ
  choice: 原
  rationale: 本句承接上文，为先前的吩咐提供理由；“原”在此简洁表达解释性的承接关系，也符合庄重的经文语体。
- source_word: οἴδατε
  choice: 知道
  rationale: οἶδα虽为完成时形式，通常表达现在状态，译作“知道”准确自然。
- source_word: πῶς δεῖ μιμεῖσθαι ἡμᾶς
  choice: 该怎样效法我们
  rationale: “该”表达δεῖ的必要或义务，“怎样”保留πῶς所指的方式，“效法我们”保持人称宾语，不抽象化为“我们的榜样”。
- source_word: ὅτι
  choice: 因为
  rationale: 在此引出他们应当如何效法使徒一行的根据；“因为”自然呈现其因果作用。
- source_word: οὐκ ἠτακτήσαμεν
  choice: 并没有不守规矩
  rationale: ἀτακτέω指行为失序、不守规范；上下文虽涉及闲懒和不工作，但词义不必局限于此，因此正文保留较宽泛的含义。
- source_word: ἐν ὑμῖν
  choice: 在你们中间
  rationale: 准确表达使徒一行在帖撒罗尼迦信徒群体中生活行事的处境。
theological_decisions:
- issue: ἀτακτέω在本段中的范围
  choice: 正文译作较宽泛的“不守规矩”
  alternative: 具体译作“闲懒”或“不做工”
  rationale: 本章语境确实把失序行为与不肯做工联系起来，但ἀτακτέω本身可泛指行为失序或不守规范。正文不将其含义收窄，脚注说明语境中的具体可能性，以保留原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“该怎样效法我们”兼顾δεῖ的义务意味与汉语自然度；“不守规矩”保持词义广度，脚注补充上下文所凸显的“闲懒”含义。
