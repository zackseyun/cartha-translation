  text: ὁ δὲ κύριος κατευθύναι ὑμῶν τὰς καρδίας εἰς τὴν ἀγάπην τοῦ θεοῦ καὶ εἰς τὴν ὑπομονὴν τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/005.yaml
  text: May the Lord direct your hearts into the love of God and into the steadfastness of Messiah[a][b][c].
translation:
  language: zh_hans
  text: 愿主引导你们的心，归向上帝的爱[a]，归向弥赛亚的坚忍[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “上帝的爱”也可理解为“对上帝的爱”。
    reason: alternative_reading
  - marker: b
    text: 也可译作“弥赛亚自己的坚忍”，或“为弥赛亚而有的坚忍”。
    reason: alternative_reading
  - marker: c
    text: 希腊语作“基督”；这里因该词用作称号，译作“弥赛亚”。
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: 主
  rationale: 保留新约中这一神圣及基督论称号的惯常表达，不在本句未明说之处进一步限定所指。
- source_word: κατευθύναι
  choice: 愿……引导
  rationale: 以“愿”表达希腊语祈愿式的祷愿语气；“引导”自然传达使方向归正、带领前行的含义。
- source_word: καρδίας
  choice: 心
  rationale: 保留圣经人论中“心”作为思想、意志和情感中心的意象，避免窄化为“思想”或泛化为“内在自我”。
- source_word: ἀγάπην
  choice: 爱
  rationale: “爱”是ἀγάπη在现代汉语中准确、清楚而自然的对应词。
- source_word: τοῦ θεοῦ
  choice: 上帝的
  rationale: 采用属格结构“上帝的爱”，尽量保留它可指上帝所施的爱、对上帝的爱，或属神之爱这一领域或性质的开放性；脚注说明主要替代读法。
- source_word: ὑπομονὴν
  choice: 坚忍
  rationale: 表达在压力和患难中坚定持守、持续忍耐的品格，比单纯“忍耐”更能体现坚持不移的含义。
- source_word: τοῦ Χριστοῦ
  choice: 弥赛亚的
  rationale: 以“弥赛亚”翻译作为称号的Χριστός；属格形式在正文中保留弥赛亚自身的坚忍、为弥赛亚而坚忍及以他为特征之坚忍等可能性。
theological_decisions:
- issue: τὴν ἀγάπην τοῦ θεοῦ中的属格歧义
  choice: 上帝的爱
  alternative: 对上帝的爱；上帝所赐或所显的爱
  rationale: 原文属格可作主语属格、宾语属格或更宽泛的性质与领域关系。正文不把它限定为某一个神学方向，脚注保留主要解释。
- issue: τὴν ὑπομονὴν τοῦ Χριστοῦ中的属格歧义
  choice: 弥赛亚的坚忍
  alternative: 弥赛亚自己的坚忍；为弥赛亚而有的坚忍；像弥赛亚那样的坚忍
  rationale: 原文可有主语、宾语或性质方面的理解。正文采用紧贴原文的属格结构，不静默消除其神学张力。
- issue: Χριστοῦ的称号性质
  choice: 弥赛亚
  alternative: 基督
  rationale: Χριστός在这里作为称号使用，译出“受膏者／弥赛亚”的称号含义；脚注同时交代传统希腊语对应词“基督”。
translation_notes:
  register: 采用现代、庄重而可懂的祷愿语体。“进入……的爱和……的坚忍”略带圣经意象色彩，是为保留原文两次εἰς所表达的方向性，并维持两个属格短语的真实歧义。δὲ在此为轻微承接词，现代汉语中不另加生硬连接语。
