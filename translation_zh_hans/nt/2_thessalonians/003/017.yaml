  text: Ὁ ἀσπασμὸς τῇ ἐμῇ χειρὶ Παύλου, ὅ ἐστιν σημεῖον ἐν πάσῃ ἐπιστολῇ· οὕτως γράφω.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/017.yaml
  text: The greeting is by my own hand—Paul's—which is a sign in every letter[a]; this is how I write.
translation:
  language: zh_hans
  text: 这问候是我——保罗——亲笔写的；它是我每封信中的记号。[a]我就是这样写的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 末句也可译作：“我这样写。”或较直译为：“我如此写。”这句话可能指保罗以亲笔问候作为每封信的记号，也可能较直接地指他当前这样书写。
    reason: 保留οὕτως γράφω可指书写方式／惯例，或承接当前书写动作的语义余地，避免将所指限定为笔迹。
lexical_decisions:
- source_word: Ὁ ἀσπασμὸς
  choice: 这问候
  rationale: ἀσπασμός在书信语境中指结尾的问候；“问候”现代、自然，也不带“致意”或“祝词”的额外色彩。定冠词结合语境译作“这”，指当前这项问候。
- source_word: τῇ ἐμῇ χειρὶ
  choice: 亲手写下
  rationale: 该与格短语表达由保罗本人动笔；汉语用“亲手写下”比逐字译作“用我的手”更自然，并保留亲笔认证的意思。
- source_word: Παύλου
  choice: 我—保罗—
  rationale: 原文属格“保罗的”与“我的手”构成自我辨明。汉语改用插入式“我—保罗—”，清楚保留保罗点明本人身份的强调。
- source_word: σημεῖον
  choice: 记号
  rationale: 此处指可供辨认、认证的标志。“记号”既贴近原词，也比“凭证”少一层法律化解释。
- source_word: ἐν πάσῃ ἐπιστολῇ
  choice: 在我每封信中
  rationale: πάσῃ可理解为“每一封”；补出语境隐含的“我”，使现代汉语明确这是保罗书信中的惯例，而不改变所指范围。
- source_word: οὕτως γράφω
  choice: 我就是这样写的
  rationale: 保留οὕτως指向书写方式或笔迹样式的可能性；“就是”传达其作为识别记号的强调，但不具体断定所指究竟是字形、签名还是整句问候。
theological_decisions:
- issue: 保罗亲笔附语的认证作用
  choice: 译文把亲笔问候称为他每封信中的“记号”，呈现其认证功能。
  alternative: 末句也可较弱地理解为只指当前动作：“我这样写。”
  rationale: “这是……记号”直接对应原文，同时末句保持简洁，不把该记号具体解释为某种固定签名格式，从而保留所指的开放性。
- issue: “每封信”的范围
  choice: 按原文直译为“我每封信中”。
  alternative: 可按语用理解为“每一封这样的信”或“我的各封信中”。
  rationale: 不以调和现存书信中亲笔标记的差异为由缩窄πάσῃ的表面范围，也不由此推导额外的正典或作者论结论。
translation_notes:
  register: 采用现代、庄重而易懂的书信语体。“我—保罗—”以破折号表现原文自我辨明的插入强调；分号保留两项陈述的紧密联系。脚注标记已在正文中以[a]出现。
