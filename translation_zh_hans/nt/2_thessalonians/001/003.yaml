id: 2TH.1.3
reference: 2 Thessalonians 1:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Εὐχαριστεῖν ὀφείλομεν τῷ θεῷ πάντοτε περὶ ὑμῶν, ἀδελφοί, καθὼς ἄξιόν ἐστιν, ὅτι ὑπεραυξάνει ἡ πίστις ὑμῶν καὶ πλεονάζει ἡ ἀγάπη ἑνὸς ἑκάστου πάντων ὑμῶν εἰς ἀλλήλους,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/003.yaml
  text: We ought always to give thanks to God for you[a], brothers, as is fitting, because your faith is growing abundantly and the love of each and every one of you for one another is increasing[c][b],
translation:
  language: zh_hans
  text: 弟兄们，我们应当常常为你们向上帝感恩[a]；这是合宜的，因为你们的信心大大增长，并且你们众人中每一个人对彼此的爱都不断增多[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄们”也可译作“弟兄姊妹们”；希腊文直译为“弟兄们”，在这里可用来称呼整个信徒群体。
    reason: lexical_alternative
  - marker: b
    text: “信心”也可理解为“忠信”或“信实”。
    reason: alternative_reading
lexical_decisions:
- source_word: Εὐχαριστεῖν ὀφείλομεν
  choice: 我们应当……感谢
  rationale: 不定式与ὀφείλομεν连用，表达合宜的责任；“应当感谢”既保留义务意味，也符合中文感恩陈述的语气。
- source_word: πάντοτε περὶ ὑμῶν
  choice: 常常为你们
  rationale: πάντοτε表示持续、经常；在感恩套语中，περί加人自然译作“为你们”。
- source_word: ἀδελφοί
  choice: 弟兄们
  rationale: 保留希腊文阳性复数称呼；其在信徒群体中可具有包含全体成员的用法，另以脚注说明。
- source_word: καθὼς ἄξιόν ἐστιν
  choice: 这是理所当然的
  rationale: 表达这种感谢是合宜、应该的；此译自然庄重，不把ἄξιον误解为个人配得。
- source_word: ὑπεραυξάνει ἡ πίστις ὑμῶν
  choice: 你们的信心格外增长
  rationale: ὑπεραυξάνει带强化意味，“格外增长”兼顾其超过一般增长的语气与现代中文表达。
- source_word: πλεονάζει ἡ ἀγάπη
  choice: 相爱的心也日益增多
  rationale: πλεονάζει表示增多、越发充足；结合εἰς ἀλλήλους译为“彼此相爱的心”，符合自然中文。
- source_word: ἑνὸς ἑκάστου πάντων ὑμῶν
  choice: 你们每一个人
  rationale: 希腊文以略显冗叠的结构强调无一例外；“每一个人”在中文中自然地保留逐一涵盖的重点。
theological_decisions:
- issue: πίστις的含义
  choice: 信心
  alternative: 忠信；信实
  rationale: 这里最自然是指帖撒罗尼迦信徒不断增长的信；该词也可能包含忠信的语义范围，因此以脚注保留。
- issue: ἀδελφοί是否包含女性信徒
  choice: 弟兄们
  alternative: 弟兄姊妹们
  rationale: 正文保留原文阳性复数形式，同时脚注说明该称呼在此可涵盖整个信徒群体，避免在正文中消除原文形式与代表性用法之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“格外增长”保留强化动词的力度；“日益增多”与之形成自然对应。称呼置于句首，以符合中文呼语习惯。
