reference: 2 Thessalonians 1:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὅταν ἔλθῃ ἐνδοξασθῆναι ἐν τοῖς ἁγίοις αὐτοῦ καὶ θαυμασθῆναι ἐν πᾶσιν τοῖς πιστεύσασιν, ὅτι ἐπιστεύθη τὸ μαρτύριον ἡμῶν ἐφ’ ὑμᾶς, ἐν τῇ ἡμέρᾳ ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/010.yaml
  text: on that day when he comes to be glorified among his saints and to be marveled at among all who have believed[b][a], because our testimony to you was believed.
translation:
  language: zh_hans
  text: 到那日，他来临，要在他的圣徒中得荣耀[a]，又要在所有已经相信的人中受人惊叹，因为你们已经相信了我们向你们所作的见证。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在他的圣徒中”也可译作“在他的圣徒身上”。希腊文介词既可表示他在圣洁子民当中得荣耀，也可表示他的荣耀在他们身上彰显。
    reason: lexical_alternative
  - marker: b
    text: 希腊文把“到那日”放在本句末尾；也可按原文次序理解为：“他来临，要在他的圣徒中得荣耀，又要在所有已经相信的人中受人惊叹——因为我们向你们所作的见证得到了相信——就在那日。”
    reason: word_order_alternative
lexical_decisions:
- source_word: ὅταν ἔλθῃ
  choice: 他来临
  rationale: ὅταν与不定过去时虚拟语气在这里指向一个确定的将来事件。“来临”自然庄重，也符合末世语境。
- source_word: ἐνδοξασθῆναι
  choice: 得荣耀
  rationale: 保留被动含义及神圣荣耀的语义，并表达他来临的目的或结果。
- source_word: ἐν τοῖς ἁγίοις αὐτοῦ
  choice: 在他的圣徒中
  rationale: “圣徒”符合保罗书信中ἅγιοι指属神之民的通常用法；“在……中”保留ἐν既可表示“在……当中”，又可能表示荣耀彰显“在……身上”的张力。
- source_word: θαυμασθῆναι
  choice: 受人惊叹
  rationale: 保留被动结构以及带有敬畏、赞叹的强烈意味，避免弱化为一般的“受欣赏”。
- source_word: ἐν πᾶσιν τοῖς πιστεύσασιν
  choice: 在所有已经相信的人中
  rationale: 保留ἐν的空间或群体关系，也保留分词πιστεύσασιν的动词性和先行相信的意味，而不简化为名词“信徒”。
- source_word: ὅτι
  choice: 因为
  rationale: 这里最自然地说明帖撒罗尼迦人为何包括在相信者之中，因而采用原因义。
- source_word: ἐπιστεύθη
  choice: 得到了相信
  rationale: 尽量保留希腊文被动形式，即“见证”是被相信的对象，而不改写为主动句。
- source_word: τὸ μαρτύριον ἡμῶν
  choice: 我们……所作的见证
  rationale: 指使徒向收信人传达的见证或宣告；“见证”保留其作证性质。
- source_word: ἐφ’ ὑμᾶς
  choice: 向你们
  rationale: 在传达见证的语境中，表示见证所指向、所传给的对象。
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: 到那日
  rationale: 采用现代汉语中自然且庄重的末世时间表达，并前置以使句子清晰流畅。
theological_decisions:
- issue: 末世语境中“他的圣徒”的所指及ἐν的含义
  choice: 译作“在他的圣徒中”，主要理解为基督在属他的圣洁子民当中得荣耀。
  alternative: 译作“在他的圣徒身上”，强调他的荣耀在他们身上彰显；“圣者”也可能容许更宽泛的天上群体所指。
  rationale: 紧接着的“所有已经相信的人”支持这里主要指信徒。不过，ἐν本身容许“当中”和“身上”的细微差别，因此正文不把这种神学张力完全消除，并以脚注提示。
- issue: πιστεύσασιν与ἐπιστεύθη所表达的相信
  choice: 按通常意义译为人相信使徒的见证，并在两处保留“相信”这一词族联系。
  alternative: 可译作“信靠”以强调个人倚靠，或将分词译为一般名词“信徒”。
  rationale: 原文此处重在使徒见证被接受为真，并不要求加入更具体的宗派性解释；保留“相信”最直接。
- issue: 两个被动不定式所表达的目的或结果
  choice: 译作“要……得荣耀，又要……受人惊叹”，同时容纳来临的目的与随之发生的结果。
  alternative: 可明确译成“为要……”，较强地限定为目的。
  rationale: 希腊文不定式与“来临”相连，可含目的或结果色彩；正文避免过度限定二者的逻辑关系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“来临”“得荣耀”“圣徒”延续新约语境中的正式表达；“得到了相信”略带正式色彩，是为了保留原文以“见证”为主语的被动结构。
