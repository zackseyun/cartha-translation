  text: οἵτινες δίκην τίσουσιν ὄλεθρον αἰώνιον ἀπὸ προσώπου τοῦ κυρίου καὶ ἀπὸ τῆς δόξης τῆς ἰσχύος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/009.yaml
  text: These will pay the penalty of eternal destruction[a], away from the presence of the Lord and from the glory of his might,
translation:
  language: zh_hans
  text: 这些人将受刑罚，就是永远的毁灭[a]：离开主的面前，也离开他大能的荣光。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或可译：“就是从主的面前和他大能的荣光而来的永远毁灭。”希腊语介词既可表示分离（“离开”），也可表示来源（“从……而来”）。
    reason: alternative_reading
lexical_decisions:
- source_word: οἵτινες
  choice: 这些人
  rationale: 回指上一节所说不认识神、不听从福音的人；“这些人”在现代汉语中自然地承接前文，又不额外强化定性意味。
- source_word: δίκην τίσουσιν
  choice: 将受刑罚
  rationale: 这一固定搭配表示承受司法性的惩罚。“受刑罚”简洁自然，并保留审判语境；避免按字面译成不自然的“支付刑罚”。
- source_word: ὄλεθρον αἰώνιον
  choice: 永远的毁灭
  rationale: “毁灭”保留ὄλεθρος所表达的严重败亡，“永远的”在末世审判语境中自然表达αἰώνιος；不进一步断定毁灭的具体性质，以免把某种宗派性结论写入经文。
- source_word: ἀπὸ προσώπου τοῦ κυρίου
  choice: 离开主的面
  rationale: 正文采用ἀπό表示分离、隔绝的理解。“主的面”保留πρόσωπον的圣经意象，同时在此语境中可自然表达主的临在；ἀπό也可能表示来源，故以脚注保留。
- source_word: καὶ ἀπὸ τῆς δόξης τῆς ἰσχύος αὐτοῦ
  choice: 和他大能的荣光
  rationale: “荣光”对应δόξα，“大能”对应ἰσχύς；属格理解为彰显或属于他大能的荣光。与前一ἀπό并列，正文按分离义译出。
theological_decisions:
- issue: ἀπό在末后审判语境中的含义
  choice: 正文按分离、隔绝理解：“离开主的面……”
  alternative: 按来源理解：“这毁灭从主的面和他大能的荣光而来。”
  rationale: ἀπό既可表示离开、隔绝，也可表示来源。分离义与司法刑罚的语境衔接自然，但来源义在语法上也成立并具有解释意义，因此不将歧义静默消除，而在脚注中保留。
- issue: “永远的毁灭”的具体教义含义
  choice: 直译为“永远的毁灭”，不进一步界定其方式
  alternative: 将其明确解释为彻底消灭，或明确解释为永远有意识地受刑
  rationale: 希腊语短语说明刑罚是永远的毁灭，但本节本身没有完整界定末后刑罚的具体形态；译文不导入经文本身未明确说明的宗派结论。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“受刑罚，就是……”清楚呈现δίκην与同位说明其内容的ὄλεθρον之间的关系；保留“主的面”这一圣经意象，并用脚注呈现关键介词的真实歧义。
