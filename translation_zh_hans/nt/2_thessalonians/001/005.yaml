source:
  edition: SBLGNT
  text: ἔνδειγμα τῆς δικαίας κρίσεως τοῦ θεοῦ, εἰς τὸ καταξιωθῆναι ὑμᾶς τῆς βασιλείας τοῦ θεοῦ, ὑπὲρ ἧς καὶ πάσχετε,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/005.yaml
  text: This is evidence of the righteous judgment of God[a], so that you may be counted worthy of the kingdom of God, for which you are also suffering[c][b],
translation:
  language: zh_hans
  text: 这是神公义审判的证据[a]，为要叫你们被算为配得神的国[b]；你们也正是为这国[c]受苦。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “证据”也可译作“明证”或“表征”。
    reason: lexical_alternative
  - marker: b
    text: “为要叫你们被算为配得”也可译作“以致你们被算为配得”。原文结构既可表示目的，也可表示结果。
    reason: alternative_reading
  - marker: c
    text: “为这国”也可译作“为了这国”或“为这国的缘故”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔνδειγμα
  choice: 明证
  rationale: 该词指能够表明或证实某一事实的事物。“明证”在现代汉语中简洁庄重，保留其指示和论证力量，又不必理解为逻辑上不可推翻的证明。原文是承接上一节的无系词片语，汉语补出“这是”。
- source_word: δικαίας κρίσεως τοῦ θεοῦ
  choice: 神公义的审判
  rationale: 直接保留“审判”的司法含义和“公义”的道德性质；该属格结构自然译为“神公义的审判”。
- source_word: εἰς τὸ καταξιωθῆναι ὑμᾶς
  choice: 为要使你们被算为配得
  rationale: καταξιόω的被动式表示被判定、被视为配得，并非使人本质上变得配得。“为要”在正文中呈现目的走向，脚注同时保留该结构也可表达结果的可能性。
- source_word: τῆς βασιλείας τοῦ θεοῦ
  choice: 神的国
  rationale: 采用现代中文圣经语境中自然、清楚且广为理解的表达，并保留“国”所含的统治与领域意涵。
- source_word: ὑπὲρ ἧς
  choice: 为这国
  rationale: ὑπέρ加属格可表示“为了、为……的缘故”或“代表”。关系代词所指为“神的国”，译为“为这国”简洁地连接受苦与神的国。
- source_word: καὶ πάσχετε
  choice: 也正是……受苦
  rationale: “受苦”保留πάσχω的基本含义；“正”体现现在时所指的持续现实，“也”保留καί与上文患难的衔接作用。
theological_decisions:
- issue: 受苦与配得神国之间的关系
  choice: 译作“为要使你们被算为配得”，把配得呈现为神审判中的认定，同时保留受苦与这一目的或结果的紧密联系。
  alternative: 把经文理解为他们借受苦赚取或成就进入神国的资格。
  rationale: 被动式καταξιωθῆναι本身是“被算为／被认为配得”，并不明确表示受苦具有赚取资格的功效。译文不把原文扩展成报酬或功德论，也不削弱受苦、神公义的审判与被算为配得之间的张力。
- issue: εἰς τό加不定式表示目的还是结果
  choice: 正文采用目的表达“为要使”，并以脚注注明也可理解为结果。
  alternative: 译作“结果使你们被算为配得”或“以致你们被算为配得”。
  rationale: 该希腊结构在此可表达目的或结果，语境不能完全排除任何一面，因此正文选择顺畅的目的表达而不在脚注中消除歧义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“明证”“公义的审判”“神的国”保留经文的司法和神学语域；分号使末句与前面的目的结构层次清楚。所有脚注标记均置于正文相应词组之后。
