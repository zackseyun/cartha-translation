  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὥστε ⸂αὐτοὺς ἡμᾶς⸃ ἐν ὑμῖν ⸀ἐγκαυχᾶσθαι ἐν ταῖς ἐκκλησίαις τοῦ θεοῦ ὑπὲρ τῆς ὑπομονῆς ὑμῶν καὶ πίστεως ἐν πᾶσιν τοῖς διωγμοῖς ὑμῶν καὶ ταῖς θλίψεσιν αἷς ἀνέχεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/004.yaml
  text: so that we ourselves boast about you among the churches of God because of your perseverance and faith in all your persecutions and afflictions that you are enduring,[a]
translation:
  language: zh_hans
  text: 以致我们自己在上帝的众教会中以你们为荣，因为你们在正在忍受的一切逼迫和患难中所显出的忍耐和信心[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“忠信”。这里的“信心”也可侧重在苦难中始终忠于所信。
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: 以致
  rationale: 承接上一节并表达结果；“以致”自然保留希腊语的结果意味。
- source_word: αὐτοὺς ἡμᾶς
  choice: 我们自己也
  rationale: 保留反身代词所表达的强调；“也”使汉语衔接自然，但不另加新的神学含义。
- source_word: ἐν ὑμῖν ἐγκαυχᾶσθαι
  choice: 以你们为荣
  rationale: 这里的介词短语指夸耀的对象或根据；“以你们为荣”比直译“在你们里面夸口”更符合现代汉语，同时保留正面的强烈语气。
- source_word: ἐν ταῖς ἐκκλησίαις τοῦ θεοῦ
  choice: 在上帝的众教会中
  rationale: 保留复数“教会”和其归属于上帝的表达；“众教会”简洁而庄重。
- source_word: ὑπὲρ
  choice: 因为
  rationale: 在此引出保罗以他们为荣的原因，采用因果表达最清楚。
- source_word: ὑπομονῆς
  choice: 忍耐
  rationale: 指在压力和苦难下坚定承受；“忍耐”是现代中文中清楚、凝练且适合本语境的表达。
- source_word: πίστεως
  choice: 信心
  rationale: 保留该词通常所指的信靠或信仰；苦难语境中也可能侧重忠信，故以脚注保留这一含义。
- source_word: διωγμοῖς
  choice: 逼迫
  rationale: 准确表达因信仰归属而遭遇的敌对压迫，是新约语境中自然的中文用词。
- source_word: θλίψεσιν
  choice: 患难
  rationale: 表达压迫、困苦和灾难性的处境，并与专指敌对行为的“逼迫”有所区别。
- source_word: αἷς ἀνέχεσθε
  choice: 所遭受的
  rationale: 关系代词的先行词包括“逼迫和患难”；ἀνέχεσθε表示持续承受。中文用“所遭受的”前置修饰，避免句末重复“忍受”，并自然传达当前持续经历。
theological_decisions:
- issue: 苦难语境中 πίστις 可指“信心”或“忠信”
  choice: 正文采用“信心”
  alternative: 忠信
  rationale: πίστις在此既可指持续信靠，也可指受逼迫时坚定忠于所信。正文采用常见且不预先限定为行为品质的“信心”，脚注注明“忠信”，以保留原文的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“以你们为荣”自然传达夸耀语义；“上帝的众教会”保留原文复数和归属关系。将持续承受的关系从句前置为“所遭受的一切逼迫和患难”，使中文流畅，同时维持原文所描述的持续苦难处境。
