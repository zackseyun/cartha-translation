  yaml_path: translation/nt/2_thessalonians/001/006.yaml
  text: since it is just before God to repay affliction to those who afflict you[a]
translation:
  language: zh_hans
  text: 既然在神看来，以患难报应那些使你们受患难的人是公义的[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“如果在神看来，以患难报应那些使你们受患难的人确是公义的。”
    reason: 保留 εἴπερ 的条件句形式，以及 δίκαιον 所表达的公义判断。
lexical_decisions:
- source_word: εἴπερ
  choice: 既然
  rationale: 此处引出保罗视为真实的前提，具有修辞性的条件意味；“既然”在现代汉语中自然表达这种推论关系，同时以脚注保留直译为条件句的可能。
- source_word: δίκαιον
  choice: 是公义的
  rationale: 这里指神施行报偿在道德与审判意义上合乎正义；“公义”既庄重，也符合本段神圣审判的语境。
- source_word: παρὰ θεῷ
  choice: 在神看来
  rationale: 该短语表示按神的判断或在神那里所认定的标准；“在神看来”比生硬的“在神面前”更清楚地传达评价关系。
- source_word: ἀνταποδοῦναι
  choice: 报应
  rationale: 该动词表示按对方所行的予以回报；在此惩罚性语境中，“报应”准确、简洁，并保留公正回报的意味。
- source_word: τοῖς θλίβουσιν ὑμᾶς
  choice: 那些使你们受患难的人
  rationale: 用“使……受患难”表达持续给人压力、苦害或迫害的分词，并与后面的同词根名词形成清楚呼应。
- source_word: θλῖψιν
  choice: 患难
  rationale: “患难”能表达压迫所带来的痛苦，也与“使你们受患难”形成原文刻意的词汇重复。
theological_decisions:
- issue: 神报偿的性质与时间
  choice: 译文只陈明神以患难报应迫害者是公义的，不在本分句中限定其发生的时间或具体方式。
  alternative: 将此患难明确限定为末世终审，或同时解释为今世历史中的审判与末日审判。
  rationale: 希腊文本肯定神报偿的公义，却未在本分句内完整说明其时间和方式；译文因此保留这一开放性，不加入特定教义体系的限定。
- issue: εἴπερ 的逻辑力度
  choice: 正文采用“既然”，表达说话者认定前提成立。
  alternative: 译作“如果……确是”，更形式化地保留条件句外形。
  rationale: 上下文中保罗并非对神是否公义表示怀疑，而是以此为已认可的根据；脚注仍保留希腊语条件形式可能带来的修辞张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“以患难报应……使你们受患难的人”有意保留 θλίβω／θλῖψις 的同词根呼应。句末用逗号，表明本节在原文中与上下文构成长句，意思将在后文继续。
