id: 2TH.1.8
reference: 2 Thessalonians 1:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐν ⸂φλογὶ πυρός⸃, διδόντος ἐκδίκησιν τοῖς μὴ εἰδόσι θεὸν καὶ τοῖς μὴ ὑπακούουσιν τῷ εὐαγγελίῳ τοῦ κυρίου ἡμῶν Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/008.yaml
  text: in flaming fire[a], inflicting vengeance on those who do not know God and on those who do not obey the gospel of our Lord Jesus[b],
translation:
  language: zh_hans
  text: 在烈火中[a]，向那些不认识上帝和不顺从我们主耶稣福音的人施行报应[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在火焰中。”
    reason: 原文 φλογὶ πυρός 可较字面地表达为“火的焰／火焰”；正文“烈火”更符合自然汉语并保留强化意象。
  - marker: b
    text: 或译：“施以惩罚。”
    reason: διδόντος ἐκδίκησιν 是实施司法性报应的惯用表达，可按语境译作“施以惩罚”。
lexical_decisions:
- source_word: ἐν φλογὶ πυρός
  choice: 在烈火中
  rationale: 以自然、凝练的现代汉语表达“火的焰／燃烧的火”这一强化意象，并保留介词结构与前文“主耶稣显现”的衔接。
- source_word: διδόντος ἐκδίκησιν
  choice: 施行报应
  rationale: διδόντος 字面为“给予”，与 ἐκδίκησιν 连用时指实施司法性的报应；“施行报应”既符合汉语习惯，也保留主动执行审判的意味。
- source_word: τοῖς μὴ εἰδόσι θεὸν
  choice: 那些不认识上帝的人
  rationale: οἶδα 的完成时形式在此具有现在时意义；“不认识上帝”直接保留关系性与认知性的开放含义，不扩写为“拒绝承认”。
- source_word: τοῖς μὴ ὑπακούουσιν
  choice: 那些不顺从……的人
  rationale: ὑπακούω 可指听从、服从；“不顺从”保留其行为与回应层面的含义，又不额外加入“故意拒绝”的主观动机。
- source_word: τῷ εὐαγγελίῳ
  choice: 福音
  rationale: “福音”是保罗书信中通行且准确的术语，现代普通读者亦能理解。
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ
  choice: 我们主耶稣
  rationale: 保留 κύριος 的称号“主”以及第一人称复数关系词“我们”，并采用自然的现代汉语次序。
theological_decisions:
- issue: ἐκδίκησις 在神圣审判语境中的性质
  choice: 报应
  alternative: 惩罚；伸冤；复仇
  rationale: 此处表示主施行的司法性裁断。“报应”保留原文严厉的审判意味，同时不把它误解成出于罪恶情绪的私人报复；脚注列出较偏司法语气的译法。
- issue: 两个否定分句所指群体之间的关系
  choice: 用“和”并列，不判定为同一群体还是两个彼此有别的群体
  alternative: 把后句解释成前句的同位说明
  rationale: 原文以 καί 并列两组带冠词的分词结构；直译式并列可保留二者关系上的真实含混。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。经文是承接上一节的句子片段，正文保留其延续结构；“施行报应”避免口语化，也不削弱原文审判语气。所有脚注标记均置于所说明的词组之后。
