id: 2TH.1.11
reference: 2 Thessalonians 1:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἰς ὃ καὶ προσευχόμεθα πάντοτε περὶ ὑμῶν, ἵνα ὑμᾶς ἀξιώσῃ τῆς κλήσεως ὁ θεὸς ἡμῶν καὶ πληρώσῃ πᾶσαν εὐδοκίαν ἀγαθωσύνης καὶ ἔργον πίστεως ἐν δυνάμει,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/011.yaml
  text: To this end also we always pray for you[a], that our God may count you worthy of the calling and may fulfill every good resolve and work of faith with power[c][b],
translation:
  language: zh_hans
  text: 为此，我们也常常为你们祷告，愿我们的上帝认定你们配得[a]这呼召，并以大能成全一切良善的心志[b]和信心的工作[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使你们配得这呼召”。希腊语动词既可指“看为、认定为配得”，也可指“使之配得”。
    reason: alternative_reading
  - marker: b
    text: “一切良善的心志”也可译作“一切向善的心愿”或“一切行善的决心”。
    reason: lexical_alternative
  - marker: c
    text: “信心的工作”也可理解为“信心所产生的工作”；这里的“信心”在语境中也可能有“忠信”的含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ὃ
  choice: 为此
  rationale: 承接上文并表达目的或指向，现代汉语中简洁自然。
- source_word: καὶ
  choice: 也
  rationale: 保留其增添和强调作用，与开头的承接语自然衔接。
- source_word: προσευχόμεθα πάντοτε περὶ ὑμῶν
  choice: 我们也常常为你们祷告
  rationale: 表达现在时所指的持续、惯常行动；“为你们祷告”自然对应 περὶ ὑμῶν。
- source_word: ἵνα
  choice: 愿
  rationale: 在祷告内容中以“愿”引出所求之事，比直译为“使得”更符合现代汉语，同时保留目的和祈求色彩。
- source_word: ἀξιώσῃ
  choice: 看你们配得
  rationale: 采用“认定、视为配得”的义项，避免在正文中直接限定为“使人成为配得”；另一义项收入脚注。
- source_word: τῆς κλήσεως
  choice: 这呼召
  rationale: 原文没有明说“他的”或“你们的”；“这”体现定冠词所指向的已知呼召，而不补入所有关系。
- source_word: ὁ θεὸς ἡμῶν
  choice: 我们的上帝
  rationale: 保留原文明确的第一人称复数所属表达。
- source_word: πληρώσῃ
  choice: 成全
  rationale: 兼有使之实现、完成之意，可自然支配后面的“心志”和“工作”。
- source_word: πᾶσαν εὐδοκίαν ἀγαθωσύνης
  choice: 一切良善的心志
  rationale: εὐδοκία 可指意愿、决意或美意；“心志”较“喜悦”更切合此处与行动并列的语境，同时保留良善这一性质。
- source_word: ἔργον πίστεως
  choice: 信心的工作
  rationale: 保留原文紧凑的属格结构，不在正文中完全限定为“信心所产生的工作”或“忠信的工作”。
- source_word: ἐν δυνάμει
  choice: 以大能
  rationale: 表达上帝成全这些心志与工作的方式或能力；“大能”符合庄重而通俗的圣经语体。
theological_decisions:
- issue: ἀξιώσῃ 与上帝呼召的关系
  choice: 看你们配得这呼召
  alternative: 使你们配得这呼召
  rationale: 希腊语动词既可表示认定为配得，也可表示使之配得。正文采用评定意义，脚注保留形成意义，不把经文的神学张力单方面消解。
- issue: ἔργον πίστεως 中属格 πίστεως 的关系
  choice: 信心的工作
  alternative: 信心所产生的工作；忠信的工作
  rationale: 原文可以指源于信心的工作，也可能强调忠信所表现的工作。正文保留较开放的结构，脚注说明主要可能性。
- issue: πᾶσαν εὐδοκίαν ἀγαθωσύνης 的语义关系
  choice: 一切良善的心志
  alternative: 一切向善的心愿；一切行善的决心
  rationale: 属格可描述以良善为性质、内容或目标的意愿。正文不把它严格限定为其中一种关系，脚注保留其他自然理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“为此”“愿……”“以大能成全”保持书信祷告语气；避免补入原文没有明说的“他的呼召”或“你们的呼召”。脚注标记均在正文中按 [a]、[b]、[c] 出现。
