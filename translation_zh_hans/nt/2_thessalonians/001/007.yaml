revisions:
- from: 也必使你们这些正受患难的人和我们一同得安舒；那时，主耶稣要从天上显现，同他的权能之天使[a]一起来临。
  to: 也要使你们这些正受患难的人和我们一同得安舒，在主耶稣同他大能的天使从天上显现的时候。
  rationale: 改用现代汉语自然的“大能的天使”，并以脚注保留原文属格结构的开放性。将“从天上显现”与“同……天使”连为同一修饰主耶稣显现的结构，删除原文未明说的“天使一起来临”。保留本节承接上文的“也要使”及其时间性不定式结构。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T03:56:08Z'
review_pass:
  verdict: revise
  source_fidelity: 译文准确传达了受患难者与保罗一同获得压力解除，以及这一应许与主耶稣从天上显现有关。惟“同他的权能之天使一起来临”把原文修饰“主耶稣显现”的介词短语另行扩展为“天使一起来临”，且“权能之天使”不合现代汉语惯用表达。
  naturalness: “正受患难的人”“和我们一同得安舒”庄重、清楚。“权能之天使”属仿古且生硬的属格直译；将时间短语改为“在……显现的时候”可更清晰地表达其修饰“得安舒”的关系。
  terminology: “主耶稣”“天上”“显现”均合适。“大能的天使”是对“天使（属）他的能力”的自然性质性译法；以脚注保留较贴近原文的“他权能的天使／他的能力的天使”，不将属格关系过度定论。
  issues:
  - severity: medium
    issue: “他的权能之天使”不符合现代标准汉语的自然搭配。
    rationale: “之”式属格在此显得生硬，且“权能之天使”易造成意义阻滞，不能有效服务公开诵读。
  - severity: medium
    issue: “同……一起来临”不必要地补出了天使与主一同“来临”的独立表述。
    rationale: 原文为主耶稣从天上之显现，伴随其能力的天使；应使“同天使”直接依附于主的显现，避免扩展句法关系。
  revised_text: 也要使你们这些正受患难的人和我们一同得安舒，在主耶稣同他大能的天使从天上显现的时候。
  revised_footnotes:
  - marker: a
    text: 或译：“同他权能的天使”或“同他的能力的天使”。
    reason: 原文“天使（属）他的能力”是压缩的属格结构，可按性质理解为“他大能的天使”，也可理解为与他的能力相关的天使。
  revision_rationale: 改用现代汉语自然的“大能的天使”，并以脚注保留原文属格结构的开放性。将“从天上显现”与“同……天使”连为同一修饰主耶稣显现的结构，删除原文未明说的“天使一起来临”。保留本节承接上文的“也要使”及其时间性不定式结构。
