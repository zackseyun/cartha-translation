  text: καὶ ὑμῖν τοῖς θλιβομένοις ἄνεσιν μεθ’ ἡμῶν ἐν τῇ ἀποκαλύψει τοῦ κυρίου Ἰησοῦ ἀπ’ οὐρανοῦ μετ’ ἀγγέλων δυνάμεως αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/007.yaml
  text: and to you who are being afflicted[a], relief with us at the revelation of the Lord Jesus from heaven with his mighty angels.
translation:
  language: zh_hans
  text: 也要使你们这些正受患难的人和我们一同得安舒，在主耶稣同他大能的天使从天上显现的时候。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θλιβομένοις
  choice: 正受患难的人
  rationale: 现在时被动分词表示他们目前正在承受压迫或苦难；“正受患难”既保留持续与被动意味，也与上下文的患难形成呼应。
- source_word: ἄνεσιν
  choice: 得安舒
  rationale: 该词表示压力解除、宽解或歇息；“安舒”在庄重而易懂的现代汉语中能表达从患难中获得舒缓，不只指内心平静。
- source_word: μεθ’ ἡμῶν
  choice: 和我们一同
  rationale: 保留关联意义，表明保罗及其同工与受信者共同承受所应许的安舒。
- source_word: ἐν τῇ ἀποκαλύψει
  choice: 那时……显现
  rationale: ἐν与事件名词在此具有时间作用；汉语用“那时……显现”自然表达安舒发生于主耶稣被揭示之时。
- source_word: ἀποκαλύψει
  choice: 显现
  rationale: ἀποκάλυψις本义为揭示、揭开；在此末世语境中，“显现”清楚自然，同时保留主由隐藏转为公开可见的含义。
- source_word: κυρίου
  choice: 主
  rationale: 保留κύριος作为尊称与身份称号的常见新约用法。
- source_word: ἀπ’ οὐρανοῦ
  choice: 从天上
  rationale: 准确表达ἀπό所标示的来源，并符合汉语中的末世语境表达。
- source_word: μετ’ ἀγγέλων δυνάμεως αὐτοῦ
  choice: 同他的权能之天使一起来临
  rationale: “权能之天使”保留希腊文压缩的属格结构及其可能歧义，不将其完全固定解释为“有大能的天使”；补出“一起来临”使介词短语在汉语中归属清楚。
theological_decisions:
- issue: ἀγγέλων δυνάμεως αὐτοῦ的属格关系
  choice: 他的权能之天使
  alternative: 他大能的天使
  rationale: 原文既可理解为与他的权能相关或彰显其权能的天使，也可按性质理解为大能的天使。正文保留较透明的属格表达，脚注给出更符合汉语习惯的性质性理解。
- issue: ἐν τῇ ἀποκαλύψει的时间作用与名词形式
  choice: 那时，主耶稣要从天上显现
  alternative: 在主耶稣从天上显现的时候
  rationale: 两者都表达应许的安舒与主显现同时发生；正文采用汉语较自然的分句形式，而不改变其末世时间关联。
- issue: 本节与前后句的句法关系
  choice: 用分号承接“得安舒”，再说明发生的时刻
  alternative: 将全节处理为一个不完整的名词性片段
  rationale: 希腊文本节承接上一节“报应”的平行结构，本身不是独立完整句。译文以“也必使”补足承接关系，使单节可读，同时不改变其与上文相连的意义。
translation_notes:
  register: 采用现代、庄重且适合公开诵读的简体中文。“安舒”较“安息”更突出患难压力的解除，也避免不必要的死亡联想；“显现”比音译式或过度术语化的表达更易为普通读者理解。正文脚注标记[a]已置于相关短语之后。
