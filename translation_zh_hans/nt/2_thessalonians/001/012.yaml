id: 2TH.1.12
reference: 2 Thessalonians 1:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὅπως ἐνδοξασθῇ τὸ ὄνομα τοῦ κυρίου ἡμῶν Ἰησοῦ ἐν ὑμῖν, καὶ ὑμεῖς ἐν αὐτῷ, κατὰ τὴν χάριν τοῦ θεοῦ ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/012.yaml
  text: so that the name of our Lord Jesus may be glorified in you[a], and you in him[c][b], according to the grace of our God and the Lord Jesus the Messiah.
translation:
  language: zh_hans
  text: 为要使我们主耶稣的名在你们身上[a]得荣耀，也使你们在他里面得荣耀，照着我们的上帝和主耶稣弥赛亚[b]的恩典。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在你们身上”也可译作“在你们中间”。原文介词在这里可以带有这两种意味。
    reason: lexical_alternative
  - marker: b
    text: “弥赛亚”也可译作“基督”；原文称号是 Χριστός。
    reason: alternative_reading
  - marker: c
    text: 末句原文结构紧密，既可理解为以“我们的上帝和主耶稣弥赛亚”指同一位，也可理解为分别提到“我们的上帝”和“主耶稣弥赛亚”。正文保留原文的紧密措辞，不强行裁定。
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπως
  choice: 为要使
  rationale: 引出前文祷告所盼望的目的或结果；此译自然保留目的意味。
- source_word: ἐνδοξασθῇ
  choice: 得荣耀
  rationale: 保留被动语态以及 δοξ- 词族的神学分量，也符合现代汉语圣经语体。
- source_word: τὸ ὄνομα
  choice: 名
  rationale: 按原文保留“名”的表达，让它所包含的身份、声誉和启示等转喻意义继续开放。
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ
  choice: 我们主耶稣的
  rationale: 以自然汉语表达所属关系，同时保留“主”这一称号。
- source_word: ἐν ὑμῖν
  choice: 在你们身上
  rationale: 既可表达主的名在信徒身上得荣耀，也不完全排除群体中的含义；另义“在你们中间”列入脚注。
- source_word: καὶ ὑμεῖς ἐν αὐτῷ
  choice: 你们也在他里面得荣耀
  rationale: 依据前后平行结构补出汉语所需的“得荣耀”；αὐτῷ 最自然地指主耶稣，并保留保罗书信中“在他里面”的联合语言。
- source_word: κατὰ τὴν χάριν
  choice: 这是照着……的恩典
  rationale: κατά 加宾格表示准则或依据；“照着”比单译“靠着”更少限定为工具意义。
- source_word: χάριν
  choice: 恩典
  rationale: 这是保罗语境中 χάρις 的通行而贴切的译法。
- source_word: τοῦ θεοῦ ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ
  choice: 我们的上帝和主耶稣弥赛亚的
  rationale: 尽量依照希腊语紧密结构，不增添会强制区分两个所指对象的词；Χριστός 在此作为称号译为“弥赛亚”。
theological_decisions:
- issue: Χριστοῦ 的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处 Χριστός 仍具有称号功能；“弥赛亚”直接传达“受膏者”的头衔意义。
- issue: αὐτῷ 的所指
  choice: 他，指主耶稣
  alternative: 它，指“名”
  rationale: 代词为阳性，且“主在信徒身上得荣耀、信徒在他里面得荣耀”的对应结构更支持指向主耶稣；脚注承认形式上的另一可能。
- issue: 末尾所有格短语的所指关系
  choice: 保留“我们的上帝和主耶稣弥赛亚”的紧密表达
  alternative: 明确译成两个有区别的对象：“我们的上帝，以及主耶稣弥赛亚”
  rationale: 原文只有 θεοῦ 前有冠词，καί 将后面的 κυρίου Ἰησοῦ Χριστοῦ 紧密连接；语法可被理解为同一所指，也有人理解为两个有区别的所指。正文不强行裁定，脚注说明歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“在他里面”保留保罗书信特有的联合表达；“上帝”用于 θεός，“主”用于 κύριος。正文中的所有脚注标记均与脚注对应。
