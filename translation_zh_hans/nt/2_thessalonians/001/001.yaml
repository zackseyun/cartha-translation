base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/001.yaml
  text: 'Paul and Silvanus and Timothy[b][a], to the church of the Thessalonians in God our Father and the Lord Jesus the Messiah:'
translation:
  language: zh_hans
  text: 保罗、西尔瓦努斯和提摩太，写信给在我们的父上帝和主耶稣弥赛亚里的帖撒罗尼迦人的教会：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Παῦλος
  choice: 保罗
  rationale: 采用现代中文圣经传统中这一人名的标准译名。
- source_word: Σιλουανὸς
  choice: 西尔瓦努
  rationale: 按本节希腊文全称音译，不与《使徒行传》中常见的简称“西拉”强行协调。
- source_word: Τιμόθεος
  choice: 提摩太
  rationale: 采用现代中文圣经传统中这一人名的标准译名。
- source_word: ἐκκλησίᾳ
  choice: 教会
  rationale: 在保罗书信中指信徒群体；“教会”是现代中文最自然且通行的对应词。
- source_word: Θεσσαλονικέων
  choice: 帖撒罗尼迦人的
  rationale: 保留希腊文复数属格所指的人群，而不改写成地点表达“帖撒罗尼迦的”。
- source_word: ἐν
  choice: 在……里
  rationale: 保留介词的压缩性表达，不把它单一解释为归属、联合或根基。
- source_word: θεῷ πατρὶ ἡμῶν
  choice: 我们的父上帝
  rationale: 保留ἡμῶν“我们的”，并以自然中文表达上帝与父的同位关系。
- source_word: κυρίῳ
  choice: 主
  rationale: 作为耶稣的称号，译作“主”符合新约用法和中文惯例。
- source_word: Χριστῷ
  choice: 弥赛亚
  rationale: 在Ἰησοῦ Χριστῷ中保留Χριστός作为称号的意义，而非仅作为固化姓名音译为“基督”。
theological_decisions:
- issue: Ἰησοῦ Χριστῷ中Χριστός的表达
  choice: 耶稣弥赛亚
  alternative: 耶稣基督
  rationale: “弥赛亚”直接传达受膏者的称号意义；中文中“耶稣弥赛亚”无需增添原文没有的冠词，也能保持庄重自然。
- issue: ἐν θεῷ πατρὶ ἡμῶν καὶ κυρίῳ Ἰησοῦ Χριστῷ所表达的关系
  choice: 在我们的父上帝和主耶稣弥赛亚里
  alternative: 属于我们的父上帝和主耶稣弥赛亚
  rationale: 直译“在……里”保留原文可能涉及领域、联合或根基的神学张力，避免过度解释。
translation_notes:
  register: 采用现代、庄重而易懂的书信开头语体。保留原文并列的三位写信人及句末冒号；不用文言式“致”，而用“写信给”明确中文句法。
