  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ ⸀πατρὸς καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/002.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a].
translation:
  language: zh_hans
  text: 愿恩典与平安从父神和主耶稣——弥赛亚赐给你们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“耶稣基督”。希腊语Χριστός意为“弥赛亚”（受膏者），也通常译作“基督”。
    reason: 说明称号的另一种传统译法，并保留其词义。
lexical_decisions:
- source_word: χάρις
  choice: 恩典
  rationale: 保留保罗书信问安语中既有祝福意味、又有神学分量的用词；“恩典”是现代中文中自然且稳定的对应表达。
- source_word: ὑμῖν
  choice: 愿你们有
  rationale: 希腊语与格在问安祝福语中表示祝福临到收信人；中文用“愿你们有”自然呈现其祝愿语气。
- source_word: εἰρήνη
  choice: 平安
  rationale: 准确表达和平、安宁及整全福祉的含义，也保留其与犹太问安传统的呼应。
- source_word: ἀπὸ
  choice: 从……而来的
  rationale: 明确表示恩典与平安的来源，同时符合现代汉语句法。
- source_word: θεοῦ πατρὸς
  choice: 父神
  rationale: 原文没有明确的“我们的”；“父神”既是自然庄重的中文，也避免把未明说的物主代词补入正文。
- source_word: κυρίου
  choice: 主
  rationale: 保留 κύριος 在此处作为尊称和身份称号的力量。
- source_word: Ἰησοῦ Χριστοῦ
  choice: 耶稣弥赛亚
  rationale: 把 Χριστός 作为称号按其含义译为“弥赛亚”，同时以脚注提供传统译法“基督”。
theological_decisions:
- issue: θεοῦ πατρὸς 是否补出“我们的”
  choice: 父神
  alternative: 我们的父神
  rationale: SBLGNT 正文在此没有 ἡμῶν。中文“父神”无需补入物主代词即可自然成句，因此保留原文在这一点上的简洁，避免依据平行问安语擅自明确化。
- issue: Χριστός 译作称号还是沿用传统音意译
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处 Ἰησοῦ Χριστοῦ 虽已具有固定姓名组合的特征，但 Χριστός 仍承载“受膏者”这一称号意义；正文用“弥赛亚”呈现其含义，脚注保留读者熟悉的传统译法。
- issue: 恩典和平安的共同来源
  choice: 从父神和主耶稣弥赛亚而来
  alternative: 分别从父神与主耶稣而来
  rationale: 原文以一个 ἀπὸ 统领两个并列对象，使父神与主耶稣同为祝福的来源；译文保留这一共同支配关系，不作额外拆分。
translation_notes:
  register: 采用现代、庄重而易懂的祝福句式。“愿你们有……而来的恩典与平安”比逐词排列更符合汉语表达，同时保留恩典和平安的来源结构。正文不补“我们的”，以紧贴本节 SBLGNT 正文。
