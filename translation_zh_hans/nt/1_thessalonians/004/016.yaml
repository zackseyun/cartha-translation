  text: ὅτι αὐτὸς ὁ κύριος ἐν κελεύσματι, ἐν φωνῇ ἀρχαγγέλου καὶ ἐν σάλπιγγι θεοῦ, καταβήσεται ἀπ’ οὐρανοῦ, καὶ οἱ νεκροὶ ἐν Χριστῷ ἀναστήσονται πρῶτον,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/016.yaml
  text: For the Lord himself will descend from heaven with a command[a], with the voice of an archangel, and with the trumpet of God, and the dead in Messiah will rise first[b],
translation:
  language: zh_hans
  text: 因为主必亲自从天降临，伴着号令[a]、天使长的声音和上帝的号筒，死了的、在弥赛亚里的人必先复活[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“发出命令的呼喊”。希腊语κέλευσμα可指召唤、号令或发出的命令呼声。
    reason: lexical_alternative
  - marker: b
    text: 传统译法：“在基督里死了的人必先复活。”
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 本词在上下文中引出对前一句安慰之言的解释；“因为”自然体现其解释和依据的作用。
- source_word: αὐτὸς ὁ κύριος
  choice: 主必亲自
  rationale: αὐτός为强调用法；“亲自”保留对主本人的强调，同时符合现代汉语语序。
- source_word: ἐν κελεύσματι
  choice: 伴随着号令
  rationale: κέλευσμα可指命令、召唤或发出的命令呼声；“号令”简洁地兼顾命令与高声召唤的意味，其他可能译法列于脚注。
- source_word: ἐν φωνῇ ἀρχαγγέλου
  choice: 天使长的声音
  rationale: 直译φωνή与属格ἀρχαγγέλου；希腊文未明确指定某一位天使长，汉语无冠词，因而不额外加入“那位”或“一位”。
- source_word: ἐν σάλπιγγι θεοῦ
  choice: 上帝的号筒声
  rationale: σάλπιγξ指号筒；此处与“声音”“号令”并列，中文用“号筒声”自然表达伴随降临而发出的号声。
- source_word: καταβήσεται ἀπ’ οὐρανοῦ
  choice: 必从天降临
  rationale: καταβαίνω表示从高处下来；在主显现的语境中，“从天降临”庄重、自然，并保留方向含义。
- source_word: οἱ νεκροὶ ἐν Χριστῷ
  choice: 那在弥赛亚里死了的人
  rationale: οἱ νεκροί是实体化形容词，指死者；结合ἐν Χριστῷ，译作“在弥赛亚里死了的人”既自然，也保留“在……里”这一关系表达。
- source_word: ἀναστήσονται πρῶτον
  choice: 必先复活
  rationale: ἀναστήσονται在此指从死里起来，采用主动意味的“复活”，不改成希腊文形式未明说的被动；πρῶτον表明相对于下一节所说活着的人而言的先后次序。
theological_decisions:
- issue: ἐν Χριστῷ中Χριστός的译法
  choice: 在弥赛亚里
  alternative: 在基督里
  rationale: Χριστός在这里仍承载“受膏者”这一称号意义，因此正文译作“弥赛亚”；传统且广为人知的“在基督里”保留在脚注中，避免抹去译名传统。
- issue: ἀναστήσονται的语态表达
  choice: 必先复活
  alternative: 必先被复活
  rationale: 该词为将来中间语态，语境明确指死者起来；“复活”保留原文直接陈述，不额外明确施动者，也不把神使人复活这一神学理解强加为语法上的被动。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“主必亲自”保留强调；三个ἐν短语合并在“伴随着”之下，使中文自然，同时维持号令、天使长的声音和上帝的号筒声三项并列。正文保留“弥赛亚”这一称号译法，并以脚注提供传统的“基督”译法。
