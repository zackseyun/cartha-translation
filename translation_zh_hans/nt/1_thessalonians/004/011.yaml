  text: καὶ φιλοτιμεῖσθαι ἡσυχάζειν καὶ πράσσειν τὰ ἴδια καὶ ἐργάζεσθαι ⸀ταῖς χερσὶν ὑμῶν, καθὼς ὑμῖν παρηγγείλαμεν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/011.yaml
  text: and to aspire to live quietly[a], to mind your own affairs, and to work with your own hands, just as we commanded you[b],
translation:
  language: zh_hans
  text: 又要立志过安静的生活[a]，料理自己的事[b]，亲手做工，正如我们曾吩咐你们的那样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“立志保持安静。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“专心办自己的事。”
    reason: lexical_alternative
lexical_decisions:
- source_word: φιλοτιμεῖσθαι
  choice: 立志
  rationale: 该词表示以某事为荣或以之为志，并为此努力。“立志”简洁自然，也保留了“以安静为志向”的反衬意味。
- source_word: ἡσυχάζειν
  choice: 过安静的生活
  rationale: 本处不是单指不说话，而是指安静、安稳、不滋扰他人的生活方式；此译符合劝勉语境。
- source_word: πράσσειν τὰ ἴδια
  choice: 料理自己的事
  rationale: 这一表达指专心处理自己分内的事务。“料理自己的事”既传达原意，又避免“少管闲事”一类现代说法可能带有的斥责语气。
- source_word: ἐργάζεσθαι
  choice: 做工
  rationale: 该词泛指工作、劳作；与“亲手”搭配时，“做工”自然且保留实际劳动的意味。
- source_word: ταῖς χερσὶν ὑμῶν
  choice: 亲手
  rationale: 与格表示工具或方式，ὑμῶν为“你们的”。汉语“亲手”自然凝练地表达“用你们自己的手”。
- source_word: καθὼς
  choice: 正如
  rationale: 引出与先前使徒教导的对照或对应；“正如”自然并保留强调。
- source_word: παρηγγείλαμεν
  choice: 吩咐过
  rationale: παραγγέλλω表示带权威的指示或命令。“吩咐”保留权威语气，又比“命令”在现代汉语此处更自然；“过”表明这是此前已经给予的教导。
theological_decisions:
- issue: 使徒教导的伦理权威
  choice: 吩咐过
  alternative: 命令过；教导过
  rationale: 原词具有权威指示的力量，不能弱化为一般建议。“吩咐过”在现代汉语中兼具权威和自然度，同时不额外强化为专断口吻。
translation_notes:
  register: 采用现代、庄重而易懂的劝勉语体。三个并列不定式依次译为“过安静的生活、料理自己的事、亲手做工”，保留原文的排比结构；句首“又要”承接上下文中的劝勉。
