base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/002.yaml
  text: For you know what instructions we gave you through the Lord Jesus[a].
translation:
  language: zh_hans
  text: 因为你们知道，我们借着主耶稣[a]给了你们哪些指示。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“奉主耶稣的权柄”。
    reason: 保留διά加属格在本语境中可能具有的权柄含义。
lexical_decisions:
- source_word: οἴδατε
  choice: 你们知道
  rationale: οἶδα虽为完成时形式，在通用希腊语中通常具有现在时意义；“你们知道”自然准确。
- source_word: γὰρ
  choice: 因为
  rationale: 承接并说明前文的根据；现代汉语中用“因为”清楚保留其解释性连接作用。
- source_word: τίνας
  choice: 哪些
  rationale: 与复数名词παραγγελίας呼应，表示听众知道所给指示的具体内容。
- source_word: παραγγελίας
  choice: 指示
  rationale: 该词可指带有权威性的吩咐、命令或训令；“指示”既自然，又保留权威意味而不过度强化。
- source_word: ἐδώκαμεν
  choice: 给了
  rationale: 直接表达δίδωμι不定过去时的动作，并与“指示”构成自然搭配。
- source_word: ὑμῖν
  choice: 给了你们
  rationale: 用汉语间接宾语结构自然表达原文的与格。
- source_word: διὰ τοῦ κυρίου Ἰησοῦ
  choice: 借着主耶稣
  rationale: διά加属格通常表示媒介或施事；“借着”形式透明，并保留可能涉及主耶稣之权柄的语义空间。
- source_word: κυρίου
  choice: 主
  rationale: κύριος在此作为耶稣的称号，按现代中文圣经惯例译为“主”。
- source_word: Ἰησοῦ
  choice: 耶稣
  rationale: 采用现代标准汉语通行的人名译法。
theological_decisions:
- issue: διὰ τοῦ κυρίου Ἰησοῦ的语义力量
  choice: 借着主耶稣
  alternative: 奉主耶稣的权柄
  rationale: 该短语既可突出主耶稣作为指示传达的媒介，也可能表达使徒奉他的权柄而吩咐。正文采用较贴近原文且较开放的“借着”，脚注保留权柄义，避免消除原有张力。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“因为”明确连接前文；“指示”兼顾可读性与παραγγελία的权威色彩。脚注标记[a]已置于正文相应短语所在句末。
