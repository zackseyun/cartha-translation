  text: Οὐ θέλομεν δὲ ὑμᾶς ἀγνοεῖν, ἀδελφοί, περὶ τῶν ⸀κοιμωμένων, ἵνα μὴ λυπῆσθε καθὼς καὶ οἱ λοιποὶ οἱ μὴ ἔχοντες ἐλπίδα.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/013.yaml
  text: But we do not want you to be uninformed[a], brothers, about those who have fallen asleep, so that you may not grieve as the rest do[b], who have no hope.
translation:
  language: zh_hans
  text: 弟兄们[b]，关于那些睡了的人[a]，我们不愿意你们不知道，免得你们像那些没有盼望的其余人一样忧伤。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “睡了”是对已经去世之人的委婉说法；这里保留了保罗所用的睡眠隐喻。
    reason: lexical_alternative
  - marker: b
    text: “弟兄们”在这里是对会众的称呼，很可能包括男性和女性。
    reason: cultural_note
lexical_decisions:
- source_word: Οὐ θέλομεν δὲ ὑμᾶς ἀγνοεῖν
  choice: 我们不愿你们不知道
  rationale: 按希腊语惯用结构直译其意思，避免把 ἀγνοεῖν 译成现代汉语中可能带贬义的“无知”；δέ 在此是轻微的承接或转折，汉语不必机械加“但是”，以保持自然。
- source_word: ἀδελφοί
  choice: 弟兄们
  rationale: 保留希腊语阳性复数的称呼形式；在保罗书信中，这一称呼通常面向整个会众，其涵盖范围以脚注说明。
- source_word: περὶ τῶν κοιμωμένων
  choice: 关于那些已经睡了的人
  rationale: 保留 κοιμωμένων 的“睡了”隐喻及其持续状态，而不在正文中直接释为“死了”；上下文谈复活的盼望，此隐喻具有重要的神学表达力。
- source_word: ἵνα μὴ λυπῆσθε
  choice: 免得你们忧伤
  rationale: 自然表达 ἵνα μή 所指的目的或预期结果，同时不把本句理解为绝对禁止一切哀伤。
- source_word: καθὼς καὶ οἱ λοιποὶ
  choice: 像其余……的人一样
  rationale: “其余”保留 οἱ λοιποί 所表达的群体对照；汉语将后面的定语合并进入比较结构，更为顺畅。
- source_word: οἱ μὴ ἔχοντες ἐλπίδα
  choice: 那些没有盼望的人
  rationale: 直接、自然地表达分词短语，并保留末世盼望方面的鲜明对比。
theological_decisions:
- issue: 末世语境中 κοιμωμένων 的含义
  choice: 正文保留“睡了”的隐喻，并以脚注说明是指已经去世的人。
  alternative: 直接译作“已经死了的人”或“已经去世的人”。
  rationale: 保罗特意以睡眠指称死去的信徒，这一说法与随后复活的盼望相呼应；保留隐喻可避免过度解释。
- issue: ἀδελφοί 的指称范围
  choice: 正文译作“弟兄们”，脚注注明这里很可能包括会众中的男性和女性。
  alternative: 正文译作“弟兄姊妹们”或“众弟兄姊妹”。
  rationale: 正文保留原文阳性复数的形式，同时通过脚注交代保罗书信中这一会众称呼通常具有的包容范围。
- issue: 信徒是否可以哀伤
  choice: 译作“免得你们忧伤，像……一样”，使比较落在忧伤的方式上。
  alternative: 理解为完全禁止信徒忧伤。
  rationale: καθώς 引出比较，句意并非否定信徒的一切悲伤，而是不要像没有盼望的人那样悲伤。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“已经睡了”保留原文隐喻；“免得……像……一样”保持牧养语气和比较关系。脚注标记均置于正文，但为使说明紧邻相关词语，性别范围脚注 [b] 在句末呈现。
