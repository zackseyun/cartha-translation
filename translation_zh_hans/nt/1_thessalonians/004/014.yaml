  text: εἰ γὰρ πιστεύομεν ὅτι Ἰησοῦς ἀπέθανεν καὶ ἀνέστη, οὕτως καὶ ὁ θεὸς τοὺς κοιμηθέντας διὰ τοῦ Ἰησοῦ ἄξει σὺν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/014.yaml
  text: For if we believe that Jesus died and rose again[b][a], so also God will bring with him those who have fallen asleep through Jesus.
translation:
  language: zh_hans
  text: 因为我们若信耶稣死了又复活了，那么神也必照样借着耶稣[b]，把那些睡了的人[a]与他一同带来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那些已经死去的人。”这里“睡了”是保罗在本段中对信徒死亡所用的比喻。
    reason: lexical_alternative
  - marker: b
    text: “借着耶稣”也可理解为修饰“睡了的人”，译作“那些在耶稣里睡了的人”。原文短语διὰ τοῦ Ἰησοῦ可能表示媒介（“借着耶稣”），也可能表达与耶稣的密切关联。
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ γὰρ πιστεύομεν
  choice: 因为，我们若信
  rationale: 以“因为”表达γάρ承接上文、说明根据的作用，以“若”保留εἰ的条件形式；“信”自然表达共同持守的信仰告白。
- source_word: Ἰησοῦς ἀπέθανεν καὶ ἀνέστη
  choice: 耶稣死了又复活了
  rationale: 两个简单过去事件以现代汉语自然表达；ἀνέστη是不及物形式，因此译作“复活了”，不改成被动的“被复活”。
- source_word: οὕτως καὶ
  choice: 也必照样
  rationale: 保留耶稣的死而复活与神将要为已故信徒施行之事之间的对应关系，同时不具体限定“照样”的每一层含义。
- source_word: τοὺς κοιμηθέντας
  choice: 那些睡了的人
  rationale: 保留“睡了”这一死亡隐喻，不直接扁平化为“死了”；“那些……的人”符合现代汉语表达。
- source_word: διὰ τοῦ Ἰησοῦ
  choice: 借着耶稣
  rationale: διά加属格通常表示媒介或施事，“借着耶稣”既贴近原文，也适合现代汉语；因其句法关联存在争议，另以脚注保留其他理解。
- source_word: ἄξει
  choice: 必……带来
  rationale: 未来时译作“必……带来”，表达神将来的行动；“必”也使汉语句子的未来确定性清楚自然。
- source_word: σὺν αὐτῷ
  choice: 与他一同
  rationale: 保留σύν所表达的陪同关系，并以代词“他”对应原文代词；上下文中最自然的先行词是耶稣。
theological_decisions:
- issue: κοιμηθέντας的死亡隐喻
  choice: 正文保留“睡了的人”
  alternative: 已经死去的人
  rationale: 保罗在讨论主再来前去世的信徒时使用睡眠隐喻。保留这一说法，既不否认真实的死亡，也保留复活盼望所赋予的牧养意味。
- issue: διὰ τοῦ Ἰησοῦ的句法与含义
  choice: 将其理解为神“借着耶稣”施行带来的行动
  alternative: “在耶稣里睡了的人”或“因耶稣而睡了的人”
  rationale: διά加属格最直接可表达媒介或施事，但该短语也可能与“睡了的人”紧密相连，表达与耶稣联合或其他关系。正文采用最直接的媒介性译法，脚注保留真实歧义。
- issue: σὺν αὐτῷ中代词的指向
  choice: 译作“与他一同”，由上下文指向耶稣
  alternative: 明译为“与耶稣一同”
  rationale: 原文使用代词；保留代词避免不必要的明说，同时上下文足以表明所指。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“死了又复活了”简洁呈现信仰告白；“睡了的人”保留原文意象，并用脚注避免现代读者误解。“借着耶稣”在正文中按媒介义处理，标点使主干“神……把……与他一同带来”清楚易读。
