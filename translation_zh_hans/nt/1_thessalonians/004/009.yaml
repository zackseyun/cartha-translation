  text: Περὶ δὲ τῆς φιλαδελφίας οὐ χρείαν ἔχετε γράφειν ὑμῖν, αὐτοὶ γὰρ ὑμεῖς θεοδίδακτοί ἐστε εἰς τὸ ἀγαπᾶν ἀλλήλους·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/009.yaml
  text: Concerning brotherly love, you have no need for anyone to write to you, for you yourselves are taught by God to love one another.
translation:
  language: zh_hans
  text: 至于弟兄姊妹之间的亲爱[a]，你们不需要有人写信给你们[b]，因为你们自己蒙上帝教导，要彼此相爱。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里指信徒彼此如同一家人那样相亲相爱。
    reason: lexical_alternative
  - marker: b
    text: 原文只说“不需要〔人〕写信给你们”；“写信”的主语没有明说。
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ
  choice: 至于
  rationale: 自然地引出新话题，并保留δέ所表达的轻微承接作用；不添加原文没有的时间副词“现在”。
- source_word: τῆς φιλαδελφίας
  choice: 弟兄姊妹之间的亲爱
  rationale: φιλαδελφία使用家庭关系意象，特指信徒群体中的手足之爱；“弟兄姊妹”明确包含男女，“亲爱”也与后文ἀγαπᾶν的“相爱”保持适度词汇区别。
- source_word: οὐ χρείαν ἔχετε γράφειν ὑμῖν
  choice: 你们不需要有人写信教导你们
  rationale: 原文不定式γράφειν没有明说施事者，因此用泛指的“有人”，避免擅自限定为“我们”；“教导”补明写信的语用目的，使现代汉语通顺。
- source_word: αὐτοὶ γὰρ ὑμεῖς
  choice: 因为你们自己
  rationale: “你们自己”传达双重代词的强调语气。
- source_word: θεοδίδακτοί
  choice: 已经蒙上帝教导
  rationale: 准确表达由上帝亲自施教的含义；“蒙……教导”庄重而自然，“已经”符合该状态性形容词在上下文中的语义。
- source_word: εἰς τὸ ἀγαπᾶν ἀλλήλους
  choice: 要彼此相爱
  rationale: 自然表达该结构的目标或内容，同时保留ἀγαπᾶν与ἀλλήλους的相互性。
theological_decisions:
- issue: φιλαδελφία与ἀγαπᾶν在同一节中的词汇区别
  choice: 分别译作“弟兄姊妹之间的亲爱”和“彼此相爱”
  alternative: 两处都译作“爱”
  rationale: 前者突出信徒如家人般的亲情，后者使用较宽泛的爱之动词；保留变化可避免抹平保罗的措辞。
- issue: γράφειν的隐含主语
  choice: 译为泛指的“有人”
  alternative: 译为“我们”
  rationale: 上下文虽可能暗示保罗及共同署名者，但希腊文此处没有明确写出主语；泛指译法保留原文的不确定性。
- issue: θεοδίδακτοι的神圣施事者
  choice: “蒙上帝教导”
  alternative: “从上帝那里学会”
  rationale: 前者直接保留上帝作为教导者的施事关系，不把表达弱化为仅仅指出学习来源。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“弟兄姊妹”明确表达教会群体的包容性家庭意象；“蒙上帝教导”保留圣经语体而不过分古雅。所有脚注标记均已置于正文对应位置。
