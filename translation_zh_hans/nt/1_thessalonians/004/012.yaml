  text: ἵνα περιπατῆτε εὐσχημόνως πρὸς τοὺς ἔξω καὶ μηδενὸς χρείαν ἔχητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/012.yaml
  text: so that you may walk properly before outsiders and have need of nothing[a].
translation:
  language: zh_hans
  text: 好使你们在外人面前行事端正，并且一无所缺[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不需要依赖任何人。”这句话可能着重指不倚赖别人生活。
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: 好使
  rationale: 承接上文的劝勉，表达目的或预期结果；“好使”在现代中文中简洁而庄重。
- source_word: περιπατῆτε
  choice: 行事
  rationale: 原义为“行走”，在保罗书信中常比喻生活方式；中文“行事”自然地传达这一惯用意义，避免生硬直译。
- source_word: εὐσχημόνως
  choice: 端正
  rationale: 表示合宜、体面、受人尊重的举止；“行事端正”是自然中文，也没有把含义收窄为某一类道德行为。
- source_word: πρὸς τοὺς ἔξω
  choice: 在外人面前
  rationale: 既保留“外人”这一群体界线，又体现信徒生活在他们面前所呈现的公开、社会性层面。
- source_word: τοὺς ἔξω
  choice: 外人
  rationale: 指基督徒群体以外的人；“外人”简明，并避免直接增译为“非信徒”而强化原文未明说的界定。
- source_word: μηδενὸς χρείαν ἔχητε
  choice: 一无所缺
  rationale: 自然表达“不缺少任何东西”，与属格 μηδενός 最顺畅的中性理解相符；同时以脚注保留“无须依赖任何人”的可能解释。
theological_decisions:
- issue: 末句 μηδενὸς χρείαν ἔχητε 的含义
  choice: 译为“一无所缺”，侧重不缺生活所需
  alternative: “不需要依赖任何人”或“不求助于任何人”
  rationale: 上下文谈亲手做工，确实涉及避免不必要地倚赖别人；但希腊语本身可以较宽泛地指没有任何缺乏。因此正文保留较宽的事物性表达，脚注说明人际依赖方面的可能含义，不把经文限定得过窄。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“行事端正”符合中文表达习惯；“外人”保留早期基督徒群体内外之别，但不额外添加贬义；“一无所缺”兼顾原文形式与上下文中的经济独立主题。
