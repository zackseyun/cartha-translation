  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἔπειτα ἡμεῖς οἱ ζῶντες οἱ περιλειπόμενοι ἅμα σὺν αὐτοῖς ἁρπαγησόμεθα ἐν νεφέλαις εἰς ἀπάντησιν τοῦ κυρίου εἰς ἀέρα· καὶ οὕτως πάντοτε σὺν κυρίῳ ἐσόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/017.yaml
  text: Then we who are alive[a], who remain, will be caught up together with them in the clouds to meet the Lord in the air[b]; and so we will always be with the Lord.
translation:
  language: zh_hans
  text: 随后，我们这些还活着、仍存留的人，将和他们一同在云中被提[a]，在空中迎接主[b]；这样，我们就会永远与主同在。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“被猛然提去”。希腊动词强调突然而有力的动作。
    reason: lexical_alternative
  - marker: b
    text: 或译“去与主会面”。这个短语可以指外出迎接某人，但本节本身并未说明这次相遇之后更完整的事件次序。
    reason: alternative_reading
lexical_decisions:
- source_word: ἔπειτα
  choice: 然后
  rationale: 承接上一节基督里死去之人的复活，清楚表达事件的先后次序。
- source_word: οἱ ζῶντες οἱ περιλειπόμενοι
  choice: 我们这些还活着、仍然存留的人
  rationale: 保留原文两个并列的限定语，指主来临时尚未死去、仍存留的人；不额外加入他们从某种灾难中幸存的含义。
- source_word: ἅμα σὺν αὐτοῖς
  choice: 和他们一同
  rationale: 自然表达原文所强调的共同参与，也含有同时发生之意。
- source_word: ἁρπαγησόμεθα
  choice: 将……被提到
  rationale: 保留未来被动语态以及向上移动的语境含义；脚注补明该动词所含突然而有力的动作色彩，同时避免把特定末世论体系写入正文。
- source_word: ἐν νεφέλαις
  choice: 到云中
  rationale: 以具体、自然的中文保留复数“云”的意象，并与被提起的移动方向顺畅衔接。
- source_word: εἰς ἀπάντησιν τοῦ κυρίου
  choice: 迎接主
  rationale: 简洁表达朝向与主相遇这一目的，不预先断定相遇之后的行程或完整末世事件次序。
- source_word: εἰς ἀέρα
  choice: 在空中
  rationale: 在“迎接”之后用地点表达最符合现代汉语，同时准确指出相遇发生的领域。
- source_word: καὶ οὕτως
  choice: 这样
  rationale: 可同时承载方式和由此产生的结果，保留原文的衔接弹性。
- source_word: πάντοτε σὺν κυρίῳ ἐσόμεθα
  choice: 我们就会永远与主同在
  rationale: 自然表达未来持续与主同在的保证；“永远”在此语境中清楚传达 πάντοτε 的持续性。
theological_decisions:
- issue: 如何翻译末世论争议中常被称为“被提”的 ἁρπαγησόμεθα
  choice: 将……被提到
  alternative: 将……被猛然提走
  rationale: 正文直接而克制地表达神所施行的向上带走，不加入事件发生时间或性质的宗派性框架；脚注保留希腊动词突然而有力的语义。
- issue: εἰς ἀπάντησιν τοῦ κυρίου 所表达的相遇
  choice: 迎接主
  alternative: 去与主会面
  rationale: “迎接主”符合该短语的方向和目的，也可自然包含出去与来者相会的图景；但不据此替经文补定相遇以后是返回地上还是继续升上去。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“仍然存留”略带经文体色彩，但能准确保留第二个分词而不暗示从危险中幸存；整体句式按原文推进，同时避免生硬直译。脚注标记均放在其所说明的词语之后。
