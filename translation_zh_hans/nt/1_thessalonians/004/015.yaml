id: 1TH.4.15
reference: 1 Thessalonians 4:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: τοῦτο γὰρ ὑμῖν λέγομεν ἐν λόγῳ κυρίου, ὅτι ἡμεῖς οἱ ζῶντες οἱ περιλειπόμενοι εἰς τὴν παρουσίαν τοῦ κυρίου οὐ μὴ φθάσωμεν τοὺς κοιμηθέντας·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/015.yaml
  text: 'For this we say to you by a word from the Lord: that we who are living[a], who remain until the coming of the Lord[c][b], will certainly not precede those who have fallen asleep.'
translation:
  language: zh_hans
  text: 因为我们凭着主的话[a]告诉你们这件事：我们这些活着、存留到主来临[b]的人，绝不会先于那些已经睡了[c]的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “凭着主的话”也可理解为“凭着从主而来的话”。希腊原文既可能指主耶稣说过的话，也可能指以主的权威赐下的启示。
    reason: alternative_reading
  - marker: b
    text: “来临”所译的希腊词παρουσία也可译作“到来”或“临在”。
    reason: lexical_alternative
  - marker: c
    text: “那些已经睡了的人”是指已经去世的信徒。
    reason: metaphor_explanation
lexical_decisions:
- source_word: ἐν λόγῳ κυρίου
  choice: 凭着主的话
  rationale: “凭着”表达ἐν在此所指的依据或权威；“主的话”保留属格关系，不限定这是耶稣曾公开说过的话，还是以主的权威赐下的启示。
- source_word: οἱ ζῶντες
  choice: 我们这些活着……的人
  rationale: 直接保留现在分词“活着”的意义，并与后面的“存留”组成自然的汉语并列结构。
- source_word: οἱ περιλειπόμενοι
  choice: 存留到
  rationale: 表示一直留存至指定时刻；避免使用“幸存”，因为后者可能额外暗示逃过灾难。
- source_word: παρουσίαν
  choice: 来临
  rationale: 在此末世语境中指主将来的到达和临在；“来临”自然地表达事件含义，同时脚注保留“临在、到来”等词义范围。
- source_word: οὐ μὴ φθάσωμεν
  choice: 绝不会抢在……前面
  rationale: “绝不会”体现οὐ μή的强烈否定；“抢在……前面”以自然现代汉语表达φθάνω在这里“先于”的意思。
- source_word: τοὺς κοιμηθέντας
  choice: 那些已经睡了的人
  rationale: 保留原文以睡眠指死亡的隐喻，并用“已经”反映不定过去分词所指已经发生的状态变化。
- source_word: κύριος / κυρίου
  choice: 主
  rationale: 本节在末世来临的语境中指耶稣；“主”是准确、庄重且通行的译法。
theological_decisions:
- issue: “主的话”的传递方式
  choice: 译作“凭着主的话”，只表明保罗陈述的依据和权威
  alternative: 明确译成“主耶稣说过的一句话”或“主赐给保罗的启示”
  rationale: ἐν λόγῳ κυρίου没有明确说明其传递方式，因此不应裁定这是已流传的耶稣言论还是直接赐下的启示。
- issue: 睡眠隐喻所指
  choice: 正文保留“已经睡了”的隐喻，并在脚注说明所指为已经去世的信徒
  alternative: 正文直接译作“已经死了的人”
  rationale: 保留保罗在复活盼望的语境中对死亡所用的隐喻，同时借脚注避免现代读者误解。
- issue: 活着存留之人的表述
  choice: 保留第一人称复数“我们”
  alternative: 改写为泛指“那些仍然活着的人”
  rationale: 原文明确使用ἡμεῖς；译文不据此推断保罗断言自己必定活到主来，也不抹去原文的群体视角。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“抢在……前面”较“先于”更口语自然，但仍适合经文语体；“存留到”保持中性，不加入“幸存”的解释性意味。所有脚注标记均置于正文相应词语之后。
