id: 1TH.4.7
reference: 1 Thessalonians 4:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οὐ γὰρ ἐκάλεσεν ἡμᾶς ὁ θεὸς ἐπὶ ἀκαθαρσίᾳ ἀλλ’ ἐν ἁγιασμῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/007.yaml
  text: For God did not call us for uncleanness[b][a], but in holiness.
translation:
  language: zh_hans
  text: 因为神召我们，不是要我们活在污秽中[a]，而是要我们活在圣洁中[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不洁”。这里的希腊语可指道德上的污秽；按本段语境，尤其涉及性方面的污秽。
    reason: lexical_alternative
  - marker: b
    text: 或译：“成圣”。这里的希腊语既可指圣洁的状态，也可指成为圣洁的过程。
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: 因为
  rationale: γάρ说明上一文劝勉的根据；“因为”在现代汉语中自然清楚。
- source_word: ἐκάλεσεν
  choice: 召
  rationale: 保留神主动呼召信徒的语义及圣经用语，同时不把此处限定为某一套特定的神学体系。
- source_word: ἐπὶ ἀκαθαρσίᾳ
  choice: 要我们活在污秽中
  rationale: ἐπί加与格在此可表达目的或所处领域；加入“活在”使汉语自然，并结合上下文呈现一种以污秽为特征的生活。
- source_word: ἀκαθαρσίᾳ
  choice: 污秽
  rationale: ἀκαθαρσία可泛指道德上的不洁，在4:3–8的语境中特别涉及性方面的不洁；“污秽”保留其较广的道德与洁净意涵。
- source_word: ἐν ἁγιασμῷ
  choice: 要我们活在圣洁中
  rationale: ἐν可表示范围或生活境况；“活在圣洁中”与前句形成自然对照，又不排除ἁγιασμός所含成圣过程的意义。
- source_word: ἁγιασμῷ
  choice: 圣洁
  rationale: ἁγιασμός既可指圣洁的状态，也可指成为圣洁的过程；正文采用通顺的“圣洁”，并以脚注保留“成圣”的可能译法。
theological_decisions:
- issue: 神“召”人的含义
  choice: 译作神对信徒的真实呼召，并以此作为圣洁生活的根据
  alternative: 一般性的邀请；或明确限定为技术意义上的有效呼召
  rationale: 经文本身肯定神的呼召并以之支撑伦理劝勉，却没有在本节说明这呼召的具体机制；因此保留“召”，不加入经文未明说的宗派性界定。
- issue: ἁγιασμός是状态还是过程
  choice: 正文译作“圣洁”，同时用脚注保留“成圣”
  alternative: 正文直接译作“成圣”
  rationale: 与ἀκαθαρσία的对比偏向圣洁的生活状态或领域，但该词也确实可以表示成为圣洁的过程，不应在翻译中排除这一层含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“活在……中”使两个介词短语在汉语中表达自然，同时保留污秽与圣洁之间的鲜明对照。所有脚注标记均置于相应词语之后。
