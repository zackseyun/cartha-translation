  text: not in the passion of lust[a], just as also the Gentiles who do not know God[b],
translation:
  language: zh_hans
  text: 不可受情欲的强烈冲动支配[a]，像那些不认识上帝的外邦人一样[b]；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“不可在情欲的激情中”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文直译“列国的人”或“各民族的人”；在保罗书信中通常指非犹太人的“外邦人”。按本句语境，也可译为“异教徒”。
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ἐν
  choice: 不可陷于……中
  rationale: μὴ否定本句所说的行为方式，ἐν表示所处的状态或范围；“不可陷于……中”在现代汉语中自然地表达这种负面状态。
- source_word: πάθει ἐπιθυμίας
  choice: 情欲的冲动
  rationale: πάθος指强烈而具有支配力的激情，ἐπιθυμία在本段性伦理语境中指情欲；保留两个名词之间的限定关系，同时避免生硬直译。
- source_word: καθάπερ καὶ
  choice: 像……一样
  rationale: 表达比较关系；希腊文καί在汉语比较句中无需机械译作“也”，其比较语气已由“像……一样”自然体现。
- source_word: τὰ ἔθνη
  choice: 外族人
  rationale: 保罗常用此词指犹太人以外的各民族；“外族人”保留其民族—宗教范畴，又不直接加入“异教徒”的解释性贬义。
- source_word: τὰ μὴ εἰδότα τὸν θεόν
  choice: 那些不认识上帝的
  rationale: 否定分词短语修饰“外族人”，描述他们持续处于不认识上帝的状态；“认识”也保留了原文不只涉及知识、还涉及关系的可能含义。
theological_decisions:
- issue: πάθει ἐπιθυμίας所表达的失序欲望
  choice: 情欲的冲动
  alternative: 邪情私欲；强烈的欲望；贪欲的激情
  rationale: 上下文明确涉及性方面的圣洁，因此“情欲”比泛指的“欲望”准确；“冲动”传达πάθος的强烈力量，但不额外断定具体心理机制。
- issue: ἔθνη在劝诫语境中的指称
  choice: 外族人
  alternative: 列国的人；异教徒
  rationale: 原词通常指非犹太各民族，本句又以“不认识上帝”限定其中所指的人。“异教徒”虽能表达语境含义，却比原词更具解释性；正文保留“外族人”，脚注说明其他译法。
translation_notes:
  register: 采用现代、庄重而易懂的书面语。“陷于情欲的冲动中”兼顾希腊文介词结构与汉语自然表达；句末用分号，表明本节在语法和思想上承接前文并继续到后文。
