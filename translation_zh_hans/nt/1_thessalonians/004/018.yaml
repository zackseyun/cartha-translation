  rationale: 该动词可表示鼓励、安慰或劝勉。鉴于前文旨在消除信徒对已故之人的忧虑，“鼓励”既保留较宽的语义范围，也包含此处安慰人心的作用。
- source_word: ἀλλήλους
  choice: 彼此
  rationale: 准确表达相互性的代词含义，并符合现代汉语习惯。
- source_word: ἐν
  choice: 用
  rationale: 此处表示鼓励所借助的内容或方式；汉语“用这些话”自然地传达其工具性。
- source_word: τοῖς λόγοις τούτοις
  choice: 这些话
  rationale: 指向保罗刚才所陈述的具体内容；“这些话”直接而透明，也保留 λόγοι 的字面意象。
