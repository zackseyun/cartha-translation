  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Λοιπὸν ⸀οὖν, ἀδελφοί, ἐρωτῶμεν ὑμᾶς καὶ παρακαλοῦμεν ἐν κυρίῳ Ἰησοῦ, ⸀ἵνα καθὼς παρελάβετε παρ’ ἡμῶν τὸ πῶς δεῖ ὑμᾶς περιπατεῖν καὶ ἀρέσκειν θεῷ, ⸂καθὼς καὶ περιπατεῖτε⸃, ἵνα περισσεύητε μᾶλλον.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/001.yaml
  text: Finally then[a], brothers, we ask and urge you in the Lord Jesus that, just as you received from us how you ought to walk and to please God, just as you are also walking, you abound more and more.
translation:
  language: zh_hans
  text: 此外，弟兄们[a]，我们在主耶稣里请求并劝勉你们：要你们照着从我们所领受的、关于该怎样行事为人并讨上帝喜悦的教导——你们现在也正是这样行——越发如此。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“弟兄们”；这个阳性复数称呼在这里很可能包括弟兄和姐妹，即整个信徒群体。
    reason: 说明原文的语法性别与语境所指范围。
lexical_decisions:
- source_word: Λοιπὸν οὖν
  choice: 所以
  rationale: 此处由前文转入劝勉；“所以”自然表达οὖν的承接、推论作用，也能在现代汉语中承担λοιπόν的篇章转换功能。
- source_word: ἀδελφοί
  choice: 弟兄们[a]
  rationale: 保留希腊文阳性复数称呼；脚注说明在此很可能包括整个信徒群体中的男女。
- source_word: ἐρωτῶμεν ... καὶ παρακαλοῦμεν
  choice: 我们……请求并劝勉
  rationale: 分别体现郑重请求与带有敦促意味的劝勉，保留两个并列动词。
- source_word: ἐν κυρίῳ Ἰησοῦ
  choice: 在主耶稣里
  rationale: 保留ἐν的表达以及κύριος作为耶稣称号的分量，不把它单向限定为“奉……之名”或“借着”。
- source_word: καθὼς παρελάβετε παρ’ ἡμῶν
  choice: 你们既从我们领受了……教导
  rationale: παραλαμβάνω在传授语境中表示领受所传的教导；补出“教导”使中文完整，其内容仍由后面的间接问句界定。
- source_word: τὸ πῶς δεῖ ὑμᾶς περιπατεῖν
  choice: 应当怎样行事
  rationale: “行事”以自然汉语传达保罗以“行走”比喻生活行为的惯用含义，并以“应当”体现δεῖ的道德必要性。
- source_word: καὶ ἀρέσκειν θεῷ
  choice: 怎样讨上帝喜悦
  rationale: 准确表达以使上帝喜悦为生活目标，并与前面的“怎样行事”形成自然并列。
- source_word: καθὼς καὶ περιπατεῖτε
  choice: 你们现在也确实这样行
  rationale: 保留对收信人目前实践的肯定；“也确实”自然传达καί在此的确认意味，避免生硬重复“行走”。
- source_word: ἵνα περισσεύητε μᾶλλον
  choice: 就要更加长进
  rationale: περισσεύω表示在现有基础上进一步增多或超越；在品行劝勉语境中，“更加长进”比直译“更加充盈”自然，同时保留持续进步之意。
theological_decisions:
- issue: ἀδελφοί所指群体的性别范围
  choice: 正文译作“弟兄们”，并加脚注说明可能包括姐妹
  alternative: 弟兄姊妹们
  rationale: 既保留原文的阳性复数形式，也不掩盖该称呼在早期基督徒群体中通常可指男女全体成员。
- issue: ἐν κυρίῳ Ἰησοῦ的关系含义
  choice: 在主耶稣里
  alternative: 奉主耶稣的名；靠着主耶稣
  rationale: 原文可兼有联合、范围和权威色彩；直译“在……里”保留这种神学张力，不把它缩减为单一工具或授权关系。
- issue: κύριος作为耶稣的称号
  choice: 主
  alternative: 主人
  rationale: “主”是现代汉语圣经语境中庄重、清楚的基督论称号，能保留原文的尊称与权威含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“领受……教导”保留传统传授语境，“行事”和“长进”则避免僵硬的希腊语式直译。破折号标出插入的肯定语，使主句劝勉关系清楚。
