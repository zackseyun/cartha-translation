  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: τοιγαροῦν ὁ ἀθετῶν οὐκ ἄνθρωπον ἀθετεῖ ἀλλὰ τὸν θεὸν τὸν ⸀καὶ ⸀διδόντα τὸ πνεῦμα αὐτοῦ τὸ ἅγιον εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/008.yaml
  text: Therefore[a], whoever rejects this rejects not man but God[b], who also gives his Holy Spirit to you.
translation:
  language: zh_hans
  text: 所以，谁弃绝这教导[a]，所弃绝的不是人，而是上帝，就是那位也把自己的圣灵赐给你们的上帝[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“谁弃绝”；“这教导”是按上文补出的。这里的动词也可译作“漠视”或“废弃”。
    reason: 说明隐含受词并保留词义范围。
  - marker: b
    text: “赐给你们”也可较直译为“赐入你们里面”；原文所用介词通常带有“进入”的方向意味。
    reason: 保留介词εἰς可能表达的内在或方向性含义。
lexical_decisions:
- source_word: τοιγαροῦν
  choice: 所以
  rationale: 表示由前文劝勉得出的结论；“所以”自然简洁，并保留推论关系。
- source_word: ὁ ἀθετῶν / ἀθετεῖ
  choice: 谁弃绝……所弃绝的
  rationale: 带冠词的分词具有泛指作用，并不限于男性。ἀθετέω可指弃绝、漠视或废弃权威性的要求；“弃绝”最能保留本句“不是弃绝人，而是弃绝上帝”的鲜明对照。
- source_word: οὐκ ἄνθρωπον ... ἀλλὰ τὸν θεόν
  choice: 不是人，而是上帝
  rationale: ἄνθρωπον为泛指单数，所强调的是人的权威与上帝的权威之间的对照；汉语用无定冠词的“人”最自然。
- source_word: τὸν καὶ διδόντα
  choice: 就是那位也……赐给……的上帝
  rationale: 冠词加现在分词进一步说明上帝是谁；“也”反映καί，并保留上帝持续施予圣灵这一行动与前句之间的联系。
- source_word: τὸ πνεῦμα αὐτοῦ τὸ ἅγιον
  choice: 自己的圣灵
  rationale: 这里在保罗语境中指属于上帝的圣灵。“自己”清楚回指上帝，也避免现代汉语中“他的”可能出现的指代含混。
- source_word: εἰς ὑμᾶς
  choice: 赐给你们
  rationale: εἰς通常有“进入”的方向性，但与“赐予”搭配并以人为对象时，现代汉语用“赐给你们”自然且能表达实际语义；其较直译的可能性在脚注中保留。
theological_decisions:
- issue: “自己的圣灵”所指为何
  choice: 指上帝赐下的圣灵
  alternative: 把“圣灵”理解为一种较非人格化的属灵恩赐或圣洁心性
  rationale: τὸ πνεῦμα αὐτοῦ τὸ ἅγιον的定冠词结构及保罗书信语境自然指向上帝的圣灵；译文不额外加入有关圣灵位格或施予方式的教义说明。
- issue: ὁ ἀθετῶν的泛指性质
  choice: 译为“谁弃绝”
  alternative: 译为“那弃绝的人”
  rationale: 希腊语阳性单数在此是代表性、泛指性的，并非专指男性；“谁”在现代汉语中准确传达这一开放的泛指范围。
- issue: ἀθετέω隐含的受词
  choice: 在正文补出“这教导”
  alternative: 直译为“谁弃绝”而不明说弃绝什么
  rationale: 原文未明示受词，但从4:3—7的训诲可知所指。现代汉语若完全省略容易显得残缺，因此补出“这教导”，并以脚注说明其隐含性质，避免把补足内容伪装成明文。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“弃绝”保留原文的权威冲突和强烈语气；“所弃绝的不是……而是……”使重复动词在汉语中清楚自然。关系分句“就是那位……”刻意保留原文对上帝的进一步界定，而不简化成两个彼此松散的陈述。
