source:
  edition: SBLGNT
  text: καὶ γὰρ ποιεῖτε αὐτὸ εἰς πάντας τοὺς ἀδελφοὺς τοὺς ἐν ὅλῃ τῇ Μακεδονίᾳ. παρακαλοῦμεν δὲ ὑμᾶς, ἀδελφοί, περισσεύειν μᾶλλον,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/010.yaml
  text: For indeed you are doing this toward all the brothers throughout all Macedonia. But we urge you[a], brothers, to abound still more,
translation:
  language: zh_hans
  text: 因为你们确实也这样爱马其顿全境所有的弟兄[a]。然而，弟兄们，我们劝你们要越发这样行，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“弟兄”指同为信徒的人，在这些教会中很可能包括男女信徒。
    reason: 说明阳性复数称谓在具体教会语境中的代表性和涵盖范围。
lexical_decisions:
- source_word: καὶ γὰρ
  choice: 其实……确实也
  rationale: γάρ承接上文并说明理由，καί带有“也”的意味；这一组合既保留解释和强调作用，又符合现代汉语表达。
- source_word: ποιεῖτε αὐτὸ
  choice: 你们确实也这样……行
  rationale: 现在时表示持续的实践；αὐτό回指上一节的弟兄之爱。前半句译作“这样对待”，末尾补回“这样行”，使中文语义清楚并衔接后面的劝勉。
- source_word: εἰς πάντας τοὺς ἀδελφοὺς
  choice: 对待……所有弟兄
  rationale: εἰς在此表达行动所指向的对象；“对待”自然呈现他们向众信徒实行弟兄之爱的关系含义。
- source_word: τοὺς ἐν ὅλῃ τῇ Μακεδονίᾳ
  choice: 马其顿全境的
  rationale: 保留ὅλῃ所表达的全面地域范围，并以简洁自然的汉语修饰“所有弟兄”。
- source_word: παρακαλοῦμεν δὲ ὑμᾶς
  choice: 但……我们劝你们
  rationale: παρακαλέω在这里是恳切劝勉；δέ表示由称许转入进一步劝勉的轻微转折。
- source_word: ἀδελφοὺς / ἀδελφοί
  choice: 弟兄
  rationale: 保留希腊文阳性复数及早期教会亲属式称谓，同时用脚注说明在此很可能涵盖男女信徒。
- source_word: περισσεύειν μᾶλλον
  choice: 要更加充足地这样行
  rationale: περισσεύειν含有增多、丰盛的意思，μᾶλλον表示在已有实践上更进一步；结合回指内容译出“这样行”，避免中文句意悬空。
theological_decisions:
- issue: ἀδελφοί／ἀδελφούς在可能男女混合的教会群体中如何表达
  choice: 正文译作“弟兄”，脚注说明其涵盖范围
  alternative: 弟兄姊妹；众信徒
  rationale: 这样既保留原文的阳性复数亲属称谓，也不把其语境中的代表性范围误解为仅限男性。
- issue: περισσεύειν所要求增加的具体内容
  choice: 以“这样行”明确回指上文所说的弟兄之爱
  alternative: 只译作“更加丰盛”，保留语法省略
  rationale: 希腊文不重复宾语，但上下文清楚指向实行弟兄之爱；中文补出回指语可避免表达悬空，而不引入新的神学内容。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“马其顿全境”简洁表达地域分布；“更加充足地这样行”保留περισσεύω的丰盛意象及μᾶλλον的递进力。
