  text: τὸ μὴ ὑπερβαίνειν καὶ πλεονεκτεῖν ἐν τῷ πράγματι τὸν ἀδελφὸν αὐτοῦ, διότι ἔκδικος ⸀κύριος περὶ πάντων τούτων, καθὼς καὶ προείπαμεν ὑμῖν καὶ διεμαρτυράμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/006.yaml
  text: that no one should overstep and exploit his brother in this matter[a], because the Lord is an avenger concerning all these things[b], just as we also told you beforehand and solemnly warned you.
translation:
  language: zh_hans
  text: 不可在这件事上越界，也不可占自己弟兄[b]的便宜[a]，因为主必追究这一切事；正如我们从前已经告诉你们，并郑重警告你们的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在这件事上亏负自己的弟兄。”原文可指为自己谋取不当利益而损害他人；也有人较狭义地理解为欺诈。按上下文，这里最可能是在警告性方面的过犯。
    reason: lexical_alternative
  - marker: b
    text: “弟兄”对应原文阳性单数，可能特指同信徒；这项伦理警告的适用未必限于男性。
    reason: lexical_clarification
lexical_decisions:
- source_word: τὸ μὴ ὑπερβαίνειν
  choice: 不可……越界
  rationale: 承接上文的劝勉内容；ὑπερβαίνω在这里指越过道德界限。“越界”保留原文意象，也符合现代汉语表达。
- source_word: πλεονεκτεῖν
  choice: 占……的便宜
  rationale: 该词表示为自己谋取不当利益而侵害别人。“占……的便宜”既可涵盖剥削、欺骗，也能在本段性伦理语境中自然表达对他人的侵犯，而不把含义局限于财务欺诈。
- source_word: ἐν τῷ πράγματι
  choice: 在这件事上
  rationale: 原文措辞较为概括，却由上下文限定；“这件事”自然指回3—5节所谈的性圣洁，同时不把希腊文未明说的内容直接补入正文。
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: 自己弟兄
  rationale: 忠实保留希腊文阳性单数形式，并表达信徒群体中的关系；相关伦理要求可能具有更广泛适用性，但不在正文中抹平原文形式。
- source_word: ἔκδικος κύριος
  choice: 主必……施行报应
  rationale: ἔκδικος指追究恶行、执行公正惩罚者。汉语用动词性表达比“主是报仇者”更自然庄重；“报应”保留司法性与追讨恶行的力度。
- source_word: περὶ πάντων τούτων
  choice: 为这一切
  rationale: 保留原文范围较广的概括，指本段所说的种种性方面的罪与对他人的侵害。
- source_word: προείπαμεν
  choice: 从前告诉过你们
  rationale: 表达该信息先前已经传达，并避免与后面的强烈警告动词重复。
- source_word: διεμαρτυράμεθα
  choice: 郑重警告过你们
  rationale: 体现διαμαρτύρομαι所含的严肃见证、郑重告诫之意，适合本段劝诫语境。
theological_decisions:
- issue: “这件事”所指及相关过犯的性质
  choice: 让正文承接3—5节的性伦理语境，但以“在这件事上”保留原文概括性。
  alternative: 理解为一般商业欺诈或人际侵占。
  rationale: 紧邻上下文谈成圣、淫乱和以圣洁尊贵持守自己的身体，因此性方面的侵害最符合论证脉络；不过πλεονεκτεῖν和πρᾶγμα本身可用于更一般的占便宜或事务，故不在正文中过度具体化，并在脚注交代歧义。
- issue: ἀδελφός的性别和群体所指
  choice: 译作“自己弟兄”。
  alternative: 译作“弟兄姊妹”或“其他信徒”。
  rationale: 原文为阳性单数，应在正文中保留其形式；它很可能聚焦于信徒同伴，但伦理警告的适用范围未必仅限于男性。
- issue: κύριος的身份与审判作用
  choice: 译作“主”，并将ἔκδικος表达为“必……施行报应”。
  alternative: 译作“主人”或“主必伸冤”。
  rationale: “主”保持新约中κύριος的神学和词汇连续性；本句强调主追究这些恶行、执行公正惩罚，而不只是为受害者伸冤。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“不可……越界”承接上文劝勉；“占……的便宜”在汉语中自然涵盖利用、侵害和欺骗，且保留原文在性侵害与一般欺诈之间的词义张力。正文使用分号呈现原因与先前警告之间的紧密联系。
