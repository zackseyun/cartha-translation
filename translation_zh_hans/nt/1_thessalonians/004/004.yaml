base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/004.yaml
  text: that each of you know how to acquire his own vessel in holiness and honor,
translation:
  language: zh_hans
  text: 你们每个人都要知道怎样以圣洁和尊贵取得自己的器皿[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “器皿”可指自己的身体；也可能是指妻子的委婉说法。若指身体，“取得”可按语境理解为“持守”或“掌管”；若指妻子，则可理解为“取得”或“娶得”。
    reason: 说明σκεῦος与κτᾶσθαι在本节形成的两种主要理解，同时避免以“约束”将身体解释过度具体化。
lexical_decisions:
- source_word: εἰδέναι
  choice: 要知道怎样
  rationale: 不定式承接上文，表达信徒应当具备的实际认识；“知道怎样”自然体现希腊文的实践意味。
- source_word: ἕκαστον ὑμῶν
  choice: 你们每个人
  rationale: 准确保留逐一涵盖听众的强调。
- source_word: τὸ ἑαυτοῦ σκεῦος
  choice: 自己的器皿
  rationale: σκεῦος字面意为“器皿”，此处可能指自己的身体，也可能委婉指妻子；正文保留原文的真实歧义。
- source_word: κτᾶσθαι
  choice: 得着
  rationale: 该动词可表示取得、获得或拥有；“得着”既贴近其基本语义，也避免正文先行裁定“器皿”究竟指身体还是妻子。
- source_word: ἐν ἁγιασμῷ καὶ τιμῇ
  choice: 以圣洁和尊重
  rationale: ἐν在此表示行事的方式或所处的道德领域；“圣洁”对应ἁγιασμός，“尊重”对应τιμή，并适用于原文两种主要解释。
theological_decisions:
- issue: “器皿”所指为何
  choice: 正文保留“自己的器皿”，脚注列出“身体”与“妻子”两种主要理解
  alternative: 正文直接译作“约束自己的身体”或“娶得自己的妻子”
  rationale: 语法和古代用法容许两种解释，语境虽关乎性方面的圣洁，却不足以无争议地排除其中之一；不应以译文消除原文的张力。
- issue: κτᾶσθαι的动作含义
  choice: 译为“得着”
  alternative: 译为“控制”“持守”或“娶得”
  rationale: 中间语态不必然只表示控制或占有；“得着”保留取得、拥有等语义空间，并与“器皿”的双重解释相容。
translation_notes:
  register: 采用庄重而易懂的现代普通话。“器皿”略带经文语体，但为保留原文关键隐喻及其歧义所必需；脚注帮助普通读者理解可能含义。
