  text: τοῦτο γάρ ἐστιν θέλημα τοῦ θεοῦ, ὁ ἁγιασμὸς ὑμῶν, ἀπέχεσθαι ὑμᾶς ἀπὸ τῆς πορνείας,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/003.yaml
  text: 'For this is the will of God: your sanctification—that you abstain from sexual immorality[a][b].'
translation:
  language: zh_hans
  text: 因为上帝的旨意是要你们成为圣洁[a]，就是要你们远避淫乱[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们的成圣”或“你们的圣洁”。
    reason: lexical_alternative
  - marker: b
    text: 希腊语 porneia，泛指各种不正当的性行为；传统上常译作“淫行”。
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλημα
  choice: 旨意
  rationale: “旨意”自然表达上帝所意愿并带有权威性的要求；“愿望”语气过弱，“目的”则可能过度暗示预定的计划。
- source_word: ὁ ἁγιασμὸς ὑμῶν
  choice: 你们要成为圣洁
  rationale: ἁγιασμός可指分别为圣、圣洁的状态及成圣的过程。此处用现代汉语的动词性表达，既清楚可懂，也便于同下文的具体伦理要求衔接，同时不把词义限定为纯粹地位或纯粹过程。
- source_word: ἀπέχεσθαι
  choice: 也就是要远避
  rationale: 不定式说明“成为圣洁”的具体内容。“也就是”显明解释关系，“远避”传达持续克制并不参与之意。
- source_word: πορνείας
  choice: 淫乱
  rationale: πορνεία是涵盖各种不正当性行为的宽泛用语。“淫乱”在现代中文圣经语体中简洁而庄重；脚注说明其范围，以免被误解为仅指某一种性行为。
- source_word: γάρ
  choice: 因为
  rationale: γάρ承接上文，为先前的劝勉提供根据；“因为”在现代汉语中清楚保留这一论述关系。
theological_decisions:
- issue: ἁγιασμός在伦理劝勉中的含义
  choice: 译为“你们要成为圣洁”，并让后面的分句说明其具体伦理内容。
  alternative: 译为“你们的成圣”或“你们的圣洁”。
  rationale: 该表达涵盖归属上帝的圣洁生活及其实践过程。动词性译法自然易懂，又不把它局限为纯粹地位或某套特定的成圣理论。
- issue: πορνεία的范围
  choice: 正文译为宽泛的“淫乱”，脚注说明指各种不正当的性行为。
  alternative: 译为“奸淫”“婚前性行为”或“不贞”。
  rationale: 原词范围宽于任何一种特定的越轨性行为，因此不采用会缩窄含义的译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“因为”保留与上文的因果衔接；冒号及“也就是”清楚呈现同位解释关系。所有脚注标记均已置于正文相应位置。
