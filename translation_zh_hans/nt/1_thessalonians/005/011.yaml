  yaml_path: translation/nt/1_thessalonians/005/011.yaml
  text: Therefore encourage one another and build up one another[a], just as you are also doing.
translation:
  language: zh_hans
  text: 所以，你们要彼此鼓励[a]，互相造就，正如你们也在这样做。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“彼此劝勉”；παρακαλεῖτε 在此既可侧重鼓励，也可侧重劝勉、敦促。
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: 所以
  rationale: 承接上文并引出推论；“所以”在现代汉语中自然、清楚地保留逻辑联系。
- source_word: παρακαλεῖτε
  choice: 鼓励
  rationale: 该词可表示鼓励、劝勉或安慰。此处与彼此造就并列，“鼓励”最能保留较宽泛的积极推动之意；另以脚注注明“劝勉”的可能。
- source_word: ἀλλήλους
  choice: 彼此
  rationale: 自然表达相互施行这一行动，保留命令的群体互惠性。
- source_word: οἰκοδομεῖτε
  choice: 造就
  rationale: “造就”是现代中文基督教语境中仍可理解的表达，也保留了原词“建造”的隐喻及使人得以成长、坚固的含义。
- source_word: εἷς τὸν ἕνα
  choice: 互相
  rationale: 该短语逐字近似“一个对那一个”，强调群体中个体之间的相互行动；译为“互相”既自然，也避免与前句机械重复，同时保存互惠重点。
- source_word: καθὼς καὶ ποιεῖτε
  choice: 正如你们一直在做的
  rationale: “正如”保留比较关系；“一直在做”体现现在时所指的持续实践，并传达保罗对他们已有行为的肯定。
