  yaml_path: translation/nt/1_thessalonians/005/022.yaml
  text: Abstain from every kind of evil[a].
translation:
  language: zh_hans
  text: 要远离各样的恶[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“各种形式的恶”；传统译法作：“一切恶的表象”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέχεσθε
  choice: 要远离
  rationale: 现在时中间语态命令式、第二人称复数，要求持续避开；“要远离”在现代汉语中自然、庄重，并保留命令语气和分离之意。
- source_word: ἀπὸ
  choice: 远离
  rationale: 与ἀπέχεσθε共同表达离开、避开的意思，汉语中自然合译为“远离”。
- source_word: παντὸς
  choice: 各种
  rationale: 与单数εἴδους构成“每一种/各种”的意思；“各种”简洁自然，也体现范围无一例外。
- source_word: εἴδους
  choice: 种
  rationale: 本处较自然地指种类或形式，而不只是外在表象；在“各种”中体现其意义。
- source_word: πονηροῦ
  choice: 恶事
  rationale: 在此为属格，与εἴδους相连。“恶事”符合现代汉语表达；脚注保留可译作较抽象的“恶”的可能。
theological_decisions:
- issue: 短语ἀπὸ παντὸς εἴδους πονηροῦ中εἴδους的含义
  choice: 各种恶事
  alternative: 各种形式的恶；一切恶的表象
  rationale: 上下文中εἶδος更可能表示“种类”或“形式”。传统译法若理解为“表象”，容易使人以为经文只要求避开看起来像恶的事，超出了本句较可能的含义；脚注列出这些译法，以保留词义透明度。
translation_notes:
  register: 采用现代、简明而庄重的命令句。“要远离”比“禁戒”更易为普通读者理解，同时保留持续避开的力度；“各种恶事”自然传达每一种恶的意思。
