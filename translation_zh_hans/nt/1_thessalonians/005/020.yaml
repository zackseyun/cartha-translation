  yaml_path: translation/nt/1_thessalonians/005/020.yaml
  text: Do not despise prophecies[a].
translation:
  language: zh_hans
  text: 不要藐视先知讲论[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“预言”。
    reason: lexical_alternative
lexical_decisions:
- source_word: προφητείας
  choice: 先知性的信息
  rationale: 该词是阴性复数宾格，指多次或多项先知性言说，而非仅指抽象的“预言”概念。“先知性的信息”在现代汉语中较自然，也避免把所指局限为对未来之事的预告。
- source_word: μὴ
  choice: 不要
  rationale: 与现在时命令式连用，构成否定命令；“不要”准确自然，不额外强化为“绝不可”。
- source_word: ἐξουθενεῖτε
  choice: 藐视
  rationale: 该动词表示视为无物、轻看或以轻蔑态度对待。“藐视”简洁而有力度，既包含轻蔑，也不缩窄为单纯的“拒绝”。
theological_decisions:
- issue: 初代基督徒群体语境中 προφητείας 的含义
  choice: 用“先知性的信息”保留其为先知性言说的宽泛含义，不限定其具体运作方式或归入后世某一教义体系。
  alternative: 预言；先知讲论；宣称来自上帝的信息
  rationale: 原文指群体中的先知性表达，但本节没有界定其机制、内容范围或在后世教会中的延续问题。译文不应导入停止论或持续论等宗派结论。
translation_notes:
  register: 采用现代、庄重而易懂的命令句。“藐视”准确保留原文轻看、视为无物的力度；“先知性的信息”比现代汉语中常被理解为预测未来的“预言”更能涵盖 προφητείας 的语义，同时脚注保留另一种简洁译法。
