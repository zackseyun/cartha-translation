  text: Pray without ceasing[a].
translation:
  language: zh_hans
  text: 要不住地祷告[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“要常常祷告”，或“要持续祷告”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδιαλείπτως
  choice: 不住地
  rationale: 该副词表示持续不断或经常而恒切的方式。“不住地”是现代中文中简洁、庄重且为普通读者熟悉的表达，保留了原文的强烈持续意味，同时不必理解为每分每秒都在口头祷告。
- source_word: προσεύχεσθε
  choice: 要……祷告
  rationale: 这是第二人称复数的现在时命令式，向群体发出持续性的劝勉。中文用“要……祷告”自然表达命令或劝勉，其持续性由“不住地”充分体现。
theological_decisions:
- issue: 命令在实践中的含义
  choice: 这是对恒切、持续祷告的普遍劝勉。
  alternative: 按极端字面理解为每时每刻都必须不间断地作明确的口头祷告。
  rationale: 现在时命令式与副词 ἀδιαλείπτως 结合，强调祷告生活的持续性和恒切性。正文保留原文的力度，脚注提供较自然的词义表达，但不加入特定教派或禁欲主义解释。
translation_notes:
  register: 采用现代、简明而庄重的标准普通话。“不住地祷告”兼具传统熟悉度和当代可懂度；加入“要”使独立经节中的劝勉语气自然明确。
