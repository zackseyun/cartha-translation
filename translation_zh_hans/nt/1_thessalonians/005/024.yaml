  text: πιστὸς ὁ καλῶν ὑμᾶς, ὃς καὶ ποιήσει.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/024.yaml
  text: Faithful is the one who calls you[a], who also will do it.
translation:
  language: zh_hans
  text: 那召你们的信实可靠，他也必成就这事。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那召你们的是可信的，他也必使这事实现。”
    reason: 提供πιστός与ποιήσει的词义替代译法，同时保留原文简洁而未明说宾语的特点。
lexical_decisions:
- source_word: πιστὸς
  choice: 信实可靠
  rationale: 该词作表语，强调那位呼召者可信、可靠。中文用“信实可靠”既保留“信实”的神学语感，也让普通读者直接明白其可靠性。
- source_word: ὁ καλῶν
  choice: 那召……的
  rationale: 带冠词的现在分词作名词用，指持续施行呼召的那一位；“那召你们的”在现代中文中自然，并保留原文的分词结构。
- source_word: ὑμᾶς
  choice: 你们
  rationale: 明确保留第二人称复数，表明对象是帖撒罗尼迦信徒群体。
- source_word: ὃς καὶ
  choice: 他也
  rationale: 中文不宜机械复制关系代词结构；“他也”自然表达原文的承接与强调：发出呼召的正是将采取行动的那一位。
- source_word: ποιήσει
  choice: 必成就这事
  rationale: 该将来时动词本义宽泛，可指“做、成就”。结合上一节关于使人完全成圣并蒙保守的祈愿，“必成就这事”既补足中文所需的宾语，又不细化原文未说明的方式。
theological_decisions:
- issue: ποιήσει省略的宾语
  choice: 以“这事”回指上一节所祈求的成圣与保守
  alternative: “必做成”或“必使之实现”
  rationale: 希腊文没有明说宾语，语境却自然指向5:23的祈愿。译文采用概括性的“这事”，保留指代范围，不把它缩窄为某一种具体神学机制。
- issue: πιστός所强调的属性
  choice: 译作“信实可靠”，兼顾忠信与可信赖
  alternative: 只译“信实”或“可信”
  rationale: 原词在此强调神作为呼召者必可信赖。双词表达能在自然现代中文中呈现其语义幅度，同时避免将经文解释成关于人的信心。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“那召你们的”保留原文紧凑结构；“信实可靠”避免单用较教会化的词语造成理解障碍；“必成就这事”与前文衔接，并保持有力的应许语气。
