  text: But test everything[a]; hold fast to what is good.
translation:
  language: zh_hans
  text: 但凡事都要察验[a]；要持守美善。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一切事”。按上下文，这尤其包括察验预言。
    reason: 说明πάντα可译为“一切事”，并指出紧邻的预言语境；正文仍保留原文未明示限缩的宽泛范围。
lexical_decisions:
- source_word: πάντα
  choice: 凡事
  rationale: 中性复数宾格具有概括性；“凡事”自然、简洁，并保留原文宽泛的范围，不将其限定为预言。
- source_word: δὲ
  choice: 但
  rationale: δέ在此承接前文并带有温和的转折意味；“但”能自然表达从“不要藐视预言”转向审慎察验的平衡。
- source_word: δοκιμάζετε
  choice: 都要察验
  rationale: 现在时主动命令式表达持续实行的评估与检验；“察验”兼具仔细审察和判断真伪、优劣之意。加入“都”使“凡事”与动词的关系在现代汉语中更顺畅。
- source_word: τὸ καλὸν
  choice: 美善的
  rationale: 带冠词的中性单数形容词作名词使用，指经察验后被认定为好的事物；“美善的”保留道德与价值层面的正面含义。
- source_word: κατέχετε
  choice: 要持守
  rationale: 该命令式在此指牢牢保有并坚持经察验为善的事；“持守”比“保留”更能体现持续而坚定的遵行。
theological_decisions:
- issue: πάντα在预言与辨别语境中的范围
  choice: 译为宽泛的“凡事”，同时由上下文表明这尤其涉及对预言性言论的察验。
  alternative: 限定译为“所有预言”或“所说的一切话”。
  rationale: 紧接的上文谈到不可藐视预言，但希腊文使用宽泛的πάντα，没有明说限定对象。正文因此保留其广度，不以解释性翻译缩窄命令的范围。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“察验”和“持守”略具经文语体色彩，但在当代基督教语境中清楚自然；标点保留两个并列命令之间的紧密逻辑关系。
