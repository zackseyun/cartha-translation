  text: ὁρᾶτε μή τις κακὸν ἀντὶ κακοῦ τινι ἀποδῷ, ἀλλὰ πάντοτε τὸ ἀγαθὸν ⸀διώκετε εἰς ἀλλήλους καὶ εἰς πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/015.yaml
  text: See to it that no one repays evil for evil to anyone[b][a], but always pursue what is good toward one another and toward all people.
translation:
  language: zh_hans
  text: 你们要留心，免得有人对任何人以恶报恶[a]；反要始终追求良善，彼此这样相待，对待众人也要这样[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“要谨慎，免得有人对任何人以恶报恶。”
    reason: 原文ὁρᾶτε μή τις既可用直接禁止式表达，也可较形式对应地译为“要谨慎，免得有人……”。
  - marker: b
    text: “彼此……众人”很可能是从信徒群体内部扩大到所有人。
    reason: 说明两个并列对象所呈现的可能范围变化，同时不把这一解释直接写入正文。
lexical_decisions:
- source_word: ὁρᾶτε
  choice: 你们要留心
  rationale: 该复数命令式在这里不是指肉眼观看，而是劝勉整个群体警醒留意；“你们要留心”自然地保留了共同监督和谨慎防范的语气。
- source_word: μή τις
  choice: 不可有人
  rationale: μή τις在ὁρᾶτε之后引出应当防止的事。“不可有人”既表达禁止，也保留原文不特指某个人的范围。
- source_word: κακὸν ἀντὶ κακοῦ
  choice: 以恶报恶
  rationale: 这是表示报复的固定结构；“以恶报恶”保留了κακόν的重复、道德广度以及简洁有力的对称形式。
- source_word: τινι
  choice: 对任何人
  rationale: 与ἀποδῷ相连，表示报还行为所针对的对象；“任何人”传达不定代词在否定语境中的全面范围。
- source_word: ἀποδῷ
  choice: 报
  rationale: 此处指因先前所受之恶而回报；与“以恶报恶”组成自然、准确的现代汉语表达。
- source_word: πάντοτε
  choice: 常常
  rationale: 表达持续而普遍的时间范围；“常常”符合现代汉语圣经语体，并避免把命令弱化为偶尔为之。
- source_word: τὸ ἀγαθὸν
  choice: 良善
  rationale: 冠词使形容词实体化，指道德上良善的事或行为。“良善”保留其概括性，没有将含义缩窄为某一种具体善行。
- source_word: διώκετε
  choice: 追求
  rationale: 该词在此表示积极、持续地竭力趋向某事；“追求”保留命令中主动而有力的意味。
- source_word: εἰς ἀλλήλους
  choice: 彼此这样相待
  rationale: εἰς表示行动所朝向的对象。汉语用“彼此这样相待”自然承接“追求良善”，同时保留群体内部相互关系的方向。
- source_word: καὶ εἰς πάντας
  choice: 对待众人也要这样
  rationale: “众人”保留πάντας的广泛范围；“也要这样”呈现καί所连接的并列和范围扩展，而不在正文中强行界定“众人”的身份。
theological_decisions:
- issue: 伦理责任的范围
  choice: 正文先说信徒“彼此”相待，继而说同样对待“众人”，保留从群体内部向更广范围延伸的自然读法。
  alternative: “众人”只指所有信徒。
  rationale: εἰς ἀλλήλους καὶ εἰς πάντας将“彼此”与“众人”并列，最自然地呈现范围扩大；但译文不添加“世人”或“非信徒”，以免消除原文仍可能存在的范围张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“以恶报恶”保留原文的对称力度；后半句略作汉语句法调整，以“这样相待”清楚呈现良善行动所指向的两组对象。所有代词和命令语气均体现这是对群体的劝勉。
