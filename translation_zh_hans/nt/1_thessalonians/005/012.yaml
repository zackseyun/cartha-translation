source:
  edition: SBLGNT
  text: Ἐρωτῶμεν δὲ ὑμᾶς, ἀδελφοί, εἰδέναι τοὺς κοπιῶντας ἐν ὑμῖν καὶ προϊσταμένους ὑμῶν ἐν κυρίῳ καὶ νουθετοῦντας ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/012.yaml
  text: We ask you[a], brothers, to acknowledge those who labor among you and lead you in the Lord and admonish you[c][b],
translation:
  language: zh_hans
  text: 弟兄们[a]，我们请你们重视[b]那些在你们中间辛劳、在主里带领你们[c]并劝戒你们的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“弟兄姊妹”；希腊文为“弟兄们”，这里是对会众的称呼。
    reason: lexical_alternative
  - marker: b
    text: 或译“认可”或“承认他们”。
    reason: lexical_alternative
  - marker: c
    text: 或译“在主里治理你们”或“在主里照管你们”。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐρωτῶμεν
  choice: 我们请
  rationale: ἐρωτάω在这里引出温和而郑重的牧养请求，不是命令；“我们请”自然保留其语气。
- source_word: δὲ
  choice: 不单独译出
  rationale: δὲ在此主要标示轻微的段落转折；中文无需机械添加“现在”或“但是”，省译更自然。
- source_word: ἀδελφοί
  choice: 弟兄们
  rationale: 保留希腊文阳性复数称呼的形式；按会众语境，它可涵盖全体信徒，另以脚注说明。
- source_word: εἰδέναι
  choice: 敬重
  rationale: εἰδέναι字面为“知道”，此处按习语指承认其身份与工作的价值。“敬重”能自然表达这种带有重视意味的认可，而不引入服从或崇敬等更强含义。
- source_word: κοπιῶντας
  choice: 辛劳
  rationale: κοπιάω强调付出艰苦努力；“辛劳”简洁保留其强度。
- source_word: ἐν ὑμῖν
  choice: 在你们中间
  rationale: 表示这些人的服事发生在会众之中，译法直接自然。
- source_word: προϊσταμένους
  choice: 带领你们
  rationale: προΐστημι可表示领导、管理或照管；“带领”既保留实际权柄，也避免加入特定宗派的职制观。
- source_word: ἐν κυρίῳ
  choice: 在主里
  rationale: 保留原文关系和范围上的开放性，表明其带领是在与主的关系中进行。
- source_word: νουθετοῦντας
  choice: 劝戒你们
  rationale: νουθετέω兼有劝勉、提醒和纠正之意；“劝戒”能同时体现牧养关怀与纠正力度。
theological_decisions:
- issue: 会众称呼ἀδελφοί的范围
  choice: 正文译“弟兄们”，脚注说明也可指“弟兄姊妹”
  alternative: 正文直接译“弟兄姊妹”
  rationale: 正文保留原文阳性复数形式，同时不否认在此语境中称呼全体会众的包容范围。
- issue: εἰδέναι用于会众对服事者的态度
  choice: 敬重
  alternative: 承认、认清
  rationale: 此处并非单指认知，而是要求会众认可并重视这些人的服事；“敬重”不必然包含无条件服从，故未强化为更高的教会权威主张。
- issue: προϊσταμένους ὑμῶν ἐν κυρίῳ的权柄含义
  choice: 在主里带领你们
  alternative: 在主里治理你们／在主里照管你们
  rationale: 原词可兼含领导、管理和关顾。“带领”保留权柄因素，却不把某一种教会制度或职位强加给经文；较直译的可能性列入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“辛劳”“带领”“劝戒”保持平行的分词结构；将“弟兄们”前置作呼语，符合自然中文表达。所有脚注标记均置于相关词语之后。
