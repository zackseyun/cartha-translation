  yaml_path: translation/nt/1_thessalonians/005/007.yaml
  text: For those who sleep, sleep at night, and those who get drunk, get drunk at night.
translation:
  language: zh_hans
  text: 因为睡觉的人是在夜里睡；醉酒的人是在夜里醉。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γὰρ
  choice: 因为
  rationale: 承接上一节的劝勉，说明其理由；现代汉语中用“因为”能自然保留解释性的连接作用。
- source_word: οἱ καθεύδοντες ... καθεύδουσιν
  choice: 睡觉的人……睡
  rationale: 将冠词化分词概括地译为“睡觉的人”，并在谓语中重复“睡”，保留原文的修辞重复及与后半句的平行结构。
- source_word: νυκτός
  choice: 在夜里
  rationale: 该属格作副词用，表达时间；“在夜里”自然、清楚，并在两个平行分句中均得到体现。
- source_word: οἱ μεθυσκόμενοι ... μεθύουσιν
  choice: 醉酒的人……醉
  rationale: μεθύσκομαι与μεθύω在此共同描写醉酒这一习惯性行为或状态。译作“醉酒的人……醉”既简洁自然，也尽量保存原文同根概念的重复。
- source_word: καί
  choice: 也
  rationale: 连接两个平行分句；“也”在汉语中明确表现对应和递进平行，比直译为“和”更自然。
theological_decisions:
- issue: 解释性比喻中的睡觉与醉酒应按字面还是按隐喻翻译
  choice: 正文保留字面意象“睡”和“醉”
  alternative: 直接译为属灵麻木和道德放纵
  rationale: 本节以夜间常见的行为说明上文关于警醒与谨守的劝勉。保留字面措辞可维持类比及其张力，避免把解释直接写进译文。
- issue: “醉”所表达的是成为醉酒还是处于醉酒状态
  choice: 采用可兼容行为与状态的“醉”
  alternative: 译作“喝醉”或“处于醉酒状态”
  rationale: 希腊文前后使用相关但不同的动词形式，语境可涵盖醉酒的发生及状态；汉语“醉”保持简洁，并不强行限定其中一面。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“睡觉的人是在夜里睡，醉酒的人也是在夜里醉”保留原文刻意的重复和平行；加入“是……也……”使汉语逻辑连贯，但不将字面图像解释为属灵含义。
