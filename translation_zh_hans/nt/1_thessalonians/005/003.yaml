  text: ⸀ὅταν λέγωσιν· Εἰρήνη καὶ ἀσφάλεια, τότε αἰφνίδιος αὐτοῖς ἐφίσταται ὄλεθρος ὥσπερ ἡ ὠδὶν τῇ ἐν γαστρὶ ἐχούσῃ, καὶ οὐ μὴ ἐκφύγωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/003.yaml
  text: When they say[a], “Peace and security,” then sudden destruction comes upon them, like labor pains upon a pregnant woman[c][b], and they will certainly not escape.
translation:
  language: zh_hans
  text: 当人们说：“平安稳妥！”[a]时，毁灭就会突然临到他们，如同产痛临到孕妇；他们绝不能逃脱。[c][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “稳妥”或译“安全”。
    reason: lexical_alternative
  - marker: b
    text: “产痛”或译“分娩的阵痛”。
    reason: lexical_alternative
  - marker: c
    text: 希腊文采用强调否定，意思是“他们绝无可能逃脱”。
    reason: source_emphasis
lexical_decisions:
- source_word: ὅταν λέγωσιν
  choice: 当人们说
  rationale: ὅταν与虚拟语气动词构成指向将来的不定时间从句；“当……时”符合本段预告性的语境。希腊文主语是不明确的第三人称复数，译作“人们”可自然保留其泛指性质。
- source_word: Εἰρήνη καὶ ἀσφάλεια
  choice: 平安稳妥
  rationale: εἰρήνη表示“平安”，ἀσφάλεια表示“安全、安稳、稳妥”。“平安稳妥”在中文中简洁自然，适合表现一种自信的公开断言，同时不额外说明这种安全感的来源。
- source_word: τότε
  choice: 那时
  rationale: 明确标示前述宣告之后随即出现的结果，符合希腊文的时间与推论衔接。
- source_word: αἰφνίδιος αὐτοῖς ἐφίσταται ὄλεθρος
  choice: 毁灭就突然临到他们
  rationale: αἰφνίδιος强调突如其来，ἐφίσταται在此表示临到、袭来，ὄλεθρος表示毁灭或败亡。“毁灭就突然临到”既保留严重性，也不把毁灭的具体性质解释为某一种教义结论。
- source_word: ὥσπερ ἡ ὠδὶν τῇ ἐν γαστρὶ ἐχούσῃ
  choice: 如同产痛临到孕妇一样
  rationale: ὠδίν指分娩时的疼痛；“产痛”简洁而准确。τῇ ἐν γαστρὶ ἐχούσῃ直指怀孕的人，现代汉语自然译作“孕妇”。补出第二个“临到”，使比较关系在中文中清楚。
- source_word: οὐ μὴ ἐκφύγωσιν
  choice: 他们绝不能逃脱
  rationale: οὐ μή加不定过去时虚拟语气构成强调性的将来否定；“绝不能”自然传达“断然不会、绝无可能”的强烈语气。
theological_decisions:
- issue: 末世警告中ὄλεθρος的性质
  choice: 译作“毁灭”，不进一步界定其方式或持续时间
  alternative: “败亡”或“灾祸”
  rationale: ὄλεθρος表达决定性毁坏或败亡，但本节本身并未具体说明这是消灭、持续受罚，还是其他形式的审判。因此保留警告的严厉性，而不把特定末世论体系写入译文。
- issue: “平安稳妥”宣告者的身份
  choice: 保留为泛指的“人们”
  alternative: “他们”或特指某一群体
  rationale: 希腊文仅用未明确主语的第三人称复数，并未在本节点明特定政治、宗教或社会群体；译文不擅自限定其身份。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“平安稳妥”保留宣告式的简短有力；“毁灭就突然临到”突出意外性；结尾用“绝不能”再现希腊文的强调否定。所有脚注标记均放在其所说明的词句之后。
