  yaml_path: translation/nt/1_thessalonians/005/028.yaml
  text: The grace of our Lord Jesus Christ be with you[a].
translation:
  language: zh_hans
  text: 愿我们主耶稣基督的恩典与你们同在。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάρις
  choice: 恩典
  rationale: 在保罗书信的祝福语中，χάρις指上帝借着基督所赐的恩惠；“恩典”既准确保留其神学含义，也符合现代中文圣经语体。
- source_word: κυρίου
  choice: 主
  rationale: κύριος在此是耶稣的尊称；译作“主”可保留其基督论分量及新约惯用表达。
- source_word: Ἰησοῦ Χριστοῦ
  choice: 耶稣基督
  rationale: 按现代标准中文的通行译名处理；“基督”保留Χριστός作为受膏者称号的传统且易懂的表达。
- source_word: μεθ’ ὑμῶν
  choice: 与你们同在
  rationale: 原文直译为“与你们同在”，省略了动词；中文祝福语补出“愿”，自然表达原文隐含的祈愿语气。
theological_decisions:
- issue: 无动词祝福公式的语气
  choice: 补出“愿”以表达祈愿
  alternative: 仅译“我们主耶稣基督的恩典与你们同在”
  rationale: 希腊文是无动词的书信结尾祝福公式。补出“愿”并未把祝福改成事实陈述，而是自然呈现其祈愿功能。
- issue: Χριστοῦ的译法
  choice: 基督
  alternative: 弥赛亚
  rationale: Χριστός本义为“受膏者”，但在固定称呼“耶稣基督”中已具有较强的专名化色彩；“基督”是现代中文中自然、庄重且广为理解的对应词，同时不排除其称号含义。
translation_notes:
  register: 采用现代、庄重而易懂的书信祝福语体。“你们”明确保留第二人称复数；句末使用句号，呈现简洁有力的全书结语。
