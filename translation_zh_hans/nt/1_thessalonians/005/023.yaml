id: 1TH.5.23
reference: 1 Thessalonians 5:23
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Αὐτὸς δὲ ὁ θεὸς τῆς εἰρήνης ἁγιάσαι ὑμᾶς ὁλοτελεῖς, καὶ ὁλόκληρον ὑμῶν τὸ πνεῦμα καὶ ἡ ψυχὴ καὶ τὸ σῶμα ἀμέμπτως ἐν τῇ παρουσίᾳ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ τηρηθείη.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/023.yaml
  text: May the God of peace himself sanctify you completely[b][a], and may your whole spirit and soul and body be kept blameless at the coming of our Lord Jesus the Messiah.
translation:
  language: zh_hans
  text: 愿赐平安的上帝亲自使你们完全成圣；又愿你们的灵、魂和身体[b]全然得蒙保守，在我们的主耶稣弥赛亚[a]来临时无可指责。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我们的主耶稣弥赛亚”传统译作“我们的主耶稣基督”。
    reason: alternative_reading
  - marker: b
    text: 原文逐一提到“灵、魂和身体”。对于这是否表明人由三个部分构成，还是以此强调完整的全人，解释者意见不一。
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτὸς
  choice: 亲自
  rationale: 保留加强语气，强调上帝本人是使人成圣的那一位。
- source_word: δὲ
  choice: 不单独译出
  rationale: 此处主要标示转入祝愿或祷告；汉语可借句式和上下文自然体现，无须机械加上“现在”或“但”。
- source_word: ὁ θεὸς τῆς εἰρήνης
  choice: 赐平安的上帝
  rationale: 属格表达可指以平安为特征并赐下平安的上帝；此译法在现代汉语中自然，也保留保罗称谓的核心意义。
- source_word: ἁγιάσαι
  choice: 愿……使……成圣
  rationale: 不定过去时祈愿式表达祝愿或祷求；“成圣”保留与圣洁相关的神学和词汇联系。
- source_word: ὑμᾶς
  choice: 你们
  rationale: 第二人称复数，指帖撒罗尼迦信徒群体。
- source_word: ὁλοτελεῖς
  choice: 完全
  rationale: 表达彻底、全面的成圣，与后文整体性的表述相呼应。
- source_word: ὁλόκληρον
  choice: 整个的人
  rationale: 该词强调完整无缺；结合后面的灵、魂和身体，译为“整个的人”使汉语关系清楚，同时不抹去三项列举。
- source_word: τὸ πνεῦμα καὶ ἡ ψυχὴ καὶ τὸ σῶμα
  choice: 灵、魂和身体
  rationale: 逐项保留原文三重表达，不把“灵”和“魂”合并，也不据此强行建立特定的人论体系。
- source_word: ἀμέμπτως
  choice: 无可指责
  rationale: 表达蒙保守时所处的无可责备状态，现代汉语自然且贴近原义。
- source_word: τηρηθείη
  choice: 愿……都蒙保守
  rationale: 不定过去时被动祈愿式；“蒙保守”保留被动含义，并表明保守的施行者未在此分句明说。
- source_word: ἐν τῇ παρουσίᾳ
  choice: 直到……来临的时候
  rationale: παρουσία在此指主末后的来临；配合“蒙保守”，汉语用“直到……的时候”自然表达保守持续至该时点。
- source_word: Χριστοῦ
  choice: 弥赛亚
  rationale: Χριστός在此是称号；译出其“受膏者／弥赛亚”含义，而不只作音译。
theological_decisions:
- issue: “灵、魂和身体”是否界定人为三个组成部分
  choice: 保留三项原文，并以“整个的人”凸显整体性
  alternative: 将三项解释为严格的三分人论，或将“灵、魂”合并为一个概念
  rationale: 原文明确列出三项，却没有在本节系统说明它们彼此的本体关系；译文应保留措辞及其神学张力，不替作者解决争议。
- issue: Χριστός的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 该词本义为“受膏者”，在耶稣名后用作称号；正文译为“弥赛亚”，传统译法“基督”置于脚注。
- issue: 保守持续至何时
  choice: 直到……来临的时候
  alternative: 在……来临的时候
  rationale: ἐν可直译为“在”，但与τηρηθείη搭配时可理解为保守完整无可指责直至主来；正文采用自然汉语表达，脚注保留较形式对应的译法。
translation_notes:
  register: 采用现代、庄重而易懂的祷愿语体。“愿……；又愿……”体现两个希腊语祈愿式。“整个的人，就是……”使汉语层次清晰，同时忠实保留灵、魂、身体的三项列举。所有脚注标记均置于正文句末。
