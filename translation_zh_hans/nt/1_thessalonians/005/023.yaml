    rationale: ἐν τῇ παρουσίᾳ字面为“在……来临/显现时”。虽然“蒙保守直到”在汉语中合理，但正文宜保留原文的时间关系，避免把可推知的持续含义固定为唯一表达。
  - severity: medium
    issue: “整个的人，就是……”未充分呈现ὁλόκληρον的“完整无缺”含义
    rationale: 该词不只是指人的整体范围，也表达完整、完好无缺的状态。改为“灵、魂和身体全然得蒙保守”既保留三项，又让整体性与保守的结果更明确。
  - severity: low
