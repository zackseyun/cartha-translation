revisions:
- from: 愿赐平安的上帝亲自使你们完全成圣；又愿你们整个的人，就是灵、魂和身体，都蒙保守，无可指责，直到我们的主耶稣弥赛亚来临的时候。[a][b]
  to: 愿赐平安的上帝亲自使你们完全成圣；又愿你们的灵、魂和身体[b]全然得蒙保守，在我们的主耶稣弥赛亚[a]来临时无可指责。
  rationale: 修订以“在……来临时”对应ἐν τῇ παρουσίᾳ，避免将时间关系过度限定为“直到”。“全然得蒙保守”同时自然表达ὁλόκληρον的完整性及τηρηθείη的被动祈愿，且不把“灵、魂和身体”解释为技术性的三分人论。脚注内容保持原有的审慎性，仅将标记移至对应词语之后。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T03:56:06Z'
review_pass:
  verdict: revise
  source_fidelity: 译文准确保留了两个祈愿语气、上帝亲自行动、完全成圣，以及“灵、魂和身体”的三项列举。惟“直到……来临的时候”将ἐν τῇ παρουσίᾳ明确为持续到某时点，虽可由语境推知，却比原文“在……来临时”更具解释性；并且“整个的人，就是……”未充分清楚地表达ὁλόκληρον所含“完整无缺”的状态。
  naturalness: 原文汉语庄重通顺。“愿……；又愿……”自然地反映祈愿式。修订后以“全然得蒙保守，在……来临时无可指责”可减少“整个的人”与后三项之间的释义性同位关系，并使句法更凝练自然。
  terminology: “成圣”“灵、魂和身体”“无可指责”“弥赛亚”均恰当，且没有把三项列举处理为既定的人论体系。“赐平安的上帝”可保留，既符合现代汉语，也传达保罗惯用称谓的核心含义。
