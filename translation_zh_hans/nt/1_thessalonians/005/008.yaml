id: 1TH.5.8
reference: 1 Thessalonians 5:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἡμεῖς δὲ ἡμέρας ὄντες νήφωμεν, ἐνδυσάμενοι θώρακα πίστεως καὶ ἀγάπης καὶ περικεφαλαίαν ἐλπίδα σωτηρίας·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/008.yaml
  text: But since we are of the day[a], let us be sober, having put on the breastplate of faith and love[b], and the hope of salvation as a helmet.
translation:
  language: zh_hans
  text: 但我们既属白昼，就要保持清醒，穿上信心[a]和爱心的胸甲，把得救的盼望当作头盔[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “信心”或译“信实”。希腊语πίστις可表示信心、信靠或信实；这里正文采用“信心”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“并以得救的盼望为头盔”。
    reason: alternative_rendering
lexical_decisions:
- source_word: ἡμεῖς δὲ
  choice: 但我们
  rationale: δέ承接上文，与属黑夜的人形成对比；“但我们”自然保留这一转折。
- source_word: ἡμέρας ὄντες
  choice: 既属白昼
  rationale: 属格ἡμέρας与ὄντες表达归属或所处领域，而非单指白天这一时段。“属白昼”保留保罗的昼夜隐喻，“既”则自然呈现该分词短语与劝勉之间的逻辑关系。
- source_word: νήφωμεν
  choice: 就要保持清醒
  rationale: νήφω既可指不醉，也可引申为警醒、自制；“保持清醒”在昼夜与警醒的语境中保留这两层呼应，又符合现代汉语表达。
- source_word: ἐνδυσάμενοι
  choice: 穿上
  rationale: 该不定过去时中间语态分词伴随主要劝勉，描写保持清醒时所采取的行动；汉语以连动式“穿上”表达最自然，不必生硬标明先后。
- source_word: θώρακα
  choice: 胸甲
  rationale: 这是明确的军事装备用语；“胸甲”准确保留披戴军装的比喻。
- source_word: πίστεως
  choice: 信心
  rationale: πίστις在此与爱和盼望组成德行组合，“信心”是贴切且常用的译法；“信实”仍是词义上可能的理解，收入脚注。
- source_word: ἀγάπης
  choice: 爱心
  rationale: 在与信心、盼望并列的德行语境中，“爱心”比单独的“爱”更清楚地表达人的品格与实践。
- source_word: περικεφαλαίαν
  choice: 头盔
  rationale: 这是标准军事用语，直接保留原文的护具意象。
- source_word: ἐλπίδα σωτηρίας
  choice: 得救的盼望
  rationale: σωτηρίας最自然地限定盼望的内容或指向；“得救的盼望”是现代汉语中自然、清楚的表达，并保留“信心、爱心、盼望”的组合。
theological_decisions:
- issue: πίστις在胸甲比喻中的含义
  choice: 信心
  alternative: 信实；信靠
  rationale: 原词可指信心、信靠或信实。这里它与爱心及得救的盼望并列，更可能表示“信心”，但不排除“信实”的品格含义，因此不在正文中强行消除其词义范围，而以脚注保留另一可能。
- issue: ἡμέρας ὄντες所表达的归属
  choice: 既属白昼
  alternative: 既是白昼的人；既在白昼中
  rationale: 该短语在上下文中不只是说明时间，也用昼夜意象表达身份与生活领域。“属白昼”既保留隐喻，也不额外说明其神学内涵。
- issue: ἐλπίδα σωτηρίας与περικεφαλαίαν的关系
  choice: 把得救的盼望当作头盔
  alternative: 并以得救的盼望为头盔
  rationale: 原文以“头盔”与“得救的盼望”并置，后者说明头盔所代表的内容。正文用自然汉语明示这一比喻关系，但不将“救恩”进一步限定为现在或将来。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“属白昼”保留原文核心隐喻；“保持清醒”兼顾不醉与警醒自制的语义；军装意象以“胸甲”“头盔”直译。句式避免照搬希腊语词序，同时保留信心、爱心、盼望的修辞组合。
