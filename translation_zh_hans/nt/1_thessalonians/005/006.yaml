  text: ἄρα οὖν μὴ καθεύδωμεν ⸀ὡς οἱ λοιποί, ἀλλὰ γρηγορῶμεν καὶ νήφωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/006.yaml
  text: So then[a], let us not sleep as the rest do[b], but let us stay awake and be sober.
translation:
  language: zh_hans
  text: 所以，我们不要像其余的人那样沉睡，却要警醒，保持清醒。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “保持清醒”也可译作“不醉”或“保持自制”。原文这个词既有清醒不醉的意思，也可引申为头脑清楚、警觉而有节制。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα οὖν
  choice: 所以
  rationale: 两个推论性小词合用，承接上文并引出劝勉性的结论；“所以”在现代汉语中自然简洁。
- source_word: μὴ καθεύδωμεν
  choice: 我们不要……沉睡
  rationale: μή加现在时虚拟语气构成第一人称复数劝勉；“沉睡”保留原文睡眠的比喻，不直接释为属灵麻木。
- source_word: ὡς οἱ λοιποί
  choice: 像其余的人那样
  rationale: οἱ λοιποί指与信徒相对的其余人；此译不额外界定他们的身份。
- source_word: ἀλλὰ
  choice: 却要
  rationale: 表达与前面“不要”相对的鲜明转折，并自然引出正面劝勉。
- source_word: γρηγορῶμεν
  choice: 警醒
  rationale: 该词既可指醒着，也可强调警觉；“警醒”在汉语中保留醒与警觉两层含义，并与“沉睡”形成对照。
- source_word: νήφωμεν
  choice: 保持清醒
  rationale: νήφω本指不醉，也引申为头脑清醒、克制警觉；“保持清醒”在现代汉语中自然，并以脚注保留“不醉／自制”的词义范围。
theological_decisions:
- issue: 睡眠与警醒的比喻力量
  choice: 在正文保留“沉睡／警醒”的意象，作为伦理和属灵劝勉。
  alternative: 直接意译为“不要麻木大意，却要保持警觉”。
  rationale: 上下文以黑夜、白昼和光明之子形成神学意象；保留比喻可避免替原文过度解释。
- issue: νήφω的语义张力
  choice: 正文译作“保持清醒”，脚注说明也可理解为“不醉”或“自制”。
  alternative: 正文译作“保持自制”或“保持头脑清醒”。
  rationale: 原词兼有清醒不醉与引申的警觉克制之意；正文采用自然汉语，同时用脚注保留其词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“沉睡／警醒”保留保罗的核心对照；“保持清醒”避免生硬的“谨守”，脚注则呈现νήφω更完整的语义范围。
