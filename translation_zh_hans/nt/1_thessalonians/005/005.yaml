  text: πάντες ⸀γὰρ ὑμεῖς υἱοὶ φωτός ἐστε καὶ υἱοὶ ἡμέρας. οὐκ ἐσμὲν νυκτὸς οὐδὲ σκότους·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/005.yaml
  text: For you are all sons of light and sons of day[a]. We are not of night or of darkness.
translation:
  language: zh_hans
  text: 因为你们都是光明之子，都是白昼之子[a]。我们不属于黑夜，也不属于黑暗。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“光明的儿女，白昼的儿女”。希腊原文直译为“光明之子，白昼之子”，是指具有光明和白昼特征、归属于光明和白昼的人，并非只指男性。
    reason: 词语替代与性别包举意义说明
lexical_decisions:
- source_word: πάντες
  choice: 都
  rationale: 与“你们”连用，准确表达全体、无一例外的强调，同时符合现代汉语习惯。
- source_word: γάρ
  choice: 因为
  rationale: 保留本句对上文所作的解释，清楚呈现论证关系。
- source_word: υἱοὶ
  choice: 之子
  rationale: 原文用阳性复数“儿子”，此处是闪语式归属表达，指具有某种特征或属于某一领域的人；正文用“之子”保留其家族隐喻和庄重语体，脚注说明可按包举意义译为“儿女”。
- source_word: φωτός
  choice: 光明
  rationale: 保留光与黑暗的核心比喻；“光明之子”在现代汉语中简洁而庄重。
- source_word: ἡμέρας
  choice: 白昼
  rationale: “白昼”比单用“日”更自然地与“黑夜”构成鲜明对应，并保留原文的昼夜意象。
- source_word: οὐκ ἐσμὲν
  choice: 我们不属于
  rationale: 保留原文从第二人称复数“你们”转为第一人称复数“我们”的变化；补出“属于”以自然表达属格所含的归属关系。
- source_word: νυκτός
  choice: 黑夜
  rationale: 自然呈现与“白昼”相对的领域和归属意象。
- source_word: σκότους
  choice: 黑暗
  rationale: 保留原文与“光明”相对的道德和属灵比喻。
theological_decisions:
- issue: υἱοὶ φωτός / υἱοὶ ἡμέρας 中带性别的亲属隐喻
  choice: 光明之子，白昼之子
  alternative: 光明的儿女，白昼的儿女
  rationale: 原文明确使用阳性复数 υἱοί，但在此为包举性的惯用表达，描述归属和特征。正文保留“子”的形式和隐喻，脚注则交代其并非只指男性，并提供自然的包举性译法。
- issue: 从第二人称复数转为第一人称复数
  choice: 你们都是……我们不属于……
  alternative: 你们都是……你们不属于……
  rationale: 原文有明确的人称转换，可能把保罗及其同工包括在内；保留这一转换，避免将其无根据地协调一致。
- issue: νυκτός 与 σκότους 的属格关系
  choice: 不属于黑夜，也不属于黑暗
  alternative: 不是黑夜的，也不是黑暗的
  rationale: 属格表达所属或所处领域；译出“属于”既保持比喻，又使现代汉语清楚自然，而不把它缩减为单纯的性质描述。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“光明之子／白昼之子”保留原文对称的亲属隐喻；后半句用“不属于”明确属格的归属含义。保留“你们”到“我们”的人称转换。
