  text: παρακαλοῦμεν δὲ ὑμᾶς, ἀδελφοί, νουθετεῖτε τοὺς ἀτάκτους, παραμυθεῖσθε τοὺς ὀλιγοψύχους, ἀντέχεσθε τῶν ἀσθενῶν, μακροθυμεῖτε πρὸς πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/014.yaml
  text: And we urge you[a], brothers, admonish the disorderly, encourage the fainthearted, help the weak[d][c][b], be patient with everyone.
translation:
  language: zh_hans
  text: 弟兄们[a]，我们还劝你们：要劝戒不守规矩的人[b]，勉励灰心的人[c]，扶持软弱的人[d]，对所有人都要有耐心。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“弟兄姊妹们”；保罗是在对全体会众说话。
    reason: alternative_reading
  - marker: b
    text: “不守规矩的人”也可译作“懒散的人”或“不守秩序的人”。
    reason: lexical_alternative
  - marker: c
    text: “勉励灰心的人”也可译作“安慰气馁的人”。
    reason: lexical_alternative
  - marker: d
    text: “扶持软弱的人”也可译作“帮助软弱的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλοῦμεν
  choice: 我们劝你们
  rationale: 这里是使徒郑重提出教导和请求；“劝”在现代汉语中自然，并保留了恳切劝勉的语气。
- source_word: δέ
  choice: 还
  rationale: 此处主要承接并推进前文，不表示强烈转折；“还”自然体现补充劝勉。
- source_word: ἀδελφοί
  choice: 弟兄们
  rationale: 保留原文阳性复数称呼的形式；根据会众语境，其实际指向包括全体信徒，另以脚注说明。
- source_word: νουθετεῖτε
  choice: 劝戒
  rationale: 该词兼有提醒、告诫和促人改正之意；“劝戒”同时传达牧养关怀与纠正意味。
- source_word: ἀτάκτους
  choice: 不守规矩的人
  rationale: 原词指偏离应有秩序或行为失当的人；此译保留较宽泛的含义，不把它限定为懒惰。
- source_word: παραμυθεῖσθε
  choice: 勉励
  rationale: 该词指以亲切的话安慰、鼓舞人；“勉励”适合此处连续命令的语境。
- source_word: ὀλιγοψύχους
  choice: 灰心的人
  rationale: 该词形容心志低落、缺少勇气的人；“灰心的人”是清楚自然的现代汉语。
- source_word: ἀντέχεσθε
  choice: 扶持
  rationale: 该词与属格宾语连用，可表示紧紧扶住、支持或帮助；“扶持”既保留持续支持的意味，也符合牧养语境。
- source_word: τῶν ἀσθενῶν
  choice: 软弱的人
  rationale: 原词可涵盖身体、心灵、道德或社会处境上的软弱；此译不擅自限定软弱的种类。
- source_word: μακροθυμεῖτε
  choice: 要有耐心
  rationale: 该词表示面对他人时恒久忍耐、不轻易发怒；“有耐心”清楚而符合现代汉语表达。
- source_word: πρὸς πάντας
  choice: 对所有人
  rationale: 介词短语表示面向一切人的态度；“对所有人”准确保留其普遍范围。
theological_decisions:
- issue: ἀδελφοί作为对会众称呼时的包容范围
  choice: 正文译作“弟兄们”，脚注说明也可理解为“弟兄姊妹们”
  alternative: 正文直接译作“弟兄姊妹们”或“各位弟兄姊妹”
  rationale: 正文保留原文阳性复数称呼的形式，同时不掩盖保罗是在对包括男女在内的全体会众说话。
- issue: ἀσθενῶν所指软弱的性质
  choice: 保留为宽泛的“软弱的人”
  alternative: 具体解释为身体患病、信心软弱或社会上无力的人
  rationale: 本节没有明确限定软弱属于哪一方面，故不在正文中消除原文的开放性。
translation_notes:
  register: 采用现代、清楚而庄重的普通话。四个并列命令保持简洁有力；“劝戒、勉励、扶持、有耐心”形成自然的牧养劝勉节奏。
