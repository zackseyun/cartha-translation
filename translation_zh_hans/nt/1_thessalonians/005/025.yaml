  text: Brothers[a], pray for us.
translation:
  language: zh_hans
  text: 弟兄们[a]，请为我们祷告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“弟兄姊妹”，因为这个称呼很可能包括全体会众。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφοί
  choice: 弟兄们
  rationale: 这是 ἀδελφός 的阳性复数呼格。正文保留希腊文的阳性称呼；鉴于所称呼的很可能是全体会众，脚注注明可按包容性所指理解为“弟兄姊妹”。
- source_word: προσεύχεσθε
  choice: 请……祷告
  rationale: 现在时中间/被动形态的第二人称复数命令式，在此为祷告请求。现代汉语用“请……祷告”自然、庄重；现在时可能含持续意味，但本句无需明确增译为“不断祷告”。
- source_word: περὶ
  choice: 为
  rationale: περί 后接属格 ἡμῶν，在祷告请求中表示关切或代求的对象；汉语“为我们祷告”最为自然准确。
- source_word: ἡμῶν
  choice: 我们
  rationale: 第一人称复数属格代词，受 περί 支配，指保罗及其同工；正文不作超出原文的具体化。
theological_decisions:
- issue: 阳性称呼 Ἀδελφοί 是否包括女性会众
  choice: 正文译作“弟兄们”
  alternative: “弟兄姊妹”
  rationale: 正文保留原文阳性复数称呼的形式，不将性别信息静默改写；同时以脚注说明，在当时书信对会众的称呼中，该词很可能包括全体信徒。
translation_notes:
  register: 采用现代、简洁而庄重的普通话。“请”为简短命令增添符合书信劝请语境的自然礼貌色彩；保留“弟兄们”的传统且清楚的教会称呼，并用脚注呈现其可能的包容性所指。
