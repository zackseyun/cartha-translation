translation:
  language: zh_hans
  text: 你们要以圣洁的亲吻向所有弟兄问安[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“所有弟兄姊妹”，因为“弟兄”在这里可能指整个信徒群体。
    reason: lexical_alternative
  - marker: b
    text: “圣洁的亲吻”是当时文化中一种表达基督徒团契和关爱的礼节。
    reason: cultural_note
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: 问候
  rationale: 这是第二人称复数、不定过去时中间语态命令式，在这里是直接劝勉。译作“问候”简洁自然，准确表达社交性的致意。
- source_word: τοὺς ἀδελφοὺς πάντας
  choice: 所有弟兄
  rationale: ἀδελφούς是阳性复数，πάντας强调群体中的每一位。“所有弟兄”既保留原文形式，也自然表达全体之意；其所指可能包括整个信徒群体，故在脚注中说明。
- source_word: ἐν φιλήματι ἁγίῳ
  choice: 用圣洁的亲吻
  rationale: ἐν在此表示伴随的方式或手段，汉语用“用”较自然；φίλημα明确指亲吻，ἁγίῳ表明这种亲吻在信徒团契中分别为圣、纯洁合宜。
theological_decisions:
- issue: 会众语境中ἀδελφοί的性别与所指范围
  choice: 弟兄
  alternative: 弟兄姊妹
  rationale: 原文在语法上使用阳性复数，因此正文保留“弟兄”，不把形式上的性别信息消除；但该词在此很可能泛指整个信徒群体，所以将包容性的理解保留在脚注中。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“亲吻”比“亲嘴”更符合当代书面语体；句首用“要”承载命令式的劝勉语气，避免生硬直译。
