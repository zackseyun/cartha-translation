  text: ὅτι οὐκ ἔθετο ἡμᾶς ὁ θεὸς εἰς ὀργὴν ἀλλὰ εἰς περιποίησιν σωτηρίας διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/009.yaml
  text: For God did not appoint us for wrath[a], but for obtaining salvation through our Lord Jesus the Messiah[b],
translation:
  language: zh_hans
  text: 因为上帝并没有定意让我们承受忿怒，而是要我们借着我们的主耶稣——弥赛亚[b]——获得救恩[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “获得救恩”也可译作“得着救恩”或“拥有救恩”；这里的希腊语名词περιποίησις含义较宽，也可能带有“蒙保守直到得救”的意思。
    reason: lexical_alternative
  - marker: b
    text: 传统译作“基督”。希腊语Χριστός是称号，意思是“受膏者”，相当于“弥赛亚”。
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: ὅτι在此承接上文并说明理由；“因为”自然保留其因果关系。
- source_word: οὐκ ἔθετο ἡμᾶς…εἰς
  choice: 并没有定意让我们……而是要我们……
  rationale: τίθημι与εἰς连用，在这里表达上帝为人所定的旨意或归宿。“定意让”保留目的指向，同时避免用“预定”等词引入原文未明确表达的更强教义含义。
- source_word: ὀργήν
  choice: 烈怒
  rationale: 在保罗书信的末世语境中，ὀργή通常指上帝施行审判的忿怒；“烈怒”比一般的“愤怒”更能传达其庄严分量，又不把该词直接解释成“审判”。
- source_word: περιποίησιν σωτηρίας
  choice: 获得救恩
  rationale: περιποίησις可指取得、得着、拥有，也可能有保全之意；“获得救恩”在现代汉语中自然，并与前面的“承受烈怒”形成结局上的对照。其较宽的词义范围在脚注中保留。
- source_word: διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: 借着我们的主耶稣——弥赛亚
  rationale: διά加属格表示途径或中介，译为“借着”；κύριος译为“主”。Χριστός在此紧随“耶稣”，仍保有称号“受膏者／弥赛亚”的意义，因此正文译作“弥赛亚”，并以破折号明确它是对耶稣的称号。
theological_decisions:
- issue: ἔθετο是否应译成带有更强预定论色彩的措辞
  choice: 定意让我们
  alternative: 预定我们归于
  rationale: 经文明确陈述上帝对信徒结局的旨意，但并未在此系统说明预定论。“定意让”保留神圣旨意与目的，又不替文本解决宗派间的争议。
- issue: Χριστοῦ应作为有实义的称号还是约定俗成、近似姓名的“基督”来翻译
  choice: 弥赛亚
  alternative: 基督
  rationale: Χριστός本义为“受膏者”，对应“弥赛亚”。正文保留称号的语义，传统译法“基督”列入脚注。
- issue: περιποίησις在此指获得、拥有还是保全
  choice: 获得救恩
  alternative: 拥有救恩／得着救恩／蒙保守直到得救
  rationale: 上下文最自然地把它理解为与“承受烈怒”相对的目标或结果，但该名词的语义范围较宽，不能完全排除拥有或保全的色彩，因此以脚注保留歧义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“定意让”避免生硬直译“设立我们归于”，也避免把ἔθετο强化为特定预定论术语；用破折号标明“弥赛亚”是“耶稣”的称号。脚注标记均置于正文相应词语之后。
