  text: Περὶ δὲ τῶν χρόνων καὶ τῶν καιρῶν, ἀδελφοί, οὐ χρείαν ἔχετε ὑμῖν γράφεσθαι,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/001.yaml
  text: Concerning the times and the seasons[a], brothers, you have no need to have anything written to you[b],
translation:
  language: zh_hans
  text: 至于时期和时刻[a]，弟兄们[b]，不需要给你们写什么。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “时期和时刻”是一个配对表达，指不同的时期和特定或指定的时刻；在这里带有末世性的语境。
    reason: cultural_note
  - marker: b
    text: 也可译作“弟兄姊妹们”；希腊原文直译为“弟兄们”，这里很可能是对全体信徒的称呼。
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ
  choice: 至于
  rationale: Περὶ引出话题，δέ标示论述转换。“至于”自然地表达转题，不把δέ强化为明显的转折，也不增添原文没有的时间副词。
- source_word: τῶν χρόνων καὶ τῶν καιρῶν
  choice: 那些时期和时刻
  rationale: χρόνος侧重时间的延续或时期，καιρός侧重特定、合宜或指定的时刻。“时期和时刻”既保留两词的区别，也保留这一末世语境中的并列表达；“那些”承接两个名词前的定冠词及上下文所指。
- source_word: ἀδελφοί
  choice: 弟兄们
  rationale: 该阳性复数呼格的字面形式是“弟兄们”，但在这里很可能称呼整个信徒群体；正文保留源语形式，并在脚注说明其包容性用法。
- source_word: οὐ χρείαν ἔχετε
  choice: 不需要
  rationale: 这是表示没有必要的惯用结构。现代汉语用“不需要”简洁自然，准确传达其含义。
- source_word: ὑμῖν γράφεσθαι
  choice: 给你们写什么
  rationale: γράφεσθαι是被动不定式，原文没有明说写作者。汉语以无主句“给你们写什么”表达，可避免擅自补入“我”或“我们”；“什么”使否定句自然，并表达无需有任何相关内容写给他们。
theological_decisions:
- issue: 对教会群体的性别化称呼
  choice: 弟兄们
  alternative: 弟兄姊妹们
  rationale: 正文保留ἀδελφοί的阳性复数形式，同时用脚注说明该称呼很可能包括全体信徒，既不掩盖源语形式，也不排除会众中的女性。
- issue: 时期与时刻的末世含义
  choice: 保留“时期和时刻”的并列，不具体解释所指事件
  alternative: 日期和时间；末后的日期
  rationale: 原文只使用概括性的配对表达，并未在本节明确指定某一日期或事件。保留其开放性可避免把末世论解释直接写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“至于”自然标示话题转换；全句避免补出原文未明说的写作者。脚注标记依其实际说明对象放置：[a]说明“时期和时刻”，[b]说明“弟兄们”。
