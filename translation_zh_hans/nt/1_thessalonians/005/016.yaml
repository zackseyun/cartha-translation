lexical_decisions:
- source_word: πάντοτε
  choice: 常常
  rationale: 该副词表示在一切时候、始终不断。“常常”是现代汉语中简洁自然的表达，与命令式连用也流畅；这里并非仅指频率较高，而是表达持续、恒常的要求。
- source_word: χαίρετε
  choice: 要……喜乐
  rationale: 这是 χαίρω 的第二人称复数、现在时主动命令式。“喜乐”保留了与“喜悦”相关的动词意义和劝勉语气；加“要”使汉语命令或劝勉的功能清楚。现在时可带出持续进行的意味，但正文不将其过度显明，交由“常常”和脚注传达。
