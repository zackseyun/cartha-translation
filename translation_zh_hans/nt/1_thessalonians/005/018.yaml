base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/018.yaml
  text: Give thanks in everything[b][a], for this is God's will in Messiah Jesus for you.
translation:
  language: zh_hans
  text: 要在一切事上感恩[a]，因为这就是神在弥赛亚耶稣里向你们所定的旨意[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“无论处于什么境况，都要感恩”。原文直译为“在一切事上”，重点是人在各种境况中都要感恩，并不一定是要为恶事本身感谢神。
    reason: lexical_alternative
  - marker: b
    text: 传统译法为“在基督耶稣里”。“弥赛亚”和“基督”都对应希腊文Χριστός，意思是“受膏者”。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν παντί
  choice: 凡事
  rationale: ἐν加与格παντί最自然地表示感恩所处的范围或境况，即“在一切事上”或“无论处于什么境况”，而不是明确表示“为每一件事（包括恶事）”感恩。中文“凡事”简洁保留了原文的广度与一定歧义，并由脚注说明其语境含义。
- source_word: εὐχαριστεῖτε
  choice: 都要感恩
  rationale: 现在时主动命令语气、第二人称复数，要求信徒持续以感恩为生活实践。“要感恩”自然、直接；“都”与“凡事”搭配，并可体现命令面向全体读者，而不把现在时体过度译成“不断地”。
- source_word: τοῦτο
  choice: 这
  rationale: 指示代词最直接回指前面的劝勉。译作“这”保留原文的简洁，不擅自扩展为“这种做法”或“这项命令”。
- source_word: γὰρ
  choice: 因为
  rationale: γάρ引出前述命令的理由；现代汉语中“因为”清楚自然。
- source_word: θέλημα θεοῦ
  choice: 神的旨意
  rationale: 属格结构表达属于神或出于神的旨意。“神的旨意”是准确、自然且庄重的现代中文表达。
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: 在弥赛亚耶稣里
  rationale: Χριστός在此仍带有称号“受膏者／弥赛亚”的意义，因此译为“弥赛亚”，而不是只保留传统音译“基督”；介词ἐν直译为“在……里”，保留保罗书信中与弥赛亚联合这一表达所具有的神学张力。
- source_word: εἰς ὑμᾶς
  choice: 对你们
  rationale: εἰς加人称代词在此表达方向或关涉，指神的旨意是指向并关乎帖撒罗尼迦信徒的。“对你们”比字面化的“向着你们”更符合现代汉语。
theological_decisions:
- issue: Χριστῷ在固定短语中应译作称号还是沿用传统音译
  choice: 弥赛亚耶稣
  alternative: 基督耶稣
  rationale: Χριστός本义为“受膏者”，对应“弥赛亚”，在此并未完全失去称号含义。正文采用意义明确的“弥赛亚耶稣”，同时以脚注保留读者熟悉的传统译法“基督耶稣”。
- issue: 感恩是处于一切境况中，还是为一切事物本身
  choice: 将ἐν παντί理解为感恩发生于各种境况之中
  alternative: 为每一件事本身感恩
  rationale: ἐν加与格通常标明范围或处境；若明确表达“为某事感谢”，希腊文更常使用περί或ὑπέρ等结构。因此正文保留简洁的“凡事”，脚注说明这不必然意味着把恶本身当作感谢的对象。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“凡事都要感恩”保持经文的简洁和劝勉力度；“在……里”刻意保留保罗原文的联合性表达，不以解释性措辞消解其神学内涵。所有脚注标记均置于正文相应位置。
