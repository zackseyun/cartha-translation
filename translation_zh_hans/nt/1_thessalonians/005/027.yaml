  yaml_path: translation/nt/1_thessalonians/005/027.yaml
  text: I put you under oath before the Lord to have this letter read to all the brothers[a][b].
translation:
  language: zh_hans
  text: 我凭着主郑重嘱咐你们[a]：务必向所有弟兄宣读这封信[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我指着主郑重嘱咐你们。”这里的希腊语表示保罗以主为所诉诸的权威，郑重地约束听者。
    reason: lexical_alternative
  - marker: b
    text: “弟兄”很可能指包括女性在内的全体会众；希腊语ἀδελφοῖς是阳性复数。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνορκίζω
  choice: 叫你们起誓
  rationale: 该动词表示以誓言使人受到郑重约束。“叫你们起誓”在现代汉语中直接保留了誓言的力度，强于仅译作“郑重嘱咐”。
- source_word: τὸν κύριον
  choice: 在主面前
  rationale: 与 ἐνορκίζω 连用时，这一宾格短语可指主是誓言所诉诸的权威，也可理解为在主面前郑重立誓。正文采用自然的“在主面前”，并以脚注保留“指着主”的可能译法。
- source_word: ἀναγνωσθῆναι
  choice: 读给……听
  rationale: 被动不定式意为“被宣读”；语境是向会众公开读信。“读给……听”以自然汉语表达这一公开宣读的含义。
- source_word: τὴν ἐπιστολήν
  choice: 这封信
  rationale: 所指是正在传递的本封书信；“这封信”比直译为“那封信”或较古雅的“书札”更符合现代汉语指称习惯。
- source_word: πᾶσιν τοῖς ἀδελφοῖς
  choice: 所有弟兄
  rationale: 保留希腊语阳性复数 ἀδελφοῖς 的形式，同时以脚注说明在保罗书信中该词很可能涵盖包括女性在内的全体会众。
theological_decisions:
- issue: τὸν κύριον 在誓言结构中的关系
  choice: 在主面前
  alternative: 指着主／凭着主
  rationale: 该结构既可突出主作为见证者，也可突出主是誓言所诉诸的权威。正文不把它扩写成更具体的神学解释，脚注保留另一种句法理解。
- issue: 混合性别会众中 ἀδελφοῖς 的译法
  choice: 弟兄
  alternative: 弟兄姊妹
  rationale: 正文保留原文的阳性复数形式，不在正文中明示原文未明说的“姊妹”；脚注同时说明该称呼很可能包括女性，以免读者误解为只向男性宣读。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“务要”体现命令的郑重性；“读给……听”清楚表达在会众中公开宣读，同时避免使用较生僻的“宣读书札”等表达。
