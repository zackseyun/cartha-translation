  text: Do not quench the Spirit,[a]
translation:
  language: zh_hans
  text: 不要熄灭圣灵[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“灵”。希腊语这个词也可以泛指“灵”；但鉴于下文提到预言，这里最可能指圣灵。希腊文书写本身不以大小写区分这两种理解。
    reason: 保留πνεῦμα所指对象的词义歧义；以较直接的“预言”对应上下文，并避免“原稿”一词造成的文本史误解。
lexical_decisions:
- source_word: τὸ πνεῦμα
  choice: 圣灵
  rationale: πνεῦμα带冠词，且下文紧接着谈到先知所传的信息及察验（20—21节），这里最可能指圣灵。希腊文原稿本身不以大小写区分“圣灵”和“灵”，因此在脚注保留另一种理解。
- source_word: μὴ
  choice: 不要
  rationale: μή与现在时命令语气连用，构成禁止命令；现代汉语自然译作“不要”。
- source_word: σβέννυτε
  choice: 熄灭
  rationale: σβέννυμι本义是把火或灯熄灭，此处以此为喻，指压制或阻碍圣灵的运行。“熄灭”保留原文鲜明的比喻，没有增添原文未明说的“火”“感动”或“工作”。
theological_decisions:
- issue: πνεῦμα所指为何
  choice: 圣灵
  alternative: 灵（也可能泛指属灵的热忱、表现或人的灵）
  rationale: 随后关于不可藐视先知所传信息的劝告，支持这里指圣灵在群体中的运行。不过，πνεῦμα一词本身可以泛指“灵”，原文也没有大小写标记，故用脚注保留其词义上的开放性。
- issue: “熄灭”这一比喻的处理
  choice: 直接保留“熄灭圣灵”
  alternative: 熄灭圣灵的火；压制圣灵的感动或工作
  rationale: 原文直接以“圣灵／灵”为“熄灭”的宾语，没有明说“火”“感动”或“工作”。主文保留其简洁而有张力的表达，避免替作者解释比喻。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语。“熄灭圣灵”在汉语中略带陌生感，但能准确保留原文以灭火为喻的凝练表达；不补入“火”“感动”或“工作”，以免缩窄原意。
