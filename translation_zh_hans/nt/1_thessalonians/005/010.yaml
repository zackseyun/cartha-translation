  text: τοῦ ἀποθανόντος ⸀περὶ ἡμῶν ἵνα εἴτε γρηγορῶμεν εἴτε καθεύδωμεν ἅμα σὺν αὐτῷ ζήσωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/010.yaml
  text: who died for us[a], so that whether we are awake or asleep, we may live together with him.
translation:
  language: zh_hans
  text: 他为我们死了，好让我们无论醒着还是睡着[a]，都能与他一同活着。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“无论警醒还是睡着。”这句话可能呼应上下文关于警醒的劝勉，不过这里更可能是指信徒无论仍然活着还是已经去世。
    reason: 说明原文词语兼具字面与伦理含义，并保留对上下文关系的不同理解。
lexical_decisions:
- source_word: ἀποθανόντος
  choice: 死了
  rationale: 不定过去时分词修饰上文所指的主耶稣；汉语用完整谓语“死了”自然表达已经发生的行动。
- source_word: περὶ ἡμῶν
  choice: 为我们
  rationale: περί加属格在此救恩语境中表示“为了、代表”；“为我们”自然准确，同时不加入原文未明说的代赎机制。
- source_word: ἵνα
  choice: 好让
  rationale: 表达目的或预期结果，既保留目的性，也符合现代汉语行文。
- source_word: γρηγορῶμεν
  choice: 醒着
  rationale: 该词既可指清醒，也可指警醒；与“睡着”相对译为“醒着”，可保留原文在生死状态与伦理警醒之间的回响。
- source_word: καθεύδωμεν
  choice: 睡着
  rationale: 与“醒着”形成自然对应，并保留睡眠隐喻；上下文中很可能暗指已经去世的信徒。
- source_word: ἅμα
  choice: 一同
  rationale: 在ἅμα σὺν αὐτῷ中强调共同相伴的生命，用“一同”简洁表达。
- source_word: σὺν αὐτῷ
  choice: 与他
  rationale: σύν表示联合、相伴；与ἅμα合译为“与他一同”，自然且完整。
- source_word: ζήσωμεν
  choice: 都能……活着
  rationale: ἵνα所支配的不定过去时虚拟语气表达所要达到的目的；“都能”承接“无论”，并自然呈现这一目的或结果。
theological_decisions:
- issue: “醒着还是睡着”在本节中的含义
  choice: 主文保留睡眠隐喻，主要理解为信徒仍然活着或已经去世。
  alternative: 延续5:6—7的劝勉，指伦理上的警醒或懈怠。
  rationale: 尽管两个动词在近处语境中带有伦理色彩，本节“无论……都与他一同活着”的表述更自然地呼应4:13—15，以睡着比喻信徒去世。译文不直接改写为“活着或死了”，以保留原文的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“好让”比“为要使”更自然；“醒着还是睡着”保留原文意象及其有意留下的含义空间。
