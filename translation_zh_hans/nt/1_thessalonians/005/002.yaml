  text: αὐτοὶ γὰρ ἀκριβῶς οἴδατε ⸀ὅτι ἡμέρα κυρίου ὡς κλέπτης ἐν νυκτὶ οὕτως ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/002.yaml
  text: For you yourselves know very well that the day of the Lord comes like a thief in the night.
translation:
  language: zh_hans
  text: 因为你们自己很清楚地知道，主的日子来到，正像贼在夜间来到一样。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτοὶ
  choice: 你们自己
  rationale: 这是加强语气的代词，强调收信人本身已经知道；“你们自己”在现代汉语中自然保留了这一强调。
- source_word: γὰρ
  choice: 因为
  rationale: γάρ承接上文，说明前一句话的理由；“因为”清楚表达其解释性和因果性的连接作用。
- source_word: ἀκριβῶς
  choice: 清楚
  rationale: 该副词表示准确、确切地知道。与“知道”搭配时，“清楚知道”既自然，也保留了他们对此有确切认识的含义。
- source_word: οἴδατε
  choice: 知道
  rationale: 直接表达已有的认识或了解，符合此处语境。
- source_word: ἡμέρα κυρίου
  choice: 主的日子
  rationale: 这是具有先知传统和末世含义的固定表达，指主施行干预与审判的日子，而不是每周的敬拜日。
- source_word: ὡς κλέπτης ἐν νυκτὶ
  choice: 像夜间的贼一样
  rationale: 保留原文比喻及“在夜间”的意象，突出到来出人意料；措辞符合现代汉语表达。
- source_word: οὕτως
  choice: 就像……一样
  rationale: οὕτως指明来到的方式与前面的比喻相对应；汉语用“就像……一样”自然体现这一对应关系。
- source_word: ἔρχεται
  choice: 来到
  rationale: 保留原文现在时的生动表达，同时在末世语境中自然指向将来的事件；不额外限定具体时间。
theological_decisions:
- issue: ἡμέρα κυρίου的末世含义
  choice: 主的日子
  alternative: 主日
  rationale: 上下文讨论这一日何时来到以及其突发性，指向末世性的神圣介入，而非一周中的礼拜日；“主的日子”也保留了旧约先知传统的表达。
- issue: “像夜间的贼一样”这一比喻的作用
  choice: 原样保留比喻，只表达出人意料的到来
  alternative: 扩展为“秘密地来到”或加入特定末世时间体系
  rationale: 原文以夜间的贼说明来到的突发和不可预料，并未明确陈述“秘密”或任何特定末世次序，因此不应在译文中增添。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你们自己清楚知道”保留原文的强调与确切认识；整句保持简洁，并延续原文比喻的力度。
