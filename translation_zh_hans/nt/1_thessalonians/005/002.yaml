  source_fidelity: 原译总体忠实地传达了γάρ的解释性连接、αὐτοὶ的强调、对“主的日子”的末世性指称，以及突然而不可预料的比喻。只是“主的日子来到，就像夜间的贼一样”在汉语中可略显悬置，容易使“夜间的贼”仅作名词性比较，未充分显出原文ὡς…οὕτως所比较的是“来到”的方式。
  naturalness: “你们自己清楚知道”可理解，但“很清楚地知道”更合现代普通话的自然搭配；“正像贼在夜间来到一样”清晰、庄重，也更顺畅地重现原文的对应结构。
  terminology: “主的日子”正确，且应避免译作通常指礼拜日的“主日”。“贼”保留原文意象；本节不应将比喻扩展为“秘密”来到或特定末世体系。
