  text: καὶ ἡγεῖσθαι αὐτοὺς ⸀ὑπερεκπερισσοῦ ἐν ἀγάπῃ διὰ τὸ ἔργον αὐτῶν. εἰρηνεύετε ἐν ⸀ἑαυτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/013.yaml
  text: and to regard them very highly in love because of their work[a]. Be at peace among yourselves.
translation:
  language: zh_hans
  text: 又要因着他们所做的工作，以爱心极其敬重他们。[a]你们彼此之间要和睦。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在爱中极其敬重他们。”希腊语的这个副词带有非同寻常的强烈语气。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡγεῖσθαι
  choice: 敬重
  rationale: 此处表示对人的评价和看重，而非“带领”；“敬重”自然表达对前文所指服事者的高度尊重。
- source_word: ὑπερεκπερισσοῦ
  choice: 格外
  rationale: 这个罕见的叠加强调副词表示极高程度；“格外”在现代汉语中简洁自然，强度上的特殊之处由脚注补明。
- source_word: ἐν ἀγάπῃ
  choice: 以爱心
  rationale: 保留ἀγάπη的核心含义，并自然表达敬重他们时所持的态度或方式。
- source_word: διὰ τὸ ἔργον αὐτῶν
  choice: 因他们所做的工作
  rationale: διά加宾格在此表示原因或根据；译文保留ἔργον的具体含义，同时符合现代汉语表达。
- source_word: εἰρηνεύετε
  choice: 要和睦
  rationale: 现在时命令语气要求持续维持和平相处的状态；“要和睦”简洁、自然，并适合群体语境。
- source_word: ἐν ἑαυτοῖς
  choice: 彼此之间
  rationale: 复数反身代词在这里指信徒群体内部；“彼此之间”准确表达共同体内相互相处的关系。
- source_word: καὶ
  choice: 又要
  rationale: 承接上一节的一连串劝勉；“又要”在中文中清楚保留连接和递进的语气。
- source_word: αὐτούς
  choice: 他们
  rationale: 指回上一节那些在信徒中劳苦、治理并劝戒他们的人。
theological_decisions: []
