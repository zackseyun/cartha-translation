  source_fidelity: 草稿准确传达了因对方的工作而以爱心高度敬重他们，以及群体内部和睦相处的命令。惟“格外”通常仅表示“特别、不同寻常地”，对ὑπερεκπερισσοῦ这一罕见且叠加强调的副词而言力度略弱；改为“极其”更能保留其强化程度。
  naturalness: “又要因他们所做的工作，以爱心格外敬重他们”基本自然。调整为“又要因着他们所做的工作，以爱心极其敬重他们”仍属现代庄重的普通话，并使程度表达更明确。“你们彼此之间要和睦”自然通顺。
  terminology: “敬重”恰当表达ἡγεῖσθαι在本句的评价性含义；“爱心”自然传达ἐν ἀγάπῃ；“和睦”准确传达εἰρηνεύετε。未添加对前节所指对象的解释，因而保留代词的篇章指向。
