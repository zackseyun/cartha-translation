  text: ὑμεῖς δέ, ἀδελφοί, οὐκ ἐστὲ ἐν σκότει, ἵνα ἡ ἡμέρα ὑμᾶς ὡς ⸀κλέπτης καταλάβῃ,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/004.yaml
  text: But you[a], brothers, are not in darkness[b], so that the day would overtake you like a thief.
translation:
  language: zh_hans
  text: 但弟兄们[a]，你们并不在黑暗中，以致那日不会像贼一样使你们猝不及防[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄们”在这里是对全体信徒的称呼，包括姊妹。
    reason: lexical_alternative
  - marker: b
    text: “那日”按紧接的上下文指主的日子。
    reason: cross_reference
lexical_decisions:
- source_word: ὑμεῖς δέ
  choice: 但……你们
  rationale: δέ承接上文形成对比，明说的ὑμεῖς带有强调意味；汉语以“但”及明确的“你们”自然保留这两点。
- source_word: ἀδελφοί
  choice: 弟兄们
  rationale: 保留阳性复数称呼的字面形式及书信语体；在脚注说明此称呼在这里包括姊妹。
- source_word: ἐν σκότει
  choice: 在黑暗中
  rationale: 保留原文的黑暗意象及其属灵、道德层面的含义，不缩减为单纯的“不知情”。
- source_word: ἵνα
  choice: 因而……不会
  rationale: 此处表示由“不在黑暗中”所带出的结果或情形；这样的译法符合现代汉语，同时不把它硬定为目的关系。
- source_word: ἡ ἡμέρα
  choice: 那日
  rationale: 冠词指向上下文已经提及的特定日子；“那日”在汉语中自然地表达特指，但不在正文中扩写其所指。
- source_word: ὡς κλέπτης
  choice: 像贼一样
  rationale: 直接保留ὡς所引出的比喻，表达自然清楚。
- source_word: καταλάβῃ
  choice: 突然临到
  rationale: καταλαμβάνω在此有追上、猝然抓住之意；结合“像贼一样”的比喻，“突然临到”自然表达出其出其不意的意味，而不采用较生硬的“追上”。
theological_decisions:
- issue: ἀδελφοί用于可能包含男女的会众
  choice: 正文译“弟兄们”，脚注说明包括姊妹
  alternative: 正文译“弟兄姊妹们”
  rationale: 正文保留原文阳性称呼的形式，脚注则交代其在会众语境中的包容性所指，避免读者误以为只针对男性。
- issue: ἡ ἡμέρα的末世论所指
  choice: 正文译“那日”，脚注指出即上下文所说的主的日子
  alternative: 正文直接译“主的日子”
  rationale: 上下文明示其所指，但本节希腊文仅作ἡ ἡμέρα；正文不补入原文未明说的完整称谓，脚注提供必要语境。
- issue: ἵνα所表达的逻辑关系
  choice: 以“因而……不会”保留结果性联系
  alternative: 译作“免得”以表达目的
  rationale: 这里目的与结果的界线并非必须截然划定；结果式汉语较贴合上下文，又避免把神学因果解释得过满。
translation_notes:
  register: 采用现代、庄重而易懂的书信语体。“在黑暗中”和“像贼一样”保留原文互相关联的意象；“突然临到”使καταλάβῃ在现代汉语中清楚自然。所有脚注标记均置于正文相应位置。
