source:
  edition: SBLGNT
  text: ἀφ’ ὑμῶν γὰρ ἐξήχηται ὁ λόγος τοῦ κυρίου οὐ μόνον ἐν τῇ Μακεδονίᾳ ⸀καὶ Ἀχαΐᾳ, ⸀ἀλλ’ ἐν παντὶ τόπῳ ἡ πίστις ὑμῶν ἡ πρὸς τὸν θεὸν ἐξελήλυθεν, ὥστε μὴ χρείαν ⸂ἔχειν ἡμᾶς⸃ λαλεῖν τι·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/008.yaml
  text: For from you the word of the Lord has sounded forth[a], not only in Macedonia and Achaia, but in every place your faith toward God has gone out, so that we have no need to say anything.
translation:
  language: zh_hans
  text: 因为主的道已经从你们那里传扬开来[a]，不但在马其顿和亚该亚，而且你们对上帝的信心也传到了各处，以致我们不需要说什么。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “传扬开来”或译“响彻开来”。原文用的是声音响起、回荡的形象。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξήχηται
  choice: 传扬开来
  rationale: 该词本有声音响起、回荡的形象；“传扬开来”在现代汉语中自然地表达信息从一处广传，同时保留主动向外扩展的意味。脚注补出更直译的声音意象。
- source_word: ὁ λόγος τοῦ κυρίου
  choice: 主的道
  rationale: 沿用中文圣经中自然、庄重而熟悉的表达，并保留属格可能表示出自主或关于主的开放性。
- source_word: Μακεδονίᾳ καὶ Ἀχαΐᾳ
  choice: 马其顿和亚该亚
  rationale: 采用现代简体中文圣经中通行的地名音译。
- source_word: ἀλλ’ ἐν παντὶ τόπῳ
  choice: 而且……各处
  rationale: “各处”保留 παντὶ τόπῳ 的分配性和地点含义，比单纯说“到处”略为具体。
- source_word: ἡ πίστις ὑμῶν ἡ πρὸς τὸν θεόν
  choice: 你们对上帝的信心
  rationale: “对上帝”较直接地保留 πρὸς 的朝向和关系意味；“信心”是此处 πίστις 最自然的现代汉语表达。
- source_word: ἐξελήλυθεν
  choice: 传到了
  rationale: 以自然汉语表达完成时所含的向外出去并产生现今结果之意，同时与前文“传扬开来”形成呼应。
- source_word: ὥστε μὴ χρείαν ἔχειν ἡμᾶς
  choice: 以致我们不需要
  rationale: 自然表达 ὥστε 引出的结果，以及“没有需要”的希腊语习语。
- source_word: λαλεῖν τι
  choice: 再说什么
  rationale: “说什么”符合现代汉语习惯；“再”根据语境显明他们已无需另外述说，并未改变结果句的基本意思。
theological_decisions:
- issue: πίστις 的译法
  choice: 信心
  alternative: 信实；信靠
  rationale: 本句说的是帖撒罗尼迦人朝向上帝的回应，重点更可能是相信、信靠，而非其自身的可靠或忠诚；“信心”既符合上下文，也不额外引入宗派性解释。
- issue: πρὸς τὸν θεόν 的关系表达
  choice: 对上帝
  alternative: 在上帝里的；朝向上帝的
  rationale: “对上帝”在中文中自然，并较好保留 πρὸς 的方向性；“在上帝里的”虽更惯用，却会把原文介词改释为“在……里”。
- issue: ὁ λόγος τοῦ κυρίου 的属格关系
  choice: 主的道
  alternative: 关于主的信息；主所发的信息
  rationale: “主的道”保留原文属格的开放性，不强行判定是来源属格还是内容属格。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“主的道”“上帝”“信心”符合普通读者熟悉的圣经语域；整体避免生硬逐字对应，同时用脚注保留 ἐξήχηται 的听觉意象。
