id: 1TH.1.5
reference: 1 Thessalonians 1:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὅτι τὸ εὐαγγέλιον ἡμῶν οὐκ ἐγενήθη εἰς ὑμᾶς ἐν λόγῳ μόνον ἀλλὰ καὶ ἐν δυνάμει καὶ ἐν πνεύματι ἁγίῳ ⸀καὶ πληροφορίᾳ πολλῇ, καθὼς οἴδατε οἷοι ἐγενήθημεν ⸀ἐν ὑμῖν δι’ ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/005.yaml
  text: because our gospel did not come to you in word only[a], but also in power and in the Holy Spirit and with great conviction[b], just as you know what kind of men we proved to be among you for your sake.
translation:
  language: zh_hans
  text: 因为我们所传的福音临到你们，不单借着言语，也借着能力、圣灵和充分的确信[a]；正如你们知道，我们为了你们的缘故，在你们中间是怎样的人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“极有把握”或“使人深信不疑”。原文没有明确这种确信主要属于传讲者、听众，还是福音临到时的整体表现。
    reason: lexical_alternative
  - marker: b
    text: 或译：“我们在你们中间显明是怎样的人。”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐαγγέλιον
  choice: 福音
  rationale: “福音”是保罗书信语境中自然且约定俗成的译法，既表达好消息，也保留使徒信息的特定含义。
- source_word: ἐγενήθη εἰς ὑμᾶς
  choice: 临到你们
  rationale: 此处是指福音来到帖撒罗尼迦人当中并产生作用；“临到你们”自然地传达其来到和发生的意味。
- source_word: ἐν λόγῳ μόνον
  choice: 不仅在于言语
  rationale: 保留“言语”与随后能力、圣灵及确信之间的对比，同时符合现代汉语表达。
- source_word: ἐν δυνάμει
  choice: 带着能力
  rationale: 表示福音的传扬伴随实际有效的能力；“带着”也可统摄后面的并列成分。
- source_word: ἐν πνεύματι ἁγίῳ
  choice: 圣灵
  rationale: 依保罗通常用法，这里指圣灵，而非泛指一种圣洁的精神或气氛。
- source_word: πληροφορίᾳ πολλῇ
  choice: 充分的确信
  rationale: πληροφορία表示充足、完全的把握或确信；这样译保留了确信主体未被明说的开放性。
- source_word: καθὼς οἴδατε
  choice: 你们也知道
  rationale: 自然表达收信人亲自知道并能印证下文事实的语气。
- source_word: οἷοι ἐγενήθημεν
  choice: 我们……是怎样的人
  rationale: οἷοι着重保罗及同工所显出的品格和为人；汉语无需补出性别，同时没有把意思缩减为单指行为。
- source_word: ἐν ὑμῖν
  choice: 在你们中间
  rationale: 准确表示保罗及同工身处帖撒罗尼迦信徒当中时的为人。
- source_word: δι’ ὑμᾶς
  choice: 为了你们的缘故
  rationale: 在本语境中自然表达他们如此为人是为收信人的益处；同时不排除“因你们”的语义色彩。
theological_decisions:
- issue: “圣灵”的所指
  choice: 译为“圣灵”，指神的灵。
  alternative: 一种圣洁的精神或属灵能力
  rationale: 保罗用语和上下文中超越言语的神圣能力都支持将πνεύματι ἁγίῳ理解为圣灵。
- issue: πληροφορίᾳ πολλῇ的含义及主体
  choice: 译为“充分的确信”，不明说是谁确信。
  alternative: 极大的信念；十足的把握；使人深信不疑
  rationale: 原文没有明确确信属于传讲者、听众，还是福音临到时的整体表现，因此不宜在正文中限定主体。
- issue: οἷοι ἐγενήθημεν的表达
  choice: 译为“我们在你们中间是怎样的人”。
  alternative: 我们在你们中间显明是怎样的人；我们在你们中间怎样行事为人
  rationale: 该表达关乎保罗及同工的品格与实际表现。“是怎样的人”保留其广度，也避免把γίνομαι生硬译成“成为”。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“所传的福音”补足汉语中“我们的福音”可能造成的归属误解；全句保留原文从福音临到的方式转向传讲者为人的论证结构。
