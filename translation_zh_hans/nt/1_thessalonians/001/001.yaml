base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/001.yaml
  text: 'Paul and Silvanus and Timothy[b][a], to the church of the Thessalonians in God the Father and the Lord Jesus the Messiah: grace to you and peace.'
translation:
  language: zh_hans
  text: 保罗、西拉[a]和提摩太，写给在父上帝和主耶稣基督里的帖撒罗尼迦人的教会[b]：愿恩典与平安临到你们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“西尔瓦努斯”；通常认为这是“西拉”的另一种名字形式。
    reason: lexical_alternative
  - marker: b
    text: “教会”也可译作“会众”，原词指聚集起来的群体。
    reason: lexical_alternative
lexical_decisions:
- source_word: Παῦλος
  choice: 保罗
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: Σιλουανὸς
  choice: 西拉
  rationale: Σιλουανός直译可作“西尔瓦努”；现代中文读者更熟悉其通行对应名“西拉”，正文采用此名，并以脚注保留原文形式。
- source_word: Τιμόθεος
  choice: 提摩太
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: ἐκκλησίᾳ
  choice: 教会
  rationale: 在书信称呼中，“教会”是自然且通行的现代中文表达；脚注说明其本义可指聚集的会众。
- source_word: Θεσσαλονικέων
  choice: 帖撒罗尼迦那……的
  rationale: 该复数属格指帖撒罗尼迦人所构成的群体；结合中文句法译为“帖撒罗尼迦那……的教会”。
- source_word: ἐν
  choice: 在……里
  rationale: 保留介词所表达的领域、关系或联合，不具体化为“属于”或“聚集在”。
- source_word: θεῷ πατρὶ
  choice: 父上帝
  rationale: 原文没有“我们的”；“父上帝”保留同位关系，也符合自然中文神学语体。
- source_word: κυρίῳ
  choice: 主
  rationale: κύριος在此作为尊称，译作“主”准确且通行。
- source_word: Ἰησοῦ Χριστῷ
  choice: 主耶稣基督
  rationale: “基督”在现代汉语中是Χριστός的通行音意结合译名，仍可承载“受膏者/弥赛亚”的称号意义；脚注予以说明。
- source_word: χάρις
  choice: 恩典
  rationale: 保留保罗书信问安语的核心神学及书信语义。
- source_word: εἰρήνη
  choice: 平安
  rationale: “平安”既自然，也保留希腊和犹太问安传统的回响。
- source_word: χάρις ὑμῖν καὶ εἰρήνη
  choice: 愿恩典与平安临到你们
  rationale: 中文以祝愿句表达省略动词的问安公式最为自然；两项祝福共同以“临到你们”统摄。
theological_decisions:
- issue: Χριστός在问安语中的译法
  choice: 基督
  alternative: 弥赛亚（受膏者）
  rationale: 现代标准汉语中“耶稣基督”庄重、自然且广为理解；脚注明示“基督”在此仍是称号，避免把它纯粹当作姓名而丢失原义。
- issue: ἐν θεῷ πατρὶ καὶ κυρίῳ Ἰησοῦ Χριστῷ所表达的关系
  choice: 在父上帝和主耶稣基督里
  alternative: 属于父上帝和主耶稣基督
  rationale: 直保留“在……里”，不把其关系限定为归属、聚会场域或某一种系统性的联合观，并维持父与主耶稣基督之间的并列结构。
- issue: θεῷ πατρὶ是否补入领属代词
  choice: 父上帝
  alternative: 我们的父上帝
  rationale: 希腊原文没有“我们的”，故不补入，以免添加原文未明说的领属成分。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。人名使用中文圣经传统中的通行译名；问安公式译成自然祝愿句。正文保留“在……里”的神学张力，并用脚注解释容易被通行译名遮蔽的词义。
