  text: Εὐχαριστοῦμεν τῷ θεῷ πάντοτε περὶ πάντων ὑμῶν ⸀μνείαν ποιούμενοι ἐπὶ τῶν προσευχῶν ἡμῶν, ἀδιαλείπτως
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/002.yaml
  text: We always give thanks to God for all of you[a], making mention of you in our prayers unceasingly,
translation:
  language: zh_hans
  text: 我们总是为你们众人感谢上帝，在我们的祷告中不断地提到你们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不断地”也可修饰前面的整句，意为“我们不断地为你们众人感谢上帝”。
    reason: 保留ἀδιαλείπτως修饰范围的句法歧义。
lexical_decisions:
- source_word: Εὐχαριστοῦμεν
  choice: 我们……感谢
  rationale: 现在时主动直陈语气第一人称复数。在现代汉语中，“感谢上帝”自然、庄重，也明确保留感谢的对象。
- source_word: τῷ θεῷ
  choice: 上帝
  rationale: 作 εὐχαριστοῦμεν 的与格对象，表示感谢所归向的对象；译作“上帝”清楚自然。
- source_word: πάντοτε
  choice: 总是
  rationale: 保留 πάντοτε 的时间含义，并符合现代汉语表达。
- source_word: περὶ πάντων ὑμῶν
  choice: 为你们众人
  rationale: περί 加属格在此表示关切或涉及的对象；“为你们众人”既自然，也保留 πάντων 的全体性。
- source_word: μνείαν ποιούμενοι
  choice: 提到你们
  rationale: 该分词短语直译为“作提及”，在祷告语境中译作“提到你们”比“记念你们”更准确地保留其表达方式；宾语由上下文补出。
- source_word: ἐπὶ τῶν προσευχῶν ἡμῶν
  choice: 在祷告中
  rationale: ἐπί 加属格在这一惯用表达中指祷告之时或祷告过程中；“在祷告中”简明自然。
- source_word: ἀδιαλείπτως
  choice: 不断
  rationale: 表达持续、不间断的规律性；置于“提到你们”之前符合汉语习惯，同时以脚注保留其修饰范围的歧义。
theological_decisions:
- issue: ἀδιαλείπτως 的修饰范围
  choice: 正文按其修饰“在祷告中提到你们”处理
  alternative: 也可修饰全句的感谢，意为“我们不断为你们众人感谢上帝”
  rationale: 希腊语中的位置和句法容许两种关联，不能仅凭标点彻底确定，因此正文采用自然读法，并以脚注保留另一可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你们众人”保留原文对全体收信人的强调；避免使用可能显得古旧的“每逢祷告”或较具特定教会语感的扩展措辞。
