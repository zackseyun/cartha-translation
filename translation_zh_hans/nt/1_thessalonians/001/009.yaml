  text: αὐτοὶ γὰρ περὶ ἡμῶν ἀπαγγέλλουσιν ὁποίαν εἴσοδον ἔσχομεν πρὸς ὑμᾶς, καὶ πῶς ἐπεστρέψατε πρὸς τὸν θεὸν ἀπὸ τῶν εἰδώλων δουλεύειν θεῷ ζῶντι καὶ ἀληθινῷ,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/009.yaml
  text: For they themselves report about us what kind of reception we had among you[a], and how you turned to God from idols to serve the living and true God[c][b],
translation:
  language: zh_hans
  text: 因为他们自己在述说有关我们的事：我们到你们那里去时情形如何[a]，以及你们怎样离开偶像，转向上帝，好服侍那又真又活的上帝[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们到你们那里去时，是何等情形。”原文“进入”可指保罗一行来到他们中间时的情形及所产生的影响。
    reason: lexical_alternative
  - marker: b
    text: “那又真又活的上帝”使上帝与偶像形成对比；参耶利米书10:10。
    reason: cross_reference
  - marker: c
    text: “转向”也可译为“归向”；原文描绘离开偶像而转向上帝。
    reason: alternative_reading
lexical_decisions:
- source_word: αὐτοὶ
  choice: 他们自己
  rationale: 保留强调代词的力度，表明这些人不需保罗提示，自己就在传述此事。
- source_word: ἀπαγγέλλουσιν
  choice: 都在传说
  rationale: 现在时表示正在持续发生的传述；“传说”在此指传播、述说消息，并非虚构的传闻。
- source_word: ὁποίαν εἴσοδον ἔσχομεν πρὸς ὑμᾶς
  choice: 我们是怎样来到你们中间的
  rationale: εἴσοδος本义为“进入、到来”，在语境中也涵盖这次到访的性质与成效；此译自然且比单译为“接待”更贴近原文表达。
- source_word: πῶς ἐπεστρέψατε πρὸς τὸν θεὸν ἀπὸ τῶν εἰδώλων
  choice: 你们是怎样离弃偶像、归向上帝
  rationale: 用成对动词明确呈现ἀπό与πρός所表达的起点和方向，同时保留“转离—转向”的归信意象。
- source_word: εἰδώλων
  choice: 偶像
  rationale: 这是该词在祭祀与宗教语境中的直接、通行译法。
- source_word: δουλεύειν
  choice: 服侍
  rationale: 该词属于奴仆与服役的语义域；在此表示对上帝忠诚委身的事奉。“服侍”自然传达其义，又不将奴役色彩强化过度。
- source_word: θεῷ ζῶντι καὶ ἀληθινῷ
  choice: 那位又真又活的上帝
  rationale: 定指表达符合语境；“又真又活”突出上帝与虚假、无生命的偶像之间的对比。
- source_word: γὰρ
  choice: 因为
  rationale: 保留本节对前文所作的解释和论证关系。
theological_decisions:
- issue: ἐπεστρέψατε所表达的归信行动
  choice: 译作“离弃偶像、归向上帝”
  alternative: “从偶像转向上帝”或“从偶像归信上帝”
  rationale: 此译保留转向的空间隐喻及其双重方向，不用后来的系统神学术语预先界定人的行动与上帝作为之间的关系。
- issue: δουλεύειν用于人与上帝的关系
  choice: 译作“服侍”
  alternative: “作上帝的奴仆”或“敬拜”
  rationale: “服侍”既保留忠诚顺服的含义，也不把词义缩窄为礼仪性的敬拜，或不必要地强化奴役意象。
- issue: “又真又活的上帝”与偶像的对比
  choice: 在正文中保持直接对比，并以脚注提示其意义
  alternative: 在正文中扩写为“与无生命的假神相对”
  rationale: 原文只用形容词形成神学张力，正文不应加入解释性扩写；脚注可帮助普通读者把握对比。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“来到你们中间”保持原文“进入”的意象；“离弃偶像、归向上帝”以自然汉语呈现两个方向；“又真又活”保留传统圣经语感，同时清楚自然。所有脚注标记均已置于正文。
