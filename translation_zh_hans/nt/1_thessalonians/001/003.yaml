  text: μνημονεύοντες ὑμῶν τοῦ ἔργου τῆς πίστεως καὶ τοῦ κόπου τῆς ἀγάπης καὶ τῆς ὑπομονῆς τῆς ἐλπίδος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ ἔμπροσθεν τοῦ θεοῦ καὶ πατρὸς ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/003.yaml
  text: remembering your work of faith and labor of love and steadfastness of hope in our Lord Jesus the Messiah before our God and Father[b][a],
translation:
  language: zh_hans
  text: 在我们的神和父面前，记念你们出于信心[a]的工作、出于爱心的劳苦，以及因盼望我们的主耶稣——弥赛亚[b]而有的坚忍，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “信心”也可译作“忠信”或“信靠”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文Χριστός传统译作“基督”；这里按其称号含义译为“弥赛亚”。
    reason: alternative_reading
lexical_decisions:
- source_word: μνημονεύοντες
  choice: 记念
  rationale: 现在时分词承接上一节，表示持续记得、提念；“记念”简洁庄重，也适合本句未完的从属结构。
- source_word: ἔργου τῆς πίστεως
  choice: 出于信心的工作
  rationale: 保留“工作—劳苦—坚忍”的三联结构；“出于”自然表达该工作由信心产生或以信心为特征，同时不把它误解为赚取信心的行为。
- source_word: κόπου τῆς ἀγάπης
  choice: 出于爱心的劳苦
  rationale: “劳苦”体现κόπος所含的辛劳和付出；“出于爱心”在现代汉语中自然表达这劳苦与爱的关系。
- source_word: ὑπομονῆς τῆς ἐλπίδος
  choice: 因盼望……而有的坚忍
  rationale: ὑπομονή指压力之下持久而坚定的忍耐；“坚忍”兼顾坚持与忍耐，并把它与盼望的支撑关系自然连结。
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: 我们的主耶稣弥赛亚
  rationale: 此属格短语与“盼望”相连，指向以主耶稣为对象或根基的盼望；Χριστός在这里作为称号，译为“弥赛亚”。
- source_word: ἔμπροσθεν τοῦ θεοῦ καὶ πατρὸς ἡμῶν
  choice: 在我们的神和父面前
  rationale: 贴近希腊文结构，表达处于神的鉴察和同在之中；“神和父”保留两个并列称谓的紧密关系。
theological_decisions:
- issue: πίστις在本节的含义
  choice: 信心
  alternative: 忠信；信靠
  rationale: 本处最自然地指信靠神而产生的工作，但πίστις也可能带有忠信或信靠的语义色彩，因此在脚注保留这些可能。
- issue: Χριστός的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: Χριστός在这里仍具有称号功能；“弥赛亚”直接呈现其称号意义，而“基督”是中文传统且熟悉的译法，故列入脚注。
- issue: 三个属格短语的关系
  choice: 分别用“出于”和“因……而有”表达信、爱、望所产生或塑造的行动
  alternative: 直译为“信心的工作、爱心的劳苦、盼望的坚忍”
  rationale: 希腊文属格本身较凝练，可表示来源或特征；正文采用自然汉语呈现最可能的关系，同时避免把信、爱、望与相应行为割裂。
translation_notes:
  register: 采用现代、庄重而易懂的书面语。保留原文“工作—劳苦—坚忍”三项平行结构，并保留句末逗号，以反映该分词短语承接上一节、句意尚未结束。
