  text: καὶ ἀναμένειν τὸν υἱὸν αὐτοῦ ἐκ τῶν οὐρανῶν, ὃν ἤγειρεν ἐκ τῶν νεκρῶν, Ἰησοῦν τὸν ῥυόμενον ἡμᾶς ⸀ἐκ τῆς ὀργῆς τῆς ἐρχομένης.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/010.yaml
  text: and to wait for his Son from heaven[a], whom he raised from the dead—Jesus, who rescues us from the coming wrath.
translation:
  language: zh_hans
  text: 并等候他从天上而来的儿子，就是上帝使他从死人中复活的耶稣；这位耶稣救我们脱离那将要临到的愤怒。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他解救我们脱离那将来的愤怒。”
    reason: “救”和“解救”都可表达ῥυόμενον；“那将来的愤怒”以较简练的方式表达τῆς ὀργῆς τῆς ἐρχομένης。
lexical_decisions:
- source_word: ἀναμένειν
  choice: 等候
  rationale: 表达带着期待持续等待的意思，也自然承接第9节所述他们归向上帝之后的生活。
- source_word: τὸν υἱὸν αὐτοῦ ἐκ τῶν οὐρανῶν
  choice: 他的儿子从天上来
  rationale: “他的儿子”保留基督论称号；希腊文“诸天”为复数，但现代汉语在此通常说“天上”。补出“来”使“从天上”与“等候”自然衔接，却不额外规定降临的方式。
- source_word: ὃν ἤγειρεν ἐκ τῶν νεκρῶν
  choice: 上帝使他从死人中复活
  rationale: 明确希腊文关系代词所承接的“儿子”，并保留ἐκ τῶν νεκρῶν“从死人中”的群体性表达。根据上文语境，以“上帝”明示希腊文动词中未明说的主语。
- source_word: Ἰησοῦν
  choice: 耶稣
  rationale: 采用现代汉语通行的人名译法。
- source_word: τὸν ῥυόμενον ἡμᾶς
  choice: 他救我们
  rationale: 以关系分句自然表达现在分词，并将耶稣刻画为施行拯救者；不擅自改成明确的将来时。
- source_word: ἐκ τῆς ὀργῆς τῆς ἐρχομένης
  choice: 脱离那将要临到的愤怒
  rationale: “愤怒”保留ὀργή的明确语义，不泛化为“审判”；“将要临到的”传达现在分词ἐρχομένης所含的逼近及未来指向。
theological_decisions:
- issue: “将要临到的愤怒”的性质
  choice: 保留“愤怒”，不具体说明它是末日审判、末世灾难，还是更广义的上帝之怒。
  alternative: 译作“将要临到的审判”，或在译文中将其限定为某一种末世事件。
  rationale: 本节本身没有进一步界定这愤怒的具体形式；保持原文措辞可避免加入特定末世论体系。
- issue: 现在分词ῥυόμενον的时间与功能
  choice: 译作“他救我们”，把它理解为对耶稣身份和行动的特征性描述。
  alternative: “他将要救我们”或“他正在救我们”。
  rationale: 上下文因“将要临到的愤怒”而具有未来指向，但希腊文并未使用明确的将来时；因此不把行动严格限定为将来或正在进行。
- issue: 复活语句的施事者
  choice: 以“上帝”明示使耶稣复活者。
  alternative: 保留隐含主语，译为“他使其复活”。
  rationale: 希腊文只以动词形态承接前文的上帝；现代汉语若连续使用“他”容易混淆上帝与耶稣，因此按语境明示而不改变所指。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。“从死人中复活”较“从死里复活”更直接体现希腊文复数表达；分号用来理清“等候—身份说明—施行拯救”的长句结构。
