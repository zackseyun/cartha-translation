  text: ὥστε γενέσθαι ὑμᾶς ⸀τύπον πᾶσιν τοῖς πιστεύουσιν ἐν τῇ Μακεδονίᾳ καὶ ⸀ἐν τῇ Ἀχαΐᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/007.yaml
  text: so that you became an example to all the believers in Macedonia and in Achaia[a].
translation:
  language: zh_hans
  text: 以致你们成了马其顿和亚该亚所有信徒的榜样[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“模范”或“范例”。
    reason: 词义选择：τύπος可指供人效法的榜样、模范或范例。
lexical_decisions:
- source_word: ὥστε
  choice: 这样……就
  rationale: 承接上一节所述帖撒罗尼迦信徒领受真道并效法主的行动，表达由此产生的结果；现代汉语用“这样……就”自然清楚。
- source_word: γενέσθαι
  choice: 成了
  rationale: 不定式与ὥστε构成结果结构；译为汉语限定形式“成了”，既自然又保留其成为某种榜样的含义。
- source_word: ὑμᾶς
  choice: 你们
  rationale: 对应复数第二人称，指帖撒罗尼迦信徒群体。
- source_word: τύπον
  choice: 榜样
  rationale: 此处指可供其他信徒效法的范例。“榜样”是现代汉语中最自然、清楚的表达，同时脚注保留其他可能译法。
- source_word: πᾶσιν τοῖς πιστεύουσιν
  choice: 所有信徒
  rationale: πιστεύουσιν为名词性分词，指所有相信的人；“所有信徒”简洁自然。汉语以“……的榜样”表达希腊语与τύπον相连的与格关系。
- source_word: ἐν τῇ Μακεδονίᾳ καὶ ἐν τῇ Ἀχαΐᾳ
  choice: 马其顿和亚该亚
  rationale: 两个介词短语修饰“信徒”，说明他们所在的地区；汉语合并共同的地点关系，可避免重复而不损失意义。
theological_decisions: []
