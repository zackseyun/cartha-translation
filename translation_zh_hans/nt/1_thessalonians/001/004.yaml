id: 1TH.1.4
reference: 1 Thessalonians 1:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἰδότες, ἀδελφοὶ ἠγαπημένοι ὑπὸ ⸀θεοῦ, τὴν ἐκλογὴν ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/004.yaml
  text: For we know[a], brothers loved by God, your election[b],
translation:
  language: zh_hans
  text: 因为我们知道，上帝所爱的弟兄们[a]，你们是蒙拣选的[b]；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“弟兄姊妹们”。希腊文直译为“弟兄们”，但保罗书信中的这一称呼常指整个信徒群体。
    reason: lexical_alternative
  - marker: b
    text: 直译“你们的拣选”，也可译作“你们蒙拣选这件事”。原文在这里没有进一步界定“拣选”的神学含义。
    reason: alternative_reading
lexical_decisions:
- source_word: εἰδότες
  choice: 因为我们知道
  rationale: 原文为分词“知道”，承接上文并引出保罗说明自己确信的依据。汉语用“因为我们知道”能自然呈现其解释性语气。
- source_word: ἀδελφοὶ
  choice: 弟兄们
  rationale: 保留希腊语阳性复数称呼的形式；在保罗书信中，这一称呼通常面向包括男女在内的整个信徒群体，故以脚注说明。
- source_word: ἠγαπημένοι ὑπὸ θεοῦ
  choice: 上帝所爱的
  rationale: 忠实表达被动关系，并以自然现代汉语体现完成时分词所指向的、因上帝之爱而形成的持续身份。
- source_word: τὴν ἐκλογὴν ὑμῶν
  choice: 你们是蒙拣选的
  rationale: 原文直译为“你们的拣选”。汉语将名词结构转为述谓结构更自然，同时保留“拣选”这一具有神学分量、但在本节未被进一步界定的词。
theological_decisions:
- issue: 如何翻译教义讨论中含义易被预设的 ἐκλογή
  choice: 蒙拣选
  alternative: 你们的拣选；上帝拣选了你们
  rationale: “蒙拣选”保留神为施事者的被动含义，却不把本节扩展为某一套预定论体系。“上帝拣选了你们”虽清楚，但比原文名词结构更明确地补出了施事者。
- issue: 是否在正文中明确把 ἀδελφοί 译为包括女性的称呼
  choice: 弟兄们
  alternative: 弟兄姊妹们
  rationale: 正文保留原文阳性复数形式；其在保罗书信中常涵盖全体信徒的语用范围，则在脚注中说明，兼顾形式与实际指称。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“上帝所爱的弟兄们”保留称呼结构；“蒙拣选”是现代基督教汉语中通行且不显古奥的表达。句末分号表明本节句法尚未结束，并与下一节所述知道的依据相连。
