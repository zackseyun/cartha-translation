source:
  edition: SBLGNT
  text: καὶ ὑμεῖς μιμηταὶ ἡμῶν ἐγενήθητε καὶ τοῦ κυρίου, δεξάμενοι τὸν λόγον ἐν θλίψει πολλῇ μετὰ χαρᾶς πνεύματος ἁγίου,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/006.yaml
  text: And you became imitators of us and of the Lord[a], having received the word in much affliction with joy of the Holy Spirit,
translation:
  language: zh_hans
  text: 你们也成了效法我们和主的人，在极大的患难中，带着圣灵的喜乐[a]领受了这道。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣灵的喜乐”也可理解为“圣灵所赐的喜乐”，即圣灵所产生的喜乐。
    reason: 说明属格关系的真实歧义，并呈现较可能的来源或产生者含义。
lexical_decisions:
- source_word: μιμηταὶ
  choice: 效法……的人
  rationale: 准确表达以他人为榜样并加以仿效的含义，也保留保罗明确使用的“效法”概念；比单纯译作“跟从者”更具体。
- source_word: ἐγενήθητε
  choice: 成了
  rationale: 反映这里所表达的状态转变，同时符合现代汉语习惯。
- source_word: τοῦ κυρίου
  choice: 主
  rationale: 此处指耶稣，并作为基督论称号使用；“主”是准确而通行的译法。
- source_word: δεξάμενοι
  choice: 领受了
  rationale: 既表达接受所传信息，也保留宗教语境中主动接纳的意味；在句中说明他们如何成为效法者。
- source_word: τὸν λόγον
  choice: 这道
  rationale: 指先前传给帖撒罗尼迦人的福音信息；“道”保留保罗用词的经文关联，“这”则使汉语指称自然。
- source_word: ἐν θλίψει πολλῇ
  choice: 在极大的患难中
  rationale: 表达沉重的压迫、困苦和苦难，又避免“灾难”等词可能带入的末世限定含义。
- source_word: μετὰ χαρᾶς
  choice: 并有……喜乐
  rationale: 以自然汉语表达他们领受这道时伴随的喜乐。
- source_word: πνεύματος ἁγίου
  choice: 圣灵的
  rationale: 保留希腊语属格关系，没有在正文中完全限定为来源、产生者或性质描述。
theological_decisions:
- issue: “圣灵的喜乐”中属格的关系
  choice: 正文译作“圣灵的喜乐”，保留关系上的含蓄
  alternative: “圣灵所赐的喜乐”或“从圣灵而来的喜乐”
  rationale: 上下文很可能表明这喜乐源于圣灵，但希腊语属格本身没有明确标出唯一关系；正文保留形式上的开放性，脚注说明较可能的来源或产生者含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“成了效法……的人”保留状态转变和效法用语；“极大的患难”清楚表达强烈程度；“圣灵的喜乐”刻意保留原文属格关系，并以脚注解释。
