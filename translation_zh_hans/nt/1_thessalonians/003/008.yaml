  text: For now we live[b][a], if you stand firm in the Lord.
translation:
  language: zh_hans
  text: 因为[a]你们若在主里站立得稳，我们现在就活了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “因为”也可理解为“原来”，或在汉语中不明确译出；原词在这里承接并解释上文。
    reason: lexical_alternative
  - marker: b
    text: “活了”很可能是修辞说法，表示重新得力、振奋起来，并非仅指肉身存活。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 此处承接上文，说明保罗一行得安慰的缘由。“因为”保留其因果、解释作用；在汉语中也可按语境理解为对上文的进一步说明。
- source_word: νῦν
  choice: 现在
  rationale: 直接保留时间副词，突出帖撒罗尼迦信徒坚定的消息使保罗一行此刻重新振作。
- source_word: ζῶμεν
  choice: 我们……活了
  rationale: 保留原文“活”的鲜明表达，不在正文中将其解释性改写为“振作起来”或“有了活力”，从而保留修辞张力。
- source_word: ἐὰν
  choice: 若
  rationale: 保留原文的条件形式，同时采用自然、庄重的现代汉语表达，不将条件强化为“唯有”或弱化为单纯原因。
- source_word: ὑμεῖς
  choice: 你们
  rationale: 明确保留原文代词，使帖撒罗尼迦信徒成为条件从句的焦点。
- source_word: στήκετε
  choice: 站立得稳
  rationale: 准确表达坚定站立、持守不移的持续状态，也符合现代汉语的圣经语体。
- source_word: ἐν κυρίῳ
  choice: 在主里
  rationale: 保留保罗惯用而含义丰富的关系或领域表达，不将其收窄为“忠于主”或扩写为某一特定的联合观。
theological_decisions:
- issue: “我们现在就活了”的含义
  choice: 正文保留“活了”这一原文意象，让它在语境中表达重新得力、振奋和欣慰。
  alternative: 直译为肉身继续存活；或解释性译为“我们现在就重新振作起来了”。
  rationale: 这里很可能是带有夸张色彩的牧养修辞，而非声称保罗的肉身生命取决于信徒；但正文不应以解释性措辞消除原文的张力。
- issue: “在主里”的含义
  choice: 保留为“在主里”，指在与主的关系和主所界定的领域中坚定持守。
  alternative: 译为“与主联合”或“忠于主”。
  rationale: 原文表达宽广且神学内涵丰富，直保留其形式可避免导入特定宗派对坚忍或联合的界定。
- issue: 条件句的修辞作用
  choice: 保留“若”，呈现保罗原有的条件表达。
  alternative: 按实际已知情况译成“既然你们在主里站立得稳”。
  rationale: 上文表明保罗已经听到他们信心坚定的消息，但本句仍使用条件结构；翻译不应静默地把这一结构改成确定原因。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“站立得稳”和“在主里”保留保罗原文的核心意象与神学开放性；句序略按汉语习惯调整为先说条件、后说结果，同时以“因为”保持与上文的解释关系。
