reference: 1 Thessalonians 3:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: διὰ τοῦτο κἀγὼ μηκέτι στέγων ἔπεμψα εἰς τὸ γνῶναι τὴν πίστιν ὑμῶν, μή πως ἐπείρασεν ὑμᾶς ὁ πειράζων καὶ εἰς κενὸν γένηται ὁ κόπος ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/005.yaml
  text: For this reason[a], when I could bear it no longer, I sent to learn about your faith[b], lest somehow the tempter had tempted you and our labor might be in vain.
translation:
  language: zh_hans
  text: 因此，我也再也忍耐不住，就派人去了解你们的信心[a]，唯恐那试探人的已经试探了你们，致使我们的劳苦归于徒然[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “信心”也可译作“信靠”或“忠信”。希腊词在此可能包含彼此重叠的含义。
    reason: alternative_reading
  - marker: b
    text: “归于徒然”也可译作“落了空”或“白费了”。
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: 因此
  rationale: 自然表达因果承接关系，并回指上文所述的情况。
- source_word: κἀγὼ
  choice: 我也
  rationale: 明确表达 κἀγώ 中 καί 的“也”，与上文复数叙述及保罗个人行动相衔接。
- source_word: μηκέτι στέγων
  choice: 再忍耐不住
  rationale: 以自然现代汉语表达持续承受已达到极限；“忍耐”在此指承受处境，并非特指某种道德美德。
- source_word: ἔπεμψα
  choice: 就派人去
  rationale: 希腊文未明说宾语，汉语则通常需要补出泛指的“人”；不直接写“提摩太”，避免把上下文信息写成本节明言的内容。
- source_word: εἰς τὸ γνῶναι
  choice: 去了解
  rationale: 表达目的以及查明情况的意味，比直译“去知道”更符合现代汉语。
- source_word: τὴν πίστιν ὑμῶν
  choice: 你们的信心
  rationale: 在本段最自然地指帖撒罗尼迦信徒持续相信福音的状态，同时以脚注保留“信靠”与“忠信”的语义可能。
- source_word: μή πως
  choice: 唯恐
  rationale: 简洁表达带忧虑的可能性，符合该结构在此处的语气。
- source_word: ἐπείρασεν ὑμᾶς ὁ πειράζων
  choice: 那试探人的已经试探了你们
  rationale: 保留同一词根形成的重复，也不把描述性称谓直接改写成“撒但”；“已经”反映不定过去时在忧虑内容中所指向的可能既成事件。
- source_word: εἰς κενὸν γένηται
  choice: 归于徒然
  rationale: 自然表达“变得没有成果、落空”的意思，并保留 γένηται 的结果性；脚注列出更口语化的替代说法。
- source_word: ὁ κόπος ἡμῶν
  choice: 我们的劳苦
  rationale: “劳苦”比一般的“工作”更能表达 κόπος 所含的辛劳与付出。
theological_decisions:
- issue: πίστις 在保罗语境中的多重含义
  choice: 信心
  alternative: 信靠；忠信
  rationale: 上下文主要关切他们是否仍持守对福音的信，因此正文采用通行且自然的“信心”；但该词也可侧重信靠或忠信，故在脚注中保留这些可能。
- issue: ὁ πειράζων 的身份与译法
  choice: 那试探人的
  alternative: 试探者；那诱惑人的
  rationale: 上下文可让读者联想到撒但，但原文使用描述性分词而非专名；译文不把隐含身份变成明说，并保留 πειράζω 在试探与诱惑之间的语义张力。
- issue: 忧虑从句中两个动词的时间与可能性
  choice: 已经试探了……使……归于徒然
  alternative: 或许试探了……我们的劳苦就会落空
  rationale: ἐπείρασεν 是不定过去直陈式，γένηται 是虚拟式；中文用“唯恐”统摄不确定性，同时以“已经”呈现前一事件可能已经发生，以结果表达后一虚拟式，避免把整句断言为事实。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“再忍耐不住”“派人去了解”保持口吻自然；“劳苦归于徒然”略带书面色彩，以符合书信经文的庄重语域。脚注标记分别紧随其实际说明的词语，避免标记与内容错位。
