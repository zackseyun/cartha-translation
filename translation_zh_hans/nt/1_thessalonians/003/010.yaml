  text: νυκτὸς καὶ ἡμέρας ὑπερεκπερισσοῦ δεόμενοι εἰς τὸ ἰδεῖν ὑμῶν τὸ πρόσωπον καὶ καταρτίσαι τὰ ὑστερήματα τῆς πίστεως ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/010.yaml
  text: night and day praying most earnestly to see your face and to supply what is lacking in your faith,[a]
translation:
  language: zh_hans
  text: 我们昼夜都极其恳切地祈求，盼望能与你们见面，并补足你们信心中所欠缺的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可理解为：坚固或使你们信心中仍有不足之处得到完善。
    reason: lexical_alternative
lexical_decisions:
- source_word: νυκτὸς καὶ ἡμέρας
  choice: 昼夜都
  rationale: 两个属格作副词使用，表达夜以继日、反复持续的行动。“昼夜都”简洁自然，也保留持续祈求的意味。
- source_word: ὑπερεκπερισσοῦ
  choice: 极其恳切地
  rationale: 这是罕见的加强语气副词，表示程度格外强烈；结合δεόμενοι译为“极其恳切地祈求”，在现代汉语中自然地传达其强度。
- source_word: δεόμενοι
  choice: 祈求
  rationale: 该分词指恳切提出请求；“祈求”符合向上帝祷告的语境，而强烈程度由“极其恳切地”表达。
- source_word: εἰς τὸ ἰδεῖν
  choice: 盼望能……见面
  rationale: 介词加冠词化不定式在此表达祈求的目的或所求之事；“盼望能”使汉语句法顺畅，同时不把目的与结果区分得过死。
- source_word: ὑμῶν τὸ πρόσωπον
  choice: 与你们见面
  rationale: 原文直译为“见你们的面”，是指亲身相见的惯用表达；现代汉语用“与你们见面”准确传达其关系性含义。
- source_word: καταρτίσαι
  choice: 补足
  rationale: 该动词可表示整顿、修复、装备或使之完备。与“所欠缺的”搭配时，“补足”最贴合上下文，同时保留使信心得到完善或加强的含义。
- source_word: τὰ ὑστερήματα
  choice: 所欠缺的
  rationale: 复数名词指不足、缺欠之处；汉语用集合性的“所欠缺的”自然表达，并不暗示他们全无信心。
- source_word: τῆς πίστεως ὑμῶν
  choice: 你们信心中
  rationale: 此处πίστις主要指帖撒罗尼迦信徒对上帝或基督的信靠。“信心中”清楚表明有待补足的是其信心的某些方面。
theological_decisions:
- issue: πίστις的译法
  choice: 信心
  alternative: 信实；信靠
  rationale: 上下文谈到帖撒罗尼迦信徒已有却仍需坚固、完善的信，主要指其信靠，故译“信心”；不把这里限定为行为上的“信实”。
- issue: 信心“欠缺”与“补足”的含义
  choice: 补足你们信心中所欠缺的
  alternative: 使你们的信心完全；坚固你们信心中仍不足之处
  rationale: 原文既可指补上具体缺欠，也可较宽泛地指修整、装备或使信心趋于完备。正文采用贴近词语搭配的译法，脚注保留较宽的理解，避免断定他们缺少得救的信心。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。“极其恳切”保留原文加强语气；“与你们见面”自然传达“见你们的面”这一惯用语。“补足……所欠缺的”略带经文式凝练，但在现代汉语中仍清楚，并由脚注说明καταρτίσαι较宽的语义范围。
