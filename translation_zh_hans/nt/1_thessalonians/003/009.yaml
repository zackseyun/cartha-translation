  text: τίνα γὰρ εὐχαριστίαν δυνάμεθα τῷ θεῷ ἀνταποδοῦναι περὶ ὑμῶν ἐπὶ πάσῃ τῇ χαρᾷ ᾗ χαίρομεν δι’ ὑμᾶς ἔμπροσθεν τοῦ θεοῦ ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/009.yaml
  text: For what thanksgiving can we repay to God concerning you[a], for all the joy with which we rejoice because of you before our God,
translation:
  language: zh_hans
  text: 我们能为了你们，因我们在我们的神面前因你们而有的一切喜乐，以怎样的感谢回报神呢？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τίνα…εὐχαριστίαν
  choice: 怎样的感谢
  rationale: 保留疑问词修饰“感谢”的结构和反问语气，表达任何感谢似乎都不足以回应神的恩惠。
- source_word: ἀνταποδοῦναι
  choice: 回报
  rationale: 此动词有“作为回应而归还、报答”之意；“回报”保留原文的互惠比喻，但反问语气表明这不是说人能与神作等价交易。
- source_word: περὶ ὑμῶν
  choice: 为你们
  rationale: περί加属格表示所关涉的对象。汉语“为你们”自然地表达因帖撒罗尼迦信徒而向神献上感谢，同时脚注保留更贴近形式的理解。
- source_word: ἐπὶ πάσῃ τῇ χαρᾷ
  choice: 为了这一切喜乐
  rationale: ἐπί加与格在此表示感谢的根据或缘由；“为了”使它与向神献上感谢的关系清楚。
- source_word: ᾗ χαίρομεν
  choice: 满心欢喜
  rationale: 原文以同根词“喜乐—喜乐”加强语气。汉语若逐字重复会显生硬，因此以“满心欢喜”自然表达强烈而完全的喜乐。
- source_word: δι’ ὑμᾶς
  choice: 因你们而
  rationale: διά加宾格在此表示原因，明确这喜乐是因收信人的信心与坚立而生。
- source_word: ἔμπροσθεν τοῦ θεοῦ ἡμῶν
  choice: 在我们的神面前
  rationale: 保留原文的空间性表达，指在神的临在与鉴察之中。
theological_decisions:
- issue: 向神“回报”感谢的修辞意义
  choice: 保留“回报”的比喻，并以反问句表达感谢之不足
  alternative: 意译为“我们该怎样为你们感谢神才够呢？”
  rationale: ἀνταποδοῦναι明确含有回报或归还之意。保留这一措辞能呈现保罗的修辞张力；反问语境则避免把它误解为人能偿还神或与神进行等价交换。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“满心欢喜”避免机械重复“喜乐……喜乐”，同时传达原文同根词所强调的充盈喜悦；全句保留反问及“回报”的鲜明比喻。
