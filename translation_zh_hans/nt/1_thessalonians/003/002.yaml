id: 1TH.3.2
reference: 1 Thessalonians 3:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἐπέμψαμεν Τιμόθεον, τὸν ἀδελφὸν ἡμῶν καὶ ⸀συνεργὸν τοῦ ⸀θεοῦ ἐν τῷ εὐαγγελίῳ τοῦ Χριστοῦ, εἰς τὸ στηρίξαι ὑμᾶς καὶ παρακαλέσαι ⸀ὑπὲρ τῆς πίστεως ὑμῶν
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/002.yaml
  text: and we sent Timothy[a], our brother and God's fellow worker in the gospel of the Messiah, to strengthen you and to encourage you concerning your faith[b],
translation:
  language: zh_hans
  text: 我们也派了提摩太去；他是我们的弟兄，并在弥赛亚[b]的福音事工中作上帝的同工[a]，为要坚固你们，并就你们的信仰鼓励你们[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “上帝的同工”也可理解为“与上帝同工的人”。有些抄本采用不同措辞，如“上帝的仆人”。
    reason: alternative_reading
  - marker: b
    text: 希腊文是“基督”，意思是“弥赛亚（受膏者）”；这里译作“弥赛亚”，以突出其称号含义。也可按传统译作“基督”。
    reason: lexical_alternative
  - marker: c
    text: “就你们的信仰鼓励你们”也可译作“为了你们的信仰鼓励你们”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέμψαμεν
  choice: 我们还派了……去
  rationale: 不定过去时在这里叙述已经发生的行动，译为“派了……去”自然明确；καί 译作“还”，承接上文。
- source_word: Τιμόθεον
  choice: 提摩太
  rationale: 采用现代中文圣经读者熟悉的标准人名译法。
- source_word: τὸν ἀδελφὸν ἡμῶν
  choice: 我们的弟兄
  rationale: 保留信徒群体中的亲属隐喻及原文的单数阳性形式，不扩译为“同信者”。
- source_word: συνεργὸν τοῦ θεοῦ
  choice: 上帝的同工
  rationale: 直接保留属格结构及其有力度的表达，不因神学上的张力而弱化为“上帝的仆人”。
- source_word: ἐν τῷ εὐαγγελίῳ τοῦ Χριστοῦ
  choice: 在弥赛亚的福音上
  rationale: ἐν 表示工作的领域；保留“福音—弥赛亚”之间属格关系的开放性，不擅自限定为福音的来源或内容。
- source_word: Χριστοῦ
  choice: 弥赛亚
  rationale: 此处 Χριστός 在“福音”的属格结构中具有明显的称号意味；“弥赛亚”直接表达“受膏者”这一称号含义。
- source_word: εἰς τὸ στηρίξαι ὑμᾶς
  choice: 是要使你们坚定
  rationale: εἰς 加冠词不定式表示目的；“使你们坚定”既忠实又符合现代汉语牧养语境。
- source_word: παρακαλέσαι
  choice: 鼓励
  rationale: παρακαλέω 可指鼓励、劝勉或安慰；与“使……坚定”并列并涉及受压中的信仰时，“鼓励”最能保留宽广而支持性的语义。
- source_word: ὑπὲρ τῆς πίστεως ὑμῶν
  choice: 在信仰上……你们
  rationale: 表达鼓励所涉及的方面，同时以脚注保留 ὑπέρ 可能具有“为了、为着”的目的或受益意味。
- source_word: πίστεως
  choice: 信仰
  rationale: 这里指帖撒罗尼迦信徒所持守、倚靠的信；“信仰”在现代汉语中比单独的“信”更清楚，也不把含义缩窄为人的忠诚品质。
theological_decisions:
- issue: συνεργὸν τοῦ θεοῦ 的关系及异文
  choice: 上帝的同工
  alternative: 与上帝同工的人；上帝的仆人
  rationale: SBLGNT 正文为 συνεργὸν τοῦ θεοῦ，应保留其强烈措辞和神学张力。“与上帝同工的人”是属格关系的一种理解；另有抄本支持“上帝的仆人”等不同措辞，故列入脚注而不改动正文。
- issue: Χριστοῦ 在 εὐαγγελίῳ τοῦ Χριστοῦ 中的称号意味
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处更适合作为称号理解，因此正文用“弥赛亚”；传统且为读者熟悉的“基督”保留在脚注中。
- issue: ὑπὲρ τῆς πίστεως ὑμῶν 的语义范围
  choice: 在信仰上鼓励你们
  alternative: 为了你们的信仰鼓励你们
  rationale: ὑπέρ 加属格既可表示“关于、就……而言”，也可表示“为了……的缘故”。正文采用自然且贴合语境的方面义，脚注保留目的或受益义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。为避免把较长的希腊语句硬套成生涩中文，分为两句，并在第二句重复“我们派他去”，清楚表达目的关系。正文保留“上帝的同工”“弥赛亚的福音”等原文中的关系与神学张力，未擅自解释福音究竟是出于弥赛亚还是以弥赛亚为内容。
