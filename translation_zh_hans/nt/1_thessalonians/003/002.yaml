revisions:
- from: 我们还派了我们的弟兄提摩太去；他在弥赛亚[b]的福音上是上帝的同工[a]。我们派他去，是要使你们坚定，并在信仰上鼓励你们[c]。
  to: 我们也派了提摩太去；他是我们的弟兄，并在弥赛亚[b]的福音事工中作上帝的同工[a]，为要坚固你们，并就你们的信仰鼓励你们[c]。
  rationale: 修订消除不必要的“还”所造成的附加语气，改善“福音上”的汉语搭配，并保留原文的并列结构、目的关系及 ὑπέρ 的语义开放性。脚注锚点均保留并与所注词语对应。
