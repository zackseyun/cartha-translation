  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ἄρτι δὲ ἐλθόντος Τιμοθέου πρὸς ἡμᾶς ἀφ’ ὑμῶν καὶ εὐαγγελισαμένου ἡμῖν τὴν πίστιν καὶ τὴν ἀγάπην ὑμῶν, καὶ ὅτι ἔχετε μνείαν ἡμῶν ἀγαθὴν πάντοτε ἐπιποθοῦντες ἡμᾶς ἰδεῖν καθάπερ καὶ ἡμεῖς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/006.yaml
  text: But now that Timothy has come to us from you and has brought us the good news of your faith and love[a], and that you always have a good remembrance of us, longing to see us just as we also long to see you,
translation:
  language: zh_hans
  text: 但如今，提摩太从你们那里来到我们这里，向我们报来有关你们信心和爱心[a]的好消息；他又说，你们一直以善意记念我们，渴望见到我们，正如我们也渴望见到你们一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们的忠信和爱心”。希腊语 pistis 可指信心、信靠或忠信；正文采用本项目通常的译法“信心”。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄρτι
  choice: 现在……刚
  rationale: 既承接前文、标明叙事转折，又表达提摩太不久前抵达的时间意味，符合现代汉语习惯。
- source_word: δὲ
  choice: 但
  rationale: 表达从先前忧虑转向如今得安慰的温和转折。
- source_word: ἐλθόντος Τιμοθέου πρὸς ἡμᾶς ἀφ’ ὑμῶν
  choice: 提摩太刚从你们那里回到我们这里
  rationale: 将独立属格结构自然转换为汉语分句；“回到”体现提摩太受差遣后从帖撒罗尼迦返回保罗身边的语境。
- source_word: εὐαγγελισαμένου
  choice: 把……的好消息带给我们
  rationale: 在这里指有利的报告，而非专指传讲福音；“好消息”仍保留该动词与福音用语的词汇联系。
- source_word: τὴν πίστιν
  choice: 信心
  rationale: 按本项目惯例以“信心”表达 πίστις；本处主要指他们持续的信，但也可能带有忠信、坚守之意，故以脚注保留。
- source_word: τὴν ἀγάπην
  choice: 爱心
  rationale: “爱心”是现代中文圣经语境中自然、明确的对应表达。
- source_word: μνείαν ἡμῶν ἀγαθὴν
  choice: 怀念我们
  rationale: 此处不只是记得，还含善意地记念之意；“怀念”自然传达正面的情感色彩，并与下文渴望相见相合。
- source_word: πάντοτε
  choice: 一直
  rationale: 自然表达持续不断的时间意义。
- source_word: ἐπιποθοῦντες ἡμᾶς ἰδεῖν
  choice: 渴望见到我们
  rationale: 保留强烈而亲切的盼望之情。
- source_word: καθάπερ καὶ ἡμεῖς ὑμᾶς
  choice: 正如我们也渴望见到你们一样
  rationale: 补出希腊文省略但语义明确的谓语，使中文完整流畅，并保留双方彼此想见的对称关系。
theological_decisions:
- issue: πίστις 在本语境可指“信心”，也可能含“忠信”意味
  choice: 你们的信心
  alternative: 你们的忠信
  rationale: 上下文着重帖撒罗尼迦信徒在患难中仍持守所信，因此正文采用项目默认译法“信心”；同时不排除其坚贞忠信的语义色彩，以脚注保存这一可能。
translation_notes:
  register: 采用现代、庄重而易懂的书信体中文。以“刚……回到”顺畅表达近期抵达，以“怀念”避免生硬的“有美好的记念”，同时保留彼此深切盼望相见的情感。
