  to: 但如今，提摩太从你们那里来到我们这里，向我们报来有关你们信心和爱心[a]的好消息；他又说，你们一直以善意记念我们，渴望见到我们，正如我们也渴望见到你们一样。
  rationale: 删除“回到”以严格对应原文仅表达的“从你们那里来到我们这里”。将报告内容调整为“有关你们信心和爱心的好消息”，并将“怀念”改为“以善意记念”，使中文更清楚呈现 εὐαγγελισαμένου 与 μνείαν ἡμῶν ἀγαθὴν 的语义。未改变 πίστις 的正文译法及其替代义脚注。
