id: 1TH.3.4
reference: 1 Thessalonians 3:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ γὰρ ὅτε πρὸς ὑμᾶς ἦμεν, προελέγομεν ὑμῖν ὅτι μέλλομεν θλίβεσθαι, καθὼς καὶ ἐγένετο καὶ οἴδατε.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/004.yaml
  text: For even when we were with you[a], we kept telling you beforehand that we were going to suffer affliction, just as it also happened, and you know it.
translation:
  language: zh_hans
  text: 因为我们和你们在一起的时候，就一再预先告诉你们，我们将要遭受患难[a]；事情也果然如此，这是你们知道的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“受压迫”或“受苦难”。希腊语动词可指承受压力、困苦或迫害。
    reason: 词义备选：说明θλίβεσθαι的语义范围，避免把患难过度限定为某一类苦难。
lexical_decisions:
- source_word: καὶ γὰρ
  choice: 因为
  rationale: γάρ承接上一节作解释；中文用“因为”保留其因果、说明作用。καί的轻微强调不宜机械译出，以免表达生硬。
- source_word: ὅτε πρὸς ὑμᾶς ἦμεν
  choice: 我们和你们在一起的时候
  rationale: πρὸς ὑμᾶς与ἦμεν连用，指身处对方那里、与对方同在；此译自然并保留关系意味。
- source_word: προελέγομεν
  choice: 就一再预先告诉你们
  rationale: 未完成时表示过去持续或反复进行的行动，以“一再”体现其体貌；“预先告诉”准确表达προλέγω的提前告知之意，又不擅自强化为“警告”。
- source_word: ὅτι μέλλομεν θλίβεσθαι
  choice: 我们将要遭受患难
  rationale: μέλλομεν表达当时所预期或临近的未来，“将要”符合嵌入过去叙述中的直接引语内容；θλίβεσθαι以“遭受患难”保留受压、困苦及迫害等较宽语义。
- source_word: καθὼς καὶ ἐγένετο
  choice: 事情也果然如此
  rationale: καθώς表示事实与先前所说相符；“果然如此”自然体现预告得到应验，καί则以“也”表达。
- source_word: καὶ οἴδατε
  choice: 这是你们知道的
  rationale: 原文宾语隐含，所指为刚提到的事情确已发生；中文补出“这”使表达完整，同时保留并列陈述的语气。
theological_decisions:
- issue: θλίβεσθαι所指患难的性质
  choice: 采用涵盖面较广的“遭受患难”，可包括压力、困苦或迫害
  alternative: 明确译为“遭受迫害”，或采用可能带有末世论术语色彩的“经历大患难”
  rationale: 上下文容许迫害包含在内，但该动词本身并未把苦难限定为某一种形式，也没有在本节中明确赋予其专门的末世论含义，故保留原文的语义宽度。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“一再预先告诉”保留未完成时的反复意味；分号清楚区分事先告知与后来应验。脚注标记置于其实际说明的“患难”之后。
