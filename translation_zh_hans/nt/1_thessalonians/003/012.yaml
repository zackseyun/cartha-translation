id: 1TH.3.12
reference: 1 Thessalonians 3:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὑμᾶς δὲ ὁ κύριος πλεονάσαι καὶ περισσεύσαι τῇ ἀγάπῃ εἰς ἀλλήλους καὶ εἰς πάντας, καθάπερ καὶ ἡμεῖς εἰς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/012.yaml
  text: And may the Lord cause you to increase and abound in love for one another and for all[a], just as we also do for you[b],
translation:
  language: zh_hans
  text: 愿主使你们彼此之间以及对众人的爱[a]不断增长，越发充盈，正如我们对你们的爱也是如此[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“向着彼此，也向着众人。”
    reason: 词义备选：εἰς可更直接地表达爱的方向。
  - marker: b
    text: 希腊文末句有所省略，直译为“正如我们也对你们”；其含义需由上文补足。
    reason: 说明原文的省略结构，避免读者误以为补出的“爱也是如此”在原文中完整出现。
lexical_decisions:
- source_word: ὁ κύριος
  choice: 主
  rationale: 保留κύριος在保罗书信中常用的尊称，不在正文中明确其所指，从而避免加入原句未明说的解释。
- source_word: πλεονάσαι
  choice: 使……不断增长
  rationale: 这是祈愿结构中的不定过去时祈愿语气；以“愿主使……”表达祈愿及主语所带出的使动意味。
- source_word: περισσεύσαι
  choice: 越发充盈
  rationale: 与πλεονάσαι并列，形成递进和加强；“充盈”表达超过一般增长、达到丰盛的意味，同时保留两个动词。
- source_word: τῇ ἀγάπῃ
  choice: 爱
  rationale: ἀγάπη按现代汉语常用而庄重地译为“爱”；通过“……的爱不断增长”自然表达爱是增长与充盈所涉及的方面。
- source_word: εἰς ἀλλήλους καὶ εἰς πάντας
  choice: 彼此之间以及对众人
  rationale: 用“彼此之间”与“对众人”表达爱所指向的对象；“众人”保留πάντας的广泛而未限定的范围。
- source_word: καθάπερ καὶ ἡμεῖς εἰς ὑμᾶς
  choice: 正如我们对你们的爱也是如此
  rationale: 希腊文末句省略前文可补足的爱与增长、充盈之意；正文按汉语需要适度补足，同时以脚注说明原文的省略结构。
- source_word: δὲ
  choice: 愿
  rationale: δέ在此承接上下文而非表示强烈转折；汉语祈愿句不必另加生硬的连接词，“愿”直接呈现本句功能。
theological_decisions:
- issue: “主”的所指
  choice: 正文只译作“主”
  alternative: 明确译作“主耶稣”或“神”
  rationale: 本节只用κύριος这一称号；虽可结合上下文作基督论或更一般的神性理解，译文不替原文消除这一空间。
- issue: πάντας的范围
  choice: 译作“众人”，不进一步限定
  alternative: “所有人”或“所有信徒”
  rationale: 原词范围宽泛，可能将爱扩展至群体之外，但本身没有明说特定类别；“众人”既保留广度，也避免解释性缩窄。
- issue: 末句省略成分
  choice: 按汉语补为“我们对你们的爱也是如此”
  alternative: 明确补为“我们对你们的爱也不断增长、越发充盈”
  rationale: 原文仅有“正如我们也对你们”，动词和相关概念均承前省略；所选译法使句子完整，却不把省略内容限定得过细。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“不断增长，越发充盈”保留两个近义动词所形成的递进；句法略作调整，使爱的对象在汉语中清楚自然。
