  text: διὰ τοῦτο παρεκλήθημεν, ἀδελφοί, ἐφ’ ὑμῖν ἐπὶ πάσῃ τῇ ⸂ἀνάγκῃ καὶ θλίψει⸃ ἡμῶν διὰ τῆς ὑμῶν πίστεως,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/007.yaml
  text: For this reason[a], brothers, concerning you, in all our distress and affliction[b], we were comforted through your faith.
translation:
  language: zh_hans
  text: 弟兄们，因此，在我们一切的困苦和患难中，我们因你们的缘故，借着你们的信心[a]得了安慰。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “信心”也可理解为“忠信”或“坚定的信靠”；这里可能包括帖撒罗尼迦信徒持续相信并坚定不移的意思。
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: 因此
  rationale: 承接上文提摩太带来的好消息，表达因果与推论关系；“因此”简洁自然。
- source_word: παρεκλήθημεν
  choice: 得了安慰
  rationale: 此处是被动语态，结合困苦中的情境，指保罗一行因消息而得到慰藉和鼓舞；“得了安慰”最贴合上下文。
- source_word: ἀδελφοί
  choice: 弟兄们
  rationale: 保留希腊文阳性复数称呼及保罗书信的惯用表达；在当时会众语境中可泛指信徒群体。
- source_word: ἐφ’ ὑμῖν
  choice: 因你们而
  rationale: ἐπί加与格在此可表示安慰所关乎或所基于的对象；结合后面的“借着你们的信心”，中文用“因你们而”既自然，也不把该短语误接到困苦上。
- source_word: ἐπὶ πάσῃ τῇ ἀνάγκῃ καὶ θλίψει ἡμῶν
  choice: 我们虽身处种种困苦和患难之中
  rationale: 表示得安慰时所处的艰难境况。“虽……却……”使汉语关系清楚，但没有改变希腊文所表达的逆境背景；πάσῃ按集合意义译作“种种”。
- source_word: ἀνάγκῃ
  choice: 困苦
  rationale: 在受苦语境中指迫切压力或艰难处境；“困苦”比“需要”更能传达这里的经历性压力。
- source_word: θλίψει
  choice: 患难
  rationale: 指压迫、苦难或磨难；“患难”庄重而通行，并与“困苦”构成有区别的近义并列。
- source_word: διὰ τῆς ὑμῶν πίστεως
  choice: 借着你们的信心
  rationale: διά加属格通常表示途径或媒介；译为“借着”保留其工具性，而不简单改写为原因。
- source_word: πίστεως
  choice: 信心
  rationale: πίστις在此首先指帖撒罗尼迦信徒持续的信靠，也可能带有忠贞、坚定不移之意；正文采用常规译法“信心”，脚注保留语义张力。
theological_decisions:
- issue: πίστις在持续坚守信仰的语境中应译为“信心”还是“忠信”
  choice: 信心
  alternative: 忠信；坚定的信靠
  rationale: 上下文既关乎他们所持的信仰，也隐含他们在患难中持续坚定的表现。正文不把含义限定为人的忠诚行为，采用“信心”；脚注说明可能包含忠信、坚定不移的意味。
- issue: ἀδελφοί是否在正文中扩展为“弟兄姊妹”
  choice: 弟兄们
  alternative: 弟兄姊妹们
  rationale: 希腊文形式为阳性复数，正文保留其历史语言形式；该称呼在保罗书信中常面向整个信徒群体，但本节无需以扩展译法替代原文形式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“虽……却……”使困境与所得安慰之间的关系符合自然汉语；保留“因你们而”与“借着你们的信心”两个相近但不完全相同的成分，以体现原文结构。
