  yaml_path: translation/nt/1_thessalonians/003/001.yaml
  text: Therefore[a], when we could bear it no longer, we were pleased to be left alone in Athens[b],
translation:
  language: zh_hans
  text: 因此，我们再也无法忍受时，便决定独自留在雅典[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们认为最好独自被留在雅典。”
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὸ
  choice: 所以
  rationale: 表示由上文所得出的结论；“所以”自然简洁，并保留逻辑承接。
- source_word: μηκέτι στέγοντες
  choice: 再也忍耐不住
  rationale: μηκέτι 表示“不再”，στέγω 在此指承受或忍耐因挂念帖撒罗尼迦信徒而有的压力；合译为现代汉语惯用表达。
- source_word: εὐδοκήσαμεν
  choice: 甘愿
  rationale: 此词兼有乐意、情愿并作出决定的意味；“甘愿”保留积极意愿色彩，不将其仅仅处理为务实判断。
- source_word: καταλειφθῆναι
  choice: 留在
  rationale: 原文是不定过去时被动不定式，直译可作“被留下”；汉语“留在”更自然，而脚注保留其被动形式及“留下来”的可能表达。
- source_word: ἐν Ἀθήναις
  choice: 在雅典
  rationale: 按地点含义作标准译法。
- source_word: μόνοι
  choice: 独自
  rationale: 保留原文复数主体处于没有同伴的状态，同时不把“我们”改成单数。
theological_decisions:
- issue: 第一人称复数与上下文中单复数关系的张力
  choice: 保留“我们”所隐含的复数主体，并译作“独自”，不改写为单数。
  alternative: 把复数视为书信体复数，译成“我决定独自留下”，以配合某种历史重构。
  rationale: 原文 εὐδοκήσαμεν 和 μόνοι 都是复数。翻译应保存其语法形式，不替读者裁定这是保罗一人还是宣教团队的表达。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“再也忍耐不住”传达情感压力下达到承受极限；“甘愿”保留 εὐδοκήσαμεν 的积极意愿。主文以自然汉语处理被动式，脚注呈现较形式对应的译法。
