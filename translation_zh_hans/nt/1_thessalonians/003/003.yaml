  text: τὸ μηδένα σαίνεσθαι ἐν ταῖς θλίψεσιν ταύταις. αὐτοὶ γὰρ οἴδατε ὅτι εἰς τοῦτο κείμεθα·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/003.yaml
  text: so that no one would be shaken by these afflictions[c][b][a]. For you yourselves know that we are appointed for this.
translation:
  language: zh_hans
  text: 免得有人因这些患难而动摇[a][b]。因为你们自己知道，我们原是被安排要经历这些事的[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “动摇”也可译作“不安”或“受到搅扰”。这个罕见动词在其他语境中也可能有“受欺骗”或“受奉承而被拉拢”的意思。
    reason: lexical_alternative
  - marker: b
    text: “患难”也可译作“苦难”或“困苦”。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“我们原是注定要经历这些事的”或“我们原是处在这种境遇中的”。
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ μηδένα σαίνεσθαι
  choice: 免得有人……动摇
  rationale: 带冠词的不定式承接上文，表达目的或结果；译为“免得”在现代汉语中自然。罕见动词 σαίνεσθαι 在此最可能指因苦难而动摇、不安；“动摇”简洁地保留其牧养语境中的力度。
- source_word: ἐν ταῖς θλίψεσιν ταύταις
  choice: 因这些患难
  rationale: θλίψεις 指压力、困苦或患难；“患难”庄重而通俗，也符合保罗书信的语境。ἐν 在这里可表达处境或缘由，与“动摇”搭配时译作“因”较合乎现代汉语。
- source_word: αὐτοὶ
  choice: 你们自己
  rationale: 保留强调代词的语气，表明收信人对此亲自知晓。
- source_word: γὰρ
  choice: （不单独明译）
  rationale: γάρ 引出解释根据；汉语中前后两句的因果关系已经清楚，若硬译“因为”或“原来”会略显拖沓。“原”同时帮助体现解释语气。
- source_word: οἴδατε
  choice: 知道
  rationale: οἶδα 虽为完成时形式，却具有现在时意义，“知道”准确自然。
- source_word: εἰς τοῦτο
  choice: 为此
  rationale: 指向刚提到的这些患难；“为此”保留原文简洁性，不额外限定为某种特定目的。
- source_word: κείμεθα
  choice: 我们原是……而定的
  rationale: κεῖμαι 本义为被安放、处于某种位置，在此惯用结构中有被指定、注定或安排之意。“而定的”保留被动和既定意味，同时避免加入原文未明说的施事者。
theological_decisions:
- issue: εἰς τοῦτο κείμεθα 所表达的信徒与患难的关系
  choice: 我们原是为此而定的
  alternative: 我们命定要经历这些事；我们原是处在这种境遇中的
  rationale: 译文表明患难是信徒受召生活中既定而可预期的一部分，却不明确添加原文没有说明的施事者，也不把该句扩展成某一宗派关于预定的完整教义。
- issue: “此”具体指什么
  choice: 保留“为此”的指代开放性
  alternative: 我们原是被定要受患难的
  rationale: 近距离语境使“此”主要指这些患难，但原文仍用概括性的 τοῦτο；保留代词可避免把含义收窄得超过原文。
translation_notes:
  register: 采用现代、庄重而通俗的书面汉语。“患难”保留保罗用语的分量；“动摇”符合牧养语境。“我们原是为此而定的”刻意保留原文的被动表达、施事者未明以及“此”的概括指代。脚注标记均紧随相关词句。
