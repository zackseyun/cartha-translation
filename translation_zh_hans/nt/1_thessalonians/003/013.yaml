  text: εἰς τὸ στηρίξαι ὑμῶν τὰς καρδίας ἀμέμπτους ἐν ἁγιωσύνῃ ἔμπροσθεν τοῦ θεοῦ καὶ πατρὸς ἡμῶν ἐν τῇ παρουσίᾳ τοῦ κυρίου ἡμῶν ⸀Ἰησοῦ μετὰ πάντων τῶν ἁγίων ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/013.yaml
  text: so that he may establish your hearts blameless in holiness before our God and Father at the coming of our Lord Jesus with all his holy ones[a].
translation:
  language: zh_hans
  text: 好让他坚固你们的心，使你们的心在圣洁上无可指摘，在我们的主耶稣同他所有的圣者[a]来临时，站在我们的上帝和父面前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“同他的众圣徒”。这里的希腊语“圣者”可能指圣洁的人、天使，或两者。
    reason: 保留原文对ἁγίων所指对象的歧义，并提供较传统的另一译法。
lexical_decisions:
- source_word: εἰς τὸ στηρίξαι
  choice: 好使他坚固
  rationale: 介词加冠词不定式在此承接上文，表达目的或所期待的结果；用“好使”保留这一关系，并按上文的主语补出“他”，使中文完整自然。
- source_word: τὰς καρδίας
  choice: 你们的心
  rationale: “心”在保罗书信中指人的内在生命，不仅限于情感；直译既自然，也保留其丰富含义。
- source_word: ἀμέμπτους ἐν ἁγιωσύνῃ
  choice: 在圣洁上无可指摘
  rationale: ἀμέμπτους表示没有可受责难之处，ἁγιωσύνη表示圣洁的状态或品格；此译保留两者的修饰关系，而不把圣洁解释为特定宗派意义上的身份或过程。
- source_word: ἔμπροσθεν τοῦ θεοῦ καὶ πατρὸς ἡμῶν
  choice: 在我们的上帝和父面前
  rationale: 保留“上帝和父”的并列称谓及在其鉴察或临在之中的含义。
- source_word: ἐν τῇ παρουσίᾳ
  choice: 来临时
  rationale: παρουσία可指临在、到达或来临；在本节末世语境中，“来临”最清楚自然，同时不额外规定事件细节。
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ
  choice: 我们的主耶稣
  rationale: 按新约常规译法保留κύριος的称号意义，并采用标准人名译法。
- source_word: μετὰ πάντων τῶν ἁγίων αὐτοῦ
  choice: 同他所有的圣者
  rationale: “圣者”比“圣徒”更能保留ἅγιοι在本语境中可能指圣洁之人、天使或两者的宽度；“所有的”明确表达πάντων。
theological_decisions:
- issue: “他所有的圣者”的所指
  choice: 正文采用“圣者”，不限定为人或天使
  alternative: “众圣徒”或“众天使”
  rationale: 希腊文ἁγίων本身在这一末世语境中并未明确限定所指；译文及脚注保留其可能指圣洁之人、天使或两者的张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“好使……使……”保留原句的目的关系；将时间短语前置于“在我们的上帝和父面前”，以改善中文可读性，同时不改变希腊文各成分的语义关系。
