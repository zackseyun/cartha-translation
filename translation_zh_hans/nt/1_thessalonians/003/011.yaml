  text: Αὐτὸς δὲ ὁ θεὸς καὶ πατὴρ ἡμῶν καὶ ὁ κύριος ἡμῶν ⸀Ἰησοῦς κατευθύναι τὴν ὁδὸν ἡμῶν πρὸς ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/011.yaml
  text: May our God and Father himself[a], and our Lord Jesus[b], direct our way to you.
translation:
  language: zh_hans
  text: 愿我们的上帝和父，以及我们的主耶稣[a]，亲自引领我们前往你们那里[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文中，“我们的上帝和父”和“我们的主耶稣”是并列主语，却共用一个单数动词。
    reason: cross_reference
  - marker: b
    text: 也可译作“使我们前往你们那里的道路通直”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτὸς
  choice: 亲自
  rationale: αὐτός在这里是强调用法，突出父上帝本人；“亲自”在现代汉语中自然保留这一强调。
- source_word: δὲ
  choice: 不单独译出
  rationale: δέ在这里主要标示从叙述转入祈愿，语气较弱；汉语无需机械加入“现在”或“但”，以免产生原文没有的时间或转折意味。
- source_word: ὁ θεὸς καὶ πατὴρ ἡμῶν
  choice: 我们的父上帝
  rationale: 该结构以同一位为“上帝”和“父”；“我们的父上帝”自然、简洁地保留两个称谓和所属关系。
- source_word: ὁ κύριος ἡμῶν Ἰησοῦς
  choice: 我们的主耶稣
  rationale: 保留κύριος的“主”、Ἰησοῦς的“耶稣”以及ἡμῶν所表达的“我们的”。
- source_word: κατευθύναι
  choice: 愿……引领
  rationale: 不定过去时祈愿式表达祈求或愿望；“愿……引领”既传达祈愿语气，也涵盖使道路通达、引导行程的意义。
- source_word: τὴν ὁδὸν ἡμῶν
  choice: 我们到你们那里去
  rationale: 这里的“道路”指前往帖撒罗尼迦信徒那里的行程；用汉语动向结构表达较自然，同时由脚注保留“使道路通直”的词义图像。
- source_word: πρὸς ὑμᾶς
  choice: 到你们那里去
  rationale: 准确表达朝向并抵达收信人的行程方向，符合现代汉语习惯。
theological_decisions:
- issue: “我们的父上帝”与“我们的主耶稣”作为并列主语，却搭配单数动词
  choice: 在正文中明确保留父上帝和主耶稣两个并列主语，共同支配一个谓语“引领”
  alternative: 重组句子，把引领主要归于父上帝，或分别为二者添加谓语
  rationale: 希腊文把父上帝与主耶稣并列为单数祈愿式动词的主语。中文动词没有数的形态，不能直接再现这一形式，因此在脚注说明，以保存原文值得注意的语法和神学张力，而不作超出经文的推论。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“愿”清楚表达祈愿；避免以“现在”误译弱连接词δέ。“父上帝”使“上帝”与“父”明确指同一位，并让“亲自”的所指清楚。所有脚注标记均置于正文中。
