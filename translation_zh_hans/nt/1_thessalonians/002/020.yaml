base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/020.yaml
  text: For you are our glory and joy[a].
translation:
  language: zh_hans
  text: 因为你们就是我们的荣耀和喜乐[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “荣耀”或译“夸耀”或“荣誉”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: 你们
  rationale: 第二人称复数代词在原文中明确出现，并带有强调意味；用“你们就是”自然传达这一强调。
- source_word: γάρ
  choice: 因为
  rationale: 说明上一句的理由，保留原文的逻辑联系；现代汉语中“因为”清楚自然。
- source_word: ἐστε
  choice: 就是
  rationale: 原文为“是”的现在时直陈语气；“就是”既表达系词关系，也体现显式主语所带的强调。
- source_word: δόξα
  choice: 荣耀
  rationale: “荣耀”保留 δόξα 的核心词义和修辞分量；此处也可指使徒因帖撒罗尼迦信徒而有的夸耀或荣誉，故以脚注注明。
- source_word: ἡμῶν
  choice: 我们的
  rationale: 第一人称复数属格，按其领属关系自然译为“我们的”。
- source_word: χαρά
  choice: 喜乐
  rationale: χαρά 指喜悦、欢欣；“喜乐”是庄重而通行的名词表达，也避免把它译成一种动作。
theological_decisions:
- issue: 在人际语境中如何翻译 δόξα
  choice: 荣耀
  alternative: 夸耀；荣誉
  rationale: 本句表达帖撒罗尼迦信徒是保罗及其同工的荣耀与喜乐。“荣耀”保留希腊词较宽的语义和较强的修辞力度，同时不把含义局限为自我夸口；其他可能含义以脚注保存。
translation_notes:
  register: 采用现代、简洁而庄重的普通话。“你们就是”传达原文显式代词的强调；“荣耀和喜乐”保留两个并列名词的凝练结构。
