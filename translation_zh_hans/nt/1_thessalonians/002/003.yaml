  text: ἡ γὰρ παράκλησις ἡμῶν οὐκ ἐκ πλάνης οὐδὲ ἐξ ἀκαθαρσίας ⸀οὐδὲ ἐν δόλῳ,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/003.yaml
  text: For our appeal does not come from error or impurity or deceit[b][a],
translation:
  language: zh_hans
  text: 因为我们的劝勉[a]不是出于谬误[b]，不是出于污秽，也不是用诡诈的手段。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “劝勉”或译“呼吁”或“鼓励”。希腊语παράκλησις在不同语境中可有这些含义。
    reason: lexical_alternative
  - marker: b
    text: “谬误”或译“迷惑”或“欺骗”；本句后面的“诡诈”更直接表示蓄意欺骗。
    reason: lexical_alternative
lexical_decisions:
- source_word: παράκλησις
  choice: 劝勉
  rationale: 该词在此指保罗向听众所作的恳切劝导，也可包含呼吁或鼓励之意；“劝勉”自然、庄重，并与上下文中使徒的宣讲事工相符。
- source_word: πλάνης
  choice: 谬误
  rationale: ἐκ表明来源；“出于谬误”保留错误、迷误这一层意义，并与末项表示蓄意欺骗的δόλος有所区别。
- source_word: ἀκαθαρσίας
  choice: 污秽
  rationale: 保留该词广泛的道德不洁含义，不将其擅自限定为淫乱或性方面的不洁。
- source_word: δόλῳ
  choice: 诡诈
  rationale: 该词表示蓄意欺骗或用计；结合ἐν理解为行事的方式，译作“手段也不是诡诈”既体现方式，又符合现代汉语。
- source_word: ἐκ ... ἐξ ... ἐν
  choice: 出于……出于……手段……
  rationale: 区分前两项的来源（ἐκ/ἐξ）和第三项的方式（ἐν），避免把三项误译成完全相同的语法关系。
- source_word: γὰρ
  choice: 因为
  rationale: 承接上一节，说明保罗为何能放胆传讲；“因为”清楚呈现解释性的逻辑联系。
theological_decisions:
- issue: ἀκαθαρσία所指的范围
  choice: 宽泛译为“污秽”
  alternative: “淫乱”或“性方面的不洁”
  rationale: 该词可能带有性不洁的意味，但本节没有明确限定；宽泛表达可保留原文范围，不额外引入具体指控。
- issue: πλάνη与δόλος的关系
  choice: 分别译为“谬误”和“诡诈”
  alternative: 都按“欺骗”处理
  rationale: 这样既保留πλάνη可能指错误或迷误的含义，也保留δόλος较明确的蓄意欺诈意味，不抹平两词之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留“因为”的承接作用，并通过“出于”与“手段”区分来源和方式。脚注标记均置于正文句末，以免打断三重否定的节奏。
