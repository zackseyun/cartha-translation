  text: ⸀διότι ἠθελήσαμεν ἐλθεῖν πρὸς ὑμᾶς, ἐγὼ μὲν Παῦλος καὶ ἅπαξ καὶ δίς, καὶ ἐνέκοψεν ἡμᾶς ὁ Σατανᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/018.yaml
  text: Because we wanted to come to you—I[a], Paul, again and again—but Satan hindered us.
translation:
  language: zh_hans
  text: 因为我们想要到你们那里去——我保罗曾不止一次想去——但撒但阻挡了我们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διότι
  choice: 因为
  rationale: 承接上文，为前句所说的情况说明原因；“因为”直接保留其解释、因果作用。
- source_word: ἠθελήσαμεν
  choice: 很想
  rationale: θέλω在这里表达意愿和愿望；“很想”符合现代汉语，也自然体现保罗强烈的心愿。
- source_word: ἐλθεῖν πρὸς ὑμᾶς
  choice: 去你们那里
  rationale: 按中文叙述视角自然表达朝帖撒罗尼迦信徒所在之处的移动，不额外加入“探望”或“回去”。
- source_word: ἐγὼ μὲν Παῦλος
  choice: 我保罗更是
  rationale: 从复数“我们”中特别突出保罗本人，并用“更是”传达μέν的强调作用，而不虚构一个明说的δέ对应项。
- source_word: καὶ ἅπαξ καὶ δίς
  choice: 再三
  rationale: 原文直译为“一次又两次”，是表示不止一次、反复尝试的习语；“再三”简洁自然，并保留重复之意。
- source_word: ἐνέκοψεν
  choice: 阻挡了
  rationale: 表达在路途或行动上加以妨碍、拦阻；既保留实际阻碍的力度，又不扩展为超出词义的绝对决定论。
- source_word: ὁ Σατανᾶς
  choice: 撒但
  rationale: 采用现代中文圣经语境中通行的专名音译，保留原文明确的位格性指称。
theological_decisions:
- issue: 撒但对保罗行程受阻的作用
  choice: 可是撒但阻挡了我们
  alternative: 可是那敌对者妨碍了我们；可是撒但使我们无法前去
  rationale: 原文直接把阻碍归于撒但，因此保留其明确的主动作用；同时使用“阻挡”而非更绝对的措辞，不对其方式、范围或神与此事的关系作原文未说明的解释。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准普通话。“我保罗更是再三想去”既突出保罗本人，也避免生硬照译“一次又两次”。本节无需脚注，因为“再三”已充分传达该习语的实际含义。
