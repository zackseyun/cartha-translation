- from: 因为我们很想去你们那里——我保罗更是再三想去——可是撒但阻挡了我们。
  to: 因为我们想要到你们那里去——我保罗曾不止一次想去——但撒但阻挡了我们。
  rationale: 修订删除原文未明示的程度副词“很”和比较性“更是”，并以“曾不止一次”自然表达保罗被特别点出以及“一次又两次”的习语。保留脚注以呈现该习语的字面形式，同时正文采用清楚的现代汉语表达。
