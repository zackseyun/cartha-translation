  terminology: 将τοῖς ἔθνεσιν译为“外邦人”，是中文圣经语境中对非犹太人的既定、清楚而非现代国家化的表达。将ὀργή译为“忿怒”，保留其严肃的、语境中很可能与上帝审判有关的含义，但不在正文指定发怒者或审判时间。
