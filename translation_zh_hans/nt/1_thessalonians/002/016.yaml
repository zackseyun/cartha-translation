source:
  edition: SBLGNT
  text: κωλυόντων ἡμᾶς τοῖς ἔθνεσιν λαλῆσαι ἵνα σωθῶσιν, εἰς τὸ ἀναπληρῶσαι αὐτῶν τὰς ἁμαρτίας πάντοτε. ἔφθασεν δὲ ἐπ’ αὐτοὺς ἡ ⸀ὀργὴ εἰς τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/016.yaml
  text: by hindering us from speaking to the Gentiles so that they may be saved[a], so as always to fill up the measure of their sins[b]. But wrath has come upon them at last.
translation:
  language: zh_hans
  text: 他们阻止我们向外邦人传讲，好叫外邦人得救；以致他们不断使自己的罪恶满盈。可是，忿怒终于[a]临到他们了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “终于”或译“完全”“到底”或“直到尽头”（希腊文：εἰς τέλος）。
    reason: lexical_alternative
  - marker: b
    text: “忿怒”很可能指上帝的审判，但保罗在这里没有说明他所指的是当时已经发生的历史性审判、末后的审判，还是两者兼有。
    reason: alternative_reading
lexical_decisions:
- source_word: κωλυόντων
  choice: 阻止
  rationale: 现在时分词延续上文对这些人的描述；“阻止”准确表达持续妨碍的行为，又不额外赋予法律禁令的含义。
- source_word: τοῖς ἔθνεσιν
  choice: 外族人
  rationale: 此处指犹太人以外的各族人，而非现代地缘政治意义上的“国家”；“外族人”能较自然地表达这一族群和宗教背景。
- source_word: λαλῆσαι
  choice: 传讲
  rationale: 该不定式受“阻止”支配。上下文涉及使人得救的信息，因此“传讲”比单纯的“说话”自然，但没有擅自补出“福音”等原文未明说的宾语。
- source_word: ἵνα σωθῶσιν
  choice: 使外族人可以得救
  rationale: 保留目的从句及被动语态；重复“外族人”可避免汉语代词指向不清。
- source_word: εἰς τὸ ἀναπληρῶσαι
  choice: 这样……使……满盈
  rationale: “这样”连接前述行为及其后果，同时避免明确断定他们主观上以使罪恶满盈为目的，也不过度锁定该结构只能表示结果。
- source_word: ἀναπληρῶσαι
  choice: 使……满盈
  rationale: 表达达到充满、完满程度的意象；不在正文中增添原文没有明说的“分量”。
- source_word: πάντοτε
  choice: 总是
  rationale: 直接保留其持续、反复的意味，并与使罪恶满盈的行动相连。
- source_word: ἔφθασεν
  choice: 已经临到
  rationale: 表达已发生且具有当前效力的到临；“临到”也自然对应其与ἐπί构成的表达。
- source_word: ὀργή
  choice: 震怒
  rationale: 保留该词严肃的审判色彩；正文不明说发怒者是谁，相关神学指向留待脚注说明。
- source_word: εἰς τέλος
  choice: 终于
  rationale: 作为表示达到最终关头的副词读法，汉语自然；“完全”“到底”等可能含义在脚注中保留。
theological_decisions:
- issue: “震怒”的所指及时间性质
  choice: 正文保留“震怒”这一有神学分量但未完全界定的说法，不指定某一历史事件或末日审判。
  alternative: 特定的历史性审判；末后的终极审判；兼含当前与未来审判。
  rationale: 本句表明震怒已经临到，却没有交代具体事件，也没有明确排除末世层面的含义，因此不在译文中替保罗作出界定。
- issue: εἰς τὸ ἀναπληρῶσαι所表达的关系
  choice: 用“这样”保持前后行动的关联，但不明确说成主观目的。
  alternative: “为要使自己的罪恶满盈”（目的）；“结果使自己的罪恶满盈”（结果）。
  rationale: 该结构可以带有目的或结果色彩；上下文并不要求把使罪恶满盈理解为这些人有意识追求的目标，故采用较开放的连接方式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“外族人”避免把ἔθνη误解为现代国家；“罪恶满盈”保留圣经中罪达到满溢程度的意象。句首承接上文，虽为节选仍以“他们”补足汉语主语。
