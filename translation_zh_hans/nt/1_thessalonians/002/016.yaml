  rationale: 修订采用“外邦人”以准确传达本处ἔθνη指非犹太人的含义；以“好叫”保留ἵνα目的关系及“得救”的被动意味；以“以致”表达εἰς τὸ不必然是对方有意识目的的后果性关联；以“不断使自己的罪恶满盈”使持续累积的意象在汉语中通顺。保留“终于”及其脚注，保留忿怒临到的时间和性质之歧义。
