  text: ἀλλὰ προπαθόντες καὶ ὑβρισθέντες καθὼς οἴδατε ἐν Φιλίπποις ἐπαρρησιασάμεθα ἐν τῷ θεῷ ἡμῶν λαλῆσαι πρὸς ὑμᾶς τὸ εὐαγγέλιον τοῦ θεοῦ ἐν πολλῷ ἀγῶνι.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/002.yaml
  text: But after we had already suffered and been shamefully mistreated[a], as you know, in Philippi[c][b], we were bold in our God to speak the gospel of God to you amid much conflict.
translation:
  language: zh_hans
  text: 但我们先前在腓立比受过苦，也遭到凌辱[a]，正如你们所知道的；我们在我们的上帝里面放胆，在极大的奋争中向你们讲说上帝的福音[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“受到侮辱”“遭到粗暴虐待”。希腊语动词包含被人傲慢无礼地对待、公开羞辱的意思。
    reason: lexical_alternative
  - marker: b
    text: 或译“我们在我们的上帝里面勇敢地向你们讲说上帝的福音”。希腊语动词本身可包含“放胆说话”的意思，后面又有“讲说”的不定式。
    reason: lexical_alternative
  - marker: c
    text: 或译“在许多争战中”“面对强烈的反对”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: 但……然而
  rationale: 此词承接上文并形成强烈转折。因中文句中插入了先行受苦的背景，以“但……然而”使主句转折清楚自然。
- source_word: προπαθόντες
  choice: 先前……受过苦
  rationale: 表达不定过去时分词相对于主句动作的先时性，也体现 προ- 所含的“先前”之意。
- source_word: ὑβρισθέντες
  choice: 遭受了凌辱
  rationale: 兼顾傲慢粗暴的对待与使人蒙羞、受辱的含义，不局限于言语侮辱。
- source_word: καθὼς οἴδατε
  choice: 这是你们知道的
  rationale: 自然表达保罗诉诸收信人已有的认知，不额外加强语气。
- source_word: ἐν Φιλίπποις
  choice: 在腓立比
  rationale: 采用现代中文圣经与地名惯用译名。
- source_word: ἐπαρρησιασάμεθα
  choice: 放胆
  rationale: 该动词指坦然无惧、勇敢发言；与后面的 λαλῆσαι 结合，译作“放胆，把……传给你们”，既保留勇气，也避免生硬重复“说”。
- source_word: ἐν τῷ θεῷ ἡμῶν
  choice: 在我们的上帝里面
  rationale: 保留 ἐν 的关系或范围意味，不将其单一定为工具性的“靠着”或“借着”。
- source_word: λαλῆσαι πρὸς ὑμᾶς
  choice: 把……传给你们
  rationale: 结合其宾语“福音”，中文用“传给”比直译“向你们说”更自然，同时不把动作过度解释为某种特定宣讲形式。
- source_word: τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: 上帝的福音
  rationale: 保留属格结构可能表达的来源、归属或内容关联；“福音”是现代中文基督教语境中清楚且通行的词。
- source_word: ἐν πολλῷ ἀγῶνι
  choice: 尽管当时有激烈的争战
  rationale: ἀγών 可指争战、奋争或冲突；此处以让步性语境表达传福音时面临的强烈对抗，同时在脚注保留其他可能。
theological_decisions:
- issue: ἐν τῷ θεῷ ἡμῶν 的语义作用
  choice: 在我们的上帝里面
  alternative: 靠着我们的上帝；因我们的上帝而有胆量
  rationale: 直译保留了使徒胆量是在与上帝的关系中、以他为根基或范围的张力，避免只确定为工具或直接原因。
- issue: τοῦ θεοῦ 所表达的属格关系
  choice: 上帝的福音
  alternative: 从上帝而来的福音；关于上帝的福音
  rationale: 希腊文属格本身未在此明确限定为来源属格或内容属格，因此不在正文中替作者作单一判定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“在我们的上帝里面”略具经文语体色彩，刻意保留原文介词短语的关系性与神学张力。正文所有脚注标记均已对应列出。
