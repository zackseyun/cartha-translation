  text: παρακαλοῦντες ὑμᾶς καὶ παραμυθούμενοι καὶ μαρτυρόμενοι, εἰς τὸ ⸀περιπατεῖν ὑμᾶς ἀξίως τοῦ θεοῦ τοῦ καλοῦντος ὑμᾶς εἰς τὴν ἑαυτοῦ βασιλείαν καὶ δόξαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/012.yaml
  text: encouraging[a], comforting, and urging you to walk worthily of God[c][b], who calls you into his own kingdom and glory.
translation:
  language: zh_hans
  text: 我们劝勉、安慰，又郑重劝告你们，使你们行事为人与那召你们进入他自己国度和荣耀的上帝相称[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “行事为人”原文直译为“行走”，指一个人的生活方式和行为。
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλοῦντες
  choice: 劝勉
  rationale: 该词在这里描述持续的教导和鼓励。“劝勉”既保留劝导意味，也符合本段父亲般关怀的语气。
- source_word: παραμυθούμενοι
  choice: 安慰
  rationale: 该词指以言语抚慰、鼓励；“安慰”简洁自然，并与前面的“劝勉”有所区别。
- source_word: μαρτυρόμενοι
  choice: 郑重嘱咐
  rationale: 这里不是一般意义上的“作见证”，而是带着郑重见证意味的坚持劝告；“郑重嘱咐”传达其庄重和迫切。
- source_word: εἰς τὸ περιπατεῖν
  choice: 要行事为人
  rationale: εἰς加冠词不定式表达目的或结果。περιπατεῖν字面为“行走”，在此是生活行为的惯用隐喻；现代汉语以“行事为人”自然传达这一含义。
- source_word: ἀξίως τοῦ θεοῦ
  choice: 配得上帝
  rationale: 保留ἀξίως加属格所表达的“与上帝相称、配得上帝”的关系，不改写为仅仅“讨上帝喜悦”。
- source_word: τοῦ καλοῦντος
  choice: 他正召
  rationale: 用“正召”体现现在分词的持续或现行意味，同时不把呼召限定为一次过去事件。
- source_word: εἰς τὴν ἑαυτοῦ βασιλείαν καὶ δόξαν
  choice: 进入他自己的国度和荣耀
  rationale: “进入”对应εἰς，“他自己的”保留ἑαυτοῦ的强调；“国度”和“荣耀”并列，不作额外解释。
theological_decisions:
- issue: 是否在正文保留περιπατεῖν的“行走”隐喻
  choice: 译为“行事为人”，并以脚注说明字面表达
  alternative: 照字面译为“行走”
  rationale: 汉语“行事为人”能自然表达圣经中“行走”所指的生活方式，同时脚注保留源语意象，避免正文产生实际步行的误解。
- issue: τοῦ καλοῦντος所表达的呼召时态和方式
  choice: 译为“他正召你们”
  alternative: “他召了你们”或“他召你们”
  rationale: 现在分词支持现时或持续性的表达；“正召”保留这一侧重，但不进一步规定呼召的神学机制。
- issue: “进入他自己的国度和荣耀”中两个名词的关系
  choice: 保持“国度”和“荣耀”并列
  alternative: 将其合并解释为“荣耀的国度”
  rationale: 希腊文以καί明确连接两个名词，且同受一个介词支配；保持并列可避免消除原文可能包含的双重概念。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。三个分词译成节奏清楚的并列结构；“郑重嘱咐”保留第三个动词较强的庄严语气。“上帝”依人民开放圣经的通俗正式语域使用。
