  naturalness: “劝勉、安慰，又郑重嘱咐你们，要……”缺少明示施事者，且“要”所引出的结构略显生硬。改为“我们……，使你们……”能自然表达分词与εἰς τὸ不定式之间的目的关系，并符合现代庄重普通话。
  terminology: 保留“上帝”“国度”“荣耀”。以“与……上帝相称”准确、自然地表达“worthy of God”；“郑重劝告”保留μαρτυρόμενοι在本处庄重劝勉／郑重敦促的力度，避免将其限缩为日常事务性的“嘱咐”。
