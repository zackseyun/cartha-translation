source:
  edition: SBLGNT
  text: ⸀Καὶ διὰ τοῦτο καὶ ἡμεῖς εὐχαριστοῦμεν τῷ θεῷ ἀδιαλείπτως, ὅτι παραλαβόντες λόγον ἀκοῆς παρ’ ἡμῶν τοῦ θεοῦ ἐδέξασθε οὐ λόγον ἀνθρώπων ἀλλὰ καθὼς ⸂ἀληθῶς ἐστὶν⸃ λόγον θεοῦ, ὃς καὶ ἐνεργεῖται ἐν ὑμῖν τοῖς πιστεύουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/013.yaml
  text: And because of this we also thank God continually[a], that when you received the word of God that you heard from us, you accepted it not as the word of men but, as it truly is, the word of God[c][b], which is also at work in you who believe.
translation:
  language: zh_hans
  text: 为此，我们也不断地感谢上帝，因为你们从我们这里听见并领受了上帝的道[a]，接受它时不把它当作人的话[b]，而是当作上帝的道——这确实是上帝的道。这道[c]也在你们这些信的人中运行。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“你们领受了上帝的信息，就是从我们这里听见的信息”。原文结构十分紧凑，在汉语中可以有不止一种自然的展开方式。
    reason: lexical_alternative
  - marker: b
    text: “人的话”也可译作“出于人的话”；这里的“人”泛指人类，并非专指男性。
    reason: lexical_alternative
  - marker: c
    text: “这道”所依据的关系代词也可能指上帝，因而可理解为“上帝也在你们这些信的人中运行”。
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: 为此
  rationale: 保留与上文的因果联系；“为此”在现代汉语中简洁自然，又不把它弱化为单纯的推论。
- source_word: εὐχαριστοῦμεν τῷ θεῷ ἀδιαλείπτως
  choice: 我们也不断地感谢上帝
  rationale: 保留现在时所表达的持续行动，并以“不停地反复如此”的自然汉语表达 ἀδιαλείπτως。
- source_word: παραλαβόντες … ἐδέξασθε
  choice: 领受了……并且接受了它
  rationale: 分别译出两个动词：παραλαμβάνω 指接到所传递的内容，δέχομαι 在这里突出认可并接纳；汉语虽有近义重复，却保留了原文的递进。
- source_word: λόγον ἀκοῆς παρ’ ἡμῶν τοῦ θεοῦ
  choice: 从我们这里听见的上帝之道
  rationale: 原文是压缩的属格结构；此译法自然地呈现信息来自使徒的宣讲、其性质却是上帝的道，同时在脚注保留另一种展开方式。
- source_word: οὐ λόγον ἀνθρώπων
  choice: 不把它当作人的话
  rationale: ἀνθρώπων 是泛指人类的复数；“人的话”既避免性别误解，也保留与“上帝的道”之间的修辞对照。
- source_word: ἀλλὰ καθὼς ἀληθῶς ἐστὶν λόγον θεοῦ
  choice: 而是当作上帝的道——它确实是上帝的道
  rationale: 补出汉语所需的比较结构，并用破折号呈现原文插入式的郑重确认，避免将 ἀληθῶς 的强调省略。
- source_word: ἐνεργεῖται
  choice: 运行
  rationale: 表达持续发挥作用、产生功效的含义，又不强行判定该中间／被动形式必须译为主动还是被动。
- source_word: τοῖς πιστεύουσιν
  choice: 你们这些信的人
  rationale: 将现在分词译成自然的汉语定语结构，呈现信是这些人的持续特征。
theological_decisions:
- issue: 关系代词 ὃς 的所指
  choice: 以“这道”承接“上帝的道”
  alternative: 理解为指上帝，即“上帝也在你们这些信的人里面运行”
  rationale: ὃς 在性、数、格上与 λόγος 相合，而且紧接 λόγον θεοῦ；“道”是最近、最自然的先行词。不过 θεός 同样是阳性单数，语义上也可能成为所指，因此在脚注保留该理解。
- issue: 使徒所传信息作为“上帝的道”
  choice: 直译为“上帝的道”
  alternative: 译为“上帝的信息”
  rationale: 经文明确把“人的话”和“上帝的道”相对照；保留“道”可呈现其修辞和神学分量，但不把本节扩展成它本身没有明说的系统教义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“上帝之道”用于首次出现的紧凑名词结构，后文用“上帝的道”以保持自然；“运行”延续圣经语体的尊严感，同时仍为普通读者所理解。
