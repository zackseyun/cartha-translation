  text: just as you know[a], we dealt with each one of you as a father with his own children
translation:
  language: zh_hans
  text: 正如你们所知道的，我们逐一对待你们，就像父亲对待自己的孩子一样。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或更贴近原文形式：“正如你们所知道的，我们对你们每一个人，如同父亲对自己的孩子。”希腊文此处保留省略结构，完整的谓语意义须根据上下文补出。
    reason: 说明原文的省略结构及一种更贴近其形式的译法。
lexical_decisions:
- source_word: καθάπερ
  choice: 正如
  rationale: 引出比较，并诉诸帖撒罗尼迦人对使徒行为的亲身了解；“正如”自然且保留比较意味。
- source_word: οἴδατε
  choice: 你们知道
  rationale: οἶδα虽在形式上是完成时，通常表达现在的认知状态，因此译作现在时。
- source_word: ὡς（第一个）
  choice: （融入“知道”后的内容从句）
  rationale: 这里引出他们所知道的内容；现代汉语无需机械译出，可由“你们知道……我们……”自然表达。
- source_word: ἕνα ἕκαστον ὑμῶν
  choice: 你们每一个人
  rationale: 保留原文加强的逐一、个别意味，强调对每个人的关怀。
- source_word: ὡς（第二个）
  choice: 就像
  rationale: 明确标示父亲与儿女之间的比较关系，符合现代汉语表达。
- source_word: πατὴρ
  choice: 父亲
  rationale: 此处为无冠词、带性质和比较意味的用法；汉语“父亲”无需添加不定标记。
- source_word: τέκνα
  choice: 孩子
  rationale: τέκνα是涵盖性亲属称谓，不限定性别；“孩子”准确而自然。
- source_word: ἑαυτοῦ
  choice: 自己的
  rationale: 保留反身代词的强调，所指不是泛泛的孩子，而是父亲自己的孩子。
- source_word: '[由上下文补出的省略动词概念]'
  choice: 我们对待
  rationale: 希腊文此处结构省略，完整动作须由上下文补足；“对待”范围较宽，不会过早限定为劝勉、安慰或嘱咐中的某一项。
theological_decisions:
- issue: 如何处理希腊文省略的谓语动作
  choice: 补入宽泛的“我们对待你们每一个人”
  alternative: 保留较破碎的句式，或补成较具体的“劝勉你们每一个人”
  rationale: 本节单独看并非完整句子，意义依赖上下文。补入宽泛动词能使现代汉语成句，同时保留周围经文中多项牧养行动的空间，不把原文限定为某一种行动。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“对待”补足汉语句法所需的动作，又避免把上下文中的多重牧养行为窄化为单一动作；“你们每一个人”保留原文逐一关怀的强调。
