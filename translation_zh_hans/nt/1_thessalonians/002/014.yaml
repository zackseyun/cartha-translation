  text: ὑμεῖς γὰρ μιμηταὶ ἐγενήθητε, ἀδελφοί, τῶν ἐκκλησιῶν τοῦ θεοῦ τῶν οὐσῶν ἐν τῇ Ἰουδαίᾳ ἐν Χριστῷ Ἰησοῦ, ὅτι τὰ αὐτὰ ἐπάθετε καὶ ὑμεῖς ὑπὸ τῶν ἰδίων συμφυλετῶν καθὼς καὶ αὐτοὶ ὑπὸ τῶν Ἰουδαίων
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/014.yaml
  text: For you became imitators[a], brothers, of the churches of God that are in Judea in Messiah Jesus, because you also suffered the same things from your own countrymen[c][b], just as they did from the Jews.
translation:
  language: zh_hans
  text: 弟兄们，你们成了位于犹太地区、在弥赛亚耶稣里的上帝众教会的效法者；因为你们从自己的同胞所受的苦害，和他们从犹太人所受的一样。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “犹太人”也可译作“犹太地区的人”。这里指使那些教会受苦的人，并非泛指所有犹太人。
    reason: lexical_alternative
lexical_decisions:
- source_word: μιμηταὶ ἐγενήθητε
  choice: 效法了
  rationale: 表达“成为效法者”的实际结果；现代汉语中比直译为“成了模仿者”自然，同时保留明确的效法关系。
- source_word: ἀδελφοί
  choice: 弟兄们
  rationale: 保留呼格复数的传统直接称呼；原文语法形式为阳性复数，在书信语境中可代表全体会众。
- source_word: ἐκκλησιῶν τοῦ θεοῦ
  choice: 上帝的教会
  rationale: “教会”是保罗书信中 ἐκκλησία 的标准、自然译法；复数意义由“那些”及后文语境体现。
- source_word: τῶν οὐσῶν ἐν τῇ Ἰουδαίᾳ
  choice: 犹太地区那些
  rationale: 自然表达这些教会位于犹太地区，并保留限定作用。
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: 在弥赛亚耶稣里的
  rationale: 保留 ἐν 的联合或归属表达，并将 Χριστός 的称号含义译为“弥赛亚”，而不把它仅当作固定姓名。
- source_word: τὰ αὐτὰ ἐπάθετε
  choice: 也受了……苦害
  rationale: πάσχω 在此指遭受苦难或迫害；结合施事短语，译作“受了……的苦害”符合现代汉语，也维持与犹太地区教会相同遭遇的比较。
- source_word: τῶν ἰδίων συμφυλετῶν
  choice: 自己同胞
  rationale: συμφυλέται 指同一族群或共同体的人；“同胞”简洁涵盖民族或地域共同身份，ἰδίων 的强调由“自己”表达。
- source_word: τῶν Ἰουδαίων
  choice: 犹太人
  rationale: 此处可指使犹太地区众教会受苦的犹太人；不应理解为毫无例外的全体犹太人。其“犹太地区的人”这一词义可能性以脚注保留。
theological_decisions:
- issue: Χριστῷ 在固定保罗用语中按称号还是姓名式表达
  choice: 弥赛亚耶稣
  alternative: 基督耶稣
  rationale: Χριστός 的称号语义仍可辨认，译作“弥赛亚”保留其“受膏者”的历史和神学内涵；不改变该短语所表达的与耶稣联合或归属关系。
- issue: “犹太人”的指称范围
  choice: 正文译作“犹太人”，不扩展为全体犹太民族
  alternative: 犹太地区的人
  rationale: 原文复数带定冠词在此指实际使那些教会受苦的人，并不必然概括所有犹太人；正文保持直接词义，脚注说明地域性译法及范围限制。
translation_notes:
  register: 采用现代、庄重而易懂的书信语体。调整原文成分次序，将呼语置于句首以符合汉语习惯；用“正如……一样”清楚保留两组受苦经历之间的对照。脚注标记置于相关完整表述之后。
