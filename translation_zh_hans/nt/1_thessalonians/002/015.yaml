reference: 1 Thessalonians 2:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: τῶν καὶ τὸν κύριον ἀποκτεινάντων Ἰησοῦν καὶ ⸀τοὺς προφήτας καὶ ἡμᾶς ἐκδιωξάντων, καὶ θεῷ μὴ ἀρεσκόντων, καὶ πᾶσιν ἀνθρώποις ἐναντίων,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/015.yaml
  text: who also killed the Lord Jesus and the prophets[a], and drove us out, and are not pleasing to God, and are hostile to all people[c][b],
translation:
  language: zh_hans
  text: 他们也杀死了主耶稣和众先知[a]，又把我们赶了出去[b]；他们不讨神喜悦，并且与所有人为敌[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “杀死”也可译作“处死”。
    reason: lexical_alternative
  - marker: b
    text: “赶了出去”也可译作“驱逐了”；原文这个动词比泛指的“逼迫”更具体。
    reason: lexical_alternative
  - marker: c
    text: 这里的描述在语法上继续指上一节所说的那一群人，不应理解为对每个时代、每个地方所有犹太人的笼统论断。
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκτεινάντων
  choice: 杀死了
  rationale: 该不定过去时主动分词意为“杀死、置于死地”。“杀死”直接、自然，也不额外加入“谋杀”所带有的动机判断。
- source_word: κύριον Ἰησοῦν
  choice: 主耶稣
  rationale: κύριος在这里是用于耶稣的称号，按现代汉语基督教通行表达译为“主”；Ἰησοῦς按标准译名译为“耶稣”。
- source_word: τοὺς προφήτας
  choice: 众先知
  rationale: 定冠词所指的是公认的先知群体；“众先知”在现代中文中简明、庄重，并自然表达这一集合所指。
- source_word: ἐκδιωξάντων
  choice: 把我们赶了出去
  rationale: 该动词具体表示赶走、逐出，比泛称“逼迫”更能保留原文的空间性和动作力度。
- source_word: θεῷ μὴ ἀρεσκόντων
  choice: 不讨神喜悦
  rationale: ἀρέσκω与与格θεῷ表示“使神喜悦、讨神喜悦”；此译保留现在分词所描写的持续状态，同时符合自然汉语。
- source_word: πᾶσιν ἀνθρώποις ἐναντίων
  choice: 与所有人为敌
  rationale: ἐναντίος表示相对、反对或敌对。“与所有人为敌”自然传达其敌对意味，又保留πᾶσιν ἀνθρώποις的普遍措辞。
- source_word: τῶν ... ἀποκτεινάντων ... ἐκδιωξάντων ... ἀρεσκόντων ... ἐναντίων
  choice: 他们也……又……；他们……并且……
  rationale: 原文以复数属格冠词带出一连串分词，继续描述上一节的先行对象。中文用连续分句承接，既保持指称连贯，也避免生硬复制希腊语分词结构。
theological_decisions:
- issue: 这一连串分词所描述的对象
  choice: 将本节理解为继续描述上一节所提到的那一群人，不把措辞扩大为对所有时代、所有地方一切犹太人的概括判断。
  alternative: 将此处理解为对古今所有犹太人的普遍谴责。
  rationale: 属格复数冠词τῶν及其后一连串分词在语法上承接2:14的先行对象。本译文用“他们”维持这一连接，并以注释防止脱离上下文作无范围限制的泛化。
- issue: “与所有人为敌”的范围和修辞力度
  choice: 保留原文“所有人”的绝对化措辞，不在正文中将其弱化。
  alternative: 译作“与许多人为敌”或明确限定为某些群体。
  rationale: πᾶσιν ἀνθρώποις确实是“所有人”；翻译应保留保罗累积控诉的修辞张力，同时借上下文注释说明被描述对象，而不是改写原文本身。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“杀死”“赶了出去”保持动作具体；“不讨神喜悦”“与所有人为敌”保留原文持续累积的控诉语气。分号用于划分已完成的历史行动与随后对其状态和立场的描述。所有脚注标记均置于正文相应位置。
