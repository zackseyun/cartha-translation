  text: οὔτε γάρ ποτε ἐν λόγῳ κολακείας ἐγενήθημεν, καθὼς οἴδατε, οὔτε ⸀ἐν προφάσει πλεονεξίας, θεὸς μάρτυς,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/005.yaml
  text: For we never came with flattering speech[a], as you know[b], nor with a pretext for greed—God is witness.
translation:
  language: zh_hans
  text: 因为我们从未以谄媚的话待人[a]，正如你们所知道的；也从未用借口掩盖贪婪[b]——上帝作证。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“在谄媚的话语中”；也可译作“用谄媚的话”。
    reason: lexical_alternative
  - marker: b
    text: 原文可译作“以贪婪为借口”或“以贪婪作幌子”；此处指用表面的借口或掩饰来遮盖贪婪的动机。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔτε γάρ ποτε
  choice: 因为我们从来没有
  rationale: γάρ承接上文，译为“因为”；οὔτε与ποτε共同构成强调性的时间否定，以“从来没有”自然表达。
- source_word: ἐν λόγῳ κολακείας
  choice: 说谄媚的话
  rationale: λόγος在此指言语，κολακεία指为取悦或谋利而奉承；这样译既自然，也保留对说话方式的具体否定。
- source_word: ἐγενήθημεν
  choice: 说……／用……
  rationale: γίνομαι在这里描述保罗一行在帖撒罗尼迦人中所表现出来的样子。中文按两个介词短语分别采用自然动词表达，不直译为生硬的“成为”。
- source_word: καθὼς οἴδατε
  choice: 这是你们知道的
  rationale: 保留保罗诉诸收信人亲身认识的证据作用，同时符合现代汉语表达。
- source_word: ἐν προφάσει πλεονεξίας
  choice: 用托词掩饰贪心
  rationale: πρόφασις可指托词、借口或外在遮掩，πλεονεξία指贪得或贪心；正文明确表达以表面理由遮掩逐利动机的语境含义，脚注保留原文结构。
- source_word: θεὸς μάρτυς
  choice: 上帝作证
  rationale: 这是郑重呼求上帝为证的简洁表达；原文没有明说“我们的”，故不增添所有格。
theological_decisions:
- issue: 保罗所否认的是言语手段还是一切修辞
  choice: 具体否认谄媚奉承的言语
  alternative: 把本句扩大为对一切修辞技巧或优美表达的否定
  rationale: 原文所用κολακεία专指谄媚，并不支持扩大为对所有修辞表达的全面否定。
- issue: πλεονεξία所指贪心的范围
  choice: 译作较宽泛的“贪心”
  alternative: 限定译为“贪财”或“经济剥削”
  rationale: 该词可包括对钱财或利益的贪求；上下文可能涉及物质利益，但原文本身没有把范围严格限定为金钱。
- issue: πρόφασις与πλεονεξία的关系
  choice: 正文表达用托词遮掩贪心
  alternative: 形式上直译为“以贪心为借口”或“在贪心的托词中”
  rationale: “遮掩贪心”符合该短语常见的语境理解，也避免中文误解为拿贪心本身当理由；脚注同时说明较贴近原文形式的表达。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“上帝作证”保留原句结尾郑重有力的呼告；分号呈现两个οὔτε分句的并列结构，破折号突出最后的誓证。
