  text: nor seeking glory from people[a], neither from you nor from others,
translation:
  language: zh_hans
  text: 也不寻求人所给的荣耀[a]，不从你们，也不从别人那里寻求。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “荣耀”也可译作“尊荣”或“称赞”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητοῦντες
  choice: 寻求
  rationale: 现在时分词承接上下文中的主语，表达持续的取向；“寻求”自然且不额外推断动机。
- source_word: ἐξ ἀνθρώπων
  choice: 人的
  rationale: ἄνθρωποι在此泛指人类，并非专指男性；结合中文习惯，以“人的荣耀”表达荣耀来自人。
- source_word: δόξαν
  choice: 荣耀
  rationale: 此处指来自人的尊崇、赞誉或认可；“荣耀”保留δόξα在新约中的常见词汇联系，同时用脚注提示语境中的其他可能译法。
- source_word: οὔτε ... οὔτε ... οὔτε
  choice: 也不……既不……也不……
  rationale: 首个否定承接上一节，后两个否定构成自然的中文配对，并保留希腊文的并列否定结构。
- source_word: ἀφ’ ὑμῶν
  choice: 你们的
  rationale: 直接指帖撒罗尼迦信徒；在“人的荣耀”之后以所有格表达“来自你们的荣耀”，避免中文重复累赘。
- source_word: ἀπ’ ἄλλων
  choice: 别人的
  rationale: 指帖撒罗尼迦人之外的其他人；“别人的”简洁自然，并与“你们的”形成对应。
theological_decisions:
- issue: 所寻求的δόξα的性质
  choice: 来自人的荣耀或赞誉
  alternative: 尊荣；称赞
  rationale: ἐξ ἀνθρώπων明确限定其来源是人，因此经文说的不是寻求从神而来的荣耀；译文保留“荣耀”，脚注列出语境上可行的近义表达。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“也不”使本节继续承接前文；“既不……也不……”清楚呈现后两项并列。
