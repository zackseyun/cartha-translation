  text: δυνάμενοι ἐν βάρει εἶναι ὡς Χριστοῦ ἀπόστολοι· ἀλλὰ ἐγενήθημεν ⸀ἤπιοι ἐν μέσῳ ὑμῶν, ὡς ⸀ἐὰν τροφὸς θάλπῃ τὰ ἑαυτῆς τέκνα·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/007.yaml
  text: though we could have been a burden as apostles of the Messiah[a], yet we became gentle among you[c][b], as a nursing mother cherishes her own children.
translation:
  language: zh_hans
  text: 我们作为弥赛亚[a]的使徒，本来可以有分量[b]；然而，我们在你们中间却显得温柔[c]，就像乳母[d]呵护自己的孩子一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 传统译法为“基督”。“弥赛亚”和“基督”都意为“受膏者”。
    reason: alternative_reading
  - marker: b
    text: 原文直译近于“有分量”。也可理解为“行使我们的权柄”“向你们提出要求”，或“成为你们的负担”。
    reason: lexical_alternative
  - marker: c
    text: 有些抄本作“婴孩”（νήπιοι），而非“温柔”（ἤπιοι）。
    reason: textual_variant
  - marker: d
    text: 或译“奶妈”；这里的图像是女性以母亲般的温情哺育、照料孩子。
    reason: lexical_alternative
lexical_decisions:
- source_word: δυνάμενοι
  choice: 本来可以
  rationale: 该分词与后面的“然而”（ἀλλά）构成让步关系；“本来可以”以自然汉语表达当时具备但没有行使的可能性。
- source_word: ἐν βάρει εἶναι
  choice: 显出分量
  rationale: 原文直译近于“处于重量之中”。“显出分量”保留“重量”的比喻，也可涵盖运用使徒身份、提出要求或给人造成负担等语意，而不把含义限于经济负担。
- source_word: ὡς Χριστοῦ ἀπόστολοι
  choice: 身为弥赛亚的使徒
  rationale: Χριστοῦ在这里是称号性的属格；“弥赛亚”传达“受膏者”的称号含义，“身为”自然表达ὡς在此所指的身份。
- source_word: ἀλλὰ ἐγενήθημεν ἤπιοι
  choice: 然而……却温柔相待
  rationale: “然而……却”清楚呈现与前句的转折；汉语用“温柔相待”自然表达他们在众人中所呈现的温和态度，避免生硬直译为“成为温柔的”。
- source_word: ἐν μέσῳ ὑμῶν
  choice: 在你们中间
  rationale: 贴近原文空间性表达，同时是自然、庄重的现代汉语。
- source_word: ὡς ἐὰν τροφὸς
  choice: 就像乳母
  rationale: τροφός指哺乳并照料孩子的女性；“乳母”保留女性与哺育的图像，又避免现代“护士”所带来的医疗含义。
- source_word: θάλπῃ
  choice: 疼爱
  rationale: 该动词本有使之温暖之意，进而表示温柔照料；“疼爱”自然传达亲密、温暖的养育之情。
- source_word: τὰ ἑαυτῆς τέκνα
  choice: 自己的孩子
  rationale: “自己的”保留反身代词的强调，“孩子”准确表达τέκνα。
theological_decisions:
- issue: Χριστοῦ的称号性译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处该词修饰“使徒”，作为“受膏者”的称号使用；正文采用“弥赛亚”，脚注保留传统译法“基督”。
- issue: 使徒身份所带来的“分量”
  choice: 保留重量比喻，不限定为经济负担或权柄要求
  alternative: 成为你们的负担；行使权柄；提出要求
  rationale: 上下文容许这些相关理解，但ἐν βάρει εἶναι本身采用“重量”意象。正文保留较宽的表达，脚注列出主要解释，避免替原文消除张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。正文保留“分量”的原文比喻，以免过度限定为经济负担或权柄；“温柔相待”和“疼爱”使母性照料的连贯图像在汉语中自然呈现。
