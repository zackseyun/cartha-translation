  text: Ἡμεῖς δέ, ἀδελφοί, ἀπορφανισθέντες ἀφ’ ὑμῶν πρὸς καιρὸν ὥρας, προσώπῳ οὐ καρδίᾳ, περισσοτέρως ἐσπουδάσαμεν τὸ πρόσωπον ὑμῶν ἰδεῖν ἐν πολλῇ ἐπιθυμίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/017.yaml
  text: But we[a], brothers, having been torn away from you for a short time—in person, not in heart—were all the more eager, with great longing[b], to see your face.
translation:
  language: zh_hans
  text: 弟兄们，至于我们，暂时与你们分离——只是人不在一起，心却仍相连——我们格外迫切地想见到你们，满怀深切的思念。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “分离”原文用了一个与“成为孤儿、失去亲人”有关的生动词语，强调这次离别令人痛苦。
    reason: lexical_alternative
  - marker: b
    text: “弟兄们”是保罗在原文中的称呼；按这里的语境，很可能指整个信徒群体，包括女性。
    reason: cultural_note
lexical_decisions:
- source_word: Ἡμεῖς δέ
  choice: 我们
  rationale: 保留强调性的主语；δέ在此是温和的转折或话题推进，中文结合上下文无需硬译“但是”，以免显得突兀。
- source_word: ἀδελφοί
  choice: 弟兄们
  rationale: 保留希腊文阳性复数称呼的形式；在保罗书信语境中通常指整个信徒群体，另以脚注说明其涵盖范围。
- source_word: ἀπορφανισθέντες ἀφ’ ὑμῶν
  choice: 与你们分离
  rationale: 该词带有成为孤儿、痛失亲人的强烈离别意象；主文采用自然中文表达，脚注保留原文的生动意象。
- source_word: πρὸς καιρὸν ὥρας
  choice: 暂时
  rationale: 这是表示短暂时段的说法，并非严格指一个小时；“暂时”简洁自然。
- source_word: προσώπῳ οὐ καρδίᾳ
  choice: 只是见不着面，心却没有分离
  rationale: 用自然中文保存外在不能相见与内心仍相连的鲜明对照。
- source_word: περισσοτέρως ἐσπουδάσαμεν
  choice: 就越发急切
  rationale: περισσοτέρως表达程度加深，σπουδάζω兼有热切和尽力之意；此处以“越发急切”突出上下文中的迫切愿望。
- source_word: τὸ πρόσωπον ὑμῶν ἰδεῖν
  choice: 见到你们
  rationale: 希腊文直译为“看见你们的脸”；前句已用“见不着面”呈现πρόσωπον的身体临在意涵，此处采用现代汉语自然说法，避免重复生硬。
- source_word: ἐν πολλῇ ἐπιθυμίᾳ
  choice: 渴望
  rationale: ἐπιθυμία在此表示强烈而深切的愿望，并无负面欲念之意；与“越发急切”共同传达其强度。
theological_decisions:
- issue: ἀδελφοί的性别与涵盖范围
  choice: 主文译作“弟兄们”
  alternative: 弟兄姊妹们
  rationale: 主文保留原文阳性复数称呼，不把解释性扩展直接写入译文；同时脚注说明在这里很可能包括全体信徒，包括女性。
- issue: ἀπορφανισθέντες的亲属意象
  choice: 主文译作“分离”，脚注说明“如同失去亲人”
  alternative: 成了孤儿／被夺离
  rationale: 直译“成为孤儿”在中文中容易误解保罗与收信人的关系；脚注既保存原文哀恸、被迫分开的力度，也不将具体亲属角色固定化。
translation_notes:
  register: 采用现代、庄重而口语可懂的普通话。“见不着面，心却没有分离”保存原文的对偶张力；两个脚注标记均置于整节末尾，分别解释离别意象与群体称呼。
