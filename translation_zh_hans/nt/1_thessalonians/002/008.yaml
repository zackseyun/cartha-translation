  text: οὕτως ὁμειρόμενοι ὑμῶν εὐδοκοῦμεν μεταδοῦναι ὑμῖν οὐ μόνον τὸ εὐαγγέλιον τοῦ θεοῦ ἀλλὰ καὶ τὰς ἑαυτῶν ψυχάς, διότι ἀγαπητοὶ ἡμῖν ⸀ἐγενήθητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/008.yaml
  text: So[a], longing for you in this way, we were pleased to share with you not only the gospel of God but also our own lives[b], because you had become dear to us.
translation:
  language: zh_hans
  text: 我们这样深深眷恋你们[a]，不但乐意把上帝的福音传给你们，连自己的性命也愿意给你们[b]，因为你们已经成了我们所亲爱的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “深深眷恋”也可译作“切切思念”或“殷切想念”；原文使用了一个罕见的希腊词，表达强烈而深厚的情感和眷恋。
    reason: lexical_alternative
  - marker: b
    text: “自己的性命”也可译作“自己的生命”“自己的灵魂”或“我们自己”；这里指他们甘愿亲身并舍己地付出。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: 这样
  rationale: 承接前文乳母养育孩子的比喻，表达保罗一行关怀帖撒罗尼迦信徒的方式；“这样”简洁保留其方式副词的作用。
- source_word: ὁμειρόμενοι ὑμῶν
  choice: 切切思念你们
  rationale: 罕见分词表达强烈的眷恋与渴望；“切切思念”在现代汉语中自然、庄重，也保留情感强度而不将分词关系限定为因果。
- source_word: εὐδοκοῦμεν
  choice: 乐意
  rationale: 表达甘心并以此为喜悦，并非勉强同意；与后面的两个宾语搭配流畅。
- source_word: μεταδοῦναι
  choice: 传给……给
  rationale: 本义是把自己所有的分给别人。对“福音”用“传给”符合现代汉语习惯，对“性命”用“给”体现自我付出，同时保留两个并列对象。
- source_word: τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: 上帝的福音
  rationale: “福音”是清楚而通行的保罗书信用语；属格自然译作“上帝的”。
- source_word: τὰς ἑαυτῶν ψυχάς
  choice: 自己的性命
  rationale: 此处ψυχή指生命或整个自己，重点是亲身且带有牺牲性的付出，并非对灵魂与身体关系作抽象说明；“性命”比单纯“生命”更能传达付出生命的力度。
- source_word: διότι
  choice: 因为
  rationale: 清楚标明他们甘愿付出的原因。
- source_word: ἀγαπητοὶ ἡμῖν ἐγενήθητε
  choice: 你们已经成了我们所亲爱的人
  rationale: 保留γίνομαι所表达的形成状态，也直接呈现ἀγαπητοί的关系性和温情。
theological_decisions:
- issue: ψυχάς在使徒自我付出语境中的含义
  choice: 译作“性命”
  alternative: 灵魂；自己本身；生命
  rationale: 上下文强调使徒像乳母一般的亲身关爱和甘愿牺牲，而不是界定人的构成。“性命”既具体又避免将经文误解为只交付非物质的“灵魂”。
- issue: ἀγαπητοί的关系指向
  choice: 译作“我们所亲爱的人”
  alternative: 我们所爱的人；我们所疼爱的人
  rationale: 这里突出保罗及同工对收信人的爱，而非引入其他经文中“蒙上帝所爱”的神学用法；所选译法明确关系方向并保持庄重。
- issue: ὁμειρόμενοι与主句的逻辑关系
  choice: 保留为方式／伴随情形，不明确译成“因为”
  alternative: 因为我们思念你们
  rationale: 希腊分词可由语境推知与主句的关系，但原文没有明示因果连词。译文以“这样切切思念”保留其修辞联系和一定的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。开头保留与前文比喻的联系；两个脚注标记均置于相关短语之后。
