  source_fidelity: 草稿准确表达了神的认可、福音的受托，以及神持续察验人心。可是“而是为神”在现代汉语中通常表示“为了神／为神而作”，不能自然承载原文省略的“讨神喜欢”，因而会改变或模糊对比的谓语关系。应在正文中按汉语需要补出该谓语，并以脚注交代原文的省略。
  naturalness: 整体庄重通顺，但“而是为神”不合现代普通话的自然搭配；“不是要讨人的喜欢，而是要讨神的喜欢”清晰、自然，并保留原文的对照。将开头改为“不过”也比“相反”更稳妥地反映ἀλλά在此处承接前文的转折。
  terminology: “福音”“认可”“托付”“察验”“心”均适当。保留“察验”可表达δοκιμάζοντι持续的审察／检验含义，也与前面的认可形成词义关联。
