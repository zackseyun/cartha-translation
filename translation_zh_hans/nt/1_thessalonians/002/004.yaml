    rationale: ἀλλὰ θεῷ在希腊文中依赖前面的ἀρέσκοντες，意为“而是［讨］神喜欢”。汉语的“为神”不是这一省略结构的等效保留，容易被理解为行动目的或服务对象，而非取悦神。
