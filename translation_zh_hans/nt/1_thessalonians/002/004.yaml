source:
  edition: SBLGNT
  text: ἀλλὰ καθὼς δεδοκιμάσμεθα ὑπὸ τοῦ θεοῦ πιστευθῆναι τὸ εὐαγγέλιον οὕτως λαλοῦμεν, οὐχ ὡς ἀνθρώποις ἀρέσκοντες ἀλλὰ ⸀θεῷ τῷ δοκιμάζοντι τὰς καρδίας ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/004.yaml
  text: But just as we have been approved by God to be entrusted with the gospel[a], so we speak—not as pleasing people, but God, who tests our hearts.
translation:
  language: zh_hans
  text: 不过，正如神认可我们，托付我们传讲福音，我们就这样传讲：不是要讨人的喜欢，而是要讨神[a]的喜欢；他察验我们的心。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文在“而是神”处省略了“讨……喜欢”；译文按汉语表达补出该意思。
    reason: 说明原文的省略结构，以及译文为使汉语语义明确而作的必要补足。
lexical_decisions:
- source_word: δεδοκιμάσμεθα
  choice: 考验并认可了我们
  rationale: 完成时被动态表示神已经作出检验和认可，其结果持续有效。“考验并认可”同时保留 δοκιμάζω 的检验过程与认可结果，也与后文“察验”形成词义呼应。
- source_word: πιστευθῆναι τὸ εὐαγγέλιον
  choice: 把福音托付给我们
  rationale: 此处被动不表示“相信福音”，而表示神将福音交托给使徒承担；转换为自然的汉语主动表达，并明确神是交托者。
- source_word: τὸ εὐαγγέλιον
  choice: 福音
  rationale: “福音”是现代汉语基督教语境中通行且准确的表达，保留保罗用语的神学内涵。
- source_word: οὕτως λαλοῦμεν
  choice: 我们也就照样传讲
  rationale: “照样”承接 καθὼς…οὕτως 的对应结构；“传讲”在语境中比泛指的“说话”更清楚地指向受托宣讲福音。
- source_word: οὐχ ὡς ἀνθρώποις ἀρέσκοντες
  choice: 不是为讨人喜欢
  rationale: 以自然现代汉语表达取悦人的意图，同时保留“人”与“神”的鲜明对比。
- source_word: ἀλλὰ θεῷ
  choice: 而是为神
  rationale: 希腊文第二项省略了与前项对应的“讨……喜欢”。正文保留这一压缩表达，不擅自完全补足；脚注说明其隐含意义。
- source_word: τῷ δοκιμάζοντι
  choice: 察验
  rationale: 现在时分词表达神持续鉴察人的内在；“察验”兼具审察和检验之意，并与前文 δεδοκιμάσμεθα 保持词义联系。
- source_word: τὰς καρδίας ἡμῶν
  choice: 我们的心
  rationale: 保留圣经人论中“心”的整体性含义，不将其缩减为单纯的思想或情感。
theological_decisions:
- issue: 如何翻译“讨人喜欢”与“神”之间省略谓语的对比
  choice: 正文译作“不是为讨人喜欢，而是为神”
  alternative: 不是为讨人喜欢，而是为讨神喜欢
  rationale: 原文只在对比的前半项明说“讨……喜欢”，后半项仅列“神”。正文保留保罗简练而略带张力的省略结构，脚注则说明自然汉语中的完整含义，避免读者误解。
- issue: 神的认可与福音受托之间的关系
  choice: 译作“神既考验并认可了我们，把福音托付给我们”
  alternative: 神认为我们配得，便把福音托付给我们
  rationale: 原文强调经过检验而获认可，并因此受托，却没有使用“配得”一类可能暗示内在功德的措辞；译文不额外引入这种神学判断。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“相反”承接上文的转折；“考验并认可”准确呈现完成时被动的评估与持续结果；分号使“他察验我们的心”明确修饰神。脚注标记 [a] 已置于正文相应位置。
