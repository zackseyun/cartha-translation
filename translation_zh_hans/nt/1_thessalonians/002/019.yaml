  text: τίς γὰρ ἡμῶν ἐλπὶς ἢ χαρὰ ἢ στέφανος καυχήσεως— ἢ οὐχὶ καὶ ὑμεῖς— ἔμπροσθεν τοῦ κυρίου ἡμῶν Ἰησοῦ ἐν τῇ αὐτοῦ παρουσίᾳ;
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/019.yaml
  text: For what is our hope or joy or crown of boasting—is it not indeed you?—before our Lord Jesus at his coming[a].
translation:
  language: zh_hans
  text: 因为，在我们的主耶稣来临[a]时、在他面前，我们的盼望、喜乐和所夸的冠冕是什么呢？不也是你们吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“临在”或“到来”。希腊语παρουσία可指临在或到来；本处语境指主耶稣将来的来临。
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς
  choice: 谁
  rationale: τίς既可指“谁”，也可指“什么”。本句随后以“你们”作答案；现代汉语用“谁是我们的盼望……”自然清楚，同时保留修辞问句的指人落点。
- source_word: γὰρ
  choice: 因为
  rationale: 保留本节对上文的解释关系，不将连接词省略。
- source_word: ἐλπίς
  choice: 盼望
  rationale: 这是保罗书信中自然、庄重且通行的表达，传达满有把握的期待。
- source_word: χαρά
  choice: 喜乐
  rationale: 直接对应原词，并符合现代中文圣经语体。
- source_word: στέφανος καυχήσεως
  choice: 所夸的冠冕
  rationale: στέφανος指象征荣誉或得胜的冠冕；此译保留καύχησις的“夸”这一修辞核心，又比生硬的“夸耀之冠”更符合现代汉语。
- source_word: οὐχὶ καὶ ὑμεῖς
  choice: 不正是你们吗
  rationale: 原结构预期肯定回答；“不正是……吗”自然表达οὐχί的强调。καί在此可有“也”或强调意味，中文不另加“也”，以免暗示本节明确列出其他对象。
- source_word: ἔμπροσθεν
  choice: 站在……面前
  rationale: “面前”传达在主面前的意思；补出“站在”使它与前面的身份问句在中文中衔接自然，并未增添实质内容。
- source_word: κυρίου
  choice: 主
  rationale: κύριος用于耶稣时，译作“主”是准确而通行的基督论称谓。
- source_word: παρουσίᾳ
  choice: 来临
  rationale: 在本处末世语境中指主耶稣未来的到来；“来临”自然庄重，同时以脚注保留“同在／临在”这一词义范围。
theological_decisions:
- issue: 末世语境中παρουσίᾳ的译法
  choice: 来临
  alternative: 同在；临在；到达
  rationale: 上下文指向主耶稣未来的到来，因此正文译“来临”最清楚；但παρουσία本身也可表示“同在／临在”，故在脚注保留词义张力，不把其词义范围静默缩窄。
- issue: καί在οὐχὶ καὶ ὑμεῖς中的功能
  choice: 以“不正是你们吗”表达强调，不明译“也”
  alternative: 不也正是你们吗
  rationale: καί可以表示“也”，也可加强语气。正文采用适合汉语修辞问句的表达，避免仅凭本句断定“你们”之外还有别的冠冕对象。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“所夸的冠冕”保留保罗的冠冕意象和夸耀语言；通过拆分问句并补出“站在”，使希腊语长句在中文中自然清晰。
