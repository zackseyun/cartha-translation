  text: ὑμεῖς μάρτυρες καὶ ὁ θεός, ὡς ὁσίως καὶ δικαίως καὶ ἀμέμπτως ὑμῖν τοῖς πιστεύουσιν ἐγενήθημεν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/010.yaml
  text: You are witnesses[a], and God also, how devoutly and righteously and blamelessly we behaved toward you who believe[b],
translation:
  language: zh_hans
  text: 你们是见证人，神也是：我们对你们这些信的人[b]，是怎样虔敬[a]、正直、无可指责地行事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “虔敬”或译“圣洁”。希腊词着重人在神面前合乎敬虔的行为。
    reason: lexical_alternative
  - marker: b
    text: “对你们这些信的人”或译“在你们这些信的人中间”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς μάρτυρες καὶ ὁ θεός
  choice: 你们是见证人，神也是
  rationale: 补出汉语所需的判断成分，保留先直接提到帖撒罗尼迦信徒、再诉诸神作见证的强调次序。
- source_word: ὡς
  choice: 怎样
  rationale: 引出保罗一行行事的方式，与前面的见证人申诉自然衔接。
- source_word: ὁσίως
  choice: 虔敬
  rationale: 表达在神面前敬虔、合宜的行为；比单用“圣洁”更明确地保留该词在此处的敬神维度，同时以脚注列出可能译法。
- source_word: δικαίως
  choice: 公义
  rationale: 表达行为正直、合乎正义，与前后两个伦理副词并列。
- source_word: ἀμέμπτως
  choice: 无可指责
  rationale: 指行为没有可成立的责难，并不额外解释为绝对无罪。
- source_word: ὑμῖν
  choice: 对你们
  rationale: 将与格理解为行为所指向或相关的对象；“在你们中间”亦可能，故保留于脚注。
- source_word: τοῖς πιστεύουσιν
  choice: 这些信的人
  rationale: 保留现在分词的动词意味，并明确所指是受信者中的信徒。
- source_word: ἐγενήθημεν
  choice: 行事
  rationale: γίνομαι在三个方式副词的语境中描述保罗及同工实际如何为人；“行事”简洁、庄重而自然。
theological_decisions:
- issue: 使徒行为的三个伦理描述
  choice: 按实际生活表现来表达“虔敬、公义、无可指责”
  alternative: 将其仅视为辩护修辞，或解释为绝对无罪的宣称
  rationale: 经文郑重诉诸信徒和神作见证，确实主张他们行为正直；译文同时不把“无可指责”扩大为形而上的无罪或绝对完美。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你们是见证人，神也是”保留原文诉诸见证人的次序；三个并列词保持紧凑的修辞节奏。
