  text: Αὐτοὶ γὰρ οἴδατε, ἀδελφοί, τὴν εἴσοδον ἡμῶν τὴν πρὸς ὑμᾶς ὅτι οὐ κενὴ γέγονεν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/001.yaml
  text: For you yourselves know[a], brothers, that our coming to you was not in vain,
translation:
  language: zh_hans
  text: 弟兄们，你们自己知道，我们来到你们那里这件事，并不是徒然的[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄们”也可理解为“弟兄姊妹们”；希腊文作“弟兄们”，这种阳性形式常用来称呼整个信徒群体。
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτοὶ
  choice: 你们自己
  rationale: 保留加强语气，突出帖撒罗尼迦信徒凭亲身经历知道此事。
- source_word: γὰρ
  choice: 不单独译出
  rationale: 此词承接并支持上文；在现代汉语中若机械译作“因为”会使本节成为不完整的从句，省去显性连词仍可由上下文体现论证关系。
- source_word: οἴδατε
  choice: 知道
  rationale: οἶδα虽具有完成时形式，却通常表达现在的认知状态；“知道”自然准确。
- source_word: ἀδελφοί
  choice: 弟兄们
  rationale: 保留希腊文阳性复数称呼的形式；此词在保罗书信中常用于称呼包括男女在内的整个信徒群体。
- source_word: τὴν εἴσοδον ἡμῶν τὴν πρὸς ὑμᾶς
  choice: 我们到你们那里去
  rationale: 按语境表达保罗一行来到帖撒罗尼迦信徒中间这件事，比直译为“我们的进入”更符合现代汉语。
- source_word: ὅτι
  choice: （由汉语宾语结构体现）
  rationale: 此处引出“知道”的内容；汉语在“知道”后无需另加相当于“that”的词。
- source_word: οὐ κενὴ γέγονεν
  choice: 并不是徒然的
  rationale: κενός在此可指空无、无果效或徒然；“并不是徒然的”既自然，也保留其结果与意义方面的语义幅度。
theological_decisions:
- issue: ἀδελφοί用于可能包括女性的会众
  choice: 正文译作“弟兄们”，脚注说明也可理解为“弟兄姊妹们”
  alternative: 正文直接译作“弟兄姊妹们”
  rationale: 正文保留原文阳性称呼的形式，同时借脚注说明其在保罗书信中通常涵盖整个信徒群体，避免无声地缩窄或扩写原文。
- issue: κενή所指的“徒然”
  choice: 保留较宽泛的“徒然”
  alternative: 明确译作“没有成果”或“没有意义”
  rationale: 上下文可以涉及来访并非空洞、无果或无效；不在本节中将其限定为某一种解释，以保留原文的语义张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“到你们那里去”传达来访或抵达之意；“并不是徒然的”保留原文判断的含蓄和语义广度。
