  text: Μνημονεύετε γάρ, ἀδελφοί, τὸν κόπον ἡμῶν καὶ τὸν μόχθον· ⸀νυκτὸς καὶ ἡμέρας ἐργαζόμενοι πρὸς τὸ μὴ ἐπιβαρῆσαί τινα ὑμῶν ἐκηρύξαμεν εἰς ὑμᾶς τὸ εὐαγγέλιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/009.yaml
  text: 'For you remember[a], brothers, our labor and hardship: working night and day so as not to burden any of you, we proclaimed to you the gospel of God.'
translation:
  language: zh_hans
  text: 弟兄们[a]，你们记得我们的劳苦和艰辛：我们昼夜做工，免得给你们任何人增添负担；我们向你们宣讲了上帝的福音。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“弟兄姊妹们”；希腊文直译为“弟兄们”，在这里可能包括全体会众。
    reason: 说明原文称呼的语法形式及其可能具有的包容性。
lexical_decisions:
- source_word: Μνημονεύετε
  choice: 你们记得
  rationale: 这是现在时直陈语气第二人称复数，表示帖撒罗尼迦信徒仍记得此事，而不是命令他们“要记住”。
- source_word: ἀδελφοί
  choice: 弟兄们
  rationale: 保留希腊文阳性复数称呼的形式；按语境可能包括全体会众，另以脚注说明。
- source_word: τὸν κόπον ἡμῶν καὶ τὸν μόχθον
  choice: 我们的劳苦和艰辛
  rationale: 用两个相近但有区别的词，分别传达费力的劳动以及随之而来的困顿艰难。
- source_word: νυκτὸς καὶ ἡμέρας ἐργαζόμενοι
  choice: 我们夜以继日地做工
  rationale: 自然表达持续不断的辛勤工作，同时保留“夜”和“日”的次序及做工的实际含义。
- source_word: πρὸς τὸ μὴ ἐπιβαρῆσαί τινα ὑμῶν
  choice: 为的是不加重你们任何人的负担
  rationale: 明确表达目的；“负担”保留经济或生活供应方面的含义，而不把范围限定得过窄。
- source_word: ἐκηρύξαμεν εἰς ὑμᾶς
  choice: 我们向你们宣讲了
  rationale: “宣讲”体现公开传扬的意味，“向你们”保留介词的方向性。
- source_word: τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: 上帝的福音
  rationale: 保留保罗书信中的固定表达，也不限定属格究竟侧重来源、归属还是内容。
theological_decisions:
- issue: ἀδελφοί是否明示包括女性会众
  choice: 正文译作“弟兄们”并加脚注
  alternative: 弟兄姊妹们
  rationale: 希腊文形式为阳性复数，但在本段语境中可能概括全体会众；正文保留形式，脚注交代其可能的包容性用法。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“夜以继日地做工”自然表达持续劳作；分号区分做工与宣讲，同时让目的短语清楚修饰做工。
