    rationale: “加重”通常预设已有负担并表示使其更重；希腊文ἐπιβαρῆσαι在此指不给任何一人造成或增添负担。改作“给你们任何人增添负担”更准确。
  - severity: low
    issue: “因为，弟兄们……”的标点和语序
    rationale: 汉语中“因为”后不宜以逗号直接隔开呼语。此处γάρ是篇章性的说明连接词，可自然隐含，以免产生不自然的开头。
