review_pass:
  verdict: revise
  source_fidelity: 译文整体准确呈现了现在时陈述“你们记得”、劳苦与艰辛的并列、昼夜做工的持续性、避免成为受信者负担的目的，以及宣讲上帝福音的行动。原译“加重……负担”较容易表示把既有负担加重，未充分表达ἐπιβαρέω“使人负担／成为人的负担”的含义，宜改为“增添负担”。
  naturalness: 原文开头“因为，弟兄们……”不合现代汉语的常规停顿；汉语可不直译此处的γάρ，而以自然的称呼和陈述句表达其诉诸读者记忆的语气。修订后句法更顺畅，分号也避免把“做工”和“宣讲”误作同一层级的目的动作。
  terminology: “弟兄们”“劳苦和艰辛”“昼夜做工”“宣讲”“上帝的福音”均恰当、庄重且符合保罗书信语域。保留“弟兄们”的形式，并以脚注说明其在语境中可能涵盖全体会众，是稳妥的处理。
