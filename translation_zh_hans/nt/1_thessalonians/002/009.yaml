- from: 因为，弟兄们[a]，你们记得我们的劳苦和艰辛：我们夜以继日地做工，为的是不加重你们任何人的负担；我们向你们宣讲了上帝的福音。
  to: 弟兄们[a]，你们记得我们的劳苦和艰辛：我们昼夜做工，免得给你们任何人增添负担；我们向你们宣讲了上帝的福音。
  rationale: 修订仅处理汉语表达和“负担”一词的语义精确度：删去不自然的开头“因为”及其逗号，将“加重负担”改为“增添负担”。其余措辞、神学术语和脚注均可保留。
