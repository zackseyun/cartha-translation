source:
  edition: SBLGNT
  text: ὡς γέγραπται ἐν βίβλῳ λόγων Ἠσαΐου τοῦ ⸀προφήτου· Φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Ἑτοιμάσατε τὴν ὁδὸν κυρίου, εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/004.yaml
  text: 'as it is written in the book of the words of Isaiah the prophet[a], “A voice of one crying in the wilderness: ‘Prepare the way of the Lord[b]; make his paths straight.’”'
translation:
  language: zh_hans
  text: '正如记在先知以赛亚话语的书上：


    “有声音在旷野呼喊：


    ‘预备主的道路[a]，


    修直他的路径。’”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“主”呼应以赛亚书40:3；该处希伯来文使用的是神的名字 YHWH。
    reason: 说明希腊文 κύριος 背后的希伯来经文背景，避免正文过度限定。
  - marker: b
    text: “在旷野”也可与后面的命令相连，译作：“有声音呼喊：‘要在旷野预备主的道路，修直他的路径。’”
    reason: 保留介词短语句法连接上的真实歧义。
lexical_decisions:
- source_word: ὡς γέγραπται
  choice: 正如……书上所记
  rationale: 采用现代中文常用的引经公式，既表达完成时被动式所含“已经写下并持续有效”的意味，也保持自然庄重。
- source_word: ἐν βίβλῳ λόγων Ἠσαΐου τοῦ προφήτου
  choice: 以赛亚先知的话语书上
  rationale: 保留 βίβλῳ 与 λόγων 两个名词的信息，并用“以赛亚先知”自然表达同位关系；“书”比按古代载体译作“书卷”更贴近原词本身和现代汉语。
- source_word: Φωνὴ βοῶντος
  choice: 有声音……呼喊
  rationale: 以“有声音”对应无冠词的 φωνή，并以“呼喊”自然传达 βοῶντος；中文无需补出“一个人”也能保留声音来自呼喊者的含义。
- source_word: ἐν τῇ ἐρήμῳ
  choice: 在旷野
  rationale: “旷野”既符合施洗约翰所处环境，也保留以赛亚预言的经文语域；正文按路加所引希腊文的自然理解，将其连接于“呼喊”。
- source_word: Ἑτοιμάσατε τὴν ὁδὸν κυρίου
  choice: 预备主的道路
  rationale: 直接保留命令语气及“道路”的预言性比喻；κύριος 依希腊正文译作“主”。
- source_word: εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ
  choice: 修直他的路径
  rationale: “修直”自然表达道路施工的意象和命令语气，“路径”与前句“道路”形成对应，并保留复数 τρίβους 的集合性含义。
theological_decisions:
- issue: 以赛亚引文中的 κύριος 与希伯来文神名 YHWH 的关系
  choice: 正文译作“主”
  alternative: 译作“耶和华”或以特殊字形表示“上主”
  rationale: 路加的希腊正文是 κύριος，故正文按其直接意义译作“主”；脚注说明以赛亚书40:3的希伯来文为神名 YHWH，以保存圣约背景及潜在的基督论张力，而不在正文中替路加作进一步限定。
- issue: ἐν τῇ ἐρήμῳ 的句法连接
  choice: 与“呼喊”相连，即“在旷野呼喊”
  alternative: 与后面的命令相连，即“要在旷野预备主的道路”
  rationale: 希腊语标点并非原始文本的一部分，两种连接均有古老经文背景与语法可能；正文采用路加语境中较自然、也与约翰在旷野出现相呼应的读法，脚注保留另一读法。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。诗行布局保留引文的平行结构。“话语书”略带经文语体，旨在忠实保留 βίβλῳ λόγων 两个名词；“预备、旷野、道路、路径”均为普通读者熟悉且适合先知性引文的用语。
