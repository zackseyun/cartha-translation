base_translation:
  language: en
  yaml_path: translation/nt/luke/003/013.yaml
  text: And he said to them[a], “Collect no more than what has been ordered for you.”
translation:
  language: zh_hans
  text: 他对他们说：“不要收取超过规定数额的税款。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ
  choice: 他
  rationale: δέ在此是轻微的叙事连接词；现代汉语无需机械译出“而”或“于是”，省略后语流自然，也不强化原文没有的转折。
- source_word: εἶπεν πρὸς αὐτούς
  choice: 对他们说
  rationale: 准确、自然地表达λέγω与πρός构成的对人说话结构。
- source_word: Μηδὲν πλέον
  choice: 不要多
  rationale: 表达禁止超额的意思，并与后面的“收”自然搭配。
- source_word: παρὰ τὸ διατεταγμένον ὑμῖν
  choice: 除了给你们规定的
  rationale: 保留διατάσσω完成时被动分词所含的既定规定和官方授权意味；“给你们规定的”在税务语境中可自然理解为规定的数额。
- source_word: πράσσετε
  choice: 收
  rationale: πράσσω本义较宽，可指“做、办理”；但紧接第12节税吏的提问，在此具体指征收税款。译作“收”补足汉语所需的语境动作，同时不添加语境以外的信息。
theological_decisions:
- issue: 是否把πράσσετε的语境所指明确为征收行为
  choice: 译作“收”：“除了给你们规定的，不要多收。”
  alternative: 较形式化地译作“不要做超过给你们所规定的事。”
  rationale: 原词本身较宽泛，但直接受话者是税吏，因此这里的行为明确涉及征收。中文“不要多收”既自然又忠实于上下文，并未引入教派性解释。
translation_notes:
  register: 采用简洁、庄重而口语自然的现代标准汉语。“规定”保留行政命令色彩，“不要多收”让普通读者立即理解约翰针对税吏滥征的命令。
