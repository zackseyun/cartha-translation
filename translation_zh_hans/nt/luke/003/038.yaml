base_translation:
  language: en
  yaml_path: translation/nt/luke/003/038.yaml
  text: the son of Enosh[a], the son of Seth, the son of Adam, the son of God.
translation:
  language: zh_hans
  text: 以挪士为父，以塞特为父，以亚当为父，以神为父。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文只是连续使用属格：“挪士的、塞特的、亚当的、神的”；这里的“以……为父”是根据这份家谱已经确立的句式补出的。
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ Ἐνὼς
  choice: 以挪士为父
  rationale: 本节承接路加家谱中反复出现的属格结构，省略的亲子关系可由上下文补出；“挪士”采用现代中文圣经常见译名。
- source_word: τοῦ Σὴθ
  choice: 以塞特为父
  rationale: 同一属格家谱格式表示上一人出自塞特；“塞特”采用现代中文常见译名。
- source_word: τοῦ Ἀδὰμ
  choice: 以亚当为父
  rationale: Ἀδάμ在此是家谱中的专名，译作“亚当”，不按普通名词译作“人”。
- source_word: τοῦ θεοῦ
  choice: 以神为父
  rationale: 末尾属格与前面的家谱格式平行；补出“为父”既使中文关系清楚，也保留路加以“神”收束家谱的文学力度。
theological_decisions:
- issue: 如何翻译亚当之后的 τοῦ θεοῦ
  choice: 以神为父
  alternative: 属于神／出于神／神的儿子
  rationale: 希腊文表面上只是属格，但家谱既定句法暗含亲子关系。“以神为父”保持整串结构的一致性，同时避免把亚当与神的关系过度解释为后来特定的基督论称号。脚注说明原文的省略形式，以保留其语法含混度。
translation_notes:
  register: 采用现代、庄重且易懂的家谱表达。“以……为父”比逐项重复“是……的儿子”更自然，同时明确表示谱系关系；末尾保留“以神为父”的突显效果。
