  text: Ἐγένετο δὲ ἐν τῷ βαπτισθῆναι ἅπαντα τὸν λαὸν καὶ Ἰησοῦ βαπτισθέντος καὶ προσευχομένου ἀνεῳχθῆναι τὸν οὐρανὸν
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/021.yaml
  text: It happened that when all the people were baptized[a], and Jesus also had been baptized and was praying, heaven was opened,
translation:
  language: zh_hans
  text: 当众百姓都受了洗，耶稣也受了洗，正在祷告时，天[a]开了，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “天”也可译作“天空”。希腊词既可指可见的天空，也可指属天的领域；但在此处启示性的场景中，译作“天”较为贴切。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: （以整句自然叙事表达，不另译）
  rationale: 这是路加常用的叙事推进句式。现代汉语无需生硬译作“事情发生了”，以事件本身起句更自然；δὲ的承接作用也由上下文体现。
- source_word: ἐν τῷ βαπτισθῆναι ἅπαντα τὸν λαὸν
  choice: 众百姓都受了洗
  rationale: ἐν加冠词化不定式表示时间背景；ἅπαντα τὸν λαὸν指百姓整体。译文保留被动意义，并采用自然的现代汉语表达。
- source_word: καὶ Ἰησοῦ βαπτισθέντος
  choice: 耶稣也受了洗
  rationale: καί具有增补义，译作“也”；属格独立结构构成时间背景，且受洗先于随后持续的祷告和天开。
- source_word: καὶ προσευχομένου
  choice: 正在祷告的时候
  rationale: 现在分词表示当时正在持续的动作；“正在……的时候”清楚呈现天开与耶稣祷告同时发生。
- source_word: ἀνεῳχθῆναι
  choice: 开了
  rationale: 保留‘天被打开’的被动/自发事件感，同时避免采用比原文更强烈的“裂开”。汉语以“天开了”自然表达这一景象。
- source_word: τὸν οὐρανὸν
  choice: 天
  rationale: οὐρανός既可指可见的天空，也可指属天领域；“天”在汉语中能自然保留这两层可能，并契合启示性场景。
theological_decisions:
- issue: 洗礼场景中οὐρανός的所指
  choice: 天
  alternative: 天空
  rationale: 下文圣灵降临并有声音传来，表明这里具有启示和神圣领域的意味；“天”既保留这种神学分量，也不排除可见天空的场景含义。
- issue: 耶稣受洗与祷告的时序关系
  choice: 耶稣也受了洗，正在祷告的时候
  alternative: 耶稣受洗并祷告的时候
  rationale: 不定过去时分词βαπτισθέντος与现在时分词προσευχομένου的体貌差异支持受洗已完成、祷告正在进行；译文呈现此差异，但不额外推断两者之间的时间间隔。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“众百姓”比“所有的人民”自然；保留句末逗号，以承接下一节尚未完结的句法和场景。
