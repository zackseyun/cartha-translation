  text: ἀποκριθεὶς δὲ ⸀ἔλεγεν αὐτοῖς· Ὁ ἔχων δύο χιτῶνας μεταδότω τῷ μὴ ἔχοντι, καὶ ὁ ἔχων βρώματα ὁμοίως ποιείτω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/011.yaml
  text: And answering[a], he said to them, “The one who has two tunics must share with the one who has none, and the one who has food must do likewise.”
translation:
  language: zh_hans
  text: 他回答众人说：“有两件贴身衣的，要分给那没有贴身衣的；有食物的，也要照样做。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ἔλεγεν αὐτοῖς
  choice: 他回答众人说
  rationale: 以自然的现代汉语表达分词加未完成时主句所构成的回应性发言；δὲ在此仅为轻微衔接，无须生硬译出。“众人”按上下文表达复数代词αὐτοῖς。
- source_word: Ὁ ἔχων
  choice: 有……的
  rationale: 保留泛指结构，现代汉语无需标示希腊语形式上的阳性单数，也不把范围缩窄为男性。
- source_word: δύο χιτῶνας
  choice: 两件贴身衣
  rationale: χιτών指穿在身上的基本内衣式衣物；“贴身衣”比现代“衬衫”更少时代错置，也比音译“长衣”更易懂。
- source_word: μεταδότω
  choice: 要分给
  rationale: 第三人称命令式在此表达明确劝令；“要”保留命令力度，“分给”体现把自己所有的分与缺乏者。
- source_word: τῷ μὴ ἔχοντι
  choice: 那没有的
  rationale: 承接前文省略“贴身衣”，保持原文简洁，所缺之物由语境清楚限定。
- source_word: βρώματα
  choice: 食物
  rationale: 准确而通俗地表达泛指可吃的东西。
- source_word: ὁμοίως ποιείτω
  choice: 也要照样做
  rationale: 保持与前一命令平行，并将同一分享原则延伸到食物。
theological_decisions:
- issue: 命令的力度
  choice: 要分给……也要照样做
  alternative: 应当分给……也应当照样做
  rationale: 两个第三人称命令式具有直接劝令意味；“要”比“应当”更简洁有力，同时不额外将其界定为得救条件或某种制度性规定。
- issue: 泛指参与者的性别表达
  choice: 有……的／那没有的
  alternative: 有……的人／没有……的人
  rationale: 希腊语阳性单数分词在此作泛指。汉语“有……的”自然涵盖所有人，并保留代表性泛指而不增加男性限定。
translation_notes:
  register: 采用现代、庄重而口语可懂的表达。经文短促直接，保留施洗约翰劝人以实际分享回应的命令语气。无需脚注；“贴身衣”已在正文中兼顾古代衣物含义与现代可懂度。
