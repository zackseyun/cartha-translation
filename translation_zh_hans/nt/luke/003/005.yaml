  text: πᾶσα φάραγξ πληρωθήσεται καὶ πᾶν ὄρος καὶ βουνὸς ταπεινωθήσεται, καὶ ἔσται τὰ σκολιὰ εἰς ⸀εὐθείαν καὶ αἱ τραχεῖαι εἰς ὁδοὺς λείας·
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/005.yaml
  text: Every valley will be filled[a], and every mountain and hill will be made low, and the crooked places will become straight[b], and the rough ways smooth roads.
translation:
  language: zh_hans
  text: 一切山谷都要被填满[a]，一切山岭和丘陵都要被削低；弯曲之处要变直[b]，崎岖之处要成为平坦的道路。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一切沟壑都要被填满……弯曲的要变直，崎岖的要成为平坦的道路。”
    reason: lexical_alternative
  - marker: b
    text: 这句话呼应《以赛亚书》40:4，以修筑道路的图景描写为主预备道路。
    reason: cross_reference
lexical_decisions:
- source_word: πᾶσα φάραγξ
  choice: 一切山谷
  rationale: φάραγξ可指山谷、峡谷或沟壑；“山谷”自然易懂，也符合整句整修道路、平整地势的图景。脚注保留“沟壑”这一较具体的可能译法。
- source_word: πληρωθήσεται
  choice: 都要被填满
  rationale: 这是πληρόω的将来时被动形式，按地形语境直译为“被填满”，既清楚又保留被动表达。
- source_word: πᾶν ὄρος καὶ βουνός
  choice: 一切山岭和冈陵
  rationale: ὄρος与βουνός是相近而有区别的地形词；分别译作“山岭”和“冈陵”，保留原文成对铺陈的诗性表达。
- source_word: ταπεινωθήσεται
  choice: 都要被削平
  rationale: 在地形语境中指高处被降低。“削平”是现代汉语中自然的道路施工用语，也保留具体图景；不译作抽象的“降卑”，以免把寓意直接写进正文。
- source_word: τὰ σκολιά
  choice: 弯曲之处
  rationale: 中性复数形容词作名词使用，并未明确补出“道路”；译作“弯曲之处”既符合上下文，又避免过度限定。
- source_word: εἰς εὐθείαν
  choice: 要变直
  rationale: εἰς在此表达结果或转变。“变直”简洁自然，对应弯曲之物成为直的。
- source_word: αἱ τραχεῖαι
  choice: 崎岖之路
  rationale: 阴性复数形容词作名词使用，可能省略了与道路相关的阴性名词；结合随后明确出现的ὁδούς，译为“崎岖之路”最为通顺。
- source_word: εἰς ὁδοὺς λείας
  choice: 要变成平坦的道路
  rationale: ὁδούς明确指道路，λείας可指平滑或平坦；在整修道路的地形图景中，“平坦的道路”自然准确。
theological_decisions:
- issue: 路加引用以赛亚书40:4时所用的先知性地形与筑路意象
  choice: 保留填谷、削平山岭、修直和铺平道路的具体图景
  alternative: 将其解释性地改写为谦卑者升高、骄傲者降卑等纯属灵或伦理语言
  rationale: 原文直接呈现为主预备道路的地形和筑路意象。正文保留这些具体形象，可维持引文的诗性力量与可能的神学张力，而不把某一种寓意预先写入翻译。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“一切……都要……”保留原文重复πᾶς所形成的全面性和节奏；使用“山岭和冈陵”“弯曲之处”“崎岖之路”等常用书面表达，避免生僻古雅措辞。
