base_translation:
  language: en
  yaml_path: translation/nt/luke/003/033.yaml
  text: the son of Amminadab[a], the son of Admin, the son of Arni, the son of Hezron, the son of Perez, the son of Judah,
translation:
  language: zh_hans
  text: 亚米拿达[a]的儿子，亚德民的儿子，亚尼的儿子，希斯仑的儿子，法勒斯的儿子，犹大的儿子，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“亚米拿达的儿子，亚德民的儿子，亚兰的儿子”；另有些抄本省略“亚德民”，作“亚米拿达的儿子，亚兰的儿子”。
    reason: textual_variant
lexical_decisions:
- source_word: τοῦ
  choice: ……的儿子
  rationale: 在路加的家谱中，反复出现的属格冠词承接前文省略的亲子关系。译作“……的儿子”既补出汉语所需的关系，也保留家谱逐代追溯的结构。
- source_word: Ἀμιναδάβ
  choice: 亚米拿达
  rationale: 采用现代中文圣经读者较熟悉的传统译名，并对应其闪语姓名。
- source_word: Ἀδμίν
  choice: 亚德民
  rationale: 按所据SBLGNT正文音译此希腊专名；异文问题另在脚注交代。
- source_word: Ἀρνί
  choice: 亚尼
  rationale: 直接反映SBLGNT正文所载Ἀρνί，不以异文“亚兰”取代正文。
- source_word: Ἑσρώμ
  choice: 希斯仑
  rationale: 采用与旧约人物对应的通行中文译名，便于辨认同一祖先。
- source_word: Φαρές
  choice: 法勒斯
  rationale: 采用中文圣经中与旧约人物对应的通行译名。
- source_word: Ἰούδα
  choice: 犹大
  rationale: 在旧约祖先和家谱语境中采用通行译名“犹大”。
theological_decisions: []
translation_notes:
  register: 采用自然而庄重的现代标准汉语，并保留原文家谱连续重复的节奏。脚注标记置于“亚米拿达”之后，提示其后数代姓名所涉及的整组抄本异文。
