id: LUK.3.22
reference: Luke 3:22
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ καταβῆναι τὸ πνεῦμα τὸ ἅγιον σωματικῷ εἴδει ⸀ὡς περιστερὰν ἐπ’ αὐτόν, καὶ φωνὴν ἐξ οὐρανοῦ ⸀γενέσθαι· Σὺ εἶ ὁ υἱός μου ὁ ἀγαπητός, ἐν σοὶ εὐδόκησα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/022.yaml
  text: 'and the Holy Spirit descended on him in bodily form like a dove[a], and a voice came from heaven: “You are my beloved Son; in you I am well pleased.”'
translation:
  language: zh_hans
  text: 圣灵以有形的样式、仿佛鸽子，降在他身上；又有声音从天上来：“你是我的爱子；我喜悦你。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我因你而喜悦了。”
    reason: 保留εὐδόκησα不定过去时可作较过去取向表达的译法；正文“我喜悦你”则以自然汉语传达此宣告中持续的悦纳。
lexical_decisions:
- source_word: καταβῆναι
  choice: 降在
  rationale: 保留向下而来的动作，并与“在他身上”自然衔接；不把不定式的叙事功能生硬复制到中文。
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: 圣灵
  rationale: 这是现代汉语中明确、通行且庄重的对应表达。
- source_word: σωματικῷ εἴδει
  choice: 以有形的形态
  rationale: 表达这次显现具有可感知的外在形态，而非仅是内在感受；同时不擅自断定圣灵本质上具有某种固定肉身。
- source_word: ὡς περιστερὰν
  choice: 仿佛鸽子
  rationale: 保留ὡς所标示的比较，不把经文加强为圣灵实际变成了一只鸽子。
- source_word: ἐπ’ αὐτόν
  choice: 在他身上
  rationale: 自然表达圣灵降临所指向并停驻的对象。
- source_word: φωνὴν ἐξ οὐρανοῦ γενέσθαι
  choice: 有声音从天上来
  rationale: γενέσθαι与φωνή构成事件性表达；此译法符合现代汉语叙事习惯，也保留声音来自天上的信息。
- source_word: Σὺ εἶ ὁ υἱός μου ὁ ἀγαπητός
  choice: 你是我的爱子
  rationale: “爱子”简洁而庄重，表达独立后置的ὁ ἀγαπητός所强调的蒙爱身份；句首“你”也保留直接指向。
- source_word: ἐν σοὶ εὐδόκησα
  choice: 我喜悦你
  rationale: 以自然汉语表达神对子的悦纳与喜爱；希腊语不定过去时所可能带出的过去或完成意味另以脚注保留。
theological_decisions:
- issue: 圣灵显现与鸽子的关系
  choice: 译作“以有形的形态，仿佛鸽子”
  alternative: 圣灵以一只实际鸽子的形体降下
  rationale: σωματικῷ εἴδει说明显现具有外在形态，ὡς περιστερὰν则构成比较；译文既肯定其可感知性，也不越过原文断言圣灵变成鸽子。
- issue: εὐδόκησα的时态与陈述力度
  choice: 正文译作“我喜悦你”
  alternative: 我已因你而喜悦
  rationale: 中文现在式表达更自然地传达宣告中的悦纳状态，而脚注保留不定过去时较形式对应的译法，避免完全抹平其时间或完成层面的可能含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式保留两个并列事件：圣灵降下与天上有声音；不添加原文没有明说的“圣灵变成鸽子”等解释。脚注标记置于其实际说明的“我喜悦你”之后。
