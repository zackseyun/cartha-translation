  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ αὐτὸς ⸀ἦν Ἰησοῦς ⸂ἀρχόμενος ὡσεὶ ἐτῶν τριάκοντα⸃, ὢν ⸂υἱός, ὡς ἐνομίζετο⸃, Ἰωσὴφ τοῦ Ἠλὶ
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/023.yaml
  text: And Jesus himself[a], when he began, was about thirty years old, being the son (as was supposed) of Joseph[c][b], of Heli.
translation:
  language: zh_hans
  text: 耶稣自己开始时，年约三十岁；照人们所认为的，他是约瑟的儿子[a]；约瑟是希里的儿子[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 即人们通常认为耶稣是约瑟的儿子。
    reason: 说明“照人们所认为的”限定耶稣与约瑟的父子关系。
  - marker: b
    text: 原文在此以“约瑟的，希里的”继续家谱的属格链，未重复“儿子”；译文按家谱结构补出“儿子”。
    reason: 交代希腊文家谱链的省略表达。
lexical_decisions:
- source_word: Καὶ
  choice: （不单独译出）
  rationale: 此处承接前文；现代汉语开始新段落或转入新叙述时，无须机械译作“并且”。
- source_word: αὐτὸς
  choice: 本人
  rationale: 保留强调代词的强调作用，同时使表达符合现代汉语习惯。
- source_word: ἀρχόμενος
  choice: 开始的时候
  rationale: 保留原文未明说开始何事的含混性，不擅自补入“传道”或“事工”。
- source_word: ὡσεὶ ἐτῶν τριάκοντα
  choice: 年约三十岁
  rationale: 自然表达年龄，并保留ὡσεὶ所表示的约数。
- source_word: ὡς ἐνομίζετο
  choice: 照人们的看法
  rationale: 表达社会上的通常认定，也保留路加对约瑟之父子关系的距离感。
- source_word: υἱός
  choice: 儿子
  rationale: 用汉语家谱中自然的亲属称谓承接后续属格链。
- source_word: τοῦ Ἠλὶ
  choice: 约瑟是希里的儿子
  rationale: 希腊文仅以属格“希里的”延续家谱；汉语必须适度补足关系才清楚。
theological_decisions:
- issue: “照人们的看法”所限定的父子关系
  choice: 将其理解并译作对“他是约瑟的儿子”这一社会认定的限定
  alternative: 不以标点清楚标示限定范围，或直接断言约瑟是其生父
  rationale: 这样既与路加此前关于耶稣受孕的叙述保持张力，也不超出本节明说的内容。
- issue: ἀρχόμενος是否补明为开始公开事工
  choice: 正文只译“开始的时候”
  alternative: 译作“开始传道的时候”或“开始事工的时候”
  rationale: 上下文可能指公开活动的开始，但原文没有相应名词，应保留其简略与含混。
- issue: Ἰωσὴφ τοῦ Ἠλὶ的家谱关系
  choice: 正文按通常的属格家谱链译为“约瑟是希里的儿子”
  alternative: 仅译“约瑟，希里的”，或把希里直接接作耶稣的上一代
  rationale: 此后家谱以连续属格列名；汉语补出“儿子”能明确结构，但脚注说明原文的省略形式。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。“耶稣本人”保留强调；“开始的时候”刻意不补入原文没有的“传道/事工”。分号帮助读者辨明年龄陈述与家谱引入之间的结构。
