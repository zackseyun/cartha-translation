  text: the son of Maath[a], the son of Mattathias, the son of Semein, the son of Josech, the son of Joda,
translation:
  language: zh_hans
  text: 玛押是玛他提亚的儿子；玛他提亚是西缅的儿子；西缅是约瑟的儿子；约瑟是约达的儿子，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦ
  choice: ……的儿子
  rationale: 本节希腊文在每个人名之前仅重复属格冠词，承接上下文的家谱格式，省略了“儿子”。中文补出“的儿子”，使亲属关系清楚自然。
- source_word: Μάαθ
  choice: 玛押
  rationale: 按现代中文圣经人名的常见音译方式处理此希腊人名。
- source_word: Ματταθίου
  choice: 玛他提亚
  rationale: 这是人名 Ματταθίας 的属格形式；译名采用便于现代中文读者辨认的音译。
- source_word: Σεμεῒν
  choice: 西缅
  rationale: 采用该闪族人名在中文圣经传统中通行且自然的形式；希腊文本在此写作 Σεμεΐν。
- source_word: Ἰωσὴχ
  choice: 约瑟
  rationale: 按希腊形式 Ἰωσήχ 音译，并采用中文读者熟悉的同源人名形式；不据其他文本异读改换为别名。
- source_word: Ἰωδὰ
  choice: 约达
  rationale: 直接依照希腊文 Ἰωδά 音译，不按可能的希伯来形式作协调。
