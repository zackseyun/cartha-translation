  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ἐν ἔτει δὲ πεντεκαιδεκάτῳ τῆς ἡγεμονίας Τιβερίου Καίσαρος, ἡγεμονεύοντος Ποντίου Πιλάτου τῆς Ἰουδαίας, καὶ τετρααρχοῦντος τῆς Γαλιλαίας Ἡρῴδου, Φιλίππου δὲ τοῦ ἀδελφοῦ αὐτοῦ τετρααρχοῦντος τῆς Ἰτουραίας καὶ Τραχωνίτιδος χώρας, καὶ Λυσανίου τῆς Ἀβιληνῆς τετρααρχοῦντος,
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/001.yaml
  text: In the fifteenth year of the reign of Tiberius Caesar[a], while Pontius Pilate was governing Judea, and Herod was tetrarch of Galilee, and Philip his brother was tetrarch of the region of Iturea and Trachonitis, and Lysanias was tetrarch of Abilene[b],
translation:
  language: zh_hans
  text: 提庇留·凯撒在位第十五年[a]，当本丢·彼拉多治理犹太地区、希律作加利利的分封王、他的兄弟腓力作以土利亚和特拉可尼地区的分封王，以及吕撒聂作亚比利尼的分封王[b]时，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在提庇留·凯撒在位第十五年期间”。
    reason: 说明原文时间结构也可突出“在该年期间”的意味。
  - marker: b
    text: “分封王”是罗马政权之下的地方统治者。
    reason: 解释古代政治职衔，避免现代读者把它理解为独立君王。
lexical_decisions:
- source_word: Ἐν ἔτει ... πεντεκαιδεκάτῳ
  choice: 提庇留·凯撒执政第十五年
  rationale: 按汉语自然的纪年表达呈现时间框架；不添加原文没有的“如今”。
- source_word: δὲ
  choice: 不单独译出
  rationale: 此处主要标示叙事转接；汉语可借句首纪年自然推进叙事，若硬译为“现在”或“而”反而不自然或造成虚假的转折。
- source_word: ἡγεμονίας
  choice: 执政
  rationale: 用于罗马皇帝时，既表达其统治时期，又比“治理”更符合汉语纪年的习惯。
- source_word: ἡγεμονεύοντος
  choice: 治理
  rationale: 保留分词的动态含义，不把它改写成原文未明说的正式官衔“总督”。
- source_word: τετρααρχοῦντος
  choice: 作……的分封王
  rationale: “分封王”是现代中文中较通行的历史称谓，保留该职衔的特殊性，而不笼统译成“统治者”。
- source_word: Φιλίππου ... τοῦ ἀδελφοῦ αὐτοῦ
  choice: 他兄弟腓力
  rationale: 自然简洁地保留同位关系，并使代词回指希律。
- source_word: τῆς Ἰτουραίας καὶ Τραχωνίτιδος χώρας
  choice: 以土利亚和特拉可尼地区
  rationale: 译出 χώρας 的地域含义，避免把两个名称理解为现代主权国家。
theological_decisions:
- issue: 政治职衔 τετρααρχοῦντος 的译法
  choice: 作……的分封王
  alternative: 统治……／作……的统治者
  rationale: 保留具体的历史职衔，避免将不同层级的罗马属地统治者一概而论；这里不引入额外的教派性解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留原文由多个政治人物和辖区构成的长句，以及末尾承接下一节的逗号。人名、地名采用简体中文圣经传统中通行的译名。
