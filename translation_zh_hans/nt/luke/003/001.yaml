  to: 提庇留·凯撒在位第十五年[a]，当本丢·彼拉多治理犹太地区、希律作加利利的分封王、他的兄弟腓力作以土利亚和特拉可尼地区的分封王，以及吕撒聂作亚比利尼的分封王[b]时，
  rationale: 修订仅改善汉语表达并更准确反映原文的时间与伴随情境：以“在位”对应皇帝的统治年数，以“当……时”统摄一连串属格绝对结构；保留“分封王”这一具体历史职衔及原文末尾承接下一节的逗号。
