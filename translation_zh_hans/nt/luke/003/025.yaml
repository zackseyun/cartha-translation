  text: the son of Mattathias, the son of Amos, the son of Nahum, the son of Esli, the son of Naggai,
translation:
  language: zh_hans
  text: 是玛他提亚的儿子；玛他提亚是亚摩斯的儿子；亚摩斯是拿鸿的儿子；拿鸿是以斯利的儿子；以斯利是拿该的儿子，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦ（重复出现）
  choice: ……的儿子
  rationale: 这些属格冠词承接路加家谱在上下文中已经确立的省略结构。中文补出“……的儿子”，可清楚表达父子谱系关系。由于本节是跨节延续的家谱链，首个名字也按承接上节的方式译出。
- source_word: Ματταθίου
  choice: 玛他提亚
  rationale: 按现代中文圣经人名的常用音译处理；该词为属格形式，词典形为 Ματταθίας。
- source_word: Ἀμὼς
  choice: 亚摩斯
  rationale: 采用该希伯来人名在现代中文中的通行形式；此处只是家谱中一位祖先的名字，未必指先知亚摩斯。
- source_word: Ναοὺμ
  choice: 拿鸿
  rationale: 采用该人名在现代中文圣经中的通行形式。
- source_word: Ἑσλὶ
  choice: 以斯利
  rationale: 按希腊文读音并兼顾中文圣经惯用形式音译。
- source_word: Ναγγαὶ
  choice: 拿该
  rationale: 按希腊文读音作自然、简洁的中文音译。
theological_decisions:
- issue: 家谱中属格链的关系表达
  choice: 明确补出“……是……的儿子”
  alternative: 仅以“……的，……的”串列人名
  rationale: 原文关系在更大的句法结构中虽为省略，却明确承接“儿子”这一家谱公式；中文若不补出会生硬且难以理解。这是句法明示，不是额外的神学解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。为避免连续重复“……的儿子”的结构产生归属歧义，以“甲的儿子，甲是乙的儿子……”展开属格链；保留经文末尾逗号，以表明家谱在下一节继续。
