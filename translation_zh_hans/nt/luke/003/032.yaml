  text: 耶西的儿子，约贝勒的儿子，波阿斯的儿子，撒拉的儿子，拿顺的儿子，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰεσσαί
  choice: 耶西
  rationale: 采用现代中文圣经中广为人知、且与旧约人物对应的译名。
- source_word: Ἰωβήλ
  choice: 俄备得
  rationale: 此处希腊文形式指向旧约家谱中的俄备得；按对应人物的通行中文译名处理，避免依英语 Jobed 机械音译。
- source_word: Βόος
  choice: 波阿斯
  rationale: 对应旧约人物波阿斯，采用通行中文译名。
- source_word: Σαλά
  choice: 撒拉
  rationale: 依本节希腊文本音译，保留其与马太家谱及部分旧约文本形式之间的文本张力。
- source_word: Ναασσών
  choice: 拿顺
  rationale: 对应旧约人物拿顺，采用通行中文译名。
- source_word: τοῦ
  choice: ……的儿子
  rationale: 希腊文家谱以重复的属格冠词连接世系；中文补出“的儿子”，自然且清楚地表达父子关系。
theological_decisions:
- issue: 路加家谱中撒拉与波阿斯之间的世系关系
  choice: 按 SBLGNT 正文直译为“撒拉的儿子”
  alternative: 依据旧约传统改作“撒门的儿子”或加注协调
  rationale: 忠实保留本节所给希腊文本，不以平行家谱或旧约传统静默修正。
translation_notes:
  register: 采用庄重而自然的现代标准汉语；保留家谱链条的重复结构，并沿用上下文未完句式，以逗号收尾。
