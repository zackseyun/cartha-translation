  yaml_path: translation/nt/luke/003/018.yaml
  text: So with many other exhortations as well[a], he was proclaiming the good news to the people.
translation:
  language: zh_hans
  text: 这样，他用许多别的话劝勉百姓，并向他们宣讲好消息。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他还作了许多别的劝勉。”希腊文中“许多”和“别的”所指的事物没有明说。
    reason: 保留 Πολλὰ καὶ ἕτερα 所指对象省略而产生的词汇和句法歧义。
lexical_decisions:
- source_word: Πολλὰ
  choice: 许多
  rationale: 中性复数形容词作名词用，所指的中心词没有明说；按说话语境，正文自然地补出“话”，同时以脚注保留原文的含蓄性。
- source_word: μὲν οὖν
  choice: 所以
  rationale: 这一组合在此承接上文并推进叙述；“所以”简洁地体现其过渡和总结作用，不逐字硬译两个虚词。
- source_word: καὶ ἕτερα
  choice: 还……别的
  rationale: 表达在前述内容之外另有许多附加的话；“还”和“别的”共同传达追加之意。
- source_word: παρακαλῶν
  choice: 劝勉
  rationale: 在施洗约翰的先知性宣讲语境中，既包含劝导、敦促，也不排除鼓励的意味；“劝勉”较完整地保留这种语义范围。
- source_word: εὐηγγελίζετο
  choice: 传好消息
  rationale: 保留动词所表达的福音性宣告，而不淡化为一般的“讲道”；汉语叙述本身可自然表达当时持续进行的行动。
- source_word: τὸν λαόν
  choice: 百姓
  rationale: 准确表达受约翰宣讲的人群，并保留路加文献中 λαός 可能具有的群体性意味，而不擅自限定为“以色列人”。
theological_decisions:
- issue: εὐηγγελίζετο 对施洗约翰事工的定性
  choice: 传好消息
  alternative: 宣讲；传道
  rationale: 原文明确用“传好消息”的动词描述约翰的劝勉性宣讲。译文保留这种看似带有张力的正面定性，不将它弱化为普通宣讲。
- issue: Πολλὰ καὶ ἕτερα 与 παρακαλῶν 的句法关系
  choice: 正文译作“用许多别的话劝勉”
  alternative: “作了许多别的劝勉”
  rationale: 原文省略了“许多”所修饰或代指的具体事物，两种理解都可成立；正文采用现代汉语较自然的说法，脚注保留另一种句法理解。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“劝勉”兼顾劝导与鼓励；“传好消息”通俗明白，并忠实保留原文对约翰宣讲的福音性描述。
