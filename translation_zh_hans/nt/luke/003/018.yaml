    rationale: 此处主要承接并推进叙述；“这样”较稳妥，不把语篇过渡明确化为逻辑因果。
  - severity: medium
    issue: “向他们传好消息”可被理解为把某一好消息告知他们。
    rationale: εὐηγγελίζετο 指宣告、传扬好消息；加上“宣讲”可在现代汉语中清楚保留其公开宣告的语义。
  revised_text: 这样，他用许多别的话劝勉百姓，并向他们宣讲好消息。[a]
