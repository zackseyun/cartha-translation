source:
  edition: SBLGNT
  text: οὗ τὸ πτύον ἐν τῇ χειρὶ αὐτοῦ ⸀διακαθᾶραι τὴν ἅλωνα αὐτοῦ καὶ ⸀συναγαγεῖν τὸν σῖτον εἰς τὴν ἀποθήκην αὐτοῦ, τὸ δὲ ἄχυρον κατακαύσει πυρὶ ἀσβέστῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/017.yaml
  text: His winnowing fork is in his hand to thoroughly clear his threshing floor and to gather the wheat into his storehouse[c][b][a], but the chaff he will burn up with unquenchable fire.
translation:
  language: zh_hans
  text: 他的扬谷铲在手里[a]，要彻底扬净他的禾场，把麦子收进他的粮仓[b]；至于糠秕，他要用不能熄灭的火烧尽[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “扬谷铲”或可译作“扬谷叉”；传统译作“簸箕”。希腊语所指的是把谷物扬到空中、使谷粒与糠秕分开的农具。
    reason: lexical_alternative
  - marker: b
    text: “粮仓”也可译作“仓房”或“谷仓”。
    reason: lexical_alternative
  - marker: c
    text: “不能熄灭的火”也可译作“无法扑灭的火”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πτύον
  choice: 扬谷铲
  rationale: 指把谷物扬到空中、使谷粒与糠秕分开的农具。“扬谷铲”在现代汉语中能直接说明用途，又不把它误解为扇风用的扇子。
- source_word: διακαθᾶραι
  choice: 彻底清理
  rationale: 该复合动词带有清理完全、清理干净的加强意味；“彻底清理”既保留其力度，也符合禾场语境。
- source_word: ἅλωνα
  choice: 禾场
  rationale: 指脱粒、扬谷的场地；“禾场”是准确而凝练的农业用语，并保留审判与分开的比喻。
- source_word: συναγαγεῖν
  choice: 收进
  rationale: 结合目的地“粮仓”，译作“收进”比逐字译作“聚集到”更符合自然汉语，同时保留收拢谷物的动作。
- source_word: σῖτον
  choice: 麦子
  rationale: 该词可泛指谷物，但在与糠秕相对的扬谷场景中，“麦子”自然、具体，也符合本段传统理解。
- source_word: ἀποθήκην
  choice: 粮仓
  rationale: 指储存物品、在此尤指储粮的地方；“粮仓”清楚贴合语境，又不限定为某一种建筑形式。
- source_word: ἄχυρον
  choice: 糠秕
  rationale: 在扬谷语境中指与可用谷粒分开的无用外壳等；“糠秕”比“稻草”更准确，并与“麦子”形成清楚对照。
- source_word: κατακαύσει
  choice: 烧尽
  rationale: 复合动词表达彻底焚烧；“烧尽”简洁保留完全烧毁的力度。
- source_word: πυρὶ ἀσβέστῳ
  choice: 用不能熄灭的火
  rationale: 准确表达火无法被扑灭或熄灭的含义，不把经文进一步系统化为超出本句的教义陈述。
- source_word: οὗ
  choice: 他的
  rationale: 属格关系代词承接前文“那将要来的”；汉语以“他的……在手里”自然表达所属关系。
theological_decisions:
- issue: 农业比喻中的审判意象
  choice: 保留麦子被收进粮仓、糠秕被不能熄灭的火烧尽这一鲜明的分开与审判图景。
  alternative: 把本句限定为只指当时对以色列的历史性审判，或将其直接扩展成一套完整的末世刑罚教义。
  rationale: 原文明确呈现拯救与审判两方面，却没有在本句说明审判如何、何时最终施行；译文应保留其力度和张力，不替经文作进一步的教义限定。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“禾场”“糠秕”保留必要的农业意象；上下文和脚注帮助普通读者理解。句式先陈明农具在手，再以“要”表达两个不定式的目的，末句用“至于……他要……”突出麦子与糠秕之间的对比。
