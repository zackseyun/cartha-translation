  text: ποιήσατε οὖν καρποὺς ἀξίους τῆς μετανοίας· καὶ μὴ ἄρξησθε λέγειν ἐν ἑαυτοῖς· Πατέρα ἔχομεν τὸν Ἀβραάμ, λέγω γὰρ ὑμῖν ὅτι δύναται ὁ θεὸς ἐκ τῶν λίθων τούτων ἐγεῖραι τέκνα τῷ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/008.yaml
  text: Therefore produce fruits worthy of repentance[a], and do not begin to say among yourselves[b], ‘We have Abraham as our father,’ for I tell you that God is able to raise up children for Abraham from these stones.
translation:
  language: zh_hans
  text: 所以，你们要结出与悔改相称的果子[a]。不要开始彼此说：‘我们有亚伯拉罕作我们的父亲’，因为我告诉你们，神能从这些石头中给亚伯拉罕兴起儿女。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“结出配得上悔改的果子”或“结出符合悔改的果子”。希腊原文“果子”为复数，强调真实悔改所带来的各种相称行为。
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσατε
  choice: 要结出
  rationale: 与“果子”搭配时，现代汉语自然说“结出果子”；同时用“要”保留不定过去时命令语气所表达的明确要求。
- source_word: οὖν
  choice: 所以
  rationale: 承接上文并表示推论；“所以”比“因此”更符合现代口语化而庄重的叙述。
- source_word: καρποὺς
  choice: 果子
  rationale: 汉语“果子”可作集合性表达，不必机械标示希腊语复数；脚注说明原文为复数，并强调多方面可见的行为表现。
- source_word: ἀξίους τῆς μετανοίας
  choice: 与悔改相称的
  rationale: ἀξίους在这里表示符合、配得上或相称，而不是行为赚取悔改或赦免；“与悔改相称”准确而自然。
- source_word: μὴ ἄρξησθε λέγειν
  choice: 不要开始……说
  rationale: 保留ἄρξησθε“开始”的明确含义，传达连这种自恃血统的话都不要起头说。
- source_word: ἐν ἑαυτοῖς
  choice: 在自己中间
  rationale: 保留原短语可能指群体内部彼此说，也可能涉及各人内心自言自语的空间；脚注列明两种理解。
- source_word: Πατέρα ἔχομεν τὸν Ἀβραάμ
  choice: 我们有亚伯拉罕作我们的父
  rationale: 贴近原文“有……作父”的结构，突出说话者以亚伯拉罕血统为倚靠。
- source_word: δύναται ὁ θεὸς
  choice: 神能
  rationale: 简洁自然地表达神具有这样的能力，保留宣告的力度。
- source_word: ἐκ τῶν λίθων τούτων
  choice: 从这些石头中
  rationale: 准确表达ἐκ的来源含义，也保留“这些”所指向的现场感。
- source_word: ἐγεῖραι τέκνα τῷ Ἀβραάμ
  choice: 给亚伯拉罕兴起儿女来
  rationale: “兴起”保留ἐγεῖραι可指使之出现、产生的力度；“给亚伯拉罕”保留间接受格关系，且不预先限定这些儿女如何成为他的儿女。
theological_decisions:
- issue: “与悔改相称的果子”的含义
  choice: 译为与悔改相符合、能显明悔改的行为结果
  alternative: 可译为“配得上悔改的果子”或“符合悔改的果子”
  rationale: 原文强调行为与悔改之间的相称关系，并未说这些行为赚取赦免；译文避免把这种伦理要求弱化，也不加入功德观。
- issue: 亚伯拉罕血统的地位
  choice: 保留约翰对倚靠肉身血统的直接驳斥
  alternative: 可意译为“不要以为祖先是亚伯拉罕就有保障”
  rationale: 原文没有展开解释，而是把人的血统自信与神从石头兴起儿女的能力并置；直译能保留其警告和神学张力。
- issue: “儿女”的所指
  choice: 使用宽泛的“儿女”
  alternative: “子孙”或“后裔”
  rationale: τέκνα既有亲属和后裔含义，也能承载属灵归属的张力；“儿女”不把意义限制为生物学后代。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“结出……果子”符合汉语惯用表达；“兴起儿女”略带经文语体，但含义清楚，并保留原文的宣告力度。所有脚注标记均已置于正文相应位置。
