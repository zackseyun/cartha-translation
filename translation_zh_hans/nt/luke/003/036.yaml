  yaml_path: translation/nt/luke/003/036.yaml
  text: the son of Cainan[a], the son of Arphaxad, the son of Shem, the son of Noah, the son of Lamech[c][b],
translation:
  language: zh_hans
  text: 该南[a]的儿子，亚法撒[b]的儿子，闪的儿子，挪亚的儿子，拉麦的儿子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些传统省略“该南”，使这里的家谱更接近旧约的某些形式。
    reason: textual_variant
  - marker: b
    text: “亚法撒”依照路加所用的希腊文名字；旧约中对应的希伯来文名字也常译作“亚法辖”。
    reason: cross_reference
lexical_decisions:
- source_word: τοῦ
  choice: ……的儿子
  rationale: 在路加福音的家谱结构中，反复出现的属格冠词承接上下文所确立的世系关系。译为“……的儿子”可在现代汉语中清楚表达这一省略关系。
- source_word: Καϊνὰμ
  choice: 该南
  rationale: 采用现代中文圣经读者较熟悉的专名译法；希腊文名为 Καϊνάμ。
- source_word: Ἀρφαξὰδ
  choice: 亚法撒
  rationale: 按路加所用的希腊文形式译名，并采用现代中文圣经中通行的对应名称。旧约希伯来文名称的中文常译形式有所不同，故以脚注说明。
- source_word: Σὴμ
  choice: 闪
  rationale: 采用该圣经人物在现代中文中的通行译名。
- source_word: Νῶε
  choice: 挪亚
  rationale: 采用该圣经人物在现代中文中的通行译名，而不机械音译希腊文形式。
- source_word: Λάμεχ
  choice: 拉麦
  rationale: 采用该圣经人物在现代中文中的通行译名。
theological_decisions:
- issue: 路加的家谱在亚法撒与闪之间是否包括该南
  choice: 正文保留“该南”
  alternative: 有些抄本或为使家谱更接近旧约某些形式而形成的传统省略“该南”
  rationale: SBLGNT 的路加福音3:36含有 Καϊνάμ，因此正文忠实保留，不以旧约家谱形式来协调路加的文本。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。各人名优先使用简体中文圣经语境中的通行译名；重复“……的儿子”以显明希腊文属格链在家谱中的关系。未另设该南拼写脚注，因为英语 Cainan/Kainan 的字母拼写差异在中文通行译名中没有直接对应的必要。
