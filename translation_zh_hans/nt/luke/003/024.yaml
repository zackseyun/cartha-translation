  text: the son of Matthat[a], the son of Levi, the son of Melchi, the son of Jannai, the son of Joseph,
translation:
  language: zh_hans
  text: （他）是玛塔[a]的儿子；玛塔是利未的儿子；利未是麦基的儿子；麦基是雅拿的儿子；雅拿是约瑟的儿子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较形式化可译为：“玛塔的、利未的、麦基的、雅拿的、约瑟的。”希腊文以连续的属格形式延续家谱，父子关系由上下文隐含。
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ
  choice: ……的儿子
  rationale: 本节延续路加的家谱；反复出现的属格冠词与人名省略了由上下文确定的亲子关系。中文补出“……的儿子”，使关系清楚，同时不增加原文没有的实质内容。
- source_word: Μαθθὰτ
  choice: 玛塔
  rationale: 按希腊语人名音译，并采用现代中文圣经人名中自然、易读的形式。
- source_word: Λευὶ
  choice: 利未
  rationale: 采用该人名在现代中文圣经中的通行译名。
- source_word: Μελχὶ
  choice: 麦基
  rationale: 按希腊语形式音译，兼顾现代普通话的自然读法。
- source_word: Ἰανναὶ
  choice: 雅拿
  rationale: 按希腊语人名音译；不把它与其他相近人名擅自等同。
- source_word: Ἰωσὴφ
  choice: 约瑟
  rationale: 采用该人名在现代中文圣经中的通行译名。
theological_decisions:
- issue: 家谱中的省略表达
  choice: 逐层补出“……的儿子”，并以中文链式句法明确每一代关系
  alternative: 形式化地保留为“属玛塔、属利未、属麦基、属雅拿、属约瑟”
  rationale: 希腊文只是连续使用属格冠词和人名，亲子含义来自家谱上下文。中文若只译“属……”容易被理解为归属关系；补出“儿子”准确呈现上下文隐含的谱系关系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。为避免中文连续重复“……的儿子”的结构产生关系歧义，使用“甲的儿子，甲是乙的儿子”的链式表达；标点按独立经节呈现。
