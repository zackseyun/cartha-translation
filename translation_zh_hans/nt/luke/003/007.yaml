  text: Ἔλεγεν οὖν τοῖς ἐκπορευομένοις ὄχλοις βαπτισθῆναι ὑπ’ αὐτοῦ· Γεννήματα ἐχιδνῶν, τίς ὑπέδειξεν ὑμῖν φυγεῖν ἀπὸ τῆς μελλούσης ὀργῆς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/007.yaml
  text: So he was saying to the crowds coming out to be baptized by him[a], “Offspring of vipers[b], who warned you to flee from the coming wrath?”
translation:
  language: zh_hans
  text: 于是，他对那些出来接受他施洗的人群说：“毒蛇的后代！谁警告你们要逃避将要来临的愤怒？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔλεγεν
  choice: 说
  rationale: 希腊语未完成时可表示持续或反复的言说；现代汉语叙事中用“说”最自然，不强行加入“不断”等频率含义。
- source_word: οὖν
  choice: 于是
  rationale: 承接上文并推进叙事；“于是”符合现代汉语表达。
- source_word: τοῖς ἐκπορευομένοις ὄχλοις
  choice: 对那些出来……的众人
  rationale: 保留分词所表达的向外出来之动作，并明确这些人是约翰说话的对象。
- source_word: βαπτισθῆναι ὑπ’ αὐτοῦ
  choice: 要受他洗
  rationale: 保留被动含义及目的意味；“受他洗”在中文圣经语境中简洁自然，代词也对应原文。
- source_word: Γεννήματα ἐχιδνῶν
  choice: 毒蛇的后代
  rationale: γέννημα指所生或所产生的；“后代”较直接地保留原词意象，“毒蛇”传达ἔχιδνα的危险性。
- source_word: τίς ὑπέδειξεν ὑμῖν
  choice: 谁指示你们
  rationale: ὑποδείκνυμι可指指明、指教或警告；“指示”保留其较宽语义，避免替反问句预先判定只是警告。
- source_word: φυγεῖν
  choice: 逃避
  rationale: 保留从危险中逃离的图像，在现代汉语中与“愤怒”搭配自然。
- source_word: ἀπὸ τῆς μελλούσης ὀργῆς
  choice: 逃避将要临到的愤怒
  rationale: “将要临到”表达μέλλουσα所指的未来、迫近性质；“愤怒”保留ὀργή本身，没有在正文中将其解释性改写为“审判”。
theological_decisions:
- issue: ὀργή所指的性质
  choice: 译作“愤怒”，让上下文表明这是上帝将临的震怒与审判
  alternative: 直接译作“将来的审判”或限定为某一种末世审判
  rationale: 原文使用“愤怒”而非“审判”，虽在语境中指向神的审判，却没有进一步规定其历史或末世范围；保留原词可避免缩窄神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“毒蛇的后代”保留斥责的强烈意象；整节不加脚注，因为正文能够自然承载原文意义，所给英文脚注的标记与内容似有错位，不能据此移植。
