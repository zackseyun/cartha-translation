  source_fidelity: 译文整体准确传达了约翰向前来受洗的人群所作的严厉警告，并保留了“将要来临的愤怒”这一未被狭义界定的表述。但“谁指示你们”未充分表达此处ὑπέδειξεν在审判迫近语境中的警告意味；“受他洗”也不符合现代普通话的自然搭配。
  naturalness: “那些出来要受他洗的众人”结构略显累赘，且“受他洗”不够自然。改为“那些出来接受他施洗的人群”更合现代书面普通话，同时不改变施洗者与受洗者的关系。
  terminology: “毒蛇的后代”可保留γέννημα ἐχιδνῶν的强烈血缘／族类意象；“愤怒”恰当保留ὀργή，而不在正文中替换为“审判”或预设某种末世论。“警告”在本句中比“指示”更能反映ὑποδείκνυμι的语境功能。
