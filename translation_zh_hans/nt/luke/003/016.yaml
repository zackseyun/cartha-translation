  text: ἀπεκρίνατο ⸂λέγων πᾶσιν ὁ Ἰωάννης⸃· Ἐγὼ μὲν ὕδατι βαπτίζω ὑμᾶς· ἔρχεται δὲ ὁ ἰσχυρότερός μου, οὗ οὐκ εἰμὶ ἱκανὸς λῦσαι τὸν ἱμάντα τῶν ὑποδημάτων αὐτοῦ· αὐτὸς ὑμᾶς βαπτίσει ἐν πνεύματι ἁγίῳ καὶ πυρί·
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/016.yaml
  text: John answered them all[a], saying, “I indeed baptize you with water, but one stronger than I is coming, whose sandal strap I am not worthy to untie[d][c][b]. He will baptize you in the Holy Spirit and fire.”
translation:
  language: zh_hans
  text: 约翰回答众人说：“我用水给你们施洗；但有一位能力比我更大的要来，我连给他解鞋的带子也不配。他要在圣灵与火中[a]给你们施洗。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在圣灵与火中”也可译作“用圣灵与火”。这里的“火”可能让人想到洁净、审判，或圣灵与火这一整体施洗图像；原文在本句中没有进一步说明。
    reason: 说明介词ἐν的可能语义，并保留“火”的诠释开放性。
lexical_decisions:
- source_word: ἀπεκρίνατο λέγων πᾶσιν ὁ Ἰωάννης
  choice: 约翰回答众人说
  rationale: 保留回应性的叙事表达及 πᾶσιν 的整体范围；现代汉语用“回答众人说”自然清楚，无须机械重复分词结构。
- source_word: Ἐγὼ μὲν ὕδατι βαπτίζω ὑμᾶς
  choice: 我用水给你们施洗
  rationale: μέν 为下文的转折作铺垫，汉语借分号和“但”自然体现。“用水”可表达此处与格所指的媒介或要素，同时“施洗”是福音书语境中中性、通行的译法。
- source_word: ἔρχεται δὲ ὁ ἰσχυρότερός μου
  choice: 但有一位比我更有能力的要来
  rationale: 明确保留比较意义和将临的动态。“更有能力”比单说“更强”更适合描述人物的权能，又不额外指定其性质。
- source_word: οὗ οὐκ εἰμὶ ἱκανὸς λῦσαι τὸν ἱμάντα τῶν ὑποδημάτων αὐτοῦ
  choice: 我连给他解鞋带也不配
  rationale: ἱκανός 在这一自谦表达中译为“不配”最合汉语习惯；“连……也”传达即便做解鞋带这种卑微工作都不配的语势。
- source_word: αὐτὸς ὑμᾶς βαπτίσει
  choice: 他要……给你们施洗
  rationale: 以主语“他”承接并突出那位将来者，与约翰形成对照；“要”自然表达未来指向。
- source_word: ἐν πνεύματι ἁγίῳ καὶ πυρί
  choice: 在圣灵与火中
  rationale: 以“在……中”保留 ἐν 可能涉及范围、要素或媒介的开放性；“圣灵与火”不增添解释，也不预先判定两者的具体关系。
theological_decisions:
- issue: “在圣灵与火中施洗”的含义
  choice: 正文保留“在圣灵与火中”，不解释火是洁净、审判，还是同一施洗图像中的一个层面。
  alternative: 译成“以圣灵和火施洗”，或在正文中将火明确解释为洁净之火或审判之火。
  rationale: 原文表达简洁，ἐν 的语义作用及“火”的具体所指存在真实的诠释空间；直译其意象可避免消解神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“施洗”保持圣经叙事中的通行用语；句式简洁，以“但”和“连……也……”清楚呈现对比与约翰的自谦。
