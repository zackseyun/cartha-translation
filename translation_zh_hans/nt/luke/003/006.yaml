  text: and all flesh will see the salvation of God[a][b].
translation:
  language: zh_hans
  text: 凡有血肉的，都要看见上帝的救恩[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“所有人”。希腊原文直译为“凡有血肉的”，呼应《以赛亚书》40:5；这里指全体人类。
    reason: lexical_alternative
  - marker: b
    text: 或译“来自上帝的救恩”。
    reason: alternative_reading
lexical_decisions:
- source_word: ὄψεται
  choice: 要看见
  rationale: 这是ὁράω的将来时形式，此处表达直接的将来意义。“要看见”自然、清楚，并保留原文具体的视觉意象。
- source_word: πᾶσα σὰρξ
  choice: 凡有血肉的
  rationale: 该表达是带有闪族语言色彩的先知性用语，呼应《以赛亚书》40:5，指全体人类。译作“凡有血肉的”既保留“血肉”的经文意象和互文联系，又比生硬的“所有肉体”更符合现代汉语。
- source_word: σωτήριον
  choice: 救恩
  rationale: σωτήριον在此带冠词并作名词使用。“救恩”是简明而通行的对应词，既承接以赛亚背景，也保留上帝拯救作为的宽广含义。
- source_word: τοῦ θεοῦ
  choice: 上帝的
  rationale: 按属格结构直译为“上帝的”，保留其可表示归属或来源的开放性；“来自上帝的”则明确解释为来源，宜列作脚注中的另一种译法。
theological_decisions:
- issue: πᾶσα σὰρξ这一用语的范围
  choice: 理解为全体人类，同时在正文保留“血肉”的先知性意象。
  alternative: 直接意译为“所有人”或“全人类”；或按字面泛指一切有血肉的受造物。
  rationale: 在以赛亚引文的语境中，这一短语指向普世的人类范围。正文保留“血肉”可维持原文的经文呼应，而脚注说明其所指，避免现代读者误解。
- issue: τοῦ θεοῦ所表达的关系
  choice: 正文译作“上帝的救恩”，不限定为归属还是来源。
  alternative: 译作“来自上帝的救恩”，明确理解为来源。
  rationale: 希腊语属格本身容许这种语义张力；形式较贴近的正文译法避免过早消除歧义。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“凡有血肉的”保留先知性经文的语感，同时避免“所有肉体”在现代汉语中的生硬或误导；句式简洁，适合公开诵读。
