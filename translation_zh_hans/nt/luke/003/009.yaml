id: LUK.3.9
reference: Luke 3:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἤδη δὲ καὶ ἡ ἀξίνη πρὸς τὴν ῥίζαν τῶν δένδρων κεῖται· πᾶν οὖν δένδρον μὴ ποιοῦν καρπὸν καλὸν ἐκκόπτεται καὶ εἰς πῦρ βάλλεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/009.yaml
  text: And already the ax is laid at the root of the trees[c][b][a]. Therefore every tree not producing good fruit is cut down and thrown into the fire.
translation:
  language: zh_hans
  text: 斧头已经放在树根旁了。因此，凡不结好果子的树，都要被砍倒，扔进火里。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤδη δὲ καὶ
  choice: 已经
  rationale: 保留ἤδη所表达的迫近性；δὲ καὶ在上下文中主要承接并加强警告，汉语无需逐词另译，以免累赘。
- source_word: ἡ ἀξίνη
  choice: 斧头
  rationale: 准确呈现砍树工具及审判比喻，符合现代普通话习惯。
- source_word: πρὸς τὴν ῥίζαν τῶν δένδρων κεῖται
  choice: 放在树根上了
  rationale: κεῖται本义为“放着、位于”；结合斧头的意象，译作“放在……上了”自然地传达工具已经就位、行动迫近，同时不把尚未发生的砍伐写成已经完成。
- source_word: πᾶν οὖν δένδρον
  choice: 因此，凡……的树，都
  rationale: “因此”保留οὖν的推论关系；“凡……都”自然表达πᾶν的全称范围。
- source_word: μὴ ποιοῦν καρπὸν καλὸν
  choice: 不结好果子
  rationale: 汉语通常说树“结果子”；“好果子”保留καλόν的道德与品质含义以及原文比喻。
- source_word: ἐκκόπτεται
  choice: 要被砍下来
  rationale: 被动形式对应原文，并以“要”在汉语中传达格言式现在时所含的确定、迫近结果；“砍下来”适合树木语境。
- source_word: εἰς πῦρ βάλλεται
  choice: 扔进火里
  rationale: 清楚保留被动处置及方向性；现代汉语自然有力，不额外界定“火”的神学所指。
theological_decisions:
- issue: 审判比喻中“火”的所指
  choice: 保留斧头、树与火的农业比喻，不把“火”进一步解释为某一种特定审判
  alternative: 明确译作地狱之火，或限定为对以色列的历史性审判
  rationale: 原文清楚表达迫近且严厉的审判，却没有在本节内限定火所指的是现世审判、末世审判或二者兼有；直译比喻可保存其神学张力。
- issue: 现在时被动语态的时间力度
  choice: 译为“都要被砍下来，扔进火里”
  alternative: 译为“都被砍下来，扔进火里”
  rationale: 原文现在时可把必然发生的处置描绘得鲜明直接；现代汉语加入“要”既保留迫近与确定性，也避免误解为所有砍伐已经完成。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。句式简洁有警告力度；保留原文的被动结构和农业审判意象，不加入解释性神学术语。
