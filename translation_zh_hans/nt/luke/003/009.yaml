  naturalness: 行文简洁、庄重自然。“树根旁”比“树根上”更符合普通话中物体位置的通常表达；“砍倒”也比“砍下来”更明确对应树木被砍伐的画面。
  terminology: “斧头”“好果子”“火”均恰当保留原文的农业和审判比喻，未对“火”的所指作超出经文的神学限定。
