id: LUK.3.15
reference: Luke 3:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Προσδοκῶντος δὲ τοῦ λαοῦ καὶ διαλογιζομένων πάντων ἐν ταῖς καρδίαις αὐτῶν περὶ τοῦ Ἰωάννου, μήποτε αὐτὸς εἴη ὁ χριστός,
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/015.yaml
  text: As the people were waiting expectantly[a], and all were reasoning in their hearts about John, whether perhaps he might be the Messiah,
translation:
  language: zh_hans
  text: 百姓正满怀期待时，众人心里都在思量约翰会不会就是弥赛亚[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“基督”。希腊文：ho christos，意为“受膏者”。
    reason: 说明该称号的传统译法和原文含义。
lexical_decisions:
- source_word: Προσδοκῶντος
  choice: 正热切期待
  rationale: 该词在属格独立结构中交代背景，既有持续等候之意，也带着强烈的期待；“正热切期待”在现代汉语中自然地保留这两层意思。
- source_word: δὲ
  choice: 不单独译出
  rationale: 此处是轻微的叙事衔接词，并非强烈转折；汉语借句式推进即可自然体现，无须硬加“现在”或“但是”。
- source_word: τοῦ λαοῦ
  choice: 百姓
  rationale: λαός指作为整体的民众；“百姓”简洁自然，也符合路加叙事中的语域。
- source_word: διαλογιζομένων πάντων
  choice: 众人……都在思量
  rationale: διαλογίζομαι在这里表示内心斟酌、推想；“思量”比单纯的“想”更能传达审慎思索，πάντων则由“众人……都”明确表达。
- source_word: ἐν ταῖς καρδίαις αὐτῶν
  choice: 心里
  rationale: 保留圣经中“心”作为内在思想与判断所在的表达，同时符合自然现代汉语。
- source_word: περὶ τοῦ Ἰωάννου
  choice: 约翰
  rationale: 在“思量约翰，或许……”的汉语结构中，所思量的是约翰的身份；不另加“关于”可避免生硬而不损失原意。
- source_word: μήποτε αὐτὸς εἴη
  choice: 或许他就是
  rationale: μήποτε与愿望式εἴη共同表达不确定的可能性。“或许”保留试探性，“就是”则自然呈现他们所猜测的身份判断。
- source_word: ὁ χριστός
  choice: 弥赛亚
  rationale: 此处Χριστός明确是百姓期待中的受膏者称号；“弥赛亚”能直接呈现其犹太背景与称号性质。
theological_decisions:
- issue: Χριστός作为称号的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 上下文讨论约翰是否就是百姓所期待的受膏者，称号意义突出，因此采用“弥赛亚”；脚注保留传统译称“基督”，不把两者误作不同身份。
- issue: 百姓猜测的确定程度
  choice: 或许他就是
  alternative: 他是不是
  rationale: 原文μήποτε与愿望式εἴη保留试探和可能性。“或许他就是”既不把猜测说成断言，也不削弱他们实际考虑这种可能性的语气。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“百姓正热切期待的时候”交代持续背景，“众人心里都在思量”保留原文的内在 deliberation。句末使用句号，使本节作为中文经文可独立朗读；脚注标记紧随“弥赛亚”。
