    reason: 说明Καϊνάμ的不同中文译名，并确认正文依希腊文本保留该名字。
lexical_decisions:
- source_word: τοῦ
  choice: ……的儿子
  rationale: 在路加的家谱中，反复出现的属格冠词承接上文省略的家谱关系。补出“儿子”既表达希腊文在语境中的含义，也使现代汉语自然清楚。
- source_word: Μαθουσαλά
  choice: 玛土撒拉
  rationale: 采用现代中文圣经中这一旧约人物通行且易于辨认的译名。
- source_word: Ἑνώχ
