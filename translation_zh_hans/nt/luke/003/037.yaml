- source_word: Ἰάρετ
  choice: 雅列
  rationale: 采用中文圣经中对应人物的通行译名。
- source_word: Μαλελεήλ
  choice: 玛勒列
  rationale: 采用中文新约家谱中常见的译名，同时与旧约家谱人物保持可辨认的对应关系。
- source_word: Καϊνάμ
  choice: 该南
  rationale: 采用中文圣经中对应家谱人物的通行译名，不从希腊文正文删去此名；其他音译方式在脚注说明。
theological_decisions:
- issue: 路加家谱中反复属格结构的省略
  choice: 每个人名后补出“的儿子”
  alternative: 仅译为连续的“……的”结构
  rationale: 希腊文以属格冠词和人名承接前文家谱公式；补出“儿子”没有增加新的亲属判断，而是明确表达上下文已经隐含的关系。
- issue: Καϊνάμ在家谱中的处理
  choice: 正文保留并译作“该南”
  alternative: 音译作“凯南”，或为配合其他家谱形式而调整
  rationale: SBLGNT正文明确含有Καϊνάμ，因此正文应予保留；译名差异属于音译和传统称名问题，不应借此改动希腊文所列家谱。
translation_notes:
