  yaml_path: translation/nt/luke/003/020.yaml
  text: 'He added this also to them all: he locked John up in prison[a].'
translation:
  language: zh_hans
  text: 希律又在这一切恶事之外，加上了这一件：把约翰关进监牢。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较为字面的译法是：“他又在这一切之上加上了这件事。”意思是，希律在先前所行的一切恶事之外，又添了这一件。
    reason: 说明ἐπὶ πᾶσιν较字面的形式及其在语境中的累加含义。
lexical_decisions:
- source_word: προσέθηκεν
  choice: 加上一件
  rationale: 此处表示在先前所行之事上再添一项；“加上一件”自然表达累加意味，并与后面的具体行为衔接。
- source_word: τοῦτο
  choice: 一件
  rationale: 指向随后所述把约翰监禁之事；汉语用“一件”承接“加上”较自然，指示意义由后文明确。
- source_word: ἐπὶ πᾶσιν
  choice: 在这一切恶事之外
  rationale: 短语表达“在这一切之上、此外”的累加关系；结合19节所说希律所行的一切恶事，补出“恶事”可使本节在现代汉语中清楚自然。
- source_word: κατέκλεισεν
  choice: 关进了
  rationale: 保留“关闭、拘禁”的具体动作感，又避免与“监牢”重复表达“监禁”。
- source_word: Ἰωάννην
  choice: 约翰
  rationale: 采用现代中文圣经人名的通行译法。
- source_word: ἐν φυλακῇ
  choice: 监牢
  rationale: 此处指拘禁之处；“关进监牢”是自然、明确而庄重的现代汉语。
theological_decisions:
- issue: ἐπὶ πᾶσιν的所指与作用
  choice: 理解为希律在此前一切恶事之外，又加上监禁约翰这一件。
  alternative: 较为字面的表达可作“又在这一切之上加上这件事”，不在正文中明确补出“恶事”。
  rationale: 紧接上文19节“一切恶事”，累加含义清楚。正文补出语境中已有的“恶事”，没有加入新的神学判断；脚注保留较字面的形式。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“监牢”比“牢里”更正式，“关进”则保留原文动作的具体感。脚注标记[a]已置于正文相应位置。
