  text: the son of Jeshua, the son of Eliezer, the son of Jorim, the son of Matthat, the son of Levi,
translation:
  language: zh_hans
  text: 耶书亚的儿子，以利以谢的儿子，约令的儿子，玛塔的儿子，利未的儿子，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰησοῦ
  choice: 耶书亚
  rationale: 此处是家谱中的人名；采用可与“耶稣”区分、又能反映同一希伯来名字背景的常见音译。
- source_word: Ἐλιέζερ
  choice: 以利以谢
  rationale: 采用现代中文圣经传统中对该名字的通行译法。
- source_word: Ἰωρίμ
  choice: 约令
  rationale: 按希腊文人名音译，并采用自然简洁的中文形式。
- source_word: Μαθθάτ
  choice: 玛塔
  rationale: 按希腊文音译，避免与其他相近名字无根据地合并。
- source_word: Λευί
  choice: 利未
  rationale: 采用中文圣经中稳定通行的人名译法。
- source_word: τοῦ
  choice: 的儿子
  rationale: 希腊文家谱以连续属格表达世系关系；中文明确补出“儿子”，使谱系结构自然清楚。
theological_decisions:
- issue: Ἰησοῦ在人名译法上与“耶稣”的关系
  choice: 耶书亚
  alternative: 耶稣／约书亚
  rationale: 此处并非指拿撒勒人耶稣；使用“耶书亚”既保留该希腊名字与耶稣同形的事实，也避免读者误认其身份。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语，延续家谱的重复句式和未完标点，以便与相邻经文连读。
