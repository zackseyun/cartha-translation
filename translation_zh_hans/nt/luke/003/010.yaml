  text: And the crowds were asking him[a], saying, “What then should we do?”
translation:
  language: zh_hans
  text: 众人不断问他：“那么，我们该做什么呢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπηρώτων
  choice: 不断问
  rationale: 未完成时表示持续或反复发生的询问；“不断问”在现代汉语中自然地体现这一体貌。
- source_word: οἱ ὄχλοι
  choice: 众人
  rationale: 该复数名词指聚集的人群；“众人”简洁自然，且适合当前叙事语境。
- source_word: λέγοντες
  choice: 以直接引语表达，未另译“说”
  rationale: 该分词用于引出问题内容；汉语在“问”后直接接引语更自然，无须重复译成“问他说”。
- source_word: Τί οὖν
  choice: 那么……什么
  rationale: “那么”保留οὖν承接施洗约翰前述劝告并引出推论的作用。
- source_word: ποιήσωμεν
  choice: 我们该做什么
  rationale: 这里的不定过去时虚拟语气用于商议性问句；“该做什么”准确表达众人询问实际应如何回应。
theological_decisions: []
