  text: the son of Simeon[a], the son of Judah, the son of Joseph, the son of Jonam, the son of Eliakim[b],
translation:
  language: zh_hans
  text: 是西缅的儿子，是犹大的儿子，是约瑟的儿子，是约南的儿子[b]，是以利亚敬的儿子，
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 有些抄本或翻译传统将此名作 Jonan（可音译为“约楠”），而非 Jonam（“约南”）。
    reason: textual_variant
lexical_decisions:
- source_word: τοῦ
  choice: ……的儿子
  rationale: 本节延续上下文的家谱句式；希腊文反复使用属格冠词并省略亲属关系。汉语若只译作“……的”会含混，因此补出“儿子”，准确表达隐含的世系关系。
- source_word: Συμεὼν
  choice: 西缅
  rationale: 采用现代中文圣经传统中通行且易辨认的译名。
- source_word: Ἰούδα
  choice: 犹大
  rationale: 该希腊名字既可对应“犹大”，也可译为“犹大斯/犹大（Judas）”；在犹太家谱语境中，“犹大”最自然，也不会引起与加略人犹大的无关联想。
- source_word: Ἰωσὴφ
  choice: 约瑟
  rationale: 采用该人名在现代中文中的通行形式。
- source_word: Ἰωνὰμ
  choice: 约南
  rationale: 按SBLGNT的Ἰωνάμ音译；中文译名传统通常作“约南”。有些抄本或翻译传统反映“约楠”等不同形式，故以脚注说明。
- source_word: Ἐλιακὶμ
  choice: 以利亚敬
  rationale: 采用这一闪族人名在现代中文中的通行译法，清楚且易于辨认。
