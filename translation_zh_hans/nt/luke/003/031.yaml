lexical_decisions:
- source_word: τοῦ
  choice: ……的儿子
  rationale: 这里反复出现的属格冠词承接本段家谱的整体句式，省略表达父子关系。中文补出“的儿子”，既清楚自然，也没有增添上下文之外的信息。
- source_word: Μελεὰ
  choice: 米利亚
  rationale: 按希腊语人名 Μελεά 音译，并采用现代中文圣经读者易于辨认的形式。
- source_word: Μεννὰ
  choice: 门拿
  rationale: 按本节 SBLGNT 所载 Μεννά 直接音译，以区别于其他文本或译本所反映的不同姓名形式。
- source_word: Ματταθὰ
  choice: 玛他他
  rationale: 依希腊语 Ματταθά 音译，保留原名的音节结构。
- source_word: Ναθὰμ
  choice: 拿单
  rationale: 采用该旧约人物在现代中文圣经中的通行译名，使读者能辨认这是大卫的儿子拿单。
- source_word: Δαυὶδ
  choice: 大卫
  rationale: 采用此圣经人物在现代标准汉语中的固定通行译名。
theological_decisions:
- issue: 家谱中的省略结构
  choice: 每个人名后补出“的儿子”
  alternative: 直译为“属米利亚、属门拿、属玛他他、属拿单、属大卫”
  rationale: 希腊文是一连串由上下文支配的属格结构；补出父子关系能在中文中准确传达家谱含义，同时不把这种关系扩展为更宽泛的“后裔”。
translation_notes:
