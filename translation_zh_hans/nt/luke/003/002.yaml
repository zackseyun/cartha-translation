base_translation:
  language: en
  yaml_path: translation/nt/luke/003/002.yaml
  text: during the high priesthood of Annas and Caiaphas[a], the word of God came to John, the son of Zechariah, in the wilderness.
translation:
  language: zh_hans
  text: 在亚那和该亚法担任大祭司的时期[a]，上帝的话在旷野临到撒迦利亚的儿子约翰。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或更直译为：“在亚那和该亚法的大祭司任期内。”原文此处“大祭司”为单数，但路加同时提到亚那和该亚法。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπὶ ἀρχιερέως Ἅννα καὶ Καϊάφα
  choice: 在亚那和该亚法任大祭司期间
  rationale: ἐπί加属格在这里表示时间背景。译作“在……期间”自然地呈现路加的年代框架；“任大祭司”保持ἀρχιερέως的单数表达，同时保留经文将亚那和该亚法并列所形成的张力。
- source_word: ἐγένετο ῥῆμα θεοῦ
  choice: 上帝的话临到
  rationale: 这是先知蒙受启示的传统表达。“临到”既传达ἐγένετο的事件性，也以现代中文可理解的庄重措辞保留这一圣经惯用语。
- source_word: ἐπὶ Ἰωάννην
  choice: 临到……约翰
  rationale: ἐπί加宾格在这里表示话语来到某人；中文“临到”可自然地与前面的启示公式结合。
- source_word: τὸν Ζαχαρίου υἱὸν
  choice: 撒迦利亚之子约翰
  rationale: 该同位语说明约翰的身份。“……之子”简洁庄重，并保留路加叙事的正式语体。
- source_word: ἐν τῇ ἐρήμῳ
  choice: 旷野中的
  rationale: ἔρημος指人烟稀少的荒野地区，不一定是沙漠。“旷野”在此既准确，也符合约翰事工的地理语境。
theological_decisions:
- issue: 如何表达亚那、该亚法二人与单数ἀρχιερέως之间的关系
  choice: 译作“在亚那和该亚法任大祭司期间”，并加注说明原文为单数
  alternative: “亚那和该亚法作大祭司的时候”或将二人明确称为两位大祭司
  rationale: 希腊文以单数“大祭司”并列两个人名。正文保持自然中文，脚注则明确其单数形式，保留历史与文学上的张力，不以译文替经文作调和。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“上帝的话临到”保留先知启示公式；调整语序为“临到旷野中的……约翰”，使“在旷野中”自然修饰约翰当时所在之处，同时不排除其与启示事件地点的关联。
