  text: the son of Jacob[a], the son of Isaac, the son of Abraham, the son of Terah[c][b], the son of Nahor
translation:
  language: zh_hans
  text: 雅各的儿子；雅各是以撒的儿子；以撒是亚伯拉罕的儿子；亚伯拉罕是他拉的儿子；他拉是拿鹤的儿子。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦ
  choice: ……的儿子
  rationale: 本节各人名之前反复出现属格冠词，承接整段家谱中省略而可知的父子关系。现代汉语若只译作“……的”会显得残缺，因此补出“儿子”，以清楚表达家谱链条。
- source_word: Ἰακὼβ
  choice: 雅各
  rationale: 采用现代中文圣经和旧约传统中通行的族长姓名形式。
- source_word: Ἰσαὰκ
  choice: 以撒
  rationale: 采用现代中文圣经和旧约传统中通行的族长姓名形式。
- source_word: Ἀβραὰμ
  choice: 亚伯拉罕
  rationale: 采用现代中文圣经和旧约传统中通行的族长姓名形式。
- source_word: Θάρα
  choice: 他拉
  rationale: 希腊文形式为 Θάρα；译作“他拉”，与旧约中同一人物的通行中文姓名一致，便于读者辨认。
- source_word: Ναχὼρ
  choice: 拿鹤
  rationale: 希腊文形式为 Ναχώρ；译作“拿鹤”，与旧约中同一人物的通行中文姓名一致，便于读者辨认。
theological_decisions:
- issue: 在省略表达的家谱中补明父子关系
  choice: 每一属格人名均译为“……的儿子”
  alternative: 仅以“……的”串联各姓名
  rationale: 希腊文依靠上下文和反复的属格结构表达世系，父子关系虽未逐项写出对应名词，却由家谱句式明确蕴含。补出“儿子”是为符合现代汉语表达，并未增加新的神学主张。
translation_notes:
  register: 采用自然、庄重而清楚的现代标准汉语。人名依中文旧约通行形式；保留原文逐级串联的家谱节奏，不另加解释性脚注。
