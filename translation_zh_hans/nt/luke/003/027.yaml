lexical_decisions:
- source_word: τοῦ
  choice: 是……的儿子
  rationale: 本节各名字前反复使用属格冠词，承接路加福音3:23已确立的家谱句式，省略了“儿子”。译文补出这一关系，并用连锁分句清楚呈现各代关系。
- source_word: Ἰωανὰν
  choice: 约亚拿
  rationale: 按现代中文圣经中通行的音译处理该人名。
- source_word: Ῥησὰ
  choice: 利撒
  rationale: 采用中文圣经中较通行、易于辨认的音译。
- source_word: Ζοροβαβὲλ
  choice: 所罗巴伯
  rationale: 采用这位旧约人物在中文圣经中的传统名称，以保持跨经卷辨识度。
- source_word: Σαλαθιὴλ
  choice: 撒拉铁
  rationale: 采用中文圣经通行名称；脚注说明希腊文形式及其与旧约名称的传统对应。
- source_word: Νηρὶ
  choice: 尼利
  rationale: 按希腊文人名作简明、通行的中文音译。
theological_decisions:
- issue: 家谱中的省略结构
  choice: 依上下文为每一属格人名补出“是……的儿子”
  alternative: 逐项直译为“……的”，不补明亲子关系
  rationale: 希腊文仅连续使用属格形式，但路加福音3:23已经确立“儿子”的家谱框架。补出“儿子”是在中文中表达原文隐含句法，并非增加新的神学判断。
- issue: 本节开头的隐含主语
  choice: 以“是约亚拿的儿子”承接上一节，不在正文中补入上一节末尾的人名
  alternative: 补写“犹大是约亚拿的儿子”
  rationale: 原文在本节只列出约亚拿及其后的名字；开头关系的主语由上文提供。这样既保持分节范围，又让中文可自然承接上节。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。以分号呈现家谱链条，避免连续使用“……的……”造成关系含混；人名优先采用中文圣经读者熟悉的传统形式。
