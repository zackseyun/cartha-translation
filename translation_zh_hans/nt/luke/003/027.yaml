  text: the son of Joanan[a], the son of Rhesa, the son of Zerubbabel, the son of Shealtiel, the son of Neri[b],
translation:
  language: zh_hans
  text: 是约拿南的儿子[a]；约拿南是利撒的儿子；利撒是所罗巴伯的儿子；所罗巴伯是撒拉铁[b]的儿子；撒拉铁是尼利的儿子。
  philosophy: optimal-equivalence
  footnotes:
