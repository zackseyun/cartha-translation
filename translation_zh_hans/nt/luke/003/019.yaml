  text: ὁ δὲ Ἡρῴδης ὁ τετραάρχης, ἐλεγχόμενος ὑπ’ αὐτοῦ περὶ Ἡρῳδιάδος τῆς γυναικὸς τοῦ ἀδελφοῦ αὐτοῦ καὶ περὶ πάντων ὧν ἐποίησεν πονηρῶν ὁ Ἡρῴδης,
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/019.yaml
  text: But Herod the tetrarch[a], being rebuked by him concerning Herodias, his brother’s wife, and concerning all the evil things Herod had done,
translation:
  language: zh_hans
  text: 但分封王希律因希罗底——他兄弟的妻子——以及希律所做的一切恶事，受到约翰的责备[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “责备”也可译作“责斥”或“揭露过错”。希腊词既可指道德上的责备，也可指揭发、指出人的错误行为。
    reason: lexical_alternative
lexical_decisions:
- source_word: τετραάρχης
  choice: 分封王
  rationale: 这是该历史政治头衔在中文圣经语境中通行且简明的译法，比笼统的“统治者”更准确。
- source_word: ἐλεγχόμενος
  choice: 受到……的责备
  rationale: 保留分词所表达的伴随状态，并传达对不当行为的道德指责；希腊词也可含揭露、指出过错之意，故加脚注说明。
- source_word: ὑπ’ αὐτοῦ
  choice: 受到约翰的
  rationale: 希腊原文用代词“他”，其所指由上文明确为约翰；中文若直译“受到他的责备”容易产生指代歧义，因此明示所指。
- source_word: περὶ Ἡρῳδιάδος τῆς γυναικὸς τοῦ ἀδελφοῦ αὐτοῦ
  choice: 因希罗底——他兄弟的妻子——
  rationale: περί在受责备的语境中自然译作“因”；同位说明保留希罗底与希律兄弟的婚姻关系，而破折号使较长句子清晰。
- source_word: καὶ περὶ πάντων ὧν ἐποίησεν πονηρῶν
  choice: 以及他自己所做的一切恶事
  rationale: 自然传达第二个περί短语及πάντων的总括范围；“他自己”对应句末再次出现的ὁ Ἡρῴδης，突出施行这些恶事的是希律。
- source_word: δὲ
  choice: 但
  rationale: 标示与前文叙述的转折，并自然引出希律对约翰事工的负面回应。
theological_decisions:
- issue: 约翰指责希律行为的道德力度
  choice: 译作“责备”，保留先知性道德谴责的力度
  alternative: 可译作“责斥”“指出过错”或“揭露”
  rationale: ἐλέγχω在此不仅是中性的质询，也涉及指出并谴责错误；“责备”清楚而不过度扩展为司法定罪或特定教义判断。
- issue: 希罗底的身份表述
  choice: 直译为“他兄弟的妻子”
  alternative: 根据其他经文补明具体兄弟姓名或解释婚姻是否合法
  rationale: 本节只陈述亲属及婚姻关系，不在正文中加入来自平行经文的姓名或额外法律解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“分封王”保留历史职衔；调整希腊语长句语序，将施事“约翰”明确化以避免中文代词歧义，并用破折号标示同位说明。
