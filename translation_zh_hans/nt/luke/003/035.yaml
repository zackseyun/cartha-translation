  text: the son of Serug[a], the son of Reu, the son of Peleg, the son of Eber, the son of Shelah[b],
translation:
  language: zh_hans
  text: 是西鹿[a]的儿子；西鹿是拉吴的儿子，拉吴是法勒的儿子，法勒是希伯的儿子，希伯是沙拉[b]的儿子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文逐字为“西鹿的、拉吴的、法勒的、希伯的、沙拉的”。原文以一连串属格形式表达家谱关系，并省略“儿子”；译文根据上下文补出。
    reason: lexical_alternative
  - marker: b
    text: 西鹿、拉吴、法勒、希伯、沙拉采用这些人物在中文旧约中的通行译名，参《创世记》11章。
    reason: cross_reference
lexical_decisions:
- source_word: τοῦ（重复出现）
  choice: 是……的儿子
  rationale: 本节以重复的属格冠词加人名延续上下文中的家谱关系；希腊文省略了“儿子”，中文为清楚自然而补出。首句的主语承接上一节。
- source_word: Σεροὺχ
  choice: 西鹿
  rationale: 采用现代中文圣经中较通行的旧约人物译名，使本处家谱与《创世记》11章的同一人物易于对应。
- source_word: Ῥαγαὺ
  choice: 拉吴
  rationale: 采用该旧约族长在中文圣经中的通行译名，而非按希腊语字形另作音译。
- source_word: Φάλεκ
  choice: 法勒
  rationale: 采用《创世记》家谱中通行的中文译名，以保持跨卷辨识度。
- source_word: Ἔβερ
  choice: 希伯
  rationale: 采用该族长在中文旧约中的通行译名。
- source_word: Σαλὰ
  choice: 沙拉
  rationale: 采用中文圣经中该家谱人物的通行译名，以对应《创世记》中的同一人物。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的家谱表述。为避免中文中连续使用“……的儿子”造成关系指向不清，逐项补出前一代姓名作主语；首句主语则按原文承接上一节，不擅自加入上一节的人名。
