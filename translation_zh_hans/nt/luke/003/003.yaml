  text: καὶ ἦλθεν εἰς ⸀πᾶσαν περίχωρον τοῦ Ἰορδάνου κηρύσσων βάπτισμα μετανοίας εἰς ἄφεσιν ἁμαρτιῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/003.yaml
  text: And he came into all the surrounding region of the Jordan[a], proclaiming a baptism of repentance for the forgiveness of sins[b],
translation:
  language: zh_hans
  text: 他来到约旦河周围的整个地区[a]，宣讲悔改的洗礼，为罪得赦免[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“走遍约旦河周围一带。”
    reason: 原文直指来到或进入约旦河周围的整个地区；按叙事语境，也可理解为在该地区巡行、传道。
  - marker: b
    text: 或译：“为要使罪得赦免。”
    reason: εἰς可表达目的或所指向的结果；正文避免界定洗礼、悔改与赦免之间的具体机制。
lexical_decisions:
- source_word: ἦλθεν εἰς ⸀πᾶσαν περίχωρον τοῦ Ἰορδάνου
  choice: 走遍约旦河周围一带
  rationale: ἦλθεν配合εἰς及整个地区的范围，在汉语叙事中译作“走遍”自然地表达进入并巡行该地区；“周围一带”对应περίχωρον，“遍”体现πᾶσαν。
- source_word: κηρύσσων
  choice: 宣讲
  rationale: κηρύσσω指公开传扬、宣告；“宣讲”兼顾公开宣告的力度和现代汉语的可读性。
- source_word: βάπτισμα
  choice: 洗礼
  rationale: 此处指宗教性的施洗，采用现代汉语基督教语境中清楚而通行的“洗礼”。
- source_word: μετανοίας
  choice: 悔改的
  rationale: 以定中结构直译属格，保留洗礼与悔改之间的紧密关系，不进一步界定其逻辑性质。
- source_word: εἰς ἄφεσιν ἁμαρτιῶν
  choice: 使罪得赦免
  rationale: ἄφεσις在此为罪的赦免；“使……得”自然表达εἰς所指向的结果或目的，同时不额外规定洗礼、悔改与赦免之间的机制。
theological_decisions:
- issue: 洗礼、悔改与罪得赦免之间的关系
  choice: “悔改的洗礼，使罪得赦免”
  alternative: “表明悔改、从而使罪得赦免的洗礼”或“借着洗礼表达悔改，以得赦免”
  rationale: 原文βάπτισμα μετανοίας εἰς ἄφεσιν ἁμαρτιῶν将三者紧密相连，却未明确说明洗礼是工具、记号还是宣告。译文保持这种张力，不把后来的圣礼观争论写进经文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“走遍……一带”符合汉语地理行程表达；“宣讲”“悔改”“洗礼”“赦免”保留经文的宗教语域，但避免古奥措辞。
