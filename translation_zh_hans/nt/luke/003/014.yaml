  source_fidelity: 译文准确传达了原文的主要内容与命令语气。“也有当兵的”对应καὶ στρατευόμενοι，体现另一群人也来询问；“那我们该做什么呢？”自然表达商议性问句及καὶ ἡμεῖς的“我们也”之意。“勒索”“诬告人”和“以自己的军饷为足”分别妥当对应διασείσητε、συκοφαντήσητε和ἀρκεῖσθε τοῖς ὀψωνίοις ὑμῶν，未添加经文未明说的动机或神学结论。
