source:
  edition: SBLGNT
  text: ἐπηρώτων δὲ αὐτὸν καὶ στρατευόμενοι λέγοντες· ⸂Τί ποιήσωμεν καὶ ἡμεῖς⸃; καὶ εἶπεν ⸀αὐτοῖς· Μηδένα διασείσητε μηδὲ συκοφαντήσητε, καὶ ἀρκεῖσθε τοῖς ὀψωνίοις ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/014.yaml
  text: And soldiers also were asking him[a], saying, “What should we also do?” And he said to them, “Do not extort money from anyone, nor accuse anyone falsely[c][b], and be content with your wages.”
translation:
  language: zh_hans
  text: 也有当兵的问他：“那我们该做什么呢？”他对他们说：“不要勒索任何人，也不要诬告人，要以自己的军饷为足。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στρατευόμενοι
  choice: 当兵的
  rationale: 该现在分词指正在服兵役的人。译作“当兵的”自然、明确，也保留其参与军事服役的状态。
- source_word: Τί ποιήσωμεν καὶ ἡμεῖς
  choice: 那我们该做什么呢？
  rationale: “该做什么”传达商议性虚拟语气；“那……呢”结合明确的“我们”，自然表达 καὶ ἡμεῖς 所强调的“我们也一样来问”。
- source_word: διασείσητε
  choice: 勒索
  rationale: 该词本有猛烈摇撼、威吓之意，在此指凭借武力或权势胁迫取利。“勒索”准确而简洁，不额外限定所索取的一定只是金钱。
- source_word: συκοφαντήσητε
  choice: 诬告
  rationale: 此处指以虚假指控加害或谋利。“诬告”保留法律和社会层面的含义；“敲诈”虽可能涉及利益动机，却会与前一动词过度重叠。
- source_word: ἀρκεῖσθε
  choice: 要以……为足
  rationale: 该现在时命令式要求持续知足。“以……为足”兼具现代可懂性和庄重感。
- source_word: ὀψωνίοις
  choice: 军饷
  rationale: 该词可指军人的给养或薪酬；在此军事语境中，“军饷”最简洁地体现其特指，同时不把含义缩窄为口粮。
theological_decisions:
- issue: 对服兵役者的伦理教导
  choice: 按经文本身，约翰禁止他们滥用权力、诬告和贪求，并未在本节命令他们退出军旅。
  alternative: 把本节译成或解释成对军事服役本身的谴责。
  rationale: 原文直接称他们为正在服役的人，并针对其行为发出命令。译文不扩大为有关军事职业本身的教义结论。
translation_notes:
  register: 采用现代标准普通话，简洁而庄重。“当兵的”较“士兵们”更贴近希腊语分词所表达的服役身份；“军饷”明确军事语境。经文没有必须以脚注保存的实质性歧义，因此不设脚注。
