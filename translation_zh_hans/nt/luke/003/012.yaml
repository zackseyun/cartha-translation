id: LUK.3.12
reference: Luke 3:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἦλθον δὲ καὶ τελῶναι βαπτισθῆναι καὶ εἶπαν πρὸς αὐτόν· Διδάσκαλε, τί ⸀ποιήσωμεν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/012.yaml
  text: Even tax collectors came to be baptized[a], and they said to him, “Teacher, what should we do?”
translation:
  language: zh_hans
  text: 连税吏也来受洗[a]。他们对他说：“老师，我们该做什么？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“税吏也来受洗。”
    reason: “连……也”与单纯的“也”分别体现对καί强调程度的不同理解。
lexical_decisions:
- source_word: ἦλθον
  choice: 来
  rationale: 不定过去时直陈语气在这里自然表达一次已发生的行动；中文叙事用“来”即可。
- source_word: δὲ καὶ τελῶναι
  choice: 连税吏也
  rationale: δέ推进叙事，καί带有附加或强调作用；“连……也”自然保留税吏也在来者之列的强调意味。
- source_word: βαπτισθῆναι
  choice: 来受洗
  rationale: 不定过去时被动不定式表示他们前来的目的；“受洗”保留被动意义。
- source_word: εἶπαν πρὸς αὐτόν
  choice: 他们对他说
  rationale: 贴近λέγω与πρός加宾格的表达，不因随后是问句而将动词改译为“问”。
- source_word: Διδάσκαλε
  choice: 老师
  rationale: 这是对διδάσκαλος自然、通行的现代汉语称呼，突出教导者身份而不额外引入其他头衔。
- source_word: τί ποιήσωμεν
  choice: 我们该做什么？
  rationale: 商议性不定过去时虚拟语气是在询问合宜的实际行动；“该做什么”准确传达其伦理和实践意味。
theological_decisions:
- issue: 约翰悔改呼召中受社会鄙视群体的参与
  choice: 译作“连税吏也”，保留强调性的包容意味。
  alternative: “税吏也来受洗”
  rationale: 经文突出税吏这一在当时常被视为道德可疑的群体也回应约翰的信息；译文保留这种修辞强调，但不加入经文本身未明说的评价。
translation_notes:
  register: 采用现代、庄重而口语自然的普通话。“税吏”是中文圣经语境中准确且易懂的历史称谓；以“老师”对应直接称呼，避免较古雅的“夫子”。
