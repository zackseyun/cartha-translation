  text: εἱστήκεισαν δὲ πάντες οἱ γνωστοὶ ⸀αὐτῷ ⸀μακρόθεν, καὶ γυναῖκες αἱ ⸀συνακολουθοῦσαι αὐτῷ ἀπὸ τῆς Γαλιλαίας, ὁρῶσαι ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/049.yaml
  text: But all those who knew him[a], and the women who had followed him from Galilee, were standing at a distance, watching these things.
translation:
  language: zh_hans
  text: 但所有认识他的人[a]，还有那些从加利利一路跟随他的妇女，都远远地站着，看着这些事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他所有的熟人。”希腊语γνωστοί可指某人所认识的人，即熟人或相识者。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἱστήκεισαν
  choice: 站着
  rationale: 该形式在此描绘持续的站立状态；与“都远远地”结合，现代汉语“站着”自然保留场景中的延续性。
- source_word: δὲ
  choice: 但
  rationale: δέ在此表示温和的转折或场景转换；“但”承接前文，并将视线转向远处观看的人。
- source_word: πάντες οἱ γνωστοὶ αὐτῷ
  choice: 所有认识他的人
  rationale: γνωστοί可指某人所认识的人、熟人或相识者。“所有认识他的人”既通顺，也不把范围过度限定为亲密朋友。
- source_word: μακρόθεν
  choice: 远远地
  rationale: 该副词表示空间上的距离；“远远地站着”是自然、清楚的现代汉语表达。
- source_word: γυναῖκες
  choice: 那些……妇女
  rationale: 定冠词连同后置分词修饰语指向叙事中一个特定群体；“那些”体现其特指性。
- source_word: συνακολουθοῦσαι αὐτῷ
  choice: 一路跟随他的
  rationale: συνακολουθέω含有随行、同行跟随之意；“一路跟随”自然表达她们从加利利开始持续随行的关系，同时不额外暗示门徒身份。
- source_word: ἀπὸ τῆς Γαλιλαίας
  choice: 从加利利
  rationale: 直接表达随行的起点或来源地。
- source_word: ὁρῶσαι ταῦτα
  choice: 看着这些事
  rationale: 现在分词表达持续观看；“看着”保留进行中的观察，“这些事”明确保留ταῦτα的复数概括意味。
theological_decisions: []
