  text: So he questioned him at considerable length[a], but he answered him nothing.
translation:
  language: zh_hans
  text: 于是，希律再三详细地询问他[a]，但耶稣没有回答他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“用许多话询问他”。希腊文可指以许多话、较为详尽地询问；动词为未完成时，也可含持续或反复询问之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπηρώτα
  choice: 盘问
  rationale: 未完成时表示持续或反复的询问；“盘问”比一般的“问”更能体现此处连续追问的语境，持续性又由“许久”明确表达。
- source_word: δὲ
  choice: 于是／但
  rationale: 第一个 δέ 是轻微的叙事连接，译作“于是”使行文自然；第二个 δέ 突出希律不断询问与耶稣沉默之间的反差，译作“但”。
- source_word: ἐν λόγοις ἱκανοῖς
  choice: 许久
  rationale: 原短语直译近于“用许多话”，在此强调长时间、反复地言语询问；“盘问了他许久”以自然汉语传达这一整体意义，同时用脚注保留较贴近字面的可能表达。
- source_word: λόγοις
  choice: （在整体短语中译为）许久
  rationale: 这里的 λόγοις 指询问时所说的大量话语，而非孤立的“字词”；按整个短语的习惯意义处理更符合现代汉语。
- source_word: ἱκανοῖς
  choice: 许久
  rationale: ἱκανός 在此表达数量或程度相当多；与 λόγοις 合用时，译为“许久”自然地体现询问持续且繁多。
- source_word: αὐτὸς
  choice: 他
  rationale: 原文代词略带强调并形成主语对照；汉语借助“但”已能清楚呈现反差，无须生硬地译作“他自己”。
- source_word: οὐδὲν
  choice: 什么也不
  rationale: 与否定谓语结合，直接表达耶稣没有回答任何内容，是自然、准确的现代汉语。
- source_word: ἀπεκρίνατο
  choice: 回答
  rationale: 准确对应“回答、回应”，用语简明自然。
- source_word: αὐτῷ
  choice: （由语境隐含）
  rationale: 希律是明确的询问者，汉语说“他什么也不回答”已自然包含“没有回答希律”；若重复“他”，容易产生代词指向不清。
