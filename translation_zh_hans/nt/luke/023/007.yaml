  text: καὶ ἐπιγνοὺς ὅτι ἐκ τῆς ἐξουσίας Ἡρῴδου ἐστὶν ἀνέπεμψεν αὐτὸν πρὸς Ἡρῴδην, ὄντα καὶ αὐτὸν ἐν Ἱεροσολύμοις ἐν ταύταις ταῖς ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/007.yaml
  text: And when he learned that he was under Herod’s jurisdiction[a], he sent him to Herod, who himself was also in Jerusalem in those days.
translation:
  language: zh_hans
  text: 他得知耶稣是在希律管辖之下[a]，就把他送到希律那里；那时希律也在耶路撒冷。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在希律的权柄之下”。希腊文这一表达可指希律的治理范围，也可指他的行政或司法管辖权。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνοὺς
  choice: 得知
  rationale: 不定过去时分词表示先于主要动作发生的认知；“得知”自然地表达“了解、查明”之意。
- source_word: ἐκ τῆς ἐξουσίας Ἡρῴδου ἐστὶν
  choice: 是在希律的管辖之下
  rationale: 此处ἐξουσία指政治与司法层面的治理权限；结合ἐκ的习语用法，译为“在……的管辖之下”符合审讯语境，也保留“权柄/权限”的底层含义。
- source_word: ἀνέπεμψεν
  choice: 送到
  rationale: 该动词在司法语境中可含把人或案件转送给另一位长官之意；正文用自然的“送到”，不额外强化原文未明说的正式法律程序。
- source_word: πρὸς Ἡρῴδην
  choice: 到希律那里
  rationale: πρός加宾格表示朝向某人；“到希律那里”在现代汉语中自然清楚。
- source_word: ὄντα καὶ αὐτὸν
  choice: 希律也在
  rationale: 分词短语所指为希律，καὶ αὐτόν带有“他也”的强调；汉语以“希律也在”清楚保留这一重点。
- source_word: ἐν Ἱεροσολύμοις
  choice: 在耶路撒冷
  rationale: 采用该地名通行的现代中文译法。
- source_word: ἐν ταύταις ταῖς ἡμέραις
  choice: 当时
  rationale: 原意为“在这些日子里”；叙事汉语用“当时”简洁自然，仍准确指向所述那段时期。
theological_decisions:
- issue: ἐξουσία在希律相关语境中的政治、司法含义
  choice: 管辖
  alternative: 权下；权柄范围；辖区
  rationale: 本节叙述彼拉多根据耶稣所属地区，把他转送给希律；“管辖”最能表达行政和司法权限，同时避免把此处ἐξουσία误读为抽象或专指神学意义上的“权柄”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。为避免末尾连续使用多个“他”造成指代含混，第二句重提现名“希律”。正文保留脚注标记[a]，说明原文在治理辖区与法律权限之间的语义幅度。
