  text: 彼拉多听见这话，就问那人是否是加利利人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πιλᾶτος
  choice: 彼拉多
  rationale: 采用现代中文圣经与基督教文献中通行的人名音译。
- source_word: δὲ
  choice: 就
  rationale: 此处δέ承接上文并推动叙事；中文用“就”自然呈现彼拉多听见后随即发问的进展，不必强化为明显转折。
- source_word: ἀκούσας
  choice: 听见这话
  rationale: 不定过去时主动分词表示先于主句动作发生的情形；“这话”根据上文补出隐含宾语，使现代中文自然清楚。
- source_word: ἐπηρώτησεν
  choice: 问
  rationale: 准确、自然地表达询问之意；上下文并不要求译成语气较强的“盘问”。
- source_word: εἰ
  choice: 是不是
  rationale: 在间接疑问句中自然对应εἰ，保留问题的两可形式。
- source_word: ὁ ἄνθρωπος
  choice: 这个人
  rationale: 希腊文直译为“那人／这人”；在当前指称场景中，“这个人”符合现代汉语，同时不直接以“耶稣”替换原文措辞。
- source_word: Γαλιλαῖός
  choice: 加利利人
  rationale: 保留表示地域身份的形容词性称谓，而非改写为“来自加利利”。
- source_word: ἐστιν
  choice: 是
  rationale: 保留希腊文现在时；中文间接引语通常不发生英语式时态后移，因此译为“是”最自然准确。
