    issue: “问这个人是不是加利利人”有句法歧义。
    rationale: 此表达可理解为“向这个人询问”，而希腊文ἐπηρώτησεν εἰ ὁ ἄνθρωπος…明确表示彼拉多询问该人是否为加利利人。应以“问那人是否是……”标明间接疑问的内容。
  - severity: low
    issue: “这个人”略加强了原文未明示的近指色彩。
    rationale: ὁ ἄνθρωπος是定指的“那人／这人”；叙事中“那人”较能维持中文自然性并避免不必要的近指强调。
  revised_text: 彼拉多听见这话，就问那人是否是加利利人。
