  text: καὶ εἱστήκει ὁ λαὸς θεωρῶν. ἐξεμυκτήριζον δὲ καὶ οἱ ⸀ἄρχοντες λέγοντες· Ἄλλους ἔσωσεν, σωσάτω ἑαυτόν, εἰ οὗτός ἐστιν ὁ χριστὸς ⸂τοῦ θεοῦ, ὁ⸃ ἐκλεκτός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/035.yaml
  text: And the people stood watching. But even the rulers were mocking him[a], saying, “He saved others; let him save himself, if this is God’s Messiah, the Chosen One.”
translation:
  language: zh_hans
  text: 百姓站着观看。连官长们也讥笑他，说：“他救了别人；如果这人是上帝的弥赛亚、那位蒙拣选者，就让他救自己吧！”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἱστήκει
  choice: 站在那里
  rationale: 该形式在此用于静态的场景铺陈；“站在那里”自然地交代百姓当时的姿态和位置，不必生硬体现其形态上的时态特征。
- source_word: θεωρῶν
  choice: 观看
  rationale: 现在分词描写持续注视的动作；“观看”简洁、自然，并保留旁观意味。
- source_word: ἐξεμυκτήριζον
  choice: 嗤笑他
  rationale: 该动词表示带有鄙夷的嘲弄或讥笑；“嗤笑”比一般的“嘲笑”更能体现轻蔑语气。“他”由上下文补出。
- source_word: ἄρχοντες
  choice: 官长们
  rationale: 此词指掌权者，在本段语境中尤其是犹太领袖；“官长”是中文圣经语体中清楚而庄重的对应，同时没有进一步限定其具体群体。
- source_word: Ἄλλους ἔσωσεν
  choice: 他救了别人
  rationale: σῴζω兼有拯救、救助之意；译作“救”可与下句重复，保留讥讽话语中的修辞和神学反讽。
- source_word: σωσάτω ἑαυτόν
  choice: 就让他救救自己吧
  rationale: 以“让……吧”表达第三人称命令；重复“救”呼应前句。“救救”符合现代汉语直接引语的嘲讽口吻。
- source_word: εἰ οὗτός ἐστιν
  choice: 如果这人是
  rationale: “这人”保留οὗτός的指示意味及语境中略带轻蔑的语气，比单译“他”更贴近原文。
- source_word: ὁ χριστὸς τοῦ θεοῦ
  choice: 上帝的弥赛亚
  rationale: χριστός在此明确是称号，译作“弥赛亚”；属格采用自然的领属结构“上帝的”。
- source_word: ὁ ἐκλεκτός
  choice: 那位蒙拣选者
  rationale: 此处作为具有弥赛亚意味的称号；“蒙拣选者”保留其被上帝拣选的被动含义，“那位”体现定冠词和称号性质。
theological_decisions:
- issue: χριστός作为称号的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处与“上帝的”及“蒙拣选者”并列，明显作为身份称号使用。“弥赛亚”能显明其受膏君王的称号性质，又不将其处理为姓名。
- issue: ὁ ἐκλεκτός的称号性质
  choice: 那位蒙拣选者
  alternative: 那位被选中的；选民
  rationale: “蒙拣选者”既保留被动的拣选关系，也保持称号的庄重和基督论张力；不进一步解释拣选的方式或目的。
- issue: 统治者话语中的条件与讥讽
  choice: 保留“如果……就……”的公开挑战
  alternative: 将其释义为否认耶稣的身份
  rationale: 原文以条件句进行讥讽，并未在语法上直接陈述否认；译文保留条件形式，让叙事中的反讽和身份张力由读者体会。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。句首“百姓站在那里观看”保持叙事的静态场景；“也”对应καί，表明官长同样参与嘲弄。直接引语保留“救”的重复和带轻蔑意味的“这人”，不把其中的神学反讽解释进正文。原始资料所列英文脚注内容实际是称号译法备选，且其标记位置与英文正文不协调；中文正文已直接、清楚地翻译两个称号，因此不另设脚注。
