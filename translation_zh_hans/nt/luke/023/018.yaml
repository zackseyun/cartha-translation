  source_fidelity: 准确反映希腊文：Ἀνέκραγον译为“喊叫”，παμπληθεὶ以“众人……一齐”表达全体共同呼喊，δέ的转折以“却”呈现。两个命令式“除掉……释放……”及受益与格“给我们”均得到妥善处理。“除掉”没有把αἶρε所含的具体执行方式过度明确化，保留了原文在词汇层面的张力。
  naturalness: “众人却一齐喊叫说”及其后的短促命令句符合现代标准汉语，也适合庄重叙事语体。“给我们释放巴拉巴”在司法语境中清楚自然。
