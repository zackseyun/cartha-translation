source:
  edition: SBLGNT
  text: ⸀Ἀνέκραγον δὲ παμπληθεὶ λέγοντες· Αἶρε τοῦτον, ἀπόλυσον δὲ ἡμῖν ⸀τὸν Βαραββᾶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/018.yaml
  text: But they all cried out together[a], saying, “Take this man away, and release Barabbas to us!”
translation:
  language: zh_hans
  text: 众人却一齐喊叫说：“除掉这个人[a]！给我们释放巴拉巴！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把这个人带走！”这里的希腊语命令也可简短地理解为“除掉他！”在本段语境中，群众要求把耶稣除去。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνέκραγον
  choice: 喊叫
  rationale: 该动词表示高声呼喊；“喊叫”自然地保留了强烈而公开的呼声。
- source_word: δὲ
  choice: 却
  rationale: 此处承接上文并形成转折；“却”简洁地表现群众反对彼拉多提议的语气。
- source_word: παμπληθεὶ
  choice: 众人……一齐
  rationale: 该副词强调全体共同发声；这一表达既保留集体性，也避免把经文进一步解释为绝对同心。
- source_word: λέγοντες
  choice: 说
  rationale: 分词引出喊叫的具体内容，汉语以“喊叫说”自然衔接直接引语。
- source_word: Αἶρε
  choice: 除掉
  rationale: 此处命令式要求把耶稣除去；“除掉”保留其简短、强烈的语势，也容纳从带走到处死的语境含义，而不在正文中将后者明说。
- source_word: τοῦτον
  choice: 这个人
  rationale: 指示代词明确指向耶稣；“这个人”符合现代汉语，并保留现场指称及轻蔑语感。
- source_word: ἀπόλυσον
  choice: 释放
  rationale: 该动词指从拘押中放出，在审判语境中“释放”准确而庄重。
- source_word: ἡμῖν
  choice: 给我们
  rationale: 与“释放”搭配，表达群众要求为他们放人的受益者含义，符合自然汉语。
- source_word: τὸν Βαραββᾶν
  choice: 巴拉巴
  rationale: 采用现代中文圣经中通行的人名音译。
theological_decisions:
- issue: Αἶρε 是否明确译为处死
  choice: 正文译作“除掉”，不明说处死
  alternative: “杀掉这个人”或“把这个人带走”
  rationale: 上下文最终涉及处决，但该动词本身首先是“拿走、除去”。“除掉”保留原文的语义张力，既不弱化群众的敌意，也不把语境推论写成词汇明义。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。“众人却一齐喊叫”保留原文的转折、集体性和强烈语气；直接引语使用短促命令句，以体现群众呼喊的力度。
