  text: ἀπέλυσεν δὲ τὸν διὰ στάσιν καὶ φόνον βεβλημένον ⸀εἰς φυλακὴν ὃν ᾐτοῦντο, τὸν δὲ Ἰησοῦν παρέδωκεν τῷ θελήματι αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/025.yaml
  text: So he released the man who had been thrown into prison for insurrection and murder[a], whom they were asking for[b]; but he handed Jesus over to their will.
translation:
  language: zh_hans
  text: 于是，他释放了那个因叛乱和杀人而被扔进监牢、他们一直要求释放的人[a]；却把耶稣交给他们，任凭他们按自己的意愿处置[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因叛乱和杀人而被关进监牢、他们所要求的人。”
    reason: lexical_alternative
  - marker: b
    text: 直译：“交给他们的意愿。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέλυσεν
  choice: 释放了
  rationale: 此处指释放囚犯；“释放”准确、自然，也符合司法语境。
- source_word: διὰ στάσιν καὶ φόνον
  choice: 因叛乱和杀人
  rationale: διά加宾格表示原因；στάσις在本段政治与刑事语境中指叛乱或暴动，而非一般争执。
- source_word: βεβλημένον εἰς φυλακήν
  choice: 被关进监牢
  rationale: 希腊文直译近于“被扔进监牢”，完成时被动分词表明他已被投入狱中并处于羁押状态；正文采用现代汉语较自然的表达，并以脚注保留原文的生动语气。
- source_word: ὃν ᾐτοῦντο
  choice: 就是他们一直求着要的人
  rationale: 未完成时体现持续提出请求的动作；“一直求着要”保留持续性，又不把语气强化为原文未必明确表达的“强求”。
- source_word: παρέδωκεν
  choice: 交给
  rationale: παραδίδωμι在受难叙事中有交付、移交之意；“交给”在汉语中自然，并保留司法移交的意味。
- source_word: τῷ θελήματι αὐτῶν
  choice: 任凭他们的意愿处置
  rationale: 原文直译为“交给他们的意愿”；汉语不能自然地把人直接“交给意愿”，故以“任凭……处置”表达耶稣被交付而由他们的意愿支配，同时保留 θέλημα 的意志色彩。
- source_word: δὲ ... δὲ
  choice: 于是……却
  rationale: 前一个δέ承接叙事进程，译作“于是”；后一个δέ突出获释者与耶稣命运的对照，译作“却”。
theological_decisions:
- issue: 如何表达获释的叛乱杀人者与被交出去的耶稣之间的对照
  choice: 以“于是……却”明确叙事对照，但不添加“代替耶稣”等解释
  alternative: 增译“让他代替耶稣获释”或“在他的位置上”
  rationale: 本节清楚叙述两人的相反结局，却没有直接陈述代替或赎罪教义；译文保留对照，不越过经文本身作神学阐释。
- issue: τῷ θελήματι αὐτῶν所表达的责任与意愿
  choice: 译为“任凭他们的意愿处置”
  alternative: 译为“满足他们的要求”
  rationale: “满足他们的要求”可能弱化 παρέδωκεν 的交付动作，也把 θέλημα 收窄为一次请求；现译保留彼拉多把耶稣交付、任由他们意愿支配的张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“监牢”保留经文语境的庄重感；“任凭他们的意愿处置”使希腊文结构在汉语中通顺，同时避免淡化“意愿”的分量。所有脚注标记均已置于正文相应位置。
