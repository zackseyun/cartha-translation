  yaml_path: translation/nt/luke/023/020.yaml
  text: But Pilate called out again[a], wanting to release Jesus.
translation:
  language: zh_hans
  text: 可是，彼拉多再次向众人喊话，想要释放耶稣[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“再次对他们讲话”。
    reason: 原词既可侧重公开喊话，也可较中性地表示对人讲话；正文采用较具现场感的译法，脚注保留其词义幅度。
lexical_decisions:
- source_word: πάλιν
  choice: 再次
  rationale: 表示动作重复；“再次”简洁自然，并与上下文中彼拉多先前对众人说话相呼应。
- source_word: δὲ
  choice: 可是
  rationale: 在叙事推进中带有轻微转折，凸显彼拉多的意愿与众人的要求相对；“可是”符合现代汉语表达。
- source_word: Πιλᾶτος
  choice: 彼拉多
  rationale: 采用中文圣经传统中通行的人名音译。
- source_word: προσεφώνησεν
  choice: 向众人喊话
  rationale: 该动词可指向人发声、呼喊或讲话；结合公开审讯的场景，“喊话”传达公开而有声地对众人说话，同时脚注保留较中性的译法。原文未明说受话者，但上下文明确是众人，故在汉语中补出“众人”以使表达自然。
- source_word: θέλων
  choice: 想要
  rationale: 现在分词说明彼拉多说话时的意愿；“想要”自然地保留意愿含义，不把它强化为已经作出的决定。
- source_word: ἀπολῦσαι
  choice: 释放
  rationale: 用于司法拘押语境准确自然，表达解除羁押、使其自由。
- source_word: τὸν Ἰησοῦν
  choice: 耶稣
  rationale: 采用现代中文通行的传统音译；专名冠词按汉语习惯不另译。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“就”自然连接彼拉多的意愿与再次喊话这一行动；正文不把“想要”解释为更强的司法决意。
