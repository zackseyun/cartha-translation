  - severity: low
    issue: “必须”可更精确地表达为“有义务”。
    rationale: ἀνάγκην εἶχεν是“处于必要/义务之下”的惯用表达；“有义务”既自然，也较好表达此处所说的制度性或习俗性约束，而不把语气单纯处理为命令。
