  text: He had an obligation[a] to release one man to them at the festival.
translation:
  language: zh_hans
  text: 彼拉多有义务[a]在节期给他们释放一个人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 一些最早的希腊文抄本没有这一整节经文，其中包括三世纪的蒲草纸抄本P75和四世纪的《梵蒂冈抄本》；早期科普特文译本也未载这一节。另一些重要的早期抄本则收录了这节经文，例如四世纪的《西奈抄本》；拉丁文传统和后期拜占庭多数抄本也有这一节。这句话可能是抄写员为使路加的记载与马太福音27:15和马可福音15:6所提到的释放惯例一致而加入的。有些抄本把这句话放在第18节之后。
    reason: textual_critical
lexical_decisions:
- source_word: ἀνάγκην … εἶχεν
  choice: 必须
  rationale: 这是表示“有必要、负有义务”的惯用表达；“必须”自然简洁，也保留彼拉多受惯例约束的语气。
- source_word: ἀπολύειν
  choice: 释放
  rationale: 在司法和拘押语境中，指将人从羁押中释放；不译作“赦免”，以免加入原文未明说的法律含义。
- source_word: κατὰ ἑορτήν
  choice: 按节期的惯例
  rationale: κατά与节期连用，表达每逢节期所遵循的做法；这样译比单说“在节期”更能传达重复性的惯例。
- source_word: ἕνα
  choice: 一个人
  rationale: 原文仅说“一个”，在此语境下所指是被释放的人；补出量词中心语使现代汉语自然，不限定其身份为“囚犯”。
theological_decisions:
- issue: 句中主语在希腊原文中未明说
  choice: 彼拉多
  alternative: 他
  rationale: 动词是第三人称单数，主语须由上下文确定，指彼拉多。中文补出姓名可避免跨节阅读时指代不清，但不改变原文所指。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“按节期的惯例”明确表达κατὰ ἑορτήν所含的周期性习俗；脚注标记紧接“必须”，依照所给审校层的位置提示整节的文本异文。
