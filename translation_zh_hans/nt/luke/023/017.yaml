  verdict: revise
  source_fidelity: 草稿准确传达了释放一人的核心意思，也正确由上下文补出主语“彼拉多”。但“按节期的惯例”把κατὰ ἑορτήν主要译成“按惯例”，弱化了原文明确的时间/场合限定“在（每逢）节期”，并额外凸显“惯例”这一词面未明说的概念。
  naturalness: “彼拉多必须……释放一个人”通顺，但“有义务在节期给他们释放一个人”更贴近ἀνάγκην εἶχεν的“负有义务”，且句法自然庄重。
  terminology: “释放”恰当；“节期”适合ἑορτή。脚注的抄本名称、年代和文本批判说明基本准确；将“最早期”调整为更自然的“最早的”，并使“未载此整节”等措辞更符合中文学术说明习惯。
  issues:
