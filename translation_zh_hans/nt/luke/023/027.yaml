  text: Ἠκολούθει δὲ αὐτῷ πολὺ πλῆθος τοῦ λαοῦ καὶ γυναικῶν ⸀αἳ ἐκόπτοντο καὶ ἐθρήνουν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/027.yaml
  text: A large crowd of people followed him, including women who were beating their breasts and mourning for him.
translation:
  language: zh_hans
  text: 有一大群百姓跟着他，其中有妇女；她们捶胸，为他哀哭。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἠκολούθει
  choice: 跟着
  rationale: 未完成时描写当时持续进行的跟随；现代汉语用“跟着”已能自然表达场景中的延续动作。
- source_word: δὲ
  choice: 不单独译出
  rationale: 此词承接叙事；汉语在这里无需另加“又”或“这时”，行文更自然。
- source_word: αὐτῷ
  choice: 他
  rationale: ἀκολουθέω所带与格指跟随的对象，即耶稣；汉语说“跟着他”。
- source_word: πολὺ πλῆθος τοῦ λαοῦ
  choice: 一大群百姓
  rationale: 既保留群体规模，也用自然汉语表达由百姓组成的人群；“百姓”在路加叙事语境中比泛称“人”更贴近λαός。
- source_word: καὶ γυναικῶν
  choice: 其中有些妇女
  rationale: 将妇女明确置于随行人群之中，并为阴性复数关系代词所引出的描述建立清楚指向；“有些”不限定确切人数。
- source_word: αἳ
  choice: 妇女（由后续分句明确回指）
  rationale: 阴性复数关系代词专指前面的妇女；汉语以“其中有些妇女……”自然维持这一指向。
- source_word: ἐκόπτοντο
  choice: 捶胸
  rationale: 在哀悼语境中表示以击打自己表达悲痛；“捶胸”清楚呈现这一文化动作，又避免含混的“打自己”。
- source_word: ἐθρήνουν
  choice: 哀哭
  rationale: 该词指可听见的哀悼、悲叹；“哀哭”比单纯“哀悼”更能传达外显的悲声。
- source_word: αὐτόν
  choice: 为他悲痛
  rationale: 明确耶稣是妇女哀哭悲痛的对象，符合汉语表达。
