  source_fidelity: “暴乱”可以涵盖στάσις的一部分语义，但该词在此处更可能指具有政治性质的骚动、起事或叛乱；译为“叛乱”较能保留其反抗当局的含义。φόνον为单数，译文用“杀人”虽可理解，改为“一起杀人事件”可更自然地作为与“叛乱”并列的被监禁缘由，且不额外断言正式定罪。
  naturalness: 原句基本通顺；“因城里发生的一场……和杀人，被关进了监狱”中“杀人”与“一场暴乱”并列时略显不均衡。采用“一次叛乱和一起杀人事件而被关进监狱”更平衡、清楚，仍保持现代庄重叙事语体。
  terminology: 以“叛乱”对应στάσις，并在脚注保留“暴乱、起义”等可能译法，较符合该词可涵盖骚乱至反叛的语义范围，也不把地点具体化。
