  text: ὅστις ἦν διὰ στάσιν τινὰ γενομένην ἐν τῇ πόλει καὶ φόνον ⸂βληθεὶς ἐν τῇ φυλακῇ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/019.yaml
  text: who had been thrown into prison for a certain uprising that had taken place in the city[a], and for murder.
translation:
  language: zh_hans
  text: 这人因城里发生的一次叛乱[a]和一起杀人事件而被关进了监狱。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“暴乱”或“起义”。希腊语στάσις可指骚乱、起义或叛乱。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις
  choice: 这人
  rationale: 承接上文所指的巴拉巴；汉语用“这人”引出补充说明，比直译为关系代词更自然。
- source_word: διὰ
  choice: 因
  rationale: διὰ接宾格在此表示原因；“因”简洁地表达他被监禁的缘由。
- source_word: στάσιν τινὰ
  choice: 一场暴乱
  rationale: στάσις可指政治性骚乱、起义或叛乱；“暴乱”既保留暴力性的社会动荡含义，又符合现代汉语习惯。“一场”自然体现τινά的不特定意味。
- source_word: γενομένην ἐν τῇ πόλει
  choice: 城里发生的
  rationale: 明确保留分词的事件含义和地点信息，同时不把原文未明说的城市具体化为耶路撒冷。
- source_word: φόνον
  choice: 杀人
  rationale: φόνος指杀人、凶杀；此处采用名词性表达，与“暴乱”并列，并避免额外增添原文没有明说的定罪措辞。
- source_word: βληθεὶς ἐν τῇ φυλακῇ
  choice: 被关进了监狱
  rationale: 表达其被投入监禁的被动动作；“关进监狱”是现代汉语自然、清楚的说法，也保留了动作完成的意味。
theological_decisions:
- issue: 是否明确说这人“犯了杀人罪”
  choice: 译作“因……杀人”
  alternative: “因……犯了杀人罪”
  rationale: 原文以“暴乱”和“杀人”并列说明监禁缘由，并未在本句另加“犯罪”或正式定罪的动词；所选译法保留这种简洁表达，避免过度阐释。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。经文作为承接上文的关系从句，以“这人”起句；保留“城里”，不擅自补明城市名称。
