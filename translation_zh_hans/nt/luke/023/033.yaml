source:
  edition: SBLGNT
  text: καὶ ὅτε ⸀ἦλθον ἐπὶ τὸν τόπον τὸν καλούμενον Κρανίον, ἐκεῖ ἐσταύρωσαν αὐτὸν καὶ τοὺς κακούργους, ὃν μὲν ἐκ δεξιῶν ὃν δὲ ἐξ ἀριστερῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/033.yaml
  text: And when they came to the place called Skull[a], there they crucified him and the criminals[b], one on the right and one on the left.
translation:
  language: zh_hans
  text: 他们到了那名叫“髑髅”的地方[a]，就在那里把他钉在十字架上，也把那两个罪犯钉上十字架，一个在右边，一个在左边[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “髑髅”原文直译为“头骨”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译：“一个从右边，一个从左边。”这里指两人分别在左右两侧。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον ἐπὶ τὸν τόπον
  choice: 到了……地方
  rationale: 在移动动词ἦλθον之后，ἐπί加宾格表示朝向并到达；“到了……地方”符合现代汉语叙事习惯。
- source_word: τὸν καλούμενον Κρανίον
  choice: 那名叫“髑髅”的地方
  rationale: Κρανίον意为“头骨、髑髅”，在这里用作地点称呼；译出其含义，不采用音译，也不引入平行经文中的其他名称。
- source_word: ἐσταύρωσαν
  choice: 钉在十字架上／钉上十字架
  rationale: σταυρόω的标准含义是“钉十字架”；此译法准确而自然，不额外限定具体施刑细节。
- source_word: κακούργους
  choice: 罪犯
  rationale: κακοῦργος泛指作恶者或罪犯；“罪犯”清楚、现代，也避免将路加的用词窄化为“强盗”或“叛乱者”。
- source_word: ὃν μὲν ἐκ δεξιῶν ὃν δὲ ἐξ ἀριστερῶν
  choice: 一个在右边，一个在左边
  rationale: 原文用对应结构说明两名罪犯各自的位置；正文采用自然汉语，同时不补入原文未明说的“他的”。
theological_decisions:
- issue: Κρανίον作为地点名称的译法
  choice: 髑髅
  alternative: 头骨；音译作地名
  rationale: 该名称由普通名词构成，语义在叙事中应予保留。“髑髅”庄重凝练，又能表达原词含义；脚注补充其直译。
- issue: 与耶稣同钉之人的称呼
  choice: 罪犯
  alternative: 恶人；强盗；犯人
  rationale: 路加使用的κακοῦργοι含义较宽。“罪犯”不与其他福音书的不同措辞作人为协调，也不对他们的具体罪行作额外判断。
- issue: 左右位置的参照对象
  choice: 不在正文补出“他的”
  alternative: 一个在他右边，一个在他左边
  rationale: 上下文自然表明左右位置是相对于耶稣而言，但希腊文并未明说所属对象；正文保留这种简略表达。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“钉在十字架上”用于首次出现的核心动作，随后用“钉上十字架”避免累赘；“那两个”由后文“一个……一个……”明确支持。
