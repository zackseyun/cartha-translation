id: LUK.23.12
reference: Luke 23:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐγένοντο δὲ φίλοι ὅ τε ⸂Ἡρῴδης καὶ ὁ Πιλᾶτος⸃ ἐν αὐτῇ τῇ ἡμέρᾳ μετ’ ἀλλήλων· προϋπῆρχον γὰρ ἐν ἔχθρᾳ ὄντες πρὸς ⸀αὑτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/012.yaml
  text: And Herod and Pilate became friends with each other on that very day[b][a], for previously they had been in hostility toward one another.
translation:
  language: zh_hans
  text: 就在那一天，希律和彼拉多成了朋友[a]；因为在此以前，他们彼此为敌[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“关系转好了”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“他们一直彼此敌对”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένοντο
  choice: 成了
  rationale: 不定过去时在这里表示关系状态发生变化；“成了”自然、直接。
- source_word: φίλοι
  choice: 朋友
  rationale: 作复数谓语名词，直指朋友或盟友关系；正文保留“朋友”，脚注说明也可理解为关系转好。
- source_word: ὅ τε Ἡρῴδης καὶ ὁ Πιλᾶτος
  choice: 希律和彼拉多
  rationale: 自然表达双方共同参与这一关系变化，无须额外加入“二人都”。
- source_word: ἐν αὐτῇ τῇ ἡμέρᾳ
  choice: 就在那一天
  rationale: “就”体现原文 αὐτῇ 的强调，同时符合现代汉语语序。
- source_word: μετ’ ἀλλήλων
  choice: 彼此
  rationale: 清楚表达相互关系；汉语无需重复译作“彼此之间”。
- source_word: προϋπῆρχον
  choice: 在此以前
  rationale: 体现先前持续存在的状态，并与“就在那一天”的关系变化形成时间对比。
- source_word: ἐν ἔχθρᾳ ὄντες πρὸς αὑτούς
  choice: 他们彼此为敌
  rationale: 以自然而凝练的现代汉语表达相互敌对的持续状态，并保留名词性关系含义。
theological_decisions:
- issue: 希律与彼拉多关系变化的性质
  choice: 译作“成了朋友”，不进一步解释其动机或属灵意义。
  alternative: 译作“关系转好”或“变得友好”。
  rationale: φίλοι 可指朋友，也可能包含政治盟友或友好关系的意味；正文采用直接对应，脚注保留较弱理解，避免加入原文未说明的动机。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“就在那一天”保留强调；分号呈现关系改变与此前敌对状态之间的解释关系。所有脚注标记均置于对应正文之后。
