  yaml_path: translation/nt/luke/023/045.yaml
  text: the sun having been darkened[c][b][a], and the curtain of the temple was torn in the middle.
translation:
  language: zh_hans
  text: 太阳失去了光亮[a]，圣殿的幔子[b]从中间裂开了[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“太阳变暗了。”也有人译作“发生了日食”，但这比希腊原文所必然表达的意思更具体。
    reason: alternative_reading
  - marker: b
    text: “幔子”也可译作“帘子”或“帷幕”。
    reason: lexical_alternative
  - marker: c
    text: 或译：“从正中裂开了”或“裂成两半了”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ ἡλίου ἐκλιπόντος
  choice: 太阳失去了光辉
  rationale: ἐκλείπω的基本义包括“失效、消失、停止”。结合太阳和前文的黑暗，“失去了光辉”在现代汉语中自然，也不把现象具体解释为日食。
- source_word: ἐσχίσθη
  choice: 裂开了
  rationale: σχίζω用于织物时指撕裂、裂开；被动形式在汉语中可自然表达为“裂开了”，无需生硬加入“被”。
- source_word: δὲ
  choice: （以逗号连接）
  rationale: δὲ在这里是轻微的连接词。汉语用逗号承接前后事件最自然，不必硬译为带有强烈转折意味的“但是”。
- source_word: τὸ καταπέτασμα τοῦ ναοῦ
  choice: 圣殿里的幔子
  rationale: καταπέτασμα指悬挂作分隔之用的帘幔，ναός在此指圣殿内部的圣所。“圣殿里的幔子”既通顺易懂，也保留了具体场景。
- source_word: μέσον
  choice: 从中间
  rationale: μέσον直接表明裂开的位置或方式。“从中间”贴近原文，同时不把结果明确扩展为原文未直说的“两半”或“两片”。
theological_decisions:
- issue: 太阳失光的性质
  choice: 太阳失去了光辉
  alternative: 太阳变暗了；发生了日食
  rationale: 经文描述耶稣受死时太阳失光，却没有要求读者把它理解为某种特定的天文机制。译文因此保留非技术性的表述。
- issue: καταπέτασμα所指的圣殿帘幔
  choice: 圣殿里的幔子
  alternative: 圣殿的帘子；圣所的幔子
  rationale: 译文明确这是圣殿内部的帘幔，但不借翻译进一步规定它在圣殿中的具体位置，以免超出本节本身的措辞。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“失去了光辉”避免生硬直译“太阳失效了”，也避免把事件限定为日食；“幔子”保留经文语境中常用且仍易懂的称谓。
