  text: ὁ δὲ Πιλᾶτος ⸀ἠρώτησεν αὐτὸν λέγων· Σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων; ὁ δὲ ἀποκριθεὶς αὐτῷ ἔφη· Σὺ λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/003.yaml
  text: Then Pilate asked him[a], saying, “Are you the king of the Jews?” And answering him, he said[b], “You say so.”
translation:
  language: zh_hans
  text: 彼拉多问耶稣说：“你是犹太人的王吗？”耶稣回答他说：“是你说的。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你说得是”或“正如你所说的。”原文的回答十分简短，也可理解为带有保留的肯定。
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: （不单独译出）
  rationale: 此处是轻微的叙事连接词；现代汉语可借语序自然承接上文，无须机械译作“于是”或“但”。
- source_word: ἠρώτησεν αὐτὸν λέγων
  choice: 问耶稣说
  rationale: 既保留“问”及 λέγων 的言说结构，也用“耶稣”消除连续代词在汉语中的指代含混。
- source_word: ὁ βασιλεὺς τῶν Ἰουδαίων
  choice: 犹太人的王
  rationale: 准确保留受审问题中的王权称号；Ἰουδαῖοι 在此最自然指犹太人。其“犹太地区之人”的地域性可能无需在本节正文中突出。
- source_word: ἀποκριθεὶς αὐτῷ ἔφη
  choice: 耶稣回答他说
  rationale: 自然表达分词“回答”和间接宾语“对他”，同时明确说话者。
- source_word: Σὺ λέγεις
  choice: 这是你说的
  rationale: 保留原文简短、间接的措辞：既不译成明确的“是”，也不处理成否认，让回答可能具有的限定性肯定保持开放。
theological_decisions:
- issue: 耶稣回答“Σὺ λέγεις”的语力
  choice: 这是你说的
  alternative: “你说得是”或“正如你所说的”
  rationale: 希腊文可被理解为带保留的肯定，但并非直截了当的“是”。正文保留其修辞张力，脚注说明较明确的肯定性理解。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“问……说”和“回答他说”略带经文语体，但在现代汉语中仍自然可懂。正文仅设置一处脚注，标记已置于相关引语之后。
