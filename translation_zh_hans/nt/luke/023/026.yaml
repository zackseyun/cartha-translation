  text: Καὶ ὡς ἀπήγαγον αὐτόν, ἐπιλαβόμενοι ⸂Σίμωνά τινα Κυρηναῖον ἐρχόμενον⸃ ἀπ’ ἀγροῦ ἐπέθηκαν αὐτῷ τὸν σταυρὸν φέρειν ὄπισθεν τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/026.yaml
  text: And as they led him away[a], they seized a certain Simon of Cyrene, coming in from the countryside[b], and laid the cross on him to carry behind Jesus.
translation:
  language: zh_hans
  text: 他们把耶稣押走时，抓住了一个从乡间来的[a]古利奈人，名叫西门，把十字架[b]放在他身上，让他背着十字架走在耶稣后面。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “从乡间来的”也可译作“从田里来的”。希腊语ἀγρός既可指具体的田地，也可泛指城外的乡间。
    reason: lexical_alternative
  - marker: b
    text: 有人认为这里的“十字架”具体是指“十字架的横木”，但希腊原文只说“十字架”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγαγον
  choice: 押走
  rationale: 该动词意为领走、带走；在押赴刑场的语境中，“押走”自然地体现耶稣处于拘押之下，又不增添原文没有的动作细节。
- source_word: ἐπιλαβόμενοι
  choice: 抓住了
  rationale: 此处表示实际动手抓住某人；“抓住”既符合上下文中的强制意味，也比“拉住”更准确。
- source_word: Σίμωνά τινα Κυρηναῖον
  choice: 一个……古利奈人，名叫西门
  rationale: τινα用来引入此前未提及的人物；现代汉语以“一个……人，名叫……”表达自然，并保留他与古利奈的地域关联。
- source_word: ἐρχόμενον ἀπ’ ἀγροῦ
  choice: 从乡间来的
  rationale: ἀγρός既可指具体的田地，也可泛指城外乡间；正文采用涵盖面较广且自然的“乡间”，脚注保留“田里”这一可能。
- source_word: ἐπέθηκαν αὐτῷ τὸν σταυρὸν
  choice: 把十字架放在他身上
  rationale: 忠实表达把重物加在某人身上的动作和被迫承担的意味，不把σταυρός具体化为原文未明说的“横木”。
- source_word: φέρειν
  choice: 背着
  rationale: 在十字架被放到西门身上的具体场景中，“背着”比泛泛的“拿着”或较书面的“负着”更自然准确。
- source_word: ὄπισθεν τοῦ Ἰησοῦ
  choice: 走在耶稣后面
  rationale: ὄπισθεν首先表达空间上的“在后面”；补出“走”使中文句意完整，并符合行进中的场景。
theological_decisions:
- issue: 受难叙事中的σταυρός是否应具体译为“十字架横木”
  choice: 十字架
  alternative: 十字架横木
  rationale: 希腊原文使用通常指“十字架”的σταυρός，并未使用专指横木的词。正文不采用特定历史重构，以保留原文表达的宽度。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“押走”“抓住”体现行刑队伍强制带走耶稣并征用西门的语境；对“乡间/田里”和“十字架/横木”的歧义分别以脚注保留。
