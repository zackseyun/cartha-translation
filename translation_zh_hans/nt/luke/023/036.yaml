base_translation:
  language: en
  yaml_path: translation/nt/luke/023/036.yaml
  text: The soldiers also mocked him[a], coming up and offering him sour wine,
translation:
  language: zh_hans
  text: 士兵们也嘲弄他，上前把酸酒递给他，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνέπαιξαν
  choice: 嘲弄
  rationale: 该动词表示带有敌意和轻蔑意味的戏弄、讥嘲；“嘲弄”自然、庄重，也准确保留其贬抑色彩。
- source_word: δὲ…καὶ οἱ στρατιῶται
  choice: 士兵们也
  rationale: δὲ承接叙事，καὶ突出士兵也加入了先前的嘲弄；合译为“也”最符合现代汉语表达。
- source_word: οἱ στρατιῶται
  choice: 士兵们
  rationale: 直接指行刑场景中的士兵；“士兵们”清楚自然。
- source_word: προσερχόμενοι
  choice: 上前
  rationale: 该分词描述士兵走近耶稣的动作；“上前”简洁自然，并保留伴随动作的关系。
- source_word: ὄξος
  choice: 酸酒
  rationale: ὄξος指酸涩的廉价酒饮，而非现代汉语通常所说的调味用醋；“酸酒”较准确且易懂。
- source_word: προσφέροντες αὐτῷ
  choice: 把酸酒递给他喝
  rationale: προσφέρω在此表示把饮品送到他面前供他饮用；“递给他喝”符合汉语习惯，也不额外判定士兵的动机。
theological_decisions:
- issue: 士兵递酸酒的行为性质
  choice: 只陈述士兵在嘲弄场景中递酒给耶稣喝，不进一步说明其动机
  alternative: 明确解释为怜悯之举，或明确解释为纯粹戏弄
  rationale: 上下文把士兵的行为置于嘲弄之中，但本节并未单独说明递酒的心理动机；译文让上下文体现语气，不额外判定是善意还是加重羞辱。
translation_notes:
  register: 采用现代、自然而庄重的叙事语言。“嘲弄”保留敌意色彩；“上前”准确表达分词所述的伴随动作；“酸酒”避免“醋”在现代汉语中容易造成的调味品联想。原文句末延续到下一节，因此保留逗号。
