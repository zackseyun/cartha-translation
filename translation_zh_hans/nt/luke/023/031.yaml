base_translation:
  language: en
  yaml_path: translation/nt/luke/023/031.yaml
  text: For if they do these things when the wood is green[b][a], what will happen when it is dry?
translation:
  language: zh_hans
  text: 因为，人们若在青绿的树木上这样做，在枯干的树木上又会怎样呢？[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “青绿的树木……枯干的树木”也可译作“青湿的木头……干木头”。希腊文 ξύλον 可指树、木头或木材；此处的形象也可能涉及未干与干燥的可燃木材。
    reason: lexical_alternative
  - marker: b
    text: 这形象很可能是由较轻到较重的对比：若在“青绿的树木”上尚且发生这样的事，在“枯干的树木”上将会如何；经文本身没有说明两者各自具体指谁。
    reason: cultural_note
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 承接上一节，为先前的哀叹和警告说明缘由，保留其因果作用。
- source_word: ἐν τῷ ὑγρῷ ξύλῳ
  choice: 对青湿的木头
  rationale: ἐν 在此比喻性说法中可表达事情施行于某对象；译作“对……木头”符合现代汉语，同时保留原有意象。
- source_word: ὑγρῷ
  choice: 青湿的
  rationale: 该词本义可指湿润、有水分；与 ξηρός 对照时，是尚有水分、不易燃烧的木头。“青湿”兼顾原义与汉语对木材状态的自然表达。
- source_word: ξύλῳ
  choice: 木头
  rationale: ξύλον 可指木头、木材或树。此处与青湿、枯干搭配，译作“木头”保留可能涉及可燃材料的形象，又不把隐喻直接解释为特定人物。
- source_word: ταῦτα ποιοῦσιν
  choice: 人们……这样做
  rationale: 保留复数指示语“这些事/这样”及主动表达；希腊文主语未明说，以泛指的“人们”自然呈现，同时不限定具体施行者。
- source_word: ἐν τῷ ξηρῷ
  choice: 枯干的木头
  rationale: 承接前面的 ξύλον，并与“青湿”形成鲜明对照；在汉语中补出“木头”可使比喻结构清楚。
- source_word: τί γένηται
  choice: 又会怎样呢
  rationale: 该虚拟式用于修辞问句，指向预期的结果；“会怎样”自然传达其开放而严肃的语气。
theological_decisions:
- issue: 青湿木头与枯干木头的比喻所指
  choice: 正文保留比喻，不明确指定两种木头分别代表谁。
  alternative: 把“青湿的木头”直接解释为耶稣，把“枯干的木头”解释为耶路撒冷或其居民；或直接改写为从较轻到更重的审判。
  rationale: 这句话很可能由当前发生的苦难指向将来更严重的结局或审判，但两种木头的确切所指属于解释。保留原来的形象可维护经文的含混性和神学张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“尚且……又……”呈现希腊文修辞问句中由较轻到较重的推进；“人们”作为泛指主语，避免擅自限定施行者。脚注保留“木头/树”的词义可能性以及比喻所指的开放性。
