  text: ⸀καὶ Πιλᾶτος ἐπέκρινεν γενέσθαι τὸ αἴτημα αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/024.yaml
  text: And Pilate decided that their demand should be granted[a].
translation:
  language: zh_hans
  text: 彼拉多裁定，他们所求的应当照办。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“彼拉多判定，他们的要求应当实行。”
    reason: 提供更形式对应的译法，显明ἐπέκρινεν的司法色彩以及γενέσθαι“得以实行、成为事实”的表达。
lexical_decisions:
- source_word: καὶ
  choice: 于是
  rationale: 承接前文群众呼喊占了上风的结果；“于是”自然表达叙事推进及结果关系，同时不另加具体时间信息。
- source_word: Πιλᾶτος
  choice: 彼拉多
  rationale: 采用现代中文圣经与基督教语境中通行的人名译法。
- source_word: ἐπέκρινεν
  choice: 裁定
  rationale: 该动词在此指作出具有司法性质的决定。“裁定”既保留正式审断的意味，又避免“判刑”可能造成的过度限定。
- source_word: γενέσθαι
  choice: 办理
  rationale: 与“裁定”及“所求的”组合，表达让所请求之事得以实行；中文以“照……办理”自然传达该补足不定式的作用。
- source_word: τὸ αἴτημα
  choice: 所求的
  rationale: αἴτημα可指请求、要求或诉求。此处用名词化结构“所求的”，既符合中文习惯，也不把语气强度固定为较温和的“请求”或较强烈的“要求”。
- source_word: αὐτῶν
  choice: 他们
  rationale: 指前文提出要求并向彼拉多施压的人群及其领袖。
theological_decisions:
- issue: 彼拉多行动的司法性质
  choice: 彼拉多裁定照他们所求的办理
  alternative: 彼拉多决定答应他们的要求
  rationale: “裁定”保留ἐπέκρινεν的正式司法意味；同时不使用“判刑”，以免将此句过度限定为直接对耶稣宣判刑罚。
- issue: 群众诉求的语气强度
  choice: 他们所求的
  alternative: 他们的要求／他们的请求
  rationale: 原词αἴτημα本身容许“请求”至“要求”的幅度；正文以“所求的”保留这一弹性，而上下文仍清楚显示群众施压的强度。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“裁定……办理”保留司法语境，又便于普通读者理解；句首“于是”顺畅承接上文。
