  yaml_path: translation/nt/luke/023/013.yaml
  text: But Pilate, having called together the chief priests and the rulers and the people,
translation:
  language: zh_hans
  text: 彼拉多召集了祭司长、官长和百姓，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πιλᾶτος
  choice: 彼拉多
  rationale: 采用现代中文圣经传统中通行的人名音译。
- source_word: δὲ
  choice: 以句序承接，不另译连接词
  rationale: δέ在此是较弱的叙事转换。中文直接以主语起句即可自然承接上下文；若译作“但是”会使转折显得过强，译作“于是”则可能增加明确的因果或时间推进。
- source_word: συγκαλεσάμενος
  choice: 召集了
  rationale: 该词表示把相关人员召到一起。希腊文不定过去时中间语态分词在此先于后续主句动作；本节本身是未完句，中文以“召集了”自然保留其引出下文的功能。
- source_word: ἀρχιερεῖς
  choice: 祭司长
  rationale: 复数在新约语境中指居领导地位的祭司权贵，并非同时有多位大祭司；“祭司长”是准确且通行的译法。
- source_word: ἄρχοντας
  choice: 官长
  rationale: 这里指具有治理或议事权力的领袖。“官长”保留其公共权威身份，也比泛称“领袖”更具体。
- source_word: λαὸν
  choice: 百姓
  rationale: λαός指作为整体的民众；“百姓”不把所指缩窄为临时聚集的“群众”，并符合庄重而自然的中文表达。
