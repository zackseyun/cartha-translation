  text: καὶ φωνήσας φωνῇ μεγάλῃ ὁ Ἰησοῦς εἶπεν· Πάτερ, εἰς χεῖράς σου ⸀παρατίθεμαι τὸ πνεῦμά μου. ⸂τοῦτο δὲ⸃ εἰπὼν ἐξέπνευσεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/046.yaml
  text: And Jesus[a], crying out with a loud voice, said, “Father, into your hands I commit my spirit.” Having said this[c][b], he breathed his last.
translation:
  language: zh_hans
  text: 耶稣大声呼喊着说：“父啊，我把我的灵交在你手里。”[a]说了这话[b]，他就咽了气。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “交在你手里”也可译作“托付给你”，指把自己的灵交由父看顾。这句话呼应《诗篇》31:5（七十士译本）：“我把我的灵交在你手里。”
    reason: lexical_alternative_and_cross_reference
  - marker: b
    text: 有些抄本传统在“说了这话”前的连接语上略有差异；此处按本版希腊文译出。
    reason: textual_variant
  - marker: c
    text: “咽了气”也可译作“断了气”“气绝了”或“死了”；原词字面与呼出气息有关。
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνήσας φωνῇ μεγάλῃ
  choice: 大声呼喊
  rationale: 合并表达同源动词与“大声”的方式短语，既保留声音洪亮、强烈的强调，也符合现代汉语习惯。
- source_word: Πάτερ
  choice: 父啊
  rationale: 保留直接呼语，不增添原文没有的“我的”；“啊”自然标示庄重呼告。
- source_word: εἰς χεῖράς σου
  choice: 在你手里
  rationale: 汉语“交在你手里”自然表达置于对方照管之下，也保留诗篇引文的传统意象；“手里”虽形式上为单数表达，却是汉语对应希腊语复数“手”的惯用说法。
- source_word: παρατίθεμαι
  choice: 我把……交在……
  rationale: 该现在时中动态形式在此是当下施行的托付宣告；“交在”兼具交付和委托照管之意，庄重而易懂。
- source_word: τὸ πνεῦμά μου
  choice: 我的灵
  rationale: 在向父祷告并有意识托付自己的语境中，“灵”比纯生理意义的“气息”更贴切，同时不额外界定其神学内涵。
- source_word: τοῦτο δὲ εἰπών
  choice: 说了这话
  rationale: 自然表达分词所指的先行动作，并保持叙事简洁。
- source_word: ἐξέπνευσεν
  choice: 咽了气
  rationale: 这是现代汉语中表示停止呼吸而死的常用说法，保留该希腊动词与呼吸相关的意象；脚注列出较直接的替代译法。
theological_decisions:
- issue: 耶稣末后话语中 πνεῦμά μου 的含义
  choice: 我的灵
  alternative: 我的气息
  rationale: 祷告和主动托付的语境支持“灵”，但不借译文展开后来的教义定义，保留词义本身的张力。
- issue: παρατίθεμαι 的时态、语态及托付意味
  choice: 我把我的灵交在你手里
  alternative: 我将我的灵托付给你
  rationale: 采用自然汉语的施行性宣告，表达耶稣此刻主动把自己的灵置于父的照管之下；不把中动态过度解释为特定教义。
- issue: ἐξέπνευσεν 对死亡的表达
  choice: 咽了气
  alternative: 断了气；死了
  rationale: 保留原词“呼出气息”的形象，同时明确表达死亡，不进一步说明灵与身体关系。
translation_notes:
  register: 采用庄重、自然、易懂的现代标准普通话。“大声呼喊”保留原文力度；“父啊”保持直接呼语；“交在你手里”既有经文回响，也符合当代汉语。“咽了气”清楚而不粗俗，并保存呼吸意象。所有脚注标记均已置于正文。
