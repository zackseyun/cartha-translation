  text: καὶ ἡμεῖς μὲν δικαίως, ἄξια γὰρ ὧν ἐπράξαμεν ἀπολαμβάνομεν· οὗτος δὲ οὐδὲν ἄτοπον ἔπραξεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/041.yaml
  text: And we indeed justly[a], for we are receiving what our deeds deserve[b]; but this man has done nothing wrong.
translation:
  language: zh_hans
  text: 我们受刑是应得的，因为我们所受的正是我们所作所为应得的；但这个人没有做过任何不当的事。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“但这个人没有做过任何错事。”
    reason: lexical_alternative
lexical_decisions:
- source_word: δικαίως
  choice: 是公正的
  rationale: 该副词表明他们所受的刑罚合乎公义、罪有应得；“是公正的”自然地保留司法语境。
- source_word: ἄξια γὰρ ὧν ἐπράξαμεν
  choice: 因为我们正在承受自己所做之事应得的后果
  rationale: 以自然汉语表达“与我们所做之事相称的东西”，明确后果与行为相称，同时不额外限定具体罪行。
- source_word: ἀπολαμβάνομεν
  choice: 正在承受
  rationale: 保留现在时所表达的当下持续状态；在受刑语境中，“承受”比“领受”更自然。
- source_word: οὗτος
  choice: 这个人
  rationale: 保留指示代词的对比作用，并以现代汉语清楚指向耶稣。
- source_word: οὐδὲν ἄτοπον
  choice: 没有做过任何不当的事
  rationale: ἄτοπον可指不当、错误或不合宜之事；“不当的事”保留其语义范围，避免将其过度收窄为特定法律罪名。
- source_word: ἔπραξεν
  choice: 做过
  rationale: 自然表达截至当时的行为记录，与“任何不当的事”搭配顺畅。
theological_decisions:
- issue: 犯人对耶稣无辜的陈述
  choice: 但这个人没有做过任何不当的事
  alternative: 但这个人没有做过任何错事
  rationale: 正文清楚保留对耶稣无辜的见证，同时“不当”较贴近ἄτοπον的宽泛含义，不将陈述扩展为经文本句未明说的系统性教义结论。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“受刑是公正的”体现δικαίως的司法意味；“正在承受”保留动作正在发生的语气。脚注呈现ἄτοπον较通俗的可选译法。
