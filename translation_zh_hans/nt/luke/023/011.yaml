  text: ἐξουθενήσας δὲ αὐτὸν ⸀καὶ ὁ Ἡρῴδης σὺν τοῖς στρατεύμασιν αὐτοῦ καὶ ἐμπαίξας ⸀περιβαλὼν ἐσθῆτα λαμπρὰν ἀνέπεμψεν αὐτὸν τῷ Πιλάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/011.yaml
  text: But Herod also[a], together with his soldiers, treated him with contempt and mocked him. Dressing him in splendid clothing, he sent him back to Pilate.
translation:
  language: zh_hans
  text: 希律也和他的士兵一起蔑视他、戏弄他；给他穿上一件华美的衣服[a]后，把他送回彼拉多那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“鲜亮的衣服”或“华美的袍子”。“华美”所译的希腊词也可表示“明亮、鲜亮”；这件衣服很可能是希律用来戏弄耶稣，使他看似受到尊荣。
    reason: 说明λαμπράν的词义范围，以及ἐσθής并未明确限定为某一种袍服。
lexical_decisions:
- source_word: ἐξουθενήσας
  choice: 藐视他
  rationale: 该词表示把人看作无足轻重、以轻蔑态度对待；“藐视他”简洁庄重，也符合公开羞辱的语境。
- source_word: σὺν τοῖς στρατεύμασιν αὐτοῦ
  choice: 和他的士兵
  rationale: στράτευμα在此可指军队或士兵；叙事中译作“士兵”具体、自然。
- source_word: ἐμπαίξας
  choice: 戏弄他
  rationale: 该词表示嘲弄、奚落；“戏弄”是现代中文受难叙事中自然且庄重的表达。
- source_word: περιβαλὼν
  choice: 给他穿上
  rationale: 该分词表示把衣物披在或穿在某人身上；“给他穿上”准确而符合现代汉语习惯。
- source_word: ἐσθῆτα λαμπρὰν
  choice: 华美的衣服
  rationale: ἐσθής泛指衣服或服装，λαμπρός可指鲜亮、华美或华贵；此译不擅自限定为某一种袍服，并保留戏谑性尊荣的可能意味。
- source_word: ἀνέπεμψεν
  choice: 送回
  rationale: 在司法移交的语境中，该词表示送回先前的掌权者；“送回”清楚传达这一程序性含义。
- source_word: τῷ Πιλάτῳ
  choice: 彼拉多那里
  rationale: 采用该人名通行的现代中文译名，并以“那里”自然表达送到某人处。
theological_decisions:
- issue: 华美衣服在戏弄中的具体象征
  choice: 保留衣服华美或鲜亮的描述，不在正文中明确解释为王袍
  alternative: 明确译为象征王权的华贵长袍，或解释为表示癫狂、轻浮的服装
  rationale: 上下文清楚表明这件衣服与藐视和戏弄有关，但希腊文没有明确说明服装种类或其具体象征，因此正文保留讽刺性尊荣的张力而不作过度解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“希律和他的士兵也”自然体现δὲ…καὶ ὁ Ἡρῴδης中的递进意味；连续动词保留原文中轻蔑、戏弄、穿衣和送回的动作次序。
