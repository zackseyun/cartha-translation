  text: Ἤγοντο δὲ καὶ ἕτεροι ⸂κακοῦργοι δύο⸃ σὺν αὐτῷ ἀναιρεθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/032.yaml
  text: And two others[a], who were criminals[b], were being led with him to be put to death.
translation:
  language: zh_hans
  text: 另有两名罪犯[a]，也正同他一起被押去处死[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“作恶者”或“恶人”。这个希腊词指作恶或犯罪的人。
    reason: lexical_alternative
  - marker: b
    text: 或译“被处决”或“被执行死刑”。希腊原文在这里说“被处死”，本身没有说明方式；上下文表明是钉十字架。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤγοντο
  choice: 被押去
  rationale: 未完成时被动语态描写当时正在进行的押送过程；“被押去”在现代汉语中自然体现受人押解前往的意思。
- source_word: δὲ
  choice: 另有
  rationale: δέ在这里是推进叙事的轻微连接词；不必生硬译作“但是”，“另有”结合上下文自然承接叙事。
- source_word: καὶ
  choice: 也
  rationale: 表示除耶稣之外，这两个人也在被押送，译作“也”清楚保留其附加意义。
- source_word: ἕτεροι
  choice: 另有
  rationale: 指耶稣以外的其他人；与“两个人”合译为“另有两个”，简洁自然。
- source_word: κακοῦργοι
  choice: 罪犯
  rationale: 该词指作恶、犯法的人；在此司法处刑的语境中，“罪犯”清楚而庄重，同时脚注保留较宽泛的词义。
- source_word: δύο
  choice: 两个
  rationale: 直接保留基数词的含义。
- source_word: σὺν αὐτῷ
  choice: 和他一同
  rationale: 准确表达陪同、一道前往的关系；“一同”使现代汉语行文更自然。
- source_word: ἀναιρεθῆναι
  choice: 处死
  rationale: 该被动不定式在这里指被夺去生命，即司法处死；“处死”准确简洁，又没有在本节中擅自指定处刑方式。
theological_decisions:
- issue: 是否将ἀναιρεθῆναι明确译为“钉十字架”
  choice: 译作“处死”
  alternative: 译作“钉十字架”或“执行死刑”
  rationale: 上下文表明处刑方式是钉十字架，但本节所用动词本身只表示使人死亡。“处死”保留原词范围，不把上下文信息直接加进该动词。
- issue: “另有两个罪犯”是否把耶稣也归为罪犯
  choice: 采用“另有两个罪犯”，使“罪犯”只修饰那两个人
  alternative: 采用可能被理解为“另外两个罪犯”的表达
  rationale: 希腊文把κακοῦργοι用于这两个人；译文应避免让现代读者误以为句法上也称耶稣为罪犯。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“被押去”符合叙事语境，“和他一同”清楚表达同行关系；全句避免古奥措辞，也不超出希腊原文明确指定处刑方式。
