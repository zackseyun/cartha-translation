  source_fidelity: 正文准确保留了耶稣祈求赦免的话及其指称的开放性，脚注也恰当标出重要异文。不过，“分了他的衣服，抽签决定各人所得”将希腊文中分衣与拈阄的紧密关系改写为先后两件较明确的动作，并增添“各人所得”这一原文未明说的结果。
  naturalness: “父啊，赦免他们，因为他们不知道自己在做什么”庄重自然。以“他们就拈阄分他的衣服”表达末句，是现代汉语中简洁、自然且常见的叙事方式。
  terminology: “父啊”“赦免”“衣服”“拈阄”均符合现代庄重语域。“说”虽未单独复制未完成时的持续/反复语感，但汉语直接引语前不宜用“一直说”来过度强化可能的反复含义；上下文和叙事体足以承载此处语法差异。
