revisions:
- from: 耶稣却一直说[a]：“父啊，赦免他们，因为他们不知道自己在做什么。”他们又分了他的衣服，抽签决定各人所得。
  to: 耶稣说[a]：“父啊，赦免他们，因为他们不知道自己在做什么。”他们就拈阄分他的衣服。
  rationale: 修订仅调整两处：将“一直说”改为汉语自然、不过度阐释未完成体的“说”；将末句改为“他们就拈阄分他的衣服”，准确表达以拈阄分配衣服，且不添加“各人所得”的明示结果。脚注锚点、异文内容和正文所依据的SBLGNT读法均予保留。
