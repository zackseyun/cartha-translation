  text: ⸂ὁ δὲ Ἰησοῦς ἔλεγεν· Πάτερ, ἄφες αὐτοῖς, οὐ γὰρ οἴδασιν τί ποιοῦσιν.⸃ διαμεριζόμενοι δὲ τὰ ἱμάτια αὐτοῦ ἔβαλον ⸀κλήρους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/034.yaml
  text: But Jesus was saying[a], “Father, forgive them, for they do not know what they are doing.” And dividing his garments, they cast lots.
translation:
  language: zh_hans
  text: 耶稣说[a]：“父啊，赦免他们，因为他们不知道自己在做什么。”他们就拈阄分他的衣服。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本没有：“父啊，赦免他们，因为他们不知道自己在做什么。”
    reason: textual_variant
lexical_decisions:
- source_word: ἔλεγεν
  choice: 一直说
  rationale: 未完成时表示持续或反复进行的言说；“一直说”比单纯的“说”更能体现这一体貌，同时在现代汉语中自然。
- source_word: Πάτερ
  choice: 父啊
  rationale: 这是直接称呼的呼格；“父啊”保留庄重的祷告语气，也不增添原文没有的“我的”。
- source_word: ἄφες
  choice: 赦免
  rationale: 在向上帝祈求宽宥冒犯者的语境中，“赦免”准确、自然，也符合庄重语域。
- source_word: αὐτοῖς
  choice: 他们
  rationale: 原文并未在本句中明确界定所指群体；“他们”保留这种指称上的开放性。
- source_word: οὐ γὰρ οἴδασιν τί ποιοῦσιν
  choice: 因为他们不知道自己在做什么
  rationale: 按 οἶδα 的通常意义译作“知道”，不扩展为较具解释性的“明白”；“自己在做什么”是自然的现代汉语表达。
- source_word: διαμεριζόμενοι
  choice: 分了
  rationale: 分词表达他们把耶稣的衣物分配开来；结合后面的抽签行为，译作“分了”简洁清楚。
- source_word: ἱμάτια
  choice: 衣服
  rationale: “衣服”是现代普通读者最自然的对应词，既准确又不显古奥。
- source_word: ἔβαλον κλήρους
  choice: 抽签决定各人所得
  rationale: 该短语指借掣签来分配物品；“抽签决定各人所得”比仅说“抽签”更清楚地表达此处功能，又未指定原文没有说明的具体份额。
- source_word: δὲ
  choice: 却／又
  rationale: 第一处连接前文并带轻微转折，译作“却”；第二处推进叙事，译作“又”，符合汉语行文习惯。
theological_decisions:
- issue: “父啊，赦免他们，因为他们不知道自己在做什么”这句话的文本真实性
  choice: 收入正文，并用脚注标明异文
  alternative: 有些抄本没有这句话
  rationale: SBLGNT 将该句印入正文，同时以文本符号标示其传抄差异。译文据所给希腊文本收入正文，并以脚注透明呈现重要异文，不替读者消解文本问题。
- issue: “他们”所指的具体群体
  choice: 保留为不加说明的“他们”
  alternative: 明确译成钉十字架的士兵、犹太领袖或在场众人
  rationale: 希腊文只有代词 αὐτοῖς，并未在本句中限定具体对象；不应在译文中加入某一解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“父啊”“赦免”维持祷告的庄重感；“一直说”体现未完成时的持续或反复意味。抽签部分略作必要的汉语明示，使古代分衣方式易于理解，但不增添具体分配细节。
