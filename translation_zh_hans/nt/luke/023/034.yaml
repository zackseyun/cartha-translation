  - severity: low
    issue: “一直说”可能过度强化未完成时
    rationale: ἔλεγεν可以表示持续、反复或叙事背景中的未完成动作；“一直说”较容易使中文读者理解为持续不断、反复说同一句话。汉语在引出直接引语时用简单过去式“说”更自然，也避免把有争议的体貌细节解释得过满。
  revised_text: 耶稣说[a]：“父啊，赦免他们，因为他们不知道自己在做什么。”他们就拈阄分他的衣服。
