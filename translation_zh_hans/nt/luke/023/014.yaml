  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἶπεν πρὸς αὐτούς· Προσηνέγκατέ μοι τὸν ἄνθρωπον τοῦτον ὡς ἀποστρέφοντα τὸν λαόν, καὶ ἰδοὺ ἐγὼ ἐνώπιον ὑμῶν ἀνακρίνας ⸀οὐθὲν εὗρον ἐν τῷ ἀνθρώπῳ τούτῳ αἴτιον ὧν κατηγορεῖτε κατ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/014.yaml
  text: He said to them[a], “You brought this man to me as one who was misleading the people, and behold, after examining him before you[b], I found no basis in this man for the charges you bring against him.”
translation:
  language: zh_hans
  text: 他对他们说：“你们把这个人带到我这里，说他在误导百姓[a]。看哪，我已当着你们的面审问过他，没有查出这个人在你们所控告他的事上有任何罪责[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“说他在使百姓背离。”希腊语动词可指使人转离，也可指误导人。
    reason: lexical_alternative
  - marker: b
    text: 或译：“我没有在这个人身上查出任何根据，证明你们对他的控告成立。”
    reason: alternative_reading
lexical_decisions:
- source_word: Προσηνέγκατέ μοι
  choice: 你们把……带到我这里
  rationale: 保留已完成的带交行动、直接对话形式和司法场景，现代汉语自然清楚。
- source_word: τὸν ἄνθρωπον τοῦτον
  choice: 这个人
  rationale: 指眼前特定的男性个体；“这个人”准确而自然。
- source_word: ὡς ἀποστρέφοντα τὸν λαόν
  choice: 说他在煽惑百姓偏离正道
  rationale: ὡς在此引出他们呈交耶稣时所声称的罪名；ἀποστρέφω含使人转离、误导之意。“煽惑……偏离正道”保留控告语气，同时不将其强化为明确的武装叛乱。
- source_word: τὸν λαόν
  choice: 百姓
  rationale: 指作为整体的民众；“百姓”符合路加叙事的语域，也有庄重而通俗的表达效果。
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留引人注意的语篇功能；“看哪”虽略显庄重，但在现代中文圣经文体中仍清楚可懂。
- source_word: ἐνώπιον ὑμῶν
  choice: 当着你们的面
  rationale: 明确强调审问是在控告者在场时公开进行，符合自然现代汉语。
- source_word: ἀνακρίνας
  choice: 已经……审问了他
  rationale: ἀνακρίνω在司法语境中指审查、审讯；“审问”准确体现彼拉多的司法行为，并补出语境中隐含的宾语。
- source_word: οὐθὲν εὗρον ... αἴτιον
  choice: 却查不出……有任何……罪状
  rationale: αἴτιον在此可指罪责、罪名或定罪根据；“查不出任何罪状”保持司法语境及其与后续控告内容的联系。
- source_word: ὧν κατηγορεῖτε κατ’ αὐτοῦ
  choice: 你们所控告的
  rationale: 简洁表达针对他的司法控告，并自然修饰“罪状”。
theological_decisions:
- issue: 彼拉多宣告的性质
  choice: 译作司法审查后查不出被控罪状
  alternative: 这个人没有罪；我在这个人身上找不到罪
  rationale: ἀνακρίνω、αἴτιον和κατηγορέω共同构成司法语境。本译文将宣告限定为对眼前控告的司法判断，不把它扩展为脱离上下文的绝对道德结论。
- issue: ἀποστρέφοντα所指的行为
  choice: 煽惑百姓偏离正道
  alternative: 误导百姓；使百姓背离
  rationale: 原词既可表示使人转离，也可表示引入歧途。正文保留控方话语的力度，脚注说明较直译的可能，避免把具体偏离对象擅自确定为罗马、律法或宗教领袖。
translation_notes:
  register: 采用现代、庄重且易懂的司法叙事语体。“当着你们的面”“审问”“控告”“罪状”共同维持法庭场景；“看哪”保留原文提示听者注意的修辞力度。所有脚注标记均已置于正文相应位置。
