language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ δὲ Πιλᾶτος εἶπεν πρὸς τοὺς ἀρχιερεῖς καὶ τοὺς ὄχλους· Οὐδὲν εὑρίσκω αἴτιον ἐν τῷ ἀνθρώπῳ τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/004.yaml
  text: Then Pilate said to the chief priests and the crowds[a], “I find no basis for a charge against this man.”
translation:
  language: zh_hans
  text: 彼拉多对祭司长们和众人说：“我查不出这个人有什么罪状[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “罪状”也可译作“过错”或“控告的根据”。希腊文αἴτιον在这里带有司法含义，指足以提出控告的理由。
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: （不单独译出）
  rationale: δέ在此是轻微的叙事连接词；汉语按上下文顺接更自然，无须机械译作“于是”或“但”
- source_word: Πιλᾶτος
  choice: 彼拉多
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: εἶπεν πρὸς
  choice: 对……说
  rationale: 准确表达λέγω与πρός组合所表示的向某些人发言。
- source_word: ἀρχιερεῖς
  choice: 祭司长们
  rationale: 指高级祭司领袖群体，并以“们”体现希腊文复数；不是说同时有多位大祭司。
- source_word: ὄχλους
  choice: 众人
  rationale: ὄχλοι为复数，语境中指聚集的人群；“众人”在现代汉语中自然且不把范围扩大为全体百姓。
- source_word: Οὐδὲν εὑρίσκω
  choice: 我查不出……有什么
  rationale: 在司法审查语境中，“查不出”自然传达彼拉多当下所得的判断，也保留完全否定的语气。
- source_word: αἴτιον
  choice: 罪状
  rationale: 此处具有司法含义，指可据以控告或定罪的事项；“罪状”比宽泛的“过错”更贴合审讯场景。
- source_word: ἐν τῷ ἀνθρώπῳ τούτῳ
  choice: 这个人有什么
  rationale: 不机械直译介词ἐν，而按中文习惯表达在此人身上查明可控告事项的意思，同时保留“这个人”的指示性。
theological_decisions:
- issue: 彼拉多判断的性质
  choice: 译为“查不出……有什么罪状”，呈现司法上的无可控告之处
  alternative: “看不出这个人有什么过错”
  rationale: 上下文是罗马总督审理控告；译文应体现法律判断，但不把本句扩展为超出审讯范围的全面神学宣告。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“彼拉多对……说”简洁顺畅；“祭司长们和众人”保留两个受话群体；“查不出……有什么罪状”清楚呈现审讯语境，并通过脚注保留αἴτιον可指一般“过错”的词义空间。
