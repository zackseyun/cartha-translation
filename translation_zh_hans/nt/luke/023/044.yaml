  text: ⸂Καὶ ἦν⸃ ⸀ἤδη ὡσεὶ ὥρα ἕκτη καὶ σκότος ἐγένετο ἐφ’ ὅλην τὴν γῆν ἕως ὥρας ἐνάτης
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/044.yaml
  text: And it was already about the sixth hour[b][a], and darkness came over the whole land until the ninth hour.
translation:
  language: zh_hans
  text: 那时大约已是第六时[a]，黑暗笼罩了全地[b]，直到第九时。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “第六时”约为中午十二点；“第九时”约为下午三点。
    reason: cultural_note
  - marker: b
    text: “全地”也可指“整片土地”或“整个大地”。希腊词γῆ既可指土地，也可指大地。
    reason: alternative_reading
lexical_decisions:
- source_word: ἤδη
  choice: 已经
  rationale: 表示叙事中的时间点已经来到；“已经”自然保留其时间推进意味。
- source_word: ὡσεὶ
  choice: 约
  rationale: 表明时间是约数，并非精确时刻。
- source_word: ὥρα ἕκτη
  choice: 第六时
  rationale: 保留原文按日出起算时辰的表达及叙事质感，并在脚注说明现代时间。
- source_word: σκότος
  choice: 黑暗
  rationale: 这是该名词在此处最直接、庄重且自然的对应词。
- source_word: ἐγένετο
  choice: 笼罩了
  rationale: 结合介词短语ἐφ’ ὅλην τὴν γῆν，以现代汉语自然表达黑暗出现并覆盖某一范围的事件性。
- source_word: ἐφ’ ὅλην τὴν γῆν
  choice: 全地
  rationale: γῆ既可指某片土地，也可指大地或全世界；“全地”简洁地保留范围上的一定开放性，脚注进一步说明。
- source_word: ἕως ὥρας ἐνάτης
  choice: 直到第九时
  rationale: 与“第六时”保持一致，忠实保留原文的计时表达；现代时间见脚注。
theological_decisions:
- issue: 黑暗所覆盖之γῆ的范围
  choice: 全地
  alternative: 全世界／整个大地
  rationale: 希腊词γῆ可指一片土地，也可指大地或世界。正文采用不强行限定为全球范围的“全地”，同时在脚注保留更广义的可能，以免消解原文的历史与宇宙性张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。正文保留古代“第六时／第九时”的表达，以贴近原文，并用脚注帮助现代读者理解；“全地”保留γῆ范围上的真实歧义。
