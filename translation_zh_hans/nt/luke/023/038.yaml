base_translation:
  language: en
  yaml_path: translation/nt/luke/023/038.yaml
  text: 'And there was also an inscription over him: “This is the King of the Jews.”[a][b][c][d]'
translation:
  language: zh_hans
  text: 在他上方还有一块牌子[a][b]，写着：“这是犹太人的[d]王。”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “牌子”也可译作“题字”“告示”或“罪状”。
    reason: lexical_alternative
  - marker: b
    text: “在他上方”也可译作“在他上面”。
    reason: lexical_alternative
  - marker: c
    text: 希腊文的语序直译为：“犹太人的王，这一位。”
    reason: lexical_alternative
  - marker: d
    text: “犹太人”一词在某些语境中也可指“犹太地区的人”；但在这里十字架上的固定称号中，译作“犹太人”更符合上下文。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγραφή
  choice: 题牌
  rationale: 这里指钉十字架时设在受刑者上方、写有文字的牌子。“题牌”既表达实物载体，也保留其题写内容的性质；脚注列出“题字”“告示牌”“罪状牌”等可能译法。
- source_word: ἐπ’ αὐτῷ
  choice: 在他上方
  rationale: ἐπί加与格在此表示相对于耶稣的位置。结合十字架刑罚场景，译作“在他上方”自然清楚，同时不武断断定牌子具体固定在何处。
- source_word: Ὁ βασιλεὺς τῶν Ἰουδαίων οὗτος
  choice: 这是犹太人的王
  rationale: 原文是无系词的名词句，οὗτος带指示和强调作用。汉语补出“是”，形成自然、庄重的标牌文字，同时保留“这人/这位”的指示意味。
- source_word: Ἰουδαίων
  choice: 犹太人
  rationale: Ἰουδαῖοι在某些语境可指“犹太地区的人”，但在钉十字架的固定称号中，“犹太人的王”符合其族群兼政治含义，也是现代汉语中恰当而明确的表达。
- source_word: δὲ καὶ
  choice: 还
  rationale: 该组合在叙事中补充另一项细节。“还”简洁地表达添加关系；句首不必机械补译连接词。
theological_decisions:
- issue: 十字架题牌的性质与含义
  choice: 按原文直接陈述题牌及其文字，不在正文中说明它是法律罪状、政治讽刺或弥赛亚宣认。
  alternative: 明确译为正式罪状，或增译其讽刺、政治或神学含义。
  rationale: 本节只报告题牌的存在及其内容。直译其文字能够保留叙事中的政治与神学张力，而不替读者预先裁定其用意。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“上面写着”使“题牌”与引文之间的关系清楚自然；四个脚注标记全部置于正文句末，分别说明词义、方位、希腊语序和族群称谓。
