  text: Ἰδὼν δὲ ὁ ἑκατοντάρχης τὸ γενόμενον ⸀ἐδόξαζεν τὸν θεὸν λέγων· Ὄντως ὁ ἄνθρωπος οὗτος δίκαιος ἦν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/047.yaml
  text: When the centurion saw what had happened[a], he glorified God, saying, “Certainly this man was righteous.”
translation:
  language: zh_hans
  text: 百夫长看见所发生的事，就把荣耀归给神，说：“这人确实是义人[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “义人”也可译为“无辜的”。这里的希腊词既可指道德上的公义，也可在司法语境中指无罪。
    reason: 保留δίκαιος在道德公义与法律无辜之间的词义空间，并避免以现代汉语中较不贴切的“公正的”作直接替代译法。
lexical_decisions:
- source_word: Ἰδὼν
  choice: 看见
  rationale: 不定过去时分词在这里表示与主句相关的先行情境；结合“就”自然表达“看见……之后／当……看见时”的时间关系。
- source_word: δὲ
  choice: 不单独译出
  rationale: δέ在此是轻微的叙事连接词；汉语靠上下文及“就”衔接更自然，不必机械加上“而”或“这时”。
- source_word: ὁ ἑκατοντάρχης
  choice: 百夫长
  rationale: 准确对应罗马军队中统领约百人的军官称谓，也是现代中文圣经语境中清楚而通行的译法。
- source_word: τὸ γενόμενον
  choice: 所发生的事
  rationale: 带冠词的分词概括百夫长刚刚目睹的情形；此译法自然，并保留其集合性而不限定为某一个细节。
- source_word: ἐδόξαζεν τὸν θεὸν
  choice: 把荣耀归给神
  rationale: δοξάζω表示尊崇、荣耀神。未完成时的延续性在本句中不宜用生硬的附加措辞过度表达；汉语以完整叙事句自然呈现。
- source_word: λέγων
  choice: 说
  rationale: 该分词引出百夫长荣耀神时所说的话；中文用“说”简洁自然。
- source_word: Ὄντως
  choice: 确实
  rationale: 表达强烈肯定，语气庄重而符合现代汉语。
- source_word: ὁ ἄνθρωπος οὗτος
  choice: 这人
  rationale: 简明准确地指向耶稣本人，不额外加入原文没有的称号。
- source_word: δίκαιος
  choice: 义人
  rationale: 保留该词在道德和神学层面的“公义”含义；同时其在审判语境中也可能表示“无辜”，故在脚注列出这一真实歧义。
- source_word: ἦν
  choice: 是
  rationale: 中文引语中无需为过去时另加“曾是”；“是”自然表达百夫长对这人的判断。
theological_decisions:
- issue: 百夫长称耶稣为δίκαιος的含义
  choice: 义人
  alternative: 无辜的；公正的
  rationale: “义人”保留δίκαιος的道德和神学分量，却不把本节扩展成原文未明说的基督论称号。鉴于路加受难叙事中的司法语境，“无辜的”也是可信理解，因此以脚注保存歧义，不在正文中武断消解。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“百夫长”和“把荣耀归给神”保持经文语体的准确性；句式简洁，不添加原文没有的称号或解释。
