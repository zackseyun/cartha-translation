  text: But they kept shouting, saying, “Crucify, crucify him!”
translation:
  language: zh_hans
  text: 他们却不断高喊着说：“把他钉在十字架上！钉在十字架上！”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在十字架上处死他！在十字架上处死他！”
    reason: 提供更明确表达处决含义的词汇性译法；正文保留与原文重复命令相称、较简洁的“钉在十字架上”。
lexical_decisions:
- source_word: οἱ δὲ
  choice: 他们却
  rationale: οἱ在上下文中作代词用，回指先前提到的众人；δέ在这里表示与彼拉多所说之话的轻微转折，用“却”自然传达。
- source_word: ἐπεφώνουν
  choice: 不断高喊
  rationale: ἐπιφωνέω表示高声呼喊，未完成时态呈现持续或反复进行的动作；“不断高喊”兼顾声音强度和持续体。
- source_word: λέγοντες
  choice: 说
  rationale: 该分词与主要动词同时发生，并引出呼喊的内容；“高喊说”在现代汉语中简洁自然。
- source_word: Σταύρου σταύρου
  choice: 钉上十字架！钉上十字架
  rationale: σταυρόω指以十字架施行处决；两个现在时命令式连续重复，表达急迫而执意的要求。中文保留原文的重复，并以两个感叹句再现呼喊的力度。
- source_word: αὐτόν
  choice: 把他
  rationale: αὐτόν是命令式动词的宾语。汉语将宾语置于第一次命令前，以“把”字句自然表达；第二次呼喊省略宾语，既避免生硬，又保留希腊文只出现一次代词的特点。
theological_decisions:
- issue: σταυρόω所指的处决方式
  choice: 钉上十字架
  alternative: 在十字架上处死
  rationale: 该动词明确指十字架刑。“钉上十字架”准确、直接，也符合现代汉语中对这一处刑方式的通常表达；正文不扩展为解释性的“处死”，以免加入原文未明说的成分。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“不断高喊”体现未完成时态；重复的短促感叹句保留群众呼喊的急迫与强烈。
