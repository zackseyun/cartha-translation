  to: 但希律也没有认定他犯了该判死刑的罪[a]，因为他把耶稣送回我们这里来了。你们看，他没有做过什么该判死刑的事。
  rationale: 修订仅澄清首句所补出的省略谓语：希律并非“未能查出”耶稣的罪，而是没有认定耶稣犯有足以判死刑的罪。其余句子保留原译对送回、现场强调和司法结论的自然表达。
