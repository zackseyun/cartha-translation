  text: ἀλλ’ οὐδὲ Ἡρῴδης, ⸂ἀνέπεμψεν γὰρ αὐτὸν πρὸς ἡμᾶς⸃· καὶ ἰδοὺ οὐδὲν ἄξιον θανάτου ἐστὶν πεπραγμένον αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/015.yaml
  text: But neither did Herod, for he sent him back to us. And look, nothing deserving of death has been done by him.
translation:
  language: zh_hans
  text: 但希律也没有认定他犯了该判死刑的罪[a]，因为他把耶稣送回我们这里来了。你们看，他没有做过什么该判死刑的事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文在这里省略了谓语，直译为“但希律也没有”；此处按上文的司法裁断补足为“没有认定他犯了该判死刑的罪”。
    reason: 说明原文的省略结构，以及为使汉语完整而补出的、由上下文限定的司法判断。
lexical_decisions:
- source_word: ἀλλ’ οὐδὲ Ἡρῴδης
  choice: 希律也没有查出他的罪
  rationale: 希腊文承接上文，省略了谓语；按彼拉多刚才所说“查不出罪来”的语境补足，使现代汉语完整自然，同时保留希律同样未发现死罪的含义。
- source_word: ἀνέπεμψεν
  choice: 送回
  rationale: 在本段叙事中，耶稣先被送到希律那里，随后又被送回彼拉多处；“送回”准确表达此处的方向和司法语境。
- source_word: γὰρ
  choice: 因为
  rationale: 引出彼拉多判断希律也未定耶稣死罪的根据。
- source_word: αὐτὸν πρὸς ἡμᾶς
  choice: 把耶稣送回我们这里
  rationale: πρὸς ἡμᾶς直译为“到我们这里”；汉语中以“耶稣”替代代词，可避免同一句中两个“他”所指混淆。
- source_word: καὶ ἰδοὺ
  choice: 你们看
  rationale: ἰδού用于唤起听众注意；“你们看”在现代汉语中自然，也保留彼拉多当众强调结论的语气。
- source_word: οὐδὲν ἄξιον θανάτου
  choice: 没有做过什么该判死刑的事
  rationale: 该短语指没有任何行为足以构成死罪；“该判死刑”清楚保留司法含义，避免“该死”在现代汉语中可能带有咒骂意味。
- source_word: ἐστὶν πεπραγμένον
  choice: 并没有做过
  rationale: 以汉语完成体表达已实施行为及其对当前审判的关联。
- source_word: αὐτῷ
  choice: 他……做过
  rationale: 将与被动分词相连的与格理解为施事者，表达没有可归于耶稣、足以判死刑的行为。
theological_decisions:
- issue: αὐτῷ与πεπραγμένον的关系
  choice: 施事含义：耶稣没有做过该判死刑的事
  alternative: 关系或范围含义：在他身上查不出该死的事
  rationale: 上下文是彼拉多对耶稣是否犯有死罪的司法判断；施事理解直接表达被查行为属于耶稣，而不是有人对耶稣做了什么。
- issue: ἀλλ’ οὐδὲ Ἡρῴδης中省略谓语的补足
  choice: 补为“也没有查出他的罪”
  alternative: 较直译为“希律也没有”或“希律也同样如此”
  rationale: 希腊文的省略可由上文自然补明；现代汉语若完全保留省略则意思悬空。所补内容限于上文明确给出的司法结论，不额外引入教义判断。
translation_notes:
  register: 采用现代、庄重而易懂的司法语言。“你们看”传达ἰδού的现场强调作用；“该判死刑”比“该死”更准确地体现审判语境。
