id: LUK.23.29
reference: Luke 23:29
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὅτι ἰδοὺ ἔρχονται ἡμέραι ἐν αἷς ἐροῦσιν Μακάριαι αἱ στεῖραι καὶ ⸀αἱ κοιλίαι αἳ οὐκ ἐγέννησαν καὶ μαστοὶ οἳ οὐκ ⸀ἔθρεψαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/029.yaml
  text: For look, days are coming in which they will say, ‘Blessed are the barren women, and the wombs that never bore, and the breasts that never nursed.’
translation:
  language: zh_hans
  text: 因为，看哪，日子将到，那时人们要说：‘不能生育的女子、从未生过孩子的子宫和从未哺乳过的乳房有福了！’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留原文引人注意并带有预告意味的表达；现代读者可以理解，同时维持庄重语体。
- source_word: αἱ στεῖραι
  choice: 不能生育的女子
  rationale: 该形容词在此作名词用，指不能生育的女性；明说“女子”符合汉语表达。
- source_word: αἱ κοιλίαι αἳ οὐκ ἐγέννησαν
  choice: 从未生养的腹胎
  rationale: 保留原文以“腹胎”转指妇女生育能力的身体意象，并以“生养”自然表达ἐγέννησαν在此处的意义。
- source_word: μαστοὶ οἳ οὐκ ἔθρεψαν
  choice: 从未哺乳的乳房
  rationale: ἔθρεψαν本义涉及喂养，在乳房这一主语下具体指哺乳；译法保留原文身体意象。
- source_word: Μακάριαι
  choice: 有福了
  rationale: 保留祝福式宣告及其反常张力，不弱化为单纯的“幸运”。
theological_decisions:
- issue: 灾难语境中对不育者的反常称福
  choice: 直译为“有福了”
  alternative: “倒是幸运的”
  rationale: 原文使用Μακάριαι，形成刻意而强烈的反转；译文不把它解释成一般处境上的走运，也不消解其神学张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。保留“看哪”及“腹胎、乳房”的先知性和身体性意象；引语用排比结构呈现。
