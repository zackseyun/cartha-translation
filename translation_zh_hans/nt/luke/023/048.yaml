  text: καὶ πάντες οἱ συμπαραγενόμενοι ὄχλοι ἐπὶ τὴν θεωρίαν ταύτην, ⸀θεωρήσαντες τὰ γενόμενα, ⸀τύπτοντες τὰ στήθη ὑπέστρεφον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/048.yaml
  text: And all the crowds that had gathered for this spectacle[a], after seeing what had happened, were returning[b], beating their chests.
translation:
  language: zh_hans
  text: 所有聚集前来观看这一场面[a]的群众，看见所发生的事后，都捶着胸回去了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这景象”。
    reason: lexical_alternative
  - marker: b
    text: 捶胸是表达悲痛、哀伤或震惊的动作。
    reason: cultural_note
lexical_decisions:
- source_word: συμπαραγενόμενοι
  choice: 聚集来
  rationale: 既表达众人一同来到现场，也采用自然简洁的现代汉语，避免把 σύν- 生硬地重复译出。
- source_word: ὄχλοι
  choice: 群众
  rationale: 概括现场成群而来的人；汉语通常不必用形态上的复数来对应希腊语复数。
- source_word: ἐπὶ τὴν θεωρίαν ταύτην
  choice: 观看这场景
  rationale: θεωρία 在此指供人观看的景象或场面；“观看这场景”保留观看意味，也比“奇观”或“表演”更中性，避免给受难场面加上不当色彩。
- source_word: θεωρήσαντες
  choice: 看见
  rationale: 与后面的“所发生的事”自然搭配，并以“以后”清楚表达该分词相对于主句动作的先行关系。
- source_word: τὰ γενόμενα
  choice: 所发生的事
  rationale: 自然表达实词化分词所指已经发生的一切，不额外限定具体内容。
- source_word: τύπτοντες τὰ στήθη
  choice: 捶着胸
  rationale: 忠实呈现身体动作，并借“着”表达伴随主句动作持续发生；不把动作直接解释为悔改、悲痛或震惊。
- source_word: ὑπέστρεφον
  choice: 都……回去了
  rationale: “回去”准确表达返回；句式结合“捶着”呈现众人陆续离开的场面，虽汉语不以专门时态形式标示希腊语未完成体。
theological_decisions:
- issue: 群众反应的内在含义
  choice: 只译出“捶着胸”这一动作，不明说其内心状态
  alternative: 明确译为他们悔改了，或他们因悲痛、震惊而捶胸
  rationale: 希腊文描述外在动作，却没有明确判定这是悔改、罪疚、哀痛还是震惊；译文保留这一神学与叙事上的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“这场景”避免“奇观”“表演”等可能带有娱乐意味的词；“捶着胸回去了”保持叙事鲜明，并让文化注释说明动作可能表达的情绪，而不在正文中替作者作神学判断。
