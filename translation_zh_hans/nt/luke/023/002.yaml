  text: ἤρξαντο δὲ κατηγορεῖν αὐτοῦ λέγοντες· Τοῦτον εὕραμεν διαστρέφοντα τὸ ἔθνος ⸀ἡμῶν καὶ κωλύοντα ⸂φόρους Καίσαρι⸃ διδόναι ⸀καὶ λέγοντα ⸀αὑτὸν χριστὸν βασιλέα εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/002.yaml
  text: And they began to accuse him[a], saying, “We found this man misleading our nation and forbidding us to pay taxes to Caesar, and saying that he himself is Messiah[c][b], a king.”
translation:
  language: zh_hans
  text: 他们就开始控告他，说：“我们发现这个人使我们的民族[a]走入歧途，阻止我们向凯撒纳税[b]，并且说自己是弥赛亚，是王[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使我们的民族走入歧途”也可译作“迷惑我们的民族”或“扰乱我们的民族”。
    reason: lexical_alternative
  - marker: b
    text: 这里的“税”指向罗马统治者缴纳的税款或贡赋。
    reason: cultural_note
  - marker: c
    text: 这句话也可理解为：“声称自己是弥赛亚王。”
    reason: alternative_reading
lexical_decisions:
- source_word: ἤρξαντο δὲ κατηγορεῖν αὐτοῦ
  choice: 他们就开始控告他
  rationale: 保留开始体意义和审判语境中的司法性用语；δέ在叙事推进中自然译为“就”。
- source_word: Τοῦτον εὕραμεν
  choice: 我们查明这个人
  rationale: 在向彼拉多提出指控的语境中，“查明”比字面的“发现”更符合汉语司法陈述，同时不表示指控确实属实。
- source_word: διαστρέφοντα τὸ ἔθνος ἡμῶν
  choice: 正在煽惑我们的民族
  rationale: διαστρέφω可指使人偏离正道，也可在政治指控中含扰乱、煽动之意；“煽惑”兼顾误导与政治动荡的色彩，而脚注保留其他可能。
- source_word: κωλύοντα φόρους Καίσαρι διδόναι
  choice: 阻止我们向凯撒纳税
  rationale: κωλύω译为“阻止”；φόρος指向罗马统治者缴纳的税或贡赋。根据语境补出不定式διδόναι隐含的主语“我们”。
- source_word: λέγοντα αὑτὸν χριστὸν βασιλέα εἶναι
  choice: 并且说自己是弥赛亚，是王
  rationale: αὑτόν的反身强调由“自己”表达；χριστός在此为带有王权含义的称号，译作“弥赛亚”；两个宾语补足语分别表达为“弥赛亚，是王”，避免将二者合并成一个固定称号。
theological_decisions:
- issue: 政治性指控中χριστόν的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处作为称号使用，并与王权指控相连；“弥赛亚”保留犹太受膏君王的背景，也不把它处理成姓名式称呼。
- issue: βασιλέα与χριστόν的关系
  choice: 是弥赛亚，是王
  alternative: 是弥赛亚王／是基督、君王
  rationale: 希腊文可将二者理解为并列的宾语补足语，也可能紧密相连。正文以两个表语保留其区分，脚注说明另一种理解，不强行消除句法上的张力。
- issue: 指控内容的真实性
  choice: 以引语原样呈现为控方声称
  alternative: 加入“诬告”等评断
  rationale: 经文本身在本节只报告指控；译文不预先判定各项控罪真假。
translation_notes:
  register: 采用现代、庄重而易懂的审判叙事语体。“凯撒”保留罗马皇帝称号的传统译名；避免使用过度古雅的“贡税”作正文。所有脚注标记均置于相应词句之后。
