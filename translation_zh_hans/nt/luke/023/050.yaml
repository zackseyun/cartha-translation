  text: Καὶ ἰδοὺ ἀνὴρ ὀνόματι Ἰωσὴφ βουλευτὴς ὑπάρχων, ⸀ἀνὴρ ἀγαθὸς καὶ δίκαιος—
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/050.yaml
  text: And behold[a], a man named Joseph, who was a council member, a good and righteous man—
translation:
  language: zh_hans
  text: 看哪，有一个名叫约瑟的人，是议会成员，是个良善又公义的人——
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: 看哪
  rationale: 保留路加用来引起注意、推进叙事的标记；“看哪”虽略显庄重，却是现代读者仍能理解的圣经叙事用语。句首的 καί 不另译为“并且”，以免中文生硬，其承接作用由上下文体现。
- source_word: ἀνὴρ
  choice: 有一个人
  rationale: 此处指一名成年男性；“有一个人”自然地引入新人物，也没有把性别信息泛化。
- source_word: ὀνόματι Ἰωσὴφ
  choice: 名叫约瑟
  rationale: 以自然的现代汉语表达希腊文的名字引介结构，并按通行译名音译 Ἰωσήφ。
- source_word: βουλευτὴς ὑπάρχων
  choice: 是议会成员
  rationale: βουλευτής 指议事机构的成员；结合受难叙事，所指很可能是犹太人的议会。“议会成员”比“议员”更少引发现代民选议会的联想，也清楚表达其身份。
- source_word: ἀνὴρ ἀγαθὸς καὶ δίκαιος
  choice: 他是个良善、公义的人
  rationale: 用“人”保留原文再次出现的 ἀνήρ，并体现强调。“良善”对应 ἀγαθός；“公义”对应 δίκαιος，保留其伦理和宗教层面的丰富含义，同时不把它缩窄为司法意义的“公正”。
theological_decisions:
- issue: 人物描述中 δίκαιος 的译法
  choice: 公义
  alternative: 正直；公正
  rationale: δίκαιος 可指合乎正道、为人正直，也可能带有公正的意味。这里是在概括约瑟的品格，“公义”能保留其在圣经语境中的道德及属神意味，却不把它处理成技术性的教义术语。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“看哪”有意保留原文的叙事聚焦作用；分号呈现两个同位性身份描述之间的停顿，句末破折号保留希腊文本在本节末与下节紧密衔接的未完语势。
