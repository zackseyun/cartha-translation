  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οὗτος οὐκ ἦν συγκατατεθειμένος τῇ βουλῇ καὶ τῇ πράξει αὐτῶν— ἀπὸ Ἁριμαθαίας πόλεως τῶν Ἰουδαίων, ὃς ⸀προσεδέχετο τὴν βασιλείαν τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/051.yaml
  text: This man had not agreed with their plan and action—he was from Arimathea[a], a city of the Jews, and he was waiting for the kingdom of God.
translation:
  language: zh_hans
  text: 这人没有赞同他们的决定和行动[a]。他来自亚利马太，那是犹太人的一座城；他一直等候神的国。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们的计划和作为”。
    reason: βοuλή可侧重计划、意图或决定，πρᾶξις可译为行动、行为或作为；脚注保留这一词义幅度。
lexical_decisions:
- source_word: οὗτος
  choice: 这人
  rationale: 承接上一节的约瑟，并保留指示代词所带的强调，比单用“他”更贴近原文。
- source_word: οὐκ ἦν συγκατατεθειμένος
  choice: 并没有赞同
  rationale: 迂回结构表达此前已经形成并持续有效的不赞同立场；“并没有赞同”在现代汉语中自然，也清楚表明约瑟与他们的决定保持距离。
- source_word: τῇ βουλῇ καὶ τῇ πράξει αὐτῶν
  choice: 他们的决议和行动
  rationale: βουλή在此指商议后形成的意向或决定，不宜译成作为机构的“议会”；πρᾶξις则指实际付诸实行的行动。并列翻译保留“决定—实行”的区别。
- source_word: ἀπὸ Ἁριμαθαίας πόλεως τῶν Ἰουδαίων
  choice: 来自亚利马太，就是犹太人的一座城
  rationale: 保留原文“亚利马太”与“犹太人的一座城”的同位关系，不擅自把“犹太人的”限定为纯地理意义的“犹太地”。
- source_word: προσεδέχετο
  choice: 一直等候
  rationale: 未完成时表达持续的、带着期待的等候；“一直等候”既体现延续性，也避免“寻找”所暗示的主动搜寻。
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: 神的国
  rationale: 这是路加福音中清楚而通行的表达，保留“国度”与神掌权两方面的含义，不在正文中缩减为单一解释。
theological_decisions:
- issue: 约瑟与公议会处置耶稣一事的关系
  choice: 表述为他没有赞同“他们的决议和行动”
  alternative: 表述为他没有投赞成票，或没有参与定罪
  rationale: 原文明确说明约瑟不赞同其决定和实际行动，却没有具体交代投票程序，也没有逐项界定他的参与程度，因此不加入历史重构。
- issue: “神的国”的含义
  choice: 保留“神的国”
  alternative: 译为“神的统治”
  rationale: 原文βασιλεία可涉及国度或掌权；采用传统而自然的“神的国”，保留其语义张力，不在翻译中只取动态统治这一层面。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“就是犹太人的一座城”保留原文略显突出的同位说明；以分号连接人物来源与持续等候神国的描述，使句法清晰。脚注标记置于其实际解释的短语之后，而非地名之后。
