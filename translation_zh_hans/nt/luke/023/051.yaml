revisions:
- from: 这人并没有赞同他们的决议和行动[a]。他来自亚利马太，就是犹太人的一座城；他一直等候神的国。
  to: 这人没有赞同他们的决定和行动[a]。他来自亚利马太，那是犹太人的一座城；他一直等候神的国。
  rationale: 修订仅消除中文中“决议”可能引入的正式表决含义，并改善同位说明的自然度；保留约瑟对他们的决定及行动均不赞同这一原文重点，也保留“犹太人的一座城”及等候神国的表达。
