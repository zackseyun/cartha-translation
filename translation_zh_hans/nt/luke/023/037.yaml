  text: καὶ λέγοντες· Εἰ σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων, σῶσον σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/037.yaml
  text: and saying[a], “If you are the King of the Jews, save yourself.”
translation:
  language: zh_hans
  text: 并说[a]：“你若是犹太人的王，就救你自己吧！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“犹太地人的王。”希腊语 Ἰουδαίων 按语境可指犹太人，也可指犹太地人。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: 又
  rationale: 承接上一节兵丁戏弄耶稣的动作；现代汉语叙事中用“又”自然地连接并列行为。
- source_word: λέγοντες
  choice: 说
  rationale: 保留现在主动分词的基本言说含义，不把上下文中的嘲弄意味直接加入动词。
- source_word: Εἰ
  choice: 若
  rationale: 表达带有挑衅意味的条件，不把它译成表示承认事实的“既然”。
- source_word: σὺ εἶ
  choice: 你若是
  rationale: “你”体现原文显式代词的强调，同时符合现代汉语条件句语序。
- source_word: ὁ βασιλεὺς
  choice: 王
  rationale: 在“犹太人的王”这一特定称号中，汉语无需另加冠词即可表达其特指性。
- source_word: τῶν Ἰουδαίων
  choice: 犹太人的
  rationale: 在受难叙事中，这是对耶稣的政治—弥赛亚性称号，也是指控和嘲弄所用的固定表达；“犹太人”最符合现代汉语通常理解。
- source_word: σῶσον
  choice: 救救
  rationale: 传达第二人称单数命令语气；动词重叠使汉语中的挑衅口吻自然，同时保留与路加福音中“救”这一用词的联系。
- source_word: σεαυτόν
  choice: 你自己
  rationale: 直接表达反身宾语，并保留对受话者自身的强调。
theological_decisions:
- issue: 如何翻译 βασιλεὺς τῶν Ἰουδαίων 这一带有嘲弄意味的王号
  choice: 犹太人的王
  alternative: 犹太地人的王
  rationale: 该短语在钉十字架的语境中既关联对耶稣的政治指控，也形成其王权的反讽。“犹太人的王”是现代汉语中清楚且惯常的表达；同时以脚注保留 Ἰουδαίων 可能具有地域意义的译法。
- issue: 是否在 λέγοντες 中明说“嘲笑”
  choice: 说
  alternative: 嘲笑他说
  rationale: 嘲弄意味由条件式挑战和上下文清楚呈现；不把该语用含义写入本身仅表示“说”的分词，可避免过度解释。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事表达。“救救你自己吧”准确传达命令式挑战的嘲弄口吻，却不额外添加“嘲笑”等解释性词语。
