base_translation:
  language: en
  yaml_path: translation/nt/luke/023/043.yaml
  text: And he said to him[a], “Truly I tell you, today you will be with me in paradise.”
translation:
  language: zh_hans
  text: 耶稣对他说[a]：“我实在告诉你：今天，你将和我一同在乐园里。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译（可能性较小）：“我今天实在告诉你：你将和我一同在乐园里。”古希腊文本原无现代标点；这种理解把“今天”与“我告诉你”相连，而不是与“你将和我一同在乐园里”相连。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀμήν
  choice: 实在
  rationale: 在耶稣引出郑重宣告的句式中，译为“实在”既自然庄重，也保留其确认和权威语气。
- source_word: σοι λέγω
  choice: 我告诉你
  rationale: 这是福音书中常见的宣告句式；“我告诉你”符合现代汉语习惯，并准确传达原文。
- source_word: σήμερον
  choice: 今天
  rationale: 此副词最自然地修饰“你要……在”，表示应许将在当天实现；因原始希腊文本没有现代标点，另一种连接方式在脚注中保留。
- source_word: μετ’ ἐμοῦ
  choice: 和我一同
  rationale: 直接传达“与我同在”的个人性关系；“一同”使现代汉语表达顺畅，同时不增加原文之外的含义。
- source_word: ἔσῃ
  choice: 你要……在
  rationale: 准确表达εἰμί的第二人称单数将来时，并采用自然的现代汉语将来表达。
- source_word: παραδείσῳ
  choice: 乐园
  rationale: “乐园”是παράδεισος在此末世语境中的通行且准确译法，指蒙福之处，但不额外界定其具体性质。
theological_decisions:
- issue: σήμερον（“今天”）在依赖标点断句的话语中所修饰的成分，以及由此涉及的中间状态问题
  choice: 将“今天”连接于“你要和我一同在乐园里”
  alternative: 将“今天”连接于“我实在告诉你”
  rationale: 古希腊抄本原无现代标点，因此断句包含解释。按通行的希腊语语序和上下文，“今天”较自然地限定应许实现的时间，而非说话的时间。经文并未进一步说明“乐园”的性质；为保留真实存在且具有神学影响的另一种理解，脚注予以说明。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“耶稣”补出说话者以符合独立经节呈现的清晰度；“乐园”不用作专名大写概念，也不对其状态作超出原文的界定。脚注标记[a]已在正文中出现。
