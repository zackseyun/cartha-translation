  text: καὶ ⸀ἔλεγεν· Ἰησοῦ, μνήσθητί ⸀μου ὅταν ἔλθῃς ⸂ἐν τῇ βασιλείᾳ⸃ σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/042.yaml
  text: And he said[a], “Jesus, remember me when you come in your kingdom.”
translation:
  language: zh_hans
  text: 他说：“耶稣啊，当你在你的国度中来临时[a]，求你记念我。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在你的国度中来临”也可理解为“带着你的王权来临”。有些抄本将“在你的国度中”作“进入你的国度”；SBLGNT正文作“在你的国度中”。
    reason: 说明ἐν τῇ βασιλείᾳ σου与“来临”搭配的语义开放性，并交代相关抄本异文。
lexical_decisions:
- source_word: καὶ ἔλεγεν
  choice: 他又说
  rationale: καί在叙事中承接上文，译作“又”；未完成时ἔλεγεν在此自然地用汉语简单过去叙述“说”来表达，不强加持续意味。
- source_word: Ἰησοῦ
  choice: 耶稣啊
  rationale: 这是人名Ἰησοῦς的呼格；“啊”自然标明直接呼唤。
- source_word: μνήσθητί μου
  choice: 求你记念我
  rationale: 命令式在请求语境中用“求你”符合现代汉语；“记念”既保留“记得”的基本意义，也可含为所记念之人采取行动的语用意味，而不把该含义明说过度。
- source_word: ὅταν ἔλθῃς
  choice: 来临时
  rationale: ὅταν加虚拟式指向将来的情形；“来临时”简洁保留未来期待，不额外规定时间或方式。
- source_word: ἐν τῇ βασιλείᾳ σου
  choice: 在你的国里
  rationale: 按SBLGNT的ἐν直译其位置或领域意味；βασιλεία译作“国”，同时容纳国度与王权统治的语义张力。与ἔρχομαι连用也可能理解为“带着你的王权来临”或具有方向意味，故以脚注说明。
theological_decisions:
- issue: 耶稣来临与其国的末世含义
  choice: 保留“在你的国里来临”的开放表达
  alternative: 进入你的国时；带着你的王权来临时
  rationale: 经文确认说话者期待耶稣将来的国及其来临，却没有在本节界定完整的时间顺序或末世体系；译文不替经文消除这一张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“记念”保留圣经请求语境中的厚度；“你的国”避免展开为特定宗派的末世解释。脚注标记置于整句引语之后。
