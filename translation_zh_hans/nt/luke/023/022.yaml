reference: Luke 23:22
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ δὲ τρίτον εἶπεν πρὸς αὐτούς· Τί γὰρ κακὸν ἐποίησεν οὗτος; οὐδὲν αἴτιον θανάτου εὗρον ἐν αὐτῷ· παιδεύσας οὖν αὐτὸν ἀπολύσω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/022.yaml
  text: And he said to them a third time[a], “Why? What evil has this man done? I have found in him no grounds for death. Therefore, after disciplining him[c][b], I will release him.”
translation:
  language: zh_hans
  text: 彼拉多第三次对他们说：“为什么呢？这个人做了什么恶事？[a]我查不出他有什么该判死刑的罪状。[b]所以，我要责罚他[c]，然后释放他。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他究竟做了什么恶事？”开头的 Τί 可能是一个省略式的质问，引出后面的完整问题。
    reason: lexical_alternative
  - marker: b
    text: 直译“我在他身上找不到任何死罪的理由”；也可译“我查不出他有任何该死的罪”或“没有判他死刑的根据”。
    reason: lexical_alternative
  - marker: c
    text: 或译“惩罚他”；也可能更具体地指“鞭打他”。希腊语 παιδεύσας 表示带有惩戒性质的处罚，但这个词本身没有说明具体方式。
    reason: lexical_alternative
lexical_decisions:
- source_word: τρίτον
  choice: 第三次
  rationale: 这是表示重复次数的副词性宾格；“第三次”在现代汉语中自然，并保留叙事的强调。
- source_word: Τί γὰρ κακὸν ἐποίησεν οὗτος;
  choice: 为什么呢？这个人做了什么恶事？
  rationale: Τί 可视为省略式的质问，γάρ 引出彼拉多反驳众人的理由。“为什么呢？”保留短促的抗议语气，随后完整提出问题；“恶事”也保留 κακόν 的道德分量。
- source_word: οὐδὲν αἴτιον θανάτου
  choice: 没有什么该判死刑的罪状
  rationale: αἴτιον 在此具有司法语境中的“理由、罪由、根据”之意；此译清楚表达没有足以判处死刑的依据，同时避免把它仅仅理解为一般性的过错。
- source_word: εὗρον ἐν αὐτῷ
  choice: 我查不出他有什么
  rationale: “查不出”自然传达彼拉多经过审查所得的当前裁定；汉语不必机械保留“在他里面”，但仍明确以此人为审查对象。
- source_word: παιδεύσας
  choice: 责罚他
  rationale: παιδεύω 在这里指带有惩戒性质的处罚。“责罚”既表达实际惩处，又不擅自限定为某一种具体刑罚。
- source_word: ἀπολύσω
  choice: 释放他
  rationale: 在司法语境中指将被拘押或受审者放走；“释放”正式、清楚，也符合本节场景。
theological_decisions:
- issue: 彼拉多所提议的 παιδεύσας 究竟指何种处罚
  choice: 正文采用概括性的“责罚”，不指定具体刑罚。
  alternative: 可译“惩罚”；也可能更具体地指“鞭打”。
  rationale: 经文一方面宣告耶稣没有该死的罪状，另一方面仍提议施加较轻的处罚，形成有意保留的张力。该动词本身没有明确指定处罚方式，因此不把历史情境中的一种可能做法直接写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的司法叙事用语。“彼拉多”由上下文补明说话者，使独立经节自然清楚；问句保留原文先短促质问、再提出完整问题的语流。“责罚”避免把 παιδεύσας 过度具体化。所有脚注标记均置于正文相应语句之后。
