  text: κατακολουθήσασαι δὲ ⸀αἱ γυναῖκες, αἵτινες ἦσαν συνεληλυθυῖαι ⸂ἐκ τῆς Γαλιλαίας αὐτῷ⸃, ἐθεάσαντο τὸ μνημεῖον καὶ ὡς ἐτέθη τὸ σῶμα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/055.yaml
  text: The women who had come with him from Galilee followed and saw the tomb and how his body was laid[a].
translation:
  language: zh_hans
  text: 那些从加利利与他一同来的妇女[a]跟着去，看见了坟墓，并看见他的遗体是怎样被安放的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从加利利一路陪伴他而来的妇女”。
    reason: 保留συνεληλυθυῖαι…αὐτῷ可译为“与他一同来”或较自然地表达为“陪伴他而来”的词义选择。
lexical_decisions:
- source_word: κατακολουθήσασαι
  choice: 跟在后面
  rationale: 该词为不定过去时分词，表示妇女们随后跟去。译作“跟在后面”既保留跟随的动作，也以现代汉语自然地交代事件先后。
- source_word: δέ
  choice: 不单独译出
  rationale: δέ在此是轻微的叙事衔接。中文承接上文时无需机械加入“现在”或“于是”，省译更自然，也不损害语义。
- source_word: αἱ γυναῖκες
  choice: 那些……妇女
  rationale: 冠词指向叙事中已知的一群妇女；“那些”在中文中自然体现这一特指关系。
- source_word: αἵτινες ἦσαν συνεληλυθυῖαι ἐκ τῆς Γαλιλαίας αὐτῷ
  choice: 从加利利与他一同来的
  rationale: 该迂回结构表示先于本节主要动作发生的同行经历。“与他一同来”保留了出发地和同行关系，而未将其过度解释为某种特定身份。
- source_word: ἐθεάσαντο
  choice: 察看了／看见
  rationale: θεάομαι可含有留意观看之意。对坟墓译作“察看了”，对安放遗体的方式译作“看见”，在中文中自然，并保留她们亲眼观察的意味。
- source_word: τὸ μνημεῖον
  choice: 坟墓
  rationale: 在埋葬耶稣的语境中，“坟墓”准确而通俗，也符合现代标准汉语。
- source_word: ὡς ἐτέθη
  choice: 是怎样安放的
  rationale: ὡς在此表示方式，ἐτέθη是τίθημι的被动式。“是怎样安放的”保留方式含义和被动语态，措辞庄重自然。
- source_word: τὸ σῶμα αὐτοῦ
  choice: 他的遗体
  rationale: σῶμα本义为“身体”，在死亡和安葬语境中译作“遗体”更符合现代汉语习惯，同时准确指向被安放的身体。
theological_decisions:
- issue: 分词κατακολουθήσασαι与主要动词ἐθεάσαντο之间的叙事关系
  choice: 用连续动作表达为“跟在后面，察看了”
  alternative: 较形式化地译作“跟去以后，她们察看了”
  rationale: 这是句法和文体选择，并非教义判断。译文保留先跟随、后观看的自然事件顺序，同时避免生硬复制希腊语分词结构。
- issue: 妇女与耶稣同行关系的表达
  choice: “从加利利与他一同来的”
  alternative: “从加利利一路陪伴他而来的”
  rationale: 原文可表达一同前来或陪同而来。正文采用较贴近词面且不过度限定关系的说法，另一自然理解列入脚注，以保留词义幅度。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“妇女”“坟墓”“遗体”“安放”符合安葬场景；不加入原文没有的显性时间副词或教派性解释。
