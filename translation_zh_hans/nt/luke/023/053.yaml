  source_fidelity: 译文基本准确传达了καθελών、ἐνετύλιξεν、σινδόνι、ἔθηκεν及墓穴此前未曾安葬任何人的信息。但“石凿的墓穴”在现代汉语中搭配略不自然，且可更明确地表达λαξευτῷ为“从岩石中凿成”。
  naturalness: “他把耶稣取下来”清楚自然；“用细麻布裹好”及“安放”合乎庄重叙事语体。“一座石凿的墓穴”不够地道，改为“一个从岩石中凿成的墓穴”更自然明确。“从未安放过人”虽可理解，但“还没有安葬过任何人”更符合墓葬语境，并准确表达οὔπω（截至当时尚未）。
  terminology: “细麻布”“墓穴”“安放”均可接受。将λαξευτός译作“从岩石中凿成”避免“石凿的”可被理解为以石凿工具凿成的歧义；“安葬过任何人”恰当地对应κείμενος在此处的安葬状态，不引入额外礼仪细节。
