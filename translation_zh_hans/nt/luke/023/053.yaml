  text: καὶ ⸀καθελὼν ἐνετύλιξεν αὐτὸ σινδόνι, καὶ ἔθηκεν ⸀αὐτὸν ἐν μνήματι λαξευτῷ οὗ οὐκ ἦν ⸂οὐδεὶς οὔπω⸃ κείμενος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/053.yaml
  text: And after taking him down[a], he wrapped him in a linen cloth and placed him in a tomb cut in stone[b], where no one had yet been laid.
translation:
  language: zh_hans
  text: 他把耶稣取下来，用细麻布裹好，安放在一个从岩石中凿成的墓穴里；那里还没有安葬过任何人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθελὼν
  choice: 把耶稣取下来
  rationale: 该不定过去时分词表示先把耶稣的身体从十字架上取下；补出“耶稣”使中文指代清楚，却未添加原文语境之外的信息。
- source_word: ἐνετύλιξεν
  choice: 裹好
  rationale: 表达用布包裹遗体的动作；“好”使现代汉语自然，并体现动作完成，不增加具体殓葬程序。
- source_word: σινδόνι
  choice: 用细麻布
  rationale: σινδών指麻布，且此处与格表示工具或材料；“细麻布”沿用清楚、庄重的圣经语体，又不采用解释性较强的“裹尸布”。
- source_word: ἔθηκεν
  choice: 安放
  rationale: τίθημι在安葬语境中指将遗体放置于墓中；“安放”自然庄重。
- source_word: μνήματι λαξευτῷ
  choice: 一座石凿的墓穴
  rationale: μνῆμα是坟墓或墓穴，λαξευτός表示经凿刻而成；“石凿的墓穴”简洁传达岩石凿成的墓葬环境。
- source_word: οὗ οὐκ ἦν οὐδεὶς οὔπω κείμενος
  choice: 那里从未安放过人
  rationale: 表达此前尚无人被放置其中，即墓穴从未使用；中文采用主动式存在表达更自然，同时保留“尚未有任何人”的范围。
theological_decisions:
- issue: 墓穴类型及此前是否使用
  choice: 耶稣被安放在石凿而成、从未安放过人的墓穴中
  alternative: “那里还没有人躺过”
  rationale: 经文作历史性描述。“安放过人”贴合安葬语境，也不从平行经文引入墓主身份或其他细节。
translation_notes:
  register: 采用现代、庄重而通俗的叙事语言。以“他”承接上文的约瑟，以“耶稣”澄清希腊文代词所指；分号清楚连接墓穴说明。无需脚注，因为主要词义可直接自然表达，且不存在必须保留的实质歧义。
