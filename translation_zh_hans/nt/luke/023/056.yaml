  text: ὑποστρέψασαι δὲ ἡτοίμασαν ἀρώματα καὶ μύρα. Καὶ τὸ μὲν σάββατον ἡσύχασαν κατὰ τὴν ἐντολήν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/056.yaml
  text: Then after returning[a], they prepared spices and ointments. And on the Sabbath they rested according to the commandment[b],
translation:
  language: zh_hans
  text: 她们回来后[a]，预备了香料和香膏[b]。在安息日，她们遵照诫命休息。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“她们回来后，就……”。希腊文分词表示“回来”这一动作先于“预备”。
    reason: 语法与译法说明
  - marker: b
    text: “香膏”也可译作“香油”或“芳香油”。
    reason: 词义备选
lexical_decisions:
- source_word: ὑποστρέψασαι
  choice: 回来后
  rationale: 不定过去时主动分词，阴性复数，承接上文的妇女；“回来后”自然表达该动作先于“预备”发生。
- source_word: δὲ
  choice: （由句序体现叙事推进）
  rationale: 此处 δέ 是轻微的承接、推进语气；现代汉语无需机械增译连词，前后次序已足以表达。
- source_word: ἡτοίμασαν
  choice: 预备了
  rationale: 准确表达为随后用途作准备，符合现代汉语叙事语体。
- source_word: ἀρώματα
  choice: 香料
  rationale: 在安葬语境中指用于遗体的芳香物质；“香料”清楚自然，并与 μύρα 区分。
- source_word: μύρα
  choice: 香膏
  rationale: 指带香气的油膏或膏状香料；“香膏”既保留其芳香和膏油性质，也适合安葬语境。
- source_word: τὸ μὲν σάββατον
  choice: 到了安息日
  rationale: 作为时间表达自然呈现安息日的到来；μέν 在此轻微衔接，不必单独译出。
- source_word: ἡσύχασαν
  choice: 歇息了
  rationale: 在安息日语境中表示停止活动、休息；“歇息”既准确又保留经文庄重感。
- source_word: κατὰ τὴν ἐντολήν
  choice: 遵照诫命
  rationale: 表达依照特定诫命行事，并保留 ἐντολήν 的单数含义，不在正文中作解释性扩展。
theological_decisions:
- issue: “诫命”所指
  choice: 正文保留为“诫命”
  alternative: 明译为“有关安息日的诫命”或泛指“上帝的命令”
  rationale: 上下文指向律法中有关守安息日的诫命，但原文只说“那诫命”；正文不扩写，以免把上下文解释直接并入译文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“预备”“歇息”保留圣经叙事的端正规范感，同时避免生硬古语。脚注标记均置于其实际说明的词语之后。
