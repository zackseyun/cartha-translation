  text: οἱ δὲ ἐπέκειντο φωναῖς μεγάλαις αἰτούμενοι αὐτὸν σταυρωθῆναι, καὶ κατίσχυον αἱ φωναὶ ⸀αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/023.yaml
  text: But they kept pressing with loud voices[a], asking that he be crucified, and their voices prevailed.
translation:
  language: zh_hans
  text: 但他们不断高声催逼，要求把他钉在十字架上；他们的声音[a]占了上风。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文在前后两处都用了同一个表示“声音”的词；末句也可译作“他们的声音越来越占上风”。
    reason: 说明原文的词语重复，并保留未完成时所可能强调的持续进展。
lexical_decisions:
- source_word: ἐπέκειντο
  choice: 催逼
  rationale: 未完成时表达持续施压；“催逼”兼顾紧迫、强硬和延续性，符合彼拉多受众人逼迫的语境。
- source_word: φωναῖς μεγάλαις
  choice: 大声
  rationale: 按方式理解与格短语，以自然现代汉语表达高声施压，同时不过度限定为某一种喊叫。
- source_word: αἰτούμενοι
  choice: 要求
  rationale: αἰτέω的核心义为请求、求取；此处因敌对而强硬的司法语境，用“要求”较“请求”自然，又不必加强为“强令”。
- source_word: αὐτὸν σταυρωθῆναι
  choice: 把他钉十字架
  rationale: 准确传达宾格加被动不定式的内容；汉语“把他钉十字架”自然地表达让他遭受钉刑。
- source_word: κατίσχυον
  choice: 占了上风
  rationale: 表达这些声音逐渐胜过反对力量并最终奏效；中文用完成式叙事更自然，而持续过程可由上下文体现。
- source_word: αἱ φωναὶ αὐτῶν
  choice: 他们的呼声
  rationale: φωναί在此可指声音或呼喊；“呼声”既保留听觉意象，也自然表达众人的集体喊叫。
