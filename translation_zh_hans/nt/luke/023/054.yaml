  text: καὶ ἡμέρα ἦν ⸂παρασκευῆς, καὶ⸃ σάββατον ἐπέφωσκεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/054.yaml
  text: And it was the day of Preparation[a], and the Sabbath was dawning.
translation:
  language: zh_hans
  text: 那天是预备日，安息日也快开始了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“安息日正渐渐破晓。”这里的希腊词既可表示“破晓”，也可表示“开始”；本节所说的是安息日在傍晚开始。
    reason: 保留 ἐπέφωσκεν 的字面形象和词义选择，同时说明此处的时间背景。
lexical_decisions:
- source_word: παρασκευῆς
  choice: 预备日
  rationale: 在当时犹太希腊语用法中，这个词常指安息日前作预备的那一天。译作“预备日”既保留原词含义，也体现它已成为特定日子的称呼；不直接译作“星期五”，以免用解释性名称取代原文措辞。
- source_word: σάββατον
  choice: 安息日
  rationale: 希腊文虽未用冠词，但上下文明指每周的安息日；汉语“安息日”本身已可表达这一特定所指。
- source_word: ἐπέφωσκεν
  choice: 快开始了
  rationale: 该未完成时动词本义可表示“渐渐破晓”，也可表示一段时间正在开始。这里所指是安息日在傍晚临近开始，而不是清晨到来；“快开始了”在现代汉语中自然表达该语境，同时把原词的形象性与词义张力保留在脚注中。
- source_word: ἡμέρα ἦν παρασκευῆς
  choice: 那天是预备日
  rationale: 以自然汉语表达该属格结构，并用“那天”承接叙事语境。
- source_word: καὶ
  choice: 也
  rationale: 第二个 καί 连接两个同时相关的时间陈述；译作“也”保留并列关系，又符合现代汉语叙事习惯。
theological_decisions:
- issue: ἐπέφωσκεν 与安息日开始时间的关系
  choice: 正文表达安息日即将在傍晚开始
  alternative: 直译为“安息日渐渐破晓”
  rationale: 犹太历日从傍晚起算，埋葬叙事也要求在安息日开始前完成相关事务。因此正文避免让现代读者误以为此处是清晨，同时以脚注保留希腊动词“破晓”的字面形象及其可能译法。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“预备日”作为特定日称保留原文的犹太历法用语；“快开始了”避免“破晓”在汉语中造成清晨的误解。
