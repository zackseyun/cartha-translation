revisions:
- from: 于是，他们全体都起来，把耶稣押到彼拉多面前。[a]
  to: 他们全体的人都起来了，把耶稣带到彼拉多那里。
  rationale: 修订保留ἅπαν的“全体”与πλῆθος的“人众”双重语义，并将ἄγω译为较中性的“带到”，不把司法背景所可推知的押解状态写成该动词本身的明示内容。原英文审计轨迹的“whole assembly/multitude”词义幅度由脚注保留。脚注仅说明词汇替代，因主文已不设脚注锚点，故不在正文附标记。
