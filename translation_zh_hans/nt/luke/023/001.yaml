  text: Καὶ ἀναστὰν ἅπαν τὸ πλῆθος αὐτῶν ἤγαγον αὐτὸν ἐπὶ τὸν Πιλᾶτον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/001.yaml
  text: And the whole assembly of them rose and led him to Pilate[a].
translation:
  language: zh_hans
  text: 他们全体的人都起来了，把耶稣带到彼拉多那里。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: 于是
  rationale: 承接前文并推进叙事次序；现代汉语用“于是”比直译“并且”更自然，且未增添明显的因果解释。
- source_word: ἀναστὰν
  choice: 起来
  rationale: 该不定过去时分词表示先于主要动词发生的动作；“起来”简洁自然地保留这一动作次序。
- source_word: ἅπαν τὸ πλῆθος αὐτῶν
  choice: 他们全体
  rationale: ἅπαν强调全部，πλῆθος指聚集的一群人。结合上下文，“他们全体”既表达群体的完整性，也避免把该群体过度限定为正式机构；其词汇歧义通过脚注保留。
- source_word: ἤγαγον
  choice: 押到
  rationale: ἄγω本义为“带领、带到”；在耶稣受拘押并被送往彼拉多的司法语境中，“押到”自然表达受控制地带往某处，但不额外说明具体押送方式。
- source_word: αὐτὸν
  choice: 耶稣
  rationale: 原文为“他”，指向上文的耶稣。中文在段落或章节起首明确人名可避免指代含混，同时不改变所指。
- source_word: ἐπὶ τὸν Πιλᾶτον
  choice: 到彼拉多面前
  rationale: ἐπί加宾格并用于移动动词后，表示朝向某人；“到彼拉多面前”既保留移动终点，也自然体现被带去接受其审理的场景。
- source_word: Πιλᾶτον
  choice: 彼拉多
  rationale: 采用现代中文圣经传统中通行且易识别的人名译法。
theological_decisions:
- issue: 司法语境中群体主语的表达
  choice: 他们全体
  alternative: 他们所有人／他们那一大群人／全体会众
  rationale: 原文πλῆθος可指人数众多的群体，也可泛指聚集的人群。“他们全体”保留ἅπαν的整体性，不把该群体武断地界定为随意聚集的群众或某一正式宗教机构。
- issue: ἄγω在受审叙事中的力度
  choice: 押到
  alternative: 带到／领到
  rationale: 上下文明确耶稣处于被控制并移交审理的状态，因此“押到”符合场景；但原词本身并不具体描写暴力或捆绑，译文也不加入这些细节。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“于是……起来，把……押到……”符合普通话事件推进方式；脚注保留πλῆθος在“全体群体”与“一大群人”之间的词义幅度。
