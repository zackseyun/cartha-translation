  yaml_path: translation/nt/luke/023/010.yaml
  text: And the chief priests and the scribes stood there[a], vehemently accusing him.
translation:
  language: zh_hans
  text: 祭司长和经学家站在那里，极力控告他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἱστήκεισαν
  choice: 站在那里
  rationale: 该形式在这里表达过去持续的状态，即他们站着并在场；“站在那里”自然地保留了叙事的场景感。
- source_word: δὲ
  choice: （不单独译出）
  rationale: δέ是轻微的叙事连接词；现代汉语在此无需用“而”或“但”，省译可使句子自然，又不造成原文没有的强烈转折。
- source_word: ἀρχιερεῖς
  choice: 祭司长
  rationale: 这是福音书中对主要祭司领袖的惯常称呼；并不表示同时有多位在任的大祭司。
- source_word: γραμματεῖς
  choice: 经学家
  rationale: 此词指研习、讲解并运用律法的专业人士；“经学家”比容易使现代读者联想到单纯抄写工作的“文士”更清楚，同时不过度扩展为“律法教师”。
- source_word: εὐτόνως
  choice: 极力
  rationale: 该副词表示强烈、紧迫而有力的程度；“极力”能自然修饰“控告”，并保留其敌对强度。
- source_word: κατηγοροῦντες
  choice: 控告
  rationale: 现在分词表示与站立同时持续进行的行动；“控告”兼具法律指控和叙事语境所需的正式意味。
- source_word: αὐτοῦ
  choice: 他
  rationale: κατηγορέω所带属格表示受控告的对象；现代汉语直接说“控告他”最自然。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“祭司长”保留传统且准确的职衔；“经学家”凸显γραμματεῖς在犹太宗教与律法领域的专业角色。句式简洁，保留他们在场并持续猛烈指控耶稣的画面。
