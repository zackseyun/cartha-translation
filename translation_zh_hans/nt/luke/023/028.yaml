base_translation:
  language: en
  yaml_path: translation/nt/luke/023/028.yaml
  text: But turning toward them[a], Jesus said, “Daughters of Jerusalem, do not weep for me; instead, weep for yourselves and for your children,”
translation:
  language: zh_hans
  text: 耶稣转身对她们说：“耶路撒冷的女儿们[a]，不要为我哭；倒要为你们自己和你们的儿女哭。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“耶路撒冷的妇女们”。希腊文直译是“耶路撒冷的女儿们”；正文保留了这种先知话语式的称呼。
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς δὲ πρὸς αὐτὰς
  choice: 耶稣转身对她们说
  rationale: 不定过去时分词表示耶稣转向那些妇女的动作；汉语用“转身……说”自然地体现该动作与主句的衔接。δὲ在此是轻微的叙事转折，汉语无需另加“但”，以免语气过重。
- source_word: Θυγατέρες Ἰερουσαλήμ
  choice: 耶路撒冷的女儿们
  rationale: 保留原文“女儿们”的亲属性、群体性称呼，以及先知话语式的经文回响；脚注说明其语境含义。
- source_word: μὴ κλαίετε ἐπ’ ἐμέ
  choice: 不要为我哭
  rationale: 现在时命令式加μή可表示禁止正在进行或一般性的行动；“不要……哭”保留这种开放性，不限定为“别再哭了”。ἐπί在此标明哀哭的对象或缘由，译作“为我”自然。
- source_word: πλὴν ἐφ’ ἑαυτὰς κλαίετε
  choice: 倒要为你们自己……哭
  rationale: πλήν引出纠正性的对比，“倒要”清楚表达“不为我，反要为自己”的转向，并保留前后结构的对应。
- source_word: τὰ τέκνα ὑμῶν
  choice: 你们的儿女
  rationale: τέκνα泛指子女；“儿女”比单用“孩子”更符合庄重的经文语体，同时不限定年龄。
theological_decisions:
- issue: Θυγατέρες Ἰερουσαλήμ的称呼如何处理
  choice: 耶路撒冷的女儿们
  alternative: 耶路撒冷的妇女们
  rationale: 直译保留以色列经文传统中先知式、群体性的称呼及其互文意味，又不额外加入特定教义解释；脚注提供现代语义对应。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“哭”比“哀哭”更自然，也准确对应κλαίω；“倒要”传达纠正性的对比。
