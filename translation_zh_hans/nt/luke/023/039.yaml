  text: Εἷς δὲ τῶν κρεμασθέντων κακούργων ἐβλασφήμει αὐτόν ⸀λέγων· ⸀Οὐχὶ σὺ εἶ ὁ χριστός; σῶσον σεαυτὸν καὶ ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/039.yaml
  text: One of the criminals who were hanging there was reviling him[a], saying, “Are you not the Messiah? Save yourself and us.”
translation:
  language: zh_hans
  text: 被挂着的罪犯中，有一个一直辱骂耶稣，说：“你不是弥赛亚[a]吗？救你自己和我们！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或作“基督”。希腊文：ὁ χριστός。
    reason: 说明Χριστός这一称号的传统替代译法。
lexical_decisions:
- source_word: Εἷς δὲ
  choice: 有一个
  rationale: δέ在这里表示轻微的叙事推进或对比；中文借“……中，有一个”的句式自然承接上下文，无须另加“但是”或“这时”。
- source_word: τῶν κρεμασθέντων κακούργων
  choice: 悬挂着的罪犯中
  rationale: κακούργων译为现代、自然的“罪犯”；κρεμασθέντων本义为“被悬挂”，此处保留原文措辞，不以“钉十字架”取代。
- source_word: ἐβλασφήμει αὐτόν
  choice: 一直辱骂耶稣
  rationale: 此处动词指向耶稣的侮辱性言语，译作“辱骂”比带有专门宗教含义的“亵渎”更符合语境；“一直”体现未完成时所表达的持续动作。为使单节独立阅读时指代清楚，将αὐτόν所指的“他”明示为“耶稣”。
- source_word: λέγων
  choice: 说
  rationale: 以现代汉语常用的引语引介方式表达该分词。
- source_word: Οὐχὶ σὺ εἶ ὁ χριστός;
  choice: 你不是弥赛亚吗？
  rationale: οὐχί引出的问句预期肯定回答，在这里带有讥讽意味；“你不是……吗”保留这种反问语气。Χριστός在此是称号，译作“弥赛亚”。
- source_word: σῶσον σεαυτὸν καὶ ἡμᾶς
  choice: 救救你自己和我们吧
  rationale: “救”既表达眼前脱离死亡的要求，也保留该词更广泛的救恩语义；“吧”使讥讽式命令在中文中自然，但不消除其命令力度。
theological_decisions:
- issue: Χριστός作为称号的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 在这句讥讽中，Χριστός是具有犹太背景的受膏者称号，而非近似专名的用法；“弥赛亚”较清楚地保留其称号功能，并以脚注提供传统译法。
- issue: ἐβλασφήμει的语境含义
  choice: 辱骂
  alternative: 亵渎
  rationale: 原词可用于亵渎或毁谤性的言语；这里直接描述罪犯以讥讽言语攻击耶稣，译作“辱骂”保留语境意义，而不预先断定说话者是否在技术意义上犯了亵渎神的罪。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“悬挂着”紧贴原文，避免把原文较宽泛的动词具体化；“一直辱骂”体现未完成时的持续性。脚注标记置于其实际说明的“弥赛亚”之后。
