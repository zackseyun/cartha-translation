  yaml_path: translation/nt/luke/023/052.yaml
  text: This man went to Pilate and asked for the body of Jesus.
translation:
  language: zh_hans
  text: 这人到彼拉多面前，请求耶稣的遗体。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗτος
  choice: 这人
  rationale: 指回上一节的亚利马太人约瑟；“这人”保留指示代词的回指作用，也符合现代汉语叙事表达。
- source_word: προσελθὼν τῷ Πιλάτῳ
  choice: 到彼拉多面前
  rationale: 不定过去时分词表示先于主要动词发生的伴随动作；译作“到……面前”自然表达前去求见并接近彼拉多，而不增添原文没有的称号。
- source_word: ᾐτήσατο
  choice: 请求领走
  rationale: αἰτέω 在此表示提出请求；结合所求的是待安葬的遗体，“请求领走”在汉语中交代请求取得遗体的含义，但不具体化彼拉多随后如何批准。
- source_word: τὸ σῶμα
  choice: 遗体
  rationale: σῶμα 的基本义是“身体”；在耶稣已经死亡的语境中，现代汉语通常尊称为“遗体”，比“尸体”更庄重，也不改变所指。
- source_word: τοῦ Ἰησοῦ
  choice: 耶稣的
  rationale: 属格直接表明该遗体是耶稣的，按汉语自然语序置于“遗体”之前。
