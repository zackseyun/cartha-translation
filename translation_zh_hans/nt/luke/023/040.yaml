base_translation:
  language: en
  yaml_path: translation/nt/luke/023/040.yaml
  text: But the other answered[a], rebuking him, “Do you not even fear God, since you are under the same sentence?”
translation:
  language: zh_hans
  text: 另一个却责备他说：“你既然受的是同样的刑罚，难道连上帝也不怕吗？[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “刑罚”或译“判决”“审判”。希腊语κρίμα可指审判、判决或刑罚；这里指他们共同承受的惩罚性后果。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ ἕτερος
  choice: 另一个却……说
  rationale: δέ在上下文中表示轻微转折，译作“却”；ἀποκριθείς与ἔφη共同引出回应，汉语不必机械重复“回答……说”，用“却……说”自然表达其回应性质。
- source_word: ἐπιτιμῶν αὐτῷ
  choice: 责备他
  rationale: 保留ἐπιτιμάω所表达的严正斥责语气，并自然衔接直接引语。
- source_word: Οὐδὲ φοβῇ σὺ τὸν θεόν
  choice: 难道连上帝也不怕吗
  rationale: “连……也不”体现οὐδέ的强调；“怕上帝”保留φοβέομαι的直接词义和敬畏、问责意味，不将其弱化为一般尊重。
- source_word: ὅτι
  choice: 既然
  rationale: 此处引出责问的根据，“既然”能自然表达因果关系。
- source_word: ἐν τῷ αὐτῷ κρίματι εἶ
  choice: 受的是同样的刑罚
  rationale: κρίμα可指审判、判决或刑罚；在同受十字架处刑的语境中，“刑罚”清楚表达共同承受的司法后果，同时以脚注保留词义范围。
theological_decisions:
- issue: “怕上帝”的含义
  choice: 保留“怕上帝”这一圣经表达
  alternative: “敬畏上帝”或“尊重上帝”
  rationale: 原文φοβέομαι直接表达“惧怕”，在此兼有对上帝负责的宗教伦理意味；不弱化为“尊重”，也不借扩译限定为单一神学解释。
- issue: κρίμα在处刑语境中的指向
  choice: 正文译为“刑罚”
  alternative: “判决”或“定罪”
  rationale: 上下文强调二人共同承受的处刑结果；“刑罚”在现代汉语中最自然，但脚注保留“判决、审判”等真实语义可能。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事表达。“另一个却责备他说”清楚呈现人物转换与斥责语气；反问句保留原文“连……也不”的强调。
