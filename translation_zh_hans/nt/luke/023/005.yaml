  text: οἱ δὲ ἐπίσχυον λέγοντες ὅτι Ἀνασείει τὸν λαὸν διδάσκων καθ’ ὅλης τῆς Ἰουδαίας, ⸀καὶ ἀρξάμενος ἀπὸ τῆς Γαλιλαίας ἕως ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/005.yaml
  text: But they kept insisting[a], saying, “He stirs up the people, teaching throughout all Judea[c][b], beginning from Galilee even to here.”
translation:
  language: zh_hans
  text: 但他们极力坚持说：“他在整个犹太地教导人，煽动百姓，从加利利开始，一直到这里。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπίσχυον
  choice: 坚持不休
  rationale: 未完成时表示持续或反复的强力坚持；“坚持不休”既体现延续性，也符合他们不断加重指控的语境。
- source_word: λέγοντες
  choice: 说
  rationale: 此分词引出他们坚持陈述的内容；译作“说”直接自然。
- source_word: Ἀνασείει
  choice: 煽动
  rationale: 该动词指挑动、激起人群，常带扰乱秩序的意味。“煽动”符合控告语境，但不把罪名进一步限定为正式的叛乱。
- source_word: τὸν λαὸν
  choice: 百姓
  rationale: 这里指广泛的民众，而非某一现场聚集的群众；“百姓”适合这一范围。
- source_word: διδάσκων
  choice: 教导人
  rationale: 现在分词说明被控行为所伴随的方式；补出“人”使现代汉语表达完整，同时不改变原意。
- source_word: καθ’ ὅλης τῆς Ἰουδαίας
  choice: 在整个犹太地区
  rationale: κατά加属格在此表达遍及某区域的空间范围；“整个”保留ὅλης所强调的全面性。
- source_word: Ἰουδαίας
  choice: 犹太地区
  rationale: 采用通行地名“犹太”，并加“地区”以表明此处是地理名称，避免与“犹太人”混淆；其具体或较广范围由脚注保留。
- source_word: ἀρξάμενος ἀπὸ τῆς Γαλιλαίας
  choice: 从加利利开始
  rationale: ἀπό明确标示起点；此译自然保留分词所表达的活动起始处。
- source_word: ἕως ὧδε
  choice: 一直到这里
  rationale: 保留从加利利延伸至彼拉多当前所在地点的指示意义，“一直”体现其强调的跨度。
theological_decisions:
- issue: 对耶稣之控告的性质
  choice: 译为“煽动百姓”，表达扰动民众的敌意指控，但不把它明确化为正式的叛乱罪。
  alternative: 译为“鼓动百姓”或“使百姓骚动”。
  rationale: ἀνασείει带有挑动、激起的负面含义，但本身并不要求译成某项技术性的政治罪名；正文保留控告的力度，脚注则提示较宽的词义可能。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“坚持不休”表现控告者持续施压；引语中的分号使“教导、煽动”与“从加利利直到这里”的地理跨度层次清楚。地名使用简体中文圣经语境中通行的“犹太地区”和“加利利”。
