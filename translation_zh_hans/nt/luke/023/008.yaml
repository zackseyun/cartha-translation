  text: ὁ δὲ Ἡρῴδης ἰδὼν τὸν Ἰησοῦν ἐχάρη λίαν, ἦν γὰρ ⸂ἐξ ἱκανῶν χρόνων θέλων⸃ ἰδεῖν αὐτὸν διὰ τὸ ⸀ἀκούειν περὶ αὐτοῦ, καὶ ἤλπιζέν τι σημεῖον ἰδεῖν ὑπ’ αὐτοῦ γινόμενον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/008.yaml
  text: When Herod saw Jesus[a], he rejoiced greatly, for he had for a long time wanted to see him because he had heard about him[b], and he was hoping to see some sign done by him.
translation:
  language: zh_hans
  text: 希律看见耶稣，就非常高兴；因为他想见耶稣已经很久了，又常听说有关耶稣的事，也盼望能看见耶稣行一个神迹[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“某个记号”。希腊文“记号”可指具有特殊意义的神奇作为。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐχάρη λίαν
  choice: 非常高兴
  rationale: 自然表达希律强烈的喜悦，完整保留 λίαν 的加强语气；在现代汉语中比“极其欢喜”更通顺。
- source_word: ἐξ ἱκανῶν χρόνων
  choice: 早就
  rationale: 表达从相当久以前延续至当时的愿望，简洁自然，又不擅自限定为多年。
- source_word: θέλων ἰδεῖν αὐτόν
  choice: 想见耶稣
  rationale: θέλω 在此指愿望；中文重提姓名可避免连续代词所造成的指代含混。
- source_word: διὰ τὸ ἀκούειν περὶ αὐτοῦ
  choice: 因他不断听到有关耶稣的事
  rationale: διά 加冠词不定式表达原因；“不断听到”保留现在时不定式可能具有的持续或反复体貌。
- source_word: ἤλπιζέν τι σημεῖον ἰδεῖν
  choice: 一直盼望看见……行个神迹
  rationale: 未完成时 ἤλπιζεν 表示持续的盼望；τι 表示某一个、不特定的行动，故译为“个”。σημεῖον 在此语境指具有超自然性质且可供观看的标志性作为，正文采用自然汉语“神迹”，脚注保留“记号”这一较形式对应的译法。
- source_word: ὑπ’ αὐτοῦ γινόμενον
  choice: 耶稣行
  rationale: 将希腊语被动式关系自然转换为汉语主动表达，仍明确耶稣是该神迹的施行者。
- source_word: ὁ δὲ Ἡρῴδης
  choice: 希律
  rationale: δέ 在此推动叙事发展；中文借“一……就……”自然衔接，无须另加“这时”或“于是”。
- source_word: ἰδὼν τὸν Ἰησοῦν
  choice: 一见耶稣
  rationale: 把先行的简单过去分词表达为紧接主句结果的时间结构，符合上下文与现代汉语习惯。
theological_decisions:
- issue: σημεῖον 应译为“神迹”还是“记号”
  choice: 正文译“神迹”，脚注注明直译“记号”
  alternative: 正文译“记号”
  rationale: 在本节中，希律希望亲眼观看耶稣所行的超自然作为，“神迹”最易为普通读者理解；但 σημεῖον 本身强调具有指示意义的记号，因此以脚注保存其较广的语义范围，不把它单纯化为奇事。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“一见……就……”清楚呈现分词与主句的时间关系；以“不断”“一直”分别体现听闻和盼望的持续性。为避免“他”在希律与耶稣之间产生歧义，适度重提“耶稣”。
