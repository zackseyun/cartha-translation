  text: παιδεύσας οὖν αὐτὸν ⸀ἀπολύσω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/016.yaml
  text: Therefore[a], after disciplining him, I will release him.
translation:
  language: zh_hans
  text: 所以，我要惩戒他[a]，然后释放他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“责罚他”。这个动词可指带有管教性质的惩罚。有人认为这里具体指鞭打，但希腊词本身含义较宽。
    reason: 说明παιδεύω在司法语境中的词义范围，并保留“鞭打”这一较具体但非词语本身必然表达的理解。
lexical_decisions:
- source_word: παιδεύσας
  choice: 惩戒
  rationale: 该不定过去时分词在此表示先于“释放”发生的行动。παιδεύω可指教育、管教，也可指责罚；彼拉多审判耶稣的语境要求采用惩罚性的含义。“惩戒”既体现带有管教、责罚意味的司法处置，又不像“鞭打”那样把方式具体化。
- source_word: οὖν
  choice: 所以
  rationale: οὖν在这里引出彼拉多根据前文所作的结论或处置方案。“所以”自然保留其推论和承接作用。
- source_word: αὐτόν
  choice: 他
  rationale: 该宾格代词指耶稣，直译为“他”。
- source_word: ἀπολύσω
  choice: 我要……释放他
  rationale: ἀπολύω在羁押和审判语境中指释放、放走；“释放”准确而自然。“我要”表达第一人称将来时所含的意向。
theological_decisions:
- issue: 彼拉多所说的παιδεύω具体指何种处置
  choice: 译为“惩戒”，表达司法语境中的惩罚，但不限定具体方式。
  alternative: 可译为“责罚”或理解为“鞭打”。
  rationale: 上下文排除了单纯教育意义，却没有由这个动词本身明确指出惩罚方式。译文因此保留其范围，避免把“鞭打”这一较具体的理解直接写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的司法叙述语体。“然后”自然表达分词动作先于主要动词发生，同时避免生硬的“惩戒他以后”。
