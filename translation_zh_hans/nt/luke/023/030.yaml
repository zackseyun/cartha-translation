  text: τότε ἄρξονται λέγειν τοῖς ὄρεσιν· Πέσετε ἐφ’ ἡμᾶς, καὶ τοῖς βουνοῖς· Καλύψατε ἡμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/030.yaml
  text: Then they will begin to say to the mountains[a], ‘Fall on us,’ and to the hills[b], ‘Cover us.’
translation:
  language: zh_hans
  text: 那时，他们就要开始对群山[a]说：“倒在我们身上吧！”又对丘陵说：“遮盖我们吧！”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的措辞呼应先知书中有关审判的语言，尤其见何西阿书10:8。
    reason: cross_reference
  - marker: b
    text: 或译：“隐藏我们吧！”这个动词的字面意思是“遮盖”，但在这里也含有躲避将临审判的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: 那时
  rationale: 表示承接前文并指向将来发生之事；“那时”自然地保留时间推进关系。
- source_word: ἄρξονται λέγειν
  choice: 他们将开始……说
  rationale: 保留ἄρξονται与不定式λέγειν构成的起始体意义，不简化为单纯的“他们将说”。
- source_word: τοῖς ὄρεσιν
  choice: 对群山
  rationale: ὄρος可指山或山岭；采用“群山”并与后面的“丘陵”区分，也符合复数形式及中文诗性呼告。
- source_word: Πέσετε ἐφ’ ἡμᾶς
  choice: 倒在我们身上吧
  rationale: Πέσετε是复数命令式，ἐπί加宾格表示朝向并落到其上；“倒在……身上”直接而自然。句末“吧”使中文命令兼具绝望恳求的语气。
- source_word: τοῖς βουνοῖς
  choice: 对丘陵
  rationale: βουνός通常指较低的山丘；“丘陵”保留其与ὄρος的词汇区别。
- source_word: Καλύψατε ἡμᾶς
  choice: 遮盖我们吧
  rationale: καλύπτω的直接意义是“遮盖”，语境中也可含“隐藏”之意；正文保留具体意象，并在脚注说明语境义。
theological_decisions:
- issue: 先知性审判语言及何西阿书10:8的互文
  choice: 正文保留向群山和丘陵发出的字面呼喊，不把审判含义直接写入正文。
  alternative: 意译为请求群山将他们藏起来，使其躲避将临的审判。
  rationale: 原文以具体而强烈的意象表达面对审判时的绝望；保留该意象可维持互文联系及神学张力，解释则置于脚注。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“群山／丘陵”保留原文两个地貌词的区别；引语中的“吧”表达绝望的祈求，同时不削弱复数命令式。所有脚注标记均已置于正文相应词语之后。
