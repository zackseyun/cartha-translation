  yaml_path: translation/nt/luke/019/045.yaml
  text: And entering the temple[a], he began to drive out those who were selling,
translation:
  language: zh_hans
  text: 耶稣进了圣殿区[a]，就开始赶出那些在卖东西的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“圣殿”或“圣殿院落”。希腊文ἱερόν指整个圣殿建筑群及其院落，并非专指内殿。
    reason: 说明原词的空间范围及可选译法。
lexical_decisions:
- source_word: εἰσελθὼν
  choice: 进了
  rationale: 不定过去时分词表示先于主句动作发生的进入；汉语用“进了……就……”自然呈现动作次序，又不显得生硬。
- source_word: ἱερὸν
  choice: 圣殿区
  rationale: ἱερόν指整个圣殿范围，而非专指内殿；“圣殿区”在正文中直接保留这一空间范围。
- source_word: ἤρξατο
  choice: 开始
  rationale: 准确表达ἄρχομαι接不定式的起始意义。
- source_word: ἐκβάλλειν
  choice: 赶出
  rationale: 体现ἐκβάλλω所含的强制驱离意味，同时符合现代汉语叙事表达。
- source_word: πωλοῦντας
  choice: 那些做买卖的人
  rationale: 该现在分词指当时正在从事售卖活动的人；“做买卖”自然简洁，且不擅自补出所卖物品。
theological_decisions:
- issue: ἱερόν所指的圣殿范围
  choice: 正文译作“圣殿区”，理解为整个圣殿建筑群及院落范围
  alternative: “圣殿”或“圣殿院子”；不采用容易被理解为内殿的“圣所”
  rationale: 原文使用ἱερόν而非通常指内殿的ναός。明确译出“区”可避免把耶稣的行动误置于内殿，同时不引入额外的神学判断。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“进了……就开始……”保持叙事推进；“赶出”传达动作力度。“做买卖的人”比“卖东西的人”略为凝练，并避免补充原文未说明的商品。
