  yaml_path: translation/nt/luke/019/018.yaml
  text: And the second came, saying, ‘Your mina, Lord, has made five minas.’
translation:
  language: zh_hans
  text: 第二个仆人也来了，说：‘主啊，你的那一弥拿[a]赚得了五弥拿。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弥拿”是古代的货币单位，也与重量单位有关；其实际价值随地区和时期而异。
    reason: 说明μνᾶ为特定古代单位，避免正文“弥拿”对现代读者造成理解障碍，也不武断换算其价值。
lexical_decisions:
- source_word: ὁ δεύτερος
  choice: 第二个
  rationale: 按上下文指第二个仆人；中文省略重复的“仆人”仍清楚自然。
- source_word: Ἡ μνᾶ σου
  choice: 你的一锭银子
  rationale: μνᾶ是古代货币兼重量单位；译作“一锭银子”便于现代读者理解，并保留可数单位的表达。
- source_word: κύριε
  choice: 主啊
  rationale: 这里是仆人对主人直接说话的称呼；“主啊”保留尊称及呼格语气，不额外判定其神学含义。
- source_word: ἐποίησεν πέντε μνᾶς
  choice: 赚了五锭
  rationale: 字面为“产生／做成了五弥拿”，在投资经营语境中译作“赚了五锭”自然，并保留本金带来收益的主语关系。
theological_decisions:
- issue: κύριε在比喻内的称谓层次
  choice: 主啊
  alternative: 主人啊
  rationale: 原文κύριε既可作一般尊称，也可译为“主”；正文保留“主啊”的简洁和潜在张力，不把比喻人物与神学指称强行等同或切割。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言；用“也来了”承接上一位仆人的报告，用“一锭银子／五锭”保持货币单位前后一致。
