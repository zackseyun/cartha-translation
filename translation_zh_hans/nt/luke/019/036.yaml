  yaml_path: translation/nt/luke/019/036.yaml
  text: And as he went[a], they were spreading their cloaks on the road.
translation:
  language: zh_hans
  text: 他前行时，他们正把自己的外衣[a]铺在路上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“衣服”。
    reason: ἱμάτια既可指一般衣物，也可特指外衣；正文采用符合此处场景的“外衣”，脚注保留较宽泛的词义。
lexical_decisions:
- source_word: πορευομένου δὲ αὐτοῦ
  choice: 他前行的时候
  rationale: 属格独立结构中的现在时分词表示与主句同时发生的动作；“他前行的时候”自然地保留了这一时间关系。δέ在此是轻微的叙事连接词，现代汉语中不必生硬地译出。
- source_word: ὑπεστρώννυον
  choice: 不断把……铺在
  rationale: 未完成时描绘当时持续或反复进行的动作；“不断”使这一体貌在现代汉语中清楚可感。
- source_word: τὰ ἱμάτια ἑαυτῶν
  choice: 自己的外衣
  rationale: ἱμάτια可泛指衣服，也常指穿在外面的衣物；在铺路迎接的场景中，“外衣”具体、自然，同时“自己的”准确表达反身代词ἑαυτῶν。
- source_word: ἐν τῇ ὁδῷ
  choice: 在路上
  rationale: ἐν加与格在这里表示动作发生或物品放置的位置；“铺在路上”符合现代汉语习惯。
theological_decisions: []
