  text: καὶ ἤγαγον αὐτὸν πρὸς τὸν Ἰησοῦν, καὶ ἐπιρίψαντες ⸀αὐτῶν τὰ ἱμάτια ἐπὶ τὸν πῶλον ἐπεβίβασαν τὸν Ἰησοῦν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/035.yaml
  text: And they brought it to Jesus[a], and after throwing their cloaks on the colt[b], they put Jesus on it.
translation:
  language: zh_hans
  text: 他们把驴驹[a]牵到耶稣那里，将自己的外衣搭在驴驹背上，然后让耶稣骑在上面。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “驴驹”：原文用词可泛指幼小的牲畜；这里按上下文指幼驴。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγαγον αὐτὸν
  choice: 把驴驹牵到
  rationale: ἄγω表示带领或带到；这里所带的是驴驹，用“牵到”既符合动物语境，也自然地表达向耶稣所在之处移动。希腊语阳性代词αὐτόν回指πῶλος，汉语直接重提“驴驹”更清楚。
- source_word: πρὸς τὸν Ἰησοῦν
  choice: 到耶稣那里
  rationale: πρός加宾格表示朝向某人移动；“到耶稣那里”是自然、明确的现代汉语。
- source_word: ἐπιρίψαντες αὐτῶν τὰ ἱμάτια
  choice: 将自己的外衣搭在
  rationale: ἐπιρίπτω表示把东西抛上或放上；在铺衣供人乘骑的场景中，“搭在”比字面的“扔在”更自然。ἱμάτια指外层衣物，译为“外衣”准确而易懂。
- source_word: ἐπὶ τὸν πῶλον
  choice: 驴驹背上
  rationale: ἐπί加宾格在此表示把衣物放到幼畜身上；汉语补出“背上”，清楚呈现实际位置，并未改变动作含义。
- source_word: πῶλον
  choice: 驴驹
  rationale: πῶλος可指幼小的牲畜；本段弥赛亚进城的上下文表明这里是幼驴。“驴驹”是现代汉语中清楚且庄重的表达。
- source_word: ἐπεβίβασαν τὸν Ἰησοῦν
  choice: 让耶稣骑了上去
  rationale: ἐπιβιβάζω是使某人上到坐骑上的使役表达。“让耶稣骑了上去”保留使役意义和动作完成感，又避免“扶上去”额外暗示耶稣需要搀扶。
