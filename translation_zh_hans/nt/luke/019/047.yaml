  text: Καὶ ἦν διδάσκων τὸ καθ’ ἡμέραν ἐν τῷ ἱερῷ· οἱ δὲ ἀρχιερεῖς καὶ οἱ γραμματεῖς ἐζήτουν αὐτὸν ἀπολέσαι καὶ οἱ πρῶτοι τοῦ λαοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/047.yaml
  text: And he was teaching day by day in the temple. But the chief priests and the scribes[a], and the leading men of the people, were seeking to destroy him,
translation:
  language: zh_hans
  text: 耶稣天天在圣殿里教导。可是，祭司长、文士和百姓中的首要人物[a]一直设法除掉他，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“百姓中居首位的人”，指百姓中显要或有影响力的人物。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν διδάσκων
  choice: 教导人
  rationale: 迂回未完成时表达过去持续或反复进行的行动；结合“天天”，汉语无需另加“不断”，即可自然体现持续反复之意。
- source_word: τὸ καθ’ ἡμέραν
  choice: 天天
  rationale: 准确传达逐日、每日反复的分配意义，也符合现代汉语习惯。
- source_word: ἐν τῷ ἱερῷ
  choice: 在圣殿里
  rationale: ἱερόν指整个圣殿范围，而非内殿；“圣殿里”简洁自然，同时不作超出原文的具体限定。
- source_word: οἱ ἀρχιερεῖς
  choice: 祭司长
  rationale: 这是对犹太祭司领导阶层的通行译法，适合该复数集合称谓。
- source_word: οἱ γραμματεῖς
  choice: 经学家
  rationale: 指精通并讲授律法的文士；“经学家”在现代汉语中比“文士”更直接地传达其宗教经文专家身份，又不扩译为单纯的“律法教师”。
- source_word: ἐζήτουν
  choice: 都想
  rationale: 未完成时表示持续谋求或企图；“想”在此语境中自然表达他们一直图谋达成的意图，“都”统摄并列的三个群体。
- source_word: ἀπολέσαι
  choice: 除掉
  rationale: 既保留ἀπόλλυμι在此处消灭、杀害的敌对含义，又不像“杀死”那样消除原词稍宽的语义范围。
- source_word: οἱ πρῶτοι τοῦ λαοῦ
  choice: 民间的领袖
  rationale: πρῶτοι字面为“最前面的／首要的人”，在此指民众中有地位、有影响力的人；“民间的领袖”自然传达其社会显要身份。
theological_decisions:
- issue: οἱ πρῶτοι τοῦ λαοῦ是否应显式标明男性
  choice: 民间的领袖
  alternative: 民间有地位的男子／民间的男性领袖
  rationale: 希腊语阳性复数在混合或未明确性别的群体称谓中也可作通用形式；上下文未特别突出性别，因此不在正文中加入原文未明确强调的“男子”，以保留其指称范围。
- issue: ἀπολέσαι的敌对意图应译为杀害还是较宽泛的毁灭
  choice: 除掉他
  alternative: 杀死他
  rationale: 上下文显然包含致死意图，但ἀπόλλυμι本身可表示毁灭、消灭；“除掉”既能涵盖杀害，也保留原词较宽的表达张力。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。“可是”清楚表现δέ的转折；句末保留逗号，以反映本节原文句法尚未结束并与下一节衔接。正文中的[a]与脚注完全对应。
