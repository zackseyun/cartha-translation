  text: καὶ ὡς ἦλθεν ἐπὶ τὸν τόπον, ἀναβλέψας ὁ ⸀Ἰησοῦς εἶπεν πρὸς αὐτόν· Ζακχαῖε, σπεύσας κατάβηθι, σήμερον γὰρ ἐν τῷ οἴκῳ σου δεῖ με μεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/005.yaml
  text: And when Jesus came to the place[a], he looked up and said to him, “Zacchaeus, hurry and come down[b], because today I must stay at your house.”
translation:
  language: zh_hans
  text: 耶稣来到那地方，就抬头对他说：“撒该，快下来！因为今天我必须住在你家里[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “住”也可译作“停留”或“留宿”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: 来到……就
  rationale: 在叙事中引出时间关系；用“来到……就”自然表达事件紧接发生。
- source_word: ἐπὶ τὸν τόπον
  choice: 来到那地方
  rationale: 保留地点指向，同时符合现代汉语叙事习惯。
- source_word: ἀναβλέψας
  choice: 抬头
  rationale: 上下文中撒该在树上，因此此词具体表示朝上看；“抬头”简洁自然。
- source_word: εἶπεν πρὸς αὐτόν
  choice: 对他说
  rationale: 这是现代汉语中清楚自然的言语引介形式。
- source_word: Ζακχαῖε
  choice: 撒该
  rationale: 采用中文圣经传统中通行且易识别的人名译法。
- source_word: σπεύσας κατάβηθι
  choice: 快下来
  rationale: σπεύσας与命令式连用表达急迫；“快下来”以自然汉语保留命令的紧迫感。
- source_word: σήμερον γὰρ
  choice: 因为今天
  rationale: γάρ说明前一命令的理由；“因为”明确保留因果关系。
- source_word: ἐν τῷ οἴκῳ σου
  choice: 在你家里
  rationale: οἶκος在此指撒该的住处；“家里”兼具自然性与场景准确性。
- source_word: δεῖ
  choice: 必须
  rationale: 保留强烈的必要性，并不在正文中进一步断定这种必要性的来源。
- source_word: μεῖναι
  choice: 住
  rationale: 在到某人家中的语境里，μένω指停留或留宿；“住”简洁自然，但可涵盖留宿之意。
theological_decisions:
- issue: 路加叙事中δεῖ所表达的必要性
  choice: 我必须住在你家里
  alternative: 我需要住在你家里；我非得住在你家里不可
  rationale: “必须”保留δεῖ较强的必要性，以及它可能与耶稣使命或上帝旨意相关的意味，却不把这种关联明说成唯一解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“撒该”沿用通行译名；直接引语中的“快下来”保留现场的急迫感。“必须”维持原文的神学张力，不额外解释必要性的来源。
