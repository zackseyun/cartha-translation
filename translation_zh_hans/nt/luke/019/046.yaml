  text: λέγων αὐτοῖς· Γέγραπται· ⸂Καὶ ἔσται⸃ ὁ οἶκός μου οἶκος ⸀προσευχῆς, ὑμεῖς δὲ αὐτὸν ἐποιήσατε σπήλαιον λῃστῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/046.yaml
  text: saying to them[a], “It is written[b], ‘And my house shall be a house of prayer,’ but you have made it a den of robbers.”
translation:
  language: zh_hans
  text: 对他们说：“经上记着：‘我的家[a]必成为祷告之家’，你们却把它弄成了强盗窝。[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我的家”所指的是圣殿，也可译作“我的殿”。希腊文直译为“我的家”，呼应以赛亚书56:7。
    reason: lexical_alternative
  - marker: b
    text: “强盗窝”呼应耶利米书7:11；“强盗”也可译作“匪徒”或“劫匪”。
    reason: cross_reference
lexical_decisions:
- source_word: λέγων αὐτοῖς
  choice: 对他们说
  rationale: 该现在分词承接上一节的叙事动作；汉语用“对他们说”自然地表达伴随动作，不必生硬保留分词形式。
- source_word: Γέγραπται
  choice: 经上记着
  rationale: 这是引出权威经文的完成时被动惯用语；“经上记着”既自然，也保留所引经文持续有效的意味。
- source_word: Καὶ ἔσται
  choice: 必成为
  rationale: καί在引文中可有承接作用，但汉语若直译为“并且”会显得突兀；“必成为”保留将来及郑重、确定的语气。
- source_word: ὁ οἶκός μου
  choice: 我的家
  rationale: οἶκος本义为“家、房屋”，上下文所指是圣殿。“我的家”保留原文措辞及神居所的意象，避免直接改译成“我的殿”。
- source_word: οἶκος προσευχῆς
  choice: 祷告之家
  rationale: 保留“家／之家”的重复结构，同时以庄重而易懂的现代汉语表达属格关系。
- source_word: ὑμεῖς δὲ
  choice: 你们却
  rationale: “你们”体现原文显明主语所带的强调，“却”清楚表达与经文旨意的强烈对照。
- source_word: ἐποιήσατε
  choice: 把它弄成了
  rationale: 表达他们的行为已经造成当前结果；“弄成了”在直接斥责中自然有力，又不额外解释具体行为。
- source_word: σπήλαιον
  choice: 窝
  rationale: 此处承接耶利米书7:11的意象，指强盗藏身的巢穴；“窝”比地理意义的“洞穴”更符合汉语惯用搭配。
- source_word: λῃστῶν
  choice: 强盗
  rationale: λῃστής可指强盗、劫匪或匪徒；“强盗”保留先知性引文的熟悉表达，也不把政治性或武装性质说得过于具体。
theological_decisions:
- issue: 圣殿引文中的οἶκος应译为“家”还是“殿”
  choice: 我的家……祷告之家
  alternative: 我的殿……祷告的殿
  rationale: 希腊文使用οἶκος，并与以赛亚书56:7的措辞相呼应。译作“家”保留神之居所的意象和原文重复，而脚注说明其所指为圣殿，避免在正文中消除这层张力。
- issue: λῃστῶν是否具体译成带政治或武装意味的“匪徒”
  choice: 强盗
  alternative: 匪徒／劫匪
  rationale: 该词语义范围可涵盖强盗、劫匪、匪徒；上下文并未要求限定为政治叛乱者，因此采用较宽泛且符合耶利米书引文传统的“强盗”。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。“经上记着”保留引用经文的正式语气；“祷告之家”略带经文体色彩但仍易懂；“强盗窝”简洁有力，符合先知性斥责。所有脚注标记均放在其所解释的正文短语之后。
