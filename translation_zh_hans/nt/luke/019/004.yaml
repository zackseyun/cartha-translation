  text: καὶ προδραμὼν ⸂εἰς τὸ⸃ ἔμπροσθεν ἀνέβη ἐπὶ συκομορέαν ἵνα ἴδῃ αὐτόν, ὅτι ἐκείνης ἤμελλεν διέρχεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/004.yaml
  text: So he ran on ahead and climbed up into a sycamore tree so that he might see him[a], because he was about to pass that way.
translation:
  language: zh_hans
  text: 于是他跑到前面，爬上一棵桑叶无花果树[a]，要看见耶稣，因为耶稣正要从那条路经过。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“桑无花果树”。指桑叶无花果（Ficus sycomorus），不是通常所说的悬铃木。
    reason: lexical_alternative
lexical_decisions:
- source_word: προδραμὼν εἰς τὸ ἔμπροσθεν
  choice: 跑到前面
  rationale: 分词与方位短语合起来表示撒该跑到人群前方；“跑到前面”自然地保留了奔跑和抢先到前面的含义。
- source_word: ἀνέβη ἐπὶ
  choice: 爬上
  rationale: 这里描述上树的动作，“爬上”比直译为“上到……之上”更符合现代汉语习惯。
- source_word: συκομορέαν
  choice: 桑葚无花果树
  rationale: 该词指 Ficus sycomorus，并非现代汉语通常所说的悬铃木；采用较准确的植物名称，同时用脚注提供较简短的译法。
- source_word: ἵνα ἴδῃ αὐτόν
  choice: 为要看看耶稣
  rationale: 保留 ἵνα 所表达的目的；汉语中补出“耶稣”可清楚区分本句两个男性指称对象。“看看”符合叙事语境，也自然表达亲眼看见之意。
- source_word: ἐκείνης
  choice: 从那里
  rationale: 阴性属格代词在此省略了所指的道路或地点；“从那里”保留其椭圆表达，不擅自补入“道路”或“街道”。
- source_word: ἤμελλεν διέρχεσθαι
  choice: 将要从那里经过
  rationale: μέλλω 加不定式表示即将发生或预定发生的行动；“将要……经过”准确而自然。
theological_decisions:
- issue: αὐτόν及后续动词主语在汉语中的指称清晰度
  choice: 两处均明确译作“耶稣”
  alternative: 使用“他”
  rationale: 希腊语可借语法和语境辨明指称，但现代汉语连续使用“他”容易误读为撒该；补明姓名只消除代词歧义，不增加神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“于是”承接上文；“为要”保留目的意味，略具经文体庄重感但仍属通顺现代汉语。
