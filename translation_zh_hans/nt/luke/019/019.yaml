  yaml_path: translation/nt/luke/019/019.yaml
  text: And he said to this one also[a], ‘And you, be over five cities.’
translation:
  language: zh_hans
  text: 他也对这个人说：“你也要管辖[a]五座城。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你也要掌管五座城”，或“你也要被委派管理五座城”。
    reason: 原文ἐπάνω γίνου表示处于管理、掌权的地位；在此语境中也可表达被任命承担这一职位。
lexical_decisions:
- source_word: εἶπεν δὲ καὶ τούτῳ
  choice: 他也对这个人说
  rationale: δὲ在此是轻微的叙事连接词，汉语不必另译；καὶ与τούτῳ合起来表示“也对这个人”，保留与前一位仆人的对应关系。
- source_word: Καὶ σὺ
  choice: 你也
  rationale: καὶ在直接称呼中表示“也”，σὺ带有明确的个人指向；“你也”自然地保留平行和强调。
- source_word: ἐπάνω γίνου
  choice: 要管理
  rationale: γίνου是现在时中间语态命令式，与ἐπάνω连用，表示处于辖管或掌权的位置；“要管理”在现代汉语中自然，并保留受命承担权柄的含义。
- source_word: πέντε πόλεων
  choice: 五座城
  rationale: πόλις通常指城；属格受ἐπάνω支配，表示其管理范围。量词“座”符合现代汉语习惯。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“这个人”保留τούτῳ的指示意味；正文用“管理”避免生硬的“在……之上”，脚注说明权柄和任命的语义可能。
