revisions:
- from: 他已经走近橄榄山的下坡处时，众门徒全都欢喜起来，为他们所看见的一切大能之事[a]，高声赞美上帝。
  to: 他已经临近橄榄山的下坡处时，众门徒全都开始欢喜地为他们所看见的一切大能之事[a]高声赞美上帝。
  rationale: 仅作小幅句法调整：将“开始”明确关联于赞美行动，并以“欢喜地”表达χαίροντες的伴随方式；保留原译全部关键语义、地点表述的适度不确定性及脚注锚点。
