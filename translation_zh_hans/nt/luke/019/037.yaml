source:
  edition: SBLGNT
  text: ἐγγίζοντος δὲ αὐτοῦ ἤδη πρὸς τῇ καταβάσει τοῦ Ὄρους τῶν Ἐλαιῶν ἤρξαντο ἅπαν τὸ πλῆθος τῶν μαθητῶν χαίροντες αἰνεῖν τὸν θεὸν φωνῇ μεγάλῃ περὶ ⸀πασῶν ὧν εἶδον δυνάμεων,
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/037.yaml
  text: And as he was already drawing near[a], at the descent of the Mount of Olives, the whole multitude of the disciples began rejoicing and praising God with a loud voice for all the mighty works that they had seen,
translation:
  language: zh_hans
  text: 他已经临近橄榄山的下坡处时，众门徒全都开始欢喜地为他们所看见的一切大能之事[a]高声赞美上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“神迹”或“大能的作为”；希腊文强调彰显能力的作为。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγίζοντος δὲ αὐτοῦ ἤδη
  choice: 他已经走近……时
  rationale: 以时间从句表达属格独立结构，并保留“已经”和逐渐接近的动态意味。
- source_word: πρὸς τῇ καταβάσει
  choice: 下坡处
  rationale: 指山路开始或正处于下行的地段；此译自然简洁，同时不把具体地形说得过于确定。
- source_word: τοῦ Ὄρους τῶν Ἐλαιῶν
  choice: 橄榄山
  rationale: 采用现代中文圣经和地名惯用译法。
- source_word: ἤρξαντο
  choice: ……起来
  rationale: 以汉语趋向补语自然表达动作的开始。
- source_word: ἅπαν τὸ πλῆθος τῶν μαθητῶν
  choice: 众门徒全都
  rationale: 既保留这是门徒群体，也传达ἅπαν所强调的整体性；避免生硬的“门徒的全体群众”。
- source_word: χαίροντες
  choice: 欢喜
  rationale: 保留分词所表达的伴随状态，使喜乐与赞美紧密相连。
- source_word: αἰνεῖν τὸν θεὸν
  choice: 赞美上帝
  rationale: 直接、自然地表达原文的不定式短语。
- source_word: φωνῇ μεγάλῃ
  choice: 高声
  rationale: 是现代汉语对“大声/以响亮声音”的简洁自然表达。
- source_word: περὶ πασῶν ... δυνάμεων
  choice: 为……一切大能之事
  rationale: δύναμις在此指彰显能力的作为；“大能之事”保留其能力语义，不直接窄化为技术性的“神迹”。
- source_word: ὧν εἶδον
  choice: 他们所看见的
  rationale: 清楚表明门徒亲眼见过这些作为，并在汉语语境中自然交代赞美的缘由。
theological_decisions:
- issue: 神迹语境中δυνάμεις的译法
  choice: 大能之事
  alternative: 神迹；大能的作为
  rationale: 原词既可指能力，也可指彰显能力的奇妙作为。“大能之事”保留原文的语义宽度和神圣能力的重点，不把它完全限定为一个后来的分类术语。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。调整语序，把地点纳入时间从句，并将赞美的缘由置于“高声赞美上帝”之前，使句子清楚流畅。
