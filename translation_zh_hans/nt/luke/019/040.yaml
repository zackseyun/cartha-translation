  text: καὶ ἀποκριθεὶς ⸀εἶπεν· Λέγω ὑμῖν, ⸀ὅτι ἐὰν οὗτοι ⸀σιωπήσουσιν, οἱ λίθοι ⸀κράξουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/040.yaml
  text: And answering[a], he said, “I tell you, if these become silent, the stones will cry out.”
translation:
  language: zh_hans
  text: 耶稣回答说：“我告诉你们，如果这些人沉默不语，石头就会呼喊起来。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν
  choice: 回答说
  rationale: 希腊文以分词“回答”配合主要动词“说”。“回答说”既保留回应语气，也符合现代汉语表达。
- source_word: Λέγω ὑμῖν
  choice: 我告诉你们
  rationale: 这是福音书中带强调和权威语气的常用引语公式；此译自然、清楚。
- source_word: οὗτοι
  choice: 这些人
  rationale: 指上下文中正在欢呼的门徒。汉语单说“这些”较不自然，补出类别词“人”并未进一步限定其身份。
- source_word: σιωπήσουσιν
  choice: 沉默不语
  rationale: 表达停止发声或不再说话的状态，适合这里与欢呼形成的对照；不强行限定为“开始沉默”还是“保持沉默”。
- source_word: οἱ λίθοι
  choice: 石头
  rationale: 按字面保留具体而鲜明的意象；汉语无需以冠词形式另行标示其特指性。
- source_word: κράξουσιν
  choice: 就会呼喊起来
  rationale: κράζω表示大声喊叫；“呼喊起来”体现强烈、公开发声的意味，并与条件句自然衔接。
theological_decisions:
- issue: 是否在正文中说明石头呼喊是比喻、夸张、先知性意象或神迹
  choice: 按字面保留“石头就会呼喊起来”
  alternative: 译为“受造界也会赞美上帝”或注明这是比喻
  rationale: 原文不解释这一形象的性质。按字面翻译可保留其修辞力量和神学张力，不替读者预先裁定。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“回答说”保留原文回应分词与主要动词的组合；全句简洁有力，适合公开诵读。
