  text: And he entered and was passing through Jericho[a].
translation:
  language: zh_hans
  text: 耶稣进了耶利哥，正穿行城中。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较贴近原文句法：“耶稣既进入耶利哥，正穿行其中。”
    reason: 词汇与句法替代译法：以“既进入”反映先于主句动作的不定过去时分词，并以“正穿行”反映未完成时的进行意味。
lexical_decisions:
- source_word: Καὶ
  choice: （不单独译出）
  rationale: 本词承接前文、推进叙事；现代汉语另起一句时可通过自然语序体现，无须机械译为“于是”或“然后”而增添语气。
- source_word: εἰσελθὼν
  choice: 进了
  rationale: 这是εἰσέρχομαι的简单过去主动分词，所述动作通常先于主句动词；“进了”简洁自然，并与后面的持续动作形成先后关系。
- source_word: διήρχετο
  choice: 正从城中经过
  rationale: 未完成过去时突出正在进行的动作；“正……经过”保留其未完成体意义。补出“城中”使汉语明确表达经过耶利哥城内，而不是仅从该地旁边经过。
- source_word: τὴν Ἰεριχώ
  choice: 耶利哥
  rationale: 按通行的现代中文圣经地名译法处理该专名；其宾格关系在汉语中由“经过”表达。
theological_decisions:
- issue: 主语在本节希腊文中省略
  choice: 补出“耶稣”
  alternative: 译作“他”
  rationale: 希腊文以动词形式承接前文的耶稣；中文在段落或叙事单元开头补出姓名更清楚，并未改变所指。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“正从城中经过”保留未完成过去时的进行意味；正文补明主语，脚注提供更贴近希腊文句法的译法。
