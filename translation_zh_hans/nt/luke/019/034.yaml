id: LUK.19.34
reference: Luke 19:34
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν ⸀ὅτι Ὁ κύριος αὐτοῦ χρείαν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/034.yaml
  text: And they said[a], “The Lord has need of it.”
translation:
  language: zh_hans
  text: 他们说[a]：“主需要它。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“主人需要它。”这里的“主”也可理解为“主人”，而不是对耶稣的称呼。
    reason: 保留κύριος可指主人或所有者的另一种词义理解。
lexical_decisions:
- source_word: οἱ δὲ
  choice: 他们
  rationale: οἱ承接上文，指先前提到的门徒；δέ是轻微的叙事连接词。现代汉语在此无需另译“而”或“于是”，省略更自然，也不额外强化转折或因果。
- source_word: εἶπαν
  choice: 说
  rationale: λέγω的简单过去时形式，在直接引语前直译为“说”准确自然；上下文虽是回应，但译作“回答”会加入原词未明确表达的语义。
- source_word: ὅτι
  choice: 以冒号和引号表示，不另译
  rationale: ὅτι在此引出直接引语；现代汉语用冒号和引号即可自然表达这一功能。
- source_word: Ὁ κύριος
  choice: 主
  rationale: κύριος既可作对耶稣的称号“主”，也可指“主人”。路加叙事语境较支持前者，因此正文译作“主”，同时以脚注保留真实存在的另一种理解。
- source_word: αὐτοῦ
  choice: 它
  rationale: 该属格代词指上文的小驴驹。汉语“需要它”自然表达χρείαν ἔχει加属格宾语的意义，且不比原文说得更具体。
- source_word: χρείαν ἔχει
  choice: 需要
  rationale: 该习语字面为“有……的需要”。现代汉语用动词“需要”简洁、准确且自然；译作“有需要”在此必须另加结构，反而较生硬。
theological_decisions:
- issue: 门徒回答中κύριος所指为何
  choice: 正文译作“主”，在语境中可理解为耶稣
  alternative: 译作“主人”，指小驴驹的主人
  rationale: 这句话是耶稣预先吩咐门徒使用的说法，而且路加常以κύριος称耶稣；但κύριος本身也确可表示“主人”。因此正文采用“主”，脚注保留“主人”的可能性，不把原文的词义张力武断消除。
translation_notes:
  register: 采用现代、简洁而庄重的叙事语言。“他们说”顺承上文；“主需要它”符合普通读者的自然表达。脚注标记紧跟“说”，与所提供的审校层位置一致，同时脚注说明整句中“主”的另一种译法。
