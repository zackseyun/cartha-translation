  text: καὶ διὰ τί οὐκ ἔδωκάς ⸂μου τὸ ἀργύριον⸃ ἐπὶ τράπεζαν; κἀγὼ ἐλθὼν σὺν τόκῳ ἂν ⸂αὐτὸ ἔπραξα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/023.yaml
  text: And why did you not put my money in the bank? Then when I came[a], I would have collected it with interest.
translation:
  language: zh_hans
  text: 你为什么不把我的钱交给钱庄[a]呢？那么我回来时，本可以连本带利把它收回。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“交给经营钱财的人”；直译“交在桌子上”。古时从事兑换、存放和经营钱财的人常在桌台上办理交易。
    reason: 说明 τράπεζα 的字面义，并保留其在本节金融语境中指钱庄或经营钱财者的含义。
lexical_decisions:
- source_word: διὰ τί
  choice: 为什么
  rationale: 以现代汉语最自然的疑问方式追问原因，同时保留责问语气。
- source_word: ἔδωκάς ... ἐπὶ τράπεζαν
  choice: 把……存进钱庄
  rationale: 原文直译近于“把……交在桌子上”，但在金融语境中，τράπεζα 指兑换或经营钱财者所用的桌台，进而指办理存放钱财的场所；“存进钱庄”既清楚表达经济行为，也较符合古代背景。
- source_word: μου τὸ ἀργύριον
  choice: 我的钱
  rationale: ἀργύριον 本义为“银子”，此处指作为资本的钱财；译作“钱”自然且不会误导为单指银质材料。
- source_word: κἀγὼ ἐλθὼν
  choice: 这样，等我回来
  rationale: 将分词结构自然译为时间从句；“这样”表达前句所述存放行为会带来的结果。
- source_word: σὺν τόκῳ
  choice: 连本带利
  rationale: τόκος 在此指利息；“连本带利”清楚表达收回本金并取得利息，符合现代汉语金融表达。
- source_word: αὐτὸ ἔπραξα
  choice: 把它收回
  rationale: πράσσω 在此具有收取、追收款项之意；“收回”贴合主人取回本金及利息的情境。
- source_word: ἂν ... ἔπραξα
  choice: 就可以……收回了
  rationale: ἄν 与过去时态表达未实现的假设结果；“就可以……了”保留“本来能够如此”的反事实意味。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“钱庄”比现代制度色彩较强的“银行”更贴近比喻的古代环境；句末用反事实语气呈现主人对仆人的责问。
