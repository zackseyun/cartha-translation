- from: 你为什么不把我的钱存进钱庄[a]呢？这样，等我回来，就可以连本带利把它收回了。
  to: 你为什么不把我的钱交给钱庄[a]呢？那么我回来时，本可以连本带利把它收回。
  rationale: 修订明确原文未实现的假设结果，并使“交给”更贴近 ἔδωκας 的动作。脚注改为以本节“利息”的金融语境为中心，同时保留“桌子”的字面信息及古代桌台交易背景。
