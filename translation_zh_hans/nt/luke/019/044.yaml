  text: καὶ ἐδαφιοῦσίν σε καὶ τὰ τέκνα σου ἐν σοί, καὶ οὐκ ἀφήσουσιν ⸂λίθον ἐπὶ λίθον ἐν σοί⸃, ἀνθ’ ὧν οὐκ ἔγνως τὸν καιρὸν τῆς ἐπισκοπῆς σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/044.yaml
  text: and they will level you to the ground[a], and your children within you, and they will not leave one stone upon another within you, because you did not recognize the time of your visitation.
translation:
  language: zh_hans
  text: 他们要把你和你里面的儿女夷为平地；他们不会在你里面留下一块石头在另一块石头上，因为你没有认出你被眷顾的时刻[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你受鉴察的时刻。”希腊语所用的词可指探访、眷顾或鉴察，尤其可指上帝的临到；这种临到可能带来怜悯，也可能带来审判。
    reason: 说明ἐπισκοπή的词义范围，并保留其可能涉及恩典或审判的含义张力。
lexical_decisions:
- source_word: ἐδαφιοῦσίν
  choice: 夷为平地
  rationale: 该动词表示使某物倒塌至地面、彻底摧毁。“夷为平地”是自然有力的现代汉语表达，保留原文彻底毁灭的力度。
- source_word: σε
  choice: 你
  rationale: 原文用第二人称单数，将耶路撒冷人格化。“你”保留了耶稣直接对城说话的修辞，不增译为“你的城”。
- source_word: τὰ τέκνα σου ἐν σοί
  choice: 你里面的儿女
  rationale: τέκνα直译为“儿女”，语境中指城内的居民。保留“儿女”可维持耶路撒冷如母亲般的人格化意象，而不将其平化为“居民”。
- source_word: οὐκ ἀφήσουσιν λίθον ἐπὶ λίθον ἐν σοί
  choice: 他们不会在你里面留下一块石头叠在另一块石头上
  rationale: 明确保留ἐν σοί“在你里面”，并以自然汉语呈现“石头在石头上”的彻底毁坏意象。
- source_word: ἀνθ’ ὧν
  choice: 因为
  rationale: 此处引出审判临到的原因；“因为”清楚、自然地表达其因果意义。
- source_word: ἔγνως
  choice: 认出
  rationale: γινώσκω在此不只是获得知识，而是辨认并领会上帝决定性的临到；“认出”比单纯的“知道”更贴切。
- source_word: καιρὸν
  choice: 时刻
  rationale: καιρός指具有决定性意义的特定时机。“时刻”简洁地表达这一意义，又不额外加入“指定”等解释。
- source_word: τῆς ἐπισκοπῆς σου
  choice: 你受察访的
  rationale: ἐπισκοπή可指探访、察看或鉴察，尤其可用于上帝带来怜悯或审判的临到。“受察访”在汉语中兼具来访与察看意味，且不明说结果，尽量保存原文的含义张力。
theological_decisions:
- issue: 审判语境中ἐπισκοπή的含义
  choice: 译作“受察访”，让上帝临到的意味保持含蓄
  alternative: “受鉴察”或“上帝眷顾你”
  rationale: 该词既可涉及施恩的眷临，也可涉及鉴察与审判。上下文显示耶路撒冷因未认出上帝在耶稣里的临到而受审判，但原词本身没有把临到的性质限定为单一结果，因此不宜只译成恩慈的“眷顾”或纯审判性的“鉴察”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“夷为平地”保留毁灭的力度；重复“你里面”及“儿女”则保留耶路撒冷人格化的修辞。标点将两个并列的毁灭行动分开，使长句清晰，同时维持原文连续宣告的语气。
