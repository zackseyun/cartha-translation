  yaml_path: translation/nt/luke/019/006.yaml
  text: And he hurried down and welcomed him joyfully[a].
translation:
  language: zh_hans
  text: 他就赶紧下来，欢欢喜喜地接待耶稣。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他就赶紧下来，喜乐地接待了他。”
    reason: 保留χαίρων较贴近形式的表达，并保留原文代词αὐτόν。
lexical_decisions:
- source_word: σπεύσας
  choice: 赶紧
  rationale: 这个不定过去时分词表示迅速而迫切地行动；“赶紧”自然地传达立即行动的意味。
- source_word: κατέβη
  choice: 下来
  rationale: 保留动词的方向含义，与上下文中撒该在树上相符。
- source_word: ὑπεδέξατο
  choice: 接待
  rationale: 该中间语态动词指迎接、接纳，常带有款待客人的意味；“接待”在现代汉语中能自然体现这一层含义。
- source_word: αὐτόν
  choice: 耶稣
  rationale: 原文为“他”，指向耶稣。汉语连续使用多个男性代词容易产生所指含混，因此在不改变所指的前提下明确为“耶稣”。
- source_word: χαίρων
  choice: 欢欢喜喜地
  rationale: 现在时分词表示接待时伴随的喜乐状态；“欢欢喜喜地”自然、鲜明地表达“带着喜乐”。
- source_word: καὶ ... καὶ
  choice: 就……，……
  rationale: 首个καί承接耶稣此前的命令，译作“就”自然表示随即回应；后一个连接连续动作，汉语可用逗号衔接，避免生硬重复“并且”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通俗的叙事语言。“欢欢喜喜地”具有自然口语感，又不失经文叙事的尊严；为避免“他”在同句中指向撒该与耶稣而产生歧义，正文将宾语明确为“耶稣”，脚注保留较形式对应的代词译法。
