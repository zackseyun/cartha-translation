  source_fidelity: 译文准确传达了属格独立结构所表示的同时动作、两次出现的“解开”，以及主人所发出的问句。上文语境可将πῶλον具体译为“小驴”。不过，“主人们”在现代汉语中不自然，且脚注的“所有人”会被理解为“全体的人”，并非“所有者”。
  naturalness: “主人们”带有不必要且生硬的汉语复数标记。汉语的“主人”本身可以按语境指一位或多位物主；以脚注说明希腊文复数即可，既自然又保留原文信息。将“解”明确为“解开”也更符合拴住牲畜的具体动作。
  terminology: κύριοι在此为小驴的人类物主，译作“主人”恰当，不带“主”作为神学称号的含义。脚注应以“物主”或“主人”为词义备选，不应使用歧义很大的“所有人”。
