  text: λυόντων δὲ αὐτῶν τὸν πῶλον εἶπαν οἱ κύριοι αὐτοῦ πρὸς αὐτούς· Τί λύετε τὸν πῶλον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/033.yaml
  text: And as they were untying the colt[a], its owners said to them, “Why are you untying the colt?”
translation:
  language: zh_hans
  text: 他们正解开那匹小驴的时候，小驴的主人[a]对他们说：“你们为什么解开这匹小驴？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“物主”。希腊文用的是“主、主人”（κύριος）的复数；这里指这匹小驴的人类所有者。
    reason: 说明 κύριοι 的字面形式、复数信息及其在本处的非神学含义。
lexical_decisions:
- source_word: λυόντων
  choice: 解……的时候
  rationale: 现在时主动分词属格独立结构，表示与主句同时发生的动作；“解”自然地指解开拴牲畜的绳索，并与后面的 λύετε 保持同词呼应。
- source_word: δὲ
  choice: 不单独译出
  rationale: 此处 δέ 是轻微的叙事连接词；汉语用句序即可自然推进叙事，若硬译“于是”或“而”反显累赘或加强语气。
- source_word: αὐτῶν
  choice: 他们
  rationale: 代词承接上文受差遣的两个人；不在本节中擅自补成“门徒”，以保留原文的代词表达。
- source_word: πῶλον
  choice: 小驴
  rationale: πῶλος 泛指幼畜，但上文语境明确是驴驹；现代汉语中“小驴”清楚自然。
- source_word: εἶπαν
  choice: 说
  rationale: 直接对应 λέγω 的普通用法；虽然后接问句，译作“说”仍忠实自然。
- source_word: οἱ κύριοι αὐτοῦ
  choice: 小驴的主人们
  rationale: κύριοι 是 κύριος 的复数，此处指这匹小驴的人类所有者，并非神学称号；“主人们”既表达复数，也保留“主人/主”的词义联系。
- source_word: πρὸς αὐτούς
  choice: 对他们
  rationale: 符合 πρός 加宾格用于言说对象的通常意义，也合乎现代汉语表达。
- source_word: Τί
  choice: 为什么
  rationale: τί 在此问句中询问行动的缘由或目的，汉语自然译为“为什么”。
- source_word: λύετε
  choice: 解
  rationale: 现在时动词描述正在进行的动作；汉语问句“为什么解……”在当前场景中自然表达进行意义，并与前面的 λυόντων 重复同一动词。
theological_decisions:
- issue: 非神学语境中 κύριοι 的译法
  choice: 主人们
  alternative: 所有人；物主；主们
  rationale: 这里的 κύριοι 指小驴的人类主人。译作“主人们”可避免把它误解为对主的神学称号，同时比“所有人”更不易产生歧义，也保留原文复数。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“解小驴”按汉语习惯理解为解开拴住它的绳索；“主人们”保留原文复数，并以脚注交代词义。
