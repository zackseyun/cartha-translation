revisions:
- from: 众人看见了，就都嘀咕起来，说：“他竟然进了一个罪人的家住宿。”
  to: 众人看见这事，都嘀咕起来，说：“他到一个罪人家里去住宿了。”
  rationale: 修订明确“看见”的事件指向，保留“众人……都”及抱怨的起始、持续意味；删除原文未明说的“竟然”，并以更自然的汉语表达进入并停留的目的关系。增设词义脚注，呈现καταλῦσαι可译为“作客”的替代可能。
