  text: καὶ ἰδόντες πάντες διεγόγγυζον λέγοντες ὅτι Παρὰ ἁμαρτωλῷ ἀνδρὶ εἰσῆλθεν καταλῦσαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/007.yaml
  text: And when they all saw it[a], they began to grumble, saying, “He has gone in to stay with a sinful man.”
translation:
  language: zh_hans
  text: 众人看见这事，都嘀咕起来，说：“他到一个罪人家里去住宿了。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδόντες
  choice: 看见了
  rationale: 将不定过去时分词按时间背景自然表达；所看见的事由上下文补足，无须在中文中另加宾语。
- source_word: πάντες
  choice: 众人……都
  rationale: 以“众人……都”的呼应结构保留全体性的强调，同时符合现代汉语习惯。
- source_word: διεγόγγυζον
  choice: 嘀咕起来
  rationale: “嘀咕”表达带有不满的低声议论；“起来”体现未完成时在此可有的起始并持续意味。
- source_word: λέγοντες
  choice: 说
  rationale: 自然引出众人嘀咕的具体内容，避免生硬复制希腊语分词结构。
- source_word: παρὰ ἁμαρτωλῷ ἀνδρὶ
  choice: 一个罪人的家
  rationale: παρά加与格表示在某人那里；结合εἰσῆλθεν，中文用“进了……的家”自然呈现地点关系。“罪人”保留群众对撒该的贬斥性定性；原文ἀνήρ在此指具体男性，但汉语“罪人”已可按上下文指撒该，无须添加不自然的“有罪的男人”。
- source_word: εἰσῆλθεν
  choice: 竟然进了
  rationale: “进了”直接表达进入的完成动作；“竟然”传达抱怨话语中明显的非难语气，但不改变命题内容。
- source_word: καταλῦσαι
  choice: 住宿
  rationale: 该词在此指在别人家留宿或作客停留；“住宿”简洁、现代，并保留是否过夜的轻微开放性。
theological_decisions:
- issue: 众人对撒该的称呼
  choice: 一个罪人
  alternative: 一个有罪的男人
  rationale: 原文是形容词ἁμαρτωλός加阳性名词ἀνήρ，但现代汉语若逐词译为“有罪的男人”会显得生硬，也可能被误解为法律罪犯。“罪人”准确保留群众的道德与宗教性评价，且上下文清楚表明对象为男性。
- issue: καταλῦσαι所指的款待性质
  choice: 住宿
  alternative: 作客
  rationale: “住宿”保留停留、投宿的核心意义，不额外明确款待关系；“作客”也是语境上可能的理解，但解释性更强。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“嘀咕起来”保留群众持续抱怨的群体反应；引语用“竟然”呈现其非难口吻。未设置脚注，因为正文已能准确表达原文，且“作客”这一词义差异不足以影响本节理解。
