review_pass:
  verdict: revise
  source_fidelity: 原文说众人看见此事后全都持续抱怨；抱怨内容是耶稣“进到一个罪人那里”为要停留/住宿。草稿总体意思正确，但“进了一个罪人的家住宿”将“进入”与目的不定式连用略显生硬，且“家”虽合语境却不是原文明确说出的名词。
  naturalness: “众人看见了，就都嘀咕起来”自然，但补出“这事”会使所见的事件指向更清楚。“到一个罪人家里去住宿”是现代汉语中更顺畅的表达；“竟然”可反映抱怨语气，却是译者添加的评价色彩，宜让“嘀咕起来”和上下文承载非难语气。
  terminology: “罪人”准确传达ἁμαρτωλῷ ἀνδρί在此作为群众贬抑性的称呼；不必生硬译作“有罪的男人”。“住宿”可表达καταλῦσαι的停留、投宿之意；脚注可给出“作客”的可行译法。
  issues:
  - severity: medium
    issue: “竟然”在引语中增添了原文未明说的显性惊讶/谴责副词。
    rationale: 群众的抱怨语气由διεγόγγυζον及语境明确，但希腊引语本身只陈述他已进去停留。删去“竟然”可避免把语气强化为特定措辞，同时不削弱非难语境。
  - severity: low
    issue: “进了一个罪人的家住宿”搭配略不自然，且“家”是由语境推知。
    rationale: εἰσῆλθεν与καταλῦσαι可自然译为“到一个罪人家里去住宿”；这保留语境所指的住处，并使动作和目的关系清晰。
  revised_text: 众人看见这事，都嘀咕起来，说：“他到一个罪人家里去住宿了。”
  revised_footnotes:
  - marker: a
    text: 或译“他到一个罪人那里去作客了”。
    reason: καταλῦσαι可指停留住宿，也可按作客的关系表达；正文保留“住宿”这一较直接的表达。
  revision_rationale: 修订明确“看见”的事件指向，保留“众人……都”及抱怨的起始、持续意味；删除原文未明说的“竟然”，并以更自然的汉语表达进入并停留的目的关系。增设词义脚注，呈现καταλῦσαι可译为“作客”的替代可能。
