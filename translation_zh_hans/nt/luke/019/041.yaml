  text: Καὶ ὡς ἤγγισεν, ἰδὼν τὴν πόλιν ἔκλαυσεν ἐπ’ ⸀αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/041.yaml
  text: And as he drew near[a], seeing the city, he wept over it,
translation:
  language: zh_hans
  text: 他走近时，看见那城，就为它哭泣。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς ἤγγισεν
  choice: 他走近时
  rationale: ὡς加不定过去时动词在这里引出时间情境；“走近时”自然表达他正接近耶路撒冷，又不补出原文未明说的宾语。
- source_word: ἰδὼν τὴν πόλιν
  choice: 看见那城
  rationale: 不定过去时分词ἰδών表示在主句动作发生时或稍前的看见；“那城”保留πόλις的简洁表达，耶路撒冷由上下文确定，无须在本节增补城名。
- source_word: ἔκλαυσεν
  choice: 哭泣
  rationale: κλαίω指流泪、哭泣，有时可含出声哀哭；“哭泣”庄重而自然，也不额外加入“痛哭”等原文未明确表达的强度。
- source_word: ἐπ’ αὐτήν
  choice: 为它
  rationale: ἐπί加宾格与κλαίω连用，表示因某对象而哭、为其哀哭；“为它哭泣”在现代汉语中直接表达耶稣因那城而哀伤。代词“它”回指“城”，不把希腊语的语法阴性误作生物性别。
theological_decisions:
- issue: 是否借希腊语阴性代词将耶路撒冷显著人格化
  choice: 用“它”回指“那城”
  alternative: 用“她”，或译作“为那城哀哭”以避免代词
  rationale: αὐτήν的阴性首先是与阴性名词πόλις保持语法一致，并不单独证明这里必须人格化耶路撒冷。现代汉语通常以“它”回指城市，既自然，也保留耶稣以那城为哀哭对象的含义；上下文可能形成的人格化色彩不应仅凭语法性别强加于本节。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语体。“他走近时……就……”保留原文从接近、看见到哭泣的紧凑推进；不补出“耶路撒冷”，因为“那城”的所指由上下文清楚提供。
