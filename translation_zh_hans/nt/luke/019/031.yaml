id: LUK.19.31
reference: Luke 19:31
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἐάν τις ὑμᾶς ἐρωτᾷ· Διὰ τί λύετε; οὕτως ⸀ἐρεῖτε ὅτι Ὁ κύριος αὐτοῦ χρείαν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/031.yaml
  text: 'And if anyone asks you[a], ‘Why are you untying it?’ you shall say this: ‘The Lord has need of it.’'
translation:
  language: zh_hans
  text: 如果有人问你们：‘为什么解开它？’你们就要这样说：‘主[a]需要它。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“主人”。
    reason: κύριος既可作称号“主”，也可在一般意义上指“主人”；正文采用更符合路加叙事用法的“主”，脚注保留另一可能。
lexical_decisions:
- source_word: ἐρωτᾷ
  choice: 问
  rationale: 在直接问话的语境中，普通话用“问”最自然，也准确表达提出问题的意思。
- source_word: Διὰ τί
  choice: 为什么
  rationale: 这是现代汉语中自然、简明的原因疑问表达。
- source_word: λύετε
  choice: 解开它
  rationale: 上下文所指的是解开拴着的驴驹；希腊文省略宾语，汉语为清楚起见补出“它”。
- source_word: οὕτως ἐρεῖτε
  choice: 就要这样说
  rationale: 将将来时在此处所带的指示、命令意味自然地表达出来，同时保留οὕτως“这样”的方式含义。
- source_word: κύριος
  choice: 主
  rationale: 既符合路加对耶稣的常见称呼，也保留这一称号可能具有的神学分量；“主人”仍是语境上可考虑的理解。
- source_word: αὐτοῦ χρείαν ἔχει
  choice: 需要它
  rationale: χρείαν ἔχει是“需要”的惯用表达；αὐτοῦ在眼前语境中最自然地回指那匹驴驹，现代汉语用“它”指动物。
theological_decisions:
- issue: Ὁ κύριος的所指和称号意味
  choice: 译作“主”，理解为耶稣，并保留该称号在路加叙事中的神学意味。
  alternative: 译作“主人”，按较一般的物主或上位者称谓理解。
  rationale: 路加福音常以κύριος称耶稣，当前叙事也支持这一所指；但该词本身可有“主人”之义，因此以脚注保留这一真实的词义可能性。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事表达。引语层次清楚；“就要这样说”保留原文的指示语气，避免文言化的“如此说”。
