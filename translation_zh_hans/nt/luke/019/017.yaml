  text: καὶ εἶπεν αὐτῷ· ⸀Εὖγε, ἀγαθὲ δοῦλε, ὅτι ἐν ἐλαχίστῳ πιστὸς ἐγένου, ἴσθι ἐξουσίαν ἔχων ἐπάνω δέκα πόλεων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/017.yaml
  text: And he said to him[a], “Well done, good servant; because you were faithful in a very small matter, have authority over ten cities.”
translation:
  language: zh_hans
  text: 他对他说：“做得好，良善的仆人[a]！你既在极小的事上忠心，你可以管理十座城。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“奴隶”。希腊语doulos可按语境指“仆人”或“奴隶”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὖγε
  choice: 做得好
  rationale: 这是表示赞许的感叹语；“做得好”自然、直接地传达嘉许。
- source_word: ἀγαθὲ
  choice: 良善的
  rationale: 在呼语中直接修饰δοῦλε；“良善的”庄重自然，并保留道德上的肯定。
- source_word: δοῦλε
  choice: 仆人
  rationale: 本词可指仆人或奴隶。比喻中的主从关系清楚，但此处重点是受托后的忠心，因此正文用自然的“仆人”，另在脚注保留“奴隶”这一词义。
- source_word: ἐν ἐλαχίστῳ
  choice: 在极小的事上
  rationale: 保留ἐλάχιστος所表达的极小程度，也以现代汉语清楚表达忠心所涉及的事项。
- source_word: πιστὸς ἐγένου
  choice: 忠心
  rationale: 在此评价语境中表示他在所托之事上是可靠、忠诚的；“忠心”简洁贴切，不额外加入“证明了”的推论。
- source_word: ἴσθι ἐξουσίαν ἔχων
  choice: 就有权管理
  rationale: 该迂回命令结构表示处于拥有权柄的地位；结合管理城市的语境，“有权管理”比单说“有权柄”更自然清楚。
- source_word: ἐπάνω δέκα πόλεων
  choice: 十座城
  rationale: ἐπάνω在此表示治理范围；中文在“有权管理”之后无需另译“在……之上”，πόλεις直译为“城”。
theological_decisions:
- issue: 比喻中δοῦλος的译法
  choice: 仆人
  alternative: 奴隶
  rationale: “仆人”能自然呈现主人与属下的关系，并符合本节奖赏忠心受托者的语境；“奴隶”更突出法律与社会身份，因此列入脚注以保留原词的语义范围。
- issue: 奖赏语句ἴσθι ἐξουσίαν ἔχων的力度
  choice: 就有权管理十座城
  alternative: 你要掌管十座城
  rationale: 原文强调拥有权柄的状态，同时带有授予职权的命令意味；正文保留“有权”，避免把它仅仅处理成一般任务指派。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“主人”补出汉语所需的明确主语，所指承接比喻中的贵族主人；引语使用自然的嘉许句式。
