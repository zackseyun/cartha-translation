source:
  edition: SBLGNT
  text: ⸀λέγω ὑμῖν ὅτι παντὶ τῷ ἔχοντι δοθήσεται, ἀπὸ δὲ τοῦ μὴ ἔχοντος καὶ ὃ ἔχει ⸀ἀρθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/026.yaml
  text: I tell you that to everyone who has[a], more will be given; but from the one who does not have, even what he has will be taken away.
translation:
  language: zh_hans
  text: 我告诉你们：凡有的，还要加给他[a]；没有的，连他所有的也要夺去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“将给他”。希腊原文没有明说“更多”，但上下文通常含有增加之意。
    reason: 说明“加给”所传达的上下文隐含增量，并保留原文字面上仅说“将被给予”的可能性。
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: 我告诉你们
  rationale: 保留直陈语气和复数受众；“告诉你们”符合现代汉语中郑重宣告的表达。
- source_word: παντὶ τῷ ἔχοντι
  choice: 凡有的
  rationale: 带冠词的分词作名词用，泛指每一个“有”的人；“凡有的”简洁自然，并保留原文没有明说所拥有之物的概括性。
- source_word: δοθήσεται
  choice: 还要给他
  rationale: 原词直义为“将被给予”。“还”在汉语中自然表达上下文所含的追加之意，同时以脚注说明原文并未明说“更多”。“给他”也自然传达希腊语被动式的含义，而不指定施予者。
- source_word: ἀπὸ δὲ τοῦ μὴ ἔχοντος
  choice: 没有的
  rationale: 与前句“凡有的”形成简洁鲜明的对照；不补出具体缺少什么，保留格言式表达的开放性。转折由分号和句义自然体现，无须机械译出 δέ。
- source_word: καὶ ὃ ἔχει
  choice: 连他所有的也
  rationale: 此处 καί 有加强语气的作用，“连……也”准确传达“甚至”的意味；“他”按现代汉语作泛指，不限定男性。
- source_word: ἀρθήσεται
  choice: 要夺去
  rationale: 未来被动式在此表示被拿走、被剥夺；“夺去”清楚表达失去所拥有之物的结果，又不擅自说明行动者。
theological_decisions:
- issue: 这句格言所指的增加与失去
  choice: 按原文概括地译为“有”“没有”“给”“夺去”，不说明其具体对象或神学机制。
  alternative: 明确解释为才干、管家职责、救恩、功德或某种国度原则。
  rationale: 本节本身保持格言式的简练和张力；虽然上下文涉及受托与交账，译文不应把某一种系统神学解释嵌入经文。
- issue: 被动式行动者
  choice: 不明说是谁给予或夺去。
  alternative: 补译为“神要给他”或“主人要夺去”。
  rationale: 两个希腊语动词均为被动式，原文没有明确说出行动者；保留这种含蓄可避免过度解释。
translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语，保留原文格言式的对称结构。“凡有的……没有的……”不补明其宾语，以保存原文的概括性和解释张力。
