  text: πλὴν τοὺς ἐχθρούς μου ⸀τούτους τοὺς μὴ θελήσαντάς με βασιλεῦσαι ἐπ’ αὐτοὺς ἀγάγετε ὧδε καὶ κατασφάξατε ⸀αὐτοὺς ἔμπροσθέν μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/027.yaml
  text: But as for these enemies of mine[a], who did not want me to reign over them[b], bring them here and slaughter them in front of me.
translation:
  language: zh_hans
  text: 至于我这些仇敌，那些不愿意让我作王统治他们的人，把他们带到这里来，在我面前把他们杀掉。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “杀掉”也可译作“屠杀”。原文动词的语气比一般的“杀”更强烈。
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: 至于
  rationale: 在这里引出贵族话语中最后一个强烈而突出的事项；“至于”自然体现转折兼话题转换的作用。
- source_word: τοὺς ἐχθρούς μου τούτους
  choice: 我这些仇敌
  rationale: 保留“我的”以及指示词“这些”的特指和强调，现代汉语表达自然。
- source_word: τοὺς μὴ θελήσαντάς με βασιλεῦσαι ἐπ’ αὐτοὺς
  choice: 就是那些不愿意让我作王统治他们的人
  rationale: 以同位关系从句表达带冠词的分词结构；“不愿意”保留其意志性的拒绝，“作王统治”兼顾 βασιλεύω 的君王身份和统治动作。
- source_word: ἀγάγετε ὧδε
  choice: 把他们带到这里来
  rationale: 准确表达带领或带来某人至说话者所在之处的命令，在现代汉语中顺畅直接。
- source_word: κατασφάξατε
  choice: 杀掉
  rationale: 表达明确而强烈的杀戮命令，同时避免“处决”所增添的司法含义；脚注补充更具血腥强度的译法。
- source_word: ἔμπροσθέν μου
  choice: 在我面前
  rationale: 既可表示空间上的面前，也自然传达在说话者亲自注视或临在之下，保留原句的鲜明力度。
theological_decisions:
- issue: 比喻中说话者的指向
  choice: 直接翻译贵族的命令，不淡化其暴力，也不在译文中将它明说为耶稣在比喻之外亲自发出的命令。
  alternative: 用附加措辞把这句话更明显地限定为纯粹的比喻意象。
  rationale: 希腊文把这句话呈现为比喻中贵族的直接话语；译文应保留叙事力度和神学张力，不加入原文没有的解释性判断。
translation_notes:
  register: 采用现代、庄重而直接的普通话。“仇敌”比“敌人”略具经文语体但仍通俗；“作王统治”避免只保留身份或只保留一般治理意义。正文中的[a]与脚注对应。
