  text: καὶ τοῖς παρεστῶσιν εἶπεν· Ἄρατε ἀπ’ αὐτοῦ τὴν μνᾶν καὶ δότε τῷ τὰς δέκα μνᾶς ἔχοντι—
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/024.yaml
  text: And he said to those standing by[a], ‘Take the mina from him and give it to the one who has the ten minas.’
translation:
  language: zh_hans
  text: 于是他对站在旁边的人说：“把那一米那[a]从他那里拿走，交给那拥有十米那的人。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “米那”是古代的一种货币单位，也可作重量单位；传统中文译法有“锭银”。
    reason: 说明“米那”的历史性单位含义，并提供相关的传统中文译法。
lexical_decisions:
- source_word: παρεστῶσιν
  choice: 站在旁边的人
  rationale: 这是带冠词、作名词使用的完成时主动分词，指当时在近旁的人；此译法既保留具体场景，也符合现代汉语表达。
- source_word: Ἄρατε
  choice: 拿走
  rationale: 此处 αἴρω 表示拿去、移走；结合 ἀπ’ αὐτοῦ，译作“从他那里拿走”准确而自然。
- source_word: ἀπ’ αὐτοῦ
  choice: 从他那里
  rationale: ἀπό 加属格表示分离；“从他那里”不额外引入“手里”等原文未明说的细节。
- source_word: μνᾶν
  choice: 米那
  rationale: μνᾶ 是古代货币或重量单位；采用音译可保留历史背景，避免用现代币值造成误解。
- source_word: δότε
  choice: 交给
  rationale: δίδωμι 在这里指把取来的钱转交给另一人；“交给”比单用“给”更清楚地呈现转移关系。
- source_word: τῷ ... ἔχοντι
  choice: 那有……的人
  rationale: 带冠词的与格分词作名词使用；此译法自然，并不添加原文没有明说的性别信息。
- source_word: τὰς δέκα μνᾶς
  choice: 十米那
  rationale: 指前文已经提到的十米那；汉语中由“那……的人”及上下文自然表达其特指性，无须机械翻出希腊语冠词。
theological_decisions:
- issue: 古代货币单位 μνᾶ 的译法
  choice: 米那
  alternative: 锭银；磅
  rationale: 音译“米那”直接保留希腊原文的古代单位，不把它误换成现代货币，也不把单位泛化为形状或材质未必固定的“锭银”。本处不涉及教义取舍。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。引语中的两个命令简洁有力；保留“站在旁边”所呈现的具体场景。脚注标记紧随“米那”，与脚注实际说明的词对应。
