  naturalness: “那有十米那的人”虽可理解，但略显生硬；“那拥有十米那的人”更符合现代标准汉语。将受事“那一米那”前置，也使第一个命令更顺畅清楚。
  terminology: “米那”适当地保留了古代货币单位，避免以现代货币替代。脚注宜聚焦本段语境中的货币单位；“磅”是传统英语译法的对应说法，在中文脚注中容易造成不必要的混淆，删去为宜。
