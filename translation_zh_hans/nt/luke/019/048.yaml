  text: καὶ οὐχ ⸀εὕρισκον τὸ τί ποιήσωσιν, ὁ λαὸς γὰρ ἅπας ἐξεκρέματο αὐτοῦ ἀκούων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/048.yaml
  text: And they could not find what they might do[a], because all the people were hanging on his words as they listened.
translation:
  language: zh_hans
  text: 他们却想不出该怎么办[a]，因为众人都全神贯注地听他讲。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们却找不到可以采取什么行动。”
    reason: 保留οὐχ εὕρισκον与商议式τί ποιήσωσιν较贴近字面的表达，并反映“想不出该怎么办”的译法选择。
lexical_decisions:
- source_word: οὐχ εὕρισκον
  choice: 想不出
  rationale: 未完成时配合否定，表达持续未能找到办法；“想不出”自然传达这种实际上的无计可施。
- source_word: τὸ τί ποιήσωσιν
  choice: 该怎么办
  rationale: τί加不定过去时虚拟语气带有商议意味，指他们试图确定可采取什么行动；“该怎么办”在现代汉语中自然保留这一意味。
- source_word: ὁ λαὸς γὰρ ἅπας
  choice: 因为众人都
  rationale: γάρ说明他们想不出办法的原因；ἅπας强调全体，译作“众人都”简洁自然。
- source_word: ἐξεκρέματο αὐτοῦ
  choice: 全神贯注地
  rationale: 该习语字面为“悬在他身上”，在此表示注意力完全被耶稣吸引；结合ἀκούων译为“全神贯注地听”，既传达强烈、热切的专注，也避免生硬直译。
- source_word: ἀκούων
  choice: 听他讲
  rationale: 现在分词说明众人专注于他的方式，是正在听他；“听他讲”符合上下文和现代汉语习惯。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的叙事语体。“全神贯注地听他讲”以自然汉语传达希腊语“悬在他身上听”的强烈专注意象；不将“他的话”作为原文未明说的宾语加入正文。
