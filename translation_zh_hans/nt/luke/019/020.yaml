  text: καὶ ⸀ὁ ἕτερος ἦλθεν λέγων· Κύριε, ἰδοὺ ἡ μνᾶ σου ἣν εἶχον ἀποκειμένην ἐν σουδαρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/020.yaml
  text: And the other came[a], saying, ‘Lord, look, here is your mina, which I kept laid away in a cloth.’
translation:
  language: zh_hans
  text: 另一个人也来了，说：“主啊，请看，这是你的那一弥拿[a]；我一直把它包在一块布[b]里收着。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弥拿”是古代的货币单位。
    reason: 说明μνᾶ的音译及其在本段中的货币含义。
  - marker: b
    text: “一块布”或译“一条手巾”。希腊语 σουδάριον 指一块布，常用来擦脸或擦汗。
    reason: 保留该词可指面巾或手巾的较具体含义。
lexical_decisions:
- source_word: ὁ ἕτερος
  choice: 另一个人
  rationale: 指与前面仆人相对的另一个人；不额外断定他是最后一个，保留原文表达的范围。
- source_word: ἦλθεν λέγων
  choice: 也来了，说
  rationale: 以自然的现代汉语表达分词结构，同时保留他前来并开口陈述的叙事次序；καί结合上下文译作“也”。
- source_word: Κύριε
  choice: 主人
  rationale: 在比喻中，这是仆人对贵族主人的直接称呼；“主人”符合当下语境，也避免把称呼自动处理成明确的基督论宣认。另一可能“主啊”列入说明。
- source_word: ἰδοὺ
  choice: 请看……在这里
  rationale: 同时传达引起注意和当面出示银钱的功能，比古雅的“看哪”更符合现代口语而不失庄重。
- source_word: ἡ μνᾶ σου
  choice: 你的一弥拿
  rationale: 音译古代货币和重量单位 μνᾶ，避免用现代币制或暗示特定形状、材质的“一锭银子”替代。
- source_word: ἣν εἶχον ἀποκειμένην
  choice: 我一直把它……包着收起来
  rationale: “一直”和“收起来”体现 εἶχον 加分词所表达的持续存放状态，而非仅描述一次性的收藏动作。
- source_word: ἐν σουδαρίῳ
  choice: 用一块布包着
  rationale: σουδάριον 是可用来擦脸或擦汗的布；正文用宽泛自然的“一块布”，并在脚注保留较具体的“手巾”译法。
theological_decisions:
- issue: 比喻中直接称呼 κύριος 的译法
  choice: 主人
  alternative: 主啊
  rationale: 所称呼的是比喻中的贵族主人，因此“主人”最直接地反映叙事情境；脚注保留“主啊”的可能，以免抹去 κύριος 本身较宽的语义及其潜在呼应。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。对话中的“请看……在这里”保持现场出示钱财的语气；“一直……收起来”凸显持续保管的状态。所有脚注标记均置于正文对应词语之后。
