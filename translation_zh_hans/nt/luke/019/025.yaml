  text: 他们对他说：“主啊，他有十弥拿——”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: 他们
  rationale: 希腊文以简单连接词承接上文；现代汉语叙事中无需机械译出“于是/而”，直接进入主语更自然，也不额外加入时间或转折意味。
- source_word: εἶπαν αὐτῷ
  choice: 对他说
  rationale: 以现代汉语自然表达间接宾语结构；复数动词所含的主语译为“他们”。
- source_word: Κύριε
  choice: 主人
  rationale: 这里是比喻中仆人对有权柄者的直接称呼；“主人”符合场景并保留尊称意味，同时不把该称呼直接定性为明确的基督论称号。
- source_word: ἔχει
  choice: 已经有……了
  rationale: 动词本身表示现在拥有；“已经……了”结合紧接上文的反对语气，使现代汉语自然，但没有改变其核心所有关系。
- source_word: δέκα
  choice: 十
  rationale: 直接对应基数词。
- source_word: μνᾶς
  choice: 弥拿
  rationale: 采用古代货币单位的音译，保留历史文化背景，避免用现代币制或“镑”等易引起误解的等值替换。
theological_decisions:
- issue: 比喻中呼语 Κύριε 的译法
  choice: 主人
  alternative: 主；先生
  rationale: 上下文是臣仆向比喻中的权柄人物说话，“主人”最自然地体现关系与权威；脚注保留“主”和“先生”的可能性，避免把这里的称呼过度解释为神学宣认，也不抹去 κύριος 的语义张力。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事表达。“已经……了”呈现人物惊讶或异议的自然语气；句末破折号保留原文话语未完、被叙事打断的效果。所有脚注标记均置于其所说明的词语之后。
