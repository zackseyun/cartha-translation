  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καλέσας δὲ δέκα δούλους ἑαυτοῦ ἔδωκεν αὐτοῖς δέκα μνᾶς καὶ εἶπεν πρὸς αὐτούς· ⸀Πραγματεύσασθε ⸂ἐν ᾧ⸃ ἔρχομαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/013.yaml
  text: After calling ten of his own slaves[a], he gave them ten minas and said to them[c][b], “Do business until I come.”
translation:
  language: zh_hans
  text: 他叫来自己的十个奴仆[a]，交给他们十弥拿[b]，对他们说：“你们去做生意[c]，直到我回来。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“奴隶”或“仆人”。希腊语 doulos 可按语境指仆人或奴隶。
    reason: alternative_reading
  - marker: b
    text: “弥拿”是古代的一种货币单位。
    reason: cultural_note
  - marker: c
    text: 或译“去经商”或“去经营”。
    reason: lexical_alternative
lexical_decisions:
- source_word: καλέσας
  choice: 叫来
  rationale: 不定过去时分词表示先于主句动作发生；汉语按自然时序译为“叫来……，交给……”，无需另加“之后”。
- source_word: δούλους
  choice: 奴仆
  rationale: 该词可指仆人或奴隶；本段是主人与其所属之人的关系。“奴仆”既保留受主人支配的社会身份，也比单用“奴隶”更符合现代汉语叙事语体。
- source_word: ἑαυτοῦ
  choice: 自己的
  rationale: 保留反身代词所强调的所属关系。
- source_word: μνᾶς
  choice: 弥拿
  rationale: 采用古代货币单位的音译，避免误导性地换算成现代货币，并以脚注说明。
- source_word: Πραγματεύσασθε
  choice: 去做生意
  rationale: 该命令要求他们运用所交付的钱从事商业活动；“做生意”自然通俗，同时不限定具体是贸易还是投资。
- source_word: ἐν ᾧ ἔρχομαι
  choice: 直到我回来
  rationale: 这是表达时限的习语；语境是贵族离开后再返回，因此“回来”比机械地译作“来”更自然，也没有改变其时间指向。
theological_decisions:
- issue: 比喻中 δοῦλος 所表达的主人—奴仆关系
  choice: 奴仆
  alternative: 奴隶；仆人
  rationale: “奴隶”较直接凸显法律与社会上的隶属关系，“仆人”则可能弱化这一点；“奴仆”在现代汉语圣经叙事中自然庄重，并能保留一定词义张力。脚注列出替代译法，避免把该词的语义范围默默限定下来。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“叫来……交给……”顺应汉语时序；“做生意”贴近日常表达，又不把商业活动过度具体化。所有脚注标记均置于相应词语之后。
