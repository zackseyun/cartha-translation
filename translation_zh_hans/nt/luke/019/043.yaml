id: LUK.19.43
reference: Luke 19:43
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὅτι ἥξουσιν ἡμέραι ἐπὶ σὲ καὶ ⸀παρεμβαλοῦσιν οἱ ἐχθροί σου χάρακά σοι καὶ περικυκλώσουσίν σε καὶ συνέξουσίν σε πάντοθεν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/043.yaml
  text: For days will come upon you when your enemies will build an embankment against you and surround you and hem you in on every side,[a]
translation:
  language: zh_hans
  text: 因为日子将要临到你，那时你的仇敌要筑起围城土垒来攻击你，包围你，从四面困住你。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “围城土垒”或译“围城工事”。
    reason: χάραξ在此指围城时设置的工事；“土垒”体现常见含义，“围城工事”保留其具体形制上的词义宽度。
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 承接上文耶稣的哀叹与预告，保留原文的因由关系。
- source_word: ἥξουσιν ἡμέραι ἐπὶ σὲ
  choice: 日子将要临到你
  rationale: 保留先知性表达的庄重感，也传达这些事件即将临到耶路撒冷。
- source_word: παρεμβαλοῦσιν
  choice: 要筑起
  rationale: 与 χάρακα 连用时指建造围城工事；“筑起”自然且符合军事语境。
- source_word: οἱ ἐχθροί σου
  choice: 你的仇敌
  rationale: 直接呈现所有格与敌对关系；“仇敌”符合经文庄重语体。
- source_word: χάρακά σοι
  choice: 壁垒攻击你
  rationale: χάραξ 在此指围城所用的防栅、土垒或壁垒；以“壁垒”保持一定词义宽度，并用“攻击你”表达不利与敌对的与格关系。
- source_word: περικυκλώσουσίν σε
  choice: 包围你
  rationale: 清楚直译围城军队环绕城池的动作。
- source_word: συνέξουσίν σε πάντοθεν
  choice: 从四面困住你
  rationale: 传达 συνέχω 的挤压、限制之意，并保留 πάντοθεν 所强调的全面包围。
theological_decisions:
- issue: 第二人称单数所指对象
  choice: 全节保留单数“你”，将耶路撒冷作为被直接称呼并人格化的对象。
  alternative: 明确扩展为“你城中的居民”或用复数“你们”。
  rationale: 希腊文连续使用单数代词，紧接耶稣对耶路撒冷的哀叹；不扩展所指对象可保留原文的先知性与诗性张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“日子将要临到你”保留先知性语气；“壁垒”兼顾可读性与围城语境。主文中的脚注标记与脚注一致。
