  text: ⸀λέγων· Ὑπάγετε εἰς τὴν κατέναντι κώμην, ἐν ᾗ εἰσπορευόμενοι εὑρήσετε πῶλον δεδεμένον, ἐφ’ ὃν οὐδεὶς πώποτε ἀνθρώπων ἐκάθισεν, ⸀καὶ λύσαντες αὐτὸν ἀγάγετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/030.yaml
  text: saying, “Go into the village opposite you, in which, as you enter, you will find a colt tied up, on which no one among men has ever sat. Untie it and bring it.”
translation:
  language: zh_hans
  text: 说：“你们到对面的村庄去；进入村庄时，就会看见一头从来没有人骑过、拴着的小牲口。把它解开，牵来。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πῶλον
  choice: 驴驹
  rationale: πῶλος本身可泛指幼畜，但本段语境及平行记载明确所指为驴驹；现代汉语用“驴驹”自然清楚。
- source_word: κατέναντι
  choice: 对面的
  rationale: 保留空间方位含义，简洁对应“在对面”。
- source_word: οὐδεὶς πώποτε ἀνθρώπων ἐκάθισεν
  choice: 从来没有人骑过
  rationale: 按骑乘牲畜的汉语习惯，将字面“从来没有人坐过”自然表达为“从来没有人骑过”，不改变其未曾供人骑乘的强调。
- source_word: λύσαντες αὐτὸν ἀγάγετε
  choice: 把它解开，牵来
  rationale: “解开”对应解除拴系；“牵来”符合带来一匹驴驹的自然汉语表达。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语自然的叙事语言。“一进去”紧接前句，准确表达进入村庄时便会发现驴驹。
