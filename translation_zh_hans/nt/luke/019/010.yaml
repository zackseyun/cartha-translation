  text: ἦλθεν γὰρ ὁ υἱὸς τοῦ ἀνθρώπου ζητῆσαι καὶ σῶσαι τὸ ἀπολωλός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/010.yaml
  text: For the Son of Man came to seek and to save the lost[a].
translation:
  language: zh_hans
  text: 因为人子来，为要寻找并拯救失丧的[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“所失去的”。原文为中性单数，可作泛指；在上下文中包括失丧的人。
    reason: 保留τὸ ἀπολωλός的中性单数形式、其可作概括性理解的空间，以及其在本段对人的适用。
lexical_decisions:
- source_word: ἦλθεν
  choice: 来
  rationale: 不定过去时直陈语气在此概述人子的使命；汉语用“来”即可自然表达，不必额外标明完成体。
- source_word: γὰρ
  choice: 因为
  rationale: γάρ说明前一句“今天救恩到了这家”的缘由；“因为”清楚保留解释关系。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人子
  rationale: 保留耶稣惯用的自称及其可能具有的《但以理书》背景，不作解释性改写。
- source_word: ζητῆσαι
  choice: 寻找
  rationale: 与后面的不定式共同表达“来”的目的；“寻找”保留主动寻求的意味。
- source_word: σῶσαι
  choice: 拯救
  rationale: 结合19:9的“救恩”，此词不只指脱离现实危险；“拯救”保留其宽广的救恩含义。
- source_word: τὸ ἀπολωλός
  choice: 失丧的人
  rationale: 原文是带冠词的中性单数完成时分词，可作概括性表达，强调处于失丧状态者；中文以“失丧的人”自然表达其泛指范围，同时用脚注保留“失丧之物”的形式可能。
theological_decisions:
- issue: τὸ ἀπολωλός的指涉范围与语法含义
  choice: 失丧的人
  alternative: 失丧的；失丧之物
  rationale: 上下文直接涉及撒该，人作为指涉最自然；但原文采用中性单数形式，可作泛指，未明确限定为某一个男性个体。因此正文采用中文自然的人称表达，脚注注明更贴近语法形式的译法，以免抹去原文的概括性与歧义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“人子”沿用已确立的圣经称谓；“失丧”虽略具经文语体，但在此能简洁承载迷失及需要救恩的双重含义。
