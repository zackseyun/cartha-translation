id: LUK.19.9
reference: Luke 19:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς αὐτὸν ὁ Ἰησοῦς ὅτι Σήμερον σωτηρία τῷ οἴκῳ τούτῳ ἐγένετο, καθότι καὶ αὐτὸς υἱὸς Ἀβραάμ ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/009.yaml
  text: And Jesus said to him[a], “Today salvation has come to this house, because he too is a son of Abraham.”
translation:
  language: zh_hans
  text: 耶稣对他说：“今天，救恩临到了这一家[a]，因为他也是亚伯拉罕的子孙。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这所房子。”原文所用的词既可指房屋，也可指住在其中的一家人。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ πρὸς αὐτὸν ὁ Ἰησοῦς
  choice: 耶稣对他说
  rationale: δέ是轻微的叙事连接词，在中文中不必机械译出；按自然语序表达，并保留希腊文明确的代词“他”，不擅自补作撒该的名字。
- source_word: Σήμερον
  choice: 今天
  rationale: 现代汉语中最自然的对应词，并借句首位置保留原文的时间强调。
- source_word: σωτηρία
  choice: 救恩
  rationale: 在路加著作的语境中，该词具有超越一般解救的神学分量；“救恩”既准确又为普通中文读者熟悉。
- source_word: τῷ οἴκῳ τούτῳ
  choice: 这一家
  rationale: οἶκος既可指房屋，也可指家中成员；“这一家”在现代中文中自然地侧重家庭或全家，同时仍保留“家”的意象。另以脚注说明可能的空间含义。
- source_word: ἐγένετο
  choice: 临到了
  rationale: γίνομαι本义可为“发生、成为”；与“救恩”搭配时，“临到”自然表达救恩在今日成为现实，同时保留其到达意味。
- source_word: καθότι
  choice: 因为
  rationale: 清楚表达后句为耶稣宣告救恩临到的理由。
- source_word: καὶ αὐτὸς
  choice: 他也是
  rationale: 自然保留καί所表达的包括意味，即此人也在所说的身份范围之内。
- source_word: υἱὸς Ἀβραάμ
  choice: 亚伯拉罕的子孙
  rationale: 中文圣经语境中的“子孙”可表达男性后裔及其群体身份，比直译“儿子”更符合现代汉语，同时不把其含义限定为纯粹的血缘或信仰身份。
theological_decisions:
- issue: “亚伯拉罕的子孙”的含义
  choice: 保留为带有血缘与盟约身份共鸣的表达，不限定其只指其中一种
  alternative: 译为“亚伯拉罕的后裔”以突出血缘，或译为“亚伯拉罕信仰家族的一员”以突出信仰归属
  rationale: 本节本身没有明确排除血缘、盟约归属或二者兼有的理解；保持表达的张力，避免加入特定宗派解释。
- issue: 救恩临到的范围
  choice: 用“这一家”保留可能涉及撒该及其家庭的范围
  alternative: 仅理解为救恩临到撒该个人，或仅理解为进入他的房屋
  rationale: οἶκος本身可指房屋或家庭；经文没有在此处明确界定救恩所及的每一个对象，故不宜替原文作过窄断定。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“临到了”保留经文的宣告感；“这一家”比“这个家”更适合正式叙事，又便于普通读者理解。
