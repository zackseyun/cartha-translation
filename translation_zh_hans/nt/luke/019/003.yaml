  text: καὶ ἐζήτει ἰδεῖν τὸν Ἰησοῦν τίς ἐστιν, καὶ οὐκ ἠδύνατο ἀπὸ τοῦ ὄχλου ὅτι τῇ ἡλικίᾳ μικρὸς ἦν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/003.yaml
  text: And he was trying to see who Jesus was[a], but he could not because of the crowd, because he was small in stature.
translation:
  language: zh_hans
  text: 他一直想看看耶稣究竟是谁[a]，却因人群阻挡，无法看见，因为他身材矮小。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“想看看耶稣是怎样的人。”原文可指耶稣的身份，也可含有他是怎样的人之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτει
  choice: 想看看
  rationale: 未完成时表示持续的意愿和尝试；结合下文受人群阻挡的情境，“想看看”自然表达他当时一直设法观看。
- source_word: ἰδεῖν
  choice: 看看
  rationale: 不定式表示努力的目标；中文用“看看”自然流畅，也符合亲眼见到的语境。
- source_word: τίς ἐστιν
  choice: 耶稣究竟是谁
  rationale: 原文既可侧重身份，也可能含有想知道他是怎样的人之意；“究竟是谁”保留探究意味而不作过度解释。
- source_word: οὐκ ἠδύνατο
  choice: 他看不见
  rationale: 原文直译为“他不能”，但其省略的动作是“看”；中文补出“看不见”更自然，并准确表达实际阻碍。
- source_word: ἀπὸ τοῦ ὄχλου
  choice: 因为人多
  rationale: ἀπό在此表示造成阻碍的原因；“因为人多”比“因为人群”更符合现代汉语习惯，并清楚说明视线受阻。
- source_word: ὅτι
  choice: 因为
  rationale: 引出他无法看见的进一步原因，译作“因为”清楚保留因果关系。
- source_word: τῇ ἡλικίᾳ μικρὸς ἦν
  choice: 他身材矮小
  rationale: ἡλικία可指年龄或身量，但人群遮挡的语境明确指身高；“身材矮小”准确、自然且庄重。
theological_decisions: []
translation_notes:
  register: 采用现代、自然而庄重的叙事语言。“可是”清楚呈现转折；连续两个“因为”对应原文两层因果关系。正文保留“究竟是谁”的含义张力，并以脚注说明另一种可能理解。
