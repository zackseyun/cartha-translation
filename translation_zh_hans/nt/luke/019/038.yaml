  text: λέγοντες· Εὐλογημένος ὁ ἐρχόμενος ⸀βασιλεὺς ἐν ὀνόματι κυρίου· ⸂ἐν οὐρανῷ εἰρήνη⸃ καὶ δόξα ἐν ὑψίστοις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/038.yaml
  text: saying[b][a], “Blessed is the King who comes in the name of the Lord! Peace in heaven and glory in the highest!”
translation:
  language: zh_hans
  text: 说：“奉主名而来的王[a]，是应当称颂的！天上有平安；在至高之处有荣耀！”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些译本采用较为人熟知的措辞：“奉主名来的是应当称颂的”；但这里采用的希腊文正文明确有“王”字。
    reason: alternative_reading
  - marker: b
    text: 这句话呼应路加福音2:14，却改变了平安所在之处：那里是“地上有平安”，这里是“天上有平安”。
    reason: cross_reference
lexical_decisions:
- source_word: λέγοντες
  choice: 说
  rationale: 现在时主动分词承接上一节，简洁译为“说”，保留其引出群众欢呼内容的作用。
- source_word: Εὐλογημένος
  choice: 是应当称颂的
  rationale: 这里是祝颂式欢呼；“应当称颂”既符合诗篇背景，也避免把该词仅仅理解为一般意义上的幸运或得福。
- source_word: ὁ ἐρχόμενος βασιλεὺς
  choice: 而来的王
  rationale: 明确保留路加文本中的“王”，并以定语结构自然表达冠词加分词与名词的组合，不把王权含义淡化为泛指的“那一位”。
- source_word: ἐν ὀνόματι κυρίου
  choice: 奉主名
  rationale: “奉……名”是现代中文中简洁而庄重的圣经惯用语，可表达以主的名义、权柄和代表身份而来，同时保留原文的闪语色彩。
- source_word: ἐν οὐρανῷ εἰρήνη
  choice: 天上有和平
  rationale: 原文为无动词的欢呼句；补出中文所需的“有”，同时准确保留“天上”，不与路加福音2:14的“地上”措辞协调。
- source_word: δόξα ἐν ὑψίστοις
  choice: 至高之处有荣耀
  rationale: 将复数形式ὑψίστοις按表示最高天界的空间习语处理；译文保持凝练，并与前一分句形成平行。
theological_decisions:
- issue: 凯旋入城欢呼中的弥赛亚君王含义
  choice: 明确译出“王”
  alternative: “奉主名来的是应当称颂的”
  rationale: 所给SBLGNT正文明确含有βασιλεὺς。保留“王”可呈现路加的王权强调，而不额外解释这王权的具体教义内涵。
- issue: 与路加福音2:14的关系
  choice: 译作“天上有和平”
  alternative: “地上有和平”
  rationale: 原文明确是ἐν οὐρανῷ（在天上）。译文保留它与路加福音2:14之间既呼应又形成张力的措辞，不作熟悉化或协调。
- issue: “称颂”所指向的语义
  choice: 采用“应当称颂”作为祝颂欢呼
  alternative: “是蒙福的”
  rationale: εὐλογημένος既可涉及蒙福，也可在祝颂公式中表达受称颂。此处群众的欢呼语境及诗篇背景支持“应当称颂”，但不进一步说明称颂的施事者。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“奉主名”保留圣经语体但仍属当代读者熟悉的表达；两个无动词的希腊文欢呼分句均补出“有”，使中文自然，同时保持诗性平行。
