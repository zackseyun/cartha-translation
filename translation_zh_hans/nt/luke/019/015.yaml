id: LUK.19.15
reference: Luke 19:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ ἐπανελθεῖν αὐτὸν λαβόντα τὴν βασιλείαν καὶ εἶπεν φωνηθῆναι αὐτῷ τοὺς δούλους τούτους οἷς ⸀δεδώκει τὸ ἀργύριον, ἵνα ⸀γνοῖ τί ⸀διεπραγματεύσαντο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/015.yaml
  text: And it happened[a], when he returned after receiving the kingdom, that he ordered these slaves to whom he had given the money to be called to him[b], so that he might know what they had gained by trading.
translation:
  language: zh_hans
  text: 他得了王位回来后，就吩咐人把那些领过他钱的奴仆[a]叫来，好知道他们做生意赚了多少[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“仆人”或“奴隶”。希腊文指处在主人权下、为主人效力的人。
    reason: lexical_alternative
  - marker: b
    text: 也可译“他们做成了什么生意”或“他们经营得怎样”。希腊文动词既可指经商，也可着重指经营所得的成果。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ ἐπανελθεῖν αὐτὸν
  choice: 他……回来后
  rationale: ἐγένετο与ἐν加冠词不定式构成路加常用的叙事—时间表达；现代汉语无需机械译出“事情发生了”，用“回来后”自然呈现时间关系。
- source_word: λαβόντα τὴν βασιλείαν
  choice: 得了王位
  rationale: 分词表示先于吩咐召人的行动；本比喻语境中的βασιλεία侧重获授君王身份和统治权，“王位”比“国度”更符合这里的政治情境。
- source_word: φωνηθῆναι αὐτῷ
  choice: 吩咐人把……叫来
  rationale: 被动不定式表示命令这些人被召到他面前；汉语使役式表达清楚自然。
- source_word: δούλους
  choice: 奴仆
  rationale: 该词指处于主人权下、为主人效力的人；“奴仆”既保留其受支配身份，也比现代汉语中的“奴隶”更适合叙事文体。
- source_word: δεδώκει τὸ ἀργύριον
  choice: 领过他钱的
  rationale: 过去完成时所指的先行动作由“领过”体现；ἀργύριον在此泛指先前交付的银钱，并未重述具体币值。
- source_word: ἵνα γνοῖ
  choice: 好知道
  rationale: 简洁呈现目的从句，保留主人要查明结果的语气。
- source_word: τί διεπραγματεύσαντο
  choice: 他们做生意赚了多少
  rationale: 动词在此兼有经营交易及其所得结果之意；结合上下文，译文同时表达商业活动和收益，但以脚注保留较宽的可能含义。
theological_decisions:
- issue: δοῦλος在比喻中的社会身份
  choice: 奴仆
  alternative: 仆人；奴隶
  rationale: “仆人”可能淡化其受主人支配的身份，“奴隶”在现代汉语中又容易只令人联想到特定近现代制度；“奴仆”较平衡地保留原文的隶属关系，不额外引入神学解释。
- issue: βασιλεία在政治比喻中的含义
  choice: 王位
  alternative: 国度；王权
  rationale: 此处是贵族外出获得作王资格后返回，并非取得一片疆土；“王位”自然表达其获授君王身份，“王权”也是可能的语义。
- issue: τί διεπραγματεύσαντο是否明确限定为利润
  choice: 做生意赚了多少
  alternative: 做成了什么生意；经营得怎样
  rationale: 上下文的核算关注经营成果，因此正文可自然译出收益；脚注注明原动词也可较宽地指经商或经营的成果，避免把词义绝对限定为净利润。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“得了王位”贴合比喻中的政治场景；“奴仆”保留古代主从关系；句序依照自然汉语重组，并以脚注保存关键词的语义余地。
