base_translation:
  language: en
  yaml_path: translation/nt/luke/019/039.yaml
  text: And some of the Pharisees from the crowd said to him[a], “Teacher[b], rebuke your disciples.”
translation:
  language: zh_hans
  text: 又有些法利赛人在群众中，对他说：“老师，责备你的门徒。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τινες τῶν Φαρισαίων
  choice: 有几个法利赛人
  rationale: τινες与部分属格连用，表示法利赛人中的一部分；“有几个法利赛人”在现代汉语中自然，并保留未明确人数的部分指称。
- source_word: ἀπὸ τοῦ ὄχλου
  choice: 人群中
  rationale: ἀπό在这里表示这些法利赛人来自或身处人群；“人群中”简洁自然，且不暗示他们刚从人群里走出来。
- source_word: εἶπαν πρὸς αὐτόν
  choice: 对他说
  rationale: 这是叙事中常见的言说表达；“对他说”准确、自然。
- source_word: Διδάσκαλε
  choice: 老师
  rationale: διδάσκαλος在此是对耶稣的称呼，核心意义是教导者；“老师”是现代汉语中清楚自然的对应词，不额外加入更强的权威或基督论含义。
- source_word: ἐπιτίμησον
  choice: 责备
  rationale: 该不定过去时命令式要求作出直接斥责；“责备”保留命令的力度，又不把结果解释为“叫他们住口”。
- source_word: τοῖς μαθηταῖς σου
  choice: 你的门徒
  rationale: μαθητής在福音书语境中指跟随老师学习的人；“门徒”保留师徒关系及新约中的惯用表达。
theological_decisions:
- issue: 如何翻译对耶稣的称呼Διδάσκαλε
  choice: 老师
  alternative: 夫子／主人
  rationale: 这里的称呼直接强调教导者身份，并不必然表达更强的基督论认信；“老师”既忠于词义，也避免加入原文未明说的权威层次。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“人群中有几个法利赛人”避免生硬复制希腊语词序；直接引语用“吧”自然表达命令语气，同时保留责令耶稣采取行动的力度。
