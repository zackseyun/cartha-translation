  terminology: “奴仆”比单用“仆”更明确保留δοῦλος在此主奴比喻中的受支配身份，也比单用“奴隶”更符合现代中文圣经叙事的自然庄重语体。“苛刻”较贴近αὐστηρός在这里带有负面评价的“harsh”。
