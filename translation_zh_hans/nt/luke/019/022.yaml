  to: 他对他说：“我要凭你自己的话审判你，你这邪恶的奴仆！你知道我是个苛刻的人，拿走自己没有存放的东西，收割自己没有撒种的庄稼吗？”
  rationale: 删除无依据的文本异读脚注，并恢复原文问号。正文以“奴仆”明确δοῦλος的身份，以“苛刻”表达αὐστηρός的负面力度；在两个平行结构中补出汉语所需的“东西／庄稼”，保持原文“收割什么、撒种什么”的宾语关系，不改作“在哪里收割”。
