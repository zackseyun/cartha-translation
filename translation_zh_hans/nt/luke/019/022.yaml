source:
  edition: SBLGNT
  text: ⸀λέγει αὐτῷ· Ἐκ τοῦ στόματός σου κρίνω σε, πονηρὲ δοῦλε· ᾔδεις ὅτι ἐγὼ ἄνθρωπος αὐστηρός εἰμι, αἴρων ὃ οὐκ ἔθηκα καὶ θερίζων ὃ οὐκ ἔσπειρα;
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/022.yaml
  text: He said to him[a], ‘Out of your own mouth I will judge you, wicked slave. You knew that I am a harsh man[d][c][b], taking up what I did not lay down and reaping what I did not sow?’
translation:
  language: zh_hans
  text: 他对他说：“我要凭你自己的话审判你，你这邪恶的奴仆！你知道我是个苛刻的人，拿走自己没有存放的东西，收割自己没有撒种的庄稼吗？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐκ τοῦ στόματός σου
  choice: 凭你自己的话
  rationale: 按字面是“从你口中”，这里是惯用表达，指以仆人自己说的话为审判依据；译作“凭你自己的话”在现代汉语中自然清楚。
- source_word: κρίνω
  choice: 我要……审判
  rationale: 保留将来时意义，并维持“审判”的宽泛含义，不提前收窄为“定罪”。
- source_word: πονηρὲ δοῦλε
  choice: 你这恶仆
  rationale: “恶”传达直接称呼中的道德责备；“仆”在中文主仆语境中自然，也保留其受主人支配的身份，避免“奴隶”在现代中文里可能带来的非必要制度联想。
- source_word: αὐστηρός
  choice: 严厉
  rationale: 表达苛严、要求严峻的负面意味，比“严格”更有力度，也比“严酷”少作解释。
- source_word: αἴρων ὃ οὐκ ἔθηκα
  choice: 拿走我没有存放的
  rationale: αἴρω译为“拿走”，ἔθηκα在本段金钱语境中可指放置或存放；“存放”既符合语境，又不把它过度技术化为正式存款。
- source_word: θερίζων ὃ οὐκ ἔσπειρα
  choice: 收割我没有撒种的
  rationale: 保留农业比喻和两个宾语关系；希腊文是“收割……的东西”，不是“在……之处收割”。
theological_decisions:
- issue: 主人所说“我是个严厉的人”是否是在承认事实
  choice: 保留“你既知道我是个严厉的人”的直接反问形式
  alternative: 你既说我是个严厉的人／既然你认为我是个严厉的人
  rationale: 原文直接使用“你知道……”，在上下文中可能是主人借仆人自己的说法反诘。正文不增加“你说”或“你认为”，以免替读者消解这一修辞和神学张力。
- issue: δοῦλος在比喻中的身份用语
  choice: 仆
  alternative: 奴隶
  rationale: 原文确指受主人支配的人；现代中文圣经叙事中“仆”能够自然表达主仆关系。若直译“奴隶”，容易使制度身份压过本节审判言辞的焦点。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。“你这恶仆”保留直接斥责的力度；结尾逗号和脚注反映本句在语法与论述上延续至下一节。
