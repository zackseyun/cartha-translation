  text: καὶ ἰδοὺ ἀνὴρ ὀνόματι ⸀καλούμενος Ζακχαῖος, καὶ αὐτὸς ἦν ἀρχιτελώνης καὶ ⸀αὐτὸς πλούσιος·
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/002.yaml
  text: And behold[a], a man named Zacchaeus; he was a chief tax collector and was rich.
translation:
  language: zh_hans
  text: 看哪，有一个人名叫撒该；他是税吏长，也是个财主。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留路加用来引导读者注意、增强叙事现场感的话语标记；“看哪”庄重而为现代中文读者所理解。
- source_word: ἀνὴρ
  choice: 一个人
  rationale: 上下文和人名已清楚表明所指为男性；中文叙事中“一个人”比“一个男人”更自然，同时未改变具体所指。
- source_word: ὀνόματι καλούμενος
  choice: 名叫
  rationale: 该希腊语表达意为“名叫／被称为”；“名叫”准确、简洁，也符合现代汉语习惯。
- source_word: Ζακχαῖος
  choice: 撒该
  rationale: 采用中文圣经传统中通行且易识别的人名译法。
- source_word: αὐτὸς ἦν
  choice: 他是
  rationale: αὐτός在这里承接并略微强调主语；“他是”自然地恢复主语，避免用“他本人”造成过强强调。
- source_word: ἀρχιτελώνης
  choice: 税吏长
  rationale: 保留ἀρχι-所表达的首领或主管层级；“税吏长”简洁明确，并与当时税吏身份相符。
- source_word: αὐτὸς πλούσιος
  choice: 也是个财主
  rationale: πλούσιος表示富有；“财主”自然表达其富有身份，“也”传达重复αὐτός及并列结构所带的轻微强调。
