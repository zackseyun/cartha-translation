base_translation:
  language: en
  yaml_path: translation/nt/luke/019/021.yaml
  text: 'for I was afraid of you[a], because you are a severe man: you take what you did not put down[b], and you reap what you did not sow.'
translation:
  language: zh_hans
  text: 我曾害怕你，因为你是个严厉的人[a]：你取走自己没有放下的[b]，也收割自己没有撒种的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “严厉”也可译作“严格”或“苛刻”。
    reason: lexical_alternative
  - marker: b
    text: 直译为“你取走你没有放下的”。有些译本按钱财语境作较解释性的翻译，如“你收取自己没有存入的”或“你拿走自己没有投入的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφοβούμην
  choice: 我怕
  rationale: 未完成时表达过去持续的惧怕状态；现代汉语用“我怕”自然简洁，语境已表明是过去的状态。
- source_word: γάρ
  choice: 因为
  rationale: 说明上一节所述行为的缘由；“因为”在现代汉语中清楚标明解释关系。
- source_word: αὐστηρὸς
  choice: 严厉
  rationale: 保留此词所含的严格、苛刻意味，同时不替叙事判断仆人的指控是否属实。
- source_word: αἴρεις
  choice: 取走
  rationale: 表达拿取、取走之意，并能与钱财语境自然衔接。
- source_word: ὃ οὐκ ἔθηκας
  choice: 没有存下的
  rationale: τίθημι本义为放置；此处联系交银与获利的语境，“存下”既自然，也不把动作过度限定为正式存款。
- source_word: θερίζεις
  choice: 收割
  rationale: 保留农业意象，并与后面的“撒种”形成传统而清楚的对应。
- source_word: ὃ οὐκ ἔσπειρας
  choice: 没有撒种的
  rationale: 直译σπείρω，保留撒种与收割之间的农业比喻和平行结构。
- source_word: ἄνθρωπος
  choice: 人
  rationale: 指比喻中的具体男性人物；汉语“人”在“你是个……的人”结构中自然，并不造成性别误解。
theological_decisions:
- issue: 是否为了维护比喻中主人形象而弱化仆人的描述
  choice: 保留仆人带有指控意味的“严厉”及后续说法
  alternative: 改用较温和的“严格”或“要求高”，以削弱负面意味
  rationale: 本节呈现的是仆人自己的辩解和指控。译文应保留其修辞力度，不越过叙事本身判定这项描述是否客观真实。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。用分号和两个平行分句保留希腊文的因果推进与修辞对称；脚注说明直译及语境化译法，正文则优先保证汉语自然度。
