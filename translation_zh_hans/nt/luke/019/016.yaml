  text: παρεγένετο δὲ ὁ πρῶτος λέγων· Κύριε, ἡ μνᾶ σου ⸂δέκα προσηργάσατο⸃ μνᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/016.yaml
  text: Then the first came, saying, ‘Lord, your mina has earned ten minas.’
translation:
  language: zh_hans
  text: 第一个人上前来，说：“主啊[a]，你的一弥拿[b]已经赚了十弥拿。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“主人啊”。希腊语κύριε既可作“主”，也可用于尊称上位者或主人。
    reason: 保留称呼在本比喻语境中的语义幅度。
  - marker: b
    text: “弥拿”是古代的货币与重量单位。
    reason: 帮助现代读者理解音译的历史货币名称。
lexical_decisions:
- source_word: παρεγένετο
  choice: 上前来
  rationale: 该动词表示来到或到场；这里是仆人依次到主人面前交账，“上前来”自然表达其趋近并呈报的叙事情境。
- source_word: ὁ πρῶτος
  choice: 第一个人
  rationale: 指按次序首先前来的人；补出“人”符合现代汉语表达，又不额外限定其身份。
- source_word: Κύριε
  choice: 主啊
  rationale: κύριε是对上位者的尊称，也可具有“主人”的含义。“主啊”保留原词较宽的语义范围，并以脚注说明本比喻语境中的另一种自然译法。
- source_word: ἡ μνᾶ σου
  choice: 你的一弥拿
  rationale: μνᾶ是古代货币与重量单位。采用音译“弥拿”保留历史特指，所有格“你的”明确本金属于受称呼者。
- source_word: δέκα προσηργάσατο μνᾶς
  choice: 已经赚了十弥拿
  rationale: προσεργάζομαι表示通过经营另外赚得或取得收益。“已经赚了十弥拿”清楚表达截至交账时已经产生的十弥拿收益；不把原有的一弥拿计入这十弥拿。
theological_decisions:
- issue: 比喻中κύριε的称呼性质
  choice: 主啊
  alternative: 主人啊
  rationale: 说话者在比喻中是在尊称一位有权柄的主人，并非由这一称呼本身直接作基督论宣认。正文保留“主”的词汇对应，脚注注明语境上可译“主人”，避免消除其真实语义幅度。
- issue: 十弥拿是否包括本金
  choice: 理解为另外赚得十弥拿
  alternative: 理解为本金增值后共有十弥拿
  rationale: προσεργάζομαι带有“额外赚得”的构词和语境含义，因此十弥拿是由原来一弥拿经营所得的增加额；译文以“赚了”表达收益，但不擅自在正文添加“另外”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“上前来”契合仆人到主人面前交账的场景；保留古代单位“弥拿”，并用脚注简要解释。
