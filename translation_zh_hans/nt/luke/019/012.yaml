  text: εἶπεν οὖν· Ἄνθρωπός τις εὐγενὴς ἐπορεύθη εἰς χώραν μακρὰν λαβεῖν ἑαυτῷ βασιλείαν καὶ ὑποστρέψαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/012.yaml
  text: So he said[a], “A certain nobleman went to a distant country to receive a kingdom for himself and return.”
translation:
  language: zh_hans
  text: 于是他说：“有一个贵族到远方去，要为自己取得王权[a]，并回来。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“王国”或“王位”。希腊语 βασιλείαν 可指王国、王权，或君王的地位。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: 于是
  rationale: 承接前文并推进叙事；“于是”在现代汉语中自然，也保留了推论兼顺承的作用。
- source_word: Ἄνθρωπός τις
  choice: 有一个
  rationale: 用于引入比喻中尚未特指的人物；与后面的“贵族”结合，比逐字译成“某一个人”更自然。
- source_word: εὐγενὴς
  choice: 贵族
  rationale: 指具有高贵出身或社会地位的人；“贵族”简洁自然，也符合随后取得王位的政治语境。
- source_word: ἐπορεύθη
  choice: 去
  rationale: 该动词在此表达一般的前往；“去”清楚、自然。
- source_word: εἰς χώραν μακρὰν
  choice: 到远方
  rationale: χώρα可指地区、地方或国土；原文没有不定冠词，译作“到远方”既自然，也避免把地点过度限定为另一个国家。
- source_word: λαβεῖν
  choice: 取得
  rationale: 在此政治语境中，表示获得或领受统治地位；“取得”比“拿取”自然，又不预设具体授予方式。
- source_word: ἑαυτῷ
  choice: 为自己
  rationale: 保留反身与受益含义，表明他所取得的王位归于自己。
- source_word: βασιλείαν
  choice: 王位
  rationale: 该词可指王国、王权或君王身份；在贵族远行取得统治资格的语境中，“王位”能自然表达获得君王地位，同时以脚注保留其他可能。
- source_word: ὑποστρέψαι
  choice: 然后回来
  rationale: 与“取得”并列，且语义上指取得王位之后返回；汉语加入“然后”可自然显明原文两个目的动作所蕴含的先后关系。
theological_decisions:
- issue: βασιλείαν在带有政治意象的比喻中是指疆域、君王身份还是统治权
  choice: 王位
  alternative: 王国；王权
  rationale: 上下文描绘贵族远行以获得被承认的君王地位，再返回施行统治。“王位”最符合现代汉语表达，但原词也可能侧重王国本身或王权，因此用脚注保留其语义张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。用“贵族”保留其高贵出身与政治地位；用“到远方”避免无依据地把 χώρα 明确限定为“国家”。
