  source_fidelity: 草稿基本准确传达了耶稣临近伯法其和伯大尼、与橄榄山相关并差遣两位门徒的叙事。可是“称为‘橄榄’的山”在汉语中把已固定的专名过度逐字化，且“朝向那座……山时”与“快到……时”并列后句法关系略显不清。
  naturalness: “耶稣将近……，朝着……而去时”较合现代汉语叙事习惯；“橄榄山”为通行、自然的地名译法。“差遣”适合本段庄重叙事语体。
  terminology: 保留“伯法其”“伯大尼”“橄榄山”“门徒”等通行圣经术语。将希腊文压缩的“称为橄榄”按汉语专名习惯译为“名叫橄榄山”，不改变所指；无需以正文的生硬表达维持希腊语属格形式。
  issues:
