    issue: “称为‘橄榄’的山”不符合汉语地名表达。
    rationale: Ἐλαιῶν在此是该山的既定称呼。中文应使用通行专名“橄榄山”；将其译成引号中的普通词“橄榄”会造成不必要的陌生感，且容易误解为山的描述而非名称。
  - severity: low
    issue: 时间与方向短语的衔接略显拗口。
    rationale: “快到伯法其和伯大尼、朝向那座……山时”使两个状语的修饰关系不够清晰。改为“将近……，朝着……而去时”可保留πρός的方向意味并改善句法。
