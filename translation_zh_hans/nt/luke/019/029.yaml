  rationale: 以“名叫橄榄山”按现代标准汉语处理该处固定地名，同时保留“那座……山”以反映τὸ ὄρος。以“朝着……而去”表达πρός的方向关系；明确“耶稣”作为语境中清楚的隐含主语。原文没有要求保留脚注，修订后亦无须脚注锚点。
