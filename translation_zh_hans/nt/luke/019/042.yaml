source:
  edition: SBLGNT
  text: λέγων ὅτι Εἰ ἔγνως ⸂ἐν τῇ ἡμέρᾳ ταύτῃ καὶ σὺ⸃ τὰ πρὸς ⸀εἰρήνην— νῦν δὲ ἐκρύβη ἀπὸ ὀφθαλμῶν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/042.yaml
  text: saying[a], “If you had known on this day, even you[c][b], the things that make for peace—but now they have been hidden from your eyes.”
translation:
  language: zh_hans
  text: 说：“如果你在这一天，连你也知道那些关乎和平的事，那该多好！[a][b]但现在，这些事已经从你眼前隐藏起来了。[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“但愿你在这一天，连你也知道那些关乎和平的事。”
    reason: 保留 Εἰ ἔγνως 在哀叹语境中可按未实现的愿望表达的译法。
  - marker: b
    text: “关乎和平的事”，希腊文直译为“朝向和平的事”，指与和平有关或能带来和平的事。
    reason: 说明 τὰ πρὸς εἰρήνην 的字面结构及语义范围。
  - marker: c
    text: 希腊文“隐藏”是单数形式，也可按整体概念译作：“但现在，这已经从你眼前隐藏起来了。”
    reason: 保留 ἐκρύβη 的语法单数与前面中性复数短语之间的真实张力。
lexical_decisions:
- source_word: λέγων
  choice: 说
  rationale: 现在分词承接上一节的叙事动作；汉语用“说”自然地引出直接引语，无须生硬保留分词形式。
- source_word: Εἰ ἔγνως
  choice: 如果你……知道……就好了
  rationale: 在哀叹语境中，这一未完成条件表达未能实现的愿望。现代汉语以“如果……就好了”既保留条件形式，也自然传达哀叹；所增“好了”属于语法语用所需，并非另加“只/惟愿”的词义。
- source_word: ἐν τῇ ἡμέρᾳ ταύτῃ
  choice: 在这一天
  rationale: 直接而自然地表达指定的时日，不额外强化为“就在今天”。
- source_word: καὶ σὺ
  choice: 你……也
  rationale: 保留 καί 与独立代词 σύ 所带的强调；在现代汉语中“你也”比“连你”更稳妥，避免加入过强的惊讶意味。
- source_word: τὰ πρὸς εἰρήνην
  choice: 那通向和平的事
  rationale: πρός 表达朝向、有关或有助于和平；“通向和平”清楚呈现这些事所导致的结果，而“事”保留中性复数实体化表达。
- source_word: εἰρήνην
  choice: 和平
  rationale: “和平”是 εἰρήνη 的常规译法，并能容纳安宁、福祉以及免遭审判等语境内涵，而不在正文中限定其神学范围。
- source_word: νῦν δὲ
  choice: 但现在
  rationale: 清楚保留条件哀叹与当前隐藏状态之间的鲜明转折。
- source_word: ἐκρύβη
  choice: 这些事已经……隐藏起来了
  rationale: 希腊语动词为单数，但可概括承接前面的中性复数短语；汉语明说“这些事”使指代清楚，“已经……了”表达过去动作造成的当前结果。
- source_word: ἀπὸ ὀφθαλμῶν σου
  choice: 从你眼前
  rationale: 保留视觉与认知的圣经意象，同时符合现代汉语习惯。
theological_decisions:
- issue: ἐκρύβη 的隐含主语
  choice: 以“这些事”明确回指“那通向和平的事”。
  alternative: 采用非人称或概念单数：“这已经向你的眼睛隐藏了。”
  rationale: 虽然 ἐκρύβη 是单数，希腊语常以单数动词搭配或概括中性复数所指。明确回指前语最符合上下文，也不指定隐藏行为的施事者。
- issue: 条件句的哀叹力度
  choice: 译作“如果你……知道……就好了”。
  alternative: 较形式地译作“如果你……知道”，或加强为“惟愿你知道”。
  rationale: 原句在此处是不完整的条件哀叹，主句被情感打断。汉语需要“就好了”才能自然表达这种未实现的愿望，同时不把原文未明说的结果补入正文。
- issue: 和平的范围
  choice: 保留宽泛的“和平”。
  alternative: 具体化为“得救”“与上帝和好”或“免遭毁灭”。
  rationale: 语境容许多层意义，但原文只说 εἰρήνη；不应在翻译中将其收窄为某一教义解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“就好了”传达哀叹而不显古奥；“通向和平的事”兼顾原文结构与普通读者的可理解性。正文保留破折式情感转折，以感叹号和“但现在”呈现。
