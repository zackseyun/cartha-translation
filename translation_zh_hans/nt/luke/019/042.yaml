  rationale: 修订仅提升现代汉语的自然度并更完整保留原文语义范围：“连你也”对应 καὶ σὺ 的强调；“关乎和平的事”避免将 πρὸς εἰρήνην 限定为仅指“通向”某一结果。保留“那该多好！”以自然表达原文哀叹式、未完成的条件结构；保留被动“隐藏起来了”，不补出隐藏者。
