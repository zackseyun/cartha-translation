  yaml_path: translation/nt/luke/019/032.yaml
  text: So those who were sent went away and found it just as he had told them[a].
translation:
  language: zh_hans
  text: 那两个被差去的人去了，所遇见的正如耶稣对他们所说的[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“那两个被差去的人去了，发现正如耶稣对他们所说的。”原文“发现”的宾语没有明说；可按上下文理解为耶稣所描述的那匹驴驹。
    reason: 原文εὗρον没有明说宾语；正文以“所遇见的”自然保留这一省略，脚注说明可行的直译方式及上下文所指。
lexical_decisions:
- source_word: ἀπελθόντες
  choice: 就去了
  rationale: 该词是ἀπέρχομαι的不定过去时分词，表示离开并前往；结合δέ译为“就去了”，自然表达他们按先前指示采取行动。
- source_word: δὲ
  choice: 就
  rationale: δέ在这里推进叙事，也承接前文的吩咐；“就”符合现代汉语叙事习惯，不过度强化因果。
- source_word: οἱ ἀπεσταλμένοι
  choice: 被差去的两个人
  rationale: 带冠词的完成时被动分词作名词用，直译为“被差去的人”；根据上文19:29明确是两个门徒，补出“两个人”可使汉语自然，同时保留被动含义。
- source_word: εὗρον
  choice: 所见的
  rationale: εὗρον本义为“找到了/发现了”，原文未明说宾语。译作“所见的”在汉语中保持宾语由语境补足的开放性，并能自然衔接“正如……所说的”。
- source_word: καθὼς
  choice: 正如
  rationale: καθώς表示实际情形与先前所说相符；“正如”准确而自然，不额外加入“完全”等强化语。
- source_word: εἶπεν αὐτοῖς
  choice: 耶稣对他们所说的
  rationale: 原文主语仅为“他”，但汉语跨句衔接时补明“耶稣”可避免指代含混；“对他们所说的”保留λέγω的基本表达，并体现所说之事先于他们的发现。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“被差去”保留原文被动含义；补出“两个人”和“耶稣”均由近距离上下文明确支持。脚注标记已置于正文。
