id: LUK.19.28
reference: Luke 19:28
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ εἰπὼν ταῦτα ἐπορεύετο ἔμπροσθεν ἀναβαίνων εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/028.yaml
  text: And after saying these things, he went on ahead, going up to Jerusalem.
translation:
  language: zh_hans
  text: 耶稣说完这些话，就走在前面，上耶路撒冷去。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: 就
  rationale: 承接前文并推进叙事；现代汉语用“就”自然表达事件的先后衔接，不额外增添转折意味。
- source_word: εἰπὼν ταῦτα
  choice: 说完这些话
  rationale: 不定过去时分词表示先于主要动词发生的动作；“说完这些话”自然指回前面的言论，并保留复数所涵盖的整体内容。
- source_word: ἐπορεύετο
  choice: 走
  rationale: 未完成时描写持续前行；在“走在前面”的汉语结构中，行进过程已自然呈现，无须生硬译作“正在行走”。
- source_word: ἔμπροσθεν
  choice: 在前面
  rationale: 保留“在前、领先”的空间含义；上下文虽暗示他走在同行者前面，但原文未明说宾语，译文也不补出“他们”。
- source_word: ἀναβαίνων
  choice: 上……去
  rationale: 现在分词表示与主要动作同时进行的上行；“上耶路撒冷去”是自然汉语，也保留前往高处的原文意象。
- source_word: εἰς Ἱεροσόλυμα
  choice: 耶路撒冷
  rationale: εἰς在此表示目的地；与“上……去”组合，准确表达朝耶路撒冷前行，而不预设已经进入城内。
theological_decisions:
- issue: 是否保留前往耶路撒冷的“上行”措辞
  choice: 译作“上耶路撒冷去”
  alternative: 前往耶路撒冷／往耶路撒冷去
  rationale: “上”既符合耶路撒冷的地理位置，也保存路加叙事中的上行措辞及其可能承载的神学张力，而不在译文中加以解释。
- issue: 是否明确补出走在谁的前面
  choice: 只译“走在前面”
  alternative: 走在门徒前面／走在众人前面
  rationale: 原文ἔμπροσθεν未明说参照对象。上下文可使读者理解为同行者，但不宜在正文中把隐含对象限定为“门徒”或“众人”。
translation_notes:
  register: 采用现代、简洁而庄重的叙事语体。“耶稣”作为本节主语由上下文确定，汉语中明示主语可避免孤立经节出现指代不清；句式保留“说完—走在前面—上耶路撒冷”的动作次序。
