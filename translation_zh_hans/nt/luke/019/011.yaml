id: LUK.19.11
reference: Luke 19:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ἀκουόντων δὲ αὐτῶν ταῦτα προσθεὶς εἶπεν παραβολὴν διὰ τὸ ἐγγὺς ⸂εἶναι Ἰερουσαλὴμ αὐτὸν⸃ καὶ δοκεῖν αὐτοὺς ὅτι παραχρῆμα μέλλει ἡ βασιλεία τοῦ θεοῦ ἀναφαίνεσθαι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/011.yaml
  text: As they were hearing these things[a], he went on and told a parable, because he was near Jerusalem and because they supposed that the kingdom of God was about to appear immediately.
translation:
  language: zh_hans
  text: 众人正听着这些话，耶稣又讲了一个比喻，因为他已临近耶路撒冷，而众人以为上帝的国就要立刻显现[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “显现”也可译作“显露出来”；原词可指变得可见或明显。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκουόντων δὲ αὐτῶν ταῦτα
  choice: 众人正听着这些话
  rationale: 属格独立结构配合现在分词，表示与主句同时进行的动作；“正听着”保留持续意味，也符合现代汉语表达。
- source_word: προσθεὶς εἶπεν παραβολὴν
  choice: 耶稣又讲了一个比喻
  rationale: προσθεὶς εἶπεν 是表示继续或追加言说的惯用结构；“又讲了”自然传达承接前文继续说话之意。汉语补出“耶稣”以明确主语。
- source_word: διὰ τὸ ἐγγὺς εἶναι Ἰερουσαλὴμ αὐτὸν
  choice: 因为他已临近耶路撒冷
  rationale: διά 加冠词化不定式表示原因，αὐτόν 是该不定式结构的主语，所指为耶稣；“临近”简洁而庄重，“已”体现当时所处位置。
- source_word: δοκεῖν αὐτοὺς
  choice: 众人以为
  rationale: 表达他们所持的判断或预期，但不暗示该预期正确；“以为”比“认为”更能自然体现叙事中的误判可能。
- source_word: παραχρῆμα
  choice: 立刻
  rationale: 准确传达时间上的即时性，现代汉语简明自然。
- source_word: μέλλει ... ἀναφαίνεσθαι
  choice: 就要……显现
  rationale: “就要”表达 μέλλω 所含的迫近预期；“显现”保留 ἀναφαίνεσθαι 的可见、彰显或呈现之义，而不预先限定显现的方式。
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: 上帝的国
  rationale: 采用现代标准汉语中清楚、庄重且通行的对应语，并保持路加叙事中的神学连续性。
theological_decisions:
- issue: 众人所期待之上帝国度显现的性质
  choice: 译作“上帝的国就要立刻显现”，不说明其显现是政治性的、末世性的还是属灵性的。
  alternative: 将其具体化为“上帝的国就要立刻在地上建立”或“上帝的国就要立刻完全启示出来”。
  rationale: 原文只陈述众人期待国度即刻显现，并未界定其具体形态；译文保留这一神学张力，避免加入经文未明说的解释。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准普通话。“众人正听着”保留原文同时进行的叙事关系；“又讲了一个比喻”避免生硬直译“加上说”；脚注说明“显现”的词义范围而不改变正文的开放性。
