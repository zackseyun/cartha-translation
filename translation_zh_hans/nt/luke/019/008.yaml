source:
  edition: SBLGNT
  text: σταθεὶς δὲ Ζακχαῖος εἶπεν πρὸς τὸν κύριον· Ἰδοὺ τὰ ⸀ἡμίσιά ⸂μου τῶν ὑπαρχόντων⸃, κύριε, ⸂τοῖς πτωχοῖς δίδωμι⸃, καὶ εἴ τινός τι ἐσυκοφάντησα ἀποδίδωμι τετραπλοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/008.yaml
  text: But Zacchaeus stood and said to the Lord[a], “Look, Lord, I give half of my possessions to the poor, and if I have extorted anything from anyone[b], I repay it fourfold.”
translation:
  language: zh_hans
  text: 撒该站着，对主说：“主啊，请看，我把自己财产的一半给穷人；如果我曾从谁那里敲诈过什么[a]，就按四倍偿还[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“如果我曾骗取谁的什么。”这个希腊动词可指敲诈、盘剥或欺诈，有时涉及诬告。
    reason: lexical_alternative
  - marker: b
    text: 希腊文的“给”和“偿还”都是现在时，也可理解为表达当下决意：“我要给……我要偿还。”
    reason: alternative_reading
lexical_decisions:
- source_word: σταθεὶς
  choice: 站起来
  rationale: 该词是ἵστημι的不定过去时被动分词，在此作不及物用；“站起来”自然地交代撒该开始郑重发言时的动作，但不过度推断此前姿势。
- source_word: κύριον / κύριε
  choice: 主 / 主啊
  rationale: 保留κύριος既可作为尊称、在路加叙事中又可能具有更深身份含义的张力，不弱化为单纯的“先生”。
- source_word: Ἰδοὺ
  choice: 请看
  rationale: 这是引人注意并加强语气的表达；“请看”符合现代汉语口吻，也保持发言的郑重感。
- source_word: τὰ ἡμίσιά μου τῶν ὑπαρχόντων
  choice: 自己财产的一半
  rationale: ὑπάρχοντα在此指所有物或财产；这一译法准确表达部分属格的关系，并符合现代汉语习惯。
- source_word: τοῖς πτωχοῖς
  choice: 给穷人
  rationale: πτωχός在此名词化使用，指经济贫困的人；“穷人”直接、自然，也不将含义泛化为各种需要帮助的人。
- source_word: δίδωμι
  choice: 我把……给……
  rationale: 按希腊文现在时直译为汉语未标明时间的陈述式，既可描述现行做法，也可在语境中表达当下决意；脚注说明这种开放性。
- source_word: εἴ τινός τι
  choice: 我若……过谁什么
  rationale: 保留“若从任何人取得任何东西”的双重不定意味；在汉语中调整为自然的宾语次序。
- source_word: ἐσυκοφάντησα
  choice: 敲诈过
  rationale: συκοφαντέω可指借权势或诬告进行敲诈、盘剥或欺诈；结合撒该的税吏长身份，“敲诈”简洁贴切，同时脚注保留“骗取”等可能。
- source_word: ἀποδίδωμι
  choice: 偿还
  rationale: 该词表示归还或赔还；“偿还”符合此处补偿性归还的语境。
- source_word: τετραπλοῦν
  choice: 四倍
  rationale: 准确表达按四倍数额赔还，现代汉语简明自然。
theological_decisions:
- issue: δίδωμι和ἀποδίδωμι两个现在时动词的语力
  choice: 正文采用不明确标示时间的“我把……给……；……就偿还”，并以脚注说明
  alternative: 明确译作将来决意“我要给……我要偿还”，或译作惯常行为“我一向给……一向偿还”
  rationale: 希腊文使用现在时直陈语气，可能描述现行惯例，也可能表达即时而坚定的决意。中文正文不添加“要”或“一向”，可避免预先裁定撒该是在申明旧有义行，还是表达新近悔改。
- issue: κύριος用于称呼耶稣时的含义
  choice: 译作“主”
  alternative: 译作仅表礼貌或权威的“先生”或“主人”
  rationale: “主”既保留称谓的尊敬语气，也不抹去路加叙事中可能具有的基督论分量；正文不进一步界定撒该此刻认识的深度。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“撒该却站起来”承接上文并突出其回应；引语中的“主啊，请看”保留郑重和强调。正文有意不加入“一向”或“将要”，以保存原文时态所留下的解释空间。
