  text: οἱ δὲ πολῖται αὐτοῦ ἐμίσουν αὐτόν, καὶ ἀπέστειλαν πρεσβείαν ὀπίσω αὐτοῦ λέγοντες· Οὐ θέλομεν τοῦτον βασιλεῦσαι ἐφ’ ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/014.yaml
  text: But his citizens hated him[a], and sent a delegation after him, saying, ‘We do not want this man to reign over us.’
translation:
  language: zh_hans
  text: 可是，他的国民恨他，派了一个代表团[a]跟在他后面去，说：“我们不要这个人作王统治我们。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使团”。希腊词指奉命执行正式使命的代表团体。
    reason: 词义存在自然的译法选择；注释说明该词的正式、代表性含义。
lexical_decisions:
- source_word: πολῖται
  choice: 本国人
  rationale: 该词指政治共同体中的成员。“本国人”保留公民共同体的含义，同时避免用“臣民”预先承认他们所拒绝的王权；也比现代制度色彩较强的“公民”更适合比喻语境。
- source_word: ἐμίσουν
  choice: 恨
  rationale: 未完成时态表明持续或一贯的敌意；汉语用“恨”自然简洁，不必生硬地显明持续体。
- source_word: ἀπέστειλαν
  choice: 派了
  rationale: 准确表达差派之意，也符合叙事中的简单过去动作。
- source_word: πρεσβείαν
  choice: 一个代表团
  rationale: 该词可指执行正式使命的使团或代表团；“代表团”是现代汉语中清楚自然的表达，并保留政治场景。
- source_word: ὀπίσω αὐτοῦ
  choice: 随后去
  rationale: 语境指那人离开后，代表团被派去追随其后；“随后去”比直译“在他后面”更符合现代汉语。
- source_word: λέγοντες
  choice: 说
  rationale: 直接引出代表团所传的信息，保持原文简明的叙事衔接。
- source_word: Οὐ θέλομεν
  choice: 我们不要
  rationale: θέλω表达意愿；“我们不要”自然、有力地传达拒绝。
- source_word: τοῦτον
  choice: 这个人
  rationale: 保留指示代词所带的疏离和轻蔑语气，同时不过度强化成贬称。
- source_word: βασιλεῦσαι ἐφ’ ἡμᾶς
  choice: 作王统治我们
  rationale: 既明确保留βασιλεύω的君王含义，也自然表达ἐφ’ ἡμᾶς所指的治理关系；单译“统治”会削弱王权意象。
theological_decisions:
- issue: 比喻中的政治与王权意象
  choice: 作王统治我们
  alternative: 统治我们；管理我们
  rationale: 原文明确使用作王的词汇。译文保留这一王权意象及遭拒绝的张力，不把它泛化为一般权力，也不在经文本身之外加入寓意解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“却”体现δέ的转折；引语用“这个人”保留原文的疏离语气。脚注标记置于其所解释的“代表团”之后。
