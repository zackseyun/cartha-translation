  text: καὶ ἀπελθὼν συνελάλησεν τοῖς ἀρχιερεῦσιν καὶ στρατηγοῖς τὸ πῶς ⸂αὐτοῖς παραδῷ αὐτόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/004.yaml
  text: And he went away and discussed with the chief priests and officers how he might hand him over to them[a][b].
translation:
  language: zh_hans
  text: 他离开后，同祭司长和圣殿守卫的官长商议，怎样把耶稣交给他们[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“怎样出卖耶稣”。这里的希腊语动词可指“交出、交付”，在本语境中也可指“出卖”。
    reason: lexical_alternative
  - marker: b
    text: 这里的“圣殿守卫的官长”很可能是负责圣殿守卫事务的官长，而不是罗马军官。
    reason: cultural_note
lexical_decisions:
- source_word: ἀπελθὼν
  choice: 去
  rationale: 不定过去时分词表示先于主要动作发生的行动；汉语以“去同……商议”自然呈现动作次序，无须生硬译作“离开以后”。
- source_word: συνελάλησεν
  choice: 商议
  rationale: 该词表示共同交谈、磋商；“商议”既自然，又能体现双方谋划具体做法的语境。
- source_word: ἀρχιερεῦσιν
  choice: 祭司长
  rationale: 这是复数 ἀρχιερεύς 在本语境中的惯常译法，指居领导地位的祭司权贵，并非同时有多位“大祭司”。
- source_word: στρατηγοῖς
  choice: 圣殿守卫长
  rationale: 在耶路撒冷语境中，这些人是负责圣殿治安与守卫事务的官长；明确译出“圣殿”可避免被误解为罗马军官。
- source_word: τὸ πῶς
  choice: 怎样
  rationale: 冠词加 πῶς 引出商议的内容，现代汉语自然译为“怎样”。
- source_word: παραδῷ
  choice: 交给
  rationale: παραδίδωμι 的基本意思是交出、交付；此处行为构成背叛，但正文保留较宽的词义，避免把语境含义完全写进动词。
- source_word: αὐτοῖς ... αὐτόν
  choice: 把耶稣交给他们
  rationale: 两个代词分别指耶稣和前述祭司长、圣殿守卫长。汉语若连续使用“他”，指代容易含混，因此将宾语明示为“耶稣”。
theological_decisions:
- issue: 犹大行为中的 παραδῷ 如何翻译
  choice: 把耶稣交给他们
  alternative: 出卖耶稣；把耶稣交出去
  rationale: 上下文清楚表明这是犹大的背叛，但希腊语动词本身比“出卖”宽泛。正文采用“交给”保留其基本意义，脚注说明在本语境中也可译为“出卖”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“去同……商议”简洁呈现分词与主要动词的关系；“圣殿守卫长”在正文中消除“军官”的潜在误读；明示“耶稣”以避免汉语代词歧义。
