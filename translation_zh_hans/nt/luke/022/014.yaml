  text: Καὶ ὅτε ἐγένετο ἡ ὥρα, ἀνέπεσεν καὶ ⸀οἱ ἀπόστολοι σὺν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/014.yaml
  text: And when the hour came[a], he reclined at the table, and the apostles with him.
translation:
  language: zh_hans
  text: 时候到了，耶稣就斜倚在席上[a]，使徒们也同他一起斜倚在席上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文动词指古代人进餐时斜倚的姿势。
    reason: cultural_note
lexical_decisions:
- source_word: ὅτε ἐγένετο ἡ ὥρα
  choice: 时候到了
  rationale: 自然表达指定时刻的来临；上下文已明确所指，既保留叙事上的特定性，也避免中文“那一小时到了”可能造成的生硬或时长误解。
- source_word: ἀνέπεσεν
  choice: 在席上斜倚而坐
  rationale: 准确反映古代宴席中侧身斜倚进餐的姿势，同时加入“在席上”帮助现代读者理解其用餐语境。
- source_word: οἱ ἀπόστολοι
  choice: 使徒们
  rationale: 直接对应带冠词的复数名词，指叙事中已知的使徒群体，不额外添加原文没有的领属语“他的”。
- source_word: σὺν αὐτῷ
  choice: 也和他一同坐席
  rationale: “和他一同”直接表达 σύν 的共同参与关系；补出“坐席”使省略谓语的希腊并列结构在中文中完整自然。
- source_word: Καὶ
  choice: 便
  rationale: 本节在中文中不必机械译出句首连接词；“便”承接时间从句，保持连续的叙事推进。
theological_decisions:
- issue: 逾越节筵席中的进餐姿势
  choice: 在席上斜倚而坐
  alternative: 坐下
  rationale: 保留 ἀναπίπτω 所指的古代用餐姿势，不将其泛化为现代的普通坐姿；这是历史文化信息，而非教义性扩充。
- issue: “时候”是否具有超出本段的神学含义
  choice: 时候到了
  alternative: 指定的时刻到了
  rationale: 原文定冠词表明一个由上下文确定的时刻，但本节并未明说“指定”或进一步界定其神学性质，因此译文保留简洁和可能的张力，不作额外解释。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“斜倚而坐”比单纯“坐下”更贴近历史场景；“使徒们也和他一同坐席”将希腊语省略的并列动作自然补足，但不增加新的参与者或神学解释。
