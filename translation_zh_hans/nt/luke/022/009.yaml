  yaml_path: translation/nt/luke/022/009.yaml
  text: They said to him[a], “Where do you want us to prepare it?”
translation:
  language: zh_hans
  text: 他们对他说：“你要我们在哪里预备呢？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“你要我们在哪里作准备呢？”按上文，所预备的是逾越节的筵席。
    reason: 说明ἑτοιμάσωμεν可译为“预备”或“作准备”，并交代原文省略而由上文可知的宾语。
lexical_decisions:
- source_word: οἱ δὲ
  choice: 他们
  rationale: 定冠词在这里作名词用，按上下文指门徒；δέ只是轻微承接，现代汉语无需另译“而”或“于是”。
- source_word: εἶπαν αὐτῷ
  choice: 对他说
  rationale: 直译并自然保留“说”的表达；引语虽是问句，但不必改译为“问”。
- source_word: Ποῦ
  choice: 在哪里
  rationale: 准确表达询问地点的疑问副词，并符合现代汉语语序。
- source_word: θέλεις
  choice: 你要
  rationale: θέλω表示意愿或意图；“你要”简洁自然，也贴合耶稣吩咐门徒办理此事的语境。
- source_word: ἑτοιμάσωμεν
  choice: 我们……预备
  rationale: 第一人称复数不定过去时虚拟语气受θέλεις支配，汉语自然表达为“你要我们……预备”。希腊文未明说宾语，正文也不补出，以保留原文的省略。
