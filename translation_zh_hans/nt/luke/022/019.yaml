base_translation:
  language: en
  yaml_path: translation/nt/luke/022/019.yaml
  text: And taking bread[a], after giving thanks he broke it and gave it to them, saying, “This is my body, which is given for you[c][b]. Keep doing this in remembrance of me.”
translation:
  language: zh_hans
  text: 他拿起饼，祝谢后，把饼掰开，递给他们，说：“这是我的身体[c]，为你们舍的[b]。你们要继续这样做，为的是记念我。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本没有“为你们舍的。你们要继续这样做，为的是记念我”。
    reason: textual_variant
  - marker: b
    text: 或译：“正为你们舍出”。
    reason: lexical_alternative
  - marker: c
    text: “这是我的身体”依原文直译；有人将其理解为“这是象征我的身体”，但希腊原文本身用的是“是”。
    reason: alternative_reading
lexical_decisions:
- source_word: λαβὼν ἄρτον
  choice: 拿起饼
  rationale: 用自然的汉语叙事表达先行的分词动作；“饼”直接对应本处餐席语境中的ἄρτος。
- source_word: εὐχαριστήσας
  choice: 祝谢后
  rationale: 表达感谢在掰饼之前发生；“祝谢”简洁庄重，又不额外指明经文未明说的受谢对象。
- source_word: ἔκλασεν καὶ ἔδωκεν αὐτοῖς
  choice: 掰开，递给他们
  rationale: “掰开”符合饼的具体动作；“递给他们”自然表达把饼给在场门徒。
- source_word: Τοῦτό ἐστιν τὸ σῶμά μου
  choice: 这是我的身体
  rationale: 直译系词ἐστιν为“是”，不以“象征”或“代表”等解释性措辞预先解决相关神学争议。
- source_word: τὸ ὑπὲρ ὑμῶν διδόμενον
  choice: 为你们舍的
  rationale: “为你们”保留ὑπέρ的受益、代求或代受层面而不作过度限定；“舍”是现代汉语中身体为他人而给出的自然表达。
- source_word: τοῦτο ποιεῖτε
  choice: 你们要继续这样做
  rationale: “继续”显出现在时命令语气在这一设立语境中的持续或重复实践意味。
- source_word: εἰς τὴν ἐμὴν ἀνάμνησιν
  choice: 为的是记念我
  rationale: 表达以记念耶稣为目的的行动，并保留ἀνάμνησις主动纪念、追念的意味。
theological_decisions:
- issue: 圣餐语境中“这是我的身体”的含义
  choice: 保留“这是我的身体”的直接陈述
  alternative: 这是代表我身体的／这是象征我身体的
  rationale: 希腊文使用系词“是”；译文不加入“代表”或“象征”，以保留原文的措辞及其神学张力。
- issue: 路加福音22:19较长读法的文本鉴别地位
  choice: 将有争议的较长读法收入正文，并以脚注说明
  alternative: 正文止于“这是我的身体”
  rationale: SBLGNT所给文本列出较长读法，同时以特殊括号标示其文本问题；收入正文并注明异文，兼顾底本文本与抄本证据。
- issue: διδόμενον的时态体表达
  choice: 正文译作“舍的”
  alternative: 正为你们舍出
  rationale: 正文保持简洁自然，不强制把希腊文现在分词解释为某一特定时间点；脚注提供可显明进行意味的译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“祝谢”“记念”保留经文礼仪语境所需的凝练感；句法则依现代汉语调整，避免生硬复制希腊语分词结构。所有脚注标记均在正文出现。
