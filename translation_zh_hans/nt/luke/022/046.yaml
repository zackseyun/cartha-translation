  text: καὶ εἶπεν αὐτοῖς· Τί καθεύδετε; ἀναστάντες προσεύχεσθε, ἵνα μὴ εἰσέλθητε εἰς πειρασμόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/046.yaml
  text: And he said to them, “Why are you sleeping? Get up and pray, so that you may not enter into temptation.”
translation:
  language: zh_hans
  text: 他对他们说：“你们为什么睡觉？起来祷告，免得陷入试探。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθεύδετε
  choice: 睡觉
  rationale: 直接表达门徒当时正在睡觉的状态，符合现代汉语习惯。
- source_word: ἀναστάντες
  choice: 起来
  rationale: 该词为附带情状分词，在此与命令语气的“祷告”连用；译作“起来”自然保留先起身再祷告的行动要求。
- source_word: προσεύχεσθε
  choice: 祷告
  rationale: 准确传达向上帝祈求的宗教行为，且为现代中文圣经语域中的常用表达。
- source_word: ἵνα μὴ εἰσέλθητε εἰς πειρασμόν
  choice: 免得陷入试探
  rationale: 保留目的或结果色彩；“陷入试探”自然传达进入受试探处境之意，同时不武断限定为外在考验或内在诱惑。
theological_decisions:
- issue: πειρασμός可指试探、诱惑或考验
  choice: 试探
  alternative: 考验
  rationale: “试探”在此保留道德诱惑与严峻考验之间的语义张力，也与门徒即将面对的处境相称。
- issue: εἰσέρχομαι εἰς πειρασμόν的表达
  choice: 陷入试探
  alternative: 进入试探
  rationale: “陷入”是自然的现代汉语搭配，并传达进入且受其牵制的危险；不将经文解释成完全避免任何试炼。
translation_notes:
  register: 采用简洁、庄重而口语自然的现代标准汉语。问句保留直接责问的力度；命令句简明有力。
