base_translation:
  language: en
  yaml_path: translation/nt/luke/022/044.yaml
  text: And being in agony[a], he was praying more intensely[c][b]; and his sweat became like drops of blood falling to the ground.
translation:
  language: zh_hans
  text: 他在极度痛苦中，更加恳切地祷告；[a]他的汗如同血滴般落在地上。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本没有路加福音22:43–44，另一些抄本则有这两节。SBLGNT将这两节置于括号内，以反映这一文本上的不确定性。
    reason: textual_variant
  - marker: b
    text: 希腊文此处可理解为“如同血滴（或血块）”；这是比拟，并未直接断言他的汗本身就是血。
    reason: lexical_alternative
lexical_decisions:
- source_word: γενόμενος ἐν ἀγωνίᾳ
  choice: 在极度痛苦中
  rationale: ἀγωνία表示剧烈的挣扎、焦灼或痛苦；这样译既传达强烈程度，也不把它限定为纯粹身体疼痛。γενόμενος在汉语中自然融入状态表达，无须生硬译作“成为”。
- source_word: ἐκτενέστερον
  choice: 更加恳切地
  rationale: 比较级表示祷告的强度进一步增加。“更加”保留比较意味，“恳切地”在现代汉语中自然庄重，也可涵盖热切、迫切和专注。
- source_word: προσηύχετο
  choice: 祷告
  rationale: 未完成时描写持续进行的动作。汉语动词本身不强制标记时体，结合“更加恳切地”可自然表达当时持续的祷告。
- source_word: ἐγένετο ὁ ἱδρὼς αὐτοῦ ὡσεὶ
  choice: 他的汗如同
  rationale: ὡσεὶ明确引出比拟。“如同”保留相似而非等同的关系；汉语无需逐字译出ἐγένετο的“成为”，即可自然表达所呈现的状态。
- source_word: θρόμβοι αἵματος
  choice: 血滴
  rationale: θρόμβοι可指滴、块或凝块；在“落在地上”的语境中，“血滴”最自然，同时在脚注说明其词义范围。
- source_word: καταβαίνοντες ἐπὶ τὴν γῆν
  choice: 落在地上
  rationale: 简洁自然地表达向下移动并到达地面的画面。
theological_decisions:
- issue: “汗如同血滴”的性质
  choice: 保留明喻：汗如同血滴
  alternative: 汗就是血，或汗中实际带血
  rationale: ὡσεὶ明确表示比较。正文不把比拟改成同一，从而不额外断定医学现象或神迹性质，同时保留画面的强烈程度。
- issue: 路加福音22:43–44的文本存疑
  choice: 正文收录本节，并以脚注说明抄本证据存在分歧
  alternative: 删去本节，或不说明文本问题
  rationale: 所给SBLGNT将相关经节置于文本中但加括号，表明其真实性存在重要的抄本分歧；正文按指定来源翻译，同时让读者知悉不确定性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“极度痛苦”传达ἀγωνία的剧烈程度而不过度限定其性质；“更加恳切地祷告”自然保留比较级和持续情境；正文以“如同”明确保留原文的明喻。脚注标记均置于正文相应位置。
