- from: 因为人子固然要照所定的离去，但那出卖他的人有祸了！[a]
  to: 因为人子固然要照所定的而去，但那出卖他的人有祸了[a]！
  rationale: 将“照所定的离去”改为“照所定的而去”，使中文更自然，并更贴近 πορεύεται 的行进语义而不把其意义限定为普通“离去”或明确的“死亡”。脚注改为明确的被动表达“他被交出去”，以保留 παραδίδοται 的语态和词义范围。其余结构保留原文对既定安排与出卖者责任的张力。
