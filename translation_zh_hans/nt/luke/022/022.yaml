  naturalness: 原句整体庄重通顺，但“照所定的离去”搭配略显生硬。“照所定的而去”在庄重的现代圣经汉语中更自然。脚注宜明确原文为被动式，避免“交出去”被理解为出卖者自身的主动动作而不清楚受事是“他”。
  terminology: “人子”是固定且合宜的译名。“出卖”在犹大这一直接叙事语境中恰当；脚注保留“被交出去”的较宽词义，且须维持原文的被动语态。
