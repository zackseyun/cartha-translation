  text: ⸂ὅτι ὁ υἱὸς μὲν⸃ τοῦ ἀνθρώπου ⸂κατὰ τὸ ὡρισμένον πορεύεται⸃, πλὴν οὐαὶ τῷ ἀνθρώπῳ ἐκείνῳ δι’ οὗ παραδίδοται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/022.yaml
  text: For the Son of Man indeed goes as it has been determined[a], but woe to that man through whom he is betrayed.
translation:
  language: zh_hans
  text: 因为人子固然要照所定的而去，但那出卖他的人有祸了[a]！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “出卖他”也可译作“他被交出去”。希腊语这个动词依上下文可表示背叛、出卖，也可表示把人交出去。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 承接上一节，为耶稣关于同桌之人将要出卖他的陈述说明缘由；现代汉语用“因为”自然清楚。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人子
  rationale: 保留耶稣这一固定自称及其经文互文意义。
- source_word: μέν … πλὴν
  choice: 固然……但
  rationale: 准确呈现先承认一面、继而加以强烈转折的结构，使既定计划与人的责任并置。
- source_word: κατὰ τὸ ὡρισμένον
  choice: 照所定的
  rationale: 保留“按照已经确定之事”的被动含义，不擅自明说决定者，也不削弱其既定性。
- source_word: πορεύεται
  choice: 离去
  rationale: 在此指人子走向受难与死亡的进程；“离去”既保留行动意象，也适合本段庄重语境。
- source_word: οὐαὶ
  choice: 有祸了
  rationale: 以现代中文常见的圣经警告语表达灾祸宣告，同时可兼具哀叹意味。
- source_word: τῷ ἀνθρώπῳ ἐκείνῳ
  choice: 那……的人
  rationale: 指向特定的男性出卖者；中文关系结构比直译“那个人”更流畅。
- source_word: δι’ οὗ
  choice: 出卖他的人
  rationale: 借中文关系结构表达 διά 加属格所标示的中介或施事关系。
- source_word: παραδίδοται
  choice: 出卖
  rationale: 当前语境突出犹大的背信行为；同时以脚注保留“交出去”这一较中性且重要的词义。
theological_decisions:
- issue: 神所定的计划与出卖者责任之间的关系
  choice: 用“固然……但”并置人子照所定的离去和出卖者有祸，不消解两者之间的张力。
  alternative: 淡化事情的既定性，或淡化出卖者应负的责任。
  rationale: 原文明确将 κατὰ τὸ ὡρισμένον 与对出卖者的 οὐαί 宣告相对照；译文应同时保留这两方面。
- issue: “所定的”之决定者是否明说
  choice: 采用无主语的“所定的”。
  alternative: 译作“照神所定的”。
  rationale: 神为隐含的决定者虽符合上下文与神学理解，但原文使用中性单数的实词化被动分词，并未在本句明说“神”，故不在正文补入。
translation_notes:
  register: 采用现代、庄重且易懂的中文。“固然……但”保持原文对照结构；“照所定的”保留被动表达和决定者未明说的特点。脚注标记置于整句之后，说明 παραδίδοται 的词义范围。
