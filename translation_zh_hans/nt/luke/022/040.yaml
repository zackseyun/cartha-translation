id: LUK.22.40
reference: Luke 22:40
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: γενόμενος δὲ ἐπὶ τοῦ τόπου εἶπεν αὐτοῖς· Προσεύχεσθε μὴ εἰσελθεῖν εἰς πειρασμόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/040.yaml
  text: When he came to the place[a], he said to them, “Pray that you may not enter into temptation.”
translation:
  language: zh_hans
  text: 他到了那地方，就对他们说：“你们要祷告，免得进入试探[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“考验”或“试炼”。希腊词既可指道德意义上的试探，也可泛指受考验的处境。
    reason: lexical_alternative
lexical_decisions:
- source_word: γενόμενος δὲ ἐπὶ τοῦ τόπου
  choice: 他到了那地方
  rationale: γενόμενος与地点短语连用，表达抵达已知地点；“到了那地方”自然地保留先抵达、后说话的时间关系。δέ在此仅作轻微的叙事衔接，不必另译。
- source_word: εἶπεν αὐτοῖς
  choice: 就对他们说
  rationale: 直译λέγω的普通陈述义；“就”使抵达与说话之间的先后衔接符合现代汉语叙事习惯。
- source_word: Προσεύχεσθε
  choice: 你们要祷告
  rationale: 现在时命令式要求门徒祷告；“要祷告”在现代汉语中清楚自然，而不把持续体意义过度展开为“不断祷告”。
- source_word: μὴ εἰσελθεῖν
  choice: 免得进入
  rationale: 保留εἰσέρχομαι“进入”的意象，并以“免得”自然表达祷告所要避免的结果；不译成“陷入”，以免增加原词本身没有明说的失足意味。
- source_word: πειρασμόν
  choice: 试探
  rationale: 此处直接关系到门徒可能发生的属灵失败，“试探”最切合近处语境；原词也可指较广义的考验或试炼，故在脚注中保留这一词义张力。
theological_decisions:
- issue: πειρασμός在耶稣警告中的含义
  choice: 试探
  alternative: 考验；试炼
  rationale: 眼前语境是耶稣警告门徒提防属灵上的失败，因此正文采用“试探”；但希腊词也能指较广义的受考验处境，脚注对此予以说明，不把含义绝对限定。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“那地方”承接上文已知地点；正文保留“进入试探”的原文意象。脚注标记置于“试探”之后，使其准确对应所说明的词语。
