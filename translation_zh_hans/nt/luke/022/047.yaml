  text: ⸀Ἔτι αὐτοῦ λαλοῦντος ἰδοὺ ὄχλος, καὶ ὁ λεγόμενος Ἰούδας εἷς τῶν δώδεκα προήρχετο αὐτούς, καὶ ἤγγισεν τῷ Ἰησοῦ φιλῆσαι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/047.yaml
  text: While he was still speaking[a], behold, a crowd came, and the one called Judas, one of the twelve, was going before them, and he came near to Jesus to kiss him.
translation:
  language: zh_hans
  text: 耶稣还在说话的时候，看哪，来了一群人。那名叫犹大、十二人中的一个，走在他们前面[a]；他走近耶稣，要亲吻他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“领着他们”或“走在他们前头”。
    reason: προήρχετο在此可侧重走在前面，也可能含有带领这一群人的意味；脚注保留这种词义幅度。
lexical_decisions:
- source_word: Ἔτι αὐτοῦ λαλοῦντος
  choice: 耶稣还在说话的时候
  rationale: 属格独立结构表示与下文同时发生且仍在持续的动作；明确补出语境中的主语“耶稣”，使现代汉语自然清楚。
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留提示读者注意突发场面的叙事标记及其鲜明感。
- source_word: ὄχλος
  choice: 来了一群人
  rationale: ὄχλος指一群人；原文未明说“来”，但在“看哪”之后，汉语补出该动词可自然表达他们突然出现的语境含义。
- source_word: ὁ λεγόμενος Ἰούδας
  choice: 那名叫犹大
  rationale: 忠实表达用于辨明身份的分词结构，不加入“所谓”等可能带贬义的语气。
- source_word: εἷς τῶν δώδεκα
  choice: 十二人中的一个
  rationale: 保留原文简洁称谓及犹大身列十二人之中的叙事张力，不擅自补入“使徒”。
- source_word: προήρχετο αὐτούς
  choice: 走在他们前面
  rationale: 体现未完成时所描写的进行状态，并保留既可表示走在前头、也可能暗含带领的词义空间。
- source_word: ἤγγισεν τῷ Ἰησοῦ
  choice: 他走近耶稣
  rationale: 自然表达ἐγγίζω在此处的接近、靠近之意。
- source_word: φιλῆσαι αὐτόν
  choice: 要亲他
  rationale: 不定式表明犹大走近耶稣的目的；直译亲吻动作，不在正文中加入其作为问安方式或背叛暗号的解释。
theological_decisions:
- issue: 如何叙述犹大的行动
  choice: 只陈述他走近耶稣、要亲他
  alternative: 译作“要以亲吻出卖他”
  rationale: 上下文清楚表明背叛，但本节原文只叙述接近和亲吻的意图；不把后文或语境中的道德解释直接写进本节。
- issue: “十二人”是否明确译为“十二使徒”
  choice: 十二人中的一个
  alternative: 十二使徒中的一个
  rationale: 原文仅为“十二人”；采用较少解释性的表达，既保留其公认群体称谓，也不在此处扩充名衔。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“看哪”有意保留原文醒目的话语标记；“十二人”沿用原文的简略称谓。脚注标记置于其实际说明的短语“走在他们前面”之后。
