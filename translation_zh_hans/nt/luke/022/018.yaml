  text: λέγω γὰρ ὑμῖν, ⸀οὐ μὴ πίω ἀπὸ τοῦ ⸂νῦν ἀπὸ τοῦ⸃ γενήματος τῆς ἀμπέλου ἕως ⸀οὗ ἡ βασιλεία τοῦ θεοῦ ἔλθῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/018.yaml
  text: For I tell you[a], from now on I will certainly not drink from the fruit of the vine until the kingdom of God comes.
translation:
  language: zh_hans
  text: 因为我告诉你们：从今以后，我绝不再喝葡萄树的果实[a]，直到上帝的国来临。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“葡萄酒”。希腊原文直译为“葡萄树的果实”，这一较宽泛的说法很可能指杯中之物，却没有使用通常表示“酒”的词。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: 因为我告诉你们
  rationale: λέγω与间接受格ὑμῖν构成直接告知的常用表达；γάρ承接上文并说明缘由，译作“因为”以保留其解释性联系。
- source_word: οὐ μὴ πίω
  choice: 我绝不再喝
  rationale: οὐ μή加不定过去时虚拟语气表达强烈的将来否定；“绝不”体现强调，“再”与“从今以后”自然衔接，同时后面的“直到”保留了时间界限。
- source_word: ἀπὸ τοῦ νῦν
  choice: 从今以后
  rationale: 该惯用语以当前时刻为起点；“从今以后”是自然、准确的现代汉语表达。
- source_word: ἀπὸ τοῦ γενήματος τῆς ἀμπέλου
  choice: 喝这葡萄树的果实
  rationale: γένημα指所结出的产物或果实；保留“葡萄树的果实”这一较宽泛且带礼仪色彩的表达，不直接窄化为“酒”。汉语中补入“这”使其自然指向当前杯中之物。
- source_word: ἕως οὗ
  choice: 直到
  rationale: 引出否定陈述的时间终点，“直到”简洁而准确。
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: 上帝的国
  rationale: βασιλεία兼有王权统治与国度的含义；“上帝的国”是符合同观福音语境的通行表达，又不把含义限定为抽象的“统治”。
- source_word: ἔλθῃ
  choice: 来临
  rationale: 不定过去时虚拟语气位于ἕως οὗ之后，指向将来的事件；“来临”自然保留其末世性的时间指向。
theological_decisions:
- issue: γενήματος τῆς ἀμπέλου应译为“酒”还是保留较直译的表达
  choice: 葡萄树的果实
  alternative: 酒
  rationale: 希腊文没有在此使用通常表示酒的词，而采用较宽泛、正式的表达。保留原文措辞可避免过度限定，并保存逾越节筵席语境中的礼仪色彩。
- issue: 上帝之国来临的方式或阶段
  choice: 直到上帝的国来临
  alternative: 直到上帝的国完全实现
  rationale: 原文只设定一个面向未来的时间界限，并未说明国度以何种方式或在哪一阶段来临；译文不替原文作系统化的末世论说明。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“绝不再喝”传达强烈否定；“葡萄树的果实”保留原文独特措辞，并以脚注说明自然的词义替代。
