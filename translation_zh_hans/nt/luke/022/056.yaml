  source_fidelity: 译文准确传达了该使女看见彼得坐在光照之处、仔细注视他并作出指认的叙事。将上下文中明确的代词所指译为“彼得”是安全的。πρὸς τὸ φῶς译为“光亮处”并以脚注保留“靠近光源”的可能，处理得当，未擅自具体化为火光。
