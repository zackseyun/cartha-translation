  text: ἰδοῦσα δὲ αὐτὸν παιδίσκη τις καθήμενον πρὸς τὸ φῶς καὶ ἀτενίσασα αὐτῷ εἶπεν· Καὶ οὗτος σὺν αὐτῷ ἦν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/056.yaml
  text: Then a certain servant girl[a], seeing him seated by the light and looking intently at him, said, “This man also was with him.”
translation:
  language: zh_hans
  text: 有一个使女看见彼得坐在光亮处[a]，就定睛看着他，说：“这个人也曾和他在一起。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“坐在光旁。”希腊语短语既可指靠近光源，也可指处在光照之中。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοῦσα δὲ αὐτὸν
  choice: 有一个使女看见彼得
  rationale: δέ在这里推进叙事，不必在汉语中另译为“然后”；分词ἰδοῦσα自然转为谓语“看见”。按上下文将代词所指明示为“彼得”，可避免现代汉语中连续代词造成含混。
- source_word: παιδίσκη τις
  choice: 一个使女
  rationale: παιδίσκη指年轻的女性仆役，也可能具有奴仆身份；“使女”简洁庄重，又不在本节中过度强调其法律身份。τις表达不特指，用“一个”自然体现。
- source_word: καθήμενον πρὸς τὸ φῶς
  choice: 坐在光亮处[a]
  rationale: πρὸς τὸ φῶς可指靠近光源，也可指处在受光照亮的范围内。“光亮处”保留可见于光中的意思，不擅自把φῶς具体化为火。脚注说明另一种位置关系。
- source_word: ἀτενίσασα αὐτῷ
  choice: 定睛看着他
  rationale: ἀτενίζω表示专注、持续地凝视；“定睛看着”准确而自然，保留她仔细辨认彼得的动作。
- source_word: Καὶ οὗτος
  choice: 这个人也是
  rationale: οὗτος具有指认意味，译作“这个人”；καί在这里表示追加，译作“也”。
- source_word: σὺν αὐτῷ ἦν
  choice: 跟他一起的
  rationale: 直译彼得曾与耶稣同在、同行的关联，不扩展为“门徒”或“同党”，从而保留原文简洁表述。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事表达。“使女”“定睛”保留经文语体但不显陈旧；引语简洁直接。脚注标记置于其实际所解释的“光亮处”之后。
