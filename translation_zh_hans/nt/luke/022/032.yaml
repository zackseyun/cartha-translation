  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ἐδεήθην περὶ σοῦ ἵνα μὴ ἐκλίπῃ ἡ πίστις σου· καὶ σύ ποτε ἐπιστρέψας ⸀στήρισον τοὺς ἀδελφούς σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/032.yaml
  text: But I have prayed for you[a], that your faith may not fail; and you, when you have turned back[b], strengthen your brothers.
translation:
  language: zh_hans
  text: 但我已经为你祈求，使你不至于失去信心[a]。你回转以后[b]，要坚固你的弟兄。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “信心”也可理解为“忠信”或“信靠”；希腊词的这些含义彼此有所重叠。
    reason: alternative_reading
  - marker: b
    text: “回转以后”也可译作“返回以后”或“再次转回以后”。这话暗示彼得将要失败，随后得到恢复。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδεήθην
  choice: 已经祈求
  rationale: 该动词表示恳切祈求；用“已经祈求”自然表达不定过去时所指的已成行动及其当前关联。
- source_word: περὶ σοῦ
  choice: 为你
  rationale: περί加属格与祈祷动词连用时表示代求对象，汉语自然译作“为你”。
- source_word: ἵνα μὴ ἐκλίπῃ
  choice: 使……不至失落
  rationale: ἐκλείπω可指衰竭、停止或失效；“不至失落”既符合信心的搭配，也不把彼得将来的失败夸大为彻底离弃信仰。
- source_word: πίστις
  choice: 信心
  rationale: 此处涵盖对耶稣的信靠以及忠信不移的意味；“信心”保留较宽的语义范围。
- source_word: ποτε
  choice: 以后
  rationale: ποτε在此与先行的回转动作共同指向将来某一时点；汉语用“回转以后”自然表达其时序关系。
- source_word: ἐπιστρέψας
  choice: 回转
  rationale: 该分词可表示转回或返回，并可含悔改、复归的意味；“回转”保留方向性比喻而不把含义限定为技术性的“悔改”。
- source_word: στήρισον
  choice: 坚固
  rationale: 命令式要求彼得使其他门徒坚定；“坚固”能自然表达属灵与关系上的扶持和巩固。
- source_word: ἀδελφούς
  choice: 弟兄
  rationale: 原文为阳性复数，直接语境所指是耶稣身边的男性门徒；“弟兄”准确保留这一指向。
theological_decisions:
- issue: πίστις在“信心”“忠信”和“信靠”之间的语义重叠
  choice: 信心
  alternative: 忠信；信靠
  rationale: “信心”保留该词在彼得受试探语境中的神学宽度，不把它缩窄为行为上的忠诚或主观信赖；其他可能意味列入脚注。
- issue: ἐπιστρέψας对彼得未来状态的描述
  choice: 回转以后
  alternative: 返回以后；再次转回以后；悔改以后
  rationale: 原文暗示彼得失败后的复归，却没有明说技术意义上的“悔改”；“回转”保留这种恢复与转向的张力。
- issue: ἀδελφούς的语境指向
  choice: 弟兄
  alternative: 弟兄姊妹；众信徒
  rationale: 直接指向在场的男性门徒，因此不扩展为泛指男女混合的信徒群体。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“已经为你祈求”突出耶稣代求的已成事实；“不至失落”避免口语化的“撑不住”，也避免暗示信心绝对没有任何动摇。“回转以后”保留原文的恢复意味与含蓄性。
