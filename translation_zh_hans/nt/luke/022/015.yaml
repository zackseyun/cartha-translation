  text: καὶ εἶπεν πρὸς αὐτούς· Ἐπιθυμίᾳ ἐπεθύμησα τοῦτο τὸ πάσχα φαγεῖν μεθ’ ὑμῶν πρὸ τοῦ με παθεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/015.yaml
  text: And he said to them[b][a], “I have earnestly desired to eat this Passover with you before I suffer.”
translation:
  language: zh_hans
  text: 他对他们说：“我切切盼望[a]在受苦以前，和你们一起吃这逾越节筵席[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译可作“我以愿望渴望”；原文以同根名词和动词构成强调表达，突出耶稣强烈的盼望。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“这逾越节”；这里因提到“吃”，可理解为逾越节筵席。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν πρὸς αὐτούς
  choice: 他对他们说
  rationale: 这是自然、直接的现代汉语叙事引语格式，准确表达 λέγω 与 πρός 加宾格的结构。
- source_word: Ἐπιθυμίᾳ ἐπεθύμησα
  choice: 我切切盼望
  rationale: 原文以同根名词和动词构成强调表达。“切切盼望”既传达强烈而真挚的愿望，也比逐字重复更符合现代汉语习惯。
- source_word: τοῦτο τὸ πάσχα
  choice: 这逾越节的筵席
  rationale: πάσχα 可指逾越节，也可指逾越节的筵席；在 φαγεῖν“吃”的直接语境中，所指是筵席。此译法使现代汉语自然清楚，同时用脚注保留较贴近字面的表达。
- source_word: φαγεῖν
  choice: 吃
  rationale: 直接对应 ἐσθίω 的不定式，简洁自然，无须扩展为“享用”或“参与”。
- source_word: μεθ’ ὑμῶν
  choice: 和你们一起
  rationale: 准确表达陪同、共同参与之意，也符合自然汉语语序。
- source_word: πρὸ τοῦ με παθεῖν
  choice: 在受苦以前
  rationale: πρό 加带主语的冠词化不定式表示先于某事；此处 πάσχω 指耶稣将要承受的苦难。“在受苦以前”准确、庄重，并未过度具体化其受难事件。
theological_decisions:
- issue: πάσχα 在本节中的含义
  choice: 正文译为“这逾越节的筵席”
  alternative: 这逾越节
  rationale: 原词本身可指节期或筵席，而“吃”的语境明确突出了筵席。正文采用自然清楚的汉语表达，脚注则保留原文较简略的措辞及其语义范围。
- issue: Ἐπιθυμίᾳ ἐπεθύμησα 的强调力度
  choice: 译为“我切切盼望”
  alternative: 直译为“我以愿望来愿望”或较平淡地译为“我很想”
  rationale: 同根名词与动词的组合加强了耶稣愿望的力度。“切切盼望”保留这种强调和临受苦前的郑重语气，却不额外引入某种神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“切切盼望”保留原文的强烈情感而不显生硬；“逾越节的筵席”在饮食语境中自然明确。脚注标记均置于正文相应词语之后。
