  text: And they were saying many other blasphemous things against him[a][b].
translation:
  language: zh_hans
  text: 他们还不断说许多别的话来亵渎他[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“辱骂他”或“侮辱他”。希腊语这个词也可泛指毁谤或辱骂；正文译作“亵渎”，以保留这里较强的语气。
    reason: lexical_alternative
  - marker: b
    text: 原文也可较字面地译作“对他说”。这里的介词在敌对言语的语境中可表示“针对他”。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: 还
  rationale: 承接上文，并表明这些言语是在先前的戏弄和殴打之外又加上的；现代汉语用“还”自然简洁。
- source_word: ἕτερα πολλὰ
  choice: 许多别的话
  rationale: 保留“许多”和“另外的”两层意思；结合ἔλεγον，在汉语中补出“话”最为自然。
- source_word: βλασφημοῦντες
  choice: 亵渎
  rationale: βλασφημέω可指毁谤、辱骂或亵渎；此处以耶稣为言语攻击的对象，“亵渎”保留了原词较强的分量，同时用脚注注明较宽泛的词义。
- source_word: ἔλεγον
  choice: 说了
  rationale: 未完成时描写当时持续发生的言语行为；汉语在“许多”及上下文的帮助下已可自然表达其延续或反复性，无须生硬地加“不断”。
- source_word: εἰς αὐτόν
  choice: 他
  rationale: 与“亵渎”构成自然的汉语动宾结构，表达敌对言语针对耶稣；“对他说”这一较字面的理解列入脚注。
theological_decisions:
- issue: βλασφημοῦντες应译为一般性的辱骂，还是保留“亵渎”的较强含义
  choice: 译作“亵渎”
  alternative: 译作“辱骂”或“侮辱”
  rationale: 原词的语义范围包含毁谤、辱骂和亵渎。正文采用“亵渎”以保留其强烈语气，但不把词义限定为针对神的技术性罪名；脚注明示较宽泛的可能译法。
- issue: εἰς αὐτόν表达言语是“对他说”还是“针对他”
  choice: 按敌对指向译入“亵渎他”
  alternative: “对他说”
  rationale: 介词短语在敌对言语的语境中可表示言语所针对的对象；正文采用自然汉语表达其敌对性，同时保留较字面的另一译法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“许多别的话”紧承上文，“亵渎他”简洁有力；脚注保留原文在“亵渎／辱骂”以及“针对他／对他说”之间的词义张力。
