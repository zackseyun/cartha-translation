  text: Καὶ ὡς ἐγένετο ἡμέρα, συνήχθη τὸ πρεσβυτέριον τοῦ λαοῦ, ἀρχιερεῖς ⸀τε καὶ γραμματεῖς, καὶ ⸀ἀπήγαγον αὐτὸν εἰς τὸ συνέδριον αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/066.yaml
  text: And when day came[a], the council of the elders of the people gathered together, both chief priests and scribes, and they led him away into their Sanhedrin[b],
translation:
  language: zh_hans
  text: 天一亮[a]，百姓的长老团，包括祭司长和文士，都聚集起来；他们把耶稣带到他们的议会中[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“到了白天”，或“黎明时分”。
    reason: lexical_alternative
  - marker: b
    text: “议会”也可译作“公会”或“议事处”。希腊语 συνέδριον 可指议会本身、正式会议，也可指其开会的场所。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ἐγένετο ἡμέρα
  choice: 天一亮
  rationale: 自然表达天色转明、白昼来到的时间含义；正文简洁，脚注保留较贴近字面的译法。
- source_word: συνήχθη
  choice: 聚集起来
  rationale: 体现被动形式所描述的集体聚集，不额外断定是谁召集了他们。
- source_word: τὸ πρεσβυτέριον τοῦ λαοῦ
  choice: 民间的长老会
  rationale: πρεσβυτέριον指由长老组成的群体或议事机构；“长老会”在现代汉语中清楚简洁，“民间的”表达τοῦ λαοῦ。
- source_word: ἀρχιερεῖς τε καὶ γραμματεῖς
  choice: 其中有祭司长和经学家
  rationale: τε καί连接该长老会的构成人员；“祭司长”和“经学家”分别传达两类职分，并使中文句法自然。
- source_word: ἀπήγαγον αὐτόν
  choice: 他们把耶稣带到
  rationale: ἀπάγω表示带走或押送；正文用较中性的“带到”，避免加入原文未明说的暴力程度。代词明确为“耶稣”，便于独立阅读本节。
- source_word: εἰς τὸ συνέδριον αὐτῶν
  choice: 到自己的议会里
  rationale: συνέδριον可指议会本身、正式会议或会所；“议会”保留机构意义，而“里”也容许场合或地点理解，不强行限定为房间。
theological_decisions:
- issue: πρεσβυτέριον与συνέδριον所指的犹太领袖机构
  choice: 分别译作“长老会”和“议会”
  alternative: 两者都译作“公会”，或把συνέδριον译作“公会会堂”
  rationale: 原文使用两个相关而不相同的词。区别翻译保留路加的措辞变化；同时不把συνέδριον排他性地解释为机构、会议或建筑。
- issue: ἀπήγαγον的司法语气
  choice: 带到
  alternative: 押到／押走
  rationale: 上下文具有司法色彩，但动词本身不必然强调强制或暴力；采用中性译法以免过度诠释。
translation_notes:
  register: 采用现代、庄重而通俗的普通话。“经学家”比传统的“文士”更直接说明其职能；“长老会／议会”避免两个希腊词在中文中完全合并。正文中的[a]、[b]均与脚注对应。
