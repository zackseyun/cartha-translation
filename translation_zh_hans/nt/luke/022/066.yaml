revisions:
- from: 天一亮[a]，民间的长老会就聚集起来，其中有祭司长和经学家；他们把耶稣带到自己的议会[b]里。
  to: 天一亮[a]，百姓的长老团，包括祭司长和文士，都聚集起来；他们把耶稣带到他们的议会中[b]。
  rationale: 修正 τοῦ λαοῦ 的含义，避免“民间”所带的非官方色彩；以“长老团／议会”对应两个不同的希腊词；以“文士”准确、惯常地翻译 γραμματεῖς；并删除“自己的”以使所有关系及中文句法更自然。脚注锚点和两条脚注均完整保留。
