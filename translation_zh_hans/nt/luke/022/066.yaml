review_pass:
  verdict: revise
  source_fidelity: “民间的长老会”把 τοῦ λαοῦ 误导为“民间/非官方”，而原文是“百姓的（或民众的）长老团”。“自己的议会”也不自然地带出个别所有关系。应保留两个希腊机构词的区别，并以中文表达 συνέδριον 所指的议会或正式议事场合。
  naturalness: “百姓的长老团”比“民间的长老会”更符合现代普通话并避免“长老会”的教会体制联想。“文士”是中文圣经中对 γραμματεῖς 最稳定、最简洁的对应词；“带到他们的议会中”在中文中可自然涵盖带入正式议事场合。
  terminology: 祭司长、文士、长老团和议会的术语层次清楚。将 πρεσβυτέριον 译为“长老团”、συνέδριον 译为“议会”，保留原文的词汇变化，不将后者未经限定地固化为“公会”或某个建筑。
  issues:
  - severity: medium
    issue: “民间的长老会”
    rationale: τοῦ λαοῦ意为“百姓的/民众的”，并非“民间的”。“民间”容易暗示非官方组织；“长老会”也容易引起现代教会体制联想。
  - severity: low
    issue: “经学家”
    rationale: 可表达学术专家，但在现代汉语中常指中国传统经学研究者；“文士”是对 γραμματεῖς 的常用圣经术语，较准确且不额外限定其专业领域。
  - severity: low
    issue: “自己的议会里”
    rationale: “自己”在此容易产生个别所有关系，且“里”偏向实体空间。原文可指议会、正式会议或会场；“他们的议会中”保留这种开放性。
  revised_text: 天一亮[a]，百姓的长老团，包括祭司长和文士，都聚集起来；他们把耶稣带到他们的议会中[b]。
  revised_footnotes:
