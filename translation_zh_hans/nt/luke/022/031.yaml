  text: ⸀Σίμων Σίμων, ἰδοὺ ὁ Σατανᾶς ἐξῃτήσατο ὑμᾶς τοῦ σινιάσαι ὡς τὸν σῖτον·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/031.yaml
  text: 'Simon, Simon, look: Satan has demanded to have all of you, to sift you like wheat.'
translation:
  language: zh_hans
  text: '[a]“西门，西门，你看，撒但已经强烈要求得到你们，好像筛麦子那样筛你们。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些后期抄本在本节开头有“主又说”。
    reason: 交代SBLGNT所标示的文本异文；正文遵从较早抄本所支持的较短读法。
lexical_decisions:
- source_word: ἰδού
  choice: 你看
  rationale: 用现代汉语中自然的提醒语气，引导西门特别留意接下来的警告。
- source_word: ὁ Σατανᾶς
  choice: 撒但
  rationale: 采用该专名在现代中文圣经语境中的通行音译。
- source_word: ἐξῃτήσατο
  choice: 执意要求得到
  rationale: 该动词比一般的“请求”语气更强，含有强烈索求之意；此译法同时避免补出原文未明说的请求对象。
- source_word: ὑμᾶς
  choice: 你们
  rationale: 保留希腊文复数，表明撒但所索求的不只是西门一人，而是众门徒。
- source_word: τοῦ σινιάσαι ὡς τὸν σῖτον
  choice: 好筛你们，像筛麦子一样
  rationale: 保留目的结构和筛麦子的比喻，不进一步解释其具体所指。
theological_decisions:
- issue: 撒但向谁提出要求，以及这要求是否已获准
  choice: 不补明对象，也不明确断言已经获准
  alternative: 译作“撒但已经求得许可，要把你们……”
  rationale: 原句没有明说撒但向谁索求；ἐξῃτήσατο虽表达强烈索求，但其本身是否在此明确包含获准之意仍可讨论，因此译文保留这种张力。
- issue: 警告的对象范围
  choice: 用复数“你们”
  alternative: 按对西门的直接称呼译成单数“你”
  rationale: “西门”是单数呼语，但ὑμᾶς是复数；译文保留从对西门说话转向涉及众门徒的语法变化。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“西门，西门”保留重复呼名的郑重和迫切；“你看”比古雅的“看哪”更符合当代普通读者的语言习惯。
