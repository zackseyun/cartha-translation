id: LUK.22.71
reference: Luke 22:71
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν· Τί ἔτι ⸂ἔχομεν μαρτυρίας χρείαν⸃; αὐτοὶ γὰρ ἠκούσαμεν ἀπὸ τοῦ στόματος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/071.yaml
  text: Then they said[a], “Why do we still need testimony? For we ourselves have heard it from his own mouth.”
translation:
  language: zh_hans
  text: 于是他们说：“我们还需要证词做什么呢？[a] 因为我们自己已经从他口中听见了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们还需要什么证词呢？”
    reason: τί ἔτι与χρείαν ἔχειν可较形式对应地表达为“还需要什么……”，但也可理解为“还需要……做什么”的反问。
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: 于是他们说
  rationale: δέ在这里是推进叙事的轻度连接词；“于是”自然表达事件的承接，不额外强化转折。
- source_word: Τί ἔτι ἔχομεν μαρτυρίας χρείαν
  choice: 我们还需要证词做什么呢
  rationale: χρείαν ἔχειν意为“需要”，τί ἔτι使整句成为反问。“还需要……做什么”既符合现代汉语习惯，也保留“不再需要”的语用意味。
- source_word: μαρτυρίας
  choice: 证词
  rationale: 本节处于审讯语境，“证词”比一般性的“见证”更清楚地体现司法含义，同时不限定证词的具体内容。
- source_word: αὐτοὶ γὰρ
  choice: 因为我们自己
  rationale: “我们自己”保留αὐτοί的强调，突出说话者声称自己亲自听见。
- source_word: ἠκούσαμεν
  choice: 已经……听见了
  rationale: 希腊语不定过去时指刚刚发生并对当前判断产生作用的听闻；“已经……了”在汉语中自然体现这一即时结果。
- source_word: ἀπὸ τοῦ στόματος αὐτοῦ
  choice: 从他口中
  rationale: 较直接地保留“从他的口中”这一来源表达，强调所听见的话直接出于耶稣本人，同时没有补入原文未明说的宾语。
theological_decisions:
- issue: 是否明说他们听见的是耶稣的“证词”“宣称”或自证有罪的话
  choice: 保留原文省略宾语的表达：“从他口中听见了”
  alternative: 从他口中听见了这证词／听见了他的宣称
  rationale: 原文在ἠκούσαμεν之后没有明示宾语。补入“证词”或“宣称”会解释他们所听内容的性质，因此正文保留简洁和司法张力。
translation_notes:
  register: 采用现代、庄重而易懂的司法叙事用语。“证词”贴合上下文；末句刻意保留宾语省略，虽略带凝练感，却能忠实呈现原文的简短有力。
