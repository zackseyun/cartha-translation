  text: Καὶ εἶπεν αὐτοῖς· Ὅτε ἀπέστειλα ὑμᾶς ἄτερ βαλλαντίου καὶ πήρας καὶ ὑποδημάτων, μή τινος ὑστερήσατε; οἱ δὲ εἶπαν· Οὐθενός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/035.yaml
  text: And he said to them[a], “When I sent you out without a money bag and a travel bag and sandals, did you lack anything?” And they said, “Nothing.”
translation:
  language: zh_hans
  text: 耶稣又对他们说：“从前我差你们出去，没有带钱袋、行囊[a]和鞋，你们缺过什么吗？”他们说：“什么也不缺。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “行囊”或译“旅行袋”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ εἶπεν αὐτοῖς
  choice: 耶稣又对他们说
  rationale: 承接上文时，καί自然译为“又”；中文明确主语“耶稣”，避免代词所指不清。
- source_word: ἀπέστειλα ὑμᾶς
  choice: 我差你们出去
  rationale: “差……出去”保留ἀποστέλλω在差遣执行使命语境中的含义。
- source_word: ἄτερ
  choice: 没有带
  rationale: 该词表示缺少或不带某物；结合旅行装备清单，译作“没有带”比生硬的“没有”更符合现代汉语。
- source_word: βαλλαντίου
  choice: 钱袋
  rationale: 指装钱的袋子；“钱袋”具体、清楚，也符合当时语境。
- source_word: πήρας
  choice: 行囊
  rationale: 指旅途中携带食物或用品的袋子；“行囊”自然简洁，并保留其旅行用途。
- source_word: ὑποδημάτων
  choice: 鞋
  rationale: ὑπόδημα泛指穿在脚上的鞋类；“鞋”不把词义过度限定为某一种具体样式。
- source_word: μή τινος ὑστερήσατε
  choice: 你们缺过什么吗？
  rationale: 保留疑问句及其预期否定回答的语气；“缺过什么”自然表达过去经历中是否有所匮乏。
- source_word: Οὐθενός
  choice: 什么也不缺
  rationale: 希腊文是极简短的回答，意为“一样也没有缺”；中文补出“缺”可自然承接前问。
theological_decisions: []
