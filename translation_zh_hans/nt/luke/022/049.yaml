  source_fidelity: 正文准确传达了“他身边的人”、看见即将发生之事、对“主”的呼求，以及商议性的“我们是否要……”。但“拿刀砍”容易使“刀”在现代汉语中偏向厨房刀具或一般刀具，也略加强了取刀动作；原文强调的是以μάχαιρα为工具击打。
