  text: ἰδόντες δὲ οἱ περὶ αὐτὸν τὸ ἐσόμενον ⸀εἶπαν· Κύριε, εἰ πατάξομεν ἐν μαχαίρῃ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/049.yaml
  text: And when those around him saw what was about to happen[a], they said, “Lord, shall we strike with the sword?”
translation:
  language: zh_hans
  text: 他身边的人看见将要发生的事，就说：“主啊，我们要用剑[a]砍吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “剑”也可译作“刀”。希腊文μάχαιρα可指剑，或较短的刃器，如短剑或匕首。
    reason: 保留 μάχαιρα 所指兵器形制的词义范围；正文以“剑”反映此处武器语境，脚注说明其他可能。
lexical_decisions:
- source_word: ἰδόντες
  choice: 看见……就
  rationale: 将不定过去时分词按时间关系自然译出，与主句“说”衔接，同时不添加原文没有的因果含义。
- source_word: οἱ περὶ αὐτὸν
  choice: 他身边的人
  rationale: 保留“围绕在他身边的人”这一宽泛表达；上下文虽指门徒或同行者，正文不作过度限定。
- source_word: τὸ ἐσόμενον
  choice: 将要发生的事
  rationale: 准确表达带冠词的将来分词所指的临近事件，也符合现代汉语习惯。
- source_word: εἶπαν
  choice: 说
  rationale: 按 λέγω 的通常含义翻译；引语本身的问号足以表明这是提问，无须改译为“问”。
- source_word: Κύριε
  choice: 主啊
  rationale: 保留 κύριος 作为对耶稣直接称呼的分量；“啊”使汉语呼语自然庄重。
- source_word: εἰ
  choice: ……吗
  rationale: 此处 εἰ 引出商议性问句，现代汉语以句末“吗”自然传达“我们是否要……”的意思。
- source_word: πατάξομεν
  choice: 我们要……砍吗
  rationale: 将来时在此用于商议性提问；“砍”保留 πατάσσω 的击打动作，并与刀具语境自然搭配。
- source_word: ἐν μαχαίρῃ
  choice: 拿刀
  rationale: ἐν 在此表示工具；“拿刀砍”是自然汉语。μάχαιρα 所指兵器的具体形制并不确定，故用脚注保留“剑、短剑或匕首”等可能。
theological_decisions:
- issue: 对耶稣的称呼 κύριος
  choice: 主啊
  alternative: 老师啊／主人啊
  rationale: “主”既符合该词在直接称呼中的庄重语气，也保留其可能具有的更深神学分量，不把它缩减为单纯的社会性尊称。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“他身边的人”避免提前把人物明确限定为“门徒”；“我们要拿刀砍吗”保留原文商议行动的紧迫语气。脚注标记置于“刀”后，与所说明的词直接对应。
