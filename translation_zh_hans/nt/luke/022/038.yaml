  text: οἱ δὲ εἶπαν· Κύριε, ἰδοὺ μάχαιραι ὧδε δύο. ὁ δὲ εἶπεν αὐτοῖς· Ἱκανόν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/038.yaml
  text: And they said[a], “Lord, look, here are two swords.” And he said to them, “It is enough.”
translation:
  language: zh_hans
  text: 他们说：“主啊，请看，这里有两把刀。”耶稣对他们说：“够了。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“到此为止吧。”这句话可能是要结束这场谈话，不一定是说两把刀已经足够。
    reason: 说明Ἱκανόν ἐστιν在语境中可能表示终止讨论，而非必然评价刀的数量；保留原文的解释歧义。
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: 他们说
  rationale: δέ在这里是轻微的叙事连接词；现代汉语无需机械译出“于是”或“但是”，省译能自然承接上文，也不强化原文没有明确表达的转折。
- source_word: Κύριε
  choice: 主啊
  rationale: 保留对耶稣的直接称呼及新约中κύριος常有的称号色彩；“啊”符合现代汉语呼语习惯。
- source_word: ἰδοὺ
  choice: 请看
  rationale: 表达引人注意的指示功能，比“看哪”更现代自然，又不失庄重。
- source_word: μάχαιραι
  choice: 刀
  rationale: μάχαιρα泛指用于作战或防卫的有刃武器，具体形制可为短剑或大刀；译作“刀”避免在中文中误导为特定的长剑形制。
- source_word: ὧδε δύο
  choice: 这里有两把
  rationale: 按现代汉语语序自然表达地点指示与数量，并用量词“把”搭配有柄刃具。
- source_word: Ἱκανόν ἐστιν
  choice: 够了
  rationale: 简洁对应“足够了”，并保留双重可能：既可指两把刀在数量上足够，也可表示谈话到此为止。
theological_decisions:
- issue: 耶稣回答Ἱκανόν ἐστιν的解释歧义
  choice: 够了
  alternative: “这就够了”，或“到此为止吧”
  rationale: 希腊文既可能是对两把刀数量的判断，也可能是终止这场谈话的惯用说法。正文采用可兼容两义的“够了”，不替读者消解其中的神学与叙事张力；脚注说明另一可能。
translation_notes:
  register: 采用自然、简洁而庄重的现代标准汉语。直接引语保留口语感；以“请看”取代较古雅的“看哪”。为使说话者清楚，第二句将希腊文代词ὁ明确译为“耶稣”，属于汉语叙事中的自然显化。
