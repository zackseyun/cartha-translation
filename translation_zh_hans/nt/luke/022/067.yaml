  text: λέγοντες· Εἰ σὺ εἶ ὁ χριστός, εἰπὸν ἡμῖν. εἶπεν δὲ αὐτοῖς· Ἐὰν ὑμῖν εἴπω οὐ μὴ πιστεύσητε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/067.yaml
  text: saying[a], “If you are the Messiah, tell us.” But he said to them, “If I tell you, you will certainly not believe;”
translation:
  language: zh_hans
  text: 他们说：“如果你是弥赛亚[a]，就告诉我们。”他却对他们说：“如果我告诉你们，你们绝不会相信；”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“基督”。
    reason: 提供ὁ χριστός这一称号的传统译法。
lexical_decisions:
- source_word: λέγοντες
  choice: 他们说
  rationale: 现在时分词承接上一节公议会成员对耶稣的质询；汉语以完整分句“他们说”自然衔接上下文，而不必生硬保留分词形式。
- source_word: Εἰ σὺ εἶ
  choice: 如果你是
  rationale: 保留希腊文明确的条件句形式及对“你”的强调，不改写为直接问句“你是不是”。
- source_word: ὁ χριστός
  choice: 弥赛亚
  rationale: 此处是犹太语境中的称号，译作“弥赛亚”能直接表达受膏者及其相关期待；脚注提供传统译名“基督”。
- source_word: εἰπὸν ἡμῖν
  choice: 就告诉我们
  rationale: 以现代汉语自然表达命令语气；“就”与前面的条件句呼应。
- source_word: εἶπεν δὲ αὐτοῖς
  choice: 耶稣却对他们说
  rationale: δέ在此带有轻微转折；用“却”表达其回答与对方要求之间的张力。希腊文主语省略，但上下文明确是耶稣，汉语补出姓名以避免歧义。
- source_word: Ἐὰν ὑμῖν εἴπω
  choice: 即使我告诉你们
  rationale: 形式上为ἐάν加虚拟式的条件结构；在此回应语境中带让步意味，译作“即使”比普通“如果”更自然，并保留其论证张力。
- source_word: οὐ μὴ πιστεύσητε
  choice: 你们也绝不会相信
  rationale: οὐ μή加虚拟式构成强烈否定；“绝不会”清楚传达强调力度，“相信”保留πιστεύω既可指相信其陈述、也可含信从的语义空间。
theological_decisions:
- issue: Χριστός称号的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 审问发生在犹太公议会语境中，“弥赛亚”更直接显明该称号所承载的犹太受膏者期待；以脚注保留教会传统中常见的“基督”，不把二者误作不同身份。
- issue: πιστεύω的所指范围
  choice: 相信
  alternative: 相信我的话
  rationale: 原文没有明说宾语，既可指不相信耶稣的回答，也可能包含不信他本人身份的意味；正文不补入“我的话”，以保留原文的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事用语。“弥赛亚”保留犹太审问语境；“绝不会”传达原文强烈否定。标点末尾保留分号，以显示本句的话语在下一节继续。
