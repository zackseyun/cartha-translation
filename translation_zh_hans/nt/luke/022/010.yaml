  text: ὁ δὲ εἶπεν αὐτοῖς· Ἰδοὺ εἰσελθόντων ὑμῶν εἰς τὴν πόλιν συναντήσει ὑμῖν ἄνθρωπος κεράμιον ὕδατος βαστάζων· ἀκολουθήσατε αὐτῷ εἰς τὴν οἰκίαν ⸂εἰς ἣν⸃ εἰσπορεύεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/010.yaml
  text: And he said to them[a], “Look, when you enter the city, a man carrying a jar of water will meet you[b]. Follow him into the house that he enters.”
translation:
  language: zh_hans
  text: 他对他们说：“看哪，你们进城的时候，会有一个提着一罐水[a]的男人迎面而来。你们要跟着他进他所进入的那所房子。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “罐”也可译作“陶罐”；原文可特指陶制器皿。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: 看哪
  rationale: 用现代汉语中仍庄重自然的提示语，保留原文引人注意的功能。
- source_word: εἰσελθόντων ὑμῶν εἰς τὴν πόλιν
  choice: 你们进城的时候
  rationale: 将属格独立结构按其时间关系自然表达，同时不把时间关系过度限定为“进城以后”。
- source_word: συναντήσει ὑμῖν
  choice: 会有……迎面而来
  rationale: 既表达将来的相遇，也符合此处人物在路上碰见门徒的叙事情境。
- source_word: ἄνθρωπος
  choice: 一个……的人
  rationale: 现代汉语以“一个……的人”自然指称该男子；上下文中的动作足以识别此人，无须生硬重复性别词。
- source_word: κεράμιον ὕδατος
  choice: 一罐水
  rationale: 简洁自然地表达盛水的罐；器皿可能为陶制这一较具体含义留在脚注。
- source_word: βαστάζων
  choice: 拿着
  rationale: 准确表达持续携带的动作，且比“负着”更符合现代口语叙事。
- source_word: ἀκολουθήσατε αὐτῷ
  choice: 你们要跟着他
  rationale: 直接传达不定过去时命令语气，并用现代汉语清楚表达跟随指令。
- source_word: οἰκίαν
  choice: 房子
  rationale: 保留具体建筑物的方向性含义，符合他们要进入其中的语境。
- source_word: εἰς ἣν εἰσπορεύεται
  choice: 他所进去的
  rationale: 自然地修饰“那所房子”，并保留原文进入该房子的方向含义。
