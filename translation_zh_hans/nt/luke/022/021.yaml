  text: πλὴν ἰδοὺ ἡ χεὶρ τοῦ παραδιδόντος με μετ’ ἐμοῦ ἐπὶ τῆς τραπέζης·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/021.yaml
  text: But look, the hand of the one betraying me is with me on the table.
translation:
  language: zh_hans
  text: 不过，看哪，出卖我的人的手正和我一同在桌上。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλὴν
  choice: 可是
  rationale: 表示与前文转折，语气自然，同时保留原文较强的转向。
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留引人注意的命令式语气，采用现代读者仍易理解的庄重表达。
- source_word: τοῦ παραδιδόντος με
  choice: 那出卖我的人
  rationale: 用进行性语境可自然涵盖正在实施或即将实施的交付、背叛行为；在本段中“出卖”准确传达其背叛含义。
- source_word: μετ’ ἐμοῦ ἐπὶ τῆς τραπέζης
  choice: 正同我的手一起放在桌上
  rationale: 原文直译为“与我一同在桌上”。汉语补出第二个“手”，明确同桌之人的手与耶稣的手同时在桌上，不改变所指关系。
theological_decisions:
- issue: 是否明确指出出卖者身份
  choice: 保留为“那出卖我的人”
  alternative: 直接写“犹大”
  rationale: 原文本节没有点名，应保留叙事中的张力与未明说状态。
- issue: παραδίδω 的语义表达
  choice: 出卖
  alternative: 交出／背叛
  rationale: “出卖”在本语境中自然表达将耶稣交给敌对者的背叛行为，同时避免加入原文没有明说的动机细节。
translation_notes:
  register: 采用现代、庄重而口语可懂的普通话。“看哪”保留经文宣告感；其余句法按现代汉语整理，避免生硬照搬希腊语结构。
