id: LUK.22.57
reference: Luke 22:57
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀ἠρνήσατο λέγων· ⸂Οὐκ οἶδα αὐτόν, γύναι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/057.yaml
  text: But he denied it[a], saying, “I do not know him[b], woman.”
translation:
  language: zh_hans
  text: 他却不承认，说：“女人[a]，我不认识他。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “女人”直译希腊文γύναι，是对那名女性的直接称呼；译作“女士”等会使语气更为客气。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠρνήσατο
  choice: 不承认
  rationale: 该动词表示否认或不承认。希腊文没有明说所否认的对象；现代汉语中的“不承认”可以自然地不带宾语，从而保留原文的含蓄，不必补成“不承认这事”或“不认他”。
- source_word: λέγων
  choice: 说
  rationale: 现在分词引出彼得否认时所说的话；译作“说”既自然，也保留了与前一动作的从属联系。
- source_word: Οὐκ οἶδα
  choice: 我不认识
  rationale: οἶδα在这里指认识某人；“不认识”比泛指知识状态的“不知道”更符合汉语表达及上下文。
- source_word: αὐτόν
  choice: 他
  rationale: 该代词指耶稣。直译为“他”，不增补“这个人”等原文没有的成分。
- source_word: γύναι
  choice: 女人
  rationale: 这是对女性说话者的直接称呼。译作“女人”较直接地反映原词，避免用“女士”等礼貌称谓淡化其语气；脚注说明这一表达的性质。
theological_decisions:
- issue: 是否为彼得的否认补出明确宾语
  choice: 保留“不承认”而不补宾语
  alternative: 译作“不承认这事”或“不认他”
  rationale: 希腊文在ἠρνήσατο之后没有宾语。汉语允许“不承认”单独使用，既能让读者从语境理解他是在否认指控，也不把对象明确限定为“这事”或“耶稣本人”。
translation_notes:
  register: 采用现代、简洁而庄重的叙事语言。“不承认”保留原文未明说宾语的特点；引语按自然汉语将称呼语置于句首。“女人”在现代汉语中可能显得生硬，因此用脚注交代其直译性质。
