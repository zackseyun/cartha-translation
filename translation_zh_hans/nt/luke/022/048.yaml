base_translation:
  language: en
  yaml_path: translation/nt/luke/022/048.yaml
  text: But Jesus said to him[a], “Judas, are you betraying the Son of Man with a kiss?”
translation:
  language: zh_hans
  text: 耶稣却对他说：“犹大，你用一个吻出卖人子吗？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “出卖”也可直译为“交出”。
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: 却
  rationale: δέ是较弱的连接词；结合上下文，“却”自然地表现耶稣对犹大行动的回应及轻微转折。
- source_word: εἶπεν αὐτῷ
  choice: 对他说
  rationale: 明确译出与格代词αὐτῷ，同时符合现代汉语表达。
- source_word: Ἰούδα
  choice: 犹大
  rationale: 呼格专名，采用现代中文圣经中通行的译名。
- source_word: φιλήματι
  choice: 用亲吻
  rationale: 工具与格表示手段；“用亲吻”具体保留这一动作，并与“出卖”自然搭配。
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: 人子
  rationale: 保留耶稣在福音书中惯用的自称及其与《但以理书》的互文意义，不将其解释性改写为泛指的人。
- source_word: παραδίδως
  choice: 出卖
  rationale: 此处现在时直陈语气用于带责问意味的疑问句；上下文明确涉及敌意交付，“出卖”自然传达该语境义。“竟”体现责问与震惊，但不改变疑问形式。
theological_decisions:
- issue: τὸν υἱὸν τοῦ ἀνθρώπου的译法
  choice: 人子
  alternative: 那位属人的／人之子
  rationale: “人子”既贴近希腊语结构，也是中文读者熟悉的耶稣自称，并保留其基督论及《但以理书》背景的张力。
- issue: παραδίδως在本语境中的语义
  choice: 出卖
  alternative: 交出
  rationale: “出卖”准确表达犹大以暗号将耶稣交给敌对者的背叛性质；脚注保留较字面的“交出”，避免遮蔽该词更宽的语义范围。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准普通话。“亲吻”比口语化的“亲一口”更合宜，也比“以亲嘴为暗号”少作解释；“竟”传达原句在语境中的责问语气。
