  text: τίς γὰρ μείζων, ὁ ἀνακείμενος ἢ ὁ διακονῶν; οὐχὶ ὁ ἀνακείμενος; ἐγὼ δὲ ⸂ἐν μέσῳ ὑμῶν εἰμι⸃ ὡς ὁ διακονῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/027.yaml
  text: For who is greater[a], the one reclining at the table or the one serving? Is it not the one reclining at the table? But I am among you as one who serves.
translation:
  language: zh_hans
  text: 谁更大呢？是坐席[a]的人，还是服侍的人？不就是坐席的人吗？我却在你们中间，像服侍人的一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 当时人赴宴通常斜倚席间用餐，由侍者在旁服侍；这里的“坐席”指赴席用餐，并非说明现代坐姿。
    reason: cultural_note
lexical_decisions:
- source_word: τίς γὰρ μείζων
  choice: 谁更大呢
  rationale: τίς引出人物之间的比较；μείζων指地位或身份上“更大”。γάρ承接上文、引出解释，中文以语气助词“呢”和上下文衔接自然表达，不生硬直译为“因为”。
- source_word: ὁ ἀνακείμενος
  choice: 坐席的人
  rationale: ἀνάκειμαι在宴席语境中指按当时习俗斜倚用餐。现代汉语“坐席”自然表明赴席用餐者的身份，同时避免把古代姿势误解为普通坐姿；具体文化背景收入脚注。
- source_word: ὁ διακονῶν
  choice: 服侍的人
  rationale: 现在分词表示正在提供服侍的人，与坐席者形成对比。“服侍”贴合宴席场景，也避免将其专门化为教会职分或强化为奴仆身份。
- source_word: οὐχὶ ὁ ἀνακείμενος
  choice: 不就是坐席的人吗
  rationale: οὐχί引导预期肯定回答的反问；此译保留其鲜明而自然的修辞力量。
- source_word: ἐγὼ δὲ
  choice: 然而，我
  rationale: δέ标示社会常规与耶稣自身榜样之间的转折；“然而”以庄重、清楚的现代汉语突出对比。
- source_word: ἐν μέσῳ ὑμῶν εἰμι
  choice: 我在你们中间
  rationale: 按希腊语词序与惯用意义表达耶稣置身门徒群体之中，保留“中间”的空间意象而不显生硬。
- source_word: ὡς ὁ διακονῶν
  choice: 如同服侍的人
  rationale: ὡς表达身份呈现或行动方式上的比较；“如同”保留比较张力，不将分词改成固定名词身份。
theological_decisions:
- issue: 耶稣以服侍语言描述自己
  choice: 然而，我在你们中间，如同服侍的人。
  alternative: 然而，我在你们中间，是服侍你们的。
  rationale: 原文使用διακονῶν的分词形式，而不是“奴仆”一类名词。“如同服侍的人”既保留宴席场景中的行动性，也不额外导入奴仆身份、教会职分或特定教义解释。
- issue: “更大”的含义
  choice: 更大
  alternative: 更尊贵／地位更高
  rationale: μείζων在此显然涉及社会地位，却仍使用宽泛的比较词。保留“更大”可维持原文的开放性，并与上下文关于“为大”的讨论相呼应。
translation_notes:
  register: 采用现代、庄重且口语可懂的表达。反问句保留耶稣论证的节奏；“坐席”兼顾宴席语境与中文自然度，脚注补明古代斜倚用餐的习俗。
