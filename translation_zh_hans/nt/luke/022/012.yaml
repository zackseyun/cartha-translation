  text: And he will show you a large furnished upper room[a]; prepare there.
translation:
  language: zh_hans
  text: 他会指给你们看一间宽大的楼上房间，那里已经布置妥当[a]。你们要在那里预备。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一间已经预备好的宽大楼上房间”，或“一间铺设、陈设已经摆好的宽大楼上房间”。原文没有明确说明具体布置了什么。
    reason: ἐστρωμένον 可指房间已经铺设、安排或陈设妥当；脚注保留其词义范围，避免断定具体陈设。
lexical_decisions:
- source_word: κἀκεῖνος
  choice: 他
  rationale: καί与ἐκεῖνος合成，承接上文并指此前提到的那人；现代汉语用“他”即可自然、明确地回指，句间承接则由语境体现。
- source_word: ὑμῖν δείξει
  choice: 会带你们去看
  rationale: 字面为“会给你们看/指给你们看”。在寻找房间的叙事情境中，“带你们去看”是自然汉语，同时保留其引导并指明房间的含义。
- source_word: ἀνάγαιον μέγα
  choice: 一间宽大的楼上房间
  rationale: ἀνάγαιον指楼上的房间，μέγα描述其规模；“宽大的楼上房间”准确且易懂，不额外限定为客房。
- source_word: ἐστρωμένον
  choice: 里面已经布置好了
  rationale: 该完成时被动分词表示房间处于铺设、陈设妥当的状态，可能包括坐席或宴席所需陈设；“布置好了”保留结果状态，也避免断定具体家具。
- source_word: ἐκεῖ ἑτοιμάσατε
  choice: 你们就在那里预备吧
  rationale: ἐκεῖ明确指定地点，ἑτοιμάσατε是复数命令式；“预备吧”保留命令语气，又符合现代汉语中指示办理事务的自然表达。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“楼上房间”比传统的“楼房”或较生硬的“楼上的一间大屋”更清楚；“布置好了”传达完成时所表示的既成状态，并以脚注保留词义范围。
