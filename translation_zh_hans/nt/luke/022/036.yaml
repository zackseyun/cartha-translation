base_translation:
  language: en
  yaml_path: translation/nt/luke/022/036.yaml
  text: But now[a], let the one who has a money bag take it, and likewise a travel bag[b]; and let the one who does not have one sell his cloak and buy a sword.
translation:
  language: zh_hans
  text: 他对他们说：“但现在，有钱袋的，要带上钱袋，也要带上旅行袋[a]；没有刀[b]的，要卖掉自己的外衣，买一把刀[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “旅行袋”所译的希腊词πήρα，也可译作“行囊”或“背袋”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文直译为“没有的那人”，没有明说缺少的是什么；这里按下文补出“刀”。
    reason: source_ambiguity
  - marker: c
    text: “刀”所译的希腊词μάχαιρα也可指匕首或短剑一类较短的带刃武器。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀλλὰ νῦν
  choice: 但现在
  rationale: 保留ἀλλά与前文形成的强烈转折，也准确表达νῦν的时间意义；现代汉语自然简明。
- source_word: βαλλάντιον
  choice: 钱袋
  rationale: 指装钱的钱囊；“钱袋”比单说“袋子”更明确，也符合现代汉语用法。
- source_word: ἀράτω
  choice: 要带上
  rationale: 此处为命令语气，在出行准备的语境中表示随身拿取、携带；“要带上”兼顾命令力度和汉语自然度。
- source_word: ὁμοίως καὶ πήραν
  choice: 旅行袋也一样
  rationale: πήρα是旅人携带物品的袋子；译作“旅行袋”说明用途，“也一样”保留ὁμοίως的对应关系。
- source_word: ὁ μὴ ἔχων
  choice: 没有刀的
  rationale: 希腊文只说“没有的那人”，宾语省略；根据紧接着“买一把刀”的命令，在正文中补出“刀”，并以脚注保留原文的省略和潜在歧义。
- source_word: τὸ ἱμάτιον αὐτοῦ
  choice: 自己的外衣
  rationale: ἱμάτιον通常指穿在外面的衣物；“外衣”准确且比带有特定样式联想的词更稳妥。
- source_word: μάχαιραν
  choice: 一把刀
  rationale: μάχαιρα可指刀、匕首或短剑等带刃武器。“刀”在现代汉语中范围较宽，不把具体形制说得过死；脚注列出可能的具体含义。
theological_decisions:
- issue: 是否把耶稣吩咐买μάχαιρα的话弱化、强化或改译为纯粹比喻
  choice: 保留直接命令：“买一把刀”
  alternative: 改译为“预备应付危险”或采用其他解释性表达
  rationale: 希腊文使用明确的命令式和具体名词μάχαιρα。译文保留其字面力度及由此产生的神学张力，不在翻译中预先裁定这道命令的最终目的、持续效力或与暴力相关的解释。
- issue: ὁ μὴ ἔχων所省略的宾语为何
  choice: 正文按近接语境补作“刀”，脚注说明原文未明说宾语
  alternative: 理解为没有钱袋、旅行袋，或笼统译作“没有的”
  rationale: 后面的“买一把刀”使“刀”成为最自然的补足，但希腊文本身保留省略，因此以脚注避免把推断伪装成明说。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“但现在”清楚承接前文并形成转折；“要带上”“要卖掉”“买一把”保留命令语气，同时避免文言化。量词“一把”符合现代汉语对刀剑类器物的通常搭配。
