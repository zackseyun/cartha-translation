  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: 就
  rationale: 承接前文并自然推进叙事；在此语境中，“就”表达紧接发生的动作，而不增加原文没有的因果含义。
- source_word: ἐξελθὼν
  choice: 出去以后
  rationale: 不定过去时分词作状语，通常表示先于主要动词发生的动作；“出去以后”在现代汉语中自然清楚。
- source_word: ἔξω
  choice: 出去
  rationale: ἔξω强化向外、在外的空间意义；汉语“出去”已自然包含这一方向，与ἐξελθὼν合并表达可避免生硬重复。
- source_word: ἔκλαυσεν
  choice: 痛哭起来
  rationale: κλαίω意为哭泣、哀哭；结合πικρῶς，“痛哭起来”既庄重自然，也表现动作的发生。
- source_word: πικρῶς
  choice: 痛哭
  rationale: πικρῶς表示极其悲痛的方式。汉语通常以“痛哭”整体表达“悲痛地哭”，比“苦苦地哭”更自然，同时不限定悲痛的具体神学性质。
