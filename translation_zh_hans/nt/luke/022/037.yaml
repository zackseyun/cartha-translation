    text: 或译：“他被列在过犯者中。”参以赛亚书53:12。
    reason: alternative_reading
  - marker: b
    text: 或译：“那关乎我的事正达到终点。”
    reason: lexical_alternative
  revision_rationale: 删除引文中无须在汉语显化的“也”，使引文更忠实自然。将末句改为“正在成就”，在受难及经文应验的语境中准确表达 τέλος ἔχει 的完成义；脚注保留“达到终点”，以维持该短语可能带有的终结意味。脚注a改用“过犯者”作为传统性替代译文，避免“罪犯”的过度收窄。
