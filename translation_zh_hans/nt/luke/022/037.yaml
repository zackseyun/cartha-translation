  text: λέγω γὰρ ὑμῖν ⸀ὅτι τοῦτο τὸ γεγραμμένον δεῖ τελεσθῆναι ἐν ἐμοί, τό· Καὶ μετὰ ἀνόμων ἐλογίσθη· καὶ γὰρ ⸀τὸ περὶ ἐμοῦ τέλος ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/037.yaml
  text: 'For I tell you that this which is written must be fulfilled in me: ‘And he was counted with the lawless.’ For what concerns me has its fulfillment[a][b].'
translation:
  language: zh_hans
  text: 因为我告诉你们，经上所写的这句话必须应验在我身上：‘他被列在不法之人中。’[a] 因为那关乎我的事正在成就。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他被列在过犯者中。”参以赛亚书53:12。
    reason: alternative_reading
  - marker: b
    text: 或译：“那关乎我的事正达到终点。”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: 因为我告诉你们
  rationale: “告诉你们”自然表达 λέγω 加间接宾语的用法；“因为”保留 γάρ 与上文的解释关系。
- source_word: τοῦτο τὸ γεγραμμένον
  choice: 经上所写的这句话
  rationale: 用现代汉语自然表达指示词与完成时被动分词；“经上”表明所引文字的经文性质，但不直接扩写为特定书名。
- source_word: δεῖ τελεσθῆναι ἐν ἐμοί
  choice: 必须应验在我身上
  rationale: “必须”保留 δεῖ 的必然性；在所写预言的语境中，“应验”准确传达 τελεσθῆναι；“在我身上”贴近 ἐν ἐμοί。
- source_word: Καὶ μετὰ ἀνόμων ἐλογίσθη
  choice: 他也被列在不法之人当中
  rationale: “不法之人”较直接对应 ἀνόμων；“被列在……当中”自然表达 ἐλογίσθη 与 μετά 所表示的归列关系。
- source_word: τὸ περὶ ἐμοῦ
  choice: 那关乎我的事
  rationale: 既保留冠词短语的指称性，也符合现代汉语表达。
- source_word: τέλος ἔχει
  choice: 正走向终局
  rationale: 该短语可指达到终点，也可含完成、成就之意；“正走向终局”保留这种张力，避免只解释为终止或应验。
theological_decisions:
- issue: 以赛亚书引文中的 ἀνόμων 如何翻译
  choice: 不法之人
  alternative: 罪犯；过犯之人
  rationale: “不法之人”最直接反映希腊文，也避免仅因传统译法而缩窄词义；较传统的表达收入脚注。
- issue: τέλος ἔχει 的完成或终结含义
  choice: 正走向终局
  alternative: 正在成就；达到终点；得到应验
  rationale: 受难语境容许“终结”与“完成”两方面含义；正文保留这层语义张力，脚注提示其他可能译法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“经上所写的这句话”清楚引出引文；两处“因为”保留原文重复的 γάρ。末句避免将 τέλος ἔχει 单一化为“应验”或“结束”，以维持原文的语义张力。
