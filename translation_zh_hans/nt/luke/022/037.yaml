revisions:
- from: 因为我告诉你们，经上所写的这句话必须应验在我身上：‘他也被列在不法之人当中。’[a] 因为那关乎我的事正走向终局。[b]
  to: 因为我告诉你们，经上所写的这句话必须应验在我身上：‘他被列在不法之人中。’[a] 因为那关乎我的事正在成就。[b]
  rationale: 删除引文中无须在汉语显化的“也”，使引文更忠实自然。将末句改为“正在成就”，在受难及经文应验的语境中准确表达 τέλος ἔχει 的完成义；脚注保留“达到终点”，以维持该短语可能带有的终结意味。脚注a改用“过犯者”作为传统性替代译文，避免“罪犯”的过度收窄。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T03:21:42Z'
review_pass:
  verdict: revise
  source_fidelity: 正文整体忠实于希腊文。需要调整两点：引文开头的“也”无对应的限定性语义，容易在汉语中暗示额外比较；末句“正走向终局”将 τέλος ἔχει 较明确地导向终结/死亡，并增添持续进展的表达。结合上下文，宜译为“正在成就”，同时以脚注保留“达到终点”的可能。
  naturalness: “经上所写的这句话必须应验在我身上”庄重自然。“他被列在不法之人中”比“他也被列在不法之人当中”更简洁自然。末句改为“那关乎我的事正在成就”在现代标准汉语中清楚且避免不必要地限定为“终局”。
  terminology: “应验”恰当对应写成之事的 τελεσθῆναι；“不法之人”可保留为 ἀνόμων 的直接对应。脚注的传统替代译文应使用“过犯者”，而非“罪犯”，因为后者较容易把该词收窄为刑事犯罪者。
  issues:
  - severity: medium
    issue: 引文中的“也”
    rationale: Καί 在此为引文起始处的连接词；汉语“他也被列在……”通常暗示“此外/同样”的比较或附加意义，正文没有必要加入该含义。
  - severity: medium
    issue: 末句“正走向终局”
    rationale: τέλος ἔχει 可指达到完成、成就或终点；“终局”在汉语中偏向结局、毁灭或死亡，且“正走向”比原文现在时的习语更强地描绘过程。上下文中用“正在成就”较好传达完成/应验，同时在脚注保留终点义。
  - severity: low
    issue: 脚注a的“罪犯”替代译文
    rationale: ἀνόμων 的基本意思是“不法的、违法的”，并不专指刑事意义的“罪犯”。传统上与以赛亚书53:12相呼应的“过犯者”更合适。
  revised_text: 因为我告诉你们，经上所写的这句话必须应验在我身上：‘他被列在不法之人中。’[a] 因为那关乎我的事正在成就。[b]
  revised_footnotes:
