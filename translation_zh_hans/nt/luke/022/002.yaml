revisions:
- from: 祭司长和经学家一直在设法怎样杀掉耶稣[a]，因为他们害怕百姓。
  to: 祭司长和文士一直在谋划怎样杀害耶稣[a]，因为他们害怕百姓。
  rationale: 修订“设法怎样杀掉”为“谋划怎样杀害”，使汉语搭配自然，并保留未完成时所示持续谋划和τὸ πῶς所示对方法的筹算。将“经学家”改为“文士”，以更直接对应福音书中γραμματεῖς这一群体称谓；将“杀掉”改为“杀害”，提升叙事语体而不改变其明确的杀人意图。脚注仍提供“处死”这一可行但较正式的替代译法，锚点置于对应的致死动词后。
