review_pass:
  verdict: revise
  source_fidelity: 基本忠实地传达了祭司长和γραμματεῖς持续谋划杀害耶稣、并因惧怕民众而受约束的意思。“百姓”恰当地保留了λαός作为整体民众的范围。
  naturalness: “一直在设法怎样杀掉”在现代汉语中搭配稍显生硬；“一直在谋划怎样杀害”更自然，也更适合本段庄重的叙事语体。
  terminology: “祭司长”准确。“经学家”可指相关学者，但在此处不如“文士”准确对应福音书中具有特定身份的γραμματεῖς；采用“文士”可保留这一传统历史称谓，而不把其职能扩展为泛指的经学研究者。“杀害”比口语色彩较强的“杀掉”更合乎经文语体，且不添加司法程序含义。
  issues:
  - severity: medium
    issue: “一直在设法怎样杀掉”搭配不够自然
    rationale: “设法”通常直接接所要达成的行动；希腊文τὸ πῶς明确表示谋划方法。“一直在谋划怎样杀害耶稣”同时自然表达持续性和“如何”的审议意味。
  - severity: low
    issue: “经学家”未能充分保留γραμματεῖς的特定称谓
    rationale: 该词在福音书叙事中指“文士”这一可辨认的群体。“经学家”虽不必然错误，却较易泛化为从事经学研究的人。
  - severity: low
    issue: “杀掉”语体偏口语
    rationale: “杀害”同样准确表达ἀνέλωσιν的致死意图，且更符合现代庄重书面叙事语体；不暗示正式处决。
  revised_text: 祭司长和文士一直在谋划怎样杀害耶稣[a]，因为他们害怕百姓。
  revised_footnotes:
