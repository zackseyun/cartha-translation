  text: καὶ ἐζήτουν οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς τὸ πῶς ἀνέλωσιν αὐτόν, ἐφοβοῦντο γὰρ τὸν λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/002.yaml
  text: And the chief priests and the scribes were seeking how they might kill him[a], for they were afraid of the people.
translation:
  language: zh_hans
  text: 祭司长和文士一直在谋划怎样杀害耶稣[a]，因为他们害怕百姓。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“怎样把耶稣处死。”
    reason: 词义替代译法；“处死”可表达使其死亡，但可能较“杀害”更易带出正式执行或司法处置的意味。
lexical_decisions:
- source_word: ἐζήτουν
  choice: 一直在设法
  rationale: 未完成时表示过去持续进行的谋划；“一直在设法”既保留持续性，也自然衔接后面的间接问句。
- source_word: ἀρχιερεῖς
  choice: 祭司长
  rationale: 指耶路撒冷圣殿体系中的祭司领袖群体；“祭司长”是现代汉语圣经语境中准确而通行的复数集合称谓。
- source_word: γραμματεῖς
  choice: 经学家
  rationale: 指精通并讲授律法的宗教学者；“经学家”较“文士”更易为现代普通读者直接理解，同时不过度扩展为泛称的法律专家。
- source_word: τὸ πῶς
  choice: 怎样
  rationale: 该结构是“如何、用什么办法”的惯用表达；“怎样”保留了他们正在谋划方式的含义。
- source_word: ἀνέλωσιν
  choice: 杀掉
  rationale: ἀναιρέω在此明确指夺去性命；“杀掉”直接保留敌意与严重性，又不预先限定为正式司法处决。
- source_word: ἐφοβοῦντο
  choice: 害怕
  rationale: 未完成时表达持续的畏惧状态；结合“一直在设法”，汉语中用“害怕”即可自然表达当时持续存在的原因。
- source_word: τὸν λαόν
  choice: 百姓
  rationale: λαός在此指作为整体的民众，而非仅指当场聚集的一群人；“百姓”保留这一集体和公共层面的指向。
theological_decisions:
- issue: ἀνέλωσιν所表达的领袖意图
  choice: 译为“杀掉耶稣”，不淡化其致死意图，也不指定具体司法程序。
  alternative: “处死耶稣”或“除掉耶稣”
  rationale: “处死”可能过早引入正式司法含义，“除掉”则可能弱化这里明确的杀害意图；“杀掉”兼顾准确与自然。
- issue: λαός的指称范围
  choice: 译为“百姓”，指整体民众。
  alternative: “群众”或“人群”
  rationale: “群众／人群”容易使读者只想到现场聚集的人；“百姓”更能保留领袖因公众反应而畏惧的叙事张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“耶稣”补明希腊文代词αὐτόν的所指，避免汉语孤立经节中“他”指代不清；脚注标记[a]已置于正文对应位置。
