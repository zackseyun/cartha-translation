  text: καὶ ἐπάταξεν εἷς τις ἐξ αὐτῶν ⸂τοῦ ἀρχιερέως τὸν δοῦλον⸃ καὶ ἀφεῖλεν ⸂τὸ οὖς αὐτοῦ⸃ τὸ δεξιόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/050.yaml
  text: And one of them struck the high priest’s slave and cut off his right ear[a].
translation:
  language: zh_hans
  text: 他们中有一个人击中了大祭司的奴隶[a]，把他的右耳削掉了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“仆人”。希腊语δοῦλος可按语境指奴隶或仆人。
    reason: 保留δοῦλος在此处社会身份含义上的词义范围，并使注释锚定于对应词语。
lexical_decisions:
- source_word: ἐπάταξεν
  choice: 砍了……一刀
  rationale: πατάσσω表示有力击打；结合下文耳朵被削掉的结果，此处用“砍了……一刀”自然呈现持刃击打的动作，同时不增添原文未明说的兵器名称。
- source_word: εἷς τις ἐξ αὐτῶν
  choice: 他们中有一个人
  rationale: 保留原文的不定性与匿名性；现代汉语表达自然清楚。
- source_word: τοῦ ἀρχιερέως τὸν δοῦλον
  choice: 大祭司的奴仆
  rationale: δοῦλος在这里是具体社会身份，可指受主人支配的奴隶，也可按职分理解为仆人；“奴仆”兼顾身份从属及汉语可读性，脚注列出较常见的替代译法。
- source_word: ἀφεῖλεν
  choice: 削掉了
  rationale: ἀφαιρέω本义为拿掉、除去；在持刃伤及耳朵的语境中，“削掉了”准确而自然地表达动作结果。
- source_word: τὸ οὖς αὐτοῦ τὸ δεξιόν
  choice: 他的右耳
  rationale: 按现代汉语语序准确保留身体部位及右侧这一细节。
theological_decisions:
- issue: δοῦλος的社会身份称谓
  choice: 奴仆
  alternative: 仆人；奴隶
  rationale: 原词可能突出受支配的奴隶身份，也可在此语境泛指家仆。“奴仆”避免把身份完全淡化为一般雇佣服务，同时不把语境能够确定的程度说得过满；以脚注保留替代译法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“砍了……一刀，削掉了……”清楚呈现连续动作；脚注标记置于整句之后。
