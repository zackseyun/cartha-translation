  text: ὁ δὲ εἶπεν αὐτῷ· Κύριε, μετὰ σοῦ ἕτοιμός εἰμι καὶ εἰς φυλακὴν καὶ εἰς θάνατον πορεύεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/033.yaml
  text: But he said to him, “Lord, I am ready to go with you both to prison and to death.”
translation:
  language: zh_hans
  text: 他却对他说：“主啊，我准备好和你一同去坐牢，也一同去死。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ
  choice: 他却
  rationale: 定冠词在这里作代词，承接上文的彼得；δέ带有轻微转折，彼得的自信回应与耶稣先前的话形成对照。
- source_word: εἶπεν αὐτῷ
  choice: 对耶稣说
  rationale: αὐτῷ直译为“对他说”；为使独立经节中的指代清楚，译出语境中明确的对象“耶稣”，并未改变所指。
- source_word: Κύριε
  choice: 主啊
  rationale: 保留κύριος作为对耶稣的尊称及其潜在的基督论分量；呼格用“啊”符合自然、庄重的现代汉语。
- source_word: μετὰ σοῦ
  choice: 和你一起
  rationale: μετά加属格表示陪同，“和你一起”准确而自然。
- source_word: ἕτοιμός εἰμι
  choice: 我已经准备好
  rationale: 表达彼得声称自己已有准备和意愿；“已经”使汉语表达完整自然，也体现其强烈的自信。
- source_word: καὶ ... καὶ
  choice: 也……也……
  rationale: 成对的καί把坐牢与死亡两个去处并列并加以强调，汉语重复“也”可自然保留这种平行。
- source_word: εἰς φυλακὴν
  choice: 去坐牢
  rationale: φυλακή在此指监禁；“坐牢”是现代汉语对进入监禁状态的自然说法，并保留εἰς的趋向意义。
- source_word: εἰς θάνατον
  choice: 去死
  rationale: 表示彼得愿意一路跟随直到死亡；与“去坐牢”形成简洁有力的平行。
- source_word: πορεύεσθαι
  choice: 去
  rationale: 此不定式补足“准备好”，概括与耶稣同行而进入监牢乃至死亡；“去”在本语境中最自然。
theological_decisions:
- issue: κύριος作为对耶稣的称呼
  choice: 主
  alternative: 老师
  rationale: “主”既符合直接称呼中的尊敬语气，也保留该称号可能具有的基督论内涵，而不把它缩减为单纯的师生称谓。
translation_notes:
  register: 采用自然、庄重且普通现代读者易懂的简体中文。用“坐牢”“去死”传达彼得直率而强烈的自我保证；整体保留原文两个εἰς短语的并列推进。
