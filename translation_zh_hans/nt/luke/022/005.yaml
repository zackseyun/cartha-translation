  text: And they rejoiced and agreed to give him money[a].
translation:
  language: zh_hans
  text: 他们很高兴，并同意给他钱[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“银子。”希腊语这个词可以指银，也可以泛指钱财。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐχάρησαν
  choice: 很高兴
  rationale: 这里表示他们因犹大的提议而产生喜悦。“很高兴”是自然、庄重的现代汉语，也保留了原文情绪上的明显强度。
- source_word: συνέθεντο
  choice: 同意
  rationale: 该词在此指达成协议。“同意”简洁自然，不像“应许”那样额外突出承诺意味。
- source_word: αὐτῷ
  choice: 给他
  rationale: 与 δοῦναι 构成自然的汉语双宾语表达，明确他是收受者。
- source_word: ἀργύριον
  choice: 钱
  rationale: 该词本义为“银”，但在交易语境中通常泛指钱财；正文用“钱”最清楚自然，同时以脚注保留字面译法。
- source_word: δοῦναι
  choice: 给
  rationale: 直译该不定式，并与“同意”共同表达协议的内容；不译作“付给”，以免加入原文未明说的交易解释。
theological_decisions: []
translation_notes:
