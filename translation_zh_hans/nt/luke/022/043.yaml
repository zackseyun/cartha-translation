  text: ⸂ὤφθη δὲ αὐτῷ ἄγγελος ⸀ἀπ’ οὐρανοῦ ἐνισχύων αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/043.yaml
  text: Then an angel from heaven appeared to him[a], strengthening him.
translation:
  language: zh_hans
  text: 这时，有一位天使从天上向他显现[a]，加给他力量。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本没有第43—44节。
    reason: textual_variant
lexical_decisions:
- source_word: ὤφθη
  choice: 显现
  rationale: 这是ὁράω的不定过去时被动形式，在此按显现用语理解为“显现”，比机械译作“被看见”更自然，也准确表达天使向耶稣出现。
- source_word: δὲ
  choice: 这时
  rationale: δέ在此推进叙事，并非强调转折；“这时”自然承接前文，又不过度强化严格的时间先后。
- source_word: αὐτῷ
  choice: 向他
  rationale: 与ὤφθη连用的与格表示显现所指向的对象，译为“向他显现”符合现代汉语习惯。
- source_word: ἄγγελος
  choice: 一位天使
  rationale: ἀπ’ οὐρανοῦ明确表明其属天上语境，因此译作“天使”而非泛称“使者”；“一位”也符合汉语对有位格者的自然表达。
- source_word: ἀπ’ οὐρανοῦ
  choice: 从天上
  rationale: 保留其来源意义；“从天上”是自然、清楚的现代汉语表达。
- source_word: ἐνισχύων
  choice: 加添他的力量
  rationale: 该现在分词表达与显现相伴的行动，意为使之强健、加力。“加添他的力量”比“鼓励”更少解释性，并比“加强他”更自然。
- source_word: αὐτόν
  choice: 他
  rationale: 直接宾语指耶稣，按上下文自然译作“他”。
theological_decisions:
- issue: 路加福音22:43的文本地位
  choice: 按照所提供的SBLGNT希腊文本，将本节收入正文。
  alternative: 有些抄本没有第43—44节。
  rationale: 忠实翻译所给原文，同时以脚注说明重要的抄本差异，不在译文中默默解决文本批判问题。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“显现”保留经文语体的尊严；“加添他的力量”清楚表达ἐνισχύων的使动含义，又不把它窄化为心理上的鼓励。脚注标记[a]紧随相关正文。
