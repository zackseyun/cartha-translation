  text: Καὶ οἱ ἄνδρες οἱ συνέχοντες ⸀αὐτὸν ἐνέπαιζον αὐτῷ δέροντες,
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/063.yaml
  text: And the men who were holding him mocked him while beating him,[a]
translation:
  language: zh_hans
  text: 那些扣住耶稣的人，一边打他，一边嘲弄他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “扣住”也可译作“拘押”。
    reason: lexical_alternative
lexical_decisions:
- source_word: συνέχοντες
  choice: 看守
  rationale: 此处分词指把耶稣控制在手中、拘押看管。“看守”符合现代汉语叙事，也不把原文过度限定为正式监禁或单纯按住。
- source_word: ἐνέπαιζον
  choice: 嘲弄
  rationale: ἐμπαίζω表示带有敌意和侮辱意味的讥笑；“嘲弄”简洁、庄重，并适合受难叙事的语境。
- source_word: αὐτῷ
  choice: 他
  rationale: 希腊语以与格标示嘲弄所针对的对象；现代汉语自然表达为“嘲弄他”。
- source_word: δέροντες
  choice: 一边打他
  rationale: δέρω在此指反复施加身体打击，并未明确指鞭打；“打他”保留其宽泛意义，配合“一边……一边……”体现伴随进行的动作。
- source_word: ἄνδρες
  choice: 那些……的人
  rationale: 原文仅称“男人/人”，没有明确说是士兵或卫兵。汉语以“那些……的人”自然指称这群男性，同时避免加入原文未明说的身份。
- source_word: Καὶ
  choice: （不单独译出）
  rationale: καί承接前文推动叙事；独立经节中若硬译“并且”不够自然，汉语可借语序自然体现承接关系。
theological_decisions:
- issue: 虐待耶稣者的身份
  choice: 那些看守耶稣的人
  alternative: 看守耶稣的卫兵
  rationale: 原文使用泛称ἄνδρες，并未明确给出“卫兵”或“士兵”的职业身份，因此正文不作进一步限定。
- issue: συνέχω所表达的拘押方式
  choice: 看守
  alternative: 拘押／按住
  rationale: 语境表明这些人将耶稣控制在押，但原词可侧重扣留、控制或看守；正文采用自然且不过度具体的“看守”，脚注保留“拘押”的可能表达。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“一边打他，一边嘲弄他”自然呈现两个同时进行的动作；保留“人”的泛称，不擅自改称“卫兵”或“士兵”。
