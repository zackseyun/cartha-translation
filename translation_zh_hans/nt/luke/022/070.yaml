  naturalness: “是你们说我是”虽意图逐字对应希腊文，但在现代普通话中句法悬置过强，读起来不够自然。“是你们说我就是”既保留由上文补足身份的省略，也较自然地表达“你们自己所说”的归还式回答。
  terminology: “上帝的儿子”可保留，准确对应 ὁ υἱὸς τοῦ θεοῦ，且在本节问话中维持称号的庄重性。无需把回答扩写为“我就是上帝的儿子”，以免将原文较间接的措辞改成直接断言。
