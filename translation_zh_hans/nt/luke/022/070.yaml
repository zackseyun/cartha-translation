  text: εἶπαν δὲ πάντες· Σὺ οὖν εἶ ὁ υἱὸς τοῦ θεοῦ; ὁ δὲ πρὸς αὐτοὺς ἔφη· Ὑμεῖς λέγετε ὅτι ἐγώ εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/070.yaml
  text: Then they all said[a], “So you are the Son of God?” And he said to them, “You say that I am.”
translation:
  language: zh_hans
  text: 于是，众人都说：“那么，你是上帝的儿子吗？”耶稣对他们说：“是你们说我就是。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可较通顺地译作“是你们说的”或“正如你们所说”。耶稣这句话在语境中是肯定的回答；希腊文更直译地说，“你们说我就是”，所指的身份由上文的问题补足。
    reason: 说明较符合汉语习惯的译法，同时保留原文将此说法归回提问者、且省略表语的回答方式。
lexical_decisions:
- source_word: πάντες
  choice: 众人都
  rationale: 该形容词在此作名词用，指在场的整个群体；“众人都”自然保留了全体参与的强调。
- source_word: οὖν
  choice: 那么
  rationale: 此处表示从前文推导出的结论；问句中的“那么”既自然，也保留其推论意味。
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: 上帝的儿子
  rationale: 这是带定冠词的基督论称号；汉语无需冠词，“上帝的儿子”能自然、庄重地保留其称号性质。
- source_word: ἔφη
  choice: 说
  rationale: 此处用普通的“说”最符合上下文，无须增译为“宣告”或“回答”。
- source_word: Ὑμεῖς
  choice: 是你们
  rationale: 希腊文明确写出复数代词，带有强调；用“是你们”置于句首，保留耶稣把这说法归回提问者的修辞力度。
- source_word: λέγετε
  choice: 说
  rationale: 现在时在此以汉语普通动词“说”表达最自然，也保持话语直接简洁。
- source_word: ὅτι
  choice: （引出“我是”这一话语内容）
  rationale: 此处最自然地引出他们所说的内容。汉语无需另译“that”，借语序即可表达。
- source_word: ἐγώ εἰμι
  choice: 我是
  rationale: 直译希腊文的简短表达，并让被问到的身份由上文补足；不在正文中扩写为“正如你们所说”，以免消除原句的含蓄和张力。
theological_decisions:
- issue: 耶稣的回答应译成明确肯定，还是保留较为间接、含蓄的措辞
  choice: 正文译作“是你们说我是”
  alternative: 可按汉语习惯译作“是你们说的”或“正如你们所说”
  rationale: 这句话在语境中具有肯定回答的作用，但希腊文的实际措辞是“你们说我就是/我是”。正文保留其形式和神学张力，脚注再说明较通顺的理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“是你们说我是”刻意保留原文简短且略带悬置感的句式；虽不如意译流畅，却能避免把耶稣的回答改写成毫无保留的直接自述。脚注标记紧接其所解释的回答。
