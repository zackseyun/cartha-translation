  to: 于是，众人都说：“那么，你是上帝的儿子吗？”耶稣对他们说：“是你们说我就是。”[a]
  rationale: 修订仅改善耶稣回答在现代汉语中的可读性：“我就是”自然承接“你是上帝的儿子吗”的省略表语；句首“是你们”保留原文明确主语 Ὑμεῖς 的强调和修辞归属。脚注相应说明该省略与常见的意译方式，未把回答过度解释为无保留的直接自述。
