  text: Ὑμεῖς δέ ἐστε οἱ διαμεμενηκότες μετ’ ἐμοῦ ἐν τοῖς πειρασμοῖς μου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/028.yaml
  text: But you are the ones who have remained with me in my trials[a].
translation:
  language: zh_hans
  text: 但你们是在我的试炼中一直与我同在的人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“试探”或“考验”。希腊语这个词可指试探、考验或患难；这里很可能是指耶稣所经历的种种艰难。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς
  choice: 你们
  rationale: 复数第二人称代词位于句首，带有强调；汉语借助“你们是……的人”保留这一突出作用。
- source_word: δέ
  choice: 但
  rationale: 承接上文并形成对比，译为“但”最能体现此处的转折语气。
- source_word: οἱ διαμεμενηκότες
  choice: 一直……同在的人
  rationale: 带冠词的完成时主动分词指一个因持续坚守至今而具有特征的群体；“一直”体现持续性，“……的人”体现名词化结构。
- source_word: μετ’ ἐμοῦ
  choice: 与我同在
  rationale: μετά加属格表示陪伴或联合；“与我同在”自然表达门徒陪伴耶稣的含义。
- source_word: ἐν τοῖς πειρασμοῖς μου
  choice: 在我的试炼中
  rationale: πειρασμός可指试探、考验或患难。此处语境主要是耶稣所经历的艰难与敌对；“试炼”同时保留受考验的意味。
theological_decisions:
- issue: πειρασμοῖς用于耶稣时的含义
  choice: 试炼，即耶稣经历的考验与患难
  alternative: 试探
  rationale: 上下文是在称许门徒于耶稣遭遇艰难和敌对时仍与他同在，因此正文采用“试炼”；脚注保留“试探”这一真实的词义可能，不否认耶稣曾受试探。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“一直与我同在的人”既自然，也保留原文完成时分词所表达的持续坚守。
