  text: καθ’ ἡμέραν ὄντος μου μεθ’ ὑμῶν ἐν τῷ ἱερῷ οὐκ ἐξετείνατε τὰς χεῖρας ἐπ’ ἐμέ· ἀλλ’ αὕτη ⸂ἐστὶν ὑμῶν⸃ ἡ ὥρα καὶ ἡ ἐξουσία τοῦ σκότους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/053.yaml
  text: Day after day[a], while I was with you in the temple, you did not lay hands on me. But this is your hour[b], and the authority of darkness.
translation:
  language: zh_hans
  text: 当我天天同你们在圣殿里时，你们并没有伸手捉拿我[a]。但这是你们的时刻，也是黑暗的权柄[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们并没有伸手攻击我。”原文直译为“向我伸出双手”，在这里指采取敌对行动，具体是捉拿耶稣。
    reason: lexical_alternative
  - marker: b
    text: 或译：“黑暗的权势。”
    reason: alternative_reading
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: 天天
  rationale: 这是按日分配的惯用表达，表示每天反复发生；“天天”自然简洁，并保留持续、重复之意。
- source_word: ὄντος μου μεθ’ ὑμῶν
  choice: 我同你们在……的时候
  rationale: 将属格独立结构自然地译为时间从句，保留“当我与你们同在时”的伴随背景。
- source_word: ἐν τῷ ἱερῷ
  choice: 在圣殿里
  rationale: ἱερόν指圣殿整体范围，而非专指内殿；“圣殿里”在现代汉语中清楚自然。
- source_word: οὐκ ἐξετείνατε τὰς χεῖρας ἐπ’ ἐμέ
  choice: 你们并没有伸手捉拿我
  rationale: 保留“伸手攻击或采取敌对行动”的希腊语形象，同时以“捉拿”明确本段逮捕语境。
- source_word: ἀλλ’ αὕτη ἐστὶν ὑμῶν ἡ ὥρα
  choice: 但这是你们的时刻
  rationale: ὥρα在这里指属于他们、容许他们行动的特定时机；“时刻”保留庄重感及超越钟表时间的含义。
- source_word: ἐξουσία
  choice: 掌权
  rationale: ἐξουσία可指权柄、权力或支配权；在“黑暗”的拟人化表达中译作“掌权”，既自然又体现其正在施行的支配力量。
- source_word: τοῦ σκότους
  choice: 黑暗
  rationale: 保留原文的隐喻和拟人色彩，不将其明确改译为撒但或邪恶势力。
theological_decisions:
- issue: 是否把“黑暗掌权”明确解释为撒但的权柄或邪恶的统治
  choice: 保留“黑暗掌权”的隐喻
  alternative: 撒但掌权／邪恶势力掌权
  rationale: 原文只说“黑暗”，并未直接点名撒但；保留原有措辞可维持其属灵含义和解释张力，避免加入经文本身没有明说的对象。
- issue: “你们的时刻”与“黑暗的权柄”之间的关系
  choice: 译作两个并列而彼此关联的表述：“你们的时刻，也是黑暗掌权的时刻”
  alternative: 这是你们的时刻和黑暗的权柄
  rationale: 原文以καί连接两个表语，语法紧凑，含义可能是这个时刻既属于逮捕者，也属于黑暗权势；补出第二个“时刻”使现代汉语通顺，同时脚注保留原文更紧缩的形式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“天天”体现反复发生；“伸手捉拿”兼顾原文形象与逮捕语境；“黑暗掌权”保留拟人化和神学张力。所有脚注标记均置于相关正文之后。
