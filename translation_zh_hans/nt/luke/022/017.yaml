  source_fidelity: 草稿准确保留了“接过／领受一只杯子”“献上感谢”和命令式“拿”的基本动作，也没有将感谢对象明说为上帝。然而，“分着喝”明确加入了“喝”的动作；希腊文διαμερίσατε只吩咐将“这个”在他们中间分配，并未在本节明说饮用。因此应改用不预设具体实施动作的“彼此分用”。
  naturalness: “接过一只杯子”及“献上感谢后，说”自然、庄重。“你们拿这个，彼此分用”是现代汉语中简洁可懂的表达，也比“在彼此之间分着喝”更顺畅且不增添动作。
  terminology: “献上感谢”保持普通叙事用语，未引入后期礼仪术语；“一只杯子”自然地表达原文不定的ποτήριον。保留“这个”，不重复加入“杯子”，对应原文的τοῦτο。
