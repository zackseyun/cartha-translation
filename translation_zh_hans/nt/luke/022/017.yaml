  text: καὶ δεξάμενος ποτήριον εὐχαριστήσας εἶπεν· Λάβετε τοῦτο καὶ διαμερίσατε ⸂εἰς ἑαυτούς⸃·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/017.yaml
  text: And after receiving a cup and giving thanks[a], he said[b], “Take this and divide it among yourselves.”
translation:
  language: zh_hans
  text: 他接过一只杯子，献上感谢后，说：“你们拿这个，彼此分用。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεξάμενος
  choice: 接过
  rationale: 不定过去时中间语态分词表示先于主句动词的动作；“接过”自然地表达从别人手中接到杯的动作与顺序。
- source_word: ποτήριον
  choice: 一个杯
  rationale: 希腊文无冠词；用“一个杯”保留其不特指的语法形式，同时不排除逾越节筵席语境中这是某个特定杯的可能。
- source_word: εὐχαριστήσας
  choice: 献上感谢
  rationale: 表达说话之前的感谢行动，采用普通叙事语言，不把该词直接技术化为后来的礼仪术语。
- source_word: εἶπεν
  choice: 说
  rationale: 原文没有明说间接宾语，因此不增添“对他们”。
- source_word: Λάβετε
  choice: 拿去
  rationale: 在席间传杯的语境中，这是自然的命令表达；既包含拿取动作，也顺畅引出随后彼此分用。
- source_word: τοῦτο
  choice: （由“拿去”承接所指）
  rationale: τοῦτο回指刚提到的杯。中文“你们拿去”已自然承接该宾语，若硬译“拿这个”较生硬；不重复“这个杯”，以免增加原文未重复的名词。
- source_word: διαμερίσατε
  choice: 分着喝
  rationale: 该动词可指分开或分配；杯的席间语境表明是众人分用其中之物。“分着喝”是自然中文，同时在脚注保留“彼此分配”的较形式对应译法。
- source_word: εἰς ἑαυτούς
  choice: 在彼此之间
  rationale: 表达群体内部相互分用的关系，避免“为自己”被误解为各自占有。
theological_decisions:
- issue: 是否采用带有圣餐礼仪色彩的固定措辞来翻译 ποτήριον 和 εὐχαριστήσας
  choice: 采用普通叙事语言：“一个杯”“献上感谢”
  alternative: 译作“那杯”并采用更具礼仪色彩的措辞
  rationale: 原文叙述耶稣席间的行动，但本节本身并未要求后期教会礼仪术语；译文避免预先注入特定圣礼解释。
- issue: διαμερίσατε所指的是分杯、分杯中之物，还是轮流共饮
  choice: 正文用语境化的“分着喝”，脚注列出“彼此分配”
  alternative: 直译为“把这个在你们中间分开／分配”
  rationale: 原文动词本身只表达分开或分配，并未细述具体方式。中文正文按饮杯语境自然表达，但脚注保存词义范围，避免把实施方式绝对化。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“献上感谢”比“祝谢”更便于普通读者理解，也避免不必要的礼仪化；“在彼此之间分着喝”符合现代汉语席间传杯的表达。
