source:
  edition: SBLGNT
  text: καὶ ἀναστὰς ἀπὸ τῆς προσευχῆς ἐλθὼν πρὸς τοὺς μαθητὰς εὗρεν ⸂κοιμωμένους αὐτοὺς⸃ ἀπὸ τῆς λύπης,
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/045.yaml
  text: And after rising from prayer[a], he came to the disciples and found them sleeping from sorrow.
translation:
  language: zh_hans
  text: 他祷告后起来，来到门徒那里，发现他们因忧愁而睡着了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “忧愁”也可译作“悲伤”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς ἀπὸ τῆς προσευχῆς
  choice: 祷告后起来
  rationale: ἀναστὰς是先于主句动作发生的不定过去时分词；“祷告后起来”自然呈现先后次序，也保留ἀπό所表达的离开祷告这一行动的意味。
- source_word: ἐλθὼν πρὸς τοὺς μαθητάς
  choice: 来到门徒那里
  rationale: ἐλθών与πρός表示朝门徒所在之处移动；用并列谓语符合现代汉语叙事习惯，并清楚保留动作次序。
- source_word: μαθητάς
  choice: 门徒
  rationale: “门徒”是福音书语境中μαθητής准确、通行且易懂的译法。
- source_word: εὗρεν
  choice: 发现
  rationale: 此处εὑρίσκω指来到后见到某种情形；“发现”在现代汉语中自然，并保留其认知意味。
- source_word: κοιμωμένους αὐτούς
  choice: 他们……睡着了
  rationale: 现在时分词描写耶稣发现他们时所处的睡眠状态；“睡着了”是自然的现代汉语表达。
- source_word: ἀπὸ τῆς λύπης
  choice: 因忧愁而
  rationale: 此处ἀπό最自然地表示原因；λύπη可指忧愁、悲伤或哀痛。“因忧愁而”明确而不过度解释其心理状态。
theological_decisions:
- issue: 门徒睡着与忧愁之间的关系
  choice: 把忧愁译为睡着的原因：“因忧愁而睡着了”
  alternative: 较弱地理解为他们睡着时心中忧愁，不突出因果关系
  rationale: ἀπὸ τῆς λύπης在此最自然地表达原因，但译文不进一步说明忧愁如何导致睡眠，以保留原文简洁而略显张力的陈述。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以多个顺接动作重现希腊文的叙事次序，避免生硬复制分词结构；代词“他”承接上下文中的耶稣。
