  text: καὶ ἐρεῖτε τῷ οἰκοδεσπότῃ τῆς οἰκίας· Λέγει σοι ὁ διδάσκαλος· Ποῦ ἐστιν τὸ κατάλυμα ὅπου τὸ πάσχα μετὰ τῶν μαθητῶν μου φάγω;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/011.yaml
  text: And you will say to the master of the house[a], ‘The Teacher says to you, “Where is the guest room where I may eat the Passover with my disciples?”’
translation:
  language: zh_hans
  text: 你们要对那家的主人说：“老师对你说：‘我可以和我的门徒一起吃逾越节筵席的客房在哪里？’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἰκοδεσπότῃ τῆς οἰκίας
  choice: 那家的主人
  rationale: οἰκοδεσπότης指一家之主或掌管家宅的人；“那家的主人”符合现代汉语习惯，也保留其权责意味，而不武断限定为房屋产权人。
- source_word: ὁ διδάσκαλος
  choice: 老师
  rationale: διδάσκαλος在此作为耶稣为人所识别的称号；“老师”直接、自然地表达其教导者身份，不引入“主”等原文此处没有使用的称谓。
- source_word: κατάλυμα
  choice: 客房
  rationale: κατάλυμα可指住宿处或接待客人的房间；本节的家庭场景中，“客房”最为贴切，同时不提前加入下一节才说明的“楼上房间”。
- source_word: τὸ πάσχα
  choice: 逾越节筵席
  rationale: πάσχα可指逾越节或逾越节餐；因本句与“吃”连用，译作“逾越节筵席”自然地显明这里所指的节期餐宴。
- source_word: μετὰ τῶν μαθητῶν μου
  choice: 和我的门徒一起
  rationale: μαθητής在福音书中指跟随并受教于耶稣的人；“门徒”保留这种关系和委身含义，“一起”自然表达μετά。
- source_word: φάγω
  choice: 我可以……吃
  rationale: ὅπου之后的虚拟语气表达预期或可进行的行动；“可以……吃”在现代汉语中自然保留这一语气，不把它强化为确定的将来事实。
- source_word: ἐρεῖτε
  choice: 你们要……说
  rationale: 将来时在这里带有指示意味；汉语“要……说”比机械译成“将会说”更自然地传达耶稣的吩咐。
theological_decisions:
- issue: 耶稣以διδάσκαλος自称时的称号译法
  choice: 老师
  alternative: 夫子；主人；那位老师
  rationale: 原文称号的基本意义是教导者。“老师”直接传意，并避免把此处未出现的“主”或支配者含义带入文本；上下文已明确说话者是谁，无须另加指示成分。
- issue: πάσχα在“吃”的语境中所指为何
  choice: 逾越节筵席
  alternative: 逾越节
  rationale: 原词本身可涵盖节期和节期餐宴；这里因动词“吃”而明显侧重餐宴。译文明确这一语境含义，但不进一步加入礼仪细节。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以“那家的主人”“老师”“客房”等普通读者易懂的表达传达原文，并用嵌套引号清楚呈现转述中的直接问话。
