  terminology: “说预言”可对应Προφήτευσον，避免加入“替我们”或“作为先知”等原文未明说的内容。“遮盖起来”保持原词的宽泛性；脚注列出“蒙住他的眼睛”这一合乎上下文的较具体译法。
