  source_fidelity: 原译“蒙住他”在此语境可被理解为遮挡，但现代汉语里“蒙住某人”也常指欺瞒某人，且未充分显出“把……遮盖起来”的动作。改为“把他遮盖起来”更明确对应περικαλύψαντες，同时不在正文限定为蒙眼。其余部分准确体现未完成时的反复询问、嘲弄性的命令，以及“打你的人”的施事焦点。
