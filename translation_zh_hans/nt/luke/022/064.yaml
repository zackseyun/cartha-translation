  text: καὶ περικαλύψαντες ⸂αὐτὸν ἐπηρώτων⸃ λέγοντες· Προφήτευσον, τίς ἐστιν ὁ παίσας σε;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/064.yaml
  text: And after covering him[a], they kept asking, saying, “Prophesy! Who is the one who struck you?”
translation:
  language: zh_hans
  text: 他们把他遮盖起来[a]，不断问他，说：“你说预言吧！打你的是谁？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“蒙住他的眼睛”。
    reason: lexical_alternative
lexical_decisions:
- source_word: περικαλύψαντες
  choice: 蒙住他
  rationale: 该分词表示把人遮盖、蒙住；“蒙住他”保留原文较宽泛的表达，也能在语境中自然暗示视线受阻，而不在正文中明确加入原文未明说的具体方式。
- source_word: ἐπηρώτων
  choice: 不断地问
  rationale: 未完成时可表达持续或反复的动作；“不断地问”体现他们一再戏弄盘问，而非只问一次。
- source_word: λέγοντες
  choice: 问他说
  rationale: 该分词引出所问的内容；“问他说”在现代汉语中自然地衔接持续询问与直接引语。
- source_word: Προφήτευσον
  choice: 你说预言吧！
  rationale: 该命令语带嘲弄；“说预言”直接保留动词的先知性含义，“吧”在此结合语境传达挑衅口吻，而非缓和为普通请求。
- source_word: τίς ἐστιν ὁ παίσας σε
  choice: 打你的是谁？
  rationale: 带冠词的分词指“打你的那个人”；汉语焦点句“打你的是谁”准确、自然，也保留问题所指向的施打者。
theological_decisions:
- issue: 是否在正文中明确说耶稣被蒙住眼睛
  choice: 正文采用较宽泛的“蒙住他”
  alternative: “蒙住他的眼睛”或“蒙住他的双眼”
  rationale: 上下文显然涉及阻挡视线，但希腊语动词本身只表示遮盖或蒙住。正文不额外限定所蒙部位，脚注列出符合语境的具体译法，以保留原文范围及其语境含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不断地问”体现未完成时的反复性；直接引语保留嘲弄性的命令与问句。脚注标记已置于正文对应词语之后。
