base_translation:
  language: en
  yaml_path: translation/nt/luke/022/058.yaml
  text: And after a little while[a], another man, seeing him, said, “You also are one of them.” But Peter said, “Man, I am not.”
translation:
  language: zh_hans
  text: 过了不久，另一个人看见彼得，就说：“你也是他们中的一个。”彼得却说：“你这人，我不是。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可明确译作“我不是他们中的一个”。希腊文只说“我不是”，所否认的内容承接上一句的指认。
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ βραχὺ
  choice: 过了不久
  rationale: 这是表示短暂时间间隔的惯用语；“过了不久”自然简洁，准确表达随后不久之意。
- source_word: ἕτερος
  choice: 另一个人
  rationale: ἕτερος在此指先前指认者之外的另一个人；补出“人”符合现代汉语叙事习惯，又不超出语境。
- source_word: ἰδὼν αὐτὸν
  choice: 看见彼得
  rationale: 希腊文直译为“看见他”；汉语用“彼得”消除连续代词可能造成的指代含混，同时保留分词所表达的伴随背景。
- source_word: Καὶ σὺ ἐξ αὐτῶν εἶ
  choice: 你也是他们一伙的
  rationale: ἐξ αὐτῶν在语境中表示属于或关联于那个群体；“他们一伙的”自然传达带有指认意味的群体归属。
- source_word: Ἄνθρωπε
  choice: 老兄
  rationale: 呼格ἄνθρωπε是对男性的直接称呼。现代汉语若直译“人啊”不自然；“老兄”保留直接、略显急促的口吻，但不必表示熟识。
- source_word: οὐκ εἰμί
  choice: 我不是
  rationale: 原文只有“我不是”，谓语内容由上一句的指认补足；正文保留这一省略，以呈现彼得回答的简短和强硬。
theological_decisions:
- issue: 彼得否认内容的省略
  choice: 正文保留“我不是”
  alternative: 译作“我不是他们一伙的”
  rationale: 希腊文有意省略上一句已经提供的谓语内容。保留省略既忠于句法，也不替原文补足可能带来解释色彩的措辞。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“他们一伙的”符合口头指认场景；“老兄”体现Ἄνθρωπε的男性直接称呼及彼得急促防御的语气。脚注标记置于相关回答之后。
