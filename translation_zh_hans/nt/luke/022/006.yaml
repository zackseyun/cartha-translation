  yaml_path: translation/nt/luke/022/006.yaml
  text: And he agreed[a], and began seeking an opportunity to hand him over to them apart from the crowd.
translation:
  language: zh_hans
  text: 他答应了，便开始寻找机会，在没有群众在场时把耶稣交给他们[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“出卖他。”希腊语动词的基本意思是“交出”或“交付”；用于犹大时，按语境也可译作“出卖”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξωμολόγησεν
  choice: 答应了
  rationale: 结合22:4–5，这是指犹大同意祭司长和圣殿守卫长所提之事，而不是“公开承认”。“答应了”符合现代汉语叙事。
- source_word: ἐζήτει
  choice: 开始寻找
  rationale: 未完成过去时表示持续或起始性的行动；在答应之后“开始寻找”自然呈现叙事推进，同时保留行动延续的意味。
- source_word: εὐκαιρίαν
  choice: 机会
  rationale: 指适合采取行动的有利时机；“机会”简洁自然。
- source_word: τοῦ παραδοῦναι αὐτόν
  choice: 把耶稣交给
  rationale: παραδίδωμι的基本意义是“交出、交付”。这里用“交给”既贴近原文，也不把犹大行为中隐含的“出卖”这一解释直接写入正文。为避免现代汉语代词指向含混，将αὐτόν明确为“耶稣”。
- source_word: ἄτερ ὄχλου
  choice: 避开人群
  rationale: 原意为“没有人群、与人群分开”。“避开人群”在此自然表达他们要趁群众不在场时行动，但其目的性略由语境推得。
- source_word: αὐτοῖς
  choice: 给他们
  rationale: 与“交给”搭配，清楚表明接受者是上文的祭司长和圣殿守卫长。
theological_decisions:
- issue: παραδίδωμι在犹大叙事中的译法
  choice: 交给
  alternative: 出卖
  rationale: “出卖”在语境中成立，也符合传统理解，但“交给”更直接保留该动词的基本意义及受难叙事中多次“交付”的词汇联系，不提前消除其语义张力。
translation_notes:
  register: 采用现代、庄重而通俗的叙事语言。“避开人群”比直译“离开人群”更符合汉语，但仍准确传达人群不在场这一条件。脚注标记置于句末，说明“交给／出卖”的词义选择。
