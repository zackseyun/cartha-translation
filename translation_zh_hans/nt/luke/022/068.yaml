  text: But if I ask[a], you will certainly not answer.
translation:
  language: zh_hans
  text: 但如果我问，你们绝不会回答。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν
  choice: 即使
  rationale: 与本句的否定结论结合，表达一种让步性的条件：“即便我问，结果仍不会改变”。这比孤立的“如果”更自然地传达上下文中的语气，同时不把条件说成事实。
- source_word: δὲ
  choice: 但
  rationale: 承接前文并形成转折，现代汉语用“但”简洁清楚。
- source_word: ἐρωτήσω
  choice: 我问
  rationale: ἐρωτάω在此指提出问题；“问”自然、直接，也不额外加入“盘问”等敌对意味。
- source_word: οὐ μὴ
  choice: 绝不会
  rationale: οὐ μή加虚拟式构成强烈否定；“绝不会”在现代汉语中自然地保留其强调力度。
- source_word: ἀποκριθῆτε
  choice: 你们……回答
  rationale: 该动词虽为被动形式，却按主动意义使用，意为回答或回应；结合“问”，译作“回答”最贴切。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重的现代标准汉语。“即使……也……”使条件与强烈否定的逻辑关系自然清楚；“绝不会”保留原文οὐ μή的 emphatic negation。
