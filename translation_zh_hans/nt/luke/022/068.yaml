review_pass:
  verdict: revise
  source_fidelity: 原文ἐὰν引出一般的将来条件，直译为“如果”即可；草稿的“即使”将条件加强为让步关系，虽在语境上可理解，却不是本句明确表达的语法意义。δὲ的“但”、ἐρωτήσω的“我问”、οὐ μή的强烈否定“绝不会”，以及ἀποκριθῆτε的“回答”，均基本准确。
  naturalness: “但如果我问，你们绝不会回答。”简洁自然，语体庄重，并保留原文直接的条件—结果结构。原草稿“但即使我问，你们也绝不会回答”亦通顺，但“即使……也……”带来原文未明说的让步色彩。
  terminology: 本节没有专门神学术语或专名。“回答”适合此处问答／审讯语境；“绝不会”恰当地传达οὐ μή的强调性否定。
  issues:
  - severity: medium
    issue: “即使”把ἐὰν译成让步条件。
    rationale: ἐὰν加虚拟式在这里是通常的未来条件结构，意为“如果我问”。上下文或可让读者体会耶稣预期对方不答，但译文不宜将这一语用推断语法化为“即使”。
  - severity: low
    issue: “也”依赖“即使”的让步结构。
    rationale: 改用“如果”后，删除“也”可使汉语条件句更直接，并更贴近原文句法。
  revised_text: 但如果我问，你们绝不会回答。
