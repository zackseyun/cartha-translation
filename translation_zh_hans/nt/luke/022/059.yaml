base_translation:
  language: en
  yaml_path: translation/nt/luke/022/059.yaml
  text: And after about one hour had passed[a], another man insisted, saying, “Truly, this man also was with him, for he too is a Galilean.”
translation:
  language: zh_hans
  text: 约过了一小时，另有一人坚称：“这人确实也和他在一起，因为他也是加利利人。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαστάσης ὡσεὶ ὥρας μιᾶς
  choice: 约过了一个小时
  rationale: 以自然的现代汉语表达属格独立结构所表示的时间推移，同时保留ὡσεὶ“约”的不确定性。
- source_word: ἄλλος τις
  choice: 又有一个人
  rationale: 原文表达不定，意为“另一个人/另有人”；汉语“又有一个人”自然承接叙事，且不额外限定说话者性别。
- source_word: διϊσχυρίζετο
  choice: 坚持说
  rationale: 体现该动词强烈断言的语气；未用“不断坚持”过度强化未完成时的持续意味。
- source_word: Ἐπ’ ἀληθείας
  choice: 确实
  rationale: 简洁自然地传达对陈述真实性的强调。
- source_word: οὗτος
  choice: 这个人
  rationale: 保留指向彼得的指示性和带有指认意味的语气。
- source_word: μετ’ αὐτοῦ ἦν
  choice: 跟他在一起
  rationale: 直接表达彼得曾与耶稣同在，不将其进一步解释为门徒或同伴身份。
- source_word: καὶ γὰρ
  choice: 因为他也
  rationale: “因为”保留γάρ的理由关系，“也”保留καί的附加意味。
- source_word: Γαλιλαῖός ἐστιν
  choice: 是加利利人
  rationale: 直接表达其地域身份，并保留说话者据此认定彼得与耶稣有关联的依据。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“确实”置于主语之后更符合普通话口吻，同时保持原文断言的力度。ἄλλος τις按其语法上的不定性译作“一个人”，不根据语境强行标明为男性，因此无需脚注。
