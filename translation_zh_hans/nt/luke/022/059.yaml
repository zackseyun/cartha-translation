  naturalness: “约过了一个小时，又有一个人坚持说”稍显口语化且句法拖沓；“约过了一小时，另有一人坚称”是更自然、简洁的现代汉语叙事表达。“这人”在引语中的指认性也比“这个人”更凝练自然。
