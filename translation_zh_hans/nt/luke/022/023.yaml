  text: καὶ αὐτοὶ ἤρξαντο συζητεῖν πρὸς ἑαυτοὺς τὸ τίς ἄρα εἴη ἐξ αὐτῶν ὁ τοῦτο μέλλων πράσσειν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/023.yaml
  text: And they began to discuss among themselves which one of them might be the one about to do this[a].
translation:
  language: zh_hans
  text: 他们就开始彼此议论，他们中间究竟谁可能是要做这事的人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们中间究竟会是谁要做这事。”上下文表明，“这事”指上一节所说的出卖行为。
    reason: 保留间接疑问句式的另一种自然表达，并说明指示词的上下文所指。
lexical_decisions:
- source_word: ἤρξαντο
  choice: 开始
  rationale: 保留不定过去时配合不定式所表达的起始意义。
- source_word: συζητεῖν πρὸς ἑαυτούς
  choice: 彼此议论
  rationale: 表达门徒在群体内部互相讨论、探问的意思，又不把语气强化为争吵。
- source_word: τὸ τίς ἄρα εἴη ἐξ αὐτῶν
  choice: 他们中间究竟谁可能是
  rationale: “究竟”自然传达ἄρα在疑问中的思量意味；“可能是”保留间接疑问中εἴη的不确定性。
- source_word: ὁ τοῦτο μέλλων πράσσειν
  choice: 要做这事的人
  rationale: “要”自然表达μέλλω的将近或预期意味；“做这事”保留原文宽泛的指代，不在正文中明说背叛。
theological_decisions:
- issue: 是否在正文中明确“这事”就是背叛
  choice: 保留“做这事”
  alternative: 译作“要出卖他”
  rationale: 本节原文使用τοῦτο μέλλων πράσσειν，并未再次明说“出卖”；上下文已清楚交代其所指，因此不把解释写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“彼此议论”比“互相争辩”中性；“究竟谁可能是”保留门徒猜疑和思量中的不确定性。
