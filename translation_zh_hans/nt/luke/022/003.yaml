  text: Εἰσῆλθεν δὲ Σατανᾶς εἰς Ἰούδαν τὸν ⸀καλούμενον Ἰσκαριώτην, ὄντα ἐκ τοῦ ἀριθμοῦ τῶν δώδεκα·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/003.yaml
  text: Then Satan entered into Judas[a], the one called Iscariot[c][b], who was of the number of the twelve.
translation:
  language: zh_hans
  text: 这时，撒但进入了那称为加略人的犹大；他是十二人中的一个。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“他属于十二人的数目。”
    reason: 说明ἐκ τοῦ ἀριθμοῦ τῶν δώδεκα的字面结构；正文采用更自然的现代中文表达。
lexical_decisions:
- source_word: Εἰσῆλθεν δὲ
  choice: 这时……进入了
  rationale: δὲ在这里推进叙事，译为“这时”自然地承接上下文；εἰσῆλθεν是不定过去时，表达一次发生的进入行动。
- source_word: Σατανᾶς
  choice: 撒但
  rationale: 采用现代中文圣经语境中通行的专名译法，不将其意译为“敌对者”，以免改变此处作为特定称谓的用法。
- source_word: εἰς Ἰούδαν
  choice: 进入了……犹大
  rationale: 保留介词εἰς所表达的“进入”方向，不弱化为仅仅影响、支配或抓住犹大。
- source_word: τὸν καλούμενον Ἰσκαριώτην
  choice: 那称为加略人的犹大
  rationale: καλούμενον是修饰犹大的分词，表示他被称作“加略人”；此译法既保留辨识作用，也符合自然中文。
- source_word: ὄντα ἐκ τοῦ ἀριθμοῦ τῶν δώδεκα
  choice: 他是十二人中的一个
  rationale: 用现代中文自然表达犹大属于那十二人的群体；脚注补充原文较为字面的“属于十二人的数目”这一结构。
theological_decisions:
- issue: 撒但对犹大的行动性质
  choice: 直译为“撒但进入了……犹大”
  alternative: 撒但影响了犹大／控制了犹大
  rationale: 原文使用εἰσῆλθεν与εἰς明确表达“进入”。译文保留这一强烈说法，但不进一步断定其与鬼附、意志控制或犹大责任之间的教义关系。
- issue: “十二人”的群体含义
  choice: 译为“十二人”，不额外加上“使徒”
  alternative: 十二使徒
  rationale: 原文只有τῶν δώδεκα。上下文表明这是耶稣所拣选的特定群体，但译文不添加本节未明说的身份称号。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“这时”推进叙事；“进入了”保留原文力度；分号呈现后半句对犹大身份的补充说明。中文没有大小写之分，因此不另行处理英文中“the twelve／the Twelve”的区别。
