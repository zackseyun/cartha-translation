  terminology: “争论”恰当传达φιλονεικία在本节中围绕地位的争竞；“地位更高”在此是对μείζων的语境化表达，并非将比较级改为最高级。将δοκεῖ译为“被认为”准确传达其评价义；脚注保留“看来”的词义可能。
