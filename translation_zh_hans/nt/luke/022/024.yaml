base_translation:
  language: en
  yaml_path: translation/nt/luke/022/024.yaml
  text: A dispute also arose among them as to which of them was considered to be greater[a].
translation:
  language: zh_hans
  text: 门徒中间也起了争论：他们当中谁被认为地位更高[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们当中谁看来地位更高。”希腊文动词既可表示“看来”，也可表示“被认为”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο
  choice: 起了
  rationale: 这里表示一种情形开始发生；“起了争论”是现代汉语中自然、简洁的叙事表达。
- source_word: δὲ
  choice: 不单独译出
  rationale: δέ在此主要承接并推进叙事；汉语无需机械加入“现在”或“但是”，可由句流自然体现。
- source_word: καὶ
  choice: 也
  rationale: 保留其添加意味，表明这一争论也是当时发生的事。
- source_word: φιλονεικία
  choice: 争论
  rationale: 该词指带有争胜意味的纷争；“争论”清楚自然，并符合门徒议论地位高低的语境。
- source_word: ἐν αὐτοῖς
  choice: 门徒中间
  rationale: 原文直译为“他们中间”；根据上下文明确所指是门徒，以避免汉语代词指向含混。
- source_word: τὸ τίς αὐτῶν
  choice: 他们当中谁
  rationale: 冠词使间接问句成为争论的内容；用冒号引出，在汉语中比“关于他们当中谁”更自然。
- source_word: δοκεῖ
  choice: 算是
  rationale: δοκέω在这里既可表示“被认为”，也可表示“看来是”。“算是”自然地表达群体中的评价，同时保留一定语义弹性。
- source_word: εἶναι
  choice: 是
  rationale: 作为δοκεῖ的补语，融入“算是”这一汉语结构。
- source_word: μείζων
  choice: 更大的
  rationale: 保留希腊文比较级，不强化为明确的最高级“最大”。这里指地位或重要性上的高低，而非体积。
theological_decisions:
- issue: 门徒之间的地位用语
  choice: 更大的
  alternative: 最大的；更重要的
  rationale: 原文使用比较级μείζων，而非明确的最高级。译作“更大的”保留原文形式及其张力，不将地位比较解释得更具体。
- issue: δοκεῖ所表达的评价或表象
  choice: 算是
  alternative: 被认为是；看来是
  rationale: 原词可指“被认为”或“看来”。正文采用兼具自然度和评价意味的“算是”，并以脚注明示另一种可能，避免把歧义静默消除。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“门徒中间”根据上下文明确代词所指；冒号自然引出争论的具体内容。正文保留比较级“更大的”，脚注说明δοκεῖ的真实词义歧义。
