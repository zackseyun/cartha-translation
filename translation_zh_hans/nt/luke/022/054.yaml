  text: Συλλαβόντες δὲ αὐτὸν ἤγαγον καὶ ⸀εἰσήγαγον εἰς ⸂τὴν οἰκίαν⸃ τοῦ ἀρχιερέως· ὁ δὲ Πέτρος ἠκολούθει μακρόθεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/054.yaml
  text: After arresting him[a], they led him away and brought him into the high priest’s house; but Peter was following at a distance.
translation:
  language: zh_hans
  text: 他们拘捕了他，把他带走，带进大祭司的家中；彼得却远远地[a]跟在后面。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在远处”。传统译法作：“远远跟着”。
    reason: 说明μακρόθεν可用不同的自然中文表达；正文采用副词形式“远远地”，不把距离解释得过于具体。
lexical_decisions:
- source_word: Συλλαβόντες
  choice: 拘捕了
  rationale: 该不定过去时分词表示先于主要动作发生的行动；在此处的看押语境中，译作“拘捕了”比泛指的“抓住了”更准确，也符合现代汉语。
- source_word: ἤγαγον
  choice: 把他带走
  rationale: ἄγω表示带领或带去；“带走”自然地体现他在被拘押后离开原处的移动。
- source_word: εἰσήγαγον
  choice: 带进
  rationale: εἰσάγω明确含有进入某处的方向意义；“带进”简洁保留这一意义，并与前面的“带走”形成连续动作。
- source_word: οἰκίαν
  choice: 住宅
  rationale: 此处指具体建筑和居所。“住宅”比“家”更明确地指地点，又不像“宅邸”那样额外暗示豪华规模。
- source_word: ἀρχιερέως
  choice: 大祭司
  rationale: ἀρχιερεύς在新约语境中通常指“大祭司”，这是准确且通行的现代中文称谓。
- source_word: ἠκολούθει
  choice: 跟在后面
  rationale: 未完成时呈现持续进行的过去动作；结合叙事上下文，“跟在后面”自然表达彼得一路尾随，而不增添对其动机的判断。
- source_word: μακρόθεν
  choice: 远远地
  rationale: 该副词表示空间上的距离。“远远地”是自然、清楚的现代汉语，同时保留原文未精确说明距离的特点。
- source_word: δὲ
  choice: 却
  rationale: 第二个δέ在耶稣被带入住宅与彼得保持距离跟随之间形成轻微对比；“却”自然呈现这一叙事张力。
theological_decisions:
- issue: 彼得在耶稣被捕后与他的关系及跟随方式
  choice: 译作“彼得却远远地跟在后面”
  alternative: “彼得从远处跟着”或“彼得一直远远地跟着”
  rationale: 原文只叙述彼得持续跟随并保持空间距离，没有明说他是出于胆怯、谨慎或隐秘行动。译文保留这一张力，不加入心理或道德评价。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“拘捕”明确法律与看押语境；连续使用“带走，带进”保留原文两个移动动词及其方向层次。脚注标记置于其实际说明的“远远地”之后。
