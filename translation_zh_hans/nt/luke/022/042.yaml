  text: λέγων· Πάτερ, εἰ βούλει ⸀παρένεγκε ⸂τοῦτο τὸ ποτήριον⸃ ἀπ’ ἐμοῦ· πλὴν μὴ τὸ θέλημά μου ἀλλὰ τὸ σὸν ⸀γινέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/042.yaml
  text: saying[a], “Father, if you are willing, take this cup away from me. Nevertheless, not my will[c][b], but yours be done.”
translation:
  language: zh_hans
  text: 说：“父啊，如果你愿意，就把这杯[a]从我这里拿走；然而，不要成就我的旨意，只要成就你的旨意。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “杯”是圣经中的隐喻，指所分得的一份，常特指苦难或审判。
    reason: cross_reference
lexical_decisions:
- source_word: λέγων
  choice: 说
  rationale: 现在分词引出祷告的内容；中文用“说”自然承接上文，又不必硬译分词形式。
- source_word: Πάτερ
  choice: 父啊
  rationale: 呼格直接称呼上帝；“父啊”庄重、自然，并保留亲密的称谓。
- source_word: εἰ βούλει
  choice: 如果你愿意
  rationale: βούλομαι在此表达意愿；此译保留条件式恳求，不将其改写为能力或许可。
- source_word: παρένεγκε ... ἀπ’ ἐμοῦ
  choice: 把……从我这里拿走
  rationale: 该不定过去时命令式在语境中是请求将杯移离耶稣；此译清楚表达动作及离开的起点。
- source_word: τοῦτο τὸ ποτήριον
  choice: 这杯
  rationale: 保留圣经中“杯”的隐喻及互文意义，不在正文中直接解释为苦难或审判。
- source_word: πλὴν
  choice: 然而
  rationale: 表达恳求与顺服之间强烈的让步转折，现代中文自然且庄重。
- source_word: μὴ τὸ θέλημά μου ἀλλὰ τὸ σὸν
  choice: 不要成就我的旨意，而要成就你的旨意
  rationale: 希腊文是“我的旨意……你的（旨意）”的名词性对比；中文补出第二个“旨意”，并让后面的命令式同时支配两项，关系清楚。
- source_word: γινέσθω
  choice: 成就
  rationale: 第三人称命令式表达愿父的旨意实现；“成就”比单用“成”更符合现代中文祷告语体，也保留‘得以发生、实现’的含义。
theological_decisions:
- issue: 耶稣的意愿与父的旨意之间的关系
  choice: 直译为“不要成就我的旨意，而要成就你的旨意”
  alternative: “不要照我的意思，只要照你的意思”
  rationale: 原文明确区分“我的旨意”与“你的旨意”，同时表达顺服；译文保留这一神学张力，不加入后期教义解释，也不削弱二者的区别。
- issue: “杯”的隐喻意义
  choice: 正文保留“这杯”
  alternative: “这苦难”或“这场磨难”
  rationale: “杯”是具有重要圣经互文意义的隐喻，可指所分得的份，尤其是苦难或审判；直接释义会过早限定原文意象。
- issue: 条件句“如果你愿意”
  choice: 保留真实的条件式表达
  alternative: “你若肯”或解释为“若在你的计划中”
  rationale: 原文以εἰ βούλει表达意愿条件；译文不推断条件的逻辑类别，也不把“愿意”扩展为特定的神学计划概念。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“父啊”保留直接呼告；“然而”凸显转折；避免较古旧的“倘若”“挪去”“成全你的意思”。脚注标记置于本节末尾，正文中的“杯”不作解释性改写。
