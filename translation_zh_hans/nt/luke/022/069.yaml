revisions:
- from: 但从今以后，人子要坐在上帝大能的右边[a]。
  to: 但从现在起，人子要坐在上帝权能的右边。
  rationale: 删除了不忠实地把“上帝的权能”改作“那大能者”的脚注，并相应移除正文锚点。将时间短语微调为更贴近说话当下的“从现在起”，并以“上帝权能”自然、庄重地保留原文的属格结构和登位意象。
  reviewer_model: gpt-5.6-terra
