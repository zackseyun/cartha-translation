  text: ἀπὸ τοῦ νῦν ⸀δὲ ἔσται ὁ υἱὸς τοῦ ἀνθρώπου καθήμενος ἐκ δεξιῶν τῆς δυνάμεως τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/069.yaml
  text: But from now on the Son of Man will be seated at the right hand of the power of God[a].
translation:
  language: zh_hans
  text: 但从现在起，人子要坐在上帝权能的右边。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπὸ τοῦ νῦν
  choice: 从今以后
  rationale: 这是自然的现代汉语时间表达，保留了从当前时刻起向未来延伸的含义。
- source_word: δὲ
  choice: 但
  rationale: 此处表示耶稣回答中的转折，译作“但”能体现上下文的对比意味。
- source_word: ἔσται
  choice: 要
  rationale: 以“要”表达将来的状态，符合现代汉语习惯，也保留原文的前瞻性。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人子
  rationale: 保留耶稣这一固定自称及其与《但以理书》异象的联系，不作解释性改写。
- source_word: καθήμενος
  choice: 坐在
  rationale: 既准确表达坐着的姿态，也能在本语境中自然承载登位掌权的意象。
- source_word: ἐκ δεξιῶν
  choice: 在……的右边
  rationale: 保留圣经中表示尊荣与权柄位置的固定意象，同时使用普通读者易懂的现代汉语。
- source_word: τῆς δυνάμεως
  choice: 大能
  rationale: 译出 δύναμις 的“能力、权能”含义；“大能”语体庄重，并适合这里指向上帝权能的语境。
- source_word: τοῦ θεοῦ
  choice: 上帝的
  rationale: 明确保留属格所指，即这里所说的大能属于上帝，不将原文简化为隐讳称号。
theological_decisions:
- issue: 如何表达人子的升高及其分享神圣权柄的宣告
  choice: 人子要坐在上帝大能的右边
  alternative: 人子要坐在那大能者的右边
  rationale: 正文紧贴希腊文“上帝的大能”，保留人子坐在尊荣与权柄之位的强烈宣告，以及与《诗篇》110篇和《但以理书》7章的呼应；脚注则保留把“大能”理解为对上帝的敬称这一可能性，不在正文中消除该语言张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“人子”保留传统且跨译本稳定的圣经称谓；“坐在……右边”保留原文的登位和权柄意象。脚注标记已在正文中对应出现。
