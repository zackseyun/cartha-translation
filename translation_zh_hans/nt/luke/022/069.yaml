review_pass:
  verdict: revise
  source_fidelity: 正文基本忠实呈现了ἀπὸ τοῦ νῦν的起始时间、未来的登位状态、“人子”称号，以及“在……右边”的尊荣／权柄意象。“从现在起”比“从今以后”更直接对应原文“从此刻起”。“上帝权能”自然表达τῆς δυνάμεως τοῦ θεοῦ，且保留其属格关系。
  naturalness: “但从现在起，人子要坐在上帝权能的右边”在现代标准汉语中庄重、清楚，也保留圣经语体。
  terminology: “人子”是稳定且合适的既有圣经称谓；“上帝”“权能”适合本句的庄重语域。原脚注将“大能者”作为替代译法，却没有保留原文明载的“上帝”（τοῦ θεοῦ），并把“权能”转换为人物称号，不能作为此处安全的词汇替代。
  issues:
  - severity: medium
    issue: 脚注的替代译文“坐在那大能者的右边”不完整反映原文。
    rationale: 希腊文明确有τῆς δυνάμεως τοῦ θεοῦ（“上帝的权能／能力”）。将其改作“那大能者”既省去了“上帝”的明示属格，也把抽象名词“权能”改成了人的称号；英语审校轨迹中的相应脚注亦不应凌驾于希腊原文。应删除该不安全的替代释义及其正文锚点。
  - severity: low
    issue: “从今以后”可微调为“从现在起”。
    rationale: 两者均可译ἀπὸ τοῦ νῦν，但“从现在起”更明确表达以说话当下为起点，避免“从今以后”在现代汉语中偶尔带有“今后某一阶段”的较宽泛感觉。
  revised_text: 但从现在起，人子要坐在上帝权能的右边。
  revised_footnotes: []
