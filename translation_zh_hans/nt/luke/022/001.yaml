  yaml_path: translation/nt/luke/022/001.yaml
  text: The Feast of Unleavened Bread[a], which is called Passover, was drawing near.
translation:
  language: zh_hans
  text: 除酵节[a]——也称逾越节——快到了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 逾越节和除酵节是彼此紧密相连的节期；在犹太人的用法中，两者有时会合称，名称所指的范围也可能重叠。
    reason: cultural_note
lexical_decisions:
- source_word: Ἤγγιζεν
  choice: 快到了
  rationale: 未完成时描写节期正在临近；“快到了”是自然的现代汉语，也保留临近之意。
- source_word: δὲ
  choice: 不另译
  rationale: 此处是轻微的叙事衔接；汉语无需机械加上“现在”或“于是”，省译更自然，也不造成原文没有的时间强调。
- source_word: ἡ ἑορτὴ τῶν ἀζύμων
  choice: 除酵节
  rationale: 这是该犹太节期在现代中文圣经语境中通行且简洁的名称；“除酵”表达不用酵物的节期特征。
- source_word: ἡ λεγομένη
  choice: 就是所谓的
  rationale: 保留分词结构的解释、辨名称功能，同时以自然汉语连接两个节期称谓。
- source_word: Πάσχα
  choice: 逾越节
  rationale: 采用现代中文中通行的犹太节期名称，而不作音译。
theological_decisions:
- issue: “除酵节”与“逾越节”的关系
  choice: 按路加的解释性表述译为“除酵节，就是所谓的逾越节”
  alternative: 将两者严格区分，并在译文中突出不同的日期或礼仪
  rationale: 原文在叙述层面以“所谓的”把两个名称联系起来，反映当时可用重叠名称指称整个节期的用法。译文保留这种表述，不额外调和，也不强加技术性区分。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“快到了”简明呈现未完成时所表达的临近过程；句中保留脚注标记[a]，并用脚注说明两个节期名称的文化背景。
