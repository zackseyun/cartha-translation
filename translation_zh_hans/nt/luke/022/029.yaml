source:
  edition: SBLGNT
  text: κἀγὼ διατίθεμαι ὑμῖν, καθὼς διέθετό μοι ὁ πατήρ μου βασιλείαν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/029.yaml
  text: And I appoint to you, just as my Father appointed to me, a kingdom.
translation:
  language: zh_hans
  text: 我也把国度授予你们[a]，正如我父把国度授予我一样。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “授予”也可译作“立约赐给”。希腊语动词既可带有立约的意味，也可表示安排、处分或授予。
    reason: 保留原文动词可能具有的立约含义，而不在正文中将其定为唯一解释。
  - marker: b
    text: “国度”也可理解为“王权”或“统治权”。原文只在句末出现一次“国度”，同时作前后两个“授予”的宾语；译文为清楚起见重复了一次。
    reason: 说明βασιλεία的语义范围，并交代希腊语共享宾语结构与汉语表达之间的差异。
lexical_decisions:
- source_word: κἀγὼ
  choice: 我也
  rationale: κἀγώ由καί与ἐγώ缩合而成；“我也”既承接上文，也保留第一人称的强调。
- source_word: διατίθεμαι / διέθετό
  choice: 授予 / 授予
  rationale: 该动词可表示安排、立约或将某物授予他人。这里以“国度”为宾语，“授予”在现代汉语中自然地表达赋予权柄或产业，也保留父与子两项行动之间相同动词的对应。
- source_word: ὑμῖν / μοι
  choice: 给你们 / 给我（体现于“授予你们 / 授予我”）
  rationale: 两个与格都表示领受者；汉语用“授予＋人”的结构直接表达。
- source_word: καθὼς
  choice: 正如……一样
  rationale: 清楚标明耶稣的行动与父先前行动之间的对应关系。
- source_word: ὁ πατήρ μου
  choice: 我父
  rationale: “我父”简洁庄重，并保留原文的父子关系；无需补入原文没有的称谓。
- source_word: βασιλείαν
  choice: 国度
  rationale: βασιλεία既可指王权、统治，也可指国度。下文提到席间吃喝和坐在宝座上，因此“国度”能自然涵盖所赐的王权与领域。汉语不强制标示不定冠词，故不译作“一个国度”。
theological_decisions:
- issue: 是否在正文中把διατίθεμαι明确译为立约用语
  choice: 授予
  alternative: 立约赐给
  rationale: 该动词可能带有立约或处分、授予的意味，但本句语法并未明确采用完整的立约公式。“授予”避免把可能的立约含义提升为唯一解释，同时在脚注中保留这一可能性。
- issue: βασιλείαν主要表示国度还是王权
  choice: 国度
  alternative: 王权／统治权
  rationale: 词义本身容许“王权、统治”与“国度”两面；结合下一节的筵席和宝座意象，正文采用较宽广的“国度”，脚注提示另一语义面向。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“授予”较“指定给”自然，也比“赐给”更明确体现正式赋予；前后重复“把国度授予”以避免汉语中句末共享宾语造成理解困难。
source_grounding:
  english_pob_role: consult_only
