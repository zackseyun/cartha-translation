  text: ⸀περιαψάντων δὲ πῦρ ἐν μέσῳ τῆς αὐλῆς καὶ ⸀συγκαθισάντων ἐκάθητο ὁ Πέτρος ⸀μέσος αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/055.yaml
  text: And after they had kindled a fire in the middle of the courtyard and sat down together[a], Peter was sitting among them.
translation:
  language: zh_hans
  text: 众人在院子中央生了火，一同坐下以后，彼得正坐在他们中间。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文的未完成时也可简译为“彼得坐在他们中间”，但译作“彼得正坐在他们中间”更能表现当时持续的情景。
    reason: 时态体貌的翻译选择
lexical_decisions:
- source_word: περιαψάντων
  choice: 生了火
  rationale: 该词为不定过去时主动分词，与主句构成属格独立结构，表示先于彼得当时所处状态的动作；“生了火”是现代汉语中自然、准确的表达。
- source_word: πῦρ
  choice: 火
  rationale: 此处指院子里点起的一堆火；汉语无需添加不定冠词。
- source_word: ἐν μέσῳ τῆς αὐλῆς
  choice: 在院子中央
  rationale: 保留具体的空间位置；αὐλή在本段语境中指大祭司住宅的院子。
- source_word: συγκαθισάντων
  choice: 一同坐下
  rationale: 不定过去时主动分词与περιαψάντων平行；“一同”体现συν-所表达的共同参与。
- source_word: ἐκάθητο
  choice: 正坐着
  rationale: 未完成过去时描写当时持续进行的状态；“正……着”在现代汉语中自然地呈现这一场景性。
- source_word: μέσος αὐτῶν
  choice: 在他们中间
  rationale: 表达彼得身处这群人当中的位置，既贴近原文，也符合现代汉语习惯。
- source_word: δὲ
  choice: 句内顺承，不另译为独立连词
  rationale: δὲ在此轻微推进叙事；汉语通过“……以后”自然体现前后衔接，若硬译“于是”或“而”反显生涩。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“院子中央”“一同坐下”“正坐着”便于普通读者理解，同时保留原文的空间关系和未完成过去时所呈现的持续场景。
