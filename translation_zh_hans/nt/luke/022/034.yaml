  naturalness: “今天鸡还没有叫，你就会……”在现代汉语中基本自然，但“今天公鸡叫以前……”更简洁顺畅，也更清楚地标明三次否认发生在鸡鸣之前。
  terminology: “彼得”“我告诉你”“三次”均恰当。将“鸡”改为“公鸡”能更准确对应ἀλέκτωρ，同时“公鸡叫”仍是自然现代汉语。
