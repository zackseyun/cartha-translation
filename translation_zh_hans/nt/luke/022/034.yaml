  text: ὁ δὲ εἶπεν· Λέγω σοι, Πέτρε, οὐ ⸀φωνήσει σήμερον ἀλέκτωρ ⸀ἕως τρίς ⸂με ἀπαρνήσῃ εἰδέναι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/034.yaml
  text: But he said[a], “I tell you, Peter, a rooster will not crow today until you deny three times that you know me.”
translation:
  language: zh_hans
  text: 耶稣却说：“彼得，我告诉你，今天公鸡叫以前，你会三次否认你认识我。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ εἶπεν
  choice: 耶稣却说
  rationale: δέ在上下文中带轻微转折；中文用“却”自然承接彼得方才的表态。为避免汉语中“他”所指不清，按明确指称原则补出“耶稣”。
- source_word: Λέγω σοι
  choice: 我告诉你
  rationale: 这是直接讲话的常用表达，既自然，又保留λέγω现在时表达的郑重语气。
- source_word: Πέτρε
  choice: 彼得
  rationale: 采用现代中文通行的人名译法。
- source_word: οὐ φωνήσει σήμερον ἀλέκτωρ
  choice: 今天鸡还没有叫
  rationale: ἀλέκτωρ作主语时，φωνέω指鸡鸣；“鸡叫”是现代汉语最自然的说法。“还没有……就……”与后面的ἕως从句组合，清楚表达在鸡鸣之前否认将已发生。
- source_word: ἕως
  choice: 还没有……就……
  rationale: 在主句否定结构中，ἕως标示否定状态持续到的时间界限。中文改用“还没有……就……”更合乎习惯，并保留“鸡叫以前”的时序关系。
- source_word: τρίς
  choice: 三次
  rationale: 直接、自然地表达次数。
- source_word: ἀπαρνήσῃ
  choice: 否认
  rationale: 该词表示否认或不承认；此处与εἰδέναι连用，具体指否认自己认识耶稣。
- source_word: με ἀπαρνήσῃ εἰδέναι
  choice: 否认认识我
  rationale: εἰδέναι明确说明否认的内容是“认识我”。此译法简洁保留该内容，避免泛化成较宽泛的“否认我”。
theological_decisions:
- issue: 彼得将要否认的具体内容
  choice: 三次否认认识耶稣
  alternative: 三次否认耶稣
  rationale: 原文保留εἰδέναι（认识），明确预测的是彼得否认自己认识耶稣；不将其扩大解释为所有意义上的弃绝或背叛。
- issue: 鸡鸣与三次否认的时序表达
  choice: 今天鸡还没有叫，你就会三次否认认识我
  alternative: 今天鸡不会叫，直到你三次否认认识我
  rationale: 两者都可表达否定主句加ἕως的结构。所选译文更符合现代汉语，同时不额外断定三次否认之后鸡必然立刻鸣叫。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“鸡还没有叫……就……”通俗清楚；保留“三次”和“认识我”，忠实呈现预言的次数及具体内容。
