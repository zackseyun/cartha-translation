  to: 耶稣却说：“彼得，我告诉你，今天公鸡叫以前，你会三次否认你认识我。”
  rationale: 修订不改变原文的时序或预言力度：三次否认将在当天公鸡鸣叫以前发生。以“公鸡”对应ἀλέκτωρ，并以“否认你认识我”明确保留εἰδέναι所说明的否认内容。无需保留英文审计轨迹中的替代译法脚注，因为中文译文不存在需要脚注说明的文本或语义歧义。
