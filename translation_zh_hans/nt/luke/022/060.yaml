  text: εἶπεν δὲ ὁ Πέτρος· Ἄνθρωπε, οὐκ οἶδα ὃ λέγεις. καὶ παραχρῆμα ἔτι λαλοῦντος αὐτοῦ ἐφώνησεν ἀλέκτωρ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/060.yaml
  text: But Peter said[a], “Man, I do not know what you are saying.” And immediately, while he was still speaking, a rooster crowed.
translation:
  language: zh_hans
  text: 彼得却说：“朋友，我不知道你在说什么。”彼得还在说话时，一只公鸡[a]立刻啼叫了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“雄鸡”。
    reason: 保留ἀλέκτωρ在汉语中的近义表达；正文“公鸡”是现代普通话中自然、明确的用语。
lexical_decisions:
- source_word: δὲ
  choice: 却
  rationale: 用“却”标明彼得的回答与指认之间的转折，也延续接连否认的叙事张力。
- source_word: Ἄνθρωπε
  choice: 老兄
  rationale: 这是对一名男子的单数呼语；“老兄”在现代汉语中自然、直接，保留原文略显生硬的称呼语气，又不像“先生”那样增添敬意。
- source_word: οὐκ οἶδα
  choice: 我不知道
  rationale: 直接表达οἶδα在此处的现在意义及其否定形式。
- source_word: ὃ λέγεις
  choice: 你在说什么
  rationale: 贴近原文“你所说的”，同时符合现代汉语直接否认时的自然表达，不进一步解释为“你的意思”。
- source_word: παραχρῆμα
  choice: 立刻
  rationale: 准确表达事情毫无延迟地发生，简洁自然。
- source_word: ἔτι λαλοῦντος αὐτοῦ
  choice: 他还在说话
  rationale: 保留属格独立结构所表达的同时性，并突出鸡叫发生时彼得的话尚未说完。
- source_word: ἐφώνησεν ἀλέκτωρ
  choice: 有一只公鸡叫了
  rationale: “公鸡叫了”是现代汉语对该动作的自然说法；加入“有一只”自然表达希腊文不定指的主语。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。彼得的话保持直接和口语感；“老兄”体现男性呼语及其略显唐突的语气。脚注标记紧随其所说明的“公鸡”，而不放在“彼得却说”之后。
