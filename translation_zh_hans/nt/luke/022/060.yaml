- from: 彼得却说：“老兄，我不知道你在说什么。”他还在说话，立刻有一只公鸡[a]叫了。
  to: 彼得却说：“朋友，我不知道你在说什么。”彼得还在说话时，一只公鸡[a]立刻啼叫了。
  rationale: 修订呼语以避免“老兄”的过度口语化和熟人色彩；重组后句以清楚表达“彼得仍在说话时”的时间重叠，并以“啼叫”准确自然地描述公鸡鸣叫。未增添任何神学或解释性含义，脚注锚点仍紧随“公鸡”。
