  terminology: 保留“君王”“辖制”“行使权柄”和带引号的“恩人”均恰当。“恩人”配合文化脚注可表达εὐεργέται作为公共施惠者的荣誉称号，而不暗示耶稣认可该称号。将“外族人”改为“外邦人”，并在脚注保留“列国”这一词汇替代可能。
