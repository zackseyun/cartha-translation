  text: ὁ δὲ εἶπεν αὐτοῖς· Οἱ βασιλεῖς τῶν ἐθνῶν κυριεύουσιν αὐτῶν καὶ οἱ ἐξουσιάζοντες αὐτῶν εὐεργέται καλοῦνται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/025.yaml
  text: But he said to them[a], “The kings of the Gentiles lord it over them[b], and those exercising authority over them are called benefactors.”
translation:
  language: zh_hans
  text: 耶稣却对他们说：“外邦人的君王辖制他们，那些对他们行使权柄的人被称为‘恩人’。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βασιλεῖς
  choice: 君王
  rationale: 该词特指君王，而非泛指任何统治者；“君王”准确且符合庄重语体。
- source_word: τῶν ἐθνῶν
  choice: 外族人
  rationale: 在路加—使徒行传的语境中，该词常指犹太人以外的各族；“外族人”用现代汉语表达这一含义，同时以脚注保留“列国”的可能译法。
- source_word: κυριεύουσιν
  choice: 辖制
  rationale: 该动词表示以主人般的地位管辖、支配；“辖制”保留了这里与门徒群体领导方式形成对比的强烈语气。
- source_word: ἐξουσιάζοντες
  choice: 行使权柄的人
  rationale: 采用动词性表达，保留分词所强调的实际运用权力，而不只表示身居某种职位。
- source_word: εὐεργέται
  choice: 恩人
  rationale: 该词意为施惠者，也可用作统治者或权势赞助人的荣誉称号；正文用易懂的“恩人”，脚注说明其当时的称号性质。
- source_word: καλοῦνται
  choice: 被称为
  rationale: 直接保留原文被动语态，表明这是这些掌权者所得的称号，并不替读者判定他们是否实为恩人。
- source_word: δὲ
  choice: 却
  rationale: “却”自然表现本句与上文门徒争论谁为大的轻微转折。
theological_decisions:
- issue: τῶν ἐθνῶν在本节中的含义
  choice: 外族人
  alternative: 列国
  rationale: 这里很可能指犹太群体以外各族的政治统治方式。“外族人”反映新约中的常见用法，但脚注保留该词也可泛指“列国”的词义空间。
- issue: εὐεργέται是否表达作者认可
  choice: 保留为被称作“恩人”的荣誉称号
  alternative: 译成实际“造福人民的人”
  rationale: 原文只说这些人“被称为”εὐεργέται，并未明确认可或否定这一称号；保留被动表达和引号，可避免消除其中可能带有的张力或反讽。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“辖制”体现κυριεύουσιν的支配意味；“行使权柄”保留ἐξουσιάζοντες的动态含义。引号标明“恩人”在此是称号，同时不替原文消解其可能的反讽。脚注标记均放在各自所解释的词语之后。
