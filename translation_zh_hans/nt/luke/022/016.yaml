  text: λέγω γὰρ ὑμῖν ⸀ὅτι οὐ μὴ φάγω ⸀αὐτὸ ἕως ὅτου πληρωθῇ ἐν τῇ βασιλείᾳ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/016.yaml
  text: For I tell you that I will certainly not eat it until it is fulfilled in the kingdom of God[a][b].
translation:
  language: zh_hans
  text: 因为我告诉你们：我绝不会吃它，直到它在上帝的国里得以成全。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我绝不会再吃它，直到它在上帝的国里得以成全。”“再”是根据上下文补出的；希腊原文以强烈语气否定将来会吃，却没有明说“再”。
    reason: lexical_alternative
  - marker: b
    text: 两个“它”都回指上一节所说的逾越节；可指所吃的逾越节筵席，也可能较广义地指逾越节的庆典或事件。
    reason: cross_reference
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: 因为我告诉你们
  rationale: λέγω与间接受词ὑμῖν构成常见的说话表达；译作“我告诉你们”自然清楚。γάρ承接并解释上一节，因此译为“因为”。
- source_word: ὅτι
  choice: 冒号引出下文
  rationale: ὅτι引出耶稣所说的内容。现代汉语用冒号比硬译为“就是”更自然，同时保留明确的引述结构。
- source_word: οὐ μὴ φάγω
  choice: 我绝不会再吃
  rationale: οὐ μή加不定过去时虚拟语气强烈否定将来的行动；“绝不会”传达其强调语气。“再”由语境隐含，原文没有对应词，故在脚注说明。
- source_word: αὐτό
  choice: 这逾越节的筵席
  rationale: 中性代词αὐτό回指上一节中中性的τὸ πάσχα。汉语若只译“它”，所指不够自然清楚；按语境明确为“这逾越节的筵席”，但以脚注保留其也可指较广义逾越节庆典的可能。
- source_word: ἕως ὅτου
  choice: 直到
  rationale: 该复合表达标明时间界限；“直到”是准确自然的现代汉语。
- source_word: πληρωθῇ
  choice: 得以成全
  rationale: 被动形式表示被成全或达到圆满。“成全”保留πληρόω在救赎历史语境中的丰富含义，而不把具体实现方式说死。
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: 在上帝的国里
  rationale: 保留ἐν的领域表达以及“上帝的国”这一关键用语，不将其窄化为某种特定末世事件。
theological_decisions:
- issue: αὐτό所指为何
  choice: 正文按语境译为“这逾越节的筵席”
  alternative: 较广义地指逾越节的庆典或事件
  rationale: 上一节直接提到耶稣与门徒同吃“这逾越节”。明确所指可避免汉语代词含混，但脚注承认原文代词本身没有进一步限定其范围。
- issue: “在上帝的国里得以成全”的含义
  choice: 保留成全的末世性措辞，不解释其具体实现方式
  alternative: 解释为上帝的国来临时成全，或具体指弥赛亚筵席
  rationale: 经文指向末后的圆满，却没有明说逾越节如何或借何事件成全；译文不应把这种开放性收窄为某一种神学解释。
- issue: 否定句是否包含“再”
  choice: 正文加入语境隐含的“再”，并用脚注说明
  alternative: 直译为“我绝不会吃这逾越节的筵席”
  rationale: 耶稣正在谈论自己盼望吃这一次逾越节；中文加入“再”能自然表达未来不再吃的语用含义。不过希腊文并无“再”的明示词，因此脚注明确这一点。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“绝不会”体现原文强调否定；“得以成全”保留末世性和神学张力。正文将代词所指适度明示，以符合现代汉语表达，并以脚注交代原文形式及可能范围。
