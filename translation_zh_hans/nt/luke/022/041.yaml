  yaml_path: translation/nt/luke/022/041.yaml
  text: And he withdrew from them about a stone’s throw[a], and kneeling down[b], he was praying.
translation:
  language: zh_hans
  text: 他离开他们，走到约一投石之远，便跪下祷告。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“离他们约有一块石头投掷的距离。”
    reason: lexical_alternative
  - marker: b
    text: 原文字面为“放下双膝”，即“跪下”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεσπάσθη
  choice: 离开
  rationale: 该词虽为被动形式，但在此处自然表达耶稣与门徒分开、退到一旁；译作“离开”符合现代汉语，同时不强化原文未必意在表达的外力拉扯。
- source_word: ὡσεὶ λίθου βολήν
  choice: 约有一块石头能扔到的距离
  rationale: 保留原文以投石距离作估量的具体形象，并以“约”传达ὡσεὶ的近似意味。
- source_word: θεὶς τὰ γόνατα
  choice: 跪下
  rationale: 原文字面为“放下双膝”，是表示跪下的惯用说法；现代汉语以“跪下”最自然清楚。
- source_word: προσηύχετο
  choice: 祷告
  rationale: 未完成时描写当时持续进行的祷告；汉语在连贯叙事中无需另加“正在”，也可自然呈现其进行性。
- source_word: αὐτὸς
  choice: 他
  rationale: 原文代词略带强调；汉语单用“他”即可明确承接上下文，若译作“他自己”则容易产生不必要的对比意味。
- source_word: καὶ
  choice: 便
  rationale: 此处连接接续发生的动作；“便”使现代汉语叙事自然流畅，而不增添因果解释。
theological_decisions:
- issue: 祷告姿势与基督论呈现
  choice: 直接叙述耶稣离开门徒、跪下祷告
  alternative: 加入敬虔、顺服或基督论方面的解释性措辞
  rationale: 原文只叙述耶稣的移动、姿势和祷告，不宜在译文中加入经文本身没有明说的教义或灵修阐释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“一块石头能扔到的距离”保留原文的具体意象；“跪下祷告”简洁自然。所有脚注标记均已置于正文相应位置。
