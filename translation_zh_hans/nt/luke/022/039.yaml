  text: Καὶ ἐξελθὼν ἐπορεύθη κατὰ τὸ ἔθος εἰς τὸ Ὄρος τῶν Ἐλαιῶν· ἠκολούθησαν δὲ αὐτῷ καὶ οἱ ⸀μαθηταί.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/039.yaml
  text: And going out[a], he went as was his custom to the Mount of Olives, and the disciples also followed him.
translation:
  language: zh_hans
  text: 耶稣出来，照常往橄榄山去；门徒也跟随他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξελθὼν
  choice: 出来
  rationale: 不定过去时分词表示先于主要动作发生的行动；汉语以连动结构“出来……去”自然表达其叙事先后。
- source_word: ἐπορεύθη
  choice: 往……去
  rationale: πορεύομαι在此表示前往某地；“往……去”符合现代汉语叙事习惯。
- source_word: κατὰ τὸ ἔθος
  choice: 照常
  rationale: 该短语表示依照惯常做法。“照常”简洁自然，也不必补入原文未明说的所有格“他的”。
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: 往橄榄山
  rationale: “橄榄山”是这一地名在现代汉语中的通行译法；介词εἰς所表达的方向由“往”体现。
- source_word: ἠκολούθησαν
  choice: 跟随
  rationale: ἀκολουθέω在此既可描述实际随行，也保留门徒跟从耶稣的关系含义；“跟随”可兼顾两者。
- source_word: οἱ μαθηταί
  choice: 门徒
  rationale: 定冠词所指人物由上下文明确；现代汉语无需另译冠词，也不添加原文未明说的“他的”。
- source_word: καὶ οἱ μαθηταί
  choice: 门徒也
  rationale: καί在门徒前具有附加意味，“也”准确表明门徒同样随行。
theological_decisions:
- issue: 是否把“惯常”明确说成耶稣本人的习惯
  choice: 译作“照常”，不补“按他的习惯”或“像他素常所做的”
  alternative: 照他素常的习惯
  rationale: 上下文确实以耶稣为行动主体，但κατὰ τὸ ἔθος本身没有明示所有格。“照常”在汉语中清楚自然，同时避免不必要地增加明说的信息。
- issue: “跟随”仅指同行还是兼有门徒意义
  choice: 保留“跟随”
  alternative: 跟他一起去／陪同他
  rationale: 上下文首先描述实际移动，但ἀκολουθέω也能唤起门徒跟从耶稣的关系。“跟随”保留这种可能的双重意味，不将其缩减为单纯陪同。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“耶稣”由上文明确补出，以免汉语句首无主语造成含混；分号清楚区分耶稣前往与门徒跟随两个相连动作。
