  text: εἶπεν ⸀δὲ Ἰησοῦς πρὸς τοὺς παραγενομένους ἐπ’ αὐτὸν ἀρχιερεῖς καὶ στρατηγοὺς τοῦ ἱεροῦ καὶ πρεσβυτέρους· Ὡς ἐπὶ λῃστὴν ⸀ἐξήλθατε μετὰ μαχαιρῶν καὶ ξύλων;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/052.yaml
  text: But Jesus said to the chief priests[a], the officers of the temple, and the elders who had come against him, “Have you come out as against a robber, with swords and clubs?”
translation:
  language: zh_hans
  text: 耶稣对那些前来对付他的祭司长、圣殿的守卫官和长老说：“你们带着刀剑和棍棒出来，像是来对付强盗[a]吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“匪徒”。希腊语 λῃστής 可指强盗、武装匪徒，或带有叛乱性质的不法之徒；这里耶稣质问他们为何把他当作危险的罪犯般，带着武器前来。
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: （不单独译出）
  rationale: 此处表示轻微转折或叙事推进；现代汉语直接以“耶稣……说”承接上下文更自然，不损失语义。
- source_word: παραγενομένους ἐπ’ αὐτόν
  choice: 那些来捉他的
  rationale: ἐπί加宾格在逮捕情境中表明行动针对耶稣；“来捉他的”自然呈现敌对来意，又与本节的逮捕语境吻合。
- source_word: ἀρχιερεῖς
  choice: 祭司长
  rationale: 指祭司阶层中的领袖群体；“祭司长”是准确、通行的现代汉语称谓。
- source_word: στρατηγοὺς τοῦ ἱεροῦ
  choice: 圣殿守卫长
  rationale: 指负责圣殿治安的主管人员。“守卫长”比泛称“官长”更清楚地表达其职能，同时保留复数群体含义。
- source_word: πρεσβυτέρους
  choice: 长老
  rationale: 此处指受承认的犹太领袖，并非泛指年长男子。
- source_word: Ὡς ἐπὶ λῃστὴν
  choice: 像是来对付强盗
  rationale: 保留ὡς ἐπί的比较和针对性，也维持耶稣反问的讽刺力度；λῃστής的语义范围另以脚注说明。
- source_word: ἐξήλθατε
  choice: 出来
  rationale: 这里指他们此次出动前来；汉语在反问中用“出来”即可自然表达刚发生的行动。
- source_word: μαχαιρῶν
  choice: 刀剑
  rationale: μάχαιρα可指刀或短剑；“刀剑”在现代汉语中既自然，也避免过度限定具体兵器形制。
- source_word: ξύλων
  choice: 棍棒
  rationale: 字面与木制物有关，此逮捕场景中指作为武器使用的棍棒。
theological_decisions:
- issue: λῃστής所指人物的性质
  choice: 正文译作“强盗”，脚注保留“匪徒、叛乱者一类的不法之徒”的可能性
  alternative: 匪徒；暴徒；叛乱者
  rationale: 该词可涵盖抢劫者、武装匪徒，甚至带叛乱性质的不法之徒。正文采用普通而有力度的“强盗”，但不把政治性含义强加给经文；脚注保留真实的词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“祭司长、圣殿守卫长和长老”清楚区分三类领袖；调整问句语序，使“带着刀剑和棍棒出来”在汉语中自然，并以句末反问突出耶稣的质问。
