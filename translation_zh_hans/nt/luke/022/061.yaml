source:
  edition: SBLGNT
  text: καὶ στραφεὶς ὁ κύριος ἐνέβλεψεν τῷ Πέτρῳ, καὶ ὑπεμνήσθη ὁ Πέτρος τοῦ ⸀λόγου τοῦ κυρίου ὡς εἶπεν αὐτῷ ὅτι Πρὶν ἀλέκτορα φωνῆσαι ⸀σήμερον ἀπαρνήσῃ με τρίς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/061.yaml
  text: And the Lord turned and looked at Peter[a], and Peter remembered the word of the Lord, how he had said to him, “Before a rooster crows today, you will deny me three times.”
translation:
  language: zh_hans
  text: 主转过身，看着彼得[a]；彼得就想起主对他说过的话：“今天鸡叫以前，你会三次不认我。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译：“定睛看着彼得”；希腊语动词可表示直接而专注地看。
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς
  choice: 转过身来
  rationale: 该不定过去时分词表示主先转身、随后看彼得；译为“转过身来”符合现代汉语叙事顺序。
- source_word: ὁ κύριος
  choice: 主
  rationale: 保留此处对耶稣的称号及其基督论分量，不弱化为“老师”或“主人”。
- source_word: ἐνέβλεψεν τῷ Πέτρῳ
  choice: 注视着彼得
  rationale: ἐμβλέπω可指直接、定睛地看；“注视”自然传达这一较强语气，同时不增添目光所表达的具体情感。
- source_word: ὑπεμνήσθη
  choice: 想起
  rationale: 该形式可有“被提醒而想起”的意味；在此语境中，汉语“想起”自然表达彼得忆起主的话，也不必明说是谁使他想起。
- source_word: τοῦ λόγου τοῦ κυρίου
  choice: 主……说过的话
  rationale: λόγος在此指主先前所说的具体话语；结合后面的内容从句，汉语采用“主对他说过的话”清楚自然。
- source_word: ὡς εἶπεν αὐτῷ
  choice: 对他说过的话
  rationale: ὡς在此引出彼得所记起的话语内容；汉语将其整合进引语框架，避免生硬译作“怎样”。
- source_word: Πρὶν ἀλέκτορα φωνῆσαι
  choice: 鸡叫以前
  rationale: πρίν加不定式表示“在……以前”；ἀλέκτωρ无冠词，汉语类称“鸡叫”自然，也无需强加某一只特定的鸡。
- source_word: σήμερον
  choice: 今天
  rationale: 直接保留预言的当日时间指向。
- source_word: ἀπαρνήσῃ με
  choice: 不认我
  rationale: ἀπαρνέομαι在受难叙事中指否认与耶稣的关系；“不认我”比抽象的“否认我”更符合彼得实际所作的否认，也属自然现代汉语。
- source_word: τρίς
  choice: 三次
  rationale: 准确、简洁地表达次数。
theological_decisions:
- issue: κύριος用于耶稣时的译法
  choice: 主
  alternative: 主人
  rationale: “主”既符合新约叙事惯例，又保留该称号可能具有的基督论分量，不把意义缩窄为一般社会关系中的主人。
- issue: 彼得否认耶稣的表述
  choice: 不认我
  alternative: 否认我
  rationale: “不认我”在现代汉语中更具体地表达否认认识或属于耶稣，并未进一步判定其行为的全部神学含义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“注视着”保留原文目光直接、专注的可能语气，但正文不擅自加入责备、怜悯等情感解释。引语按汉语习惯调整语序为“今天鸡叫以前”。
