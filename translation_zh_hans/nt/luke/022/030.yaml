  text: ἵνα ⸀ἔσθητε καὶ πίνητε ἐπὶ τῆς τραπέζης μου ⸂ἐν τῇ βασιλείᾳ μου⸃, καὶ ⸀καθήσεσθε ἐπὶ θρόνων ⸂τὰς δώδεκα φυλὰς κρίνοντες⸃ τοῦ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/030.yaml
  text: so that you may eat and drink at my table in my kingdom[a], and you will sit on thrones judging the twelve tribes of Israel.
translation:
  language: zh_hans
  text: 好叫你们在我的国度里，在我的筵席上吃喝；你们也要坐在宝座上，审判以色列的十二个支派。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “审判以色列的十二个支派”也可译为“治理”或“统管”以色列的十二个支派。
    reason: κρίνω可指司法审判，也可带有施行治理或统管的含义；正文保留较直接的“审判”，不预先限定其角色性质。
lexical_decisions:
- source_word: ἵνα
  choice: 好让
  rationale: 承接上文，表达由先前应许引出的目的或结果；“好让”在现代汉语中自然，并保留目的意味。
- source_word: ἔσθητε καὶ πίνητε
  choice: 吃喝
  rationale: 两个虚拟式同受ἵνα支配；汉语用“好让你们……吃喝”即可自然表达相同的目的和许可意味，无须重复助动词。
- source_word: ἐπὶ τῆς τραπέζης μου
  choice: 在我的席上
  rationale: 按宴席语境译作“在我的席上”，比字面的“在我的桌子上”自然，并保留同席相交的意象。
- source_word: ἐν τῇ βασιλείᾳ μου
  choice: 在我的国里
  rationale: βασιλεία既可指王权、统治，也可指国度；此处宴席与宝座构成场景，译作“国”较自然，同时不排除君王统治的内涵。
- source_word: καθήσεσθε ἐπὶ θρόνων
  choice: 你们也要坐在宝座上
  rationale: 保留将来时与登座的王权、审判意象；“要坐”是清楚自然的现代汉语。
- source_word: κρίνοντες
  choice: 审判
  rationale: κρίνω最直接的词义是作判断、施行审判；在此也可能涵盖治理权，因此正文保留“审判”，另以脚注列出治理类译法。
- source_word: τὰς δώδεκα φυλὰς τοῦ Ἰσραήλ
  choice: 以色列的十二个支派
  rationale: 直接、通顺地保留以色列十二支派的盟约性称谓。
theological_decisions:
- issue: 门徒将来对以色列十二支派所承担之角色的性质
  choice: 正文译作“审判”，不把其范围限定为定罪，也不完全等同于行政统治。
  alternative: 可理解为“治理”或“统管”以色列的十二个支派。
  rationale: κρίνω可带司法判断及施行治理的含义。采用最直接的“审判”，并在脚注保留治理方面的可能性，可避免消解经文的神学张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“席上”体现宴席语境；分号划分同席吃喝与坐宝座审判两个彼此关联的应许。脚注标记置于其所说明的“审判以色列的十二个支派”之后。
