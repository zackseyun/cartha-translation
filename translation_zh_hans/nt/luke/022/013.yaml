  text: ἀπελθόντες δὲ εὗρον καθὼς ⸀εἰρήκει αὐτοῖς, καὶ ἡτοίμασαν τὸ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/013.yaml
  text: So they went and found it just as he had told them[a], and they prepared the Passover.
translation:
  language: zh_hans
  text: 于是，他们去了，发现一切都正如耶稣所告诉他们的；他们就预备了逾越节[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“逾越节筵席”，也可理解为“逾越节羔羊”。希腊词既可泛指逾越节，也可特指逾越节筵席或献祭的羔羊。
    reason: 说明原词πάσχα在本语境中可能具有的不同指称范围。
lexical_decisions:
- source_word: ἀπελθόντες δὲ
  choice: 于是，他们去了
  rationale: 不定过去时分词在此表示先于主句的行动，δέ则承接上文、推进叙事；译为“于是，他们去了”自然呈现事件次序和因果承接。
- source_word: εὗρον
  choice: 所遇见的
  rationale: 原文未明说宾语。译作“所遇见的”既符合现代汉语表达，也避免补入过于具体的“情形”或“事情”。
- source_word: καθὼς εἰρήκει αὐτοῖς
  choice: 正如耶稣所告诉他们的
  rationale: καθώς表示实际情况与先前所说相符；εἰρήκει为过去完成时，指此前已经说过的话。“告诉”在指示语境中自然；明确“耶稣”作为主语，有助于汉语读者辨明所指。
- source_word: ἡτοίμασαν
  choice: 预备了
  rationale: 准确表达“使之准备妥当”的意思，并保留叙事体的简洁庄重。
- source_word: τὸ πάσχα
  choice: 逾越节
  rationale: πάσχα可宽泛指逾越节，也可按语境指逾越节筵席或羔羊。正文采用传统且宽泛的“逾越节”，不在正文中缩窄语义，并以脚注说明。
theological_decisions:
- issue: πάσχα在本节中的指称范围
  choice: 逾越节
  alternative: 逾越节筵席；逾越节羔羊
  rationale: 上下文涉及为吃逾越节筵席作准备，但希腊词本身可涵盖节期、筵席或相关祭牲。正文保留较宽的表达，以免把可能的含义限定为某一礼仪要素。
translation_notes:
  register: 采用现代、简洁而庄重的叙事语言。“于是”承接耶稣先前的吩咐；“所遇见的”保留原文未明说宾语的特点。脚注标记已在正文“逾越节”后标出。
