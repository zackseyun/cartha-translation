  text: καὶ ἀπέστειλεν Πέτρον καὶ Ἰωάννην εἰπών· Πορευθέντες ἑτοιμάσατε ἡμῖν τὸ πάσχα ἵνα φάγωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/008.yaml
  text: And he sent Peter and John[a], saying, “Go and prepare the Passover for us, so that we may eat it.”
translation:
  language: zh_hans
  text: 耶稣差派彼得和约翰，说：“你们去为我们预备逾越节[a]，好让我们可以吃。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“逾越节筵席”。希腊语所用的词也可泛指逾越节；不过本节提到预备和吃，语境指向节筵。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: 差派
  rationale: 表示受命前去执行具体任务；“差派”自然体现 ἀποστέλλω 的派遣意味，又不显得过分正式。为使中文叙事指代清楚，补出主语“耶稣”。
- source_word: εἰπών
  choice: 说
  rationale: 以主句后的“说”自然连接所差派时吩咐的话，准确传达分词与主要动词的伴随关系。
- source_word: Πορευθέντες
  choice: 你们去
  rationale: 该过去时分词在命令语境中具有先行动作或伴随命令的作用；译作“你们去”符合现代汉语口吻。
- source_word: ἑτοιμάσατε
  choice: 预备
  rationale: 准确表达为节期饮食作实际安排与准备；语体庄重而通俗。
- source_word: ἡμῖν
  choice: 为我们
  rationale: 保留受益与格的含义，不额外加入“大家”等原文没有的强调。
- source_word: τὸ πάσχα
  choice: 逾越节
  rationale: πάσχα 可指逾越节整体、逾越节筵席或相关祭牲；正文采用通行称呼“逾越节”，由“预备”和“吃”的语境显示这里侧重可吃的节筵，同时不把词义过早限定为筵席或羔羊。
- source_word: ἵνα φάγωμεν
  choice: 好让我们吃
  rationale: “好让”清楚表达 ἵνα 加虚拟式的目的含义；中文无需另加宾语，前文的“逾越节”已能自然提供所吃之物。
theological_decisions:
- issue: “逾越节”（τὸ πάσχα）的具体所指
  choice: 正文译作“逾越节”，不进一步限定
  alternative: “逾越节筵席”或“逾越节羔羊”
  rationale: 预备并吃的语境强烈指向节筵，但希腊词本身的指称范围较宽。保留“逾越节”可维持原文的词义宽度，脚注说明本节语境。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“于是”承接上文；补出“耶稣”以避免现代汉语中第三人称指代含混。保留“逾越节”的传统通行译名，并以脚注说明其在本节中的较具体含义。
