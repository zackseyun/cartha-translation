  text: Ἦλθεν δὲ ἡ ἡμέρα τῶν ἀζύμων, ⸀ᾗ ἔδει θύεσθαι τὸ πάσχα·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/007.yaml
  text: Then the day of Unleavened Bread came[a], on which the Passover had to be sacrificed.
translation:
  language: zh_hans
  text: 除酵节的日子到了[a]；在这一天，必须宰献逾越节的祭牲。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译可作“逾越节必须被宰献”；“逾越节”在这里可特指逾越节的祭牲，也可理解为逾越节的羊羔。
    reason: 说明τὸ πάσχα在祭祀语境中的转喻用法，并保留可能的具体所指。
lexical_decisions:
- source_word: Ἦλθεν
  choice: 到了
  rationale: ἔρχομαι用于日期来临；“到了”是现代汉语中自然且准确的时间表达。
- source_word: δὲ
  choice: （以语序和分号体现叙事推进）
  rationale: δέ在此主要推进叙事；汉语无需机械译出连接词，前后分句的衔接已自然表达其功能。
- source_word: ἡ ἡμέρα τῶν ἀζύμων
  choice: 除酵节的日子
  rationale: 保留ἡμέρα的单数，并以通行名称“除酵节”表达τῶν ἀζύμων所指的节期。
- source_word: ᾗ
  choice: 在这一天
  rationale: 明确回指前面的“日子”，自然表达关系代词的时间性与指代关系。
- source_word: ἔδει
  choice: 必须
  rationale: 表达未完成时无人称动词所含的既定必要性或礼仪要求；汉语不必另行标示过去时。
- source_word: θύεσθαι
  choice: 宰献
  rationale: θύω在祭祀语境中兼有宰杀和献祭之意；“宰献”同时保留这两个层面，比单说“宰杀”更能体现礼仪性质。
- source_word: τὸ πάσχα
  choice: 逾越节的祭牲
  rationale: 在θύεσθαι的支配下，此处具体指逾越节所宰献的祭牲。“祭牲”不擅自限定为羊，同时保留πάσχα在本语境中的转喻用法；脚注说明较直译的可能。
theological_decisions:
- issue: 祭祀语境中τὸ πάσχα的所指
  choice: 正文译作“逾越节的祭牲”
  alternative: “逾越节”或“逾越节的羊羔”
  rationale: θύεσθαι表明被宰献的是祭牲，而不是节日本身；译作“祭牲”使现代读者明白句义，又不把希腊词本身未明说的动物种类写死。脚注保留原文较宽的表达及另一种具体理解。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“除酵节”和“逾越节”沿用华语圣经传统中的通行名称；“宰献”简洁呈现宰杀与献祭的双重含义。
