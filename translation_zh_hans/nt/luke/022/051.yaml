  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· Ἐᾶτε ἕως τούτου· καὶ ἁψάμενος τοῦ ⸀ὠτίου ἰάσατο αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/051.yaml
  text: But Jesus answered, “Enough of this!” And he touched his ear and healed him.
translation:
  language: zh_hans
  text: 耶稣回答说：“到此为止吧！”他摸着那人的耳朵，治好了他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐᾶτε ἕως τούτου
  choice: 到此为止吧
  rationale: 原短语字面可理解为“容许到这一步/让到这里”，在语境中是制止门徒继续动武。“到此为止吧”自然、简洁，同时保留其命令语气，不把意思过度限定为只针对某一个动作。
- source_word: ὠτίου
  choice: 耳朵
  rationale: 指耳部；本节未重复说明左右或具体部位，因此采用普通而准确的“耳朵”，不从前文擅自补入“右耳”。
- source_word: ἰάσατο
  choice: 治好了
  rationale: 表达实际医治并恢复完好的结果，符合该动词在叙事中的含义。
- source_word: ἀποκριθεὶς δὲ
  choice: 耶稣却说
  rationale: ἀποκρίνομαι在此是叙事性发言公式，不必机械译成“回答”；δὲ在冲突场景中用“却”体现转折。
- source_word: ἁψάμενος
  choice: 摸了摸
  rationale: 表达触碰这一动作，符合现代汉语叙事习惯，也避免生硬的“触摸”。
theological_decisions:
- issue: 耶稣命令Ἐᾶτε ἕως τούτου的所指
  choice: 到此为止吧
  alternative: 由他们吧，就到这个地步
  rationale: 希腊语短句可能被理解为制止门徒，也可能是对拘捕者暂时放手的要求。正文采用最符合紧接着医治行动及整体场景的制止用语，但不增添“刀剑”“暴力”等原文没有明说的对象。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。直接引语简短有力；“随即”用于自然连接触摸与医治，但不增加新的时间跨度。
