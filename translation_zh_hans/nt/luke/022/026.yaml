  naturalness: 原文“要成为像较年轻的”在现代汉语中搭配不够自然，且“较年轻的”缺少中心名词；“像服事人的”也略显悬置。修订为“要变得像较年轻的人一样”及“要像服事别人的人一样”，使句法完整、平行清楚，同时保留γινέσθω的动态意味。
