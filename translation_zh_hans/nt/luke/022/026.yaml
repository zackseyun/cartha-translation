  text: ὑμεῖς δὲ οὐχ οὕτως, ἀλλ’ ὁ μείζων ἐν ὑμῖν ⸀γινέσθω ὡς ὁ νεώτερος, καὶ ὁ ἡγούμενος ὡς ὁ διακονῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/026.yaml
  text: But you are not to be like that[a]. Instead, let the greater among you become like the younger[b], and the one who leads like the one who serves.
translation:
  language: zh_hans
  text: 但你们不可这样[a]；相反，你们中地位较高的，要变得像较年轻的人一样；带领人的，要像服事别人的人一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“但你们却不可如此。”希腊原文在这里语句简省，并把耶稣的门徒与上一节所说追逐地位、辖制人的模式鲜明地区分开来。
    reason: alternative_reading
lexical_decisions:
- source_word: ὑμεῖς δὲ οὐχ οὕτως
  choice: 但你们不可这样
  rationale: 保留ὑμεῖς δὲ所表达的鲜明对比，并按上下文将省略式的οὐχ οὕτως自然译为禁令；“这样”回指上一节所述追逐地位、辖制人的模式。
- source_word: ἀλλ’
  choice: 相反
  rationale: 以自然、明确的转折引出耶稣接下来的正面教导。
- source_word: ὁ μείζων ἐν ὑμῖν
  choice: 你们中较有地位的
  rationale: μείζων是比较级，语境重点在群体中的地位，而非单纯体格、年龄或绝对意义上的“最大”。“较有地位的”在现代汉语中清楚表达其社会关系含义。
- source_word: γινέσθω
  choice: 要成为
  rationale: 保留γίνομαι所含“成为、采取某种姿态”的动态意义，也体现命令语气。
- source_word: ὡς ὁ νεώτερος
  choice: 像较年轻的
  rationale: νεώτερος是比较级，因此不译成“最年轻的”；正文保留年龄表达，其在当时社会中所暗示的较低资历和地位由脚注说明。
- source_word: ὁ ἡγούμενος
  choice: 带领人的
  rationale: 保留分词的行动性，以“带领”表达群体中的领导作用，同时避免加入后期制度化职分或过强的政治统治意味。
- source_word: ὡς ὁ διακονῶν
  choice: 像服事人的
  rationale: διακονῶν指正在为别人服务的人；“服事人的”保留其主动、持续的行动含义，也符合庄重而通俗的现代汉语。
theological_decisions:
- issue: 耶稣对地位与领导方式的教导
  choice: 译为门徒群体中社会地位的反转：地位较高者应取较低者的姿态，带领者应像服事者。
  alternative: 采用更强的制度性措辞，将本节明确限定为教会职分或治理架构。
  rationale: 原文将“较大的”和“带领的”分别同“较年轻的”和“服事的”对照，重点是谦卑服事，而没有明确规定后期教会制度；译文不应削弱这种反转，也不应加入原文未明说的体制含义。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“较有地位的”使μείζων在本语境中的关系性含义清楚可见；“较年轻的”则保留原文比较级和具体意象，并借脚注交代其文化含义。两个平行分句均保留“像……的”结构，以呈现原文的修辞对应。
