  yaml_path: translation/nt/luke/005/038.yaml
  text: But new wine must be put into fresh wineskins[a].
translation:
  language: zh_hans
  text: 但新酒必须装进新酒囊里[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “新酒”和“新酒囊”的“新”在希腊原文中是两个不同的词：形容酒的词（νέος）通常较侧重时间上的新，形容酒囊的词（καινός）通常较侧重新的性质或状态；后者也可译作“崭新的酒囊”。
    reason: 说明原文两个不同形容词的通常侧重点，并提供不超出原文字义的自然译法。
lexical_decisions:
- source_word: ἀλλὰ
  choice: 但
  rationale: 表示与上一节所述错误做法相反的转折；“但”简洁自然。
- source_word: οἶνον νέον
  choice: 新酒
  rationale: νέον直接修饰οἶνον，指新酿、尚在发酵过程中的酒；“新酒”是准确且通行的表达。
- source_word: εἰς
  choice: 装进……里
  rationale: 表示朝容器内部的方向；结合中文动词“装”，译作“装进……里”自然地传达其动态含义。
- source_word: ἀσκοὺς
  choice: 酒囊
  rationale: 指用兽皮制成、用来盛放酒等液体的容器；“酒囊”简明地交代其用途和文化物件。
- source_word: καινοὺς
  choice: 新
  rationale: 在此强调酒囊处于新的、适用的状态。现代汉语中“新酒囊”比“新鲜的酒囊”更自然；两个不同希腊形容词之间的细微差别在脚注中说明。
- source_word: βλητέον
  choice: 必须装进
  rationale: 这是表示必要性或应当如此的动词性形容词；“必须”保留其非人称的必要语气，“装进”符合酒与容器的中文搭配。
theological_decisions:
- issue: 同一句中νέος与καινός的区别
  choice: 正文均用“新”，脚注说明两个希腊词侧重点不同
  alternative: 将καινός译为“新的、完好的”或“新制的”以显明区别
  rationale: 原文刻意使用两个不同形容词：νέος多侧重时间上的新，καινός多侧重性质或状态上的新。然而中文把酒囊称为“新鲜的”不自然，正文用“新酒……新酒囊”最清楚稳妥，并以脚注保存词义差别及其张力。
translation_notes:
  register: 采用现代、简洁、庄重的普通话。“酒囊”比“皮袋”更明确地传达ἀσκός在本语境中的用途；“必须装进”准确表达βλητέον的必要性。
