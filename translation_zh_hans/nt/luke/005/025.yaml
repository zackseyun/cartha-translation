  text: καὶ παραχρῆμα ἀναστὰς ἐνώπιον αὐτῶν, ἄρας ἐφ’ ὃ κατέκειτο, ἀπῆλθεν εἰς τὸν οἶκον αὐτοῦ δοξάζων τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/025.yaml
  text: And immediately he stood up before them[a], picked up what he had been lying on, and went away to his house, glorifying God.
translation:
  language: zh_hans
  text: 他立刻当着众人的面站起来，拿起他刚才躺卧的东西[a]，回家去了，归荣耀给上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“他刚才躺卧的褥子”；原文直译为“他躺在上面的东西”。
    reason: 词义替代与原文形式说明
lexical_decisions:
- source_word: παραχρῆμα
  choice: 立刻
  rationale: 表示毫不耽延，保留路加强调医治即时生效的叙事力度。
- source_word: ἀναστὰς
  choice: 站了起来
  rationale: 将不定过去时分词按汉语叙事习惯处理为连续动作，既自然，也保留动作次序。
- source_word: ἐνώπιον αὐτῶν
  choice: 在众人面前
  rationale: 表达事情公开发生在现场众人面前；“众人”自然承接复数代词所指的在场者。
- source_word: ἄρας
  choice: 拿起
  rationale: 在此指把所躺卧之物提起并带走；“拿起”简洁自然。
- source_word: ἐφ’ ὃ κατέκειτο
  choice: 自己一直躺卧的东西
  rationale: 希腊文直译为“他躺在上面的东西”，本节没有明说是褥子或床；此译保留其概括表达，并以“一直”体现未完成时所描绘的先前持续状态。
- source_word: ἀπῆλθεν εἰς τὸν οἶκον αὐτοῦ
  choice: 回家去了
  rationale: 结合方向短语，现代汉语用“回家去了”自然表达他离开现场、往自己的家去。
- source_word: δοξάζων τὸν θεόν
  choice: 一路荣耀上帝
  rationale: 保留 δοξάζω 向上帝归荣耀的广义，不将其限缩为口头赞美；“一路”自然体现伴随主要动作持续进行。
theological_decisions:
- issue: 是否在正文中明确他拿的是“褥子”或“床”
  choice: 正文保留概括说法“自己一直躺卧的东西”
  alternative: “自己一直躺卧的褥子”或“自己一直躺卧的床”
  rationale: 本节原文使用关系表达，并未出现“床”或“褥子”的名词。正文不增添具体类别，脚注则提供符合上下文的自然理解。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“躺卧”比“躺着”略显庄重，但仍属普通现代汉语；“荣耀上帝”保留经文的神学用语。
