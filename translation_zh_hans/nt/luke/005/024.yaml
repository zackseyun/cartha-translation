  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἵνα δὲ εἰδῆτε ὅτι ⸂ὁ υἱὸς τοῦ ἀνθρώπου ἐξουσίαν ἔχει⸃ ἐπὶ τῆς γῆς ἀφιέναι ἁμαρτίας— εἶπεν τῷ παραλελυμένῳ· Σοὶ λέγω, ⸀ἔγειρε καὶ ἄρας τὸ κλινίδιόν σου πορεύου εἰς τὸν οἶκόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/024.yaml
  text: But so that you may know that the Son of Man has authority on earth to forgive sins—he said to the paralyzed man[a], “I say to you, rise, pick up your mat[b], and go to your house.”
translation:
  language: zh_hans
  text: 但为了让你们知道，人子在地上有赦罪的权柄——他对那瘫痪的人说：“我对你说，起来，拿起你的小床[a]，回家去吧！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “小床”也可译作“卧榻”或“铺垫”；希腊词指可搬动的小型卧具。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα δὲ εἰδῆτε
  choice: 但要让你们知道
  rationale: δὲ承接并略带转折，ἵνα引出目的；这一译法自然保留“为要使你们知道”的论证作用。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人子
  rationale: 保留耶稣这一自称及其与《但以理书》7章的互文回响，不将其解释性改写。
- source_word: ἐξουσίαν ἔχει
  choice: 有……的权柄
  rationale: ἐξουσία侧重正当的权限和权利，不只是施展能力；“权柄”符合争论赦罪资格的语境。
- source_word: ἐπὶ τῆς γῆς
  choice: 在地上
  rationale: 按其地点意义直接翻译，不扩写为特定神学解释。
- source_word: ἀφιέναι ἁμαρτίας
  choice: 赦罪
  rationale: ἀφίημι在此指赦免、免除罪；“赦罪”简洁清楚，也与上下文一致。
- source_word: τῷ παραλελυμένῳ
  choice: 那瘫痪的人
  rationale: 将名词化的完成时被动分词译为自然、尊重当事人的现代汉语。
- source_word: Σοὶ λέγω
  choice: 我吩咐你
  rationale: 原文将“你”前置，语气直接而有权威；“我吩咐你”在汉语中较自然地传达这种强调，虽字面也可译“我对你说”。
- source_word: ἔγειρε
  choice: 起来
  rationale: 准确传达立即起身的命令，也符合现代汉语表达。
- source_word: ἄρας
  choice: 拿起
  rationale: 在此表示把所躺之物提起并带走；“拿起”清楚自然。
- source_word: κλινίδιόν σου
  choice: 你的小床
  rationale: κλινίδιον指小床、卧榻或铺垫；“小床”保留指小型卧具的含义，同时以脚注提示其他可能译法。
- source_word: πορεύου εἰς τὸν οἶκόν σου
  choice: 回家去吧
  rationale: 目的地是“你的家”；在此语境中“回家去”比逐字的“到你家去”更自然。
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου的译法
  choice: 人子
  alternative: 那位属人的／人之子
  rationale: “人子”是公认的经文称号，既保留耶稣自称的形式，也保留其可能包含的普通人性表达与《但以理书》7章意象之间的张力。
- issue: ἐξουσία与赦罪的关系
  choice: 有赦罪的权柄
  alternative: 有赦罪的能力
  rationale: 此处所争议的是赦罪的正当权限，不仅是能力；因此采用“权柄”，避免把论点缩减为行神迹的力量。
- issue: ἐπὶ τῆς γῆς的范围
  choice: 在地上
  alternative: 在尘世领域中
  rationale: 保持原文简洁的空间表述，不替读者判定它与“赦罪”还是“有权柄”结合的全部神学含义。
- issue: 耶稣命令的语气
  choice: 我吩咐你
  alternative: 我对你说
  rationale: 前置的Σοί带有强调，“吩咐”传达话语中的权威；但不把它扩展为原文没有明说的身份论断。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“人子”“权柄”“赦罪”保留必要的经文与神学语域；叙事和命令部分则使用自然口语句式。破折号保留原文中目的从句被叙事插语打断的结构。
