  naturalness: 整体为自然、庄重的现代普通话。“为了让你们知道”比“但要让你们知道”更明确地表达ἵνα的目的关系；“回家去吧”自然。
  terminology: “人子”“权柄”“赦罪”均恰当，既符合经文语域，也没有作教派性扩展。“小床”可用，脚注适当地保留κλινίδιον的卧榻、铺垫等词义范围。
