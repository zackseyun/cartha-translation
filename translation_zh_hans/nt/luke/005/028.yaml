  text: καὶ καταλιπὼν ⸀πάντα ἀναστὰς ⸀ἠκολούθει αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/028.yaml
  text: And leaving everything behind[a], he got up and followed him.
translation:
  language: zh_hans
  text: 于是，他撇下一切[a]，站起身来跟随了耶稣。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他把一切都留下，起来跟随了耶稣。”
    reason: 保留καταλιπών较中性的“留下”含义，以及三个动作紧密相连的另一种表达方式。
lexical_decisions:
- source_word: καὶ
  choice: 于是
  rationale: 承接上一节耶稣的呼召，按现代汉语叙事习惯译为“于是”，表达顺承关系，不额外加入因果含义。
- source_word: καταλιπὼν
  choice: 撇下
  rationale: 该不定过去时分词表示在起身跟随之前把事物留在原处；“撇下”简洁自然，也传达行动的决绝性，但不强化为“抛弃”。
- source_word: πάντα
  choice: 一切
  rationale: 保留中性复数的总括性，不把其范围限定为钱财、职业或某几样具体事物。
- source_word: ἀναστὰς
  choice: 站起身来
  rationale: 在叙事语境中表示起身采取行动；这一译法既具体又符合现代汉语表达。
- source_word: ἠκολούθει
  choice: 跟随了
  rationale: 未完成过去时可描写持续或由此展开的行动；本句以“跟随了”自然叙述利未对呼召的回应，同时不强行限定为“开始跟随”或只强调持续过程。
- source_word: αὐτῷ
  choice: 耶稣
  rationale: 原文代词所指是上文的耶稣。汉语若连续使用两个“他”容易产生指代含混，因此明确译出所指，以取得自然清楚的表达。
theological_decisions:
- issue: 利未撇下“一切”的范围及其门徒意义
  choice: 保留“一切”的全面措辞，只陈述他当时决然离开并跟随耶稣。
  alternative: 将其解释为暂时离开工作，或解释为永久放弃所有财产。
  rationale: 原文强调利未对耶稣呼召的彻底回应，却没有在本节具体说明财产、职业及离开状态持续多久；译文不替经文消除这一张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“撇下”是普通读者熟悉的表达；“站起身来”比单用“起来”更明确。为避免两个第三人称男性代词连续出现造成歧义，末尾明确译出“耶稣”。
