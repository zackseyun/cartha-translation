id: LUK.5.14
reference: Luke 5:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ αὐτὸς παρήγγειλεν αὐτῷ μηδενὶ εἰπεῖν, ἀλλὰ ἀπελθὼν δεῖξον σεαυτὸν τῷ ἱερεῖ, καὶ προσένεγκε περὶ τοῦ καθαρισμοῦ σου καθὼς προσέταξεν Μωϋσῆς εἰς μαρτύριον αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/014.yaml
  text: And he ordered him to tell no one[a], but go and show yourself to the priest, and offer for your cleansing as Moses commanded[b], for a testimony to them.
translation:
  language: zh_hans
  text: 他吩咐那人不要告诉任何人；却要去让祭司察看你自己，并照摩西所吩咐的[b]，为你的洁净献上祭物，作为给他们的见证[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他们”可能指祭司或其他人；“见证”也可理解为给他们看的证据，有人则理解为指证他们的证据。
    reason: alternative_reading
  - marker: b
    text: 摩西所吩咐的洁净礼仪和祭物，见《利未记》第14章。
    reason: cross_reference
lexical_decisions:
- source_word: παρήγγειλεν
  choice: 嘱咐
  rationale: 表达带有权威的明确指示，同时不额外加入原文未明说的严厉语气；现代汉语自然庄重。
- source_word: μηδενὶ εἰπεῖν
  choice: 不要告诉任何人
  rationale: 自然传达不定式结构中的禁止含义，并完整保留“任何人”的范围。
- source_word: ἀπελθὼν
  choice: 去
  rationale: 与后面的命令式连为“去把自己给祭司察看”，自然体现先去、后受察看的行动次序，避免生硬直译分词。
- source_word: δεῖξον σεαυτὸν τῷ ἱερεῖ
  choice: 把自己给祭司察看
  rationale: “察看”结合洁净礼仪的语境，准确表达让祭司亲自检验其状况；比字面的“把自己给祭司看”更符合现代汉语。
- source_word: προσένεγκε
  choice: 献上祭物
  rationale: 在祭司与洁净礼仪语境中，该动词指献呈祭物；补出“祭物”使汉语语义完整，但不限定祭物种类。
- source_word: περὶ τοῦ καθαρισμοῦ σου
  choice: 为你的洁净
  rationale: 保留这是关乎其礼仪洁净的献祭目的；“洁净”也与上下文及利未记的礼仪用语协调。
- source_word: καθὼς προσέταξεν Μωϋσῆς
  choice: 照摩西所吩咐的
  rationale: 直接保留摩西律法规定的权威性，同时符合现代汉语表达。
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: 作为给他们的见证
  rationale: 形式上贴近原文，不明确“他们”是谁，也不把“见证”解释成有利证据或控告证据，从而保留原文歧义。
theological_decisions:
- issue: εἰς μαρτύριον αὐτοῖς中“他们”的所指及“见证”的作用
  choice: 译作“作为给他们的见证”，不具体说明对象和见证的正负含义
  alternative: 译作“向祭司作见证”或“作为指证他们的证据”
  rationale: 希腊文仅用复数代词αὐτοῖς，没有明说所指；μαρτύριον也可侧重证明、见证，甚至被理解为不利证据。正文应保留这种真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“嘱咐”保留权威指示而不过度加强语气；“给祭司察看”清楚呈现礼仪检验场景。脚注标记均置于正文中：交叉参考紧随“献上祭物”，歧义说明置于“见证”句末。
