id: LUK.5.11
reference: Luke 5:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ καταγαγόντες τὰ πλοῖα ἐπὶ τὴν γῆν ἀφέντες ⸀πάντα ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/011.yaml
  text: And after bringing the boats to land[b][a], they left everything and followed him.
translation:
  language: zh_hans
  text: 他们把船靠了岸[a]，就撇下一切[b]，跟从了他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把船拖到陆地上”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“撇下所有东西”。
    reason: lexical_alternative
lexical_decisions:
- source_word: καταγαγόντες
  choice: 把……靠了岸
  rationale: 该词为不定过去时主动分词，表示先于主要动词发生的动作。结合船只语境，“把船靠了岸”自然表达将船带到陆地的动作与先后关系。
- source_word: τὰ πλοῖα
  choice: 船
  rationale: πλοῖον 可指船或舟；在加利利湖捕鱼的语境中，“船”准确且自然。
- source_word: ἐπὶ τὴν γῆν
  choice: 靠了岸
  rationale: 原文直译为“到陆地上”。“靠了岸”符合现代汉语航船语境，同时不把 γῆ 过度限定为某种具体岸边设施。
- source_word: ἀφέντες
  choice: 撇下
  rationale: ἀφίημι 在此意为离开、留下不顾。“撇下”既保留主动舍下的力度，也符合庄重而通顺的现代圣经叙事用语。
- source_word: πάντα
  choice: 一切
  rationale: 中性复数在此具有概括性的全部含义。“一切”简洁自然，保留原文范围广泛而未具体说明所指之物的特点。
- source_word: ἠκολούθησαν αὐτῷ
  choice: 跟从了他
  rationale: ἀκολουθέω 既描述实际跟随，也在上下文中带有作门徒的含义。“跟从了他”保留这两层可能性，不另加解释。
theological_decisions:
- issue: πάντα 所表达的舍弃范围
  choice: 撇下一切
  alternative: 撇下所有东西／把一切都留下
  rationale: 原文强调全面的舍下，却没有具体界定财物、职业、家庭安排或这种舍弃持续多久。“撇下一切”保留其强度及神学张力，不作超出经文的限定。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语体。“靠了岸”使汉语自然；脚注补出较贴近字面的空间表达。“跟从”保留实际随行与门徒身份之间的含义张力。
