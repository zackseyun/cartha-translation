  text: οὐκ ἐλήλυθα καλέσαι δικαίους ἀλλὰ ἁμαρτωλοὺς εἰς μετάνοιαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/032.yaml
  text: I have not come to call the righteous, but sinners to a change of mind.
translation:
  language: zh_hans
  text: 我来不是要召义人，而是要召罪人悔改。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“召罪人，为要他们悔改。”希腊语εἰς μετάνοιαν表示目的或目标。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἐλήλυθα
  choice: 我来不是
  rationale: ἐλήλυθα是完成时，在使命宣告中强调已经来到并以此为当前使命；汉语“我来不是……”自然表达这种来意，避免生硬复制时态形式。
- source_word: καλέσαι
  choice: 要召
  rationale: 不定式在此表示目的。“召”保留了呼唤、邀请或召集的语义空间，不将其单限定为邀请或命令。
- source_word: δικαίους
  choice: 义人
  rationale: 该形容词作名词用，直指“义的人”。不添加“自以为”或“被视为”，从而保留经文本身关于义人与罪人的张力。
- source_word: ἁμαρτωλούς
  choice: 罪人
  rationale: 这是福音书语境中清楚而通行的对应词，同时保留其道德及社会分类意味。
- source_word: εἰς μετάνοιαν
  choice: 悔改
  rationale: εἰς加μετάνοια表示目的或目标。现代汉语在“召罪人”之后用动词“悔改”最自然，也准确传达转变心意与方向的含义。
theological_decisions:
- issue: “义人”是否暗指自以为义或被社会视为义的人
  choice: 保留“义人”这一未加限定的称呼
  alternative: 自以为义的人；被视为义的人
  rationale: 原文没有明说讽刺或主观认定；加上限定会替经文解决其有意保留的神学张力。
- issue: εἰς μετάνοιαν应表达为名词还是动词
  choice: 译作“悔改”
  alternative: 归向悔改；为要悔改
  rationale: 汉语“召罪人悔改”简洁自然，并保留目的关系；脚注说明也可按名词性结构理解。
translation_notes:
  register: 采用庄重而现代的标准普通话。“我来不是要……而是要……”符合汉语使命宣告的自然句式；“召、义人、罪人、悔改”均为普通读者可理解且具有经文语体连续性的词语。
