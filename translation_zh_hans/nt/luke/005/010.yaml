  source_fidelity: 译文准确传达了西庇太的儿子雅各和约翰与西门是伙伴，以及耶稣对西门的安慰和从此改变的使命。μως δὲ καὶ所承接的上文反应，以“也同样如此”表达较清楚。主要需调整的是“捕得活人了”：中文的“捕得”偏重成功结果，“了”又易造成已经开始或即将发生的口语语感；原文是指持续性的未来使命。改为“将要捕获活人”较直接保留ζωγρῶν“捕获而使其活着”的特殊含义，也更稳妥地表达未来。
