  text: ὁμοίως δὲ καὶ Ἰάκωβον καὶ Ἰωάννην υἱοὺς Ζεβεδαίου, οἳ ἦσαν κοινωνοὶ τῷ Σίμωνι. καὶ εἶπεν πρὸς τὸν Σίμωνα ⸀ὁ Ἰησοῦς· Μὴ φοβοῦ· ἀπὸ τοῦ νῦν ἀνθρώπους ἔσῃ ζωγρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/010.yaml
  text: and likewise also James and John, Zebedee’s sons, who were partners with Simon. And Jesus said to Simon, “Do not be afraid; from now on you will be catching people alive.”
translation:
  language: zh_hans
  text: 西庇太的儿子雅各和约翰也同样如此；他们是西门的伙伴。耶稣对西门说：“不要怕；从今以后，你将要捕获活人。[a][b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你要把人活捉来。”原文动词有“活捉、捕获而使其活着”的意思；与马太福音和马可福音中较熟悉的“得人的渔夫”措辞不同。
    reason: lexical_alternative
  - marker: b
    text: 参马太福音4:19、马可福音1:17；那里耶稣说要使门徒成为“得人的渔夫”。路加在这里采用不同的动词，不宜把两处措辞完全译成一样。
    reason: cross_reference
lexical_decisions:
- source_word: ὁμοίως δὲ καὶ
  choice: 也是这样
  rationale: 承接上文所述的惊讶反应，保留比较和附加的语气，同时避免生硬地逐词译作“同样也”。
- source_word: υἱοὺς Ζεβεδαίου
  choice: 西庇太的儿子
  rationale: 自然、准确地保留亲属身份说明。
- source_word: κοινωνοὶ
  choice: 伙伴
  rationale: 结合捕鱼营生的上下文，指与西门共同经营或劳作的伙伴，不只是一般同伴。
- source_word: Μὴ φοβοῦ
  choice: 不要怕
  rationale: 采用现代汉语中自然而庄重的安慰用语，准确传达禁止恐惧的命令。
- source_word: ἀπὸ τοῦ νῦν
  choice: 从今以后
  rationale: 清楚标示西门使命自此发生决定性的转变。
- source_word: ἀνθρώπους
  choice: 人
  rationale: 此处泛指人类，并不专指男性；“人”简洁自然，也适合后面的捕鱼隐喻。
- source_word: ζωγρῶν
  choice: 捕得活人
  rationale: 该动词含有“活捉、捕获而使之存活”的意义。“捕得活人”既保留捕鱼意象，也尽量呈现路加独有的“活着捕获”语义，而不改写成平行经文的“得人如得鱼”。
theological_decisions:
- issue: 如何表达 ζωγρέω 所含的捕鱼隐喻与“活着捕获”之意
  choice: 你要捕得活人了
  alternative: 你要得人了；你要成为得人的渔夫
  rationale: 路加使用 ζωγρέω，而不是马太福音4:19和马可福音1:17中“得人的渔夫”那一表达。译文保留路加措辞的区别及其“活着捕获”的张力，不把它与平行经文同化。
- issue: ἀνθρώπους 的性别范围
  choice: 人
  alternative: 男人；世人
  rationale: 该词在此泛指人，并非仅指男性；译作“人”既忠实于所指范围，也避免添加原文没有的限制。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“捕得活人”略带陌生感，是为保留原文 ζωγρέω 不寻常的表达及其神学张力；脚注说明较直译的选择，并指出与平行经文的差异。
