  text: καὶ ἔκστασις ἔλαβεν ἅπαντας καὶ ἐδόξαζον τὸν θεόν, καὶ ἐπλήσθησαν φόβου λέγοντες ὅτι Εἴδομεν παράδοξα σήμερον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/026.yaml
  text: And amazement seized them all[a], and they were glorifying God, and they were filled with fear, saying, “We have seen extraordinary things today.”
translation:
  language: zh_hans
  text: 众人都惊呆了[a]，不断归荣耀给神，又满心惧怕，说：“我们今天看见了非同寻常的事！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“惊愕抓住了所有人”；也可译作“众人都大为惊奇”。
    reason: 说明希腊文拟人化表达及较为形式对应的译法。
lexical_decisions:
- source_word: ἔκστασις
  choice: 惊呆了
  rationale: 这里指强烈而压倒性的惊愕，不是神秘体验意义上的“出神”。“惊呆了”是自然的现代汉语，也保留了反应的强度。
- source_word: ἔλαβεν ἅπαντας
  choice: 众人都惊呆了
  rationale: 希腊文直译为“惊愕抓住了所有人”。汉语以状态表达更自然；“众人都”保留了ἅπαντας的全体范围。
- source_word: ἐδόξαζον τὸν θεόν
  choice: 不断归荣耀给神
  rationale: “归荣耀给神”贴近δοξάζω的含义；“不断”体现未完成时所表示的持续动作。
- source_word: ἐπλήσθησαν φόβου
  choice: 满心惧怕
  rationale: 保留φόβος的“惧怕”义，不将敬畏与恐惧之间的张力单方面弱化为“敬畏”；“满心”自然表达被这种情绪充满。
- source_word: Εἴδομεν
  choice: 我们今天看见了
  rationale: 不定过去时在这里指刚发生并引起当前反应的所见；汉语“看见了”自然传达其完成与即时性。
- source_word: παράδοξα
  choice: 非同寻常的事
  rationale: 指超出通常预期、令人惊异之事。“非同寻常”既自然，又避免“奇怪”可能带有的负面意味。
- source_word: σήμερον
  choice: 今天
  rationale: 直接保留时间副词及现场见证的即时感。
theological_decisions:
- issue: φόβος在神圣作为面前的情感色彩
  choice: 译为“惧怕”
  alternative: 敬畏
  rationale: 经文同时描写归荣耀给神和被惧怕充满的反应。直译“惧怕”可保留震撼、畏惧与敬拜并存的张力，而不预先将其解释为较温和的“敬畏”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“惊呆了”表达强烈惊愕，虽较口语化，但在此叙事语境中自然有力；其脚注补充希腊文原有的生动表达。
