  source_fidelity: 忠实传达了原文的主要语义与句法推进：ἔκστασις ἔλαβεν ἅπαντας译为“众人都惊呆了”，保留全体人被强烈惊愕攫住的效果；ἐδόξαζον的未完成体以“不断归荣耀给神”表达；ἐπλήσθησαν φόβου没有弱化φόβος，译作“满心惧怕”；末句准确保留“我们今天看见了非同寻常的事”的即时见证语气。
