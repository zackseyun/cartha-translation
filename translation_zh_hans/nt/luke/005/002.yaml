  text: καὶ εἶδεν ⸂δύο πλοῖα⸃ ἑστῶτα παρὰ τὴν λίμνην, οἱ δὲ ἁλιεῖς ⸂ἀπ’ αὐτῶν ἀποβάντες⸃ ⸀ἔπλυνον τὰ δίκτυα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/002.yaml
  text: And he saw two boats standing by the lake[a], but the fishermen, having gotten out of them, were washing the nets.
translation:
  language: zh_hans
  text: 他看见两只船停在湖边；渔夫已经从船上下来了，正在洗网。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶδεν
  choice: 看见
  rationale: 叙事中自然对应ὁράω的不定过去时，不额外加入“注意到”的突发感。
- source_word: δύο πλοῖα
  choice: 两只船
  rationale: 在革尼撒勒湖捕鱼的语境中，现代汉语用“船”自然准确；船只通常以“只”计量。
- source_word: ἑστῶτα παρὰ τὴν λίμνην
  choice: 停在湖边
  rationale: ἑστῶτα表示船处于静止状态；汉语不宜直译为“站着”，“停在”既自然，又不具体断定船已系泊。παρά加宾格在此表示位于湖旁。
- source_word: οἱ δὲ ἁλιεῖς
  choice: 渔夫
  rationale: ἁλιεῖς指以捕鱼为业的人；δέ在此形成轻微对照或场景转移，汉语以分号及后续分句自然体现，无须生硬加“但是”。
- source_word: ἀπ’ αὐτῶν ἀποβάντες
  choice: 已经从船上下来了
  rationale: 不定过去分词所述动作先于“洗网”；“已经……下来”自然体现先后关系。将代词所指明示为“船”，避免汉语“从它们下来”的生硬表达，同时不增加“上岸”等原文未明说的信息。
- source_word: ἔπλυνον τὰ δίκτυα
  choice: 正在洗网
  rationale: 未完成过去时描绘当时持续进行的动作，“正在”传达进行体；原文定冠词不要求汉语加入所有格“他们的”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。以分号呈现船停在湖边与渔夫已离船洗网之间的场景转换；不机械保留希腊语分词结构，也不加入“系泊”或“上岸”等较原文更具体的解释。
