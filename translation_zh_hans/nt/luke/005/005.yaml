source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ⸀Σίμων ⸀εἶπεν· Ἐπιστάτα, δι’ ⸀ὅλης νυκτὸς κοπιάσαντες οὐδὲν ἐλάβομεν, ἐπὶ δὲ τῷ ῥήματί σου χαλάσω ⸂τὰ δίκτυα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/005.yaml
  text: And Simon answered[a], “Master, we worked hard all night and caught nothing[b]; but at your word I will let down the nets.”
translation:
  language: zh_hans
  text: 西门回答说：“师傅，我们辛苦了一整夜，什么也没有捕到；但照你的话[a]，我就把网都放下去。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “照你的话”也可译作“因你的话”或“凭你的话”。
    reason: 原文结构可表示行动所依据的吩咐，也可强调这话是行动的理由。
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν
  choice: 回答说
  rationale: 这是引出直接引语的常见希腊语表达；“回答说”在现代汉语中自然，也保留了回应的语气。
- source_word: Ἐπιστάτα
  choice: 老师
  rationale: 该称呼在《路加福音》中表示对耶稣权威的承认，但原文并非 κύριος（“主”）；“老师”通顺庄重，又不提前赋予更强的基督论含义。
- source_word: δι’ ὅλης νυκτός
  choice: 一整夜
  rationale: 准确表达动作持续了整个夜晚，符合现代汉语习惯。
- source_word: κοπιάσαντες
  choice: 辛苦了
  rationale: 原词强调劳苦和费力；“辛苦了一整夜”既自然，也保留了艰苦劳作的意味。
- source_word: οὐδὲν ἐλάβομεν
  choice: 什么也没有捕到
  rationale: 在捕鱼语境中，λαμβάνω 指捕获；译文自然补出语境中明确的捕鱼含义，却不增添具体对象。
- source_word: ἐπὶ δὲ τῷ ῥήματί σου
  choice: 但照你的话
  rationale: ἐπί 加与格可表示行动的依据或理由；“照你的话”既可理解为按照吩咐，也保留因对方的话而行动的意味。
- source_word: χαλάσω
  choice: 我就把网放下去
  rationale: 该动词在此指把网降入水中；“放下去”比“撒网”更贴近原文的下降动作。
- source_word: τὰ δίκτυα
  choice: 网
  rationale: 现代汉语中的“网”在此可作集合性表达，结合捕鱼语境自然涵盖原文复数“网具”，避免生硬的“诸网”或不必要的“这些网”。
- source_word: δὲ
  choice: 但
  rationale: 表示此前徒劳与随后仍愿照做之间的轻微转折。
theological_decisions:
- issue: 如何翻译耶稣的称呼 Ἐπιστάτα
  choice: 老师
  alternative: 主啊；夫子
  rationale: 原文特意使用 ἐπιστάτης，而不是 κύριος。“老师”体现受承认的权威，又不把“主”的较强神学含义带入本节；“夫子”在当代普通读者中略显古雅。
- issue: 如何表达彼得行动的依据
  choice: 照你的话
  alternative: 因你的话；凭你的话
  rationale: 此结构可表达依据、理由或依从。译文保留彼得既因耶稣所说的话、也按其吩咐而行动的张力，不限定为单一解释。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事表达。“辛苦了一整夜”突出劳作强度；“把网放下去”保留捕鱼网被降入水中的具体动作。
