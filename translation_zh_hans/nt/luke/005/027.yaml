  text: Καὶ μετὰ ταῦτα ἐξῆλθεν καὶ ἐθεάσατο τελώνην ὀνόματι Λευὶν καθήμενον ἐπὶ τὸ τελώνιον, καὶ εἶπεν αὐτῷ· Ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/027.yaml
  text: And after these things he went out and saw a tax collector named Levi sitting at the tax booth[a], and he said to him[b], “Follow me.”
translation:
  language: zh_hans
  text: 这些事以后，他出去，看见[a]一个名叫利未的税吏，坐在收税处[b]，就对他说：“跟从我。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“留意到”或“注视”；希腊文这个动词可能不只是匆匆一瞥。
    reason: lexical_alternative
  - marker: b
    text: 或译“税关”或“收税站”。
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: 这些事以后
  rationale: 保留复数指示词所表达的叙事承接，同时符合现代汉语表达。
- source_word: ἐξῆλθεν
  choice: 他出去
  rationale: 直接表达动词所含的具体移动，不将其泛化为“离开”；主语承接上文，不擅自补入名字。
- source_word: ἐθεάσατο
  choice: 看见
  rationale: 在叙事中自然明白，也保留“看见”的基本意义；该词可能含较专注地观看或留意之意，以脚注说明。
- source_word: τελώνην
  choice: 税吏
  rationale: 准确、简洁地指称当时负责征收税款或通行税的人，并符合福音书语境中的通行译法。
- source_word: ὀνόματι Λευὶν
  choice: 一个名叫利未的
  rationale: 以自然现代汉语表达希腊文“名叫利未”的结构。
- source_word: καθήμενον
  choice: 坐在
  rationale: 保留现在分词所描绘的现场状态，使叙事画面清楚。
- source_word: ἐπὶ τὸ τελώνιον
  choice: 在收税处
  rationale: τελώνιον指征收税款、关税或通行税的地点；“收税处”清楚而不过度限定其具体建筑形式。
- source_word: Ἀκολούθει μοι
  choice: 跟从我
  rationale: 既保留命令的直接性，也自然承载语境中的门徒召唤含义，而不另加解释。
theological_decisions:
- issue: 耶稣命令语的门徒召唤含义
  choice: 跟从我
  alternative: 作我的门徒；来跟着我
  rationale: 希腊文命令式本身已足以在语境中表达召唤；译文不把隐含意义扩写成明说的神学解释。
- issue: 叙事主语的处理
  choice: 使用“他”，承接上文
  alternative: 补明“耶稣”
  rationale: 本节希腊文本的动词主语是承接语境而省略的；用“他”既符合中文衔接，也避免在本节内增加原文未明说的专名。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“这些事以后”略偏正式，以保留路加的明确过渡；“税吏”沿用清楚且成熟的福音书用语。脚注标记分别紧随其所解释的“看见”和“收税处”，避免歧义。
