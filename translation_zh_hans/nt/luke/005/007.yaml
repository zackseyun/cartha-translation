source:
  edition: SBLGNT
  text: καὶ κατένευσαν τοῖς ⸀μετόχοις ἐν τῷ ἑτέρῳ πλοίῳ τοῦ ἐλθόντας συλλαβέσθαι αὐτοῖς· καὶ ἦλθον, καὶ ἔπλησαν ἀμφότερα τὰ πλοῖα ὥστε βυθίζεσθαι αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/007.yaml
  text: So they signaled to their partners in the other boat to come and help them[a]. And they came and filled both boats[c][b], so that they began to sink.
translation:
  language: zh_hans
  text: 于是，他们向另一条船上的伙伴打手势，请他们过来帮忙[a]。他们来了，把两条船都装满了，以致两条船开始下沉[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “打手势”也可译作“示意”或“招手”。
    reason: lexical_alternative
  - marker: b
    text: “开始下沉”也可译作“正在下沉”。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατένευσαν
  choice: 打手势
  rationale: 该动词指以动作示意；在水面相隔一段距离的语境中，“打手势”自然明确，也保留了非言语示意的含义。
- source_word: μετόχοις
  choice: 伙伴
  rationale: 在捕鱼语境中指共同参与作业的人，可能含有经营合作关系；“伙伴”既自然，又不把具体法律或商业关系说得过死。
- source_word: ἐν τῷ ἑτέρῳ πλοίῳ
  choice: 另一条船上的
  rationale: ἕτερος在此用于区分场景中的另一条船；汉语以“另一条船”表达最自然。
- source_word: τοῦ ἐλθόντας
  choice: 叫他们来
  rationale: 这一结构表达示意的目的；“叫他们来”以自然汉语清楚传达目的关系。
- source_word: συλλαβέσθαι αὐτοῖς
  choice: 帮忙
  rationale: 此处指加入他们、协力处理沉重的渔获；“帮忙”简洁自然，同时不额外限定具体动作。
- source_word: ἔπλησαν
  choice: 装满了鱼
  rationale: 原文直译为“装满”，宾语由上文的鱼获补足；汉语明说“鱼”可避免误解，并自然再现场景。
- source_word: ἀμφότερα τὰ πλοῖα
  choice: 两条船都
  rationale: 准确传达ἀμφότερα“二者都”的含义，符合现代汉语语序。
- source_word: ὥστε βυθίζεσθαι αὐτά
  choice: 船甚至开始下沉
  rationale: ὥστε引出结果，βυθίζεσθαι为进行性过程；“开始下沉”表明船已进入下沉状态，却不暗示已经完全沉没。“甚至”自然凸显结果的严重程度。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事体。“伙伴们”补明后一句省略的主语，使汉语衔接自然；“鱼”由上下文补出。所有脚注标记均置于正文相关表达之后。
