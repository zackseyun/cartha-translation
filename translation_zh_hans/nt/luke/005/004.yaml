  text: ὡς δὲ ἐπαύσατο λαλῶν, εἶπεν πρὸς τὸν Σίμωνα· Ἐπανάγαγε εἰς τὸ βάθος καὶ χαλάσατε τὰ δίκτυα ὑμῶν εἰς ἄγραν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/004.yaml
  text: When he had finished speaking[a], he said to Simon, “Put out into the deep water, and let down your nets for a catch.”
translation:
  language: zh_hans
  text: 他讲完后，对西门说：“你把船驶到水深处[a]，你们下网捕鱼吧。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“到深处”，这里指水深的地方。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἐπαύσατο λαλῶν
  choice: 他讲完后
  rationale: 自然表达前一段讲话结束后随即发生的事；既保留时间关系，也不过度翻译语气较轻的δέ。
- source_word: εἶπεν πρὸς τὸν Σίμωνα
  choice: 对西门说
  rationale: 直接对应希腊文的说话引介，不采用含义较强的“吩咐西门”。
- source_word: Ἐπανάγαγε
  choice: 你把船驶到
  rationale: 在捕鱼场景中指把船从岸边驶出去。汉语补出语境中隐含的“船”，使表达清楚自然；单数“你”保留命令首先针对西门这一点。
- source_word: εἰς τὸ βάθος
  choice: 水深处
  rationale: βάθος字面为“深处、深度”，此处具体指较深的水域；“水深处”在现代汉语中简洁自然。
- source_word: χαλάσατε τὰ δίκτυα ὑμῶν
  choice: 你们下网
  rationale: χαλάσατε是复数命令式，与前面的单数命令形成数的转换；“你们”明确保留耶稣随后对西门及同伴说话这一语法特征。“下网”是汉语捕鱼语境中的自然说法。
- source_word: εἰς ἄγραν
  choice: 捕鱼吧
  rationale: ἄγρα在此指捕获鱼这一目的。“捕鱼”自然表达“为要有所捕获”；句末“吧”使命令在现代汉语中自然，同时不削弱其指示性质。
theological_decisions:
- issue: 两个命令由单数转为复数
  choice: 分别译作“你把船驶到”和“你们下网”
  alternative: 两个命令都不明示主语
  rationale: 希腊文先用单数命令式对西门说，再用复数命令式涉及同行者。译文明示这一转换，避免抹去叙事中的人称差异，同时不对同行者身份作额外推断。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“驶到”适用于湖上行船，不误导为海上航行；“下网捕鱼”是普通读者容易理解的捕鱼表达。
