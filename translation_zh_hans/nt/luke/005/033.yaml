  text: Οἱ δὲ εἶπαν πρὸς αὐτόν· ⸀Οἱ μαθηταὶ Ἰωάννου νηστεύουσιν πυκνὰ καὶ δεήσεις ποιοῦνται, ὁμοίως καὶ οἱ τῶν Φαρισαίων, οἱ δὲ σοὶ ἐσθίουσιν καὶ πίνουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/033.yaml
  text: And they said to him[a], “John’s disciples fast often and make prayers; likewise also those of the Pharisees[b], but yours eat and drink.”
translation:
  language: zh_hans
  text: 他们对他说：“约翰的门徒经常禁食，也祈祷；法利赛人的门徒[a]也是这样，而你的门徒[b]却吃喝。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“那些属于法利赛人的人”；“门徒”承接上文而省略。
    reason: lexical_alternative
  - marker: b
    text: 希腊文直译为“你的那些人”；按上下文指“你的门徒”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ δὲ εἶπαν πρὸς αὐτόν
  choice: 他们对他说
  rationale: δέ在这里是轻微的叙事连接词，汉语无需硬译为“而”或“但”，省略后行文更自然。
- source_word: μαθηταὶ Ἰωάννου
  choice: 约翰的门徒
  rationale: 属格表达归属或师徒关系，译作“约翰的门徒”准确自然。
- source_word: νηστεύουσιν πυκνά
  choice: 常常禁食
  rationale: πυκνά在此作副词，表示频繁、屡次；“常常”符合现代汉语习惯。
- source_word: δεήσεις ποιοῦνται
  choice: 献上祈求
  rationale: 保留δεήσεις的名词意义和敬虔行为色彩，同时比逐字译作“作祈求”自然。
- source_word: ὁμοίως καὶ οἱ τῶν Φαρισαίων
  choice: 法利赛人的门徒也是这样
  rationale: 希腊文省略了“门徒”，由前句补足；汉语若照样省略会显得指代不清，因此在正文补出，并用脚注说明原文形式。
- source_word: οἱ δὲ σοὶ
  choice: 可你的门徒却
  rationale: σοί实质上指“属于你的那些人”，即耶稣的门徒；汉语补出“门徒”以保持清楚。“可……却”传达δέ所引出的鲜明对比。
- source_word: ἐσθίουσιν καὶ πίνουσιν
  choice: 又吃又喝
  rationale: 现在时描述惯常表现；“又吃又喝”自然地呈现与禁食相对的行为。
theological_decisions:
- issue: 是否在后两处省略结构中补出“门徒”
  choice: 正文两处均补出“门徒”，并以脚注交代希腊文的省略表达
  alternative: 照字面译作“法利赛人的那些人”和“你的那些人”
  rationale: 这里不存在教义取舍，但涉及原文透明度与汉语可读性的平衡。补出上下文明确蕴含的名词，可避免生硬或含混；脚注则保存原文结构。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“献上祈求”保持敬虔语域；“可……却”清楚呈现两组门徒行为之间的对比。所有脚注标记均已置于正文相应位置。
