id: LUK.5.35
reference: Luke 5:35
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐλεύσονται δὲ ἡμέραι, καὶ ὅταν ἀπαρθῇ ἀπ’ αὐτῶν ὁ νυμφίος τότε νηστεύσουσιν ἐν ἐκείναις ταῖς ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/035.yaml
  text: But days will come[a], and when the bridegroom is taken away from them, then they will fast in those days.
translation:
  language: zh_hans
  text: 但日子将到；当新郎从他们那里被带走[a]时，他们就在那些日子禁食。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“被移去”。希腊语动词为被动式，表示新郎被从他们那里带走，并非只是自行离开。
    reason: 说明被动形式及其较强的被移除意味，并提供不夸大语义的译法。
lexical_decisions:
- source_word: ἐλεύσονται ... ἡμέραι
  choice: 日子将到
  rationale: 保留希腊语“日子来到”的前瞻性表达；现代汉语自然、简洁，也维持其郑重语气。
- source_word: δὲ
  choice: 但
  rationale: 承接上文并表示温和转折，从目前不禁食的情形转向将来的禁食。
- source_word: καὶ ὅταν
  choice: 而当……时
  rationale: “而”保留 καί 的衔接作用，“当……时”自然表达 ὅταν 与虚拟语气所指向的未来时刻。
- source_word: ἀπαρθῇ ἀπ’ αὐτῶν
  choice: 从他们中间被带走
  rationale: 被动式“被带走”表明新郎是被人从他们中间移走，而不是仅仅自行离开；“从他们中间”清楚表达分离。
- source_word: ὁ νυμφίος
  choice: 新郎
  rationale: “新郎”是现代汉语中准确、自然的婚礼称谓，并保留耶稣所用的比喻。
- source_word: τότε
  choice: 就
  rationale: “就”在“当……时”结构中自然标明随后发生的结果，对应 τότε。
- source_word: νηστεύσουσιν
  choice: 禁食
  rationale: 准确表达宗教意义上的禁食，而不只是一般性地不吃东西。
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: 在那些日子
  rationale: 保留原文对未来那段时期的重复强调，不将其省略或泛化。
theological_decisions:
- issue: 是否把新郎的离去弱化为主动离开
  choice: 保留被动表达“从他们中间被带走”
  alternative: 新郎离开他们
  rationale: ἀπαρθῇ 是被动形式，暗示新郎受到外力而被移走。此译法保留其不祥意味及对耶稣将来遭遇的潜在指向，但不在正文中替读者明确解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“日子将到”保留原文的圣经式前瞻语气；全句以“而当……时……就……”呈现希腊语的时间与结果结构，并保留“那些日子”的重复强调。
