base_translation:
  language: en
  yaml_path: translation/nt/luke/005/021.yaml
  text: And the scribes and the Pharisees began to reason among themselves, saying, “Who is this who speaks blasphemies? Who can forgive sins except God alone?”
translation:
  language: zh_hans
  text: 文士和法利赛人开始彼此议论，说：“这是谁，竟说亵渎的话？除了上帝以外，谁能赦免罪呢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤρξαντο διαλογίζεσθαι
  choice: 开始思量
  rationale: ἄρχομαι加不定式表示“开始”；διαλογίζομαι在此可涵盖内心思索、彼此议论和推理质疑。“思量”保留这种开放性，不限定为公开讨论或纯粹内心活动。后面的“说”自然引出其所思所议的内容。
- source_word: γραμματεῖς
  choice: 文士
  rationale: 这是福音书语境中γραμματεῖς的传统且简洁译法，指熟悉并讲授律法的人；正文不扩写为“律法教师”，以避免加入解释性成分。
- source_word: Φαρισαῖοι
  choice: 法利赛人
  rationale: 采用现代中文圣经中通行的群体名称音译。
- source_word: Τίς ἐστιν οὗτος
  choice: 这个人是谁
  rationale: 希腊文直译为“这是谁”。现代汉语问及在场人物时，“这个人是谁”更自然，也保留其轻蔑质问的语气；“人”是汉语表达所需的轻度明示，并未改变所指。
- source_word: λαλεῖ βλασφημίας
  choice: 说亵渎的话
  rationale: λαλεῖ意为“说”，βλασφημίας为复数宾格。中文通常以“亵渎的话”自然表达这类言论；汉语名词不以形态标示单复数，因此不勉强添加“多句”等原文没有的数量信息。
- source_word: ἁμαρτίας ἀφεῖναι
  choice: 赦免罪
  rationale: ἀφίημι与ἁμαρτία搭配时是“赦免罪”的惯用表达。“赦免”既准确又符合庄重的现代汉语宗教语域。
- source_word: εἰ μὴ μόνος ὁ θεός
  choice: 除了上帝一位
  rationale: εἰ μή在此表示排除，即“除了”；μόνος强调唯一性。“除了上帝一位”清楚保留“唯独上帝”的排他含义，并与后面的反问自然衔接。
theological_decisions:
- issue: 耶稣赦罪权柄所引发的含义
  choice: 直接保留文士和法利赛人的断言：除了上帝一位，没有谁能赦罪。
  alternative: 在译文中明说耶稣就是上帝，或弱化为只有上帝授权的人才能赦罪。
  rationale: 本节只陈述他们的质疑，却借此形成关于耶稣身份和权柄的叙事张力。译文不提前替叙事作出基督论结论，也不削弱他们所声称的排他性。
- issue: βλασφημίας的指控力度
  choice: 译为“亵渎的话”，保留这是他们对耶稣言论的严重宗教指控。
  alternative: 译为较弱的“冒犯的话”或直接判定耶稣确实亵渎。
  rationale: 说话者认为耶稣的话构成亵渎；译文应忠实呈现其判断，但不把这一指控转化为叙述者的裁定。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“文士”“法利赛人”“上帝”“赦免罪”延续通行的圣经语汇；句式保留原文两个连续反问的力度。正文无脚注，因此没有脚注标记。
