id: LUK.5.8
reference: Luke 5:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἰδὼν δὲ Σίμων Πέτρος προσέπεσεν τοῖς γόνασιν Ἰησοῦ λέγων· Ἔξελθε ἀπ’ ἐμοῦ, ὅτι ἀνὴρ ἁμαρτωλός εἰμι, κύριε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/008.yaml
  text: But when Simon Peter saw it[a], he fell at Jesus’s knees, saying, “Go away from me, because I am a sinful man[b], Lord.”
translation:
  language: zh_hans
  text: 西门彼得看见这事[a]，就俯伏在耶稣膝前，说：“主啊，离开我吧！因为我是个罪人[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文只说“看见”；“这事”是按上下文补出的，指前述那次非同寻常的捕鱼收获。
    reason: implicit_object
  - marker: b
    text: 希腊原文直译为“我是一个有罪的男人”，其中“男人”是特指男性的词，指西门彼得自己。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: 看见这事
  rationale: 不定过去时分词按叙事时序自然译出；原文没有明说宾语，“这事”依据上下文指那次非同寻常的捕鱼收获。
- source_word: δὲ
  choice: 就
  rationale: δέ在这里推动叙事，并带出彼得对所见之事的反应；汉语以“就”自然连接前因与后续动作，不必机械译作“但是”。
- source_word: Σίμων Πέτρος
  choice: 西门彼得
  rationale: 原文同时保留两个名字，译文也完整呈现。
- source_word: προσέπεσεν τοῖς γόνασιν Ἰησοῦ
  choice: 俯伏在耶稣膝前
  rationale: προσπίπτω表示向着某人倒下或俯伏；与“耶稣的膝”连用，描绘彼得伏到耶稣膝前的敬畏姿态。
- source_word: Ἔξελθε ἀπ’ ἐμοῦ
  choice: 离开我吧
  rationale: 命令式在语境中表达彼得因敬畏而发出的恳求；“离开我吧”现代、自然，也保留要求彼此分开的直接语气。
- source_word: ὅτι
  choice: 因为
  rationale: 明确引出彼得请求耶稣离开的理由。
- source_word: ἀνὴρ ἁμαρτωλός
  choice: 我是个罪人
  rationale: 直译为“我是个有罪的男人”在现代汉语中生硬；“罪人”准确表达其自认有罪的意思，而脚注说明ἀνήρ为特指男性的名词。
- source_word: κύριε
  choice: 主啊
  rationale: κύριε是直接称呼；“主啊”保留尊崇、权柄及其可能具有的神学深度，而不把含义弱化为“先生”。
theological_decisions:
- issue: 彼得用κύριε称呼耶稣
  choice: 主啊
  alternative: 先生／主人
  rationale: 神迹、敬畏和认罪的语境使“主”最能保留称呼中的尊崇以及可能更深的含义，同时不额外断定彼得此时已有完整展开的基督论认识。
- issue: 彼得自称ἀνὴρ ἁμαρτωλός
  choice: 我是个罪人
  alternative: 我是个有罪的男人
  rationale: 正文采用自然汉语表达其认罪，不把“有罪”淡化为一般性的缺点；男性指称则在脚注中明确交代。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“俯伏在耶稣膝前”保留原文具体的身体姿态；引语以“主啊”和“吧”呈现敬畏中的直接恳求。
