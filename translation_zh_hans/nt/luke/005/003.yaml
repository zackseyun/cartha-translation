source:
  edition: SBLGNT
  text: ἐμβὰς δὲ εἰς ἓν τῶν πλοίων, ὃ ⸀ἦν Σίμωνος, ἠρώτησεν αὐτὸν ἀπὸ τῆς γῆς ἐπαναγαγεῖν ὀλίγον, ⸂καθίσας δὲ ἐκ τοῦ πλοίου ἐδίδασκεν⸃ τοὺς ὄχλους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/003.yaml
  text: Then he got into one of the boats[a], which belonged to Simon, and asked him to put out a little from the land. Then he sat down and was teaching the crowds from the boat.
translation:
  language: zh_hans
  text: 他上了其中一只船，那船是西门的，就请西门把船从岸边稍微驶开[a]。他坐下，从船上教导众人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“从陆地稍微驶开”。原文直译为“从陆地”，意在将水中的船与干地相对照。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβὰς
  choice: 上了
  rationale: 以自然的现代汉语表达进入船中的动作，并保留该动作先于主要动词“请”发生的叙事次序。
- source_word: πλοίων / πλοίου
  choice: 船
  rationale: 上下文是湖上的捕鱼船；“船”准确自然，不采用容易使人联想到大型船只的说法。
- source_word: ὃ ἦν Σίμωνος
  choice: 那船是西门的
  rationale: 忠实表达属格所表示的所有关系，同时保持简洁自然。
- source_word: ἠρώτησεν
  choice: 请
  rationale: 在要求对方采取行动的语境中，“请”比单纯的“问”更准确地表达请求之意，又不增强正式程度。
- source_word: ἐπαναγαγεῖν
  choice: 把船……驶离
  rationale: 表达船从岸边向水中移开的动作；“驶离”在现代汉语中清楚自然，同时不具体限定划、撑或扬帆等方式。
- source_word: ἀπὸ τῆς γῆς
  choice: 离岸边
  rationale: γῆ本义为陆地、地面，此处与水中的船相对；按具体场景译作“岸边”最自然，并以脚注保留较直译的可能。
- source_word: ὀλίγον
  choice: 稍微
  rationale: 表达移动距离不大，符合该词在此作程度或距离限定语的用法。
- source_word: καθίσας
  choice: 他坐下
  rationale: 把先于持续教导动作发生的分词转成顺畅的汉语独立分句。
- source_word: ἐδίδασκεν
  choice: 教导
  rationale: 未完成时表示当时持续进行的动作；汉语无需机械添加“正在”，上下文即可自然呈现持续性。
- source_word: τοὺς ὄχλους
  choice: 众人
  rationale: 原文为复数，指聚集的人群；“众人”是庄重而通俗的现代汉语集体表达，避免“群众”在当代语境中的额外色彩。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。句序保留“上船—请求移船—坐下教导”的动作进展；不添加船的动力方式，也不把未完成时过度解释为“开始教导”。脚注标记置于其实际说明的“岸边”之后。
