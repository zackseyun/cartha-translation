revisions:
- from: 然而，关于他的消息越发传开了[a]；许多人聚集而来，要听他讲道，也要使自己的疾病得到医治。
  to: 然而，关于他的消息越发传开；许多群众聚集来听，也来得医治，脱离自己的疾病。[a]
  rationale: 删去原文未明说的“他讲道”，并以“得医治，脱离自己的疾病”恢复θεραπεύεσθαι的被动受益意义及ἀπό所表示的从疾病中脱离。将“许多人”调整为“许多群众”，以较完整呈现ὄχλοι πολλοί。脚注标记移至句末，作为整句中“关于他的消息”的替代译法注释，锚点仍清楚且结构有效。
