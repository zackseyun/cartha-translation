id: LUK.5.15
reference: Luke 5:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: διήρχετο δὲ μᾶλλον ὁ λόγος περὶ αὐτοῦ, καὶ συνήρχοντο ὄχλοι πολλοὶ ἀκούειν καὶ ⸀θεραπεύεσθαι ἀπὸ τῶν ἀσθενειῶν αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/015.yaml
  text: But the report about him spread even more[a], and large crowds were gathering to hear and to be healed of their sicknesses.
translation:
  language: zh_hans
  text: 然而，关于他的消息越发传开；许多群众聚集来听，也来得医治，脱离自己的疾病。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“关于他的话”或“关于他的传闻”。
    reason: 保留ὁ λόγος περὶ αὐτοῦ的词义范围；λόγος在这里可指关于耶稣而流传的话、消息或传闻。
lexical_decisions:
- source_word: διήρχετο
  choice: 传开了
  rationale: 此处未完成时描写消息持续传播；“传开”是自然的现代汉语，也保留传播扩散之意。
- source_word: μᾶλλον
  choice: 越发
  rationale: 保留比较和加强语气，表明传播程度比先前更甚。
- source_word: ὁ λόγος περὶ αὐτοῦ
  choice: 关于他的消息
  rationale: λόγος 在此叙事语境中指有关耶稣的消息或传闻，并非特指具有神学术语色彩的“道”。
- source_word: συνήρχοντο
  choice: 聚集而来
  rationale: 未完成时表示持续或反复发生的聚集；“聚集而来”兼顾众人会合与前来的动态。
- source_word: ὄχλοι πολλοὶ
  choice: 许多人
  rationale: 希腊文直译为“许多群众”；现代汉语用“许多人”更自然，语境仍清楚表达成群聚集。
- source_word: ἀκούειν
  choice: 要听他讲道
  rationale: 不定式表示目的。原文省略所听的对象和内容；按近处语境补出“他讲道”，使汉语完整自然，但不增添具体教导内容。
- source_word: θεραπεύεσθαι
  choice: 要使自己的疾病得到医治
  rationale: 被动不定式表达接受医治；此译保留被动含义，并与后面的疾病自然衔接。
- source_word: ἀπὸ τῶν ἀσθενειῶν αὐτῶν
  choice: 自己的疾病
  rationale: ἀσθένεια 在医治语境中指身体疾病；结合 θεραπεύεσθαι 译为“疾病得到医治”，自然表达从疾病中获医治的含义。
theological_decisions:
- issue: 医治用语的性质
  choice: 按身体疾病得医治来翻译
  alternative: 采用“得以完全”之类可能兼指属灵复原的宽泛表达
  rationale: 直接语境是群众来听并寻求疾病得医治；本节没有明说属灵医治，因此不额外引入这一含义。
- issue: λόγος 是否作神学术语
  choice: 译为“消息”
  alternative: 译为“道”或“圣言”
  rationale: περὶ αὐτοῦ 表明这是关于耶稣而流传的消息；译作神学术语会使经文承载原文在此未明确表达的含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“然而”承接前文转折，“越发传开”保留持续加剧的意味。脚注标记已置于对应正文之后。
