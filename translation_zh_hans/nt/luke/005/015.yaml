  timestamp: '2026-07-14T03:21:49Z'
review_pass:
  verdict: revise
  source_fidelity: 正文准确传达了消息广泛流传、众人前来听和从疾病中得医治的基本意思。但“听他讲道”补入了原文没有明说的动作与内容；“使自己的疾病得到医治”也将被动的“得医治”改写为带有使令意味的表达。应予收敛，以保留原文的省略与被动语态。
  naturalness: “许多人聚集而来”自然，但未充分呈现ὄχλοι πολλοί的“许多/大批群众”。“聚集来听，也来得医治，脱离自己的疾病”在现代标准汉语中通顺、庄重，且较贴近原文的两个并列目的不定式。
  terminology: “关于他的消息”恰当，避免将λόγος误作神学术语。“疾病”和“得医治”准确反映此处身体病患与被医治的语境。脚注可保留“话”和“传闻”作为词汇替代；“传闻”在此指流传的消息，并非必含不实之意。
  issues:
  - severity: medium
    issue: “要听他讲道”增补了“讲道”。
    rationale: ἀκούειν仅为“听”，原文没有说明所听的具体内容，也没有在本节明说耶稣正在“讲道”。汉语可用“来听”保留这种省略。
  - severity: medium
    issue: “也要使自己的疾病得到医治”弱化并改写了原文的被动表达。
    rationale: θεραπεύεσθαι意为“得医治/被医治”；“使自己的疾病得到医治”带出病人主动促成医治的使令结构。改为“得医治，脱离自己的疾病”更直接保留被动受益和ἀπό的离开疾病之意。
  - severity: low
    issue: “许多人”没有明确表达“许多群众”。
    rationale: ὄχλοι πολλοί强调众多聚集的群众；“许多群众”能在不生硬的前提下保留这一集体性。
  revised_text: 然而，关于他的消息越发传开；许多群众聚集来听，也来得医治，脱离自己的疾病。[a]
  revised_footnotes:
