  text: θάμβος γὰρ περιέσχεν αὐτὸν καὶ πάντας τοὺς σὺν αὐτῷ ἐπὶ τῇ ἄγρᾳ τῶν ἰχθύων ⸀ὧν συνέλαβον,
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/009.yaml
  text: For astonishment had seized him and all those with him because of the catch of fish that they had taken,[a]
translation:
  language: zh_hans
  text: 因为他们所捕得的鱼获带来的惊奇笼罩了他和所有与他在一起的人，[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为他们所捕到的鱼，他和所有与他在一起的人都惊奇不已。”
    reason: 保留ὧν συνέλαβον与“鱼”直接相连的关系从句，并提供以状态表达περιέσχεν的自然译法。
lexical_decisions:
- source_word: θάμβος
  choice: 惊骇不已
  rationale: 该词表示强烈而突如其来的震惊、惊异；“惊骇不已”体现这种压倒性的反应，又符合现代汉语叙事语体。
- source_word: γὰρ
  choice: 因为
  rationale: 此连接词说明西门在上一节作出反应的原因；“因为”在汉语中清楚保留其解释关系。
- source_word: περιέσχεν
  choice: 都……惊骇不已
  rationale: 该动词本有围住、笼罩或抓住之意，与“惊骇”连用时表示这种感受完全攫住了他们。汉语用状态表达比直译为“惊骇抓住了”更自然。
- source_word: πάντας τοὺς σὺν αὐτῷ
  choice: 所有同他在一起的人
  rationale: 保留原文所指的全部在场同伴，范围明确，表达自然。
- source_word: ἐπὶ τῇ ἄγρᾳ τῶν ἰχθύων
  choice: 因……这一网鱼
  rationale: ἐπί在此表达原因或依据，ἄγρα指捕获之物或渔获；“这一网鱼”既传达渔获量，也符合现代汉语习惯。
- source_word: ὧν συνέλαβον
  choice: 他们捕到的
  rationale: 关系代词指向鱼，复数动词表明参与捕捞的人不止西门一人；“他们捕到的”准确保留这一点。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“惊骇不已”表达强烈震惊；句末用逗号，以符合本节在上下文中尚未完结的句法结构。
