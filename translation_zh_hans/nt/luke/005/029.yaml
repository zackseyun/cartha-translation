  text: Καὶ ἐποίησεν δοχὴν μεγάλην Λευὶς αὐτῷ ἐν τῇ οἰκίᾳ αὐτοῦ· καὶ ἦν ὄχλος ⸂πολὺς τελωνῶν⸃ καὶ ἄλλων οἳ ἦσαν μετ’ αὐτῶν κατακείμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/029.yaml
  text: And Levi made a great banquet for him in his house[b][a], and there was a large crowd of tax collectors and others who were reclining at table with them.
translation:
  language: zh_hans
  text: 利未在自己家里为耶稣大摆筵席；有一大群税吏和其他人跟他们一同坐席。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “坐席”原文指斜倚在席上用餐，这是古代地中海地区正式宴席中常见的姿势。
    reason: cultural_note
lexical_decisions:
- source_word: δοχὴν μεγάλην
  choice: 大摆筵席
  rationale: δοχή指设宴款待；“大摆筵席”自然、庄重，也传达 μεγάλην 所表示的盛大规模。
- source_word: αὐτῷ
  choice: 为耶稣
  rationale: 代词在上下文中明确指耶稣。汉语若直译“为他”，可能因本句先出现利未而产生指代含混，因此明示姓名以保持原意清楚。
- source_word: ἐν τῇ οἰκίᾳ αὐτοῦ
  choice: 在自己家里
  rationale: 反身表达自然表明房屋属于主语利未，准确传达 αὐτοῦ 在语境中的所指。
- source_word: ὄχλος πολὺς
  choice: 一大群
  rationale: 简洁对应“人数众多的一群”，并与后接的税吏及其他人自然衔接。
- source_word: τελωνῶν
  choice: 税吏
  rationale: 这是福音书语境中通行而准确的译法，保留其社会身份，不在正文加入额外解释。
- source_word: ἄλλων
  choice: 其他人
  rationale: 原文未说明这些人的具体身份；此译保留其不确定性。
- source_word: μετ’ αὐτῶν
  choice: 跟他们一同
  rationale: 按希腊文复数代词直译，不擅自改为单数“跟他”；“他们”的具体涵盖范围仍保留一定语境歧义。
- source_word: κατακείμενοι
  choice: 坐席
  rationale: 该词在宴饮语境中指斜倚用餐。现代汉语“坐席”自然表达参加席宴，不误导读者以为必须采取现代坐姿；古代姿势另以脚注说明。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重且易懂的叙事语体。“大摆筵席”体现宴席的盛大；为避免汉语代词指向不清，将 αὐτῷ 明示为“为耶稣”。原文 μετ’ αὐτῶν 的复数形式保留为“跟他们一同”，不把它改成单数。
