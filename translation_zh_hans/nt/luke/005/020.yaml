  naturalness: “人哪”是现代汉语圣经叙事中自然、庄重且可理解的呼语，既不添加“朋友”的亲昵意味，也避免“你这人”的潜在贬抑色彩。“已经蒙赦免了”比无主语的“已经赦免了”更清楚自然地体现被动意义。
  terminology: “信心”“罪”“赦免”均为准确而通行的神学用语。“蒙赦免”明确保留被动，不预设赦免发生的精确时点或机制。
