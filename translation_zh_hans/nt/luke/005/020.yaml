  rationale: 修订呼语以消除“你这人”在现代汉语中可能产生的责备意味；修订赦罪句为“已经蒙赦免了”，以更明确、自然地表达希腊文完成时被动式。脚注 a 的表述亦作术语层面的澄清。复数“他们的”及赦罪宣告所保留的时态／效力开放性均未改变。
