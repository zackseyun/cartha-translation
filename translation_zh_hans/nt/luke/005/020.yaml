  text: καὶ ἰδὼν τὴν πίστιν αὐτῶν ⸀εἶπεν· Ἄνθρωπε, ἀφέωνταί σοι αἱ ἁμαρτίαι σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/020.yaml
  text: And seeing their faith[a], he said, “Man[c][b], your sins are forgiven.”
translation:
  language: zh_hans
  text: 耶稣看见他们的信心[a]，就说：“人哪，你的罪已经蒙赦免了[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“信靠”。希腊文 πίστις 可译为“信心”或“信靠”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“你的罪已经被赦免了。”希腊文的完成时被动态可强调一个已经完成的行动所产生的当前状态。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: 看见
  rationale: 以自然的汉语承接分词所表达的时间和情境关系；补出主语“耶稣”，符合汉语叙事习惯，且指代在上下文中明确。
- source_word: πίστιν
  choice: 信心
  rationale: 这里指那人及其同伴以行动表现出的信靠；“信心”是现代汉语圣经语境中自然、明确的表达，同时保留“信靠”这一可能的词义侧重。
- source_word: αὐτῶν
  choice: 他们的
  rationale: 保留希腊文复数，不限定只指抬瘫子的人，也不判定必然包括瘫子本人。
- source_word: Ἄνθρωπε
  choice: 你这人
  rationale: 保留对男性个体的直接称呼，又避免把原文解释性地译成带亲昵意味的“朋友”或带社会礼貌色彩的“先生”。
- source_word: ἀφέωνταί
  choice: 已经赦免了
  rationale: 用“已经……了”表达完成时被动态所呈现的、由已完成行动形成的现存结果，同时不进一步断定赦罪发生的精确时点。
- source_word: ἁμαρτίαι
  choice: 罪
  rationale: “罪”在汉语中可作集合名词，自然对应复数 ἁμαρτίαι，并保留其道德和神学含义。
- source_word: σοι ... σου
  choice: 你……你的
  rationale: 以称呼中的“你”和“你的罪”自然体现受益者及所属关系；不机械重复为“你的罪给你赦免了”。
theological_decisions:
- issue: “他们的信心”的范围
  choice: 保留复数“他们的”，不说明具体包括哪些人。
  alternative: 专指抬瘫子的人，或明确指瘫子与同伴共同的信心。
  rationale: 原文 αὐτῶν 为复数，但没有在本节明确界定其全部所指；译文应保留这一开放性。
- issue: 赦罪宣告的时态与效力
  choice: 译作“已经赦免了”，表达已成事实及其当前结果。
  alternative: “赦免了”或“得到赦免了”。
  rationale: 希腊文完成时被动态强调由完成行动产生的现存状态，却没有明确说明这是当场施行的赦免，还是宣告先前已赐下的赦免，因此不在译文中消解这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“你这人”略带直译色彩，但能保留 Ἄνθρωπε 的直接称呼而不增添原文没有的亲昵或尊称。所有脚注标记均已置于正文相应位置。
