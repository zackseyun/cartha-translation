review_pass:
  verdict: revise
  source_fidelity: 原文的动作次序、触摸、意愿、洁净命令，以及麻风立刻离去，均已准确传达。惟“你洁净了吧”带有完成体陈述或征询色彩，未能在现代汉语中清楚表达καθαρίσθητι的命令语气。
  naturalness: “耶稣伸出手来摸他”自然简洁；将命令改为“你洁净吧！”更符合现代汉语中庄重、直接的宣告语气。
  terminology: “洁净”恰当保留καθαρίζω所含的洁净而非仅医疗痊愈的维度。“麻风病”可保留为传统且可辨认的译名，脚注适当说明λέπρα的语义范围；脚注中的“严重”并非原词本身所限定，宜改为较中性的“各类皮肤病”。
  issues:
  - severity: medium
    issue: “你洁净了吧！”的语气不够明确
    rationale: καθαρίσθητι是第二人称单数不定过去被动命令式，意为“要得洁净／洁净吧”。“了吧”在现代汉语通常可理解为完成状态的陈述或带征询意味的说法，弱化了源文直接的命令性宣告。
  - severity: low
    issue: 脚注将λέπρα的范围限定为“多种严重皮肤病”
    rationale: λέπρα在圣经语境确可涵盖不同于现代汉森病的皮肤病，但“严重”不是该词在此处明确表达的语义限定。使用“各类皮肤病”更中性，也更能避免不必要的医学分类断言。
  revised_text: 耶稣伸出手来摸他，说：“我愿意，你洁净吧！”麻风病[a]立刻离开了他。
