  text: καὶ ἐκτείνας τὴν χεῖρα ἥψατο αὐτοῦ ⸀εἰπών· Θέλω, καθαρίσθητι· καὶ εὐθέως ἡ λέπρα ἀπῆλθεν ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/013.yaml
  text: And stretching out his hand[a], he touched him, saying, “I am willing; be cleansed.” And immediately the leprosy left him.
translation:
  language: zh_hans
  text: 耶稣伸出手来摸他，说：“我愿意，你洁净吧！”麻风病[a]立刻离开了他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“一种皮肤病”。圣经中的希腊词λέπρα可泛指各类皮肤病，并不一定专指现代医学所说的麻风病（汉森病）。
    reason: cultural_note
lexical_decisions:
- source_word: ἐκτείνας τὴν χεῖρα
  choice: 伸出手来
  rationale: 自然表达先于主要动作发生的身体动作，同时保留希腊文分词结构所呈现的动作次序。
- source_word: ἥψατο αὐτοῦ
  choice: 摸他
  rationale: ἅπτομαι加属格宾语在此意为触摸；“摸他”简明自然，也保留耶稣亲身接触这人的重要细节。
- source_word: Θέλω
  choice: 我愿意
  rationale: 这里表达意愿和乐意采取行动，不是单纯陈述将来，也不宜弱化为一般的“想要”。
- source_word: καθαρίσθητι
  choice: 你洁净了吧
  rationale: 保留“洁净”而不只译作“医治”，因为原词兼具身体痊愈与礼仪上恢复洁净的含义；“了吧”在现代汉语中自然传达命令所指向的即时成就。
- source_word: εὐθέως
  choice: 立刻
  rationale: 准确表达动作毫无延迟，且符合现代汉语叙事习惯。
- source_word: ἡ λέπρα
  choice: 麻风病
  rationale: 采用读者熟悉的传统对应词，同时以脚注说明古代词义可能比现代汉语医学术语更宽。
- source_word: ἀπῆλθεν ἀπ’ αὐτοῦ
  choice: 离开了他
  rationale: 贴近原文把疾病描写为离开患者的表达，也比单纯译成“痊愈了”更完整地保留原句意象。
theological_decisions:
- issue: καθαρίσθητι在皮肤病得医治的语境中如何翻译
  choice: 你洁净了吧
  alternative: 你痊愈吧／你得洁净吧
  rationale: 原文强调“成为洁净”，既涉及身体恢复，也涉及由不洁状态中恢复；译作“洁净”可避免把含义缩减为纯粹医学上的痊愈。
- issue: Θέλω所表达的是意愿还是将来行动
  choice: 我愿意
  alternative: 我要／我肯
  rationale: 此处直接回应上文求医者关于耶稣是否愿意的陈述，因此明确译出意愿最符合语境，同时不额外引入教义解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“摸他”比“触摸他”更口语自然，但不失严肃；直接引语简洁有力。脚注标记置于其实际说明的“麻风病”之后。
