- from: 耶稣伸出手来摸他，说：“我愿意，你洁净了吧！”麻风病[a]立刻离开了他。
  to: 耶稣伸出手来摸他，说：“我愿意，你洁净吧！”麻风病[a]立刻离开了他。
  rationale: 修订仅将“洁净”的表达改为明确的命令式“你洁净吧”，以对应原文的καθαρίσθητι；并使脚注对λέπρα的医学范围保持审慎、中性。其余译文忠实、自然，脚注标记位置正确。
