review_pass:
  verdict: revise
  source_fidelity: 需修订。“几个人”和“一个瘫痪的人”未反映ἄνδρες及此处ἄνθρωπον所指的男性；改为“几名男子”与“一个瘫痪的男子”，可保留原文的性别指称。将ἐπὶ κλίνης表达为“用床抬着”，既保留该人位于床上，也符合搬运场景。其余主要语义、尝试性的未完成体，以及句末代词均处理恰当。
  naturalness: 修订后句子仍为自然、现代而庄重的普通话。“用床抬着”比将“躺在床上”另拆为一句更紧密地连接原文的搬运动作和床。
  terminology: “瘫痪”准确对应παραλελυμένος；“安放/放在”均可对应θεῖναι，此处采用更简明的“放在”。“看哪”适合保留ἰδού的叙事提示作用。脚注保留κλίνη的词义范围，并说明末尾代词在语境中的所指，未将“耶稣”直接替入正文。
  issues:
  - severity: medium
    issue: 性别指称未保留
    rationale: 原文以ἄνδρες明确指“男子”，并在此叙事语境中以ἄνθρωπον指一名男子。草稿的“几个人”“一个瘫痪的人”泛化了原文的指称，虽自然但损失了源语信息。
  - severity: low
    issue: “躺在床上”拆分后弱化了床与搬运动作的连接
    rationale: ἐπὶ κλίνης修饰正在被搬运的人；“用床抬着”能在汉语中更直接表现他们抬着床上的那人，同时不把κλίνη限定为担架。
  revised_text: 看哪，有几名男子用床抬着一个瘫痪的男子；他们设法把他抬进去，放在他面前。
  revised_footnotes:
