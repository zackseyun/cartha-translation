  text: καὶ ἰδοὺ ἄνδρες φέροντες ἐπὶ κλίνης ἄνθρωπον ὃς ἦν παραλελυμένος, καὶ ἐζήτουν αὐτὸν εἰσενεγκεῖν καὶ ⸀θεῖναι ἐνώπιον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/018.yaml
  text: And behold[a], men were carrying on a bed a man who was paralyzed[b], and they were seeking to bring him in and set him before him.
translation:
  language: zh_hans
  text: 看哪，有几名男子用床抬着一个瘫痪的男子；他们设法把他抬进去，放在他面前。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留原文唤起注意、使叙事场景鲜明的语篇功能；虽略带庄重色彩，在经文叙事中仍清楚自然。
- source_word: ἄνδρες
  choice: 几个人
  rationale: 原词指成年男子；现代汉语在此用“几个人”最自然，而上下文并不依赖其性别信息。
- source_word: φέροντες
  choice: 抬着
  rationale: 以进行性表达对应现在分词，并结合床上载人的场景自然呈现搬运方式。
- source_word: ἐπὶ κλίνης
  choice: 躺在床上
  rationale: κλίνη可指床、卧榻或床铺式担架；“床”保持宽泛，补出“躺”使汉语句法自然，但不把器具限定为担架。
- source_word: ἄνθρωπον
  choice: 一个……的人
  rationale: 指一个具体的人；采用现代汉语自然的名词结构，不额外强调性别。
- source_word: παραλελυμένος
  choice: 瘫痪
  rationale: 准确表达完成时被动分词所描述的持续状态，不额外推断病因或瘫痪程度。
- source_word: ἐζήτουν
  choice: 设法
  rationale: 表达未完成过去时所含的持续尝试意味，比单纯的“想要”更贴合当时正在努力进行的行动。
- source_word: εἰσενεγκεῖν
  choice: 把他抬进去
  rationale: 保留“带入、抬入”的方向意义，并照应前文多人抬床的动作。
- source_word: θεῖναι
  choice: 安放
  rationale: 表达将床上的人置于某处，不超出原文去断定其具体姿势。
- source_word: ἐνώπιον αὐτοῦ
  choice: 在他面前
  rationale: 保留原文代词，不在正文中直接以“耶稣”替换；脚注说明其语境所指。
theological_decisions:
- issue: 句末αὐτοῦ所指为何人
  choice: 在他面前
  alternative: 在耶稣面前
  rationale: 上下文表明所指是耶稣，但希腊文使用代词；正文保留代词，以免把语境解释直接写入正文，同时用脚注澄清。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“看哪”保留原文的提醒作用；其余措辞避免过度古雅。为使长串希腊语结构在现代汉语中清晰自然，分为两句，并用分号区分人物出现与其状态。
