- from: 看哪，有几个人抬着一个瘫痪的人；那人躺在床[a]上。他们设法把他抬进去，安放在他[b]面前。
  to: 看哪，有几名男子用床抬着一个瘫痪的男子；他们设法把他抬进去，放在他面前。
  rationale: 修订仅恢复原文中两处男性指称，并把“床”与“抬着”的句法关系表达得更贴近原文。保留“设法”所体现的持续尝试，保留“他面前”的代词形式，并以脚注说明其语境所指。
