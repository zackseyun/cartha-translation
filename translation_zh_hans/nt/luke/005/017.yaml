source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν μιᾷ τῶν ἡμερῶν καὶ αὐτὸς ἦν διδάσκων, καὶ ἦσαν καθήμενοι Φαρισαῖοι καὶ νομοδιδάσκαλοι οἳ ἦσαν ἐληλυθότες ἐκ πάσης κώμης τῆς Γαλιλαίας καὶ Ἰουδαίας καὶ Ἰερουσαλήμ· καὶ δύναμις κυρίου ἦν εἰς τὸ ἰᾶσθαι ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/017.yaml
  text: And it happened on one of those days that he was teaching[a], and Pharisees and teachers of the law were sitting there, who had come from every village of Galilee and Judea and from Jerusalem; and the power of the Lord was there for him to heal.
translation:
  language: zh_hans
  text: 有一天，耶稣正在教导。法利赛人和律法教师坐在那里；他们是从加利利和犹太各村，以及耶路撒冷来的。主的能力在那里，使他能施行医治[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“要医治他们”，而非“使他能施行医治”。
    reason: textual_variant
lexical_decisions:
- source_word: ἐγένετο ἐν μιᾷ τῶν ἡμερῶν
  choice: 有一天
  rationale: 这是路加常用的叙事引入语；现代汉语用“有一天”自然、简洁，也保留了在一段时期中某一天发生此事的意思。
- source_word: αὐτὸς ἦν διδάσκων
  choice: 耶稣正在教导人
  rationale: 以“耶稣”明确代词所指，避免汉语段落起首使用“他”可能造成的含混；“正在”体现迂回未完成时所表达的持续动作，“人”作为不定受众使汉语表达完整自然。
- source_word: Φαρισαῖοι καὶ νομοδιδάσκαλοι
  choice: 法利赛人和律法教师
  rationale: “法利赛人”采用通行译名；“律法教师”直接体现复合词中教导律法之意，不额外解释其身份或权威。
- source_word: καθήμενοι
  choice: 坐在那里
  rationale: 既呈现他们坐着的状态，也用“在那里”自然交代其处于耶稣教导的现场。
- source_word: ἐληλυθότες
  choice: 是……来的
  rationale: 这一结构在现代汉语中自然表达他们此前从各地来到、此刻仍在场的结果状态。
- source_word: ἐκ πάσης κώμης τῆς Γαλιλαίας καὶ Ἰουδαίας καὶ Ἰερουσαλήμ
  choice: 从加利利和犹太的各个村庄，以及耶路撒冷来
  rationale: “各个村庄”保留 πάσης 的分布意义和 κώμη 的乡村聚落含义；另列“耶路撒冷”，清楚区分城市与加利利、犹太两地。
- source_word: δύναμις κυρίου
  choice: 主的能力
  rationale: 保留属格结构和神圣能力的神学分量；κύριος 依上下文译作“主”，不进一步限定其所指。
- source_word: ἦν εἰς τὸ ἰᾶσθαι αὐτόν
  choice: 也在那里，使他能施行医治
  rationale: “使他能施行医治”将 αὐτόν 理解为不定式的逻辑主语，并避免补出本读法没有明说的受事对象；“施行医治”在汉语中可不带宾语，保留原文表达上的张力。
theological_decisions:
- issue: δύναμις κυρίου ἦν εἰς τὸ ἰᾶσθαι αὐτόν 中医治者与受事者的关系
  choice: 译为主的能力在那里，使耶稣能施行医治
  alternative: 主的能力在那里，要医治他们；或主的能力与他同在，使他医治人
  rationale: 所给 SBLGNT 正文读 αὐτόν，不是复数受词。正文因此把它理解为不定式的逻辑主语，同时不补出“他们”或特定病人，也不把“与他同在”作为原文明确陈述加入译文。抄本异文则在脚注中说明。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。用较短句和分号整理希腊文长句，使现场人物、来源地和主的能力三个层次清楚；避免古雅的“有一日”“教法师”等表达。
