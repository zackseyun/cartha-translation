revisions:
- from: 有一天，耶稣正在教导人。法利赛人和律法教师也坐在那里；他们是从加利利和犹太的各个村庄，以及耶路撒冷来的。主的能力也在那里，使他能施行医治[a]。
  to: 有一天，耶稣正在教导。法利赛人和律法教师坐在那里；他们是从加利利和犹太各村，以及耶路撒冷来的。主的能力在那里，使他能施行医治[a]。
  rationale: 修订仅删除原文未明示的“人”，澄清“各村”分别属于加利利和犹太，并使异文脚注明确对照正文。保留“使他能施行医治”，以遵循所给SBLGNT正文αὐτόν及英语审计所采用的理解，同时不补出医治对象。
