  text: ⸀καὶ οὐδεὶς πιὼν ⸀παλαιὸν θέλει νέον· λέγει γάρ· Ὁ παλαιὸς ⸀χρηστός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/039.yaml
  text: And no one[a], after drinking old wine, wants new, for he says, ‘The old is good.’
translation:
  language: zh_hans
  text: 没有人喝了陈酒以后想喝新酒，因为他说：“陈酒好。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作：“陈酒更好。”
    reason: textual_variant
lexical_decisions:
- source_word: οὐδεὶς
  choice: 没有人
  rationale: 泛指任何人；“没有人”是自然、现代且不带性别限定的汉语表达。
- source_word: πιὼν παλαιὸν
  choice: 喝惯了陈酒以后
  rationale: 不定过去时分词表示先于主句的动作；结合下文所表达的偏好，“喝惯了”以自然汉语传达饮过陈酒后形成的口味，同时“以后”保留时间关系。
- source_word: θέλει νέον
  choice: 还想喝新酒
  rationale: θέλει在此表示意愿或偏好；汉语补出语境中省略的“酒”和动词“喝”，使句意自然清楚。“还”突出喝过陈酒之后不愿转向新酒的语势。
- source_word: λέγει γάρ
  choice: 因为他说
  rationale: γάρ说明前句的理由；“因为他说”自然引出直接引语，并保留解释关系。
- source_word: Ὁ παλαιὸς
  choice: 陈的
  rationale: 原文以形容词名词化，省略“酒”。“陈的”保留这一简洁结构，所指在上下文中清楚。
- source_word: χρηστός
  choice: 好
  rationale: χρηστός在此表示令人满意、可取或可口；“好”最宽泛，也不把原文擅自改成比较级“更好”。
theological_decisions:
- issue: 酒之新旧在比喻中的评价是否应译成比较级
  choice: 陈的好
  alternative: 陈的更好
  rationale: SBLGNT正文的χρηστός是正面评价“好”，并非比较级。译文保留这一措辞，不因传统译法而预先断定新旧二者的相对优劣，从而保留比喻本身的张力。
translation_notes:
  register: 采用现代、庄重而口语可懂的表达。“陈酒”比“旧酒”更符合现代汉语谈酒的习惯；直接引语保持格言式简洁。脚注标记置于整节末尾，对应异文“陈的更好”。
