  source_fidelity: 原译整体准确地传达了持续讲述、比喻、从新衣服取布补旧衣服，以及两个负面后果。可是“从新衣服上撕下一块补丁”容易令人理解为新衣服本来已有一块补丁；ἐπίβλημα在此是取下后用作补缀的布片。改为“撕下一块布／那块补布”可避免这一不必要的含义。
  naturalness: 原文总体自然庄重。“他既会撕坏新的衣服”虽可懂，但“他会把新衣服撕坏”更顺畅；以“而”连接第二后果也更清楚。
  terminology: “比喻”“新衣服／旧衣服”“不相配”均恰当。“补布”在末句能表达ἐπίβλημα的补缀用途，同时不暗示它在新衣服上原已是补丁。脚注中应将希腊语aorist准确称为“不定过去分词”，而非“简单过去分词”。
