  text: ἔλεγεν δὲ καὶ παραβολὴν πρὸς αὐτοὺς ὅτι Οὐδεὶς ἐπίβλημα ⸀ἀπὸ ἱματίου καινοῦ ⸀σχίσας ἐπιβάλλει ἐπὶ ἱμάτιον παλαιόν· εἰ δὲ μήγε, καὶ τὸ καινὸν ⸀σχίσει καὶ τῷ παλαιῷ οὐ ⸂συμφωνήσει τὸ ἐπίβλημα⸃ τὸ ἀπὸ τοῦ καινοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/036.yaml
  text: 'He was also telling them a parable: “No one tears a patch from a new garment and puts it on an old garment[a]. Otherwise, he will tear the new one[b], and the patch from the new will not match the old.”'
translation:
  language: zh_hans
  text: 他又对他们讲了一个比喻：“没有人从新衣服上撕下一块布，补在旧衣服上[a]；不然，他会把新衣服撕坏，而从新衣服上撕下来的那块补布也与旧衣服不相配[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 按希腊文的形式，也可较直译为：“没有人从新衣服上撕下一块布后，把它放在旧衣服上。”原文用不定过去分词表示先“撕下”，再“放上”。
    reason: lexical_alternative
  - marker: b
    text: “不相配”也可译作“不合适”或“不协调”。希腊文动词在这里表示那块从新衣服上取下的补布与旧衣服不能彼此吻合或协调。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν δὲ καὶ
  choice: 他又……讲了
  rationale: ἔλεγεν是未完成时，叙事中可表示当时持续进行的讲述；现代汉语在单节叙事中用“讲了”更自然。“又”综合表达δὲ καὶ的承接与添加意味。
- source_word: παραβολὴν
  choice: 一个比喻
  rationale: “比喻”是路加福音中παραβολή的通行译法，既保留其文学类别，也容易为现代读者理解。
- source_word: ἐπίβλημα
  choice: 一块补丁
  rationale: 该词在衣物语境中指用来补缀的布片；“补丁”准确表达其用途，“一块”符合现代汉语量词习惯。
- source_word: ἀπὸ ἱματίου καινοῦ
  choice: 从新衣服上
  rationale: ἱμάτιον可泛指衣服或外衣；此处译作“衣服”不把范围不必要地限于某一种服装。
- source_word: σχίσας ἐπιβάλλει
  choice: 撕下一块……补在
  rationale: σχίσας是先于主要动作的简单过去分词，译文以连续动词自然呈现“撕下后放上”的动作次序；“补在”符合补丁语境，但不具体增添原文没有明说的缝纫方式。
- source_word: εἰ δὲ μήγε
  choice: 不然
  rationale: 这是引出相反后果的条件表达，“不然”简洁、自然，并保留警示性的转折。
- source_word: καὶ τὸ καινὸν σχίσει
  choice: 他既会撕坏新的衣服
  rationale: σχίσει是主动语态将来时，隐含主语仍是做这件事的人；“撕坏”表达从新衣服上撕取布片所造成的损坏。“既……也……”体现两个并列的不良后果。
- source_word: οὐ συμφωνήσει
  choice: 不相配
  rationale: συμφωνέω在此表示彼此不协调、不适合；“不相配”能自然涵盖外观或适用性上的不协调，而不武断限定为尺寸不合。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“新衣服／旧衣服”和“补丁”保持意象清晰；分号及“既……也……”使原文所列的两个后果层次分明。
