source:
  edition: SBLGNT
  text: καὶ μὴ εὑρόντες ποίας εἰσενέγκωσιν αὐτὸν διὰ τὸν ὄχλον ἀναβάντες ἐπὶ τὸ δῶμα διὰ τῶν κεράμων καθῆκαν αὐτὸν σὺν τῷ κλινιδίῳ εἰς τὸ μέσον ἔμπροσθεν τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/019.yaml
  text: And not finding a way to bring him in because of the crowd[a], they went up on the roof and lowered him with his mat through the tiles into the middle[c][b], in front of Jesus.
translation:
  language: zh_hans
  text: 他们因人多，找不到怎样把他抬进去[a]，就上到屋顶，从屋瓦间[b]把他连同小床[c]放下去，放到中间，在耶稣面前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“找不到从哪里把他抬进去。”原文的说法既可侧重方式，也可侧重进入的路径。
    reason: lexical_alternative
  - marker: b
    text: 直译：“穿过屋瓦。”路加的措辞反映了铺瓦的屋顶结构。
    reason: cultural_note
  - marker: c
    text: 或译：“小卧榻”或“担架”。原词指小床或供人躺卧的垫具。
    reason: lexical_alternative
lexical_decisions:
- source_word: ποίας εἰσενέγκωσιν
  choice: 找不到怎样把他抬进去
  rationale: ποίας在此为省略式用法，可指“怎样”或“从哪条路”；“怎样把他抬进去”在现代汉语中自然，也保留方式与进路两方面的可能含义。上下文表明此人由他人抬着，因此用“抬”比宽泛的“带”更贴合场景。
- source_word: διὰ τὸν ὄχλον
  choice: 因人多
  rationale: διά加宾格在此表示原因；“因人多”简洁自然，说明人群构成阻碍，而不是说他们要穿过人群。
- source_word: ἀναβάντες ἐπὶ τὸ δῶμα
  choice: 上到屋顶
  rationale: δῶμα指房屋顶部或屋顶平台；“上到屋顶”清楚表达向上移动及到达屋顶，且不额外假定攀爬方式。
- source_word: διὰ τῶν κεράμων
  choice: 从屋瓦间
  rationale: κέραμος复数指屋瓦。“从屋瓦间”保留路加所写的瓦顶建筑细节，同时以自然汉语表达从瓦顶处向下通过。
- source_word: καθῆκαν
  choice: 放下去
  rationale: 该动词表示从上方向下降低。“放下去”是清楚的现代汉语，不必使用较生僻的“缒下”。
- source_word: σὺν τῷ κλινιδίῳ
  choice: 连同小床
  rationale: κλινίδιον是表示小床、卧具的指小形式。“小床”既反映词义，也避免把它过度具体化为现代医疗器械式的担架。
- source_word: εἰς τὸ μέσον
  choice: 放到中间
  rationale: 直译其进入中央或当中位置的空间意义；不擅自限定为房间中央或人群中央。
- source_word: ἔμπροσθεν τοῦ Ἰησοῦ
  choice: 正好在耶稣面前
  rationale: 表达相对于耶稣的空间位置；“面前”在现代汉语中明确自然，“正好”顺畅连接其被放下后的所在位置。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。句式按行动顺序推进；避免生僻的“缒下”和可能带出现代医疗联想的正文用词“担架”。所有脚注标记均置于所说明的词组之后。
