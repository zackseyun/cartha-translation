id: LUK.5.12
reference: Luke 5:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ εἶναι αὐτὸν ἐν μιᾷ τῶν πόλεων καὶ ἰδοὺ ἀνὴρ πλήρης λέπρας· ⸂καὶ ἰδὼν⸃ τὸν Ἰησοῦν πεσὼν ἐπὶ πρόσωπον ἐδεήθη αὐτοῦ λέγων· Κύριε, ἐὰν θέλῃς δύνασαί με καθαρίσαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/012.yaml
  text: And it happened that while he was in one of the towns[a], behold, there was a man full of leprosy. And when he saw Jesus, he fell on his face and begged him, saying, “Lord, if you are willing[b], you can cleanse me.”
translation:
  language: zh_hans
  text: 有一次，耶稣在一座城里时，看哪，有一个浑身长满麻风[a]的人。他看见耶稣，就俯伏在地，向他恳求，说：“主啊，你若愿意，就能使我洁净[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “麻风”所译的希腊语可泛指多种严重的皮肤病，不一定专指现代医学所称的汉森病。原文直译为“满了麻风”，强调病情严重，遍及全身。
    reason: 说明古代疾病名称的语义范围，并保留πλήρης的强调作用。
  - marker: b
    text: 或译“使我清洁”。这里的“洁净”既可指身体上的病得医治，也包含恢复礼仪洁净和社会生活的意味。
    reason: 说明καθαρίζω在身体、礼仪和社会层面的复合含义。
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ εἶναι αὐτὸν
  choice: 有一次，耶稣在
  rationale: 以自然的现代汉语表达路加引入场景的叙事句式，并将希腊语的时间结构清楚呈现出来。
- source_word: ἐν μιᾷ τῶν πόλεων
  choice: 在一座城里
  rationale: πόλις可指城或较大的市镇；“一座城”简洁自然，也不额外推定其规模。
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留这一话语标记带来的突然性和画面感；用语庄重，但现代读者仍能理解。
- source_word: πλήρης λέπρας
  choice: 满身患了麻风病
  rationale: 既保留πλήρης所强调的病情遍及全身、十分严重，也使用读者熟悉的传统病名；脚注说明古代λέπρα的范围可能比现代汉语的“麻风病”更广。
- source_word: ἰδὼν τὸν Ἰησοῦν
  choice: 他一看见耶稣
  rationale: 将不定过去时分词自然处理为紧接着发生的时间从句，体现动作的迅速衔接。
- source_word: πεσὼν ἐπὶ πρόσωπον
  choice: 就俯伏在地
  rationale: 自然表达脸朝地伏下的姿势，保留谦卑和迫切恳求的意味。
- source_word: ἐδεήθη αὐτοῦ
  choice: 恳求他
  rationale: 传达强烈、迫切的请求，比普通的“求”更贴近原文语气。
- source_word: Κύριε
  choice: 主啊
  rationale: 保留对耶稣的尊称以及上下文可能具有的基督论意味，同时不把该称呼在此处的含义解释得过满。
- source_word: ἐὰν θέλῃς
  choice: 你若愿意
  rationale: 准确表达意愿；病人并未怀疑耶稣的能力，而是把请求交托于他的意愿。
- source_word: δύνασαί με καθαρίσαι
  choice: 就能使我洁净
  rationale: “能”表达能力，“使我洁净”保留καθαρίζω兼具身体康复以及礼仪、社会身份恢复的含义。
theological_decisions:
- issue: λέπρα与καθαρίζω在医治叙事中的译法
  choice: 正文采用“麻风病”和“使我洁净”
  alternative: “皮肤病”和“治好我”
  rationale: 古代λέπρα可能涵盖多种皮肤病，不一定等同于现代医学所称的汉森病，但“麻风病”是熟悉的传统译法，故以脚注交代其语义范围。καθαρίζω不只是身体得医治，还涉及礼仪和社会层面的洁净，因此不简化为“治好”。
- issue: 耶稣受称为κύριος
  choice: 译作“主”
  alternative: “先生”或“夫子”
  rationale: “主”既可表达尊敬，也保留潜在的基督论回响；不在译文中强行判定说话者对此称号理解到了何种程度。
- issue: “你若愿意”的神学张力
  choice: 保留条件句，不补充解释
  alternative: 意译为“只要你肯”或说明病人确信耶稣必会医治
  rationale: 原文明确肯定耶稣有能力，却把是否施行洁净置于他的意愿之下；译文保留这种信靠与恳求之间的张力。
translation_notes:
  register: 采用现代、自然而庄重的叙事语体。“看哪”刻意保留原文突显新人物出现的效果；“俯伏在地”“恳求”“主啊”清楚易懂，同时保持经文场景的肃穆感。脚注标记均放在其实际解释的词语之后。
