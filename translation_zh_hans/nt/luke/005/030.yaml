  text: καὶ ἐγόγγυζον οἱ ⸂Φαρισαῖοι καὶ οἱ γραμματεῖς αὐτῶν⸃ πρὸς τοὺς μαθητὰς αὐτοῦ λέγοντες· Διὰ τί μετὰ τῶν τελωνῶν καὶ ἁμαρτωλῶν ἐσθίετε καὶ πίνετε;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/030.yaml
  text: And the Pharisees and their scribes were grumbling to his disciples[a], saying, “Why do you eat and drink with tax collectors and sinners?”
translation:
  language: zh_hans
  text: 法利赛人和他们的经学家不断地向耶稣的门徒嘀咕抱怨[a]，说：“你们为什么跟税吏和罪人一起吃喝？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“发怨言”。原文动词可指低声、持续或反复地表达不满，并非只是正式提出异议。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγόγγυζον
  choice: 发怨言
  rationale: 未完成时表示持续或反复的抱怨；“发怨言”保留了低声不满、埋怨的负面意味，又符合现代汉语叙事表达。
- source_word: γραμματεῖς
  choice: 经学家
  rationale: 指熟悉并讲解律法的历史群体；“经学家”比现代职业色彩较强的“文士”更便于普通读者理解，同时不过度释义为“律法教师”。
- source_word: αὐτῶν
  choice: 他们的
  rationale: 按希腊语句法自然地修饰“经学家”，保留其与法利赛人的关联，不进一步界定这种关系。
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: 向耶稣的门徒
  rationale: πρός加宾格在此表示言语所指向的对象；为避免单节中“他的”指代不明，明确译为“耶稣的”。
- source_word: Διὰ τί
  choice: 为什么
  rationale: 现代汉语中自然、直接的疑问表达。
- source_word: τελωνῶν
  choice: 税吏
  rationale: 福音书语境中的通行历史称谓，简洁地保留该群体当时所带有的社会负面色彩。
- source_word: ἁμαρτωλῶν
  choice: 罪人
  rationale: 直接保留说话者对这一群体的道德与宗教性称呼，不改写为较弱的描述。
- source_word: ἐσθίετε καὶ πίνετε
  choice: 吃喝
  rationale: 保留“吃”和“喝”两个具体动作；在汉语中合为“吃喝”自然简洁，也不把它扩释为“交往”或“同席”。
- source_word: μετά
  choice: 跟……一起
  rationale: 清楚表达与这些人共同吃喝，保留同席交往的具体意味。
- source_word: καὶ
  choice: 就
  rationale: 句首连接词在汉语叙事中用“就”自然承接上文，并呈现随后的反应，避免生硬直译为“并且”。
theological_decisions:
- issue: 与“税吏和罪人”同席吃喝的社会—宗教张力
  choice: 原样保留具体质问，不解释其礼仪、道德或社会依据
  alternative: 扩译为他们认为与不洁或道德败坏者同席不当
  rationale: 原文只陈述对共同吃喝的质问，并未明说反对的完整理由；译文应让张力保留在叙事中，而不代说话者补充神学解释。
- issue: “罪人”是说话者的群体标签还是叙述者的绝对判定
  choice: 保留“罪人”这一原文称谓，不在正文中界定其视角
  alternative: 译成“所谓的罪人”以明确归因于法利赛人
  rationale: 希腊文本不加“所谓的”；加入该词会预先解决叙事视角上的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“经学家”兼顾历史身份与当代可理解性；“发怨言”略带经文语体但仍自然。正文中的脚注标记[a]与脚注对应。
