  text: ὁ ⸀δὲ εἶπεν πρὸς αὐτούς· Μὴ δύνασθε τοὺς υἱοὺς τοῦ νυμφῶνος ἐν ᾧ ὁ νυμφίος μετ’ αὐτῶν ἐστιν ποιῆσαι ⸀νηστεῦσαι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/034.yaml
  text: And he said to them[a], “You cannot make the wedding guests fast while the bridegroom is with them, can you?”
translation:
  language: zh_hans
  text: 耶稣对他们说：“当新郎还和他们在一起时，你们难道能叫宾客[a]禁食吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “宾客”原文直译为“婚房之子”，是指陪伴新郎、参加婚宴的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ δύνασθε
  choice: 你们难道能……吗？
  rationale: μή与直陈语气构成预期否定回答的反问；“难道能……吗”自然保留了“当然不能”的修辞力量。
- source_word: υἱοὺς τοῦ νυμφῶνος
  choice: 宾客
  rationale: 该习语字面为“婚房之子”，指参与婚宴、陪伴新郎的人；结合本句的婚礼语境，“宾客”简明自然，脚注保留其字面意象与可能范围。
- source_word: νυμφίος
  choice: 新郎
  rationale: 这是现代汉语中准确、自然的对应词，并保留本句关键的婚礼意象。
- source_word: μετ’ αὐτῶν ἐστιν
  choice: 和宾客在一起
  rationale: 直接表达新郎正在与这些婚宴参与者同在；补出“宾客”比代词“他们”更清楚，所指未变。
- source_word: ποιῆσαι νηστεῦσαι
  choice: 叫宾客禁食
  rationale: ποιέω加不定式具有使役含义；“叫……禁食”既保留使役结构，也符合现代汉语表达。
- source_word: νηστεῦσαι
  choice: 禁食
  rationale: “禁食”是宗教语境中通行而清楚的对应词，不作不必要的解释性扩展。
- source_word: ὁ δὲ εἶπεν πρὸς αὐτούς
  choice: 耶稣对他们说
  rationale: 希腊文主语为代词“他”，中文按上文所指明确为“耶稣”，避免独立经节中指代不清。
theological_decisions:
- issue: 耶稣与新郎形象的隐喻关系
  choice: 保留“新郎”的形象，不在正文中明说新郎就是耶稣
  alternative: 解释性译为“我这位新郎”或在正文中明确耶稣自比新郎
  rationale: 原文借婚礼场景形成隐喻，但本节没有直接解释其全部神学意义；保留形象可避免把隐含关系过度明文化。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“难道能……吗”体现预期否定回答的反问；“叫……禁食”保留原文使役含义。脚注标记置于整句引语末，说明婚礼习语。
