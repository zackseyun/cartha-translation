  naturalness: “耶稣察觉了他们的心思，就回应他们说”以及“你们为什么在心里这样议论呢？”均为自然、清楚且庄重的现代标准汉语。“回应他们说”虽带有适度的圣经叙事色彩，但在此特别适合表达对内心议论的答复。
