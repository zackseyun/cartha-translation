source:
  edition: SBLGNT
  text: ἐπιγνοὺς δὲ ὁ Ἰησοῦς τοὺς διαλογισμοὺς αὐτῶν ἀποκριθεὶς εἶπεν πρὸς αὐτούς· Τί διαλογίζεσθε ἐν ταῖς καρδίαις ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/022.yaml
  text: But Jesus[a], perceiving their thoughts, answered and said to them, “Why are you reasoning in your hearts?”
translation:
  language: zh_hans
  text: 耶稣察觉了他们的心思[a]，就回应他们说：“你们为什么在心里这样议论呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“知道了他们的议论”。
    reason: ἐπιγνοὺς与διαλογισμούς也可较形式对应地译为“知道了……的议论”；正文采用较自然的“察觉了……的心思”。
lexical_decisions:
- source_word: ἐπιγνοὺς
  choice: 察觉了
  rationale: 这个不定过去时分词表示耶稣确知、识破了他们内在的想法。“察觉了”在现代汉语中自然，也只陈述他知道此事，不额外说明他以何种方式得知。
- source_word: δὲ
  choice: 就
  rationale: δέ在此承接上文并带出耶稣针对内心议论的回应。汉语用“就”自然呈现叙事转折和随即回应的关系，无须生硬译为“但是”。
- source_word: τοὺς διαλογισμοὺς αὐτῶν
  choice: 他们的心思
  rationale: διαλογισμοί指他们心中的思量、议论。“心思”清楚自然，并与下文较具动作性的“议论”相区分。
- source_word: ἀποκριθεὶς εἶπεν πρὸς αὐτούς
  choice: 就回应他们说
  rationale: 保留“回应”这一要素，反映耶稣所说的话是在回答他们未说出口的议论；“回应……说”也保留了原文两个动词的叙事表达。
- source_word: Τί διαλογίζεσθε
  choice: 为什么……这样议论
  rationale: τί在这个问句中询问他们如此思量的缘由，汉语译作“为什么”最自然；“这样议论”体现现在时所表达的持续内在思量。
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: 在心里
  rationale: καρδία在此指人的内在思想领域。“在心里”既保留圣经关于“心”的表达，也符合现代汉语习惯。
theological_decisions:
- issue: 耶稣如何知道他人的内心思想
  choice: 直译为耶稣“察觉了”他们的心思，不解释其认知方式
  alternative: 明确译成“以超自然方式知道”，或弱化为“猜到”
  rationale: 经文肯定耶稣知道他们内在的议论，却没有说明这种知识的机制。译文既不添加超自然方式的解释，也不把确知弱化为猜测。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“回应他们说”略带圣经叙事风格，特意保留耶稣回答未出口之思想这一语义；问句则用自然的现代汉语表达。
