source:
  edition: SBLGNT
  text: καὶ οὐδεὶς βάλλει οἶνον νέον εἰς ἀσκοὺς παλαιούς· εἰ δὲ μήγε, ῥήξει ὁ ⸂οἶνος ὁ νέος⸃ τοὺς ἀσκούς, καὶ αὐτὸς ἐκχυθήσεται καὶ οἱ ἀσκοὶ ἀπολοῦνται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/037.yaml
  text: And no one puts new wine into old wineskins[a]. Otherwise, the new wine will burst the wineskins, and it will be spilled[c][b], and the wineskins will be ruined.
translation:
  language: zh_hans
  text: 没有人把新酒装进旧皮袋[a]；不然，新酒会胀破皮袋，酒会流出来，皮袋也会毁坏。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“旧的皮囊”；这里指用兽皮制成、用来盛酒的容器。
    reason: lexical_alternative
lexical_decisions:
- source_word: βάλλει
  choice: 装进
  rationale: 原词泛指放入；在酒与皮袋的语境中，“装进”自然、准确，又不像“倒进”那样把动作方式说得过细。
- source_word: οἶνον νέον
  choice: 新酒
  rationale: 现代汉语中自然简洁，也保留酿造与发酵语境。
- source_word: ἀσκοὺς παλαιούς
  choice: 旧皮袋
  rationale: ἀσκός指用兽皮制成、可盛液体的容器；“皮袋”准确且便于普通读者理解。
- source_word: εἰ δὲ μήγε
  choice: 不然
  rationale: 自然表达若采取前述做法所导致的后果。
- source_word: ῥήξει
  choice: 会胀破
  rationale: 原词表示使之破裂；“胀破”结合新酒发酵的情境，清楚呈现酒使皮袋破裂的因果关系。
- source_word: ἐκχυθήσεται
  choice: 会流出来
  rationale: 被动形式描述酒从破裂的皮袋中倾泻、流失；“流出来”符合汉语表达，也不过度限定为人为倾倒。
- source_word: ἀπολοῦνται
  choice: 会毁坏
  rationale: 用于容器时表示毁损、失去功用；“毁坏”保留其强度，又不暗示彻底消灭。
- source_word: καὶ αὐτός
  choice: 酒会
  rationale: αὐτός回指新酒并带一定强调；汉语重提“酒”可明确指代，避免用“它”造成生硬或歧义。
- source_word: οὐδεὶς
  choice: 没有人
  rationale: 准确传达全称否定，并符合庄重自然的现代汉语。
