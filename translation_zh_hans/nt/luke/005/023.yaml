  text: τί ἐστιν εὐκοπώτερον, εἰπεῖν· Ἀφέωνταί σοι αἱ ἁμαρτίαι σου, ἢ εἰπεῖν· ⸀Ἔγειρε καὶ περιπάτει;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/023.yaml
  text: 'Which is easier: to say[a], ‘Your sins are forgiven you,’ or to say, ‘Rise and walk’?”'
translation:
  language: zh_hans
  text: 哪一件更容易：说‘你的罪得赦免了[a]’，还是说‘起来，行走’？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你的罪已经蒙赦免了。”
    reason: lexical_alternative
lexical_decisions:
- source_word: τί ἐστιν εὐκοπώτερον
  choice: 哪一件更容易
  rationale: τί与比较级εὐκοπώτερον构成对两种说法相对难易的提问。“哪一件更容易”自然地保留了比较意味。
- source_word: εἰπεῖν
  choice: 说
  rationale: 不定式引出两句可供比较的话；译作“说”简明自然，并在两个并列分句中重复，以保留原文结构。
- source_word: Ἀφέωνταί
  choice: 得赦免了
  rationale: ἀφίημι在此指罪得到赦免。该动词为完成时被动形式，表达先前行动造成的现今状态；“得赦免了”既传达赦罪及其现有效果，也不明说施动者。
- source_word: σοι
  choice: 你的
  rationale: 与“罪”合译为汉语自然的领属表达“你的罪”，保留对当事人的直接指向。
- source_word: αἱ ἁμαρτίαι σου
  choice: 你的罪
  rationale: 按现代汉语习惯译出领属关系；“罪”作为集合性概念无需机械标示复数。
- source_word: ἢ
  choice: 还是
  rationale: 用于选择问句中连接两个备选说法，比“或者”更符合现代汉语问句习惯。
- source_word: Ἔγειρε
  choice: 起来
  rationale: 命令式要求那人起身；“起来”准确、简洁，也符合现代汉语表达。
- source_word: καὶ περιπάτει
  choice: 行走
  rationale: 此处指实际走路，并非比喻性的生活行为。“行走”与“起来”搭配，保留简洁而庄重的语体。
theological_decisions:
- issue: 如何表达赦罪宣告中的完成时被动形式，而不额外限定赦罪的施动者或加入教义解释
  choice: 你的罪得赦免了
  alternative: 你的罪已经蒙赦免了
  rationale: 主句表达罪已处于获赦免的状态，并保留原文未明说施动者的被动意味；脚注提供更明显呈现完成结果的译法，但正文不让汉语时体承担超过上下文的神学分量。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。保留原文两次“说”的平行结构，以及赦罪宣告与医治命令之间的对照；引号内命令不添加原文没有的语气词。
