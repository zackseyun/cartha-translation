  yaml_path: translation/nt/luke/005/016.yaml
  text: But he would withdraw in the wilderness and pray[a].
translation:
  language: zh_hans
  text: 但他却常退到荒僻的地方祷告[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“但他自己不断退到各处荒野祷告。”希腊文较直译地使用未完成时结构和分词，表达持续或惯常的行动。
    reason: 说明较直译的表达及原文的体貌含义。
lexical_decisions:
- source_word: αὐτὸς
  choice: 他
  rationale: 希腊文显式使用代词，略带强调；中文用“他”自然承接上文，而“却”也传达了语境中的对照。
- source_word: δὲ
  choice: 但……却
  rationale: δέ在这里表示温和的转折：尽管耶稣的名声传开、群众聚集，他仍退开祷告。中文以“但……却”自然呈现这一关系。
- source_word: ἦν ὑποχωρῶν
  choice: 常退到
  rationale: 未完成时的εἰμί与现在分词构成迂回结构，最自然地表达过去反复或惯常的行动；“常”明确呈现这一体貌，“退到”保留离开人群、退往别处的含义。
- source_word: ἐν ταῖς ἐρήμοις
  choice: 荒僻的地方
  rationale: 复数形式指无人居住、偏僻安静的各处，并不一定专指沙漠；“荒僻的地方”既准确又符合现代汉语。与“退到”搭配时，中文自然把地点理解为退往之处。
- source_word: καὶ
  choice: （不另译）
  rationale: 该连词协调“退去”和“祷告”这两个相伴的惯常行动；中文中“退到……祷告”已自然表达目的及相伴关系，若机械加“并且”反而显得累赘。
- source_word: προσευχόμενος
  choice: 祷告
  rationale: 该分词与ὑποχωρῶν同受ἦν支配，描述同时发生的惯常行动；中文用“祷告”简洁自然。
theological_decisions:
- issue: 耶稣行动的体貌
  choice: 将本节理解为耶稣惯常退到荒僻之处祷告
  alternative: 理解为某一次具体的退去和祷告
  rationale: ἦν加两个现在分词的未完成时结构，结合上下文，最自然地表示持续或反复的惯常行动。这是语法和叙事层面的判断，不附加其他教义推论。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“荒僻的地方”避免把复数的ἐρήμοις误限为特定的沙漠地貌；“常”自然体现原文未完成时结构所表达的惯常性。
