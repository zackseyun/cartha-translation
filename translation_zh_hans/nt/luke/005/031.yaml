  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν πρὸς αὐτούς· Οὐ χρείαν ἔχουσιν οἱ ὑγιαίνοντες ἰατροῦ ἀλλὰ οἱ κακῶς ἔχοντες·
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/031.yaml
  text: And Jesus answered them[a], “Those who are healthy have no need of a physician, but those who are sick do.”
translation:
  language: zh_hans
  text: 耶稣回答他们说：“健康的人不需要医生，有病的人才需要。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν πρὸς αὐτούς
  choice: 回答他们说
  rationale: 这一分词与后面的言说动词构成常见的叙事表达；译为“回答他们说”既保留回应的意味和受话者，也符合现代汉语习惯。
- source_word: Οὐ χρείαν ἔχουσιν
  choice: 不需要
  rationale: 自然传达“没有需要”的含义，简洁而符合现代汉语表达。
- source_word: οἱ ὑγιαίνοντες
  choice: 健康的人
  rationale: 准确表达该名词化现在分词所指处于健康状态的一类人，并与下文形成清楚对照。
- source_word: ἰατροῦ
  choice: 医生
  rationale: “医生”是现代普通话中对ἰατρός最自然、庄重且普遍易懂的对应词。
- source_word: οἱ κακῶς ἔχοντες
  choice: 有病的人
  rationale: κακῶς ἔχειν在此是“患病、身体不适”的习语；“有病的人”自然准确，并与“健康的人”形成对照。
- source_word: ἀλλὰ
  choice: 才
  rationale: 在汉语对比结构中用“才”自然表达“不是前者，而是后者”的强烈转折，并补足后半句省略的“不需要/需要”。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的标准普通话。“健康的人……有病的人……”保留原文格言式的对照；后句补出“需要”，以符合汉语表达，同时不改变原意。
