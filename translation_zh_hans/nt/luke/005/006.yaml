  text: καὶ τοῦτο ποιήσαντες συνέκλεισαν πλῆθος ἰχθύων πολύ, ⸀διερρήσσετο δὲ ⸂τὰ δίκτυα⸃ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/006.yaml
  text: And when they had done this[a], they enclosed a great multitude of fish[b], and their nets were tearing.
translation:
  language: zh_hans
  text: 他们照着做了，就圈住许许多多的鱼[a]，他们的网渐渐裂开[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“捕到了许许多多的鱼。”原文动词更直译为“圈住”或“围住”，描绘鱼被网合围的情景。
    reason: lexical_alternative
  - marker: b
    text: 或译：“他们的网开始裂开。”原文的未完成时态描写正在发生的过程，不一定表示鱼网已经完全破裂。
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσαντες
  choice: 照着做了
  rationale: 不定过去时分词在这里表示先于主要动作发生的行动；结合上文耶稣的吩咐，译为“照着做了”自然地保留了动作次序和指代关系。
- source_word: συνέκλεισαν
  choice: 圈住
  rationale: 该动词的基本意象是从四周合拢、围住。译为“圈住”既符合撒网捕鱼的场景，也比单纯译作“捕到”更充分地保留原文意象。
- source_word: πλῆθος ἰχθύων πολύ
  choice: 许许多多的鱼
  rationale: πλῆθος与πολύ共同强调数量之大。“许许多多的鱼”以自然现代汉语传达这种加强语气，避免较生硬的“极大的一群鱼”。
- source_word: διερρήσσετο
  choice: 渐渐裂开
  rationale: 未完成时呈现正在发展的过程，并不明确表示鱼网已经完全破裂。“渐渐裂开”保留进行中的动态；中间/被动形态在此可自然理解为不及物。
- source_word: τὰ δίκτυα αὐτῶν
  choice: 他们的网
  rationale: 保留复数所指；现代汉语通常不必另加复数标记，“他们的网”在语境中可自然指多张鱼网。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准普通话。“圈住”保留原文捕鱼时合围的画面；“渐渐裂开”传达未完成时的进行性，同时不把结果说得过满。脚注标记放在各自所解释的短语之后。
