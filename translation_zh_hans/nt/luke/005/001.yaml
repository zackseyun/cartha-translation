id: LUK.5.1
reference: Luke 5:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν τῷ τὸν ὄχλον ἐπικεῖσθαι αὐτῷ ⸀καὶ ἀκούειν τὸν λόγον τοῦ θεοῦ καὶ αὐτὸς ἦν ἑστὼς παρὰ τὴν λίμνην Γεννησαρέτ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/001.yaml
  text: It happened that while the crowd was pressing in on him and listening to the word of God[a], he was standing by the lake of Gennesaret[b],
translation:
  language: zh_hans
  text: 有一次，众人正拥挤着靠近他，听着上帝的道；他正站在革尼撒勒湖边[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 革尼撒勒湖也称为加利利海。
    reason: cultural_note
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: 有一次
  rationale: 这是路加常用的叙事引入语。译作“有一次”自然地引出事件，又不把 δέ 过度译成强连接词。
- source_word: ἐν τῷ τὸν ὄχλον ἐπικεῖσθαι αὐτῷ καὶ ἀκούειν
  choice: 众人挤到他跟前，要听
  rationale: ἐν τῷ 加不定式表示事件发生时的背景；ἐπικεῖσθαι 表达众人向他拥挤、逼近。并列的 ἀκούειν 在语境中可自然理解为众人挤近的目的，中文用“要听”简洁流畅，同时保留其专注聆听之意。
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: 上帝的道
  rationale: “上帝的道”是庄重而通行的现代中文圣经表达，既可指上帝所传出的信息，也保留 λόγος 的经文互涉和神学广度。
- source_word: καὶ αὐτὸς ἦν ἑστὼς
  choice: 他正站在
  rationale: 周叙结构表达持续状态；“正站在”准确呈现当时的姿态。αὐτός 在此不必机械译为“他自己”。
- source_word: παρὰ τὴν λίμνην Γεννησαρέτ
  choice: 革尼撒勒湖边
  rationale: παρά 表示在湖旁；Γεννησαρέτ 按希腊原文音译，不以“加利利海”替换。
theological_decisions:
- issue: τὸν λόγον τοῦ θεοῦ 的表达
  choice: 上帝的道
  alternative: 上帝的信息
  rationale: “信息”虽能说明所宣讲的内容，却缩窄了 λόγος 的语义和经文回响；“道”保留原文的神学广度而不额外界定。
- issue: Γεννησαρέτ 的处理
  choice: 革尼撒勒湖
  alternative: 加利利海
  rationale: 原文明确使用“革尼撒勒”这一名称；正文保留该专名，以脚注说明它与加利利海的关系，避免在正文中作协调性替换。
- issue: ἀκούειν 与前一不定式的关系
  choice: 要听
  alternative: 并听着
  rationale: 希腊文形式上将“挤近”和“听”并列在时间结构内，但语境也自然容许目的意味。中文采用“要听”以表达场景中的意向，不把它扩展为更强的因果陈述。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“众人挤到他跟前”呈现场景的拥迫感；分号使群众的动作与耶稣所在的位置层次清楚。正文只设一处脚注，且标记[a]已在正文出现。
