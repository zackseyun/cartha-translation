base_translation:
  language: en
  yaml_path: translation/nt/luke/014/009.yaml
  text: and the one who invited both you and him will come and say to you[a], ‘Give this man your place,’ and then you will begin with shame to take the last place.
translation:
  language: zh_hans
  text: 那邀请你和他的那个人会来对你说：“把你的位子让给这个人。”于是你就会羞愧地开始去坐末位[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“最低的位子”。希腊语的这个表达可指次序中最后的位置；在宴席座次的语境中，因而也可指尊荣最低的座位。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ σὲ καὶ αὐτὸν καλέσας
  choice: 那请你和他的人
  rationale: 该带冠词的分词结构作名词用，指邀请者；译文保留“你和他”两位受邀者的对照，且不必另加原文未明说的“主人”。
- source_word: ἐλθὼν … ἐρεῖ σοι
  choice: 就会过来对你说
  rationale: 不定过去时分词与将来时主要动词构成先后相接的动作，现代汉语自然表达为“过来……说”。
- source_word: Δὸς τούτῳ τόπον
  choice: 把位子让给这个人
  rationale: 在宴席座次语境中，这句话要求听者把所占的位置让给另一位客人；“位子”比抽象的“地方”更清楚，“让给”自然传达该命令。
- source_word: ἄρξῃ
  choice: 开始
  rationale: 保留ἄρχω“开始”的语义，不把它省略；处境中的被迫意味则由“只好”自然体现。
- source_word: μετὰ αἰσχύνης
  choice: 羞愧地
  rationale: αἰσχύνη涉及公开受辱所带来的羞耻，不宜弱化为单纯的“尴尬”。
- source_word: τὸν ἔσχατον τόπον
  choice: 末位
  rationale: ἔσχατος既可指次序上的最后，也可在宴席座次中指尊荣最低；“末位”简洁保留两层含义。
- source_word: κατέχειν
  choice: 退到
  rationale: κατέχω本义可为占据、取得；结合被迫让座并转往末位的场景，“退到”在汉语中自然呈现实际动作，但不额外说明行动过程。
