  yaml_path: translation/nt/luke/014/006.yaml
  text: And they were not able to reply to these things[a].
translation:
  language: zh_hans
  text: 他们无法回答这些话[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们无法回应这些事。”希腊原文用复数，直译为“对这些事”。
    reason: 说明πρὸς ταῦτα的复数形式，并保留“这些事”这一较直译的可行表达。
lexical_decisions:
- source_word: καὶ
  choice: （不另译）
  rationale: 这里承接上文；现代汉语直接续写更自然，无须机械译出“并且”。
- source_word: οὐκ ἴσχυσαν
  choice: 无言以对
  rationale: 该短语在此表示他们无法作出回应，并非缺乏体力；“无言以对”自然、简洁地传达这种不能回答的结果。
- source_word: ἀνταποκριθῆναι
  choice: 以对
  rationale: 该词指作出回应；结合“无言”构成现代汉语常用表达，不加入“顶嘴”等对抗性色彩。
- source_word: πρὸς ταῦτα
  choice: 对这些话
  rationale: πρός在此表示回应的对象，ταῦτα是复数；“这些话”既保留复数指向，也在语境中比直译“这些事”更自然。
