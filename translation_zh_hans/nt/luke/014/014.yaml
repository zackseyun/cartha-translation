source:
  edition: SBLGNT
  text: καὶ μακάριος ἔσῃ, ὅτι οὐκ ἔχουσιν ἀνταποδοῦναί σοι, ἀνταποδοθήσεται γάρ σοι ἐν τῇ ἀναστάσει τῶν δικαίων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/014.yaml
  text: And you will be blessed[a], because they cannot repay you[b]; for you will be repaid at the resurrection of the righteous.
translation:
  language: zh_hans
  text: 你就有福了，因为他们无力报答你；到义人复活的时候，你必得到报答。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακάριος
  choice: 有福
  rationale: “有福”是耶稣福语中自然且庄重的表达，保留了此词关乎上帝赐福和末世福分的分量；“快乐”过于侧重主观感受。
- source_word: ἔσῃ
  choice: 你就……了
  rationale: 以“就……了”自然表达将来结果，并承接上文所述行动。
- source_word: ὅτι
  choice: 因为
  rationale: 明确表达后句是有福的原因。
- source_word: οὐκ ἔχουσιν ἀνταποδοῦναί σοι
  choice: 他们无力报答你
  rationale: 该结构按字面为“他们没有（能力或条件）报答你”，语境中表达无力回报；“无力报答”既简洁自然，也避免误解为没有报答义务。
- source_word: ἀνταποδοθήσεται
  choice: 你必得到报答
  rationale: 保留将来被动含义，并与前面的“报答你”形成词语呼应。
- source_word: γάρ
  choice: （不另译，以分号和语义衔接体现）
  rationale: γάρ说明前述有福的根据。中文用分号连接并以“到……时候”展开，已能自然体现解释关系；硬译“因为”会与前一个“因为”重复而显生硬。
- source_word: ἐν τῇ ἀναστάσει
  choice: 到……复活的时候
  rationale: ἐν在此具有时间意义；此译符合现代汉语习惯，并不改变其时间指向。
- source_word: τῶν δικαίων
  choice: 义人
  rationale: “义人”是简洁、通行的圣经用语，保留δίκαιος的道德和神学含义。
theological_decisions:
- issue: “义人复活”的含义
  choice: 直译为“义人复活的时候”，指向将来与义人复活相联的报答，不进一步规定复活事件的次序或结构。
  alternative: 理解为普遍复活中对义人的强调，或理解为义人与其他人分别复活。
  rationale: 原文肯定将来的复活及其中对义人的报答，却没有在本节交代更完整的末世时间表；译文应保留这一开放性。
- issue: 报答者是否明说为上帝
  choice: 使用“你必得到报答”，不在正文补出“上帝”。
  alternative: 译为“上帝必报答你”。
  rationale: 从语境看被动式暗含上帝施行报答，但原文没有明说主语；保留被动表达可避免把隐含信息直接写入正文。
translation_notes:
  register: 采用现代、清楚而庄重的普通话。“有福”“义人”保留经文语体和神学分量；“无力报答”比“没有能力报答”更凝练，也比“不能报答”更能体现缺乏条件或资源的语感。
