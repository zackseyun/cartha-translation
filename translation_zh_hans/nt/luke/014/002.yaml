  text: καὶ ἰδοὺ ἄνθρωπός τις ἦν ὑδρωπικὸς ἔμπροσθεν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/002.yaml
  text: And behold[a], a certain man with dropsy was before him.
translation:
  language: zh_hans
  text: 看哪，有一个患水肿病[a]的人在他面前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “水肿病”指体液异常积聚而引起肿胀的病症；希腊文在这里用形容词描述患这种病的人。
    reason: 说明古代病症用语的现代含义。
lexical_decisions:
- source_word: καὶ
  choice: （不另译）
  rationale: 本句承接上文；现代汉语在“看哪”前再加“并且”显得生硬，省去连接词仍保留自然的叙事衔接。
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留引人注意、增强现场感的叙事标记；措辞庄重且为普通读者所能理解。
- source_word: ἄνθρωπός τις
  choice: 有一个……的人
  rationale: τις 指一个具体但未具名的人；“有一个”自然地保留这种不定而具体的意味。
- source_word: ἦν
  choice: 有……在
  rationale: 结合汉语存在句表达其未完成过去时在场景铺陈中的作用，不额外加入持续时间等信息。
- source_word: ὑδρωπικὸς
  choice: 患水肿病
  rationale: 该形容词指因体液异常积聚而肿胀的人；“患水肿病”比旧称更易懂，也避免把症状误作普通肿胀。
- source_word: ἔμπροσθεν αὐτοῦ
  choice: 在他面前
  rationale: 既可自然表示空间上的“在前面”，也可涵盖“在其面前、在场”的情境意义，保留原文的解释空间。
theological_decisions:
- issue: αὐτοῦ 所指的人物
  choice: 译作“他”
  alternative: 明确译作“耶稣”
  rationale: 原文使用代词，所指可由上下文辨明；保留代词避免添加原句未明说的专名。
translation_notes:
  register: 采用现代、庄重而自然的叙事语言。“看哪”略带经文语体，用来保留原文引人注意的语用功能；全句不使用生僻的旧病名。
