id: LUK.14.10
reference: Luke 14:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἀλλ’ ὅταν κληθῇς πορευθεὶς ἀνάπεσε εἰς τὸν ἔσχατον τόπον, ἵνα ὅταν ἔλθῃ ὁ κεκληκώς σε ⸀ἐρεῖ σοι· Φίλε, προσανάβηθι ἀνώτερον· τότε ἔσται σοι δόξα ἐνώπιον ⸀πάντων τῶν συνανακειμένων σοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/010.yaml
  text: But when you are invited[a], go and recline in the lowest place, so that when the one who invited you comes, he will say to you, ‘Friend[b], move up higher.’ Then there will be honor for you in the presence of all who are reclining with you.
translation:
  language: zh_hans
  text: 可是，你受邀时，要去坐[a]在末位；这样，邀请你的人来到时，会对你说：‘朋友，请移到更高的位置[b]。’那时，你在所有同席的人面前就有尊荣了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “坐”原文特指古代人在宴席上斜倚就席。
    reason: 说明古代宴席习俗及原词的具体动作。
  - marker: b
    text: 也可译作“请上座”。
    reason: 提供符合现代汉语宴席用语的表达，同时正文保留原文“向上、更高”的意象。
lexical_decisions:
- source_word: κληθῇς
  choice: 受邀
  rationale: 在宴席语境中，καλέω 指受到邀请；“受邀”比一般性的“被召”更准确自然。
- source_word: πορευθεὶς ἀνάπεσε
  choice: 要去坐
  rationale: 分词与命令语气构成连续动作。ἀνάκειμαι 类词在古代宴席中本指斜倚就席，但现代汉语用“坐”更自然，并以脚注保留历史文化信息。
- source_word: τὸν ἔσχατον τόπον
  choice: 末位
  rationale: 这里指宴席中等级最低、最不显要的位置；“末位”简洁地保留了席位次序和社会地位的含义。
- source_word: ὁ κεκληκώς σε
  choice: 邀请你的人
  rationale: 直接对应希腊文完成时分词，不以“主人”取代，从而避免增添原文没有明说的身份称谓。
- source_word: Φίλε
  choice: 朋友
  rationale: 保留直接称呼及其礼貌、友善的语气，不额外加入“我的”等原文没有的成分。
- source_word: προσανάβηθι ἀνώτερον
  choice: 请上到更高的位置
  rationale: 保留原文“向上”和“更高”的空间意象，同时让读者理解这是移到更尊贵的席位。
- source_word: δόξα
  choice: 尊荣
  rationale: 此处指在众人面前所得的公开敬重，而非专指神圣的“荣耀”；“尊荣”适合宴席中的社会语境。
- source_word: ἐνώπιον πάντων τῶν συνανακειμένων σοι
  choice: 在所有同席的人面前
  rationale: 既保留“在……面前”的公开性，也用自然汉语表达共同赴席的人。
theological_decisions:
- issue: 这句话的性质
  choice: 按宴席场景中的实际劝诫来译，同时保留其关于谦卑与尊荣倒转的更深含义。
  alternative: 将其限定为单纯的社交礼仪，或明确解释为只关乎末世奖赏。
  rationale: 经文本身借宴席情景教导谦卑及尊荣的倒转，但本节没有明确限定为纯社会意义或纯末世意义，译文不应替读者消除这一张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“末位”“同席”“尊荣”略带正式色彩，适合经文语体；避免用过度古雅的“筵席”“升座”，也不把经文简化成现代座位礼仪。
