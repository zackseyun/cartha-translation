  text: λέγω γὰρ ὑμῖν ὅτι οὐδεὶς τῶν ἀνδρῶν ἐκείνων τῶν κεκλημένων γεύσεταί μου τοῦ ⸀δείπνου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/024.yaml
  text: For I tell you that none of those men who were invited will taste my dinner[a].
translation:
  language: zh_hans
  text: 因为我告诉你们：那些受邀的男子，没有一个会尝到我的宴席。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “宴席”也可译作“晚餐”；传统译作“筵席”。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: 我告诉你们
  rationale: 保留对听众的直接宣告；γάρ在此承接并说明主人先前的命令，汉语若直译为“因为”会显得生硬，故借上下文关系自然表达。
- source_word: οὐδεὶς τῶν ἀνδρῶν ἐκείνων
  choice: 那些……的人，一个也不能
  rationale: 以“一个也不”准确传达οὐδείς的绝对否定。ἀνδρῶν虽为阳性名词，但在现代汉语中“那些人”已自然指称这群受邀者，无须添加可能显得刻意的“男人”。
- source_word: τῶν κεκλημένων
  choice: 先前受邀
  rationale: καλέω在宴席语境中意为邀请；完成时被动分词表示邀请已在此前发出，其结果状态延续至此。
- source_word: γεύσεταί
  choice: 尝到
  rationale: 保留γεύομαι“品尝”的具体意象；在否定句中也自然表达无缘享用。
- source_word: μου τοῦ δείπνου
  choice: 我的宴席
  rationale: δεῖπνον可指正餐、晚餐或筵席；本段明确是大型宴请，以“宴席”既自然又贴合语境，并保留第一人称所有关系。
theological_decisions:
- issue: 主人第一人称话语与比喻寓意的关系
  choice: 保留“我的宴席”，不在正文中明确指认其神学所指
  alternative: 将其解释性译为“神国的宴席”
  rationale: 原文维持比喻中主人的叙事声音。译文不应把可能的寓意直接写入正文，从而避免提前消除比喻的张力。
- issue: 受邀者遭排除的语气
  choice: 以“一个也不能尝到”保留绝对排除
  alternative: 译为“没有人会来享用”
  rationale: 原文强调他们不会尝到主人的宴席，而不是仅陈述他们不会前来；保留“尝到”也维持审判性宣告的力度。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事表达。“先前受邀”清楚呈现完成时背景；句末脚注标记与正文相连。
