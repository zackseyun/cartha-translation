revisions:
- from: 我告诉你们，那些先前受邀的人，一个也不能尝到我的宴席。[a]
  to: 因为我告诉你们：那些受邀的男子，没有一个会尝到我的宴席。[a]
  rationale: 将“不能”改为“会”，以表达原文将来时所宣告的必然排除；将“人”明确为“男子”，保留ἀνδρῶν的男性语义；补出“因为”以对应γάρ。其余表达保留比喻中主人第一人称的话语，不作寓意化扩展。
