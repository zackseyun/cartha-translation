  text: Καλὸν ⸀οὖν τὸ ἅλας· ἐὰν δὲ ⸀καὶ τὸ ἅλας μωρανθῇ, ἐν τίνι ἀρτυθήσεται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/034.yaml
  text: Salt[a], then, is good; but if even the salt becomes tasteless, with what will it be seasoned?
translation:
  language: zh_hans
  text: 所以，盐是好的；但如果连盐也失去了咸味[a]，要用什么给它调味呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “失去了咸味”：原文动词按字面也可表示“变得愚拙”，这里用于盐，指变得淡而无味。
    reason: lexical_alternative
lexical_decisions:
- source_word: Καλὸν
  choice: 是好的
  rationale: καλός在这里对盐作一般性的肯定评价；“是好的”自然、庄重，也不把含义限缩为“有用”。
- source_word: οὖν
  choice: 所以
  rationale: οὖν承接上文并表示推论；“所以”在现代汉语中清楚保留这一衔接作用。
- source_word: ἅλας
  choice: 盐
  rationale: 原文以盐构成谚语性比喻，宜按字面保留，不在正文中解释其所指。
- source_word: ἐὰν δὲ καὶ τὸ ἅλας
  choice: 但盐若连……也
  rationale: “但”体现δέ的转折，“连……也”体现καί的强调：甚至本来具有鲜明功用的盐也可能失去其特性。
- source_word: μωρανθῇ
  choice: 失去了咸味
  rationale: μωραίνω本可表示“变得愚拙”，但用于盐时是惯用的引申义，指变淡、失味；“失去了咸味”符合现代汉语表达，并保留盐这一意象。
- source_word: ἐν τίνι
  choice: 用什么
  rationale: 该短语表示手段；“用什么”是汉语反问中最自然的表达。
- source_word: ἀρτυθήσεται
  choice: 给它调味
  rationale: ἀρτύω指加以调味；以“给它调味”体现被动含义，保留烹调意象，不解释成抽象的“恢复”。
theological_decisions:
- issue: 盐之比喻的具体指向
  choice: 正文保留盐的谚语性形象，不直接解释为门徒或门徒的特质。
  alternative: 扩译为“门徒若失去其独特品格”等。
  rationale: 本节的应用由上下文和随后“有耳可听的，就应当听”来引导；若在正文中直接点明所指，就会消除原文保留的比喻张力。
translation_notes:
  register: 采用现代标准普通话，句式简洁而庄重。“连……也”传达原文强调，“给它调味”明确表达被动关系；保留盐的具体意象和反问语气。
