  text: οὕτως οὖν πᾶς ἐξ ὑμῶν ὃς οὐκ ἀποτάσσεται πᾶσιν τοῖς ἑαυτοῦ ὑπάρχουσιν οὐ δύναται ⸂εἶναί μου⸃ μαθητής.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/033.yaml
  text: So then[b][a], every one of you who does not renounce all his own possessions cannot be my disciple.
translation:
  language: zh_hans
  text: 这样说来，你们每一个人，若不舍弃自己所拥有的一切[a]，就不能作我的门徒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “舍弃”所译的希腊语动词也可译作“向……告别”；在这里表示辞别、放弃自己的一切所有物。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως οὖν
  choice: 同样
  rationale: οὕτως承接前面的两个比喻，并与οὖν共同引出总结性的应用。“同样”自然地表达“照样、如此”的承接和推论作用，又避免使用过于生硬的连接语。
- source_word: πᾶς ἐξ ὑμῶν
  choice: 你们每一个人
  rationale: 保留原文逐一指向听众的分配性强调，表明这一要求适用于每一位听见的人。
- source_word: ὃς οὐκ ἀποτάσσεται
  choice: 若不舍弃
  rationale: ἀποτάσσομαι本可指“告别、辞别”，在这里与人的所有物连用，表达决然放弃其占有权或依附。“舍弃”保留要求的严厉性，同时不像“变卖”那样加入原文没有明说的具体处置方式。
- source_word: πᾶσιν τοῖς ἑαυτοῦ ὑπάρχουσιν
  choice: 自己所拥有的一切
  rationale: ὑπάρχουσιν在此指一个人拥有的财物或产业；这一译法既准确又符合现代汉语，并以“自己”体现ἑαυτοῦ的反身意味。
- source_word: οὐ δύναται εἶναί μου μαθητής
  choice: 就不能作我的门徒
  rationale: “不能”准确保留οὐ δύναται所表达的不能或不可能，而不是仅仅“不应该”；“门徒”则保留福音书语境中跟从、受教并归属于耶稣的关系。
theological_decisions:
- issue: 对所有物之要求的性质
  choice: 译作“舍弃自己所拥有的一切”，表达对一切所有物的彻底放弃，同时不具体规定必须以何种方式处置财产。
  alternative: 译作“变卖所有财产”或“放弃对一切所有物的权利”，分别把经文明确化为实际变卖或主要是内在权利与态度。
  rationale: ἀποτάσσεται具有“告别、舍弃”的语义，却没有在本句中明确说明财产处置的具体形式。译文应保留这一严厉要求及其解释张力，不把它弱化为单纯的内在超脱，也不增添普遍变卖财产的明文命令。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“作我的门徒”符合汉语圣经语体且仍为当代读者所熟悉；句式简洁，保留原文对每个人的直接要求。
