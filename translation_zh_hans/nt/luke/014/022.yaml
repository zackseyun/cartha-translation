  yaml_path: translation/nt/luke/014/022.yaml
  text: And the servant said[a], ‘Lord, what you commanded has been done[b], and there is still room.’
translation:
  language: zh_hans
  text: 仆人说[a]：“主啊[b]，你所吩咐的已经办好了，并且还有地方。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “仆人”也可译作“奴仆”（δοῦλος）。
    reason: lexical_alternative
  - marker: b
    text: “主啊”在这里也可译作“主人”（Κύριε）。
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλος
  choice: 仆人
  rationale: 该词可指奴隶或仆役；本节着重其奉主人之命办事的身份。“仆人”符合现代汉语叙事，也保留了主仆关系；以脚注注明“奴仆”这一较能体现从属身份的译法。
- source_word: Κύριε
  choice: 主啊
  rationale: 这是对家主的呼格称呼。“主啊”简洁庄重，也与 κύριος 的常见译法一致；在本比喻的家宅语境中也可译作“主人”。
- source_word: γέγονεν
  choice: 已经办好了
  rationale: 完成时在这里表示命令已经执行，并突出完成后的现状。“已经办好了”自然地承接前文的差遣，比字面的“已经成了”更符合现代汉语。
- source_word: ὃ ἐπέταξας
  choice: 你所吩咐的
  rationale: 中性关系代词指主人先前命令的内容；ἐπιτάσσω 带有权威命令之意。“所吩咐的”既自然，又符合主仆对话的语体。
- source_word: ἔτι
  choice: 还
  rationale: 表示在执行命令之后仍有剩余容量；“还”是现代汉语最自然的表达。
- source_word: τόπος
  choice: 空位
  rationale: 在宴席语境中指仍可容纳宾客的位置。“空位”比泛称“地方”更明确，也自然体现席间尚有座位或容量。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语自然的叙事表达。“已经办好了”传达完成时的结果状态；“可是”自然呈现命令已完成与仍有空位之间的转折。所有词汇歧义均以脚注保留。
