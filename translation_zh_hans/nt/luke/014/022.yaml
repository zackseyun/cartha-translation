  source_fidelity: 译文准确传达了δοῦλος、呼格Κύριε、完成时γέγονεν，以及命令已经执行的结果。原文以καὶ连接“命令已办成”和“仍有地方”，不含明显转折；“空位”虽契合宴席背景，却较具体地限于座席，τόπος更宽泛地指尚可容纳人的地方/空间。
  naturalness: “仆人说：‘主啊，你所吩咐的已经办好了……’”自然、庄重，适合现代标准汉语。将“可是”改为“并且”，并以“还有地方”表达可避免添加原文未明示的转折和座位意象。
  terminology: “仆人”及其“奴仆”脚注恰当保留δοῦλος的词义范围；“主啊”在本比喻中可用，脚注列出“主人”也恰当。
