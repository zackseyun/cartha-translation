  text: Ἔλεγεν δὲ πρὸς τοὺς κεκλημένους παραβολήν, ἐπέχων πῶς τὰς πρωτοκλισίας ἐξελέγοντο, λέγων πρὸς αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/007.yaml
  text: 'He was telling a parable to those who had been invited[a], noticing how they were choosing the places of honor, saying to them:'
translation:
  language: zh_hans
  text: 他注意到受邀的人怎样挑选筵席上的尊位[a]，正在向他们讲一个比喻，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“首席”，指筵席上最受尊崇的位置。
    reason: 说明πρωτοκλισίας的直译选择及其宴席文化含义。
lexical_decisions:
- source_word: Ἔλεγεν
  choice: 讲了
  rationale: 该未完成时在此引出随后展开的话语；汉语以“讲了……说”自然衔接下文，而其场景性由整句表达。
- source_word: δὲ
  choice: 就
  rationale: δέ是轻微的叙事连接词；结合分词所表达的观察背景，用“就”自然呈现观察与发言之间的承接，不强化为转折。
- source_word: τοὺς κεκλημένους
  choice: 被请来的人
  rationale: 保留完成时被动分词所表达的受邀状态，不额外明说原文仅隐含的“宾客”。
- source_word: παραβολήν
  choice: 一个比喻
  rationale: 这是福音书中παραβολή的常规译法，也保留作者对随后教导的归类。
- source_word: ἐπέχων
  choice: 留意到
  rationale: 表达耶稣有意识地观察到促使他发言的情形，符合分词在句中的背景作用。
- source_word: πῶς
  choice: 怎样
  rationale: 直接保留对行动方式的描述。
- source_word: πρωτοκλισίας
  choice: 筵席上的尊位
  rationale: 该词指宴席中最受尊崇的坐席或躺席；“尊位”突出其社会荣誉含义，“筵席上”则明确语境。
- source_word: ἐξελέγοντο
  choice: 挑选
  rationale: “挑选”自然表达未完成时所描写的当时行为，也可含为自己选择之意，无须生硬增译“给自己”。
- source_word: λέγων πρὸς αὐτούς
  choice: 对他们……说
  rationale: 自然引出下一节的直接引语，并明确受话对象。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。为符合自然汉语语序，将“留意到……”这一分词背景置于主要发言动作之前。主语依上下文译作“他”，不在本节额外补出原文未明说的名字。脚注标记置于其实际解释的“尊位”之后。
