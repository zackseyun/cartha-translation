  text: οὔτε εἰς γῆν οὔτε εἰς κοπρίαν εὔθετόν ἐστιν· ἔξω βάλλουσιν αὐτό. ὁ ἔχων ὦτα ἀκούειν ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/035.yaml
  text: It is fit neither for the soil nor for the manure pile[a]; they throw it outside. The one who has ears to hear[b], let him hear.
translation:
  language: zh_hans
  text: 无论在田地里还是在粪堆里[a]，都不合用；人就把它扔在外面。有耳可听的，就当听。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“粪肥堆里”或“粪堆上”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“谁有耳可听，就当听。”
    reason: lexical_alternative
lexical_decisions:
- source_word: γῆν
  choice: 田地
  rationale: 这里是农业语境，与粪堆并列，指可耕种的土壤或田地；“田地”在现代汉语中自然、具体，也避免被理解为宇宙意义的“大地”。
- source_word: κοπρίαν
  choice: 粪堆
  rationale: κοπρία指粪肥或堆放粪肥之处；“粪堆”简洁具体，保留原文质朴的农业意象。
- source_word: εὔθετόν
  choice: 适合用在／适合放进
  rationale: 该词表示适用、合用。按两个并列对象稍作汉语搭配调整，既保留“适合”的评判意义，也使句子自然。
- source_word: ἔξω βάλλουσιν αὐτό
  choice: 人就把它扔在外面
  rationale: 原文是不定主语的第三人称复数主动式；汉语用泛指的“人”保留主动表达和具体动作，“外面”对应ἔξω。
- source_word: ὁ ἔχων ὦτα ἀκούειν ἀκουέτω
  choice: 有耳可听的，就应当听
  rationale: 保留原文格言式呼吁及ἀκουέτω的命令语气；汉语省去无必要的性别标记，而“有耳可听的”仍对应带冠词的分词结构。
theological_decisions:
- issue: 结尾劝告中的阳性单数形式
  choice: 有耳可听的，就应当听
  alternative: 有耳朵可以听的人，让他听
  rationale: 希腊文虽采用语法上的阳性单数，却具有泛指作用。现代汉语通常不需用“他”标示这种语法性别；本译法保留单数式、面向每个人的呼吁以及命令力度，而不把它限定为男性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“粪堆”保留农业意象；结尾使用熟悉的格言式表达，并以“应当听”清楚传达命令语气。
