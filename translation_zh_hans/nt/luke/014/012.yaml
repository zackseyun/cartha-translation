  text: Ἔλεγεν δὲ καὶ τῷ κεκληκότι αὐτόν· Ὅταν ποιῇς ἄριστον ἢ δεῖπνον, μὴ φώνει τοὺς φίλους σου μηδὲ τοὺς ἀδελφούς σου μηδὲ τοὺς συγγενεῖς σου μηδὲ γείτονας πλουσίους, μήποτε καὶ αὐτοὶ ⸂ἀντικαλέσωσίν σε⸃ καὶ γένηται ⸂ἀνταπόδομά σοι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/012.yaml
  text: And he was also saying to the one who had invited him[a], “When you give a luncheon or a dinner, do not invite your friends or your brothers or your relatives or rich neighbors[c][b], lest they also invite you in return and it become repayment to you.”
translation:
  language: zh_hans
  text: 耶稣也对那请他的人说：“你设午宴或晚宴时，不要请你的朋友、弟兄、亲属或富有的邻舍，免得他们也回请你，这就成了给你的回报。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔλεγεν δὲ καὶ
  choice: 耶稣也……说
  rationale: 未完成时在叙事中可自然译为“说”；补明主语“耶稣”有助于现代汉语读者承接上下文，“也”保留καί，δέ作为轻微连接不必机械译出。
- source_word: τῷ κεκληκότι αὐτόν
  choice: 对那请他的人
  rationale: 保留完成分词所指的先前邀请行为，同时比解释性的“主人”更贴近原文。
- source_word: Ὅταν ποιῇς
  choice: 你设……时
  rationale: ποιέω与宴席词连用表示置办、设立宴席；“设宴”是自然庄重的现代汉语。
- source_word: ἄριστον ἢ δεῖπνον
  choice: 午宴或晚宴
  rationale: ἄριστον指较早的一餐，通常在白天或中午；δεῖπνον指较晚的正餐。“午宴或晚宴”既保留区别，也符合现代汉语表达。
- source_word: μὴ φώνει
  choice: 不要请
  rationale: φωνέω本义为“呼叫”，在宴席语境中指邀请；汉语“请”简洁自然。
- source_word: τοὺς ἀδελφούς σου
  choice: 你的……弟兄
  rationale: 保留希腊文阳性复数ἀδελφούς的性别形式，不擅自扩展为“兄弟姐妹”。
- source_word: τοὺς συγγενεῖς σου
  choice: 亲属
  rationale: 准确涵盖有亲缘关系的人，现代、清楚而不过度口语化。
- source_word: γείτονας πλουσίους
  choice: 富有的邻舍
  rationale: πλουσίους直接修饰γείτονας；“邻舍”在经文语体中自然且有尊严，“富有的”清楚表达财富状况。
- source_word: μήποτε καὶ αὐτοὶ ἀντικαλέσωσίν σε
  choice: 免得他们也回请你
  rationale: μήποτε表达警戒性的否定结果；ἀντικαλέω明确含有回请、互相邀请之意。“免得……回请”简明保留互惠含义。
- source_word: καὶ γένηται ἀνταπόδομά σοι
  choice: 你就得了回报
  rationale: 原文较直译为“这就成为给你的回报”；汉语如此表达更自然，同时保留ἀνταπόδομα所指的偿还或回报观念。
theological_decisions:
- issue: 本节是否禁止一切邀请亲友
  choice: 按原文保留直接命令，不在正文中加入绝对化或弱化限定
  alternative: 译成“不要只请”或解释为一般性社交建议
  rationale: 希腊文确实使用否定命令μὴ φώνει，但本节修辞和伦理范围需由上下文阐明；译文不增添原文没有的“只”，也不将其扩展成教派性规则。
- issue: ἀνταπόδομα的回报性质
  choice: 译为“回报”，保留社会互惠与末世赏报之间由上下文形成的张力
  alternative: 具体译为“你今生就得了报偿”或“你便失去天上的赏赐”
  rationale: 本节本身未明说“今生”或“天上”；应避免把后续经文的神学含义提前写入正文。
translation_notes:
  register: 采用现代、清楚、庄重的简体中文。“午宴或晚宴”呈现两种餐次；“回请”自然表达社交互惠。未设置脚注，因为正文已能准确而流畅地承载主要词义，且没有必须标出的文本异读。
