    issue: 末句将“καὶ γένηται ἀνταπόδομά σοι”译为“你就得了回报”。
    rationale: 希腊文直指前述回请所产生的结果：“并且这成为给你的回报。”现译并非误译，但省去了“这成为”的结构性联系；恢复该联系可提高形式与语义忠实度。
