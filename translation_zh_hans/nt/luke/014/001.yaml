  text: Καὶ ἐγένετο ἐν τῷ ἐλθεῖν αὐτὸν εἰς οἶκόν τινος τῶν ἀρχόντων τῶν Φαρισαίων σαββάτῳ φαγεῖν ἄρτον καὶ αὐτοὶ ἦσαν παρατηρούμενοι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/001.yaml
  text: And it happened that when he went into the house of one of the rulers of the Pharisees on the Sabbath to eat bread[b][a], they were watching him closely.
translation:
  language: zh_hans
  text: 有一次，耶稣在安息日进了法利赛人的一位首领的家吃饭[a]，他们一直密切注视着他[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“吃饼”，即吃饭、用餐。
    reason: lexical_alternative
  - marker: b
    text: 或译“他们一直在仔细观察他”；原文在这里可能含有怀疑或敌意的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: 有一次
  rationale: 这是路加常用的叙事引入语；译作“有一次”符合现代汉语叙事习惯，也保留引出事件的功能。
- source_word: ἐν τῷ ἐλθεῖν αὐτὸν
  choice: 耶稣……进了
  rationale: 带ἐν的冠词不定式表示时间；在汉语中结合叙事引入语处理，避免生硬地逐字译作“当他进入的时候”。
- source_word: οἶκόν
  choice: 家
  rationale: 此处指设宴者的住所；“家”比“房屋”更自然地表达赴席的社会场景。
- source_word: τινος τῶν ἀρχόντων τῶν Φαρισαίων
  choice: 一个法利赛人领袖
  rationale: τινος τῶν表示群体中的一人，ἀρχόντων指有领导地位的人；此译自然简洁，且不把其具体职衔说得过实。
- source_word: σαββάτῳ
  choice: 在安息日
  rationale: 与格在此表示时间；“在安息日”是准确自然的现代汉语表达。
- source_word: φαγεῖν ἄρτον
  choice: 吃饭
  rationale: 字面为“吃饼”，在语境中是闪语式习语，意为用餐；主文采用自然汉语“吃饭”，脚注保留字面形式。
- source_word: παρατηρούμενοι
  choice: 一直在仔细盯着
  rationale: 该词表示密切观察，语境中可带戒备或敌意；“仔细盯着”保留紧张意味，却不直接断定恶意。
- source_word: αὐτοὶ
  choice: 他们
  rationale: 希腊文代词略带强调和对比；汉语用明确主语“他们”即可自然承接，避免不必要的“他们自己”。
theological_decisions:
- issue: 法利赛人观察耶稣是否明确带有敌意
  choice: 他们一直在仔细盯着他
  alternative: 他们在监视他
  rationale: παρατηρέω在此可暗示怀疑或敌意，但经文本身尚未明说其动机。“仔细盯着”保留叙事张力，而“监视”会较明确地判定其恶意。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“法利赛人领袖”避免造成其拥有某一明确官方职衔的印象；“吃饭”按汉语习惯表达原文习语，并以脚注保存字面意象。
