  text: οἱ δὲ ἡσύχασαν. καὶ ἐπιλαβόμενος ἰάσατο αὐτὸν καὶ ἀπέλυσεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/004.yaml
  text: But they kept silent[a]. And taking hold of him[b], he healed him and sent him away.
translation:
  language: zh_hans
  text: 他们却一言不发[a]。耶稣拉住那人[b]，医好了他，就让他走了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“沉默不语”或“什么也没说”。
    reason: lexical_alternative
  - marker: b
    text: “拉住”也可译作“扶住”或“抓住”。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: 他们却
  rationale: οἱ 作名词用，回指上文受问的人；δέ 在此带轻微转折，译作“却”体现他们面对耶稣提问而不作答的反差。
- source_word: ἡσύχασαν
  choice: 一言不发
  rationale: 此处 ἡσυχάζω 指不作回应；“一言不发”自然清楚地表达他们没有回答，同时不增添动机。
- source_word: ἐπιλαβόμενος
  choice: 拉住那人
  rationale: ἐπιλαμβάνομαι 表示抓住、扶住或拉住；“拉住”保留身体接触的含义，又不把动作方式说得过细。
- source_word: ἰάσατο
  choice: 医好了
  rationale: ἰάομαι 在此指身体得医治；“医好了”既自然，也表达医治已经完成。
- source_word: αὐτὸν
  choice: 那人
  rationale: 代词回指上文患水肿病的人；汉语用“那人”比连续使用“他”更清楚。
- source_word: ἀπέλυσεν
  choice: 让他走了
  rationale: ἀπολύω 可指释放、遣走或让人离开；本段没有监禁或法律程序的语境，“让他走了”最自然，也保留了基本语义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通俗的叙事语言。“一言不发”突出面对问题而不回答；“拉住那人”保留原文动作的身体接触感；“让他走了”避免“释放”可能带来的拘禁联想。
