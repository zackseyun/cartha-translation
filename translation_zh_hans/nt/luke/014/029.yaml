  text: ἵνα μήποτε θέντος αὐτοῦ θεμέλιον καὶ μὴ ἰσχύοντος ἐκτελέσαι πάντες οἱ θεωροῦντες ἄρξωνται ⸂αὐτῷ ἐμπαίζειν⸃
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/029.yaml
  text: otherwise[a], after he has laid a foundation and is not able to finish, all who see it may begin to mock him,
translation:
  language: zh_hans
  text: 免得他奠下根基，却无力完工，凡看见的人都开始嘲笑他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα μήποτε
  choice: 免得
  rationale: 此处引出应当避免的负面结果；“免得”自然保留了希腊语警戒和目的—结果兼具的语气。
- source_word: θέντος αὐτοῦ θεμέλιον
  choice: 他奠了根基
  rationale: 属格绝对结构表示先于主句的动作；汉语用“奠了根基”简洁表达先后关系，并贴合建筑语境。
- source_word: μὴ ἰσχύοντος ἐκτελέσαι
  choice: 却无力完工
  rationale: ἰσχύω在此指实际能力，ἐκτελέω指贯彻到完成；“无力完工”自然、凝练，不限于体力不足。
- source_word: πάντες οἱ θεωροῦντες
  choice: 所有看见的人
  rationale: θεωρέω表示看见、观看或观察；原文未明说宾语，因此不补入“这情形”，以免过度解释。
- source_word: ἄρξωνται αὐτῷ ἐμπαίζειν
  choice: 就开始嘲笑他
  rationale: “开始”对应ἄρχομαι，“嘲笑”准确传达ἐμπαίζω的讥诮含义；“就”在汉语中自然承接所警告的后果。
