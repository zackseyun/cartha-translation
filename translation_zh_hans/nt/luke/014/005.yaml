  text: ⸀καὶ πρὸς αὐτοὺς εἶπεν· Τίνος ὑμῶν υἱὸς ἢ βοῦς εἰς φρέαρ ⸀πεσεῖται, καὶ οὐκ εὐθέως ἀνασπάσει αὐτὸν ⸀ἐν ἡμέρᾳ τοῦ σαββάτου;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/005.yaml
  text: And he said to them[a], “Which of you, if a son or an ox falls into a well, will not immediately pull him out on the Sabbath day?”
translation:
  language: zh_hans
  text: 他对他们说[a]：“你们中间谁的儿子或牛掉进井里，谁会不在安息日立刻把那儿子或牛拉上来呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“驴”，而不是“儿子”。
    reason: textual_variant
lexical_decisions:
- source_word: Τίνος ὑμῶν
  choice: 你们中间谁的
  rationale: 按希腊语属格疑问结构直译其关系，同时用现代汉语自然表达，引出“儿子或牛”。
- source_word: υἱὸς
  choice: 儿子
  rationale: 保留阳性单数的具体亲属称谓，不泛化为“孩子”；并遵循所给SBLGNT正文。
- source_word: βοῦς
  choice: 牛
  rationale: “牛”是现代汉语对该牛类牲畜最清楚自然的称呼；“公牛”可能过度限定，“耕牛”则加入原文未明说的用途。
- source_word: φρέαρ
  choice: 井
  rationale: 该词在此最自然指井；不以“坑”替换，也不与平行经文协调。
- source_word: πεσεῖται
  choice: 掉进
  rationale: 将条件性、修辞性语境中的将来时自然表达为汉语假设情形；“掉进井里”符合现代用语。
- source_word: εὐθέως
  choice: 立刻
  rationale: 准确保留行动毫不延迟的时间意味。
- source_word: ἀνασπάσει
  choice: 拉上来
  rationale: 体现从井中向上拉出的动作，比笼统的“救出来”更贴近词义和场景。
- source_word: αὐτὸν
  choice: 他
  rationale: 保留希腊语阳性单数代词；其先行项既可能是“儿子”，也可能是语法上阳性的“牛”。
- source_word: ἐν ἡμέρᾳ τοῦ σαββάτου
  choice: 在安息日
  rationale: 现代汉语中“在安息日”已自然表达该日，无须机械补出“日子”。
theological_decisions:
- issue: 例子中掉进井里的对象存在抄本异文
  choice: 儿子或牛
  alternative: 驴或牛
  rationale: 所给SBLGNT正文作υἱὸς（“儿子”），故正文依此翻译；其他抄本的“驴”保留于脚注，避免把异文或协调传统带入正文。
translation_notes:
  register: 采用现代、庄重而口语自然的普通话。问句保留耶稣反问的力度；“不会……呢”使预期答案清楚，却不额外解释其神学意义。
