id: LUK.14.23
reference: Luke 14:23
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ εἶπεν ὁ κύριος πρὸς τὸν δοῦλον· Ἔξελθε εἰς τὰς ὁδοὺς καὶ φραγμοὺς καὶ ἀνάγκασον εἰσελθεῖν, ἵνα γεμισθῇ ⸂μου ὁ οἶκος⸃·
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/023.yaml
  text: And the master said to the slave[a], ‘Go out into the roads and hedges, and compel them to come in, so that my house may be filled.’
translation:
  language: zh_hans
  text: 主人对奴隶说：“你出去，到大路和篱笆旁去，催逼人进来[a]，好让我的屋子坐满人。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“极力劝人进来”。原文动词语气很强，有“催逼、强力促使”的意思；但在这个比喻中，不一定指使用身体暴力。
    reason: 说明 ἀνάγκασον 的词义力度及语境中的可能范围，避免正文过度弱化或被误解为必然诉诸暴力。
lexical_decisions:
- source_word: κύριος
  choice: 主人
  rationale: 在比喻的故事层面，此词指设宴之家的主人，不宜在此直接译作神圣称号“主”；“主人”自然体现他与奴隶的关系。
- source_word: δοῦλον
  choice: 奴隶
  rationale: 保留 δοῦλος 所表达的受奴役身份；“仆人”较为委婉，容易淡化原文所反映的社会地位。
- source_word: Ἔξελθε
  choice: 你出去
  rationale: 明确保留 ἐξέρχομαι 所含“向外出去”的方向意义，并符合现代汉语命令句。
- source_word: ὁδοὺς καὶ φραγμοὺς
  choice: 大路和篱笆旁
  rationale: ὁδοί 指道路，φραγμοί 可指篱笆或围栏；加“旁”使汉语自然，也呈现城镇外围及边界地带的场景。
- source_word: ἀνάγκασον
  choice: 催逼
  rationale: 保留该动词“强力促使、逼迫”的力度，又不在正文中擅自限定为身体强制；具体语境中的可能含义由脚注说明。
- source_word: εἰσελθεῖν
  choice: 进来
  rationale: 相对于主人所在的宴席场所，“进来”比单纯“进入”更自然，并保留方向。
- source_word: ἵνα γεμισθῇ μου ὁ οἶκος
  choice: 好让我的屋子坐满人
  rationale: “好让”表达 ἵνα 的目的含义；宴席语境下“屋子坐满人”以自然汉语传达房屋被人充满的被动结果。
theological_decisions:
- issue: 比喻中 κύριος 的称呼
  choice: 主人
  alternative: 主
  rationale: 此处首先是故事中的家主；译作“主人”避免将叙事角色称谓直接处理成神圣头衔，同时不排除比喻本身的神学指向。
- issue: ἀνάγκασον 所表达的力度
  choice: 催逼人进来
  alternative: 极力劝人进来
  rationale: 正文保留希腊动词的强烈语气，不将其弱化为一般邀请；脚注同时避免把它无根据地解释为暴力强迫，从而保留原文的张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“奴隶”如实呈现古代身份；“催逼”保留命令的力度；“大路和篱笆旁”使场景清楚自然。脚注标记 [a] 已置于相关短语之后。
