id: LUK.14.31
reference: Luke 14:31
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἢ τίς βασιλεὺς πορευόμενος ⸂ἑτέρῳ βασιλεῖ συμβαλεῖν⸃ εἰς πόλεμον οὐχὶ καθίσας πρῶτον ⸀βουλεύσεται εἰ δυνατός ἐστιν ἐν δέκα χιλιάσιν ⸀ὑπαντῆσαι τῷ μετὰ εἴκοσι χιλιάδων ἐρχομένῳ ἐπ’ αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/031.yaml
  text: Or what king[a], going to meet another king in war, will not first sit down and consider whether he is able with ten thousand to oppose the one coming against him with twenty thousand?
translation:
  language: zh_hans
  text: 又有哪个王要去与另一个王交战，不先坐下来盘算一下，自己能否用一万人迎战[a]那率领两万人来攻打他的王呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“迎上前去与……相遇”；原文动词的字面意思是前去相遇，在这里指迎击正在进军的敌方。
    reason: 保留ὑπαντῆσαι的字面译法及其军事语境中的具体含义。
lexical_decisions:
- source_word: ἢ
  choice: 又
  rationale: 承接前一个比喻，引出第二个设问；现代汉语用“又”能自然保持递进并列的修辞关系。
- source_word: τίς βασιλεὺς
  choice: 有哪个王
  rationale: 体现泛指性的反问，预期答案是“没有”。
- source_word: πορευόμενος ἑτέρῳ βασιλεῖ συμβαλεῖν εἰς πόλεμον
  choice: 要去与另一个王交战
  rationale: 自然表达王出发与另一位王进入战争的意思，同时保留行动的目的性。
- source_word: οὐχὶ καθίσας πρῶτον
  choice: 不先坐下来
  rationale: 保留原文先坐下、再作判断的动作次序，也与上一个比喻的审慎筹算相呼应。
- source_word: βουλεύσεται
  choice: 盘算一下
  rationale: 表达审慎考虑、权衡谋划的中间语态含义；“盘算”贴合兵力评估的语境，又便于普通读者理解。
- source_word: εἰ δυνατός ἐστιν
  choice: 自己能否
  rationale: 准确表达对实际能力的评估，而非许可或意愿。
- source_word: ἐν δέκα χιλιάσιν
  choice: 用一万人
  rationale: 这里的ἐν表示可供调遣的力量；“用一万人”简洁保留原文人数，没有擅自补入“士兵”。
- source_word: ὑπαντῆσαι
  choice: 迎战
  rationale: 该词基本义为前去相遇，但军事上下文表明这是迎击敌军；“迎战”兼顾移动和敌对含义。
- source_word: τῷ μετὰ εἴκοσι χιλιάδων ἐρχομένῳ ἐπ’ αὐτόν
  choice: 那率领两万人来攻打他的王
  rationale: 明确呈现对方带着两万人敌对而来的情景；末尾补出“王”是汉语中为避免指代含混而作的自然表达。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的设问句式。“盘算一下”比“商议”更能呈现独自权衡兵力的语境；“迎战”清楚表达军事冲突，同时以脚注保留原词较宽的字面意义。
