source:
  edition: SBLGNT
  text: τίς γὰρ ἐξ ⸀ὑμῶν θέλων πύργον οἰκοδομῆσαι οὐχὶ πρῶτον καθίσας ψηφίζει τὴν δαπάνην, εἰ ⸀ἔχει εἰς ἀπαρτισμόν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/028.yaml
  text: For which of you[a], wanting to build a tower, does not first sit down and calculate the cost[b], whether he has enough to complete it?
translation:
  language: zh_hans
  text: “你们中间谁想建一座塔，不先坐下来算一算费用，看看自己是否有足够的资源完成工程呢？[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“是否有供完成之用的。”这里指是否拥有足以完成工程的资源。
    reason: 说明原文以“有……供完成之用”表达是否具备完成工程所需的条件；“足够的资源”是按语境作出的自然表达。
lexical_decisions:
- source_word: τίς γὰρ ἐξ ὑμῶν
  choice: 你们中间谁
  rationale: 以自然的汉语引出面向听众的反问；本节承接上文，汉语无需生硬地把 γάρ 另译为“因为”。
- source_word: θέλων πύργον οἰκοδομῆσαι
  choice: 想盖一座塔
  rationale: 保留“想要、打算”的意向以及“塔”的具体意象；“盖”是现代汉语描述建筑施工的自然用词。
- source_word: οὐχὶ πρῶτον καθίσας
  choice: 不先坐下来
  rationale: 保留先行行动和反问预期肯定答案的语气。
- source_word: ψηφίζει τὴν δαπάνην
  choice: 算一算费用
  rationale: ψηφίζω 在此指核算、估算；“算一算费用”自然地表达建造前计算开支的行动。
- source_word: εἰ ἔχει εἰς ἀπαρτισμόν
  choice: 看看自己是否有足够的财力完工
  rationale: 原文直述“是否有供完成之用的”，语境所指是完成工程所需的资源；“足够的财力”与前面的费用相连，也使现代读者易于理解。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语自然的反问句式。“算一算”通俗但不随便；“财力”准确承接建造费用，并避免把重点局限于手头现金。脚注标记置于整句末尾，因为它解释最后一个分句。
