  text: ⸀ὅστις οὐ βαστάζει τὸν σταυρὸν ⸀ἑαυτοῦ καὶ ἔρχεται ὀπίσω μου, οὐ δύναται εἶναί μου μαθητής.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/027.yaml
  text: Whoever does not carry his own cross and come after me cannot be my disciple[a][b].
translation:
  language: zh_hans
  text: 凡不背着自己的十字架[a]、到我后面来的人[b]，不能作我的门徒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“担负自己的十字架”。
    reason: lexical_alternative
  - marker: b
    text: 直译：“到我后面来”；可比较常见的门徒用语“跟从我”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις
  choice: 凡……的人
  rationale: 这是不定关系代词，引出适用于任何人的一般条件；“凡……的人”在现代汉语中自然、庄重，也保留其普遍含义。
- source_word: βαστάζει
  choice: 背着
  rationale: 本词可指携带或承受。与“十字架”搭配时，“背着”既保留具体负载的形象，也容纳作门徒须付代价的隐喻含义。
- source_word: τὸν σταυρὸν ἑαυτοῦ
  choice: 自己的十字架
  rationale: “十字架”是σταυρός的标准译法，保留刑具、羞辱和死亡的历史意象；“自己的”准确传达单数反身代词的强调，而汉语无需标明语法性别。
- source_word: ἔρχεται ὀπίσω μου
  choice: 跟在我后面
  rationale: 较贴近原文“来到我后面”的空间和行动意象，同时在汉语中自然，并让读者感受到跟随门徒式的含义而不直接以解释性较强的“跟从我”取代。
- source_word: οὐ δύναται εἶναί μου μαθητής
  choice: 都不能作我的门徒
  rationale: 保留“不具备可能性/资格”的强烈表述，而不是弱化成禁令；“作我的门徒”是自然且通行的福音书用语。
theological_decisions:
- issue: 单数阳性反身代词的泛指表达
  choice: 译为“自己的”，不另加性别限定
  alternative: “他自己的”
  rationale: 希腊文的阳性单数与泛指主语保持语法一致；现代汉语“凡……的人……自己的”自然地保留单数泛指和反身强调，不必导入男性专指，也没有将其复数化。
- issue: “跟在我后面”的门徒含义
  choice: 保留原文的方位和行动意象
  alternative: 译为“跟从我”
  rationale: 原文可自然关联“跟从我”这一门徒用语，但字面表达仍是“来到我后面”；正文保留此张力，脚注说明其惯用含义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“背着自己的十字架”保留鲜明具体的历史意象；句式“凡……的人，都不能……”清楚传达普遍条件与强烈否定。所有脚注标记均置于相关正文之后。
