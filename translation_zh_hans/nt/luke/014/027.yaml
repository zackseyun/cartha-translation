  rationale: 仅作一项安全的源语贴近性修订：将“跟在我后面”改为“到我后面来”，以表达ἔρχεται的动作性，并保留ὀπίσω μου的方位意象。相应将脚注b的直译措辞与正文一致。删除“都”不改变原意，并使汉语条件句更凝练。
