base_translation:
  language: en
  yaml_path: translation/nt/luke/014/017.yaml
  text: And at the hour of the dinner he sent his servant to say to those who had been invited[a], ‘Come, because it is already ready.’
translation:
  language: zh_hans
  text: 到了宴席的时候，他派自己的仆人去对那些已经受邀的人说：“来吧，因为都已经预备好了。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一切都已经预备好了。”希腊原文没有明说主语，并使用中性复数的集合性表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: 派……去
  rationale: 自然表达差遣仆人执行传话任务的含义，不额外强化语气。
- source_word: δοῦλον
  choice: 仆人
  rationale: 在这一家主设宴的比喻场景中，重点是其受差遣传话的身份；“仆人”自然得体，同时不否认该词也可指奴仆。
- source_word: τῇ ὥρᾳ τοῦ δείπνου
  choice: 到了晚宴的时刻
  rationale: 保留原文明确的时间表达；结合上下文，δείπνον在此是设宴款待，用“晚宴”比普通“晚饭”更贴合场景。
- source_word: εἰπεῖν
  choice: 去对……说
  rationale: 体现不定式在“派”之后所表达的目的，并自然引出直接引语。
- source_word: τοῖς κεκλημένοις
  choice: 那些已经受邀的人
  rationale: καλέω的完成时被动分词表明他们先前已经受到邀请；译文保留这一时间状态。
- source_word: Ἔρχεσθε
  choice: 来吧
  rationale: 准确传达命令式的邀请和召唤语气；“吧”使现代汉语表达自然，但不增添“立刻”等原文未明说的意义。
- source_word: ὅτι
  choice: 因为
  rationale: 明确引出前来赴宴的理由。
- source_word: ἤδη
  choice: 现在
  rationale: 在此表示预备工作到此刻已经完成；汉语“现在都预备好了”自然包含“已经就绪”的语义。
- source_word: ἕτοιμά ἐστιν
  choice: 都预备好了
  rationale: 中性复数形容词配单数动词构成集合性表达，主语保持含蓄；“都预备好了”既符合汉语习惯，也避免擅自限定为饭菜或一切事物。
