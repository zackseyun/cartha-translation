  text: Ὅταν κληθῇς ὑπό τινος εἰς γάμους, μὴ κατακλιθῇς εἰς τὴν πρωτοκλισίαν, μήποτε ἐντιμότερός σου ᾖ κεκλημένος ὑπ’ αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/008.yaml
  text: When you are invited by someone to a wedding feast, do not recline in the place of honor, lest someone more honored than you has been invited by him.
translation:
  language: zh_hans
  text: 你受人邀请去参加婚宴[a]时，不要在首席[b]上斜躺[c]，恐怕有比你更尊贵的人受了那人的邀请。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“去参加婚礼”。希腊文用复数，可以指婚礼庆典，尤其是婚宴。
    reason: lexical_alternative
  - marker: b
    text: 即宴席上最尊贵的位置。
    reason: cultural_note
  - marker: c
    text: 古代正式宴席上，人们通常斜躺用餐，而不是端坐。
    reason: cultural_note
lexical_decisions:
- source_word: Ὅταν κληθῇς ὑπό τινος
  choice: 你受人邀请……时
  rationale: 宴席语境中 καλέω 指邀请；以“受人邀请……时”自然表达泛指情形，并保留不定施事者 τινος。
- source_word: εἰς γάμους
  choice: 去参加婚宴
  rationale: γάμους 为复数，在此可指婚礼庆典，尤其是婚宴；上下文关于席位，故正文采用“婚宴”，脚注保留“婚礼”的可能。
- source_word: μὴ κατακλιθῇς
  choice: 不要……躺席
  rationale: κατακλίνω 指古代赴席时斜躺用餐。“躺席”既保留历史场景，也较简洁；脚注解释其习俗含义。
- source_word: εἰς τὴν πρωτοκλισίαν
  choice: 在首席
  rationale: πρωτοκλισία 指宴席上最尊贵的位置。“首席”是自然、庄重的现代汉语表达，又保留席位与尊荣的关联。
- source_word: μήποτε
  choice: 恐怕
  rationale: 引出禁令所防范的可能情形；“恐怕”自然传达警戒与不确定性。
- source_word: ἐντιμότερός σου
  choice: 比你更尊贵的人
  rationale: 比较级表示在宴席荣誉与社会地位上更受尊重；“更尊贵”贴近原文的荣誉语境。
- source_word: ᾖ κεκλημένος ὑπ’ αὐτοῦ
  choice: 也受了他的邀请
  rationale: 完成时分词与虚拟式构成迂说结构，表示邀请已发生而其结果与当前有关；“受了……邀请”自然表达这一点，“也”使另一位受邀者的关系在汉语中清楚。
