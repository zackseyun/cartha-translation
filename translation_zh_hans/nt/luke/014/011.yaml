source:
  edition: SBLGNT
  text: ὅτι πᾶς ὁ ὑψῶν ἑαυτὸν ταπεινωθήσεται καὶ ὁ ταπεινῶν ἑαυτὸν ὑψωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/011.yaml
  text: For everyone who exalts himself will be humbled[b][a], and the one who humbles himself will be exalted.
translation:
  language: zh_hans
  text: 因为凡抬高自己的，必被降为卑；凡谦卑自己的，必被升高。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 在上下文中引出前面劝告的理由；“因为”自然保留其解释和因果作用。
- source_word: πᾶς ὁ ὑψῶν ἑαυτὸν
  choice: 凡抬高自己的
  rationale: 冠词化现在分词表达普遍、格言式意义；“凡……的”在现代汉语中简洁自然，并保留普遍范围。
- source_word: ὑψῶν
  choice: 抬高
  rationale: 此处指自我抬举而非身体上的升高；“抬高自己”既通俗，又与下文“被抬高”形成词语呼应。
- source_word: ἑαυτὸν
  choice: 自己
  rationale: 汉语反身代词本身不标性别，可准确表达原文的反身关系，无须添加原文在此并不着重表达的性别信息。
- source_word: ταπεινωθήσεται
  choice: 必被降卑
  rationale: 保留将来被动语态及与主动自我降卑的对照；“必”体现格言中确定的未来结果。
- source_word: καὶ
  choice: 而
  rationale: 原文用并列连词连接两个对称而相反的分句；汉语“而”自然呈现这种对照，同时不把关系强化为过度转折。
- source_word: ὁ ταπεινῶν ἑαυτὸν
  choice: 降卑自己的
  rationale: “……的”承载冠词化分词的泛指功能，并与前半句形成整齐平行。
- source_word: ταπεινῶν
  choice: 降卑
  rationale: 指主动使自己处于卑微位置；“降卑自己”保留其自愿性，也与“被降卑”构成严谨对应。
- source_word: ὑψωθήσεται
  choice: 必被抬高
  rationale: 保留将来被动和与前半句“抬高自己”的词汇对称；不明说施事者。
theological_decisions:
- issue: 两个将来被动式的隐含施事者
  choice: 保留“必被降卑／必被抬高”的被动表达，不补出“被上帝”
  alternative: 译为“必被上帝降卑／抬高”
  rationale: 上下文和圣经主题可以暗示上帝是施事者，但希腊文本没有明说；保留被动式可避免把合理推论写入正文。
- issue: 格言的普遍适用范围
  choice: 用“凡……的”表达
  alternative: 用“任何人若……”或“谁……”
  rationale: “凡”准确传达 πᾶς 的普遍范围，并保持庄重、凝练的格言语体。
- issue: 原文阳性单数形式在汉语中的呈现
  choice: 译作不标性别的“自己”
  alternative: 加注说明希腊语采用阳性单数泛指
  rationale: 现代汉语的口语反身代词“自己”不区分性别，却不损失原文所指；原文阳性形式在这里是希腊语语法形式，并无需要在中文正文或脚注中特别强化的性别对比。
translation_notes:
  register: 采用现代、庄重而易懂的格言式表达。两半句保持“抬高自己／被降卑”与“降卑自己／被抬高”的交叉对称；以“必”表达未来陈述的确定性，不显明补出被动式的施事者。
