  text: 'Large crowds were traveling with him[a], and turning, he said to them:'
translation:
  language: zh_hans
  text: 有许多群众与耶稣同行[a]；他转过身来，对他们说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“许多群众和他一同前行。”原文用复数，强调有许多群众在行路中伴随着耶稣。
    reason: lexical_alternative
lexical_decisions:
- source_word: Συνεπορεύοντο
  choice: 跟着……同行
  rationale: 未完成时表示过去持续进行的动作；“跟着……同行”自然地表达众人在路上伴随耶稣，也为下文关于作门徒的教导保留叙事背景。
- source_word: δὲ
  choice: 以句号承接上下文，不另译
  rationale: 这里是轻微的叙事推进，并非强烈转折；现代汉语无需机械译出连接词。
- source_word: αὐτῷ
  choice: 耶稣
  rationale: 希腊文是代词“他”；中文在新段落起首补明指代对象更自然，也避免“有许多人跟着他同行”可能产生的指代不清。
- source_word: ὄχλοι πολλοί
  choice: 许多人
  rationale: 原文直指“许多群众/许多群人”。现代汉语通常以“许多人”表达大量同行者；人数众多的重点得以保留。脚注注明更贴近形式的译法。
- source_word: καὶ
  choice: 。
  rationale: 希腊文以连接词推进动作；中文分句成句更自然，动作先后关系仍然清楚。
- source_word: στραφεὶς
  choice: 转过身来
  rationale: 准确表达转身面向同行群众的动作；比单说“转身”更符合自然叙事语感。
- source_word: εἶπεν
  choice: 说
  rationale: λέγω 的标准叙事译法。
- source_word: πρὸς αὐτούς
  choice: 对他们
  rationale: 保留 πρός 加宾格在言说动词后标明听话对象的功能，并维持原文代词形式。
