base_translation:
  language: en
  yaml_path: translation/nt/luke/014/013.yaml
  text: But whenever you give a banquet[a], invite the poor, the crippled, the lame[b], the blind.
translation:
  language: zh_hans
  text: 可是，你每逢设宴[a]，要邀请穷人、肢体残缺的人[b]、瘸腿的人和盲人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“摆设筵席”或“举办宴会”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“有身体残障的人”。原文所用的词可指肢体受损或残缺的人，与后面的“瘸腿的人”有所区别。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: 可是
  rationale: 承接上一节，并明确表达与先前所说邀请对象之间的转折；“可是”简洁自然。
- source_word: ὅταν
  choice: 每逢
  rationale: 与虚拟语气连用，表示不限定某一次的反复或一般情形；“每逢”比单纯的“当……时”更充分传达这种意味。
- source_word: δοχὴν ποιῇς
  choice: 设宴
  rationale: 这是举行宴席、款待宾客的惯用表达；“设宴”简练、庄重，也不限于普通晚餐。
- source_word: κάλει
  choice: 要邀请
  rationale: 在宴席语境中，καλέω 指邀请赴席；加“要”自然体现命令语气。
- source_word: πτωχούς
  choice: 穷人
  rationale: 准确表达名词化形容词所指的贫穷人群，且是现代汉语的自然说法。
- source_word: ἀναπείρους
  choice: 肢体残缺的人
  rationale: 该词指身体、尤其肢体有损伤或残缺的人；此译法既与后面的“瘸腿的人”有所区别，也避免把原文两个类别合并。
- source_word: χωλούς
  choice: 瘸腿的人
  rationale: 具体指行走能力受损的人；译为“瘸腿的人”保留其与较广义的 ἀναπείρους 之间的区别。
- source_word: τυφλούς
  choice: 盲人
  rationale: 简洁、通行地表达失去视力的人群，并保持原文列举的紧凑结构。
theological_decisions:
- issue: 如何以现代、尊重而忠于原文的方式翻译有关身体障碍的两个相邻类别
  choice: 分别译为“肢体残缺的人”和“瘸腿的人”
  alternative: 译为“残障者”和“行动不便的人”，或传统地都采用“残废的／瘸腿的”等措辞
  rationale: 本节的重点是把款待延伸到常被社会排斥、又无力回报的人。所选译法保留原文两个不同类别，不把它们笼统合并，同时采用以“人”为中心、现代读者能够理解的表述。
translation_notes:
  register: 采用现代、庄重而通俗的普通话。“设宴”符合款待宾客的语境；四类受邀者保持原文简洁的并列结构，同时用“……的人”避免不必要的标签化。
