id: LUK.14.15
reference: Luke 14:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ἀκούσας δέ τις τῶν συνανακειμένων ταῦτα εἶπεν αὐτῷ· Μακάριος ⸀ὅστις φάγεται ⸀ἄρτον ἐν τῇ βασιλείᾳ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/015.yaml
  text: But one of those reclining at the table with him[a], when he heard these things, said to him[b], “Blessed is whoever will eat bread in the kingdom of God.”
translation:
  language: zh_hans
  text: 同席的人中有一个听见这些话，就对耶稣说：“将在神的国里吃饭的人有福了！”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“将在神的国里吃饼的人有福了！”“吃饼”在希腊语中可泛指用餐。
    reason: 说明原文的字面意象及其惯用含义。
lexical_decisions:
- source_word: Ἀκούσας
  choice: 听见
  rationale: 不定过去时分词在此具有时间背景作用；汉语按叙事顺序译为“听见……就……”，自然表达先后关系。
- source_word: δέ
  choice: 不单独译出
  rationale: 此处是轻微的叙事推进；汉语借句序自然承接上文，若硬译“但是”会造成过强转折。
- source_word: τις τῶν συνανακειμένων
  choice: 同席的人中有一个
  rationale: 准确表达一位未具名、与耶稣一同用餐的人；“同席”自然简洁，不必在正文突出古代斜倚进餐的姿势。
- source_word: ταῦτα
  choice: 这些话
  rationale: 所指是耶稣刚才所说的内容；译作“这些话”比直译“这些事”更符合现代汉语语境。
- source_word: εἶπεν αὐτῷ
  choice: 就对耶稣说
  rationale: 代词所指在上下文中是耶稣；明示姓名可避免连续代词造成歧义。
- source_word: Μακάριος
  choice: 有福了
  rationale: 保留蒙福、处于可称羡境况的庄重及神学意味，而不缩减为主观的“快乐”。
- source_word: ὅστις
  choice: ……的人
  rationale: 以汉语关系结构自然表达泛指意义，不把对象限定为某个特定的人。
- source_word: φάγεται ἄρτον
  choice: 吃饭
  rationale: “吃饼”在希腊语中可自然指用餐；现代汉语“吃饭”既保留进食意象，也准确传达惯用含义。
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: 在神的国里
  rationale: 直接保留地点/领域表达，不额外加入原文未明说的“筵席”等解释。
theological_decisions:
- issue: Μακάριος在末世性国度用餐话语中的含义
  choice: 能在神的国里吃饭的人有福了
  alternative: 能在神的国里吃饭的人真幸福
  rationale: “有福”保留神所赐福分与可称羡境况的双重意味，避免将其仅理解为心理感受。
- issue: φάγεται的将来意义
  choice: 以“能……吃饭”表达将来获准参与的前景
  alternative: 将在神的国里吃饭
  rationale: 希腊语为将来时；汉语“能在……吃饭”在此自然指向将来的有福参与，并不主张这种资格如何取得。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事表达。“同席”交代宴席场景；“有福了”保留祝福宣告的经文语体。正文使用“吃饭”传达希腊习语，并以脚注保存“吃饼”的字面形象。
