  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν πρὸς τοὺς νομικοὺς καὶ Φαρισαίους λέγων· ⸀Ἔξεστιν τῷ σαββάτῳ ⸂θεραπεῦσαι ἢ οὔ⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/003.yaml
  text: And Jesus answered and said to the lawyers and Pharisees[a], “Is it lawful to heal on the Sabbath, or not?”
translation:
  language: zh_hans
  text: 耶稣回答，对律法师[a]和法利赛人说：“在安息日医治人是合法的吗，还是不合法？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“律法专家”，指精通犹太律法的人。
    reason: 说明νομικός并非现代意义上的律师，并提供较直白的词义替代。
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν … λέγων
  choice: 回答……说
  rationale: 希腊文以分词和言说动词构成叙事引语格式；译作“回答……说”既保留回应意味，也符合现代汉语表达，避免机械重复“说”。
- source_word: νομικοὺς
  choice: 律法师
  rationale: 此词在这里指精通摩西律法的专家，而非现代民事或刑事律师。“律法师”简洁、符合福音书语境，并以脚注说明其确切含义。
- source_word: Φαρισαίους
  choice: 法利赛人
  rationale: 采用该犹太群体名称通行的中文音译。
- source_word: Ἔξεστιν
  choice: 是合法的
  rationale: 该词表达某事是否获准、是否合乎律法；在安息日争议的语境中，“合法”保留了问题的律法性质。
- source_word: τῷ σαββάτῳ
  choice: 在安息日
  rationale: 将与格的时间用法自然地译出，并保留所指的特定圣日。
- source_word: θεραπεῦσαι
  choice: 治病
  rationale: 在此福音书场景中指医治患病者；“治病”是自然、明确的现代汉语表达。
- source_word: ἢ οὔ
  choice: 还是不合法
  rationale: 明确保留希腊文选择问句末尾“还是不”的对举形式。
theological_decisions:
- issue: 不预先解答安息日律法问题
  choice: “在安息日治病是合法的，还是不合法？”
  alternative: “在安息日可以治病吗？”
  rationale: 正文只提出律法上的争议，没有在本节加入关于怜悯、必要性或耶稣权柄的结论；显明“合法／不合法”的对举可保留原文的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“律法师”与“法利赛人”符合中文圣经语境；问句用完整的正反对举，既自然又贴近原文。
