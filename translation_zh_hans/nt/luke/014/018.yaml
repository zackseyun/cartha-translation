id: LUK.14.18
reference: Luke 14:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἤρξαντο ἀπὸ μιᾶς ⸂πάντες παραιτεῖσθαι⸃. ὁ πρῶτος εἶπεν αὐτῷ· Ἀγρὸν ἠγόρασα καὶ ἔχω ἀνάγκην ⸀ἐξελθὼν ἰδεῖν αὐτόν· ἐρωτῶ σε, ἔχε με παρῃτημένον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/018.yaml
  text: But they all alike began to excuse themselves[a]. The first said to him, ‘I have bought a field, and I need to go out and see it. I ask you[b], consider me excused.’
translation:
  language: zh_hans
  text: 可是，众人都一致[b]推辞起来[a]。第一个对他说：‘我买了一块田，必须出去看看。请你准我辞谢。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“找借口推托”。希腊语动词可指提出理由来谢绝邀请。
    reason: lexical_alternative
  - marker: b
    text: 直译“从一个”，是表示众人一同或同样行动的习语。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: 可是
  rationale: καί在这里承接上文，却引出受邀者拒绝赴宴的转折；译作“可是”能自然呈现语篇关系。
- source_word: ἤρξαντο ... παραιτεῖσθαι
  choice: 推辞起来
  rationale: 该中间语态结构表示开始谢绝邀请；“推辞起来”既保留起始意味，也自然涵盖随后提出理由的行为。
- source_word: ἀπὸ μιᾶς
  choice: 一致
  rationale: 这是表示众人同样或一同采取行动的习语；“一致”简洁保留其共同反应的意味，而不必扩展为更强的心理同一。
- source_word: πάντες
  choice: 众人都
  rationale: 明确表达πάντες所强调的全体性。
- source_word: Ἀγρόν
  choice: 一块田
  rationale: ἀγρός指田地或一片土地；“一块田”直接、自然，不额外加入农场经营的含义。
- source_word: ἠγόρασα
  choice: 我买了
  rationale: 以现代汉语的一般过去表达已完成且与当前情境相关的购买行为。
- source_word: ἔχω ἀνάγκην
  choice: 必须
  rationale: 该习语表达必要性；“必须”准确传达说话者所声称的迫切需要。
- source_word: ἐξελθὼν ἰδεῖν αὐτόν
  choice: 出去看看
  rationale: 自然表达分词与不定式所构成的连贯动作；“看看”保留ἰδεῖν的一般观察义，避免过度具体化为“验看”或“检查”。
- source_word: ἐρωτῶ σε
  choice: 请你
  rationale: 在汉语中以礼貌请求式自然表达“我请求你”，避免生硬直译，同时保留明确的请求语气。
- source_word: ἔχε με παρῃτημένον
  choice: 准我辞谢
  rationale: 该表达请求主人接受说话者的谢绝；“准我辞谢”简洁传达结果状态和请求认可的意味。
- source_word: ὁ πρῶτος
  choice: 第一个
  rationale: 直接表达序数词名词化的用法，引出接连出现的第一个理由。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“推辞起来”保留动作开始的意味；“准我辞谢”略带礼貌而不古奥，适合宴席邀请的语境。脚注标记均置于其所解释的具体词语之后。
