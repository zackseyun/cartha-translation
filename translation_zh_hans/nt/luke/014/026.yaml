source:
  edition: SBLGNT
  text: Εἴ τις ἔρχεται πρός με καὶ οὐ μισεῖ τὸν πατέρα ⸀ἑαυτοῦ καὶ τὴν μητέρα καὶ τὴν γυναῖκα καὶ τὰ τέκνα καὶ τοὺς ἀδελφοὺς καὶ τὰς ἀδελφάς, ἔτι ⸀τε καὶ τὴν ⸂ψυχὴν ἑαυτοῦ⸃, οὐ δύναται ⸂εἶναί μου μαθητής⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/026.yaml
  text: If anyone comes to me and does not hate his own father and mother and wife and children and brothers and sisters—and even his own life—he cannot be my disciple[a][b].
translation:
  language: zh_hans
  text: “无论谁到我这里来，若不恨[a]自己的父亲、母亲、妻子、儿女、兄弟和姐妹，甚至自己的性命[b]，就不能作我的门徒。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或按语境理解为：“若不爱……过于爱我。”原文动词直译为“恨”；在这里，它强调对耶稣的忠诚必须高于最亲近的家庭关系。参太10:37。
    reason: lexical_alternative
  - marker: b
    text: “性命”或译“灵魂”；这里的 ψυχή 按作门徒须付代价的语境，可能指一个人的生命。
    reason: lexical_alternative
lexical_decisions:
- source_word: μισεῖ
  choice: 恨
  rationale: 保留该动词直接而强烈的通常词义，不在正文中将耶稣刻意尖锐的措辞弱化为解释性的“少爱”；其在本语境中所表达的优先次序见脚注。
- source_word: ἔρχεται πρός με
  choice: 到我这里来
  rationale: 直接表达 πρός με 所指向的关系性趋近，同时不擅自改成原文未采用的“跟从我”。
- source_word: πατέρα ἑαυτοῦ
  choice: 自己的父亲
  rationale: 用“自己的”体现反身代词 ἑαυτοῦ 的个人指向和强调。
- source_word: γυναῖκα
  choice: 妻子
  rationale: 在家庭成员的列举中，γυνή 自然指“妻子”，而非泛指“女人”。
- source_word: ἀδελφοὺς καὶ ἀδελφάς
  choice: 兄弟、姐妹
  rationale: 原文明列阳性和阴性的手足称谓，译文分别保留。
- source_word: ἔτι τε καὶ
  choice: 甚至
  rationale: 自然体现末项递进并达到高潮的强调语气。
- source_word: ψυχὴν ἑαυτοῦ
  choice: 自己的性命
  rationale: 在付代价作门徒的语境中，ψυχή 主要指人的生命；“性命”既传达此义，也避免把它狭义化为与身体相对的非物质“灵魂”。
- source_word: οὐ δύναται εἶναί μου μαθητής
  choice: 就不能作我的门徒
  rationale: 准确而自然地表达这种关系上的不可能或不相容，不将其弱化为单纯的禁令。
theological_decisions:
- issue: 是否在正文中将 μισεῖ 缓和为比较性的表达
  choice: 正文保留“恨”，脚注说明“爱得较少”的语境含义。
  alternative: 正文译作“爱得不如我”或“少爱”。
  rationale: 原文措辞刻意强烈，应保留其张力；同时，语境所要求的是对耶稣的忠诚高于至亲关系，而非鼓励敌视家人，因此以脚注说明其比较和优先含义。
- issue: 本节 ψυχή 的含义
  choice: 译作“性命”。
  alternative: 译作“灵魂”或“自己”。
  rationale: 本节论作门徒的代价，重点是连自己的生命也不能置于对耶稣的忠诚之上；“性命”较准确地传达此处语境义，又不预设狭义的人论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“无论谁……若不……就不能……”保持原句条件结构；家庭成员逐项列出，并用“甚至”保留末项的高潮。“作我的门徒”符合现代中文圣经语体，同时清楚自然。
