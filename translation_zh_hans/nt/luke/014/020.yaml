  yaml_path: translation/nt/luke/014/020.yaml
  text: And another said[a], ‘I have married a wife, and for this reason I cannot come.’
translation:
  language: zh_hans
  text: 又有一个人说：“我娶了妻子，因此不能来。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕτερος
  choice: 又有一个人
  rationale: 这里承接前面接连推辞的人，译为“又有一个人”既体现新增一位回应者，也符合现代汉语叙事习惯。
- source_word: Γυναῖκα ἔγημα
  choice: 我娶了妻子
  rationale: γυνή在与γαμέω连用时明确指“妻子”；不定过去时陈述已经发生的婚娶，汉语用“娶了”自然表达完成的动作及其当前关联。原文没有明说“刚刚”，因此不增译。
- source_word: διὰ τοῦτο
  choice: 因此
  rationale: 该短语说明婚娶是他所声称不能赴约的原因；“因此”简洁地保留因果关系。
- source_word: οὐ δύναμαι ἐλθεῖν
  choice: 不能来
  rationale: 保留δύναμαι所表达的能力或可能性，也保留ἐλθεῖν的方向意义“来”，不擅自具体化为“赴宴”。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“我娶了妻子”比“我已经结婚”更贴近原文措辞，同时不把所称的“不能”弱化为单纯的“不愿意”。
