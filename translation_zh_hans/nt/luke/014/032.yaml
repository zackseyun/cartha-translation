  text: εἰ δὲ μήγε, ἔτι ⸂αὐτοῦ πόρρω⸃ ὄντος πρεσβείαν ἀποστείλας ἐρωτᾷ ⸀τὰ πρὸς εἰρήνην.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/032.yaml
  text: But if not[a], while the other is still far away[b], he sends a delegation and asks for terms of peace.
translation:
  language: zh_hans
  text: 若不然，趁对方还在远处，他就派出使团[a]，请求议和的条件[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使团”也可译作“使节团”或“使者们”。
    reason: lexical_alternative
  - marker: b
    text: 直译为“与和平有关的事”，即达成和平所需的条件。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ μήγε
  choice: 不然
  rationale: 这一固定结构表示与上一节所设情况相反的选择；“不然”在现代汉语中简洁自然，也保留转折意味。
- source_word: ἔτι αὐτοῦ πόρρω ὄντος
  choice: 趁对方还在远处
  rationale: 这是属格独立结构，说明采取行动时的情形。αὐτοῦ在上下文中指来攻打的另一位王，因此译作“对方”以避免指代含混；“还在远处”对应ἔτι与πόρρω。
- source_word: πρεσβείαν
  choice: 使团
  rationale: 该词指受派交涉的使节团体。“使团”简洁、庄重，且符合两王交涉的叙事情境。
- source_word: ἀποστείλας
  choice: 派出
  rationale: 该不定过去时分词所表示的行动先于或伴随主句的请求；汉语用“派出……，请求……”自然呈现行动次序。
- source_word: ἐρωτᾷ
  choice: 请求
  rationale: 这里不是一般询问，而是向对方提出求取和平条件的请求；“请求”能表达这一语用功能。
- source_word: τὰ πρὸς εἰρήνην
  choice: 议和的条件
  rationale: 原意为“与和平有关的事”，在两军对峙的语境中指达成和平所需的条件。“议和的条件”既自然，也保留这是需要交涉的具体事项。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“对方”明确指另一位王，却不增添其身份；“议和的条件”符合军事与外交语境。
