id: LUK.14.21
reference: Luke 14:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ παραγενόμενος ὁ ⸀δοῦλος ἀπήγγειλεν τῷ κυρίῳ αὐτοῦ ταῦτα. τότε ὀργισθεὶς ὁ οἰκοδεσπότης εἶπεν τῷ δούλῳ αὐτοῦ· Ἔξελθε ταχέως εἰς τὰς πλατείας καὶ ῥύμας τῆς πόλεως, καὶ τοὺς πτωχοὺς καὶ ἀναπείρους καὶ ⸂τυφλοὺς καὶ χωλοὺς⸃ εἰσάγαγε ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/021.yaml
  text: And when the servant came back[a], he reported these things to his lord. Then the master of the house, becoming angry, said to his servant, ‘Go out quickly into the broad streets and lanes of the city[b], and bring in here the poor and disabled and blind and lame.’
translation:
  language: zh_hans
  text: 仆人回来，把这些事禀告了主人[a]。家主就生气了，对仆人说：‘快出去，到城里的大街小巷去，把穷人、残疾人[b]、盲人和瘸腿的人带到这里来。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “主人”原文也可译作“主”；这里指仆人的人间主人，并非对上帝的称呼。
    reason: lexical_alternative
  - marker: b
    text: “残疾人”原文也可理解为“肢体残缺的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενόμενος
  choice: 回来
  rationale: 该词本身可指“来到、到达”；结合仆人奉命外出后回来复命的叙事语境，译作“回来”自然地表达了这里隐含的返回之意。
- source_word: δοῦλος
  choice: 仆人
  rationale: δοῦλος可指奴隶或仆役；本节重点是其在家中奉命办事、向主人复命的角色，因此用现代中文常见的“仆人”，不额外突出其法律身份。
- source_word: ἀπήγγειλεν
  choice: 禀告
  rationale: 表示把所得信息报告给上位者；“禀告”既体现上下关系，也符合庄重的叙事语体。
- source_word: κυρίῳ
  choice: 主人
  rationale: 此处κύριος指比喻中仆人的人间主人，并非神圣称号；译作“主人”可避免误解为“主”。
- source_word: ὀργισθεὶς
  choice: 就生气了
  rationale: 分词表达家主听到报告后的反应；“就生气了”自然保留了动作的先后和起始意味。
- source_word: οἰκοδεσπότης
  choice: 家主
  rationale: 该词特指一家之主。“家主”简洁地保留家庭场景，并与前面的κύριος“主人”有所区分。
- source_word: πλατείας καὶ ῥύμας
  choice: 大街小巷
  rationale: πλατεῖαι指宽阔街道或公共街区，ῥῦμαι指较窄的街巷；“大街小巷”是自然中文，也保留两者的对照。
- source_word: ἀναπείρους
  choice: 残疾人
  rationale: 该词指身体有残疾或肢体残缺的人；“残疾人”是清楚、通行且不过度限定具体残疾类型的现代中文表达。
- source_word: εἰσάγαγε ὧδε
  choice: 带到这里来
  rationale: 保留εἰσάγω“带进来”和ὧδε“到这里”的方向感，同时符合现代汉语表达。
theological_decisions:
- issue: 比喻中δοῦλος的社会身份用语
  choice: 仆人
  alternative: 奴隶
  rationale: 原词可涵盖奴隶身份，但本节直接突出的，是他奉主人差遣并回来复命的家庭角色。译作“仆人”避免在经文未强调之处加重法律身份，同时脚注之外不封闭“奴隶”的词义范围。
- issue: 人间主人κύριος的译法
  choice: 主人
  alternative: 主
  rationale: 此处所指是比喻中的人间上位者，不是对上帝或基督的称号；“主人”既表达所属及权威关系，也避免神学性误读。
- issue: οἰκοδεσπότης与κύριος是否使用同一中文词
  choice: 分别译作“家主”和“主人”
  alternative: 两者都译作“主人”
  rationale: 两个希腊词所指为同一人物，却有不同词义侧重：κύριος强调仆人与其主人的关系，οἰκοδεσπότης强调其一家之主的身份。分别翻译可保留原文的词汇变化。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“禀告”体现仆人与主人之间的关系，但不过分文言；“大街小巷”自然传达宽街与窄巷的并列。“残疾人”沿用清楚通行的现代用语，并以脚注保留原词可能偏向肢体残缺的含义。
