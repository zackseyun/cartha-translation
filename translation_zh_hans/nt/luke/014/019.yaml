  text: καὶ ἕτερος εἶπεν· Ζεύγη βοῶν ἠγόρασα πέντε καὶ πορεύομαι δοκιμάσαι αὐτά· ἐρωτῶ σε, ἔχε με παρῃτημένον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/019.yaml
  text: And another said[a], ‘I have bought five yoke of oxen, and I am going to test them. I ask you[b], consider me excused.’
translation:
  language: zh_hans
  text: 另一个人说：“我买了五对牛[a]，要去试试它们。请你原谅我[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译为“五组套牛”；每组是同负一轭的一对牛。
    reason: lexical_alternative
  - marker: b
    text: 原文直译：“把我看作已经获准辞谢的人。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτερος
  choice: 另一个人
  rationale: 在一连串受邀者逐一推辞的叙述中，指接下来另一位受邀者；“另一个人”简洁自然。
- source_word: Ζεύγη βοῶν πέντε
  choice: 五对牛
  rationale: ζεῦγος指成对或同负一轭的牲畜；“五对牛”准确表达数量关系，也比直译为“五轭牛”更符合现代汉语。
- source_word: ἠγόρασα
  choice: 我买了
  rationale: 简单过去时态在汉语中自然表达已经完成、且与眼前推辞理由有关的购买行为。
- source_word: πορεύομαι δοκιμάσαι αὐτά
  choice: 正要去试试它们
  rationale: πορεύομαι在此表示眼下的行动或意向，δοκιμάσαι表示实际试用并检验；“正要去试试”自然传达其迫切性。
- source_word: ἐρωτῶ σε
  choice: 请你
  rationale: 该表达在此引出礼貌请求；汉语以“请你”即可自然体现请求语气，不必强化为恳求。
- source_word: ἔχε με παρῃτημένον
  choice: 准我辞谢
  rationale: 原文是“把我看作已经获准推辞”的结果状态表达；“准我辞谢”在宴请语境中简洁通顺，同时保留请求对方接受其推辞之意。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“五对牛”使普通读者易于理解古代农耕场景；“准我辞谢”保留礼貌请求和推辞赴宴的语境，又避免添加原文未明说的理由。
