  text: saying[a], ‘This man began to build and was not able to finish.’
translation:
  language: zh_hans
  text: 说：“这个人开了工，却未能完工。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγοντες
  choice: 说
  rationale: 现在时主动分词承接上一节中嘲笑者的动作；汉语用“说”自然连接引语，不必生硬保留分词形式。
- source_word: ὅτι
  choice: ：‘
  rationale: 此处引出直接引语，现代汉语以冒号和引号表达最自然。
- source_word: Οὗτος ὁ ἄνθρωπος
  choice: 这个人
  rationale: 准确保留指示词和阳性单数名词，也传达旁观者指指点点的语气，而不额外加入轻蔑色彩。
- source_word: ἤρξατο οἰκοδομεῖν
  choice: 开了工
  rationale: 在建造语境中，“开工”自然表达“开始建造”；加“了”体现已开始这一事实，同时保持简洁。
- source_word: οὐκ ἴσχυσεν
  choice: 没有能力
  rationale: ἰσχύω在此表示具备完成事情的能力，不必限定为体力或力量；“没有能力”保留这一较宽泛的含义。
- source_word: ἐκτελέσαι
  choice: 完工
  rationale: 在建造语境中指把工程完成；“完工”比泛泛的“完成”更自然，并与“开工”形成清楚对应。
theological_decisions: []
translation_notes:
  register: 采用现代、简洁而庄重的叙事语言。“开了工……完工”符合普通现代汉语的建筑语境；译文未把能力不足具体解释为财力、体力或其他原因，保留原文的概括性。
