  yaml_path: translation/nt/luke/014/016.yaml
  text: But he said to him[a], “A certain man was making a great dinner and invited many,”
translation:
  language: zh_hans
  text: 他对那人说：“有一个人正在预备一场盛大的筵席[a]，并邀请了许多人。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“盛大的正餐”或“丰盛的晚餐”。希腊语δεῖπνον通常指一天中的主餐；本段语境所说的是主人正式设席款待宾客。
    reason: 说明δεῖπνον的词义范围，并保留“筵席、正餐、晚餐”等可能译法。
lexical_decisions:
- source_word: ὁ δὲ εἶπεν αὐτῷ
  choice: 他对那人说
  rationale: δέ在这里是轻微的衔接词，表示话语转折或回应；现代汉语不必硬译为“但是”。αὐτῷ译作“那人”，使代词关系自然清楚，同时不增添原文未明说的姓名。
- source_word: Ἄνθρωπός τις
  choice: 有一个人
  rationale: 保留τις所表达的未特指意味，也符合汉语讲述比喻时的自然开场方式。
- source_word: ἐποίει
  choice: 正摆设
  rationale: 未完成时表示当时正在进行或筹办的动作；“摆设宴席”是自然庄重的汉语搭配，比字面化的“制造宴席”准确。
- source_word: δεῖπνον μέγα
  choice: 盛大的宴席
  rationale: δεῖπνον指一天中的正餐，在此为正式款待宾客的饭席；“宴席”切合语境，“盛大”对应μέγα，既可涵盖规模，也可涵盖隆重程度。
- source_word: καὶ ἐκάλεσεν πολλούς
  choice: 并邀请了许多人
  rationale: καλέω在设宴语境中意为“邀请”；πολλούς直译为“许多人”，不限定其身份。
