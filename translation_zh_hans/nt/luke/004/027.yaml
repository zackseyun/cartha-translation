  text: καὶ πολλοὶ λεπροὶ ἦσαν ⸂ἐν τῷ Ἰσραὴλ ἐπὶ Ἐλισαίου τοῦ προφήτου⸃, καὶ οὐδεὶς αὐτῶν ἐκαθαρίσθη, εἰ μὴ Ναιμὰν ὁ Σύρος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/027.yaml
  text: And there were many lepers in Israel in the time of Elisha the prophet, and none of them was cleansed except Naaman the Syrian.
translation:
  language: zh_hans
  text: 先知以利沙在世的时候，以色列中有许多麻风病人，但他们没有一个得洁净，只有叙利亚人乃缦得了洁净。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λεπροὶ
  choice: 麻风病人
  rationale: 指患有圣经语境中所谓“麻风”一类皮肤病的人。“麻风病人”简洁自然，也避免用名词标签完全界定患者。
- source_word: ἐν τῷ Ἰσραὴλ
  choice: 以色列中
  rationale: 保留地点或群体范围上的宽度，不额外限定为“以色列地”或“以色列人中”。
- source_word: ἐπὶ Ἐλισαίου τοῦ προφήτου
  choice: 先知以利沙在世的时候
  rationale: ἐπί加属格在此表示时代背景；此译自然表达“以利沙的时代”，并保留“先知”的称号。
- source_word: ἐκαθαρίσθη
  choice: 得洁净
  rationale: 保留καθαρίζω兼具身体痊愈与礼仪洁净的圣经用语色彩，不将含义缩减为单纯的“治好”。
- source_word: εἰ μὴ
  choice: 只有
  rationale: 在“没有一个……只有……”结构中自然准确地表达例外。
- source_word: Ναιμὰν ὁ Σύρος
  choice: 叙利亚人乃缦
  rationale: 保留乃缦的族属身份及其修辞重点：得洁净的是一位叙利亚人，而不是以色列中的患者。
theological_decisions:
- issue: 麻风语境中洁净用语的含义
  choice: 译作“得洁净”
  alternative: 译作“得医治”或“被洁净”
  rationale: “得洁净”既符合现代汉语，也保留经文中身体病患与礼仪不洁相连的表达，不额外加入教义解释。
- issue: 乃缦族属称谓的修辞作用
  choice: 在正文保留“叙利亚人”
  alternative: 仅译“乃缦”或译“一个叙利亚人乃缦”
  rationale: 希腊文明确标出其族属；保留这一点才能呈现耶稣所举例证中外族人蒙洁净的张力。
- issue: “没有一个”与例外结构
  choice: 译为“他们没有一个得洁净，只有……”
  alternative: 译为“无人得洁净，除了……”
  rationale: 明确αὐτῶν所指的是前述许多麻风病人，同时以自然汉语保留唯一例外。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“先知以利沙在世的时候”比直译“在以利沙之上”自然；“得洁净”保持圣经语域而不过度古雅。
