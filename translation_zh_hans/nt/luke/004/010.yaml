  text: γέγραπται γὰρ ὅτι Τοῖς ἀγγέλοις αὐτοῦ ἐντελεῖται περὶ σοῦ τοῦ διαφυλάξαι σε,
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/010.yaml
  text: 'For it is written: ‘He will command his angels concerning you[c][b][a], to guard you,’'
translation:
  language: zh_hans
  text: 因为经上记着：“他要为你吩咐他的天使，保护你。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γέγραπται
  choice: 经上记着
  rationale: 这是现代汉语中引述圣经的自然表达，既体现完成时被动语态所指向的既有记载，也保留其持续有效的意味。
- source_word: γὰρ
  choice: 因为
  rationale: 保留本句对前文所作的解释和论证关系。
- source_word: ὅτι
  choice: 冒号
  rationale: 汉语在“经上记着”之后自然用冒号引出引文，无须另译“说”。
- source_word: Τοῖς ἀγγέλοις αὐτοῦ
  choice: 他的天使
  rationale: 自然表达所属关系；此处“天使”符合上下文中的使者含义。
- source_word: ἐντελεῖται
  choice: 他要……吩咐
  rationale: 准确表达ἐντέλλομαι将来时所含的命令、嘱咐之意，同时保持庄重而自然。
- source_word: περὶ σοῦ
  choice: 为你
  rationale: περί加属格基本义为“关于你”；在此命令天使保护某人的语境中，汉语“为你”自然表达与此人有关并以其为关切对象的意思。
- source_word: τοῦ διαφυλάξαι σε
  choice: 保护你
  rationale: 此带冠词不定式说明命令的目的或内容；“保护”清楚传达διαφυλάσσω的守护、保全含义，比“看守”更符合现代汉语语境。
theological_decisions:
- issue: 魔鬼所引诗篇经文的范围
  choice: 只翻译路加在本节实际记载的引文，不补入诗篇91:11的其余文字。
  alternative: 按诗篇完整措辞扩充引文。
  rationale: 应忠实呈现路加文本中的引文范围，避免以诗篇平行文本补足本节没有的词句。
- issue: περὶ σοῦ与目的不定式的关系
  choice: 译作“为你吩咐他的天使，保护你”，保留“与你有关的命令”及保护目的。
  alternative: 译作“吩咐他的天使关于你，要守护你”。
  rationale: 希腊语结构容许将περὶ σοῦ理解为命令所关涉的对象，而τοῦ διαφυλάξαι σε说明目的；所选译法不将二者合并成额外的神学主张，同时符合自然汉语。
translation_notes:
  register: 采用现代、庄重且易懂的经文语体。“经上记着”保持圣经引文的正式感；句法简洁，不照搬希腊语语序，也不补足诗篇中路加未引用的内容。
