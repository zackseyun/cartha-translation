  text: καὶ εἶπεν αὐτῷ ὁ διάβολος· Σοὶ δώσω τὴν ἐξουσίαν ταύτην ἅπασαν καὶ τὴν δόξαν αὐτῶν, ὅτι ἐμοὶ παραδέδοται καὶ ᾧ ⸀ἂν θέλω δίδωμι αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/006.yaml
  text: And the devil said to him[a], “I will give you all this authority and their glory, because it has been handed over to me, and I give it to whomever I want.”
translation:
  language: zh_hans
  text: 魔鬼对他说：“我会把这一切权柄和它们的荣耀[a]都给你，因为这一切权柄已经交给我了；我愿意给谁，就给谁。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “荣耀”也可译作“荣华”或“威荣”。这里的希腊词可指荣耀、光彩或显赫。
    reason: lexical_alternative
lexical_decisions:
- source_word: διάβολος
  choice: 魔鬼
  rationale: 在路加的试探叙事中，这是对撒但的固定称谓；“魔鬼”是现代汉语圣经语境中自然、明确的对应。
- source_word: Σοὶ δώσω
  choice: 我都要给你
  rationale: 将前置的与格代词所带的强调，通过“给你”并结合“都”自然表达；避免生硬地译成“给你，我要……”。
- source_word: ἐξουσίαν
  choice: 权柄
  rationale: 此处指统治的权限或支配权，而非单纯的力量；“权柄”能保留这一政治和治理层面的含义。
- source_word: ταύτην ἅπασαν
  choice: 这一切
  rationale: 指向上一节所展示的万国，并表达总括性；“这一切”符合现代汉语习惯。
- source_word: δόξαν αὐτῶν
  choice: 它们的荣耀
  rationale: αὐτῶν回指上一节的万国；“荣耀”保留δόξα的词义与经文语感，同时可涵盖繁华、威荣和显赫。
- source_word: παραδέδοται
  choice: 这已经交给我了
  rationale: “已经……了”体现完成时所表达的既成结果；保留被动形式，也不额外暗示这项移交是否正当或由谁完成。
- source_word: ᾧ ἂν θέλω
  choice: 我愿意给谁
  rationale: 自然表达不定关系结构和意愿，保留魔鬼声称可自行决定受予者的意思。
- source_word: δίδωμι αὐτήν
  choice: 就给谁
  rationale: 用汉语关联句式“愿意给谁，就给谁”表达一般性的处分行为；宾语可由上文自然补足。
theological_decisions:
- issue: 是否把魔鬼关于万国权柄已交给他的说法译成叙述者认可的事实
  choice: 按直接引语如实呈现，不添加表示认可或怀疑的评注
  alternative: 加入“他声称”或“据他说”等疏离性措辞
  rationale: 原文把这句话直接置于魔鬼口中；译文应保留其作为说话者主张的性质，既不替叙述者背书，也不在正文中削弱或否定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“这一切权柄和它们的荣耀”紧贴希腊语结构；后半句用“我愿意给谁，就给谁”形成自然有力的汉语表达。脚注标记置于相关引语分句之后。
