source:
  edition: SBLGNT
  text: Καὶ ὑπέστρεψεν ὁ Ἰησοῦς ἐν τῇ δυνάμει τοῦ πνεύματος εἰς τὴν Γαλιλαίαν. καὶ φήμη ἐξῆλθεν καθ’ ὅλης τῆς περιχώρου περὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/014.yaml
  text: And Jesus returned to Galilee in the power of the Spirit[a], and a report about him went out through all the surrounding region.
translation:
  language: zh_hans
  text: 耶稣带着圣灵的能力回到加利利。有关他的消息[a]传开了，遍及整个周边地区。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “消息”也可译作“名声”或“传闻”。希腊语这个词可指广泛流传的消息，并不说明其内容是正面还是负面。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπέστρεψεν
  choice: 回到
  rationale: 该叙事性不定过去时动词表示返回先前所在的地区；“回到”自然地保留了方向含义。
- source_word: ἐν τῇ δυνάμει
  choice: 带着……的能力
  rationale: 此译法在现代汉语中自然，并保留该介词短语所表达的伴随状态或行动方式，不把它过度限定为单纯的工具关系。
- source_word: τοῦ πνεύματος
  choice: 圣灵的
  rationale: 虽然原文此处只写“灵”，但紧接的上下文清楚指向圣灵；汉语通常需要明确称谓，以免被误解为人的精神或一般灵体。
- source_word: εἰς τὴν Γαλιλαίαν
  choice: 回到加利利
  rationale: “到加利利”符合现代汉语对旅行目的地的通常表达；与“回”连用简洁自然。
- source_word: φήμη
  choice: 消息
  rationale: 该词指广泛流传的报道或消息，本身不明确表示正面或负面。“消息”比“名声”或“传闻”更中性。
- source_word: ἐξῆλθεν
  choice: 传开了
  rationale: 原文以“出去”的动态意象描述消息扩散；汉语用“传开了”既自然，又准确表达这一语境中的运动隐喻。
- source_word: καθ’ ὅλης τῆς περιχώρου
  choice: 遍及周围整个地区
  rationale: 兼顾 κατά 所表达的遍及范围、ὅλης 的整体性，以及 περίχωρος 的周边地域含义。
- source_word: περὶ αὐτοῦ
  choice: 有关他的
  rationale: 这是 περί 加属格在此处自然、清楚的现代汉语表达。
theological_decisions:
- issue: πνεύματος 的所指
  choice: 圣灵
  alternative: 灵；一种未具体说明的灵
  rationale: 路加福音4章紧邻上下文反复明确提到圣灵，并叙述圣灵在耶稣受试探及开始事工时的作为。译作“圣灵”在汉语中澄清上下文所指，却不加入宗派性解释。
- issue: ἐν τῇ δυνάμει 所表达的关系
  choice: 带着圣灵的能力
  alternative: 靠着圣灵的能力；在圣灵的能力中
  rationale: 希腊语 ἐν 在这里可表达范围、状态、伴随方式或工具性。“带着”保留一定开放性，避免把它仅仅解释为工具关系，同时比直译“在……能力中”更符合现代汉语。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“传开了，遍及……”既保留原文消息向外传播的动态感，也避免生硬直译。脚注标记紧跟其所解释的“消息”，以免误指“圣灵”。
