  text: καὶ ἀναστάντες ἐξέβαλον αὐτὸν ἔξω τῆς πόλεως, καὶ ἤγαγον αὐτὸν ἕως ὀφρύος τοῦ ὄρους ἐφ’ οὗ ἡ πόλις ⸂ᾠκοδόμητο αὐτῶν, ὥστε⸃ κατακρημνίσαι αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/029.yaml
  text: And rising up[a], they drove him out of the town and led him to the brow of the hill on which their town had been built[b], so as to throw him down.
translation:
  language: zh_hans
  text: 他们就起身，把他赶出城，带到那座山的边缘[a]；他们的城建在那山上，要把他推下去[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “山的边缘”也可译作“山岭的边缘”或“高地的突出处”。希腊文用词本义与“眉”有关，指高处突出的边缘。
    reason: lexical_alternative
  - marker: b
    text: “推下去”也可译作“从高处扔下去”或“使他坠下去”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστάντες
  choice: 起身
  rationale: 准确保留不定过去时分词所呈现的动作推进：众人从原有状态突然采取行动；现代汉语自然简洁。
- source_word: ἐξέβαλον
  choice: 赶出
  rationale: 此处表示强行逐出；“赶出”体现敌意和强制性，又避免“扔出”可能造成的动作误解。
- source_word: πόλεως
  choice: 城
  rationale: πόλις可指城或城镇；“城”在中文圣经叙事中自然，也不必对拿撒勒的规模作文本以外的限定。
- source_word: ἤγαγον
  choice: 带到
  rationale: 忠实表达ἄγω的一般使其前往之义；上下文已显明敌意，无需强化为原文未明确表达的“拖到”。
- source_word: ἕως ὀφρύος τοῦ ὄρους
  choice: 到……山崖边
  rationale: ὀφρύς本指眉，也可指高地突出的边缘；结合欲将他推下去的语境，“山崖边”在现代汉语中清楚而不生硬。
- source_word: ἐφ’ οὗ ἡ πόλις ᾠκοδόμητο αὐτῶν
  choice: 他们的城所建的山……
  rationale: 保留αὐτῶν的归属意味和ᾠκοδόμητο的过去完成被动态；中文将关系从句整合为“他们的城所建的山”，表达该城建于山上。
- source_word: ὥστε
  choice: 要
  rationale: ὥστε接不定式在此语境表达意图或预期结果；“要”简明呈现众人的目的，同时不把尚未发生的结果说成事实。
- source_word: κατακρημνίσαι
  choice: 把他推下去
  rationale: 该词指从高处使人坠下，常含头朝下摔落之意；“推下去”符合这一现场动作，而不额外加入“杀死”等解释。
theological_decisions:
- issue: 众人暴力行动的强度
  choice: 通过“赶出”“带到山崖边”“要把他推下去”的动作链呈现杀害意图，不直接增译“谋杀”或“杀死”。
  alternative: 译为“拖到悬崖边，要把他摔死”。
  rationale: 原文清楚描写强烈敌意及从高处抛下的企图，但没有使用“杀死”一词；让意图从叙事本身显出，可避免过度释义。
- issue: ὥστε加不定式的目的与结果张力
  choice: 译作“要”，侧重语境中尚未实现的意图。
  alternative: 译作“以致”或“结果要”。
  rationale: 后续叙事表明行动没有达成，因此这里以目的理解最为自然；同时不在正文中加入“企图”等解释性措辞。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“他们的城所建的山崖边”略带书面色彩，用以保留原文关系从句及“他们的城”这一归属表达；避免使用带特定宗教术语色彩的“赶逐”，也避免用“拖”“摔死”等超出明文的强化表达。
