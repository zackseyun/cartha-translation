  text: Καὶ ἦλθεν ⸀εἰς Ναζαρά, οὗ ἦν τεθραμμένος, καὶ εἰσῆλθεν κατὰ τὸ εἰωθὸς αὐτῷ ἐν τῇ ἡμέρᾳ τῶν σαββάτων εἰς τὴν συναγωγήν, καὶ ἀνέστη ἀναγνῶναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/016.yaml
  text: And he came to Nazara[a], where he had been brought up, and as was his custom, he entered the synagogue on the Sabbath day, and stood up to read.
translation:
  language: zh_hans
  text: 耶稣来到拿撒拉[a]，就是他长大的地方。在安息日，他照他一贯的习惯进了会堂，站起来要宣读。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“拿撒勒”。本节希腊文作“拿撒拉”。
    reason: 保留本节希腊文地名形式，同时说明通行的传统译名。
lexical_decisions:
- source_word: Ναζαρά
  choice: 拿撒拉
  rationale: 按本节希腊文专名形式Ναζαρά音译为“拿撒拉”，不在正文中改成较熟悉、对应Ναζαρέτ/Ναζαρέθ等形式的“拿撒勒”；后者列入脚注。
- source_word: τεθραμμένος
  choice: 长大
  rationale: 该完成时被动分词在此指受抚养、成长；“他长大的地方”是自然的现代汉语，也保留其成长经历与该地的关系。
- source_word: κατὰ τὸ εἰωθὸς αὐτῷ
  choice: 照常
  rationale: 简洁自然地表达这是耶稣惯常的做法，没有增加频率或礼仪方面的含义。
- source_word: ἐν τῇ ἡμέρᾳ τῶν σαββάτων
  choice: 安息日
  rationale: 希腊文虽使用σαββάτων的复数形式，但这是指安息日的惯用表达；汉语译作“安息日”最清楚自然。
- source_word: συναγωγήν
  choice: 会堂
  rationale: 在一世纪犹太语境中，此词指犹太人聚会和敬拜的会堂；“会堂”是准确而通行的汉语表达。
- source_word: ἀνέστη ἀναγνῶναι
  choice: 站起来要诵读经文
  rationale: ἀνέστη加目的不定式表示为诵读而起身；“诵读经文”结合会堂场景说明所读内容，符合后文展开，也比单说“阅读”更贴近公开宣读。
theological_decisions:
- issue: 地名Ναζαρά的译法
  choice: 拿撒拉
  alternative: 拿撒勒
  rationale: 正文依本节实际出现的希腊文形式音译，不与其他经文中较熟悉的地名形式静默协调；传统译名保留在脚注中。这一选择不涉及教义判断。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“就是他长大的地方”自然承接地点说明；“照常”简明表达惯常行为；“诵读经文”符合会堂公开读经的语境。
