id: LUK.4.18
reference: Luke 4:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Πνεῦμα κυρίου ἐπ’ ἐμέ, οὗ εἵνεκεν ἔχρισέν με εὐαγγελίσασθαι πτωχοῖς, ἀπέσταλκέν ⸀με κηρύξαι αἰχμαλώτοις ἄφεσιν καὶ τυφλοῖς ἀνάβλεψιν, ἀποστεῖλαι τεθραυσμένους ἐν ἀφέσει,
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/018.yaml
  text: The Spirit of the Lord is upon me[a], because he has anointed me to proclaim good news to the poor. He has sent me to proclaim release to the captives and recovery of sight to the blind, to send out the oppressed in release[b],
translation:
  language: zh_hans
  text: 主的灵在我身上，因为他膏了我，叫我向贫穷的人宣告好消息。他差遣我去宣告：被掳的人得释放[a]，瞎眼的人复明；又使受压迫的人得释放[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “释放”所译的希腊词也可译作“赦免”；这里提到被掳和受压迫的人，语境较倾向解放之意。
    reason: lexical_alternative
  - marker: b
    text: “受压迫的人”直译为“已经被打碎的人”或“被压碎的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πνεῦμα κυρίου
  choice: 主的灵
  rationale: 按属有或来源关系直译，保留以赛亚书引文的表达和新约中通常的含义。
- source_word: ἐπ’ ἐμέ
  choice: 在我身上
  rationale: 希腊文省略系词；汉语补出“在”，既自然，也保留圣灵临到并在其身上的经文语感。
- source_word: οὗ εἵνεκεν
  choice: 因为
  rationale: 该短语表示原因；“因为”准确、自然，不把因果关系改写为较含混的连接。
- source_word: ἔχρισέν με
  choice: 他膏了我
  rationale: 保留χρίω的膏立意象及其弥赛亚回响，同时避免用解释性称谓取代原文。
- source_word: εὐαγγελίσασθαι πτωχοῖς
  choice: 向贫穷的人宣告好消息
  rationale: “宣告好消息”传达公开传报佳音的意思，又不局限为后来的宗教术语；“贫穷的人”不擅自限定为仅物质贫困或仅社会弱势。
- source_word: ἀπέσταλκέν με
  choice: 他差遣我
  rationale: “差遣”表达受命而去；上下文已显示其持续有效的使命，无须用额外词语机械表现希腊语完成时。
- source_word: κηρύξαι
  choice: 去宣告
  rationale: 表达公开传扬、郑重宣布的含义，比单纯“说”更贴近传令者的语义。
- source_word: αἰχμαλώτοις ἄφεσιν
  choice: 被掳的人得释放
  rationale: ἄφεσις可指释放或赦免；与“被掳的人”搭配并置于以赛亚式解放图景中时，“释放”最合语境。
- source_word: τυφλοῖς ἀνάβλεψιν
  choice: 瞎眼的人复明
  rationale: “复明”简洁表达获得或恢复视力，保留ἀνάβλεψις的具体含义。
- source_word: ἀποστεῖλαι τεθραυσμένους ἐν ἀφέσει
  choice: 使受压迫的人得释放
  rationale: 逐词译作“把已经破碎的人在释放中送出去”在现代汉语中生硬；此译以自然的使动结构表达从受摧残状态中释放出去的整体意思。
- source_word: τεθραυσμένους
  choice: 受压迫的人
  rationale: 该完成时被动分词本义为“已经被打碎或压碎的人”；在此释放语境中，“受压迫的人”传达其惯用意义，字面形象则收入脚注。
- source_word: ἐν ἀφέσει
  choice: 得释放
  rationale: 以自然汉语表达进入释放状态，并与前面的ἄφεσις形成清楚的词语呼应。
theological_decisions:
- issue: 以赛亚书引文中ἄφεσις的含义
  choice: 释放
  alternative: 赦免
  rationale: 这里与被掳、瞎眼和被压碎或受压迫的人相连，主要构成解放与复原的图景；不过该词在路加著作中也可表示赦罪，因此在脚注中保留这一真实的词义可能性。
- issue: τεθραυσμένους所指的状态
  choice: 受压迫的人
  alternative: 已经破碎的人／被压碎的人
  rationale: 主文采用符合上下文且普通读者易懂的社会性表达，不把它限定为单纯内在或属灵的破碎；脚注保留原词强烈的“被打碎”形象。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“主的灵”“膏了我”“差遣”等经文关键词；用冒号和分号显明使命内容的并列结构。两处ἄφεσις均译作“释放”，保存原文的重复与主题连贯；所有脚注标记均置于相关词语之后。
