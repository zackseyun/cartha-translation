source:
  edition: SBLGNT
  text: ⸂Ἤγαγεν δὲ⸃ αὐτὸν εἰς Ἰερουσαλὴμ καὶ ⸀ἔστησεν ἐπὶ τὸ πτερύγιον τοῦ ἱεροῦ, καὶ εἶπεν αὐτῷ· Εἰ υἱὸς εἶ τοῦ θεοῦ, βάλε σεαυτὸν ἐντεῦθεν κάτω·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/009.yaml
  text: Then he led him to Jerusalem and set him on the pinnacle of the temple[a], and said to him, “If you are the Son of God[c][b], throw yourself down from here;”
translation:
  language: zh_hans
  text: 于是，魔鬼领他到耶路撒冷，让他站在圣殿的高处[a]，对他说：“你若是上帝的儿子[b]，就从这里跳下去；”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“圣殿的翼端”。希腊词可指建筑物突出的边端或高处；这里的“圣殿”指整个圣殿建筑群，并非专指内殿。
    reason: lexical_alternative_and_cultural_note
  - marker: b
    text: “你若是”也可理解为“既然你是”。这里译作“若是”，以保留试探者挑战的语气。
    reason: alternative_reading
lexical_decisions:
- source_word: ⸂Ἤγαγεν δὲ⸃
  choice: 于是……领
  rationale: δέ在这里推进叙事，译作“于是”自然；ἄγω表示带领或领到，保留魔鬼主动引领耶稣的意味。
- source_word: ἔστησεν
  choice: 让他站在
  rationale: 采用ἵστημι不定过去时的使役含义，即使某人站立、安置某人；现代汉语用“让他站在”清楚自然。
- source_word: ἐπὶ τὸ πτερύγιον τοῦ ἱεροῦ
  choice: 在圣殿建筑群的最高处
  rationale: πτερύγιον字面与“小翼、边翼”相关，在建筑语境中指突出的边端或高处；ἱερόν指整个圣殿建筑群，而非专指内殿。正文采用易懂的功能性表达，并以脚注保留“翼端”这一较直译的可能。
- source_word: Εἰ υἱὸς εἶ τοῦ θεοῦ
  choice: 你若是上帝的儿子
  rationale: εἰ加直陈语气可依语境带有“既然”的意味，但此处译作“若是”更能保留试探者发出挑战的语气；“上帝的儿子”保留其称号性含义。
- source_word: βάλε σεαυτὸν ἐντεῦθεν κάτω
  choice: 就从这里跳下去
  rationale: βάλλω在此命令某人使自己向下坠落；汉语“跳下去”比机械的“把自己扔下去”更符合自发动作的表达，同时保留危险而主动的动作。
theological_decisions:
- issue: 试探者对耶稣身份所用条件句的语气
  choice: 你若是上帝的儿子
  alternative: 既然你是上帝的儿子
  rationale: 希腊语条件句在某些语境可理解为“既然”，但这里保留“若是”可呈现试探与挑战的修辞张力，并不代表叙述者否认耶稣的身份。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“圣殿建筑群”准确区分ἱερόν与专指内殿的ναός；“最高处”避免“殿顶尖”等可能过度限定具体建筑形态的说法。引号内保留分号，以衔接下一节未完的引文。
