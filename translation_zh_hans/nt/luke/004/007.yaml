  text: σὺ οὖν ἐὰν προσκυνήσῃς ἐνώπιον ἐμοῦ, ἔσται σοῦ πᾶσα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/007.yaml
  text: Therefore[a], if you worship before me, it will all be yours.
translation:
  language: zh_hans
  text: 所以，你若在我面前敬拜我，这一切就都是你的了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在我面前下拜。”希腊文动词既可指俯伏、下拜，也可指敬拜；这里采用“敬拜”，因为上下文涉及向魔鬼献上宗教性的尊崇。
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ
  choice: 你
  rationale: 希腊文显式使用第二人称单数代词，带有一定强调；汉语保留“你”，由直接称呼和语序自然承载其强调。
- source_word: οὖν
  choice: 所以
  rationale: 表示由前述权柄与荣耀的许诺推出的结果或条件；“所以”在现代汉语中自然清楚。
- source_word: ἐὰν
  choice: 若
  rationale: 引出条件从句；“若”简洁、庄重，又不显古奥。
- source_word: προσκυνήσῃς
  choice: 敬拜
  rationale: προσκυνέω可指俯伏、下拜或敬拜；本处结合下一节只应敬拜上帝的回应，具有宗教性效忠的分量。脚注保留动作层面的另一译法。
- source_word: ἐνώπιον ἐμοῦ
  choice: 在我面前
  rationale: 保留原文的空间—关系表达，指当着说话者的面向其表示敬拜。为使汉语宾语明确，随“敬拜”补出第二个“我”。
- source_word: ἔσται σοῦ
  choice: 都是你的了
  rationale: 以自然汉语表达将来归属；句末“了”体现条件达成后所有权转归的结果。
- source_word: πᾶσα
  choice: 这一切
  rationale: 阴性单数形式承接上一节所说各国相关的权柄和荣耀；汉语用“这一切”保留概括性，不在本节另行补入原文没有重述的具体名词。
theological_decisions:
- issue: προσκυνέω应译为中性的身体动作，还是宗教性的敬拜
  choice: 敬拜我
  alternative: 在我面前下拜／俯伏在我面前
  rationale: 此处试探要求把本应归给上帝的尊崇献给魔鬼，下一节耶稣的回答也直接谈到敬拜主。因此正文采用“敬拜”体现上下文的宗教分量，同时以脚注保存“下拜”的词义可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“所以”清楚连接上一节，“若”保持简洁庄重；“敬拜我”虽比原文直译“在我面前敬拜”多补一个宾语，却是现代汉语避免歧义所需，并未改变所指对象。
