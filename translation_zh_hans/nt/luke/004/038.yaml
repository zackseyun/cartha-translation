  text: Ἀναστὰς δὲ ⸀ἀπὸ τῆς συναγωγῆς εἰσῆλθεν εἰς τὴν οἰκίαν Σίμωνος. πενθερὰ δὲ τοῦ Σίμωνος ἦν συνεχομένη πυρετῷ μεγάλῳ, καὶ ἠρώτησαν αὐτὸν περὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/038.yaml
  text: And after rising from the synagogue[a], he entered Simon’s house. Now Simon’s mother-in-law was afflicted with a high fever, and they asked him about her.
translation:
  language: zh_hans
  text: 他起身离开会堂，进了西门的家。西门的岳母正发着高烧，他们就为她的事问他[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们就为她求他帮助。”希腊文直译为“他们就为她的事问他”；按上下文，这很可能含有请他帮助她的意思。
    reason: 保留ἐρωτάω在“询问”与“请求”之间的词义幅度，以及περὶ αὐτῆς在此语境中的含义。
lexical_decisions:
- source_word: Ἀναστὰς δὲ ἀπὸ τῆς συναγωγῆς
  choice: 他起身离开会堂
  rationale: 不定过去时分词表示先于主句动作发生的行动；“起身离开”自然表达从会堂出来的动作次序，也保留“起身”的意义。
- source_word: εἰσῆλθεν εἰς τὴν οἰκίαν Σίμωνος
  choice: 进了西门的家
  rationale: εἰσέρχομαι 与 εἰς 表示进入某处；此译简洁自然，并准确表达所属关系。
- source_word: πενθερὰ τοῦ Σίμωνος
  choice: 西门的岳母
  rationale: πενθερά 明确指妻子的母亲；直接翻译亲属称谓，不在正文中添加进一步推论。
- source_word: ἦν συνεχομένη πυρετῷ μεγάλῳ
  choice: 正发着高烧
  rationale: 被动分词与 ἦν 构成迂说结构，描写她正被严重的热病困扰；现代汉语通常以“发高烧”自然表达这种病况。
- source_word: ἠρώτησαν αὐτὸν περὶ αὐτῆς
  choice: 他们就向他询问她的事
  rationale: ἐρωτάω 可表示询问或请求；正文采用较贴近字面的表达，以免把语境所暗示的求助明确化，脚注补充另一可能。
theological_decisions:
- issue: πενθερά 所暗示的西门婚姻状况
  choice: 正文只译作“西门的岳母”
  alternative: 在译文中明说西门已经结婚
  rationale: 亲属称谓本身确实带有婚姻关系的含义，但译文不应超出原文词义另作历史或教义性发挥。
- issue: ἠρώτησαν αὐτὸν περὶ αὐτῆς 中请求的含义
  choice: 他们就向他询问她的事
  alternative: 他们为她恳求他
  rationale: 医治语境很可能表明众人在替她求助，但希腊文表面只说“关于她问他”。正文保留较轻且开放的措辞，脚注说明语境中的请求含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“正发着高烧”符合当代普通话习惯；末句略保留原文的含蓄，并以脚注交代语境所暗示的代求。
