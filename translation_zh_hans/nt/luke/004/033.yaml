- from: 会堂里有一个人，身上有污鬼的灵[a]。他高声喊叫：
  to: 会堂里有一个人，有污鬼之灵附在他身上；他高声喊叫：
  rationale: 将易误解的“污鬼的灵”调整为“污鬼之灵附在他身上”。这保留了原文“有……灵”的核心表达及“灵／鬼”双重术语，并以“附在……身上”使中文句法自然、所指清楚；并非将其扩展为“被附身”的神学性表述。
