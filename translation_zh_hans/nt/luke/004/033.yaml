base_translation:
  language: en
  yaml_path: translation/nt/luke/004/033.yaml
  text: And in the synagogue there was a man having an unclean spirit of a demon[a], and he cried out with a loud voice[b],
translation:
  language: zh_hans
  text: 会堂里有一个人，有污鬼之灵附在他身上；他高声喊叫：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συναγωγῇ
  choice: 会堂
  rationale: 这里指犹太人聚集并敬拜的场所；“会堂”是现代中文圣经语境中准确而通行的称呼。
- source_word: ἄνθρωπος
  choice: 一个人
  rationale: 叙事中的语法形式指一名男子，但本节没有必要在中文中生硬强调性别；“一个人”自然且没有损失相关信息。
- source_word: ἔχων
  choice: 身上有
  rationale: 保留“有、带有”的基本意义，不直接增译为“被附身”，从而避免把原文的表达解释得过满。
- source_word: πνεῦμα δαιμονίου ἀκαθάρτου
  choice: 污鬼的灵
  rationale: 原文同时出现“灵”（πνεῦμα）和“鬼”（δαιμόνιον），而“不洁的”（ἀκαθάρτου）在语法上修饰“鬼”。“污鬼的灵”保留全部要素，也符合简洁庄重的中文表达。
- source_word: ἀνέκραξεν
  choice: 喊叫
  rationale: 该动词表示突然大声呼喊；结合后面的“高声”，译作“喊叫”自然，并避免重复强化。
- source_word: φωνῇ μεγάλῃ
  choice: 高声
  rationale: 这是现代中文表达“大声发出声音”的自然方式，保留原文对音量的强调。
theological_decisions:
- issue: 鬼魔术语的表达
  choice: 污鬼的灵
  alternative: 污灵；被污鬼附身
  rationale: 原文明确同时使用“灵”和“鬼”两个词，并以“不洁的”修饰“鬼”。正文保留这两个要素，不将其简化为“污灵”，也不增加“附身”这一较强的解释性措辞。
translation_notes:
  register: 采用现代、自然而庄重的叙事语言。“身上有”比“具有”更符合普通中文，又比“被附身”更贴近原文较克制的措辞。末尾用冒号承接下一节的喊话。
