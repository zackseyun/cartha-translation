    issue: “污鬼的灵”有属格歧义。
    rationale: 现代汉语的“X的灵”通常指X所拥有或所属的灵，容易把原文所说附在人身上的“鬼魔性灵”误解为“污鬼本身的灵”。
  - severity: low
