  text: καὶ ἀποκριθεὶς εἶπεν αὐτῷ ὁ Ἰησοῦς ὅτι Εἴρηται· Οὐκ ἐκπειράσεις κύριον τὸν θεόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/012.yaml
  text: 'And Jesus answered him[b][a], “It is said: You shall not put the Lord your God to the test.”'
translation:
  language: zh_hans
  text: 耶稣回答他说：“经上说[a]：‘不可考验主——你的上帝。’”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“已经说过”或“已经说了”，不是“写着”。此处译作“经上说”，表明这是对权威经文的引述。
    reason: alternative_reading
  - marker: b
    text: 引自《申命记》6:16；那里的希伯来文使用上帝的名字 YHWH，中文常译作“耶和华”。
    reason: cross_reference
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν αὐτῷ
  choice: 回答他说
  rationale: 这是带有闪语色彩的分词加限定动词结构，表示“回答”或“回应”。译作“回答他说”既保留原文中“回答—说”的形式，也符合庄重而自然的现代汉语。
- source_word: ὅτι
  choice: —
  rationale: 此处引出回答的内容；汉语可直接使用冒号和引号，无须另译。
- source_word: Εἴρηται
  choice: 经上说
  rationale: 该词是 λέγω 的完成时被动形式，字面为“已经说了”，在这里用作权威经文的引用公式。“经上说”既保留“说”而不改成“写”，也明确这是经文引语。
- source_word: Οὐκ ἐκπειράσεις
  choice: 不可试探
  rationale: ἐκπειράζω 指通过要求证明或越界考验而把某人置于试验之下。中文圣经语境中的“试探上帝”能够表达这种僭越测试，并避免冗长。
- source_word: κύριον τὸν θεόν σου
  choice: 主你的上帝
  rationale: 保留希腊文 κύριος 与“你的上帝”同位的紧凑结构，也呼应申命记引文的盟约措辞。
theological_decisions:
- issue: 经文引用公式 Εἴρηται
  choice: 经上说
  alternative: 经上记着说；有话说
  rationale: 希腊文使用 λέγω（说）而非 γράφω（写）。正文保留“说”，同时用“经上”显明其经文权威；脚注说明与传统译法的差异。
- issue: 申命记6:16引文中 κύριος 的译法
  choice: 主
  alternative: 耶和华
  rationale: 路加福音的希腊文本写的是 κύριος，因此正文按希腊文译为“主”。其希伯来文出处使用神名 YHWH，这一点在脚注中说明，不在正文中以希伯来文形式取代希腊文。
- issue: ἐκπειράζω 的神学语义
  choice: 试探
  alternative: 试验；考验
  rationale: 这里并非引诱上帝犯罪，而是僭越地要求上帝证明自己。“试探”保留熟悉而简洁的经文措辞，脚注不必额外展开，因为上下文可限定其含义。
translation_notes:
  register: 采用现代、庄重且易懂的简体中文。“经上说”兼顾原文动词与经文引用功能；“主你的上帝”保留引文的紧凑结构。所有脚注标记均置于正文中。
