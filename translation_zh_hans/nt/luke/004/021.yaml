  text: ἤρξατο δὲ λέγειν πρὸς αὐτοὺς ὅτι Σήμερον πεπλήρωται ἡ γραφὴ αὕτη ἐν τοῖς ὠσὶν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/021.yaml
  text: Then he began to say to them[a], “Today this Scripture has been fulfilled in your hearing.”
translation:
  language: zh_hans
  text: 于是，他开始对他们说：“今天，这段经文已经在你们听着的时候应验了。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤρξατο δὲ λέγειν
  choice: 于是，他开始……说
  rationale: δὲ承接前文、推进叙事，译作“于是”；ἤρξατο与λέγειν构成“开始说”，保留动作起始的叙事意味。
- source_word: πρὸς αὐτοὺς
  choice: 对他们
  rationale: πρός加宾格用于言说动词后，表示说话所面向的对象；“对他们”简洁自然。
- source_word: Σήμερον
  choice: 今天
  rationale: 保留该词位于引语开头的强调位置，传达应验的即时性。
- source_word: πεπλήρωται
  choice: 已经应验了
  rationale: 该词为完成时被动态；“已经应验了”兼顾已经完成的行动及其当前效力，也保留被动含义。
- source_word: ἡ γραφὴ αὕτη
  choice: 这段经文
  rationale: γραφή在此指刚读出的以赛亚书文字；“这段经文”比单说“这经文”更符合现代汉语，同时不额外译成“预言”。
- source_word: ἐν τοῖς ὠσὶν ὑμῶν
  choice: 在你们听见的时候
  rationale: 原文直译为“在你们耳中”，这里按希腊语习语表达听众亲耳听见之际；正文采用自然现代汉语，脚注保留字面形式。
theological_decisions:
- issue: 应验宣告的性质
  choice: 仅宣告这段经文今天在听众听见之际已经应验
  alternative: 扩译为“这预言今天已经由我应验了”
  rationale: 上下文暗示耶稣与经文应验的关系，但本节没有明说“预言”“由我”或具体说明应验方式，因此不将这些解释加入正文。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“于是”衔接耶稣读经后的动作；引语保持简洁有力。正文避免生硬的“应验在你们耳中”，以脚注保存原文意象。
