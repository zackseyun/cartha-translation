id: LUK.4.19
reference: Luke 4:19
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: κηρύξαι ἐνιαυτὸν κυρίου δεκτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/019.yaml
  text: to proclaim the favorable year of the Lord[a][b].
translation:
  language: zh_hans
  text: 宣告主施恩之年[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“宣告主悦纳的年。”
    reason: lexical_alternative
  - marker: b
    text: 本句呼应《以赛亚书》61:2，并可能使人联想到禧年；但原文没有直接使用“禧年”一词。
    reason: cross_reference
lexical_decisions:
- source_word: κηρύξαι
  choice: 宣告
  rationale: 保留该动词公开传扬、如传令者宣布的语气，也承接上文表示目的的不定式结构；不局限为讲道。
- source_word: ἐνιαυτὸν
  choice: 年
  rationale: 该词通常指“年”；此处虽呼应《以赛亚书》61:2，并可能令人联想到禧年，仍不宜泛化为“时期”。
- source_word: κυρίου
  choice: 主
  rationale: 按 κύριος 的通常神学称谓译为“主”；以“主施恩之年”的结构自然表达属主或以主的恩惠为特征之年。
- source_word: δεκτόν
  choice: 施恩
  rationale: 在这一以赛亚引文语境中，δεκτός 表达蒙悦纳、得恩惠的意味。“施恩”以现代汉语自然传达来自主的恩惠，但脚注保留较贴近字面的“悦纳”译法。
theological_decisions:
- issue: 对《以赛亚书》61:2的呼应及禧年意涵
  choice: 正文保留“年”，不直接加入“禧年”
  alternative: 宣告主的禧年
  rationale: 原文确实呼应《以赛亚书》61:2，也可能唤起禧年意象，但希腊文没有明确使用“禧年”一词；正文应保留这种暗示而不把解释写入经文。
- issue: κύριος 的译法
  choice: 主
  alternative: 耶和华
  rationale: 希腊正文使用 κύριος；译作“主”既符合该词通常用法，也不因其旧约引文背景而在正文中过度明确为神名。
- issue: δεκτός 所表达的恩惠与悦纳
  choice: 主施恩之年
  alternative: 主悦纳的年
  rationale: “施恩”在现代汉语中较自然地表达此年以主的恩惠为特征；“悦纳”更贴近传统及字面表达，列入脚注以保留其语义张力。
translation_notes:
  register: 采用简洁、庄重而通顺的现代标准汉语。“宣告”保留公开传扬的语气；“主施恩之年”自然表达该短语，同时借脚注保留“悦纳”的传统和较字面译法。
