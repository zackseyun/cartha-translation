  text: καὶ συντελέσας πάντα πειρασμὸν ὁ διάβολος ἀπέστη ἀπ’ αὐτοῦ ἄχρι καιροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/013.yaml
  text: And after finishing every temptation[a], the devil departed from him until an opportune time.
translation:
  language: zh_hans
  text: 魔鬼结束了所有的试探[a]，就离开了耶稣，直到适当的时候。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“考验”。希腊语这个词既可指“试探”，也可指“考验”；这里因施行者是魔鬼，译作“试探”更自然。
    reason: lexical_alternative
lexical_decisions:
- source_word: συντελέσας
  choice: 用尽了
  rationale: 该词为修饰“魔鬼”的不定过去时主动分词，表示先于主句发生的动作；与“各样的试探”搭配译为“用尽了”，自然表达魔鬼已完成这一轮全部试探。
- source_word: πάντα πειρασμόν
  choice: 各样的试探
  rationale: πᾶς与单数πειρασμόν连用，可表示所涉及的每一种试探或全部试探；“各样的试探”在现代汉语中兼顾其分配性与概括性。πειρασμός也可指“考验”，故以脚注保留。
- source_word: ὁ διάβολος
  choice: 魔鬼
  rationale: 在本叙事中指具有位格的超自然敌对者；“魔鬼”是准确、通行的中文对应。
- source_word: ἀπέστη ἀπ’ αὐτοῦ
  choice: 离开耶稣
  rationale: ἀφίστημι在此指离开或退去。中文直接补出“耶稣”，避免代词指向含混，同时不增加源文没有的实质信息。
- source_word: ἄχρι καιροῦ
  choice: 等候合适的时机
  rationale: ἄχρι表示延续至某一界限，καιρός可指适当、合宜或关键的时机；此译自然传达魔鬼只是暂时离开、将伺机再来的意味。
theological_decisions:
- issue: πειρασμός用于耶稣经历时兼有“试探”与“考验”的语义可能
  choice: 正文采用“试探”
  alternative: 考验
  rationale: 上下文中施动者是魔鬼，其行为旨在诱使耶稣偏离忠诚顺服，因此“试探”最切合直接语境；但整件事也构成对耶稣的考验，故脚注保留另一可能。
- issue: ἄχρι καιροῦ是否暗示魔鬼战略性地等待下一次机会
  choice: 译为“等候合适的时机”
  alternative: 直到某个时候
  rationale: καιρός不只是一般的钟表时间，也常指适当或关键的时机；此处的表述保留魔鬼离开具有暂时性的叙事张力，但不指定后来哪一事件就是该时机。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“用尽了各样的试探”比逐字式的“完成了每一个试探”更符合普通话习惯；“合适的时机”保留καιρός的机会性含义。
