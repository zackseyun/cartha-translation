  text: καὶ ἐπιστὰς ἐπάνω αὐτῆς ἐπετίμησεν τῷ πυρετῷ, καὶ ἀφῆκεν αὐτήν· παραχρῆμα δὲ ἀναστᾶσα διηκόνει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/039.yaml
  text: And standing over her[a], he rebuked the fever, and it left her. Immediately she got up and began serving them.
translation:
  language: zh_hans
  text: 他站在她上方，斥责那高烧，高烧就离开了她[a]。她立刻起来，开始服侍他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“她的高烧就退了”。希腊文把“高烧”呈现为受斥责并离开她的主体。
    reason: 说明原文将“高烧”作为被斥责者及“离开”之主体的句法和形象表达，并提供自然汉语的替代译法。
lexical_decisions:
- source_word: ἐπιστὰς ἐπάνω αὐτῆς
  choice: 站到她身边
  rationale: 该短语描写耶稣来到近前、站在躺卧女子上方的位置。中文若直译为“站在她上方”容易产生悬空之感；“站到她身边”自然地保留了临近并俯临病人的场景，而不添加触摸等细节。
- source_word: ἐπετίμησεν
  choice: 斥责
  rationale: 保留ἐπιτιμάω严厉责令、斥责的语气，也保留经文把高烧作为受斥责对象的鲜明表达。
- source_word: τῷ πυρετῷ
  choice: 那高烧
  rationale: 定冠词所指的是上下文中的高烧；译作“那高烧”比“她的高烧”更直接保留高烧本身作为动词对象的句法呈现。
- source_word: ἀφῆκεν αὐτήν
  choice: 高烧就离开了她
  rationale: 希腊文省略的主语承接“高烧”。明确重复“高烧”，可避免中文代词指代不清，并保留ἀφίημι在此处“离开”的形象说法。
- source_word: παραχρῆμα
  choice: 立刻
  rationale: 准确表达医治随即见效和女子马上行动，语言简洁自然。
- source_word: ἀναστᾶσα
  choice: 起来
  rationale: 自然表达女子从病榻起身的动作，不额外限定为站立或下床。
- source_word: διηκόνει αὐτοῖς
  choice: 开始服侍他们
  rationale: “服侍”准确表达为在场众人提供照料或款待；“开始”在此体现未完成过去时所呈现的行动展开，同时避免宗教职务化的理解。
theological_decisions:
- issue: 斥责高烧是否意味着高烧被人格化或由邪灵造成
  choice: 保留“斥责那高烧”的原文表达，不说明其成因
  alternative: 译为“严厉命令她的病退去”
  rationale: 原文直接说耶稣斥责高烧，突出他的权柄，却没有明说高烧是邪灵；译文不替原文解决这一神学张力。
- issue: ἀφῆκεν的省略主语如何呈现
  choice: 明确译为“高烧就离开了她”
  alternative: 译为“她的高烧就退了”
  rationale: 前者保留希腊文以高烧为离去主体的叙述方式；后者虽更符合日常汉语，却会弱化原文的拟人化表达。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“斥责”保留耶稣发出权威命令的力度；“高烧就离开了她”刻意保留原文较鲜明的表达，脚注补充更符合汉语习惯的译法。
