id: LUK.4.41
reference: Luke 4:41
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐξήρχετο δὲ καὶ δαιμόνια ἀπὸ πολλῶν ⸀κραυγάζοντα καὶ λέγοντα ὅτι Σὺ ⸀εἶ ὁ υἱὸς τοῦ θεοῦ. καὶ ἐπιτιμῶν οὐκ εἴα αὐτὰ λαλεῖν, ὅτι ᾔδεισαν τὸν χριστὸν αὐτὸν εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/041.yaml
  text: Demons also were coming out of many[a], crying out and saying, “You are the Son of God!” But rebuking them, he would not allow them to speak, because they knew that he was the Messiah.
translation:
  language: zh_hans
  text: 又有鬼从许多人身上出来，喊叫着说：“你是上帝的儿子！”但耶稣斥责它们，不许它们说话，因为它们知道他是弥赛亚[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“基督”。希腊语 Χριστός，意为“弥赛亚／受膏者”。
    reason: 保留 Χριστός 的传统译名及其称号含义。
lexical_decisions:
- source_word: δαιμόνια
  choice: 鬼
  rationale: 该词直接指邪灵、鬼魔；现代汉语叙事中“鬼”简洁自然，也不与原文在别处使用的“不洁之灵”混同。
- source_word: ἐξήρχετο
  choice: 出来
  rationale: 未完成时在上下文中表示持续或反复发生；以“又有……出来”的句式自然呈现这一叙事进程。
- source_word: ἀπὸ πολλῶν
  choice: 从许多人身上
  rationale: 原文只说“从许多（人）”，所指对象省略；汉语补出“人”和“身上”以明确鬼从人里面出来，不改变上下文含义。
- source_word: κραυγάζοντα καὶ λέγοντα
  choice: 喊叫着说
  rationale: 既保留大声呼喊的强度，也自然衔接后面的直接引语。
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: 上帝的儿子
  rationale: 保留这一基督论称号的完整形式和称号性质。
- source_word: ἐπιτιμῶν
  choice: 斥责
  rationale: 体现严厉责备并带有权威制止的语气。
- source_word: οὐκ εἴα
  choice: 不许
  rationale: 简洁表达未完成时所呈现的持续或反复禁止。
- source_word: τὸν χριστόν
  choice: 弥赛亚
  rationale: 此处 Χριστός 明显作为称号使用；“弥赛亚”能传达“受膏者”的历史和称号含义，而不把它处理成名字。
- source_word: αὐτὸν εἶναι
  choice: 他是
  rationale: 自然呈现原文在“知道”之后使用的宾语加不定式结构。
theological_decisions:
- issue: 鬼对 Χριστός 的认知如何翻译
  choice: 弥赛亚
  alternative: 基督
  rationale: 原文在此使用的是称号；正文采用“弥赛亚”，脚注保留传统译法“基督”，不把称号名称化。
- issue: “上帝的儿子”与“弥赛亚”的关系
  choice: 分别保留两个称号
  alternative: 将两者合并为一个解释性称谓
  rationale: 鬼喊出“上帝的儿子”，叙述者说明它们知道他是“弥赛亚”；原文既相关联又有所区分，译文不将二者合并，也不额外解释其神学关系。
- issue: ἐπιτιμῶν 的隐含主语
  choice: 明确译为“耶稣”
  alternative: 译为“他”
  rationale: 希腊文依上下文省略主语；汉语补出“耶稣”可避免“他”指向不明，但不增加新的命题内容。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“喊叫着说”保留原文的强烈语气；“不许它们说话”简明体现耶稣持续制止众鬼。脚注标记置于实际涉及异译的“弥赛亚”之后。
