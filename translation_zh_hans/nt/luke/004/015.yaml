  text: καὶ αὐτὸς ἐδίδασκεν ἐν ταῖς συναγωγαῖς αὐτῶν, δοξαζόμενος ὑπὸ πάντων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/015.yaml
  text: And he was teaching in their synagogues[a], being glorified by all.
translation:
  language: zh_hans
  text: 他在他们的会堂里教导人，众人都称赞他[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“众人都尊崇他”或“众人都荣耀他”。希腊语“δοξαζόμενος”可表示受到称赞、尊崇或荣耀。
    reason: 词义存在范围，正文采用合乎语境且自然的“称赞”，脚注保留较强的替代译法及其荣耀用语联系。
lexical_decisions:
- source_word: καὶ
  choice: （不另译）
  rationale: 这里是承接上文的普通连接词。现代汉语直接续述更自然，无须机械译作“并且”，也不加入原文没有明确表达的时间意味。
- source_word: αὐτὸς
  choice: 他
  rationale: 明确保留原文的主语代词，所指为耶稣；不译作“他自己”，以免夸大可能存在的轻微强调。
- source_word: ἐδίδασκεν
  choice: 教导人
  rationale: 未完成时表示过去持续或惯常进行的行动。汉语动词本身不强制标明时态；结合上下文，“教导人”自然保留其过程性和概括性，而不把它限定为单次行动。
- source_word: ἐν ταῖς συναγωγαῖς αὐτῶν
  choice: 在他们的会堂里
  rationale: 按处所结构直译，并保留“他们的”；这里指上文所述地区各地群体的会堂。
- source_word: δοξαζόμενος
  choice: 众人都称赞他
  rationale: δοξάζω在此可指公开称赞、尊崇或给予荣耀。按众人对耶稣教导的正面反应，正文采用现代汉语最自然的“称赞”，并以脚注保留较强的“尊崇／荣耀”含义。希腊语的被动分词在汉语中改为主动分句，以避免生硬。
- source_word: ὑπὸ πάντων
  choice: 众人都
  rationale: ὑπό加属格标明施事者；“众人都”自然表达广泛的公众赞誉，不必理解为逐一无例外的绝对陈述。
theological_decisions:
- issue: δοξαζόμενος用于耶稣时应译为“称赞”“尊崇”还是“荣耀”
  choice: 称赞
  alternative: 尊崇；使他得荣耀；荣耀他
  rationale: 本节语境首先描写众人对耶稣教导的公开好评，因此“称赞”最符合现代汉语表达。脚注同时保留该词与“尊崇、荣耀”语义场的联系，避免把路加用词中可能较强的分量完全抹平，也不把此处直接扩展成原文未明说的完整神学宣告。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“会堂”是通行且准确的圣经历史用语；将希腊语被动分词转为“众人都称赞他”的主动句，使中文流畅，同时完整保留施事者和语义关系。
