lexical_decisions:
- source_word: ἦν κηρύσσων
  choice: 一直在……传道
  rationale: εἰμί的未完成时与现在分词构成迂回未完成时，表示过去持续或反复进行的行动。“一直在……传道”以自然的现代汉语传达这一持续体意义。
- source_word: κηρύσσων
  choice: 传道
  rationale: κηρύσσω指公开宣讲；在会堂事工的语境中，“传道”自然、庄重，也保留公开宣讲的含义。
- source_word: εἰς τὰς συναγωγάς
  choice: 在各会堂里
  rationale: 虽然εἰς通常表示进入或趋向，但此处与活动动词连用，表达宣讲发生的场所或范围；汉语译作“在各会堂里”最为自然。复数冠词结构以“各会堂”体现。
- source_word: συναγωγάς
  choice: 会堂
  rationale: 此处指犹太人的会堂或会堂聚会；“会堂”是现代中文圣经语境中清楚而通行的表达。
- source_word: Ἰουδαίας
  choice: 犹太地
  rationale: 按SBLGNT正文保留Ἰουδαία这一地理名称，不因上下文的加利利背景而协调改写。“犹太地”是清楚、传统且自然的中文地名表达。
theological_decisions:
- issue: 在周围的加利利叙事背景下如何处理τῆς Ἰουδαίας这一地理称谓
  choice: 犹太地
  alternative: 加利利；或把“犹太地”理解为包括更广泛犹太人地区的称谓
  rationale: 遵循所给希腊文本的正文读法，保留“犹太地”，不在译文中消除其与上下文之间可能存在的张力。异文“加利利”以脚注说明，而不据此修改正文。
translation_notes:
  register: 采用现代、简洁而庄重的标准普通话。“一直在”体现持续或反复的过去行动；“各会堂里传道”符合自然汉语，同时保留公开宣讲及场所范围。
