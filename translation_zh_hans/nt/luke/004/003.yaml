  text: ⸂εἶπεν δὲ⸃ αὐτῷ ὁ διάβολος· Εἰ υἱὸς εἶ τοῦ θεοῦ, εἰπὲ τῷ λίθῳ τούτῳ ἵνα γένηται ἄρτος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/003.yaml
  text: Then the devil said to him[a], “If you are the Son of God, tell this stone to become bread.”
translation:
  language: zh_hans
  text: 魔鬼对他说：“你若是上帝的儿子[a]，就叫这块石头变成饼吧。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“既然你是上帝的儿子。”希腊文的条件句在这种挑战中可能表示暂且承认这个前提；正文仍保留“若”的条件形式。
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: （不单独译出）
  rationale: δέ在此是轻微的叙事连接词。现代汉语按上下文自然衔接即可；硬译为“于是”或“然后”会增添原文未必强调的时间推进。
- source_word: ὁ διάβολος
  choice: 魔鬼
  rationale: 在本段中，διάβολος是对撒但的固定称谓；“魔鬼”是现代中文圣经语境中清楚、自然的对应词。
- source_word: Εἰ
  choice: 若
  rationale: εἰ明确引出条件式挑战。“若”保留条件语气及试探场景中的张力，不把它直接解释为“既然”。
- source_word: υἱὸς ... τοῦ θεοῦ
  choice: 上帝的儿子
  rationale: 这里的无冠词表语υἱός在此基督论语境中具有确定及身份性的含义，并非“上帝的一个儿子”。中文无需另加冠词即可自然表达。
- source_word: εἰπὲ
  choice: 叫
  rationale: λέγω的命令式在此带一个以ἵνα引出的内容从句。“叫这块石头变成……”在现代汉语中自然地表达向石头发话使其变化，且不像“命令”那样强化原词。
- source_word: τῷ λίθῳ τούτῳ
  choice: 这块石头
  rationale: λίθος通常指“石头”；量词“块”符合现代汉语习惯，并保留指示词“这”。
- source_word: ἵνα γένηται
  choice: 变成
  rationale: ἵνα加虚拟式在说话动词之后表达所吩咐之事。中文用兼语结构“叫……变成……”简洁自然，并保留变化之义。
- source_word: ἄρτος
  choice: 饼
  rationale: ἄρτος指作为食物的饼或面包。此处用圣经叙事中自然而简洁的“饼”，不擅自具体化为“一块面包”，也不泛化为“食物”。
theological_decisions:
- issue: 条件句εἰ υἱὸς εἶ τοῦ θεοῦ的语力
  choice: 你若是上帝的儿子
  alternative: 既然你是上帝的儿子
  rationale: 正文保留希腊文的条件形式和试探话语的张力，不将其默认为对耶稣身份的直接承认；脚注说明在挑战语境中也可能带有暂且承认前提的语气。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“若”比“如果”略凝练，适合经文语体；“就叫……吧”使挑战性的命令在中文中自然。正文中的[a]紧接引出争议话语的叙述句，明确对应整项条件句脚注。
