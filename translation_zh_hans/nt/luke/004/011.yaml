base_translation:
  language: en
  yaml_path: translation/nt/luke/004/011.yaml
  text: and[a], ‘On their hands they will carry you[b], lest you strike your foot against a stone.’
translation:
  language: zh_hans
  text: 又说：“他们要把你托在手上[a]，免得你的脚撞在石头上[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们要用手托住你”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“免得你的脚绊在石头上”。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ὅτι
  choice: 又说
  rationale: καὶ承接上一节仍在继续的引文，ὅτι引出所引用的话；合译为“又说”符合现代汉语，并保留经文引用的连续性。
- source_word: Ἐπὶ χειρῶν
  choice: 用手
  rationale: 表达由手承托的具体意象；结合动词译为“用手托住”，比生硬的“在手上”更自然。
- source_word: ἀροῦσίν σε
  choice: 他们要……托住你
  rationale: αἴρω在此指抬起、承托；“托住”既清楚自然，也契合保护人不跌碰的语境。
- source_word: μήποτε
  choice: 免得
  rationale: 准确表达否定性的目的或预防意味。
- source_word: προσκόψῃς πρὸς λίθον
  choice: 碰在石头上
  rationale: προσκόπτω与πρός在此描写脚撞碰石头；“碰在……上”是自然的现代汉语表达，同时没有把动作强化成猛烈撞击。
- source_word: τὸν πόδα σου
  choice: 你的脚
  rationale: 保留希腊文的单数形式。
theological_decisions:
- issue: 诗篇引文中天使保护意象的表达
  choice: 他们要用手托住你
  alternative: 他们要把你托在手上
  rationale: 所选译法保留“手”与“承托”的意象，同时使用普通读者易懂的现代汉语；不增添关于保护方式或程度的神学推断。
- issue: προσκόψῃς动作强度的处理
  choice: 碰在石头上
  alternative: 撞在石头上
  rationale: 原词可指撞碰或绊碰；正文采用较中性的“碰”，脚注保留较强的“撞”这一可能，避免过度确定动作强度。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以“又说”衔接上一节持续的引用；“托住”清楚呈现天使用手承托的保护意象。所有脚注标记均已置于正文相应位置。
