  text: καὶ πτύξας τὸ βιβλίον ἀποδοὺς τῷ ὑπηρέτῃ ἐκάθισεν· καὶ πάντων ⸂οἱ ὀφθαλμοὶ ἐν τῇ συναγωγῇ⸃ ἦσαν ἀτενίζοντες αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/020.yaml
  text: And after rolling up the scroll and giving it back to the attendant[a], he sat down[b]. And the eyes of everyone in the synagogue were fixed on him.
translation:
  language: zh_hans
  text: 他把书卷[a]卷好，交还给会堂侍役[b]，就坐下了。会堂里众人的眼睛都定睛看着他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“书”。这个希腊词可泛指书面文献；但在当时的会堂场景中，这应是卷轴形式的书卷。
    reason: lexical_alternative
  - marker: b
    text: 指会堂中负责保管和递送书卷、协助聚会事务的人。
    reason: cultural_note
lexical_decisions:
- source_word: πτύξας
  choice: 卷起来
  rationale: 所指的是把卷轴重新卷起，而不是合上现代装订成册的书；这一表达符合当时书卷的实际形态。
- source_word: βιβλίον
  choice: 书卷
  rationale: 该词可泛指书面文献或书，但在一世纪会堂诵读《以赛亚书》的场景中，具体物件是卷轴；“书卷”既自然，又保留历史背景。
- source_word: ἀποδοὺς
  choice: 交还
  rationale: 该复合动词含有用过之后归还给原持有者的意思；“交还”简洁地保留了这一语义。
- source_word: ὑπηρέτῃ
  choice: 侍役
  rationale: 在此指会堂中协助礼仪并负责保管、递送书卷的人；“侍役”比“仆人”更能体现其职分，又不额外赋予宗教头衔。
- source_word: ἐκάθισεν
  choice: 就坐下了
  rationale: 直接表达叙事动作；“就”自然承接此前连续发生的动作，但不在正文中明说坐下施教的文化含义。
- source_word: πάντων / οἱ ὀφθαλμοὶ
  choice: 所有人的眼睛
  rationale: 保留希腊文以“眼睛”为主语的鲜明画面，同时用现代汉语自然表达其全体范围。
- source_word: ἀτενίζοντες
  choice: 都注视着
  rationale: 表达持续而专注的观看，不加入敌意、惊讶等原文未明说的情绪。
- source_word: συναγωγῇ
  choice: 会堂
  rationale: 上下文明确指犹太人聚会和诵读经文的场所；“会堂”是简明且通行的译法。
theological_decisions:
- issue: 会堂中 βιβλίον 所指物件的历史形态
  choice: 译作“书卷”
  alternative: 译作“书”
  rationale: 此处选择反映一世纪会堂中经卷的实际形态，并非作教义判断；同时以脚注保留该希腊词较宽泛的词义。
- issue: 众人注视耶稣时的情绪
  choice: 仅译为“注视着他”
  alternative: 译为“紧盯着他”或加入惊讶、敌意等情绪
  rationale: ἀτενίζω 表示专注持续地看，但本句本身未规定众人的具体情绪；译文保留这种开放性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“书卷卷起来”有意保留原文动作与物件形态；“所有人的眼睛都注视着他”保留原文以眼睛为主语的画面感。脚注标记均置于正文相应词语之后。
