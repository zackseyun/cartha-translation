  text: Δύνοντος δὲ τοῦ ἡλίου ⸀ἅπαντες ὅσοι εἶχον ἀσθενοῦντας νόσοις ποικίλαις ἤγαγον αὐτοὺς πρὸς αὐτόν· ὁ δὲ ἑνὶ ἑκάστῳ αὐτῶν τὰς χεῖρας ⸂ἐπιτιθεὶς ἐθεράπευεν⸃ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/040.yaml
  text: When the sun was setting[a], all who had people sick with various diseases brought them to him; and he laid his hands on each one of them and healed them.
translation:
  language: zh_hans
  text: 太阳正在落山的时候[a]，凡有患各种疾病之人的，都把他们带到耶稣那里。耶稣逐一把手按在他们身上，医治他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“太阳落山时。”希腊文采用属格独立结构和现在分词，表示这些事发生在太阳正在落山时。
    reason: lexical_alternative
lexical_decisions:
- source_word: Δύνοντος δὲ τοῦ ἡλίου
  choice: 太阳快要落山的时候
  rationale: 用时间从句表达属格独立结构，并以“快要落山”保留现在分词所呈现的日落过程；δὲ在此不必生硬译成“但”或“于是”。
- source_word: ἅπαντες ὅσοι
  choice: 凡……的，都
  rationale: 这一汉语关联结构自然表达原文强调无一例外的总括意义。
- source_word: εἶχον ἀσθενοῦντας νόσοις ποικίλαις
  choice: 家中有患各种疾病之人
  rationale: 这里的“有”表示身边、家中或照料范围内有病人；补出“家中”使汉语关系清楚，但不限定具体亲属身份。“患各种疾病”准确表达疾病种类繁多。
- source_word: ἤγαγον αὐτοὺς πρὸς αὐτόν
  choice: 都把病人带到耶稣那里
  rationale: “带到”自然传达ἄγω；用“病人”回指前述患病者，并明确αὐτόν在语境中所指的耶稣。
- source_word: ἑνὶ ἑκάστῳ αὐτῶν
  choice: 他们每一个人
  rationale: 保留原文双重分配表达所强调的逐一个别关注。
- source_word: τὰς χεῖρας ἐπιτιθεὶς
  choice: 把手按在……身上
  rationale: 这是现代汉语中具体、清楚的身体动作表达，不额外赋予后来的礼仪含义。
- source_word: ἐθεράπευεν
  choice: 治好了
  rationale: 在医治语境中自然表达“使病得医治”；未完成过去时的逐次、持续意味已由“每一个人”及整段场景体现。
theological_decisions:
- issue: 按手动作的含义
  choice: 耶稣把手按在他们每一个人身上
  alternative: 耶稣逐一给他们按手
  rationale: 所选译法直接保留耶稣亲自接触并医治每一个人的具体动作，同时不把经文解释为某种后期教会礼仪。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。拆为两句以避免长句拥挤；第二句明说“耶稣”，使普通读者易于追踪指代。
