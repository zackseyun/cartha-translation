    issue: ὅσα 的范围及汉语搭配
    rationale: “那些事”没有充分表达 ὅσα 的总括性；“发生的那些事……做吧”也不够自然。改为“所发生的一切，你也……做吧”，既保留原文未明说施事者的含蓄，也使中文更流畅。
  - severity: medium
    issue: 批判文本中的括号未获反映
    rationale: SBLGNT 以批判性括号标示“εἰς τὴν Καφαρναούμ”存在文本不确定性。脚注应在保留介词地点义说明的同时提示此点，避免将该短语的文本地位表述得过于确定。
