review_pass:
  verdict: revise
  source_fidelity: 原文的将来时预期、俗语引语、命令语气、听闻而知的性质及两个地点均已基本传达。不过，ὅσα 的“一切／凡是”在“那些事”中减弱；且“发生的那些事……做吧”在汉语中搭配略显生硬。SBLGNT 将“εἰς τὴν Καφαρναούμ”置于批判性括号内，现有脚注仅说明介词而未提示该处的文本不确定性。
  naturalness: “你们一定会用这句俗语对我说”可以理解，但“你们一定会对我说这句俗语”更顺畅。“我们听说在迦百农发生的一切，你也在这里、在你自己的家乡做吧”以省略宾语的方式保留原文将“所发生的事”作为“做”的对象这一刻意简练的表达，同时比“发生的那些事”更凝练。
  terminology: “俗语”“医生”“医治”“迦百农”“家乡”均符合现代标准汉语及本节语境；不涉及需调整的神学术语。
