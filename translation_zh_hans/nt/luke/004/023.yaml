  text: καὶ εἶπεν πρὸς αὐτούς· Πάντως ἐρεῖτέ μοι τὴν παραβολὴν ταύτην· Ἰατρέ, θεράπευσον σεαυτόν· ὅσα ἠκούσαμεν γενόμενα ⸂εἰς τὴν Καφαρναοὺμ⸃ ποίησον καὶ ὧδε ἐν τῇ πατρίδι σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/023.yaml
  text: And he said to them[a], “Surely you will say to me this proverb, ‘Physician, heal yourself.’ Whatever we have heard was done in Capernaum, do here also in your hometown.”
translation:
  language: zh_hans
  text: 耶稣对他们说：“你们一定会对我说这句俗语：‘医生，医治你自己吧！’我们听说在迦百农[a]所发生的一切，你也在这里、在你自己的家乡做吧。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文此处“到／进入迦百农”的短语在批判文本中带有不确定性。所用介词通常有“到、进入”的意思；但与“发生”连用时，按语境表示地点，因此译作“在迦百农”。
    reason: 说明 εἰς 的语境义，并反映 SBLGNT 对该短语的文本不确定性。
lexical_decisions:
- source_word: Πάντως
  choice: 一定
  rationale: 表达说话者对对方将会如此回应的肯定预期，并与后面的将来时相配。
- source_word: ἐρεῖτέ μοι
  choice: 你们会……对我说
  rationale: 保留将来时的预测语气，也自然呈现 λέγω 与间接受词的关系。
- source_word: παραβολὴν
  choice: 俗语
  rationale: 这里所指的是“医生，医治你自己吧”这一简短的民间格言，并非叙事性的比喻故事；“俗语”在现代汉语中自然且贴切。
- source_word: Ἰατρέ
  choice: 医生
  rationale: 直接指行医者；“医生”是现代标准汉语中庄重而自然的称呼，也适合这句俗语。
- source_word: θεράπευσον σεαυτόν
  choice: 医治你自己吧
  rationale: 保留命令语气及“医治”与前面“医生”的词义呼应。
- source_word: ὅσα ἠκούσαμεν γενόμενα
  choice: 我们听说……发生的那些事
  rationale: 既保留这些事是经由听闻得知的，也不擅自把 γενόμενα 明说成耶稣主动施行的事，从而保存原文表达上的开放性。
- source_word: εἰς τὴν Καφαρναοὺμ
  choice: 在迦百农
  rationale: εἰς 通常表示“到、进入”，但与此处“发生”之意结合时表达地点；汉语用“在迦百农”最自然。
- source_word: ποίησον καὶ ὧδε
  choice: 你也在这里……做吧
  rationale: 保留单数命令的直接语气和 καί 的“也”；补出汉语所需的主语“你”，其所指由上下文明确。
- source_word: ἐν τῇ πατρίδι σου
  choice: 在自己的家乡
  rationale: 本段背景是拿撒勒，πατρίς 在此指耶稣的故乡；“家乡”比“祖国”或“本国”更符合语境。
theological_decisions:
- issue: 本节 παραβολή 的性质
  choice: 译为“俗语”
  alternative: “比喻”或“格言”
  rationale: 这里是一句简短而流传性的劝诫语，不是叙事性的比喻；此译法说明文体而不加入宗派性解释。
- issue: γενόμενα 是否明说为耶稣所行的事
  choice: 译为“发生的那些事”
  alternative: “你所做的那些事”或“所行的一切”
  rationale: 上下文确实暗示这些事与耶稣的作为有关，但原文分词本身只说事情发生了；正文不补明施事者，以保留原文的含蓄和张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“医生，医治你自己吧”保留俗语的简洁和命令力度；“在这里，在自己的家乡”保留原文两个地点表达的并列强调。脚注标记放在其实际说明的“迦百农”之后。
