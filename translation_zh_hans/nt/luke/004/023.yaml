- from: 耶稣对他们说：“你们一定会用这句俗语对我说：‘医生，医治你自己吧！’我们听说在迦百农[a]发生的那些事，你也在这里，在自己的家乡做吧。”
  to: 耶稣对他们说：“你们一定会对我说这句俗语：‘医生，医治你自己吧！’我们听说在迦百农[a]所发生的一切，你也在这里、在你自己的家乡做吧。”
  rationale: 修订限于语义范围、汉语表达及脚注的文本批判信息：以“一切”对应 ὅσα，调整语序和标点使引语自然，并将原有介词说明扩展为同时反映源文本的括号标示。未将 γενόμενα 擅译为耶稣主动施行的神迹或作为。
