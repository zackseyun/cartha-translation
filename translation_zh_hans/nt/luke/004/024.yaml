  yaml_path: translation/nt/luke/004/024.yaml
  text: And he said[a], “Truly I tell you, no prophet is accepted in his hometown.”
translation:
  language: zh_hans
  text: 他又说：“我实在告诉你们，没有先知在自己的家乡[a]受人接纳。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“本乡”“故土”或“祖国”。希腊语πατρίς可指一个人的家乡、故乡地区或祖国；这里的场景是拿撒勒，因此正文译作“家乡”。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δέ
  choice: 他又说
  rationale: δέ在这里是轻微的叙事连接词，不必强化为转折；“又说”自然承接上文，并保留主语为代词。
- source_word: Ἀμὴν
  choice: 实在
  rationale: 这里的ἀμήν用于引出郑重断言；“实在”符合现代汉语的庄重表达，也避免在句首音译为“阿们”可能造成的理解障碍。
- source_word: λέγω ὑμῖν
  choice: 我告诉你们
  rationale: 直接保留第一人称发言和复数受话对象，表达自然清楚。
- source_word: οὐδεὶς προφήτης
  choice: 没有先知
  rationale: 简洁表达全称否定，不额外加入解释。
- source_word: δεκτός
  choice: 受人接纳
  rationale: δεκτός指受到认可、悦纳或欢迎；“受人接纳”既保留社会性与评价性的含义，也适合此处格言式陈述。
- source_word: ἐν τῇ πατρίδι αὐτοῦ
  choice: 在自己的家乡
  rationale: πατρίς可指故乡、本乡、本地区或祖国；本段场景在拿撒勒，“家乡”最符合直接语境，同时以脚注保留词义范围。
