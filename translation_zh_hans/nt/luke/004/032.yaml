  text: καὶ ἐξεπλήσσοντο ἐπὶ τῇ διδαχῇ αὐτοῦ, ὅτι ἐν ἐξουσίᾳ ἦν ὁ λόγος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/032.yaml
  text: And they were astonished at his teaching[a], because his word had authority.
translation:
  language: zh_hans
  text: 他们对他的教导感到惊奇，因为他的话带着权柄[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他的信息具有权威”，或“他所说的话带着权柄”。
    reason: λόγος可侧重所传的信息，也可泛指所说的话；ἐν ἐξουσίᾳ可表达“带着权柄”或“具有权威”。
lexical_decisions:
- source_word: ἐξεπλήσσοντο
  choice: 感到惊奇
  rationale: 表达强烈的惊异反应；希腊语未完成时描写当时持续的反应，现代汉语在叙事语境中无需另加“不断”等词也可自然传达。
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: 对他的教导
  rationale: ἐπί加与格在此指出惊奇所针对或所基于的对象；“教导”既可指施教行为，也可指教导内容，比“教义”更贴合会堂中的叙事场景。
- source_word: ὅτι
  choice: 因为
  rationale: 在此引出众人惊奇的原因，译作“因为”能清楚保留因果关系。
- source_word: ἐν ἐξουσίᾳ
  choice: 带着权柄
  rationale: 保留希腊语所强调的说话方式和内在分量；“带着权柄”在现代中文圣经语体中自然、庄重，也避免把经文本身未说明的权柄来源加以展开。
- source_word: ὁ λόγος αὐτοῦ
  choice: 他的话
  rationale: λόγος在这里指耶稣所说的话或言语；“他的话”简洁地保留原文表达，比“他的信息”更少限定为信息内容。
theological_decisions:
- issue: 耶稣言语之权柄的性质
  choice: 译为“他的话带着权柄”，只描述经文明说的权威性
  alternative: “他的信息具有权威”或“他所说的话很有权威”
  rationale: 本节明确陈述耶稣的话带着权柄，却没有在本节中解释这权柄的完整神学根据；译文保留这一宣告，不额外加入基督论说明。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“权柄”比日常用语“权威”略具经文语体色彩，同时能与路加福音中ἐξουσία的相关用法保持较好的词汇联系。
