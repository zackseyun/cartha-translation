  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν πρὸς αὐτοὺς ὅτι Καὶ ταῖς ἑτέραις πόλεσιν εὐαγγελίσασθαί με δεῖ τὴν βασιλείαν τοῦ θεοῦ, ὅτι ⸀ἐπὶ τοῦτο ⸀ἀπεστάλην.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/043.yaml
  text: But he said to them[a], “I must also proclaim the good news of the kingdom of God to the other cities[b], because I was sent for this.”
translation:
  language: zh_hans
  text: 但耶稣对他们说：“我也必须到别的城去传扬上帝的国的福音，因为我奉差遣正是为此。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἑτέραις πόλεσιν
  choice: 别的城
  rationale: ἕτερος表示当前所在地以外的其他地方；πόλις直译为“城”。“别的城”自然简洁，也保留范围扩展的对比。
- source_word: εὐαγγελίσασθαί
  choice: 传扬……的福音
  rationale: εὐαγγελίζω指宣告、传报好消息。“传扬……的福音”在现代汉语中庄重自然，并保留其主动宣告的含义。
- source_word: δεῖ
  choice: 必须
  rationale: δεῖ表达强烈的必要性，在路加著作中常带使命或神圣必要性的意味；“必须”简洁而不弱化这种力度。
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: 上帝国
  rationale: 该短语是路加福音的核心表达。“上帝国”既可涵盖上帝的统治，也保留“国度”的领域意象，不在正文中将二者限定为其中之一。
- source_word: ἐπὶ τοῦτο
  choice: 正是为此
  rationale: 该介词短语表示目的。“正是为此”自然表达目的，并体现τοῦτο所指使命的明确性。
- source_word: ἀπεστάλην
  choice: 我奉差遣
  rationale: 该词为ἀποστέλλω的不定过去时被动式，表示受差派执行使命。“奉差遣”保留被差遣的被动和使命意味，同时不在正文中明说差遣者。
- source_word: Καὶ
  choice: 也
  rationale: καί在此扩展耶稣使命的地域范围；“也”准确表达附加关系。
- source_word: ὁ δὲ εἶπεν πρὸς αὐτοὺς
  choice: 但耶稣对他们说
  rationale: δέ在上下文中形成轻微转折，因为群众想留住耶稣，而他说明自己必须前往别处。为使独立经节指代清楚，以“耶稣”明示ὁ所指。
theological_decisions:
- issue: 耶稣使命宣言的力度
  choice: 译作“我也必须……因为我奉差遣正是为此”，呈现其使命的必要性与受差遣性质，却不明说差遣者。
  alternative: 可明确解释为“上帝差我来正是为了这事”。
  rationale: δεῖ在路加著作中常暗示神圣的必要性，ἀπεστάλην也很可能以神为隐含施事者；但原文没有明说差遣者，因此正文保留这一含蓄表达。
- issue: “上帝的国”的语义范围
  choice: 译作“上帝国”，保留上帝统治与国度领域两方面的可能含义。
  alternative: 可译作“上帝的统治”或“上帝的国度”。
  rationale: 原文βασιλεία可指君王的统治，也可指其国度；不应在此处单方面消除这种语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“传扬”体现公开宣告的使命感；“奉差遣”保持被动和差派含义；句式流畅，同时尽量贴近原文的逻辑次序。
