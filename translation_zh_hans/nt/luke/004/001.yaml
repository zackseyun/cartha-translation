  text: Ἰησοῦς δὲ ⸂πλήρης πνεύματος ἁγίου⸃ ὑπέστρεψεν ἀπὸ τοῦ Ἰορδάνου, καὶ ἤγετο ἐν τῷ πνεύματι ⸂ἐν τῇ ἐρήμῳ⸃
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/001.yaml
  text: And Jesus[a], full of the Holy Spirit, returned from the Jordan and was being led by the Spirit in the wilderness.
translation:
  language: zh_hans
  text: 耶稣满有圣灵，从约旦河回来，在旷野里受圣灵引领。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “受圣灵引领”也可译作“在圣灵里受引领”。希腊文的介词可表达“在……里”，但这里很可能是说圣灵在引领耶稣。
    reason: lexical_alternative
lexical_decisions:
- source_word: πλήρης πνεύματος ἁγίου
  choice: 满有圣灵
  rationale: πλήρης加属格表示“充满、满有”。“满有圣灵”自然、庄重，并保留这是对耶稣当时状态的描述，而不暗示一次瞬间发生的充满事件。
- source_word: ὑπέστρεψεν
  choice: 回来
  rationale: ὑποστρέφω在此表示返回；结合前文叙事视角，“回来”是现代汉语中简洁自然的表达。
- source_word: ἀπὸ τοῦ Ἰορδάνου
  choice: 从约旦河
  rationale: 希腊文只用地名“约旦”，但现代汉语通常称“约旦河”，可避免与现代国家约旦混淆，属于必要的自然化说明。
- source_word: ἤγετο
  choice: 受……引领
  rationale: 未完成时被动语态表达过去持续进行的动作。“受圣灵引领”既保留被动关系，也能自然表达持续引领；汉语不必生硬添加“不断”。
- source_word: ἐν τῷ πνεύματι
  choice: 受圣灵引领
  rationale: ἐν可理解为领域性的“在圣灵里”，也可在被动的ἄγω结构中表达媒介或施动者，即“由圣灵引领”。正文采用后者，使汉语清楚自然；脚注保留前者。
- source_word: ἐν τῇ ἐρήμῳ
  choice: 在旷野里
  rationale: ἔρημος指荒凉、无人之地，不一定特指沙漠。“旷野”符合语境，也避免把地貌说得过于具体。
- source_word: δὲ
  choice: （不单独译出）
  rationale: δὲ是轻微的叙事衔接词。该节承接上文时，汉语可通过语序自然过渡，无须机械译作“于是”或“而”。
theological_decisions:
- issue: ἐν τῷ πνεύματι中“灵”的所指及句法关系
  choice: 正文理解为圣灵是引领耶稣的那一位，译作“受圣灵引领”
  alternative: “在圣灵里受引领”
  rationale: 紧接着“满有圣灵”，最自然的所指是同一位圣灵；路加叙事也把圣灵呈现为主动引领者。不过，ἐν的领域性含义仍有真实的句法可能，因此以脚注保留，而不把这种张力悄然消除。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“满有圣灵”“旷野”“引领”保留经文语体，但避免古奥措辞。脚注标记置于整句末，所说明的是“受圣灵引领”这一表达。
