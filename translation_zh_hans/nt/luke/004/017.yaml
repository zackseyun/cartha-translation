  text: καὶ ἐπεδόθη αὐτῷ βιβλίον ⸂τοῦ προφήτου Ἠσαΐου⸃ καὶ ⸀ἀναπτύξας τὸ βιβλίον εὗρεν τὸν τόπον οὗ ἦν γεγραμμένον·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/017.yaml
  text: 'And the scroll of the prophet Isaiah was handed to him[a], and after unrolling the scroll, he found the place where it was written:'
translation:
  language: zh_hans
  text: 有人把先知以赛亚的书卷递给他[a]。他展开书卷，找到一处，上面写着：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“书”。希腊语βιβλίον可泛指书面文献，但在这里的会堂场景中，最可能指书卷。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεδόθη
  choice: 递给
  rationale: 该被动动词表示“被给予、被递交”；结合会堂宣读经文的场景，“有人把……递给他”是自然的现代汉语表达，也保留了原文未说明递交者的特点。
- source_word: βιβλίον
  choice: 书卷
  rationale: βιβλίον可泛指书面文献，但在一世纪会堂的语境中最可能指卷轴形式的经卷；“书卷”既符合历史情境，也适合中文圣经语体。
- source_word: τοῦ προφήτου Ἠσαΐου
  choice: 先知以赛亚的
  rationale: 按属格结构译出书卷与以赛亚的关联，并保留“先知”这一称号。
- source_word: ἀναπτύξας
  choice: 展开
  rationale: 该不定过去时分词所指动作先于“找到”；“展开”准确体现打开卷轴的动作，汉语顺承句式也自然表达了先后次序。
- source_word: εὗρεν
  choice: 找到
  rationale: 直接对应εὑρίσκω，不额外暗示寻找的难度。
- source_word: τόπον
  choice: 一处
  rationale: τόπος直译为“地方、位置”；在文本语境中，“一处”自然地指书卷中的某个位置，同时不把它明确化为原文未直接使用的“段落”。
- source_word: οὗ ἦν γεγραμμένον
  choice: 上面写着
  rationale: 自然表达“在那里有文字写着”的意思，并以“写着”体现完成后持续存在的书写状态，顺畅引出后文引文。
theological_decisions: []
