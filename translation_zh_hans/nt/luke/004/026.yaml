  text: καὶ πρὸς οὐδεμίαν αὐτῶν ἐπέμφθη Ἠλίας εἰ μὴ εἰς Σάρεπτα τῆς ⸀Σιδωνίας πρὸς γυναῖκα χήραν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/026.yaml
  text: And Elijah was sent to none of them[a], except to Zarephath of Sidon, to a widow.
translation:
  language: zh_hans
  text: 以利亚没有被差遣到她们中任何一个人那里；他只被差遣到西顿的撒勒法[a]，到一个寡妇那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文地名作“萨雷普塔”；通常认为这就是《列王纪上》17:9所说的撒勒法。
    reason: 说明希腊文地名形式，并交代其与旧约通行地名的通常对应。
lexical_decisions:
- source_word: ἐπέμφθη
  choice: 奉差往……去
  rationale: 保留被动语态及未明说的差遣者；“奉差”在现代中文中庄重而可懂，也自然暗示受命而行，却不擅自补出“神”。
- source_word: πρὸς οὐδεμίαν αὐτῶν
  choice: 并没有奉差往她们中任何一个人那里去
  rationale: πρός在这里表示朝向某人；“她们中任何一个人”保留阴性复数指向上文的寡妇，并以“并没有……任何一个”体现οὐδεμίαν的排除意味。
- source_word: Ἠλίας
  choice: 以利亚
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: εἰ μὴ
  choice: 只……
  rationale: 此处是例外结构，不是条件句；“只……到……”自然表达“除……以外没有”的意思。
- source_word: Σάρεπτα
  choice: 撒勒法
  rationale: 采用与《列王纪上》17:9所指旧约地名相衔接的通行中文译名，而非按希腊语形式另译。
- source_word: τῆς Σιδωνίας
  choice: 西顿的
  rationale: 以属格形式“西顿的撒勒法”保留原文地域归属关系，不将其过度明确为城内位置。
- source_word: πρὸς γυναῖκα χήραν
  choice: 到一个寡妇那里
  rationale: 将字面上的“到一个女人，一个寡妇那里”按自然中文合并为“到一个寡妇那里”，不损失信息。
theological_decisions:
- issue: 差遣以利亚者在被动句中未明说
  choice: 保留未说明施事者的被动表达：“奉差”
  alternative: 明确译作“神差遣以利亚”
  rationale: 上下文虽暗示差遣者是神，希腊文却没有明说主语；译文保持原文克制，不把推知的信息直接写入正文。
- issue: αὐτῶν所指群体的性别信息
  choice: 译作“她们”，指向上文以色列的许多寡妇
  alternative: 译作性别中性的“他们”或省略代词
  rationale: 希腊文οὐδεμίαν为阴性，且承接上一节的寡妇；中文用“她们”可准确保留这一语法和语境联系。
translation_notes:
  register: 采用现代、庄重且易懂的普通话书面语。“奉差”保留经文语体及被动含义；句中略有重复，是为清楚呈现“没有往任何一个……只往……”的强烈对比。
