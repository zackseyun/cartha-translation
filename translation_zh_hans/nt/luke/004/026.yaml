  to: 以利亚没有被差遣到她们中任何一个人那里；他只被差遣到西顿的撒勒法[a]，到一个寡妇那里。
  rationale: 修订以“被差遣到”替换较生硬的“奉差往……去”，忠实保留原文的被动形式及未明言的施事者；“她们中任何一个人”继续准确回指上文的寡妇。例外结构仍以“只”表达，不将其误作条件。脚注改锚于地名，并仅说明译名对应及相关旧约经文，不在正文或注释中增添超出原文的解释。
