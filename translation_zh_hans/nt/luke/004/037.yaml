  yaml_path: translation/nt/luke/004/037.yaml
  text: And news about him was spreading into every place in the surrounding region[a].
translation:
  language: zh_hans
  text: 关于他的消息不断传到周围地区的各处。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“关于他的传闻正传到周围地区的每一个地方。”
    reason: 保留ἦχος可译为“传闻”，以及ἐξεπορεύετο较直译为持续“正传到”的表达可能。
lexical_decisions:
- source_word: καὶ
  choice: （不单独译出）
  rationale: 本句承接上文；中文无需机械译为“并且”，省去连接词更自然，也不改变叙事关系。
- source_word: ἐξεπορεύετο
  choice: 传遍了
  rationale: 未完成时表示消息持续向外传播；“传遍了”自然表达这一扩散过程，并与地点范围搭配顺畅。
- source_word: ἦχος
  choice: 消息
  rationale: 该词本义可指“声音”，但与“关于他”和向外传出的动词连用时，语境所指是有关耶稣的消息或传闻。
- source_word: περὶ αὐτοῦ
  choice: 关于他的
  rationale: 直接表达消息的内容，即有关耶稣的事。
- source_word: εἰς πάντα τόπον
  choice: 每一个地方
  rationale: 保留 πᾶς 与单数 τόπος 所体现的逐处、无遗漏的分配意味。
- source_word: τῆς περιχώρου
  choice: 周围地区的
  rationale: περίχωρος 指邻近或周边的地域；此处属格限定“每一个地方”，译为“周围地区的每一个地方”既贴近结构，也符合现代汉语。
theological_decisions: []
