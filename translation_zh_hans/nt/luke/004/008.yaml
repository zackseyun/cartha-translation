id: LUK.4.8
reference: Luke 4:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ⸂ὁ Ἰησοῦς εἶπεν αὐτῷ⸃· Γέγραπται· ⸂Κύριον τὸν θεόν σου προσκυνήσεις⸃ καὶ αὐτῷ μόνῳ λατρεύσεις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/008.yaml
  text: 'And Jesus answered him[a], “It is written: ‘You shall worship the Lord your God[b], and you shall serve only him.’”'
translation:
  language: zh_hans
  text: 耶稣回答他：“经上记着：‘要敬拜[a]主你的上帝，唯独事奉他。’”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“要向主你的上帝俯伏敬拜。”
    reason: lexical_alternative
  - marker: b
    text: 这段引语呼应《申命记》6:13。
    reason: cross_reference
lexical_decisions:
- source_word: ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτῷ
  choice: 耶稣回答他
  rationale: 将希腊文常见的分词加限定动词结构自然地合并为现代汉语叙事表达，同时保留回应、说话者和对象。
- source_word: Γέγραπται
  choice: 经上记着
  rationale: 这是引述圣经的固定用语；既表达“已经写下且仍然有效”的完成时意味，也符合自然、庄重的现代汉语。
- source_word: Κύριον τὸν θεόν σου
  choice: 主你的上帝
  rationale: 按希腊文本直译 κύριος 为“主”，不把旧约底本中的神名形式直接引入新约正文；“你的上帝”保留第二人称所属关系。
- source_word: προσκυνήσεις
  choice: 要敬拜
  rationale: 此处谈到对上帝的专一尊崇，“敬拜”准确传达宗教语境中的核心含义；较字面的“俯伏敬拜”列入脚注。
- source_word: λατρεύσεις
  choice: 要事奉
  rationale: λατρεύω 指向神明所献的敬拜性服事；“事奉”比一般的“服务”更能保留这一宗教含义。
- source_word: αὐτῷ μόνῳ
  choice: 唯独事奉他
  rationale: “唯独”清楚保留 μόνῳ 所表达的排他性，并以自然汉语强调事奉只能归给上帝。
theological_decisions:
- issue: 在指向上帝的经文引语中如何翻译 κύριος
  choice: 主
  alternative: 主宰；耶和华
  rationale: 当前希腊文本使用 κύριος，译作“主”既保留新约文本形式和称号的分量，也避免将所引旧约希伯来文本的神名直接代入新约正文。
- issue: προσκυνέω 与 λατρεύω 的区分
  choice: 分别译作“敬拜”和“事奉”
  alternative: 分别译作“俯伏”和“服事”
  rationale: 上下文要求二者都指向对上帝的宗教性忠诚；分别采用“敬拜”和“事奉”，既保留词义差别，也不削弱专属于上帝的崇拜含义。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。“经上记着”保留圣经引语公式；“唯独事奉他”突出原文的排他性。脚注标记均置于正文相应位置。
