  text: And all in the synagogue were filled with anger when they heard these things,[a]
translation:
  language: zh_hans
  text: 听见这些话时，会堂里所有的人都充满了怒气，[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“都充满了狂怒。”希腊语 θυμός 可指强烈的愤怒或狂怒。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπλήσθησαν
  choice: 满腔
  rationale: 该词是 πίμπλημι 的不定过去时被动式，表示“被充满”。“满腔怒气”是现代汉语中自然、庄重的表达，也保留了怒气充满众人的意象。
- source_word: πάντες
  choice: 众人……都
  rationale: πάντες 指在场的全体。“众人……都”自然传达其整体性和强调语气。
- source_word: θυμοῦ
  choice: 怒气
  rationale: θυμός 在这里指强烈的愤怒。“怒气”符合现代汉语习惯，又不必像“暴怒”那样把强度解释得过满；“狂怒”仍是可能的译法，列入脚注。
- source_word: ἐν τῇ συναγωγῇ
  choice: 会堂里的
  rationale: 介词短语说明众人身处会堂。“会堂里的众人”简洁自然，并清楚保留场所信息。
- source_word: ἀκούοντες
  choice: 听见……
  rationale: 现在分词与主句动作同时发生，并交代引发愤怒的情境。汉语以“听见这些话”置于主句前，能自然表达“当他们听见时”的关系。
- source_word: ταῦτα
  choice: 这些话
  rationale: ταῦτα 是中性复数，回指耶稣先前所说的内容。语境中译作“这些话”比字面的“这些事”更自然，但不增加具体解释。
