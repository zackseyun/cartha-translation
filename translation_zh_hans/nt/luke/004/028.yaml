  naturalness: “听见这些话时，会堂里所有的人都充满了怒气”是自然、庄重的现代书面汉语；调整后避免“会堂里的众人听见……都……”可能造成的轻微结构停顿。句末逗号可保留，以反映本节与下一节行动叙述的连续性。
