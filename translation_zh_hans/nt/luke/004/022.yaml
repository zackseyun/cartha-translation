id: LUK.4.22
reference: Luke 4:22
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ πάντες ἐμαρτύρουν αὐτῷ καὶ ἐθαύμαζον ἐπὶ τοῖς λόγοις τῆς χάριτος τοῖς ἐκπορευομένοις ἐκ τοῦ στόματος αὐτοῦ, καὶ ἔλεγον· ⸂Οὐχὶ υἱός ἐστιν Ἰωσὴφ οὗτος⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/022.yaml
  text: And all were speaking well of him and were marveling at the gracious words coming from his mouth[a], and they were saying[b], “Is this not Joseph’s son?”
translation:
  language: zh_hans
  text: 众人都称赞他[a]，并对他口中说出的恩言[b]感到惊叹。他们说：“这不是约瑟的儿子吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“都为他作见证”。这里的希腊语也可表示众人给予他肯定、说他的好话。
    reason: lexical_alternative
  - marker: b
    text: “恩言”也可理解为“充满恩惠的话”，即带有恩惠、亲切或吸引力的话。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμαρτύρουν αὐτῷ
  choice: 都称赞他
  rationale: 该表达既可指“为他作见证”，也可在语境中表示给予肯定、说他的好话。这里与“感到惊叹”并列，译作“称赞他”更自然，同时以脚注保留另一可能。
- source_word: ἐθαύμαζον
  choice: 感到惊叹
  rationale: 表达众人持续的惊异与赞叹；现代汉语自然，也不过度强化为震惊。
- source_word: ἐπὶ τοῖς λόγοις
  choice: 对……恩言
  rationale: ἐπί加与格在此指出惊叹所针对的对象或缘由；“对……感到惊叹”符合现代汉语表达。
- source_word: τῆς χάριτος
  choice: 恩言
  rationale: 保留“恩惠、亲切、动人”这一语义范围，并维持原文较凝练、可能具有神学意味的表达；脚注说明其性质属格的可能含义。
- source_word: τοῖς ἐκπορευομένοις ἐκ τοῦ στόματος αὐτοῦ
  choice: 从他口中说出的
  rationale: 保留话语“从口中出来”的具体意象，同时采用自然的现代汉语。
- source_word: Οὐχὶ
  choice: 这不是……吗
  rationale: 保留原文预期肯定回答的反问语气。
- source_word: υἱός ἐστιν Ἰωσὴφ οὗτος
  choice: 这是约瑟的儿子
  rationale: 直接、自然地表达群众对耶稣身份的认识，不额外加入解释。
theological_decisions:
- issue: 群众称耶稣为约瑟的儿子，与童女怀孕之间的张力
  choice: 直接译作“这不是约瑟的儿子吗？”
  alternative: 加入“人所认为的”等解释性限定
  rationale: 本节记录的是群众的看法，而不是叙述者在此作出的教义说明。直译可保留经文自身的叙事与神学张力，避免把其他经文中的澄清提前加入本句。
- issue: τῆς χάριτος中“恩”的性质
  choice: 正文译作“恩言”，脚注保留“充满恩惠、亲切或动人之言”的语义空间
  alternative: 明确译成“上帝恩典的话”或仅译成“悦耳的话”
  rationale: 原文可表示话语带有恩惠、温厚或吸引力，却未明确限定为专门的救恩术语，也不宜削弱为单纯悦耳；因此保留其真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“恩言”略带经文语体，但简洁自然；脚注补足其较宽的语义范围。以两个句子呈现众人的反应与发问，使中文节奏清楚，同时保留原文反问的力度。
