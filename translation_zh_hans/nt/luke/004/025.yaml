source:
  edition: SBLGNT
  text: ἐπ’ ἀληθείας δὲ λέγω ὑμῖν, πολλαὶ χῆραι ἦσαν ἐν ταῖς ἡμέραις Ἠλίου ἐν τῷ Ἰσραήλ, ὅτε ἐκλείσθη ὁ οὐρανὸς ⸀ἐπὶ ἔτη τρία καὶ μῆνας ἕξ, ὡς ἐγένετο λιμὸς μέγας ἐπὶ πᾶσαν τὴν γῆν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/025.yaml
  text: But I tell you truly, there were many widows in Israel in the days of Elijah, when the sky was shut up for three years and six months, as a great famine came over all the land.
translation:
  language: zh_hans
  text: 但我实在告诉你们：以利亚的日子，以色列中有许多寡妇；那时天闭塞了三年零六个月，遍地发生了大饥荒。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπ’ ἀληθείας δὲ λέγω ὑμῖν
  choice: 但我实在告诉你们
  rationale: 保留 δὲ 的转折语气，并将 ἐπ’ ἀληθείας 自然地表达为“实在”，强调所说内容真实可靠。
- source_word: χῆραι
  choice: 寡妇
  rationale: 直接对应希腊词，使用现代汉语常见而庄重的称呼。
- source_word: ἐκλείσθη ὁ οὐρανός
  choice: 天闭塞了
  rationale: 保留原文被动表达和圣经意象，指天不降雨而不在正文中增添解释。
- source_word: ἐπὶ ἔτη τρία καὶ μῆνας ἕξ
  choice: 三年零六个月
  rationale: 准确保留原文明确的时长。
- source_word: ἐπὶ πᾶσαν τὴν γῆν
  choice: 遍地
  rationale: γῆ 在此可指土地、地区或全地；“遍地”既自然，也避免过度限定范围。
theological_decisions:
- issue: 天被关闭所隐含的施事者
  choice: 采用被动式“天闭塞了”
  alternative: “上帝使天不降雨”
  rationale: 原文使用神学被动语态，没有明说施事者；译文不补入“上帝”，以保留原文表达。
- issue: 饥荒所及范围
  choice: “遍地”
  alternative: “全世界”或“以色列全境”
  rationale: 原文 πᾶσαν τὴν γῆν 的范围存在语境弹性；“遍地”保留这种可能性，不将其强行解释为全球或仅限以色列。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“以利亚的日子”保留圣经叙事风格；分号清楚连接时间背景与主句。
