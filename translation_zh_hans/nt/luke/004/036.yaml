source:
  edition: SBLGNT
  text: καὶ ἐγένετο θάμβος ἐπὶ πάντας, καὶ συνελάλουν πρὸς ἀλλήλους λέγοντες· Τίς ὁ λόγος οὗτος ὅτι ἐν ἐξουσίᾳ καὶ δυνάμει ἐπιτάσσει τοῖς ἀκαθάρτοις πνεύμασιν, καὶ ἐξέρχονται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/036.yaml
  text: And amazement came upon everyone[a], and they were speaking with one another, saying, “What is this word, that with authority and power he commands the unclean spirits, and they come out?”
translation:
  language: zh_hans
  text: 众人都惊讶不已，彼此议论说：“这是什么话[a]？他竟带着权柄和能力命令污灵，污灵就出来！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “话”也可译作“信息”或“言论”。希腊词 λόγος 在这里可指所说的话，也可涵盖话语所传达的信息。
    reason: lexical_alternative
lexical_decisions:
- source_word: θάμβος
  choice: 惊讶不已
  rationale: 表达强烈的震惊与惊奇，符合现代汉语习惯，又不削弱原词的力度。
- source_word: ἐγένετο ... ἐπὶ πάντας
  choice: 众人都惊讶不已
  rationale: 将希腊语“惊讶临到众人”的结构自然转化为现代汉语状态表达；“众人都”保留 πάντας 的整体范围。
- source_word: συνελάλουν πρὸς ἀλλήλους
  choice: 彼此议论
  rationale: 简明表达未完成时所描写的相互交谈；“议论”在此不暗示正式辩论。
- source_word: Τίς ὁ λόγος οὗτος
  choice: 这是什么话
  rationale: 保留 λόγος 可指所说的话、信息或言论内容的宽度，并与随后耶稣发命令的语境衔接。
- source_word: ὅτι
  choice: 竟
  rationale: 在汉语问句中自然引出令众人惊讶的具体缘由，同时传达语境中的惊叹；不另译为因果连接词，以免句式生硬。
- source_word: ἐν ἐξουσίᾳ καὶ δυνάμει
  choice: 带着权柄和能力
  rationale: 保留两个并列概念及原文次序；“权柄”侧重发令的正当权威，“能力”侧重命令产生实际效果的力量。
- source_word: ἐπιτάσσει
  choice: 命令
  rationale: 准确表达对污灵直接下令的含义，并保留叙述中的鲜明现在时感。
- source_word: τοῖς ἀκαθάρτοις πνεύμασιν
  choice: 污灵
  rationale: 这是简洁而通行的圣经汉语表达，保留“灵”这一超自然主体及 ἀκάθαρτος 的不洁含义，避免心理化解释。
- source_word: ἐξέρχονται
  choice: 出来了
  rationale: 按赶逐污灵的语境，表示污灵从受辖制者身上离开；句末语气自然表达众人的惊叹。
theological_decisions:
- issue: 赶逐污灵语境中超自然主体的称呼
  choice: 污灵
  alternative: 不洁的灵
  rationale: “污灵”忠实保留福音书叙事中的超自然主体与不洁含义，且符合现代中文圣经语体；不将其淡化为心理或象征现象。
- issue: ἐξουσία 与 δύναμις 的区分
  choice: 权柄和能力
  alternative: 权能
  rationale: 分别翻译两个希腊词，保留正当权威与有效力量之间既相关又有区别的张力，避免合并为单一概念。
- issue: λόγος 的语义开放性
  choice: 话，并加脚注说明其他可能
  alternative: 信息／道
  rationale: 上下文首先指耶稣所发出的命令，但 λόγος 也可能涵盖信息或言论内容；正文采用自然的“话”，脚注保留真实的词义幅度。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准普通话。“众人都……彼此……”使叙述流畅；直接引语用惊叹式收束，体现现场的震惊。“污灵”“权柄”保留必要的圣经语汇，但整体避免古奥句法。
