  text: Καὶ κατῆλθεν εἰς Καφαρναοὺμ πόλιν τῆς Γαλιλαίας. καὶ ἦν διδάσκων αὐτοὺς ἐν τοῖς σάββασιν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/031.yaml
  text: And he went down to Capernaum[a], a city of Galilee. And he was teaching them on the Sabbaths.
translation:
  language: zh_hans
  text: 他下到加利利的一座城，就是迦百农。他常在安息日[a]教导他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文“安息日”为复数形式，可能表示在多个安息日反复教导。
    reason: 说明原文复数形式及其可能具有的反复意义。
lexical_decisions:
- source_word: κατῆλθεν
  choice: 下到
  rationale: 保留κατέρχομαι的下行方向；迦百农所处地势低于前文的拿撒勒一带，但译文不进一步解释地理原因。
- source_word: Καφαρναοὺμ
  choice: 迦百农
  rationale: 采用现代中文圣经和基督教语境中通行的地名译法。
- source_word: πόλιν τῆς Γαλιλαίας
  choice: 加利利的一座城
  rationale: πόλιν没有冠词，译作“一座城”；属格τῆς Γαλιλαίας自然表达该城所属的地区。
- source_word: ἦν διδάσκων
  choice: 常……教导
  rationale: 未完成时的εἰμί加现在分词表示持续或反复进行的行动；结合复数“安息日”，用“常”自然传达其延续、惯常的意味。
- source_word: αὐτοὺς
  choice: 他们
  rationale: 原文使用代词且本节没有明说其所指，因此保留“他们”，不擅自补作“众人”或“会堂里的人”。
- source_word: ἐν τοῖς σάββασιν
  choice: 在安息日
  rationale: 现代汉语通常以单数形式泛指每逢安息日；与“常”连用可自然表达希腊文复数可能具有的反复意味，并以脚注保留原文形式。
theological_decisions:
- issue: 是否在正文中按形式直译复数σάββασιν
  choice: 常在安息日
  alternative: 在各安息日／在一个个安息日
  rationale: 复数很可能表示多次安息日的场合，而非专指一次。中文“常在安息日”既传达这种惯常性，又避免“在各安息日”可能造成每个安息日无一例外的过强含义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“下到”保留叙事中的方向感；“常在安息日教导”兼顾未完成时的持续或惯常意味与中文表达习惯。
