  text: ⸀Ἔα, τί ἡμῖν καὶ σοί, Ἰησοῦ Ναζαρηνέ; ἦλθες ἀπολέσαι ἡμᾶς; οἶδά σε τίς εἶ, ὁ ἅγιος τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/034.yaml
  text: Ah! What have you to do with us[e][d][c][b][a], Jesus of Nazareth? Have you come to destroy us? I know who you are—the Holy One of God.
translation:
  language: zh_hans
  text: “啊！[a]拿撒勒人耶稣，[c]我们跟你有什么相干？[b][d]你来是要毁灭我们吗？我知道你是谁——上帝的圣者。”[e]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“嘿！”Ἔα是突然发出的惊恐或抗议声；有些译本按语境意译为“别管我们！”
    reason: lexical_alternative
  - marker: b
    text: 直译：“我们与你有什么？”这是表示划清关系或敌意抗议的闪语式惯用语。
    reason: cultural_note
  - marker: c
    text: 或译：“耶稣这拿撒勒人。”
    reason: lexical_alternative
  - marker: d
    text: 原文的“我们”没有说明所指范围，可能是邪灵代表自己及其他邪灵说话，也可能有更广的所指。
    reason: alternative_reading
  - marker: e
    text: 或译：“上帝的那位圣者。”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔα
  choice: 啊！
  rationale: 这是表示惊恐或抗议的突发呼喊。“啊”保留其简短、强烈的感叹性质，不把它扩译成“别管我们”。
- source_word: τί ἡμῖν καὶ σοί
  choice: 我们跟你有什么相干？
  rationale: 原文直译近似“我们与你有什么？”，是带有疏离和抗议意味的闪语式表达；此译符合现代汉语习惯，同时保留对抗语气。
- source_word: Ἰησοῦ Ναζαρηνέ
  choice: 拿撒勒人耶稣
  rationale: Ναζαρηνέ是呼格，可表示来自拿撒勒的人或作为称谓的“拿撒勒人”；正文采用简洁自然的身份称呼。
- source_word: ἦλθες ἀπολέσαι
  choice: 你来是要毁灭……吗
  rationale: 以目的结构表达不定式ἀπολέσαι，并让ἦλθες所指的来到与眼前威胁自然衔接。
- source_word: ἡμᾶς
  choice: 我们
  rationale: 保留第一人称复数，不说明它究竟包括污灵及其同类、被附之人，还是更广泛的邪灵领域。
- source_word: οἶδά σε τίς εἶ
  choice: 我知道你是谁
  rationale: 直接传达说话者对耶稣身份的辨认，不增添解释。
- source_word: ὁ ἅγιος τοῦ θεοῦ
  choice: 上帝的圣者
  rationale: 尽量贴近属格结构与称号性质，保留“圣者”所表达的分别为圣及与上帝的独特关系，不作教义性扩写。
theological_decisions:
- issue: 邪灵话语中复数ἡμᾶς的指代范围
  choice: 正文只译作“我们”，不明确其所指。
  alternative: 可理解为邪灵代表整个邪灵领域说话，或包括邪灵与被附之人。
  rationale: 希腊文使用复数，却没有界定范围；保留复数可避免消除经文本身的张力。
- issue: 基督论称号ὁ ἅγιος τοῦ θεοῦ
  choice: 译作“上帝的圣者”，不作进一步阐释。
  alternative: 也可译作“上帝那位圣洁者”，并可将其理解为弥赛亚性称号或强调受上帝分别、差遣的称号。
  rationale: 本节明确给出具有重要基督论意义的称号，却没有在此展开其全部含义，因此按原文保留称号。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“有什么相干”准确传达疏离和抗议语气；破折号突出随后说出的身份称号。所有代词与称号均保留原文未加解释的空间。
