  text: But he[a], passing through their midst, went on his way.
translation:
  language: zh_hans
  text: 他却从他们中间穿过[a]，继续前行。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“从他们当中经过”。希腊文只描述耶稣从人群中间经过，并未说明这是如何发生的。
    reason: 说明“διὰ μέσου αὐτῶν”的可行译法，并保留原文对其脱身方式未作交代的中性表述。
lexical_decisions:
- source_word: αὐτὸς
  choice: 他
  rationale: 希腊文明确使用主语代词，并略带强调；现代汉语用“他”即可自然承接上下文，不必加重为“他自己”。
- source_word: δὲ
  choice: 却
  rationale: δέ在此表示温和的转折，与上一节众人的敌对行动形成对照；“却”简洁而自然。
- source_word: διελθὼν
  choice: 穿过去
  rationale: διέρχομαι的过去时分词表示从某一空间通过；“穿过去”保留动作方向，也符合现代汉语表达。
- source_word: διὰ μέσου αὐτῶν
  choice: 从他们中间
  rationale: 该短语描写耶稣从人群中间经过，保留清楚的空间意象，同时不说明事情如何发生。
- source_word: ἐπορεύετο
  choice: 继续上路了
  rationale: πορεύομαι的未完成时描写持续行进；“继续上路了”既表达他离开现场，也保留动作延续的意味。
theological_decisions:
- issue: 本节是否应明示耶稣以神迹脱身
  choice: 采用描述上保持中性的措辞：“从他们中间穿过去”
  alternative: 译成“神奇地从他们中间穿过去”等明示超自然方式的说法
  rationale: 希腊文只叙述耶稣穿过人群继续前行，并未交代这是如何发生的。译文不额外判定机制，以保留原文的含蓄与神学张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“继续上路了”体现未完成时的持续意味；脚注标记已在正文中列出。
