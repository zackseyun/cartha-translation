source:
  edition: SBLGNT
  text: ἡμέρας τεσσεράκοντα πειραζόμενος ὑπὸ τοῦ διαβόλου. καὶ οὐκ ἔφαγεν οὐδὲν ἐν ταῖς ἡμέραις ἐκείναις, καὶ συντελεσθεισῶν ⸀αὐτῶν ἐπείνασεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/002.yaml
  text: for forty days, being tempted by the devil. And he ate nothing during those days, and when they were completed, he was hungry.
translation:
  language: zh_hans
  text: 四十天之久，他受魔鬼的试探[a]。那些日子里，他什么也没有吃；日子满了，他就饿了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“考验”。希腊语动词既可指“试探”，也可指“考验”；这里施动者是魔鬼，因此正文译作“试探”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμέρας τεσσεράκοντα
  choice: 四十天之久
  rationale: 这是表示持续时间的宾格；“四十天之久”在现代汉语中自然地表达整个时段，并保留原文的时间长度。
- source_word: πειραζόμενος
  choice: 受……的试探
  rationale: πειράζω可指“试探”或“考验”。这里施动者是魔鬼，敌对、引诱的语境使“试探”更贴切；另一可能义以脚注保留。
- source_word: ὑπὸ τοῦ διαβόλου
  choice: 受魔鬼的
  rationale: διάβολος在本语境中是对撒但的通行称谓；译作“魔鬼”清楚自然，避免用词源性的“诽谤者”模糊所指。
- source_word: οὐκ ἔφαγεν οὐδὲν
  choice: 他什么也没有吃
  rationale: 自然而有力地表达原文的完全否定，不弱化禁食期间毫无进食之意。
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: 那些日子里
  rationale: 准确表达所指的整个时段，也符合现代汉语习惯。
- source_word: συντελεσθεισῶν αὐτῶν
  choice: 日子满了
  rationale: 将属格独立结构译成简洁的时间表达；“满了”保留这些日子达到终点、全部结束的含义。
- source_word: ἐπείνασεν
  choice: 他就饿了
  rationale: “饿了”自然表达不定过去时在这段时日结束后呈现的饥饿状态；“就”清楚连接前后时间关系。
theological_decisions:
- issue: πειραζόμενος所表达的耶稣在旷野中的经历
  choice: 受魔鬼的试探
  alternative: 受魔鬼的考验
  rationale: 魔鬼作为施动者，使“试探”最符合当前语境；同时不进一步解释基督受试探的性质，以免替原文消解神学张力。词语本身可能具有“考验”义，因此在脚注中保留。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“四十天之久”突出持续时间；“日子满了”简洁保留原文结束、完满的时间意象。正文中的脚注标记[a]与脚注对应。
