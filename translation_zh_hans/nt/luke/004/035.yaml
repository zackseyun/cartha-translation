  text: καὶ ἐπετίμησεν αὐτῷ ὁ Ἰησοῦς λέγων· Φιμώθητι καὶ ἔξελθε ⸀ἀπ’ αὐτοῦ. καὶ ῥίψαν αὐτὸν τὸ δαιμόνιον εἰς ⸀τὸ μέσον ἐξῆλθεν ἀπ’ αὐτοῦ μηδὲν βλάψαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/035.yaml
  text: And Jesus rebuked it[a], saying, “Be silent and come out of him.” And after throwing him into the midst[b], the demon came out of him without harming him at all.
translation:
  language: zh_hans
  text: 耶稣斥责那鬼，说：“住口[a]！从他身上出来！”那鬼把那人摔在众人中间[b]，便从他身上出来了，一点也没有伤害他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文也可译为“闭嘴”；字面意象是“给……套上笼嘴”。
    reason: 保留φιμόω较强烈的字面意象及译法选择。
  - marker: b
    text: 原文直译为“中间”；“众人”是根据会堂场景补出的。
    reason: 说明为使汉语自然清楚而作的语境补足。
lexical_decisions:
- source_word: ἐπετίμησεν αὐτῷ
  choice: 斥责它
  rationale: ἐπιτιμάω表示严厉斥责或喝令；代词所指是上下文中的鬼，译为“它”既明确所指，也不把非人之灵译作那个人。
- source_word: Φιμώθητι
  choice: 住口
  rationale: 该词本义为“被套上笼嘴”，用于制止说话时是强烈的禁声命令；“住口”比“安静”更能体现命令的力度，同时以脚注保留原有意象。
- source_word: ἔξελθε ἀπ’ αὐτοῦ
  choice: 从他身上出来
  rationale: 直接保留逐出污鬼语境中的命令，以及ἀπό所表达的离开关系。
- source_word: ῥίψαν αὐτὸν
  choice: 把那人摔在
  rationale: 分词的主语是“那鬼”，宾语是被附之人；“摔”传达ῥίπτω的猛烈动作，不额外加入原文没有明说的“倒下”。
- source_word: εἰς τὸ μέσον
  choice: 在众人中间
  rationale: 原文直译为“到中间”；结合会堂内众人在场的语境，以“众人中间”自然表达其空间含义，并用脚注标明“众人”是语境补足。
- source_word: τὸ δαιμόνιον
  choice: 那鬼
  rationale: δαιμόνιον在此指被耶稣直接命令并离开那人的邪灵；“鬼”是现代汉语圣经叙事中直接、易懂的对应词。
- source_word: μηδὲν βλάψαν αὐτόν
  choice: 一点也没有伤害他
  rationale: 自然表达μηδέν的完全否定，并清楚说明虽然那人被摔，最终却没有受到伤害。
theological_decisions:
- issue: 逐鬼叙事中δαιμόνιον的所指与呈现
  choice: 译作“鬼”，保留经文将其呈现为受耶稣直接斥责、并从人身上出来的邪灵。
  alternative: 将其抽象化为“邪恶力量”或解释为某种身心疾病。
  rationale: 直接称呼、命令出来以及实际离开的叙述结构，都要求译文保留原文对这一存在的具象呈现；翻译不应将其去神话化，也不应添加经文未作出的医学判断。
- issue: 摔人动作与未受伤之间的张力
  choice: 同时保留“摔在众人中间”和“一点也没有伤害他”。
  alternative: 弱化“摔”的猛烈程度，或将“没有伤害”解释为没有永久性伤害。
  rationale: 原文有意并置猛烈动作与全然未受伤；译文应保存这一张力，不替作者解释其机制或程度。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事语言。“住口”保持耶稣命令的简洁与权威；“那鬼把那人摔在众人中间，便……”使希腊文分词与主句的动作次序在汉语中清楚自然。
