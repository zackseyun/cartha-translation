id: LUK.4.5
reference: Luke 4:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ ἀναγαγὼν ⸀αὐτὸν ἔδειξεν αὐτῷ πάσας τὰς βασιλείας τῆς οἰκουμένης ἐν στιγμῇ χρόνου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/005.yaml
  text: And after leading him up[b][a], he showed him all the kingdoms of the inhabited world in a moment of time.
translation:
  language: zh_hans
  text: 他带耶稣上去[a]，在一瞬间[b]把天下万国都指给他看。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把他带到高处。”原文只说明向上移动，没有说明具体地点。
    reason: lexical_alternative
  - marker: b
    text: 或译：“顷刻之间。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναγαγὼν
  choice: 带耶稣上去
  rationale: 保留ἀνάγω所表达的向上移动，也自然呈现不定过去时分词与主句动作的先后关系；不从《马太福音》的平行经文补入“山”这一地点。为避免中文代词连续出现造成指代含混，明确译作“耶稣”。
- source_word: ἔδειξεν
  choice: 指给他看
  rationale: 符合δείκνυμι在此处“使某人看见、展示”的叙事用法，也是自然的现代汉语表达。
- source_word: πάσας τὰς βασιλείας
  choice: 万国
  rationale: βασιλεία在复数中指各个王国或政权；“万国”简洁、庄重，并准确传达πάσας的总体含义，而非抽象的王权。
- source_word: τῆς οἰκουμένης
  choice: 天下
  rationale: οἰκουμένη本指有人居住的世界，在某些语境也可带文明世界或帝国疆域的色彩；“天下”在现代中文圣经叙事中自然地表达整个有人居住的世界，又不把范围限定为罗马帝国。
- source_word: ἐν στιγμῇ χρόνου
  choice: 在一瞬间
  rationale: στιγμή指时间上的一点，整个短语强调极短的时间；“在一瞬间”自然、准确，并保留时间意味。
theological_decisions:
- issue: 魔鬼如何让耶稣看见万国
  choice: 只叙述他在一瞬间把天下万国指给耶稣看，不说明其具体方式。
  alternative: 明确译成异象式的展示，或从某个实际高处观看。
  rationale: 希腊文本没有说明这是异象、超自然展示，还是从实际地理高处观看；译文不借平行经文或解释性假设消除这种开放性。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“天下万国”凝练地对应“有人居住之世界的一切王国”；用“耶稣”替代首个“他”，避免连续代词导致施事者与受事者混淆。所有脚注标记均已置于正文。
