  text: Γενομένης δὲ ἡμέρας ἐξελθὼν ἐπορεύθη εἰς ἔρημον τόπον· καὶ οἱ ὄχλοι ἐπεζήτουν αὐτόν, καὶ ἦλθον ἕως αὐτοῦ, καὶ κατεῖχον αὐτὸν τοῦ μὴ πορεύεσθαι ἀπ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/042.yaml
  text: And when day came[a], he went out and went to a deserted place. And the crowds were seeking him[b], and they came to him and were trying to keep him from going away from them.
translation:
  language: zh_hans
  text: 天亮时，他出去，往一个荒僻的地方去了[a]。众人一直在寻找他；他们来到他那里，设法留住他[b]，不让他离开他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “荒僻的地方”也可译作“僻静的地方”或“旷野之地”。希腊文指偏僻或无人居住之处。
    reason: lexical_alternative
  - marker: b
    text: “设法留住他”也可译作“拦住他”或“挽留他”。意思是众人试图阻止他离开。
    reason: lexical_alternative
lexical_decisions:
- source_word: Γενομένης δὲ ἡμέρας
  choice: 天亮以后
  rationale: 这是属格独立结构，标明时间转换；“天亮以后”自然地表达进入白昼后的时间背景。
- source_word: ἐξελθὼν ἐπορεύθη
  choice: 他出去，往……去了
  rationale: 将先行的分词动作和主要动词都明确表达出来，同时避免生硬地重复“去”。
- source_word: εἰς ἔρημον τόπον
  choice: 往一个荒僻的地方
  rationale: ἔρημος在这里描述偏僻或无人居住的地点，不必限定为地理意义上的沙漠或旷野。
- source_word: οἱ ὄχλοι
  choice: 众人
  rationale: 指成群聚集的人；“众人”在现代中文叙事中自然、庄重。
- source_word: ἐπεζήτουν
  choice: 一直在寻找
  rationale: 未完成时态表示持续进行的寻找；“一直在”体现这一延续性。
- source_word: ἦλθον ἕως αὐτοῦ
  choice: 他们来到他那里
  rationale: 表达众人最终到达他所在之处，符合ἕως在本句中的语境功能。
- source_word: κατεῖχον αὐτὸν
  choice: 设法留住他
  rationale: κατέχω可指扣留、拦阻或留住；结合未完成时态和后接的不定式结构，“设法留住”表达众人试图阻止他离开，又不武断地解作身体拘禁。
- source_word: τοῦ μὴ πορεύεσθαι ἀπ’ αὐτῶν
  choice: 不让他离开他们
  rationale: 带μή的冠词化不定式说明留住他的目的或结果，即阻止他从他们那里离开。
theological_decisions: []
