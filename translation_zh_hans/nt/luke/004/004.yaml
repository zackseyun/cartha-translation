base_translation:
  language: en
  yaml_path: translation/nt/luke/004/004.yaml
  text: 'And Jesus answered him[b][a], “It is written: ‘Man will not live by bread alone.’”'
translation:
  language: zh_hans
  text: 耶稣回答他：“经上记着：‘人活着，不是单靠饼[b]。’”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 耶稣这里引用申命记8:3。
    reason: cross_reference
  - marker: b
    text: “饼”在此可泛指维持生命的食物。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη πρὸς αὐτόν
  choice: 回答他说
  rationale: 按现代汉语叙事习惯自然表达“向他回答”，既保留回应对象，也避免生硬直译。
- source_word: Γέγραπται
  choice: 经上记着
  rationale: 这是引述圣经的固定用语；“经上记着”自然庄重，并能体现完成时所含持续有效的意味。
- source_word: ὅτι
  choice: ：
  rationale: 此处用于引出引文，汉语以冒号连接引述公式和引文最自然。
- source_word: ἐπ’ ἄρτῳ μόνῳ
  choice: 单靠食物
  rationale: ἐπί与“活”连用，表示维持生命所依赖的基础或凭借。ἄρτος本义为“饼”，在此泛指赖以维生的食物；正文采用自然汉语，脚注保留较直译形式。
- source_word: ζήσεται
  choice: 活着
  rationale: 以现代汉语自然表达将来陈述；在箴言式引文中，无须另加“将要”也能传达普遍性的未来陈述。
- source_word: ὁ ἄνθρωπος
  choice: 人
  rationale: 此处单数名词泛指一般人类。现代汉语“人”既保留单数概括形式，也不会被误解为只指男性。
theological_decisions:
- issue: 圣经引文中ὁ ἄνθρωπος的泛指意义
  choice: 人
  alternative: 一个人；世人
  rationale: 希腊文以单数泛指人类。汉语“人”准确保留这种代表性和普遍性，不必人为强化性别，也不把单数改成抽象集合名词。
- issue: 申命记8:3引文的范围
  choice: 只翻译路加所载“人活着，不是单靠食物”
  alternative: 补入申命记下半句“乃是靠耶和华口里所出的一切话”
  rationale: SBLGNT此处只载引文前半句；不依据其他抄本传统或旧约上下文擅自补足，以保留路加文本现有的引文范围。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“经上记着”保留传统圣经引述语感；“不是单靠食物”符合当代普通话表达。所有脚注标记均已置于正文中。
