  text: σκόπει οὖν μὴ τὸ φῶς τὸ ἐν σοὶ σκότος ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/035.yaml
  text: Therefore[a], watch out lest the light in you be darkness.
translation:
  language: zh_hans
  text: 所以要留心，免得你里面的光是黑暗。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“务要留心，确保你里面的光不是黑暗。”
    reason: μή与命令语气连用时，可在汉语中表达为警告应避免的情形，也可表达为务要确保某事不发生。
lexical_decisions:
- source_word: σκόπει
  choice: 要留心
  rationale: 现在时主动命令语气第二人称单数，表达持续警醒的要求；“要留心”自然、庄重，并保留警告语气。
- source_word: οὖν
  choice: 所以
  rationale: 承接前文关于眼睛、光和黑暗的教导，表明由此得出的劝诫；“所以”在现代汉语中清楚自然。
- source_word: μὴ
  choice: 免得
  rationale: 与命令语气连用，引出需要警惕和避免的情形；“免得”保留警戒意味。
- source_word: τὸ φῶς
  choice: 光
  rationale: 直译并保留光的比喻，不把它限定为悟性、良心或某一种属灵状态。
- source_word: τὸ ἐν σοὶ
  choice: 你里面的
  rationale: 直接表达介词短语，既符合现代汉语，也不额外界定其心理或属灵含义。
- source_word: σκότος
  choice: 黑暗
  rationale: 与“光”形成原文中的鲜明对照，保留其开放的比喻和道德、属灵张力。
- source_word: ἐστίν
  choice: 是
  rationale: 忠实表达简单系词；汉语句中以“是黑暗”自然呈现。
- source_word: —
  choice: 其实
  rationale: 汉语中用于凸显表面被视为“光”的东西可能实为“黑暗”这一反差；不改变命题内容。
theological_decisions:
- issue: “光”与“黑暗”的比喻含义
  choice: 正文保留“光”和“黑暗”的比喻，不将其具体解释为悟性、良心或单一的属灵状态。
  alternative: 将“光”解释性译为“悟性”“内在之光”或“良心”。
  rationale: 本句与前文关于眼睛和全身光明的教导相连，比喻涵义宽广。具体化会缩窄原文，并消解其有意保留的神学张力。
- issue: μή从句的句法表达
  choice: 译作“免得……是……”，突出警告一种应当防备的可能。
  alternative: 译作“务要确保……不是……”，把它表达为应当保证的否定状态。
  rationale: 两种理解在语义上接近；正文采用警戒式表达，脚注保留另一种自然且可能的句法呈现。
translation_notes:
  register: 采用现代、庄重而通俗的标准普通话。“所以要留心”承接上文并保持劝诫力度；“你里面的光”和“黑暗”保留原文简洁、有张力的比喻。
