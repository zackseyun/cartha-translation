  text: τότε πορεύεται καὶ παραλαμβάνει ⸂ἕτερα πνεύματα πονηρότερα ἑαυτοῦ ἑπτά⸃, καὶ ⸀εἰσελθόντα κατοικεῖ ἐκεῖ, καὶ γίνεται τὰ ἔσχατα τοῦ ἀνθρώπου ἐκείνου χείρονα τῶν πρώτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/026.yaml
  text: Then it goes and takes along seven other spirits more evil than itself[a], and they enter and live there[c][b]; and the last state of that man becomes worse than the first.
translation:
  language: zh_hans
  text: 于是，它去带了七个比自己更邪恶的灵[a][b]来；它们进去以后，住在那里。那个人后来的景况比先前更糟了[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “比自己更邪恶”也可译作“比自己更恶”。
    reason: lexical_alternative
  - marker: b
    text: 希腊原文在这里说的是“灵”，没有明确说“鬼”或“不洁净的灵”，但上下文清楚表明这些灵是邪恶的。
    reason: lexical_alternative
  - marker: c
    text: “后来的景况”也可译作“最终的状况”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: 那时
  rationale: 表示叙事中的时间顺序；“那时”自然承接前文。
- source_word: πορεύεται καὶ παραλαμβάνει
  choice: 它就去，另带来
  rationale: 既保留“去”的动作，也体现 παραλαμβάνει 所含“带在身边、带同”的意思；“另”自然引出其余七个灵。
- source_word: ἕτερα πνεύματα
  choice: 七个……的灵
  rationale: πνεύματα 本身只说“灵”，本节没有明说“鬼”或“不洁净的灵”，因此不在正文中增补。
- source_word: πονηρότερα ἑαυτοῦ
  choice: 比自己更邪恶
  rationale: 保留比较结构以及反身代词所指的原先那个灵；“邪恶”兼顾道德败坏与敌对意味。
- source_word: εἰσελθόντα κατοικεῖ ἐκεῖ
  choice: 它们进去以后，就住在那里
  rationale: 以复数“它们”承接复数分词 εἰσελθόντα，并用“以后”表达先进入、后居住的动作关系；虽然后面的 κατοικεῖ 形式为单数，语意上涉及这一群灵。
- source_word: τὰ ἔσχατα ... χείρονα τῶν πρώτων
  choice: 后来的景况……比先前更糟
  rationale: 这是描述此人前后处境的惯用对比；译作“后来的景况／先前”比直译“末后的／起初的”更符合现代汉语。
- source_word: τοῦ ἀνθρώπου ἐκείνου
  choice: 那个人
  rationale: 指比喻中的特定个人；现代汉语“那个人”自然、准确。
theological_decisions:
- issue: 是否在正文中明确称这些灵为“鬼”或“不洁净的灵”
  choice: 灵
  alternative: 鬼；不洁净的灵
  rationale: 上下文清楚表明其邪恶性质，但本节希腊文只用 πνεύματα。正文保留原文措辞，以“更邪恶”说明其性质，不额外增添称谓。
- issue: κατοικεῖ 的单数形式与 εἰσελθόντα 的复数形式如何处理
  choice: 按语意用复数“它们……住”
  alternative: 按动词形式译为单数“它住”
  rationale: 复数分词明确承接七个别的灵，而整个场景也涉及多个灵；汉语用复数主语更通顺，同时在翻译说明中保留这一语法张力。
- issue: τὰ ἔσχατα 是否带有末世或终局的专门神学含义
  choice: 后来的景况
  alternative: 最终的结局；末后的光景
  rationale: 这里主要与 τῶν πρώτων 对举，描述此人后来比先前更坏的处境；不应无根据地强化为专门的末世论术语。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“它”承接前文的不洁净之灵；“另带来”避免生硬直译，同时保留带同之意。分号划分带来众灵、进入居住，以及此人景况恶化三个层次。
