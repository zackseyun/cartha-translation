source:
  edition: SBLGNT
  text: τινὲς δὲ ἐξ αὐτῶν εἶπον· Ἐν Βεελζεβοὺλ ⸀τῷ ἄρχοντι τῶν δαιμονίων ἐκβάλλει τὰ δαιμόνια·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/015.yaml
  text: But some of them said[a], “By Beelzebul, the ruler of the demons, he casts out demons.”
translation:
  language: zh_hans
  text: 可是，他们中间有些人说：“他是靠着鬼王别西布勒[a]赶鬼。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “别西布勒”也有传统名称形式译作“别西卜”。
    reason: 说明希腊文所反映的名称形式与较熟悉的传统译名之间的差异。
lexical_decisions:
- source_word: τινὲς δὲ ἐξ αὐτῶν
  choice: 可是，他们中间有些人
  rationale: τινές表示在场人群中未具体指明的一部分人；ἐξ αὐτῶν保留“他们中间”的部分关系；δέ在上下文中带有转折意味，因此译作“可是”。
- source_word: εἶπον
  choice: 说
  rationale: 不定过去时在这里把发言作为一个整体事件陈述，现代汉语用“说”自然准确。
- source_word: Ἐν Βεελζεβοὺλ
  choice: 靠着……别西布勒
  rationale: ἐν与人名连用，在此表示凭借其力量或权势；“靠着”比直译“在……里面”更符合现代汉语，同时不额外说明这种力量如何运作。人名按希腊文Βεελζεβούλ的形式音译为“别西布勒”。
- source_word: τῷ ἄρχοντι τῶν δαιμονίων
  choice: 鬼王
  rationale: ἄρχων表示统治者或掌权者，τῶν δαιμονίων说明其统辖对象。“鬼王”在简洁、自然的汉语中传达“众鬼的统治者”，而不引入更细致的鬼魔等级体系。
- source_word: ἐκβάλλει τὰ δαιμόνια
  choice: 赶鬼
  rationale: ἐκβάλλω在驱逐鬼魔的语境中指赶出；“赶鬼”是现代汉语中清楚而凝练的表达，并直接对应τὰ δαιμόνια。
theological_decisions:
- issue: 鬼王之名Βεελζεβούλ的译法
  choice: 别西布勒
  alternative: 别西卜
  rationale: 正文按所给希腊文本末尾的-l形式音译，以原文为先；“别西卜”是汉语读者较熟悉的传统名称形式，列入脚注，避免把传统形式无声地代入正文。
- issue: ἄρχων所表达的鬼魔权势
  choice: 鬼王
  alternative: 众鬼的统治者
  rationale: “鬼王”自然表达此名所带的同位称号，即统辖众鬼者；本节只是在转述一些人的指控，并未要求译文建立更完整的鬼魔等级或身份教义。
- issue: ἐν所表达的关系
  choice: 靠着
  alternative: 借着
  rationale: 这里可表示凭借某位权势者的能力或授权。“靠着”保留这种工具或权势关系，同时不替说话者的指控补入超出原文的解释。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事语言。“可是”承接上文群众反应并突出转折；“他们中间有些人”清楚保留部分关系；引语中的“靠着鬼王……赶鬼”简洁有力，符合指控语气。
