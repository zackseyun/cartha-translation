  text: οὐαὶ ⸀ὑμῖν, ὅτι ἐστὲ ὡς τὰ μνημεῖα τὰ ἄδηλα, καὶ οἱ ἄνθρωποι ⸀οἱ περιπατοῦντες ἐπάνω οὐκ οἴδασιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/044.yaml
  text: Woe to you, because you are like unmarked tombs, and the men walking over them do not know it.
translation:
  language: zh_hans
  text: 你们有祸了！因为你们好像没有标记的坟墓，人从上面走过，却毫不知情。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐαὶ ὑμῖν
  choice: 你们有祸了
  rationale: 保留先知式祸哉宣告的严肃语气，同时采用现代汉语中清楚自然的表达。
- source_word: τὰ μνημεῖα τὰ ἄδηλα
  choice: 没有标记的坟墓
  rationale: ἄδηλα 指不显明、无法辨认；在此语境中是没有可辨识标志的坟墓。
- source_word: οἱ ἄνθρωποι
  choice: 人
  rationale: 原词泛指人们，并非特指男性；汉语用“人”最自然，也准确保留其普遍意义。
- source_word: περιπατοῦντες ἐπάνω
  choice: 从上面走过
  rationale: 直陈人在坟墓上方行走的动作，保留原文所表达的无意踩过之意。
- source_word: οὐκ οἴδασιν
  choice: 却不知道
  rationale: 保留“不知情”的核心含义；“却”自然呈现与从上面走过之间的反差。
theological_decisions:
- issue: 未标记坟墓所暗含的礼仪不洁
  choice: 正文保留比喻，不补出“不洁”等解释
  alternative: 译为“人不知不觉因你们沾染污秽”
  rationale: 原文只说明人走过而不知道，并未明说后果；保留这种含蓄可避免把语境解释直接写进正文。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“你们有祸了”传达严厉警告；后半句结构简洁，保留原文比喻及其含蓄张力。
