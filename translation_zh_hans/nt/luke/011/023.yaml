  text: ὁ μὴ ὢν μετ’ ἐμοῦ κατ’ ἐμοῦ ἐστιν, καὶ ὁ μὴ συνάγων μετ’ ἐμοῦ σκορπίζει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/023.yaml
  text: The one who is not with me is against me[a], and the one who does not gather with me scatters.
translation:
  language: zh_hans
  text: 不与我同在的人，就是反对我的[a]；不与我一同聚拢的，就是驱散。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“凡不与我同在的，就是反对我的；凡不与我一同聚拢的，就是驱散。”
    reason: “ὁ μὴ……”既可译成“不……的人”，也可用“凡不……”表达其泛指意味。
lexical_decisions:
- source_word: ὁ μὴ ὢν
  choice: 不……的人
  rationale: 定冠词加现在分词在此作名词使用，泛指具有这种特征的人。译为“不……的人”既保留希腊文的泛指单数意味，也符合现代汉语表达。
- source_word: μετ’ ἐμοῦ
  choice: 与我同在／与我一同
  rationale: μετά加属格表示与某人相伴或联合。第一分句译为“与我同在”，保留关系和立场上的联合；第二分句用“与我一同”，使动作搭配更自然。
- source_word: κατ’ ἐμοῦ
  choice: 反对我
  rationale: κατά加属格在此表示敌对。“反对我”清楚保留了“与我同在”和“反对我”之间鲜明的对立。
- source_word: συνάγων
  choice: 聚拢
  rationale: 该词表示把人或事物聚集到一起。“聚拢”在现代汉语中自然，并与下文“驱散”形成直接对照；原文未明说所聚拢的对象，译文也不补出。
- source_word: σκορπίζει
  choice: 驱散
  rationale: 该词表示使聚集者散开。“驱散”与“聚拢”构成鲜明对照，同时不擅自补明被驱散的对象。
- source_word: καὶ
  choice: ；
  rationale: καί连接两个平行分句。汉语以分号呈现紧密并列关系，比机械加入“并且”更自然，也保留修辞上的平行。
theological_decisions:
- issue: 对耶稣是否存在中立立场
  choice: 保留“不与我同在，就是反对我”的绝对而鲜明的二分表达。
  alternative: 弱化为“不支持我的人并没有帮助我”，或把这句话限定解释为仅针对赶鬼事件。
  rationale: 希腊文的表述本身直接而绝对。译文不削弱其力度，也不加入后来的教义体系或替读者界定其适用范围。
- issue: “聚拢”与“驱散”的对象
  choice: 与原文一样，不明说对象。
  alternative: 明确补成“聚拢人”或“驱散羊群”。
  rationale: 上下文容许比喻性理解，但本句没有明说宾语；不补出对象可保存原文的开放性和神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“同在”保留关系与立场的意味；“聚拢／驱散”形成简明有力的对偶。未补出希腊文省略的宾语，也未把经文限定为某一特定教义解释。
