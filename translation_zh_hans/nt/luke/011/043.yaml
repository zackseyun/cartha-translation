  text: οὐαὶ ὑμῖν τοῖς Φαρισαίοις, ὅτι ἀγαπᾶτε τὴν πρωτοκαθεδρίαν ἐν ταῖς συναγωγαῖς καὶ τοὺς ἀσπασμοὺς ἐν ταῖς ἀγοραῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/043.yaml
  text: Woe to you Pharisees[b][a], because you love the best seats in the synagogues and greetings in the marketplaces.
translation:
  language: zh_hans
  text: 你们有祸了，法利赛人哪！因为你们喜爱会堂里的上座[a]，也喜爱在市集上受人问安[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“首位”或“尊位”。
    reason: lexical_alternative
  - marker: b
    text: 指在公众场合受到带有敬意的问候，从而得到社会上的尊重和认可。
    reason: cultural_note
lexical_decisions:
- source_word: οὐαὶ ὑμῖν
  choice: 你们有祸了
  rationale: 保留先知式警告和谴责的力度；比单纯表达哀叹的“你们真可悲”更贴近原文。
- source_word: τοῖς Φαρισαίοις
  choice: 法利赛人哪
  rationale: 用现代汉语自然的呼语形式保留直接称呼。
- source_word: ὅτι
  choice: 因为
  rationale: 明确引出宣告“有祸”的缘由。
- source_word: ἀγαπᾶτε
  choice: 喜爱
  rationale: 在此表示热衷和偏爱，并不赋予该词特殊的神学含义。
- source_word: τὴν πρωτοκαθεδρίαν
  choice: 首位
  rationale: 指会堂中最尊贵、最显要的座位；“首位”简洁庄重，并保留具体座席与社会地位之间的联系。
- source_word: ἐν ταῖς συναγωγαῖς
  choice: 会堂里
  rationale: “会堂”是 συναγωγή 在犹太宗教语境中的通行译法。
- source_word: τοὺς ἀσπασμοὺς
  choice: 受人问安
  rationale: 原词指问候、致意；此处是法利赛人所喜爱的公众认可。用“受人问安”符合汉语表达，同时不把具体称谓添加进正文。
- source_word: ἐν ταῖς ἀγοραῖς
  choice: 在市集上
  rationale: ἀγορά 指公开的市场或广场；“市集”既保留交易场所含义，也体现公共社交场景。
theological_decisions:
- issue: 耶稣宣告的性质
  choice: 保留为针对法利赛人贪爱公众尊荣的先知式祸患宣告
  alternative: 仅视为对失礼或虚荣行为的社会性批评
  rationale: οὐαί 与随后列出的缘由构成具有道德和属灵分量的谴责；译文不把它弱化为一般礼仪批评，也不添加原文未明说的教义判断。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“法利赛人哪，你们有祸了”保留直接呼告和警告力度；两处“喜爱”所支配的对象在汉语中以“首位”和“受人问安”平行呈现。脚注标记均置于对应词语之后。
