  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἰ οὖν τὸ σῶμά σου ὅλον φωτεινόν, μὴ ἔχον ⸂μέρος τι⸃ σκοτεινόν, ἔσται φωτεινὸν ὅλον ὡς ὅταν ὁ λύχνος τῇ ἀστραπῇ φωτίζῃ σε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/036.yaml
  text: If[a], then, your whole body is full of light, having no dark part, it will be wholly full of light, as when a lamp lights you with its brightness.
translation:
  language: zh_hans
  text: 所以，你若全身光明，没有任何一处黑暗，全身就会全然光明，如同灯的光辉照亮你一样。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “光辉”或译“闪光”；希腊词可指闪光、光辉，也可指闪电。这里主语是灯，较可能指灯发出的亮光，而不是字面的闪电。
    reason: lexical_alternative
lexical_decisions:
- source_word: σῶμά
  choice: 全身
  rationale: σῶμα直译为“身体”；结合ὅλον译作“全身”，保留眼睛、身体与光的具体比喻，不解释为“内心”或“整个人”。
- source_word: ὅλον / φωτεινόν
  choice: 全身光明；完全光明
  rationale: ὅλον在本句两次强调整体性；前处自然译为“全身”，后处用“完全”保留重复的总括力量。φωτεινόν译为“光明”，与“黑暗”形成鲜明对应。
- source_word: μὴ ἔχον μέρος τι σκοτεινόν
  choice: 没有任何一处黑暗
  rationale: 保留μέρος τι所指的局部性，并以现代汉语自然表达否定不定成分，即没有任何部分处于黑暗中。
- source_word: ἔσται φωτεινὸν ὅλον
  choice: 全身就会完全光明
  rationale: 保留ἔσται的将来意义及ὅλον的强调；补出“全身”使汉语主语清楚。
- source_word: ὡς ὅταν
  choice: 如同……一样
  rationale: 自然表达比较兼时间性的结构，不增加因果或解释。
- source_word: λύχνος
  choice: 灯
  rationale: 指具体的灯，不译为抽象的“光”或“灯台”。
- source_word: τῇ ἀστραπῇ
  choice: 用光辉
  rationale: ἀστραπή可指闪光、光辉或闪电；因主语是灯，正文采用“光辉”，既自然又避免理解为字面的闪电。
- source_word: φωτίζῃ σε
  choice: 照亮你
  rationale: 准确保留动词“使有光、照明”及第二人称宾语σε。
theological_decisions:
- issue: “身体”和“光”的比喻意义
  choice: 保留“全身、光明、黑暗”的身体与光的意象
  alternative: 解释为人的内心、灵魂或道德属灵状态
  rationale: 本节承接眼睛是身体之灯的语境；直保比喻可让经文本身维持其神学张力，而不把某一解释写入正文。
- issue: 条件句与结果句之间近似重复的表达
  choice: 保留“全身光明”与“全身就会完全光明”的递进重复
  alternative: 为避免表面重复而改写成解释性的因果句
  rationale: 希腊文有意重复ὅλον和φωτεινόν；保留这种表述，不替作者消解条件与结果之间的修辞张力。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“全身光明”“一处黑暗”保留原文具体意象；句式尽量贴近希腊文，同时以“就会”和“如同……一样”保持汉语流畅。
