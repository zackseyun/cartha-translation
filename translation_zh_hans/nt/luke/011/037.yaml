base_translation:
  language: en
  yaml_path: translation/nt/luke/011/037.yaml
  text: While he was speaking[a], a Pharisee asks him to dine with him[b]; so he went in and reclined at the table.
translation:
  language: zh_hans
  text: 耶稣还在说话的时候，一个法利赛人请他同自己一起用饭[a]。耶稣便进去，斜倚在席间[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“吃早饭”或“吃较早的一餐”；希腊语动词可指一天中较早的一餐，但这里可泛指用饭。
    reason: lexical_alternative
  - marker: b
    text: 当时正式用餐通常采取斜倚的姿势。
    reason: cultural_note
lexical_decisions:
- source_word: Ἐν δὲ τῷ λαλῆσαι
  choice: 耶稣还在说话的时候
  rationale: ἐν加带冠词不定式表示同时发生的动作；“还在说话的时候”自然保留持续意味。根据上下文明确主语为耶稣，避免汉语代词指向含混。
- source_word: ἐρωτᾷ
  choice: 请
  rationale: 此处动词基本义为“请求”，后接用餐目的从句，在汉语中译作“请……吃饭”既自然，也不额外强化为正式邀请。叙事历史现在时不宜机械移植到汉语。
- source_word: Φαρισαῖος
  choice: 一个法利赛人
  rationale: 采用现代中文圣经语境中通行的群体名称，并以“一个”表达无冠词单数。
- source_word: ὅπως ἀριστήσῃ
  choice: 吃饭
  rationale: ἀριστάω可指早饭或较早时段的一餐；上下文并未要求精确限定用餐时间，因此正文采用宽泛自然的“吃饭”，另以脚注保留词义范围。
- source_word: παρ’ αὐτῷ
  choice: 到自己那里
  rationale: 原文意为“在他那里／同他一起”，并未明说是住宅；“到自己那里”保留地点与作东者的关系，又不擅自增添“家中”。
- source_word: εἰσελθὼν
  choice: 便进去
  rationale: 不定过去时分词表示先于主要动作的进入；“便进去”简洁呈现动作顺序。
- source_word: ἀνέπεσεν
  choice: 斜倚席间
  rationale: 该词在古代正式用餐场景中指斜倚就席，而非现代意义上的坐下；此译既保留历史姿势，也能让现代读者理解是在入席。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准汉语。为避免连续代词造成误指，两处明确写“耶稣”；正文不把παρ’ αὐτῷ具体化为“在他家”。脚注标记分别紧随其实际解释的“吃饭”和“斜倚席间”。
