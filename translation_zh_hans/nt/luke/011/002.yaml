id: LUK.11.2
reference: Luke 11:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτοῖς· Ὅταν προσεύχησθε, λέγετε· ⸀Πάτερ, ἁγιασθήτω τὸ ὄνομά σου· ἐλθέτω ἡ βασιλεία ⸀σου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/002.yaml
  text: 'And he said to them[a], “When you pray, say: ‘Father, hallowed be your name[b]. Your kingdom come.’”'
translation:
  language: zh_hans
  text: 他对他们说：“你们祷告的时候，要说：‘父啊[a]，愿你的名被尊为圣[b]；愿你的国降临。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本受马太福音6:9平行经文影响，在“父”前加上“我们的”，另有抄本进一步加上“在天上的”；这里所据希腊文本只有“父”。
    reason: alternative_reading
  - marker: b
    text: 也可译作“愿人都尊你的名为圣”。原文是被动表达，没有明说由谁来尊为圣。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν προσεύχησθε
  choice: 你们祷告的时候
  rationale: Ὅταν加虚拟语气表示一般性的时间情形；这样译成现代汉语自然，也保留反复或惯常祷告的含义。
- source_word: λέγετε
  choice: 要说
  rationale: 现在时命令语气在这里发出祷告的指示；“要说”简洁自然，不必硬译出持续体。
- source_word: Πάτερ
  choice: 父啊
  rationale: 原文是单数呼格“父”，没有“我们”或“在天上的”；“啊”自然表达汉语呼语。
- source_word: ἁγιασθήτω
  choice: 愿……被尊为圣
  rationale: 不定过去时被动命令语气表达祈愿。“被尊为圣”既保留被动形式和未明说的施事者，也不暗示神的名本来不圣洁。
- source_word: τὸ ὄνομά σου
  choice: 你的名
  rationale: 直译保留圣经中“名”所涵盖的身份、声誉与尊荣，不在正文中展开解释。
- source_word: ἐλθέτω
  choice: 愿……降临
  rationale: 不定过去时命令语气在祷告中表达恳求；“愿……降临”是自然庄重的现代汉语。
- source_word: ἡ βασιλεία σου
  choice: 你的国
  rationale: βασιλεία可指王权、统治或国度；“你的国”简明并保留福音书语境中的传统广度。
theological_decisions:
- issue: 对神的称呼是否加入“我们”
  choice: 父啊
  alternative: 我们的父啊；我们在天上的父啊
  rationale: 所给SBLGNT正文只有Πάτερ。译文不与马太福音6:9或后来的礼仪传统协调。
- issue: ἁγιασθήτω τὸ ὄνομά σου的被动和施事者
  choice: 愿你的名被尊为圣
  alternative: 愿人都尊你的名为圣
  rationale: 原文使用被动语态，没有明说谁尊神的名为圣。正文保留这种开放性，避免擅自把施事者限定为“人”。
- issue: βασιλεία的语义范围
  choice: 你的国
  alternative: 你的统治；你的王权；你的国度
  rationale: “国”可承载神掌权及其末世实现的双重意涵，避免只选“统治”而缩窄原文的张力。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“父啊”保留简短直接的呼告；两个“愿……”形成适合祷告的平行句式。正文保留ἁγιασθήτω的被动和施事者不明的特点。
