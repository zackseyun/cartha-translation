  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ κύριος πρὸς αὐτόν· Νῦν ὑμεῖς οἱ Φαρισαῖοι τὸ ἔξωθεν τοῦ ποτηρίου καὶ τοῦ πίνακος καθαρίζετε, τὸ δὲ ἔσωθεν ὑμῶν γέμει ἁρπαγῆς καὶ πονηρίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/039.yaml
  text: But the Lord said to him[a], “Now you Pharisees clean the outside of the cup and the dish, but your inside is full of greed and wickedness.”
translation:
  language: zh_hans
  text: 主对他说：“如今，你们法利赛人洗净杯盘的外面，你们里面却充满了掠夺[a]和邪恶。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译作“抢夺”、“勒索”或“贪婪”。
    reason: 保留ἁρπαγή从具体的强取、劫掠到贪婪攫取的词义范围。
lexical_decisions:
- source_word: κύριος
  choice: 主
  rationale: 按新约叙事中对耶稣的常用称号译为“主”，而不弱化为一般礼貌称呼。
- source_word: Νῦν
  choice: 如今
  rationale: 保留引出尖锐责备的话语标记；“如今”在现代中文中自然，也带有“你们目前的做法是”的语气。
- source_word: ὑμεῖς οἱ Φαρισαῖοι
  choice: 你们法利赛人
  rationale: 保留代词与名词并用所形成的强调，中文表达直接自然。
- source_word: τὸ ἔξωθεν τοῦ ποτηρίου καὶ τοῦ πίνακος
  choice: 杯盘的外面
  rationale: “杯盘”简洁涵盖杯和食盘；“外面”准确保留器皿外部的具体意象。
- source_word: καθαρίζετε
  choice: 洗净
  rationale: 表达对杯盘进行清洁的持续或惯常行为，比单用“洁净”更符合现代中文的具体动作。
- source_word: τὸ δὲ ἔσωθεν ὑμῶν
  choice: 里面
  rationale: 保留从器皿外面转向人内里的隐喻，不具体解释为“心”或“内心”；中文可由上下文自然理解为“你们里面”。
- source_word: γέμει
  choice: 满是
  rationale: 自然对应“充满”，并适合接续两个负面的抽象名词。
- source_word: ἁρπαγῆς
  choice: 掠夺
  rationale: 该词可指抢夺、劫掠以及贪婪的攫取。“掠夺”保留行为性和剥削性，避免只译成内在欲望而缩窄词义。
- source_word: πονηρίας
  choice: 邪恶
  rationale: 保留宽泛而强烈的道德谴责，不限定为较窄的“恶意”。
theological_decisions:
- issue: “里面”的所指
  choice: 保留“里面”的空间隐喻
  alternative: 译作“内心”或“内在生命”
  rationale: 原文刻意以外面与里面相对，并从器皿转向法利赛人自身；不补明某一心理或属灵官能，可保存原文的张力。
- issue: ἁρπαγή的道德含义
  choice: 正文译为“掠夺”，脚注列出相关可能含义
  alternative: 贪婪
  rationale: “掠夺”更直接保留该词所含的攫取、抢夺和剥削色彩；脚注说明其词义也可延伸到贪婪或勒索，避免把语义范围固定得过窄。
translation_notes:
  register: 采用现代、庄重而直白的叙事语言。“杯盘”符合中文惯用搭配；“里面却满是”保留外在清洁与内在败坏的鲜明对照。
