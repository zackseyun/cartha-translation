id: LUK.11.20
reference: Luke 11:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἰ δὲ ἐν δακτύλῳ ⸀θεοῦ ἐκβάλλω τὰ δαιμόνια, ἄρα ἔφθασεν ἐφ’ ὑμᾶς ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/020.yaml
  text: But if I cast out the demons by the finger of God[b][a], then the kingdom of God has come upon you.
translation:
  language: zh_hans
  text: 但我若靠着神的指头[a]赶出鬼来，神的国就已经临到你们了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“用神的指头”。这个说法表达神亲自施展能力，并与《出埃及记》8:19相呼应。
    reason: lexical_alternative
  - marker: b
    text: “临到”也可译作“来到”或“追上”。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν δακτύλῳ θεοῦ
  choice: 靠着神的指头
  rationale: 保留“神的指头”这一鲜明意象及其与《出埃及记》8:19的呼应；“靠着”自然表达ἐν在此处所含的凭借、施力或施行方式。
- source_word: ἐκβάλλω
  choice: 赶出
  rationale: 这是现代汉语中自然、明确的驱逐用语，也符合福音书中赶鬼的语境。
- source_word: τὰ δαιμόνια
  choice: 鬼
  rationale: 直接对应δαιμόνια；“鬼”在现代汉语圣经语境中简明易懂，不改译为原文并未使用的“污灵”。
- source_word: ἄρα
  choice: 就
  rationale: 在“若……就……”结构中自然表达由条件所得出的结论。
- source_word: ἔφθασεν ἐφ’ ὑμᾶς
  choice: 已经临到你们了
  rationale: “已经……了”体现动词所表达的决定性到达，“临到你们”保留ἐπί所含朝向并及于听众的意味。
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: 神的国
  rationale: 这是准确而自然的固定表达，既可指神掌权，也保留“国”的具体意象，而不在正文中将其缩减为单一解释。
theological_decisions:
- issue: “神的指头”的含义
  choice: 保留为“神的指头”，让它表达神直接施行的能力或作为
  alternative: 依据《马太福音》12:28直接解释为“神的灵”
  rationale: 路加的原文使用“神的指头”，翻译应保留其自身措辞、意象和经文呼应，不以平行经文替换正文。
- issue: “神的国已经临到你们”的时态与力度
  choice: 表达神的国在耶稣赶鬼的事工中已经决定性地临到听众
  alternative: 只指将来的国度，或纯粹作带有敌意的“追上你们”理解
  rationale: ἔφθασεν在本语境中表达已经到达；译文保留神国当下临到的宣告，同时不额外规定完整的末世论体系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“但我若……就……”保留原句的对比和推论关系；“神的指头”不作释义性改写，“已经临到你们了”则以自然汉语传达其完成与到达的力度。
