source:
  edition: SBLGNT
  text: Ἀλλὰ οὐαὶ ὑμῖν τοῖς Φαρισαίοις, ὅτι ἀποδεκατοῦτε τὸ ἡδύοσμον καὶ τὸ πήγανον καὶ πᾶν λάχανον, καὶ παρέρχεσθε τὴν κρίσιν καὶ τὴν ἀγάπην τοῦ θεοῦ· ταῦτα ⸀δὲ ἔδει ποιῆσαι κἀκεῖνα μὴ ⸀παρεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/042.yaml
  text: But woe to you Pharisees, because you tithe mint and rue and every herb, and you pass by justice and the love of God. These things you ought to have done, without neglecting those things.
translation:
  language: zh_hans
  text: 但你们法利赛人有祸了！因为你们把薄荷、芸香和各样蔬菜献上十分之一，却忽略了公义和上帝的爱[a]。这些本是你们应当行的，那些也不可忽略。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “上帝的爱”也可译为“对上帝的爱”。
    reason: 希腊文属格关系可以有不同理解；脚注保留此处的语法与语义歧义，而不在正文中预先裁定。
lexical_decisions:
- source_word: οὐαὶ ὑμῖν
  choice: 你们有祸了
  rationale: 保留先知式警告与审判语气，比单纯译作“可怜”更符合原文。
- source_word: ἀποδεκατοῦτε
  choice: 献上十分之一
  rationale: 清楚表达什一奉献的动作，适合现代普通读者。
- source_word: τὸ ἡδύοσμον καὶ τὸ πήγανον καὶ πᾶν λάχανον
  choice: 薄荷、芸香和各样蔬菜
  rationale: 按原文列举翻译；λάχανον泛指园中可食用或栽种的菜蔬、草本植物，此处译“蔬菜”自然且具体。
- source_word: παρέρχεσθε
  choice: 忽略了
  rationale: 该词在此指越过、不顾或置之不理；“忽略”自然传达对更重要责任的疏忽，同时不额外强化为主动拒绝。
- source_word: τὴν κρίσιν
  choice: 公义
  rationale: 在伦理和审判语境中指公平、公正的要求；“公义”兼具法律与道德含义。
- source_word: τὴν ἀγάπην τοῦ θεοῦ
  choice: 对上帝的爱
  rationale: 属格在语法上可有不同理解；正文采用最符合并列伦理责任语境的客体属格理解，同时在神学决策中保留其可能歧义。
- source_word: ταῦτα…κἀκεῖνα
  choice: 这些……那些
  rationale: 依照原文指示代词的对照，前者自然回指公义与对上帝的爱，后者回指什一奉献。
- source_word: μὴ παρεῖναι
  choice: 不可忽略
  rationale: 表达不应放过、遗漏那些责任；与前半句形成自然呼应。
theological_decisions:
- issue: “上帝的爱”（ἀγάπην τοῦ θεοῦ）的属格关系
  choice: 对上帝的爱
  alternative: 上帝的爱／从上帝而来的爱
  rationale: 与“公义”并列，作为法利赛人本应实行却忽略的责任，客体属格较顺；但希腊文形式本身可以容纳主体或来源意味，因此不据此建立排他的神学结论。
- issue: 耶稣是否否定什一奉献
  choice: 译作“那些也不可忽略”，保留对两类责任的肯定
  alternative: 只强调公义与爱而弱化什一奉献
  rationale: 原文明确说前者应当实行，后者也不应遗漏；译文保留两者之间的张力和优先次序，不把经文改写成对礼仪实践的全面否定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“有祸了”保留强烈警告语气；“芸香”虽非日常常见植物名，却是准确且通行的名称。句式尽量贴近原文的责备、原因和总结三层结构。
