source:
  edition: SBLGNT
  text: ἄρα ⸂μάρτυρές ἐστε⸃ καὶ συνευδοκεῖτε τοῖς ἔργοις τῶν πατέρων ὑμῶν, ὅτι αὐτοὶ μὲν ἀπέκτειναν αὐτοὺς ὑμεῖς δὲ ⸀οἰκοδομεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/048.yaml
  text: So you are witnesses and approve of the deeds of your fathers[a], because they killed them, but you build their tombs.
translation:
  language: zh_hans
  text: 这样，你们就是见证人，也赞同你们祖先的所作所为：他们杀害了先知，你们却为先知修建坟墓。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本节直译为“你们却修建”；所修建的是先知的坟墓，承接上一节。
    reason: 说明由紧邻语境补出的省略宾语。
lexical_decisions:
- source_word: ἄρα
  choice: 这样
  rationale: 承接上一节并引出推论，既保留推论语气，也符合现代汉语表达。
- source_word: μάρτυρές ἐστε
  choice: 你们就是见证人
  rationale: 保留谓语名词结构及其修辞力度；他们的行动使自己成为见证人。
- source_word: συνευδοκεῖτε
  choice: 赞同
  rationale: 表达对祖先行为的认可和认同，比单纯的“同意”更能体现这里的道德意味。
- source_word: τοῖς ἔργοις τῶν πατέρων ὑμῶν
  choice: 你们祖先的所作所为
  rationale: “祖先”自然表达前代之人；“所作所为”指具体行为，并保留本段的责备语气。
- source_word: ὅτι
  choice: ：
  rationale: 希腊文在此说明前述判断的依据；汉语用冒号自然引出具体解释，逻辑关系清楚。
- source_word: αὐτοὶ μὲν ἀπέκτειναν αὐτούς
  choice: 他们杀害了先知
  rationale: 前一个“他们”指祖先，宾语指上一节提到的先知。汉语若连续使用两个“他们”容易指代不清，因此按紧邻语境明示“先知”。
- source_word: ὑμεῖς δὲ οἰκοδομεῖτε
  choice: 你们却为先知修建坟墓
  rationale: “却”保留 μέν…δέ 的对照；οἰκοδομεῖτε 本节未明说宾语，但上一节已明确提到先知的坟墓，汉语中补出这一宾语可使句意完整自然。
theological_decisions:
- issue: 是否在正文中补出 οἰκοδομεῖτε 的省略宾语
  choice: 根据上一节补作“为先知修建坟墓”
  alternative: 保留省略，仅译作“你们却修建”
  rationale: 希腊文本节只出现“修建”，其宾语由11:47的“先知的坟墓”承接而来。现代汉语通常需要补出宾语才能清楚自然；脚注同时说明原文的省略，避免把补语误认为本节明写的词。
- issue: 杀害者与修墓者之间关系的修辞张力
  choice: 以“他们……你们却……”保留两代人的对照，同时用“赞同”表明耶稣所指的连续性
  alternative: 把修墓解释为明确的敬仰行为或明确的共谋行为
  rationale: 经文本身将两种行动并列，并据此指控当代人赞同祖先；译文不额外解释修墓行为的心理动机，以保留原有张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“就是见证人”保留原文的指控力度；“所作所为”比“工作”更适合带有道德评价的语境。为避免代词歧义，按上一节明确的先行词两次译出“先知”。
