  text: Κἀγὼ ὑμῖν λέγω, αἰτεῖτε, καὶ δοθήσεται ὑμῖν· ζητεῖτε, καὶ εὑρήσετε· κρούετε, καὶ ἀνοιγήσεται ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/009.yaml
  text: And I tell you[a], ask, and it will be given to you; seek, and you will find; knock, and it will be opened to you.
translation:
  language: zh_hans
  text: 我告诉你们[a]：你们祈求，就会得到；寻找，就会找到；叩门，就会给你们开门。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊语的现在时命令式也可更明确地译为：“要不断祈求……不断寻找……不断叩门。”
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀγὼ ὑμῖν λέγω
  choice: 我告诉你们
  rationale: Κἀγώ承接上文并略带强调；现代汉语中“我告诉你们”自然、庄重，已能体现说话者的强调，不必生硬加上“而我”或“我也”。
- source_word: αἰτεῖτε
  choice: 祈求
  rationale: 在本段关于向天父祷告的语境中，“祈求”比泛指请求的“求”更清楚，同时保留所求内容未明说的特点。
- source_word: δοθήσεται ὑμῖν
  choice: 就会给你们
  rationale: 保留未来被动式所表达的应许，但按自然汉语采用不明说施事者的主动式表达；不擅自补出“上帝”。
- source_word: ζητεῖτε
  choice: 寻找
  rationale: “寻找”既可用于具体寻找，也保留语境中的比喻性广度，与“找到”形成自然对应。
- source_word: εὑρήσετε
  choice: 就会找到
  rationale: 直接表达未来应许，并与前后分句保持平行。
- source_word: κρούετε
  choice: 叩门
  rationale: 原文虽只说“敲”，但宾语由开门意象隐含；现代汉语“叩门”简洁庄重，并使该意象自然成立。
- source_word: ἀνοιγήσεται ὑμῖν
  choice: 就会给你们开门
  rationale: 希腊文没有明说所开的对象，但由“叩门”可知是门；汉语若直译“就会向你们打开”不够自然，因此补出语义上隐含的“门”，仍不明说开门者。
theological_decisions:
- issue: 三个现在时命令式的体貌含义
  choice: 正文采用简单命令“祈求、寻找、叩门”
  alternative: 不断祈求、不断寻找、不断叩门
  rationale: 现在时命令式可以体现持续或反复行动，但不必在每处都明确译成“不断”。正文保留较宽的解释空间，脚注提示可能的持续含义。
- issue: 未来被动式中未明说的施事者
  choice: 不补出“上帝”，译作“会给你们／会给你们开门”
  alternative: 上帝就会赐给你们／为你们开门
  rationale: 语境指向天父，但原句以被动式含蓄表达。译文不明说施事者，可保留原文的措辞与神学含蓄性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。三个命令与三个应许保持整齐的平行结构；用“就会”自然表达命令之后的应许关系。
