  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἰ δὲ καὶ ὁ Σατανᾶς ἐφ’ ἑαυτὸν διεμερίσθη, πῶς σταθήσεται ἡ βασιλεία αὐτοῦ; ὅτι λέγετε ἐν Βεελζεβοὺλ ἐκβάλλειν με τὰ δαιμόνια.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/018.yaml
  text: But if Satan also is divided against himself[a], how will his kingdom stand? For you say that I cast out the demons by Beelzebul.
translation:
  language: zh_hans
  text: 但如果撒但也自相分裂，他的国怎能站立得住呢？因为你们说我靠别西卜[a]赶出鬼。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作“别西卜”（Beelzebul）；部分英文传统作 Beelzebub。
    reason: 说明希腊文本所用名称形式及英文传统中的另一种拼写形式，避免以不通行的中文音译人为区分二者。
lexical_decisions:
- source_word: Σατανᾶς
  choice: 撒但
  rationale: 采用现代中文圣经语境中通行的音译，作为专名处理。
- source_word: ἐφ’ ἑαυτὸν διεμερίσθη
  choice: 自相分裂
  rationale: 准确表达反身结构所指的内部对立，也符合自然、凝练的现代汉语。
- source_word: πῶς σταθήσεται
  choice: 怎能站立得住
  rationale: 保留“站立”的比喻，同时以“得住”表达持续存在、维持不倒的语义和反问力量。
- source_word: ἡ βασιλεία αὐτοῦ
  choice: 他的国
  rationale: “国”既承接 βασιλεία 的统治领域含义，也使分裂之国无法站立的比喻在中文中清楚自然。
- source_word: ὅτι
  choice: 因为
  rationale: 这里引出耶稣作此推论的根据，即听众所提出的指控。
- source_word: ἐν Βεελζεβοὺλ
  choice: 靠别西卜
  rationale: ἐν 在此表示凭借或施事手段；“靠”自然表达其工具性，又不额外加入“能力”等解释。
- source_word: ἐκβάλλειν
  choice: 赶出
  rationale: 这是现代中文在驱逐鬼魔语境中的自然表达，准确传达强制逐出的动作。
- source_word: τὰ δαιμόνια
  choice: 鬼魔
  rationale: 直接指超自然的邪灵性存在，避免将其泛化为仅具描述性的“邪灵”。
- source_word: Βεελζεβοὺλ
  choice: 别西卜
  rationale: 按希腊文 Βεελζεβούλ 所反映的 Beelzebul 形式音译，并以脚注说明另一种传统形式。
theological_decisions:
- issue: 耶稣的反对者所提出指控的性质
  choice: 译为耶稣“靠别西卜”赶出鬼魔
  alternative: 与别西卜联合赶鬼；靠别西卜的能力赶鬼
  rationale: 原文以 ἐν 表达凭借或施事关系，但未进一步说明这种关系的具体性质；译文保留指控本身，不添加关于能力来源或联合方式的神学解释。
- issue: 撒但之国无法站立的条件句
  choice: 保留“如果”及反问形式
  alternative: 断言撒但的国已经分裂并必然倾覆
  rationale: 原文提出假设并据此反驳指控，而不是直接宣告撒但之国在事实上已经自相分裂。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“自相分裂”“站立得住”保留原文比喻及论证力度；“靠”简洁传达 ἐν 的工具或施事意义。脚注标记置于专名之后，使说明对象明确。
