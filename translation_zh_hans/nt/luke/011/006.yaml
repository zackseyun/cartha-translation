  yaml_path: translation/nt/luke/011/006.yaml
  text: because a friend of mine has come to me from a journey[a], and I have nothing to set before him.
translation:
  language: zh_hans
  text: 因为我的一个朋友从路上[a]来到我这里，我没有什么可以摆在他面前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“从旅途而来”；直译“从路上”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπειδὴ
  choice: 因为
  rationale: 引出请求的原因；“因为”在现代汉语中自然、明确。
- source_word: φίλος μου
  choice: 我有一个朋友
  rationale: 既表达所属关系，也保留无冠词名词在此处的不定意味；比单说“我的朋友”更贴合语境。
- source_word: παρεγένετο
  choice: 来到
  rationale: 表达朋友已经抵达、现正在场；汉语无需用特定时态形式另行标示其当前结果。
- source_word: ἐξ ὁδοῦ
  choice: 在旅途中
  rationale: 该短语字面与“路”有关，在语境中指从行旅而来；“在旅途中”是自然且不过度解释的表达。
- source_word: πρός με
  choice: 我这里
  rationale: 自然表达朝向说话者并到达其所在之处，不增添原文未明说的“家”或“拜访”。
- source_word: οὐκ ἔχω
  choice: 我没有什么
  rationale: 直接表达否定拥有，并与后面的关系从句自然衔接。
- source_word: ὃ παραθήσω αὐτῷ
  choice: 可以摆在他面前
  rationale: 保留 παρατίθημι 在款待、用餐语境中把食物摆到客人面前的具体意象，不直接改释为“招待”或“给他吃”。
