id: LUK.11.33
reference: Luke 11:33
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ⸀Οὐδεὶς λύχνον ἅψας εἰς κρύπτην τίθησιν οὐδὲ ὑπὸ τὸν μόδιον ἀλλ’ ἐπὶ τὴν λυχνίαν, ἵνα οἱ εἰσπορευόμενοι τὸ ⸀φέγγος βλέπωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/033.yaml
  text: No one[a], after lighting a lamp, puts it in a hidden place or under a basket, but on a lampstand[b], so that those who enter may see the light.
translation:
  language: zh_hans
  text: 没有人点上灯以后，把灯放在隐蔽的地方[a]，或放在量斗底下[b]，而是放在灯台上，好让进来的人看见亮光。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “隐蔽的地方”或译“地窖”或“隐秘处”；希腊词κρύπτη可指隐蔽处，包括地下储藏空间。
    reason: lexical_alternative
  - marker: b
    text: “量斗”所对应的希腊词μόδιος既指一种干量，也指盛量用的容器；传统译法有“斗”或“蒲式耳斗”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐδεὶς
  choice: 没有人
  rationale: 自然表达全称否定，符合现代汉语习惯。
- source_word: λύχνον
  choice: 灯
  rationale: 指可携带的油灯；译作“灯”准确自然，也避免误解为蜡烛。
- source_word: ἅψας
  choice: 点上灯以后
  rationale: 不定过去时分词表示先于主句动作发生，明确保留先后次序。
- source_word: εἰς κρύπτην
  choice: 在隐蔽的地方
  rationale: κρύπτη可指隐蔽处，也可指地窖等地下储藏空间；正文采用较宽泛的表达，以突出把光隐藏起来的反常做法。
- source_word: τίθησιν
  choice: 放
  rationale: 简洁、自然地表达置放动作。
- source_word: ὑπὸ τὸν μόδιον
  choice: 在量斗底下
  rationale: μόδιος本是干量单位，也指相应的量器。“量斗”既保留量器属性，也能清楚呈现用器皿遮住灯的画面。
- source_word: ἐπὶ τὴν λυχνίαν
  choice: 在灯台上
  rationale: λυχνία专指安放灯的台架，“灯台”准确而简洁。
- source_word: ἵνα
  choice: 好让
  rationale: 自然表达目的关系。
- source_word: οἱ εἰσπορευόμενοι
  choice: 进来的人
  rationale: 准确表达名词化的现在时分词，指进入其中的人。
- source_word: τὸ φέγγος
  choice: 亮光
  rationale: φέγγος可指光、光亮；“亮光”在灯的语境中自然，并保留其明亮可见的意味。
- source_word: βλέπωσιν
  choice: 看见
  rationale: 与“好让”连用，清楚表达ἵνα加虚拟语气所表示的目的。
theological_decisions:
- issue: κρύπτη所指的具体地点
  choice: 正文译作较宽泛的“隐蔽的地方”
  alternative: 地窖；储藏室；暗处
  rationale: 原词容许具体的地下储藏处，也可泛指隐蔽处。经文重点是灯不该被藏起来，因此不在正文中过度限定建筑空间，并用脚注保留具体可能。
- issue: μόδιος的量器含义
  choice: 正文译作“量斗”
  alternative: 量器；篮子；蒲式耳斗
  rationale: 该词首先是干量单位，并转指相应容器。“量斗”比泛称“篮子”更贴近原词，又比音译或套用现代西方容量单位更易懂。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。正文保留灯、量斗和灯台的具体生活图景；脚注标记紧跟各自所解释的词语，避免错置。
