  text: καὶ ἐλθὸν ⸀εὑρίσκει σεσαρωμένον καὶ κεκοσμημένον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/025.yaml
  text: And when it comes[a], it finds it swept and put in order.
translation:
  language: zh_hans
  text: 它来到后，发现那屋子已打扫好，并布置整齐。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “布置整齐”或译“装饰好了”。
    reason: κοσμέω可指整理、安排，也可侧重装饰；此处房屋语境容许两种语义色彩。
lexical_decisions:
- source_word: ἐλθὸν
  choice: 它来到后
  rationale: 不定过去时分词表示先于主句动作发生的情形；结合上一节，是污灵回来后看见屋内状况。用“来到后”自然表达时间关系。
- source_word: εὑρίσκει
  choice: 见
  rationale: 现在时直陈语气具有生动的叙事效果；现代汉语以“见”简洁自然地承接后面的宾语及状态。
- source_word: σεσαρωμένον
  choice: 已经打扫干净
  rationale: 完成时被动分词强调打扫后持续存在的状态。“打扫干净”符合房屋语境，也自然表达结果状态。
- source_word: κεκοσμημένον
  choice: 布置整齐
  rationale: 完成时被动分词 κοσμέω 可指整理、布置，也可指装饰。房屋语境下“布置整齐”兼顾安排有序与布置妥当的含义，而不局限于装饰。
theological_decisions:
- issue: 省略宾语所指
  choice: 明示为“那屋子”
  alternative: 保留代词“它”或省略宾语
  rationale: 希腊文宾语隐含，但上下文明确指前一节所说的“我的屋子”。汉语若连续使用“它”会使污灵与屋子的指代混淆，因此明示“那屋子”，只作语法澄清，不增加神学解释。
- issue: 污灵的代词
  choice: 它
  alternative: 他
  rationale: 原文 πνεῦμα 为中性名词；现代汉语通常用“它”指非人的灵体，可避免无根据地赋予性别，同时保持上下文清楚。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“已经……，……”体现两个完成时分词所描述的既成状态；脚注标记置于正文句末。
