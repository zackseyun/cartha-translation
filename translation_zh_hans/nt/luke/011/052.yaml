id: LUK.11.52
reference: Luke 11:52
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οὐαὶ ὑμῖν τοῖς νομικοῖς, ὅτι ἤρατε τὴν κλεῖδα τῆς γνώσεως· αὐτοὶ οὐκ εἰσήλθατε καὶ τοὺς εἰσερχομένους ἐκωλύσατε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/052.yaml
  text: Woe to you lawyers[a], because you took away the key of knowledge; you yourselves did not enter[b], and you hindered those who were entering.
translation:
  language: zh_hans
  text: 你们这些律法专家有祸了！因为你们拿走了知识的钥匙；你们自己没有进去，还拦阻了那些正在进去的人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐαί
  choice: 有祸了
  rationale: 保留先知式警告和谴责的力度；比单纯表示悲叹的“可叹”更符合此处语气。
- source_word: νομικοῖς
  choice: 律法专家
  rationale: 指熟悉并讲解犹太律法的人，而非现代民事律师；“律法专家”在现代汉语中清楚、自然。
- source_word: ἤρατε
  choice: 拿走了
  rationale: 此处 αἴρω 表示移走、夺去，配合钥匙和进入的意象，也表达使别人失去通道。
- source_word: κλεῖδα τῆς γνώσεως
  choice: 知识的钥匙
  rationale: 贴近希腊语属格结构，并保留“钥匙”所表达的进入和获取知识的比喻。
- source_word: αὐτοὶ
  choice: 你们自己
  rationale: 体现代词的强调作用，突出他们既妨碍别人，自己也没有进去。
- source_word: οὐκ εἰσήλθατε
  choice: 没有进去
  rationale: 保留原文未说明进入何处的开放性，不擅自补入“神的国”或“真知识”。
- source_word: τοὺς εἰσερχομένους
  choice: 那些正在进去的人
  rationale: 用进行性表达对应现在分词，避免增添“试图进去”等原文未明说的含义。
- source_word: ἐκωλύσατε
  choice: 拦阻了
  rationale: 表达阻碍、挡住之意，但不必断言其阻碍最终完全成功，符合 κωλύω 的语义范围。
theological_decisions:
- issue: “知识的钥匙”和“进去”所指的对象
  choice: 保留钥匙和进入的比喻，不在正文中明确补出进入的对象。
  alternative: 解释为进入神的国，或进入对神的真知识。
  rationale: 希腊原文没有明说进入何处；维持其含蓄性，可避免把一种特定神学解释直接写入译文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“律法专家”避免“律师”在当代汉语中容易引起的职业误解；句式保留原文鲜明的谴责、对比和进入意象。
