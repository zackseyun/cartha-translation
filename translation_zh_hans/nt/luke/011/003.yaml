  yaml_path: translation/nt/luke/011/003.yaml
  text: Give us each day our daily bread[a].
translation:
  language: zh_hans
  text: 求你每天赐给我们日用的饼[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “日用的饼”也可译作“来日所需的饼”或“维持生存所需的饼”；较不可能的理解是“超乎本质的饼”。原文这个形容词极为罕见，含义有争议。
    reason: 保留ἐπιούσιον的主要词义选项及其真实歧义。
lexical_decisions:
- source_word: ἄρτον
  choice: 饼
  rationale: 该词本义为饼，在祷告中也可具体代表维持生活的基本食物；译作“饼”既保留原文意象，也避免在正文中过度释义为“食物”。
- source_word: ἡμῶν
  choice: 我们……所需的
  rationale: 原文是修饰“饼”的第一人称复数所有格；汉语借助“我们……所需的”自然表达其与所求之物的关系，同时与ἐπιούσιον的主要理解相衔接。
- source_word: ἐπιούσιον
  choice: 每天所需的
  rationale: 这是一个极罕见且含义有争议的形容词，可能指每日所需、来日所需或维持生存所需。路加随后使用τὸ καθ’ ἡμέραν，强调逐日供应；“每天所需的”在现代汉语中自然，并适度保留“每日”与“所需”两方面的可能含义。其他理解列入脚注。
- source_word: δίδου
  choice: 赐给
  rationale: 现在时命令式可含持续、反复之意；“赐给”符合向上帝祷告的庄重语域，而持续性由“天天”体现。
- source_word: ἡμῖν
  choice: 给我们
  rationale: 直接表达命令式动词的间接宾语。
- source_word: τὸ καθ’ ἡμέραν
  choice: 天天
  rationale: 该短语明确表示逐日、每天反复发生；译作“天天”简洁自然，并体现持续倚赖供应的语气。
theological_decisions:
- issue: 主祷文中ἐπιούσιον的含义
  choice: 每天所需的
  alternative: 可理解为“为来日预备的”“生存所需的”，或较不可能地理解为“超乎本质的”
  rationale: 该形容词的词义历来有争议。路加所加的τὸ καθ’ ἡμέραν倾向于日常、逐日供应的理解，但证据不足以完全排除其他解释，因此正文采用自然且不过度限定的译法，并在脚注中保留真实的词义歧义。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“求你”补出汉语祈求语气；“赐给”适合向上帝祷告。“天天”对应路加强调的逐日供应。正文脚注标记[a]与脚注一致。
