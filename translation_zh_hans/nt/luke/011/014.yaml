source:
  edition: SBLGNT
  text: Καὶ ἦν ἐκβάλλων ⸀δαιμόνιον κωφόν· ἐγένετο δὲ τοῦ δαιμονίου ἐξελθόντος ἐλάλησεν ὁ κωφός. καὶ ἐθαύμασαν οἱ ὄχλοι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/014.yaml
  text: And he was casting out a mute demon. Then[a], when the demon had gone out, the mute man spoke, and the crowds marveled.
translation:
  language: zh_hans
  text: 耶稣正在赶出一个使人不能说话的鬼。鬼出去了，那不能说话的人就开口说话，众人都很惊讶。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不能说话”所译的希腊词也可指“耳聋”；这里因那人在鬼出去后说话，所以正文译作“不能说话”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν ἐκβάλλων
  choice: 正在赶出
  rationale: ἦν加现在分词构成迂回未完成时，表示过去正在进行的动作；现代汉语用“正在”自然体现这一时态意义。
- source_word: δαιμόνιον
  choice: 鬼
  rationale: δαιμόνιον直接指邪灵或鬼；“鬼”简明自然，并保留原文明确的超自然叙述，不改写为本节未使用的“不洁之灵”。
- source_word: κωφόν
  choice: 使人不能说话的
  rationale: κωφός可指耳聋或不能说话；此处鬼离开后，那人随即说话，因此语境聚焦于失语。修饰δαιμόνιον时采用使役性表达，避免让“不能说话”被误解为鬼本身不会说话。
- source_word: ἐγένετο δὲ τοῦ δαιμονίου ἐξελθόντος
  choice: 鬼出去了
  rationale: 原结构引出随后发生的事件，属格独立结构表明鬼先出去；汉语以简洁的先后分句自然表达，不机械译出“事情发生了”。
- source_word: ἐλάλησεν
  choice: 就开口说话
  rationale: λαλέω意为“说话”。“开口说话”符合失语者恢复言语能力的汉语语境；“就”体现前后紧接，但不额外断言渐进过程。
- source_word: ὁ κωφός
  choice: 那不能说话的人
  rationale: 定冠词加形容词实词化，指受苦的那个人。“那不能说话的人”清楚自然，也不额外指定性别。
- source_word: ἐθαύμασαν
  choice: 很惊讶
  rationale: θαυμάζω表示因所见之事而惊奇、惊叹；“很惊讶”是现代普通读者易懂且符合叙事语体的表达。
- source_word: οἱ ὄχλοι
  choice: 众人
  rationale: ὄχλοι为复数，指聚集的人群；汉语“众人”自然传达群体和人数众多，不必生硬译作复数的“群众们”。
theological_decisions:
- issue: 苦患的性质与赶鬼叙述
  choice: 按原文直述耶稣赶出一个导致人不能说话的鬼，鬼离开后那人恢复说话。
  alternative: 将δαιμόνιον弱化为一种疾病或仅作现象性描述。
  rationale: 希腊文明确使用δαιμόνιον，并把鬼离开与那人说话按事件先后相连。译文应保留这一超自然主张，不加以淡化或扩充。
- issue: κωφός的语义歧义
  choice: 正文按上下文译作“不能说话”，同时用脚注保留“耳聋”的词义可能。
  alternative: 正文译作“耳聋”或同时写成“又聋又哑”。
  rationale: 那人在鬼离开后“说话”，支持此处聚焦失语；但κωφός本身也可指耳聋，因此以脚注保存真实的词汇歧义。“又聋又哑”则加入了原文没有明确并列的两种障碍。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“耶稣”由上下文主语明确补出，避免汉语孤立经节以“他”起句造成指代不清；不额外添加原文未明说的性别。脚注标记置于整节末尾，正文中与脚注对应。
