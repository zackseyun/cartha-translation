source:
  edition: SBLGNT
  text: λέγω ὑμῖν, εἰ καὶ οὐ δώσει αὐτῷ ἀναστὰς διὰ τὸ εἶναι ⸂φίλον αὐτοῦ⸃, διά γε τὴν ἀναίδειαν αὐτοῦ ἐγερθεὶς δώσει αὐτῷ ⸀ὅσων χρῄζει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/008.yaml
  text: I tell you[a], even if he will not get up and give him anything because he is his friend, yet because of his shameless persistence he will get up and give him whatever he needs.
translation:
  language: zh_hans
  text: 我告诉你们：即使他不因那人是他的朋友而起身给他东西，也会因那人不顾脸面的坚持[a]而起来，把那人所需要的一切都给他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“大胆直求”“冒失无礼”；直译为“不知羞耻”。
    reason: ἀναίδεια兼有无所顾忌与不知羞耻的语义色彩；不同译法分别突出其语境效果或字面锋芒。
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: 我告诉你们
  rationale: 这是耶稣讲话中常见的郑重引介语；“我告诉你们”既直接，也符合现代汉语表达。
- source_word: εἰ καὶ οὐ δώσει αὐτῷ ἀναστὰς
  choice: 即使他不……起身给他东西
  rationale: εἰ καί表达让步性的假设；“即使”保留其修辞作用。ἀναστάς在夜间居家场景中指从床上起来。“东西”是按上下文补出的宾语，使汉语完整自然。
- source_word: διὰ τὸ εἶναι φίλον αὐτοῦ
  choice: 因那人是自己的朋友
  rationale: 保留原文以朋友关系为原因的个人性表达；用“那人”和“自己”减少连续代词造成的指代混乱。
- source_word: διά γε
  choice: 却至少会因
  rationale: γε加强转折后原因的确定性；“却至少”既体现与前一原因的对照，也不把语气夸大为绝对断言。
- source_word: ἀναίδειαν αὐτοῦ
  choice: 因那人不顾脸面地坚持请求
  rationale: ἀναίδεια本义涉及不知羞耻、无所顾忌；在本段情境中表现为请求者不因社会礼节而退缩、持续求助。译文保留其负面语感，同时交代语境中的行为表现。
- source_word: ἐγερθεὶς δώσει αὐτῷ
  choice: 起来……给他
  rationale: ἐγερθείς在此与前面的ἀναστάς语义重叠，指从床上起来；汉语自然地译为“起来”。
- source_word: ὅσων χρῄζει
  choice: 把他所需要的都给他
  rationale: 关系代词复数属格与χρῄζει合用，表示所需之物的全部数量；“所需要的都”准确而自然。
theological_decisions:
- issue: ἀναίδεια在比喻中的含义
  choice: 不顾脸面地坚持请求
  alternative: 大胆直求；冒失无礼；不知羞耻
  rationale: 该词本身带有“不知羞耻、无所顾忌”的锋芒，而“坚持”是情境所显出的效果。主译既不把它淡化为纯粹正面的“勇敢”，也不把经文解释成赞许粗鲁无礼。
- issue: ἀναίδεια αὐτοῦ中代词的所指
  choice: 按上下文译为请求者“那人”的行为
  alternative: 形式上也可能被理解为屋内之人的“不顾脸面”
  rationale: 叙事逻辑通常指夜间请求者无所顾忌地继续求助；译文采用这一最自然的指向，但不据此扩展为关于祷告机制的教义说明。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。以“那人”“自己”梳理原文连续第三人称代词的指向；保留让步与转折结构，并将脚注标记置于其所解释的词组之后。
