  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἰ οὖν ὑμεῖς πονηροὶ ὑπάρχοντες οἴδατε δόματα ἀγαθὰ διδόναι τοῖς τέκνοις ὑμῶν, πόσῳ μᾶλλον ὁ πατὴρ ὁ ἐξ οὐρανοῦ δώσει πνεῦμα ἅγιον τοῖς αἰτοῦσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/013.yaml
  text: If you[a], then, being evil, know how to give good gifts to your children[b], how much more will the Father from heaven give the Holy Spirit to those who ask him.
translation:
  language: zh_hans
  text: “那么，你们虽然是恶人，尚且知道把好礼物给自己的儿女，那从天上来的父岂不更会把圣灵赐给那些向他求的人吗？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ οὖν
  choice: 那么……既然
  rationale: εἰ在这里引出由小到大的论证；汉语用“那么”承接上文，并通过整句的“虽然……尚且……岂不更……”自然表达条件和推论。
- source_word: πονηροὶ ὑπάρχοντες
  choice: 虽然邪恶
  rationale: 分词结构在语境中带有让步意味，既保留对人之道德状况的明确描述，又符合现代汉语表达。
- source_word: οἴδατε … διδόναι
  choice: 知道把……给……
  rationale: οἴδατε与不定式διδόναι连用，表示懂得或知道如何给予；汉语无需机械补出“如何”，句意仍然清楚。
- source_word: δόματα ἀγαθὰ
  choice: 好礼物
  rationale: δόματα具体指所赠之物，“好礼物”比宽泛的“好东西”更贴近原词。
- source_word: τοῖς τέκνοις ὑμῶν
  choice: 自己的儿女
  rationale: τέκνοις在家庭语境中自然译作“儿女”；“自己的”明确表达ὑμῶν，同时避免连续使用“你们的”造成生硬。
- source_word: πόσῳ μᾶλλον
  choice: 岂不更会
  rationale: 以现代汉语常用的反问句式传达“何况、更何况”的由小及大论证及其确定语气。
- source_word: ὁ πατὴρ ὁ ἐξ οὐρανοῦ
  choice: 从天而来的父
  rationale: 保留ἐξ οὐρανοῦ的“从天而来”意义，也不补入原文没有的“你们的”，避免与马太福音7:11协调化。
- source_word: πνεῦμα ἅγιον
  choice: 圣灵
  rationale: 在路加语境中指上帝的灵；“圣灵”是准确、自然且广为理解的现代汉语称谓。
- source_word: τοῖς αἰτοῦσιν αὐτόν
  choice: 那些向他求的人
  rationale: 保留现在分词所指的一类人，也明确呈现αὐτόν所指的“他”；“向他求”符合自然汉语。
theological_decisions:
- issue: πνεῦμα ἅγιον的所指
  choice: 译作“圣灵”，指上帝的灵
  alternative: 译作“圣洁的灵”或“一个圣灵”
  rationale: 尽管希腊文没有冠词，本段路加语境中的表达指父所赐的神圣之灵；“圣灵”准确传达其特定所指，同时不扩展经文本身的陈述。
- issue: 与马太福音7:11平行经文的关系
  choice: 保留路加的“从天而来的父”和“圣灵”
  alternative: 协调为“你们在天上的父”及“好东西”
  rationale: 应依照路加的希腊文本，保留两卷福音书各自的措辞和重点，不以平行经文改写本节。
- issue: 由小及大的论证语气
  choice: 采用“虽然……尚且……岂不更会……”的反问表达
  alternative: 采用平直陈述“何况……更会……”
  rationale: 此句虽在形式上作推论，语用上带有强烈的修辞反问效果；该汉语结构自然表达结论的确定性，并不把应许弱化为疑问。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“虽然……尚且……岂不更会……”呈现由小及大的论证；“从天而来的父”略带经文特有的庄重感，刻意保留路加原文不同寻常的表达。所有脚注标记均已置于正文相应词语之后。
