  text: ἢ καὶ ⸀αἰτήσει ᾠόν, ⸀ἐπιδώσει αὐτῷ σκορπίον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/012.yaml
  text: Or if he asks for an egg, will he give him a scorpion?
translation:
  language: zh_hans
  text: 又或者，孩子若求一个鸡蛋，父亲会给他一只蝎子吗？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἢ καὶ
  choice: 又或者
  rationale: 承接前面的并列例子并引出另一反问；“又或者”在现代汉语中自然地表达递进、转换，而不过度凸显 καί。
- source_word: αἰτήσει
  choice: 求
  rationale: 此处将来时直陈语气用于带条件意味的反问情境；“求”简洁自然，也符合孩子向父亲索求食物的语境。
- source_word: ᾠόν
  choice: 一个鸡蛋
  rationale: 直接表达所求之物；汉语通常说“鸡蛋”，比单说“蛋”更明确自然。
- source_word: ἐπιδώσει
  choice: 会给
  rationale: 该动词在此表示针对请求而给予；“会给”准确保留反问中的将来或可能意味。
- source_word: αὐτῷ
  choice: 他
  rationale: 作间接宾语，指向提出请求的人；现代汉语以“给他”自然表达。
- source_word: σκορπίον
  choice: 一只蝎子
  rationale: 采用标准对应词，并使用适合动物的量词“一只”，保留鸡蛋与危险生物之间鲜明而荒谬的对比。
theological_decisions:
- issue: 父亲与孩子类比的反问力量
  choice: 保持直接反问，不增添“反而”或解释性文字
  alternative: 译作“反而会给他一只蝎子吗？”以明说替代关系
  rationale: 希腊文让荒谬的对比自行产生反问效果；直译式表达既清楚，又不额外解释，从而保留关于父亲良善这一论证的原有力度。
- issue: 主语在本节中的呈现
  choice: 补出“父亲”
  alternative: 仅译为“他会给他一只蝎子吗？”
  rationale: 希腊文主语由前文父亲与儿子的语境承接而省略。汉语若连续使用两个“他”容易指代不清，补出“父亲”是语境所明示的信息，并未添加新的解释。
translation_notes:
  register: 采用现代、清楚而庄重的口语化书面语。“又或者”承接并列反问；“求一个鸡蛋”与“给他一只蝎子”保持原文简洁鲜明的对照。无须脚注。
