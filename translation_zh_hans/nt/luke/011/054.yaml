  text: lying in wait for him[c][b][a], to catch something from his mouth.
translation:
  language: zh_hans
  text: 暗中窥伺他，要从他口中抓住什么话柄[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“要从他口中捕捉到什么。”也可译为：“暗中埋伏等候他”或“等着设圈套陷害他”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνεδρεύοντες
  choice: 暗中伺机对付
  rationale: 该分词带有敌意地埋伏、伺候机会以陷害人的意味。“暗中伺机对付”在现代汉语中自然，也保留了蓄意设伏的敌对色彩。
- source_word: αὐτόν
  choice: 他
  rationale: 代词承接上文所指的耶稣；正文保留代词，不把指称显明化。
- source_word: θηρεῦσαί
  choice: 抓住
  rationale: 该动词本有捕猎、捕捉之意，在这里比喻从言语中找到可用来陷害他的内容。“抓住”既保留捕捉意象，也符合汉语表达。
- source_word: τι
  choice: 什么
  rationale: 不定代词表示他们企图从耶稣的话中抓到某个可利用之处；“什么”保留其不确定性。
- source_word: ἐκ τοῦ στόματος αὐτοῦ
  choice: 从他口中
  rationale: 保留原文具体的“口”这一意象，同时在现代汉语中可自然表示人所说的话。
- source_word: τι ἐκ τοῦ στόματος αὐτοῦ
  choice: 从他口中抓住什么话柄
  rationale: “话柄”自然传达他们企图利用耶稣言语陷害他的语境；脚注同时保留原文更直译的表达。
