  text: ὅταν ὁ ἰσχυρὸς καθωπλισμένος φυλάσσῃ τὴν ἑαυτοῦ αὐλήν, ἐν εἰρήνῃ ἐστὶν τὰ ὑπάρχοντα αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/021.yaml
  text: When the strong man[a], fully armed, guards his own courtyard[b], his possessions are secure.
translation:
  language: zh_hans
  text: 壮汉全副武装，看守自己的院落时，他的财物就安然无恙。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “安然无恙”直译为“处于平安中”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: ……时
  rationale: 引出一般性的时间兼条件情景；汉语用“……时”自然，也保留这种开放的情景表达。
- source_word: ὁ ἰσχυρός
  choice: 壮汉
  rationale: 该形容词带冠词并作名词使用，指一个强壮有力的男性；“壮汉”简洁自然，并保留原文的阳性单数形象。
- source_word: καθωπλισμένος
  choice: 全副武装
  rationale: 完成时分词表示已经装备好武器并处于这种状态；“全副武装”准确而自然。
- source_word: φυλάσσῃ
  choice: 看守
  rationale: 表达持续警戒、守护的行动；“看守”既贴近原义，也适合院落这一宾语。
- source_word: τὴν ἑαυτοῦ αὐλήν
  choice: 自己的院落
  rationale: αὐλή可指院子，也可延伸指宅院或宫院；“院落”在此兼顾空间及其所属住宅范围，又不额外赋予豪华宫殿的意味。
- source_word: ἐν εἰρήνῃ ἐστίν
  choice: 安然无恙
  rationale: 字面为“处于平安中”，在财物语境中表示安全、未受侵扰；“安然无恙”是自然的现代汉语，同时保留安稳无扰的意涵。
- source_word: τὰ ὑπάρχοντα αὐτοῦ
  choice: 他的财物
  rationale: 指属于他的物品和产业；“财物”清楚、庄重，并适合被守护的语境。
theological_decisions:
- issue: 比喻中“壮汉”的所指
  choice: 正文只保留“壮汉”的比喻形象，不直接指明其代表谁
  alternative: 在正文中明确译作或解释为撒但
  rationale: 本节经文本身陈述比喻画面，具体所指由上下文揭示；译文不应提前消解这一比喻及其神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“壮汉”“全副武装”“看守自己的院落”保留鲜明的叙事画面；句末用“安然无恙”自然表达财物不受侵扰的状态。
