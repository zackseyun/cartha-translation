  text: καθὼς γὰρ ἐγένετο ⸀Ἰωνᾶς ⸂τοῖς Νινευίταις σημεῖον⸃, οὕτως ἔσται καὶ ὁ υἱὸς τοῦ ἀνθρώπου τῇ γενεᾷ ταύτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/030.yaml
  text: For just as Jonah became a sign to the Ninevites[a], so also the Son of Man will be to this generation.
translation:
  language: zh_hans
  text: 因为正如约拿成了尼尼微人的一个记号，人子也要照样作这个世代的一个记号。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文后半句字面可译为“人子对这个世代也将照样如此”；“作……的记号”是按前后两句的平行关系补出的，原文没有重复“记号”一词。
    reason: 说明原文后半句省略了由前句承接的表语，保留其形式上的含蓄。
lexical_decisions:
- source_word: καθὼς γὰρ
  choice: 因为，……怎样
  rationale: “因为”保留γάρ承接上文的解释作用，“怎样……也照样”体现καθώς与οὕτως的对应比较，符合现代汉语表达。
- source_word: ἐγένετο
  choice: 成了
  rationale: 保留γίνομαι在此处“成为、开始起某种作用”的结果性含义，表明约拿成了一个记号，而不只是静态地“是”记号。
- source_word: Ἰωνᾶς
  choice: 约拿
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: τοῖς Νινευίταις
  choice: 尼尼微人的
  rationale: 该与格表示对象或关系；汉语以“尼尼微人的记号”自然表达“对尼尼微人而言的记号”。
- source_word: σημεῖον
  choice: 记号
  rationale: σημεῖον在此指具有启示、指示意义的标志；“记号”比“神迹”更能避免把约拿本人仅仅理解为一次超自然奇事。
- source_word: οὕτως … καὶ
  choice: 也照样
  rationale: 清楚呈现与前半句“怎样”相呼应的比较关系，并保留καί的附加意味。
- source_word: ἔσται
  choice: 要作
  rationale: 表达εἰμί将来时“将是”的系词意义；“作……的记号”是自然汉语，并避免误译成与前句γίνομαι完全相同的“成为”。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人子
  rationale: 保留福音书中这一具有称号性质的传统译法及其经文互涉和神学张力，不作解释性展开。
- source_word: τῇ γενεᾷ ταύτῃ
  choice: 这个世代的
  rationale: 该与格表示对象或关系；“这个世代”保留γενεά在路加叙事中的时代与群体意味，而不缩窄为“这一代人”中的某一年龄层。
theological_decisions:
- issue: 后半句省略的表语
  choice: 正文补出由前半句所暗示的“记号”
  alternative: 直译为“人子对这个世代也将如此”或“人子对这个世代也将是这样”
  rationale: 希腊文后半句没有重复σημεῖον，但καθώς…οὕτως的平行结构明确承接前句的表语。正文补出“记号”可使现代汉语清楚自然，又不增添新的神学主张；脚注同时说明原文的省略。
- issue: “人子”的含义
  choice: 保留“人子”这一传统称号
  alternative: 译作“那位人”或作解释性扩译
  rationale: 原短语既可按字面理解，又在福音书中具有称号及末世性回响；保留“人子”可避免将其神学含义单一化。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“怎样……也照样”保留原句鲜明的对应结构；“记号”通俗且能体现启示性意义。正文补足汉语所需的表语，脚注交代希腊文的省略，以兼顾可读性与形式透明度。
