base_translation:
  language: en
  yaml_path: translation/nt/luke/011/027.yaml
  text: And it happened[a], as he was saying these things, that a woman from the crowd raised her voice and said to him, “Blessed is the womb that carried you[b], and the breasts that nursed you.”
translation:
  language: zh_hans
  text: 耶稣正说这些话时，有一个女人从人群中扬声[a]对他说：“那曾怀着你的母腹[b]和你曾吸吮的乳房，是有福的！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“举起声音”，意思是扬声或高声喊出。
    reason: lexical_alternative
  - marker: b
    text: 或译“孕育过你的母腹”。这里的动词可指在孕期怀着、承载，也可含生育之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: （不单独译出，以“……时”引入事件）
  rationale: 这是路加常用的叙事承接语。现代汉语若直译为“事情发生了”会显得生硬；通过时间从句和主句的事件推进保留其叙事功能。
- source_word: ἐν τῷ λέγειν αὐτὸν ταῦτα
  choice: 耶稣正说这些话时
  rationale: 以“正……时”表达与主句同时发生且正在进行的动作，并保留“这些话”的指示意义。
- source_word: ἐπάρασά τις φωνὴν γυνὴ
  choice: 有一个女人扬声
  rationale: “扬声”自然、庄重地表达希腊语“举起声音”的习语；τις以不定表达“有一个”呈现。
- source_word: ἐκ τοῦ ὄχλου
  choice: 人群中
  rationale: 符合现代汉语表达，清楚说明女人来自人群之中。
- source_word: Μακαρία
  choice: 是有福的
  rationale: 保留μακάριος所表达的蒙福、值得称羡之意，而不缩减为主观的“快乐”。
- source_word: ἡ κοιλία
  choice: 母腹
  rationale: 本处明确指孕育孩子的腹部，即母腹；该词既具体又符合庄重的现代汉语。
- source_word: ἡ βαστάσασά σε
  choice: 怀过你的
  rationale: 在母腹的语境中，βαστάζω指妊娠期间承载、怀着孩子；“怀过你”清楚自然，同时脚注保留“承载”的词义色彩。
- source_word: μαστοὶ οὓς ἐθήλασας
  choice: 你曾吸吮的乳房
  rationale: 按希腊语语法，耶稣是ἐθήλασας的主语，乳房是关系代词所指的宾语；此译比把乳房写成主动“哺乳”更贴近原文，同时在汉语中仍可理解。
theological_decisions:
- issue: 女人称耶稣母亲为有福所具有的荣誉意味
  choice: 怀过你的母腹和你曾吸吮的乳房，是有福的
  alternative: 孕育并乳养你的母亲是有福的
  rationale: 原文以“母腹”和“乳房”具体指称耶稣的母亲。译文保留这一修辞和“有福”的荣誉意味，既不削弱，也不扩展为经文本身没有陈述的后期教义。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“扬声”保持叙事简洁；“母腹”和“乳房”保留原文具体的母性身体意象，不使用委婉语。为避免生硬的翻译腔，叙事公式Ἐγένετο δὲ不逐词译出，而由整句结构体现。
