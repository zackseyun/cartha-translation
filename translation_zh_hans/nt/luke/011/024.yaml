source:
  edition: SBLGNT
  text: Ὅταν τὸ ἀκάθαρτον πνεῦμα ἐξέλθῃ ἀπὸ τοῦ ἀνθρώπου, διέρχεται δι’ ἀνύδρων τόπων ζητοῦν ἀνάπαυσιν, καὶ μὴ ⸀εὑρίσκον λέγει· Ὑποστρέψω εἰς τὸν οἶκόν μου ὅθεν ἐξῆλθον·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/024.yaml
  text: When the unclean spirit has gone out from the man[a], it passes through waterless places seeking rest, and not finding any, it says, ‘I will return to my house, from which I came out.’
translation:
  language: zh_hans
  text: “污灵从人身上出来后，就经过无水之地[a]，寻找安歇；找不到，就说：‘我要回到我的房子去，我从那里出来。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“干旱之地”。希腊文直译为“无水之地”。
    reason: 说明ἀνύδρων τόπων可按自然汉语译为“干旱之地”，并保留正文“无水之地”的字面表达；标记置于相应词语之后。
lexical_decisions:
- source_word: Ὅταν
  choice: ……以后
  rationale: 与不定过去时虚拟语气ἐξέλθῃ结合，表达一般性的时间条件；汉语用“……以后”自然呈现某事发生后的情形，同时不把句子限定为一次性的事件。
- source_word: τὸ ἀκάθαρτον πνεῦμα
  choice: 污灵
  rationale: 这是福音书中指邪灵的固定表达。“污灵”简洁保留“不洁、污秽”的含义，也符合现代汉语圣经语体。
- source_word: ἐξέλθῃ ἀπὸ τοῦ ἀνθρώπου
  choice: 从那人身上出来
  rationale: “从……身上出来”自然表达灵离开人的意思；“那人”保留定冠词所指向的代表性个案，不额外说明其身份。
- source_word: διέρχεται δι’ ἀνύδρων τόπων
  choice: 经过无水之地
  rationale: “经过”准确表达穿行其间；“无水之地”贴近ἀνύδρων的字面意象，不把它仅仅弱化为一般的“干燥”。
- source_word: ζητοῦν ἀνάπαυσιν
  choice: 寻找安歇之处
  rationale: “寻找”保留分词的持续动作，“安歇之处”以自然汉语表达所寻求的ἀνάπαυσις，并根据语境补出隐含的处所。
- source_word: καὶ μὴ εὑρίσκον
  choice: 既找不到
  rationale: 所找不到的是前文的“安歇之处”，汉语可自然省略重复宾语；“既”顺畅引出随后作出的决定。
- source_word: λέγει
  choice: 便说
  rationale: 保留希腊文现在时所带来的生动叙述感，并以“便”连接未找到安歇之处后的反应。
- source_word: Ὑποστρέψω εἰς τὸν οἶκόν μου
  choice: 我要回到我的房子去
  rationale: “要”表达将来的决意；“我的房子”保留原文的所有格和具体房屋意象，不改译为较温情化的“家”。
- source_word: ὅθεν ἐξῆλθον
  choice: 我就是从那里出来的
  rationale: 把希腊文关系从句转换为自然的汉语分句；“那里”明确回指“我的房子”，并与本节前面的“出来”形成呼应。
theological_decisions:
- issue: “污灵”的所指
  choice: 按具有行动和言说能力的邪灵来译，称为“污灵”
  alternative: 理解为道德退步的比喻，或译作非人格性的力量
  rationale: 本句把离开、穿行、寻找、说话和返回都归于该灵。译文保留这种人格化呈现，不将其消解为纯粹比喻，也不额外引入系统神学解释。
- issue: ἀνθρώπου的性别与代表性
  choice: 译作“那人”
  alternative: 译作“那个人”或“某人”
  rationale: 希腊文为阳性单数并带定冠词，但此处描绘的是一个代表性情形。“那人”既贴近形式，也不在汉语中额外强调生理性别。
- issue: “我的房子”的隐喻
  choice: 保留“我的房子”这一具体说法
  alternative: 解释性改译为“我先前占据的人”或“我的住处”
  rationale: 原文让污灵称被离开的对象为“我的房子”，但没有在本节明说隐喻的全部对应关系。译文保留原有张力和所有格，不预先解释其神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“污灵”“安歇之处”保持经文语感，但避免生僻古雅；直接引语按现代汉语标点处理。
