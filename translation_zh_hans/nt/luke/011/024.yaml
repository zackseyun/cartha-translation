    rationale: ὅθεν ἐξῆλθον仅说明“我从那里出来”，没有对应“就是”的强调成分；删去可避免无依据强化。
  - severity: low
    issue: “那人”在本节孤立语境中容易显得指向某个已知人物。
    rationale: 带冠词的ὁ ἄνθρωπος在此为代表性个案；汉语以“人”作泛指更自然，且不改变该代表性用法。
