base_translation:
  language: en
  yaml_path: translation/nt/luke/011/038.yaml
  text: But the Pharisee, when he saw it, was astonished that he had not first washed before the meal.
translation:
  language: zh_hans
  text: 法利赛人看见耶稣饭前没有先作洁净礼[a]，就很诧异。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“饭前没有先洗净自己。”原文所用动词也常译为“施洗”或“受洗”，但这里是指法利赛人洁净规例中的礼仪性清洗。
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: （不单独译出）
  rationale: 此处表示叙事推进并带轻微转折；汉语借语序和“就”自然体现，无须生硬译作“但是”。
- source_word: ὁ Φαρισαῖος
  choice: 法利赛人
  rationale: 现代中文通行的群体称谓；上下文已指出这位邀请耶稣的人，汉语无需另译定冠词。
- source_word: ἰδὼν
  choice: 看见
  rationale: 简洁表达先于主句反应发生的伴随性动作；将上下文所指的情形在宾语从句中说明。
- source_word: ἐθαύμασεν
  choice: 很诧异
  rationale: 表达因耶稣未遵从预期礼俗而产生的惊讶；措辞自然，同时不把经文本身未明说的责难强加进去。
- source_word: οὐ πρῶτον ἐβαπτίσθη
  choice: 没有先行洁净礼
  rationale: 此处的被动形式在法利赛人饭前洁净习俗的语境中指礼仪性清洗，而不是基督教洗礼；“行洁净礼”既明确语境，也比单说“洗手”更能保留原词可能涉及较全面清洗的含义。
- source_word: πρὸ τοῦ ἀρίστου
  choice: 饭前
  rationale: 准确而自然地表达“在用餐以前”；不把ἄριστον过度限定为早餐或午餐。
theological_decisions:
- issue: 法利赛人用餐语境中ἐβαπτίσθη的含义
  choice: 译作“行洁净礼”
  alternative: 受洗／浸洗／洗手
  rationale: 上下文所涉及的是法利赛人的礼仪洁净习俗，而非基督教洗礼。“洁净礼”避免引入圣礼含义，也不将动作范围武断缩窄为洗手；脚注交代该动词与通常译作“施洗／受洗”的词相同，以保留词汇张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“饭前”比“在吃饭以前”简练自然；“行洁净礼”清楚呈现历史语境，并以脚注保留原动词的词汇关联和另一种直译可能。
