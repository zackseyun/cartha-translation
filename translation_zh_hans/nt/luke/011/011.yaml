  text: What father among you[a], if his son asks for a fish, will give him a snake instead of a fish?
translation:
  language: zh_hans
  text: 你们中间作父亲的，哪一个会在儿子要鱼时，拿一条蛇代替鱼给他呢？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τίνα δὲ ἐξ ὑμῶν τὸν πατέρα
  choice: 你们中间作父亲的，哪一个
  rationale: 保留“从你们中间哪一位父亲”的反问结构，同时采用自然、清楚的现代汉语表达。
- source_word: αἰτήσει
  choice: 要
  rationale: 此处指儿子向父亲求取某物；“要鱼”符合日常亲子语境，也自然承载希腊语将来时在假设性反问中的含义。
- source_word: ὁ υἱὸς
  choice: 儿子
  rationale: 上下文已明确父子关系，汉语无需另加“他的”也能准确表达关系性、泛指的含义。
- source_word: ἰχθύν / ἰχθύος
  choice: 鱼
  rationale: 保留具体事物和单数概念；现代汉语中“要鱼”无需量词，而后文因句法需要隐含重复的“鱼”。
- source_word: ἀντὶ
  choice: 反倒
  rationale: 结合“给他一条蛇”自然表达“以蛇代鱼”的替代和出乎常理的反差；避免生硬重复“代替鱼”。
- source_word: ὄφιν
  choice: 一条蛇
  rationale: ὄφις在此通常指蛇；“蛇”是现代汉语自然、准确的通称，量词“一条”使宾语具体清楚。
- source_word: αὐτῷ ἐπιδώσει
  choice: 给他
  rationale: ἐπιδίδωμι在此意为给予、递给；“给他”简洁自然，并明确接受者是儿子。
