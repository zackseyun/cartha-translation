  text: ἄφρονες, οὐχ ὁ ποιήσας τὸ ἔξωθεν καὶ τὸ ἔσωθεν ἐποίησεν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/040.yaml
  text: Fools! Did not the one who made the outside also make the inside?[a]
translation:
  language: zh_hans
  text: 愚昧的人哪！那位造外面的，不也造里面吗？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “外面……里面”在当前语境中可指器皿的外部和内部，也可进一步指人的外在生活和内在生命。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφρονες
  choice: 无知的人哪
  rationale: 复数呼格形容词作名词使用，是直接而严厉的责备。“无知的人哪”自然庄重，保留了原文所指的愚昧与欠缺判断，同时避免引入单纯智力低下的含义。
- source_word: οὐχ ... ἐποίησεν;
  choice: 不也造了……吗？
  rationale: 带否定词的反问预期肯定回答。汉语用“不也……吗”自然地传达这一反问力度；不把句子改成平直陈述。
- source_word: ὁ ποιήσας
  choice: 那造了……的
  rationale: 带冠词的简过去分词作名词使用。“那造了……的”保留人格性指称，却不把希腊文未明说的“神”直接补入正文。
- source_word: τὸ ἔξωθεν
  choice: 外面
  rationale: 中性词名词化，表示外在的一面。此处既可就近指器皿的外面，也可延伸指人的外在生活；“外面”能保留这种双重适用。
- source_word: τὸ ἔσωθεν
  choice: 里面
  rationale: 与“外面”平行，表示内在的一面。它既可指器皿内部，也可延伸指人的内在生命；采用“里面”以维持原文的简洁和含义张力。
- source_word: καὶ
  choice: 也
  rationale: 在反问中译为“也”，清楚表达造外面的那一位同样造了里面，并符合现代汉语习惯。
theological_decisions:
- issue: “那造了……的”所指为何
  choice: 保留对创造主上帝的隐含指向，不在正文中明说“上帝”
  alternative: 只理解为制造杯盘等器皿的人，或在正文中直接译作“上帝”
  rationale: 这句话既承接杯盘内外的当下比喻，也可指向上帝创造人的外在与内在。原文没有明说“上帝”，因此译文保持概括性，以免消除这两层之间的张力。
translation_notes:
  register: 采用现代、自然而庄重的普通话。“无知的人哪”保留直接斥责的力度；“外面……里面”沿用日常词汇，使器皿意象及其对人内外生命的延伸都清楚可感。
