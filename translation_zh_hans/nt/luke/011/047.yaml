source:
  edition: SBLGNT
  text: οὐαὶ ὑμῖν, ὅτι οἰκοδομεῖτε τὰ μνημεῖα τῶν προφητῶν οἱ δὲ πατέρες ὑμῶν ἀπέκτειναν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/047.yaml
  text: Woe to you[b][a], because you build the tombs of the prophets whom your fathers killed.
translation:
  language: zh_hans
  text: 你们有祸了！因为你们修建先知的坟墓[a]，你们的祖先[b]却杀害了他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“纪念墓”。希腊语可指坟墓，也可指墓碑、墓冢一类的纪念性墓葬建筑。
    reason: lexical_alternative
  - marker: b
    text: 直译“父辈”；这里指历代祖先。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐαὶ ὑμῖν
  choice: 你们有祸了
  rationale: 保留先知性谴责和审判宣告的力度；“你们有祸了”是现代中文圣经语体中自然且庄重的表达。
- source_word: ὅτι
  choice: 因为
  rationale: 明确引出遭受祸患宣告的原因，符合此处的因果用法。
- source_word: οἰκοδομεῖτε
  choice: 修建
  rationale: 表达建造或营建之意，搭配“坟墓”自然，也不把希腊语现在时过度限定为正在进行。
- source_word: τὰ μνημεῖα
  choice: 坟墓
  rationale: μνημεῖον在此指与死者有关的墓穴或墓冢；“坟墓”清楚保留丧葬含义，而脚注说明也可指纪念性墓冢。
- source_word: τῶν προφητῶν
  choice: 先知的
  rationale: 直接表达属格关系，即属于或纪念先知的坟墓。
- source_word: οἱ δὲ πατέρες ὑμῶν
  choice: 你们的祖先却
  rationale: πατέρες在此指先辈、祖先；“祖先”比字面的“父辈”更准确地传达历代先人的含义。δέ译作“却”，保留修墓与杀害之间的修辞对照，但不提前明说其神学推论。
- source_word: ἀπέκτειναν αὐτούς
  choice: 杀害了他们
  rationale: 直接表达使先知死亡，并以“杀害”自然体现语境中的有责行为，但不加入“谋杀”等更具体的法律判断。
theological_decisions:
- issue: 是否明说修建先知坟墓与祖先杀害先知所暗含的虚伪或同谋关系
  choice: 仅并列并对照两项事实：“你们修建……你们的祖先却杀害了他们”
  alternative: 译成“你们为被你们祖先杀害的先知修建坟墓”，或补明“因此证明你们祖先所做的事”
  rationale: 本节以οἱ δὲ πατέρες ὑμῶν形成修辞张力，下一节才进一步解释其含义。译文保留这种张力，不提前代替经文作出推论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“有祸了”保留审判宣告的力度；“修建”“杀害”简洁自然。脚注标记均紧随所解释的词语。
