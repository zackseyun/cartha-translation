  text: ⸀ἀπὸ αἵματος Ἅβελ ⸀ἕως αἵματος Ζαχαρίου τοῦ ἀπολομένου μεταξὺ τοῦ θυσιαστηρίου καὶ τοῦ οἴκου· ναί, λέγω ὑμῖν, ἐκζητηθήσεται ἀπὸ τῆς γενεᾶς ταύτης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/051.yaml
  text: from the blood of Abel to the blood of Zechariah[a], who perished between the altar and the house. Yes, I tell you[b], it will be required from this generation.
translation:
  language: zh_hans
  text: 从亚伯的血起，直到那丧命于祭坛和圣殿[a]之间的撒迦利亚[b]的血。是的，我告诉你们，必从这个世代追讨这血债。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣殿”原文直译为“房屋”；此处指圣殿建筑。
    reason: lexical_alternative
  - marker: b
    text: 这里所说的撒迦利亚究竟是谁，尚有争议；可能是耶何耶大的儿子撒迦利亚（历代志下24:20—22），也可能是比利家的儿子撒迦利亚。
    reason: cross_reference
lexical_decisions:
- source_word: ἀπὸ αἵματος Ἅβελ ⸀ἕως αἵματος Ζαχαρίου
  choice: 从亚伯的血起，直到……撒迦利亚的血
  rationale: 保留“从……直到……”的修辞范围，也保留“血”的圣经表达；在上下文中，“血”兼有流血与血债的含义。
- source_word: τοῦ ἀπολομένου
  choice: 那死在……的
  rationale: 不过度指明施害者，同时在当前语境中自然表达其遭遇暴死。
- source_word: μεταξὺ τοῦ θυσιαστηρίου καὶ τοῦ οἴκου
  choice: 在祭坛和殿宇之间
  rationale: οἶκος字面为“房屋”，但在此圣殿语境中指圣殿建筑；“殿宇”既自然庄重，也较“房屋”更清楚，字面信息在脚注保留。
- source_word: ναί, λέγω ὑμῖν
  choice: 是的，我告诉你们
  rationale: 保留ναί的郑重肯定语气，并以现代汉语自然表达λέγω ὑμῖν。
- source_word: ἐκζητηθήσεται
  choice: 必……追讨
  rationale: 该词在流血与审判语境中表示追究、索取责任；“追讨血债”传达司法性问责，同时保留神圣被动而不明说执行者。
- source_word: ἀπὸ τῆς γενεᾶς ταύτης
  choice: 向这个世代
  rationale: 与“追讨”搭配自然，准确表达责任将从这个世代索取；不扩大或缩小γενεά所指范围。
theological_decisions:
- issue: 撒迦利亚的身份及耶稣指控的范围
  choice: 正文只音译其名，不判定具体是哪一位撒迦利亚；“这个世代”也保持原文措辞。
  alternative: 可理解为耶何耶大的儿子撒迦利亚、比利家的儿子撒迦利亚，或代表性的殉道先知人物。
  rationale: 本节希腊文本没有进一步说明撒迦利亚的身份，因此不应在正文中消除历史上的争议；同样，不把“这个世代”纳入任何额外的神学体系。
- issue: ἐκζητηθήσεται的隐含施事者
  choice: 采用“必向这个世代追讨”的表达，不明说追讨者。
  alternative: 明确译作“神必向这个世代追讨”。
  rationale: 被动式在语境中可理解为神施行审判，但原文没有在本句明说主语；保留这种神圣被动可避免增添文本未明示的成分。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“殿宇”适合圣殿场景；“血债必……追讨”自然传达审判与问责，同时未把隐含施事者显明为“神”。脚注标记按其实际说明对象分别置于“殿宇”和“撒迦利亚”之后。
