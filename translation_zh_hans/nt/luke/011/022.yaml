  text: ἐπὰν ⸀δὲ ἰσχυρότερος ⸀αὐτοῦ ἐπελθὼν νικήσῃ αὐτόν, τὴν πανοπλίαν αὐτοῦ αἴρει ἐφ’ ᾗ ἐπεποίθει, καὶ τὰ σκῦλα αὐτοῦ διαδίδωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/022.yaml
  text: But when one stronger than he comes upon him and overpowers him[a], he takes away his full armor on which he had relied[c][b], and distributes his plunder.
translation:
  language: zh_hans
  text: 但有比他更强的一位来对付他，并战胜他[a]，就夺去他所倚仗的全副武装[b]，并分配他的战利品[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“制服他”“征服他”。
    reason: lexical_alternative
  - marker: b
    text: “全副武装”指一整套防护装备。
    reason: lexical_clarification
  - marker: c
    text: 或译：“掠物”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὰν δὲ
  choice: 但……来……就
  rationale: 以“但”承接上文并形成转折；“来……就”自然表达不定时间条件关系。
- source_word: ἰσχυρότερος αὐτοῦ
  choice: 有一个比他更强的
  rationale: 保留比较级作名词用的表达，不补入原文没有明说的“人”，同时在中文中指称清楚。
- source_word: ἐπελθὼν
  choice: 来袭击他
  rationale: 此词可指临到或攻向；上下文是制服、夺取武装和战利品，译作“来袭击”能自然呈现敌对行动。
- source_word: νικήσῃ αὐτόν
  choice: 胜过他
  rationale: 表达在争斗中获胜并制服对方的结果，同时不额外指明寓意中的身份。
- source_word: τὴν πανοπλίαν αὐτοῦ
  choice: 他的全副武装
  rationale: πανοπλία指整套装备；“全副武装”既保留完整性，也符合现代汉语习惯。
- source_word: αἴρει
  choice: 夺去
  rationale: 在战胜对方的语境中，不只是一般移走，而是从败者手中夺取，故用“夺去”。
- source_word: ἐφ’ ᾗ ἐπεποίθει
  choice: 他所倚仗的
  rationale: 表达过去持续或既有的信赖；“倚仗”兼具依靠和自恃之意，适合武装这一宾语。
- source_word: τὰ σκῦλα αὐτοῦ
  choice: 他的战利品
  rationale: σκῦλα指从战败者那里取得的掠物；“战利品”准确保留争战意象。
- source_word: διαδίδωσιν
  choice: 分掉
  rationale: 表示将所得掠物分配开来；“分掉”比书面化的“分配”更自然，又保留动作结果。
theological_decisions:
- issue: 是否把较强者明确译作“更强的人”
  choice: 译作“有一个比他更强的”，不补“人”
  alternative: 有一个比他更强的人
  rationale: 希腊文以比较级形容词作名词用，并未在本句重复“人”；保留这种表达可避免不必要增词，上文仍足以说明比喻场景。
- issue: νικάω在冲突场景中的力度
  choice: 胜过他
  alternative: 制服他；战胜他；征服他
  rationale: “胜过”保留获胜这一基本语义，并与“更强”形成自然呼应；脚注列出力度略有不同的可行译法，不把比喻直接解释为特定神学身份之间的争战。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。句式保留原文由来袭、获胜、夺去武装到分掉战利品的推进。“全副武装”在现代汉语中也可描述处于装备齐全的状态，但此处受“夺去”支配，按名词性短语理解为整套武器装备；脚注予以说明。
