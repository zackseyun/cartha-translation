revisions:
- from: 但有一个比他更强的来袭击他，胜过他[a]，就夺去他所倚仗的全副武装[b]，并分掉他的战利品[c]。
  to: 但有比他更强的一位来对付他，并战胜他[a]，就夺去他所倚仗的全副武装[b]，并分配他的战利品[c]。
  rationale: 修订避免将ἐπελθών过度具体化为“袭击”，并以“战胜”表达νικάω在本句所呈现的胜败结果。其余措辞保留原有的冲突意象、叙事推进和神学开放性；脚注锚点仍分别对应“战胜”“全副武装”“战利品”。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T03:21:05Z'
