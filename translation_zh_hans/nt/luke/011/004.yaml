id: LUK.11.4
reference: Luke 11:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἄφες ἡμῖν τὰς ἁμαρτίας ἡμῶν, καὶ γὰρ αὐτοὶ ἀφίομεν παντὶ ὀφείλοντι ἡμῖν· καὶ μὴ εἰσενέγκῃς ἡμᾶς εἰς ⸀πειρασμόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/004.yaml
  text: And forgive us our sins[a], for we ourselves also forgive everyone indebted to us[c][b]. And do not bring us into temptation.
translation:
  language: zh_hans
  text: 赦免我们的罪，因为我们自己也赦免所有亏欠我们的人[a]；不要带我们进入试探[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“所有欠我们债的人”；原文在这里使用欠债、亏欠的说法，而前面说的是“罪”。
    reason: lexical_alternative
  - marker: b
    text: “试探”也可译作“考验”或“试炼”。
    reason: alternative_reading
lexical_decisions:
- source_word: ἄφες
  choice: 赦免
  rationale: 在向上帝祈求的语境中，ἀφίημι自然指赦罪；“赦免”庄重、通顺，也与后面的ἀφίομεν保持动词上的呼应。
- source_word: τὰς ἁμαρτίας ἡμῶν
  choice: 我们的罪
  rationale: 原文明确使用ἁμαρτία（罪），并非“债”；直译为“我们的罪”可保留本句前后“罪”与“亏欠”之间有意形成的差异。
- source_word: καὶ γὰρ αὐτοὶ
  choice: 因为我们自己也
  rationale: “因为”表达γάρ引出的理由；“我们自己”保留αὐτοί的强调，“也”体现καί，整体符合现代汉语语序。
- source_word: ἀφίομεν
  choice: 赦免
  rationale: 与前面的“赦免”用同一动词，保留原文ἄφες与ἀφίομεν的词语呼应，并适合人际过犯的语境。
- source_word: παντὶ ὀφείλοντι ἡμῖν
  choice: 所有亏欠我们的人
  rationale: “亏欠”既保留ὀφείλω的欠债意象，又可自然涵盖人际和道德上的亏欠；脚注给出更明确的债务表达。
- source_word: μὴ εἰσενέγκῃς ἡμᾶς εἰς πειρασμόν
  choice: 不要带我们进入试探
  rationale: “带……进入”贴近εἰσφέρω的方向性，比“不要让我们遇见”更少解释原文；“试探”作为正文译法自然且为读者熟悉，另以脚注保留“考验”的词义可能。
theological_decisions:
- issue: 末句祈求中πειρασμός的含义以及上帝与试探的关系
  choice: 不要带我们进入试探
  alternative: 不要带我们进入考验
  rationale: 正文按原文保留“带入”的表述，不增添“容许”“任凭”或“保护”等解释，避免替原文消解神学张力；脚注说明πειρασμός也可指考验。
- issue: 前半句“罪”与后半句债务语言的关系
  choice: 前句译“罪”，后句译“亏欠”
  alternative: 把两处都统一译成“过犯”或“债”
  rationale: 原文前句使用ἁμαρτία，后句使用ὀφείλω；分别翻译可忠实保留路加文本中的词汇转换，不把两者人为统一。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“赦免”符合宗教语境但并不过分古雅；“我们自己也”保留原文强调；分号呈现两个并列祈求。
