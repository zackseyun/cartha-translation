  text: Καὶ εἶπεν πρὸς αὐτούς· Τίς ἐξ ὑμῶν ἕξει φίλον καὶ πορεύσεται πρὸς αὐτὸν μεσονυκτίου καὶ εἴπῃ αὐτῷ· Φίλε, χρῆσόν μοι τρεῖς ἄρτους,
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/005.yaml
  text: And he said to them[a], “Which of you who has a friend will go to him at midnight and say to him, ‘Friend, lend me three loaves,’”
translation:
  language: zh_hans
  text: 他对他们说[a]：“你们中间谁有个朋友，会在半夜到他那里去，对他说：‘朋友，请借给我三个饼，’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文也可较直译为：“你们中间谁会有一个朋友，又会在半夜到他那里去……”原文在这个反问中使用将来时形式。
    reason: 说明希腊文将来时形式及其另一种较直译的表达，避免把自然汉语译法误认为原文没有时态色彩。
lexical_decisions:
- source_word: Τίς ἐξ ὑμῶν
  choice: 你们中间谁
  rationale: 自然、直接地引出面向听众的反问，保留原文的挑战语气。
- source_word: ἕξει
  choice: 有
  rationale: 原文为将来时，但在这一反问式设例中，现代汉语用“有”更自然；原文形式上的将来意义在脚注中说明。
- source_word: φίλον / Φίλε
  choice: 朋友
  rationale: 前后均译作“朋友”，保留希腊文的词语重复，并符合现代汉语的日常称呼。
- source_word: πορεύσεται πρὸς αὐτόν
  choice: 会……去找他
  rationale: “会”承接假设性反问，“去找他”自然表达前往朋友那里这一动作，且不增添原文没有的细节。
- source_word: μεσονυκτίου
  choice: 在半夜
  rationale: 直接表达作时间状语的属格，符合现代汉语习惯。
- source_word: εἴπῃ αὐτῷ
  choice: 对他说
  rationale: 贴近 λέγω 的基本含义，并自然引出直接引语。
- source_word: χρῆσόν μοι
  choice: 请借给我
  rationale: 该命令式在语境中是请求对方暂时给出食物；加入“请”符合汉语请求方式，并未削弱命令式所表达的直接请求。
- source_word: τρεῖς ἄρτους
  choice: 三个饼
  rationale: ἄρτος 指可计数的饼或面包；“三个饼”在汉语圣经语境中简洁自然，也保留数量单位。
