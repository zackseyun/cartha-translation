source:
  edition: SBLGNT
  text: ἄνδρες ⸀Νινευῖται ἀναστήσονται ἐν τῇ κρίσει μετὰ τῆς γενεᾶς ταύτης καὶ κατακρινοῦσιν αὐτήν· ὅτι μετενόησαν εἰς τὸ κήρυγμα Ἰωνᾶ, καὶ ἰδοὺ πλεῖον Ἰωνᾶ ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/032.yaml
  text: The men of Nineveh will rise up in the judgment with this generation and will condemn it[a], because they repented at the proclamation of Jonah, and behold, something greater than Jonah is here.
translation:
  language: zh_hans
  text: 在审判的时候，尼尼微人要同这一代人一同起来，并且要定这一代人的罪，因为他们因约拿的宣告而悔改了。看哪，这里有比约拿更大的[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“这里有一位比约拿更大的”或“这里有比约拿更多的”。希腊文使用中性形式，直译为“更大的／更多的”，可能广泛指耶稣及其事工中临到的更大现实，而不只是单纯人物之间的比较。
    reason: alternative_reading
lexical_decisions:
- source_word: ἄνδρες Νινευῖται
  choice: 尼尼微人
  rationale: 原文明确指尼尼微的男子；现代汉语“尼尼微人”自然简洁，在此复数群体语境中可涵盖原文所指，而不生硬添加“男人们”。
- source_word: ἀναστήσονται
  choice: 要……起来
  rationale: 保留“起来”的具体意象及将来时语气；审判语境暗含末后的复起，但正文不额外明确为“复活”。
- source_word: ἐν τῇ κρίσει
  choice: 在审判的时候
  rationale: 自然表达在审判这一事件或场合中，避免将 κρίσις 缩窄为“定罪”。
- source_word: μετὰ τῆς γενεᾶς ταύτης
  choice: 同这一代人
  rationale: 保留 μετά 的共同、伴随关系，也保留“这一代人”的历史与道德指向。
- source_word: κατακρινοῦσιν αὐτήν
  choice: 定这一代人的罪
  rationale: κατακρίνω 表示定罪而非一般判断；重复先行词比汉语代词“它”更清楚自然。
- source_word: μετενόησαν
  choice: 悔改了
  rationale: 在先知宣告的语境中表示道德和属灵上的转变，“悔改”准确而通行。
- source_word: εἰς τὸ κήρυγμα Ἰωνᾶ
  choice: 听了约拿的宣告就
  rationale: 以自然汉语表达他们因约拿的宣告而作出回应；“宣告”保留 κήρυγμα 的公开传讲意味。
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留引人郑重注意的修辞功能。
- source_word: πλεῖον Ἰωνᾶ ὧδε
  choice: 这里有比约拿更大的
  rationale: 采用不补出“人”或“事”的省略式汉语，尽量保存中性 πλεῖον 的开放性，既可指向耶稣本人，也不排除在他及其事工中临到的更大现实。
theological_decisions:
- issue: πλεῖον Ἰωνᾶ 的所指和范围
  choice: 这里有比约拿更大的
  alternative: 这里有一位比约拿更大的人；这里有比约拿更大的事
  rationale: 希腊文 πλεῖον 为中性单数。正文不擅自补入“一位”或“事”，从而保留其张力：所指显然与耶稣有关，却可能不限于单纯的人物比较，也可涵盖借着他和他的事工临到的更大现实。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“起来”与“看哪”保留经文的审判意象和郑重语气；末句刻意不补明名词，以保存原文的语法开放性。
