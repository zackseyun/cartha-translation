  text: ὁ δὲ εἶπεν· Καὶ ὑμῖν τοῖς νομικοῖς οὐαί, ὅτι φορτίζετε τοὺς ἀνθρώπους φορτία δυσβάστακτα, καὶ αὐτοὶ ἑνὶ τῶν δακτύλων ὑμῶν οὐ προσψαύετε τοῖς φορτίοις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/046.yaml
  text: But he said[a], “Woe also to you lawyers, because you load people with burdens hard to bear[b], and you yourselves do not touch the burdens with one of your fingers.”
translation:
  language: zh_hans
  text: 他却说：“你们这些律法师[a]也有祸了！因为你们把难以承受的重担压在人身上，自己却连一根指头也不碰这些重担[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “律法师”指精通并解释犹太律法的人；也可译作“律法专家”。
    reason: lexical_alternative
  - marker: b
    text: “连一根指头也不碰这些重担”强调他们对自己加给别人的重担丝毫不肯沾手；这句话也可理解为他们完全不肯帮助别人承担。
    reason: ambiguity
lexical_decisions:
- source_word: νομικοῖς
  choice: 律法师
  rationale: 这里指精通并解释犹太律法的人，并非现代意义上的世俗律师。“律法师”简洁地保留了其宗教与法律背景。
- source_word: οὐαί
  choice: 有祸了
  rationale: 保留先知式警告和审判宣告的力度，比单纯表达悲叹更符合本段语境。
- source_word: φορτίζετε
  choice: 把……重担压在……身上
  rationale: 保留“装载、加负担”的具体意象，同时符合现代汉语表达。
- source_word: ἀνθρώπους
  choice: 人
  rationale: 原词泛指人们，并不限定男性；“人”在此自然且准确。
- source_word: φορτία δυσβάστακτα
  choice: 难以承受的重担
  rationale: 表达这些担子很难承担，但不夸大为绝对无法承担。
- source_word: αὐτοὶ
  choice: 自己却
  rationale: 体现原文代词的强调作用，以及律法师与被加重担之人之间的鲜明对比。
- source_word: ἑνὶ τῶν δακτύλων ὑμῶν οὐ προσψαύετε
  choice: 连一根指头也不碰
  rationale: 保留原文具体而强烈的比喻，强调他们丝毫不肯参与或相助，而不在正文中把含义完全解释出来。
- source_word: Καὶ ὑμῖν
  choice: 你们……也
  rationale: 保留 καί 的附加意味：在前述对象之外，灾祸同样临到律法师。
theological_decisions:
- issue: νομικοῖς所指的身份
  choice: 译为“律法师”，指犹太律法的专家
  alternative: 律法专家；法律学者；经学家
  rationale: “律法师”既区别于现代律师，也避免把他们直接等同于并非处处完全同义的“经学家”。
- issue: 末句的含义
  choice: 保留“连一根指头也不碰这些重担”的具体比喻
  alternative: 你们根本不肯帮助别人承担；你们自己一点也不实行
  rationale: 原文明确说“不碰重担”，其具体所指可能包括不愿相助，也可能暗含自身不承担所加的要求；直译可保留这层张力，避免只锁定一种解释。
- issue: οὐαί的语气
  choice: 译为“有祸了”
  alternative: 可悲啊；祸哉
  rationale: 这是带有审判意味的严厉宣告；“有祸了”既保留力度，也比“祸哉”更符合现代普通读者的语言习惯。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“有祸了”保留警告与审判的语气；“把……重担压在……身上”和“连一根指头也不碰”延续原文的负重意象。脚注标记均置于正文对应位置。
