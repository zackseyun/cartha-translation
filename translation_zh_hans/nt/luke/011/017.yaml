revisions:
- from: 耶稣知道他们心里的想法，就对他们说：“凡自相纷争的国，必遭毁灭；一家与一家相争，也必倾覆。[a]”
  to: 耶稣知道他们的心思，就对他们说：“凡自相纷争的国，必遭毁灭；房屋倒在房屋上。[a]”
  rationale: 修订保留 εἰδὼς、διανοήματα、πᾶσα、ἐφ’ ἑαυτὴν διαμερισθεῖσα 和 ἐρημοῦται 的格言性表达。尤其将第二分句恢复为“房屋倒在房屋上”，使 πίπτει 的倒下意象及 ἐπὶ 的空间关系可见，而不把可能的社会性应用或内部冲突加入正文。脚注提供“家户／家庭”的词义可能，但不将其定为唯一解释。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T03:21:05Z'
