  verdict: revise
  source_fidelity: 首句基本忠实，但第二分句将“房屋（或家户）倒在房屋（或家户）上”的压缩意象改写为“一家与一家相争，也必倾覆”，加入了原文未明说的“相争”、额外的结果性“必”，并删去了 πίπτει（倒下）及 ἐπὶ（在……上）的具体表达。应在正文保留原文的简练和歧义。
  naturalness: “耶稣知道他们心里的想法”及首句格言体自然。修订后的“房屋倒在房屋上”虽保留原文刻意压缩的表达，现代汉语仍可理解；以脚注说明“房屋／家户”的词义选择和另一种关系性理解。
  terminology: “心思”能准确对应 διανοήματα，较“心里的想法”更凝练。“自相纷争”“必遭毁灭”适合本节庄重、格言性的语体。οἶκος 不宜在正文直接限定为“家”或“家庭”，因为其物理房屋含义同样存在。
  issues:
  - severity: high
    issue: 第二分句改写并增添了原文没有明确表达的冲突和必然结果。
    rationale: οἶκος ἐπὶ οἶκον πίπτει 直陈“房屋／家户倒在房屋／家户上”；“一家与一家相争，也必倾覆”将 ἐπὶ 释作“相争”，又将 πίπτει 的倒下意象改为“倾覆”，且添入“也必”。这没有保留原文的词义与句法歧义。
  - severity: medium
    issue: 脚注虽提及房屋的可能性，却不能补偿正文对具体意象的删除。
    rationale: 在歧义处，正文不应选择一个较强的关系性释义并额外扩展含义；应采用较字面的“房屋”，并在脚注提供“家户／家庭”的可能读法。
