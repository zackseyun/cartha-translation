  text: αὐτὸς δὲ εἰδὼς αὐτῶν τὰ διανοήματα εἶπεν αὐτοῖς· Πᾶσα βασιλεία ἐφ’ ἑαυτὴν διαμερισθεῖσα ἐρημοῦται, καὶ οἶκος ἐπὶ οἶκον πίπτει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/017.yaml
  text: But he[a], knowing their thoughts, said to them, “Every kingdom divided against itself is laid waste, and a house falls upon a house.”
translation:
  language: zh_hans
  text: 耶稣知道他们的心思，就对他们说：“凡自相纷争的国，必遭毁灭；房屋倒在房屋上。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “房屋”所译的希腊词 οἶκος 也可指“家户”或“家庭”。本句的压缩表达也可理解为“一家倒在另一家之上”。
    reason: 保留 οἶκος 的“房屋／家户”词义歧义，以及 οἶκος ἐπὶ οἶκον πίπτει 的简练、可有不同理解的句法意象。
lexical_decisions:
- source_word: εἰδὼς
  choice: 知道
  rationale: 该分词在此表示认知和觉察；“知道”自然清楚，并保留其与主句“说”的逻辑关系。
- source_word: διανοήματα
  choice: 心里的想法
  rationale: 指内在的思想或盘算；加入“心里的”符合现代汉语表达，又不把敌意或动机说得过于明确。
- source_word: Πᾶσα βασιλεία
  choice: 凡……的国
  rationale: 表达普遍性的格言，保留 πᾶσα 的周遍含义，同时比逐字译作“每一个国”更自然。
- source_word: ἐφ’ ἑαυτὴν διαμερισθεῖσα
  choice: 自相纷争
  rationale: 此处不是单指被划分，而是内部彼此对立；“自相纷争”准确、凝练，也符合格言语体。
- source_word: ἐρημοῦται
  choice: 必遭毁灭
  rationale: 该动词表示变得荒废、遭到毁坏；“遭毁灭”保留被动结果和严重程度，“必”体现格言中陈述的必然结果。
- source_word: οἶκος ἐπὶ οἶκον
  choice: 一家与一家相争
  rationale: οἶκος 可指房屋，也可指家庭或家族；此处压缩结构与前句的内部对立相呼应。在汉语中直译“房屋倒在房屋上”含义晦涩，故正文采用关系性的“一家与一家相争”，并以脚注保留实体房屋的可能意象。
- source_word: πίπτει
  choice: 必倾覆
  rationale: πίπτει 本义为“倒下”，在国与家的格言语境中“倾覆”既保留倒塌意象，也自然表达败落的结果。
theological_decisions:
- issue: 第二分句中 οἶκος 的含义及 ἐπὶ 所表达的关系
  choice: 正文译作“一家与一家相争，也必倾覆”
  alternative: “一座房屋倒在另一座房屋上”或“一家倾覆在另一家之上”
  rationale: 希腊文 οἶκος 同时可指实体房屋和家庭，ἐπὶ οἶκον 的压缩表达也容许不同理解。正文按上下文的内部分争来表达关系意义，但不将歧义静默消除，脚注保留实体房屋及较直译读法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“自相纷争”“遭毁灭”“倾覆”保持格言的凝练力度。主语明确为“耶稣”，避免汉语中单用“他”可能产生指代不清；脚注标记置于相关句末。
