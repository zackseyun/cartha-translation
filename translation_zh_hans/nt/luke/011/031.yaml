id: LUK.11.31
reference: Luke 11:31
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: βασίλισσα νότου ἐγερθήσεται ἐν τῇ κρίσει μετὰ τῶν ἀνδρῶν τῆς γενεᾶς ταύτης καὶ κατακρινεῖ αὐτούς· ὅτι ἦλθεν ἐκ τῶν περάτων τῆς γῆς ἀκοῦσαι τὴν σοφίαν Σολομῶνος, καὶ ἰδοὺ πλεῖον Σολομῶνος ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/031.yaml
  text: The queen of the South will rise up in the judgment with the men of this generation and will condemn them[a], because she came from the ends of the earth to hear the wisdom of Solomon, and behold[b], something greater than Solomon is here.
translation:
  language: zh_hans
  text: 南方的女王在审判时要和这一代的男人一同起来，并且要定他们的罪[a]；因为她从地极而来，要听所罗门的智慧。看哪[b]，这里有比所罗门更大的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 通常认为这位女王就是示巴女王（见《列王纪上》10:1—13；《历代志下》9:1—12）。
    reason: cross_reference
  - marker: b
    text: 或译：“这里有一位比所罗门更大的。”希腊文使用中性表达，直译为“比所罗门更大的事物”，所强调的可能不只是人物之间的直接比较。
    reason: lexical_alternative
lexical_decisions:
- source_word: βασίλισσα νότου
  choice: 南方的女王
  rationale: 按希腊文属格结构直译，保留旧约典故，却不在正文中直接将她认定为示巴女王。
- source_word: ἐγερθήσεται
  choice: 要……起来
  rationale: 既符合审判场景中起身作证或出现的含义，也保留末世复活的可能回响，而不将其说死。
- source_word: ἐν τῇ κρίσει
  choice: 在审判时
  rationale: 定冠词指向特定的末世审判；汉语用“在审判时”自然且明确。
- source_word: μετὰ τῶν ἀνδρῶν
  choice: 和……男人一同
  rationale: ἀνδρῶν明确为阳性复数“男人”，故不泛化为“人”。
- source_word: τῆς γενεᾶς ταύτης
  choice: 这一代
  rationale: 在对观福音语境中通常指耶稣当代的人；“这一代”准确而自然。
- source_word: κατακρινεῖ αὐτούς
  choice: 定他们的罪
  rationale: κατακρίνω表示谴责、判定有罪，语气强于一般的“审判”。
- source_word: ἐκ τῶν περάτων τῆς γῆς
  choice: 从地极
  rationale: 这是表示极遥远之地的惯用语；“地极”简洁庄重，并保留原文意象。
- source_word: ἀκοῦσαι
  choice: 要听
  rationale: 不定式表达她前来的目的；“要听”符合现代汉语叙述。
- source_word: τὴν σοφίαν Σολομῶνος
  choice: 所罗门的智慧
  rationale: 自然表达希腊文属格关系，并保留“智慧”作为她寻求的对象。
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留引人注意并突出高潮陈述的庄重话语功能。
- source_word: πλεῖον Σολομῶνος
  choice: 比所罗门更大的
  rationale: 原文πλεῖον为中性形式；不译成明确指人的“有一位”，从而保留可指更广大现实的语法与神学张力。
- source_word: ὧδε
  choice: 这里有
  rationale: 自然表达某事物就在此处、已经临在的意思。
theological_decisions:
- issue: 是否在正文中明确女王就是示巴女王
  choice: 保留“南方的女王”
  alternative: 示巴女王
  rationale: 旧约典故十分明确，但希腊正文写的是“南方的女王”；正文保留原词，脚注说明通常认定的身份。
- issue: 是否把πλεῖον Σολομῶνος人格化
  choice: 译作“比所罗门更大的”
  alternative: 比所罗门更大的一位
  rationale: 希腊文使用中性形式，可能强调在耶稣及其事工、国度或信息中临在的整体实在，而不只作人物之间的直接比较；译文不消解这种张力。
- issue: 是否把ἐγερθήσεται明确译成复活
  choice: 译作“要……起来”
  alternative: 要复活
  rationale: 末世审判语境可使该动词带有复活意味，但它也可指在审判中起身或出现；因此不作过度限定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“地极”“看哪”保留经文的修辞力度；整体语序略作汉语化，同时紧贴希腊文的司法场景、性别用词及中性比较表达。
