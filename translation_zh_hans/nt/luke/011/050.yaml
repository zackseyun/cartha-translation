source:
  edition: SBLGNT
  text: ἵνα ἐκζητηθῇ τὸ αἷμα πάντων τῶν προφητῶν τὸ ἐκκεχυμένον ἀπὸ καταβολῆς κόσμου ἀπὸ τῆς γενεᾶς ταύτης,
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/050.yaml
  text: so that the blood of all the prophets[a], shed from the foundation of the world, may be required of this generation,
translation:
  language: zh_hans
  text: 好叫这世代为自创世以来所流的所有先知的血受到追究[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使这世代为自创世以来所流的所有先知的血负责。”这里的动词含有因流血而被追究责任的司法意味。
    reason: 说明ἐκζητηθῇ的被动司法问责含义，并提供自然、完整的汉语替代表达。
lexical_decisions:
- source_word: ἵνα
  choice: 好叫
  rationale: 承接上文，引出目的或结果；“好叫”既保留希腊语的目的性，也适合庄重而自然的现代汉语。
- source_word: ἐκζητηθῇ
  choice: 追讨
  rationale: 此处为被动虚拟式，在流血罪的语境中带有司法追责、要求偿付的意味。“追讨”保留了神追究流血责任的力度，又没有把具体惩罚方式说死。
- source_word: τὸ αἷμα
  choice: 血
  rationale: 保留原文的具体意象；这里的“血”也以转喻方式指先知被杀所带来的流血罪责。
- source_word: πάντων τῶν προφητῶν
  choice: 众先知
  rationale: “众”自然表达 πάντων 的全面范围，说明所有先知都包括在内。
- source_word: τὸ ἐκκεχυμένον
  choice: 所流的
  rationale: 这是修饰“血”的完成时被动分词；汉语“所流的血”自然表达已经发生的流血杀害。
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: 创世以来
  rationale: 准确传达“从世界奠基之时起”的惯用意义，比逐字译作“从世界奠基”更符合现代汉语。
- source_word: ἀπὸ τῆς γενεᾶς ταύτης
  choice: 向这世代
  rationale: 与“追讨”搭配，清楚表明追责所针对的对象，同时保留原文 ἀπό 所表示的责任来源。
theological_decisions:
- issue: 众先知之血被“追讨”的性质
  choice: 译为神向“这世代”追究历代杀害先知的流血责任
  alternative: 仅视为这一世代延续历史上拒绝先知的修辞性描述，不强调司法追责
  rationale: ἐκζητέω 在流血语境中自然带有追究、问责的司法意味；译文保留这种力度，但不进一步界定群体罪责如何归算或惩罚。
- issue: ἵνα 所表达的逻辑关系
  choice: 用“好叫”保留目的兼结果的张力
  alternative: 明确译成单纯目的“为要”或单纯结果“以致”
  rationale: 此处可由上文引出目的或所导致的结果；“好叫”不必过早排除其中一面。
translation_notes:
  register: 采用庄重、简洁而易懂的现代标准汉语。“创世以来众先知所流的血”维持原文的血这一具体意象；“向这世代追讨”保留司法追责意味和原文的神学张力。
