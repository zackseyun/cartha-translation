revisions:
- from: 好叫创世以来众先知所流的血，都向这世代追讨[a]。
  to: 好叫这世代为自创世以来所流的所有先知的血受到追究[a]。
  rationale: 修订将“血”的所属者和“所流”的关系表达得更清楚，并以“这世代为……受到追究”自然再现原文被动式所指的司法问责。保留“好叫”所容纳的目的／结果张力，未规定追究的施事、方式或群体责任的具体理论。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T03:21:13Z'
review_pass:
  verdict: revise
  source_fidelity: 原译保留了ἵνα的目的／结果关系、众先知、创世以来、流血及向这世代问责等主要成分。但“众先知所流的血”在现代汉语中可被理解为“先知所流出（使人流）的血”，未能清楚表达原文“先知的血、即被流的血”；“血，都向这世代追讨”也未清楚呈现被动式的问责对象。
  naturalness: “好叫创世以来众先知所流的血，都向这世代追讨”以“血”为“追讨”的施事，现代汉语搭配不自然，且“都”与无明确施事的“向……追讨”形成悬置。改为“这世代为……受到追究”可自然表达汉语的司法问责，同时不指定施事或惩罚方式。
  terminology: “世代”“创世以来”“先知”均合适。以“受到追究”表达ἐκζητηθῇ的被动司法问责，比“追讨”更符合本句的汉语句法；不添加“血债”或具体的归罪机制，以保留原文的表达范围。
  issues:
  - severity: medium
    issue: “众先知所流的血”存在施事歧义。
    rationale: 该短语可理解为先知所流出之血，而希腊文是“所有先知的、被流的血”。调整语序为“所流的所有先知的血”，使“先知”明确为“血”的所属者。
  - severity: medium
    issue: “血，都向这世代追讨”不符合现代汉语的自然搭配，且被动问责关系不够明确。
    rationale: 原文ἐκζητηθῇ为被动式，配合ἀπὸ τῆς γενεᾶς ταύτης指向由这世代承担的追究。译作“这世代为……受到追究”清楚而不增添具体审判细节。
  - severity: low
    issue: 脚注的“都要从这世代追究”缺少清楚的受追究事项，且“从……追究”搭配生硬。
    rationale: 脚注应提供完整、可读的替代表达，并说明该动词的问责含义。
  revised_text: 好叫这世代为自创世以来所流的所有先知的血受到追究[a]。
  revised_footnotes:
  - marker: a
    text: 或译：“使这世代为自创世以来所流的所有先知的血负责。”这里的动词含有因流血而被追究责任的司法意味。
    reason: 说明ἐκζητηθῇ的被动司法问责含义，并提供自然、完整的汉语替代表达。
  revision_rationale: 修订将“血”的所属者和“所流”的关系表达得更清楚，并以“这世代为……受到追究”自然再现原文被动式所指的司法问责。保留“好叫”所容纳的目的／结果张力，未规定追究的施事、方式或群体责任的具体理论。
