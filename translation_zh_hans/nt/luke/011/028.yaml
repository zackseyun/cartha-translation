base_translation:
  language: en
  yaml_path: translation/nt/luke/011/028.yaml
  text: But he said[a], “Rather, blessed are those who hear the word of God and keep it.”
translation:
  language: zh_hans
  text: 耶稣却说：“更确切地说[a]，听见上帝的话并遵守的人有福了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“其实，……的人有福了。”也可译：“是的，更确切地说，……的人有福了。”希腊语这个词既可表示肯定，也可转移或修正重点。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μενοῦν
  choice: 更确切地说
  rationale: 此语气词既可表示肯定，也可转移或修正重点。这里承接上一节妇人的称颂，把焦点转向听见并遵守上帝的话；“更确切地说”避免表达成生硬的全盘否定。
- source_word: μακάριοι
  choice: 有福的
  rationale: 保留耶稣福言中属灵及神学层面的分量，不缩减为主观的“快乐”或境遇上的“幸运”。
- source_word: οἱ ἀκούοντες
  choice: 那些听见……的人
  rationale: 现在分词名词化，指以听见上帝的话为特征的一类人；这一译法自然，并保留其持续或惯常意味。
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: 上帝的话
  rationale: λόγος在此指上帝所说的信息或启示；“上帝的话”准确、自然，也保留较宽的语义范围。
- source_word: φυλάσσοντες
  choice: 遵守
  rationale: φυλάσσω可指守护、持守或遵行；本处与听见上帝的话并列，重在将其谨守并付诸实行。“遵守”清楚表达顺服实践，同时未将其局限为守规条。
- source_word: αὐτὸς δὲ εἶπεν
  choice: 耶稣却说
  rationale: αὐτός按上下文明确为耶稣；δέ在此带轻微转折，显示他回应并调整上一句话的重点。“却说”简洁保留这一关系。
theological_decisions:
- issue: 耶稣对妇人称颂的回应力度
  choice: 耶稣不必然否定妇人的话，而是把重点转向更根本的福分：听见并遵守上帝的话。
  alternative: 耶稣彻底否定妇人的称颂；或只是毫无修正地另加一种福分。
  rationale: μενοῦν兼有肯定与转折、强化的可能，原文没有要求把回应理解为断然反驳。“更确切地说”保留这种张力，不替文本排除肯定兼重定焦点的读法。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“才是”突出原文所重定的焦点，但与脚注共同保留μενοῦν既肯定又修正重点的歧义。
