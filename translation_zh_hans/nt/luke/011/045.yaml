base_translation:
  language: en
  yaml_path: translation/nt/luke/011/045.yaml
  text: Then one of the lawyers answered and said to him[a], “Teacher[b], in saying these things you insult us also.”
translation:
  language: zh_hans
  text: 有一个律法师[a]回答他，说：“老师，你这样说，也是在侮辱[b]我们。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “律法师”指熟悉犹太律法的专家，并不一定是现代职业意义上的律师。
    reason: lexical_alternative
  - marker: b
    text: “侮辱”也可译作“轻蔑地对待”；原文所表达的不只是使人感到被冒犯，也可包含羞辱人的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀποκριθεὶς δέ
  choice: 回应
  rationale: 不定过去时分词在叙事中引出答话；译作“回应”自然地表达承接前言的作用。δέ仅表示轻微推进，汉语无需另加明显转折词。
- source_word: τις τῶν νομικῶν
  choice: 其中一个律法师
  rationale: νομικός在此指熟悉并讲解犹太律法的专家，而非现代职业意义上的律师；“律法师”简洁并符合经文语境。
- source_word: λέγει αὐτῷ
  choice: 对他说
  rationale: 原文使用历史现在时，现代汉语叙事可自然译为“说”；“对他”保留αὐτῷ所指，却不在本节内擅自补明姓名。
- source_word: Διδάσκαλε
  choice: 老师
  rationale: 这是对διδάσκαλος自然、当代的称呼，表达教导者身份。
- source_word: ταῦτα λέγων
  choice: 你这样说
  rationale: 简洁呈现同时发生的分词结构，指向对方刚才所说的那些话。
- source_word: καὶ ἡμᾶς
  choice: 也……我们
  rationale: 保留καί的附加意味，表示说话者认为自己所属的群体也包括在受辱者之中。
- source_word: ὑβρίζεις
  choice: 是在侮辱
  rationale: ὑβρίζω在此表示以言语羞辱或轻蔑相待，比仅仅“冒犯”更强；“是在”使当面的指责在汉语中自然有力。
