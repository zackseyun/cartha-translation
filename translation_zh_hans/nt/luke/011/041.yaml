  text: πλὴν τὰ ἐνόντα δότε ἐλεημοσύνην, καὶ ἰδοὺ πάντα καθαρὰ ὑμῖν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/041.yaml
  text: But give as alms the things that are within[a], and behold, everything is clean for you.
translation:
  language: zh_hans
  text: 不过，你们要把里面的东西施舍出去[a]；看哪，一切对你们就都洁净了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们要把手头所有的财物施舍出去。”希腊语这个短语既可指“里面的东西”，也可指手头拥有的财物。
    reason: alternative_reading
lexical_decisions:
- source_word: πλὴν
  choice: 不过
  rationale: 承接上文对只洁净外面的责备，并引出纠正性的转折；“不过”自然、简洁，也保留了原文的对比作用。
- source_word: τὰ ἐνόντα
  choice: 里面的东西
  rationale: 原文直指“在里面的事物”，与上文杯盘外面和里面的对比紧密呼应；同时保留其具体所指并不完全明确的特点，不在正文中擅自限定为内心品德或财物。
- source_word: δότε
  choice: 施舍出去
  rationale: δότε是命令式；结合ἐλεημοσύνην译作“施舍出去”，在现代汉语中自然地表达实际给予的行动，又不额外指定受赠者。
- source_word: ἐλεημοσύνην
  choice: 施舍
  rationale: 该词在此指周济性质的给予。“施舍”准确而通俗；不直接译成“给穷人”，因为原文没有明说对象。
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留原文唤起注意并强调结果的修辞力量；语体稍庄重，但在经文中清楚易懂。
- source_word: πάντα
  choice: 一切
  rationale: 保留中性复数的全面含义，不把范围缩窄为某一类物品或行为。
- source_word: καθαρὰ
  choice: 洁净
  rationale: 与上文关于洗净杯盘及礼仪洁净的讨论保持词义联系；“洁净”也容许其道德与礼仪层面的张力。
- source_word: ὑμῖν
  choice: 对你们
  rationale: 将与格理解为关联范围，即“一切就你们而言是洁净的”；“对你们”是自然且准确的现代汉语表达。
theological_decisions:
- issue: τὰ ἐνόντα与施舍及洁净之间的关系
  choice: 正文译为“里面的东西”，保留与上文内外对比相连的内在含义
  alternative: “你们所有的”，指手头拥有的财物
  rationale: 紧邻的上下文以杯盘的外面和里面作对比，因此正文保留“里面”的措辞最能呈现耶稣责备的修辞力量。但原短语也可能指人现有的财物，故以脚注保留该重要异读，不把经文的神学张力化约为单一解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”有意保留经文的强调语气；“里面的东西”虽略带开放性，却忠实反映原文的歧义，并由脚注说明另一种主要理解。
