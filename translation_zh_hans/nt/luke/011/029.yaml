id: LUK.11.29
reference: Luke 11:29
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Τῶν δὲ ὄχλων ἐπαθροιζομένων ἤρξατο λέγειν· Ἡ γενεὰ αὕτη ⸀γενεὰ πονηρά ἐστιν· σημεῖον ⸀ζητεῖ, καὶ σημεῖον οὐ δοθήσεται αὐτῇ εἰ μὴ τὸ σημεῖον ⸀Ἰωνᾶ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/029.yaml
  text: As the crowds were gathering[a], he began to say, “This generation is an evil generation. It seeks a sign[b], and no sign will be given to it except the sign of Jonah.”
translation:
  language: zh_hans
  text: 众人聚集过来时[a]，他开始说：“这一代人是邪恶的一代。他们寻求神迹，但除了约拿的神迹[b]以外，再没有神迹会赐给他们。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“众人越聚越多时”。
    reason: lexical_alternative
  - marker: b
    text: “约拿的神迹”可能指约拿本人借着先知使命成为神迹；结合其他福音书的平行经文，也可能使人联想到耶稣的受死与复活。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπαθροιζομένων
  choice: 聚集过来时
  rationale: 现在时分词属格独立结构表示与主句同时进行的动作；“聚集过来时”自然地表达众人正在汇集，也不排除人数不断增加的意味。
- source_word: ἤρξατο λέγειν
  choice: 开始说
  rationale: 保留希腊文起始体结构的语气，不擅自理解为反复讲论。
- source_word: γενεά
  choice: 一代人
  rationale: 既保留世代含义，也比把人群称作抽象的“世代”更符合现代汉语；此处仍呈现对同时代群体的整体评价。
- source_word: πονηρά
  choice: 邪恶
  rationale: 直接表达道德上的负面判断，不削弱耶稣责备的力度。
- source_word: σημεῖον
  choice: 神迹
  rationale: 在此语境中指人所寻求、用来印证身份或使命的超常记号；“神迹”是现代中文圣经语境中自然且易懂的表达。
- source_word: ζητεῖ
  choice: 寻求
  rationale: 贴近该动词的基本义，不把上下文隐含的强求态度直接强化为“索要”或“要求”。
- source_word: δοθήσεται
  choice: 会赐给
  rationale: 表达将来时被动态，并以“赐给”体现神迹来自上帝的语境含义。
- source_word: εἰ μὴ
  choice: 除了……以外
  rationale: 在否定句中准确表达排除中的唯一例外。
- source_word: τὸ σημεῖον Ἰωνᾶ
  choice: 约拿的神迹
  rationale: 保留属格结构的开放性，不在正文中限定为约拿本人、他的宣讲使命，或对耶稣受死与复活的预表。
theological_decisions:
- issue: “这一代人”所受责备的范围
  choice: 保留对耶稣同时代群体的整体道德评价
  alternative: 仅指当场某些敌对者
  rationale: 原文重复使用 γενεά，形成广泛而有力的群体性责备；译文不把所指范围擅自缩小。
- issue: “约拿的神迹”的含义
  choice: 正文保留开放的属格表达
  alternative: 明确解释为约拿的先知使命，或明确解释为耶稣的受死与复活
  rationale: 路加紧接的上下文着重说明约拿对尼尼微人的意义，而其他福音书平行经文又可能唤起受死与复活的预表联系；正文不提前消除这种解释张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“这一代人……他们”自然呈现 γενεά 的群体意义；句式保留原文从群众聚集转入耶稣宣告的推进。
