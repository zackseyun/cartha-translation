id: LUK.11.1
reference: Luke 11:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ εἶναι αὐτὸν ἐν τόπῳ τινὶ προσευχόμενον, ὡς ἐπαύσατο, εἶπέν τις τῶν μαθητῶν αὐτοῦ πρὸς αὐτόν· Κύριε, δίδαξον ἡμᾶς προσεύχεσθαι, καθὼς καὶ Ἰωάννης ἐδίδαξεν τοὺς μαθητὰς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/001.yaml
  text: And it happened that while he was praying in a certain place, when he stopped, one of his disciples said to him, “Lord, teach us to pray, just as John also taught his disciples.”
translation:
  language: zh_hans
  text: 有一次，耶稣在某个地方祷告。他停下来以后，有一个门徒对他说：“主啊，请教导我们祷告，就像约翰也教导他的门徒一样。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: 有一次
  rationale: 这是路加常用的叙事引入语。译作“有一次”既自然地开启事件，又避免仿古的“事情发生了”。
- source_word: ἐν τῷ εἶναι αὐτὸν ... προσευχόμενον
  choice: 耶稣……祷告
  rationale: 该结构表达与主句背景同时进行的动作；结合下文“停下来以后”，中文分句可自然呈现其持续过程。明说“耶稣”可避免汉语中代词指向不清。
- source_word: ἐν τόπῳ τινὶ
  choice: 在某个地方
  rationale: 保留地点未具体说明的特征，也符合现代汉语表达。
- source_word: ὡς ἐπαύσατο
  choice: 他停下来以后
  rationale: ἐπαύσατο直指停止先前的动作。译作“停下来”保留了比“祷告完了”更为宽泛的原文措辞。
- source_word: τις τῶν μαθητῶν αὐτοῦ
  choice: 有一个门徒
  rationale: 自然表达部分结构，即门徒中的一人；上下文已清楚表明是耶稣的门徒，无须重复所属关系。
- source_word: Κύριε
  choice: 主啊
  rationale: “主”保留κύριος在尊称与基督论称号之间的语义空间；“啊”符合现代汉语直接呼语。
- source_word: δίδαξον ἡμᾶς προσεύχεσθαι
  choice: 请教导我们祷告
  rationale: 直接对应“教导我们祷告”，不增添原文没有明说的“怎样”；加入“请”自然传达祈使语境中的请求语气。
- source_word: καθὼς καὶ Ἰωάννης ἐδίδαξεν τοὺς μαθητὰς αὐτοῦ
  choice: 就像约翰也教导他的门徒一样
  rationale: “就像……一样”清楚呈现比较关系，“也”对应καί，并保留约翰曾教导自己门徒这一参照。
theological_decisions:
- issue: 对耶稣的称呼κύριος
  choice: 主
  alternative: 老师
  rationale: “主”保留该词在路加叙事中既可作尊称、又可能具有更深基督论含义的张力；“老师”会将意义过早限定为教学身份。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。将希腊语较长的从属结构拆成短句，以符合汉语叙事节奏；同时保留地点的不确定性、祷告停止的措辞，以及“主”这一称号的语义张力。
