  text: πᾶς γὰρ ὁ αἰτῶν λαμβάνει, καὶ ὁ ζητῶν εὑρίσκει, καὶ τῷ κρούοντι ἀνοιγήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/010.yaml
  text: For everyone who asks receives[a], and the one who seeks finds, and to the one who knocks it will be opened.
translation:
  language: zh_hans
  text: 因为凡祈求的，都得着；凡寻找的，都寻见；凡敲门的，门都要给他打开[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文没有明说被打开的是什么；按上下文可理解为“门”。
    reason: 说明原文省略被打开的对象；正文为使现代汉语通顺而按上下文补出“门”。
lexical_decisions:
- source_word: πᾶς
  choice: 凡……的
  rationale: 与名词化分词连用时表示逐一涵盖的普遍范围；现代汉语用“凡……的”自然地保留这一概括性。
- source_word: γὰρ
  choice: 因为
  rationale: 保留本节对前文劝勉所作的解释和论证作用。
- source_word: ὁ αἰτῶν
  choice: 祈求的
  rationale: 现在分词在此泛指持续或一贯祈求的人；结合祷告语境译作“祈求”，比一般性的“请求”更贴切。
- source_word: λαμβάνει
  choice: 得着
  rationale: 准确表达获得所求之物，并与本句庄重、凝练的格言体相称。
- source_word: ὁ ζητῶν
  choice: 寻找的
  rationale: 保留现在分词所表达的泛指性行动，不额外限定所寻找的对象。
- source_word: εὑρίσκει
  choice: 寻见
  rationale: 直接对应“寻找—找到”的关系，并与经文整齐的三联结构相配。
- source_word: τῷ κρούοντι
  choice: 敲门的……为他
  rationale: 用“为他”体现希腊语与被动动词相连的与格关系；“敲门”是现代汉语自然、清楚的表达。
- source_word: ἀνοιγήσεται
  choice: 就会为他打开
  rationale: 保留将来被动的含义，同时不在正文中明确补出希腊文省略的被打开之物。
theological_decisions:
- issue: 应许的普遍范围和力度
  choice: 按经文直译为不加限定的普遍性陈述
  alternative: 把它处理为夸张性的鼓励，或补入“按正确方式祈求”等限制
  rationale: 希腊文在祷告劝勉的语境中提出未附条件的普遍命题；译文应保留这种神学张力，不加入本节没有明说的条件。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“凡……的，就……”保留格言式三联结构；前两项用一般现在意义，末项用“会”体现希腊文将来时。正文将脚注标记置于相关末句之后。
