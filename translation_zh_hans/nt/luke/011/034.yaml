source:
  edition: SBLGNT
  text: ὁ λύχνος τοῦ σώματός ἐστιν ὁ ὀφθαλμός ⸀σου. ⸀ὅταν ὁ ὀφθαλμός σου ἁπλοῦς ᾖ, καὶ ὅλον τὸ σῶμά σου φωτεινόν ἐστιν· ἐπὰν δὲ πονηρὸς ᾖ, καὶ τὸ σῶμά σου σκοτεινόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/034.yaml
  text: The lamp of your body is your eye[a]. When your eye is healthy, your whole body also is full of light; but when it is bad[b], your body also is dark.
translation:
  language: zh_hans
  text: “你身体的灯就是你的眼睛。你的眼睛若健全[a]，你全身也就充满光明；但眼睛若不好[b]，你的身体也就黑暗。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“清明”、“单纯”或“专一”。希腊语这个词可指健全，也可含完整、不分裂的意思；这里用来形容眼睛，与“不好”的眼睛相对。
    reason: lexical_alternative
  - marker: b
    text: 或译“邪恶”。希腊语这个词既可指“不好”，也可指“邪恶”；这里可能同时暗示眼睛有缺陷和人的眼光在道德上发生扭曲。
    reason: lexical_alternative
lexical_decisions:
- source_word: λύχνος
  choice: 灯
  rationale: 原词指具体的灯或光源；译作“灯”保留身体与眼睛之间的具体比喻，而不将其抽象化为“光”。
- source_word: σῶμα
  choice: 身体／全身
  rationale: 此处以身体为比喻所作用的整体；首句译“身体”，ὅλον τὸ σῶμα译“全身”，自然地体现“整个身体”。
- source_word: ὀφθαλμός
  choice: 眼睛
  rationale: 保留身体器官的字面意义，同时让上下文所蕴含的内在洞察和道德感知继续通过比喻表达。
- source_word: ὅταν ... ᾖ / ἐπὰν δὲ ... ᾖ
  choice: 若……；但……若……
  rationale: 两个带虚拟语气的结构表达一般性的条件兼时间关系。汉语用平行的“若”简洁自然，也不把它们限定为某一次发生的情形。
- source_word: ἁπλοῦς
  choice: 健全
  rationale: 在眼睛与全身明暗的比喻中，“健全”首先传达眼睛功能正常、目光清明的意思；脚注保留“单纯、专一”等词义可能性，避免消除其道德含义。
- source_word: ὅλον τὸ σῶμά σου φωτεινόν
  choice: 你全身也就充满光明
  rationale: φωτεινός可指明亮或充满光；“充满光明”保留鲜明的光暗意象，并符合现代汉语表达。
- source_word: πονηρός
  choice: 不好
  rationale: 原词可表示坏、恶，也可在此描述有缺陷的眼睛。“不好”不把意义仅限于生理疾病，也未抹去潜在的道德意味；脚注说明另一可能。
- source_word: σκοτεινόν
  choice: 黑暗
  rationale: 直接保留与“充满光明”的对照，不额外解释这种黑暗是生理、道德还是属灵状态。
theological_decisions:
- issue: ἁπλοῦς描述眼睛时兼具功能与道德意味
  choice: 正文译作“健全”，脚注列出“清明、单纯、专一”等可能
  alternative: 正文译作“专一”、“单纯”或“慷慨”
  rationale: 眼睛作为身体之灯的直接比喻支持“健全、清明”的功能性理解，但ἁπλοῦς也可含不分裂、单纯或专一之意。正文采用现代读者容易理解的表达，脚注则保留词义张力，不将经文限定为某一种神学解释。
- issue: πονηρός在“眼睛不好”中是功能缺陷还是道德邪恶
  choice: 正文译作“不好”，脚注注明也可译“邪恶”
  alternative: 正文译作“邪恶”或“有病”
  rationale: πονηρός的语义可涵盖坏与恶；“不好”能同时容纳视力或眼睛状态不佳以及道德感知扭曲的暗示，避免单方面定论。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“你身体的灯就是你的眼睛”保留原文判断句和具体比喻；后两分句以“若……；但……若……”形成清楚对照。“充满光明／黑暗”保留原文的光暗张力。所有脚注标记均已置于正文相应词语之后。
