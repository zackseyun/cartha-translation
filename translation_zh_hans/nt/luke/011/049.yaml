revisions:
- from: 因此，神的智慧[a]也说：“我要差遣先知和使徒到他们那里去；其中一些人，他们要杀害、迫害。”
  to: 因此，神的智慧[a]也曾说：“我要差遣先知和使徒到他们那里去；他们要杀害、迫害其中的一些人。”
  rationale: 修订仅消除汉语句法歧义并改善表达。“其中的一些人”仍同时作“杀害、迫害”的对象，不暗示被杀者与受迫害者必为两组不同的人；脚注也继续不将“神的智慧”定论为任何单一所指。
