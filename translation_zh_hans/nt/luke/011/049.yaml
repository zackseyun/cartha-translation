  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: διὰ τοῦτο καὶ ἡ σοφία τοῦ θεοῦ εἶπεν· Ἀποστελῶ εἰς αὐτοὺς προφήτας καὶ ἀποστόλους, καὶ ἐξ αὐτῶν ἀποκτενοῦσιν καὶ ⸀διώξουσιν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/049.yaml
  text: For this reason also the wisdom of God said[a], ‘I will send to them prophets and apostles, and some of them they will kill and persecute,’
translation:
  language: zh_hans
  text: 因此，神的智慧[a]也曾说：“我要差遣先知和使徒到他们那里去；他们要杀害、迫害其中的一些人。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “神的智慧”可理解为神圣智慧的拟人化、神智慧的旨意，也可能是耶稣含蓄地指自己。
    reason: 保留该短语在语法、修辞和神学所指上的多重可能。
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: 因此
  rationale: 以现代汉语中自然的推论连接语表达前文所引出的因果关系。
- source_word: καὶ
  choice: 也
  rationale: 保留此处的附加意味，使“神的智慧”所说的话与前文的指控相衔接。
- source_word: ἡ σοφία τοῦ θεοῦ
  choice: 神的智慧
  rationale: 贴近希腊文属格结构，并保留其究竟是智慧的拟人化、神智慧的定旨，还是耶稣含蓄自指的开放性。
- source_word: εἶπεν
  choice: 说
  rationale: 简明、自然，不额外赋予“宣告”等较强语气。
- source_word: Ἀποστελῶ
  choice: 我要差遣
  rationale: 准确表达将来时和差派之意；“差遣”也适合先知与使徒的使命语境。
- source_word: εἰς αὐτούς
  choice: 到他们那里去
  rationale: 按差遣动词后的方向用法处理，既自然又保留“向他们而去”的意思。
- source_word: προφήτας
  choice: 先知
  rationale: 该词在圣经语境中的标准现代汉语译法。
- source_word: ἀποστόλους
  choice: 使徒
  rationale: 在路加—使徒行传语境中很可能具有相对固定的职分含义，故不泛化为“使者”。
- source_word: ἐξ αὐτῶν
  choice: 其中一些人
  rationale: 表达部分属格的意义，说明受害者是所差遣者中的一部分。
- source_word: ἀποκτενοῦσιν
  choice: 他们要杀害
  rationale: 直接传达蓄意使人死亡的含义，语气自然明确。
- source_word: διώξουσιν
  choice: 迫害
  rationale: 在与“杀害”并列的敌对语境中，指逼迫而非中性的追赶。
theological_decisions:
- issue: “神的智慧”的所指
  choice: 正文保留“神的智慧”，不明确将其等同于耶稣、圣经或某个独立位格。
  alternative: 可理解为神圣智慧的拟人化、神智慧的定旨，或耶稣的含蓄自指。
  rationale: 原文容许多种理解；透明直译能保留其神学张力，避免正文替读者作出超出文本的判定。
- issue: 杀害与迫害的对象分配
  choice: 将两个动词共同连接于“其中一些人”，不进一步区分哪些人被杀、哪些人受迫害。
  alternative: 译作“有些人要被杀害，有些人要受迫害”。
  rationale: 希腊文只在两个并列动词之前出现一次部分结构，未明说两组对象；正文不补出原文没有明确标示的分组。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“差遣”“先知”“使徒”保留熟悉的圣经用语；句式尽量自然，同时借“其中一些人，他们要……”保留原文的部分结构和主宾对照。
