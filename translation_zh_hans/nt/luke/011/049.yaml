  naturalness: “其中一些人，他们要杀害、迫害”在现代汉语中不够顺畅，且“他们要杀害、迫害”缺少明示宾语。改作“他们要杀害、迫害其中的一些人”更自然、清晰，并仍不把两个动词分派给不同对象。“曾说”贴合εἶπεν的叙事性过去时。
  terminology: “神的智慧”“差遣”“先知”“使徒”“杀害”“迫害”均为恰当、庄重而通行的圣经汉语用语。脚注将“神智慧的定旨”调整为较自然的“神智慧的旨意”，仍保留原文的多重解释空间。
