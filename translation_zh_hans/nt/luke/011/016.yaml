  text: ἕτεροι δὲ πειράζοντες σημεῖον ⸂ἐξ οὐρανοῦ ἐζήτουν παρ’ αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/016.yaml
  text: But others[a], testing him, were seeking from him a sign from heaven.
translation:
  language: zh_hans
  text: 另有一些人为了试探耶稣，向他求一个从天上来的神迹。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一个天上的神迹。”
    reason: “从天上来的”强调来源；“天上的”也可表达该短语，但在中文中可能兼指性质或类别。
lexical_decisions:
- source_word: ἕτεροι
  choice: 另有一些人
  rationale: 该词把这一群人与上文的人区别开来；“另有一些人”在现代汉语中自然地表达这种对照。
- source_word: δὲ
  choice: 另有
  rationale: δέ在此表示轻微转折或话题推进；汉语用“另有”已自然体现与前一群人的对照，无须另加“但是”。
- source_word: πειράζοντες
  choice: 为了试探耶稣
  rationale: 分词在此语境中表示带有敌意的试验；译作“为了试探”表达其目的。宾语由上下文补明为“耶稣”。
- source_word: σημεῖον
  choice: 神迹
  rationale: σημεῖον本义为具有指示意义的“记号、征兆”；在本段要求超自然凭证的语境中，“神迹”是自然且易懂的中文对应，同时不具体限定神迹的形式。
- source_word: ἐξ οὐρανοῦ
  choice: 从天上来的
  rationale: 保留ἐκ所表达的来源，说明所求神迹被要求具有天上的来源或认证。
- source_word: ἐζήτουν
  choice: 求
  rationale: 在向某人索求某物的结构中，ζητέω可自然译为“求”；希腊语未完成时的持续或反复意味可由叙事语境承载，避免生硬地译成“不断求”。
- source_word: παρ’ αὐτοῦ
  choice: 向他
  rationale: παρά加属格表示所求之物的来源；汉语“向他求”自然保留耶稣是被索求者这一关系。
theological_decisions:
- issue: 所求神迹的性质
  choice: 一个从天上来的神迹
  alternative: 一个天上的神迹
  rationale: “从天上来的”保留ἐξ οὐρανοῦ的来源含义，不进一步断定其具体形式或神学性质，也维持对方要求天上认证的叙事张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事用语。“另有一些人”衔接上文并标明群体对照；“为了试探耶稣”清楚呈现行为动机。脚注标记置于完整句末。
