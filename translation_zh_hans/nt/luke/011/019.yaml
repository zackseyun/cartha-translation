  text: εἰ δὲ ἐγὼ ἐν Βεελζεβοὺλ ἐκβάλλω τὰ δαιμόνια, οἱ υἱοὶ ὑμῶν ἐν τίνι ἐκβάλλουσιν; διὰ τοῦτο ⸂αὐτοὶ ὑμῶν κριταὶ⸃ ἔσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/019.yaml
  text: But if I cast out the demons by Beelzebul[b][a], by whom do your sons cast them out? Therefore they will be your judges.
translation:
  language: zh_hans
  text: 但若是我靠别西卜赶鬼，你们的儿子靠谁赶鬼呢？[a] 因此，他们自己要作你们的审判者。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “靠谁”也可译作“靠什么”或“靠什么能力”。
    reason: lexical_alternative
  - marker: b
    text: “他们自己”体现希腊语代词的强调；也可较简洁地译作“他们要作你们的审判者”。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: 但我若
  rationale: δέ在这里带有轻微转折，延续耶稣的反驳；“但……若”自然呈现论证中的对照。
- source_word: ἐγὼ
  choice: 我
  rationale: 保留原文显明写出的第一人称代词，使“我”与“你们的子弟”之间的对照清楚可见。
- source_word: ἐν Βεελζεβοὺλ
  choice: 靠别西卜
  rationale: 此处ἐν表示凭借的对象或能力来源；“靠”比直译“在……里”更符合现代汉语，又不必增添原文没有明说的“能力”。专名按音译作“别西卜”。
- source_word: ἐκβάλλω τὰ δαιμόνια
  choice: 赶鬼
  rationale: “赶鬼”是现代汉语中清楚而凝练的逐邪语汇，准确表达ἐκβάλλω与δαιμόνια的组合，并与后句重复的动词保持一致。
- source_word: οἱ υἱοὶ ὑμῶν
  choice: 你们的子弟
  rationale: “子弟”保留υἱοί的亲属称谓色彩，同时比“你们的儿子们”更自然；它也不强行判定这些人究竟是对方的亲生儿子、门徒还是同属群体的人。
- source_word: ἐν τίνι
  choice: 靠谁
  rationale: ἐν τίνι在这里询问施行赶鬼所凭借的对象或来源；因上文所比较的是别西卜这一有位格的对象，正文采用“靠谁”，其他可能性列入脚注。
- source_word: ἐκβάλλουσιν
  choice: 赶鬼
  rationale: 重复前句的“赶鬼”，保留原文ἐκβάλλω的词语呼应；汉语无须另加代词宾语。
- source_word: διὰ τοῦτο
  choice: 因此
  rationale: 简洁、自然地表达由前述反问引出的推论。
- source_word: αὐτοὶ ὑμῶν κριταὶ ἔσονται
  choice: 他们自己要作你们的审判者
  rationale: “他们自己”体现αὐτοί的强调作用；“要作你们的审判者”保留将来时及审判性的比喻，不把它弱化为一般性的批评。
theological_decisions:
- issue: “你们的子弟”的身份
  choice: 正文保留亲属称谓色彩，译作“你们的子弟”
  alternative: 你们的门徒／你们的同胞／你们的儿子们
  rationale: 原文只说“你们的儿子”，并未明确界定这些赶鬼者与听众的关系。译作“子弟”既符合现代汉语，也避免把可能的门徒、同胞或亲属关系固定为某一种解释。
- issue: “他们”成为审判者的含义
  choice: 保留“他们自己要作你们的审判者”
  alternative: 解释为他们的行为将证明或定罪听众
  rationale: 原文以“审判者”表达强烈的论证结果，但没有具体说明他们如何施行审判，因此正文不补入“定罪”“证明你们错误”等解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“靠……赶鬼”贴近日常可懂的宗教语境；“子弟”有意保留原文身份指称的开放性；全句保持反问与结论的论辩力度。
