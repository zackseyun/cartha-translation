base_translation:
  language: en
  yaml_path: translation/nt/luke/011/053.yaml
  text: And after he left there[a], the scribes and the Pharisees began to press him hard and to provoke him to speak about many things,
translation:
  language: zh_hans
  text: 他离开那里以后，文士和法利赛人就开始极力敌视他，并就许多事连番盘问他[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“紧紧追问他”，或“逼他即席作答”。希腊语这个动词很少见，含有咄咄逼人地诱使对方说出话来的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀκεῖθεν ἐξελθόντος αὐτοῦ
  choice: 他从那里出去以后
  rationale: 把连接词、地点副词和独立属格结构合并为自然的汉语时间—空间表达，保留“离开那里之后”的先后关系。
- source_word: γραμματεῖς
  choice: 文士
  rationale: 这是福音书语境中对该群体的通行称呼，简洁地保留其历史身份；“律法教师”虽能说明职能，却比原词更具解释性。
- source_word: Φαρισαῖοι
  choice: 法利赛人
  rationale: 采用现代中文圣经中通行的群体名称音译。
- source_word: δεινῶς ἐνέχειν
  choice: 猛烈地逼迫他
  rationale: δεινῶς强化敌意和压力，ἐνέχειν在此表示紧逼、敌对地施压；合译既传达强烈程度，也保持句子自然。
- source_word: ἀποστοματίζειν
  choice: 盘问他
  rationale: 该罕见动词在此指咄咄逼人地诱导或逼使对方当场回答。“盘问”保留敌意和套取言辞的意味，但其确切动作仍有词义上的不确定性，故以脚注列出其他可能。
- source_word: περὶ πλειόνων
  choice: 就许多事
  rationale: 这里较自然地表示涉及许多话题或事项，并非明确与先前数量作比较。
