  text: κἀκεῖνος ἔσωθεν ἀποκριθεὶς εἴπῃ· Μή μοι κόπους πάρεχε· ἤδη ἡ θύρα κέκλεισται, καὶ τὰ παιδία μου μετ’ ἐμοῦ εἰς τὴν κοίτην εἰσίν· οὐ δύναμαι ἀναστὰς δοῦναί σοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/007.yaml
  text: and he from inside answers and says, ‘Do not trouble me. The door has already been shut, and my children are with me in bed. I am not able to get up and give you anything.’
translation:
  language: zh_hans
  text: 那人从里面回答说：“别打扰我了[a]！门已经关上了[b]，我的孩子们也都跟我在床上[c]。我不能起来给你。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“别给我添麻烦”或“别再烦我”。希腊语原文直译近于“不要把麻烦加给我”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“门已经关着了”。这里的希腊语完成时既可侧重门已经关上的动作，也可侧重门现今关着的状态。
    reason: lexical_alternative
  - marker: c
    text: “在床上”指当时家庭成员共同使用的睡卧处，并不含夫妻亲密关系的意思。
    reason: cultural_note
lexical_decisions:
- source_word: κἀκεῖνος
  choice: 那人
  rationale: 既承接叙事，又以指示性称呼明确指向屋内的朋友；比直译“而那一个”自然。
- source_word: ἔσωθεν ἀποκριθεὶς εἴπῃ
  choice: 从里面回答说
  rationale: 保留ἔσωθεν所表达的空间来源，也以现代汉语常用的叙事表达呈现“回答而说”。
- source_word: Μή μοι κόπους πάρεχε
  choice: 别打扰我了
  rationale: 这是表示给人添麻烦、造成烦扰的习语；“别打扰我了”简洁自然，并用“了”传达制止当前烦扰的语气。
- source_word: ἡ θύρα κέκλεισται
  choice: 门已经关上了
  rationale: 以“已经……了”兼顾完成时所表达的动作已经完成及其结果仍然存在；不译作“锁上”，以免超出κλείω的语义。
- source_word: τὰ παιδία μου
  choice: 我的孩子们
  rationale: 准确表达复数παιδία，又不额外限定孩子的具体年龄。
- source_word: μετ’ ἐμοῦ εἰς τὴν κοίτην εἰσίν
  choice: 也都跟我在床上
  rationale: 自然呈现一家人在共同睡卧处的情景；“都”符合复数孩子在汉语中的表达，“也”连接前一项已成定局的状况。
- source_word: οὐ δύναμαι ἀναστὰς δοῦναί σοι
  choice: 我不能起来拿东西给你
  rationale: ἀναστὰς表示必须先起来才能给；希腊文宾语依上下文省略，汉语补出泛指的“东西”可避免“给你”悬空，同时不把所给之物过度限定为某一种物品。
