source:
  edition: SBLGNT
  text: Εἶπεν δὲ πρὸς τοὺς μαθητάς· Ἐλεύσονται ἡμέραι ὅτε ἐπιθυμήσετε μίαν τῶν ἡμερῶν τοῦ υἱοῦ τοῦ ἀνθρώπου ἰδεῖν καὶ οὐκ ὄψεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/022.yaml
  text: Then he said to the disciples[a], “Days are coming when you will long to see one of the days of the Son of Man[b], and you will not see it.”
translation:
  language: zh_hans
  text: 随后，他对门徒说：“日子将到，那时你们会渴望看见人子的日子中的一天，却看不见。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人子的日子”可以指他同在并工作的时期，也可以更具体地指他将来显现的时候；希腊原文没有限定其范围。
    reason: alternative_reading
lexical_decisions:
- source_word: Εἶπεν δὲ
  choice: 随后，他说
  rationale: δέ是轻微的叙事连接词；“随后”自然推进上下文，又不强化为明显转折。
- source_word: πρὸς τοὺς μαθητάς
  choice: 对门徒
  rationale: 原文有定冠词，但没有明确的物主代词，因此不增译“他的”。
- source_word: Ἐλεύσονται ἡμέραι
  choice: 日子将到
  rationale: 保留先知性未来表达，也符合现代汉语中庄重而自然的圣经语体。
- source_word: ἐπιθυμήσετε
  choice: 会渴望
  rationale: 表达强烈的愿望，比普通的“想要”更贴合该词在此处的情感力度。
- source_word: μίαν τῶν ἡμερῶν
  choice: 日子中的一天
  rationale: 体现部分属格，保留“多个日子中的一个”这一结构，而不将其简化为泛指的“有一天”。
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: 人子
  rationale: 采用这一称号的传统、准确译法，保留其但以理书背景及神学含义。
- source_word: ἰδεῖν καὶ οὐκ ὄψεσθε
  choice: 看见……却看不见
  rationale: 两个视觉动词均直译为“看见”；καί在语境中形成出乎愿望的结果，汉语以“却”自然表达其隐含反差，但不改变命题内容。
theological_decisions:
- issue: “人子的日子”所指的范围
  choice: 保留为“人子日子”，不限定为某一个阶段
  alternative: 明确解释为耶稣在世服事的日子，或专指人子未来显现、审判的日子
  rationale: 上下文具有末世意味，但短语本身也可能唤起门徒对耶稣同在的怀念；正文保留原文的开放性，由脚注说明可能范围。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“人子日子中的一天”略带非日常表达，是为保留原文μίαν τῶν ἡμερῶν τοῦ υἱοῦ τοῦ ἀνθρώπου的部分关系及其神学张力。脚注标记置于整节引语之后。
