  terminology: “必须”恰当保留δεῖ的必要性，未擅自说明其来源。“弃绝”能表达ἀποδοκιμασθῆναι经评断后遭排斥的力度；“这世代”保留γενεά的群体与当代指向，适合经文的庄重语域。
