  source_fidelity: “但他必须先受许多苦，又被这世代弃绝”整体准确传达了δέ、δεῖ、时间优先的πρῶτον、受苦及被动的弃绝。惟“又”在现代汉语中常带有“再次”或额外递进的色彩；原文καί仅为并列连接，译作“并”更稳妥。将“受许多苦”调整为“经历许多苦难”，可更明确表达πολλὰ（许多事／多方面的遭遇）而不改变含义。
