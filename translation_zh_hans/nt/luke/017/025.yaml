base_translation:
  language: en
  yaml_path: translation/nt/luke/017/025.yaml
  text: But first he must suffer many things and be rejected by this generation.
translation:
  language: zh_hans
  text: 但他必须先经历许多苦难，并被这世代弃绝。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρῶτον
  choice: 先
  rationale: 作副词表示时间上的先后次序；“先”简洁自然，表明这些事必须发生在上文所说的显现之前。
- source_word: δὲ
  choice: 但
  rationale: δέ在这里带有轻微转折，说明在上文所述之事以前，尚有受苦和被弃绝之事；“但”保留了这一语气。
- source_word: δεῖ
  choice: 必须
  rationale: δεῖ表示必要性；“必须”既保留其力度，也不在正文中进一步断定这种必要性的具体来源。
- source_word: αὐτὸν
  choice: 他
  rationale: 这是两个不定式的逻辑主语，承接上文的“人子”；现代汉语用“他”表达自然。
- source_word: πολλὰ παθεῖν
  choice: 受许多苦
  rationale: πολλά是中性复数，概括多方面的苦难；汉语惯用“受许多苦”，兼顾原文的广度与自然表达。
- source_word: ἀποδοκιμασθῆναι
  choice: 被……弃绝
  rationale: 该词指经判断后不予认可、加以拒绝；“弃绝”比一般的“拒绝”更能传达郑重而彻底的排斥，并符合庄重的经文语体。
- source_word: ἀπὸ τῆς γενεᾶς ταύτης
  choice: 被这世代
  rationale: ἀπό与被动式连用，可表示施事者或来源；译作“被这世代弃绝”符合现代汉语。γενεά保留为“世代”，指耶稣当时同时代的人群，同时不把范围过度具体化。
theological_decisions:
- issue: δεῖ所表达的必要性
  choice: 译为“必须”，保留受苦与被弃绝具有必然性的含义，但不在正文中明说是神的旨意或预定。
  alternative: 译为“有必要”，或解释性地译成“照神的计划必须”。
  rationale: 路加常用δεῖ表达与神旨意有关的必要性，但本节本身没有明说其来源；“必须”保留神学分量和张力，而不添加解释。
- issue: αὐτόν所指对象
  choice: 正文译作“他”，承接上下文中的“人子”。
  alternative: 为明确起见直接译作“人子”。
  rationale: 原文使用代词；保留“他”忠实反映句法衔接，也避免把上下文信息重复写入本节。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“受许多苦”自然地传达πολλὰ παθεῖν；“弃绝”保留ἀποδοκιμάζω所含的否定、排斥意味。句序将“先”置于“受许多苦”之前，清楚呈现时间优先关系。
