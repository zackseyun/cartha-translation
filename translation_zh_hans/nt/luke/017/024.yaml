  text: ὥσπερ γὰρ ἡ ⸀ἀστραπὴ ἀστράπτουσα ἐκ τῆς ⸂ὑπὸ τὸν⸃ οὐρανὸν εἰς τὴν ὑπ’ οὐρανὸν λάμπει, οὕτως ἔσται ὁ υἱὸς τοῦ ἀνθρώπου ⸂ἐν τῇ ἡμέρᾳ αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/024.yaml
  text: For just as lightning, flashing from one part under heaven to the other part under heaven, shines[b][a], so will the Son of Man be in his day.
translation:
  language: zh_hans
  text: 因为，正如闪电闪现，从天空这一边照亮到天空那一边；人子在他的日子[a]也要如此。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“在属于他的那一天”。原文所指的是与人子相关的日子，并未在本节进一步具体说明。
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: 因为……就像
  rationale: 既保留γάρ承接上文的解释作用，也以现代汉语自然地引出ὥσπερ所表达的比喻。
- source_word: ἡ ἀστραπὴ ἀστράπτουσα
  choice: 闪电闪起
  rationale: 用同根的“闪电／闪起”表现原文名词与分词的同根关系，并传达突然显现的动态画面。
- source_word: ἐκ τῆς ὑπὸ τὸν οὐρανὸν εἰς τὴν ὑπ’ οὐρανὸν
  choice: 从天这边……到天那边
  rationale: 以自然的现代汉语表达闪电横贯天空的范围；“这边／那边”也反映原文从一处到另一处的对举。
- source_word: λάμπει
  choice: 照到
  rationale: 与前面的“闪起”有所区别，保留ἀστράπτουσα与λάμπει两个相关而不相同的动作；在“从……到……”结构中，“照到”比单说“发光”更自然。
- source_word: οὕτως ἔσται
  choice: 也将这样
  rationale: 保留比喻的对应关系和将来时，不进一步说明具体如何“这样”。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人子
  rationale: 采用现代中文圣经传统中清楚、稳定的称号译法，不作解释性改写。
- source_word: ἐν τῇ ἡμέρᾳ αὐτοῦ
  choice: 在他的日子
  rationale: 保留介词短语的宽泛含义及αὐτοῦ的所属意味，不擅自具体化为“降临”或“审判”的日子。
theological_decisions:
- issue: 末世语境中“人子在他的日子”的含义
  choice: 在他的日子
  alternative: 在人子降临的时候／在审判之日
  rationale: 原文只说“在他的日子”，虽有末世语境，却没有在本节明确说“降临”或“审判”；保留宽泛说法可避免加入原文未明说的神学限定。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“从天这边照到天那边”比逐字重复“天下”更符合汉语习惯，同时保留横贯天空、显而易见的画面。分号清楚标示比喻与其对应结论。
