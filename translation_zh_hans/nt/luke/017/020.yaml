  text: Ἐπερωτηθεὶς δὲ ὑπὸ τῶν Φαρισαίων πότε ἔρχεται ἡ βασιλεία τοῦ θεοῦ ἀπεκρίθη αὐτοῖς καὶ εἶπεν· Οὐκ ἔρχεται ἡ βασιλεία τοῦ θεοῦ μετὰ παρατηρήσεως,
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/020.yaml
  text: When he was asked by the Pharisees when the kingdom of God was coming[a], he answered them and said, “The kingdom of God does not come with observable signs,”
translation:
  language: zh_hans
  text: 法利赛人问耶稣：“神的国什么时候来？”他回答他们说：“神的国来临，并不伴随着可观察的迹象[a]，”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“凭着观察”“以可观察的方式”或“伴随严密察看”。
    reason: παρατήρησις可指观察、察看或严密留意；正文的“可观察的迹象”表达其可由外在现象辨认、追踪的含义，但并非唯一可能的译法。
lexical_decisions:
- source_word: Ἐπερωτηθεὶς δὲ ὑπὸ τῶν Φαρισαίων
  choice: 法利赛人问耶稣
  rationale: 将希腊文被动分词结构自然转换为现代汉语主动句；“耶稣”由语境明确补出，避免汉语中主语含混。δέ仅作轻微承接，不另译为“这时”或“于是”。
- source_word: πότε ἔρχεται
  choice: 什么时候来
  rationale: πότε直接询问时间；ἔρχεται在问题中具有面向将来的语意，汉语“什么时候来”自然兼顾现在形式与预期来临。
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: 神的国
  rationale: 采用现代中文圣经语境中清楚、庄重且为一般读者熟悉的表达。
- source_word: ἀπεκρίθη αὐτοῖς καὶ εἶπεν
  choice: 耶稣回答他们说
  rationale: 保留原文“回答……说”的双动词形式，并再次明示主语，使引语衔接清楚。
- source_word: Οὐκ ἔρχεται ἡ βασιλεία τοῦ θεοῦ
  choice: 神的国来临，并不……
  rationale: 以一般性陈述表达现在时，说明神的国来临的方式，而非断言它不会来临。
- source_word: μετὰ παρατηρήσεως
  choice: 伴随着可观察的迹象
  rationale: παρατήρησις可指观察、察看或严密留意；正文采用自然中文表达其可由外在现象辨认、追踪的含义，同时用脚注保留词义范围。
theological_decisions:
- issue: 耶稣否定神的国以何种方式来临
  choice: 神的国来临并不伴随可供观察、追踪的外在迹象
  alternative: 神的国完全不能被人观察；或耶稣否定一切末世征兆
  rationale: 原句主要否定来临的方式具有可观察、可严密察看的特征；译文不把本节扩展为对一切感知或一切末世征兆的全面否定，以保留经文本身的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。主动化开头符合汉语叙事习惯；引语末保留逗号，以衔接下一节尚未收入本条目的话。
