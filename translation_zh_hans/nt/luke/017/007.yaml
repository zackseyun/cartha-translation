  source_fidelity: 译文准确传达了反问句、奴仆从田间劳作归来、主人随即吩咐其用餐的基本情景。“奴仆”可对应 δοῦλος，且脚注适当说明其非雇工性质；“放牧”没有把 ποιμαίνω 所牧养的牲畜过度限定为羊。惟“等他……回来，会对他说”在汉语中略易读成“等候他回来之后”，不如直接标明时间关系；“躺席吃饭”亦非现代汉语自然搭配。
