  text: Τίς δὲ ἐξ ὑμῶν δοῦλον ἔχων ἀροτριῶντα ἢ ποιμαίνοντα, ὃς εἰσελθόντι ἐκ τοῦ ἀγροῦ ἐρεῖ ⸀αὐτῷ· Εὐθέως παρελθὼν ἀνάπεσε,
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/007.yaml
  text: But which of you[a], having a slave plowing or shepherding, will say to him when he has come in from the field[b], ‘Come at once and recline at the table’?
translation:
  language: zh_hans
  text: 你们中间谁有一个奴仆[a]在犁地或放牧，他从田里回来时，会对他说：‘立刻过来，在席上斜躺着用餐[b]’？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “奴仆”或译“奴隶”；原文指受主人支配、并非受雇的劳作者。
    reason: alternative_reading
  - marker: b
    text: “在席上斜躺着用餐”反映古代人赴席时斜躺用餐的习惯；意译可作“坐下吃饭”。
    reason: cultural_note
lexical_decisions:
- source_word: δοῦλον
  choice: 奴仆
  rationale: 指受主人支配、并非受雇的家庭劳作者。“奴仆”既保留不对等的主从关系，也较适合现代中文经文语体；脚注说明也可译作“奴隶”。
- source_word: ἀροτριῶντα
  choice: 犁地
  rationale: 直接表达用犁耕作的农业活动，简明自然。
- source_word: ποιμαίνοντα
  choice: 放牧
  rationale: 保留照管牲畜群的牧养活动，同时不把原文未明说的牲畜限定为羊。
- source_word: εἰσελθόντι ἐκ τοῦ ἀγροῦ
  choice: 等他从田里回来
  rationale: 将与格分词理解为时间用法，表示奴仆从田间回来时；“回来”自然传达进入主人所在之处。
- source_word: ἐρεῖ αὐτῷ
  choice: 会对他说
  rationale: 对应将来时 λέγω，并符合反问句的自然中文表达。
- source_word: Εὐθέως
  choice: 快
  rationale: 在直接命令中自然表达“立刻、马上”的意思。
- source_word: παρελθὼν
  choice: 过来
  rationale: 作为伴随情状分词，与后面的命令合用，表达来到席前就位。
- source_word: ἀνάπεσε
  choice: 躺席吃饭
  rationale: 保留古代赴席时斜躺用餐的姿势，并补出用餐语境，使现代读者能够理解。
theological_decisions:
- issue: 比喻性家庭场景中 δοῦλος 的译法
  choice: 奴仆
  alternative: 奴隶；仆人
  rationale: 本节论证依赖主人对受其支配者所拥有的权柄。“仆人”容易使现代读者联想到受雇佣者，而“奴隶”虽直接，却在现代中文里可能过度凸显近代奴隶制度的特定形态；“奴仆”较能兼顾社会地位与经文语体，并以脚注保留更直白的译法。
translation_notes:
  register: 采用现代、庄重而口语流畅的反问句式。“躺席吃饭”保留历史场景，脚注提供现代习惯下的意译。
