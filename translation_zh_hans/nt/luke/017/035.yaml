source:
  edition: SBLGNT
  text: ⸂ἔσονται δύο⸃ ἀλήθουσαι ἐπὶ τὸ αὐτό, ⸀ἡ μία παραλημφθήσεται ⸂ἡ δὲ⸃ ἑτέρα ⸀ἀφεθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/035.yaml
  text: There will be two women grinding together[a]; one will be taken[b], but the other will be left.
translation:
  language: zh_hans
  text: 将有两个女人一同推磨[a]；一个将被带走[b]，另一个却将被留下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在同一个地方推磨”。希腊语短语可表示“一同”，也可表示“在同一个地方”。
    reason: lexical_alternative
  - marker: b
    text: “被带走”这个说法本身并未指明是被带去得救还是受审判；其含义须由更广的上下文判断。
    reason: alternative_reading
lexical_decisions:
- source_word: ἔσονται
  choice: 将有
  rationale: 这是 εἰμί 的将来时，在此引出将要出现的情景；“将有”自然地保留了存在句和将来意义。
- source_word: δύο / ἀλήθουσαι
  choice: 两个女人……推磨
  rationale: δύο 本身是“两个”，而阴性复数分词 ἀλήθουσαι 表明所指为女性；“推磨”简洁表达磨粮食的动作。
- source_word: ἐπὶ τὸ αὐτό
  choice: 一同
  rationale: 该短语可表示“在一起”或“在同一个地方”；正文用“一同”最自然，并以脚注保留另一可能。
- source_word: ἡ μία
  choice: 一个
  rationale: 在两者对举中指其中一个；汉语用“一个”简洁自然。
- source_word: παραλημφθήσεται
  choice: 将被带走
  rationale: 保留 παραλαμβάνω 将来被动式的基本意义，不在正文中断定被带走是得救还是受审判。
- source_word: ἡ δὲ ἑτέρα
  choice: 另一个却
  rationale: ἑτέρα 指两者中的另一个，δέ 表示对比；“却”清楚呈现这种反差。
- source_word: ἀφεθήσεται
  choice: 将被留下
  rationale: 直接表达 ἀφίημι 的将来被动意义，避免用“抛弃”等词增添原文未明说的评价。
theological_decisions:
- issue: “被带走”与“被留下”各自是否意味着得救或受审判
  choice: 采用中性的“一个将被带走，另一个却将被留下”
  alternative: 明确译成一个被接去得救、另一个留下受审判；或一个被带去受审判、另一个得以存留
  rationale: 本节只陈述二人被分开，并未单凭这两个动词明确说明哪一种处境代表得救或审判；译文应保留上下文中的解释张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“推磨”保留古代生活场景且为现代读者所能理解；句式保持两人之间鲜明而不加解释的对照。
