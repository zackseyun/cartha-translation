  text: καὶ ἐὰν ἑπτάκις τῆς ἡμέρας ⸀ἁμαρτήσῃ εἰς σὲ καὶ ⸀ἑπτάκις ἐπιστρέψῃ ⸂πρὸς σὲ⸃ λέγων· Μετανοῶ, ἀφήσεις αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/004.yaml
  text: And if he sins against you seven times in a day[a], and seven times returns to you saying[c][b], ‘I repent,’ you shall forgive him.
translation:
  language: zh_hans
  text: 即使他一天之内七次得罪你，又七次转向你，说：‘我悔改’，你也要饶恕他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “转向你”也可译作“回到你这里”。原文动词在这里可有“转向”或“回来”的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑπτάκις τῆς ἡμέρας
  choice: 一天七次
  rationale: 以自然的现代汉语表达限定时段内反复七次的意思；“一天”并未把七解释为象征数。
- source_word: ἁμαρτήσῃ εἰς σὲ
  choice: 得罪你
  rationale: ἁμαρτάνω与εἰς σέ连用，指对受话者犯罪或冒犯；“得罪你”在汉语中准确且自然。
- source_word: ἐπιστρέψῃ πρὸς σὲ
  choice: 回到你这里
  rationale: ἐπιστρέφω可指回来或转向；上下文是得罪之后再次来向对方表示悔改，“回到你这里”保留返回的意味。
- source_word: λέγων
  choice: 说
  rationale: 用连动结构自然表达分词所表示的伴随动作。
- source_word: Μετανοῶ
  choice: 我悔改了
  rationale: 保留μετανοέω的伦理和属灵分量，不弱化为“我很抱歉”；句末“了”符合当面宣告自己悔改的现代汉语表达，并不强行把希腊语现在时改解为完成时。
- source_word: ἀφήσεις αὐτῷ
  choice: 你也要饶恕他
  rationale: 未来直陈式在此教导语境中具有命令或义务的效力；“要”自然传达这一指令，同时“也”呼应前面的重复条件。
theological_decisions:
- issue: ἀφήσεις的语气效力
  choice: 译作指令性的“你也要饶恕他”
  alternative: 预告性的“你会饶恕他”
  rationale: 本句处于耶稣对门徒的劝诫中，未来直陈式具有命令效力；译文传达义务，但不额外增强为超出原文的绝对化表述。
- issue: Μετανοῶ所表达的回应
  choice: 译作“我悔改了”
  alternative: “我很抱歉”或“我改变主意了”
  rationale: 原词明确指悔改，不只是歉意或一般性的改变想法；译文保留其伦理与属灵内涵。
- issue: 饶恕与反复悔改的关系
  choice: 保留本节明说的条件结构
  alternative: 把本句扩展为关于所有情形下饶恕的系统性命题
  rationale: 本节明确描述对方回来并说“我悔改了”的情形；翻译不应加入或消除经文本身与更广泛饶恕教导之间的张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“即使……又……也要……”清楚呈现让步条件和命令结果；不用较文言的“若”“当”，也不使用带特定宗派色彩的术语。脚注标记置于整句之后，说明ἐπιστρέφω的真实词义幅度。
