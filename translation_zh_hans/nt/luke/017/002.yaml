  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: λυσιτελεῖ αὐτῷ εἰ ⸂λίθος μυλικὸς⸃ περίκειται περὶ τὸν τράχηλον αὐτοῦ καὶ ἔρριπται εἰς τὴν θάλασσαν ἢ ἵνα σκανδαλίσῃ ⸂τῶν μικρῶν τούτων ἕνα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/002.yaml
  text: It would be better for him if a millstone were hung around his neck and he were thrown into the sea than that he should cause one of these little ones to stumble[a][b].
translation:
  language: zh_hans
  text: 若把磨石[a]挂在他的颈项上，再把他投入海中，这对他倒比他使这些小子中的一个跌倒[b]更好。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “磨石”也可更具体地译为“大磨石”，即磨坊所用的较大、较重的磨石。
    reason: lexical_alternative
  - marker: b
    text: “使……跌倒”也可译为“使……犯罪”；原词可指使人陷入罪中或遭受属灵的败坏。
    reason: lexical_alternative
lexical_decisions:
- source_word: λυσιτελεῖ αὐτῷ
  choice: 倒不如……也好过
  rationale: 此处表示对当事人而言，前一种可怕结局反而比后一种行为更可取；这一表达自然保留了比较意味。
- source_word: λίθος μυλικὸς
  choice: 磨石
  rationale: 直指磨坊所用的石头；正文采用简明通行的对应词，更具体的大小含义列入脚注。
- source_word: περίκειται περὶ τὸν τράχηλον αὐτοῦ
  choice: 把磨石套在他的脖子上
  rationale: 希腊文描写磨石处于环绕颈项的状态；“套在……脖子上”符合现代汉语习惯，并传达被动处置的情景。
- source_word: ἔρριπται εἰς τὴν θάλασσαν
  choice: 把他扔进海里
  rationale: 被动完成形式突出被投入海中的既成结果；汉语用连贯的处置式，与前半句自然衔接。
- source_word: σκανδαλίσῃ
  choice: 使……跌倒
  rationale: 保留原词的绊倒隐喻，也容纳使人陷入罪或属灵败坏的含义；解释性译法列入脚注。
- source_word: τῶν μικρῶν τούτων ἕνα
  choice: 这些小子中的一个
  rationale: 保留“小者”这一宽泛称呼，不擅自限定为儿童或信徒；“小子”在庄重经文语境中简洁自然。
- source_word: ἢ ἵνα
  choice: 也好过
  rationale: 清楚表达两个结果之间的比较关系，符合现代汉语语序。
theological_decisions:
- issue: “这些小子”的所指
  choice: 不限定所指，译作“这些小子”
  alternative: 这些孩子；这些卑微的信徒或门徒
  rationale: 原文只称他们为“这些小者”，本节本身没有明确限定其年龄或身份，因此保留诠释空间。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“倒不如……也好过”保留强烈比较语气；“小子”避免将所指过早限定为儿童。所有脚注标记均置于正文相应词语之后。
