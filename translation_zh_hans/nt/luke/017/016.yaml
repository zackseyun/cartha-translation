  yaml_path: translation/nt/luke/017/016.yaml
  text: And he fell on his face at his feet, thanking him. And he was a Samaritan.
translation:
  language: zh_hans
  text: 他俯伏在耶稣脚前，感谢他。这个人是撒玛利亚人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπεσεν ἐπὶ πρόσωπον
  choice: 俯伏
  rationale: 这里的动词与“脸朝下”的短语合在一起，描写俯身伏地的姿态。现代汉语用“俯伏”既自然庄重，也无需重复说“脸伏在地上”。
- source_word: παρὰ τοὺς πόδας αὐτοῦ
  choice: 在耶稣脚前
  rationale: παρά在此敬拜、感恩的姿态中宜译为“脚前”。代词所指是耶稣；为避免连续两个“他”在汉语中造成指代含混，明说“耶稣”。
- source_word: εὐχαριστῶν αὐτῷ
  choice: 感谢他
  rationale: 现在分词表示与俯伏同时发生的伴随动作；“感谢他”简洁自然，并保留感恩直接归向耶稣的关系。
- source_word: καὶ αὐτὸς ἦν Σαμαρίτης
  choice: 这个人是撒玛利亚人
  rationale: αὐτός带有一定强调作用。“这个人”自然地凸显其身份，同时保留原文平实而出人意料的叙述方式。
- source_word: Σαμαρίτης
  choice: 撒玛利亚人
  rationale: 采用现代中文圣经与历史语境中通行的族群及宗教群体称谓，保留其叙事和社会意义。
theological_decisions:
- issue: 得医治者身份所承载的叙事重点
  choice: 以“这个人是撒玛利亚人”直接陈述
  alternative: 加上“原来”或“竟是”等解释性语气
  rationale: 原文以简洁陈述凸显感恩者属于常被视为外人的群体。译文不添加“竟然”等评价词，以免替读者预先解释其中的神学和社会张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“俯伏”准确传达伏地姿态；明确写“耶稣脚前”是为消除汉语代词歧义，不增加原文以外的参与者。
