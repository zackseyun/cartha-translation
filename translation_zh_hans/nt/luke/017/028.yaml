  text: ὁμοίως ⸀καθὼς ἐγένετο ἐν ταῖς ἡμέραις Λώτ· ἤσθιον, ἔπινον, ἠγόραζον, ἐπώλουν, ἐφύτευον, ᾠκοδόμουν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/028.yaml
  text: 'Likewise[a], just as it happened in the days of Lot: they were eating, drinking, buying, selling, planting, and building.'
translation:
  language: zh_hans
  text: 同样地，正如罗得的日子所发生的那样：人们吃喝、买卖、栽种、建造。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁμοίως
  choice: 也是这样
  rationale: 承接前文挪亚时代的例子，并引出与罗得时代相似的情形；现代汉语自然简洁，也保留比较作用。
- source_word: καθὼς ἐγένετο
  choice: 是这样
  rationale: καθὼς 引出类比，ἐγένετο 表示当时出现的情形；合译避免生硬的“照样发生了”，同时不削弱比较意义。
- source_word: ἐν ταῖς ἡμέραις Λώτ
  choice: 罗得的日子
  rationale: 保留圣经中常见的时间表达，指罗得所处的时期。
- source_word: ἤσθιον, ἔπινον
  choice: 吃喝
  rationale: 两个未完成时描绘持续、惯常的日常活动；汉语并列动词本身即可自然表达这种背景性活动。
- source_word: ἠγόραζον, ἐπώλουν
  choice: 买卖
  rationale: 准确概括成对出现的商业活动，并保持原文清晰紧凑的列举节奏。
- source_word: ἐφύτευον
  choice: 栽种
  rationale: 表达农业上的种植活动，比单用“种”更庄重明确。
- source_word: ᾠκοδόμουν
  choice: 建造
  rationale: 此处取实际施工、建房的字面义；“建造”既自然，也与日常活动清单的语体协调。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通俗的简体中文。原文两个比较成分 ὁμοίως 与 καθὼς 在汉语中若逐一硬译会显得重复，因此凝练为“也是这样”，既承接前文又保持类比。六个未完成时以无体标记的并列动词表达惯常、持续的生活状态，不额外加入原文没有的道德评价。
