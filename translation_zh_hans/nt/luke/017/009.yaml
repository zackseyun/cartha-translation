base_translation:
  language: en
  yaml_path: translation/nt/luke/017/009.yaml
  text: Does he thank the slave because he did what was commanded?[a]
translation:
  language: zh_hans
  text: 主人难道会因为奴隶做了所吩咐的事而感谢他吗？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “奴隶”也可译作“仆人”或“奴仆”（希腊文 doulos）。
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ
  choice: 难道……吗
  rationale: μή与陈述语气动词构成预期否定回答的反问；“难道……吗”自然传达预期答案为“不会”。
- source_word: ἔχει χάριν
  choice: 感谢
  rationale: ἔχειν χάριν τινί在此表示对某人感激或向某人致谢；“感谢”简洁自然，符合上下文。
- source_word: δούλῳ
  choice: 奴隶
  rationale: δοῦλος指处于主人权柄之下、负有服从义务的人；本比喻的论证依赖这种身份关系，因此不宜在正文中弱化为一般的雇佣仆役。
- source_word: ὅτι
  choice: （因）……了
  rationale: ὅτι引出感谢的理由。汉语通过前置原因分句“奴隶……做了”以及后句语义自然表达因果，无须生硬加入“因为”。
- source_word: ἐποίησεν
  choice: 做了
  rationale: ποιέω在此指执行所交代的事；“做了”自然简明。
- source_word: τὰ διαταχθέντα
  choice: 照着吩咐
  rationale: 该带冠词的完成时被动分词指已经吩咐要做的事；“照着吩咐”既保留受命执行之意，也符合现代汉语表达。
theological_decisions:
- issue: 主人—奴隶语境中δοῦλος的译法
  choice: 奴隶
  alternative: 仆人；奴仆
  rationale: 经文的反问建立在奴隶受主人命令、履行应尽义务这一不对等关系上。“奴隶”保留比喻所预设的社会现实和修辞力度；脚注同时列出较温和的传统译法。
- issue: 反问所预期的答案
  choice: 用“难道……吗”表达预期否定回答
  alternative: “他不会……吧？”；普通疑问句“他会……吗？”
  rationale: μή在此表明说话者预期答案为否定。译文明确保留这种语用力量，却不把隐含答案直接写入正文。
- issue: 隐含主语的处理
  choice: 补明“主人”
  alternative: 保留代词“他”
  rationale: 希腊文动词的主语由上文可知是主人。汉语若连续使用两个“他”容易混淆主人和奴隶，补明“主人”只澄清指代，不增加新的神学解释。
translation_notes:
  register: 采用现代、简洁而庄重的反问句。将原因分句前置，以符合普通话习惯；“难道”保留原文预期否定回答的语气。正文用“奴隶”呈现当时主人与受命者之间的强烈身份差异，并以脚注提供常见替代译法。
