  text: καὶ αὐτοὶ ἦραν φωνὴν λέγοντες· Ἰησοῦ ἐπιστάτα, ἐλέησον ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/013.yaml
  text: And they raised their voices[a], saying, “Jesus, Master[b], have mercy on us!”
translation:
  language: zh_hans
  text: 他们高声喊着说[a]：“耶稣，老师[b]，求你怜悯我们！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“扬起声音”。
    reason: lexical_alternative
  - marker: b
    text: “老师”翻译希腊语epistata，指有权柄、居领导地位的人；这不是通常译作“主”的希腊词kyrios。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: 于是
  rationale: 承接上文叙事，并自然引出他们随后的呼喊；这里的连接词可按汉语叙事习惯表达为“于是”，不额外增加强烈的时间含义。
- source_word: αὐτοὶ
  choice: 他们
  rationale: 希腊文明确使用代词，略带强调；现代汉语以“他们”自然表达即可，无须生硬译作“他们自己”。
- source_word: ἦραν φωνὴν
  choice: 高声喊道
  rationale: 这是表示提高声音、大声呼喊的惯用表达。“高声喊道”自然传达其音量和迫切感；字面意象见脚注。
- source_word: λέγοντες
  choice: 喊道
  rationale: 分词λέγοντες与前面的惯用语合译为“高声喊道”，符合现代汉语表达，避免重复成“高声……说”。
- source_word: Ἰησοῦ
  choice: 耶稣
  rationale: 人名呼格，采用现代汉语通行译名。
- source_word: ἐπιστάτα
  choice: 老师
  rationale: 这是对有权柄、居领导地位者的尊称；在路加福音中用于门徒或求助者称呼耶稣。“老师”在现代汉语中自然且尊敬，同时不与κύριος通常对应的“主”混同。
- source_word: ἐλέησον
  choice: 求你怜悯
  rationale: 命令式在此表达迫切恳求；加“求你”符合汉语祈求语气，“怜悯”保留对方施行慈悲帮助的含义。
- source_word: ἡμᾶς
  choice: 我们
  rationale: 作为“怜悯”的宾语，直接译作“我们”自然准确。
theological_decisions:
- issue: 如何翻译对耶稣的称呼ἐπιστάτα
  choice: 老师
  alternative: 主；夫子；主人
  rationale: 原文是ἐπιστάτης的呼格，不是κύριος。“主”会抹去词汇区别，并可能带入本词本身未明确表达的更强神学含义；“主人”在现代汉语中容易产生主仆或所有权联想；“夫子”较古雅。“老师”保留尊称及权威意味，并适合现代标准汉语。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“高声喊道”表现远距离求助的迫切语气；“求你怜悯我们”保留简洁有力的呼求。所有脚注标记均已置于正文相应位置。
