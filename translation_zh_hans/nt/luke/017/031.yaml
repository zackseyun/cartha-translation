  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐν ἐκείνῃ τῇ ἡμέρᾳ ὃς ἔσται ἐπὶ τοῦ δώματος καὶ τὰ σκεύη αὐτοῦ ἐν τῇ οἰκίᾳ, μὴ καταβάτω ἆραι αὐτά, καὶ ὁ ⸀ἐν ἀγρῷ ὁμοίως μὴ ἐπιστρεψάτω εἰς τὰ ὀπίσω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/031.yaml
  text: On that day, whoever is on the housetop, with his belongings in the house, must not go down to take them away; and likewise, the one in the field must not turn back to the things behind.
translation:
  language: zh_hans
  text: 在那日，如果有人在房顶上，他的物品在屋里，不要下来去拿；在田里的人也同样不要转回去[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “转回去”所对应的原文可直译为“转向后面的事物”，也可理解为“回到后面”；这可能指向身后留下的东西。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: 到那日
  rationale: 采用自然、庄重的汉语时间表达，同时保留指示词“那”所带的特指意味。
- source_word: ὃς ἔσται ἐπὶ τοῦ δώματος
  choice: 在房顶上的人
  rationale: 将泛指关系结构自然译出；δώμα在此指房屋可供人活动的平顶，而非房屋内部。
- source_word: καὶ τὰ σκεύη αὐτοῦ ἐν τῇ οἰκίᾳ
  choice: 即使他的物品还在屋里
  rationale: σκεύη可指器具、财物或随身物品，此处用范围较宽的“物品”；“即使……还……”在汉语中清楚表达屋顶上的人与屋内物品之间的对照，未改变命令的内容。
- source_word: μὴ καταβάτω ἆραι αὐτά
  choice: 也不要下来拿
  rationale: 第三人称禁止命令译为直接而有力的“不要”；“拿”在上下文中自然表示下去取走那些物品。
- source_word: ὁ ἐν ἀγρῷ ὁμοίως
  choice: 在田里的人同样
  rationale: 保留第二个代表性人物与前一句之间的平行关系。
- source_word: μὴ ἐπιστρεψάτω εἰς τὰ ὀπίσω
  choice: 不要转回去
  rationale: ἐπιστρέφω表达返回或转身回去；εἰς τὰ ὀπίσω字面涉及“后面的事物/身后之处”，汉语正文用“转回去”自然表达行动方向，并在脚注中保留其可能涉及身后所留之物的含义。
theological_decisions:
- issue: 末世情境中的紧迫命令
  choice: 保留不可下楼取物、不可转回去的具体场景和命令
  alternative: 概括译成“不要贪恋财物”或“要舍弃一切”
  rationale: 原文以“那日”的具体行动画面传达紧迫性，并未直接把命令抽象成普遍的道德论断；具体翻译可避免加入经文未明说的教义解释。
- issue: εἰς τὰ ὀπίσω所指为何
  choice: 正文译作“转回去”，脚注说明其字面和可能所指
  alternative: 正文明确译作“回去拿留下的东西”
  rationale: 原文没有明说“拿”，其表达既可指向身后返回，也可能暗示身后留下的事物；正文不把这一含混处过度确定化。
translation_notes:
  register: 采用现代标准普通话，语气庄重而直接。“到那日”保留经文语体；“物品”“田里”“转回去”均为普通读者易懂的当代用语。两个“不要”维持原文连续禁令的紧迫感。
