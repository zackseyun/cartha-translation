  text: ὃς ἐὰν ζητήσῃ τὴν ψυχὴν αὐτοῦ ⸀περιποιήσασθαι ἀπολέσει αὐτήν, ⸂ὃς δ’ ἂν⸃ ⸀ἀπολέσῃ ζῳογονήσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/033.yaml
  text: Whoever seeks to preserve his life will lose it[b][a], but whoever loses it will preserve it alive.
translation:
  language: zh_hans
  text: 凡设法保全自己性命[a]的人，必失去性命；但凡失去性命的人，必使它存活[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “性命”或译“生命”“灵魂”。这里的希腊词 ψυχή 较可能指一个人的性命或自身，而不是特指与身体分离的灵魂。
    reason: lexical_alternative
  - marker: b
    text: “使它存活”也可译作“保全它，使它活着”。原文动词的字面意思是“使之活着”或“使之继续存活”，不是通常译作“拯救”的那个词。
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητήσῃ
  choice: 想
  rationale: 这里的 ζητέω 表示有意寻求、设法达到某个目标；“想保全”在现代汉语中自然地表达这种主动意图，又不将其过度强化为“竭力”或“千方百计”。
- source_word: ψυχὴν
  choice: 性命
  rationale: 在末世审判与自我保全的语境中，ψυχή 指人的性命或自身，而非特指与身体相分离的“灵魂”。“性命”也能自然地与“保全”“失去”“存活”搭配。
- source_word: περιποιήσασθαι
  choice: 保全
  rationale: 该中动态不定式含有为自己保住、确保之意；“保全自己性命”既体现自我保护的意味，也符合庄重而通俗的汉语表达。
- source_word: ἀπολέσει / ἀπολέσῃ
  choice: 失去
  rationale: 两处采用相同译法，以保留耶稣话语中“想保全却失去，甘愿失去却存活”的悖论结构，不额外解释为“舍弃”或“牺牲”。
- source_word: ζῳογονήσει
  choice: 使它存活
  rationale: ζῳογονέω 的基本意思是使之活着或使之继续存活，并非通常表示“拯救”的动词。“使它存活”透明地保留其使役色彩及与“失去”的强烈张力。
- source_word: ὃς ἐὰν ... ὃς δ’ ἂν
  choice: 凡……的；但凡……的
  rationale: 这一结构表达普遍条件；“凡……的”简洁自然，“但”体现 δέ 在两句之间的对比作用。
- source_word: αὐτοῦ / αὐτήν
  choice: 自己……它
  rationale: “自己”自然传达第一处所属关系，并适用于泛指任何人；“它”回指前文的“性命”，避免生硬重复。
theological_decisions:
- issue: ψυχή 在这句悖论中的含义
  choice: 译为“性命”
  alternative: “灵魂”或“生命”
  rationale: 上下文谈到人在审判临到时企图保全自身，以及失去性命反而得以存活。“性命”不预设身心二分，也保留这句话关于现实生命、自身和门徒代价的多重张力。
- issue: ζῳογονήσει 的表达
  choice: 译为“必使它存活”
  alternative: “必救它”“必保全它”或“必使它继续活着”
  rationale: 原文使用的不是通常译作“拯救”的动词，而是强调使其活着或存活。直译为“使它存活”保留原文略显惊人的悖论措辞，不将其提前解释为某种特定的得救观。
- issue: 失去性命者与性命存活之间的张力
  choice: 保留原文表面上的悖论，不补出原因、时间或施行者
  alternative: 补译为“神必使他得生命”或“他必在来世保全生命”
  rationale: 原句没有明说何时、如何或由谁使性命存活。译文不补入这些解释，以保存其末世性与门徒伦理之间的开放张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“性命”比“灵魂”更贴合上下文，也比单用“生命”更自然地表达人在危机中企图保住自身。平行句式和两次“失去性命”保留原文的警句节奏；末句略带突兀的“使它存活”是有意保留原文悖论，而不以解释性措辞将其磨平。
