id: LUK.17.23
reference: Luke 17:23
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἐροῦσιν ὑμῖν· Ἰδοὺ ⸂ἐκεῖ· Ἰδοὺ ὧδε⸃· μὴ ἀπέλθητε μηδὲ διώξητε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/023.yaml
  text: And they will say to you[a], ‘Look, there!’ or ‘Look, here!’ Do not go away or run after them.
translation:
  language: zh_hans
  text: 有人会对你们说：“看，那里！”“看，这里！”你们不要去，也不要追赶[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “追赶”也可译作“追随”或“追求”。希腊文没有说明追赶的对象。
    reason: 保留διώκω的词义范围以及原文宾语省略所形成的歧义。
lexical_decisions:
- source_word: ἐροῦσιν ὑμῖν
  choice: 有人会对你们说
  rationale: 未来时直译为“会说”；希腊文第三人称复数主语未明，中文用泛指“有人”自然，并避免凭空指定群体。
- source_word: Ἰδοὺ
  choice: 看
  rationale: 作为引人注意的指示语，“看”简洁、现代，也保留原文的即时语气。
- source_word: ἐκεῖ / ὧδε
  choice: 那里 / 这里
  rationale: 保留两个方位副词的简明对照，不增添原文没有的地点说明。
- source_word: μὴ ἀπέλθητε
  choice: 你们不要去
  rationale: ἀπέρχομαι在此表示响应地点指示而前去；“不要去”符合现代汉语，也不额外限定为“出去”或“离开”。
- source_word: μηδὲ διώξητε
  choice: 也不要追随
  rationale: διώκω可表示追赶、追求或追随。此处宾语省略；“追随”可自然保持对象未明，并传达不要跟从这些指示或相关之人的警告。
theological_decisions:
- issue: διώξητε的宾语是否明说
  choice: 不补出宾语，译作“也不要追随”
  alternative: 也不要追着他们跑 / 也不要追赶
  rationale: 希腊文没有明示追随谁或什么；不补“他们”可保留原文歧义，避免把对象限定为说话者、宣称者或传闻。脚注说明主要词义范围。
- issue: 两句指示语之间的关系
  choice: 并列译作“‘看，那里！’‘看，这里！’”
  alternative: “看，那里！”或“看，这里！”
  rationale: 原文以两个并列分句呈现，没有明写“或”；中文连续引语既自然，也更形式对应，不强行确定逻辑连接。
translation_notes:
  register: 采用现代、简洁而庄重的普通话。“有人”表达未明示的复数主语；两个“看”保留警告场景中的急迫感。避免使用较古雅的“看哪”，也避免补入“他们”而缩窄原文含义。
