review_pass:
  verdict: revise
  source_fidelity: “有人会对你们说”恰当地表达未明示的第三人称复数主语；“看，那里！”与“看，这里！”保留了两个指示语的对照。“你们不要去”可对应此处的 μὴ ἀπέλθητε。末句的“追随”较容易带出跟从某人的含义，且在无宾语时不如“追赶”自然；διώξητε在此更直接是不要去追逐、追赶这些报道所指向的事物或人，而原文并未明说宾语。
  naturalness: 除末句外，译文简洁自然。将“也不要追随”改为“也不要追赶”，既保留宾语省略，也使现代普通话的禁令表达更顺畅。两个并列引语无需增译“或”，可保留原文的并列形式。
  terminology: “追赶”在此比“追随”更贴近 διώκω 的追逐义，且不把含义专门导向门徒式的“跟从”。脚注应以“追赶”为主译，并说明可作“追随/追求”，以及宾语未明说。
