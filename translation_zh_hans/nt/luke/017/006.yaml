source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ κύριος· Εἰ ἔχετε πίστιν ὡς κόκκον σινάπεως, ἐλέγετε ἂν τῇ συκαμίνῳ ταύτῃ· Ἐκριζώθητι καὶ φυτεύθητι ἐν τῇ θαλάσσῃ· καὶ ὑπήκουσεν ἂν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/006.yaml
  text: And the Lord said[a], “If you had faith like a mustard seed, you would say to this mulberry tree, ‘Be uprooted and be planted in the sea,’ and it would obey you.”
translation:
  language: zh_hans
  text: 主说：“你们若有像一粒芥菜种那样的信心，就会对这棵桑树[a]说：‘连根拔起，栽在海里！’它就会听从你们。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“西卡米树”（sycamine tree），即一种桑树；“西卡米”是对该希腊文树名的音译式译法。
    reason: 保留συκάμινος的替代译法，并避免将未稳定的中文音译称作传统中文译名。
lexical_decisions:
- source_word: κύριος
  choice: 主
  rationale: 保留路加叙事中对耶稣的称号及其基督论意味；“主”也符合现代中文圣经语体。
- source_word: πίστιν
  choice: 信心
  rationale: 此处指向上帝的信靠，而非主要表示忠贞或信实；“信心”在中文语境中最自然。
- source_word: ὡς κόκκον σινάπεως
  choice: 像一粒芥菜种那样
  rationale: 保留ὡς所表达的比喻，不擅自把比较明确限定为体积大小。
- source_word: συκαμίνῳ
  choice: 桑树
  rationale: συκάμινος通常指桑树；采用普通读者易懂的现代名称，并以脚注保留传统音译。
- source_word: ἐλέγετε ἂν
  choice: 就会……说
  rationale: 以自然中文表达未完成时配ἄν所呈现的假设或潜在结果，同时不把它弱化为单纯的能力。
- source_word: Ἐκριζώθητι
  choice: 连根拔起
  rationale: 准确传达ἐκριζόω的被动命令含义；中文命令句可自然省略被动标记。
- source_word: φυτεύθητι ἐν τῇ θαλάσσῃ
  choice: 栽到海里去
  rationale: 保留“栽种在海中”这一强烈而悖常的意象，不解释为较具体的“移栽”。
- source_word: ὑπήκουσεν ἂν ὑμῖν
  choice: 它也会听从你们
  rationale: “听从”既保留ὑπακούω的顺服含义，也与对树发出命令的拟人化表达自然衔接。
theological_decisions:
- issue: 神迹话语中πίστις的含义
  choice: 信心
  alternative: 信靠；信实
  rationale: 上下文着重面对不可能之事时的信靠，而不是人的道德坚贞；译文不进一步规定这种信心的机制或功效。
- issue: 条件句是否断言门徒没有信心
  choice: 你们若有……就会
  alternative: 你们如果真有……早就会
  rationale: 希腊文条件从句用现在直陈式，结果句则带ἄν表达假设或潜在结果。中文采用开放而自然的条件句，保留其张力，不额外断言门徒完全没有信心。
translation_notes:
  register: 采用现代、庄重且口语可懂的表达。“一粒芥菜种”保留比喻，“连根拔起，栽到海里去”维持原文鲜明而反常的画面。脚注标记紧随其所说明的“桑树”。
