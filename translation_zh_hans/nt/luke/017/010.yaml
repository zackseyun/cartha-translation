  text: οὕτως καὶ ὑμεῖς, ὅταν ποιήσητε πάντα τὰ διαταχθέντα ὑμῖν, λέγετε ὅτι Δοῦλοι ἀχρεῖοί ἐσμεν, ⸂ὃ ὠφείλομεν⸃ ποιῆσαι πεποιήκαμεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/010.yaml
  text: So also you[a], when you have done all that was commanded you, say, ‘We are unworthy slaves[b]; we have done what we were obligated to do.’
translation:
  language: zh_hans
  text: 同样，你们也是这样：当你们做完一切吩咐你们做的事，就要说：‘我们是无用的奴隶[a]；我们已经做了我们应当做的事[b]。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “无用的”也可理解为“无利可图的”或“不配邀功的”。原文形容词可指不能带来额外利益；在这里也可含有无权因履行本分而索取奖赏的意思。
    reason: lexical_alternative
  - marker: b
    text: 或译：“我们已经做了我们本来就应当做的事。”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: 同样，你们……也
  rationale: 承接前面的主仆比喻，并把其中的原则应用于听众；这一结构在现代汉语中自然地保留了原文的类比和推论作用。
- source_word: ὅταν ποιήσητε
  choice: 做完……之后
  rationale: ὅταν加不定过去时虚拟语气在此指将来或一般情况下先完成的行动；“做完……之后”清楚表达其先于“要说”的完成性。
- source_word: πάντα τὰ διαταχθέντα ὑμῖν
  choice: 吩咐你们的一切
  rationale: διατάσσω含权威性的命令或吩咐；“吩咐”既保留权威关系，也符合该比喻中的自然汉语表达。
- source_word: λέγετε
  choice: 要说
  rationale: 现在时命令语气表达应有的惯常回应；“要说”在现代汉语中简洁明确。
- source_word: Δοῦλοι
  choice: 奴隶
  rationale: 上下文明示主人与奴隶的社会关系，受支配的身份是比喻的重要部分；“奴隶”比“仆人”更准确地保留原文力度。
- source_word: ἀχρεῖοί
  choice: 无用的
  rationale: 这是该形容词较直接的对应，可表示无用、不能带来额外利益；在本语境中尤其指完成本分后并未因此使主人欠下奖赏。脚注保留语义上的其他理解，避免正文替原文消除张力。
- source_word: ὃ ὠφείλομεν ποιῆσαι
  choice: 我们有义务做的事
  rationale: ὀφείλω表达所欠的责任或必须履行的义务；“有义务”准确而现代。
- source_word: πεποιήκαμεν
  choice: 我们已经做了
  rationale: 完成时表示行动已经完成，并与当前的自我陈述相关；“已经做了”自然地体现这一点。
theological_decisions:
- issue: 门徒比喻中δοῦλοι的身份力度
  choice: 奴隶
  alternative: 仆人
  rationale: 此处不是泛指服务者，而是沿用前文主人有权命令奴隶的场景。采用“奴隶”保留比喻中的从属关系，同时不把古代制度本身解释为经文的伦理认可。
- issue: ἀχρεῖοι所表达的自我评价
  choice: 无用的
  alternative: 不配邀功的／无利可图的
  rationale: 直译保留原词可能显得尖锐的修辞张力；上下文则表明重点是履行义务不能使主人欠下报偿，而不是断言门徒毫无人格价值。脚注说明这一语境含义，不在正文中把它固定为单一神学释义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“同样……也”承接上文比喻；引语保持简洁有力。正文保留“无用的奴隶”这一较强表达，并借脚注解释其语义范围，以免淡化原文，也避免把它误读为对门徒人格价值的绝对否定。
