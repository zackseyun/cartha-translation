id: LUK.17.3
reference: Luke 17:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: προσέχετε ἑαυτοῖς. ἐὰν ⸀ἁμάρτῃ ὁ ἀδελφός σου ἐπιτίμησον αὐτῷ, καὶ ἐὰν μετανοήσῃ ἄφες αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/003.yaml
  text: Pay attention to yourselves[a]. If your brother sins, rebuke him, and if he repents[b], forgive him.
translation:
  language: zh_hans
  text: 你们要留心自己。你的弟兄[b]若犯罪[a]，就责备他；他若悔改，就饶恕他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作：“你的弟兄若得罪你，就责备他。”
    reason: textual_variant
  - marker: b
    text: “弟兄”在希腊原文中是阳性单数，也可能较广泛地指一同作门徒的人。
    reason: cultural_note
lexical_decisions:
- source_word: προσέχετε
  choice: 要留心
  rationale: 现在时命令语气表达持续警醒；“要留心”在现代汉语中自然，并保留警戒意味。
- source_word: ἑαυτοῖς
  choice: 自己
  rationale: 保留反身代词的含义，同时不限定这是个人自省还是群体中的彼此警醒。
- source_word: ἁμάρτῃ
  choice: 犯罪
  rationale: 所据希腊文本没有“得罪你”之类的明确宾语，因此正文采用范围较广的“犯罪”，不加入原文没有的限定。
- source_word: ὁ ἀδελφός σου
  choice: 你的弟兄
  rationale: 忠实呈现希腊文阳性单数形式；在门徒群体的语境中可能泛指同作门徒的人，故以脚注说明。
- source_word: ἐπιτίμησον
  choice: 责备他
  rationale: 表达直接指出并制止过错的命令力度，不弱化为一般性的提醒或劝告。
- source_word: μετανοήσῃ
  choice: 悔改
  rationale: 这是现代汉语中表达道德与属灵回转的标准用语，也符合此处与饶恕相连的关系语境。
- source_word: ἄφες
  choice: 饶恕他
  rationale: 在人际过犯的语境中，ἀφίημι意为宽免、赦免；“饶恕”清楚自然，并保留关系性的含义。
theological_decisions:
- issue: “犯罪”之后是否加入“得罪你”
  choice: 正文不加入“得罪你”
  alternative: “你的弟兄若得罪你，就责备他……”
  rationale: SBLGNT正文只作ἐὰν ἁμάρτῃ ὁ ἀδελφός σου，没有εἰς σέ或同义成分。正文保留较宽泛的表述，较长异文则收入脚注。
- issue: ἀδελφός的性别与所指范围
  choice: 译作“你的弟兄”
  alternative: “你的弟兄或姊妹”或“与你一同作门徒的人”
  rationale: 希腊文是阳性单数，正文按其语法形式翻译；鉴于语境中可能以单数阳性代表更广泛的同作门徒者，以脚注保留这一可能范围。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“留心自己”保留原文反身表达及其可能兼具个人与群体层面的含义；分号呈现责备、悔改与饶恕之间紧密而有层次的关系。
