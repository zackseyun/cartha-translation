source:
  edition: SBLGNT
  text: ᾗ δὲ ἡμέρᾳ ἐξῆλθεν Λὼτ ἀπὸ Σοδόμων, ἔβρεξεν πῦρ καὶ θεῖον ἀπ’ οὐρανοῦ καὶ ἀπώλεσεν ⸀πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/029.yaml
  text: but on the day Lot went out from Sodom[a], fire and sulfur rained from heaven and destroyed them all.
translation:
  language: zh_hans
  text: 但在罗得离开所多玛的那一天，火和硫磺从天上如雨降下[a]，把他们全都毁灭了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：火和硫磺从天上降下来。
    reason: “如雨降下”较具体地呈现 ἔβρεξεν 的降雨意象；“降下来”则是较传统、较简洁的表达。
lexical_decisions:
- source_word: ᾗ δὲ ἡμέρᾳ
  choice: 但在……的那一天
  rationale: 该与格关系短语表示时间，即“在……的那一天”；“但”保留 δέ 与上文之间轻微的转折和承接。
- source_word: ἐξῆλθεν
  choice: 离开
  rationale: 在现代汉语中自然表达罗得从所多玛出去的动作，既准确又不显生硬。
- source_word: Λὼτ
  choice: 罗得
  rationale: 采用中文圣经传统中通行且易于辨认的人名译法。
- source_word: ἀπὸ Σοδόμων
  choice: 所多玛
  rationale: 介词关系已由“离开”自然表达；所多玛是该地名在现代中文圣经中的通行译名。
- source_word: ἔβρεξεν
  choice: 如雨降下
  rationale: 该动词在此指火和硫磺像雨一样从上而降；此译法保留降雨意象，也符合自然汉语。
- source_word: πῦρ καὶ θεῖον
  choice: 火和硫磺
  rationale: θεῖον 的普通词义是“硫磺”；该译法现代、明确，并保留审判的强烈图景。
- source_word: ἀπ’ οὐρανοῦ
  choice: 从天上
  rationale: οὐρανός 在此可指天空或天；“天上”既符合中文圣经语体，也保留创世记背景中的从上而来的审判意象，而不作额外解释。
- source_word: ἀπώλεσεν πάντας
  choice: 把他们全都毁灭了
  rationale: ἀπόλλυμι 在此意为“毁灭”；πάντας 是阳性复数，所指为当时所多玛的人，因此用“他们全都”明确而自然。
theological_decisions:
- issue: 审判语境中 θεῖον 的译法
  choice: 硫磺
  alternative: 传统表达可作“火与硫磺”或在其他语言中使用较古老的对应词
  rationale: “硫磺”直接表达原词含义，在现代汉语中清楚易懂，同时完整保留审判意象。
- issue: οὐρανός 的译法
  choice: 天上
  alternative: 天空
  rationale: “天上”保留经文的圣经语感及创世记十九章的互文背景，同时不把原文进一步限定为单纯的自然天空或作系统神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“如雨降下”保留原文动词的具体意象；句末“把他们全都毁灭了”直接呈现审判结果。
