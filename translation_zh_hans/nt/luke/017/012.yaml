id: LUK.17.12
reference: Luke 17:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ εἰσερχομένου αὐτοῦ εἴς τινα κώμην ⸀ἀπήντησαν δέκα λεπροὶ ἄνδρες, οἳ ⸀ἔστησαν πόρρωθεν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/012.yaml
  text: And as he was entering a certain village[a], ten leprous men met him, who stood at a distance[b],
translation:
  language: zh_hans
  text: 他正进入一个村庄时，有十个患麻风[a]的人遇见他。他们远远地站着[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “麻风”是对古代疾病类别的传统译法；原词可指多种严重的皮肤疾患，不一定专指现代医学所说的麻风病。
    reason: lexical_scope
  - marker: b
    text: 也可译作“在远处”。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσερχομένου αὐτοῦ
  choice: 他正进入……时
  rationale: 现在时分词构成独立属格结构，表示与主句同时发生且正在进行的动作；“正……时”自然保留这一延续意味。
- source_word: εἴς τινα κώμην
  choice: 进入一个村庄
  rationale: τινα表示不特定的某一个村庄；现代汉语用“一个村庄”即可自然表达，无须生硬译作“某一个村庄”。
- source_word: ἀπήντησαν
  choice: 遇见他
  rationale: ἀπαντάω可表示“遇见”或“前去迎见”。此处译作“遇见”简洁自然，也不额外限定他们移动的方式；宾语“他”由上下文明确补出。
- source_word: δέκα λεπροὶ ἄνδρες
  choice: 十个患麻风的人
  rationale: 原文以形容词λεπροί描述这些人。“患麻风的人”在现代汉语中自然、尊重当事人，同时脚注说明该古代称谓不一定等同于现代医学上的特定诊断。
- source_word: οἳ ἔστησαν
  choice: 他们……站着
  rationale: 关系从句在汉语中拆为独立句更自然；“站着”保留ἵστημι在此处所表达的姿态或位置，不擅自解释为“停下”。
- source_word: πόρρωθεν
  choice: 远远地
  rationale: 准确表达空间上的远离，与“站着”搭配自然；“在远处”也是可行译法。
theological_decisions:
- issue: λεπροί所指疾病范围
  choice: 正文译“患麻风的人”，并以脚注说明古代用语的范围
  alternative: 患皮肤病的人
  rationale: “麻风”承接读者熟悉的圣经用语，但原词可涵盖多种严重皮肤疾患，未必是现代医学严格界定的麻风病。脚注既避免过度医学化，也不在正文中把范围武断缩窄或扩大。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“正……时”体现同时进行的动作；将希腊语关系从句拆成第二句，使汉语流畅。句末保留逗号，以衔接下一节人物的呼喊。
