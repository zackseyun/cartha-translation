  terminology: “上帝”与全书一致的神称谓用法相称；“荣耀归给”保留常见圣经术语而不失现代可读性。“外族人”避免了“陌生人”的泛化，也没有把本节原文较宽的称谓直接扩充为“撒玛利亚人”。脚注的“别国人／异乡人”作为备选可接受，并正确说明其以色列群体外者的语境含义。
