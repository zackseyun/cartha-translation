  yaml_path: translation/nt/luke/017/018.yaml
  text: Were none found to return and give glory to God except this foreigner?[a]
translation:
  language: zh_hans
  text: 除了这个外族人，难道没有别人回来把荣耀归给上帝吗？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“这个别国人”或“这个异乡人”；希腊语所用的词指外族人，即以色列群体之外的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρέθησαν
  choice: 难道没有别人
  rationale: 该词是“不被动过去时”，在这个反问句中带有“竟没有人被发现”的存在意味。汉语译作“难道没有别人”较自然，也保留了反问语气。
- source_word: ὑποστρέψαντες
  choice: 回来
  rationale: 分词表示转回并来到耶稣这里；“回来”在现代汉语中简洁自然，并与后面的目的动作连贯。
- source_word: δοῦναι δόξαν
  choice: 把荣耀归给
  rationale: 保留“给予荣耀”这一圣经惯用表达，同时用现代汉语常说的“把荣耀归给”清楚传达其含义。
- source_word: τῷ θεῷ
  choice: 上帝
  rationale: 指独一的上帝；此处无需在汉语中另行表达希腊语定冠词。
- source_word: εἰ μὴ
  choice: 除了……
  rationale: 此结构表示排除，译作“除了……没有……”符合现代汉语反问句式。
- source_word: ἀλλογενής
  choice: 外族人
  rationale: 该词字面指属于另一民族的人，在此突出他是以色列群体之外的人。“外族人”较“陌生人”更准确地保留民族与群体身份的意味。
- source_word: οὗτος
  choice: 这个
  rationale: 保留指示词的强调作用，突出眼前这位外族人。
theological_decisions:
- issue: 得医治者的民族及宗教群体外来者身份
  choice: 这个外族人
  alternative: 这个异乡人／这个别国人
  rationale: 上下文已说明此人是撒玛利亚人，但本节原文采用较宽泛的ἀλλογενής。译文不直接增补“撒玛利亚人”，而保留耶稣称他为以色列群体之外者的反讽与张力。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“难道没有别人……吗”体现原文反问语气；“把荣耀归给上帝”兼顾圣经表达传统与普通读者的可理解性。
