  source_fidelity: 译文准确传达反问句的核心：除这位被称为“外族人”的人之外，没有其他人回来将荣耀归给上帝。 “回来”对应ὑποστρέψαντες；“把荣耀归给上帝”恰当保留δοῦναι δόξαν τῷ θεῷ的圣经性表达；“除了……难道没有……”自然表达εἰ μὴ的排除和全句反问语气。虽未逐字呈现εὑρέθησαν的被动形式，但汉语以“难道没有别人”表达此处存在性反问，忠实且通顺。
