id: LUK.17.19
reference: Luke 17:19
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ· Ἀναστὰς πορεύου· ἡ πίστις σου σέσωκέν σε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/019.yaml
  text: And he said to him[a], “Rise and go[b]; your faith has saved you.”
translation:
  language: zh_hans
  text: 于是他对那人说：“起来，走吧！你的信心[b]救了你。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使你痊愈了”或“治好了你”。这个希腊语动词可指拯救、医治或使人康复。
    reason: lexical_alternative
  - marker: b
    text: 或译：“信靠”。这个希腊语词也可表示信靠或忠信，不过本处正文译作“信心”。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ εἶπεν αὐτῷ
  choice: 于是他对那人说
  rationale: καί承接上文，在叙事中自然译为“于是”；αὐτῷ按语境译为“对那人”，避免现代汉语中“他对他说”指代不清，也不额外指明说话者身份。
- source_word: Ἀναστὰς
  choice: 起来
  rationale: 该不定过去时分词与后面的命令连用，具有命令作用；“起来”简洁、自然，并保留原文的行动次序。
- source_word: πορεύου
  choice: 走吧
  rationale: 现在时中间语态命令式在这里是让那人上路离开；“走吧”符合现代汉语口吻，也保留温和而明确的命令语气。
- source_word: πίστις
  choice: 信心
  rationale: 此处指那人对耶稣所表现的信靠；“信心”是现代中文圣经语境中清楚而不过度释义的对应词，同时以脚注保留“信靠”的可能表达。
- source_word: σέσωκέν σε
  choice: 救了你
  rationale: σῴζω可指拯救、医治或使人康复。完成时表达已经发生并具有持续结果的行动；“救了你”保留比身体痊愈更宽广的含义，不把叙事中的神学张力缩减为医治。
theological_decisions:
- issue: 医治语境中σέσωκέν σε的含义
  choice: 救了你
  alternative: 使你痊愈了／治好了你
  rationale: 十个人都已得洁净，而这句话是对回来归荣耀给上帝的那个人说的，因此“救了你”能保留可能超越身体医治的意义；脚注同时说明该动词也可用于痊愈或医治，避免排除其语境含义。
- issue: πίστις在本节中的表达
  choice: 信心
  alternative: 信靠
  rationale: “信心”保留该词在信仰语境中的常用含义；“信靠”更突出主动倚赖，在本处也说得通，故列入脚注而不在正文中替换。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“起来，走吧”保持原文命令的简洁力度；脚注标记放在各自所解释的词语之后，以消除英文咨询层中标记位置与注释内容不对应的问题。
