  text: οὐδὲ ἐροῦσιν· Ἰδοὺ ὧδε ἤ· ⸀Ἐκεῖ· ἰδοὺ γὰρ ἡ βασιλεία τοῦ θεοῦ ἐντὸς ὑμῶν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/021.yaml
  text: Nor will they say[a], ‘Look, here!’ or ‘There!’ For behold, the kingdom of God is in your midst.”
translation:
  language: zh_hans
  text: 也没有人会说：“看哪，在这里！”或“在那里！”因为神的国就在你们中间。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“神的国就在你们里面。”希腊语词组既可指内在于人，也可指在一群人当中。
    reason: 保留ἐντὸς ὑμῶν在内在意义与群体性意义之间的歧义。
lexical_decisions:
- source_word: οὐδὲ ἐροῦσιν
  choice: 人也不会说
  rationale: 承接上一节的否定，并以现代汉语自然表达将来语气；补出泛指主语“人”。
- source_word: Ἰδοὺ
  choice: 看哪
  rationale: 保留指示并唤起注意的语气，庄重而且现代读者容易理解。
- source_word: ὧδε ἤ· Ἐκεῖ
  choice: 在这里！或说：在那里！
  rationale: 保留两个地点副词的鲜明对称；第二处补出“说”，使汉语引语结构清楚自然。
- source_word: γὰρ
  choice: 因为
  rationale: 明确表达本句对前文的解释关系。
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: 神的国
  rationale: 采用现代中文圣经语体中透明而凝练的表达，保留王权统治与国度领域两方面的可能含义。
- source_word: ἐντὸς ὑμῶν
  choice: 在你们中间
  rationale: ὑμῶν为复数；在耶稣面对群体说话且上下文谈论可指认地点的语境中，群体性的“在你们中间”较适合作正文，同时用脚注保留“在你们里面”的真实可能。
- source_word: ἐστιν
  choice: 就在
  rationale: 以“在”表达存在及位置，并用“就”传达ἰδοὺ所加强的当下指示意味，不额外规定国度存在的方式。
theological_decisions:
- issue: ἐντὸς ὑμῶν的含义
  choice: 神的国就在你们中间
  alternative: 神的国就在你们里面
  rationale: 原词组既可理解为群体中的临在，也可能指内在于“你们”。鉴于听众为复数且语境涉及“这里／那里”的地点指认，正文采用“在你们中间”；脚注保留“在你们里面”，避免消除原文真实存在的神学张力。
translation_notes:
  register: 采用现代、庄重且便于朗读的普通话。“看哪”保留两次ἰδοὺ的修辞呼应；以“神的国”避免把原文仅抽象化为“神的统治”。脚注标记置于相关分句之后。
