  text: Καὶ ἐγένετο ἐν τῷ ⸀πορεύεσθαι εἰς Ἰερουσαλὴμ καὶ αὐτὸς διήρχετο διὰ ⸀μέσον Σαμαρείας καὶ Γαλιλαίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/011.yaml
  text: And it happened that[a], as he was going to Jerusalem, he was passing through the midst of Samaria and Galilee.
translation:
  language: zh_hans
  text: 有一次，耶稣前往耶路撒冷时，正经过撒玛利亚和加利利之间。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“正从撒玛利亚和加利利中间经过。”希腊文此处可理解为行经两地之间，也可理解为行经两地交界一带。
    reason: 保留διὰ μέσον在路线描述上的真实歧义。
lexical_decisions:
- source_word: ἐγένετο
  choice: 事情是这样
  rationale: 这是路加常用的叙事引入语；此译法自然地开启新场景，不采用古雅的“于是发生了”。
- source_word: ἐν τῷ πορεύεσθαι
  choice: 前往……的时候
  rationale: 带介词ἐν的冠词化不定式表示同时发生的过程，用“……的时候”保留行程正在进行的意味。
- source_word: εἰς Ἰερουσαλήμ
  choice: 前往耶路撒冷
  rationale: εἰς在这里标明行程目的地；“前往”既准确又符合现代汉语表达。
- source_word: αὐτός
  choice: 耶稣
  rationale: 希腊文用显式代词承接上文人物；汉语为避免孤立经节中“他”所指不明，依语境明确为“耶稣”，不额外强化为“他自己”。
- source_word: διήρχετο
  choice: 正……经过
  rationale: 未完成时描写持续进行中的移动；“正……经过”体现其进行体。
- source_word: διὰ μέσον
  choice: 从……之间
  rationale: 该表达可能指两地之间或两地交界一带，也可能理解为从两地中间穿过；正文采用自然且不过度限定路线的“从……之间”，并以脚注保留另一理解。
- source_word: Σαμαρείας καὶ Γαλιλαίας
  choice: 撒玛利亚和加利利
  rationale: 采用现代中文圣经地名的通行译名，并保留希腊文中的排列次序。
theological_decisions: []
translation_notes:
