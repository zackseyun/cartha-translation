base_translation:
  language: en
  yaml_path: translation/nt/luke/017/037.yaml
  text: And answering[a], they say to him, “Where, Lord?” And he said to them, “Where the body is[b], there also the vultures will be gathered.”
translation:
  language: zh_hans
  text: 他们回答他说：“主啊，在哪里呢？”他对他们说：“躯体[b]在哪里，秃鹫[a]也必聚集在那里。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“鹰”。希腊词可指鹰；但在鸟聚集于躯体旁的语境中，译作“秃鹫”更能清楚表达食腐鸟的意象。
    reason: lexical_alternative
  - marker: b
    text: “躯体”也可译作“尸体”，这样会更明确地表达食腐鸟聚集的景象。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθέντες λέγουσιν
  choice: 他们回答说
  rationale: 用自然的现代汉语表达分词加历史现在时的组合；“回答说”保留回应的意味，不刻意复制希腊语在汉语中生硬的时态形式。
- source_word: Ποῦ, κύριε
  choice: 主啊，在哪里？
  rationale: Ποῦ直接询问地点；κύριε按对耶稣的称呼译为“主啊”。
- source_word: Ὅπου τὸ σῶμα
  choice: 躯体在哪里
  rationale: “躯体”对应σῶμα，并比直接译作“尸体”更能保留原词本身未明说死亡的余地；上下文中的食腐鸟意象仍使其含义清楚。
- source_word: ἀετοὶ
  choice: 秃鹫
  rationale: 该词可指鹰类，但在鸟聚集于躯体旁的语境中，食腐的“秃鹫”更符合所描绘的景象；“鹰”作为词义上的可能译法保留在脚注。
- source_word: ἐπισυναχθήσονται
  choice: 必聚集
  rationale: 以汉语自然的不及物表达传达将来被动形式所描绘的聚集结果；“必”体现将来陈述和格言式语气，但不说明聚集背后的施动者。
theological_decisions:
- issue: 关于躯体与秃鹫这一格言的审判意象
  choice: 直接保留这一意象，不指明其具体所指
  alternative: 明确解释为末日审判、罗马军队，或关于暴露与审判的一般原则
  rationale: 希腊文本没有说明该比喻的具体指向；译文不替读者裁定有争议的解释，以保留原文的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“他们回答说”自然传达原文回应结构；格言部分保持简洁、对称，不增添任何解释性指涉。脚注标记分别紧随相关词语或句子出现。
