  text: λέγω ὑμῖν, ταύτῃ τῇ νυκτὶ ἔσονται δύο ἐπὶ κλίνης μιᾶς, ⸀ὁ εἷς παραλημφθήσεται καὶ ὁ ἕτερος ἀφεθήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/034.yaml
  text: I tell you[a], on that night there will be two on one bed; one will be taken[b], and the other will be left.
translation:
  language: zh_hans
  text: 我告诉你们：在那一夜，将有两个人在一张床上；一个将被带走[a]，另一个将被留下[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被带走”也可译作“被带去”。这里的动词本身没有说明被带走是为蒙拯救还是受审判。
    reason: lexical_alternative
  - marker: b
    text: “被留下”也可译作“被撇下”；正文采用较中性的说法，以免加入原文没有明确表达的末世论联想。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: 我告诉你们
  rationale: 这是直接而带强调的陈述引语。译为“我告诉你们”符合现代汉语习惯，并保留对复数听众的直接称呼。
- source_word: ταύτῃ τῇ νυκτί
  choice: 在那一夜
  rationale: 该指示词与时间用法的与格指向所谈论的特定一夜；“在那一夜”自然、庄重，也符合上下文。
- source_word: ἔσονται δύο
  choice: 两个人同在
  rationale: 希腊文直译为“将有两个”，但结合后面的床，现代汉语以“两个人同在”更清楚自然；“将”的未来意义由后续两个“将被……”明确表达。
- source_word: ἐπὶ κλίνης μιᾶς
  choice: 一张床上
  rationale: κλίνη可指床或卧榻；夜间场景中“床”最自然。ἐπί在这里译作“在……上”。
- source_word: ὁ εἷς
  choice: 一个
  rationale: 冠词加数词在此作名词使用；汉语以“一个……另一个……”自然表达两者之间的对照。
- source_word: παραλημφθήσεται
  choice: 将被带走
  rationale: 这是παραλαμβάνω的将来时被动式，可表示被带去或被带在身边。“被带走”简洁自然，同时不自行判定这是蒙拯救还是受审判。
- source_word: ὁ ἕτερος
  choice: 另一个
  rationale: ἕτερος指两者中不同的另一个；“另一个”准确呈现成对对照。
- source_word: ἀφεθήσεται
  choice: 将被留下
  rationale: ἀφίημι在此与“被带走”相对，意为留下，而不是饶恕。“被留下”比“被撇下”更中性，可避免加入希腊文本未明说的末世论联想。
theological_decisions:
- issue: 被带走的人是得救还是受审判
  choice: 正文保持中性，只说“一个将被带走，另一个将被留下”。
  alternative: 可解释为被带走的人蒙拯救，也可解释为被带走的人遭受审判。
  rationale: 本节中的两个希腊动词本身并未明确被带走或被留下各自代表拯救还是审判，因此译文保留原文的神学张力，不引入特定的末世论体系。
translation_notes:
  register: 采用现代、清楚而庄重的普通话。“同在一张床上”自然表达两人处于同一床榻的场景，不额外界定两人的关系。脚注标记按其实际所解释的词分别置于“被带走”和“被留下”之后；所提供英文材料中第一个标记的位置与脚注内容明显不对应，未予沿用。
