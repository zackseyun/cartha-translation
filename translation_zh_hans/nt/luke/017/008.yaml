  text: ἀλλ’ οὐχὶ ἐρεῖ αὐτῷ· Ἑτοίμασον τί δειπνήσω καὶ περιζωσάμενος διακόνει μοι ἕως φάγω καὶ πίω, καὶ μετὰ ταῦτα φάγεσαι καὶ πίεσαι σύ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/008.yaml
  text: On the contrary[a], will he not say to him, ‘Prepare my supper, and gird yourself and serve me until I have eaten and drunk[b], and after that you will eat and drink’?”
translation:
  language: zh_hans
  text: 反而，他岂不会对他说：‘预备好我的晚饭，束好衣服，伺候我，等我吃喝完了[b]，之后你才吃喝’吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 或译“等我吃喝”。这里的希腊文也可较直译地这样表达；“吃喝完了”突出了他吃喝之后，对方才轮到吃喝。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’ οὐχὶ
  choice: 反而，他岂不会
  rationale: ἀλλά承接上文形成鲜明转折，οὐχί引出的反问预期肯定回答；“反而……岂不会”在现代汉语中保留两者的语用力量。
- source_word: ἐρεῖ αὐτῷ
  choice: 对他说
  rationale: 直接保留λέγω的基本义和αὐτῷ的间接宾语，不补入本节原文未出现的身份名词。
- source_word: Ἑτοίμασον τί δειπνήσω
  choice: 预备好我的晚饭
  rationale: τί δειπνήσω直译近于“我晚餐要吃的东西”；结合用餐语境译为“我的晚饭”，简洁自然，也保留δειπνέω所指的正餐或晚餐意味。
- source_word: περιζωσάμενος
  choice: 束上衣带
  rationale: 保留古代人为劳动或服侍而束起长衣的具体动作意象；脚注解释其文化含义。
- source_word: διακόνει μοι
  choice: 伺候我
  rationale: 此处指席间服侍。“伺候我”符合主仆场景且自然，避免“服事”可能带来的宗教专门色彩。
- source_word: ἕως φάγω καὶ πίω
  choice: 等我吃喝完了
  rationale: ἕως加不定过去时虚拟式在此指向主人吃喝这一行动的完成界限；“完了”清楚表达仆人随后才可用餐。
- source_word: μετὰ ταῦτα φάγεσαι καὶ πίεσαι σύ
  choice: 之后你才吃喝
  rationale: “之后”表达μετὰ ταῦτα的时间次序；“才”自然体现末尾显明主语σύ的对比强调，同时保留将来陈述的含义。
theological_decisions:
- issue: 比喻中的社会角色称谓
  choice: 本节只用代词“他”，不另补“仆人”或“奴隶”
  alternative: 为明确所指而译成“对那个仆人说”
  rationale: 上下文虽以δοῦλος为对象，本节本身只有代词。保持原文的指代方式，既不掩盖命令所呈现的主仆关系，也不在本节加添名词。
- issue: 末尾σύ的强调
  choice: 以“才”体现主人先吃喝、对方后吃喝的对比次序
  alternative: 译为“之后你自己吃喝”
  rationale: σύ确有显明的强调，但“你自己”在汉语中容易误解为亲自动手或独自用餐；“你才”更自然地表达本语境中的轮次对比。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“岂不会……吗”保留反问语气；引语中的命令简洁直接。“束上衣带”有意保留原文的古代服饰意象，并以脚注说明。
