base_translation:
  language: en
  yaml_path: translation/nt/luke/017/030.yaml
  text: It will be the same on the day when the Son of Man is revealed[a].
translation:
  language: zh_hans
  text: 人子显现的那一天，情形也会是这样[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“也必照样。”这个希腊语表达回指前面所举的例子。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ τὰ αὐτά
  choice: 也会是这样
  rationale: 该希腊习语回指前文挪亚和罗得时代的情形，表达“同样、照样”的比较意义；与ἔσται合译为“也会是这样”，既自然又保留将来指向。
- source_word: ἔσται
  choice: 会是
  rationale: εἰμί的将来时，表示将来会出现同样的情形；现代汉语用“会是”简洁自然。
- source_word: ᾗ ἡμέρᾳ
  choice: ……的那一天
  rationale: 关系代词与ἡμέρᾳ构成时间表达；汉语用“……的那一天”准确传达“在……之日”。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人子
  rationale: 保留耶稣在福音书中惯用的称号及其与《但以理书》第7章相关的末世和弥赛亚意涵。
- source_word: ἀποκαλύπτεται
  choice: 显现
  rationale: 该现在时被动态表示人子被揭示、公开显露；“显现”在现代汉语中自然，也保留末世语境下公开彰显的含义，而不误译为单纯的“来到”。
theological_decisions:
- issue: 末世称号ὁ υἱὸς τοῦ ἀνθρώπου的译法
  choice: 人子
  alternative: 那位人之子
  rationale: “人子”是中文圣经传统中明确且可识别的称号，能保留其与《但以理书》第7章的互文联系；替代译法较生硬，并可能削弱其作为固定称号的辨识度。
- issue: ἀποκαλύπτεται在本段中的含义
  choice: 显现
  alternative: 被揭示；来到
  rationale: 原词强调揭开、显露，而不只是移动或来临。“显现”较自然地表达公开彰显；“来到”会引入原动词本身没有的运动含义。“被揭示”更贴近被动态形式，但用于人子时汉语较不自然。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“人子显现的那一天”避免英语式后置关系从句；“也会是这样”顺畅回指上文，同时保留原文的比较意味和将来时态。
