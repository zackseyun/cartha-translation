translation:
  language: zh_hans
  text: 要记住罗得的妻子。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 参创世记19:26；罗得的妻子在所多玛毁灭时回头观看，就变成了一根盐柱。
    reason: cross_reference
lexical_decisions:
- source_word: μνημονεύετε
  choice: 要记住
  rationale: 现在时主动命令语气、第二人称复数，表达对众听者的直接劝诫。“要记住”在现代汉语中自然、明确；汉语不标示复数命令形式，也不刻意把现在时体貌扩译为“不断记住”。
- source_word: τῆς γυναικὸς
  choice: 妻子
  rationale: γυνή 可指“女人”或“妻子”；这里与人名“罗得”构成所属关系，明确指罗得的妻子。
- source_word: Λώτ
  choice: 罗得
  rationale: 采用现代简体中文圣经传统中通行的人名译法。
theological_decisions:
- issue: 警告及典故的表达形式
  choice: 保留简短而直接的命令：“要记住罗得的妻子。”
  alternative: “你们要记住罗得的妻子。”
  rationale: 原文动词为第二人称复数，但现代汉语可由语境表达受众，无须强加原文未明说的代词；简洁形式也保留耶稣警告的力度。经文对创世记叙事的具体背景以脚注说明，不在正文中增添解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。中文“罗得的妻子”已自然对应原文的所有格结构，因此不另设仅说明英语所有格差异的脚注。
