  yaml_path: translation/nt/luke/017/017.yaml
  text: Then Jesus answered[a], “Were not the ten cleansed? But where are the nine?”
translation:
  language: zh_hans
  text: 于是，耶稣回答说：“那十个人不是都得洁净了吗[a]？可是，那九个人在哪里呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“得洁净的不是十个人吗？”
    reason: 按汉语语序前置“得洁净的”的译法；正文则以“那十个人”为主语，较直接对应原文的句法焦点。
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ... εἶπεν
  choice: 于是，耶稣回答说
  rationale: 这是引出耶稣发言的常见叙事句式。用“回答说”自然表达分词与限定动词的组合；句首“于是”体现 δέ 在此推动叙事的轻微承接作用。
- source_word: Οὐχὶ οἱ δέκα ἐκαθαρίσθησαν
  choice: 得洁净的不是十个人吗
  rationale: οὐχί 引出预期肯定回答的反问。καθαρίζω 的被动式译为“得洁净”，保留疾病痊愈与礼仪上洁净两方面的含义，不将其缩减为单纯的“治好”。
- source_word: οἱ δὲ ἐννέα ποῦ
  choice: 可是，那九个人在哪里呢
  rationale: 此处 δέ 将没有回来的人与回来感谢的一人形成对比，故译为“可是”；“在哪里呢”自然保留原文质问性的语气。
theological_decisions:
- issue: 麻风病语境中 καθαρίζω 的含义
  choice: 译为“得洁净”
  alternative: 译为“得医治”或“病好了”
  rationale: 原词兼有身体恢复和成为洁净的含义。“得洁净”保存这种经文内部的重要张力，又不额外引入特定教义解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“十个人”避免只说“十个”可能造成的短促感；第二问保留“可是”和语气词“呢”，使对比和反问在口语可懂性与经文庄重感之间取得平衡。
