  text: καὶ ἰδὼν εἶπεν αὐτοῖς· Πορευθέντες ἐπιδείξατε ἑαυτοὺς τοῖς ἱερεῦσιν. καὶ ἐγένετο ἐν τῷ ὑπάγειν αὐτοὺς ἐκαθαρίσθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/014.yaml
  text: And when he saw them[a], he said to them, “Go and show yourselves to the priests.” And as they were going[b], they were cleansed.
translation:
  language: zh_hans
  text: 耶稣看见他们，就对他们说：“你们去，把自己呈给祭司察看[a]。”在他们去的路上，就洁净了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这吩咐反映了律法中祭司察验皮肤病患者是否恢复洁净的规定；参见《利未记》14章。
    reason: cross_reference
  - marker: b
    text: 或译“变得洁净”。希腊文这个动词在此可同时指身体上的痊愈和礼仪上的洁净。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: 看见他们
  rationale: 这是ὁράω的不定过去时分词，与主句“说”构成时间上的衔接；“他们”由上下文和随后的αὐτοῖς明确补出。
- source_word: Πορευθέντες
  choice: 你们去
  rationale: 该分词与随后的命令式连用，具有命令语气；译为“你们去”符合现代汉语，也保留行动的先后关系。
- source_word: ἐπιδείξατε ἑαυτοὺς
  choice: 把自己给……察看
  rationale: 原意是“把自己展示给……看”；在祭司检验皮肤病患者是否洁净的语境中，“给……察看”自然清楚，同时没有把检验结果预先写入命令。
- source_word: τοῖς ἱερεῦσιν
  choice: 祭司们
  rationale: 保留希腊文复数，所指是按律法负责察验并确认洁净的祭司。
- source_word: ἐγένετο ἐν τῷ ὑπάγειν αὐτοὺς
  choice: 他们去的时候
  rationale: 该结构表示同时发生的动作；这一译法简洁地表达他们在遵命前去的过程中发生了变化。
- source_word: ἐκαθαρίσθησαν
  choice: 得了洁净
  rationale: 被动式καθαρίζω在此兼有身体病患消除和礼仪上恢复洁净的含义；“得了洁净”比单译“治好了”更能保留这种双重意味。
theological_decisions:
- issue: 皮肤病语境中“洁净”用语的表达
  choice: 得了洁净
  alternative: 得了医治／变得洁净
  rationale: 原文强调“洁净”，既涉及身体恢复，也涉及可由祭司确认的礼仪洁净。正文保留“洁净”，不把含义缩减为单纯的医治。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“耶稣”按上下文明确主语；“祭司们”保留原文复数；“得了洁净”兼顾自然汉语与原文在身体和礼仪层面的含义。脚注标记依其在中文正文中首次出现的顺序重新安排。
