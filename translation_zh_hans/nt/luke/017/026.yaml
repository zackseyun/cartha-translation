  text: καὶ καθὼς ἐγένετο ἐν ταῖς ἡμέραις Νῶε, οὕτως ἔσται καὶ ἐν ταῖς ἡμέραις τοῦ υἱοῦ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/026.yaml
  text: And just as it happened in the days of Noah[a], so it will be also in the days of the Son of Man.
translation:
  language: zh_hans
  text: 挪亚的日子怎样，人子的日子也会怎样。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθὼς
  choice: 怎样
  rationale: 与后面的“也会怎样”构成自然的汉语对应结构，准确表达比较关系及其强调意味。
- source_word: ἐγένετο
  choice: 怎样
  rationale: 这里概括挪亚时代所发生的情形；汉语用“日子怎样”可自然涵盖事件性含义，又不具体添加原文未明说的内容。
- source_word: ἐν ταῖς ἡμέραις Νῶε
  choice: 挪亚的日子
  rationale: 保留原文的时间习语，在现代汉语中简洁易懂，也与后半句形成平行。
- source_word: οὕτως
  choice: 也会怎样
  rationale: 承接前句的“怎样”，表达“照样、同样如此”的比较结果。
- source_word: ἔσται
  choice: 会
  rationale: 明确表达将来意义，同时避免加入“发生”等可能使比较范围变窄的词。
- source_word: καὶ
  choice: 也
  rationale: 保留第二个 καί 所表达的对应和递进意味。
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: 人子
  rationale: 采用福音书中这一称号的通行译法，既贴近希腊语形式，也保留其可能呼应《但以理书》第7章的弥赛亚和末世意蕴。
theological_decisions:
- issue: τοῦ υἱοῦ τοῦ ἀνθρώπου 这一称号的译法
  choice: 人子
  alternative: 那位人
  rationale: “人子”是中文圣经传统中公认的称号，保留了字面形式、福音书中的基督论用法，以及可能来自《但以理书》第7章的末世背景；脚注提示另一种理解，而不在正文中消解其含义张力。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。前后两个“怎样”形成整齐的比较结构，保留原文对挪亚时代与人子时代之间对应关系的概括性，不擅自说明具体相似之处。
