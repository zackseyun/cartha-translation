  text: Δύο ἔσονται ἐν τῷ ἀγρῷ· εἷς παραληφθήσεται, καὶ ὁ ἕτερος ἀφεθήσεται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/036.yaml
  text: Two[a] men will be in the field; one will be taken, and the other will be left.
translation:
  language: zh_hans
  text: 两个人[a]会在田里；一个被接去，另一个被留下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节不见于现存最早的一些希腊文抄本（包括四世纪的《西奈抄本》和《梵蒂冈抄本》）及早期科普特文译本，但见于西方文本传统（如五世纪的《伯撒抄本》）、拜占庭多数文本传统和拉丁文《武加大译本》。本节可能是后来的抄写员为使此处与《马太福音》24:40一致而增添的。
    reason: textual_critical
lexical_decisions:
- source_word: παραληφθήσεται
  choice: 被接去
  rationale: 这是 παραλαμβάνω 的将来时被动形式。在末世语境中可指被带走或接到身边；“被接去”既与“被留下”形成鲜明对照，也不擅自说明被接去者最终的归宿。
- source_word: ἀφεθήσεται
  choice: 被留下
  rationale: 这是 ἀφίημι 的将来时被动形式，此处表示留在原处或被留在后面；“被留下”自然、准确，并保留上下文中的判断张力。
- source_word: ὁ ἕτερος
  choice: 另一个
  rationale: 指先前所说两人中的第二个人，现代汉语用“另一个”最清楚自然。
- source_word: ἐν τῷ ἀγρῷ
  choice: 在田里
  rationale: ἀγρός 在此指田地或野外耕作之处；“在田里”符合普通现代汉语表达。
theological_decisions:
- issue: “被接去”与“被留下”分别代表得救还是受审判
  choice: 不在译文中判定两者的最终结局
  alternative: 将 παραλαμβάνω 译成带有明确得救色彩的“被接到主那里”，或将其解释为被带去受审判
  rationale: 希腊文本本身只陈述一人被接去、另一人被留下；虽然语境具有末世审判色彩，但两者具体结局存在解释争议，译文应保留这种张力。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“两个人”补足希腊文中由阳性数词所表达的主体；脚注标记紧接该短语，提示整节的文本异文问题。
