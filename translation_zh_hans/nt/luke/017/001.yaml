  text: Εἶπεν δὲ πρὸς τοὺς μαθητὰς ⸀αὐτοῦ· Ἀνένδεκτόν ἐστιν τοῦ ⸂τὰ σκάνδαλα μὴ ἐλθεῖν⸃, ⸂πλὴν οὐαὶ⸃ δι’ οὗ ἔρχεται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/001.yaml
  text: Then he said to his disciples[a], “It is impossible for stumbling blocks not to come, but woe to the one through whom they come.”
translation:
  language: zh_hans
  text: 耶稣又对他的门徒说：“使人跌倒的事[a]不可能不发生；但那使这些事发生的人有祸了！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使人犯罪的事”“引人犯罪的诱惑”。希腊语σκάνδαλα指使人在道德或属灵上绊跌、陷入罪中的事物。
    reason: 说明关键词σκάνδαλα的语义范围，并表明正文中的“跌倒”不是普通的身体跌倒或单纯受到冒犯。
lexical_decisions:
- source_word: Εἶπεν δὲ
  choice: 耶稣又……说
  rationale: δέ在此是轻微的承接词，译作“又”符合现代汉语叙事习惯；根据上下文补出主语“耶稣”，使独立经节自然清楚。
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: 对他的门徒
  rationale: 明确表达原文中的所属代词αὐτοῦ，并保留路加福音中μαθηταί的惯常译法“门徒”。
- source_word: Ἀνένδεκτόν ἐστιν
  choice: 不可能
  rationale: 保留ἀνένδεκτος“不可能”的基本语气；与后面的否定结构结合，表达这些事必然会发生。
- source_word: τοῦ τὰ σκάνδαλα μὴ ἐλθεῖν
  choice: 使人跌倒的事不可能不发生
  rationale: 以汉语双重否定重现原文“不发生是不可能的”这一结构，同时调整语序，使表达自然。
- source_word: σκάνδαλα
  choice: 使人跌倒的事
  rationale: 保留σκάνδαλον使人绊跌的形象，也让读者听出其道德和属灵含义，而不把它过早限定为冒犯、诱惑或某一种犯罪原因。
- source_word: πλὴν οὐαὶ
  choice: 但……有祸了
  rationale: “但”表现πλήν带来的转折，即这些事虽不可避免，使其发生的人仍要承担严重责任；“有祸了”自然传达οὐαί的警告和哀叹。
- source_word: δι’ οὗ ἔρχεται
  choice: 那使这些事发生的人
  rationale: 以单数的“那……的人”保留代表性个人指称，并用“使这些事发生”自然表达διά所表示的媒介或责任关系。
theological_decisions:
- issue: σκάνδαλα在伦理教导中的含义
  choice: 正文译作“使人跌倒的事”
  alternative: “冒犯人的事”“使人犯罪的事”“引人犯罪的诱惑”
  rationale: 该词指使人在道德或属灵上跌倒的因素，不只是令人不快或受到冒犯。正文保留跌倒的比喻，脚注列出主要含义，避免把经文范围缩窄。
- issue: 不可避免性与个人责任之间的张力
  choice: 保留“不可能不发生；但……有祸了”的并列表达
  alternative: 将前半句意译为“这些事无可避免”，或加入解释以调和两者
  rationale: 原文同时断言这类事件必会出现，又宣告促成它们的人有祸；译文不把必然性解释成免责，也不额外说明其关系。
- issue: δι’ οὗ的单数个人指称
  choice: 译作“那使这些事发生的人”
  alternative: “那个人”“经由谁”
  rationale: 保留原文对具体责任承担者的单数指向，同时采用不额外凸显性别的自然汉语。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“使人跌倒的事”保留原文比喻；“有祸了”延续圣经警告语的力度，又不使用生僻文言。标点和句式适合公开诵读。
