  text: εἷς δὲ ἐξ αὐτῶν, ἰδὼν ὅτι ἰάθη, ὑπέστρεψεν μετὰ φωνῆς μεγάλης δοξάζων τὸν θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/015.yaml
  text: But one of them[a], seeing that he had been healed, returned, glorifying God with a loud voice,
translation:
  language: zh_hans
  text: 但他们中有一个人，看见自己已经痊愈，就回来，大声赞美[a]上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“将荣耀归给上帝”。希腊语动词可表示“赞美”，也可表示“荣耀”或“归荣耀于”。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἷς δὲ ἐξ αὐτῶν
  choice: 但他们中有一个人
  rationale: εἷς ἐξ αὐτῶν是部分结构，意为“他们中有一个人”；δέ在此带出与其余九人的叙事对比，用“但”自然贴切。
- source_word: ἰδὼν
  choice: 看见
  rationale: ὁράω的简过去主动分词，表示他察觉自己痊愈后采取行动；“看见”保留原文简洁的分词关系。
- source_word: ὅτι ἰάθη
  choice: 自己已经痊愈
  rationale: ἰάθη是ἰάομαι的简过去被动形式，指医治已经发生；现代汉语以“已经痊愈”自然表达他所察觉的完成状态。
- source_word: ὑπέστρεψεν
  choice: 就回来
  rationale: ὑποστρέφω在叙事中通常指返回；“就”自然衔接看见痊愈与返回这一行动，而不额外说明返回地点。
- source_word: μετὰ φωνῆς μεγάλης
  choice: 大声
  rationale: 该短语是以响亮声音说话或呼喊的惯用表达；“大声”符合现代汉语表达，也避免生硬直译为“用大声音”。
- source_word: δοξάζων τὸν θεόν
  choice: 赞美上帝
  rationale: δοξάζω可指荣耀、归荣耀于或赞美；此处伴随“大声”的言语行为，用“赞美上帝”最自然，同时脚注保留“荣耀”的词义关联。
theological_decisions:
- issue: δοξάζων τὸν θεόν的表达
  choice: 赞美上帝
  alternative: 荣耀上帝／将荣耀归给上帝
  rationale: 原文描述得医治者返回时高声δοξάζω上帝。“赞美”在此语境中自然传达可听见的颂赞行为；脚注保留“荣耀”这一重要词义，避免将其语义范围单一化。
- issue: τὸν θεόν的译法
  choice: 上帝
  alternative: 神
  rationale: 原文仅称τὸν θεόν，不宜作任何教义性扩展；“上帝”是现代标准汉语中庄重且通行的对应词。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“但”体现与其余九人的对比；“看见自己已经痊愈，就回来”保持原文事件推进；以“大声赞美”呈现可听见的行动，并用脚注保存δοξάζω的“荣耀”语义。
