  text: ἤσθιον, ἔπινον, ἐγάμουν, ⸀ἐγαμίζοντο, ἄχρι ἧς ἡμέρας εἰσῆλθεν Νῶε εἰς τὴν κιβωτόν, καὶ ἦλθεν ὁ κατακλυσμὸς καὶ ἀπώλεσεν ⸀πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/027.yaml
  text: They were eating[a], they were drinking, they were marrying, they were being given in marriage, until the day Noah entered into the ark, and the flood came and destroyed them all.
translation:
  language: zh_hans
  text: 人们照常吃喝；有人娶妻，有人被嫁出去，直到挪亚进入方舟的那一天；洪水来了，把他们全都毁灭了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤσθιον, ἔπινον
  choice: 一直吃喝
  rationale: 两个未完成时动词描绘过去持续或惯常进行的活动；“一直”自然地体现这种持续状态，并与“直到”相呼应。
- source_word: ἐγάμουν
  choice: 娶妻
  rationale: 主动形式指娶配偶；“娶妻”保留了它与后一个被动婚嫁动词的区别。
- source_word: ἐγαμίζοντο
  choice: 出嫁
  rationale: 该被动形式指被交付婚配；现代汉语用“出嫁”简洁自然地表达这一社会习俗，同时与“娶妻”构成对应。
- source_word: ἄχρι ἧς ἡμέρας
  choice: 直到……的那一天
  rationale: 准确标明前述持续活动的时间终点，符合现代汉语表达。
- source_word: εἰσῆλθεν Νῶε εἰς τὴν κιβωτόν
  choice: 挪亚进入方舟
  rationale: 按叙事中的完成事件直译；“方舟”是挪亚故事语境中 κιβωτός 的通行准确译法。
- source_word: ὁ κατακλυσμός
  choice: 洪水
  rationale: 清楚、自然地表达创世记背景中的大洪水。
- source_word: ἀπώλεσεν πάντας
  choice: 把他们全都毁灭了
  rationale: πάντας 指语境中的所有人；“他们全都”既补明汉语所需的宾语，也保留审判无一例外的整体性。
theological_decisions:
- issue: 两个婚嫁动词是否分别表达
  choice: 娶妻、出嫁
  alternative: 结婚；娶妻、被许配出嫁
  rationale: 原文使用两个不同的未完成时动词，一主动、一被动。分别译出能保留原文对日常婚嫁活动的成对描写，又不赋予额外的教义含义。
- issue: 开头一系列未完成时的体貌
  choice: 用“一直”呈现持续或惯常活动
  alternative: 不标示持续性，仅译作“吃喝、娶妻、出嫁”
  rationale: 未完成时描绘日常生活持续进行，直到洪水突然来到；“一直……直到……”能在自然汉语中保留这一叙事对比。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“人们”明确未完成时复数动词的泛指主语；分号突出日常生活持续进行与洪水突然来到之间的转折。
