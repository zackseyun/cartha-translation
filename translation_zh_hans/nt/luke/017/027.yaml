review_pass:
  verdict: revise
  source_fidelity: 原文四个未完成时描绘洪水前持续、惯常的日常活动；“吃喝、娶妻、出嫁”大体传达此意。“一直”虽可与“直到”呼应，却较容易被理解为毫不停歇地持续，略强于原文的惯常/进行体。更重要的是，ἐγαμίζοντο 是被动形式，单用“出嫁”未明确保留其“被嫁出去／被许配”的被动语态。
  naturalness: 修订后采用“照常”表达日常生活照常进行的语境，并以“有人……，有人……”使“被嫁出去”在现代汉语中更顺畅。全句保持现代、庄重的叙事语体。
  terminology: “挪亚”“方舟”“洪水”均为恰当且通行的用语。“娶妻”对应主动的ἐγάμουν；“被嫁出去”对应被动的ἐγαμίζοντο，避免将两个动词合并或抹平语态差别。
  issues:
  - severity: medium
    issue: “出嫁”未充分表达ἐγαμίζοντο的被动语态。
    rationale: “出嫁”在现代汉语通常作为主体自行出嫁的表达，不明示“被给予婚配”的被动关系；原文在此刻意使用与前一主动动词不同的被动形式。
  - severity: low
    issue: “一直”对未完成时的表达略偏强。
    rationale: 未完成时可表示持续或惯常活动；“一直”容易暗示不间断。用“照常”较自然地保留本节所强调的日常生活仍在继续，同时不作过强断言。
  revised_text: 人们照常吃喝；有人娶妻，有人被嫁出去，直到挪亚进入方舟的那一天；洪水来了，把他们全都毁灭了。
  revised_footnotes:
