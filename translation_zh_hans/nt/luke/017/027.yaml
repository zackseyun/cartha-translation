- from: 人们一直吃喝、娶妻、出嫁[a]，直到挪亚进入方舟的那一天；洪水来了，把他们全都毁灭了。
  to: 人们照常吃喝；有人娶妻，有人被嫁出去，直到挪亚进入方舟的那一天；洪水来了，把他们全都毁灭了。
  rationale: 将婚嫁短语改为“有人娶妻，有人被嫁出去”，明确保留原文主动与被动的配对，且符合现代汉语。以“照常”替代“一直”，更稳妥地传达未完成时所刻画的日常、惯常活动。因修订文本涉及婚嫁动词这一需说明的语态差别，保留并更新脚注锚点[a]。
