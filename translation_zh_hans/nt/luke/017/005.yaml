  text: Καὶ εἶπαν οἱ ἀπόστολοι τῷ κυρίῳ· Πρόσθες ἡμῖν πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/005.yaml
  text: And the apostles said to the Lord[b][a], “Increase our faith.”
translation:
  language: zh_hans
  text: 使徒们对主说：“求你加增我们的信心。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “信心”也可理解为“信靠”。“加增”所译的希腊语动词字面意思是“添加”，因此整句话也可译作“求你把信加给我们”。在其他语境中，“信”还可指“忠信”，但这里这样理解的可能性较小。
    reason: 保留 προστίθημι 的字面译法及 πίστις 的语义范围。
lexical_decisions:
- source_word: Καὶ
  choice: （不单独译出）
  rationale: 希腊语 Καὶ 在这里连接上下文；现代汉语叙事中直接起句更自然，并未损失明确的时间或逻辑关系。
- source_word: εἶπαν
  choice: 说
  rationale: 简单过去叙事动作，汉语用“说”即可自然表达。
- source_word: οἱ ἀπόστολοι
  choice: 使徒们
  rationale: “使徒”是路加—使徒行传中 ἀπόστολοι 的通行且准确译法；“们”清楚表达复数。
- source_word: τῷ κυρίῳ
  choice: 对主
  rationale: κύριος 在此指耶稣，译作“主”既符合称谓语境，也保留路加叙事中的基督论分量。
- source_word: Πρόσθες
  choice: 求你加增
  rationale: προστίθημι 字面为“添加”，与 πίστιν 连用时表达使已有的信心增长；“加增”既保留原词意象，也符合中文圣经语体。加入“求你”自然表达祈使句在此处的请求语气。
- source_word: ἡμῖν
  choice: 我们的
  rationale: 原文为与格“给我们／向我们”；汉语与“加增……信心”搭配时，转换为领属结构“我们的”更自然。
- source_word: πίστιν
  choice: 信心
  rationale: 此处最自然地指使徒对神的信靠；“信心”比单用“信”更适合“加增”这一数量或程度表达，同时保留“信靠”的语义。
theological_decisions:
- issue: κύριος 指耶稣时的译法
  choice: 主
  alternative: 主人／夫子
  rationale: “主”既是此处自然的尊称，也不削弱 κύριος 在路加叙事中可能具有的基督论含义。
- issue: πίστις 的语义
  choice: 信心
  alternative: 信靠；忠信
  rationale: 使徒请求其 πίστις 得以增加，语境最适合解作对神的信靠或信心；“忠信”虽属于该词的语义范围，但在此较不可能。脚注保留相关语义说明。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“加增”略带经文语体，但意义清楚，并能贴近希腊语“添加”的表达。脚注标记已在正文中出现。
