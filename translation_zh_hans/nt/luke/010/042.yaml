  text: ⸂ὀλίγων δέ ἐστιν χρεία ἢ ἑνός⸃· ⸂Μαριὰμ γὰρ⸃ τὴν ἀγαθὴν μερίδα ἐξελέξατο ἥτις οὐκ ἀφαιρεθήσεται ⸀αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/042.yaml
  text: But few things are needed—or one[a]. For Mary has chosen the good portion[b], which will not be taken away from her.
translation:
  language: zh_hans
  text: 但所需的不过几样，或是一件[a]。因为马利亚选择了那美好的一份[b]，这份不会从她那里被夺去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“只有一件事是必要的。”在用餐的语境中，这句话也可更具体地理解为：“只需要几道菜，或只需一道。”
    reason: alternative_reading
  - marker: b
    text: 或译：“那美好的部分。”这里的“一份”可能既呼应用餐时的一份，也比喻真正有价值的所得。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀλίγων δέ ἐστιν χρεία ἢ ἑνός
  choice: 但所需要的不过几样，甚至一样
  rationale: χρεία ἐστιν表示“有需要、是必要的”；ὀλίγων与ἑνός形成“几样／一样”的紧凑对照。“甚至”在现代汉语中自然表达ἤ在此可能具有的递进修正意味，同时不明确补出“菜”或“事”，保留其可指饭食安排、也可指真正必要之事的歧义。
- source_word: Μαριὰμ
  choice: 马利亚
  rationale: 采用现代中文圣经语境中广为人知的人名译法。
- source_word: τὴν ἀγαθὴν μερίδα
  choice: 那美好的份
  rationale: μερίς可指分得的一份、份额或部分；“份”既能呼应用餐情境，也能表达比喻意义上的所得。ἀγαθή直译为“美好的”，不擅自改成带比较级含义的“更好的”。
- source_word: ἐξελέξατο
  choice: 选择了
  rationale: 该不定过去时中间语态表示马利亚为自己作出的选择；中文“选择了”自然呈现已作出的决定，并由下句说明其持久结果。
- source_word: ἥτις οὐκ ἀφαιρεθήσεται αὐτῆς
  choice: 是不会从她那里被夺去的
  rationale: 关系代词回指“那美好的份”；未来被动式ἀφαιρεθήσεται表示日后不会被拿走。“夺去”自然体现从某人那里取走其所得之意。
theological_decisions:
- issue: “所需要的不过几样，甚至一样”与马大的服事及马利亚的选择有何关系
  choice: 正文不补明所需的是几道菜还是一件根本必要的事，保留“几样／一样”的开放表达。
  alternative: 可理解为“只需要几道菜，甚至一道就够了”，也可理解为“只有一件事是必要的”。
  rationale: 希腊文在用餐处境中的实际指向和更广泛的属灵指向之间保有张力；译文不越过原文替读者作出单一解释。
- issue: ἀγαθὴν μερίδα是否应译成比较级“更好的份”
  choice: 译为“那美好的份”。
  alternative: “那更好的份”。
  rationale: ἀγαθή是原级“好的／美好的”，并非比较级；译作“更好的”会加入原文未明说的比较判断。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“不过几样，甚至一样”保持原文简练及解释上的开放性；“美好的份”避免生硬的“份额”，也保留用餐与比喻意义可能并存的双关。
