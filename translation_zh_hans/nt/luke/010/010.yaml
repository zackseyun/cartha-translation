  text: εἰς ἣν δ’ ἂν πόλιν ⸀εἰσέλθητε καὶ μὴ δέχωνται ὑμᾶς, ἐξελθόντες εἰς τὰς πλατείας αὐτῆς εἴπατε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/010.yaml
  text: But whatever city you enter and they do not receive you[a], go out into its streets and say,
translation:
  language: zh_hans
  text: 但无论你们进哪座城，若那里的人不接待你们，就要出去，到那城的大街[a]上去，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“公共广场”或“宽阔的街道”。希腊文指宽阔、公开的通道或场所。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἣν δ’ ἂν πόλιν
  choice: 但无论你们进了哪座城
  rationale: 关系结构配合ἄν表达不定、概括性的情形；“无论……哪座城”自然保留开放性的条件意味。δέ以“但”承接并转折于前文。
- source_word: εἰσέλθητε
  choice: 进了
  rationale: 不定过去时虚拟语气位于不定关系从句中；“进了”简洁表达进入城中的动作，并与后续条件自然衔接。
- source_word: μὴ δέχωνται ὑμᾶς
  choice: 那里的人若不接待你们
  rationale: δέχομαι在此指接纳、接待受差遣者；“接待”既包含欢迎，也保留实际接纳的较宽含义。希腊文主语隐含为城中的人，译文补出“那里的人”以使现代汉语清楚自然。
- source_word: ἐξελθόντες
  choice: 你们就到
  rationale: 该分词表示在主命令“说”之前发生的伴随行动。按汉语习惯用“就到……说”表达动作次序，避免生硬直译为“出去以后”。
- source_word: τὰς πλατείας αὐτῆς
  choice: 城里的大街上
  rationale: πλατεῖα指宽阔、公开的街道或公共场所。“大街上”在现代汉语中自然，并突出公开宣告的场景；可能的“广场”义收入脚注。
- source_word: εἴπατε
  choice: 说
  rationale: λέγω的不定过去时命令式，直接引出下一节的话；“说”准确而自然。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“接待”保留宣教语境中接纳使者的宽泛含义；“大街上”配脚注呈现πλατεῖα在街道与公共广场之间的词义范围。
