  text: εἶπεν δὲ αὐτοῖς· Ἐθεώρουν τὸν Σατανᾶν ὡς ἀστραπὴν ἐκ τοῦ οὐρανοῦ πεσόντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/018.yaml
  text: And he said to them[a], “I was watching Satan fall like lightning from heaven.”
translation:
  language: zh_hans
  text: 他对他们说[a]：“我正看着撒但像闪电一样从天上坠落。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我看见撒但像闪电一样从天上坠落。”希腊文的未完成过去时也可较简洁地译为“我看见”，但“我正看着”更能体现动作的持续或进行视角。
    reason: 词义与动词体貌的译法选择
lexical_decisions:
- source_word: εἶπεν δὲ αὐτοῖς
  choice: 他对他们说
  rationale: εἶπεν作为叙事中的简单过去动作，译为“说”；αὐτοῖς译为“对他们”。δέ是轻微连接词，现代汉语在此省译更自然，也不额外限定与上文的逻辑关系。
- source_word: Ἐθεώρουν
  choice: 我正看着
  rationale: θεωρέω的未完成过去时带有未完成体或持续观察的意味。“正看着”在现代汉语中自然地保留这一侧重，同时脚注提供较简洁的“我看见”。
- source_word: τὸν Σατανᾶν
  choice: 撒但
  rationale: Σατανᾶς在此作为人物称号或专名使用；“撒但”是现代中文圣经语境中通行且可辨识的音译。
- source_word: ὡς ἀστραπὴν
  choice: 像闪电一样
  rationale: ὡς引出明喻；“像闪电一样”既自然，也保留原文的比较意象，不明确限定所比较的是速度、突然性还是光亮。
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: 从天上
  rationale: οὐρανός可指天空或天界；此处“天上”保留两者可能交叠的空间和神学含义，比单译“天空”更合适。
- source_word: πεσόντα
  choice: 坠落
  rationale: 该不定过去分词以宾语补足结构描写撒但的下落。“坠落”准确表达从高处落下，并与“从天上”自然搭配；不另加“已经”，以免过度确定时间关系或完成状态。
theological_decisions:
- issue: 耶稣所说撒但坠落的时间与所指事件
  choice: 译作“我正看着撒但……坠落”，保留未完成体的观察视角，不说明这是远古事件、门徒当时传道所带来的结果，还是对最终失败的预见。
  alternative: 也可译作“我看见撒但像闪电一样从天上坠落”。
  rationale: 希腊文呈现看见或观看撒但坠落的景象，却没有单凭本句明确规定这一景象的具体时间定位。译文不应把有争议的神学解释写入正文。
- issue: “像闪电一样”具体比较的层面
  choice: 保留明喻，不说明是指速度、突然性、光亮或其他特征。
  alternative: 解释性译为“迅速地”或“突然地”。
  rationale: 原文只给出闪电的意象，没有明确指出比较点；直保留意象可避免缩窄含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“正看着”比“正在观看”更口语自然，又不失经文语体；“坠落”较“掉下来”庄重，并保留原文强烈的下降意象。
