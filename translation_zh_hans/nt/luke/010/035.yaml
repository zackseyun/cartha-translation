  text: καὶ ἐπὶ τὴν ⸀αὔριον ἐκβαλὼν ⸂δύο δηνάρια ἔδωκεν⸃ τῷ πανδοχεῖ καὶ ⸀εἶπεν· Ἐπιμελήθητι αὐτοῦ, καὶ ὅ τι ἂν προσδαπανήσῃς ἐγὼ ἐν τῷ ἐπανέρχεσθαί με ἀποδώσω σοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/035.yaml
  text: And on the next day[a], taking out two denarii, he gave them to the innkeeper and said, ‘Take care of him, and whatever more you spend, I will repay you when I return.’
translation:
  language: zh_hans
  text: 第二天，他拿出两个第纳尔[a]，交给客店老板，说：“照顾他；无论你另外花费多少，我回来时都会还给你。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 第纳尔是罗马常用的一种银币，约相当于一个工人一天的工资。
    reason: 文化背景说明；保留历史钱币名称，同时帮助现代读者理解其大致价值。
lexical_decisions:
- source_word: ἐπὶ τὴν αὔριον
  choice: 第二天
  rationale: 这是表示随后一天的惯用时间短语；“第二天”符合现代汉语叙事习惯。
- source_word: ἐκβαλών
  choice: 拿出
  rationale: 此处分词指从随身所有之物中取出钱币；“拿出”自然准确，不采用字面而过强的“抛出”。
- source_word: δύο δηνάρια
  choice: 两个第纳尔
  rationale: 原文直接使用罗马钱币名称；音译保留历史文化背景，不把币值解释性改写为“两天的工资”。
- source_word: πανδοχεῖ
  choice: 客店主人
  rationale: 该词指经营或管理客店的人，而非客店建筑；“客店主人”明确且适合庄重的现代叙事语体。
- source_word: Ἐπιμελήθητι αὐτοῦ
  choice: 请照顾他
  rationale: 准确传达要求对方悉心照料的命令语气；“请”使引语在现代汉语中自然，但不削弱其嘱托意味。
- source_word: ὅ τι ἂν προσδαπανήσῃς
  choice: 无论你另外花费多少
  rationale: “无论……多少”保留数额不定的含义，“另外”体现 προσ- 所表示的额外支出。
- source_word: ἐν τῷ ἐπανέρχεσθαί με
  choice: 等我回来时
  rationale: 以自然的汉语时间从句表达带 ἐν 的冠词化不定式结构。
- source_word: ἀποδώσω σοι
  choice: 我都会还给你
  rationale: 在金钱语境中表达偿还垫付费用；“还给你”通俗自然，“都会”也承接前面的不定范围。
theological_decisions: []
