  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ τὸν κονιορτὸν τὸν κολληθέντα ἡμῖν ἐκ τῆς πόλεως ὑμῶν ⸂εἰς τοὺς πόδας⸃ ἀπομασσόμεθα ὑμῖν· πλὴν τοῦτο γινώσκετε ὅτι ⸀ἤγγικεν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/011.yaml
  text: 'Even the dust from your city that clung to our feet[a], we wipe off against you[d][c][b]. Nevertheless know this: the kingdom of God has come near.'
translation:
  language: zh_hans
  text: 连你们城里沾在我们脚上的尘土，我们也要擦去，作为反对你们的见证。不过，你们要知道：上帝的国已经临近了[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: 或译“已经近了”。原文的完成时表示上帝的国已经临近，而这种临近仍具有现实意义。
    reason: lexical_alternative
lexical_decisions:
- source_word: κονιορτός
  choice: 尘土
  rationale: 该词特指细尘；“尘土”既准确，也保留这一举动在差遣语境中的象征意味。
- source_word: κολληθέντα
  choice: 沾在
  rationale: 分词表示尘土附着其上；“沾在我们脚上”符合现代汉语，也准确表达附着之意。
- source_word: ἐκ τῆς πόλεως ὑμῶν
  choice: 你们城里的
  rationale: ἐκ表示来源；汉语用“你们城里的尘土”自然地表达尘土来自该城。
- source_word: εἰς τοὺς πόδας
  choice: 在我们脚上
  rationale: 原文直译近于“到脚上”，在这里是描述尘土附着于使者的脚；按汉语习惯译为“在我们脚上”。
- source_word: ἀπομασσόμεθα
  choice: 我们也要擦掉
  rationale: 该动词具体指擦去、抹去，而不是通常相关经文所说的“抖掉”；“擦掉”准确且通俗。
- source_word: ὑμῖν
  choice: 以此指证你们
  rationale: 此处与格在差遣和拒绝的语境中带有针对对方、作为见证的意味；这样译出审判性指向，同时没有把动作解释为纯粹的清洁行为。
- source_word: πλήν
  choice: 不过
  rationale: 该连词引出强烈的转折限定：尽管有上述指证，有一件事对方仍必须知道。
- source_word: γινώσκετε
  choice: 你们要知道
  rationale: 现在时命令语气要求听者认识并承认这一事实；“要知道”直接自然。
- source_word: ἤγγικεν
  choice: 已经临近了
  rationale: 完成时表示已经发生并持续有效的临近；“已经临近了”兼顾事件性和当前意义。
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: 上帝的国
  rationale: 这是现代汉语中清楚、庄重且通行的表达；既不把“国”缩减为地点，也不必在正文中解释为“统治”。
theological_decisions:
- issue: 擦去尘土这一举动的作用
  choice: 这是针对拒绝者、作为指证和审判见证的象征性行动
  alternative: 只是出于卫生或旅途需要的动作
  rationale: ὑμῖν与整段差遣语境表明，这一动作针对拒绝信息的人；“以此指证你们”保留其司法性和见证意味。
- issue: 上帝之国临近的含义
  choice: 上帝的国已经临近，并且这种临近仍具有现实效力
  alternative: 只表示将来在时间上即将来到，或表示上帝的国已经完全终极实现
  rationale: 完成时ἤγγικεν表达已经到来的临近及其持续意义，却没有宣称终末已经完全实现；译文保留这种末世张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“凡沾在我们脚上的”理顺了希腊语较为紧凑的修饰关系；“就连”保留Καὶ在此处的强调作用。正文不把上帝之国的临近解释为完全实现，也不削弱为单纯的未来预告。
