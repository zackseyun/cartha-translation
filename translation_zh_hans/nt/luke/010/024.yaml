  text: λέγω γὰρ ὑμῖν ὅτι πολλοὶ προφῆται καὶ βασιλεῖς ἠθέλησαν ἰδεῖν ἃ ὑμεῖς βλέπετε καὶ οὐκ εἶδαν, καὶ ἀκοῦσαι ἃ ἀκούετε καὶ οὐκ ἤκουσαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/024.yaml
  text: For I tell you that many prophets and kings desired to see what you see and did not see it[a], and to hear what you hear and did not hear it.
translation:
  language: zh_hans
  text: 因为我告诉你们：许多先知和君王曾渴望看见你们所看见的，却没有看见；也渴望听见你们所听见的，却没有听见。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: 因为我告诉你们
  rationale: “告诉你们”自然表达 λέγω 与间接受词 ὑμῖν；“因为”保留 γάρ 与上文所述福分之间的解释关系。
- source_word: πολλοὶ προφῆται καὶ βασιλεῖς
  choice: 许多先知和君王
  rationale: 直接保留数量词及两个历史身份类别；βασιλεῖς 译为“君王”，不泛化为“统治者”。
- source_word: ἠθέλησαν
  choice: 曾想
  rationale: θέλω 在此表示意愿或愿望。“曾想”简洁自然，也与后面的未能实现形成对照；脚注保留语气较强的译法。
- source_word: ἰδεῖν ἃ ὑμεῖς βλέπετε
  choice: 看见你们所看见的
  rationale: 保留“看见”的重复和平行结构，并以“你们所看见的”自然表达关系从句。
- source_word: καὶ οὐκ εἶδαν
  choice: 却没有看见
  rationale: “却”清楚呈现愿望与事实之间的反差；不另加宾语，因为中文可由上文自然补足。
- source_word: ἀκοῦσαι ἃ ἀκούετε καὶ οὐκ ἤκουσαν
  choice: 想听见你们所听见的，却没有听见
  rationale: 与前半句保持“想……却没有……”的对称，并保留 ἀκούω 的听觉含义。
theological_decisions:
- issue: “先知和君王”的身份
  choice: 保留“先知和君王”，不作解释性扩展
  alternative: “古时的先知和君王”或“先知和统治者”
  rationale: 原文仅列出这两个类别，以他们未曾看见、听见的经历与门徒所得启示形成张力；译文不补入“古时”等原文未明说的信息。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“因为”承接上文，“君王”保留经文语体；分号突出“看见”与“听见”两组平行句。
