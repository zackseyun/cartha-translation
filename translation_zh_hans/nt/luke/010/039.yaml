  text: καὶ τῇδε ἦν ἀδελφὴ καλουμένη ⸀Μαριάμ, ἣ καὶ ⸂παρακαθεσθεῖσα πρὸς⸃ τοὺς πόδας τοῦ ⸀Ἰησοῦ ἤκουεν τὸν λόγον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/039.yaml
  text: And she had a sister called Mary[a], who also sat at Jesus’ feet and was listening to his word.
translation:
  language: zh_hans
  text: 她有一个姐妹，名叫马利亚；马利亚也坐在耶稣[a]脚前，聆听他的话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“主”。
    reason: textual_variant
lexical_decisions:
- source_word: τῇδε
  choice: 她
  rationale: 阴性单数指示代词回指上一节的马大；现代汉语用“她”最自然。
- source_word: ἀδελφὴ
  choice: 妹妹
  rationale: ἀδελφή本身可指姐姐或妹妹；依叙事中通常的中文表达译作“妹妹”，但原词并未明示长幼。
- source_word: καλουμένη Μαριάμ
  choice: 名叫马利亚
  rationale: 准确而自然地表达分词καλουμένη引出人名的用法。
- source_word: παρακαθεσθεῖσα πρὸς τοὺς πόδας
  choice: 坐在……脚前
  rationale: 既表达她就坐的位置，也保留在老师脚前聆听所呈现的门徒姿态，不额外解释。
- source_word: τοῦ Ἰησοῦ
  choice: 耶稣
  rationale: 所给SBLGNT正文明确作Ἰησοῦ，因此正文按原文译为“耶稣”；异文“主”列入脚注。
- source_word: ἤκουεν
  choice: 听
  rationale: 未完成时表示持续进行的聆听；汉语在此用“听”即可由语境自然表达持续状态。
- source_word: τὸν λόγον αὐτοῦ
  choice: 他的话
  rationale: 贴近λόγος的基本含义，并保留它可指言语、教导或信息的语义宽度。
theological_decisions:
- issue: “坐在……脚前”中的人名或称号之文本异文
  choice: 耶稣
  alternative: 主
  rationale: 所提供的SBLGNT正文采用Ἰησοῦ（耶稣）；“主”是有抄本支持的异文，故不取代正文，而在脚注中保存。
- issue: 坐在耶稣脚前的含义
  choice: 保留具体姿态，不释译为“作门徒”或“领受教导”
  alternative: 坐下来作他的门徒，听他教导
  rationale: 该姿态在文化语境中可呈现门徒聆听老师的形象，但经文本身没有直接使用“门徒”一词，故避免把隐含意义写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“坐在耶稣脚前”保留原文意象；为避免关系代词造成中文指代含混，第二句重提“马利亚”。
