  text: Σαμαρίτης δέ τις ὁδεύων ἦλθεν κατ’ αὐτὸν καὶ ⸀ἰδὼν ἐσπλαγχνίσθη,
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/033.yaml
  text: But a Samaritan[a], as he traveled, came to where he was, and when he saw him, he was moved with compassion.
translation:
  language: zh_hans
  text: 可是，有一个撒玛利亚人在旅途中来到他那里，看见他，就动了怜悯的心[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“就怜悯他。”
    reason: 提供ἐσπλαγχνίσθη较简洁的词义译法；脚注标记置于它实际说明的短语之后。
lexical_decisions:
- source_word: Σαμαρίτης
  choice: 撒玛利亚人
  rationale: 这是现代汉语中对该族群兼宗教身份的标准称呼，能保留比喻中这一身份所具有的社会与叙事张力。
- source_word: δέ
  choice: 可是
  rationale: 此处与前文祭司和利未人的反应形成对比；“可是”自然地表达转折。
- source_word: τις
  choice: 有一个
  rationale: 表达不定指，符合现代汉语叙事习惯，也不必生硬地译成“某一个”。
- source_word: ὁδεύων
  choice: 在旅途中
  rationale: 该现在分词交代持续进行的背景行动；“在旅途中”简洁自然，不把意思收窄为偶然“路过”。
- source_word: ἦλθεν κατ’ αὐτόν
  choice: 来到他那里
  rationale: κατά加宾格在本语境中表示来到受伤者所在之处；这一译法清楚表达空间关系。
- source_word: ἰδών
  choice: 看见他
  rationale: 该不定过去时分词表示先于主句动作发生的情形；汉语按“看见……就……”的次序自然呈现。
- source_word: ἐσπλαγχνίσθη
  choice: 就动了怜悯的心
  rationale: 该动词表示发自内心的深切怜悯；此译法既保留强烈的情感色彩，又是普通读者容易理解的现代汉语。
theological_decisions:
- issue: 如何表达撒玛利亚人的怜悯而不加入后来的道德或教义解释
  choice: 就动了怜悯的心
  alternative: 就怜悯他
  rationale: 正文保留原词所表达的深切、由内而发的怜悯，却不扩展为经文未明说的恩典、邻舍之爱或其他神学阐释。
translation_notes:
  register: 采用自然、庄重而通俗的现代标准汉语。“撒玛利亚人”为通行名称；“在旅途中”保留背景动作；“动了怜悯的心”兼顾原文的情感力度与现代可懂度。
