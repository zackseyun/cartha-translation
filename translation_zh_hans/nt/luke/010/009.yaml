  text: καὶ θεραπεύετε τοὺς ἐν αὐτῇ ἀσθενεῖς, καὶ λέγετε αὐτοῖς· Ἤγγικεν ἐφ’ ὑμᾶς ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/009.yaml
  text: And heal the sick in it[a], and say to them, ‘The kingdom of God has come near to you.’
translation:
  language: zh_hans
  text: 医治城里的病人，并对他们说：‘上帝的国已经临近你们了。’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θεραπεύετε
  choice: 医治
  rationale: 现在时主动命令式要求持续实行这一行动；“医治”在差遣门徒服事病人的语境中自然准确，也不像“照顾”那样宽泛。
- source_word: τοὺς ἐν αὐτῇ ἀσθενεῖς
  choice: 城里的病人
  rationale: ἀσθενεῖς本可指软弱者或患病者，但与θεραπεύετε连用时主要指患病的人；阴性代词αὐτῇ回指上一节的城，因此明说“城里”比直译“其中”更自然清楚。
- source_word: λέγετε αὐτοῖς
  choice: 对他们说
  rationale: 直接保留简单明确的言说命令，不增添“宣告”等解释性色彩。
- source_word: Ἤγγικεν
  choice: 已经临近
  rationale: 完成时表示临近这一行动已经发生并具有当前效力；“已经临近”既传达过程与现今关联，也保留究竟如何临近的开放性。
- source_word: ἐφ’ ὑμᾶς
  choice: 你们
  rationale: 在ἐγγίζω与ἐπί加宾格的结构中，表达上帝之国向听者临近；现代汉语“临近你们”自然地传达这种关系，而不误导为敌对的“临到你们身上”。
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: 上帝的国
  rationale: 这是现代汉语中清楚且沿用已久的圣经表达，可涵盖上帝的统治与其国度，不将语义范围缩窄为单一层面。
theological_decisions:
- issue: 上帝之国临近的含义
  choice: 宣告上帝的国已经向听者临近，并具有当下意义，但不进一步界定其实现程度。
  alternative: 明确译成上帝的国已经完全来到，或仅仅即将在未来来到。
  rationale: 完成时ἤγγικεν兼有已经发生的临近与当前结果；本节不足以彻底解决上帝之国已经实现和将来实现之间的张力，因此译文保持原文的开放性。
translation_notes:
  register: 采用自然、庄重、易懂的现代标准普通话。“城里”明确承接上一节的城市；整体保持两个并列命令和随后的直接引语。无需脚注，因为“已经临近”可直接承载ἤγγικεν的主要语义与时态效果。
