  verdict: approve
  source_fidelity: 译文准确呈现两个现在时命令（“医治”“说”）、城中病人、以及上帝之国“已经临近”听者的宣告。‘已经临近你们了’恰当反映ἤγγικεν的完成体所表达的既已发生并具当前关联的临近，未把其译成完全实现或仅属未来。
  naturalness: “医治城里的病人，并对他们说”是自然、庄重的现代标准汉语；“上帝的国已经临近你们了”虽带有适度的圣经宣告语体，仍清晰通顺，并适合本句直接引语。
  terminology: “医治”与θεραπεύετε在此病患语境相符；“病人”准确处理ἀσθενεῖς；“上帝的国”保留既有圣经核心术语及其统治和国度的开放语义。无需为英文的‘has drawn near’另设脚注，因为中文“已经临近”已自然涵盖该可选表达，且没有造成实质性歧义。
