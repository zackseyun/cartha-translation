id: LUK.10.19
reference: Luke 10:19
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἰδοὺ ⸀δέδωκα ὑμῖν τὴν ἐξουσίαν τοῦ πατεῖν ἐπάνω ὄφεων καὶ σκορπίων, καὶ ἐπὶ πᾶσαν τὴν δύναμιν τοῦ ἐχθροῦ, καὶ οὐδὲν ὑμᾶς οὐ μὴ ⸀ἀδικήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/019.yaml
  text: Behold[a], I have given you the authority to tread on snakes and scorpions, and over all the power of the enemy[b], and nothing will ever harm you.
translation:
  language: zh_hans
  text: 看哪，我已经赐给你们权柄，使你们能踏在蛇和蝎子[a]上，也能胜过仇敌一切的能力；绝不会有任何事伤害你们[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “蛇和蝎子”也可理解为带有象征意味的形象；在本段语境中，它们可能使人联想到敌对的属灵势力。
    reason: 保留字面意象，同时提示语境可能具有的象征层面。
  - marker: b
    text: 或译：“绝没有什么能伤害你们。”希腊文使用了加强语气的否定表达。
    reason: 说明原文强烈的将来否定语气，并提供可行的替代译法。
lexical_decisions:
- source_word: ἰδού
  choice: 看哪
  rationale: 保留引起听者注意并加强语气的功能；用语庄重，也为现代普通读者所熟悉。
- source_word: δέδωκα
  choice: 我已经赐给
  rationale: 以“已经……给”表达希腊语完成时所指的既成行动及其当前效力；“赐给”符合授予权柄的语境。
- source_word: ἐξουσίαν
  choice: 权柄
  rationale: 表示获授的权利或权威，并与后文表示力量、能力的 δύναμις 区分。
- source_word: τοῦ πατεῖν
  choice: 可以践踏
  rationale: 表达所赐权柄的内容，并保留脚踏其上的具体意象；“践踏”比“踩着走”庄重凝练。
- source_word: ἐπάνω ὄφεων καὶ σκορπίων
  choice: 蛇和蝎子
  rationale: 直接保留原文的具体形象，不在正文中预先判定其为字面、象征或兼具二者。
- source_word: ἐπὶ πᾶσαν τὴν δύναμιν
  choice: 胜过……一切能力
  rationale: 在现代汉语中自然表达所获权柄高于并能制伏仇敌全部力量的关系，同时避免生硬的“在……之上”。
- source_word: δύναμιν
  choice: 能力
  rationale: 与前面的“权柄”形成原文 ἐξουσία 与 δύναμις 的词义区别。
- source_word: τοῦ ἐχθροῦ
  choice: 仇敌
  rationale: 保留原文单数且带人格指向的称呼，不在正文中明确增译为撒但或魔鬼。
- source_word: οὐδὲν ... οὐ μὴ ἀδικήσῃ
  choice: 没有任何东西能伤害你们
  rationale: “没有任何”以自然汉语传达 οὐδέν 与 οὐ μή 构成的强烈否定；“伤害”符合此处语境，又不把含义缩窄为单纯身体损伤。
theological_decisions:
- issue: “仇敌”的所指
  choice: 正文保留“仇敌”，不明确指名撒但
  alternative: 撒但；魔鬼
  rationale: 上下文涉及鬼服从和撒但坠落，强烈提示撒但性的敌对势力，但本节希腊文本只说“仇敌”；保留其概括性可避免把解释写入正文。
- issue: “蛇和蝎子”的字面与象征意义
  choice: 正文保留具体意象，不判定其解释层次
  alternative: 明确解释为邪灵势力；同时明说字面与象征双重含义
  rationale: 词语本身指蛇和蝎子，但语境也可能赋予它们敌对属灵势力的象征或代表意义；译文不应消除这种开放性。
- issue: “不能伤害”承诺的范围
  choice: 按原文译出绝对而强烈的否定，不在正文中加限定
  alternative: 限定为属灵伤害；限定为最终伤害；限定为执行使命期间的伤害
  rationale: 原文措辞强烈，却未在本句说明伤害的种类、时限或终极意义；翻译保留其张力，把范围问题留给上下文解释。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“看哪”和“权柄”保留经文语体所需的郑重感；其余句法力求自然。“可以践踏……并胜过……”使同一个“权柄”自然统摄两个并列对象。所有脚注标记均置于正文相应词句之后。
