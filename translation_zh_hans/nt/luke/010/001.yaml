id: LUK.10.1
reference: Luke 10:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Μετὰ δὲ ταῦτα ἀνέδειξεν ὁ κύριος ⸀καὶ ἑτέρους ἑβδομήκοντα ⸀δύο καὶ ἀπέστειλεν αὐτοὺς ἀνὰ δύο ⸁δύο πρὸ προσώπου αὐτοῦ εἰς πᾶσαν πόλιν καὶ τόπον οὗ ἤμελλεν αὐτὸς ἔρχεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/001.yaml
  text: After these things[a], the Lord appointed seventy-two others also, and sent them two by two ahead of him into every town and place where he himself was about to go.
translation:
  language: zh_hans
  text: 这些事以后，主又选定了另外七十二人[a]，差遣他们两人一组，先他一步到他自己将要去的各城各地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“七十人”。
    reason: textual_variant
lexical_decisions:
- source_word: Μετὰ δὲ ταῦτα
  choice: 这些事以后
  rationale: 保留复数指示语和时间推进关系；表达自然、庄重。
- source_word: ἀνέδειξεν
  choice: 选定
  rationale: 此处指为特定任务选出并指定人员；“选定”既不只是挑选，也不过度加入制度性任命的含义。
- source_word: ὁ κύριος
  choice: 主
  rationale: 按新约常规译法处理 κύριος；在本段语境中指耶稣。
- source_word: καὶ ἑτέρους ἑβδομήκοντα δύο
  choice: 又……另外七十二人
  rationale: “又”体现 καί 的增添意味，“另外”传达 ἑτέρους；正文依 SBLGNT 采用“七十二”，异文另注。
- source_word: ἀπέστειλεν
  choice: 差遣
  rationale: 准确表达受命被派出的行动，同时避免把名词性的使徒身份强加于此。
- source_word: ἀνὰ δύο δύο
  choice: 两人一组
  rationale: 用现代汉语自然表达希腊语的分配结构，即每两个人组成一组。
- source_word: πρὸ προσώπου αὐτοῦ
  choice: 先他一步
  rationale: 表达他们在他到达之前先行的意思，比逐字译作“在他面前”更符合此处语境。
- source_word: εἰς πᾶσαν πόλιν καὶ τόπον
  choice: 到……各城各地
  rationale: 保留 πόλις 与 τόπος 的并列表达，并以简洁自然的汉语涵盖每一座城和每一处地方。
- source_word: οὗ ἤμελλεν αὐτὸς ἔρχεσθαι
  choice: 他自己将要去的
  rationale: “将要”保留 μέλλω 的前瞻意味，“他自己”体现 αὐτός 的强调；汉语从先行者视角自然使用“去”。
theological_decisions:
- issue: 受选人数的文本异文
  choice: 七十二人
  alternative: 七十人
  rationale: SBLGNT 正文作 ἑβδομήκοντα δύο（七十二）；“七十”是重要抄本异文，因此正文依所给底本，另以脚注保存异读，不作教义化处理。
translation_notes:
  register: 采用现代、清楚而庄重的普通话。“两人一组”和“先他一步”使句意自然易懂，同时保留差遣的分组方式、先行作用及“他自己”的强调。
