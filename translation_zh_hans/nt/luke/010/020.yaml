id: LUK.10.20
reference: Luke 10:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: πλὴν ἐν τούτῳ μὴ χαίρετε ὅτι τὰ πνεύματα ὑμῖν ὑποτάσσεται, χαίρετε δὲ ὅτι τὰ ὀνόματα ὑμῶν ⸀ἐγγέγραπται ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/020.yaml
  text: Nevertheless[a], do not rejoice in this, that the spirits submit to you[c][b], but rejoice that your names have been written in the heavens.
translation:
  language: zh_hans
  text: 然而，不要因灵[a]服从你们而欢喜；却要因你们的名字已经记在诸天中而欢喜[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“灵”从上下文看是敌对的属灵存在，也可译作“邪灵”或“鬼”；但希腊文在本节只说“灵”。
    reason: lexical_alternative
  - marker: b
    text: 或译“在天上”。希腊文采用复数，直译为“在诸天中”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: 然而
  rationale: 表达对门徒先前喜乐的强烈转折和纠正，现代汉语自然且庄重。
- source_word: ἐν τούτῳ μὴ χαίρετε ... χαίρετε δὲ
  choice: 不要因……而欢喜；却要因……而欢喜
  rationale: 以同一动词重现 χαίρω 的反复和鲜明对比；“因……而”自然表达喜乐所基于的事情。
- source_word: τὰ πνεύματα
  choice: 这些灵
  rationale: 定冠词结合上文所指，译作“这些灵”较自然；保留“灵”的宽泛词义，不在正文中擅自具体化为“鬼”或“邪灵”。
- source_word: ὑμῖν ὑποτάσσεται
  choice: 服从你们
  rationale: 清楚表达这些灵处在门徒权柄之下的含义，同时保持现代汉语的自然表达。
- source_word: τὰ ὀνόματα ὑμῶν
  choice: 你们的名字
  rationale: 直接、自然地表达希腊文的所属关系。
- source_word: ἐγγέγραπται
  choice: 已经记在
  rationale: “已经”体现完成时所表达的既成行动及其持续结果；“记在”在登记姓名的语境中比单纯“写在”更自然。
- source_word: ἐν τοῖς οὐρανοῖς
  choice: 在诸天之上
  rationale: 保留 οὐρανοῖς 的复数形式，同时采用庄重且可理解的汉语表达。
theological_decisions:
- issue: 这些灵的性质
  choice: 这些灵
  alternative: 邪灵／鬼
  rationale: 上下文表明它们是敌对的属灵存在，但本节只说 πνεύματα（灵）。正文不将其词义缩窄，注释说明语境。
- issue: 名字登记之处
  choice: 诸天之上
  alternative: 天上
  rationale: 保留希腊文 οὐρανοῖς 的复数，不把它默默归一为传统的单数表达；注释提供自然的传统译法。
- issue: 名字被记下的时态含义
  choice: 已经记在
  alternative: 记在／写在
  rationale: 希腊文完成时表示名字已被记下，并且这一结果仍然成立；“已经记在”兼顾既成性与现存状态。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。通过“不要因……而欢喜；却要因……而欢喜”保留原文的平行对比；“这些灵”承接上文而不作过度神学限定，“诸天之上”则有意保留原文复数。
