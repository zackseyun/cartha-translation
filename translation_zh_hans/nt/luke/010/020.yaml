  terminology: 保留“灵”，不将πνεύματα缩窄为“邪灵”或“鬼”；保留“已经记在”以表达完成时所指向的既成登记及其持续结果。将地点改为“诸天中”，准确表达介词ἐν及复数οὐρανοῖς。
