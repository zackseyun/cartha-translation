  text: Ὑπέστρεψαν δὲ οἱ ἑβδομήκοντα ⸀δύο μετὰ χαρᾶς λέγοντες· Κύριε, καὶ τὰ δαιμόνια ὑποτάσσεται ἡμῖν ἐν τῷ ὀνόματί σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/017.yaml
  text: Then the seventy-two returned with joy[a], saying, “Lord, even the demons submit to us in your name.”
translation:
  language: zh_hans
  text: 那七十二人[a]欢喜地回来，说：“主啊，连鬼也奉你的名服从我们。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“七十人”。
    reason: textual_variant
lexical_decisions:
- source_word: Ὑπέστρεψαν
  choice: 回来
  rationale: 不定过去时陈述他们完成使命后返回；“回来”是现代汉语中自然、准确的表达。
- source_word: δὲ
  choice: 那
  rationale: δέ在这里推动叙事发展；结合汉语语序，以“那七十二人……回来”自然承接上文，不另加生硬的连接词。
- source_word: οἱ ἑβδομήκοντα δύο
  choice: 那七十二人
  rationale: 遵循SBLGNT正文的“七十二”；“那”承接先前受差遣的特定群体。重要异文“七十人”收入脚注。
- source_word: μετὰ χαρᾶς
  choice: 满心欢喜地
  rationale: 表达带着喜乐归来的状态，保留χαρά的情感力度，同时符合现代汉语习惯。
- source_word: λέγοντες
  choice: 说
  rationale: 该分词引出直接引语；汉语用“说”即可自然保留其叙事功能。
- source_word: Κύριε
  choice: 主啊
  rationale: κύριος为对耶稣的呼格称呼；译作“主啊”准确、庄重，并体现直接呼告。
- source_word: καὶ
  choice: 连……也
  rationale: 这里καί具有递进、强调作用，表达门徒惊喜地指出甚至鬼也服从他们。
- source_word: τὰ δαιμόνια
  choice: 鬼
  rationale: δαιμόνια指敌对的灵界存在；“鬼”是简洁、常用且符合新约语境的中文表达，避免扩译为“邪灵”。
- source_word: ὑποτάσσεται
  choice: 服从
  rationale: 该形式在此表示处于顺服、受制的状态；“服从我们”自然传达其受门徒权柄制伏之意，而不额外说明使役关系。
- source_word: ἡμῖν
  choice: 我们
  rationale: 作为ὑποτάσσω所支配的与格，汉语在“服从我们”中无需另加介词。
- source_word: ἐν τῷ ὀνόματί σου
  choice: 奉你的名
  rationale: 该短语表示行动与耶稣之名及其权柄相关；“奉你的名”是自然中文，也保留借其名施行权柄的含义。
theological_decisions:
- issue: 受差遣门徒人数的文本异文
  choice: 七十二人
  alternative: 七十人
  rationale: 所提供的SBLGNT正文作“七十二”；“七十”是重要且广为人知的异文，因此在脚注中保留，不在正文中混合两个读法。
- issue: “奉你的名”的权柄含义
  choice: 奉你的名
  alternative: 因你的名／在你的名里
  rationale: 希腊语ἐν τῷ ὀνόματί σου可表达与耶稣之名相关的凭借或权柄。“奉你的名”在现代汉语中最自然，同时不把这种关系过度限定为单纯原因或空间意义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“满心欢喜地”传达喜乐的明显程度；“连鬼也”保留门徒话语中的惊喜和递进语气。脚注标记紧随存在异文的“七十二人”，使对应关系清楚。
