  yaml_path: translation/nt/luke/010/026.yaml
  text: And he said to him[a], “What is written in the Law? How do you read it?”
translation:
  language: zh_hans
  text: 耶稣对他说：“律法上写着什么？你怎样读呢[a]？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你怎样理解？”希腊原文直译为“你怎样读呢？”，在这里也可能含有理解或解释经文的意思。
    reason: 词义备选
lexical_decisions:
- source_word: ὁ δὲ
  choice: 耶稣
  rationale: 希腊文以带冠词的代词性结构表示“他”，上下文所指为耶稣。汉语为避免指代含混，明示“耶稣”；δέ仅作轻微承接，无须机械译出。
- source_word: εἶπεν πρὸς αὐτόν
  choice: 对他说
  rationale: 自然、准确地表达λέγω与πρός加宾格所标明的受话人，不额外加入“回答”等原文未明说的语气。
- source_word: Ἐν τῷ νόμῳ
  choice: 律法上
  rationale: 这里的νόμος指以色列公认的圣经律法；“律法上”是现代汉语中询问经文记载时自然的表达。
- source_word: τί γέγραπται
  choice: 写的是什么
  rationale: γέγραπται为完成时被动语态，强调已经写下且现今载于经文之中的内容；此译符合汉语习惯并保留对成文经书的诉诸。
- source_word: πῶς ἀναγινώσκεις
  choice: 你是怎样读的
  rationale: ἀναγινώσκεις的基本义是“读”；在此语境也可能涉及理解或解释。正文保留“读”，以维持原文的开放性，并以脚注说明可能的语用含义。
theological_decisions:
- issue: νόμος在耶稣问题中的所指
  choice: 译作“律法”，指赐给以色列并被公认为经书的律法
  alternative: “妥拉”或泛指一般法律
  rationale: 对话对象是律法师，问题询问经书中所写的内容。“律法”既符合上下文，也不会用音译过度限定读者的理解。
- issue: πῶς ἀναγινώσκεις的解释意味
  choice: 正文保留“你是怎样读的”
  alternative: “你怎样理解？”或“你怎样解释？”
  rationale: 问题很可能不仅询问诵读，也在追问对经文的理解；但动词的直接词义仍是“读”。保留字面表达，可避免把原文的修辞与神学张力提前化解。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。以“律法上写的是什么”表达对成文经书的询问；脚注标记紧随存在词义歧义的“读的”之后。
