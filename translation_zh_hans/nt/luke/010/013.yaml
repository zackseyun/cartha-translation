source:
  edition: SBLGNT
  text: Οὐαί σοι, Χοραζίν· οὐαί σοι, Βηθσαϊδά· ὅτι εἰ ἐν Τύρῳ καὶ Σιδῶνι ⸀ἐγενήθησαν αἱ δυνάμεις αἱ γενόμεναι ἐν ὑμῖν, πάλαι ἂν ἐν σάκκῳ καὶ σποδῷ ⸀καθήμενοι μετενόησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/013.yaml
  text: Woe to you[a], Chorazin! Woe to you, Bethsaida! For if the mighty works that happened among you had happened in Tyre and Sidon, long ago they would have repented[b], sitting in sackcloth and ashes.
translation:
  language: zh_hans
  text: “哥拉汛啊，你有祸了！伯赛大啊，你有祸了！因为若那些在你们中间发生的大能作为[a]发生在推罗和西顿，他们早就会身披麻布、坐在灰烬中悔改了[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“神迹”；希腊文指彰显能力的作为。
    reason: lexical_alternative
  - marker: b
    text: 或译“改变心意”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαί σοι
  choice: 你有祸了
  rationale: 保留先知式哀叹与审判宣告的双重语气；比单纯的“可叹”更有警告力度，也符合现代汉语表达。
- source_word: Χοραζίν / Βηθσαϊδά
  choice: 哥拉汛／伯赛大
  rationale: 采用现代简体中文圣经传统中通行的地名译法。
- source_word: δυνάμεις
  choice: 大能作为
  rationale: 兼顾“能力”与具体“作为”两层含义，避免直接用“神迹”把词义收窄为技术性类别。
- source_word: ἐγενήθησαν ... αἱ γενόμεναι
  choice: 施行……施行
  rationale: 希腊文两处均用 γίνομαι 表示发生、出现；在“大能作为”的汉语搭配中，“施行”更自然，同时保留两处用词的呼应，不明说施行者。
- source_word: ἐν ὑμῖν
  choice: 在你们中间
  rationale: 这里复数“你们”指受责备城镇中的居民；“在你们中间”清楚表达这些作为发生的范围。
- source_word: πάλαι
  choice: 早就
  rationale: 自然表达反事实条件句中“很久以前便已如此”的时间含义。
- source_word: ἐν σάκκῳ καὶ σποδῷ καθήμενοι
  choice: 披着麻布、坐在灰中
  rationale: 具体保留麻布、灰和坐下的悔罪哀恸图景，没有将其抽象化为一般的悲伤。
- source_word: μετενόησαν
  choice: 悔改
  rationale: “悔改”是路加语境中 μετανοέω 的准确、通行译法，涵盖思想与生命方向的转变。
theological_decisions:
- issue: δυνάμεις 所指的性质
  choice: 正文译作“大能作为”
  alternative: 神迹；有能力的作为
  rationale: 该词在此指彰显非凡能力的事，但词本身着重能力及其作为；“大能作为”既保留这一重点，也不额外限定其神学类别。
- issue: 悔改的外在图景
  choice: 保留“披着麻布、坐在灰中”
  alternative: 披麻蒙灰悔改；以哀恸表示悔改
  rationale: 原文明确包含表示姿态的分词 καθήμενοι，保留具体动作和物象可呈现先知传统中的哀恸与悔罪情景，而不把它仅仅概括为内心状态。
- issue: 反事实陈述的力度
  choice: 译作“如果……他们早就会……”
  alternative: 如果……他们或许早已……
  rationale: 希腊文 εἰ 加过去时陈述配合 ἄν，表达与事实相反的确定推断；“会”比“或许”更准确，不弱化耶稣宣告的力度。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“你有祸了”保留直接责备的先知语气；“早就会”使反事实条件句符合现代汉语习惯。正文中的所有脚注标记均与脚注对应。
