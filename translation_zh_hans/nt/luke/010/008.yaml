  text: καὶ εἰς ἣν ἂν πόλιν εἰσέρχησθε καὶ δέχωνται ὑμᾶς, ἐσθίετε τὰ παρατιθέμενα ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/008.yaml
  text: And into whatever city you enter[a], if they receive you, eat what is set before you[b],
translation:
  language: zh_hans
  text: 无论你们进哪一座城，若那里的人接待你们，就吃摆在你们面前的食物。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς ἣν ἂν πόλιν
  choice: 无论……哪一座城
  rationale: 关系代词ἣν与ἄν构成不定、泛指表达；“无论……哪一座城”自然传达“任何一座城”的意思。介词εἰς所表达的进入方向由“进”体现。
- source_word: εἰσέρχησθε
  choice: 你们进
  rationale: 现在时虚拟语气用于泛指情形；汉语用“进”简洁自然，并保留进入城中的动作。
- source_word: δέχωνται ὑμᾶς
  choice: 若那里的人接待你们
  rationale: δέχομαι在此可指“接待、欢迎”。“接待”既贴近词义，也符合门徒进入城镇并受款待的语境；补出“那里的人”使希腊语第三人称复数主语在汉语中清楚。
- source_word: ἐσθίετε
  choice: 就吃
  rationale: 现在时命令语气表达指示；“就吃”承接前面的条件，符合现代汉语习惯，不额外强化持续意义。
- source_word: τὰ παρατιθέμενα ὑμῖν
  choice: 他们摆在你们面前的食物
  rationale: παρατίθημι在用餐语境中指把食物摆到人面前。译文保留“摆在……面前”的被供应意象，并补出“食物”以避免汉语表达含混。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“接待”比“接受”更符合款待旅人的具体语境；全句保留泛指条件和直接命令的结构。
