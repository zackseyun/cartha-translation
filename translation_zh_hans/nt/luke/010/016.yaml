  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ὁ ἀκούων ὑμῶν ἐμοῦ ἀκούει, καὶ ὁ ἀθετῶν ὑμᾶς ἐμὲ ἀθετεῖ· ὁ δὲ ἐμὲ ἀθετῶν ἀθετεῖ τὸν ἀποστείλαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/016.yaml
  text: The one who hears you hears me[a], and the one who rejects you rejects me; but the one who rejects me rejects the one who sent me.
translation:
  language: zh_hans
  text: “听你们的，就是听我；拒绝[a]你们的，就是拒绝我；而拒绝我的，就是拒绝差遣我来的那一位。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拒绝”或译“漠视”、“弃绝”。希腊语ἀθετέω也可指不予理会或将某人置于一旁。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ ἀκούων
  choice: 听……的
  rationale: 带冠词的现在分词在此作名词用，泛指具有这一行为的人。汉语用“听……的”既自然，也保留原文的概括性表达。
- source_word: ὑμῶν / ἐμοῦ
  choice: 你们 / 我
  rationale: ἀκούω 后的属格指所听的人。直译为“你们”和“我”，保留耶稣把人对门徒的回应与对自己的回应直接联系起来的个人性表达，不擅自补入“信息”或“教导”。
- source_word: ἀκούει
  choice: 听
  rationale: 与前面的ἀκούων重复同一词根，译作“听”可保留原文简洁而有力的反复；在“听某人的”这一汉语结构中，也可自然含有听取、接受之意。
- source_word: ὁ ἀθετῶν / ἀθετεῖ
  choice: 拒绝……的 / 拒绝
  rationale: ἀθετέω可表示拒绝、漠视、弃绝或置之不理。在本节关于使者及差遣者的关系语境中，“拒绝”最清楚自然，并能在三处保持同一动词的修辞反复。
- source_word: δὲ
  choice: 而
  rationale: δὲ在这里引出递进至高潮的末句。“而”既能表示轻微转折，又不使对比显得过强。
- source_word: τὸν ἀποστείλαντά με
  choice: 那位差我来的
  rationale: 带冠词的不定过去时分词作名词用，指差遣耶稣的那一位。“那位差我来的”符合现代汉语表达，并按原文保留其指代，不直接增译“父”。
theological_decisions:
- issue: 耶稣与受差遣门徒之间的代表关系
  choice: 保留“听你们就是听我；拒绝你们就是拒绝我”的直接个人关系链条。
  alternative: 改述为听从或拒绝门徒所传的信息。
  rationale: 希腊文使用“你们”和“我”等人称代词，并未使用“信息”或“教导”等抽象名词。直译个人对象既保留门徒作为受差遣者的代表性，也不把经文含义缩窄为仅仅接受某项内容。
- issue: “那位差我来的”所指为何
  choice: 按原文保留隐含指代，译为“那位差我来的”。
  alternative: 明确译为“差我来的父”。
  rationale: 上下文中所指是上帝，但本节希腊文本身没有出现“父”一词，因此不在正文中将其明说，以免加入解释性内容。
- issue: ἀκούω在本节中的接受含义
  choice: 正文译作“听”，让汉语“听某人的”自然承载听取、接受的含义。
  alternative: 译作“听从”或“接受”。
  rationale: “听”保留原词的基本意象和两次重复，也与后面的“拒绝”形成张力；“听从”虽可明确顺服意味，却可能比原文更早限定语义。
translation_notes:
  register: 采用简洁、庄重而现代的口语化书面表达。“听……的，就是听……”与“拒绝……的，就是拒绝……”形成平行句式，保留原文的重复和递进。用“那位”自然表达阳性单数的实体指称，同时不额外明说其身份。
