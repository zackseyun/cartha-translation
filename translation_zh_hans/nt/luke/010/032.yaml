  text: ὁμοίως δὲ καὶ ⸀Λευίτης κατὰ τὸν τόπον ἐλθὼν καὶ ἰδὼν ἀντιπαρῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/032.yaml
  text: Likewise[a], a Levite also came to the place, and when he saw him[b], he passed by on the opposite side.
translation:
  language: zh_hans
  text: 同样，又有一个利未人来到那地方[a]，看见他，就从另一边过去了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“经过那地方”或“来到那个地点”。
    reason: lexical_alternative
  - marker: b
    text: 这个动词也可简译为“从旁边经过了”；其复合形式含有从另一边避开而过的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοίως
  choice: 同样
  rationale: 承接上一节祭司的举动，简洁保留比较和平行关系。
- source_word: δὲ
  choice: —
  rationale: 此处是轻微的叙事连接词；汉语通过句子衔接自然表达，不必另译。
- source_word: καὶ
  choice: 又有一个
  rationale: 把利未人作为继祭司之后的另一个平行人物引入，符合现代汉语叙事习惯。
- source_word: Λευίτης
  choice: 利未人
  rationale: 保留这一具有历史和宗教背景的群体称谓，不泛化为“圣殿助手”等解释性名称。
- source_word: κατὰ τὸν τόπον
  choice: 到那地方
  rationale: 结合ἐλθών表达来到相关地点；“那地方”自然承接上下文，同时不把路径关系说得过于具体。
- source_word: ἐλθὼν
  choice: 来到
  rationale: 将先于主要动作发生的不定过去时分词自然处理为汉语连续叙事。
- source_word: ἰδὼν
  choice: 看见他
  rationale: 表达先看见、后避开的动作次序；“他”由上下文中的受伤者补出。
- source_word: ἀντιπαρῆλθεν
  choice: 从另一边绕过去了
  rationale: 复合动词不只是一般的“经过”，还呈现从相对一边避开而过的意味；此译法保留有意回避的叙事力度。
theological_decisions:
- issue: Λευίτης的社会与宗教身份
  choice: 保留“利未人”这一群体称谓
  alternative: 圣殿助手；利未支派的人
  rationale: 原文指向当时可辨认的犹太宗教群体，并与上一节的祭司构成平行；保留专名式称谓可避免在正文中加入超出原文的职务说明。
- issue: ἀντιπαρῆλθεν是否明确表达有意避开
  choice: 译为“从另一边绕过去了”
  alternative: 从旁边经过了
  rationale: 复合形式带有从对面或另一边经过的空间意味，在本叙事中也暗示回避；译文保留这种力度，但不进一步断定人物的内在动机。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“利未人”为通行的圣经历史称谓；句式按动作顺序展开，避免生硬保留希腊语分词结构。
