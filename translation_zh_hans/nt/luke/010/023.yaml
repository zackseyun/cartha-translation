  text: Καὶ στραφεὶς πρὸς τοὺς μαθητὰς κατ’ ἰδίαν εἶπεν· Μακάριοι οἱ ὀφθαλμοὶ οἱ βλέποντες ἃ βλέπετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/023.yaml
  text: And turning to the disciples privately[a], he said, “Blessed are the eyes that see what you see.”
translation:
  language: zh_hans
  text: 耶稣转向门徒，私下对他们说：“能看见你们所看见之事的眼睛有福了。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στραφεὶς
  choice: 转身面向
  rationale: 不定过去时分词表示耶稣说话前的动作；“转身面向”自然地表达他转向门徒，并保留与主句的动作衔接。
- source_word: μαθητάς
  choice: 门徒
  rationale: 这是新约语境中 μαθητής 的标准译法，兼顾跟随者与受教者的关系含义。
- source_word: κατ’ ἰδίαν
  choice: 私下
  rationale: 该习语表示与其他人分开、单独对门徒说话；“私下”简洁自然，另以脚注保留“单独”的译法。
- source_word: Μακάριοι
  choice: 有福了
  rationale: 这是宣告蒙福的用语，不仅指主观快乐；“有福了”保留福语式的神学分量。
- source_word: οἱ ὀφθαλμοὶ οἱ βλέποντες
  choice: 看见……的，这样的眼睛
  rationale: 保留希腊文以“眼睛”代指亲眼看见之人的鲜明转喻，同时用“这样的”使现代汉语句式清楚自然。
- source_word: ἃ βλέπετε
  choice: 你们所看见的
  rationale: 直接对应关系代词与现在时动词，保留原文对门徒当下所见之事的强调，不具体补出所见内容。
theological_decisions:
- issue: 福语宣告的力度
  choice: 将 μακάριοι 译为“有福了”，理解为对门徒得以看见这些事的蒙福宣告。
  alternative: 译为“快乐”或“幸运”。
  rationale: 上下文中的 μακάριοι 具有福语式宣告的分量，并非只描述情绪或偶然好运；译文同时不补充原文未明说的神学解释。
- issue: “眼睛”的转喻
  choice: 保留“眼睛”作为蒙福对象的原文意象。
  alternative: 意译为“亲眼看见这些事的人有福了”。
  rationale: 希腊文明确说“眼睛”，借此突出亲眼看见的特权；保留这一张力比直接改为“人”更贴近原文。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“私下”紧接说话动作；“看见你们所看见的，这样的眼睛有福了”保留原文以眼睛代人的修辞和两个 βλέπω 形式的重复。
