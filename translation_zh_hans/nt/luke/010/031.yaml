  text: κατὰ συγκυρίαν δὲ ἱερεύς τις κατέβαινεν ἐν τῇ ὁδῷ ἐκείνῃ, καὶ ἰδὼν αὐτὸν ἀντιπαρῆλθεν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/031.yaml
  text: By chance a certain priest was going down on that road[a], and when he saw him, he passed by on the opposite side.
translation:
  language: zh_hans
  text: 恰巧有一个祭司正沿着那条路下去；他看见那人，就从另一边走过去了[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从旁边经过了。”这个希腊语动词不只是“经过”，也含有从另一边避开而过的意思，暗示他有意避开那人。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ συγκυρίαν
  choice: 恰巧
  rationale: 该习语表示事情碰巧发生。“恰巧”自然简洁，保留叙事中的偶合意味，又不对随机性作哲学断言。
- source_word: δὲ
  choice: 不单独译出，以分号承接叙事
  rationale: δέ在此是轻微的叙事连接词；汉语可借语序和标点自然推进，无须生硬译作“但是”或“于是”。
- source_word: ἱερεύς τις
  choice: 有一个祭司
  rationale: τις指一位身份明确但未具名的人。“有一个祭司”既保留不定指，也比“某一个祭司”更符合现代汉语叙事习惯。
- source_word: κατέβαινεν
  choice: 正……下去
  rationale: 未完成时描写当时正在进行的背景动作；“正……下去”保留其持续体貌。
- source_word: ἐν τῇ ὁδῷ ἐκείνῃ
  choice: 沿着那条路
  rationale: 介词短语在道路语境中表示在该路上行进；“沿着那条路”是自然的现代汉语表达。
- source_word: ἰδὼν αὐτὸν
  choice: 他看见那人
  rationale: 不定过去时分词在此具有时间关系，表示祭司看见受伤者之后采取行动；“那人”清楚回指上文人物。
- source_word: ἀντιπαρῆλθεν
  choice: 从路的另一边绕过去了
  rationale: 该复合动词不只表示经过，也带有从对面或另一侧避开的意味；此译法在自然汉语中体现有意避开的动作，同时以脚注说明较简略的可能译法。
