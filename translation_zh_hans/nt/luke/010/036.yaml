  yaml_path: translation/nt/luke/010/036.yaml
  text: Which of these three seems to you to have become a neighbor to the man who fell among the robbers?[a]
translation:
  language: zh_hans
  text: 这三个人中，照你看，哪一个成了那落在强盗手中的人的邻舍？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这三个人中，你认为哪一个是那落在强盗手中的人的邻舍？”希腊文较直译为：“在你看来，哪一个成了……的邻舍？”强调“成了邻舍”这一动态表达。
    reason: 词义与句法替代译法
lexical_decisions:
- source_word: τίς
  choice: 哪一个
  rationale: 与“这三个人中”构成自然的现代汉语问句，准确表达从特定三者中作选择。
- source_word: τούτων τῶν τριῶν
  choice: 这三个人中
  rationale: 保留部分属格的意义；汉语为表达清楚自然补出量词结构，“人”由上下文明确。
- source_word: πλησίον
  choice: 邻舍
  rationale: 此处作名词，指以实际行动亲近并帮助他人的人；“邻舍”也与本段关于爱邻舍的讨论保持词语呼应。
- source_word: δοκεῖ σοι
  choice: 你看
  rationale: 自然表达“在你看来”的判断意味，同时保留问题向听者征询判断的语气。
- source_word: γεγονέναι
  choice: 成了
  rationale: 保留 γίνομαι 完成时不定式所含的成为、进入某种关系之意，避免静态译成“是”。
- source_word: τοῦ ἐμπεσόντος
  choice: 那……之人
  rationale: 定冠词加分词指前文遭袭者；采用较庄重但仍易懂的汉语关系结构。
- source_word: εἰς τοὺς λῃστάς
  choice: 落在强盗手中
  rationale: 按希腊语习语表达落入强盗控制、遭其袭击之意；汉语中比直译“落入强盗中间”更自然。
theological_decisions:
- issue: 好撒玛利亚人比喻中问题的伦理焦点
  choice: 用“成了……的邻舍”保留动态措辞
  alternative: 译作“是……的邻舍”
  rationale: γεγονέναι 并非只说明静态身份，而是强调借着行动成为遭难者的邻舍；这一译法保存耶稣对原问题的转向，却不额外阐释其教义含义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“邻舍”虽略带经文语体，但能与本段前文的核心术语保持一致；“你看”自然传达 δοκεῖ σοι 的判断语气。
