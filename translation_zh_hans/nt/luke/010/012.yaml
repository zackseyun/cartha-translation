source:
  edition: SBLGNT
  text: λέγω ὑμῖν ὅτι Σοδόμοις ἐν τῇ ἡμέρᾳ ἐκείνῃ ἀνεκτότερον ἔσται ἢ τῇ πόλει ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/012.yaml
  text: I tell you[b][a], it will be more bearable for Sodom on that day than for that city.
translation:
  language: zh_hans
  text: 我告诉你们：在那日[a]，所多玛所受的将比那城所受的更容易忍受。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “那日”指上帝施行审判的日子；有些平行经文明说这是审判的日子。
    reason: cross_reference
  - marker: b
    text: “更容易忍受”也可译作“较可容忍”。原文没有明说所忍受的具体内容。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: 我告诉你们
  rationale: 以自然的现代汉语表达直接而郑重的断言，并保留复数受话对象。
- source_word: Σοδόμοις
  choice: 所多玛所受的
  rationale: 希腊文为与格复数形式，指所多玛或其居民；用地名作转喻，并借“所受的”使汉语比较结构完整，同时不具体限定为某一种惩罚。
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: 在那日
  rationale: 保留原文的指示性时间表达；采用庄重而通顺的圣经语体，不在正文中补入原文未明说的“审判”。
- source_word: ἀνεκτότερον
  choice: 更容易忍受
  rationale: 表达比较级“较可忍受、较易承受”的含义；现代读者容易理解，也保留承受审判后果的语义。
- source_word: ἔσται
  choice: 所受的还……
  rationale: 希腊文未来系词在汉语比较句中无需机械译成“将是”；结合“在那日”及语境，以自然句法传达未来判断。
- source_word: ἢ τῇ πόλει ἐκείνῃ
  choice: 还比那城
  rationale: 保留与格比较和指示词，指向前文所说不接待门徒的城；πόλις直译为“城”。
theological_decisions:
- issue: “那日”的性质
  choice: 正文保留“在那日”，脚注说明其语境所指
  alternative: 在审判之日
  rationale: 语境及平行经文指向上帝审判之日，但本节原文本身没有“审判”一词，因此不在正文中补明。
- issue: 比较中省略的承受内容
  choice: 用“所受的”保留开放性，并在脚注给出较直译表达
  alternative: 所受的惩罚／审判
  rationale: 原文以中性比较级作无人称式陈述，没有明说所忍受的是“惩罚”还是“审判”；正文不将省略内容过度具体化。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“在那日”保留经文语感；“所多玛所受的还比那城更容易忍受”使希腊文省略式比较在汉语中自然成立，同时不擅自补入“惩罚”等解释性名词。脚注标记均已置于正文中。
