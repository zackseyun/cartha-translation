id: LUK.10.5
reference: Luke 10:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἰς ἣν δ’ ἂν ⸂εἰσέλθητε οἰκίαν⸃ πρῶτον λέγετε· Εἰρήνη τῷ οἴκῳ τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/005.yaml
  text: Into whatever house you enter[a], first say, ‘Peace to this house.’
translation:
  language: zh_hans
  text: 无论你们进哪一家，首先要说：“愿平安临到这一家。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“平安归给这一家”或“愿这一家平安。”希腊原文是简洁的祝福语。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἣν δ’ ἂν … οἰκίαν
  choice: 无论……哪一家
  rationale: εἰς加关系代词及ἄν构成不定关系从句，表示泛指任何将进入的房屋。汉语“无论……哪一家”自然传达这一意义；“进”本身已包含方向，不必另译εἰς。
- source_word: εἰσέλθητε
  choice: 你们进
  rationale: 不定关系从句中的简单过去时虚拟式具有一般性的将来指向。“进”简洁自然，并保留进入住所的动作。
- source_word: οἰκίαν
  choice: 一家
  rationale: 此处首先指门徒进入的住所；结合汉语量词表达，译为“哪一家”既可指房屋，也自然包含住在其中的人家。
- source_word: πρῶτον
  choice: 首先
  rationale: 表示行动次序上的优先，即进门后第一件要做的事。
- source_word: λέγετε
  choice: 要说
  rationale: 现在时命令语气规定他们每逢这种情况都要说出这句话。“要说”清楚表达指令。
- source_word: Εἰρήνη
  choice: 愿平安临到
  rationale: 这是简洁的问安兼祝福语。汉语若直译“平安给这一家”不够自然，因此补出“愿……临到”，清楚呈现其祝愿和宣告性质。
- source_word: τῷ οἴκῳ τούτῳ
  choice: 这一家
  rationale: 与格标明平安所临到的对象。οἶκος在此既可指房屋，也可包括其中的家人；“这一家”保留这两层可能。
theological_decisions:
- issue: 平安话语的性质
  choice: 译作祝福兼问安：“愿平安临到这一家。”
  alternative: 较形式对应地译作“平安归给这一家”或“平安临到这家”
  rationale: 原文是在犹太问安传统中的施行性祝福，并非仅是普通的“你好”。所选译法保留其祝福力度，同时不增添特定礼仪或宗派含义。
- issue: οἶκος所指范围
  choice: 用“这一家”保留住所与家中成员的双重可能
  alternative: 明确译作“这座房子”或“这家人”
  rationale: 上下文涉及进入具体住所，但祝福也自然关乎其中的人。原文未要求排除其中任何一层，因此不宜在译文中强行限定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“哪一家／这一家”前后呼应；“愿平安临到”符合当代汉语祝福表达，并通过脚注保留原文简洁句式的其他译法。
