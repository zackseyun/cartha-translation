  naturalness: “无论你们进哪一家，首先要说：‘愿平安临到这一家。’”在现代标准普通话中自然、清楚且庄重。“哪一家／这一家”的前后呼应流畅；“愿平安临到”作为祝福语也符合当代书面圣经语体。
