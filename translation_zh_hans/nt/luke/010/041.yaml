  text: ἀποκριθεὶς δὲ εἶπεν αὐτῇ ὁ ⸀κύριος· Μάρθα Μάρθα, μεριμνᾷς καὶ ⸀θορυβάζῃ περὶ πολλά,
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/041.yaml
  text: But the Lord answered her[a], “Martha, Martha, you are anxious and troubled about many things,”
translation:
  language: zh_hans
  text: 主回答她说：“马大，马大，你为许多事忧虑不安，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ εἶπεν αὐτῇ
  choice: 主回答她说
  rationale: 将希腊语叙事中常见的分词加限定动词结构自然译出，同时保留“说”，使直接引语的引入在现代汉语中庄重流畅；δὲ所表达的轻微转折由上下文自然呈现，不另加生硬的“但是”。
- source_word: ὁ κύριος
  choice: 主
  rationale: 保留路加叙事中对耶稣的尊称及其基督论意味；“主人”在此会削弱这一层含义。
- source_word: Μάρθα Μάρθα
  choice: 马大，马大
  rationale: 保留呼格重复所传达的强调与关切。
- source_word: μεριμνᾷς
  choice: 忧虑
  rationale: 表达内心挂虑、焦灼的状态，比单纯的“关心”更贴近原词语义。
- source_word: θορυβάζῃ
  choice: 不安
  rationale: 表达受到搅扰、心绪不宁；与“忧虑”并列，既自然又保留两个动词的语义区别。
- source_word: περὶ πολλά
  choice: 为许多事
  rationale: 简洁对应“关于许多事情”，符合现代汉语习惯，并保留所挂虑之事范围广泛的含义。
theological_decisions:
- issue: κύριος作为耶稣的称号
  choice: 主
  alternative: 主人
  rationale: “主”既符合路加的叙事用法，也保留尊称和基督论回响；“主人”容易仅被理解为社会关系称谓。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留“马大，马大”的重复和“忧虑不安”的双重表达，不把两种内心状态过度拆解，也不额外解释其神学意义。本节原文句末有逗号，表明话语在下一节继续，因此译文亦以逗号收束。
