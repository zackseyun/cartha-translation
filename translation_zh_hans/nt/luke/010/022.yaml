source:
  edition: SBLGNT
  text: ⸀πάντα μοι παρεδόθη ὑπὸ τοῦ πατρός μου, καὶ οὐδεὶς γινώσκει τίς ἐστιν ὁ υἱὸς εἰ μὴ ὁ πατήρ, καὶ τίς ἐστιν ὁ πατὴρ εἰ μὴ ὁ υἱὸς καὶ ᾧ ⸀ἐὰν βούληται ὁ υἱὸς ἀποκαλύψαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/022.yaml
  text: All things have been handed over to me by my Father[a], and no one knows who the Son is except the Father[b], and who the Father is except the Son and anyone to whom the Son chooses to reveal him.
translation:
  language: zh_hans
  text: 一切都已由我父交给我了[a]；除了父，没有人知道子是谁；除了子和子愿意向他启示父的人，没有人知道父是谁。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“万有都已由我父交给我了。”
    reason: lexical_alternative
  - marker: b
    text: “子愿意向他启示父的人”也可译作“子选择向他启示父的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: 一切
  rationale: 中性复数在此范围广泛；“一切”简洁庄重，也保留原文概括性的力度。
- source_word: μοι παρεδόθη ὑπὸ τοῦ πατρός μου
  choice: 都已由我父交给我了
  rationale: παρεδόθη是简单过去时被动语态，ὑπό加属格标明施事者。“已……交给”表达已经发生的交付，并不额外引入“托付管理”的含义。
- source_word: γινώσκει
  choice: 知道
  rationale: 直译其基本意义，不添加“完全”或“真正”等原文未明说的程度修饰。
- source_word: τίς ἐστιν ὁ υἱός / τίς ἐστιν ὁ πατήρ
  choice: 子是谁／父是谁
  rationale: 自然地保留有关身份与位格关系的问句结构，避免抽象化为“身份”。
- source_word: ὁ υἱός / ὁ πατήρ
  choice: 子／父
  rationale: 上下文清楚表明这是独特的关系性称谓；现代中文圣经语体以“子”“父”自然表达，无须另加解释。
- source_word: ᾧ ἐὰν βούληται ὁ υἱὸς ἀποκαλύψαι
  choice: 子愿意向他启示的人
  rationale: 关系代词所指为领受启示的人，ἀποκαλύψαι隐含的宾语承接前句的“父”。译文保留这种承接，同时清楚表达子的主动意愿。
- source_word: βούληται
  choice: 愿意
  rationale: 表达意志和决定，在现代汉语中自然；脚注提供更突出抉择意味的译法“选择”。
- source_word: ἀποκαλύψαι
  choice: 启示
  rationale: 准确保留揭示、使人认识的意义及其神学语感，而不作解释性扩写。
theological_decisions:
- issue: 父与子之间独有的相互认识
  choice: 保留“除了……没有人知道……”的排他结构，不增添“完全”或“真正”。
  alternative: 译作“完全知道”或“真正认识”。
  rationale: 原文的句法本身已鲜明表达父与子之间独特的相互认识；添加程度副词会超出γινώσκει的明说内容。
- issue: 子在启示父这件事上的意愿与主动性
  choice: 译作“子愿意向他启示的人”。
  alternative: 译作“子选择向他启示的人”或弱化子的决定作用。
  rationale: 原文把向谁启示置于子的意愿之下。正文以自然中文保留其主动性，脚注呈现“选择”的可能译法，不进一步体系化。
- issue: ἀποκαλύψαι的隐含宾语
  choice: 正文沿用中文可理解的省略，让“启示”的对象由前句“父是谁”承接。
  alternative: 明说“把父启示给他”或“向他启示父”。
  rationale: 希腊文没有明写宾语，但语境指向父。保留省略可避免加入原文没有的成分，同时不损害理解。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“我父”较“我的父”更凝练，并符合关系称谓的经文语体。以分号呈现两个平行而相互对应的排他句；不添加解释性的神学术语。所有脚注标记均已置于正文。
