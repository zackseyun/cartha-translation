  text: ὁ δὲ εἶπεν· Ὁ ποιήσας τὸ ἔλεος μετ’ αὐτοῦ. εἶπεν ⸀δὲ αὐτῷ ὁ Ἰησοῦς· Πορεύου καὶ σὺ ποίει ὁμοίως.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/037.yaml
  text: And he said, “The one who showed mercy to him.” Then Jesus said to him, “Go, and you do likewise.”
translation:
  language: zh_hans
  text: 他回答：“是那位向他施怜悯的人。”耶稣对他说：“你去，也照样做吧。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁ ποιήσας τὸ ἔλεος μετ’ αὐτοῦ
  choice: 那怜悯他的人
  rationale: 该短语直指以怜悯相待的人；译文自然简洁，同时保留定冠词所指的回答形式。
- source_word: Πορεύου
  choice: 你去
  rationale: 保留第二人称单数命令的直接性。
- source_word: καὶ σὺ
  choice: 也
  rationale: καὶ 与强调代词 σὺ 表示“你也”；汉语中以“你去，也……”自然体现对听者本人的强调。
- source_word: ποίει ὁμοίως
  choice: 照样做吧
  rationale: 现在时命令可表达持续或一贯实践；“照样做”准确传达按同样方式行事，“吧”使汉语命令庄重而不生硬。
theological_decisions:
- issue: 耶稣命令中对听者的强调
  choice: 你去，也照样做吧
  alternative: 去照样做吧
  rationale: 保留 καὶ σὺ 的显性强调，不削弱“你也”的针对性。
- issue: τὸ ἔλεος 的表达
  choice: 怜悯
  alternative: 慈悲／恩待
  rationale: “怜悯”既涵盖内在同情，也能在“怜悯他”这一结构中指向实际行动，不额外加入特定神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。对话简洁直接；“你去，也照样做吧”保留原文对“你”的强调及命令语气。
