source:
  edition: SBLGNT
  text: καὶ ἐὰν ⸂ᾖ ἐκεῖ⸃ υἱὸς εἰρήνης, ἐπαναπαήσεται ἐπ’ αὐτὸν ἡ εἰρήνη ὑμῶν· εἰ δὲ μήγε, ἐφ’ ὑμᾶς ἀνακάμψει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/006.yaml
  text: And if a son of peace is there[a], your peace will rest upon him; but if not, it will return to you.
translation:
  language: zh_hans
  text: 那里若有平安之子[a]，你们的平安就必停留在他身上；若没有，就必回到你们身上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“平安的人”，即愿意接受这带来平安之信息的人。
    reason: 说明“平安之子”这一闪语式表达，并提供较符合现代汉语习惯的译法。
lexical_decisions:
- source_word: υἱὸς εἰρήνης
  choice: 平安之子
  rationale: 保留希腊文中带有闪语色彩的“……之子”表达和阳性单数形式，指以平安为特征、愿意接受这平安信息的人；脚注提供更符合现代汉语习惯的表达。
- source_word: ἐπαναπαήσεται
  choice: 就必停留在……身上
  rationale: 保留平安落在某人身上并安驻下来的意象；“停留”在现代汉语中自然，也不把该动词弱化为单纯的问安。
- source_word: ἡ εἰρήνη ὑμῶν
  choice: 你们的平安
  rationale: 保留原文直接的领属结构，既可指门徒所说的平安问候，也可指其中所传递的平安祝福，不在正文中将含义限制为其中一种。
- source_word: μήγε
  choice: 若没有
  rationale: 在本条件句中自然表达加强的否定，所省略的内容可由上文“有平安之子”清楚补足。
- source_word: ἀνακάμψει
  choice: 必归回
  rationale: 准确表达转回、返回之意，并与前面的“停留”形成清楚对照。
- source_word: ἐφ’ ὑμᾶς
  choice: 归回你们
  rationale: 汉语中“归回你们”比直译为“归在你们身上”更顺畅，同时保留平安返回说话者的意义。
- source_word: καὶ ἐὰν ᾖ ἐκεῖ
  choice: 那里若有
  rationale: 自然表达地点强调和条件关系；句首连接词καί在本节独立呈现时不必机械译出，以符合现代汉语行文。
theological_decisions:
- issue: 是否将υἱὸς εἰρήνης的阳性习语中性化
  choice: 正文保留“平安之子”
  alternative: “平安的人”或“爱好平安的人”
  rationale: “平安之子”保留原文阳性单数及其闪语式表达，不把它提前解释为性情温和或配得平安的人；脚注说明其惯用含义，兼顾现代读者理解。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“平安之子”有意保留源文质感；其余句法尽量自然简洁。“平安”前后重复，以保存原文的关键词呼应和神学张力。
