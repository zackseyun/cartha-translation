id: LUK.10.7
reference: Luke 10:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐν αὐτῇ δὲ τῇ οἰκίᾳ μένετε, ἐσθίοντες καὶ πίνοντες τὰ παρ’ αὐτῶν, ἄξιος γὰρ ὁ ἐργάτης τοῦ μισθοῦ ⸀αὐτοῦ. μὴ μεταβαίνετε ἐξ οἰκίας εἰς οἰκίαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/007.yaml
  text: Stay in that same house[a], eating and drinking what they provide, for the worker is worthy of his wages. Do not move from house to house.
translation:
  language: zh_hans
  text: 你们就住在那一家里，吃喝他们所供给的，因为工人配得他的工钱。不要从一家搬到另一家。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν αὐτῇ δὲ τῇ οἰκίᾳ
  choice: 住在那一家
  rationale: αὐτῇ在此回指接待门徒的那一家，并与末句不可换住处相呼应；“那一家”自然表达特指，避免生硬的“那同一所房子”。
- source_word: μένετε
  choice: 要住
  rationale: 现在时命令语气要求持续留住；汉语“要住在”自然传达这一命令。
- source_word: ἐσθίοντες καὶ πίνοντες τὰ παρ’ αὐτῶν
  choice: 吃喝他们所供给的
  rationale: 两个分词表示留住期间同时进行的活动；τὰ παρ’ αὐτῶν指主人家提供的饮食，用“所供给的”简洁忠实。
- source_word: ἄξιος γὰρ ὁ ἐργάτης τοῦ μισθοῦ αὐτοῦ
  choice: 因为工人配得他的工钱
  rationale: ἄξιος保留“配得”的价值判断，μισθός在此是劳动所得的报酬，译作“工钱”；αὐτοῦ按阳性单数形式译为“他的”。
- source_word: μὴ μεταβαίνετε ἐξ οἰκίας εἰς οἰκίαν
  choice: 不要从这一家搬到那一家
  rationale: μεταβαίνετε在住宿语境中指转移住处；这一表达比逐字的“从一家到一家”更自然，也保留禁止更换接待家庭的意思。
theological_decisions:
- issue: τοῦ μισθοῦ αὐτοῦ中的阳性单数代词
  choice: 他的工钱
  alternative: 应得的工钱
  rationale: 希腊文以阳性单数ὁ ἐργάτης和αὐτοῦ构成泛指陈述；译文保留其语法形式，不改写为复数或中性表达。
translation_notes:
  register: 采用现代、庄重且口语可懂的标准普通话。“一家”在上下文中指接待门徒的家庭或住处；末句用“搬到”明确表达更换住宿地点，而不增添“寻找更好住处”等原文未明说的动机。
