  text: εἶπεν δὲ αὐτῷ· Ὀρθῶς ἀπεκρίθης· τοῦτο ποίει καὶ ζήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/028.yaml
  text: And he said to him[a], “You have answered correctly. Do this[b], and you will live.”
translation:
  language: zh_hans
  text: 耶稣对他说：“你回答得对。[a]你这样做，就必活着。”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “回答得对”也可译作“回答得正确”。
    reason: lexical_alternative
  - marker: b
    text: 上下文谈到永生（见路加福音10:25），但这里的希腊原文只说“你必活着”。
    reason: cross_reference
lexical_decisions:
- source_word: εἶπεν δὲ αὐτῷ
  choice: 耶稣对他说
  rationale: εἶπεν为“说”，αὐτῷ为“对他”；δέ是轻微的叙事连接词，中文无需另译。“耶稣”由上下文明确补出，使独立经节在现代汉语中自然清楚。
- source_word: Ὀρθῶς ἀπεκρίθης
  choice: 你回答得对
  rationale: Ὀρθῶς意为“正确地、恰当地”，ἀπεκρίθης为第二人称单数“回答了”。“你回答得对”是自然、准确的现代汉语。
- source_word: τοῦτο ποίει
  choice: 你这样做
  rationale: τοῦτο回指刚才所概括的诫命；ποίει是现在时命令语气，可含持续实行之意。“这样做”保持简洁，也容许持续遵行的语意。
- source_word: καὶ ζήσῃ
  choice: 就必活着
  rationale: ζήσῃ直译为“你将活着”。“就必活着”保留条件—结果关系及将来意味，不在正文中增添“永生”或“承受永生”等原文此处未明说的词。
theological_decisions:
- issue: “活着”是否应明确译作“得永生”
  choice: 正文译作“就必活着”
  alternative: “就必得永生”或“就必承受永生”
  rationale: 第25节的上下文确实谈到承受永生，但本句希腊文只说ζήσῃ（“你将活着”）。正文保留原句的简洁和语义张力，并以脚注说明上下文。
translation_notes:
  register: 采用现代、自然而庄重的普通话。“你这样做”简洁易懂，并不排除希腊文现在时命令可能含有的持续实行意味；“就必活着”刻意保留原文未加限定的表达。
