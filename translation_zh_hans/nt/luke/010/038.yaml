base_translation:
  language: en
  yaml_path: translation/nt/luke/010/038.yaml
  text: As they were traveling along[a], he entered a certain village, and a woman named Martha welcomed him.
translation:
  language: zh_hans
  text: 他们正走着的时候，他进了某个村庄；有一个名叫马大的女人接待了他[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“欢迎了他。”原文动词含有把人当作客人接待的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ τῷ πορεύεσθαι αὐτοὺς
  choice: 他们继续前行的时候
  rationale: ἐν加冠词化不定式表示与主句同时发生的动作，译作“……的时候”；αὐτούς是复数，指同行的一行人。δέ仅轻微推进叙事，不必生硬另译。
- source_word: αὐτὸς
  choice: 他
  rationale: 原文以强调性代词把耶稣与同行的众人区别开来；中文上下文中用“他”既自然，也不额外补入原文未明说的名字。
- source_word: εἰσῆλθεν εἰς κώμην τινά
  choice: 进了某个村庄
  rationale: κώμη指村庄；τινά带有不特指却略具具体性的语气，用“某个”保留这一叙事表达。
- source_word: γυνὴ δέ τις ὀνόματι Μάρθα
  choice: 有一个名叫马大的女人
  rationale: 以“有一个”自然引入新人物，并保留τις的不定意味；ὀνόματι Μάρθα按现代汉语习惯译作“名叫马大”。
- source_word: ὑπεδέξατο αὐτόν
  choice: 接待了他
  rationale: ὑποδέχομαι在这里指以主人身份欢迎、接纳客人；“接待”能够自然传达款待来客的含义，又不擅自增添“到她家里”等原文未明说的地点信息。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“继续前行”使行程中的持续动作自然可感；两句结构便于普通读者理解。脚注标记置于它实际说明的“接待了他”之后，而非置于行路短语之后。
