  to: 就在那时，耶稣在圣灵里欢欣，说：“父啊，天地的主，我赞美你[a]，因为你把这些事向有智慧、有悟性的人隐藏起来，却向婴孩[b]显明。是的，父啊，因为你的美意本是如此[c]。”
