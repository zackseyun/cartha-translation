id: LUK.10.21
reference: Luke 10:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ἐν αὐτῇ τῇ ὥρᾳ ἠγαλλιάσατο ⸀τῷ πνεύματι ⸂τῷ ἁγίῳ⸃ καὶ εἶπεν· Ἐξομολογοῦμαί σοι, πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς, ὅτι ἀπέκρυψας ταῦτα ἀπὸ σοφῶν καὶ συνετῶν, καὶ ἀπεκάλυψας αὐτὰ νηπίοις· ναί, ὁ πατήρ, ὅτι οὕτως ⸂εὐδοκία ἐγένετο⸃ ἔμπροσθέν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/021.yaml
  text: In that same hour he rejoiced in the Holy Spirit and said[a], “I praise you, Father, Lord of heaven and earth, because you hid these things from the wise and understanding, and revealed them to little children. Yes, Father[c][b], because this was well-pleasing in your sight.”
translation:
  language: zh_hans
  text: 就在那时，耶稣在圣灵里欢欣，说：“父啊，天地的主，我赞美你[a]，因为你把这些事向有智慧、有悟性的人隐藏起来，却向婴孩[b]显明。是的，父啊，因为你的美意本是如此[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我感谢你。”这个希腊语动词在祷告中既可表达赞美，也可表达感谢。
    reason: lexical_alternative
  - marker: b
    text: “婴孩”在这里很可能是比喻，指谦卑、卑微或不被人看重的人，并非只指年幼的孩子。
    reason: metaphorical_sense
  - marker: c
    text: 或译：“因为这正合你的心意”，或“因为这样在你眼中是美好的。”
    reason: alternative_rendering
lexical_decisions:
- source_word: Ἐν αὐτῇ τῇ ὥρᾳ
  choice: 就在那时
  rationale: 准确表达同一时刻，并以现代汉语自然传达原文的强调语气。
- source_word: ἠγαλλιάσατο
  choice: 欢欣
  rationale: 表达强烈的喜乐，比一般的“高兴”更贴近原词，同时保持庄重自然。
- source_word: τῷ πνεύματι τῷ ἁγίῳ
  choice: 在圣灵里
  rationale: 定冠词结构最自然地指向圣灵；“在……里”保留与格可能兼有的领域或媒介意味，不将其过度限定为单纯的工具关系。
- source_word: Ἐξομολογοῦμαί σοι
  choice: 我赞美你
  rationale: 在向父祷告的语境中，此词表示公开承认而发出的赞美或感谢；正文选“赞美”，脚注保留“感谢”的可能。
- source_word: πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς
  choice: 父啊，天地的主
  rationale: 保留两个并列呼格及κύριος所表达的主权，中文简洁庄重。
- source_word: σοφῶν καὶ συνετῶν
  choice: 有智慧、有悟性的人
  rationale: 分别传达智慧与领悟、明辨能力，不擅自将其缩窄为受过教育的人。
- source_word: ἀπέκρυψας / ἀπεκάλυψας
  choice: 隐藏起来 / 显明
  rationale: 保留原文鲜明的对照以及上帝作为两个动作主体的句法。
- source_word: νηπίοις
  choice: 婴孩
  rationale: 保留原词具体而尖锐的幼小、依赖意象；语境中的比喻用法在脚注说明。
- source_word: οὕτως εὐδοκία ἐγένετο ἔμπροσθέν σου
  choice: 因为这样是你所喜悦的
  rationale: 以自然汉语表达“这样在你面前成为所喜悦之事”，既保留神的喜悦，也避免把名词εὐδοκία过度解释成预定的旨意。
theological_decisions:
- issue: τῷ πνεύματι τῷ ἁγίῳ的所指
  choice: 圣灵
  alternative: 他的灵；在灵里
  rationale: 名词与形容词带定冠词的结构最有力地支持“圣灵”；这一译法依据希腊文本本身，不额外展开教义。
- issue: 隐藏与显明的神圣主体性
  choice: 保留“你把……隐藏，却向……显明”
  alternative: 译成无主体的“这些事没有被……明白，却被……明白”
  rationale: 原文两处主动动词都以父为主语；保留这一点，不削弱经文中神主动隐藏和启示所形成的张力。
- issue: εὐδοκία的含义
  choice: 你所喜悦的
  alternative: 你的美意；你恩慈的旨意
  rationale: “喜悦”紧贴原词的悦纳、满意含义，并避免把此处直接系统化为更具体的旨意论表述。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。用“父啊”“天地的主”保留祷告语体；用“欢欣”表达强烈喜乐而不过分古雅。正文尽量贴近希腊文的主动句、对照结构和神学张力，脚注说明关键词的真实语义范围。
