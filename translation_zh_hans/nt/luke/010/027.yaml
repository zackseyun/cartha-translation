  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Ἀγαπήσεις κύριον τὸν θεόν σου ἐξ ὅλης ⸀τῆς καρδίας σου καὶ ⸂ἐν ὅλῃ τῇ ψυχῇ⸃ σου καὶ ⸂ἐν ὅλῃ τῇ ἰσχύϊ⸃ σου καὶ ⸂ἐν ὅλῃ τῇ διανοίᾳ⸃ σου, καὶ τὸν πλησίον σου ὡς σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/027.yaml
  text: And he answered, “You shall love the Lord your God from all your heart and with all your soul and with all your strength and with all your mind, and your neighbor as yourself.”
translation:
  language: zh_hans
  text: 他回答说：“你要用全心、全灵魂、全力和全心思爱主——你的上帝；也要爱邻人，如同爱自己。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: 他回答说
  rationale: 保留分词加限定动词的叙事表达，同时符合现代汉语习惯。
- source_word: Ἀγαπήσεις
  choice: 你要……爱
  rationale: 此处将来时陈述语气承载经文命令的效力；“你要”既自然，也保留诫命语气。
- source_word: κύριον τὸν θεόν σου
  choice: 主你的上帝
  rationale: “主”保留 κύριος 的神圣称号，“你的上帝”直接表达 covenantal address；按原文次序组成“主你的上帝”，也与后面的“爱他”自然衔接。
- source_word: ἐξ ὅλης τῆς καρδίας σου
  choice: 从全心
  rationale: 用“从”保留 ἐξ 的来源/出发点意味，并与后三个 ἐν 短语有所区别；“全心”是简洁、自然的现代汉语。
- source_word: ἐν ὅλῃ τῇ ψυχῇ σου
  choice: 用你的全灵
  rationale: “灵”在此保留 ψυχή 所指的生命与内在自我，不把它限定为技术性的人论组成部分；“用”表达投入全部自身的工具/方式意味。
- source_word: ἐν ὅλῃ τῇ ἰσχύϊ σου
  choice: 用你的全部力量
  rationale: ἰσχύς 指力量、能力；“全部力量”清楚自然。
- source_word: ἐν ὅλῃ τῇ διανοίᾳ σου
  choice: 用你的全部心思
  rationale: διάνοια 指思想、理解和心智能力；“心思”比单独的“心”更能与 καρδία 区分。
- source_word: τὸν πλησίον σου
  choice: 邻人
  rationale: “邻人”准确保留伦理关系范畴，也不把范围缩窄为住处相邻的人。
- source_word: ὡς σεαυτόν
  choice: 如同自己
  rationale: 自然表达 ὡς 的比较意义。
theological_decisions:
- issue: 引用诫命时 κύριος 的译法
  choice: 主
  alternative: 主人
  rationale: 这里指以色列的上帝；“主”保留神圣称号及经文互文意义。
- issue: καρδία、ψυχή、ἰσχύς、διάνοια 的四重表达
  choice: 分别译作全心、全灵、全部力量、全部心思
  alternative: 合并意译为“用你的全人”
  rationale: 保留四个彼此重叠却不同的词，维持原文强调全然委身的修辞，也避免强加僵硬的人论划分。
- issue: 爱邻人的省略结构
  choice: 补出“爱”，并以分号区分两项诫命
  alternative: 直译为“并且邻人如同自己”
  rationale: 希腊文第二项承接前面的 Ἀγαπήσεις；汉语补出动词才能清楚自然，但不改变两项命令的关系。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“上帝”用于 θεός；保留“主”作为神圣称号。用“从全心”呈现首个介词与后三项的差别，脚注说明这一较不寻常但有原文依据的表达。
