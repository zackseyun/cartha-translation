  source_fidelity: 草稿保留了四重表达及第二项承接的“爱”，总体方向正确；但“从全心爱”在现代汉语中不自然，且会把ἐξ在此引文结构中未必需要突出的空间/来源义过度实体化。
  naturalness: “主你的上帝”不合现代标准汉语的名词结构；“从全心”“用你的全灵”也较生硬。以破折号处理同位语，并以并列的方式状语呈现四项，庄重、清楚且自然。
  terminology: 保留“主”“上帝”“爱”“邻人”，并将καρδία、ψυχή、ἰσχύς、διάνοια分别呈现为“心、灵魂、力量、心思”。“灵魂”比孤立的“灵”更符合ψυχή在此处指整个人的生命/内在自我的非技术性用法。
  issues:
  - severity: medium
    issue: “主你的上帝”语序不自然
    rationale: κύριον与τὸν θεόν σου同指一位对象；汉语宜译为“主——你的上帝”或“主你的上帝”（后者不合现代常规）。破折号能清楚标示同位语。
  - severity: medium
    issue: “从全心爱”不合现代汉语，且过度强调介词差异
    rationale: ἐξ与后三个ἐν的形式差异确实存在，但在这段经文引述中不足以要求汉语采用不通顺的“从全心”。自然的并列方式状语可忠实传达全然投入的命令。
  - severity: low
    issue: “全灵”容易被理解为技术性的‘灵’
    rationale: ψυχή在此不应被限定为灵性部分；“全灵魂”在四项并列中较清楚，并保留传统经文语域。
  revised_text: 他回答说：“你要用全心、全灵魂、全力和全心思爱主——你的上帝；也要爱邻人，如同爱自己。”
