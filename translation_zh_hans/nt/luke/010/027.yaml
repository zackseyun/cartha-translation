revisions:
- from: 他回答说：“你要从全心爱主你的上帝，并要用你的全灵、全部力量和全部心思爱他；也要爱邻人如同自己。”[a]
  to: 他回答说：“你要用全心、全灵魂、全力和全心思爱主——你的上帝；也要爱邻人，如同爱自己。”
  rationale: 修订仅处理不自然或可能误导的汉语表达：将神名短语改为自然的同位语结构；不以生硬的“从全心”硬译ἐξ，而以汉语可接受的并列状语保留四重修辞；将“全灵”改为“全灵魂”。第二项补出“爱”以反映希腊文承接的谓语，并将“如同爱自己”明确为比较所隐含的动作。删除原脚注，因为其所主张的介词对立不宜以不自然的正文译法强行再现，且该差异在本节语境中不构成需要读者注释的意义差别。
