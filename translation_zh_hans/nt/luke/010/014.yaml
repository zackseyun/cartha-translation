  text: πλὴν Τύρῳ καὶ Σιδῶνι ἀνεκτότερον ἔσται ἐν τῇ κρίσει ἢ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/014.yaml
  text: But it will be more bearable for Tyre and Sidon in the judgment than for you[a].
translation:
  language: zh_hans
  text: 不过，到审判的时候，推罗和西顿会比你们更容易承受。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“会比你们更可忍受。”
    reason: 词汇替代译法；ἀνεκτότερον也可较形式对应地译为“更可忍受”。
lexical_decisions:
- source_word: πλὴν
  choice: 不过
  rationale: 承接上文并形成强烈转折；“不过”自然、庄重，又保留希腊语的对比语气。
- source_word: Τύρῳ καὶ Σιδῶνι
  choice: 推罗和西顿所受的
  rationale: 两个与格名词是比较结构中承受审判的一方；用“所受的”补明汉语中省略的比较内容，使句意顺畅而不增添具体刑罚概念。
- source_word: ἀνεκτότερον
  choice: 更容易忍受
  rationale: 准确表达比较级“较可忍受、较能承受”；现代汉语自然，并保留程度不同的含义。
- source_word: ἔσται
  choice: 会
  rationale: 表达将来意义，符合现代汉语习惯，避免生硬直译系词。
- source_word: ἐν τῇ κρίσει
  choice: 在审判的日子
  rationale: 定冠词表明特指的审判；“审判的日子”在汉语中自然地表达该事件发生之时，但不在正文中进一步解释其性质。
- source_word: ἢ ὑμῖν
  choice: 比你们
  rationale: 完成比较结构；“你们”保留复数第二人称所指的受责备城镇居民。
theological_decisions:
- issue: κρίσις在上下文中的性质
  choice: 译作特指的“审判”，正文表述为“审判的日子”
  alternative: 泛指一般性的审判或现世惩罚
  rationale: 上下文将不悔改的城与推罗、西顿相比，强烈指向末后的神圣审判；译文保留这一指向，却不额外加入“末日”等解释性限定。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“推罗”“西顿”沿用通行圣经地名译法；比较句通过“所受的”避免汉语歧义，同时不具体化原文未明说的审判内容。
