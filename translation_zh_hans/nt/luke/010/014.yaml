- from: 不过，在审判的日子，推罗和西顿所受的，会比你们更容易忍受。[a]
  to: 不过，到审判的时候，推罗和西顿会比你们更容易承受。[a]
  rationale: 修订解决原译比较项不对称的问题，以“推罗和西顿会比你们更容易承受”保留希腊文的非人称、含蓄比较，不擅自补出“惩罚”等具体对象。“到审判的时候”对应ἐν τῇ κρίσει，且维持现代、庄重的普通话语体。
