review_pass:
  verdict: revise
  source_fidelity: 原文的比较结构是非人称表达：在审判中，推罗和西顿的处境将比“你们”的更可承受。草稿以“所受的”补足比较内容有其合理性，但后半句只说“比你们”，造成比较对象不对称，汉语中也不够完整。改为以推罗、西顿和“你们”同作承受者，既保留原文未明说具体惩罚内容的含蓄，也清楚表达比较关系。
  naturalness: “推罗和西顿所受的，会比你们更容易忍受”不够自然：前项是“所受的”（事物或处境），后项却是“你们”（人），且“更容易忍受”的逻辑主语不明确。以“推罗和西顿会比你们更容易承受”表达较为流畅、庄重，适合现代标准汉语圣经文本。
  terminology: “推罗”“西顿”为通行地名译法，应保留。“审判”准确对应 κρίσις；不宜在正文添加“末日”或“惩罚”等原文未明言的限定。“更容易承受”自然对应比较级 ἀνεκτότερον，脚注可保留“更可忍受”的近义替代。
  issues:
  - severity: medium
    issue: 比较结构的对象不对称且句法不完整
    rationale: 草稿前半的“推罗和西顿所受的”与后半的“比你们”不是同类比较项；按原文，推罗和西顿与“你们”均是与比较级相关的与格对象。修订使两方都成为“承受”的主体，避免把原文未明说的对象具体化。
  - severity: low
    issue: “审判的日子”较原文增加“日子”
    rationale: ἐν τῇ κρίσει直译为“在审判时／在审判中”。“审判的日子”在上下文可通，但“到审判的时候”更贴近原文的时间性表达，同时不引入额外名词。
  revised_text: 不过，到审判的时候，推罗和西顿会比你们更容易承受。[a]
  revised_footnotes:
  - marker: a
    text: 或译：“会比你们更可忍受。”
    reason: 词汇替代译法；ἀνεκτότερον也可较形式对应地译为“更可忍受”。
