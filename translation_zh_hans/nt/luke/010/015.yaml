source:
  edition: SBLGNT
  text: καὶ σύ, Καφαρναούμ, ⸂μὴ ἕως οὐρανοῦ ὑψωθήσῃ⸃; ἕως ⸀τοῦ ᾅδου ⸀καταβιβασθήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/015.yaml
  text: And you[a], Capernaum, will you be exalted to heaven? You will be brought down to Hades.
translation:
  language: zh_hans
  text: 而你，迦百农啊，难道会被高举到天上吗？你必被降到阴间[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “阴间”指死者的领域；希腊文作“哈得斯”（Hades），不是γέεννα（Gehenna；通常译作“地狱”）。
    reason: 说明ᾅδης的词义，并保留其与γέεννα之间的词汇区别，避免将两者混同。
lexical_decisions:
- source_word: Καφαρναούμ
  choice: 迦百农
  rationale: 采用现代中文圣经读者熟悉的标准地名译法。
- source_word: μὴ ... ὑψωθήσῃ
  choice: 难道会被高举
  rationale: 将 μή 引导的句子译为预期否定回答的反问，并以“被高举”保留动词的被动形式及地位升高的含义。
- source_word: ἕως οὐρανοῦ
  choice: 到天上
  rationale: ἕως加属格在此表示所达到的程度或界限；“到天上”自然地保留与下到阴间相对的垂直意象。
- source_word: ἕως τοῦ ᾅδου
  choice: 到阴间
  rationale: ᾅδης指死者的领域；中文“阴间”较自然，也避免误译为通常带有最终刑罚含义的“地狱”。
- source_word: καταβιβασθήσῃ
  choice: 你必被降到
  rationale: 保留将来被动语态，表达被使之下降以及受审判、遭贬抑的意味，而不加强为“被抛下”。
- source_word: καὶ σύ
  choice: 你呢
  rationale: καί在对迦百农转而发话时带有追加和强调作用；“你呢”在现代汉语中自然呈现这种直接而突出的语气。
theological_decisions:
- issue: ᾅδης的译法
  choice: 阴间
  alternative: 哈得斯；死人之境；地狱
  rationale: “阴间”可表达死者所在的领域，并保留ᾅδης与γέεννα（通常译作“地狱”）之间的词义区别；脚注进一步说明，以免读者把两者等同。
- issue: μὴ ... ὑψωθήσῃ的句法
  choice: 译作预期否定回答的反问
  alternative: 译作直陈否定：“你不会被高举到天上”
  rationale: μή用于此类独立疑问句时通常期待否定回答；保留问句更贴近希腊文本的修辞力度，同时不把隐含答案改写成直陈句。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“迦百农啊”保留呼语，“你呢”传达καὶ σύ的强调；上下两句以“高举到天上”与“降到阴间”形成鲜明对照。
