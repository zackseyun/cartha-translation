  text: ὑπάγετε· ⸀ἰδοὺ ἀποστέλλω ὑμᾶς ὡς ἄρνας ἐν μέσῳ λύκων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/003.yaml
  text: Go[a]; behold[b], I am sending you out as lambs in the midst of wolves.
translation:
  language: zh_hans
  text: 你们去吧！看哪，我差你们出去，如同羊羔[a]在群狼之中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文特指“羊羔”，不是泛指“羊”。
    reason: lexical_precision
lexical_decisions:
- source_word: ὑπάγετε
  choice: 你们去吧
  rationale: 第二人称复数、现在时命令式；用“你们”明确复数对象，以“去吧”自然、简洁地表达差遣命令。
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 这是引人注意下文的话语标记。“看哪”兼顾现代可懂度与庄重语体，也保留其提示和强调作用。
- source_word: ἀποστέλλω ὑμᾶς
  choice: 我差你们出去
  rationale: 现在时直陈语气加复数宾语；“差……出去”自然体现此处奉差外出的语境，又不把该词过度解释为正式的“委任”。
- source_word: ὡς
  choice: 如同
  rationale: 明确表达比喻关系，而非身份等同。
- source_word: ἄρνας
  choice: 羊羔
  rationale: ἀρήν特指羔羊；“羊羔”保留门徒柔弱、易受伤害的鲜明意象，不泛化为“羊”。
- source_word: ἐν μέσῳ λύκων
  choice: 在群狼之中
  rationale: 贴近原文“在狼的中间”，同时“群狼之中”在现代汉语中自然有力，并保留被敌对力量环绕的图景。
theological_decisions:
- issue: 门徒受差遣时的动物比喻
  choice: 如同羊羔在群狼之中
  alternative: 如同羊在狼群中
  rationale: 原文使用ἄρνας，明确指“羊羔”，不是泛指羊的πρόβατα。保留“羊羔”可传达格外脆弱的处境，也避免受其他相近经文措辞影响而作协调性翻译。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“看哪”保留原文引人注意的语用力量；“群狼之中”兼顾原文结构与汉语表达。
