base_translation:
  language: en
  yaml_path: translation/nt/luke/010/030.yaml
  text: Jesus replied, “A certain man was going down from Jerusalem to Jericho, and he fell among robbers, who also stripped him, beat him, and went away, leaving him half dead.”
translation:
  language: zh_hans
  text: 耶稣接着说：“有一个人从耶路撒冷下到耶利哥去，落在强盗手中。他们剥去他的衣服，把他打伤，就走了，留下他奄奄一息。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπολαβὼν δὲ
  choice: 接着说
  rationale: 这里表示耶稣承接律法师的话作出回应；“接着说”自然简洁，同时保留叙事衔接。
- source_word: κατέβαινεν
  choice: 下……去
  rationale: 耶路撒冷地势较高，前往耶利哥确是下行；此译法保留原文的地理方向。
- source_word: λῃσταῖς περιέπεσεν
  choice: 落在强盗手中
  rationale: 这是自然的现代汉语表达，准确传达遭遇强盗并受其侵害，而非偶然置身其间。
- source_word: ἐκδύσαντες αὐτὸν
  choice: 剥去他的衣服
  rationale: 明确表达强盗将此人的衣物脱去，也符合抢掠语境。
- source_word: πληγὰς ἐπιθέντες
  choice: 把他打伤
  rationale: 原短语直指施加创伤；“打伤”比逐字译作“加上伤口”自然，并保留暴力造成伤势的含义。
- source_word: ἡμιθανῆ
  choice: 半死不活
  rationale: 现代汉语常用且准确地表达尚未死亡、却濒临死亡的状态。
