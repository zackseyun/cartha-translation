base_translation:
  language: en
  yaml_path: translation/nt/luke/010/002.yaml
  text: And he said to them[a], “The harvest is plentiful, but the workers are few. Therefore pray to the Lord of the harvest that he would send out workers into his harvest.”
translation:
  language: zh_hans
  text: 他对他们说：“庄稼多，工人却少。所以，你们要祈求庄稼的主，差派[a]工人到他的庄稼中去收割。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“强力地催派出去”；原文动词的语气可以比一般的“差派”更强。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: 说
  rationale: 未完成时在叙事引语中可自然译为“说”；不必机械译成“不断地说”。
- source_word: δὲ
  choice: 又
  rationale: 此处是轻微的叙事连接词；“又”自然承接上文，不赋予过强的转折意味。
- source_word: θερισμός
  choice: 庄稼
  rationale: 保留收割的农业意象；在“庄稼的主”和“收庄稼”的搭配中，现代汉语清楚自然。
- source_word: πολύς
  choice: 多
  rationale: 简洁传达庄稼数量丰盛，并与后面的“少”形成鲜明对照。
- source_word: ἐργάται
  choice: 工人
  rationale: 指参与收割工作的人；“工人”是现代、通俗而不过度限定身份的表达。
- source_word: ὀλίγοι
  choice: 少
  rationale: 直接对应“多”，保留原文简明的对比结构。
- source_word: δεήθητε
  choice: 要祈求
  rationale: 该命令式表达恳切请求；“祈求”既体现向神求告，也保留命令语气。
- source_word: οὖν
  choice: 所以
  rationale: 明确表示下文的命令是从庄稼多、工人少这一事实所得出的结论。
- source_word: κύριος
  choice: 主
  rationale: 既表达拥有权和权柄，也保留此称号潜在的神学含义。
- source_word: ὅπως
  choice: 求
  rationale: 在汉语“祈求……求他……”结构中自然引出祈求的内容与目的。
- source_word: ἐκβάλῃ
  choice: 差派
  rationale: 在此语境中表示把工人派出去；正文采用自然的使命用语，而以脚注保留该动词可能具有的更强推动意味。
- source_word: εἰς τὸν θερισμὸν αὐτοῦ
  choice: 出去收他的庄稼
  rationale: 以自然汉语表达工人进入收割工作的目的，同时保留“他的”所表达的归属关系。
theological_decisions:
- issue: “庄稼的主”的所指与含义
  choice: 保留“庄稼的主”这一比喻性称号，不在正文中说明其具体所指。
  alternative: 明确解释为拥有并指挥使命工作的神，或进一步说明其基督论含义。
  rationale: 原文强调这位主拥有庄稼并差派工人，却没有在本节进一步解释其所指；保留称号可避免消解原有的神学张力。
translation_notes:
  register: 采用现代、庄重而通俗的普通话。“庄稼多，工人却少”保留原文简洁有力的对比；“差派工人出去收他的庄稼”兼顾农业比喻与汉语自然度。脚注标记置于其实际说明的动词之后。
