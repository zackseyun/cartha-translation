review_pass:
  verdict: revise
  source_fidelity: 译文整体忠实地传达了马大因大量家务服侍而受牵扯、向耶稣抱怨妹妹让她独自服侍，并请求耶稣叫妹妹协助她的意思。需微调首句，使 περιεσπᾶτο 所含的“受牵扯、分心”不被较泛的“忙乱”单独取代；末句的“吩咐”也略强于 εἰπὲ（对她说／叫她）。
  naturalness: “被许多服侍的事弄得忙乱”可理解，但“弄得”稍显口语且表达重心偏向忙碌。改为“为许多服侍的事分心忙乱”较自然，并更贴合原文。对话中“那就请你叫她来帮我”直接、现代，也符合马大急切的请求。
  terminology: “主啊”恰当地保留 Κύριε 的称谓。“服侍”适用于此处家庭接待中的实际服务，未误导为正式职分。“帮我”自然地表达 συναντιλάβηται 所指加入并共同承担。
  issues:
  - severity: low
    issue: 首句“被许多服侍的事弄得忙乱”未明确呈现“受牵扯／分心”。
    rationale: περιεσπᾶτο 不只是忙碌，而是持续地被许多服侍牵扯、分散注意。加入“分心”能保留这一核心语义，同时维持现代汉语的自然表达。
  - severity: low
    issue: “吩咐她”语气略强。
    rationale: εἰπὲ αὐτῇ 基本义为“对她说／告诉她”，上下文当然带有请求其行动的意思；“叫她”在汉语中更准确自然，避免把耶稣的话预设为严厉命令。
  - severity: low
    issue: 英文审校轨迹中的问句替代译法未在中文脚注中保留。
    rationale: 在“你不在意吗？”处增设“或译：你不关心吗？”可保留 οὐ μέλει σοι 的常见词汇替代，并提供清楚的脚注锚点。
