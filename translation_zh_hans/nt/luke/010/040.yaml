  to: 马大却为许多服侍的事分心忙乱。她上前来，说：“主啊，我妹妹留下我一个人服侍，你不在意吗？〔a〕那就请你叫她来帮我。”
  rationale: 修订保留原文的未完成时背景描写和马大直接的投诉语气。“分心忙乱”兼顾 περιεσπᾶτο 的受牵扯、分散之意与中文叙事的顺畅；“许多服侍的事”维持家庭服务的具体语境；“叫她来帮我”准确表达请求妹妹加入协助，而不加强为命令。
