  text: ἡ δὲ Μάρθα περιεσπᾶτο περὶ πολλὴν διακονίαν· ἐπιστᾶσα δὲ εἶπεν· Κύριε, οὐ μέλει σοι ὅτι ἡ ἀδελφή μου μόνην με ⸀κατέλειπεν διακονεῖν; ⸀εἰπὲ οὖν αὐτῇ ἵνα μοι συναντιλάβηται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/040.yaml
  text: But Martha was distracted with much serving. And she came up and said[a], “Lord, does it not matter to you that my sister has left me to serve alone? Tell her, then, to help me.”
translation:
  language: zh_hans
  text: 马大却为许多服侍的事分心忙乱。她上前来，说：“主啊，我妹妹留下我一个人服侍，你不在意吗？〔a〕那就请你叫她来帮我。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περιεσπᾶτο
  choice: 被……弄得忙乱
  rationale: 该未完成时中间/被动形式描写马大持续被事务牵扯、分心的状态。“忙乱”在现代汉语中自然，也保留了她的注意力被许多事务分散的意味。
- source_word: περὶ πολλὴν διακονίαν
  choice: 许多服侍的事
  rationale: 此处指家庭接待情境中的实际服侍，而非正式宗教职分；这一译法既保留“服侍”，又符合现代汉语表达。
- source_word: ἐπιστᾶσα
  choice: 上前来
  rationale: 分词表示她走近或来到跟前，然后开口；“上前来”简洁自然。
- source_word: Κύριε
  choice: 主啊
  rationale: 保留对耶稣的尊称及路加福音中 κύριος 的广泛用法。
- source_word: οὐ μέλει σοι
  choice: 你不在意吗
  rationale: 该惯用语询问此事是否为对方所关切；译文保留马大的埋怨语气，却不过度强化为冷漠或无情。
- source_word: μόνην με κατέλειπεν διακονεῖν
  choice: 留下我一个人服侍
  rationale: 同时表达 μόνην 的“独自”及 διακονεῖν 的“服侍”，不采用语气过强的“抛下”。
- source_word: εἰπὲ οὖν αὐτῇ
  choice: 所以请你吩咐她
  rationale: “所以”体现 οὖν 的推论关系；“吩咐”传达马大要求主对妹妹说话并使其行动的直接语气，“请”使汉语对话自然。
- source_word: συναντιλάβηται
  choice: 来帮我
  rationale: 该动词表示加入并共同承担、协助；在语境中“来帮我”清楚自然，共同参与的含义由上下文体现。
theological_decisions:
- issue: 马大称呼耶稣时 κύριος 的译法
  choice: 主
  alternative: 夫子
  rationale: “主”既是自然的尊称，也保留路加叙事中该称号可能具有的更深层意义；本节无需把它限定为仅指教师身份。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事语言。“被许多服侍的事弄得忙乱”保留原文受牵扯、分心的动态感；马大的问话和请求则保持直接，呈现其抱怨与急切而不额外评断她的动机。
