  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ προσελθὼν κατέδησεν τὰ τραύματα αὐτοῦ ἐπιχέων ἔλαιον καὶ οἶνον, ἐπιβιβάσας δὲ αὐτὸν ἐπὶ τὸ ἴδιον κτῆνος ἤγαγεν αὐτὸν εἰς πανδοχεῖον καὶ ἐπεμελήθη αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/034.yaml
  text: And coming near[a], he bound up his wounds, pouring on oil and wine. Then he put him on his own animal, brought him to an inn[b], and took care of him.
translation:
  language: zh_hans
  text: 他走到那人跟前，包扎他的伤口，把油和酒倒在伤口上。然后，他把那人安置在自己的牲口[a]上，带到客店，并照料他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “牲口”指供骑乘或驮载的家畜；原文没有说明是哪一种动物。
    reason: cultural_note
lexical_decisions:
- source_word: προσελθὼν
  choice: 走到那人跟前
  rationale: 表达朝伤者走近的动作，并将希腊文语境中明确的对象自然补出；分词所表示的先行或伴随动作也得到保留。
- source_word: κατέδησεν
  choice: 包扎
  rationale: 该词在这里指把伤口缠裹起来；“包扎”是现代汉语中准确、自然的医疗用语。
- source_word: τραύματα
  choice: 伤口
  rationale: 指遭袭后身体上的创伤；“伤口”比泛指的“伤势”更贴合随后倒油和酒并包扎的动作。
- source_word: ἐπιχέων
  choice: 把……倒在……上
  rationale: 保留液体倾倒、施于伤口之上的具体动作，也体现该分词说明包扎时的伴随方式。
- source_word: ἔλαιον
  choice: 油
  rationale: 与希腊词保持直接对应，不在正文中过度明示其通常所指的橄榄油。
- source_word: οἶνον
  choice: 酒
  rationale: 直接、自然地对应原词；不把可能的医用功效写入正文。
- source_word: ἐπιβιβάσας
  choice: 扶那人上了
  rationale: 自然表达将受伤者安置到牲口背上的动作；“扶”符合伤者需要帮助的语境，但不额外说明具体姿势。
- source_word: τὸ ἴδιον κτῆνος
  choice: 自己的牲口
  rationale: “自己的”保留ἴδιον的强调；“牲口”可指供骑乘或驮载的家畜，同时避免擅自确定具体动物种类。
- source_word: πανδοχεῖον
  choice: 客店
  rationale: 简洁表达接待旅客住宿的场所，语体庄重而不古奥。
- source_word: ἐπεμελήθη
  choice: 照料
  rationale: 体现亲自关怀和料理伤者的持续行动，符合现代标准汉语。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“那人”适度补明代词所指，避免连续使用“他”造成歧义；整体保留原文连续展开的救助动作，不加入寓意化或宗派性解释。
