source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ νομικός τις ἀνέστη ἐκπειράζων ⸀αὐτὸν λέγων· Διδάσκαλε, τί ποιήσας ζωὴν αἰώνιον κληρονομήσω;
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/025.yaml
  text: And behold[a], a lawyer stood up, testing him, saying, “Teacher, what must I do to inherit eternal life?”
translation:
  language: zh_hans
  text: 看哪，有一个律法师[a]站起来，要试探耶稣，就问他说：“老师，我该做什么，才能承受永生？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “律法师”指熟悉并讲解犹太律法的专家，并非现代意义上的律师。
    reason: 说明νομικός在当时犹太宗教与律法语境中的专门含义，防止现代职业联想造成误解。
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: 看哪
  rationale: 保留ἰδού引人注意、使叙事更鲜明的作用；不机械添加“和”，以符合现代汉语叙事习惯。
- source_word: νομικός τις
  choice: 有一个律法师
  rationale: νομικός在这里指熟悉并讲解摩西律法的人，而不是现代世俗法律职业者。“律法师”简洁，并保留当时犹太语境中的专门含义。
- source_word: ἀνέστη
  choice: 站起来
  rationale: 直接表达人物起身发言的叙事动作，现代汉语自然清楚。
- source_word: ἐκπειράζων αὐτὸν
  choice: 试探他
  rationale: ἐκπειράζω表示带着考察或挑战意味加以测试；“试探”保留其可能含有敌意的力度，又不进一步断定此人的全部动机。
- source_word: Διδάσκαλε
  choice: 老师
  rationale: 准确表达对教导者的称呼，比“夫子”更符合现代普通话，同时保持尊称语气。
- source_word: τί ποιήσας
  choice: 我该做什么，才能
  rationale: 将希腊语分词与将来时的结构自然转化为现代汉语的条件—结果表达，并保留提问者以“做什么”为切入点的表述。
- source_word: ζωὴν αἰώνιον
  choice: 永生
  rationale: “永生”是简洁、通行且语义准确的表达。
- source_word: κληρονομήσω
  choice: 承受
  rationale: “承受”保留κληρονομέω的继承产业意象，避免弱化为一般性的“得到”。
theological_decisions:
- issue: νομικός在第二圣殿时期犹太语境中的含义
  choice: 译作“律法师”，并以脚注说明是摩西律法专家
  alternative: 律法专家；法律师
  rationale: 该词所指的是研习和解释犹太律法的人；“律法师”既简练，也不会误导为现代民事或刑事律师。
- issue: τί ποιήσας ... κληρονομήσω的神学张力
  choice: 译作“我该做什么，才能承受永生”
  alternative: 我做了什么，就会承受永生；我当做什么才可以承受永生
  rationale: 保留提问者将“做什么”与“承受永生”相联系的问法，不预先赞同、否定或系统化其神学前提。
- issue: ἐκπειράζων所表达的动机
  choice: 译作“试探他”
  alternative: 考验他；测试他
  rationale: “试探”传达该动词较强的考验或挑战意味，但正文不额外说明其动机究竟恶劣到何种程度，从而保留原文可感知的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”保留原文引人注意的叙事标记；“老师”避免古奥；整体句式自然，同时保留“做”与“承受”之间的神学张力。
