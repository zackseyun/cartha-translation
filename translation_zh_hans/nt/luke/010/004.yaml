  text: μὴ βαστάζετε βαλλάντιον, μὴ πήραν, ⸀μὴ ὑποδήματα, καὶ μηδένα κατὰ τὴν ὁδὸν ἀσπάσησθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/004.yaml
  text: Do not carry a money bag[a], a travel bag, or sandals[b], and greet no one along the road.
translation:
  language: zh_hans
  text: 不要带钱袋、行囊[a]或鞋；在路上不要向任何人问安。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “行囊”也可译作“旅行袋”或“袋子”。
    reason: lexical_alternative
  - marker: b
    text: 这很可能不是禁止一般的礼貌问候，而是强调使命紧迫，不可因当时可能耗时较久的社交问候而耽搁。
    reason: cultural_note
lexical_decisions:
- source_word: βαστάζετε
  choice: 带
  rationale: 本词意为携带、负载；在出行指示中译作“带”最自然，也准确表达不得随身携带这些物品。
- source_word: βαλλάντιον
  choice: 钱袋
  rationale: 指盛放钱财的袋子。“钱袋”简明清楚，也符合古代背景。
- source_word: πήραν
  choice: 行囊
  rationale: 指旅途中装食物或用品的袋子。“行囊”既表达其旅行用途，也保持简洁庄重。
- source_word: ὑποδήματα
  choice: 鞋
  rationale: 泛指脚上穿的物品，在当时通常是凉鞋。正文用“鞋”准确保留词义范围，脚注无需把历史上常见的具体样式写入正文。
- source_word: μηδένα
  choice: 任何人
  rationale: 与否定命令连用，构成“不要向任何人”的自然现代汉语表达。
- source_word: κατὰ τὴν ὁδόν
  choice: 在路上
  rationale: 这是表示行程途中或沿路的惯用语；“在路上”自然、准确，并保留具体的旅行场景。
- source_word: ἀσπάσησθε
  choice: 问安
  rationale: 本词表示问候、致意。“问安”适合本段庄重语体，也能涵盖当时较正式的社交问候。
theological_decisions:
- issue: 途中不得问安这一命令的力度
  choice: 正文直译为“在路上不要向任何人问安”
  alternative: 意译为“不要因沿途与人寒暄而耽搁”
  rationale: 希腊文使用直接的否定命令，正文应保留其明确力度，不把可能的文化含义直接写成释义。有关当时问候可能耗时、使命具有紧迫性的理解，放入脚注说明更合适。
translation_notes:
  register: 采用自然、简洁而庄重的现代标准汉语。“带”比“携带”更贴近日常表达；“问安”则比“打招呼”更符合经文语体，同时仍容易理解。脚注标记按其实际说明对象放置，避免英文咨询层中标记与脚注内容错位的问题。
