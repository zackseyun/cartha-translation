  text: Ὁ δὲ θέλων ⸀δικαιῶσαι ἑαυτὸν εἶπεν πρὸς τὸν Ἰησοῦν· Καὶ τίς ἐστίν μου πλησίον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/029.yaml
  text: But he[a], wanting to justify himself, said to Jesus, “And who is my neighbor?”
translation:
  language: zh_hans
  text: 但那人想要证明自己有理，就对耶稣说：“那么，谁是我的邻舍[a]呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“谁算是我的邻舍呢？”
    reason: 词义与语用上的另一种表达，显明问题可能是在追问“邻舍”的界限。
lexical_decisions:
- source_word: θέλων
  choice: 想要
  rationale: 现在时分词说明那人的动机或意图；“想要”自然地保留这一含义。
- source_word: δικαιῶσαι ἑαυτὸν
  choice: 证明自己有理
  rationale: 此处指那人企图表明自己站得住脚，而不是特指保罗书信中称义的法庭性神学用语；这一译法符合现代汉语，也保留叙事中的反讽。
- source_word: εἶπεν πρὸς τὸν Ἰησοῦν
  choice: 对耶稣说
  rationale: 按普通现代汉语直译叙事中的说话公式。
- source_word: Καὶ
  choice: 那么
  rationale: 这里承接前文并引出追问；“那么”比机械译作“和”更符合汉语对话，同时保留衔接作用。
- source_word: τίς ἐστίν μου πλησίον
  choice: 谁是我的邻舍呢
  rationale: πλησίον名词化使用，指律法语境中的“邻舍”；直问形式保留原文的开放性，不在正文中先行解释为“谁算是”。
theological_decisions:
- issue: δικαιῶσαι ἑαυτόν的含义
  choice: 译为那人想“证明自己有理”
  alternative: 为自己辩解；使自己显为义；证明自己是义的
  rationale: 上下文是关于律法与行为的问答，该短语主要表达自我辩护或自证有理。译文避免把它限定为系统神学意义上的“称义”，也不排除其道德和法理色彩。
- issue: “邻舍”的范围
  choice: 正文保留“谁是我的邻舍”
  alternative: 谁算是我的邻舍
  rationale: 原问句本身可以理解为询问邻舍的身份或界限；正文不替提问者明说其限定范围的意图，脚注提示更具解释性的表达。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“邻舍”保留圣经与律法语境中的传统称谓；“证明自己有理”比“称自己为义”更符合当代普通读者的理解。
