  text: καὶ ἰδοὺ ἀνὴρ ἀπὸ τοῦ ὄχλου ⸀ἐβόησεν λέγων· Διδάσκαλε, δέομαί σου ἐπιβλέψαι ἐπὶ τὸν υἱόν μου, ὅτι μονογενής ⸂μοί ἐστιν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/038.yaml
  text: And behold[a], a man from the crowd cried out, saying, “Teacher, I beg you to look upon my son, because he is my only child.”
translation:
  language: zh_hans
  text: 看哪[a]，一个男人从人群中高声喊道：“老师，我求你看看我的儿子，因为他是我的独生子。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “独生子”也可译作“唯一的儿子”或“唯一的孩子”。希腊原文直译为“他对我来说是唯一的”；上下文已经说明这孩子是儿子，因此两种译法都有可能。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留原文引人注意并推进叙事的语用功能，也体现路加叙事略带庄重的风格。
- source_word: ἀνὴρ
  choice: 一个男人
  rationale: 准确保留该名词所指的成年男性，而不泛化为“一个人”。
- source_word: ἀπὸ τοῦ ὄχλου
  choice: 人群中
  rationale: 以自然的现代汉语表达此人是聚集人群中的一员。
- source_word: ἐβόησεν
  choice: 高声喊道
  rationale: 传达大声呼喊及恳求的急迫感，又不过度渲染。
- source_word: λέγων
  choice: 喊道
  rationale: 汉语用引出直接引语的“道”自然整合希腊语分词，不必机械另译“说”。
- source_word: Διδάσκαλε
  choice: 老师
  rationale: 直接表达称呼语“教师”，不加入“主人”等原文未必具有的权威或隶属色彩。
- source_word: δέομαί σου
  choice: 我求你
  rationale: 表达诚恳而迫切的请求，强于普通的“请”，同时符合现代口语。
- source_word: ἐπιβλέψαι ἐπὶ
  choice: 看看
  rationale: 在此恳求语境中不只是视觉观看，也自然暗含关注、照顾之意；“看看”最符合现代汉语表达。
- source_word: τὸν υἱόν μου
  choice: 我的儿子
  rationale: 直接、准确地保留亲属关系及男性性别。
- source_word: μονογενής
  choice: 独生子
  rationale: 结合前文已明确为“儿子”，表达他是父亲唯一的孩子；同时以脚注保留“唯一的儿子/唯一的孩子”之间的语义可能性。
- source_word: μοί ἐστιν
  choice: 他是我的
  rationale: 将与εἰμί连用的与格代词按汉语所有关系自然表达，并融入“我的独生子”。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“看哪”略具经文文体色彩，用于保留ἰδού的提示作用；父亲的话则保持自然、迫切。“一个男人”虽比“一个人”略显明确，但忠实保留ἀνήρ的性别指向。
