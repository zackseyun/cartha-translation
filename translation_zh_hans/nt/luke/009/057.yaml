  text: ⸀Καὶ πορευομένων αὐτῶν ἐν τῇ ὁδῷ εἶπέν τις πρὸς αὐτόν· Ἀκολουθήσω σοι ὅπου ⸀ἐὰν ⸀ἀπέρχῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/057.yaml
  text: And as they were going along the road[a], someone said to him, “I will follow you wherever you go.”
translation:
  language: zh_hans
  text: 他们在路上行走的时候，有人对他说：“无论你去哪里，我都要跟从你。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πορευομένων αὐτῶν
  choice: 他们……行走的时候
  rationale: 属格独立结构中的现在时分词表示与主句同时发生、持续进行的行动；这样译成现代汉语自然，并保留时间关系。
- source_word: ἐν τῇ ὁδῷ
  choice: 在路上
  rationale: 保留具体的行旅场景，也不妨碍路加叙事中“行程”主题可能产生的共鸣。
- source_word: εἶπέν τις
  choice: 有人……说
  rationale: τις是不定代词，原文没有明确说此人的性别，因此不增译为“一个人”或“一个男人”。
- source_word: πρὸς αὐτόν
  choice: 对他说
  rationale: 符合现代汉语中引出说话对象的惯常表达。
- source_word: Ἀκολουθήσω σοι
  choice: 我都要跟从你
  rationale: 将来时表达意愿或承诺；“跟从”同时保留实际随行和作门徒的含义，不作解释性扩写。“都”与前面的“无论”呼应，表达不受地点限制，并非另加内容。
- source_word: ὅπου ἐὰν ἀπέρχῃ
  choice: 无论你去哪里
  rationale: ὅπου与ἐάν及虚拟语气构成不定关系表达，意为“无论哪里”；ἀπέρχομαι可指离开或前往，此处用“去”最自然，也保留承诺跟随至任何地方的意思。
theological_decisions:
- issue: ἀκολουθέω在本节中的门徒含义
  choice: 译作“跟从”，不扩写为“作你的门徒”
  alternative: 无论你去哪里，我都要作你的门徒
  rationale: 该动词在路加福音中具有门徒身份的内涵，但也保留实际随行的画面；“跟从”可以兼顾两层含义，避免替原文消除张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“他们在路上行走的时候”清楚呈现持续行进的背景；引语简洁有力，适合公开诵读。原文不存在必须以脚注交代的文本或词义差异，因此不设置脚注。
