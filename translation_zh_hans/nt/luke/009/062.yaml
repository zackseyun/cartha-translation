  text: εἶπεν δὲ ⸂ὁ Ἰησοῦς⸃· Οὐδεὶς ἐπιβαλὼν τὴν ⸀χεῖρα ἐπ’ ἄροτρον καὶ βλέπων εἰς τὰ ὀπίσω εὔθετός ἐστιν ⸂τῇ βασιλείᾳ⸃ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/062.yaml
  text: But Jesus said[b][a], “No one who has put his hand to the plow and looks back is fit for the kingdom of God.”
translation:
  language: zh_hans
  text: 耶稣说：“凡已经把手放在犁上又向后看的人，都不适合神的国[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “适合”也可译作“合用”或“适于”。原词强调适宜或适于某种目的，并未明确说明这里专指进入神的国，还是在神的国中服事。
    reason: 保留εὔθετος的词义范围及其神学张力。
lexical_decisions:
- source_word: δὲ
  choice: 却
  rationale: δέ在这里承接并回应前一句话，带有轻微的转折意味；“却”自然表现耶稣对那人请求的纠正性回应。
- source_word: Οὐδεὶς
  choice: 没有人
  rationale: 泛指任何人，保留原文绝对而普遍的否定，不加入性别限定。
- source_word: ἐπιβαλὼν τὴν χεῖρα ἐπ’ ἄροτρον
  choice: 已经把手扶在犁上
  rationale: 不定过去时分词表示开始耕作的动作先已发生；“扶在犁上”符合现代汉语对操犁动作的自然表达，也保留农业意象。
- source_word: βλέπων εἰς τὰ ὀπίσω
  choice: 还向后看
  rationale: 现在时分词表达持续或当下的动作；“向后看”保留字面画面及心志不专一的隐喻，“还”突出已开始耕作却继续回望的张力。
- source_word: εὔθετός
  choice: 适合
  rationale: 该词表示适宜、合用或适于某一目的。“适合”保留评价力度，又不把意思限定为道德上的“配得”或最终能否得救。
- source_word: τῇ βασιλείᾳ τοῦ θεοῦ
  choice: 神的国
  rationale: 与εὔθετος连用，表示“适合神的国”。“神的国”是现代中文圣经语境中自然、明确的表达，并保留βασιλεία既可指国度也可涉及王权统治的语义背景。
theological_decisions:
- issue: εὔθετός ἐστιν τῇ βασιλείᾳ τοῦ θεοῦ所指的资格或功用
  choice: 译为“适合神的国”，保留对门徒专一委身是否相称的警告
  alternative: “配进神的国”或“在神国的事工上有用”
  rationale: 原文只说“适合、合用”，没有明确限定为进入神国的终极得救资格，也没有明确限定为事奉功效；因此不在正文中替原文消除这层张力。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“把手扶在犁上……向后看”保留原文鲜明的耕作画面；句式简洁，普通读者易于理解，同时避免使用可能把含义过度解释为得救资格的“配得”或“配进”。
