  text: καὶ φωνὴ ἐγένετο ἐκ τῆς νεφέλης λέγουσα· Οὗτός ἐστιν ὁ υἱός μου ὁ ⸀ἐκλελεγμένος, αὐτοῦ ἀκούετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/035.yaml
  text: And a voice came from the cloud[a], saying, “This is my Son, the Chosen One; listen to him.”
translation:
  language: zh_hans
  text: 有声音从云中传来，说：“这是我的儿子，是蒙拣选的那一位[a]；你们要听从他。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“这是我的爱子”，而不是“这是我的儿子，是蒙拣选的那一位”。
    reason: textual_variant
lexical_decisions:
- source_word: φωνὴ ἐγένετο
  choice: 有声音传来
  rationale: 以自然的现代汉语表达声音出现这一事件，保留ἐγένετο的事件性，避免生硬直译为“有声音产生”。
- source_word: ἐκ τῆς νεφέλης
  choice: 云中
  rationale: ἐκ表示来源；“云中有声音传来”自然清楚地表达声音来自云中。
- source_word: λέγουσα
  choice: 说
  rationale: 该分词引出声音所说的内容，汉语叙事中用“说”最自然。
- source_word: Οὗτός ἐστιν
  choice: 这是
  rationale: 准确表达指示代词与系词构成的认定句，同时符合现代汉语习惯。
- source_word: ὁ υἱός μου
  choice: 我的儿子
  rationale: 直接保留父子称谓和第一人称所属关系；中文无须以大写标示基督论称号。
- source_word: ὁ ἐκλελεγμένος
  choice: 蒙拣选的那一位
  rationale: 该词是ἐκλέγομαι的完成时被动分词，表示已经被拣选者。“蒙拣选”保留被动意义，“那一位”体现冠词使分词名词化的作用；不添加原文没有的第二个“我的”。
- source_word: αὐτοῦ ἀκούετε
  choice: 你们要听从他
  rationale: ἀκούετε在此为现在时命令语气，不只是听见，也有留心听取、遵从之意。“听从他”以自然汉语传达命令的力度，而不将其扩展成具体教义解释。
theological_decisions:
- issue: 天上声音对耶稣的基督论称谓之文本异文
  choice: 按SBLGNT正文将ἐκλελεγμένος译为“蒙拣选的那一位”
  alternative: 按异文ἀγαπητός译为“爱子”或“所爱的”
  rationale: 正文以所提供的希腊文证据为准，不与对观福音中更熟悉的“爱子”措辞协调。译文同时保留“我的儿子”和“蒙拣选的那一位”两个称谓，并在脚注注明异文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“蒙拣选”保留圣经语体所需的庄重感，同时仍为当代读者所理解；句式简洁，适合公开诵读。
