  text: εἶπεν δὲ καὶ ἕτερος· Ἀκολουθήσω σοι, κύριε· πρῶτον δὲ ἐπίτρεψόν μοι ἀποτάξασθαι τοῖς εἰς τὸν οἶκόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/061.yaml
  text: And another also said[a], “I will follow you, Lord[c][b], but first permit me to say farewell to those in my house.”
translation:
  language: zh_hans
  text: 另有一个人也说：“主啊，我要跟从你；但请准我先向家里的人告别。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ καὶ ἕτερος
  choice: 另有一个人也说
  rationale: 保留δὲ的承接作用和καί的附加意味，同时用现代汉语自然地引出又一位说话者。
- source_word: Ἀκολουθήσω σοι
  choice: 我要跟从你
  rationale: 将来时在这里表达说话者的意愿或承诺；“我要跟从你”既自然，也保留其主动意向。
- source_word: κύριε
  choice: 主啊
  rationale: “主”保留对耶稣的尊称及其可能具有的神学分量；语气词“啊”符合现代汉语直接称呼的表达。
- source_word: πρῶτον
  choice: 先
  rationale: 准确表达行动次序，并比“首先”更符合对话语体。
- source_word: ἐπίτρεψόν μοι
  choice: 请准我
  rationale: 该命令式在语境中是请求许可；“请准我”凝练、庄重，又不显生硬。
- source_word: ἀποτάξασθαι
  choice: 告别
  rationale: 此处中间态不定式表示辞别、告别，而非安排家务；“告别”在现代汉语中准确自然。
- source_word: τοῖς εἰς τὸν οἶκόν μου
  choice: 向家里的人
  rationale: 原文表达略不寻常，所指是说话者家中或属于其家的人；“家里的人”自然传达此义，而不把范围过度限定为正式意义上的“家属”或“全家”。
theological_decisions:
- issue: κύριε作为对耶稣的称呼
  choice: 主啊
  alternative: 先生／老师
  rationale: 原词既可作礼貌称呼，也可能带有更深的身份认信。“主啊”保留这种神学张力，不将其降格为纯粹世俗的称呼。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事表达。“请准我”体现请求许可的语气；“家里的人”使普通读者容易理解，同时避免将原文具体化为仅指血缘家属。
