source:
  edition: SBLGNT
  text: Ἀποκριθεὶς ⸀δὲ Ἰωάννης εἶπεν· Ἐπιστάτα, εἴδομέν τινα ⸀ἐν τῷ ὀνόματί σου ἐκβάλλοντα δαιμόνια, καὶ ⸀ἐκωλύομεν αὐτὸν ὅτι οὐκ ἀκολουθεῖ μεθ’ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/049.yaml
  text: Then John answered[a], “Master, we saw someone casting out demons in your name, and we tried to stop him because he does not follow with us.”
translation:
  language: zh_hans
  text: 约翰回答说：“老师，我们看见有人奉你的名赶鬼，我们曾想阻止他，因为他不跟我们一起跟从。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为他不跟随我们。”原文较直译为“因为他不跟我们一起跟从”，可能强调那人没有与门徒同行，而不必表示他拒绝跟从耶稣。
    reason: 说明另一种可行译法，并保留μεθ’ ἡμῶν（“与我们一起”）所强调的群体同行含义，以及原文未明说跟从对象的开放性。
lexical_decisions:
- source_word: Ἀποκριθεὶς δὲ
  choice: 接着说
  rationale: 这是常见的叙事衔接语；此处并非回答一个直接问题。“接着说”在现代汉语中自然地表达承接前文发言的作用。
- source_word: Ἐπιστάτα
  choice: 老师
  rationale: 路加以此称呼表达门徒对耶稣权威和带领地位的承认。“老师”通俗、庄重，也符合门徒对耶稣的直接称呼。
- source_word: εἴδομέν τινα
  choice: 我们看见有人
  rationale: τινα是不定指；“有人”准确而自然，不增添原文未强调的身份信息。
- source_word: ἐν τῷ ὀνόματί σου
  choice: 奉你的名
  rationale: “奉……的名”是自然的现代宗教汉语，表达凭借耶稣的名及其权柄行事，并保留该短语的神学分量。
- source_word: ἐκβάλλοντα δαιμόνια
  choice: 赶鬼
  rationale: 在驱逐邪灵的语境中，“赶鬼”简洁、通行，准确传达ἐκβάλλω的驱逐含义。
- source_word: ἐκωλύομεν
  choice: 就想拦阻他
  rationale: 未完成时可表示过去持续或尝试中的行动；“想拦阻”保留尝试意味，避免断言他们已经成功制止那人。
- source_word: ὅτι οὐκ ἀκολουθεῖ μεθ’ ἡμῶν
  choice: 因为他不和我们一道跟从
  rationale: 保留μεθ’ ἡμῶν“和我们一起”的明确含义，同时不擅自在正文中补出跟从的对象，以维持原文关于群体归属与跟从对象之间的张力。
theological_decisions:
- issue: 约翰的抱怨究竟针对那人没有跟随门徒群体，还是没有跟随耶稣
  choice: 他不和我们一道跟从
  alternative: 他不跟随我们
  rationale: 原文明确使用μεθ’ ἡμῶν（“和我们一起”），并非简单以“我们”为ἀκολουθεῖ的直接宾语。正文因此强调那人没有加入门徒同行的群体，却不武断地断定他拒绝跟随耶稣。
translation_notes:
  register: 采用现代、简洁而庄重的叙事语言。“奉你的名”“赶鬼”保留普通读者熟悉的圣经表达；“不和我们一道跟从”略带凝练感，以保留希腊文有意留下的对象含混。
