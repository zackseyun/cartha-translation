  text: καὶ ὅσοι ⸀ἂν μὴ ⸀δέχωνται ὑμᾶς, ἐξερχόμενοι ἀπὸ τῆς πόλεως ⸀ἐκείνης τὸν κονιορτὸν ἀπὸ τῶν ποδῶν ὑμῶν ⸀ἀποτινάσσετε εἰς μαρτύριον ἐπ’ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/005.yaml
  text: And as for all who do not receive you[a], as you leave that town[b], shake off the dust from your feet as a testimony against them.
translation:
  language: zh_hans
  text: 凡不接待你们的人[a]，你们离开那城[b]时，要把脚上的尘土抖掉，作为对他们不利的见证。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不欢迎你们”。这里的动词兼有接纳和欢迎使者的意思。
    reason: lexical_alternative
  - marker: b
    text: 或译：“那座市镇”。希腊语πόλις依语境可指城或市镇。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσοι ἂν μὴ δέχωνται ὑμᾶς
  choice: 凡不接待你们的人
  rationale: ὅσοι与ἄν构成泛指，涵盖所有不肯接纳使者的人；“接待”兼有接受和欢迎之意，符合本段差遣与住宿的语境。
- source_word: ἐξερχόμενοι ἀπὸ τῆς πόλεως ἐκείνης
  choice: 你们离开那城时
  rationale: 分词ἐξερχόμενοι表示与主命令同时发生的动作；“离开……时”自然保留时间关系。πόλις可指城或市镇，“城”在中文中宽泛自然，不必暗示大型都市。
- source_word: τὸν κονιορτὸν ἀπὸ τῶν ποδῶν ὑμῶν
  choice: 脚上的尘土
  rationale: κονιορτός指地面扬起的尘土；中文以“脚上的尘土”自然表达其所在之处。
- source_word: ἀποτινάσσετε
  choice: 抖掉
  rationale: 该命令指以抖动方式除去尘土；“抖掉”简洁地保留动作及其象征力度。
- source_word: εἰς μαρτύριον ἐπ’ αὐτούς
  choice: 作为反对他们的见证
  rationale: εἰς μαρτύριον表达用途或结果；本语境中ἐπί加宾格带有不利于对方、指证对方的意味。“反对他们的见证”保留司法和警告色彩，又不把经文扩展为明确的最终定罪。
theological_decisions:
- issue: 抖掉尘土这一象征行动的效力
  choice: 译为“作为反对他们的见证”，保留对拒绝使者之人的警告和指证作用。
  alternative: 译为中性的“给他们作见证”，或扩展为明确宣告上帝最终审判。
  rationale: εἰς μαρτύριον ἐπ’ αὐτούς不只是中性记号，却也没有在本节明说最终定罪；因此保留其严肃而未完全展开的审判张力。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“凡……的人”表达泛指；“那城”延续圣经叙事中自然凝练的称呼；“反对他们的见证”刻意保留原文的不利指证意味。所有脚注标记均置于正文相应位置。
