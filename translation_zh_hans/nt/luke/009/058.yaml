source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ ὁ Ἰησοῦς· Αἱ ἀλώπεκες φωλεοὺς ἔχουσιν καὶ τὰ πετεινὰ τοῦ οὐρανοῦ κατασκηνώσεις, ὁ δὲ υἱὸς τοῦ ἀνθρώπου οὐκ ἔχει ποῦ τὴν κεφαλὴν κλίνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/058.yaml
  text: And Jesus said to him[a], “Foxes have dens, and the birds of the sky have nests[c][b], but the Son of Man has nowhere to lay his head.”
translation:
  language: zh_hans
  text: 耶稣对他说：“狐狸有洞，天空的飞鸟有窝，但人子却没有可让他安放头的地方。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人子”是耶稣的自称，也可能呼应《但以理书》7:13—14。
    reason: cross_reference
lexical_decisions:
- source_word: ἀλώπεκες
  choice: 狐狸
  rationale: 该词是普通的动物名称，直译为“狐狸”自然准确，无须泛化。
- source_word: φωλεοὺς
  choice: 洞
  rationale: 指野兽栖身的洞穴；与“狐狸”搭配时，“洞”是现代汉语中自然、简明的表达。
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: 天空的飞鸟
  rationale: 保留“天空／天”的属格意象，同时用“飞鸟”构成自然庄重的现代汉语。
- source_word: κατασκηνώσεις
  choice: 窝
  rationale: 本义为栖居、停留之处；在飞鸟语境中译作“窝”最自然，又不必限定其具体形态。
- source_word: υἱὸς τοῦ ἀνθρώπου
  choice: 人子
  rationale: 保留耶稣这一自称的传统、稳定译法，以及其可能具有的但以理书背景，不作解释性改写。
- source_word: οὐκ ἔχει ποῦ
  choice: 没有……的地方
  rationale: 希腊文直译近于“没有可以在哪里……”，汉语以“没有……的地方”准确表达其否定含义。
- source_word: τὴν κεφαλὴν κλίνῃ
  choice: 枕头
  rationale: 此处“枕”作动词，意为把头靠下安歇；“没有枕头的地方”保留头部无处安放的具体意象，也符合庄重现代汉语。
- source_word: δὲ
  choice: 但……却
  rationale: 清楚表达动物有栖身处与人子无处安歇之间的强烈对比。
- source_word: εἶπεν αὐτῷ ὁ Ἰησοῦς
  choice: 耶稣对他说
  rationale: 直接、自然地再现叙事引语公式。
theological_decisions:
- issue: 耶稣自称 υἱὸς τοῦ ἀνθρώπου 的译法
  choice: 人子
  alternative: 那位人／人之子
  rationale: “人子”既贴近原文结构，又是汉语圣经传统中可识别的称谓，并能保留其普通人性表达与但以理书7:13—14潜在呼应之间的张力，不在正文中替读者作单一解释。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准普通话。“天空的飞鸟”保留原文意象；“窝”与“洞”形成简洁平行。“枕头”中的“枕”为动词，并非名词“枕头”。
