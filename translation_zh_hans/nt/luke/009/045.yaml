  text: οἱ δὲ ἠγνόουν τὸ ῥῆμα τοῦτο, καὶ ἦν παρακεκαλυμμένον ἀπ’ αὐτῶν ἵνα μὴ αἴσθωνται αὐτό, καὶ ἐφοβοῦντο ἐρωτῆσαι αὐτὸν περὶ τοῦ ῥήματος τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/045.yaml
  text: But they did not understand this saying[a], and it was concealed from them so that they might not perceive it[b], and they were afraid to ask him about this saying.
translation:
  language: zh_hans
  text: 可是，他们不明白这话[a]；这话对他们仍是隐藏的，以致他们不能领会[b]。他们又不敢就这话问耶稣。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “话”也可译作“言语”、“陈述”或“事情”；希腊语词为ῥῆμα。
    reason: lexical_alternative
  - marker: b
    text: 希腊原文只说“这话对他们是隐藏的”，没有说明是谁把它隐藏起来。
    reason: alternative_reading
lexical_decisions:
- source_word: ἠγνόουν
  choice: 不明白
  rationale: 这里指门徒未能理解耶稣刚才所说的话；“不明白”符合现代汉语表达，也准确体现语境中的理解失败。
- source_word: ῥῆμα
  choice: 话
  rationale: 此词在本节两次指耶稣刚说出的具体言语。“这话”简洁自然，并保留口头言说的意味；脚注列出语境允许的其他译法。
- source_word: παρακεκαλυμμένον
  choice: 隐藏着
  rationale: ἦν加完成时被动分词表示持续的隐藏状态。“隐藏着”保留被动含义，不擅自指明施事者。
- source_word: ἀπ’ αὐτῶν
  choice: 向他们
  rationale: 此处表示这话相对于门徒处于被隐藏的状态；“向他们隐藏着”是自然汉语，同时没有增添隐藏者。
- source_word: ἵνα μὴ αἴσθωνται αὐτό
  choice: 使他们不能领会
  rationale: αἰσθάνομαι在这里指察觉、领会。“领会”与前面的“不明白”略有区别，也比直译为“感知”更符合现代汉语语境。ἵνα结构译为“使……不能”，保留原文的结果或目的意味。
- source_word: ἐφοβοῦντο
  choice: 不敢
  rationale: 原意为“害怕”，与不定式“问”连用时，现代汉语自然表达为“不敢问”，完整传达因惧怕而没有发问。
- source_word: ἐρωτῆσαι αὐτὸν περὶ τοῦ ῥήματος τούτου
  choice: 问耶稣这话是什么意思
  rationale: 原文直义为“就这话问他”。汉语补出“是什么意思”，自然明确地表达询问内容，而未增加实质信息；用“耶稣”代替代词可避免汉语指代含混。
theological_decisions:
- issue: 隐藏行为的施事者
  choice: 保留无施事者的被动表达“这话向他们隐藏着”
  alternative: 译成“上帝使他们不能明白”或把隐藏仅解释为自然的晦涩
  rationale: 希腊文使用被动结构，却没有说明是谁使这话隐藏。译文不指明上帝或其他施事者，以保留原文的神学张力和真实含混。
- issue: ἵνα所表达的目的或结果
  choice: 译为“使他们不能领会”
  alternative: “以致他们不能领会”或“为要使他们不能领会”
  rationale: ἵνα可带目的或结果意味；正文采用兼具两者可能性的自然表达，避免明确断定隐藏行为的意图及其施事者。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“可是”承接前文并表达转折；分成三个分句以保持清晰。正文两处脚注标记均已对应列出。
