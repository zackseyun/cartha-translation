  source_fidelity: 译文总体准确传达门徒不理解、该话处于对他们隐藏的状态，以及他们惧怕发问。惟“向他们隐藏着”未充分对应ἀπ’ αὐτῶν（“从他们/对他们是隐藏的”）的遮蔽方向；“使他们不能领会”较强地把未指明的被动状态表成明确施事所造成的结果。修订以“对他们仍是隐藏的，以致他们不能领会”保留原文未说明施事者的被动及ἵνα的目的/结果张力。
  naturalness: “这话对他们仍是隐藏的”在现代书面普通话中自然、庄重，也比“向他们隐藏着”更清楚。“不敢就这话问耶稣”简洁自然，且比补出“是什么意思”更贴近原文“就这话问他”。
  terminology: “这话”恰当对应两处ῥῆμα；“不明白”对应ἠγνόουν；“领会”可表达αἰσθάνομαι在此处的领悟/察觉，且与前面的“不明白”保留适度区别。脚注保留ῥῆμα的词汇替代项，并明确隐藏者未被原文说明。
