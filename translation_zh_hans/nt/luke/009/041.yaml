id: LUK.9.41
reference: Luke 9:41
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· Ὦ γενεὰ ἄπιστος καὶ διεστραμμένη, ἕως πότε ἔσομαι πρὸς ὑμᾶς καὶ ἀνέξομαι ὑμῶν; προσάγαγε ⸂ὧδε τὸν υἱόν σου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/041.yaml
  text: But Jesus answered, “O unbelieving and twisted generation, how long will I be with you and bear with you? Bring your son here.”
translation:
  language: zh_hans
  text: 耶稣回答说：“唉，这不信而又扭曲的世代！我还要与你们同在、容忍你们多久呢？把你的儿子带到这里来。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὦ
  choice: 唉
  rationale: 表达呼语所带的悲叹和责备语气，比单纯的“啊”更符合本句语境。
- source_word: γενεὰ
  choice: 世代
  rationale: 保留该词对当代一群人的概括性指称，也与圣经常见表达相协调。
- source_word: ἄπιστος
  choice: 不信
  rationale: 直接保留其信仰与信靠层面的含义，不弱化为一般性的“不可靠”。
- source_word: διεστραμμένη
  choice: 扭曲
  rationale: 体现“被扭弯、偏离正道”的形象，同时避免用可能只被理解为性道德判断的“淫邪”。
- source_word: ἀνέξομαι
  choice: 容忍
  rationale: 传达忍受、担当对方所造成困扰的意思，现代汉语自然明确。
- source_word: προσάγαγε
  choice: 带到这里来
  rationale: 准确表达将人领到说话者面前的命令；“这里”对应ὧδε。
theological_decisions:
- issue: “这世代”的责备对象范围
  choice: 保留复数“你们”及概括性的“世代”，不具体限定为门徒、群众或全体以色列人
  alternative: 明确译作“你们这些不信而扭曲的人”或在正文中指定某一群体
  rationale: 原文责备对象具有语境张力；译文不替作者消除这种范围上的开放性。
- issue: ἄπιστος的含义
  choice: 译为“不信”
  alternative: 译为“没有信心”或“不忠信”
  rationale: “不信”能够保留信仰、信靠及缺乏信心之间的语义张力，不作过度神学限定。
translation_notes:
  register: 采用现代、庄重而口语可懂的普通话。“唉”承载悲叹式呼语；两个反问分句合为自然的汉语问句，同时保留责备的力度。
