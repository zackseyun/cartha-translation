source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ἀληθῶς, εἰσίν τινες τῶν ⸀αὐτοῦ ⸀ἑστηκότων οἳ οὐ μὴ γεύσωνται θανάτου ἕως ἂν ἴδωσιν τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/027.yaml
  text: But I tell you truly[b][a], there are some standing here who will certainly not taste death until they see the kingdom of God.
translation:
  language: zh_hans
  text: 但我实在告诉你们：站在这里的人中，有些人在看见上帝的国以前，绝不会尝到死亡的滋味。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “尝到死亡的滋味”是一个惯用说法，意思是“经历死亡”或“死去”。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν ἀληθῶς
  choice: 但我实在告诉你们
  rationale: 以“但”承接上文并体现δέ的转折或推进作用；“实在”自然地表达ἀληθῶς的强调语气，同时保留原文“我告诉你们”的语序。
- source_word: εἰσίν τινες τῶν αὐτοῦ ἑστηκότων
  choice: 站在这里的人中，有些人
  rationale: 保留希腊文部分属格结构所表达的“在这些人中有一些”；将地点副词αὐτοῦ按说话现场译为“这里”，语言自然且指向清楚。
- source_word: οἳ οὐ μὴ γεύσωνται θανάτου
  choice: 绝不会尝到死亡的滋味
  rationale: “绝不会”体现οὐ μή的强烈否定；保留“尝”这一比喻，而用“死亡的滋味”使现代汉语表达完整。
- source_word: ἕως ἂν ἴδωσιν
  choice: 在……以前
  rationale: 自然表达面向将来的时间界限，与“绝不会”搭配顺畅，不额外规定看见之后多久死亡。
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: 上帝的国
  rationale: “上帝的国”是清楚、通行且语义范围较完整的译法；不缩减为单指上帝的统治行动。
theological_decisions:
- issue: “看见上帝的国”具体指什么
  choice: 不作解释性扩写，保留“看见上帝的国”
  alternative: 明确译作看见登山变像、复活升天、耶路撒冷被毁，或教会的扩展
  rationale: 原文没有在本句内明确所指，历来存在多种解释；直译可保留经文本身的开放性及其末世论张力。
- issue: “直到／以前”是否暗示看见之后随即死亡
  choice: 仅表达死亡不会先于看见发生
  alternative: 译成暗示他们看见之后必定立即死亡的措辞
  rationale: ἕως ἄν在这里设定时间界限，本身不要求推断界限之后立刻发生相反情形。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“站在这里的人中，有些人”略带书面色彩，以清楚保留原文的部分关系；“尝到死亡的滋味”保留原文比喻，并用脚注说明其含义。
