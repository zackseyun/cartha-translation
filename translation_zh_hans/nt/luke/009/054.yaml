source:
  edition: SBLGNT
  text: ἰδόντες δὲ οἱ ⸀μαθηταὶ Ἰάκωβος καὶ Ἰωάννης εἶπαν· Κύριε, θέλεις εἴπωμεν πῦρ καταβῆναι ἀπὸ τοῦ οὐρανοῦ καὶ ἀναλῶσαι ⸀αὐτούς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/054.yaml
  text: When the disciples James and John saw this[a], they said, “Lord, do you want us to command fire to come down from heaven and consume them?”
translation:
  language: zh_hans
  text: 门徒雅各和约翰看见这事，就说：“主啊，你要我们叫火[a]从天上降下来，把他们烧灭吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“叫火从天上降下来，毁灭他们。”希腊文直译为“说：‘火从天上降下来，吞灭他们。’”。
    reason: 说明εἴπωμεν字面为“说”而在此结构中具有使令意味，并保留ἀναλῶσαι可译为“吞灭”或“毁灭”的词义幅度。
lexical_decisions:
- source_word: ἰδόντες
  choice: 看见这事
  rationale: 不定过去时分词在这里表示先于主句的情境，可自然译为“看见这事”；“这事”由上文撒玛利亚人不接待耶稣一事补出，并未增加新的叙事内容。
- source_word: δὲ
  choice: 就
  rationale: δέ在此承接叙事；结合分词结构译作“就”，自然表达看见之后随即说话的关系，不作生硬的“但是”。
- source_word: οἱ μαθηταὶ Ἰάκωβος καὶ Ἰωάννης
  choice: 门徒雅各和约翰
  rationale: 保留同位结构的功能，明确雅各和约翰是这里所指的两名门徒。
- source_word: Κύριε
  choice: 主啊
  rationale: κύριος在对耶稣的直接称呼中译作“主”，句末加“啊”符合现代汉语呼语习惯。
- source_word: θέλεις
  choice: 你要
  rationale: θέλω在此表达意愿；“你要我们……吗”简洁自然，也保留门徒请求耶稣授权的语气。
- source_word: εἴπωμεν
  choice: 我们吩咐
  rationale: 字面为“我们说”，但后接“火降下来”的宾语加不定式结构，在此具有使令意味；“吩咐”既符合现代汉语，又不过度强化为凭自身权柄施行。
- source_word: πῦρ καταβῆναι ἀπὸ τοῦ οὐρανοῦ
  choice: 火从天上降下来
  rationale: 按原文意象和语序自然表达，保留先知性审判叙事的呼应。
- source_word: ἀναλῶσαι
  choice: 烧灭
  rationale: ἀναλίσκω可指吞灭、毁灭；“烧灭”同时保留火焰意象和彻底毁灭的结果。
- source_word: αὐτούς
  choice: 他们
  rationale: 复数代词按上下文指拒绝接待耶稣的撒玛利亚人。
theological_decisions:
- issue: “看见”的未明说宾语
  choice: 译作“看见这事”，指向上一节所述的拒绝接待。
  alternative: 译作“见状”或仅作“看见了”。
  rationale: 原文未明说宾语，汉语虽可省略，但补出“这事”能清楚衔接上下文，同时不把具体动机或评价加入经文。
- issue: 门徒提议的语力
  choice: 将εἴπωμεν译作“吩咐”，表达叫火降下的使令意味。
  alternative: 译作“叫火降下”“召火降下”或较字面的“说让火降下”。
  rationale: 原词是λέγω而非专门表示命令的动词，因此不应扩大为独立施行审判的明确权柄；但在该补语结构中，纯字面的“说火降下”在汉语中不通顺。“吩咐”较自然地保留其使令作用。
- issue: ἀναλῶσαι的审判意象
  choice: 译作“烧灭”，兼顾火的意象和毁灭的结果。
  alternative: 译作“吞灭”或“毁灭”。
  rationale: 原词既可表示消耗殆尽，也可泛指毁灭；上下文的火使“烧灭”成为自然选择，但脚注保留“毁灭”等可能表达。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“主啊”保持直接呼告的郑重感；“从天上降下来”“烧灭”清楚有力，又避免古奥措辞。脚注标记[a]已在正文相应句末出现。
