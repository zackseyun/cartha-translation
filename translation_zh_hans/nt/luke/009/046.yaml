  text: Εἰσῆλθεν δὲ διαλογισμὸς ἐν αὐτοῖς, τὸ τίς ἂν εἴη μείζων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/046.yaml
  text: Then a dispute arose among them as to which of them might be the greatest[a].
translation:
  language: zh_hans
  text: 这时，他们中间起了争论：他们当中谁算是最大的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “争论”也可译作“思量”或“议论”；原文也可能指他们心中所起的念头。
    reason: 保留διαλογισμός及ἐν αὐτοῖς在内心思量与群体讨论之间的词义歧义。
lexical_decisions:
- source_word: Εἰσῆλθεν δὲ
  choice: 这时……起了
  rationale: δὲ承接叙事，译作“这时”；Εἰσῆλθεν字面为“进入”，与διαλογισμός连用时，现代汉语自然表达为“起了”，保留事情发生的动态意味。
- source_word: διαλογισμὸς
  choice: 争论
  rationale: 该词既可指心里的思量，也可指群体中的议论或争辩。上下文涉及门徒彼此比较地位，“争论”较能传达竞争意味，同时以脚注保留其他可能。
- source_word: ἐν αὐτοῖς
  choice: 他们中间
  rationale: 字面可作“在他们里面”；在复数群体语境中，“他们中间”自然地表达此事发生在这群人之内，但不强行限定为公开争吵。
- source_word: τὸ τίς ἂν εἴη
  choice: 他们当中谁算是
  rationale: 冠词引出间接疑问的内容；ἄν与愿望式εἴη带有不确定或设想色彩。“谁算是”在现代汉语中自然保留这种评定、悬而未决的语气。
- source_word: μείζων αὐτῶν
  choice: 他们当中……最大的
  rationale: μείζων形式上是比较级“更大”，但在限定群体内询问最高地位时，汉语惯用最高级“最大的”；此处指身份或地位，而非体量。
theological_decisions:
- issue: 门徒之间所发生之事的性质
  choice: 争论
  alternative: 思量；议论
  rationale: 原词可涵盖内心推想和彼此讨论。因问题是比较谁更大，“争论”恰当地体现竞争张力；脚注保留较中性的理解，避免把公开冲突定为唯一解释。
- issue: “最大”的含义
  choice: 保留“最大的”，不增译为“最有地位”或“最重要”
  alternative: 最有地位的；最重要的
  rationale: 希腊文只用μείζων，语境暗示地位高低，但未明确界定其具体层面。直译为“最大的”可保留其开放性及后文对“伟大”的重新界定。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“这时”自然承接上下文；“谁算是最大的”既符合口语理解，也保留间接疑问中的不确定语气。脚注标记已在正文中以[a]呈现。
