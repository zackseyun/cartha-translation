review_pass:
  verdict: revise
  source_fidelity: 草稿准确传达了人子受苦、遭犹太领袖弃绝、被杀及第三天复活的顺序。“必须”恰当表达δεῖ的必然性；但“被使他复活”在汉语中结构不成立，且多出的“他”造成不必要的宾语重复。汉语通常以“复活”自然表达此处事件；用脚注注明原文被动式，能保留其未明言施事者的细微含义。
  naturalness: 除末句外，措辞庄重、清楚，符合现代标准汉语。“第三天被使他复活”不自然且语法别扭，须改为“在第三天复活”。
  terminology: “人子”“长老”“祭司长”均合适。“经学家”可作为现代读者易懂的γρaμματεῖς译法，且没有扩充原文含义。
  issues:
  - severity: high
    issue: “第三天被使他复活”语法不当。
    rationale: “使”通常要求明确施事者或采用“使他复活”的主动兼语结构；“被使他复活”却将被动标记、使役动词和宾语代词不当地叠加。原文ἐγερθῆναι虽为被动不定式，但不能以牺牲汉语语法来机械对应。
