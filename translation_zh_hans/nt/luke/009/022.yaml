id: LUK.9.22
reference: Luke 9:22
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἰπὼν ὅτι Δεῖ τὸν υἱὸν τοῦ ἀνθρώπου πολλὰ παθεῖν καὶ ἀποδοκιμασθῆναι ἀπὸ τῶν πρεσβυτέρων καὶ ἀρχιερέων καὶ γραμματέων καὶ ἀποκτανθῆναι καὶ τῇ τρίτῃ ἡμέρᾳ ⸀ἐγερθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/022.yaml
  text: saying[a], “It is necessary for the Son of Man to suffer many things and to be rejected by the elders, chief priests, and scribes, and to be killed[b], and on the third day to be raised.”
translation:
  language: zh_hans
  text: 说[a]：“人子必须受许多苦，被长老、祭司长和经学家弃绝，被杀，并在第三天复活[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“人子必须受许多苦……”
    reason: lexical_alternative
  - marker: b
    text: 原文为被动式，可译作“被使复活”；原文没有明说施事者。
    reason: alternative_reading
lexical_decisions:
- source_word: εἰπὼν
  choice: 说
  rationale: 用简洁的叙事引语形式承接上文；希腊语虽为不定过去时分词，现代汉语无需生硬地译作“说着”。
- source_word: Δεῖ
  choice: 必须
  rationale: 表达超越一般情势的必然性，并自然涵盖后续受苦、被弃绝、被杀和复活整个并列结构。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人子
  rationale: 保留耶稣的固定自称及其经文互文意义，不改写为泛称。
- source_word: πολλὰ παθεῖν
  choice: 受许多苦
  rationale: 既保留 πολλὰ 所表达的广泛、深重苦难，也符合现代汉语习惯。
- source_word: ἀποδοκιμασθῆναι
  choice: 被……弃绝
  rationale: 体现经审视后遭正式否定和拒绝的被动含义。
- source_word: πρεσβυτέρων
  choice: 长老
  rationale: 保留当时犹太领袖群体的制度性称谓。
- source_word: ἀρχιερέων
  choice: 祭司长
  rationale: 复数在第二圣殿时期通常指祭司领袖阶层，而非多位同时在任的大祭司。
- source_word: γραμματέων
  choice: 经学家
  rationale: 较“文士”更便于现代普通读者理解其研习并解释经文的身份，同时不扩写为更宽泛的“律法教师”。
- source_word: ἀποκτανθῆναι
  choice: 被杀
  rationale: 直接保留被动语态，语气自然且不额外加入司法处决的含义。
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: 第三天
  rationale: 自然表达时间性与格所表示的“在第三天”。
- source_word: ἐγερθῆναι
  choice: 被使他复活
  rationale: 旨在保留被动形式和未明说的施事者，但这一表述在现代汉语中略显拗口。
theological_decisions:
- issue: Δεῖ 所表达的必然性
  choice: 人子必须……
  alternative: 有必要让人子……
  rationale: “必须”自然表达神救赎计划中的必然性；虽未机械复制希腊语无人称句式，却没有说明该必然性的机制或来源。
- issue: 复活动词的被动语态
  choice: 被使他复活
  alternative: 复活
  rationale: 尝试保存 ἐγερθῆναι 的被动形式和隐含的神圣行动，同时不明说施事者；但汉语表达不够自然，宜在审校时权衡是否采用“复活”并以脚注说明。
translation_notes:
  register: 整体采用现代、庄重而易懂的标准普通话。“经学家”用于降低“文士”对当代读者的陌生感。末句为保存希腊语被动形式而作较形式化处理，但“被使他复活”不够自然，需审校。
