id: LUK.9.26
reference: Luke 9:26
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὃς γὰρ ἂν ἐπαισχυνθῇ με καὶ τοὺς ἐμοὺς λόγους, τοῦτον ὁ υἱὸς τοῦ ἀνθρώπου ἐπαισχυνθήσεται, ὅταν ἔλθῃ ἐν τῇ δόξῃ αὐτοῦ καὶ τοῦ πατρὸς καὶ τῶν ἁγίων ἀγγέλων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/026.yaml
  text: For whoever is ashamed of me and of my words[b][a], the Son of Man will be ashamed of him when he comes in his glory and the glory of the Father and of the holy angels.
translation:
  language: zh_hans
  text: 因为，凡以我和我的话为耻的，人子在他自己的荣耀、父的荣耀和圣天使的荣耀中来临时，也要以这个人为耻。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这个人”直译为“这一个人”。
    reason: 说明τοῦτον的指示性和单数回指。
  - marker: b
    text: 希腊文在此只出现一次“荣耀”，后面并列“他的、父的和圣天使的”。中文重复“荣耀”是为清楚表达这一结构；也可较贴近字面译作“在他自己、父和圣天使的荣耀中”。
    reason: 说明并列属格与中文展开方式，保留原文结构的歧义。
lexical_decisions:
- source_word: ὃς γὰρ ἂν
  choice: 因为，凡……的
  rationale: γάρ承接上文说明理由，译作“因为”；ὃς…ἄν具有泛指意义，以“凡……的”自然表达“无论谁”。
- source_word: ἐπαισχυνθῇ με καὶ τοὺς ἐμοὺς λόγους
  choice: 以我和我的话为耻
  rationale: “以……为耻”准确保留ἐπαισχύνομαι指向对象的羞耻含义；“我的话”直接对应τοὺς ἐμοὺς λόγους，避免解释性改写为“我的教导”。
- source_word: τοῦτον
  choice: 这人
  rationale: 指回前面的泛指对象；“这人”既保留单数指代，也比现代汉语中的性别代词更贴合希腊文指示代词的强调作用。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人子
  rationale: 沿用这一称号的标准译法，保留其经文互文背景和称号性质。
- source_word: ἐπαισχυνθήσεται
  choice: 也要以……为耻
  rationale: 与前半句采用同一表达，保留原文刻意形成的对应与反转；“也”自然显明这种相应关系。
- source_word: ὅταν ἔλθῃ
  choice: 来临时
  rationale: ὅταν加虚拟式在此表示未来时间，“来临时”庄重自然，并保留尚未来到的含义。
- source_word: ἐν τῇ δόξῃ αὐτοῦ καὶ τοῦ πατρὸς καὶ τῶν ἁγίων ἀγγέλων
  choice: 在他自己、父和圣天使的荣耀中
  rationale: 将一次出现的“荣耀”理解为由三个属格成分共同限定，贴近希腊文紧凑结构；“他自己”明确αὐτοῦ指人子，且不消除该结构也可按并列荣耀理解的可能。
- source_word: τῶν ἁγίων ἀγγέλων
  choice: 圣天使
  rationale: 简洁直接地表达ἅγιος对ἄγγελος的修饰，符合现代中文圣经语体。
theological_decisions:
- issue: 人子对以他为耻之人的回应
  choice: 也要以这人为耻
  alternative: 也要不认这人／弃绝这人
  rationale: 沿用同一希腊动词的基本含义，保留前后对称；不以“弃绝”或“不认”等更强的神学解释取代原词。
- issue: 人子、父与圣天使的荣耀关系
  choice: 在他自己、父和圣天使的荣耀中
  alternative: 在他自己的荣耀里，并在父和圣天使的荣耀里
  rationale: 原文只有一个介词和一个“荣耀”，后接人子、父及圣天使的属格并列。正文保留其共享而紧凑的构造，同时以脚注说明另一种展开方式，不武断界定三者荣耀在本体或来源上的关系。
- issue: 泛指警告中的单数阳性形式
  choice: 凡……的／这人
  alternative: 无论谁……他
  rationale: 中文不必用带性别的代词即可忠实保留单数泛指和回指关系，也不会误示该警告只针对男性。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。“以……为耻”保留原文前后动词的对应；“来临”略带末世语境所需的庄严感。脚注标记均置于整句末尾，分别对应“这人”和荣耀结构。
