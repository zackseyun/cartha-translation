  text: Ἡ δὲ ἡμέρα ἤρξατο κλίνειν· προσελθόντες δὲ οἱ δώδεκα εἶπαν αὐτῷ· Ἀπόλυσον τὸν ὄχλον, ἵνα ⸀πορευθέντες εἰς τὰς κύκλῳ κώμας ⸀καὶ ἀγροὺς καταλύσωσιν καὶ εὕρωσιν ἐπισιτισμόν, ὅτι ὧδε ἐν ἐρήμῳ τόπῳ ἐσμέν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/012.yaml
  text: The day began to decline[a], and the twelve came and said to him, “Send the crowd away, so that they may go into the surrounding villages and countryside, find lodging, and get provisions[b], because we are here in a desolate place.”
translation:
  language: zh_hans
  text: 天色渐晚，十二人便上前对他说：“请让众人散去，好让他们到周围的村庄和乡间投宿，寻找食物[a]，因为这里是荒凉之地[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“寻找给养”。希腊语ἐπισιτισμός指食物或食品供应。
    reason: lexical_alternative
  - marker: b
    text: 或译“人烟稀少的地方”。希腊语ἔρημος可指无人居住或人口稀少的地区。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡ δὲ ἡμέρα ἤρξατο κλίνειν
  choice: 天色渐晚
  rationale: κλίνω与“日子”连用，表示白昼正趋向结束。“天色渐晚”以自然的现代汉语传达这一时间变化，同时保留渐进意味。
- source_word: προσελθόντες δὲ οἱ δώδεκα
  choice: 十二人便上前
  rationale: προσέρχομαι意为走近、上前；“十二人”保留原文带有称号性质的οἱ δώδεκα，不额外补入“使徒”或“门徒”。
- source_word: Ἀπόλυσον τὸν ὄχλον
  choice: 请让众人散去
  rationale: ἀπολύω在此指遣散、让人离开；中文直接引语中加“请”自然表达门徒向耶稣提出的请求，并未改变命令式所承载的请求内容。
- source_word: εἰς τὰς κύκλῳ κώμας καὶ ἀγρούς
  choice: 到周围的村庄和乡间
  rationale: κώμαι指村庄；ἀγροί在这里可泛指田野、农庄或乡间地区。“乡间”既自然，也避免把范围限缩为耕地。
- source_word: καταλύσωσιν
  choice: 投宿
  rationale: καταλύω在本语境中指找到停留住宿之处；“投宿”简洁准确。
- source_word: εὕρωσιν ἐπισιτισμόν
  choice: 寻找食物
  rationale: ἐπισιτισμός指食物或维持生活所需的食品供应；正文采用普通读者最易理解的“食物”，并以脚注保留“给养”的较宽含义。
- source_word: ὅτι ὧδε ἐν ἐρήμῳ τόπῳ ἐσμέν
  choice: 因为我们这里是荒凉的地方
  rationale: ἔρημος可表示荒凉、无人或人烟稀少；“荒凉的地方”表达当地缺少住处和食物供应的语境，又不额外引入特定的“旷野”神学联想。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“天色渐晚”“上前”“投宿”符合叙事语体；避免生硬直译，也不把“十二人”扩译为原文此处未明说的身份称谓。脚注按中文正文首次出现的顺序重新编号。
