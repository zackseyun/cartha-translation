  text: ὁ δὲ Ἰησοῦς ⸀εἰδὼς τὸν διαλογισμὸν τῆς καρδίας αὐτῶν ἐπιλαβόμενος ⸀παιδίον ἔστησεν αὐτὸ παρ’ ἑαυτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/047.yaml
  text: But Jesus[a], knowing the reasoning of their hearts, took a child and set him beside himself[b],
translation:
  language: zh_hans
  text: 耶稣知道他们心中的思量[a]，就拉过一个孩子来，让孩子站在自己身旁。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“他们的心的思量”，其中“他们”是复数，“心”却是单数；这里也可译作“他们心里的想法”。
    reason: 说明原文单数“心”与复数所有格的搭配，并提供较口语化的词义选择。
lexical_decisions:
- source_word: εἰδὼς
  choice: 知道
  rationale: 该分词在这里表示心智上的知晓或察觉；“知道”自然地陈述耶稣明白门徒内在的思量，却不额外说明他如何得知。
- source_word: διαλογισμὸν
  choice: 思量
  rationale: 此词可指内心的推想、考虑或议论；“思量”既保留思考与斟酌的意味，也比单纯的“想法”更贴近原词。
- source_word: τῆς καρδίας αὐτῶν
  choice: 他们心中的
  rationale: “心中”按现代汉语自然表达内在思想；希腊文以单数“心”配复数“他们”，可理解为集合性的内在状态，相关形式在脚注中说明。
- source_word: ἐπιλαβόμενος
  choice: 拉过……来
  rationale: 该中动分词有抓住、拉住或领住之意；“拉过……来”保留了具体接触的动作，也符合孩子随后被安置在耶稣身旁的场景。
- source_word: παιδίον
  choice: 一个孩子
  rationale: 原词泛指孩子，未明确强调年龄特别幼小；“一个孩子”清楚自然，也不擅自指定性别。
- source_word: ἔστησεν
  choice: 让……站
  rationale: ἵστημι在这里是使役用法，意为使其站立；“让孩子站”保留站立的动作，比泛化为“安置”更具体。
- source_word: παρ’ ἑαυτῷ
  choice: 在自己身旁
  rationale: 该短语表示在耶稣自己旁边；“在自己身旁”准确、自然，并清楚指向本句主语耶稣。
theological_decisions:
- issue: 耶稣对人内心思量的知晓
  choice: 直接译为耶稣“知道”他们心中的思量，不解释其知晓机制。
  alternative: 明确译成超自然的全知，或解释为凭人的敏锐观察而察觉。
  rationale: 原文肯定耶稣知晓其内在思量，却没有在本节说明这种知识的机制；译文保留这一神学张力，不作超出文本的断定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“思量”保留内在推想和斟酌的意味；“拉过一个孩子来，让孩子站在自己身旁”兼顾原文动作的具体性与现代汉语的自然表达。重复“孩子”以避免使用带有性别暗示的代词。
