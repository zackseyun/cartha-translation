id: LUK.9.33
reference: Luke 9:33
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ διαχωρίζεσθαι αὐτοὺς ἀπ’ αὐτοῦ εἶπεν ⸀ὁ Πέτρος πρὸς τὸν Ἰησοῦν· Ἐπιστάτα, καλόν ἐστιν ἡμᾶς ὧδε εἶναι, καὶ ποιήσωμεν σκηνὰς τρεῖς, μίαν σοὶ καὶ μίαν Μωϋσεῖ καὶ μίαν Ἠλίᾳ, μὴ εἰδὼς ὃ λέγει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/033.yaml
  text: 'And as they were departing from him[a], Peter said to Jesus, “Master, it is good for us to be here. Let us make three shelters: one for you, one for Moses, and one for Elijah” — not knowing what he was saying.'
translation:
  language: zh_hans
  text: 就在他们离开耶稣时，彼得对耶稣说：“夫子，我们在这里真好！我们来搭三座棚子[a]：一座给你，一座给摩西，一座给以利亚。”他并不知道自己在说什么。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “棚子”也可译为“帐篷”，传统上或译为“帐幕”。希腊词σκηνή指临时搭建的住处，也可能让人联想到圣经中的住棚节意象。
    reason: 说明词义范围，并保留可能存在但经文未明说的节期及帐幕联想。
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ διαχωρίζεσθαι αὐτοὺς ἀπ’ αὐτοῦ
  choice: 就在他们离开耶稣时
  rationale: ἐγένετο ἐν τῷ加不定式是叙事中表达同时发生的惯用结构；译为“就在……时”自然地保留时间关系。διαχωρίζεσθαι与ἀπό表达摩西和以利亚同耶稣分离、离去。
- source_word: Ἐπιστάτα
  choice: 夫子
  rationale: 这是路加特有的、对耶稣表示尊敬并承认其权威的称呼。“夫子”既区别于通常表示教师的“老师”，也不额外加入“主”的神学含义。
- source_word: καλόν ἐστιν ἡμᾶς ὧδε εἶναι
  choice: 我们在这里真好
  rationale: 保留καλόν直接而正面的评价，用现代汉语自然表达彼得认为身处此地是好的。
- source_word: ποιήσωμεν
  choice: 我们来搭
  rationale: 第一人称复数不定过去时虚拟式在此表示提议；“我们来”自然传达劝请语气，“搭”也符合临时棚子的建造方式。
- source_word: σκηνὰς
  choice: 棚子
  rationale: σκηνή指帐篷或临时搭建的住处。“棚子”清楚易懂，又不把可能存在的住棚节或帐幕联想直接定为经文的明说含义。
- source_word: μὴ εἰδὼς ὃ λέγει
  choice: 他并不知道自己在说什么
  rationale: 分词说明彼得说话当时并不明白其话语的含义；此译法保留进行中的语感，也不把“不知道”强化为其他心理状态。
theological_decisions:
- issue: 登山变像语境中σκηνάς是否明确指向住棚节或帐幕传统
  choice: 正文译作“棚子”，脚注保留“帐篷”“帐幕”等可能表达及节期联想
  alternative: 正文译作“帐幕”或“住棚”
  rationale: 经文本身没有明确说明彼得所提议的建筑就是住棚节棚屋或圣所帐幕。正文采用中性而准确的现代用语，可避免过度解释；脚注则保存该词可能唤起的圣经意象。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“夫子”作为尊称保留ἐπιστάτα的权威意味；引语简洁自然。脚注标记紧接其所解释的“棚子”，避免指代混淆。
