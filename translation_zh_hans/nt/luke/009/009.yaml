base_translation:
  language: en
  yaml_path: translation/nt/luke/009/009.yaml
  text: But Herod said[a], “John I beheaded; but who is this about whom I hear such things?” And he kept seeking to see him.
translation:
  language: zh_hans
  text: 希律却说：“约翰是我斩首的；可是，这人是谁？我听见人谈论他这样的事。”他一直想见耶稣。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他一直在寻求见耶稣。”希腊语未完成时可表示持续或反复的行动。
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: 却
  rationale: 在承接上文的同时带出希律的回应和轻微转折，现代汉语用“却”自然贴切。
- source_word: Ἰωάννην ἐγὼ ἀπεκεφάλισα
  choice: 约翰是我斩首的
  rationale: 保留显式代词ἐγώ所带的强调，并准确表达ἀποκεφαλίζω“斩首”的具体含义；这一结构也自然凸显“我”。
- source_word: τίς δέ ἐστιν οὗτος
  choice: 可是……这人到底是谁
  rationale: “这人是谁”对应原文问句；“到底”自然传达希律困惑追问的语气，但不增添身份判断。
- source_word: περὶ οὗ ἀκούω τοιαῦτα
  choice: 我听见有人谈论这样的事
  rationale: 将περὶ οὗ按自然汉语重组为“有人谈论……”，保留τοιαῦτα笼统的“这样的事”，不将其限定为神迹或传闻。
- source_word: ἐζήτει ἰδεῖν αὐτόν
  choice: 他一直想见耶稣
  rationale: “一直”体现未完成时ἐζήτει可能具有的持续意味；“想见”自然表达寻求机会见到某人的意思。上下文所指为耶稣，明说其名可避免汉语中连续代词造成歧义。
theological_decisions:
- issue: 希律对约翰与耶稣身份的理解
  choice: 只翻出希律承认自己斩了约翰，并追问所听之事涉及的人是谁
  alternative: 明确写成希律怀疑或害怕约翰复活
  rationale: 本节没有明说希律认定耶稣是复活的约翰；不把上文可能引出的推测写进本节，以保留叙事的克制与张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“斩首”准确简洁；“这人到底是谁”保留希律的困惑。“一直想见”兼顾原文时态与汉语自然度，并用脚注提示另一种可能表达。
