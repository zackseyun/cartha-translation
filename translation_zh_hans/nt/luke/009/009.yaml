  to: 希律却说：“约翰是我斩首的；可是，这人是谁？我听见人谈论他这样的事。”他一直想见耶稣。[a]
  rationale: 修订明确补出“谈论他”，以对应περὶ οὗ，同时不添加“有人”作为原文未明说的主语；删除“于是”，避免将简单叙述连接误作因果。保留“约翰是我斩首的”以反映显式“我”的强调，保留“斩首”的具体动作，并以“一直想见”表达未完成时的持续性。耶稣之名按上下文明确化，未加入关于约翰复活或希律恐惧的解释。
