  text: καὶ ἰδοὺ ἄνδρες δύο συνελάλουν αὐτῷ, οἵτινες ἦσαν Μωϋσῆς καὶ Ἠλίας,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/030.yaml
  text: And behold, two men were talking with him, who were Moses and Elijah,
translation:
  language: zh_hans
  text: 看哪，有两个人正同他交谈；他们是摩西和以利亚。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留路加用来唤起注意、增强现场感的叙事标记；“看哪”庄重而仍为现代读者所理解。
- source_word: ἄνδρες δύο
  choice: 两个人
  rationale: 这里特指摩西和以利亚两位男性人物；现代汉语用“两个人”比“两名男子”更自然，也不损失上下文中的身份信息。
- source_word: συνελάλουν
  choice: 正同……交谈
  rationale: 未完成时表示当时正在持续进行的动作；“正……交谈”也体现该动词相互交谈的含义。
- source_word: αὐτῷ
  choice: 同他
  rationale: 与 συλλαλέω 连用时，间接受格指出交谈的对象；“同他交谈”准确表达双方对话，而非单向对他说话。
- source_word: οἵτινες ἦσαν
  choice: 他们是
  rationale: 自然、直接地说明前述两人的身份，不额外强化 οἵτινες 在此处并不突出的语气。
- source_word: Μωϋσῆς
  choice: 摩西
  rationale: 采用现代中文圣经及一般文化语境中通行的人名译法。
- source_word: Ἠλίας
  choice: 以利亚
  rationale: 采用现代中文圣经及一般文化语境中通行的人名译法。
theological_decisions:
- issue: 登山变像中两个人物的身份
  choice: 直接表明他们是摩西和以利亚
  alternative: 增添他们所象征的意义或对其显现方式作解释
  rationale: 原文只明确辨认两人的身份，并未在本节解释其象征意义或显现性质；译文不作教义性扩展。
translation_notes:
  register: 采用自然、庄重而清楚的现代标准汉语。“看哪”保留原文突显新场景的叙事力度；其余措辞避免古奥，并以“正……交谈”清楚传达持续动作。
