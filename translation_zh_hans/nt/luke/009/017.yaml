base_translation:
  language: en
  yaml_path: translation/nt/luke/009/017.yaml
  text: 'And they all ate and were satisfied[b][a], and what was left over of the broken pieces was picked up for them: twelve baskets.'
translation:
  language: zh_hans
  text: 众人都吃了，也都吃饱了。把他们吃剩的碎块[a]收拾起来，有十二篮子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “碎块”也可译作“碎屑”或“零碎”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφαγον
  choice: 吃了
  rationale: 不定过去时直述已经发生的进食事件；“吃了”符合现代汉语叙事习惯。
- source_word: ἐχορτάσθησαν
  choice: 吃饱了
  rationale: 表达吃到饱足，既准确又比直译“被充满”自然。
- source_word: πάντες
  choice: 众人都
  rationale: 保留原文对所有在场者的强调。
- source_word: ἤρθη
  choice: 被收拾起来
  rationale: 此处指把余下的食物碎块拾取、收集起来；保留原文被动语态。
- source_word: τὸ περισσεῦσαν
  choice: 所剩下的
  rationale: 将带冠词的分词按名词性结构处理，表达余剩之物。
- source_word: αὐτοῖς
  choice: 他们所剩下的
  rationale: 以自然汉语表达该与格同余剩之物的关系，同时用脚注保留“给他们剩下的”这一可能理解。
- source_word: κλασμάτων
  choice: 碎块
  rationale: 指掰开后留下的食物块；“碎块”简洁、具体，也适合上下文。
- source_word: κόφινοι δώδεκα
  choice: 共有十二篮子
  rationale: 表达收集所得余物的数量；不额外限定篮子的材质。
theological_decisions:
- issue: αὐτοῖς与τὸ περισσεῦσαν的关系
  choice: 他们所剩下的
  alternative: 给他们剩下的
  rationale: 该与格的具体关系并非完全明确；正文采用较自然且符合进食语境的表达，脚注保留另一种语法理解，避免过度定解。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“众人都吃了，也都吃饱了”保留重复连词所形成的推进感；后句保留被动表达，并用“共有”自然引出十二篮子的总量。
