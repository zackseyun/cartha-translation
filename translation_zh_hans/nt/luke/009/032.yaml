  text: ὁ δὲ Πέτρος καὶ οἱ σὺν αὐτῷ ἦσαν βεβαρημένοι ὕπνῳ· διαγρηγορήσαντες δὲ εἶδον τὴν δόξαν αὐτοῦ καὶ τοὺς δύο ἄνδρας τοὺς συνεστῶτας αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/032.yaml
  text: Peter and those with him were weighed down with sleep; but when they became fully awake[a], they saw his glory and the two men standing with him.
translation:
  language: zh_hans
  text: 彼得和同他在一起的人都被睡意压得昏沉；但他们完全清醒过来后[a]，就看见了他的荣耀，也看见那两个人同他站在一起。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“醒来以后”或“完全清醒时”。这个希腊语动词较为罕见，也可能意为“一直保持清醒”；在这里，它可能着重表示他们进入了完全警醒的状态。
    reason: 保留罕见动词διαγρηγορέω的词义歧义。
lexical_decisions:
- source_word: βεβαρημένοι ὕπνῳ
  choice: 被睡意压得昏沉
  rationale: 该短语直指人受睡眠重压的状态，强于一般的“困倦”。译文保留“压”的意象，同时采用现代汉语自然表达。
- source_word: διαγρηγορήσαντες
  choice: 完全清醒过来后
  rationale: 这个罕见动词在此与前文被睡意压得昏沉形成对照，较自然地表示进入完全清醒的状态；其也可能表示一直保持清醒，因此以脚注保留歧义。
- source_word: δόξαν
  choice: 荣耀
  rationale: “荣耀”是 δόξα 的常规圣经用语，既可指此处可见的荣光，也保留其较广的神学内涵。
- source_word: τοὺς δύο ἄνδρας
  choice: 那两个人
  rationale: ἀνήρ 在此指两名成年男子，即上下文中的摩西和以利亚；“那两个人”准确自然。
- source_word: τοὺς συνεστῶτας αὐτῷ
  choice: 同他站在一起
  rationale: 该完成时主动分词在此表示站在某人身旁或与某人一同在场；译作“同他站在一起”保留画面的具体性和分词所描述的状态。
- source_word: δὲ
  choice: （首处不明译）／但
  rationale: 首个 δέ 仅温和推进叙事，汉语无需另加“这时”或“如今”；第二个 δέ 表明昏沉与随后看见异象之间的转折，译作“但”。
theological_decisions:
- issue: 登山变像语境中 δόξα 的表达
  choice: 他的荣耀
  alternative: 他的荣光／他的威荣
  rationale: “荣耀”保留了该词在圣经中的延续性，也没有在正文中额外界定这荣耀的性质。
- issue: διαγρηγορήσαντες 所描述的状态
  choice: 完全清醒过来后
  alternative: 一直保持清醒／醒来以后
  rationale: 所选译法最自然地承接前面的困倦状态，但原词罕见，存在“保持清醒”的解释可能；脚注明确保留这些选择，避免在译文中把歧义绝对化。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“被睡意压得昏沉”保留原文的重压意象而不显生硬；“同他站在一起”具体呈现场景。正文中的脚注标记 [a] 与脚注对应。
