  text: Ἐγένετο δὲ μετὰ τοὺς λόγους τούτους ὡσεὶ ἡμέραι ὀκτὼ ⸀καὶ παραλαβὼν Πέτρον καὶ Ἰωάννην καὶ Ἰάκωβον ἀνέβη εἰς τὸ ὄρος προσεύξασθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/028.yaml
  text: About eight days after these sayings[b][a], he took Peter and John and James and went up on the mountain to pray.
translation:
  language: zh_hans
  text: 这些话说完后，约过了八天[a]，耶稣带着彼得、约翰和雅各上山去祷告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这些话以后，约过了八天。”原文“话”也可指“言论”或“所说的话”；“约”表明时间是近似数。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: （不单独译出）
  rationale: 这是常见的叙事承接语。在本句中用自然的时间从句衔接上下文，无须生硬译作“事情发生了”或添加原文没有的“那时”。
- source_word: μετὰ τοὺς λόγους τούτους
  choice: 这些话说完后
  rationale: λόγους指耶稣此前所说的内容。“这些话说完后”在现代汉语中自然，并明确表达与前文言论的时间关系；也可较直译为“这些话以后”。
- source_word: ὡσεὶ ἡμέραι ὀκτὼ
  choice: 约有八天
  rationale: ὡσεὶ表示约数，因此保留“约”，不把时间说成精确的八天，也不与平行经文协调。
- source_word: παραλαβὼν
  choice: 带着
  rationale: 该分词伴随主要动词，表示耶稣带三位门徒同行；“带着”简洁自然。
- source_word: Πέτρον καὶ Ἰωάννην καὶ Ἰάκωβον
  choice: 彼得、约翰和雅各
  rationale: 采用现代汉语通行的圣经人名译法，并按汉语列举习惯处理重复的καί。
- source_word: ἀνέβη εἰς τὸ ὄρος
  choice: 上山
  rationale: 保留ἀνέβη的上行意义；原文定冠词不必然指此前已确定的某一座山，汉语“上山”最自然，也避免过度具体化。
- source_word: προσεύξασθαι
  choice: 去祷告
  rationale: 不定式表达上山的目的；“去祷告”自然清楚地传达目的关系。
theological_decisions:
- issue: 与平行经文相关的时间表述
  choice: 约有八天
  alternative: 八天；六天
  rationale: 路加原文用ὡσεὶ明确表示约数。译文保留其近似性，不将其精确化，也不按其他福音书的表述加以协调。
- issue: 主语“他”的指代
  choice: 耶稣
  alternative: 他
  rationale: 希腊文主语由动词和上下文隐含，指耶稣。现代汉语若直接用“他”，单节阅读时可能不够清楚，因此显明为“耶稣”，没有增加新的身份判断。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“这些话说完后”承接前文自然；“上山去祷告”保持简洁叙事语气。脚注标记置于与“这些话说完后约有八天”相关的位置。
