lexical_decisions:
- source_word: καὶ
  choice: 于是
  rationale: 在叙事衔接中自然承接前文；既保留连接作用，也不加入强于上下文的因果含义。
- source_word: ἐπορεύθησαν
  choice: 往……去了
  rationale: πορεύομαι在此表示前往、行进；这一表达符合现代汉语叙事习惯，并清楚呈现移动。
- source_word: εἰς
  choice: 往
  rationale: 与移动动词搭配，表示目的地；汉语用“往……去”自然准确。
- source_word: ἑτέραν
  choice: 另一个
  rationale: ἕτερος可指“另一个”，也可强调“不同的”；正文采用自然的“另一个”，脚注保留后一层可能含义。
- source_word: κώμην
  choice: 村庄
  rationale: κώμη指村落或较小的聚居地，“村庄”比“城”更准确。
