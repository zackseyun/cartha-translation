  text: Ὁ δὲ ἐπιτιμήσας αὐτοῖς παρήγγειλεν μηδενὶ ⸀λέγειν τοῦτο,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/021.yaml
  text: But he rebuked them and commanded them to tell this to no one,[a]
translation:
  language: zh_hans
  text: 但耶稣严厉警告他们，吩咐他们不可把这事告诉任何人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“但耶稣斥责他们，命令他们不可把这事告诉任何人。”
    reason: ἐπιτιμάω可译为“斥责”或“严厉警告”，παραγγέλλω也可译为“命令”；脚注保留原文较强硬的另一种表达。
lexical_decisions:
- source_word: ἐπιτιμήσας
  choice: 严厉警告
  rationale: ἐπιτιμάω可表示斥责或严厉警告。此处对象是门徒，且后接权威性的吩咐；“严厉警告”既保留强烈语气，也比“斥责”更自然地表达禁止泄露的语境。
- source_word: παρήγγειλεν
  choice: 吩咐
  rationale: παραγγέλλω表示权威性的指示或命令。“吩咐”在现代汉语中庄重自然，并保留耶稣指令的权威性。
- source_word: μηδενὶ
  choice: 任何人
  rationale: 与“不可……告诉”搭配，准确表达‘不告诉任何人’，符合现代汉语习惯。
- source_word: λέγειν
  choice: 告诉
  rationale: 本句带有人作间接对象，并以τοῦτο为所传达的内容，因此译作“告诉”比直译为“说”更自然。
- source_word: τοῦτο
  choice: 这事
  rationale: 指回彼得刚才的宣认；“这事”保留指示性而不在正文中过度明确所指。
- source_word: δὲ
  choice: 但
  rationale: δέ在这里表示与前文彼得宣认之间的轻微转折；“但”能自然呈现这一叙事反差。
theological_decisions:
- issue: 彼得宣认之后，耶稣禁止门徒传扬此事的力度
  choice: 译为强烈警告并作出权威性的禁止
  alternative: 译为较温和的提醒，不要提起此事
  rationale: ἐπιτιμήσας与παρήγγειλεν连用，表明这不是随意请求。译文保留叙事中的张力，但不在正文中解释耶稣如此禁止的原因。
translation_notes:
  register: 采用自然、庄重、易懂的现代标准汉语。“严厉警告……吩咐”传达两个动词连续出现的强烈语气，同时避免生硬重复；明确补出主语“耶稣”，以符合独立经节展示时的汉语可读性。
