  text: καὶ ἀπέστειλεν αὐτοὺς κηρύσσειν τὴν βασιλείαν τοῦ θεοῦ καὶ ἰᾶσθαι ⸂τοὺς ἀσθενεῖς⸃,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/002.yaml
  text: And he sent them out to proclaim the kingdom of God and to heal the sick,[a]
translation:
  language: zh_hans
  text: 他差遣他们去宣讲上帝的国[a]，并医治患病的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“上帝的统治”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: 差遣……去
  rationale: 该词表示带着使命派出；“差遣他们去”自然体现委派和外出的语境。
- source_word: κηρύσσειν
  choice: 宣讲
  rationale: 该词侧重公开宣告；“宣讲”既保留公开传扬的意味，也符合现代汉语圣经语体。
- source_word: βασιλείαν τοῦ θεοῦ
  choice: 上帝的国
  rationale: 这是清楚且沿用已久的译法，能保留该短语兼含上帝统治与其国度的广度，而不将含义限缩为单一层面。
- source_word: ἰᾶσθαι
  choice: 医治
  rationale: 该词在此指使身体患病者恢复健康；“医治”准确、自然，也符合上下文。
- source_word: τοὺς ἀσθενεῖς
  choice: 患病的人
  rationale: ἀσθενής本可泛指软弱，但与“医治”连用时指患病者；“患病的人”比名词化的“病人”更直接呈现其状态。
theological_decisions:
- issue: βασιλεία τοῦ θεοῦ的含义范围
  choice: 上帝的国
  alternative: 上帝的统治
  rationale: 原短语可强调国度，也可强调掌权统治。“上帝的国”保留其传统表达和较宽的神学含义；脚注列出另一种可能，以免掩盖原文的语义幅度。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“差遣”“宣讲”“医治”保持经文语体，但不过度古雅；句式简洁，保留两个并列使命。
