  text: Συγκαλεσάμενος δὲ τοὺς δώδεκα ἔδωκεν αὐτοῖς δύναμιν καὶ ἐξουσίαν ἐπὶ πάντα τὰ δαιμόνια καὶ νόσους θεραπεύειν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/001.yaml
  text: And calling the twelve together[a], he gave them power and authority over all the demons and to heal diseases[b],
translation:
  language: zh_hans
  text: 他把十二人召集起来[a]，赐给他们能力和权柄，使他们能制服所有的鬼[b]，并医治疾病。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他召集了十二人以后”。
    reason: 分词结构可明确译出召集在先、赐予在后的关系。
  - marker: b
    text: 或译：“每一个鬼”。
    reason: πάντα修饰复数名词可作集合性表达“所有的鬼”，也可作分配性表达“每一个鬼”。
lexical_decisions:
- source_word: Συγκαλεσάμενος
  choice: 把……召集起来
  rationale: 保留συν-所表达的“聚集在一起”之意，并以现代汉语自然表达这个修饰主句动词的简单过去时中动分词；上下文表明召集先于赐予。
- source_word: δὲ
  choice: 不单独译出
  rationale: 此处δέ只是轻微的叙事连接词；汉语直接承接上文更自然，不会造成强烈转折的误解。
- source_word: τοὺς δώδεκα
  choice: 十二人
  rationale: 原文只说“十二”，没有明说“门徒”或“使徒”；译作“十二人”既自然，又避免增添原文未明说的身份称谓。
- source_word: ἔδωκεν
  choice: 赐给
  rationale: δίδωμι的基本意思是“给”；在耶稣授予能力和权柄的语境中，“赐给”自然庄重，同时不改变动作本身。
- source_word: δύναμιν
  choice: 能力
  rationale: 表达实际施行工作的力量或能力，并与ἐξουσία所指的授权性权柄区别开来。
- source_word: ἐξουσίαν
  choice: 权柄
  rationale: 表达获授的权利和支配权；与“能力”并列，保留原文两个概念之间的区别。
- source_word: ἐπὶ πάντα τὰ δαιμόνια
  choice: 制伏一切的鬼
  rationale: ἐπί加宾格在这里表示对鬼拥有支配权；“制伏”以自然汉语表达“在……之上拥有权柄”，而“一切的鬼”对应复数结构。
- source_word: δαιμόνια
  choice: 鬼
  rationale: 直接对应δαιμόνια；不改译为原文此处没有使用的“污灵”。
- source_word: νόσους
  choice: 疾病
  rationale: 准确涵盖νόσος所指的疾病、病症，且与“医治”搭配自然。
- source_word: θεραπεύειν
  choice: 医治
  rationale: 表达使疾病得到治疗或痊愈；与前面的权柄和能力构成所获使命的内容。
theological_decisions:
- issue: δύναμις与ἐξουσία的区别
  choice: 分别译作“能力”和“权柄”
  alternative: 合并译作“权能”
  rationale: 原文并列两个名词，既涉及实际能力，也涉及获授的权柄；分译可避免抹平这一张力。
- issue: “十二”的身份称谓
  choice: 译作“十二人”，不增添“门徒”或“使徒”
  alternative: 十二门徒／十二使徒
  rationale: 本节原文没有明说“门徒”或“使徒”；保持简略称呼，避免从邻近经文补入解释。
- issue: ἐπὶ πάντα τὰ δαιμόνια的范围
  choice: 一切的鬼
  alternative: 每一个鬼
  rationale: πάντα与复数冠词名词可整体理解为“所有的鬼”，也可分配性地表达“每一个鬼”；正文采用自然的集合性表达，脚注保留另一种可能。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“把……召集起来”自然体现共同聚集；“能力和权柄”保留原文并列概念；句末用完整句号，不沿用英文底稿的逗号。
