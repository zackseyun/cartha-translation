  text: οἳ ὀφθέντες ἐν δόξῃ ἔλεγον τὴν ἔξοδον αὐτοῦ ἣν ἤμελλεν πληροῦν ἐν Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/031.yaml
  text: who, appearing in glory, were speaking about his departure, which he was about to fulfill in Jerusalem.
translation:
  language: zh_hans
  text: 他们在荣耀中显现，谈论他将要在耶路撒冷成就的离世之事[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “离世”原文为“出离、离开”，可能使人联想到“出埃及”。这里指耶稣将要在耶路撒冷成就的离去事件，不宜仅限于理解为死亡。
    reason: 说明 ἔξοδος 的基本词义及可能的出埃及回响，同时避免将其含义限定为死亡或把可能的回响当作确定解释。
lexical_decisions:
- source_word: ἐν δόξῃ
  choice: 在荣耀中
  rationale: 保留原文所表达的荣耀状态或氛围，不将其具体化为“荣光照耀”等原文未明说的形象。
- source_word: τὴν ἔξοδον αὐτοῦ
  choice: 他的离世之事
  rationale: ἔξοδος 基本义为“离开、出离”，此处指向耶稣即将发生的死亡、复活与升天这一离去事件，也可能使人联想到“出埃及”；正文采用自然且适合上下文的“离世”，脚注保留其更宽的语义。
- source_word: πληροῦν
  choice: 成就
  rationale: 此词在这里不只是一般的“做完”，也可带有实现、使之圆满完成的意味；“成就”既贴近原文，也保留救赎事件达成的语气。
- source_word: ἤμελλεν
  choice: 将要
  rationale: 准确表达临近或注定要发生的未来行动，不额外强化为“必须”。
theological_decisions:
- issue: “离世”所指范围
  choice: 正文不把它限定为“死亡”，而用“离世之事”并加脚注说明
  alternative: 译作“死亡”或“出走”
  rationale: 路加的措辞可能涵盖耶稣在耶路撒冷的受死及其后离去，并可能含有“出埃及”的回响；不宜在正文中把这一张力单一化。
- issue: πληροῦν 的完成意味
  choice: 译作“成就”
  alternative: 译作“完成”
  rationale: “成就”保留事件既被完成又具有应验、达成意味的可能性，同时未明说是谁的预言或计划。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“在荣耀中显现”保持原文语序关系；“离世之事”比单说“离世”更自然地作为“谈论”的宾语，并保留事件性的表达。
