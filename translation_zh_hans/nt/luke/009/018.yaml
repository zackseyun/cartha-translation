source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ εἶναι αὐτὸν προσευχόμενον κατὰ μόνας συνῆσαν αὐτῷ οἱ μαθηταί, καὶ ἐπηρώτησεν αὐτοὺς λέγων· Τίνα με ⸂οἱ ὄχλοι λέγουσιν⸃ εἶναι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/018.yaml
  text: And it happened that while he was praying alone[a], the disciples were with him, and he asked them, saying, “Who do the crowds say that I am?”
translation:
  language: zh_hans
  text: 有一次，耶稣独自[a]祷告的时候，门徒和他在一起。他问他们：“众人说我是谁？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “独自”也可译作“私下”。原文可指避开众人、独处，并不一定表示现场绝对没有别人。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: 有一次
  rationale: 这是路加常用的叙事衔接语；译为“有一次”既自然，也保留开启一个场景的功能。
- source_word: ἐν τῷ εἶναι αὐτὸν προσευχόμενον
  choice: 耶稣……祷告的时候
  rationale: 带ἐν的冠词不定式表示同时发生的情境；“祷告的时候”符合现代汉语表达。主语依上下文明确补作“耶稣”。
- source_word: κατὰ μόνας
  choice: 独自
  rationale: 该惯用语可指独自一人，也可指避开众人、私下；正文用简洁的“独自”，并以脚注保留“私下”的可能。
- source_word: συνῆσαν αὐτῷ οἱ μαθηταί
  choice: 门徒和他在一起
  rationale: 直译其共处关系，不增添“在附近”等解释，也不消解与“独自”的表面张力。
- source_word: ἐπηρώτησεν αὐτοὺς λέγων
  choice: 他问他们
  rationale: 汉语无需机械保留“说”这一分词式引语结构；“问他们”自然、准确地引出问题。
- source_word: Τίνα με οἱ ὄχλοι λέγουσιν εἶναι
  choice: 众人说我是谁
  rationale: 按现代汉语间接问句语序表达；“众人”传达οἱ ὄχλοι所指的广大人群，比“人们”更具群体意味而不显生硬。
theological_decisions:
- issue: 耶稣“独自”祷告与门徒“和他在一起”之间的表面张力
  choice: 两句都按原文直接表达，不加解释
  alternative: 把κατὰ μόνας直接译成“私下”，或增译门徒“在附近”，以消除表面矛盾
  rationale: 原文既说耶稣κατὰ μόνας祷告，又说门徒与他同在；译文保留这种可理解为祷告状态或相对隐退的张力，不替文本作空间关系上的判定。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“有一次”自然承接场景；保留“独自”与“门徒和他在一起”的并置。脚注标记[a]已置于正文对应词后。
