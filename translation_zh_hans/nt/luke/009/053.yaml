  text: καὶ οὐκ ἐδέξαντο αὐτόν, ὅτι τὸ πρόσωπον αὐτοῦ ἦν πορευόμενον εἰς Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/053.yaml
  text: And they did not receive him[b][a], because his face was going toward Jerusalem.
translation:
  language: zh_hans
  text: 他们不接待他[a]，因为他面向耶路撒冷而去[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “接待”也可译作“欢迎”或“接纳”；这里很可能包括拒绝提供旅途中的食宿接待。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近似“因为他的面正往耶路撒冷去”，是表示朝向某地前行的表达；在上下文中也可含有坚定前往的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδέξαντο
  choice: 接待
  rationale: δέχομαι可指接受、接纳或欢迎；在此行程语境中，重点是当地人拒绝接待耶稣，可能包括拒绝提供食宿。“接待”既保留词义核心，也自然符合中文语境。
- source_word: τὸ πρόσωπον αὐτοῦ
  choice: 他面向
  rationale: πρόσωπον本义为“脸、面”；这里处于带有闪语色彩的方向表达中。译作“他面向”保留“面”的意象，同时避免生硬的“他的脸正在去”。
- source_word: ἦν πορευόμενον
  choice: 而去
  rationale: 该迂回结构表达正在前往或行进。译作“而去”直接体现πορεύομαι的行动意义，不把附近经文所强调的坚定决意过度加入本节。
- source_word: εἰς Ἰερουσαλήμ
  choice: 耶路撒冷
  rationale: εἰς表示朝向或前往某目的地；与“面向……而去”组合，中文已自然呈现“前往耶路撒冷”的方向。
- source_word: ὅτι
  choice: 因为
  rationale: ὅτι在此引出不接待他的原因，译作“因为”清楚自然。
theological_decisions:
- issue: “他的面正在往耶路撒冷去”这一表达的含义
  choice: 译为“他面向耶路撒冷而去”，保留面向目的地的形象及实际行进意义
  alternative: 译为“他定意前往耶路撒冷”或更直译为“他的脸正往耶路撒冷去”
  rationale: 上下文确有耶稣坚定走向耶路撒冷的叙事张力，但本句的πορευόμενον明确表示行进。所选译法既不抹平原文的“面”这一形象，也不把“定意”作为唯一解释写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“他面向耶路撒冷而去”有意保留原文的面向意象与略带闪语色彩的表达，同时仍符合现代汉语。脚注标记均置于其所说明的词句之后。
