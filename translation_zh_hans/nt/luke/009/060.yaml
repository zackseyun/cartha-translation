reference: Luke 9:60
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἶπεν δὲ ⸀αὐτῷ· Ἄφες τοὺς νεκροὺς θάψαι τοὺς ἑαυτῶν νεκρούς, σὺ δὲ ἀπελθὼν διάγγελλε τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/060.yaml
  text: But he said to him[a], “Leave the dead to bury their own dead, but you, go and proclaim the kingdom of God.”
translation:
  language: zh_hans
  text: 但耶稣对他说[a]：“让死人埋葬他们自己的死人；至于你，要去宣讲上帝的国。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 两处“死人”在希腊文中是同一个词。第一处很可能是比喻用法，指对上帝的呼召没有回应的人；第二处则指肉身死亡的人。正文保留同词重复所形成的悖论。
    reason: 说明原文刻意保留的词义张力与可能解释。
lexical_decisions:
- source_word: Ἄφες
  choice: 让
  rationale: 这里是不定过去时命令式，要求对方不再承担所请求的事。中文“让……埋葬”既保留命令的力度，也自然地引出不定式所表达的行动。
- source_word: τοὺς νεκροὺς ... τοὺς ἑαυτῶν νεκρούς
  choice: 死人……他们自己的死人
  rationale: 两处均译作“死人”，保留希腊文重复同一词所形成的尖锐悖论，不在正文中明说第一处为属灵意义、第二处为肉身死亡。
- source_word: θάψαι
  choice: 埋葬
  rationale: 准确表达不定式所指的安葬行为，并与“让”构成自然的中文使令结构。
- source_word: ἑαυτῶν
  choice: 他们自己的
  rationale: 反身代词带有强调意味；“他们自己的”比单说“他们的”更充分地保留这一语气。
- source_word: ἀπελθὼν
  choice: 要去
  rationale: 该不定过去时分词在主命令之前表达离开前往的行动。译作“要去”与后面的主要命令连用，中文自然，同时保留行动次序。
- source_word: διάγγελλε
  choice: 宣讲
  rationale: 现在时命令式带有持续、公开传扬的意味；“宣讲”适合上帝之国的信息，也比单纯“告诉”更能体现公开宣告。
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: 上帝的国
  rationale: 保留路加福音中这一核心、传统且清楚的圣经表达，既可指上帝的统治，也保留“国”的经文意象。
theological_decisions:
- issue: 两处“死人”的意义
  choice: 正文两处都译作“死人”，不直接解释其不同含义。
  alternative: 将第一处译为“灵性死亡的人”，第二处译为“死去的人”。
  rationale: 第一处很可能比喻对上帝呼召没有回应的人，第二处则指肉身死亡的人；然而原文两处使用同一个词。保留相同译词可维持耶稣话语刻意形成的悖论与神学张力，解释则置于脚注。
- issue: 耶稣命令与安葬责任之间的张力
  choice: 按原文保留命令的绝对、迫切语气，不在正文中加上缓和说明。
  alternative: 将命令解释为仅针对这位门徒的特殊情况，或改写为一般优先次序原则。
  rationale: 经文本身突出宣讲上帝之国的迫切性，却未在本节交代请求者的具体家庭情况；译文不应加入原文没有的限定。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“至于你”突出原文 σὺ δὲ 的对比焦点；分号呈现前后两项命令的强烈对照。“上帝”依本译本预期用语处理 θεός。
