  terminology: “被接上去”准确保留ἀνάλημψις的字面开放性，不应在正文改为单义的“升天”。“耶路撒冷”规范。“决意前往”恰当传达ἐστήρισεν与τοῦ πορεύεσθαι的坚定目的；脚注可说明“坚定自己的脸”这一习语。
