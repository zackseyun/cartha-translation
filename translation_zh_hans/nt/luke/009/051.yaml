  text: Ἐγένετο δὲ ἐν τῷ συμπληροῦσθαι τὰς ἡμέρας τῆς ἀναλήμψεως αὐτοῦ καὶ αὐτὸς τὸ ⸀πρόσωπον ⸀ἐστήρισεν τοῦ πορεύεσθαι εἰς Ἰερουσαλήμ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/051.yaml
  text: It happened[a], when the days of his being taken up were being fulfilled[b], that he set his face to go to Jerusalem.
translation:
  language: zh_hans
  text: 他被接上去的日子将要满的时候[a]，他就坚定地面向耶路撒冷，决意前往[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“他升天的日子”。原文直译是“他被接上去”。
    reason: alternative_reading
  - marker: b
    text: 原文含有“坚定自己的脸”的表达，意思是下定决心。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ ἐν τῷ συμπληροῦσθαι
  choice: ……将要满的时候
  rationale: 以自然的汉语时间从句承载叙事过渡和过程临近完成的意思；不生硬直译为“事情发生了”。“将要满”表示所定时期正走向完成。
- source_word: τὰς ἡμέρας
  choice: 日子
  rationale: 保留原文具体的时间表达，不抽象改写为“时期”。
- source_word: τῆς ἀναλήμψεως αὐτοῦ
  choice: 他被接上去
  rationale: ἀνάλημψις本义是“被接上去”。采用被动表达，避免在正文中把所指过早限定为升天这一单一事件，并保留路加叙事中的神学张力。
- source_word: καὶ αὐτὸς τὸ πρόσωπον ἐστήρισεν
  choice: 他就毅然面向
  rationale: “面向”保留“坚定自己的脸”这一形象，“毅然”自然表达ἐστήρισεν所含的坚定决意，避免逐字翻译造成生硬。
- source_word: τοῦ πορεύεσθαι εἰς Ἰερουσαλήμ
  choice: 耶路撒冷走去
  rationale: 清楚表达行动目的和方向，同时采用现代汉语自然语序。
theological_decisions:
- issue: ἀνάλημψις所指的范围
  choice: 正文译作“被接上去”
  alternative: “升天”或“离去”
  rationale: 原词表示“被接上去”，可能直接指升天，也可能从较宽广的角度概括耶稣经受难、复活而进入升高的进程。正文不替读者消除这种张力，脚注列出传统译法。
- issue: τὸ πρόσωπον ἐστήρισεν的惯用语力度
  choice: 译作“毅然面向”
  alternative: “定意前往”或直译“坚定了自己的脸”
  rationale: 既保留“面向”的形象，又明确坚定决心的语用含义；不额外引入教义性解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“日子将要满”略带经文语体，但仍属通顺现代汉语；“毅然面向”兼顾原文形象和汉语自然度。
