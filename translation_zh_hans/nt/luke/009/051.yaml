  to: 他被接上去的日子将要满的时候[a]，他就坚定地面向耶路撒冷，决意前往[b]。
  rationale: 修订仅调整末句的汉语表达：“坚定地面向耶路撒冷，决意前往”更自然、准确地传达坚定决心及前往的目标，并保留原文“面”的形象。保留“被接上去”及其脚注，以免将ἀνάλημψις预先限定为仅指升天。
