id: LUK.9.6
reference: Luke 9:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐξερχόμενοι δὲ διήρχοντο κατὰ τὰς κώμας εὐαγγελιζόμενοι καὶ θεραπεύοντες πανταχοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/006.yaml
  text: So they went out and traveled through the villages[b][a], proclaiming the good news and healing everywhere.
translation:
  language: zh_hans
  text: 于是，他们出去，走遍各村[a]，到处传扬好消息[b]，医治病人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“逐村而行”。希腊语表达可强调在一个个村庄之间行走。
    reason: lexical_alternative
  - marker: b
    text: 或译：“传福音”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξερχόμενοι
  choice: 出去
  rationale: 不定过去时分词承接耶稣的差遣，表示门徒随后出发；“出去”自然地保留了离开原处、开始行动的意思。
- source_word: δὲ
  choice: 于是
  rationale: δέ在这里推动叙事，并承接上文差遣的结果；“于是”比单用“又”更清楚地表达顺承关系。
- source_word: διήρχοντο
  choice: 走遍
  rationale: 未完成时表示持续地在多处行走；结合后面的村庄，译作“走遍”简洁自然，也体现逐处前行。
- source_word: κατὰ τὰς κώμας
  choice: 各村
  rationale: κατά加宾格在此具有分布性，指在一个个村庄中活动；“各村”保留这一范围意义，另以脚注说明“逐村”的可能表达。
- source_word: εὐαγγελιζόμενοι
  choice: 传扬好消息
  rationale: 该分词表示宣告福音性的好消息；“传扬好消息”既符合现代汉语，也避免把此处不必要地限定为后期术语化表达。
- source_word: θεραπεύοντες
  choice: 医治病人
  rationale: θεραπεύω在语境中指医治；汉语若只说“医治”略显悬空，补出隐含宾语“病人”使句子自然，并未增加新的事件内容。
- source_word: πανταχοῦ
  choice: 到处
  rationale: 该副词强调事工遍及各处；“到处”直接、自然，并可同时修饰传扬与医治两项行动。
theological_decisions:
- issue: εὐαγγελιζόμενοι在门徒使命中的含义
  choice: 传扬好消息
  alternative: 传福音
  rationale: 原文确指带来福音性好消息的宣告，但本节没有进一步界定其后来形成的完整术语内容；“传扬好消息”保留宣告性质和开放度，同时不削弱其救恩信息。
- issue: πανταχοῦ所修饰的范围
  choice: 让“到处”自然涵盖传扬和医治
  alternative: 只让“到处”修饰医治
  rationale: πανταχοῦ位于两个并列分词之后，语法上可概括两项同行的活动；中文前置为“到处”最自然，也保留这种整体范围。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“于是”承接上文，“走遍各村”体现持续且分布性的行程；两个分词译为并列行动，使中文流畅，并保留传扬与医治相伴进行的结构。
