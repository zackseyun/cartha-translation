  source_fidelity: 译文准确呈现了叙事推进（δὲ）、门徒出发（ἐξερχόμενοι）、持续而分布地经过村庄（διήρχοντο κατὰ τὰς κώμας），以及传扬与医治两项并行的行动。"到处"可自然地概括后面的两项事工，也不排除其句法上更贴近医治的可能性。
  naturalness: “于是，他们出去，走遍各村，到处传扬好消息，医治病人”在现代标准汉语中流畅、庄重且易懂。“走遍各村”虽带有较强的遍历感，但在此处对κατὰ τὰς κώμας的分布性表达仍属可接受的自然译法。
