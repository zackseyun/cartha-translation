  text: καὶ ἐν τῷ γενέσθαι τὴν φωνὴν ⸀εὑρέθη Ἰησοῦς μόνος. καὶ αὐτοὶ ἐσίγησαν καὶ οὐδενὶ ἀπήγγειλαν ἐν ἐκείναις ταῖς ἡμέραις οὐδὲν ὧν ἑώρακαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/036.yaml
  text: And when the voice had come[a], Jesus was found alone. And they kept silent and told no one in those days anything of what they had seen.
translation:
  language: zh_hans
  text: 当那声音发出时，只见耶稣一人[a]。他们保持沉默，在那些日子里，没有把他们所看见的任何事告诉任何人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“耶稣被发现独自一人。”也可译作：“只剩下耶稣一人”或“只看见耶稣一人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ γενέσθαι τὴν φωνὴν
  choice: 声音响过之后
  rationale: ἐν加冠词不定式表达时间，可译为“当……时”或“……之后”。结合紧接着出现的结果状态，用“响过之后”自然地呈现声音发出后场景的变化，同时不把φωνή弱化为一般声响。
- source_word: εὑρέθη Ἰησοῦς μόνος
  choice: 众人发现只有耶稣一人
  rationale: εὑρέθη是被动形式，直译为“耶稣被发现是独自一人”；现代汉语用“众人发现只有耶稣一人”更自然，并保留叙事视角及μόνος所强调的唯一、独自存在。脚注列出较形式对应的译法。
- source_word: ἐσίγησαν
  choice: 保持沉默
  rationale: 表达门徒没有谈论此事的持续状态，比单纯“沉默了”更贴合上下文。
- source_word: οὐδενὶ ἀπήγγειλαν
  choice: 没有……告诉任何人
  rationale: ἀπαγγέλλω在此指把所见之事讲述、报告给别人；“告诉”是自然清楚的现代汉语。
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: 在那些日子里
  rationale: 直接保留原文的时间范围，不将其扩大解释为永久保密。
- source_word: οὐδὲν ὧν ἑώρακαν
  choice: 所看见的事
  rationale: 在“没有……告诉任何人”的否定结构中，“所看见的事”自然承载原文“他们所见之事中的任何一件”的范围，避免汉语重复否定造成拗口。
theological_decisions:
- issue: 天上声音发出后耶稣独自出现的叙事含义
  choice: 仅叙述“众人发现只有耶稣一人”，不添加神学解释
  alternative: 译作“只剩下耶稣”或“他们只看见耶稣”
  rationale: 原文报告场景结果，但没有明说摩西和以利亚如何离去，也没有在本句解释其神学意义；译文应保留这种叙事克制。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“众人”是被动句中按语境补出的观察主体；后一句明确用“门徒”，以承接原文αὐτοί并避免指代含混。
