  text: εἶπεν δὲ αὐτοῖς· Ὑμεῖς δὲ τίνα με λέγετε εἶναι; ⸂Πέτρος δὲ ἀποκριθεὶς⸃ εἶπεν· Τὸν χριστὸν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/020.yaml
  text: And he said to them[a], “But who do you say that I am?” Peter answered, “The Messiah of God.”
translation:
  language: zh_hans
  text: 他对他们说：“但你们说我是谁？”彼得回答说：“是上帝的弥赛亚[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弥赛亚”或译“基督”。
    reason: 保留 χριστός 的传统汉语译名作为词汇替代。
lexical_decisions:
- source_word: Ὑμεῖς
  choice: 你们
  rationale: 希腊文显式使用第二人称复数代词，并借前后的 δέ 构成对比；汉语用“那么，你们”自然地突出问话对象。
- source_word: τίνα με λέγετε εἶναι
  choice: 你们说我是谁
  rationale: 按现代汉语习惯表达 λέγετε 加不定式 εἶναι 所构成的间接陈述，同时完整保留身份之问。
- source_word: ἀποκριθεὶς εἶπεν
  choice: 回答说
  rationale: 将分词与限定动词合并为自然的汉语叙事表达，不重复译成“回答了又说”。
- source_word: χριστός
  choice: 弥赛亚
  rationale: 此处是彼得对耶稣身份的称号性宣认；“弥赛亚”能显明其在以色列盼望中的受膏者含义，而传统译名“基督”列于脚注。
- source_word: τοῦ θεοῦ
  choice: 上帝的
  rationale: 以所有格形式直接保留希腊文属格关系，不擅自限定为“上帝所立的”“从上帝来的”等某一种解释。
- source_word: δέ
  choice: 那么
  rationale: 问句中的 δέ 突出耶稣从众人的看法转向门徒本人的回答；“那么”在现代汉语中自然承载这种承接兼对比功能。
theological_decisions:
- issue: 彼得宣认中 χριστός 的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: χριστός 在这里是身份称号，不是姓名的一部分；正文采用能传达犹太受膏者背景的“弥赛亚”，并在脚注保留传统教会用语“基督”。
- issue: τοῦ θεοῦ 的属格关系
  choice: 上帝的
  alternative: 上帝所立的
  rationale: 原文只给出属格，并未明说其具体关系；直译“上帝的”可保留其神学张力，避免把来源、委任或归属中的某一种解释写入正文。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“那么，你们”体现原文对门徒的强调和语篇转折；“上帝的弥赛亚”虽略带称号式结构，却有意保留原文属格的简洁与开放性。
