  text: λαβὼν δὲ τοὺς πέντε ἄρτους καὶ τοὺς δύο ἰχθύας ἀναβλέψας εἰς τὸν οὐρανὸν εὐλόγησεν αὐτοὺς καὶ κατέκλασεν καὶ ἐδίδου τοῖς μαθηταῖς ⸀παραθεῖναι τῷ ὄχλῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/016.yaml
  text: Then[a], taking the five loaves and the two fish, and looking up to heaven, he blessed them and broke them and kept giving them to the disciples to set before the crowd.
translation:
  language: zh_hans
  text: 于是，耶稣拿起五个饼和两条鱼，举目望向天上，为这些食物祝福[a]，掰开了，又不断递给门徒，让他们摆在众人面前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为这些食物献上感谢”。原文动词是“祝福”；有些平行记载使用“感谢”。
    reason: 说明此处可作的语境性理解，同时保留路加原文εὐλογέω（“祝福”）与平行记载所用“感谢”动词之间的差异。
lexical_decisions:
- source_word: λαβὼν
  choice: 拿起
  rationale: 不定过去时分词表示先于主要动作发生的伴随行动；“拿起”自然呈现动作次序。
- source_word: δὲ
  choice: 于是
  rationale: 表示叙事推进的轻微连接，“于是”符合现代汉语叙事习惯。
- source_word: ἄρτους
  choice: 饼
  rationale: 在这一供食场景中指可计数的饼；汉语用量词“五个”自然明确。
- source_word: ἰχθύας
  choice: 鱼
  rationale: 按上下文指两条鱼，以量词“条”表达复数。
- source_word: ἀναβλέψας εἰς τὸν οὐρανὸν
  choice: 举目望天
  rationale: 准确而自然地表达向上仰望天空／天上的祷告姿态。
- source_word: οὐρανὸν
  choice: 天
  rationale: “天”在汉语中既保留向上仰望的空间意象，也适合此处面向上帝祝福的语境，避免过度具体化为“天空”。
- source_word: εὐλόγησεν αὐτοὺς
  choice: 为这些食物祝福
  rationale: 保留 εὐλογέω 的“祝福”含义；αὐτούς 为阳性复数，回指饼和鱼。“这些食物”使汉语指代清楚，并避免“祝福它们”的生硬表达。
- source_word: κατέκλασεν
  choice: 掰开了
  rationale: 表示把食物掰开以便分发；“掰开”比泛指的“弄碎”更具体自然。
- source_word: ἐδίδου
  choice: 不断递给
  rationale: 未完成过去时具有持续或反复意味；“不断”呈现耶稣持续递交食物的动作。
- source_word: μαθηταῖς
  choice: 门徒
  rationale: 原文有定冠词但无明示所有格；汉语无须添加“他的”。
- source_word: παραθεῖναι
  choice: 让他们摆在……面前
  rationale: 不定式表达递给门徒的目的；保留“放置在面前”的具体含义，而不简化为较解释性的“分给”。
- source_word: ὄχλῳ
  choice: 众人
  rationale: 此处指聚集的人群；“众人”庄重、自然，并比“群众”更适合圣经叙事语体。
theological_decisions:
- issue: 祷告语境中 οὐρανός 的含义
  choice: 天
  alternative: 天空；天上
  rationale: “天”兼具可见的向上方向与上帝所在领域的宗教含义，保留原词在此语境中的层次，不把它限缩为物理天空。
- issue: εὐλόγησεν 的译法
  choice: 为这些食物祝福
  alternative: 为这些食物感谢上帝；祝谢了
  rationale: 原文使用 εὐλογέω（祝福），而非 εὐχαριστέω（感谢）；正文保留路加的用词，脚注说明语境上可理解为祝谢，避免按平行记载将二者无声合并。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“为这些食物祝福”比直译“祝福它们”更自然；“不断递给”体现未完成时的持续／反复动作。脚注标记已在正文对应位置出现。
