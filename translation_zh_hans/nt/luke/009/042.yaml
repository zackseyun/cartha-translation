  rationale: 仅作安全的语言润饰：将不够自然的“把他摔倒”改为“把他摔倒在地”，并将脚注替代译法调整为更贴近“交还／归还”词义的表达。未改变原文对鬼、污灵、医治及父子关系的叙述。
