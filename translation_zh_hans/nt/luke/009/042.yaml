  text: ἔτι δὲ προσερχομένου αὐτοῦ ἔρρηξεν αὐτὸν τὸ δαιμόνιον καὶ συνεσπάραξεν· ἐπετίμησεν δὲ ὁ Ἰησοῦς τῷ πνεύματι τῷ ἀκαθάρτῳ, καὶ ἰάσατο τὸν παῖδα καὶ ἀπέδωκεν αὐτὸν τῷ πατρὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/042.yaml
  text: But while he was still coming near[a], the demon threw him down and convulsed him. But Jesus rebuked the unclean spirit, healed the boy, and gave him back to his father.
translation:
  language: zh_hans
  text: 他还在走近时，鬼就把他摔倒在地，使他剧烈抽搐。耶稣斥责那污灵，医好了这孩子，把他交还给他父亲[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把他归还给他父亲。”
    reason: ἀποδίδωμι在此可译为“交还”或“归还”，表达孩子在得医治后被恢复给父亲。
lexical_decisions:
- source_word: ἔτι δὲ προσερχομένου αὐτοῦ
  choice: 他还在走近的时候
  rationale: 以时间从句表达属格独立结构；“还在”保留ἔτι所表示的持续状态，“走近”保留向耶稣靠近的动作。δέ在中文叙事中不必机械译出，以免转折过重。
- source_word: ἔρρηξεν αὐτὸν
  choice: 把他摔倒
  rationale: ῥήγνυμι在此指猛烈地将人摔倒；该译法自然清楚，也符合上下文中的暴力动作。
- source_word: τὸ δαιμόνιον
  choice: 鬼
  rationale: 直接表达具有行动能力的邪灵主体，并与后文“污灵”对应而不将两个希腊称谓完全拉平。
- source_word: συνεσπάραξεν
  choice: 使他剧烈抽搐
  rationale: 该动词表示造成强烈痉挛或抽搐；显明动作的使役关系，并保留其剧烈程度。
- source_word: ἐπετίμησεν
  choice: 斥责
  rationale: 保留耶稣以权柄严厉制止污灵的言语行动，是福音书相关场景中自然且准确的译法。
- source_word: τῷ πνεύματι τῷ ἀκαθάρτῳ
  choice: 那污灵
  rationale: “污灵”简洁保留ἀκάθαρτος的不洁含义；指示词“那”表明它与前述的鬼是同一对象。
- source_word: ἰάσατο
  choice: 医好了
  rationale: 准确表达ἰάομαι的医治含义，同时保留本节兼具赶鬼与医治的叙述。
- source_word: τὸν παῖδα
  choice: 孩子
  rationale: παῖς在此指年轻的孩子；“孩子”自然且不对具体年龄作过度限定，性别与父子关系可由上下文辨明。
- source_word: ἀπέδωκεν αὐτὸν τῷ πατρὶ αὐτοῦ
  choice: 把他交还给父亲
  rationale: ἀποδίδωμι在此有归还、恢复给原有关系对象之意；“交还”既保留动作，也传达医治后父子重新团聚的结果，而不额外解释。
theological_decisions:
- issue: 如何表达鬼魔所造成的折磨
  choice: 按原文译为具有主动行为的“鬼”和“污灵”
  alternative: 弱化为非人格的“邪恶力量”或纯粹的身心疾病
  rationale: 原文将鬼描述为能摔倒并使孩子抽搐的行动主体，随后又称其为污灵；译文应保留这种人格化的属灵主体表述。同时，原文明确说耶稣“医好了”孩子，因此也保留医治层面，不把赶鬼与医治彼此排斥。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“摔倒”“剧烈抽搐”“医好了”清楚直接；“污灵”保留经文术语色彩而不过度古雅。连接词按现代汉语叙事习惯适度省略，避免逐词照搬希腊语δέ造成生硬或过强的转折。
