  text: ταῦτα δὲ αὐτοῦ λέγοντος ἐγένετο νεφέλη καὶ ⸀ἐπεσκίαζεν αὐτούς· ἐφοβήθησαν δὲ ἐν τῷ ⸂εἰσελθεῖν αὐτοὺς⸃ εἰς τὴν νεφέλην.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/034.yaml
  text: While he was saying these things, a cloud appeared and began to overshadow them; and they were afraid as they entered into the cloud.
translation:
  language: zh_hans
  text: 他说这些话的时候，有一朵云彩[a]出现，笼罩着他们；他们进入云彩时，害怕起来。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这云彩可能使人联想到旧约中上帝彰显临在的场景，但本节没有明确作出这种解释。
    reason: cross_reference
  - marker: b
    text: “他们”具体指哪些人，原文在此没有明说。
    reason: referential_ambiguity
lexical_decisions:
- source_word: ταῦτα δὲ αὐτοῦ λέγοντος
  choice: 他说这些话的时候
  rationale: 以时间从句自然表达属格独立结构，并保留ταῦτα的复数所指，即彼得刚才所说的那些话。
- source_word: ἐγένετο νεφέλη
  choice: 有一朵云彩出现
  rationale: ἐγένετο在此引出云彩的出现或来到；“出现”自然简洁，也不推断云彩的来源。
- source_word: ἐπεσκίαζεν
  choice: 笼罩着
  rationale: 未完成时可表达持续或展开中的动作；“笼罩着”在现代汉语中自然，也保留云彩覆盖众人的意象，而不强行加入“开始”的起始义。
- source_word: ἐφοβήθησαν
  choice: 就害怕起来
  rationale: 表达不定过去时所叙述的恐惧发生，同时用“起来”自然呈现状态的起始。
- source_word: ἐν τῷ εἰσελθεῖν αὐτοὺς εἰς τὴν νεφέλην
  choice: 他们进入云彩时
  rationale: 将ἐν加冠词不定式译为同时发生的时间关系，并保留εἰς所表示的进入，而非仅仅处在云影之下。
theological_decisions:
- issue: 云彩的性质及其笼罩行动
  choice: 正文只描述云彩出现并笼罩他们，不直接称其为上帝的临在。
  alternative: 将云彩明确解释为象征上帝显现或荣耀的云。
  rationale: 上下文及旧约背景确实使人联想到上帝显现的场景，但本节本身没有明说；译文保留这一联想和神学张力，不把解释写入正文。
- issue: 进入云彩者的指代范围
  choice: 保留“他们”，不在正文中明确限定具体人物。
  alternative: 解释为门徒进入云彩，或解释为耶稣、摩西、以利亚进入云彩。
  rationale: 希腊文连续使用αὐτούς，语法上的指代可能引发讨论；直译为“他们”可避免无依据地消除经文本身的含混。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“云彩”比单说“云”更符合圣经叙事语体；分号保留两个紧密相连事件之间的层次。脚注标记均置于正文末尾，避免打断句子，同时对应指代含混和旧约背景。
