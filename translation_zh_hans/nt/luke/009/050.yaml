base_translation:
  language: en
  yaml_path: translation/nt/luke/009/050.yaml
  text: But Jesus said to him[a], “Do not stop him, for whoever is not against you is for you.”
translation:
  language: zh_hans
  text: 但耶稣对他说：“你们不要阻止他，因为不反对你们的，就是支持你们的。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν δὲ
  choice: 但……说
  rationale: δέ在这里是轻微的转折连接，回应上一节门徒试图阻止那人的话；译作“但”自然且不过分强化对立。
- source_word: πρὸς αὐτόν
  choice: 对他说
  rationale: αὐτόν指上一节刚发言的人；原文用代词而非专名，因此保留为“他”。
- source_word: Μὴ κωλύετε
  choice: 不要阻止他
  rationale: κωλύω可表示阻止、妨碍或禁止；结合上一节的具体行动，“不要阻止他”清楚自然。动词为复数命令式，中文由下文“你们”显明受话者是众门徒；宾语“他”承接那位赶鬼的人。
- source_word: ὃς γὰρ
  choice: 因为……的，就是……的
  rationale: γάρ说明理由；ὃς在此既联系眼前那人，也表达可普遍适用的原则。中文“……的，就是……”保留这一概括性。
- source_word: οὐκ ἔστιν καθ’ ὑμῶν
  choice: 不反对你们
  rationale: κατά加属格在此表达敌对或对立；“反对你们”准确、自然，并保留第二人称复数。
- source_word: ὑπὲρ ὑμῶν
  choice: 支持你们
  rationale: ὑπέρ在此表示站在某人一边、对其有利。“支持你们”与“反对你们”形成清晰对照，同时比单独的“为你们”更符合现代汉语。
theological_decisions:
- issue: 耶稣这句话的适用范围
  choice: 译成概括性原则：“不反对你们的，就是支持你们的。”
  alternative: 更具体地译为：“那不反对你们的人，就是支持你们的人。”
  rationale: 关系代词既可指眼前那位赶鬼的人，也可借此表达较广的原则。所选译法保留这种范围张力，不把经文限制于单一人物，也不增添额外教义解释。
- issue: 第二人称复数的文本形式
  choice: 保留“你们”
  alternative: 依部分文本传统译作“我们”
  rationale: 所给SBLGNT正文两处均为ὑμῶν，即“你们”；因此按正文翻译，不以异文取代。
translation_notes:
  register: 采用现代、庄重而口语可懂的普通话。“阻止”贴合具体语境；“反对／支持”形成自然对举。正文无需脚注，因为中文“阻止”已直接表达κωλύω在本语境中的主要意义，且所给英文脚注的几个选项在中文里不构成必须标出的实质差异。
