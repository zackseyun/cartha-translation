source:
  edition: SBLGNT
  text: Θέσθε ὑμεῖς εἰς τὰ ὦτα ὑμῶν τοὺς λόγους τούτους, ὁ γὰρ υἱὸς τοῦ ἀνθρώπου μέλλει παραδίδοσθαι εἰς χεῖρας ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/044.yaml
  text: Put these words into your ears[b][a], for the Son of Man is about to be handed over into the hands of men.
translation:
  language: zh_hans
  text: 你们要把这些话听进去[a]，因为人子将要被交到人手中[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“把这些话放进你们的耳朵里”，意思是要认真听取并牢记。
    reason: idiom_clarification
  - marker: b
    text: “被交到人手中”也可译作“被交付”或“被出卖”。原词可指交付给人，也可在某些语境中指背叛。
    reason: lexical_alternative
lexical_decisions:
- source_word: Θέσθε ὑμεῖς εἰς τὰ ὦτα ὑμῶν
  choice: 你们要把……听进耳中
  rationale: 保留原文“放进你们耳中”的鲜明意象，同时用现代汉语较自然的“听进耳中”表达刻意听取、牢记之意；“你们”体现显式代词的强调。
- source_word: τοὺς λόγους τούτους
  choice: 这些话
  rationale: 指耶稣随即所说的内容；“这些话”直接、自然。
- source_word: ὁ γὰρ
  choice: 因为
  rationale: 明确呈现 γάρ 所引出的理由，使前后逻辑在现代汉语中清楚自然。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人子
  rationale: 采用中文圣经传统中稳定而简洁的称号，保留其自称性质、含义张力及与《但以理书》第七章的互文联系。
- source_word: μέλλει
  choice: 将要
  rationale: 表达即将发生或临近发生的行动，不额外加入“命定”等较强解释。
- source_word: παραδίδοσθαι
  choice: 被交
  rationale: 保留“交给、交出、交付”这一宽泛含义，不把所指过早限定为犹大的“出卖”。
- source_word: εἰς χεῖρας ἀνθρώπων
  choice: 在人手里
  rationale: 保留“落入某人手中、受其权势支配”的惯用意象；汉语“人”自然涵盖原文所指的人类，并维持“人子”与“人手”之间的呼应。
theological_decisions:
- issue: “人子”的译法
  choice: 人子
  alternative: 那位属人的／那个人
  rationale: “人子”既是通行称号，也不消解其可能具有的普通语义、但以理书背景和基督论内涵。
- issue: παραδίδοσθαι 的范围
  choice: 被交
  alternative: 被出卖
  rationale: 原词可指交付，也可在特定语境中指背叛或出卖；本句着重耶稣将被置于人的权下，正文采用较宽的译法以保留叙事张力。
- issue: ἀνθρώπων 的所指
  choice: 人
  alternative: 世人／人类
  rationale: 这里泛指人类或人们；现代汉语“人”简洁自然，也能与“人子”形成原文中的修辞呼应。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“听进耳中”有意保留原文略显突出的听觉意象；“被交在人手里”保持简洁，并保留原文关于交付、权势与背叛之间的语义张力。
