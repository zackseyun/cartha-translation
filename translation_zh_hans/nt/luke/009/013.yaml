  text: εἶπεν δὲ πρὸς αὐτούς· Δότε αὐτοῖς ⸂ὑμεῖς φαγεῖν⸃. οἱ δὲ εἶπαν· Οὐκ εἰσὶν ἡμῖν πλεῖον ἢ ⸂ἄρτοι πέντε⸃ καὶ ἰχθύες δύο, εἰ μήτι πορευθέντες ἡμεῖς ἀγοράσωμεν εἰς πάντα τὸν λαὸν τοῦτον βρώματα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/013.yaml
  text: But he said to them[a], “You give them something to eat.” But they said[b], “We have no more than five loaves and two fish—unless we go and buy food for all this people.”
translation:
  language: zh_hans
  text: 耶稣对他们说：“你们给他们一些吃的吧[a]。”他们说：“我们只有五个饼、两条鱼；除非我们去给这里所有的人买食物。”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们自己给他们一些吃的吧。”
    reason: lexical_alternative
  - marker: b
    text: “除非我们去给这里所有的人买食物”也可理解为带有反问语气：“难道要我们去给这里所有的人买食物吗？”
    reason: preserve_ambiguity
lexical_decisions:
- source_word: Δότε αὐτοῖς ὑμεῖς φαγεῖν
  choice: 你们给他们吃吧
  rationale: 保留命令的直接性，并以前置“你们”表达显式代词 ὑμεῖς 的强调；“给他们吃”是现代汉语中自然的使役表达，不必机械补出“东西”。
- source_word: Οὐκ εἰσὶν ἡμῖν πλεῖον ἢ
  choice: 我们只有
  rationale: 希腊文直译为“我们所有的不多于”，在汉语中以“只有”自然、准确地表达数量限制。
- source_word: ἄρτοι πέντε
  choice: 五个饼
  rationale: ἄρτοι 指可数的饼；“五个饼”既保留个体数量，也符合中文圣经叙事语体。
- source_word: ἰχθύες δύο
  choice: 两条鱼
  rationale: 按现代汉语习惯用量词“条”，准确表达两尾鱼。
- source_word: εἰ μήτι
  choice: 除非
  rationale: 表达例外条件，并保留门徒所提出方案略带试探或反问的语气空间，不把情绪明确化。
- source_word: πορευθέντες ἡμεῖς ἀγοράσωμεν
  choice: 我们亲自去……买
  rationale: 将附属分词自然处理为连动结构“去……买”；“亲自”体现再次出现的显式 ἡμεῖς 所带的强调。
- source_word: πάντα τὸν λαὸν τοῦτον
  choice: 这一大群人
  rationale: λαός 在此指聚集的人群；“这一大群人”比生硬的“这一切百姓”更符合上下文，也传达 πάντα 的整体范围。
- source_word: βρώματα
  choice: 食物
  rationale: 概括可吃之物，符合现代汉语常用表达。
theological_decisions:
- issue: 耶稣命令的强调程度
  choice: 以“你们给他们吃吧”表达 ὑμεῖς 的强调
  alternative: 译作“你们自己给他们吃吧”
  rationale: 保留原文对“你们”的突出，同时避免“自己”可能带来的更强责备意味；脚注列出更显性的译法。
- issue: 门徒回答的情绪色彩
  choice: 按实际困难与例外条件平直翻译
  alternative: 译出明显的惊讶、抱怨或反问语气
  rationale: 原文允许读出迟疑或抗辩，但没有足够的显式标记要求译文固定其情绪，故不额外加入感叹或讽刺。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准普通话。“饼”保留一世纪近东食物的叙事传统；命令和回答均避免添加原文未明确表达的责备或恼怒。脚注标记均置于正文相应位置。
