  rationale: 修订删除无明确原文依据的“却”，以“给他们一些吃的”清楚表达 δίδωμι 加 φαγεῖν 的汉语习惯用法；以“这里所有的人”对应 πάντα τὸν λαὸν τοῦτον，避免将整体范围仅译成规模。保留“除非”及其脚注，以免把门徒答话可能具有的反问色彩固定为正文语气。
