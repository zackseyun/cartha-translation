  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὃς γὰρ ⸀ἂν θέλῃ τὴν ψυχὴν αὐτοῦ σῶσαι, ἀπολέσει αὐτήν· ὃς δ’ ἂν ἀπολέσῃ τὴν ψυχὴν αὐτοῦ ἕνεκεν ἐμοῦ, οὗτος σώσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/024.yaml
  text: For whoever wants to save his life will lose it[a], but whoever loses his life for my sake will save it.
translation:
  language: zh_hans
  text: 因为凡想保全自己生命的，必失去它[a]；但凡为我失去自己生命的，这人必保全它。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“自己的灵魂”或“自身”；希腊语这个词可按上下文指生命、灵魂或自身。
    reason: 说明ψυχή的真实语义范围，避免正文“生命”被误认为唯一可能含义。
lexical_decisions:
- source_word: ὃς γὰρ ἂν θέλῃ
  choice: 因为，凡想……的
  rationale: γάρ承接并解释上一节，因此译为“因为”；ὃς……ἂν加虚拟语气表示普遍而不特定的条件，以“凡……的”自然表达；θέλῃ译为“想”，符合现代汉语。
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: 自己的生命
  rationale: ψυχή在此可指生命、灵魂或自身。上下文谈为跟从耶稣而保全或失去生命，正文采用“生命”最贴合直接语境，同时以脚注保留其较宽的语义范围。
- source_word: σῶσαι / σώσει
  choice: 保全 / 必保全
  rationale: σῴζω在此含挽救、保存生命之意。“保全”在汉语中自然，也在前后两处保持同一译法，从而保留原文的对应与悖论。
- source_word: ἀπολέσει / ἀπολέσῃ
  choice: 必失去 / 失去
  rationale: ἀπόλλυμι在这里指失去生命；译作“失去”避免误解为主动毁灭自己，并在两小句中保持用词一致。
- source_word: ἕνεκεν ἐμοῦ
  choice: 为我
  rationale: ἕνεκεν加属格表示缘由或动机。“为我”简洁自然，准确表达因耶稣的缘故而承受生命损失。
- source_word: οὗτος
  choice: 这个人
  rationale: 指示代词οὗτος带有强调作用，明确指出前述那一类人。“这个人”在可理解的现代汉语中保留了这一强调，而不只用省略主语的表达。
theological_decisions:
- issue: ψυχή在耶稣这句悖论中的含义
  choice: 生命
  alternative: 灵魂；自身
  rationale: 紧接着舍己、背十字架和跟从耶稣的语境，重点是企图保住或甘愿失去自己的生命。译作“生命”不把含义限缩为非物质的灵魂；其他可能含义在脚注中注明。
- issue: 保全与失去生命的末世性和现实性张力
  choice: 不补明“今生”或“永生”
  alternative: 保全今生却失去永生；失去今生却得到永生
  rationale: 原文没有在两种“生命”前加限定语。正文保留同一名词及其悖论，不在翻译中预先判定现实生命与末世生命的具体区分。
- issue: οὗτος的强调
  choice: 这个人必保全生命
  alternative: 必保全生命
  rationale: 保留原文指示代词的突出作用，同时不加入超出文本的神学解释。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“凡……的”保留格言式普遍陈述；“保全—失去—失去—保全”维持原文严整的反转结构。脚注标记[a]已置于正文相关词语之后。
