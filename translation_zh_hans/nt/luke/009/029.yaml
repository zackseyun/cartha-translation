id: LUK.9.29
reference: Luke 9:29
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ προσεύχεσθαι αὐτὸν τὸ εἶδος τοῦ προσώπου αὐτοῦ ἕτερον καὶ ὁ ἱματισμὸς αὐτοῦ λευκὸς ἐξαστράπτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/029.yaml
  text: And as he was praying[a], the appearance of his face became different, and his clothing became white[b], flashing like lightning.
translation:
  language: zh_hans
  text: 他祷告的时候，面貌变了，衣服洁白，闪耀如电光。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“衣服洁白耀眼”；希腊文分词带有闪电般闪耀的意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ προσεύχεσθαι αὐτὸν
  choice: 他祷告的时候
  rationale: 这是路加常用的事件引入结构，表达某事在祷告过程中发生；省去生硬的“事情发生了”，符合现代汉语叙事习惯。
- source_word: τὸ εἶδος τοῦ προσώπου αὐτοῦ ἕτερον
  choice: 面貌变了
  rationale: εἶδος指可见的外观，ἕτερον意为“不同、另样”；“面貌变了”自然地表达外观发生变化，同时没有引入马太所说“发光”的细节。
- source_word: ὁ ἱματισμὸς αὐτοῦ
  choice: 衣服
  rationale: ἱματισμός指衣着、衣服；“衣服”是现代汉语中自然且清楚的对应词。
- source_word: λευκὸς
  choice: 洁白
  rationale: λευκός意为白色；“洁白”在庄重叙事中自然，并与后面的闪耀景象协调，而闪光本身仍由分词另行表达。
- source_word: ἐξαστράπτων
  choice: 闪耀如电光
  rationale: 该分词带有闪电般放光、闪耀的鲜明意象；这一译法比泛泛的“耀眼”更能保留希腊文的画面感。
theological_decisions:
- issue: 耶稣变像的描述
  choice: 译为可见的“面貌变了”
  alternative: 他的脸发光了；他的面貌被改变了
  rationale: 路加明确描述外观发生变化，却没有像马太那样说脸发光；此译保留事件的真实可见性，也不把其他福音书的措辞带入本节。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“面貌变了”保留路加较为克制的表述；“闪耀如电光”呈现原文的闪电意象。
