  text: καὶ ἐδεήθην τῶν μαθητῶν σου ἵνα ἐκβάλωσιν αὐτό, καὶ οὐκ ἠδυνήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/040.yaml
  text: And I begged your disciples to cast it out[a], but they were not able.
translation:
  language: zh_hans
  text: 我恳求你的门徒把它赶出去[a]，可是他们办不到。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把他赶出去”；若这里的代词指那孩子，而不是那灵。
    reason: 保留αὐτό指那灵或那孩子的可能歧义。
lexical_decisions:
- source_word: ἐδεήθην
  choice: 我恳求
  rationale: δέομαι表示迫切、诚恳的请求；“恳求”既传达父亲的急切，也符合现代汉语的庄重语体。
- source_word: τῶν μαθητῶν σου
  choice: 你的门徒
  rationale: μαθητής在福音书中通常指跟随老师学习的人；“门徒”保留了这一师徒关系，也是新约语境中的通行译法。
- source_word: ἵνα ἐκβάλωσιν
  choice: 把它赶出去
  rationale: ἵνα加虚拟式在此说明恳求的内容或目的；ἐκβάλλω在赶鬼语境中指驱逐，“赶出去”自然清楚，同时没有额外加入原文未明说的“鬼”。
- source_word: αὐτό
  choice: 它
  rationale: 中性代词αὐτό最自然地回指上下文中的“灵”（πνεῦμα，中性），因此译作“它”；但也可能按情境理解为那孩子，故用脚注保留另一种理解。
- source_word: οὐκ ἠδυνήθησαν
  choice: 他们办不到
  rationale: δύναμαι表示能力；“办不到”在现代汉语中自然地表达他们没有能力完成所求之事，也保留了原文没有说明失败原因这一点。
theological_decisions:
- issue: 赶逐对象αὐτό所指为何
  choice: 正文用“它”，理解为那灵。
  alternative: 译作“他”，理解为那孩子。
  rationale: 赶逐语境中，ἐκβάλλω的宾语通常是邪灵，而且中性αὐτό与上下文的中性名词πνεῦμα在语法上自然呼应。不过代词也可能按所涉及的人理解为孩子，因此不在正文中完全消除这一歧义，而以脚注保留另一译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“恳求”传达急切，“赶出去”符合赶逐邪灵的叙事语境；“可是他们办不到”自然呈现前后转折。
