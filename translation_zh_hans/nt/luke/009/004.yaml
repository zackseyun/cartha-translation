  text: καὶ εἰς ἣν ἂν οἰκίαν εἰσέλθητε, ἐκεῖ μένετε καὶ ἐκεῖθεν ἐξέρχεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/004.yaml
  text: And whatever house you enter, stay there, and leave from there.
translation:
  language: zh_hans
  text: 你们无论进了哪一家，就住在那里，也从那里离开。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἰκίαν
  choice: 家
  rationale: 此处指门徒受接待并住宿的人家；译作“家”比“房子”更自然，也保留家庭住处的含义。
- source_word: μένετε
  choice: 住在那里
  rationale: 在差遣与接待的语境中，μένω表示停留、住宿；“住在那里”符合现代汉语表达。
- source_word: ἐκεῖθεν ἐξέρχεσθε
  choice: 从那里离开
  rationale: 按原文直译其出发点含义，不额外补入目的地或拒绝接待等解释。
theological_decisions:
- issue: 是否把留在同一家中的持续性或禁止换住明说出来
  choice: 不增译，只译“就住在那里”
  alternative: “就一直住在那里，不要换地方”
  rationale: 上下文可使读者理解相关实践含义，但本节原文本身没有明说“不要换地方”；避免把解释写入正文。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“无论进了哪一家”对应带不定意味的关系结构；两个“那里”保留原文的重复与指向。
