  text: ἦσαν γὰρ ὡσεὶ ἄνδρες πεντακισχίλιοι. εἶπεν δὲ πρὸς τοὺς μαθητὰς αὐτοῦ· Κατακλίνατε αὐτοὺς κλισίας ⸀ὡσεὶ ἀνὰ πεντήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/014.yaml
  text: For there were about five thousand men[a]. And he said to his disciples[b], “Have them recline in groups of about fifty each.”
translation:
  language: zh_hans
  text: 因为约有五千名男子。[a]耶稣对他的门徒说：“让他们分组斜躺就席，每组约五十人。”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“男子”，特指成年男性；这个数字不包括妇女和儿童。
    reason: lexical_alternative
  - marker: b
    text: 或译：“让他们分组坐下，每组约五十人。”原文动词特指为用餐而斜躺或躺下。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡσεὶ
  choice: 约
  rationale: 两处均表示约数；“约”简洁自然，既适用于人数总数，也适用于每组人数。
- source_word: ἄνδρες
  choice: 男人
  rationale: ἀνήρ在此特指成年男性，而非泛指所有人；译作“男人”保留原文计数范围。
- source_word: πεντακισχίλιοι
  choice: 五千
  rationale: 直接表达原文基数，与“男人”搭配。
- source_word: Κατακλίνατε
  choice: 让他们……躺席
  rationale: 该使役动词指让人斜躺或躺下用餐；“躺席”在现代中文中虽稍具文化距离，却能自然保留用餐姿势和场景。
- source_word: κλισίας
  choice: 一组一组地
  rationale: 复数名词表示分组排列；此译法清楚传达群体被分成若干组。
- source_word: ἀνὰ πεντήκοντα
  choice: 每组约五十人
  rationale: ἀνά与数词表达分配意义；“每组”明确呈现逐组分配，“约”保留ὡσεὶ的近似性。
- source_word: γὰρ ... δὲ
  choice: 因为……（承接省略）
  rationale: “因为”保留γάρ对上文的解释作用；δέ在中文叙事中无需机械译出，以自然转入耶稣的吩咐。
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: 对门徒说
  rationale: 上下文已明确这些是耶稣的门徒；中文用“耶稣对门徒说”自然明确说话者和对象，不必生硬重复所有格。
