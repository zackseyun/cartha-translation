  text: Καὶ ὑποστρέψαντες οἱ ἀπόστολοι διηγήσαντο αὐτῷ ὅσα ἐποίησαν. καὶ παραλαβὼν αὐτοὺς ὑπεχώρησεν κατ’ ἰδίαν εἰς ⸂πόλιν καλουμένην Βηθσαϊδά⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/010.yaml
  text: And when the apostles returned[a], they reported to him what they had done. And taking them with him, he withdrew privately to a town called Bethsaida.
translation:
  language: zh_hans
  text: 使徒回来后，把他们所做的一切都告诉了耶稣。耶稣便带着他们避开众人[a]，退到一座名叫伯赛大的城里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“私下”“单独”或“到一旁”。这里表示耶稣和使徒离开众人，并不是说耶稣独自一人。
    reason: 说明κατ’ ἰδίαν可指私下、单独或到一旁；结合“带着他们”，澄清其并非绝对独处。
lexical_decisions:
- source_word: ὑποστρέψαντες
  choice: 回来后
  rationale: 不定过去时分词表示先于主句发生的动作；译为时间结构，符合现代汉语并保留事件次序。
- source_word: οἱ ἀπόστολοι
  choice: 使徒
  rationale: 在路加福音的差遣语境中，这是对十二人的特定称谓；“使徒”是准确且通行的译法。
- source_word: διηγήσαντο αὐτῷ
  choice: 告诉了耶稣
  rationale: διηγέομαι有讲述、叙说之意；此处指使徒向耶稣述说差遣期间的作为。代词所指在上下文中是耶稣，明译其名更自然清楚。
- source_word: ὅσα ἐποίησαν
  choice: 他们所做的一切
  rationale: ὅσα概括他们所做的全部事情；“所做的一切”自然保留这一总括语气。
- source_word: παραλαβὼν αὐτούς
  choice: 带着他们
  rationale: παραλαμβάνω在此表示把人带在身边、带同行；“带着他们”简洁自然。
- source_word: ὑπεχώρησεν
  choice: 退到
  rationale: 该动词含离开公开场合、退避之意；结合目的地，用“退到”既保留退离意味，也符合汉语搭配。
- source_word: κατ’ ἰδίαν
  choice: 私下
  rationale: 表示与外人或众人分开、非公开地行动。因耶稣带着使徒同行，不宜译成暗示他独自一人的“独自”。
- source_word: πόλιν καλουμένην Βηθσαϊδά
  choice: 一座名叫伯赛大的城
  rationale: πόλις指有组织的居民点，可译“城”或“城镇”；“城”是圣经地名叙述中自然而不夸大规模的表达。Βηθσαϊδά按现代中文圣经通行形式音译为“伯赛大”。
theological_decisions:
- issue: κατ’ ἰδίαν是否表示耶稣完全独处
  choice: 译为“私下”，表示耶稣与使徒避开其他人而退去
  alternative: “独自”或“单独”
  rationale: 经文明说耶稣带着使徒，因此不能理解为他完全独自一人；同时保留该短语所表达的非公开、与旁人分开的意味。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事体。“使徒”“耶稣”“伯赛大”沿用简体中文圣经通行称谓；句式清晰，避免把κατ’ ἰδίαν误解为绝对独处。
