  text: Ἤκουσεν δὲ Ἡρῴδης ὁ τετραάρχης τὰ ⸀γινόμενα πάντα, καὶ διηπόρει διὰ τὸ λέγεσθαι ὑπό τινων ὅτι Ἰωάννης ⸀ἠγέρθη ἐκ νεκρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/007.yaml
  text: Herod the tetrarch heard about all that was happening[a], and he was perplexed because it was being said by some that John had been raised from the dead,
translation:
  language: zh_hans
  text: 分封王希律听说了正在发生的一切，感到困惑，因为有人说约翰已经从死人中复活了[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊语动词是被动式，直译可作“约翰已经被从死人中叫活了”。
    reason: 说明原文的被动语态；主文采用汉语复活语境中自然、通行的表达，并未指定施动者。
lexical_decisions:
- source_word: Ἤκουσεν
  choice: 听说了
  rationale: 这里的宾语是“正在发生的一切”，表示希律得知有关这些事的消息；“听说了”比单说“听见了”更符合现代汉语。
- source_word: δὲ
  choice: 便（承接语气）
  rationale: δέ是轻微的叙事连接词，并不明确表示转折；汉语不另加“现在”，以“便”自然承接后句的反应。
- source_word: ὁ τετραάρχης
  choice: 分封王
  rationale: 保留τετραάρχης所指的历史政治职衔，避免泛化为“王”或“统治者”。
- source_word: τὰ γινόμενα πάντα
  choice: 正在发生的一切
  rationale: 保留γινόμενα所呈现的进行状态，同时采用自然、简洁的现代汉语。
- source_word: διηπόρει
  choice: 十分困惑
  rationale: διαπορέω表示因无法判断而困惑、茫然；“十分困惑”清楚传达其较强的疑惑程度。
- source_word: διὰ τὸ λέγεσθαι ὑπό τινων
  choice: 因为有人说
  rationale: 以自然汉语表达原因和不特定的消息来源；虽然没有机械保留希腊语被动句式，但“有人说”准确保留ὑπό τινων。
- source_word: ἠγέρθη
  choice: 被唤醒了
  rationale: 保留ἐγείρω的不定过去时被动形式及其“唤醒、使起来”的意象；在“从死人中”的语境中明确指复活，同时不把被动悄然改成主动。
- source_word: ἐκ νεκρῶν
  choice: 从死人中
  rationale: 较直接地表达“从死者当中”，并与复活语境相符；相比“从死里”，也更明显保留νεκρῶν的复数指人含义。
theological_decisions:
- issue: 关于约翰复活的传闻中，ἠγέρθη的被动表达
  choice: 约翰已经从死人中被唤醒了
  alternative: 约翰已经从死人中复活了
  rationale: 原文采用被动式，主文保留“被唤醒”的形式，不擅自确定施动者，也不将其改写为不及物主动表达；脚注提供更惯用的汉语说法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“分封王”为历史职衔；“被唤醒”略带原文意象，脚注补充通常的复活表达。
