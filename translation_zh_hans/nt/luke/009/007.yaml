  to: 分封王希律听说了正在发生的一切，感到困惑，因为有人说约翰已经从死人中复活了[a]。
  rationale: 将“被唤醒了”改为“从死人中复活了”，使译文在现代标准汉语中自然明确地表达复活，同时保留原文未说明施动者的含蓄。脚注说明被动式及较直译的表达，避免为维持希腊语语态而牺牲汉语准确性与可读性。
