  naturalness: “分封王希律”“听说了”“正在发生的一切”和“感到困惑”均自然且符合庄重叙事语体。“从死人中被唤醒了”不合现代汉语的宗教及叙事惯用表达，应改为“从死人中复活了”。
  terminology: “分封王”是对应τετραάρχης的通行历史职衔。“复活”是此处ἐγείρω在死亡语境中的规范汉语神学用语；脚注可说明希腊语为被动式，避免把汉语不显性的语态当作原文主动式。
