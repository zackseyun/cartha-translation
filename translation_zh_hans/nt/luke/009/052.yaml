  text: καὶ ἀπέστειλεν ἀγγέλους πρὸ προσώπου αὐτοῦ. καὶ πορευθέντες εἰσῆλθον εἰς κώμην Σαμαριτῶν, ⸀ὡς ἑτοιμάσαι αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/052.yaml
  text: And he sent messengers ahead of him[b][a]. And they went and entered a village of the Samaritans to prepare for him.
translation:
  language: zh_hans
  text: 他差遣使者先行[a]。他们前去，进了一个撒马利亚村庄[b]，要为他作准备。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“在他面前”，在这里指先于他前往。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“撒马利亚人的一个村庄”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: 差遣
  rationale: 该词在此指派人执行任务；“差遣”自然、庄重，也比单纯的“派”更能体现受命前往的意味。
- source_word: ἀγγέλους
  choice: 使者
  rationale: 上下文所指是奉派先行的人，并非天使；“使者”保留了该词“传信者、受差者”的基本含义。
- source_word: πρὸ προσώπου αὐτοῦ
  choice: 走在自己前面
  rationale: 原文直译近于“在他面前”，在行程语境中表示先于他前往；译作“走在自己前面”清楚表达空间和行动上的先行。
- source_word: πορευθέντες
  choice: 动身
  rationale: 这个先行的分词说明使者先出发，随后进入村庄；“动身进了”以自然汉语保留动作次序。
- source_word: εἰσῆλθον
  choice: 进了
  rationale: 简明、自然地表达进入某处的完成动作。
- source_word: κώμην
  choice: 村庄
  rationale: κώμη通常指规模较小的聚落，“村庄”比“城镇”更准确。
- source_word: Σαμαριτῶν
  choice: 撒马利亚村庄
  rationale: 原文为复数属格，直译是“撒马利亚人的一个村庄”；正文采用现代汉语较自然的定语结构，脚注保留其形式信息。
- source_word: ὡς ἑτοιμάσαι αὐτῷ
  choice: 要为他作准备
  rationale: ὡς加不定式在此表达目的；原文没有明说具体准备什么，因此译文也不补出食宿或接待等对象。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“动身进了”避免生硬直译分词，同时保留先出发、后进入村庄的次序；“为他作准备”不擅自补明准备的具体内容。
