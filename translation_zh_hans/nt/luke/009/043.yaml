  text: ἐξεπλήσσοντο δὲ πάντες ἐπὶ τῇ μεγαλειότητι τοῦ θεοῦ. Πάντων δὲ θαυμαζόντων ἐπὶ πᾶσιν οἷς ⸀ἐποίει εἶπεν πρὸς τοὺς μαθητὰς αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/043.yaml
  text: 'And they were all astonished at the majesty of God. But while everyone was marveling at all that he was doing[a], he said to his disciples:'
translation:
  language: zh_hans
  text: 众人都因上帝的伟大[a]而惊叹。大家正为耶稣所做的一切感到惊奇时，他对自己的门徒说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“上帝的威严”。希腊语μεγαλειότης可指伟大、宏伟或威严。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεπλήσσοντο
  choice: 震惊
  rationale: 未完成时表示众人持续处于强烈惊异之中；“震惊”保留了该词较强的语气，并与下句较温和的“感到惊奇”形成区别。
- source_word: πάντες
  choice: 众人都
  rationale: 明确表达反应的普遍性，符合现代汉语叙事习惯。
- source_word: ἐπὶ τῇ μεγαλειότητι τοῦ θεοῦ
  choice: 因上帝的伟大
  rationale: ἐπί加与格在此表示惊异的缘由；μεγαλειότης指伟大、宏伟或威荣。“伟大”自然易懂，也不把该词缩窄为单指能力。
- source_word: Πάντων δὲ θαυμαζόντων
  choice: 大家正……感到惊奇时
  rationale: 以时间从句表达属格独立结构，并用“正……时”体现动作正在持续；“感到惊奇”与前句语气更强的ἐκπλήσσομαι有所区分。
- source_word: ἐπὶ πᾶσιν οἷς ἐποίει
  choice: 为耶稣所做的一切
  rationale: ἐπί加与格表示惊奇所针对的对象或缘由；未完成时ἐποίει以“所做”置于持续叙事背景中。汉语明确补出“耶稣”，以免紧邻的“上帝”使隐含主语产生错误指向。
- source_word: εἶπεν πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: 他对自己的门徒说
  rationale: 采用自然的现代汉语引语导入方式；“自己的”清楚表达门徒与说话者的关系。
theological_decisions:
- issue: οἷς ἐποίει及εἶπεν的隐含主语所指
  choice: 前处明确译作“耶稣”，后处保留“他”
  alternative: 两处都译作“他”
  rationale: 上下文中的行动者和说话者是耶稣，而前句同时把众人所见彰显为“上帝的伟大”。补出“耶稣”是为避免汉语读者误以为紧邻的“上帝”是ἐποίει的语法所指，同时仍保留上帝的伟大与耶稣行动之间的叙事张力，不进一步解释二者的关系。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“众人都”“大家”自然传达两次全称表达；“震惊”与“感到惊奇”刻意区分原文两个强度不同的动词。
