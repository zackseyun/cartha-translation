  text: Ἔλεγεν δὲ πρὸς πάντας· Εἴ τις θέλει ὀπίσω μου ⸂ἔρχεσθαι, ἀρνησάσθω⸃ ἑαυτὸν καὶ ἀράτω τὸν σταυρὸν αὐτοῦ ⸂καθ’ ἡμέραν⸃, καὶ ἀκολουθείτω μοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/023.yaml
  text: And he was saying to all[a], “If anyone wants to come after me, let him deny himself and take up his cross daily, and follow me.”
translation:
  language: zh_hans
  text: 耶稣对众人说：“如果有人愿意跟在我后面[a]，就当舍弃自己，天天背起自己的十字架，并跟从我。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “跟在我后面”也可译作“到我后面来”。这里保留了门徒走在老师身后的形象；本节末尾则明确说“跟从我”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: 又……说
  rationale: 未完成时可表示当时持续的讲话；现代汉语叙事中用“说”最自然，“又”承接上下文，但不把该时态过度解释为反复说。
- source_word: πρὸς πάντας
  choice: 对众人
  rationale: 准确表达讲话对象的整体范围，现代汉语自然庄重。
- source_word: Εἴ τις θέλει
  choice: 如果有人愿意
  rationale: “有人”保留不定、泛指的单数意义；“愿意”准确表达 θέλει 所指的意愿。
- source_word: ὀπίσω μου ἔρχεσθαι
  choice: 跟在我后面
  rationale: 保留“来到我后面”的空间形象及其门徒含义，同时避免与末尾明确的“跟从我”完全重复。
- source_word: ἀρνησάσθω ἑαυτὸν
  choice: 就应当舍弃自己
  rationale: “舍弃自己”在现代汉语中比生硬的“否认自己”更准确地表达不再以自己为中心或主张自己的意思，又不把具体含义扩写为某种教义解释；“应当”传达第三人称命令语气。
- source_word: ἀράτω
  choice: 背起
  rationale: 与“十字架”搭配自然，兼含拿起并承担、背负的动作；单译“拿起”在汉语中不足以呈现这一具体形象。
- source_word: τὸν σταυρὸν αὐτοῦ
  choice: 自己的十字架
  rationale: “十字架”保留原文具体意象；反身式“自己的”自然对应泛指单数主语与 αὐτοῦ 的所属关系。
- source_word: καθ’ ἡμέραν
  choice: 天天
  rationale: 简明准确地表达“每一天”，保留路加所强调的持续、日常性。
- source_word: ἀκολουθείτω μοι
  choice: 并且跟从我
  rationale: “跟从”自然表达门徒随行及效法的含义；与前面的命令并列，并保留原文末句明确的跟随用语。
theological_decisions:
- issue: 门徒背“十字架”的含义
  choice: 保留具体的“十字架”，不改写为苦难、重担或牺牲。
  alternative: 背负自己的重担；承担自己的苦难
  rationale: σταυρός 是具体名词，同时具有丰富的门徒象征意义。直译可保留这种张力，不提前限定其神学所指。
- issue: 泛指单数与语法阳性
  choice: 用“有人……自己……自己的”表达泛指单数，不另加男性代词。
  alternative: 如果有人……他就应当舍弃他自己；凡愿意的人……他们就应当
  rationale: 希腊文以泛指单数起句，并用阳性单数命令式和反身代词承接。汉语无需借助有性别的代词即可自然保留泛指单数，因此既忠于语法数，也不无故突出男性。
- issue: 舍己命令的力度
  choice: 译为“应当舍弃自己”。
  alternative: 必须否认自己；放下自我
  rationale: 原文是命令式，须保留要求的力度；但“必须”容易被理解为额外的条件公式，“放下自我”又可能淡化命令。“舍弃自己”保留其强度和开放的神学内涵。
translation_notes:
  register: 采用现代、庄重而通俗的叙事和劝诫语体。“舍弃自己”比传统简缩语“舍己”更便于普通读者直接理解；“天天背起自己的十字架”保持熟悉度，同时不将十字架的象征意义解释性地缩窄。
