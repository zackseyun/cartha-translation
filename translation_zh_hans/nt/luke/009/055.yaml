  text: But he turned and rebuked them[a].
translation:
  language: zh_hans
  text: 耶稣却转过身来，责备他们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 一些较晚期的抄本在此补充：“又说：‘你们不知道自己是属什么样的灵；因为人子来，不是要毁灭人的性命，而是要拯救人的性命。’”
    reason: textual_variant
lexical_decisions:
- source_word: στραφεὶς
  choice: 转过身来
  rationale: 该词是 στρέφω 的不定过去时被动形态分词，在此具有主动意义，描写耶稣转身面对门徒；“转过身来”符合现代汉语叙事，也保留了动作的具体性。
- source_word: δὲ
  choice: 却
  rationale: δέ 在此承接叙事并表达轻微转折，与门徒先前的请求形成对照；“却”简洁自然。
- source_word: ἐπετίμησεν
  choice: 责备
  rationale: ἐπιτιμάω 表示严肃斥责或纠正；“责备”准确传达其力度，又不额外添加言辞内容。
- source_word: αὐτοῖς
  choice: 他们
  rationale: 该复数与格代词指向上下文中的门徒，直接相关者是雅各和约翰；现代汉语中“责备他们”是自然表达。
theological_decisions:
- issue: 后期抄本所含的较长增文
  choice: 正文只翻译 SBLGNT 的短读法：“耶稣却转过身来，责备他们。”
  alternative: “耶稣却转过身来，责备他们，说：‘你们不知道自己属于怎样的灵；因为人子来，不是要毁灭人的性命，而是要拯救人的性命。’”
  rationale: 所给原文证据仅含短读法，因此不把较长读法纳入正文。鉴于该增文篇幅较长，且在后期抄本及译本传统中较为人熟知，脚注予以说明。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“耶稣”由上下文明确补出主语，避免汉语孤立经节中主语不明；“却”体现叙事转折。脚注标记已置于正文相应位置。
