  text: καὶ εἶπεν αὐτοῖς· Ὃς ⸀ἂν δέξηται τοῦτο τὸ παιδίον ἐπὶ τῷ ὀνόματί μου ἐμὲ δέχεται, καὶ ὃς ⸁ἂν ἐμὲ δέξηται δέχεται τὸν ἀποστείλαντά με· ὁ γὰρ μικρότερος ἐν πᾶσιν ὑμῖν ὑπάρχων οὗτός ⸀ἐστιν μέγας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/048.yaml
  text: And he said to them[a], “Whoever receives this child in my name receives me, and whoever receives me receives the one who sent me[b]. For the one who is least among all of you—this one is great.”
translation:
  language: zh_hans
  text: 他对他们说：“凡奉我的名接纳这孩子的，就是接纳我；凡接纳我的，就是接纳那差我来的。因为在你们众人中最卑微的，这人就是伟大的。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δέξηται / δέχεται
  choice: 接纳
  rationale: δέχομαι兼有接受、欢迎和款待之意。“接纳”既能自然贯穿三次重复，又可保留人际欢迎与承认其代表身份两方面的含义。
- source_word: παιδίον
  choice: 孩子
  rationale: 该词在此直指一个孩子；不必借助“小孩子”额外强化指小色彩。
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: 因我的名
  rationale: 介词短语表示接纳行为以耶稣的名为依据或缘由，并与他的权柄和身份相关。“因我的名”在现代汉语中自然，也避免把意思限定为单纯代替耶稣行事。
- source_word: τὸν ἀποστείλαντά με
  choice: 那差我来的
  rationale: 按带冠词的分词结构译为指人的名词性短语，不在正文中补明“父”或“神”。
- source_word: μικρότερος
  choice: 最微小的
  rationale: 该比较级在群体地位语境中具有最高级意味，指地位卑微、看似不重要的人，而非主要指体格或年龄较小。
- source_word: ἐν πᾶσιν ὑμῖν
  choice: 你们众人中
  rationale: 表达此人在整个门徒群体中的相对位置，符合汉语习惯。
- source_word: ὑπάρχων
  choice: （隐含于“最微小的”结构中）
  rationale: 分词表达所处的状态；汉语无需机械译出“存在为”，用“你们众人中最微小的”即可自然承载。
- source_word: οὗτός ἐστιν μέγας
  choice: 这人才是大的
  rationale: “这人”保留指示代词的强调，“才是”凸显原句反转性的判断；“大的”保留与“最微小的”之间的词义张力。
- source_word: Ὃς ἂν ... καὶ ὃς ἂν
  choice: 凡……的……；凡……的……
  rationale: 准确表达带ἄν的不定关系条件，适合格言式普遍陈述。
- source_word: καὶ εἶπεν αὐτοῖς
  choice: 他对他们说
  rationale: 自然承接上下文；汉语通常不必把叙事连接词καί机械译成“并且”。
theological_decisions:
- issue: “那差我来的”所指为何
  choice: 保留隐含指称，不在正文中明说是父或神
  alternative: 那差我来的父／差我来的神
  rationale: 希腊文只用带冠词的分词短语。上下文可使读者理解其所指，但翻译不应比原文说得更明确。
- issue: “因我的名接纳孩子”的含义
  choice: 表达接纳与耶稣的名、身份和权柄有关
  alternative: 奉我的名接待／为了我的缘故接纳／因为孩子属于我而接纳
  rationale: ἐπὶ τῷ ὀνόματί μου可表示以其名为依据或因为其名。“因我的名”保留这种关系性与代表性，不把它缩减为一般善意。
- issue: 大小地位的悖论
  choice: 保留“最微小”与“大的”直接对照
  alternative: 最年轻的是伟大的／最谦卑的是最伟大的
  rationale: 原文以社会地位上的微小与“大”形成反转；不宜把年龄或内在谦卑作为唯一解释，也不应擅自加入最高级“最伟大”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“接纳”连续三次对应δέχομαι，以保存原句链式逻辑；“因我的名”较“奉我的名”更适合此处接纳行为的缘由或依据；末句用“这人才是大的”保留强调和悖论。
