source:
  edition: SBLGNT
  text: οἱ δὲ ὄχλοι γνόντες ἠκολούθησαν αὐτῷ. καὶ ⸀ἀποδεξάμενος αὐτοὺς ἐλάλει αὐτοῖς περὶ τῆς βασιλείας τοῦ θεοῦ, καὶ τοὺς χρείαν ἔχοντας θεραπείας ἰᾶτο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/011.yaml
  text: But the crowds[a], learning of it, followed him. And welcoming them, he was speaking to them about the kingdom of God and healing those who had need of healing.
translation:
  language: zh_hans
  text: 群众知道了，就跟随他。耶稣接待他们，向他们讲论上帝的国，也医治那些需要医治[a]的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“需要治疗（或照料）”。希腊语θεραπεία可指医治，也可指治疗或照料。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ὄχλοι
  choice: 群众
  rationale: ὄχλοι虽为复数，但现代汉语通常用集合名词“群众”自然表达多人群体；δέ在此主要承接并轻微转折，汉语语流无需机械译出“但”。
- source_word: γνόντες
  choice: 知道了
  rationale: 不定过去时分词在此表示先于跟随发生的情境动作；“知道了”自然保留其完成性，而所知内容可由上下文补足。
- source_word: ἠκολούθησαν αὐτῷ
  choice: 就跟随他
  rationale: “跟随他”既准确表达实际随行，也不排除福音书中可能具有的门徒语义回响；“就”呈现前后动作关系。
- source_word: ἀποδεξάμενος αὐτούς
  choice: 接待他们
  rationale: ἀποδέχομαι含欣然接受、欢迎之意；“接待”在此自然庄重，也体现耶稣没有拒绝前来的群众。
- source_word: ἐλάλει αὐτοῖς
  choice: 向他们讲论
  rationale: 未完成时表示持续进行；汉语“讲论”适合有关上帝国度的教导语境，句中并列结构已足以传达持续活动。
- source_word: περὶ τῆς βασιλείας τοῦ θεοῦ
  choice: 上帝的国
  rationale: 保留福音书核心术语“上帝的国”，兼顾其国度与掌权含义，不缩减为纯空间概念。
- source_word: τοὺς χρείαν ἔχοντας θεραπείας
  choice: 那些需要医治[a]的人
  rationale: 该短语直指有治疗、照料或医治需要的人；正文采用最合语境且自然的“需要医治”，脚注保留θεραπεία的词义宽度。
- source_word: ἰᾶτο
  choice: 医治
  rationale: 未完成时表示耶稣持续施行医治；现代汉语在与“讲论”并列时无须另加进行标记。
theological_decisions:
- issue: βασιλεία τοῦ θεοῦ的译法
  choice: 上帝的国
  alternative: 上帝的统治
  rationale: “上帝的国”是清楚、传统且可贯穿福音书的关键术语，同时在语义上仍可涵盖上帝掌权的动态含义。
- issue: θεραπείας与ἰᾶτο相邻造成的重复
  choice: 正文保留“需要医治……医治”所表达的同义关系
  alternative: 译作“需要治疗的人”或“需要照料的人”
  rationale: 原文名词θεραπεία与动词ἰάομαι并非同根，但语境明确关乎医治；不应仅为避免汉语重复而把前者限定为现代医疗意义上的“治疗”。脚注说明其可含治疗或照料。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。用“群众”而非生硬的复数形式；以“上帝的国”保持关键术语一致。正文力求自然，脚注保留θεραπεία的词义余地。
