  text: καὶ εἶπεν πρὸς αὐτούς· Μηδὲν αἴρετε εἰς τὴν ὁδόν, μήτε ⸀ῥάβδον μήτε πήραν μήτε ἄρτον μήτε ἀργύριον, μήτε ⸀ἀνὰ δύο χιτῶνας ἔχειν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/003.yaml
  text: And he said to them[a], “Take nothing for the journey—neither a staff, nor a bag, nor bread, nor money[c][b]; and do not have two tunics each.”
translation:
  language: zh_hans
  text: 他对他们说：“你们上路时，什么都不要带：不要带手杖、行囊[a]、饼或钱[b]，每人也不要有两件里衣[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “行囊”指旅行者装食物或其他用品的袋子。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“银”，这里指钱财。
    reason: lexical_alternative
  - marker: c
    text: 原文的表达强调逐人而言，即“每人两件里衣”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μηδὲν αἴρετε εἰς τὴν ὁδόν
  choice: 你们上路时，什么都不要带
  rationale: 按旅行嘱咐的语境，将εἰς τὴν ὁδόν自然译为“上路时”，并保留全面否定命令的力度。
- source_word: ῥάβδον
  choice: 手杖
  rationale: 此处指旅途中使用的杖；“手杖”在现代汉语中简洁明确。
- source_word: πήραν
  choice: 行囊
  rationale: πήρα指旅行者用来装载物品或食物的袋子；“行囊”既自然，也体现旅行语境。
- source_word: ἄρτον
  choice: 饼
  rationale: 保留ἄρτος所指的基本食物，不泛化为“食物”；“饼”符合圣经时代扁平面饼的语境。
- source_word: ἀργύριον
  choice: 钱
  rationale: 该词字面为“银”，在此实际指作为钱财使用的银币或银钱，正文译“钱”最自然。
- source_word: ἀνὰ δύο χιτῶνας ἔχειν
  choice: 每人也不要有两件里衣
  rationale: 明确表达ἀνά与数词构成的逐人分配义；依原文保留“有”，不擅自改成“带”。
- source_word: χιτῶνας
  choice: 里衣
  rationale: χιτών指贴身或内层穿着的长衣；“里衣”比现代化的“衬衫”更符合历史服饰，也比泛称“衣服”准确。
theological_decisions:
- issue: 命令是禁止携带第二件里衣，还是禁止拥有两件里衣
  choice: 每人也不要有两件里衣
  alternative: 每人不要带两件里衣
  rationale: 原文使用ἔχειν（有），而非前面的αἴρετε（带）；正文保留这种措辞差异，不把命令的范围静默限定为旅途中携带。
translation_notes:
  register: 采用现代、庄重而易懂的叙事与直接引语。“上路时”自然传达旅行语境；列举项保持紧凑平行。将χίτων译为“里衣”，兼顾历史准确性与普通读者的理解。
