  text: οἱ δὲ ἀποκριθέντες εἶπαν· Ἰωάννην τὸν βαπτιστήν, ἄλλοι δὲ Ἠλίαν, ἄλλοι δὲ ὅτι προφήτης τις τῶν ἀρχαίων ἀνέστη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/019.yaml
  text: And they answered[a], “John the Baptist; but others, Elijah; and others, that some prophet of the ancients has risen.”
translation:
  language: zh_hans
  text: 他们回答说：“是施洗者约翰；另有人说是以利亚；还有人说，是古时的一位先知兴起了[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“古时的一位先知复活了。”
    reason: ἀνέστη可指“兴起、起来”，在古代先知再次出现的语境中也可能指从死里复活；脚注保留这一可能性。
lexical_decisions:
- source_word: ἀποκριθέντες εἶπαν
  choice: 他们回答说
  rationale: 这是带有闪语色彩的分词加限定动词结构；“回答说”既符合现代汉语叙事习惯，也保留了回答并开口陈述的语气。
- source_word: Ἰωάννην τὸν βαπτιστήν
  choice: 施洗者约翰
  rationale: βαπτιστής是约翰的识别称号；“施洗者约翰”准确、通行，并比音译式宗派称谓更直接。
- source_word: ἄλλοι δὲ ... ἄλλοι δὲ
  choice: 另有人说……还有人说
  rationale: 用自然汉语呈现两次ἄλλοι δὲ所构成的并列与对照，同时明确这是群众中不同人的看法。
- source_word: Ἠλίαν
  choice: 以利亚
  rationale: 采用该先知姓名在现代简体中文圣经语境中的通行译名。
- source_word: προφήτης τις
  choice: 某位先知
  rationale: “某位”保留τις的不定意义，又适合指称一位身份未明的人。
- source_word: τῶν ἀρχαίων
  choice: 古时的
  rationale: 该复数属格指古代的人；结合“先知”，译作“古时的某位先知”自然地表达其中一位古代先知的意思。
- source_word: ἀνέστη
  choice: 复活了
  rationale: 在一位古代人物再次出现的语境中，此动词可以带有从死里起来的含义；“复活了”在汉语中清楚自然，另以脚注保留较宽泛的“起来”理解。
theological_decisions:
- issue: ἀνέστη是否应明确译为复活
  choice: 复活了
  alternative: 起来了／兴起了
  rationale: 上下文谈论古时先知如今再次出现，“复活了”符合这种理解，但ἀνίστημι本身也可较宽泛地表示起来或兴起，因此用脚注保留词义张力，不把另一理解排除。
translation_notes:
  register: 采用现代、庄重而口语顺畅的叙事表达。“另有人说……还有人说”清楚呈现群众的不同回答；标点帮助读者辨认三项并列内容。
