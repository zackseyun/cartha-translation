  yaml_path: translation/nt/luke/009/037.yaml
  text: On the next day[a], when they had come down from the mountain, a large crowd met him.
translation:
  language: zh_hans
  text: 第二天[a]，他们从山上下来时，有一大群人迎着他而来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“接下来的那一天”。
    reason: 词义备选；ἑξῆς指紧随前述事件的下一天。
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: （不另行明译）
  rationale: 该表达在这里主要承担叙事衔接功能。现代汉语可直接以“第二天”起句，既自然，也避免加入原文没有明确表达的“这时”或“后来”。
- source_word: τῇ ἑξῆς ἡμέρᾳ
  choice: 第二天
  rationale: 这是表示时间的与格结构，意为紧接着的下一天。“第二天”简洁自然，并保留与前文事件的时间联系。
- source_word: κατελθόντων αὐτῶν
  choice: 他们……下来时
  rationale: 属格独立结构提供主句的背景情形；不定过去时分词可指下山这一整体事件。“下来时”在汉语中自然，也不武断限定为已经完全下山之后。
- source_word: ἀπὸ τοῦ ὄρους
  choice: 从山上
  rationale: ὄρος在本叙事中指山；“从山上下来”是现代汉语中自然且准确的搭配。
- source_word: συνήντησεν αὐτῷ
  choice: 迎面遇见了他
  rationale: 动词可表示“遇见”或“前来迎接”。“迎面遇见”保留相向会合的意味，同时不把群众的意图过度明确化。
- source_word: ὄχλος πολύς
  choice: 一大群人
  rationale: 既表达ὄχλος所指的人群，也体现πολύς在此表示人数众多；符合现代汉语习惯。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“第二天”直接承接上下文；“一大群人”比“一大群群众”更自然。保留分词结构在时间关系上的适度开放性，不把它强行解释为“下山以后”或“正在下山途中”。
