  text: τί γὰρ ὠφελεῖται ἄνθρωπος κερδήσας τὸν κόσμον ὅλον ἑαυτὸν δὲ ἀπολέσας ἢ ζημιωθείς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/025.yaml
  text: For what does a man profit if he gains the whole world[a], but loses or forfeits himself?
translation:
  language: zh_hans
  text: 因为一个人即使赚得全世界，却失去自己，或赔上自己，又有什么益处呢？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί γὰρ ὠφελεῖται
  choice: 因为……又有什么益处呢
  rationale: 以自然的汉语反问句表达“得到什么益处”，并保留 γὰρ 对上文的解释、论证作用。
- source_word: ἄνθρωπος
  choice: 一个人
  rationale: 此处泛指任何人；现代汉语“一個人”既准确又自然，不额外限定性别。
- source_word: κερδήσας τὸν κόσμον ὅλον
  choice: 即使赚得全世界
  rationale: κερδαίνω 表示获得、赢得；“赚得”与后文“赔上”形成鲜明的得失对照。“即使”自然呈现分词在反问中的假设让步意味。
- source_word: ἑαυτὸν
  choice: 自己
  rationale: 原文使用反身代词，而非通常表示“生命”或“灵魂”的名词；直译为“自己”可保留其宽广的人论含义。
- source_word: ἀπολέσας
  choice: 失去
  rationale: 表达丧失、毁掉的基本意义，同时不擅自限定其具体方式。
- source_word: ἢ ζημιωθείς
  choice: 或赔上自己
  rationale: 保留 ἢ 的选择关系；ζημιόω 的被动形式表示遭受损失，“赔上”既与“赚得”呼应，也有使自身蒙受亏损的意味。
theological_decisions:
- issue: ἑαυτόν 所指的人之结局
  choice: 自己
  alternative: 自己的生命／自己的灵魂
  rationale: 原文并未使用 ψυχή，而是反身代词。译作“自己”避免把整个人缩减为肉身生命或非物质灵魂，并保留原文的神学张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“赚得……赔上”保留原句的得失修辞；“因为”连接上一节的论述。未加脚注，因为正文“自己”已直接而清楚地反映原文用词。
