  yaml_path: translation/nt/luke/009/015.yaml
  text: And they did so[a], and had them all sit down.
translation:
  language: zh_hans
  text: 他们就照着做了，让众人都坐下[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使众人都坐席”，也可较直译为“使众人都斜倚着”。希腊语动词指安排人以当时用餐的姿势就座，通常是斜倚着。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: 就
  rationale: 承接上一节的命令并推进叙事；现代汉语用“就”自然表达随即照办的关系。
- source_word: ἐποίησαν οὕτως
  choice: 照着做了
  rationale: οὕτως回指耶稣先前的吩咐；“照着做了”简洁自然，也保留“按所说的方式行”的含义。
- source_word: καὶ
  choice: （以逗号连接）
  rationale: 第二个καὶ连接随后发生的动作；汉语以逗号顺接更自然，无须重复译出“并且”。
- source_word: κατέκλιναν
  choice: 让……坐下
  rationale: 该使役动词指安排人以进餐姿势坐席或斜倚；“让……坐下”既保留使役含义，也符合现代汉语表达。
- source_word: ἅπαντας
  choice: 众人都
  rationale: 表达所有在场者，无一例外；“众人都”自然保留其全称范围。
