source:
  edition: SBLGNT
  text: καὶ ἰδοὺ πνεῦμα λαμβάνει αὐτόν, καὶ ἐξαίφνης κράζει, καὶ σπαράσσει αὐτὸν μετὰ ἀφροῦ καὶ ⸀μόγις ἀποχωρεῖ ἀπ’ αὐτοῦ συντρῖβον αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/039.yaml
  text: and look[a], a spirit seizes him, and suddenly he cries out, and it convulses him with foaming, and it scarcely departs from him, crushing him.
translation:
  language: zh_hans
  text: 看哪[a]，一个灵抓住他，他突然喊叫；那灵使他抽搐，口吐白沫，好不容易才离开他，仍不断伤害他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一个邪灵”或“一个鬼”；希腊文这里只说“一个灵”。
    reason: 说明原文πνεῦμα未带“邪恶”或“污秽”等限定；替代译法是根据上下文作出的理解。
lexical_decisions:
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 作为引人注意的话语标记，保留父亲叙述中的现场感；“看哪”庄重而仍可为现代读者理解。
- source_word: πνεῦμα
  choice: 一个灵
  rationale: 原文只说“灵”，没有明说“污灵”或“鬼”；正文保留其词义层面的不确定性。
- source_word: λαμβάνει
  choice: 抓住
  rationale: 表达该灵突然制伏并控制孩子的强烈动作，比泛泛的“取得”自然准确。
- source_word: ἐξαίφνης κράζει
  choice: 他就突然喊叫
  rationale: 保留副词所表达的突发性，并按希腊语中自然承接的主语把喊叫者理解为孩子，不改写为更具解释性的“使他喊叫”。
- source_word: σπαράσσει αὐτὸν
  choice: 那灵使他抽搐
  rationale: 在此发作语境中，“使他抽搐”清楚传达剧烈痉挛；补出“那灵”使中文主语明确，而不改变希腊语所指。
- source_word: μετὰ ἀφροῦ
  choice: 口吐白沫
  rationale: 以现代汉语惯用表达呈现抽搐伴随起沫的症状，意思清楚自然。
- source_word: μόγις ἀποχωρεῖ ἀπ’ αὐτοῦ
  choice: 几乎不肯离开他
  rationale: μόγις 可表示勉强、艰难或几乎不；“几乎不肯”自然传达该灵难以离去或迟迟不离的意味，同时未把它绝对化为从不离开。
- source_word: συντρῖβον αὐτόν
  choice: 把他折磨得遍体鳞伤
  rationale: συντρίβω 在此表示严重伤害、摧残；该译法传达持续发作给孩子造成的重创，又避免直译“压碎”所可能造成的死亡或骨骼粉碎误解。
theological_decisions:
- issue: 是否在正文中明确把 πνεῦμα 认定为邪灵或鬼
  choice: 一个灵
  alternative: 邪灵；鬼
  rationale: 上下文表明这是敌对的超自然存在，但本节希腊文只用 πνεῦμα。正文不越过原文的明确程度，脚注说明语境中可能的理解。
- issue: μόγις 是否表示该灵很少离开，还是艰难、勉强地离开
  choice: 几乎不肯离开他
  alternative: 好不容易才离开他；很少离开他
  rationale: 该副词在句中容许“勉强/难以”与“几乎不”的语义张力；所选译文保留其难以离开的力度，而不明确裁定是在说离开的频率。
- issue: 分词 συντρῖβον 与离开动作的关系
  choice: 把他折磨得遍体鳞伤
  alternative: 离开时还重重伤害他
  rationale: 现在分词可描写伴随或持续的伤害，并不必然限定为离开瞬间发生；译文保持关联而不强加精确时序。
translation_notes:
  register: 采用现代、庄重且口语可懂的叙述体。“看哪”保留原文的突显作用；其余措辞避免古奥，也不使用过度临床化的术语。
