  rationale: 修订以“好不容易才离开他”对应μόγις，避免把其解释为离开的频率或明言其主观不愿；以“仍不断伤害他”对应现在分词συντρίβον，保留其与离开动作相连的持续伤害意味，却不加入“遍体鳞伤”的具体伤情。其余措辞保留草稿对原文语序、突发性和术语层级的忠实处理。
