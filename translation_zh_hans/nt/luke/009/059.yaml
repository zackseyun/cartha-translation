  text: εἶπεν δὲ πρὸς ἕτερον· Ἀκολούθει μοι. ὁ δὲ εἶπεν· ⸀Κύριε, ἐπίτρεψόν μοι ⸂ἀπελθόντι πρῶτον⸃ θάψαι τὸν πατέρα μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/059.yaml
  text: Then he said to another[a], “Follow me.” But he said, “Lord, permit me first to go and bury my father.”
translation:
  language: zh_hans
  text: 耶稣又对另一个人说：“跟从我。”那人却说：“主啊，请准我先去安葬我的父亲。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕτερον
  choice: 另一个人
  rationale: ἕτερος表示“另一个、别的”；上下文所指为人，汉语补出“人”更自然，并未进一步限定其身份。
- source_word: Ἀκολούθει μοι
  choice: 跟从我
  rationale: ἀκολουθέω在门徒语境中不只是随行，也有作门徒的意味；“跟从我”既符合现代汉语，也保留这一含义。现在时命令语气在此不必刻意译成“继续跟从”。
- source_word: Κύριε
  choice: 主啊
  rationale: κύριε既可作为尊称，也可能带有更深的基督论分量；“主啊”保留这种张力，不将其弱化为单纯的“先生”。
- source_word: ἐπίτρεψόν μοι
  choice: 请准我
  rationale: 该表达是请求许可；“请准我”简洁、恭敬，也与对耶稣的直接称呼相称。
- source_word: ἀπελθόντι πρῶτον
  choice: 先去
  rationale: 分词ἀπελθόντι与πρῶτον表示在安葬之前先离开去办此事。“先去”自然表达动作次序；不译作“回去”，以免加入原文未明说的返回含义。
- source_word: θάψαι τὸν πατέρα μου
  choice: 安葬我的父亲
  rationale: θάπτω意为埋葬、安葬。“安葬”在现代汉语中庄重自然，准确表达为父亲办理葬事。
theological_decisions:
- issue: 对耶稣的称呼κύριος如何翻译
  choice: 主
  alternative: 先生／夫子
  rationale: 叙事中的称呼既可能表达恭敬，也可能具有基督论意味。“主”保留两者之间的张力，不把含义限定为一般社交敬称。
- issue: “安葬父亲”是否解释为父亲尚未去世时的长期奉养义务
  choice: 不在正文中解释
  alternative: 译成“等我父亲去世并安葬他”
  rationale: 原文只说“安葬我的父亲”，并未交代父亲是否已经去世。正文保持原有含混，避免把一种文化背景解释写进经文。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“耶稣”依据明确的叙事主语补出，避免汉语中连续使用“他”造成指代含混；“却”体现δέ在请求与命令之间的转折。无必要设置脚注；英文咨询层所给脚注的标记位置与内容不相符，且其备选译法在汉语中不构成需要说明的实质差异。
