  yaml_path: translation/nt/luke/009/008.yaml
  text: and by some[a], that Elijah had appeared, and by others, that a prophet of the ancients had risen.
translation:
  language: zh_hans
  text: 又有人说，是以利亚显现了；另有人说，是一位古时的先知复活了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπό τινων ... ἄλλων
  choice: 另一些人说……还有一些人说
  rationale: 原文承接上一节，省略了“说”；汉语补出“说”，并用“另一些……还有一些……”自然呈现不同人的说法。
- source_word: Ἠλίας
  choice: 以利亚
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: ἐφάνη
  choice: 显现了
  rationale: 表达“出现、变得可见”，并与后句表示起来或复活的 ἀνέστη 区分。
- source_word: προφήτης τις τῶν ἀρχαίων
  choice: 古时的一位先知
  rationale: τις 表示不确定的一位，τῶν ἀρχαίων 指古时的人；此译自然且不把原文强行限定为一个明确封闭群体中的“其中之一”。
- source_word: ἀνέστη
  choice: 复活了
  rationale: 在此语境中指古时的先知从死里起来；“复活”以自然中文保留其复生含义，而不擅自改成被动式“被使复活”。
theological_decisions:
- issue: 古时先知之说的性质
  choice: 复活了
  alternative: 起来了；又出现了；被使复活了
  rationale: 上下文中的 ἀνέστη 带有从死里起来的含义。“复活了”明确保留群众所传说的复生主张，但不表示叙述者认可该主张，也不指定是哪一位先知。
translation_notes:
  register: 使用现代、庄重而口语可懂的叙事表达。以分号区分并列传闻，补出原文承前省略的“说”。脚注标记置于整节末尾，对应其中相关短语。
