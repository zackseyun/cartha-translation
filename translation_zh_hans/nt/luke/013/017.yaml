  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ταῦτα λέγοντος αὐτοῦ κατῃσχύνοντο πάντες οἱ ἀντικείμενοι αὐτῷ, καὶ πᾶς ὁ ὄχλος ἔχαιρεν ἐπὶ πᾶσιν τοῖς ἐνδόξοις τοῖς γινομένοις ὑπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/017.yaml
  text: And as he was saying these things[a], all who were opposing him were put to shame[b], and the whole crowd was rejoicing over all the glorious things being done by him.
translation:
  language: zh_hans
  text: 耶稣说这些话的时候，所有反对他的人[a]都蒙了羞；全体群众却因他所做的一切荣耀之事[b]而欢喜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “所有反对他的人”也可译作“他所有的对头”。
    reason: lexical_alternative
  - marker: b
    text: “荣耀之事”也可译作“奇妙的事”或“辉煌的事”。原文用的是一个含义较宽的表达，可包括他所行的大能之事。
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα λέγοντος αὐτοῦ
  choice: 耶稣说这些话的时候
  rationale: 用时间从句表达属格独立结构与现在分词所表示的同时进行关系；明确主语为耶稣，使现代汉语自然清楚。
- source_word: κατῃσχύνοντο
  choice: 都蒙了羞
  rationale: 保留被动含义和公开受辱、难堪的语气，比单纯的“感到羞愧”更贴近原文。
- source_word: οἱ ἀντικείμενοι αὐτῷ
  choice: 所有反对他的人
  rationale: 保留分词的动作性，表明这些人正处于反对耶稣的立场和行动中，而不只给他们一个静态称谓。
- source_word: πᾶς ὁ ὄχλος
  choice: 全体群众
  rationale: 自然表达单数集合名词及 πᾶς 所强调的整体性。
- source_word: ἔχαιρεν
  choice: 而欢喜
  rationale: “欢喜”准确表达喜乐；上下文和句式可自然呈现未完成过去时所描写的持续反应，无须添加原文没有的程度副词。
- source_word: ἐπὶ πᾶσιν τοῖς ἐνδόξοις
  choice: 因……一切荣耀之事
  rationale: “因”表达 ἐπί 加与格在此所指的欢喜缘由；“荣耀之事”保留 ἔνδοξος 的宽广含义，不把它限定为神迹。
- source_word: τοῖς γινομένοις ὑπ’ αὐτοῦ
  choice: 他所做的
  rationale: 以自然汉语表达正在由耶稣施行之事，并保留 ὑπό 加属格所表明的施事者。
theological_decisions:
- issue: “荣耀之事”的性质
  choice: 译作“一切荣耀之事”
  alternative: 一切奇妙的事；一切神奇的事
  rationale: 上下文包括医治和耶稣公开得到的印证，但 ἐνδόξοις 本身含义较宽，可指荣耀、显赫或令人赞叹之事。宽译可避免把经文限定为神迹。
- issue: ὑπ’ αὐτοῦ 所表达的施事关系
  choice: 译作“他所做的”
  alternative: 借着他成就的
  rationale: 原文直接把这些事归于耶稣的施行；“他所做的”准确表达施事关系，也不额外引入较间接的工具性含义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“蒙了羞”保留公开受挫的被动意味；用分号和“却”清楚呈现反对者与群众两种反应之间的对照。所有脚注标记均置于其所说明的词语之后。
