  verdict: revise
  source_fidelity: 译文准确保留了哀哭、切齿、看见族长和众先知在神的国里，以及听者被强行排除在外的对照。惟“就会哀哭切齿”将希腊文的非人称存在句“在那里必有……”略改为以“你们”为隐含主语的结果句；虽不致误译，但可更贴近原文句法与强调。
  naturalness: 原句基本通顺，但“在那里，当……时，就会……”的句首地点状语与“就会”结构略显牵连不清。改为“在那里，必有……；当……的时候”更符合庄重、自然的现代汉语圣经语体。
  terminology: “哀哭切齿”“神的国”“亚伯拉罕、以撒、雅各”均准确且合乎既有圣经汉语惯用语。“被赶到外面”充分表达ἐκβαλλομένους ἔξω的被动、强制排除和界外位置。
