  text: ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων, ὅταν ⸀ὄψησθε Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ καὶ πάντας τοὺς προφήτας ἐν τῇ βασιλείᾳ τοῦ θεοῦ, ὑμᾶς δὲ ἐκβαλλομένους ἔξω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/028.yaml
  text: There will be weeping and gnashing of teeth there[a], when you see Abraham and Isaac and Jacob and all the prophets in the kingdom of God[c][b], but you yourselves thrown out.
translation:
  language: zh_hans
  text: 在那里，必有哀哭切齿；当你们看见亚伯拉罕、以撒、雅各和所有的先知都在神的国里，自己却被赶到外面[a]的时候。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被赶到外面”：原文的被动分词与“外面”连用，强调被强行排除在外。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖ
  choice: 在那里
  rationale: 保留地点副词，指向被排除在外之处；置于句首也对应希腊文的强调位置。
- source_word: ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων
  choice: 哀哭切齿
  rationale: 这是现代中文圣经语体中自然、凝练而准确的表达，保留痛苦与愤怒的具体意象。
- source_word: ὅταν ὄψησθε
  choice: 当你们看见……时
  rationale: ὅταν加不定过去时虚拟语气在这里指向一个具体的未来场景；中文用“当……时”自然呈现。
- source_word: πάντας τοὺς προφήτας
  choice: 所有的先知
  rationale: 明确保留πάντας“所有”的范围，不仅以集合称谓“众先知”含蓄表达。
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: 在神的国里
  rationale: 保留“神的国”这一核心圣经用语；“里”使处所关系在现代中文中清楚自然。
- source_word: ὑμᾶς δὲ
  choice: 自己却
  rationale: “自己”体现显明代词ὑμᾶς的对比强调，“却”表达δέ在两组人之间的鲜明反差。
- source_word: ἐκβαλλομένους ἔξω
  choice: 被赶到外面
  rationale: “被赶”保留ἐκβάλλω的被动和强制排斥意味，“到外面”明确呈现ἔξω所表达的界外位置。
theological_decisions:
- issue: 审判场景中被排除与痛苦的性质
  choice: 保留“被赶到外面”和“哀哭切齿”的具体图像，不进一步解释其系统神学含义。
  alternative: 释义为“遭受最终定罪”或“陷入极度悲伤”。
  rationale: 本节清楚描写人被排除在神的国之外及随之而来的痛苦，却没有在本句中完整界定终末审判的性质；译文应保留原文张力而不作扩充。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“哀哭切齿”和“神的国”延续广为人知的圣经表达；全句调整为中文自然的“当……时，就……”结构，同时保留原文开头“在那里”的地点强调和末尾两方处境的强烈对比。
