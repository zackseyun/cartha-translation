  text: ⸀Καὶ πάλιν εἶπεν· Τίνι ὁμοιώσω τὴν βασιλείαν τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/020.yaml
  text: And again he said, “To what shall I compare the kingdom of God?”
translation:
  language: zh_hans
  text: 他又说：“我该把上帝的国比作什么呢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: 又
  rationale: 与πάλιν合并为自然的汉语叙事衔接“又”，既承接上文，也表达重复，不机械译作“并且”。
- source_word: πάλιν
  choice: 又
  rationale: 表示再次说话；现代汉语用“又说”最自然、简洁。
- source_word: εἶπεν
  choice: 他说
  rationale: 叙事中的不定过去时在此引出直接引语，译作“说”准确自然；主语依上下文补作“他”。
- source_word: Τίνι
  choice: 什么
  rationale: 中性单数疑问代词在ὁμοιόω的比较结构中询问比较对象，指事物而非人物。
- source_word: ὁμοιώσω
  choice: 我该……比作
  rationale: 形式上是将来时直陈语气，但此处用于自问式、商议式疑问；“我该……比作”自然保留这种修辞语气。
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: 上帝的国
  rationale: “上帝的国”是现代汉语中自然且广为理解的圣经用语，同时保留βασιλεία可涵盖王权、统治及国度的语义宽度。
theological_decisions:
- issue: 比喻语境中βασιλεία τοῦ θεοῦ的译法
  choice: 上帝的国
  alternative: 上帝的统治
  rationale: 原短语既可突出上帝施行王权，也可指其国度；“上帝的国”不把含义缩窄为仅仅动态的统治，并与关键术语的一贯译法相符。
translation_notes:
  register: 采用现代、庄重而口语自然的直接引语。“我该把……比作什么呢？”符合普通读者的表达习惯，并保留原文的自问式修辞；本节无须脚注。
