id: LUK.13.33
reference: Luke 13:33
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: πλὴν δεῖ με σήμερον καὶ αὔριον καὶ τῇ ἐχομένῃ πορεύεσθαι, ὅτι οὐκ ἐνδέχεται προφήτην ἀπολέσθαι ἔξω Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/033.yaml
  text: Nevertheless[a], I must go on my way today and tomorrow and the next day[b], because it is not possible for a prophet to perish outside Jerusalem.
translation:
  language: zh_hans
  text: 不过，我今天、明天和后天[b]必须继续前行，因为先知不可能[a]死在耶路撒冷以外。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不可能”也可理解为“不能”或“难以想象”，这里可能带有反讽意味。
    reason: lexical_alternative
  - marker: b
    text: “今天、明天和后天”可能是习用说法，指一段短暂而确定的行程，不一定严格指三个日历日。
    reason: cultural_note
lexical_decisions:
- source_word: πλὴν
  choice: 不过
  rationale: 承接上文并表达强烈的转折或限定；“不过”自然、庄重，又不显得过度书面。
- source_word: δεῖ με
  choice: 我……必须
  rationale: 保留δεῖ所表达的必要性，同时不擅自把这种必要性明确解释为神圣命定或一般处境所迫。
- source_word: σήμερον καὶ αὔριον καὶ τῇ ἐχομένῃ
  choice: 今天、明天和后天
  rationale: 清楚保留原文三段递进的时间表达；“后天”是现代汉语对“接下来的一天”的自然说法。
- source_word: πορεύεσθαι
  choice: 继续前行
  rationale: 既表达行走、上路，也在语境中体现行程仍要持续，比单说“走”更完整。
- source_word: ὅτι
  choice: 因为
  rationale: 直接呈现其引出理由的功能。
- source_word: οὐκ ἐνδέχεται
  choice: 不可能
  rationale: 保留原文关于不可能、不合常情或不可设想的张力；正文采用简洁直译，脚注说明其语用范围。
- source_word: προφήτην
  choice: 先知
  rationale: 希腊文无冠词，具有泛指和格言式色彩；汉语裸名词“先知”自然表达这一点。
- source_word: ἀπολέσθαι
  choice: 死
  rationale: 此处涉及先知遭遇死亡；“死”是现代汉语自然、明确的表达，同时不强行限定为被杀或毁灭。
- source_word: ἔξω Ἰερουσαλήμ
  choice: 在耶路撒冷以外
  rationale: 准确保留空间关系，也容许读者理解为城外或离开耶路撒冷之处。
theological_decisions:
- issue: 先知不可能死在耶路撒冷以外这一陈述的力度
  choice: 正文译作“不可能”，保留表面的不可能性陈述及其中可能具有的反讽。
  alternative: 可译为“不能”“不会”或“难以想象”，更突出惯例、反讽或不合常情。
  rationale: οὐκ ἐνδέχεται既可指不可能，也可表达不合情理或不可设想。正文不把它解释成绝对的形而上命题，也不直接改写为纯粹讽刺。
- issue: “必须”的必要性来源
  choice: 只译出“必须”，不在正文中明说是神的命定。
  alternative: 可扩译为“按神的旨意，我必须”，明确解释为神圣必要性。
  rationale: δεῖ在路加著作中常带有神圣计划的意味，但本句本身没有明说来源；保留原文的神学含蓄更为妥当。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“继续前行”适合耶稣行程的语境；“死”比“灭亡”更自然，也避免后者在现代汉语中可能引出的额外末世论含义。所有脚注标记均置于其直接说明的短语之后。
