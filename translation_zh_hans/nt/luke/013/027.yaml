  text: καὶ ἐρεῖ ⸀λέγων ὑμῖν· Οὐκ ⸀οἶδα πόθεν ἐστέ· ἀπόστητε ἀπ’ ἐμοῦ, πάντες ⸀ἐργάται ἀδικίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/027.yaml
  text: And he will say to you[a], ‘I do not know where you are from. Depart from me[c][b], all you workers of unrighteousness.’
translation:
  language: zh_hans
  text: 他必对你们说[a]：‘我不知道你们是从哪里来的。你们这些作不义之事的人，都离开我！[b]’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文的主要动词为“他必说”，后接同源分词“说”；这种重复性引语引介在汉语中合并表达。
    reason: source_form
  - marker: b
    text: “作不义之事的人”也可译作“作恶的人”或“行不法之事的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρεῖ λέγων ὑμῖν
  choice: 他必对你们说
  rationale: ἐρεῖ是“说”的将来时，λέγων是同源分词，构成闪语式的重复表达。现代汉语不宜机械译成“他必说着对你们说”，因此合并为自然的引语引介句，同时用脚注保留原文形式。
- source_word: οὐκ οἶδα
  choice: 我不知道
  rationale: 按οἶδα的基本义直译为“不知道”，不将语境中可能含有的“不认识”或“不承认与你们有关系”直接写入正文。
- source_word: πόθεν ἐστέ
  choice: 你们是从哪里来的
  rationale: πόθεν表示来源或出处；“是从哪里来的”是自然现代汉语，也保留了原句关于来源的表达。
- source_word: ἀπόστητε ἀπ’ ἐμοῦ
  choice: 离开我吧
  rationale: ἀπόστητε是命令式，要求明确地远离；“离开我吧”简洁、有力度，其中“吧”在此表达命令而非犹疑。
- source_word: πάντες ἐργάται ἀδικίας
  choice: 你们这一切作不义之事的人
  rationale: πάντες修饰受呼语的ἐργάται；“你们这一切……的人”显明全体受话者。ἐργάται在此指持续从事或施行某事的人，译作“作……之事的人”比字面“工人”自然。
- source_word: ἀδικίας
  choice: 不义
  rationale: ἀδικία涵盖不义、不公和恶行；“不义”保留其宽广的道德与神学含义，也避免误加原文没有明确出现的“律法”概念。
theological_decisions:
- issue: 审判宣告中ἀδικίας的译法
  choice: 不义
  alternative: 不法；恶事；邪恶
  rationale: “不义”最贴近ἀδικία，并保留它与“义”这一概念的对照。“不法”容易使读者以为原文特指违反律法，“恶事”则较为意译。正文不进一步限定其具体范围，以保留原文广泛的谴责。
- issue: οὐκ οἶδα所表达的关系含义
  choice: 我不知道
  alternative: 我不认识；我不承认你们
  rationale: 语境可能暗含拒绝承认关系，但原文使用普通的“知道”一词。直译可保留陈述本身的张力，不把语用含义提升为明说的解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。引语中的“离开我吧”保持审判命令的力度；“你们这一切作不义之事的人”避免把ἐργάται生硬译成职业意义的“工人”，同时保留对全体受话者的直接谴责。
