source:
  edition: SBLGNT
  text: ταύτην δὲ θυγατέρα Ἀβραὰμ οὖσαν, ἣν ἔδησεν ὁ Σατανᾶς ἰδοὺ δέκα καὶ ὀκτὼ ἔτη, οὐκ ἔδει λυθῆναι ἀπὸ τοῦ δεσμοῦ τούτου τῇ ἡμέρᾳ τοῦ σαββάτου;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/016.yaml
  text: And ought not this woman, being a daughter of Abraham, whom Satan bound for eighteen years—look—be released from this bond on the Sabbath day?
translation:
  language: zh_hans
  text: 而这个女人本是亚伯拉罕的女儿，撒但捆绑了她；看哪，已有十八年了，难道不应当在安息日从这捆绑中得释放吗？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θυγατέρα Ἀβραὰμ
  choice: 亚伯拉罕的女儿
  rationale: 保留原文的亲属身份表达；在语境中既指出她属于亚伯拉罕的后裔，也带有盟约群体身份的意味，而不在正文中进一步解释。
- source_word: ἔδησεν / λυθῆναι / δεσμοῦ
  choice: 捆绑 / 解开 / 捆绑
  rationale: 保留原文贯穿全句的束缚与释放意象，并使三个同源语义彼此呼应。
- source_word: ἰδού
  choice: 看哪
  rationale: 明确译出原文的引人注意语，保留其强调作用；采用庄重而仍可理解的现代圣经语体。
- source_word: δέκα καὶ ὀκτὼ ἔτη
  choice: 整整十八年
  rationale: 译出十八年的持续时长；“整整”自然传达原句中强调这一漫长期限的语气。
- source_word: οὐκ ἔδει
  choice: 难道不应当
  rationale: 用期待肯定回答的反问表达原文的必要性和道义分量。
- source_word: τῇ ἡμέρᾳ τοῦ σαββάτου
  choice: 在安息日
  rationale: 以现代汉语自然表达时间，语义完整，无须机械译作“在安息日这一天”。
theological_decisions:
- issue: “亚伯拉罕的女儿”的含义
  choice: 直译为“亚伯拉罕的女儿”
  alternative: 亚伯拉罕的后裔
  rationale: 直译保留了血缘、群体归属及潜在盟约含义之间的丰富性，避免只限定为生物学后裔。
- issue: 撒但与疾病的关系
  choice: 保留“撒但捆绑了她”的直接陈述
  alternative: 她因撒但而患病
  rationale: 原文明言撒但是实施捆绑者；译文不削弱这一表述，也不扩展为关于所有疾病来源的普遍教义。
- issue: 安息日释放的必要性
  choice: 译为期待肯定回答的反问
  alternative: 她必须在安息日得释放
  rationale: 保留耶稣原话的修辞形式以及其中关于安息日适宜施行释放的论证，不改写成脱离语境的命令。
translation_notes:
  register: 采用自然、庄重、适合朗读的现代标准汉语。“何况”承接上下文由牲畜得解开饮水到这位女人更应得释放的对比；“看哪”保留 ἰδού 的显性强调。句中分为两句，以避免汉语长句负担，同时维持原文论证推进。
