- from: 何况这个女人本是亚伯拉罕的女儿，撒但捆绑了她整整十八年。看哪，难道不应当在安息日解开她的捆绑吗？
  to: 而这个女人本是亚伯拉罕的女儿，撒但捆绑了她；看哪，已有十八年了，难道不应当在安息日从这捆绑中得释放吗？
  rationale: 以“而”避免将δὲ过度具体化为“何况”；将“看哪”置于十八年之前，并以“从这捆绑中得释放”对应原文的介词短语及被动式。未增添对疾病、撒但或亚伯拉罕身份的解释。
