id: LUK.13.21
reference: Luke 13:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁμοία ἐστὶν ζύμῃ, ἣν λαβοῦσα γυνὴ ⸀ἔκρυψεν εἰς ἀλεύρου σάτα τρία ἕως οὗ ἐζυμώθη ὅλον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/021.yaml
  text: It is like leaven[c][b][a], which a woman took and hid in three measures of flour until it was all leavened.
translation:
  language: zh_hans
  text: 它好比面酵[a]：一个女人把面酵拿来，藏进三细亚[c]面粉里，直到整团面都发起来[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “面酵”指使面团发起来的酵种，也可译作“酵母”；这里不是专指现代商品酵母。
    reason: lexical_alternative
  - marker: b
    text: “藏”也可按制面的语境理解为“掺进”或“和进”；希腊原文直译是“藏、隐藏”。
    reason: lexical_alternative
  - marker: c
    text: “细亚”是古代的干量单位；三细亚是相当大的一份面粉。
    reason: cultural_note
lexical_decisions:
- source_word: ὁμοία ἐστὶν
  choice: 它好比
  rationale: 以现代汉语自然的比喻句式表达谓语形容词结构；“它”承接上文所说的上帝的国。
- source_word: ζύμῃ
  choice: 面酵
  rationale: 指使面团发酵的酵种，既符合古代烘焙背景，也保留本段的核心比喻；脚注说明现代常用说法。
- source_word: λαβοῦσα γυνὴ
  choice: 有一个女人拿来
  rationale: 将前置的不定过去时分词按汉语叙事顺序处理，并保留人物的不定指意义。
- source_word: ἔκρυψεν
  choice: 藏
  rationale: 保留希腊词“隐藏、藏入”的具体意象，不直接释为“掺进”或“和进”，以免抹去原文措辞。
- source_word: εἰς ἀλεύρου σάτα τρία
  choice: 在三细亚面粉里
  rationale: 保留古代容量单位“细亚”，避免用并不精确对应的现代单位替代；数量背景放入脚注。
- source_word: ἕως οὗ ἐζυμώθη ὅλον
  choice: 直到面全都发起来
  rationale: 自然表达被动发酵过程，并保留ὅλον所强调的整体性。
theological_decisions:
- issue: 面酵在比喻中的象征意义
  choice: 中性地保留“面酵”的形象，不在译文中说明其象征是正面还是负面
  alternative: 明确解释为上帝之国隐秘而全面的扩展，或依据其他经文将酵解释为负面事物
  rationale: 本节本身只陈述比喻及面酵遍及全体的结果；翻译不应把跨经文的象征体系或特定神学判断加入正文。
- issue: ἔκρυψεν的比喻张力
  choice: 译作“藏”
  alternative: 按实际制面过程意译为“掺进”或“和进”
  rationale: “藏”保留原文较突出的动词和潜在的隐秘性，同时在脚注交代语境中的自然理解，不把解释直接写入正文。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“面酵”保留圣经意象，并以脚注帮助不熟悉该词的读者；“细亚”保留古代计量背景，不以可能造成虚假精确感的现代容量换算进入正文。
