  text: κἂν μὲν ποιήσῃ καρπὸν ⸂εἰς τὸ μέλλον— εἰ δὲ μήγε,⸃ ἐκκόψεις αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/009.yaml
  text: And if it bears fruit in the future—well and good; but if not[a], you will cut it down.
translation:
  language: zh_hans
  text: 如果它今后结出果子，那就罢了；不然，你就把它砍掉。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κἂν μὲν
  choice: 如果
  rationale: κἄν（καί + ἐάν）引出条件，μέν与后面的δέ形成对照。汉语用“如果……；不然……”自然表达这一条件和转折；句首连接意由上下文承接，无须生硬加“并且”。
- source_word: ποιήσῃ καρπὸν
  choice: 结了果子
  rationale: ποιέω与καρπός连用，意为“结果子”。“结了果子”既符合现代汉语的园艺表达，也保留比喻意象。
- source_word: εἰς τὸ μέλλον
  choice: 以后
  rationale: 原文较宽泛地指向将来的时间，并未在本节明确说“明年”。“以后”简洁自然，也保留时间范围未被具体限定的特点。
- source_word: εἰ δὲ μήγε
  choice: 不然
  rationale: 这是对前一条件的否定性转折；“不然”自然涵盖“但如果不结果”的意思，并保持原文的简洁。
- source_word: ἐκκόψεις αὐτήν
  choice: 你就把它砍掉
  rationale: ἐκκόπτω在果树语境中指砍除或砍倒。“砍掉”准确保留园艺动作；“它”自然指前文的无花果树。
theological_decisions:
- issue: 园主延后处置的时间范围
  choice: 正文译作“以后”，不明确限定为“明年”
  alternative: 译作“明年”，根据上一节“今年”的语境补足具体时限
  rationale: 本节的εἰς τὸ μέλλον本身只表达将来的时间，未明确重述“一年”或“明年”。保留较宽泛的措辞，可避免把上下文推知的具体时间直接写入正文，同时仍呈现暂缓处置与随后审判的张力。
- issue: 条件句前半句省略的结果表达
  choice: 补作“就罢了”
  alternative: 保留悬而未决的句式：“如果它以后结了果子——；不然……”
  rationale: 希腊文在“结了果子”之后省略了显而易见的肯定结果。现代汉语若完全照留会显得残缺；“就罢了”以最少补充传达“那便可以”的含义，而不额外说明园主将采取什么行动。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“结了果子”“砍掉”保持园艺场景的具体性；“就罢了”自然补出希腊文条件句中省略的肯定结果，但不扩展其神学含义。
