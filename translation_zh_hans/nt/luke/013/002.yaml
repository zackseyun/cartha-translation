  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ⸀ἀποκριθεὶς εἶπεν αὐτοῖς· Δοκεῖτε ὅτι οἱ Γαλιλαῖοι οὗτοι ἁμαρτωλοὶ παρὰ πάντας τοὺς Γαλιλαίους ἐγένοντο, ὅτι ⸀ταῦτα πεπόνθασιν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/002.yaml
  text: And answering, he said to them, “Do you think that these Galileans became sinners beyond all the Galileans, because they have suffered these things?”
translation:
  language: zh_hans
  text: 耶稣回答他们说：“你们以为这些加利利人遭受这样的事，是因为他们比所有其他加利利人罪更重吗？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: 回答他们说
  rationale: 符合现代汉语叙事习惯，也准确表达这一常见希腊语答话结构。
- source_word: ἁμαρτωλοὶ παρὰ πάντας τοὺς Γαλιλαίους
  choice: 比所有其他加利利人罪更重
  rationale: παρά在比较结构中表示程度上的超过；这里询问的不是他们是否成为罪人，而是是否比同乡更有罪。中文用“罪更重”自然传达比较含义。
- source_word: ταῦτα πεπόνθασιν
  choice: 遭受这样的事
  rationale: 保留完成时所指的既成苦难及其当前关联，不擅自具体说明事件细节。
- source_word: ἐγένοντο
  choice: 是
  rationale: 在此作系词性用法，与ἁμαρτωλοί构成“显得/证明是更有罪的人”的判断。直译“成为”容易误导为苦难使他们变成罪人；中文以“是”准确表达语境中的身份判断。
theological_decisions:
- issue: 灾祸是否证明受害者罪更重
  choice: 保留耶稣以反问挑战这一推断的措辞
  alternative: 将问题直接改写为否定陈述
  rationale: 原文在本节仍是疑问句，应保留其修辞形式，不提前代入下一节的明确否定。
- issue: ἐγένοντο是否表示他们后来“成为”罪人
  choice: 按系词性语境译为“罪更重”
  alternative: “成了比所有加利利人更有罪的人”
  rationale: 这里比较的是受难者与其他加利利人的罪责，不是在断言其罪人身份产生了时间性变化；避免因机械直译而引入苦难使人成为罪人的神学含义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“所有其他加利利人”明确排除已经提到的“这些加利利人”，符合汉语比较表达。主语补出“耶稣”，承接上下文并避免汉语中的指代含混。
