    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦν δὲ διδάσκων
  choice: 耶稣正在……教导人
  rationale: εἰμί的未完成时与现在分词διδάσκων构成迂回未完成时，表示过去正在持续的行动。希腊文省略主语，按上下文明确补出“耶稣”；δέ在此作轻微的叙事衔接，中文无需另译。
- source_word: ἐν μιᾷ τῶν συναγωγῶν
  choice: 在一所会堂里
  rationale: 保留部分结构“其中一所”的意义，但现代汉语用“一所会堂”自然表达；“会堂”准确指当时犹太人的特定聚会与敬拜场所。
- source_word: ἐν τοῖς σάββασιν
  choice: 有一个安息日
  rationale: σάββασιν虽为复数形式，在通用希腊语中常按习语表示单数的安息日。结合这一具体事件，译作“有一个安息日”自然地交代时间，并以脚注保留形态上的复数可能。
