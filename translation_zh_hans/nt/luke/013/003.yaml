id: LUK.13.3
reference: Luke 13:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οὐχί, λέγω ὑμῖν, ἀλλ’ ἐὰν μὴ μετανοῆτε πάντες ⸀ὁμοίως ἀπολεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/003.yaml
  text: No, I tell you; but unless you change your thinking, you will all likewise perish.
translation:
  language: zh_hans
  text: 不！我告诉你们，你们若不悔改，也都要同样灭亡。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “同样”也可译作“照样”。这里可能是指同样面临突然而来的审判，不一定表示死亡方式完全相同。
    reason: 说明ὁμοίως的比较范围存在真实歧义，避免读者误以为必指完全相同的死法。
lexical_decisions:
- source_word: οὐχί
  choice: 不！
  rationale: 以简洁而有力的否定回应上文隐含的判断；感叹号体现语气强度，却不额外增添意义。
- source_word: λέγω ὑμῖν
  choice: 我告诉你们
  rationale: 符合现代汉语表达，并保留耶稣直接面向听众的强调语气。
- source_word: ἀλλ’ ἐὰν μὴ
  choice: 你们若不
  rationale: 汉语条件句中“若不”自然表达带否定条件的“除非”；转折关系可由前句强烈否定及后续警告清楚呈现，无须生硬加入“但是”。
- source_word: μετανοῆτε
  choice: 悔改
  rationale: 该词在此指人在上帝面前思想、态度与方向的转变；“悔改”是现代中文中准确、凝练且广为理解的对应词，不把含义缩减为纯粹改变想法。
- source_word: πάντες
  choice: 都
  rationale: 保留警告适用于全体听众的周延范围。
- source_word: ὁμοίως
  choice: 同样
  rationale: 保留与上文事件的比较，同时不强行限定为完全相同的死亡方式。
- source_word: ἀπολεῖσθε
  choice: 灭亡
  rationale: 既能表达遭受毁灭、走向败亡的严重后果，又不把所指范围限定为肉身死亡或明确界定为永恒定罪。
theological_decisions:
- issue: “灭亡”的范围
  choice: 译作“灭亡”，不进一步限定其具体性质
  alternative: 死亡；被毁灭；遭受永恒定罪
  rationale: 本节确实发出审判警告，但希腊词本身在此没有明确规定灭亡的方式与最终范围；保留其严肃性及神学张力更忠于原文。
- issue: “悔改”的含义
  choice: 采用“悔改”，兼含思想、态度与人生方向的转变
  alternative: 改变想法；回转
  rationale: 仅译为“改变想法”容易使读者误解为纯理性上的重新考虑；“悔改”较完整地传达该语境中人在上帝面前的回应，又不加入特定宗派定义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“不！”保留开头否定的力度；全句按自然汉语条件句组织，并以“悔改”“灭亡”保留原文的道德、属灵分量和未被明确限定的审判含义。
