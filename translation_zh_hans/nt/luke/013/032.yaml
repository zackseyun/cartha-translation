revisions:
- from: 他对他们说：“你们去告诉那只狐狸：‘看哪，今天、明天，我赶出鬼魔，施行医治；到了第三天，我就得以完成[a]。’”
  to: 他对他们说：“你们去告诉那只狐狸：‘看哪，我今天、明天赶出鬼，施行医治；到了第三天，我就被带到完成[a]。’”
  rationale: 修订仅处理两处汉语表达：“鬼魔”改为更自然且足以对应δαιμόνια的“鬼”；“得以完成”改为“被带到完成”，使被动关系和“完成”的对象未明说这两项原文特征在汉语中更可辨识。其余句法、比喻、时间序列及神学开放性均予保留。
