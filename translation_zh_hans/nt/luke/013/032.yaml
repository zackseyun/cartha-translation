  text: καὶ εἶπεν αὐτοῖς· Πορευθέντες εἴπατε τῇ ἀλώπεκι ταύτῃ· Ἰδοὺ ἐκβάλλω δαιμόνια καὶ ἰάσεις ⸀ἀποτελῶ σήμερον καὶ αὔριον, καὶ τῇ τρίτῃ τελειοῦμαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/032.yaml
  text: And he said to them[a], “Go and tell that fox, ‘Look, I cast out demons and accomplish healings today and tomorrow, and on the third day I am brought to completion.’”
translation:
  language: zh_hans
  text: 他对他们说：“你们去告诉那只狐狸：‘看哪，我今天、明天赶出鬼，施行医治；到了第三天，我就被带到完成[a]。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我就达到终点”、“我就被成全”，或“我就走完我的路程”。希腊文可表示被带到完成或达到终局；这里很可能指耶稣受命之工作的完成。
    reason: 说明τελειοῦμαι的词义范围及其被动形式，同时避免在正文中把它仅限定为某一种神学解释。
lexical_decisions:
- source_word: ἀλώπεκι ταύτῃ
  choice: 那只狐狸
  rationale: 按动物名称直译，并保留指示词的轻蔑语气；不把其隐含的狡猾、卑劣等意味直接写入正文。
- source_word: Ἰδοὺ
  choice: 看哪
  rationale: 作为引人注意的提示语，既保留原文的指示功能，也符合庄重而通行的现代汉语圣经语体。
- source_word: ἐκβάλλω δαιμόνια
  choice: 我赶出鬼魔
  rationale: “赶出鬼魔”是现代汉语中清楚自然的表达，也保留ἐκβάλλω所含的驱逐力度。
- source_word: ἰάσεις ἀποτελῶ
  choice: 施行医治
  rationale: ἰάσεις指医治之事，ἀποτελῶ有实施、成就之意；“施行医治”在汉语中自然，并与前句“赶出”保持动词上的区别。
- source_word: σήμερον καὶ αὔριον
  choice: 今天、明天
  rationale: 保留原文两个时间词及其可能表示一段短而确定时期的开放性，不另加解释。
- source_word: τῇ τρίτῃ
  choice: 到了第三天
  rationale: 明确表达时间性的与格结构，同时保持“三日”说法可能具有的象征或预示意味。
- source_word: τελειοῦμαι
  choice: 我就得以完成
  rationale: 保留τελειόω的完成、达到终局之义，并以“得以”反映其被动形式；不在正文中明确补出是使命、路程、受难或复活被完成。
theological_decisions:
- issue: τελειοῦμαι是否明确指耶稣使命的完成，或特指他的受死与复活
  choice: 译作“我就得以完成”，保留被带到完成、达到终局的含义
  alternative: 我就达到终点；我就被成全；我就走完我的路程
  rationale: 这句话可能预示耶稣受死及其后的得胜，也可能概括他受命之工作的完成；原文并未在此明确限定所指，因此正文不把其中的神学张力化约为某一事件。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“那只狐狸”保留比喻而不加释义；“今天、明天……第三天”维持原文节奏；末句略带非日常的凝练感，是为保留原文被动形式与所指的开放性。
