  yaml_path: translation/nt/luke/013/013.yaml
  text: And he laid his hands on her, and immediately she was made straight again, and she glorified God.
translation:
  language: zh_hans
  text: 他把双手按在她身上；她立刻直起腰来[a]，就赞美上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“她被扶直了”或“她站直了”。
    reason: 保留 ἀνωρθώθη 的被动结果及其可表达的状态性译法，同时采用自然的现代汉语。
lexical_decisions:
- source_word: ἐπέθηκεν αὐτῇ τὰς χεῖρας
  choice: 把双手按在她身上
  rationale: 这是按手动作的自然汉语表达。“双手”对应复数 τὰς χεῖρας，物主关系按汉语习惯由主语自然表明。
- source_word: παραχρῆμα
  choice: 立刻
  rationale: 准确传达事情随即发生的突然性，且简洁自然。
- source_word: ἀνωρθώθη
  choice: 直起腰来
  rationale: 结合上文女子弯腰的身体状况，这一表达自然呈现她恢复直立的结果；不额外加入原文没有明说的“再次”。脚注保留被动式和状态式译法。
- source_word: ἐδόξαζεν
  choice: 赞美
  rationale: 在此处表示她因得医治而把荣耀归给上帝。“赞美上帝”是现代汉语中自然、庄重的表达；叙事中的未完成时可理解为她随即持续作出的反应。
- source_word: τὸν θεόν
  choice: 上帝
  rationale: 作为 ἐδόξαζεν 的直接宾语，采用现代标准汉语中清楚、通行的称谓。
theological_decisions:
- issue: ἀνωρθώθη 所描述的医治结果
  choice: 直起腰来
  alternative: 被挺直了；恢复了直立
  rationale: 上下文明确涉及女子身体弯曲、不能直起腰来，因此主文表达身体恢复直立，但不进一步解释医治的机制。脚注保留希腊语被动形式可能体现的译法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“把双手按在她身上”具体自然；分号体现动作与即时结果之间的紧密推进。
