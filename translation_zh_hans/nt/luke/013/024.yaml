revisions:
- from: 你们要竭力从窄门[a]进去；因为我告诉你们，将来有许多人想要进去，却不能。
  to: 你们要竭力从窄门[a]进去，因为我告诉你们，许多人将要寻求进去，却不能。
  rationale: 修订仅将“想要进去”改为“寻求进去”，以反映ζητέω而不把它混同于前面的ἀγωνίζεσθε；同时校正脚注对路加与马太不同希腊词的词汇说明。原文对于人之努力与最终不能进入之间的张力仍予保留，未加入任何教义性解释。
