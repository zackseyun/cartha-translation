  text: Ἀγωνίζεσθε εἰσελθεῖν διὰ τῆς στενῆς ⸀θύρας, ὅτι πολλοί, λέγω ὑμῖν, ζητήσουσιν εἰσελθεῖν καὶ οὐκ ἰσχύσουσιν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/024.yaml
  text: Strive to enter through the narrow door[a], because many, I tell you, will seek to enter and will not be able.
translation:
  language: zh_hans
  text: 你们要竭力从窄门[a]进去，因为我告诉你们，许多人将要寻求进去，却不能。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“从窄的门进入”。路加原文所用的希腊词通常指“门”；《马太福音》的平行经文则使用另一个通常指“门、城门”的词。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγωνίζεσθε
  choice: 要竭力
  rationale: 该现在时命令语气表达持续、认真而迫切的努力。“要竭力”自然有力，又不把这种努力解释为功德。
- source_word: εἰσελθεῖν
  choice: 进去
  rationale: 两次均译作“进去”，符合现代汉语，也保留原文用词的一致性。
- source_word: διὰ τῆς στενῆς θύρας
  choice: 从窄门
  rationale: θύρα通常指门；“从……进去”自然表达διά在此所指的经过路径。στενῆς译作“窄”，保留空间意象及其隐喻张力。
- source_word: ὅτι
  choice: 因为
  rationale: 明确保留该词引出理由的因果关系。
- source_word: πολλοί
  choice: 有许多人
  rationale: 准确表达形容词作名词使用，并符合汉语句法。
- source_word: λέγω ὑμῖν
  choice: 我告诉你们
  rationale: 这是现代汉语中自然、庄重的说法，准确传达话语公式。
- source_word: ζητήσουσιν
  choice: 将来……想要
  rationale: ζητέω在此表示寻求、意图进入；译作“想要”避免与前面的“竭力”混同，同时以“将来”体现将来时。
- source_word: οὐκ ἰσχύσουσιν
  choice: 却不能
  rationale: 简洁表达没有能力做到；“却”清楚呈现想进去与不能进去之间的反差。
theological_decisions:
- issue: 人的努力与救恩语言
  choice: 保留“要竭力”的强烈命令，同时不补充有关功德或行为得救的解释。
  alternative: 译作“要尽力”或“要努力”，以较弱语气表达。
  rationale: 原文本身把迫切努力的命令与许多人最终不能进去的警告并置。译文应保留这种神学张力，不代为解决神的主权、人的责任或功德问题。
- issue: “想要进去”与“竭力进去”的关系
  choice: 用不同措辞分别表达ζητέω与ἀγωνίζομαι。
  alternative: 将ζητήσουσιν译作“努力”或“试图”，使两者更接近。
  rationale: 原文使用不同动词；保留词义差别可以避免断言那些人努力的程度或其失败的具体原因。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“竭力”保留命令的迫切感；句中使用分号，使命令与理由的关系清晰。脚注只说明词汇差异，不把《马太福音》的措辞带入路加原文。
