  naturalness: 原句整体庄重自然。将“想要进去”改为“寻求进去”虽稍带正式书面语色彩，却适合经文体，且在现代普通话中可理解；“将来”改置于“许多人”之后的谓语前，语序更紧凑。
  terminology: “窄门”正确保留路加所用θύρα（门），不应在正文改作“窄门口”或“窄城门”。脚注原称马太所用词为“门口、城门”不够准确；该词可指门、城门，且脚注应清楚说明路加与马太用词不同。
