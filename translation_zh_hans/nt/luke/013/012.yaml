  source_fidelity: 主句与引语的基本意义均已传达；但“叫她过来”比προσεφώνησεν更明确地加入了移动、召到近前的含义。该动词首先是“呼唤／招呼／向……说话”，虽可在语境中带有召唤意味，却不必明说“过来”。ἀσθένεια在这里指这女子实际的身体苦况，主译“疾病”合乎上下文；脚注保留其“软弱、病弱”等较宽范围。
  naturalness: “病弱”作为现代汉语名词搭配不够自然；“从病弱中得释放”也略显生硬。“疾病”在本节叙事语境中更自然、明晰。“妇人”虽有传统经文语感，但在现代普通话的当面称呼中较不自然；“女士”可传达γύναι直接而礼貌的称呼，且不加入身份信息。
  terminology: 将Γύναι译为“女士”，避免“妇人”的当代生硬感，同时维持敬称。将ἀπολέλυσαι译作“已经从……中得释放了”，保留完成时所表达的已成事实及被动意义；不明说施动者。
