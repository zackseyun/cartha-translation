  text: ἰδὼν δὲ αὐτὴν ὁ Ἰησοῦς προσεφώνησεν καὶ εἶπεν αὐτῇ· Γύναι, ἀπολέλυσαι τῆς ἀσθενείας σου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/012.yaml
  text: But when Jesus saw her[a], he called her over and said to her, “Woman, you are freed from your weakness.”
translation:
  language: zh_hans
  text: 耶稣看见她，就叫她来，对她说：“女士，你已经从你的疾病[a]中得释放了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“软弱”或“病弱”。
    reason: 原文ἀσθένεια可指软弱、衰弱或疾病；本段上下文指这女子的身体苦况，故正文译为“疾病”，脚注保留较宽的语义范围。
lexical_decisions:
- source_word: ἰδὼν δὲ αὐτὴν ὁ Ἰησοῦς
  choice: 耶稣看见她，就
  rationale: 不定过去时分词在此自然表达先于主句的动作；用“看见……就……”简明保留事件次序。δέ主要推动叙事，汉语无需机械译作“但是”。
- source_word: προσεφώνησεν
  choice: 叫她过来
  rationale: 该动词可指向某人呼喊、招呼或直接发话；结合场景，译作“叫她过来”自然体现耶稣主动召唤她，但不增添语气色彩。
- source_word: Γύναι
  choice: 妇人
  rationale: 保留尊重而直接的称呼；“妇人”较“女人”庄重，也不额外加入“夫人”所带的社会身份意味。
- source_word: ἀπολέλυσαι
  choice: 你已经……得释放了
  rationale: 这是完成时被动形式，表达释放已经发生且结果持续至今；“已经……得释放了”兼顾完成性、被动性和当前状态。
- source_word: τῆς ἀσθενείας σου
  choice: 从病弱中
  rationale: 上下文明确涉及使人衰弱的身体疾患；“病弱”既反映病患语境，又保留ἀσθένεια所含“软弱、衰弱”的较宽语义范围。
theological_decisions:
- issue: ἀσθένεια所指状况的性质
  choice: 病弱
  alternative: 软弱；疾病；残疾
  rationale: 上下文表明这是身体上的长期苦况，但原词并非现代医学诊断。“病弱”既符合语境，也避免把它限定为特定疾病或现代残障类别。
- issue: ἀπολέλυσαι的完成时被动语气
  choice: 你已经从……中得释放了
  alternative: 你脱离了……；你被释放了
  rationale: 保留被动表达和完成时所强调的现今结果，不明确补出施动者，也不把这句话改写成单纯命令或愿望。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“妇人”保留经文称呼的直接与尊重；“得释放”略带经文语体，但能清楚呈现原文的完成时被动意义。
