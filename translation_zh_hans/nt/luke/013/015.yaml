  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀δὲ αὐτῷ ὁ κύριος καὶ εἶπεν· Ὑποκριταί, ἕκαστος ὑμῶν τῷ σαββάτῳ οὐ λύει τὸν βοῦν αὐτοῦ ἢ τὸν ὄνον ἀπὸ τῆς φάτνης καὶ ⸀ἀπαγαγὼν ποτίζει;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/015.yaml
  text: But the Lord answered him and said[a], “Hypocrites! Does not each of you on the Sabbath untie his ox or donkey from the feeding trough and lead it away to water it?”
translation:
  language: zh_hans
  text: 主回答他说[a]：“假冒为善的人哪！你们每一个人在安息日，不是都会把自己的牛或驴从食槽边解开，牵去饮水吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“马槽”。希腊语φάτνη可以指牲畜进食之处或食槽。
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: 主
  rationale: 保留路加叙事中用于耶稣的称号及其基督论分量，不降格译作“主人”。
- source_word: Ὑποκριταί
  choice: 假冒为善的人哪
  rationale: 这是复数呼格的直接斥责；此译法在现代汉语中清楚而有力度，并以“哪”表现当面呼告。
- source_word: ἕκαστος ὑμῶν
  choice: 你们每一个人
  rationale: 保留逐一分配的语义，强调听众人人都有这种做法。
- source_word: τῷ σαββάτῳ
  choice: 在安息日
  rationale: 自然表达时间性与犹太安息日背景。
- source_word: λύει
  choice: 解开
  rationale: 语境是把拴在食槽附近的牲畜解开；“解开”既准确又符合现代汉语。
- source_word: βοῦν
  choice: 牛
  rationale: βοῦς可泛指牛类牲畜；中文“牛”自然准确，不强行限定为阉牛。
- source_word: ὄνον
  choice: 驴
  rationale: 现代汉语中对应这种家畜的常用词。
- source_word: φάτνης
  choice: 食槽边
  rationale: φάτνη指牲畜进食之处或食槽；介词ἀπό表示从那里解开，汉语加“边”能自然呈现牲畜拴在食槽旁的情景，而不把词义转成畜栏。
- source_word: ἀπαγαγὼν
  choice: 牵去
  rationale: 简洁呈现先解开、再带离的动作顺序，也符合牵引牲畜的汉语习惯。
- source_word: ποτίζει
  choice: 饮水
  rationale: 在“牵去”之后用目的性表达，意为带牲畜去喝水；简洁自然，并保留供其饮水的含义。
theological_decisions:
- issue: 叙事者以κύριος称耶稣
  choice: 主
  alternative: 主人
  rationale: “主”保留路加叙事称号可能具有的基督论分量，同时不在译文中作额外解释。
- issue: Ὑποκριταί的复数指向范围
  choice: 假冒为善的人哪
  alternative: 你这假冒为善的人哪
  rationale: 原文为复数，耶稣虽回答会堂主管，却把斥责指向一群人；因此必须保留复数，不缩窄为单数对象。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事语言。反问句用“不是都会……吗”传达希腊文οὐ所预期的肯定回答；保留原文对众人的尖锐斥责与安息日论证。
