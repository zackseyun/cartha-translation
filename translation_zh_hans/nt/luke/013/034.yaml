source:
  edition: SBLGNT
  text: Ἰερουσαλὴμ Ἰερουσαλήμ, ἡ ἀποκτείνουσα τοὺς προφήτας καὶ λιθοβολοῦσα τοὺς ἀπεσταλμένους πρὸς αὐτήν— ποσάκις ἠθέλησα ἐπισυνάξαι τὰ τέκνα σου ὃν τρόπον ὄρνις τὴν ἑαυτῆς νοσσιὰν ὑπὸ τὰς πτέρυγας, καὶ οὐκ ἠθελήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/034.yaml
  text: Jerusalem[a], Jerusalem, the one killing the prophets and stoning those sent to her—how often I wanted to gather your children the way a hen gathers her brood under her wings[b], and you were not willing.
translation:
  language: zh_hans
  text: 耶路撒冷啊，耶路撒冷啊！你杀害先知，又用石头打死那些受差遣到你这里来的人[a]——我曾多少次愿意聚集你的儿女，就像母鸡把自己的一窝小鸡聚拢在翅膀底下[b]，可是你们不愿意。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文用现在时分词描述耶路撒冷，以她惯常怎样对待受差遣者来刻画她；也可译作“你这杀害先知、又用石头打死那些受差遣到你这里来的人的城”。
    reason: lexical_alternative
  - marker: b
    text: “母鸡”所译的希腊词也可泛指“鸟”；不过，这里把幼雏聚拢在翅膀下的母性图景，以“母鸡”来表达最为自然。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰερουσαλὴμ Ἰερουσαλήμ
  choice: 耶路撒冷啊，耶路撒冷啊
  rationale: 保留地名的重复和呼语语气，传达哀叹与强调。
- source_word: ἡ ἀποκτείνουσα τοὺς προφήτας καὶ λιθοβολοῦσα
  choice: 你杀害先知，又用石头打死
  rationale: 两个现在时分词刻画耶路撒冷一贯的行为；译成并列动词，使现代汉语自然，同时保留鲜明而严厉的指控。
- source_word: τοὺς ἀπεσταλμένους πρὸς αὐτήν
  choice: 那些受差遣到你这里来的人
  rationale: 保留完成时被动分词的被动含义，不在正文中补明差遣者。
- source_word: ποσάκις ἠθέλησα
  choice: 我曾多少次愿意
  rationale: “多少次”表达反复发生，“愿意”保留 θέλω 的意愿含义，并与末句同词根的“不愿意”形成对应。
- source_word: ἐπισυνάξαι τὰ τέκνα σου
  choice: 聚集你的儿女
  rationale: “聚集”自然表达集合在一起的意思；“儿女”保留对耶路撒冷作为母城的拟人称呼，不限定具体所指。
- source_word: ὃν τρόπον ὄρνις
  choice: 就像母鸡
  rationale: ὄρνις 可泛指鸟，但结合把幼雏护在翅膀下的母性图景，“母鸡”是此处最自然、具体的表达；较宽泛的可能性收入脚注。
- source_word: τὴν ἑαυτῆς νοσσιὰν ὑπὸ τὰς πτέρυγας
  choice: 把自己的一窝小鸡聚拢在翅膀底下
  rationale: “一窝小鸡”表达 νοσσιά 的集体含义；汉语补出“聚拢”，承接前面的 ἐπισυνάξαι，使省略结构清楚自然。
- source_word: καὶ οὐκ ἠθελήσατε
  choice: 可是你们不愿意
  rationale: “可是”自然显明意愿上的强烈反差；“你们”保留希腊文由单数城市称呼转为复数对象的显著变化。
theological_decisions:
- issue: “你的儿女”的所指
  choice: 保留“你的儿女”这一母城拟人说法
  alternative: 明确译作“耶路撒冷的居民”或“以色列民”
  rationale: 原文没有进一步限定这些儿女究竟专指城中居民，还是泛指由耶路撒冷所代表的百姓；译文不替文本消除这一开放性。
- issue: θέλω／ἠθελήσατε 的意愿对照
  choice: 译为“我……愿意……你们不愿意”
  alternative: “我想要……你们却不肯”
  rationale: 重复“愿意”保留原文同一词根造成的意愿对照，又不据此扩展为关于神意与人意关系的系统性结论。
- issue: 单数耶路撒冷与复数拒绝者之间的转换
  choice: 前文用单数“你”，末句用复数“你们”
  alternative: 全句统一使用“你”或“你们”
  rationale: 希腊文先把耶路撒冷当作一位母亲来称呼，末尾却转用复数动词指向拒绝的人群；保留这一转换，以免预先判定两者关系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以两个“啊”和破折号保留哀叹的呼喊与停顿；“用石头打死”清楚表达 λιθοβολέω 的致死性动作；末句刻意保留单数“你”转为复数“你们”的原文张力。
