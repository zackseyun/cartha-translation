  text: καὶ ἥξουσιν ἀπὸ ἀνατολῶν καὶ δυσμῶν καὶ ⸀ἀπὸ βορρᾶ καὶ νότου καὶ ἀνακλιθήσονται ἐν τῇ βασιλείᾳ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/029.yaml
  text: And they will come from east and west[a], and from north and south, and will recline at table in the kingdom of God.
translation:
  language: zh_hans
  text: 人们将从东、西、北、南而来，并在上帝的国里坐席[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文动词在宴席语境中更具体地指斜倚用餐。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥξουσιν
  choice: 将……而来
  rationale: ἥκω的将来时在这里表示“来、来到”；与随后四方来源的表达自然衔接。
- source_word: ἀπὸ ἀνατολῶν καὶ δυσμῶν
  choice: 从东从西
  rationale: 复数形式字面指“日出之处”和“日落之处”，在此是东西方位的惯用表达；译为“从东从西”简洁自然。
- source_word: ἀπὸ βορρᾶ καὶ νότου
  choice: 从北从南
  rationale: 延续四方汇聚的地理表达；与“从东从西”形成自然、庄重的排比。
- source_word: ἀνακλιθήσονται
  choice: 坐席
  rationale: ἀνακλίνω在宴席语境中指按当时习俗斜倚用餐。现代汉语“坐席”既能表达入席赴宴，又比直译“斜倚”自然，并保留宴席图景。
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: 在上帝的国里
  rationale: 直接保留“上帝的国”这一核心表达，不将其释义化或加入原文未明说的教义内容。
theological_decisions:
- issue: 末世国度中的宴席图景
  choice: 译作“坐席”，保留赴宴并有席位的具体图景
  alternative: 坐下；斜倚席上；进入上帝的国
  rationale: 原动词在此含宴席语境。译作“坐席”既避免把图景淡化为单纯“进入”，也避免以不自然的“斜倚”妨碍现代读者理解。
- issue: 来自四方之人的范围
  choice: 只译出“从东从西、从北从南”，不在正文限定其族群身份
  alternative: 明确译作外族人或万国的人
  rationale: 四个方向表明广泛汇聚，但本节本身没有明说“外族人”；应保留其广度而不越过原文作身份判定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“人们”补明希腊语动词所含的复数主语，但不指定族群；“从东从西、从北从南”保留原文排比和四方汇聚之感。“坐席”是现代汉语中自然的宴席表达，脚注补充其历史文化动作。
