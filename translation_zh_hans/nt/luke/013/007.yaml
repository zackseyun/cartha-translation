id: LUK.13.7
reference: Luke 13:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς τὸν ἀμπελουργόν· Ἰδοὺ τρία ἔτη ⸂ἀφ’ οὗ⸃ ἔρχομαι ζητῶν καρπὸν ἐν τῇ συκῇ ταύτῃ καὶ οὐχ εὑρίσκω· ⸀ἔκκοψον αὐτήν· ἱνατί καὶ τὴν γῆν καταργεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/007.yaml
  text: Then he said to the vine-dresser[a], ‘Look, for three years now I have come seeking fruit on this fig tree and have found none. Cut it down. Why should it even keep using up the ground?’
translation:
  language: zh_hans
  text: 于是，他对管葡萄园的人说：“你看，我这三年来一直到这棵无花果树上找果子，却一直找不到。把它砍掉！何必还让它白占土地呢？[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“何必还让它使土壤失去效用呢？”希腊文动词不仅可表示徒然占用土地，也可含有使土地无用、不能出产的意思。
    reason: 词义存在可合理保留的差异；正文采用自然的语境译法，脚注呈现较强的使役含义。
lexical_decisions:
- source_word: ἀμπελουργόν
  choice: 管葡萄园的人
  rationale: 指耕作、照管葡萄园的人；这一表达准确保留葡萄园背景，也比专业色彩较浓的“葡萄栽培者”更自然易懂。
- source_word: Ἰδοὺ
  choice: 你看
  rationale: 保留引起对方注意的强调作用，同时符合现代汉语对话习惯。
- source_word: τρία ἔτη ἀφ’ οὗ
  choice: 这三年来
  rationale: 表达从过去延续至今的三年时段，简洁自然。
- source_word: ἔρχομαι ζητῶν
  choice: 我来……找
  rationale: 保留“来”与“寻找”的动作；结合“三年来”和“一直”，自然传达反复寻找的情形。
- source_word: καρπὸν
  choice: 果子
  rationale: 按比喻中的农业场景直译，不把属灵解释提前写入正文。
- source_word: συκῇ
  choice: 无花果树
  rationale: 该词在此明确指无花果树。
- source_word: οὐχ εὑρίσκω
  choice: 却一直找不到
  rationale: 希腊文使用现在时；“一直找不到”既保留当前结果，也与三年来反复寻找的语境相合。
- source_word: ἔκκοψον
  choice: 把它砍掉吧
  rationale: 直接表达砍倒并除去树木的命令；“吧”使现代汉语中的命令语气自然，但不削弱其明确性。
- source_word: ἱνατί
  choice: 何必
  rationale: 在反问句中自然表达“为什么还要”的意思，体现说话者认为继续保留它没有理由。
- source_word: καὶ
  choice: 还
  rationale: 体现附加或递进意味：这树不但不结果，还对土地造成负担。
- source_word: γῆν
  choice: 土地
  rationale: 符合园地的农业语境，并可同时涵盖地面空间和土壤资源。
- source_word: καταργεῖ
  choice: 白占
  rationale: 在树木不结果的语境中，自然表达徒然占用土地、使土地不能发挥生产作用；原词更强的“使无用或失去生产力”含义则在脚注中保留。
theological_decisions:
- issue: 比喻意象与明确释义
  choice: 正文保留无花果树、果子和土地等农业意象，不直接解释其属灵所指。
  alternative: 在译文中直接写成属灵的不结果或审判。
  rationale: 原文以比喻叙述，让读者从上下文理解其神学意义；译文不应把某一解释嵌入经文本身。
- issue: καταργεῖ 对土地作用的力度
  choice: 正文译作“白占土地”，脚注注明也可能强调使土壤无用或失去生产力。
  alternative: 正文直接译作“使土地荒废”或“使土壤失去生产力”。
  rationale: 该动词在此既可按实际效果理解为徒占土地，也可突出使土地不能产生效益；用正文与脚注共同保留这一词义张力。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事语体。“管葡萄园的人”清楚保留场景；园主的话简洁直接。“你看”和“何必”符合现代普通读者的表达习惯。脚注标记置于相关反问句之后，避免误指前面的职业称谓。
