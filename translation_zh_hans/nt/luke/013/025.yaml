source:
  edition: SBLGNT
  text: ἀφ’ οὗ ἂν ἐγερθῇ ὁ οἰκοδεσπότης καὶ ἀποκλείσῃ τὴν θύραν, καὶ ἄρξησθε ἔξω ἑστάναι καὶ κρούειν τὴν θύραν λέγοντες· ⸀Κύριε, ἄνοιξον ἡμῖν· καὶ ἀποκριθεὶς ἐρεῖ ὑμῖν· Οὐκ οἶδα ὑμᾶς πόθεν ἐστέ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/025.yaml
  text: Once the master of the house has risen and shut the door[a], and you begin to stand outside and knock on the door, saying, ‘Lord, open to us,’ then he will answer you, ‘I do not know you[c][b], where you are from.’
translation:
  language: zh_hans
  text: 一旦家主起身关上门，你们便开始站在外面敲门，说：“主啊[a]，给我们开门吧！”他就会回答你们：“我不知道你们是从哪里来的。[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “主”在这个比喻的场景中也可译作“主人”或“先生”。
    reason: alternative_reading
  - marker: b
    text: 希腊语原文在“知道”后明确带有“你们”一词，随后接“从哪里来”的从句。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφ’ οὗ ἂν
  choice: 一旦
  rationale: 这一结构引出时间未定的从句，意为“当……以后／一旦……”。“一旦”在现代汉语中自然地表达后续行动以家主关门为界。
- source_word: ἐγερθῇ
  choice: 起身
  rationale: 这里指从坐着或躺卧的姿势起来，并非复活；“起身”准确且符合庄重叙事语体。
- source_word: ὁ οἰκοδεσπότης
  choice: 家主
  rationale: 该词指掌管一家的人。“家主”简洁保留其对房屋及家中事务的权柄，不仅强调产权。
- source_word: ἀποκλείσῃ τὴν θύραν
  choice: 关上门
  rationale: 动词表示关闭、隔绝；“关上门”自然，并由上下文清楚传达门外之人被拒于门外。
- source_word: ἄρξησθε ἔξω ἑστάναι
  choice: 你们就会开始站在外面
  rationale: 保留“开始”和站在外面的持续状态；“就会”自然承接“一旦”所引出的时间关系。
- source_word: κρούειν τὴν θύραν
  choice: 敲门
  rationale: 这是现代汉语中对应敲击门以求开启的标准表达，不夸大为猛烈捶门。
- source_word: Κύριε
  choice: 主啊
  rationale: 保留 κύριος 的常规译法及路加叙事中可能具有的神学回响，同时以脚注说明比喻场景中的一般称呼义。
- source_word: ἄνοιξον ἡμῖν
  choice: 给我们开门吧
  rationale: 原文直译为“向我们打开”，汉语需补出语境中明确的“门”；“给我们开门”自然表达请求，语气词“吧”体现祈求口吻。
- source_word: ἀποκριθεὶς ἐρεῖ
  choice: 他却会回答你们
  rationale: 分词加限定动词的叙事结构自然合译为“回答”；“却”呈现请求与拒绝之间的转折。
- source_word: Οὐκ οἶδα ὑμᾶς πόθεν ἐστέ
  choice: 我不知道你们是从哪里来的
  rationale: 此译保留“你们”及来源问句，在现代汉语中通顺表达原句；脚注列出更贴近希腊语表层结构的译法，以保留其措辞张力。
theological_decisions:
- issue: 比喻中 κύριε 的称呼含义
  choice: 主啊
  alternative: 主人／先生
  rationale: 说话者是在比喻中称呼家主，因此该词可作一般尊称；但译作“主”既符合 κύριος 的通常对应，也保留路加文本可能形成的更广神学回响，而不强行限定其所指。
- issue: οὐκ οἶδα ὑμᾶς πόθεν ἐστέ 的句法张力
  choice: 我不知道你们是从哪里来的
  alternative: 我不认识你们，不知道你们从哪里来
  rationale: 希腊语同时出现“你们”和“从哪里来”的成分。正文采用自然汉语的间接问句，不把它武断拆成两个独立断言；脚注保留较直译的形式。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“家主”保留原词的权柄色彩；人物直接引语简洁自然。正文避免为了流畅而完全抹去末句的希腊语张力，并以脚注提供其较直译形式。
