  text: Καὶ διεπορεύετο κατὰ πόλεις καὶ κώμας διδάσκων καὶ πορείαν ποιούμενος εἰς ⸀Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/022.yaml
  text: And he was traveling through towns and villages[a], teaching and making his way toward Jerusalem.
translation:
  language: zh_hans
  text: 耶稣经过各城各村，沿途教导，向耶路撒冷前行。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “向耶路撒冷前行”也可译作“前往耶路撒冷”。
    reason: 保留εἰς既可突出行进方向、也可直接标明目的地的表达空间。
lexical_decisions:
- source_word: διεπορεύετο
  choice: 走过
  rationale: 未完成时描写持续进行的行程；结合“各城各村”，译作“走过”自然地表达沿途经过多个地方。
- source_word: κατὰ πόλεις καὶ κώμας
  choice: 各城各村
  rationale: κατά加宾格在此具有逐处经过的分布意味；“各城各村”简洁保留较大城镇与较小村庄的区别。
- source_word: διδάσκων
  choice: 一边教导
  rationale: 现在分词表示旅途中同时进行的活动；“一边”使汉语句法自然，又不增添教导对象或内容。
- source_word: πορείαν ποιούμενος
  choice: 前行
  rationale: 该短语表示行进、赶路；“前行”传达持续而有方向的行程，避免生硬直译为“作行程”。
- source_word: εἰς Ἱεροσόλυμα
  choice: 向耶路撒冷
  rationale: εἰς可表示朝向目的地；此处处于持续旅行的叙事中，“向”保留正在趋近而尚未强调抵达的意味。
- source_word: Ἱεροσόλυμα
  choice: 耶路撒冷
  rationale: 采用现代中文圣经与通行用语中的标准地名译法。
- source_word: implicit subject in διεπορεύετο
  choice: 耶稣
  rationale: 希腊文以动词形态承接上下文中的主语；现代汉语在独立呈现本节时明说“耶稣”更清楚，且未增加新的指称。
theological_decisions:
- issue: 耶稣行程的叙事方向
  choice: 向耶路撒冷前行
  alternative: 前往耶路撒冷
  rationale: 正文强调行程正在持续并朝着耶路撒冷推进，而不暗示本节已经抵达；脚注保留εἰς较直接的目的地表达。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“各城各村”简明呈现逐处经过的意味；两个“一边”清楚表达教导与前行同时发生。
