  text: τότε ἄρξεσθε λέγειν· Ἐφάγομεν ἐνώπιόν σου καὶ ἐπίομεν, καὶ ἐν ταῖς πλατείαις ἡμῶν ἐδίδαξας·
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/026.yaml
  text: Then you will begin to say[a], ‘We ate and drank in your presence, and you taught in our streets.’
translation:
  language: zh_hans
  text: 那时，你们就会开始说：“我们曾在你面前吃过喝过，你也曾在我们的街道上教导人。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “街道”也可译作“广场”；希腊词可指城镇里的宽阔街道或公共开阔处。
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: 那时
  rationale: 作为时间副词，承接前文所述情境；“那时”在现代汉语中自然、简洁。
- source_word: ἄρξεσθε λέγειν
  choice: 你们就会开始说
  rationale: 明确保留ἄρχω加不定式所表达的起始意味，不简化为“你们会说”。
- source_word: Ἐφάγομεν ... καὶ ἐπίομεν
  choice: 我们曾……吃过喝过
  rationale: 用“曾……过”自然表达过去发生的经历，并保持“吃”和“喝”的并列。
- source_word: ἐνώπιόν σου
  choice: 在你面前
  rationale: 既可表达身处对方面前，也保留与对方有过外在接触的申诉意味，而不暗示对方认可这种关系。
- source_word: ἐν ταῖς πλατείαις ἡμῶν
  choice: 在我们的街道上
  rationale: πλατεῖα可指城镇中的宽街、街道或公共开阔处；正文采用自然且不过度具体的“街道”，另以脚注说明可能译法。
- source_word: ἐδίδαξας
  choice: 你也曾……教导人
  rationale: 用“曾”表达过去的事实；补出泛指宾语“人”使现代汉语通顺，但不限定具体受教者。
theological_decisions:
- issue: 说话者以何种关系作为申诉依据
  choice: 保留他们所声称的外在接触：曾在对方面前吃喝，对方也曾在他们的街道上教导。
  alternative: 译得像是双方曾有被认可的团契或救赎关系。
  rationale: 原文只陈述临近、共同场景和公开教导，并未说主人认可他们；译文不把外在关联解释为真实的归属关系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“吃过喝过”符合口语自然度，“教导人”则维持经文语体。脚注标记置于相关分句之后。
