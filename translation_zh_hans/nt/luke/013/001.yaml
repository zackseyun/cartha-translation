  text: Παρῆσαν δέ τινες ἐν αὐτῷ τῷ καιρῷ ἀπαγγέλλοντες αὐτῷ περὶ τῶν Γαλιλαίων ὧν τὸ αἷμα Πιλᾶτος ἔμιξεν μετὰ τῶν θυσιῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/001.yaml
  text: Some were present at that very time reporting to him about the Galileans whose blood Pilate had mixed with their sacrifices[a].
translation:
  language: zh_hans
  text: 当时，有些人在场，把彼拉多将加利利人的血掺在他们的祭物中的事报告给他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把加利利人的血和他们的祭物混在一起。”
    reason: 词义和汉语表达上的可行替代译法；原文表达血与祭物相混，既可译作“掺在……中”，也可译作“和……混在一起”。
lexical_decisions:
- source_word: Παρῆσαν δέ τινες
  choice: 有几个人在场
  rationale: παρῆσαν是不定过去时以外的未完成时形式，在这里主要描述一些人当时在场，而非强调他们来到；δέ仅作轻微承接，中文不另加生硬的连接词。
- source_word: ἐν αὐτῷ τῷ καιρῷ
  choice: 就在那时
  rationale: 保留αὐτῷ的强调和与上文同一时点的指向，同时符合现代汉语表达。
- source_word: ἀπαγγέλλοντες αὐτῷ
  choice: 把……的事告诉他
  rationale: ἀπαγγέλλω表示传达消息或报告；此处用“告诉”自然清楚，又不增添原文没有的正式语气。
- source_word: περὶ τῶν Γαλιλαίων
  choice: 那些加利利人的事
  rationale: περί加属格引出所报告的主题；“那些”也使后面的关系从句在中文中衔接自然。
- source_word: Πιλᾶτος
  choice: 彼拉多
  rationale: 采用现代中文圣经和历史语境中通行的人名译法。
- source_word: ἔμιξεν
  choice: 混在一起
  rationale: μίγνυμι的基本义是混合；“混在一起”保留原文骇人的直陈方式，不解释事件具体如何发生。
- source_word: μετὰ τῶν θυσιῶν αὐτῶν
  choice: 和他们的祭物
  rationale: μετά加属格表示“和、与”；θυσίαι指献祭之物。“他们的祭物”保留原文的所有关系，不擅自说明他们是否正在献祭。
theological_decisions:
- issue: 彼拉多行为的历史情形与道德含义
  choice: 直接译为彼拉多把这些人的血和他们的祭物混在一起
  alternative: 解释性地译为“彼拉多在他们献祭时杀了他们”
  rationale: 原文只以强烈而简洁的措辞报告事件，没有说明杀戮的具体过程，也尚未在本节解释其神学意义；直译可保留这种张力。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“就在那时”承接上文；“有几个人在场”避免误译为他们刚刚来到。全句不补入献祭地点、杀戮过程或事件原因。
