revisions:
- from: 就在那时，有几个人在场，把那些加利利人的事告诉他；彼拉多曾把他们的血和他们的祭物混在一起。[a]
  to: 当时，有些人在场，把彼拉多将加利利人的血掺在他们的祭物中的事报告给他。[a]
  rationale: 修订仅调整汉语句法和措辞，使“彼拉多将……血掺在……祭物中”明确作为所报告的内容；保留原文对事件细节的克制、不解释杀戮方式，并保留“他们的祭物”的所有关系。
