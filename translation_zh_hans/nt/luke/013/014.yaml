  text: ἀποκριθεὶς δὲ ὁ ἀρχισυνάγωγος, ἀγανακτῶν ὅτι τῷ σαββάτῳ ἐθεράπευσεν ὁ Ἰησοῦς, ἔλεγεν τῷ ὄχλῳ ⸀ὅτι Ἓξ ἡμέραι εἰσὶν ἐν αἷς δεῖ ἐργάζεσθαι· ἐν ⸀αὐταῖς οὖν ἐρχόμενοι θεραπεύεσθε καὶ μὴ τῇ ἡμέρᾳ τοῦ σαββάτου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/014.yaml
  text: But the synagogue ruler answered[a], indignant because Jesus had healed on the Sabbath, and said to the crowd, “There are six days in which it is necessary to work; so come on those days and be healed, and not on the day of the Sabbath.”
translation:
  language: zh_hans
  text: 可是，会堂主管回答说；他因耶稣在安息日治好了人而愤慨，便对众人说：“有六天是应当做工的；所以你们要在那些日子来得医治，不要在安息日来。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ
  choice: 可是……就……说
  rationale: δὲ承接上文并形成转折，译作“可是”；ἀποκριθείς在这里引出对刚发生之事的回应，汉语用“就……说”比直译“回答”自然，也不要求前面必须有口头提问。
- source_word: ὁ ἀρχισυνάγωγος
  choice: 会堂主管
  rationale: 指负责管理犹太会堂事务的人。“主管”准确表达其职务，又避免“管会堂的”过于口语或“会堂长”在现代汉语中不够透明。
- source_word: ἀγανακτῶν
  choice: 心中愤慨
  rationale: 该词表示强烈不满，往往带有认为某事不当的意味；“愤慨”保留这种带道德判断色彩的恼怒。加入“心中”使伴随状态在汉语中更顺畅，但不暗示他没有公开表现出来。
- source_word: ὅτι τῷ σαββάτῳ ἐθεράπευσεν ὁ Ἰησοῦς
  choice: 因为耶稣在安息日治好了人
  rationale: ὅτι在此表原因。θεραπεύω译为“治好”；原文未明说宾语，但由上文可知是被医治的人，汉语补出泛指的“人”以避免句子残缺。
- source_word: ἔλεγεν τῷ ὄχλῳ
  choice: 就对众人说
  rationale: 未完成时在此可自然叙述为“说”，不必强行译成持续或反复动作；ὄχλος按现场聚集的人群译作“众人”。
- source_word: Ἓξ ἡμέραι εἰσὶν ἐν αἷς δεῖ ἐργάζεσθαι
  choice: 有六天是应当做工的
  rationale: 保留原文“有六天”的句式，并用“应当”表达δεῖ在主管话语中的规范性义务；避免译成客观或神圣认可的绝对“必须”。
- source_word: ἐν αὐταῖς οὖν ἐρχόμενοι θεραπεύεσθε
  choice: 所以你们要在那些日子来接受医治
  rationale: οὖν译作“所以”，呈现其推论；ἐρχόμενοι保留“来”，θεραπεύεσθε是现在时被动命令式，译作“接受医治”，既保留被动含义，也不误成他们自己医治自己。
- source_word: καὶ μὴ τῇ ἡμέρᾳ τοῦ σαββάτου
  choice: 不要在安息日来
  rationale: 原文后半省略了与前文相应的动作。汉语补出“来”，使禁令自然明确，同时避免重复“接受医治”造成生硬。
theological_decisions:
- issue: 会堂主管关于做工日期的规范性主张
  choice: 以直接引语保留他的说法：“有六天是应当做工的”
  alternative: 将其释义为“律法规定只有六天可以治病”，或在译文中直接指出他虚伪
  rationale: 本节是在报道会堂主管的立场，并不等于叙述者或上帝认可他把医治归为不当的安息日工作。译文既保留δεῖ的义务语气，也不加入经文本身尚未明说的评断。
- issue: 安息日医治与“做工”的关系
  choice: 保留主管把医治视作应在六日进行之工作的言语逻辑
  alternative: 弱化“做工”与“医治”的联系，或替主管明确断言医治违反安息日
  rationale: 原文有意呈现主管的推论，为随后耶稣的回应保留张力；翻译不应提前替后文解决或强化这一争议。
translation_notes:
  register: 采用现代、庄重而清楚的叙事汉语。“会堂主管”“心中愤慨”“接受医治”兼顾普通读者可懂性与原文语义。直接引语略带规范、责备口吻，以反映说话人的态度；本节无须脚注。
