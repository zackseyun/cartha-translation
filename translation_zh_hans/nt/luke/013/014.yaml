    issue: ἀποκριθεὶς的回应功能未明确呈现。
    rationale: “就对众人说”可叙述后续发言，但“回答说”或“回应说”更完整地反映该分词与前文医治事件的衔接；汉语中“回答说”在此并不要求前面有直接提问。
  - severity: medium
    issue: “接受医治”带有偏现代医疗服务的搭配，且略显生硬。
    rationale: θεραπεύεσθε是被动命令式，意为“得医治／被医治”。“来得医治”既保留来访和被动结果，也更自然，不会暗示群众主动接受某种医疗程序。
