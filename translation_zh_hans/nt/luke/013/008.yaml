  text: ὁ δὲ ἀποκριθεὶς λέγει αὐτῷ· Κύριε, ἄφες αὐτὴν καὶ τοῦτο τὸ ἔτος, ἕως ὅτου σκάψω περὶ αὐτὴν καὶ βάλω κόπρια·
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/008.yaml
  text: But he answered and said to him[a], ‘Lord, leave it alone this year also[b], until I dig around it and put manure on it.’
translation:
  language: zh_hans
  text: 可是他回答主人说：“主人啊，今年也先留着它吧[a]，等我在它周围挖土，再施些粪肥[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“今年也暂且放过它吧。”
    reason: “留着”较贴近让树继续存在的表层意思；“放过”更突出上下文所暗示的暂缓处置。
  - marker: b
    text: “施些粪肥”也可译作“给它上些粪”。
    reason: 后者更直译κόπρια的具体、朴素表达；正文采用现代汉语中较自然的农业用语。
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς λέγει αὐτῷ
  choice: 可是他回答主人说
  rationale: δὲ承接上文并带轻微转折，译作“可是”；“回答……说”保留ἀποκριθεὶς λέγει的叙事结构。αὐτῷ本为“对他说”，结合比喻语境明确为“主人”，使中文指代清楚，但不增添角色以外的信息。
- source_word: Κύριε
  choice: 主啊
  rationale: 保留κύριος作为尊称的基本表达；在比喻中这是园丁对园主的称呼，不必据此断定为直接的神圣称号。
- source_word: ἄφες αὐτὴν καὶ τοῦτο τὸ ἔτος
  choice: 今年也先留着它吧
  rationale: ἀφίημι在此表示让无花果树继续留存；“先”自然表达暂缓处置的语境，但不把隐含意思直接扩写为“不要砍掉”。“今年也”对应καὶ τοῦτο τὸ ἔτος。
- source_word: ἕως ὅτου
  choice: 等
  rationale: 此处引出园丁在延缓期间准备采取的行动；现代汉语用“等”比生硬的“直到”更自然，同时保持时间关系。
- source_word: σκάψω περὶ αὐτὴν
  choice: 我在它周围挖土
  rationale: 保留σκάπτω“挖”的具体农业意象，并用“在它周围”准确表达περὶ αὐτήν。
- source_word: βάλω κόπρια
  choice: 再施些粪肥
  rationale: κόπρια指作为肥料使用的粪；“粪肥”既保留原文具体意象，又符合现代农业用语。“施”自然表达βάλω在此处的动作。
theological_decisions:
- issue: 比喻中的κύριος如何翻译
  choice: 主啊
  alternative: 主人啊／先生
  rationale: “主啊”保留该词通常的译法及其潜在神学回响；同时，当前叙事层面仍可理解为园丁对园主的尊称，不把比喻角色与上帝直接等同。
- issue: ἄφες是否明译为“饶过”
  choice: 先留着它
  alternative: 放过它／容它再存留一年
  rationale: 上下文确有暂缓砍树、给予机会的含义，但动词本身可较中性地表示“任其留下”。正文避免把隐含的赦免色彩强化为唯一解释，并在脚注保留另一译法。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事表达。保留园丁话语中的请求语气和农业意象；“主啊”兼顾原词形式与比喻场景，不额外解释其神学身份。
