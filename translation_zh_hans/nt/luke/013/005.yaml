base_translation:
  language: en
  yaml_path: translation/nt/luke/013/005.yaml
  text: No[a], I tell you; but unless you repent, you will all likewise perish.
translation:
  language: zh_hans
  text: 不是的，我告诉你们；但你们若不悔改，都要同样灭亡。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “同样灭亡”也可译作“以同样的方式灭亡”。结合上文的事例，希腊文“同样”可能指与所述事件相类似的情形或结局；具体比较的层面未明。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχί
  choice: 不是的
  rationale: 回应上文隐含的问题，保留原文加强语气的否定；现代汉语中自然且庄重。
- source_word: λέγω ὑμῖν
  choice: 我告诉你们
  rationale: 自然呈现路加常用的郑重宣告句式，并明确复数受话者。
- source_word: ἀλλ’ ἐὰν μὴ
  choice: 你们若不
  rationale: 汉语条件句已能清楚表达转折后的例外条件；紧接前句使用冒号，比生硬加入“但是”更自然。
- source_word: μετανοῆτε
  choice: 悔改
  rationale: 在此指人在上帝面前的悔改，不限于思想改变或情绪懊悔；“悔改”简明并保留其圣经神学分量。
- source_word: πάντες
  choice: 都
  rationale: “都”对应 πάντες，涵盖所有受话者，并自然修饰“要灭亡”。
- source_word: ὡσαύτως
  choice: 同样
  rationale: 保留与上文事例的比较关系，同时不限定所比较的是方式、结局、确定性还是突发性。
- source_word: ἀπολεῖσθε
  choice: 要灭亡
  rationale: 表达将来的毁灭性结局，比单纯译作“死”更能保留 ἀπόλλυμι 的严肃力度。
theological_decisions:
- issue: 耶稣警告中“悔改”的含义
  choice: 译作“悔改”，不把它缩减为内心懊悔，也不在经文中加入完整的系统神学定义。
  alternative: 改变心意；回转
  rationale: 原文发出严肃的悔改呼召；“悔改”既保留其对上帝的指向和伦理分量，也不超出本节所明说的范围。
- issue: ὡσαύτως ἀπολεῖσθε 的比较范围
  choice: 译作“同样灭亡”，保留比较对象的开放性。
  alternative: 以同样的方式灭亡；也要死去
  rationale: 上下文表明这是与前述遭难者作比较，但原文没有明确比较的是死亡方式、审判结局、确定性还是突发性，因此不宜在正文中单一化。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不是的”承接上文；冒号呈现郑重宣告和警告。“悔改”“灭亡”保留经文的神学分量与严肃语气。
