source:
  edition: SBLGNT
  text: ὁμοία ἐστὶν κόκκῳ σινάπεως, ὃν λαβὼν ἄνθρωπος ἔβαλεν εἰς κῆπον ἑαυτοῦ, καὶ ηὔξησεν καὶ ἐγένετο εἰς ⸀δένδρον, καὶ τὰ πετεινὰ τοῦ οὐρανοῦ κατεσκήνωσεν ἐν τοῖς κλάδοις αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/019.yaml
  text: It is like a mustard seed[a], which a man took and threw into his garden, and it grew and became a tree[b], and the birds of the sky nested in its branches.
translation:
  language: zh_hans
  text: 它好像一粒芥菜种；一个人拿了它，把它扔进自己的园子里。它长起来，成了一棵树[a]，天空中的飞鸟[b]栖息在它的枝条上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“成了一棵树”，保留了比喻中显著长大的形象。
    reason: lexical_alternative
  - marker: b
    text: “天空中的飞鸟”也可译作“天上的飞鸟”；传统译法作“空中的飞鸟”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοία ἐστὶν
  choice: 它好像
  rationale: 这是天国比喻中常见的比较句式；“好像”自然、清楚，并保留原文的比拟关系。
- source_word: κόκκῳ σινάπεως
  choice: 一粒芥菜种
  rationale: κόκκος可指颗粒或种子；在此指芥菜的种子。“一粒芥菜种”符合现代汉语习惯。
- source_word: ὃν λαβὼν ἄνθρωπος
  choice: 一个人拿来
  rationale: 保留原文中的单数人物，不将其泛化为复数；汉语“一个人”无需额外强调性别，也没有删去人物信息。
- source_word: ἔβαλεν εἰς κῆπον ἑαυτοῦ
  choice: 扔进自己的园子里
  rationale: “扔进”保留βάλλω的动作感，避免用“撒种”补入原文没有明说的农业术语；κῆπος具体指园子。
- source_word: ηὔξησεν
  choice: 种子渐渐长大
  rationale: “长大”准确表达此处的生长含义；补明“种子”使汉语指代清晰，“渐渐”自然呈现生长过程，但不增添新的事件。
- source_word: ἐγένετο εἰς δένδρον
  choice: 成了一棵树
  rationale: 直接保留δένδρον“树”的形象，不按植物学常识弱化为灌木或高大植物。
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: 天空中的飞鸟
  rationale: οὐρανός在这里是空间意义上的天空；“天空中的飞鸟”自然，并保留原文表达。
- source_word: κατεσκήνωσεν
  choice: 栖息
  rationale: 该动词表示驻留、安居；用于飞鸟时，“栖息”既自然又避免把“筑巢”这一较具体的动作强加给原文。
- source_word: ἐν τοῖς κλάδοις αὐτοῦ
  choice: 在它的枝头
  rationale: κλάδοις指树枝；“枝头”是自然、庄重的现代汉语，“它”明确回指那棵树。
theological_decisions:
- issue: ἄνθρωπος的人物性别表达
  choice: 一个人
  alternative: 一个男人
  rationale: 原文以单数人物叙事，但ἄνθρωπος本身可泛指人；现代汉语“一个人”完整保留人物信息，而“一个男人”会加入原文在此未特别强调的性别色彩。
- issue: 芥菜种长成δένδρον的形象
  choice: 树
  alternative: 灌木／高大的植物
  rationale: 原文明确使用δένδρον“树”。即使这个形象带有夸张或风格化色彩，也应保留比喻中的惊人增长，不以植物学解释加以削弱。
- issue: 飞鸟动作的具体程度
  choice: 栖息
  alternative: 筑巢
  rationale: κατασκηνόω可描写安居或驻留；上下文允许联想到筑巢，却未必只表示筑巢，因此采用较宽而自然的“栖息”，保留语义空间。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。以短句和分号维持比喻的叙事推进；避免过度古雅的“宿在”及解释性较强的“筑巢”。
