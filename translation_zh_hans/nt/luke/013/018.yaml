  text: Ἔλεγεν ⸀οὖν· Τίνι ὁμοία ἐστὶν ἡ βασιλεία τοῦ θεοῦ, καὶ τίνι ὁμοιώσω αὐτήν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/018.yaml
  text: So he was saying[a], “What is the kingdom of God like, and to what shall I compare it?”
translation:
  language: zh_hans
  text: 于是他说：“神的国[a]像什么？我该把它比作什么呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译为“神的统治”，着重神掌权的含义。
    reason: 词义替代译法
lexical_decisions:
- source_word: Ἔλεγεν
  choice: 他说
  rationale: 希腊语未完成时可表示叙事中持续或反复的言说；本节引出一段完整话语，现代汉语用“他说”最自然，时体延续性由上下文承载。
- source_word: οὖν
  choice: 于是
  rationale: 承接上文并推进论述；“于是”在现代汉语中自然地保留其衔接和推论色彩。
- source_word: Τίνι ὁμοία ἐστὶν
  choice: 像什么
  rationale: 这是询问相似对象的惯用比较句式；“像什么”简洁、口语自然，同时忠实保留疑问形式。
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: 神的国
  rationale: “神的国”是简明而通行的圣经表达，能够保留国度这一比喻领域，也不排除“神的统治”这一动态含义。
- source_word: καὶ
  choice: （以并列的第二问表达）
  rationale: 汉语中两个连续问句本身即可清楚体现并列关系；省去生硬的“并且”，使耶稣的话自然流畅。
- source_word: τίνι ὁμοιώσω αὐτήν
  choice: 我该拿什么来比拟它呢
  rationale: “该”体现将来时在此处的斟酌式、修辞性语气；“比拟”准确表达主动设比，代词“它”回指“神的国”。
theological_decisions:
- issue: βασιλεία τοῦ θεοῦ 的译法
  choice: 神的国
  alternative: 神的统治
  rationale: 原短语既可指神掌权，也可带有国度领域的意象。“神的国”保留耶稣比喻中既有的核心用语及其语义张力，脚注则提示动态的统治含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“于是”衔接上文；两个平行问句保留原文的修辞推进。“比拟”略具书面色彩，但在此处清楚而自然。
