  text: Ἔλεγεν δὲ ταύτην τὴν παραβολήν. Συκῆν εἶχέν τις ⸂πεφυτευμένην ἐν τῷ ἀμπελῶνι αὐτοῦ⸃, καὶ ἦλθεν ζητῶν καρπὸν ἐν αὐτῇ καὶ οὐχ εὗρεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/006.yaml
  text: 'And he was telling this parable: “A man had a fig tree planted in his vineyard[a], and he came looking for fruit on it and found none.”'
translation:
  language: zh_hans
  text: 他又讲了这个比喻：“有一个人，他的葡萄园里栽有一棵无花果树[a]；他来找这棵树上的果子，却没有找到。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“有一个人，有一棵无花果树栽在他的葡萄园里。”原文描述这棵树已经栽在园中的状态，未说明是谁栽种的。
    reason: 保留完成时被动分词πεφυτευμένην所含的已栽种状态，并避免将栽种者确定为该人物。
lexical_decisions:
- source_word: Ἔλεγεν δὲ
  choice: 他又讲了
  rationale: 未完成时在这里可作为引入比喻的叙事形式；“讲了”符合现代汉语叙事习惯。“又”自然表达 δὲ 与上文的轻度衔接，不赋予过强的时间次序。
- source_word: ταύτην τὴν παραβολήν
  choice: 这个比喻
  rationale: “比喻”是耶稣此类教导故事的通行而准确的译法；“这个”对应指示词 ταύτην。
- source_word: Συκῆν
  choice: 一棵无花果树
  rationale: συκῆ 特指无花果树；汉语以量词“棵”自然引入。
- source_word: εἶχέν τις
  choice: 有一个人
  rationale: τις 是不定代词，在此引入比喻中的人物；“有一个人”符合现代汉语讲故事的表达，同时不增加人物身份。
- source_word: πεφυτευμένην
  choice: 把……栽在
  rationale: 完成时被动分词表示树处于已经栽种的状态。结合 εἶχεν，汉语采用处置式表达，简洁自然地传达此人拥有一棵栽在园中的树；希腊文也容许理解为树已经被栽在那里，故以脚注保留另一种表达。
- source_word: ἐν τῷ ἀμπελῶνι αὐτοῦ
  choice: 在自己的葡萄园里
  rationale: ἀμπελών 指葡萄园；反身领属“自己的”清楚表明园子属于该人物。
- source_word: ἦλθεν ζητῶν καρπὸν
  choice: 他来树上找果子
  rationale: 主句动词配现在分词表达来到并寻找的动作。“来……找”是自然现代汉语；“树上”按汉语习惯表达果子所在之处。
- source_word: καὶ οὐχ εὗρεν
  choice: 却没有找到
  rationale: καί 在语义上形成结果与期待的反差，译作“却”自然呈现这一关系；宾语可由上文“果子”补足，无须重复。
theological_decisions:
- issue: 比喻中不定主语 τις 的表达
  choice: 有一个人
  alternative: 有人
  rationale: 原文只引入一个未具名人物，并未赋予特殊神学身份。“有一个人”保留人物性与讲故事的语体；“有人”也可成立，但略为泛化。
- issue: πεφυτευμένην 的施事关系
  choice: 正文译作“把一棵无花果树栽在自己的葡萄园里”
  alternative: “有一棵无花果树栽在他的葡萄园里”
  rationale: 原文的完成时被动分词着重树处于已栽种状态，并未明说是谁亲手栽种。正文采用自然汉语表达，但脚注保留不明确施事者的译法，避免把亲自栽树作为神学结论。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。正文以“有一个人”保持比喻叙事语气；“无花果树”“葡萄园”“果子”沿用清楚且具有经文互文辨识度的常用词。
