  text: καὶ ἰδοὺ εἰσὶν ἔσχατοι οἳ ἔσονται πρῶτοι, καὶ εἰσὶν πρῶτοι οἳ ἔσονται ἔσχατοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/030.yaml
  text: And behold[a], there are last who will be first, and there are first who will be last.
translation:
  language: zh_hans
  text: 看哪，有些在后的，将要在前；有些在前的，将要在后。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 用现代中文仍可自然理解的郑重提示语，保留原文引人注意的语篇功能；比单用“看”更符合格言式、庄重的语境。
- source_word: ἔσχατοι
  choice: 在后的
  rationale: 表达位置或次序上的“后”，不限定为道德、社会地位或价值上的“最小”，并与“在前的”构成简洁对举。
- source_word: πρῶτοι
  choice: 在前的
  rationale: 与“在后的”形成自然、对称的现代汉语表达，同时保留原文关于次序或地位逆转的开放性。
- source_word: οἳ ἔσονται
  choice: 将要
  rationale: 明确传达关系从句中的将来时态；中文可省略重复的“成为”，以“将要在前／在后”自然表达将来的位置。
- source_word: εἰσὶν
  choice: 有些
  rationale: 保留存在句的意义，同时避免生硬的“有在后的”；“有些”自然表达原文所指的一类人，但不把格言扩大为所有在前或在后的人。
- source_word: καὶ
  choice: ；
  rationale: 首个 καί 承接上文，不必机械译出；两组平行分句以分号连接，中文更凝练，并清楚呈现对称关系。
theological_decisions:
- issue: 逆转之说的适用范围
  choice: 译为关于前后位置逆转的一般性陈述，不在正文中限定具体群体或逆转类别。
  alternative: 具体解释为外邦人与犹太人、谦卑者与骄傲者，或末日审判中的等级逆转。
  rationale: 上下文涉及进入神的国，但本节原文保持格言式的概括。译文应保留这种广度及其神学张力，不把某一种解释写进正文。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“看哪”保留提示与强调作用；两个分句结构对称，以分号呈现格言的节奏。未加注脚，因为主要词义与句法可在正文中清楚而忠实地表达。
