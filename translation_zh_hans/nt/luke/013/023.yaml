base_translation:
  language: en
  yaml_path: translation/nt/luke/013/023.yaml
  text: And someone said to him[a], “Lord, are only a few being saved?” And he said to them[b],
translation:
  language: zh_hans
  text: 有人问他：“主[a]啊，正在得救的人只有少数吗[b]？”他对他们说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “主”在这里也可理解为表示尊敬的称呼“先生”；希腊原文没有限定这一称呼在本处的全部含义。
    reason: alternative_reading
  - marker: b
    text: 更直译可作：“正在得救的人少吗？”
    reason: lexical_alternative
lexical_decisions:
- source_word: δέ
  choice: 于是
  rationale: 这里是轻微的叙事连接词，承接上文并推进叙事；“于是”自然流畅，不强调转折。
- source_word: τις
  choice: 有人
  rationale: 表示身份未明的某个人；“有人”是现代汉语中自然且准确的不定表达。
- source_word: αὐτῷ
  choice: 问他
  rationale: 原文明确使用“他”这一代词；不在本节中补入“耶稣”，避免添加原文未明说的名字。
- source_word: Κύριε
  choice: 主
  rationale: 保留κύριος在本处既可能是尊称、也可能含有更深基督论意味的开放性；脚注说明也可按礼貌称呼理解。
- source_word: εἰ
  choice: ……吗
  rationale: 在直接问话中引出疑问；用汉语疑问助词“吗”比直译为“是否”更自然。
- source_word: ὀλίγοι
  choice: 只有少数人
  rationale: 表达人数少，并在问句中自然体现其限制意味。
- source_word: οἱ σῳζόμενοι
  choice: 正在得救的
  rationale: 带冠词的现在时被动分词，字面意为“那些正在被拯救的人”；“正在得救的”保留持续性和被动含义，同时符合现代汉语表达。
- source_word: ὁ δὲ εἶπεν
  choice: 他就……说
  rationale: 以“就”自然承接提问和回答；不把δέ强化为明显转折。
- source_word: πρὸς αὐτούς
  choice: 对他们
  rationale: 保留原文复数代词，显示回答所面向的不只提问的那一个人，同时不擅自具体说明“他们”是谁。
theological_decisions:
- issue: 称呼κύριε的含义
  choice: 主
  alternative: 先生
  rationale: “主”保留路加叙事中这一称呼可能具有的礼貌尊称和更深神学含义，不将其限定为单纯的世俗敬称；脚注交代另一种理解。
- issue: σῳζόμενοι的时态体与被动含义
  choice: 正在得救的
  alternative: 得救的人
  rationale: 现在时被动分词可以呈现正在发生或持续的状态；采用“正在得救的”保留这种语法特征，但不借此规定某一特定救恩论体系。
- issue: 回答对象由单数转为复数
  choice: 对他们
  alternative: 对众人
  rationale: 原文明确使用复数αὐτούς，却没有在本节具体界定其所指；直译为“他们”可保留这一叙事张力，避免补入解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“正在得救”略带直译色彩，但有助于保留希腊文现在时被动分词的持续性；正文中的两个脚注标记分别紧随相关词句。
