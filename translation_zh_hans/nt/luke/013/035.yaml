id: LUK.13.35
reference: Luke 13:35
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἰδοὺ ἀφίεται ὑμῖν ὁ οἶκος ⸀ὑμῶν. λέγω ⸀δὲ ⸀ὑμῖν, οὐ μὴ ⸂ἴδητέ με⸃ ἕως ⸂ἥξει ὅτε⸃ εἴπητε· Εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/035.yaml
  text: Look[a], your house is left to you. And I tell you, you will certainly not see me until the time comes when you say[d][c][b], ‘Blessed is the one who comes in the name of the Lord.’
translation:
  language: zh_hans
  text: 看哪[a]，你们的家被遗弃，只留给你们了[b]。我告诉你们，你们绝不会见到我，直到有一天你们说[d]：‘奉主名而来的那一位是蒙福的！’[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被遗弃”也可译为“被弃置”或“被撇下”；这个希腊语被动式可能带有在审判中被交出的意味。
    reason: lexical_alternative
  - marker: b
    text: “你们的家”很可能指耶路撒冷，尤其是其中的圣殿；但希腊文只说“你们的家”。
    reason: alternative_reading
  - marker: c
    text: “奉主名而来的那一位是蒙福的”呼应《诗篇》118:26。
    reason: cross_reference
  - marker: d
    text: 有人认为这话指耶稣荣耀地进入耶路撒冷，也有人认为是指将来人们对他的承认；希腊文本身并未限定为某一个特定时点。
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留引人注意并引出庄严宣告的语气；在现代中文中仍自然且具有经文体的庄重感。
- source_word: ἀφίεται
  choice: 被撇给
  rationale: 保留现在时被动形式及“留下、弃置、交出”的语义张力，不在正文中将司法性含义解释得过满。
- source_word: ὁ οἶκος ὑμῶν
  choice: 你们的家
  rationale: 按希腊文直译为“你们的家”，不直接限定为圣殿、耶路撒冷或以色列家。
- source_word: λέγω δὲ ὑμῖν
  choice: 我告诉你们
  rationale: δέ在此可作温和转折或承接；中文无需硬加“但”或“而”，省略连接词更自然，也避免过度确定其逻辑力度。
- source_word: οὐ μὴ ἴδητέ με
  choice: 你们绝不会再见到我
  rationale: 以“绝不会”表达οὐ μή的强烈将来否定；“再”符合离别语境和自然中文，但不改变否定的核心内容。
- source_word: ἕως ἥξει ὅτε
  choice: 直到时候来到
  rationale: 自然表达“直到……时候来到”的时间结构，同时保留所指时点未被明确说明的开放性。
- source_word: εἴπητε
  choice: 你们说
  rationale: 在“直到时候来到”之后用中文现在式表达未来条件，简洁自然。
- source_word: Εὐλογημένος
  choice: 是蒙福的
  rationale: 保留祝福宣告的被动含义及诗篇引文的传统经文色彩。
- source_word: ὁ ἐρχόμενος
  choice: 来的那一位
  rationale: 准确呈现实词化分词，同时不把它过度固定为专门称号。
- source_word: ἐν ὀνόματι κυρίου
  choice: 奉主名
  rationale: “奉……名”是现代中文中清楚而庄重的表达，可传达凭主的名义、权柄而来的意思。
theological_decisions:
- issue: “你们的家”的所指
  choice: 正文保留“你们的家”
  alternative: 译作“圣殿”“耶路撒冷”或“以色列家”
  rationale: 上下文很可能指耶路撒冷，尤其涉及圣殿，但希腊文本身只说“你们的家”；正文保留其宽度，注释说明可能所指。
- issue: 末句所指的时间与事件
  choice: 保留为未具体界定的将来时点
  alternative: 明确解释为荣入耶路撒冷、耶路撒冷将来的承认，或末世再临时的承认
  rationale: 希腊文没有要求只采用其中一种解释，因此正文不替读者解决这一时间与神学张力。
- issue: ἀφίεται的司法意味
  choice: 译作“被撇给”并以脚注提示“被弃置”这一可能含义
  alternative: 正文直接译作“被遗弃”或“被弃绝”
  rationale: 被动形式可能带有交付、任凭或审判性的弃置意味，但正文采用较少解释性的说法，以免把语义范围收窄。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”保留宣告感；“被撇给”有意保留原文在“留下”与“弃置”之间的张力。引文采用自然中文语序，同时保持诗篇式祝福宣告。所有脚注标记均已置入正文。
