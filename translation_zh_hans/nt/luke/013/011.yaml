  text: καὶ ἰδοὺ ⸀γυνὴ πνεῦμα ἔχουσα ἀσθενείας ἔτη ⸀δεκαοκτώ, καὶ ἦν συγκύπτουσα καὶ μὴ δυναμένη ἀνακύψαι εἰς τὸ παντελές.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/011.yaml
  text: And behold[a], there was a woman who had a spirit of infirmity for eighteen years, and she was bent over and unable to straighten up completely.
translation:
  language: zh_hans
  text: 看哪，有一个女人，身上有病弱之灵，已有十八年。她弯腰曲背，完全直不起身来。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留原文引人注意、增强叙事现场感的感叹语气；“看哪”庄重而仍为现代读者所理解。
- source_word: γυνὴ
  choice: 有一个女人
  rationale: 此处首次引入这名女子，用不定指表达符合上下文和现代汉语习惯。
- source_word: πνεῦμα ἔχουσα ἀσθενείας
  choice: 被病弱的灵缠身
  rationale: 明确保留πνεῦμα“灵”，并以自然汉语表达她持续处于这种灵所带来的病弱状态；不进一步断定这是鬼附或其他特定形式的属灵作用。
- source_word: ἔτη δεκαοκτώ
  choice: 已经十八年了
  rationale: 自然表达这种状况延续至当时已有十八年。
- source_word: συγκύπτουσα
  choice: 弯腰曲背
  rationale: 清楚而形象地表达身体持续向前弯曲的状态，又不夸大为完全折叠。
- source_word: μὴ δυναμένη ἀνακύψαι
  choice: 直不起身来
  rationale: 准确传达她无法恢复直立姿势，并符合现代汉语表达。
- source_word: εἰς τὸ παντελές
  choice: 完全
  rationale: 保留原文对无法直起身这一程度的强化。
theological_decisions:
- issue: πνεῦμα ἀσθενείας是否应淡化或排除属灵作用
  choice: 正文明确译作“病弱的灵”
  alternative: 使人病弱的灵；病弱之灵；由灵造成的疾病
  rationale: 原文明说πνεῦμα“灵”，因此不可只译成一般疾病；同时不直接译成“邪灵”或“鬼附”，以免超出本节所明确陈述的内容。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“看哪”保留经文的现场感；“被……缠身”使汉语自然流畅，但脚注提示原文较为凝练，未具体界定这灵的性质。
