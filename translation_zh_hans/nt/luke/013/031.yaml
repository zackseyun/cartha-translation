id: LUK.13.31
reference: Luke 13:31
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ἐν αὐτῇ τῇ ⸀ὥρᾳ προσῆλθάν τινες Φαρισαῖοι λέγοντες αὐτῷ· Ἔξελθε καὶ πορεύου ἐντεῦθεν, ὅτι Ἡρῴδης θέλει σε ἀποκτεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/031.yaml
  text: At that very hour some Pharisees came up and said to him[a], “Leave and go away from here[b], because Herod wants to kill you.”
translation:
  language: zh_hans
  text: 就在那时[a]，有几个法利赛人前来对他说：“离开这里，走吧[b]，因为希律想要杀你。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“就在那同一时刻。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“离开，从这里走吧。”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν αὐτῇ τῇ ὥρᾳ
  choice: 就在那时
  rationale: 该短语强调特定时间点及紧接发生的意味；“就在那时”在现代汉语中自然，也保留了 αὐτῇ 的强调作用。
- source_word: προσῆλθάν
  choice: 来
  rationale: προσέρχομαι 表示来到或走近某人；与“对他说”连用时，“来”简洁自然，语境已清楚表达他们接近耶稣。
- source_word: τινες Φαρισαῖοι
  choice: 有几个法利赛人
  rationale: τινες 是不定指，不说明具体是哪些人；“有几个”准确而自然。
- source_word: λέγοντες αὐτῷ
  choice: 对他说
  rationale: 将同时发生的分词结构转换为现代汉语的连动表达，清楚流畅。
- source_word: Ἔξελθε
  choice: 离开这里
  rationale: 该命令要求耶稣离开当前地点；把 ἐντεῦθεν 的地点信息与第一个动词自然结合，避免生硬直译为“出去”。
- source_word: καὶ πορεύου ἐντεῦθεν
  choice: 走吧
  rationale: πορεύου 表示动身、离去；与前面的“离开这里”并列，保留原文两个命令的递进，同时避免汉语中“离开并从这里走”之类的累赘。
- source_word: ὅτι
  choice: 因为
  rationale: 明确引出法利赛人所给出的理由，是现代汉语最直接的对应表达。
- source_word: Ἡρῴδης
  choice: 希律
  rationale: 采用中文圣经传统中通行的人名译法。
- source_word: θέλει
  choice: 想要
  rationale: 保留 θέλω 所表达的意愿或欲望，不强化为已经确定的计划或意图。
- source_word: ἀποκτεῖναι
  choice: 杀
  rationale: 直接表达夺去性命，既准确又不额外引入正式处决的含义。
theological_decisions:
- issue: 法利赛人发出警告的动机
  choice: 按叙事表层直接译为警告，不说明他们是否真诚
  alternative: 明示他们真心保护耶稣，或暗示他们借希律之名恐吓耶稣离开
  rationale: 希腊文只记述他们的话，没有明确揭示其动机；译文应保留这种叙事开放性。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“就在那时”自然传达时间上的紧接与强调；两个命令译作“离开这里，走吧”，兼顾原文结构与汉语流畅度。所有脚注标记均置于正文相应位置。
