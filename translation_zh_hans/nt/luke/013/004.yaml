  to: 又如，西罗亚有一座塔倒塌，压死了那十八个人。你们以为他们的罪债比所有住在耶路撒冷的人都更重吗？[a]
  rationale: 修订明确了塔位于西罗亚这一地点关系，并将灾祸的结果自然译为“倒塌，压死了”。后半句以“罪债……更重”保留原文债务隐喻和παρὰ的比较意义，脚注则交代“欠债者”的字面表达及道德语境；反问本身未预先加入下一节的答案。
