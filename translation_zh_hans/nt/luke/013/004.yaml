  text: ἢ ἐκεῖνοι οἱ ⸀δεκαοκτὼ ἐφ’ οὓς ἔπεσεν ὁ πύργος ἐν τῷ Σιλωὰμ καὶ ἀπέκτεινεν αὐτούς, δοκεῖτε ὅτι ⸀αὐτοὶ ὀφειλέται ἐγένοντο παρὰ πάντας ⸀τοὺς ἀνθρώπους τοὺς ⸀κατοικοῦντας Ἰερουσαλήμ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/004.yaml
  text: Or those eighteen on whom the tower in Siloam fell and killed them—do you think that they became debtors beyond all the men living in Jerusalem?[a][b]
translation:
  language: zh_hans
  text: 又如，西罗亚有一座塔倒塌，压死了那十八个人。你们以为他们的罪债比所有住在耶路撒冷的人都更重吗？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “罪债”直译为“债务”；原文称这些人为“欠债者”，此处很可能指道德上的亏欠。也可译作“罪责比……更重”或“比……更有过犯”。
    reason: 说明ὀφειλέται的债务隐喻及其语境中的道德含义，同时保留可行的译法而不将其等同于第2节的“罪人”。
lexical_decisions:
- source_word: ἢ
  choice: 又如
  rationale: 承接上文并引出另一个例子，比孤立的“或者”更符合现代汉语的论述衔接。
- source_word: ἐκεῖνοι οἱ δεκαοκτώ
  choice: 那十八个人
  rationale: 保留指示和确切人数；“人”在这里是泛指，并不限定性别。
- source_word: ἔπεσεν ὁ πύργος ἐν τῷ Σιλωὰμ
  choice: 西罗亚的塔倒下来
  rationale: 将地点修饰自然地处理为“西罗亚的塔”，并用“倒下来”贴近ἔπεσεν，而不额外解释为建筑结构上的“坍塌”。
- source_word: ἀπέκτεινεν αὐτούς
  choice: 压死了他们
  rationale: 汉语中塔倒下致死自然说“压死”；虽补明致死方式，但这是由句中事件关系直接蕴含的。
- source_word: δοκεῖτε ὅτι
  choice: 你们以为……吗
  rationale: 保留耶稣直接质问听众的语气。
- source_word: ὀφειλέται
  choice: 欠下了更多的罪债
  rationale: 保留“欠债者”的隐喻，同时用“罪债”标明此处是道德意义，而非金钱债务。
- source_word: ἐγένοντο παρὰ πάντας
  choice: 比……欠下了更多
  rationale: 用自然汉语表达γίνομαι与παρά所形成的比较关系，避免生硬的“成为超过所有人的欠债者”。
- source_word: τοὺς ἀνθρώπους τοὺς κατοικοῦντας Ἰερουσαλήμ
  choice: 所有住在耶路撒冷的人
  rationale: ἀνθρώπους在此泛指当地居民，现代汉语用“人”准确且自然；现在分词译为“住在”。
theological_decisions:
- issue: ὀφειλέται在本节中的道德含义
  choice: 欠下了更多的罪债
  alternative: 罪更大／罪人／罪责更重
  rationale: 本节没有沿用第2节的ἁμαρτωλοί，而使用字面为“欠债者”的ὀφειλέται。正文保留债务隐喻，同时以“罪债”避免误解为经济负债，并保存两节措辞之间的差异。
- issue: 灾祸与罪责之间的关系
  choice: 以反问呈现听众的假设，不在本节内替耶稣提前作答
  alternative: 明确译成“他们并不比别人更有罪”
  rationale: 原文这里只提出问题；答案和劝诫接续于下一节。翻译不应把后文结论提前写入本节。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“又如”承接上文；拆成两句以避免长定语造成拗口。地名按常见圣经译名作“西罗亚”。
