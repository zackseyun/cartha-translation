  text: εἶπεν δὲ ὁ κύριος τοῦ ἀμπελῶνος· Τί ποιήσω; πέμψω τὸν υἱόν μου τὸν ἀγαπητόν· ἴσως ⸀τοῦτον ἐντραπήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/013.yaml
  text: Then the owner of the vineyard said[a], ‘What shall I do? I will send my beloved son[b]; perhaps they will respect him.’
translation:
  language: zh_hans
  text: 于是，葡萄园主[a]说：“我该怎么办呢？我要打发我的爱子去；也许他们会尊重他[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “葡萄园主”也可译作“葡萄园的主人”；原文所用的词也常译为“主”。
    reason: lexical_alternative
  - marker: b
    text: “尊重”所译的动词也可表示“在他面前感到羞愧”或“对他表示敬意”。
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος τοῦ ἀμπελῶνος
  choice: 葡萄园主
  rationale: 这里的κύριος由“葡萄园的”限定，在比喻的叙事情境中指葡萄园的主人或所有者。“葡萄园主”简洁自然，也不以神学称号预先解释比喻。
- source_word: Τί ποιήσω;
  choice: 我该怎么办呢？
  rationale: 以现代汉语自然表达商议性的虚拟语气，呈现园主自问下一步该采取什么行动。
- source_word: πέμψω
  choice: 我要打发……去
  rationale: 表达将来时所显示的明确决定；“打发……去”符合差派某人前往某处的叙事语境。
- source_word: τὸν υἱόν μου τὸν ἀγαπητόν
  choice: 我的爱子
  rationale: “爱子”既准确表达男性后代和蒙爱之意，又保留路加福音中可能与耶稣受洗及登山变像叙事相呼应的措辞。
- source_word: ἴσως
  choice: 也许
  rationale: 准确表达带有期待却不确定的语气，且符合现代汉语。
- source_word: τοῦτον
  choice: 他
  rationale: 希腊文指示代词特指刚提到的儿子；汉语在此用“他”最自然，所指清楚。
- source_word: ἐντραπήσονται
  choice: 他们会尊重他
  rationale: 该动词在此表示因对方面前有所顾忌而表现尊重或敬意；“尊重”清楚自然，其他可能意涵收入脚注。
theological_decisions:
- issue: 比喻中κύριος可能指向上帝，是否译作神学称号“主”
  choice: 葡萄园主
  alternative: 葡萄园的主／主人
  rationale: 正文首先保留故事层面的身份，即葡萄园的主人，不借称号强行点明比喻所指；读者仍可从上下文体会其神学对应。
- issue: “爱子”可能具有基督论呼应
  choice: 我的爱子
  alternative: 我所爱的儿子
  rationale: “我的爱子”自然凝练，并保留原文在比喻角色与路加福音神圣儿子语言之间的张力，不加解释性扩写。
- issue: ἐντραπήσονται所含“羞愧”与“敬重”的语义张力
  choice: 正文译“尊重他”，脚注说明其他含义
  alternative: 他们在他面前会感到羞愧／他们会敬重他
  rationale: 在佃户面对园主儿子的语境中，“尊重”最清楚地表达预期反应；脚注保留该词也可表示在某人面前感到羞愧或有所顾忌的语义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“于是”承接前文情节；“我该怎么办呢”保留自问语气；分号呈现园主由思量转为决定的节奏。所有脚注标记均置于正文相应词语之后。
