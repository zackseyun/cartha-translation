source:
  edition: SBLGNT
  text: ⸀καὶ καιρῷ ἀπέστειλεν πρὸς τοὺς γεωργοὺς δοῦλον, ἵνα ἀπὸ τοῦ καρποῦ τοῦ ἀμπελῶνος ⸀δώσουσιν αὐτῷ· οἱ δὲ γεωργοὶ ⸂ἐξαπέστειλαν αὐτὸν δείραντες⸃ κενόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/010.yaml
  text: And at the proper time he sent a slave to the vine-growers[a], so that they would give him some of the fruit of the vineyard[b]. But the vine-growers sent him away empty after beating him.
translation:
  language: zh_hans
  text: 在适当的时候，他派一个奴隶[a]到种葡萄的人那里去，好让他们把葡萄园的一些出产交给他；可是，那些种葡萄的人打了他一顿，叫他空着手回去[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“奴仆”。希腊词δοῦλος可指奴隶或仆役；这里译作“奴隶”，以保留其受主人支配的身份。
    reason: alternative_reading
  - marker: b
    text: 直译“空着”；意思是没有得到葡萄园的任何出产。
    reason: lexical_alternative
lexical_decisions:
- source_word: καιρῷ
  choice: 到了时候
  rationale: καιρός在此为时间与格，表示合宜或既定的时机；译文保留这种含义，不把它具体限定为原文没有明说的“收获时节”。
- source_word: ἀπέστειλεν
  choice: 打发
  rationale: 在差遣主人所属奴隶的叙事语境中，“打发”自然表达ἀποστέλλω的“派遣”之意，并与后文“赶走”相区别。
- source_word: γεωργούς
  choice: 种葡萄的人
  rationale: γεωργοί泛指耕作者；结合ἀμπελών明确为种植、照管葡萄的人。此译法保留农业含义，同时不擅自断定其法律身份为佃户。
- source_word: δοῦλον
  choice: 奴隶
  rationale: δοῦλος可依语境指奴隶或仆役；此处选择“奴隶”，直接保留古代社会中受主人支配的身份，不以传统措辞淡化。
- source_word: ἵνα ... δώσουσιν αὐτῷ
  choice: 好让他们……拿一些给他
  rationale: ἵνα加将来时直陈式在此表达差遣的目的；“好让”符合现代汉语，也不把预期结果说成已经实现。
- source_word: ἀπὸ τοῦ καρποῦ τοῦ ἀμπελῶνος
  choice: 从葡萄园的出产中拿一些
  rationale: ἀπό加属格在此具有部分意义；“出产”比仅指单个果子的“果实”更自然地涵盖葡萄园的收成，“一些”明确而不过度规定应交份额。
- source_word: ἐξαπέστειλαν
  choice: 赶走
  rationale: ἐξαποστέλλω在此有把人送走、逐离之意；结合殴打的语境，“赶走”准确而自然。
- source_word: δείραντες
  choice: 打了……一顿
  rationale: δέρω表示殴打，不必具体化为鞭打；汉语“一顿”自然表达实际遭受的一番殴打。
- source_word: κενόν
  choice: 空手
  rationale: κενός字面为“空的”；作补语描述被赶走的奴隶时，“空手”自然表达他没有拿到任何出产。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“种葡萄的人”避免把γεωργοί的法律身份解释为“佃户”；“到了时候”保留καιρός的开放性；句末按希腊文的动作关系先写殴打，再写空手赶走。
