source:
  edition: SBLGNT
  text: καὶ ἐζήτησαν οἱ ⸂γραμματεῖς καὶ οἱ ἀρχιερεῖς⸃ ἐπιβαλεῖν ἐπ’ αὐτὸν τὰς χεῖρας ἐν αὐτῇ τῇ ὥρᾳ, καὶ ἐφοβήθησαν ⸂τὸν λαόν⸃, ἔγνωσαν γὰρ ὅτι πρὸς αὐτοὺς ⸂εἶπεν τὴν παραβολὴν ταύτην⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/019.yaml
  text: And the scribes and the chief priests sought to lay hands on him in that very hour[a], but they feared the people[b], for they knew that he had told this parable against them.
translation:
  language: zh_hans
  text: 文士和祭司长就在那时想要对耶稣下手[a]，却惧怕百姓，因为他们知道，耶稣说这比喻是针对他们的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“把手放在他身上”；也可译作“捉拿他”或“逮捕他”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“是对他们说的”或“是说他们的”。上下文很可能带有“针对他们”的意思。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐζήτησαν
  choice: 想
  rationale: 概括他们当时的意图和企图，但不暗示行动已经成功；结合后接不定式，自然表达为“想……”。
- source_word: γραμματεῖς
  choice: 文士
  rationale: 这是福音书语境中对该犹太宗教及律法群体的惯用、准确称谓。
- source_word: ἀρχιερεῖς
  choice: 祭司长
  rationale: 复数在此指祭司阶层中的领袖群体，而不是同时任职的多位大祭司。
- source_word: ἐπιβαλεῖν ἐπ’ αὐτὸν τὰς χεῖρας
  choice: 下手拿住耶稣
  rationale: 保留原文“动手加在某人身上”的形象，同时以现代汉语自然表达敌意控制之意；具体是抓捕还是逮捕仍留有余地。
- source_word: ἐν αὐτῇ τῇ ὥρᾳ
  choice: 当时就
  rationale: 自然传达“就在那时”的即时性和强调语气。
- source_word: ἐφοβήθησαν τὸν λαόν
  choice: 惧怕百姓
  rationale: λαός在此指一般民众，不只是在场的人群；“惧怕”保留其社会和政治压力。
- source_word: ἔγνωσαν
  choice: 知道
  rationale: 直接表达他们认出了比喻所指，没有额外强化为突然领悟。
- source_word: πρὸς αὐτοὺς
  choice: 针对他们
  rationale: 上下文表明他们认为自己是比喻所责备的对象；“针对”既体现对抗意味，也不把该短语过度具体化。
- source_word: παραβολὴν
  choice: 比喻
  rationale: 这是符类福音书中παραβολή的通行、易懂译法。
theological_decisions:
- issue: πρὸς αὐτούς描述比喻与宗教领袖之间的关系
  choice: 是针对他们的
  alternative: 是对他们说的；是说他们的
  rationale: 前后文显示这些领袖认出自己是比喻所谴责的对象，因此正文表达其对抗性；脚注保留介词短语较字面的其他可能表达，避免消除原文张力。
translation_notes:
  register: 采用现代、庄重而通俗的叙事语言。“当时就”体现即时性；“下手拿住”保留原文动作意象；两处脚注标记均置于正文相应位置。
