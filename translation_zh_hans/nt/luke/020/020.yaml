id: LUK.20.20
reference: Luke 20:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ παρατηρήσαντες ἀπέστειλαν ἐγκαθέτους ὑποκρινομένους ἑαυτοὺς δικαίους εἶναι, ἵνα ἐπιλάβωνται αὐτοῦ λόγου, ⸀ὥστε παραδοῦναι αὐτὸν τῇ ἀρχῇ καὶ τῇ ἐξουσίᾳ τοῦ ἡγεμόνος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/020.yaml
  text: And after watching him closely[a], they sent spies who pretended to be righteous, so that they might catch him in something he said[b], and thus hand him over to the rule and authority of the governor.
translation:
  language: zh_hans
  text: 他们先密切监视耶稣[a]，又派出暗探，假装是义人，为要抓住他话中的把柄[b]，从而把他交在总督的管辖权和权柄之下[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们窥伺着耶稣”。
    reason: 保留παρατηρέω在此既指密切观察、又含敌意窥伺的语义色彩。
  - marker: b
    text: 直译：“抓住他的话”或“抓住他的一句话”。
    reason: 说明原文以他的话为设陷阱和控告的依据；正文采用自然中文表达其惯用含义。
  - marker: c
    text: 或译：“交给总督的统治和权柄”。原文并列两个相关词，强调总督正式的管辖与权威。
    reason: 说明ἀρχή与ἐξουσία的并列，避免将其简化为单一概念。
lexical_decisions:
- source_word: παρατηρήσαντες
  choice: 密切监视耶稣
  rationale: 该词在此带有敌意窥伺、伺机而动的意味；用“密切监视”比中性的“观察”更贴合语境。希腊文宾语隐含于上下文，中文补出“耶稣”以保持指代清楚。
- source_word: ἐγκαθέτους
  choice: 暗探
  rationale: 指暗中安插、伺机设陷阱的人。“暗探”简洁自然，同时表达隐蔽和敌对的意图。
- source_word: ὑποκρινομένους ἑαυτοὺς δικαίους εἶναι
  choice: 假装自己是义人
  rationale: 保留欺骗性的自我呈现，也以“义人”承载 δίκαιος 的道德和宗教色彩，而不弱化为仅仅“正派”或“诚实”。
- source_word: ἵνα ἐπιλάβωνται αὐτοῦ λόγου
  choice: 为要抓住他话中的把柄
  rationale: 这是设法根据对方言论加以控告的表达；中文“抓住……话中的把柄”自然地传达言语陷阱和司法利用的意味。
- source_word: ὥστε
  choice: 好
  rationale: 在此引出设陷阱所要达到的结果或目的；“好”在现代中文中简洁地连接前后行动。
- source_word: παραδοῦναι
  choice: 交给
  rationale: 在司法和敌对语境中表示将某人移交给掌权者处置；“交给”清楚自然。
- source_word: τῇ ἀρχῇ
  choice: 统治权
  rationale: 此处不是“起初”，而是统治或管治之权；与后面的 ἐξουσία 并列，故采用有区别但相关的译词。
- source_word: τῇ ἐξουσίᾳ
  choice: 权柄
  rationale: 表示获授或合法行使的权力。“权柄”与“统治权”共同保留原文两个近义名词的强调作用。
- source_word: τοῦ ἡγεμόνος
  choice: 总督
  rationale: 指罗马地方行政长官；“总督”是中文圣经及一般历史语境中清楚、易懂的对应词。
theological_decisions:
- issue: 在假冒道德身份的语境中如何翻译 δίκαιος
  choice: 义人
  alternative: 正直的人；公正的人
  rationale: “义人”保留该词在路加语境中的道德—宗教分量，也避免把这些人的伪装缩减为一般社会意义上的正派或公平。
- issue: 如何处理 ἀρχή 与 ἐξουσία 的并列
  choice: 统治权和权柄
  alternative: 管辖和权力；总督的政权和权力
  rationale: 原文用两个相近但不完全相同的词强调总督正式的管治权限和实际权力；译文保留这对表达，不将其合并为单一概念。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“暗探”“把柄”便于普通读者理解，又保持敌意设局的语气；“义人”“权柄”保留经文的宗教与司法色彩。
