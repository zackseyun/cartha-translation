source:
  edition: SBLGNT
  text: ⸀οὐδὲ γὰρ ἀποθανεῖν ἔτι δύνανται, ἰσάγγελοι γάρ εἰσιν καὶ υἱοί ⸀εἰσιν θεοῦ τῆς ἀναστάσεως υἱοὶ ὄντες.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/036.yaml
  text: For they cannot die anymore[a], because they are like the angels and are sons of God[b], being sons of the resurrection.
translation:
  language: zh_hans
  text: 因为他们也再也不能死了：他们和天使一样[a]，又是上帝的儿子[b]，因为他们是复活之子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“与天使同等”。这里是说他们像天使，并不是说他们变成天使。
    reason: lexical_alternative
  - marker: b
    text: 原文两处直译都是“儿子”：“上帝的儿子”和“复活之子”。这里的阳性形式表达身份和归属，并非只包括男性。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ γὰρ ἀποθανεῖν ἔτι δύνανται
  choice: 因为他们不能再死
  rationale: δύνανται加不定式表达能力上的不可能；ἔτι在否定句中表示“不再”。οὐδὲ承接上文，可自然译入“也”的含义，但中文在本句中省去“也”更顺畅，连接作用由“因为”表达。
- source_word: ἰσάγγελοι
  choice: 和天使一样
  rationale: 该词可指“与天使同等”或“像天使一样”。“和天使一样”是自然的现代汉语，同时保留比较关系，并不说复活的人变成天使。
- source_word: υἱοί ... θεοῦ
  choice: 上帝的儿子
  rationale: 原文明确使用阳性复数υἱοί，并与后面的“复活之子”形成重复和呼应，因此正文保留“儿子”，脚注说明这里表达身份，并非只包括男性。
- source_word: τῆς ἀναστάσεως υἱοὶ ὄντες
  choice: 因为他们是复活之子
  rationale: 保留“复活之子”的原文比喻；分词ὄντες在语境中带有解释原因的作用，译作“因为他们是”能清楚呈现它与“上帝的儿子”之间的关系。
- source_word: γάρ ... γάρ
  choice: 因为……；……因为
  rationale: 两个γάρ都具有解释作用。首个连接本节与上文，第二个说明他们不能再死的根据；通过分号及后置的“因为”避免中文重复生硬。
theological_decisions:
- issue: 末世语境中的“儿子”称谓
  choice: 正文保留“上帝的儿子”和“复活之子”
  alternative: 译作“上帝的儿女”和“复活之子民”
  rationale: 保留原文两次υἱοί的修辞呼应和身份隐喻，同时用脚注说明此处并非限定男性，以免把原文形式或所指范围任何一方抹平。
- issue: 复活者与天使的关系
  choice: 译作“和天使一样”
  alternative: 译作“与天使同等”
  rationale: 原文表达比较而非身份等同；此译法不把复活者解释成天使，也不额外限定二者究竟在哪些方面相同。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不能再死”自然表达不再受死亡辖制；“复活之子”稍具书面色彩，以保留原文独特的身份隐喻。
