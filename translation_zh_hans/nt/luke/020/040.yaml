  text: For they no longer dared to ask him anything.
translation:
  language: zh_hans
  text: 因为他们再也不敢问他什么了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκέτι
  choice: 再也不
  rationale: 表达从此停止某种行为，符合现代汉语习惯，也保留了“不再”的时间含义。
- source_word: γάρ
  choice: 因为
  rationale: 承接上文并说明缘由；“因为”清楚呈现原文的解释性关系。
- source_word: ἐτόλμων
  choice: 敢
  rationale: 与“再也不”搭配，自然表达过去曾有、此后却失去的胆量；汉语无需另行标出未完成过去时。
- source_word: ἐπερωτᾶν
  choice: 问
  rationale: 在当众发问和试探的语境中，“问”简洁自然，同时不把含义过度限定为正式盘问。
- source_word: αὐτὸν
  choice: 他
  rationale: 直接对应指向耶稣的第三人称单数代词。
- source_word: οὐδέν
  choice: 什么
  rationale: 在“再也不敢问”的否定结构中，“什么”自然表达任何事情都不问的全面否定。
theological_decisions: []
translation_notes:
