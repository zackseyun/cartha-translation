  text: καὶ ἐκβαλόντες αὐτὸν ἔξω τοῦ ἀμπελῶνος ἀπέκτειναν. τί οὖν ποιήσει αὐτοῖς ὁ κύριος τοῦ ἀμπελῶνος;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/015.yaml
  text: And after throwing him out of the vineyard[a], they killed him. What then will the owner of the vineyard do to them?
translation:
  language: zh_hans
  text: 他们把他赶出葡萄园后，就杀了他。那么，葡萄园主会怎样处置他们呢？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκβαλόντες
  choice: 把他扔出
  rationale: 不定过去时分词表示这动作先于“杀了”；“扔出”自然地保留了强制驱逐的力度。
- source_word: ἔξω τοῦ ἀμπελῶνος
  choice: 出葡萄园
  rationale: 该短语表达从园内移到园外的方向，与“扔出”连用符合现代汉语习惯。
- source_word: ἀπέκτειναν
  choice: 杀了他
  rationale: 直接对应“杀死”，不采用“谋杀”，以免加入原动词本身未明说的法律或道德定性。
- source_word: τί οὖν
  choice: 那么
  rationale: 保留οὖν承接前事、引出结果性问题的推论语气，同时使中文问句自然。
- source_word: ποιήσει αὐτοῖς
  choice: 会怎样处置他们
  rationale: 在此语境中，ποιέω与间接宾语合起来询问园主将对佃户采取什么行动；“处置”比生硬的“对他们做什么”更自然，也符合回应恶行的上下文。
- source_word: ὁ κύριος τοῦ ἀμπελῶνος
  choice: 葡萄园主
  rationale: κύριος在比喻的叙事层面指葡萄园的主人；“葡萄园主”简洁、自然，并不把它误读为直接用于上帝的称号。
theological_decisions:
- issue: 比喻中非直接神性所指的κύριος如何译出
  choice: 葡萄园主
  alternative: 葡萄园的主人／葡萄园的主
  rationale: 这里的直接所指是比喻中的产业主人，而不是叙事中明示的神圣称号。“葡萄园主”准确表达其所有者身份，同时不否定比喻更深层的神学指向。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“扔出”保留强制驱逐的力度；“处置”使结尾的追问自然有力。原文无需要另加脚注才能保存的实质歧义。
