  to: 他们把他赶出葡萄园后，就杀了他。那么，葡萄园主会怎样处置他们呢？
  rationale: 修订仅明确原文分词与主句的先后关系，并以更自然的“赶出”表达强制驱逐；其余措辞保留原译的准确性、现代书面语体和比喻语境。
