review_pass:
  verdict: revise
  source_fidelity: 译文准确传达了先把儿子逐出葡萄园、随后杀死他的事件次序，以及园主将如何回应佃户的推问。为更清楚显出分词动作先于主要动词，宜明示“后”。
  naturalness: “葡萄园主会怎样处置他们呢？”自然、庄重，也适合此处比喻叙事。“把他扔出葡萄园，杀了他”虽可理解，但两个并列动词对先后关系的表达不如加“后”明确；“赶出”也比“扔出”更合乎现代汉语中强制驱逐的常用说法。
  terminology: “葡萄园主”恰当对应此处比喻叙事中的ὁ κύριος τοῦ ἀμπελῶνος，不应译作带有直接神圣称号色彩的“主”。“处置”在上下文中可传达ποιήσει αὐτοῖς所问的报应性行动，未不当添加具体惩罚方式。
  issues:
