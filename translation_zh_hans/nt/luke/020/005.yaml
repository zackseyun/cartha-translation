id: LUK.20.5
reference: Luke 20:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οἱ δὲ συνελογίσαντο πρὸς ἑαυτοὺς λέγοντες ὅτι Ἐὰν εἴπωμεν· Ἐξ οὐρανοῦ, ἐρεῖ· Διὰ τί οὐκ ἐπιστεύσατε αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/005.yaml
  text: But they reasoned among themselves[a], saying, “If we say, ‘From heaven,’ he will say[b], ‘Why did you not believe him?’”
translation:
  language: zh_hans
  text: 他们却彼此商议说：“如果我们说：‘是从天上来的’，他就会说：‘你们为什么不信他〔a〕呢？’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνελογίσαντο πρὸς ἑαυτοὺς
  choice: 彼此商议
  rationale: 动词表示推想、权衡或商议，介词短语表明这是他们内部的共同商议；“彼此商议”既自然，也保留其审慎权衡的意味。
- source_word: Ἐὰν εἴπωμεν
  choice: 如果我们说
  rationale: 自然表达第三类条件句所表示的假设。
- source_word: Ἐξ οὐρανοῦ
  choice: 是从天上来的
  rationale: 保留“天上”这一指向神圣来源或授权的原文委婉说法；补出“是……来的”，使省略式回答在现代汉语中完整自然。
- source_word: ἐρεῖ
  choice: 他就会说
  rationale: 原文用普通的“说”，虽然其后内容是问句，仍不必解释性改译为“问”。
- source_word: ἐπιστεύσατε αὐτῷ
  choice: 不信他
  rationale: πιστεύω 加与格在此指相信或信任约翰及其见证；“信他”贴合句法，也避免译成“信奉他”所可能带来的过强宗教含义。
theological_decisions:
- issue: “从天上”所指的来源
  choice: 保留“从天上来的”
  alternative: 从神来的
  rationale: 上下文暗示神的权柄，但原文明确使用“天上”这一委婉表达；直译可保留原文措辞及其神学含意，而不将暗示直接解释出来。
- issue: πιστεύω αὐτῷ 的信心含义
  choice: 信他
  alternative: 信任他
  rationale: 这里首先涉及是否接受约翰所宣讲的见证。“信他”兼容“相信其话”和“信任其人”，不扩大为更强的“信奉他”。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事表达。“却”承接上文的转折；引语层级用中文全角标点清楚区分。
