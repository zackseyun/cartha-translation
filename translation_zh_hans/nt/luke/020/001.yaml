id: LUK.20.1
reference: Luke 20:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν μιᾷ τῶν ⸀ἡμερῶν διδάσκοντος αὐτοῦ τὸν λαὸν ἐν τῷ ἱερῷ καὶ εὐαγγελιζομένου ἐπέστησαν οἱ ⸀ἀρχιερεῖς καὶ οἱ γραμματεῖς σὺν τοῖς πρεσβυτέροις,
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/001.yaml
  text: And it happened[a], on one of those days, while he was teaching the people in the temple and proclaiming the good news, that the chief priests and the scribes, together with the elders, came up to him[b],
translation:
  language: zh_hans
  text: 有一天，耶稣在圣殿[a]里教导百姓、传扬好消息[b]的时候，祭司长、经学家和长老一同来到他面前，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“圣殿”指整个圣殿区域，并非特指内殿。
    reason: cultural_note
  - marker: b
    text: 或译：“传福音”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο ἐν μιᾷ τῶν ἡμερῶν
  choice: 有一天
  rationale: 这是路加常用的叙事过渡语。合译为“有一天”既自然简洁，也保留了在当前事件进程中某个未指明日子的含义；若逐字译出“事情发生了”，现代汉语会显得累赘。
- source_word: διδάσκοντος αὐτοῦ τὸν λαόν
  choice: 耶稣……教导百姓……的时候
  rationale: 以时间从句表达属格独立结构所指的同时进行关系；补出“耶稣”以避免现代汉语中的代词指向不清。“百姓”比“群众”更能涵盖 λαός 所指的一般民众。
- source_word: ἐν τῷ ἱερῷ
  choice: 在圣殿里
  rationale: 采用现代中文圣经语境中通行而庄重的说法；ἱερόν 在这里指整个圣殿区域，而非特指内殿，故以脚注说明。
- source_word: εὐαγγελιζομένου
  choice: 传扬好消息
  rationale: 保留动词“宣告好消息”的基本语义，语言通俗自然，也避免在这一叙事场景中直接采用较具后期教会术语色彩的表达。
- source_word: ἐπέστησαν
  choice: 来到他面前
  rationale: 表达这些领袖直接来到耶稣跟前的动作，同时不把上下文中的敌意过度写入本动词；“质问”或“对峙”都超出了词本身。
- source_word: οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς σὺν τοῖς πρεσβυτέροις
  choice: 祭司长、经学家和长老一同
  rationale: “祭司长”准确指第二圣殿时期的祭司领导群体；“经学家”保留 γραμματεῖς 作为历史群体的身份，又比“文士”更便于现代读者理解；“一同”体现 σύν 所强调的同行与联合。
theological_decisions:
- issue: 如何翻译 εὐαγγελιζομένου，既保留其福音含义又不使叙事表达术语化
  choice: 传扬好消息
  alternative: 传福音
  rationale: 此处描述耶稣公开宣讲的行动。“传扬好消息”直接呈现该词的词汇意义；“传福音”也是可能译法，但在现代汉语中更容易被理解为固定的教会活动术语。脚注保留这一传统译法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“教导百姓、传扬好消息”保持两个分词动作并列；句末用逗号，承接下一节中这些领袖所说的话。英文咨询层的脚注标记位置与脚注内容不相符，本稿依据希腊原文所涉及的词语，将圣殿说明置于“圣殿”后，将词汇异译置于“好消息”后。
