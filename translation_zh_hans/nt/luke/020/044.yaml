  yaml_path: translation/nt/luke/020/044.yaml
  text: David therefore calls him Lord[a], so how is he his son?
translation:
  language: zh_hans
  text: 大卫既然称他为“主”，他又怎么会是大卫的儿子[a]呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“后裔”。希腊文作“他的儿子”；在王朝或谱系语境中，这个词也可指后代。正文保留了本句论证所用的明确称谓。
    reason: lexical_alternative
lexical_decisions:
- source_word: Δαυὶδ
  choice: 大卫
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: οὖν
  choice: 既然
  rationale: 在这一反问句中表达由前述引文推出的逻辑前提，与后面的“怎么会”自然衔接。
- source_word: αὐτὸν κύριον
  choice: 称他为“主”
  rationale: 准确反映“称他为主”的结构；“主”保留 κύριος 在弥赛亚论证中的尊称及神学分量，不额外强化其含义。
- source_word: καλεῖ
  choice: 称……为
  rationale: 直接表达 καλεῖ 的现在时陈述，在中文中简洁自然。
- source_word: καὶ πῶς
  choice: 他又怎么会
  rationale: 用“又”承接前后称谓之间形成的张力，并以“怎么会”自然表达反问。
- source_word: αὐτοῦ υἱός
  choice: 大卫的儿子
  rationale: υἱός 明说“儿子”；重复“大卫”可避免中文代词指向含混，同时保留论证所依赖的亲子称谓。
- source_word: ἐστιν
  choice: 会是
  rationale: 在中文反问句中自然表达 ἐστιν 的“是”，不改变其时态或命题内容。
theological_decisions:
- issue: 弥赛亚论证中 κύριος 的译法
  choice: 主
  alternative: 主人
  rationale: “主”既符合 κύριος 的基本语义，也保留大卫以尊称称呼弥赛亚所形成的身份与地位张力；“主人”在此过于日常且会削弱经文的互文分量。
- issue: 是否把 υἱός 扩译为“后裔”
  choice: 儿子
  alternative: 后裔
  rationale: 虽然“儿子”在王朝和谱系语境中可以泛指后裔，但希腊文明确使用 υἱός。正文保留“儿子”，不替读者消解耶稣反问中的张力；较宽的谱系含义置于脚注。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“既然……又怎么会……”清楚呈现推论式反问；引号标明“主”是大卫对那一位的称呼。
