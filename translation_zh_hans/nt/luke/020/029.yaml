base_translation:
  language: en
  yaml_path: translation/nt/luke/020/029.yaml
  text: There were seven brothers; and the first[a], having taken a wife, died childless.
translation:
  language: zh_hans
  text: 那么，有兄弟七人；第一个娶了妻子[a]，无子而死。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊语直译为“取了一个妻子”，是“娶妻、结婚”的习惯说法。
    reason: 说明原文婚姻习语及较直译的表达。
lexical_decisions:
- source_word: ἑπτὰ οὖν ἀδελφοὶ ἦσαν
  choice: 那么，有兄弟七人
  rationale: “七”和“兄弟”按原文直译；“那么”简洁表达 οὖν 在假设叙述中的承接作用，不把它强化为严格的因果推论。
- source_word: ὁ πρῶτος
  choice: 第一个
  rationale: 表示七兄弟中依次提到的第一人；原文并未明确说他年龄最大，因此不译作“长兄”。
- source_word: λαβὼν γυναῖκα
  choice: 娶了妻
  rationale: 这是表示男子结婚的希腊语习语。汉语“娶了妻”自然、准确，并保留原文以妻子为宾语的表达特点。
- source_word: ἀπέθανεν ἄτεκνος
  choice: 没有孩子就死了
  rationale: 准确表达他死时无子女的状态；“孩子”是现代汉语中自然且不限定性别的说法，也保留该情节在娶寡嫂制度背景下的关键意义。
