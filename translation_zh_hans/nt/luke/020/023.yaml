  text: κατανοήσας δὲ αὐτῶν τὴν πανουργίαν εἶπεν πρὸς ⸀αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/023.yaml
  text: But perceiving their cunning[a], he said to them,
translation:
  language: zh_hans
  text: 耶稣看出了他们的诡诈[a]，就对他们说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“狡猾”“奸计”或“欺诈”。希腊语πανουργία指精明却不择手段的谋算。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατανοήσας
  choice: 看出了
  rationale: 该词为不定过去时分词，表示耶稣在开口前已经察觉并辨明他们的用心；“看出了”自然地兼顾察觉与洞悉之意。
- source_word: δὲ
  choice: 就
  rationale: δέ在这里表示轻微转折或叙事推进。汉语借上下文即可显出对照，以“就”衔接耶稣察觉诡诈后的回应，比生硬加入“但是”更自然。
- source_word: αὐτῶν
  choice: 他们的
  rationale: 属格代词修饰πανουργίαν，译为汉语领属结构“他们的”。
- source_word: πανουργίαν
  choice: 诡诈
  rationale: πανουργία指精明却不择手段的算计或图谋；“诡诈”既保留其负面道德色彩，也兼有欺骗与狡猾谋算之意。
- source_word: εἶπεν
  choice: 说
  rationale: λέγω的叙事性不定过去时，采用现代汉语最自然的常规译法“说”。
- source_word: πρὸς αὐτούς
  choice: 对他们
  rationale: πρός加宾格用于说话动词后，指出言语的对象；“对他们说”准确而自然。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通俗的叙事语言。“看出了”避免把κατανοέω过度强化为超自然洞察；“诡诈”保留πανουργία所含的狡猾谋算及负面道德意味。主语“耶稣”由上下文补出，使独立经节在汉语中清楚自然。
