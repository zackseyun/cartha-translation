id: LUK.20.33
reference: Luke 20:33
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ⸂ἡ γυνὴ οὖν ἐν τῇ⸃ ἀναστάσει τίνος αὐτῶν γίνεται γυνή; οἱ γὰρ ἑπτὰ ἔσχον αὐτὴν γυναῖκα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/033.yaml
  text: In the resurrection[a], then[c][b], whose wife does the woman become? For the seven had her as wife.
translation:
  language: zh_hans
  text: 那么，复活时，这女人会成为他们中谁的妻子呢？因为这七个人都曾娶她为妻。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ γυνή
  choice: 这女人
  rationale: γυνή既可指“女人”，也可指“妻子”；此处首次出现时是指前文所说的那名女子，故译为“这女人”。
- source_word: οὖν
  choice: 那么
  rationale: οὖν承接并推进撒都该人的推论；“那么”自然地保留了这种论证语气。
- source_word: ἐν τῇ ἀναστάσει
  choice: 复活时
  rationale: 这里指复活发生之时；“复活时”是自然简洁的现代汉语表达，也没有添加“死人”等原文未明说的限定。
- source_word: τίνος αὐτῶν
  choice: 他们中谁的
  rationale: τίνος是属格疑问代词，询问婚姻归属关系；“他们中谁的”准确表达这一结构。
- source_word: γίνεται
  choice: 会成为
  rationale: γίνομαι含有“成为”的动态意味；“会成为”也适合该假设性问题的语境，避免弱化为单纯的“是”。
- source_word: οἱ γὰρ ἑπτὰ
  choice: 因为这七个人
  rationale: 定冠词加数词指前文已经提到的七兄弟；“这七个人”在汉语中指代清楚，并未额外加入原文没有的“都”于该短语本身。
- source_word: ἔσχον αὐτὴν γυναῖκα
  choice: 都曾娶她为妻
  rationale: 该结构直指七人先后与她有夫妻关系。“娶她为妻”是自然且贴近原意的汉语；“都曾”表达七人无一例外且事情发生在过去。
theological_decisions:
- issue: 撒都该人问题中的“复活”用语
  choice: 直接译作“复活”，不加解释性限定
  alternative: 译作“死人复活”
  rationale: 本节只使用ἀνάστασις；不从上下文补入“死人”，以保留说话者原有的措辞和问题所包含的神学张力。
translation_notes:
  register: 采用现代、庄重而口语自然的问句。“这女人”与后面的“妻子”区分了γυνή在同一节中的两种语境意义；“娶她为妻”比生硬的“以她为妻”更符合现代普通话，同时保留婚姻关系的明确含义。
