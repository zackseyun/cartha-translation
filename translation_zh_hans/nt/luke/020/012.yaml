  text: And he sent a third[a]; but they wounded this one also and threw him out.
translation:
  language: zh_hans
  text: 他又打发第三个去[a]；但那些佃户也把他打伤，赶了出去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“他加上打发第三个去”。这里“加上”与不定式连用，是表示继续或进一步采取行动的惯用说法，也可译为“他又打发第三个去”。
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέθετο
  choice: 又接着
  rationale: προστίθημι与不定式连用，在这里表示继续或进一步采取同一行动。“又接着”既自然，也保留了行动反复推进的意味。
- source_word: τρίτον πέμψαι
  choice: 打发第三个去
  rationale: 希腊文省略了受差者的身份，因为上文已经表明是仆人。中文保留“第三个”的省略表达，既忠于原文，也能由上下文清楚理解。
- source_word: οἱ δὲ
  choice: 但那些佃户
  rationale: δέ在此引出与园主行动相对的回应，译作“但”；把上下文中的主语“佃户”明说出来，可避免现代中文中代词指向不清。
- source_word: καὶ τοῦτον
  choice: 也把他
  rationale: καί表示第三个受差者也遭到同样对待；“也把他”在中文中自然地传达这种追加和重复。
- source_word: τραυματίσαντες
  choice: 打伤
  rationale: τραυματίζω指使人受伤或造成创伤。“打伤”结合本段暴力语境，比泛泛的“伤害”更具体自然。
- source_word: ἐξέβαλον
  choice: 扔了出去
  rationale: ἐκβάλλω在此具有强行逐出的意味。“扔了出去”保留动作的暴力色彩，并符合现代中文叙事表达。
theological_decisions: []
