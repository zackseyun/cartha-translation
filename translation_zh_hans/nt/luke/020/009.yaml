  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ἤρξατο δὲ πρὸς τὸν λαὸν λέγειν τὴν παραβολὴν ταύτην· ⸀Ἄνθρωπος ἐφύτευσεν ἀμπελῶνα, καὶ ἐξέδετο αὐτὸν γεωργοῖς, καὶ ἀπεδήμησεν χρόνους ἱκανούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/009.yaml
  text: 'Then he began to tell the people this parable: “A man planted a vineyard[a], and leased it to farmers, and went away for a considerable time.”'
translation:
  language: zh_hans
  text: 随后，耶稣开始对百姓讲这个比喻：“有一个人栽了一个葡萄园，把园子租给农夫，便离乡远行[a]，在外很久。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“到外地去了。”这个动词指离开自己的家乡或居住地，有时也可含有到国外去的意思。
    reason: 说明ἀποδημέω的词义范围，并保留地点是否为国外的不确定性。
lexical_decisions:
- source_word: Ἤρξατο δὲ
  choice: 随后，耶稣开始
  rationale: δὲ承接叙事，译作“随后”自然显示场景推进；ἤρξατο表示开始这一讲述行为。汉语补出主语“耶稣”，使独立经节清楚，但未增加新的所指。
- source_word: πρὸς τὸν λαὸν λέγειν
  choice: 对百姓讲
  rationale: πρός加宾格表示说话所面向的对象；λαός保留其集体性的“百姓”之义，不特定译成“群众”；λέγειν与“比喻”搭配时译作“讲”符合现代汉语习惯。
- source_word: τὴν παραβολὴν ταύτην
  choice: 这个比喻
  rationale: “比喻”是福音书中παραβολή的通行译法，也保留其文类及经文间的呼应。
- source_word: Ἄνθρωπος
  choice: 有一个人
  rationale: 此处引入故事中的一名男性人物；“有一个人”是汉语叙事自然的起句，也不把它泛化为人类。
- source_word: ἐφύτευσεν ἀμπελῶνα
  choice: 栽了一个葡萄园
  rationale: φυτεύω的基本义是栽种；“栽了一个葡萄园”既贴近原文，也符合现代汉语表达。
- source_word: ἐξέδετο αὐτὸν γεωργοῖς
  choice: 把园子租给农夫
  rationale: ἐκδίδωμι在地产语境中指租出；γεωργοί指耕作者或农夫。租佃关系已由“租给”清楚表达，无须把名词本身窄化为“佃户”。
- source_word: ἀπεδήμησεν
  choice: 离乡远行
  rationale: 该动词表示离开自己的居住地外出，可能但不必然指去国外；“离乡远行”保留这一范围，脚注说明较具体的可能含义。
- source_word: χρόνους ἱκανούς
  choice: 在外很久
  rationale: 复数χρόνους与ἱκανούς构成表示相当长时段的表达；结合前面的远行，汉语译作“在外很久”简洁自然。
theological_decisions:
- issue: Ἄνθρωπος所引入人物的性别与具体性
  choice: 有一个人
  alternative: 有个人／有人
  rationale: 上下文引入具体的男性园主形象。“有一个人”既忠实于阳性单数形式，又避免把它解释成关于一般人类的陈述。
- issue: 园主远行地点是否明确为国外
  choice: 正文作“离乡远行”，不明确指定出国
  alternative: 到外国去了／出国远行
  rationale: ἀποδημέω可用于离开本地甚至出国，但本节没有明确说明目的地；正文不把可能含义提升为确定事实，以保留原文的开放度。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“百姓”“比喻”“葡萄园”等保留福音书语体；“租给农夫”“在外很久”则避免生硬或过度古雅。
