id: LUK.20.8
reference: Luke 20:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Οὐδὲ ἐγὼ λέγω ὑμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/008.yaml
  text: And Jesus said to them[a], “Neither will I tell you by what authority I do these things.”
translation:
  language: zh_hans
  text: 耶稣对他们说：“我也不告诉你们，我凭什么权柄[a]做这些事。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“以什么权柄”。
    reason: 保留ἐν ποίᾳ ἐξουσίᾳ在汉语中的另一种自然表达；“凭”较突出行动所依据的授权，“以”则更贴近介词形式，两者在本处意义相近。
lexical_decisions:
- source_word: Οὐδὲ ἐγώ
  choice: 我也不
  rationale: οὐδέ承接上一节宗教领袖拒绝回答的话，表达对应性的否定；“我也不”在现代汉语中自然地保留了“既然你们不说，我也不说”的回应意味，而不额外添加解释。
- source_word: λέγω ὑμῖν
  choice: 告诉你们
  rationale: λέγω与间接宾语ὑμῖν及其后的间接疑问内容连用，此处译作“告诉你们”比直译“对你们说”更符合汉语表达，准确传达耶稣不披露答案。
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: 凭什么权柄
  rationale: 介词短语表示耶稣行动所依据的授权或正当资格。“凭什么权柄”既自然，又保留“依据何种权威”的含义；“以什么权柄”亦可。
- source_word: ἐξουσίᾳ
  choice: 权柄
  rationale: 这里的ἐξουσία指行事的合法权威、权限或授权，不只是能力或力量；“权柄”准确表达这一语境，同时保持庄重。
- source_word: ταῦτα
  choice: 这些事
  rationale: 保留希腊文复数指示词，回指受到质疑的多项行动。
- source_word: ποιῶ
  choice: 做
  rationale: 以自然的汉语一般现在表达持续有效的行动，不必强化为“正在做”。
- source_word: καὶ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: 耶稣对他们说
  rationale: 准确表达叙事引语和间接宾语；汉语中省略句首连接词比机械译出καί更自然，且不损失语篇衔接。
theological_decisions:
- issue: 耶稣拒绝回答宗教领袖
  choice: 直接表述耶稣也不向他们说明自己权柄的依据
  alternative: 将此举解释为逃避问题，或在译文中明说这是对他们不信的审判
  rationale: 原文只陈述耶稣拒绝告知，并以οὐδέ把这一回应与他们先前的拒答相连；译文不额外判定其动机或神学意义，以保留叙事张力。
translation_notes:
  register: 采用现代、简洁而庄重的标准普通话。“我也不告诉你们”自然承接上文的拒答；“权柄”符合经文语境中合法权威或授权的含义。脚注标记紧接存在译法差异的短语。
