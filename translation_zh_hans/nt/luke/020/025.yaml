  rationale: 修改仅处理“归还”可能造成的语义收窄。译文以“属于……的”表达希腊文“……的东西”的归属关系，以“归给”表达命令式ἀπόδοτε所含交付其应得之物的意思；仍未界定凯撒或神各自所涵盖的范围。保留“却”“那么”以反映δέ和τοίνυν的语篇作用，并保留两分句的平行结构。
