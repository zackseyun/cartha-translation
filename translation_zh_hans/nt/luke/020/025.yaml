  text: ὁ δὲ εἶπεν ⸂πρὸς αὐτούς· Τοίνυν ἀπόδοτε⸃ τὰ Καίσαρος Καίσαρι καὶ τὰ τοῦ θεοῦ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/025.yaml
  text: But he said to them[a], “Then give back to Caesar the things that are Caesar’s, and to God the things that are God’s.”
translation:
  language: zh_hans
  text: 耶稣却对他们说：“那么，属于凯撒的，要归给凯撒；属于神的，要归给神。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “归给”也可译作“交给”或“缴给”；这个动词可指给予、缴付，或把应当归给对方的交还给对方。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἶπεν πρὸς αὐτούς
  choice: 耶稣却对他们说
  rationale: 希腊文直译为“他却对他们说”。中文明确主语为“耶稣”，便于单节独立阅读；δέ在此表示轻微转折，译作“却”符合问答语境，不过分强化对立。
- source_word: Τοίνυν
  choice: 那么
  rationale: 表示根据前文作出推论或收束，现代汉语“那么”自然保留其承接和推论语气。
- source_word: ἀπόδοτε
  choice: 归还
  rationale: ἀποδίδωμι可指给予、缴付或交还应当归给对方之物。“归还”凸显归给其所属者或偿付所当得之物的含义，同时脚注保留“交给”的可能译法。
- source_word: τὰ Καίσαρος Καίσαρι
  choice: 凯撒的东西要归还凯撒
  rationale: 保留原文宽泛的中性复数表达和重复“凯撒”的平行结构，不把范围缩窄为税款。
- source_word: Καίσαρος / Καίσαρι
  choice: 凯撒
  rationale: 按专名兼帝王称号音译，较“皇帝”更贴近原文，并与经文传统称谓一致。
- source_word: τὰ τοῦ θεοῦ τῷ θεῷ
  choice: 神的东西要归还神
  rationale: 与前半句形成对称，保留原文对两种归属和责任的并列表达，不额外界定其范围。
- source_word: θεοῦ / θεῷ
  choice: 神
  rationale: 语境所指是以色列的神；采用现代中文圣经中清楚、庄重且通行的称谓。
theological_decisions:
- issue: 对政治权柄与对神之责任的范围
  choice: 保留“凯撒的东西”与“神的东西”的平行义务，不具体划定两者各自范围。
  alternative: 将经文解释为政教严格分离、国家拥有无限权力，或仅仅是在命令纳税。
  rationale: 原文提出按归属交付的原则，却没有在本句中建立完整的政治神学或明确划界；译文应保留其广度与神学张力。
translation_notes:
  register: 采用现代、庄重而通顺的标准普通话。“凯撒的东西……神的东西……”保留原文简洁有力的平行结构；脚注标记置于整句引语之后。
