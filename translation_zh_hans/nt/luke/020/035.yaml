  source_fidelity: 原译“被算为配得”较好保留了καταξιωθέντες的被动判断意味，“那时代”和“既不娶，也不嫁”也相当贴合原文。然而，“进入那时代、并从死人中复活的人”容易把“从死人中复活”误解为修饰“人”的既成状态，且未清楚表达τυχεῖν同时统辖“那时代”和“复活”。改为“承受那时代和从死人中复活”可明确二者都是所获得／有分的对象。
  naturalness: “蒙算配得承受”在现代庄重的圣经汉语中自然可懂；“那时代”保留原文指示语及其语境张力。“既不娶，也不嫁”简洁、自然，并恰当保留两个婚姻动词的对应。
  terminology: “蒙算配得”保留被动的评价含义，不预断其依据；“承受”自然表达τυχεῖν在此“得以获得／有分于”的意思，并同时适用于“那时代”和“从死人中复活”。“从死人中复活”保留ἐκ νεκρῶν的表达。
