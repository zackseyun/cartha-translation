  text: οἱ δὲ καταξιωθέντες τοῦ αἰῶνος ἐκείνου τυχεῖν καὶ τῆς ἀναστάσεως τῆς ἐκ νεκρῶν οὔτε γαμοῦσιν οὔτε ⸀γαμίζονται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/035.yaml
  text: But those who are considered worthy to attain that age and the resurrection from the dead neither marry nor are given in marriage[a][b].
translation:
  language: zh_hans
  text: 但那些蒙算配得承受那时代和从死人中复活的人，既不娶，也不嫁[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “蒙算配得”也可译作“被认定为配得”。希腊语采用被动形式，表示这些人受到是否配得的判断。
    reason: lexical_alternative
  - marker: b
    text: “那时代”也可译作“将来的时代”；原文直译为“那时代”。
    reason: lexical_alternative
lexical_decisions:
- source_word: καταξιωθέντες
  choice: 被算为配得
  rationale: 保留希腊语被动分词的判断意味，表明他们被认定为配得，而不直接断言其自身具有功德。
- source_word: τοῦ αἰῶνος ἐκείνου
  choice: 那时代
  rationale: 紧贴指示语“那”，并以“时代”表达 αἰών 所指与现今相对的末世时代，避免直接增译为“来世”。
- source_word: τυχεῖν
  choice: 进入……并……复活
  rationale: 此处动词支配两个并列属格对象；中文以共享结构自然表达“得以有分于”的意思，同时避免生硬地说“获得复活”。
- source_word: ἀναστάσεως τῆς ἐκ νεκρῶν
  choice: 从死人中复活
  rationale: 自然、准确地表达复活以及 ἐκ νεκρῶν 的“从死人中”之意。
- source_word: γαμοῦσιν
  choice: 娶
  rationale: 与下文被动形式构成古代婚姻表达中的性别对应，中文“娶”简洁自然。
- source_word: γαμίζονται
  choice: 嫁
  rationale: 以中文惯用的“嫁”传达被给予婚配的被动社会角色，同时避免较生硬的“被嫁出去”。
theological_decisions:
- issue: καταξιωθέντες 是否暗示人凭功德赚取复活生命
  choice: 译为“被算为配得”，保留被判断为配得的被动意味
  alternative: 译为“配得”或“有资格”
  rationale: 原文没有明说判断者，也没有解释配得的根据；译文既不引入靠行为赚取的教义，也不消除原文关于被认定为配得的张力。
- issue: “那时代”是否应明确解释为“来世”
  choice: 保留“那时代”
  alternative: 译为“来世”或“将来的时代”
  rationale: 指示语与上下文已形成末世对比；保留较直译的表达可避免超出本节而提前解释其具体性质。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“被算为配得”保留判断性的被动语态；“既不娶，也不嫁”用简洁的中文婚姻对偶表达原文两个不同动词。脚注标记均置于相关正文中。
