  to: 但那些蒙算配得承受那时代和从死人中复活的人，既不娶，也不嫁[a][b]。
  rationale: 修订仅澄清原文不定式“得着／获得”与两个并列对象的关系，避免将“从死人中复活”误作单纯修饰“人”的状态。保留原译对被动评价、末世性“那时代”及婚姻动词对偶的处理。
