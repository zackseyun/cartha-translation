  text: ⸀Καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Οἱ υἱοὶ τοῦ αἰῶνος τούτου γαμοῦσιν καὶ ⸀γαμίσκονται,
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/034.yaml
  text: And Jesus said to them[a], “The sons of this age marry and are given in marriage,”
translation:
  language: zh_hans
  text: 耶稣对他们说：“今世之人[a]有娶有嫁，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“今世之子”，是指属于现今这个时代的人，并非只指男性。
    reason: 说明希腊文阳性代表性表达及其归属含义，避免正文被误读为仅指男性。
lexical_decisions:
- source_word: Καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς
  choice: 耶稣对他们说
  rationale: 以现代汉语自然语序表达简单的叙事连接和说话动作；上下文虽是回应，εἶπεν本身只是“说”，不必译成“回答”。句首Καὶ在汉语中可由上下文自然承接，无须机械译出“而且”。
- source_word: Οἱ υἱοὶ τοῦ αἰῶνος τούτου
  choice: 今世之人
  rationale: υἱοὶ在此是表示归属和特征的闪语式表达，并非只指男性；译为“今世之人”准确传达泛指意义，同时保留αἰών所指的末世论时代范畴。脚注注明原文直译，以保留其性别形式和修辞特色。
- source_word: γαμοῦσιν καὶ γαμίσκονται
  choice: 有娶有嫁
  rationale: 用简洁自然的汉语成对表达主动“娶”和被动“嫁”，保留希腊文两个动词在传统婚姻角色上的区别，而不笼统合并为“结婚”。
theological_decisions:
- issue: 带阳性形式的泛指表达
  choice: 正文译“今世之人”，脚注说明直译“今世之子”
  alternative: 今世之子
  rationale: 此处论及今世的人普遍娶嫁，语义显然不只限男性。中文若直译“今世之子”，容易被普通读者误解为仅指男性；正文传达其代表性泛指意义，脚注保留原文形式及归属含义。
- issue: αἰών所表达的时代范畴
  choice: 今世
  alternative: 这个世界
  rationale: “今世”保留现今时代与下文来世之间的对照；“这个世界”容易使人理解为物质世界或空间范畴。
- issue: 婚姻动词的主动与被动对举
  choice: 有娶有嫁
  alternative: 结婚
  rationale: 保留γαμοῦσιν与γαμίσκονται之间的形式和角色差异，不将其神学化，也不把两者合并而损失原文对举。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“今世”承载与来世相对的时代含义；“有娶有嫁”简练保留原文主动与被动的平行结构。
