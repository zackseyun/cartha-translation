source:
  edition: SBLGNT
  text: ὁ δὲ ἐμβλέψας αὐτοῖς εἶπεν· Τί οὖν ἐστιν τὸ γεγραμμένον τοῦτο· Λίθον ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες, οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/017.yaml
  text: 'But he looked at them and said[a], “What then is this that has been written: ‘The stone that the builders rejected, this one has become the head of the corner’?”'
translation:
  language: zh_hans
  text: 他注视着他们，说：“那么，经上所记的这话是什么意思呢？‘匠人所弃的石头，这块石头已成了房角之首[a]。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“房角石”；也可理解为“压顶石”。希腊文直译为“角的头（或首）”。
    reason: 保留 κεφαλὴ γωνίας 所指建筑构件的真实歧义。
lexical_decisions:
- source_word: ἐμβλέψας
  choice: 注视着
  rationale: 该词表示有意地把目光投向对方；“注视着”比普通的“看着”更能体现其专注意味，又不至于夸大为怒视。
- source_word: Τί οὖν ἐστιν τὸ γεγραμμένον τοῦτο
  choice: 那么，经上所记的这话是什么意思呢
  rationale: 按现代汉语习惯表达这里的反问，同时以“经上所记”体现 γεγραμμένον 的经文引用语境和完成、被动含义。
- source_word: Λίθον
  choice: 石头
  rationale: 在诗篇引文中指那块特定的石头；汉语不依靠冠词，无须另加“那块”。
- source_word: ἀπεδοκίμασαν
  choice: 所弃
  rationale: “弃”简洁表达建造者判定其不合用而拒绝的意思，并适合诗篇引文的庄重语体。
- source_word: οἱ οἰκοδομοῦντες
  choice: 匠人
  rationale: 指从事建造的人；“匠人”是自然、凝练且适合该建筑隐喻的汉语表达。
- source_word: οὗτος
  choice: 已成了（由上下文承接同一块石头）
  rationale: 希腊文以指示代词强调被弃的正是后来居首的那块石头。汉语由前句主语自然承接，可保留这种对照而不必生硬重复“这块石头”。
- source_word: ἐγενήθη εἰς
  choice: 已成了
  rationale: “已”体现变化已经发生及其结果，“成了”自然表达进入新的地位。
- source_word: κεφαλὴν γωνίας
  choice: 房角之首
  rationale: 贴近希腊文“角的头/首”，保留具体建筑位置究竟指房角石还是压顶石的歧义，并以脚注说明常见理解。
theological_decisions:
- issue: 诗篇118:22引文中的建筑隐喻
  choice: 房角之首
  alternative: 房角石；压顶石
  rationale: 希腊短语 κεφαλὴ γωνίας 的具体建筑所指存在争议。正文采用较透明的表达，不预先断定是奠基处的房角石还是顶部的压顶石；常见译法列入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“经上所记”清楚显示这是经文引语；引文略带凝练的诗体色彩。“房角之首”刻意保留原文建筑意象的开放性。
