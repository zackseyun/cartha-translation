  text: 直到我使你的仇敌成为给你双脚作脚凳。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕως ἂν
  choice: 直到
  rationale: 该组合表示将来的期限或终点；“直到”在现代汉语中自然准确，不必扩写。
- source_word: θῶ
  choice: 使……成为
  rationale: τίθημι本义为“放置”，但在诗篇引文的比喻结构中带有结果含义；“使……成为”既自然，也保留原句意象。
- source_word: τοὺς ἐχθρούς σου
  choice: 你的仇敌
  rationale: 直接对应带第二人称所属关系的宾语；“仇敌”庄重而通俗，不弱化敌对含义。
- source_word: ὑποπόδιον
  choice: 脚凳
  rationale: 准确表达供脚踏放的小凳，并保留诗篇110:1的王权与降服意象。
- source_word: τῶν ποδῶν σου
  choice: 你的脚凳
  rationale: 原文直译为“你双脚的脚凳”。汉语“你的脚凳”自然简洁，也没有把比喻直接解释成“在你脚下”。
theological_decisions:
- issue: 诗篇110:1引文中的降服意象
  choice: 保留“使你的仇敌成为你的脚凳”的比喻
  alternative: 使你的仇敌伏在你脚下
  rationale: 原文没有直接说明“彻底击败”或“统治”，而是保留王权性的脚凳意象；译文不越过文本去解释其基督论含义。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“仇敌”与“脚凳”保留经文引语的庄严语体和鲜明意象；主文以自然汉语表达结果关系，脚注补出较贴近原文“放置”的措辞。
