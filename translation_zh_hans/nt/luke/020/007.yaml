  text: καὶ ἀπεκρίθησαν μὴ εἰδέναι πόθεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/007.yaml
  text: So they answered that they did not know where it was from[a].
translation:
  language: zh_hans
  text: 于是，他们回答说不知道是从哪里来的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“来自何处。”希腊语所问的是来源或出处。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: 于是
  rationale: 这里承接前文商议后的回应；用“于是”自然表达叙事推进及轻微的结果意味，比机械译作“和”更符合现代汉语。
- source_word: ἀπεκρίθησαν
  choice: 他们回答说
  rationale: ἀποκρίνομαι在叙事中通常表示“回答、答复”；“回答说”也自然引出后面的间接引语。
- source_word: μὴ εἰδέναι
  choice: 不知道
  rationale: 在“回答”之后，不定式与μή构成间接引语，意为他们声称“不知道”；汉语无需保留希腊语不定式形式。
- source_word: πόθεν
  choice: 是从哪里来的
  rationale: πόθεν询问来源或出处；结合上文，它指约翰的洗礼从何而来，但正文不明说所指，以保留原文的省略。
theological_decisions:
- issue: 是否补明πόθεν所指的是约翰洗礼的权柄来源
  choice: 正文保留省略，仅译“是从哪里来的”
  alternative: 译作“约翰的洗礼是从哪里来的”或“它的权柄来自哪里”
  rationale: 希腊原文只用πόθεν，并未在本节重述对象；保留省略既忠于原文，也避免把“来源”进一步解释为特定的神学概念。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“于是”衔接前文，“回答说不知道”符合自然汉语；脚注标记已在正文中对应出现。
