  source_fidelity: 草稿准确传达撒都该人中的几个人接近耶稣、其否认复活的立场，以及随后向他发问的基本内容。不过，“来见”较弱，未充分表达趋近；“他们说没有复活这回事，就问他”虽可理解，但以“并问他”更清楚地保留原文分词说明与主要动词的关系。
  naturalness: 整体为自然的现代汉语。将“来见”调整为“前来见”，并将“就问他”改为“并问他”，叙述衔接更顺畅、庄重，也避免“就”可能附加的时间顺承强调。
  terminology: “撒都该人”是通行且合宜的名称。“复活”准确对应ἀνάστασις；“否认有复活”比“没有复活这回事”更简洁庄重，并较贴近原文所陈述的否定立场。
