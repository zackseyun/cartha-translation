  text: Προσελθόντες δέ τινες τῶν Σαδδουκαίων, οἱ ⸀ἀντιλέγοντες ἀνάστασιν μὴ εἶναι, ἐπηρώτησαν αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/027.yaml
  text: Then some of the Sadducees[a], who deny that there is a resurrection, came up and questioned him,
translation:
  language: zh_hans
  text: 有几个撒都该人前来见耶稣；他们否认有复活，并问他：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Προσελθόντες
  choice: 来见
  rationale: 该不定过去时分词表示先于主要动词发生的趋近动作；“来见”自然地表达他们走近耶稣并与他交谈。
- source_word: δέ
  choice: （不单独译出）
  rationale: 此处主要承接叙事；汉语无需机械加入“然后”，即可自然推进情节。
- source_word: τινες τῶν Σαδδουκαίων
  choice: 有几个撒都该人
  rationale: 保留部分属格的含义，表明来的是撒都该人中的几位。
- source_word: οἱ ἀντιλέγοντες
  choice: 他们说……没有
  rationale: ἀντιλέγω本可指反驳、否认或声称相反观点；结合后面的不定式内容，“说……没有”既自然，又避免把语气过度强化。
- source_word: ἀνάστασιν μὴ εἶναι
  choice: 没有复活这回事
  rationale: 准确表达其否认复活存在的主张；“这回事”符合现代汉语，也明确这里所说的是复活这一事实或观念。
- source_word: ἐπηρώτησαν αὐτόν
  choice: 就问他
  rationale: ἐπερωτάω在此指向耶稣发问；上下文会显出问题的挑战性质，本节采用简洁自然的“问”。
theological_decisions:
- issue: 如何表达撒都该人对复活的立场
  choice: 他们说没有复活这回事
  alternative: 他们否认有复活的事
  rationale: 原文οἱ ἀντιλέγοντες ἀνάστασιν μὴ εἶναι可理解为他们主张复活不存在。“说没有”保留陈述其立场的语气，不引入原文未明说的进一步教义解释。
translation_notes:
  register: 采用现代、庄重而通俗的叙事语言。以分号清楚连接人物身份说明，并以冒号衔接下一节所引的问题。
