id: LUK.20.11
reference: Luke 20:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ προσέθετο ⸂ἕτερον πέμψαι⸃ δοῦλον· οἱ δὲ κἀκεῖνον δείραντες καὶ ἀτιμάσαντες ἐξαπέστειλαν κενόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/011.yaml
  text: And he proceeded to send another slave; but they also beat and dishonored that one[a], and sent him away empty-handed.
translation:
  language: zh_hans
  text: 他又打发另一个奴仆去；佃户们也把这个奴仆打了一顿，羞辱了他，叫他空手回去。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “奴仆”或译“仆人”；希腊文 δοῦλος 表明他是受主人支配的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέθετο … πέμψαι
  choice: 又打发……去
  rationale: 该结构表示在先前行动之后继续做同类之事；现代汉语用“又打发……去”自然地传达叙事上的追加行动。
- source_word: ἕτερον
  choice: 另一个
  rationale: 表明这是与前一个不同、又被差派的一名奴仆。
- source_word: δοῦλον
  choice: 奴仆
  rationale: “奴仆”既保留其受主人支配的身份，也符合中文圣经叙事的庄重语体；脚注提示也可译作“仆人”。
- source_word: κἀκεῖνον
  choice: 也把这个奴仆
  rationale: 明确保留“也”和“那一个”的平行强调，同时避免中文代词指涉含混。
- source_word: δείραντες
  choice: 打了一顿
  rationale: 准确表达身体殴打，又不把具体方式过度限定为鞭打。
- source_word: ἀτιμάσαντες
  choice: 羞辱了他
  rationale: 兼顾不尊重、使其受辱的社会性含义，比单纯“侮辱”涵盖面更广。
- source_word: ἐξαπέστειλαν κενόν
  choice: 叫他空手回去
  rationale: κενόν在此指没有得到预期的园中出产；“空手回去”是自然中文，并由上下文合理体现差回给主人之意。
theological_decisions:
- issue: 比喻中 δοῦλος 的译法
  choice: 奴仆
  alternative: 仆人
  rationale: 原词表达受主人支配的身份。“奴仆”较“仆人”更能保留这一社会关系，同时不像现代中文“奴隶”那样容易使读者只联想到特定历史制度；不借此引入额外的教义解释。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“佃户们”依据比喻上下文补明动作者 οἱ δὲ 的所指；“打发”保留主人差遣属下的语感。“空手回去”自然表达未取得果子便被赶回的含义。
