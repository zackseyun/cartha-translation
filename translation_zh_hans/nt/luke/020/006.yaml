  text: ἐὰν δὲ εἴπωμεν· Ἐξ ἀνθρώπων, ⸂ὁ λαὸς ἅπας⸃ καταλιθάσει ἡμᾶς, πεπεισμένος γάρ ἐστιν Ἰωάννην προφήτην εἶναι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/006.yaml
  text: But if we say, ‘From men,’ all the people will stone us, for they are convinced that John was a prophet.
translation:
  language: zh_hans
  text: 但如果我们说：‘是从人来的’，全体百姓都会用石头打我们，因为他们深信约翰是先知。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“约翰曾是先知。”希腊文的不定式本身不标明时间；这里也可按叙事语境理解为过去时。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ εἴπωμεν
  choice: 但如果我们说
  rationale: ἐάν加虚拟式表达可能条件；δέ承接上文并带转折，译为“但如果”自然准确。
- source_word: Ἐξ ἀνθρώπων
  choice: 是从人来的
  rationale: 原文是承接上文“约翰的洗礼是从哪里来的”的省略表达；补出“是……来的”符合现代汉语，同时保留“从人”与“从天上”的对照。
- source_word: ὁ λαὸς ἅπας
  choice: 全体百姓
  rationale: λαός指作为整体的百姓，ἅπας强调全部；“全体百姓”既简洁又保留集合与周全之意。
- source_word: καταλιθάσει ἡμᾶς
  choice: 都会用石头打我们
  rationale: καταλιθάζω意为以石头攻击或用石头打；不增添原文未明说的“打死”。“都”自然地承接主语“全体百姓”。
- source_word: πεπεισμένος γάρ ἐστιν
  choice: 因为他们深信
  rationale: 完成时分词与εἰμί表示已经形成并持续的确信；希腊文以单数呼应集合名词λαός，汉语按集合意义用“他们”。“深信”自然表达坚定确信。
- source_word: Ἰωάννην προφήτην εἶναι
  choice: 约翰是先知
  rationale: 宾格加不定式结构译为汉语判断分句。εἶναι本身不标示时间；“是先知”自然呈现百姓当时持续持有的判断，并不额外限定约翰是否仍在世。
theological_decisions:
- issue: 百姓对约翰先知身份的判断是否采用过去时表达
  choice: 约翰是先知
  alternative: 约翰曾是先知
  rationale: 希腊语不定式εἶναι本身不标时态。现代汉语无需像英语那样因叙事语境而进行时态后移；译作“是先知”既自然，也保留原文在时间指向上的开放性，避免“曾是”可能暗示其先知身份后来失效。
translation_notes:
  register: 采用现代、庄重而通俗的叙事语言。“是从人来的”与上下文的来源问题相呼应；“用石头打”避免古雅的“拿石头砸死”，也不把死亡结果强加给原文。脚注标记置于相关判断句之后。
