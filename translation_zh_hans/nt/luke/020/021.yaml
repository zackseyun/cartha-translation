source:
  edition: SBLGNT
  text: καὶ ἐπηρώτησαν αὐτὸν λέγοντες· Διδάσκαλε, οἴδαμεν ὅτι ὀρθῶς λέγεις καὶ διδάσκεις καὶ οὐ λαμβάνεις πρόσωπον, ἀλλ’ ἐπ’ ἀληθείας τὴν ὁδὸν τοῦ θεοῦ διδάσκεις·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/021.yaml
  text: And they questioned him[a], saying, “Teacher, we know that you speak and teach rightly, and you do not show partiality[b], but truly teach the way of God.”
translation:
  language: zh_hans
  text: 他们问耶稣说：“老师，我们知道你所说的、所教导的都正确；你不看人的情面[a]，却真实地教导上帝的道路[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“不接受面孔”，是指不因人的身份、地位或外在情形而偏私。
    reason: lexical_alternative
  - marker: b
    text: “真实地”也可译为“按真理”；“上帝的道路”指上帝所指示的道路或行事方式。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπηρώτησαν
  choice: 问
  rationale: 该动词可指询问或发问；上下文虽表明这是试探，但本节措辞本身采用中性的“问”最自然，也不额外强化敌意。
- source_word: Διδάσκαλε
  choice: 老师
  rationale: 直接表达对教导者的称呼，符合现代普通话，也不引入“主人”等超出词义的权威或隶属色彩。
- source_word: οἴδαμεν
  choice: 我们知道
  rationale: 保留说话者所宣称的确定语气；其言辞是否出于奉承，由叙事上下文呈现。
- source_word: ὀρθῶς
  choice: 很正直
  rationale: ὀρθῶς既可表示正确，也可含正直、合宜之意；这里同时修饰“说话、教导”，译为“正直”自然，并保留道德意味。
- source_word: λέγεις καὶ διδάσκεις
  choice: 说话、教导
  rationale: 保留原文两个并列动词，不将它们合并为单一行为。
- source_word: οὐ λαμβάνεις πρόσωπον
  choice: 不看人的情面
  rationale: 这是字面为“接受面孔”的习语，表示不因人的身份、地位或外在情形而偏私；“不看人的情面”在现代汉语中清楚自然。
- source_word: ἐπ’ ἀληθείας
  choice: 按真理
  rationale: 该短语表示依照真实或以真实的方式；“按真理”能自然地修饰“教导”，并保留其与“上帝的道”之间可能的语义关系。
- source_word: τὴν ὁδὸν τοῦ θεοῦ
  choice: 上帝的道
  rationale: ὁδός字面为道路，也常指道路、生活方式或上帝所要求的途径；“上帝的道”简洁庄重，并由脚注保留“道路”的字面意象。
- source_word: ἀλλ’
  choice: 而是
  rationale: 与前面的否定形成“不是……而是……”式对比，符合汉语句法并清楚呈现原文转折。
theological_decisions:
- issue: 不偏私的习语
  choice: 译为“不看人的情面”
  alternative: “不以貌取人”或“不偏待人”
  rationale: 原文强调耶稣不因人的外在身份或社会地位而改变判断。“不看人的情面”既传达不受人情和身份左右，也避免将意思缩窄为只按外貌判断。
- issue: ἐπ’ ἀληθείας与后续短语的关系
  choice: 译为“按真理教导上帝的道”
  alternative: “真正地教导上帝的道”
  rationale: 原文可理解为真实、诚实地施教，也可强调教导符合真理；正文采用“按真理”保留后一层含义，脚注列出方式副词式的译法，不排除原文的修饰歧义。
- issue: “上帝的道”的含义
  choice: 正文采用传统且自然的“道”
  alternative: “上帝的道路”或“上帝的道路/旨意”
  rationale: 这里的ὁδός具有道路、行事方式和上帝旨意等开放含义。“道”可承载这些神学共鸣，同时脚注说明其字面形式，避免把它限定为抽象教义或单一生活规范。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“老师”符合直接称呼；“不看人的情面”保留习语色彩而不显生硬；整体尽量维持原文并列与转折结构。
