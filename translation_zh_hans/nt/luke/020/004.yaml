  text: Was John's baptism from heaven or from men?[a]
translation:
  language: zh_hans
  text: 约翰的洗礼是从天上来的，还是从人来的？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从上帝来的”；希腊文直译为“从天上来的”，这是出于敬畏上帝而采用的委婉说法，指其源头或权柄来自上帝。
    reason: lexical_alternative
lexical_decisions:
- source_word: βάπτισμα
  choice: 洗礼
  rationale: 这里指与约翰相关的洗礼礼仪和实践；“洗礼”是现代汉语中准确、通行的对应词。
- source_word: Ἰωάννου
  choice: 约翰的
  rationale: 属格表示与约翰的关联，汉语用“约翰的洗礼”自然简洁。
- source_word: ἐξ οὐρανοῦ
  choice: 从天上来的
  rationale: 保留希腊文直译及其敬虔委婉语色彩；在此语境中指来自上帝的权柄或源头，但正文不将含义直接明说。
- source_word: ἐξ ἀνθρώπων
  choice: 从人来的
  rationale: 指源于人或出于人的权柄，与“从天上来的”形成对照；“人”在此为泛称，并非特指男性。
- source_word: ἦν
  choice: 是……来的
  rationale: 希腊文以系词连接两个来源短语；汉语加入“来的”可自然表达来源，同时保留问句结构。
- source_word: ἢ
  choice: 还是
  rationale: 在选择问句中，“还是”自然标明两个互斥选项。
theological_decisions:
- issue: “从天上”与约翰洗礼之来源或权柄的关系
  choice: 正文保留“从天上来的”
  alternative: 从上帝来的
  rationale: 该表达暗指上帝所赐的来源或权柄，但希腊文明确写作“从天上”。保留原有委婉语，既传达犹太敬虔表达，也不替原文消除含蓄性。
translation_notes:
  register: 采用自然、庄重而通俗的现代标准汉语。“从人来的”虽较凝练，但在对举结构中清楚自然，并准确保留泛指人类来源的含义。
