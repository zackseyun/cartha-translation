  text: 后来，那个女人也死了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὕστερον
  choice: 后来
  rationale: 表示叙事中随后发生的时间；“后来”自然、简洁，不额外赋予“最后”之意。
- source_word: καὶ
  choice: 也
  rationale: 这里表示那个女人和前述兄弟一样死去；译作“也”比单纯的“并且”更准确地体现附加意义。
- source_word: ἡ γυνή
  choice: 那个女人
  rationale: γυνή可指“女人”或“妻子”。在多人先后娶她的背景下，“那个女人”所指清楚，也避免“妻子”让人误以为只强调某一段婚姻关系。
- source_word: ἀπέθανεν
  choice: 死了
  rationale: 直接表达过去发生的死亡事件，符合希腊文平实的陈述语气，不作委婉化处理。
