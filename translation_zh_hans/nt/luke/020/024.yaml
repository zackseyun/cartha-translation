  text: ⸀Δείξατέ μοι δηνάριον· τίνος ἔχει εἰκόνα καὶ ἐπιγραφήν; ⸀ἀποκριθέντες δὲ εἶπαν· Καίσαρος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/024.yaml
  text: Show me a denarius. Whose image and inscription does it have? And they answered[a], 'Caesar's.'
translation:
  language: zh_hans
  text: “给我看一个第纳尔[a]。上面有谁的像和铭文？”他们回答：“凯撒的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “第纳尔”是当时通行的一种罗马钱币；这里保留钱币名称，以呈现历史背景。
    reason: cultural_note
lexical_decisions:
- source_word: Δείξατέ μοι
  choice: 拿……给我看
  rationale: 该不定过去时命令式表达直接吩咐；“拿一个……给我看”符合现代汉语习惯，也准确传达“给我看”的意思。
- source_word: δηνάριον
  choice: 第纳尔
  rationale: 保留罗马钱币的专名，以呈现历史背景，避免笼统译作“硬币”或“银币”。
- source_word: τίνος
  choice: 谁的
  rationale: 属格疑问代词在此询问钱币上的肖像和铭文属于或关联于谁；“谁的”自然简洁。
- source_word: εἰκόνα
  choice: 像
  rationale: “像”既适用于钱币上的人物形象，也保留 εἰκών 较宽的语义范围，不必限定为“肖像”。
- source_word: ἐπιγραφήν
  choice: 铭文
  rationale: 该词在钱币语境中指铸刻的文字或题字；“铭文”准确而易懂。
- source_word: ἀποκριθέντες δὲ εἶπαν
  choice: 他们回答
  rationale: 将分词加限定动词的结构自然整合为现代汉语叙事表达；上下文无需机械重复“回答说”。
- source_word: Καίσαρος
  choice: 凯撒的
  rationale: 原文仅用属格名词简短作答；汉语以“凯撒的”自然回应前面的“谁的”，并保留其简洁性。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语自然的标准普通话。“拿一个第纳尔给我看”比生硬的“向我展示”更符合叙事对话；“像和铭文”简洁保留原文两个并列名词。脚注标记紧随“回答”，与所提供审校层的位置一致，但脚注内容实际说明“第纳尔”。
