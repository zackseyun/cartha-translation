review_pass:
  verdict: revise
  source_fidelity: 首句准确保留了πᾶς ὁ πεσὼν的泛指、ἐπί加宾格所表达的落在石头上，以及将来被动语态。第二句也正确补出了从前句承接的“那块石头”作主语。不过，“压碎”较未充分体现λικμήσει所含的碾碎、粉碎乃至筛散的强烈意象；改为“碾得粉碎”更贴近原文，并与前句的“摔得粉碎”形成有意义的力度递进。
  naturalness: 原译整体庄重自然。“凡……的，都……”略显书面但符合经文语体。补出“人”可使首句的定语结构更完整；“就必把谁碾得粉碎”也比“就必把谁压碎”更自然、形象更鲜明。
  terminology: “那块石头”准确保留指示性，且不越过本节将其具体化解释。“摔得粉碎”可表达συνθλασθήσεται。将第二动词译为“碾得粉碎”，以区分并加强λικμήσει的语义。脚注宜将“吹散”改为“筛散”，因为此处所涉的扬场／簸扬意象并非单纯由“吹”这一动作表达。
  issues:
