    issue: “压碎”对λικμήσει的力度和具体意象稍弱。
    rationale: λικμάω可指碾碎，也可指簸扬、筛散；在石头落在人身上的审判图像中，须表达超越一般重压的彻底毁灭。
  - severity: low
