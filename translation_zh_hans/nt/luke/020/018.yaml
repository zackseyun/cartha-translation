  to: 凡跌在那块石头上的人，都必被摔得粉碎[a]；但那块石头落在谁身上，就必把谁碾得粉碎[b]。
  rationale: 修订只加强第二分句对λικμήσει的对应，并微调脚注以准确保留其可能的簸扬／筛散语义。保留原有的泛指结构、石头的指示性、两个将来后果，以及不对石头作超出经文的解释。
