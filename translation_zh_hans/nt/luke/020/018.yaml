  text: πᾶς ὁ πεσὼν ἐπ’ ἐκεῖνον τὸν λίθον συνθλασθήσεται· ἐφ’ ὃν δ’ ἂν πέσῃ, λικμήσει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/018.yaml
  text: Everyone who falls on that stone will be broken to pieces[a], but the one on whom it falls[b], it will crush him.
translation:
  language: zh_hans
  text: 凡跌在那块石头上的人，都必被摔得粉碎[a]；但那块石头落在谁身上，就必把谁碾得粉碎[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“必被打碎”或“必被摔碎”。
    reason: lexical_alternative
  - marker: b
    text: 或译“必把他碾成粉末”或“必把他筛散，如同糠秕”；希腊语动词所表达的毁灭性后果比一般的撞击更强烈。
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ πεσὼν
  choice: 凡跌……的，都
  rationale: 带冠词的分词在此泛指一切符合这一情形的人；“凡……都”自然地保留了普遍范围。
- source_word: ἐπ’ ἐκεῖνον τὸν λίθον
  choice: 在那块石头上
  rationale: ἐπί与宾格在πίπτω之后表示落到某物之上；“那块”也保留了ἐκεῖνον的指示意味。
- source_word: συνθλασθήσεται
  choice: 必被摔得粉碎
  rationale: 该将来时被动动词表示被打碎、破碎成片；此译既保留被动结果，也表达其强烈程度。
- source_word: ἐφ’ ὃν δ’ ἂν πέσῃ
  choice: 但那石头落在谁身上
  rationale: 关系代词与ἄν及虚拟语气构成不定条件，意为“无论落在谁身上”；补出承前省略的主语“那石头”，使现代汉语指代清楚。
- source_word: λικμήσει
  choice: 必……压碎
  rationale: λικμάω可指碾碎，也可带有扬场时使糠秕散开的意象；正文采用清楚易懂的“压碎”，较强的碾粉或吹散含义在脚注中保留。
- source_word: αὐτόν
  choice: 谁
  rationale: 原文阳性单数代词回指泛指的人。汉语用“谁”与前面的不定关系结构呼应，自然涵盖所指对象，而不改变其单数泛指功能。
theological_decisions:
- issue: 石头所表达的审判意象
  choice: 保留石头带来毁灭性后果的强烈意象，不弱化两个动词。
  alternative: 将其淡化为仅仅绊倒或受伤。
  rationale: 上下文中的石头具有决定性审判的意象；συνθλασθήσεται和λικμήσει所表达的后果都很严重，但正文不进一步指明石头象征谁，以免超出本节明说的内容。
- issue: 第二分句中石头的施事作用
  choice: 在汉语中补明“那石头”为“落下”和“压碎”的主语。
  alternative: 照原文省略主语，译为“落在谁身上，就必把他压碎”。
  rationale: 希腊文可由前句自然承接λίθος，现代汉语若完全省略则容易产生主语不明；补明并未增加新的解释，只是显明原句的语法承接。
translation_notes:
  register: 采用现代、庄重而口语可懂的表达。“凡……都”与“落在谁身上，就……”形成平行结构；保留“那块石头”的指示性和两个审判动词逐步增强的力度。
