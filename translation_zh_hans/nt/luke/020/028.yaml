id: LUK.20.28
reference: Luke 20:28
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: λέγοντες· Διδάσκαλε, Μωϋσῆς ἔγραψεν ἡμῖν, ἐάν τινος ἀδελφὸς ἀποθάνῃ ἔχων γυναῖκα, καὶ οὗτος ἄτεκνος ⸀ᾖ, ἵνα λάβῃ ὁ ἀδελφὸς αὐτοῦ τὴν γυναῖκα καὶ ἐξαναστήσῃ σπέρμα τῷ ἀδελφῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/028.yaml
  text: saying[a], “Teacher, Moses wrote for us that if someone's brother dies having a wife, and he is childless[b], his brother should take the wife and raise up offspring for his brother.”
translation:
  language: zh_hans
  text: 他们说：“老师，摩西为我们写下规定：如果某人的兄弟死了，留下妻子，却没有儿女，他的兄弟就应当娶那妻子，为死去的兄弟立后[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “立后”是《申命记》25:5所用法律观念的呼应，指使后代归在已故兄弟名下；希腊文直译为“为他的兄弟兴起后裔”。
    reason: cross_reference
lexical_decisions:
- source_word: Διδάσκαλε
  choice: 老师
  rationale: 这是对耶稣的直接称呼；“老师”自然、通俗，也准确表达教导者之意。
- source_word: Μωϋσῆς ἔγραψεν ἡμῖν
  choice: 摩西为我们写下规定
  rationale: ἡμῖν表示为以色列人而写、与他们有关；结合下文法律内容补出“规定”，使现代汉语自然清楚。
- source_word: ἐάν τινος ἀδελφὸς ἀποθάνῃ
  choice: 如果某人的兄弟死了
  rationale: 保留τινος不定、泛指的语气和原文单数结构。
- source_word: ἔχων γυναῖκα
  choice: 留下妻子
  rationale: 希腊文直译是“有妻子”；在死亡语境中，“留下妻子”自然表达其含义，但属于必要的语境化表达。
- source_word: οὗτος ἄτεκνος ᾖ
  choice: 却没有儿女
  rationale: ἄτεκνος意为无子女；“没有儿女”比“无子”更完整，且不把含义缩窄为没有儿子。
- source_word: ἵνα λάβῃ ὁ ἀδελφὸς αὐτοῦ τὴν γυναῖκα
  choice: 他的兄弟就应当娶那妻子
  rationale: λαμβάνω在此婚姻法律语境中指娶妻；“应当”传达该规定的义务性，而非仅仅许可。
- source_word: ἐξαναστήσῃ σπέρμα τῷ ἀδελφῷ αὐτοῦ
  choice: 为死去的兄弟立后
  rationale: 这是申命记婚姻法规的惯用概念，指使后代归在死者名下；“立后”简洁自然，并保留法律文化含义。
theological_decisions:
- issue: 如何表达兄终弟及法规而不把后来的文化或宗派解释写入正文
  choice: 采用“娶那妻子，为死去的兄弟立后”
  alternative: 娶那寡妇，替他的兄弟生儿育女
  rationale: 所选译法呈现法律义务及后代归属，同时避免把原文的γυνή明确解释为“寡妇”，也避免将σπέρμα窄化为多个儿女或生育行为本身。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。正文保持引述摩西律法的法律语气；以“留下妻子”自然表达ἔχων γυναῖκα的死亡语境，并用脚注说明“立后”背后的原文惯用语。
