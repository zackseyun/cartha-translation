  text: καὶ οὐκ ἴσχυσαν ἐπιλαβέσθαι ⸀τοῦ ῥήματος ἐναντίον τοῦ λαοῦ, καὶ θαυμάσαντες ἐπὶ τῇ ἀποκρίσει αὐτοῦ ἐσίγησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/026.yaml
  text: And they were not able to seize on his statement before the people[a], and marveling at his answer, they became silent.
translation:
  language: zh_hans
  text: 他们无法当着百姓的面抓住他话中的把柄[a]；他们对他的回答感到惊奇，就沉默了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：抓住这话。也可译作“在他所说的话中抓住把柄”。
    reason: 原文保留了“抓住话语”的具体意象；正文按争辩语境译出“抓住把柄”，脚注呈现较直译的形式及其自然的语境化表达。
lexical_decisions:
- source_word: οὐκ ἴσχυσαν
  choice: 无法
  rationale: 表达能力上的不可能，简洁自然，也不额外引入“力量不足”的含义。
- source_word: ἐπιλαβέσθαι τοῦ ῥήματος
  choice: 抓住他话里的把柄
  rationale: 动词与属格宾语连用，字面有“抓住这话”之意；在本段设局盘问的语境中，指企图从耶稣的话中找到可用来控告他的把柄。此译保留“抓住”的意象，同时符合现代汉语习惯。
- source_word: ἐναντίον τοῦ λαοῦ
  choice: 当着百姓的面
  rationale: 准确表达“在百姓面前、在百姓在场时”，并以“百姓”对应路加所用的 λαός，而不缩窄为一般“人群”。
- source_word: θαυμάσαντες ἐπὶ τῇ ἀποκρίσει αὐτοῦ
  choice: 对他的回答感到惊奇
  rationale: 将原因或所针对对象的介词结构自然译出；“惊奇”既可读又保留较庄重的语体。
- source_word: ἐσίγησαν
  choice: 就沉默了
  rationale: 体现不定过去时所描写的结果性转变：他们听见回答后不再说话，而不仅是持续处于安静状态。
theological_decisions: []
