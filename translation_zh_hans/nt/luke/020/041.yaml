  verdict: revise
  source_fidelity: 原文的 Δαυὶδ υἱόν 是单数“[大卫的]儿子”，并非泛指跨世代后裔的“子孙”。虽然该表达在弥赛亚语境中涉及大卫后裔身份，但本节及紧接着的论证刻意保留“儿子／主”的称谓张力，正文不宜改为“子孙”。其余译法准确保留了未指明的复数主语、Πῶς 所引出的逻辑性问题，以及“弥赛亚”这一称号。
  naturalness: “耶稣却对他们说”及“人们怎么说……呢？”均为自然、庄重的现代标准汉语。“大卫的儿子”虽较“子孙”具体，却完全自然，并且更忠实于原文措辞。将脚注锚点紧贴相关词语，读者也更容易辨明各注释所指。
  terminology: “弥赛亚”恰当地传达此处 χριστός 的称号及其大卫王朝语境；“基督”可作为替代译法置于脚注。“大卫的儿子”应保留 υἱός 的单数父子用语；“大卫之子”可作为文体性替代，但“子孙”不宜作为正文译文。
