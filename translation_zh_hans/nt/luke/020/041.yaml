  text: Εἶπεν δὲ πρὸς αὐτούς· Πῶς λέγουσιν τὸν χριστὸν ⸂εἶναι Δαυὶδ υἱόν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/041.yaml
  text: But he said to them[b][a], “How do they say that the Messiah is David’s son?”
translation:
  language: zh_hans
  text: 耶稣却对他们说：“人们怎么说弥赛亚[a]是大卫的儿子[b]呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弥赛亚”也可译作“基督”。
    reason: alternative_reading
  - marker: b
    text: 原文直译为“大卫的儿子”；也可译作“大卫之子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: 却
  rationale: δέ是较弱的连接词；此处引出耶稣转而提出的质问，用“却”自然体现话语转折，但不过分强化对立。
- source_word: πρὸς αὐτούς
  choice: 对他们
  rationale: 符合现代汉语引出说话对象的自然表达。
- source_word: Πῶς
  choice: 怎么
  rationale: 既可询问这种说法如何成立，也保留后文对其逻辑的追问。
- source_word: λέγουσιν
  choice: 人们怎么说
  rationale: 希腊文第三人称复数没有明说主语；“人们”保留其泛指性质，避免误定为某一特定群体。
- source_word: τὸν χριστόν
  choice: 弥赛亚
  rationale: Χριστός在此是称号，语境明确涉及所盼望的大卫后裔，译作“弥赛亚”最能传达犹太受膏君王的背景。
- source_word: εἶναι
  choice: 是
  rationale: λέγουσιν之后的不定式结构在现代汉语中自然转为“说……是……”。
- source_word: Δαυὶδ υἱόν
  choice: 大卫的子孙
  rationale: υἱός字面为“儿子”，但在谱系和弥赛亚语境中可指后裔；“子孙”是现代汉语表达跨世代血统关系的自然说法，同时脚注保留字面译法。
theological_decisions:
- issue: Χριστός的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 本节聚焦所期待的大卫后裔这一身份，“弥赛亚”凸显其称号及犹太弥赛亚背景；脚注提供“基督”，不排除传统译法。
- issue: 大卫子嗣用语
  choice: 大卫的子孙
  alternative: 大卫的儿子／大卫之子
  rationale: “子孙”自然表达大卫后裔之意，又不把该短语固定成希腊文没有显明标出的专名式称号；脚注保留字面上的“儿子”，使后文围绕父子称谓的张力可见。
- issue: 疑问的性质
  choice: 人们怎么说……呢
  alternative: 为什么人们说……呢
  rationale: Πῶς直译为“怎么”，可同时承载方式与逻辑上的追问；不译成“为什么”，以免提前把歧义收窄为原因询问。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“耶稣”补出希腊文代词所指，使独立经节清楚易懂；“人们”体现未明说的复数主语。脚注标记均置于相关问句末尾。
