  rationale: 将“大卫的子孙”改为“大卫的儿子”，以对应希腊文单数 υἱόν，并保留本段接续经文所探讨的父子称谓张力。脚注也相应调整，避免把“原文直译”为实际上已在正文采用的译法之外的说法。脚注锚点分别移至“弥赛亚”和“儿子”之后，使其指向明确。
