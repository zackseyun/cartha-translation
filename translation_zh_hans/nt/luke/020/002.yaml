id: LUK.20.2
reference: Luke 20:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ εἶπαν ⸂λέγοντες πρὸς αὐτόν⸃· Εἰπὸν ἡμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιεῖς, ἢ τίς ἐστιν ὁ δούς σοι τὴν ἐξουσίαν ταύτην;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/002.yaml
  text: And they said to him, “Tell us, by what authority are you doing these things? Or who is the one who gave you this authority?”
translation:
  language: zh_hans
  text: 他们对他说：“告诉我们，你凭着什么权柄做这些事？或者，是谁给了你这权柄？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: 他们
  rationale: 希腊语连接词承接上文；现代汉语在此无需机械译出“并且”，直接进入主语可自然保持叙事连续性。
- source_word: εἶπαν ⸂λέγοντες πρὸς αὐτόν⸃
  choice: 他们对他说
  rationale: 将希腊语中带有重复意味的“说……对他说”按现代汉语习惯整合，完整保留其向耶稣发言的意义。
- source_word: Εἰπὸν ἡμῖν
  choice: 请告诉我们
  rationale: 命令式在此是直接质询；“请告诉我们”自然表达要求，且不额外增强敌意。
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: 凭什么权柄
  rationale: ἐν在此表示行动所依据的授权；“凭什么权柄”符合汉语质询习惯，并保留ἐξουσία所指合法授权而非单纯能力。
- source_word: ταῦτα ποιεῖς
  choice: 做这些事
  rationale: 保留ταῦτα的复数指向，概括耶稣近期在圣殿中的行动；汉语不必另行标示希腊语现在时体。
- source_word: ἢ
  choice: 又
  rationale: 第二问是对第一问的另一种相关表述；汉语用“又”自然连接递进式质询，同时不把两问割裂为互斥选择。
- source_word: τίς ἐστιν ὁ δούς σοι
  choice: 是谁给了你
  rationale: 以自然汉语表达系词加实体化分词结构；“是谁”仍保留对授权者身份的明确追问。
- source_word: τὴν ἐξουσίαν ταύτην
  choice: 这权柄
  rationale: 指回前一问中的同一权柄；“权柄”较“能力”更准确体现被授予的行动资格和合法权利。
theological_decisions:
- issue: 圣殿冲突语境中ἐξουσία的含义
  choice: 权柄
  alternative: 权力；权利
  rationale: 宗教领袖质疑的是耶稣行动的合法授权及其来源，而非他是否具有实际能力。“权柄”既保留制度性含义，也承载经文中的神学张力，却不预先说明权柄来源。
- issue: 两项质询之间ἢ的关系
  choice: 又是谁
  alternative: 或是谁
  rationale: 两问可能是替代表述，也可能分别追问权柄性质与授予者。汉语“又是谁”保留密切关联，避免“或”使读者误以为只能二选一，同时没有把二者合并成单一命题。
translation_notes:
  register: 采用现代、庄重而口语自然的直接引语。“凭什么权柄”符合当代普通读者的表达习惯；保留“这些事”和“这权柄”的指示关系。未添加上下文解释或宗派性阐释。
