base_translation:
  language: en
  yaml_path: translation/nt/luke/020/003.yaml
  text: But in reply he said to them[a], “I also will ask you a question, and you tell me:”
translation:
  language: zh_hans
  text: 他却回答他们说：“我也要问你们一个问题[a]，你们告诉我：”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较形式对应地，也可译作“我也要问你们一件事”。希腊语λόγον通常意为“话”或“事情”，在这里与“问”连用，实际指一个问题。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ εἶπεν πρὸς αὐτούς
  choice: 他却回答他们说
  rationale: 以自然汉语表达分词ἀποκριθείς与主要动词εἶπεν的组合；“却”传达δέ在对峙语境中的轻微转折，“回答他们说”保留回应和引出直接引语两层作用。
- source_word: Ἐρωτήσω ὑμᾶς
  choice: 我要问你们
  rationale: 准确表达ἐρωτάω的将来时及ὑμᾶς所指的复数受话者；现代汉语中无需另加“将”。
- source_word: κἀγὼ
  choice: 我也
  rationale: 保留καὶ ἐγώ的强调和对应意味：他们既盘问耶稣，耶稣也要问他们。
- source_word: λόγον
  choice: 一个问题
  rationale: λόγος本义范围包括“话、事情”，但与ἐρωτάω连用时在此指所要询问之事，译作“问题”最合现代汉语习惯。
- source_word: καὶ εἴπατέ μοι
  choice: 你们告诉我
  rationale: 保留复数命令语气和μοι“我”；“告诉我”比解释性的“回答我”更贴近εἶπον，同时自然直接。
theological_decisions: []
