  text: οἳ κατεσθίουσιν τὰς οἰκίας τῶν χηρῶν καὶ προφάσει μακρὰ προσεύχονται· οὗτοι λήμψονται περισσότερον κρίμα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/047.yaml
  text: who devour widows’ houses and for a pretense pray at length[b][a]. These will receive greater condemnation.
translation:
  language: zh_hans
  text: 他们吞吃寡妇的家产，又假借长祷告[a]。这些人必受到更重的审判[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“假意作很长的祷告”，或“以长祷告作借口”。
    reason: 原文προφάσει可表示假意、托词、借口或掩饰。
  - marker: b
    text: 或译：“更严厉的审判”，或“更重的定罪”。
    reason: 原文περισσότερον κρίμα既可较形式地译为程度更重的“审判”，也可按本句负面语境译为“定罪”。
lexical_decisions:
- source_word: κατεσθίουσιν
  choice: 吞吃
  rationale: 保留原文生动而强烈的比喻，表示贪婪地侵吞、剥削，并非字面上的进食。
- source_word: τὰς οἰκίας τῶν χηρῶν
  choice: 寡妇的家产
  rationale: οἰκίας直译为“房屋”或“家”，但此处借指寡妇赖以为生的产业；“家产”在现代汉语中自然地传达这种转喻，同时避免被误解为只吞并建筑物。
- source_word: προφάσει
  choice: 作掩饰
  rationale: 表达这些祷告是虚假的外在托词或掩饰，保留其伪善意味。
- source_word: μακρὰ προσεύχονται
  choice: 以冗长的祷告
  rationale: μακρά作副词使用，说明祷告持续很久；“冗长”既传达篇幅或时间之长，也符合本句谴责性的语境。
- source_word: λήμψονται
  choice: 必受到
  rationale: 表达将来必然临到他们的审判结果；汉语“受到审判”比机械直译“领受审判”更自然。
- source_word: περισσότερον κρίμα
  choice: 更重的审判
  rationale: 保留κρίμα的司法性与一定的词义宽度，并以“更重”自然表达比较级所指的加重程度。
theological_decisions:
- issue: κρίμα在本句中是“审判”还是“定罪”
  choice: 更重的审判
  alternative: 更严厉的定罪
  rationale: 上下文清楚表明这是负面的神圣裁决，但“审判”比“定罪”更贴近κρίμα的词义范围，不提前消除原文所保留的宽度；脚注列出更明确的定罪性译法。
- issue: προφάσει与长祷告的关系
  choice: 以冗长的祷告作掩饰
  alternative: 假意作很长的祷告
  rationale: 将长祷告理解为他们用来遮掩真实动机的托词或外在表现，既保留πρόφασις的“借口、掩饰”含义，也不进一步断定他们具体掩饰什么。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“吞吃”保留先知式谴责的力度；“家产”使οἰκίας在汉语中呈现其语境中的转喻含义；句首“他们”承接上文所指的经学家，因此保留本节在原文中作为关系从句延续前文的功能。
