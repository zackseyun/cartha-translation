  yaml_path: translation/nt/luke/020/039.yaml
  text: Then some of the scribes answered[a], “Teacher, you have spoken well.”
translation:
  language: zh_hans
  text: 有些经学家回应说：“老师，你说得对。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθέντες
  choice: 回应说
  rationale: 该不定过去时分词引出对前文的口头回应；“回应说”既体现回应关系，也符合现代汉语叙事习惯。
- source_word: δέ
  choice: 不单独译出
  rationale: δέ在此是轻微的行文衔接；现代汉语可借上下文自然承接，若译作“于是”可能过度强化时间推进。
- source_word: τινες τῶν γραμματέων
  choice: 有些经学家
  rationale: τινες加属格表示其中一部分；“有些”清楚保留并非所有经学家都如此回应的含义。
- source_word: γραμματέων
  choice: 经学家
  rationale: 在福音书语境中指精通并讲授犹太律法与经文的人；“经学家”比现代职业意义上的“文士”更易为普通读者理解，同时避免扩写为单一职能。
- source_word: Διδάσκαλε
  choice: 老师
  rationale: 呼格διδάσκαλε的直接含义是教导者；“老师”自然、尊重且符合现代汉语称呼。
- source_word: καλῶς
  choice: 对
  rationale: 此处赞同耶稣刚才所说内容的正确性；汉语“你说得对”自然地表达καλῶς的肯定意味。
- source_word: εἶπας
  choice: 你说得
  rationale: 不定过去时指向耶稣刚才所说的话；汉语简单过去意义由语境体现，无须另加时态词。
theological_decisions: []
