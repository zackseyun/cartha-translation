  text: ὅτι δὲ ἐγείρονται οἱ νεκροὶ καὶ Μωϋσῆς ἐμήνυσεν ἐπὶ τῆς βάτου, ὡς λέγει κύριον τὸν θεὸν Ἀβραὰμ ⸀καὶ θεὸν Ἰσαὰκ ⸁καὶ θεὸν Ἰακώβ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/037.yaml
  text: But that the dead are raised[a], even Moses made known in the passage about the bush[b], where he calls the Lord the God of Abraham and the God of Isaac and the God of Jacob.
translation:
  language: zh_hans
  text: 至于死人复活这件事，连摩西也在记载荆棘的经文[a]中指明了；在那里，他称主[b]为“亚伯拉罕的神、以撒的神、雅各的神”。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在荆棘那里”。这个希腊语表达既可指荆棘的场景，也可按当时引用经文的习惯，指记载荆棘事件的那段经文（见《出埃及记》3章）。
    reason: lexical_alternative
  - marker: b
    text: 希腊文作“主”；这呼应《七十士译本》在《出埃及记》3章中通常以“主”来翻译神圣之名的做法。
    reason: cross_reference
lexical_decisions:
- source_word: ἐγείρονται
  choice: 复活
  rationale: 原词是现在时被动语态，在此明确指死人复活。现代汉语通常以“复活”自然表达这一概念；“被复活”虽形式上更贴近被动语态，却不合现代汉语习惯。“死人复活这件事”保留了命题重点，也没有额外说明施事者。
- source_word: οἱ νεκροὶ
  choice: 死人
  rationale: 自然、简洁地表达作为群体的“死者”，并与本段关于死人复活的论辩相符。
- source_word: ἐμήνυσεν
  choice: 指明了
  rationale: μηνύω表示使人知道、揭示或表明；“指明了”既体现摩西经文的证据作用，又不夸大为正式宣告。
- source_word: ἐπὶ τῆς βάτου
  choice: 在记载荆棘的经文中
  rationale: 该表达可指荆棘场景，也可按犹太经文引用习惯指记载该场景的段落。正文采用现代读者易懂的经文段落义，并以脚注保留场景义的可能。
- source_word: ὡς λέγει
  choice: 在那里，他称
  rationale: λέγει在此配合双宾语结构，意为摩西把“主”称作亚伯拉罕、以撒、雅各的神；此译法比直译“他说”更清楚自然。
- source_word: κύριον
  choice: 主
  rationale: 按希腊文本译作“主”，并以脚注说明这句话呼应《出埃及记》3章中希腊文旧约以“主”代译神圣之名的传统。
- source_word: θεὸν Ἀβραὰμ καὶ θεὸν Ἰσαὰκ καὶ θεὸν Ἰακώβ
  choice: 亚伯拉罕的神、以撒的神、雅各的神
  rationale: 保留原文三次重复“神”的结构与强调，维持引用的节奏和耶稣论证所依托的措辞。
theological_decisions:
- issue: 耶稣论证中的复活用语
  choice: 死人复活
  alternative: 死人被唤醒；死人得以复活
  rationale: “复活”是现代中文最准确自然的复活语汇。希腊文被动语态暗含施事者，却未明说；中文不自然地添加“被”反而会妨碍理解，因此正文不显式补出“神使死人复活”，以免超出本节措辞。
- issue: 在指称以色列之神的引文中翻译 κύριος
  choice: 主
  alternative: 耶和华；上主
  rationale: 直接依照现存希腊文本的 κύριος 译为“主”，不把希伯来文底本的神圣之名直接置入正文；脚注提示其《七十士译本》背景，既保留互文信息，也不替文本消解这一层张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“至于……这件事”呈现 ὅτι δέ 所引出的论题转折；“连摩西也”体现 καὶ Μωϋσῆς 的强调。引文中三次保留“神”，避免压缩成“亚伯拉罕、以撒、雅各的神”而削弱原文反复的修辞力量。
