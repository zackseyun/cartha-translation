  text: ⸂αὐτὸς γὰρ⸃ Δαυὶδ λέγει ἐν βίβλῳ ψαλμῶν· ⸀Εἶπεν κύριος τῷ κυρίῳ μου· Κάθου ἐκ δεξιῶν μου
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/042.yaml
  text: For David himself says in the Book of Psalms[a], ‘The Lord said to my Lord, “Sit at my right hand”’
translation:
  language: zh_hans
  text: 因为大卫自己在《诗篇》中说：“主[a]对我主说：‘你坐在我的右边，’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 《诗篇》110:1的希伯来文作：“耶和华对我主说。”
    reason: 说明该引文的希伯来文本以神名“耶和华”对应正文第一个“主”。
lexical_decisions:
- source_word: αὐτὸς γὰρ
  choice: 因为……自己
  rationale: γάρ承接上文，引出解释，译作“因为”；αὐτός带强调意味，用“自己”体现。
- source_word: Δαυὶδ
  choice: 大卫
  rationale: 采用现代中文圣经与一般读者熟悉的标准译名。
- source_word: λέγει
  choice: 说
  rationale: 保留引经公式中的现在时；中文“说”自然适用于文献引述。
- source_word: ἐν βίβλῳ ψαλμῶν
  choice: 在《诗篇》中
  rationale: βίβλος与复数属格ψαλμῶν指诗篇之书；中文以书名号标示经卷名称，“中”比直译“在诗篇之书里”更自然。
- source_word: Εἶπεν
  choice: 说
  rationale: 不定过去时在诗篇引文内表示已经发出的言语；中文无需以形态标明时态，“说”简洁自然。
- source_word: κύριος
  choice: 主
  rationale: 主文本依照现有希腊文κύριος译为“主”，不把希伯来底本中的神名直接代入正文。
- source_word: τῷ κυρίῳ μου
  choice: 对我主
  rationale: 与格表达说话的对象；“我主”保留所属关系及弥赛亚引文中的称谓分量，且不额外解释其身份。
- source_word: Κάθου
  choice: 你坐
  rationale: 以第二人称主语加动词自然表达命令语气；避免较生硬的单字命令“坐”。
- source_word: ἐκ δεξιῶν μου
  choice: 在我的右边
  rationale: 这是表示居于说话者右侧尊荣位置的惯用语；“在我的右边”准确且符合现代中文表达。
theological_decisions:
- issue: 诗篇引文中第一个κύριος所对应的希伯来文是神名YHWH
  choice: 正文译作“主”
  alternative: “耶和华”
  rationale: 翻译以所给SBLGNT希腊文本为首要依据，因此正文按κύριος译为“主”；脚注说明诗篇110:1的希伯来文用神名，既保存互文信息，也不以希伯来底本取代希腊正文。
- issue: 第二个κύριος在基督论论证中的称谓含义
  choice: “我主”
  alternative: “我的主人”
  rationale: “我主”既忠实保留κύριος及μου，也维持耶稣论证所依赖的称谓张力，不提前断定或弱化其身份含义。
translation_notes:
  register: 采用庄重、自然的现代标准汉语。“因为”保留本节与上文论证的连接；用《诗篇》这一通行经卷名。引文标点按中文规范处理，并保留经文在下一节继续的未完结构。
