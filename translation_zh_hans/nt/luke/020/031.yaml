  yaml_path: translation/nt/luke/020/031.yaml
  text: And the third took her[a], and likewise all seven left no children and died.
translation:
  language: zh_hans
  text: 第三个也娶了她；七个人也都如此，没有留下儿女就死了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ τρίτος
  choice: 第三个
  rationale: 原文只说“第三个”，没有重复“兄弟”；中文可自然保留这一省略，由上下文明确所指。
- source_word: ἔλαβεν αὐτήν
  choice: 娶了她
  rationale: 字面为“取了她”，但在兄终弟及的婚姻语境中是娶她为妻的惯用表达；译作“娶了她”能在现代汉语中准确、自然地传达其义。
- source_word: ὡσαύτως δὲ καὶ
  choice: 也都如此
  rationale: 这一组合承接前述情况并表示其余各人同样如此；“也都如此”简洁地保留了延续和相同的语气。
- source_word: οἱ ἑπτὰ
  choice: 七个人
  rationale: 指上下文中的七兄弟全体。中文以“七个人也都如此”自然表达全体无一例外，不额外补入原文省略的“兄弟”。
- source_word: οὐ κατέλιπον τέκνα
  choice: 没有留下儿女
  rationale: καταλείπω 在死亡语境中强调死后没有留下后代；“没有留下儿女”同时保留了“留下”的含义和 τέκνα 的亲属意义。
- source_word: ἀπέθανον
  choice: 死了
  rationale: 直接对应原文“死亡”，用语朴素明确，不作委婉化处理。
