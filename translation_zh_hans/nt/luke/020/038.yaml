  text: θεὸς δὲ οὐκ ἔστιν νεκρῶν ἀλλὰ ζώντων, πάντες γὰρ αὐτῷ ζῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/038.yaml
  text: He is not God of the dead[a], but of the living, for all live to him.
translation:
  language: zh_hans
  text: 神不是死人的神，而是活人的神，因为所有人在他面前[a]都是活着的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为所有人都向他活着。”
    reason: 原文αὐτῷ（“对他／向他”）的与格关系可有不同理解。
lexical_decisions:
- source_word: θεὸς
  choice: 神
  rationale: 这里虽无冠词，但在犹太一神信仰语境中所指明确；译作“神”自然准确。
- source_word: δὲ
  choice: 而
  rationale: δέ在此承接上文，并与οὐκ…ἀλλὰ的对比相配；中文用“而”自然呈现转折，不添加时间意味。
- source_word: νεκρῶν
  choice: 死人
  rationale: 属格复数在“神”之后表示“死人的神”；“死人”简洁并与“活人”形成对照。
- source_word: ζώντων
  choice: 活人
  rationale: 现在分词作名词用，译为“活人”，保留与“死人”的紧凑对比。
- source_word: πάντες
  choice: 所有人
  rationale: 保留πάντες的广泛措辞，不把范围仅限定为上文提到的族长。
- source_word: αὐτῷ
  choice: 在他看来
  rationale: 与ζῶσιν合译，表达相对于神、在神面前是活的这一关系；同时以脚注保留更贴近原文形式的译法。
- source_word: ζῶσιν
  choice: 都是活的
  rationale: 现在时主动直陈语气表示持续的生命状态；现代汉语以“是活的”表达自然。
theological_decisions:
- issue: πάντες γὰρ αὐτῷ ζῶσιν中αὐτῷ的含义
  choice: 因为在他看来，所有人都是活的
  alternative: 因为所有人都向他而活
  rationale: αὐτῷ的与格关系高度凝练，可表示“对他而言／在他面前”，也可较直译为“向他”。正文采用自然中文表达其与神相关的生命状态，脚注保留形式更贴近希腊文且具有神学张力的译法，不进一步规定复活状态的细节。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“死人／活人”保持原文鲜明对照；未添加原文没有的时间性连接词。
