  text: Ἀκούοντος δὲ παντὸς τοῦ λαοῦ εἶπεν τοῖς ⸀μαθηταῖς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/045.yaml
  text: 'And while all the people were listening[a], he said to the disciples:'
translation:
  language: zh_hans
  text: 众百姓都在听的时候[a]，他对门徒说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“众百姓听着时，他对门徒说。”希腊文采用独立属格结构，交代他说话时的情形。
    reason: 说明原文句法及可行的表达方式。
lexical_decisions:
- source_word: Ἀκούοντος
  choice: 在听的时候
  rationale: 现在时分词与独立属格结构共同交代说话发生时的背景，表示百姓正在聆听；这一译法在现代汉语中自然，也保留了同时进行的意味。
- source_word: δὲ
  choice: 不单独译出
  rationale: δέ在此是轻微的叙事连接词。汉语借承接上下文和逗号即可自然推进叙事；硬译为“而”可能造成原文没有的转折意味。
- source_word: παντὸς τοῦ λαοῦ
  choice: 众百姓都
  rationale: πᾶς与单数λαός连用，指百姓整体。“众百姓都”既保留整体范围，也符合现代汉语表达。
- source_word: λαοῦ
  choice: 百姓
  rationale: λαός在路加福音中通常指作为群体的人民，有时带有共同体意味；“百姓”比单纯表示聚集人群的“群众”更贴切。
- source_word: εἶπεν
  choice: 他说
  rationale: λέγω的不定过去时在叙事中直接译作“说”。原文主语承接上文，译为“他”而不擅自补入专名。
- source_word: τοῖς μαθηταῖς
  choice: 对门徒
  rationale: 与格标明直接受话者。“门徒”是福音书语境中μαθητής的通行译法；原文没有物主词，因此不增译“他的”。
theological_decisions:
- issue: 现场听众与直接受话者的区别
  choice: 众百姓都在场聆听，但耶稣直接对门徒说话。
  alternative: 把众百姓理解为直接受话者，或把这番话理解为避开百姓、私下对门徒所说。
  rationale: 独立属格“众百姓都在听”交代公开场景，与格“对门徒”则指出直接受话者；译文同时保留两者，不将两个听众层面混为一谈。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“众百姓”保持福音书叙事的共同体色彩；“在听的时候”清楚呈现与主句同时发生的背景动作。
