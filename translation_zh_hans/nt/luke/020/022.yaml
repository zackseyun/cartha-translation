id: LUK.20.22
reference: Luke 20:22
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἔξεστιν ⸀ἡμᾶς Καίσαρι φόρον δοῦναι ἢ οὔ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/022.yaml
  text: Is it lawful for us to pay taxes to Caesar[a], or not?
translation:
  language: zh_hans
  text: 我们向凯撒缴纳贡税[a]，可以不可以？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“税”或“贡金”。希腊词指向统治者缴纳的税款。
    reason: 说明φόρος的词义范围，以及其税款和贡赋两方面的含义。
lexical_decisions:
- source_word: ἔξεστιν
  choice: 可以不可以
  rationale: 此词询问某事是否获准、是否合乎规范；译作“可以不可以”既自然，也不限定所依据的是罗马法律还是上帝的律法。
- source_word: ἡμᾶς
  choice: 我们
  rationale: 这是不定式结构中的逻辑主语；原文没有明说“我们犹太人”，因此不作增补。
- source_word: Καίσαρι
  choice: 向凯撒
  rationale: “凯撒”保留罗马统治者称号的历史和政治特指性；介词“向”符合现代汉语缴税的表达。
- source_word: φόρον
  choice: 贡税
  rationale: 该词指臣属群体向统治权缴纳的税款；“贡税”兼顾财政意义和受统治的政治含义。
- source_word: δοῦναι
  choice: 缴纳
  rationale: 虽字面为“给”，与税款搭配时译作“缴纳”更符合现代汉语，同时准确表达实际行为。
- source_word: ἢ οὔ
  choice: 可以不可以
  rationale: 将否定选择融入汉语正反问句，准确而自然地表达“还是不可以”。
theological_decisions:
- issue: 问题中“许可”的规范依据
  choice: 用“可以不可以”保留依据未明的状态
  alternative: 译作“是否合法”或“是否合乎上帝的律法”
  rationale: 原文没有说明所依据的是罗马民法、犹太宗教律法，还是更广义的道德许可；上下文刻意利用政治与宗教之间的张力，译文不应代为判定。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“缴纳贡税”保留历史政治色彩，“可以不可以”则以自然的正反问句保存原文对许可依据的含混。
