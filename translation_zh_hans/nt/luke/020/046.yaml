  text: Προσέχετε ἀπὸ τῶν γραμματέων τῶν θελόντων περιπατεῖν ἐν στολαῖς καὶ φιλούντων ἀσπασμοὺς ἐν ταῖς ἀγοραῖς καὶ πρωτοκαθεδρίας ἐν ταῖς συναγωγαῖς καὶ πρωτοκλισίας ἐν τοῖς δείπνοις,
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/046.yaml
  text: Beware of the scribes[a], who want to walk around in long robes, and who love greetings in the marketplaces and the best seats in the synagogues and places of honor at banquets[d][c][b],
translation:
  language: zh_hans
  text: “你们要提防那些经学家，他们喜欢穿着长袍[a]四处走动，喜爱在集市上受人问安，又喜爱会堂里的首要座位和宴席上的尊位。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “长袍”指长而较正式、显眼的外衣；本句将其与在公众场合受敬以及取得尊位的爱好并列。
    reason: cultural_note
lexical_decisions:
- source_word: Προσέχετε ἀπὸ
  choice: 你们要提防
  rationale: 该结构表达对某一群体保持警惕；“提防”自然、简洁，并保留命令和警告的力度。
- source_word: γραμματέων
  choice: 经学家
  rationale: 指精通、抄录并讲解犹太律法的人；“经学家”比现代语境中容易误解为文书人员的“文士”更透明，也不扩大为泛称的教师。
- source_word: τῶν θελόντων περιπατεῖν
  choice: 喜欢……招摇过市
  rationale: θέλω表达意愿或偏好，περιπατέω本义为行走、四处走；结合长袍及后续求取尊荣的语境，“招摇过市”传达公开展示的语用含义，但不把动机扩展到原文之外。
- source_word: ἐν στολαῖς
  choice: 穿着长袍
  rationale: στολή指长袍或庄重显眼的衣服；“长袍”准确而易懂。
- source_word: φιλούντων ἀσπασμοὺς
  choice: 喜爱人在……向他们问安
  rationale: φιλέω在此表示喜爱，ἀσπασμός是问候；补出“人在……向他们”使汉语关系清楚，并借上下文保留这种问候含有公开敬意的意味。
- source_word: ἐν ταῖς ἀγοραῖς
  choice: 在集市上
  rationale: ἀγορά是市场及公共广场；“集市”简洁地传达公开社交场所。
- source_word: πρωτοκαθεδρίας ἐν ταῖς συναγωγαῖς
  choice: 会堂里的首席
  rationale: πρωτοκαθεδρία指位置显要、象征尊荣的座位；“首席”保留其地位内涵。
- source_word: πρωτοκλισίας ἐν τοῖς δείπνοις
  choice: 宴席上的尊位
  rationale: πρωτοκλισία指筵席中最受尊崇的位置；“尊位”比单说“好座位”更准确体现古代宴席的社会等级功能。
theological_decisions:
- issue: 对经学家的社会—宗教性批评范围
  choice: 保留定冠词群体称谓及随后对其行为特征的描述，译作“那些经学家：他们……”，把警告聚焦于好显摆、追求公众敬意与尊位的行为。
  alternative: 将本句解释成对每一位经学家的全面定罪，或仅仅批评其服饰习惯。
  rationale: 希腊文以一连串分词描述这些经学家的典型倾向。译文保留群体性批评的力度，同时不额外断言每个个体都如此，也不把批评缩窄为衣着问题。
translation_notes:
  register: 采用现代、庄重而口语可懂的表达。“经学家”兼顾历史角色与现代透明度；“首席”“尊位”保留两个不同希腊词都指向受尊崇位置的平行结构。标点按现代汉语处理，以冒号引出对受警告群体的描述。
