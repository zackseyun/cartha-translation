source:
  edition: SBLGNT
  text: ἰδόντες δὲ αὐτὸν οἱ γεωργοὶ διελογίζοντο πρὸς ⸀ἀλλήλους λέγοντες· Οὗτός ἐστιν ὁ κληρονόμος· ⸀ἀποκτείνωμεν αὐτόν, ἵνα ἡμῶν γένηται ἡ κληρονομία·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/014.yaml
  text: But when the vine-growers saw him[a], they reasoned with one another, saying, ‘This is the heir. Let us kill him, so that the inheritance may become ours.’
translation:
  language: zh_hans
  text: 可是，那些在葡萄园里耕作的人[a]看见他，就彼此商议说：“这是继承人。我们杀了他吧，好让这产业归我们所有。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“佃户”或“农夫”。希腊词指从事耕作的人；在这个比喻中，他们具体是在葡萄园里耕作的人。
    reason: 词义存在可合理表达的不同侧重：“佃户”突出上下文中的租佃关系，“农夫”较为宽泛；正文则保留农业含义并体现葡萄园场景。
lexical_decisions:
- source_word: γεωργοὶ
  choice: 种葡萄园的人
  rationale: γεωργοί泛指从事耕作的人；本比喻的直接语境是葡萄园，因此用“种葡萄园的人”既体现农业含义，也保留具体场景，而不把其身份直接法律化为“佃户”。
- source_word: διελογίζοντο πρὸς ἀλλήλους
  choice: 彼此商议
  rationale: 未完成时描写他们相互盘算、商量的过程；“彼此商议”自然表达 reciprocal interaction 和蓄意谋划，又不额外加入“争论”的意味。
- source_word: κληρονόμος
  choice: 继承人
  rationale: 这是现代汉语中表达有权承受产业之人的标准说法，兼顾法律和叙事语境。
- source_word: ἀποκτείνωμεν
  choice: 我们杀了他
  rationale: 第一人称复数不定过去时虚拟式在此为劝勉用法；“我们杀了他”直接自然，不额外加入“谋杀”所明示的道德定性。
- source_word: ἵνα ἡμῶν γένηται ἡ κληρονομία
  choice: 好让这产业归我们所有
  rationale: “好让”保留ἵνα的目的关系，“归我们所有”自然表达γένηται的结果性变化，即产业成为他们的。
- source_word: δὲ
  choice: 可是
  rationale: δέ推动叙事并带有轻微转折；“可是”符合园主之子来到后故事发生转折的语气。
- source_word: ἰδόντες
  choice: 看见……就
  rationale: 不定过去时分词在此表达先于主句商议动作的时间关系；汉语用“看见……就……”自然呈现这一衔接。
theological_decisions:
- issue: 葡萄园比喻中γεωργοί的身份称谓
  choice: 译作“种葡萄园的人”
  alternative: “佃户”或“农夫”
  rationale: “种葡萄园的人”直接反映该词的农业含义及葡萄园语境；上下文虽表明他们受托经营园子，但本节该名词本身并不明确编码租佃法律关系。这样既不排除佃户身份，也不把它强加进正文。
- issue: 杀死继承人与取得产业之间的目的关系
  choice: 保留为“好让这产业归我们所有”
  alternative: 弱化为单纯结果“这样产业就是我们的了”
  rationale: 原文ἵνα明确表达他们杀人的目的或意图；正文保留这一蓄意关系，但不替比喻解释其神学象征。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“彼此商议”表现共同盘算；“继承人”“产业”保持比喻中的继承语汇。引号与标点按现代简体中文规范处理。
