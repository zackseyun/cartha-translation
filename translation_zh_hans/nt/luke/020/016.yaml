  text: ἐλεύσεται καὶ ἀπολέσει τοὺς γεωργοὺς τούτους, καὶ δώσει τὸν ἀμπελῶνα ἄλλοις. ἀκούσαντες δὲ εἶπαν· Μὴ γένοιτο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/016.yaml
  text: He will come and destroy these tenant farmers[a], and will give the vineyard to others.” But when they heard this, they said[b], “May it never be!”
translation:
  language: zh_hans
  text: 他必来除灭这些佃户[a]，把葡萄园交给别人。”他们听见这话，就说[b]：“千万不可！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“农夫”或“承租人”；希腊语这个词在这里指耕种别人土地的人。
    reason: lexical_alternative
  - marker: b
    text: 或译“绝对不可！”“断乎不可！”希腊语原意为“愿这事不要发生”，表达强烈的拒绝。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλεύσεται
  choice: 他必来
  rationale: 保留将来时和“来”的基本意义，不增添“回来”等原文未明说的含义。
- source_word: ἀπολέσει
  choice: 除灭
  rationale: 表达严厉的毁灭性审判，同时不像“杀死”那样把词义范围收窄；也符合庄重的经文语体。
- source_word: γεωργοὺς
  choice: 佃户
  rationale: 在葡萄园比喻中，所指不是普通雇工，而是耕种他人土地的人；“佃户”简洁而准确。
- source_word: τούτους
  choice: 这些
  rationale: 保留希腊文近指代词的直接指称。
- source_word: δώσει
  choice: 交给
  rationale: δίδωμι本义为“给”；此处涉及葡萄园经营权的转交，“交给”在现代汉语中自然，又不额外限定法律关系。
- source_word: τὸν ἀμπελῶνα
  choice: 葡萄园
  rationale: 采用标准、自然的对应语，保留比喻意象及其经文关联。
- source_word: ἄλλοις
  choice: 别人
  rationale: 保留对象未具体说明的特点；“别人”比“其他人”在此句中更自然简洁。
- source_word: ἀκούσαντες δὲ εἶπαν
  choice: 众人听见了，就说
  rationale: 将不定过去时分词按语境表达为先于主句的动作；根据复数动词补出自然汉语主语“众人”，不具体界定其身份。
- source_word: Μὴ γένοιτο
  choice: 千万不可！
  rationale: 传达希腊文愿望式表达的强烈拒斥与惊骇反应，也保留“愿此事不要发生”的意愿色彩。
theological_decisions:
- issue: 听众回应“Μὴ γένοιτο”的语气
  choice: 译为带愿望色彩的强烈拒斥：“千万不可！”
  alternative: “绝对不会！”或“断乎不可！”
  rationale: 这里不是单纯否认事实，而是对所宣告结局的强烈排斥。“千万不可”在现代汉语中自然，并保留愿其不要发生的语用力量。
- issue: 葡萄园被给“别人”的具体所指
  choice: 仅译“别人”，不作身份解释
  alternative: 明确译作某一民族、群体或宗教共同体
  rationale: 原文只用不定代词ἄλλοις，没有在本节明确界定接受者；译文不应替读者消解这一神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“除灭”保留审判的严厉性；“佃户”明确其耕种他人产业的社会角色。两个脚注标记均已置入正文。
