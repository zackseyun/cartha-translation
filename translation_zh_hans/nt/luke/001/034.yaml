  text: εἶπεν δὲ Μαριὰμ πρὸς τὸν ἄγγελον· Πῶς ἔσται τοῦτο, ἐπεὶ ἄνδρα οὐ γινώσκω;
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/034.yaml
  text: But Mary said to the angel[a], “How will this be, since I have not known a man?”
translation:
  language: zh_hans
  text: 马利亚却对天使说：“这事将怎样发生呢？因为我从未与男人同房[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“我不认识男人”；“认识”在这里是指发生性关系的委婉说法。
    reason: 说明原文的字面表达及其委婉含义，避免现代中文读者误解。
lexical_decisions:
- source_word: δὲ
  choice: 却
  rationale: 表示天使宣告之后话语转向马利亚的回应，并带出轻微反差；中文“却”比“但是”自然，也不把对比说得过重。
- source_word: Μαριὰμ
  choice: 马利亚
  rationale: 采用现代中文圣经传统中广为人知的人名译法。
- source_word: πρὸς τὸν ἄγγελον
  choice: 对天使
  rationale: 本段所指明确是天上的使者；“天使”准确且符合现代中文习惯。
- source_word: Πῶς ἔσται τοῦτο
  choice: 这事将怎样发生呢
  rationale: 保留疑问的方式意味和将来指向；“这事”回指先前所宣告的怀孕生子，不把问题改写成对可能性的否定。
- source_word: ἐπεὶ
  choice: 因为
  rationale: 清楚表达马利亚提出问题的缘由，在现代中文中自然直接。
- source_word: ἄνδρα
  choice: 男人
  rationale: ἀνήρ在此指男性，不必窄化为“丈夫”；这样也避免加入原文没有明说的婚姻限定。
- source_word: οὐ γινώσκω
  choice: 从未……同房
  rationale: γινώσκω字面是“认识”，在这里却是指性关系的委婉说法。中文若直译“不认识男人”容易被普通读者误解，因此用庄重而清楚的“同房”；“从未”自然表达截至说话时没有这种经历，但不把陈述扩展为将来的誓言。
theological_decisions:
- issue: 马利亚的陈述与耶稣的童女受孕
  choice: 将原文委婉语译为“我从未与男人同房”，表达她截至当时没有性经历。
  alternative: 直译为“我不认识男人”；或解释性地译为“我是童女”。
  rationale: “不认识男人”在现代汉语中通常只表示不熟悉某个男性，不能可靠传达希腊语的性关系委婉义；“我是童女”虽符合语境，却把原文的陈述改成身份标签。所选译法既清楚呈现童贞背景，又不加入永久童贞或其他原文未说明的主张。
translation_notes:
  register: 采用庄重、自然的现代标准汉语。“这事将怎样发生呢”保留马利亚询问实现方式的语气；“同房”比直译“不认识”更易懂，又比直说“发生性关系”更符合叙事语体。脚注标记紧随其所解释的短语。
