  text: καὶ ἐγένετο ὡς ἤκουσεν ⸂τὸν ἀσπασμὸν τῆς Μαρίας ἡ Ἐλισάβετ⸃, ἐσκίρτησεν τὸ βρέφος ἐν τῇ κοιλίᾳ αὐτῆς, καὶ ἐπλήσθη πνεύματος ἁγίου ἡ Ἐλισάβετ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/041.yaml
  text: And it happened that[a], when Elizabeth heard Mary’s greeting, the baby leaped in her womb, and Elizabeth was filled with the Holy Spirit,
translation:
  language: zh_hans
  text: 伊利莎白听见马利亚的问安[a]时，她腹中的胎儿跳跃起来；伊利莎白被圣灵充满。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“致意”。
    reason: 词汇替代译法；ἀσπασμός指见面时所说的问候或致意。
lexical_decisions:
- source_word: ἐγένετο
  choice: 事情是这样
  rationale: 保留路加常用的叙事引入语，同时避免采用古雅生硬的“于是成了”或“事情发生了”。
- source_word: ὡς
  choice: 一……就……
  rationale: 在此表达紧接发生的时间关系，比直译为“当……时”更符合现代汉语叙事习惯。
- source_word: ἀσπασμός
  choice: 问安
  rationale: 指马利亚说出的礼貌问候；“问安”庄重而易懂，也符合当时见面致意的语境。
- source_word: ἐσκίρτησεν
  choice: 跳跃起来
  rationale: 传达突然、活跃的动作，比“动了一下”更充分保留原文的生动性。
- source_word: βρέφος
  choice: 胎儿
  rationale: 该词泛指婴孩，但此处明确指尚在母腹中的约翰；“胎儿”在现代汉语中准确自然，不额外加入神学解释。
- source_word: κοιλία
  choice: 腹中
  rationale: 语境明确指子宫内；“腹中”比“肚子里”更庄重自然。
- source_word: ἐπλήσθη
  choice: 被……充满
  rationale: 保留希腊文被动语态及其暗含的外来施动，而不补出原文未明说的施动者。
- source_word: πνεύματος ἁγίου
  choice: 圣灵
  rationale: 在路加—使徒行传的语境中通常指上帝的圣灵；现代中文以专名“圣灵”自然表达，无须添加冠词。
theological_decisions:
- issue: πνεύματος ἁγίου 的所指
  choice: 圣灵，即上帝的灵
  alternative: 一种圣洁的灵
  rationale: 路加著作中的固定用法及此处先知性发言的上下文都指向上帝的圣灵；译文只按语境识别所指，不增添原文之外的教义说明。
- issue: βρέφος 对尚未出生的约翰的称呼
  choice: 胎儿
  alternative: 婴孩／孩子
  rationale: 原词可指婴孩，但上下文明确说明其在伊利莎白腹中；中文用“胎儿”能准确交代其当时状态，又不对经文作额外神学发挥。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语体。“事情是这样”保留路加的叙事公式；“一……就……”自然呈现两个动作紧密相接。
