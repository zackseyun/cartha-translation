  text: Τὸ δὲ παιδίον ηὔξανε καὶ ἐκραταιοῦτο πνεύματι, καὶ ἦν ἐν ταῖς ἐρήμοις ἕως ἡμέρας ἀναδείξεως αὐτοῦ πρὸς τὸν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/080.yaml
  text: And the child kept growing and becoming strong in spirit[c][b][a], and he was in the wilderness until the day of his public appearance to Israel.
translation:
  language: zh_hans
  text: 孩子渐渐长大，心灵也日益刚强；他一直在荒野地区[b]，直到他向以色列公开出现[a]的日子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “公开出现”也可译作“公开露面”或“向以色列显明”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文为复数，直译可作“在各旷野”或“在荒僻之地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδίον
  choice: 孩子
  rationale: 自然地指年幼的约翰，又不把年龄阶段限定为较大的“男孩”。
- source_word: ηὔξανε
  choice: 渐渐长大
  rationale: 以“渐渐”体现未完成时所表达的持续成长过程。
- source_word: ἐκραταιοῦτο
  choice: 日益刚强
  rationale: 保留持续增强的过程，同时不强行判定为被动的“被加强”或纯主动意义。
- source_word: πνεύματι
  choice: 心灵
  rationale: 此处无冠词，可泛指内在或属灵层面的刚强；“心灵”在现代汉语中自然，并避免直接断定是圣灵。
- source_word: ἐν ταῖς ἐρήμοις
  choice: 在旷野各处
  rationale: 既保留希腊语复数所暗示的多个荒僻地区，也比“诸旷野”更符合现代汉语。
- source_word: ἀναδείξεως
  choice: 公开显现
  rationale: 表达被显明、公开出现的意思，同时避免过于专门或古奥的措辞。
- source_word: πρὸς τὸν Ἰσραήλ
  choice: 向以色列
  rationale: 保留πρός所表达的朝向和对象关系；这里“以色列”指以色列民。
theological_decisions:
- issue: πνεύματι是否特指圣灵
  choice: 正文译为“心灵”，保留一般的内在或属灵含义
  alternative: “在圣灵里”或“靠着圣灵”
  rationale: 希腊文没有明确写出“圣”或冠词，语境虽容许与圣灵有关的理解，却不足以在正文中排除较宽泛的含义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以并列递进的表达重现两个未完成时所呈现的持续发展；正文保留“心灵”的语义张力，不将其明确限定为圣灵。脚注标记均置于相关词语之后。
