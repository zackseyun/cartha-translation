  text: Καὶ εἶπεν Μαριάμ· Μεγαλύνει ἡ ψυχή μου τὸν κύριον,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/046.yaml
  text: And Mary said[a], “My soul magnifies the Lord,”
translation:
  language: zh_hans
  text: 马利亚说：“我心尊主为大[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我的心宣扬主的伟大。”
    reason: 说明μεγαλύνει也可较明说地理解为“宣扬其伟大”，避免读者将“尊……为大”误解为使主变得更大。
lexical_decisions:
- source_word: Καὶ
  choice: （不单独译出）
  rationale: 希腊语常以Καὶ连接叙事和引语；现代汉语在此直接写“马利亚说”更自然，也不损失上下文的承接关系。
- source_word: εἶπεν
  choice: 说
  rationale: 这是叙事中引出直接引语的常用表达；“说”准确、自然。
- source_word: Μαριάμ
  choice: 马利亚
  rationale: 采用现代简体中文圣经语境中通行的人名译法。
- source_word: Μεγαλύνει
  choice: 尊……为大
  rationale: 保留“承认、宣扬某者为伟大”的诗性表达，也契合本句赞歌体裁；脚注列出更明说的译法，以呈现该词可含“宣扬其伟大”之意。
- source_word: ἡ ψυχή μου
  choice: 我心
  rationale: ψυχή在此是闪语诗歌式表达，指说话者内在生命乃至全人；“我心”既保留诗意和身体意象，也比“我的灵魂”更符合现代汉语赞歌语体，且不把它简化为单纯的“我”。
- source_word: τὸν κύριον
  choice: 主
  rationale: κύριος在这里是对上帝的尊称，并呼应圣经赞美诗的语言；译作“主”可保留其神学和经文互文分量。
theological_decisions:
- issue: κύριος的译法
  choice: 主
  alternative: 主人
  rationale: 本句以赞歌语言称颂上帝，“主”既符合神圣称谓的语境，也保留其圣经神学分量；“主人”在现代汉语中范围较窄，容易削弱这里的敬拜意味。
- issue: ἡ ψυχή μου所表达的人论含义
  choice: 我心
  alternative: 我的灵魂；我；我的内心
  rationale: 原文以ψυχή表达马利亚内在生命乃至全人的称颂。“我心”保留诗性张力，不把该词限定为与身体分离的实体，也不将其完全消解为代词“我”。
- issue: μεγαλύνει的诗性含义
  choice: 尊……为大
  alternative: 宣扬……的伟大；颂扬
  rationale: “尊主为大”保留原文以“使大／显为大”表达赞美的诗性张力，但不暗示人能使上帝本体变得更大；脚注提供较显明的意义表达。
translation_notes:
  register: 采用自然、庄重的现代汉语，并保留赞歌的凝练节奏。“我心尊主为大”具有熟悉的圣经诗歌韵味而不显晦涩；引语中的脚注标记紧随相关短语。
