  text: καὶ ἤκουσαν οἱ περίοικοι καὶ οἱ συγγενεῖς αὐτῆς ὅτι ἐμεγάλυνεν κύριος τὸ ἔλεος αὐτοῦ μετ’ αὐτῆς, καὶ συνέχαιρον αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/058.yaml
  text: And her neighbors and relatives heard that the Lord had shown great mercy to her[a], and they rejoiced with her.
translation:
  language: zh_hans
  text: 她的邻居和亲属听说主向她大施怜悯[a]，就和她一同欢喜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：主使他向她所施的怜悯显为大。
    reason: 保留ἐμεγάλυνεν（“使……为大、显大”）的措辞，并说明μετ’ αὐτῆς字面为“与她”、在此习语中指向她所显的怜悯。
lexical_decisions:
- source_word: περίοικοι
  choice: 邻居
  rationale: 指住在她周围的人；“邻居”是现代汉语中自然、准确的表达。
- source_word: συγγενεῖς
  choice: 亲属
  rationale: 指有亲缘关系的人；“亲属”比“家人”更能涵盖广泛的亲族。
- source_word: ἐμεγάλυνεν
  choice: 大施
  rationale: 该动词本义为“使之为大、显大”。与“怜悯”搭配时，“大施怜悯”既保留“广大、显著”的力度，也符合现代汉语习惯。
- source_word: κύριος
  choice: 主
  rationale: 此处虽无冠词，却在语境中用作对上帝的确定称号；译作“主”。
- source_word: ἔλεος
  choice: 怜悯
  rationale: 该词表示带来实际恩惠的慈悲与怜恤；“怜悯”也保留路加福音婴孩叙事中的关键词呼应。
- source_word: μετ’ αὐτῆς
  choice: 向她
  rationale: μετά加属格字面为“与她同在/同她一起”，但在“使怜悯显大”这一习语中表达怜悯临到她；汉语以“向她”最自然。脚注保留原文结构。
- source_word: συνέχαιρον αὐτῇ
  choice: 和她一同欢喜
  rationale: 准确表达“与某人共同欢喜”，不缩窄为“向她道贺”。
theological_decisions:
- issue: 如何翻译ἐμεγάλυνεν…τὸ ἔλεος αὐτοῦ μετ’ αὐτῆς这一习语
  choice: 主向她大施怜悯
  alternative: 主使他的怜悯与她一同显大
  rationale: 正文采用自然汉语，同时以“大施”保留μεγαλύνω所含的“使之为大、显大”的力度；脚注呈现较贴近希腊文形式的译法，避免掩盖原文独特措辞。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“大施怜悯”语气凝练，适合经文体，又不显古奥；“一同欢喜”清楚保留共同喜乐之意。
