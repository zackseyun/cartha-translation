id: LUK.1.25
reference: Luke 1:25
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὅτι Οὕτως μοι ⸀πεποίηκεν κύριος ἐν ἡμέραις αἷς ἐπεῖδεν ⸀ἀφελεῖν ὄνειδός μου ἐν ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/025.yaml
  text: because this is how the Lord has dealt with me in the days when he looked on me[a], to take away my reproach among people.
translation:
  language: zh_hans
  text: “在他眷顾我的那些日子，主这样待我，为要除去我在人前所受的羞辱。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “羞辱”也可译作“耻辱”或“羞耻”。希腊词着重指人在社会中所受的责难或不光彩。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: （不单独译出）
  rationale: 这里引出伊利莎白所说的内容；本节作为直接引语独立呈现时，汉语不必硬译为“因为”或“就是”，否则句子显得残缺。
- source_word: Οὕτως μοι πεποίηκεν κύριος
  choice: 主这样待我
  rationale: 保留“这样”的指示与方式意味，并以自然汉语表达主对她所采取的行动。
- source_word: ἐν ἡμέραις αἷς ἐπεῖδεν
  choice: 主眷顾我的日子
  rationale: ἐπεῖδεν本义为“看见、看顾”，在此包含留意并施恩的意味；“眷顾”既自然，也保留神主动关注她的含义。“我”由上下文补出。
- source_word: ἀφελεῖν
  choice: 除去了
  rationale: 表达移除、拿走；按整句时态和汉语叙述习惯译为完成性动作。
- source_word: ὄνειδός μου
  choice: 我所受的羞辱
  rationale: ὄνειδος侧重他人加于人的责难、耻辱和社会性不光彩；“所受的羞辱”比单说“羞耻”更能体现外在社会评价。
- source_word: ἐν ἀνθρώποις
  choice: 在人前
  rationale: 指这种羞辱存在于人群和社会评价之中；“在人前”简洁自然，并避免把泛指的ἀνθρώποις误解为仅指男性。
theological_decisions:
- issue: κύριος的所指
  choice: 译作“主”，指神
  alternative: 在本处理解为基督
  rationale: 上下文是伊利莎白述说神除去她不育所带来的社会羞辱；不在本节强加更狭窄的基督论所指。
- issue: ὄνειδος的社会含义
  choice: 译作“我在人前所受的羞辱”
  alternative: “我的羞耻”或“我的耻辱”
  rationale: 所选译法突出原词所含的外在责难与社会失荣，同时不否认她个人承受的痛苦。
- issue: ἐπεῖδεν与ἀφελεῖν的关系
  choice: 译成主眷顾她，并除去羞辱
  alternative: 明确译为“为了除去”或“结果除去”
  rationale: 希腊文不定式可表达目的或结果；正文用并列式汉语保留两者间的自然联系，避免过度限定。
translation_notes:
  register: 采用现代、庄重且口语可懂的表达。“眷顾”具有经文语体色彩，但现代读者仍易理解；语序调整为自然汉语，同时保留“这样”、主的主动行动及社会性羞辱。脚注标记置于整句之后。
