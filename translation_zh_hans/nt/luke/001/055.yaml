  text: καθὼς ἐλάλησεν πρὸς τοὺς πατέρας ἡμῶν, τῷ Ἀβραὰμ καὶ τῷ σπέρματι αὐτοῦ εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/055.yaml
  text: just as he spoke to our fathers[b][a], to Abraham and to his offspring forever.
translation:
  language: zh_hans
  text: 正如他向我们的列祖[a]所说的，向亚伯拉罕和他的后裔[b]，直到永远。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我们的祖先”。希腊文直译为“我们的父亲们”；此处指以色列的先祖。
    reason: lexical_alternative
  - marker: b
    text: 或译“他的种子”。希腊文使用单数集合名词，可指“种子”、“后裔”或“子孙”。
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: 正如
  rationale: 表达与上文所述行动的对应关系，并带出这行动符合先前应许的含义。
- source_word: ἐλάλησεν
  choice: 所说的
  rationale: 自然表达过去的说话行动；与“向”搭配，保留神向列祖发言的意思。
- source_word: πρὸς τοὺς πατέρας ἡμῶν
  choice: 向我们的列祖
  rationale: “列祖”既保留希腊文阳性复数所指的先祖，也自然承载以色列圣约历史的语境；脚注注明可译为较一般的“祖先”。
- source_word: τῷ Ἀβραὰμ
  choice: 向亚伯拉罕
  rationale: 承接前面的“向……说”，将亚伯拉罕视为“列祖”的具体说明。
- source_word: τῷ σπέρματι αὐτοῦ
  choice: 和他的后裔
  rationale: σπέρμα为单数集合名词；“后裔”在现代汉语中自然，并可涵盖一个群体而不强行限定单数或复数。脚注保留字面“种子”的意象。
- source_word: εἰς τὸν αἰῶνα
  choice: 直到永远
  rationale: 这是该短语自然、庄重的汉语表达，并保留其持续无尽的时间含义。
theological_decisions:
- issue: πατέρας ἡμῶν的性别和圣约历史色彩
  choice: 我们的列祖
  alternative: 我们的祖先
  rationale: “列祖”保留原文阳性复数及以色列先祖的圣约语境，同时在中文圣经文体中清楚自然。
- issue: σπέρματι αὐτοῦ的单数集合性及圣约意涵
  choice: 他的后裔
  alternative: 他的种子；他的子孙
  rationale: “后裔”可作集合称谓，既不把原文明确改成复数，也不在正文中采用现代汉语里较生硬的“种子”；脚注保留原文字面意象及可能的经文互涉。
- issue: εἰς τὸν αἰῶνα的句法关联
  choice: 以“直到永远”置于句末，不增补其所修饰的对象
  alternative: 明确译成“永远赐给亚伯拉罕和他的后裔”或“他永远的后裔”
  rationale: 原文句末短语的关联范围可由上下文理解；不增补动词或改作修饰“后裔”，以免消除原有的句法张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“列祖”略具圣经语域，但在此圣约历史语境中准确自然。保留原文的并列同位结构和句末“直到永远”，不擅自补足省略成分。
