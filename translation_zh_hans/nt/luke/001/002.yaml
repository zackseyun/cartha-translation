  text: καθὼς παρέδοσαν ἡμῖν οἱ ἀπ’ ἀρχῆς αὐτόπται καὶ ὑπηρέται γενόμενοι τοῦ λόγου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/002.yaml
  text: just as those who from the beginning were eyewitnesses and became servants of the word handed them down to us,[a]
translation:
  language: zh_hans
  text: 正如那些从起初就是亲眼见证者、并成为这道[a]服事者的人，把这些事传给我们一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“这信息”。希腊语 λόγος 可指“道”、“信息”或“记述”；这里很可能指所宣讲的、关于耶稣的信息。
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: 正如……一样
  rationale: 承接上一节，表达相应或比较关系；这一结构在现代汉语中自然，也保留了原文的连接作用。
- source_word: παρέδοσαν
  choice: 传给了
  rationale: 这里指把有关事件的传统或资料传递给后来的人；“传给”简明自然，并保留权威传承的含义。
- source_word: ἡμῖν
  choice: 我们
  rationale: 作间接宾语，直译为“我们”。
- source_word: οἱ ἀπ’ ἀρχῆς
  choice: 那些从起初……的人
  rationale: 保留原文对这一群人的指称及“从起初”的时间限定。
- source_word: αὐτόπται
  choice: 亲眼看见
  rationale: 以自然汉语表达“亲历并亲眼目睹”的见证人含义，避免生硬的“目击者”名词结构。
- source_word: ὑπηρέται
  choice: 服事者
  rationale: 表达为某对象效力、服事的人，同时避免把该词限定为某种正式教会职分。
- source_word: γενόμενοι
  choice: 成为
  rationale: 明确保留该分词的动态含义，不把它弱化为单纯的“是”；句法上与“亲眼看见”并列修饰同一群人。
- source_word: τοῦ λόγου
  choice: 这道
  rationale: “道”保留 λόγος 的词义广度及经文传统用语；加“这”使其在汉语语境中自然地指向前述关于耶稣的宣讲内容。
theological_decisions:
- issue: τοῦ λόγου（“这道”）所指为何
  choice: 正文译作“这道”，主要理解为关于耶稣的宣讲信息
  alternative: “这信息”或“这记述”
  rationale: 上下文更可能指有关耶稣的福音信息，而不是把 λόγος 用作基督论称号；正文保留较宽的“道”，脚注列出较明确的语义选择，以免过度限定。
- issue: γενόμενοι 与“亲眼看见的人”和“服事者”的关系
  choice: 译作“亲眼看见、并成为这道的服事者”
  alternative: “从起初就是亲眼见证人和这道的服事者”
  rationale: “成为”保留 γενόμενοι 的变化或进入某种身份的意味，同时不擅自加入原文没有明说的“后来”。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“从起初亲眼看见”比“从起初为目击者”更自然；“服事者”保留服务于所宣讲之道的含义，不引入特定教会职衔。
