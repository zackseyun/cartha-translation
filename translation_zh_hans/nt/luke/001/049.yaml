  text: ὅτι ἐποίησέν μοι ⸀μεγάλα ὁ δυνατός, καὶ ἅγιον τὸ ὄνομα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/049.yaml
  text: because the Mighty One has done great things for me[a], and holy is his name.
translation:
  language: zh_hans
  text: 因为大能者为我成就了大事；他的名是圣洁的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“圣洁的是他的名。”希腊原文把“圣洁”放在“他的名”之前，以示强调。
    reason: 保留原文前置谓语形容词所产生的强调，并提供较贴近原语序的译法。
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 承接上一节，说明马利亚尊主为大的原因，保留明确的因果关系。
- source_word: ἐποίησέν μοι
  choice: 为我成就了
  rationale: 将不定过去时译为已经完成的行动，并按语境把与格 μοι 理解为受益者；“成就”也自然体现上帝施行大事。
- source_word: μεγάλα
  choice: 大事
  rationale: 中性复数形容词在此作名词用；“大事”简洁自然，并保留所指行动的宽泛性。
- source_word: ὁ δυνατός
  choice: 那大能者
  rationale: 带冠词的形容词实体化，作为对上帝的称号；“大能者”庄重而清楚，“那”体现希腊语冠词所标示的特指。
- source_word: ἅγιον
  choice: 圣洁的
  rationale: 保留对上帝之名的谓语描述；“圣洁”是现代汉语圣经语境中自然且准确的对应词。
- source_word: τὸ ὄνομα αὐτοῦ
  choice: 他的名
  rationale: 直接保留“名”这一原文意象，不将其解释性改写为品格、声誉或身份。
theological_decisions:
- issue: ὁ δυνατός 是否作为神圣称号处理
  choice: 那大能者
  alternative: 那位有大能的
  rationale: 原文以带冠词的形容词作实体名词，具有称号性质；所选译法保留这一形式，同时不加入额外教义内容。
- issue: καὶ ἅγιον τὸ ὄνομα αὐτοῦ 的语序与强调
  choice: 他的名是圣洁的
  alternative: 圣洁的是他的名
  rationale: 原文将 ἅγιον 前置，带有强调；但汉语若直译为“圣洁的是他的名”，容易产生对比或排他意味。正文采用自然、庄重的汉语语序，并以脚注说明原文强调。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“成就了大事”适合颂赞语境；分号清楚呈现两个并列分句。脚注标记置于相关分句之后。
