  text: καὶ ἀνεφώνησεν ⸀κραυγῇ μεγάλῃ καὶ εἶπεν· Εὐλογημένη σὺ ἐν γυναιξίν, καὶ εὐλογημένος ὁ καρπὸς τῆς κοιλίας σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/042.yaml
  text: And she cried out with a loud voice and said[a], “Blessed are you among women, and blessed is the fruit of your womb.”
translation:
  language: zh_hans
  text: 她高声喊道[a]：“你在妇女中是蒙福的！你腹中的果子也是蒙福的！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“她大声呼喊，并说。”
    reason: 原文的动词与方式短语可合并为“高声喊道”，也可较形式化地分别表达为“大声呼喊，并说”。
lexical_decisions:
- source_word: ἀνεφώνησεν
  choice: 呼喊
  rationale: 该动词表示扬声说话或高声喊出；“呼喊”保留声音有力、可听见的意味，又不必暗示悲痛。
- source_word: κραυγῇ μεγάλῃ
  choice: 高声
  rationale: 与“呼喊”连用，自然表达方式与强度；较逐字的“以极大的喊声”更符合现代汉语。
- source_word: Εὐλογημένη
  choice: 蒙福的
  rationale: 保留完成时被动分词所表达的受福状态，并维持祝福宣告的庄重语气，不转入“蒙恩”这一不同词汇范畴。
- source_word: ἐν γυναιξίν
  choice: 在妇女中
  rationale: 忠实保留比较范围；原文没有明确的“所有”，因此不增译“万妇之中”或“所有妇女中”。
- source_word: εὐλογημένος
  choice: 蒙福的
  rationale: 与前一句形成平行的祝福宣告，同时保留被动含义。
- source_word: ὁ καρπὸς
  choice: 果子
  rationale: 保留原文“果实”的隐喻，而不直接解释为“孩子”或“后代”。
- source_word: τῆς κοιλίας σου
  choice: 你腹中的
  rationale: 在怀孕语境中，κοιλία指孕育胎儿的腹部或母腹；“腹中的”准确而自然，并保留母体意象。
theological_decisions:
- issue: 对马利亚所说祝福语的表达
  choice: 在妇女中，你是蒙福的
  alternative: 你在妇女中是有福的
  rationale: 译文如实呈现伊利莎白对马利亚的祝福宣告，同时不引入经文以外的后期教义表述；“蒙福”也较清楚地保留被动意味。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“妇女”比“女人”更适合公开祝福的语境；“腹中的果子”有意保留原文隐喻和两句之间的平行结构。
