  yaml_path: translation/nt/luke/001/021.yaml
  text: And the people were waiting for Zechariah[a], and they were marveling at his delay in the temple.
translation:
  language: zh_hans
  text: 众人正在等候撒迦利亚，并因他在圣所[a]里耽搁许久而感到诧异。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“圣殿里”。原文所用的词指圣殿本体内的圣所，而不是包括各院落在内的整个圣殿区域。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λαὸς
  choice: 众人
  rationale: 这里指聚集在外面等候的一群人；“众人”在现代汉语中自然地表达这个集合意义。
- source_word: προσδοκῶν
  choice: 都在等候
  rationale: 该分词与ἦν构成迂说未完成时，表示持续进行的动作；“都在等候”保留了这一延续感。
- source_word: Ζαχαρίαν
  choice: 撒迦利亚
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: ἐθαύμαζον
  choice: 就感到诧异
  rationale: 该未完成时描写众人持续的惊讶反应；“感到诧异”比“疑惑”更能保留惊异之意，又不额外说明其原因。
- source_word: ἐν τῷ χρονίζειν
  choice: 见他……耽搁了这么久
  rationale: 带冠词的不定式结构表示引起众人诧异的情形；此译法用自然汉语传达他所用时间超过预期，同时保留当时持续发生的语境。
- source_word: ναῷ
  choice: 圣所
  rationale: ναός在此指圣殿主体内祭司供职的神圣区域，有别于包括外围院落在内的整个圣殿范围；“圣所”比笼统的“圣殿”更准确。
- source_word: αὐτόν
  choice: 他
  rationale: 该宾格代词是不定式χρονίζειν的逻辑主语，汉语从句中自然译作“他”。
