  source_fidelity: 草稿准确传达众人在等候撒迦利亚，并对他在ναός中久留感到惊讶的基本意思。但“见他”会暗示众人亲眼看见他在圣所内耽搁；按上下文他们在外面等候，原文也没有“看见”的意思。
  naturalness: “耽搁了这么久”自然，但完成体“了”和口语化的“这么久”略弱化未完成时所呈现的持续状态。改为“耽搁许久”较庄重、贴合叙事，并避免添加视觉动作。
  terminology: “撒迦利亚”及“圣所”均合适。脚注应更清楚地区分ναός所指的圣殿本体／圣所与包括院落在内的整个圣殿区域；“殿里”作为替代译法可保留。
