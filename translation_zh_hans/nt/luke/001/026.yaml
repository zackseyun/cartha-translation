  text: Ἐν δὲ τῷ μηνὶ τῷ ἕκτῳ ἀπεστάλη ὁ ἄγγελος Γαβριὴλ ⸀ἀπὸ τοῦ θεοῦ εἰς πόλιν τῆς Γαλιλαίας ᾗ ὄνομα Ναζαρὲθ
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/026.yaml
  text: In the sixth month[a], the angel Gabriel was sent from God to a city of Galilee named Nazareth[b],
translation:
  language: zh_hans
  text: 到了第六个月[a]，天使加百列奉上帝差遣，前往加利利的一座城，名叫拿撒勒[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 即伊利莎白怀孕的第六个月；参路加福音1:24、36。
    reason: cross_reference
  - marker: b
    text: 或译：“前往加利利境内一座名叫拿撒勒的城。”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ τῷ μηνὶ τῷ ἕκτῳ
  choice: 到了第六个月
  rationale: ἐν加与格构成时间表达；译作“到了第六个月”既自然承接上文，也不把月份所指直接写入正文。δέ仅有轻微承接作用，不另译为表示强转折的词。
- source_word: ἀπεστάλη
  choice: 奉……差遣
  rationale: 该词是ἀποστέλλω的简单过去时被动式，表示“被差遣”。汉语用“奉上帝差遣”自然保留受差遣和神圣委任的含义。
- source_word: ὁ ἄγγελος
  choice: 天使
  rationale: 在本叙事语境中指天上的使者，译作“天使”准确而自然。
- source_word: Γαβριὴλ
  choice: 加百列
  rationale: 采用现代中文圣经传统中通行的人名音译。
- source_word: ἀπὸ τοῦ θεοῦ
  choice: 奉上帝差遣
  rationale: ἀπό加属格首先表达来源，即差遣来自上帝。中文若直译“从上帝那里被差遣”较生硬，故以“奉上帝差遣”表达，同时不增添正文没有的行动内容。
- source_word: εἰς πόλιν τῆς Γαλιλαίας
  choice: 前往加利利的一座城
  rationale: εἰς表示目的地；属格τῆς Γαλιλαίας可理解为属于或位于加利利。中文“加利利的一座城”既贴近结构，也自然清楚。
- source_word: ᾗ ὄνομα Ναζαρὲθ
  choice: 名叫拿撒勒
  rationale: 该关系结构直译为“其名为拿撒勒”；“名叫拿撒勒”简洁、自然，并保留命名意义。
theological_decisions:
- issue: “第六个月”所指为何
  choice: 正文只译“第六个月”，脚注说明按上下文是伊利莎白怀孕的第六个月。
  alternative: 在正文中明确译作“伊利莎白怀孕第六个月”。
  rationale: 路加福音1:24、36清楚提示其所指，但本节希腊文本没有重述伊利莎白或怀孕，因此正文保留原文的省略，解释置于脚注。
- issue: 差遣的来源与施事者
  choice: 译作“奉上帝差遣”。
  alternative: 译作“从上帝那里被差来”。
  rationale: 原文ἀπὸ τοῦ θεοῦ在形式上突出来源；中文“奉上帝差遣”自然地表达上帝是差遣的源头和权柄，同时保持被差遣这一核心语义。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“到了”承接叙事时间推进；“奉上帝差遣，前往……”避免生硬的被动句，同时保留原文的差遣关系。专名采用简体中文基督教文献中通行的“加百列、加利利、拿撒勒、伊利莎白”。
