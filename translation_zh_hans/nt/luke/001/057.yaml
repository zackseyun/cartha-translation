base_translation:
  language: en
  yaml_path: translation/nt/luke/001/057.yaml
  text: The time was fulfilled for Elizabeth to give birth[a], and she bore a son.
translation:
  language: zh_hans
  text: 伊利莎白的产期到了[a]，她生了一个儿子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“伊利莎白生育的日子满了。”
    reason: 保留原文“时候满了”这一较为直译的表达，供读者了解源文措辞。
lexical_decisions:
- source_word: δὲ
  choice: （不单独译出）
  rationale: 这是轻微的叙事连接词；本句承接上文十分自然，若机械译作“现在”会误添明确的时间副词含义，译作“于是”又可能加强事件关系，因此不单独呈现。
- source_word: Ἐλισάβετ
  choice: 伊利莎白
  rationale: 采用现代中文圣经读者熟悉的人名音译。
- source_word: ἐπλήσθη ὁ χρόνος
  choice: 产期到了
  rationale: 原文直译为“时候满了”，在这里指妊娠期完成。中文用“产期到了”自然、清楚，并保留期限届满的意思。
- source_word: τοῦ τεκεῖν αὐτήν
  choice: （融入“她的产期”）
  rationale: 带冠词的不定式结构说明这是她生产的时候；中文将其整合为“伊利莎白的产期”，避免生硬地重复“生产”。
- source_word: ἐγέννησεν
  choice: 生了
  rationale: 简洁表达已经发生的分娩事件，符合中文叙事习惯。
- source_word: υἱόν
  choice: 一个儿子
  rationale: 准确保留原文明确的男性亲属称谓；不泛化为“孩子”。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“产期到了”比“时候满了，可以生产”更符合当代中文表达；后半句以“就”体现顺承关系，但不赋予额外的因果含义。
