  text: Εὐλογητὸς κύριος ὁ θεὸς τοῦ Ἰσραήλ, ὅτι ἐπεσκέψατο καὶ ἐποίησεν λύτρωσιν τῷ λαῷ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/068.yaml
  text: Blessed is the Lord, the God of Israel, because he has visited and brought redemption to his people,
translation:
  language: zh_hans
  text: “主——以色列的上帝——当受颂赞！因为他眷顾了自己的子民，为他们成就了救赎。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “眷顾”也可译作“临到并帮助”；原文是圣经惯用语，指上帝关注并亲自介入。
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐλογητὸς
  choice: 当受颂赞
  rationale: 这里是颂赞式的表语形容词；“当受颂赞”在现代汉语中庄重自然，也保留祝颂语气。
- source_word: κύριος ὁ θεὸς τοῦ Ἰσραήλ
  choice: 主——以色列的上帝——
  rationale: “主”作为神圣称号，“以色列的上帝”与之同位；破折号清楚呈现同位关系，并保留经文的礼仪性回响。
- source_word: ὅτι
  choice: 因为
  rationale: 引出上帝当受颂赞的原因，现代汉语中直接清楚。
- source_word: ἐπεσκέψατο
  choice: 眷顾了
  rationale: 该词在圣经语境中不只是一般探访，而指带着关切临到并施行干预；“眷顾”保留这一惯用表达及其正面含义。
- source_word: ἐποίησεν λύτρωσιν
  choice: 成就了救赎
  rationale: 直译近似“施行／作成救赎”；“成就了救赎”既自然，又保留行动及结果，并承载 λύτρωσις 的救赎分量。
- source_word: τῷ λαῷ αὐτοῦ
  choice: 为他们／自己的子民
  rationale: 与前一动词的隐含对象及后一行动的受益者自然结合为“眷顾了自己的子民，为他们……”，避免汉语中误读为仅“把救赎带给”而削弱两个动作的并列。
theological_decisions:
- issue: 上帝“临到／探访”的圣经性表达
  choice: 眷顾了
  alternative: 临到并帮助了；探访了
  rationale: “眷顾”既传达上帝关注其子民，也保留其采取拯救行动的经文含义；不把该词缩减为单纯的“帮助”，也避免现代汉语“探访”可能产生的一般社交含义。
- issue: λύτρωσις 的语义范围
  choice: 救赎
  alternative: 拯救；释放
  rationale: “救赎”保留释放、赎回及救恩语境中的丰富含义，不将其限定为一般脱险。
translation_notes:
  register: 采用现代、庄重而易懂的颂赞体。“主——以色列的上帝——”以同位结构保留原文次序；后半句按汉语习惯明确“自己的子民”是眷顾的对象和救赎的受益者。
