  text: καὶ ἰδοὺ συλλήμψῃ ἐν γαστρὶ καὶ τέξῃ υἱόν, καὶ καλέσεις τὸ ὄνομα αὐτοῦ Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/031.yaml
  text: And behold[a], you will conceive in your womb and bear a son, and you will call his name Jesus.
translation:
  language: zh_hans
  text: 看哪，你将受孕，生下一个儿子，并要给他取名叫耶稣。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“你要称他的名为耶稣。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留这一引人注意、带有宣告意味的话语标记；措辞庄重，也为现代读者所熟悉。
- source_word: συλλήμψῃ ἐν γαστρὶ
  choice: 你将受孕
  rationale: 这一组合表达在腹中成孕；“受孕”准确、简洁，现代汉语无需重复说“在腹中”。
- source_word: τέξῃ
  choice: 生下
  rationale: 准确表达分娩、生育之意，与后面的“一个儿子”搭配自然。
- source_word: υἱόν
  choice: 一个儿子
  rationale: 保留原文明确的男性亲属称谓，不泛化为“孩子”。
- source_word: καλέσεις τὸ ὄνομα αὐτοῦ
  choice: 给他取名叫
  rationale: 以自然的现代汉语表达原文的命名公式，同时在脚注保留其较直译的形式。
- source_word: Ἰησοῦν
  choice: 耶稣
  rationale: 采用新约人名在现代汉语中的通行译名。
theological_decisions:
- issue: 命名公式 καλέσεις τὸ ὄνομα αὐτοῦ 的表达
  choice: 给他取名叫耶稣
  alternative: 称他的名为耶稣
  rationale: 两种表达在意义上相同；正文采用自然、清楚的现代汉语，脚注保留较贴近原文结构且具有经文风格的译法，不赋予两者额外的神学差异。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“看哪”保留天使宣告的郑重语气；其余句式避免生硬仿照希腊语，同时保存受孕、生子和命名三个连续动作。
