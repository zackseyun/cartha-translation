  language: zh_hans
  text: 他的母亲回答说：“不，而要叫他[a]约翰。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他将被称为约翰。”
    reason: 原文κληθήσεται是将来时被动形式；正文采用中文命名时更自然的“叫他……”，脚注保留较直接反映被动形式的译法。
lexical_decisions:
- source_word: ἀποκριθεῖσα
  choice: 回答说
  rationale: 这是ἀποκρίνομαι的不定过去时分词，常用于引出直接引语。译作“回答说”既体现回应语气，也符合现代汉语叙事习惯。
- source_word: μήτηρ αὐτοῦ
  choice: 他母亲
  rationale: 以自然的汉语领属结构表达原文确定而明确的亲属关系。
- source_word: Οὐχί
  choice: 不！
  rationale: 此处是对前文命名提议的明确否定；“不！”简洁有力，保留原文的强烈否定语气。
- source_word: ἀλλὰ
  choice: （由“不！他要……”体现）
  rationale: ἀλλά具有纠正前一提议的作用。现代汉语在强烈否定之后直接提出正确说法，已自然表达“而是”的转折纠正功能，避免生硬地译成“不，而是……”。
- source_word: κληθήσεται
  choice: 要叫
  rationale: 这是καλέω的将来时被动形式，在命名语境中译作“要叫”自然清楚，并保留尚待正式命名的将来意味；原文被动形式另见脚注。
- source_word: Ἰωάννης
  choice: 约翰
  rationale: 采用现代中文圣经传统中通行的人名译法。
