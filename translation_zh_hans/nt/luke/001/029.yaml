  rationale: 修订将脚注a锚定于“因这话”，使其与所说明的ἐπὶ τῷ λόγῳ直接对应；以“大为不安”加强对διεταράχθη的反映；并将“究竟是什么意思”改为“这究竟是怎样的问候”，恢复ποταπός修饰ἀσπασμός的原文结构和语义，同时保留马利亚持续审思、尚未确定的语气。
