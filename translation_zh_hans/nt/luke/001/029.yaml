  text: ἡ δὲ ⸂ἐπὶ τῷ λόγῳ διεταράχθη⸃ καὶ διελογίζετο ποταπὸς εἴη ὁ ἀσπασμὸς οὗτος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/029.yaml
  text: But she was greatly troubled at the message[b][a], and kept considering what kind of greeting this might be.
translation:
  language: zh_hans
  text: 她却因这话[a]大为不安，反复思量[b]这究竟是怎样的问候。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “因这话”也可译作“对这话”或“因这番话”。希腊语λόγος可指“话”“言语”或“信息”。
    reason: lexical_alternative
  - marker: b
    text: “反复思量”所译的希腊语动词采用未完成时，表示持续的思索；“这究竟是怎样的问候”直译可作“这问候会是何种问候”。
    reason: lexical_and_grammatical_alternative
lexical_decisions:
- source_word: δὲ
  choice: 却
  rationale: 承接上文并转向马利亚的反应，表达轻微转折，符合现代汉语叙事习惯。
- source_word: ἐπὶ τῷ λόγῳ
  choice: 因这话
  rationale: λόγος在此指天使刚说的话；“这话”自然贴近原文，也保留“话、言语、信息”的词义空间。ἐπί加与格在此可表达反应所针对的内容或缘由。
- source_word: διεταράχθη
  choice: 很不安
  rationale: 该动词表示受到强烈搅扰；“很不安”自然传达其加强语气，又不额外推定恐惧、不信或道德过失。
- source_word: διελογίζετο
  choice: 反复思量
  rationale: 未完成时呈现持续的内心思索；“反复思量”兼顾延续性与审慎推想。
- source_word: ποταπὸς
  choice: 究竟是什么意思
  rationale: 字面义为“什么样的”。结合汉语中对问候内容进行思量的自然表达，译为“究竟是什么意思”，传达对其性质与含义的探究。
- source_word: εἴη
  choice: 究竟是
  rationale: 间接问句中的希求式带有推想和未确定色彩；汉语以“究竟”自然呈现这种审思语气。
- source_word: ἀσπασμὸς οὗτος
  choice: 这样的问候
  rationale: 指向刚才特定的问候。“这样的问候”既保留指示性，也与ποταπός所问的性质相呼应。
theological_decisions:
- issue: 马利亚反应的性质
  choice: 她因天使所说的话而深受搅扰，并持续思量这问候的含义；不判定她是不信或有道德过失。
  alternative: 将她的不安解释为因天使显现而害怕，或解释为不信。
  rationale: 希腊文明确以ἐπὶ τῷ λόγῳ将反应联系于所说的话，并以διελογίζετο描写持续思量，没有作出不信或道德上的评价。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“很不安”避免过度古雅或心理诊断式措辞；“反复思量”体现持续的内心活动。所有脚注标记均置于正文相关表达之后。
