id: LUK.1.52
reference: Luke 1:52
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καθεῖλεν δυνάστας ἀπὸ θρόνων καὶ ὕψωσεν ταπεινούς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/052.yaml
  text: He has brought down rulers from thrones and exalted the humble[a][b].
translation:
  language: zh_hans
  text: 他使有权势的人从宝座上下来，又高举卑微的人[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “有权势的人”也可译作“统治者”。原词可泛指有势力的人，但“从宝座上”使统治者的含义较突出。
    reason: lexical_alternative
  - marker: b
    text: “卑微的人”也可译作“谦卑的人”或“地位低微的人”。原词可能兼有谦卑和社会地位低下两层含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: καθεῖλεν
  choice: 使……下来
  rationale: 该动词表示使人从高位降下或推翻；结合“从宝座上”，译为“使……下来”既自然，又不额外限定为暴力推翻或正式罢黜。
- source_word: δυνάστας
  choice: 有权势的人
  rationale: 该名词可指掌权者、统治者或一般有势力的人。“宝座”使统治者的含义较突出，但“有权势的人”保留了原词较宽的语义范围。
- source_word: ἀπὸ θρόνων
  choice: 从宝座上
  rationale: 保留原文具体的宝座意象，不解释性地改写为“权位”，也不添加原文没有明说的“他们的”。
- source_word: ὕψωσεν
  choice: 高举
  rationale: 该动词意为举高、提升或尊崇；“高举”在现代中文中自然，并与前半句从高位降下的反转形成鲜明对应。
- source_word: ταπεινούς
  choice: 卑微的人
  rationale: 该词既可能指谦卑者，也可能指社会地位低下、受压低的人。“卑微的人”较能保留这两层可能含义。
theological_decisions:
- issue: 《尊主颂》中不定过去时的时态与体貌
  choice: 用中文无标记动词“使……下来”“高举”，不添加“已经”
  alternative: 译作“已经使……下来，又已经高举”，明确表达完成并持续有效的行动
  rationale: 希腊文不定过去时将这些行动呈现为整体性的、决定性的作为，但在颂歌中究竟是回顾、预示性宣告还是赞美中的概括，仍有张力。中文动词本身不强制标明时态，因而能自然保留这种开放性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“使……从宝座上下来”保留原文具体意象；“有权势的人”和“卑微的人”避免过早缩窄两组词的社会与品格含义。
