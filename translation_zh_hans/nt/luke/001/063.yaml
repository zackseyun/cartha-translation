  yaml_path: translation/nt/luke/001/063.yaml
  text: And after asking for a writing tablet[a], he wrote, saying, “John is his name.” And they all marveled.
translation:
  language: zh_hans
  text: 他要了一块写字板，写道：“他的名字是约翰。”众人都很惊奇。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἰτήσας
  choice: 要了
  rationale: 不定过去时分词表示先于主句的动作；“要了……就……”以自然汉语清楚呈现动作次序。
- source_word: πινακίδιον
  choice: 一块写字板
  rationale: 指供书写用的小板；“写字板”在现代汉语中清楚明白，并以量词“一块”体现其具体物件性质。
- source_word: ἔγραψεν λέγων
  choice: 就写道
  rationale: “写道”自然地表达以书写方式引出下文内容，既涵盖ἔγραψεν，也以符合汉语习惯的方式传达λέγων的引述功能，避免生硬译作“写着说”。
- source_word: Ἰωάννης
  choice: 约翰
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: ἐστὶν ὄνομα αὐτοῦ
  choice: 是他的名字
  rationale: 保留希腊文“约翰”前置的语序和现在时判断，突出对这个名字的明确确认；不译作“要叫约翰”，以免加入将来或命名动作的含义。
- source_word: ἐθαύμασαν πάντες
  choice: 众人都很惊奇
  rationale: θαυμάζω在此表示因所见所闻而惊讶；“众人都很惊奇”是自然、庄重的现代叙事表达，并保留πάντες的整体强调。
theological_decisions:
- issue: 名字陈述的时态与强调
  choice: “约翰是他的名字”
  alternative: “他要叫约翰”或“他的名字是约翰”
  rationale: 原文使用现在时ἐστίν，并将Ἰωάννης置于句首；所选译法保留已确定之名的断然确认及其强调，不将其解释为将来的命名行为。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。以“写道”顺应汉语书面叙事习惯，同时保留原文引述结构；直接语中的略显标记性语序有意保留，以体现对神所赐名字的强调。
