id: LUK.1.11
reference: Luke 1:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὤφθη δὲ αὐτῷ ἄγγελος κυρίου ἑστὼς ἐκ δεξιῶν τοῦ θυσιαστηρίου τοῦ θυμιάματος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/011.yaml
  text: Then an angel of the Lord appeared to him, standing at the right side of the altar of incense.
translation:
  language: zh_hans
  text: 这时，主的一位天使向他显现，站在香坛的右边。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὤφθη
  choice: 显现
  rationale: 该词虽为ὁράω的不定过去时被动形式，但在此类叙事语境中通常具有不及物意义，表示“显现”。“向他显现”既符合现代汉语习惯，也保留了天使进入可见状态的事件性。
- source_word: δὲ
  choice: 这时
  rationale: δέ在这里推动叙事发展，并非表达强烈转折。“这时”自然衔接前文正在献香的场景，同时不过度强调严格的先后关系。
- source_word: αὐτῷ
  choice: 向他
  rationale: 与ὤφθη连用的与格指出显现的对象；“向他显现”是准确自然的汉语表达。
- source_word: ἄγγελος
  choice: 天使
  rationale: 在圣殿异象的语境中，此词指属天的使者，因此译作“天使”比泛称“使者”更合适。
- source_word: κυρίου
  choice: 主的
  rationale: 属格结构ἄγγελος κυρίου译作“主的一位天使”，保留κύριος的称号含义，也符合汉语领属结构。
- source_word: ἑστὼς
  choice: 站在
  rationale: 该完成时主动分词描述天使显现时所处的姿势和位置；汉语用“站在”自然明确。
- source_word: ἐκ δεξιῶν
  choice: 右边
  rationale: 该习语表示位于某物右侧；“在……的右边”清楚保留其方位意义。
- source_word: θυσιαστηρίου τοῦ θυμιάματος
  choice: 香坛
  rationale: 该属格结构指献香所用的坛。“香坛”是简洁、通行且准确的现代汉语名称。
theological_decisions:
- issue: 短语ἄγγελος κυρίου中κύριος的译法
  choice: 主
  alternative: 上主
  rationale: 译作“主”直接保留κύριος的称号，不额外引入特定宗派用语；“主的一位天使”也避免把该短语理解成天使独有的专名。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“这时”承接前文场景；“主的一位天使”比“主的使者”更明确表达此处属天存在者的身份，同时保留原文不定指；整句按汉语信息顺序组织，简洁清楚。
