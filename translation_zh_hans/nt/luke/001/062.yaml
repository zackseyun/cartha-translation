  text: ἐνένευον δὲ τῷ πατρὶ αὐτοῦ τὸ τί ἂν θέλοι καλεῖσθαι ⸀αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/062.yaml
  text: So they motioned to his father to find out what he wanted him to be called.
translation:
  language: zh_hans
  text: 于是，他们向孩子的父亲打手势，问他想给孩子起什么名字。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“他们向他父亲打手势，问他想让孩子被称作什么。”
    reason: 保留希腊文καλεῖσθαι的被动式及间接疑问结构，主译则采用汉语命名语境中更自然的表达。
lexical_decisions:
- source_word: ἐνένευον
  choice: 打手势
  rationale: 该动词指用点头、手势等非言语方式示意；“打手势”在现代汉语中自然清楚，也符合撒迦利亚当时不能说话的叙事语境。
- source_word: δὲ
  choice: 于是
  rationale: δέ在这里是推进叙事的轻微连接词；“于是”自然承接上一节众人对孩子名字的争议。
- source_word: τῷ πατρὶ αὐτοῦ
  choice: 向孩子的父亲
  rationale: 与ἐνένευον连用的与格表示手势所指向的对象；补明“孩子”可避免现代汉语中代词指代含混。
- source_word: τὸ τί ἂν θέλοι
  choice: 问他想……什么
  rationale: 带冠词的间接疑问结构表达示意的内容；ἄν加愿望式带有不确定或委婉色彩，汉语以“想”自然传达，不必机械加上“可能”。
- source_word: καλεῖσθαι αὐτό
  choice: 给孩子起什么名字
  rationale: 希腊文直译为“孩子想被叫作什么”；中文命名语境通常说“给孩子起什么名字”，虽转为主动表达，却自然准确地传达被动不定式的意义。
theological_decisions: []
