source:
  edition: SBLGNT
  text: καὶ ἐγένετο ὡς ἐπλήσθησαν αἱ ἡμέραι τῆς λειτουργίας αὐτοῦ, ἀπῆλθεν εἰς τὸν οἶκον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/023.yaml
  text: And it happened that when the days of his service were completed[b][a], he went to his home.
translation:
  language: zh_hans
  text: 他供职的日子满了，就回自己家去了。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “供职”指撒迦利亚按所定班次在圣殿履行祭司职务。
    reason: cultural_note
  - marker: b
    text: “家”也可译作“房子”；希腊文既可指住所本身，也可较宽泛地指家或家庭。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: 不单独译出
  rationale: 这是路加常用的叙事衔接语；现代汉语在此直接进入时间从句更自然，其叙事推进功能由整句承载。
- source_word: ὡς
  choice: ……满了，就……
  rationale: 在此引出时间从句；用“……就……”自然表达前一阶段结束后发生的行动。
- source_word: ἐπλήσθησαν αἱ ἡμέραι
  choice: 日子满了
  rationale: 保留“达到足数、期满”的意象，同时是自然、庄重的现代汉语。
- source_word: λειτουργίας
  choice: 供职
  rationale: 上下文所指是撒迦利亚按班次承担的圣殿祭司职务；“供职”简洁表达履行职务，脚注说明具体背景。
- source_word: ἀπῆλθεν
  choice: 回……去了
  rationale: 结合目的地是自己的家，汉语用“回”比一般性的“去”更符合场景；“去了”自然表达离开当时地点。
- source_word: εἰς τὸν οἶκον αὐτοῦ
  choice: 回自己家
  rationale: οἶκος可指房屋，也可宽泛指家或家庭；正文用“家”保持自然，并以脚注保留词义范围。
theological_decisions: []
translation_notes:
  register: 采用现代、简洁而庄重的叙事语体。“日子满了”保留原文的完成意象；省去若直译会显得累赘的叙事公式“事情发生了”，但不改变事件顺序。脚注标记均置于正文相关句末。
