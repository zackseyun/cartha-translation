  text: And why is this granted to me[a], that the mother of my Lord should come to me?
translation:
  language: zh_hans
  text: 我怎么会有这样的荣幸，让我主的母亲到我这里来呢？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较直译：“这事从哪里临到我，使我主的母亲到我这里来呢？”这是表达惊讶于自己竟蒙受如此尊荣的说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: πόθεν μοι τοῦτο
  choice: 我怎么配得这样的恩遇呢
  rationale: 原文直译近似“这从哪里临到我”，是表达惊讶和自觉不配的习语。中文用“怎么配得这样的恩遇”自然传达意外蒙受尊荣的语气；“恩遇”在此指所受的厚待，不额外界定其神学机制。
- source_word: ἵνα ἔλθῃ
  choice: 竟然到……来
  rationale: ἵνα在此说明令说话者惊叹之事的内容。“竟然”体现其惊异语气，同时保持“到来”这一事件本身。
- source_word: ἡ μήτηρ τοῦ κυρίου μου
  choice: 我主的母亲
  rationale: 按原文保留“我主”这一郑重称谓，不弱化为“我的主人”，也不加入本节未明说的后期教义表述。
- source_word: πρὸς ἐμέ
  choice: 到我这里来
  rationale: 自然表达朝向并来到以利沙伯这里；不具体增译为“到我家里”。
theological_decisions:
- issue: κυρίου在“我主的母亲”中的译法
  choice: 我主
  alternative: 我的主人
  rationale: “主”保留κύριος在本段中的敬称及基督论分量，同时不超出本节文字另作定义。
- issue: 是否按字面翻译πόθεν μοι τοῦτο
  choice: 我怎么配得这样的恩遇呢
  alternative: 这事从哪里临到我呢
  rationale: 原文是带有惊叹意味的习语。意合译文使现代中文读者准确领会以利沙伯因所受尊荣而惊讶、自觉不配的语气；脚注保留较直译形式。
translation_notes:
  register: 采用现代、庄重而口语顺畅的普通话。“竟然……怎么配得……”保留原句的惊叹和自谦；“恩遇”略带庄重色彩，但普通读者容易理解。
