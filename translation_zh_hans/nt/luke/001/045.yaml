  text: καὶ μακαρία ἡ πιστεύσασα ὅτι ἔσται τελείωσις τοῖς λελαλημένοις αὐτῇ παρὰ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/045.yaml
  text: And blessed is she who believed that there will be a fulfillment of what was spoken to her by the Lord[a][b].
translation:
  language: zh_hans
  text: 那位相信主对她所说的话必定会成就的女子，是有福的！[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那相信的女子是有福的，因为主对她所说的话必会成就。”希腊语连接词在这里也可能表示原因，但表示所相信的内容更为可能。
    reason: alternative_reading
  - marker: b
    text: “成就”也可译作“完成”或“实现”。
    reason: lexical_alternative
lexical_decisions:
- source_word: μακαρία
  choice: 有福的
  rationale: “有福的”保留路加福音中 μακάριος 一词的宗教和圣约意味，也比偏重主观感受的“快乐”或较世俗的“幸运”更合适。
- source_word: πιστεύσασα
  choice: 相信……的女子
  rationale: 带冠词的简单过去时分词 ἡ πιστεύσασα 在此作名词性用法；译文以“相信……的女子”自然表达，并保留她已经相信这一事实。
- source_word: ὅτι
  choice: 相信……必会
  rationale: ὅτι 最自然地引出所相信的内容，即主所说的话必会成就；其可能的原因义“因为”收入脚注，以保留句法上的歧义。
- source_word: τελείωσις
  choice: 成就
  rationale: τελείωσις 指使某事达到完成；在神应许的话语这一语境中，“成就”自然贴切，同时保留“完成”的词义空间。
- source_word: τοῖς λελαλημένοις αὐτῇ
  choice: 对她所说的话
  rationale: 带冠词的完成时被动分词指先前向她说出的内容；“对她所说的话”在中文中简洁自然，并体现先前言说的结果仍然有效。
- source_word: παρὰ κυρίου
  choice: 主对她所说的
  rationale: παρά 加属格表明话语源自主；中文以“主对她所说”自然表达其来源，也符合上下文中神所赐信息的含义。
- source_word: κυρίου
  choice: 主
  rationale: κύριος 在此指以色列的神，是应许之言的来源；译作“主”符合现代中文圣经语体。
theological_decisions:
- issue: 马利亚蒙福与她的信心及主所说之话的关系
  choice: 她因相信主所说的话必会成就而被称为有福；ὅτι 作为相信内容的引导词。
  alternative: ὅτι 可按原因义理解：她是有福的，因为主对她所说的话必会成就。
  rationale: 句法和上下文更自然地把 ὅτι 从句连接于 πιστεύσασα，突出她相信神的应许；脚注保留原因义的可能，不引入本节以外关于马利亚的教义判断。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“女子”明确表达阴性名词性分词所指的人；句末用感叹号体现伊利莎白宣告祝福的语气。主句使用“有福的”承接路加福音的祝福用语，并以自然中文语序嵌入相信的内容。
