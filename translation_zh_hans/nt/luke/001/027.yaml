  text: πρὸς παρθένον ⸀ἐμνηστευμένην ἀνδρὶ ᾧ ὄνομα Ἰωσὴφ ἐξ οἴκου Δαυίδ, καὶ τὸ ὄνομα τῆς παρθένου Μαριάμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/027.yaml
  text: to a virgin pledged in marriage to a man whose name was Joseph, from the house of David; and the virgin’s name was Mary.
translation:
  language: zh_hans
  text: 到一位童女那里；她已经许配给一个名叫约瑟的人[a]。约瑟出自大卫家。童女名叫马利亚[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “许配”指正式婚约已经成立，但尚未进入完整的婚姻共同生活。
    reason: lexical_alternative
  - marker: b
    text: “马利亚”按希腊文音译也可作“马里亚姆”。
    reason: lexical_alternative
lexical_decisions:
- source_word: παρθένον / παρθένου
  choice: 童女
  rationale: 这里通常指未有性关系的女子；路加在同一节重复使用该词，译作“童女”既准确表达其含义，也保留庄重的圣经语体。
- source_word: ἐμνηστευμένην
  choice: 已经许配
  rationale: 完成时分词表示正式婚约已经成立并持续有效。“已经许配”在现代汉语中自然清楚，也比“订婚”更能体现当时婚约的正式社会和法律地位。
- source_word: ἀνδρὶ
  choice: 给一个……的人
  rationale: ἀνήρ可指“男人”或“丈夫”；这里由许配关系限定，译作“一个……的人”避免超前断定婚姻已完全成立。
- source_word: ᾧ ὄνομα Ἰωσὴφ
  choice: 名叫约瑟
  rationale: 以自然现代汉语表达希腊文的命名句式，不损失信息。
- source_word: ἐξ οἴκου Δαυίδ
  choice: 出自大卫家
  rationale: 保留“家”所承载的家族、谱系和王朝意味，同时自然表达ἐξ的来源含义。
- source_word: Μαριάμ
  choice: 马利亚
  rationale: 采用中文圣经传统中广为人知的标准人名形式；较贴近希腊文音形的“马里亚姆”列入脚注。
theological_decisions:
- issue: παρθένος是否应明确保留童贞含义
  choice: 童女
  alternative: 年轻女子
  rationale: 该词在本节及路加叙事语境中明确支持“童女”；这一译法忠实呈现原文的神学相关含义，而非从外部加入解释。
- issue: 如何表达许配状态而不把婚姻阶段说得过满
  choice: 已经许配
  alternative: 已经订婚／已聘定
  rationale: “已经许配”既体现正式婚约已确立，也不暗示婚姻已经圆房，从而保留古代婚约状态与现代婚姻概念之间的区别。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。为避免中文长句中“出自大卫家”所修饰对象产生不必要的歧义，将其另成一句，清楚表明约瑟出自大卫家；保留原文对“童女”的重复。
