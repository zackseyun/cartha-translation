  text: ἔδοξε κἀμοὶ παρηκολουθηκότι ἄνωθεν πᾶσιν ἀκριβῶς καθεξῆς σοι γράψαι, κράτιστε Θεόφιλε,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/003.yaml
  text: it seemed good to me also[a], having followed all things closely from the beginning, to write them to you in orderly sequence, most excellent Theophilus[b],
translation:
  language: zh_hans
  text: 我也觉得合宜：既从起初仔细查考了一切，就按次序写给你，尊贵的提阿非罗，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔδοξε κἀμοὶ
  choice: 我也……认为应该
  rationale: 保留 δοκέω 表达审慎判断或决定的语气，也以“也”承接上文那些已经动笔叙述的人；这样的汉语表达比直译为“在我看来是好的”更自然。
- source_word: παρηκολουθηκότι
  choice: 仔细考察了
  rationale: 该词可表示密切跟随、详尽了解或调查考察；结合 ἀκριβῶς，此处译为“仔细考察”能自然表达作者经过审慎查考而掌握材料，同时以脚注保留另一种理解。
- source_word: ἄνωθεν
  choice: 从起初
  rationale: 在这段史著式序言中，最自然的意思是“从开端”，而不是“从上面”。
- source_word: πᾶσιν
  choice: 这一切
  rationale: 指上文所说已经成就并传下来的全部相关事情；加“这”使现代汉语衔接自然。
- source_word: ἀκριβῶς
  choice: 仔细
  rationale: 表达周密、精确的意味，并与“考察”自然搭配。
- source_word: καθεξῆς
  choice: 按次序
  rationale: 既可指依次叙述，也可指有条理地编排；“按次序”保留这种范围，不限定为严格的年代顺序。
- source_word: σοι γράψαι
  choice: 写给你
  rationale: 准确表达 γράφω 加间接受词的收信人关系，简洁自然。
- source_word: κράτιστε
  choice: 尊贵的
  rationale: 这是正式而恭敬的称呼；“尊贵的”保留礼貌与身份色彩，又不擅自添加具体官衔。
- source_word: Θεόφιλε
  choice: 提阿非罗
  rationale: 采用现代中文圣经语境中通行的人名音译。
theological_decisions:
- issue: καθεξῆς 是否声称严格按年代编排
  choice: 译作“按次序”
  alternative: 按年代顺序；有条理地
  rationale: 原词可以表示先后次序，也可以表示有条理的安排；正文不把路加的说法强化为严格的现代编年主张，脚注则明确保留其语义弹性。
translation_notes:
  register: 采用自然、庄重的现代书面汉语，保留路加序言的正式献辞语气。本节在希腊文中仍属跨节延续的长句，因此正文末用逗号，与下一节衔接。
