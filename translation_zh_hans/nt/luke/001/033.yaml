  text: καὶ βασιλεύσει ἐπὶ τὸν οἶκον Ἰακὼβ εἰς τοὺς αἰῶνας, καὶ τῆς βασιλείας αὐτοῦ οὐκ ἔσται τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/033.yaml
  text: And he will reign over the house of Jacob forever[a], and of his kingdom there will be no end.
translation:
  language: zh_hans
  text: 他将永远作王，统治雅各家[a]；他的国度将永无穷尽。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“直到永世”。希腊语 εἰς τοὺς αἰῶνας 是表达无尽持续时间的惯用语。
    reason: 词义替代译法
lexical_decisions:
- source_word: βασιλεύσει
  choice: 要作王统治
  rationale: 该词是 βασιλεύω 的将来时主动语态，表示以君王身份施行统治。“作王统治”在现代汉语中明确保留其君王含义。
- source_word: ἐπὶ τὸν οἶκον Ἰακώβ
  choice: 雅各家
  rationale: ἐπί 加宾格在此表示统治所及的对象；“雅各家”保留圣经传统中的群体性、盟约性称谓，不将其解释性改写为“以色列人”或“上帝的子民”。
- source_word: εἰς τοὺς αἰῶνας
  choice: 直到永远
  rationale: 这一希腊语惯用语表达无尽的持续时间；“直到永远”自然清楚，也与后半句“没有穷尽”相呼应。
- source_word: βασιλείας
  choice: 国
  rationale: βασιλεία 可指王权、统治或国度；此处与“没有穷尽”搭配，译作“国”简洁自然，同时保留原词所含的王权与国度意味。
- source_word: οὐκ ἔσται τέλος
  choice: 必没有穷尽
  rationale: 这是带将来意义的存在句，否定明确；“必没有穷尽”既传达将来性和确定性，也保持庄重而易懂的语体。
theological_decisions:
- issue: “雅各家”的范围
  choice: 保留“雅各家”，不在正文中扩大或改写其所指。
  alternative: 以色列人；上帝的子民
  rationale: 原文采用传统的盟约群体称谓。保留该表达可避免预先解决其范围所涉及的神学问题。
- issue: 统治持续的时间
  choice: 将 εἰς τοὺς αἰῶνας 译为“直到永远”，并将后句译为“他的国必没有穷尽”。
  alternative: 直到万世；世世代代
  rationale: 原文以惯用语和否定“终点”的陈述共同强调无尽的持续；此译法在现代汉语中清楚表达这一点，又不削弱原文力度。
- issue: βασιλεία 的语义
  choice: 正文译为“国”。
  alternative: 王权；统治；国度
  rationale: 该词本身可兼有王权、统治和国度之义。语境中译作“国”最自然，但不据此排除其动态的统治含义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“作王统治”明确表达 βασιλεύσει 的君王性；“雅各家”保留原文的圣经传统措辞；分号呈现两个彼此加强的并列陈述。
