  text: τοῦ δοῦναι γνῶσιν σωτηρίας τῷ λαῷ αὐτοῦ ἐν ἀφέσει ἁμαρτιῶν αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/077.yaml
  text: to give knowledge of salvation to his people in the forgiveness of their sins,[a]
translation:
  language: zh_hans
  text: 使他的子民在他们的罪得赦免中认识救恩。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使他的子民借着他们的罪得赦免而认识救恩”，或“使他的子民因他们的罪得赦免而认识救恩”。
    reason: ἐν ἀφέσει可理解为范围或关联（正文），也可理解为工具性或原因性关系；脚注保留这些可成立的替代译法。
lexical_decisions:
- source_word: τοῦ δοῦναι
  choice: 使……知道
  rationale: 带冠词的不定式承接上文，表达目的；汉语以“使……知道”自然传达“赐予知识”的使动含义，也避免生硬的“给予……知识”。
- source_word: γνῶσιν σωτηρίας
  choice: 知道救恩
  rationale: γνῶσις可指知识、认识或了解；“知道救恩”在现代汉语中清楚自然，并保留“对救恩的认识”这一基本含义。
- source_word: τῷ λαῷ αὐτοῦ
  choice: 他的子民
  rationale: 与格标明领受者；“子民”适合λαός在此处的群体及盟约语境，同时保留αὐτοῦ“他的”。
- source_word: ἐν ἀφέσει
  choice: 在于……得赦免
  rationale: ἐν与与格可表示范围、方式或关联；“在于”保留救恩之认识与罪得赦免之间的紧密关系，而不明确限定为工具或原因。
- source_word: ἁμαρτιῶν αὐτῶν
  choice: 他们的罪
  rationale: 保留αὐτῶν所指的归属关系；汉语“罪”通常可作集合名词，已能自然涵盖希腊文复数ἁμαρτιῶν。
theological_decisions:
- issue: 救恩与罪得赦免的关系
  choice: 译作“知道救恩，在于他们的罪得赦免”
  alternative: “借着他们的罪得赦免而知道救恩”或“因他们的罪得赦免而知道救恩”
  rationale: ἐν ἀφέσει可表达范围、方式或工具关系。“在于”突出救恩的认识具体关联于罪得赦免，却不把句意收窄为纯粹工具或因果关系，因而保留原文的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“子民”保留经文的群体和盟约色彩；“在于……得赦免”较为自然，并保留介词短语的解释空间。
