- from: 使他的子民知道救恩，在于他们的罪得赦免。[a]
  to: 使他的子民在他们的罪得赦免中认识救恩。[a]
  rationale: 修订以“在……中”对应ἐν，避免把救恩与赦罪的关系定为定义性的“在于”，同时保留原文的句法开放性。将“知道”改为“认识”更自然地表达γνῶσις，但不超出“knowledge”的基本意义；其余关键术语均维持不变。
