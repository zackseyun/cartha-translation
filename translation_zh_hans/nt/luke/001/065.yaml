  text: καὶ ἐγένετο ἐπὶ πάντας φόβος τοὺς περιοικοῦντας αὐτούς, καὶ ἐν ὅλῃ τῇ ὀρεινῇ τῆς Ἰουδαίας διελαλεῖτο πάντα τὰ ῥήματα ταῦτα,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/065.yaml
  text: And fear came upon all those living around them[b][a], and throughout all the hill country of Judea all these things were being talked about.
translation:
  language: zh_hans
  text: 住在他们周围的人都感到惧怕[a]；在犹太的整个山区，人们都在谈论这一切事情[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “惧怕”在这里也可能含有因看见上帝明显的作为而产生的敬畏。
    reason: lexical_alternative
  - marker: b
    text: “事情”也可译作“话”或“事”；希腊词既可指说出来的话，也可指人们所谈论的事件。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐπὶ πάντας φόβος
  choice: 所有的居民都感到惧怕
  rationale: 这一结构表示惧怕临到众人，即众人开始产生惧怕。译作“都感到惧怕”符合现代汉语表达，同时保留事件发生的动态意义。
- source_word: φόβος
  choice: 惧怕
  rationale: φόβος既可指恐惧，也可能含有面对上帝明显作为时的敬畏。正文采用较直接的“惧怕”，不把语义限定为单纯害怕或宗教性的敬畏。
- source_word: τοὺς περιοικοῦντας αὐτούς
  choice: 他们周围所有的居民
  rationale: περιοικέω指住在某人周围或附近。“周围的居民”自然地表达地理邻近关系，也比单译“邻舍”更贴近原文。
- source_word: ἐν ὅλῃ τῇ ὀρεινῇ τῆς Ἰουδαίας
  choice: 在犹太全山区
  rationale: ἡ ὀρεινή指丘陵或山地地区；“犹太全山区”简洁表达该地理范围，并体现ὅλῃ所表示的整个区域。
- source_word: διελαλεῖτο
  choice: 人们都在谈论
  rationale: 未完成时被动形式描写这些消息持续在人群中被谈论。“都在谈论”以自然汉语体现持续而广泛的口头议论。
- source_word: πάντα τὰ ῥήματα ταῦτα
  choice: 这一切的事
  rationale: ῥήματα既可指所说的话，也可指被述说的事情或事件。叙事语境中“这一切的事”自然涵盖前述言语与事件，并以脚注保留其他可能。
theological_decisions:
- issue: φόβος对上帝作为的反应所含的语气
  choice: 正文译作“惧怕”
  alternative: 敬畏；又敬又怕
  rationale: 直译“惧怕”保留该词在恐惧与敬畏之间的语义张力，让上下文显示这是众人面对上帝明显作为时的反应，而不在正文中预先限定其性质。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“都感到惧怕”避免过于古雅的“惧怕临到”，“人们都在谈论”则清楚呈现持续传播于口头议论中的情形。
