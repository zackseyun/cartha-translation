  text: καὶ τὸ ἔλεος αὐτοῦ εἰς γενεὰς ⸂καὶ γενεὰς⸃ τοῖς φοβουμένοις αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/050.yaml
  text: And his mercy is for those who fear him from generation to generation[a][b][c].
translation:
  language: zh_hans
  text: 他的怜悯，世世代代临到敬畏他的人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεος
  choice: 怜悯
  rationale: “怜悯”直接表达对困苦、卑微者所施的恩慈，符合本段颂歌的语境，也不额外限定为某一种神学术语。
- source_word: εἰς γενεὰς καὶ γενεὰς
  choice: 世世代代，永不止息
  rationale: 原文直译近于“直到一代又一代”，强调怜悯延续于接连不断的世代。中文以“世世代代，永不止息”自然传达这种持续性。
- source_word: τοῖς φοβουμένοις αὐτόν
  choice: 敬畏他的人
  rationale: 当神是 φοβέομαι 的对象时，该词在此兼有畏惧与虔敬之意；“敬畏”既保留“畏”的分量，又避免被误解为单纯惊恐。
- source_word: καὶ
  choice: —
  rationale: 本句在颂歌中承接上文；中文无需机械译出句首“并且”，省略后衔接更自然，累进关系仍由上下文清楚表达。
- source_word: αὐτοῦ / αὐτόν
  choice: 他的 / 他
  rationale: 两个代词在上下文中都指神；中文按通常用法译为“他”，不另加解释性称谓。
theological_decisions:
- issue: 对神的“惧怕”所表达的意义
  choice: 敬畏他
  alternative: 惧怕他
  rationale: “敬畏”保留原词真实的畏惧成分，同时表达面对神的尊崇与虔敬；“惧怕”在现代中文中较容易被理解为单纯恐慌。
- issue: 神怜悯延续的世代范围
  choice: 世世代代，永不止息
  alternative: 直到一代又一代
  rationale: 原文 εἰς 指向接续的众世代，强调神的怜悯持续施予敬畏他的人；译文不把这句话扩展为与人的回应无关的普遍陈述。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“怜悯”“敬畏”“世世代代”均为普通读者熟悉的圣经语汇；句式简洁，适合颂歌的诗性节奏。
