base_translation:
  language: en
  yaml_path: translation/nt/luke/001/067.yaml
  text: 'And Zechariah his father was filled with the Holy Spirit and prophesied, saying:'
translation:
  language: zh_hans
  text: 他的父亲撒迦利亚被圣灵充满，就预言说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ζαχαρίας
  choice: 撒迦利亚
  rationale: 采用现代中文圣经中通行的人名音译，准确指认施洗约翰的父亲。
- source_word: ὁ πατὴρ αὐτοῦ
  choice: 他父亲
  rationale: 按现代汉语亲属称谓自然表达所属关系；“他”承接上文的孩子。
- source_word: ἐπλήσθη
  choice: 被……充满
  rationale: 保留不定过去时被动语态所表达的一次性事件，并符合现代中文惯用搭配。
- source_word: πνεύματος ἁγίου
  choice: 圣灵
  rationale: 属格作 πίμπλημι 的内容补语，中文以“被圣灵充满”自然表达；路加叙事中的所指是上帝的圣灵。
- source_word: ἐπροφήτευσεν
  choice: 说预言
  rationale: 直接保留 προφητεύω 的先知性发言含义，比泛化为“受感说话”更忠实，也为下文颂歌作引介。
- source_word: λέγων
  choice: 道
  rationale: 以“道”自然引出随后直接引语，同时体现分词 λέγων 的引语功能。
- source_word: Καὶ
  choice: 就
  rationale: 在现代汉语中用“就”连接前后动作，既体现叙事连续性，也避免句首“并且”的生硬。
theological_decisions:
- issue: πνεύματος ἁγίου 的所指
  choice: 圣灵
  alternative: 圣洁的灵／一种圣灵
  rationale: 在路加—使徒行传关于神圣默示与能力的语境中，此短语通常指上帝的圣灵；译作“圣灵”不额外扩展系统神学含义。
- issue: ἐπροφήτευσεν 的性质
  choice: 说预言
  alternative: 受感说话
  rationale: 保留原文明确的先知性术语及其神学张力，不将其弱化为一般受感言说，也不预先限定下文仅为未来预测。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“他父亲撒迦利亚”贴近希腊语信息次序；“被圣灵充满，就说预言道”流畅地引出下一节的直接引语。
