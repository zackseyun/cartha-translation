  text: καὶ εἶπεν ὁ ἄγγελος αὐτῇ· Μὴ φοβοῦ, Μαριάμ, εὗρες γὰρ χάριν παρὰ τῷ θεῷ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/030.yaml
  text: And the angel said to her[a], “Do not be afraid, Mary, for you have found favor with God.”
translation:
  language: zh_hans
  text: 天使对她说：“马利亚，不要害怕，因为你在上帝面前已经蒙恩[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “蒙恩”也可译作“得到眷顾”。希腊语χάρις可表示“恩典”或“恩宠、眷顾”；这里“在上帝面前蒙恩”符合原文的惯用表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: 说
  rationale: 叙事中表示引出直接引语的普通不定过去时；现代汉语自然译作“说”。
- source_word: ἄγγελος
  choice: 天使
  rationale: 在路加福音的降生叙事中指来自上帝的天上使者，“天使”比泛称“使者”更符合语境。
- source_word: Μὴ φοβοῦ
  choice: 不要害怕
  rationale: μή加现在时命令语气构成禁止语；“不要害怕”是自然、清楚的现代汉语。
- source_word: Μαριάμ
  choice: 马利亚
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: εὗρες
  choice: 已经蒙
  rationale: 不定过去时在宣告语境中产生当前有效的结果；“已经蒙”自然表达马利亚如今处于得蒙恩待的状态。
- source_word: χάριν
  choice: 恩
  rationale: χάρις可指“恩典”或“恩宠、眷顾”；与εὑρίσκω及παρά构成固定表达时，重点是在某人面前蒙受恩待。中文“蒙恩”既自然又不把该词过度限定为后期神学术语。
- source_word: παρὰ τῷ θεῷ
  choice: 在上帝面前
  rationale: παρά加与格在“蒙恩”的表达中指在上帝看来、在上帝那里；“在上帝面前”较明确地保留这一关系含义。
theological_decisions:
- issue: 马利亚语境中χάριν的译法
  choice: 蒙恩
  alternative: 得到上帝的眷顾；蒙恩典
  rationale: 原文惯用语εὑρίσκω χάριν παρά意为在某人面前蒙恩或得眷顾。“蒙恩”保留χάρις的语义宽度，不将经文提前套入后来的教义表述，也不暗示马利亚是恩典的来源。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“天使对她说”保留原文叙事衔接；“在上帝面前已经蒙恩”兼顾希腊语惯用表达和不定过去时所带出的当前结果。
