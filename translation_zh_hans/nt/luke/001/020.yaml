source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἔσῃ σιωπῶν καὶ μὴ δυνάμενος λαλῆσαι ἄχρι ἧς ἡμέρας γένηται ταῦτα, ἀνθ’ ὧν οὐκ ἐπίστευσας τοῖς λόγοις μου, οἵτινες πληρωθήσονται εἰς τὸν καιρὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/020.yaml
  text: And behold[a], you will be silent and unable to speak until the day these things happen, because you did not believe my words[b], which will be fulfilled in their appointed time.
translation:
  language: zh_hans
  text: 看哪，你必沉默，不能说话，直到这些事发生的那一天，因为你不信我的话；这些话必在所定的时刻[a]应验。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这些话必在适当的时候应验。”原文所指的是这些话得以应验的合宜或指定时刻。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留突出的唤起注意功能和天使宣告的庄重语气；在现代中文圣经语体中仍清楚可懂。
- source_word: ἔσῃ σιωπῶν καὶ μὴ δυνάμενος λαλῆσαι
  choice: 你必沉默，不能说话
  rationale: 同时保留“处于沉默状态”和“没有能力说话”两个要素，表明这不是自愿缄默，而是被迫失去说话能力。
- source_word: ἄχρι ἧς ἡμέρας γένηται ταῦτα
  choice: 直到这些事成就的那一天
  rationale: 自然呈现时间界限，并以“成就”表达所预告之事成为现实；也与后文“应验”形成合宜呼应而不完全重复。
- source_word: ἀνθ’ ὧν
  choice: 因为
  rationale: 在本语境中自然表达撒迦利亚受此管教的原因。
- source_word: οὐκ ἐπίστευσας τοῖς λόγοις μου
  choice: 你不信我的话
  rationale: πιστεύω后接所说的话，重点是没有相信天使所传达的内容；“我的话”也直接保留λόγοι的表达。
- source_word: πληρωθήσονται
  choice: 必然应验
  rationale: 保留未来被动所表达的确定实现；中文以“应验”自然搭配“话”，“必然”明确其确定性，但不另行指明行动者。
- source_word: εἰς τὸν καιρὸν αὐτῶν
  choice: 到了所定的时刻
  rationale: καιρός指合宜或指定的时机，不只是一般的钟表时间；“所定”保留指定时间的意味，同时不明说是谁指定。
theological_decisions:
- issue: 撒迦利亚所受管教的性质
  choice: 译文同时说明他将沉默并且不能说话，呈现一种被施加的失语状态。
  alternative: 把沉默理解为撒迦利亚自愿不说话。
  rationale: 原文并列“沉默”与“不能说话”，后者排除了仅仅自愿保持安静的理解；译文不进一步解释其生理机制。
- issue: 预言之话如何实现
  choice: 用“必然应验”保留这些话确定会实现的意义，并维持原文被动表达。
  alternative: 明确译成“上帝必使这些话应验”。
  rationale: 语境可以使人理解为神的作为，但原句没有明说行动者；不在正文中补出“上帝”，以保留原文形式和神学张力。
translation_notes:
  register: 采用现代、庄重且普通读者易懂的中文。“看哪”保留宣告性的注意标记；“沉默，不能说话”刻意保留原文的双重措辞。脚注标记置于相关句末，说明καιρός的译法选择。
