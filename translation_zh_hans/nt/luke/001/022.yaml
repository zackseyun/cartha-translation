source:
  edition: SBLGNT
  text: ἐξελθὼν δὲ οὐκ ⸀ἐδύνατο λαλῆσαι αὐτοῖς, καὶ ἐπέγνωσαν ὅτι ὀπτασίαν ἑώρακεν ἐν τῷ ναῷ· καὶ αὐτὸς ἦν διανεύων αὐτοῖς, καὶ διέμενεν κωφός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/022.yaml
  text: But when he came out[a], he was not able to speak to them, and they realized that he had seen a vision in the sanctuary[b]. And he kept making signs to them and remained mute.
translation:
  language: zh_hans
  text: 他出来后，不能对他们说话；他们便知道他在圣所[a]里看见了异象。他一直向他们打手势，仍旧不能说话[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“圣殿里”。这里的希腊词更具体地指圣殿建筑中的圣所，而不是整个圣殿区域。
    reason: lexical_alternative
  - marker: b
    text: 或译“仍旧哑着”。这里的希腊形容词可指不能说话的人，在某些语境中也可能含有耳聋之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: 他出来时
  rationale: 将先于主句动作的简过去时分词自然处理为时间从句，清楚表达事件次序。
- source_word: οὐκ ἐδύνατο λαλῆσαι
  choice: 不能对他们说话
  rationale: 保留 δύναμαι 加不定式所表达的实际无能力，并符合现代汉语叙事习惯。
- source_word: ἐπέγνωσαν
  choice: 他们便知道
  rationale: 表达众人根据眼前迹象得出明确判断；“便”也自然承接前因后果。
- source_word: ὀπτασίαν
  choice: 异象
  rationale: 此处指超自然的显现或启示性视觉经历；“异象”准确、简洁，也是现代汉语圣经语境中易懂的用词。
- source_word: ἐν τῷ ναῷ
  choice: 在圣所里
  rationale: ναός 在这里特指圣殿建筑中的圣所，而非整个圣殿区域；“圣所”保留这一词义区别。
- source_word: διανεύων
  choice: 一直向他们打手势
  rationale: ἦν 加现在分词构成迂回未完成式，突出持续动作；“一直……打手势”自然传达其延续性。
- source_word: διέμενεν
  choice: 仍旧
  rationale: 传达未完成时所表示的状态持续；与后面的“不能说话”结合，现代汉语简洁自然。
- source_word: κωφός
  choice: 不能说话
  rationale: 该词可指不能说话，也可能在某些语境涉及耳聋；本节直接强调撒迦利亚无法说话，因此正文采用语境明确支持的表达，同时以脚注保留词义范围。
theological_decisions:
- issue: κωφός 对撒迦利亚受罚后状况的描述
  choice: 正文译为“不能说话”
  alternative: “哑了”或“又聋又哑”
  rationale: 本节明确陈述他不能说话，并说他以手势沟通，却没有无歧义地断定他耳聋。正文保留直接重点，脚注说明原词可能涉及耳聋，以免过度消解叙事中的张力。
translation_notes:
  register: 采用庄重而流畅的现代标准汉语。“可是”承接上文形成转折；分号使不能说话与众人的判断紧密相连。脚注标记按其实际所解释的词语分别置于“圣所”和末句“不能说话”之后。
