  rationale: 仅作两项低风险修订：删去可能过强的“可是”，并将脚注 a 的“殿里”调整为更明确自然的“圣殿里”。其余措辞准确传达原文的时序、持续性及 κωφός 的语义歧义，脚注锚点也分别正确对应“圣所”和末句的状态描述。
