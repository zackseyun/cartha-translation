  yaml_path: translation/nt/luke/001/061.yaml
  text: And they said to her[a], “None of your relatives is called by this name.”
translation:
  language: zh_hans
  text: 他们对她说：“你亲族中没有人叫这个名字。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπαν πρὸς αὐτὴν
  choice: 他们对她说
  rationale: 在言说动词后，πρός加宾格表示说话所针对的人；“对她说”是现代汉语自然的叙事表达。
- source_word: Οὐδείς ἐστιν ἐκ τῆς συγγενείας σου
  choice: 你亲族中没有人
  rationale: ἐκ在此表达群体中的一员，συγγένεια指亲属或亲族关系；“你亲族中没有人”既保留这一部分关系，也避免把范围窄化为同住的一家人。
- source_word: ὃς καλεῖται
  choice: 叫
  rationale: καλέω的被动形式用于姓名时意为“被叫作、名叫”；汉语用“叫”最自然简洁。
- source_word: τῷ ὀνόματι τούτῳ
  choice: 这个名字
  rationale: τούτῳ指向前文刚提出的名字；“这个名字”准确保留其近指意义。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“亲族”比“家里人”更准确地涵盖血缘亲属范围；整句不增添原文未明说的信息。
