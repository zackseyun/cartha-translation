  text: the oath that he swore to Abraham our father[a], to grant to us
translation:
  language: zh_hans
  text: 就是他向我们祖先亚伯拉罕所起的誓[a]，要赐给我们，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“我们的父亲亚伯拉罕”，保留了以亚伯拉罕为父的盟约性表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅρκον
  choice: 所起的誓
  rationale: ὅρκον承接上一节的句法，是特指神所立的誓言；与ὤμοσεν合译为自然的现代汉语“所起的誓”，同时保留“誓”的正式语体。
- source_word: ὃν ὤμοσεν πρὸς Ἀβραὰμ
  choice: 他向……亚伯拉罕所起的
  rationale: 关系代词ὃν引出修饰“誓”的从句；πρός在起誓语境中指誓言所向的对象，译作“向……起誓”符合汉语习惯。
- source_word: τὸν πατέρα ἡμῶν
  choice: 我们祖先
  rationale: πατήρ字面是“父亲”，在此指以色列共同先祖亚伯拉罕。正文用“祖先”避免现代读者误解为亲生父亲，脚注保留字面及盟约性表达。
- source_word: τοῦ δοῦναι ἡμῖν
  choice: 要恩赐我们
  rationale: 带冠词的不定式可表达誓言的目的或内容，并在下一节续完。δοῦναι基本义为“赐给”，这里用“恩赐”体现神施予的庄重语境，但不补出尚未出现的宾语。
theological_decisions:
- issue: 亚伯拉罕盟约中的亲属称谓
  choice: 正文译“我们祖先”，脚注注明原文直译“我们的父亲”
  alternative: 正文译“我们的父亲”
  rationale: “祖先”在现代汉语中准确表明亚伯拉罕与说话群体的历史关系；脚注保留希腊文的父亲意象及其盟约共鸣，避免静默消除原文表达。
- issue: τοῦ δοῦναι所表达的语义关系
  choice: 译作“要恩赐我们”，保留目的与誓言内容之间的开放性
  alternative: 译作“为要赐给我们”或“应许赐给我们”
  rationale: 此不定式既可理解为目的，也可视为誓言内容的展开；“要”在中文中能自然衔接下一节，又不强行限定其句法功能。“应许”会添加原文未明说的词义。
translation_notes:
  register: 采用现代、庄重而易懂的颂歌语体。本节在希腊文中承接上一节，并继续到下一节，因此以逗号收束；“就是”标明本节的“誓”与上一节所述盟约同位相承。
