id: LUK.1.15
reference: Luke 1:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἔσται γὰρ μέγας ἐνώπιον ⸀τοῦ κυρίου, καὶ οἶνον καὶ σίκερα οὐ μὴ πίῃ, καὶ πνεύματος ἁγίου πλησθήσεται ἔτι ἐκ κοιλίας μητρὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/015.yaml
  text: For he will be great before the Lord[a], and he will drink neither wine nor strong drink[c][b], and he will be filled with the Holy Spirit even from his mother’s womb.
translation:
  language: zh_hans
  text: 因为他在主面前必为大；他绝不喝葡萄酒和烈酒[a]；他还在母腹中时，就要被圣灵充满[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “烈酒”指葡萄酒以外能使人醉的酒类。
    reason: cultural_note
  - marker: b
    text: “还在母腹中时”也可译作“从母腹起”；原文强调圣灵的充满在极早的时候就发生。
    reason: lexical_alternative
lexical_decisions:
- source_word: μέγας
  choice: 伟大的
  rationale: 保留“伟大、卓越”的宽泛含义，不把他的伟大具体解释为地位显赫或影响重大。
- source_word: ἐνώπιον τοῦ κυρίου
  choice: 在主面前
  rationale: 贴近原文，表达他的伟大是在主的鉴察与评定之下；“主”在本段语境中自然指上帝。
- source_word: οἶνον καὶ σίκερα
  choice: 葡萄酒和烈酒
  rationale: οἶνος指葡萄酒；σίκερα指葡萄酒以外能使人醉的酒类，用“烈酒”简明表达，并以脚注说明其范围。
- source_word: οὐ μὴ πίῃ
  choice: 绝不喝
  rationale: οὐ μή加虚拟式构成强烈否定；“绝不喝”既保留预告性的将来含义，也传达其受分别之召的坚定禁戒，而不强行改写为命令。
- source_word: πνεύματος ἁγίου
  choice: 圣灵
  rationale: 路加的语境指上帝的灵；现代中文惯用“圣灵”，无需添加原文没有的冠词信息。
- source_word: πλησθήσεται
  choice: 要被……充满
  rationale: 保留将来被动形式，显示这是临到他的神圣行动。
- source_word: ἔτι ἐκ κοιλίας μητρὸς αὐτοῦ
  choice: 还在母腹中时，就
  rationale: 自然表达极早的时间起点，并保留ἔτι的强调；不把ἐκ机械限定为出生之后的“从……起”。
theological_decisions:
- issue: οὐ μὴ πίῃ在预告中的语气
  choice: 译作“绝不喝”，作为带强调的将来否定
  alternative: 译作“不可喝”或“必须永不喝”，视为明确禁令
  rationale: 原文语法直接陈述他绝不会喝，虽与分别为圣的使命有关，却没有命令式；本译文保留预言与禁戒之间的张力。
- issue: πνεύματος ἁγίου的所指
  choice: 译作“圣灵”，指上帝的灵
  alternative: 译作“圣洁的灵”或理解为非人格化的能力
  rationale: 在路加作品的叙事和措辞中，该短语自然指上帝的灵；译文不额外展开其位格或作用。
- issue: ἐκ κοιλίας μητρὸς αὐτοῦ的时间范围
  choice: 译作“还在母腹中时”
  alternative: 译作“从母腹起”，可能理解为自出生起
  rationale: 结合ἔτι和路加福音1:41、44的叙事，胎内时期是自然理解；脚注保留“从母腹起”的形式可能性。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。分号呈现三个并列预告；“绝不喝”传达强烈否定而避免将陈述句改成命令句。所有脚注标记均置于相关正文之后。
