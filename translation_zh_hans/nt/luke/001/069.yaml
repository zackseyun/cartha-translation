  yaml_path: translation/nt/luke/001/069.yaml
  text: and has raised up a horn of salvation for us in the house of David his servant,[a]
translation:
  language: zh_hans
  text: 他在自己仆人大卫的家中，为我们兴起了拯救之角[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“大能的救主”。原文直译为“拯救之角”；在圣经中，“角”象征力量、得胜和大能的拯救。
    reason: 说明圣经隐喻并提供便于理解的解释性译法，同时保留原文的意象及其所指张力。
lexical_decisions:
- source_word: ἤγειρεν
  choice: 兴起了
  rationale: 保留上帝使拯救者出现、施行拯救的圣经惯用表达；希腊语不定过去时在撒迦利亚的颂赞中把这行动作为已经成就之事来宣告，现代汉语用“了”自然表达。
- source_word: κέρας σωτηρίας
  choice: 拯救之角
  rationale: 保留源于旧约的具体隐喻；“角”象征力量、得胜和施行拯救的大能。“之”使短语庄重凝练，同时不把隐喻直接解释为某一种单一所指。
- source_word: ἡμῖν
  choice: 为我们
  rationale: 将受益与格译为“为我们”，突出上帝的行动使我们得益，而不只是朝向我们。
- source_word: ἐν οἴκῳ Δαυὶδ
  choice: 在……大卫家中
  rationale: 贴近介词和名词的形式；“大卫家”在此指大卫的家系或王朝，同时保留大卫之约的圣经回响。
- source_word: παιδὸς αὐτοῦ
  choice: 他仆人
  rationale: 此处 παῖς 指大卫作为上帝所拣选的仆人，并非年幼的孩子；“仆人”符合七十士译本背景中的盟约性称呼。
theological_decisions:
- issue: 是否在正文中保留“拯救之角”的隐喻，还是解释为“大能的救主”
  choice: 正文保留“拯救之角”
  alternative: 大能的救主
  rationale: 原文使用旧约王权与争战拯救传统中的具体意象。保留这一意象可维持经文间的文学和神学联系，也避免把可能兼有“有力的拯救”与“施行拯救者”之意的表达过早限定为单一解释；脚注提供通俗释义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“兴起”“仆人”“大卫家”保留圣经语体与互文联系；将较陌生的“拯救之角”保留在正文，并以紧邻脚注解释，避免正文因直译而难以理解。
