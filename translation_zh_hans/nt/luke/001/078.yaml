  text: διὰ σπλάγχνα ἐλέους θεοῦ ἡμῶν, ἐν οἷς ⸀ἐπισκέψεται ἡμᾶς ἀνατολὴ ἐξ ὕψους,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/078.yaml
  text: because of the tender mercy of our God[a], by which the sunrise from on high will visit us,
translation:
  language: zh_hans
  text: 因着我们上帝深切的怜悯，来自高天的曙光[a]必藉着这怜悯眷顾我们，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“黎明”。希腊语ἀνατολή在《七十士译本》中也可能呼应弥赛亚的称号“苗裔”。
    reason: 保留“曙光/黎明”的主要词义选择，并谨慎提示该词可能具有的旧约弥赛亚“苗裔”回响。
lexical_decisions:
- source_word: διὰ
  choice: 因着
  rationale: διά与宾格连用，在这里表示原因或根据；“因着”自然地承接上文，并保留其因果作用。
- source_word: σπλάγχνα ἐλέους
  choice: 深切的怜悯
  rationale: 原文直译近似“怜悯的肺腑”，是表达内心深处慈悲的习语；“深切的怜悯”既传达情感深度，又符合现代汉语表达。
- source_word: θεοῦ ἡμῶν
  choice: 我们上帝
  rationale: 忠实表达属格关系，并采用现代汉语自然的领属语序。
- source_word: ἐν οἷς
  choice: （借“因着……怜悯”的整体句式表达）
  rationale: 关系短语回指上帝的怜悯，可表示晨光临到人的凭借或所处的慈悲范围；汉语中不另译作生硬的“在其中”，而让“因着”统摄全句。
- source_word: ἐπισκέψεται
  choice: 将临到
  rationale: 这是将来时；该词可指探访并施行眷顾。“将临到”保留来访意象，也让上下文显明其救助含义。
- source_word: ἀνατολὴ
  choice: 曙光
  rationale: 该词可指升起、黎明或晨光；下一节的光明意象支持此义。“曙光”自然而庄重，同时在脚注保留其可能呼应“苗裔”的含义。
- source_word: ἐξ ὕψους
  choice: 来自高天
  rationale: 贴近原文“从高处而来”，以“高天”表达属天领域，又避免在正文中直接解释为“从天上”。
theological_decisions:
- issue: 弥赛亚语境中ἀνατολή的含义
  choice: 正文译作“曙光”
  alternative: “黎明”或“苗裔”
  rationale: 1:78–79紧接着描写光照黑暗中的人，因此正文采用晨光意象；但该词在希腊文旧约中也可能呼应弥赛亚的“苗裔”称号，故以脚注保留这一张力，不在正文中确定为单一解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“深切的怜悯”避免照字面译成不自然的身体器官习语；“曙光将临到我们”保留诗歌性的拟人和探访意象。句末逗号体现本节在撒迦利亚颂歌中与下一节语义相连。
