  to: 因为上帝所说的话，没有一句不能实现[a]。
  rationale: 修订仅调整汉语表达：以“上帝所说的话”自然呈现“从上帝而来的话”，以“没有一句不能实现”准确而通顺地表达“没有任何话会是不可能的”。脚注保留原有替代理解，并将“在上帝”调整为更自然的现代汉语“对于上帝”。
