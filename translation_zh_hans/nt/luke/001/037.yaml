  text: ὅτι οὐκ ἀδυνατήσει παρὰ ⸂τοῦ θεοῦ⸃ πᾶν ῥῆμα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/037.yaml
  text: For no word from God will be impossible[a].
translation:
  language: zh_hans
  text: 因为上帝所说的话，没有一句不能实现[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为对于上帝，没有什么是不可能的。”
    reason: 保留παρὰ τοῦ θεοῦ与πᾶν ῥῆμα另一种传统且语法上可成立的理解。
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 本句说明天使上一句话成立的根据；“因为”自然保留了ὅτι的解释和因果作用。
- source_word: οὐκ ἀδυνατήσει
  choice: 没有一句会不可能
  rationale: ἀδυνατέω在这里表达“不可能”的意思。结合πᾶν ῥῆμα，以否定全称句式译出，既贴近原文，也符合现代汉语。
- source_word: παρὰ τοῦ θεοῦ
  choice: 从上帝而来的
  rationale: παρά加属格可表示来源；它与ῥῆμα相连时，“从上帝而来的”清楚呈现话语以上帝为源头，同时不排除传统的“在上帝没有不可能”理解。
- source_word: πᾶν
  choice: 没有一句
  rationale: πᾶν本义为“每一／一切”；在否定结构中译作“没有一句”，自然表达其全称范围，避免汉语中“每一句都不会不可能”的生硬双重否定。
- source_word: ῥῆμα
  choice: 话
  rationale: ῥῆμα可指所说的话、宣告或事情。主文保留“话”，既反映明确的词汇内容，也契合加百列刚刚作出的宣告，而不把它过早收窄为“应许”。
theological_decisions:
- issue: παρὰ τοῦ θεοῦ πᾶν ῥῆμα的含义
  choice: 本节说，从上帝而来的话，没有一句会不可能。
  alternative: 因为在上帝，没有什么是不可能的。
  rationale: 原文明确含有ῥῆμα（“话”），而παρά加属格可表达来源，因此主文保留“从上帝而来的话”。传统译法在语法和语境上仍有依据，故收入脚注，以保留经文的真实歧义和神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“上帝”用于θεός；句式略带经文庄重感，但避免古奥措辞。主文保留“话”，脚注呈现传统的“没有什么不可能”译法。
