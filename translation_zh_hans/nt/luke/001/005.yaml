source:
  edition: SBLGNT
  text: Ἐγένετο ἐν ταῖς ἡμέραις ⸀Ἡρῴδου βασιλέως τῆς Ἰουδαίας ἱερεύς τις ὀνόματι Ζαχαρίας ἐξ ἐφημερίας Ἀβιά, ⸀καὶ γυνὴ ⸀αὐτῷ ἐκ τῶν θυγατέρων Ἀαρών, καὶ τὸ ὄνομα αὐτῆς Ἐλισάβετ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/005.yaml
  text: In the days of Herod[a], king of Judea, there was a priest named Zechariah, from the division of Abijah; and he had a wife from the daughters of Aaron[b], and her name was Elizabeth.
translation:
  language: zh_hans
  text: 犹太的希律王在位的时候，有一位祭司，名叫撒迦利亚，属亚比雅班次[a]；他的妻子出自亚伦的女儿们[b]，名叫伊利莎白。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚比雅班次”是祭司在圣殿轮班供职的一个班次。
    reason: cultural_note
  - marker: b
    text: 原文直译为“出自亚伦的女儿们”，是表示祭司家系的说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο ἐν ταῖς ἡμέραις
  choice: 在位的时候，有一位
  rationale: Ἐγένετο在这里是叙事引入语，配合时间短语自然译出人物登场；“在位的时候”也符合现代汉语对君王时期的表达。
- source_word: Ἡρῴδου βασιλέως τῆς Ἰουδαίας
  choice: 犹太王希律
  rationale: 该属格结构说明希律的王位及辖地；“犹太王希律”简洁、自然，并保留历史称谓。
- source_word: ἱερεύς τις ὀνόματι Ζαχαρίας
  choice: 有一位祭司，名叫撒迦利亚
  rationale: τις是不定指的人物引入语；“一位”自然传达其功能，ὀνόματι则译为常用的“名叫”。
- source_word: ἐξ ἐφημερίας Ἀβιά
  choice: 属于亚比雅班次
  rationale: ἐφημερία指轮班供职的祭司群体。“班次”是简明而合乎圣殿事奉背景的中文表达。
- source_word: γυνὴ αὐτῷ
  choice: 他的妻子
  rationale: αὐτῷ为领属与格，表达“他有一位妻子”；在汉语中以“他的妻子”衔接更自然。
- source_word: ἐκ τῶν θυγατέρων Ἀαρών
  choice: 是亚伦的女儿们的后代
  rationale: 保留原文具体的“女儿们”意象，同时补出汉语所需的谱系含义“后代”，避免误解为亚伦的亲生女儿。
- source_word: τὸ ὄνομα αὐτῆς Ἐλισάβετ
  choice: 名叫伊利莎白
  rationale: 这是常见的命名公式；在已明确主语后，简化为“名叫”最自然。
theological_decisions:
- issue: 伊利莎白的亚伦谱系表达
  choice: 亚伦的女儿们的后代
  alternative: 亚伦的后代／亚伦的女儿们
  rationale: 原文用具体的女性谱系习语“亚伦的女儿们”。正文兼顾这一意象与其实际所指的后裔身份，不把它扩展为其他教义主张。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体；人名依现代中文圣经常用译名处理，并用分号保留希腊文单句中两部分的紧密联系。
