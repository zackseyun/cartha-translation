  text: καὶ ἰδοὺ Ἐλισάβετ ἡ ⸀συγγενίς σου καὶ αὐτὴ ⸀συνείληφεν υἱὸν ἐν γήρει αὐτῆς, καὶ οὗτος μὴν ἕκτος ἐστὶν αὐτῇ τῇ καλουμένῃ στείρᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/036.yaml
  text: And look, Elizabeth your relative has also conceived a son in her old age, and this is the sixth month for her who was called barren.
translation:
  language: zh_hans
  text: 你看，你的亲属伊利莎白在年老时也怀了一个儿子；而且，这已经是她——那被称为不生育的——怀孕的第六个月了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδού
  choice: 你看
  rationale: 保留引起注意的语用功能，又比“看哪”更符合现代普通话。
- source_word: συγγενίς
  choice: 亲属
  rationale: 原词只表明女性亲属，并未说明具体亲属关系；“亲属”保留其宽泛性。
- source_word: συνείληφεν υἱόν
  choice: 怀了一个儿子
  rationale: 自然表达已经受孕并明确孩子为男性；“也”对应 καὶ αὐτή。
- source_word: ἐν γήρει αὐτῆς
  choice: 在年老时
  rationale: 直接保留在高龄受孕的含义，不增添原文没有的评价。
- source_word: τῇ καλουμένῃ στείρᾳ
  choice: 那素来被称为不生育的
  rationale: 保留被动的“被称为”和 στείρα 所指不能生育的状态；“素来”在中文中自然体现这一称谓此前已有。
- source_word: οὗτος μὴν ἕκτος ἐστὶν αὐτῇ
  choice: 如今已经怀孕六个月了
  rationale: 按现代汉语习惯表达“对她而言，这是第六个月”，使所指的妊娠月份清楚，同时不改变信息。
theological_decisions: []
