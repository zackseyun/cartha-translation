  text: καὶ ἔθεντο πάντες οἱ ἀκούσαντες ἐν τῇ καρδίᾳ αὐτῶν, λέγοντες· Τί ἄρα τὸ παιδίον τοῦτο ἔσται; καὶ ⸀γὰρ χεὶρ κυρίου ἦν μετ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/066.yaml
  text: And all who heard it laid it up in their hearts[a], saying[b], “What then will this child become?” For the hand of the Lord was with him.
translation:
  language: zh_hans
  text: 凡听见这事的人，都把它放在心上，说：“那么，这孩子将来会成为什么样的人呢？[a]”因为主的手与他同在。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这孩子将来会是什么人呢？”希腊文动词直译为“将会是”，在这里是询问这孩子未来的身份或角色。
    reason: lexical_alternative
  - marker: b
    text: “主的手”是圣经惯用语，可指上帝积极施展的能力、眷顾或引导。
    reason: cultural_note
lexical_decisions:
- source_word: ἔθεντο πάντες οἱ ἀκούσαντες ἐν τῇ καρδίᾳ αὐτῶν
  choice: 凡听见这事的人，都把它放在心上
  rationale: 保留“放在心里”的源语意象，同时用现代汉语自然表达郑重记住、反复思量之意；“这事”按上下文补出听见的内容。
- source_word: Τί ἄρα
  choice: 那么……呢？
  rationale: “那么”体现ἄρα根据先前事件作出推想的语气，“呢”使问句符合现代汉语习惯。
- source_word: τὸ παιδίον τοῦτο
  choice: 这孩子
  rationale: 准确表达παιδίον，既自然，也不额外限定年龄或身份。
- source_word: ἔσται
  choice: 将来会成为什么样的人
  rationale: 动词本义是“将会是”；上下文关注孩子未来的身份、角色或发展，译文以自然汉语传达这一语用含义，并用脚注保留直译可能。
- source_word: καὶ γὰρ
  choice: 因为
  rationale: 该组合在此说明众人产生疑问的缘由；“因为”简洁自然，不机械逐词翻译两个连接词。
- source_word: χεὶρ κυρίου
  choice: 主的手
  rationale: 保留圣经中表示上帝积极的能力、眷顾或引导的意象，不将其窄化为单一解释。
- source_word: μετ’ αὐτοῦ
  choice: 与他同在
  rationale: 准确表达μετά加属格的“与……同在”，并保留原文对于这种同在具体表现的克制。
theological_decisions:
- issue: “主的手与他同在”的含义
  choice: 保留“主的手”这一比喻，表明上帝积极的能力、眷顾或引导
  alternative: 主帮助他；上帝的能力临到他
  rationale: 原文没有把这种神圣介入限定为帮助、保护、赋能或眷顾中的某一种；保留意象可维持其丰富含义和神学张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“把它放在心上”保留源语的心之意象，又易于普通读者理解；问句使用“那么”和“呢”呈现推想语气。脚注标记已放在各自所解释的语句之后。
