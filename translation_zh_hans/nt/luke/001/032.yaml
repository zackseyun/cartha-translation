id: LUK.1.32
reference: Luke 1:32
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οὗτος ἔσται μέγας καὶ υἱὸς Ὑψίστου κληθήσεται, καὶ δώσει αὐτῷ κύριος ὁ θεὸς τὸν θρόνον Δαυὶδ τοῦ πατρὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/032.yaml
  text: He will be great and will be called the Son of the Most High[a], and the Lord God will give him the throne of David his father[c][b],
translation:
  language: zh_hans
  text: 他将为大，并要被称为至高者的儿子[a]；主上帝必将他祖先大卫的王位赐给他[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被称为”也可译作“被命名为”；这里指被赋予或认定为这一称号。
    reason: lexical_alternative
  - marker: b
    text: 希腊文直译为“大卫——他的父亲——的王位”。这里的“父亲”按王室谱系用法指祖先，并非指直接生父。
    reason: cultural_note
lexical_decisions:
- source_word: οὗτος
  choice: 他
  rationale: 指刚刚宣告将要出生的孩子。现代汉语用“他”自然清楚；希腊文指示代词的显明形式可在脚注说明。
- source_word: ἔσται μέγας
  choice: 将成为伟大的人
  rationale: 保留将来时和 μέγας 宽广的“伟大”含义，同时避免“他将是伟大的”这一不自然的汉语表达。
- source_word: υἱὸς Ὑψίστου
  choice: 至高者的儿子
  rationale: 把 Ὑψίστου 作为上帝的尊称，并保留 υἱός 的亲子及称号意味，不弱化为“至高者的一个儿子”。
- source_word: κληθήσεται
  choice: 要被称为
  rationale: 保留被动式以及称号、认定的开放含义，不将其限定为单纯命名。
- source_word: κύριος ὁ θεὸς
  choice: 主上帝
  rationale: 自然对应这一希腊语神圣称谓；不采用“耶和华上帝”，因为希腊文本并未直接出现四字神名。
- source_word: δώσει αὐτῷ
  choice: 要……赐给他
  rationale: “赐给”适合上帝授予王位的庄重语境，也准确表达 δίδωμι 与间接受词 αὐτῷ。
- source_word: τὸν θρόνον Δαυὶδ
  choice: 大卫的王位
  rationale: θρόνος 在王权语境中译作“王位”比实体性的“宝座”更直接，同时保留大卫王朝的含义。
- source_word: τοῦ πατρὸς αὐτοῦ
  choice: 他祖先大卫
  rationale: πατήρ 可指先祖；汉语若直译“他父亲大卫”容易被误解为大卫是耶稣的直接父亲，因此在正文中明确其谱系意义。
theological_decisions:
- issue: υἱὸς Ὑψίστου 的基督论称号
  choice: 至高者的儿子
  alternative: 至高者的一个儿子
  rationale: 该短语在天使关于耶稣的宣告中具有称号性质；译文保留其独特而崇高的儿子身份，不把后期教义措辞加入文本。
- issue: κύριος 的译法
  choice: 主上帝
  alternative: 耶和华上帝
  rationale: κύριος 在此指上帝，但希腊文本没有直接写出四字神名，因此不作过度具体化。
- issue: 大卫作为“父”的王朝语言
  choice: 他祖先大卫
  alternative: 他父亲大卫
  rationale: 希腊语 πατήρ 的确是“父亲／先祖”，但现代汉语的“父亲”通常专指直接生父；“祖先”准确传达大卫谱系与王朝承继关系。
- issue: 大卫的 θρόνος
  choice: 王位
  alternative: 宝座
  rationale: 这里关注上帝所赐的大卫王权和统治地位；“王位”保留王朝应许的重点，而不把含义缩窄为一件座椅。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“主上帝”“至高者的儿子”“王位”保留经文的崇高语域；用“祖先”防止现代读者误把大卫理解为耶稣的直接生父。所有脚注标记均已置于正文。
