  text: Ἐπειδήπερ πολλοὶ ἐπεχείρησαν ἀνατάξασθαι διήγησιν περὶ τῶν πεπληροφορημένων ἐν ἡμῖν πραγμάτων,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/001.yaml
  text: Since many have undertaken to compile an account concerning the matters that have been fulfilled among us,[a]
translation:
  language: zh_hans
  text: 既然有许多人已经着手编写一篇关于在我们中间已经成就之事的叙事，[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一篇关于在我们中间已经完成之事的叙事”；也可理解为：“一篇关于在我们中间已得到充分证实之事的叙事”。
    reason: 保留 πεπληροφορημένων 可表示成就、完成或充分证实的词义幅度。
lexical_decisions:
- source_word: Ἐπειδήπερ
  choice: 既然
  rationale: 引出整篇序言的背景和因由，并自然衔接后文的主句；现代汉语“既然”兼具正式感与可读性。
- source_word: πολλοὶ
  choice: 有许多人
  rationale: 直接保留数量含义，不添加原文没有明说的“其他”。
- source_word: ἐπεχείρησαν
  choice: 已经着手
  rationale: 表达开始承担一项写作工作，不暗示这些人的尝试失败；“已经”也与希腊语不定过去时在此所指的既成行动相称。
- source_word: ἀνατάξασθαι
  choice: 编写
  rationale: 此处指整理材料并写成作品；“编写”比逐字译作“按次序排列”更符合现代汉语的文学语境，同时不过度断定其编辑方式。
- source_word: διήγησιν
  choice: 叙事
  rationale: 保留其连续讲述事件的文学性质，也符合路加正式序言的文体。
- source_word: περὶ
  choice: 记述
  rationale: 在汉语中通过动词结构自然表达“关于”的关系，避免“编写一个关于……的叙事”显得生硬。
- source_word: τῶν πεπληροφορημένων
  choice: 已经成就的
  rationale: 完成时被动分词在此最自然地指事情已经实现或完成；“成就”保留救赎历史背景可能带有的应验色彩，却不把该词直接限定为预言应验。
- source_word: ἐν ἡμῖν
  choice: 在我们中间
  rationale: 保留群体范围的开放性，不擅自把“我们”限定为信徒、使徒或目击者。
- source_word: πραγμάτων
  choice: 事
  rationale: 用宽泛而自然的汉语词涵盖事情、事件及所发生的行动，避免比原文更具体。
theological_decisions:
- issue: πεπληροφορημένων 在路加序言中的含义
  choice: 已经成就
  alternative: 已经完成；在我们中间已得到充分证实
  rationale: 与 πραγμάτων 搭配时，“成就／完成”最能表达有关事件已经发生并达到实现状态，也可能呼应路加对上帝应许实现的关注；但该词亦可涉及充分确信或证实，因此在脚注中保留这一词义可能性。
translation_notes:
  register: 采用现代、庄重而易懂的书面语。此节是延续至后文的长句开端，因此以“既然”起句，不在本节人为补足主句。
