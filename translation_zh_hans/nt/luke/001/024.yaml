  text: Μετὰ δὲ ταύτας τὰς ἡμέρας συνέλαβεν Ἐλισάβετ ἡ γυνὴ αὐτοῦ· καὶ περιέκρυβεν ἑαυτὴν μῆνας πέντε, λέγουσα
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/024.yaml
  text: After these days Elizabeth his wife conceived[a], and she kept herself hidden for five months, saying[b],
translation:
  language: zh_hans
  text: 这些日子以后[a]，他的妻子伊利莎白怀了孕。她躲藏了五个月[b]，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那些日子以后”。希腊语指示词可按字面译作“这些”，也可在回述过去事件时按中文习惯译作“那些”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“她把自己藏起来”或“她独自隐居”。希腊语动词为未完成过去时，表示她在这五个月期间持续隐藏自己。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ ταύτας τὰς ἡμέρας
  choice: 这些日子以后
  rationale: μετά加宾格表示时间上的“……以后”；ταύτας直译为“这些”。δέ仅作轻微承接，中文不必另译，行文更自然。
- source_word: συνέλαβεν
  choice: 怀了孕
  rationale: 此处συλλαμβάνω指受孕；“怀了孕”是现代汉语中自然、准确的表达。
- source_word: Ἐλισάβετ
  choice: 伊利莎白
  rationale: 采用现代中文圣经语境中通行且易辨认的人名译法。
- source_word: ἡ γυνὴ αὐτοῦ
  choice: 他的妻子
  rationale: γυνή可指“女人”或“妻子”；这里有属格代词αὐτοῦ，语境明确指撒迦利亚的妻子。
- source_word: περιέκρυβεν ἑαυτὴν
  choice: 她一连……把自己隐藏起来
  rationale: 反身代词保留“自己”的含义；未完成过去时体现持续状态，配合“一连五个月”表达这段期间内持续隐藏自己。
- source_word: μῆνας πέντε
  choice: 五个月
  rationale: 宾格表示持续时段；“一连五个月”在中文中清楚表达持续时间。
- source_word: λέγουσα
  choice: 说：
  rationale: 现在分词引出下一节的话语内容；中文以“说：”自然承接，并保留句子未完、下接引语的结构。
theological_decisions: []
