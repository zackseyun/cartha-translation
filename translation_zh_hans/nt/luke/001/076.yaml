source:
  edition: SBLGNT
  text: καὶ σὺ ⸀δέ, παιδίον, προφήτης Ὑψίστου κληθήσῃ, προπορεύσῃ γὰρ ⸀ἐνώπιον κυρίου ἑτοιμάσαι ὁδοὺς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/076.yaml
  text: And you also[a], child, will be called a prophet of the Most High, for you will go before the Lord to prepare his ways[b],
translation:
  language: zh_hans
  text: 孩子啊，你也要被称为至高者的先知，因为你要走在主前面[a]，预备他的道路[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在主面前”。这个短语既可表示走在某人前头，也可表示在某人面前事奉。
    reason: lexical_alternative
  - marker: b
    text: 这里的措辞呼应先知书中关于在主面前预备道路的应许（参赛40:3；玛3:1）。在路加的叙事中，这应验在约翰在耶稣之前所开展的事工上。
    reason: cross_reference
lexical_decisions:
- source_word: καὶ σὺ δέ
  choice: 你也
  rationale: 这一组合转换话题，并强调受话者，同时带有承接、递进意味；“你也”在现代汉语中自然地保留这一语气。
- source_word: παιδίον
  choice: 孩子啊
  rationale: 这是对婴孩约翰的直接呼语；“孩子”准确自然，“啊”明确呼语语气，又不额外限定年龄或性别。
- source_word: προφήτης
  choice: 先知
  rationale: 这是该词在圣经语境中的标准对应词。
- source_word: Ὑψίστου
  choice: 至高者的
  rationale: 保留这一指称上帝的尊称及其与“先知”之间的属格关系。
- source_word: κληθήσῃ
  choice: 要被称为
  rationale: 保留 καλέω 将来被动式所表达的称谓、认定之意；“要被称为”庄重且符合现代汉语。
- source_word: προπορεύσῃ
  choice: 要走在……前面
  rationale: 该动词表示走在某人前头；这一译法保留先行者的意象，同时与下文“预备”自然衔接。
- source_word: ἐνώπιον κυρίου
  choice: 在主前面
  rationale: ἐνώπιον 既可指走在某人前头，也可指在某人面前、同在其面前事奉；正文采用适合先行者语境的表达，并以脚注保留另一层可能含义。κύριος 译作“主”，不在正文中限定其所指。
- source_word: ἑτοιμάσαι
  choice: 预备
  rationale: 不定式在此表达目的；“预备”直接、庄重，也能呼应相关先知性应许的传统措辞。
- source_word: ὁδοὺς αὐτοῦ
  choice: 他的道路
  rationale: 保留原文复数 ὁδοὺς 的集体表达及先知性回响；不改写成单数的“为他预备道路”，以免削平原文形式。
theological_decisions:
- issue: “主”（κύριος）在先行者预言中所指的是谁
  choice: 正文只译作“主”，不进一步限定
  alternative: 按《以赛亚书》和《玛拉基书》的背景明确理解为主上帝；或按路加叙事中的应验明确理解为主耶稣
  rationale: 措辞呼应旧约中为主预备道路的应许，而路加的叙事又呈现约翰在耶稣以前开展事工。只译“主”可保留原文的神学张力，不在翻译中替读者预先解决其所指。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“孩子啊”保留直接呼语；“要被称为”保留原文被动结构；“走在主前面”与“预备他的道路”维持先行者和道路的意象。脚注标记均置于对应正文之后。
