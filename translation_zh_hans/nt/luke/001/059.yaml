  text: Καὶ ἐγένετο ἐν τῇ ⸂ἡμέρᾳ τῇ ὀγδόῃ⸃ ἦλθον περιτεμεῖν τὸ παιδίον, καὶ ἐκάλουν αὐτὸ ἐπὶ τῷ ὀνόματι τοῦ πατρὸς αὐτοῦ Ζαχαρίαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/059.yaml
  text: And it happened that on the eighth day they came to circumcise the child[a], and they were calling him Zechariah[b], after the name of his father.
translation:
  language: zh_hans
  text: 到了第八天，他们来给孩子行割礼，并要按他父亲的名字给他取名为撒迦利亚[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们称他为撒迦利亚。”希腊语的未完成过去时可表示正在进行或试图进行的命名；这与下一节所记的纠正相吻合。
    reason: lexical_alternative
  - marker: b
    text: 直译：“他们按他父亲的名字给他取名为撒迦利亚。”这里反映了按家族成员的名字给孩子取名的习俗。
    reason: cultural_note
lexical_decisions:
- source_word: ἐγένετο
  choice: 到了
  rationale: 这是路加常用的叙事衔接语；结合时间短语译为“到了第八天”，既自然，也保留事件推进的作用，不使用古雅而生硬的“事情发生了”。
- source_word: ἐν τῇ ἡμέρᾳ τῇ ὀγδόῃ
  choice: 第八天
  rationale: 按现代汉语的时间表达译为“第八天”，准确保留明确的日期。
- source_word: ἦλθον
  choice: 他们来
  rationale: 原文主语为未明说的复数，译作“他们”保留其不确定性，不擅自指明是亲属、邻舍或其他人。
- source_word: περιτεμεῖν
  choice: 给孩子行割礼
  rationale: 不定式表示目的；“行割礼”是现代汉语中清楚、庄重且通行的表达。
- source_word: τὸ παιδίον
  choice: 孩子
  rationale: 直接对应 παιδίον，并符合上下文；“婴儿”虽合乎情境，却比原词更具体。
- source_word: ἐκάλουν
  choice: 称他为
  rationale: 正文采用不加完成体标记的表达，以避免把命名描写成已完成的事实；脚注说明未完成过去时可能含有正在进行或试图如此命名的意味。
- source_word: ἐπὶ τῷ ὀνόματι
  choice: 照……的名字
  rationale: 此处表示依照父亲的名字给孩子命名；该译法自然，并保留家庭命名习俗的含义。
- source_word: τοῦ πατρὸς αὐτοῦ
  choice: 他父亲
  rationale: 采用现代汉语自然的领属结构。
- source_word: Ζαχαρίαν
  choice: 撒迦利亚
  rationale: 采用中文圣经传统中通行且对应其希伯来语来源的人名译法。
