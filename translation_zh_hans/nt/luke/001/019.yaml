language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ ἄγγελος εἶπεν αὐτῷ· Ἐγώ εἰμι Γαβριὴλ ὁ παρεστηκὼς ἐνώπιον τοῦ θεοῦ, καὶ ἀπεστάλην λαλῆσαι πρὸς σὲ καὶ εὐαγγελίσασθαί σοι ταῦτα·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/019.yaml
  text: And the angel answered him[a], “I am Gabriel, who stands in the presence of God, and I was sent to speak to you and to bring you this good news.”
translation:
  language: zh_hans
  text: 天使回答他说：“我是加百列，侍立在上帝面前；我奉差遣来对你说话，把这些好消息告诉你。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: 回答他说
  rationale: 这是引出直接引语的不定过去时分词；用现代汉语有限动词表达自然，也保留了回应撒迦利亚的语境。
- source_word: ἄγγελος
  choice: 天使
  rationale: 上下文明确指天上的使者加百列；“天使”比泛称“使者”更准确自然。
- source_word: Ἐγώ εἰμι Γαβριὴλ
  choice: 我是加百列
  rationale: 保留原文明确的第一人称代词及自我宣告的强调；人名采用通行译名。
- source_word: ὁ παρεστηκὼς
  choice: 侍立
  rationale: παρίστημι的完成时分词表达站立在场且持续有效的身份；“侍立”简洁体现君王宫廷式的临在与服事意味。
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: 在上帝面前
  rationale: 直接保留空间和宫廷意象，既可表示处于上帝临在中，也可表示在他面前供职。
- source_word: ἀπεστάλην
  choice: 我奉差遣
  rationale: 保留不定过去时被动所表达的受命与差派，同时在汉语中自然体现差遣来自上帝。
- source_word: λαλῆσαι πρὸς σὲ
  choice: 来对你说话
  rationale: 保留目的不定式及πρός所表达的面向对象，不把内容提前限定为单纯“告诉”。
- source_word: εὐαγγελίσασθαί σοι
  choice: 把……好消息告诉你
  rationale: 将εὐαγγελίζω译为宣布好消息，保留其普通词义和神学回响，又避免在此过早使用术语化的“传福音”。
- source_word: ταῦτα
  choice: 这些好消息
  rationale: ταῦτα字面为“这些事”；结合εὐαγγελίζω，所指是刚才宣布的各项消息。复数“这些”保留指示词形式，“好消息”自然承接动词语义。
theological_decisions:
- issue: εὐαγγελίζω在天使报信语境中的表达
  choice: 把这些好消息告诉你
  alternative: 向你传福音；把这些事报给你
  rationale: “传福音”在现代教会语境中容易成为固定术语；“报这些事”又会淡化εὐαγγελίζω本身的喜讯意味。所选译法保留“好消息”的词义，同时指向加百列刚刚宣告的内容。
- issue: παρεστηκὼς ἐνώπιον τοῦ θεοῦ所表达的身份
  choice: 侍立在上帝面前
  alternative: 站在上帝面前；站在上帝的临在中
  rationale: “侍立”体现天使在上帝面前供职并随时听命的宫廷意象，但不进一步推导天使等级或特定教义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“侍立”略具礼仪和宫廷色彩，贴合加百列强调其受命身份的语境；其余措辞保持口语可读性。未设脚注，因为正文“这些好消息”同时保留ταῦτα的复数指向和εὐαγγελίζω的喜讯语义。
