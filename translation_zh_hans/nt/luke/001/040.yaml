  text: καὶ εἰσῆλθεν εἰς τὸν οἶκον Ζαχαρίου καὶ ἠσπάσατο τὴν Ἐλισάβετ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/040.yaml
  text: and entered the house of Zechariah and greeted Elizabeth[a][b].
translation:
  language: zh_hans
  text: 她进了撒迦利亚的家[a]，向伊利莎白问安[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“走进了撒迦利亚的房子。”
    reason: 词汇替代译法：εἰσῆλθεν可译“走进了”，οἶκον也可较具体地译作“房子”。
  - marker: b
    text: “问安”也可译作“问候”或较正式的“致意”。
    reason: 词汇替代译法：ἀσπάζομαι表示向人问候、致意；此处不宜译作“欢迎”，因为上下文是马利亚进入伊利莎白所在的家，并未说明马利亚是接待者。
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: 进了
  rationale: 该词是不定过去时主动直陈语气，表示进入某处；“进了”简洁自然，准确呈现叙事动作。中文根据上文补出主语“她”，使本节单独诵读时语意完整。
- source_word: οἶκον
  choice: 家
  rationale: οἶκος既可指房屋，也可指家；这里在介词εἰς之后表示进入的地点。“撒迦利亚的家”比“撒迦利亚的房子”更符合现代汉语习惯，且不改变所指的实际住所。
- source_word: Ζαχαρίου
  choice: 撒迦利亚
  rationale: 采用现代中文圣经语境中通行的人名译法。
- source_word: ἠσπάσατο
  choice: 问安
  rationale: ἀσπάζομαι在此表示见面时致意。“问安”自然、庄重，也不额外加入“欢迎”所可能暗示的主人身份。
- source_word: Ἐλισάβετ
  choice: 伊利莎白
  rationale: 采用现代中文圣经语境中通行的人名译法。
- source_word: καὶ
  choice: （顺承表达）
  rationale: 两个καί连接连续动作。首个καί承接上一节，在独立呈现本节时不机械译为“并且”；第二个则通过逗号和连续谓语自然表达动作顺承。
theological_decisions: []
translation_notes:
  register: 采用现代、自然而庄重的叙事语言。“她”依据上一节中的马利亚补出；中文不逐字重复连接词καί，而以连续谓语保持路加简洁的叙事推进。脚注保留原文词义范围，同时避免将ἀσπάζομαι误解为马利亚“欢迎”伊利莎白。
