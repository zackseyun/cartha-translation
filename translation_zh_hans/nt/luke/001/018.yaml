  text: καὶ εἶπεν Ζαχαρίας πρὸς τὸν ἄγγελον· Κατὰ τί γνώσομαι τοῦτο; ἐγὼ γάρ εἰμι πρεσβύτης καὶ ἡ γυνή μου προβεβηκυῖα ἐν ταῖς ἡμέραις αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/018.yaml
  text: And Zechariah said to the angel[a], “How will I know this? For I am an old man, and my wife is advanced in her days.”
translation:
  language: zh_hans
  text: 撒迦利亚对天使说：“我凭什么知道这事呢？因为我是个老人，我妻子也年事已高[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“在她的日子中已经前行”，是形容年老的说法。
    reason: 保留原文习语中的“日子”意象，并说明正文采用了自然的汉语表达。
lexical_decisions:
- source_word: εἶπεν
  choice: 说
  rationale: 标准的叙事性言说动词；“说”在现代汉语中自然、准确。
- source_word: πρὸς τὸν ἄγγελον
  choice: 对天使
  rationale: πρός与言说动词连用时标明说话对象；汉语用“对天使说”最自然。
- source_word: Κατὰ τί
  choice: 凭什么
  rationale: 该短语询问据以确认所宣告之事的根据或凭据；“凭什么”保留这一语义，也不把问题扩写为明确索求神迹。
- source_word: γνώσομαι
  choice: 知道
  rationale: 原文是将来时，指将会得知或获得确信；现代汉语在疑问句中通常不必明标将来，“凭什么知道”已自然表达如何获得确认。
- source_word: τοῦτο
  choice: 这事
  rationale: 指天使刚才所宣告的内容；“这事”比单说“这”更符合汉语表达。
- source_word: πρεσβύτης
  choice: 老人
  rationale: 此词指年老的男子，并非职分上的“长老”；“我是个老人”直接而自然。
- source_word: γυνή
  choice: 妻子
  rationale: 在“我的”这一关系语境中明确指妻子，而非泛指女人。
- source_word: προβεβηκυῖα ἐν ταῖς ἡμέραις αὐτῆς
  choice: 年事已高
  rationale: 这是表示年老的希腊语习语；“年事已高”在现代汉语中庄重自然，同时以脚注保留原文的“日子”意象。
theological_decisions:
- issue: ἄγγελος的译法
  choice: 天使
  alternative: 使者
  rationale: ἄγγελος本可指一般使者，但上下文所指是显现并传话的加百列，因此译作“天使”符合语境，且未加入经文以外的教义说明。
- issue: 撒迦利亚问题的性质
  choice: 直译为“我凭什么知道这事呢”
  alternative: 意译为“请给我一个凭据，叫我知道这事必会成就”
  rationale: 原文询问据何而知，但没有在本句中明说“神迹”或“必会成就”；采用较直接的表达，以保留问题可能涉及凭据、方式或确信基础的张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“凭什么知道”保留原文询问确认根据的力度；“年事已高”比逐字表达更符合现代汉语，并由脚注交代原文意象。
