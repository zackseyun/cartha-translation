  text: καὶ πᾶν τὸ πλῆθος ἦν τοῦ λαοῦ προσευχόμενον ἔξω τῇ ὥρᾳ τοῦ θυμιάματος·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/010.yaml
  text: And the whole multitude of the people was praying outside at the hour of the incense offering[a].
translation:
  language: zh_hans
  text: 众百姓都在外面祷告，正值献香的时候[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“烧香的时候。”
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν τὸ πλῆθος
  choice: 众百姓都
  rationale: πᾶν修饰集合名词πλῆθος，强调在场群体的全体。汉语用“众百姓都”自然表达整个聚集群体，避免生硬直译为“全部群众”。
- source_word: τοῦ λαοῦ
  choice: 百姓
  rationale: λαός在圣殿语境中指聚集的百姓，很可能是以色列民，但原文未明说“以色列”，故不在正文补入。
- source_word: ἦν…προσευχόμενον
  choice: 在……祷告
  rationale: ἦν与现在分词构成迂回表达，表示当时持续进行的动作；“在……祷告”符合现代汉语，也不额外加入“共同”。
- source_word: ἔξω
  choice: 在外面
  rationale: ἔξω仅指“外面”；上下文可知与撒迦利亚所在之处相对，但正文不擅自具体化为“圣所外”。
- source_word: τῇ ὥρᾳ
  choice: 正值……的时候
  rationale: ὥρα在此指礼仪所定的时刻。“正值……的时候”既自然，又保留特定时段之意。
- source_word: τοῦ θυμιάματος
  choice: 献香
  rationale: θυμίαμα本指香，在圣殿语境中涉及礼仪性的焚献。正文采用“献香”，简洁传达敬拜礼仪含义；脚注保留较贴近动作层面的译法。
theological_decisions:
- issue: θυμίαμα的圣殿礼仪用语
  choice: 献香
  alternative: 烧香
  rationale: “献香”体现这是圣殿敬拜中的礼仪行为，却不引入后来的教义解释；“烧香”同样可能，列入脚注以保留词义表达上的余地。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“众百姓都”兼顾πλῆθος的群体性与πᾶν的全体性；语序略作汉语化处理，使“正值献香的时候”自然交代祷告发生的礼仪时刻。
