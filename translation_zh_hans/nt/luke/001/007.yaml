  text: καὶ οὐκ ἦν αὐτοῖς τέκνον, καθότι ⸂ἦν ἡ Ἐλισάβετ⸃ στεῖρα, καὶ ἀμφότεροι προβεβηκότες ἐν ταῖς ἡμέραις αὐτῶν ἦσαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/007.yaml
  text: And they had no child[a], because Elizabeth was barren, and both of them were advanced in years.
translation:
  language: zh_hans
  text: 他们没有孩子，因为伊利莎白不能生育，而且两人都年事已高。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“在他们的日子上已经前行”。
    reason: 说明“年事已高”所对应的希腊语习语，保留原文形象。
lexical_decisions:
- source_word: τέκνον
  choice: 孩子
  rationale: 原文为单数，译作“孩子”既准确又符合现代汉语习惯；译作“儿女”可能模糊单数形式。
- source_word: καθότι
  choice: 因为
  rationale: 此词引出他们没有孩子的原因，“因为”是现代汉语中最清楚自然的因果连接词。
- source_word: στεῖρα
  choice: 不能生育
  rationale: 此词具体指不育，而不只是没有孩子。“不能生育”比“不能怀孕”更全面，也比“石女”自然、尊重且符合现代用语。
- source_word: ἀμφότεροι
  choice: 两人都
  rationale: 强调撒迦利亚和伊利莎白二人同样年事已高；“两人都”简洁自然。
- source_word: προβεβηκότες ἐν ταῖς ἡμέραις αὐτῶν
  choice: 年事已高
  rationale: 原文直译近于“在他们的日子上已经前行”，是表示年老的敬语。“年事已高”保留其委婉、庄重的语气。
- source_word: οὐκ ἦν αὐτοῖς
  choice: 他们没有
  rationale: 希腊文直译为“对他们并不存在”，是表达拥有关系的惯用结构；汉语自然译为“他们没有”。
theological_decisions: []
