  text: εἶπεν δὲ Μαριάμ· Ἰδοὺ ἡ δούλη κυρίου· γένοιτό μοι κατὰ τὸ ῥῆμά σου. καὶ ἀπῆλθεν ἀπ’ αὐτῆς ὁ ἄγγελος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/038.yaml
  text: And Mary said[a], “Behold, I am the Lord’s servant[b]. May it happen to me according to your word.” And the angel departed from her.
translation:
  language: zh_hans
  text: 马利亚说：“看哪，我是主的女仆[a]；愿照你的话成就在我身上[b]。”天使就离开她了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“女奴”。希腊语δούλη可指女性奴隶或女仆；这里的“女仆”着重表达马利亚在主面前谦卑顺服，同时仍含从属意味。
    reason: alternative_reading
  - marker: b
    text: 或译“愿事情照你的话发生在我身上”。
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: 说（不另译连接词）
  rationale: δὲ是轻微的叙事连接词；现代汉语在此省略比硬译为“于是”或“而”更自然，也不额外强化时间或转折关系。
- source_word: Ἰδοὺ
  choice: 看哪
  rationale: 保留原文郑重、自我呈明的语气；虽略带庄重色彩，在现代中文中仍清楚易懂。
- source_word: δούλη
  choice: 婢女
  rationale: 这是阴性名词，可指女奴或女仆。“婢女”既保留性别和从属含义，也适合马利亚在主面前谦卑顺服的语境；更强的“女奴”义见脚注。
- source_word: κυρίου
  choice: 主的
  rationale: κύριος在这里是对上帝的称号，译作“主”；用领属结构自然表达马利亚与主的关系。
- source_word: γένοιτό μοι
  choice: 愿……成就在我身上
  rationale: 不定过去时中间语态祈愿式表达愿望和甘愿接受，不只是对未来事实的陈述；此译在现代中文中自然地传达马利亚的应允。
- source_word: κατὰ τὸ ῥῆμά σου
  choice: 照你的话
  rationale: κατά表示依照、符合；ῥῆμα在此指天使刚才所说的具体宣告。“照你的话”简洁并保留原文措辞。
- source_word: ἀπῆλθεν ἀπ’ αὐτῆς
  choice: 离开她了
  rationale: 准确表达天使从马利亚那里离去；现代中文无需重复译出“走了”。
- source_word: ὁ ἄγγελος
  choice: 天使
  rationale: 路加福音的上下文明确指属天的使者，而非普通的人间信使。
theological_decisions:
- issue: 马利亚以δούλη自称
  choice: 主的婢女
  alternative: 主的女奴
  rationale: 原词确可指女奴，但本段首先突出马利亚对上帝谦卑而甘愿的顺服。“婢女”保留从属和服事的含义，同时用脚注注明更强的奴属意味，不把原词的社会身份色彩完全抹去。
- issue: γένοιτό μοι的祈愿和应允语气
  choice: 愿照你的话成就在我身上
  alternative: 愿事情照你的话发生在我身上
  rationale: 祈愿式表达马利亚甘愿接受天使所宣告之事。主译既传达愿望与同意，也不把它弱化为单纯预测，或强化成原文未明说的主动促成。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“看哪”有意保留原文醒目而郑重的语气；“婢女”略带典雅色彩，但在现代普通读者中仍可理解。句式避免照搬希腊语，同时保留祈愿式所表达的甘愿应允。
