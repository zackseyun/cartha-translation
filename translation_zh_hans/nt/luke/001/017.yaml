source:
  edition: SBLGNT
  text: καὶ αὐτὸς προελεύσεται ἐνώπιον αὐτοῦ ἐν πνεύματι καὶ δυνάμει Ἠλίου, ἐπιστρέψαι καρδίας πατέρων ἐπὶ τέκνα καὶ ἀπειθεῖς ἐν φρονήσει δικαίων, ἑτοιμάσαι κυρίῳ λαὸν κατεσκευασμένον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/017.yaml
  text: And he will go before him in the spirit and power of Elijah[a], to turn the hearts of fathers to children, and the disobedient to the wisdom of the righteous[c][b], to prepare for the Lord a people made ready.
translation:
  language: zh_hans
  text: 他必带着以利亚的心志和能力，行在他前面[c]，使父亲的心转向儿女[a]，使悖逆的人转向义人所具有的明辨[b]，为主预备一群准备妥当的百姓。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “转向儿女”也可译作“心向着儿女”。这句话呼应《玛拉基书》4:6，可能含有家庭关系恢复和好的意思。
    reason: lexical_alternative
  - marker: b
    text: “义人所具有的明辨”也可译作“义人的心思”或“义人的明智”；原文也可较直译为“在义人的明辨中”。
    reason: lexical_alternative
  - marker: c
    text: “以利亚的心志和能力”指以利亚式的先知使命和能力，并不必然表示以利亚本人按字面回归。
    reason: cross_reference
lexical_decisions:
- source_word: προελεύσεται
  choice: 必……而行
  rationale: 该词为将来时，结合“在他前面”表示走在某人前面、先行执行使命。译文把方向意义放在“在他前面”中，并用“而行”保持行动与使命的语气。
- source_word: ἐνώπιον αὐτοῦ
  choice: 在他前面
  rationale: 既可表示“在他面前”，也可表示“走在他前头”。此处采用较紧贴原文且保留两者张力的表达，不在正文中明确补出代词所指。
- source_word: ἐν πνεύματι καὶ δυνάμει Ἠλίου
  choice: 带着以利亚的灵和能力
  rationale: “带着”自然表达凭借或蒙赋予这种先知性的灵与能力，同时不把约翰等同于以利亚本人。
- source_word: ἐπιστρέψαι
  choice: 使……转向
  rationale: 不定式表达目的；“转向”既保留回转的方向性，也呼应《玛拉基书》背景。
- source_word: καρδίας πατέρων ἐπὶ τέκνα
  choice: 使父亲的心转向儿女
  rationale: 贴近希腊文结构，并保留《玛拉基书》4:6中家庭关系转变与复和的意象。
- source_word: ἀπειθεῖς
  choice: 悖逆的人
  rationale: 该词指不肯听从、不受劝服的人；“悖逆”兼具抗拒与不顺服之意，适合此处伦理语境。
- source_word: ἐν φρονήσει δικαίων
  choice: 转向义人的明智
  rationale: φρόνησις侧重明辨、审慎而合宜的心思。“明智”简洁自然；依附于“使……转向”来表达进入义人所具有的思想与判断方式，同时以脚注保留其他理解。
- source_word: ἑτοιμάσαι
  choice: 预备
  rationale: 第二个目的不定式，与前面的“使……转向”并列，表示约翰使命的目标。
- source_word: κυρίῳ
  choice: 为主
  rationale: 与格在此表示为主而预备；按原文保留“主”这一称谓，不在正文中扩充具体所指。
- source_word: λαὸν κατεσκευασμένον
  choice: 一群已经就绪的百姓
  rationale: 完成时被动分词强调经预备后处于就绪状态；“已经就绪”既体现结果状态，也避免与前面的“预备”机械重复。
theological_decisions:
- issue: “以利亚的灵和能力”所表达的身份与使命
  choice: 理解为具有以利亚式的先知使命和能力，不把约翰直接等同于以利亚本人。
  alternative: 理解为以利亚本人按字面回归。
  rationale: 原文明确说“带着以利亚的灵和能力”，重点在先知使命与能力的延续；正文保留原有措辞，脚注只澄清其自然含义而不加入转世或身份同一的观念。
- issue: “他”与“主”的所指
  choice: 正文依原文保留代词“他”和称谓“主”。
  alternative: 在正文中明确补为“弥赛亚”或“耶稣”。
  rationale: 上下文有助于辨认所指，但本节本身使用代词和“主”；不作扩译可保留原文的指称方式及其神学张力。
- issue: 悖逆者与义人之“明智”的关系
  choice: 译作悖逆的人“转向义人的明智”，表达思想与判断方式的改变。
  alternative: 译作悖逆的人“在义人的明智中”，或“具有义人的心思”。
  rationale: 介词ἐν字面可作“在……中”，但在ἐπιστρέψαι所支配的并列结构里可呈现方向或归入某种生活取向的意义；正文采用自然的方向表达，脚注保留较形式对应的译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“悖逆”“预备”“百姓”保留经文语体的分量；句法仍呈现原文两个目的层次，同时通过“使……使……为……”保持中文连贯。脚注标记按内容分别置于“以利亚的灵和能力”“儿女”和“义人的明智”之后。
