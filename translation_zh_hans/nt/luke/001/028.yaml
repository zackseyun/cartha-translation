  text: καὶ ⸀εἰσελθὼν πρὸς αὐτὴν εἶπεν· Χαῖρε, κεχαριτωμένη, ὁ κύριος μετὰ ⸀σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/028.yaml
  text: And coming in to her[a], he said, “Greetings, favored one[b]; the Lord is with you.”
translation:
  language: zh_hans
  text: 他进去，对她说：“向你问安[a]，蒙恩的人[b]！主与你同在。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“要喜乐”；传统译法作“万福”。希腊语在形式上是“要喜乐”的命令语气，但常用作问候语。
    reason: lexical_alternative
  - marker: b
    text: 或译“大蒙恩的人”“蒙眷爱的人”；传统上也有“满有恩典者”一类译法。希腊语指已经领受恩惠或眷顾的人。
    reason: alternative_reading
lexical_decisions:
- source_word: εἰσελθὼν πρὸς αὐτὴν
  choice: 进到她那里
  rationale: εἰσελθών是εἰσέρχομαι的不定过去时主动分词，表示在“说”之前或与之相伴的进入动作；πρὸς αὐτήν表示朝向她、来到她那里。译文不补入原文此处未明说的“天使”。
- source_word: Χαῖρε
  choice: 向你问安
  rationale: χαῖρε形式上是“喜乐”的命令式，但在此处惯用作问候语。“向你问安”以庄重而自然的现代汉语表达其语用功能，同时在脚注保留“要喜乐”的字面含义。
- source_word: κεχαριτωμένη
  choice: 蒙恩的人
  rationale: 这是χαριτόω的完成时被动分词，指已经领受恩惠或眷顾的人。“蒙恩的人”保留被动意义，表明恩惠是所领受的，而不是把它解释为马利亚内在拥有的某种恩典总量。
- source_word: ὁ κύριος
  choice: 主
  rationale: κύριος在这里是对上帝的称谓；译作“主”既庄重，也与圣经通行用语保持连贯。
- source_word: μετὰ σοῦ
  choice: 与你同在
  rationale: μετά加属格表示“与……在一起”。汉语补出“同在”，自然表达原文省略系词的名词性短句，并保留上帝临在的含义。
theological_decisions:
- issue: 在马利亚相关且具有神学敏感性的经文中如何翻译κεχαριτωμένη
  choice: 蒙恩的人
  alternative: 大蒙恩的人；满有恩典者；充满恩宠者
  rationale: 原词是完成时被动分词，重点在于她已经领受了恩惠。“蒙恩的人”既肯定她所受的特殊恩眷，又不把后来的教义表述读入经文。“大蒙恩”可能强化原词本身未直接表达的程度，“满有恩典”则容易被理解为她自身含有丰盛恩典；这些传统或可能的译法在脚注中说明。
- issue: Χαῖρε应按惯用问候还是按字面命令翻译
  choice: 向你问安
  alternative: 要喜乐；你好；万福
  rationale: 在这一语境中，χαῖρε具有问候功能；主文按其语用意义翻译，同时用脚注保留“要喜乐”的形式意义，避免消除原文可能让读者听见的喜乐色彩。“万福”虽有传统影响，但在现代汉语中容易带入原词没有明确表达的附加含义。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“向你问安”比口语化的“你好”更符合叙事和天使宣告的语域；“蒙恩的人”简明地保留原文的被动意义。句序尽量贴近希腊文：先叙述进入，再写问候、称呼及“主与你同在”的宣告。
