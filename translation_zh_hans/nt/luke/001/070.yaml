  text: just as he spoke through the mouth of his holy prophets from of old,[a]
translation:
  language: zh_hans
  text: 正如他自古以来借着他圣洁的先知们的口所说的，[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“从远古时候起”。这个短语可指久远的古代；也有人理解为“从永恒以来”，但这里提到先知，因此较可能是“自古以来”的意思。
    reason: 说明 ἀπ’ αἰῶνος 的词义范围，并保留较强的替代解释。
lexical_decisions:
- source_word: καθὼς
  choice: 正如
  rationale: 引出与上文所述救恩行动的对应关系，既自然又保留“照着先前所说”的意味。
- source_word: ἐλάλησεν
  choice: 所说的
  rationale: 不定过去时表示神先前已经说话；与“借着……的口”连用时，“说”最自然。
- source_word: διὰ στόματος
  choice: 借着……的口
  rationale: 保留原文具体的圣经惯用意象，表达神以先知为媒介说话，而不将其简化为一般的“借着”。
- source_word: τῶν ἁγίων ... προφητῶν
  choice: 他圣先知
  rationale: “圣”作定语修饰“先知”，表示这些先知分别归神；“他”自然指向上下文中的神。
- source_word: ἀπ’ αἰῶνος
  choice: 自古以来
  rationale: 此处与先知相连，主要指久远的古代，而非必然指形而上的永恒；该译法自然且保留时间纵深。
- source_word: αὐτοῦ
  choice: 他
  rationale: 该代词在上下文中最自然地指神，表明先知属于并受命于神。
theological_decisions:
- issue: ἀπ’ αἰῶνος 的时间范围
  choice: 救恩历史中的久远古代（“自古以来”）
  alternative: 从永恒以来
  rationale: 紧邻的对象是“先知”，因此这短语较自然地指神很早以前借先知所作的宣告；脚注保留更强的可能理解，避免把词义绝对化。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“借着……的口”有意保留先知传达神话语的具体意象；语序兼顾原文结构与中文流畅度。
