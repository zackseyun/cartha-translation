  text: Ἐγένετο δὲ ἐν τῷ ἱερατεύειν αὐτὸν ἐν τῇ τάξει τῆς ἐφημερίας αὐτοῦ ἔναντι τοῦ θεοῦ
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/008.yaml
  text: It happened[a], while he was serving as priest before God in the order of his division,
translation:
  language: zh_hans
  text: 有一次，他按自己所属班次的轮值，在上帝面前履行祭司职务时，[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“当他在自己所属的祭司班次中，按规定次序在上帝面前履行祭司职务时。”
    reason: 说明τάξις可侧重“规定次序”，而ἐφημερία指祭司班次及其轮值。
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: 有一次
  rationale: 这是叙事推进公式；“有一次”以自然的现代汉语引出随后发生的事，同时避免古雅而生硬的“事情发生了”。δὲ在此仅作轻微承接，不表示强烈转折。
- source_word: ἐν τῷ ἱερατεύειν αὐτὸν
  choice: 他……履行祭司职务时
  rationale: 带ἐν的冠词化不定式表达时间背景；ἱερατεύω特指从事祭司职务。“履行祭司职务”准确保留圣殿礼仪语境。
- source_word: ἐν τῇ τάξει τῆς ἐφημερίας αὐτοῦ
  choice: 按所属班次的安排
  rationale: τάξις在此指规定的次序或安排，ἐφημερία指轮流供职的祭司班次。此译法兼顾制度含义与现代汉语的清晰度。
- source_word: ἔναντι τοῦ θεοῦ
  choice: 在上帝面前
  rationale: 保留原文关于在上帝临在中供职的常用表达，简洁且庄重。
theological_decisions:
- issue: 撒迦利亚圣殿供职的礼仪用语
  choice: 按所属班次的安排，在上帝面前履行祭司职务
  alternative: 轮到他所属的班次时，他在上帝面前供祭司的职
  rationale: 所选译文保留第一世纪祭司分班供职的历史背景，又不引入后世教会职分或宗派性理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“有一次”承担希腊文叙事公式的功能；句末逗号保留本节与下一节在句法和叙事上的连续性。
