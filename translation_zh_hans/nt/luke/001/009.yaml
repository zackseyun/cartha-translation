base_translation:
  language: en
  yaml_path: translation/nt/luke/001/009.yaml
  text: according to the custom of the priesthood[a], he was chosen by lot to burn incense when he entered into the temple of the Lord,
translation:
  language: zh_hans
  text: 照祭司供职的惯例，他通过抽签被选中进入主的圣所烧香。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“主的殿”。希腊语ναός常指圣殿建筑本身，尤其是圣所，而不是包括各院落在内的整个圣殿区域。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ τὸ ἔθος τῆς ἱερατείας
  choice: 按照祭司职分的规矩
  rationale: κατά加宾格表示遵照既定惯例；ἱερατεία指祭司的职分或供职制度，并非只泛指祭司群体。“祭司职分的规矩”既保留制度性，也符合本段抽签供职的语境。
- source_word: ἔλαχε
  choice: 抽签得着了……任务
  rationale: λαγχάνω表示借抽签获得某项职责或机会。“抽签得着了”明确保留抽签之意；补出“任务”使汉语句法完整，但不增添实质内容。
- source_word: τοῦ θυμιᾶσαι
  choice: 烧香
  rationale: 带冠词的不定式说明抽签所得之事；θυμιάω在此指焚烧、献上香。“烧香”简明具体，并符合圣殿礼仪语境。
- source_word: εἰσελθὼν εἰς
  choice: 进入
  rationale: 不定过去时分词表达与烧香相关的进入动作。汉语把它纳入“进入……烧香”的任务内容，既自然，也不刻意细分动作先后。
- source_word: τὸν ναὸν τοῦ κυρίου
  choice: 主的圣所
  rationale: ναός在圣殿语境中通常特指圣殿建筑或内殿，而不是包括院落在内的整个圣殿区域；撒迦利亚进去烧香，故“圣所”比泛称“殿”更精确。
theological_decisions:
- issue: 圣殿礼仪语境中ναός的译法
  choice: 圣所
  alternative: 主的殿
  rationale: 烧香是在圣殿内部的圣所进行，且ναός常与指整个圣殿范围的ἱερόν有别。正文采用较精确的“圣所”，脚注保留较宽泛、传统的译法，避免把词义范围绝对化。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“规矩”比“惯例”在此更贴近按班次抽签供职的实际程序；整句保留原文的祭司制度、抽签、进入圣所和烧香四项信息。
