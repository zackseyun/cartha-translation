  yaml_path: translation/nt/luke/001/054.yaml
  text: He has helped Israel his servant[a], in remembrance of mercy[b],
translation:
  language: zh_hans
  text: 他扶助了自己的仆人以色列[a]，记念怜悯[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “仆人”也可译作“孩子”。希腊语παῖς兼有这两种意思；这里采用“仆人”，因为旧约常称以色列为上帝的仆人。
    reason: lexical_alternative
  - marker: b
    text: “怜悯”在这里也可能带有守约施慈爱、以信实相待的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντελάβετο
  choice: 扶助了
  rationale: 该动词在这里指伸手扶持、给予帮助。“扶助”既保留“扶持”的形象，也自然表达上帝对以色列的援助；“了”体现不定过去时所概括的行动。
- source_word: Ἰσραὴλ
  choice: 以色列
  rationale: 采用现代中文通行译名；语境中指作为整体的以色列民。
- source_word: παιδὸς
  choice: 仆人
  rationale: παῖς既可指“仆人”，也可指“孩子”。此处称以色列为上帝的παῖς，与旧约希腊文中以色列作为上帝仆人的用语相呼应，故正文采用“仆人”，并以脚注保留“孩子”的可能。
- source_word: αὐτοῦ
  choice: 自己的
  rationale: 代词指向上帝，说明以色列属于并服事上帝。中文用“自己的”可清楚避免误解所属关系。
- source_word: μνησθῆναι
  choice: 记念
  rationale: 不定式说明扶助行动与上帝的记念相关，可理解为目的、结果或伴随情形。“记念”保留经文中上帝因记得而采取行动的表达，也不把句法关系限定得过死。
- source_word: ἐλέους
  choice: 他的怜悯
  rationale: ἔλεος表示怜悯、慈悲，在本段也可能带有守约施慈爱的意味。中文补出语境中隐含的“他的”，使“记念怜悯”成为自然且明确的表达；更丰富的约的内涵留在脚注说明。
theological_decisions:
- issue: παῖς用于以色列时的含义
  choice: 自己的仆人以色列
  alternative: 自己的孩子以色列
  rationale: “仆人”较能保留旧约、尤其希腊文旧约中以色列作为上帝仆人的经文回响；但παῖς本身确有“孩子”之义，因此在脚注中明示词义上的真实歧义。
- issue: μνησθῆναι ἐλέους的关系与含义
  choice: 记念他的怜悯
  alternative: 为要记念怜悯；因记得所应许的慈爱
  rationale: 译文保持简洁，不把不定式强行限定为单一的目的或结果，也不在正文中直接加入“约”或“应许”。“怜悯”可容纳一般慈悲和守约施慈爱的语境意味。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“扶助”比单纯的“帮助”更能传达原词伸手扶持的色彩；“记念”保留圣经语体中记得并采取行动的意味。正文中的[a]、[b]与脚注逐一对应。
