id: LUK.1.13
reference: Luke 1:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς αὐτὸν ὁ ἄγγελος· Μὴ φοβοῦ, Ζαχαρία, διότι εἰσηκούσθη ἡ δέησίς σου, καὶ ἡ γυνή σου Ἐλισάβετ γεννήσει υἱόν σοι, καὶ καλέσεις τὸ ὄνομα αὐτοῦ Ἰωάννην·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/013.yaml
  text: But the angel said to him[a], “Do not be afraid, Zechariah, because your prayer has been heard, and your wife Elizabeth will bear you a son[b], and you shall call his name John.”
translation:
  language: zh_hans
  text: 天使却对他说：“撒迦利亚，不要怕，因为你的祈求已经蒙垂听了；你的妻子伊利莎白要给你生一个儿子，你要给他取名叫约翰。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν δὲ πρὸς αὐτὸν
  choice: 天使却对他说
  rationale: δέ是轻微的连接和转折；结合上文撒迦利亚的惧怕，用“却”自然呈现叙事转向，而不过度强化对立。
- source_word: ὁ ἄγγελος
  choice: 天使
  rationale: 本叙事中的所指是属天的使者，“天使”是现代汉语中明确而通行的表达。
- source_word: Μὴ φοβοῦ
  choice: 不要怕
  rationale: 准确表达带μή的命令式禁令，也符合现代汉语安慰受惊者的自然说法。
- source_word: Ζαχαρία
  choice: 撒迦利亚
  rationale: 采用中文圣经传统中通行且易于辨认的人名译法。
- source_word: διότι
  choice: 因为
  rationale: 清楚引出撒迦利亚不必害怕的原因。
- source_word: εἰσηκούσθη
  choice: 已经蒙垂听了
  rationale: 被动形式不明说施事者；“蒙垂听”保留这一表达，同时在祷告语境中自然暗示是神垂听。
- source_word: ἡ δέησίς σου
  choice: 你的祈求
  rationale: δέησις侧重恳切的请求；“祈求”既保留祷告语境，也比笼统的“祷告”更贴近其词义。
- source_word: ἡ γυνή σου Ἐλισάβετ
  choice: 你的妻子伊利莎白
  rationale: 所有格和语境明确表明γυνή在此指妻子。
- source_word: γεννήσει υἱόν σοι
  choice: 要给你生一个儿子
  rationale: 以自然现代汉语表达女性所生及σοι所含的关系、受益意义。
- source_word: καλέσεις τὸ ὄνομα αὐτοῦ Ἰωάννην
  choice: 你要给他取名叫约翰
  rationale: 希腊语直译为“你要称他的名为约翰”；“给他取名叫约翰”准确传达命名含义，并保持庄重而自然。
- source_word: Ἰωάννην
  choice: 约翰
  rationale: 采用中文新约中通行的人名译法。
theological_decisions:
- issue: “已经蒙垂听了”的被动施事者
  choice: 保留被动表达，不在正文中补出“神”
  alternative: 译为“神已经垂听了你的祈求”
  rationale: 祷告语境自然暗示垂听者是神，但希腊原文没有明说施事者；正文保留含蓄表达，避免把隐含信息显化为明说。
translation_notes:
  register: 采用现代、庄重、易懂的标准普通话。“祈求”“蒙垂听”适合天使报信的肃穆语境，同时仍为普通读者所理解。未设置脚注，因为正文已自然且充分地表达原文；所有信息均无需借脚注补足。
