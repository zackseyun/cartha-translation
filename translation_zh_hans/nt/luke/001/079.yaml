  text: ἐπιφᾶναι τοῖς ἐν σκότει καὶ σκιᾷ θανάτου καθημένοις, τοῦ κατευθῦναι τοὺς πόδας ἡμῶν εἰς ὁδὸν εἰρήνης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/079.yaml
  text: to shine on those sitting in darkness and the shadow of death[a], to guide our feet into the way of peace.
translation:
  language: zh_hans
  text: 照亮那些坐在黑暗和死亡的阴影中的人[a]，引导我们的脚走上平安的道路。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“死荫”。有人将此表达理解为较广义的“极深的黑暗”，但希腊文明确含有“死亡”一词。
    reason: 说明“死亡的阴影”的传统简译及较宽泛的语义理解，同时保留原文θανάτου（“死亡”）在正文和注释中的明确性。
lexical_decisions:
- source_word: ἐπιφᾶναι
  choice: 照亮
  rationale: 保留光照进黑暗的鲜明意象；比“显现”更符合这里及物用法所表达的作用，也不把意象解释成某一种属灵含义。
- source_word: τοῖς ἐν σκότει ... καθημένοις
  choice: 那些坐在黑暗……中的人
  rationale: καθημένοις直指“坐着”，译作“坐在”既自然，也保留原文静止、受困般的画面及其经文呼应，不泛化为“住在”或“生活在”。
- source_word: σκότει
  choice: 黑暗
  rationale: 这是σκότος在此处最直接、自然的对应词，可同时承载字面和隐喻含义而不作过度解释。
- source_word: σκιᾷ θανάτου
  choice: 死亡阴影
  rationale: 明确保留θανάτου“死亡”，同时用现代汉语可懂的“死亡阴影”呈现σκιᾷ的意象；避免仅译成“幽暗”而隐去死亡含义。
- source_word: τοῦ κατευθῦναι
  choice: 把……引到
  rationale: 表达该目的不定式的引导、定向含义，并与“脚”和“路上”的空间意象自然搭配；不硬译为“使……笔直”。
- source_word: τοὺς πόδας ἡμῶν
  choice: 我们的脚
  rationale: 保留原文身体意象，不抽象化为“我们”。
- source_word: εἰς ὁδὸν εἰρήνης
  choice: 到平安的路上
  rationale: “路”保留ὁδός的道路隐喻，“平安”保留εἰρήνη开放而丰富的含义；“到……路上”自然表达εἰς所指的方向或归向。
theological_decisions:
- issue: 黑暗、死亡阴影、脚与道路等意象是否应在正文中解释
  choice: 原样保留这些诗性意象，不在正文中限定其所指
  alternative: 解释为属灵无知、死亡危险、伦理生活，或“带来平安的道路”
  rationale: 原文具有诗性和经文互文色彩，这些意象可能同时承载多重神学含义；直译其核心画面可避免把张力缩减为单一解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“死亡阴影”比传统的“死荫”更便于当代读者直接理解，脚注则保留传统简译。句式延续原文的两个目的性短语，适合承接上文。
