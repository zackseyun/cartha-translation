id: LUK.1.35
reference: Luke 1:35
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ ἄγγελος εἶπεν αὐτῇ· Πνεῦμα ἅγιον ἐπελεύσεται ἐπὶ σέ, καὶ δύναμις Ὑψίστου ἐπισκιάσει σοι· διὸ καὶ τὸ γεννώμενον ἅγιον κληθήσεται, υἱὸς θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/035.yaml
  text: And the angel answered and said to her[a], “The Holy Spirit will come upon you, and the power of the Most High will overshadow you[b]; therefore also the holy one being born will be called the Son of God.”
translation:
  language: zh_hans
  text: 天使回答她说：“圣灵要临到你身上，至高者的能力要荫庇你；因此，那将要出生的圣者[a]也将被称为上帝的儿子[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“那将要出生的孩子将是圣洁的”。希腊语短语τὸ γεννώμενον字面意思是“正在出生的那一位（或那一物）”，在这里按语境指将要出生的孩子。
    reason: lexical_alternative
  - marker: b
    text: 原文“儿子”前没有冠词，但在本段语境中，“上帝的儿子”用作称号，并非“上帝的一个儿子”的意思。汉语不需要另加冠词来表达这一点。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς ὁ ἄγγελος εἶπεν αὐτῇ
  choice: 天使回答她说
  rationale: 保留原文“回答”与“说”的表达，同时符合现代汉语叙事习惯。
- source_word: Πνεῦμα ἅγιον
  choice: 圣灵
  rationale: 此处指上帝的灵这一神圣行动者；“圣灵”是现代汉语中自然、明确而不冗赘的表达。
- source_word: ἐπελεύσεται ἐπὶ σέ
  choice: 要临到你身上
  rationale: 表达将来的主动临在，并保留ἐπί所含“临到……之上”的意味。
- source_word: δύναμις Ὑψίστου
  choice: 至高者的能力
  rationale: 将Ὕψιστος作为上帝的尊称“至高者”，并直接保留属格关系。
- source_word: ἐπισκιάσει σοι
  choice: 要荫庇你
  rationale: 保留遮蔽、覆庇的意象及其庄重语气，不把神圣行动解释为原文未明说的生理机制。
- source_word: διὸ καὶ
  choice: 因此……也
  rationale: 同时传达διό的因果推论与καί的附加强调。
- source_word: τὸ γεννώμενον ἅγιον
  choice: 那将要出生的圣者
  rationale: 以自然汉语保留分词所指将出生者，并把ἅγιον作为对其圣洁身份的修饰；脚注提示该结构的直译与另一种表达方式。
- source_word: κληθήσεται
  choice: 要称为
  rationale: 保留被动的称名或身份认定含义，又符合汉语习惯。
- source_word: υἱὸς θεοῦ
  choice: 上帝的儿子
  rationale: 在本段语境中该短语具有称号性质；汉语无需冠词即可自然表达这一称号。
theological_decisions:
- issue: Πνεῦμα ἅγιον所指的性质
  choice: 圣灵
  alternative: 圣洁的灵／圣洁之气
  rationale: 路加叙事把圣灵呈现为上帝施行行动的神圣主体；译文不将其淡化为一种气质或非位格力量。
- issue: ἐπισκιάσει所描绘的神圣行动
  choice: 要荫庇你
  alternative: 要笼罩你／要以影子遮盖你
  rationale: 保留原文含蓄的遮蔽意象，不加入性行为或生理过程等原文没有说明的解释。
- issue: τὸ γεννώμενον ἅγιον的句法关系
  choice: 那将要出生的圣者
  alternative: 那将要出生的孩子将是圣洁的
  rationale: 原文可自然理解为ἅγιον修饰“所生的”；所选译法紧凑地保留这一关系，脚注则呈现可将“圣洁”作为表语表达的译法，避免抹平句法张力。
- issue: υἱὸς θεοῦ是否具有不定意义
  choice: 上帝的儿子
  alternative: 上帝的一个儿子
  rationale: 希腊语虽未使用冠词，但在报喜语境中该表达具有身份称号的作用，并不表示众多儿子中的一个；汉语本身不以冠词标示定指。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“临到你身上”“至高者”“荫庇”保留经文的神圣临在意象，但避免生硬直译或超出原文的机制性解释。脚注标记均放在其实际说明的短语之后，并纠正了咨询层脚注标记与正文落点不对应的问题。
