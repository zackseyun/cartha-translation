id: LUK.1.6
reference: Luke 1:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἦσαν δὲ δίκαιοι ἀμφότεροι ⸀ἐναντίον τοῦ θεοῦ, πορευόμενοι ἐν πάσαις ταῖς ἐντολαῖς καὶ δικαιώμασιν τοῦ κυρίου ἄμεμπτοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/006.yaml
  text: And both of them were righteous before God[b][a], walking blamelessly in all the commandments and ordinances of the Lord.
translation:
  language: zh_hans
  text: 他们二人在上帝面前[a]都是义人，遵行主的一切诫命和律例，无可指责。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在上帝眼中”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“在主的一切诫命和律例上行事无可指责。”
    reason: syntactical_alternative
lexical_decisions:
- source_word: δίκαιοι
  choice: 义人
  rationale: “义人”保留了该词在圣经语境中的道德与盟约内涵，不把意思缩减为法律上的公正或一般意义上的正直。
- source_word: ἀμφότεροι
  choice: 二人……都
  rationale: 明确强调撒迦利亚和伊利莎白两人同样具有下文所述的品格。
- source_word: ἐναντίον τοῦ θεοῦ
  choice: 在上帝面前
  rationale: 既可表达身处上帝面前，也可表达由上帝鉴察和评判；脚注保留“在上帝眼中”这一自然译法。
- source_word: πορευόμενοι
  choice: 遵行
  rationale: 原词本义为“行走、行事”，在这里指生活方式；与“诫命和律例”搭配时，“遵行”在现代汉语中更自然。
- source_word: ἐν πάσαις ταῖς ἐντολαῖς
  choice: 遵行……一切诫命
  rationale: 表达其行事以全部诫命为规范，并保留 πάσαις 所强调的周全范围。
- source_word: δικαιώμασιν
  choice: 律例
  rationale: 指规定或法定要求；“律例”可与“诫命”并列，并保留两者措辞上的区别。
- source_word: τοῦ κυρίου
  choice: 主的
  rationale: 按本项目惯例将 κύριος 译为“主”；此处指以色列的上帝。
- source_word: ἄμεμπτοι
  choice: 无可指责
  rationale: 保留“不可责备、无可非议”的强义，同时不额外断言绝对无罪；独立置于句末也较好地保留它与全句不同成分之间的句法张力。
- source_word: ἦσαν δὲ
  choice: 他们……是
  rationale: δέ 在此为轻微的叙事连接，现代汉语无须机械译出“而”或“并且”；复数主语由“他们二人”体现。
theological_decisions:
- issue: ἄμεμπτοι 是否表示绝对无罪
  choice: 译为“无可指责”，描述其在遵守主诫命和律例方面无可非议，不在正文中解释为绝对无罪。
  alternative: 译为“完全没有罪”或“毫无过失”。
  rationale: 原文强调可受检验而不遭责备的生活表现，却没有直接讨论绝对无罪。译文保留肯定语气，也不引入经文本身未作出的教义判断。
- issue: ἄμεμπτοι 的句法归属
  choice: 将“无可指责”置于句末，使它自然关联二人的整体生活及其遵行主命的表现。
  alternative: 明确译成“无可指责地遵行”，只把它处理为修饰“遵行”的状语。
  rationale: 希腊文中 ἄμεμπτοι 是与主语一致的形容词，但位置又紧随分词短语；句末独立表达可避免过度锁定其修饰范围，脚注列出更明确的另一种组织方式。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“义人”“诫命”“律例”保留必要的圣经语域；“遵行”和“无可指责”则避免生硬的逐词对应。
