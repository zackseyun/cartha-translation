  yaml_path: translation/nt/luke/001/072.yaml
  text: to show mercy to our fathers and to remember his holy covenant[c][b][a],
translation:
  language: zh_hans
  text: 向我们的列祖[c]施怜悯[a]，并记念他的圣约[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文介词字面有“与我们的列祖同在／相对”的意思；在这里的表达中，是指神向以色列的列祖施怜悯。
    reason: lexical_alternative
  - marker: b
    text: 在圣经的圣约用语中，神“记念”往往不只是心里想起，也意味着他信实地按先前的应许行动。
    reason: cultural_note
  - marker: c
    text: “列祖”指以色列的先祖或族长；也可译作“祖先”。
    reason: alternative_reading
lexical_decisions:
- source_word: ποιῆσαι ἔλεος
  choice: 施怜悯
  rationale: ποιέω与ἔλεος构成固定表达，意思是向人彰显或施行怜悯；“施怜悯”既自然凝练，也保留原文的行动意味。
- source_word: μετὰ τῶν πατέρων ἡμῶν
  choice: 向我们的列祖
  rationale: μετά加属格字面为“与……一起”，但此处与“施怜悯”连用，表达在列祖身上或与列祖相关地施怜悯。中文用“向”较通顺；“列祖”保留πατέρων的男性、族长及圣约历史色彩。
- source_word: μνησθῆναι
  choice: 记念
  rationale: 原词是“记得、记起”。在圣经的圣约语境中，神的“记念”通常包含按应许采取行动，但正文不直接译成“履行”，以免消除原文的含蓄与张力。
- source_word: διαθήκης ἁγίας αὐτοῦ
  choice: 他的圣约
  rationale: διαθήκη在此指神所立的约；ἁγίας直接修饰“约”，αὐτοῦ保留为代词“他的”。“圣约”简洁并符合中文圣经语体。
theological_decisions:
- issue: 神“记念”圣约是否应明确译成履行应许
  choice: 记念他的圣约
  alternative: 履行他的圣约／因记念他的圣约而采取行动
  rationale: 圣经中的神圣“记念”常意味着信实地按先前的应许行动，但希腊文仍使用“记念”一词。正文保留这一圣约用语，不把其蕴含的行动意义完全明说。
- issue: πατέρων ἡμῶν所指及其性别色彩
  choice: 我们的列祖
  alternative: 我们的祖先
  rationale: 原文使用阳性复数“父辈”，在上下文中特指以色列的先祖或族长。“列祖”保留其男性及救赎历史色彩；脚注说明其所指。
- issue: μετά与属格在怜悯表达中的关系
  choice: 向我们的列祖施怜悯
  alternative: 与我们的列祖一同施行怜悯／以怜悯待我们的列祖
  rationale: 字面形式为“与我们的列祖”，但在该表达中，重点是神在与列祖的关系上显出怜悯。正文采用自然中文“向……施怜悯”，脚注保留字面可能性。
translation_notes:
  register: 采用现代、庄重而易懂的中文。“施怜悯”“列祖”“记念”“圣约”保留经文的圣约语体与互文色彩；句式承接上文的目的结构，因此不另加原文没有的主语。
