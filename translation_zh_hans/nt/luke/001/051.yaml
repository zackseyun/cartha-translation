base_translation:
  language: en
  yaml_path: translation/nt/luke/001/051.yaml
  text: He has shown strength with his arm[b][a]; he has scattered the proud in the thoughts of their hearts.
translation:
  language: zh_hans
  text: 他以膀臂彰显大能[a]；他驱散了心中怀着狂傲意念的人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他以膀臂行了大能的事。”希腊语直译近似“行出力量”，是表示彰显能力的说法。
    reason: lexical_alternative
  - marker: b
    text: 也可译为：“他按他们心里的意图驱散了狂傲的人”，或“他驱散了那些心中怀着狂傲想法的人。”这里的表达也可指他们内心的意念、谋算或想象。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐποίησεν κράτος
  choice: 施展大能
  rationale: 希腊语直译近似“行出力量”，是表达彰显、施行能力的惯用搭配。“施展大能”在现代汉语中自然庄重，也保留了力量实际显明的含义。
- source_word: ἐν βραχίονι αὐτοῦ
  choice: 用自己的膀臂
  rationale: ἐν在此主要表示工具或凭借；“膀臂”保留圣经诗歌中神以大能膀臂施行作为的拟人性意象。
- source_word: διεσκόρπισεν
  choice: 驱散了
  rationale: 该动词表示使人四散、分散。“驱散了”既表达行动的决定性，也适合以人为宾语。
- source_word: ὑπερηφάνους
  choice: 狂傲的人
  rationale: 这是名词化的复数形容词，指骄傲、傲慢的人。“狂傲的人”清楚保留其强烈的道德评价。
- source_word: διανοίᾳ καρδίας αὐτῶν
  choice: 心里意念
  rationale: διάνοια可指思想、意念或心思，καρδία在圣经语境中指人的内在中心。“心里意念”保留两层表达，同时符合现代汉语习惯。
theological_decisions:
- issue: 《尊主颂》中不定过去时的表达
  choice: 用完成体“施展……；驱散了……”
  alternative: 用一般性或历史性表达“施展……；驱散……”
  rationale: 希腊语不定过去时将神的作为作为整体、决定性的行动陈述，也可能带有先知式或总结性的意味。中文首句不必强加明确时间副词，次句用“了”呈现完成性，从而不把其含义限定为某一次历史事件。
- issue: διανοίᾳ与驱散行动的关系
  choice: 正文理解为对“狂傲的人”的内在特征作说明：“心里意念狂傲的人”
  alternative: 理解为工具或原因：“因他们心里的意图而驱散他们”
  rationale: 希腊语与格可表示领域、方式、工具或原因，句法存在真实歧义。正文采用较自然且符合语境的特征性理解，脚注保留工具或原因性的可能。
translation_notes:
  register: 采用现代、庄重而可朗读的诗歌语言。“膀臂”有一定经文语体色彩，但比单用“手臂”更能承接旧约中神大能膀臂的意象；其余措辞力求普通读者能够直接理解。
