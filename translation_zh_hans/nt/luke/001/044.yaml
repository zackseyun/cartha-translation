  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἰδοὺ γὰρ ὡς ἐγένετο ἡ φωνὴ τοῦ ἀσπασμοῦ σου εἰς τὰ ὦτά μου, ἐσκίρτησεν ⸂ἐν ἀγαλλιάσει τὸ βρέφος⸃ ἐν τῇ κοιλίᾳ μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/044.yaml
  text: For behold[a], when the sound of your greeting came into my ears, the baby leaped for joy in my womb.
translation:
  language: zh_hans
  text: 看哪，因为你问安的声音传到我耳中时，我腹中的胎儿便欢喜地[a]跳动起来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我腹中的胎儿便在欢腾中跳动起来。”
    reason: “欢喜地”所译的希腊语ἐν ἀγαλλιάσει也可较直译为“在欢腾中”，后者更突出强烈、洋溢的喜乐。
lexical_decisions:
- source_word: ἰδοὺ
  choice: 你看
  rationale: 保留引人注意的鲜明语气，同时采用自然的现代汉语表达。
- source_word: γὰρ
  choice: 由全句承接上文的解释关系
  rationale: 希腊文表示对上一句的说明；汉语借上下文和“你看”自然体现这一联系，避免生硬直译为“因为，看哪”。
- source_word: ὡς ἐγένετο
  choice: 一……就
  rationale: 准确表达声音传入耳中之时胎儿随即跳动的时间关系，也符合现代汉语习惯。
- source_word: ἡ φωνὴ τοῦ ἀσπασμοῦ σου
  choice: 你问安的声音
  rationale: 既保留φωνή的可听见性，也自然表达ἀσπασμός在此处的“问安、问候”之意。
- source_word: εἰς τὰ ὦτά μου
  choice: 传入我耳
  rationale: 保留εἰς的方向性和具体的听觉意象，但比“进入我的耳朵”更自然庄重。
- source_word: ἐσκίρτησεν
  choice: 跳动了
  rationale: 表达胎儿突然跃动的身体动作；用于胎中婴孩时，“跳动”比“跳跃”更合乎现代汉语。
- source_word: ἐν ἀγαλλιάσει
  choice: 欢喜地
  rationale: 将方式性的介词短语自然译出，并保留ἀγαλλίασις所含的强烈喜乐色彩。
- source_word: τὸ βρέφος
  choice: 胎儿
  rationale: βρέφος可指婴孩，也可指尚在母腹中的孩子；此处按明确语境译为“胎儿”，不添加经文本身之外的教义判断。
- source_word: ἐν τῇ κοιλίᾳ μου
  choice: 我腹中的
  rationale: 在此语境中指以利沙伯腹内；“我腹中的胎儿”是准确而自然的汉语表达。
theological_decisions:
- issue: 如何称呼尚在母腹中的约翰（βρέφος）
  choice: 胎儿
  alternative: 婴孩；孩子
  rationale: 原词可指婴孩，而上下文明说其在母腹中。“胎儿”既符合此处具体所指，也不超出经文本身作额外的教义推论。
- issue: ἐν ἀγαλλιάσει是描写动作方式还是对胎儿内在状态作明确断言
  choice: 欢喜地跳动
  alternative: 在欢腾中跳动
  rationale: 方式性表达最符合句法；“欢喜地”保留喜乐含义而不进一步界定胎儿如何经验这种喜乐。
translation_notes:
  register: 采用自然、端庄的现代标准汉语。“你看”传达ἰδού的提示语气；“一传入……就……”使希腊文的时间关系清楚流畅。脚注标记置于相关分句之后。
