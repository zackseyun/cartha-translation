  text: ὅτι ἐπέβλεψεν ἐπὶ τὴν ταπείνωσιν τῆς δούλης αὐτοῦ, ἰδοὺ γὰρ ἀπὸ τοῦ νῦν μακαριοῦσίν με πᾶσαι αἱ γενεαί·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/048.yaml
  text: because he has looked upon the humble state of his slave[a]. For behold[b], from now on all generations will call me blessed.
translation:
  language: zh_hans
  text: 因为他垂顾了他女奴[a]的卑微处境[b]。看哪，从今以后，万代都要称我有福。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “女奴”或译“婢女”或“女仆”。
    reason: alternative_reading
  - marker: b
    text: “卑微处境”也可译作“低微”或“受屈辱的处境”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέβλεψεν ἐπὶ
  choice: 垂顾了
  rationale: 表达把目光投向并眷顾之意；“垂顾”既保留神俯就关注的意味，也符合颂歌庄重的语体。
- source_word: ταπείνωσιν
  choice: 卑微处境
  rationale: 这里主要指马利亚低微、不显贵的境况，而不只指内在谦卑；“处境”避免把词义局限为一种品德。
- source_word: δούλης
  choice: 婢女
  rationale: 保留阴性身份以及归属于主人的关系。“婢女”比单纯的“仆人”更能反映原词，同时在庄重经文语体中仍易理解；脚注列出更直白的选择。
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留引人注意和加强语气的功能，也与颂歌体裁相称。
- source_word: ἀπὸ τοῦ νῦν
  choice: 从今以后
  rationale: 自然准确地表达从当前时刻开始并延续到未来。
- source_word: μακαριοῦσίν με
  choice: 称我有福
  rationale: 表达众人将公开承认或宣称马利亚是蒙福之人，不额外加入她是福分来源的含义。
- source_word: πᾶσαι αἱ γενεαί
  choice: 万代
  rationale: 简洁表达历世历代的人；未来指向已由“从今以后”明确。
theological_decisions:
- issue: 马利亚以 δούλη 自称
  choice: 他的婢女
  alternative: 他的女奴；他的女仆
  rationale: “婢女”兼顾原词所含的从属、归属关系与颂歌的庄重语体，不将其淡化为一般受雇服务，也不借此引入后来的马利亚论主张。
- issue: ταπείνωσις 所指的卑微
  choice: 卑微处境
  alternative: 低微；受屈辱的处境
  rationale: 译文首先指向马利亚社会地位和人生境况的低微，同时保留该词可能包含的受压低或受屈辱色彩，不把它单解为主观谦逊。
translation_notes:
  register: 采用现代、庄重而适合颂歌的普通话。“垂顾”“看哪”“万代”略带经文诗歌色彩，但仍为现代读者易懂；句法贴近希腊文的因果关系和强调次序。
