  text: σωτηρίαν ἐξ ἐχθρῶν ἡμῶν καὶ ἐκ χειρὸς πάντων τῶν μισούντων ἡμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/071.yaml
  text: salvation from our enemies and from the hand of all who hate us,[a]
translation:
  language: zh_hans
  text: 拯救我们脱离仇敌，脱离一切恨我们之人的手，[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“救我们脱离仇敌，脱离一切恨我们之人的权势。”
    reason: 词义及惯用语的另一译法：σωτηρίαν可具体表达为“救”，ἐκ χειρός可意译为“脱离……的权势”。
lexical_decisions:
- source_word: σωτηρίαν
  choice: 拯救
  rationale: 这里的名词既可指具体的解救，也承载较广的救恩含义。“拯救”能自然兼顾两者，不把经文限缩为纯政治性解放或纯属灵救恩。
- source_word: ἐξ ἐχθρῶν ἡμῶν
  choice: 脱离仇敌
  rationale: ἐξ加属格表示脱离或摆脱。“脱离仇敌”符合现代汉语表达，也不额外加入原文未明说的“权势”。
- source_word: ἐκ χειρὸς
  choice: 脱离……的手
  rationale: “手”在此是表示权势或控制的圣经惯用语。保留这一意象，既忠于原文，也延续希腊文旧约风格的救援语言。
- source_word: πάντων τῶν μισούντων ἡμᾶς
  choice: 一切恨我们之人
  rationale: 实词化的现在时分词指所有恨我们的人；此译法自然、庄重，并保留其持续或特征性的意味。
- source_word: καὶ
  choice: （以并列分句表达）
  rationale: καὶ连接两个介词短语。中文通过重复“脱离”形成并列，避免生硬使用“和”，同时保留其并列关系。
theological_decisions:
- issue: 撒迦利亚预言中所应许拯救的性质
  choice: 用“拯救”保留从敌对者手中获救的具体意义及更广的救恩意义
  alternative: 仅译作政治或民族层面的“解救”，或仅解释为脱离罪的属灵救恩
  rationale: 本节明确提到仇敌和恨我们的人，但《路加福音》第一章的救恩语言也具有救赎内涵；译文不应消除这一张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“一切恨我们之人”略带经文体色彩，但仍属自然书面语；保留“手”的意象，并以脚注说明其“权势”义。
