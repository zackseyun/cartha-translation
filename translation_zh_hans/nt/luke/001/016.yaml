  text: καὶ πολλοὺς τῶν υἱῶν Ἰσραὴλ ἐπιστρέψει ἐπὶ κύριον τὸν θεὸν αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/016.yaml
  text: And he will turn many of the sons of Israel to the Lord their God[a].
translation:
  language: zh_hans
  text: 他要使许多以色列子孙回转归向主——他们的上帝。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以色列子孙”直译可作“以色列的众子”，也可译作“以色列人”。希腊原文采用传统的盟约称谓“以色列的众子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: 省略单独对应词
  rationale: 本节承接上一节；汉语在独立引述节文时不必以“并且”起句，衔接关系仍由语境自然表达。
- source_word: πολλοὺς
  choice: 许多
  rationale: 准确表达实体化形容词的数量含义，并自然修饰后面的群体称谓。
- source_word: τῶν υἱῶν Ἰσραὴλ
  choice: 以色列子孙
  rationale: 保留传统圣经盟约称谓的色彩，同时在现代汉语中比直译“以色列的儿子们”更自然；此处指以色列群体中的许多人。
- source_word: ἐπιστρέψει
  choice: 使……回转
  rationale: 保留将来时语义及使动、及物作用：施洗约翰将促使他们转回，而非仅陈述他们自行回来。
- source_word: ἐπὶ
  choice: 归向
  rationale: 与ἐπιστρέφω连用时表达方向和重新转向；“归向”兼顾回转与朝向某人的含义。
- source_word: κύριον
  choice: 主
  rationale: 此处由同位语“他们的上帝”明确指以色列的上帝，故译作具有盟约和神学分量的“主”，而非“主人”。
- source_word: τὸν θεὸν αὐτῶν
  choice: 他们的上帝
  rationale: 作为“主”的同位说明，保留原文明确的归属代词及盟约关系。
theological_decisions:
- issue: τῶν υἱῶν Ἰσραὴλ这一盟约称谓的表达
  choice: 以色列子孙
  alternative: 以色列的众子；以色列人
  rationale: “以色列子孙”既保留传统群体称谓和经文互文色彩，又避免现代汉语把“儿子们”误解为只指男性个体。脚注列出较直译及较意译的可能表达。
- issue: κύριον τὸν θεὸν αὐτῶν的所指与关系
  choice: 主——他们的上帝
  alternative: 主他们的上帝；主、他们的上帝
  rationale: 该短语指以色列的上帝；破折号清楚呈现“他们的上帝”对“主”的同位说明，而不把两者误读成两个对象。
- issue: ἐπιστρέψει的能动关系
  choice: 使……回转，归向
  alternative: 使……归回；使……悔改归向
  rationale: 原文是主动及物表达，主语约翰是促成者。“悔改”虽可能符合语境，却会增加原词在此处未明说的解释，故不纳入正文。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“回转，归向”保留原文方向性和使动关系；破折号帮助普通读者识别“他们的上帝”是“主”的同位说明。脚注标记已在正文中出现。
