  text: Ἔμεινεν δὲ Μαριὰμ σὺν αὐτῇ ⸀ὡς μῆνας τρεῖς, καὶ ὑπέστρεψεν εἰς τὸν οἶκον αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/056.yaml
  text: And Mary stayed with her about three months[a], and returned to her home.
translation:
  language: zh_hans
  text: 马利亚和她同住了约三个月[a]，便回自己家去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“大约三个月。”原文的ὡς用在时间数量之前，表示约数。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔμεινεν
  choice: 同住了
  rationale: 此处 μένω 表示在某处继续停留一段时间；结合 σὺν αὐτῇ，译为“和她同住了”自然地表达马利亚留在伊利莎白那里。
- source_word: δὲ
  choice: （不单独译出）
  rationale: δέ 是轻微的叙事连接词；现代汉语在此无需另加“而”或“于是”，用后半句的“就”即可使叙事衔接自然。
- source_word: Μαριὰμ
  choice: 马利亚
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: σὺν αὐτῇ
  choice: 和她同住
  rationale: σύν 加与格表示陪伴；“她”按上下文指伊利莎白，但原文使用代词，因此正文保留代词。
- source_word: ὡς μῆνας τρεῖς
  choice: 约三个月
  rationale: ὡς 用于时间数量之前，表示近似；“约三个月”简洁、自然，并保留并非精确时长的语义。
- source_word: ὑπέστρεψεν
  choice: 就回……去了
  rationale: ὑποστρέφω 表示返回先前所在之处；“回……去了”符合现代汉语叙事表达，“就”自然承接前句。
- source_word: εἰς τὸν οἶκον αὐτῆς
  choice: 自己家
  rationale: οἶκος 在此指返回的居所，而非家庭成员组成的“家族”；“自己家”清楚自然，并体现 αὐτῆς 的所属关系。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准普通话。保留原文中“她”的指代，不在正文中明说伊利莎白；以“约”体现时间表达的近似性。
