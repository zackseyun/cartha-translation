  text: καὶ ἠγαλλίασεν τὸ πνεῦμά μου ἐπὶ τῷ θεῷ τῷ σωτῆρί μου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/047.yaml
  text: and my spirit has rejoiced in God my Savior[a].
translation:
  language: zh_hans
  text: 我的灵也因上帝——我的救主——而欢欣[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我的灵也以上帝——我的救主——为乐。”
    reason: ἐπί加与格可侧重喜乐的根据或所向；“为乐”也能表达ἠγαλλίασεν所指的强烈喜乐。
lexical_decisions:
- source_word: καὶ
  choice: 也
  rationale: 承接上一节“我的心尊主为大”的诗歌平行结构；现代汉语在此用“也”比直译为“和”更自然，并清楚表达两句之间的并列关系。
- source_word: ἠγαλλίασεν
  choice: 欢欣
  rationale: 该动词表示强烈、洋溢的喜乐。“欢欣”庄重而通俗，也不把希腊语简单过去时所表达的诗歌性陈述过度限定为某一种汉语体貌。
- source_word: τὸ πνεῦμά μου
  choice: 我的灵
  rationale: 保留πνεῦμα的基本词义，并与上一节的“我的心/魂”维持不同用词及诗歌平行，不将二者强行合并，也不据此建立技术性的人论区分。
- source_word: ἐπὶ τῷ θεῷ
  choice: 因上帝……而
  rationale: ἐπί加与格在ἀγαλλιάω之后可指喜乐的根据或缘由。“因……而欢欣”是自然的现代汉语，同时保留以上帝为喜乐根由和所向的意思。
- source_word: τῷ σωτῆρί μου
  choice: 我的救主
  rationale: σωτήρ通常指施行拯救者。“我的救主”直接保留原文的个人关系和神学分量；破折号表明这是对“上帝”的同位说明。
theological_decisions:
- issue: 上帝与“我的救主”的关系
  choice: 上帝——我的救主——
  alternative: 我的拯救者上帝
  rationale: 希腊语直接称上帝为马利亚的救主。译文以同位语结构保留这一认信，不削弱为一般帮助，也不加入原文以外的教义推论。
- issue: “我的灵”与上文“我的心/魂”的关系
  choice: 保留“灵”这一独立用词
  alternative: 译作“我的内心”并与上文用词合并
  rationale: 上下两句在诗歌上彼此平行，意义可能重叠，但原文使用不同名词；保留“灵”可避免擅自判定二者完全相同或存在严格的人论划分。
- issue: ἐπί所表达的喜乐关系
  choice: 因上帝而欢欣
  alternative: 以上帝为乐
  rationale: 前者自然表达上帝是喜乐的根据或缘由；后者也可能成立，但略带固定宗教措辞色彩。原文在“根据、缘由、所向”之间不必被过度细分。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。用“也”衔接上一节的平行诗句；以破折号标明“我的救主”是“上帝”的同位说明。正文避免生硬照搬希腊语时态，因为现代汉语无需强加“已经”等体貌标记。
