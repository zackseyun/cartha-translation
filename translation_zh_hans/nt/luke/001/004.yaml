  text: so that you may know the certainty of the things about which you were instructed[a][b].
translation:
  language: zh_hans
  text: 使你可以确知你所受教导的事是可靠的[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“所学到的事”；原文动词可指接受口头或系统性的教导。
    reason: lexical_alternative
  - marker: b
    text: 或译“确定性”或“确切无疑”；原文名词可表示确定性、稳妥性或可靠性。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: 使
  rationale: 引出目的从句，简洁自然地保留“为要使……”的目的含义。
- source_word: ἐπιγνῷς
  choice: 你知道
  rationale: 在目的从句中表示认识、确知；译作“知道”自然清楚，也避免把复合动词的加强意味表达得过重。
- source_word: περὶ ὧν
  choice: 那些事
  rationale: περί加属格表示“关于、涉及”；结合关系代词和后面的λόγων，汉语用“那些事”自然地指向所受教导的内容。
- source_word: κατηχήθης
  choice: 所受教导
  rationale: 被动形式表示曾接受口头或系统性的教导；“受教导”保留正式传授的意味，又不引入后世特定的教会术语。
- source_word: λόγων
  choice: 那些事
  rationale: λόγος虽可直译为“话”或“言语”，此处指受教导的内容或事项；译作“那些事”比“那些话语”更符合现代汉语。
- source_word: τὴν ἀσφάλειαν
  choice: 确实可靠
  rationale: ἀσφάλεια可表示确定性、稳妥性或可靠性；“确实可靠”兼顾所教内容的可信性和读者由此获得的确定把握。
theological_decisions:
- issue: 路加写作目的所涉及的“确定性”性质
  choice: 表述为受教导之事“确实可靠”，同时容纳内容本身的可信性和读者对其形成的确定认识。
  alternative: 只强调读者内心的确信，或只强调客观历史事实的可验证性。
  rationale: ἀσφάλεια的语义可涵盖确定、稳妥和可靠；正文不把它收窄为单纯的主观感受或单纯的客观考证。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“自己”明确承接单数第二人称的受教者；“那些事”避免生硬直译λόγων为“话语”，并使句子易于普通读者理解。
