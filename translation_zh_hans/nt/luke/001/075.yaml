  yaml_path: translation/nt/luke/001/075.yaml
  text: in holiness and righteousness before him all our days[a].
translation:
  language: zh_hans
  text: 在他面前，以圣洁和公义[a]度过我们一生的日子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“正义”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν
  choice: 以
  rationale: 此处引出生活或事奉的方式、状态；汉语用“以”自然表达“带着、处于”的含义。
- source_word: ὁσιότητι
  choice: 圣洁
  rationale: 该词着重指向神的虔敬与圣洁，且与“公义”相配；“圣洁”既准确又符合现代汉语的庄重语体。
- source_word: καὶ
  choice: 和
  rationale: 直接连接“圣洁”与“公义”两个并列概念。
- source_word: δικαιοσύνῃ
  choice: 公义
  rationale: 这里描述人在神面前正直、合宜的状态；“公义”可保留该词兼具正直与正义的语义范围。
- source_word: ἐνώπιον αὐτοῦ
  choice: 在他面前
  rationale: 忠实保留原文空间隐喻，同时自然表达“在神的临在和鉴察之下”。
- source_word: πάσαις ταῖς ἡμέραις ἡμῶν
  choice: 度过我们一生的日子
  rationale: 原文直指“我们所有的日子”，语境含义是终身；此译法在现代汉语中自然，也保留了“日子”的原文意象。
theological_decisions:
- issue: 非保罗书信伦理语境中 δικαιοσύνη 的译法
  choice: 公义
  alternative: 正义
  rationale: 本节中该词与“圣洁”并列，主要描述人在神面前正直、合宜的生命状态。“公义”比“正义”更能保留这种纵向和伦理性的含义，但脚注保留“正义”这一可能译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“度过”补足汉语谓语，使本节作为承接上文“事奉他”的方式状语读来通顺；不把原文的伦理张力缩减为单纯社会层面的正义。
