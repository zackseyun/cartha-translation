  text: Ἀναστᾶσα δὲ Μαριὰμ ἐν ταῖς ἡμέραις ταύταις ἐπορεύθη εἰς τὴν ὀρεινὴν μετὰ σπουδῆς εἰς πόλιν Ἰούδα,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/039.yaml
  text: In those days Mary arose and went with haste into the hill country[a], to a town of Judah,
translation:
  language: zh_hans
  text: 那些日子，马利亚起身，急忙往山区去，到犹大的一座城镇[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “犹大的一座城镇”也可译作“犹大的一座城”或“犹太地区的一座城镇”；另有人将其理解为“一座名叫犹大的城”。希腊语πόλις既可指城，也可指镇；Ἰούδα可能指犹大或犹太地区。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναστᾶσα
  choice: 起身
  rationale: 不定过去时分词在此表示伴随情形，动作先于主要动词“前往”；“起身”既保留叙事次序，也符合现代汉语表达。
- source_word: δὲ
  choice: 不单独译出
  rationale: δέ在此是轻微的叙事推进标记；汉语借语序和停顿即可自然体现，若硬译为“于是”或“而”会增加原文没有的逻辑色彩。
- source_word: ἐν ταῖς ἡμέραις ταύταις
  choice: 那些日子
  rationale: 保留时间指示语的回指作用，同时使用自然、庄重的现代汉语。
- source_word: ἐπορεύθη
  choice: 前往
  rationale: πορεύομαι在此指行程；“前往”比单用“去”更适合叙事文体，又不额外规定旅程方式。
- source_word: εἰς τὴν ὀρεινὴν
  choice: 前往山区
  rationale: ὀρεινή用作名词，指山地或山区；“山区”自然地表达一个地理区域。
- source_word: μετὰ σπουδῆς
  choice: 赶忙
  rationale: σπουδή可表示急切、热切或殷勤；旅行语境中“赶忙”体现迅速动身，同时不过度强调慌乱。
- source_word: εἰς πόλιν Ἰούδα
  choice: 来到犹大的一座城镇
  rationale: πόλις可指城或镇；“城镇”在未说明规模时保留一定宽度。Ἰούδα最自然地理解为地区或支派名称“犹大”，而不是人名。
theological_decisions:
- issue: Ἰούδα的所指
  choice: 理解为地区或支派名称“犹大”
  alternative: 译作“犹太地区”，或理解为一座名叫“犹大”的城
  rationale: 上下文最自然地指犹大地区，但希腊文形式本身仍是Ἰούδα。正文采用“犹大”以贴近原文，并用脚注保留“犹太地区”和城名解释的可能性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“赶忙”传达行动迅速，但避免赋予马利亚惊慌的情绪；“城镇”保留πόλις在聚落规模上的弹性。
