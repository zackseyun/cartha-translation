  text: καὶ ἔσται χαρά σοι καὶ ἀγαλλίασις, καὶ πολλοὶ ἐπὶ τῇ ⸀γενέσει αὐτοῦ χαρήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/014.yaml
  text: And there will be joy and exultation for you[a], and many will rejoice at his birth.
translation:
  language: zh_hans
  text: 你必有喜乐和欢腾，许多人也会在他出生时[a]欢喜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因他的出生而欢喜。”希腊语短语既可指欢喜发生的时刻，也可指欢喜的缘由。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσται
  choice: 必有
  rationale: 表达将来必然发生的事，既符合天使宣告的语气，也使现代汉语自然简洁。
- source_word: χαρά σοι καὶ ἀγαλλίασις
  choice: 你必有喜乐和欢腾
  rationale: 用“喜乐”对应χαρά，以较强烈、富庆贺意味的“欢腾”对应ἀγαλλίασις，并保留两个并列名词的层次。σοι译入“你必有”，自然表达这喜乐归于撒迦利亚。
- source_word: πολλοὶ
  choice: 许多人
  rationale: 将实词化的形容词明确译为人，符合现代汉语习惯。
- source_word: ἐπὶ τῇ γενέσει αὐτοῦ
  choice: 在他出生时
  rationale: ἐπί加与格可表示欢喜发生的场合，也可表示欢喜的缘由；正文采用时间性的自然表达，脚注保留原因性的译法。
- source_word: χαρήσονται
  choice: 会……欢喜
  rationale: 准确表达χαίρω将来时的意义，并与前面的“喜乐”形成原文中的词义呼应。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“喜乐和欢腾”保留原文两个近义词的加强效果；分句结构简明，适合公开诵读。脚注标记置于其实际说明的“出生时”之后。
