id: LUK.1.64
reference: Luke 1:64
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἀνεῴχθη δὲ τὸ στόμα αὐτοῦ παραχρῆμα καὶ ἡ γλῶσσα αὐτοῦ, καὶ ἐλάλει εὐλογῶν τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/064.yaml
  text: And immediately his mouth was opened[a], and his tongue also, and he began speaking[b], blessing God.
translation:
  language: zh_hans
  text: 他的口立刻开了[a]，舌头也恢复了；他就开口说话[b]，称颂上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文采用被动表达，直译为“他的口立刻被打开了”；这里没有明说是谁使他的口打开。
    reason: grammar_clarity
  - marker: b
    text: 也可译作“他便说着话，称颂上帝”。这里的未完成时动词既可在本语境中突出他开始说话，也可强调说话持续进行。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεῴχθη
  choice: 开了
  rationale: 保留不定过去时被动语态所表达的状态突变；汉语“口开了”自然简洁，也不额外指明施事者。
- source_word: δὲ
  choice: （不单独译出）
  rationale: 此处是轻微的叙事连接词；现代汉语凭语序即可自然推进情节，若机械译作“于是”或“而”反显累赘。
- source_word: στόμα
  choice: 口
  rationale: 直接对应身体部位，也符合汉语描述恢复说话能力的习惯。
- source_word: παραχρῆμα
  choice: 立刻
  rationale: 准确表达事情突然发生并紧接前文的时间意义。
- source_word: καὶ ἡ γλῶσσα αὐτοῦ
  choice: 舌头也恢复了
  rationale: 原文直译为“他的舌头也”，省略了谓语。汉语需补足意思；用“恢复了”表明说话机能复原，却不沿用原文没有明说的“舌头松开”。
- source_word: ἐλάλει
  choice: 他就开口说话
  rationale: 未完成时可表示持续说话，也可在语境中突出动作开始。鉴于撒迦利亚先前不能说话，此处译出开始说话的叙事意味，同时以脚注保留持续体的可能。
- source_word: εὐλογῶν
  choice: 称颂
  rationale: 分词说明他说话时所做的事或话语内容；“称颂”既保留“祝颂”的词义，又比对上帝说“祝福”更符合现代汉语习惯。
- source_word: τὸν θεόν
  choice: 上帝
  rationale: 作为“称颂”的宾语，采用现代标准汉语中庄重且通行的称谓。
theological_decisions:
- issue: ἐλάλει的未完成时体应理解为开始还是持续
  choice: 正文译作“就开口说话”
  alternative: “一直说着话”或“在说话”
  rationale: 失语刚被解除的上下文使动作的开始较突出，但希腊语未完成时也可强调持续进行，因此不把另一可能排除，列入脚注。
- issue: 省略谓语的“舌头也”如何补足
  choice: “舌头也恢复了”
  alternative: “舌头也松开了”或仅译“舌头也”
  rationale: 原文没有“松开”一词，而汉语若不补谓语则难以成句；“恢复了”以最少增补传达语言能力复原，不引入额外的生理或神学解释。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“口立刻开了”紧贴原文；“舌头也恢复了”补足希腊语并列结构中省略的谓语，避免增添“松开”这一原文未有的意象。正文所有脚注标记均与脚注对应。
