  yaml_path: translation/nt/luke/001/012.yaml
  text: And Zechariah was troubled when he saw him[a], and fear fell upon him.
translation:
  language: zh_hans
  text: 撒迦利亚看见他时，就惊慌不安，恐惧临到他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐταράχθη
  choice: 惊慌不安
  rationale: 该词在此表示内心受到扰乱、震动；“惊慌不安”符合现代汉语表达，同时不把它与随后明确出现的“恐惧”完全等同。
- source_word: Ζαχαρίας
  choice: 撒迦利亚
  rationale: 采用现代中文圣经读者熟悉的标准人名译法。
- source_word: ἰδών
  choice: 一看见他
  rationale: 不定过去时分词在上下文中具有时间作用；“一看见他”自然呈现看见天使后随即发生的反应。宾语“他”由上一节的天使补出。
- source_word: φόβος
  choice: 恐惧
  rationale: 直接保留 φόβος 的基本含义，不额外强化为“极度惊恐”等。
- source_word: ἐπέπεσεν ἐπ’ αὐτόν
  choice: 笼罩了他
  rationale: 希腊语字面意象是恐惧“落在他身上”；现代汉语以“笼罩了他”较自然地保留一种外加并占据人的强烈意象。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“惊慌不安”与“恐惧”分别对应两个希腊语表达，避免把前者过度强化；“笼罩了他”比生硬的“落在他身上”更符合当代汉语，同时保留原文的形象感。
