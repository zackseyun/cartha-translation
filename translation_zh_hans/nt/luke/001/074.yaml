  yaml_path: translation/nt/luke/001/074.yaml
  text: that[a], having been rescued from the hand of our enemies[c][b], we might serve him without fear
translation:
  language: zh_hans
  text: 使我们既从仇敌手中[b]蒙拯救，就可以无所惧怕地[a]事奉他[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “无所惧怕地”也可译为“毫无畏惧地”或“无惧地”。
    reason: lexical_alternative
  - marker: b
    text: “从仇敌手中”是指脱离仇敌的权势或控制。
    reason: idiom_alternative
  - marker: c
    text: “事奉”也可译为“敬拜”或“向他作神圣的服事”；此处指向上帝的服事，不限于礼仪活动。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφόβως
  choice: 无所惧怕地
  rationale: 该副词意为“毫无惧怕地、无所畏惧地”。置于“事奉”前，按希腊语最自然地修饰事奉的方式，同时保留它在语序上可能与“被救出来”关系密切的余地。
- source_word: ἐκ χειρὸς ἐχθρῶν
  choice: 从仇敌手中
  rationale: “从……手中”保留希腊语表示脱离他人权势或控制的惯用意象；原文没有明说“我们的”，中文无需补出也自然通顺。
- source_word: ῥυσθέντας
  choice: 被救出来
  rationale: 这是不定过去时被动分词，所表达的蒙拯救构成随后事奉上帝的基础；在本节依赖上文的目的结构中，用“被救出来”自然承接。
- source_word: λατρεύειν
  choice: 事奉
  rationale: 该词用于对上帝的服事，兼有敬拜和忠诚服事的色彩。“事奉”能保留这一宗教语境，又不把含义收窄为礼仪性的敬拜。
- source_word: αὐτῷ
  choice: 他
  rationale: 代词指向上文的上帝；“事奉他”符合现代汉语搭配。
theological_decisions:
- issue: λατρεύειν 指向上帝时的范围
  choice: 事奉他
  alternative: 敬拜他
  rationale: “事奉”同时容纳敬拜、忠诚与服事，不将该词限定为礼仪活动。
- issue: ἀφόβως 的修饰范围
  choice: 无所惧怕地事奉他
  alternative: 使我们无所惧怕，从仇敌手中被救出来，就可以事奉他
  rationale: 希腊语中 ἀφόβως 紧邻前面的拯救短语，却通常理解为修饰 λατρεύειν；正文采用自然的主流句法，同时以脚注说明语序所容许的另一种关联。
translation_notes:
  register: 采用现代、庄重且易懂的汉语。“事奉”是当代基督教语境中通行而不生硬的用词；保留“从……手中”的圣经意象。正文作为路加福音1:73—75长句的一部分，以“使……就可以……”承接上文。所有脚注标记均已置于正文。
