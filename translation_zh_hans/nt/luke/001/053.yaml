  text: πεινῶντας ἐνέπλησεν ἀγαθῶν καὶ πλουτοῦντας ἐξαπέστειλεν κενούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/053.yaml
  text: He has filled the hungry with good things[a], and sent the rich away empty.
translation:
  language: zh_hans
  text: 他使饥饿的人饱享美物，却让富足的人空手[a]而去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “空手”或译“空空地”；希腊文直译为“空的”，指富足的人离去时一无所得。
    reason: κενούς 字面意为“空的”；“空手”是自然的汉语表达，“空空地”保留较直接的状态描述。
lexical_decisions:
- source_word: πεινῶντας
  choice: 饥饿的人
  rationale: 现在主动分词作名词用，指处于饥饿中的人；此译法自然、具体，又不把程度强化为“快要饿死的人”。
- source_word: ἐνέπλησεν
  choice: 使……饱享
  rationale: 该动词表示使人充满、饱足；与食物匮乏的语境相连时，“饱享”在现代汉语中自然地兼顾了充足和满足之意。希腊语不明说主语，但承接上文，主语是神。
- source_word: ἀγαθῶν
  choice: 美物
  rationale: 属格表示所充满的内容。形容词在此名词化，泛指好的东西；“美物”简洁庄重，也不额外加入“礼物”的含义。
- source_word: πλουτοῦντας
  choice: 富足的人
  rationale: 现在主动分词作名词用，与“饥饿的人”形成具体的社会处境对照；“富足的人”比单用“富人”略能保留其状态性。
- source_word: ἐξαπέστειλεν
  choice: 让……而去
  rationale: 复合动词表示打发走、遣走。结合汉语句式译作“让……而去”，自然表达其被送离的结果而不引入正式辞退的场景。
- source_word: κενούς
  choice: 空手
  rationale: 该谓语形容词原义为“空的”，描述富足者离去时一无所得的状态。正文采用自然汉语“空手”，脚注保留更字面的“空着”这一可能表达。
theological_decisions:
- issue: 马利亚颂歌中的社会与神学逆转
  choice: 保留“饥饿的人”与“富足的人”的具体对照，不将其灵意化。
  alternative: 把“饥饿的人”解释为灵里贫乏者，或把“富足的人”改译为自满、骄傲的人。
  rationale: 本节的希腊文直接描述饥饿者和富足者，体现路加叙事中神所带来的处境逆转。译文保留其社会现实与神学张力，不把可能的引申意义写进正文。
- issue: 不定过去时在颂歌中的表达
  choice: 采用汉语无显式时态的完成性陈述“使……却让……”。
  alternative: 加入“已经”以明确表达完成时，或译作将来的行动。
  rationale: 希腊语使用不定过去时，在颂歌语境中可把神确定的作为陈述为已成事实。现代汉语无需机械加入“已经”，当前表达既保留行动的决定性，也避免过度限定其时间指向。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“饱享美物”与“空手而去”形成清楚而有节奏的对照，适合颂歌体；正文中的脚注标记按要求置于相关句末。
