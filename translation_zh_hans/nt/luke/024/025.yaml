  text: καὶ αὐτὸς εἶπεν πρὸς αὐτούς· Ὦ ἀνόητοι καὶ βραδεῖς τῇ καρδίᾳ τοῦ πιστεύειν ἐπὶ πᾶσιν οἷς ἐλάλησαν οἱ προφῆται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/025.yaml
  text: And he said to them[a], “O foolish ones[c][b], and slow of heart to believe all that the prophets have spoken!”
translation:
  language: zh_hans
  text: 他对他们说：“唉，你们这些无知的人哪，在相信众先知所说的一切上，心里迟钝！”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ αὐτὸς εἶπεν πρὸς αὐτούς
  choice: 他对他们说
  rationale: 按现代汉语叙事习惯表达；本节的 καί 承接上文，无须机械译作“并且”，αὐτός 在此也不必额外强调。
- source_word: Ὦ
  choice: 唉
  rationale: 保留呼语中的感叹和严肃责备语气，同时符合现代汉语表达。
- source_word: ἀνόητοι
  choice: 无知的人
  rationale: 主要表达缺乏领悟、没有明白，并不单指道德败坏；“无知的人”兼顾呼语形式和可懂性。
- source_word: βραδεῖς τῇ καρδίᾳ
  choice: 你们的心竟如此迟钝
  rationale: 保留“心”这一指向人的内在思想、意志与信靠的意象，不把含义缩减为单纯智力上的迟缓；“竟如此”传达责备语势。
- source_word: τοῦ πιστεύειν
  choice: 要相信
  rationale: 与“心……迟钝”连用，表达他们在相信这件事上的迟缓。
- source_word: ἐπὶ πᾶσιν οἷς
  choice: ……所说的一切
  rationale: 保留 πᾶσιν 的全面范围，表明所应相信的是先知所说的全部内容。
- source_word: ἐλάλησαν
  choice: 所说的
  rationale: 自然表达先知已经说出的见证；中文无需借助时态形式另行标示其持续相关性。
- source_word: οἱ προφῆται
  choice: 众先知
  rationale: “众先知”自然指向先知群体及其见证，也保留定冠词所体现的特指性。
theological_decisions:
- issue: 耶稣责备的性质
  choice: 责备门徒既缺乏领悟，又在内心信靠先知见证一事上迟钝
  alternative: 只把这句话理解为道德谴责，或只理解为智力上的误解
  rationale: ἀνόητοι 与“心……迟钝，难以相信”并列，使领悟与信靠两方面都在视野之内；译文保留“心”和“相信”，不将二者拆开或简化。
- issue: 所信内容的范围
  choice: 相信众先知所说的一切
  alternative: 只相信先知有关弥赛亚受荣耀部分的话
  rationale: πᾶσιν 明确表示“一切”；译文不缩小先知见证的范围，也不预先消解下一节将说明的受苦与得荣耀之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“唉”保留希腊文呼语的感叹与责备力度；保留“心……迟钝”的圣经意象，并调整语序，使“相信众先知所说的一切”在汉语中清楚地修饰这种迟钝。
