review_pass:
  verdict: revise
  source_fidelity: 原译准确表达了耶稣对听者缺乏领悟、且在相信先知全部见证上内心迟钝的责备，也保留了“众先知所说的一切”的完整范围。但把“要相信……”前置并将两个并列的责备拆成两个强感叹句，使“心里迟钝”与“不易相信”之间的希腊文句法关联稍显松散；“竟如此”也比原文略增强调。
  naturalness: “无知的人”“心里迟钝”均属自然、庄重的现代汉语圣经语体。调整为“在相信……上，心里迟钝”可更清楚地表达“βραδεῖς τῇ καρδίᾳ τοῦ πιστεύειν”的修饰关系，同时避免不必要的语序倒装。
  terminology: “众先知”恰当；“心”保留 καρδία 所指的内在生命，不宜缩窄为单纯理智。“无知”可用，但脚注应说明其重点是缺乏理解，而非现代汉语中可能联想到的知识缺乏。
  issues:
  - severity: low
    issue: “要相信众先知所说的一切”被前置，并与“心……迟钝”分隔。
    rationale: 原文“心里迟钝”直接以“相信……”为所涉之事。调整语序可更明确保留这一关系。
  - severity: low
    issue: “竟如此”略增原文未明说的程度性修辞。
    rationale: 希腊文的责备语气已由呼语和形容词表达；译为“在……上，心里迟钝”即可保留力度而少加解释。
  revised_text: 他对他们说：“唉，你们这些无知的人哪，在相信众先知所说的一切上，心里迟钝！”
  revised_footnotes:
  - marker: a
    text: “无知”也可译作“没有悟性”或“不明白事理”。这里侧重缺乏领悟，并非主要指知识不足，也不一定单指道德上的愚恶。
    reason: lexical_alternative
  - marker: b
    text: 直译“心里迟钝”。“心”在这里指人的内在思想、意愿和信靠；“在相信……上”说明他们迟缓于信受众先知所说的一切。
    reason: cultural_note
  revision_rationale: 修订将“在相信众先知所说的一切上”紧接“心里迟钝”，更直接呈现原文“βραδεῖς τῇ καρδίᾳ τοῦ πιστεύειν”的关系；保留呼语、责备语气、“心”的意象，以及先知见证的全面范围。
