revisions:
- from: 他对他们说：“唉，你们这些无知的人[a]！要相信众先知所说的一切，你们的心竟如此迟钝[b]！”
  to: 他对他们说：“唉，你们这些无知的人哪，在相信众先知所说的一切上，心里迟钝！”
  rationale: 修订将“在相信众先知所说的一切上”紧接“心里迟钝”，更直接呈现原文“βραδεῖς τῇ καρδίᾳ τοῦ πιστεύειν”的关系；保留呼语、责备语气、“心”的意象，以及先知见证的全面范围。
