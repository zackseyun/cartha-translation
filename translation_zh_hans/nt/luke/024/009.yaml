  text: καὶ ὑποστρέψασαι ἀπὸ τοῦ μνημείου ἀπήγγειλαν ταῦτα πάντα τοῖς ἕνδεκα καὶ πᾶσιν τοῖς λοιποῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/009.yaml
  text: And returning from the tomb, they reported all these things to the eleven and to all the rest.
translation:
  language: zh_hans
  text: 她们从坟墓回来，把这一切都告诉了那十一个人和其余所有的人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑποστρέψασαι
  choice: 回来
  rationale: 这个简单过去时主动分词为阴性复数，指前文到坟墓去的妇女。“她们从坟墓回来”以自然的现代汉语表达分词与主句动作的衔接。
- source_word: μνημείου
  choice: 坟墓
  rationale: 在耶稣安葬与复活的语境中，μνημεῖον指安放遗体的墓，译作“坟墓”准确、通行，也便于普通读者理解。
- source_word: ἀπήγγειλαν
  choice: 告诉了
  rationale: 该动词表示把消息转告或报告给人。“告诉了”符合此处向特定群体转述所见所闻的场景，比“宣布”少一层公开宣告的意味，也比“报告了”更自然。
- source_word: ταῦτα πάντα
  choice: 这一切
  rationale: “这一切”自然地保留了指示意义和πάντα所表达的完整范围。
- source_word: τοῖς ἕνδεκα
  choice: 那十一个人
  rationale: 原文只称“那十一位/人”，没有出现“使徒”一词；译作“那十一个人”既明确人数，也不增添原文未有的称号。
- source_word: πᾶσιν τοῖς λοιποῖς
  choice: 其他所有的人
  rationale: 该表达指十一人以外其余的全体。“其他所有的人”保留了πᾶσιν的周全含义及λοιποῖς与“那十一个人”的区分。
theological_decisions:
- issue: 阴性复数分词及复数动词的主语所指
  choice: 以“她们”明确指前文来到坟墓的妇女
  alternative: 省略主语，依靠上文推知
  rationale: 希腊文分词的阴性复数形式明确限定了主语；现代汉语补出“她们”既符合语境，也保留原文的性别信息。
- issue: 对十一人群体的称呼
  choice: 那十一个人
  alternative: 那十一个使徒
  rationale: 原文采用惯称“那十一人”，并未使用“使徒”；不补入称号可避免超出原文措辞。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。句式简洁地呈现先回来、后转告的叙事次序；不添加“使徒”等解释性称号。
