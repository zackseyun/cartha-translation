reference: Luke 24:31
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: αὐτῶν δὲ διηνοίχθησαν οἱ ὀφθαλμοὶ καὶ ἐπέγνωσαν αὐτόν· καὶ αὐτὸς ἄφαντος ἐγένετο ἀπ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/031.yaml
  text: Then their eyes were opened[a], and they recognized him; and he became unseen by them.
translation:
  language: zh_hans
  text: 于是，他们的眼睛开了，就认出了他；他却从他们眼前不见了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他在他们面前成了不可见的”，或“他从他们那里消失了”。
    reason: 原文 ἄφαντος ἐγένετο ἀπ’ αὐτῶν 可直译为变得不可见，也可自然表达为从他们那里消失；各译法均不限定事情发生的具体机制。
lexical_decisions:
- source_word: διηνοίχθησαν
  choice: 开了
  rationale: 这是 διανοίγω 的简单过去时被动形式。结合“眼睛”作主语，译作“眼睛开了”自然简洁，并保留他们的认知是被开启、并非自行产生的意味。
- source_word: οἱ ὀφθαλμοὶ
  choice: 他们的眼睛
  rationale: 希腊文以“眼睛”为主语，并由 αὐτῶν 表明所属；现代汉语自然表达为“他们的眼睛”。
- source_word: ἐπέγνωσαν
  choice: 认出了
  rationale: ἐπιγινώσκω 在此指认出先前未能辨认之人；“认出了”符合以马忤斯叙事语境，也体现动作的完成。
- source_word: ἄφαντος
  choice: 不见了
  rationale: ἄφαντος 表示不可见、看不见。汉语“不见了”自然地表达他不再处于他们可见的范围内，同时不说明其具体机制。
- source_word: ἐγένετο ἀπ’ αὐτῶν
  choice: 从他们眼前不见了
  rationale: 字面结构含“成为”与“离开他们”的关系表达；“从他们眼前不见了”在现代汉语中清楚传达他对他们而言已不可见，并保留 ἀπό 的离开意味。
- source_word: δὲ
  choice: 于是；却
  rationale: 本节首个 δέ 推进叙事，译作“于是”；后一句的 καί 在语境中形成突转，汉语用“却”自然呈现认出与随即不见之间的转折。
theological_decisions:
- issue: 耶稣不再被看见的性质
  choice: 他却从他们眼前不见了
  alternative: 他在他们面前成了不可见的；他从他们那里消失了
  rationale: 原文用 ἄφαντος 与 γίνομαι，说明他变得不可见，却没有交代其机制。“从他们眼前不见了”既忠实表达结果，也不武断说明他如何离去，保留叙事中的奥秘。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“眼睛开了”保留原文的身体意象及被动意味；“认出了”符合现代汉语习惯。“从他们眼前不见了”避免生硬的“成为不可见”，同时不把原文未说明的机制带入译文。
