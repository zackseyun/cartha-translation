id: LUK.24.51
reference: Luke 24:51
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ εὐλογεῖν αὐτὸν αὐτοὺς διέστη ἀπ’ αὐτῶν ⸂[καὶ ἀνεφέρετο εἰς τὸν οὐρανόν]⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/051.yaml
  text: And it happened that[a], while he was blessing them, he parted from them and was carried up into heaven.
translation:
  language: zh_hans
  text: 正当他为他们祝福的时候，他就与他们分开，被接到天上去了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本没有“被接到天上去了”这句话。
    reason: textual_variant
lexical_decisions:
- source_word: ἐγένετο
  choice: 不单独译出，以“正当……的时候”承载叙事引入功能
  rationale: ἐγένετο在这里是路加常用的叙事衔接语。若直译为“事情发生了”，现代汉语显得生硬；融入时间结构既保留事件推进，又更自然。
- source_word: ἐν τῷ εὐλογεῖν αὐτὸν αὐτοὺς
  choice: 正当他为他们祝福的时候
  rationale: ἐν加带冠词的不定式表示同时发生的动作；“正当……的时候”清楚体现耶稣仍在祝福时发生后续事件。“为他们祝福”准确表达宾语关系。
- source_word: διέστη ἀπ’ αὐτῶν
  choice: 他就与他们分开
  rationale: 表达从众人那里离开、彼此分离的意思，同时不预先把离开的方式解释为主动退去或突然消失。
- source_word: ἀνεφέρετο
  choice: 被接到……去了
  rationale: 保留被动意味和向上的方向，但不明确补出行动者；“接到天上去”是自然、庄重的现代汉语。
- source_word: εἰς τὸν οὐρανόν
  choice: 到天上
  rationale: 此处上下文指向属天领域，而非仅仅可见的天空；“天上”在现代中文中自然且不过度抽象。
theological_decisions:
- issue: 括号内短语 καὶ ἀνεφέρετο εἰς τὸν οὐρανόν 的文本异文
  choice: 正文保留“被接到天上去了”，并加异文脚注
  alternative: 正文省略此句，仅作“他就与他们分开”
  rationale: SBLGNT以方括号标示该短语的文本不确定性。依所给底本将其译入正文，同时在脚注说明部分抄本省略，以公开保留异文证据，不替读者暗中裁定。
- issue: ἀνεφέρετο 的行动者
  choice: 采用无明确行动者的被动表达“被接到”
  alternative: 明确译为“神把他接到天上”
  rationale: 希腊文本没有明说行动者；中文保留被动式可避免加入经文未明言的解释。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“正当……的时候”表达同时性；“他就”推进叙事。脚注标记置于所涉异文句末。
