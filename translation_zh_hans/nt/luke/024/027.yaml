  text: καὶ ἀρξάμενος ἀπὸ Μωϋσέως καὶ ἀπὸ πάντων τῶν προφητῶν ⸀διερμήνευσεν αὐτοῖς ἐν πάσαις ταῖς γραφαῖς τὰ περὶ ⸀ἑαυτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/027.yaml
  text: And beginning with Moses and all the Prophets[b][a], he interpreted to them in all the Scriptures the things concerning himself.
translation:
  language: zh_hans
  text: 他从摩西和众先知讲起[a]，向他们解释了所有经书中有关他自己的事[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “摩西和众先知”指与摩西相关的经卷和先知书。
    reason: cultural_note
  - marker: b
    text: “解释”也可译作“阐释”；希腊文动词可指详尽说明其中的含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρξάμενος ἀπὸ Μωϋσέως καὶ ἀπὸ πάντων τῶν προφητῶν
  choice: 从摩西和众先知讲起
  rationale: ἀπό标明讲解的起点；“从……讲起”符合现代汉语表达。“摩西和众先知”在此指与摩西相关的经卷及先知书，脚注说明这一文化与经卷背景。
- source_word: διερμήνευσεν
  choice: 解明
  rationale: 该动词表示解释、阐明其含义；“解明”既保留经文诠释的意味，也自然、庄重，且不显得过分学术化。
- source_word: αὐτοῖς
  choice: 给他们
  rationale: 自然表达与格间接宾语，清楚表明讲解的对象。
- source_word: ἐν πάσαις ταῖς γραφαῖς
  choice: 全部经卷中
  rationale: γραφή在此指神圣经书；“经卷”能体现复数经文著作的范围，并避免现代读者把“所有经文”误解为每一个单独句子。
- source_word: τὰ περὶ ἑαυτοῦ
  choice: 有关自己的事
  rationale: 保留中性复数结构的宽泛含义，不限定为预言、预表或某一种特定解释类别。
theological_decisions:
- issue: 耶稣讲解经书的范围与方式
  choice: 表述为他把全部经卷中有关自己的事解明
  alternative: 仅指直接的弥赛亚预言；或指每一处旧约经文都逐一直接谈论他
  rationale: 原文广泛指经书中与耶稣有关的内容，却没有把这些内容限定为直接预言，也没有明确宣称每一节经文都直接指向他；译文保留这一广度与张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“于是”承接叙事；“讲起”自然呈现分词与主句的联系。“经卷”体现古代圣经著作的集合概念。所有脚注标记均已置于正文相应位置。
