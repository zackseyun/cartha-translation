  text: ὅπως τε παρέδωκαν αὐτὸν οἱ ἀρχιερεῖς καὶ οἱ ἄρχοντες ἡμῶν εἰς κρίμα θανάτου καὶ ἐσταύρωσαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/020.yaml
  text: and how our chief priests and rulers handed him over to a sentence of death and crucified him[a][b].
translation:
  language: zh_hans
  text: 还有，我们的祭司长和官长怎样把他交给人判处死刑[a]，又把他钉在十字架上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“把他交出去，使他被判死刑”。
    reason: lexical_alternative
  - marker: b
    text: 或译“叫人把他钉在十字架上”。此译法将主动动词理解为对处刑责任的归属。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως τε
  choice: 以及……怎样
  rationale: ὅπως在这里引出所述事件的内容，τε承接上文；“以及……怎样”自然延续前一节的叙述。
- source_word: παρέδωκαν
  choice: 把……交出去
  rationale: παραδίδωμι在此指把耶稣交给司法权力处置；“交出去”保留了移交之意，也避免缩窄为“出卖”。
- source_word: οἱ ἀρχιερεῖς
  choice: 祭司长
  rationale: 这是第二圣殿时期犹太祭司领导阶层的惯常称谓，并非指同时存在多位严格意义上的大祭司。
- source_word: οἱ ἄρχοντες ἡμῶν
  choice: 我们的官长
  rationale: ἄρχοντες指掌权者或领袖；“官长”符合司法与政治语境，并保留ἡμῶν所表达的“我们的”。
- source_word: εἰς κρίμα θανάτου
  choice: 使他被判死刑
  rationale: κρίμα可指判决、裁决或刑罚；结合θανάτου，此处是导致死刑判决。该译法在现代汉语中自然地表达εἰς所指向的司法结果。
- source_word: ἐσταύρωσαν
  choice: 把他钉在十字架上
  rationale: σταυρόω直指钉十字架。译文照原文以主动形式把责任归于祭司长和官长，不额外限定他们是否亲手执行。
theological_decisions:
- issue: 耶稣被处死时的施事责任
  choice: 照希腊文以主动表达“把他钉在十字架上”，将责任直接归于祭司长和官长
  alternative: “叫人把他钉在十字架上”
  rationale: 原文以祭司长和官长为主动复数动词的主语。直译保留经文对其责任的归属，同时不必理解为他们亲手实施了罗马式处刑。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“祭司长”“官长”“钉在十字架上”保留必要的历史与司法色彩；句法避免生硬直译，同时保留原文对领袖责任的直接归属。
