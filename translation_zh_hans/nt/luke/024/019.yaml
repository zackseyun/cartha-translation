  text: καὶ εἶπεν αὐτοῖς· Ποῖα; οἱ δὲ εἶπαν αὐτῷ· Τὰ περὶ Ἰησοῦ τοῦ ⸀Ναζαρηνοῦ, ὃς ἐγένετο ἀνὴρ προφήτης δυνατὸς ἐν ἔργῳ καὶ λόγῳ ἐναντίον τοῦ θεοῦ καὶ παντὸς τοῦ λαοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/019.yaml
  text: And he said to them, “What things?” And they said to him, “The things concerning Jesus the Nazarene, who became a man, a prophet mighty in deed and word before God and all the people,”
translation:
  language: zh_hans
  text: 他对他们说：“什么事？”他们回答说：“就是关于拿撒勒人耶稣的事。他是一个人，也是一位先知[a]；在上帝和全体百姓面前，他的行为和言语都大有能力。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文较字面地说“成了一个人、一个先知”。此处“成了”可按身份描述的语境惯用地译为“是”；原文同时称他为“人”和“先知”。
    reason: 说明ἐγένετο的语境性译法，并保留ἀνήρ与προφήτης的双重称述。
lexical_decisions:
- source_word: Ποῖα
  choice: 什么事？
  rationale: 该中性复数疑问词指前文所说的事情；现代汉语用“什么事”自然表达这一所指，无须机械保留复数形式。
- source_word: Τὰ περὶ Ἰησοῦ
  choice: 就是……耶稣的事
  rationale: 保留“关于耶稣的那些事”这一结构的含义，同时以“就是……的事”承接问句，符合现代汉语对话习惯。
- source_word: Ναζαρηνοῦ
  choice: 拿撒勒人
  rationale: 按希腊文形容性称号直译为“拿撒勒人”，而非直接改写为“来自拿撒勒的”；脚注列出更自然的地名表达。
- source_word: ἐγένετο ἀνὴρ προφήτης
  choice: 他是个先知
  rationale: 此处 ἐγένετο 在人物身份描述中可按语境表达为“是”；ἀνήρ与προφήτης构成表语性描述，汉语若译“成为一个男人、一个先知”会造成他此前不是人的误解。“他是个先知”自然传达说话者对耶稣身份的描述。
- source_word: δυνατὸς ἐν ἔργῳ καὶ λόγῳ
  choice: 说话行事都大有能力
  rationale: 将希腊文“在行为和言语上有能力”调整为汉语常用的“说话行事”，既保留两个方面，也表达 δυνατός 的强有力含义。
- source_word: ἐναντίον τοῦ θεοῦ καὶ παντὸς τοῦ λαοῦ
  choice: 在上帝和全体百姓面前
  rationale: ἐναντίον在此表示在……面前、眼前，兼有上帝与众民见证其言行的公开意味。
theological_decisions:
- issue: 如何表达 ἀνὴρ προφήτης 对耶稣的描述
  choice: 他是个先知
  alternative: 他成为一个人，是个先知／他是一个有先知身份的人
  rationale: 希腊文明确使用ἀνήρ，但在这里与προφήτης连用，以“一个人，一个先知”逐词硬译成汉语，容易暗示耶稣后来才成为人。译作“他是个先知”不否认其人性，而是按汉语自然表达保留这两位门徒在当时语境中对他的称述。
- issue: “在上帝和全体百姓面前”的评价范围
  choice: 保持原文陈述，不解释为上帝认可或仅为公众观感
  alternative: 在上帝和众人眼中／蒙上帝和众人认可
  rationale: 原文可表达在其面前或眼前；译文保留这种见证性的开放含义，避免额外断定认可的性质。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“拿撒勒人”保留原文称号形式；“说话行事都大有能力”比逐词译作“在行为和言语上有能力”更符合普通读者的表达习惯。
