  naturalness: 修订后的“他是一个人，也是一位先知”在现代汉语中通顺、庄重，避免“成为一个人”造成时间性及本体上的误解。“什么事？”、“拿撒勒人耶稣”及“在上帝和全体百姓面前”均自然合宜。
  terminology: “拿撒勒人耶稣”保留Ναζαρηνοῦ的称号性表达；“先知”“上帝”“全体百姓”均恰当。脚注应不把“成为一个人”说成唯一或无保留的直译，并应说明原文同时称耶稣为“人”和“先知”。
