  rationale: 修订恢复原文ἀνήρ所表达的“人”，同时把ἐγένετο按本句身份描述的自然汉语功能译为“是”，不制造“耶稣此前不是人”的错误暗示。脚注保留较字面的译法及其语境限制。其余表达维持原有的现代、庄重语体，并忠实呈现“在上帝和全体百姓面前”以及“行为和言语”的并列。
