  text: καὶ ἀπῆλθόν τινες τῶν σὺν ἡμῖν ἐπὶ τὸ μνημεῖον, καὶ εὗρον οὕτως καθὼς ⸀καὶ αἱ γυναῖκες εἶπον, αὐτὸν δὲ οὐκ εἶδον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/024.yaml
  text: And some of those with us went to the tomb and found it just as the women had said, but they did not see him.
translation:
  language: zh_hans
  text: 我们当中有几个人到坟墓那里去，发现情况正如那些妇女所说的；只是没有看见他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπῆλθόν
  choice: 到……去
  rationale: 此处叙述有人前往坟墓；“到坟墓那里去”用现代汉语自然表达朝向目的地的移动，不额外强调离开。
- source_word: τινες τῶν σὺν ἡμῖν
  choice: 我们中间有几个人
  rationale: 准确表达同行群体中的一部分人，既贴近希腊文结构，也符合现代汉语习惯。
- source_word: ἐπὶ τὸ μνημεῖον
  choice: 到坟墓那里
  rationale: μνημεῖον在本段指耶稣安葬之处；“坟墓”明确而通行。
- source_word: εὗρον οὕτως
  choice: 所见的果然……一样
  rationale: εὗρον本义为“发现、见到”；结合后面的比较结构，译为“所见的果然……一样”自然传达他们到场后确认情况属实。“果然”表达οὕτως καθὼς的符合关系，不增加“完全”等过强意味。
- source_word: καθὼς καὶ αἱ γυναῖκες εἶπον
  choice: 和那些妇女所说的一样
  rationale: 表达现场情况与妇女先前报告相符；“那些妇女”承接上文特指的妇女。καί的附加意味在汉语比较结构中已可由语境体现，不必生硬译出“也”。
- source_word: αὐτὸν δὲ οὐκ εἶδον
  choice: 只是没有看见他
  rationale: “只是”自然表达δέ所标示的温和转折；保留代词“他”，并按ὁράω直译为“看见”，不改作“找到”。
theological_decisions:
- issue: 复活叙事中的报告范围
  choice: 保留“情况与妇女所说的一样”与“没有看见他”之间的叙事张力
  alternative: 将妇女的报告具体解释为坟墓空了，或借平行经文补充其他细节
  rationale: 原文只说来访者发现情况与妇女所说的一样，同时没有看见耶稣本人。译文不把“一样”的具体内容说得超过本节，也不引入平行记载来调和。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“我们中间有几个人”口吻符合以马忤斯路上人物的转述；“所见的果然……一样”避免僵硬复制希腊语序，同时保存确认妇女报告的含义。
