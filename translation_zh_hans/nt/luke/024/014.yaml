  text: And they were talking with one another about all these things that had happened[a].
translation:
  language: zh_hans
  text: 他们彼此谈论着所发生的这一切事。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们彼此交谈，谈的是这一切已经发生的事。”
    reason: 词汇与句法替代译法：以“交谈”表达 ὡμίλουν 的会话意味，并以“已经发生”较明确地呈现 συμβεβηκότων 的完成状态。
lexical_decisions:
- source_word: καὶ
  choice: （承接上文，不另译）
  rationale: 此处 καὶ 是普通叙事连接词；现代汉语承接上句时可由语序自然表达，无须机械译作“并且”或“于是”，以免增加原文没有的强调或时间意味。
- source_word: αὐτοὶ
  choice: 他们
  rationale: 原文明确使用主语代词，略有聚焦作用；译作“他们”自然清楚，不必加“自己”来强化。
- source_word: ὡμίλουν
  choice: 谈论着
  rationale: 未完成时表示当时正在持续进行的交谈；“谈论着”既体现过程性，也符合 ὁμιλέω 在此指交谈而非正式演说的含义。
- source_word: πρὸς ἀλλήλους
  choice: 彼此
  rationale: 表达双方互相交谈；“彼此”简洁自然，并保留相互性。
- source_word: περὶ πάντων
  choice: 这一切
  rationale: περί 引出谈论的内容，πάντων 涵盖整组事件；汉语用“谈论着这一切……”自然表达“谈论所有这些事”。
- source_word: τῶν συμβεβηκότων τούτων
  choice: 所发生的事
  rationale: συμβαίνω 的完成时分词指已经发生、并与当前情境有关的事件；“所发生的事”保持完成事件的意义，又避免古雅的“成就之事”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“谈论着”呈现未完成时的持续动作；正文中的“这一切所发生的事”保留原文对整组事件的概括。脚注标记已在正文中对应出现。
