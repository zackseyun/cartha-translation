revisions:
- from: 彼得却起来，跑到坟墓那里。他俯身往里看，只见细麻布，就回去了，心里惊讶所发生的事。[a]
  to: 彼得却起身跑到墓穴那里；他俯身往里看，只见细麻布，就离开了，心里对所发生的事感到惊讶。[a]
  rationale: 修订仅处理可安全确定的语义精度和汉语表达：以“离开了”避免将ἀπῆλθεν具体化为“回去”，以更自然的句式表达彼得的惊异，并以“墓穴”配合俯身向内探看的场景。保留“只见细麻布”对ὀθόνια μόνα的简洁表达，以及脚注对文本和短语歧义的说明。
