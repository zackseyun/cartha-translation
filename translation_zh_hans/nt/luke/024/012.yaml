id: LUK.24.12
reference: Luke 24:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ⸂Ὁ δὲ Πέτρος ἀναστὰς ἔδραμεν ἐπὶ τὸ μνημεῖον· καὶ παρακύψας βλέπει τὰ ⸀ὀθόνια μόνα· καὶ ἀπῆλθεν πρὸς ⸀αὑτὸν θαυμάζων τὸ γεγονός.⸃
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/012.yaml
  text: But Peter got up and ran to the tomb; and stooping to look in, he sees the linen cloths alone, and he went away to himself, marveling at what had happened.
translation:
  language: zh_hans
  text: 彼得却起身跑到墓穴那里；他俯身往里看，只见细麻布，就离开了，心里对所发生的事感到惊讶。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些重要古抄本没有第12节。“就离开了，心里对所发生的事感到惊讶”也可理解为“独自离开，对所发生的事感到惊讶”。
    reason: 说明SBLGNT以双括号标示的整节文本疑问，并保留πρὸς αὑτόν可表示内在反应或“独自”的歧义。
lexical_decisions:
- source_word: μνημεῖον
  choice: 坟墓
  rationale: 指安放遗体的墓穴；“坟墓”自然、准确，也符合上下文。
- source_word: παρακύψας
  choice: 俯身往里看
  rationale: 表达弯身探看墓穴内部的具体动作。
- source_word: ὀθόνια
  choice: 细麻布
  rationale: 复数形式指包裹遗体所用的麻布；保留材质与集体复数含义，不补入原文未明说的“裹尸”。
- source_word: μόνα
  choice: 只见……
  rationale: 体现麻布单独留在墓中的意思；汉语用“只见”表达自然。
- source_word: πρὸς αὑτόν
  choice: 心里
  rationale: 该短语在此可表示彼得独自思量或在自己心里；正文采用自然汉语“心里”，并以脚注保留另一可能。
- source_word: θαυμάζων
  choice: 惊讶
  rationale: 表示因所见之事而诧异、惊奇，未必含赞叹之意。
theological_decisions:
- issue: 历史现在时 βλέπει
  choice: 只见
  alternative: 看见了／他看见
  rationale: 希腊文在过去时叙事中使用现在时以增强现场感；汉语以紧接动作的“只见”自然再现突现感，同时避免生硬转换时态。
- issue: πρὸς αὑτόν 的归属与含义
  choice: 回去了，心里惊讶
  alternative: 独自回去，一路惊讶
  rationale: 保留其可修饰“回去”或与内在惊讶相关的张力；正文选择通顺读法，脚注交代另一理解。
- issue: 本节的文本存在
  choice: 正文收录并加注
  alternative: 不收入正文
  rationale: 该整节在一些重要古抄本中缺失；因所给 SBLGNT 以双括号标示高度可疑文本，正文保留供读者阅读，并明确说明文本证据。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“彼得却起来”承接前文其他人不信妇女的话，保留 δέ 的转折推进作用；句式简洁，保持动作的紧迫感。
