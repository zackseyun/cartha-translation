review_pass:
  verdict: revise
  source_fidelity: 正文基本忠实于希腊文的动作次序和内容，也以脚注恰当提示了整节的重大文本疑问。不过，“回去了”比ἀπῆλθεν（离开、走了）更具体；“心里惊讶所发生的事”对πρὸς ἑαυτόν和θαυμάζων的表达略显生硬。
  naturalness: “彼得却起来”和“心里惊讶所发生的事”不够自然。改为“彼得却起身”“心里对所发生的事感到惊讶”，可保持庄重、现代且流畅的叙事语体。
  terminology: 将μνημεῖον译作“墓穴”能在彼得俯身向内探看的语境中更准确地指向墓室，而不引入不必要的建筑细节。“细麻布”保留原译；汉语集合名词可自然承载希腊语复数ὀθόνια。
  issues:
  - severity: medium
    issue: ἀπῆλθεν译为“回去了”
    rationale: 原文基本义为“离开、走了”；“回去”增加了返回原处的方向性。改作“离开了”更贴近原文，并仍可由脚注保留πρὸς ἑαυτόν可作“独自离开”的理解。
  - severity: low
    issue: “心里惊讶所发生的事”表达生硬
    rationale: 汉语通常说“心里对……感到惊讶”。这一修改不改变θαυμάζων所表达的持续惊异，也保留πρὸς ἑαυτόν可指内心状态的理解。
  - severity: low
    issue: “坟墓那里”较宽泛
    rationale: 上下文中的μνημεῖον是可俯身向内察看的安葬处；“墓穴”在现代汉语中更清楚自然。
