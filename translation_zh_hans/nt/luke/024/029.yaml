  source_fidelity: “他们却竭力挽留他”基本准确传达παρεβιάσαντο在此处恳切坚持的语气；“天将晚，日头已经西斜了”也适当地保留了πρὸς ἑσπέραν与κέκλικεν ἤδη ἡ ἡμέρα的双重时间描写。不过末句“他就进去，要同他们住下”将τοῦ μεῖναι处理为单纯尚未实现的目的，汉语读来略显生硬，且弱化叙事中他进入并留下的结果。
