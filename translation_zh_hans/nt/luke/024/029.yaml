  text: καὶ παρεβιάσαντο αὐτὸν λέγοντες· Μεῖνον μεθ’ ἡμῶν, ὅτι πρὸς ἑσπέραν ἐστὶν καὶ κέκλικεν ⸀ἤδη ἡ ἡμέρα. καὶ εἰσῆλθεν τοῦ μεῖναι σὺν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/029.yaml
  text: But they urged him strongly[a], saying, “Stay with us[b], because it is toward evening and the day has already declined.” And he went in to stay with them.
translation:
  language: zh_hans
  text: 他们却极力挽留他[a]，说：“请同我们住下，因为天将晚，日头已经西斜了[b]。”他便进去，同他们住下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们再三恳求他”；传统也有译作“他们强留他”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“白昼已经过去大半了。”
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεβιάσαντο
  choice: 竭力挽留他
  rationale: 该中间语态动词在这里表达恳切而强烈的坚持，并非身体上的强迫；“竭力挽留”既保留力度，也符合待客语境。
- source_word: Μεῖνον
  choice: 请……住下
  rationale: 在邀请留宿的语境中，命令式自然译作“请住下”，既表达请求，也符合现代汉语习惯。
- source_word: μεθ’ ἡμῶν
  choice: 同我们
  rationale: μετά加属格表示陪伴或共同相处，“同我们”直接传达这一关系。
- source_word: ὅτι πρὸς ἑσπέραν ἐστὶν
  choice: 因为天将晚
  rationale: πρὸς ἑσπέραν表示正接近傍晚；“天将晚”保留尚未完全入夜的时间意味。
- source_word: κέκλικεν ἤδη ἡ ἡμέρα
  choice: 日头已经西斜了
  rationale: κλίνω的完成时描绘白昼已经倾斜、趋向终了；“日头已经西斜了”在汉语中自然地保留这一形象。
- source_word: εἰσῆλθεν
  choice: 他就进去
  rationale: 叙事语境中译为“进去”自然，也保留进入屋内或住宿处的含义。
- source_word: τοῦ μεῖναι
  choice: 要……住下
  rationale: 带冠词不定式在此表达目的；“要同他们住下”清楚呈现他进去的目的。
- source_word: σὺν αὐτοῖς
  choice: 同他们
  rationale: σύν表示共同和陪伴，“同他们”是自然、准确的表达。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“竭力挽留”避免把动作误解为身体强迫；“天将晚，日头已经西斜了”保留原文两个彼此相近但并不完全重复的时间表达。所有脚注标记均置于正文相应位置。
