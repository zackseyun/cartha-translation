id: LUK.24.15
reference: Luke 24:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ ὁμιλεῖν αὐτοὺς καὶ συζητεῖν καὶ ⸀αὐτὸς Ἰησοῦς ἐγγίσας συνεπορεύετο αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/015.yaml
  text: And it happened that while they were talking and discussing[b][a], Jesus himself came near and was going with them.
translation:
  language: zh_hans
  text: 正当他们交谈、彼此讨论[a]的时候，耶稣亲自走近，和他们一同前行[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“彼此辩论”或“彼此争论”；希腊语可表示较为激烈的讨论。
    reason: lexical_alternative
  - marker: b
    text: 或译：“走近他们，和他们同行。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: （融入“正当……的时候”这一叙事结构）
  rationale: 这是路加常用的叙事衔接语。汉语若直译为“事情发生了”会显得生硬，因此以时间从句自然承载事件转折。
- source_word: ἐν τῷ ὁμιλεῖν αὐτοὺς
  choice: 正当他们交谈……的时候
  rationale: ἐν加冠词化不定式表达同时发生的时间关系；“交谈”自然传达ὁμιλέω所指的一般谈话。
- source_word: συζητεῖν
  choice: 彼此讨论
  rationale: 保留共同商议、认真交换意见的含义，同时不在正文中过度强化为争辩；较强烈的可能性收入脚注。
- source_word: αὐτὸς Ἰησοῦς
  choice: 耶稣亲自
  rationale: 保留αὐτός对耶稣身份的强调，突出走近他们的正是耶稣本人。
- source_word: ἐγγίσας
  choice: 走近
  rationale: 简洁自然地表达耶稣向他们靠近的动作，并适合与后面的同行动作衔接。
- source_word: συνεπορεύετο
  choice: 和他们一同前行
  rationale: “一同前行”表达陪伴同行；语境及“不完成时”显示这是持续进行的动作。
- source_word: καὶ ... καὶ ... καὶ
  choice: 交谈、彼此讨论……走近，和……一同前行
  rationale: 按现代汉语句法处理重复连接词，以顿号和逗号保持动作的并列与推进，避免机械重复“并且”。
theological_decisions:
- issue: 走近者身份的叙事强调
  choice: 耶稣亲自走近
  alternative: 耶稣走近
  rationale: 原文αὐτός具有强调作用，指出走近他们的正是耶稣本人；这是语法和叙事重点，并非额外加入的神学解释。
- issue: συζητεῖν所含讨论强度
  choice: 正文译作“彼此讨论”，脚注保留“争论”的可能
  alternative: 彼此争论
  rationale: 原词可指共同讨论，也可能带有辩论或争执色彩。上下文表明谈话认真而热烈，却不足以断定敌对争吵，因此不在正文中消除其语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“正当……的时候”自然表达希腊语时间结构；“亲自”保留原文强调；“一同前行”兼顾同行动作及其持续性。所有脚注标记均置于正文相关词句之后。
