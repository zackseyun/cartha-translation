  text: ἀλλὰ καὶ γυναῖκές τινες ἐξ ἡμῶν ἐξέστησαν ἡμᾶς, γενόμεναι ⸀ὀρθριναὶ ἐπὶ τὸ μνημεῖον
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/022.yaml
  text: But also[a], some women from among us astonished us, having gone early in the morning to the tomb[b],
translation:
  language: zh_hans
  text: 不过，我们中间有些妇女也使我们十分惊讶[a]；她们一大早[b]到了坟墓那里，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使我们惊奇”，也可译“使我们困惑不已”。希腊文动词可表示强烈的惊异或不知所措。
    reason: lexical_alternative
  - marker: b
    text: 或译“黎明时分”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ καὶ
  choice: 不过……也
  rationale: 既承接上文的失望，表达转折，又引出一个出人意料的新情况，保留逆接与递进兼有的语气。
- source_word: γυναῖκές τινες
  choice: 有几个妇女
  rationale: 以自然的现代汉语表达不定复数，不暗示这些妇女在群体之外。
- source_word: ἐξ ἡμῶν
  choice: 我们中间
  rationale: 明确这些妇女属于门徒群体，而不只是从说话者所在之处而来。
- source_word: ἐξέστησαν ἡμᾶς
  choice: 使我们十分惊讶
  rationale: 表达强烈的惊异，同时不把反应限定为困惑、迷惘或相信。
- source_word: γενόμεναι
  choice: 到了
  rationale: 该分词与表示清早的谓语性形容词及表示趋向的介词短语连用，按汉语习惯明确表达抵达坟墓。
- source_word: ὀρθριναὶ
  choice: 一大早
  rationale: 自然表达清晨很早的时候；“黎明时分”也是可能译法。
- source_word: ἐπὶ τὸ μνημεῖον
  choice: 到了坟墓那里
  rationale: ἐπί加宾格在此自然表示朝向或抵达；“坟墓”符合耶稣安葬于墓穴的语境。
theological_decisions:
- issue: 复活叙事中ἐξέστησαν所表达的反应
  choice: 使我们十分惊讶
  alternative: 使我们惊奇；使我们困惑不已
  rationale: 原文描述门徒听到妇女报告后的强烈反应，却尚未说明他们相信还是不相信；本译法保留这种叙事张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“不过……也”保留原文转折兼递进的衔接；分号使前半句的反应与后半句的原因关系清楚。句末逗号保留本节与下一节在句法和叙事上的连续性。
