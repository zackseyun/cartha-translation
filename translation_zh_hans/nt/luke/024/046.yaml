id: LUK.24.46
reference: Luke 24:46
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς ὅτι οὕτως ⸀γέγραπται παθεῖν τὸν χριστὸν καὶ ἀναστῆναι ἐκ νεκρῶν τῇ τρίτῃ ἡμέρᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/046.yaml
  text: And he said to them[a], “Thus it is written[b], that the Messiah would suffer and rise from the dead on the third day,”
translation:
  language: zh_hans
  text: 他对他们说：“经上这样记着：弥赛亚[a]要受苦，并在第三天从死者中复活[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“基督”。希腊语 Χριστός 在这里用作称号，意思是“受膏者”。
    reason: alternative_reading
  - marker: b
    text: “从死者中”也可译作“从死人中间”，原文含有从众死者当中出来的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: γέγραπται
  choice: 经上……记着
  rationale: 完成时被动语态在这里是引用圣经的惯用表达，表示所写的话至今仍然有效；“经上记着”是自然、庄重的现代汉语。
- source_word: παθεῖν
  choice: 要受苦
  rationale: 不定式说明经上所记的内容。“要受苦”在汉语中自然表达预告，而没有明确加入原文此处未出现的“必须”。
- source_word: τὸν χριστόν
  choice: 弥赛亚
  rationale: 定冠词表明 Χριστός 在此作为称号使用；“弥赛亚”保留其犹太圣经中“受膏者”的背景。
- source_word: ἀναστῆναι
  choice: 复活
  rationale: 该主动不定式在此作不及物用，意为起来、复活；汉语“复活”自然表达主动事件，不改写为“被复活”。
- source_word: ἐκ νεκρῶν
  choice: 从死者中
  rationale: 保留介词 ἐκ 的“从……中出来”以及 νεκρῶν 的复数、集合性含义，同时使用庄重自然的“死者”。
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: 在第三天
  rationale: 准确表达时间与格的功能，是现代汉语自然说法。
- source_word: οὕτως
  choice: 这样
  rationale: 既可承接上下文，也可引出经上所记的具体内容，保留原文对方式或内容的指示作用。
- source_word: ὅτι
  choice: 冒号
  rationale: ὅτι 引出所记内容；汉语在“经上这样记着”之后用冒号，比重复添加连接词更自然清楚。
theological_decisions:
- issue: 受难—复活概述中 Χριστός 的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处有定冠词，明显是称号；“弥赛亚”突出圣经应许和受膏君王的背景，同时脚注保留传统译法。
- issue: 复活动词 ἀναστῆναι 的语态
  choice: 从死者中复活
  alternative: 从死者中被复活
  rationale: 原文是主动形式，并可作不及物动词理解，因此正文不改为被动。新约其他经文也可说耶稣“被复活”，但本节应保留自身的表达。
- issue: παθεῖν 是否包含明确的必然性
  choice: 要受苦
  alternative: 必须受苦
  rationale: 本句的不定式陈述经上所记的内容，原文此处没有 δεῖ 一类明确表示“必须”的词，因此不在正文中加强其情态。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“经上这样记着”保留引用圣经的正式语气；“受苦”“复活”采用读者熟悉的圣经用语，但句法保持自然。脚注标记均置于所说明的词语之后。
