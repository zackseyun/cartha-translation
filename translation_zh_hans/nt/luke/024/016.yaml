  text: οἱ δὲ ὀφθαλμοὶ αὐτῶν ἐκρατοῦντο τοῦ μὴ ἐπιγνῶναι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/016.yaml
  text: But their eyes were kept from recognizing him[a].
translation:
  language: zh_hans
  text: 但他们的眼睛被遮住了，以致认不出他来[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们的眼睛被拦阻，不能认出他”，或“他们被阻止认出他。”希腊文没有说明施事者是谁。
    reason: 说明被动动词的替代译法，并保留原文未指明施事者的含义。
lexical_decisions:
- source_word: δὲ
  choice: 但
  rationale: δέ在这里是较弱的连接词，同时形成叙事上的反差：耶稣虽与他们同行，他们却没有认出他。
- source_word: οἱ ὀφθαλμοὶ αὐτῶν
  choice: 他们的眼睛
  rationale: 保留希腊文具体的身体意象，不将其抽象改写为“他们”。
- source_word: ἐκρατοῦντο
  choice: 受到蒙蔽
  rationale: 此处被动形式表示他们的视觉或辨认能力受到某种限制；这一表达在现代汉语中自然，并且不明说施事者。
- source_word: τοῦ μὴ ἐπιγνῶναι
  choice: 认不出
  rationale: ἐπιγινώσκω在以马忤斯叙事语境中指辨认、认出某人的身份；汉语用结果补语“认不出”自然表达受阻的结果。
- source_word: αὐτόν
  choice: 他
  rationale: 指上下文中的耶稣；按汉语自然表达译为“他”。
theological_decisions:
- issue: 是否明确指出是谁使他们不能认出耶稣
  choice: 保留未说明施事者的表达：“他们的眼睛受到蒙蔽”
  alternative: 明确译为“上帝蒙蔽了他们的眼睛”，或弱化为“他们没有认出他”
  rationale: 希腊文使用被动语态，却没有说明施事者。译文不明确归因于上帝，也不把受外力限制的意味完全删去，从而保留原文的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“受到蒙蔽”比逐字译作“被拘住”自然，同时保留“眼睛”这一具体意象和未明说施事者的被动结构。
