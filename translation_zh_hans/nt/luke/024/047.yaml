  text: καὶ κηρυχθῆναι ἐπὶ τῷ ὀνόματι αὐτοῦ μετάνοιαν ⸀καὶ ἄφεσιν ἁμαρτιῶν εἰς πάντα τὰ ἔθνη— ⸀ἀρξάμενοι ἀπὸ Ἰερουσαλήμ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/047.yaml
  text: and that repentance for the forgiveness of sins should be proclaimed in his name to all the nations[b][a], beginning from Jerusalem.
translation:
  language: zh_hans
  text: 并且要奉他的名向万国宣讲悔改、罪得赦免的信息[a][b]，从耶路撒冷开始。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“宣讲悔改以得罪的赦免。”希腊文也可理解为悔改与罪得赦免两个并列、彼此关联的宣讲内容。
    reason: alternative_reading
  - marker: b
    text: “万国”一词在某些语境中也可指“外邦人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: κηρυχθῆναι
  choice: 宣讲
  rationale: 表达公开传扬、宣告信息的含义，同时不把行动局限于正式讲道场合。被动不定式在本句经文应验的语境中具有“要被宣讲”的意味；汉语以“人要……宣讲”自然呈现。
- source_word: ἐπὶ τῷ ὀνόματι αὐτοῦ
  choice: 奉他的名
  rationale: 这是现代汉语中自然且庄重的表达，保留以耶稣的身份、权柄和名义为根据的含义。
- source_word: μετάνοιαν
  choice: 悔改
  rationale: 这是 μετάνοια 的标准且自然的汉语译法，包含思想与生命转向之意，不宜弱化为仅仅“改变想法”。
- source_word: ἄφεσιν ἁμαρτιῶν
  choice: 使罪得赦免
  rationale: ἄφεσις 在此指罪被释放、宽免。“使罪得赦免”自然表达悔改与赦罪之间的紧密联系，但不进一步规定完整的救恩次序。
- source_word: εἰς πάντα τὰ ἔθνη
  choice: 向万国
  rationale: εἰς 表示宣讲所指向的对象；ἔθνη 在此强调普世范围。“万国”简洁庄重，也不把所指仅限于非犹太人。
- source_word: ἀρξάμενοι ἀπὸ Ἰερουσαλήμ
  choice: 从耶路撒冷开始
  rationale: 清楚保留 ἀπό 所指的起点，并以自然现代汉语表达分词结构。
theological_decisions:
- issue: 悔改与赦罪在所宣讲信息中的关系
  choice: 译作“宣讲悔改，使罪得赦免”
  alternative: 译作“宣讲悔改和罪得赦免”，将两项视为并列内容
  rationale: 希腊文 μετάνοιαν καὶ ἄφεσιν ἁμαρτιῶν 可理解为两个并列宾语，也可按语义将悔改与赦罪紧密相连。正文采用后者以求汉语自然，同时用脚注保留并列解读，避免把经文扩展为更细密的教义次序。
- issue: ἔθνη 的范围
  choice: 万国
  alternative: 外族人／外邦人
  rationale: 复活后的使命语境强调普世范围。“万国”保留原词的民族、列国含义，并包含外邦人而不将对象缩窄为非犹太人。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“奉他的名”保留经文的权柄与根据意味；“向万国”体现普世使命。正文保持简洁，并以脚注保存希腊文在悔改与赦罪关系及 ἔθνη 词义上的真实歧义。
