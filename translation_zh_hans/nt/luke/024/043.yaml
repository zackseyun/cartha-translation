  text: καὶ λαβὼν ἐνώπιον αὐτῶν ἔφαγεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/043.yaml
  text: And taking it[a], he ate it before them.
translation:
  language: zh_hans
  text: 他接过来，就在他们面前吃了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文只说“接过”和“吃了”，宾语由上一节所说的那片鱼补足。
    reason: 说明原文省略了可由上文推知的宾语。
lexical_decisions:
- source_word: καὶ
  choice: 就
  rationale: 承接上一节并自然推进叙事；此处“就”表达紧接着发生的动作，不额外强化时间含义。
- source_word: λαβὼν
  choice: 接过来
  rationale: 该词为λαμβάνω的不定过去主动分词，表示先于主要动词发生的动作。中文“接过来”自然地承接上一节递给他的那片烤鱼；宾语仍由语境补足。
- source_word: ἐνώπιον αὐτῶν
  choice: 在他们面前
  rationale: 准确表达事情发生在众人眼前，保留此动作可由他们亲眼见证的意味。
- source_word: ἔφαγεν
  choice: 吃了
  rationale: 该词为ἐσθίω的不定过去陈述语气，叙述一次完成的吃食动作。现代汉语可依上下文省略宾语，既自然，也贴近希腊文未明说宾语的形式。
theological_decisions:
- issue: 是否明说分词和主要动词所隐含的宾语
  choice: 正文不明说宾语，以“接过来……吃了”由上一节补足所指，并用脚注说明
  alternative: “他接过那片鱼，就在他们面前吃了。”
  rationale: 希腊文只说“拿了/接过”和“吃了”，宾语由上一节的鱼片自然补足。中文允许这种省略，因此无需在正文中把“那片鱼”写明；这样既保持自然，也不消除原文的省略，同时仍清楚呈现复活后的耶稣当着门徒吃东西这一叙事事实。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“接过来”比直译为“拿了”更符合上一节有人递给他的场景；“在他们面前”清楚保留亲眼见证的叙事重点。
