  text: καὶ αὐτοὶ ἐξηγοῦντο τὰ ἐν τῇ ὁδῷ καὶ ὡς ἐγνώσθη αὐτοῖς ἐν τῇ κλάσει τοῦ ἄρτου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/035.yaml
  text: And they themselves were recounting the things that had happened on the road[b][a], and how he was made known to them in the breaking of the bread.
translation:
  language: zh_hans
  text: 他们也讲述了路上发生的事，以及耶稣怎样在掰饼时被他们认出来。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“耶稣怎样在掰饼时向他们显明。”希腊原文使用被动形式，既可着重他们认出了他，也可着重他向他们显明。
    reason: alternative_reading
  - marker: b
    text: “在掰饼时”也可译作“在掰开那饼时”。原文有定冠词，可能特指刚才那一餐的饼；这一表达也可以较一般地理解。
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ
  choice: 他们也
  rationale: 显式代词带有承接和对照作用；现代汉语用“他们也”自然地表明这两位门徒接着亲自讲述，无须生硬译作“他们自己”。
- source_word: ἐξηγοῦντο
  choice: 讲述了
  rationale: 该动词在此指有条理地叙说所经历的事；“讲述”自然庄重，也不误解为正式释义。希腊语未完成时所呈现的叙述过程，在汉语中由语境即可体现。
- source_word: τὰ ἐν τῇ ὁδῷ
  choice: 路上发生的事
  rationale: 原文是省略式表达，直译为“路上的事”；补出“发生”符合上下文，也使现代汉语清楚自然。
- source_word: ὡς
  choice: 怎样
  rationale: 既可引出事情的方式，也可引出报告内容；“怎样”保留方式层面的含义。
- source_word: ἐγνώσθη αὐτοῖς
  choice: 让他们认了出来
  rationale: 以使役结构保留希腊语被动式中“他向他们显明/被他们认出”的张力，同时符合现代汉语表达。
- source_word: ἐν τῇ κλάσει τοῦ ἄρτου
  choice: 在掰饼时
  rationale: “掰饼”准确表达动作，“在……时”自然传达ἐν在事件性名词短语中的时间意义；不预先把此处定性为专门礼仪。
theological_decisions:
- issue: ἐγνώσθη是只表达门徒认出耶稣，还是也暗示耶稣被显明给他们
  choice: 耶稣怎样……让他们认了出来
  alternative: 他们怎样认出了耶稣
  rationale: 所选译法保留被动式可能包含的显明意味，又不把它明确断定为神性被动；替代译法更偏重人的认知行动。
- issue: “掰饼”是否应直接解释为圣餐礼仪
  choice: 保留叙事性的“掰饼”
  alternative: 在举行圣餐时
  rationale: 原文只说掰饼，虽可能产生礼仪联想，却未在本句中明确作此解释，因此不导入宗派性结论。
translation_notes:
  register: 采用现代、自然而庄重的叙事语体。“耶稣”补明原文省略的主语，以免汉语产生指代不清；脚注保留被动式和定冠词所涉及的真实歧义。
