  yaml_path: translation/nt/luke/024/003.yaml
  text: But when they entered[a], they did not find the body.
translation:
  language: zh_hans
  text: 她们进去后，却没有找到身体。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“主耶稣的身体”。
    reason: textual_variant
lexical_decisions:
- source_word: εἰσελθοῦσαι
  choice: 她们进去后
  rationale: 不定过去时主动分词，阴性复数，承接上文的妇女；译作时间背景“进去后”，符合现代汉语叙事习惯。
- source_word: δὲ
  choice: 却
  rationale: δέ在此推进叙事并带轻微转折；“却”自然突出她们进入坟墓后所遇到的意外情况。
- source_word: οὐχ εὗρον
  choice: 没有找到
  rationale: 准确表达否定的不定过去时动词，并保持简洁自然的叙事语气。
- source_word: τὸ σῶμα
  choice: 那身体
  rationale: σῶμα的基本义是“身体”；定冠词结合上文语境表明所指对象已知，译作“那身体”既保留原文没有明说归属的特点，也避免使用带有额外色彩的“尸体”。
theological_decisions:
- issue: 是否明确说是谁的身体
  choice: 那身体
  alternative: 主耶稣的身体
  rationale: 所给SBLGNT正文仅作τὸ σῶμα，没有“主耶稣的”；正文采用较短读法，不把部分抄本的扩充写入正文，同时以脚注说明异文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“她们”承接上文妇女；“进去后，却……”流畅表达分词结构和轻微转折。正文中的[a]与脚注对应。
