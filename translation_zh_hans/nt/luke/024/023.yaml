source:
  edition: SBLGNT
  text: καὶ μὴ εὑροῦσαι τὸ σῶμα αὐτοῦ ἦλθον λέγουσαι καὶ ὀπτασίαν ἀγγέλων ἑωρακέναι, οἳ λέγουσιν αὐτὸν ζῆν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/023.yaml
  text: and not finding his body[a], they came saying that they had also seen a vision of angels[b], who say that he is alive.
translation:
  language: zh_hans
  text: 她们没有找到他的身体[a]，就回来报告说，她们还看见了天使显现的异象[b]；那些天使说，他活着。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 一种极不可能的句法理解是：“她们就回来报告说，她们看见了天使显现的异象，也说他活着。”这种理解把“说他活着”的主语视为妇女，而非天使；但关系代词为阳性复数，与妇女并不相称。
    reason: alternative_reading
  - marker: b
    text: 或译：“甚至看见了天使显现的异象”。
    reason: alternative_rendering
lexical_decisions:
- source_word: μὴ εὑροῦσαι τὸ σῶμα αὐτοῦ
  choice: 她们没有找到他的身体
  rationale: 以自然的汉语时序表达修饰这些妇女的过去时主动分词，并直接保留否定；σῶμα在埋葬与复活的语境中取通常意义“身体”.
- source_word: ἦλθον λέγουσαι
  choice: 便来，说
  rationale: ἦλθον直译为“来”，不把上下文所暗示的“回来”写入正文；λέγουσαι以伴随动作“说”表达。
- source_word: καὶ ὀπτασίαν ἀγγέλων ἑωρακέναι
  choice: 还看见了天使的异象
  rationale: 第二个καί表示在没有找到身体之外又有一项报告，以“还”自然表达；ὀπτασία指超自然的所见，用“异象”既简洁又保留其特殊性质；完成时不定式在间接引语中以“看见了”表达。
- source_word: οἳ λέγουσιν αὐτὸν ζῆν
  choice: 那些天使说，他活着
  rationale: 阳性复数关系代词最自然地以邻近的“天使”为先行词；λέγουσιν的现在时译为“说”，αὐτὸν ζῆν自然译作“他活着”。
theological_decisions:
- issue: 关系从句οἳ λέγουσιν的所指
  choice: 正文将其理解为天使：“那些天使说，他活着。”
  alternative: 较不可能的理解是关系代词指那些妇女，即“她们来，说……她们说他活着”。
  rationale: οἳ为阳性复数，最近且最自然的先行词是ἀγγέλων（天使）；这也是句法上的首选，但脚注保留另一种较不可能的分析。
- issue: αὐτὸν ζῆν所表达的宣告
  choice: 他活着
  alternative: 他仍活着／他已经复活
  rationale: “他活着”直接保留希腊文ζῆν的表述，不将其扩写为更明确的神学解释“已经复活”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“异象”准确传达超自然所见，又不额外说明其形式；用“那些天使”明确关系从句的通常所指，避免汉语中主语含混。
