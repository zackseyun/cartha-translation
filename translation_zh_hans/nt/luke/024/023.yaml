    issue: “便来，说”句法生硬
    rationale: 汉语中“来”后直接以逗号接“说”不自然，且缺乏“来”所指的语境落点。改为“回来报告说”可自然表达从坟墓处返回并陈述的动作。
  - severity: medium
    issue: “天使的异象”存在属格歧义
    rationale: 这句话可被理解为天使自己所见的异象，而ὀπτασίαν ἀγγέλων指妇女所见、其中有天使显现的异象。
  - severity: low
