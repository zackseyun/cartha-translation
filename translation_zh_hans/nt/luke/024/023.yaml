  rationale: 修正不自然的动作衔接，并消除“天使的异象”的汉语属格歧义。保留第二个καί的附加／加强意味为“还”，并在脚注保留“甚至”的可能译法。关系从句在正文中明确指向天使；脚注以审慎措辞保留英文审校轨迹中的替代分析，而不将其呈现为同等可行的语法选择。
