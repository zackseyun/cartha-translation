  source_fidelity: 正文对未找到身体、天使异象及“他活着”的内容基本忠实。但“便来，说”不合现代汉语的自然句法；“天使的异象”也可能被误解为“天使所见的异象”，宜明确为天使显现于异象中。脚注a所述妇女作οἳ先行词的可能性极低，且与阳性复数关系代词不相称；为忠实保留英文审校轨迹，可仍标为极不可能的替代理解，但须说明其语法困难。
  naturalness: “回来报告说”自然表达叙事语境中的ἦλθον λέγουσαι，未改变其报告行为。“看见了天使显现的异象”避免属格歧义，语体庄重而现代。
  terminology: “身体”“天使”“异象”“活着”均恰当；不把ζῆν扩译为“复活”。
  issues:
