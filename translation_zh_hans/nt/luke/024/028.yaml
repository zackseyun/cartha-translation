  text: Καὶ ἤγγισαν εἰς τὴν κώμην οὗ ἐπορεύοντο, καὶ αὐτὸς ⸀προσεποιήσατο ⸀πορρώτερον πορεύεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/028.yaml
  text: And they came near to the village where they were going[a], and he acted as though he were going farther.
translation:
  language: zh_hans
  text: 他们走近了所要去的村庄，耶稣作出要往更远处去的样子。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“耶稣假装要往更远处去”，或“耶稣作出要继续前行的样子。”
    reason: προσεποιήσατο可指“假装”或“作出……的样子”；脚注保留较直接及较中性的可行译法。
lexical_decisions:
- source_word: ἤγγισαν
  choice: 走近了
  rationale: 表达不定过去时所叙述的临近动作，现代汉语自然，也保留向目的地靠近的动态感。
- source_word: κώμην
  choice: 村庄
  rationale: κώμη通常指规模小于城市的聚落，“村庄”符合其常见新约用法。
- source_word: οὗ ἐπορεύοντο
  choice: 要去的那个
  rationale: 关系副词οὗ与未完成时ἐπορεύοντο共同指向他们旅程中的目的地；这样表达简洁自然，并保留目的地含义。
- source_word: προσεποιήσατο
  choice: 作出……的样子
  rationale: 该词表示使人看起来像是要做某事；这一译法保留叙事中的表象，又不以“假装”预先强化欺骗意味。
- source_word: πορρώτερον
  choice: 继续往前
  rationale: 比较级副词表示去得更远；结合行路语境，“继续往前”比直译“更远”更符合现代汉语表达。
- source_word: πορεύεσθαι
  choice: 还要……走
  rationale: 不定式补足προσεποιήσατο所呈现的动作；“还要继续往前走”清楚传达他似乎要越过村庄继续行程。
theological_decisions:
- issue: 如何表达προσεποιήσατο所描述的耶稣的行动
  choice: 作出还要继续往前走的样子
  alternative: 假装还要继续往前走
  rationale: 原文描述耶稣给人一种将继续前行的印象，但并未在此明确评断其意图或道德性质。正文避免把“欺骗”的较强含义直接写入，同时由脚注保留较直接的词义选择和叙事张力。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。正文明确以“耶稣”指代αὐτός，避免连续代词在汉语中造成所指不清；“却”呈现叙事转折，但不额外解释其动机。
