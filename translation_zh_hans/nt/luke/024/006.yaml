source:
  edition: SBLGNT
  text: ⸂οὐκ ἔστιν ὧδε, ἀλλὰ ἠγέρθη.⸃ μνήσθητε ὡς ἐλάλησεν ὑμῖν ἔτι ὢν ἐν τῇ Γαλιλαίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/006.yaml
  text: He is not here[a], but has been raised. Remember how he spoke to you while he was still in Galilee,
translation:
  language: zh_hans
  text: 他不在这里，而是已经被复活了。[a][b]你们要记得，他还在加利利的时候怎样对你们说过：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“已经复活了。”希腊文动词为被动式，直译可作“已经被复活了”，暗含使他复活的行动者，但没有明说。
    reason: 说明复活动词的被动语态及自然汉语的另一译法。
  - marker: b
    text: 有些古抄本没有“他不在这里，而是已经被复活了”这句话。
    reason: SBLGNT以异文范围符号标出这句话存在重要抄本差异。
lexical_decisions:
- source_word: οὐκ ἔστιν ὧδε
  choice: 他不在这里
  rationale: 希腊文省略主语，但上下文明确指耶稣；现代汉语补出“他”更自然。“这里”准确表达地点副词ὧδε。
- source_word: ἀλλὰ
  choice: （以逗号衔接前后对比）
  rationale: ἀλλά标明强烈转折。汉语在“他不在这里，已经被复活了”这一简短宣告中，用逗号并列否定与相反事实，已能自然传达“不是在这里，而是已复活”的对比；若直译“而是”则与被动结构衔接较生硬。
- source_word: ἠγέρθη
  choice: 已经被复活了
  rationale: 以“被”保留不定过去时被动语态，并用“已经……了”表达已经发生、对当前仍有意义的复活事实；这样也保留了行动者未明说而可理解为上帝的含义。
- source_word: μνήσθητε
  choice: 你们要记得
  rationale: 直接表达不定过去时中间语态命令式的劝令语气，比单说“记得”更符合现代汉语经文语体。
- source_word: ὡς ἐλάλησεν ὑμῖν
  choice: 怎样对你们说
  rationale: ὡς在这里引出所回想之言及其情形；“怎样对你们说”既保留“怎样”，又自然引向下一节所引述的内容。
- source_word: ἔτι ὢν ἐν τῇ Γαλιλαίᾳ
  choice: 他还在加利利的时候
  rationale: 将分词结构自然转为时间从句；“还”保留ἔτι的“仍然、尚且”之意，“加利利”采用通行地名译法。
theological_decisions:
- issue: 复活动词ἠγέρθη的语态
  choice: 已经被复活了
  alternative: 已经复活了
  rationale: 主文保留希腊文被动语态，不明确补出行动者，既呈现复活事件，也保留暗含上帝行动的神学意味；脚注提供更自然但不显被动语态的汉语译法。
- issue: ἀλλά所表达的否定—转折关系
  choice: 用汉语标点和相邻分句表达对比
  alternative: 他不在这里，而是已经被复活了
  rationale: 不改变“不在这里”与“被复活”之间的鲜明对照，同时避免“而是已经被复活了”在现代汉语中的生硬感。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“已经被复活了”略带非日常语感，是为保留原文被动语态；其自然汉语替代译法列入脚注。句末用冒号，因为下一节接续耶稣先前所说的话。
