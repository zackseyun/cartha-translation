  text: Ἐξήγαγεν δὲ αὐτοὺς ⸀ἕως ⸀πρὸς Βηθανίαν, καὶ ἐπάρας τὰς χεῖρας αὐτοῦ εὐλόγησεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/050.yaml
  text: Then he led them out as far as Bethany[a], and lifting up his hands, he blessed them.
translation:
  language: zh_hans
  text: 随后，他领他们出去，直到伯大尼附近[a]；他举起双手，祝福他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“到伯大尼”或“朝伯大尼那边”；希腊原文的表达较为完整，直译近似“直到朝向伯大尼之处”。
    reason: 保留ἕως πρὸς Βηθανίαν在到达范围、朝向和邻近位置之间的语义余地。
lexical_decisions:
- source_word: Ἐξήγαγεν
  choice: 领……出去
  rationale: ἐξάγω表示领出或带出；“领……出去”自然保留了动词的引导和向外移动之意。主语按上下文为耶稣。
- source_word: δὲ
  choice: 随后
  rationale: δὲ在这里推动叙事，并无强烈转折；“随后”清楚表达事件的承接。
- source_word: ἕως πρὸς Βηθανίαν
  choice: 直到伯大尼附近[a]
  rationale: ἕως πρὸς这一较完整的表达兼有到达范围和朝向某地之意。“直到伯大尼附近”在现代汉语中自然，也避免断言他们必定进入村内；脚注保留其他可能译法。
- source_word: Βηθανίαν
  choice: 伯大尼
  rationale: 采用现代中文圣经传统中通行的地名译法。
- source_word: ἐπάρας
  choice: 举起
  rationale: ἐπαίρω的不定过去时分词表示先行或伴随主句的动作；中文用“举起”简洁自然，并保留祝福时的身体姿态。
- source_word: τὰς χεῖρας αὐτοῦ
  choice: 双手
  rationale: 原文为复数“他的手”；中文“举起双手”已自然表达所属关系，并保留复数所描绘的姿态。
- source_word: εὐλόγησεν
  choice: 祝福
  rationale: εὐλογέω在此指耶稣向门徒施行祝福。“祝福”是准确而简明的对应，不额外加入礼仪性解释。
- source_word: αὐτούς
  choice: 他们
  rationale: 直接指代上下文中的门徒。
theological_decisions:
- issue: 耶稣祝福门徒这一行动的性质
  choice: 保留简洁表述“祝福他们”
  alternative: “为他们宣告祝福”或“给他们祝圣”
  rationale: 原文只陈述耶稣举手祝福门徒，并未规定具体礼仪形式或祭司性类别。简洁译法既不把它弱化为一般祝愿，也不加入后来的教会术语。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“随后”衔接前文；分号保留两个紧密相连的动作。“举起双手”符合自然汉语，也忠实呈现原文的复数形式。
