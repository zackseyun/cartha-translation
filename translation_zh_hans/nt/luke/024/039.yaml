id: LUK.24.39
reference: Luke 24:39
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἴδετε τὰς χεῖράς μου καὶ τοὺς πόδας μου ὅτι ⸂ἐγώ εἰμι αὐτός⸃· ψηλαφήσατέ με καὶ ἴδετε, ὅτι πνεῦμα σάρκα καὶ ὀστέα οὐκ ἔχει καθὼς ἐμὲ θεωρεῖτε ἔχοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/039.yaml
  text: Look at my hands and my feet[a], that it is I myself. Touch me and see[d][c][b], because a spirit does not have flesh and bones as you see that I have.
translation:
  language: zh_hans
  text: 你们看我的手和脚，就知道是我本人[a]。摸摸我，看看吧[b]；灵[c]没有肉和骨头，正如你们看见我有肉和骨头一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “就知道是我本人”也可译作“因为就是我本人”。希腊文在此强调“我”与“本人”的身份。
    reason: 保留第一个ὅτι可按内容／结果或因果理解的可能，并说明ἐγώ与αὐτός的强调作用。
  - marker: b
    text: “摸摸”也可译作“触摸查验”。
    reason: 说明ψηλαφάω不只是轻触，也可包含用手实际查验的意思。
  - marker: c
    text: “灵”在此也可按语境译作“灵体”或“鬼魂”。
    reason: 保留πνεῦμα在该语境中的可能表达，同时避免正文采用文化色彩较强的解释性词语。
lexical_decisions:
- source_word: ἴδετε
  choice: 看／仔细看看
  rationale: 不定过去时命令式复数，要求门徒当下亲眼察看；首处译“看”，次处结合触摸验证的语境译“仔细看看”，自然表达观察之意。
- source_word: τὰς χεῖράς μου καὶ τοὺς πόδας μου
  choice: 我的手和脚
  rationale: 直接保留具体的身体部位，突出眼前这位与耶稣本人的连续身份；不在正文中补入经文未明说的伤痕。
- source_word: ὅτι ἐγώ εἰμι αὐτός
  choice: 就知道确实是我本人
  rationale: ὅτι可引出察看的内容或结果；ἐγώ与αὐτός共同加强身份强调。此译在现代汉语中通顺，并保留“我本人”的强调。
- source_word: ψηλαφήσατέ με
  choice: 摸摸我
  rationale: 该动词表示以触摸、摸索来查验；“摸摸我”比“触碰我”更自然，也能表达实际触验。
- source_word: πνεῦμα
  choice: 灵
  rationale: 采用该词最直接的对应语，保留其可指非物质灵体的语义，不径自限定为民间观念中的“鬼魂”。
- source_word: σάρκα καὶ ὀστέα
  choice: 肉和骨头
  rationale: 按此处具体身体意义翻译；“肉和骨头”是普通现代汉语自然、清楚的说法。
- source_word: καθὼς ἐμὲ θεωρεῖτε ἔχοντα
  choice: 你们看，我却有
  rationale: θεωρεῖτε含观察、看见之意；将分词结构转成自然汉语分句，并以“却”显明灵所没有与耶稣所有之间的对照。
theological_decisions:
- issue: 复活后的耶稣是否以真实身体临在
  choice: 保留“摸”“肉和骨头”等明确的身体语言
  alternative: 以较抽象的措辞弱化身体与灵之间的对照
  rationale: 原文借视觉、触觉及“肉和骨头”明确强调可验证的身体实在；译文不加教义解释，也不淡化原文的身体性。
- issue: ὅτι ἐγώ εἰμι αὐτός的句法关系
  choice: 译作“就知道确实是我本人”，理解为察看所要确认的内容或结果
  alternative: 译作“因为就是我本人”，将ὅτι理解为因果连接词
  rationale: 两种分析在语法上均有可能；上下文重点是借手脚确认身份。正文采用较自然的现代汉语内容／结果表达，并在脚注保留另一种理解。
- issue: πνεῦμα在本节的指称
  choice: 译作“灵”
  alternative: 译作“鬼魂”
  rationale: “灵”更贴近希腊词本身，也保存语义宽度；上下文已清楚表明这里指没有肉和骨头的灵体，无须在正文中过度具体化。
translation_notes:
  register: 采用现代、庄重而口语可懂的普通话。“摸摸我”符合面对门徒说话的直接语气；“仔细看看”与“你们看，我却有”清楚呈现视觉和触觉的双重查验。正文所有脚注标记均已对应列出。
