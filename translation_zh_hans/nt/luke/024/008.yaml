lexical_decisions:
- source_word: καὶ
  choice: 就
  rationale: 承接前文叙事，并自然表达在听见提醒之后发生的反应；不额外强化超出语境的时间含义。
- source_word: ἐμνήσθησαν
  choice: 想起了
  rationale: 该动词在此为形式上的中间/被动、意义主动，表示记起先前听过的内容；“想起了”符合现代汉语叙事表达。
- source_word: τῶν ῥημάτων
  choice: 所说的话
  rationale: ῥήματα在这里指先前说出的言语或话语。“所说的话”比单独译作“话”更清楚地保留其口语内容指向，同时不把它限定为格言式的“言论”。
- source_word: αὐτοῦ
  choice: 他
  rationale: 保留希腊文代词形式；其所指由上下文确定为耶稣，无须在正文中明说名字。
