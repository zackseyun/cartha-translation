  text: And behold[a], two of them were going that very day to a village sixty stadia from Jerusalem, whose name was Emmaus,
translation:
  language: zh_hans
  text: 看哪，就在那一天，他们中有两个人正前往一个离耶路撒冷六十斯塔迪昂[a]、名叫以马忤斯的村庄。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “斯塔迪昂”是古代的长度单位；六十斯塔迪昂约为11公里。
    reason: cultural_note
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: 看哪
  rationale: 保留路加用来引起读者注意的叙事标记；现代汉语中略带庄重色彩，但含义清楚。句首的 καί 不必机械译作“并且”，其承接作用由上下文和语序自然表达。
- source_word: δύο ἐξ αὐτῶν
  choice: 他们中有两个人
  rationale: 自然表达部分属格，指前文所涉群体中的两人，不额外限定他们的身份。
- source_word: ἐν αὐτῇ τῇ ἡμέρᾳ
  choice: 就在那一天
  rationale: “就在”体现 αὐτῇ 的强调，表明事情发生在前文所指的同一天。
- source_word: ἦσαν πορευόμενοι
  choice: 正前往
  rationale: “正”传达迂回未完成时结构所表示的持续进行状态；“前往”简洁而庄重。
- source_word: εἰς κώμην
  choice: 前往一个村庄
  rationale: κώμη 明确指村庄；“前往”符合汉语移动表达。
- source_word: ἀπέχουσαν σταδίους ἑξήκοντα ἀπὸ Ἰερουσαλήμ
  choice: 那村庄离耶路撒冷六十斯塔迪昂
  rationale: 正文保留原文的古代距离单位，并在脚注给出现代约数；拆成分句可使修饰关系在汉语中清楚自然。
- source_word: ᾗ ὄνομα Ἐμμαοῦς
  choice: 名叫以马忤斯
  rationale: 准确而自然地表达“其名为以马忤斯”的关系结构，并采用通行的中文地名译法。
