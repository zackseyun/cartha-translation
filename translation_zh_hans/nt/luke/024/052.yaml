  text: καὶ αὐτοὶ ⸂[προσκυνήσαντες αὐτὸν]⸃ ὑπέστρεψαν εἰς Ἰερουσαλὴμ μετὰ χαρᾶς μεγάλης,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/052.yaml
  text: And they[a], after worshiping him, returned to Jerusalem with great joy[b],
translation:
  language: zh_hans
  text: 他们敬拜他[a][b]之后，带着极大的喜乐回到耶路撒冷。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本没有“敬拜他之后”。
    reason: textual_variant
  - marker: b
    text: “敬拜他”也可译作“俯伏在他面前”或“向他致敬”。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: 就
  rationale: 承接前文并推动叙事；现代汉语用“就”可自然表达随后的行动，不必机械译出“和”。
- source_word: αὐτοὶ
  choice: 他们
  rationale: 明示复数主语；不译成“他们自己”，以免在现代汉语中过度强调。
- source_word: προσκυνήσαντες αὐτόν
  choice: 敬拜了他之后
  rationale: 将不定过去时分词表达为先于主句动作发生的行动；复活与升天语境支持“敬拜”，同时以脚注保留“俯伏在他面前”的词义可能。
- source_word: ὑπέστρεψαν
  choice: 回到
  rationale: 准确表达返回先前地点的动作，与目的地“耶路撒冷”搭配自然。
- source_word: εἰς Ἰερουσαλήμ
  choice: 到耶路撒冷
  rationale: 符合现代汉语表达前往并抵达城市的习惯。
- source_word: μετὰ χαρᾶς μεγάλης
  choice: 满怀极大的喜乐
  rationale: 保留χαρά的“喜乐”及μεγάλης的强化意义；“满怀”自然表达伴随的内在状态。
theological_decisions:
- issue: 复活后的耶稣是προσκυνέω所指向的对象
  choice: 敬拜了他
  alternative: 俯伏在他面前／向他致敬
  rationale: 本段复活与升天的语境使“敬拜”最能体现此举的分量，但该动词本身也可指俯伏或致敬，因此在脚注中保留词义张力。
- issue: 校勘本中带有不确定标记的προσκυνήσαντες αὐτόν
  choice: 正文保留，并加文本异文脚注
  alternative: 正文省略
  rationale: 短语出现在所给SBLGNT正文中，但有抄本证据不确定性；保留正文并明确注明异文，兼顾底本与可审核性。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“满怀极大的喜乐”兼顾可读性与原文强调；正文和全部脚注标记一一对应。
