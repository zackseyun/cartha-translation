  text: καὶ ἐγένετο ἐν τῷ ⸀ἀπορεῖσθαι αὐτὰς περὶ τούτου καὶ ἰδοὺ ἄνδρες δύο ἐπέστησαν αὐταῖς ἐν ⸂ἐσθῆτι ἀστραπτούσῃ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/004.yaml
  text: And it happened[a], while they were perplexed about this, that behold, two men stood by them in dazzling clothing.
translation:
  language: zh_hans
  text: 正当她们为这事困惑不解时，忽然有两个男子站在她们身旁，身穿耀眼的衣服[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或更直译为：“身穿闪电般发亮的衣服。”
    reason: 保留ἀστραπτούσῃ所含的闪电意象，供读者了解更贴近原文的表达。
lexical_decisions:
- source_word: ἐγένετο
  choice: （融入“……的时候，忽然……”这一叙事结构）
  rationale: 这是路加常用的叙事引入语。汉语若直译为“事情发生了”会显得生硬，因此以时间从句和突发转折自然表达其叙事功能。
- source_word: ἐν τῷ ἀπορεῖσθαι αὐτὰς περὶ τούτου
  choice: 她们正为这事困惑不解的时候
  rationale: ἐν加冠词不定式在此表示同时发生；ἀπορέω指不知如何理解或应对，而不只是感到好奇。“困惑不解”准确传达这种茫然。
- source_word: ἰδοὺ
  choice: 忽然
  rationale: 此处作为叙事提示语，引人注意一个出人意料的新情景。现代汉语用“忽然”能自然保留其突发感；这不是把该词单纯等同于时间副词，而是按其篇章功能翻译。
- source_word: ἄνδρες δύο
  choice: 两个人
  rationale: 原文把这两位描述为男性人物，但现代汉语的“两个男人”在此容易产生不必要的口语色彩。“两个人”符合自然叙述，并未提前明说他们是天使。
- source_word: ἐπέστησαν αὐταῖς
  choice: 站在她们身旁
  rationale: ἐφίστημι在这里表示来到近旁并站在那里；该译法保留空间意义，不把它解释性地改成“向她们显现”。
- source_word: ἐν ἐσθῆτι ἀστραπτούσῃ
  choice: 身穿耀眼的衣服
  rationale: ἐσθής指衣服，ἀστράπτω带有像闪电一样发亮的鲜明意象。正文采用自然简洁的“耀眼”，脚注保留更贴近字面的闪电意象。
theological_decisions:
- issue: 两位人物的身份
  choice: 正文只称“两个人”
  alternative: 两位天使
  rationale: 虽然上下文表明他们是天上的使者，本节原文却以ἄνδρες称呼他们。译文不从邻近经文提前引入“天使”这一身份说明。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“忽然”承接本节的突发转折；脚注标记置于其实际说明的“耀眼的衣服”之后。
