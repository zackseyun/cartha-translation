  text: ἐμφόβων δὲ γενομένων αὐτῶν καὶ κλινουσῶν ⸂τὰ πρόσωπα⸃ εἰς τὴν γῆν εἶπαν πρὸς αὐτάς· Τί ζητεῖτε τὸν ζῶντα μετὰ τῶν νεκρῶν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/005.yaml
  text: And when they became terrified and bowed their faces to the ground[a], they said to them, “Why are you seeking the living one among the dead?”
translation:
  language: zh_hans
  text: 她们惊恐起来，把脸伏在地上；他们对她们说：“你们为什么在死人中间[a]寻找那位活着的？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较直译可作：“你们在死人中间寻找那位活着的做什么？”“在死人中间”也可译作“同死人在一起”。
    reason: 保留τί较字面的问法，以及μετά加属格可表达“同……在一起”的词义范围。
lexical_decisions:
- source_word: ἐμφόβων ... γενομένων
  choice: 惊恐起来
  rationale: ἔμφοβος表示惧怕、惊恐，γενομένων带有进入这一状态的意味；“惊恐起来”既保留起始意味，也符合现代汉语表达。
- source_word: κλινουσῶν τὰ πρόσωπα εἰς τὴν γῆν
  choice: 把脸伏在地上
  rationale: κλίνω在这里描写把脸朝向地面俯下的具体动作；“把脸伏在地上”自然、庄重，并保留因敬畏或惧怕而俯伏的画面。
- source_word: εἶπαν πρὸς αὐτάς
  choice: 他们对她们说
  rationale: 分别保留希腊文阳性复数主语和阴性复数受话者代词；上下文已交代“他们”是那两个人，“她们”是来到坟墓的妇女。
- source_word: Τί ζητεῖτε
  choice: 你们为什么……寻找
  rationale: τί字面可问“什么”，但此处整句是在质问这种寻找是否合宜，现代汉语用“为什么……寻找”最自然；脚注保留较贴近字面的另一种表达。
- source_word: τὸν ζῶντα
  choice: 那位活着的
  rationale: 这是阳性单数实词化分词，指一位具体的人；“那位活着的”保留其单数、人格性以及与死人之间的鲜明对照。
- source_word: μετὰ τῶν νεκρῶν
  choice: 在死人中间
  rationale: μετά加属格可表示“与……同在”或“在……之中”；此处“在死人中间”是自然的汉语，并准确呈现语境中的生死对照。
theological_decisions:
- issue: τὸν ζῶντα所含的复活意涵
  choice: 那位活着的
  alternative: 活人；那活着的人
  rationale: 译文表明所指的耶稣是活着的，并与死人形成对照，却不把“已经复活”等上下文推论直接添入本节，从而保留原文简洁而有张力的表达。
- issue: τί ζητεῖτε所表达的是询问对象还是质问缘由
  choice: 为什么……寻找
  alternative: 寻找……做什么
  rationale: 原文τί容许较字面的“什么”式理解，但整句语用重点是质问她们为何在死人中寻找活着的那一位；正文采用自然语义，脚注保留形式上的歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“惊恐起来”表达状态的开始；“把脸伏在地上”保留具体动作。用分号连接伴随情形与主句，使较长的希腊文结构在汉语中清晰流畅。
