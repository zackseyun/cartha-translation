  text: πτοηθέντες δὲ καὶ ἔμφοβοι γενόμενοι ἐδόκουν πνεῦμα θεωρεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/037.yaml
  text: But being startled and becoming afraid[a], they thought they were seeing a spirit.
translation:
  language: zh_hans
  text: 他们却吃了一惊，又害怕起来，以为自己看见的是个灵[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“鬼魂”。希腊文是 πνεῦμα，更直译为“灵”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πτοηθέντες
  choice: 吃了一惊
  rationale: 表达突然而来的惊愕，与后面的“害怕”有所区分，避免重复堆叠恐惧用语。
- source_word: δὲ
  choice: 却
  rationale: 承接上文耶稣显现，同时突出门徒出乎意料的反应，符合此处轻微转折的作用。
- source_word: ἔμφοβοι γενόμενοι
  choice: 又害怕起来
  rationale: “起来”体现进入害怕状态的变化；“又”自然连接两个并列分词所描述的反应。
- source_word: ἐδόκουν
  choice: 以为
  rationale: 准确表达他们当时形成并持有的判断，而叙事随后表明这一判断并不正确。
- source_word: πνεῦμα
  choice: 灵
  rationale: 这是该希腊词较直接且在现代中文中可懂的对应词，并保留其在本节语境中可能指非肉身存在的含义。
- source_word: θεωρεῖν
  choice: 所看见的
  rationale: 用自然中文表达他们对眼前持续可见之对象的认定，不勉强复制希腊语现在时不定式的形式。
theological_decisions:
- issue: 复活显现语境中 πνεῦμα 的译法
  choice: 灵
  alternative: 鬼魂
  rationale: “灵”在词义上更直接，也不把后世民间文化对“鬼魂”的具体想象带入经文；脚注保留语境上可成立的另一译法，使门徒误把复活的耶稣当作非肉身存在这一叙事张力不被消解。
translation_notes:
  register: 采用现代、自然而庄重的普通话。“吃了一惊，又害怕起来”既区分突然受惊与随后进入恐惧状态，也避免生硬照搬希腊语分词结构；“以为所看见的是个灵”符合中文叙事习惯。
