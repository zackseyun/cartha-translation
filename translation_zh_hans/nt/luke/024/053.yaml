  yaml_path: translation/nt/luke/024/053.yaml
  text: And they were continually in the temple[a], blessing God.
translation:
  language: zh_hans
  text: 他们常常在圣殿里称颂上帝。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“赞美上帝。”希腊语动词字面意思是“祝福”，也可指称颂。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: （不单独译出）
  rationale: 本节承接前文；汉语作为全书结句，无须机械译出“并且”，省略连接词更自然，也不改变叙事关系。
- source_word: ἦσαν διὰ παντός
  choice: 常
  rationale: διὰ παντός表示持续或经常如此；与未完成时ἦσαν合在一起，“常”简洁自然地传达持续性的习惯状态。
- source_word: ἐν τῷ ἱερῷ
  choice: 在圣殿里
  rationale: ἱερόν指圣殿整体范围，包括院宇，并非专指内殿；“圣殿里”是现代汉语中简明而通常的表达。
- source_word: εὐλογοῦντες
  choice: 称颂
  rationale: 该词本义涉及祝福、说美言；以上帝为宾语时，“称颂”既保留“说美言、颂扬”的语义，也比“祝福上帝”更符合现代汉语敬拜用语。
- source_word: τὸν θεόν
  choice: 上帝
  rationale: 作为εὐλογοῦντες的直接宾语，直译为“上帝”；采用现代标准汉语中通行且庄重的称谓。
theological_decisions:
- issue: εὐλογοῦντες τὸν θεόν所表达的敬拜语言
  choice: 称颂上帝
  alternative: 赞美上帝；祝福上帝
  rationale: “称颂”能体现εὐλογέω“说美言、颂扬”的词义，并保留它与一般“赞美”用词之间的细微区别；“祝福上帝”虽形式更贴近希腊语，却容易使现代汉语读者误解为人向上帝赐福。脚注交代较直译的说法。
translation_notes:
  register: 采用自然、庄重、简洁的现代标准汉语。“常在圣殿里”传达持续性的敬拜生活；“称颂”兼顾原词形式与汉语可懂度。脚注标记已置于正文对应句末。
