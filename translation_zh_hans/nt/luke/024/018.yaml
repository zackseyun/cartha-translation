  to: 其中一个名叫革流巴的回答他说：“难道你是唯一一个在耶路撒冷寄居[a]、却不知道这几天那里所发生之事的人吗？”
  rationale: 仅调整“唯一”的句法辖域，并将地点回指改为更直接的“那里”，以消除中文歧义；保留原译的名称、寄居者语义、近期时间范围和庄重叙事语体。
