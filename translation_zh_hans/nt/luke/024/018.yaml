    rationale: 此表述容易理解为“在所有寄居者当中，只有你不知情”，而不是问对方是否为唯一一位寄居耶路撒冷且不知情的人。改用“唯一一个……的人”可清楚表达原文及英文审校轨迹所采取的句法理解。
