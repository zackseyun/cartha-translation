base_translation:
  language: en
  yaml_path: translation/nt/luke/024/018.yaml
  text: Then one of them[a], named Cleopas, answered and said to him, “Are you the only visitor to Jerusalem who does not know the things that have happened there in these days?”
translation:
  language: zh_hans
  text: 其中一个名叫革流巴的回答他说：“难道你是唯一一个在耶路撒冷寄居[a]、却不知道这几天那里所发生之事的人吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“暂住”。这个希腊词有以外来者或临时居民身份居住的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ
  choice: 回答说
  rationale: ἀποκριθείς是引出回应的过去时分词；δέ为轻微叙事连接。汉语用“回答说”自然承接上文，无须机械译出分词结构或另加较强转折。
- source_word: εἷς ὀνόματι Κλεοπᾶς
  choice: 其中一个名叫革流巴的
  rationale: εἷς由上下文指两位门徒中的一位；ὀνόματι加人名表示“名叫”。补出“其中”使现代汉语指代清楚。
- source_word: εἶπεν πρὸς αὐτόν
  choice: 对他说
  rationale: 保留原文代词，不在本节直接补入“耶稣”这一名字。与前面的“回答”合为自然的汉语表达。
- source_word: Σὺ μόνος
  choice: 你……唯一
  rationale: μόνος表达排他性；按上下文将其组织为“寄居的人中，唯一不知道……的吗”，清楚传达反问重点。
- source_word: παροικεῖς
  choice: 寄居
  rationale: παροικέω指作为外来者或暂住者居住；“寄居”既保留外来、暂居意味，也符合庄重而可懂的现代中文。
- source_word: Ἰερουσαλήμ
  choice: 耶路撒冷
  rationale: 采用现代中文圣经与一般出版物通行的地名译法。
- source_word: οὐκ ἔγνως
  choice: 不知道
  rationale: 虽为简单过去时形式，此处问的是对近期事件仍不知情的状态；中文“不知道”自然表达这种结果状态。
- source_word: τὰ γενόμενα
  choice: 所发生之事
  rationale: 名词化分词指已经发生的事件；此译简洁、庄重，并保留复合事件的概括性。
- source_word: ἐν αὐτῇ ἐν ταῖς ἡμέραις ταύταις
  choice: 这几天城里
  rationale: αὐτῇ回指耶路撒冷，汉语以“城里”避免生硬的“在其中”；“这几天”自然表达紧接当前的近期时段。
theological_decisions: []
