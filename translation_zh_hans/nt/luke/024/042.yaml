lexical_decisions:
- source_word: οἱ δὲ
  choice: 他们就
  rationale: οἱ作名词性用法，指在场的门徒；δέ是轻微的承接连词。译作“他们就”自然衔接上文，也不过分强调转折。
- source_word: ἐπέδωκαν
  choice: 给了
  rationale: ἐπιδίδωμι的简单过去时主动直陈式，此处意为“给、递给”。“给了”简洁自然，并与间接宾语“他”顺畅搭配。
- source_word: αὐτῷ
  choice: 他
  rationale: 与“给了”构成现代汉语常见的双宾语结构“给了他……”，准确表达与格间接宾语。
- source_word: ἰχθύος ὀπτοῦ μέρος
  choice: 一块烤鱼
  rationale: μέρος意为“一块、一份”，ἰχθύος ὀπτοῦ说明其内容是烤制的鱼。现代汉语“一块烤鱼”准确、自然。
- source_word: ὀπτοῦ
  choice: 烤
  rationale: ὀπτός指经烤制的食物；“烤”既保留烹调方式，又比限定为某种现代厨具做法更稳妥。
theological_decisions:
- issue: 路加福音24:42的文本形式
  choice: 正文仅翻译SBLGNT所载的“一块烤鱼”
  alternative: 一些较晚的抄本增添“和一片蜂房里的蜜”之类的文字
  rationale: 所给希腊语正文止于μέρος，并不包含较长读法。正文遵从所给批判文本，同时以脚注说明较晚抄本的增文，以保持文本透明度。
translation_notes:
  register: 采用现代、简洁而庄重的叙事语言。“他们就”承接上文动作；“一块烤鱼”符合普通读者的自然表达，并保留原文所指的烤制方式。
