  text: λέγοντας ὅτι ⸂ὄντως ἠγέρθη ὁ κύριος⸃ καὶ ὤφθη Σίμωνι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/034.yaml
  text: saying[a], “The Lord has truly been raised and has appeared to Simon!”
translation:
  language: zh_hans
  text: 他们说：“主确实已经复活了[a]，并且向西门显现了！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“主果真复活了”或“主确实已经被复活了”。希腊文的副词和动词可有几种意思相近的译法；其中动词在形式上是被动语态。
    reason: 说明ὄντως的近义表达及ἠγέρθη的被动形式；正文为求现代汉语自然，采用不显式标出被动的“已经复活了”。
lexical_decisions:
- source_word: λέγοντας
  choice: 他们说
  rationale: 这是阳性复数现在分词，承接上文中聚集的人。现代汉语通常需要明说主语并以完整谓语表达，译作“他们说”自然地保留了与上文的联系。
- source_word: ὅτι
  choice: ：“
  rationale: 此处引出所说的内容；用冒号和引号表达直接引语，符合现代汉语习惯。
- source_word: ὄντως
  choice: 确实
  rationale: 强调复活消息的真实性；“确实”自然、庄重，并保留原文的肯定语气。
- source_word: ἠγέρθη
  choice: 已经复活了
  rationale: 该词为ἐγείρω的简单过去时被动式。汉语“复活”本身通常不标明主动或被动；译作“已经复活了”既自然，也表达已经发生而其结果仍与当下有关的复活事实。被动形式及近似直译在脚注中说明。
- source_word: ὁ κύριος
  choice: 主
  rationale: 此处κύριος是对耶稣的称号；“主”保留其基督论分量，也是现代汉语基督教语境中通行而庄重的译法。
- source_word: καὶ
  choice: 并且
  rationale: 连接复活的宣告与向西门显现的陈述；“并且”清楚保留并列关系。
- source_word: ὤφθη
  choice: 向……显现了
  rationale: 这是ὁράω的简单过去时被动形式，在复活显现语境中惯用于表示某人向另一人显现。汉语“向西门显现了”比“被西门看见了”自然，也准确突出显现事件。
- source_word: Σίμωνι
  choice: 西门
  rationale: 按原文仅译人名“西门”，不补作“西门彼得”。与ὤφθη搭配时，间接受词用“向西门”表达。
theological_decisions:
- issue: 复活动词的语态
  choice: 已经复活了
  alternative: 已经被复活了／确实起来了
  rationale: 希腊文ἠγέρθη在形式上是被动语态，但现代汉语把“被”直接加在“复活”前会明显生硬。正文采用自然的“复活了”，不指明施事者，也不把语态解释为耶稣主动使自己复活；脚注保留原文被动形式的信息与可译空间。
- issue: κύριος的称号含义
  choice: 主
  alternative: 主人
  rationale: 在此复活宣告中，κύριος指耶稣并具有称号性质。“主”既忠实又庄重；“主人”会削弱此处的基督论分量。
- issue: ὤφθη的被动形式
  choice: 向西门显现了
  alternative: 被西门看见了
  rationale: 该被动形式在显现叙事中可惯用地表达“显现”。正文采用自然汉语，不把它处理成单纯偶然被看见，同时不额外说明显现的方式。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“他们说”使承接上文的复数分词在独立经节中表达完整；引语简洁有力。避免生硬的“被复活”，同时借脚注保留原文语态信息。
