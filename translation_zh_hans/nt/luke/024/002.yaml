  text: 发现那块石头已经从坟墓前滚开了，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὗρον
  choice: 发现
  rationale: 该词为简单过去时主动直陈语气第三人称复数，主语承接上一节的妇女们。“发现”自然表达她们到达后所见的意外情形。
- source_word: δὲ
  choice: 却
  rationale: δέ是较轻的叙事连接词；此处也带出她们原本预期与实际所见之间的轻微转折，因此译作“却”，不强化为显著对立。
- source_word: τὸν λίθον
  choice: 石头
  rationale: 在墓葬语境中，λίθος指封住墓口的石头；汉语无需另加量词，也不必译作较笼统的“岩石”。
- source_word: ἀποκεκυλισμένον
  choice: 已经……滚开了
  rationale: 完成时被动分词强调石头被滚动后所处的结果状态。“已经……滚开了”既保留滚动的动作意象，也自然表达持续到她们看见时的状态；被动施事者仍未说明。
- source_word: ἀπὸ τοῦ μνημείου
  choice: 从坟墓口
  rationale: μνημεῖον在福音书安葬叙事中指坟墓，ἀπό表示石头已离开坟墓。汉语补出方位成分“口”，明确石头原先封闭的是墓口，属于语境所要求的自然表达。
theological_decisions:
- issue: 希腊文未在本分句重述主语
  choice: 用承前省略主语的汉语句式“却发现”
  alternative: “她们却发现”
  rationale: εὗρον的复数主语承接上一节的妇女们。现代汉语在上下文明确时自然省略主语，可保持希腊文的承接方式，不增加神学含义。
- issue: 滚开石头的施事者未说明
  choice: 保留结果状态，不指出是谁滚开的
  alternative: “有人已经把石头从坟墓口滚开了”
  rationale: 被动分词没有明说施事者；译文不应提前根据后文补入天使、神或人，以保留叙事悬念与原文的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“却发现”顺接上一节；“已经……滚开了”传达完成时被动分词的结果状态。保留句末逗号，以配合原文作为后续叙事的连续分句。
