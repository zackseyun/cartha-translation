  text: ὑμεῖς ⸀ἐστε μάρτυρες τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/048.yaml
  text: You are witnesses of these things[a].
translation:
  language: zh_hans
  text: 你们是这些事的见证人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们是这些的见证人。”希腊文的指示代词所指的是耶稣刚才说到的那些事。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: 你们
  rationale: 这是显式出现的第二人称复数代词，带有一定强调意味；现代汉语用“你们”自然地标明主语，无须加上较显刻意的“你们自己”。
- source_word: ἐστε
  choice: 是
  rationale: 直陈式现在时的系词；在此自然译为“是”。
- source_word: μάρτυρες
  choice: 见证人
  rationale: 指亲历并能为所见所闻作证的人。“见证人”准确保留身份性表述，也不引入该词后来可能具有的殉道含义。
- source_word: τούτων
  choice: 这些事的
  rationale: 复数指示代词属格，回指耶稣刚才所说的受苦、复活及相关事件；“这些事的”在汉语中清楚表达见证对象。
theological_decisions:
- issue: 门徒作为 μάρτυρες 的角色
  choice: 译作“见证人”，指他们为刚才所述事件作见证。
  alternative: 将该词理解为带有后来“殉道者”的技术性含义。
  rationale: 本节直接语境强调为耶稣的受苦、复活以及所宣告的信息作证，不宜把该词后来发展出的殉道含义提前带入。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“这些事的见证人”保留原文简洁的身份陈述，并通过脚注说明 τούτων 的较直译表达及其语境所指。
