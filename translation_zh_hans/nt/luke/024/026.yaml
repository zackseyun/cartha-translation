  text: οὐχὶ ταῦτα ἔδει παθεῖν τὸν χριστὸν καὶ εἰσελθεῖν εἰς τὴν δόξαν αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/026.yaml
  text: Was it not necessary for the Messiah to suffer these things and to enter into his glory?[a]
translation:
  language: zh_hans
  text: 弥赛亚不是必须受这些苦，并进入他的荣耀吗？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弥赛亚”也可译为“基督”。希腊语 Χριστός 是称号，意为“受膏者”。
    reason: 提供传统对应译法，并说明称号的基本含义。
lexical_decisions:
- source_word: οὐχὶ
  choice: 不是……吗
  rationale: 引出预期肯定回答的反问；现代汉语用“不是……吗”自然保留其语气。
- source_word: ταῦτα
  choice: 这些苦
  rationale: 指向上下文所谈的受苦之事；结合 παθεῖν 译为“这些苦”，比“这些事”更自然，同时没有超出所指内容。
- source_word: ἔδει
  choice: 必须
  rationale: 表达上帝计划及经文应验所带来的必然性，不仅是一般义务或外在强迫。
- source_word: παθεῖν
  choice: 受……苦
  rationale: 准确而自然地表达 πάσχω 在此处的受苦含义。
- source_word: τὸν χριστὸν
  choice: 弥赛亚
  rationale: Χριστός 在此是称号，且上下文强调经文的应验；“弥赛亚”能向现代读者保留其受膏者身份含义。
- source_word: καὶ
  choice: 然后
  rationale: 在汉语中自然连接受苦与进入荣耀两个不定式所表达的事件；仅表明叙述中的承接，不把因果关系明说出来。
- source_word: εἰσελθεῖν εἰς τὴν δόξαν αὐτοῦ
  choice: 进入他的荣耀
  rationale: 保留“进入”的意象和 αὐτοῦ 的所属表达，不解释为“获赐荣耀”或其他更具体含义。
- source_word: δόξαν
  choice: 荣耀
  rationale: 是 δόξα 在复活与高升语境中的标准且庄重的对应词。
- source_word: αὐτοῦ
  choice: 他的
  rationale: 直接保留属格代词，同时不裁定这是属于他、为他预备或由他彰显的荣耀。
theological_decisions:
- issue: Χριστός 的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处作为称号出现，并置于经文应验的语境中；“弥赛亚”较清楚地传达其受膏者含义。脚注保留传统译名“基督”。
- issue: ἔδει 的语力
  choice: 必须
  alternative: 应当；注定要
  rationale: “必须”保留路加叙事中与上帝救赎计划和经文应验相关的必要性，又不在正文中把这种必要性的来源解释得过满。
- issue: 受苦与进入荣耀的关系
  choice: 用“然后”作承接
  alternative: 只用“并且”；译为“才进入”
  rationale: 原文 καί 连接两个不定式。汉语“然后”自然呈现其顺序；避免“才”所可能加入的强条件或功德关系。
- issue: “他的荣耀”的含义
  choice: 直译为“他的荣耀”
  alternative: 属于他的荣耀；为他预备的荣耀；他得荣耀
  rationale: 属格 αὐτοῦ 的具体关系存在一定开放性，直译可保留原文的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的反问句式。“这些苦”紧扣上下文；“进入他的荣耀”保留原文意象和所属关系。正文中的脚注标记 [a] 与脚注对应。
