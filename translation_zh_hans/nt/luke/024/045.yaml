  text: τότε διήνοιξεν αὐτῶν τὸν νοῦν τοῦ συνιέναι τὰς γραφάς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/045.yaml
  text: Then he opened their minds to understand the Scriptures[b][a],
translation:
  language: zh_hans
  text: 于是，他开启他们的心智，使他们明白圣经。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“好让他们明白圣经。”
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: 于是
  rationale: 表示叙事中的时间推进和承接；“于是”在现代汉语中简洁自然。
- source_word: διήνοιξεν
  choice: 开启
  rationale: 保留 διανοίγω 的“打开”隐喻，同时与“心智”自然搭配，不弱化为单纯的“使能够”。
- source_word: αὐτῶν τὸν νοῦν
  choice: 他们的心智
  rationale: νοῦς 指理解、领悟和思想的官能；“心智”既保留动词所作用的具体对象，也比单说“悟性”更易为现代读者理解。
- source_word: τοῦ συνιέναι
  choice: 使他们明白
  rationale: 带冠词不定式可表达目的或结果；此译自然呈现其功能，同时不强行限定究竟偏重目的还是结果。
- source_word: τὰς γραφάς
  choice: 圣经
  rationale: 此处复数 γραφαί 指以色列被承认为神圣经卷的著作；现代汉语通常统称为“圣经”。
theological_decisions:
- issue: 耶稣开启理解能力这一行动的性质
  choice: 保留“他开启他们的心智”，不另加教义性解释
  alternative: 他使他们能够明白；他向他们讲解圣经
  rationale: 原文直接陈述他开启他们的 νοῦς，使其明白圣经；译文保留这一神学陈述，既不扩展为后来的教义术语，也不缩减为仅仅讲解经文。
- issue: τοῦ συνιέναι 的目的与结果关系
  choice: 译为“使他们明白”，保留目的与结果之间的开放性
  alternative: 好让他们明白；以致他们明白
  rationale: 希腊语结构可带目的或结果色彩；正文采用兼容两者的汉语表达，脚注提示另一种较明确的目的性译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“开启他们的心智”保留原文的具体隐喻；“明白圣经”则符合自然汉语。脚注标记置于正文相应句末。
