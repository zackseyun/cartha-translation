  text: καὶ εἶπεν αὐτοῖς· Τί τεταραγμένοι ἐστέ, καὶ διὰ τί διαλογισμοὶ ἀναβαίνουσιν ἐν ⸂τῇ καρδίᾳ⸃ ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/038.yaml
  text: And he said to them[a], “Why are you troubled, and why do doubts arise in your hearts?”
translation:
  language: zh_hans
  text: 他对他们说：“你们为什么惊慌？为什么心里起了疑念[a]呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “疑念”也可译作“念头”或“思量”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί
  choice: 为什么
  rationale: 在此与表语及系词连用，询问原因；现代汉语译作“为什么”自然准确。
- source_word: τεταραγμένοι
  choice: 惊慌
  rationale: 该完成时被动分词描述他们因所见之事而处于受震动、不安的状态；“惊慌”既表达当下状态，也符合紧接上文门徒害怕的语境。
- source_word: διαλογισμοὶ
  choice: 疑念
  rationale: 该词可泛指思想、推想或议论；在此语境中指面对耶稣显现时心中生出的质疑与犹疑。“疑念”保留负面而未完全确定的意味；脚注列出较宽泛的词义。
- source_word: ἀναβαίνουσιν
  choice: 起了
  rationale: 字面为“上升”，用于内在思想时表示浮现、产生；“心里起了”是自然的现代汉语搭配。
- source_word: ἐν τῇ καρδίᾳ ὑμῶν
  choice: 你们心里
  rationale: 希腊文以单数“心”配复数“你们”，具有分配性。汉语“你们心里”自然表达每个人内在的思想活动，无须机械标出复数。
- source_word: καρδία
  choice: 心
  rationale: 这里的“心”指人的内在中心，包括思想、判断和情感；保留圣经的人论表达，不缩窄为单纯的“头脑”。
theological_decisions:
- issue: καρδία 所表达的内在人观
  choice: 心里
  alternative: 头脑中／内心深处
  rationale: “心”在经文中不仅指情感，也包括思想与判断。译作“心里”既符合现代汉语，也保留这种较完整的圣经人观。
- issue: διαλογισμοὶ 的语境意义
  choice: 疑念
  alternative: 念头／思量／疑问
  rationale: 上下文显示门徒对所见之事惊惧且不能确信，因此“疑念”能表达语境中的犹疑；但原词本身范围较宽，故以脚注保留“念头、思量”等可能。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“惊慌”承接上下文的惧怕，“心里起了疑念”保留原文内在思想向上浮现的意象，同时避免生硬直译。
