  yaml_path: translation/nt/luke/024/040.yaml
  text: And after saying this[a], he showed them his hands and his feet.
translation:
  language: zh_hans
  text: 说了这话，他就把自己的手和脚给他们看。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本没有这句话。
    reason: textual_variant
lexical_decisions:
- source_word: καὶ
  choice: 就
  rationale: 在叙事中自然承接前一动作，并表达分词所隐含的先后关系，不额外强化时间意味。
- source_word: τοῦτο εἰπὼν
  choice: 说了这话
  rationale: 简洁自然地表达先于主句动作发生的附带动作，也保留 τοῦτο 对前文话语的指代。
- source_word: ἔδειξεν
  choice: 给……看
  rationale: 符合现代汉语习惯，准确表达 δείκνυμι 在此处使人看见、察看的意思。
- source_word: αὐτοῖς
  choice: 给他们
  rationale: 以汉语介词结构自然表达间接宾语。
- source_word: τὰς χεῖρας καὶ τοὺς πόδας
  choice: 自己的手和脚
  rationale: 希腊语使用定冠词；汉语根据语境补出反身领属，使所指清楚，又避免生硬直译为“那些手和脚”。
theological_decisions:
- issue: 整节经文的文本鉴别地位
  choice: 收入正文，并用脚注说明异文
  alternative: 有些抄本没有这句话
  rationale: SBLGNT将整句置于方括号中，表明其文本可靠性存在显著疑问。既然所提供的原文收录此句，正文予以翻译，同时用脚注如实保留文本不确定性，不据此化解任何神学张力。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“说了这话”与“给他们看”便于普通读者理解；“自己的”明确手脚属于耶稣。脚注标记置于整句之后，因为异文涉及全句。
