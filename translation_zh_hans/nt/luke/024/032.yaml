base_translation:
  language: en
  yaml_path: translation/nt/luke/024/032.yaml
  text: And they said to one another[a], “Was not our heart burning within us as he was speaking to us on the road[c][b], as he was opening the Scriptures to us?”
translation:
  language: zh_hans
  text: 他们彼此说：“他在路上同我们说话、向我们开启圣经的时候，我们心里岂不是火热的吗？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρὸς ἀλλήλους
  choice: 彼此说
  rationale: 自然表达相互交谈，同时保留希腊文的互指关系。
- source_word: Οὐχὶ
  choice: 岂不是……吗
  rationale: 表示预期肯定回答的反问，保留原文的修辞力量。
- source_word: ἡ καρδία ἡμῶν
  choice: 我们的心
  rationale: 按希腊文保留单数，可表达二人共有的内在体验；现代汉语也自然。
- source_word: καιομένη ἦν ἐν ἡμῖν
  choice: 在我们里面……火热
  rationale: 保留“燃烧”的身体性隐喻及内在方位，不把它限定为情绪激动、属灵感动或认知领悟。
- source_word: ἐλάλει
  choice: 说话
  rationale: 结合“的时候”表达未完成时所描写的持续过程。
- source_word: ἐν τῇ ὁδῷ
  choice: 在路上
  rationale: 既具体符合以马忤斯路上的叙事场景，也可自然表示行程途中。
- source_word: διήνοιγεν
  choice: 给我们解开
  rationale: “解开”保留διανοίγω的开启隐喻，同时在汉语中自然传达使经文意义明白。
- source_word: τὰς γραφάς
  choice: 圣经
  rationale: 这里指神圣经典；“圣经”是现代汉语中准确且通行的称呼。
theological_decisions:
- issue: “心里火热”的隐喻性质
  choice: 保留“我们的心在我们里面……火热”
  alternative: 我们的心深受感动／我们里面受到启迪
  rationale: 原文没有明确区分这种体验是情感、属灵还是认知层面的，因此不以解释性措辞消除其张力。
- issue: “解开圣经”的解释程度
  choice: 在正文中保留开启隐喻“解开”
  alternative: 给我们讲解圣经／使我们明白圣经
  rationale: 原文使用διανοίγω的开启意象；“解开”既可理解，又避免把隐喻完全改写为解释。
translation_notes:
  register: 采用现代、庄重而口语顺畅的标准普通话。“岂不是……吗”维持反问语气；句序调整为汉语自然的时间结构，同时保留两个未完成时动作的持续背景。
