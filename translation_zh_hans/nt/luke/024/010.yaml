  text: ἦσαν δὲ ἡ Μαγδαληνὴ Μαρία καὶ Ἰωάννα καὶ Μαρία ⸀ἡ Ἰακώβου καὶ αἱ λοιπαὶ σὺν αὐταῖς· ⸀ἔλεγον πρὸς τοὺς ἀποστόλους ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/010.yaml
  text: They were Mary Magdalene[a], Joanna, Mary the mother of James, and the other women with them; they were telling these things to the apostles.
translation:
  language: zh_hans
  text: 这些妇女是抹大拉的马利亚、约亚拿、雅各的母亲马利亚[a]，以及和她们在一起的其他妇女。她们正把这些事告诉使徒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译“雅各的马利亚”；这很可能是指“雅各的母亲马利亚”，但也可能是“雅各的妻子马利亚”。
    reason: 原文省略了马利亚与雅各之间的具体关系，需保留另一种合理解释。
lexical_decisions:
- source_word: ἦσαν δὲ
  choice: 这些妇女是
  rationale: 结合上文补出“这些妇女”，自然引出名单；δὲ在此仅作轻微的叙事衔接，现代汉语无须另译为“现在”或“然后”。
- source_word: ἡ Μαγδαληνὴ Μαρία
  choice: 抹大拉的马利亚
  rationale: 采用现代中文圣经读者熟悉的地名性称谓，准确表达“来自抹大拉的马利亚”。
- source_word: Ἰωάννα
  choice: 约亚拿
  rationale: 采用通行的中文音译。
- source_word: Μαρία ἡ Ἰακώβου
  choice: 雅各的母亲马利亚
  rationale: 属格关系在希腊文中被省略；按福音书中的命名习惯，最可能指雅各的母亲。正文采用清楚自然的表达，同时以脚注保留原文的歧义。
- source_word: αἱ λοιπαὶ σὺν αὐταῖς
  choice: 和她们在一起的其他妇女
  rationale: 定冠词加阴性复数形容词所指的是其余妇女；在中文中补明“妇女”更清楚。
- source_word: ἔλεγον
  choice: 述说了
  rationale: 未完成时呈现她们当时所作的报告；中文以“述说了”自然叙述该行动，不强行加入可能暗示反复的“一直”。
- source_word: πρὸς τοὺς ἀποστόλους
  choice: 向使徒
  rationale: “使徒”是准确且通行的术语；介词πρός在此表示陈述的对象，用“向”自然。
- source_word: ταῦτα
  choice: 这些事
  rationale: 保留复数指示，回指前文所述的见闻和信息。
theological_decisions:
- issue: Μαρία ἡ Ἰακώβου所表示的亲属关系
  choice: 雅各的母亲马利亚
  alternative: 雅各的马利亚；雅各的妻子马利亚
  rationale: 希腊文仅以属格“雅各的”限定马利亚，没有明说亲属关系。福音书的命名方式使“母亲”较为可能，但“妻子”在语法上仍有可能，因此正文采用最可能的理解，脚注保留真实歧义。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。名单结构简洁自然；分为两句，以对应希腊文中辨认妇女和她们向使徒报告这两个分句。
