  text: While they were saying these things[a], he himself stood among them.
translation:
  language: zh_hans
  text: 他们正谈论这些事的时候[a]，他亲自站在他们中间。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本在此加上：“并对他们说：‘愿你们平安！’”
