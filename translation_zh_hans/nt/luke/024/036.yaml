lexical_decisions:
- source_word: Ταῦτα
  choice: 这些事
  rationale: 保留中性复数指示词的复数意义，并明确承接上文门徒正在谈论的内容。
- source_word: δὲ + αὐτῶν λαλούντων
  choice: ……正谈论……的时候
  rationale: 将δέ与属格独立结构合并处理，表达两个动作同时发生；“正……的时候”符合现代汉语习惯。
- source_word: λαλούντων
  choice: 谈论
  rationale: 这里指众人就刚才所述之事交谈；“谈论”比单纯的“说”更自然，也不增添原文没有的内容。
- source_word: αὐτὸς
  choice: 他亲自
  rationale: 显明原文独立人称代词的强调作用，突出是耶稣本人来到众人中间。
- source_word: ἔστη
  choice: 站
  rationale: 直接表达ἵστημι在此处的词义；不译作“显现”，以免加入原词未明确表达的解释。
- source_word: ἐν μέσῳ αὐτῶν
  choice: 在他们中间
  rationale: 自然、清楚地表达位于这群人当中的意思，同时较完整地保留原文的空间意象。
theological_decisions:
- issue: 是否在正文中加入较长异文“对他们说：‘愿你们平安！’”
  choice: 正文不加入，依照所提供的SBLGNT正文止于“在他们中间”
  alternative: 在正文中加入“对他们说：‘愿你们平安！’”
  rationale: 翻译以所给希腊文正文为准，不依据后期抄本传统或熟悉的译本进行补足；该异文具有重要抄本见证，因此收入脚注。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准普通话。“谈论这些事”承接上文，“他亲自”保留原文强调，“站在他们中间”避免把动作解释性地译成“显现”。
