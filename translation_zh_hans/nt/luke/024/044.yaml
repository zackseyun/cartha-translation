language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Εἶπεν δὲ ⸂πρὸς αὐτούς⸃· Οὗτοι οἱ λόγοι ⸀μου οὓς ἐλάλησα πρὸς ὑμᾶς ἔτι ὢν σὺν ὑμῖν, ὅτι δεῖ πληρωθῆναι πάντα τὰ γεγραμμένα ἐν τῷ νόμῳ Μωϋσέως ⸀καὶ προφήταις καὶ ψαλμοῖς περὶ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/044.yaml
  text: 'Then he said to them[c][b][a], “These are my words that I spoke to you while I was still with you: that everything written about me in the Law of Moses and the Prophets and the Psalms must be fulfilled.”'
translation:
  language: zh_hans
  text: 耶稣对他们说：“这些话就是我还和你们在一起时对你们说过的：摩西律法、先知书和诗篇[b]中所有关于我[c]的记载[a]，都必须应验。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“所写的一切”。
    reason: lexical_alternative
  - marker: b
    text: “摩西律法、先知书和诗篇”很可能指以色列圣经的几个主要分部；“诗篇”可能特指《诗篇》，也可能更广泛地代表“圣卷”。
    reason: cultural_note
  - marker: c
    text: 或译：“论到我”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν δὲ πρὸς αὐτούς
  choice: 耶稣又对他们说
  rationale: δέ是轻微的叙事连接词，译作“又”可自然推进叙事；汉语补出主语“耶稣”，使独立经节清楚易读。πρὸς αὐτούς按其在言说动词后的通常用法译为“对他们”。
- source_word: Οὗτοι οἱ λόγοι μου οὓς ἐλάλησα πρὸς ὑμᾶς
  choice: 这就是……我对你们说过的话
  rationale: λόγοι译为“话”，既直接又自然；关系从句按现代汉语语序前置，同时保留“这些话”与耶稣先前言说之间的指称关系。
- source_word: ἔτι ὢν σὺν ὑμῖν
  choice: 我还和你们在一起时
  rationale: 以时间从句表达分词结构；“还”对应ἔτι，“和你们在一起”对应σὺν ὑμῖν。
- source_word: ὅτι δεῖ πληρωθῆναι
  choice: 都必须应验
  rationale: δεῖ译为“必须”，保留必要性的力度；πληρωθῆναι在经文实现的语境中译为“应验”，不额外界定其实现方式。
- source_word: πάντα τὰ γεγραμμένα
  choice: 所有……的记载
  rationale: “所有”保留πάντα的全面范围，“记载”自然表达γεγραμμένα所指已经写下的内容；脚注保留较形式对应的译法。
- source_word: ἐν τῷ νόμῳ Μωϋσέως καὶ προφήταις καὶ ψαλμοῖς
  choice: 摩西律法、先知书和诗篇中
  rationale: 译作三个并列的经文类别，不在正文中断定“诗篇”究竟仅指《诗篇》还是代指更广的“圣卷”；相关可能性留在脚注说明。
- source_word: περὶ ἐμοῦ
  choice: 关于我
  rationale: περί加属格表示所论及的对象；“关于我”是清楚自然的现代汉语，脚注列出较庄重的替代说法“论到我”。
theological_decisions:
- issue: 耶稣所说经文应验之必要性
  choice: 译作“都必须应验”
  alternative: “都要应验”或“注定要实现”
  rationale: “必须”准确保留δεῖ所表达的必要性，但不进一步说明这种必要性的机制，也不把“应验”扩展成某种特定的预言理论。
- issue: “摩西律法、先知书和诗篇”的范围
  choice: 正文保留三个并列名称，并以脚注说明其可能指向以色列圣经的主要分部
  alternative: 直接把“诗篇”解释为整个“圣卷”，或仅视为《诗篇》一卷
  rationale: 原文可能指以色列圣经的三大分部，但“诗篇”的确切范围仍有余地；正文不替原文消除这一张力。
- issue: πάντα τὰ γεγραμμένα的范围
  choice: 译为“所有……的记载”
  alternative: 译为“所写的一切”
  rationale: 两者都保留πάντα的总体性；正文采用更自然的汉语表达，脚注保存更贴近原文形式的选择。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。为符合汉语信息结构，将“关于我的记载”置于“必须应验”之前；保留“必须”的神学力度，并通过脚注呈现词义和经文分部范围上的真实歧义。
