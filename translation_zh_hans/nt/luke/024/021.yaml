  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἡμεῖς δὲ ἠλπίζομεν ὅτι αὐτός ἐστιν ὁ μέλλων λυτροῦσθαι τὸν Ἰσραήλ· ἀλλά γε ⸀καὶ σὺν πᾶσιν τούτοις τρίτην ταύτην ἡμέραν ⸀ἄγει ἀφ’ οὗ ταῦτα ἐγένετο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/021.yaml
  text: But we were hoping that he is the one who is about to redeem Israel[a]. Yet besides all this[b], it is now the third day since these things happened.
translation:
  language: zh_hans
  text: 可是，我们原来盼望，他就是那位将要救赎以色列的[a][b]。不但如此，从这些事发生到今天，已经是第三天了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他就是那位本来要救赎以色列的。”希腊原文在他们过去所抱的盼望中保留了现在时的“是”。
    reason: alternative_reading
  - marker: b
    text: “救赎以色列”可以广泛指所盼望的弥赛亚拯救；原文没有说明说话的人所指的是政治解放、属灵拯救，还是两者兼有。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς δὲ
  choice: 可是，我们
  rationale: δέ承接上文并形成转折；显出的ἡμεῖς用“我们”表达，“可是”自然传达失望中的反差。
- source_word: ἠλπίζομεν
  choice: 原来盼望
  rationale: 未完成时表示过去持续的期待；“原来盼望”既自然，也暗示这期待如今受到了打击。
- source_word: ὅτι αὐτός ἐστιν
  choice: 他就是
  rationale: 保留原文嵌在过去盼望内容中的现在时ἐστιν，不擅自改成纯粹过去的判断；汉语“就是”也不强行标定时态。
- source_word: ὁ μέλλων λυτροῦσθαι
  choice: 那位将要救赎……的
  rationale: μέλλων加不定式表达预期或将要发生的行动；“将要”保留其前瞻意味，同时符合现代汉语。
- source_word: λυτροῦσθαι
  choice: 救赎
  rationale: 该词含释放、赎回之意，并带有圣约和拯救的色彩；“救赎”保留其弥赛亚语境中的丰富含义。
- source_word: τὸν Ἰσραήλ
  choice: 以色列
  rationale: 直接指作为整体的圣约群体，不增译为某一种政治或属灵概念。
- source_word: ἀλλά γε καὶ σὺν πᾶσιν τούτοις
  choice: 不但如此
  rationale: 该组合增添另一项令人沮丧的事实；“不但如此”以自然汉语表达累加和推进作用。
- source_word: τρίτην ταύτην ἡμέραν ἄγει
  choice: 到今天，已经是第三天了
  rationale: ἄγει在这里是计算时间经过的习语；此译清楚表达已到第三天。
- source_word: ἀφ’ οὗ ταῦτα ἐγένετο
  choice: 这些事发生
  rationale: ἀφ’ οὗ标明计算时间的起点；与“到今天”组合，自然表达“自这些事发生以来”。
theological_decisions:
- issue: “救赎以色列”所指的弥赛亚盼望
  choice: 保留“救赎以色列”，不限定救赎的方式
  alternative: 译成“在政治上解救以色列”或“在属灵上拯救以色列”
  rationale: 原文可以承载广泛的弥赛亚拯救盼望，却没有明确限定为政治解放、属灵救恩或两者兼有；直译保留了这一神学张力。
- issue: 过去时ἠλπίζομεν之后ἐστιν与μέλλων的时间关系
  choice: 译为“原来盼望，他就是那位将要……”
  alternative: 译为“原来盼望，他就是那位本来要……”
  rationale: 原文在过去的“盼望”中保留现在时ἐστιν，并用μέλλων表达前瞻期待；正文尽量保留这种形式，不因上下文中的失望而完全倒推为过去时。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“可是，我们原来盼望”体现失望和转折；“不但如此”自然引出第三天这一附加事实。脚注标记紧接其所解释的整段盼望及“以色列”之后。
