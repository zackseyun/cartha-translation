base_translation:
  language: en
  yaml_path: translation/nt/luke/024/030.yaml
  text: And it happened that[a], when he reclined at the table with them, he took the bread, blessed it, and after breaking it[b], began giving it to them.
translation:
  language: zh_hans
  text: 他和他们一同坐席的时候，就拿起饼来祝福；掰开后，递给他们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “递给”也可理解为“开始递给”或“不断递给”；希腊文的未完成时可突出动作正在进行，也可突出动作的开始。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: 不单独译出，以“……的时候，就……”体现叙事转折
  rationale: 这里的 καὶ ἐγένετο 是路加常用的叙事衔接语。现代汉语若直译为“事情发生了”会显得生硬；用“……的时候，就……”自然保留事件展开和转折。
- source_word: ἐν τῷ κατακλιθῆναι αὐτὸν μετ’ αὐτῶν
  choice: 他和他们一同坐席的时候
  rationale: 带冠词的不定式结构表示时间。κατακλίνω 在用餐语境中指按古代习俗斜倚进餐；“坐席”是现代汉语中自然、庄重的用餐表达，同时不误导读者以为只是普通坐下。
- source_word: λαβὼν τὸν ἄρτον
  choice: 拿起饼来
  rationale: 以连动结构自然表达分词所表示的先后动作；“饼”符合本书语境中 ἄρτος 的常用译法。
- source_word: εὐλόγησεν
  choice: 祝福
  rationale: 保留 εὐλογέω 的基本措辞，而不改译为更接近 εὐχαριστέω 的“感谢”。原文没有明说祝福的对象，因此不补入“为饼”或“向上帝”。
- source_word: κλάσας
  choice: 掰开后
  rationale: 不定宾语由上下文自然指向饼；“后”明确表达不定过去时分词相对于主要动词的先行动作。
- source_word: ἐπεδίδου
  choice: 递给他们
  rationale: ἐπιδίδωμι 在此指把掰开的饼分递给同席的人。“递给”比“给”更具体自然；汉语动词本身不强制标明进行或起始，因而保留未完成时在此可能具有的持续性或起始性歧义，并以脚注说明。
theological_decisions:
- issue: 这些用餐动作可能具有圣餐含义
  choice: 正文采用普通席间用语，完整保留“拿起—祝福—掰开—递给”的动作次序
  alternative: 使用更明确带有圣餐礼仪色彩的措辞
  rationale: 这一动作序列可能让读者联想到此前的擘饼场景，但本节没有明确把这次用餐界定为圣礼。译文应保留回响，同时避免加入宗派性的解释。
- issue: εὐλόγησεν 的受词或祝福方向
  choice: 译作不带明示宾语的“祝福”
  alternative: “祝福了饼”或“向上帝祝谢”
  rationale: 希腊文在此没有明示宾语。中文可自然保留这种省略，避免替原文决定是祝福饼、称颂上帝，还是诵念餐前祝福。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“坐席”简洁表达古代斜倚用餐的文化场景；正文不另加文化脚注，以免将现代汉语的“坐”误当作对身体姿势的精确说明。唯一脚注保留 ἐπεδίδου 的体貌歧义。
