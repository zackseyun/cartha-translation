  text: καὶ ἀναστάντες αὐτῇ τῇ ὥρᾳ ὑπέστρεψαν εἰς Ἰερουσαλήμ, καὶ εὗρον ⸀ἠθροισμένους τοὺς ἕνδεκα καὶ τοὺς σὺν αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/033.yaml
  text: And rising that very hour[a], they returned to Jerusalem and found the Eleven and those with them gathered together,
translation:
  language: zh_hans
  text: 他们就在那时起身，回到耶路撒冷，发现那十一人和跟他们在一起的人已经聚集在一起[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“已经集合”。希腊语分词描述的是：他们被发现时，已经处于聚集的状态。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστάντες
  choice: 起身
  rationale: 不定过去时分词在这里表示先于主要动作发生的伴随动作；“起身”简洁自然，也保留了身体行动。
- source_word: αὐτῇ τῇ ὥρᾳ
  choice: 就在那一刻
  rationale: 该与格短语既指向当时那个特定时刻，又带有强调和立即行动的意味；“就在那一刻”比单纯的“立刻”更完整地保留原文的时间指向。
- source_word: ὑπέστρεψαν
  choice: 回到
  rationale: 在行程叙事中表示返回先前所在之地；“回到耶路撒冷”符合现代汉语习惯。
- source_word: Ἰερουσαλήμ
  choice: 耶路撒冷
  rationale: 采用现代中文圣经及一般语境中通行的地名译法。
- source_word: εὗρον
  choice: 发现
  rationale: 直接表达他们回来后所见的情形；比“找到”更适合后接描述一群人当时状态的结构。
- source_word: ἠθροισμένους
  choice: 已经聚在一起
  rationale: 完成时被动分词描述他们被发现时已经处于聚集的状态；加入“已经”体现结果状态，并使汉语自然。
- source_word: τοὺς ἕνδεκα
  choice: 那十一人
  rationale: 保留原文以数字作为群体称谓的表达，不增添原文没有明说的“使徒”。定指词“那”体现希腊语冠词。
- source_word: τοὺς σὺν αὐτοῖς
  choice: 跟他们在一起的人
  rationale: 贴近原文，指当时与那十一人在一起的其他人，不额外限定其身份。
theological_decisions:
- issue: “那十一人”作为群体称谓，与当时实际在场人数之间可能存在的张力
  choice: 保留“那十一人”这一群体称谓，不作协调性扩写
  alternative: 十一个使徒；其余的门徒
  rationale: 原文使用τοὺς ἕνδεκα这一固定性称谓。直译可保留路加的叙述方式，不因犹大已不在或多马可能缺席而推断、改写实际人数或成员身份。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“就在那一刻起身”保留时间强调和动作次序；“那十一人”避免添加“使徒”；将脚注标记置于其实际说明的“已经聚在一起”之后。
