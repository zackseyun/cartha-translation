  text: ἔτι δὲ ἀπιστούντων αὐτῶν ἀπὸ τῆς χαρᾶς καὶ θαυμαζόντων εἶπεν αὐτοῖς· Ἔχετέ τι βρώσιμον ἐνθάδε;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/041.yaml
  text: And while they still were disbelieving because of joy and were marveling[a], he said to them, “Do you have anything here to eat?”
translation:
  language: zh_hans
  text: 他们因欢喜还不信，又感到惊奇[a]时，他对他们说：“你们这里有什么吃的吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们欢喜得难以相信，又感到惊奇时。”
    reason: 以较符合现代汉语的方式表达ἀπιστούντων ἀπὸ τῆς χαρᾶς καὶ θαυμαζόντων；“难以相信”说明此处因欢喜而仍未能相信的情境性反应，但不将其定性为持久或敌对的拒信。
lexical_decisions:
- source_word: ἔτι δὲ
  choice: 还……的时候
  rationale: ἔτι表示持续状态“还、仍然”；δέ是轻微的承接词。结合两个属格分词，汉语用“……的时候”自然表达同时发生的背景。
- source_word: ἀπιστούντων
  choice: 不信
  rationale: 现在分词表示当时仍在持续的反应；“不信”保留原文的直接力度，又不把它解释为根深蒂固或敌对性的拒绝。
- source_word: ἀπὸ τῆς χαρᾶς
  choice: 因欢喜
  rationale: ἀπό在这里表示原因或来源；“因欢喜”保留了原文中因过度欢喜而一时难以相信的悖论张力。
- source_word: θαυμαζόντων
  choice: 惊奇
  rationale: 该现在分词与ἀπιστούντων并列，表示持续的惊异反应；“惊奇”兼有惊讶和诧异之意，不过度解释其心理状态。
- source_word: Ἔχετέ τι βρώσιμον
  choice: 有什么吃的吗
  rationale: ἔχετε τι构成一般疑问，βρώσιμον指可吃的东西；此译符合现代汉语口语，同时完整传达“有没有可吃之物”的意思。
- source_word: ἐνθάδε
  choice: 这里
  rationale: 直接表达说话现场的位置，简洁自然。
theological_decisions:
- issue: 门徒面对复活之耶稣时“不信”的性质
  choice: 保留“因欢喜而不信”的直接因果表达
  alternative: 译作“欢喜得不敢相信”，明确解释为难以置信而非拒绝相信
  rationale: 原文把“不信”“因欢喜”和“惊奇”并置，形成复杂而矛盾的情绪反应。正文不加入“不敢”等意志性成分，以免替原文消解这种张力；脚注提供较自然的解释性译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“因欢喜而不信”略带反常感，但这是原文有意保留的心理张力；问句则用自然口语“有什么吃的吗”。
