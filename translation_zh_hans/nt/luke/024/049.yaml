  naturalness: 译文整体庄重清楚；但“降在你们身上”和“得着……如同披戴在身上”的搭配不够自然。以“差遣……临到你们身上”及“披戴……能力”可更贴近现代经文汉语，同时保留原文意象。
  terminology: “我父所应许的”恰当地保留了原文未明说其具体所指的含蓄；“能力”对应δύναμις，“高天”可保留ὕψους的崇高、属天空间意象。
