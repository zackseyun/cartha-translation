source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἐγὼ ⸀ἐξαποστέλλω τὴν ἐπαγγελίαν τοῦ πατρός μου ἐφ’ ὑμᾶς· ὑμεῖς δὲ καθίσατε ἐν τῇ ⸀πόλει ἕως οὗ ἐνδύσησθε ⸂ἐξ ὕψους δύναμιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/049.yaml
  text: And look, I am sending the promise of my Father upon you. But stay in the city until you are clothed with power from on high.
translation:
  language: zh_hans
  text: 看哪，我正要差遣我父所应许的，临到你们身上。你们却要留在城里，直到披戴从高天而来的能力。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留引起注意和强调下文的语用功能；用庄重而仍易懂的现代汉语表达。
- source_word: ἐξαποστέλλω
  choice: 我要把……降在
  rationale: 结合宾语“我父所应许的”和介词ἐφ’ ὑμᾶς，表达耶稣将父所应许之事差来并临到门徒；汉语中用“降在……身上”自然衔接。
- source_word: τὴν ἐπαγγελίαν τοῦ πατρός μου
  choice: 我父所应许的
  rationale: 希腊语字面为“我父的应许”，此处以实质化表达保留所应许之事尚未明说的含蓄，避免在正文中直接补成“圣灵”。
- source_word: καθίσατε ἐν τῇ πόλει
  choice: 留在城里
  rationale: καθίσατε在此语境表示停留、等候，而非字面坐下；“城”按上下文指耶路撒冷，但原句未明说，故不补入。
- source_word: ἐνδύσησθε
  choice: 得着……如同披戴在身上
  rationale: 既传达被赋予能力的意义，也保留“穿上、披戴”这一鲜明隐喻。
- source_word: ἐξ ὕψους δύναμιν
  choice: 从高天而来的能力
  rationale: “高天”自然表达ἐξ ὕψους的天上来源；“能力”对应δύναμις，不缩窄为某种具体恩赐。
theological_decisions:
- issue: “我父所应许的”具体所指
  choice: 正文保留为“我父所应许的”
  alternative: 译作“我父所应许的圣灵”
  rationale: 上下文可使读者联想到圣灵，但本节希腊文本没有明说πνεῦμα；不在正文中消除原文的指称含蓄。
- issue: “披戴能力”的隐喻
  choice: 保留“如同披戴在身上”
  alternative: 仅译作“获得能力”
  rationale: 原文ἐνδύσησθε采用衣着隐喻，显示能力从外而来并覆在门徒身上；应避免完全抽象化。
- issue: 能力的来源
  choice: 译为“从高天而来”
  alternative: 译为“从上面来”或“从神而来”
  rationale: “高天”保留ὕψος的空间隐喻和神圣来源，又不直接加入原文未出现的“神”。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“看哪”略带经文语体，用于保留ἰδοὺ的强调；其余句式尽量自然。“得着……如同披戴在身上”兼顾意义清晰与原文隐喻。
