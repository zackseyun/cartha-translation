  text: εἶπεν δὲ πρὸς αὐτούς· Τίνες οἱ λόγοι οὗτοι οὓς ἀντιβάλλετε πρὸς ἀλλήλους περιπατοῦντες; καὶ ⸀ἐστάθησαν σκυθρωποί.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/017.yaml
  text: And he said to them[a], “What are these words that you are exchanging with one another as you walk?” And they stood still[b], looking sad.
translation:
  language: zh_hans
  text: 他对他们说：“你们一边走，一边彼此谈论的这些是什么事呢？”他们就停住了，面带愁容。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν δὲ πρὸς αὐτούς
  choice: 他对他们说
  rationale: λέγω按通常意义译为“说”；δέ在此是轻微的叙事连接，汉语无需机械译出，以保持自然流畅。
- source_word: Τίνες οἱ λόγοι οὗτοι
  choice: 这些是什么事呢
  rationale: λόγοι字面可指“话”，在这里则指两人交谈的内容或事情。现代汉语问“这些是什么事”比“这些是什么话”自然，也与下文所谈事件相符，同时不限定为争论。
- source_word: ἀντιβάλλετε πρὸς ἀλλήλους
  choice: 彼此谈论
  rationale: ἀντιβάλλω表达双方来回交换言语；“彼此谈论”自然呈现其相互性，又避免把语气强化为“争辩”。
- source_word: περιπατοῦντες
  choice: 一边走，一边
  rationale: 分词表示与谈论同时发生的动作；汉语“一边……一边……”清楚自然地传达这种同步关系。
- source_word: ἐστάθησαν
  choice: 停住了
  rationale: 该形式在语境中表示从行走转为站定，即停下来；“停住了”比单说“站着”更准确地表现叙事动作。
- source_word: σκυθρωποί
  choice: 面带愁容
  rationale: 该形容词描述忧愁、阴沉的面容；“面带愁容”既保留可见的神情含义，又符合庄重自然的现代汉语。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“什么事”按语境处理λόγοι；“彼此谈论”保留来回交流的含义而不增添争辩色彩。原文相关词义在本节语境中可直接清楚表达，因此不设脚注。
