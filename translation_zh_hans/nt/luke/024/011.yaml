  text: καὶ ἐφάνησαν ἐνώπιον αὐτῶν ὡσεὶ λῆρος τὰ ῥήματα ⸀ταῦτα, καὶ ἠπίστουν αὐταῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/011.yaml
  text: And these words seemed like nonsense to them, and they did not believe the women.
translation:
  language: zh_hans
  text: 这些话在他们看来仿佛是胡言乱语[a]，他们不相信她们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“像无稽之谈”，或“像神志不清时说的话”。希腊语 λῆρος 指被认为毫无意义或荒唐的话。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφάνησαν
  choice: 看来
  rationale: 在与“仿佛是胡言乱语”连用的评价结构中，该动词表达主观判断，即这些话给他们的印象，而非视觉上的“显现”。
- source_word: ἐνώπιον αὐτῶν
  choice: 在他们看来
  rationale: 原义为“在他们面前”，此处自然表达他们看待这些话的角度；译作“在他们看来”符合现代汉语。
- source_word: ὡσεὶ λῆρος
  choice: 仿佛是胡言乱语
  rationale: ὡσεὶ 表示类比；λῆρος 指被视为毫无道理、荒唐或神志不清时所说的话。“胡言乱语”自然传达这种贬抑性判断，同时不限定其具体成因。
- source_word: τὰ ῥήματα ταῦτα
  choice: 这些话
  rationale: 直接对应指示词与复数名词，既简洁自然，也避免将其进一步解释为“报告”或“消息”。
- source_word: ἠπίστουν
  choice: 不相信
  rationale: 未完成时描写当时持续的反应；“不相信”准确表达不信，并不额外加入“拒绝相信”所暗示的意志性。
- source_word: αὐταῖς
  choice: 她们
  rationale: 该代词为阴性复数，承接上文的妇女；汉语阴性复数代词既保留代词形式，也清楚显示所指。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“在他们看来”自然呈现评价视角；“胡言乱语”是普通读者易懂的现代表达。保留“她们”这一阴性复数代词，不将其改写成名词短语。
