base_translation:
  language: en
  yaml_path: translation/nt/luke/024/001.yaml
  text: But on the first day of the week[a], at early dawn, they came to the tomb, bringing the spices they had prepared.
translation:
  language: zh_hans
  text: 但在一周的第一日[a]，清晨很早，她们来到坟墓，带着所预备的香料。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一周的第一日”直译可作“诸安息日中的第一日”；这是当时指一周第一日的惯用说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ δὲ μιᾷ τῶν σαββάτων
  choice: 但七日的第一日
  rationale: 这是闪语背景下的通行希腊语时间表达，指一周的第一日。译作“七日的第一日”既自然，又保留与安息日周期的联系。
- source_word: ὄρθρου βαθέως
  choice: 天刚蒙蒙亮
  rationale: ὄρθρου指黎明，βαθέως加强时间之早；“天刚蒙蒙亮”以现代汉语自然表达黎明很早的时候，而不生硬直译为“深黎明”。
- source_word: ἐπὶ τὸ μνῆμα
  choice: 来到坟墓那里
  rationale: ἐπί与趋向动词连用表示朝向并到达某处；μνῆμα在此指安葬耶稣的墓穴，译作“坟墓”清楚自然。
- source_word: ἦλθον
  choice: 就来到
  rationale: 不定过去时叙述她们来到该地点；“来到”符合汉语叙事视角，“就”使时间背景与主句衔接自然。
- source_word: φέρουσαι
  choice: 带着
  rationale: 现在分词表示与“来到”同时发生的伴随动作；汉语用“带着”简洁自然。
- source_word: ἃ ἡτοίμασαν ἀρώματα
  choice: 所预备的香料
  rationale: ἀρώματα指用于安葬的芳香香料；关系从句按汉语语序前置为“所预备的”，不额外补入经文未明说的用途。
theological_decisions:
- issue: 复活叙事中τῇ μιᾷ τῶν σαββάτων的时间含义
  choice: 七日的第一日
  alternative: 安息日的第一日／安息日后的第一日
  rationale: 该短语按当时惯用法指一周的第一日。“七日的第一日”传达其正常历法意义，同时不引入原文未要求的宗派性年代计算。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“天刚蒙蒙亮”自然传达ὄρθρου βαθέως所强调的清晨极早时分；脚注标记置于整句末，说明时间惯用语。
