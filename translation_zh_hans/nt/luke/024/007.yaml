reference: Luke 24:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: λέγων ⸂τὸν υἱὸν τοῦ ἀνθρώπου ὅτι δεῖ⸃ παραδοθῆναι εἰς χεῖρας ἀνθρώπων ἁμαρτωλῶν καὶ σταυρωθῆναι καὶ τῇ τρίτῃ ἡμέρᾳ ἀναστῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/007.yaml
  text: saying that the Son of Man must be delivered into the hands of sinful men and be crucified and on the third day rise again[a][b].
translation:
  language: zh_hans
  text: 说：“人子必须被交在罪人手里[a]，被钉十字架，并在第三天复活[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“被交付到罪人手中。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“起来。”希腊原文为主动形式，不是“被使复活”。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: 说
  rationale: 保留现在分词与上一节“他怎样告诉你们”的衔接；汉语用“说”自然引出所引述的话，不另加原文没有的主语。
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: 人子
  rationale: 这是福音书中耶稣自称的固定称谓，也保留其与《但以理书》等经文的互文联系。
- source_word: ὅτι δεῖ
  choice: 必须
  rationale: δεῖ 表达必要性；在路加的叙事中常涉及上帝计划必然成就，不宜弱化为单纯的未来预告。汉语引语中用现在式“必须”也很自然。
- source_word: παραδοθῆναι
  choice: 被交
  rationale: 该被动不定式指被交出、交付；“被交”简洁地保留被动意义，又不把范围缩窄为犹大的“出卖”。
- source_word: εἰς χεῖρας
  choice: 在……手里
  rationale: 保留“落入某人权势之下”的手的意象，同时符合现代汉语习惯。
- source_word: ἀνθρώπων ἁμαρτωλῶν
  choice: 罪人
  rationale: “罪人”在现代汉语中自然、明确，并涵盖原文“有罪的人”之意；此处无需生硬地译出 ἀνθρώπων 为“人们”。
- source_word: σταυρωθῆναι
  choice: 被钉十字架
  rationale: 准确表达被动不定式及罗马钉十字架的刑罚，措辞简洁庄重。
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: 在第三天
  rationale: 自然表达时间与格的意义，不添加原文没有的起算说明。
- source_word: ἀναστῆναι
  choice: 复活
  rationale: 在汉语中“复活”可作不及物动词，准确表达从死里起来；既自然，又不将原文主动形式改成“被复活”。
theological_decisions:
- issue: δεῖ 在受难预告中的力度
  choice: 译作“必须”，保留上帝救赎计划中的必要性
  alternative: 译作“将要”，仅表达未来事件
  rationale: “必须”既忠实呈现 δεῖ 的必要意味，也不进一步解释这种必要性的机制，从而保留经文本身的神学张力。
- issue: ἀναστῆναι 的语态
  choice: 译作主动意义的“复活”
  alternative: 译作被动的“被使复活”或“被复活”
  rationale: 原文是不定过去主动不定式。译文不应因其他经文可使用被动表达，就在此处改变其语态。
- issue: ἀνθρώπων ἁμαρτωλῶν 的称谓
  choice: 译作“罪人”
  alternative: 译作“有罪的男人”或“有罪的人们”
  rationale: 原文复数阳性可按通常的语法用法指相关的人；上下文虽涉及男性执行者，但该短语本身强调其有罪身份。“罪人”自然且不额外限定原文所未明说的性别范围。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“被交在……手里”保留原文意象；“被钉十字架”沿用读者熟悉且准确的表达；“复活”在现代汉语中自然承载主动的从死里起来之意。引号表明这是上一节所提耶稣话语的直接引述。
