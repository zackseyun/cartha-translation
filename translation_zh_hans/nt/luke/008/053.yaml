  text: καὶ κατεγέλων αὐτοῦ, εἰδότες ὅτι ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/053.yaml
  text: And they were laughing at him, because they knew that she had died.
translation:
  language: zh_hans
  text: 他们因知道她已经死了，就嘲笑他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατεγέλων
  choice: 嘲笑
  rationale: 该动词带有讥讽、取笑的意味；未完成时描写当时正在发生的反应。现代汉语的“嘲笑”既自然，也保留了针对耶稣话语的轻蔑意味。
- source_word: αὐτοῦ
  choice: 耶稣
  rationale: 原文为第三人称代词“他”，指向上文的耶稣。汉语若直译“嘲笑他”也可，但明确为“耶稣”能避免本节独立呈现时指代含混，并未改变所指对象。
- source_word: εἰδότες
  choice: 明知
  rationale: 该完成时主动分词表示他们已经知道并确信这一事实，在句中具有原因或背景作用。“明知……就……”自然地表达其认知状态与嘲笑行为之间的关联，同时比单纯的“知道”更能体现他们自以为确定。
- source_word: ὅτι
  choice: （引出“她已经死了”这一认知内容）
  rationale: ὅτι在这里引出εἰδότες的内容，即他们知道的事实；汉语无需另译一个连接词。
- source_word: ἀπέθανεν
  choice: 已经死了
  rationale: 不定过去时陈述死亡这一已发生的事件。“已经死了”保留事件性，并符合汉语叙事中对先行完成事实的表达。
theological_decisions:
- issue: 是否把耶稣的话理解为否认女孩真实死亡
  choice: 仅陈述众人认定她已经死了，不在本节替耶稣的话作神学解释
  alternative: 译成“他们知道她其实已经死了”，从而强化与耶稣话语的表面冲突
  rationale: 原文只说明众人因知道她死了而嘲笑耶稣；本节既未否定其死亡，也未解释耶稣所说“睡着了”的确切意义，应保留叙事张力。
- issue: 是否补出死亡者的身份
  choice: 用“她”承接上下文
  alternative: 译作“女孩”或“孩子”
  rationale: 原文动词没有明说名词主语，但上下文清楚指向睚鲁的女儿；“她”保持原文简练，不额外增添称谓。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“众人……就……”使因果关系清楚；“嘲笑”准确传达讥讽语气。未完成时的持续性在汉语中不宜机械加“正在”，以免显得累赘；语境已足以呈现当时持续的反应。
