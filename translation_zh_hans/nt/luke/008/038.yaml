  text: ἐδεῖτο δὲ αὐτοῦ ὁ ἀνὴρ ἀφ’ οὗ ἐξεληλύθει τὰ δαιμόνια εἶναι σὺν αὐτῷ· ἀπέλυσεν δὲ ⸀αὐτὸν λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/038.yaml
  text: The man from whom the demons had gone out was begging him to be with him, but he sent him away, saying,
translation:
  language: zh_hans
  text: 鬼已经从他身上出去的那个人恳求耶稣，好与耶稣在一起；耶稣却打发他走，说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδεῖτο
  choice: 恳求
  rationale: 未完成时表示持续或反复的请求；“恳求”自然地传达其迫切程度，又不过度夸张。
- source_word: ὁ ἀνὴρ
  choice: 那人
  rationale: 指前文已经出现并获释放的男子；现代汉语叙事中“那人”比“那个男人”更自然庄重。
- source_word: ἀφ’ οὗ ἐξεληλύθει τὰ δαιμόνια
  choice: 鬼已经从他身上出去
  rationale: 保留完成时所表达的先前已成事实，并以“从他身上出去”清楚呈现脱离其人的含义。
- source_word: τὰ δαιμόνια
  choice: 鬼
  rationale: 这是新约语境中对 δαιμόνια 的直接、通行译法，保留经文所陈述的超自然实体，不淡化为含混的心理或道德现象。
- source_word: εἶναι σὺν αὐτῷ
  choice: 让他跟随左右
  rationale: 表达“与他同在”的请求在此行旅叙事中的自然含义；“跟随左右”比生硬的“和他在一起”更符合现代汉语，同时不预断正式门徒身份。
- source_word: ἀπέλυσεν αὐτὸν
  choice: 打发他回去
  rationale: 结合下一节的明确命令，表示耶稣不准其随行而让他离开；“回去”在汉语中自然，并由紧接下来的话得到语境支持。
- source_word: λέγων
  choice: 说
  rationale: 汉语以“说”引出下一节的直接引语，比直译分词结构更流畅。
theological_decisions:
- issue: δαιμόνια 在赶鬼叙事中的译法
  choice: 鬼
  alternative: 邪灵
  rationale: “鬼”直接对应该词在本段中的超自然、具行动能力的存在，且与路加福音传统中文用语相合；不将其弱化为疾病或心理状态。
- issue: εἶναι σὺν αὐτῷ 是否表示正式作门徒
  choice: 跟随左右
  alternative: 和他在一起
  rationale: 此语确有陪伴、随行之意，但原文没有明说正式门徒身份；译文保留随行色彩而不加入制度化身份。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。以插入性同位结构说明此人的身份，并重复“耶稣”以消除连续代词在汉语中的指向含混。句末保留冒号，承接下一节直接引语。
