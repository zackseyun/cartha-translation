  text: οὐ γάρ ἐστιν κρυπτὸν ὃ οὐ φανερὸν γενήσεται, οὐδὲ ἀπόκρυφον ὃ οὐ ⸂μὴ γνωσθῇ⸃ καὶ εἰς φανερὸν ἔλθῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/017.yaml
  text: For nothing is hidden that will not become evident[c][b][a], nor is anything secret that will not be known and come to light.
translation:
  language: zh_hans
  text: 因为没有什么隐藏的事不会显明，也没有什么隐秘的事不会被知晓、不会显露出来。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“因为没有什么隐藏的事不会成为显明的，也没有什么隐秘的事不会被知晓并进入公开之处。” “不会被知晓”所对应的希腊文否定结构语气很强；在“没有什么……不会……”的句式中，意思是没有任何隐秘的事会一直不为人知。
    reason: 说明“成为显明的”及“进入公开之处”的较直译表达，并提示希腊文强烈否定在本句双重否定结构中的含义。
lexical_decisions:
- source_word: κρυπτὸν
  choice: 隐藏的事
  rationale: κρυπτός指被隐藏、遮掩之物；“隐藏的事”自然清楚，并与后面的“显明”形成对照。
- source_word: φανερὸν γενήσεται
  choice: 会显明
  rationale: φανερός与κρυπτός相对，γενήσεται表达状态的转变；“会显明”简洁保留由隐藏转为公开可见的含义。
- source_word: ἀπόκρυφον
  choice: 隐秘的事
  rationale: ἀπόκρυφος指隐蔽、秘密之物；用“隐秘的事”既保持与前句的平行，也稍微体现与κρυπτός的词汇差别。
- source_word: οὐ μὴ γνωσθῇ
  choice: 不会被人知道
  rationale: 在外层否定关系结构中，οὐ μή强烈否定任何隐秘之事会一直不为人知；汉语以双重否定自然传达其必被知晓的意思。补出“被人”使被动意义清楚，但不限定具体知晓者。
- source_word: εἰς φανερὸν ἔλθῃ
  choice: 不会显露出来
  rationale: 该短语字面为“进入显明之中”，表达从隐蔽状态进入公开状态；“显露出来”是自然、庄重的现代汉语。
- source_word: γάρ
  choice: 因为
  rationale: γάρ说明本节是上一节话语的理由或根据；“因为”在现代汉语中自然体现解释关系。
theological_decisions:
- issue: 显露之原则的范围
  choice: 保留为凡隐藏、隐秘之事终将显露的一般性陈述
  alternative: 明确限定为末日审判时的揭露，或仅指耶稣教导的传开
  rationale: 经文本身没有明说显露发生的具体时间或唯一应用，因此译文不将其缩窄为某一种末世论或语境解释。
- issue: οὐ μή的强调程度
  choice: 以平行的双重否定结构表达必然显露
  alternative: 直译为肯定句“必定会被人知道”
  rationale: 双重否定既贴近希腊文句法，也在现代汉语中清楚传达没有例外的强烈断言；脚注提示可用肯定式理解。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。保留原文两个近义平行分句及否定关系结构；“显明”与“显露出来”避免过度口语化，也不预先限定显露的时间或神学场景。
