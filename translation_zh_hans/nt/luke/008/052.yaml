  text: ἔκλαιον δὲ πάντες καὶ ἐκόπτοντο αὐτήν. ὁ δὲ εἶπεν· Μὴ κλαίετε, ⸂οὐ γὰρ⸃ ἀπέθανεν ἀλλὰ καθεύδει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/052.yaml
  text: And they were all weeping and mourning for her. But he said[a], “Do not weep, for she has not died, but is sleeping.”
translation:
  language: zh_hans
  text: 众人都在为她哭泣哀悼。耶稣却说：“不要哭了，因为她并没有死，而是在睡觉。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在睡觉”也可译作“睡着了”。耶稣在这里用睡眠来描述她的状况。
    reason: 说明καθεύδει可采用的自然中文表达，并保留其在本段中的比喻性张力，不预先解释女孩状况的确切性质。
lexical_decisions:
- source_word: ἔκλαιον
  choice: 都在……哭泣
  rationale: 未完成时表示当时持续进行的哭泣；“在……哭泣”自然保留其延续意味。
- source_word: πάντες
  choice: 众人都
  rationale: 明确保留 πάντες 的全称范围，同时符合现代汉语表达。
- source_word: ἐκόπτοντο αὐτήν
  choice: 为她……哀悼
  rationale: κόπτομαι 在丧事语境中指哀恸，可能伴随捶胸等动作；“哀悼”传达其语境意义而不把隐含动作明说为经文明载。
- source_word: Μὴ κλαίετε
  choice: 不要哭了
  rationale: μή 加现在时命令式在此可表示停止正在进行的动作；“不要哭了”符合前文众人正在哭泣的语境。
- source_word: οὐ γὰρ
  choice: ；……并没有
  rationale: γάρ说明禁止哭泣的理由。中文用分号及后续陈述自然承接因由，避免生硬直译“因为”。
- source_word: ἀπέθανεν
  choice: 并没有死
  rationale: 忠实表达不定过去时所述的死亡事件，并以“并没有”与后面的“而是”形成鲜明对照。
- source_word: καθεύδει
  choice: 在睡觉
  rationale: 现在时动词直译为进行中的“在睡觉”，保留耶稣以睡眠描述女孩处境的原有措辞，不解释为单纯外观或永久死亡。
theological_decisions:
- issue: 耶稣说女孩“没有死，而是在睡觉”
  choice: 在正文中保留“并没有死，而是在睡觉”的表面张力
  alternative: 解释为“她并非永久死亡”或“她其实只是睡着了”
  rationale: 原文没有在这句话中明说睡眠与死亡的确切关系；直译耶稣的话，可保留其隐喻性或启示性的叙事张力，避免把某一解释写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“哭泣哀悼”既呈现持续哭泣，也表达丧事中的哀恸；“不要哭了”贴合正在发生的动作。脚注标记置于相关引语之后。
