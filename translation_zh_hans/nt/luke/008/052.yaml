  naturalness: “众人都在为她哭泣哀悼”和“不要哭了”自然、庄重。“她并没有死，而是在睡觉”可以理解，但在本节的直接引语中，以“因为”连接理由会比仅用分号更清楚，也更贴合现代汉语。
  terminology: “哀悼”恰当地涵盖κόπτομαι在丧葬语境中的哀恸，而不擅自加入捶胸动作。“睡觉”保留καθεύδει的动词性表达；脚注可提示“睡着了”这一自然替代说法，但不应将其定性为女孩“即将恢复生命”。
