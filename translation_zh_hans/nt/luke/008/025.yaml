id: LUK.8.25
reference: Luke 8:25
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτοῖς· ⸀Ποῦ ἡ πίστις ὑμῶν; φοβηθέντες δὲ ἐθαύμασαν, λέγοντες πρὸς ἀλλήλους· Τίς ἄρα οὗτός ἐστιν ὅτι καὶ τοῖς ἀνέμοις ἐπιτάσσει καὶ τῷ ὕδατι, καὶ ὑπακούουσιν αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/025.yaml
  text: Then he said to them[a], “Where is your faith?” And being afraid, they marveled, saying to one another, “Who then is this, that he commands even the winds and the water, and they obey him?”
translation:
  language: zh_hans
  text: 他对他们说：“你们的信心[a]在哪里？”他们又害怕又惊奇，彼此说：“这到底是谁？他竟然吩咐风和水，连风和水也听从他！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“信靠”。耶稣的问题也可理解为：“你们的信靠在哪里？”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ποῦ
  choice: 在哪里
  rationale: 保留希腊文直接询问信心所在或是否显现的表达，不扩展为解释性的“为什么没有”。
- source_word: πίστις
  choice: 信心
  rationale: “信心”是现代中文中自然且宽泛的对应词；在本语境中也包含危难中信靠耶稣的含义。
- source_word: φοβηθέντες δὲ ἐθαύμασαν
  choice: 他们又害怕又惊奇
  rationale: 以自然中文表达两个相伴的反应，既保留恐惧，也保留因神迹而生的惊奇，不额外强化程度。
- source_word: Τίς ἄρα οὗτός ἐστιν
  choice: 这到底是谁
  rationale: “到底”自然传达ἄρα在惊讶追问中的推论和强调语气。
- source_word: ἐπιτάσσει
  choice: 吩咐
  rationale: 直接表达命令、发令之意，同时适合风和水受命的叙事语境；不借用上一节“斥责”的措辞。
- source_word: τοῖς ἀνέμοις ... καὶ τῷ ὕδατι
  choice: 风和水
  rationale: 贴近路加明确使用的复数“风”和单数“水”，不按平行经文改成“风浪”或“海”。
- source_word: ὑπακούουσιν αὐτῷ
  choice: 听从他
  rationale: “听从”在中文中清楚表达服从命令，也保留受造界拟人化回应的效果。
theological_decisions:
- issue: πίστις在此处可兼有“信靠”之意
  choice: 信心
  alternative: 信靠
  rationale: 正文采用较为稳定且宽广的“信心”，脚注提示本语境也可理解为“信靠”，避免把两者的语义张力静默消除。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“这到底是谁”体现门徒惊惧中的追问；末句用“连……也……”自然呈现καί的强调作用。
