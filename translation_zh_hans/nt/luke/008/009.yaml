base_translation:
  language: en
  yaml_path: translation/nt/luke/008/009.yaml
  text: Then his disciples asked him what this parable meant[a].
translation:
  language: zh_hans
  text: 门徒问耶稣，这个比喻是什么意思[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“这个比喻是什么。”
    reason: 保留τίς……εἴη在间接问句中较贴近字面的表达；中文不以“会”附加原文未明确表达的将来或推测意味。
lexical_decisions:
- source_word: Ἐπηρώτων
  choice: 问
  rationale: 未完成时可表示过去持续或反复的询问；中文叙事中用简洁的“问”最自然，不必强行显明体貌。
- source_word: δὲ
  choice: 不另译
  rationale: δέ在此是轻微的叙事连接词；上下文已足以体现承接关系，汉语省译更流畅，也不误添转折。
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: 门徒
  rationale: “门徒”是μαθηταί在福音书语境中的通行译法。此处将αὐτοῦ所指的耶稣转为宾语“耶稣”，避免同一句中重复使用“他的……他”的生硬表达，同时关系仍然清楚。
- source_word: τίς αὕτη εἴη ἡ παραβολή
  choice: 这个比喻是什么意思
  rationale: 希腊文直译近于“这个比喻会是什么”；结合语境，问题所求是比喻的含义。译作“是什么意思”符合现代汉语，也以脚注保留较直译的表达。
- source_word: παραβολή
  choice: 比喻
  rationale: “比喻”是福音书中παραβολή的传统且自然的中文对应词，在本段指借故事或类比传达意义的教导。
theological_decisions: []
