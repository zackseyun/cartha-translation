  text: καὶ γυνὴ οὖσα ἐν ῥύσει αἵματος ἀπὸ ἐτῶν δώδεκα, ἥτις ⸂ἰατροῖς προσαναλώσασα ὅλον τὸν βίον⸃ οὐκ ἴσχυσεν ⸀ἀπ’ οὐδενὸς θεραπευθῆναι,
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/043.yaml
  text: And a woman who had been in a flow of blood for twelve years[a], and who had spent her whole livelihood on physicians, was not able to be healed by anyone[c][b],
translation:
  language: zh_hans
  text: 有一个女人，患血漏已有十二年[a]；她把赖以生活的一切资财都花在医生身上[b][c]，却没有人能治好她。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“患持续性出血”或“患出血症”。
    reason: lexical_alternative
  - marker: b
    text: “赖以生活的一切资财”原文指她维持生活的全部资源，并不是指她的生命。
    reason: lexical_alternative
  - marker: c
    text: 有些抄本省略“她把赖以生活的一切资财都花在医生身上”这句话（或相当的措辞）。本句依照SBLGNT正文。
    reason: textual_variant
lexical_decisions:
- source_word: γυνὴ οὖσα
  choice: 有一个女人患
  rationale: 将分词结构按汉语叙事习惯译为背景性陈述，以“有一个女人”引出人物，并与病症自然衔接。
- source_word: ἐν ῥύσει αἵματος
  choice: 患血漏
  rationale: “血漏”简洁保留持续出血这一具体病症，并符合庄重的圣经叙事语体；脚注补充现代直白说法。
- source_word: ἀπὸ ἐτῶν δώδεκα
  choice: 已经十二年
  rationale: 此处介词短语表示持续时间；“已经十二年”是自然、准确的现代汉语。
- source_word: ἥτις
  choice: 她
  rationale: 关系代词引入对该女人的补充描述；汉语另起分句以代词承接更自然。
- source_word: ἰατροῖς
  choice: 在医生身上
  rationale: 与“耗尽”搭配，表明钱财用于求医，既贴近与格关系，也避免增加原文未明说的治疗细节。
- source_word: προσαναλώσασα
  choice: 耗尽了
  rationale: 该词表示花费直至用尽；“耗尽”比单纯“花了”更能传达全部资源被用完。
- source_word: ὅλον τὸν βίον
  choice: 全部生计
  rationale: βίος在此指赖以生活的资财或生活来源，并非生物意义上的生命；“全部生计”保留这一含义。
- source_word: οὐκ ἴσχυσεν
  choice: 却……不能
  rationale: 表达能力或可能性的否定；“却”体现求医耗资与仍未痊愈之间的转折。
- source_word: ἀπ’ οὐδενὸς
  choice: 没有人
  rationale: 在被动不定式的施事结构中表示无人能够施行医治；汉语改用主动表达更自然。
- source_word: θεραπευθῆναι
  choice: 能治好她
  rationale: 将被动式自然转换为汉语主动结构，保留完全治愈之意。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“血漏”保留传统而具体的病症表达，并以脚注解释；“全部生计”避免把βίος误解为“整个人生”。主句改为“没有人能治好她”，是对希腊文被动结构的自然汉语表达，未改变其无人能够医治的含义。
