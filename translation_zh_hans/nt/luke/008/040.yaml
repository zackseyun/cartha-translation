base_translation:
  language: en
  yaml_path: translation/nt/luke/008/040.yaml
  text: When Jesus returned[a], the crowd welcomed him[b], for they were all waiting for him.
translation:
  language: zh_hans
  text: 耶稣回来时，众人欢迎他[a]，因为他们都在等候他[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“接待他”；希腊文此处的动词可指接待或欢迎，在上下文中带有正面的意味。
    reason: lexical_alternative
  - marker: b
    text: 或译“因为他们全都在期待他”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ τῷ ὑποστρέφειν
  choice: 回来的时候
  rationale: ἐν加冠词化不定式构成时间从句；现代汉语自然译为“……回来的时候”。δέ在此推进叙事，无须机械译出。
- source_word: ὑποστρέφειν
  choice: 回来
  rationale: ὑποστρέφω表示返回、回来；“回来”符合上下文，也比“返回”更自然。
- source_word: ἀπεδέξατο
  choice: 欢迎
  rationale: ἀποδέχομαι在此表示正面地接待；“欢迎”准确传达其积极意味，又不额外加入“欢喜”等原文没有的成分。
- source_word: ὁ ὄχλος
  choice: 众人
  rationale: ὄχλος指聚集的人群；“众人”在叙事中自然、庄重，也保留其集合意义。
- source_word: ἦσαν γὰρ πάντες προσδοκῶντες αὐτόν
  choice: 因为他们一直在等他
  rationale: γάρ说明众人欢迎耶稣的原因；προσδοκάω可指等候或期待，“一直在等”符合情境，并体现未完成过去时与现在分词所表达的持续状态。
- source_word: πάντες
  choice: 都
  rationale: 明确保留πάντες的全体含义，表示在场众人都在等候。
- source_word: Ἰησοῦν
  choice: 耶稣
  rationale: 采用现代简体中文圣经语境中通行的人名译法。
theological_decisions: []
translation_notes:
  register: 采用现代、自然、庄重的叙事语言。“众人都欢迎他”避免书面色彩较重的“群众接待他”；“一直在等他”清楚表现持续等候，并保留“等候/期待”之间的语义张力于自然语境中。
