revisions:
- from: 他们航行的时候，耶稣睡着了。忽然，一阵狂风刮下湖面，船里不断灌进水来[a]，他们处境危险。
  to: 他们正在航行时，耶稣睡着了。一阵暴风降到湖上，船不断进水[a]，他们正处于危险中。
  rationale: 修订以“降到湖上”对应风暴下降至湖面的空间意象，删除原文未明说的“忽然”，并以“船不断进水”自然表达持续性的险情。脚注保留原文在主语/所指上的歧义，不将一种解释绝对化。
