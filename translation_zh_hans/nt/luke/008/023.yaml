review_pass:
  verdict: revise
  source_fidelity: 草稿准确传达了航行、耶稣入睡、风暴和危险，但“刮下湖面”在汉语中较像风沿湖面吹过，未充分表达κατέβη εἰς τὴν λίμνην“降到湖上”的方向；“忽然”虽合情境，却不是原文明确表达的成分。
  naturalness: “他们航行的时候”自然；“船里不断灌进水来”也通顺，但改为“船不断进水”更简洁，并与后文人物处于险境的关系更清楚。
  terminology: “暴风”“降到湖上”“处于危险中”适合现代标准汉语的庄重叙事体。“船”是由语境补出的隐含对象，宜以脚注说明原文复数被动式的表述及其歧义。
  issues:
  - severity: medium
    issue: “一阵狂风刮下湖面”未准确表达κατέβη εἰς τὴν λίμνην。
    rationale: κατέβη的意象是风暴降下、来到湖上；“刮下湖面”较易理解为风在湖面上吹刮，且“下”可被误解为向下刮过湖面。
  - severity: low
    issue: 正文添加“忽然”。
    rationale: 原文没有与“忽然”直接对应的副词；风暴发生可带突发感，但无需在译文中明说。
  - severity: low
    issue: 脚注的“他们渐渐被水淹没”没有清楚说明正文“船”是语境性补足，也未反映“被灌满”这一较贴近原文形式的表述。
    rationale: 应说明原文的复数被动动词在指涉上不寻常，避免读者将脚注视为唯一替代译法。
  revised_text: 他们正在航行时，耶稣睡着了。一阵暴风降到湖上，船不断进水[a]，他们正处于危险中。
