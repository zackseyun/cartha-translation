  text: πλεόντων δὲ αὐτῶν ἀφύπνωσεν. καὶ κατέβη λαῖλαψ ἀνέμου εἰς τὴν λίμνην, καὶ συνεπληροῦντο καὶ ἐκινδύνευον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/023.yaml
  text: And as they were sailing[a], he fell asleep. And a windstorm came down on the lake, and they were being swamped and were in danger.
translation:
  language: zh_hans
  text: 他们正在航行时，耶稣睡着了。一阵暴风降到湖上，船不断进水[a]，他们正处于危险中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译可作：“他们不断被灌满。”这复数被动式通常按上下文理解为船不断进水；也可理解为船上的人正被水淹没。
    reason: 保留συνεπληροῦντο的异常复数被动形式及其语境上的两种理解，同时说明正文补出“船”的依据。
lexical_decisions:
- source_word: πλεόντων δὲ αὐτῶν
  choice: 他们航行的时候
  rationale: 属格独立结构和现在分词表示与主句同时进行的背景动作；此译自然地保留持续航行之意。
- source_word: ἀφύπνωσεν
  choice: 耶稣睡着了
  rationale: 不定过去时在这里具有起始意味，译作“睡着了”比静态的“睡了”更准确；主语“耶稣”由上下文明确，为避免中文指代含混而补出。
- source_word: κατέβη
  choice: 刮下
  rationale: 保留风暴从高处突然降到湖面的方向意象，同时符合现代汉语描述强风的习惯。
- source_word: λαῖλαψ ἀνέμου
  choice: 一阵狂风
  rationale: 该短语指猛烈的风暴；“狂风”简洁自然，并保留原文对风的强调。
- source_word: εἰς τὴν λίμνην
  choice: 湖面
  rationale: 与“刮下”连用，自然表达风暴降临湖上的景象，不机械直译介词为“进入湖里”。
- source_word: συνεπληροῦντο
  choice: 船里不断灌进水来
  rationale: 未完成时表示进水持续发生；原文复数被动形式在所指上不寻常，语境所描绘的是船进水。正文采用清楚自然的汉语，脚注保留另一种贴近语法形式的理解。
- source_word: ἐκινδύνευον
  choice: 他们处境危险
  rationale: 未完成时表达危险持续存在；此译清楚、庄重，也避免古旧措辞。
theological_decisions: []
translation_notes:
  register: 采用现代、自然而庄重的叙事语言。“忽然”体现事件突发性，虽非对应单独的希腊词，却由“狂风刮下”的叙事转折和不定过去时事件自然传达。
