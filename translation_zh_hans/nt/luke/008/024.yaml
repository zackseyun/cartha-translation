id: LUK.8.24
reference: Luke 8:24
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: προσελθόντες δὲ διήγειραν αὐτὸν λέγοντες· Ἐπιστάτα ἐπιστάτα, ἀπολλύμεθα· ὁ δὲ ⸀διεγερθεὶς ἐπετίμησεν τῷ ἀνέμῳ καὶ τῷ κλύδωνι τοῦ ὕδατος, καὶ ἐπαύσαντο, καὶ ἐγένετο γαλήνη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/024.yaml
  text: Then they came and woke him[a], saying, “Master, Master, we are perishing!” And he, having awakened, rebuked the wind and the surging of the water, and they ceased, and there was a calm.
translation:
  language: zh_hans
  text: 他们上前叫醒他，说：“老师，老师！我们快要丧命了！”他醒过来后，斥责风和水的翻涌[a]；风和水的翻涌都平息了，于是一片平静。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “水的翻涌”或译“翻腾的水浪”。
    reason: κλύδων可指水的涌动、翻腾或浪涛；“水的翻涌”保留动态意象，另一译法体现其可指浪涛的含义。
lexical_decisions:
- source_word: προσελθόντες
  choice: 上前
  rationale: 表达门徒朝耶稣靠近、继而叫醒他的伴随动作，不额外说明位置或方式。
- source_word: διήγειραν
  choice: 叫醒
  rationale: 自然表达使睡着的人醒来，准确传达主动及物形式。
- source_word: Ἐπιστάτα
  choice: 老师
  rationale: 在现代汉语中是自然的尊称，也能体现门徒承认耶稣的权威；避免使用可能被理解为神学称号的“主”。
- source_word: ἀπολλύμεθα
  choice: 我们要丧命了
  rationale: 传达眼前持续而迫近的死亡危险，语气急切而不失庄重。
- source_word: διεγερθεὶς
  choice: 他醒来
  rationale: 简洁保留醒来后行动的次序，不明确断定是自行醒来还是被人唤醒。
- source_word: ἐπετίμησεν
  choice: 斥责
  rationale: 保留该动词所表达的强烈、权威性的制止，符合福音书语境。
- source_word: ἀνέμῳ
  choice: 风
  rationale: 采用该词直接、朴素的词义，不扩写为暴风。
- source_word: κλύδωνι τοῦ ὕδατος
  choice: 水的涌浪
  rationale: 兼顾κλύδων的翻涌、浪涛之意和τοῦ ὕδατος的属格表达，避免只译作笼统的“浪”。
- source_word: ἐπαύσαντο
  choice: 它们就止息了
  rationale: “它们”回指风和水的涌浪，保留希腊文复数谓语所呈现的两个对象。
- source_word: ἐγένετο γαλήνη
  choice: 于是一片平静
  rationale: 以自然汉语表达风浪止息后出现平静的结果，同时避免添加原文没有的景物细节。
theological_decisions:
- issue: 对耶稣称呼Ἐπιστάτα的翻译
  choice: 老师
  alternative: 夫子；主人
  rationale: “老师”是现代读者易懂的尊称，并在上下文中表达耶稣的权威；“夫子”较古雅，“主人”则容易引入主仆关系或与“主”这一称号混淆。
- issue: ἐπετίμησεν所呈现的耶稣对自然的权威
  choice: 斥责
  alternative: 命令；喝止
  rationale: “斥责”保留福音书中这一动词强烈而具权威的语气，让经文本身呈现耶稣对风浪的直接权柄，不另加神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。门徒的话以重复称呼和感叹号体现急迫；叙述部分保持简洁，并用“它们”保留原文复数指向。
