source:
  edition: SBLGNT
  text: ἐξελθόντα δὲ τὰ δαιμόνια ἀπὸ τοῦ ἀνθρώπου εἰσῆλθον εἰς τοὺς χοίρους, καὶ ὥρμησεν ἡ ἀγέλη κατὰ τοῦ κρημνοῦ εἰς τὴν λίμνην καὶ ἀπεπνίγη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/033.yaml
  text: Then the demons came out of the man and entered the pigs[a], and the herd rushed down the steep bank into the lake and drowned.
translation:
  language: zh_hans
  text: 于是，群鬼从那人身上出来，进入猪群；整群猪沿着陡坡[a]冲进湖里，淹死了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“从峭壁冲下去”或“越过陡崖冲下去”；希腊语表示从陡峭处向下运动。
    reason: 词义存在地形强度上的合理译法差异。
lexical_decisions:
- source_word: ἐξελθόντα
  choice: 出来
  rationale: 不定过去时分词表示先于主要动词发生的动作；用“出来”自然呈现事件顺序。
- source_word: τὰ δαιμόνια
  choice: 群鬼
  rationale: δαιμόνια特指邪灵性的“鬼”，并且是复数；“群鬼”简洁保留复数和叙事语境，不改作较宽泛的“污灵”。
- source_word: ἀπὸ τοῦ ἀνθρώπου
  choice: 从那人身上
  rationale: 所指是上文那个被鬼附的人；“从那人身上出来”符合现代汉语表达。
- source_word: εἰσῆλθον εἰς τοὺς χοίρους
  choice: 进入猪群
  rationale: 表达群鬼进入那些猪；汉语以“猪群”自然指称这批猪，也与下文的整群相衔接。
- source_word: ὥρμησεν
  choice: 冲
  rationale: 该动词表示突然而猛烈地向前移动；“冲”准确而不额外推断动机。
- source_word: ἡ ἀγέλη
  choice: 整群猪
  rationale: ἀγέλη是牲畜的群体；结合上下文明确译为“整群猪”。
- source_word: κατὰ τοῦ κρημνοῦ
  choice: 沿着陡坡
  rationale: κατά加属格在此表达顺坡向下的运动；κρημνός指陡峭的坡岸，但未必是垂直悬崖。
- source_word: εἰς τὴν λίμνην
  choice: 进湖里
  rationale: λίμνη通常指湖；保留路加所用词与“海”的词汇区别。
- source_word: ἀπεπνίγη
  choice: 淹死了
  rationale: 该不定过去时被动形式在落水语境中表示溺亡；现代汉语“淹死了”自然清楚，无须机械显示希腊语被动态。
theological_decisions:
- issue: δαιμόνια在赶鬼叙事中的译法
  choice: 群鬼
  alternative: 污灵／邪灵
  rationale: 原文使用δαιμόνια，不是“污灵”的固定表达；译作“群鬼”保留本节自身的词汇及复数信息，不加入别处术语。
- issue: κρημνός所表示地形的陡峭程度
  choice: 陡坡
  alternative: 悬崖／峭壁
  rationale: 原词可指陡峭坡岸，却不必然表示垂直绝壁；“陡坡”既保留险峻和向下运动，也避免强化地貌。
- issue: ἀπεπνίγη的语态在汉语中的呈现
  choice: 淹死了
  alternative: 被淹死了
  rationale: 希腊语形式为被动，但现代汉语描述动物落水死亡通常说“淹死了”；这样不改变结果，也避免不自然地暗示另有施事者。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“于是”承接前文并引出动作结果；分号清楚区分群鬼进入猪群与猪群冲入湖中两个连续事件。
