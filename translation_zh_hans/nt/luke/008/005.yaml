  naturalness: “天空的飞鸟”在现代汉语中搭配不够自然，通常说“空中的飞鸟”或“天空中的飞鸟”。“有些种子……被踩踏，空中的飞鸟把它吃掉了”更流畅，并维持原文简洁的比喻叙述语体。
  terminology: “撒种的人”“种子”“路旁”均恰当。将鸟的短语改为“空中的飞鸟”，并以脚注保留“天上的飞鸟”的直译可能，能兼顾现代汉语和οὐρανοῦ的词义范围。
