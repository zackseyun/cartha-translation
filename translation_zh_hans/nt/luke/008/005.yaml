revisions:
- from: 撒种的人出去撒他的种子。撒种的时候，有一些落在路旁，被踩踏了，天空的飞鸟[a]把它吃尽了。
  to: 撒种的人出去撒自己的种子。撒种的时候，有些种子落在路旁，被踩踏，空中的飞鸟[a]把它吃掉了。
  rationale: 修订仅改善现代汉语的搭配和指代清晰度。“自己的种子”自然表达αὐτοῦ与撒种者的所属关系；“有些种子”明确承接前文的种子；“空中的飞鸟”比“天空的飞鸟”更符合现代普通话。未增添践踏者或鸟类的具体信息，保留原文被动语态及其未明示的施事者。
