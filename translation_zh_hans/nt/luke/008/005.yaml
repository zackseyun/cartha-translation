  text: Ἐξῆλθεν ὁ σπείρων τοῦ σπεῖραι τὸν σπόρον αὐτοῦ. καὶ ἐν τῷ σπείρειν αὐτὸν ὃ μὲν ἔπεσεν παρὰ τὴν ὁδόν, καὶ κατεπατήθη καὶ τὰ πετεινὰ τοῦ οὐρανοῦ κατέφαγεν αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/005.yaml
  text: The sower went out to sow his seed. And as he was sowing[a], some fell beside the path and was trampled, and the birds of the sky devoured it.
translation:
  language: zh_hans
  text: 撒种的人出去撒自己的种子。撒种的时候，有些种子落在路旁，被踩踏，空中的飞鸟[a]把它吃掉了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“天上的飞鸟”。
    reason: οὐρανοῦ可指“天空”或“天”；正文采用现代汉语较自然的“空中”，脚注保留另一种直译可能。
lexical_decisions:
- source_word: Ἐξῆλθεν
  choice: 出去
  rationale: 不定过去时在叙事中表示一次完整的行动；“出去”是现代汉语中自然、准确的表达。
- source_word: ὁ σπείρων
  choice: 撒种的人
  rationale: 带冠词的现在分词作名词用，指从事撒种的人；此译法自然清楚，也不额外限定其身份。
- source_word: τοῦ σπεῖραι
  choice: 撒
  rationale: 带冠词的属格不定式跟在移动动词后，表示目的；汉语用连动结构“出去撒”最为自然。
- source_word: τὸν σπόρον αὐτοῦ
  choice: 他的种子
  rationale: σπόρος在农业语境中指供播撒的种子；保留“他的”，忠实反映αὐτοῦ。
- source_word: ἐν τῷ σπείρειν αὐτόν
  choice: 撒种的时候
  rationale: ἐν加带冠词的不定式表示同时发生的行动；“……的时候”准确传达时间关系，并符合现代汉语习惯。
- source_word: ὃ μὲν
  choice: 有一些
  rationale: 此处以单数中性关系代词分举一部分种子，并由μέν引出后续各类；汉语用“有一些”自然表达这种分配意义。
- source_word: ἔπεσεν παρὰ τὴν ὁδόν
  choice: 落在路旁
  rationale: παρά加宾格在这里表示沿路或路边的位置；“路旁”简洁保留空间图景。
- source_word: κατεπατήθη
  choice: 被踩踏了
  rationale: 被动形式表示种子遭到践踏，原文未说明施事者，因此译文也不补明是谁踩踏。
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: 天空的飞鸟
  rationale: πετεινά指飞鸟，οὐρανός在此可指天空，也可按固定表达译为天；正文采用符合场景的“天空”，脚注保留另一种译法。
- source_word: κατέφαγεν αὐτό
  choice: 把它吃尽了
  rationale: κατεσθίω带有彻底吃掉的加强意味；“吃尽了”比单纯“吃了”更能体现其力度，同时适合飞鸟啄食种子的场景。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“撒种的人”避免古旧称谓；“被踩踏了”保留原文被动和未明说的施事者。正文中的脚注标记紧接存在词义选择的“飞鸟”之后。
