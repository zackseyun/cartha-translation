  text: ὁ δὲ εἶπεν αὐτῇ· ⸀Θυγάτηρ, ἡ πίστις σου σέσωκέν σε· πορεύου εἰς εἰρήνην.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/048.yaml
  text: But he said to her[a], “Daughter, your faith has saved you; go in peace.”
translation:
  language: zh_hans
  text: 他却对她说：“女儿，你的信心救了你[a]；平平安安地去吧。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你的信心使你痊愈了”或“你的信心医好了你”。希腊语这个动词既可指医治，也可指拯救。
    reason: alternative_reading
lexical_decisions:
- source_word: Θυγάτηρ
  choice: 女儿
  rationale: 保留呼格的直译，传达耶稣温柔而亲近的称呼；比“这位妇人”等译法更贴近原词。
- source_word: πίστις
  choice: 信
  rationale: 在本语境中指她对耶稣的信靠。“信”自然简洁，也保留该词的神学内涵。
- source_word: σέσωκέν
  choice: 救了
  rationale: σῴζω的完成时在此既可指医治，也可带有更广的拯救含义。“救了”保留其语义宽度，身体得医治的明确语境则在脚注中说明。
- source_word: πορεύου
  choice: 去吧
  rationale: 自然表达命令语气，并以“吧”体现此处安慰和差遣的口吻。
- source_word: εἰς εἰρήνην
  choice: 平平安安地
  rationale: 按现代汉语习惯表达带着平安离去或进入平安的祝福，比生硬直译“进入平安”更自然。
- source_word: δὲ
  choice: 却
  rationale: 承接前文妇人的惧怕与坦白，并突出耶稣安慰回应的轻微转折；不强化为强烈对立。
theological_decisions:
- issue: 医治语境中σῴζω的含义范围
  choice: 正文译作“救了你”
  alternative: “使你痊愈了”或“医好了你”
  rationale: 叙事直接涉及身体得医治，但σῴζω并不限于身体康复，也可表达更广的拯救。“救了你”保留原文的神学张力，脚注同时交代本语境中的医治含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“女儿”保留亲切的关系性称呼；“平平安安地去吧”符合汉语祝福和差遣的自然表达。
