source:
  edition: SBLGNT
  text: βλέπετε οὖν πῶς ἀκούετε· ὃς ⸂ἂν γὰρ⸃ ἔχῃ, δοθήσεται αὐτῷ, καὶ ὃς ⸀ἂν μὴ ἔχῃ, καὶ ὃ δοκεῖ ἔχειν ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/018.yaml
  text: Therefore[a], pay attention to how you listen. For whoever has, more will be given to him, and whoever does not have, even what he thinks he has will be taken away from him.
translation:
  language: zh_hans
  text: 所以，你们要留心怎样听。因为凡有的，还要给他更多；凡没有的，连他自以为有的[a]，也要从他那里拿走。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他看似有的”。
    reason: δοκέω可表示“以为、认为”，也可表示“看来、似乎”；两种理解都具有词义根据。
lexical_decisions:
- source_word: βλέπετε
  choice: 要留心
  rationale: 这里不是指视觉上的“看”，而是命令人谨慎注意；“要留心”自然地保留了警戒语气。
- source_word: οὖν
  choice: 所以
  rationale: 承接前文关于听道和显明之事的教导，表示由此得出的劝诫；“所以”清楚而自然。
- source_word: πῶς ἀκούετε
  choice: 自己怎样听
  rationale: πῶς强调听的方式，ἀκούετε在此不只是听见声音，也涉及认真领受；“怎样听”保留原文的着重点，加上“自己”使现代汉语表达更自然。
- source_word: ὃς ἂν ... ἔχῃ
  choice: 凡有的
  rationale: 关系代词配合ἄν和虚拟语气表达普遍、未限定的条件；“凡有的”保留格言式表达。
- source_word: δοθήσεται αὐτῷ
  choice: 还要给他更多
  rationale: 原文没有明说所给的宾语，但与前面的“有”及后面的剥夺构成递增对比；汉语补出“更多”可使省略关系清楚，而不限定所指具体为何物。
- source_word: ὃς ἂν μὴ ἔχῃ
  choice: 凡没有的
  rationale: 与“凡有的”形成对称，保留普遍条件和格言性质。
- source_word: ὃ δοκεῖ ἔχειν
  choice: 他自以为有的
  rationale: δοκέω既可表示主观上的“认为”，也可表示客观上的“看似”；正文采用自然清楚的“自以为”，另以脚注保留另一种可能。
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: 也要从他那里夺去
  rationale: 未来被动式在此表示被移除或被剥夺；“夺去”传达警告的力度，并保留被动施事者未明说的特点。
- source_word: αὐτῷ / αὐτοῦ
  choice: 给他／从他那里
  rationale: 保留希腊文泛指个体的阳性单数表达，现代汉语中“他”也可用于这种格言式泛指。
theological_decisions:
- issue: “有”与“没有”的格言所指为何
  choice: 不在正文中补明所拥有的是悟性、信心、知识、恩赐或物质，而让其在上下文关于如何听和领受耶稣话语的范围内保持开放。
  alternative: 将其明确解释为属灵领受、管家责任、预定、功德或物质富足的原则。
  rationale: 本节以悖论式格言说明听与领受的后果，却未明确界定“有”的宾语；译文应保存这种张力，不把特定神学体系写入正文。
- issue: 被动式δοθήσεται和ἀρθήσεται的施事者
  choice: 译为“给他”和“夺去”，不明说是谁施行。
  alternative: 明确译作“上帝要赐给他／上帝要从他那里夺去”。
  rationale: 原文使用被动语态而未点明施事者；虽可能具有神圣被动的含义，正文不应把这一解释显化为原文未直接陈述的主语。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“要留心自己怎样听”保留命令和反思语气；分号呈现两句格言之间的对照。“凡……的”维持简洁有力的箴言体。
