  text: ὁ δὲ εἶπεν· Ὑμῖν δέδοται γνῶναι τὰ μυστήρια τῆς βασιλείας τοῦ θεοῦ, τοῖς δὲ λοιποῖς ἐν παραβολαῖς, ἵνα βλέποντες μὴ βλέπωσιν καὶ ἀκούοντες μὴ συνιῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/010.yaml
  text: And he said[a], “To you it has been given to know the mysteries of the kingdom of God, but to the rest in parables, so that seeing they may not see[c][b], and hearing they may not understand.”
translation:
  language: zh_hans
  text: 耶稣说：“神国的奥秘，已经赐给你们知道；至于其余的人，就用比喻，使他们看着却看不见，听着却不明白。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使他们看着却看不见，听着却不明白”呼应《以赛亚书》6:9—10。这里的“使”可以表示神审判性的目的、所产生的结果，或兼有两者；原文保留了这种张力。
    reason: cross_reference
lexical_decisions:
- source_word: δέδοται
  choice: 只赐给
  rationale: 希腊文为完成时被动语态，表示先前赐予所形成的现今状态；中文以“赐给”保留神圣被动，而“只”借由与“其余的人”的对照自然表达受赐对象的限定。
- source_word: γνῶναι
  choice: 知道
  rationale: 直接对应“知道、认识”，并与后文 συνιῶσιν 的“明白”有所区分。
- source_word: μυστήρια
  choice: 奥秘
  rationale: 保留圣经语境中原先隐藏、由神启示之真理的含义，不弱化为一般私人秘密。
- source_word: βασιλείας τοῦ θεοῦ
  choice: 神国
  rationale: 现代中文圣经语体中自然、凝练，兼可涵盖神掌权与其国度。
- source_word: τοῖς δὲ λοιποῖς
  choice: 至于其余的人
  rationale: 忠实表达“剩下的人”，不从平行经文引入“外人”等路加原文没有的措辞。
- source_word: ἐν παραβολαῖς
  choice: 就用比喻
  rationale: 原文是省略结构；中文补出“用”，自然表达教导临到其余之人的形式，同时不补入过多解释。
- source_word: ἵνα
  choice: 使
  rationale: 保留目的或结果的力度，不将其软化为单纯的“所以”或“因为”。
- source_word: βλέποντες μὴ βλέπωσιν
  choice: 看是看见，却看不明白
  rationale: 以自然中文保留重复和反差；“看不明白”表达并非缺少视觉行为，而是未能真正看见其意义。
- source_word: ἀκούοντες μὴ συνιῶσιν
  choice: 听是听见，却不明白
  rationale: 保留听见与理解之间的反差，并将 συνίημι 准确译作“明白”。
theological_decisions:
- issue: ἵνα 引出的以赛亚式语句究竟表示神的目的、审判性的结果，还是二者兼有
  choice: 译作“使”，保留目的／结果张力
  alternative: 译作“结果是”以偏重结果，或以“因为”等措辞淡化目的意味
  rationale: ἵνα 通常具有目的或结果色彩；直译其力度可避免替读者预先解决有关启示、比喻与审判的神学张力。
- issue: “看见”在否定分句中的语义
  choice: 译作“看不明白”
  alternative: 严格重复为“看是看见，却看不见”
  rationale: 同一动词的修辞性重复表达外在看见却没有真正领会；中文若完全重复容易被误解为视觉上的自相矛盾，因此采用语境等值表达，同时由脚注说明其以赛亚背景。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“神国”“奥秘”“比喻”保留熟悉的圣经用语；补出原文省略结构所需的“用”，避免中文残缺。主语依上下文明确为耶稣。
