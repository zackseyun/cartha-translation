  text: Συνιόντος δὲ ὄχλου πολλοῦ καὶ τῶν κατὰ πόλιν ἐπιπορευομένων πρὸς αὐτὸν εἶπεν διὰ παραβολῆς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/004.yaml
  text: 'And when a large crowd was gathering[a], and people from town after town were coming to him, he spoke by a parable:'
translation:
  language: zh_hans
  text: 当一大群人正在聚集、各城的人也来到他那里时，他就用比喻说：[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在比喻中说。”希腊语短语“διὰ παραβολῆς”可表示所用的手段，也可表示说话的方式。
    reason: lexical_alternative
lexical_decisions:
- source_word: Συνιόντος
  choice: 正聚集起来
  rationale: 该词与“许多人”构成属格独立结构，表示在主句动作发生时仍在进行的聚集过程；“正聚集起来”自然传达其未完成体意味。
- source_word: δὲ
  choice: 不单独译出
  rationale: 此处主要承接叙事，并无明显转折；汉语通过句子自然推进即可表达，若机械译作“而”或“于是”反而可能加重语气。
- source_word: ὄχλου πολλοῦ
  choice: 一大群人
  rationale: ὄχλος指人群，πολύς表示数量众多；“一大群人”是现代汉语中自然、清楚的表达。
- source_word: τῶν κατὰ πόλιν ἐπιπορευομένων
  choice: 又有人从一座座城来到
  rationale: 冠词化分词指正在前来的人；κατὰ πόλιν具有逐城、各城分布的意味，“从一座座城”保留其分配性，又符合现代汉语习惯。
- source_word: πρὸς αὐτόν
  choice: 他那里
  rationale: πρός加宾格表示朝向耶稣而来；在“来到”之后译作“他那里”比“向他”更自然。
- source_word: εἶπεν
  choice: 说
  rationale: 普通叙事动词，后接比喻内容；“说”简洁自然，并为下文直接引语作引入。
- source_word: διὰ παραβολῆς
  choice: 用比喻
  rationale: διά加属格可表示手段或方式；“用比喻”既贴近手段义，也符合现代汉语表达，同时以脚注保留方式义的另一种理解。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“正……起来”呈现人群持续聚集的场景；“一座座城”保留原文逐城而来的分配意味。分号划分背景情形与主句动作，末尾冒号引出随后比喻的内容。
