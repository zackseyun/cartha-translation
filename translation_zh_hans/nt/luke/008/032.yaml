id: LUK.8.32
reference: Luke 8:32
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ἦν δὲ ἐκεῖ ἀγέλη χοίρων ἱκανῶν ⸀βοσκομένη ἐν τῷ ὄρει· καὶ ⸀παρεκάλεσαν αὐτὸν ἵνα ἐπιτρέψῃ αὐτοῖς εἰς ἐκείνους εἰσελθεῖν· καὶ ἐπέτρεψεν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/032.yaml
  text: There was a large herd of pigs feeding there on the mountain[a], and they begged him to permit them to enter those pigs[c][b], and he permitted them.
translation:
  language: zh_hans
  text: 那里有一大群猪[a]在山上[b]觅食。那些鬼[c]央求耶稣准许它们进入那些猪体内，耶稣就准许了它们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“许多猪”，或“一群数量可观的猪”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“山坡上”。
    reason: lexical_alternative
  - marker: c
    text: 原文在这里没有明说主语，只以复数动词表示“它们央求”；根据上下文，所指是那些鬼（污灵）。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγέλη χοίρων ἱκανῶν
  choice: 一大群猪
  rationale: ἀγέλη指成群的牲畜，χοίρων是“猪”；ἱκανῶν在这里表示数量多、规模可观。现代汉语以“一大群猪”自然传达整体含义。
- source_word: βοσκομένη
  choice: 在觅食
  rationale: 该分词描述猪群正在取食；“觅食”适用于猪，也避免“吃草”所带来的过度具体化。
- source_word: ἐν τῷ ὄρει
  choice: 山上
  rationale: 贴近ὄρος的基本含义，同时符合现代汉语表达；语境中也可理解为山坡上。
- source_word: παρεκάλεσαν
  choice: 央求
  rationale: 表达带有迫切意味的请求，比普通的“请求”更能体现该动词在本语境中的力度。
- source_word: ἐπιτρέψῃ / ἐπέτρεψεν
  choice: 准许／准许了
  rationale: 在请求和回应中重复同一词根的对应译法，保留原文的呼应。
- source_word: εἰς ἐκείνους εἰσελθεῖν
  choice: 进入那些猪体内
  rationale: 保留“进入”的方向性和ἐκείνους所指的“那些猪”；补出“体内”使现代汉语自然明确，而不改动动作本身。
- source_word: δὲ / καὶ
  choice: 当时／（句间承接）
  rationale: δὲ表示叙事推进而非明确的时间副词；“当时”在中文中自然承接上文。后续καὶ主要通过句序及重复主语表达，避免机械堆叠“并且”。
theological_decisions:
- issue: παρεκάλεσαν的复数主语所指
  choice: 正文译作“那些鬼”，明确其为上下文中的鬼
  alternative: 按希腊文仅以复数代词“它们”承接
  rationale: 希腊文动词只标示复数，具体所指由上下文确定。若中文紧接“猪群”写“它们央求”，极易误解为猪在央求；明确为“那些鬼”是为保持正确指代，并以脚注说明原文的隐含形式。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“央求”保留请求的迫切感；“准许……准许了”保留原文词语呼应。为避免中文代词错误回指紧邻的猪群，正文明确补出“那些鬼”，并以脚注交代希腊文的含蓄表达。
