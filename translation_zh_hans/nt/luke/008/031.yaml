base_translation:
  language: en
  yaml_path: translation/nt/luke/008/031.yaml
  text: And they were begging him not to command them to go into the abyss[a].
translation:
  language: zh_hans
  text: 他们一再恳求耶稣，不要命令他们到深渊[a]去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“极深之处”。这个希腊词可指极大的深度；在这里，很可能指拘禁邪灵的深渊。
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεκάλουν
  choice: 一再恳求
  rationale: 未完成时表示持续或反复的恳求；“一再恳求”既体现其持续性，也符合邪灵向耶稣迫切求告的语境。
- source_word: ἐπιτάξῃ
  choice: 命令
  rationale: 该词表示带有权柄的指令；“命令”准确保留耶稣对邪灵所具有的权威。
- source_word: ἄβυσσον
  choice: 无底深渊
  rationale: 该词本义涉及极深之处，在本节邪灵的语境中指向超自然的幽禁或审判之地；“无底深渊”在现代中文中自然且能保留其宇宙性意涵，但不进一步界定其性质。
- source_word: ἀπελθεῖν
  choice: 到……去
  rationale: 此处是不定式，表达受命前往某一目的地；中文用“到无底深渊去”自然地呈现运动及其终点。
- source_word: ἵνα μὴ
  choice: 不要
  rationale: 在恳求动词之后，该结构表达请求的内容；“恳求……不要……”是自然、准确的现代汉语。
- source_word: αὐτοῖς
  choice: 他们
  rationale: 与命令的承受者对应；中文“命令他们……去”清楚保留其句法关系。
- source_word: αὐτόν
  choice: 耶稣
  rationale: 希腊文为代词“他”；根据上下文将其明确为“耶稣”，避免连续代词造成现代中文歧义，并不增加原文以外的人物。
theological_decisions:
- issue: 邪灵语境中ἄβυσσος的含义
  choice: 译为“无底深渊”，保留其作为超自然幽禁或审判之处的意涵
  alternative: 译为“深渊”或较一般性的“极深之处”
  rationale: 上下文是邪灵惧怕耶稣以权柄命令他们前往某处。“无底深渊”保留原文的属灵和宇宙性维度；脚注同时说明较宽泛的词义，避免把路加未明说的细节写入正文。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“一再恳求”体现未完成时的持续或反复动作；明确写出“耶稣”以消除汉语代词指向不清。正文保留脚注标记[a]，并在脚注中呈现词义上的可能范围。
