  text: καὶ ἐπέστρεψεν τὸ πνεῦμα αὐτῆς, καὶ ἀνέστη παραχρῆμα, καὶ διέταξεν αὐτῇ δοθῆναι φαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/055.yaml
  text: And her spirit returned[a], and she rose immediately[b], and he directed that food be given to her.
translation:
  language: zh_hans
  text: 她的灵回来了[a]，她立刻就起来了；他并吩咐给她些东西吃。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：她的气息回来了。
    reason: πνεῦμα在这里既可理解为“灵”，也可能指维系生命的“气息”。
lexical_decisions:
- source_word: ἐπέστρεψεν
  choice: 回来了
  rationale: 在此表示女孩的生命恢复；“回来”自然保留了原词“返回”的具体意象。
- source_word: τὸ πνεῦμα αὐτῆς
  choice: 她的灵
  rationale: πνεῦμα可指“灵”或“气息”。复活的叙事语境较支持“灵”，同时以脚注保留“气息”这一可能含义。
- source_word: ἀνέστη
  choice: 起来了
  rationale: 准确表达女孩恢复生命后起身的动作，符合现代汉语习惯，也不额外限定她是站起还是坐起。
- source_word: παραχρῆμα
  choice: 立刻就
  rationale: 突出事情随即发生；“立刻就”在现代汉语中自然地体现动作的即时性。
- source_word: διέταξεν
  choice: 吩咐
  rationale: 传达带有权威的指示，同时符合此处照料女孩的实际语境，不采用语气较强硬的“命令”。
- source_word: αὐτῇ δοθῆναι φαγεῖν
  choice: 给她东西吃
  rationale: 自然而明确地表达原文“给她（东西）吃”的不定式结构，并保留φαγεῖν所明说的“吃”。
theological_decisions:
- issue: 复活语境中πνεῦμα的含义
  choice: 她的灵回来了
  alternative: 她恢复了气息
  rationale: “灵”保留该词的主要语义范围及本段的神学张力，而不把生命恢复缩减为单纯重新呼吸；“气息”在词义上仍有可能，故列入脚注。
- issue: διέταξεν的隐含主语
  choice: 他
  alternative: 耶稣
  rationale: 希腊文仅以动词形式承接前文的男性单数主语；译作“他”不添加本节未明说的专名，同时在上下文中所指清楚。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“她立刻就起来了”保持叙事的即时感；“给她东西吃”比生硬的被动结构更符合汉语表达。分号用于呈现三个并列事件之间的推进关系。
