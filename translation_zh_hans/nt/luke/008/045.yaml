  to: 耶稣说：“摸我的是谁？”众人都不承认时，彼得说：“老师，人群正围着你，又挤压着你。”[a]
  rationale: 修订明确众人否认与彼得说话之间的同时性，采用更自然的现代汉语表达两个人群动作，并将Ἐπιστάτα译作现代汉语中自然且不强化为“主”的尊称。脚注仍锚定于包含两个动词的整句话之后。
