source:
  edition: SBLGNT
  text: καὶ εἶπεν ὁ Ἰησοῦς· Τίς ὁ ἁψάμενός μου; ἀρνουμένων δὲ πάντων εἶπεν ὁ ⸀Πέτρος· Ἐπιστάτα, οἱ ὄχλοι συνέχουσίν σε καὶ ⸀ἀποθλίβουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/045.yaml
  text: And Jesus said[a], “Who is the one who touched me?” And while everyone was denying it, Peter said, “Master, the crowds are hemming you in and pressing against you.”
translation:
  language: zh_hans
  text: 耶稣说：“摸我的是谁？”众人都不承认时，彼得说：“老师，人群正围着你，又挤压着你。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “正围着你，又挤压着你”也可译作“正从四周围住你，并向你挤来”。
    reason: 原文连用两个意义相近而有区别的动词：前者侧重人群从四周围住、使人受限制，后者侧重挤压的动作。
lexical_decisions:
- source_word: ἁψάμενός
  choice: 摸
  rationale: 此处中动态表示身体接触；“摸”自然贴合前文妇人触摸耶稣的叙事。
- source_word: ἀρνουμένων δὲ πάντων
  choice: 众人都不承认
  rationale: 保留πάντων的全称范围；汉语在叙事中无需生硬添加“正在”，也能表达众人当时纷纷否认的背景动作。
- source_word: Ἐπιστάτα
  choice: 夫子
  rationale: 这是路加常用的尊称，表示对耶稣权威的承认，但并非κύριος；“夫子”庄重自然，又不强化为“主”。
- source_word: ὄχλοι
  choice: 人群
  rationale: 希腊文虽为复数，但现代汉语“人群”可自然涵盖四周聚集的众多人群，避免不自然的“众人群”。
- source_word: συνέχουσίν
  choice: 围挤着
  rationale: 兼顾“围住、限制”和拥挤的语境，体现耶稣被四周人群包围。
- source_word: ἀποθλίβουσιν
  choice: 紧紧压着
  rationale: 表达加强的挤压感，并与前一动词“围挤”有所区分，同时避免“压碎”等过强措辞。
theological_decisions:
- issue: 对耶稣称呼Ἐπιστάτα的译法
  choice: 夫子
  alternative: 老师；主
  rationale: 原文不是κύριος。“夫子”既传达尊敬和权威，又不把本节明说的称号提升为更强的基督论称号。
- issue: 耶稣问题中ὁ加分词结构的表达
  choice: 摸我的是谁？
  alternative: 是谁摸了我？
  rationale: “摸我的是谁”较明显地保留“那摸我的人是谁”的辨识焦点，同时符合现代汉语习惯，不额外解释耶稣发问的知识层面。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“夫子”略带经文语体色彩，但在现代读者中仍可理解，并适合表达尊敬而不等同于“主”。脚注标记置于所说明的整句话之后。
