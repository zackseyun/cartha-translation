  text: Ἔστιν δὲ αὕτη ἡ παραβολή· Ὁ σπόρος ἐστὶν ὁ λόγος τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/011.yaml
  text: 'This is the parable: the seed is the word of God[a].'
translation:
  language: zh_hans
  text: 这个比喻是这样的：种子就是上帝的话[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这个比喻的意思是：种子就是上帝的话。”希腊文较直译为：“这就是这个比喻。”
    reason: 说明符合上下文的解释性译法，同时以完整引文交代原文较直接的表达。
lexical_decisions:
- source_word: Ἔστιν
  choice: 是这样的
  rationale: 保留系词所引出的解释结构；汉语用“是这样的”比生硬的“是”更自然，同时没有直接增译为“意思是”。
- source_word: δὲ
  choice: 不单独译出
  rationale: δὲ在这里表示轻微转折或话题推进；本句从比喻转入解释的结构已能体现这一功能，另加“现在”或“那么”容易造成不必要的时间或推论色彩。
- source_word: αὕτη ἡ παραβολή
  choice: 这个比喻
  rationale: 直接保留原文“这个比喻”的说法，不在正文中解释性增补“意思”。
- source_word: σπόρος
  choice: 种子
  rationale: 准确保留单数集合用法及撒种比喻的意象。
- source_word: λόγος
  choice: 话
  rationale: 此处指上帝所传达的话或信息；“上帝的话”是自然、清楚的现代汉语，也保留λόγος的基本语义。
- source_word: τοῦ θεοῦ
  choice: 上帝的
  rationale: 按属格直接表达为所属关系，不解释性改写成“来自上帝的”。
theological_decisions:
- issue: 是否把παραβολή在正文中扩译为“比喻的意思”或“比喻的解释”
  choice: 这个比喻是这样的
  alternative: 这个比喻的意思是
  rationale: 上下文确实是在解释比喻，但希腊文原句仍说“这个比喻是……”。正文保留这一措辞及其张力，脚注说明符合语境的解释性译法。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“是这样的”使原文的系词结构在汉语中通顺；“上帝的话”避免“道”可能带来的术语化歧义。脚注标记[a]已置于正文对应位置。
