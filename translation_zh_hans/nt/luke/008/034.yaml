  text: Ἰδόντες δὲ οἱ βόσκοντες τὸ ⸀γεγονὸς ἔφυγον καὶ ἀπήγγειλαν εἰς τὴν πόλιν καὶ εἰς τοὺς ἀγρούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/034.yaml
  text: When the herdsmen saw what had happened[b][a], they fled and reported it in the city and in the countryside.
translation:
  language: zh_hans
  text: 放猪的人看见所发生的事[a]，就逃走了，把这事传到城里和乡间[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“已经发生的事”。
    reason: lexical_alternative
  - marker: b
    text: 直译：“田野”；这里指城外周围的乡村地区。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδόντες
  choice: 看见
  rationale: 不定过去时分词在这里表示与随后主要动作相关的先行动作；汉语按自然叙事次序译为“看见……就……”，既清楚又不显生硬。
- source_word: οἱ βόσκοντες
  choice: 牧人
  rationale: 该名词化现在时分词指当时放牧猪群的人。“牧人”在现代汉语中可泛指照管牲畜者，也比容易使人专想到羊群的“牧羊人”准确。
- source_word: τὸ γεγονός
  choice: 所发生的事
  rationale: γίνομαι的完成时名词化分词指已经发生的事件；“所发生的事”自然地保留了动作已经完成的意味。
- source_word: ἔφυγον
  choice: 逃走了
  rationale: 准确表达φεύγω的离开、逃离之意；“逃走”比仅说“跑了”更符合原词语义，又不额外加入“成功脱险”的含义。
- source_word: ἀπήγγειλαν
  choice: 把这事传报
  rationale: ἀπαγγέλλω表示把消息报告或传开；“传报”适合叙事语体，宾语“这事”由上下文自然补出。
- source_word: εἰς τὴν πόλιν
  choice: 到城里
  rationale: 保留εἰς的方向意味，同时在汉语中自然表达他们进入城中传报消息。
- source_word: καὶ εἰς τοὺς ἀγρούς
  choice: 和乡间
  rationale: ἀγροί字面可指田地，但与“城”并列对照时也指周围的乡村地区；“乡间”清楚呈现这一地理对照。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“看见……就……”呈现希腊语分词与主要动词的时间关系；“城里和乡间”保持城市与周边农村地区的对照。脚注标记紧接各自所说明的词语。
