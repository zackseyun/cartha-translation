review_pass:
  verdict: revise
  source_fidelity: 译文总体准确地传达了听道者、魔鬼夺去道，以及阻止相信并得救的关系。惟“那些落在路旁的”在中文中直接指人略显语义跳跃；原文在比喻解释中省略“种子”，中文宜补出以保持图像和句法清晰。“使他们不能”较容易表述为绝对能力上的不能，原文则表达魔鬼行动的目的，即免得他们相信而得救。
  naturalness: “那些落在路旁的，就是听了道的人”不如明确说“那些落在路旁的种子，指的是……”自然。改用“为的是不让他们相信而得救”可保留现代、庄重且顺畅的叙述。
  terminology: “魔鬼”“道”“心里”“得救”均合乎现代中文经文语域，并恰当保留关键神学与人论用语。“夺去”可接受，虽比αἴρει略强，仍属该语境中安全的表达。
  issues:
  - severity: medium
    issue: “那些落在路旁的”缺少中文所需的指称对象
    rationale: 希腊文可凭比喻上下文将阳性复数冠词短语理解为“那些（种子）在路旁的”；中文若直接以“那些落在路旁的”作“听了道的人”的主语，容易把“落在路旁”误附于人。补出“种子”既不改变原意，也使比喻解释清楚。
  - severity: medium
    issue: “使他们不能相信而得救”可能强化为能力限制
    rationale: ἵνα μή πιστεύσαντες σωθῶσιν说明魔鬼夺去道的目的：阻止他们相信并得救；并未明说他们在任何意义上‘不能’相信。用“为的是不让他们相信而得救”更准确保留目的语气，且不引入额外的能力断言。
  revised_text: 那些落在路旁的种子，指的是那些听了道的人；随后魔鬼来，从他们心里把道夺去，为的是不让他们相信而得救。
  revised_footnotes: []
