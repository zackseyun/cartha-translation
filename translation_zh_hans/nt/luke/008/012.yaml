revisions:
- from: 那些落在路旁的，就是听了道的人；随后魔鬼来，从他们心里把道夺去，使他们不能相信而得救。
  to: 那些落在路旁的种子，指的是那些听了道的人；随后魔鬼来，从他们心里把道夺去，为的是不让他们相信而得救。
  rationale: 补出由比喻上下文所省略的“种子”，使中文指称明确，同时保持原文“路旁”意象。将“使他们不能”改为“为的是不让他们”，更贴合ἵνα μή所表达的目的，并避免把阻止相信表述成超出原文的绝对能力断言。其余术语和句序均可保留。
