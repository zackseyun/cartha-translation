  text: οἱ δὲ παρὰ τὴν ὁδόν εἰσιν οἱ ⸀ἀκούσαντες, εἶτα ἔρχεται ὁ διάβολος καὶ αἴρει τὸν λόγον ἀπὸ τῆς καρδίας αὐτῶν, ἵνα μὴ πιστεύσαντες σωθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/012.yaml
  text: And those beside the road are the ones who have heard[a]; then the devil comes and takes away the word from their hearts[b], so that they may not believe and be saved.
translation:
  language: zh_hans
  text: 那些落在路旁的种子，指的是那些听了道的人；随后魔鬼来，从他们心里把道夺去，为的是不让他们相信而得救。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρὰ τὴν ὁδόν
  choice: 落在路旁的
  rationale: 原文以空间短语指代比喻中落在路旁的种子；中文补出“落在”可自然衔接比喻，同时保留路旁的图像。
- source_word: ἀκούσαντες
  choice: 听了道的人
  rationale: 不定过去时分词指已经听见信息的人；结合下文“道”，译为“听了道的人”简洁自然。
- source_word: εἶτα
  choice: 随后
  rationale: 表达紧接着发生的动作次序，比“然后”略显庄重而仍属现代汉语。
- source_word: ὁ διάβολος
  choice: 魔鬼
  rationale: 这里指作为位格的邪恶者，采用现代中文圣经语境中清楚而通行的称呼。
- source_word: αἴρει
  choice: 夺去
  rationale: 此处意为移走、拿走；“夺去”既符合上下文中敌对的行动，也没有添加原文未明说的具体方式。
- source_word: τὸν λόγον
  choice: 道
  rationale: 在本比喻中指所宣讲的上帝信息；“道”保留路加叙事中的经文用语，并由上下文界定其意义。
- source_word: ἀπὸ τῆς καρδίας αὐτῶν
  choice: 从他们心里
  rationale: “心”保留原文关于人内在思想、意志和回应中心的表达；中文用“心里”自然表达来源，复数所属者由“他们”体现。
- source_word: ἵνα μὴ πιστεύσαντες σωθῶσιν
  choice: 使他们不能相信而得救
  rationale: 保留ἵνα μή所表达的目的或预期结果，也用“相信而得救”反映相信与得救的先后关联，不进一步界定其系统神学关系。
- source_word: πιστεύσαντες
  choice: 相信
  rationale: 直接对应πιστεύω在此处对信息作信心回应的含义，避免添加“仅仅认同”或特定宗派解释。
- source_word: σωθῶσιν
  choice: 得救
  rationale: 在路加的语境中指救恩，不只是暂时脱险；“得救”是清楚、通行的现代中文表达。
theological_decisions:
- issue: 相信与得救的关系
  choice: 译作“相信而得救”，保留相信在前、得救随后的原文结构。
  alternative: 可译作“信了就得救”或“免得他们相信而得救”。
  rationale: 原文以分词πιστεύσαντες连接被动虚拟式σωθῶσιν，陈述魔鬼夺去道的目的在于阻止人相信并得救；译文不加入关于信心性质、拣选、坚忍或救恩次序的宗派性说明。
- issue: ἵνα μή的目的与结果张力
  choice: 用“使他们不能”表达魔鬼行动所指向的目的或结果。
  alternative: “免得他们”更贴近目的语气，但在现代中文中略带书面古雅色彩。
  rationale: 希腊语在此可从目的或预期结果理解；“使……不能”自然地保留其指向，而不判定魔鬼最终行动能力的形而上范围。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。句式保持比喻解释的简洁推进；“道”“魔鬼”“得救”均为普通读者可理解且具有经文语域的用词。原文没有需要以脚注标示的重要文本异读或不可兼容的翻译歧义，因此不设脚注。
