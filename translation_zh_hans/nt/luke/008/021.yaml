  text: ὁ δὲ ἀποκριθεὶς εἶπεν πρὸς αὐτούς· Μήτηρ μου καὶ ἀδελφοί μου οὗτοί εἰσιν οἱ τὸν λόγον τοῦ θεοῦ ἀκούοντες καὶ ⸀ποιοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/021.yaml
  text: But he answered and said to them[b][a], “My mother and my brothers are those who hear the word of God and do it.”
translation:
  language: zh_hans
  text: 他却回答他们说：“我的母亲和我的弟兄[a]，就是那些[b]听上帝的话并照着去做的人。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“兄弟姐妹”。希腊原文是阳性复数“弟兄”，但这句话所指的人可能不限于男性。
    reason: lexical_alternative
  - marker: b
    text: 或译“就是这些人：那些听上帝的话并照着去做的人”。这种译法更明显地保留原文“这些人”的指示意味。
    reason: previous_rendering
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν πρὸς αὐτούς
  choice: 他却回答他们说
  rationale: 保留“回答……说”这一叙事表达及 δέ 的转折意味，同时采用现代汉语中自然、庄重的语序。
- source_word: Μήτηρ μου καὶ ἀδελφοί μου
  choice: 我的母亲和我的弟兄
  rationale: 按原文分别保留单数“母亲”和阳性复数“弟兄”，呼应耶稣在场的亲属；其适用范围可能不限于男性，故另加脚注说明。
- source_word: οὗτοί εἰσιν οἱ
  choice: 就是那些
  rationale: 将指示代词与带冠词的分词结构合并为自然的现代汉语，同时以“就是”保留强调性的身份认定；较形式对应的结构列入脚注。
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: 上帝的话
  rationale: “话”准确保留 λόγος 在此处作为上帝所传信息或教导的含义，也保留原文属格结构的神学张力。
- source_word: ἀκούοντες καὶ ποιοῦντες
  choice: 听……并照着去做
  rationale: 两个现在分词描写这群人的持续特征。“照着去做”清楚表达把所听见的话付诸行动，又避免把 ποιέω 直接解释为较强的“顺服”。
theological_decisions:
- issue: 耶稣重新界定家人的范围
  choice: 耶稣把听上帝的话并照着去做的人认作自己的家人，但不明说他否定了血缘亲属。
  alternative: 可理解为耶稣完全拒绝自己的血缘家庭，或只把男性门徒称为家人。
  rationale: 原文扩展了亲属关系的范围，却没有明言废除血缘关系；译文因此保留这种张力，不额外作教义性裁断。
- issue: ἀδελφοί 的性别与适用范围
  choice: 正文译作“弟兄”，保留原文阳性复数和对耶稣男性亲属的直接呼应。
  alternative: 译作“兄弟姐妹”，明确表达该话语可能涵盖男女。
  rationale: 正文优先对应原文的语法形式，脚注则说明其实际所指可能不限于男性，避免把潜在的广泛适用范围隐藏起来。
translation_notes:
  register: 采用现代、清楚而庄重的普通话。“回答他们说”略带经文叙事色彩，但仍自然可懂；“照着去做”比“遵行”更直接对应 ποιέω，并避免过度解释。
