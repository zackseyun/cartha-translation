  text: Καὶ κατέπλευσαν εἰς τὴν χώραν τῶν ⸀Γερασηνῶν, ἥτις ἐστὶν ἀντιπέρα τῆς Γαλιλαίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/026.yaml
  text: And they sailed down to the region of the Gerasenes, which is opposite Galilee.
translation:
  language: zh_hans
  text: 他们乘船到了格拉森人的地区[a]，这地区在加利利的对岸。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本和福音书的平行经文作“加大拉人”或“格革森人”。
    reason: textual_variant
lexical_decisions:
- source_word: κατέπλευσαν
  choice: 航行到了
  rationale: 该词指乘船抵达某地；这里译作“航行到了”，既保留水路航行和抵达之意，又不勉强加入现代汉语中不自然或未必必要的“向下”方向色彩。
- source_word: χώραν
  choice: 地区
  rationale: χώρα在此指一片地域或辖区，并非现代意义的国家；“地区”准确而自然。
- source_word: Γερασηνῶν
  choice: 格拉森人的
  rationale: 这是族群或居民称谓的属格，表示该地区与格拉森人相关；采用通行的中文音译并保留“人”的形式。
- source_word: ἥτις
  choice: 那里
  rationale: 该关系代词引出对前述地区的说明。中文用“那里”承接，避免生硬的欧化关系从句。
- source_word: ἀντιπέρα
  choice: 对岸
  rationale: 该词表示隔水相对、在另一边；叙事背景是渡过加利利湖，因此“对岸”比笼统的“对面”更自然准确。
- source_word: Γαλιλαίας
  choice: 加利利
  rationale: 采用该地名通行的现代中文圣经译名。
theological_decisions:
- issue: 符类福音传统中的地名异文与地理差异
  choice: 格拉森人
  alternative: 加大拉人；格革森人
  rationale: 正文依据SBLGNT所采用的Γερασηνῶν，不与平行经文或其他抄本传统强行协调；其他重要读法列入脚注，以保留文本证据的差异。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“航行到了”清楚表达乘船抵达；“那里在加利利的对岸”符合中文地理叙述习惯，并保留原文对该地区位置的说明。
