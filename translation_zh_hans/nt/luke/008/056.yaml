  naturalness: 修订后的“她的父母都大为惊奇；但他吩咐他们，不要把所发生的事告诉任何人”是自然、庄重的现代标准汉语。“都”顺畅反映复数主语的共同反应；分号使叙事中的轻微转折清楚可读。
  terminology: “父母”“吩咐”“任何人”“所发生的事”均恰当。“惊骇得不知所措”可作为ἐξέστησαν的较强备选释义，避免原脚注“震惊得失去常态”在现代汉语中可能引起不必要的心理状态联想。
