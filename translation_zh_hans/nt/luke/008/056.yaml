  text: καὶ ἐξέστησαν οἱ γονεῖς αὐτῆς· ὁ δὲ παρήγγειλεν αὐτοῖς μηδενὶ εἰπεῖν τὸ γεγονός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/056.yaml
  text: And her parents were astonished[c][b][a], but he instructed them to tell no one what had happened.
translation:
  language: zh_hans
  text: 她的父母都大为惊奇[a]；但他吩咐[b]他们，不要把所发生的事[c]告诉任何人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“惊讶万分”或“惊骇得不知所措”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“嘱咐”或“命令”。
    reason: lexical_alternative
  - marker: c
    text: 直译：“已经发生的事”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξέστησαν
  choice: 惊愕不已
  rationale: 该词在这里表示因所见之事而极其震惊、诧异。“惊愕不已”自然地表达了强烈反应，同时不像“失去常态”那样容易被误解为精神失常。
- source_word: γονεῖς
  choice: 父母
  rationale: γονεῖς是指父亲和母亲的常用复数名词，译作“父母”直接而自然。
- source_word: παρήγγειλεν
  choice: 嘱咐
  rationale: παραγγέλλω可表示吩咐、命令或郑重指示。此处“嘱咐”保留了明确的指示语气，又不额外渲染严厉程度。
- source_word: μηδενὶ
  choice: 任何人
  rationale: 与否定式“不要……告诉”搭配，译作“不要告诉任何人”符合现代汉语习惯，并准确表达无人例外。
- source_word: εἰπεῖν
  choice: 告诉
  rationale: εἰπεῖν本义为“说”，但此处带有人作为间接宾语，汉语用“告诉”更准确自然。
- source_word: τὸ γεγονός
  choice: 所发生的事
  rationale: 这是完成时分词的中性单数实体化用法，指已经发生的事情；“所发生的事”既保留其事件指向，也符合汉语表达。
- source_word: δὲ
  choice: 但
  rationale: δὲ在父母的强烈反应与随后他的指示之间形成轻微转折，译作“但”清楚呈现这一关系。
theological_decisions:
- issue: 耶稣要求保密的范围与动机
  choice: 直接译为不要把所发生的事告诉任何人，不说明该指示的动机、期限或更广泛的神学意义。
  alternative: 将其明确解释为与“弥赛亚隐秘”有关的严格公开禁令，或解释为仅在一段时间内、仅针对某些人的限制。
  rationale: 本节只记载他作出这项指示，并未交代原因或持续时间；译文应保留这种未说明之处，不把特定解释写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“惊愕不已”体现原文反应的强度；“嘱咐”保持指示力而不过度强化语气。正文保留代词“他”，与希腊文一致，并依赖上下文确认所指。所有脚注标记均置于其对应词语之后。
