  text: ἰδὼν δὲ τὸν ⸀Ἰησοῦν ἀνακράξας προσέπεσεν αὐτῷ καὶ φωνῇ μεγάλῃ εἶπεν· Τί ἐμοὶ καὶ σοί, Ἰησοῦ υἱὲ τοῦ θεοῦ τοῦ ὑψίστου; δέομαί σου, μή με βασανίσῃς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/028.yaml
  text: But when he saw Jesus[a], he cried out, fell down before him, and said with a loud voice, “What do you have to do with me, Jesus, Son of the Most High God? I beg you, do not torment me.”
translation:
  language: zh_hans
  text: 他一看见耶稣，就喊叫起来，俯伏在他面前，大声说：“耶稣，至高的上帝的儿子，我跟你有什么相干？[a] 我求你，不要折磨我！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我与你之间有什么关系？”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: 一看见
  rationale: 不定过去时分词交代先于主要动作发生的情境；“一看见……就……”自然地表达紧接发生的动作。
- source_word: ἀνακράξας
  choice: 喊叫起来
  rationale: 表达突然而响亮的呼喊，同时不与后面的“放声/大声”合并。
- source_word: προσέπεσεν αὐτῷ
  choice: 俯伏在他面前
  rationale: 保留向某人倒伏、伏在其面前的姿态，不额外限定为“脚前”，也不必然解释为敬拜。
- source_word: φωνῇ μεγάλῃ
  choice: 大声
  rationale: 自然表达方式状语，同时保留声音洪大的强调。
- source_word: Τί ἐμοὶ καὶ σοί
  choice: 我跟你有什么相干
  rationale: 这是带有闪语色彩、表示拒斥或划清关系的惯用语；此译简洁自然，并在脚注保留较直译的形式。
- source_word: υἱὲ τοῦ θεοῦ τοῦ ὑψίστου
  choice: 至高上帝的儿子
  rationale: 将“至高”理解为修饰“上帝”的称号，忠实保留对耶稣身份的完整称呼。
- source_word: δέομαί σου
  choice: 我求你
  rationale: 表达迫切恳求，现代汉语自然庄重，又不显得过度文言。
- source_word: μή με βασανίσῃς
  choice: 不要折磨我
  rationale: βασανίζω 在此指严厉的痛苦或刑罚；“折磨”保留其强度，又不擅自限定为肉体酷刑。
theological_decisions:
- issue: 污灵对耶稣身份的称呼
  choice: 至高上帝的儿子耶稣
  alternative: 耶稣，至高者上帝的儿子
  rationale: 完整保留原文的基督论称呼，不淡化，也不扩展为后来的教义表述。
- issue: 俯伏动作是否明说为敬拜
  choice: 俯伏在他面前
  alternative: 敬拜他
  rationale: 原词描述倒伏在某人面前的动作；上下文可能含有屈服或哀求意味，但并未使用明确表示敬拜的词，因此不替文本消除这一张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“一看见……就……”使动作衔接自然；直接引语保留强烈、急迫的语气。脚注标记已置于其所说明的惯用语之后。
