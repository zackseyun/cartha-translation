  text: καὶ ⸀ἠρώτησεν αὐτὸν ἅπαν τὸ πλῆθος τῆς περιχώρου τῶν ⸀Γερασηνῶν ἀπελθεῖν ἀπ’ αὐτῶν, ὅτι φόβῳ μεγάλῳ συνείχοντο· αὐτὸς δὲ ἐμβὰς ⸀εἰς πλοῖον ὑπέστρεψεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/037.yaml
  text: And the whole crowd from the surrounding region of the Gerasenes asked him to depart from them[a], because they were gripped by great fear. So he got into a boat and returned.
translation:
  language: zh_hans
  text: 格拉森人一带的全体群众都请求他离开他们，因为他们被极大的恐惧笼罩[a]。于是，他上船回去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们被极大的恐惧紧紧攫住了。”
    reason: 词汇异译；更具体地保留συνείχοντο所含的受控制、被攫住的意象。
lexical_decisions:
- source_word: ἠρώτησεν
  choice: 请求
  rationale: ἐρωτάω在这里指提出请求；“请求”比一般的“问”更准确，也不像“央求”那样额外强化语气。
- source_word: ἅπαν τὸ πλῆθος
  choice: 群众全都
  rationale: 既自然表达集体人群，也保留ἅπαν所强调的整体性。
- source_word: τῆς περιχώρου τῶν Γερασηνῶν
  choice: 格拉森周边地区
  rationale: περίχωρος指周围的地区；“格拉森”按所给希腊文本Γερασηνῶν音译，不以其他抄本中的地名取代。
- source_word: ἀπελθεῖν ἀπ’ αὐτῶν
  choice: 离开他们
  rationale: 简洁保留离去及与他们分开的方向含义，符合现代汉语叙事表达。
- source_word: φόβῳ μεγάλῳ
  choice: 极大的恐惧
  rationale: 直接传达形容词μεγάλῳ的强度，不擅自说明这种恐惧的性质或原因。
- source_word: συνείχοντο
  choice: 被……笼罩
  rationale: συνέχω在此表示被某种力量控制、紧紧攫住；“笼罩”在现代汉语中自然地表现恐惧支配全人的状态。
- source_word: ἐμβὰς εἰς πλοῖον
  choice: 上了船
  rationale: 自然表达登船动作；汉语不需要借不定冠词来对应希腊文名词前无冠词。
- source_word: ὑπέστρεψεν
  choice: 返回去了
  rationale: 保留ὑποστρέφω“返回、回去”的方向含义，并使句子在现代汉语中完整自然。
theological_decisions:
- issue: 格拉森地区民众为何惧怕并请耶稣离开
  choice: 只陈述极大的恐惧促使他们提出请求，不解释恐惧的具体性质。
  alternative: 把这种恐惧明确解释为对神圣能力的敬畏，或解释为对经济损失和社会动荡的敌意。
  rationale: 原文没有界定这恐惧是敬畏、敌意还是二者兼有，因此译文保留其叙事与神学张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“群众全都”避免生硬的“全体民众”，“请求”准确表达诉求而不夸大情绪；代词“他”遵循上下文，不在本节擅自补出姓名。
