  text: Ἔτι αὐτοῦ λαλοῦντος ἔρχεταί τις παρὰ τοῦ ἀρχισυναγώγου ⸀λέγων ὅτι Τέθνηκεν ἡ θυγάτηρ σου, ⸀μηκέτι σκύλλε τὸν διδάσκαλον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/049.yaml
  text: While he was still speaking[a], someone came from the synagogue leader, saying, “Your daughter has died[b]; do not trouble the teacher any longer.”
translation:
  language: zh_hans
  text: 耶稣还在说话的时候，有人从会堂主管那里来，说：“你的女儿已经死了，不要再麻烦老师了。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔτι αὐτοῦ λαλοῦντος
  choice: 耶稣还在说话的时候
  rationale: 属格独立结构表示同时发生的动作；“还在……的时候”自然保留ἔτι的持续意味。代词按上下文明确为“耶稣”，避免汉语中主语指向不清。
- source_word: ἔρχεταί τις
  choice: 有人……来
  rationale: 将叙事中的历史现在时按现代汉语叙事习惯表达；τις保留为不特定的“有人”。
- source_word: παρὰ τοῦ ἀρχισυναγώγου
  choice: 从会堂主管那里
  rationale: παρά加属格表示来源；ἀρχισυνάγωγος指负责或主持会堂事务的人，“会堂主管”清楚、现代，也不引入后世教会职衔。
- source_word: λέγων
  choice: 说
  rationale: 自然引出所传达的信息，并保留其与“来”的紧密衔接。
- source_word: Τέθνηκεν
  choice: 已经死了
  rationale: 完成时兼有死亡事件及其现存结果；“已经死了”在现代汉语中自然体现这一点。
- source_word: ἡ θυγάτηρ σου
  choice: 你的女儿
  rationale: 直接对应原文的主语和所属关系。
- source_word: μηκέτι
  choice: 不要再
  rationale: 准确表达从此停止该行为的禁止含义。
- source_word: σκύλλε
  choice: 麻烦
  rationale: σκύλλω在此意为使人费心、受扰；“麻烦”符合现代汉语口吻，又不显得轻佻。
- source_word: τὸν διδάσκαλον
  choice: 老师
  rationale: διδάσκαλος的普通词义是教导者；“老师”是自然、直接的现代汉语称呼，不额外提升为解释性的基督论头衔。
theological_decisions:
- issue: ἀρχισυνάγωγος作为睚鲁身份职衔的译法
  choice: 会堂主管
  alternative: 会堂领袖；管会堂的
  rationale: 这是制度性职务，而非神学称号。“会堂主管”既传达其负责、主持会堂事务的身份，也避免套用后世教会制度用语。
- issue: διδάσκαλος的译法
  choice: 老师
  alternative: 教师；夫子
  rationale: 原文使用普通的“教导者”称呼。“老师”符合当代汉语，并避免采用古雅称呼或加入原句未明说的尊称层次。
- issue: Τέθνηκεν完成时的表达
  choice: 已经死了
  alternative: 死了；已经死去
  rationale: “已经”保留死亡发生后状态仍然成立的完成时意味，不对死亡及随后叙事的神学张力作额外解释。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。句首明确“耶稣”为说话者，以适应汉语篇章衔接；信息传递者仍保持不特定。全节无需脚注，因为主要词义可在正文中清楚表达，且没有必须保留的实质歧义。
