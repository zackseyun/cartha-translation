  text: ὁ δὲ Ἰησοῦς εἶπεν· Ἥψατό μού τις, ἐγὼ γὰρ ἔγνων δύναμιν ⸀ἐξεληλυθυῖαν ἀπ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/046.yaml
  text: But Jesus said, “Someone touched me, for I knew that power had gone out from me.”
translation:
  language: zh_hans
  text: 耶稣却说：“有人摸了我，因为我知道有能力从我身上出去了。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἥψατό μού
  choice: 摸了我
  rationale: 直接表达身体接触，符合上下文，也保留不定代词所指之人的未明身份。
- source_word: ἔγνων
  choice: 知道
  rationale: 对应该词在此处的直接认知含义，不弱化为仅仅“感觉到”或“察觉到”。
- source_word: δύναμιν
  choice: 能力
  rationale: 保留希腊词的宽广含义及其在医治叙事中的神能色彩，不擅自具体化为“医治之能”。
- source_word: ἐξεληλυθυῖαν ἀπ’ ἐμοῦ
  choice: 从我身上出去了
  rationale: 体现完成时分词所描述的已发生结果，并以自然中文保留能力从耶稣而出的空间性表达。
theological_decisions:
- issue: 耶稣对能力出去的认知方式
  choice: 我知道
  alternative: 我感觉到／我察觉到
  rationale: 原文ἔγνων明确陈述知道；译文不额外说明这种认知的机制，也不将其削弱为身体感觉。
- issue: 能力与耶稣的关系
  choice: 有能力从我身上出去了
  alternative: 我的能力出去了／医治的能力从我身上发出
  rationale: 保留原文δύναμιν的不定表达及ἀπ’ ἐμοῦ的来源关系，不添加所有格或限定其具体性质。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事语言。“却说”承接前文众人否认触摸的语境；引语简洁直接。
