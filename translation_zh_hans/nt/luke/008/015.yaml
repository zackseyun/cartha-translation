  text: τὸ δὲ ἐν τῇ καλῇ γῇ, οὗτοί εἰσιν οἵτινες ἐν καρδίᾳ καλῇ καὶ ἀγαθῇ ἀκούσαντες τὸν λόγον κατέχουσιν καὶ καρποφοροῦσιν ἐν ὑπομονῇ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/015.yaml
  text: But the seed in the good soil—these are the ones who[a], having heard the word with a good and noble heart, hold fast to it and bear fruit with perseverance.
translation:
  language: zh_hans
  text: 但那落在好土里的种子，指的是那些以善良正直的心听了这道、持守着它，并且坚忍地结出果实的人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ δὲ ἐν τῇ καλῇ γῇ
  choice: 但落在好土里的种子
  rationale: 原文是省略表达，按撒种比喻的上下文所指为种子；补出“种子”可使现代汉语清楚自然。“落在”承接种子撒落于各类土地的图景。
- source_word: καλῇ γῇ
  choice: 好土
  rationale: γῆ在此指适于耕种的土壤；“好土”简洁自然，并保留比喻中的农业意象及对比。
- source_word: οὗτοί εἰσιν οἵτινες
  choice: 就是那些……的人
  rationale: 这一结构界定好土所代表的一类人；该译法符合现代汉语的解释句式。
- source_word: ἐν καρδίᾳ καλῇ καὶ ἀγαθῇ
  choice: 以善良正直的心
  rationale: καλῇ与ἀγαθῇ是两个意义相近而不完全相同的正面形容词。“善良正直”保留双重品格描述，又避免译成重复而生硬的“好而善的心”；“心”指人的内在品格与意向。
- source_word: ἀκούσαντες τὸν λόγον
  choice: 听了这道
  rationale: 不定过去时分词表示听道先于持守和结果。“道”是本段已确立的比喻用语，“这”使汉语指称自然。
- source_word: κατέχουσιν
  choice: 持守它
  rationale: κατέχω在此不是仅仅拥有，而是牢牢保存、不放弃；“持守”准确表达这种持续而坚定的保留。代词“它”明确回指“这道”。
- source_word: καρποφοροῦσιν
  choice: 结出果实
  rationale: 保留撒种与生长的比喻意象；“结出果实”在现代汉语中自然，也能表达实际成果。
- source_word: ἐν ὑπομονῇ
  choice: 恒心
  rationale: ὑπομονή表示在压力或时间中坚定忍耐、持续不懈。“恒心”简明地表达结果时持续坚忍的方式，而不缩减为被动等待。
theological_decisions:
- issue: 领受这道之心的道德描述
  choice: 以善良正直的心
  alternative: 以诚实善良的心；以美好良善的心
  rationale: 经文正面描述听者的内在品格，却没有说明这种心如何形成，也未论及功德、重生次序等教义机制。“善良正直”保留两个形容词的双重称许，同时不加入经文本身没有作出的神学推断。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。句子保留“听—持守—结果”的推进关系，并维持撒种比喻的农业意象。“恒心结出果实”比“忍耐着结果”更自然，同时保留ὑπομονή所含的坚忍与持续意味。
