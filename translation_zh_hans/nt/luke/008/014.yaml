id: LUK.8.14
reference: Luke 8:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: τὸ δὲ εἰς τὰς ἀκάνθας πεσόν, οὗτοί εἰσιν οἱ ἀκούσαντες, καὶ ὑπὸ μεριμνῶν καὶ πλούτου καὶ ἡδονῶν τοῦ βίου πορευόμενοι συμπνίγονται καὶ οὐ τελεσφοροῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/014.yaml
  text: And the one that fell among the thorns—these are those who have heard[a], but as they go on their way they are choked by the cares and riches and pleasures of life[b], and they do not bear fruit to maturity.
translation:
  language: zh_hans
  text: 那落在荆棘里的，是指那些听见了的人；他们一路走下去，却被生活的忧虑[a]、财富和享乐挤住，结不出成熟的果实[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “忧虑”也可译作“挂虑”或“操心的事”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“不能使果实成熟”，或“不能把果实带到成熟的地步”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ... εἰς τὰς ἀκάνθας πεσόν
  choice: 那落在荆棘里的
  rationale: 保留原文中性单数分词的表达，不明添“种子”，同时按比喻语境自然地指向所撒之物。
- source_word: οὗτοί εἰσιν οἱ ἀκούσαντες
  choice: 是指那些听见了的人
  rationale: 准确表达已发生的“听见”，但不补入本节原文未明说的宾语“道”。
- source_word: πορευόμενοι
  choice: 他们一路走下去
  rationale: 体现现在分词所表达的持续进程，又不把它过度解释为某种特定的属灵历程。
- source_word: μεριμνῶν
  choice: 忧虑
  rationale: 涵盖操心、挂虑和焦虑等语义，适合与财富、享乐并列。
- source_word: πλούτου
  choice: 财富
  rationale: 现代汉语自然、清楚地表达物质富足，不额外加入褒贬色彩。
- source_word: ἡδονῶν τοῦ βίου
  choice: 生活的……享乐
  rationale: βίος在此指今世日常生活；“享乐”保留ἡδονή的愉悦与逸乐含义。
- source_word: συμπνίγονται
  choice: 被……挤住
  rationale: 保留荆棘与植物争夺空间、使其无法生长的农业意象；被动形式也与原文一致。
- source_word: οὐ τελεσφοροῦσιν
  choice: 结不出成熟的果实
  rationale: 同时保留结果子的比喻和未能达到成熟、完成状态的含义。
theological_decisions:
- issue: 荆棘地听道者失败的性质
  choice: 只陈述他们被生活的忧虑、财富和享乐挤住，未能结出成熟果实
  alternative: 明确断定他们从未真正相信、已经背道，或只是失去奖赏
  rationale: 本节描述其听见及不结果的情形，却没有明确裁定重生、背道或奖赏等后来的神学争论，因此译文保留原有张力。
translation_notes:
  register: 采用现代、庄重而通俗的普通话。“一路走下去”表达持续过程；“挤住”延续撒种比喻中的植物意象。标点将所指对象与后续状态清楚分开。
