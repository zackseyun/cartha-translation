  terminology: “鬼附”是中文圣经语境中通行且简明的表达；“曾被鬼附的人”准确处理ὁ δαιμονισθείς的完成被动含义。脚注以“获救、得医治、得到释放”呈现σῴζω的相关语义，不将本节限定为单一的教义性解释。
