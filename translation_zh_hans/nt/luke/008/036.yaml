  text: And those who had seen it reported to them how the demon-possessed man had been saved[a].
translation:
  language: zh_hans
  text: 目睹这事的人就向他们报告，那曾被鬼附的人是怎样获救的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“怎样得了医治”或“怎样得到了释放”。希腊语这个动词按语境可表示获救、医治或得到释放。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγγειλαν
  choice: 讲述
  rationale: 该词表示把所见之事报告或告诉别人；“讲述”符合目击者转述事件的语境，现代、自然而不失庄重。
- source_word: δὲ
  choice: 就
  rationale: 此处是推动叙事的轻微连接词，并非明显转折；“就”自然承接前文事件及随后发生的报告。
- source_word: αὐτοῖς
  choice: 向众人
  rationale: 代词指向当时前来观看并听取报告的人群。汉语若直译为“向他们”虽可行，但“向众人”能自然呈现上下文所指，同时不改变对象范围。
- source_word: οἱ ἰδόντες
  choice: 看见这事的人
  rationale: 冠词化分词指亲眼见证此前事件的人；“这事”在汉语中自然回指赶鬼及其结果。
- source_word: πῶς
  choice: 是怎样
  rationale: 保留 πῶς 所表达的方式或经过，同时也可涵盖所发生之事的事实内容。
- source_word: ἐσώθη
  choice: 得了拯救
  rationale: σῴζω 的被动形式可表示得救、获救、痊愈或得释放。主文采用“得了拯救”以保留其较宽的语义和神学回响，并用脚注列出本语境中的其他可能译法。
- source_word: ὁ δαιμονισθείς
  choice: 那被鬼附过的人
  rationale: 该实体化被动分词指先前受鬼魔控制的男子；“被鬼附过”既清楚表达其先前状态，也避免让读者误以为报告发生时他仍被鬼附。
theological_decisions:
- issue: 赶鬼与医治语境中 ἐσώθη（σῴζω）的译法
  choice: 得了拯救
  alternative: 得了医治；得了释放
  rationale: 原词的语义范围包括拯救、救援、医治和释放。主文保留“拯救”的广度，不把含义限定为身体医治或狭义的属灵得救；脚注说明本段语境下“医治”和“释放”同样可能。
translation_notes:
  register: 采用现代标准普通话和简体中文。句式流畅、庄重且便于普通读者理解；以“被鬼附过的人”准确体现其先前状态，并以脚注保存 σῴζω 在本语境中的真实多义性。
