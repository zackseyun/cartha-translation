  source_fidelity: 正文整体忠实于希腊文：保留了女人意识到行动未能隐蔽、战兢前来、伏倒在耶稣面前、在全体民众面前说明触摸的原因，以及立即得医治。原译“自己没能隐瞒过去”可以理解，但略把“未逃过注意”表述为女人主动隐瞒；改为“没有躲过别人的注意”更贴近λανθάνω的语义，且不指定究竟是谁注意到她。
  naturalness: 修订后的正文采用自然、现代而庄重的汉语。“战战兢兢地上前”“当着众人的面说明”流畅合宜；“得了医治”符合经文叙事语域。
  terminology: “耶稣”“俯伏”“医治”等用语恰当，没有加入原文未明说的认罪、敬拜或医治机制。脚注b正确说明原文没有明确说“脚前”。
  issues:
