  text: ἰδοῦσα δὲ ἡ γυνὴ ὅτι οὐκ ἔλαθεν τρέμουσα ἦλθεν καὶ προσπεσοῦσα αὐτῷ δι’ ἣν αἰτίαν ἥψατο αὐτοῦ ⸀ἀπήγγειλεν ἐνώπιον παντὸς τοῦ λαοῦ καὶ ὡς ἰάθη παραχρῆμα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/047.yaml
  text: And when the woman saw that she had not escaped notice[a], she came trembling, and falling down before him[b], declared before all the people why she had touched him and how she had been healed immediately.
translation:
  language: zh_hans
  text: 那女人见自己没有躲过别人的注意[a]，就战战兢兢地上前，俯伏在耶稣面前[b]，当着众人的面说明了自己为什么摸他，以及自己怎样立刻得了医治。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“自己的事没有隐藏住”或“自己没有被忽略”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“伏倒在他面前”。希腊文没有明确提到“脚前”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοῦσα
  choice: 见
  rationale: 不定过去时分词交代随后行动的背景；中文用“见”自然表达“当她看出”的时间和认知关系。
- source_word: οὐκ ἔλαθεν
  choice: 自己没能隐瞒过去
  rationale: λανθάνω在此指未能避开注意、事情没有隐藏住；这一表达自然呈现女人意识到自己的举动已被察觉。
- source_word: τρέμουσα
  choice: 战战兢兢地
  rationale: 保留分词所描绘的颤抖和惧怕状态，而不把它缩减为纯粹的内心情绪。
- source_word: προσπεσοῦσα αὐτῷ
  choice: 俯伏在耶稣面前
  rationale: προσπίπτω表示伏倒在某人面前，常带恳求或敬畏意味；正文不增添原文未明说的“脚前”。为使中文指代清楚，将αὐτῷ明确为“耶稣”。
- source_word: δι’ ἣν αἰτίαν
  choice: 为什么
  rationale: 简洁、现代地表达“出于什么原因”。
- source_word: ἥψατο αὐτοῦ
  choice: 摸他
  rationale: ἅπτομαι接属格在此表示触摸；中文叙事无需用时态形式额外标示先后。
- source_word: ἀπήγγειλεν
  choice: 说明了
  rationale: 此动词表示报告、讲明；“说明了”既自然，又与当众陈述原因和结果的语境相合。
- source_word: ἐνώπιον παντὸς τοῦ λαοῦ
  choice: 当着众人的面
  rationale: 准确表达“在全体民众面前”，并采用自然的现代汉语说法。
- source_word: ὡς ἰάθη
  choice: 怎样……得了医治
  rationale: 保留ὡς可表达方式或情形的作用，不将其限定为单纯的“她已经痊愈”这一事实。
- source_word: παραχρῆμα
  choice: 立刻
  rationale: 准确传达医治当即发生，并保留路加叙事中对即时性的强调。
theological_decisions:
- issue: 女人公开陈述的性质
  choice: 按叙事直译她战兢、俯伏并公开说明的行为，不称之为认罪、悔改或明确的敬拜。
  alternative: 将她的行为解释为悔改认罪或明确敬拜耶稣。
  rationale: 原文只陈述其姿态和公开报告；姿态虽可带有敬畏或恳求意味，却没有明说悔改或敬拜，因此不作教义性扩充。
- issue: 医治发生的方式与时间
  choice: 译作“怎样立刻得了医治”，保留ὡς的表达空间和παραχρῆμα的即时性。
  alternative: 译作“她立刻得了医治”，只突出事实；或补充医治机制。
  rationale: 原文说明她报告“怎样”被治好，同时强调医治立即发生，却未进一步界定医治机制。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“战战兢兢”“俯伏”“得了医治”兼顾经文语域和当代可读性；避免把姿态解释成原文未明说的敬拜或悔改。
