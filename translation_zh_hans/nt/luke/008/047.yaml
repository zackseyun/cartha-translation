    rationale: 希腊文λανθάνω的重点是未逃过他人注意或未能保持隐蔽，并不直接断言她作了主动隐瞒的行为。改为“没有躲过别人的注意”更精确，同时保留注意者未被明说的含混性。
  revised_text: 那女人见自己没有躲过别人的注意[a]，就战战兢兢地上前，俯伏在耶稣面前[b]，当着众人的面说明了自己为什么摸他，以及自己怎样立刻得了医治。
