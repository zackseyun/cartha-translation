  to: 那女人见自己没有躲过别人的注意[a]，就战战兢兢地上前，俯伏在耶稣面前[b]，当着众人的面说明了自己为什么摸他，以及自己怎样立刻得了医治。
  rationale: 修订仅解决脚注a的双重否定结构错误，并将正文中略带主动隐瞒色彩的说法调整为更贴近“未逃过注意”的表达。其余译文准确、自然，故予以保留。
