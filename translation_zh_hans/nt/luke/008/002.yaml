  text: καὶ γυναῖκές τινες αἳ ἦσαν τεθεραπευμέναι ἀπὸ πνευμάτων πονηρῶν καὶ ἀσθενειῶν, Μαρία ἡ καλουμένη Μαγδαληνή, ἀφ’ ἧς δαιμόνια ἑπτὰ ἐξεληλύθει,
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/002.yaml
  text: 'and some women who had been healed from evil spirits and sicknesses: Mary[a], called Magdalene, from whom seven demons had gone out[b],'
translation:
  language: zh_hans
  text: 还有几个妇女，曾从邪灵和疾病中得到医治；其中有一位叫抹大拉的马利亚，曾有七个鬼从她身上出去；
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γυναῖκές τινες
  choice: 几个……妇女
  rationale: τινες表示不确定的一部分人；“几个妇女”在现代汉语中自然简明。
- source_word: ἦσαν τεθεραπευμέναι
  choice: 曾被……治好的
  rationale: 未完成时ἦσαν与完成时被动分词构成迂回式，表达此前已经得到医治且结果仍然有效；“曾被治好”保留被动意义和先时性。
- source_word: ἀπὸ πνευμάτων πονηρῶν
  choice: 邪灵
  rationale: 直译πνεύματα πονηρά所指的邪恶灵体，并避免误译为原文未用的“污灵”。
- source_word: καὶ ἀσθενειῶν
  choice: 和疾病
  rationale: ἀσθένεια在此指身体的软弱或疾病；“疾病”清楚自然，也与前面的邪灵保持类别上的区别。
- source_word: ἡ καλουμένη Μαγδαληνή
  choice: 称为抹大拉的
  rationale: καλουμένη说明马利亚以“抹大拉”这一称号或地名标识为人所称；此译简洁且不额外断定其具体性质。
- source_word: ἀφ’ ἧς
  choice: 从她身上
  rationale: ἀπό表达离开或分离；汉语用“从她身上”比机械的“从她”更自然，同时没有增添附身机制的细节。
- source_word: δαιμόνια ἑπτὰ
  choice: 七个鬼
  rationale: δαιμόνια明确指鬼魔；“七个鬼”是普通现代读者易懂且符合圣经语域的表达，并与前面的广义“邪灵”用词有所区别。
- source_word: ἐξεληλύθει
  choice: 曾……出去
  rationale: ἐξέρχομαι的过去完成时表示在叙述时点以前已经离去；“曾……出去”自然传达这一先时动作。
theological_decisions:
- issue: 鬼魔折磨与疾病的关系
  choice: 分别译作“邪灵”和“疾病”，并将δαιμόνια译作人格化的“鬼”
  alternative: 把邪灵和鬼解释为心理或身体疾病的比喻
  rationale: 希腊文以πνευμάτων πονηρῶν、δαιμόνια和ἀσθενειῶν区分灵界折磨与身体疾病。译文保留这种区分，不将其化约为隐喻，也不添加关于两者关系的教义解释。
- issue: “七”的含义
  choice: 按字面译为“七个”
  alternative: 解释为象征完全或严重程度
  rationale: 经文本身给出数量，却未在本节解释其象征意义，因此不在正文中替读者作神学判定。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。此节在上下文中承接前句并继续列举，因此保留开头“还有”和结尾分号。无需脚注；英文层中脚注a的内容与正文对象错位，且“几个”已经自然涵盖τινες的语义；脚注b所列差异在中文里不构成有意义的译法区别。
