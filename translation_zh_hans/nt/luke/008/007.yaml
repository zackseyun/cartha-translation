  text: καὶ ἕτερον ἔπεσεν ἐν μέσῳ τῶν ἀκανθῶν, καὶ συμφυεῖσαι αἱ ἄκανθαι ἀπέπνιξαν αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/007.yaml
  text: And other seed fell among the thorns[b][a], and the thorns grew up with it and choked it.
translation:
  language: zh_hans
  text: 另有种子落在荆棘中；荆棘也一同长起来，把它挤得不能生长。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“荆棘和它一同长起来，把它窒息了。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτερον
  choice: 另有种子
  rationale: 中性单数形容词在比喻语境中作名词用，承接上文所撒的种子；汉语补出“种子”可明确所指。
- source_word: ἔπεσεν
  choice: 落在
  rationale: 直接表达种子落到某处的简单叙事动作，并与后面的地点短语自然衔接。
- source_word: ἐν μέσῳ τῶν ἀκανθῶν
  choice: 在荆棘中
  rationale: 保留“在……中间／之中”的空间意义，同时符合现代汉语表达。
- source_word: ἀκανθῶν / αἱ ἄκανθαι
  choice: 荆棘
  rationale: 指带刺植物；“荆棘”既准确又能保持比喻中前后用词一致。
- source_word: συμφυεῖσαι
  choice: 和它一同长起来
  rationale: 分词表示荆棘与种子所长出的植物一起生长；此译法保留共同生长的时间和竞争关系。
- source_word: ἀπέπνιξαν
  choice: 挤住了
  rationale: 该动词有使窒息、噎住之意；在植物争夺空间与资源的农业图景中，“挤住”自然地表达其生长受到遏制，同时脚注保留较直译的说法。
- source_word: αὐτό
  choice: 它
  rationale: 代词回指前面补出的“种子”，汉语使用“它”清楚自然。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“另有种子”补明希腊文中省略但由语境可知的中心语；分号体现两个连续动作。
