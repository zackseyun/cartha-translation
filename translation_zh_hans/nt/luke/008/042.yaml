  text: ὅτι θυγάτηρ μονογενὴς ἦν αὐτῷ ὡς ἐτῶν δώδεκα καὶ αὐτὴ ἀπέθνῃσκεν. Ἐν δὲ τῷ ὑπάγειν αὐτὸν οἱ ὄχλοι συνέπνιγον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/042.yaml
  text: because he had an only daughter[a], about twelve years old, and she was dying. And as he went[c][b], the crowds were pressing in on him.
translation:
  language: zh_hans
  text: 因为他有一个唯一的女儿[a]，约十二岁，正濒临死亡。耶稣去的时候，众人紧紧围挤着他[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “唯一的女儿”也可译作“独生女儿”。
    reason: lexical_alternative
  - marker: b
    text: 原文动词带有拥挤得几乎令人窒息的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: μονογενὴς
  choice: 独生
  rationale: 在“女儿”的家庭语境中，指唯一的孩子，而非强调生育方式；“独生女儿”是现代汉语中自然、准确的表达。
- source_word: ὡς ἐτῶν δώδεκα
  choice: 约十二岁
  rationale: ὡς与数目连用表示约数；“约十二岁”简洁保留近似含义。
- source_word: ἀπέθνῃσκεν
  choice: 已经奄奄一息
  rationale: 未完成时描写濒死的持续状态；此译法自然表达生命正在消逝、尚未死亡。
- source_word: Ἐν δὲ τῷ ὑπάγειν αὐτὸν
  choice: 耶稣去的时候
  rationale: 冠词不定式结构表示同时发生的行动。补出“耶稣”以避免现代汉语中代词指向含混，但不额外明说目的地。
- source_word: οἱ ὄχλοι
  choice: 人群
  rationale: 希腊文虽用复数，汉语通常以集合名词“人群”自然表达众多群众，避免生硬的“众人群”。
- source_word: συνέπνιγον
  choice: 从四面挤压着
  rationale: 该动词含拥挤、挤压乃至令人窒息的强烈色彩；“从四面挤压着”保留身体受压的力度，又不武断译成实际窒息。
- source_word: ὅτι
  choice: 因为
  rationale: 明确承接上一节，说明睚鲁恳求的原因。
- source_word: αὐτῷ
  choice: 他有
  rationale: 与ἦν构成所有关系，现代汉语自然表达为“他有”。
