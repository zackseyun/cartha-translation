  text: Ὑπόστρεφε εἰς τὸν οἶκόν σου, καὶ διηγοῦ ὅσα ⸂σοι ἐποίησεν⸃ ὁ θεός. καὶ ἀπῆλθεν καθ’ ὅλην τὴν πόλιν κηρύσσων ὅσα ἐποίησεν αὐτῷ ὁ Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/039.yaml
  text: Return to your house, and tell what great things God has done for you. And he went away, proclaiming throughout the whole city what Jesus had done for him.
translation:
  language: zh_hans
  text: “回你家去，述说上帝为你所做的一切。”于是那人离开，在全城各处宣扬耶稣为他所做的一切。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑπόστρεφε
  choice: 回……去
  rationale: 现在时命令语气要求他返回先前的地方；现代汉语“回你家去”直接自然。
- source_word: εἰς τὸν οἶκόν σου
  choice: 你家
  rationale: οἶκος在此由εἰς引导，具有地点意义；“你家”既表达住所，也保留回家的自然含义。
- source_word: διηγοῦ
  choice: 述说
  rationale: διηγέομαι指详加叙说、讲述；“述说”比单纯“说”更能体现其含义，同时保持庄重易懂。
- source_word: ὅσα σοι ἐποίησεν ὁ θεός
  choice: 上帝为你所做的一切
  rationale: ὅσα可指“所做的事”或“一切所做的”；译作“一切”不额外加入原文没有明说的“大事”，并符合上下文。
- source_word: ἀπῆλθεν
  choice: 离开
  rationale: ἀπέρχομαι在此表示从现场离去；“离开”简洁地保留这一动作。
- source_word: καθ’ ὅλην τὴν πόλιν
  choice: 走遍全城
  rationale: κατά加宾格在此有遍及、分布的意义；结合离去与宣扬的动作，“走遍全城”是自然汉语，并表达其活动遍及整座城。
- source_word: κηρύσσων
  choice: 宣扬
  rationale: κηρύσσω表示公开传报、宣告；“宣扬”保留公开传播的力度，又不限定为正式讲道。
- source_word: ὅσα ἐποίησεν αὐτῷ ὁ Ἰησοῦς
  choice: 耶稣为他所做的一切
  rationale: 与前句“上帝为你所做的一切”形成清楚的叙事平行，不另加解释。
theological_decisions:
- issue: 耶稣命令中的“上帝”与那人宣扬时的“耶稣”之间的平行
  choice: 保留“上帝为你所做的一切／耶稣为他所做的一切”的措辞转换
  alternative: 把两处统一译为“上帝”或“耶稣”，或添加“也就是耶稣”等解释
  rationale: 原文有意并置ὁ θεός与ὁ Ἰησοῦς，却不明说二者关系；译文应保存这种神学张力，不作超出文本的阐释。
translation_notes:
  register: 采用现代、庄重而通俗的普通话。“述说”与“宣扬”区分私人叙说命令和公开传报行动；句式简洁，适合经文朗读。
