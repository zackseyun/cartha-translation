  naturalness: “进入了他里面”在现代普通话中略显重复、生硬；“已经进到他里面”既自然，也清楚表达该进入事件在回答时已发生。“他却说”也较好地承接原文第二个δὲ。
  terminology: “鬼”是中文圣经语境中对δαιμόνια的常用且直接的译法，本节可保留。“军团”不应改作单纯数量词，因为原文将其作为对姓名问题的回答。
