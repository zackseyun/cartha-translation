  to: 耶稣问他：“你叫什么名字？”他却说：“军团。”因为有许多鬼已经进到他里面。
  rationale: 仅作自然度和叙事衔接的微调。“进到他里面”保留原文的方向性；“已经”以自然汉语表达该事件先于回答这一语境关系，并不声称希腊文另有过去完成时。脚注维持原有文化说明。
