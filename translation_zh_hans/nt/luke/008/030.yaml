  text: ἐπηρώτησεν δὲ αὐτὸν ὁ ⸀Ἰησοῦς· Τί σοι ⸂ὄνομά ἐστιν⸃; ὁ δὲ εἶπεν· Λεγιών, ὅτι ⸂εἰσῆλθεν δαιμόνια πολλὰ⸃ εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/030.yaml
  text: Then Jesus asked him[a], “What is your name?” And he said[b], “Legion,” because many demons had entered into him.
translation:
  language: zh_hans
  text: 耶稣问他：“你叫什么名字？”他却说：“军团。”因为有许多鬼已经进到他里面。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπηρώτησεν
  choice: 问
  rationale: 此处引出直接问句；“问”准确、自然，不必用较生硬的“询问”。
- source_word: δὲ
  choice: 未单独译出
  rationale: δέ在这里轻微承接叙事；现代汉语借语序即可自然表达，硬译为“然后”会略显累赘。
- source_word: Τί σοι ὄνομά ἐστιν
  choice: 你叫什么名字？
  rationale: 按现代汉语习惯表达这一希腊语问名句式，意义完整而自然。
- source_word: Λεγιών
  choice: 军团
  rationale: 这是源自拉丁语、指罗马大型军事单位的词；译出其词义，比单纯音译更能保留此处以庞大数量为名的含意，并以脚注补充文化背景。
- source_word: ὅτι
  choice: 因为
  rationale: 明确表达后半句对“军团”这一名字所作的原因说明。
- source_word: εἰσῆλθεν
  choice: 进入了
  rationale: 保留不定过去时所陈述的进入事件；汉语用“了”已能自然呈现已发生的动作，无须额外加入“已经”。
- source_word: δαιμόνια πολλὰ
  choice: 许多鬼
  rationale: “鬼”在本书语境中直接指邪恶的属灵存在，并保留πολλά所强调的多数。
- source_word: εἰς αὐτόν
  choice: 进入了他里面
  rationale: “进入……里面”保留εἰς的方向性，比单说“在他里面”更准确。
theological_decisions:
- issue: 附身语境中δαιμόνια的译法
  choice: 鬼
  alternative: 邪灵
  rationale: “鬼”直接对应δαιμόνια，也保留经文对多个邪恶属灵存在进入此人的陈述，不将其弱化为抽象力量。
- issue: “军团”是名字还是数量说明
  choice: 将“军团”保留为回答中的称名，并在脚注解释
  alternative: 译作“我名叫群”或仅意译为“很多”
  rationale: 希腊文把Λεγιών作为对名字问题的直接回答，同时ὅτι从数量上解释这一称名；正文和脚注共同保留这两层含意。
- issue: εἰσῆλθεν与回答之间的时间关系
  choice: 进入了
  alternative: 已经进入了
  rationale: 希腊文使用不定过去时，并未显式采用过去完成形式；汉语“进入了”既说明事件已发生，也避免把解释性的先后关系过度语法化。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事表达。“你叫什么名字”符合当代普通话问名习惯；“军团”兼顾原词的罗马军事背景和上下文中的数量含意。
