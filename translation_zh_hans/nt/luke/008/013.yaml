id: LUK.8.13
reference: Luke 8:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οἱ δὲ ἐπὶ τῆς πέτρας οἳ ὅταν ἀκούσωσιν μετὰ χαρᾶς δέχονται τὸν λόγον, καὶ οὗτοι ῥίζαν οὐκ ἔχουσιν, οἳ πρὸς καιρὸν πιστεύουσιν καὶ ἐν καιρῷ πειρασμοῦ ἀφίστανται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/013.yaml
  text: And the ones on the rock are those who[a], when they hear, receive the word with joy. But these have no root; they believe for a time, and in a time of testing they fall away.
translation:
  language: zh_hans
  text: 磐石上的，指的是那些听见后就欢喜领受这道的人。但这些人没有根；他们信了一段时间，到了受考验的时候[a]，就背离了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“到了受试探的时候”，也可理解为“试炼临到时”。希腊语这个词可按语境指考验、试炼或试探。
    reason: 保留πειρασμός的词义范围，避免正文单一译法掩盖原文的真实歧义。
lexical_decisions:
- source_word: ἐπὶ τῆς πέτρας
  choice: 磐石上的
  rationale: 贴近希腊文单数、具体的πέτρα，保留比喻中的磐石意象；用省略中心语的表达衔接上下文，不擅自改成复数的“石地”。
- source_word: ἀκούσωσιν
  choice: 听见后
  rationale: ὅταν加不定过去时虚拟语气在此表示一般情形；现代汉语用“听见后”自然表达听见与领受之间的先后关系。
- source_word: μετὰ χαρᾶς
  choice: 欢喜
  rationale: 简洁传达“带着喜乐”的情感色彩，并与“领受”自然搭配。
- source_word: δέχονται τὸν λόγον
  choice: 领受这道
  rationale: “领受”准确表达δέχομαι的接纳含义；“这道”保留λόγος的圣经语汇，同时由上下文明确指所传的信息。
- source_word: ῥίζαν οὐκ ἔχουσιν
  choice: 没有根
  rationale: 保留希腊文单数“根”及其比喻，表达紧凑自然。
- source_word: πρὸς καιρὸν
  choice: 一段时间
  rationale: 表示持续时间有限，比“暂时”更贴近短语结构，也符合现代汉语。
- source_word: πιστεύουσιν
  choice: 他们信
  rationale: 直接对应πιστεύω，不增添“似乎”“真正”等限定，以保留经文本身关于其信之性质的张力。
- source_word: ἐν καιρῷ πειρασμοῦ
  choice: 到了受考验的时候
  rationale: πειρασμός可指考验、试炼或试探；正文采用较宽泛的“考验”，并保留时间性表达，其他可能含义收入脚注。
- source_word: ἀφίστανται
  choice: 就背离了
  rationale: 表达从先前所信的立场离开，保留其严重性；不补出具体宾语，也不用技术性较强的“叛教”，避免过度界定。
theological_decisions:
- issue: πιστεύουσιν是否表示真正得救的信心
  choice: 译作“他们信”，不说明这种信是得救之信、表面相信或貌似相信。
  alternative: 可解释为“他们似乎相信”“他们真信而后背离”或“他们只是表面相信”。
  rationale: 原文只说明他们信了一段时间，后来背离，并未在本节中裁定有关得救之信与坚忍的教义争论。
- issue: πειρασμός在本节中的含义
  choice: 正文译作“考验”。
  alternative: 也可理解为“试探”或“试炼”。
  rationale: 该词既可指外在考验，也可指引诱人犯罪的试探；正文采用涵盖面较广的译法，脚注保留其他可能。
- issue: ἀφίστανται的神学力度
  choice: 译作“背离了”，不明说“叛教”或补出“失去救恩”。
  alternative: 可译“离开了”“退后了”或“叛教了”。
  rationale: 该动词在语境中确有离弃先前信仰立场的严重含义，但译文不应借此预先解决有关背道与救恩的后续神学问题。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“磐石”“领受这道”“没有根”保留比喻和必要的圣经语感；“一段时间”“到了……的时候”使句子自然流畅。分号呈现暂时相信与后来背离之间的紧密转折。
