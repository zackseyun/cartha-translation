id: LUK.8.16
reference: Luke 8:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Οὐδεὶς δὲ λύχνον ἅψας καλύπτει αὐτὸν σκεύει ἢ ὑποκάτω κλίνης τίθησιν, ἀλλ’ ἐπὶ λυχνίας ⸀τίθησιν, ἵνα οἱ εἰσπορευόμενοι βλέπωσιν τὸ φῶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/016.yaml
  text: No one, after lighting a lamp, covers it with a container or puts it under a bed, but puts it on a lampstand, so that those who come in may see the light.
translation:
  language: zh_hans
  text: 没有人点了灯，用器皿把灯盖住，或放在床下；反而把灯放在灯台上，好让进来的人看见光。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λύχνον
  choice: 灯
  rationale: 指当时点燃照明的油灯；现代汉语用“灯”自然清楚，无须在正文中补明器具类型。
- source_word: σκεύει
  choice: 器皿
  rationale: 原词泛指器具或容器；“器皿”保留其非特指性，也符合覆盖灯的语境。
- source_word: κλίνης
  choice: 床
  rationale: 原词在此指供人躺卧的床榻；“床”是现代汉语最直接自然的对应。
- source_word: λυχνίας
  choice: 灯台
  rationale: 指放置灯以提高照明位置的台架；“灯台”准确且能与“灯”清楚区分。
- source_word: οἱ εἰσπορευόμενοι
  choice: 进来的人
  rationale: 保留现在分词所表达的泛指进入者，中文简洁自然。
- source_word: τὸ φῶς
  choice: 亮光
  rationale: 在此指灯所发出的可见光；“亮光”比单说“光”更自然地承接“看见”。
theological_decisions:
- issue: 比喻的解释是否写入正文
  choice: 只翻译灯、遮盖、灯台和亮光的具体图景，不在正文中指明其象征对象
  alternative: 把“灯”或“亮光”直接解释为福音、真理或见证
  rationale: 本节本身保留比喻性，象征意义须由上下文呈现；直接解释会缩窄原文的开放张力。
- issue: δὲ的篇章衔接
  choice: 不以“现在”或“但”机械显译，借中文句序自然承接上文
  alternative: 句首译作“现在”或“然而”
  rationale: δὲ在这里主要承担轻微的篇章推进作用，并非时间副词，也未必表示强转折；中文不译更自然且不增加原文没有的时间含义。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙述。“点上灯后”符合汉语习惯；分号凸显反面做法与正常做法的对照。“他总是”将希腊语单数谓语的泛指主体自然显出，并表达常理性的对照，不指特定男性。
