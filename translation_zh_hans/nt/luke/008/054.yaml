base_translation:
  language: en
  yaml_path: translation/nt/luke/008/054.yaml
  text: But he took her by the hand and called out[a], saying, “Child, arise.”
translation:
  language: zh_hans
  text: 他却握住她的手，呼喊道：“孩子[a]，起来！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“女孩”。希腊语παῖς可指“孩子”，在本语境中也可指“女孩”。
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς δὲ
  choice: 但他
  rationale: δέ在这里承接上文并带有轻微转折；“但他”自然呈现叙事转向。αὐτός以“他”表达，不刻意强化为“他自己”。
- source_word: κρατήσας τῆς χειρὸς αὐτῆς
  choice: 拉着她的手
  rationale: κρατέω表示抓住、握住；“拉着她的手”符合现代汉语习惯，清楚表达实际的身体动作，又不带“抓牢”或“攫住”的强硬意味。
- source_word: ἐφώνησεν λέγων
  choice: 高声呼唤说
  rationale: φωνέω表示发声呼唤，此处用“高声呼唤”体现清楚可闻的召唤，而不暗示惊慌；λέγων保留为“说”，引出直接引语。
- source_word: Ἡ παῖς
  choice: 孩子
  rationale: παῖς可泛指孩子，也可依上下文特指女孩；“孩子”保留原词的词义宽度和亲切语气，不从平行经文引入“小女孩”的指小意味。定冠词在此具有呼语功能，无须另译。
- source_word: ἔγειρε
  choice: 起来
  rationale: ἐγείρω的现在时命令式在这里是直接命令她起身；“起来”既是自然的现代汉语，也适合从死亡中恢复生命的语境，同时不将其缩窄为单纯“醒来”。
theological_decisions:
- issue: 耶稣对睚鲁女儿的称呼
  choice: 孩子
  alternative: 女孩
  rationale: παῖς本身既可泛指孩子，也可在本语境中指女孩。“孩子”保留原文的词义空间与温柔语气，并避免与平行记载的措辞人为协调。
- issue: 耶稣使女孩复生时的命令
  choice: 起来
  alternative: 起身
  rationale: 采用直接、庄重而不古奥的命令语，既保留神迹叙事的力度，也不把ἐγείρω解释成仅仅从睡眠中醒来。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“高声呼唤说”保留原文两个动词的层次；引语简洁直接。“孩子”旁加脚注，既让正文流畅，也保留原文真实的词义弹性。
