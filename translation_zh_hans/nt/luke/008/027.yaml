  text: ἐξελθόντι δὲ αὐτῷ ἐπὶ τὴν γῆν ⸀ὑπήντησεν ἀνήρ τις ἐκ τῆς πόλεως ⸀ἔχων δαιμόνια· ⸂καὶ χρόνῳ ἱκανῷ οὐκ ἐνεδύσατο ἱμάτιον⸃, καὶ ἐν οἰκίᾳ οὐκ ἔμενεν ἀλλ’ ἐν τοῖς μνήμασιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/027.yaml
  text: And when he came out onto the land[a], a certain man from the city met him, who had demons. And for a considerable time he had not put on clothing[b], and he did not stay in a house but among the tombs.
translation:
  language: zh_hans
  text: 耶稣上了岸[a]，有一个城里的人，身上有鬼[b]，迎面来见他。他已经很久没有穿衣服，也不住在房屋里，而是住在坟墓间。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“来到陆地上”。
    reason: lexical_alternative
  - marker: b
    text: 或译“被鬼附的人”。原文直译为“有鬼”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντι ... αὐτῷ ἐπὶ τὴν γῆν
  choice: 耶稣上了岸
  rationale: 该分词结构表示时间或伴随情境，所指的是耶稣；“上了岸”自然表达从船上来到陆地的动作。正文明确补出“耶稣”，避免现代汉语代词指向不清。
- source_word: ὑπήντησεν
  choice: 迎面而来
  rationale: 既表达相遇，也保留那人主动来到耶稣面前的叙事动势。
- source_word: ἀνήρ τις
  choice: 有一个……的人
  rationale: “一个”自然体现 τις 的不定而具体的叙事用法；“人”符合现代汉语表达，语境和原词 ἀνήρ 均表明此人为男性。
- source_word: ἐκ τῆς πόλεως
  choice: 城里
  rationale: 表达此人与那座城的来源或关联，在汉语中比“从城出来”更能避免把原文未明确陈述的即时移动过程说死。
- source_word: ἔχων δαιμόνια
  choice: 身上有鬼
  rationale: 贴近原文“有鬼”的措辞，不在正文中直接采用解释性更强的“被鬼附”。
- source_word: χρόνῳ ἱκανῷ
  choice: 已经很久
  rationale: 自然表达一段相当长的持续时间，并与后面的状态描写顺畅衔接。
- source_word: οὐκ ἐνεδύσατο ἱμάτιον
  choice: 不穿衣服
  rationale: 以自然现代汉语表达“没有穿上衣物”的持续状况，不把 ἱμάτιον 过窄地限定为某一件特定衣服。
- source_word: ἐν οἰκίᾳ οὐκ ἔμενεν
  choice: 不住在房屋里
  rationale: “住”可表达未完成时所描写的惯常状态；“房屋”保留 οἰκία 的一般含义。
- source_word: ἀλλ’ ἐν τοῖς μνήμασιν
  choice: 而是住在坟墓间
  rationale: “坟墓间”清楚呈现复数埋葬处的环境，同时不武断断定他始终身处某一座墓穴内部。
theological_decisions:
- issue: δαιμόνια 在邪灵压制语境中的译法
  choice: 鬼
  alternative: 污灵
  rationale: 此处原词是 δαιμόνια，而不是 πνεύματα ἀκάθαρτα；“鬼”是直接且通行的对应，避免混同福音书中不同的原文表达。
- issue: 是否把 ἔχων δαιμόνια 直接译成“被鬼附”
  choice: 身上有鬼
  alternative: 被鬼附
  rationale: 原文直陈此人“有鬼”，并未在该短语中使用表示占有或附身的动词。正文保留较少解释性的说法，常见的“被鬼附”则列入脚注。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。句子依照汉语叙事习惯补明“耶稣”，并用“迎面而来”“已经很久”等常用表达保持可读性；同时避免用“被鬼附”在正文中消解原文“有鬼”的措辞张力。
