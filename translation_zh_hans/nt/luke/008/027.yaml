  to: 耶稣上了岸[a]，有一个城里的人，身上有鬼[b]，迎面来见他。他已经很久没有穿衣服，也不住在房屋里，而是住在坟墓间。
  rationale: 修订明确译出该人“来自／属于那城”的关联，以及他迎面来与耶稣相遇的动作，同时保留δαιμόνια的“鬼”和ἔχων的“有”这一较少解释性的表达。时间状态改为“很久没有穿衣服”，使汉语更自然且更清楚地反映持续已久的背景描述。
