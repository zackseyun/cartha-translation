  source_fidelity: “耶稣上了岸”可准确表达耶稣来到陆地的叙事情境；“身上有鬼”也适当保留了ἔχων δαιμόνια的非解释性措辞。不过，“城里有一个……”容易被理解为地点存在句，未清晰表达该人“来自／属于那城”；“迎面而来”也没有明确译出他是来与耶稣相遇。
  naturalness: 原译整体通顺、语体适合现代标准汉语。改为“有一个城里的人……迎面来见他”，可使施事、来源关联及相遇对象更明确而自然。“很久没有穿衣服”也比“已经很久不穿衣服”更贴合这里对既有持续状态的叙述。
  terminology: “鬼”对应δαιμόνια，且不把原文的“有”直接改写为“被鬼附”，处理恰当。“坟墓间”可保留，既自然又不限定为在某一墓穴内部。
