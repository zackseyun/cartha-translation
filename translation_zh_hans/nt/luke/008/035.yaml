id: LUK.8.35
reference: Luke 8:35
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐξῆλθον δὲ ἰδεῖν τὸ γεγονὸς καὶ ἦλθον πρὸς τὸν Ἰησοῦν, καὶ εὗρον καθήμενον τὸν ἄνθρωπον ἀφ’ οὗ τὰ δαιμόνια ⸀ἐξῆλθεν ἱματισμένον καὶ σωφρονοῦντα παρὰ τοὺς πόδας τοῦ Ἰησοῦ, καὶ ἐφοβήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/035.yaml
  text: Then they went out to see what had happened[a], and they came to Jesus and found the man from whom the demons had gone out sitting, clothed, and in his right mind at Jesus's feet[b], and they were afraid.
translation:
  language: zh_hans
  text: 于是，众人出来，要看看发生了什么事。他们来到耶稣那里，看见那个众鬼已经从他身上出来[a]的人，穿着衣服，神志清醒[b]，坐在耶稣脚前；他们就害怕起来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本的动词用复数形式，即“众鬼已经出来”；此处所据正文的动词为单数，但主语“众鬼”为复数，句意不受影响。
    reason: textual_variant
  - marker: b
    text: 或译：“心智健全”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον
  choice: 出来
  rationale: 表达众人从城里或附近地区出来察看事情的叙事动作，符合上下文方向。
- source_word: ἰδεῖν τὸ γεγονός
  choice: 要看看发生了什么事
  rationale: 将目的不定式和实词化的完成时分词自然结合，既表达察看的目的，也保留事情已经发生的时态关系。
- source_word: τὸν ἄνθρωπον ἀφ’ οὗ τὰ δαιμόνια ἐξῆλθεν
  choice: 那个众鬼已经从他身上出来的人
  rationale: 保留关系从句的结构和“众鬼”的超自然、人格性含义；用“已经”标明赶鬼发生在众人看见此人之前。
- source_word: ἱματισμένον
  choice: 穿着衣服
  rationale: 自然清楚，并与上文此人先前赤身露体的状态形成对照。
- source_word: σωφρονοῦντα
  choice: 神志清醒
  rationale: 表达心智恢复正常、能够自持的状态，又避免引入现代临床诊断术语。
- source_word: παρὰ τοὺς πόδας τοῦ Ἰησοῦ
  choice: 坐在耶稣脚前
  rationale: 准确表达此人在耶稣脚旁或脚前坐着的空间位置，同时不把可能含有的顺服或门徒意味明说出来。
- source_word: ἐφοβήθησαν
  choice: 他们就害怕起来
  rationale: 用自然的现代汉语表达不定过去时所叙述的即时反应。
theological_decisions:
- issue: 赶鬼叙事中 δαιμόνια 的译法
  choice: 众鬼
  alternative: 邪灵
  rationale: “鬼”直接保留原文所呈现的超自然、人格性存在，不把叙事化约为疾病或比喻；“众”明确反映复数。
- issue: σωφρονοῦντα 所表达的恢复状态
  choice: 神志清醒
  alternative: 心智健全；恢复理智
  rationale: 此译法同时传达清醒、理智和自持，且不把经文套入现代精神医学类别。
- issue: 坐在耶稣脚前的潜在含义
  choice: 仅明译其位置
  alternative: 译成“像门徒一样坐在耶稣脚前”
  rationale: 这一姿态可能暗示顺服或门徒身份，但原文没有明说，因此不在正文中消除其含蓄性。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“众人”根据复数动词及上下文补出；分号呈现众人所见与其恐惧反应之间的叙事转折。脚注标记依其实际所释内容分别置于“出来”和“神志清醒”之后。
