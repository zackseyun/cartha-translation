id: LUK.8.29
reference: Luke 8:29
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ⸀παρήγγελλεν γὰρ τῷ πνεύματι τῷ ἀκαθάρτῳ ἐξελθεῖν ἀπὸ τοῦ ἀνθρώπου. πολλοῖς γὰρ χρόνοις συνηρπάκει αὐτόν, καὶ ⸀ἐδεσμεύετο ἁλύσεσιν καὶ πέδαις φυλασσόμενος, καὶ διαρρήσσων τὰ δεσμὰ ἠλαύνετο ⸀ὑπὸ τοῦ ⸀δαιμονίου εἰς τὰς ἐρήμους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/029.yaml
  text: For he had commanded the unclean spirit to come out of the man[a]. For many times it had seized him, and he was kept bound with chains and shackles, being guarded, and breaking the bonds[c][b], he was driven by the demon into the desolate places.
translation:
  language: zh_hans
  text: 因为耶稣曾吩咐那污灵从这人身上出来。那污灵已经控制他很久了；他曾被人用锁链和脚镣捆住并看守；他挣断这些捆绑，受那鬼驱赶到荒凉之地。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρήγγελλεν
  choice: 曾吩咐
  rationale: 未完成时在γάρ引出的解释性背景中指向先前发出的命令；“曾吩咐”自然表达相对于鬼回应而言的在先行动，同时不将其过度限定为一次性动作。
- source_word: πνεύματι τῷ ἀκαθάρτῳ
  choice: 那污灵
  rationale: “污灵”保留ἀκάθαρτος与礼仪及道德污秽语汇的联系，也是现代中文圣经语境中简明可懂的表达。
- source_word: ἐξελθεῖν ἀπὸ τοῦ ἀνθρώπου
  choice: 从这人身上出来
  rationale: 自然表达驱邪语境中的离开，并保留ἀπό所表达的分离方向。
- source_word: πολλοῖς γὰρ χρόνοις
  choice: 多次
  rationale: 复数χρόνοις结合上下文中反复捆锁、挣断和驱赶的情形，较支持反复发生；持续很久的可能性在脚注中保留。
- source_word: συνηρπάκει
  choice: 抓住
  rationale: 表达污灵突然控制、攫住此人的强制意味；前面的“多次”已清楚呈现反复性。
- source_word: ἐδεσμεύετο ἁλύσεσιν καὶ πέδαις
  choice: 人们用锁链和脚镣捆住他
  rationale: 希腊语为被动式，中文补出不特定施事“人们”使句意自然；“锁链”和“脚镣”区分两种拘束器具。
- source_word: φυλασσόμενος
  choice: 严加看守
  rationale: 表达此人在受捆绑的同时被置于看守之下；“严加”符合拘禁语境，但不增添新的具体情节。
- source_word: διαρρήσσων τὰ δεσμὰ
  choice: 挣断捆绑
  rationale: διαρρήσσω带有撕裂、挣断的力度；δεσμά泛指拘束物，用“捆绑”避免仅重复前面的“锁链”。
- source_word: ἠλαύνετο ὑπὸ τοῦ δαιμονίου
  choice: 受那鬼驱赶
  rationale: 被动未完成时呈现反复、强制性的驱使；“鬼”直接表达δαιμόνιον的位格性邪灵含义，不将其心理化。
- source_word: εἰς τὰς ἐρήμους
  choice: 进入荒无人烟的地方
  rationale: 保留复数形式所指的荒僻、无人居住之地，又避免把地貌限定为沙漠。
theological_decisions:
- issue: 邪灵用语及其行动主体性
  choice: 分别译作“污灵”和“鬼”，并译明其抓住、驱赶此人
  alternative: 邪恶的力量／精神失常
  rationale: 经文叙事明确把这些行动归于具有主体性的邪灵；直译可保留文本的神学世界，而不将其淡化为抽象力量或纯心理现象。
- issue: 耶稣命令与鬼回应的时序
  choice: “曾吩咐”
  alternative: “正吩咐”
  rationale: 解释性γάρ和叙事上下文支持把命令理解为鬼回应之前的行动；“曾”表达相对在先，但未将希腊语未完成时硬性改成单次完成体。
- issue: 人的束缚行动与鬼的驱赶之间的转折
  choice: 以“虽……却……”明示语境中的让步关系
  alternative: 按καί逐项译为“并且……并且……”
  rationale: 希腊语虽只用连接词καί，但捆住与挣断在语义上形成明显反差；中文用“虽……却……”使关系清楚，不改变事件内容。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“这人”承接近指语境；“荒无人烟的地方”保留原文复数和无人居住之意。脚注标记置于相关整句末尾，说明“多次”的词义歧义。
