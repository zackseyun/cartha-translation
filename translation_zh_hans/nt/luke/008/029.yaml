revisions:
- from: 因为耶稣曾吩咐那污灵从这人身上出来。原来那污灵多次抓住他；人们虽用锁链和脚镣捆住他，严加看守，他却挣断捆绑，受那鬼驱赶，进入荒无人烟的地方。[a]
  to: 因为耶稣曾吩咐那污灵从这人身上出来。那污灵已经控制他很久了；他曾被人用锁链和脚镣捆住并看守；他挣断这些捆绑，受那鬼驱赶到荒凉之地。
  rationale: 将 πολλοῖς χρόνοις 译为“已经……很久”，保留其持续时间含义及前后时序；删除基于“多次”的词义脚注。将原稿的让步式连接改为中性分句，避免把 καί 所留下的关系歧义解释成明示转折。其余核心术语和叙事中的非自愿驱赶均予保留。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T03:21:02Z'
review_pass:
  verdict: revise
  source_fidelity: 需要修订。“多次”不合 πολλοῖς χρόνοις 在此处表示持续时间的通常用法；结合完成时 συνηρπάκει，应译为“很久／长期”。原稿以“虽……却……”强化了原文仅以 καί 连结的让步关系，宜改为较中性的顺承叙述。
  naturalness: 原文整体流畅、叙事庄重。“人们虽……他却……”虽自然，但加入让步强调；改为分句叙述可同时保持现代汉语自然性和原文的开放关系。“控制他很久”比“多次抓住他”更符合持续时段且自然。
  terminology: “污灵”对应 πνεῦμα ἀκάθαρτον，“鬼”对应 δαιμόνιον，可保留二者在原文中的不同称谓；“锁链和脚镣”准确区分 ἁλύσεις 与 πέδαι。“荒凉之地”不把 ἐρήμους 限定为沙漠，表达适当。
  issues:
  - severity: high
    issue: “多次”及其脚注将 πολλοῖς χρόνοις 处理为反复次数。
    rationale: 该与格复数短语在此通常表示“很久以来／长期”，不是“多次”。上下文虽有反复束缚的未完成时描写，却不足以把该短语改译为次数。
  - severity: medium
    issue: “虽……却……”将连接词关系明确化为让步转折。
    rationale: 原文以连续的 καί 连接受捆绑、挣断捆绑和被驱赶等叙述；事件之间可以形成语义反差，但不宜在正文中以强制性的让步结构预先界定。
  revised_text: 因为耶稣曾吩咐那污灵从这人身上出来。那污灵已经控制他很久了；他曾被人用锁链和脚镣捆住并看守；他挣断这些捆绑，受那鬼驱赶到荒凉之地。
