base_translation:
  language: en
  yaml_path: translation/nt/luke/008/003.yaml
  text: and Joanna[a], the wife of Chuza, Herod’s steward, and Susanna, and many others[b], who were serving them out of their possessions.
translation:
  language: zh_hans
  text: 还有希律的管家苦撒的妻子约亚拿，苏撒拿，以及许多别的妇女；她们用自己的财物[b]供给他们[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“他”，而不是“他们”。
    reason: textual_variant
  - marker: b
    text: “用自己的财物”也可译作“从自己的产业中”或“用自己的资财”。
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνὴ Χουζᾶ
  choice: 苦撒的妻子
  rationale: γυνή与人名属格连用，在此最自然地表示婚姻关系；译作“妻子”清楚自然。
- source_word: ἐπιτρόπου Ἡρῴδου
  choice: 希律的管家
  rationale: ἐπίτροπος指受托管理事务或财产的人；“管家”适合希律宫廷或产业的语境，也比现代企业色彩较浓的“经理”庄重。
- source_word: ἕτεραι πολλαί
  choice: 许多别的妇女
  rationale: 形容词为阴性复数，明确承接前文所列妇女；中文补出“妇女”可避免“许多别人”指代不明。
- source_word: διηκόνουν
  choice: 供给
  rationale: διακονέω基本义为服事、照料；后接“用自己的财物”，此处物质供应的含义突出。“供给”自然表达这种服事方式，同时避免引入后世教会职分含义。
- source_word: αὐτοῖς
  choice: 他们
  rationale: SBLGNT正文为复数αὐτοῖς，最自然地指耶稣和与他同行的人；译文遵从所给希腊正文。
- source_word: ἐκ τῶν ὑπαρχόντων αὐταῖς
  choice: 用自己的财物
  rationale: 该短语表示从属于这些妇女的资产或资源中提供支持；“用自己的财物”简洁、自然，并保留所有权与物质来源。
theological_decisions:
- issue: αὐτοῖς的所指与单复数异文
  choice: 采用复数“他们”，指耶稣及与他同行的人
  alternative: 采用单数“他”，只指耶稣
  rationale: 所给SBLGNT正文读作复数αὐτοῖς，应优先据此翻译；部分抄本的单数读法在脚注说明，不在正文中调和。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“约亚拿、苦撒、苏撒拿”按常见圣经人名译法处理；将较长的希腊并列关系分为两句，以保持中文清晰流畅。所有脚注标记均置于正文中。
