id: LUK.8.8
reference: Luke 8:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἕτερον ἔπεσεν εἰς τὴν γῆν τὴν ἀγαθήν, καὶ φυὲν ἐποίησεν καρπὸν ἑκατονταπλασίονα. ταῦτα λέγων ἐφώνει· Ὁ ἔχων ὦτα ἀκούειν ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/008.yaml
  text: And another fell into the good soil[a], and when it grew, it produced fruit a hundredfold. As he said these things, he called out, “He who has ears to hear[c][b], let him hear.”
translation:
  language: zh_hans
  text: 又有一粒落在好土里[a]，长起来以后，结出了百倍的果实。耶稣说这些话时，高声喊道：“有耳可听的，就应当听！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“肥沃的土壤”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτερον
  choice: 又有一粒
  rationale: 中性单数在撒种比喻中指另一粒种子；补出量词“粒”，使现代汉语自然，并与上下文衔接。
- source_word: γῆν τὴν ἀγαθήν
  choice: 好土
  rationale: 在农耕语境中，γῆ指适宜种植的土壤；“好土”简洁自然，也保留“好”的评价意味。
- source_word: φυὲν
  choice: 长起来以后
  rationale: 不定过去时被动形态的分词在此表达种子生长后才结果的先后关系；译文以“以后”明确保留这一顺序。
- source_word: ἐποίησεν καρπὸν
  choice: 结出了……果实
  rationale: 按汉语农业表达译为“结出果实”，既自然又保留实际产出的含义。
- source_word: ἑκατονταπλασίονα
  choice: 百倍
  rationale: 准确表达一百倍的产量，且符合现代汉语常用说法。
- source_word: ταῦτα λέγων
  choice: 说这些话时
  rationale: 现在时分词与主句动作同时发生，用“时”自然表达时间重叠。
- source_word: ἐφώνει
  choice: 高声喊道
  rationale: 未完成时的 φωνέω 表达响亮、强调的发声；“高声喊道”保留公开呼喊的力度而不过度渲染。
- source_word: Ὁ ἔχων ὦτα ἀκούειν
  choice: 有耳可听的
  rationale: 保留希腊文定冠词加分词结构的概括性与单数代表意义；汉语不必引入男性指称。
- source_word: ἀκουέτω
  choice: 就应当听
  rationale: 第三人称现在时命令语气在汉语中用“应当”传达郑重劝令；避免把“让他听”误解为准许之意。
theological_decisions:
- issue: “有耳可听”这一劝告的代表性与命令力度
  choice: “有耳可听的，就应当听！”
  alternative: “凡有耳可听的，就听吧！”
  rationale: 原文是单数、概括性的定冠词分词结构，所指不限于男性；“有耳可听的”保留其凝练形式。“应当听”传达第三人称命令语气的郑重呼召，同时不把它弱化为单纯许可。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“又有一粒”补足汉语所需的种子量词；“百倍的果实”保留比喻的丰收意象。主文中的脚注标记[a]与脚注对应。
