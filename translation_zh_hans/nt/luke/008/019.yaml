  text: ⸀Παρεγένετο δὲ πρὸς αὐτὸν ἡ μήτηρ καὶ οἱ ἀδελφοὶ αὐτοῦ, καὶ οὐκ ἠδύναντο συντυχεῖν αὐτῷ διὰ τὸν ὄχλον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/019.yaml
  text: Then his mother and his brothers came to him[b][a], but they were not able to reach him because of the crowd.
translation:
  language: zh_hans
  text: 耶稣的母亲和弟兄们来到他那里，却因人群拥挤，无法接近他[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “接近他”也可译作“到他跟前”或“与他会面”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρεγένετο δὲ πρὸς αὐτὸν
  choice: 来找他
  rationale: παραγίνομαι配合πρός表示来到某人那里；“来找他”自然表达朝向耶稣而来的意思，又不增添“来看望”等未明说的具体目的。δέ在此推动叙事，中文无需另译“然后”也能保持顺畅。
- source_word: ἡ μήτηρ καὶ οἱ ἀδελφοὶ αὐτοῦ
  choice: 耶稣的母亲和弟兄们
  rationale: 上下文所指为耶稣；明确说出名字可避免汉语代词领属关系含混。ἀδελφοί按其字面和阳性复数译为“弟兄们”，不擅自改作“亲属”。
- source_word: οὐκ ἠδύναντο
  choice: 不能
  rationale: 准确表达未完成时形式所描述的当时无能为力；现代汉语用“不能”简洁自然。
- source_word: συντυχεῖν αὐτῷ
  choice: 到他跟前
  rationale: συντυγχάνω在这里指接近、接触或会面；因人群阻隔，“到他跟前”贴合具体情境，同时以脚注保留“见到他”的词义可能。
- source_word: διὰ τὸν ὄχλον
  choice: 因为人多
  rationale: διά加宾格表示原因；“因为人多”比“因为群众”更符合现代汉语对此拥挤场景的自然表达。
theological_decisions:
- issue: “他的弟兄们”的亲属关系
  choice: 译作“弟兄们”，不进一步界定具体亲属关系
  alternative: 亲属们；族人们
  rationale: 原文ἀδελφοί通常意为“弟兄”，但本节没有说明他们是同母弟兄、异母弟兄或其他近亲。正文保留原文称谓，既不弱化为泛称，也不借翻译解决后世的教义争议。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“弟兄们”保持原文的男性复数亲属称谓；“因为人多”以日常而不失 dignified 的表达呈现人群造成的阻隔。脚注标记已在正文对应位置出现。
