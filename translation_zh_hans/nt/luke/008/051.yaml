base_translation:
  language: en
  yaml_path: translation/nt/luke/008/051.yaml
  text: When he came into the house[a], he did not allow anyone to enter with him except Peter and John and James, and the girl's father and mother.
translation:
  language: zh_hans
  text: 耶稣来到那家时，不许任何人跟他进去，只准彼得、约翰、雅各和那女孩的父母进去。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλθὼν δὲ εἰς τὴν οἰκίαν
  choice: 耶稣来到那家里
  rationale: 以自然的汉语叙事表达不定过去时分词的时间先后关系；补出主语“耶稣”以避免汉语中指代含混。“那家里”兼顾 οἰκία 的具体住所含义和上下文所指。
- source_word: οὐκ ἀφῆκεν εἰσελθεῖν τινα σὺν αὐτῷ
  choice: 不许任何人同他进去
  rationale: ἀφίημι 在此意为准许；否定句中的 τινα 具有“任何人”的泛指意义。将 σὺν αὐτῷ 自然地与“进去”相连。
- source_word: εἰ μὴ
  choice: 只让……进去
  rationale: 在否定排除结构中表示例外。汉语用“不许任何人……只让……”比直译“除了”更流畅，并清楚保留例外关系。
- source_word: Πέτρον καὶ Ἰωάννην καὶ Ἰάκωβον
  choice: 彼得、约翰、雅各
  rationale: 采用现代中文通行的圣经人名译法；汉语列举使用顿号，无须机械复制希腊语重复的 καί。
- source_word: τὸν πατέρα τῆς παιδὸς καὶ τὴν μητέρα
  choice: 女孩的父母
  rationale: παῖς 本身可泛指孩子，但上下文明确她是睚鲁的女儿，故译作“女孩”。“父母”在汉语中自然涵盖分别列出的父亲和母亲。
theological_decisions:
- issue: παῖς 在本节中的性别指向
  choice: 女孩
  alternative: 孩子
  rationale: 该词词义本可泛指孩子，但本段上下文明确所指为睚鲁的女儿；译作“女孩”是语境限定，而非引入神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“只让”与前面的“不许任何人”构成自然的汉语排除结构。经文无须脚注；英文咨询层所附脚注的标记位置与内容似不一致，而且其所谓词义差异可由上下文直接妥善处理。
