source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ καθεξῆς καὶ αὐτὸς διώδευεν κατὰ πόλιν καὶ κώμην κηρύσσων καὶ εὐαγγελιζόμενος τὴν βασιλείαν τοῦ θεοῦ, καὶ οἱ δώδεκα σὺν αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/001.yaml
  text: And it happened soon afterward that he was traveling through city after city and village after village[a], proclaiming and bringing the good news of the kingdom of God[c][b], and the Twelve were with him.
translation:
  language: zh_hans
  text: 此后不久，耶稣周游各城各村[a]，宣讲，并传扬上帝国度的好消息[b]；十二位和他在一起。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从一城到另一城、从一村到另一村。”
    reason: 说明κατά与单数名词所表达的逐处、分布性含义。
  - marker: b
    text: “上帝的国度”也可译作“上帝的统治”。
    reason: 保留βασιλεία兼有国度与统治的语义张力。
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ καθεξῆς
  choice: 此后不久
  rationale: 这是路加用来承接叙事、表示随后发生之事的时间表达；汉语用“此后不久”自然地传达事件的延续次序，而不机械保留“事情发生了”的希腊语句式。
- source_word: αὐτὸς
  choice: 耶稣
  rationale: 希腊文用明确代词指向前文的耶稣；在独立经节中补出姓名，可避免现代汉语中的指代不明，并不增加新的所指。
- source_word: διώδευεν
  choice: 周游
  rationale: 未完成时表示持续或反复的行动，动词也包含经过各地的意思；“周游”简洁地表达持续走遍多个地点。
- source_word: κατὰ πόλιν καὶ κώμην
  choice: 各城各村
  rationale: κατά与单数名词连用具有逐一、分布性的含义；“各城各村”自然表达从一处到另一处的反复行程。
- source_word: κηρύσσων
  choice: 宣讲
  rationale: 保留公开宣告的意味，并与后面的“传扬这好消息”形成词义区分。
- source_word: εὐαγγελιζόμενος
  choice: 传扬这好消息
  rationale: 表达宣布福音、带来好消息之意，同时不与κηρύσσων合并为同一个汉语动词。
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: 上帝的国
  rationale: 这是现代汉语中准确而宽广的表达，可同时容纳上帝统治和其国度的含义，不把βασιλεία单限于抽象的“掌权”。
- source_word: οἱ δώδεκα
  choice: 十二使徒
  rationale: 该短语是对耶稣所拣选之十二人的固定群体称谓；“十二使徒”在现代汉语中清楚自然，但正文原文只直译为“十二位”，因此此处存在解释性补足。
- source_word: σὺν αὐτῷ
  choice: 也和他同行
  rationale: 表达他们与耶稣一同在路上的陪伴关系；“同行”结合本节周游各地的语境，比单说“和他在一起”更自然。
theological_decisions:
- issue: βασιλεία τοῦ θεοῦ的译法
  choice: 上帝的国
  alternative: 上帝的统治
  rationale: βασιλεία既可侧重国度，也可侧重君王的统治。“上帝的国”保留较宽的语义范围，避免将其仅解释为抽象的统治行动。
- issue: οἱ δώδεκα的群体称谓
  choice: 十二使徒
  alternative: 十二位门徒／十二位
  rationale: 上下文所指是耶稣拣选的十二人；“十二使徒”便于普通读者识别，但原文此处仅称“十二位”，所以不据此强化任何特定的职分神学。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“此后不久”避免生硬照搬希腊语叙事公式；“宣讲……传扬这好消息”保留两个并列分词的区别。正文中的所有脚注标记均已对应列出。
