  rationale: 修订删除“使徒”这一原文未明说的职分补足，并以“十二位”对应οἱ δώδεκα。将“也和他同行”收束为“和他在一起”，避免增加强调或限定陪伴的方式。重组两个并列分词的汉语表达，使“上帝国度的好消息”自然明确，同时仍以“宣讲，并传扬”保留κηρύσσων与εὐαγγελιζόμενος的词汇区分。
