source:
  edition: SBLGNT
  text: καὶ ἕτερον ⸀κατέπεσεν ἐπὶ τὴν πέτραν, καὶ φυὲν ἐξηράνθη διὰ τὸ μὴ ἔχειν ἰκμάδα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/006.yaml
  text: And another fell on the rock[a], and after it sprang up, it withered because it had no moisture.
translation:
  language: zh_hans
  text: 另一粒落在岩石上[a]，长出来以后，就因没有水分而枯干了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为单数“岩石”，保留种子落在岩石表面的具体画面，并非泛指“多石的地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτερον
  choice: 另一粒
  rationale: 这是中性单数形容词作名词用，在上下文中指另一粒种子。汉语补出量词“粒”，使所指自然清楚，同时保留单数。
- source_word: κατέπεσεν
  choice: 落在
  rationale: 简洁表达种子落下并落到某处；汉语中无需另译前缀所带的向下意味。
- source_word: ἐπὶ τὴν πέτραν
  choice: 在岩石上
  rationale: πέτρα为单数“岩石”，这里保留具体的岩石表面意象，不扩大译成“多石的地”。
- source_word: φυὲν
  choice: 长出来以后
  rationale: 该不定过去时被动形分词在这里表示先于主句动作发生的情形；“长出来以后”自然体现种子萌发、生长后才枯干的次序。
- source_word: ἐξηράνθη
  choice: 枯干了
  rationale: 在植物语境中，“枯干”兼顾干燥和凋枯之意，比单说“干了”更自然准确。
- source_word: διὰ τὸ μὴ ἔχειν
  choice: 因没有
  rationale: διά加带冠词的不定式表达原因；“因没有”简明保留因果关系。
- source_word: ἰκμάδα
  choice: 水分
  rationale: ἰκμάς指生长所需的湿润或水分；现代汉语“水分”清楚自然，也避免“汁液”所带的过度具体化。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通俗的叙事语言。“另一粒”承接撒种比喻中的种子序列；“就”清楚呈现结果，而不增添原文没有的解释。
