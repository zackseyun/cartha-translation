  text: προσελθοῦσα ὄπισθεν ἥψατο τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ, καὶ παραχρῆμα ἔστη ἡ ῥύσις τοῦ αἵματος αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/044.yaml
  text: Coming up behind him[a], she touched the fringe of his garment, and immediately her flow of blood stopped.
translation:
  language: zh_hans
  text: 她从后面走近，摸了他衣裳的边[a]，她的血流立刻止住了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“衣边”、“下摆”、“穗子”或“流苏”。
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθοῦσα ὄπισθεν
  choice: 从后面靠近耶稣
  rationale: 不定过去时分词表达先于主要动作发生的伴随行动；补出语境中隐含的对象“耶稣”，使现代汉语自然清楚。“从后面”保留其方位含义。
- source_word: ἥψατο
  choice: 摸了
  rationale: 此处中间语态通常表示“触摸”；“摸了”简明自然，不额外暗示抓住或仅仅轻触。
- source_word: τοῦ κρασπέδου
  choice: 穗边
  rationale: κράσπεδον可指衣服的边、下摆，也可指边缘的穗子。“穗边”保留衣边与穗饰两方面的可能性，同时避免在正文中过度限定。
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: 他衣裳的
  rationale: ἱμάτιον泛指衣服，常为外衣；“衣裳”自然且范围较宽，不武断限定具体款式。
- source_word: παραχρῆμα
  choice: 立刻
  rationale: 准确表达效果随即发生，符合现代汉语叙事习惯。
- source_word: ἔστη
  choice: 止住了
  rationale: ἵστημι在这里指血流停止；“止住了”与主语“血流”搭配自然，并保留动作结果。
- source_word: ἡ ῥύσις τοῦ αἵματος αὐτῆς
  choice: 她的血流
  rationale: 较贴近希腊文“她的血的流出”，又比医学化的“出血症”更少解释；结合上下文清楚指持续流血。
theological_decisions:
- issue: κράσπεδον是否特指犹太服饰上按律法所系的穗子
  choice: 正文译作“穗边”
  alternative: 衣边；下摆；穗子
  rationale: 该词既可泛指衣服边缘，也可能指犹太衣服上的穗子。经文本身没有明确要求将其解释为律法规定的穗子，因此正文保留双重可能，脚注列出主要替代译法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“靠近耶稣”补明希腊文语境中隐含的对象；“穗边”兼顾词义范围，并以脚注保留真实的词汇歧义。
