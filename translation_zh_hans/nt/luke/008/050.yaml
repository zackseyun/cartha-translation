  text: ὁ δὲ Ἰησοῦς ἀκούσας ἀπεκρίθη ⸀αὐτῷ· Μὴ φοβοῦ, μόνον ⸀πίστευσον, καὶ σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/050.yaml
  text: But Jesus[a], hearing this, answered him, “Do not fear; only believe[b], and she will be saved.”
translation:
  language: zh_hans
  text: 耶稣听见了，就对他说：“不要怕，只要信[a]，她就会得救[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“只要信靠”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“她就会得医治”或“她就会康复”。希腊文这个动词可指拯救、救助或医治；在这里的语境中，包括使她脱离死亡、恢复生命与健康。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: 听见了
  rationale: 不定过去时分词表示先于主句发生的动作。原文未明说所听见的内容，因此正文不补出“这话”，以保留原文的简洁与含蓄。
- source_word: ἀπεκρίθη αὐτῷ
  choice: 就对他说
  rationale: 按现代汉语对话叙事的自然表达传达“回答他”；“就”也顺畅地衔接听见与回应两个动作。
- source_word: Μὴ φοβοῦ
  choice: 不要怕
  rationale: 准确传达带 μή 的现在时命令语气，简洁、庄重，也符合现代汉语习惯。
- source_word: μόνον πίστευσον
  choice: 只要信
  rationale: μόνον 限定随后的命令，πίστευσον 是 πιστεύω 的不定过去时命令式。“只要信”自然地表达专一信靠的要求，同时脚注保留“信靠”的关系性意味。
- source_word: σωθήσεται
  choice: 她就会得救
  rationale: 保留 σῴζω 与“拯救/得救”的词汇联系及较宽广的语义，不把本处仅仅收窄为身体医治；“她”依据上下文所指的睚鲁女儿补明。脚注说明本语境也可译为“得医治”或“康复”。
theological_decisions:
- issue: 耶稣命令中 πιστεύω 的译法
  choice: 信
  alternative: 信靠
  rationale: “信”是 πιστεύω 最直接且凝练的汉语对应；为避免被理解为仅仅认知上赞同，脚注保留“信靠”，显出倚赖和托付的意味。
- issue: 在濒死与复生语境中 σωθήσεται 的译法
  choice: 她就会得救
  alternative: 她就会得医治／她就会康复
  rationale: 正文采用“得救”，保留 σῴζω 在路加叙事中身体拯救与更广救恩含义之间的张力；脚注列出本段情境中自然的医治性译法，而不在正文中消除其语义宽度。
translation_notes:
  register: 采用现代、自然而庄重的叙事语言。“不要怕，只要信”简洁有力，适合直接引语；正文保留“得救”的宽广语义，并以脚注交代本语境中的医治与恢复含义。
