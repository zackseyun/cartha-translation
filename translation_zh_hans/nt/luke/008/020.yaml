  text: ⸂ἀπηγγέλη δὲ⸃ ⸀αὐτῷ· Ἡ μήτηρ σου καὶ οἱ ἀδελφοί σου ἑστήκασιν ἔξω ἰδεῖν ⸂σε θέλοντες⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/020.yaml
  text: And it was reported to him[a], “Your mother and your brothers are standing outside, wanting to see you.”
translation:
  language: zh_hans
  text: 有人告诉他：“你的母亲和弟兄们[a]正站在外面，想要见你。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄们”或可译作“亲属”，若此处的希腊词按较广义理解；该词通常意为“兄弟”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπηγγέλη
  choice: 有人告诉
  rationale: 该词是不定过去时被动语态，表示消息被传达给耶稣。汉语通常用“有人告诉”自然表达这种不定施事者的被动含义，避免生硬的“他被告知”。
- source_word: δὲ
  choice: 不单独译出
  rationale: 此处δέ是轻微的叙事连接词。汉语按上下文直接起句更自然，其推进叙事的作用仍由句序体现。
- source_word: αὐτῷ
  choice: 他
  rationale: 作为“告诉”的间接宾语，明确译为“他”。
- source_word: μήτηρ
  choice: 母亲
  rationale: 标准、庄重且自然地对应“母亲”。
- source_word: ἀδελφοί
  choice: 弟兄们
  rationale: 该词为阳性复数，通常指兄弟。选用“弟兄们”保留原文的男性复数和亲属称谓，不扩译为“亲属”或“兄弟姐妹”。
- source_word: ἑστήκασιν
  choice: 站在
  rationale: 完成时在这里表达已经形成并持续的状态；现代汉语“站在外面”自然传达这一现状。
- source_word: ἔξω
  choice: 外面
  rationale: 直接保留空间副词的含义，不添加原文未明说的房屋等地点。
- source_word: ἰδεῖν
  choice: 见
  rationale: 按ὁράω不定式的基本义翻译，不扩展为“会面”或“交谈”。
- source_word: θέλοντες
  choice: 想要
  rationale: 自然表达与“站在外面”同时存在的意愿，并修饰母亲和弟兄们。
theological_decisions:
- issue: ἀδελφοί所指的耶稣家属关系
  choice: 正文译为“弟兄们”，不作解释性扩展
  alternative: 亲属；兄弟姐妹；族人
  rationale: 原文使用通常表示兄弟的阳性复数ἀδελφοί。本节本身没有界定更具体的亲属关系，因此正文保留通常词义，不以翻译解决有关耶稣家庭关系的神学争议；脚注提示语境中可能的广义理解。
translation_notes:
  register: 采用现代、简洁而庄重的叙事语言。“有人告诉他”符合普通话表达习惯，同时忠实传达原文被动结构中的不定施事者；“站在外面，想要见你”保持原文语序和动作关系。脚注标记置于整句之后，所说明的是句中的“弟兄们”。
