  text: παραδοθήσεται γὰρ τοῖς ἔθνεσιν καὶ ἐμπαιχθήσεται καὶ ὑβρισθήσεται καὶ ἐμπτυσθήσεται,
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/032.yaml
  text: For he will be handed over to the Gentiles and will be mocked and insulted and spit on[b][a],
translation:
  language: zh_hans
  text: 因为他将被交给外邦人[a]，并受戏弄、凌辱[b]，又被人向他吐唾沫。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“列国”。这里特指非犹太人，即外邦人。
    reason: lexical_alternative
  - marker: b
    text: 或译“受侮辱”或“受到羞辱性的对待”。
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδοθήσεται
  choice: 将被交给
  rationale: 保留将来时和被动语态，也不把含义过早限定为“被出卖”；这里着重于他被移交到外族人手中。
- source_word: γὰρ
  choice: 因为
  rationale: 表达本句对上文预告的解释关系，符合现代汉语的自然衔接。
- source_word: τοῖς ἔθνεσιν
  choice: 外族人
  rationale: 在此历史语境中指非犹太人，而不是抽象意义上的各个国家；“外族人”自然传达这一身份区别。
- source_word: ἐμπαιχθήσεται
  choice: 受戏弄
  rationale: 准确表达嘲弄、取笑的被动含义，并保持受难叙事所需的庄重语气。
- source_word: ὑβρισθήσεται
  choice: 受凌辱
  rationale: ὑβρίζω可指侮辱或以可耻、蛮横的方式对待；“凌辱”兼顾言语侮辱与羞辱性虐待，不把范围缩窄为口头辱骂。
- source_word: ἐμπτυσθήσεται
  choice: 遭人吐唾沫
  rationale: 具体保留这一羞辱行为；此表达比生硬的“被吐唾沫”更符合现代汉语。
theological_decisions:
- issue: 一连串被动动词的隐含主语
  choice: 补出“他”，承接上一节的“人子”
  alternative: 逐项重复“人子”或省略主语
  rationale: 希腊文此节没有明说主语，但上一节的先行词清楚；现代汉语补出“他”可读性更好，也没有添加新的神学内容。
- issue: τοῖς ἔθνεσιν所指的人群
  choice: 译作“外族人”，指非犹太人
  alternative: 译作“列国”或“万民”
  rationale: 受难预告的具体情境是被移交给非犹太人的掌权者；脚注保留词语较宽的字面可能性。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“受戏弄、凌辱，遭人吐唾沫”保留原文三个并列的将来被动动作，同时避免机械重复“将被”。
