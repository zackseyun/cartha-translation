  text: διά γε τὸ παρέχειν μοι κόπον τὴν χήραν ταύτην ἐκδικήσω αὐτήν ἵνα μὴ εἰς τέλος ἐρχομένη ὑπωπιάζῃ με.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/005.yaml
  text: yet because this widow keeps causing me trouble[a], I will give her justice[b], so that by continually coming she may not wear me out.”
translation:
  language: zh_hans
  text: 可是，就因为这个寡妇不断给我添麻烦，我要为她主持公道[a]，免得她老是来，把我折腾得受不了[b]。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“为她申冤”。这里的希腊语动词在某些语境中也可表示“替她报仇”，但本处指给予司法上的公正处理。
    reason: alternative_reading
  - marker: b
    text: 该希腊词按字面可指“击打眼睛下方”；在这里是强烈的形象说法，意为“把我折腾得受不了”或“把我拖垮”。
    reason: lexical_alternative
lexical_decisions:
- source_word: διά γε τὸ παρέχειν μοι κόπον
  choice: 可是，就因为……不断给我添麻烦
  rationale: διά加冠词不定式表达原因，γε带有强调意味；现在时不定式可体现持续困扰。“不断给我添麻烦”自然传达该习语和延续性。
- source_word: τὴν χήραν ταύτην
  choice: 这个寡妇
  rationale: 保留指示词和“寡妇”这一身份，因为她在比喻中的社会弱势地位十分重要。
- source_word: ἐκδικήσω αὐτήν
  choice: 我要为她伸张正义
  rationale: 在诉讼语境中，动词指给予司法救济、维护其正当权益，而非私人报复。“为她伸张正义”也保留与上下文“正义/申冤”主题的联系。
- source_word: ἵνα μὴ
  choice: 免得
  rationale: 简洁自然地表达法官想避免某种结果的目的。
- source_word: εἰς τέλος ἐρχομένη
  choice: 不停地来，最后
  rationale: εἰς τέλος的句法和语义存在空间：可表达持续到底，也可能与最终结果相连。正文用“不停地来，最后”保留持续性及终局色彩，避免把它过度确定为单一含义。
- source_word: ὑπωπιάζῃ με
  choice: 把我折腾垮了
  rationale: 该词本义涉及击打眼下部位，在这里自然理解为因不断纠缠而使人疲惫不堪；中文以有力度的习语表达其夸张语气。
theological_decisions:
- issue: ἐκδικήσω在有关祷告与公义的比喻中的含义
  choice: 为她伸张正义
  alternative: 替她报仇／为她申冤
  rationale: 场景是法官处理诉求，重点在给予司法公正，而非法官亲自实施报复；同时不把具体裁决内容说得过细。
- issue: ὑπωπιάζῃ是否暗示寡妇会实际施暴
  choice: 按比喻性表达译为“把我折腾垮了”
  alternative: 打我的眼睛／把我打得鼻青脸肿
  rationale: 上下文突出她反复前来造成压力，直译为身体攻击容易制造原文未必意在表达的情节；脚注保留字面形象。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事语言，符合人物内心独白的语气。“添麻烦”“折腾垮了”传达不义法官的不耐烦，同时避免生硬的逐词直译。所有脚注标记均置于相关正文之后。
