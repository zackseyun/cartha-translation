  naturalness: “最后把我折腾垮了”在“免得”引导的目的句中略显不顺，也会造成她先不停来、最后才折腾垮法官的线性理解。“免得她老是来，把我折腾得受不了”更自然、有力，且适合法官不耐烦的内心独白。
  terminology: “为她伸张正义”可理解，但现代汉语中“为她主持公道”更贴合司法裁断和 ἐκδικήσω αὐτήν 的“给予公正/伸冤”含义，不引入私人报复。脚注保留“申冤”及“报仇”的可能范围。
