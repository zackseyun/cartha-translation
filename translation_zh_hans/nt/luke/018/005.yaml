  rationale: 修订将 εἰς τέλος 及现在时 ὑπωπιάζῃ 合并为“老是来，把我折腾得受不了”，保留持续、不胜其扰的含义，避免把有争议的 εἰς τέλος 固定为“最后”。“为她主持公道”明确保留法律救济而非私人复仇的语境。脚注标记仍分别锚定司法救济及“击打眼下”的形象性动词。
