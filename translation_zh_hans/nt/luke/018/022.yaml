  text: ἀκούσας ⸀δὲ ὁ Ἰησοῦς εἶπεν αὐτῷ· Ἔτι ἕν σοι λείπει· πάντα ὅσα ἔχεις πώλησον καὶ διάδος πτωχοῖς, καὶ ἕξεις θησαυρὸν ἐν ⸀οὐρανοῖς, καὶ δεῦρο ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/022.yaml
  text: 'When Jesus heard this, he said to him, “One thing still lacks for you: sell all that you have and distribute it to the poor, and you will have treasure in heaven; and come, follow me.”'
translation:
  language: zh_hans
  text: 耶稣听见了，就对他说：“你还缺少一件事[a]：把你所有的都卖掉，分给穷人，你就会在天上有财宝[b]；来跟从我。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“还有一件事是你所缺少的。”希腊语较直译为：“还有一件事对你是缺少的。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“你会在诸天中有财宝。”希腊语“天”为复数；汉语在这里通常说“天上”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας δὲ ὁ Ἰησοῦς
  choice: 耶稣听见了，就
  rationale: 将不定过去时分词自然处理为先于主句发生的动作，并以“就”承接下文；不把δέ过度译成明显转折。
- source_word: Ἔτι ἕν σοι λείπει
  choice: 你还缺少一件事
  rationale: 现代汉语用以人作主语的表达最自然，同时保留ἔτι的“还”和ἕν的单一性；脚注注明希腊语较直译的句法。
- source_word: πάντα ὅσα ἔχεις
  choice: 你所有的
  rationale: 简洁而完整地表达“凡你所拥有的一切”，在上下文中自然指其财物。
- source_word: πώλησον
  choice: 卖掉
  rationale: “卖掉”体现命令所要求的明确、彻底行动，比单说“卖”更符合现代汉语语感。
- source_word: διάδος πτωχοῖς
  choice: 分给穷人
  rationale: “分给”保留διαδίδωμι所含分发、分配的意味，也不额外限定所分的是钱还是财物。
- source_word: ἕξεις θησαυρὸν ἐν οὐρανοῖς
  choice: 你就会有财宝在天上
  rationale: 保留未来结果和“财宝”的意象；“天上”是汉语中自然的表达，脚注说明原文为复数形式。
- source_word: δεῦρο ἀκολούθει μοι
  choice: 然后来跟从我
  rationale: “来”表达δεῦρο朝向耶稣的呼召，“跟从我”自然承载现在时命令所含的持续门徒行动；“然后”清楚呈现命令次序而未削弱其连贯性。
theological_decisions:
- issue: 舍弃财物与门徒身份的关系
  choice: 按经文保留耶稣对这人的具体命令，并以“来跟从我”作为高潮。
  alternative: 将此句直接解释为所有信徒都必须变卖全部财产的普遍命令，或将变卖财产仅视为没有实际经济要求的象征。
  rationale: 本节明确向这一个人发出实际命令，却没有在本节内说明其普遍适用范围；译文应保留这种张力，不作教义性扩展或淡化。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你还缺少一件事”符合自然汉语，脚注保留原文以“一件事”为语法主语的结构；“分给穷人”避免擅自把分配对象明确限定为售卖所得；整体保留连续命令的直接力度。
