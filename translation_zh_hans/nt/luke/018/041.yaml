id: LUK.18.41
reference: Luke 18:41
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ⸀Τί σοι θέλεις ποιήσω; ὁ δὲ εἶπεν· Κύριε, ἵνα ἀναβλέψω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/041.yaml
  text: “What do you want me to do for you?” And he said[a], “Lord[b], that I may see again.”
translation:
  language: zh_hans
  text: “你要我为你做什么？”他回答：“主啊[a]，求你使我再看见[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“先生啊”。希腊语 κύριε 可以用作尊敬的称呼；本译本通常将 κύριος 译为“主”。
    reason: alternative_reading
  - marker: b
    text: 或译：“求你使我恢复视力。”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί σοι θέλεις ποιήσω
  choice: 你要我为你做什么
  rationale: 按现代汉语习惯表达这一询问；σοι 在这里具有受益意味，译为“为你”，θέλεις 保留“要、想要”的意愿含义。
- source_word: ὁ δὲ εἶπεν
  choice: 他回答
  rationale: δέ 在此主要承接叙事，并无明显转折；因前句是提问，译作“回答”比逐字译作“说”更自然。
- source_word: Κύριε
  choice: 主啊
  rationale: 保留 κύριος 对耶稣称呼中的敬意及其可能具有的基督论含义，不把它限定为一般礼貌称呼。
- source_word: ἵνα ἀναβλέψω
  choice: 让我能再看见
  rationale: ἵνα 引出所求的内容；ἀναβλέπω 在医治失明的语境中通常指恢复看见的能力。“再看见”简明地保留这一含义。
theological_decisions:
- issue: 直接称呼耶稣时 κύριος 的译法
  choice: 主
  alternative: 先生
  rationale: “主”既符合本项目对 κύριος 的通常译法，也保留这一称呼可能兼具礼貌敬称与更深身份认信的张力；脚注说明其较弱的敬称义。
translation_notes:
  register: 采用自然、庄重而口语可懂的现代标准汉语。“你要我为你做什么”保持耶稣问题的直接性；“让我能再看见”符合请求语气，并避免使用较文学化的“重见光明”，以免增加原文没有明说的意象。
