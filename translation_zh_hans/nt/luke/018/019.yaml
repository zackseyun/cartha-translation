  to: 耶稣却对他说：“你为什么称我为良善？没有人是良善的，只有上帝一位。”
  rationale: 修改仅为改善现代汉语的自然性，并更贴近原文“除了一位——上帝”的强调结构。问句及其基督论张力均予保留；译文不将耶稣的话释作否认自身良善，也不将其扩写为直接的神性宣告。
