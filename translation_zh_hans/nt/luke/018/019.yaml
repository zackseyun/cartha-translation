source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτῷ ὁ Ἰησοῦς· Τί με λέγεις ἀγαθόν; οὐδεὶς ἀγαθὸς εἰ μὴ εἷς ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/019.yaml
  text: But Jesus said to him, “Why do you call me good? No one is good except one—God.”
translation:
  language: zh_hans
  text: 耶稣却对他说：“你为什么称我为良善？没有人是良善的，只有上帝一位。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: 却
  rationale: 在叙事回应中标示轻微转折和纠正意味；比单纯的“就”更能体现上下文，同时不过度强化对立。
- source_word: εἶπεν ... αὐτῷ ὁ Ἰησοῦς
  choice: 耶稣却对他说
  rationale: 保留“说”及明确的间接宾语“对他”，不把普通的 λέγω 解释性地译成“回答”。
- source_word: Τί
  choice: 为什么
  rationale: τί 在 τί με λέγεις ἀγαθόν 这一问句中表示缘由，现代汉语自然译为“为什么”。
- source_word: με λέγεις ἀγαθόν
  choice: 称我是良善的
  rationale: 准确传达 λέγεις 加宾语和表语的结构；“称我是”较正式而自然，也保留对称呼本身的追问。
- source_word: ἀγαθόν / ἀγαθὸς
  choice: 良善的
  rationale: 两处一致翻译。“良善”适合此处的道德与神学语境，又不额外限定为某种特定意义。
- source_word: οὐδεὶς
  choice: 没有谁
  rationale: 自然表达涵盖所有人的普遍否定，并与后面的例外结构顺畅衔接。
- source_word: εἰ μὴ εἷς
  choice: 除了独一的……以外
  rationale: 体现例外结构及 εἷς 的强调。将“独一的”与“上帝”连读，符合现代汉语，同时保留唯独一位的含义。
- source_word: ὁ θεός
  choice: 上帝
  rationale: 明确指向上帝；定冠词无需在汉语中另行机械表达，而 εἷς 的独一性已在前面体现。
theological_decisions:
- issue: 耶稣问话的基督论含义
  choice: 按原文保留问句，不将其改写成耶稣否认自己良善，也不改写成耶稣在此直接宣告自己的神性。
  alternative: 可解释性地译成耶稣否认自己具有绝对良善，或译成他借此明确承认自己是上帝。
  rationale: 原文提出“为何称我为良善”的问题，并宣告唯有上帝良善，却未在本节中明说两者之间应如何推论。译文应保留这一神学张力。
translation_notes:
  register: 采用现代、庄重且普通读者易懂的书面汉语。“良善”比日常口语的“好”更能承载此处重复形容词的道德—神学分量；句式仍保持清楚自然。
