  naturalness: “称我是良善的”在现代汉语中略显生硬；“称我为良善”更自然、庄重，并能保留原文的宾语与表语结构。
  terminology: “耶稣”“上帝”“良善”均合适。“良善”能承载此处重复形容词的道德—神学语境，且不强加“道德上”或其他限定。
