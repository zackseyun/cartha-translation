  text: καὶ ὁ Ἰησοῦς εἶπεν αὐτῷ· Ἀνάβλεψον· ἡ πίστις σου σέσωκέν σε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/042.yaml
  text: And Jesus said to him[a], “Receive your sight[b]; your faith has saved you.”
translation:
  language: zh_hans
  text: 耶稣对他说：“看见吧！你的信救了你。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “救了你”也可译作“医好了你”或“使你痊愈了”。希腊语动词在这里既可指医治，也可指拯救。
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: （不单独译出）
  rationale: 此处 καί 连接叙事，在现代汉语中直接承接上文更自然，无须机械译作“于是”或“并且”。
- source_word: εἶπεν αὐτῷ
  choice: 对他说
  rationale: 准确保留间接宾语，并符合现代汉语引出直接引语的自然表达。
- source_word: Ἀνάβλεψον
  choice: 看见吧
  rationale: 在医治失明者的语境中指恢复或获得视力；“看见吧”简洁地表达使其能看见的命令，同时不武断断定他是否曾经有过视力。
- source_word: πίστις
  choice: 信
  rationale: 此处指这人对耶稣的信靠；“信”自然、凝练，也保留该词在经文中的神学分量。
- source_word: σέσωκέν
  choice: 救了
  rationale: σῴζω 的完成时可指拯救，也可指医好。译作“救了”保留本段中身体痊愈与更广义救恩之间的张力。
theological_decisions:
- issue: 医治叙事中 σῴζω 的范围
  choice: 救了
  alternative: 医好了／使你痊愈了
  rationale: 上下文明确涉及视力恢复，但该动词也具有拯救的含义；“救了”不把其意义缩窄为单纯的身体医治，并保留路加叙事中的双重意涵。
- issue: πίστις 所表达的主体回应
  choice: 你的信
  alternative: 你的信靠
  rationale: “信”忠实对应 πίστις，并可涵盖对耶稣的信靠；不额外解释这种信本身具有独立施行医治的能力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看见吧”作为医治性的命令简洁有力；脚注保留 σῴζω 的词义幅度。
