  text: Ἔλεγεν ⸀δὲ παραβολὴν αὐτοῖς πρὸς τὸ δεῖν πάντοτε προσεύχεσθαι ⸀αὐτοὺς καὶ μὴ ἐγκακεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/001.yaml
  text: He was telling them a parable about their need to pray always and not lose heart,[a]
translation:
  language: zh_hans
  text: 耶稣给他们讲了一个比喻，为要说明他们应当常常祷告，不可灰心。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“耶稣给他们讲了一个比喻，谈到他们需要常常祷告，不可灰心。”
    reason: 保留πρὸς τὸ δεῖν可理解为目的或主题／指向的翻译差异。
lexical_decisions:
- source_word: Ἔλεγεν
  choice: 讲了
  rationale: 未完成时在此可作叙事背景或持续动作；现代汉语用“讲了”自然引出比喻，不强行增添过程体标记。
- source_word: δὲ
  choice: 不单独译出
  rationale: δέ是轻微的篇章连接词；本句在现代汉语中无需明示即可自然承接上文。
- source_word: παραβολὴν
  choice: 一个比喻
  rationale: 准确保留对观福音中的文体名称，也符合现代中文圣经语域。
- source_word: αὐτοῖς
  choice: 给他们
  rationale: 明确表达与格所指的听众。
- source_word: πρὸς τὸ δεῖν
  choice: 为要说明……应当
  rationale: 兼顾该结构的目的或指向意义，以及δεῖ所表达的必要性；脚注保留另一种较偏主题说明的理解。
- source_word: πάντοτε
  choice: 常常
  rationale: 在祷告语境中自然表达持续、恒常之意，又避免让人误解为每一刻都必须口头祷告。
- source_word: προσεύχεσθαι
  choice: 祷告
  rationale: 该词在此语境中的标准、自然译法。
- source_word: μὴ ἐγκακεῖν
  choice: 不可灰心
  rationale: 表达不丧失勇气、不因挫折而消沉的含义，并与恒切祷告的语境相称。
theological_decisions:
- issue: 耶稣关于恒切祷告之教导的力度
  choice: “应当常常祷告，不可灰心”保留必要性和劝勉力度
  alternative: “必须时时祷告”或“要继续祷告”
  rationale: δεῖ表达必要性，但本节并未界定祷告蒙应允的机制；译文不引入任何特定宗派的祷告教义。
- issue: πρὸς τὸ δεῖν的功能
  choice: 按目的理解为“为要说明”
  alternative: 按主题或指向理解为“谈到他们需要……”
  rationale: 该结构可表达目的或所指事项；正文采用自然且常见的目的表达，脚注保留主题性译法，以免消除原文的语义空间。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“耶稣”由上下文补明主语，避免中文孤立经节中的“他”指代不清；“常常”表达恒切而不作机械化理解。
