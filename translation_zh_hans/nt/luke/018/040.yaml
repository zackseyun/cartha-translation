  text: σταθεὶς δὲ ⸀ὁ Ἰησοῦς ἐκέλευσεν αὐτὸν ἀχθῆναι πρὸς αὐτόν. ἐγγίσαντος δὲ αὐτοῦ ἐπηρώτησεν αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/040.yaml
  text: So Jesus stood still and ordered that he be brought to him[a]. And when he came near, he asked him[b],
translation:
  language: zh_hans
  text: 耶稣便站住[a]，吩咐人把他带到自己跟前[b]。他走近时，耶稣问他：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“停下来”。原文分词也可简略表达为停止行进；“站住”更具体地保留了停步站定的画面。
    reason: lexical_alternative
  - marker: b
    text: “带到”也可译作“领到”。原文动词的含义较宽，可指带领或带来。
    reason: lexical_alternative
lexical_decisions:
- source_word: σταθεὶς
  choice: 站住
  rationale: 这是ἵστημι的不定过去时被动分词，在此作不及物用，表示耶稣停下脚步；“站住”自然、简洁，也保留了“站立不动”的具体意象。
- source_word: δὲ
  choice: 便
  rationale: δέ在此是较弱的叙事连接词；“便”承接上文情节，表达自然的进展，不强化转折。
- source_word: ἐκέλευσεν
  choice: 吩咐
  rationale: κελεύω表示发出命令或指示；“吩咐”既保留权威意味，也符合现代汉语叙事习惯。
- source_word: ἀχθῆναι
  choice: 把他带到
  rationale: 这是ἄγω的不定过去时被动不定式，可指被带来或被领来；汉语用兼语式“吩咐人把他带到”自然地表达希腊文未明说执行者的被动结构。
- source_word: πρὸς αὐτόν
  choice: 自己跟前
  rationale: πρός加宾格表示朝向耶稣移动；“自己跟前”清楚指向耶稣，并符合本段近距离会面的场景。
- source_word: ἐγγίσαντος δὲ αὐτοῦ
  choice: 他走近时
  rationale: 这是以ἐγγίζω不定过去时分词构成的属格独立结构，表达时间关系；“他”承接刚才提到的盲人，保留原文简洁性。
- source_word: ἐπηρώτησεν
  choice: 问
  rationale: ἐπερωτάω在此表示询问；“问”是最清楚自然的现代汉语表达。
- source_word: ὁ Ἰησοῦς
  choice: 耶稣
  rationale: 采用现代简体中文圣经传统中通行的人名译法。
theological_decisions: []
