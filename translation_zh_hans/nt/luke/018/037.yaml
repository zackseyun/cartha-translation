  yaml_path: translation/nt/luke/018/037.yaml
  text: And they told him[a], “Jesus the Nazarene is passing by.”
translation:
  language: zh_hans
  text: 他们就告诉他：“拿撒勒人耶稣正在经过。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπήγγειλαν
  choice: 告诉
  rationale: 该动词表示把消息告知或报告给人；此处是众人回应盲人的询问，用“告诉”最符合现代汉语叙事语境。
- source_word: δὲ
  choice: 就
  rationale: δέ在这里是推进叙事的轻度连接词，并无明显转折；“就”自然承接上文的询问与此处的回答。
- source_word: αὐτῷ
  choice: 他
  rationale: 作为ἀπήγγειλαν的间接宾语，在汉语中自然表达为“告诉他”。
- source_word: ὅτι
  choice: 冒号及直接引语
  rationale: ὅτι引出所告知的内容。采用直接引语符合上下文，也清楚保留信息内容。
- source_word: Ἰησοῦς
  choice: 耶稣
  rationale: 采用现代中文圣经及基督教语境中通行的人名译法。
- source_word: ὁ Ναζωραῖος
  choice: 拿撒勒人
  rationale: 希腊文使用名词化的地域称谓，指来自或归属于拿撒勒的人。“拿撒勒人”既保留称谓形式，也比扩写为“来自拿撒勒的”更简洁自然。
- source_word: παρέρχεται
  choice: 正从这里经过
  rationale: 现在时在语境中表示正在发生的动作。“正……经过”传达即时进行之意；补入“这里”是汉语中使“经过”用法完整自然的语境性表达，并未增加新的地点信息。
theological_decisions:
- issue: 耶稣的称谓Ναζωραῖος如何表达
  choice: 拿撒勒人
  alternative: 拿撒勒的耶稣
  rationale: 这里主要是地域或身份称谓，不宜加以教义化解释。“拿撒勒人”较直接地保留希腊文名词化称谓的形式，同时是清楚自然的现代汉语。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“就”承接上文叙事，“正从这里经过”突出事件正在发生。无需脚注；正文没有脚注标记。
