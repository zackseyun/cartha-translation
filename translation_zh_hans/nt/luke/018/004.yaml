base_translation:
  language: en
  yaml_path: translation/nt/luke/018/004.yaml
  text: And for a time he was unwilling[a], but afterward he said to himself, ‘Even though I do not fear God nor respect anyone,
translation:
  language: zh_hans
  text: 有一段时间，他不肯；但后来，他心里说：‘我虽然不敬畏上帝，也不尊重任何人，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤθελεν
  choice: 不肯
  rationale: 未完成时配合否定，表示在一段时间内持续不愿受理；“不肯”自然保留其意志和持续拒绝的意味。
- source_word: ἐπὶ χρόνον
  choice: 有一段时间
  rationale: 此短语表示一段未明确长短的时间；该译法自然且不额外限定时长。
- source_word: μετὰ ταῦτα δὲ
  choice: 后来
  rationale: 表达随后发生的转折；上下文已有分号，“后来”足以自然呈现时间推进和轻微转折。
- source_word: εἶπεν ἐν ἑαυτῷ
  choice: 他心里说
  rationale: 保留内在自语的形式，比单译为“想”更贴近原文，同时符合现代汉语表达。
- source_word: Εἰ καὶ
  choice: 虽然
  rationale: 此处引出让步性的自我承认，而非不确定条件；“虽然”准确自然。
- source_word: τὸν θεὸν οὐ φοβοῦμαι
  choice: 我不敬畏上帝
  rationale: φοβέομαι以神为宾语时可兼有畏惧与敬畏之意；“敬畏上帝”保留常见的圣经伦理表达。
- source_word: οὐδὲ ἄνθρωπον ἐντρέπομαι
  choice: 也不把任何人放在眼里
  rationale: ἐντρέπομαι在此指顾忌、尊重或在意；汉语惯用语“把……放在眼里”自然传达对任何人都毫不顾忌的态度。单数ἄνθρωπον在此为泛指，宜译作“任何人”。
theological_decisions:
- issue: 泛指单数ἄνθρωπον的表达
  choice: 任何人
  alternative: 人／世人
  rationale: 原文虽为语法单数，却在否定结构中泛指所有人。现代汉语“任何人”准确表达范围，不把语法单数误解为某个特定的人，也维持“上帝—人”的对照。
- issue: φοβοῦμαι用于上帝时的含义
  choice: 敬畏
  alternative: 惧怕
  rationale: 此处描述法官缺少应有的道德和宗教约束；“敬畏”能涵盖对上帝的畏惧与尊崇，而不把意思缩减为单纯害怕。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事语言。“不肯”表现持续拒绝，“心里说”保留内在独白；句末保留逗号，因为原句的引语在下一节继续。
