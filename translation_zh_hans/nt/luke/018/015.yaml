  text: Προσέφερον δὲ αὐτῷ καὶ τὰ βρέφη ἵνα αὐτῶν ἅπτηται· ἰδόντες δὲ οἱ μαθηταὶ ⸀ἐπετίμων αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/015.yaml
  text: They were even bringing infants to him so that he might touch them[a], but when the disciples saw it[c][b], they rebuked them.
translation:
  language: zh_hans
  text: 有人甚至把婴孩带到他那里，好让他摸他们[a]；门徒看见这事[c]，就责备那些人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“婴儿”。希腊语 βρέφη 指非常幼小的孩子，特指婴儿。
    reason: lexical_alternative
  - marker: b
    text: 即那些把婴孩带到耶稣那里的人。
    reason: lexical_alternative
  - marker: c
    text: 在平行记载中，耶稣的触摸与祝福孩子、为他们按手有关（参太19:13；可10:13、16）。
    reason: cross_reference
lexical_decisions:
- source_word: Προσέφερον
  choice: 有人……带到
  rationale: 未完成时表示当时持续或反复发生的动作；现代汉语不必用生硬的进行体，按叙事语境译为“有人……带到”即可体现这一场景。
- source_word: δὲ
  choice: 分句衔接，不另译为显性的时间词
  rationale: 两处 δὲ 都是较轻的叙事连接词；第一处无需添加“那时”或“如今”，第二处的转折由分号及后续情节自然体现。
- source_word: καὶ τὰ βρέφη
  choice: 甚至把婴孩
  rationale: καὶ 在这里有强调意味；βρέφη 指年龄很小的孩子，通常是婴儿或婴孩。“婴孩”准确且适合庄重的现代中文。
- source_word: ἵνα αὐτῶν ἅπτηται
  choice: 好让他摸他们
  rationale: ἵνα 表目的；ἅπτομαι 的直接含义是“触摸”。正文不把其解释性地扩充为“祝福”或“按手”。
- source_word: ἰδόντες
  choice: 看见这事
  rationale: 过去时态分词在此自然表达先发生或同时相关的情境；“这事”补出汉语所需的宾语，指前述带婴孩来的行为。
- source_word: ἐπετίμων αὐτοῖς
  choice: 责备那些人
  rationale: ἐπιτιμάω 语气较强，译作“责备”；αὐτοῖς 最自然地回指带婴孩来的人，而不是婴孩，正文以“那些人”消除汉语代词可能造成的歧义。
theological_decisions:
- issue: 耶稣对婴孩所作之事的性质
  choice: 摸他们
  alternative: 祝福他们；为他们按手
  rationale: 路加此处使用 ἅπτηται，直接意思是“触摸”。平行记载显示这一触摸与祝福、按手有关，但不应把平行经文的较完整表述直接代入路加正文；相关背景保留在脚注中。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“婴孩”比“宝宝”正式，也比泛称“孩子”更准确；“好让”清楚表达目的。“摸”忠实保留原文较克制的措辞，不在正文中提前解释为祝福。三个脚注标记均置于相关词句之后。
