  to: 我告诉你们，这个人下到自己家里，得称为义，胜过那个人[a]；因为凡抬高自己的，必被降卑；但使自己谦卑的，必被高抬。
  rationale: 修订将“下去回到”简化为自然的“下到自己家里”，并把不足以体现比较关系的“不像那个人”改为“胜过那个人”。脚注明确保留“而不是那个人”的可行译法，维持原文对照短语的解释空间。其余关键术语、被动语态和格言的平行结构均予保留。
