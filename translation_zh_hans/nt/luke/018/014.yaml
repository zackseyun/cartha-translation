id: LUK.18.14
reference: Luke 18:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: λέγω ὑμῖν, κατέβη οὗτος δεδικαιωμένος εἰς τὸν οἶκον αὐτοῦ ⸂παρ’ ἐκεῖνον⸃· ὅτι πᾶς ὁ ὑψῶν ἑαυτὸν ταπεινωθήσεται, ὁ δὲ ταπεινῶν ἑαυτὸν ὑψωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/014.yaml
  text: I tell you[a], this man went down to his house justified rather than the other; because everyone who exalts himself will be humbled, but the one who humbles himself will be exalted.
translation:
  language: zh_hans
  text: 我告诉你们，这个人下到自己家里，得称为义，胜过那个人[a]；因为凡抬高自己的，必被降卑；但使自己谦卑的，必被高抬。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“得称为义，而不是那个人。”原文此处将这个人与另一位敬拜者作比较或对照。
    reason: 保留παρ’ ἐκεῖνον可作比较性或排他性对照的表达余地，避免正文将其定为称义程度的比较。
lexical_decisions:
- source_word: δεδικαιωμένος
  choice: 已经被称为义
  rationale: 该词是 δικαιόω 的完成时被动分词，表达上帝所作的有利判定及其持续结果。“已经被称为义”保留被动和法庭判定色彩，又不把本节扩展成完整的系统神学表述。
- source_word: παρ’ ἐκεῖνον
  choice: 不像那个人
  rationale: παρά 加宾格在此承载比较或对照意味；此译自然地显出税吏与另一位敬拜者的对比，同时以脚注保留“与那个人相比”的可能表达。
- source_word: κατέβη
  choice: 下去回到
  rationale: καταβαίνω 的不定过去时直指“下去”。译文保留从圣殿区域下去的具体空间意象，并用“回到”使现代汉语句子顺畅。
- source_word: εἰς τὸν οἶκον αὐτοῦ
  choice: 回到家里
  rationale: οἶκος 在这里自然指自己的家；“回到家里”符合现代汉语习惯，而不改变其所指。
- source_word: πᾶς ὁ ὑψῶν ἑαυτόν
  choice: 凡抬高自己的
  rationale: 冠词加分词构成普遍性陈述。“凡……的”准确表达这一概括，“抬高自己”保留反身动作和高举自己的意象。
- source_word: ταπεινωθήσεται
  choice: 必被降卑
  rationale: 保留 ταπεινόω 将来时被动语态，不明说施事者，维持原文所含的神学张力。
- source_word: ὁ δὲ ταπεινῶν ἑαυτόν
  choice: 但使自己谦卑的
  rationale: 保留 δέ 的转折及反身含义，并与前半句形成清楚的平行结构。
- source_word: ὑψωθήσεται
  choice: 必被高抬
  rationale: 保留 ὑψόω 的将来时被动语态，并与“抬高自己”及“被降卑”形成原文的反转和平行。
- source_word: ὅτι
  choice: 因为
  rationale: 清楚表达后面的普遍原则是前述判定的解释或根据。
- source_word: οὗτος
  choice: 这个人
  rationale: 明确回指比喻中的税吏，并与另一人形成个人之间的对照。
theological_decisions:
- issue: δικαιόω 在比喻结语中的含义
  choice: 译作“已经被称为义”，表达上帝有利的判定
  alternative: 译作“得到伸冤”或泛指“被证明是对的”
  rationale: 上下文聚焦两人在上帝面前的处境；“被称为义”保留法庭性和神学分量，但不把后来的整套教义体系读入本节。
- issue: παρ’ ἐκεῖνον 所表达的比较或排他关系
  choice: 正文译作“不像那个人”，脚注保留“与那个人相比”
  alternative: 明确译成“而那个人没有被称为义”或“比那个人更算为义”
  rationale: 希腊短语明确构成对照，却可在排他和比较措辞之间理解。正文和脚注共同保留这种真实的表达张力，避免断言称义有程度，也避免把隐含结论说得过满。
- issue: 两个将来时被动式的施事者
  choice: 保留“必被降卑／必被高抬”的被动表达
  alternative: 明说“上帝必使他降卑／高升”
  rationale: 语境很可能暗示上帝是施事者，但原文没有明说；保留被动可维持这一含蓄表达。
- issue: 普遍格言中的阳性单数形式
  choice: 采用汉语无语法性别的单数泛指结构
  alternative: 添加“他”或改用复数“人们”
  rationale: “凡……的”自然表达希腊文的普遍性，又不引入原文在汉语中无须显明的性别标记。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“被称为义”“降卑”“高抬”保留关键神学和修辞对应；“下去回到家里”兼顾具体动作与汉语自然度。脚注标记 [a] 已置于相关对照短语之后。
