  text: Ἰδὼν δὲ αὐτὸν ὁ ⸀Ἰησοῦς εἶπεν· Πῶς δυσκόλως οἱ τὰ χρήματα ἔχοντες ⸂εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσπορεύονται⸃·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/024.yaml
  text: And Jesus[a], seeing him, said, “How difficult it is for those who have wealth to enter into the kingdom of God!”
translation:
  language: zh_hans
  text: 耶稣看见他，就说：“有财富[a]的人进入神的国，是多么难啊！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “财富”也可译作“钱财”。
    reason: χρήματα可指钱、财物或较宽泛意义上的财富；正文采用符合上下文的概括性表达，脚注保留较具体的词义选项。
lexical_decisions:
- source_word: Ἰδὼν
  choice: 看见
  rationale: 这是ὁράω的不定过去时分词；结合主句译作“看见他，就说”，自然表达先见后说的关系，同时不额外强调时间间隔。
- source_word: δὲ
  choice: 就
  rationale: δέ在这里是轻微的叙事连接词。汉语用“就”连接“看见”与“说”，行文自然，不赋予它强烈的转折意义。
- source_word: αὐτὸν
  choice: 他
  rationale: 该宾格代词在上下文中指前述那位富有的官。
- source_word: Πῶς δυσκόλως
  choice: 是多么难啊
  rationale: 这一组合表达感叹性的程度；“是多么难啊”既保留感叹语气，也没有把“困难”强化为“绝不可能”。
- source_word: οἱ τὰ χρήματα ἔχοντες
  choice: 有财富的人
  rationale: 直译为“拥有钱财的人”。“有财富的人”保留了分词结构所表达的描述性含义；χρήματα既可指钱财，也可宽泛指财富。
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: 进入神的国
  rationale: “神的国”是清楚、庄重且通行的现代汉语圣经表达；“进入”自然对应方向介词εἰς与动词的组合。
- source_word: εἰσπορεύονται
  choice: 进入
  rationale: 该动词为现在时形式，在此表达一般性的情形。汉语置于“是多么难”之前，能自然保留其陈述内容。
theological_decisions:
- issue: 富有之人进入神国的难度
  choice: 译为“是多么难啊”，表达一般性的巨大困难
  alternative: 译成富有之人绝不可能进入神的国
  rationale: 原文说的是“多么难”，并未在本节直接说“绝不可能”。译文保留这句话本身的张力，不借后文预先强化或化解其含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“有财富的人”比单纯的“富人”更贴近原文的分词结构；“是多么难啊”保留原句的感叹力度。
