  text: Ἐγένετο δὲ ἐν τῷ ἐγγίζειν αὐτὸν εἰς Ἰεριχὼ τυφλός τις ἐκάθητο παρὰ τὴν ὁδὸν ⸀ἐπαιτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/035.yaml
  text: As he was approaching Jericho[a], a certain blind man was sitting beside the road[b], begging.
translation:
  language: zh_hans
  text: 他快到耶利哥的时候[a]，有一个盲人[b]坐在路旁讨饭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他临近耶利哥时”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文含有“某一个”的轻微意味；也可译作“有某一个盲人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: 不单独译出
  rationale: 这一表达在此主要起叙事衔接作用。现代汉语可直接进入从句，不必生硬地译成“事情发生了”或擅自加入“那时”。
- source_word: ἐν τῷ ἐγγίζειν αὐτὸν εἰς Ἰεριχὼ
  choice: 他快到耶利哥的时候
  rationale: 带ἐν的冠词化不定式表示同时发生的时间，ἐγγίζειν与εἰς共同表达朝耶利哥接近的动态。“快到……的时候”自然体现过程，并保留“接近耶利哥”而非“离开耶利哥”的原文表述。
- source_word: τυφλός τις
  choice: 有一个盲人
  rationale: “有一个”以自然汉语表达τις的不定和轻微个体化意味，不必使用较生硬的“某一个盲人”。
- source_word: ἐκάθητο
  choice: 坐在
  rationale: 未完成时用于铺陈当时持续的场景；汉语在“……的时候”所建立的背景中用“坐在”即可自然表达。
- source_word: παρὰ τὴν ὁδὸν
  choice: 路旁
  rationale: 准确表达παρά加宾格在此所指的沿路、靠路位置，且简洁自然。
- source_word: ἐπαιτῶν
  choice: 讨饭
  rationale: 该分词表示以乞求施舍为活动。“讨饭”是普通现代汉语中直接、易懂的说法，并不把所求之物限定为钱。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“他”照原文保留代词，不在本节擅自补出姓名；“讨饭”通俗但不粗俗，符合具体场景。
