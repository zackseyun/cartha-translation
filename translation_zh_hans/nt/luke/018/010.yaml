id: LUK.18.10
reference: Luke 18:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ἄνθρωποι δύο ἀνέβησαν εἰς τὸ ἱερὸν προσεύξασθαι, ⸀ὁ εἷς Φαρισαῖος καὶ ὁ ἕτερος τελώνης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/010.yaml
  text: Two men went up into the temple to pray[a], one a Pharisee and the other a tax collector.
translation:
  language: zh_hans
  text: 有两个人上圣殿去祷告[a]，一个是法利赛人，另一个是税吏。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文“圣殿”指整个圣殿区域或院区，不是专指内殿。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνθρωποι δύο
  choice: 两个人
  rationale: 上下文分别以阳性单数称呼二人，并明确其身份；现代汉语用“两个人”自然准确，无须生硬强调“两名男子”。
- source_word: ἀνέβησαν
  choice: 上……去
  rationale: 保留ἀναβαίνω“上去”的方向含义，也符合前往耶路撒冷圣殿的语境及现代汉语表达。
- source_word: εἰς τὸ ἱερὸν
  choice: 上圣殿去
  rationale: ἱερόν指整个圣殿区域，而非专指内殿；正文采用通行、自然的“圣殿”，具体范围以脚注说明。汉语“上圣殿去”自然表达前往该处，不必机械译出εἰς的“进入”。
- source_word: προσεύξασθαι
  choice: 祷告
  rationale: 不定式表示此行的目的；“去祷告”直接、自然地传达这一目的。
- source_word: ὁ εἷς ... καὶ ὁ ἕτερος
  choice: 一个……另一个……
  rationale: 保留两者之间的分举对照，符合现代汉语习惯。
- source_word: Φαρισαῖος
  choice: 法利赛人
  rationale: 采用现代中文圣经与宗教历史语境中通行的群体名称。
- source_word: τελώνης
  choice: 税吏
  rationale: 准确指征收税款或关税者；“税吏”简洁、通行，并保留其作为当时税务人员的身份含义。
theological_decisions:
- issue: 区分ἱερόν与ναός
  choice: 正文译“圣殿”，脚注注明指整个圣殿区域
  alternative: 圣殿院区
  rationale: ἱερόν在此并非专指内殿。正文保持自然通行的称呼，同时用脚注避免读者误以为二人进入了内殿。
- issue: ἄνθρωποι的性别表达
  choice: 两个人
  alternative: 两个男人
  rationale: 原文阳性形式及后续人物身份表明二人为男性，但现代汉语“两个人”在此并不否认性别，且比“两个男人”更自然；不额外强化原文并未着重强调的性别。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“上圣殿去祷告”保留原文的方向和目的；“法利赛人”“税吏”使用通行称谓。
