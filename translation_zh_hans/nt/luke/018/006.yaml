review_pass:
  verdict: revise
  source_fidelity: 译文准确传达了主说话、命令听众留意、以及“不义的审判官”的核心意思。“不义的”妥当地保留了ἀδικία既可指道德不义、也可指司法不公的宽度。不过，λέγει为现在时；“说了什么”把审判官的话较明确地表为已完成的过去动作，且“听听……说了什么”在此不如以“所说的话”表达引述内容自然。
  naturalness: “主又说”及“这个不义的审判官”均通顺。“你们听听”属较口语、劝说式表达；在庄重而现代的经文叙事中，“你们要听”更直接保留命令语气。“听听这个不义的审判官所说的话”自然清晰。
  terminology: “主”适当地对应ὁ κύριος，并保留路加叙事中的称号性用法。“审判官”和“不义”均合适。脚注中“属不义的审判官”不符合现代汉语自然表达；可改作“不义之审判官”，并说明这是属格的直译式表达。
  issues:
