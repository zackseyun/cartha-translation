- from: 主又说：“你们听听这个不义的审判官[a]说了什么。”
  to: 主又说：“你们要听这个不义的审判官所说的话。”
  rationale: 将“你们听听……说了什么”改为“你们要听……所说的话”，使命令语气更明确，并避免“说了”将希腊文现在时不必要地完成化。保留“主又说”和“不义的审判官”，因为两者忠实且符合现代普通话经文语体。脚注改用自然的汉语直译表达。
