  text: εἶπεν δὲ ὁ κύριος· Ἀκούσατε τί ὁ κριτὴς τῆς ἀδικίας λέγει·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/006.yaml
  text: And the Lord said[a], “Hear what the unrighteous judge says.”
translation:
  language: zh_hans
  text: 主又说：“你们要听这个不义的审判官所说的话。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν
  choice: 说
  rationale: 不定过去时在叙事中自然译为简单的过去叙事动作；汉语不必另加时态标记。
- source_word: δὲ
  choice: 又
  rationale: 承接上文，表示叙事继续；“又”在现代汉语中自然，也不强行赋予明确的时间先后含义。
- source_word: ὁ κύριος
  choice: 主
  rationale: 这里指耶稣，并带有称号意味；“主”保留原词的分量，不弱化为一般社会称谓。
- source_word: Ἀκούσατε
  choice: 你们听听
  rationale: 不定过去时命令式要求听众留心所说的内容；“听听”自然传达直接而带提醒意味的命令语气。
- source_word: τί
  choice: 什么
  rationale: 引出审判官所说的内容，而非说话的方式。
- source_word: ὁ κριτὴς
  choice: 这个……审判官
  rationale: 定冠词回指比喻中已经提到的审判官；现代汉语用“这个”清楚表达该回指关系。
- source_word: τῆς ἀδικίας
  choice: 不义的
  rationale: 属格短语具有性质描述作用，刻画审判官的不义；“不义”兼顾道德败坏与不公正的含义，并保留原文较宽的伦理意味。
- source_word: λέγει
  choice: 说了
  rationale: 希腊文用现在时使话语内容显得鲜明；中文在“听听……说了什么”的结构中用“说了”更自然，并指向比喻中刚才所说的话。
theological_decisions:
- issue: κύριος用于指耶稣时的译法
  choice: 主
  alternative: 主人
  rationale: 路加叙事在此以称号指耶稣；译作“主”保留其基督论分量，同时不增添经文没有明说的教义解释。
- issue: τῆς ἀδικίας所表达的不义性质
  choice: 不义的审判官
  alternative: 不公正的审判官
  rationale: “不义”既可涵盖司法上的不公，也保留更广的道德评价；脚注列出较偏法律语境的自然译法，以保存词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“主又说”自然承接上文；“你们听听”保留命令语气，又符合当代普通话表达。
