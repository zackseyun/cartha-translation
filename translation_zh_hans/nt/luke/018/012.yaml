  yaml_path: translation/nt/luke/018/012.yaml
  text: I fast twice a week[a]; I tithe everything I acquire.
translation:
  language: zh_hans
  text: 我每周禁食两次[a]；我所得的一切都献上十分之一。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 字面为“安息日的两次”，是“每周两次”的惯用说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: νηστεύω
  choice: 我……禁食
  rationale: 现在时在此表示惯常行为，法利赛人是在陈述自己经常遵行的做法。
- source_word: δὶς τοῦ σαββάτου
  choice: 每周……两次
  rationale: 字面结构为“安息日的两次”，但在通用希腊语中是表示一周周期的惯用语；现代汉语自然表达为“每周两次”。
- source_word: ἀποδεκατῶ
  choice: 献上十分之一
  rationale: 该动词专指缴纳或献出十分之一；此译法比音译式宗教术语更便于普通读者理解，同时保留奉献语境。
- source_word: πάντα ὅσα
  choice: 一切
  rationale: 概括关系结构，涵盖所得的全部事物；汉语用“一切”自然承接后面的限定语。
- source_word: κτῶμαι
  choice: 我所得的
  rationale: 该中间态动词在这里指为自己取得、获得，而非静态地拥有；“所得的”简洁涵盖收入或取得之物。
theological_decisions:
- issue: τοῦ σαββάτου在禁食陈述中的含义
  choice: 按表示周期的惯用义译为“每周”
  alternative: 较直译的“安息日的”
  rationale: 该短语表达禁食频率，并非宣称在安息日禁食。译作“每周”可避免制造关于安息日习俗的错误神学暗示。
- issue: ἀποδεκατῶ的表达
  choice: 献上十分之一
  alternative: 缴纳十分之一；取出十分之一
  rationale: 上下文是宗教性的自我陈述，“献上”符合语境，但不额外说明接受者或具体制度，从而不导入原文未明说的教派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我每周禁食两次”自然体现惯常行为；分号保留两项自我陈述的并列结构。
