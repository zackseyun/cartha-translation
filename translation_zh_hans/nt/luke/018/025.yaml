  text: εὐκοπώτερον γάρ ἐστιν κάμηλον διὰ ⸂τρήματος βελόνης⸃ εἰσελθεῖν ἢ πλούσιον εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/025.yaml
  text: For it is easier for a camel to enter through the eye of a needle than for a rich man to enter the kingdom of God[a][b].
translation:
  language: zh_hans
  text: 因为骆驼穿过针眼，比富有的人进入神的国还容易。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作：“穿过针的孔洞。”
    reason: lexical_alternative
  - marker: b
    text: 有人提出，“针眼”是某座狭窄城门的名称，或“骆驼”应理解为“绳索”；但这里的希腊文本写的是“骆驼”。
    reason: alternative_reading
lexical_decisions:
- source_word: εὐκοπώτερον
  choice: 还容易
  rationale: 比较级在“不如……容易”的对比结构中自然译为“比……还容易”，清楚保留原文比较关系。
- source_word: γάρ
  choice: 因为
  rationale: 保留本句对上文的解释作用；现代汉语中“因为”比单用“原来”更直接。
- source_word: κάμηλον
  choice: 骆驼
  rationale: κάμηλος的通常含义是“骆驼”；原文没有充分依据改译为“绳索”。
- source_word: διὰ τρήματος βελόνης
  choice: 穿过针眼
  rationale: 直译为“穿过针的孔洞”；“穿过针眼”是准确、自然且为普通读者熟悉的汉语表达。
- source_word: εἰσελθεῖν
  choice: 穿过／进入
  rationale: 同一动词在两个语境中分别自然表达为“穿过针眼”和“进入神的国”，兼顾语义一致与汉语习惯。
- source_word: πλούσιον
  choice: 富有的人
  rationale: 阳性单数形容词作名词用，指一个富有者；汉语用“富有的人”自然且不额外限定性别。
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: 进入神的国
  rationale: “神的国”保留关键圣经用语，动词“进入”表达εἰς的方向含义。
theological_decisions:
- issue: 骆驼与针眼意象的解释
  choice: 正文保留“骆驼穿过针眼”这一字面夸张意象。
  alternative: 将“针眼”解释为某座狭窄城门，或将“骆驼”改作“绳索”。
  rationale: 现有希腊文本明确作κάμηλον（骆驼），整句话以有意形成的荒诞、不可能意象强调富有的人进入神国之难；不把后来的解释传统写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“因为”承接上文；保留强烈的夸张对比，不弱化其神学张力。脚注说明字面结构和缺乏文本依据的后世解释。
