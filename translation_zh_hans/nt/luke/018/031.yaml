  text: Παραλαβὼν δὲ τοὺς δώδεκα εἶπεν πρὸς αὐτούς· Ἰδοὺ ἀναβαίνομεν εἰς ⸀Ἰερουσαλήμ, καὶ τελεσθήσεται πάντα τὰ γεγραμμένα διὰ τῶν προφητῶν τῷ υἱῷ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/031.yaml
  text: Then taking the twelve aside[a], he said to them, “Look, we are going up to Jerusalem, and everything written through the prophets about the Son of Man will be fulfilled.”
translation:
  language: zh_hans
  text: 耶稣把十二人带到一旁，对他们说：“看哪，我们要上耶路撒冷去；众先知所写关于人子的一切，都将应验[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文可较直译为“众先知为人子所写的一切，都将成就”；这里通常理解为“众先知所写关于人子的一切”。
    reason: 原文“人子”为与格；其与“所写的一切”和“将成就”的关系可作较字面的“为人子”理解，正文采用较自然且合语境的“关于人子”。
lexical_decisions:
- source_word: Παραλαβὼν
  choice: 把……带到身边
  rationale: 该分词表示耶稣带着或领过十二人，语境中是要单独教导他们；“带到身边”自然表达这一动作，又不把原文未明说的“私下”写入正文。
- source_word: τοὺς δώδεκα
  choice: 十二人
  rationale: 保留原文对耶稣核心门徒群体的简洁称呼，不另加“门徒”。
- source_word: Ἰδοὺ
  choice: 看哪
  rationale: 作为引人注意的话语标记，“看哪”既保留强调作用，也符合庄重而易懂的圣经叙事语体。
- source_word: ἀναβαίνομεν
  choice: 我们正上……去
  rationale: 保留现在时的行程临近感以及ἀνά所含的“上去”之意；前往地势较高的耶路撒冷也自然称为“上”。
- source_word: Ἰερουσαλήμ
  choice: 耶路撒冷
  rationale: 采用现代中文通行的圣经地名译法。
- source_word: τελεσθήσεται
  choice: 都将应验
  rationale: 未来被动式表示所写之事将达到成全；在先知预言的语境中，“应验”最自然，同时保留神所推动的被动意味。
- source_word: πάντα τὰ γεγραμμένα
  choice: 所写……的一切
  rationale: 表达πάντα的总体性，并以中文自然结构呈现完成时被动分词“已经写下的事”。
- source_word: διὰ τῶν προφητῶν
  choice: 众先知所写
  rationale: διά加属格可表示媒介或代理；中文主动表达自然，但不排除神借先知说话的背景含义。
- source_word: τῷ υἱῷ τοῦ ἀνθρώπου
  choice: 关于人子
  rationale: 与“所写”连用时，间接受格很可能表示所写内容涉及人子；正文采用自然中文，并以脚注保留“为人子”或“在人子身上”的结构可能性。
theological_decisions:
- issue: 基督论称号ὁ υἱὸς τοῦ ἀνθρώπου的译法
  choice: 人子
  alternative: 那位属人的／人之子
  rationale: “人子”是清楚且通行的中文圣经称号，既贴近希腊文，也保留其与《但以理书》等经文的互文联系，不把其含义简化为泛指普通人。
- issue: τῷ υἱῷ τοῦ ἀνθρώπου与“所写的一切”的句法关系
  choice: 关于人子的一切
  alternative: 为人子所写的一切／在人子身上所要成就的一切
  rationale: 间接受格在此最可能表示先知所写内容与人子有关；但其形式也容许受益、归向或在其身上实现的意味，因此不在正文中作过度解释，并用脚注保留张力。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事语体。“看哪”保留原文的郑重提示功能；“正上耶路撒冷去”兼顾行程的即时性和地理上的上行。
