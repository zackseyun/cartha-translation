  text: καὶ οἱ προάγοντες ἐπετίμων αὐτῷ ἵνα ⸀σιγήσῃ· αὐτὸς δὲ πολλῷ μᾶλλον ἔκραζεν· Υἱὲ Δαυίδ, ἐλέησόν με.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/039.yaml
  text: And those going ahead were rebuking him so that he would be silent; but he kept crying out all the more, “Son of David, have mercy on me!”
translation:
  language: zh_hans
  text: 走在前面的人责备他，要他安静；他却越发呼喊：“大卫之子，怜悯我吧！”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ προάγοντες
  choice: 走在前面的人
  rationale: 该现在时主动分词作名词用，指人群或队伍中走在前面的人；此译保留空间含义，不把他们解释为带路者或领袖。
- source_word: ἐπετίμων
  choice: 责备
  rationale: ἐπιτιμάω表示严厉斥责或制止；未完成时呈现持续或反复的动作。汉语在连贯叙事中无须另加时态标记。
- source_word: ἵνα σιγήσῃ
  choice: 要他安静
  rationale: ἵνα加虚拟式在此表达责备的目的；此译自然、明确，也保留让他停止出声的含义。
- source_word: αὐτὸς δὲ
  choice: 他却
  rationale: αὐτός带有对比强调，δέ标示转折；“他却”简洁地传达他不顾制止的反应。
- source_word: πολλῷ μᾶλλον
  choice: 越发
  rationale: 这是比较程度的强化表达；“越发”符合现代汉语，并未擅自加入原文没有明说的“更大声”。
- source_word: ἔκραζεν
  choice: 不停地喊
  rationale: 未完成时体现持续或反复呼喊；“不停地喊”突出他的坚持。κράζω在此指高声呼喊。
- source_word: Υἱὲ Δαυίδ
  choice: 大卫之子
  rationale: 呼格形式的王室—弥赛亚称号；直译为“大卫之子”既保留称号性质，也比“大卫的儿子”更适合作正式称呼。
- source_word: ἐλέησόν με
  choice: 可怜我吧
  rationale: 命令式表达急切恳求；“可怜我吧”是普通现代汉语中自然且有力度的呼求，并保留请求怜悯、施助的含义。
theological_decisions:
- issue: Υἱὲ Δαυίδ的弥赛亚意义
  choice: 正文译作称号“大卫之子”
  alternative: 按普通亲属关系译作“大卫的儿子”，或视为一般尊称
  rationale: 在路加叙事中，这一称呼具有大卫王权与弥赛亚期待的内涵。直接翻译称号能保留其基督论意义，又不在正文中加入解释性扩展。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“责备”保留原文制止的严厉程度；“越发不停地喊”同时表达πολλῷ μᾶλλον的增强和ἔκραζεν未完成时的持续性。无脚注。
