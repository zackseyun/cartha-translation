  text: ὁ Φαρισαῖος σταθεὶς ⸂πρὸς ἑαυτὸν ταῦτα⸃ προσηύχετο· Ὁ θεός, εὐχαριστῶ σοι ὅτι οὐκ εἰμὶ ⸀ὥσπερ οἱ λοιποὶ τῶν ἀνθρώπων, ἅρπαγες, ἄδικοι, μοιχοί, ἢ καὶ ὡς οὗτος ὁ τελώνης·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/011.yaml
  text: 'The Pharisee[a], standing by himself, was praying these things: ‘God, I thank you that I am not like the rest of men—extortioners, unrighteous, adulterers—or even like this tax collector.’'
translation:
  language: zh_hans
  text: 法利赛人独自站着[a]，这样祷告说：“上帝啊，我感谢你，因为我不像其余的人——勒索的人、不义的人、通奸的人——，或甚至不像这个税吏。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“法利赛人站着，向自己祷告说这些话。”原文“πρὸς ἑαυτόν”既可指他独自站在一旁，也可指他向自己祷告，带有反讽意味。
    reason: 保留原文短语可能具有的空间义与反身义。
lexical_decisions:
- source_word: σταθεὶς
  choice: 站着
  rationale: 以自然的汉语分词性表达交代祷告时的姿态；不刻意扩写为“站定以后”。
- source_word: πρὸς ἑαυτὸν
  choice: 独自
  rationale: 主文按空间意义理解为他独自或与人分开站着；原文也可能表示“向自己”，故在脚注保留另一种理解。
- source_word: ταῦτα προσηύχετο
  choice: 正这样祷告
  rationale: “这样”指向后面所引的祷告内容，“正……祷告”体现未完成时所呈现的持续动作，同时符合现代汉语叙事习惯。
- source_word: εὐχαριστῶ σοι
  choice: 我感谢你
  rationale: 准确而自然地表达动词与间接受词的关系。
- source_word: ὥσπερ οἱ λοιποὶ τῶν ἀνθρώπων
  choice: 不像其余的人那样
  rationale: 保留λοιποί“其余的”所体现的排他性比较；ἄνθρωποι在此泛指其他人，不限定性别。
- source_word: ἅρπαγες
  choice: 勒索
  rationale: 此处用作恶行类别，指贪婪掠夺、以强势侵占他人；“勒索”比单纯的“抢劫”更适合这一道德罪行清单。
- source_word: ἄδικοι
  choice: 不义
  rationale: 保留ἄδικος兼具道德和宗教意味的广义评价，不缩窄为司法层面的“不公正”。
- source_word: μοιχοί
  choice: 通奸
  rationale: 直接表达违反婚姻忠贞的行为，现代读者易懂。
- source_word: ἢ καὶ ὡς οὗτος ὁ τελώνης
  choice: 也不像这个税吏
  rationale: “也”承接并加强最后一项针对眼前税吏的比较；“税吏”简洁保留当时职分称谓。
theological_decisions:
- issue: πρὸς ἑαυτόν所描述的是站立位置还是祷告指向
  choice: 主文译为空间意义的“独自站着”
  alternative: “站着，向自己这样祷告”
  rationale: 希腊语短语既可表示他与别人分开站立，也可能带有祷告仿佛指向自己的反讽意味。主文采用较符合场景的空间读法，脚注保留反身读法，以免消除原文的歧义和神学张力。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“上帝啊”保留直接呼告语气；罪行清单用并列动词表达，避免重复“是……的人”造成拖沓，同时维持法利赛人自义而轻蔑的口吻。
