base_translation:
  language: en
  yaml_path: translation/nt/luke/018/003.yaml
  text: And there was a widow in that city[a], and she kept coming to him, saying, ‘Give me justice against my adversary.’
translation:
  language: zh_hans
  text: 那城里有一个寡妇，她不断来找他，说：“求你为我主持公道，公正地裁断我与对头的纠纷。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “求你为我主持公道”也可译作“求你为我伸冤”或“求你使我在对头面前得到公正”。“对头”可指诉讼中的对方。原文动词可指伸张权利、使人获得司法公正，不一定指个人报仇。
    reason: lexical_alternative
lexical_decisions:
- source_word: χήρα
  choice: 寡妇
  rationale: 这是现代汉语对丈夫已故女性的标准称呼，也保留了比喻背景中这一身份的社会意义。
- source_word: δὲ
  choice: 那
  rationale: 此处是叙事承接成分；汉语用“那城里”自然衔接上文，无须机械译出“并且”。
- source_word: ἦν ἐν τῇ πόλει ἐκείνῃ
  choice: 那城里有
  rationale: 以现代汉语存在句表达希腊文的存在用法，并准确保留“那城”的指向。
- source_word: ἤρχετο πρὸς αὐτὸν
  choice: 常来对他说
  rationale: 未完成时在语境中表示反复行动；“常来”简洁体现寡妇持续来求的情形。
- source_word: λέγουσα
  choice: 说
  rationale: 分词表示她每次前来时所说的话，合并为“常来对他说”符合自然汉语叙事。
- source_word: Ἐκδίκησόν με
  choice: 求你为我主持公道
  rationale: ἐκδικέω在司法语境中指使人获得公正或伸张权利，而非私人报复；“主持公道”通俗、庄重，也契合法官的角色。
- source_word: ἀπὸ τοῦ ἀντιδίκου μου
  choice: 使我免受对头的欺压
  rationale: ἀντίδικος指法律争讼中的对方或敌对者；ἀπό可表达从其侵害中得到救济。正文以自然汉语呈现，脚注保留“在诉讼中胜过”等司法性译法。
theological_decisions:
- issue: 寡妇请求的性质
  choice: 译作寻求司法救济，而非要求报复
  alternative: 求你替我报仇
  rationale: 法官、对头及诉求共同构成司法场景；此处动词虽可涉及惩治或报偿，但重点是为寡妇伸张权利，不宜让现代读者首先理解为私人复仇。
translation_notes:
  register: 采用现代、通顺而庄重的叙事语言。“主持公道”便于普通读者理解；脚注补充原文的司法含义及可能译法。
