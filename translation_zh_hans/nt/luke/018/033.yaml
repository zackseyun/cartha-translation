  rationale: 修订仅改善现代汉语的自然度及脚注的语法准确性。正文仍按原文保留鞭打、杀害、第三日复活的时序，并以“将复活”对应未来中间形式；脚注以合乎汉语的“被使复活”呈现较间接的替代译法，且不把该理解强加于正文。
