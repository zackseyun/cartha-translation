  text: καὶ μαστιγώσαντες ἀποκτενοῦσιν αὐτόν, καὶ τῇ ἡμέρᾳ τῇ τρίτῃ ἀναστήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/033.yaml
  text: And after flogging him[a], they will kill him, and on the third day he will rise.
translation:
  language: zh_hans
  text: 他们鞭打他之后，要杀死他；第三天，他将复活。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他将被使复活。”希腊语此处更直接地说：“他将复活。”
    reason: 保留可作被动性理解的译法，同时说明原文使用的并非明确被动形式，避免在正文中添加未明示的施事者。
lexical_decisions:
- source_word: μαστιγώσαντες
  choice: 鞭打……以后
  rationale: 不定过去时分词表示先于主要动作发生的行动；“鞭打”是现代汉语中清楚、自然的表达，也保留了原文所指的残酷刑罚。
- source_word: ἀποκτενοῦσιν
  choice: 要杀死
  rationale: 忠实表达将来时主动语态和“杀死”的基本词义，不额外加入“谋杀”的道德判断，也不采用较为书面的“处死”。
- source_word: αὐτόν
  choice: 他
  rationale: 作直接宾语，按上下文指人子耶稣；现代汉语用普通第三人称代词即可。
- source_word: τῇ ἡμέρᾳ τῇ τρίτῃ
  choice: 第三天
  rationale: 自然表达时间与格的意义；汉语无需添加介词，也不补入原文没有明说的“此后”。
- source_word: ἀναστήσεται
  choice: 他要复活
  rationale: 该将来时中间语态形式在这里可作不及物理解；“复活”自然、简洁，并贴近“他要起来”的语态表达，没有把原文改成明确的被动句。
theological_decisions:
- issue: 复活表述的语态
  choice: 他要复活
  alternative: 他要被复活
  rationale: 希腊语使用将来时中间语态，而非明确的被动语态。“他要复活”最直接地保留原文形式；“他要被复活”符合新约其他经文的神学表述，但在本节中会使施事关系比原文更加明确。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“鞭打……以后”清楚表达动作先后；分号区分受难与第三日复活两个相连而形成转折的预告。
