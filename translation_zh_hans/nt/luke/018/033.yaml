review_pass:
  verdict: revise
  source_fidelity: 正文准确表达了先鞭打、后杀害及第三日复活的次序；但脚注中的“他要被复活”在现代汉语中不够自然，也容易把希腊语中间语态误作明确被动。
  naturalness: “鞭打他以后”可理解，但“鞭打他之后”较为顺畅；预告将来事件时“将”比“要”更明确、庄重。脚注的被动式须以“被使复活”才合乎汉语语法。
  terminology: “鞭打”“杀死”“复活”均贴切且符合现代庄重的经文语体。保留“复活”作为正文译法，避免将原文未明说的施事者写入正文。
  issues:
