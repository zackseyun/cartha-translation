    issue: 脚注“他要被复活”不符合自然现代汉语
    rationale: 汉语中“复活”通常是不及物用法；若要表达相应的使动／被动理解，应说“他将被使复活”。同时须说明这不是希腊文最直接的语态表达。
  - severity: low
    issue: 正文将来预告使用“要”略有歧义
    rationale: “要”可表示意愿或即将发生；“将”更清楚对应希腊文将来时，也更适合预言性叙述。
