  text: ὁ δὲ εἶπεν· Τὰ ἀδύνατα παρὰ ἀνθρώποις δυνατὰ ⸂παρὰ τῷ θεῷ ἐστιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/027.yaml
  text: But he said[a], “What is impossible with men is possible with God.”
translation:
  language: zh_hans
  text: 但他说：“对人来说不可能的事，对上帝来说却是可能的。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“人所不能的事，上帝却能。”
    reason: 原文的παρά加与格可表达所涉及的范围；此译法以能力措辞自然呈现同一对照。
lexical_decisions:
- source_word: ἀδύνατα
  choice: 不可能的事
  rationale: 中性复数形容词作名词用，指人力范围内不可能之事；译为“不可能的事”自然且保留其概括性。
- source_word: παρὰ ἀνθρώποις
  choice: 对人来说
  rationale: παρά加与格在此表示所涉及的范围或参照点；“对人来说”准确表达在人这一方或人的能力范围内。
- source_word: δυνατὰ
  choice: 可能的
  rationale: 与ἀδύνατα形成直接对比，同为中性复数形容词的名词性用法；译为“可能的”保留原文对应结构。
- source_word: παρὰ τῷ θεῷ
  choice: 对上帝来说
  rationale: 与παρὰ ἀνθρώποις结构平行，表示以上帝为参照的能力范围；重复“对……来说”可清楚保留原文对照。
- source_word: ὁ δὲ εἶπεν
  choice: 但他说
  rationale: δέ在此承接并略带转折，回应上一节的疑问；“但他说”符合现代汉语叙事表达。
theological_decisions:
- issue: 上帝之可能性的范围
  choice: 保留“对人不可能、对上帝可能”的概括性对照，不进一步界定其哲学范围。
  alternative: 将本句明确解释为只谈救恩，或扩展为关于一切抽象可能性的绝对命题。
  rationale: 上下文涉及得救以及富足之人进入上帝的国，但本句本身采用宽泛表述；译文应保留这种张力，不加入原文未明说的限制或扩张。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“对人来说……对上帝来说……”保留原文平行结构；脚注提供更凝练、偏能力表达的自然译法。
