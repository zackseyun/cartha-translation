  text: ὃς ⸀οὐχὶ μὴ ⸀ἀπολάβῃ πολλαπλασίονα ἐν τῷ καιρῷ τούτῳ καὶ ἐν τῷ αἰῶνι τῷ ἐρχομένῳ ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/030.yaml
  text: who will certainly receive many times more in this time[a], and in the age to come, eternal life.
translation:
  language: zh_hans
  text: 这样的人必定会在今世[a]得到多倍的回报，并在来世得到永生。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在现今这时期”。
    reason: alternative_reading
lexical_decisions:
- source_word: οὐχὶ μὴ
  choice: 必定会
  rationale: οὐχὶ μὴ与不定过去时虚拟语气连用，构成强烈否定，表达事情绝不会不发生；汉语以正面的“必定会”自然传达这一确定保证。
- source_word: ἀπολάβῃ
  choice: 得到
  rationale: 本词可指“收回、得到、获得”。上下文涉及为所舍弃之物所得的回报，但此处不勉强凸显前缀所含的“回来”之意，用“得到”简洁自然。
- source_word: πολλαπλασίονα
  choice: 许多倍
  rationale: 该中性复数比较形式表示成倍而丰厚的回报；“许多倍”既保留数量倍增之意，也符合现代汉语表达。
- source_word: ἐν τῷ καιρῷ τούτῳ
  choice: 在今世
  rationale: καιρός可指特定的时期；这里与“来世”形成两阶段的末世论对照。译作“今世”比“这个时候”更自然地传达该语境，但其字面也可理解为“在现今这时期”，故加注说明。
- source_word: ἐν τῷ αἰῶνι τῷ ἐρχομένῳ
  choice: 在来世
  rationale: 此短语直指“将要来到的世代/时代”，体现新约中今世与来世的对照。“来世”在现代汉语圣经语境中简洁自然，同时不将其弱化为笼统的未来。
- source_word: ζωὴν αἰώνιον
  choice: 永生
  rationale: “永生”是现代汉语中对该固定表达最自然且广为理解的译法，保留其末世性和持续性的含义。
- source_word: ὃς
  choice: 这样的人
  rationale: 关系代词承接上一节所说的人。汉语若孤立呈现本节，以“这样的人”连接上文，比直译“他”或“谁”更自然。
theological_decisions:
- issue: αἰῶνι τῷ ἐρχομένῳ的末世论表达
  choice: 来世
  alternative: 将要来的世代／时代
  rationale: “来世”保留今世与将来世代之间的末世论对照，不把它仅仅处理为一般意义上的未来；同时避免添加有关来世具体形态的解释。
- issue: 今世回报与来世永生的句法关系
  choice: 在今世得到许多倍，并在来世得到永生
  alternative: 在今世并在来世得到许多倍和永生
  rationale: 希腊语将“许多倍”与“今时”相连，再以“永生”对应将来的世代。译文保持这一分配关系，不把永生说成今世所获许多倍之物的一部分。
translation_notes:
  register: 采用现代、庄重而通俗的汉语。“必定会”传达希腊语强烈否定所表达的确定性；“今世／来世”使对照清楚。主文本应在“今世”后标注[a]。
