  text: ὁ δὲ ἀκούσας ταῦτα περίλυπος ⸀ἐγενήθη, ἦν γὰρ πλούσιος σφόδρα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/023.yaml
  text: But when he heard these things[a], he became very sorrowful, for he was extremely rich.
translation:
  language: zh_hans
  text: 他听见这些话，就十分忧愁[a]，因为他极其富有。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“就深感悲痛。”希腊语形容词表示强烈的悲伤或痛苦。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: 听见
  rationale: 不定过去时分词在此具有时间背景作用；结合“就”自然表达听见之后随即产生的反应。
- source_word: ταῦτα
  choice: 这些话
  rationale: 复数指示代词回指耶稣此前所说的内容；译作“这些话”比字面的“这些事”更符合现代汉语语境。
- source_word: περίλυπος
  choice: 十分忧愁
  rationale: 该形容词表示强烈的悲伤或痛苦；“十分忧愁”自然、庄重，并保留其情感强度。
- source_word: ἐγενήθη
  choice: 就……忧愁
  rationale: γίνομαι 表示进入某种状态；汉语以“就”配合形容词自然体现状态的发生，无须生硬译作“变得”。
- source_word: πλούσιος
  choice: 富有
  rationale: 准确表达拥有大量财富，且现代汉语自然。
- source_word: σφόδρα
  choice: 极其
  rationale: 强烈修饰“富有”；“极其”充分保留原文的强调程度。
- source_word: δὲ
  choice: （不单独译出）
  rationale: 此处承接并带轻微转折；现代汉语中上下文及“就”已使反应关系清楚，若加“但是”容易显得生硬或过度强化。
- source_word: γὰρ
  choice: 因为
  rationale: 明确引出他忧愁的原因，符合现代汉语表达。
theological_decisions: []
