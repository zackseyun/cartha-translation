review_pass:
  verdict: revise
  source_fidelity: “自信为义”虽试图紧凑地表达πεποιθότας ἐφ’ ἑαυτοῖς ὅτι εἰσὶν δίκαιοι，但在现代汉语中搭配略显生硬，且“为义”容易被读作‘把义当作目标’或‘成为义’。改为“深信自己是义人”更明确地保留其稳定的自我确信及“义”的宗教—道德语义。将“其余众人”改为“其他人”可自然表达τοὺς λοιπούς，而不无必要地强化为‘其余所有众人’。
  naturalness: 修订句保留庄重的叙事语体，定语结构清楚，符合现代标准汉语。
  terminology: “义人”保留δίκαιοι的关键术语，不以“自义”或“自以为是”等解释性、贬义性的表达取代原文；“轻看”恰当对应ἐξουθενοῦντας。
  issues:
