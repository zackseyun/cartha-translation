  text: Εἶπεν δὲ ⸀καὶ πρός τινας τοὺς πεποιθότας ἐφ’ ἑαυτοῖς ὅτι εἰσὶν δίκαιοι καὶ ἐξουθενοῦντας τοὺς λοιποὺς τὴν παραβολὴν ταύτην·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/009.yaml
  text: And he also told this parable to some who trusted in themselves that they were righteous and treated the rest with contempt:[a]
translation:
  language: zh_hans
  text: 耶稣又向一些深信自己是义人、轻看其他人的人讲了这个比喻：[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “轻看”也可译作“鄙视”或“看不起”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν
  choice: 讲了
  rationale: 本词可表示“说”或“讲”；因宾语是“这个比喻”，现代汉语用“讲了这个比喻”自然准确。
- source_word: δὲ
  choice: （不单独译出）
  rationale: 这里是轻微的叙事连接词；汉语依靠语序承接上下文更自然，无须机械译出。
- source_word: καὶ
  choice: 又
  rationale: 表达附加意义，说明耶稣接着又讲了一个比喻。
- source_word: πρός τινας
  choice: 对一些……的人
  rationale: πρός在言说动词之后指讲话所针对的对象。
- source_word: τοὺς πεποιθότας ἐφ’ ἑαυτοῖς
  choice: 自信
  rationale: 完成时分词表达一种已经形成并持续存在的确信状态；“自信”保留以自己为把握的含义，并与后面的“为义”自然衔接。
- source_word: ὅτι εἰσὶν δίκαιοι
  choice: 为义
  rationale: 保留δίκαιοι的道德及宗教含义，不预先把经文的批判解释加入译文。
- source_word: ἐξουθενοῦντας
  choice: 轻看
  rationale: 表示把人视为无足轻重、鄙视人；“轻看”简洁而庄重，并保留态度与对待方式两方面的含义。
- source_word: τοὺς λοιπούς
  choice: 其余众人
  rationale: 较直接地表达“其余的人”，即除他们自己以外的人，而不将范围弱化为泛指的“别人”。
- source_word: τὴν παραβολὴν ταύτην
  choice: 这个比喻
  rationale: “比喻”是符类福音中παραβολή准确且通行的译法。
theological_decisions:
- issue: 在自义语境中如何翻译δίκαιοι
  choice: 为义
  alternative: 自以为是／是对的
  rationale: 希腊文使用通常表示“义”的δίκαιοι，并未采用本身带贬义的词。“为义”保留核心神学词汇，让上下文显明这种自我确信所受的批判。
translation_notes:
  register: 采用现代、庄重而易懂的叙事用语。“自信为义”较凝练，保留原文以自己为信心依据的结构及“义”的神学张力；“其余众人”凸显τοὺς λοιπούς所指的自己以外所有人。
