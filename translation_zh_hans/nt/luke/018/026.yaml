  text: Εἶπαν δὲ οἱ ἀκούσαντες· Καὶ τίς δύναται σωθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/026.yaml
  text: Then those who heard it said, “And who can be saved?”
translation:
  language: zh_hans
  text: 听见的人说：“这样，谁能得救呢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἶπαν
  choice: 说
  rationale: 不定过去时直陈语气在叙事中表示一次完整的发言，用现代汉语的“说”自然准确。
- source_word: δὲ
  choice: 不单独译出
  rationale: δέ在此主要承接叙事；汉语以紧接上文的句序即可自然体现转折推进，无须机械加入“于是”或“但”。
- source_word: οἱ ἀκούσαντες
  choice: 听见的人
  rationale: 实词化的不定过去时分词指听见耶稣前述话语的人；“听见的人”简洁，并由语境自然补足所听内容。
- source_word: Καὶ
  choice: 这样
  rationale: καί在问句开头承接前述话语，并带出听者由此产生的惊问；“这样”在现代汉语中自然表达这一推论关系，同时不把它处理成单纯并列。
- source_word: τίς
  choice: 谁
  rationale: 直接保留疑问代词所问的对象，不额外限定任何群体。
- source_word: δύναται
  choice: 能
  rationale: 准确表达能力或可能性，符合现代汉语习惯。
- source_word: σωθῆναι
  choice: 得救
  rationale: 被动不定式在此语境涉及进入神的国与救恩；“得救”是自然且语境恰当的表达，并保留被动获救的含义。
theological_decisions:
- issue: σωθῆναι在上下文中的含义
  choice: 得救
  alternative: 获救／被救出来
  rationale: 上下文讨论进入神的国，以及财主得救之难，因此主要是救恩意义，而非仅指脱离某种现实危险。
- issue: Καὶ在惊问中的衔接作用
  choice: 这样
  alternative: 那么／而／不单独译出
  rationale: 此处的问话是听众对耶稣前言的反应。“这样”清楚呈现上下文联系，但不额外解释究竟哪些人可以得救。
translation_notes:
  register: 采用现代、简洁而庄重的叙事语言。“这样，谁能得救呢？”符合普通读者的口语理解，也保留原文惊讶而追问的语气。
