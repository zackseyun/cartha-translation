  text: ⸂ὁ δὲ⸃ τελώνης μακρόθεν ἑστὼς οὐκ ἤθελεν οὐδὲ τοὺς ὀφθαλμοὺς ⸂ἐπᾶραι εἰς τὸν οὐρανόν⸃, ἀλλ’ ⸀ἔτυπτε τὸ στῆθος ⸀αὐτοῦ λέγων· Ὁ θεός, ἱλάσθητί μοι τῷ ἁμαρτωλῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/013.yaml
  text: But the tax collector[a], standing far off, was not willing even to lift up his eyes to heaven, but kept beating his chest, saying, ‘God, be merciful to me, the sinner.’
translation:
  language: zh_hans
  text: 那税吏远远地站着，连举目望天也不愿意，只是不住地捶着胸，说：“上帝啊，求你开恩怜悯我这个罪人！[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “开恩怜悯”也可译作“向我施恩”；原文动词与赎罪及平息忿怒的词语领域有关。
    reason: 保留ἱλάσθητί在一般怜悯含义之外所带有的赎罪和挽回色彩，并避免‘向我息怒施恩’在现代汉语中的歧义。
lexical_decisions:
- source_word: τελώνης
  choice: 税吏
  rationale: “税吏”是现代中文圣经语境中清楚而简洁的称呼，也保留了当时这一职业所带有的社会与道德污名。
- source_word: μακρόθεν ἑστὼς
  choice: 远远地站着
  rationale: 直接表达其空间距离与站立姿态，并自然暗示上下文中的谦卑和羞愧。
- source_word: οὐκ ἤθελεν οὐδὲ
  choice: 连……也不愿意
  rationale: 保留θέλω所表达的意愿，而不误译成不能；“连……也”体现οὐδέ的递进强调。
- source_word: ἐπᾶραι εἰς τὸν οὐρανόν
  choice: 举目望天
  rationale: 这是自然、庄重的现代中文表达，准确传达把眼睛抬向天空的动作。
- source_word: ἔτυπτε τὸ στῆθος αὐτοῦ
  choice: 不住地捶着胸
  rationale: 以“不住地”体现未完成时所表达的持续或反复动作；“捶着胸”自然传达悲痛悔恨的举动。
- source_word: ἱλάσθητί μοι
  choice: 求你开恩怜悯我
  rationale: “开恩怜悯”在祷告中自然易懂，传达向上帝求怜悯、求息怒施恩的含义；其与赎罪、挽回相关的词义联系留在脚注说明。
- source_word: τῷ ἁμαρτωλῷ
  choice: 我这个罪人
  rationale: “这个罪人”比单说“一个罪人”更能保留希腊文冠词所可能具有的强调和自我贬抑语气，同时符合自然中文。
theological_decisions:
- issue: 如何翻译祷告中的ἱλάσθητί μοι
  choice: 求你开恩怜悯我
  alternative: 求你向我息怒施恩；求你为我赎罪
  rationale: 该动词既可在此语境中表达求上帝施怜悯，也与赎罪、挽回或息怒施恩的词汇领域有关。正文采用自然、可懂的祷告用语，不把完整的赎罪理论强加进句中；脚注保留其较深的祭祀和赎罪色彩。
- issue: τῷ ἁμαρτωλῷ中冠词的力度
  choice: 我这个罪人
  alternative: 我，一个罪人
  rationale: 希腊文可理解为带强调的“这个罪人”，表现税吏专注于自身罪责的自我贬抑；中文采用“我这个罪人”保留这种力度，但不主张他在客观意义上自称唯一的罪人。
translation_notes:
  register: 采用现代、庄重且适合公开诵读的普通话。“税吏”“举目望天”“开恩怜悯”兼顾传统圣经语感与当代可懂度；用“不住地”明确未完成时的持续或反复动作。脚注标记[a]已置于相关祷告之后。
