  text: λέγω ὑμῖν ὅτι ποιήσει τὴν ἐκδίκησιν αὐτῶν ἐν τάχει. πλὴν ὁ υἱὸς τοῦ ἀνθρώπου ἐλθὼν ἆρα εὑρήσει τὴν πίστιν ἐπὶ τῆς γῆς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/008.yaml
  text: I tell you that he will bring about justice for them quickly[a]. Nevertheless, when the Son of Man comes[b], will he really find faith on the earth?
translation:
  language: zh_hans
  text: 我告诉你们，他很快就会为他们伸张正义[a]。然而，人子来的时候，真的能在地上找到信心[b]吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“为他们申冤”或“使他们获得公正”。希腊语词组可指在司法上维护某人的权益、为其伸张正义，也可带有报应或惩治的意味。
    reason: lexical_alternative
  - marker: b
    text: 希腊语可直译为“这信心”或“信心”；也可理解为“信靠”或“忠信”。定冠词可能回指前文所表现的恒切信靠，也可能具有更宽泛的含义。
    reason: alternative_reading
lexical_decisions:
- source_word: ποιήσει τὴν ἐκδίκησιν αὐτῶν
  choice: 为他们伸张正义
  rationale: ἐκδίκησις在寡妇求司法救济的语境中指使人获得公正、为人申冤或维护其权利。“为他们伸张正义”保留司法和 vindication 的含义，同时避免过分突出报复色彩。
- source_word: ἐν τάχει
  choice: 很快
  rationale: 该短语可表示迅速、毫不迟延；“很快”自然地保留速度或时间上的张力，但不把它严格限定为一份末世时间表。
- source_word: πλὴν
  choice: 然而
  rationale: πλήν引出强烈的转折或让步；“然而”清楚连接上文神施行公义与下文发人深省的问题。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人子
  rationale: 采用现代中文圣经语境中通行的称号，保留其作为耶稣自称以及与《但以理书》7章的互文关联。
- source_word: ἐλθὼν
  choice: 来的时候
  rationale: 将不定过去时分词自然处理为时间关系，明确它与主要动词“找到”的关系，而不增加完成时含义。
- source_word: ἆρα
  choice: 真的
  rationale: ἆρα使问句带有推想和审视意味；“真的”在现代汉语中自然传达这一反问力度。
- source_word: τὴν πίστιν
  choice: 这样的信心
  rationale: 基本词义保留为“信心”；补入“这样的”承接上下文中坚持祷告、信靠神的表现，并可表达希腊语定冠词的回指功能，但不把πίστις窄化为某一特定教义定义。
- source_word: ἐπὶ τῆς γῆς
  choice: 在地上
  rationale: 这是自然、庄重的现代汉语表达，也保留此处可能具有的普世和末世范围。
theological_decisions:
- issue: πίστις在此处可理解为信心、信靠或忠信
  choice: 信心
  alternative: 信靠；忠信
  rationale: “信心”最能保留πίστις的宽泛语义，并符合上下文中恒切祷告的主题；其他可能含义置于脚注，不将经文教义性地限定为主观信靠或持续忠诚中的任何一项。
- issue: 定冠词τὴν是否回指比喻所描写的坚持信靠
  choice: 这样的信心
  alternative: 信心
  rationale: “这样的”使中文读者看出问题与前文恒切祷告和等候公义的信靠有关；脚注同时说明也可直接译作“信心”，以保留原文简洁性及其可能较宽的指向。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“伸张正义”保持司法语境并弱化不必要的报复联想；末句保留原文的反问张力。“这样的”用于自然呈现定冠词可能具有的上下文回指，同时以脚注保留较直译和较宽泛的读法。
