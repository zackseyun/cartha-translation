  text: Καὶ ἐπηρώτησέν τις αὐτὸν ἄρχων λέγων· Διδάσκαλε ἀγαθέ, τί ποιήσας ζωὴν αἰώνιον κληρονομήσω;
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/018.yaml
  text: And a ruler asked him[a], saying, “Good Teacher, what must I do to inherit eternal life?”
translation:
  language: zh_hans
  text: 有一位官长问他：“良善的老师，我该做什么，才能承受永生？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“我做什么，才会承受永生？”
    reason: 说明τί ποιήσας与将来时动词κληρονομήσω的句法关系；保留原文所问的行动及其与未来“承受永生”之间的关系，正文采用更自然的汉语表达。
lexical_decisions:
- source_word: ἐπηρώτησέν
  choice: 问
  rationale: ἐπερωτάω在这里表示提出问题；“问”自然简洁，符合叙事语体。
- source_word: τις ἄρχων
  choice: 有一位官长
  rationale: τις表明此人身份未具体说明，ἄρχων指有权位的人；“有一位官长”既保留其社会地位，也不武断限定具体官职。
- source_word: Διδάσκαλε ἀγαθέ
  choice: 良善的老师
  rationale: “老师”准确表达διδάσκαλος的教导者含义；“良善的”保留ἀγαθός，因为下一节耶稣将直接回应这一称呼。
- source_word: τί ποιήσας
  choice: 我该做什么
  rationale: 不定疑问词加先行性的简单过去分词在此询问获得永生所需的行动；“我该做什么”是自然的现代汉语，同时保留提问者以行动为出发点的问法。
- source_word: ζωὴν αἰώνιον
  choice: 永生
  rationale: “永生”是现代汉语中准确且通行的对应，既包含无尽生命的含义，也保留其末世性内涵而不作过度解释。
- source_word: κληρονομήσω
  choice: 承受
  rationale: κληρονομέω带有继承产业的意象；“承受”是圣经语境中自然、简洁的表达，优于仅译作“得到”，因为后者会丢失继承含义。
theological_decisions:
- issue: 人的行动与承受永生之间的关系
  choice: 我该做什么，才能承受永生
  alternative: 我做了什么，就会承受永生
  rationale: 译文忠实呈现官长以自己应做之事来发问的方式，却不把这种问法当作经文对救恩机制的最终判定；保留上下文将要展开的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“官长”保留人物有权位但官职不明的特点；引语自然流畅，同时避免把原文的神学张力解释进正文。
