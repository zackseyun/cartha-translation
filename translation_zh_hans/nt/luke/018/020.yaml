  text: τὰς ἐντολὰς οἶδας· Μὴ μοιχεύσῃς, Μὴ φονεύσῃς, Μὴ κλέψῃς, Μὴ ψευδομαρτυρήσῃς, Τίμα τὸν πατέρα σου καὶ τὴν ⸀μητέρα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/020.yaml
  text: 'You know the commandments: Do not commit adultery[a], do not murder, do not steal, do not bear false witness, honor your father and mother.'
translation:
  language: zh_hans
  text: 你知道这些诫命：不可奸淫，不可谋杀，不可偷盗，不可作假见证；要孝敬你的父母。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰς ἐντολὰς
  choice: 诫命
  rationale: 这里指人所熟知的十诫条文；“诫命”既保留其权威性和经文互文意味，也符合现代汉语宗教语境。
- source_word: οἶδας
  choice: 你是知道的
  rationale: οἶδα虽在形式上是完成时，通行希腊语中表达现在的认知状态。“你是知道的”自然，并略带强调，适合耶稣提醒对方熟知这些诫命的语气。
- source_word: Μὴ μοιχεύσῃς
  choice: 不可奸淫
  rationale: μοιχεύω指犯奸淫。“不可奸淫”准确、简洁，并保留十诫引文庄重而明确的禁令语气。
- source_word: Μὴ φονεύσῃς
  choice: 不可谋杀
  rationale: φονεύω所指是非法夺取人命，即谋杀，不涵盖一切造成死亡的行为；“谋杀”比宽泛的“杀人”更准确。
- source_word: Μὴ κλέψῃς
  choice: 不可偷盗
  rationale: κλέπτω直接表示偷窃、盗取；“偷盗”是清楚而庄重的现代汉语表达。
- source_word: Μὴ ψευδομαρτυρήσῃς
  choice: 不可作假见证
  rationale: ψευδομαρτυρέω指作虚假见证。“作假见证”保留法律语境以及与十诫的互文联系。
- source_word: Τίμα
  choice: 要孝敬
  rationale: τιμάω在此指尊荣父母并以相称的态度和行动对待他们。“孝敬”是现代汉语中表达这一亲子伦理义的自然用语；“要”清楚传达命令语气。
- source_word: τὸν πατέρα σου καὶ τὴν μητέρα
  choice: 你的父母
  rationale: 原文明确并列父亲和母亲；现代汉语合称“父母”简洁自然，“你的”保留第二人称所属关系。
theological_decisions:
- issue: 十诫式禁令的汉语表达
  choice: 采用“不可……”
  alternative: 采用“不要……”
  rationale: 原文以否定词加不定过去时虚拟语气表达禁令。“不可”在现代汉语中仍清楚易懂，并能保留十诫引文的庄重、规范语气；这属于文体选择，不额外引入神学解释。
- issue: φονεύω的范围
  choice: 译作“谋杀”
  alternative: 译作“杀人”
  rationale: φονεύω通常特指不法杀人。译作“谋杀”避免把禁令扩大为涵盖所有导致死亡的行为，同时不对具体伦理情形作进一步教义判断。
translation_notes:
  register: 采用自然、庄重且普通现代读者易懂的书面语。前四条以“不可”形成整齐的十诫式节奏，末条以“要孝敬”呈现肯定命令；分号区分禁令组与肯定命令。
