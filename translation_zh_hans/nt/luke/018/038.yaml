  yaml_path: translation/nt/luke/018/038.yaml
  text: And he cried out[a], saying, “Jesus, Son of David, have mercy on me!”
translation:
  language: zh_hans
  text: 他高声喊道：“耶稣，大卫之子[a]，怜悯我吧！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大卫之子”是带有弥赛亚含义的称号，使人联想到上帝所应许的大卫后裔君王；也可较一般地理解为“大卫的后裔”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβόησεν
  choice: 高声喊道
  rationale: βοάω表示大声呼喊；“高声喊道”自然传达音量和急切感，并顺畅引出直接引语。
- source_word: λέγων
  choice: 由“喊道”一并表达
  rationale: 希腊语分词λέγων用于引出所说内容；现代汉语以“喊道”合并表达更自然，语义没有缺失。
- source_word: Ἰησοῦ
  choice: 耶稣
  rationale: 这是Ἰησοῦς的呼格形式，采用现代中文圣经人名的通行译法。
- source_word: υἱὲ Δαυίδ
  choice: 大卫之子
  rationale: 保留原文“子”的表达及其王室—弥赛亚称号色彩；“之子”比“大卫的儿子”更适合作为庄重称号，同时不排除“后裔”的字面范围。
- source_word: ἐλέησόν με
  choice: 可怜我吧
  rationale: ἐλεέω的命令式是恳求对方施怜悯；“可怜我吧”是自然、直接而急切的现代汉语呼求。
theological_decisions:
- issue: υἱὲ Δαυίδ的弥赛亚含义
  choice: 译作“大卫之子”，保留称号形式。
  alternative: 译作“大卫的后裔”，突出谱系含义。
  rationale: 在路加叙事中，这一称呼带有应许中的大卫王裔和弥赛亚意涵；直译为“大卫之子”能保留这种神学张力，而不把称号化约为单纯的家谱说明。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语体。“他就高声喊道”符合汉语直接引语习惯；呼语以逗号分隔，保留原文恳求的急切感。
