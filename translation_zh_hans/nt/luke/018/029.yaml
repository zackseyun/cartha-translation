  text: ὁ δὲ εἶπεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν ὅτι οὐδείς ἐστιν ὃς ἀφῆκεν οἰκίαν ἢ ⸂γυναῖκα ἢ ἀδελφοὺς ἢ γονεῖς⸃ ἢ τέκνα ἕνεκεν τῆς βασιλείας τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/029.yaml
  text: And he said to them, “Truly I say to you, there is no one who has left a house or wife or brothers or parents or children for the sake of the kingdom of God,”
translation:
  language: zh_hans
  text: 耶稣对他们说：“我实在告诉你们：没有人为上帝的国撇下房屋、妻子、弟兄、父母或儿女，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: 我实在告诉你们
  rationale: 保留耶稣郑重宣告的固定语气，同时符合现代汉语圣经表达习惯。
- source_word: ἀφῆκεν
  choice: 撇下
  rationale: 表达为某一缘故离开或舍下亲属与产业；比单纯“离开”更能体现代价，但不额外暗示永久弃绝。
- source_word: οἰκίαν
  choice: 房屋
  rationale: 此处与妻子及亲属并列，主要指住所或家产；译作“房屋”可避免与家庭成员概念重叠。
- source_word: ἕνεκεν τῆς βασιλείας τοῦ θεοῦ
  choice: 为上帝的国
  rationale: 简洁呈现缘由或目的关系，并按现代标准普通话表达 θεός 与 βασιλεία。
theological_decisions:
- issue: 为上帝的国而“撇下”家人与房屋的含义
  choice: 按原文直译为“撇下”，不补充具体情境或伦理限定
  alternative: 译成“舍弃”或补作“暂时离开”
  rationale: 原文未明确说明离开的期限、方式或具体伦理处境，应保留其张力，并由下节说明所得的回报。
- issue: 说话者身份
  choice: 明示为“耶稣”
  alternative: 保留代词“他”
  rationale: 希腊文用代词承接上文；中文单节呈现时明示说话者可避免指代含混，不改变命题内容。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准普通话。保留本节末尾未完结的句法，以逗号衔接下一节。
