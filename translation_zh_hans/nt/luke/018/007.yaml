  text: ὁ δὲ θεὸς οὐ μὴ ποιήσῃ τὴν ἐκδίκησιν τῶν ἐκλεκτῶν αὐτοῦ τῶν βοώντων ⸀αὐτῷ ἡμέρας καὶ νυκτός, καὶ ⸀μακροθυμεῖ ἐπ’ αὐτοῖς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/007.yaml
  text: And will not God bring justice for his chosen ones[a], who cry out to him day and night? Will he delay long over them?
translation:
  language: zh_hans
  text: 神岂不为那些昼夜呼求他的、他所拣选的人主持公道吗？他会一直耽延、不为他们主持公道吗？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“尽管他对他们长期忍耐”，或“他还会对他们长期忍耐吗？”希腊语短语也可理解为忍耐、长期容忍，而不一定指耽延行动。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκδίκησιν
  choice: 伸张正义
  rationale: 本段以不义的法官和寡妇求公断为背景，此词指给予司法上的救济、申冤或昭雪，而非私人报复；“伸张正义”自然地保留了司法意味。
- source_word: ἐκλεκτῶν
  choice: 选民
  rationale: 该形容词在此作名词使用，指神所拣选的人。“选民”是现代中文圣经语境中简洁而通行的表达，同时不限定其教派性解释。
- source_word: βοώντων
  choice: 呼求
  rationale: 此分词表达迫切而持续的呼喊；结合向神祈求的语境，“呼求”兼顾强烈程度和祷告意味。
- source_word: ἡμέρας καὶ νυκτός
  choice: 昼夜
  rationale: 保留原文的时间性表达，传达不断、持续地呼求；中文简洁自然。
- source_word: μακροθυμεῖ ἐπ’ αὐτοῖς
  choice: 迟迟不为他们采取行动
  rationale: μακροθυμέω通常可指忍耐或恒久忍受，但在本段以及第8节“很快”施行公义的衔接中，也可理解为延迟为他们行动。正文用问句表达延迟之意，并以脚注保留“忍耐”的词义可能。
- source_word: οὐ μὴ ποιήσῃ
  choice: 岂不……吗
  rationale: οὐ μή与不定过去时虚拟语气构成强烈否定，置于期待肯定回答的反问中；“岂不……吗”自然传达其强烈的修辞力量。
- source_word: θεὸς
  choice: 神
  rationale: 现代中文基督教语境中的标准译法；冠词在此标明主语，无须另作扩展。
theological_decisions:
- issue: μακροθυμεῖ ἐπ’ αὐτοῖς与神的品格及行动之间的关系
  choice: 正文译作关于神是否延迟行动的反问：“他会迟迟不为他们采取行动吗？”
  alternative: 也可理解为“尽管他长久忍耐他们”或“他还对他们恒久忍耐吗？”
  rationale: 希腊文既可侧重“忍耐、恒久容忍”，也可能在上下文中涉及延迟行动。第8节强调神很快施行公义，因此正文采用延迟行动的理解以保持论证脉络，同时用脚注保留原文关于忍耐的真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“伸张正义”保留法庭语境；“昼夜向他呼求”自然传达持续而迫切的祈求。正文分成两个反问句，以呈现希腊文的修辞推进；脚注标记[a]置于相关歧义句之后。
