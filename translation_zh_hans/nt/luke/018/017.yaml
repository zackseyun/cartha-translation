  text: ἀμὴν λέγω ὑμῖν, ὃς ⸀ἂν μὴ δέξηται τὴν βασιλείαν τοῦ θεοῦ ὡς παιδίον, οὐ μὴ εἰσέλθῃ εἰς αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/017.yaml
  text: Truly I tell you[a], whoever does not receive the kingdom of God like a child will certainly not enter it.
translation:
  language: zh_hans
  text: 我实在告诉你们：凡领受上帝的国时不像小孩子[a]的，绝不能进入其中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “像小孩子”也可理解为“作为小孩子”或“以小孩子的身份”。这里可能强调小孩子般的接受、信靠、谦卑或依赖；希腊原文没有明确指出具体是哪一种特质。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: 实在
  rationale: 用于耶稣郑重宣告的句首公式，自然传达肯定和庄严语气，且比音译“阿们”更便于现代普通读者理解。
- source_word: λέγω ὑμῖν
  choice: 我告诉你们
  rationale: 准确保留第一人称对众人的直接讲话，也是现代汉语中自然、庄重的表达。
- source_word: ὃς ἂν
  choice: 凡……的
  rationale: 表达不定关系结构所具有的普遍条件意义，符合现代汉语习惯。
- source_word: μὴ δέξηται
  choice: 不……领受
  rationale: δέχομαι在这里兼有接受、接纳之意；“领受”适合以“上帝的国”为宾语，也保留主动接纳与接受赐予的语义空间。
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: 上帝的国
  rationale: 采用清楚而通行的圣经表达，既可指上帝的统治，也可指其国度，不把动态统治这一层面排除在外。
- source_word: ὡς παιδίον
  choice: 像小孩子那样
  rationale: 保留ὡς所表达的比较或方式；παιδίον通常指孩童，“小孩子”在汉语中自然，但正文不指定所比较的是谦卑、信靠、依赖还是接受性。
- source_word: οὐ μὴ εἰσέλθῃ
  choice: 绝不能进去
  rationale: οὐ μή加虚拟式构成强烈否定；“绝不能”体现强调语气，“进去”则自然承接前文的“国”。
- source_word: εἰς αὐτήν
  choice: 进去
  rationale: αὐτήν回指“上帝的国”；汉语无需重复宾语即可明确所指，避免生硬的“进入它”。
theological_decisions:
- issue: “像小孩子那样领受上帝的国”的具体含义
  choice: 正文保留比喻，不限定小孩子所代表的具体品质。
  alternative: 明确译作“以小孩子般的谦卑／信靠／依赖来领受”，或理解为“以小孩子的身份领受”。
  rationale: 希腊文只陈述比较，并未明说比较点；保留开放性可避免把某一种神学解释写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“我实在告诉你们”保留耶稣宣告公式的郑重感；“领受”延续圣经语域但仍为现代读者所理解。脚注用于保存ὡς παιδίον在方式比较与身份理解之间的歧义。
