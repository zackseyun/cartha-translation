  text: Εἶπεν δὲ ⸀ὁ Πέτρος· Ἰδοὺ ἡμεῖς ⸂ἀφέντες τὰ ἴδια⸃ ἠκολουθήσαμέν σοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/028.yaml
  text: Then Peter said[a], “Look, we have left our own and followed you.”
translation:
  language: zh_hans
  text: 彼得说：“看哪，我们已经撇下自己所有的，跟从了你。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἶπεν δὲ ὁ Πέτρος
  choice: 彼得说
  rationale: δέ在这里承接上文并带轻微转折；现代汉语叙事中无需机械译出“于是”或“但”，以免增加原文未强调的时间或对立关系。
- source_word: Ἰδοὺ
  choice: 看哪
  rationale: 保留引人注意、强调下文的语用功能；“看哪”庄重而仍为现代读者熟悉。
- source_word: ἡμεῖς
  choice: 我们
  rationale: 明译原文显式代词；在“看哪”之后自然带有强调意味，无需增译“我们这些人”或“我们自己”。
- source_word: ἀφέντες
  choice: 已经撇下
  rationale: 分词表示先于“跟从”的行动；“撇下”自然表达离开原有之物，又避免“抛弃”可能带出的贬义。加入“已经”使汉语时序清楚。
- source_word: τὰ ἴδια
  choice: 自己所有的
  rationale: 此中性复数表达范围宽泛，指属于他们自己的事物，不明确限定为财产、房屋或家人；该译法保留开放性，同时比“自己的东西”更庄重自然。
- source_word: ἠκολουθήσαμέν σοι
  choice: 跟从了你
  rationale: 准确保留ἀκολουθέω与间接宾语所表达的实际跟随及门徒关系；“跟从”在现代中文圣经语体中清楚、自然。
theological_decisions:
- issue: 彼得等人所撇下之物的范围
  choice: 自己所有的
  alternative: 自己的财物／自己的家／一切所有的
  rationale: τὰ ἴδια本身没有具体列举所撇下的是财物、家庭还是其他所属之物，因此不将其神学化或具体化。
translation_notes:
  register: 采用现代、庄重、易懂的普通话表达。“看哪”保留原文的强调语气；“自己所有的”有意维持τὰ ἴδια的广泛含义。
