base_translation:
  language: en
  yaml_path: translation/nt/luke/018/002.yaml
  text: saying[a], “There was a certain judge in a certain city who did not fear God and did not respect people.
translation:
  language: zh_hans
  text: 说：“某城里有一个法官，他不敬畏上帝，也不尊重人[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“也不顾忌任何人。”希腊文“人”为单数，在这里是泛指。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: 说
  rationale: 现在分词承接上一节并引出比喻内容；汉语用“说”自然连接上下文，无须生硬保留分词形式。
- source_word: Κριτής τις
  choice: 有一个法官
  rationale: τις表示未具名、非特指的人物；现代汉语叙事以“有一个”自然引入角色。
- source_word: ἦν ἔν τινι πόλει
  choice: 某城里有
  rationale: 用存现句表达ἦν，并以“某城”保留τινι所传达的不确定性，同时避免重复“某一个”的欧化表达。
- source_word: τὸν θεὸν μὴ φοβούμενος
  choice: 不敬畏上帝
  rationale: “敬畏”保留φοβέομαι在宗教与道德语境中的庄重含义，并表达这是法官一贯的品性。
- source_word: ἄνθρωπον μὴ ἐντρεπόμενος
  choice: 不把人放在眼里
  rationale: ἐντρέπομαι在此指顾忌、尊重或在意别人；这一自然汉语表达既涵盖不尊重，也传达毫不顾忌人的态度。单数ἄνθρωπον在此为泛指，汉语“人”可自然承担泛指功能。
theological_decisions:
- issue: “敬畏上帝”与“顾忌人”的对举
  choice: 不敬畏上帝，也不把人放在眼里
  alternative: 不怕上帝，也不尊重人
  rationale: 保留神—人的对举及法官在宗教和社会伦理两方面的缺失；“敬畏”较准确呈现φοβέομαι的宗教含义，而“不把人放在眼里”自然表达ἐντρέπομαι所含的尊重、顾忌与在意。
- issue: ἄνθρωπον的泛指单数
  choice: 人
  alternative: 任何人
  rationale: 原文用单数泛指，与“上帝”构成对照；汉语“人”既能保留单数形式，也可自然泛指世人，不必限定为男性。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事表达。“某城里有一个法官”符合汉语比喻开篇习惯；“不把人放在眼里”虽较具习语色彩，但准确传达人物傲慢且毫不顾忌他人的特征。
