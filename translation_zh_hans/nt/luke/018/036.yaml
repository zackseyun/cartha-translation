  text: And hearing a crowd passing by[a], he was asking what this meant.
translation:
  language: zh_hans
  text: 他听见一群人经过，就问这是怎么回事[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他不断地问这是什么。”原文动词为未完成时，可表示持续或反复询问；间接问句中的希求语气也可带有稍许不确定的意味。
    reason: 保留未完成时可能表达的持续或反复意味，并说明间接问句中希求语气可能带有的试探意味。
lexical_decisions:
- source_word: ἀκούσας
  choice: 听见
  rationale: 不定过去时分词在此表示伴随或先于主句的情境，汉语用“听见”并由“就”自然表达叙事中的时间衔接。
- source_word: δὲ
  choice: 就
  rationale: δέ是轻微的叙事连接词；结合汉语句法，以“就”连接所听见的事和随后的询问，避免生硬直译为“而”。
- source_word: ὄχλου
  choice: 一群人
  rationale: ὄχλος为无冠词单数，指经过现场的一群人；“一群人”比“一大群人”更中性，不额外强调人数。
- source_word: διαπορευομένου
  choice: 经过
  rationale: 现在时分词描写人群正在行进；“经过”自然表达从他附近走过的持续动态，同时不把方向或目的说得过细。
- source_word: ἐπυνθάνετο
  choice: 问
  rationale: 未完成时中间语态表示当时正在询问，也可能含反复询问之意。正文用简洁自然的“问”，将可能的持续或反复意味保留在脚注中。
- source_word: τί εἴη τοῦτο
  choice: 这是怎么回事
  rationale: 这是过去时主句后的间接疑问句，εἴη为希求语气。“这是怎么回事”在现代汉语中自然地询问眼前发生的事情；希求语气可能带有的较不确定意味在脚注中说明。
theological_decisions: []
translation_notes:
  register: 采用现代、简洁而庄重的叙事语言。“这是怎么回事”符合普通读者的自然表达，同时不对人群经过的原因作额外解释。
