  text: καὶ αὐτοὶ οὐδὲν τούτων συνῆκαν, καὶ ἦν τὸ ῥῆμα τοῦτο κεκρυμμένον ἀπ’ αὐτῶν, καὶ οὐκ ἐγίνωσκον τὰ λεγόμενα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/034.yaml
  text: And they understood none of these things[a], and this saying was hidden from them[c][b], and they did not understand the things being said.
translation:
  language: zh_hans
  text: 他们一点也没有领会这些事；这话[a]对他们是隐藏的[b]，他们也不知道所说的事[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这话”也可译作“这句话”或“这信息”。
    reason: lexical_alternative
  - marker: b
    text: 原文采用被动表达，没有说明是谁或什么使这话对他们隐藏。
    reason: alternative_reading
  - marker: c
    text: “所说的事”也可译作“所说的话”或“所说的内容”。
    reason: lexical_alternative
lexical_decisions:
- source_word: συνῆκαν
  choice: 领会
  rationale: 这里指在理解力上把握耶稣刚才所说的预言。“领会”自然地表达深入理解，也与末句对 ἐγίνωσκον 的译法有所区别。
- source_word: οὐδὲν τούτων
  choice: 一点也没有领会这些事
  rationale: 保留对前文多项陈述的复数回指；“一点也没有”准确表达 οὐδέν 的完全否定，同时符合现代汉语习惯。
- source_word: τὸ ῥῆμα τοῦτο
  choice: 这话
  rationale: ῥῆμα 在此指刚刚说出的内容。“这话”既简洁自然，又可涵盖“话语、陈述、信息”等语义。
- source_word: κεκρυμμένον ἀπ’ αὐτῶν
  choice: 对他们是隐藏的
  rationale: 该结构表示隐藏之后持续存在的状态。此译保留被动含义，不补出隐藏者，也不把它改释为单纯的心理困惑。
- source_word: ἐγίνωσκον
  choice: 不明白
  rationale: γινώσκω 在此语境中指未能认知或理解所说内容。“不明白”符合现代汉语表达；同时用前句的“领会”保留两个希腊动词之间可感知的措辞差异。
- source_word: τὰ λεγόμενα
  choice: 所说的是什么
  rationale: 以自然汉语表达现在时被动分词所指的正在说出的内容，不额外限定说话者或内容范围。
theological_decisions:
- issue: 门徒不理解与“隐藏”的性质
  choice: 保留无施事者的被动表达“对他们是隐藏的”
  alternative: 明确译为“上帝使他们不能明白”，或弱化为“他们觉得这话隐晦”
  rationale: 原文没有说明是谁或什么使这话向他们隐藏。译文不把施事者补成上帝，也不将隐藏完全心理化，从而保留原文的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“领会”与“不明白”避免机械重复，同时体现 συνίημι 与 γινώσκω 的措辞差异；分号呈现三重描述之间紧密而递进的关系。
