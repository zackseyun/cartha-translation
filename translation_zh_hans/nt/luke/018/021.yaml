  text: And he said[a], “I have kept all these things from my youth.”
translation:
  language: zh_hans
  text: 他说：“这一切我从少年时起就都遵守了。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ εἶπεν
  choice: 他却说
  rationale: δέ是轻微连接词；在这里承接耶稣所列的诫命，并引出此人的回应。译作“却”能自然体现回应中隐含的转折，又不把对比强化得过重。
- source_word: Ταῦτα πάντα
  choice: 这一切
  rationale: 原文直译为“这一切（事）”，上下文所指是前一节列出的诫命。正文不增补原文没有的“诫命”，以保留原文的简洁表达。
- source_word: ἐφύλαξα
  choice: 都遵守了
  rationale: φυλάσσω用于诫命时表示持守、遵行；现代汉语以“遵守”最自然准确。“了”表达说话者声称截至当时一直有这样的行为记录。
- source_word: ἐκ νεότητος μου
  choice: 从小
  rationale: ἐκ加属格表示时间起点；νεότης指年少时期。“从小”是现代汉语自然、通俗的表达，也避免较书面的“自幼”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通俗的叙事语言。“这一切”保留希腊文未明说“诫命”的特点；语序调整为“这一切我从小就都遵守了”，符合现代汉语信息结构，并以“就”凸显从年少开始延续至今的声称。
