  text: ὁ δὲ Ἰησοῦς ⸂προσεκαλέσατο αὐτὰ λέγων⸃· Ἄφετε τὰ παιδία ἔρχεσθαι πρός με καὶ μὴ κωλύετε αὐτά, τῶν γὰρ τοιούτων ἐστὶν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/016.yaml
  text: But Jesus called them to him[a], saying, “Let the children come to me, and do not hinder them, for the kingdom of God belongs to such as these.”
translation:
  language: zh_hans
  text: 耶稣却把孩子们叫到自己身边，说：“让孩子们到我这里来，不要拦阻他们，因为上帝的国属于这样的人。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσεκαλέσατο αὐτὰ
  choice: 把孩子们叫到身边
  rationale: 中间语态动词表示召唤到自己这里；补明代词所指的“孩子们”，既避免汉语中指代含混，也自然表达靠近耶稣的动作。
- source_word: Ἄφετε τὰ παιδία ἔρχεσθαι πρός με
  choice: 让孩子们到我这里来
  rationale: ἄφετε在此表示准许，搭配不定式；此译直接、自然，并保留命令语气。
- source_word: μὴ κωλύετε αὐτά
  choice: 不要拦阻他们
  rationale: κωλύω可指拦阻、妨碍或禁止；“拦阻”保留宽泛含义，也与当时门徒阻止人的语境相合。
- source_word: τῶν τοιούτων
  choice: 这样的人
  rationale: 该复数指示性质或类别，不仅指眼前这些孩子，也涵盖由他们所代表的一类人；译文不进一步界定具体是哪些特质。
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: 上帝的国
  rationale: 采用现代汉语中清楚而庄重的传统神学表达，准确传达属格关系。
- source_word: τῶν γὰρ τοιούτων ἐστὶν ἡ βασιλεία τοῦ θεοῦ
  choice: 因为上帝的国属于这样的人
  rationale: 把希腊语“这样的人所有的是上帝的国”所表达的归属关系转成自然汉语，同时保留其所指范围的张力。
theological_decisions:
- issue: τῶν τοιούτων的范围
  choice: “这样的人”包括由眼前孩子所代表的一类人
  alternative: 仅指当时被带来的那些孩子
  rationale: τοιούτων通常带有类别和性质上的代表意味；译为“这样的人”保留其开放性，而不擅自说明究竟是哪一种儿童般的特质。
- issue: 上帝之国与“这样的人”的关系
  choice: 译为“属于这样的人”
  alternative: 更直译为“上帝的国是这样之人的”或较弱地译为“是为这样的人预备的”
  rationale: 属格加εἰμί表达归属或关联；“属于”在现代汉语中清楚自然，但不额外解释进入国度的机制或条件。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“孩子们”避免人为加入“小”这一原文未明确表达的修饰；“却”承接上下文中门徒的阻拦，与δέ的转折功能相称。
