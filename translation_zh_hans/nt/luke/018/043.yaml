  text: καὶ παραχρῆμα ἀνέβλεψεν, καὶ ἠκολούθει αὐτῷ δοξάζων τὸν θεόν. καὶ πᾶς ὁ λαὸς ἰδὼν ἔδωκεν αἶνον τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/043.yaml
  text: And immediately he received his sight[a], and he followed him, glorifying God. And all the people, when they saw it[b], gave praise to God.
translation:
  language: zh_hans
  text: 他立刻看见了[a]，便一路跟随耶稣[b]，把荣耀归给上帝。众人看见这事，也都赞美上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“恢复了视力”。希腊语动词在这里可以表示得见，也可以表示恢复视力。
    reason: lexical_alternative
  - marker: b
    text: 希腊语动词形式可强调持续的行动；也可译作“便跟随耶稣”。
    reason: aspectual_alternative
lexical_decisions:
- source_word: παραχρῆμα
  choice: 立刻
  rationale: 准确表达事情毫无耽延地发生，符合现代汉语叙事习惯。
- source_word: ἀνέβλεψεν
  choice: 能看见了
  rationale: 在医治语境中表示得见或恢复视力；此译自然，也不武断认定他以前曾经看得见。
- source_word: ἠκολούθει
  choice: 一路跟随
  rationale: 用“一路”体现未完成时所呈现的持续动作，同时保持叙事流畅。
- source_word: δοξάζων
  choice: 把荣耀归给
  rationale: 保留δοξάζω所表达的归荣耀于上帝之意，并与后面的“赞美”区分开来。
- source_word: λαός
  choice: 众人
  rationale: 自然表达此处作为整体的在场民众，比“民众全体”更符合现代汉语。
- source_word: ἰδών
  choice: 看见这事
  rationale: 希腊文未明说宾语；“这事”自然指前述医治及其后的反应，不作过度限定。
- source_word: ἔδωκεν αἶνον
  choice: 赞美
  rationale: 希腊文直译为“献上赞美”；汉语用动词“赞美”简洁自然，意思完整。
- source_word: θεός / θεῷ
  choice: 上帝
  rationale: 采用现代标准汉语中通行而庄重的称呼，并保留本节两次提到上帝的强调。
theological_decisions:
- issue: 得见之后跟随耶稣这一行动的持续性
  choice: 一路跟随耶稣
  alternative: 跟随耶稣
  rationale: ἠκολούθει为未完成时，可呈现持续进行的跟随；“一路”在上下文中自然体现这一点，又不额外赋予特定教义含义。
- issue: ἀνέβλεψεν是否必然表示恢复从前已有的视力
  choice: 能看见了
  alternative: 恢复了视力
  rationale: 该动词在医治语境中可以指恢复视力，但经文本身没有说明此人是否生来失明；译文避免替文本作出这一判断。
- issue: δοξάζων与ἔδωκεν αἶνον的词义区分
  choice: 把荣耀归给上帝／赞美上帝
  alternative: 两处都译作“赞美上帝”
  rationale: 分别呈现“归荣耀”和“献上赞美”的词汇差异，同时保留两种回应都以上帝为对象。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“一路跟随”承接行程语境并体现持续动作；明确写“耶稣”以避免连续代词造成指代含混。所有脚注标记均置于相应正文之后。
