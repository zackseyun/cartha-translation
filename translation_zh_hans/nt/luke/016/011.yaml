id: LUK.16.11
reference: Luke 16:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἰ οὖν ἐν τῷ ἀδίκῳ μαμωνᾷ πιστοὶ οὐκ ἐγένεσθε, τὸ ἀληθινὸν τίς ὑμῖν πιστεύσει;
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/011.yaml
  text: If[a], then, you have not been faithful with unrighteous wealth[b], who will entrust the true riches to you?
translation:
  language: zh_hans
  text: 所以，你们若在不义的钱财[a]上不忠心，谁会把真正的财富[b]托付给你们呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译“在不义的玛门上”；“玛门”指钱财或财富。也可译作“不诚实的钱财”，但这可能让人以为只指以欺诈手段取得的钱财。
    reason: lexical_alternative
  - marker: b
    text: 直译“那真正的”；这里与前面的“钱财”相对，因此正文补出“财富”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδίκῳ
  choice: 不义的
  rationale: 保留ἄδικος“不义、不公正”的道德色彩；“不诚实的”容易被理解为专指以欺诈手段取得的钱财，范围过窄。
- source_word: μαμωνᾷ
  choice: 钱财
  rationale: μαμωνᾶς指财富或财物。“钱财”在现代汉语中自然，也不局限于现金；正文不采用音译“玛门”，以免普通读者难以理解。
- source_word: ἐν τῷ ἀδίκῳ μαμωνᾷ
  choice: 在不义的钱财上
  rationale: ἐν在这里表示忠心所体现的范围；汉语“在……上”既自然，又保留管家职分语境中的考验范围。
- source_word: πιστοὶ οὐκ ἐγένεσθε
  choice: 不忠心
  rationale: πιστός在本段指受托管理时忠实可靠；γίνομαι与表语连用，在此自然译为表现或显明为某种状态，无须生硬译作“没有成为”。
- source_word: τὸ ἀληθινὸν
  choice: 真正的财富
  rationale: ἀληθινός在此为中性单数名词化用法，原文未明说所指的名词；上下文与“钱财”形成对比，正文补出“财富”以符合汉语表达，并用脚注保留原文的省略。
- source_word: πιστεύσει
  choice: 会……托付
  rationale: πιστεύω在这里带间接宾语ὑμῖν和直接宾语τὸ ἀληθινόν，意思是把某物交托给某人，而不是“相信”。
theological_decisions:
- issue: τὸ ἀληθινὸν所指为何
  choice: 真正的财富
  alternative: 那真正的／真实的事物
  rationale: 原文以名词化形容词表达，所指保持一定开放性；然而它紧接“不义的钱财”并与之对照，补出“财富”最符合上下文。脚注说明直译，以避免把隐含名词当作原文明说的内容，也不进一步限定为某一种属灵或天上的赏赐。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“所以……若……”呈现οὖν引出的推论和εἰ条件句；“在……上忠心”符合现代汉语中的受托管理语境。保留“不义”这一较强的道德用语，并借脚注交代“玛门”和名词省略。
