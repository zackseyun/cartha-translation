  text: καὶ ἐν τῷ ᾅδῃ ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ, ὑπάρχων ἐν βασάνοις, ⸀ὁρᾷ Ἀβραὰμ ἀπὸ μακρόθεν καὶ Λάζαρον ἐν τοῖς κόλποις αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/023.yaml
  text: And in Hades[a], lifting up his eyes, being in torment[b], he sees Abraham far away and Lazarus in his bosom.
translation:
  language: zh_hans
  text: 他在阴间[a]正受着痛苦，举目看见远处的亚伯拉罕和在亚伯拉罕怀中的拉撒路[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “阴间”原文为“哈得斯”（Hades），指死者所在之处；不同于通常指最终审判之地的“欣嫩子谷”（Gehenna）。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“在他的怀中”；这里的“他”指亚伯拉罕。传统译法为“在亚伯拉罕怀里”。
    reason: lexical_clarification
lexical_decisions:
- source_word: ᾅδῃ
  choice: 阴间
  rationale: 以现代中文中较为通行的“阴间”指死者所在之处，并保留它与表示最终审判之地的“欣嫩子谷／地狱”（γέεννα）之间的词义区别。
- source_word: ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: 举目一望
  rationale: 保留“抬起眼睛”的生动动作，同时采用自然、庄重的现代中文表达。
- source_word: ὑπάρχων ἐν βασάνοις
  choice: 受着痛苦
  rationale: 将处境性的分词结构自然地译出；“受着”表达持续状态，“痛苦”传达 βάσανοι 在此处的严重折磨之意。
- source_word: ὁρᾷ
  choice: 就看见
  rationale: 中文叙事中以“看见”自然承接前面的举目动作；“就”体现动作之间的紧密推进，而不额外规定因果关系。
- source_word: ἀπὸ μακρόθεν
  choice: 远处的
  rationale: 清楚表达人物之间显著的空间距离，符合现代汉语习惯。
- source_word: ἐν τοῖς κόλποις αὐτοῦ
  choice: 在亚伯拉罕怀中
  rationale: κόλπος 的复数形式在这里是习语，表示贴近胸怀、受到亲密接纳的位置；“怀中”既保留意象，也比机械直译“胸膛中”自然。将代词所指明说为“亚伯拉罕”，避免中文歧义。
theological_decisions:
- issue: ᾅδης 在中间状态与最终审判相关讨论中的译法
  choice: 阴间
  alternative: 地狱；死者的领域
  rationale: “阴间”较好地保留本节希腊词 ᾅδης 的独特性，避免将叙事场景直接等同于 γέεννα 所指的最终刑罚之地，同时不超出经文本身去界定完整的死后状态教义。
- issue: “亚伯拉罕怀中”意象的表达
  choice: 在亚伯拉罕怀中
  alternative: 在他怀中；在亚伯拉罕身旁
  rationale: “怀中”保留原文的身体与亲近意象；明确重复“亚伯拉罕”可消除中文代词指向不明，却不把这一意象扩展为特定宗派的死后世界体系。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“举目一望，就看见”维持叙事的生动推进；“阴间”和“怀中”保留关键原文意象及其神学张力。
