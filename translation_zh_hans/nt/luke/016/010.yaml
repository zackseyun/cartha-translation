source:
  edition: SBLGNT
  text: Ὁ πιστὸς ἐν ἐλαχίστῳ καὶ ἐν πολλῷ πιστός ἐστιν, καὶ ὁ ἐν ἐλαχίστῳ ἄδικος καὶ ἐν πολλῷ ἄδικός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/010.yaml
  text: The one who is faithful in very little is also faithful in much[b][a], and the one who is unrighteous in very little is also unrighteous in much.
translation:
  language: zh_hans
  text: 在极小的事上[a]忠信的人，在许多事上也忠信；在极小的事上不义[b]的人，在许多事上也不义。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在最小的事上”或“在最微不足道的事上”。原文可指数量、分量或重要性极小。
    reason: lexical_alternative
  - marker: b
    text: 或译“不诚实”或“不公正”。原词含义比钱财上的不诚实更广，不过在本段语境中也包含这一层意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστός
  choice: 忠信
  rationale: 这里指人在受托之事上可靠、值得信赖，而不是指“相信”。“忠信”既表达忠诚，也包含可信可靠之意。
- source_word: ἐν ἐλαχίστῳ
  choice: 在最小的事上
  rationale: 介词短语表示所处的范围；中性单数可指极小或最不重要的事物。此译与后面的“大事”形成自然、鲜明的对照。
- source_word: πολλῷ
  choice: 大事
  rationale: 原文中性单数与ἐλαχίστῳ相对，表示较多、较大的范围。汉语用“小事／大事”的对偶，简洁地传达原句的数量或分量对比。
- source_word: ἄδικος
  choice: 不义
  rationale: 该词泛指不公正或不正当，并不限于钱财上的不诚实。“不义”保留其较宽的道德含义，也符合上下文。
- source_word: ὁ ... πιστός / ὁ ... ἄδικος
  choice: 忠信的人／不义的人
  rationale: 冠词加形容词在此作名词使用，泛指具有相应品格的人；译为“……的人”自然且不额外限定性别。
- source_word: καί
  choice: 也；分句间用分号承接
  rationale: 两处καί在对应判断中有附加义，译作“也”可清楚呈现平行关系；两个主要陈述之间以分号连接，更符合现代汉语表达。
theological_decisions:
- issue: 管家职分语境中ἄδικος的道德范围
  choice: 不义
  alternative: 不诚实；不公正
  rationale: 本节陈述的是一般性的道德原则，不只谈钱财管理。“不义”避免把耶稣的话缩限为财务欺诈，同时仍与紧邻的钱财语境相符。
translation_notes:
  register: 采用现代、庄重而易懂的普通话，以“最小的事／大事”和“忠信／不义”保留原文两组紧密对偶；不补入“钱财”，以免把本节的一般原则过度限定于当前语境。
