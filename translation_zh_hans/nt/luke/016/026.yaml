id: LUK.16.26
reference: Luke 16:26
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ⸀ἐν πᾶσι τούτοις μεταξὺ ἡμῶν καὶ ὑμῶν χάσμα μέγα ἐστήρικται, ὅπως οἱ θέλοντες διαβῆναι ἔνθεν πρὸς ὑμᾶς μὴ δύνωνται, ⸀μηδὲ ἐκεῖθεν πρὸς ἡμᾶς διαπερῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/026.yaml
  text: And besides all these things[a], between us and you a great chasm has been fixed, so that those wanting to cross over from here to you cannot, nor can they cross over from there to us.
translation:
  language: zh_hans
  text: 此外，在我们和你们之间，已经设立了一道巨大的深渊，以致想从这里到你们那里去的人不能越过去；从那里到我们这里来的人也不能越过来。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν πᾶσι τούτοις
  choice: 此外
  rationale: 此短语在上下文中引出另一项补充考虑；译作“此外”比逐字译法更符合现代汉语，同时保留其承接和递进作用。
- source_word: μεταξὺ ἡμῶν καὶ ὑμῶν
  choice: 在我们和你们之间
  rationale: 直接保留空间与关系意义，并明确ὑμῶν为复数。
- source_word: χάσμα μέγα
  choice: 一道巨大的深渊
  rationale: “深渊”自然表达两边无法跨越的巨大裂隙；量词“一道”符合现代汉语习惯。
- source_word: ἐστήρικται
  choice: 已经隔定了
  rationale: 完成时被动态强调这道分隔已经确立并持续有效；“隔定”兼顾设立与固定不可更改的状态。
- source_word: ὅπως
  choice: 使
  rationale: 自然表达由既定深渊所造成或指向的结果，同时不强行限定为纯目的或纯结果。
- source_word: οἱ θέλοντες
  choice: 那些想……的人
  rationale: 以自然汉语表达名词化分词，保留其泛指意义。
- source_word: διαβῆναι
  choice: 越到……去
  rationale: 表达从一边跨越至另一边，并与方位词“这里／那里”自然搭配。
- source_word: ἔνθεν
  choice: 从这里
  rationale: 保留说话者所在一侧的指示视角。
- source_word: μὴ δύνωνται
  choice: 不能过去
  rationale: 明确表达能力上的不可能，而非仅仅受到禁止。
- source_word: μηδὲ
  choice: 也不能
  rationale: 连接第二个否定分句，保持两向皆不可通行的平行关系。
- source_word: ἐκεῖθεν
  choice: 从那里
  rationale: 与“从这里”形成清楚的指示对照。
- source_word: διαπερῶσιν
  choice: 越过
  rationale: 表达横越并抵达另一侧；与前句意义平行，同时避免汉语机械重复。
theological_decisions:
- issue: 比喻中两个境域之间分隔的性质
  choice: 译文呈现已经确立、双向均无法跨越的分隔，但不把“深渊”进一步解释为一套超出本节的来世地理或系统教义。
  alternative: 将深渊明确解释为来世中一处字面地形，或反过来淡化为不含固定分隔意义的纯粹象征。
  rationale: 本节明确强调分隔的既定状态和双方都无力跨越；翻译应保留这种力度，也应避免替经文解决其未展开的神学问题。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“此外”顺畅承接上文；“已经隔定了一道巨大的深渊”保留完成时所强调的持续状态。后半句略作显性补足，以清楚呈现从两边试图跨越的人都不能过去。
