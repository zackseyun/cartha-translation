  to: 此外，在我们和你们之间，已经设立了一道巨大的深渊，以致想从这里到你们那里去的人不能越过去；从那里到我们这里来的人也不能越过来。
  rationale: 仅作语言层面的安全修订：以“设立”替换不常用的“隔定”，并调整后半句动词位置，使双向均不能跨越的平行结构在现代汉语中更清楚自然。未改变原文的空间意象、完成状态或神学含义。
