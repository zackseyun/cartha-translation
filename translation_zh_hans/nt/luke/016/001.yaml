  text: Ἔλεγεν δὲ καὶ πρὸς τοὺς ⸀μαθητάς· Ἄνθρωπός τις ἦν πλούσιος ὃς εἶχεν οἰκονόμον, καὶ οὗτος διεβλήθη αὐτῷ ὡς διασκορπίζων τὰ ὑπάρχοντα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/001.yaml
  text: He was also saying to the disciples[a], “There was a certain rich man who had a manager[b], and this man was accused to him of squandering his possessions.”
translation:
  language: zh_hans
  text: 耶稣也对门徒说：“有一个财主，有一个管家[a]。有人向财主告发这管家挥霍那财主的财产[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “管家”指受托管理一个家庭、产业或财物的人，也可译作“家业管理员”。
    reason: lexical_alternative
  - marker: b
    text: “告发”也可译作“举报”或“控告”。原文表示有人作出不利报告，并不一定说明指控已经证实。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: 说
  rationale: 未完成时在此用于铺陈叙事、引出比喻；现代汉语用“说”比“正说着”自然，且不误添动作持续的强调。
- source_word: δὲ καὶ
  choice: 也
  rationale: καί表明耶稣除了先前的听众外也对门徒说话；δέ在汉语中可由语境自然体现，无须机械译作“但”或“于是”。
- source_word: πρὸς τοὺς μαθητάς
  choice: 对门徒
  rationale: 忠实保留定冠词所指的门徒群体，不增添原文没有的物主词“他的”。
- source_word: Ἄνθρωπός τις ἦν πλούσιος
  choice: 有一个财主
  rationale: 自然呈现比喻中人物登场的希腊语句式；“财主”简明而有尊严，表达富有之人。
- source_word: οἰκονόμον
  choice: 管家
  rationale: 指受托管理家业或产业的人；“管家”是现代汉语中清楚且沿用已久的对应词。
- source_word: οὗτος
  choice: 这管家
  rationale: 保留指示代词回指并强调该管家的作用，同时避免汉语中生硬的“这个人”。
- source_word: διεβλήθη αὐτῷ
  choice: 有人向财主告发
  rationale: 以汉语主动句自然表达被动式及间接宾语；“告发”保留不利指控或举报的意味，但不暗示指控已经证实。
- source_word: ὡς διασκορπίζων
  choice: 挥霍
  rationale: 在财产管理语境中，διασκορπίζω指浪费、耗散资产；“挥霍”准确传达指控内容。
- source_word: τὰ ὑπάρχοντα αὐτοῦ
  choice: 他的财产
  rationale: 指财主所拥有的资产；“财产”比“所有物”更符合产业管理的语境。
theological_decisions:
- issue: 指控是否已被证实
  choice: 译为“告发”，并在脚注说明这只是指控或不利报告
  alternative: 译为“查出”或直接断言管家确实挥霍
  rationale: διαβάλλω在此表达有人向主人提出指控，并不单凭该动词判定控告属实；译文应保留这一叙事张力。
- issue: 说话者的明确化
  choice: 以“耶稣”明示主语
  alternative: 按希腊文只译“他”
  rationale: 原文主语承接上文；独立经节中用“耶稣”澄清指代，未改变所指人物，也便于普通读者理解。
translation_notes:
  register: 采用现代、自然而庄重的叙事语言。“有一个财主”符合汉语比喻开场习惯；将希腊语被动结构转为“有人向财主告发”的主动结构，使关系清楚。所有脚注标记均置于相关词句之后。
