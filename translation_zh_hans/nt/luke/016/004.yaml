source:
  edition: SBLGNT
  text: ἔγνων τί ποιήσω, ἵνα ὅταν μετασταθῶ ⸀ἐκ τῆς οἰκονομίας δέξωνταί με εἰς τοὺς οἴκους ⸀ἑαυτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/004.yaml
  text: I know what I will do[a], so that when I am removed from the management, they may receive me into their homes.
translation:
  language: zh_hans
  text: “我知道该怎么办了，好让他们在我被撤去管家职务时，接我到自己家里去。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔγνων
  choice: 我知道该怎么办了
  rationale: 不定过去时在这里表达突然想明白、已有主意；句末“了”自然体现从不知到知道的结果。
- source_word: τί ποιήσω
  choice: 该怎么办
  rationale: τί 加商议式虚拟语气表示对下一步行动的筹划；结合 ἔγνων，现代汉语用“知道该怎么办”最自然。
- source_word: ἵνα ὅταν
  choice: 好让他们在……时
  rationale: “好让”保留目的意味，“在……时”表达预期将来发生的条件性时点。
- source_word: μετασταθῶ ἐκ τῆς οἰκονομίας
  choice: 我被撤去管家职务
  rationale: 保留被动语态以及失去职分之意；οἰκονομία 在比喻中指管家的管理职务，而非现代意义的“经济”。
- source_word: δέξωνταί με
  choice: 接我
  rationale: δέχομαι 在此涉及接纳和款待；“接我到……家里去”符合现代汉语，也不过度添加热情欢迎的意味。
- source_word: εἰς τοὺς οἴκους ἑαυτῶν
  choice: 到自己家里去
  rationale: “家里”比“房屋里”更符合收留人的语境；“自己”明确表达反身代词 ἑαυτῶν。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语自然的叙事语言。“该怎么办了”体现人物突然有了主意；句法调整为“好让他们在……时”，以清楚表达目的关系，同时保留原文的将来时点和被动撤职含义。
