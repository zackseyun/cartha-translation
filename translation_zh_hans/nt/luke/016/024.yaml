source:
  edition: SBLGNT
  text: καὶ αὐτὸς φωνήσας εἶπεν· Πάτερ Ἀβραάμ, ἐλέησόν με καὶ πέμψον Λάζαρον ἵνα βάψῃ τὸ ἄκρον τοῦ δακτύλου αὐτοῦ ὕδατος καὶ καταψύξῃ τὴν γλῶσσάν μου, ὅτι ὀδυνῶμαι ἐν τῇ φλογὶ ταύτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/024.yaml
  text: And he cried out and said[a], ‘Father Abraham, have mercy on me, and send Lazarus so that he may dip the tip of his finger in water and cool my tongue, because I am in agony in this flame.’
translation:
  language: zh_hans
  text: 他便喊着说：“亚伯拉罕祖先啊，怜悯我吧！请打发拉撒路来，让他把手指尖蘸在水里，使我的舌头凉快些，因为我在这火焰里痛苦极了。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为我在这火焰里受折磨。”希腊语动词可指剧烈的痛苦或折磨。
    reason: 词义上的可选译法；保留ὀδυνῶμαι既可着重痛苦状态、也可译作“受折磨”的语义幅度。
lexical_decisions:
- source_word: φωνήσας
  choice: 喊着
  rationale: 该词在这里引出急切而高声的呼求；“喊着”自然传达其强度，又不作过度发挥。
- source_word: Πάτερ Ἀβραάμ
  choice: 父亲亚伯拉罕啊
  rationale: 保留呼格称呼及向祖先求助的意味；语气词“啊”使现代汉语中的直接呼唤清楚自然。
- source_word: ἐλέησόν με
  choice: 可怜我吧
  rationale: 直接表达求对方施怜悯、发慈悲的请求；在此对话场景中比抽象的“向我施怜悯”更自然。
- source_word: πέμψον
  choice: 打发……来
  rationale: 准确表达命令式的“派遣”，并以“来”标明拉撒路被派到说话者这里。
- source_word: βάψῃ τὸ ἄκρον τοῦ δακτύλου αὐτοῦ ὕδατος
  choice: 用指尖蘸点水
  rationale: βάπτω表示短暂蘸入；“指尖”准确对应手指的末端，“点”自然体现所求水量极少，但不改变动作图景。
- source_word: καταψύξῃ τὴν γλῶσσάν μου
  choice: 凉一凉我的舌头
  rationale: 保留具体的身体意象和降温之意；叠用“凉一凉”符合现代口语请求的自然表达。
- source_word: ὀδυνῶμαι
  choice: 痛苦极了
  rationale: 该动词表示剧烈的疼痛或苦楚；此译传达强度，同时避免直接加入施虐者或受刑方式等原文未明说的含义。
- source_word: ἐν τῇ φλογὶ ταύτῃ
  choice: 在这火焰里
  rationale: φλόξ具体指火焰；保留单数的鲜明图景，不泛化为“火中”。
theological_decisions:
- issue: 财主所受痛苦的表述
  choice: 因为我在这火焰里痛苦极了
  alternative: 因为我在这火焰里受折磨
  rationale: 原文明确表达强烈痛苦，却没有在该动词本身说明谁施加折磨或具体机制。“痛苦极了”保留强度及有关死后苦楚的张力，而不额外作教义性界定。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。引语中的“可怜我吧”“凉一凉”体现急切恳求，整体仍保持经文体的克制；脚注标记放在其所解释的“痛苦极了”之后。
