  terminology: “怜悯我”准确对应ἐλέησόν με，且保留经文中常见的求怜悯表达。“亚伯拉罕祖先”避免将Πάτερ误解为生身父亲，也不引入额外教义含义。“痛苦”可对应ὀδυνῶμαι；脚注保留“受折磨”这一可行但语气可能更强的译法。
