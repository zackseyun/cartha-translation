  to: 他便喊着说：“亚伯拉罕祖先啊，怜悯我吧！请打发拉撒路来，让他把手指尖蘸在水里，使我的舌头凉快些，因为我在这火焰里痛苦极了。[a]”
  rationale: 修订仅处理中文称谓的自然性及“蘸在水里”这一动作图景的明确度，未改变原文的命令、目的、火焰意象或苦痛强度。“亚伯拉罕祖先啊”保留原文呼格的祖先性诉求；脚注继续呈现ὀδυνῶμαι的可选强烈译法，而不裁定超出本节的教义问题。
