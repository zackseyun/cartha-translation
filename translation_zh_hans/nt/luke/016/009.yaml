  text: καὶ ἐγὼ ὑμῖν λέγω, ⸂ἑαυτοῖς ποιήσατε⸃ φίλους ἐκ τοῦ μαμωνᾶ τῆς ἀδικίας, ἵνα ὅταν ⸀ἐκλίπῃ δέξωνται ὑμᾶς εἰς τὰς αἰωνίους σκηνάς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/009.yaml
  text: And I tell you[a], make friends for yourselves by means of unrighteous wealth, so that when it fails[c][b], they may welcome you into the eternal dwellings.
translation:
  language: zh_hans
  text: 我告诉你们：要用不义的钱财[a]为自己结交朋友，好让钱财用尽时[b]，他们可以接待你们进入永恒的住处[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“借着不义的玛门”。“玛门”是该词的传统音译，意思是钱财或财富。
    reason: lexical_alternative
  - marker: b
    text: 也可理解为“当你们离世时”或“当钱财耗尽时”。这里的希腊文动词没有明说主语；多数人认为是钱财用尽，也有人认为是指人的死亡。
    reason: alternative_reading
  - marker: c
    text: 或译“永恒的帐棚”。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἐγὼ ὑμῖν λέγω
  choice: 我又告诉你们
  rationale: 保留 καί 的承接语气和 ἐγώ 的强调，同时采用自然的现代汉语表达。
- source_word: ἑαυτοῖς ποιήσατε φίλους
  choice: 为自己结交朋友
  rationale: 准确表达反身与命令语气；“结交朋友”比逐字的“制造朋友”更符合现代汉语。
- source_word: ἐκ τοῦ μαμωνᾶ τῆς ἀδικίας
  choice: 用不义的钱财
  rationale: 依上下文将 ἐκ 表达为手段性的“用”；“钱财”清楚传达 μαμωνᾶ，而“不义的”保留 τῆς ἀδικίας 的广泛道德张力，不将其限缩为骗取或偷来的财物。
- source_word: ἵνα ὅταν ἐκλίπῃ
  choice: 好让钱财失效的时候
  rationale: ἐκλίπῃ 表示失去效用、耗尽或消逝；主文按最近的语境所指理解为钱财，同时用脚注保留主语未明所产生的其他可能。
- source_word: δέξωνται ὑμᾶς
  choice: 他们可以接你们
  rationale: “接”能表达接纳、迎接进入某处之意，并且不补明希腊文省略的主语是谁。
- source_word: εἰς τὰς αἰωνίους σκηνάς
  choice: 进入永恒的住处
  rationale: “住处”自然传达 σκηναί 在此作为居所的含义；其字面意象“帐棚”保留在脚注中。
theological_decisions:
- issue: “不义的钱财”的含义
  choice: 保留为“不义的钱财”，指带有现今不义世界特征的钱财，不限定为以欺诈手段所得
  alternative: 不诚实得来的钱财；人格化的“玛门”
  rationale: 原文的属格结构具有张力。主文既不把范围缩窄为赃款，也不强行把玛门完全人格化。
- issue: ἐκλίπῃ 的主语
  choice: 主文理解为钱财失效
  alternative: 你们衰亡，即死亡；钱财耗尽
  rationale: μαμωνᾶ 是最邻近且最自然的所指，但希腊文没有明说主语，因此脚注保留其他理解。
- issue: “他们”所指为何
  choice: 保持隐含，不在译文中说明
  alternative: 借使用钱财所结交的朋友；穷人或上帝的子民；天上的存在者
  rationale: δέξωνται 的主语在希腊文中没有明说；具体指认会超出翻译本身。
translation_notes:
  register: 采用庄重、清楚的现代标准普通话。“钱财”比“玛门”更易懂，同时以脚注保留传统术语；句式保留劝谕的力度，并避免解释“他们”的身份。
