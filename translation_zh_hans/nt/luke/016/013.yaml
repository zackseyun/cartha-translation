source:
  edition: SBLGNT
  text: οὐδεὶς οἰκέτης δύναται δυσὶ κυρίοις δουλεύειν· ἢ γὰρ τὸν ἕνα μισήσει καὶ τὸν ἕτερον ἀγαπήσει, ἢ ἑνὸς ἀνθέξεται καὶ τοῦ ἑτέρου καταφρονήσει. οὐ δύνασθε θεῷ δουλεύειν καὶ μαμωνᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/013.yaml
  text: No household servant can serve two masters; for either he will hate the one and love the other[a], or he will be devoted to one and despise the other. You cannot serve God and Mammon.
translation:
  language: zh_hans
  text: 没有一个家仆能服侍两个主人；因为他不是恨这一个、爱那一个，就是忠于这一个、轻视那一个。你们不能既服侍上帝，又服侍玛门[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “玛门”也可译作“钱财”或“财富”。原文用这一称呼，把财富描写成与上帝争夺人的效忠的另一个主人。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκέτης
  choice: 家仆
  rationale: 该词指在家中处于服役身份的人，比一般的“仆人”更具家庭场景。“家仆”简洁自然，也保留了主人与仆役的关系。
- source_word: κυρίοις
  choice: 主人
  rationale: 此处指家仆所服侍的主人，而非作为神圣称号的“主”；“主人”符合比喻的社会背景。
- source_word: δουλεύειν
  choice: 服侍
  rationale: 该动词表示以奴仆身份事奉或效力。“服侍”既保留从属关系，也能自然用于后文“服侍上帝”和“服侍玛门”的平行表达。
- source_word: μισήσει / ἀγαπήσει
  choice: 恨／爱
  rationale: 直译保留原文鲜明而强烈的对照，不把“恨”弱化为“少爱”。
- source_word: ἀνθέξεται
  choice: 忠于
  rationale: 该词有紧紧依附、持守或站在一方的含义；“忠于”自然表达对某一主人的坚定归属与效忠。
- source_word: καταφρονήσει
  choice: 轻视
  rationale: 该词表示带着蔑视而不看重。“轻视”在现代汉语中清楚自然，并与“忠于”形成对照。
- source_word: θεῷ
  choice: 上帝
  rationale: 清楚指向上帝；采用现代标准普通话中庄重且通行的称呼。
- source_word: μαμωνᾷ
  choice: 玛门
  rationale: 保留闪语借词的音译，使财富在句中作为与上帝争夺效忠的“主人”这一拟人化力量仍然鲜明；脚注说明其词义。
theological_decisions:
- issue: μαμωνᾷ与θεῷ并列时的译法
  choice: 玛门
  alternative: 钱财／财富
  rationale: 音译保留原文把财富拟人化为敌对主人的修辞张力；这并不主张玛门是实际的神祇。脚注同时交代其通常含义。
- issue: 两个主人之间的绝对对立
  choice: 保留“恨／爱”和“忠于／轻视”的强烈对照
  alternative: 意译为“偏爱一个、冷落另一个”
  rationale: 原文使用强烈的反义表达，强调人不可能同时向两个主人献上完整效忠；不宜在译文中将其弱化。
- issue: 希腊文单数仆人的泛指表达
  choice: 他
  alternative: 这个家仆／他们
  rationale: 原文以单数形式作一般性陈述；现代汉语用“他”承接“一个家仆”，既自然又保持原文数的一致。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“家仆—主人—服侍”的词语链保持全句比喻连贯；用“不是……就是……”自然呈现希腊文两个互斥选择。“既……又……”突出同时服侍二者的不可能。
