  text: καὶ εἰ ἐν τῷ ἀλλοτρίῳ πιστοὶ οὐκ ἐγένεσθε, τὸ ⸀ὑμέτερον τίς ⸂δώσει ὑμῖν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/012.yaml
  text: And if you have not been faithful with what belongs to another[c][b][a], who will give you what is your own?
translation:
  language: zh_hans
  text: 如果你们在别人的东西[a]上不忠心，谁会把你们自己的东西[b]给你们呢？[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “别人的东西”也可译作“别人的财物”。
    reason: lexical_alternative
  - marker: b
    text: “你们自己的东西”也可译作“属于你们的东西”。
    reason: lexical_alternative
  - marker: c
    text: 这里的对照可能是指现今在世上钱财上的忠心，与后来得到真正或长存的财富；本节本身没有明确说明二者所指。
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλοτρίῳ
  choice: 别人的东西
  rationale: 定冠词加中性单数形容词在这里作名词用，意为“属于别人的东西”。此译法自然，并与后文“你们自己的东西”形成清楚对照。
- source_word: πιστοὶ
  choice: 忠心
  rationale: 这里描述受托管理时是否可靠，而不是指是否相信；“忠心”符合上下文的管家语境。
- source_word: οὐκ ἐγένεσθε
  choice: 不忠心
  rationale: γίνομαι 的不定过去时在此表示成为或显明处于某种状态；现代汉语用“不忠心”即可自然表达条件句中的实际表现，避免生硬直译为“没有成为忠心的”。
- source_word: τὸ ὑμέτερον
  choice: 你们自己的东西
  rationale: 定冠词加中性单数所有格形容词作名词用，意为“属于你们的东西”；此译法保留了与“别人的东西”的对称和所有关系。
- source_word: δώσει ὑμῖν
  choice: 把……给你们
  rationale: δίδωμι 的基本义是“给”。虽然上下文容许理解为“交托”，正文采用更贴近原文且不过度解释的“给”。
- source_word: καὶ εἰ
  choice: 如果
  rationale: καί 承接上一节，εἰ 引入条件。单节中文中以“如果”自然衔接；不另译“并且”，以免句首累赘。
- source_word: τίς
  choice: 谁
  rationale: 直接保留原文反问中的人物疑问代词。
theological_decisions:
- issue: “别人的东西”与“你们自己的东西”所指为何
  choice: 正文保留对照，但不明确指定二者的具体所指。
  alternative: 可按前一节理解为今世的钱财与真正或长存的财富，也可理解为受托管理的产业与将来所得的产业。
  rationale: 本节希腊文本只陈述对照，并未明确说明两者所指。保留其含蓄性，可避免把某一种神学解释写入正文。
- issue: δώσει 是否应译为“交托”
  choice: 译为“给”。
  alternative: 译为“交托给”。
  rationale: 管家语境使“交托”颇有吸引力，但原词通常意为“给”；采用“给”既忠于词义，也保留所得究竟是托付还是归属的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“忠心”延续圣经管家语境中的常用表达；“别人的东西／你们自己的东西”保持原文结构上的对应。脚注标记全部置于正文句末，避免割裂反问句。
