  text: καὶ προσκαλεσάμενος ἕνα ἕκαστον τῶν χρεοφειλετῶν τοῦ κυρίου ἑαυτοῦ ἔλεγεν τῷ πρώτῳ· Πόσον ὀφείλεις τῷ κυρίῳ μου;
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/005.yaml
  text: And after summoning each one of his master's debtors[a], he was saying to the first, 'How much do you owe my master?'
translation:
  language: zh_hans
  text: 他把欠他主人[a]债的人逐一叫来，对第一个说：“你欠我主人多少？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊语κύριος常译作“主”，但这里指管家的人类主人，所以译作“主人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: 叫来
  rationale: 简洁自然地表达把人召到自己跟前；与后面的主要动作“说”构成先后关系，而不必在中文中生硬直译分词形式。
- source_word: ἕνα ἕκαστον
  choice: 一个一个
  rationale: 保留原文加强的逐一、分别之意，也符合现代汉语习惯。
- source_word: χρεοφειλετῶν
  choice: 债户
  rationale: 在财务语境中准确指欠债的人；比“借款人”范围更合适，因为原词强调负债，不限定债务的形成方式。
- source_word: τοῦ κυρίου ἑαυτοῦ
  choice: 自己主人
  rationale: ἑαυτοῦ回指管家，表示“他自己的主人”；κύριος在此指人的上级或产业主人，并非神圣称号。
- source_word: ἔλεγεν
  choice: 说
  rationale: 希腊语未完成时可为叙事铺陈或逐次询问；中文结合“一个一个”已自然呈现这一场景，不额外加入“不断”等可能过强的频率含义。
- source_word: τῷ πρώτῳ
  choice: 对第一个
  rationale: 直接保留次序关系，中文自然清楚。
- source_word: Πόσον
  choice: 多少
  rationale: 在债务语境中询问所欠数额，现代汉语用“多少”最自然。
- source_word: ὀφείλεις
  choice: 欠
  rationale: 准确表达财务上的负债关系，简明口语化而不失庄重。
- source_word: τῷ κυρίῳ μου
  choice: 我主人
  rationale: 保留μου所表达的第一人称所属关系；“主人”符合比喻中的人际和经济语境。
theological_decisions:
- issue: 比喻中的κύριος应译作神圣称号还是人的身份称谓
  choice: 主人
  alternative: 主
  rationale: 本节所指是管家的属世上级和债权人，并非明确的神或基督称号。译作“主人”既符合叙事情境，也避免引入原文此处没有明确表达的神学指向。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“一个一个”保留原文的分配性强调；“债户”简洁表达商业语境中的欠债者。
