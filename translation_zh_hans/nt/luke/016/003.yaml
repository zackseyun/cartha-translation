id: LUK.16.3
reference: Luke 16:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἶπεν δὲ ἐν ἑαυτῷ ὁ οἰκονόμος· Τί ποιήσω ὅτι ὁ κύριός μου ἀφαιρεῖται τὴν οἰκονομίαν ἀπ’ ἐμοῦ; σκάπτειν οὐκ ἰσχύω, ἐπαιτεῖν αἰσχύνομαι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/003.yaml
  text: Then the manager said to himself[a], ‘What will I do, since my master is taking the management away from me? I am not strong enough to dig, and I am ashamed to beg.’
translation:
  language: zh_hans
  text: 于是，管家心里说：“我该怎么办呢？主人正在从我手中收回管家的职分[a]。我没有力气挖地，又羞于讨饭。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “管家”和“管家的职分”所译的希腊语是同根词；“管家的职分”也可译作“管理职责”。
    reason: 说明原文οἰκονόμος与οἰκονομία的同根呼应，并提供不改变其受托职务含义的自然替代译法。
lexical_decisions:
- source_word: οἰκονόμος
  choice: 管家
  rationale: 指受托管理主人财产和事务的人。“管家”是现代汉语中清楚、自然且符合比喻社会背景的称呼。
- source_word: ἐν ἑαυτῷ
  choice: 心里说
  rationale: 这是表示内心自语或思量的惯用语；“心里说”自然传达其含义。
- source_word: Τί ποιήσω
  choice: 我该怎么办呢
  rationale: 不定过去时虚拟语气在此表示对未来行动的自问；“该怎么办”符合现代汉语的商议语气。
- source_word: κύριός μου
  choice: 主人
  rationale: 此处指比喻中管家的上级和财产所有者，并非神圣称号；“主人”既保留权属关系，也避免误加神学色彩。
- source_word: ἀφαιρεῖται
  choice: 正要撤掉
  rationale: 动词表示从某人手中取走或撤除其职分；结合上下文，“正要”体现事情已临近或正在实施，“撤掉”适合职分语境。
- source_word: οἰκονομίαν
  choice: 管家职分
  rationale: 所指不只是抽象的管理活动，也是受托管理的职位和责任；此译法并与“管家”保留同根词的关联。
- source_word: σκάπτειν
  choice: 挖地
  rationale: 保留字面的挖掘含义，并自然暗示艰苦的体力劳动。
- source_word: οὐκ ἰσχύω
  choice: 我没有力气
  rationale: ἰσχύω可指力量或能力；与挖地相连时，体力不足的意味突出。
- source_word: ἐπαιτεῖν
  choice: 讨饭
  rationale: 该词指乞讨或求人施舍；“讨饭”简明且符合人物所羞于从事之事。
- source_word: αἰσχύνομαι
  choice: 觉得羞耻
  rationale: 直接保留人物面对乞讨时的羞耻感，不把语气弱化为单纯的“不好意思”。
theological_decisions:
- issue: 非神圣语境中 κύριος 的译法
  choice: 主人
  alternative: 主；财主
  rationale: 这里的指称对象是比喻中的人间上级。“主人”保留其对管家的权柄关系，又不使读者误以为此处直接使用神圣称号；“财主”则把财产身份表达得过窄。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。以“心里说”表达内心独白；后两分句保持简短对举，呈现人物走投无路的盘算。
