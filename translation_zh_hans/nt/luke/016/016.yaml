source:
  edition: SBLGNT
  text: Ὁ νόμος καὶ οἱ προφῆται ⸀μέχρι Ἰωάννου· ἀπὸ τότε ἡ βασιλεία τοῦ θεοῦ εὐαγγελίζεται καὶ πᾶς εἰς αὐτὴν βιάζεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/016.yaml
  text: The Law and the Prophets were until John; from then on the kingdom of God is being proclaimed as good news, and everyone is forcing his way into it.
translation:
  language: zh_hans
  text: 律法和先知到约翰为止；从那时起，神国的福音被传扬，人人都奋力闯入其中[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“人人都奋力进入其中。”希腊语动词可表示带着力量的行动；正文保留了急切、奋力进入的意味。
    reason: lexical_alternative
  - marker: b
    text: 有人根据马太福音11:12的相似说法，对末句作更负面的理解。不过本节希腊文中，这个动词的主语是“人人”，不是“神国”。
    reason: alternative_reading
lexical_decisions:
- source_word: Ὁ νόμος
  choice: 律法
  rationale: 这里与“先知”并列，指摩西律法这一公认的圣经类别，而非一般意义上的法律。
- source_word: οἱ προφῆται
  choice: 先知
  rationale: 与“律法”构成犹太传统中的固定并列，可兼指先知及其经书；不添“书”，以保留原文的表达范围。
- source_word: μέχρι Ἰωάννου
  choice: 到约翰为止
  rationale: 自然表达时间界限；上下文足以表明约翰是施洗约翰，无须在正文补明。
- source_word: ἀπὸ τότε
  choice: 从那时起
  rationale: 保留救赎历史中的时间转折及此后持续的意味。
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: 神的国
  rationale: 现代中文中通行且自然，并保留 βασιλεία 可兼含国度与统治的语义幅度。
- source_word: εὐαγγελίζεται
  choice: 被当作好消息传扬
  rationale: 保留现在时被动语态及 εὐαγγελίζω 的“传为好消息”成分，避免仅译作较宽泛的“宣讲”。
- source_word: πᾶς
  choice: 人人
  rationale: 体现泛指单数的分配性和广泛范围，中文简洁自然。
- source_word: εἰς αὐτὴν
  choice: 进入其中
  rationale: 介词 εἰς 自然表示朝向并进入，代词回指“神的国”。
- source_word: βιάζεται
  choice: 奋力闯入
  rationale: 该中间／被动形式含义颇有争议；结合主语 πᾶς 和 εἰς αὐτήν，译文表达强力、急切地进入，同时不把这种行动解释为凭功劳获取神的国。
theological_decisions:
- issue: βιάζεται 与神的国之间的关系
  choice: 理解为人人急切而强有力地进入神的国
  alternative: 把末句理解得更为负面，如人以强力对待神的国；或参照马太福音11:12理解为神的国遭受强暴
  rationale: 本句中 βιάζεται 的语法主语是 πᾶς（“人人”），而 εἰς αὐτήν 通常表示朝向并进入其中。因此正文采用“奋力闯入”，同时以脚注保留动词语态、褒贬色彩和相关平行经文所带来的解释张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“到约翰为止”保留原文简略句式；“被当作好消息传扬”明确福音性含义；“奋力闯入”保留原文力度，并用两条脚注提示主要词义与解释分歧。
