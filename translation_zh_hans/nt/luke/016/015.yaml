id: LUK.16.15
reference: Luke 16:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Ὑμεῖς ἐστε οἱ δικαιοῦντες ἑαυτοὺς ἐνώπιον τῶν ἀνθρώπων, ὁ δὲ θεὸς γινώσκει τὰς καρδίας ὑμῶν· ὅτι τὸ ἐν ἀνθρώποις ὑψηλὸν βδέλυγμα ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/015.yaml
  text: And he said to them[a], “You are the ones who justify yourselves before men, but God knows your hearts[c][b]. For what is exalted among men is detestable before God.”
translation:
  language: zh_hans
  text: 他对他们说：“你们就是那些在人面前自称为义[a]的人，但上帝知道你们的心。因为人所尊崇的[b]，在上帝面前是可憎的[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“证明自己是义的”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“人所看重的”。
    reason: alternative_reading
  - marker: c
    text: 或译：“是可憎之物”。
    reason: lexical_alternative
lexical_decisions:
- source_word: δικαιοῦντες ἑαυτοὺς
  choice: 自称为义
  rationale: 现在时分词带反身代词，指他们在人前把自己说成或表现为义。“自称为义”保留“义”的词义联系，也符合现代汉语表达。
- source_word: ἐνώπιον τῶν ἀνθρώπων
  choice: 在人面前
  rationale: ἐνώπιον 表示“在……面前／眼中”；ἀνθρώπων 在此泛指人类或众人，汉语“人”自然涵盖这一泛指意义。
- source_word: γινώσκει τὰς καρδίας ὑμῶν
  choice: 知道你们的心
  rationale: 直译并保留圣经中“心”所涵盖的内在意念、动机和品格，不在正文中过度解释。
- source_word: τὸ ἐν ἀνθρώποις ὑψηλὸν
  choice: 人所尊崇的
  rationale: ὑψηλόν 本义为“高的、受抬举的”，在此可指在人群中地位崇高、备受推崇或高度看重的事物；“所尊崇的”既保留抬高之意，也适合汉语语境。
- source_word: βδέλυγμα
  choice: 可憎的
  rationale: 该词表示在上帝看来令人厌恶、可憎之物。“可憎的”力度明确且符合现代庄重汉语；其名词性表达另列脚注。
- source_word: Ὑμεῖς ἐστε οἱ ...
  choice: 你们就是那些……的人
  rationale: 以“就是”传达显式代词加冠词分词结构的强调语气，突出耶稣对听者的直接指认。
theological_decisions:
- issue: δικαιοῦντες ἑαυτούς 的语义
  choice: 自称为义
  alternative: 证明自己是义的
  rationale: 上下文着重他们在人前为自己建立义的形象，而不是上帝宣告他们为义；译文保持这种指控，同时不把含义缩窄为单纯“装作正直”。
- issue: τὸ ἐν ἀνθρώποις ὑψηλόν 的范围
  choice: 人所尊崇的
  alternative: 人所看重的
  rationale: 原文既可强调社会上的抬举、尊崇，也可泛指人高度重视的事物。正文保留“高举／尊崇”的形象，脚注列出偏重价值判断的译法。
- issue: βδέλυγμα 的表达形式
  choice: 可憎的
  alternative: 可憎之物
  rationale: 原文使用名词，意为上帝面前可憎恶的事物；汉语谓语用“是可憎的”更自然，但脚注保留名词性译法及其力度。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你们就是”保留原句的强调和责备语气；两个“面前”维持人间评价与上帝判断之间的鲜明对照。
