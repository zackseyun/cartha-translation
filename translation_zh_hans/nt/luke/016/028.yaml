  text: ἔχω γὰρ πέντε ἀδελφούς, ὅπως διαμαρτύρηται αὐτοῖς, ἵνα μὴ καὶ αὐτοὶ ἔλθωσιν εἰς τὸν τόπον τοῦτον τῆς βασάνου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/028.yaml
  text: for I have five brothers[a], so that he may solemnly warn them, lest they too come to this place of torment.
translation:
  language: zh_hans
  text: 因为我有五个兄弟，好让他郑重地警告他们，免得他们也来到这受折磨的地方。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔχω γὰρ
  choice: 因为我有
  rationale: γάρ承接上一节，说明请求亚伯拉罕差拉撒路去父家的原因；“因为”在现代汉语中自然体现这一解释关系。
- source_word: πέντε ἀδελφούς
  choice: 五个兄弟
  rationale: ἀδελφούς为阳性复数，此处指五名男性手足；“兄弟”准确而自然。
- source_word: ὅπως διαμαρτύρηται αὐτοῖς
  choice: 求他郑重警告他们
  rationale: ὅπως在这里表示前述请求的目的；结合上一节的差遣请求，汉语补出“求”能自然衔接。διαμαρτύρομαι兼有郑重作证、严正警告之意；下文强调避免来到此地，故正文采用“郑重警告”，同时保留其庄重和警戒意味。
- source_word: ἵνα μὴ καὶ αὐτοὶ ἔλθωσιν
  choice: 免得他们也来到
  rationale: ἵνα μή表达否定目的，译作“免得”简洁自然；καὶ αὐτοὶ强调这些兄弟“也”会有同样结局的可能。
- source_word: εἰς τὸν τόπον τοῦτον τῆς βασάνου
  choice: 这受苦的地方
  rationale: εἰς表示到达；βάσανος指剧烈痛苦或折磨。译作“受苦”保持叙事语境中的强烈痛苦含义，又不额外引入本节没有明说的系统性教义术语。
theological_decisions:
- issue: 如何表达财主所说的死后所在
  choice: 这受苦的地方
  alternative: 这受折磨的地方；这痛苦之地
  rationale: 原文以βάσανος描述该处所经历的痛苦。正文保留这种严肃含义，但不把它扩展为本节未陈述的完整来世教义。
- issue: διαμαρτύρηται兼具作证与警告的语义
  choice: 郑重警告
  alternative: 郑重向他们作证；严正告诫他们
  rationale: 后接“免得他们也来到”显示话语具有警戒目的，因此选“郑重警告”；但不否认该动词本身也可侧重郑重作证。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“因为”保留与上一节的解释关系；“求他”使跨节承接在汉语中清楚自然；“免得”准确表达否定目的。无脚注标记，因为本稿未设置脚注。
