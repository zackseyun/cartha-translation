  text: Ἤκουον δὲ ταῦτα ⸀πάντα οἱ Φαρισαῖοι φιλάργυροι ὑπάρχοντες, καὶ ἐξεμυκτήριζον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/014.yaml
  text: The Pharisees[a], who were lovers of money, were hearing all these things and were ridiculing him.
translation:
  language: zh_hans
  text: 那些贪爱钱财的法利赛人听着这一切，也嗤笑他[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“讥笑他”。原词可表示公开嘲弄，也可表示带着轻蔑的讥诮。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤκουον
  choice: 听着
  rationale: 未完成时描写与当时情景同时进行的动作；“听着”在自然汉语中比单纯的“听见了”更能体现持续或正在发生的意味。
- source_word: δὲ
  choice: 不单独译出
  rationale: 此处主要是轻微的叙事衔接或转折；汉语凭语序和上下文即可自然承接，硬译为“现在”会加入原文没有的时间含义。
- source_word: ταῦτα πάντα
  choice: 这一切
  rationale: 自然概括耶稣此前所说的全部教导，同时保留指回上文的作用。
- source_word: οἱ Φαρισαῖοι
  choice: 法利赛人
  rationale: 采用现代中文圣经语境中通行的犹太群体名称。
- source_word: φιλάργυροι ὑπάρχοντες
  choice: 贪爱钱财的
  rationale: φιλάργυρος明确指爱钱财；“贪爱钱财”既保留其词义焦点，也比泛化的“贪婪”更贴近原文。定语结构自然表达该分词短语对法利赛人的特征描述。
- source_word: ἐξεμυκτήριζον
  choice: 嗤笑
  rationale: 该动词表达带着轻蔑的嘲弄；“嗤笑”简洁、现代而庄重，能够传达公开讥嘲和鄙夷。未完成时的进行性由“听着……就……”的场景性叙述部分体现，不以生硬的“正在不断”强行标记。
- source_word: αὐτόν
  choice: 他
  rationale: 照原文使用第三人称代词，所指由上下文确定为耶稣。
theological_decisions:
- issue: φιλάργυροι对法利赛人的罪性描述
  choice: 贪爱钱财的
  alternative: 贪婪的
  rationale: 原词具体指向对钱财的爱，不宜扩展成范围更广的道德标签；这样也保留本节与上文财富教导的直接联系。
- issue: αὐτόν所指对象的表达
  choice: 他
  alternative: 耶稣
  rationale: 原文使用代词，且上下文足以辨明所指；保留代词可避免把上下文信息改写成经文本身的明说。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“那些贪爱钱财的法利赛人”保持原文人物特征与主句的紧密关系；“听着这一切，就嗤笑他”形成流畅的叙事推进。脚注标记紧跟其所说明的动词短语。
