  text: πτωχὸς δέ ⸀τις ὀνόματι ⸀Λάζαρος ἐβέβλητο πρὸς τὸν πυλῶνα αὐτοῦ εἱλκωμένος
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/020.yaml
  text: And a poor man named Lazarus had been laid at his gate[a], covered with sores[b],
translation:
  language: zh_hans
  text: 又有一个穷人，名叫拉撒路，被人放在财主的大门口[a]，浑身长满疮[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“被人扔在财主的大门口。”希腊语动词可含“扔下”的意思，可能更突出拉撒路的无助和所受的冷落。
    reason: lexical_alternative
  - marker: b
    text: 或译：“满身是疮。”希腊语分词表示他患有疮或溃疡。
    reason: lexical_alternative
lexical_decisions:
- source_word: πτωχὸς
  choice: 穷人
  rationale: 该词指贫穷、困苦的人；译作“穷人”自然准确，也避免把经文本身没有明说的“乞丐”身份加入译文。
- source_word: τις
  choice: 一个
  rationale: τις在这里引入一个新人物；现代汉语用“一个穷人”自然表达其不定性，无须采用较生硬的“某一个”。
- source_word: ὀνόματι Λάζαρος
  choice: 名叫拉撒路
  rationale: 与格结构ὀνόματι加人名表示“名叫……”，按现代汉语习惯译出。
- source_word: ἐβέβλητο
  choice: 被人放在
  rationale: βάλλω的过去完成时被动形式表示他已被别人置于那里，并突出他的无助。“被人放在”保留被动含义和结果状态；原词也可有较强的“扔下”意味，列入脚注。
- source_word: πρὸς τὸν πυλῶνα αὐτοῦ
  choice: 财主的大门口
  rationale: πρός加宾格在此表示相对于入口的位置；πυλών是大门或门道。代词αὐτοῦ所指是上一节的财主，为避免汉语中“他”指代不清，明确译作“财主的”。
- source_word: εἱλκωμένος
  choice: 浑身长满疮
  rationale: 该分词表示患有疮或溃疡。“浑身长满疮”是清楚自然的现代汉语，并传达其严重、可见的病况。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通俗的叙事语言。“又有”承接上一节并引出对比人物；“财主”明确代词所指。“浑身长满疮”比医学化的“患有溃疡”更适合普通读者。
