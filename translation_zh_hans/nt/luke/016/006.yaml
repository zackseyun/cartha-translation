  text: ὁ δὲ εἶπεν· Ἑκατὸν βάτους ἐλαίου· ⸂ὁ δὲ⸃ εἶπεν αὐτῷ· Δέξαι σου ⸂τὰ γράμματα⸃ καὶ καθίσας ταχέως γράψον πεντήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/006.yaml
  text: He said[a], ‘A hundred baths of olive oil.’ Then he said to him, ‘Take your bill, sit down quickly[b], and write fifty.’
translation:
  language: zh_hans
  text: 他说：“一百罢特[a]的橄榄油。”管家对他说：“拿起你的欠据[b]，赶快坐下，写五十。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “罢特”是古代的液体容量单位。希腊原文作“一百罢特橄榄油”。
    reason: cultural_note
  - marker: b
    text: 或译“你的契约”或“你的文书”。希腊原文直译为“你的文书”，在这里指记载债务的欠据。
    reason: lexical_alternative
lexical_decisions:
- source_word: βάτους
  choice: 罢特
  rationale: 这是古代特定的液体容量单位；音译可保留原文具体的经济细节，并以脚注说明。
- source_word: ἐλαίου
  choice: 橄榄油
  rationale: 在此语境中指橄榄油；现代汉语中这样表达比泛称“油”更清楚。
- source_word: Δέξαι
  choice: 拿过
  rationale: 此处命令对方把文书拿在手中，以便立即改写；“拿过”自然地体现这一动作。
- source_word: τὰ γράμματα
  choice: 你的欠据
  rationale: 字面为复数的“文书”，在债务语境中指记录欠债的凭据；“欠据”简洁清楚，同时脚注保留较宽的词义。
- source_word: καθίσας
  choice: 坐下
  rationale: 该分词与后面的命令构成连续动作，汉语宜译为并列指令。
- source_word: ταχέως
  choice: 赶快
  rationale: 直接表达动作的急迫和迅速，符合叙事中的口头命令。
- source_word: γράψον
  choice: 写
  rationale: 指在欠据上写下修改后的数额，不额外加入原文未明说的宾语。
- source_word: πεντήκοντα
  choice: 五十
  rationale: 忠实保留原文数目，不作解释性扩展。
