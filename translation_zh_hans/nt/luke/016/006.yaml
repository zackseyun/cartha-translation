  to: 他说：“一百罢特[a]的橄榄油。”管家对他说：“拿起你的欠据[b]，赶快坐下，写五十。”
  rationale: 仅作两项低风险的汉语表达修订：“拿过”改为“拿起”，以消除可能的递交方向歧义；在“罢特”与“橄榄油”之间加入“的”，使数量短语更合乎现代汉语。人物指代、数额、古代单位及脚注锚点均予保留。
