id: LUK.16.18
reference: Luke 16:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Πᾶς ὁ ἀπολύων τὴν γυναῖκα αὐτοῦ καὶ γαμῶν ἑτέραν μοιχεύει, ⸀καὶ ὁ ἀπολελυμένην ἀπὸ ἀνδρὸς γαμῶν μοιχεύει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/018.yaml
  text: Everyone who divorces his wife and marries another commits adultery[b][a], and he who marries a woman divorced from her husband commits adultery.
translation:
  language: zh_hans
  text: 凡休妻另娶[a]的，都是犯奸淫；娶被丈夫休了的女人[b]的，也是犯奸淫。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作“娶另一个女人”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“从丈夫那里被休了的”；即已经被丈夫休掉的女人。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς ὁ
  choice: 凡……的
  rationale: 该结构表达普遍性的概括；“凡……的”在现代汉语中自然、庄重，并保留其普遍范围。
- source_word: ἀπολύων
  choice: 休
  rationale: 在婚姻语境中指解除婚姻关系。“休妻”简洁明确，也符合汉语圣经语体；不是按字面译为一般性的“释放”或“打发走”。
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: 妻
  rationale: γυνή 在离婚和再婚语境中明确指妻子。
- source_word: καὶ γαμῶν ἑτέραν
  choice: 另娶
  rationale: γαμέω 表示结婚，ἑτέραν 指另一个女性；“另娶”自然地包含“娶另一个女人”的意思，同时保持简洁。
- source_word: μοιχεύει
  choice: 犯奸淫
  rationale: 准确表达婚姻关系中的通奸行为，也是现代汉语读者容易理解的庄重表述。
- source_word: ἀπολελυμένην
  choice: 被……休了的女人
  rationale: 保留完成时被动分词的被动意义及其所形成的状态，即这女人已经被解除婚姻关系。
- source_word: ἀπὸ ἀνδρὸς
  choice: 被丈夫
  rationale: ἀνήρ 在此婚姻语境中指丈夫；虽然 ἀπό 的形式较接近“从丈夫那里”，汉语用“被丈夫休了”能自然表达离婚行为的来源，并保留女人是被休的一方。
theological_decisions:
- issue: 耶稣关于离婚和再婚之话的范围与语气
  choice: 按本节原文译为普遍性的道德宣告，不补入任何例外条件。
  alternative: 参照其他经文补入淫乱等例外，或把本句限定为某种特定犹太法律情境下的不正当离婚。
  rationale: 路加在本节中的措辞简洁而普遍；翻译应呈现本节本身的表达，不以其他经文或特定解释体系消解其张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“休妻”“犯奸淫”保持经文语体的凝练；两个“的”字结构对应原文两项概括性陈述。
