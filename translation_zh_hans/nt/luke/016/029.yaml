  yaml_path: translation/nt/luke/016/029.yaml
  text: But Abraham said[a], ‘They have Moses and the Prophets[b]; let them listen to them.’
translation:
  language: zh_hans
  text: 亚伯拉罕却说：“他们有摩西和众先知[a]，让他们听他们的话吧[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “摩西和众先知”通常指由与摩西有关的经卷和先知书所构成的圣经见证。
    reason: cross_reference
  - marker: b
    text: 或译：“让他们听他们吧。”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει δὲ
  choice: 却说
  rationale: λέγει是叙事中的历史现在时，汉语自然叙事可译为“说”；δέ在上下文中带轻微转折，译作“却”能体现亚伯拉罕对前一请求的回应。
- source_word: Ἀβραάμ
  choice: 亚伯拉罕
  rationale: 采用现代中文圣经传统中通行且易识别的人名译法。
- source_word: Ἔχουσι
  choice: 他们有
  rationale: 直译现在时，表达这些人已经拥有并可接触相关见证。
- source_word: Μωϋσέα καὶ τοὺς προφήτας
  choice: 摩西和众先知
  rationale: 保留原文简洁的犹太用语，不在正文中扩写为“摩西律法和先知书”；这里以摩西和众先知转指与他们相关的经卷见证。
- source_word: ἀκουσάτωσαν
  choice: 让他们听从……吧
  rationale: 第三人称复数不定过去时命令式；“让他们……吧”保留命令或劝令语气，“听从”在现代汉语中既包含聆听，也自然传达认真接受其见证的语用含义。
- source_word: αὐτῶν
  choice: 他们
  rationale: ἀκούω后接属格，可指所听的人或来源；代词回指“摩西和众先知”。中文以“听从他们”保留原文拟人化的指称，避免直接改写成“听从这些经卷”。
theological_decisions:
- issue: “摩西和众先知”的所指
  choice: 正文保留人物称谓，理解为转指摩西及先知传统所承载的权威经文见证
  alternative: 仅指摩西和先知这些历史人物本身
  rationale: 路加著作和犹太语境常以此类表达指向圣经见证；正文不将其解释性扩写，从而保留原文措辞，脚注则帮助普通读者理解其转喻作用。
- issue: ἀκουσάτωσαν所表达的回应程度
  choice: 译作“听从”，表达听取并留意其见证
  alternative: 较字面的“听他们”或“听见他们”
  rationale: 该语境不只是声音感知，而是要求富人的弟兄接受已有的见证；“听从”符合现代汉语，但脚注保留较字面的译法，以免过度消除词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“却说”体现对话转折；“摩西和众先知”保留原文的传统简式表达；“听从他们”在中文中自然，并以脚注注明较字面的译法。所有脚注标记均置于正文对应短语之后。
