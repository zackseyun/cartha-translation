source:
  edition: SBLGNT
  text: καὶ ἐπῄνεσεν ὁ κύριος τὸν οἰκονόμον τῆς ἀδικίας ὅτι φρονίμως ἐποίησεν· ὅτι οἱ υἱοὶ τοῦ αἰῶνος τούτου φρονιμώτεροι ὑπὲρ τοὺς υἱοὺς τοῦ φωτὸς εἰς τὴν γενεὰν τὴν ἑαυτῶν εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/008.yaml
  text: And the master praised the unrighteous manager because he had acted shrewdly[c][b][a]. For the sons of this age are more shrewd in dealing with their own generation than the sons of light are.
translation:
  language: zh_hans
  text: 主人[a]称赞那个不义的管家，因为他做事精明。因为今世之子在与自己这一代人打交道时[c]，比光明之子[b]更精明。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “主人”也可译作“主”。这里更可能指比喻中管家的主人，而不是直接指耶稣或上帝。
    reason: alternative_reading
  - marker: b
    text: “今世之子”和“光明之子”是归属性的说法，分别指受现今世代塑造的人和属于光明的人。
    reason: lexical_alternative
  - marker: c
    text: “与自己这一代人打交道时”直译近于“对于他们自己的世代”。原文短语含义较难确定，也可能指他们在自己同类中行事。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ κύριος
  choice: 主人
  rationale: 紧接比喻的叙事语境，最自然是指那位财主，即管家的主人；译作“主人”也保留κύριος在此处可能作社会身份称谓的用法。
- source_word: τὸν οἰκονόμον τῆς ἀδικίας
  choice: 那个不义的管家
  rationale: “管家”是现代汉语中清楚自然的家庭产业管理者称谓；“不义的”保留ἀδικία的道德判断，却不把具体罪行窄化为单纯“欺诈”。
- source_word: φρονίμως / φρονιμώτεροι
  choice: 精明／更精明
  rationale: 这里指为达到目的而表现出的实际机敏。“精明”既能贯通原文同一词族，又不像“智慧”那样容易暗示正面的道德认可。
- source_word: οἱ υἱοὶ τοῦ αἰῶνος τούτου
  choice: 今世之子
  rationale: 保留闪语式“……之子”的比喻及其与“光明之子”的平行，表示受现今世代塑造、归属于今世的人。
- source_word: οἱ υἱοὶ τοῦ φωτός
  choice: 光明之子
  rationale: 保留圣经中具有辨识度的归属隐喻，并与“今世之子”形成原文所具有的对称。
- source_word: εἰς τὴν γενεὰν τὴν ἑαυτῶν
  choice: 在对待自己这一代的人时
  rationale: 原短语句法和所指均有难度；此译表达在自己所属世代或群体的人际事务中行事的关系性含义，同时以脚注保留较直译形式。
theological_decisions:
- issue: 首句ὁ κύριος的身份
  choice: 比喻中管家的主人
  alternative: 主（即耶稣或上帝）
  rationale: 眼前叙事以财主和管家为人物，“主人”是最顺畅的内部指称；脚注保留“主”的可能性，不把存在的指称歧义完全消除。
- issue: 对管家行为的道德评价
  choice: 称赞其精明，却仍称他为不义
  alternative: 称赞其道德智慧，或认可其不义行为
  rationale: 原文并置τῆς ἀδικίας与φρονίμως，形成刻意张力。译文同时保留“不义”与“精明”，不将策略上的肯定误作道德上的认可。
- issue: “今世之子”与“光明之子”的对比
  choice: 保留两组归属性隐喻
  alternative: 解释为“世人”与“信徒”
  rationale: 原文没有直接使用这些解释性类别；保留隐喻可避免把群体身份过度教派化或限定化。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“不义”与“光明之子”保留经文的道德和意象力度；“做事精明”自然传达实际机敏，又不暗示对不义的赞同。脚注标记集中置于相关句末，并全部在正文出现。
