  text: ἐγένετο δὲ ἀποθανεῖν τὸν πτωχὸν καὶ ἀπενεχθῆναι αὐτὸν ὑπὸ τῶν ἀγγέλων εἰς τὸν κόλπον Ἀβραάμ· ἀπέθανεν δὲ καὶ ὁ πλούσιος καὶ ἐτάφη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/022.yaml
  text: It happened that the poor man died and was carried by the angels to Abraham’s bosom[a]. And the rich man also died and was buried.
translation:
  language: zh_hans
  text: 那穷人死了，被天使带到亚伯拉罕的怀中[a]。那财主也死了，并且被埋葬了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“到亚伯拉罕身旁”。希腊原文直译是“到亚伯拉罕的怀中”，描绘亲近、尊荣和相交。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο δὲ ἀποθανεῖν
  choice: 那穷人死了
  rationale: ἐγένετο加不定式是路加常用的叙事结构；现代汉语直接陈述事件更自然。δέ的轻微承接作用由上下文和句序体现，不另加原文没有的明确时间词。
- source_word: τὸν πτωχὸν
  choice: 那穷人
  rationale: πτωχός指贫穷、穷困的人；译作“穷人”直接准确，不把上下文细节增译为“乞丐”。
- source_word: ἀπενεχθῆναι αὐτὸν ὑπὸ τῶν ἀγγέλων
  choice: 被天使带到
  rationale: 保留原文被动结构及天使作为施事者；“带到”符合现代汉语表达，也传达被带走并送达某处的意思。
- source_word: εἰς τὸν κόλπον Ἀβραάμ
  choice: 到亚伯拉罕的怀中
  rationale: κόλπος本指胸怀、怀抱，也可表示紧靠某人身旁的位置。“怀中”保留原文亲近、尊荣和团契的形象，不把它直接解释为某个特定的来世地点。
- source_word: ἀπέθανεν δὲ καὶ ὁ πλούσιος
  choice: 那财主也死了
  rationale: “也”对应καί，突出穷人与财主同样经历死亡；“财主”是现代汉语中自然、凝练的称呼。
- source_word: ἐτάφη
  choice: 并且被埋葬了
  rationale: 保留θάπτω过去被动式的意义；“被埋葬了”直接呈现原文的被动语态。
theological_decisions:
- issue: εἰς τὸν κόλπον Ἀβραάμ的表达
  choice: 到亚伯拉罕的怀中
  alternative: 到亚伯拉罕身旁
  rationale: 正文采用较贴近字面的“怀中”，保留比喻及其文化和神学张力；脚注给出较易理解的“身旁”，但不把此语固定解释为某种特定的来世教义。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。正文简洁，保持原文两次死亡陈述的平行关系，并保留“亚伯拉罕的怀中”这一具有形象性且不宜过度解释的说法。
