  text: εἶπεν δὲ αὐτῷ· Εἰ Μωϋσέως καὶ τῶν προφητῶν οὐκ ἀκούουσιν, οὐδ’ ἐάν τις ἐκ νεκρῶν ἀναστῇ πεισθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/031.yaml
  text: But he said to him[a], ‘If they do not listen to Moses and the Prophets[c][b], neither will they be persuaded if someone rises from the dead.’
translation:
  language: zh_hans
  text: 他却对他说：“如果他们不听摩西和众先知的话[a]，即使有人从死人中复活[b]，他们也不会被说服[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “听”也可理解为“听从”或“留心听”；希腊语动词既可指听见，也可包含作出回应的意思。
    reason: lexical_alternative
  - marker: b
    text: 或译：“从死里复活。”原文直译近于“从死人中起来”。
    reason: lexical_alternative
  - marker: c
    text: 或译：“他们也不会信服。”希腊语意为“被说服”或“被劝服”，不一定专指较狭义的“相信”。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ αὐτῷ
  choice: 他却对他说
  rationale: δέ在对话中带有轻微转折意味；“却”自然保留这一语气，而“对他说”准确表达间接受词结构。
- source_word: Μωϋσέως καὶ τῶν προφητῶν
  choice: 摩西和众先知的话
  rationale: 原文以人物代指他们所传达的经文见证。汉语补出“的话”使“听”有自然的宾语，同时仍保留“摩西和众先知”这一原有表达，不直接改写为“圣经”。
- source_word: οὐκ ἀκούουσιν
  choice: 不听
  rationale: ἀκούω在此兼有听见与听从、留意的可能；“不听”在现代汉语中能够保留这种语义宽度。
- source_word: οὐδ’ ἐάν
  choice: 那么，即使……也不
  rationale: 这一结构承接前句否定并加以强化；“即使……也不”自然呈现其让步性条件和强调作用。
- source_word: τις
  choice: 有人
  rationale: 保留不定单数指称，符合现代汉语习惯。
- source_word: ἐκ νεκρῶν ἀναστῇ
  choice: 从死人中复起
  rationale: “从死人中”较明确地保留ἐκ νεκρῶν“从死者之中”的表达；“复起”传达ἀνίστημι在此处的复活含义，同时不过度扩写。
- source_word: πεισθήσονται
  choice: 被说服
  rationale: 保留πείθω未来被动式的形式和一般性的“受劝服、被说服”意义，不将其窄化为“相信”或“悔改”。
theological_decisions:
- issue: “摩西和众先知”的所指
  choice: 保留这一惯用称谓，并以“的话”表明所听的是其经文见证
  alternative: 直接译为“圣经”或仅理解为两个代表性人物
  rationale: 上下文中这一短语指向以色列已经领受的权威经文见证。保留原有称谓可避免将隐喻完全解释掉。
- issue: πεισθήσονται的含义
  choice: 他们也不会被说服
  alternative: 他们也不会相信／悔改
  rationale: 原词表达被劝服或被确信，并未明确限定为得救的信心或悔改，因此译文保留其一般意义。
- issue: ἐκ νεκρῶν的范围
  choice: 从死人中
  alternative: 从死里
  rationale: “从死人中”保留“从死者之中”的可能意象；脚注同时提示更惯用的汉语译法“从死里”。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“他却对他说”保留对话中的轻微转折；“即使……也不会”使希腊语的强化否定在汉语中清楚自然。脚注标记均置于相应主文位置。
