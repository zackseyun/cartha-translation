  to: 他叫来那管家，对他说：“我听说有关你的这些事，是怎么回事？把你所经管事务的账目交代清楚[a]，因为你不能再作管家了[b]。”
  rationale: 修订仅改善现代汉语的语序和搭配，并使末句的管家职务含义更明确；未将主人所闻的内容具体化，也未把“不能”单方面解释为能力不足或正式撤职。脚注标记仍紧随所说明的短语，且完整保留。
