  naturalness: 原句“我听到这些关于你的事，是怎么回事？”略带英语式语序；“我听说有关你的这些事，是怎么回事？”在现代标准汉语中更自然，同时保留质问和传闻性质。“把你经管事务的账交代清楚”可微调为“把你所经管事务的账目交代清楚”，搭配更清楚。
  terminology: “管家”“经管”“账目”准确反映本段庄园管理和核账语境。以“作管家”翻译末句，避免无宾语的“管理”在汉语中显得悬空，并保留名词οἰκονομία与动词οἰκονομεῖν之间的角色关联。
