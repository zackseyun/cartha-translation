  text: καὶ φωνήσας αὐτὸν εἶπεν αὐτῷ· Τί τοῦτο ἀκούω περὶ σοῦ; ἀπόδος τὸν λόγον τῆς οἰκονομίας σου, οὐ γὰρ ⸀δύνῃ ἔτι οἰκονομεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/002.yaml
  text: And after calling him[a], he said to him, “What is this that I hear about you? Give an account of your stewardship[b], for you are no longer able to manage.”
translation:
  language: zh_hans
  text: 他叫来那管家，对他说：“我听说有关你的这些事，是怎么回事？把你所经管事务的账目交代清楚[a]，因为你不能再作管家了[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把你管理事务的账目交出来”，或“交代你受托管理的情况”。
    reason: λόγος与οἰκονομία在此可侧重账目核算，也可较广地指对受托管理工作的交代。
  - marker: b
    text: 或译：“因为你不能再履行管理职能了。”
    reason: οἰκονομεῖν可译为履行管理职能，也可突出其管家身份。
lexical_decisions:
- source_word: φωνήσας αὐτόν
  choice: 他把管家叫来
  rationale: 不定过去时分词表示先于主句的动作；“叫来”自然体现召来当面对质。代词所指根据上文为管家，明说“管家”可避免现代汉语中的指代含混。
- source_word: Τί τοῦτο ἀκούω περὶ σοῦ;
  choice: 我听到这些关于你的事，是怎么回事？
  rationale: 保留原文质问的语气以及 τί τοῦτο 的开放性，不把听闻的内容过度具体化为已经证实的罪名。
- source_word: ἀπόδος τὸν λόγον
  choice: 把……的账交代清楚
  rationale: 在财务和管理语境中，λόγος 指账目或核账交代；ἀπόδος 是要求其提交、交代。“把账交代清楚”符合现代汉语表达。
- source_word: τῆς οἰκονομίας σου
  choice: 你经管事务
  rationale: οἰκονομία 指受托管理产业或家务的职分与事务；“经管事务”既体现受托管理，又避免抽象生硬的“管家职分之账”。
- source_word: οὐ γὰρ δύνῃ ἔτι οἰκονομεῖν
  choice: 因为你不能再管理了
  rationale: 保留 δύνῃ 的“能够/可以”以及 ἔτι 否定后的“不再”；“不能”在汉语中也保留实际能力与获准任职之间的语境张力。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。主人的质问保持直接，财务与受托管理语境清楚；避免使用过于古雅的“交账”“司库”等词。脚注标记均紧随相关短语。
