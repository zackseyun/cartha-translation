  text: καὶ ἐπιθυμῶν χορτασθῆναι ⸀ἀπὸ τῶν πιπτόντων ἀπὸ τῆς τραπέζης τοῦ πλουσίου· ἀλλὰ καὶ οἱ κύνες ἐρχόμενοι ⸀ἐπέλειχον τὰ ἕλκη αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/021.yaml
  text: and longing to be fed from what fell from the rich man's table[a]. But even the dogs came and licked his sores.
translation:
  language: zh_hans
  text: 他巴不得靠财主桌上掉下来的东西吃饱[a]。可是，连狗也来舔他的疮。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他巴不得靠财主桌上掉下来的碎屑吃饱。”原文直译为“掉下来的东西”；“碎屑”是根据用餐场景推知的。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιθυμῶν
  choice: 巴不得
  rationale: 现在分词表达持续而强烈的渴望；“巴不得”在现代汉语中自然传达迫切愿望，又不额外说明愿望是否实现。
- source_word: χορτασθῆναι
  choice: 好得饱足
  rationale: 不定过去时被动不定式表示因得到食物而吃饱；“得饱足”保留结果及被满足的意味，并与前面的食物语境衔接。
- source_word: ἀπὸ τῶν πιπτόντων
  choice: 那……掉下来的东西
  rationale: 冠词化分词指从桌上掉落之物，原文没有明说是“碎屑”或“残渣”；译文保留这一开放性。
- source_word: τῆς τραπέζης τοῦ πλουσίου
  choice: 财主桌上
  rationale: 自然表达“从财主的桌子上”；“财主”简洁承接本比喻中已出现的富人。
- source_word: ἀλλὰ καὶ
  choice: 可是，连……也
  rationale: 同时传达转折和出人意外的递进强调，不把狗的行为预先解释为怜悯或羞辱。
- source_word: οἱ κύνες
  choice: 狗
  rationale: 按字面译出复数类称；汉语无需强加量词或说明是野狗。
- source_word: ἐρχόμενοι
  choice: 来
  rationale: 作为伴随主动作的分词，汉语用连动结构“来也舔”自然表达。
- source_word: ἐπέλειχον
  choice: 舔
  rationale: 未完成过去时描写持续或反复行为；汉语叙事中的“来舔”可自然呈现这一场景，而不硬加体标记。
- source_word: τὰ ἕλκη αὐτοῦ
  choice: 他的疮
  rationale: ἕλκη指溃疡性疮口；“疮”准确、通俗，且比“伤口”更贴近原词。
theological_decisions:
- issue: 狗舔疮的意义
  choice: 只陈述行为，不说明这是安慰、医治、怜悯或进一步羞辱
  alternative: 将其解释为狗在安慰他，或狗使他的处境更加悲惨
  rationale: 原文叙述本身容许不同语用理解；译文应保留这种张力，不把解释写进正文。
translation_notes:
  register: 采用现代、庄重而通俗的叙事语言。“巴不得”传达强烈持续的渴望；正文避免较文言的“欲得”“充饥”，也避免临床化的“溃疡”。脚注保留“碎屑”这一符合语境但并非原文明说的译法。
