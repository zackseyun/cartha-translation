  naturalness: “他巴不得靠……吃饱”是现代标准汉语中自然、清晰的表达，既保留强烈愿望，也明确食物来源与吃饱的结果。“连狗也来舔他的疮”简洁自然，并可在汉语叙事中承载原文未完成时所描绘的场景。
  terminology: “财主”适合此比喻中既有的称谓；“疮”能自然对应ἕλκη所指的疮口／溃疡性疮患。避免将掉落之物正文限定为“碎屑”，并在脚注中保留该合乎语境但带有推断性的译法。
