  text: ὁ δὲ εἶπεν· Οὐχί, πάτερ Ἀβραάμ, ἀλλ’ ἐάν τις ἀπὸ νεκρῶν πορευθῇ πρὸς αὐτοὺς μετανοήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/030.yaml
  text: But he said[a], ‘No, father Abraham, but if someone goes to them from among the dead, they will change their thinking.’
translation:
  language: zh_hans
  text: 他却说：“不，亚伯拉罕父亲！可是，如果有人从死人中[a]出来，到他们那里去，他们就会悔改。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从死里”。
    reason: ἀπὸ νεκρῶν 可按复数直译为“从死人中”，也可用汉语中更凝练的“从死里”表达；两者都不必明确补出“复活”。
lexical_decisions:
- source_word: ὁ δὲ εἶπεν
  choice: 他却说
  rationale: δὲ承接并对照亚伯拉罕上一句答复；“却”自然体现反驳语气。
- source_word: Οὐχί
  choice: 不
  rationale: 这是较强的否定答复；中文直接引语中的“不”简洁自然，感叹号帮助传达其强调语气。
- source_word: πάτερ Ἀβραάμ
  choice: 父亲亚伯拉罕
  rationale: 保留πάτερ的亲属称呼和富人以亚伯拉罕为先祖而提出恳求的意味，不把它处理为正式头衔。
- source_word: ἀλλ’ ἐάν
  choice: 可是，如果
  rationale: 保留ἀλλά对前述判断的纠正和ἐάν引出的条件关系。
- source_word: τις
  choice: 有人
  rationale: 自然表达不定单数，未限定具体是谁。
- source_word: ἀπὸ νεκρῶν
  choice: 从死人中
  rationale: 体现ἀπό加复数属格所表达的从死者群体或死亡领域出来；脚注保留较宽泛的另一种理解。
- source_word: πορευθῇ πρὸς αὐτοὺς
  choice: 到他们那里去
  rationale: 保留πορεύομαι的“去”以及πρός所表达的朝向；该说法符合现代汉语的指向表达。
- source_word: μετανοήσουσιν
  choice: 他们就会悔改
  rationale: 在路加的语境中，该词指面对神的警告而发生道德和属灵上的转变；“悔改”比单纯“改变想法”更准确。
theological_decisions:
- issue: μετανοήσουσιν所表达的转变性质
  choice: 译作“他们就会悔改”
  alternative: “他们就会改变想法”或“他们就会回转”
  rationale: 本段所说的不是单纯改变意见，而是听从神的警告、离开罪恶；“悔改”保留了路加用语中的道德和属灵分量。
- issue: ἀπὸ νεκρῶν是否明确指复活
  choice: 正文译作“从死人中”，不补入“复活”
  alternative: “从死里复活后”
  rationale: 原文只说有人从死者中去见他们，并未明说复活的方式；不补入“复活”可保留原文的表达张力。
translation_notes:
  register: 采用现代、庄重而易懂的直接引语。“父亲亚伯拉罕”略带亲属式郑重感，呼应人物把亚伯拉罕视为先祖的语境；不用古雅的“亚伯拉罕父啊”。
