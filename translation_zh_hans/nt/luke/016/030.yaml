  rationale: 修正“从死人中到他们那里去”的中文句法，使其明确表达“从死人中出来，去到他们那里”，同时不把原文未明说的复活方式写入正文。调整呼语语序以提高现代汉语的自然度；保留“悔改”作为 μετανοέω 在本段的准确译法。
