  text: εἶπεν δὲ Ἀβραάμ· Τέκνον, μνήσθητι ὅτι ⸀ἀπέλαβες τὰ ἀγαθά σου ἐν τῇ ζωῇ σου, καὶ Λάζαρος ὁμοίως τὰ κακά· νῦν δὲ ὧδε παρακαλεῖται σὺ δὲ ὀδυνᾶσαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/025.yaml
  text: But Abraham said[a], ‘Child, remember that you received your good things during your life, and Lazarus likewise bad things; but now he is comforted here[b], and you are in anguish.’
translation:
  language: zh_hans
  text: 亚伯拉罕却说：“孩子啊，你要记得，你一生中享了种种好处[a]，拉撒路也同样经历了种种苦楚；但如今他在这里得安慰，你却痛苦不堪[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“得尽了你所享的种种好处”，或“领受了所分给你的种种好处”。原文动词可指领受所得，也可含有完全领受的意味。
    reason: lexical_alternative
  - marker: b
    text: 或译“受折磨”。原文可表示剧烈的疼痛或悲痛。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τέκνον
  choice: 孩子啊
  rationale: 这是带亲切或怜悯意味的呼语，并不一定表示亲生关系；“孩子啊”既保留称呼中的温和，也体现双方身份的不对等。
- source_word: μνήσθητι
  choice: 你要记得
  rationale: 准确表达命令对方回想的含义，也是现代汉语中自然直接的说法。
- source_word: ἀπέλαβες
  choice: 得了
  rationale: 原词可指领受所得，也可能含有完全领受的意味；正文采用宽泛自然的“得了”，较强的可能含义收入脚注。
- source_word: τὰ ἀγαθά σου
  choice: 属于你的种种好处
  rationale: 保留所有格和复数所表达的广泛有利、愉悦之事，避免用“祝福”增添更明确的神学色彩。
- source_word: ἐν τῇ ζωῇ σου
  choice: 你一生中
  rationale: 自然表达事情发生在其生前生活期间的时间范围。
- source_word: ὁμοίως τὰ κακά
  choice: 也同样得了种种苦楚
  rationale: 维持与前半句的平行对照；“苦楚”表明这里指拉撒路所遭受的不幸，而非他所行的道德恶事。
- source_word: παρακαλεῖται
  choice: 得安慰
  rationale: 在此处境逆转的上下文中，这个被动形式表示领受安慰；“得安慰”简洁、自然。
- source_word: ὧδε
  choice: 在这里
  rationale: 保留指向叙事现场所在之处的方位副词。
- source_word: ὀδυνᾶσαι
  choice: 痛苦不堪
  rationale: 表达原词所指的强烈痛苦或悲痛，同时不把正文限定为某一种施加折磨的方式。
theological_decisions:
- issue: 死后受苦用语的表达
  choice: 你却痛苦不堪
  alternative: 你却受折磨
  rationale: 经文明确描写死后的切身痛苦，但原词本身可表示剧痛或极度悲痛；“痛苦不堪”保留这一事实及词义范围，不额外断定痛苦的具体施加方式。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“孩子啊”保留呼语的温和语气；“种种好处／种种苦楚”形成清楚的平行对照。脚注标记均紧随其所解释的词语。
