revisions:
- from: 亚伯拉罕却说：“孩子啊，你要记得，你一生中得了属于你的种种好处[a]，拉撒路也同样得了种种苦楚；但如今他在这里得安慰，你却痛苦不堪[b]。”
  to: 亚伯拉罕却说：“孩子啊，你要记得，你一生中享了种种好处[a]，拉撒路也同样经历了种种苦楚；但如今他在这里得安慰，你却痛苦不堪[b]。”
  rationale: 将前半句调整为更自然的现代汉语，并避免“属于你的”可能引起的所有权联想。“享了种种好处”对应生前领受有利、愉悦之事；“经历了种种苦楚”自然表达拉撒路所遭遇的不幸。其余措辞及脚注均保留原稿对原文词义范围和叙事张力的谨慎处理。
