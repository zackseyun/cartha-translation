  text: Ἄνθρωπος δέ τις ἦν πλούσιος, καὶ ἐνεδιδύσκετο πορφύραν καὶ βύσσον εὐφραινόμενος καθ’ ἡμέραν λαμπρῶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/019.yaml
  text: There was a certain rich man[a], and he used to dress in purple and fine linen, feasting splendidly every day.
translation:
  language: zh_hans
  text: 有一个财主，常穿紫色衣服和细麻布衣服，天天奢华宴乐。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “奢华宴乐”也可译作“每天都显赫地享乐”。εὐφραινόμενος可表示欢庆、享乐或欢宴，λαμπρῶς则可强调华美、显赫和奢侈。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνθρωπος δέ τις
  choice: 有一个……人
  rationale: ἄνθρωπος与不定代词τις引入一位未具名的人物；δέ在这里起叙事衔接作用。现代汉语用“有一个”自然地开启叙述，不另加带时间含义的“现在”。
- source_word: πλούσιος
  choice: 财主
  rationale: 该词指物质上富有的人。“财主”简洁自然，也符合此类叙事语境。
- source_word: ἐνεδιδύσκετο
  choice: 常穿
  rationale: 未完成时态在此表示过去经常、惯常发生的动作；“常穿”准确传达这一习惯性含义。
- source_word: πορφύραν
  choice: 紫色衣服
  rationale: πορφύρα在这里以染料或布料代指紫色衣物；明说“衣服”可使现代读者立即明白，同时保留其奢华的文化意涵。
- source_word: βύσσον
  choice: 细麻布衣服
  rationale: βύσσος指优质细麻布；补出“衣服”与前面的穿着动作自然衔接。
- source_word: εὐφραινόμενος
  choice: 宴乐
  rationale: 该分词可指欢庆、享乐，也可在语境中包含设宴欢宴。结合财主奢华生活的描写，“宴乐”既保留欢乐享受之意，也自然涵盖饮宴。
- source_word: καθ’ ἡμέραν
  choice: 天天
  rationale: 这是表示每日反复发生的惯用语；“天天”清楚而自然。
- source_word: λαμπρῶς
  choice: 奢华
  rationale: 该副词表示光彩、显赫或华美；在富人穿戴与享乐的语境中，“奢华”准确表达豪华铺张的生活方式。
