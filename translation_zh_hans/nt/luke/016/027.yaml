  text: εἶπεν δέ· Ἐρωτῶ ⸂σε οὖν⸃, πάτερ, ἵνα πέμψῃς αὐτὸν εἰς τὸν οἶκον τοῦ πατρός μου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/027.yaml
  text: Then he said[a], ‘I ask you then, father, that you send him to my father’s house,’
translation:
  language: zh_hans
  text: 他又说：“父亲，我求你[a]，那么请你派他到我父亲家里去，”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我恳求你”。希腊语动词可表达恳切的请求，但其基本意思是“求、请求”。
    reason: 词义上存在语气强度不同的合理译法。
lexical_decisions:
- source_word: εἶπεν δέ
  choice: 他又说
  rationale: δέ是推进叙事的轻微连接词；“又”在现代汉语中自然承接上文，又不赋予过强的转折意味。
- source_word: Ἐρωτῶ
  choice: 我求你
  rationale: ἐρωτάω的基本义是询问或请求；此处是在遭拒之后提出郑重请求，“求你”既保留请求之义，也符合语境，但不强化为哀求。
- source_word: σε οὖν
  choice: 那么……你
  rationale: οὖν承接前文的拒绝，引出下一步请求；“那么”自然表达这种推衍和延续关系。宾语σε按汉语语序置于“求”后。
- source_word: πάτερ
  choice: 父亲
  rationale: 这是对亚伯拉罕的称呼，保留亲属祖先称谓；不改作神的称号，也不增译为“祖宗”而缩窄原词的表达。
- source_word: ἵνα πέμψῃς
  choice: 差他
  rationale: ἵνα加虚拟式在请求动词之后表达请求的内容。“差”简洁、庄重，并清楚表达派遣某人前往。
- source_word: αὐτὸν
  choice: 他
  rationale: 该代词承接上文的拉撒路；按原文保留代词，不在本节明说其姓名。
- source_word: εἰς τὸν οἶκον τοῦ πατρός μου
  choice: 到我父亲家里去
  rationale: εἰς表达目的地，οἶκος在此指家或家庭所在之处；此译符合现代汉语方向表达，并保留“我父亲”这一原文措辞。
theological_decisions:
- issue: 比喻中呼格πάτερ所指
  choice: 父亲
  alternative: 祖宗；父啊
  rationale: 说话者是在称呼亚伯拉罕，语境体现祖先关系，并非直接称呼上帝。“父亲”最直接保留原词；不用可能被理解为神圣称号的格式，也不以“祖宗”替原文作解释性限定。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“他又说”与“那么”分别呈现δέ和οὖν的篇章衔接作用。保留本节在句法上尚未完结的结尾逗号，以衔接下一节的请求内容。
