base_translation:
  language: en
  yaml_path: translation/nt/luke/016/007.yaml
  text: Then he said to another[a], ‘And you, how much do you owe?’ He said, ‘A hundred cors of wheat.’ He says to him[b], ‘Take your bill and write eighty.’
translation:
  language: zh_hans
  text: 接着，他对另一个人说：“你呢，欠多少？”那人说：“一百科珥[a]小麦。”他对他说：“拿你的借据[b]，写上八十。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “科珥”是古代计量谷物的大容量单位。
    reason: cultural_note
  - marker: b
    text: 或译“债务文书”“账据”；希腊文直译为“你的文书”，这里指记载债务的字据。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπειτα
  choice: 接着
  rationale: 表示叙事顺序，引出下一位欠债人；“接着”自然简洁。
- source_word: ἑτέρῳ
  choice: 另一个人
  rationale: 指与前一位不同的另一人；补出“人”符合现代汉语表达，但不添加性别信息。
- source_word: Σὺ δὲ
  choice: 你呢
  rationale: 保留人称代词的强调和δέ所表达的轻微转折、话题转换。
- source_word: πόσον ὀφείλεις
  choice: 欠多少
  rationale: ὀφείλω在此指债务；译法口语自然，并准确表达询问所欠数额。
- source_word: Ἑκατὸν κόρους σίτου
  choice: 一百科珥小麦
  rationale: κόρος是特定的古代谷物容量单位，以音译“科珥”保存其历史特征，并用脚注说明。
- source_word: λέγει αὐτῷ
  choice: 他对他说
  rationale: 希腊文用历史现在时增强叙事现场感；现代汉语动词本身不强制标记时态，此译既贴近形式又自然。
- source_word: Δέξαι
  choice: 拿
  rationale: 在文书场景中指拿取、接过该债务文件；“拿”是自然直接的命令。
- source_word: σου τὰ γράμματα
  choice: 你的借据
  rationale: γράμματα字面为“文书、字据”，在债务语境中指记录欠款的文件；“借据”清楚传达其实际功能，脚注保留较宽的词义。
- source_word: γράψον ὀγδοήκοντα
  choice: 写上八十
  rationale: 保留更改文书所载数额的动作；“写上”比单说“写”更符合现代汉语。
