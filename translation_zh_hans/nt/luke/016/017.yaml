id: LUK.16.17
reference: Luke 16:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Εὐκοπώτερον δέ ἐστιν τὸν οὐρανὸν καὶ τὴν γῆν παρελθεῖν ἢ τοῦ νόμου μίαν κεραίαν πεσεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/017.yaml
  text: But it is easier for heaven and earth to pass away than for one stroke of a letter of the Law to fall[a].
translation:
  language: zh_hans
  text: 然而，天地消逝，比律法的一小笔画失落还容易。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“律法的一小笔画掉落”；指字母上用来区别字形的极细小笔画。
    reason: 说明κεραία的书写意象，并保留πεσεῖν“落下／失落”的较字面表达。
lexical_decisions:
- source_word: Εὐκοπώτερον
  choice: 还容易
  rationale: 这是比较级，表示两件事相比之下前者更容易发生；“还容易”自然地呈现汉语比较结构。
- source_word: δέ
  choice: 然而
  rationale: 在上下文中带有温和的转折意味；“然而”既保留对比，也符合庄重而现代的行文。
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν
  choice: 天地
  rationale: 这是涵盖受造秩序的固定组合；“天地”是现代汉语中自然、凝练且具有圣经语体的对应表达。
- source_word: παρελθεῖν
  choice: 消逝
  rationale: 此处指天地不再存留，而非从旁经过；“消逝”准确表达其在此语境中的意义。
- source_word: τοῦ νόμου
  choice: 律法
  rationale: 语境指向犹太圣经中的律法，而非一般意义上的法律；“律法”在中文圣经语境中能清楚标示这一所指。
- source_word: μίαν κεραίαν
  choice: 一小笔画
  rationale: κεραία指字母上极小的尖角或笔画。“一小笔画”让现代读者容易理解，同时保留书写细节的意象。
- source_word: πεσεῖν
  choice: 落空
  rationale: 原词字面为“落下”，在这里指律法最细微之处失效或落掉。“落空”保留“落”的形象，也自然表达不能实现、归于无效的语境含义。
theological_decisions:
- issue: νόμος的所指
  choice: 译为“律法”，指圣经中的律法
  alternative: 译作泛指的“法律”或“法则”
  rationale: 紧邻语境及“天地”与律法细节的对比，都表明这里谈的是上帝所启示的律法；译文只标示其所指，不进一步界定这里所说的持久性如何落实。
- issue: κεραία的具体含义
  choice: 译为“一小笔画”
  alternative: 译为“一点”“一撇”或音译式传统术语
  rationale: 经文强调律法中连最细微的书写特征也不会失效。“一小笔画”兼顾准确性和现代可懂度，同时脚注说明其可能是区别字母的细小笔画。
- issue: πεσεῖν的语义张力
  choice: 译为“落空”
  alternative: 直译“落下”或意译“失效”
  rationale: “落空”既呼应原文“落下”的意象，又传达从律法中失落、不能成立或失效的语境含义，避免只选定其中一种解释。
translation_notes:
  register: 采用现代、凝练而庄重的普通话。“天地”保留圣经惯用表达；“律法”明确经文所指；整体句式按汉语习惯调整比较结构，同时保留原文关于“落下／失效”的意象张力。
