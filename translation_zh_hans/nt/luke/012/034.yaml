  text: ὅπου γάρ ἐστιν ὁ θησαυρὸς ὑμῶν, ἐκεῖ καὶ ἡ καρδία ὑμῶν ἔσται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/034.yaml
  text: For where your treasure is[a], there your heart will be also.
translation:
  language: zh_hans
  text: 因为你们的财宝在哪里，你们的心也会在那里。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为无论你们的财宝在哪里，你们的心也会在那里。”
    reason: 词义替代：ὅπου 可按概括性语气译作“无论在哪里”。
lexical_decisions:
- source_word: ὅπου
  choice: 在哪里
  rationale: 与后面的“在那里”构成自然的对应结构，准确表达地点关系；“无论在哪里”虽可成立，但语气略有扩展。
- source_word: γάρ
  choice: 因为
  rationale: 保留本句对上文劝勉的解释作用，现代汉语中清楚自然。
- source_word: θησαυρός
  choice: 财宝
  rationale: 直接保留财富语境及其比喻意味，也与前文积攒财宝的表述衔接。
- source_word: καρδία
  choice: 心
  rationale: 保留圣经中指人的愿望、情感和内在取向之中心的宽广含义，不缩窄为“欲望”或“思想”。
- source_word: ἐκεῖ
  choice: 在那里
  rationale: 保留希腊文“在哪里……在那里……”的关联结构。
- source_word: καὶ
  choice: 也
  rationale: 表达附加和伴随的强调：人的心随其财宝所在。
- source_word: ἔσται
  choice: 会在
  rationale: 保留希腊文未来时，可同时传达将来的结果和格言式的确定性。
- source_word: ὑμῶν
  choice: 你们的
  rationale: 明确体现第二人称复数；两处均保持一致。
theological_decisions:
- issue: “心”的人论含义
  choice: 保留“心”，指人的情感、意愿和委身所集中的内在中心。
  alternative: 解释性译为“欲望”“心思”或“内心的关注”。
  rationale: 原文用语含义宽广；保留“心”可维持其文学和神学张力，避免将其限定为单一心理功能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“因为”承接上文，以“在哪里……在哪里”保存原文的对应结构；“会在”明确呈现未来时，同时符合汉语格言表达。
