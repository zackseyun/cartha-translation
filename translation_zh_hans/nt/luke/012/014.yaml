  text: ὁ δὲ εἶπεν αὐτῷ· Ἄνθρωπε, τίς με κατέστησεν ⸀κριτὴν ἢ μεριστὴν ἐφ’ ὑμᾶς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/014.yaml
  text: But he said to him, “Man, who appointed me a judge or divider over you?”
translation:
  language: zh_hans
  text: 他却对那人说：“你这个人，谁立我作你们的审判官或分配者呢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄνθρωπε
  choice: 这位朋友
  rationale: 这是对成年男子的直接称呼；现代汉语若直译为“人哪”显得生硬。“这位朋友”保留直接称呼的语气，又不额外引入亲密关系。脚注注明其字面形式。
- source_word: κατέστησεν
  choice: 立……作
  rationale: 表达任命、设立某人担任职分，既准确又符合庄重自然的现代汉语。
- source_word: κριτὴν
  choice: 审判官
  rationale: 保留司法裁断者这一基本含义，不缩窄为仅处理遗产纠纷的仲裁者。
- source_word: μεριστὴν
  choice: 分配人
  rationale: 直陈负责划分、分配之人的含义，并与“审判官”并列；不把上下文所暗示的“遗产”直接写入正文，以免增加原文未明说的成分。
- source_word: ὑμᾶς
  choice: 你们
  rationale: 保留希腊文第二人称复数，表明耶稣所说的不只是面前这一人，也涉及纠纷中的其他人。
theological_decisions:
- issue: 耶稣的问题是否表示他绝不具有审判权
  choice: 保留反问句，只陈述无人任命他处理这场具体纠纷
  alternative: 改写为“我不负责审判或分配你们的财产”
  rationale: 原文提出的是“谁立我作……”，并未在本句中系统否定耶稣的审判身份；直译可保留这层神学张力，避免作超出经文的推论。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“他却对那人说”清楚呈现转折和受话者；问句保持原文的直接反问语气。
