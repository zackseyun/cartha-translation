id: LUK.12.43
reference: Luke 12:43
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: μακάριος ὁ δοῦλος ἐκεῖνος, ὃν ἐλθὼν ὁ κύριος αὐτοῦ εὑρήσει ποιοῦντα οὕτως·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/043.yaml
  text: Blessed is that servant whom his master[a], when he comes, will find doing thus.
translation:
  language: zh_hans
  text: 主人[a]回来时，看见那仆人这样做，那仆人就有福了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“主”。希腊语 κύριος 在这个家庭比喻中可指“主人”，从比喻更广的应用来看也可指“主”。
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριος
  choice: 有福
  rationale: 保留祝福宣告的宗教与经文语气，不缩减为主观的“快乐”或处境性的“幸运”.
- source_word: δοῦλος
  choice: 仆人
  rationale: 符合家主管理家务的比喻场景，也体现其受主人权柄支配、承担职分的一面；此处不必用较生硬且突出法律身份的“奴隶”.
- source_word: ἐκεῖνος
  choice: 那
  rationale: 保留指示词的特指和强调作用，指向前文所说的那个仆人.
- source_word: κύριος
  choice: 主人
  rationale: 在比喻表层的家庭场景中，表示仆人的主人；现代汉语“主人”自然体现双方关系，同时脚注保留“大写语义上的主”的可能共鸣.
- source_word: ἐλθὼν
  choice: 回来时
  rationale: 按语境将不定过去时分词自然译作时间从句；主人先前离开而后到来，汉语用“回来”比单说“来”更清楚.
- source_word: εὑρήσει
  choice: 看见
  rationale: 此处 εὑρίσκω 表示主人到来时发现仆人正处于某种行动中；“看见”在现代汉语叙事中自然，并与后接动作搭配顺畅.
- source_word: ποιοῦντα οὕτως
  choice: 这样做
  rationale: 简洁回指前文所述忠心履职的行为，既准确又符合现代汉语表达.
theological_decisions:
- issue: κύριος 在主人归来的比喻中可能兼有基督论意味
  choice: 正文译作“主人”
  alternative: 译作“主”，突出对主再来的可能暗示
  rationale: 比喻的直接画面是家庭中的主人和仆人，因此正文采用“主人”；但路加上下文可能使读者联想到主的再来，故以脚注保留这一神学张力，不在正文中单方面消解.
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“有福”延续圣经祝福宣告的语体；调整语序，使时间从句与结果陈述符合汉语习惯。
