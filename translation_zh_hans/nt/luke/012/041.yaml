source:
  edition: SBLGNT
  text: Εἶπεν ⸀δὲ ὁ Πέτρος· Κύριε, πρὸς ἡμᾶς τὴν παραβολὴν ταύτην λέγεις ἢ καὶ πρὸς πάντας;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/041.yaml
  text: Then Peter said[a], “Lord, are you telling this parable to us, or also to everyone?”
translation:
  language: zh_hans
  text: 彼得说：“主啊，这个比喻是对我们说的，还是也对所有人说的？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἶπεν
  choice: 说
  rationale: 采用 λέγω 的通常意义“说”。虽然后文是问句，但可由句式和问号自然表达，无须改译为“问”。
- source_word: δὲ
  choice: 不单独译出
  rationale: δὲ 在此主要承接话语、推动叙事。现代汉语直接以“彼得说”转接更自然，其篇章功能仍由上下文体现。
- source_word: Κύριε
  choice: 主啊
  rationale: κύριος 在彼得直接称呼耶稣时译为“主”，既保留尊称，也不削弱可能的基督论意味；“啊”符合现代汉语呼语习惯。
- source_word: πρὸς ἡμᾶς
  choice: 对我们说的
  rationale: πρός 加宾格与 λέγεις 连用，表示话语所指向的对象；“对我们说”准确且自然。
- source_word: τὴν παραβολὴν ταύτην
  choice: 这个比喻
  rationale: παραβολή 在对观福音中通常指耶稣的比喻性教导，译为“比喻”可保持术语和文学上的连贯。
- source_word: λέγεις
  choice: 你说……是……说的
  rationale: 希腊语现在时在直接问句中指耶稣正在讲说的内容。汉语用“你说这个比喻，是对……说的”自然表达其当下所指。
- source_word: ἢ καὶ
  choice: 还是也
  rationale: “还是”表达选择疑问，“也”保留 καί 的附加意味，即不只对“我们”，也对更广泛的人。
- source_word: πρὸς πάντας
  choice: 对所有人说的
  rationale: πάντας 虽为阳性复数，但此处作泛指，与“我们”相对，指更广泛的听众；“所有人”准确传达其包容范围。
theological_decisions:
- issue: 彼得称呼耶稣所用 κύριος 的译法
  choice: 主
  alternative: 主人；老师
  rationale: “主”保留该称谓的尊敬含义及其可能具有的基督论余韵，同时不在本节中将其含义过度限定。
- issue: πάντας 的泛指范围
  choice: 所有人
  alternative: 众人；所有的人
  rationale: 原文阳性复数在这里是泛指，与“我们”形成对照，并非仅指男性；“所有人”自然且忠实。
translation_notes:
  register: 采用现代、庄重而口语自然的简体中文。保留彼得问题中“我们”与“所有人”的对照，以及 ἢ καὶ 所表达的“不只是我们、也包括更广泛听众”的张力。
