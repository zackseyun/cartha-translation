  text: τίς δὲ ἐξ ὑμῶν μεριμνῶν δύναται ⸂ἐπὶ τὴν ἡλικίαν αὐτοῦ προσθεῖναι⸃ ⸀πῆχυν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/025.yaml
  text: And which of you, by worrying, is able to add a cubit to his lifespan?
translation:
  language: zh_hans
  text: 你们中间谁能凭着忧虑，给自己的寿命增加一肘呢？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文“寿命”也可译作“身量”；“肘”是古代长度单位，约为从肘部到指尖的距离。
    reason: 保留ἡλικία可指寿命／年龄或身量的词义歧义，并说明πῆχυς的长度单位含义。
lexical_decisions:
- source_word: μεριμνῶν
  choice: 靠忧虑
  rationale: 表达分词的手段意味，即“借着忧虑、因为忧虑而做到”；“忧虑”符合上下文，也保持庄重自然。
- source_word: ἡλικίαν
  choice: 寿数
  rationale: ἡλικία可指年龄、寿命或身量。与“增加一肘”连用时可能形成以长度衡量寿命的修辞；结合本段对生命和忧虑的讨论，正文采用“寿数”，同时用脚注保留“身量”的可能。
- source_word: πῆχυν
  choice: 一肘
  rationale: 直译古代长度单位“肘”，约为从肘部到指尖的距离。保留原文用长度单位描述增加寿数或身量的鲜明修辞。
- source_word: προσθεῖναι
  choice: 增加
  rationale: 准确表达“加上、增添”，并与“一肘”自然搭配。
- source_word: δύναται
  choice: 能
  rationale: 直接体现能力或可能性，符合反问语气。
theological_decisions:
- issue: ἡλικίαν究竟指寿命还是身量
  choice: 正文译作“寿数”，脚注注明“身量”这一可能
  alternative: “身量”或“年龄”
  rationale: 上下文聚焦生命及忧虑不能延长生命，而πῆχυς又使“身量”在词义上成为真实可能。采用“寿数”最符合语境，但不把原文的词义歧义静默消除。
translation_notes:
  register: 采用现代、简洁而庄重的反问句。“靠忧虑”比“通过忧虑”更符合普通话习惯；保留“一肘”而不改写成抽象的“一点”，以保存原文意象。
