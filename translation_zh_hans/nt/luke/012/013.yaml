  text: Εἶπεν δέ τις ⸂ἐκ τοῦ ὄχλου αὐτῷ⸃· Διδάσκαλε, εἰπὲ τῷ ἀδελφῷ μου μερίσασθαι μετ’ ἐμοῦ τὴν κληρονομίαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/013.yaml
  text: Then someone from the crowd said to him[a], “Teacher, tell my brother to divide the inheritance with me.”
translation:
  language: zh_hans
  text: 人群中有一个人对他说：“老师，请叫我兄弟和我分遗产。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把遗产分一份给我。”
    reason: μερίσασθαι μετ’ ἐμοῦ可直指与说话人共同分割遗产，也可按语境理解为给说话人分出一份。
lexical_decisions:
- source_word: Εἶπεν δέ
  choice: 有一个人对他说
  rationale: δέ是轻微的叙事连接词；汉语在此不必另译“于是”或“又”，省略后行文更自然，也不增添明显的时间或转折意味。
- source_word: τις ἐκ τοῦ ὄχλου
  choice: 人群中有一个人
  rationale: 准确表达某个身份未明的人来自人群之中，符合现代汉语叙事习惯。
- source_word: Διδάσκαλε
  choice: 老师
  rationale: 保留对教导者的普通称呼，不额外赋予“主”或“师尊”等更强的权威色彩。
- source_word: εἰπὲ τῷ ἀδελφῷ μου
  choice: 请吩咐我的兄弟
  rationale: εἰπέ字面为“对……说”，但后接不定式时表示让对方去做某事；“请吩咐”自然体现说话人请求耶稣出面要求其兄弟行动，同时避免译成更强硬的“命令”。
- source_word: μερίσασθαι
  choice: 分
  rationale: 此处指把继承所得的产业划分或分配；简洁的“分”符合家庭遗产语境，并保留具体分法未明。
- source_word: μετ’ ἐμοῦ τὴν κληρονομίαν
  choice: 跟我分遗产
  rationale: “跟我”形式上贴近μετά所表达的共同参与关系；“遗产”准确涵盖所继承的财物，不将其限缩为整座产业或某一法定份额。
theological_decisions: []
translation_notes:
