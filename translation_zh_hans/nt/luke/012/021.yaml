  text: οὕτως ὁ θησαυρίζων ⸀ἑαυτῷ καὶ μὴ εἰς θεὸν πλουτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/021.yaml
  text: So is the one who stores up treasure for himself and is not rich toward God[a].
translation:
  language: zh_hans
  text: 为自己积攒财宝、在神面前却不富足的人，也是这样[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为自己积攒财宝、却不向神富足的人，也是这样。”
    reason: εἰς θεόν与πλουτῶν连用可表达对神的关系或方向；主文采用更自然的汉语表达“在神面前”。
lexical_decisions:
- source_word: οὕτως
  choice: 也是这样
  rationale: 承接前面的比喻，把其中那人的结局应用于这一类人；置于句末符合现代汉语表达习惯。
- source_word: ὁ θησαυρίζων
  choice: 那……积攒财宝的人
  rationale: 带冠词的现在分词泛指以这种行为为特征的人；“积攒财宝”保留了囤积财富及与“财宝”的词义联系。
- source_word: ἑαυτῷ
  choice: 为自己
  rationale: 直接表达反身代词与格所含的自身受益之意，保留行为以自我为中心的重点。
- source_word: καὶ μὴ
  choice: 却不
  rationale: 希腊文用“和／并且不”连接两个分词；汉语用“却不”自然呈现语义上的对照，而不改变两者的并列关系。
- source_word: εἰς θεὸν
  choice: 向神
  rationale: 保留εἰς的方向性和关系性，不把含义限定为“为神”或仅指神的评价。由于“向神富足”在汉语中略显凝练，脚注列出“在神面前”的可能译法。
- source_word: πλουτῶν
  choice: 富足
  rationale: 表达“处于富有、丰盛的状态”，并与前半句积攒物质财宝形成对照。
theological_decisions:
- issue: “向神富足”的含义
  choice: 保留关系性表达“向神富足”
  alternative: 在神面前富足；在神所看重的事上富足
  rationale: 原文没有在本节中具体界定这种“富足”，因此不扩译成某一种善行、属灵品质或神学解释，以保留原文的开放性和张力。
- issue: 道德格言中的阳性单数表达
  choice: 译作泛指的“人”
  alternative: 那男人；那个人
  rationale: 希腊文阳性单数分词在此指具有该行为特征的代表性人物，并非限定男性；现代汉语“人”自然保留单数泛指功能，也没有不必要地加入性别限定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“向神富足”刻意保留原文较不寻常且富有神学张力的搭配；句末“也是这样”承接上文比喻，呈现简洁的警语语气。
