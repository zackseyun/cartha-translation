  text: ταῦτα γὰρ πάντα τὰ ἔθνη τοῦ κόσμου ⸀ἐπιζητοῦσιν, ὑμῶν δὲ ὁ πατὴρ οἶδεν ὅτι χρῄζετε τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/030.yaml
  text: For all these things the nations of the world seek[a], but your Father knows that you need these things.
translation:
  language: zh_hans
  text: 因为世上的万民都在追求这一切[a]，但你们的父亲知道你们需要这些。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“世上的外邦人。”希腊语ἔθνη既可指“万民、各国”，也可指“外邦人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα γὰρ πάντα
  choice: 因为……这一切
  rationale: ταῦτα πάντα承接上文所说的饮食等生活所需；译作“这一切”简洁自然，并保留γάρ所表达的因果衔接。
- source_word: τὰ ἔθνη τοῦ κόσμου
  choice: 世上的万民
  rationale: ἔθνη既可指“万民、各国”，也可在犹太语境中指“外邦人”。正文采用较宽泛且贴近字面的“万民”，并用脚注保留另一可能。
- source_word: ἐπιζητοῦσιν
  choice: 都在追求
  rationale: ἐπιζητέω表达积极寻求、追逐；“追求”比单纯的“寻找”更能体现其力度，现代汉语也自然。
- source_word: ὑμῶν δὲ ὁ πατήρ
  choice: 但你们的父
  rationale: 忠实保留原文的转折和“你们的父”这一关系性称呼，不从平行经文增添“天父”。
- source_word: οἶδεν
  choice: 知道
  rationale: οἶδα虽为完成时形态，但在此具有现在时意义，“知道”准确自然。
- source_word: χρῄζετε τούτων
  choice: 你们需要这些
  rationale: 直截了当地表达“有这些需要”，并重复指示语“这些”，保留原文与前半句的呼应。
theological_decisions:
- issue: 世人追求与门徒对父的信靠之间的对照
  choice: 保留“世上的万民”与“你们的父”的直接对照，不作解释性扩充。
  alternative: 将ἔθνη明确译为“外邦人”，或将“父”扩为“天父”。
  rationale: 原文以世上万民的追求对照门徒与父的关系；宽泛译法保留其张力，同时不把含义限定为族群身份，也不引入本节没有的修饰语。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“追求”传达积极寻求生活所需的意味；“你们的父”刻意不增译“天上的”，以紧贴本节原文。
