id: LUK.12.26
reference: Luke 12:26
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἰ οὖν ⸀οὐδὲ ἐλάχιστον δύνασθε, τί περὶ τῶν λοιπῶν μεριμνᾶτε;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/026.yaml
  text: If[a], then, you are not able to do even the smallest thing, why are you anxious about the rest?
translation:
  language: zh_hans
  text: 所以，你们若连最小的事也做不到，为什么还为其余的事[a]忧虑呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “其余的事”或译“别的事”。
    reason: λοιπῶν既可强调剩余之事，也可较宽泛地指其他事情。
lexical_decisions:
- source_word: εἰ οὖν
  choice: 所以，你们若
  rationale: 保留εἰ的条件意味和οὖν承接上文的推论意味；按现代汉语习惯将“所以”置于句首。
- source_word: οὐδὲ ἐλάχιστον
  choice: 连最小的事也
  rationale: ἐλάχιστον是中性单数、作名词使用，意为“最小的事”；“连……也”自然表达οὐδέ的递进强调。
- source_word: δύνασθε
  choice: 做不到
  rationale: 表达能力上的不能，并与补出的“事”自然搭配。
- source_word: τί
  choice: 为什么
  rationale: τί在此疑问结构中询问原因，译作“为什么”符合汉语表达和反问语气。
- source_word: περὶ τῶν λοιπῶν
  choice: 为其余的事
  rationale: λοιπῶν指前述“最小的事”以外其余的事；“为……忧虑”自然呈现περί所标示的关涉对象。
- source_word: μεριμνᾶτε
  choice: 忧虑
  rationale: 保留持续挂虑、焦虑的语义，并与本段关于倚靠上帝的教导相合，同时不把一切审慎关切都说成错误。
theological_decisions:
- issue: 耶稣教导中μεριμνάω的含义
  choice: 忧虑
  alternative: 担心；挂虑
  rationale: “忧虑”准确表达本段所针对的不安与挂心，又不至于暗示耶稣禁止一切合理的关切或筹划。
translation_notes:
  register: 采用现代、庄重而通俗的汉语；以“所以……若……”保留原文的推论与条件关系，并用反问句重现耶稣论证的力度。
