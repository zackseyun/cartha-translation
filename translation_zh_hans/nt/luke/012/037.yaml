review_pass:
  verdict: approve
  source_fidelity: 译文准确传达了原文的主要句法与画面：主人归来时发现奴仆警醒；随后以庄重的强调公式宣告主人束腰、使奴仆就席，并亲自服侍他们。“仍然警醒”适切表达γρηγοροῦντας的持续醒着、警觉状态；“让他们坐席”在现代汉语中自然地表达ἀνακλινεῖ的宴席就座含义；“自己上前服侍他们”保留了παρελθὼν与διακονήσει所描绘的主人亲自来到席前服务的反转画面。
  naturalness: 整体为自然、庄重的现代标准汉语。“有福了”“我实在告诉你们”符合经文宣告语体；“主人—奴仆—坐席—服侍”的场景连贯清晰。
  terminology: “奴仆”在此明确主从家庭比喻中可接受，既保留δοῦλοι的受支配关系，也避免将叙事读成普通雇佣关系。“主人”符合本节比喻内κύριος的直接语境；不需要为了英语审计文本的“Lord”而牺牲汉语中该家庭场景的清楚度。“束上腰带”忠实保留文化意象，脚注说明充分。
