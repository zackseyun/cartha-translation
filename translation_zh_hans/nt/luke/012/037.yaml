id: LUK.12.37
reference: Luke 12:37
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: μακάριοι οἱ δοῦλοι ἐκεῖνοι, οὓς ἐλθὼν ὁ κύριος εὑρήσει γρηγοροῦντας· ἀμὴν λέγω ὑμῖν ὅτι περιζώσεται καὶ ἀνακλινεῖ αὐτοὺς καὶ παρελθὼν διακονήσει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/037.yaml
  text: Blessed are those slaves whom the Lord[a], when he comes, will find staying awake. Truly I say to you, he will dress himself for service and have them recline at the table[c][b], and he will come and serve them.
translation:
  language: zh_hans
  text: 主人来时，看见那些奴仆仍然警醒，那些奴仆就有福了！我实在告诉你们，主人必束上腰带[a]，让他们坐席，自己上前服侍他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “束上腰带”指把长衣束紧，预备行动或服侍。
    reason: cultural_note
lexical_decisions:
- source_word: μακάριοι
  choice: 有福了
  rationale: 沿用庄重而自然的祝福宣告用语，既不缩减为主观的“快乐”，也不只表达境遇上的“幸运”。
- source_word: δοῦλοι
  choice: 奴仆
  rationale: 此处主仆家庭关系明确；“奴仆”保留受主人支配的身份含义，同时比现代汉语“奴隶”更适合比喻叙事的庄重语体。
- source_word: κύριος
  choice: 主人
  rationale: 当前句直接描写家庭中主人归来并服侍奴仆的反常场景；译作“主人”清楚呈现比喻内的角色，同时不妨碍读者体会更深层的主基督意蕴。
- source_word: γρηγοροῦντας
  choice: 仍然警醒
  rationale: 兼顾持续未睡与保持戒备、预备妥当两层含义；“仍然”体现主人来到时所发现的持续状态。
- source_word: ἀμὴν λέγω ὑμῖν
  choice: 我实在告诉你们
  rationale: 以现代汉语中庄重而通行的形式保留这一强调公式。
- source_word: περιζώσεται
  choice: 束上腰带
  rationale: 保留原文束紧衣服、准备行动与服侍的具体文化图像，并以脚注说明其功能。
- source_word: ἀνακλινεῖ αὐτούς
  choice: 让他们坐席
  rationale: 表达使人就席用餐的含义；汉语“坐席”自然传达宴席场景，不必机械复制古代侧卧进餐的姿势。
- source_word: παρελθὼν
  choice: 自己上前
  rationale: 在席间服侍的语境中表示主人走近、来到他们身边；“自己”突出主人亲自行动，但未改变句法主体。
- source_word: διακονήσει αὐτοῖς
  choice: 服侍他们
  rationale: 准确表达此处实际、尤其是席间的服务，避免“事奉”可能带来的单向宗教含义。
theological_decisions:
- issue: κύριος在比喻角色与基督论回响之间的译法
  choice: 主人
  alternative: 主
  rationale: 就眼前叙事而言，κύριος是奴仆所属家庭的主人；译作“主人”最自然清楚。该词及主人亲自服侍的行动仍可产生指向耶稣的回响，无须在译文中先行消除比喻角色与神学指向之间的张力。
- issue: δοῦλος所表达的身份关系
  choice: 奴仆
  alternative: 奴隶；仆人
  rationale: “仆人”容易弱化所属与受支配关系，“奴隶”在现代汉语中又可能过度唤起近现代种族奴役制度；“奴仆”较平衡地保留古代家庭中的非自由身份及本段庄重语气。
- issue: 主人服侍奴仆的末世性反转
  choice: 直译为主人束腰、使其坐席并亲自服侍
  alternative: 将其解释性改写为奖赏忠仆
  rationale: 原文以惊人的角色倒置表达应许，译文保留这一张力，不把其神学意义缩减成抽象的“奖赏”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“有福了”“我实在告诉你们”保留经文宣告的庄严感；“主人”“奴仆”“坐席”“服侍”构成清楚一致的家庭宴席场景。脚注标记[a]已置于对应正文之后。
