  text: καὶ διελογίζετο ἐν ⸀ἑαυτῷ λέγων· Τί ποιήσω, ὅτι οὐκ ἔχω ποῦ συνάξω τοὺς καρπούς μου;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/017.yaml
  text: And he reasoned within himself[a], saying, ‘What will I do[b], since I have nowhere to gather my crops?’
translation:
  language: zh_hans
  text: 他心里盘算说：“我该怎么办呢？因为我没有地方收存我的收成。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διελογίζετο
  choice: 盘算
  rationale: 未完成时和中间语态描写持续的内心思量；“盘算”既体现反复思考，也符合此处为财物筹划的语境。
- source_word: ἐν ἑαυτῷ
  choice: 心里
  rationale: 明确表示这是内心的思量，而不是向别人说话；现代汉语自然简洁。
- source_word: λέγων
  choice: 说
  rationale: 引出内心话的具体内容；与“心里盘算”连用时，读者自然理解为自言自语式的内在言说。
- source_word: Τί ποιήσω
  choice: 我该怎么办呢
  rationale: 准确表达商议性虚拟语气所带的自问意味；“该怎么办”比直译为“要做什么”更符合现代汉语。
- source_word: ὅτι
  choice: 因为
  rationale: 在这里引出他提出问题的原因，因果关系明确自然。
- source_word: οὐκ ἔχω ποῦ
  choice: 我没有地方
  rationale: 按希腊语习惯表达“没有可供……的地方”，译法自然且不增添原文信息。
- source_word: συνάξω
  choice: 收存
  rationale: 原词基本义为聚集、收拢；在农产物和仓储语境中，“收存”既保留收聚之意，也自然表达存放用途。
- source_word: τοὺς καρπούς μου
  choice: 我的收成
  rationale: καρποί在此指土地的农产所得；“收成”比字面的“果子”更准确，也比“作物”更能涵盖已经收获的产物。
