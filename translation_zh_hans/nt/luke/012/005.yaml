  rationale: 修订以希腊文为先：保留ὑποδείξω、φοβηθῆτε／φοβήθητε的“指示／怕”及重复强调；以“杀人以后”表达μετὰ τὸ ἀποκτεῖναι的时间关系；以“有权柄”表达ἔχοντα ἐξουσίαν；以“投进”表达ἐμβαλεῖν εἰς而不补出未明说的受事；以“革亨拿”保留γέεννα，并在脚注给出“地狱”及欣嫩谷意象。末句“要怕的正是他”保留τοῦτον的强调，且不擅自点明其身份。
