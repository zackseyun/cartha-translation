  naturalness: “但我要指示你们该怕谁”及重复的“怕”自然、庄重。“那杀了以后还有权把人扔进……”略显悬空，且“把人”造成不必要的补足。改为“那杀人以后有权投进……”更顺畅，并保留原文的概括性。
  terminology: 建议正文音译γέεννα为“革亨拿”，脚注说明其与欣嫩谷意象的历史关联，并保留“地狱”为可选译法。这样既不将该词直接化约为后世术语，也不误将审判术语译成其意象来源的地名。ἐξουσία译“权柄”比“有权”更贴近其权威／权限含义，且适合本节庄重语域。
