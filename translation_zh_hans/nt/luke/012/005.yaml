id: LUK.12.5
reference: Luke 12:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὑποδείξω δὲ ὑμῖν τίνα φοβηθῆτε· φοβήθητε τὸν μετὰ τὸ ἀποκτεῖναι ⸂ἔχοντα ἐξουσίαν⸃ ἐμβαλεῖν εἰς τὴν γέενναν· ναί, λέγω ὑμῖν, τοῦτον φοβήθητε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/005.yaml
  text: 'But I will show you whom to fear: fear the one who[a], after killing, has authority to throw into Gehenna. Yes, I tell you, fear this one.'
translation:
  language: zh_hans
  text: 但我要指示你们该怕谁：要怕那杀人以后有权柄投进革亨拿[a]的。是的，我告诉你们，要怕的正是他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“地狱”。原文为“革亨拿”（Gehenna），是与欣嫩谷意象相关的审判用语。
    reason: 说明γέεννα的音译、常见功能性译法及其历史意象背景，同时避免将正文直接等同为“欣嫩谷”或预先固定为后世单一概念。
lexical_decisions:
- source_word: ὑποδείξω
  choice: 我要指示
  rationale: 保留“指出、使人知道”的基本意义；“指示”庄重而清楚，不额外加入“警告”的解释色彩。
- source_word: τίνα φοβηθῆτε
  choice: 该怕谁
  rationale: 以自然的现代汉语表达间接问句，同时保留劝诫语气。
- source_word: φοβήθητε
  choice: 要怕
  rationale: 两次相关表达均保留“怕”，体现原文的重复和严肃警告；不弱化为单纯“敬畏”。
- source_word: τὸν
  choice: 那……的
  rationale: 用汉语名词化关系结构表达原文实词化冠词，不在正文中提前指明其身份。
- source_word: μετὰ τὸ ἀποκτεῖναι
  choice: 杀了以后
  rationale: 准确表达时间先后，并保留原文未明说受事对象的简洁结构。
- source_word: ἔχοντα ἐξουσίαν
  choice: 还有权
  rationale: “有权”自然地传达ἐξουσία所含的权柄或权限，而不只表示能力；“还”衔接杀死之后进一步施行审判的权柄。
- source_word: ἐμβαλεῖν εἰς
  choice: 把人扔进
  rationale: “扔进”保留动作的强烈感；补出汉语所需的泛指受事“人”，但不限定具体对象。
- source_word: γέενναν
  choice: 欣嫩谷
  rationale: 采用该审判意象所源自地名的通行汉语名称，避免在正文中直接以较后期、范围更广的“地狱”替代原词；脚注说明其语境含义。
- source_word: ναί
  choice: 是的
  rationale: 保留原文加强肯定和强调的作用，符合现代汉语表达。
- source_word: τοῦτον
  choice: 正是他
  rationale: “正是”体现指示代词的强调作用，同时以自然汉语回指前述对象。
theological_decisions:
- issue: 审判语境中γέεννα的译法
  choice: 欣嫩谷
  alternative: 地狱
  rationale: 正文保留该词与欣嫩谷意象的历史联系，不把其含义直接等同于后世较宽泛的“地狱”概念；脚注提供功能性译法及必要背景。
- issue: 应当惧怕者的身份
  choice: 不在译文中直接补明身份
  alternative: 直接译作“神”
  rationale: 原文以实词化冠词和指示代词指称该对象，虽上下文强烈指向神，却没有在本节直接使用θεός；译文保留这种指称方式，避免替原文显明未明说的信息。
- issue: φοβέομαι在本节的力度
  choice: 怕
  alternative: 敬畏
  rationale: 本节提到杀死和投入欣嫩谷，语义包含真实的惧怕；单译“敬畏”可能削弱警告力度并预先神学化。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“那……的”避免古雅的“那一位”，也不直接点明身份；“把人扔进”符合现代汉语句法并保留原文动作力度。
