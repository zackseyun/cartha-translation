  text: Τί δὲ καὶ ἀφ’ ἑαυτῶν οὐ κρίνετε τὸ δίκαιον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/057.yaml
  text: And why do you not judge for yourselves what is right?[a]
translation:
  language: zh_hans
  text: 你们为什么不自己判断什么是对的呢？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“什么是公正的”，或“正当的事”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί δὲ καὶ
  choice: 为什么……呢
  rationale: 这一粒子组合承接上文并加强反问。汉语以“为什么……呢”自然表达追问语气；上下文中的承接关系无需机械逐词译出。
- source_word: ἀφ’ ἑαυτῶν
  choice: 自己
  rationale: 这里表示凭自身作出判断或主动判断。“自己”简洁自然，也保留了不依赖外在提示而作判断的含义。
- source_word: οὐ κρίνετε
  choice: 不……判断
  rationale: κρίνω在此指评断、判明。“判断”既保留其评判意味，也符合现代汉语表达。
- source_word: τὸ δίκαιον
  choice: 什么是对的
  rationale: 中性单数形容词在此作名词性用法，意为正当、公正之事。“什么是对的”自然地保留了广泛的道德与评断含义。
theological_decisions:
- issue: τὸ δίκαιον的语义范围
  choice: 什么是对的
  alternative: 什么是公正的；该做的正当之事
  rationale: 原词可指正确、正当或公正。正文采用范围较宽且自然的“什么是对的”，避免将语义限缩为法律层面的公正；脚注保留其他可能表达。
translation_notes:
  register: 采用现代、自然而庄重的口语反问句式。“你们”明确复数听众；句末“呢”体现原文反问语气。
