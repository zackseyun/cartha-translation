  yaml_path: translation/nt/luke/012/055.yaml
  text: And when the south wind is blowing[a], you say[b], ‘There will be scorching heat,’ and it happens.
translation:
  language: zh_hans
  text: 刮南风的时候，你们就说：“天要酷热了。”果然如此。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νότον
  choice: 南风
  rationale: 该词可指“南方”或“南风”；在与“刮”搭配的气象语境中，“南风”最自然，也明确表达原文隐含的风向含义。
- source_word: πνέοντα
  choice: 刮
  rationale: 现在分词描写风正在吹；汉语通常说“刮南风”，简洁自然，并保留持续发生的气象观察。
- source_word: λέγετε
  choice: 你们就说
  rationale: 现在时在这里表达惯常反应；“就说”自然呈现看到这种气象现象后作出判断的语气，同时不额外加入原文没有的“看见”。
- source_word: Καύσων
  choice: 酷热
  rationale: 该名词指灼人的强烈炎热。“酷热”在现代汉语中既自然又有足够强度，比普通的“热”更准确，也避免过度现代化的“热浪”。
- source_word: ἔσται
  choice: 天要……了
  rationale: 与“酷热”搭配时，汉语气象预告常用“天要酷热了”，自然表达将要出现的炎热状况。
- source_word: γίνεται
  choice: 果然如此
  rationale: 原文表示预言的状况实际发生；“果然如此”简洁呈现事情确实照所说的发生，并与前句的判断自然衔接。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语自然的标准普通话。保留原文简洁的气象判断结构；不补入上一分句可能使人联想到的“看见”。本节无须脚注，因为“南风”和“酷热”在中文正文中已能充分表达语境义，且不存在影响理解的实质歧义。
