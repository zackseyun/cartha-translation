source:
  edition: SBLGNT
  text: ἐκεῖνος δὲ ὁ δοῦλος ὁ γνοὺς τὸ θέλημα τοῦ κυρίου ⸀αὐτοῦ καὶ μὴ ἑτοιμάσας ⸀ἢ ποιήσας πρὸς τὸ θέλημα αὐτοῦ δαρήσεται πολλάς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/047.yaml
  text: But that slave[a], who knew his master's will and did not prepare or act according to his will, will be beaten with many blows.
translation:
  language: zh_hans
  text: 至于那奴仆，他明知道主人的心意，却没有预备，或没有照主人的心意去做，必遭受多次鞭打。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“必被打许多下”；“许多”后面的名词在原文中省略，可理解为“击打”一类的词。原文在“没有预备”和“没有照主人的心意去做”之间用“或”。
    reason: 说明πολλάς的省略结构，并保留ἢ（“或”）的连接方式。
lexical_decisions:
- source_word: δοῦλος
  choice: 奴仆
  rationale: 该词指处于主人权柄之下、受其支配的人，不是普通雇工。“奴仆”既保留从属关系，也符合现代中文圣经叙事的庄重语体。
- source_word: γνοὺς
  choice: 明知道
  rationale: 不定过去时分词表示他已经知道主人的心意；“明知道”在中文中自然地突出其知情责任，又不把它改写为更强的“完全明白”。
- source_word: θέλημα
  choice: 心意
  rationale: 此处指主人所意愿、所要求的事。“心意”比单用“旨意”更适合比喻中的主仆场景，同时保留其意愿与要求两层含义。
- source_word: κυρίου αὐτοῦ
  choice: 主人的
  rationale: 在家主与奴仆的比喻关系中，κύριος指奴仆的主人；如此翻译不预先把该词直接处理为神学称号。
- source_word: μὴ ἑτοιμάσας
  choice: 没有预备
  rationale: 原文未明说预备什么，译文也保留宾语省略，不擅自限定为预备自己或预备事务。
- source_word: ἢ ποιήσας πρὸς τὸ θέλημα αὐτοῦ
  choice: 也没有照主人的心意去做
  rationale: 按语境，否定词统摄两个并列分词；中文用“也没有”清楚表达第二项失败。“照……心意去做”自然传达πρός所表示的符合关系。
- source_word: δαρήσεται πολλάς
  choice: 必遭受许多鞭打
  rationale: δαρήσεται是将来被动，表示将受击打；πολλάς为阴性复数的省略表达，隐含“击打、鞭打”等名词。正文补出“鞭打”以便中文读者理解，并用脚注说明原文的省略。
theological_decisions:
- issue: 比喻中κύριος的译法
  choice: 主人
  alternative: 主
  rationale: 句内呈现的是奴仆与其主人的家内关系。“主人”准确表达社会关系，又不否定该比喻在更广语境中的属灵指向。
- issue: πολλάς所表达的惩罚程度
  choice: 许多鞭打
  alternative: 重重责打；打许多下
  rationale: 原文用复数形容词并省略名词，重在次数或数量多，而不只是笼统表示严重。“许多鞭打”保留具体惩罚意象；脚注交代也可直译为“打许多下”。
- issue: 两个分词短语之间ἢ的语义呈现
  choice: 却没有预备，也没有照主人的心意去做
  alternative: 却没有预备，或没有照主人的心意去做
  rationale: 希腊文形式使用ἢ（“或”），但在否定范围内可列举两方面的未履行。正文采用自然中文“也没有”表达两项失职，脚注保留形式上“或”的可能译法，避免抹平原文连接词。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“至于”承接前文并突出该奴仆；“明知道”强调知情而未行的责任。“奴仆”保留古代受主人支配的身份，避免弱化为一般雇佣关系。
