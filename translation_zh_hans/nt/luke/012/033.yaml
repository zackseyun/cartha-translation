id: LUK.12.33
reference: Luke 12:33
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: πωλήσατε τὰ ὑπάρχοντα ὑμῶν καὶ δότε ἐλεημοσύνην· ποιήσατε ἑαυτοῖς βαλλάντια μὴ παλαιούμενα, θησαυρὸν ἀνέκλειπτον ἐν τοῖς οὐρανοῖς, ὅπου κλέπτης οὐκ ἐγγίζει οὐδὲ σὴς διαφθείρει·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/033.yaml
  text: Sell your possessions and give alms[a]. Make for yourselves money bags that do not wear out, an unfailing treasure in the heavens[b], where no thief comes near and no moth destroys.
translation:
  language: zh_hans
  text: 你们要卖掉自己的财物，周济穷人[a]；为自己预备永不破旧的钱袋，就是天上[b]取用不尽的财宝；在那里，贼不能近前，蛾子也不能毁坏。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文词语指以财物帮助有需要的人，也可译作“施舍”。
    reason: lexical_alternative
  - marker: b
    text: 原文作复数“诸天之中”；中文通常说“天上”。
    reason: source_form
lexical_decisions:
- source_word: πωλήσατε
  choice: 要卖掉
  rationale: 保留复数命令语气和行动的明确性；“卖掉”自然准确，但不额外加入“全部变卖”的含义。
- source_word: τὰ ὑπάρχοντα ὑμῶν
  choice: 自己的财物
  rationale: 指听众所拥有的产业或物品；“自己的财物”符合现代汉语表达。
- source_word: δότε ἐλεημοσύνην
  choice: 周济穷人
  rationale: ἐλεημοσύνη指以给予有需要者来实行怜悯；此译比音译式宗教用语更清楚，也保留具体施予的含义。
- source_word: ποιήσατε ἑαυτοῖς
  choice: 为自己预备
  rationale: 表达反身与受益关系；在钱袋这一语境中，“预备”比直译“制作”更自然。
- source_word: βαλλάντια μὴ παλαιούμενα
  choice: 永不破旧的钱袋
  rationale: 保留钱袋的具体比喻，并将παλαιόω所表达的变旧、磨损译为“破旧”。
- source_word: θησαυρὸν ἀνέκλειπτον
  choice: 取用不尽的财宝
  rationale: ἀνέκλειπτος表示不会耗尽或失效；“取用不尽”以自然汉语呈现其持续不竭的意思。
- source_word: ἐν τοῖς οὐρανοῖς
  choice: 天上
  rationale: 希腊文为复数，但中文“天上”是自然的圣经与日常表达，不必机械体现数的差别；以脚注说明原文形式。
- source_word: ὅπου κλέπτης οὐκ ἐγγίζει
  choice: 在那里，贼不能近前
  rationale: 较直接保留ἐγγίζω“靠近”的空间意象，而不擅自具体化为偷窃成功。
- source_word: οὐδὲ σὴς διαφθείρει
  choice: 蛀虫也不能毁坏
  rationale: σής指蛀蚀衣物等物品的虫；现代汉语用“蛀虫”比单说“蛾”更清楚地表达毁损作用。
theological_decisions:
- issue: ἐλεημοσύνη在关于财物与天上财宝的劝诫中如何表达
  choice: 周济穷人
  alternative: 施舍；行赒济
  rationale: 译文明确体现向贫困者给予的怜悯行动，同时不把命令扩展为经文未明说的完整经济制度。
- issue: ἐν τοῖς οὐρανοῖς的复数形式
  choice: 天上
  alternative: 诸天之中
  rationale: 保留其地点意义，并用脚注交代希腊文复数；避免“诸天之中”在现代中文里造成不必要的宇宙层级推论。
- issue: 钱袋与财宝之间的同位或解释关系
  choice: 用“就是”连接
  alternative: 并列理解为钱袋和财宝两项
  rationale: 希腊文以“钱袋”后接单数“财宝”，自然可理解为后者解释前一比喻；“就是”清楚呈现这一关系，同时不消除其修辞张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“周济”保留怜悯施予的正式色彩，“钱袋”保留古代具体意象；分号呈现命令、解释与结果之间的层次。
