id: LUK.12.45
reference: Luke 12:45
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐὰν δὲ εἴπῃ ὁ δοῦλος ἐκεῖνος ἐν τῇ καρδίᾳ αὐτοῦ· Χρονίζει ὁ κύριός μου ἔρχεσθαι, καὶ ἄρξηται τύπτειν τοὺς παῖδας καὶ τὰς παιδίσκας, ἐσθίειν τε καὶ πίνειν καὶ μεθύσκεσθαι,
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/045.yaml
  text: But if that slave says in his heart[a], ‘My master delays in coming,’ and begins to beat the male slaves and the female servants, and to eat and drink and get drunk[b],
translation:
  language: zh_hans
  text: 可是，如果那个奴隶[a]心里说：‘我的主人[b]迟迟不来’，就开始殴打男仆和女仆，又吃又喝，喝得酩酊大醉，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“仆人”或“奴仆”。希腊词 δοῦλος 在这里表示处于主人权下的奴隶；本节的家庭等级关系十分突出。
    reason: lexical_alternative
  - marker: b
    text: 希腊词 κύριος 也可译“主”；这里在比喻的家庭场景中指奴隶的主人。
    reason: alternative_reading
lexical_decisions:
- source_word: δοῦλος
  choice: 奴隶
  rationale: 这里的家庭权力结构、受支配身份和随后要承担的责任十分突出；“奴隶”比“仆人”更明确地保留了原词所指的受奴役身份。
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: 心里说
  rationale: 这是自然的现代汉语表达，同时保留了话语只存在于内心、尚未公开说出的含义。
- source_word: Χρονίζει … ἔρχεσθαι
  choice: 迟迟不来
  rationale: 自然地表达主人经过很久仍未到来的持续拖延感，未把它强化为主人有意推迟。
- source_word: κύριός μου
  choice: 我的主人
  rationale: 在比喻的家庭场景中指奴隶的上级和所有者；“主人”准确表达社会关系，也避免在正文中直接当作神圣称号。
- source_word: ἄρξηται τύπτειν
  choice: 开始殴打
  rationale: “开始”保留起始意义；“殴打”体现此处反复施加暴力的虐待性质。
- source_word: τοὺς παῖδας καὶ τὰς παιδίσκας
  choice: 男仆和女仆
  rationale: 保留希腊文阳性与阴性两组家仆的明确对应，也在汉语中与前面的“奴隶”保持词汇区分。
- source_word: ἐσθίειν τε καὶ πίνειν
  choice: 又吃又喝
  rationale: 符合现代汉语并列习惯，准确传达两个连续的放纵行为。
- source_word: μεθύσκεσθαι
  choice: 喝得酩酊大醉
  rationale: 明确表达进入醉酒状态；“酩酊大醉”自然传达严重醉酒而不增加额外行为。
theological_decisions:
- issue: 比喻中 κύριος 是译作“主人”还是具有神圣称号色彩的“主”
  choice: 主人
  alternative: 主
  rationale: 故事层面直接所指是家中的主人；译作“主人”保留权威关系，却不提前消除比喻可能具有的神学指向。
- issue: δοῦλος 在本节是译作“奴隶”还是“仆人”
  choice: 奴隶
  alternative: 仆人／奴仆
  rationale: 本节突出支配、暴力与问责，“奴隶”较完整地呈现古代受奴役的社会身份；脚注保留较传统但较弱的译法。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“迟迟不来”自然表达持续延误；“男仆和女仆”保留原文的性别配对；句末逗号保留本节与下一节主句之间尚未完结的句法关系。
