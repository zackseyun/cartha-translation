id: LUK.12.58
reference: Luke 12:58
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὡς γὰρ ὑπάγεις μετὰ τοῦ ἀντιδίκου σου ἐπ’ ἄρχοντα, ἐν τῇ ὁδῷ δὸς ἐργασίαν ἀπηλλάχθαι ἀπ’ αὐτοῦ, μήποτε κατασύρῃ σε πρὸς τὸν κριτήν, καὶ ὁ κριτής σε ⸀παραδώσει τῷ πράκτορι, καὶ ὁ πράκτωρ σε ⸀βαλεῖ εἰς φυλακήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/058.yaml
  text: For as you are going with your accuser before a magistrate[a], make an effort on the way to be released from him, lest he drag you to the judge, and the judge hand you over to the officer, and the officer throw you into prison.
translation:
  language: zh_hans
  text: 因为你同控告你的人去见官长时，就要趁还在路上，尽力使自己从他那里脱身[a]，免得他把你拖到审判官面前，审判官把你交给差役，差役再把你投入监牢。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“尽力同他了结纠纷”。希腊文直译为“尽力从他那里获得释放”，在这里很可能指案件交到审判官手中以前先解决争端。
    reason: 说明原文较直译的表达及其语境中可能的法律含义，同时保留解释空间。
lexical_decisions:
- source_word: ἀντιδίκου
  choice: 控告你的人
  rationale: 本节处于诉讼场景，指与当事人对簿公堂的对方；“控告你的人”比泛指的“对头”更清楚地传达法律语境。
- source_word: ἄρχοντα
  choice: 官长
  rationale: 此处指具有民事或司法权柄的官员。“官长”既保留其权力身份，也避免套用某一现代司法制度的特定职称。
- source_word: δὸς ἐργασίαν
  choice: 尽力
  rationale: 该表达催促人积极采取行动；“尽力”简洁、自然，并保留劝勉的力度。
- source_word: ἀπηλλάχθαι ἀπ’ αὐτοῦ
  choice: 使自己从他那里脱身
  rationale: 尽量保留原文“从他那里获释／脱离”的表达，不直接把含义限定为和解、还债或庭外解决；上下文所暗示的了结诉讼在脚注中说明。
- source_word: κατασύρῃ
  choice: 拖
  rationale: 该动词带有强制、粗暴地拉走的鲜明意味，“拖”保留了这种力度。
- source_word: κριτήν / κριτής
  choice: 审判官
  rationale: 采用明确的司法称谓，并与前面的“官长”有所区分，保留原文两个不同名词。
- source_word: παραδώσει
  choice: 交给
  rationale: 自然表达司法程序中把人移交给执行官员的动作。
- source_word: πράκτορι / πράκτωρ
  choice: 差役
  rationale: 此词指执行判决、拘押或追讨事务的官员；“差役”能清楚呈现其执行职能，又不硬套现代法制中的特定职位。
- source_word: βαλεῖ εἰς φυλακήν
  choice: 投入监牢
  rationale: “投入”保留 βάλλω 的强烈动作感，“监牢”清楚表达拘禁之所。
- source_word: ὡς γὰρ
  choice: 因为……时
  rationale: “因为”承接上文的解释关系，而“时”使所举法律情景在现代汉语中自然展开。
- source_word: ἐν τῇ ὁδῷ
  choice: 趁还在路上
  rationale: 既保留字面的行路场景，也传达案件到达审判官之前必须及时行动的紧迫感。
theological_decisions:
- issue: 是否把法律图景直接解释为末日审判或人与上帝和好
  choice: 正文只保留诉讼、审判、拘禁的法律图景
  alternative: 把控告者、审判官或监牢直接解释为特定属灵对象，或译成与上帝和好
  rationale: 本节措辞本身没有明说这些人物和事物各自对应什么神学对象。上下文可能赋予图景更深的末世紧迫性，但翻译不应把这种应用写进经文本身。
- issue: ἀπηλλάχθαι ἀπ’ αὐτοῦ 的具体法律含义
  choice: 正文保留“从他那里脱身”的开放表达
  alternative: 明确译为“与他和解”或“庭外解决纠纷”
  rationale: 原文直译是从对方那里得到释放或脱离；在语境中很可能指案件到庭前得到解决，但没有说明解决的具体方式，因此以脚注呈现较具体的理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“官长—审判官—差役”呈现原文不同的法律角色；用“拖”“投入”保留原文动作的力度。脚注标记紧接其所解释的“脱身”。
