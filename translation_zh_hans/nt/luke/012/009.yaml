id: LUK.12.9
reference: Luke 12:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ δὲ ἀρνησάμενός με ἐνώπιον τῶν ἀνθρώπων ἀπαρνηθήσεται ἐνώπιον τῶν ἀγγέλων τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/009.yaml
  text: But the one who denies me before men will be denied before the angels of God[a][b].
translation:
  language: zh_hans
  text: 但那在人面前否认我的，也必在上帝的天使面前被否认[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“被弃绝”。原文这里的动词与前面的“否认”同源，但形式可能带有更强的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ... ἀρνησάμενός
  choice: 那……否认……的
  rationale: 带冠词的过去时中间语态分词在此作名词用，指“那否认的人”。汉语用“那……的”自然表达这一泛指原则，不把过去时态生硬译成一次已完成的行为。
- source_word: με
  choice: 我
  rationale: 保留指向耶稣的直接宾语。
- source_word: ἐνώπιον
  choice: 在……面前
  rationale: 既自然，又保留公开见证或审判场景中的临在意味。
- source_word: τῶν ἀνθρώπων
  choice: 人
  rationale: 原词泛指人类，并与“上帝的天使”相对；“在人面前”简洁、自然且不限定性别。
- source_word: ἀπαρνηθήσεται
  choice: 必……被否认
  rationale: 保留将来被动形式及其与前文“否认”的词语呼应；“必”自然传达希腊语将来式在此庄严、确定的语气，而不补出未明说的施事者。
- source_word: τῶν ἀγγέλων τοῦ θεοῦ
  choice: 上帝的天使
  rationale: 直接表达属格关系，保留天上见证或法庭般的场景。
- source_word: δὲ
  choice: 但
  rationale: 清楚标明本节与上一节正面陈述之间的对比。
theological_decisions:
- issue: “必被否认”的施事者是谁
  choice: 保留无施事者的被动表达
  alternative: 明确补作“人子必不认他”或“上帝必否认他”
  rationale: 希腊文只用被动动词，没有明说施事者。虽然上下文可能使读者联想到人子或上帝，但本节自身仍保持含蓄，因此译文不替原文消除这一张力。
- issue: ἀπαρνέομαι 前缀可能具有的加强意味
  choice: 正文译为“被否认”，并以脚注提示“被弃绝”的可能译法
  alternative: 正文直接译为“被弃绝”或“彻底不认”
  rationale: 正文保留两个同源动词之间“否认……被否认”的对应关系；脚注则承认后一个动词可能带有更强的断绝、弃绝意味。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“在人面前”与“在上帝的天使面前”形成清楚的平行；被动句虽略带庄严书面色彩，却是保留原文施事者含蓄性的必要表达。
