  text: κατανοήσατε τὰ κρίνα πῶς αὐξάνει· οὐ κοπιᾷ οὐδὲ νήθει· λέγω δὲ ὑμῖν, οὐδὲ Σολομὼν ἐν πάσῃ τῇ δόξῃ αὐτοῦ περιεβάλετο ὡς ἓν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/027.yaml
  text: 'Consider the lilies[a], how they grow: they do not labor or spin; yet I tell you[b], not even Solomon in all his glory was clothed like one of these.'
translation:
  language: zh_hans
  text: 你们要仔细想想百合花[a]是怎样生长的：它们既不劳作，也不纺线。然而我告诉你们，即使所罗门拥有一切荣华，所穿戴的也不如其中一朵百合花。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“野花”或“花”；希腊文具体作“百合花”。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατανοήσατε
  choice: 要仔细想想
  rationale: 该不定过去时命令式要求人留心观察并加以思考，不只是看见；“仔细想想”自然地传达这种审慎考察的语气。
- source_word: τὰ κρίνα
  choice: 百合花
  rationale: κρίνα通常特指百合花；正文保留原文的具体花名，不泛化为“花”或“野花”，同时以脚注说明可能的宽泛理解。
- source_word: πῶς αὐξάνει
  choice: 是怎样生长的
  rationale: 保留πῶς所表达的方式意味；希腊文中中性复数主语可配单数动词，汉语无需体现数的一致变化。
- source_word: οὐ κοπιᾷ οὐδὲ νήθει
  choice: 既不劳作，也不纺线
  rationale: κοπιάω表示辛苦劳动，νήθω指纺纱或纺线；“既不……也不……”准确而流畅地呈现并列否定。
- source_word: λέγω δὲ ὑμῖν
  choice: 然而我告诉你们
  rationale: δὲ在此带轻微转折并引出强调性的结论；“然而”清楚表现修辞推进。
- source_word: ἐν πάσῃ τῇ δόξῃ αὐτοῦ
  choice: 极尽荣华时
  rationale: δόξα在此主要指君王的华美、显赫与尊荣；“极尽荣华”符合现代汉语表达，并保留“全部荣华”的强调。
- source_word: περιεβάλετο
  choice: 他的穿戴
  rationale: 该中间/被动形式在语境中指穿衣装扮；名词化为“他的穿戴”避免在汉语中生硬地表达施事，同时保留衣饰意象。
- source_word: ὡς ἓν τούτων
  choice: 也不如这些花中的一朵
  rationale: 明确比较对象是前述百合花；补出“花”使汉语指代自然，不改变原意。
theological_decisions:
- issue: 花卉意象所指的范围
  choice: 正文采用具体的“百合花”
  alternative: 花；野花
  rationale: 希腊文明确使用κρίνα。虽可按自然环境宽泛理解为野生花卉，但不应在正文中无必要地泛化原文。
- issue: 所罗门的δόξα如何表达
  choice: 极尽荣华时
  alternative: 在他一切的荣耀中；极其华美时
  rationale: 这里的δόξα具体指所罗门王室生活的荣美与华贵。“荣华”既保留尊荣色彩，也与穿戴的语境自然衔接。
- issue: περιεβάλετο的语态与施事
  choice: 以“他的穿戴”表达，不指定是谁给他穿衣
  alternative: 他所穿的；他穿戴起来
  rationale: 原形式容许中间或被动理解，正文不额外断定施事，从而保留原文在语态上的余地。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“要仔细想想”传达命令式的审慎观察；“劳作／纺线／穿戴”维持从劳动到制衣、衣饰的连贯意象。未为“荣华”另设脚注，因为正文已自然体现此处δόξα的语境义；英文本脚注b的位置似与其内容不相符。
