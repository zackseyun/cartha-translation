  - severity: low
    issue: αὐτῆς在首个婆媳关系中的明确限定未体现
    rationale: 汉语亲属词虽可隐含关系，但“婆母反对自己的儿媳”能自然体现原文“她的儿媳”；末句原文没有相应物主代词，汉语无需机械补出。
