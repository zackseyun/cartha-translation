  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ⸀διαμερισθήσονται πατὴρ ἐπὶ υἱῷ καὶ υἱὸς ἐπὶ πατρί, μήτηρ ⸀ἐπὶ ⸀θυγατέρα καὶ θυγάτηρ ἐπὶ ⸂τὴν μητέρα⸃, πενθερὰ ἐπὶ τὴν νύμφην αὐτῆς καὶ νύμφη ἐπὶ τὴν ⸀πενθεράν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/053.yaml
  text: 'They will be divided: father against son and son against father[a], mother against daughter and daughter against mother[c][b], mother-in-law against her daughter-in-law and daughter-in-law against her mother-in-law.'
translation:
  language: zh_hans
  text: 他们将分裂：父亲反对儿子，儿子反对父亲；母亲反对女儿，女儿反对母亲；婆母反对自己的儿媳，儿媳反对婆母。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有古抄本在本节若干处的介词、冠词和词序上略有差异；另有异文把“女儿反对母亲”写作“儿媳反对婆母”。
    reason: textual_variant
lexical_decisions:
- source_word: διαμερισθήσονται
  choice: 将彼此分裂
  rationale: 该词为将来时被动形式，表示家庭成员将陷入分裂状态；“彼此分裂”既保留分裂的结果，也自然引出后面成对的对立关系。
- source_word: ἐπὶ
  choice: 反对
  rationale: 在这里反复连接彼此对立的家庭成员，表达敌对或对抗关系；“反对”简明而不额外强化为暴力冲突。
- source_word: πατήρ / υἱός
  choice: 父亲 / 儿子
  rationale: 保留原文明确的男性亲属称谓及相互对应的结构。
- source_word: μήτηρ / θυγάτηρ
  choice: 母亲 / 女儿
  rationale: 保留原文明确的女性亲属称谓及相互对应的结构。
- source_word: πενθερά
  choice: 婆母
  rationale: 与本句的νύμφη构成丈夫之母与儿媳的对应关系；现代汉语中“婆母”庄重、清楚，并比泛称“岳母”更符合这一配对。
- source_word: νύμφη
  choice: 儿媳
  rationale: 该词也可指“新娘”，但与πενθερά相互配对时，亲属义“儿媳”最合语境。
- source_word: αὐτῆς
  choice: （由“婆母—儿媳”的关系体现）
  rationale: 原文在“她的儿媳”处有物主代词；汉语亲属称谓已自然表明所属关系，若直加“她的”反而略显累赘。末项虽无物主代词，译文依汉语习惯保持对称。
theological_decisions:
- issue: 本节所说分裂的性质
  choice: 按上下文译为耶稣使命所引发的家庭与社会冲突，不把它表达成对家庭敌意的认可。
  alternative: 把它仅理解为泛指家庭矛盾的格言。
  rationale: 本节承接前文关于“分裂”的话，并以相互对立的亲属关系具体说明其后果。译文保留原文尖锐的张力，不加解释性缓和，也不暗示这种敌意本身受到赞许。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以分号呈现三组相互对应的家庭关系，并用“也”使最后一组在汉语中衔接自然。脚注标记置于整节末尾，涵盖SBLGNT所标示的多处异文；不为英语咨询层中与本节希腊正文不相符的脚注顺序另设标记。
