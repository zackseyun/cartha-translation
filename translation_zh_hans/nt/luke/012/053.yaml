- from: 他们将彼此分裂：父亲反对儿子，儿子反对父亲；母亲反对女儿，女儿反对母亲；婆母反对儿媳，儿媳也反对婆母。[a]
  to: 他们将分裂：父亲反对儿子，儿子反对父亲；母亲反对女儿，女儿反对母亲；婆母反对自己的儿媳，儿媳反对婆母。[a]
  rationale: 修订仅处理两个可安全改进之处：以“将分裂”直接对应希腊语将来被动式，不预先添加“彼此”；并以“自己的儿媳”体现αὐτῆς。其余亲属称谓、对立语气、三组平行结构及异文脚注均予保留。
