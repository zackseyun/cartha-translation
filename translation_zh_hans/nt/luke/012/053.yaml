  naturalness: 原译整体庄重、清楚，亲属配对和分号结构均适合现代标准汉语。将“彼此分裂”简化为“将分裂”，并把首个婆媳关系译为“婆母反对自己的儿媳”，可使句子更顺畅并更贴合原文的限定关系。
  terminology: “父亲、儿子、母亲、女儿”准确。“婆母／儿媳”在本处可清楚表达πενθερά与νύμφη的配对；“婆母”较正式但仍可理解。保留“反对”恰当地表达反复出现的ἐπί所指的对立，不加重为暴力。
