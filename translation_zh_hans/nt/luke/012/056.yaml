  text: ὑποκριταί, τὸ πρόσωπον τῆς γῆς καὶ τοῦ οὐρανοῦ οἴδατε δοκιμάζειν, τὸν ⸂δὲ καιρὸν⸃ τοῦτον πῶς ⸂οὐκ οἴδατε δοκιμάζειν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/056.yaml
  text: Hypocrites! You know how to interpret the appearance of the earth and the sky[a], but how is it that you do not know how to interpret this time?
translation:
  language: zh_hans
  text: 假冒为善的人哪！你们懂得分辨天地的气象，却怎么不懂得分辨这个时候呢？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑποκριταί
  choice: 假冒为善的人哪
  rationale: 这是直接呼语式的斥责；在本语境中指言行或判断与真实状况不相称的人，而不是字面意义上的演员。采用现代汉语中通行且庄重的表达。
- source_word: τὸ πρόσωπον τῆς γῆς καὶ τοῦ οὐρανοῦ
  choice: 天地的气象
  rationale: πρόσωπον在此指天地显出的外在面貌；上下文谈由可见征象判断天气。“天地的气象”自然传达这一习语，不把οὐρανός误解为神圣领域。
- source_word: οἴδατε δοκιμάζειν
  choice: 知道分辨
  rationale: οἴδατε加不定式表达“知道怎样、能够”，δοκιμάζειν在此是察验并判断征象。“知道分辨”既保留认知与判断含义，也适合现代汉语。
- source_word: τὸν καιρὸν τοῦτον
  choice: 这个时机
  rationale: καιρός可指具有特殊意义、适切或关键的时刻，不只是一般流逝的时间；“这个时机”保留其质性意味，同时不具体限定为某一教义解释。
- source_word: πῶς οὐκ οἴδατε δοκιμάζειν
  choice: 却怎么不知道分辨……呢
  rationale: πῶς引出带责问语气的反问；此译保留前后重复的“知道分辨”，并自然呈现责备力度。
theological_decisions:
- issue: καιρός所指的意义
  choice: 这个时机
  alternative: 这个时候／这个关键时刻
  rationale: 经文责备听众未能辨明当下所具有的特殊意义，但希腊文没有在本节中明确说明这种意义的全部内容。“时机”兼顾时间性与决定性，又避免把其神学所指解释得过窄。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“天地的气象”对应可观察的天气征象；前后重复“知道分辨”，保留原文的修辞对照和责问语气。
