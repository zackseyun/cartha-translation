  text: Πῦρ ἦλθον βαλεῖν ⸀ἐπὶ τὴν γῆν, καὶ τί θέλω εἰ ἤδη ἀνήφθη;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/049.yaml
  text: I came to cast fire on the earth[a], and how I wish it were already kindled!
translation:
  language: zh_hans
  text: “我来，是要把火投在地上；我多么希望这火已经燃起来了！[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译作：“如果已经燃起来了，我还想要什么呢？”这句希腊文较难理解；正文采用较可能的习惯表达，传达强烈的愿望。
    reason: alternative_reading
lexical_decisions:
- source_word: Πῦρ
  choice: 火
  rationale: 保留原文鲜明而未加解释的比喻，不在正文中限定为审判、洁净、圣灵或纷争。
- source_word: ἦλθον
  choice: 我来
  rationale: 自然表达耶稣来临的使命目的，也贴近希腊文不定过去时。
- source_word: βαλεῖν
  choice: 投
  rationale: 保留 βάλλω“投、抛”的力度和形象，比“带来”更贴近原文。
- source_word: ἐπὶ τὴν γῆν
  choice: 在地上
  rationale: γῆ 在此具有广泛范围；“地上”自然且不把含义无依据地局限为某一地区。
- source_word: καὶ τί θέλω εἰ ἤδη ἀνήφθη;
  choice: 我多么希望这火已经燃起来了！
  rationale: 该句希腊文结构艰深；正文采用在语境中较可能的强烈愿望语气，同时以脚注保留较直译的疑问式理解。
- source_word: ἤδη
  choice: 已经
  rationale: 准确保留动作已然发生的时间意味。
- source_word: ἀνήφθη
  choice: 燃起来了
  rationale: 自然表达 ἀνάπτω 的被动意义“被点燃”，并延续火的意象。
theological_decisions:
- issue: “火”的含义
  choice: 正文只译为“火”，不作解释
  alternative: 审判、洁净、圣灵，或耶稣使命所引发的分裂与危机
  rationale: 本节没有明确界定这一比喻；保留其多重可能意蕴和神学张力。
- issue: τί θέλω εἰ ἤδη ἀνήφθη 的语力
  choice: 译作表达强烈愿望的感叹句
  alternative: 按表层句法译作疑问句：“如果已经燃起来了，我还想要什么呢？”
  rationale: 原句公认艰深；感叹式理解较符合上下文，也能形成自然、清楚的现代汉语，但脚注保留其字面结构所容许的另一理解。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“把火投在地上”保留原文力度；后句用“多么希望”清楚传达强烈愿望。脚注标记已置于正文相关句末。
