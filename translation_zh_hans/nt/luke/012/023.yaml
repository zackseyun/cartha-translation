id: LUK.12.23
reference: Luke 12:23
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἡ ⸀γὰρ ψυχὴ πλεῖόν ἐστιν τῆς τροφῆς καὶ τὸ σῶμα τοῦ ἐνδύματος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/023.yaml
  text: For life is more than food[a], and the body more than clothing.
translation:
  language: zh_hans
  text: 因为生命胜于食物[a]，身体胜于衣服。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“性命”。希腊语ψυχή可指“生命”“自己”或“灵魂”；这里的上下文较支持“生命”。
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: 因为
  rationale: 承接上一节不要忧虑的吩咐，引出其理由；“因为”自然地保留了解释性的连接关系。
- source_word: ψυχή
  choice: 生命
  rationale: 本节将ψυχή与食物、身体与衣服相对照，语境所指是人的生命，而非专指非物质的灵魂。
- source_word: πλεῖόν
  choice: 胜于
  rationale: 表达比较和价值上的超越；“胜于”简洁自然，也避免增添原文未明说的“更重要”等解释。
- source_word: τροφή
  choice: 食物
  rationale: 在饮食和忧虑的语境中，这是清楚、通行的现代汉语对应词。
- source_word: σῶμα
  choice: 身体
  rationale: 指与衣服相对的肉身，“身体”是准确而自然的常用译法。
- source_word: ἔνδυμα
  choice: 衣服
  rationale: 泛指遮蔽身体的穿着之物；“衣服”比“衣裳”或“衣物”更直接、通俗。
theological_decisions:
- issue: 论及忧虑和供应时ψυχή的含义
  choice: 译作“生命”
  alternative: 灵魂；性命
  rationale: ψυχή在此与食物相对，指人现世的生命；这样处理不把本节变成有关灵魂本质的直接论断，也不否认该词在别处可有其他含义。
translation_notes:
  register: 采用现代、庄重而通俗的书面汉语。两个分句都明确使用“胜于”，既体现希腊文的比较关系，也使汉语结构平衡完整。
