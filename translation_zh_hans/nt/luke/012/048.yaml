id: LUK.12.48
reference: Luke 12:48
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ δὲ μὴ γνοὺς ποιήσας δὲ ἄξια πληγῶν δαρήσεται ὀλίγας. παντὶ δὲ ᾧ ἐδόθη πολύ, πολὺ ζητηθήσεται παρ’ αὐτοῦ, καὶ ᾧ παρέθεντο πολύ, περισσότερον αἰτήσουσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/048.yaml
  text: But the one who did not know[a], yet did what deserved blows, will receive few. From everyone to whom much was given, much will be required, and from the one to whom they entrusted much[b], they will ask even more.
translation:
  language: zh_hans
  text: 但那不知道、却做了该受责打之事的，必少挨几下。凡多给谁，就要向谁多取；多托付给谁，就要向谁要求更多。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ... μὴ γνοὺς
  choice: 那不知道……的
  rationale: 将带否定词的名词化分词译为自然的现代汉语，不补明其不知道的具体内容，以保留上下文所提供的指向。
- source_word: ποιήσας ... ἄξια πληγῶν
  choice: 却做了该受责打之事
  rationale: 保留行为与应受责打之间的因果关系；“责打”准确传达惩戒性击打，又不擅自限定工具或制度。
- source_word: δαρήσεται ὀλίγας
  choice: 必少挨几下
  rationale: 原文动词明确表示被打，省略的宾语由前面的 πληγῶν 补足。“少挨几下”在汉语中自然、具体，也保留惩罚有程度差别的图像。
- source_word: παντὶ ... ᾧ ἐδόθη πολύ
  choice: 凡多给谁
  rationale: 采用汉语格言式结构表达普遍原则，并保留被给予许多这一含义，不补出给予者。
- source_word: πολὺ ζητηθήσεται παρ’ αὐτοῦ
  choice: 就要向谁多取
  rationale: ζητέω 在此表示追索、要求交代；“向谁多取”简洁地表达从受领者那里要求许多，并与后句形成平行。
- source_word: ᾧ παρέθεντο πολύ
  choice: 多托付给谁
  rationale: παρατίθημι 在此指把许多交由某人负责；“托付”准确体现受托责任，同时不把不定的复数施事者具体化。
- source_word: περισσότερον αἰτήσουσιν αὐτόν
  choice: 就要向谁要求更多
  rationale: “要求更多”传达 αἰτέω 在问责语境中的力度，并明确表现 περισσότερον 的递进意义。
theological_decisions:
- issue: 惩罚图像的性质
  choice: 保留“责打”和“挨几下”的具体图像
  alternative: 笼统译作“受较轻的惩罚”，或具体化为“鞭打”
  rationale: 经文以按责任轻重而有差等的责打为比喻；译文既不淡化为抽象后果，也不增添原文未说明的刑具或审判机制。
- issue: 末两句的施事者
  choice: 采用汉语无明确施事者的格言式表达
  alternative: 明确补作“神”或“人们”
  rationale: 希腊文使用未说明主语的第三人称复数；汉语省略施事者既自然，也避免超出原文确定其身份。
- issue: 知识与责任的关系
  choice: 保留“不知道”与“少挨几下”的直接对照
  alternative: 解释为完全无罪，或补入特定的末世惩罚体系
  rationale: 原文既承认不知道所带来的程度差别，也仍说其行为应受责打；译文保留这一张力，不替经文作体系化结论。
translation_notes:
  register: 采用现代、庄重而口语可懂的表达。“必少挨几下”自然呈现希腊文明确的被打含义；后半节用平行的格言句式，保持简洁有力，并避免补明原文未指明的施事者。
