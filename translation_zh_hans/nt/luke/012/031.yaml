id: LUK.12.31
reference: Luke 12:31
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: πλὴν ζητεῖτε τὴν βασιλείαν ⸀αὐτοῦ, καὶ ⸀ταῦτα προστεθήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/031.yaml
  text: But seek his kingdom[b][a], and these things will be added to you.
translation:
  language: zh_hans
  text: 但你们要寻求他的国[b][a]，这些东西就必加给你们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“上帝的国”；希腊文作“他的国”，所指由上下文确定。
    reason: lexical_alternative
  - marker: b
    text: 有些抄本作“上帝的国”，而不是“他的国”。
    reason: textual_variant
lexical_decisions:
- source_word: πλὴν
  choice: 但
  rationale: 承接上文不要忧虑、不要追求物质需要的教导，表达鲜明而自然的转折。
- source_word: ζητεῖτε
  choice: 要寻求
  rationale: 现在时命令语气表示持续的人生取向；现代汉语“要寻求”既自然，也无需额外加入“不断”来强化解释。
- source_word: βασιλείαν
  choice: 国
  rationale: “国”是圣经语境中自然且广为理解的译法，并保留该词兼含统治与国度的语义空间。
- source_word: αὐτοῦ
  choice: 他的
  rationale: 忠实保留希腊文代词形式；其所指在上下文中是上帝，但正文不将代词解释性展开。
- source_word: ταῦτα
  choice: 这些东西
  rationale: 指上文所说的饮食等生活所需；不加入希腊文没有的“所有”，避免向《马太福音》的平行经文协调。
- source_word: προστεθήσεται
  choice: 就必加给
  rationale: 保留将这些所需之物“加给”人的表达，也以“必”自然体现将来陈述的确定意味。
- source_word: ὑμῖν
  choice: 你们
  rationale: 作为“加给”的接受者，以现代汉语双宾语结构自然表达，无须机械译出介词。
theological_decisions:
- issue: αὐτοῦ所指为何
  choice: 正文译作“他的国”，由上下文表明“他”指上帝。
  alternative: 译作“上帝的国”。
  rationale: 上下文提到父与上帝的眷顾，所指清楚；保留代词则更贴近所据希腊文本，也不消除原文的指代形式。
- issue: βασιλεία的语义范围
  choice: 译作“国”。
  alternative: 译作“统治”或“王权”。
  rationale: 这里既可侧重上帝的统治，也带有“国度”的传统语义；“国”较能保留这种张力，不把意义限缩为抽象的统治行为。
translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语。“这些东西”照应上文的生活所需；“就必加给你们”保留原文的被动与增添意象。脚注标记依英文审校层的顺序置于“他的国”之后。
