  text: βάπτισμα δὲ ἔχω βαπτισθῆναι, καὶ πῶς συνέχομαι ἕως ⸀ὅτου τελεσθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/050.yaml
  text: But I have a baptism to undergo[c][b][a], and how distressed I am until it is accomplished.
translation:
  language: zh_hans
  text: 但我有一种洗礼必须承受[a][b]；在它完成以前，我承受着多么大的压力啊[c]！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我有一种洗礼要承受。”希腊语使用同源的名词和动词，使“洗礼”的意象更加鲜明。
    reason: lexical_alternative
  - marker: b
    text: 这里的“洗礼”是比喻，指耶稣即将承受、足以将他淹没的苦难与死亡。
    reason: alternative_reading
  - marker: c
    text: 或译：“我是多么受约束”或“我是多么焦灼”，直到它完成。
    reason: lexical_alternative
lexical_decisions:
- source_word: βάπτισμα
  choice: 洗礼
  rationale: 保留原文刻意使用的洗礼意象，不在正文中直接释为“苦难”或“死亡”；此处虽为比喻，仍带有被淹没、被苦难压倒的意味。
- source_word: ἔχω βαπτισθῆναι
  choice: 有一种洗礼必须受
  rationale: 用自然的现代汉语表达即将临到的必要性，同时保留被动承受的含义；脚注列出更贴近希腊语重复结构的译法。
- source_word: πῶς
  choice: 何等大
  rationale: 将感叹用法自然地融入“何等大的压力”，表达程度之深，而不是疑问意义的“怎样”。
- source_word: συνέχομαι
  choice: 承受着……压力
  rationale: 该词可表示被挤压、拘束或内心焦灼；“承受着压力”既通顺，也不过度限定为单纯的悲伤、恐惧或急切愿望。
- source_word: ἕως ὅτου
  choice: 在……以前
  rationale: 清楚标明这种受压状态持续到该事件完成为止，符合现代汉语习惯。
- source_word: τελεσθῇ
  choice: 完成
  rationale: 表达事情达到终点、得以成全的被动含义，同时避免直接套用《约翰福音》19:30的固定措辞。
theological_decisions:
- issue: “洗礼”的比喻所指
  choice: 正文保留“洗礼”意象，脚注说明在上下文中指向耶稣将要承受的苦难与死亡。
  alternative: 直接译作“苦难”或“死亡”；或理解为字面的水礼。
  rationale: 上下文支持受难的指向，但把比喻直接改成解释会削弱原文的文学和神学张力；字面水礼又不符合其前瞻语境。
- issue: συνέχομαι所表达的内在状态
  choice: 译为“承受着何等大的压力”，保留受压、受拘束与焦灼之间的语义空间。
  alternative: 译为“多么痛苦”“多么焦急”或“多么受约束”。
  rationale: 原词容许多重相近色彩；正文不把它限定为纯粹的痛苦、愿望或外在约束。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“有一种洗礼必须受”略带修辞张力，以保存原文比喻；分号呈现前后两句的紧密关系，感叹号对应πῶς引出的强烈感叹。
