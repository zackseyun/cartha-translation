  text: Ἔλεγεν δὲ καὶ τοῖς ὄχλοις· Ὅταν ⸀ἴδητε νεφέλην ἀνατέλλουσαν ⸀ἐπὶ δυσμῶν, εὐθέως λέγετε ⸀ὅτι Ὄμβρος ἔρχεται, καὶ γίνεται οὕτως·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/054.yaml
  text: He was also saying to the crowds[a], “When you see a cloud rising in the west, you immediately say, ‘A rainstorm is coming,’ and so it happens.”
translation:
  language: zh_hans
  text: 他也对众人说：“你们看见西边升起一片云，就立刻说：‘一场大雨[a]要来了。’事情果然如此。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“雨”。希腊语 ὄμβρος 既可泛指雨，也可较具体地指大雨或倾盆雨。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: 说
  rationale: 未完成时把这句话作为叙事中的持续背景来呈现；现代汉语在此用“说”最自然，若译作“一直说”则可能过度强调反复或持续。
- source_word: δὲ καὶ
  choice: 也
  rationale: 保留 καί 的附加意味，同时不生硬直译语气较弱的 δέ。
- source_word: τοῖς ὄχλοις
  choice: 对众人
  rationale: 原文为复数，指聚集的群众；“众人”在现代汉语中自然庄重，也能表达多人群体。
- source_word: Ὅταν ἴδητε
  choice: 你们看见
  rationale: ὅταν 加虚拟语气表示一般情况下出现的情形；汉语无需另加“每当”也能由上下文表达这种通常性。
- source_word: νεφέλην
  choice: 一片云
  rationale: νεφέλη 本义为“云”；量词“一片”符合汉语对远处云层的自然表达，不预先加入“雨云”的解释。
- source_word: ἀνατέλλουσαν ἐπὶ δυσμῶν
  choice: 在西边升起
  rationale: 保留云从西方地平线出现、升起的视觉意象；“西边”比“西部地区”更符合日常天气观察。
- source_word: εὐθέως
  choice: 立刻
  rationale: 准确传达动作紧接着发生，措辞自然明快。
- source_word: Ὄμβρος
  choice: 一场大雨
  rationale: ὄμβρος 可泛指雨，也常指较大的雨或倾盆雨；正文采用具体而自然的“一场大雨”，并以脚注保留较宽泛的译法。
- source_word: ἔρχεται
  choice: 要来了
  rationale: 现在时在此带有即将发生的意味；“要来了”自然表达临近的天气变化。
- source_word: γίνεται οὕτως
  choice: 事情果然如此
  rationale: 表达所预言的天气确实发生；“果然”贴合观察与结果相符的语境。
theological_decisions: []
