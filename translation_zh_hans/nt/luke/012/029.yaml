  text: καὶ ὑμεῖς μὴ ζητεῖτε τί φάγητε ⸀καὶ τί πίητε, καὶ μὴ μετεωρίζεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/029.yaml
  text: And you[a], do not seek what you may eat and what you may drink, and do not be unsettled.
translation:
  language: zh_hans
  text: 你们也不要寻求吃什么、喝什么，也不要心怀不安[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“忧虑不安”“忐忑不安”；较直译为“悬而未定”。
    reason: μετεωρίζεσθε 含有悬而未定、内心受扰的形象；在此语境中也可指对生活所需的忧虑。脚注保留其词义范围。
lexical_decisions:
- source_word: ὑμεῖς
  choice: 你们
  rationale: 希腊文明确使用代词，带有强调意味；汉语把“你们”置于句首，已能自然体现这一点，无须加上较显沉重的“你们自己”。
- source_word: ζητεῖτε
  choice: 寻求
  rationale: 保留 ζητέω“寻求、追求”的基本词义，并在上下文中表达对饮食供应的挂虑和追逐；现在时禁令的持续意味由整句语境自然传达。
- source_word: τί φάγητε καὶ τί πίητε
  choice: 吃什么、喝什么
  rationale: 现代汉语用“吃什么、喝什么”自然表达两个间接疑问，也保留原文未确定、令人挂心的意味；顿号使并列顺畅，而不把关系改成选择性的“或”。
- source_word: μετεωρίζεσθε
  choice: 心神不定
  rationale: 该词可表示悬而未定所引起的内心动荡或焦虑。“心神不定”既保留不安、悬念的形象，又不像单译“忧虑”那样过早限定其含义。
- source_word: καὶ ... καὶ ... καὶ
  choice: 也……、……也……
  rationale: 按现代汉语句法调整连接方式：首尾的“也”保留本句与上下文以及两个禁令之间的累加关系，饮食二项则以顿号自然并列。
theological_decisions:
- issue: 如何表达对物质供应的禁令，而不引入禁欲或反对正常筹划的含义
  choice: 直接禁止以饮食为追求并为此心神不定
  alternative: 禁止一切为饮食所作的正常计划，或要求对身体需要完全漠不关心
  rationale: 上下文针对的是因生活所需而产生的执着寻求和不安，并未否定食物、饮水或日常合理预备。译文保留命令的力度，同时不把它扩张为禁欲主义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“寻求”保留原文的词汇力度；“心神不定”通俗可懂，同时比单纯的“忧虑”更能呈现原词所含的悬疑与不安。
