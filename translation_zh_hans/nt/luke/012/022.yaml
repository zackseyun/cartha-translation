  text: Εἶπεν δὲ πρὸς τοὺς μαθητὰς αὐτοῦ· Διὰ τοῦτο ⸂λέγω ὑμῖν⸃, μὴ μεριμνᾶτε τῇ ⸀ψυχῇ τί φάγητε, μηδὲ τῷ ⸀σώματι τί ἐνδύσησθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/022.yaml
  text: Then he said to his disciples[a], “For this reason I tell you, do not worry about your life, what you will eat, nor about your body[b], what you will wear.”
translation:
  language: zh_hans
  text: 耶稣又对他的门徒说：“因此我告诉你们，不要为生命[a]忧虑吃什么，也不要为身体忧虑穿什么。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “生命”也可理解为“性命”或“生活”；这里的希腊词指人在世的生命，并非专指“灵魂”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν δὲ
  choice: 耶稣又说
  rationale: δέ是轻微的承接连词；“又”自然衔接上文，不过度强化转折。主语由上下文明确为耶稣，译文补出姓名以符合现代汉语表达。
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: 对他的门徒
  rationale: 保留αὐτοῦ所表达的所属关系；“门徒”是μαθηταί在此语境中的常用对应词。
- source_word: Διὰ τοῦτο
  choice: 因此
  rationale: 该短语回指前文，并引出由此得出的劝告；“因此”简洁保留其因果和推论作用。
- source_word: λέγω ὑμῖν
  choice: 我告诉你们
  rationale: 符合现代汉语直接讲话的自然表达，也保留第二人称复数。
- source_word: μὴ μεριμνᾶτε
  choice: 不要……忧虑
  rationale: μεριμνάω在这里指焦虑、挂虑；“忧虑”既准确又庄重，并非禁止一切正常的筹划或关心。
- source_word: τῇ ψυχῇ
  choice: 为生命
  rationale: ψυχή在食物这一语境中指人在世的生命或生存，而非专指非物质的灵魂；“生命”也与下文“身体”形成对应。
- source_word: τί φάγητε
  choice: 吃什么
  rationale: 间接疑问在汉语中用“吃什么”即可自然表达其面向将来的含义，无须机械补出“将要”。
- source_word: μηδὲ τῷ σώματι
  choice: 也不要为身体
  rationale: μηδέ连接第二项否定；“也不要”清楚保持与前一禁令的平行结构。
- source_word: τί ἐνδύσησθε
  choice: 穿什么
  rationale: ἐνδύω中间态在此指穿上衣物；“穿什么”是自然、简明的现代汉语。
theological_decisions:
- issue: ψυχή在本节中的含义
  choice: 生命
  alternative: 灵魂
  rationale: 上下文把食物与ψυχή、衣服与身体并列，所谈的是人在世的生命和生存需要。译作“生命”保留实际语境，也避免把本节不必要地解释为灵魂与身体的二分。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“忧虑”准确表达焦虑性的挂虑；两个“为……忧虑……”保持原文食物与生命、衣服与身体的平行关系。
