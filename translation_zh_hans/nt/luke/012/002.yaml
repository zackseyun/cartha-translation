base_translation:
  language: en
  yaml_path: translation/nt/luke/012/002.yaml
  text: But nothing is covered up that will not be revealed[c][b][a], and hidden that will not be known.
translation:
  language: zh_hans
  text: 然而，没有什么被遮盖的不会被揭开[a][c]，也没有什么隐藏的不会为人所知[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被遮盖的……被揭开”也可译作“被掩藏的……被显露”；希腊原文采用先被覆盖、后来被揭开的形象。
    reason: lexical_alternative
  - marker: b
    text: “隐藏的”也可译作“隐秘的”；“为人所知”也可译作“显为人知”。
    reason: lexical_alternative
  - marker: c
    text: 这句话可泛指一切隐情终必显露，无论是在现今，还是在最后的审判中；原文没有限定时间。
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲν
  choice: 没有什么
  rationale: 保留否定不定代词的绝对范围，并以现代汉语自然表达“无一例外”的意思。
- source_word: δὲ
  choice: 然而
  rationale: δὲ在这里承接上文并带有轻微转折；“然而”既体现语义推进，也不把对立语气说得过重。
- source_word: συγκεκαλυμμένον
  choice: 被遮盖的
  rationale: 这是完成时被动分词，表示某物处于已经被遮盖、掩藏的状态；“被遮盖”保留与下文“揭开”相对的形象。
- source_word: ἀποκαλυφθήσεται
  choice: 会被揭开
  rationale: 将来时被动语态，与“被遮盖”形成直接对应，也保留未来必然显明而未指定具体时间的含义。
- source_word: κρυπτὸν
  choice: 隐藏的
  rationale: 忠实表达“隐藏、隐秘”的意思，并与前半句构成平行而不完全重复的措辞。
- source_word: γνωσθήσεται
  choice: 会为人所知
  rationale: 以自然庄重的现代汉语表达将来被动或结果意义，避免生硬的“会被知道”，并与“隐藏的”形成清楚对照。
- source_word: ὃ οὐκ / ὃ οὐ
  choice: 不会
  rationale: 在“没有什么……不会……”的汉语双重否定结构中保留两个关系从句的逻辑与平行形式。
theological_decisions:
- issue: 这句话所指显露的范围与时间
  choice: 译作一般性的必然显露，不限定发生时间
  alternative: 专指末日审判时的显露；或专指今世中假冒为善被揭穿
  rationale: 希腊文的两个将来时被动形式说明最终必会显露、为人所知，却没有明说是在现今还是末日；译文与脚注保留这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。保留原文两个平行分句及双重否定所表达的绝对性；用“遮盖／揭开”和“隐藏／为人所知”呈现两组相应但不完全相同的词义。
