  text: Ἔστωσαν ὑμῶν αἱ ὀσφύες περιεζωσμέναι καὶ οἱ λύχνοι καιόμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/035.yaml
  text: Let your waists be girded and your lamps burning,[a]
translation:
  language: zh_hans
  text: 你们要束紧腰带，灯也要一直点着。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“要穿戴整齐，预备行动。”当时的人行动前会把长衣束起并用腰带扎好。
    reason: cultural_note
lexical_decisions:
- source_word: Ἔστωσαν
  choice: 要……
  rationale: 这是εἰμί的第三人称现在时命令式，用“要”自然表达持续性的劝勉。
- source_word: ὑμῶν
  choice: 你们的（在译文中仅于首项明示）
  rationale: 该属格代词同时限定“腰”和“灯”；汉语在并列结构中不必重复所有格。
- source_word: ὀσφύες
  choice: 腰
  rationale: 指腰身或腰部；“腰”是现代汉语自然且具体的表达，也保留原文的身体意象。
- source_word: περιεζωσμέναι
  choice: 束紧腰带
  rationale: 该完成时被动分词描写已经束好、随时保持预备的状态。“束紧腰带”既保留束衣的具体意象，又比“束腰”更便于现代读者理解。
- source_word: λύχνοι
  choice: 灯
  rationale: 原词指具体的油灯，而非抽象的光；“灯”在汉语中准确自然。
- source_word: καιόμενοι
  choice: 一直点着
  rationale: 现在时分词表达持续燃烧的状态；“一直点着”比单说“点着”更清楚地传达延续性。
theological_decisions:
- issue: 预备行动的习语意象
  choice: 正文保留“束紧腰带”的具体比喻
  alternative: 穿戴整齐，预备行动／随时准备行动
  rationale: 原文以束起长衣的动作表达警醒和预备。保留意象可避免把含义完全解释化，同时用脚注说明其文化背景。
translation_notes:
  register: 采用庄重、自然的现代标准汉语。“束紧腰带”保留原文具体意象；“一直点着”体现持续状态。脚注标记[a]已置于正文相应位置。
