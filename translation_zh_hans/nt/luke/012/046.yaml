id: LUK.12.46
reference: Luke 12:46
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἥξει ὁ κύριος τοῦ δούλου ἐκείνου ἐν ἡμέρᾳ ᾗ οὐ προσδοκᾷ καὶ ἐν ὥρᾳ ᾗ οὐ γινώσκει, καὶ διχοτομήσει αὐτὸν καὶ τὸ μέρος αὐτοῦ μετὰ τῶν ἀπίστων θήσει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/046.yaml
  text: the master of that slave will come on a day when he does not expect him and at an hour he does not know[b][a], and will cut him in pieces and assign his place with the unfaithful.
translation:
  language: zh_hans
  text: 那奴隶的主人会在他想不到的日子、他不知道的时辰来到，把他劈成两半[a]，并把他的份定在不忠信的人[b]当中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把他劈为两半”；有些人认为这是习语，意思是“严厉地惩罚他”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“不信的人”。
    reason: alternative_reading
lexical_decisions:
- source_word: κύριος
  choice: 主人
  rationale: 在“那奴隶的主人”这一比喻性的主奴关系中，指家主或奴隶的主人；译为“主人”既自然，也不预先把叙事用语处理为基督论称号。
- source_word: δοῦλος
  choice: 奴隶
  rationale: 该词指处于主人权下的人；本段的家主—奴隶关系鲜明，译为“奴隶”比“仆人”更准确地保留其社会身份。
- source_word: ἥξει
  choice: 会……来到
  rationale: ἥκω的将来时在这里表示主人将来到；“来到”符合现代汉语，也保留警告的将来指向。
- source_word: ἐν ἡμέρᾳ ᾗ οὐ προσδοκᾷ
  choice: 在他想不到的日子
  rationale: προσδοκάω表示期待、料想；“想不到”自然表达奴隶没有预料主人到来的意思，而不必增添希腊文未明说的宾语。
- source_word: ἐν ὥρᾳ ᾗ οὐ γινώσκει
  choice: 不知道的时辰
  rationale: γινώσκω是“知道”，故与前句的“想不到”分别处理，保留“不期待”和“不知道”的语义差别。
- source_word: διχοτομήσει
  choice: 把他劈成两半
  rationale: 该动词本义是劈开、分成两部分。“劈成两半”准确保留原文强烈而具体的审判意象；可能的习语性理解置于脚注。
- source_word: τὸ μέρος αὐτοῦ
  choice: 同受一份惩罚
  rationale: μέρος可指份、分、所得的一份。结合审判语境，此处表达把他的归宿或所得之份定在不忠信者当中；“同受一份惩罚”在汉语中较自然，并明确其语境所指。
- source_word: ἀπίστων
  choice: 不忠信的人
  rationale: ἄπιστος既可指不忠信，也可指不信。比喻的直接语境聚焦奴隶是否忠心，因此正文用“不忠信的人”；“不信的人”保留在脚注。
- source_word: θήσει
  choice: 定……同受
  rationale: τίθημι在此有安置、指定其份的意思；“定他……同受”体现主人决定其审判归宿的语气。
theological_decisions:
- issue: διχοτομήσει的刑罚意象应按字面保留，还是按习语解释为严厉惩罚
  choice: 正文保留“把他劈成两半”的具体意象
  alternative: 译为“严厉地惩罚他”
  rationale: 希腊文使用强烈具体的“劈成两半”意象；正文不宜静默削弱其力度。不过，该表达可能被理解为严惩的习语，因此在脚注中说明。
- issue: ἀπίστων表达“不忠信”还是“不信”
  choice: 正文译为“不忠信的人”
  alternative: “不信的人”
  rationale: 紧邻语境是奴隶对主人是否忠心，故“不忠信”更贴合比喻逻辑；但该词也常涉及信与不信，尤其在末世审判语境中，因此以脚注保存另一可能。
- issue: τὸ μέρος αὐτοῦ的审判含义如何表达
  choice: 译为“定他与……同受一份惩罚”
  alternative: 较形式地译作“把他的份放在……中间”或“定他的份与……同在”
  rationale: 直译在现代汉语中生硬且含义不清；结合劈开与审判的上下文，“一份惩罚”传达所得之份或归宿，同时不具体界定惩罚的性质。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“奴隶”准确呈现古代主奴关系；保留“日子／时辰”的平行结构和原文突然而严厉的审判语气。脚注标记均置于正文相关词语之后。
