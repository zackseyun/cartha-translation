source:
  edition: SBLGNT
  text: Τοῦτο δὲ γινώσκετε ὅτι εἰ ᾔδει ὁ οἰκοδεσπότης ποίᾳ ὥρᾳ ὁ κλέπτης ἔρχεται, ⸂οὐκ ἂν⸃ ἀφῆκεν ⸀διορυχθῆναι τὸν οἶκον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/039.yaml
  text: 'But know this: if the master of the house had known at what hour the thief was coming[a], he would not have allowed his house to be broken into.'
translation:
  language: zh_hans
  text: 但你们要知道这件事：家主若知道贼会在什么时辰来，就不会任由自己的房屋被挖穿[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “挖穿”指破墙而入；当时的贼可能挖穿房屋的墙壁进入其中。
    reason: cultural_note
lexical_decisions:
- source_word: Τοῦτο δὲ γινώσκετε
  choice: 但你们要知道这件事
  rationale: γινώσκετε在此按复数命令式理解，直接劝听众留意并领会；“但”承接δέ所标示的转折或推进，“这件事”明确指出后文是所要知道的内容。
- source_word: οἰκοδεσπότης
  choice: 家主
  rationale: 该词指一家之主或管理家宅的人。“家主”简洁保留其身份与权责，不将其收窄为现代产权意义上的“房主”。
- source_word: ποίᾳ ὥρᾳ
  choice: 在什么时辰
  rationale: 保留ὥρα的时间单位色彩，也与上下文警醒等候的主题相称；“时辰”在现代中文中仍清楚而庄重。
- source_word: ὁ κλέπτης ἔρχεται
  choice: 贼会……来
  rationale: 希腊文用现在时表达设想中即将发生的行动；中文用“会来”自然呈现家主事先所能知道的来临时间。
- source_word: οὐκ ἂν ἀφῆκεν
  choice: 就不会任由
  rationale: οὐκ与ἄν及过去时态共同表达与事实相反的结果。“不会任由”既传达反事实，也保留ἀφίημι在此“容许、放任”的含义。
- source_word: διορυχθῆναι τὸν οἶκον αὐτοῦ
  choice: 自己的房屋被挖穿
  rationale: διορύσσω具体指挖穿房屋以闯入。正文保留原文鲜明的动作意象和被动结构，并用脚注补充当时的住宅背景；“自己的”自然回指家主。
