source:
  edition: SBLGNT
  text: ὅταν δὲ ⸀εἰσφέρωσιν ὑμᾶς ἐπὶ τὰς συναγωγὰς καὶ τὰς ἀρχὰς καὶ τὰς ἐξουσίας, μὴ ⸀μεριμνήσητε πῶς ⸂ἢ τί⸃ ἀπολογήσησθε ἢ τί εἴπητε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/011.yaml
  text: But whenever they bring you before the synagogues and the rulers and the authorities[a], do not worry about how or what you should say in your defense, or what you should say[b];
translation:
  language: zh_hans
  text: 但每当有人把你们带到会堂、官长和掌权者面前时[a]，不要忧虑该怎样或说什么来为自己申辩，或该说什么[b]；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “会堂”在这里可指与会堂有关的审理场合或机构；“官长和掌权者”则包括民事统治者和有权审问的人。
    reason: cultural_note
  - marker: b
    text: “说什么来为自己申辩”也可译作“作出怎样的或什么样的申辩”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν δὲ
  choice: 但每当
  rationale: ὅταν表示将来不确定而可能反复发生的情形，译为“每当”；δέ在上下文中是轻微转折或承接，译为“但”。
- source_word: εἰσφέρωσιν ὑμᾶς
  choice: 有人把你们带到……面前
  rationale: 此处动词在司法语境中指把人带到审理者面前；希腊文未明说主语，中文用泛指“有人”自然表达第三人称复数的不定施事者。
- source_word: ἐπὶ τὰς συναγωγὰς καὶ τὰς ἀρχὰς καὶ τὰς ἐξουσίας
  choice: 到会堂、官长和掌权者面前
  rationale: ἐπί加宾格在这里表达被带到某些审理机构或统治者面前；保留三个并列成分及其宗教、政治层面的广度。
- source_word: συναγωγάς
  choice: 会堂
  rationale: 保留该词的直接含义；在语境中可借指会堂所属的审理机构，不在正文中将其窄化为“会堂法庭”。
- source_word: ἀρχάς
  choice: 官长
  rationale: 此处指执政或治理者；“官长”兼顾司法政治语境和庄重、易懂的圣经文体。
- source_word: ἐξουσίας
  choice: 掌权者
  rationale: 该词指获授权柄的人或权力机构；“掌权者”与“官长”有所区分，同时保留广义。
- source_word: μὴ μεριμνήσητε
  choice: 不要忧虑
  rationale: 动词表示焦虑挂心；“不要忧虑”准确、自然，并与本章相关语境用语协调。
- source_word: πῶς ἢ τί ἀπολογήσησθε
  choice: 该怎样为自己申辩
  rationale: ἀπολογέομαι在司法语境中是作辩护、申辩；“怎样”表达πῶς。“或什么”若逐项硬译会使现代中文语义残缺，申辩内容的τί由后一句“该说什么”自然承接。
- source_word: ἢ τί εἴπητε
  choice: 或该说什么
  rationale: 直接表达说话的内容，并保留与前一申辩分句的并列区别。
theological_decisions:
- issue: 应许是否排除一切事先预备
  choice: 正文仅译作“不要忧虑”，不扩写为“不要预备”
  alternative: 译为“不要预先准备”
  rationale: μεριμνάω所禁止的是焦虑挂心；本节没有直接否定一切预备，故不加入经文未明说的神学推论。
- issue: 会堂及官长、掌权者的范围
  choice: 保留宗教与民事权力主体的并列
  alternative: 统一解释为“各级法庭”
  rationale: 原文列出不同主体，既有会堂也有政治权力者；概括成法庭会消除原文的层次和可能范围。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“官长”略带圣经文体色彩，但仍为现代读者熟悉；句式保留原文司法场景及两个说话分句之间的张力。
