base_translation:
  language: en
  yaml_path: translation/nt/luke/012/012.yaml
  text: for the Holy Spirit will teach you in that very hour what you must say[a].
translation:
  language: zh_hans
  text: 因为就在那一刻，圣灵会教导你们该说什么。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在那时。”原文强调需要临到的准确时刻。
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: 因为
  rationale: 保留本节对前文应许的解释作用；现代汉语中用“因为”连接自然清楚。
- source_word: τὸ ἅγιον πνεῦμα
  choice: 圣灵
  rationale: 这是当代中文对该带冠词词组的标准译法，并保留其作为“教导”这一行动主体的表达。
- source_word: διδάξει
  choice: 会教导
  rationale: 准确表达将来时及 διδάσκω 的基本含义，也传达将来必有帮助的应许。
- source_word: ὑμᾶς
  choice: 你们
  rationale: 明确保留第二人称复数。
- source_word: ἐν αὐτῇ τῇ ὥρᾳ
  choice: 就在那时
  rationale: “就”体现 αὐτῇ 所加强的准确时刻和即时性；“那时”比直译“那一小时”更符合现代汉语语境。
- source_word: ἃ
  choice: 什么
  rationale: 以自然汉语引出圣灵所教导的言语内容。
- source_word: δεῖ
  choice: 该
  rationale: 在“该说什么”这一固定自然表达中传达情境所要求的必要性，同时避免生硬的“必须说什么”。
- source_word: εἰπεῖν
  choice: 说
  rationale: 在此语境中自然准确地表达需要说出的内容。
theological_decisions:
- issue: “圣灵”的所指及行动方式
  choice: 将圣灵译作主动教导门徒该说什么的行动主体
  alternative: 理解为非人格化的神圣影响或默示
  rationale: 原文以“圣灵”为将来主动动词“教导”的主语，文本本身支持行动主体的表达；译文不额外加入超出本节的后期教义术语。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“就在那时”兼顾原文强调与中文流畅度；“你们”明确原文复数。
