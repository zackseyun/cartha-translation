id: LUK.12.18
reference: Luke 12:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ εἶπεν· Τοῦτο ποιήσω· καθελῶ μου τὰς ἀποθήκας καὶ μείζονας οἰκοδομήσω, καὶ συνάξω ἐκεῖ πάντα ⸂τὸν σῖτον⸃ καὶ τὰ ἀγαθά μου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/018.yaml
  text: 'And he said[a], ‘This is what I will do: I will tear down my barns and build larger ones[c][b], and there I will gather all my grain and my goods.’'
translation:
  language: zh_hans
  text: 他就说：“我要这么办：拆掉我的仓房[a]，盖更大的；然后把所有的粮食[b]和我的财物[c]都收存在那里。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “仓房”也可译作“库房”或“粮仓”（ἀποθήκας）。
    reason: lexical_alternative
  - marker: b
    text: “粮食”（σῖτος）在某些语境中可更具体地指“小麦”。
    reason: lexical_alternative
  - marker: c
    text: “财物”（τὰ ἀγαθά μου）也可译作“产业”或“所有的东西”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο ποιήσω
  choice: 我要这么办
  rationale: 以自然的现代汉语保留 τοῦτο 的前指和说话人对下一步计划的强调。
- source_word: καθελῶ
  choice: 拆掉
  rationale: 准确表达将现有建筑拆除的具体动作，简洁自然。
- source_word: ἀποθήκας
  choice: 仓房
  rationale: 符合农业语境，也保留该词作为储藏建筑的基本含义；“库房”列作脚注备选。
- source_word: μείζονας οἰκοδομήσω
  choice: 盖更大的
  rationale: 汉语可自然省略重复的“仓房”，同时清楚保留比较级和建造之意。
- source_word: συνάξω ἐκεῖ
  choice: 收存在那里
  rationale: 结合仓储语境表达“聚集、收拢到那里”，但不强化为长期囤积。
- source_word: πάντα τὸν σῖτον
  choice: 所有的粮食
  rationale: σῖτος 可泛指粮食，也常特指小麦；正文采用较宽泛的“粮食”。原文此处没有明确的物主代词，因此不补入“我的”。
- source_word: τὰ ἀγαθά μου
  choice: 我的财物
  rationale: 表达说话人拥有的各种物质资产，不把含义缩窄为金钱或财富数额。
theological_decisions:
- issue: πάντα τὸν σῖτον 与 τὰ ἀγαθά μου 的物主表达是否统一
  choice: 译作“所有的粮食和我的财物”
  alternative: 译作“我所有的粮食和财物”
  rationale: 所给 SBLGNT 正文只在 τὰ ἀγαθά 后明确出现 μου。正文保留这一形式差异，不因英语表达习惯而把“我的”补到 σῖτος 上。
translation_notes:
  register: 采用庄重而口语自然的现代标准汉语。“我要这么办”体现人物自言自语式的计划语气；用分号清楚划分拆建仓房与收藏物品两个步骤。所有脚注标记均紧接所释词语。
