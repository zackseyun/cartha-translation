  text: καὶ ⸀ὑμεῖς γίνεσθε ἕτοιμοι, ὅτι ᾗ ὥρᾳ οὐ δοκεῖτε ὁ υἱὸς τοῦ ἀνθρώπου ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/040.yaml
  text: You also must be ready[c][b][a], because the Son of Man is coming at an hour you do not expect.
translation:
  language: zh_hans
  text: 你们也要做好准备[a]，因为人子[c]会在你们想不到的时刻[b]来临。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们也要预备好。”
    reason: lexical_alternative
  - marker: b
    text: 也可译作“在你们料想不到的时候”。
    reason: lexical_alternative
  - marker: c
    text: 希腊原文作“人子”；这是耶稣用来称呼自己的称号，可能呼应《但以理书》7:13–14。
    reason: cross_reference
lexical_decisions:
- source_word: καὶ ὑμεῖς
  choice: 你们也
  rationale: 既保留καί的“也、同样”之意，也借“你们”体现代词的强调：听众如同前文比喻中的仆人，也必须警醒。
- source_word: γίνεσθε ἕτοιμοι
  choice: 要准备好
  rationale: 现在时命令语气要求听众进入并保持预备状态。“要准备好”在现代汉语中自然明确，既有命令力量，也不把γίνεσθε生硬直译为“成为”。
- source_word: ὅτι
  choice: 因为
  rationale: ὅτι在此引出前述命令的理由，“因为”最清楚自然。
- source_word: ᾗ ὥρᾳ
  choice: 在……的时刻
  rationale: 关系代词与ὥρᾳ构成时间表达；结合后面的否定认知从句，译为“在你们想不到的时刻”符合现代汉语语序。
- source_word: οὐ δοκεῖτε
  choice: 你们想不到
  rationale: δοκέω本义可为“想、认为、料想”；在警告来临时间不可预料的语境中，“想不到”简洁地保留认知和预期两方面的意味。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人子
  rationale: 采用中文圣经传统且简洁透明的称号“人子”，保留其作为耶稣自称以及与《但以理书》背景可能存在的呼应。
- source_word: ἔρχεται
  choice: 会……来临
  rationale: 希腊语现在时在此具有将来指向和鲜明的警告语气。现代汉语若直译为“正在来”容易误解；“会……来临”自然表达确定的未来事件，而不规定更细的末世时间框架。
theological_decisions:
- issue: 基督论称号ὁ υἱὸς τοῦ ἀνθρώπου的译法
  choice: 人子
  alternative: 那位属人的／人的儿子
  rationale: “人子”保留原文称号的字面形式、耶稣自称的功能及其可能的《但以理书》末世性回响，不把称号解释性改写为某一特定教义结论。
- issue: 末世语境中ἔρχεται的时间效力
  choice: 会……来临
  alternative: 就要来临／来了
  rationale: 原文现在时可表达指向未来的来临。主译采用自然汉语的“会……来临”，传达事件的确定性，同时避免“正在来”所造成的时态误读，也不借译文裁定具体的末世体系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“准备好”比“预备妥当”更自然；“来临”则比口语性的“来”略显庄重，适合警告性的经文语气。脚注标记均置于其所解释的词句之后。
