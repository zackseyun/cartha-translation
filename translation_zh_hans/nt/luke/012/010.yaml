  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ πᾶς ὃς ἐρεῖ λόγον εἰς τὸν υἱὸν τοῦ ἀνθρώπου, ἀφεθήσεται αὐτῷ τῷ δὲ εἰς τὸ ἅγιον πνεῦμα βλασφημήσαντι οὐκ ἀφεθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/010.yaml
  text: And everyone who speaks a word against the Son of Man[a], it will be forgiven him[b]; but the one who blasphemes against the Holy Spirit will not be forgiven.
translation:
  language: zh_hans
  text: 凡说一句话反对人子的[a]，都必蒙赦免[b]；但亵渎圣灵的，必不得赦免。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“凡说话反对人子的”。
    reason: “说一句话”对应ἐρεῖ λόγον；此处的εἰς在敌对言语的语境中可译为“反对”。
  - marker: b
    text: 希腊原文直译为“这会被赦免给他”；所犯的罪是隐含的赦免对象。
    reason: 说明原文被动结构及隐含的受事，避免误以为原文直接说“那个人被赦免”。
lexical_decisions:
- source_word: πᾶς ὃς
  choice: 凡……的，都
  rationale: 表达原文逐一适用于任何人的概括性范围，在现代汉语中自然清楚。
- source_word: ἐρεῖ λόγον
  choice: 说话
  rationale: λόγον在此构成“说一句话／发言”的表达；译作“说话”自然，并由“攻击”明确其言语性质。脚注保留较贴近字面的译法。
- source_word: εἰς
  choice: 攻击
  rationale: 在敌对言语及下文“亵渎”的语境中，εἰς表示针对、反对；“攻击”比单纯的“对……说话”更准确地传达语境。
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: 人子
  rationale: 这是该称号在现代中文圣经语境中通行且准确的译法，保留其闪语背景和基督论意义。
- source_word: ἀφεθήσεται αὐτῷ
  choice: 都可得赦免
  rationale: 原文是无人称式的被动表达，直译为“这罪必蒙赦免给他”在中文中生硬；此译自然表达其罪行获得赦免，同时不额外说明赦免机制。
- source_word: τῷ ... βλασφημήσαντι
  choice: 亵渎……的
  rationale: 以中文定中结构表达实体化分词；不强加一次已完成行为或持续行为的时态解释，保留概括性警告。
- source_word: τὸ ἅγιον πνεῦμα
  choice: 圣灵
  rationale: 现代中文对这一神圣称谓的标准译法。
- source_word: οὐκ ἀφεθήσεται
  choice: 必不得赦免
  rationale: 准确表达将来被动否定；“必”传达陈述的确定性，“不得赦免”保持庄重而明确。
theological_decisions:
- issue: 对“攻击人子”与“亵渎圣灵”之间对比的处理
  choice: 按原文保留两者在可否赦免上的鲜明区别，不在正文中界定“亵渎圣灵”的具体机制或条件。
  alternative: 将前者解释为无知中的冒犯，将后者解释为最终不悔改，或依平行经文在译文中扩充说明。
  rationale: 本节只陈明对比，并未在这里解释其神学机制；翻译应保留原有张力，避免把有争议的解释写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“凡……的，都……”保持普遍范围；分号突出两小句的强烈对比。正文中的[a]、[b]均与脚注对应。
