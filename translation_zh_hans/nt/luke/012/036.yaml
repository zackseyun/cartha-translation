id: LUK.12.36
reference: Luke 12:36
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ὑμεῖς ὅμοιοι ἀνθρώποις προσδεχομένοις τὸν κύριον ἑαυτῶν πότε ἀναλύσῃ ἐκ τῶν γάμων, ἵνα ἐλθόντος καὶ κρούσαντος εὐθέως ἀνοίξωσιν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/036.yaml
  text: And you, be like men waiting for their lord when he returns from the wedding feast, so that when he comes and knocks, they may open to him at once.
translation:
  language: zh_hans
  text: 你们也要像那些等候自己主人从婚宴归来的人：他一来敲门，他们就立刻给他开门。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνθρώποις
  choice: 仆人
  rationale: 该词本义是“人”，但语境描写等候主人归来的家中人员；译作“仆人”可用自然中文明确这里的角色关系，而不改变比喻场景。
- source_word: τὸν κύριον ἑαυτῶν
  choice: 自己的主人
  rationale: κύριος 在这里指家中的主人；“自己的主人”准确保留 ἑαυτῶν 所表达的所属关系，也避免把此处直接处理成神圣称号。
- source_word: προσδεχομένοις
  choice: 等候
  rationale: 表达带着期待等待某人到来的意思；“等候”简洁、庄重且符合现代汉语。
- source_word: ἀναλύσῃ ἐκ τῶν γάμων
  choice: 从婚宴回来
  rationale: ἀναλύω 在此表示离席返回；τὰ γάμοι 在复数形式下可指婚礼庆宴，中文译作“婚宴”最贴合场景。
- source_word: εὐθέως
  choice: 立刻
  rationale: 准确表达“马上、毫不耽搁”的时间意味。
theological_decisions:
- issue: κύριος 是否译作神圣称号“主”
  choice: 主人
  alternative: 主
  rationale: 就比喻内部的叙事角色而言，该词首先指仆人所等候的家主。译作“主人”保留比喻的自然层面，同时不否认上下文中主人可能具有的象征意义。
- issue: 是否在“人”之外明说仆人身份
  choice: 仆人
  alternative: 人
  rationale: 原文只说“人们”，但由“自己的主人”和开门的职责可知其身份是家仆；中文若直译“像等候自己主人的人”较生硬，“仆人”使关系清楚，并未额外限定比喻的神学指向。
translation_notes:
  register: 采用现代、自然而庄重的普通话。以“你们也要像仆人……”承接上文的劝勉；“他一到、敲门”紧凑地对应两个分词，并让“立刻”清楚修饰开门。
