  text: ἀλλὰ καὶ αἱ τρίχες τῆς κεφαλῆς ὑμῶν πᾶσαι ἠρίθμηνται· ⸀μὴ φοβεῖσθε· πολλῶν στρουθίων διαφέρετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/007.yaml
  text: But even the hairs of your head have all been counted[a]. Do not fear[b]; you are worth more than many sparrows.
translation:
  language: zh_hans
  text: 然而，连你们头上的每一根头发都已经数过了。不要害怕；你们比许多麻雀更有价值。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ καὶ
  choice: 然而，就连
  rationale: 既承接上文形成转折，又以“就连”突出加强语气，表达连头发这样细微之物也在眷顾之中。
- source_word: αἱ τρίχες τῆς κεφαλῆς ὑμῶν πᾶσαι
  choice: 你们头上的头发也全都
  rationale: 采用自然的现代汉语表达，并以“全都”保留 πᾶσαι 的周全、无一遗漏之意。
- source_word: ἠρίθμηνται
  choice: 数过了
  rationale: 希腊语完成时被动态表示已经完成而结果仍然有效；“数过了”简洁地保留这一含义，施事者由语境指向上帝。
- source_word: μὴ φοβεῖσθε
  choice: 不要害怕
  rationale: 直接、自然地表达否定命令，比“不要惧怕”更贴近日常现代汉语，同时保持庄重。
- source_word: πολλῶν στρουθίων
  choice: 许多麻雀
  rationale: 保留与紧邻上文相同的具体鸟类意象。
- source_word: διαφέρετε
  choice: 比……贵重
  rationale: 在此语境中表示比较价值；“贵重”传达在上帝眼中的分量，又避免将其窄化为市场价格意义的“值钱”。
theological_decisions:
- issue: 门徒与麻雀的比较价值
  choice: 你们比许多麻雀贵重
  alternative: 你们比许多麻雀更有价值
  rationale: 上下文以由小及大的论证安慰门徒，强调上帝对他们的看顾。“贵重”表达比较价值，但不额外扩展为本文未明说的人论体系。
- issue: 数头发之动作的施事者
  choice: 保留被动表达，不在正文补出“上帝”
  alternative: 上帝连你们头上的头发也全都数过了
  rationale: 原文使用被动态，语境虽清楚暗示上帝，却没有明说施事者；保留这一形式可避免把隐含信息改成明示陈述。
translation_notes:
  register: 采用现代、清楚而庄重的普通话。“然而，就连”保留转折和递进；“数过了”体现完成时的现存结果；全节不使用脚注，因为正文可直接而充分地呈现原文含义。
