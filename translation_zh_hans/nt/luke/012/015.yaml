  text: εἶπεν δὲ πρὸς αὐτούς· Ὁρᾶτε καὶ φυλάσσεσθε ἀπὸ ⸀πάσης πλεονεξίας, ὅτι οὐκ ἐν τῷ περισσεύειν τινὶ ἡ ζωὴ ⸀αὐτοῦ ἐστιν ἐκ τῶν ὑπαρχόντων ⸀αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/015.yaml
  text: Then he said to them, “Watch out and guard yourselves from every kind of greed, because a person’s life does not consist in the abundance of his possessions.”
translation:
  language: zh_hans
  text: 他对他们说：“你们要当心，防备一切的贪心[a]；因为人的生命不在于财物的丰富。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“各种贪婪”或“各样的贪欲”。希腊语πλεονεξία可指贪婪、贪求或强烈的占有欲。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁρᾶτε
  choice: 要当心
  rationale: 该复数命令式在这里具有警告作用；“要当心”既自然，又保留了警醒留意的语气。
- source_word: φυλάσσεσθε
  choice: 防备
  rationale: 该命令式含有保护自己、提防危险的意味；与前面的“要当心”并列，保留原文两个警告性动词的递进作用。
- source_word: ἀπὸ πάσης πλεονεξίας
  choice: 各样的贪欲
  rationale: πλεονεξία可指贪婪、贪求或占有欲；“贪欲”能较广地表达不断想多得的欲望，“各样的”体现πάσης所强调的全面范围。
- source_word: οὐκ ἐν τῷ περισσεύειν τινὶ ἡ ζωὴ αὐτοῦ ἐστιν
  choice: 一个人的生命并不取决于他拥有丰富的财物
  rationale: 原句否定生命以某人财物丰裕为根基或决定因素；“并不取决于”以自然汉语表达“不在于”的关系，而“一个人”保留τινί的不定、泛指意义。
- source_word: ἐκ τῶν ὑπαρχόντων αὐτῷ
  choice: 他拥有……的财物
  rationale: ὑπάρχοντα在此指属于某人的东西，即财物；译文将其与περισσεύειν合并表达为“拥有丰富的财物”，避免生硬重复。
theological_decisions:
- issue: πλεονεξία所指贪欲的范围
  choice: 各样的贪欲
  alternative: 一切贪心；各种贪婪
  rationale: 这里警戒的是广义的贪求和占有欲，不宜缩窄为只觊觎他人财产的某一种欲望。
- issue: 生命与财物丰裕之间的关系
  choice: 生命并不取决于拥有丰富的财物
  alternative: 生命不在丰富的财物中；生命不由财物而来
  rationale: 原文否定财物丰裕构成人生命的根基，但没有在本节中进一步界定“生命”仅指今生或永生；译文保留这一开放性，不作教义性限定。
- issue: 泛指的单数人物
  choice: 一个人的生命……他拥有
  alternative: 人的生命……人所拥有；他的生命……他的财物
  rationale: τινί及相关单数代词是泛指任何人；“一个人……他”在现代汉语中自然清楚，并不把警告限定于男性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“要当心，防备”保留原文两个命令式；后半句以自然汉语重组较复杂的希腊语结构，同时避免把“生命”的含义限定为某一种神学解释。
