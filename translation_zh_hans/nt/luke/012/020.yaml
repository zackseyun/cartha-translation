  text: εἶπεν δὲ αὐτῷ ὁ θεός· ⸀Ἄφρων, ταύτῃ τῇ νυκτὶ τὴν ψυχήν σου ⸀ἀπαιτοῦσιν ἀπὸ σοῦ· ἃ δὲ ἡτοίμασας, τίνι ἔσται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/020.yaml
  text: But God said to him, ‘Fool! This very night your life is being demanded back from you, and the things you prepared—whose will they be?’
translation:
  language: zh_hans
  text: 可是，上帝对他说：“愚昧的人哪！就在今夜，你的性命[a]要被索回；你所预备的这一切，将归谁呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “性命”或译“灵魂”。这个希腊词可按语境指人的生命或灵魂。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄφρων
  choice: 无知的人哪
  rationale: 这是作直接称呼的单数形容词，责备对方缺乏判断力。“无知的人哪”自然有力，同时避免把重点缩减为智力高低。
- source_word: ταύτῃ τῇ νυκτί
  choice: 就在今夜
  rationale: 指示词与时间与格结构强调事情迫在眉睫；“就在今夜”以自然汉语传达这种即时性。
- source_word: ψυχήν
  choice: 性命
  rationale: 本处语境指这个人当夜将失去的生命。“性命”符合死亡语境，也保留该词涉及整个人生命的分量；“灵魂”作为可能译法收入脚注。
- source_word: ἀπαιτοῦσιν ἀπὸ σοῦ
  choice: 要被索回
  rationale: ἀπαιτέω可表示要求交出、索取或索回。希腊文使用未说明主体的复数动词；汉语采用被动表达，不擅自指明执行者，并保留“索回”的追讨意味。
- source_word: ἃ δὲ ἡτοίμασας
  choice: 你所预备的这一切
  rationale: 中性复数关系代词指前文积存的财物。“这一切”在汉语中自然概括这些东西，并保持与上下文的联系。
- source_word: τίνι ἔσται
  choice: 将归谁呢
  rationale: 与格疑问词在这里询问归属。“将归谁呢”简洁自然，保留原文反问的力度。
theological_decisions:
- issue: 死亡语境中ψυχή的译法
  choice: 性命
  alternative: 灵魂
  rationale: 经文重点是此人即将死亡并失去今世生命。“性命”不把ψυχή限定为与身体分离的非物质部分；脚注保留“灵魂”，以呈现希腊词的语义幅度和经文的神学张力。
- issue: ἀπαιτοῦσιν未说明的复数主体
  choice: 采用“要被索回”的无施事被动句
  alternative: 译作“他们要向你索回”或“有人要向你索回”
  rationale: 原文没有明确指出索命者是谁。被动表达避免擅自将主体解释为上帝、天使或其他执行者。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“可是”承接原文转折；“无知的人哪”保留直接责备；分号突出死亡宣告与财物归属问题之间的强烈对照。
