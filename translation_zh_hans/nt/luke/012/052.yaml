  text: ἔσονται γὰρ ἀπὸ τοῦ νῦν πέντε ἐν ⸂ἑνὶ οἴκῳ⸃ διαμεμερισμένοι, τρεῖς ἐπὶ δυσὶν καὶ δύο ἐπὶ τρισίν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/052.yaml
  text: For from now on there will be five in one house divided[a], three against two and two against three,
translation:
  language: zh_hans
  text: 因为从今以后，同一户人家中将有五个人彼此分裂：三人反对两人，两人反对三人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔσονται
  choice: 将要
  rationale: 与后面的状态性表语“彼此分裂”结合，表达未来将出现的局面；汉语无需另译系词。
- source_word: γὰρ
  choice: 因为
  rationale: 保留本句对前文所说“分裂”的解释作用，现代汉语中自然清楚。
- source_word: ἀπὸ τοῦ νῦν
  choice: 从今以后
  rationale: 准确表达从当前时刻起延续向前的时间意义。
- source_word: πέντε ἐν ἑνὶ οἴκῳ
  choice: 一家五口
  rationale: 在后文列举家庭关系的语境中，五人指同一家中的五名成员；此译自然简洁，同时用脚注保留 οἶκος 可指房屋或家庭单位的词义幅度。
- source_word: διαμεμερισμένοι
  choice: 彼此分裂
  rationale: 该完成时被动分词表示因分开而处于分裂状态；“彼此”使家庭成员之间的关系对立在汉语中更明确。
- source_word: τρεῖς ἐπὶ δυσὶν καὶ δύο ἐπὶ τρισίν
  choice: 三人反对两人，两人反对三人
  rationale: ἐπί 加与格在此表示对立；重复“反对”保留原文对称而鲜明的结构。
theological_decisions:
- issue: οἶκος 在家庭分裂语境中应具体译作房屋，还是按社会单位译作家庭
  choice: 正文译为“一家”，并以脚注说明其词义范围
  alternative: 译为“一个屋里”或“一户人家”
  rationale: 下一节明确列出家庭成员关系，因此这里主要指一个家庭单位；但 οἶκος 也可指实际房屋，脚注保留这一真实的词义空间，避免把含义限定得过窄。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“一家五口”符合自然汉语，并保留五名家庭成员这一具体画面；分号式关系改用冒号引出对称说明，使句意清楚。
