source:
  edition: SBLGNT
  text: Ἐν οἷς ἐπισυναχθεισῶν τῶν μυριάδων τοῦ ὄχλου, ὥστε καταπατεῖν ἀλλήλους, ἤρξατο λέγειν πρὸς τοὺς μαθητὰς αὐτοῦ πρῶτον· Προσέχετε ἑαυτοῖς ἀπὸ τῆς ζύμης, ⸂ἥτις ἐστὶν ὑπόκρισις, τῶν Φαρισαίων⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/001.yaml
  text: Meanwhile[a], when the many thousands of the crowd had gathered together, so that they were trampling one another, he began to say first to his disciples, “Beware of the leaven of the Pharisees[b], which is hypocrisy.”
translation:
  language: zh_hans
  text: 这时候[a]，成千上万的群众聚集在一起，以致彼此践踏。耶稣开始先对他的门徒说：“你们要提防法利赛人的酵[b]，就是虚伪。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在这些事发生的时候”或“当时”。
    reason: Ἐν οἷς是承接前文的时间性或处境性表达；正文采用自然的时间性译法。
  - marker: b
    text: “酵”也可译作“酵母”；这里用作比喻，随后由经文解释为“虚伪”。
    reason: 说明ζύμη的字面对应词和比喻用法，同时保留正文的经文意象。
lexical_decisions:
- source_word: Ἐν οἷς
  choice: 这期间
  rationale: 按时间和处境承接上文，现代汉语中自然简洁，不作空间性理解。
- source_word: ἐπισυναχθεισῶν τῶν μυριάδων τοῦ ὄχλου
  choice: 成千上万的人聚集起来
  rationale: μυριάδες既可指以万计，也可泛指极大数目；“成千上万”保留人数众多的意味，又不把数目不必要地精确化。
- source_word: ὥστε καταπατεῖν ἀλλήλους
  choice: 甚至彼此践踏
  rationale: ὥστε加不定式在此表达实际结果；“甚至”简洁地体现人群拥挤所造成的严重后果。
- source_word: ἤρξατο λέγειν πρὸς τοὺς μαθητὰς αὐτοῦ πρῶτον
  choice: 耶稣先对他的门徒说
  rationale: 将πρῶτον理解为说话对象的次序或优先性；补出“耶稣”符合汉语叙事需要，所指明确。
- source_word: Προσέχετε ἑαυτοῖς ἀπό
  choice: 你们要提防
  rationale: 自然表达警戒并保护自己的反身含义，避免生硬直译为“为自己留意”。
- source_word: ζύμη
  choice: 酵
  rationale: 保留经文中的发酵物意象及其互文色彩；“酵”比直接释为“影响”更忠实于比喻。
- source_word: ἥτις ἐστὶν ὑπόκρισις
  choice: 就是虚伪
  rationale: 保留原文对比喻所作的直接说明；ὑπόκρισις在此指言行或内外不一的虚伪。
- source_word: τῶν Φαρισαίων
  choice: 法利赛人的
  rationale: 以自然汉语表达所属兼具特征描述的属格关系。
theological_decisions:
- issue: “酵”的比喻作用
  choice: 保留“酵”的形象，并按原文明确为“虚伪”
  alternative: 直接译成“法利赛人的影响”或“教导”
  rationale: 原文本身解释该比喻为虚伪，因此无须用更窄的神学解释替换其文学形象。
- issue: πρῶτον的修饰范围
  choice: 译为“先对他的门徒说”
  alternative: 译为“他首先说”
  rationale: 原文可容许话语次序或听众优先两种理解；当前语序较自然地保留先向门徒说话的叙事重点，但不推断后续讲话的具体结构。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句子分为背景叙述与直接引语，避免照搬希腊语长句；保留“酵”的圣经比喻，但以脚注帮助普通读者理解。
