  text: ⸂κἂν ἐν τῇ δευτέρᾳ κἂν⸃ ἐν τῇ τρίτῃ φυλακῇ ἔλθῃ καὶ εὕρῃ οὕτως, μακάριοί ⸀εἰσιν ἐκεῖνοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/038.yaml
  text: Even if he comes in the second watch[a], or even in the third, and finds them so[b], blessed are those servants.
translation:
  language: zh_hans
  text: 即使主人在夜间第二更来，或即使在第三更来，看见他们仍然这样，那些仆人就有福了[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“那些人有福了”；“那些人”指上下文中的仆人。第二更和第三更指夜间的守更时段。
    reason: lexical_alternative
lexical_decisions:
- source_word: κἂν ... κἂν
  choice: 即使……或……
  rationale: 重复的κἄν表达让步性的未定条件；中文用“即使……或……”自然保留“无论来得多晚”的强调。
- source_word: δευτέρᾳ ... τρίτῃ φυλακῇ
  choice: 夜里第二更……第三更
  rationale: φυλακή在此指夜间的守更时段。“更”是现代汉语仍可理解的传统计时表达；补出“夜里”可避免误解。
- source_word: ἔλθῃ
  choice: 才来
  rationale: 虚拟语气处在未定条件中，指将来可能发生的来到；“来”表达其基本意义，“才”自然显出第二更或第三更的迟晚，但不把时间确定下来。
- source_word: εὕρῃ οὕτως
  choice: 看见他们仍是这样
  rationale: οὕτως回指上一节仆人警醒等候的状态；按中文习惯补出语境所含的宾语“他们”，“仍”体现该状态持续到主人来到时。
- source_word: μακάριοί
  choice: 有福
  rationale: μακάριος表示处于蒙福、可称羡的境况。“有福”保留圣经语体和神学分量，又符合现代中文。
- source_word: ἐκεῖνοι
  choice: 那些仆人
  rationale: 原文直译为“那些人”，其所指是上文的仆人。正文补明所指以利理解，并用脚注交代原文形式。
theological_decisions:
- issue: 是否补出ἐκεῖνοι的所指
  choice: 那些仆人
  alternative: 那些人
  rationale: 希腊文仅用指示代词，但紧接的上下文清楚指向主人的仆人。补出“仆人”消除中文歧义，不增加新的神学主张；脚注保留原文字面信息。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准普通话。“主人”由上下文补出，使本节独立阅读时主语清楚；“更”保留夜间守更的历史背景，并以脚注说明。句末“有福了”延续路加福祉宣告的圣经语体。
