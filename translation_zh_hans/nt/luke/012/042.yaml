id: LUK.12.42
reference: Luke 12:42
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ⸂καὶ εἶπεν⸃ ὁ κύριος· Τίς ἄρα ἐστὶν ὁ πιστὸς οἰκονόμος, ⸀ὁ φρόνιμος, ὃν καταστήσει ὁ κύριος ἐπὶ τῆς θεραπείας αὐτοῦ τοῦ διδόναι ἐν καιρῷ ⸀τὸ σιτομέτριον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/042.yaml
  text: And the Lord said[a], “Who then is the faithful and prudent steward[b], whom the master will appoint over his household staff to give them their food allowance at the proper time?”
translation:
  language: zh_hans
  text: 主说：“那么，谁是那忠信又精明[a]的管家，主人要派他管理自己的众仆役，按时把他们应得的口粮[b]分给他们呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “精明”也可译作“有见识”或“明智”。
    reason: lexical_alternative
  - marker: b
    text: 原文指按量分配的粮食份额，即分给各仆人的定量食物。
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: 主／主人
  rationale: 叙事层面的ὁ κύριος指耶稣，译作“主”；比喻内部的ὁ κύριος指家主，译作“主人”。两处原文用词相同，中文依语境区分可避免指代混淆。
- source_word: πιστός
  choice: 忠信
  rationale: 此处强调受托之人在履行职责上可靠、忠诚；“忠信”兼顾忠诚与可信赖之意。
- source_word: οἰκονόμος
  choice: 管家
  rationale: 指受托管理家宅及其人员、物资的人；“管家”自然保留家庭管理和受托责任的语境。
- source_word: φρόνιμος
  choice: 精明
  rationale: 该词表示具有实际智慧和良好判断力；“精明”在管理职责的语境中通顺，并以脚注保留其他可能译法。
- source_word: καταστήσει
  choice: 要派他管理
  rationale: καθίστημι在此指把人安置在负责的职位上；结合ἐπὶ短语译作“派他管理”，清楚表达委任和监管。
- source_word: θεραπεία
  choice: 众仆役
  rationale: 此处不是抽象的“服侍”或“医治”，而是家中受管理的一群侍从或仆人；“众仆役”表达其集合含义。
- source_word: ἐν καιρῷ
  choice: 按时
  rationale: 表示在合宜或规定的时间；“按时”简洁自然，也符合定时分配食物的情境。
- source_word: σιτομέτριον
  choice: 应得的口粮
  rationale: 该词本指按量分配的粮食份额。“口粮”保留定量食物的含义，“应得的”体现分配给各人的份额；脚注说明其字面背景。
theological_decisions:
- issue: 同一节两处κύριος的译法
  choice: 称说话的耶稣为“主”，称比喻中的家主为“主人”
  alternative: 两处都译作“主”
  rationale: 原文两处使用同一个词，但所处叙事层次不同。依语境分别译出，可保持称耶稣为“主”的称号，同时使比喻中的家宅关系清楚，不对两者之间可能存在的象征联系作额外解释。
- issue: 问句是直接回答还是引导性反问
  choice: 保留“谁是……呢？”的开放问句形式
  alternative: 改写为命令或断言，如“你们要作忠信的管家”
  rationale: 原文以Τίς ἄρα提出问题，并未在本节直接点明彼得或某一特定群体；保留问句可避免提前限定其适用对象。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“忠信又精明”保持两个并列品格；“众仆役”体现θεραπεία的集合意义；“按时把他们应得的口粮分给他们”自然呈现委任管家的具体职责。脚注标记均置于对应词语之后。
