  text: καὶ ἐρῶ τῇ ψυχῇ μου· Ψυχή, ἔχεις πολλὰ ἀγαθὰ κείμενα εἰς ἔτη πολλά· ἀναπαύου, φάγε, πίε, εὐφραίνου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/019.yaml
  text: And I will say to my soul[a], ‘Soul, you have many good things laid up for many years. Rest, eat, drink[b], be merry.’
translation:
  language: zh_hans
  text: 我会对我的灵魂[a]说：‘灵魂哪，你有许多好东西，已储存起来，可供多年之用。歇息吧，吃吧，喝吧，快乐吧！’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灵魂”所译的希腊语 ψυχή，按语境也可指“自己”或“生命”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρῶ
  choice: 我要……说
  rationale: 直译将来时，同时符合现代汉语表达计划或意愿的自然方式。
- source_word: ψυχῇ / Ψυχή
  choice: 灵魂
  rationale: 保留 ψυχή 的词汇和自我呼语的修辞效果；此处并非要界定人的构成，因此以脚注注明“自己、生命”等语境性译法。
- source_word: ἀγαθὰ
  choice: 好东西
  rationale: 保持原词的宽泛含义；上下文表明这些是富翁储存的物质财富，但正文不将词义缩窄为“财物”。
- source_word: κείμενα
  choice: 积存着
  rationale: 传达这些东西已经存放备用的状态，也符合现代汉语习惯。
- source_word: εἰς ἔτη πολλά
  choice: 够用许多年
  rationale: 自然表达所积存之物可供未来多年使用的持续意义；“够用”是由储备语境明确引出的汉语表达。
- source_word: ἀναπαύου
  choice: 歇息吧
  rationale: 表达停止劳碌、安享休息的命令语气，简洁而不陈旧。
- source_word: φάγε
  choice: 吃吧
  rationale: 直接传达简单的命令式，并用“吧”形成自然的自我劝说语气。
- source_word: πίε
  choice: 喝吧
  rationale: 直接传达简单的命令式，与前后并列动词保持一致。
- source_word: εὐφραίνου
  choice: 快乐吧
  rationale: 保留“欢喜、快活”的基本意义，又不把正文过度解释为特定形式的庆祝或放纵。
theological_decisions:
- issue: 比喻中的自我呼语应如何翻译 ψυχή
  choice: 灵魂
  alternative: 自己；生命
  rationale: “灵魂”保留原文重复呼语的文学和神学张力，但不借此断言技术性的灵魂观；脚注明示该词可随语境指整个人或生命。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留原文连续命令的节奏，并以“吧”使自我劝说在汉语中自然。
