review_pass:
  verdict: revise
  source_fidelity: 原译遗漏了 μου（“我的”），因此未完整表达“我告诉你们，我的朋友们”这一称呼。末句基本传达了人在杀害身体之后能力受限的意思，但“再也不能做什么”在汉语中稍显笼统；“不能再做别的事”更准确对应 περισσότερόν τι，且不加入下一节所说的“灵魂”。
  naturalness: “你们这些朋友”在现代汉语中容易被理解为泛指“你们这些朋友”，也不如“你们，我的朋友们”自然。“杀害身体”搭配略生硬；“杀害肉身”在庄重的现代圣经语体中更顺畅，并保留身体性的含义。
  terminology: 将 σῶμα 译为“肉身”是此处自然且准确的表达，强调可被人杀害的身体，不引入“灵魂”。保留“不要害怕”及“我的朋友们”的亲切、庄重称呼。
  issues:
  - severity: medium
    issue: 遗漏“我的”
    rationale: 希腊文 τοῖς φίλοις μου 明确包含第一人称所属代词 μου。原文“你们这些朋友”没有表达耶稣称他们为“我的朋友们”。
  - severity: low
    issue: “杀害身体”搭配不够自然
    rationale: 中文中“杀害肉身”较能自然表达“杀死身体”的意思，同时保持原文只涉及肉身、未明说灵魂的限度。
  - severity: low
    issue: 末句“再也不能做什么”不够贴合“任何进一步的事”
    rationale: 更多/进一步（περισσότερόν τι）的限制可更清楚地译为“不能再做别的事”，既保留其能力止于杀害肉身，也不扩大为神学解释。
  revised_text: 但我告诉你们，我的朋友们：不要害怕那些杀害肉身的人；在那以后，他们不能再做别的事。
