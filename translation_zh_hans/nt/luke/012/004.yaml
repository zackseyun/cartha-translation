revisions:
- from: 但我告诉你们这些朋友：不要怕那些杀害身体、之后再也不能做什么的人。
  to: 但我告诉你们，我的朋友们：不要害怕那些杀害肉身的人；在那以后，他们不能再做别的事。
  rationale: 修订补足 μου 所表达的“我的”，并以自然的现代汉语重组同位称呼。将“身体”调整为“肉身”，使“杀害”搭配通顺，同时不添加原文未出现的“灵魂”。末句明确“不能再做别的事”的进一步限制，忠实保留原文的范围与未展开的神学张力。
