  text: Λέγω δὲ ὑμῖν τοῖς φίλοις μου, μὴ φοβηθῆτε ἀπὸ τῶν ἀποκτεινόντων τὸ σῶμα καὶ μετὰ ταῦτα μὴ ἐχόντων περισσότερόν τι ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/004.yaml
  text: But I say to you[a], my friends, do not fear those who kill the body and after that have nothing more they can do.
translation:
  language: zh_hans
  text: 但我告诉你们，我的朋友们：不要害怕那些杀害肉身的人；在那以后，他们不能再做别的事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Λέγω δὲ
  choice: 但我告诉
  rationale: δέ在这里温和地承接并转换话题；“但”保留轻微的转折，“我告诉”自然表达λέγω在郑重教导中的语气。
- source_word: ὑμῖν τοῖς φίλοις μου
  choice: 你们这些朋友
  rationale: τοῖς φίλοις μου与ὑμῖν构成同位说明，表明耶稣称受话者为自己的朋友；此译同时保留第二人称复数和亲切称呼。
- source_word: μὴ φοβηθῆτε ἀπὸ τῶν ἀποκτεινόντων
  choice: 不要怕那些杀害……的人
  rationale: μή加不定过去时虚拟式构成禁止语气；ἀπό在φοβέομαι之后标明惧怕的对象。现在分词按泛指处理，而非限定为当时正在杀人的人。
- source_word: τὸ σῶμα
  choice: 身体
  rationale: σῶμα在此指人的肉身；不增添原文没有明说的“灵魂”。
- source_word: καὶ μετὰ ταῦτα
  choice: 之后
  rationale: 该短语表示时间次序，即杀害身体以后；“之后”简洁自然。
- source_word: μὴ ἐχόντων περισσότερόν τι ποιῆσαι
  choice: 再也不能做什么
  rationale: 字面结构是“没有任何更多的事可做”，语义重心在其能力止于杀害身体；此译以现代汉语自然表达这种限制。
theological_decisions:
- issue: 人杀害身体之后的能力范围
  choice: 只说明他们杀害身体后不能再做什么
  alternative: 明确补译为“不能杀害灵魂”
  rationale: 本节没有明说“灵魂”；虽然下一节进一步呈现神权柄的对比，本译文不把后文的解释提前加入本节。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你们这些朋友”保留同位称呼；全句避免文言化，也不添加原文未明说的神学对象。
