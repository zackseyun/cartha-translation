  text: οὐχὶ πέντε στρουθία ⸀πωλοῦνται ἀσσαρίων δύο; καὶ ἓν ἐξ αὐτῶν οὐκ ἔστιν ἐπιλελησμένον ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/006.yaml
  text: Are not five sparrows sold for two assaria? Yet not one of them is forgotten before God[a][b].
translation:
  language: zh_hans
  text: 五只麻雀不是卖两枚阿萨里昂吗？然而，在神面前，连一只也没有被忘记。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“卖两枚小铜币”。“阿萨里昂”是古罗马的一种小铜币。
    reason: cultural_note
  - marker: b
    text: 或译：“在神眼中，连一只也没有被忽略。”
    reason: lexical_alternative
lexical_decisions:
- source_word: στρουθία
  choice: 麻雀
  rationale: 该词可泛指小鸟，但在此语境中通常指麻雀；译作“麻雀”具体、自然，也符合上下文所说价格低廉的小鸟。
- source_word: πωλοῦνται
  choice: 卖
  rationale: 原文为现在时被动形式；汉语“卖两个……”在反问句中自然表达“被售卖”的意思，无须使用生硬的被动标记。
- source_word: ἀσσαρίων δύο
  choice: 两个阿萨里昂
  rationale: 保留原文所指罗马小铜币的专名，避免用现代币值造成不准确的等同；脚注补充说明。
- source_word: ἐπιλελησμένον
  choice: 被忘记
  rationale: 完成时分词表达处于被忘记的状态；“被忘记”贴近词义，并保留原文神学表述，没有扩展为更完整的护理或照顾概念。
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: 在神面前
  rationale: 直接对应原文，既可表达处于神的注视之下，也保留其临在或关系层面的含义。
- source_word: οὐχὶ ... ;
  choice: 不是……吗？
  rationale: 原文以期待肯定回答的否定疑问句发问；现代汉语“不是……吗？”准确传达其反问语气。
- source_word: καὶ ἓν ἐξ αὐτῶν οὐκ
  choice: 然而……连一只也没有
  rationale: “连一只也没有”传达对单独一只的强调；“然而”自然呈现低廉售价与神不忘记它们之间的语义对照。
theological_decisions:
- issue: 神的记念与护理用语
  choice: 在神面前，连一只也没有被忘记
  alternative: 在神眼中，连一只也没有被忽略
  rationale: “被忘记”最贴近ἐπιλελησμένον，并强调神对微小受造物的记念；不把经文进一步解释为一套完整的护理教义，也不削弱为仅仅“没有忽略”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“阿萨里昂”保留古代钱币名称，并以脚注解释；正文使用自然的汉语反问句和“连……也……”结构，同时保留“在神面前”和“被忘记”的原文意象。
