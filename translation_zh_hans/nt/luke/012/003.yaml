id: LUK.12.3
reference: Luke 12:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἀνθ’ ὧν ὅσα ἐν τῇ σκοτίᾳ εἴπατε ἐν τῷ φωτὶ ἀκουσθήσεται, καὶ ὃ πρὸς τὸ οὖς ἐλαλήσατε ἐν τοῖς ταμείοις κηρυχθήσεται ἐπὶ τῶν δωμάτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/003.yaml
  text: Therefore[a], whatever you said in the darkness will be heard in the light, and what you spoke into the ear in the inner rooms will be proclaimed on the housetops.
translation:
  language: zh_hans
  text: 所以，你们在黑暗中所说的一切，将要在光明中被听见；你们在内室里附耳所说的，也将要在屋顶上[a]被宣告出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从屋顶上宣告。”这里描绘的是人在平坦的屋顶上公开宣告的景象。
    reason: 说明ἐπὶ τῶν δωμάτων可按语境译为“从屋顶上”，并保留古代平顶房屋上的公开宣告意象。
lexical_decisions:
- source_word: ἀνθ’ ὧν
  choice: 因此
  rationale: 这一短语在此承接上文，表示推论；“因此”自然地传达了这种话语关系。
- source_word: ὅσα
  choice: 所说的一切
  rationale: 表达不定关系词的周全范围，指凡在隐秘中说过的话。
- source_word: ἐν τῇ σκοτίᾳ / ἐν τῷ φωτί
  choice: 在暗中 / 在光明中
  rationale: 保留原文黑暗与光明的鲜明对照，也兼顾隐秘与公开的比喻含义。
- source_word: ἀκουσθήσεται
  choice: 要……被人听见
  rationale: 保留将来被动语态；补出泛指施事“人”，使现代汉语表达自然，但不限定具体听者。
- source_word: πρὸς τὸ οὖς
  choice: 附耳
  rationale: 以简洁、可理解的汉语再现贴近耳边私语的生动画面，不擅自指定听话者。
- source_word: ἐν τοῖς ταμείοις
  choice: 在内室里
  rationale: ταμεῖον可指内室、储藏室或隐密房间；上下文强调私下言谈，“内室”既贴近词义，也不把用途限定为储藏。
- source_word: κηρυχθήσεται
  choice: 要……被宣扬出来
  rationale: 传达公开传报、使众人知晓的含义，并保留原文被动形式，不缩窄为宗教性的“传道”。
- source_word: ἐπὶ τῶν δωμάτων
  choice: 在房顶上
  rationale: 贴近原文介词和复数名词，保留古代平顶房屋上公开宣告的场景。
theological_decisions:
- issue: 隐秘之事被揭露的性质与时间
  choice: 译文只表明私下所说的必将公开，不具体说明这是末日审判、历史中的揭露，还是上帝护理中的显明。
  alternative: 明确译作末日审判时的揭露，或仅指今世对假冒为善的揭发。
  rationale: 上下文涉及隐藏之事被显露，但本节没有限定显露的时间和机制；保留这种开放性可避免替原文消解神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“暗中／光明中”保留原文修辞对照；“附耳”略带书面色彩，但在当代汉语中清楚自然。脚注标记置于其实际说明的“房顶上”之后。
