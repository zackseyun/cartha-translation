revisions:
- from: 因此，你们在暗中所说的一切，都要在光明中被人听见；你们在内室里附耳所说的，也要在房顶上[a]被宣扬出来。
  to: 所以，你们在黑暗中所说的一切，将要在光明中被听见；你们在内室里附耳所说的，也将要在屋顶上[a]被宣告出来。
  rationale: 修订仅加强原文的黑暗／光明对照，去除汉语中非必要的施事补足，并校正脚注对“宣告”动作的表达；不改变本节对揭露的时间、方式或神学含义所保留的开放性。
