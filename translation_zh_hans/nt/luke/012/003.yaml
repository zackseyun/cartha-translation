  - severity: low
    issue: 脚注“从房顶上传开”未充分体现“公开宣告”
    rationale: κηρυχθήσεται意为被公开宣告、传报；“传开”容易表示消息自然流传。应改为“从屋顶上宣告”，以保留主动公开发布的画面。
