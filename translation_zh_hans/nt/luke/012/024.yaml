source:
  edition: SBLGNT
  text: κατανοήσατε τοὺς κόρακας ὅτι οὐ σπείρουσιν οὐδὲ θερίζουσιν, οἷς οὐκ ἔστιν ταμεῖον οὐδὲ ἀποθήκη, καὶ ὁ θεὸς τρέφει αὐτούς· πόσῳ μᾶλλον ὑμεῖς διαφέρετε τῶν πετεινῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/024.yaml
  text: 'Consider the ravens: they neither sow nor reap[a]; they have neither storeroom nor barn, and God feeds them[c][b]. How much more valuable are you than the birds!'
translation:
  language: zh_hans
  text: “想想渡鸦[a]：它们不撒种，也不收割；既没有储藏室，也没有仓房[b]，上帝却养活它们。你们比飞鸟贵重得多[c]！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“留心观察渡鸦”或“认真思想渡鸦”。
    reason: lexical_alternative
  - marker: b
    text: “储藏室”译自ταμεῖον，“仓房”译自ἀποθήκη；希腊原文使用了两个不同的储藏场所用语。
    reason: lexical_alternative
  - marker: c
    text: 或译：“你们远胜过飞鸟！”这里的“胜过”在上下文中主要指价值或重要性。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατανοήσατε
  choice: 仔细想想
  rationale: 该不定过去时命令语气要求人专注观察并加以思考，不只是看一眼。“仔细想想”自然地兼顾观察与反思。
- source_word: τοὺς κόρακας
  choice: 乌鸦
  rationale: κόραξ指鸦科的大型黑鸟，传统上常译为“乌鸦”；这里保留具体鸟类形象，不泛化为“飞鸟”。
- source_word: οὐ σπείρουσιν οὐδὲ θερίζουσιν
  choice: 不撒种，也不收割
  rationale: 直接保留两个相对的农事动词及简洁的并列结构。
- source_word: ταμεῖον
  choice: 储藏室
  rationale: 指用于存放物品的内室或储藏空间；译为“储藏室”可与后面的ἀποθήκη有所区别。
- source_word: ἀποθήκη
  choice: 仓房
  rationale: 指储存农产品等物品的仓库；“仓房”与“储藏室”构成自然且不重复的词组。
- source_word: τρέφει
  choice: 养活
  rationale: 表达上帝持续供养乌鸦，使其得以生存；在本语境中比单说“喂食”更自然。
- source_word: πόσῳ μᾶλλον
  choice: 得多
  rationale: 与比较结构“比……贵重”结合，简洁表达从较小者推至较大者的强烈比较。
- source_word: διαφέρετε
  choice: 贵重
  rationale: 该动词本可表示“不同”或“胜过”，在此比较语境中指价值或重要性高于飞鸟；“贵重”保留价值层面的含义。
- source_word: τῶν πετεινῶν
  choice: 比飞鸟
  rationale: πετεινόν是飞禽的统称；前文具体提到乌鸦，此处则扩大为对飞鸟整体的比较。
theological_decisions:
- issue: 上帝护理受造物
  choice: 上帝却养活它们
  alternative: 上帝也喂养它们
  rationale: 原文明确以上帝主动供养乌鸦为从小到大的论证基础。“却”凸显乌鸦不耕种、不储藏与上帝仍供养它们之间的对照，但不扩展为本节未明说的系统性教义。
- issue: 人相对于飞鸟的价值
  choice: 你们比飞鸟贵重得多
  alternative: 你们比飞鸟强得多
  rationale: διαφέρω本身可表达不同或胜过；上下文中的论证最自然地指人在上帝眼中的价值更高。脚注保留较宽泛译法，避免把词义可能性完全封闭。
translation_notes:
  register: 采用现代、庄重而口语自然的普通话。“仔细想想”适合耶稣直接劝告听众的语气；分号保留原文两组否定陈述的层次，末尾感叹号体现该比较句的强烈修辞力量。
