  text: ἀληθῶς λέγω ὑμῖν ὅτι ἐπὶ πᾶσιν τοῖς ὑπάρχουσιν αὐτοῦ καταστήσει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/044.yaml
  text: Truly I tell you that he will appoint him over all that he has[a].
translation:
  language: zh_hans
  text: 我实在告诉你们，主人将派他管理主人所有的一切[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“主人所有的财产”或“主人所有的产业”。
    reason: 词汇替代：πᾶσιν τοῖς ὑπάρχουσιν αὐτοῦ可概括指主人所拥有的一切，也可较具体地表达为财产或产业。
lexical_decisions:
- source_word: ἀληθῶς
  choice: 实在
  rationale: 强调话语的真实性与郑重语气；“实在”庄重自然，也符合耶稣宣告式话语的表达。
- source_word: λέγω ὑμῖν
  choice: 我告诉你们
  rationale: 保留第一人称和复数受话者，并以现代汉语自然表达这一常见的宣告公式。
- source_word: ἐπὶ πᾶσιν τοῖς ὑπάρχουσιν αὐτοῦ
  choice: 管理自己所有的一切
  rationale: ἐπί与与格在此表示管辖；τοῖς ὑπάρχουσιν指属于主人的一切。“管理……所有的一切”既表达受托管辖，也避免把范围仅限于物质财产。
- source_word: καταστήσει
  choice: 要派
  rationale: 此处表示将某人立在负责管理的位置上。“派……管理”在现代汉语中清楚传达任命和托付职责的含义。
- source_word: αὐτόν
  choice: 他
  rationale: 保留希腊文阳性单数，指上下文比喻中的忠信管家。
theological_decisions:
- issue: 比喻人物的阳性单数指称
  choice: 保留“他”
  alternative: 改用“这个人”等较中性的说法
  rationale: 原文以阳性单数指代比喻中的管家；保留“他”忠实呈现人物设定，而不把这种语法形式扩大解释为教义上的性别限制。
- issue: αὐτοῦ所指的主人
  choice: 在正文中明示为“主人”
  alternative: 按字面只译作“他的”
  rationale: 原文代词的所指由紧接的上文明确为主人。汉语若连续使用“他……他的”容易误解成管家自己的财物，因此明示“主人”以自然呈现原有指向，不改变比喻关系。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“我实在告诉你们”保留郑重宣告的语气；“派他管理”比生硬的“立他在……之上”更符合现代汉语，同时保留任命与管辖之意。
