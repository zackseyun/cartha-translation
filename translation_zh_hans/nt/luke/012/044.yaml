  source_fidelity: 原文意为“我实在告诉你们，他将立/派那人管理他所有的一切”。草稿准确保留了郑重宣告、将来的任命、受任者（他）及管理范围。“主人”虽为根据紧邻上下文补出的指称，但能避免汉语代词链造成的误解，属可接受的显明化。
