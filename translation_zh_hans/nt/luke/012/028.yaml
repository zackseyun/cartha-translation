id: LUK.12.28
reference: Luke 12:28
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἰ δὲ ⸂ἐν ἀγρῷ τὸν χόρτον ὄντα σήμερον⸃ καὶ αὔριον εἰς κλίβανον βαλλόμενον ὁ θεὸς οὕτως ⸀ἀμφιέζει, πόσῳ μᾶλλον ὑμᾶς, ὀλιγόπιστοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/028.yaml
  text: But if God so clothes the grass in the field[a], which is here today and tomorrow is thrown into an oven, how much more will he clothe you[b], you of little faith!
translation:
  language: zh_hans
  text: 神若这样给田野里的草[a]穿上衣裳——草今天还在，明天就被扔进烤炉[b]——岂不更要给你们穿上衣裳吗？你们这些信心不足的人哪！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “草”也可译作“草木”或“草本植物”。
    reason: lexical_alternative
  - marker: b
    text: 这里的“烤炉”指烘烤食物的炉子；晒干的田野草木可以用作燃料。
    reason: cultural_note
lexical_decisions:
- source_word: χόρτον
  choice: 草
  rationale: χόρτος可指草或草本植物；本节强调田野植物生命短暂并可晒干作燃料。“草”简明自然，也保留原词较宽泛的日常意象。
- source_word: ἐν ἀγρῷ
  choice: 田野里的
  rationale: 表达草生长在野外田地中的一般场景，不把不定的场所过度具体化。
- source_word: ὄντα σήμερον καὶ αὔριον ... βαλλόμενον
  choice: 今天还在，明天就被扔进
  rationale: 将希腊语紧凑的分词结构自然展开，保留“今天—明天”的鲜明对照以及草转瞬即逝的意味；“就”体现变化之迅速，并未增添结果解释。
- source_word: κλίβανον
  choice: 烤炉
  rationale: κλίβανος指烘烤食物的炉子，常为烤饼炉；“烤炉”比“火炉”或“熔炉”更准确，也避免现代工业联想。
- source_word: ἀμφιέζει
  choice: 给……穿上衣裳
  rationale: 该动词意为给某物穿衣、装扮。此译保留上下文中植物如同披上衣裳的拟人比喻，也自然连接神对人的眷顾。
- source_word: πόσῳ μᾶλλον
  choice: 岂不更要……吗
  rationale: 以现代汉语反问句表达由小到大的推论，准确传达“何况／更何况”的论证力度。
- source_word: ὀλιγόπιστοι
  choice: 你们这些信心不足的人哪
  rationale: 保留呼格的直接称呼和劝诫意味；“信心不足”比生硬的“小信者”自然，又不把它解释为完全没有信心。
- source_word: εἰ δὲ
  choice: 若
  rationale: 用条件结构承接上文并推进论证；汉语中不必机械补出转折连词，也能自然呈现原句的论证关系。
- source_word: ὁ θεὸς
  choice: 神
  rationale: 直接对应明确的主语ὁ θεός，采用简洁庄重且通行的现代中文称谓。
- source_word: οὕτως
  choice: 这样
  rationale: 自然表达神以所述方式给草披上衣裳，并承接前文对田野植物装饰之美的描述。
theological_decisions:
- issue: ὀλιγόπιστοι作为耶稣对门徒称呼的语气和含义
  choice: 译作“你们这些信心不足的人哪”，作为直接但不过度强化的责备
  alternative: 可译“你们这些小信的人哪”或“信心微小的人哪”
  rationale: 该词指出他们对神眷顾的信靠有所欠缺，却没有断言他们全无信心，也不是关于得救信心或背道的技术性判断。此译保留责备与劝勉并存的张力。
- issue: πόσῳ μᾶλλον ὑμᾶς中省略谓语的补足
  choice: 根据前句ἀμφιέζει补出“给你们穿上衣裳”
  alternative: 保留省略，译作“何况你们呢”
  rationale: 希腊语可自然省略重复谓语，现代汉语若仅说“何况你们”也可理解，但补出谓语更清楚，并没有超出原文所要求的意义。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。破折号呈现原文插入式的时间对照，使主干条件句和反问句清晰可读；末句保留耶稣直接称呼门徒的劝诫语气。所有脚注标记均置于对应词语之后。
