  text: δοκεῖτε ὅτι εἰρήνην παρεγενόμην δοῦναι ἐν τῇ γῇ; οὐχί, λέγω ὑμῖν, ἀλλ’ ἢ διαμερισμόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/051.yaml
  text: Do you think that I came to give peace on the earth? No[a], I tell you[b], but rather division.
translation:
  language: zh_hans
  text: 你们以为我来，是要在地上[b]带来[a]和平吗？不，我告诉你们，而是要带来分裂。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊语动词直译为“给”；按汉语习惯也可译作“带来”。
    reason: lexical_alternative
  - marker: b
    text: “在地上”也可译作“在这地”；这里更可能是范围较广的“地上”。
    reason: lexical_alternative
lexical_decisions:
- source_word: δοκεῖτε
  choice: 你们以为
  rationale: 第二人称复数，用反问直接挑战听众原有的看法；“你们以为”自然、明确。
- source_word: εἰρήνην
  choice: 和平
  rationale: 保留该词的宽泛含义；本段语境侧重人与人、尤其家庭成员之间的和睦，而不只指内心安宁。
- source_word: παρεγενόμην
  choice: 我来
  rationale: 此处表示耶稣来到世上并带有随后不定式所表达的目的；“我来”符合现代汉语表达。
- source_word: δοῦναι
  choice: 赐下
  rationale: 直译为“给”；“赐下”适合耶稣所说的“赐下和平”，也保留动作的施予含义。后半句为使省略结构在汉语中清楚，以“带来”承接。
- source_word: ἐν τῇ γῇ
  choice: 在地上
  rationale: γῆ既可指“大地、世界”，也可指“土地、地区”；此处较广的范围更合乎上下文，故译“在地上”。
- source_word: οὐχί
  choice: 不
  rationale: 简洁而有力地回答前面的反问，保留原文鲜明的否定。
- source_word: λέγω ὑμῖν
  choice: 我告诉你们
  rationale: 自然呈现福音书中常见的郑重提示语，并保留对听众的直接强调。
- source_word: ἀλλ’ ἢ
  choice: 而是
  rationale: 清楚表达“不是……而是……”的强烈对比。
- source_word: διαμερισμόν
  choice: 分裂
  rationale: 该名词指分开、对立或不和；下文具体描述家庭成员彼此分裂，因此“分裂”最直接且不过度限定。
theological_decisions:
- issue: 是否为避免与其他和平经文形成张力而弱化本节的对比
  choice: 保留“和平”与“分裂”之间鲜明、直接的对比。
  alternative: 译成较弱的“纷争”，或加上解释，说明分裂只是偶然结果。
  rationale: 原文刻意使用强烈对照；下文表明耶稣所说的是他的使命在人际和家庭中造成的分化。译文不应自行消解这句话与其他和平主题之间的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。主句保留反问和断然否定；末句补出“带来”，使希腊文省略谓语的对比结构在汉语中自然清楚，同时不弱化“分裂”的冲击力。
