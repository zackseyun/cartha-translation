  text: Λέγω δὲ ὑμῖν, πᾶς ὃς ἂν ⸀ὁμολογήσῃ ἐν ἐμοὶ ἔμπροσθεν τῶν ἀνθρώπων, καὶ ὁ υἱὸς τοῦ ἀνθρώπου ὁμολογήσει ἐν αὐτῷ ἔμπροσθεν τῶν ἀγγέλων τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/008.yaml
  text: And I tell you[a], everyone who confesses me before men, the Son of Man also will confess before the angels of God.
translation:
  language: zh_hans
  text: 我告诉你们：凡在人面前承认我的，人子也要在上帝的天使面前承认他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Λέγω δὲ ὑμῖν
  choice: 我又告诉你们
  rationale: λέγω是郑重的现在时陈述；δέ在此轻微承接上文，用“又”自然地表达延续，不强化为明显转折。
- source_word: πᾶς ὃς ἂν
  choice: 凡……的
  rationale: 这一结构表达范围普遍而对象不定的条件，“凡……的”既自然，也保留其普遍性。
- source_word: ὁμολογήσῃ … ὁμολογήσει
  choice: 承认……也要承认
  rationale: ὁμολογέω在此指公开承认或表明认同；前后采用同一动词，保留人与人子之间相应的行动。
- source_word: ἐν ἐμοὶ … ἐν αὐτῷ
  choice: 承认我的……承认他
  rationale: ἐν加与格与ὁμολογέω连用时，按汉语习惯译为直接宾语最通顺；脚注保留原文形式及其可能引起的理解空间。
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: 在人们面前
  rationale: ἔμπροσθεν表示“在……面前”；ἀνθρώπων在这里泛指人类或众人，并非专指男性，因此译作“人们”。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人子
  rationale: 保留耶稣这一具有《但以理书》背景的自称，不作解释性改写。
- source_word: ἔμπροσθεν τῶν ἀγγέλων τοῦ θεοῦ
  choice: 在上帝的众天使面前
  rationale: 直陈庄严的天上见证场景；ἄγγελοι在此按语境译作“天使”。
theological_decisions:
- issue: ὁμολογέω与ἐν加与格的互相对应结构
  choice: 正文按汉语习惯译作“承认我的……承认他”
  alternative: 较形式化地译作“在我里面承认……在他里面承认”
  rationale: 直译“在……里面承认”在现代汉语中含义不明，容易产生原文未必表达的空间性或神秘联合意味。正文采用自然的公开承认义，同时以脚注说明希腊文形式，避免掩盖其不寻常之处。
- issue: ἀνθρώπων的性别范围
  choice: 人们
  alternative: 男人们
  rationale: 该阳性复数在本句中具有泛指作用，指一般的人；“人们”准确传达所指范围，不将经文误解为只涉及男性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“承认”保留前后重复，“人子”沿用已确立的经文称号；句式简洁，并以冒号呈现耶稣郑重宣告的语气。
