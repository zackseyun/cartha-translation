  text: λέγω σοι, οὐ μὴ ἐξέλθῃς ἐκεῖθεν ἕως ⸂καὶ τὸ⸃ ἔσχατον λεπτὸν ἀποδῷς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/059.yaml
  text: I tell you[a], you will certainly not get out of there until you have paid even the last lepton.
translation:
  language: zh_hans
  text: 我告诉你，你绝不能从那里出来，直到你连最后一枚小钱[a]也付上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“最后一个雷普顿”。“雷普顿”（λεπτόν）是当时面值很小的一种铜币。
    reason: 说明原文钱币名称及其面值很小的含义。
lexical_decisions:
- source_word: λέγω σοι
  choice: 我告诉你
  rationale: 这是直接对听者说话的常用表达；“我告诉你”符合现代汉语习惯，也保留了原文郑重断言的语气。
- source_word: οὐ μὴ ἐξέλθῃς
  choice: 你绝不能……出来
  rationale: οὐ μή加虚拟式表达对将来事件的强烈否定；“绝不能”传达强调语气，又不将其夸大为脱离条件限制的“永远不能”。
- source_word: ἐκεῖθεν
  choice: 从那里
  rationale: 准确表达该副词“从那里”的离开义，并与“出来”自然搭配。
- source_word: ἕως
  choice: 直到……为止
  rationale: 保留原文的时间界限结构，不额外断定界限达到之后必然会发生什么。
- source_word: καὶ τὸ ἔσχατον
  choice: 连最后一个……也
  rationale: 此处καί有强调意味；“连……也”自然地突出必须付到最后、毫无欠缺。
- source_word: λεπτόν
  choice: 小钱
  rationale: λεπτόν指面值极低的小铜币。“小钱”使普通现代读者易懂；脚注补充其具体历史名称，以保留文化信息。
- source_word: ἀποδῷς
  choice: 付清
  rationale: 在债务和拘押的语境中，ἀποδίδω表示偿付所欠；“付清”体现动作完成及全额偿还的含义。
theological_decisions:
- issue: 这句债务与监禁比喻的具体所指
  choice: 保留欠债、拘押和全额偿付的形象，不明确指定其所指
  alternative: 解释为现世法律后果、上帝的审判，或后世所说的炼狱惩罚
  rationale: 本节本身没有明说这一形象究竟对应哪一种现实。直译其法律与债务意象，可保留原文的神学张力，避免加入后来的教义结论。
- issue: “直到”是否暗示付款后必然获释
  choice: 保留原文“直到……为止”的界限表达，不在译文中补充付款后必然获释
  alternative: 译成明确承诺付清后就会获释的句式
  rationale: ἕως说明在所述界限之前绝不会出来，但该结构本身不宜被扩展成独立的获释承诺。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“绝不能”保留强烈否定，“连……也”表达强调；“小钱”便于普通读者理解，历史钱币名称则收入脚注。
