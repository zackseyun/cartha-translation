  text: Then he told them a parable[a], saying, “The land of a certain rich man produced abundantly.”
translation:
  language: zh_hans
  text: 他又对他们讲了一个比喻，说：“有一个富人，他的田地出产丰盛〔a〕。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν δὲ
  choice: 于是，他……讲了
  rationale: δέ在此是轻微的叙事连接词；译作“于是”自然承接上文，而因“比喻”作宾语，现代汉语用“讲了”比直译“说了”更自然。
- source_word: παραβολὴν
  choice: 一个比喻
  rationale: “比喻”是福音书中παραβολή的常用译法，既保留其文学类别，也符合现代中文圣经语体。
- source_word: πρὸς αὐτοὺς
  choice: 对他们
  rationale: 保留说话对象，清楚表达耶稣是向在场的人讲述。
- source_word: λέγων
  choice: 说
  rationale: 自然引出比喻的直接内容，同时体现希腊文分词的功能。
- source_word: Ἀνθρώπου τινὸς πλουσίου
  choice: 有一个财主，他的
  rationale: 用汉语存在句自然表达τινός所带的不特指意味；“财主”简洁准确地表达πλούσιος在此所指的富有男子，并以“他的”呈现属有关系。
- source_word: εὐφόρησεν
  choice: 出产丰盛
  rationale: 该动词指土地结实良好、产量丰富；“出产丰盛”符合农业语境，庄重而易懂。
- source_word: ἡ χώρα
  choice: 田地
  rationale: χώρα在此指财主拥有并有农产的土地，而非国家或地区；“田地”最能清楚传达上下文中的农业含义。
