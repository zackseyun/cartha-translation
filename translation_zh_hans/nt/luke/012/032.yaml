id: LUK.12.32
reference: Luke 12:32
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Μὴ φοβοῦ, τὸ μικρὸν ποίμνιον, ὅτι εὐδόκησεν ὁ πατὴρ ὑμῶν δοῦναι ὑμῖν τὴν βασιλείαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/032.yaml
  text: Do not fear[a], little flock[c][b], because your Father was pleased to give you the kingdom.
translation:
  language: zh_hans
  text: “小小的羊群[b]啊，不要害怕[a]，因为你们的父乐意把国[c]赐给你们。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“不要惧怕”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“人数不多的羊群”。
    reason: lexical_alternative
  - marker: c
    text: “国”也可理解为“王的统治”，强调神掌权，也包括他赐给子民的国度。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ φοβοῦ
  choice: 不要害怕
  rationale: μή加现在时命令式构成禁止或劝阻；“不要害怕”是现代汉语中自然、直接的表达，也保留原文安慰劝勉的语气。
- source_word: τὸ μικρὸν ποίμνιον
  choice: 小小的羊群
  rationale: ποίμνιον指羊群，μικρόν表明其小或人数不多。“小小的羊群”既保留牧羊意象，也在称呼中传达亲切意味；避免把它译成容易被理解为幼羊的“小羊群”。
- source_word: ὅτι
  choice: 因为
  rationale: 此处ὅτι引出不要害怕的理由；“因为”清楚呈现其因果关系。
- source_word: εὐδόκησεν
  choice: 乐意
  rationale: εὐδοκέω表达欣然认可、喜悦或美意。“乐意”自然地体现父主动而仁慈的美意，又不把该词收窄为技术性的“预定”或“决定”。
- source_word: ὁ πατὴρ ὑμῶν
  choice: 你们的父
  rationale: 忠实保留原文简洁的“你们的父”，不增添原文没有的“天上的”。
- source_word: δοῦναι ὑμῖν
  choice: 把……赐给你们
  rationale: δίδωμι本义为“给”；在父赐下国度的语境中，“赐给”符合现代庄重汉语，同时保留给予者主动施恩的关系。
- source_word: τὴν βασιλείαν
  choice: 国
  rationale: βασιλεία兼有王权统治与国度领域的含义。“国”承接本段的上文语境，并保留其较宽的圣经神学含义，不擅自补出原文未明说的“神的”。
theological_decisions:
- issue: βασιλεία的含义范围
  choice: 国
  alternative: 王权；统治；国度
  rationale: 原词既可侧重君王的统治，也可指其国度。“国”不强行限定为抽象统治或空间领域，因而保留原文的神学张力；脚注提示其统治层面的含义。
- issue: εὐδόκησεν与神旨意的关系
  choice: 乐意
  alternative: 欣然决定；按美意选择
  rationale: “乐意”呈现父的美意与恩慈，却不把一般性的喜悦、认可用语解释成特定教义体系中的技术性决定。
- issue: “父”的指称
  choice: 你们的父
  alternative: 你们的天父
  rationale: 上下文清楚指向神，但本节希腊文没有“天上的”；正文不作增补，以免把解释写入译文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“小小的羊群啊”保留直接称呼及牧养意象；“啊”自然标示呼语，并传达温柔安慰的口吻。句序略按汉语习惯调整，把呼语置于劝勉之前。
