  text: ὅτε δὲ ὁ υἱός σου οὗτος ὁ καταφαγών σου τὸν βίον ⸀μετὰ πορνῶν ἦλθεν, ἔθυσας αὐτῷ τὸν ⸂σιτευτὸν μόσχον⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/030.yaml
  text: But when this son of yours came[a], the one who devoured your livelihood with prostitutes, you slaughtered the fattened calf for him.
translation:
  language: zh_hans
  text: 可是，你这个儿子来了，他跟娼妓一起吞光了你的家产，你倒为他宰了那头肥牛犊。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτε δὲ
  choice: 可是……一……
  rationale: δέ在哥哥的抱怨中带有对比意味，用“可是”自然承接上文；ὅτε所表达的时间关系以“他一回来”呈现。
- source_word: ὁ υἱός σου οὗτος
  choice: 你这个儿子
  rationale: 保留“你的”及指示词οὗτος所传达的疏离和轻蔑；哥哥没有称他为“我弟弟”。
- source_word: ὁ καταφαγών
  choice: 吞光了
  rationale: 保留κατεσθίω“吞吃、吃光”的鲜明比喻和强烈指责，比“挥霍”更贴近原词，又符合现代汉语。
- source_word: σου τὸν βίον
  choice: 你的家产
  rationale: 此处βίος指维持生活的财物、产业，而非生物意义的生命；结合分家语境，“家产”清楚自然。
- source_word: μετὰ πορνῶν
  choice: 和娼妓一起
  rationale: 直译哥哥对弟弟的指控，不淡化，也不把它改写成笼统的“不道德生活”。
- source_word: ἦλθεν
  choice: 回来
  rationale: ἦλθεν本义是“来”，叙事处境明确是儿子回到父家；汉语用“回来”可自然表达相对于父亲所在地的移动，不额外改变事件内容。
- source_word: ἔθυσας
  choice: 宰了
  rationale: 此处θύω指为筵席宰杀牲畜；“宰了”准确自然，并避免“献祭”的宗教礼仪含义。
- source_word: τὸν σιτευτὸν μόσχον
  choice: 那头肥牛犊
  rationale: 指特意育肥以供宴席使用的牛犊；“肥牛犊”简洁、通顺，并与上下文中的特定对象相符。
- source_word: αὐτῷ
  choice: 为他
  rationale: 将与格按受益者理解，即为他、为庆贺他而宰牛犊。
theological_decisions:
- issue: 哥哥关于弟弟与娼妓一起耗尽家产的说法，是已证实的事实还是人物指控
  choice: 在正文中直接保留哥哥的指控，不加限定语
  alternative: 译作“据说和娼妓一起挥霍了你的家产”或将其笼统化为“生活放荡”
  rationale: 希腊文将这话作为哥哥的控诉呈现，并未在本节以叙述者身份确认其细节。直译人物话语而不加入“据说”等词，既不替他背书，也不削弱其指控，从而保留叙事张力。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事语言。“吞光了”保留原文强烈而形象的责难；“你倒”为汉语中的对比焦点，表现哥哥对父亲做法的不满。
