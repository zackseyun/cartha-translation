  text: εὐφρανθῆναι δὲ καὶ χαρῆναι ἔδει, ὅτι ὁ ἀδελφός σου οὗτος νεκρὸς ἦν καὶ ⸀ἔζησεν, καὶ ⸀ἀπολωλὼς καὶ εὑρέθη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/032.yaml
  text: But it was necessary to celebrate and rejoice[a], because this brother of yours was dead and has come to life again[c][b]; he was lost and has been found.
translation:
  language: zh_hans
  text: 可是，我们理当欢庆并欢喜[a]，因为你这个弟弟死了，又活了[b]；他失丧了，如今被找到了[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们本该欢庆并欢喜。”
    reason: lexical_alternative
  - marker: b
    text: 希腊文直译为“活了”；在这个比喻中，这句话很可能比喻他的恢复与归回。
    reason: lexical_alternative
  - marker: c
    text: 或译：“被找到了。”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐφρανθῆναι
  choice: 欢庆
  rationale: 结合筵席语境表达庆祝、欢乐之意，比单用“高兴”更具体，也避免古雅措辞。
- source_word: χαρῆναι
  choice: 喜乐
  rationale: 保留与“欢庆”并列的近义表达，不把原文的双重表述合并。
- source_word: ἔδει
  choice: 理当
  rationale: 表达情境与道义上的必要性，同时保留“必须”与“合宜”之间的语义张力。
- source_word: ὁ ἀδελφός σου οὗτος
  choice: 你这个弟弟
  rationale: 保留指示词和亲属关系；按故事人物关系译作“弟弟”，自然呈现父亲对长子的直接提醒。
- source_word: νεκρὸς ἦν
  choice: 死了
  rationale: 保留原文直陈的死亡意象，不在正文中改写为“疏远”或“离家”。
- source_word: ἔζησεν
  choice: 又活了
  rationale: 希腊文直译为“活了”，在与“死了”的对照中表示恢复生命；“又”自然传达恢复之意而不过度解释。
- source_word: ἀπολωλὼς
  choice: 失丧了
  rationale: 表达处于迷失、丢失状态的完成体含义，并与本章反复出现的寻找主题相呼应。
- source_word: εὑρέθη
  choice: 如今找到了
  rationale: 保留被动含义；“如今”体现被找到这一事件对当前状态的影响，但不改变其过去时事件性。
theological_decisions:
- issue: ἔζησεν在比喻中是否应明说为属灵恢复
  choice: 正文译作“又活了”，保留死与活的原始意象。
  alternative: 译作“重新得救”或“恢复了关系”。
  rationale: 本节在比喻中很可能以死亡与复生比喻失而复得，但正文不应把隐喻限定为某一种教义解释。
- issue: ἔδει所表达的是必要还是合宜
  choice: 译作“理当”。
  alternative: “必须”或“本该”。
  rationale: “理当”兼顾道义上的必要与情境上的合宜，避免把语气强化为外在强制，也不把必要性削弱为单纯许可。
translation_notes:
  register: 采用现代、庄重而口语自然的普通话。“欢庆喜乐”保留原文两个喜乐动词；“你这个弟弟”突出父亲对兄弟关系的提醒；分号保持两组“死—活”“失丧—找到”的平行结构。
