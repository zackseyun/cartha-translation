id: LUK.15.18
reference: Luke 15:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἀναστὰς πορεύσομαι πρὸς τὸν πατέρα μου καὶ ἐρῶ αὐτῷ· Πάτερ, ἥμαρτον εἰς τὸν οὐρανὸν καὶ ἐνώπιόν σου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/018.yaml
  text: I will get up and go to my father[a], and I will say to him, ‘Father[b], I have sinned against heaven and before you,’
translation:
  language: zh_hans
  text: 我要起身，到我父亲那里去，对他说：‘父亲，我得罪了天[a]，也在你面前犯了罪[b]，’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “天”在这里很可能是敬称式地指上帝。
    reason: lexical_alternative
  - marker: b
    text: 也可理解为“也得罪了你”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: 我要起来
  rationale: 不定过去时分词表示计划中先发生的动作；用“起来”保留具体的起身动作，并按现代汉语习惯与后面的将来行动并列。
- source_word: πορεύσομαι
  choice: 到……那里去
  rationale: 表示朝父亲所在之处前往；“到我父亲那里去”比直译“向我父亲去”更自然，也没有额外加入行程方面的含义。
- source_word: πρὸς τὸν πατέρα μου
  choice: 到我父亲那里
  rationale: πρός加宾格表示朝向或到某人那里；此处儿子打算抵达父亲面前并向他说话。
- source_word: ἐρῶ αὐτῷ
  choice: 对他说
  rationale: 准确表达λέγω的将来时及与格间接宾语，简洁而符合现代汉语。
- source_word: Πάτερ
  choice: 父亲
  rationale: 保留呼格的直接称呼，不增添原文此处没有明说的物主成分。
- source_word: ἥμαρτον
  choice: 我……犯了罪／我得罪了
  rationale: 不定过去时指已经发生的罪行，而认罪在当前仍有切身意义。汉语根据两个补语的搭配分别采用“得罪了”和“犯了罪”，共同承载同一个希腊动词。
- source_word: εἰς τὸν οὐρανὸν
  choice: 得罪了天
  rationale: εἰς在ἁμαρτάνω之后表示犯罪所针对的对象；保留“天”这一原文表达，不在正文中直接改写为“上帝”。
- source_word: ἐνώπιόν σου
  choice: 在你面前犯了罪
  rationale: ἐνώπιον加属格本义为“在……面前／眼前”。此译保留它与前面εἰς结构的差别，避免把两者都同化为“得罪”。
theological_decisions:
- issue: 正文是否把“天”明确改写为“上帝”
  choice: 保留“天”：我得罪了天
  alternative: 我得罪了上帝
  rationale: “天”很可能是敬称式地指上帝，但希腊原文使用οὐρανός。正文保留这一表达，并由脚注说明其可能含义，既忠于原文，也不消除其修辞与神学张力。
- issue: 是否把ἐνώπιόν σου直接解释为“得罪了你”
  choice: 也在你面前犯了罪
  alternative: 也得罪了你
  rationale: “在你面前”更直接反映ἐνώπιον的空间、关系或审判性含义；“得罪了你”虽符合上下文，却会把它与前面的εἰς结构完全等同，因此列作脚注中的理解方式。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事语言。“到我父亲那里去”符合普通读者的表达习惯；认罪语句保留“天”与“在你面前”两种不同的原文结构。
