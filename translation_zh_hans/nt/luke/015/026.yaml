  yaml_path: translation/nt/luke/015/026.yaml
  text: And calling one of the servants[a], he asked what these things might be.
translation:
  language: zh_hans
  text: 他叫来一个仆人，问他这些事是怎么回事[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这些事可能是什么。”希腊文较直译为：“这些事会是什么。”
    reason: 说明 τί ἂν εἴη ταῦτα 的较字面措辞，并保留其潜在、不确定的语气；正文采用自然的现代汉语。
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: 叫来
  rationale: 该词是简单过去时中动分词，表示先把人叫到自己身边，随后询问；“叫来”自然、简洁地保留了这一动作次序。
- source_word: παίδων
  choice: 仆人
  rationale: παῖς可指“孩子”或“仆人”；本节描述家中有人被叫来说明庆祝活动，语境支持“仆人”，而“孩子”容易造成误解。
- source_word: ἐπυνθάνετο
  choice: 问
  rationale: 该词表示打听、询问。虽然希腊文使用未完成时，但此处重点不在动作持续过程；现代汉语用“问”最自然。
- source_word: τί ἂν εἴη ταῦτα
  choice: 这些事究竟是怎么回事
  rationale: 这是带有不确定意味的间接问句。“怎么回事”符合现代汉语表达，并保留他想弄清眼前诸事的含义；“究竟”体现询问语气，但不把不确定性解释得过强。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“叫来……问”清楚呈现分词动作与主要动词的先后关系；正文用“这些事……怎么回事”兼顾原文复数指向与汉语习惯。
