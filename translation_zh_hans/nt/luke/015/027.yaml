base_translation:
  language: en
  yaml_path: translation/nt/luke/015/027.yaml
  text: He said to him[a], “Your brother has come, and your father slaughtered the fattened calf, because he received him back safe and sound.”
translation:
  language: zh_hans
  text: 仆人对他说：“你弟弟回来了；你父亲宰了那头肥牛犊，因为他把你弟弟接回来时，见他平安无恙[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“身体健康”。希腊语ὑγιαίνοντα可指“健康、健全”，在这里也可较宽泛地理解为“平安无恙”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥκει
  choice: 回来了
  rationale: 该动词在此表示已经到达且如今在场；结合离家后归来的语境，“回来了”自然地表达这一结果状态。
- source_word: ἔθυσεν
  choice: 宰了
  rationale: 这里指为宴席宰杀牲畜；“宰了”准确自然，又避免“献祭”可能带来的礼仪性含义。
- source_word: μόσχον τὸν σιτευτόν
  choice: 那头肥牛犊
  rationale: 指特意育肥、留待庆宴使用的牛犊；“那头肥牛犊”符合现代汉语习惯，并保留定指含义。
- source_word: ὑγιαίνοντα
  choice: 平安无恙
  rationale: 该分词可指健康、健全；在失而复归的家人语境中，“平安无恙”自然涵盖安然归来和身体无恙，同时以脚注保留较窄的“健康”义。
- source_word: ἀπέλαβεν
  choice: 接他回来
  rationale: 该动词在此具有重新得到或接回之意；“接他回来”保留恢复团聚的意味。
- source_word: ὁ δὲ εἶπεν αὐτῷ ὅτι
  choice: 仆人对他说
  rationale: 上下文明确说话者是被问话的仆人；δέ在此为轻微承接，无须生硬译出，ὅτι引出直接引语。
