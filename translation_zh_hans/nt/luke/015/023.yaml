  yaml_path: translation/nt/luke/015/023.yaml
  text: And bring the fattened calf[a], slaughter it, and let us eat and celebrate,
translation:
  language: zh_hans
  text: 把那头肥壮的牛犊带来，宰了它[a]；让我们吃吧，一同庆祝！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “宰了它”所译的希腊词可指宰杀牲畜，在某些语境中带有献祭意味；这里的语境侧重预备宴席。
    reason: lexical_alternative
lexical_decisions:
- source_word: φέρετε
  choice: 牵来
  rationale: 这是φέρω的复数命令式。对象是牛犊，现代汉语通常说“牵来”，比泛泛的“带来”更自然；原文未明确“出来”，故不增译。
- source_word: μόσχον τὸν σιτευτόν
  choice: 那头肥牛犊
  rationale: μόσχος指牛犊或幼牛，σιτευτός指特意喂肥的牲畜。“肥牛犊”简洁自然，并保留为特殊宴席预备牲畜的意味；定冠词在语境中以“那头”体现其特指性。
- source_word: θύσατε
  choice: 宰了
  rationale: θύω可指宰杀牲畜，也可在某些语境中指献祭。本段重点是预备家宴，“宰了”准确而自然，且不强行加入原文在此处未明确要求的祭祀含义。
- source_word: φαγόντες
  choice: 吃喝
  rationale: 这是ἐσθίω的不定过去主动分词，字面为“吃了以后”；与劝勉虚拟式连用时表达参与宴席并庆祝。“吃喝”在汉语中自然呈现宴饮场景，但不把动词过度译成“欢宴”。
- source_word: εὐφρανθῶμεν
  choice: 我们来……庆祝吧
  rationale: 第一人称复数劝勉虚拟式，表示共同欢喜、庆祝。“我们来……吧”自然传达劝勉语气，“庆祝”符合当前宴席语境。
- source_word: καὶ ... καὶ
  choice: 并列推进（把……牵来，宰了，我们来……）
  rationale: 希腊文重复καί，依次连接命令和共同庆祝的劝勉。汉语以逗号顺承并列更自然，同时保留连续推进的节奏。
theological_decisions:
- issue: θύσατε可能带有献祭色彩
  choice: 正文译为“宰了”，按预备宴席理解
  alternative: 译为“献上作祭”或“宰献了”以突出祭祀意味
  rationale: θύω的语义范围包括宰杀和献祭，但浪子比喻此处直接描写父亲为家庭庆典预备食物，并未交代祭坛、祭物或礼仪。正文采用中性的“宰了”，避免把未明确的祭祀神学引入比喻，同时在注脚中保留该词可能具有的祭祀含义。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事语言。“牵来”“宰了”“我们来……吧”符合父亲当场吩咐仆人的语气；“肥牛犊”清楚易懂。感叹号体现热切庆祝的语气。
