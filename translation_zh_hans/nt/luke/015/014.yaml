  text: δαπανήσαντος δὲ αὐτοῦ πάντα ἐγένετο λιμὸς ⸀ἰσχυρὰ κατὰ τὴν χώραν ἐκείνην, καὶ αὐτὸς ἤρξατο ὑστερεῖσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/014.yaml
  text: But after he had spent everything[a], a severe famine came upon that country[b], and he began to be in need.
translation:
  language: zh_hans
  text: 等他把一切都花光以后，那一带发生了一场严重的饥荒，他就开始穷困起来。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δαπανήσαντος ... αὐτοῦ πάντα
  choice: 等他把一切都花光以后
  rationale: 属格独立结构中的不定过去时分词自然表达先于主句的时间关系。δαπανάω本身意为花费，因此不用带有更强道德评价的“挥霍”。“花光”自然体现πάντα所表示的全部耗尽。
- source_word: δέ
  choice: 又
  rationale: δέ推动叙事，并使钱财耗尽与饥荒来临这两重困境相接。汉语用“又”能自然表现祸不单行的转折发展，而不必生硬译作“但是”。
- source_word: ἐγένετο
  choice: 发生了
  rationale: γίνομαι与“饥荒”搭配时表示事件出现或发生；“发生了”是现代汉语中自然准确的说法。
- source_word: λιμὸς ἰσχυρά
  choice: 严重的饥荒
  rationale: ἰσχυρά在这里加强“饥荒”的程度。“严重的饥荒”比直译“强烈的饥荒”更符合现代汉语习惯。
- source_word: κατὰ τὴν χώραν ἐκείνην
  choice: 那一带
  rationale: κατά加宾格可表示遍及某个区域，χώρα可指地方、地区或乡间。“那一带”自然保留区域范围，不把它过度限定为现代民族国家意义的“国家”。
- source_word: καὶ αὐτὸς ἤρξατο ὑστερεῖσθαι
  choice: 他就开始穷困起来
  rationale: ἤρξατο加不定式表示某种状态开始；ὑστερεῖσθαι在此指陷入匮乏、缺少生活所需。“穷困起来”在汉语中完整自然，也避免“开始缺少”因宾语省略而显得突兀。
