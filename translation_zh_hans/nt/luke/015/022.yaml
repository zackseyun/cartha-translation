id: LUK.15.22
reference: Luke 15:22
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ πατὴρ πρὸς τοὺς δούλους αὐτοῦ· ⸀Ταχὺ ⸀ἐξενέγκατε στολὴν τὴν πρώτην καὶ ἐνδύσατε αὐτόν, καὶ δότε δακτύλιον εἰς τὴν χεῖρα αὐτοῦ καὶ ὑποδήματα εἰς τοὺς πόδας,
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/022.yaml
  text: But the father said to his slaves[a], ‘Quickly, bring out the best robe and put it on him[c][b], and put a ring on his hand and sandals on his feet.’
translation:
  language: zh_hans
  text: 父亲却对他的奴仆们说：“快！把那件最好的袍子拿出来，给他穿上[a]；把戒指戴在他手上，把凉鞋穿在他脚上。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “最好的袍子”直译为“第一的袍子”，这里也可理解为“首要的袍子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: δούλους
  choice: 奴仆
  rationale: 原词指处于隶属身份的家内奴隶或仆役。“奴仆”既保留古代社会中的人身隶属现实，也比现代汉语单用“奴隶”更适合此处家宅叙事的自然表达。
- source_word: Ταχὺ
  choice: 快！
  rationale: 此处作副词，催促众人立即行动。独立的“快！”简洁有力，传达父亲的急切。
- source_word: ἐξενέγκατε
  choice: 拿出来
  rationale: 该动词在此指从屋内或存放处把袍子取出；“拿出来”符合现代汉语习惯，也保留动作方向。
- source_word: στολὴν τὴν πρώτην
  choice: 那件最好的袍子
  rationale: πρώτην字面可指“第一的”，在此更自然地表示居首、上好的袍子。“最好的袍子”传达语境中的品质或地位含义；定冠词译作“那件”，体现袍子的特指性。
- source_word: ἐνδύσατε αὐτόν
  choice: 给他穿上
  rationale: 承接前面的袍子，现代汉语用“给他穿上”自然清楚，无须重复宾语。
- source_word: δακτύλιον
  choice: 戒指
  rationale: 原词只说明是戒指，并未明确说是印章戒指，因此不把可能的身份或权柄象征写入正文。
- source_word: εἰς τὴν χεῖρα αὐτοῦ
  choice: 戴在他手上
  rationale: 这里的εἰς与佩戴动作连用，汉语宜按习惯译作“戴在……手上”，而非生硬地保留方向介词。
- source_word: ὑποδήματα
  choice: 鞋
  rationale: 原词泛指穿在脚上的鞋履，古代环境中通常为凉鞋；正文用普通读者自然理解的“鞋”，避免“凉鞋”可能带来的过度具体化。
- source_word: εἰς τοὺς πόδας
  choice: 穿在他脚上
  rationale: 按汉语搭配，鞋应说“穿在脚上”；这样自然表达原文为脚穿上鞋的意思。
- source_word: δὲ
  choice: 却
  rationale: 此处标示从儿子的话转向父亲出人意料的吩咐，带有轻微对照；“却”自然体现这一叙事转折。
theological_decisions:
- issue: δούλους应译为“奴隶”“仆人”还是“奴仆”
  choice: 奴仆
  alternative: 奴隶；仆人
  rationale: “仆人”容易淡化古代家内成员的隶属身份，而“奴隶”在现代汉语中虽更直接，却可能使此处家宅场景显得突兀。“奴仆”较平衡地保留社会现实与叙事语体，不额外作神学化处理。
- issue: στολὴν τὴν πρώτην中的πρώτην是“第一”还是“最好”
  choice: 最好的袍子
  alternative: 第一件袍子；首要的袍子
  rationale: 此处更可能表示品质或地位居首，而非时间或顺序上的第一。“最好”符合汉语习惯，同时不进一步解释袍子的象征意义。
- issue: δακτύλιον是否应明确译为“印章戒指”
  choice: 戒指
  alternative: 印章戒指
  rationale: 戒指或可象征身份和权柄，但原词本身没有明确指定印章戒指，因此正文保留较宽泛的词义。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事语言。用短促的“快！”表现命令的急切；正文避免加入戒指象征恢复身份或权柄等解释。脚注标记紧接相关分句，说明“第一的”这一真实词义张力。
