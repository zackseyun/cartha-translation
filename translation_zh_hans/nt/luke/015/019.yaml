id: LUK.15.19
reference: Luke 15:19
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ⸀οὐκέτι εἰμὶ ἄξιος κληθῆναι υἱός σου· ποίησόν με ὡς ἕνα τῶν μισθίων σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/019.yaml
  text: I am no longer worthy to be called your son[a]. Make me like one of your hired workers.
translation:
  language: zh_hans
  text: 我再也不配称为你的儿子；把我当作你的一个雇工吧。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把我看作你的一个雇工吧。”原文指领取工钱的受雇者，不是家中的奴仆。
    reason: 说明ὡς的表达选择及μίσθιος与家内奴仆的词义区别。
lexical_decisions:
- source_word: οὐκέτι
  choice: 再也不
  rationale: 自然表达从先前状态到如今状态的变化，并保留时间否定的力度。
- source_word: ἄξιος
  choice: 配
  rationale: 在“不配称为”这一现代汉语搭配中，准确传达不够资格、不堪承受某种身份的社会与关系含义。
- source_word: κληθῆναι
  choice: 称为
  rationale: 保留被动不定式所表达的被称作、被视为某种身份的含义。
- source_word: υἱός
  choice: 儿子
  rationale: 原文为阳性单数，明确指父子关系，不宜泛化为“孩子”。
- source_word: ποίησόν με
  choice: 把我当作
  rationale: 结合ὡς的比较结构，现代汉语用“把我当作”自然表达请求父亲将他置于较低身份；比机械的“使我成为像……”更通顺。
- source_word: ὡς ἕνα τῶν μισθίων σου
  choice: 你的一个雇工
  rationale: μίσθιος指领取工资的受雇劳动者，与家内奴仆有别；“雇工”简洁、通俗，并保留经济身份差异。
theological_decisions:
- issue: 儿子认罪中的身份语言
  choice: 保留“不配”和“儿子”
  alternative: 我再也不配称为你的孩子
  rationale: 经文表达的是说话者自认不配保有儿子的关系与社会身份；保留“儿子”可避免淡化父子关系，也不额外引入教义解释。
- issue: ποίειν与ὡς所表达的新身份请求
  choice: 译为“把我当作……雇工”
  alternative: 使我成为你的一个雇工
  rationale: ὡς可带比较色彩，因此不把请求绝对化为正式任命；“当作”保留“像……一样/作为……”之间的语义张力。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事对白。“再也不配称为”符合当代普通读者习惯；“雇工”避免把领取工资的劳动者误解为奴仆。
