id: LUK.15.6
reference: Luke 15:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν εἰς τὸν οἶκον συγκαλεῖ τοὺς φίλους καὶ τοὺς γείτονας, λέγων αὐτοῖς· Συγχάρητέ μοι ὅτι εὗρον τὸ πρόβατόν μου τὸ ἀπολωλός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/006.yaml
  text: And when he comes into the house[a], he calls together his friends and neighbors, saying to them, ‘Rejoice with me[c][b], because I have found my sheep that was lost.’
translation:
  language: zh_hans
  text: 他回到家里[a]，就把朋友和邻居召集来，对他们说：“和我一同欢喜吧[b]！因为我找到了我那只走失的羊[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“进到那房子里”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“跟我一起庆贺吧！”原文动词指与某人一同欢喜。
    reason: lexical_alternative
  - marker: c
    text: 原文直译：“我的羊，就是那只走失了的。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν εἰς τὸν οἶκον
  choice: 回到家里
  rationale: 该不定过去时分词表达先于主句的动作；在此语境中译作“回到家里”符合现代汉语习惯。“进到那房子里”更贴近字面，收入脚注。
- source_word: συγκαλεῖ
  choice: 召集来
  rationale: 保留“把人叫到一起”的动作含义；“召集来”简洁自然，也不必增添原文没有的庆宴场景。
- source_word: τοὺς φίλους καὶ τοὺς γείτονας
  choice: 朋友和邻居
  rationale: 直接对应两个复数名词，措辞通俗准确。
- source_word: λέγων αὐτοῖς
  choice: 对他们说
  rationale: 将希腊语现在分词按汉语叙事习惯转为连贯谓语。
- source_word: Συγχάρητέ μοι
  choice: 和我一同欢喜吧
  rationale: 准确表达 συγχαίρω 所含“与某人一同喜乐”的意思，同时保留命令语气；“跟我一起庆贺吧”是较具活动色彩的可行译法。
- source_word: ὅτι
  choice: 因为
  rationale: 此处引出邀请众人同乐的原因。
- source_word: εὗρον
  choice: 我找到了
  rationale: 不定过去时指已经完成的寻找结果；“找到了”在现代汉语中自然突出如今已经寻回。
- source_word: τὸ πρόβατόν μου τὸ ἀπολωλός
  choice: 我那只走失的羊
  rationale: “那只”自然体现单数限定结构，后置的“走失的”保留该羊此前处于失落状态的描述；另以脚注列出更贴近原文结构的表达。
theological_decisions:
- issue: 寻回的比喻意象
  choice: 保留“我那只走失的羊”的具体图景
  alternative: 在本节直接释为迷失的人或得救的罪人
  rationale: 本节仍在讲述比喻，解释见上下文；译文不应提前把羊的形象替换成神学释义。
- issue: τὸ ἀπολωλός 的状态含义
  choice: 走失的
  alternative: 灭亡的
  rationale: ἀπόλλυμι 的完成时分词在牧羊语境中指羊已经走失、处于失落状态；译为“灭亡”会破坏被找回的叙事情境并引入不当歧义。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。主句用“就”清楚呈现动作次序；引语保留共享喜乐的命令语气。所有脚注标记均置于其所说明的正文词组之后。
