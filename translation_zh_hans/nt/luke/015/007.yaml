  text: λέγω ὑμῖν ὅτι οὕτως χαρὰ ⸂ἐν τῷ οὐρανῷ ἔσται⸃ ἐπὶ ἑνὶ ἁμαρτωλῷ μετανοοῦντι ἢ ἐπὶ ἐνενήκοντα ἐννέα δικαίοις οἵτινες οὐ χρείαν ἔχουσιν μετανοίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/007.yaml
  text: I tell you[b][a], in the same way there will be joy in heaven over one sinner who has a change of mind than over ninety-nine righteous people who have no need of one.
translation:
  language: zh_hans
  text: 我告诉你们：同样[a]，天上会因一个悔改的罪人而有喜乐，胜过因九十九个不需要悔改的义人[b]而有的喜乐。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “同样”也可译作“这样”或“如此”；这个词把天上的喜乐与前面比喻的要点联系起来。
    reason: lexical_alternative
  - marker: b
    text: 原文作“义人”。在本段语境中，这个称呼既可按字面理解，也可能带有反讽；正文保留原文措辞，不替读者确定是哪一种。
    reason: alternative_reading
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: 我告诉你们
  rationale: 这是自然、庄重的现代汉语表达，保留了直接称呼和郑重断言的语气。
- source_word: οὕτως
  choice: 同样
  rationale: 承接前面的比喻，表明天上的喜乐与比喻所述情形相对应；脚注保留“这样／如此”的可能表达。
- source_word: χαρὰ ἐν τῷ οὐρανῷ ἔσται
  choice: 天上会……欢喜
  rationale: 以自然汉语表达将来的喜乐，并保留“天上”作为地点，不擅自指定欢喜的主体是上帝或天使。
- source_word: ἐπὶ ἑνὶ ἁμαρτωλῷ
  choice: 为一个……罪人
  rationale: 此处ἐπί表示引发喜乐的对象或缘由；“为”符合现代汉语中“为某人欢喜”的习惯。
- source_word: μετανοοῦντι
  choice: 悔改的
  rationale: 现在分词描写这个罪人正在悔改或以悔改为特征；“悔改的罪人”简洁自然，并与本节后半的μετανοίας保持词义呼应。
- source_word: ἢ
  choice: 胜过
  rationale: 在比较结构中表达前一种喜乐超过后一种；直译为“或”会使现代汉语读者误解。
- source_word: ἐνενήκοντα ἐννέα δικαίοις
  choice: 九十九个……义人
  rationale: δίκαιοις是名词化形容词；“义人”是准确而简洁的汉语表达，同时不预先判定这里是否带有反讽。
- source_word: οἵτινες οὐ χρείαν ἔχουσιν μετανοίας
  choice: 不需要悔改的
  rationale: 自然地表达“没有悔改的需要”，并明确重复“悔改”，避免代词指代不清。
theological_decisions:
- issue: “义人”是实指真正的义人，还是在语境中带有反讽，指自以为义的人
  choice: 正文保留“义人”，不明示反讽
  alternative: 译作“自以为是义人的人”或给“义人”加引号
  rationale: 希腊文直接使用δίκαιοις，并未在词面上标明反讽。上下文可能容许反讽解读，但译文不应替读者消除这一张力。
- issue: “天上”的喜乐由谁发出
  choice: 只译出地点“天上”，不指定主体
  alternative: 译作“上帝会欢喜”或“天使会欢喜”
  rationale: 本节只明说喜乐在天上，并未明说欢喜者是谁；指定上帝或天使会超出本节措辞。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“我告诉你们”保留郑重的直接宣告；“天上会……欢喜”符合汉语习惯，同时避免补入原文未明说的欢喜主体。
