base_translation:
  language: en
  yaml_path: translation/nt/luke/015/001.yaml
  text: All the tax collectors and sinners were drawing near to him to hear him[a].
translation:
  language: zh_hans
  text: 所有税吏和罪人都不断地到他跟前来，为要听他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“都在走近他。”原文采用表示持续状态的结构，可能指他们持续或屡次来到他跟前。
    reason: 说明“走近／靠近”的词义备选，并保留希腊文迂回未完成体所表达的持续或反复意味。
lexical_decisions:
- source_word: Ἦσαν δὲ
  choice: 都不断……
  rationale: ἦσαν与现在分词构成迂回表达，描写过去持续或反复发生的情形；δέ在此主要承接并转换叙事场景，中文不必另加明确的时间副词。
- source_word: αὐτῷ ἐγγίζοντες
  choice: 走近他
  rationale: ἐγγίζω表示靠近、走近；“走近他”自然地保留空间上的接近，不额外赋予“亲近”的关系或神学含义。
- source_word: πάντες
  choice: 所有的……都
  rationale: 明确保留πάντες对两个并列群体的总体强调，符合现代汉语表达。
- source_word: οἱ τελῶναι
  choice: 税吏
  rationale: τελώνης指在当时税收制度下负责征收税款或关税的人；“税吏”是简洁、通行且具有历史语境的译法。
- source_word: οἱ ἁμαρτωλοὶ
  choice: 罪人
  rationale: 该词在此名词化使用，指被视为有罪或品行不端的人；直译为“罪人”，不在正文中扩展其社会或宗教身份。
- source_word: ἀκούειν αὐτοῦ
  choice: 要听他
  rationale: 不定式表示他们走近的目的；“要听他”在上下文中自然表示听他说话或教导，同时避免把原文没有明说的“讲道”增入正文。
theological_decisions:
- issue: “税吏和罪人”的社会及宗教含义
  choice: 保留两个并列称谓，不作解释性扩写
  alternative: 税吏和其他被社会排斥的人；税吏和臭名昭著的罪人
  rationale: 原文直接列举这两类人，并未界定“罪人”的范围或名声程度；直译可保留叙事中的社会宗教张力，而不预先替读者作解释。
- issue: “走近他”的含义
  choice: 采用空间动作意味较明确的“走近他”
  alternative: 亲近他
  rationale: “亲近”在现代中文中容易暗示情感关系或属灵归属，可能超出ἐγγίζω在本句直接表达的接近动作。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“不断”呈现希腊文迂回结构的持续或反复意味；代词“他”保留原文表达，并由上下文确定所指。
