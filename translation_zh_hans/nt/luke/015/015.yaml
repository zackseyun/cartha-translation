  text: καὶ πορευθεὶς ἐκολλήθη ἑνὶ τῶν πολιτῶν τῆς χώρας ἐκείνης, καὶ ἔπεμψεν αὐτὸν εἰς τοὺς ἀγροὺς αὐτοῦ βόσκειν χοίρους·
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/015.yaml
  text: So he went and joined himself to one of the citizens of that country[a], and he sent him into his fields to feed pigs.
translation:
  language: zh_hans
  text: 于是，他去投靠了那地方的一个居民[a]；那人就打发他到自己的田里去放猪。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “投靠”原文也可理解为“依附于”或“紧紧靠上”；这个词本有粘连在一起的意思，在这里含有依赖对方之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: πορευθεὶς
  choice: 去
  rationale: 不定过去时分词在此表示先于主句动作发生的行动；“去”自然简洁，不额外增添离开方式的含义。
- source_word: ἐκολλήθη
  choice: 投靠
  rationale: 该动词本有“粘连、紧密依附”之意；结合主人公穷困求生的处境，“投靠”既符合现代汉语，也体现依附于人的意味。脚注保留其较为形象的词义范围。
- source_word: ἑνὶ τῶν πολιτῶν
  choice: 那地方的一个居民
  rationale: πολίτης可指某政治共同体的成员或当地居民。此处重在他投靠当地一人；译作“居民”较自然，也避免现代“公民”可能带来的法律身份联想。
- source_word: τῆς χώρας ἐκείνης
  choice: 那地方
  rationale: χώρα可指国家、地区或地方；此处承接故事中的远方地域，“那地方”自然且保留适度的地域宽泛性。
- source_word: ἔπεμψεν
  choice: 那人就打发他
  rationale: πέμπω意为“差遣、送去”。明确补出最近先行词“那人”，消除汉语中代词所指不清；“打发”符合雇人去田间劳作的语境。
- source_word: εἰς τοὺς ἀγροὺς αὐτοῦ
  choice: 到自己的田里
  rationale: ἀγροί为复数，可指田地或农田。汉语集合名词“田里”无需机械标出复数；“自己的”清楚指向那位居民。
- source_word: βόσκειν χοίρους
  choice: 放猪
  rationale: βόσκω表示喂养、放牧牲畜；现代汉语“放猪”简洁自然，兼有照料、放牧猪群之意。
theological_decisions:
- issue: 猪在犹太语境中的不洁含义
  choice: 正文只译作“放猪”，不加解释性措辞
  alternative: 译成带有“做最卑贱的活”等评价色彩的表达
  rationale: 原文仅陈述他被派去牧养猪；其文化与叙事冲击不应通过正文中的额外评价被过度阐释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“于是”承接上文；分号体现两个连续而主语转换的动作。避免使用较书面的“公民”“牧养猪群”，也不把原文隐含的社会和宗教冲击扩写进正文。
