  text: Εἶπεν δέ· Ἄνθρωπός τις εἶχεν δύο υἱούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/011.yaml
  text: Then he said[a], “A certain man had two sons.”
translation:
  language: zh_hans
  text: 耶稣又说：“有一个人有两个儿子。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἶπεν δέ
  choice: 耶稣又说
  rationale: δέ在这里是轻微的承接或转折连接词，用“又”自然衔接前文；希腊文动词的主语由语境承接为耶稣，汉语中明示主语可避免生硬和歧义。
- source_word: Ἄνθρωπός τις
  choice: 有一个人
  rationale: τις表示不确指的人物；现代汉语用“有一个人”自然保留这种不确指而略带个体化的语气。
- source_word: εἶχεν
  choice: 有
  rationale: 未完成过去时在此交代比喻的背景状况；汉语无需另加时态标记。
- source_word: δύο
  choice: 两个
  rationale: 按基数词直译，并使用适合“儿子”的量词“个”。
- source_word: υἱούς
  choice: 儿子
  rationale: 该词明确指男性后代，译作“儿子”保留比喻中的家庭关系和性别信息。
theological_decisions:
- issue: Ἄνθρωπός τις的不确指程度
  choice: 有一个人
  alternative: 某人；一个人
  rationale: “有一个人”既呈现τις的不确指性，也符合现代汉语讲述比喻时的自然开场方式，不额外赋予人物象征意义。
translation_notes:
  register: 采用自然、庄重而口语可懂的现代标准汉语。“耶稣又说”顺畅承接前文，“有一个人有两个儿子”保留原文简洁的比喻开场。
