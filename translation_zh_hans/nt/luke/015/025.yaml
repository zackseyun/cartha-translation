  yaml_path: translation/nt/luke/015/025.yaml
  text: His older son was in the field; and as he came and drew near to the house[a], he heard music and dancing,
translation:
  language: zh_hans
  text: 他年长的儿子在田里；他从田里回来，走近家时，听见音乐和跳舞的声音[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“乐器演奏声和舞者的声音。”这两个希腊语词也可较具体地指器乐演奏和跳舞的人群。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦν δὲ
  choice: 正在
  rationale: δέ在这里推动叙事转向，不必机械译成“但”或“现在”；用分句转换自然承接上下文。Ἦν与地点短语表达当时所处状态，结合汉语叙事译为“正在田里”。
- source_word: ὁ υἱὸς αὐτοῦ ὁ πρεσβύτερος
  choice: 他的大儿子
  rationale: πρεσβύτερος是比较级，指相对于小儿子年长的儿子。现代汉语中“大儿子”自然清楚，并不必然断言另有多个儿子或强调“长子”身份。
- source_word: ἐν ἀγρῷ
  choice: 在田里
  rationale: ἀγρός在本语境指田地或农田；“在田里”直接、自然。
- source_word: ὡς ἐρχόμενος
  choice: 他回来
  rationale: 分词结构描写他从田里朝家而来的过程；汉语用“回来”简洁表达向家的移动，随后以“快到家时”保留同时发生的时间关系。
- source_word: ἤγγισεν τῇ οἰκίᾳ
  choice: 快到家时
  rationale: ἐγγίζω表示接近；“快到家时”符合现代汉语叙事，也保留尚未进屋的含义。οἰκία在此是父亲的家，按视角自然译作“家”。
- source_word: ἤκουσεν
  choice: 听见了
  rationale: 简单过去叙事动作；“听见了”不额外加入“开始听见”等起始含义。
- source_word: συμφωνίας
  choice: 奏乐
  rationale: συμφωνία可泛指音乐，也可较具体地指器乐演奏；“奏乐”自然体现庆宴中的音乐声，同时避免“交响乐”等时代错置。
- source_word: χορῶν
  choice: 跳舞
  rationale: χορός既可指舞蹈，也可指跳舞者或舞群；正文采用自然的事件性表达“跳舞”，并以脚注保留群体性解释。
