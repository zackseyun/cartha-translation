  text: ὁ δὲ ἀποκριθεὶς εἶπεν τῷ πατρὶ ⸀αὐτοῦ· Ἰδοὺ τοσαῦτα ἔτη δουλεύω σοι καὶ οὐδέποτε ἐντολήν σου παρῆλθον, καὶ ἐμοὶ οὐδέποτε ἔδωκας ἔριφον ἵνα μετὰ τῶν φίλων μου εὐφρανθῶ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/029.yaml
  text: But he answered his father[a], ‘Look, for so many years I have been serving you, and I never disobeyed your command; yet you never gave me even a young goat so that I might celebrate with my friends.’
translation:
  language: zh_hans
  text: 他却回答父亲说：“你看，我服侍[a]你这么多年，从来没有违背过你的命令，可你连一只小山羊也从未给过我，好让我能够和朋友们一起庆祝。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “服侍”所译的希腊语也可带有“作奴仆般劳作”的强烈意味；这里可能反映长子怨愤的语气。
    reason: 说明δουλεύω的语义强度及语境中的情感色彩。
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν τῷ πατρὶ αὐτοῦ
  choice: 回答父亲说
  rationale: 保留“回答并说”这一希腊语表达的回应意味，同时采用自然的现代汉语叙述方式；“父亲”在语境中已明确是他的父亲。
- source_word: Ἰδοὺ
  choice: 你看
  rationale: 作为引人注意并加强语气的话语标记，“你看”既自然，也能体现长子的激愤口吻。
- source_word: τοσαῦτα ἔτη δουλεύω σοι
  choice: 我服侍你这么多年
  rationale: δουλεύω含有处于从属地位而服役的意味；“服侍”在中文中保留这种上下关系，又不把比喻性的抱怨误解为对法律身份的陈述。脚注说明其更强的“像奴仆一样劳作”语气。
- source_word: οὐδέποτε ἐντολήν σου παρῆλθον
  choice: 从来没有违背过你的命令
  rationale: παρέρχομαι与ἐντολή搭配时指越过、违反或不遵守命令；此译法清楚而忠实。
- source_word: ἐμοὶ οὐδέποτε ἔδωκας ἔριφον
  choice: 可你连一只小山羊也从未给过我
  rationale: ἔριφος指小山羊；“连……也”自然表达抱怨中隐含的轻微事物与强烈对比。
- source_word: ἵνα μετὰ τῶν φίλων μου εὐφρανθῶ
  choice: 让我可以和朋友们一起庆祝
  rationale: ἵνα引出目的；εὐφραίνομαι在宴饮语境中指欢庆、享乐，“庆祝”符合上下文，也便于现代读者理解。
theological_decisions:
- issue: 长子用δουλεύω描述自己与父亲的关系
  choice: 正文译作“服侍”，脚注保留“像奴仆一样为你劳作”的较强语气
  alternative: 正文译作“给你当牛做马”或“像奴隶一样为你干活”
  rationale: 原词确属奴仆语义范围，并显出长子怨愤的自我理解，但本节并非断言他具有奴隶身份。“服侍”避免过度坐实，脚注则保存原文较强的从属和苦役色彩。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以“你看”呈现直面父亲的强调语气；“可……连……也……”传达抱怨与对比。脚注标记置于整句引语末尾，正文与脚注相互对应。
