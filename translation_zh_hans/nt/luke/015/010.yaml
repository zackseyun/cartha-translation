source:
  edition: SBLGNT
  text: οὕτως, λέγω ὑμῖν, ⸂γίνεται χαρὰ⸃ ἐνώπιον τῶν ἀγγέλων τοῦ θεοῦ ἐπὶ ἑνὶ ἁμαρτωλῷ μετανοοῦντι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/010.yaml
  text: In the same way[a], I tell you[b], there is joy before the angels of God over one sinner who repents.
translation:
  language: zh_hans
  text: 照样，我告诉你们：在上帝的众天使面前，因一个罪人悔改而有喜乐。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在上帝的众天使面前”并未明确说明欢喜的主体就是天使。
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως
  choice: 照样
  rationale: 承接前面的比喻并引出其应用，保留比较意味；现代汉语简洁自然。
- source_word: λέγω ὑμῖν
  choice: 我告诉你们
  rationale: 保留第一人称直接陈述以及复数受话者，符合现代汉语表达。
- source_word: γίνεται χαρὰ
  choice: 有喜乐
  rationale: 表达喜乐的发生或存在，不生硬地直译为“喜乐产生”。
- source_word: ἐνώπιον
  choice: 在……面前
  rationale: 直接保留“在场、面前”的空间或宫廷性意象，不把喜乐的主体明确限定为天使。
- source_word: τῶν ἀγγέλων τοῦ θεοῦ
  choice: 上帝的众天使
  rationale: 自然表达所属关系；“众”表明希腊文复数。
- source_word: ἐπὶ ἑνὶ ἁμαρτωλῷ
  choice: 一个罪人
  rationale: 与分词共同构成喜乐所因的对象；汉语用前置话题表达比机械加入“为……而”更流畅。
- source_word: μετανοοῦντι
  choice: 悔改
  rationale: 保留已确立的圣经概念及其语义广度，不窄化为单纯“改变想法”。
theological_decisions:
- issue: 悔改用语的含义
  choice: 译作“悔改”，不在正文中扩展其教义定义
  alternative: 改变心意；回转
  rationale: 本节宣告一个罪人悔改所引发的喜乐，但没有在此定义悔改；采用“悔改”可保存其神学广度。
- issue: 喜乐的位置与主体
  choice: 译作“在上帝的众天使面前也有喜乐”
  alternative: 上帝的众天使也欢喜；在上帝的众天使中有喜乐
  rationale: 原文只明确说喜乐发生在天使面前，并未明说天使就是喜乐的主体，因此不应在译文中替原文消除这一含混。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“照样”自然承接前文；用冒号凸显耶稣所作的郑重说明。“也”呼应前面比喻中的喜乐。脚注标记置于相关整句之后。
