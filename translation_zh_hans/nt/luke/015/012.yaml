  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ εἶπεν ὁ νεώτερος αὐτῶν τῷ πατρί· Πάτερ, δός μοι τὸ ἐπιβάλλον μέρος τῆς οὐσίας· ⸂ὁ δὲ⸃ διεῖλεν αὐτοῖς τὸν βίον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/012.yaml
  text: And the younger of them said to his father[a], ‘Father[b], give me the share of the estate that falls to me.’ So he divided his livelihood between them.
translation:
  language: zh_hans
  text: 小儿子对父亲说：“父亲，请把我应得的那份产业给我。”父亲就把自己的家产[a]分给了他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“生活”或“生计”（βίον），这里指父亲赖以生活的财物。
    reason: lexical_alternative
lexical_decisions:
- source_word: νεώτερος
  choice: 小儿子
  rationale: 该比较级形容词在此作名词使用，直译为“较年轻的那个”；上下文明示二人是父亲的儿子，现代汉语用“小儿子”自然清楚。
- source_word: δός μοι
  choice: 请把……给我
  rationale: 这是δίδωμι的不定过去时命令式；“请把……给我”既保留直接请求的语气，也符合现代汉语表达。
- source_word: τὸ ἐπιβάλλον μέρος
  choice: 我应得的那份
  rationale: ἐπιβάλλον表示归到某人名下、属于或应归某人的份额；“应得的那份”简洁保留其权利份额之意。
- source_word: οὐσία
  choice: 产业
  rationale: 在此家庭财产分配的语境中，οὐσία指财产或资产；“产业”既自然，也能涵盖可分配的家业。
- source_word: διεῖλεν
  choice: 分给了
  rationale: διαιρέω表示分开、分配；配合间接受词αὐτοῖς，译作“分给了他们”符合汉语习惯。
- source_word: αὐτοῖς
  choice: 他们
  rationale: 原文为复数，指两个儿子；不把它窄化为只给小儿子，以保留父亲向二人分配的叙述。
- source_word: βίον
  choice: 自己的家产
  rationale: βίος本义可指生命、生活或维持生活的资财；本节指父亲赖以生活的财物。正文用“家产”切合语境，脚注保留其“生计、养生之资”的词义色彩。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“小儿子”根据上下文补明身份；“父亲”保留称呼的郑重感。正文只设一个脚注，且标记[a]已置于“家产”之后，以对应βίον的词义说明。
