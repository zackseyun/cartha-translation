  text: 于是，耶稣对他们讲了这个比喻，说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν
  choice: 讲了
  rationale: 不定过去时在此引出耶稣接下来的话；因宾语是“比喻”，现代汉语用“讲了”自然贴切，同时保留言说行为。
- source_word: δὲ
  choice: 于是
  rationale: δέ是较弱的连接词；“于是”自然承接上文法利赛人和经学家的议论，表示耶稣随即回应，但不过度强化转折。
- source_word: πρὸς αὐτοὺς
  choice: 对他们
  rationale: πρός加宾格标明说话对象；“对他们”直接保留这一指向关系。
- source_word: τὴν παραβολὴν ταύτην
  choice: 这个比喻
  rationale: παραβολή在对观福音书中通常指“比喻”；ταύτην译作“这个”，符合现代汉语词序。
- source_word: λέγων
  choice: 说：
  rationale: 现在分词用于引出比喻的具体内容；译为“说：”既反映希腊文结构，也自然衔接下文引语。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而通俗的现代标准汉语。“耶稣”根据上文明确补出主语，避免汉语中的指代含混；原文虽仅用动词第三人称单数，但所指清楚。保留“讲了……说”这一略有重复的结构，以兼顾汉语自然度和原文λέγων的引语引介功能。
