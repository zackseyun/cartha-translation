  text: καὶ διεγόγγυζον οἵ ⸀τε Φαρισαῖοι καὶ οἱ γραμματεῖς λέγοντες ὅτι Οὗτος ἁμαρτωλοὺς προσδέχεται καὶ συνεσθίει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/002.yaml
  text: And both the Pharisees and the scribes were grumbling[a], saying, “This man welcomes sinners and eats with them.”
translation:
  language: zh_hans
  text: 法利赛人和文士都在嘀咕，说：“这人接纳[a]罪人，并且和他们一起吃饭。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“接待”。
    reason: προσδέχεται可指友善地接收、接纳或欢迎；正文采用“接纳”以自然表达其意思。
lexical_decisions:
- source_word: διεγόγγυζον
  choice: 都在嘀咕
  rationale: 未完成时体现持续或反复的动作；“在嘀咕”保留了私下发怨言、低声不满的语气，比单纯的“抱怨”更贴近该词。
- source_word: οἵ τε Φαρισαῖοι καὶ οἱ γραμματεῖς
  choice: 法利赛人和经学家都
  rationale: 用“都”体现 τε……καί 的关联并列，表明两个群体一同发怨言；“经学家”在现代汉语中比“文士”更清楚地表达其研习并讲解律法的身份。
- source_word: λέγοντες
  choice: 说
  rationale: 该分词与主要动词同时发生，汉语自然译为“说”，承接他们嘀咕的具体内容。
- source_word: Οὗτος
  choice: 这人
  rationale: “这人”保留指示代词带有的疏远、略显轻蔑的语气，又不添加原文没有的评价。
- source_word: ἁμαρτωλοὺς
  choice: 罪人
  rationale: 保留原文中作为社会和宗教类别使用的名词化形容词，不淡化为较宽泛的“有罪的人”。
- source_word: προσδέχεται
  choice: 接待
  rationale: “接待”表达主动而友善地接纳来者，既贴近原词，也避免“接受”在现代汉语中可能偏向观念或心理认同的含义。
- source_word: συνεσθίει αὐτοῖς
  choice: 还和他们一起吃饭
  rationale: 直接表达共同进餐以及其中隐含的席间交往意义，不以解释性措辞扩大原文。
theological_decisions:
- issue: 耶稣与“罪人”来往所具有的社会和神学张力
  choice: 直译为“接待罪人，还和他们一起吃饭”，保留指控中对接纳和同席行为的不满。
  alternative: 欢迎罪人，并与他们同席
  rationale: 所选译法不弱化共同进餐在当时所带来的冒犯感，也不添加诸如认可其行为或宣告其无罪等原文未说的解释。
translation_notes:
  register: 采用现代、庄重而口语可懂的表达。“嘀咕”传达持续低声发怨言的语气；“经学家”避免“文士”在现代汉语中可能被误解为一般文人的问题。
