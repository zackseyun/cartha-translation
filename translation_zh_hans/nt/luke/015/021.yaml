  text: εἶπεν δὲ ⸂ὁ υἱὸς αὐτῷ⸃· Πάτερ, ἥμαρτον εἰς τὸν οὐρανὸν καὶ ἐνώπιόν σου, ⸀οὐκέτι εἰμὶ ἄξιος κληθῆναι υἱός ⸀σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/021.yaml
  text: But the son said to him[a], ‘Father, I have sinned against heaven and before you[b]. I am no longer worthy to be called your son.’
translation:
  language: zh_hans
  text: 儿子却对他说：“父亲，我得罪了天[a]，也在你面前犯了罪。我再也不配称为你的儿子了。[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “天”是对神的敬称；有些译本解释为“神”。
    reason: lexical_alternative
  - marker: b
    text: 有些抄本在这里接着写儿子的话：“把我当作你的一个雇工吧。”这与第19节相应；SBLGNT正文则在“你的儿子”处结束这句话。
    reason: textual_variant
lexical_decisions:
- source_word: εἶπεν δὲ ὁ υἱὸς αὐτῷ
  choice: 儿子却对他说
  rationale: δέ是较轻的连接词；“却”自然承接上文，并表现儿子仍开口认罪这一叙事转折，而不过分强化对比。αὐτῷ按原文译作“对他说”。
- source_word: Πάτερ
  choice: 父亲
  rationale: 直接译出呼格，不增添原文没有的“我的”。“父亲”在现代汉语中庄重自然，也适合此处直接称呼。
- source_word: ἥμαρτον
  choice: 我……犯了罪／我得罪了
  rationale: 在“天”之后用“得罪了”符合现代汉语习惯；在“你面前”之后用“犯了罪”，既避免生硬重复，也保留ἁμαρτάνω承认犯罪的含义。
- source_word: εἰς τὸν οὐρανόν
  choice: 得罪了天
  rationale: 保留原文“天”的敬称表达，不直接解释成“神”；“得罪了天”在汉语中能自然表达向天犯罪。
- source_word: καὶ ἐνώπιόν σου
  choice: 也在你面前犯了罪
  rationale: ἐνώπιον本义是“在……面前／眼前”。此译法保留其关系和临在意味，不将它直接改写成较具解释性的“也得罪了你”。
- source_word: οὐκέτι εἰμὶ ἄξιος
  choice: 我再也不配
  rationale: “再也不”自然表达οὐκέτι，“不配”准确传达ἄξιος在悔罪语境中的资格与配得含义。
- source_word: κληθῆναι υἱός σου
  choice: 称为你的儿子
  rationale: 保留καλέω被动式“被称为”的意义；汉语中“不配称为你的儿子”自然、清楚，并维持父子关系的表达。
theological_decisions:
- issue: 认罪中“天”的所指
  choice: 正文保留“得罪了天”，将“天”视为敬称神的委婉表达，但不在正文中明说“神”
  alternative: 解释性地译作“得罪了神”
  rationale: 原文明确使用οὐρανός（天），保留这一措辞可忠实呈现犹太敬虔语境中的委婉称呼，也避免在正文中消除原有表达层次。
- issue: 本节中儿子话语的结束位置
  choice: 依SBLGNT在“你的儿子”处结束儿子的话
  alternative: 加入“把我当作你的一个雇工吧”等与15:19相应的续语
  rationale: 所据希腊文本在此结束句子；较长读法放入文本异文脚注，使读者知情而不将其并入正文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“父亲”比口语化的“爸”更符合经文语体；“得罪了天，也在你面前犯了罪”兼顾汉语自然度与原文两个不同介词结构。脚注标记分别紧随所说明的“天”和整句话的结尾。
