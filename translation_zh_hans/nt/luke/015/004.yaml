id: LUK.15.4
reference: Luke 15:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Τίς ἄνθρωπος ἐξ ὑμῶν ἔχων ἑκατὸν πρόβατα καὶ ⸀ἀπολέσας ⸂ἐξ αὐτῶν ἓν⸃ οὐ καταλείπει τὰ ἐνενήκοντα ἐννέα ἐν τῇ ἐρήμῳ καὶ πορεύεται ἐπὶ τὸ ἀπολωλὸς ἕως εὕρῃ αὐτό;
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/004.yaml
  text: What man among you, having a hundred sheep and losing one of them, does not leave the ninety-nine in the open country and go after the lost one until he finds it?
translation:
  language: zh_hans
  text: “你们中间谁有一百只羊，丢了其中一只，不把九十九只留在野外[a]，去找那只迷失的羊，直到找着它呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“旷野”。原文所用的词可指野外、牧场或荒僻之地。
    reason: 保留ἐρήμῳ的词义范围，说明此处不一定指荒漠。
lexical_decisions:
- source_word: Τίς ἄνθρωπος ἐξ ὑμῶν
  choice: 你们中间谁
  rationale: 这是自然的现代汉语疑问表达，保留了代表性、泛指性的问法。希腊语ἄνθρωπος在这里指“人”，并非特别强调男性；汉语“谁”无需增添原文没有的性别限制。
- source_word: ἔχων ἑκατὸν πρόβατα
  choice: 有一百只羊
  rationale: 直接而自然地表达拥有一百只羊的情境。
- source_word: ἀπολέσας ἐξ αὐτῶν ἓν
  choice: 丢了其中一只
  rationale: ἀπολέσας在此表示失去一只羊，而不是毁灭它。“丢了”符合牧羊情境和现代汉语习惯，“其中一只”准确保留数量关系。
- source_word: οὐ καταλείπει τὰ ἐνενήκοντα ἐννέα
  choice: 不把九十九只留在
  rationale: 保留希腊语否定式反问；整句预期的回答是肯定的，即这个人会留下九十九只去寻找失羊。
- source_word: ἐν τῇ ἐρήμῳ
  choice: 在野外
  rationale: ἔρημος可指旷野、荒僻之地或未开垦的野外。牧羊语境中“野外”自然清楚，又不把场景限定为寸草不生的荒漠；其他可能含义列于脚注。
- source_word: πορεύεται ἐπὶ τὸ ἀπολωλὸς
  choice: 去找那只迷失的羊
  rationale: 表达朝着失羊而去并加以寻找的行动。“那只迷失的羊”明确补出上下文中的指称，同时保留完成时分词所表示的迷失状态。
- source_word: ἕως εὕρῃ αὐτό
  choice: 直到找着它
  rationale: 准确保留持续寻找直至找到的时间界限；“找着”自然地强调寻找取得结果。
theological_decisions:
- issue: 比喻性问句中的代表性阳性表达
  choice: 译作“你们中间谁”，不另加“男人”
  alternative: 你们中间哪个男人
  rationale: ἄνθρωπος虽为阳性单数形式，但此处语义是泛指一个人。现代汉语“谁”能准确传达这种代表性用法；译成“男人”会无根据地把适用范围限定于男性。
- issue: 反问句的预期答案
  choice: 保留“不……呢”的否定式反问
  alternative: 改写为肯定陈述“都会……”
  rationale: 原文以οὐ引出期待肯定回答的反问。保留反问形式既忠实于耶稣的修辞，也不替读者消解其劝服力度。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。以“丢了”“去找”“找着”形成口语化但不随便的叙事节奏；保留原文单句反问结构及其预期肯定回答。
