source:
  edition: SBLGNT
  text: Ἢ τίς γυνὴ δραχμὰς ἔχουσα δέκα, ἐὰν ἀπολέσῃ δραχμὴν μίαν, οὐχὶ ἅπτει λύχνον καὶ σαροῖ τὴν οἰκίαν καὶ ζητεῖ ἐπιμελῶς ἕως ⸀οὗ εὕρῃ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/008.yaml
  text: Or what woman[a], having ten drachmas, if she loses one drachma[b], does not light a lamp and sweep the house and search carefully until she finds it?
translation:
  language: zh_hans
  text: “又比如，哪一个有十枚德拉克马银币[a]的妇人，若丢了一枚，岂不点上灯，扫屋子，仔细寻找[b]，直到找着为止呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 德拉克马是古希腊的一种银币。
    reason: cultural_note
  - marker: b
    text: “仔细寻找”或译“殷勤寻找”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἢ
  choice: 又比如
  rationale: 承接前一个比喻并引出平行的例证；“又比如”比单独的“或”更符合现代汉语叙述，同时保留连接作用。
- source_word: τίς γυνὴ
  choice: 哪一个妇人
  rationale: 保留反问式的举例结构，不添加原文没有的“你们中间”。
- source_word: δραχμὰς
  choice: 德拉克马银币
  rationale: 保留古代钱币的特定名称，并用“银币”点明其类别，避免泛化为普通“钱币”。
- source_word: ἔχουσα δέκα
  choice: 有十枚
  rationale: 以自然简洁的现代汉语表达希腊文分词短语，并使用钱币量词“枚”。
- source_word: ἐὰν ἀπολέσῃ
  choice: 若丢了
  rationale: 表达一般性的假设情形；“若”与整句庄重而自然的语体协调。
- source_word: δραχμὴν μίαν
  choice: 一枚
  rationale: 上下文已经明确是德拉克马银币，因此不重复币名，同时保留“一枚”的数量强调。
- source_word: οὐχὶ
  choice: 岂不
  rationale: 准确体现预期肯定回答的反问语气。
- source_word: ἅπτει λύχνον
  choice: 点上灯
  rationale: 自然表达点燃照明用灯的动作；原文无定冠词，不特指某一盏灯。
- source_word: σαροῖ τὴν οἰκίαν
  choice: 打扫屋子
  rationale: “打扫”在现代汉语中自然涵盖扫地搜寻的场景；“屋子”具体呈现室内空间。
- source_word: ζητεῖ ἐπιμελῶς
  choice: 仔细寻找
  rationale: 准确传达ἐπιμελῶς所含的认真、细致之意，且符合现代汉语习惯。
- source_word: ἕως οὗ εὕρῃ
  choice: 直到找着为止
  rationale: 清楚表达寻找行为持续到找到失物这一终点；宾语可由上下文自然省略。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重、易懂的现代标准汉语。以“又比如”连接前文，以“岂不……呢”保留原文期待肯定回答的反问形式。脚注标记按其实际说明对象分别置于“德拉克马银币”和“仔细寻找”之后。
