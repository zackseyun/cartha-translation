  text: ὠργίσθη δὲ καὶ οὐκ ἤθελεν εἰσελθεῖν. ὁ ⸀δὲ πατὴρ αὐτοῦ ἐξελθὼν παρεκάλει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/028.yaml
  text: But he became angry and was unwilling to go in[b][a]. So his father came out and pleaded with him.
translation:
  language: zh_hans
  text: 他却生了气，不肯进去。[a]他父亲就出来，再三劝他。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不愿进去”或“拒绝进去”。
    reason: lexical_alternative
  - marker: b
    text: “再三劝他”也可译为“恳劝他”或“劝说他”；原文动词为未完成时，可表示持续或反复地劝说。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὠργίσθη
  choice: 生起气来
  rationale: 该不定过去时在此可表达怒气的产生；“生起气来”比单纯“很生气”更能体现状态的开始，同时不夸大为“暴怒”。
- source_word: δὲ
  choice: 却
  rationale: 第一个δέ与前文的欢庆形成轻微转折；“却”自然传达这种对比。
- source_word: οὐκ ἤθελεν εἰσελθεῖν
  choice: 不肯进去
  rationale: θέλω加不定式表达意愿；“不肯进去”保留意志上的不愿，又不像“拒绝进去”那样明确强调外在的拒绝行为。
- source_word: ὁ δὲ πατὴρ αὐτοῦ
  choice: 父亲就
  rationale: 第二个δέ引出父亲对儿子态度的回应；中文用“就”能自然呈现叙事上的承接。
- source_word: ἐξελθὼν
  choice: 出来
  rationale: 该分词表示从屋内向外移动；结合场景译为“出来”简洁自然。
- source_word: παρεκάλει
  choice: 一再劝他
  rationale: παρακαλέω在此指恳切劝说；未完成时可表示持续或反复的动作。“一再劝”既体现持续恳劝，也避免“哀求”可能带来的过强语气。
- source_word: αὐτόν
  choice: 他
  rationale: 代词指前述大儿子，直译为“他”。
theological_decisions:
- issue: 父亲劝说的语气与主动性
  choice: 一再劝他
  alternative: 恳求他；劝他；再三请求他
  rationale: 译文保留父亲主动出来、持续恳切劝说儿子的关系性力度，但不借此加入经文本身未明说的教义解释。
translation_notes:
  register: 采用现代、庄重而通俗的普通话。“生起气来”体现怒气的产生；“不肯进去”保留意愿层面的含义；“一再劝他”自然表达未完成时所可能包含的持续性。所有脚注标记均置于相关正文之后。
