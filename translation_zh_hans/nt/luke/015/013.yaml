  text: καὶ μετ’ οὐ πολλὰς ἡμέρας συναγαγὼν ⸀πάντα ὁ νεώτερος υἱὸς ἀπεδήμησεν εἰς χώραν μακράν, καὶ ἐκεῖ διεσκόρπισεν τὴν οὐσίαν αὐτοῦ ζῶν ἀσώτως.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/013.yaml
  text: And after not many days[a], the younger son gathered everything together and went away to a distant country, and there he squandered his property[c][b], living recklessly.
translation:
  language: zh_hans
  text: 没过几天[a]，小儿子把自己所有的东西都收拾起来，动身去了一个遥远的地方。在那里，他挥霍了自己的产业[b]，过着毫无节制的生活[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“过了不多几天。”希腊文直译为“在不多几天之后”。
    reason: lexical_alternative
  - marker: b
    text: “产业”或译“家产”“财产”。
    reason: lexical_alternative
  - marker: c
    text: 或译：“过着挥霍无度的生活”或“过着放纵的生活”。原文在这里没有列举具体罪行，而是概括一种不受约束、耗散家财的生活方式。
    reason: lexical_alternative
lexical_decisions:
- source_word: μετ’ οὐ πολλὰς ἡμέρας
  choice: 没过几天
  rationale: 以自然的现代汉语表达希腊文“不多几天以后”的否定式说法；脚注保留较直译的形式。
- source_word: συναγαγὼν πάντα
  choice: 把自己所有的都收拾起来
  rationale: 既保留 συνάγω“聚拢、收拾”的含义，也不武断地解释为变卖或兑换全部资产；分词所表示的先行动作由句序体现。
- source_word: ὁ νεώτερος υἱός
  choice: 小儿子
  rationale: 结合上下文，简洁自然地表达两个儿子中较年轻的那一个。
- source_word: ἀπεδήμησεν
  choice: 动身去了
  rationale: 表达离开本地、前往外地的动作，并与后面的“远方”自然衔接。
- source_word: εἰς χώραν μακράν
  choice: 去了远方
  rationale: χώρα 在此可指地方、地区或国土；“远方”保留其宽泛性，避免无依据地限定为现代意义的国家。
- source_word: διεσκόρπισεν
  choice: 挥霍了
  rationale: 该词本义涉及分散，在财产语境中表示浪费、耗散；“挥霍”准确传达其语用意义。
- source_word: τὴν οὐσίαν αὐτοῦ
  choice: 自己的产业
  rationale: οὐσία 指一个人所拥有的财物或资产；“产业”贴合本段分家产的语境，又不局限于土地。
- source_word: ζῶν ἀσώτως
  choice: 过着毫无节制的生活
  rationale: 传达 ἀσώτως 所表示的放纵、不节制和不顾后果，同时不擅自加入经文未明说的特定罪行。
theological_decisions:
- issue: ἀσώτως 是否应具体译成某类道德罪行
  choice: 过着毫无节制的生活
  alternative: 过着放荡的生活；荒淫度日
  rationale: 本节只概括其失控、浪费的生活方式，并未明确指出性方面或其他特定罪行；采用宽泛译法以保留经文本身的范围。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“没过几天”符合普通话习惯；“动身去了远方”流畅表达离家远行。“毫无节制”避免“荒淫”等词可能带入的特定性含义。所有脚注标记均置于对应主文之后。
