  naturalness: “因为我这个儿子死了，又活过来了；他失丧了，被找到了。他们就开始欢庆。”在现代标准汉语中自然、庄重，并保留叙事的简洁节奏。“被找到了”虽较“找到了”略显书面，但在此能清楚表达原文被动而不指明施事者。
  terminology: “我这个儿子”“死了”“又活过来了”“失丧”“欢庆”均恰当。“失丧”带有适度经文语体，并与本章反复出现的失落／寻回主题相称。删除“如今”可避免超过原文的限定；将“找到了”改为“被找到了”可使被动形式及其施事者开放性更明确。
