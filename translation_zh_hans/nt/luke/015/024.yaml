  to: 因为我这个儿子死了，又活过来了[a]；他失丧了，被找到了[b]。他们就开始欢庆。
  rationale: 修订仅删除原文未明说的“如今”，并以“被找到了”明确呈现εὑρέθη的被动形式及未指明施事者的开放性。删去“于是”使καί的简单连续关系不被强化为明确的逻辑推论；“就开始”仍自然表达庆祝随此而起，且保留ἤρξαντο的起始意义。
