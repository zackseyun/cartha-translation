  text: ὅτι οὗτος ὁ υἱός μου νεκρὸς ἦν καὶ ἀνέζησεν, ⸂ἦν ἀπολωλὼς⸃ καὶ εὑρέθη. καὶ ἤρξαντο εὐφραίνεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/024.yaml
  text: because this son of mine was dead and has come to life again[a]; he was lost and has been found[b]. And they began to celebrate.
translation:
  language: zh_hans
  text: 因为我这个儿子死了，又活过来了[a]；他失丧了，被找到了[b]。他们就开始欢庆。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“又活了”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“找到了”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 承接父亲对欢庆缘由的说明，现代汉语用“因为”自然明确。
- source_word: οὗτος ὁ υἱός μου
  choice: 我这个儿子
  rationale: 保留οὗτος的指示和强调，同时符合现代汉语自然语序，并传达父亲对儿子的明确指认。
- source_word: νεκρὸς ἦν
  choice: 死了
  rationale: 保留原文鲜明的死亡用语，不把比喻意义解释性地改写为疏远或离弃。
- source_word: ἀνέζησεν
  choice: 又活过来了
  rationale: ἀναζάω表示重新活过来；“又活过来了”自然地与前面的“死了”构成对照，并体现恢复后的现状。
- source_word: ἦν ἀπολωλὼς
  choice: 他失丧了
  rationale: “失丧”保留本章贯穿的失而复得主题，也能表达此前处于迷失、失落的状态。
- source_word: εὑρέθη
  choice: 如今找到了
  rationale: “找到”保留被动意义在汉语中的自然无标记表达，不明说寻找者；加入“如今”凸显与先前失丧状态的对照和当前结果。
- source_word: ἤρξαντο εὐφραίνεσθαι
  choice: 于是他们就开始欢庆
  rationale: “开始”保留起始体；“欢庆”贴合筵席场景中的喜乐庆祝。“于是”自然承接前述理由所引出的行动。
theological_decisions:
- issue: “死了”与“又活过来了”的比喻张力
  choice: 照原文保留死亡与复生的直接表述，不在正文中解释其属灵或关系层面的含义。
  alternative: 意译为“仿佛死了，如今在属灵或关系上恢复了”。
  rationale: 故事中的用语具有比喻力量，但原文有意采用鲜明的生死语言；直译能保留其神学张力，避免把解释写入正文。
- issue: εὑρέθη的施事者
  choice: 采用汉语自然的“找到了”，不指明是谁找到他。
  alternative: 译为“被父亲找到了”或“被上帝找到了”。
  rationale: 希腊文为被动式且没有明说施事者；译文应保留这种开放性，不加入原文未明说的神学指认。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事语言。“我这个儿子”保留指示强调；“失丧”稍具经文语体，但在本章失而复得的反复结构中准确且易懂。所有脚注标记均已置于正文相应位置。
