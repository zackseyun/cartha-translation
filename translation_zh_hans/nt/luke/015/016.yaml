  text: καὶ ἐπεθύμει ⸂γεμίσαι τὴν κοιλίαν αὐτοῦ ἀπὸ⸃ τῶν κερατίων ὧν ἤσθιον οἱ χοῖροι, καὶ οὐδεὶς ἐδίδου αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/016.yaml
  text: And he longed to fill his stomach with the carob pods that the pigs were eating[a], and no one was giving him anything.
translation:
  language: zh_hans
  text: 他恨不得用猪所吃的角豆荚填饱肚子[a]，却没有人给他任何东西。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “角豆荚”是角豆树结的荚果，当时常用作牲畜饲料。
    reason: 为现代读者说明希腊词所指的具体植物果荚及其场景意义。
lexical_decisions:
- source_word: ἐπεθύμει
  choice: 恨不得
  rationale: 未完成时表示持续而强烈的愿望；“恨不得”在现代汉语中自然传达饥饿中的迫切渴望，又不额外说明愿望是否实现。
- source_word: γεμίσαι τὴν κοιλίαν αὐτοῦ
  choice: 填饱肚子
  rationale: 保留“填满腹部”的具体意象；“填饱肚子”比逐字的“填满腹部”更符合现代汉语，同时仍以身体饥饿为焦点。
- source_word: ἀπὸ τῶν κερατίων
  choice: 拿……角豆荚
  rationale: ἀπό在这里表示用来填饱肚子的来源或材料；汉语用“拿……填饱”自然表达这一关系。
- source_word: κερατίων
  choice: 角豆荚
  rationale: 该词具体指角豆树的豆荚，曾用作牲畜饲料；“角豆荚”准确且比泛称“豆荚”信息更完整。
- source_word: οἱ χοῖροι
  choice: 猪
  rationale: “猪”是现代标准汉语最自然、直接的对应词。
- source_word: ἤσθιον
  choice: 正在吃
  rationale: 未完成时描绘当时持续进行的动作，“正在吃”清楚呈现场景。
- source_word: οὐδεὶς ἐδίδου αὐτῷ
  choice: 却没有人给他什么
  rationale: ἐδίδου的未完成时表示持续无人供给；原文没有明说所给之物，译作“什么”既符合汉语习惯，也保留对象未明的特点。“却”呈现前后处境的反差。
theological_decisions:
- issue: 无人给他的东西是否特指角豆荚
  choice: 保留为“没有人给他什么”
  alternative: “没有人给他角豆荚吃”
  rationale: 希腊文省略了直接宾语，可能泛指无人给他任何东西，也可能由语境指豆荚；正文不把这种含混限定为后者。
translation_notes:
  register: 采用现代、自然而庄重的叙事语言。“恨不得”传达强烈而持续的欲望；“填饱肚子”保持具体身体意象，适合普通读者。脚注标记已置于相关词组之后。
