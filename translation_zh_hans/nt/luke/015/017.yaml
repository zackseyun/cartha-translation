id: LUK.15.17
reference: Luke 15:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἰς ἑαυτὸν δὲ ἐλθὼν ⸀ἔφη· Πόσοι μίσθιοι τοῦ πατρός μου ⸀περισσεύονται ἄρτων, ἐγὼ δὲ ⸂λιμῷ ὧδε⸃ ἀπόλλυμαι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/017.yaml
  text: But when he came to himself[a], he said, ‘How many of my father’s hired workers have more than enough bread[c][b], but here I am perishing from hunger!’
translation:
  language: zh_hans
  text: 他回过神来[a]，就说：‘我父亲的雇工有多少啊，饼多得吃不完[b]，我却在这里饿得快要死了[c]！’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“回到自己”；也可译作“清醒过来”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“饼很有余”。希腊文具体说“饼”。
    reason: lexical_alternative
  - marker: c
    text: 或译：“我却在这里因饥饿而丧命。”原词也可指“毁灭”。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἑαυτὸν ... ἐλθὼν
  choice: 回过神来
  rationale: 这是表示恢复清醒、自觉处境的习语；此译自然传达其意义，同时用脚注保留希腊文“回到自己”的原有意象。
- source_word: ἔφη
  choice: 就说
  rationale: 不定过去时在叙事中表示随后发生的言说；“就说”符合现代汉语叙事节奏。
- source_word: μίσθιοι
  choice: 雇工
  rationale: 指领取工钱的工人，不是奴仆；“雇工”准确且简洁。
- source_word: περισσεύονται ἄρτων
  choice: 个个都有吃不完的饼
  rationale: περισσεύονται 表达充足而有余；补出“个个”使 πόσοι 所涵盖的众多雇工与谓语在汉语中关系清楚，并保留 ἄρτων 的具体意象。
- source_word: ἄρτων
  choice: 饼
  rationale: 希腊文具体指作为主食的饼，不宜在正文中泛化为“食物”。
- source_word: λιμῷ
  choice: 饿
  rationale: 此处指饥饿或饥饿状态，而非泛指饥荒；汉语动词化表达最自然。
- source_word: ὧδε
  choice: 在这里
  rationale: 明确他当前悲惨处境与父亲家中雇工的生活形成对照。
- source_word: ἀπόλλυμαι
  choice: 快要……死了
  rationale: 在饥饿语境中表示正在走向毁灭或死亡；此译自然表现持续加剧、危及性命的状态，脚注注明较宽的译法。
theological_decisions:
- issue: εἰς ἑαυτὸν ἐλθών 是否应直接译成带有悔改含义的措辞
  choice: 回过神来
  alternative: 悔悟过来
  rationale: 原文直接表达恢复清醒和自觉，并未在这个短语本身使用“悔改”的专门用语；避免把上下文可能蕴含的悔改意义直接写入词义。
- issue: ἀπόλλυμαι 是否仅指属灵灭亡
  choice: 按饥饿语境译为快要饿死
  alternative: 正在灭亡
  rationale: 上下文是缺乏食物造成的生命危险；不把该词在其他语境中的神学含义强加于此，同时以脚注保留“毁灭／丧命”的较宽语义。
translation_notes:
  register: 采用现代、清楚而庄重的叙事口吻。“回过神来”是普通读者熟悉的习语；“雇工”与奴仆有明确区别；引语中的“个个都有吃不完的饼”自然表达食物充足有余，并保持原文强烈的对比和感叹语气。
