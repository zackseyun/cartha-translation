  text: καὶ ἀναστὰς ἦλθεν πρὸς τὸν πατέρα ⸀ἑαυτοῦ. ἔτι δὲ αὐτοῦ μακρὰν ἀπέχοντος εἶδεν αὐτὸν ὁ πατὴρ αὐτοῦ καὶ ἐσπλαγχνίσθη καὶ δραμὼν ἐπέπεσεν ἐπὶ τὸν τράχηλον αὐτοῦ καὶ κατεφίλησεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/020.yaml
  text: And he arose and came to his father[a]. But while he was still far away, his father saw him and was moved with compassion[b], and ran and fell on his neck and kissed him fervently.
translation:
  language: zh_hans
  text: 于是他起身，来到父亲那里。他还在远处[a]，父亲就看见了他，动了怜悯的心，便跑上前去，扑在他的颈项上，热切地亲吻他[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他还离得很远时”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文动词带有亲昵而强烈的意味，也可能指一再亲吻他。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: 起来
  rationale: 该不定过去时分词先于主要动词，表明儿子采取行动；“起来”既保留叙事次序，也不把后面的移动含义提前译入。
- source_word: ἦλθεν πρὸς τὸν πατέρα ἑαυτοῦ
  choice: 到父亲那里去
  rationale: ἔρχομαι可随叙事视角译为“来”或“去”；汉语在以儿子为行动主体的语境中用“到……那里去”自然清楚。ἑαυτοῦ所表达的反身所属关系由上下文自然体现。
- source_word: ἔτι δὲ αὐτοῦ μακρὰν ἀπέχοντος
  choice: 他还在远处
  rationale: 这是属格独立结构，表示与下文同时发生的情形。“还在远处”简洁自然，并保留距离尚远这一重点。
- source_word: ἐσπλαγχνίσθη
  choice: 动了怜悯的心
  rationale: 该动词表达发自内心的深切怜悯；这一译法比单纯“怜悯他”更能传达情感被触动的力度，同时不附加神学解释。
- source_word: δραμὼν
  choice: 跑上前去
  rationale: 分词直接描写父亲奔跑的动作；“上前去”使现代汉语的动作方向自然明确，并未改变其核心意义。
- source_word: ἐπέπεσεν ἐπὶ τὸν τράχηλον αὐτοῦ
  choice: 扑在他的颈项上
  rationale: 尽量保留希腊文“落在/扑在他的颈项上”的鲜明身体动作，而不扩写为原文没有明说的“伸手搂住”。“颈项”在庄重叙事中可懂，也较“脖子”更符合经文语体。
- source_word: κατεφίλησεν
  choice: 热切地亲他
  rationale: καταφιλέω可带有加强意味，表达亲吻时的深厚感情，并可能暗示反复亲吻。“热切地亲他”保留强烈亲情，却不把“反复”确定为唯一解释。
theological_decisions:
- issue: 比喻中父亲怜悯的表现
  choice: 用情感鲜明、动作具体的语言呈现父亲主动迎接儿子
  alternative: 弱化父亲的情感，或直接增译为上帝对罪人的接纳
  rationale: 本节本身以看见、怜悯、奔跑、扑在颈项上和亲吻等连续动作突出父亲的主动与深情。译文应保存这种叙事力度，却不越过文本，直接说明比喻所象征的神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“于是……便……”使动作推进清楚；“颈项”略带经文庄重感，但仍为普通读者所理解。脚注分别保留距离表达的另一种自然译法，以及加强动词在亲吻强度与可能重复性之间的语义余地。
