  text: ὁ δὲ εἶπεν αὐτῷ· Τέκνον, σὺ πάντοτε μετ’ ἐμοῦ εἶ, καὶ πάντα τὰ ἐμὰ σά ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/031.yaml
  text: And he said to him[a], ‘Child, you are always with me, and all that is mine is yours.’
translation:
  language: zh_hans
  text: 父亲对他说：“孩子[a]，你一直都和我在一起，我所有的一切都是你的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“儿子”。希腊文直译为“孩子”，是亲切的家庭称呼。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τέκνον
  choice: 孩子
  rationale: 这是带有亲情和温柔意味的呼格。“孩子”自然保留了称呼的亲昵，也没有把原文并未明确使用的男性称谓直接写入正文。
- source_word: πάντοτε
  choice: 一直
  rationale: 表达持续处于同在关系之中，比“总是”在这句现代汉语对话里更自然。
- source_word: μετ’ ἐμοῦ
  choice: 和我在一起
  rationale: 直接表达 μετά 加属格所表示的陪伴、同在关系。
- source_word: πάντα τὰ ἐμὰ
  choice: 我所有的一切
  rationale: 概括父亲全部所有之物，保留原文的全面性，并采用自然的现代汉语表达。
- source_word: σά ἐστιν
  choice: 都是你的
  rationale: 贴近原文表语结构，并保留其究竟侧重所有权、可支配权还是亲属关系的宽泛含义。
- source_word: ὁ δὲ εἶπεν αὐτῷ
  choice: 父亲对他说
  rationale: 根据比喻中的明确指称补出“父亲”，使独立经节自然清楚；δέ在此是轻微转折或叙事承接，不必另译为强烈的“但是”。
theological_decisions:
- issue: 父亲对大儿子的亲属称呼
  choice: 正文译作“孩子”
  alternative: “儿子”或“我的孩子”
  rationale: τέκνον侧重亲属关系和亲切语气，不像υἱός那样直接标明“儿子”；“孩子”保留这种温柔而较宽的表达。“我的孩子”则会增添原文没有明说的所有格。
- issue: “都是你的”的关系含义
  choice: 保留宽泛陈述
  alternative: 译作“都归你”或“都属于你”
  rationale: 原文可在比喻语境中涉及产业，也带有父子关系层面的意味；“都是你的”不把它限定为严格的法律产权陈述。
translation_notes:
  register: 采用自然、庄重的现代标准汉语，保留父亲温和亲切的口吻。以“孩子”对应τέκνον，并用脚注说明语境中也可译为“儿子”。
