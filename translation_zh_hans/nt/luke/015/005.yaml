  text: καὶ εὑρὼν ἐπιτίθησιν ἐπὶ τοὺς ὤμους ⸀αὐτοῦ χαίρων,
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/005.yaml
  text: And when he has found it[a], he lays it on his shoulders, rejoicing.
translation:
  language: zh_hans
  text: 找到了，就欢欢喜喜地把它[a]放在自己肩上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “它”指上文那只迷失的羊。
    reason: cross_reference
lexical_decisions:
- source_word: εὑρὼν
  choice: 找到了，就
  rationale: 不定过去时主动分词表示先于主句动作发生的情形；用“找到了，就”自然呈现其时间关系，并保留叙事的明快感。
- source_word: ἐπιτίθησιν
  choice: 把它放在
  rationale: 现在时主动直陈语气构成主要动作；“放在……肩上”是现代汉语自然表达，也保留原文生动的叙述现在时所呈现的动作。
- source_word: ἐπὶ τοὺς ὤμους
  choice: 肩上
  rationale: ἐπί加宾格表示移放到某处。希腊语“肩”用复数，汉语惯用单数形式“肩上”统称双肩，无须机械译成“肩膀们”。
- source_word: αὐτοῦ
  choice: 自己
  rationale: 代词指牧人。汉语在主语与所有者相同时用“自己”更清楚自然，可避免将肩膀误解为羊的。
- source_word: χαίρων
  choice: 欢欢喜喜地
  rationale: 现在时主动分词表达与主要动作同时发生的喜悦状态或方式；“欢欢喜喜地”自然、鲜明，并未增添原文没有的原因或程度。
theological_decisions:
- issue: 补出“找到”的宾语
  choice: 以“它”指上文迷失的羊，并加脚注说明
  alternative: 不补宾语，译作“找到了，就欢欢喜喜地放在自己肩上”
  rationale: 希腊文可按上下文省略宾语，但现代汉语若完全省略，会使“放在肩上”的对象表达不够完整。补出“它”只明示上文已经确定的所指，不改变比喻的神学含义。
translation_notes:
  register: 采用现代、自然而庄重的叙事语言。“欢欢喜喜地”贴近日常表达，又能传达χαίρων的喜悦重点；句式简洁，适合公开朗读。
