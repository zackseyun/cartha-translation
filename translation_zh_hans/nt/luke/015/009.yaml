  text: καὶ εὑροῦσα ⸀συγκαλεῖ τὰς φίλας ⸀καὶ γείτονας λέγουσα· Συγχάρητέ μοι ὅτι εὗρον τὴν δραχμὴν ἣν ἀπώλεσα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/009.yaml
  text: And when she has found it[a], she calls together her women friends and neighbors, saying, ‘Rejoice with me, because I found the drachma that I had lost.’
translation:
  language: zh_hans
  text: 她找到了之后，就召集她的女伴和邻居们来，说：“和我一同欢喜吧，因为我找到了我丢失的那枚德拉克马银币[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 德拉克马是希腊银币；在许多情境下，一枚约相当于一个工人一天的工钱。
    reason: cultural_note
lexical_decisions:
- source_word: εὑροῦσα
  choice: 她找到了，就
  rationale: 将阴性单数不定过去时分词按先后关系自然表达，主语承接上文的妇人，宾语由下文的钱币明确，无须在此重复。
- source_word: συγκαλεῖ
  choice: 把……召集来
  rationale: 保留复合动词“召集到自己这里”的含义，也体现历史现在时的生动叙述效果。
- source_word: τὰς φίλας
  choice: 女友
  rationale: 希腊文为阴性复数，明确指女性朋友；“女友”在此与“邻舍”并列，语境足以表明是女性朋友，而非恋爱关系。
- source_word: γείτονας
  choice: 邻舍
  rationale: 该词指邻居；与阴性的“女友”并列，但其自身形式不强制限定性别，因此不额外添加“女”。“邻舍”庄重且为现代读者熟悉。
- source_word: Συγχάρητέ μοι
  choice: 和我一同欢喜吧
  rationale: 直接表达与说话者共同欢喜的复数命令语气，保留 συγχαίρω 的共同参与含义。
- source_word: ὅτι
  choice: 因为
  rationale: 在这里引出邀请众人欢喜的原因。
- source_word: τὴν δραχμὴν
  choice: 那枚德拉克马银币
  rationale: 保留具体币名，并加“银币”说明其类别；定冠词结合关系从句译为特指的“那枚”。
- source_word: ἣν ἀπώλεσα
  choice: 我丢失的
  rationale: 关系从句限定该银币；中文定语结构自然表达先前丢失、如今寻回的关系，无须显式标示过去完成时。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准普通话。以“召集来”保留叙事的生动性；“德拉克马银币”兼顾原文币名与普通读者的理解。脚注标记紧随币名，避免误以为注释所指是整句。
