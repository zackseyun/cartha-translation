  text: οὗτός ἐστιν περὶ οὗ γέγραπται· ⸀Ἰδοὺ ἀποστέλλω τὸν ἄγγελόν μου πρὸ προσώπου σου, ὃς κατασκευάσει τὴν ὁδόν σου ἔμπροσθέν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/027.yaml
  text: 'This is he about whom it is written: ‘Behold[a], I am sending my messenger before your face[b], who will prepare your way before you.’'
translation:
  language: zh_hans
  text: 这人就是经上所记的那一位：“看哪，我要差遣我的使者[a]在你面前；他要在你前面预备你的道路。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使者”所译的希腊词也可指“天使”；这里指受差遣的人，也就是约翰。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός ἐστιν περὶ οὗ γέγραπται
  choice: 这人就是经上所记的那一位
  rationale: 既保留指向约翰的强调语气，也用现代汉语自然表达圣经引文的引介公式；“经上”明确这里所指的是圣经记载，却不扩展引文的含义。
- source_word: Ἰδοὺ
  choice: 看哪
  rationale: 保留先知性引文中唤起注意的庄重语气，同时仍为现代读者所能理解。
- source_word: ἀποστέλλω
  choice: 我要差遣
  rationale: “差遣”准确表达受命派出的含义；“要”在汉语中自然呈现此处带有预告色彩的现在时。
- source_word: ἄγγελόν
  choice: 使者
  rationale: 该词可指使者或天使；本节所指是约翰这位受差派的人，因此正文采用不致误导为天上使者的“使者”。
- source_word: πρὸ προσώπου σου
  choice: 在你面前
  rationale: 既保留原文“在你面前”的具体意象，也符合自然、庄重的现代汉语。
- source_word: κατασκευάσει
  choice: 要……预备
  rationale: 准确表达将要使之准备妥当的动作。
- source_word: τὴν ὁδόν σου
  choice: 你的道路
  rationale: “道路”既可指实际道路，也能承载先知性语境中的比喻意义，不替正文预先作解释。
- source_word: ἔμπροσθέν σου
  choice: 在你前面
  rationale: 采用自然汉语，并以“前面”区别于前一句较具形象感的“面前”，从而尽量反映原文两个相近但不同的表达。
theological_decisions:
- issue: 耶稣把先知性经文应用于约翰与自己之间的关系
  choice: 保留所有第二人称表达：“你面前”“你的道路”“你前面”
  alternative: 直接释义为使者为主或弥赛亚预备道路
  rationale: 原文借第二人称代词产生神学关联，却没有在本句中加以解释；译文因此保留其张力，不加入经文以外的身份说明。
translation_notes:
  register: 采用现代、庄重而易懂的经文语体。“看哪”“差遣”保留引文的肃穆感；其余句法按现代汉语调整，避免生硬直译。
