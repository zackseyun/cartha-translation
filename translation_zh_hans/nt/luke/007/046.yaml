  text: ἐλαίῳ τὴν κεφαλήν μου οὐκ ἤλειψας· αὕτη δὲ μύρῳ ἤλειψεν ⸂τοὺς πόδας μου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/046.yaml
  text: You did not anoint my head with oil[a], but she has anointed my feet with perfume.
translation:
  language: zh_hans
  text: 你没有用油抹我的头，她却用香膏[a]抹了我的脚。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “香膏”也可译作“香油”或“芳香油膏”。
    reason: 说明 μύρον 的词义范围；标记置于“香膏”之后，明确只关联后半句所指的芳香油膏，而不关联前半句的普通“油”。
lexical_decisions:
- source_word: ἐλαίῳ
  choice: 用油
  rationale: 工具与格，表示施行动作所用之物。译作“油”自然且忠实；原文在此不必明确补出“橄榄油”。
- source_word: ἤλειψας / ἤλειψεν
  choice: 抹 / 抹了
  rationale: ἀλείφω指把油或膏涂抹在身上。现代汉语“抹”既能自然表达待客时抹油的举动，也避免“膏立”可能带入的正式礼仪或宗教含义。
- source_word: τὴν κεφαλήν μου
  choice: 我的头
  rationale: 直接对应原文的宾语和所属关系。
- source_word: αὕτη δὲ
  choice: 她却
  rationale: 保留原文在“你”与“她”之间的鲜明对比；上下文已清楚指出这名女子，无须增译“这个女人”。
- source_word: μύρῳ
  choice: 用香膏
  rationale: μύρον指芳香的油膏或香料制剂。“香膏”在现代中文圣经语境中自然，也清楚区别于前句普通的“油”。
- source_word: τοὺς πόδας μου
  choice: 我的脚
  rationale: 直接表达复数 πόδας；现代汉语通常以单数形式“脚”统称双脚，较“我的双脚”自然。
theological_decisions:
- issue: 耶稣责备中待客礼遇的对比
  choice: 以“用油抹我的头”与“用香膏抹了我的脚”平实呈现对比
  alternative: 采用“膏我的头／膏我的脚”等更具礼仪色彩的措辞
  rationale: 本节首先对比主人未尽的待客礼节与女子格外尊敬的举动。译文不额外赋予圣礼、膏立或基督论含义，以免超出当前语境。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“她却”突出原文对比；“抹”比“膏”更符合当代自然表达，并避免不必要的宗教术语色彩。
