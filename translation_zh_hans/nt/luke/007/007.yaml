id: LUK.7.7
reference: Luke 7:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: διὸ οὐδὲ ἐμαυτὸν ἠξίωσα πρὸς σὲ ἐλθεῖν· ἀλλὰ εἰπὲ λόγῳ, καὶ ⸀ἰαθήτω ὁ παῖς μου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/007.yaml
  text: Therefore I did not even consider myself worthy to come to you. But say the word[a], and let my servant be healed.
translation:
  language: zh_hans
  text: 所以，我甚至认为自己不配到你那里去。只要说一句话，我的仆人[a]就会得医治。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “仆人”或译“孩子”或“少年”；希腊语 παῖς 可按语境指孩子、少年或仆人。
    reason: 保留原词的词义范围，避免把其身份或关系解释得过于确定。
lexical_decisions:
- source_word: διὸ
  choice: 所以
  rationale: 承接上一节百夫长自认不配的陈述，清楚表达推论关系，也符合现代汉语叙事习惯。
- source_word: οὐδὲ ἐμαυτὸν ἠξίωσα
  choice: 我甚至认为自己不配
  rationale: οὐδὲ 加强否定，译作“甚至”；ἀξιόω 与反身代词表示认为自己配得或够资格，汉语用“不配”自然且准确。
- source_word: πρὸς σὲ ἐλθεῖν
  choice: 到你那里去
  rationale: 表达亲自来到耶稣面前；此译法自然，并保留移动和接近的含义。
- source_word: ἀλλὰ εἰπὲ λόγῳ
  choice: 只要说一句话
  rationale: ἀλλά 引出与亲自前往相对的请求；λόγῳ 是方式或手段用法。“只要说一句话”自然传达百夫长相信耶稣话语具有权柄，并未误加特定命令的内容。
- source_word: ἰαθήτω
  choice: 就会得医治
  rationale: 原文为第三人称单数不定过去时被动命令式。汉语若直译为“让……得医治”较生硬；结合“只要……就……”结构，以结果句自然表达所求的医治，同时保留被动意义。
- source_word: ὁ παῖς μου
  choice: 我的仆人
  rationale: παῖς 可指孩子、少年或仆人；本段百夫长及其权柄关系的语境较支持“仆人”，其他可能含义以脚注保留。
theological_decisions:
- issue: 百夫长所称 παῖς 的身份
  choice: 我的仆人
  alternative: 我的孩子／我的少年
  rationale: 该词本身含义宽泛；叙事语境中的家内权柄关系支持“仆人”，但原词也可能带有年龄或亲昵色彩，因此不在正文中进一步断定其具体身份，并在脚注说明。
- issue: ἰαθήτω 的命令式语气
  choice: 就会得医治
  alternative: 让我的仆人得医治
  rationale: 形式上是被动命令式，但现代汉语对结果状态使用第三人称命令式很不自然。“只要……就会……”在此准确呈现百夫长对耶稣权威话语之效力的确信，而不额外解释医治机制。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“所以”承接上文；“我甚至认为自己不配”保留加强否定和自我评估；“只要……就会……”使希腊语请求在汉语中自然可懂。脚注标记已在正文“仆人”之后标出。
