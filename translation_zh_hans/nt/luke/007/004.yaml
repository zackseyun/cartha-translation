id: LUK.7.4
reference: Luke 7:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οἱ δὲ παραγενόμενοι πρὸς τὸν Ἰησοῦν παρεκάλουν αὐτὸν σπουδαίως λέγοντες ὅτι Ἄξιός ἐστιν ᾧ ⸀παρέξῃ τοῦτο,
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/004.yaml
  text: When they came to Jesus[a], they earnestly appealed to him, saying, “He is worthy that you should grant this to him.”
translation:
  language: zh_hans
  text: 他们来到耶稣那里，就恳切地求他，说：“他配得你为他做这事[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他配得你把这恩惠赐给他。”
    reason: παρέχω在此既可概括为“做”，也可强调给予、准予某项恩惠；脚注保留后一种表达。
lexical_decisions:
- source_word: παραγενόμενοι
  choice: 来到
  rationale: 该分词表示来到并在场；在这里用“来到耶稣那里”自然地表达其时间背景。
- source_word: παρεκάλουν
  choice: 求
  rationale: 该词在此表示带着敬意提出迫切请求；“求”简洁自然，并由“恳切地”体现请求的强度。
- source_word: σπουδαίως
  choice: 恳切地
  rationale: 该副词表达认真、热切的态度；“恳切地”符合代人求助的语境，同时不过度强化为哀求。
- source_word: Ἄξιός
  choice: 配得
  rationale: 该词表示配得、值得；“配得”保留说话者对百夫长资格与品格的正面判断。
- source_word: ᾧ
  choice: 为他
  rationale: 与格关系代词指百夫长；中文以“为他”明确受益者关系。
- source_word: παρέξῃ
  choice: 做
  rationale: παρέχω可表示给予、提供或施行；在“这事”的搭配中，“为他做”是自然中文，也保留所求行动未被具体重述的特点。
- source_word: τοῦτο
  choice: 这事
  rationale: 指向上文所求之事；“这事”既清楚又避免添加原文没有明说的“恩惠”或“请求”。
theological_decisions: []
