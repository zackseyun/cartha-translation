  text: οἱ δὲ Φαρισαῖοι καὶ οἱ νομικοὶ τὴν βουλὴν τοῦ θεοῦ ἠθέτησαν εἰς ἑαυτούς, μὴ βαπτισθέντες ὑπ’ αὐτοῦ.)
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/030.yaml
  text: But the Pharisees and the lawyers rejected God's purpose for themselves[b][a], not having been baptized by him.
translation:
  language: zh_hans
  text: 但法利赛人和律法专家拒绝了上帝对他们的旨意[a]，没有受他的洗礼[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“上帝为他们所定的旨意”，或“上帝针对他们的旨意”。
    reason: alternative_reading
  - marker: b
    text: “他”指施洗约翰。
    reason: cross_reference
lexical_decisions:
- source_word: νομικοὶ
  choice: 律法专家
  rationale: 指精通摩西律法的人；“律法专家”在现代汉语中清楚自然，也避免把他们与另一称谓“文士”完全等同。
- source_word: βουλὴν
  choice: 旨意
  rationale: βουλή可指旨意、计划或筹划；“旨意”适合以上帝为属格限定语的语境，同时不把它过度限定为不可抗拒的谕令。
- source_word: ἠθέτησαν
  choice: 拒绝了
  rationale: ἀθετέω在此表达拒斥、不接受；“拒绝了”直接而自然。
- source_word: εἰς ἑαυτούς
  choice: 对他们
  rationale: 保留该短语“涉及他们自身”的宽泛关系，不强行判定为“为他们”或“对他们不利”；相关歧义在脚注中说明。
- source_word: μὴ βαπτισθέντες ὑπ’ αὐτοῦ
  choice: 没有受他的洗
  rationale: 以简洁的伴随情形表达希腊文否定的过去被动分词，不明确添加“因为”，从而保留其与主句之间可能是原因、方式或伴随情形的关系。
- source_word: αὐτοῦ
  choice: 他的
  rationale: 依照原文保留代词；上下文所指是施洗约翰，并在脚注澄清。
- source_word: δὲ
  choice: 但
  rationale: 清楚表现本节与前一节中众人接受约翰之洗的对比。
theological_decisions:
- issue: 上帝的βουλή与法利赛人及律法专家的关系
  choice: 上帝对他们的旨意
  alternative: 上帝为他们所定的旨意；上帝针对他们的旨意
  rationale: “对他们”保留εἰς ἑαυτούς的关系性歧义，既可理解为关乎或为了他们，也不排除“对他们不利”的读法；同时避免预先解决上帝旨意如何被人拒绝的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“律法专家”比“律法师”更直接说明其身份；句法保持简洁，并以脚注保存原文在介词短语和代词指向上的信息。
