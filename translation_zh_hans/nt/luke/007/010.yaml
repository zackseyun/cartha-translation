  text: καὶ ὑποστρέψαντες ⸂εἰς τὸν οἶκον οἱ πεμφθέντες⸃ εὗρον ⸀τὸν δοῦλον ὑγιαίνοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/010.yaml
  text: And when those who had been sent returned to the house[a], they found the slave healthy.
translation:
  language: zh_hans
  text: 那些被差去的人回到那家，发现那奴仆[a]身体健康。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “奴仆”也可译作“仆人”。希腊语δοῦλος通常指隶属于主人、受主人权柄支配的人。
    reason: alternative_reading
lexical_decisions:
- source_word: ὑποστρέψαντες
  choice: 回到
  rationale: 不定过去时分词在此表示先于主句动作发生的情形；汉语以“回到……，发现……”自然表达动作次序，无须机械译出分词结构。
- source_word: εἰς τὸν οἶκον
  choice: 到那家里
  rationale: εἰς加宾格表示朝向或进入某处。“到那家里”既保留具体地点，也不把οἶκος过度解释为抽象的“家”。
- source_word: οἱ πεμφθέντες
  choice: 那些奉差遣的人
  rationale: 保留πέμπω不定过去时被动分词的被动意义，并避免增添原文没有的“使者”这一身份名词。
- source_word: εὗρον
  choice: 发现
  rationale: 符合εὑρίσκω在叙事语境中“见到并确认某种状况”的常用意义。
- source_word: τὸν δοῦλον
  choice: 那奴仆
  rationale: δοῦλος指处于主人权下、没有自由身份的人。现代汉语“奴仆”比单纯“仆人”更能保留其受奴役的社会身份，同时在圣经叙事中较为自然庄重。
- source_word: ὑγιαίνοντα
  choice: 已经康复了
  rationale: ὑγιαίνω意为处于健康、健全的状态；上下文中此人先前病危，因此“已经康复了”自然传达他们回来时所见的健康状态。它没有直接采用“被医治”，从而不把原文的状态分词改成明确的被动医治表述。
theological_decisions:
- issue: 医治叙事中δοῦλος的译法
  choice: 奴仆
  alternative: 仆人
  rationale: “奴仆”保留此人在百夫长权下的非自由社会身份；“仆人”较符合部分传统译法，却可能使现代读者误以为只是受雇佣的家仆。脚注列出这一可行译法。
- issue: ὑγιαίνοντα表达健康状态还是医治行动
  choice: 已经康复了
  alternative: 身体健康／得了医治
  rationale: 原文描述回来的人发现奴仆正处于健康状态，并未直接使用“医治”的动词。“已经康复了”结合上下文传达恢复健康，却不明确断言原词本身表示医治行动。
translation_notes:
  register: 采用现代、自然而庄重的叙事语言。“奉差遣”保留被动意味；“那家里”承接上下文的百夫长之家。脚注标记置于整句末，所注释的争议词为“奴仆”。
