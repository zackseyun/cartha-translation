source:
  edition: SBLGNT
  text: ὡς δὲ ἤγγισεν τῇ πύλῃ τῆς πόλεως, καὶ ἰδοὺ ἐξεκομίζετο τεθνηκὼς ⸂μονογενὴς υἱὸς⸃ τῇ μητρὶ αὐτοῦ, καὶ αὐτὴ ⸀ἦν χήρα, καὶ ὄχλος τῆς πόλεως ἱκανὸς ⸁ἦν σὺν αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/012.yaml
  text: As he came near to the gate of the city[a], behold, a dead man was being carried out, the only son of his mother, and she was a widow, and a considerable crowd from the city was with her.
translation:
  language: zh_hans
  text: 他走近城门时，看哪，有一个死人正被抬出来；他是母亲的独生子[a]，而母亲是寡妇；有相当多的城里人陪着她。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“她唯一的儿子”。
    reason: 说明μονογενής在此母子关系语境中的等值表达。
lexical_decisions:
- source_word: ὡς δὲ ἤγγισεν
  choice: 他走近……时
  rationale: 以自然的汉语时间结构表达ὡς的时间关系，并用“走近”准确传达ἤγγισεν所表示的接近动作；δέ的轻微承接作用融入叙事语流。
- source_word: τῇ πύλῃ τῆς πόλεως
  choice: 城门
  rationale: “城门”是现代汉语中简洁自然的表达，完整传达“城的门”之意。
- source_word: καὶ ἰδοὺ
  choice: 看哪
  rationale: 保留ἰδού引人注意、使读者转向眼前突发场景的叙事功能，同时维持庄重语体。
- source_word: ἐξεκομίζετο
  choice: 正被抬出来
  rationale: “正……被……”体现未完成时的进行状态和被动语态；“抬出来”也符合送葬场景。
- source_word: τεθνηκώς
  choice: 一个死了的人
  rationale: 表达完成分词所指的死亡状态；比“死人”稍显庄重，又不额外加入原文没有的身份信息。
- source_word: μονογενὴς υἱός
  choice: 独生子
  rationale: 在母子关系的语境中，μονογενής表示母亲唯一的儿子；“独生子”简洁、自然且准确。
- source_word: καὶ αὐτὴ ἦν χήρα
  choice: 母亲又是寡妇
  rationale: 明确αὐτή所回指的母亲，避免汉语代词可能产生的歧义；“又”承接并叠加她的双重悲痛处境。
- source_word: ὄχλος τῆς πόλεως ἱκανός
  choice: 城里有相当多的人
  rationale: ἱκανός在此表示人数颇多；“相当多的人”比生硬的“相当大的群众”更符合现代汉语。
- source_word: ἦν σὺν αὐτῇ
  choice: 陪着她
  rationale: 准确传达同行、陪伴之意，并自然贴合送葬队伍的语境。
theological_decisions:
- issue: 非基督论语境中μονογενής的译法
  choice: 独生子
  alternative: 唯一的儿子
  rationale: 这里的μονογενής描述寡妇与儿子的家庭关系，重点是他是她唯一的儿子。译文不引入该词在其他经文中可能具有的专门神学含义，也不削弱这场丧亲之痛。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“看哪”保留原文醒目的话语标记；其余句式按现代汉语调整，既呈现送葬场面，也避免过度解释。
