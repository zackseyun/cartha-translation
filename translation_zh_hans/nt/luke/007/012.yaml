  naturalness: “有一个死了的人”在现代汉语中略显生硬；“一个死人”在送葬叙事中更自然、清楚。“城里有相当多的人陪着她”也可理解，但改为“有相当多的城里人陪着她”更凝练自然，并避免句法上将“城里”仅理解为事件地点。
  terminology: “独生子”准确表达此处非基督论语境中的μονογενὴς υἱός；“寡妇”准确。“看哪”恰当地保留ἰδού的提醒和突显作用，虽较庄重，仍符合经文叙事语体。脚注的替代译法宜明确母子所属关系。
