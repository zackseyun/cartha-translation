  - severity: low
    issue: “城里有相当多的人陪着她”未直接表达“城中的一群人”。
    rationale: ὄχλος τῆς πόλεως是受数量形容的“城里人/城中的群众”，而非单纯表示“在城里有许多人”。改作“相当多的城里人”更贴近原文关系。
