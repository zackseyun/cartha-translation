  to: 他走近城门时，看哪，有一个死人正被抬出来；他是母亲的独生子[a]，而母亲是寡妇；有相当多的城里人陪着她。
  rationale: 修订仅改善现代汉语的自然性，并更明确保留“城中的一群人”这一原文修饰关系；保留原文的叙事突显、送葬进行状态、母亲为寡妇及独子关系，未增加解释性或教义性内容。
