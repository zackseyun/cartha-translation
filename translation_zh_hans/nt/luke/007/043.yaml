  text: ⸀ἀποκριθεὶς Σίμων εἶπεν· Ὑπολαμβάνω ὅτι ᾧ τὸ πλεῖον ἐχαρίσατο. ὁ δὲ εἶπεν αὐτῷ· Ὀρθῶς ἔκρινας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/043.yaml
  text: Simon answered[a], “I suppose the one to whom he forgave more.” And he said to him[b], “You have judged rightly.”
translation:
  language: zh_hans
  text: 西门回答说：“我想[a]，是那被他宽免了较多债务[b]的人。”他对西门说：“你判断得对。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我认为”或“依我看”；希腊语在这里表达试探性的推断。
    reason: lexical_alternative
  - marker: b
    text: 或译“蒙他饶恕更多的那个人”；这里的动词可指施恩宽免债务。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν
  choice: 回答说
  rationale: 希腊语以分词加限定动词引出回应；“回答说”既保留回应动作，也符合现代汉语叙事习惯。
- source_word: Ὑπολαμβάνω
  choice: 我想
  rationale: 此词在这里表示带有保留的推断，并非十分确定的断言；“我想”自然地传达西门试探性的语气。
- source_word: ᾧ τὸ πλεῖον
  choice: 被他……较多……的那个人
  rationale: 用被动式自然表达关系代词的间接宾语关系，并以“较多”保留比较含义；比较对象由上文两个欠债的人提供。
- source_word: ἐχαρίσατο
  choice: 宽免……债务
  rationale: 该动词可表示出于恩惠而赦免或免除；在紧接的欠债比喻中，“宽免债务”清楚保留债务获免的图像，也含有恩惠性的意味。
- source_word: Ὀρθῶς
  choice: 对
  rationale: 与“判断”搭配自然，准确表达“正确地”的肯定含义。
- source_word: ἔκρινας
  choice: 你判断得
  rationale: 保留 κρίνω 的判断、评断含义，并以现代汉语结果补语表达耶稣对西门刚才判断的认可。
theological_decisions:
- issue: 比喻中 ἐχαρίσατο 所表达的宽免性质
  choice: 译作“宽免……债务”
  alternative: 译作“饶恕”或“白白免去”
  rationale: 上下文直接谈论债主与欠债者，因此正文保留债务获免的比喻图像；“宽免”同时承载恩惠与赦免色彩，使其与本段关于罪得赦免的主题保持联系，却不把比喻本身直接改写为教义解释。
- issue: 末句说话者的指称
  choice: 译作“他对西门说”
  alternative: 明确译作“耶稣对他说”
  rationale: 希腊文本只用代词“他”，正文保留这种表达，同时以“对西门”清楚标明受话者，避免不必要地把专名补入正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“宽免债务”比口语化的“免债”更适合经文语体；“判断得对”简洁自然，并保留原文的评断含义。所有脚注标记均置于正文相应词句之后。
