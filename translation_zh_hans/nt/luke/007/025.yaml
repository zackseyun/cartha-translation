  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἀλλὰ τί ⸀ἐξήλθατε ἰδεῖν; ἄνθρωπον ἐν μαλακοῖς ἱματίοις ἠμφιεσμένον; ἰδοὺ οἱ ἐν ἱματισμῷ ἐνδόξῳ καὶ τρυφῇ ὑπάρχοντες ἐν τοῖς βασιλείοις εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/025.yaml
  text: But what did you go out to see? A man dressed in soft clothing? Look[b][a], those who are in splendid clothing and luxury are in royal palaces.
translation:
  language: zh_hans
  text: 可是，你们出去是要看什么？看一个穿着质地柔软的衣服的人吗？看哪，那些穿华美衣服、生活奢华的人，都在王宫里。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “王宫”也可译作“君王的宫廷”；希腊语指王室住所或宫廷场所。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: 可是
  rationale: 承接上一节的反问并转入另一种可能，现代汉语用“可是”自然地保留转折语气。
- source_word: τί ἐξήλθατε ἰδεῖν
  choice: 你们出去是要看什么
  rationale: 将不定式目的关系译为“是要看”，既保留过去出城观看的行动背景，也符合汉语反问表达。
- source_word: ἄνθρωπον
  choice: 一个……的人
  rationale: 此处指具体男性形象，但汉语以“一个……的人”最自然，且没有将其泛化为抽象的人类。
- source_word: ἐν μαλακοῖς ἱματίοις ἠμφιεσμένον
  choice: 穿细软衣服
  rationale: “细软”表达衣料柔软、精细和奢贵的语境含义，避免让“软”被误解为人格或道德评价。
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留引人注意的指示语气；“看哪”庄重而仍为现代读者熟悉。
- source_word: ἐν ἱματισμῷ ἐνδόξῳ
  choice: 穿华美衣服
  rationale: “华美”自然传达ἐνδόξῳ在服饰语境中的华贵、显赫之意。
- source_word: τρυφῇ ὑπάρχοντες
  choice: 生活奢华
  rationale: τρυφή指奢华、享乐的生活状态；补出“生活”可使汉语顺畅，并与服饰形成并列。
- source_word: ἐν τοῖς βασιλείοις
  choice: 在王宫里
  rationale: βασίλεια为王室住所或宫廷场所；汉语“王宫”准确清楚，集合性表达不必机械体现希腊语复数。
theological_decisions:
- issue: μαλακοῖς在本节中的含义
  choice: 指细软、精致而与奢华相关的衣服
  alternative: 软弱或女性化的衣着
  rationale: 下文立即提到华美服饰、奢华生活和王宫，显示对比的是旷野中的简朴与宫廷中的富贵，并非对人格或性别气质作道德判断。
- issue: βασιλείοις所指的社会场所
  choice: 王宫
  alternative: 君王的宫廷
  rationale: 该词可指王室住所或宫廷环境；正文采用简明的“王宫”，脚注提示“君王的宫廷”这一语境性译法。
translation_notes:
  register: 采用现代、庄重而口语可懂的反问句式。“细软衣服”保留原文具体意象，“华美衣服、生活奢华”清楚呈现宫廷富贵与旷野简朴的对比。脚注标记置于相关句末。
