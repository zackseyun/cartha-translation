  text: ἔπεμψεν πρὸς τὸν ⸀κύριον λέγων· Σὺ εἶ ὁ ἐρχόμενος ἢ ⸀ἄλλον προσδοκῶμεν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/019.yaml
  text: He sent to the Lord, saying, “Are you the Coming One, or should we expect another?”
translation:
  language: zh_hans
  text: 他就差人到主那里去，说：“你就是那将要来的[a]吗？还是我们要等候另一位呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那正在来的一位。”希腊语这一表达也可按描述性意思理解；在这里，它很可能是对所期待之人的称谓。
    reason: 保留ὁ ἐρχόμενος作为实体化分词的描述性含义，以及在此语境中可能具有的称号意味。
lexical_decisions:
- source_word: ἔπεμψεν πρὸς τὸν κύριον λέγων
  choice: 他就派人去问主
  rationale: πέμπω表示差派；原文未明说受差者，但汉语若只说“派去”会不完整，结合πρός所指的目的地及λέγων引出的问话，以“派人去问主”自然表达差派人向主传话的动作。
- source_word: τὸν κύριον
  choice: 主
  rationale: κύριος在此指耶稣；“主”既符合路加叙事中的称谓，也保留其可能具有的基督论分量，避免弱化为“主人”。
- source_word: ὁ ἐρχόμενος
  choice: 那位要来者
  rationale: 带冠词的实体化现在分词既可作描述，也可在本语境中作为受期待者的称号。“那位要来者”保留这一形式与弥赛亚语境，同时不把身份解释得超出原文。
- source_word: ἄλλον
  choice: 另一位
  rationale: ἄλλον为阳性单数，指另一个人；“另一位”比“别人”更直接地保留二者择一的问法，并保持尊重语气。
- source_word: προσδοκῶμεν
  choice: 我们该等候
  rationale: 该动词表示期待、等候；在选择问句中，“该等候”自然传达商议意味及持续期待的状态。
theological_decisions:
- issue: κύριος作为耶稣称谓的译法
  choice: 主
  alternative: 主人
  rationale: “主”保留路加对耶稣所用称谓的尊崇与神学分量；“主人”在此会不必要地限定为社会关系称呼。
- issue: ὁ ἐρχόμενος是称号还是一般描述
  choice: 那位要来者
  alternative: 那位正在来的人
  rationale: 本语境中此语很可能指受期待的末世性人物，但希腊语本身仍是实体化分词。正文采用可承载称号意味而不过度明说“弥赛亚”的表达，并以脚注保留描述性理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“派人去问主”避免逐词硬译造成的生涩；“那位要来者”略带庄重色彩，以承载原文可能的称号意味。
