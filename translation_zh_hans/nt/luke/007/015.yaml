  text: καὶ ἀνεκάθισεν ὁ νεκρὸς καὶ ἤρξατο λαλεῖν, καὶ ἔδωκεν αὐτὸν τῇ μητρὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/015.yaml
  text: And the dead man sat up and began to speak[a], and he gave him to his mother.
translation:
  language: zh_hans
  text: 那死人坐了起来，开始说话；耶稣就把他交给了他的母亲。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“耶稣就把他还给了他的母亲”或“交还给了他的母亲”。希腊文只说“把他交给了他的母亲”，恢复母子关系的意思是由上下文显明的。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεκάθισεν
  choice: 坐了起来
  rationale: 该动词表示从躺卧姿势起身坐直。“坐了起来”是自然、准确的现代汉语，没有把动作扩大为站起或完全复起。
- source_word: ὁ νεκρός
  choice: 那死人
  rationale: 原文是“那死者／死人”，指上文已经死去的年轻人。“那死人”简洁自然，也保留叙事在这一刻仍以其先前死亡状态称呼他的表达张力。
- source_word: ἤρξατο λαλεῖν
  choice: 开始说话
  rationale: ἄρχομαι加不定式表示动作开始；“开始说话”准确、通顺，并符合庄重的叙事语体。
- source_word: ἔδωκεν αὐτὸν τῇ μητρὶ αὐτοῦ
  choice: 把他交给了他的母亲
  rationale: 原文动词δίδωμι本义是“给”。汉语若直译为“把他给了他的母亲”略显生硬，“交给”既自然，又不明确加入“归还”的成分；由上下文表达母子恢复团聚之意。
- source_word: αὐτοῦ（τῇ μητρὶ αὐτοῦ）
  choice: 他的母亲
  rationale: 忠实保留所属关系，并比“他母亲”略显庄重，适合经文叙事。
theological_decisions:
- issue: 是否明确说耶稣把儿子“还给”母亲
  choice: 正文采用“把他交给了他的母亲”
  alternative: “把他还给了他的母亲”或“把他交还给他的母亲”
  rationale: 上下文确实含有使母子重新团聚的恢复意味，但希腊文只用δίδωμι“给”，没有明说“还”或“交还”。正文保留较简单的措辞，并在脚注说明语境所隐含的恢复意义。
- issue: 是否在主语处明确补出“耶稣”
  choice: 译作“耶稣就把他交给了他的母亲”
  alternative: “他就把他交给了他的母亲”
  rationale: 希腊文动词主语承接上文，形式上未重复姓名；现代汉语连续出现多个男性代词会造成指代含混。补出上文已明确的主语“耶稣”仅为消除汉语歧义，不改变事件参与者或神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“坐了起来”“开始说话”保持动作次序；分号连接复活征兆与耶稣将儿子交给母亲的举动。脚注标记置于其所解释的分句之后。
