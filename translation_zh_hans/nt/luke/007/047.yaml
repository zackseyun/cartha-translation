  text: οὗ χάριν, λέγω σοι, ἀφέωνται αἱ ἁμαρτίαι αὐτῆς αἱ πολλαί, ὅτι ἠγάπησεν πολύ· ᾧ δὲ ὀλίγον ἀφίεται, ὀλίγον ἀγαπᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/047.yaml
  text: For this reason I tell you[a], her many sins have been forgiven, because she loved much. But the one who is forgiven little loves little.
translation:
  language: zh_hans
  text: 所以我告诉你，她的许多罪已经蒙赦免了，因为她爱得多。[a]但那蒙赦免少的人，爱得也少。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或理解为：“所以她爱得多。”这里的希腊文连接词也可结合上下文理解为：她的爱显明她已经蒙赦免，而不是她获得赦免的原因。
    reason: alternative_reading
lexical_decisions:
- source_word: οὗ χάριν
  choice: 所以
  rationale: 承接前面的比喻和判断，保留因果兼推论的连接作用；现代汉语中简洁自然。
- source_word: ἀφέωνται
  choice: 都已经蒙赦免了
  rationale: “已经……了”表达完成且结果延续至今；“蒙赦免”准确体现被动语态，也符合庄重而通俗的经文语体。
- source_word: ἁμαρτίαι αὐτῆς αἱ πολλαί
  choice: 她许多的罪
  rationale: 按现代汉语语序表达数量多，同时保留“她的罪”这一明确所指。
- source_word: ὅτι
  choice: 因为
  rationale: 直接保留希腊文通常的因果表达，不在正文中把其与上下文的关系改写成单一解释。
- source_word: ἠγάπησεν πολύ
  choice: 她爱得多
  rationale: 保留“爱”与程度副词的简洁搭配，并与后半句“爱也少”形成鲜明平行。
- source_word: ᾧ δὲ
  choice: 但那……的
  rationale: 以汉语泛指结构表达希腊文关系代词，不额外引入性别限定。
- source_word: ὀλίγον ἀφίεται
  choice: 蒙赦免少
  rationale: 保留现在时被动和数量程度，并与“爱也少”维持格言式对称。
- source_word: ὀλίγον ἀγαπᾷ
  choice: 爱也少
  rationale: 简洁保留原文平行结构；“也”自然呈现两者之间的对应关系。
theological_decisions:
- issue: ὅτι（“因为”）是否表示女人的爱是她获赦免的功德性原因
  choice: 正文译作“因为她爱得多”，保留原文表面的因果措辞，并用脚注说明可按上下文理解为她的爱显明了已经蒙赦免的状态。
  alternative: 意译为“所以她爱得多”，把爱明确表达为蒙赦免的结果。
  rationale: 比喻及本节后半句呈现赦免与爱之间的对应关系，第50节也强调信心与拯救；然而本句ὅτι本身自然可译为“因为”。正文与脚注并用，既不削平希腊文的张力，也避免强行确立某一教义化解释。
translation_notes:
  register: 采用现代标准普通话和简体中文。整体语气庄重、自然，使用“蒙赦免”体现被动含义；保留“多／少”的反复和平行，呈现原句简洁有力的格言式节奏。
