  text: Ἑκατοντάρχου δέ τινος δοῦλος κακῶς ἔχων ἤμελλεν τελευτᾶν, ὃς ἦν αὐτῷ ἔντιμος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/002.yaml
  text: A certain centurion’s slave[a], who was sick and about to die, was highly valued by him.
translation:
  language: zh_hans
  text: 某个百夫长的一个奴隶[a]病得很重，快要死了；百夫长十分看重他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“仆人”。希腊语δοῦλος可按语境指“奴隶”或“仆人”；这里指隶属于百夫长、受其支配的人。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἑκατοντάρχου ... τινος
  choice: 有一个百夫长，他的
  rationale: 用存在句自然引入新人物，并保留τινος的不定意味；原文属格所表达的从属关系在“他的奴仆”中体现。
- source_word: δέ
  choice: 不单独译出
  rationale: δέ在这里是轻微的叙事衔接；中文直接进入新场景更自然，无须加“这时”或“如今”等可能过度强化时序的词。
- source_word: δοῦλος
  choice: 奴仆
  rationale: “奴仆”保留一世纪社会中受主人支配、隶属于主人的身份，又比现代汉语单用“奴隶”更适合叙事语体；脚注列出“奴隶”以明确其身份内涵。
- source_word: κακῶς ἔχων
  choice: 病得很重
  rationale: 该习语意为身体状况很坏；结合紧接的“快要死了”，译作“病得很重”自然且符合语境。
- source_word: ἤμελλεν τελευτᾶν
  choice: 快要死了
  rationale: 准确表达μέλλω加不定式所表示的临近和即将发生。
- source_word: ὃς ἦν αὐτῷ ἔντιμος
  choice: 百夫长十分看重他
  rationale: ἔντιμος在此表示被珍视、受重视；明确重复主语“百夫长”，避免连续代词造成指代含混，同时不额外加入亲密感情色彩。
theological_decisions:
- issue: 家庭奴役语境中δοῦλος的译法
  choice: 奴仆
  alternative: 奴隶；仆人
  rationale: 不能以“仆人”淡化原词所含的隶属和受支配关系；“奴仆”兼顾历史身份与庄重、自然的中文表达，并以脚注说明也可译作“奴隶”。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“有一个百夫长”自然引入人物；分号将奴仆的危急病情与百夫长对他的重视连接起来。
