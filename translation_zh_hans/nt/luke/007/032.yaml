  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὅμοιοί εἰσιν παιδίοις τοῖς ἐν ἀγορᾷ καθημένοις καὶ προσφωνοῦσιν ἀλλήλοις, ⸂ἃ λέγει⸃· Ηὐλήσαμεν ὑμῖν καὶ οὐκ ὠρχήσασθε· ⸀ἐθρηνήσαμεν καὶ οὐκ ἐκλαύσατε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/032.yaml
  text: 'They are like children sitting in the marketplace and calling to one another[a], who say: ‘We played the flute for you, and you did not dance; we sang a lament[b], and you did not weep.’'
translation:
  language: zh_hans
  text: 他们好像一群孩子，坐在集市里，彼此呼喊说：“我们为你们吹笛，你们却不跳舞；我们唱哀歌[a]，你们却不哭泣。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “唱哀歌”也可译作“哀悼”或“唱挽歌”。原文可指表达哀伤，尤其包括丧礼中的哀歌。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅμοιοί εἰσιν
  choice: 他们好像
  rationale: 自然地引出比喻，同时保留原文简洁的比较结构。
- source_word: παιδίοις
  choice: 一群孩子
  rationale: 泛指孩子，不限定年龄或性别；补出量词使现代汉语顺畅。
- source_word: ἐν ἀγορᾷ
  choice: 在市集上
  rationale: ἀγορά指公开的市场或广场；“市集”既能呈现交易场所，也适合孩子聚集的公共空间。
- source_word: καθημένοις
  choice: 坐着
  rationale: 直接表达现在分词所描写的姿态。
- source_word: προσφωνοῦσιν ἀλλήλοις
  choice: 彼此呼喊
  rationale: 保留ἀλλήλοις的相互性，并以“呼喊”呈现隔空招呼的场景。
- source_word: ἃ λέγει
  choice: 说
  rationale: 原文读法在关系代词和单数动词的搭配上略显特殊；汉语用“说”自然承接群体发言，不强行解释其语法差异。
- source_word: Ηὐλήσαμεν
  choice: 我们为你们吹笛
  rationale: αὐλέω特指吹奏笛管类乐器；“吹笛”准确、简洁，也比泛译为“奏乐”更具体。
- source_word: ὠρχήσασθε
  choice: 你们却不跳舞
  rationale: 直接保留与吹笛相对应的具体动作；“却”清楚表达καί在语境中的反差。
- source_word: ἐθρηνήσαμεν
  choice: 我们唱哀歌
  rationale: θρηνέω可指哀悼，也可指唱挽歌；游戏场景中，“唱哀歌”与前句“吹笛”形成具体而平行的表演动作。
- source_word: ἐκλαύσατε
  choice: 你们却不哭泣
  rationale: κλαίω指哭、哀哭；“哭泣”庄重自然，并与“哀歌”相配。
theological_decisions:
- issue: 如何呈现两组相反的儿童活动而不提前解释比喻
  choice: 保留“吹笛—跳舞”和“唱哀歌—哭泣”的具体动作
  alternative: 解释性地译作“欢庆—哀悼”
  rationale: 本节经文本身提出比喻而未在句内解释其对应关系；具体意象能保留比喻的开放性及其神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“市集”比“市场”更能兼顾ἀγορά作为公共市场或广场的含义；引语保持儿童游戏口吻，但避免过度口语化。
