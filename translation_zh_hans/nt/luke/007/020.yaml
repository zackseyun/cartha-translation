base_translation:
  language: en
  yaml_path: translation/nt/luke/007/020.yaml
  text: When the men came to him[a], they said, “John the Baptist has sent us to you, saying, ‘Are you the one who is to come, or should we expect another?’”
translation:
  language: zh_hans
  text: 那两个人来到耶稣跟前，说：“施洗者约翰差我们来问你：‘你就是那位要来的吗？还是我们该等候另一位呢？’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραγενόμενοι δὲ πρὸς αὐτὸν οἱ ἄνδρες
  choice: 那两个人来到耶稣跟前
  rationale: 分词结构交代两位使者来到的情境；结合上文可知是两个人。将代词明确为“耶稣”，使独立经节自然清楚。
- source_word: Ἰωάννης ὁ βαπτιστής
  choice: 施洗者约翰
  rationale: “施洗者”直接表达其施行洗礼的身份，且是现代中文圣经语体中自然、易懂的称呼。
- source_word: ἀπέστειλεν ἡμᾶς πρὸς σὲ λέγων
  choice: 差我们来问你
  rationale: λέγων引出所托付的话，其内容是疑问；译为“来问你”符合现代汉语，同时保留差遣传话的关系。
- source_word: ὁ ἐρχόμενος
  choice: 那位要来的
  rationale: 保留希腊文分词短语的期待性和可能具有的称号意味，不直接增译为“弥赛亚”，以免消除原文的含蓄。
- source_word: ἄλλον προσδοκῶμεν
  choice: 我们该等候别人呢
  rationale: προσδοκάω兼有期待、等候之意；此处涉及所期待之人的到来，“等候”自然地保留时间和期待两方面。
theological_decisions:
- issue: ὁ ἐρχόμενος的弥赛亚性含义
  choice: 译作“那位要来的”
  alternative: 译作“那要来者”或直接译作“弥赛亚”
  rationale: “那位要来的”既能让读者感受到特定人物和末世期待，也不把原文未明说的身份解释直接写入正文。
- issue: 约翰提问所呈现的不确定性
  choice: 保留“还是我们该等候别人呢？”的开放问法
  alternative: 解释为约翰本人怀疑，或解释为仅替门徒发问
  rationale: 经文本身没有说明疑问究竟属于约翰、门徒，或两者；翻译不替经文解决这一神学和叙事张力。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事表达。“那两个人”承接上下文中的两位使者；“耶稣”明确代词所指，便于单节阅读。无脚注。
