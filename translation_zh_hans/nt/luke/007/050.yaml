base_translation:
  language: en
  yaml_path: translation/nt/luke/007/050.yaml
  text: And he said to the woman[a], “Your faith has saved you[b]; go in peace.”
translation:
  language: zh_hans
  text: 于是他对那女人说：“你的信心[a]救了你[b]；平安地去吧。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你的信靠”；此处译作“你的忠信”可能性较小。
    reason: lexical_alternative
  - marker: b
    text: 或译：“使你痊愈了。”这个希腊语动词可表示“拯救”“救援”或“使痊愈”，但此处上下文着重于赦罪和拯救。
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν δὲ
  choice: 他又……说
  rationale: εἶπεν是“说”的简单过去时；δὲ在此承接叙事，并非强烈转折，用“又”自然保留承接作用。
- source_word: πρὸς τὴν γυναῖκα
  choice: 对那女人
  rationale: γυνή在本段指场景中的那位女人，并非“妻子”；定冠词用“那”体现上下文已明确的对象。
- source_word: Ἡ πίστις σου
  choice: 你的信心
  rationale: πίστις在此主要指她对耶稣的信靠；“信心”是现代中文中自然且具有经文语体的表达，同时以脚注保留“信靠”及较不可能的“忠信”。
- source_word: σέσωκέν σε
  choice: 救了你
  rationale: σῴζω的完成时表达已经成就并持续有效的结果。本段重心在罪得赦免，因此“救了你”比单指身体康复更符合语境，同时脚注保留“使你痊愈”的词义可能。
- source_word: πορεύου εἰς εἰρήνην
  choice: 平平安安地走吧
  rationale: 这是带有祝福意味的离去用语；不机械译作“进入平安”，而以自然庄重的现代中文表达在平安中离去。
theological_decisions:
- issue: πίστις所指的是信心、信靠还是忠信
  choice: 正文译作“信心”
  alternative: “信靠”；较不可能为“忠信”
  rationale: 语境突出女人对耶稣的信靠回应；“信心”保留名词形式和传统神学分量，但不把较具体的“信靠”或较弱的“忠信”可能性完全排除。
- issue: σῴζω在赦罪语境中的含义
  choice: 译作“救了你”
  alternative: “使你痊愈了”
  rationale: 路加福音7:36–50的直接语境强调赦罪，而未叙述这女人身体得医治；因此采用涵盖拯救意义的译法，同时承认该动词在其他语境可指医治或痊愈。
- issue: 信心与得救之间的表述
  choice: 保留“你的信心救了你”的直接措辞
  alternative: 解释为“因你的信心，你得救了”
  rationale: 原文以ἡ πίστις σου为主语，不进一步解释信心如何与拯救相关；直译可保留原文的神学张力，避免加入因果机制。
translation_notes:
  register: 采用现代、自然而庄重的普通话。保留简洁的直接引语和原文的神学张力；“平平安安地走吧”既通俗易懂，也传达带着平安离去的祝福意味。
