id: LUK.7.45
reference: Luke 7:45
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: φίλημά μοι οὐκ ἔδωκας· αὕτη δὲ ἀφ’ ἧς εἰσῆλθον οὐ διέλιπεν καταφιλοῦσά μου τοὺς πόδας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/045.yaml
  text: You gave me no kiss[a], but from the time I came in[b], she has not stopped kissing my feet.
translation:
  language: zh_hans
  text: 你没有亲我[a]；但这女人从我进来以后，就不停地亲我的脚[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“没有以亲吻向我问安”；亲吻是当时常见的问候和待客礼节。
    reason: cultural_note
  - marker: b
    text: “亲”所译的动词可含热切或反复亲吻的意思，也可译作“不断地亲吻我的脚”。
    reason: lexical_alternative
lexical_decisions:
- source_word: φίλημά
  choice: 亲
  rationale: 名词 φίλημα 与“给”连用，指以亲吻表达问候或接待。现代汉语用“亲我”比直译为“给我一个吻”更自然，同时不把文化解释写入正文。
- source_word: μοι
  choice: 我
  rationale: 与“亲”组成自然的现代汉语动宾结构，表达希腊语间接宾语所指的接受者。
- source_word: ἔδωκας
  choice: 亲
  rationale: 希腊语字面为“给”，但“给我一个吻”在此较显翻译腔；汉语以动词“亲”自然表达“给予亲吻”的动作。
- source_word: αὕτη δὲ
  choice: 但这女人
  rationale: αὕτη 在场景中明确指向那女人，并与西门形成鲜明对比；译作“这女人”保留指示意味。
- source_word: ἀφ’ ἧς
  choice: 从……以后
  rationale: 该结构具有时间起点意义，表示动作从耶稣进入之时开始并持续至说话时。
- source_word: εἰσῆλθον
  choice: 我进来
  rationale: 准确表达“进入”，也符合宴席接待场景中的自然汉语。
- source_word: οὐ διέλιπεν
  choice: 就不停地
  rationale: 表达“没有停止、没有间断”，并结合上下文呈现从进入以来持续发生的动作。
- source_word: καταφιλοῦσά
  choice: 亲
  rationale: καταφιλέω 可带热切、反复亲吻的意味；正文用持续结构“不停地亲”传达反复性，脚注补充其较强语气。
- source_word: μου τοὺς πόδας
  choice: 我的脚
  rationale: 保留复数所指；现代汉语通常以集合名词“脚”自然涵盖双脚，无须机械标为复数。
theological_decisions:
- issue: 亲吻所隐含的待客礼俗
  choice: 正文只译出亲吻这一动作，以脚注说明其问候和待客背景。
  alternative: 你没有以亲吻向我问安
  rationale: 希腊文直接陈述动作，并未显式加入“问安”或“待客礼节”；将文化信息放入脚注，既帮助理解对比，又避免在正文中增加解释。
- issue: καταφιλέω 的热切或反复意味
  choice: 以“不停地亲”表达持续和反复，并在脚注说明较强语气。
  alternative: 不停地吻遍我的脚／不断热切地亲我的脚
  rationale: 该动词可能强调热切或反复亲吻，但强度不宜被单一释义完全锁定；正文与脚注共同保留其语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你没有亲我”简洁自然；“但这女人”保留原文的现场指示和对比；“从我进来以后，就不停地”清楚呈现动作自某一时点开始并持续。
