id: LUK.7.16
reference: Luke 7:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἔλαβεν δὲ φόβος πάντας, καὶ ἐδόξαζον τὸν θεὸν λέγοντες ὅτι Προφήτης μέγας ⸀ἠγέρθη ἐν ἡμῖν, καὶ ὅτι Ἐπεσκέψατο ὁ θεὸς τὸν λαὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/016.yaml
  text: And fear seized them all[a], and they were glorifying God, saying, “A great prophet has arisen among us[c][b], and God has visited his people.”
translation:
  language: zh_hans
  text: 惧怕攫住了众人[a]，他们不断地归荣耀给上帝，说：“我们中间兴起了一位大先知[b]，上帝眷顾了他的子民[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “惧怕”在这里也可包含面对上帝大能时的敬畏。
    reason: lexical_alternative
  - marker: b
    text: “兴起了”也可译作“被兴起”，突出是上帝兴起这位先知。
    reason: lexical_alternative
  - marker: c
    text: “眷顾”是圣经惯用语，指上帝带着关切临到他的子民并采取行动。
    reason: cultural_note
lexical_decisions:
- source_word: ἔλαβεν ... φόβος πάντας
  choice: 众人都被惧怕攫住
  rationale: 保留φόβος的“惧怕”而不先解释为“敬畏”，并以“攫住”传达突然临到、支配众人的强烈语气。
- source_word: δὲ
  choice: （承接上下文，不单独译出）
  rationale: δέ在此是轻微的叙事连接；汉语直接承接前文更自然，无须机械译为“于是”或“而”。
- source_word: ἐδόξαζον τὸν θεὸν
  choice: 不断归荣耀给上帝
  rationale: “归荣耀给”保留δοξάζω的核心词义；“不断”体现未完成时所呈现的持续或反复动作。
- source_word: λέγοντες
  choice: 说
  rationale: 自然引出众人归荣耀给上帝时所说的内容。
- source_word: Προφήτης μέγας
  choice: 一位大先知
  rationale: 直接而自然地表达μέγας对先知的评价。
- source_word: ἠγέρθη
  choice: 兴起了
  rationale: 既符合汉语表达，也保留先知在群体中出现以及可能由上帝兴起的含义，不把隐含施事者写死。
- source_word: ἐν ἡμῖν
  choice: 我们中间
  rationale: 准确表达群体内部、在众人当中的意思。
- source_word: Ἐπεσκέψατο
  choice: 眷顾了
  rationale: 在现代汉语中，“眷顾”可表达上帝带着关注和恩慈临到其子民，避免“访问”造成普通社交拜访的误解，同时保留其圣经语境中的介入意味。
- source_word: ὁ θεὸς
  choice: 上帝
  rationale: 采用现代标准汉语中对θεός的庄重通行译法。
- source_word: τὸν λαὸν αὐτοῦ
  choice: 他的子民
  rationale: 自然表达归属于上帝的群体，并保留盟约性的语感。
theological_decisions:
- issue: 神迹之后φόβος的含义
  choice: 惧怕
  alternative: 敬畏
  rationale: “惧怕”更直接对应原词，并保留恐惧与敬畏并存的张力；正文不预先替读者化解这种张力。
- issue: ἠγέρθη用于先知时的语态与施事者
  choice: 兴起了
  alternative: 被兴起来了
  rationale: 希腊语形式可能暗示上帝兴起先知，也可自然理解为先知出现；正文采用兼容两者的表达，脚注列明较形式对应的译法。
- issue: Ἐπεσκέψατο所表达的上帝行动
  choice: 眷顾了他的子民
  alternative: 临到他的子民／来帮助他的子民
  rationale: “眷顾”保留上帝关注并介入的丰富含义，不把行动缩减为单一的“帮助”或普通的“探访”。
- issue: 两个ὅτι分句之间的关系
  choice: 置于同一段引语中，以“并且”的语义连接
  alternative: 分作两句并列的引语
  rationale: 两个ὅτι分句都是λέγοντες引出的内容；合为一段连续宣告符合原文结构，也更合乎现代汉语习惯。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“攫住”保留原文反应的强烈程度；“归荣耀给上帝”保持圣经性的表达，同时用“不断”呈现未完成时体。“眷顾”比直译“访问”更符合现代汉语，却没有把上帝的行动过度解释为某一种具体救助。
