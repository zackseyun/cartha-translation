  text: Ἠρώτα δέ τις αὐτὸν τῶν Φαρισαίων ἵνα φάγῃ μετ’ αὐτοῦ· καὶ εἰσελθὼν εἰς ⸂τὸν οἶκον⸃ τοῦ Φαρισαίου ⸀κατεκλίθη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/036.yaml
  text: One of the Pharisees was asking him to eat with him[a], and after entering the Pharisee’s house[b], he reclined at the table.
translation:
  language: zh_hans
  text: 有一个法利赛人请耶稣和他一起吃饭。耶稣进了那法利赛人的家，就斜倚着用餐[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 当时正式用餐时，人通常侧身斜倚，而不是像现代人那样端坐在桌旁。
    reason: cultural_note
lexical_decisions:
- source_word: Ἠρώτα
  choice: 请
  rationale: 未完成时可表示持续或反复进行的请求；现代汉语在此用“请”自然地表达邀请之意。若译成“不断请求”，会把希腊语体貌表达得过重。
- source_word: δέ
  choice: 不单独译出
  rationale: 这是推进叙事的轻微连接词；汉语在此无需添加“现在”或强转折词，也能保持自然衔接。
- source_word: τις τῶν Φαρισαίων
  choice: 有一个法利赛人
  rationale: 准确表达部分属格，即法利赛人群体中的一人，也符合现代汉语叙事习惯。
- source_word: ἵνα φάγῃ μετ’ αὐτοῦ
  choice: 和他一起吃饭
  rationale: ἵνα加虚拟式在Ἠρώτα之后表达请求的内容或目的；“一起吃饭”直接、自然，并保留共同用餐的含义。
- source_word: εἰσελθὼν εἰς τὸν οἶκον τοῦ Φαρισαίου
  choice: 进了这个法利赛人的家
  rationale: 不定过去时分词表示该动作先于主句动作；“进了……家”清楚保留动作顺序。再次提到此人时用“这个”符合汉语指称习惯。
- source_word: κατεκλίθη
  choice: 斜倚席间
  rationale: 该词在正式用餐语境中指按当时习俗斜倚进餐，而不是现代意义上的坐下；“斜倚席间”既简洁又保留历史场景。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“耶稣”补出希腊语代词所指，避免连续两个“他”造成歧义；“斜倚席间”保留古代用餐姿势，并以脚注说明文化背景。
