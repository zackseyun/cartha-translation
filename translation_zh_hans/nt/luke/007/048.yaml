  text: Then he said to her[a], “Your sins are forgiven.”
translation:
  language: zh_hans
  text: 于是，他对她说：“你的罪已经蒙赦免了。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“你的罪已经被赦免了”。希腊语完成时被动语态表明赦免已经成就，也强调其结果持续有效。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: 说
  rationale: λέγω的不定过去时在此引出直接引语，现代汉语自然译为“说”。
- source_word: δὲ
  choice: 于是
  rationale: δέ在此是轻微的叙事连接词，推进情节而非表示强烈转折；“于是”自然承接上文。
- source_word: αὐτῇ
  choice: 对她
  rationale: 与“说”搭配，用“对她”自然表达与格所标示的言语对象。
- source_word: Ἀφέωνταί
  choice: 已经赦免了
  rationale: 这是ἀφίημι的完成时被动语态，表示赦免这一行动已经完成，其结果仍然有效；“已经赦免了”较清楚地保留完成时的力度。
- source_word: σου
  choice: 你的
  rationale: 第二人称单数属格在此修饰“罪”，汉语自然用领属形式“你的”。
- source_word: αἱ ἁμαρτίαι
  choice: 罪
  rationale: ἁμαρτίαι为复数，指人在上帝面前的过犯；现代汉语通常以集合性名词“罪”表达，无须机械标明复数。
theological_decisions:
- issue: 完成时被动语态Ἀφέωνταί在赦罪宣告中的力度
  choice: 译作“已经赦免了”，表达已经完成且结果持续的赦免。
  alternative: 译作“得赦免了”或“被赦免了”，侧重当前蒙赦免的状态。
  rationale: 希腊语完成时兼含已完成行动和持续结果。正文保留“已经……了”以呈现其完成时意义，脚注说明也可侧重现今有效的状态，不进一步断定赦免发生的具体时点或行动者。
translation_notes:
  register: 采用现代、庄重而通顺的叙事与直接引语。“于是”轻度推进叙事；“你的罪已经赦免了”适合普通读者，同时保留希腊语完成时被动语态的完成与持续结果。
