  text: ἐλήλυθεν ὁ υἱὸς τοῦ ἀνθρώπου ἐσθίων καὶ πίνων, καὶ λέγετε· Ἰδοὺ ἄνθρωπος φάγος καὶ οἰνοπότης, φίλος τελωνῶν καὶ ἁμαρτωλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/034.yaml
  text: The Son of Man has come eating and drinking[a], and you say, ‘Look, a glutton and a drunkard, a friend of tax collectors and sinners!’
translation:
  language: zh_hans
  text: 人子来了，也吃也喝；你们说：‘看哪，这个人贪吃又嗜酒，是税吏和罪人的朋友！’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλήλυθεν
  choice: 来了
  rationale: 希腊语完成时在此表示已经来到并以相应方式出现；现代汉语用“来了”自然表达已然及当前相关性。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人子
  rationale: 保留耶稣这一惯用自称及其可能具有的《但以理书》背景，不改写为一般性的“人”。
- source_word: ἐσθίων καὶ πίνων
  choice: 也吃也喝
  rationale: 两个现在分词说明人子来时的生活方式，并与上下文施洗约翰的禁食形成鲜明对照；“也吃也喝”自然简洁。
- source_word: λέγετε
  choice: 你们却说
  rationale: “说”对应现在时直接陈述；加入“却”明确上下文中的反差，未改变命题内容。
- source_word: Ἰδοὺ
  choice: 看哪
  rationale: 保留指示兼感叹语气；“看哪”庄重、清楚，也适合引出带敌意的指控。
- source_word: ἄνθρωπος
  choice: 这个人
  rationale: 原文明确有ἄνθρωπος。汉语用“这个人”既保留该词，又自然引出后面的贬义判断。
- source_word: φάγος
  choice: 贪食
  rationale: 表达过度吃喝的贬义指控；与“好酒”构成紧凑平行。
- source_word: οἰνοπότης
  choice: 好酒
  rationale: 该词在此是带贬义的“嗜酒者”。“好酒”在汉语中可自然表示嗜酒，且与“贪食”搭配顺畅；不把指控强化为原文未必明确的“醉汉”。
- source_word: φίλος
  choice: 朋友
  rationale: 直接保留关系性名词，并使敌对者对耶稣与边缘群体交往的指控保持原有张力。
- source_word: τελωνῶν
  choice: 税吏
  rationale: 这是新约时代替统治当局征收税款者的标准中文称谓，兼具历史语境和可辨识度。
- source_word: ἁμαρτωλῶν
  choice: 罪人
  rationale: 直接保留当时带有社会和宗教评判色彩的称呼，不改写为较弱的“有罪的人”。
theological_decisions:
- issue: 耶稣自称ὁ υἱὸς τοῦ ἀνθρώπου的译法
  choice: 人子
  alternative: 那位人／人之子
  rationale: “人子”既是成熟的中文圣经称谓，也保留其可能的末世性和基督论含义，不提前消解其多层意蕴。
- issue: 对耶稣吃喝行为的敌意指控有多强
  choice: 贪食好酒
  alternative: 贪吃、醉酒／贪食、喝酒的人
  rationale: 原文是对手的诬蔑性标签，应保留尖锐贬义；但οἰνοπότης字面重在嗜饮葡萄酒，译作“醉汉”可能额外断言经常醉酒，因此采用“好酒”。
- issue: “税吏和罪人的朋友”的叙事立场
  choice: 按原文直接保留为引语中的指控
  alternative: 解释为耶稣接纳税吏和罪人
  rationale: 本节没有直接说明该称呼中哪些部分是讥讽、哪些部分具有反讽性的真实意义；直译可保存这种神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”略带经文体色彩，用于对应Ἰδοὺ的感叹和指示功能；其余表达避免古奥。原文所有主要词项均在正文体现，因此不设脚注。
