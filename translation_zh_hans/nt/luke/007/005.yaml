  text: ἀγαπᾷ γὰρ τὸ ἔθνος ἡμῶν καὶ τὴν συναγωγὴν αὐτὸς ᾠκοδόμησεν ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/005.yaml
  text: For he loves our nation[a], and he himself built the synagogue for us.
translation:
  language: zh_hans
  text: 因为他爱我们的民族，又亲自为我们建了这座会堂。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“出资为我们建了这座会堂。”希腊文只说“建了”，既可能指亲自参与建造，也可能指资助兴建。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπᾷ
  choice: 爱
  rationale: 直接表达强烈而正面的关爱，保留ἀγαπάω在此处作为长老称许百夫长的力度，不弱化为一般的好感。
- source_word: γὰρ
  choice: 因为
  rationale: 承接上一节，说明犹太人的长老为何认为百夫长配得帮助；现代汉语用“因为”自然地表达这一因由关系。
- source_word: τὸ ἔθνος ἡμῶν
  choice: 我们的民族
  rationale: 说话者指自己的犹太民族共同体。“民族”较准确地保留ἔθνος在此处的族群含义，也避免把范围缩小为当地居民。
- source_word: τὴν συναγωγήν
  choice: 这座会堂
  rationale: συναγωγή在此指当地具体的犹太会堂。希腊文虽用定冠词而无指示词，但汉语以“这座”自然表达语境中双方都知道的特定建筑；不译成“我们的会堂”，以免增添原文没有的所有格。
- source_word: αὐτός
  choice: 亲自
  rationale: 保留独立代词所带的强调，突出这位百夫长本人承担了建造或出资兴建之事。
- source_word: ᾠκοδόμησεν
  choice: 建了
  rationale: 按希腊文直译建造行为，不在正文中断定他是亲手参与施工，还是作为资助者使会堂得以建成。
- source_word: ἡμῖν
  choice: 为我们
  rationale: 将与格理解为受益者，表示会堂是为犹太群体的益处而建；这是自然且贴合语境的现代汉语。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“又亲自”保留原文καί与强调代词αὐτός的推进和重音；正文维持“建了”的概括性，并用脚注保存亲自参与与出资兴建之间的真实歧义。
