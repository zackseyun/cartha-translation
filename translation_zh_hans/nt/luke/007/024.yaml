  text: Ἀπελθόντων δὲ τῶν ἀγγέλων Ἰωάννου ἤρξατο λέγειν ⸂πρὸς τοὺς ὄχλους⸃ περὶ Ἰωάννου· Τί ⸀ἐξήλθατε εἰς τὴν ἔρημον θεάσασθαι; κάλαμον ὑπὸ ἀνέμου σαλευόμενον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/024.yaml
  text: 'After John''s messengers had gone away[a], he began to speak to the crowds about John: “What did you go out into the wilderness to look at? A reed shaken by the wind?”'
translation:
  language: zh_hans
  text: 约翰的使者离开以后，耶稣开始向众人谈论约翰：“你们到旷野去是要看什么呢？是一根被风吹动的芦苇吗？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀπελθόντων
  choice: 离开以后
  rationale: 该不定过去时分词属格独立结构表示先于主句动作发生的时间背景；“离开以后”自然清楚地交代先后次序。
- source_word: ἀγγέλων
  choice: 使者
  rationale: 语境所指是约翰派来的人，不是天使；“使者”准确保留其受差遣者的身份。
- source_word: Ἰωάννου
  choice: 约翰的／约翰
  rationale: 首次为所属关系“约翰的使者”，后一次 περί Ἰωάννου 译作“谈论约翰”。
- source_word: ἤρξατο λέγειν
  choice: 开始……说
  rationale: 保留起始体意义；结合引语结构，汉语以“开始……说”自然顺畅。
- source_word: πρὸς τοὺς ὄχλους
  choice: 对众人
  rationale: πρός 与说话动词连用表示话语所面向的对象；复数 ὄχλους 在汉语中自然译作“众人”。
- source_word: περὶ Ἰωάννου
  choice: 谈论约翰
  rationale: περί 加属格表示话题，即“关于约翰”；“谈论约翰”符合现代汉语表达。
- source_word: Τί ἐξήλθατε
  choice: 你们从前……去，是要看什么
  rationale: τί 询问他们出去观看的对象，而非单纯询问原因；加入“从前”使过去时和回顾性的问话在汉语中更清楚。
- source_word: εἰς τὴν ἔρημον
  choice: 到旷野去
  rationale: ἔρημος 指人烟稀少之地；福音书语境中“旷野”准确且用语庄重。
- source_word: θεάσασθαι
  choice: 看
  rationale: 该词可指观看、注视；此处“看”简洁自然，并与后续宾语直接衔接。
- source_word: κάλαμον
  choice: 一根……芦苇
  rationale: κάλαμος 指芦苇类植物；量词“一根”符合现代汉语习惯，并保留原文形象。
- source_word: ὑπὸ ἀνέμου σαλευόμενον
  choice: 被风吹得摇来摇去的
  rationale: 保留被动关系及 σαλεύω 所表达的摇动、不稳定形象；“摇来摇去”比单说“摇动”更生动自然。
theological_decisions:
- issue: 关于约翰的反问中芦苇意象的隐喻力量
  choice: 保留“被风吹得摇来摇去的芦苇”这一具体意象，不在正文中解释。
  alternative: 意译为“软弱或摇摆不定的人”。
  rationale: 原文让听众由反问自行领会其含义，并未直接把约翰描述为坚定或不动摇；保留意象可避免替文本消解隐喻张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“众人”比“群众”更适合经文叙事语体；明确补出主语“耶稣”，避免汉语中主语指向含混。原文中的观看动词无需脚注，因为“看”足以涵盖本节语境中的基本意义。
