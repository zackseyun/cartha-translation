  text: καὶ στᾶσα ⸂ὀπίσω παρὰ τοὺς πόδας αὐτοῦ⸃ κλαίουσα, ⸂τοῖς δάκρυσιν ἤρξατο βρέχειν τοὺς πόδας αὐτοῦ⸃ καὶ ταῖς θριξὶν τῆς κεφαλῆς αὐτῆς ἐξέμασσεν, καὶ κατεφίλει τοὺς πόδας αὐτοῦ καὶ ἤλειφεν τῷ μύρῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/038.yaml
  text: and standing behind him at his feet[a], weeping, she began to wet his feet with her tears, and was wiping them with the hair of her head[b], and was kissing his feet and anointing them with the perfume.
translation:
  language: zh_hans
  text: 她站在耶稣身后，靠近他的脚边，哭泣着，开始用泪水弄湿他的脚，又用自己的头发擦拭他的脚；她一再亲吻他的脚，并用香膏[b]抹他的脚[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不停地亲他的脚。”原文动词带有加强语气，未完成时可能表示持续或反复的动作。
    reason: lexical_alternative
  - marker: b
    text: “香膏”也可译作“香油”或“芬芳的油膏”；原词指带香气的油或膏。
    reason: lexical_alternative
lexical_decisions:
- source_word: στᾶσα
  choice: 站在
  rationale: 不定过去时分词在这里交代场景；译作“站在”符合现代汉语叙事习惯，也不额外强调动作先后。
- source_word: ὀπίσω παρὰ τοὺς πόδας αὐτοῦ
  choice: 在耶稣身后，挨着他的脚
  rationale: 同时保留ὀπίσω“在后面”和παρά加宾格所表达的靠近位置；也符合当时侧身斜卧用餐的场景。
- source_word: κλαίουσα
  choice: 哭泣着
  rationale: 表达持续哭泣的状态，并与随后眼泪湿脚的动作自然衔接。
- source_word: τοῖς δάκρυσιν ἤρξατο βρέχειν
  choice: 开始用眼泪湿
  rationale: 保留ἤρξατο“不定式”的起始意义；“湿”准确表达βρέχειν，又避免夸大为“浸透”。
- source_word: ἐξέμασσεν
  choice: 擦
  rationale: 该动词可指擦去或擦干；中文“擦”保留动作本身，不强行断定最终结果。上下文已清楚说明她用头发擦的是耶稣的脚。
- source_word: ταῖς θριξὶν τῆς κεφαλῆς αὐτῆς
  choice: 用自己的头发
  rationale: 现代汉语无需直译为“用自己头上的头发”；“自己的头发”自然、明确，并保留画面的具体性。
- source_word: κατεφίλει
  choice: 一再亲吻
  rationale: καταφιλέω语气较强，未完成时又呈现持续中的动作；“一再亲吻”自然地表达反复性，但不加入“热烈”或“虔敬”等解释。
- source_word: ἤλειφεν
  choice: 抹
  rationale: 未完成时呈现进行中的动作；“抹”是现代汉语中对施用香膏自然且具体的说法。
- source_word: τῷ μύρῳ
  choice: 用香膏
  rationale: μύρον指带香气的油或膏；“香膏”兼顾传统可识别性、文化语境和现代可懂度。
theological_decisions:
- issue: 妇人对耶稣双脚所做之事的表达
  choice: 具体保留流泪、用头发擦脚、反复亲吻和抹香膏等身体动作
  alternative: 概括为“向他表示敬爱”或弱化反复亲吻的意味
  rationale: 原文以具体而强烈的动作塑造场景。译文应保留其谦卑和情感张力，却不把这些动作直接解释成某种特定的敬拜、悔罪或礼仪行为。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“耶稣”补明代词所指，避免汉语连续使用“他”造成歧义；末句再次说“他的脚”，使香膏所抹的位置与原文一致。分号帮助呈现前后连续而密集的动作。
