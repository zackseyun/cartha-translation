  text: Τίνι οὖν ὁμοιώσω τοὺς ἀνθρώπους τῆς γενεᾶς ταύτης, καὶ τίνι εἰσὶν ὅμοιοι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/031.yaml
  text: To what, then, shall I compare the men of this generation, and what are they like?
translation:
  language: zh_hans
  text: “那么，我该把这一代的人比作什么呢？他们像什么呢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τίνι … ὁμοιώσω
  choice: 我该把……比作什么呢
  rationale: 准确表达间接宾语疑问词与‘比作’的句法关系，同时符合现代汉语自然问法。
- source_word: οὖν
  choice: 那么
  rationale: 保留承接上文并引出结论性提问的语篇功能。
- source_word: τοὺς ἀνθρώπους τῆς γενεᾶς ταύτης
  choice: 这一代的人
  rationale: ἄνθρωποι在此泛指人群，并非专指男性；‘这一代的人’自然保留其世代指向。
- source_word: τίνι εἰσὶν ὅμοιοι
  choice: 他们像什么呢
  rationale: 保留与前一问句平行的设问形式，不预先解释随后比喻的所指。
theological_decisions:
- issue: ἄνθρωποι是否译为专指男性
  choice: 这一代的人
  alternative: 这一代的男人
  rationale: 该词在此语境中泛指当代人群；译成‘男人’会无根据地缩窄范围。
translation_notes:
  register: 采用现代、庄重而口语自然的设问句式；两个问句保持原文的修辞平行和未解张力。
