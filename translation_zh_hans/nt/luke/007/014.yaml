  naturalness: “抬尸架”可理解，但在现代汉语中略显生硬，且“尸”字易造成不必要的冷峻感。“送葬的抬架”较自然，并由脚注说明其为承载遗体的架子。“抬着的人就站住了”在上下文中所抬之物明确，表达自然。
  terminology: 以“送葬的抬架”对应σορός，避免把开放式承载架预设为现代封闭棺材；脚注保留“棺木”和“灵床”等替代译法。“我对你说，起来！”保留原文的直称、强调和庄重语气，未将“起来”扩展解释为“复活”。
