  text: καὶ προσελθὼν ἥψατο τῆς σοροῦ, οἱ δὲ βαστάζοντες ἔστησαν, καὶ εἶπεν· Νεανίσκε, σοὶ λέγω, ἐγέρθητι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/014.yaml
  text: And coming up[a], he touched the bier, and the men carrying it stood still, and he said, “Young man, I say to you, arise.”
translation:
  language: zh_hans
  text: 耶稣上前，摸了送葬的抬架[a]；抬着的人就站住了。耶稣说：“年轻人，我对你说，起来！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “送葬的抬架”也可译作“棺木”或“灵床”。原文指送葬时承载遗体的架子，不一定是封闭的棺材。
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: 上前
  rationale: 该不定过去时分词表示耶稣走近后采取主要行动；“上前”简洁自然，并保留动作的先后关系。
- source_word: ἥψατο
  choice: 摸了摸
  rationale: ἅπτω的中间语态在此指触碰；“摸了摸”符合现代汉语叙事习惯，又不夸大为抓住或长时间握持。
- source_word: σοροῦ
  choice: 抬尸架
  rationale: σορός在当时送葬场景中通常指承载遗体的架子或灵床，而不一定是现代意义上的封闭棺材；“抬尸架”能较清楚地呈现历史场景。
- source_word: οἱ δὲ βαστάζοντες
  choice: 抬架的人
  rationale: 指抬着送葬用承载架的人；根据汉语语境补出“架”，表达清楚而自然。
- source_word: ἔστησαν
  choice: 站住了
  rationale: ἵστημι在这里兼有停止行进并停在原地之意；“站住了”比单说“停了”更贴近原文。
- source_word: Νεανίσκε
  choice: 年轻人
  rationale: 这是对年轻男性的直接称呼；“年轻人”准确、自然，也保持庄重。
- source_word: σοὶ λέγω
  choice: 我吩咐你
  rationale: 原文直译为“我对你说”，带有强调对象和直接宣告的力量；在命令句中译为“我吩咐你”能自然体现语力，但不额外增添解释。
- source_word: ἐγέρθητι
  choice: 起来
  rationale: 该命令式可表示起来或被唤起；在此是对死者发出的直接命令。“起来”在现代汉语中自然庄重，并保留叙事所显出的权威。
theological_decisions:
- issue: 耶稣对死者命令的语气
  choice: 译作“我吩咐你，起来！”
  alternative: “我对你说，起来！”或“你要复活！”
  rationale: “起来”保留ἐγέρθητι在语法上的直接命令及其语义张力，不把它解释性地扩展为“复活”；“我吩咐你”则在自然汉语中体现σοὶ λέγω的强调和庄严权威。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语体。“抬尸架”虽不如“棺材”常见，却更准确反映一世纪送葬场景；脚注补充常见译法。标点和分句顺应现代简体中文阅读习惯。
