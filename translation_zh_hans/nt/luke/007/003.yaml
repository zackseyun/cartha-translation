  text: ἀκούσας δὲ περὶ τοῦ Ἰησοῦ ἀπέστειλεν πρὸς αὐτὸν πρεσβυτέρους τῶν Ἰουδαίων, ἐρωτῶν αὐτὸν ὅπως ἐλθὼν διασώσῃ τὸν δοῦλον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/003.yaml
  text: When he heard about Jesus[a], he sent to him elders of the Jews, asking him to come and save his slave.
translation:
  language: zh_hans
  text: 他听说耶稣的事，就差遣犹太人的长老去见耶稣，请求耶稣来救他的奴隶[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“仆人”。希腊语δοῦλος可按语境指“仆人”或“奴隶”；这里译作“奴隶”，以保留这个词所体现的受奴役身份。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας δὲ περὶ τοῦ Ἰησοῦ
  choice: 他听说了耶稣的事，就
  rationale: 不定过去时分词表示先于主句动作发生的情形，译为“听说了……就”自然地呈现时间先后；δέ仅作轻微衔接，由“就”及句势体现，不另作强转折。
- source_word: ἀπέστειλεν πρὸς αὐτὸν
  choice: 差遣……去见耶稣
  rationale: ἀποστέλλω表示派遣；πρὸς αὐτόν指向耶稣。汉语重复“耶稣”可避免连续代词所造成的指代含混。
- source_word: πρεσβυτέρους τῶν Ἰουδαίων
  choice: 犹太人的几位长老
  rationale: πρεσβύτεροι在此指获得承认的群体领袖，而不只是年长者；无冠词复数以“几位”自然表达非特指的一组人，同时保留属格结构。
- source_word: ἐρωτῶν αὐτὸν
  choice: 请求他
  rationale: ἐρωτάω在此语境中是礼貌而郑重地提出请求；“请求”比一般的“问”更符合其内容。
- source_word: ὅπως ἐλθὼν
  choice: 来
  rationale: ὅπως加虚拟语气表达请求的目的或内容，ἐλθών表示先来而后施救；现代汉语用“请求他来……”简洁自然。
- source_word: διασώσῃ
  choice: 救
  rationale: διασῴζω可指拯救、救护或使人脱离危境。上下文是重病，但“救”保留了原词比单纯“医治”更宽的语义。
- source_word: τὸν δοῦλον αὐτοῦ
  choice: 他的奴隶
  rationale: δοῦλος在此指百夫长权下、具有受奴役身份的家内成员；“奴隶”保留其社会与法律上的从属状态，不以较缓和的“仆人”掩盖这一层含义。
theological_decisions:
- issue: 叙事性家庭语境中δοῦλος的译法
  choice: 奴隶
  alternative: 仆人
  rationale: 经文所描写的是百夫长权下的δοῦλος。“奴隶”更清楚地保留当时受奴役的社会身份；但该词也可着重其服役角色，因此脚注保留传统译法“仆人”，不把词义范围绝对化。
- issue: διασώσῃ在重病语境中的含义
  choice: 救
  alternative: 救治
  rationale: 上下文使身体得医治的含义十分明显，但原词本身比“医治”更宽。采用“救”既符合危重病情，也不在译文中提前缩窄其语义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“听说了……就”清楚呈现动作顺序；“去见耶稣”消除代词歧义；“几位长老”说明这是被差遣的一组犹太群体领袖。脚注标记紧跟其实际说明的“奴隶”，而非置于“耶稣”之后。
