  text: Καὶ ἀπήγγειλαν Ἰωάννῃ οἱ μαθηταὶ αὐτοῦ περὶ πάντων τούτων. καὶ προσκαλεσάμενος δύο τινὰς τῶν μαθητῶν αὐτοῦ ὁ Ἰωάννης
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/018.yaml
  text: And his disciples reported all these things to John[a]. And John, calling two certain ones of his disciples[b],
translation:
  language: zh_hans
  text: 约翰的门徒把这一切事都告诉了他。约翰便从自己的门徒中叫来两个人，[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文的句子在下一节继续，因此这里用逗号表示句意尚未完结。
    reason: cross_reference
lexical_decisions:
- source_word: ἀπήγγειλαν
  choice: 告诉了
  rationale: 该动词表示转告、报告消息；“告诉了”在现代汉语叙事中自然，也准确表达门徒把所见所闻传达给约翰。
- source_word: Ἰωάννῃ
  choice: 约翰……他
  rationale: 与格标明信息的接受者。为避免汉语连续重复人名，译作“告诉了他”，其所指由前置的“约翰”清楚限定。
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: 约翰的门徒
  rationale: “门徒”准确保留福音书中师徒兼追随者的关系；明确说“约翰的”比孤立的“他的”更适合本节开头的汉语语境。
- source_word: περὶ πάντων τούτων
  choice: 这一切事
  rationale: “这一切”保留 πάντων 的全面性和 τούτων 对前文事件的指向；“告诉……这一切事”自然涵盖 περὶ 的话题关系。
- source_word: προσκαλεσάμενος
  choice: 叫来
  rationale: 该中间语态分词表示约翰把人召到自己这里；“叫来”简洁自然，并保留行动方向。
- source_word: δύο τινὰς
  choice: 两个人
  rationale: τινάς 带不定选择意味，表示从门徒中选取两位，并非强调身份特殊的“某两个人”；部分结构“从……中”已自然传达这一点。
- source_word: τῶν μαθητῶν αὐτοῦ
  choice: 从自己的门徒中
  rationale: 属格为部分属格，表明这两人选自约翰的门徒群体；“自己的”清楚回指本分句主语约翰。
- source_word: ὁ Ἰωάννης
  choice: 约翰
  rationale: 保留希腊文再次明说的主语，使新分句的行动者清楚。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“约翰便……”顺接前一分句；末尾保留逗号，以反映希腊文分词结构尚待下一节主要动作完成。
