  text: καὶ ἰδοὺ γυνὴ ⸂ἥτις ἦν ἐν τῇ πόλει⸃ ἁμαρτωλός, ⸀καὶ ἐπιγνοῦσα ὅτι ⸀κατάκειται ἐν τῇ οἰκίᾳ τοῦ Φαρισαίου, κομίσασα ἀλάβαστρον μύρου
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/037.yaml
  text: And behold[a], a woman in the city, who was a sinner, having learned that he was reclining at table in the Pharisee’s house[c][b], brought an alabaster jar of perfume.
translation:
  language: zh_hans
  text: 看哪，在那城里有一个女人，是个罪人[a]。她得知耶稣正在那个法利赛人的家里斜卧用餐[b]，就带来一只盛着香膏的雪花石膏瓶[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文只说她“是个罪人”，没有说明她具体犯了什么罪。
    reason: lexical_alternative
  - marker: b
    text: 指按当时正式宴席的习惯斜卧用餐。
    reason: cultural_note
  - marker: c
    text: 或译：“一只雪花石膏香油瓶。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留其引人注意、使叙事场景更鲜明的语篇功能；用语庄重而仍易懂。
- source_word: ἥτις ἦν ἐν τῇ πόλει
  choice: 在那城里有一个女人
  rationale: 保留“在城里”的宽泛表述，不擅自具体化为“来自那城”或“住在那城”。
- source_word: ἁμαρτωλός
  choice: 是个罪人
  rationale: 保留原文名词性判断，不说明她所犯之罪的类别。
- source_word: ἐπιγνοῦσα
  choice: 她得知
  rationale: 自然表达分词所示先于主要动作发生的获知行为。
- source_word: κατάκειται
  choice: 正在……席间斜卧
  rationale: 准确反映当时正式用餐时斜卧的姿势，同时借“席间”交代用餐语境。
- source_word: οἰκίᾳ τοῦ Φαρισαίου
  choice: 那个法利赛人家里
  rationale: 以自然汉语表达特指的房屋及其主人。
- source_word: κομίσασα
  choice: 就带来
  rationale: 简洁表达她携物来到现场，并体现与“得知”之间的叙事承接。
- source_word: ἀλάβαστρον μύρου
  choice: 一只盛香膏的雪花石膏瓶
  rationale: 同时交代容器的材质、形制和其中的芳香膏油；“香膏”符合圣经语境且为现代读者所熟悉。
theological_decisions:
- issue: 对女人道德身份的描述
  choice: 是个罪人
  alternative: 有罪的女人；生活不检点的女人；妓女
  rationale: 原文只称她为ἁμαρτωλός，并未说明具体罪行；因此不把传统推测写入正文。
translation_notes:
  register: 采用现代、庄重而通顺的书面汉语。“看哪”保留路加叙事中的醒目引介；将较长的希腊语句分成两句，避免汉语结构生硬，同时不消除“在那城里”的语义宽度。
