  text: καὶ ἰδὼν αὐτὴν ὁ κύριος ἐσπλαγχνίσθη ἐπ’ αὐτῇ καὶ εἶπεν αὐτῇ· Μὴ κλαῖε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/013.yaml
  text: And when the Lord saw her[a], he was moved with compassion for her and said to her, “Do not weep.”
translation:
  language: zh_hans
  text: 主看见她，就怜悯她，对她说：“不要哭。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“别哭”或“别再哭了。”希腊文可理解为一般性的劝止，也可理解为叫她停止当时正在进行的哀哭。
    reason: 词义及动词体貌存在可保留的不同理解。
lexical_decisions:
- source_word: ἰδὼν
  choice: 看见
  rationale: 不定过去时分词表示这一动作先于主要动词；汉语以“看见……就……”自然呈现其时间关系。
- source_word: ὁ κύριος
  choice: 主
  rationale: 这里是路加叙事中对耶稣的称谓；译作“主”既保留基督论分量，也不增添原文未明说的内容。
- source_word: ἐσπλαγχνίσθη
  choice: 怜悯
  rationale: 该词表达发自内心的深切同情；“怜悯”庄重自然，并保留其强烈的情感意味。
- source_word: ἐπ’ αὐτῇ
  choice: 她
  rationale: ἐπί加与格标明怜悯所指向的人；汉语“怜悯她”直接、自然。
- source_word: εἶπεν αὐτῇ
  choice: 对她说
  rationale: 忠实对应常用动词λέγω及其间接宾语，避免“告诉”可能带出的额外语义。
- source_word: Μὴ κλαῖε
  choice: 不要哭了
  rationale: κλαίω指哭泣；μή加现在时命令语气既可作一般禁止，也可要求停止正在进行的动作。“不要哭了”符合当前哀哭的语境，同时脚注说明其语气范围。
theological_decisions:
- issue: κύριος作为耶稣的称谓
  choice: 主
  alternative: 主人
  rationale: 在本节路加的叙事用语中，“主”保留这一称谓的崇高与基督论意味；“主人”容易把它缩减为一般社会身份。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“看见……就……”使分词结构符合自然汉语；“不要哭了”贴合丧亲哀哭的场景，并以脚注保留原文命令语气的歧义。
