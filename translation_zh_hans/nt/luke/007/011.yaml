  text: Καὶ ἐγένετο ἐν τῷ ἑξῆς ⸀ἐπορεύθη εἰς πόλιν καλουμένην Ναΐν, καὶ συνεπορεύοντο αὐτῷ οἱ μαθηταὶ ⸀αὐτοῦ καὶ ὄχλος πολύς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/011.yaml
  text: And it happened on the next day that he went into a town called Nain[a], and his disciples and a large crowd were going with him.
translation:
  language: zh_hans
  text: 第二天[a]，耶稣往一座名叫拿因的城去；他的门徒和一大群人也与他同行。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“此后不久”，而不是“第二天”。
    reason: textual_variant
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: 第二天，耶稣……去
  rationale: 这是路加常用的叙事引入语。汉语若直译为“事情发生了”会显得累赘，因此让其引入新事件的功能自然融入句子。
- source_word: ἐν τῷ ἑξῆς
  choice: 第二天
  rationale: SBLGNT正文的短语指接下来的时间，在此最自然地理解为“第二天”；异文所表达的“此后不久”收入脚注。
- source_word: ἐπορεύθη
  choice: 往……去
  rationale: 准确表达πορεύομαι在叙事中的一般移动意义，并符合现代汉语习惯。
- source_word: εἰς πόλιν
  choice: 往一座……城去
  rationale: πόλις可指城或城镇；“城”是简洁、庄重且不夸大聚落规模的常用译法。“往……去”自然表达εἰς所指的方向。
- source_word: καλουμένην Ναΐν
  choice: 名叫拿因
  rationale: 以现代汉语自然表达“被称为”，并按通行圣经地名音译Ναΐν。
- source_word: συνεπορεύοντο
  choice: 也与他同行
  rationale: 保留共同前行的动作；“同行”简洁地传达未完成时所描写的伴随行程。
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: 他的门徒
  rationale: 符合现代汉语所有格结构，也是福音书语境中μαθηταί的常用译法。
- source_word: ὄχλος πολύς
  choice: 一大群人
  rationale: 清楚表达ὄχλος及πολύς所强调的人群规模，语言自然易懂。
