  yaml_path: translation/nt/luke/007/035.yaml
  text: Yet wisdom was vindicated by all her children[a][b][c].
translation:
  language: zh_hans
  text: 然而，智慧被她所有的儿女证明是对的。[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“被认定为正确”或“得到证实”。
    reason: lexical_alternative
  - marker: b
    text: “儿女”是比喻，指那些以自己的回应或生活方式显明智慧是对的人。
    reason: lexical_alternative
  - marker: c
    text: 马太福音11:19作：“智慧被她的行为证明是对的。”
    reason: cross_reference
lexical_decisions:
- source_word: καὶ
  choice: 然而
  rationale: καί通常作“并且”，但此处承接上文对这个世代反复挑剔的批评，具有轻微转折意味；“然而”自然呈现这种对比。
- source_word: ἐδικαιώθη
  choice: 得证为正确
  rationale: 此处δικαιόω不是保罗书信中法庭式“称义”的专门用法，而是指智慧被显明、证实为正确；该译法也保留了被动语态。
- source_word: ἡ σοφία
  choice: 智慧
  rationale: 采用σοφία的通常译法，并保留原文将智慧人格化的表达。
- source_word: ἀπὸ πάντων
  choice: 从……所有……身上
  rationale: ἀπό在此可表示证实的来源或凭据。“从……身上”既贴近介词本义，又自然表达智慧因她儿女所提供的见证而被证实。
- source_word: τῶν τέκνων αὐτῆς
  choice: 她所有的儿女
  rationale: τέκνα直译为“儿女”，αὐτῆς以阴性形式呼应“智慧”。此译保留人格化隐喻，不在正文中将其解释成“行为”或“成果”。
theological_decisions:
- issue: “智慧的儿女”所指为何
  choice: 正文直译为“她所有的儿女”，保留其作为追随、体现智慧之人的隐喻空间。
  alternative: 理解为智慧所产生的成果或果效；或参照马太福音11:19译作“行为”。
  rationale: 路加所载希腊文本明确使用τέκνων（儿女）。直译既忠于文本，也不提前消解这一格言的神学张力。
- issue: ἐδικαιώθη是否应译为“称义”
  choice: 译作“得证为正确”。
  alternative: 译作“被称为义”或“被证明是对的”。
  rationale: 语境关注智慧是否由其儿女的回应得到公开印证，并非讨论罪人被神算为义；因此避免使用容易带入特定救恩论含义的“称义”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“得证为正确”比“得以昭雪”更贴近日常理解，也比“被称义”更能避免误导；以“她”保留智慧的人格化，并用“儿女”保留原文隐喻。
