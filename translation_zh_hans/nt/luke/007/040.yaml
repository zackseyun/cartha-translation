base_translation:
  language: en
  yaml_path: translation/nt/luke/007/040.yaml
  text: And Jesus answered and said to him[a], “Simon, I have something to say to you.” And he said, “Teacher, say it.”
translation:
  language: zh_hans
  text: 耶稣回答他，说：“西门，我有话要对你说。”西门说：“老师，请说。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν πρὸς αὐτόν
  choice: 耶稣回答他说
  rationale: 保留希腊文“回答—说”的叙事表达；现代汉语中虽略显重复，却清楚自然，也没有把“回答”弱化为一般的“开口”。
- source_word: Σίμων
  choice: 西门
  rationale: 采用现代中文圣经语境中通行的人名音译。
- source_word: ἔχω σοί τι εἰπεῖν
  choice: 我有句话要对你说
  rationale: 准确表达 σοί（“对你”）及不定代词 τι；“有句话”比“有一件事”更贴近说话这一语境，也符合自然汉语。
- source_word: Διδάσκαλε
  choice: 老师
  rationale: διδάσκαλος 的基本义是教导者、教师；“老师”是现代普通话中自然且直接的对应词，不额外加入“主人”等更强的权威含义。
- source_word: εἰπέ
  choice: 请说
  rationale: 原文是“说”的命令式；汉语加入“请”自然体现西门回应时的礼貌语气，而不改变让耶稣继续说下去的意思。
- source_word: φησίν
  choice: 他说
  rationale: 希腊文用历史现在时，汉语叙事采用“他说”即可自然承接上下文。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语自然的叙事表达。“老师，请说”适合直接对话；本节无须脚注，因为原英文脚注所列的“Master, speak”是英语词汇选择问题，在中文译文中并不形成需要保留的实质歧义。
