  naturalness: “耶稣回答他说”在较传统的圣经汉语中可见，但在现代标准汉语中略显黏连，容易读成不够完整的搭配。“耶稣回答他，说”更自然。将第二个“他说”明确为“西门说”，避免紧邻引语后的指代短暂含混。
