source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ἐπορεύετο σὺν αὐτοῖς. ἤδη δὲ αὐτοῦ οὐ μακρὰν ἀπέχοντος ἀπὸ τῆς οἰκίας ἔπεμψεν ⸂φίλους ὁ ἑκατοντάρχης⸃ λέγων αὐτῷ· Κύριε, μὴ σκύλλου, οὐ γὰρ ⸂ἱκανός εἰμι⸃ ἵνα ὑπὸ τὴν στέγην μου εἰσέλθῃς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/006.yaml
  text: So Jesus went with them[a]. But when he was already not far from the house, the centurion sent friends, saying to him, “Lord, do not trouble yourself[b], for I am not worthy that you should come under my roof.”
translation:
  language: zh_hans
  text: 耶稣就和他们一同前往。耶稣离那家已经不远时，百夫长派朋友来对他说：“主啊[a]，请不要为我劳烦，因为我不配[b]让你进到我家里。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“先生”。希腊语κύριε既可用作尊敬的称呼，也可能表示对耶稣权柄的承认。
    reason: alternative_reading
  - marker: b
    text: 也可译作“我不够资格”或“我不合适”。原词可表示足够、合适或配得；这里表达百夫长在耶稣面前的谦卑。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπορεύετο
  choice: 前往
  rationale: 未完成时在这里叙述耶稣正在行进；“前往”在现代汉语中自然，也与下文接近那家相衔接。
- source_word: σὺν αὐτοῖς
  choice: 和他们一同
  rationale: 直接保留同行、陪同的含义。
- source_word: ἤδη ... οὐ μακρὰν ἀπέχοντος ἀπὸ τῆς οἰκίας
  choice: 离那家已经不远时
  rationale: 以自然的时间从句表达属格独立结构，并保留“已经”和“不远”的原文措辞。
- source_word: ἔπεμψεν φίλους
  choice: 派朋友
  rationale: 保留复数“朋友”的群体意义，同时不擅自添加原文没有的具体数量。
- source_word: ὁ ἑκατοντάρχης
  choice: 百夫长
  rationale: 这是罗马军职在中文圣经语境中准确而通行的译名。
- source_word: Κύριε
  choice: 主啊
  rationale: 既可表达尊敬的称呼，也保留此词可能包含的对耶稣权柄的承认，不将其限定为单纯的礼貌称谓。
- source_word: μὴ σκύλλου
  choice: 不必劳烦了
  rationale: 该表达在此意为不必再受累或费事；中文这样说自然、谦敬，也符合百夫长托人传话的语气。
- source_word: οὐ ... ἱκανός εἰμι
  choice: 我不配
  rationale: ἱκανός可指足够、合适或配得；此处“不配”简洁地表达百夫长面对耶稣时的谦卑，同时脚注保留其词义幅度。
- source_word: ἵνα ... εἰσέλθῃς
  choice: 让你进到
  rationale: 清楚表达ἵνα从句所说明的“不配”之事，并保留“进入”的动作。
- source_word: ὑπὸ τὴν στέγην μου
  choice: 我的屋檐下
  rationale: 保留原文“在我的屋顶之下”的具体意象；中文“屋檐下”也能自然指家中。
theological_decisions:
- issue: 对耶稣的直接称呼κύριος如何翻译
  choice: 主啊
  alternative: 先生
  rationale: 在这一语境中，该词可以只是尊称，也可能体现对耶稣权柄更深的承认。“主啊”保留后一层可能性，但用脚注说明前一种理解，避免把本节强行定为完整的基督论宣认。
- issue: ἱκανός所表达的是资格、能力还是配得
  choice: 我不配
  alternative: 我不够资格
  rationale: 上下文突出百夫长的谦卑，“不配”最符合自然中文；然而原词也有“足以、合适、够资格”的范围，因此以脚注保留其真实的词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“那家”承接上下文所指的房屋；第二句重复“耶稣”，避免连续代词在中文中造成指代不清。“屋檐下”保留原文意象而不改写成较抽象的“家里”。脚注标记分别紧跟“主啊”和“不配”，与实际注释内容对应。
