id: LUK.7.8
reference: Luke 7:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ γὰρ ἐγὼ ἄνθρωπός εἰμι ὑπὸ ἐξουσίαν τασσόμενος, ἔχων ὑπ’ ἐμαυτὸν στρατιώτας, καὶ λέγω τούτῳ· Πορεύθητι, καὶ πορεύεται, καὶ ἄλλῳ· Ἔρχου, καὶ ἔρχεται, καὶ τῷ δούλῳ μου· Ποίησον τοῦτο, καὶ ποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/008.yaml
  text: For I too am a man placed under authority[a], with soldiers under me; and I say to this one, ‘Go,’ and he goes; and to another, ‘Come,’ and he comes; and to my slave, ‘Do this,’ and he does it.
translation:
  language: zh_hans
  text: 因为我自己也是一个受权柄管辖的人，手下有士兵；我对这个人说：‘去！’他就去；对另一个人说：‘来！’他就来；对我的奴仆[a]说：‘做这件事！’他就做。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “奴仆”或译“仆人”。希腊文δοῦλος指处于隶属、受主人支配身份的人；在某些语境中也可较宽泛地译作“仆人”。
    reason: 说明δοῦλος所指的从属社会身份，并保留“仆人”这一可行替代译法。
lexical_decisions:
- source_word: καὶ γὰρ
  choice: 因为……也
  rationale: γάρ引出百夫长说明自己何以理解权柄如何运作；καί与显明的ἐγώ共同带出“我也”的比较意味。
- source_word: ὑπὸ ἐξουσίαν τασσόμενος
  choice: 被置于权下
  rationale: 保留τασσόμενος的被动和受安排之意，也呈现军事等级体系；“权下”简洁而有尊严。
- source_word: ἔχων ὑπ’ ἐμαυτὸν στρατιώτας
  choice: 也有士兵在我手下
  rationale: 忠实表达上下级关系，不把原文进一步解释成“由我指挥”。
- source_word: λέγω τούτῳ
  choice: 我对这个说
  rationale: 保留τούτῳ的指示性，并维持随后“另一个”的对称结构。
- source_word: Πορεύθητι / Ἔρχου
  choice: 去 / 来
  rationale: 用简明直接的现代汉语命令语，准确呈现命令与服从的对应。
- source_word: τῷ δούλῳ μου
  choice: 我的奴仆
  rationale: “奴仆”保留δοῦλος所含的隶属身份和权力关系，同时在现代中文中比“奴隶”更适合此处家庭或随从语境；脚注注明可译“仆人”。
theological_decisions:
- issue: 百夫长所说的ὑπὸ ἐξουσίαν是否应解释为他与耶稣权柄的具体对应
  choice: 仅译作“被置于权下”
  alternative: 在译文中解释为“服在上级权柄之下”或暗示耶稣同样受某一权柄差遣
  rationale: 原文陈述百夫长在权柄结构中的位置，却没有在本节明说耶稣与之每一点如何对应；译文保留这种类比的张力，不加入教义性推论。
- issue: δοῦλος的身份色彩
  choice: 奴仆
  alternative: 仆人；奴隶
  rationale: 此处命令与服从的从属关系十分重要，因此正文不采用较宽泛的“仆人”；但“奴隶”在现代中文中可能过度突出近现代制度联想，故选“奴仆”并以脚注说明另一译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。用“因为……也”自然承接上文的解释关系；命令句保持简短，以突出百夫长所描述的权柄和立即服从。正文中的脚注标记[a]与脚注对应。
