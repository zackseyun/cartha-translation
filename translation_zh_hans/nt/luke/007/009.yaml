id: LUK.7.9
reference: Luke 7:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ταῦτα ὁ Ἰησοῦς ἐθαύμασεν αὐτόν, καὶ στραφεὶς τῷ ἀκολουθοῦντι αὐτῷ ὄχλῳ εἶπεν· Λέγω ὑμῖν, ⸀οὐδὲ ἐν τῷ Ἰσραὴλ τοσαύτην πίστιν εὗρον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/009.yaml
  text: When Jesus heard these things[a], he marveled at him, and turning to the crowd following him, he said, “I tell you[b], not even in Israel have I found such faith.”
translation:
  language: zh_hans
  text: 耶稣听见这些话，就对他感到惊奇；他转过身来，对跟随他的众人说：“我告诉你们，就是在以色列，我也没有见过这么大的信心[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这么大的信心”也可译作“这样的信赖”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας δὲ ταῦτα
  choice: 耶稣听见这些话，就
  rationale: 不定过去时分词表示先于主句发生的情形；“听见……就”自然传达时间衔接。δέ是轻微的叙事过渡，不另作生硬直译。ταῦτα保留复数所指，指前文转述的话。
- source_word: ἐθαύμασεν αὐτόν
  choice: 对他感到惊奇
  rationale: θαυμάζω表示惊奇、赞叹；此译保留耶稣真实的惊异，又符合现代汉语。“他”按上下文指百夫长。
- source_word: στραφεὶς
  choice: 他转过身来
  rationale: 该分词在叙事中表达转身的动作；拆成并列分句更符合现代汉语行文。
- source_word: τῷ ἀκολουθοῦντι αὐτῷ ὄχλῳ
  choice: 对跟随他的众人
  rationale: 现在分词体现持续跟随的状态；ὄχλος在此译作“众人”，自然且有经文叙事的庄重感。
- source_word: Λέγω ὑμῖν
  choice: 我告诉你们
  rationale: 这是常见的郑重发言公式；此译直接、自然，并保留对听众的复数称呼。
- source_word: οὐδὲ ἐν τῷ Ἰσραὴλ
  choice: 就是在以色列，我也没有
  rationale: οὐδέ带有“甚至……也不”的加强语气；此汉语句式自然表达比较重点。“以色列”保留原文既可指地域、也可指群体的含蓄性。
- source_word: τοσαύτην πίστιν
  choice: 这么大的信心
  rationale: τοσαύτην强调程度，译作“这么大的”比单说“这样的”更明确。πίστις在本语境指百夫长对耶稣权柄的信赖，译作现代汉语常用的“信心”。
- source_word: εὗρον
  choice: 见过
  rationale: 不定过去时在此总结截至说话时的经验；“没有见过”自然传达汉语中的既往经验，而不需机械体现时态。
theological_decisions:
- issue: πίστις的译法
  choice: 信心
  alternative: 信赖
  rationale: 本节着重百夫长对耶稣权柄的相信与倚赖。“信心”既是现代中文圣经语境中的通行表达，也不把该词误解为人的忠诚品格；“信赖”可说明其语义，但放入正文稍弱化了与信仰主题的词汇联系。
- issue: “以色列”的范围
  choice: 保留“在以色列”
  alternative: 在以色列人中
  rationale: 原文ἐν τῷ Ἰσραήλ可以按群体范围理解，但正文保留“以色列”，不把地域与民族共同体之间的含蓄性过早限定。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“众人”“信心”保留圣经文本的熟悉语感，同时避免文言化。“感到惊奇”比“希奇”更符合当代普通话。
