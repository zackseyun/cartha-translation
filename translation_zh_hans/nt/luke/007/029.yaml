id: LUK.7.29
reference: Luke 7:29
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: (καὶ πᾶς ὁ λαὸς ἀκούσας καὶ οἱ τελῶναι ἐδικαίωσαν τὸν θεόν, βαπτισθέντες τὸ βάπτισμα Ἰωάννου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/029.yaml
  text: And all the people[a], when they heard this, including the tax collectors, declared God to be righteous[b], having been baptized with John's baptism.
translation:
  language: zh_hans
  text: 全体民众，包括税吏在内，听见这话后，都承认上帝是公义的[a]；他们都曾接受约翰的洗礼[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较直译作“称上帝为义”。意思是他们承认上帝是公义的、所行的是对的。
    reason: lexical_alternative
  - marker: b
    text: 这里也可理解为因果关系：“因为他们曾接受约翰的洗礼。”
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ὁ λαὸς
  choice: 众百姓
  rationale: 以自然的现代汉语表达单数集合名词及其广泛范围；这里不是抽象的“全体人民”，而是指听见的人群。
- source_word: ἀκούσας
  choice: 听见了
  rationale: 将不定过去时分词按时间背景处理，与后面的主要动作构成自然汉语句式；宾语由上下文补足，不必硬加“这话”。
- source_word: οἱ τελῶναι
  choice: 税吏
  rationale: 这是新约语境中清楚、通行且简洁的现代汉语称呼。
- source_word: ἐδικαίωσαν τὸν θεόν
  choice: 承认上帝是公义的
  rationale: δικαιόω在此不是使上帝成为义，而是确认上帝为义、承认上帝所行正确；“承认……是公义的”既保留法庭性意味，也避免现代读者误解。
- source_word: βαπτισθέντες
  choice: 他们都接受了……洗礼
  rationale: 以独立分句自然表达被动分词所交代的背景情形，不把它明确限定为原因；“都”承接前文百姓和税吏这两个群体。
- source_word: τὸ βάπτισμα Ἰωάννου
  choice: 约翰的洗礼
  rationale: 简洁保留属格关系，指约翰所施行、所宣讲的洗礼。
theological_decisions:
- issue: ἐδικαίωσαν τὸν θεόν的含义
  choice: 承认上帝是公义的
  alternative: 称上帝为义；证明上帝为义
  rationale: 人并非使上帝成为公义，而是借着回应约翰的信息和洗礼，承认上帝是对的。译文保留“称义”语义中的司法色彩，同时避免加入文本没有明说的教义解释。
- issue: βαπτισθέντες与主要动词的逻辑关系
  choice: 作为背景或伴随情形表达，不明确标成因果
  alternative: 因为他们接受了约翰的洗礼
  rationale: 希腊语分词在语境中可能带有原因意味，但形式本身并未强制这一解释，因此正文保持开放，脚注说明可能的因果理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“众百姓和税吏”忠实保留希腊文的并列结构，不用“连税吏也”来额外强化语气。分号使主要回应与洗礼背景之间的紧密联系清楚可读，同时不替原文裁定分词必为因果。
