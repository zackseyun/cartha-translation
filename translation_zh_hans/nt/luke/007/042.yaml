id: LUK.7.42
reference: Luke 7:42
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: μὴ ⸀ἐχόντων αὐτῶν ἀποδοῦναι ἀμφοτέροις ἐχαρίσατο. τίς οὖν ⸀αὐτῶν πλεῖον ⸂ἀγαπήσει αὐτόν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/042.yaml
  text: Since they did not have the means to repay[a], he graciously forgave both. So which of them will love him more?
translation:
  language: zh_hans
  text: 他们无力偿还，债主就把两人的债都免了[a]。那么，他们中谁会更爱他呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“白白免去了两人所欠的。”原文动词可指施恩给予，也可指宽免所欠的债。
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ἐχόντων αὐτῶν ἀποδοῦναι
  choice: 他们无力偿还
  rationale: 属格独立结构说明两人没有偿还的能力或资源；“无力偿还”在债务语境中自然简洁，也保留了处境性的含义。
- source_word: ἀμφοτέροις ἐχαρίσατο
  choice: 债主就把两人的债都免了
  rationale: χαρίζομαι在此指施恩免除所欠之债；补出语境中明确的主语“债主”和宾语“债”，使现代汉语表达完整，同时“免了”保留白白豁免的意味。
- source_word: τίς οὖν αὐτῶν
  choice: 那么，他们中谁
  rationale: οὖν承接前述情形，引出推论性问题；“那么”符合现代汉语问答语流。
- source_word: πλεῖον ἀγαπήσει αὐτόν
  choice: 会更爱他
  rationale: 忠实表达将来时ἀγαπήσει和比较词πλεῖον，不把“爱”的性质或程度进一步神学化。
theological_decisions:
- issue: 债务比喻中χαρίζομαι的译法
  choice: 把两人的债都免了
  alternative: 恩慈地饶恕了两人
  rationale: 直接语境是债主免除债务，因此正文采用清楚自然的财务表达；脚注说明该动词也含白白施予、宽免之意，从而保留其恩惠色彩及与更广泛“饶恕”主题的联系，而不在正文中预先解释比喻。
translation_notes:
  register: 采用现代、庄重而口语自然的普通话。“债主”由上下文中的主语补出，避免汉语中指代含混；“免了债”比“取消债务”更贴近叙事问答的自然语气。
