  text: καὶ στραφεὶς πρὸς τὴν γυναῖκα τῷ Σίμωνι ἔφη· Βλέπεις ταύτην τὴν γυναῖκα; εἰσῆλθόν σου εἰς τὴν οἰκίαν, ὕδωρ ⸀μοι ἐπὶ ⸀πόδας οὐκ ἔδωκας· αὕτη δὲ τοῖς δάκρυσιν ἔβρεξέν μου τοὺς πόδας καὶ ταῖς ⸀θριξὶν αὐτῆς ἐξέμαξεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/044.yaml
  text: And turning toward the woman[a], he said to Simon, “Do you see this woman? I entered your house; you gave me no water for my feet, but she wet my feet with her tears and wiped them with her hair.”
translation:
  language: zh_hans
  text: 他转身面向那女人，对西门说：“你看见这个女人吗？我进了你的家，你没有给我水洗脚[a]；她却用眼泪湿了我的脚，又用自己的头发擦拭我的脚。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较按原文结构，可译为：“你没有给我水，用在我的脚上。”意思是没有按待客习俗提供洗脚用的水，并不表示西门必须亲自为耶稣洗脚。
    reason: 说明原文“给水”及“在脚上／用于脚”的介词结构和待客习俗，避免将其误解为西门亲自执行洗脚动作。
lexical_decisions:
- source_word: στραφεὶς πρὸς τὴν γυναῖκα
  choice: 转身面向那女人
  rationale: 准确表达先于说话发生的身体转向；“面向”自然保留 πρὸς 的方向性。
- source_word: Βλέπεις ταύτην τὴν γυναῖκα;
  choice: 你看见这个女人吗？
  rationale: 保留直陈式疑问的直接语气和指示词 ταύτην 所突出的现场对比。
- source_word: εἰσῆλθόν σου εἰς τὴν οἰκίαν
  choice: 我进了你的家
  rationale: “家”在款待宾客的语境中自然表达 οἰκία，同时保留地点归属关系。
- source_word: ὕδωρ μοι ἐπὶ πόδας οὐκ ἔδωκας
  choice: 你没有给我水洗脚
  rationale: 按当时待客习俗传达给水用于洗脚的实际意义；不暗示西门本人必须替耶稣洗脚。脚注补出较形式对应的译法。
- source_word: τοῖς δάκρυσιν ἔβρεξέν μου τοὺς πόδας
  choice: 她却用眼泪湿了我的脚
  rationale: “用”表达工具格；“湿了”贴近 βρέχω，不夸大为“浸透”。
- source_word: ταῖς θριξὶν αὐτῆς ἐξέμαξεν
  choice: 又用自己的头发擦干
  rationale: ἐκμάσσω 可指擦去水分、擦干；宾语自然承接前句的“我的脚”，“自己的”清楚表达 αὐτῆς。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“那女人”对应前文已在场且被指向的特定人物；“她却”突出耶稣在西门与女人之间所作的对比。
