reference: Luke 7:22
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ⸀ἀποκριθεὶς εἶπεν αὐτοῖς· Πορευθέντες ἀπαγγείλατε Ἰωάννῃ ἃ εἴδετε καὶ ἠκούσατε· ⸀τυφλοὶ ἀναβλέπουσιν, χωλοὶ περιπατοῦσιν, λεπροὶ καθαρίζονται, ⸀κωφοὶ ἀκούουσιν, νεκροὶ ἐγείρονται, πτωχοὶ εὐαγγελίζονται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/022.yaml
  text: 'And answering[a], he said to them, “Go and report to John what you have seen and heard: the blind receive sight, the lame walk, lepers are cleansed, the deaf hear, the dead are raised[b], the poor have good news proclaimed to them.”'
translation:
  language: zh_hans
  text: 他回答他们说：“你们去，把所看见、所听见的告诉约翰：瞎眼的人能看见[a]，瘸腿的人能行走，患麻风病的人得洁净，耳聋的人能听见，死人复活，福音传给穷人[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“瞎眼的人重见光明。”希腊语动词可指恢复视力，也可指抬头观看；这里指获得或恢复视力。
    reason: lexical_alternative
  - marker: b
    text: 或译：“穷人有好消息向他们宣告。”希腊语采用被动形式，意思是福音（好消息）被传给穷人。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: 回答
  rationale: 该分词引出耶稣对约翰使者的回应；汉语用“回答他们说”自然保留回应意味。
- source_word: Πορευθέντες
  choice: 你们去
  rationale: 该分词与随后的命令语气连用，在此具有伴随命令的作用；译成“你们去”符合现代汉语。
- source_word: ἀπαγγείλατε
  choice: 告诉
  rationale: 表示把亲眼所见、亲耳所闻带回去转告约翰；“告诉”清楚自然，也不额外强化为正式宣告。
- source_word: ἃ εἴδετε καὶ ἠκούσατε
  choice: 所看见、所听见的
  rationale: 忠实保留两个并列的感官动词，并以自然汉语表达使者已经观察到的事实。
- source_word: τυφλοὶ ἀναβλέπουσιν
  choice: 瞎眼的看见了
  rationale: ἀναβλέπω在此指获得或恢复视力；“看见了”简洁自然，同时不武断限定这些人先天失明还是后来失明。
- source_word: χωλοὶ περιπατοῦσιν
  choice: 瘸腿的行走
  rationale: 直接保留形容词作名词和动词陈述的结构，并与整组简洁有力的句式协调。
- source_word: λεπροὶ καθαρίζονται
  choice: 患麻风的得洁净
  rationale: καθαρίζονται不仅可指病得医治，也涉及洁净状态的恢复；“得洁净”保留这一较宽的语义。
- source_word: κωφοὶ ἀκούουσιν
  choice: 耳聋的听见
  rationale: κωφός可指聋或哑，但与“听见”搭配时显然指耳聋者。
- source_word: νεκροὶ ἐγείρονται
  choice: 死人复活
  rationale: 汉语“死人复活”自然表达被动含义，又不明说施事者，保留原文的神学克制。
- source_word: πτωχοὶ εὐαγγελίζονται
  choice: 穷人有福音传给他们
  rationale: 保留εὐαγγελίζονται的被动意义，表明穷人是福音宣告的领受者；避免将其弱化为仅仅“听到好消息”。
theological_decisions:
- issue: 这一系列神迹作为耶稣身份和使命的证据
  choice: 按可观察的恢复行动直接翻译，不在正文中明说其弥赛亚含义。
  alternative: 加入“应验预言”等措辞，明确突出与《以赛亚书》的关联。
  rationale: 本节让这些作为本身成为给约翰的回答。译文通过“看见”“得洁净”“有福音传给”等表达保留先知书回响，却不添加本节没有明说的解释。
- issue: 末尾各被动表达的施事者
  choice: 使用“得洁净”“复活”“有福音传给他们”等表达，不明确补出施事者。
  alternative: 译作“神使死人复活”或“我把福音传给穷人”。
  rationale: 希腊文使用被动形式；不补出“神”或“我”，可避免超出原文明确程度，并保留其神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。列表保持简洁、平行的节奏；保留“得洁净”“福音”等承载原文礼仪和宣告色彩的用语，同时避免生硬的逐词直译。
