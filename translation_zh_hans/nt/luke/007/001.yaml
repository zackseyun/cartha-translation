  text: ⸀Ἐπειδὴ ἐπλήρωσεν πάντα τὰ ῥήματα αὐτοῦ εἰς τὰς ἀκοὰς τοῦ λαοῦ, εἰσῆλθεν εἰς Καφαρναούμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/001.yaml
  text: When he had finished all his words in the hearing of the people[a], he entered Capernaum.
translation:
  language: zh_hans
  text: 耶稣对百姓讲完了这一切话[a]，就进了迦百农。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“耶稣讲完了他所有的话，使百姓听见。”
    reason: 原文的表达字面上带有“进入百姓耳中”的听觉意象，指向百姓说话、使他们听见。
lexical_decisions:
- source_word: Ἐπειδὴ
  choice: ……完了……，就……
  rationale: 这里引出时间从句，表示前一行动完成后发生下一行动；用“……完了……，就……”自然呈现叙事先后关系，不译为表示原因的“既然”。
- source_word: ἐπλήρωσεν
  choice: 讲完了
  rationale: πληρόω与“话”连用时指完成言说；“讲完了”准确而自然，也清楚表明这一行动先于“进了”。
- source_word: πάντα τὰ ῥήματα αὐτοῦ
  choice: 这一切话
  rationale: 原文较直译为“他所有的话”，回指前文耶稣的整段教导。现代汉语用“这一切话”自然承接上文，且不改变所指范围。
- source_word: εἰς τὰς ἀκοὰς τοῦ λαοῦ
  choice: 对百姓讲
  rationale: 原文意象为话语进入百姓的听觉范围，强调百姓亲耳听见。汉语“对百姓讲”自然表达公开向他们说话的含义；较直译形式保留在脚注中。
- source_word: λαοῦ
  choice: 百姓
  rationale: λαός是集合性的“人民、百姓”；此处“百姓”符合路加叙事的庄重语体，也不把他们过度具体化为临时聚集的“人群”。
- source_word: εἰσῆλθεν
  choice: 进了
  rationale: 直接表达进入某地；与地名搭配时，“进了迦百农”比“进入了迦百农”更简洁自然。
- source_word: Καφαρναούμ
  choice: 迦百农
  rationale: 采用现代中文圣经传统中通行且易识别的地名译法。
theological_decisions: []
translation_notes:
  register: 采用现代、简洁而庄重的叙事语体。“耶稣”根据紧接上文的明确所指补出，避免单节阅读时“他”指代不清；“对百姓讲”以自然汉语传达原文“进入百姓耳中”的惯用表达。
