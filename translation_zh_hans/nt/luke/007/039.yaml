  text: ἰδὼν δὲ ὁ Φαρισαῖος ὁ καλέσας αὐτὸν εἶπεν ἐν ἑαυτῷ λέγων· Οὗτος εἰ ⸀ἦν προφήτης, ἐγίνωσκεν ἂν τίς καὶ ποταπὴ ἡ γυνὴ ἥτις ἅπτεται αὐτοῦ, ὅτι ἁμαρτωλός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/039.yaml
  text: When the Pharisee who had invited him saw this[a], he said to himself, “If this man were a prophet, he would know who and what sort of woman this is who is touching him[b], because she is a sinner.”
translation:
  language: zh_hans
  text: 那位请耶稣来的法利赛人看见这事，心里说：“这人若是先知，就会知道这个正在触摸他的女人是谁、是怎样的女人[a]，因为她是个罪人[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “是谁、是怎样的女人”兼指她的身份和她属于哪一类人，也可涉及她的品行或名声。
    reason: lexical_alternative
  - marker: b
    text: “因为她是个罪人”也可理解为“就会知道……她是个罪人”；原文既可表示法利赛人如此判断的理由，也可表示他认为耶稣应当知道的内容。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν δὲ
  choice: 看见这事，就
  rationale: 以时间兼叙事推进的结构自然表达分词与δέ；“这事”由上文所述女人的举动补出，不另加原文没有的“现在”。
- source_word: ὁ Φαρισαῖος ὁ καλέσας αὐτὸν
  choice: 那位请耶稣来的法利赛人
  rationale: 在筵席语境中καλέω指邀请；用“耶稣”明确代词所指，避免汉语中“请他来的”可能产生的歧义。
- source_word: εἶπεν ἐν ἑαυτῷ λέγων
  choice: 心里说
  rationale: 简洁传达内在言语，不生硬重复“说……说道”。
- source_word: Οὗτος
  choice: 这人
  rationale: 保留指示词带有的疏离、轻蔑语气，又符合现代汉语表达。
- source_word: εἰ ἦν προφήτης, ἐγίνωσκεν ἂν
  choice: 若是先知，就会知道
  rationale: 表达说话者认为事实并非如此的非现实条件，同时保持自然、庄重的汉语。
- source_word: τίς καὶ ποταπὴ
  choice: 是谁，是怎样的女人
  rationale: 保留两个疑问成分，既涉及身份，也涉及其类别、品行或名声。
- source_word: ἡ γυνὴ ἥτις ἅπτεται αὐτοῦ
  choice: 正在摸他的是……女人
  rationale: “正在”体现ἅπτεται的当前持续性；“摸”准确、自然地表达身体接触。
- source_word: ὅτι ἁμαρτωλός ἐστιν
  choice: 因为她是个罪人
  rationale: 按上下文将ὅτι理解为因果，表达法利赛人作出判断的理由，同时用脚注保留内容从句的可能。
theological_decisions:
- issue: 关于耶稣是否为先知的条件句语气
  choice: “这人若是先知，就会知道……”
  alternative: “这人如果是先知，就知道……”
  rationale: εἰ加未完成时，并在结果句中使用未完成时和ἄν，通常构成与说话者判断相反的条件；译文呈现法利赛人的怀疑，却不认同他的判断。
- issue: ὅτι与“知道”的句法关系
  choice: 译作原因：“因为她是个罪人”
  alternative: 译作所知道的内容：“知道她是个罪人”
  rationale: 两种理解在希腊文中均有可能；正文采用语境顺畅的因果理解，脚注保留真实歧义。
translation_notes:
  register: 采用现代标准普通话、简体中文。整体语体自然而庄重；“法利赛人”“先知”“罪人”沿用通行圣经术语。正文保留人物内心话语的尖锐语气，并以脚注说明词义及句法上的真实歧义。
