  text: καὶ ἤρξαντο οἱ συνανακείμενοι λέγειν ἐν ἑαυτοῖς· Τίς οὗτός ἐστιν ὃς καὶ ἁμαρτίας ἀφίησιν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/049.yaml
  text: And those reclining at the table with him began to say among themselves[a], “Who is this, who even forgives sins?”
translation:
  language: zh_hans
  text: 同席的人开始私下议论说[a]：“这是谁，竟然连罪过也赦免？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“开始各自在心里说。”希腊语这一表达既可指个人心中的想法，也可指宾客之间的议论。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντο
  choice: 开始
  rationale: ἄρχω的不定过去时配合不定式，表示某一行动的开始；“开始”自然地保留了这一体貌含义。
- source_word: οἱ συνανακείμενοι
  choice: 同席吃饭的人
  rationale: 该分词指与耶稣一同用餐的人；古人席间常斜倚，但现代汉语若直译为“斜倚的人”容易使读者关注姿势而忽略用餐场景。“同席吃饭”既表达共同赴席，也符合自然汉语。
- source_word: λέγειν ἐν ἑαυτοῖς
  choice: 彼此说道
  rationale: ἐν ἑαυτοῖς可指各自在心里说，也可指众人之间议论；复数主语及宴席场景支持“彼此说道”，同时以脚注保留另一种可能。
- source_word: Τίς οὗτός ἐστιν
  choice: 这人是谁
  rationale: 原文没有ἄνθρωπος，但汉语“这人是谁”比“这是谁”更自然，也保留了问题的简洁和突兀。
- source_word: καὶ
  choice: 竟然连……也
  rationale: 此处καί带有递进和惊讶语气；“竟然连……也”自然传达宾客对其赦罪行为的震惊。
- source_word: ἁμαρτίας ἀφίησιν
  choice: 赦免罪
  rationale: ἀφίημι在此是赦罪的惯用表达；“赦免罪”在现代中文中清楚、庄重，并保留其神学分量。
theological_decisions:
- issue: 耶稣赦罪权柄所引发的含义
  choice: 保留宾客未获解答的惊问：“这人是谁，竟然连罪也赦免？”
  alternative: 在正文中解释耶稣的身份或赦罪权柄来源。
  rationale: 本节以宾客的惊讶提出基督论问题，却没有在本节直接作出解释；译文保留这种神学张力，不加入教义性结论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“同席吃饭”自然呈现宴席语境；“竟然连罪也赦免”以当代汉语传达原文καί的递进惊讶语气。
