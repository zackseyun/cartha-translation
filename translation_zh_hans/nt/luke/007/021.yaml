  text: ἐν ⸀ἐκείνῃ τῇ ὥρᾳ ἐθεράπευσεν πολλοὺς ἀπὸ νόσων καὶ μαστίγων καὶ πνευμάτων πονηρῶν, καὶ τυφλοῖς πολλοῖς ⸀ἐχαρίσατο βλέπειν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/021.yaml
  text: In that hour he healed many from diseases and afflictions and evil spirits[c][b][a], and to many blind people he granted sight.
translation:
  language: zh_hans
  text: 就在那时，耶稣医好了许多患疾病、受苦痛折磨和受邪灵侵扰的人，又使许多盲人得以看见。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“他赐给许多盲人看见的能力。”原文动词含有白白施予的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: 就在那时
  rationale: 保留明确的时间指向，并以“就”传达此事当下发生的意味；比直译“在那一小时里”更符合现代汉语。
- source_word: ἐθεράπευσεν πολλοὺς ἀπὸ νόσων
  choice: 医好了许多患疾病……的人
  rationale: θεραπεύω 表示医治，ἀπό 表示使人脱离病患；补出“人”并调整结构，使汉语自然，同时不扩大原文所指。
- source_word: μαστίγων
  choice: 苦痛
  rationale: 该词本指鞭打，也可引申为折磨人的严重病痛或灾患；“苦痛”保留其强烈的身体受苦意味，又避免误解为实际受鞭刑。
- source_word: πνευμάτων πονηρῶν
  choice: 邪灵
  rationale: 直接表达 πονηρός 的邪恶性质，并保留原文将其视为灵界存在的含义。
- source_word: τυφλοῖς πολλοῖς
  choice: 许多盲人
  rationale: 准确表达复数与受惠者身份，不无根据地限定性别。
- source_word: ἐχαρίσατο βλέπειν
  choice: 使……得以看见
  rationale: 既表达实际恢复视觉，也以“得以”保留 χαρίζομαι 所含白白赐予、施恩准许的意味。
theological_decisions:
- issue: πνευμάτων πονηρῶν 所指的性质
  choice: 译为“邪灵”，保留其人格性、灵界性的通常含义
  alternative: 将其解释为精神或身体疾病的非人格化说法
  rationale: 原文明确使用“邪恶的灵”，不可在翻译中将其化约为疾病隐喻。
- issue: ἐχαρίσατο 在医治盲人叙述中的恩赐意味
  choice: 译作“使……得以看见”
  alternative: 仅译作“使……看见”或“恢复了视力”
  rationale: “得以”自然地保留动词中施予恩惠的色彩，同时避免把经文扩展为更明确的系统神学陈述。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“就在那时”呼应上下文中的即时行动；“患疾病、受苦痛和被邪灵侵扰的人”将希腊语三个带 ἀπό 的来源或辖制因素转化为清楚的汉语并列结构。
