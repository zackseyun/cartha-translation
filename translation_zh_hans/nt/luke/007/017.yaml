  yaml_path: translation/nt/luke/007/017.yaml
  text: And this report about him went out through all Judea and all the surrounding region[a].
translation:
  language: zh_hans
  text: 关于他的这消息[a]传遍了犹太全地和周围各地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这消息”也可译为“这报道”或“这话”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: 传遍了
  rationale: 该动词字面意为“出去”，但与“消息”搭配时表示消息向外传播；“传遍了”既符合现代汉语习惯，也表达其扩散至整个地区的语境意义。
- source_word: ὁ λόγος οὗτος
  choice: 这消息
  rationale: λόγος在此指因耶稣所行之事而流传的消息或传闻，并非单独一个“字”或一句“话”；“这消息”自然且贴合叙事语境，同时以脚注保留“话/报道”的词义空间。
- source_word: ἐν ὅλῃ τῇ Ἰουδαίᾳ
  choice: 整个犹太
  rationale: 介词短语在传播语境中表示消息遍及全犹太地区；“整个犹太”与“传遍”搭配自然，并保留ὅλῃ的整体范围。
- source_word: περὶ αὐτοῦ
  choice: 关于他的
  rationale: περί加属格通常表示“关于、论到”；置于“这消息”之前，是清楚自然的现代汉语表达。
- source_word: πάσῃ τῇ περιχώρῳ
  choice: 周围各地
  rationale: περίχωρος指周边地区；πάσῃ强调全面范围。“周围各地”简洁自然，并避免把该词过度行政区划化。
- source_word: καὶ ... καὶ
  choice: 和
  rationale: 两个καί连接“整个犹太”与“周围各地”；汉语用一个“和”即可自然呈现累加关系，无须机械重复。
theological_decisions: []
