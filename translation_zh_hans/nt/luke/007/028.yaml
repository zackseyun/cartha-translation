id: LUK.7.28
reference: Luke 7:28
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ⸀λέγω ὑμῖν, μείζων ἐν γεννητοῖς γυναικῶν ⸀Ἰωάννου οὐδείς ἐστιν· ὁ δὲ μικρότερος ἐν τῇ βασιλείᾳ τοῦ θεοῦ μείζων αὐτοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/028.yaml
  text: I tell you[a], among those born of women no one is greater than John[c][b]; yet the least in the kingdom of God is greater than he is.
translation:
  language: zh_hans
  text: 我告诉你们：凡妇人所生的，没有一个比约翰更大；然而，神国里最小的，比他更大。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: 我告诉你们
  rationale: 这是常见的郑重陈述用语；译法自然、直接，并保留说话者面向众人的语气。
- source_word: μείζων
  choice: 更大
  rationale: 保留比较级的宽泛含义，不擅自限定为地位、重要性或属灵程度。
- source_word: ἐν γεννητοῖς γυναικῶν
  choice: 凡妇人所生的
  rationale: 保留原文带有闪语色彩的表达，中文圣经语境中易懂，泛指世人。
- source_word: Ἰωάννου
  choice: 约翰
  rationale: 采用现代中文圣经通行的人名译法。
- source_word: οὐδείς ἐστιν
  choice: 没有一个
  rationale: 与后面的比较结构自然衔接，准确表达无人例外。
- source_word: ὁ δὲ μικρότερος
  choice: 然而，神国里最小的
  rationale: 冠词加比较级作名词使用；“最小的”在汉语中自然体现其在群体中的最低位置，“然而”传达 δέ 的转折。
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: 神国里
  rationale: 采用简洁而通行的中文表达，保留处于神国之中的含义。
- source_word: μείζων αὐτοῦ ἐστιν
  choice: 比他更大
  rationale: 明确比较对象是约翰，同时不解释“大”所指的具体层面。
theological_decisions:
- issue: 约翰与神国里“最小的”之间的比较依据
  choice: 保留“比他更大”这一悖论式比较，不说明“大”是指地位、特权、救赎历史位置还是品格。
  alternative: 将其解释为神国成员享有更大的圣约特权、具有更高的属灵地位，或视为荣辱文化中的夸张说法。
  rationale: 原文只作比较，并未界定“更大”的具体依据；直译可保留其神学张力，避免加入宗派性解释。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“凡妇人所生的”略带经文传统色彩，但意义清楚，也保留原文习语；全句以分号呈现前后强烈对照。
