  text: καὶ μακάριός ἐστιν ὃς ἐὰν μὴ σκανδαλισθῇ ἐν ἐμοί.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/023.yaml
  text: And blessed is the one who is not caused to stumble by me[a].
translation:
  language: zh_hans
  text: 凡不因我而跌倒的人有福了！[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “跌倒”或译“对我反感”，或“因我而背弃信仰”。
    reason: 说明 σκανδαλισθῇ 在此既可表示因耶稣而反感、受绊，也可能指由此在信仰上失足；正文保留其比喻与语义幅度。
lexical_decisions:
- source_word: μακάριος
  choice: 有福
  rationale: “有福”保留耶稣宣告中宗教与盟约性的分量；“快乐”过于侧重情绪，“幸运”则偏世俗。
- source_word: ὃς ἐὰν μή
  choice: 凡不……的人
  rationale: 以现代汉语自然表达带一般条件意味的单数关系结构，指任何符合这一情形的人。
- source_word: σκανδαλισθῇ
  choice: 跌倒
  rationale: 保留原文的绊跌意象及被动意味所涉及的受阻、失足，同时不把含义局限为情绪上的“反感”，也不直接断定为彻底背弃信仰。
- source_word: ἐν ἐμοί
  choice: 因我而
  rationale: 这里表示耶稣成为绊跌的缘由或契机；“因我而”在现代汉语中自然，也准确保留原文指向耶稣本人的张力。
theological_decisions:
- issue: 如何表达因耶稣而受绊跌的警告
  choice: 保留“跌倒”的比喻，并译作“不因我而跌倒”
  alternative: “不对我反感”或“不因我而背弃信仰”
  rationale: 原句既可涉及对耶稣产生抵触，也可能包含更严重的信仰失足。“跌倒”保留这一范围和神学张力，不将其弱化为单纯不满，也不将其完全解释为离弃信仰。
translation_notes:
  register: 采用简洁、庄重而通俗的现代标准汉语。“凡……的人有福了”符合福语体裁；“因我而跌倒”既自然，又保留原文意象。句首 καί 在汉语独立经节中不机械译作“并且”，以免语气生硬。
