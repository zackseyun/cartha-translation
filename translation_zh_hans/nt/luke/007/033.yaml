  naturalness: “他有鬼附着”不合现代标准汉语的通常搭配；“附着”通常表示某物黏附于某处，不能自然表达鬼附身。改为“他有鬼”简洁、庄重，并贴近原文；以脚注提供更符合现代汉语的解释性表达。
  terminology: “施洗者约翰”可接受，且准确对应ὁ βαπτιστής。“鬼”对应δαιμόνιον；不应改为原文未使用的“污灵”。保留“鬼”而非直接正文译作“被鬼附着”，可维持原文“有”的表达方式。
