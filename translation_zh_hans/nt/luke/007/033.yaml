  rationale: 仅修正末句不自然的汉语表达。正文采用“他有鬼”，紧贴Δαιμόνιον ἔχει的措辞和指控语气；脚注给出“他被鬼附着”的现代汉语解释性译法。以分号分隔约翰的生活方式与听众的回应，使语义关系更清楚，未改变经文含义。
