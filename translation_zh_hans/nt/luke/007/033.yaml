  text: ἐλήλυθεν γὰρ Ἰωάννης ὁ βαπτιστὴς ⸀μὴ ⸂ἐσθίων ἄρτον μήτε πίνων οἶνον⸃, καὶ λέγετε· Δαιμόνιον ἔχει·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/033.yaml
  text: For John the Baptist has come eating no bread and drinking no wine[a], and you say, ‘He has a demon.’
translation:
  language: zh_hans
  text: 因为施洗者约翰来了，不吃饼，也不喝酒；你们却说：‘他有鬼[a]。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他被鬼附着。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλήλυθεν
  choice: 来了
  rationale: 希腊文完成时强调约翰已经来到及其持续相关性；汉语用“来了”自然表达这一语境效果。
- source_word: γὰρ
  choice: 因为
  rationale: 承接上文并说明缘由；现代汉语中“因为”比句首“原来”更直接清楚。
- source_word: Ἰωάννης ὁ βαπτιστὴς
  choice: 施洗者约翰
  rationale: βαπτιστής指施行洗礼的人；“施洗者约翰”既透明，又是现代中文圣经语体中易懂的称谓。
- source_word: μὴ ἐσθίων ἄρτον μήτε πίνων οἶνον
  choice: 不吃饼，也不喝酒
  rationale: 保留ἄρτον“饼”的具体意象，不泛化为“食物”；用“不……也不……”自然再现并列否定。
- source_word: λέγετε
  choice: 你们却说
  rationale: 现在时描述听众一贯的反应；加入“却”明确表现约翰禁欲行为与众人指控之间的反差，此反差由语境支持。
- source_word: Δαιμόνιον ἔχει
  choice: 他有鬼附着
  rationale: 直译“他有鬼”在现代汉语中可能被理解为心怀鬼胎或行为古怪；“有鬼附着”保留“有”的表达结构，同时清楚传达被邪灵附身的指控。
theological_decisions:
- issue: δαιμόνιον在针对约翰的指控中如何翻译
  choice: 鬼
  alternative: 污灵
  rationale: 原文使用δαιμόνιον，而不是“污灵”这一相关但不同的表达，因此不将术语协调为“污灵”。
- issue: Δαιμόνιον ἔχει是否译成状态式表达
  choice: 他有鬼附着
  alternative: 他被鬼附了
  rationale: 所选译法较贴近原文“有鬼”的措辞，同时借“附着”消除现代汉语歧义；备选译法更口语、更明确，但进一步转化为被动状态。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式简洁，保留“饼”和“酒”的具体措辞，并让末尾指控听来自然而严肃。
