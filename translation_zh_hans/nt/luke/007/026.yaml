  text: ἀλλὰ τί ⸀ἐξήλθατε ἰδεῖν; προφήτην; ναί, λέγω ὑμῖν, καὶ περισσότερον προφήτου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/026.yaml
  text: But what did you go out to see? A prophet? Yes[a], I tell you, and more than a prophet.
translation:
  language: zh_hans
  text: 可是，你们出去究竟要看什么？一位先知吗？是的，我告诉你们，而且他不只是先知[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“而且他比先知更大。”原文采用比较表达；正文“不只是先知”以自然汉语表达其身份不止于先知，未界定其超越之处。
    reason: 保留原文比较表达的可行替代译法，并说明正文译法没有扩展本节未明说的含义。
lexical_decisions:
- source_word: ἀλλὰ
  choice: 可是
  rationale: 承接上文的反问并形成转折；“可是”符合现代汉语口吻，又保留原文的对比作用。
- source_word: τί
  choice: 什么
  rationale: 作“出去看”的宾语，所问的是对象，而不是出去的原因。
- source_word: ἐξήλθατε
  choice: 你们出去
  rationale: 保留第二人称复数和已经发生的外出行动；汉语问句无须另加过去时助词。
- source_word: ἰδεῖν
  choice: 要看
  rationale: 表达出去的目的；“要看”在这一连续反问中自然、清楚。
- source_word: προφήτην
  choice: 一位先知
  rationale: 这是普通名词，并以省略句构成反问；量词“位”符合对人的尊称和现代汉语习惯。
- source_word: ναί
  choice: 是的
  rationale: 直接肯定前面的反问，保留原文明确而有力的语气。
- source_word: λέγω ὑμῖν
  choice: 我告诉你们
  rationale: 自然呈现福音书中常见的郑重宣告句式，并保留直接对听众说话的形式。
- source_word: καὶ περισσότερον προφήτου
  choice: 他不只是先知
  rationale: 原文比较表达直译近似“比先知更多”，意指约翰的身份或使命不止于一般先知。“不只是先知”是自然汉语，同时不具体界定其超越之处。
theological_decisions:
- issue: 耶稣对施洗约翰身份与地位的描述
  choice: 译为“他不只是先知”，确认约翰是先知，同时表明他的身份或使命超出一般先知。
  alternative: 译为“他比先知更大”或直接说明他是末世的使者。
  rationale: 本节只作简洁的比较，并未在此处说明“更多”或“更大”的具体性质；译文不提前引入下文的解释，也不把比较绝对化为“最大的先知”。
translation_notes:
  register: 采用现代、庄重而口语自然的普通话。用“究竟”加强连续反问的追问语气；补出隐含主语“他”，避免汉语末句生硬，同时不增添约翰优越性的具体神学解释。
