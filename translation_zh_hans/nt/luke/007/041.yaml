revisions:
- from: “有两个人欠某个放债人的钱：一个欠五百个第纳尔[a]，另一个欠五十个。”
  to: “有两个人欠一个放债人的钱：一个欠五百枚第纳尔[a]，另一个欠五十枚第纳尔。”
  rationale: 修订货币量词并在第二个金额处补出“第纳尔”，使汉语完整自然，同时维持原文所表达的债务关系、人物不定性和金额对比。“一个放债人”比“某个放债人”更符合现代汉语叙事。脚注保留文化说明，并以约略措辞避免将历史购买力或工资关系绝对化。
