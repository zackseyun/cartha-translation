base_translation:
  language: en
  yaml_path: translation/nt/luke/007/041.yaml
  text: 'Two debtors owed a certain moneylender: one owed five hundred denarii[a], and the other fifty.'
translation:
  language: zh_hans
  text: “有两个人欠一个放债人的钱：一个欠五百枚第纳尔[a]，另一个欠五十枚第纳尔。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 第纳尔是当时通行的一种罗马银币，常被认为约相当于一个劳工一天的工资。
    reason: cultural_note
lexical_decisions:
- source_word: χρεοφειλέται
  choice: 欠钱的人
  rationale: 该词指负有债务的人；结合后文“欠……第纳尔”，译作“欠……钱”自然清楚。
- source_word: δανιστῇ τινι
  choice: 某个放债人
  rationale: δανιστής特指借钱给别人的人，τινι表示故事中某个未具名的人；“某个放债人”既准确又符合现代汉语。
- source_word: ὤφειλεν
  choice: 欠
  rationale: 未完成时在此陈述当时持续存在的债务关系，汉语用“欠”即可自然表达。
- source_word: δηνάρια
  choice: 第纳尔
  rationale: 保留特定的古罗马货币单位，不将其直接换算为现代货币或笼统译成银币；文化背景置于脚注说明。
- source_word: πεντακόσια
  choice: 五百个
  rationale: 忠实表达数目，并以量词“个”连接音译货币单位，便于现代读者理解。
- source_word: ὁ δὲ ἕτερος
  choice: 另一个
  rationale: 与前面的“一个”构成自然的汉语对举。
- source_word: πεντήκοντα
  choice: 五十个
  rationale: 原文承前省略δηνάρια；汉语同样可省略单位，译为“欠五十个”，意思清楚且保留原文简洁结构。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“某个”对应不定代词τινι；保留“第纳尔”这一历史货币名称，并用脚注交代其大致价值。
