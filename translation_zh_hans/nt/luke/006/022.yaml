language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Μακάριοί ἐστε ὅταν μισήσωσιν ὑμᾶς οἱ ἄνθρωποι, καὶ ὅταν ἀφορίσωσιν ὑμᾶς καὶ ὀνειδίσωσιν καὶ ἐκβάλωσιν τὸ ὄνομα ὑμῶν ὡς πονηρὸν ἕνεκα τοῦ υἱοῦ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/022.yaml
  text: Blessed are you when people hate you[a], and when they exclude you and insult you and reject your name as evil because of the Son of Man.
translation:
  language: zh_hans
  text: “当人们因人子的缘故恨你们，排斥你们，辱骂你们，又弃绝你们的名，认为它是邪恶的[a]时候，你们有福了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“弃掉你们的名，如同（弃掉）邪恶之物”。这可能指公开斥责、否定或摒弃你们，把你们视为邪恶的人；原文未明确具体的社会方式。
    reason: 说明“弃绝你们的名，认为它是邪恶的”这一罕见表达所保留的字面意象及其可能含义，避免将其限定为诽谤、除名或逐出特定群体。
lexical_decisions:
- source_word: Μακάριοί
  choice: 有福了
  rationale: 沿用汉语祝福语体，既自然易懂，也保留登山宝训式宣告的神学分量；“快乐”过于侧重主观感受。
- source_word: ὅταν
  choice: 当……的时候
  rationale: 与虚拟语气连用，表示不确定而可能反复发生的处境；此译法符合现代汉语表达。
- source_word: μισήσωσιν
  choice: 恨
  rationale: 直接表达敌意和仇恨，力度与受逼迫的语境相称。
- source_word: οἱ ἄνθρωποι
  choice: 人
  rationale: 原词在此泛指社会上的人，并非专指男性；汉语“人”简洁且性别准确。
- source_word: ἀφορίσωσιν
  choice: 排斥
  rationale: 在本段语境中指将门徒排除在群体交往之外；“排斥”比字面的“分开”更自然，又不过度限定具体机制。
- source_word: ὀνειδίσωσιν
  choice: 辱骂
  rationale: 表达带羞辱性质的言语攻击，符合原词所指的责骂、侮辱。
- source_word: ἐκβάλωσιν τὸ ὄνομα ὑμῶν
  choice: 把你们的名……弃绝
  rationale: 保留原文“丢弃、赶出你们的名”这一具体而不寻常的意象，同时用“弃绝”使现代读者能够理解其公开否定或摒弃之意。
- source_word: ὡς πονηρὸν
  choice: 当作恶名
  rationale: 保留ὡς所表达的认定或看待方式，以及πονηρός的道德判断；“恶名”也与前面的“你们的名”形成自然衔接。
- source_word: ἕνεκα
  choice: 为……的缘故
  rationale: 准确表达原因；将原因短语前置，可自然地统摄后面一连串敌对行为。
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: 人子
  rationale: 采用福音书中这一称号的通行汉译，保留其固定称谓及与相关经文的互文联系。
theological_decisions:
- issue: ἐκβάλωσιν τὸ ὄνομα ὑμῶν ὡς πονηρόν这一习语的译法
  choice: 正文译为“把你们的名当作恶名而弃绝”
  alternative: 公开斥责你们是恶人；把你们的名声当作邪恶的而摒弃
  rationale: 原句可能指公开否定门徒，把他们视为邪恶或败坏的人。正文保留“名”的意象和表达上的张力，脚注说明其社会性含义，而不把具体方式限定为诽谤、除名或逐出某一特定团体。
- issue: οἱ ἄνθρωποι的泛指含义
  choice: 译为“人”
  alternative: 众人；世人；男人
  rationale: 这里泛指敌对门徒的人群，不限于男性；“人”避免增加原文没有的普遍性或性别限制。
- issue: τοῦ υἱοῦ τοῦ ἀνθρώπου的称号
  choice: 译为“人子”
  alternative: 那位属人的；人的那一位
  rationale: “人子”保留耶稣这一自称在福音书中的固定用法及其可能的经文回响，不以解释性称呼取代原文。
- issue: ἕνεκα短语的管辖范围
  choice: 将“为人子的缘故”前置，使之自然关联全部敌对行为
  alternative: 置于句末，可能仅就近关联“弃绝你们的名”
  rationale: 原文把原因短语置于整串行为之后，语义上自然说明整场逼迫的缘由；汉语前置能清楚表达这一范围，同时不添加新的因果内容。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句首以原因短语统摄四个并列动作，末尾用“你们有福了”形成郑重的福分宣告。正文保留“你们的名”这一略显突出的原文意象，并以脚注辅助理解。
