  text: Ἐγένετο δὲ ἐν ⸀σαββάτῳ διαπορεύεσθαι αὐτὸν ⸀διὰ σπορίμων, καὶ ἔτιλλον οἱ μαθηταὶ αὐτοῦ ⸂καὶ ἤσθιον τοὺς στάχυας⸃ ψώχοντες ταῖς χερσίν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/001.yaml
  text: It happened on a Sabbath that he was passing through grainfields[a], and his disciples were plucking and eating the heads of grain[b], rubbing them in their hands.
translation:
  language: zh_hans
  text: 有一个安息日，耶稣从庄稼地间经过。他的门徒掐下谷穗[a]，用手搓着吃[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “谷穗”指谷类植物结籽的穗；原文没有说明具体是哪一种谷物。
    reason: lexical_clarification
  - marker: b
    text: 他们用手搓谷穗，是为了使可吃的籽粒脱落出来。
    reason: cultural_note
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: 有一个
  rationale: 这是路加常用的叙事引入语；结合ἐν σαββάτῳ，译为“有一个安息日”自然地引出事件，也保留了不定指的意味，无须机械译出连接词δέ。
- source_word: ἐν σαββάτῳ
  choice: 一个安息日
  rationale: 名词前无冠词，语境指某一个安息日，而非先前已经特指的安息日。
- source_word: διαπορεύεσθαι αὐτὸν διὰ σπορίμων
  choice: 耶稣从麦田间经过
  rationale: 将ἐγένετο后的不定式结构自然转换为汉语有限分句；“麦田”在汉语中是对种植谷物田地的通顺概括，不限定具体麦种。明确译出“耶稣”以避免汉语代词指向含混。
- source_word: ἔτιλλον
  choice: 掐下
  rationale: 表达从植株上摘取麦穗的持续动作；汉语叙事中无需用“正在”强行标示未完成体。
- source_word: τοὺς στάχυας
  choice: 麦穗
  rationale: στάχυας指谷类植物结籽的穗部；“麦穗”简洁、现代且符合上下文。
- source_word: καὶ ἤσθιον
  choice: 吃
  rationale: 与“掐下”和“搓着”共同描写持续、相伴的动作，现代汉语用连动结构最自然。
- source_word: ψώχοντες ταῖς χερσίν
  choice: 用手搓着
  rationale: 保留分词所描写的具体动作，并以“着”表达与吃同时进行的过程。
theological_decisions: []
