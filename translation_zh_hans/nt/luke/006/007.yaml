  text: ⸀παρετηροῦντο ⸀δὲ οἱ γραμματεῖς καὶ οἱ Φαρισαῖοι εἰ ἐν τῷ σαββάτῳ ⸀θεραπεύει, ἵνα εὕρωσιν ⸀κατηγορεῖν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/007.yaml
  text: And the scribes and the Pharisees were watching him closely to see whether he would heal on the Sabbath[b][a], so that they might find grounds to accuse him.
translation:
  language: zh_hans
  text: 文士和法利赛人密切监视耶稣，要看他是否会在安息日医治人，好找把柄控告他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “找把柄控告他”也可译作“找机会控告他”或“找到控告他的理由”。
    reason: lexical_alternative
lexical_decisions:
- source_word: παρετηροῦντο
  choice: 密切监视耶稣
  rationale: 未完成时表示持续的观察；结合后面的控告目的，此处带有敌意审视的意味。“耶稣”由上下文补出，使中文指向清楚。
- source_word: γραμματεῖς
  choice: 文士
  rationale: 这是福音书叙事中通行且简洁的对应词，也保留其历史群体称谓。
- source_word: Φαρισαῖοι
  choice: 法利赛人
  rationale: 采用现代中文圣经中通行的群体名称。
- source_word: εἰ
  choice: 看……是否
  rationale: 在观察类动词之后引出间接疑问，译成“看……是否”符合现代汉语习惯。
- source_word: ἐν τῷ σαββάτῳ
  choice: 在安息日
  rationale: 自然表达时间，同时保留希腊文单数形式。
- source_word: θεραπεύει
  choice: 会……治病
  rationale: 间接疑问中的现在时按叙事视角自然译为“会”，指他们等着看耶稣是否实施医治。
- source_word: ἵνα εὕρωσιν κατηγορεῖν αὐτοῦ
  choice: 好找把柄控告他
  rationale: ἵνα表示目的；“找把柄”自然传达寻找控告依据或机会的含义，但不额外指定控告的法律形式。
theological_decisions:
- issue: 反对者观察耶稣的意图
  choice: 以“密切监视”和“好找把柄控告他”表明有意的敌对审视
  alternative: 较中性地译为“仔细观察”，并译作“好控告他”
  rationale: παρατηρέω本身可指仔细观察，而目的从句明确显示他们意在控告；译文呈现这种敌意，但不扩展为更广泛的宗教或政治动机。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“密切监视”比“仔细观察”更能结合上下文体现敌意；“找把柄”通俗易懂，但仍适合叙事语体。脚注保留原文表达在“依据、机会、控告”之间的语义空间。
