  text: Ἐγένετο δὲ ἐν ταῖς ἡμέραις ταύταις ⸂ἐξελθεῖν αὐτὸν⸃ εἰς τὸ ὄρος προσεύξασθαι, καὶ ἦν διανυκτερεύων ἐν τῇ προσευχῇ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/012.yaml
  text: It happened in those days that he went out to the mountain to pray[a], and he spent the whole night in prayer to God.
translation:
  language: zh_hans
  text: 在那些日子里，有一天，他出去，到山上祷告；他整夜都在向神祷告[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他彻夜向神祷告。”
    reason: 说明ἦν διανυκτερεύων的持续性；此译法保留“度过整夜”的含义，避免“不息”所可能附加的毫无间断之意。
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: 有一天
  rationale: 这是路加常用的叙事推进表达；结合“在那些日子里”，译作“有一天”自然引入事件，并以句式承载 δέ 的轻微承接作用，不另加原文没有的“现在”。
- source_word: ἐν ταῖς ἡμέραις ταύταις
  choice: 在那些日子里
  rationale: 按现代汉语叙事习惯指向上下文所述的那段时期，同时保留原文的时间框架。
- source_word: ἐξελθεῖν αὐτὸν
  choice: 他出去
  rationale: 将 ἐγένετο 后的宾格加不定式自然转换为汉语有限谓语；“出去”保留 ἐξέρχομαι 的移动含义。
- source_word: εἰς τὸ ὄρος
  choice: 上山
  rationale: ὄρος 指山或山地；在汉语中，“出去上山”比“出去到那座山”更自然，也不无根据地指定某一座已知的山。
- source_word: προσεύξασθαι
  choice: 祷告
  rationale: 在移动动词之后表达目的，译作“上山祷告”简洁自然。
- source_word: ἦν διανυκτερεύων
  choice: 整夜
  rationale: 该结构表达持续经过整个夜晚；“整夜”准确而自然地呈现其延续性。
- source_word: ἐν τῇ προσευχῇ τοῦ θεοῦ
  choice: 向神祷告
  rationale: 此处属格在语境中表示祷告所指向的对象；“向神祷告”既符合现代汉语，也避免“神的祷告”可能造成的误解。
theological_decisions:
- issue: τοῦ θεοῦ 与耶稣祷告之间的关系
  choice: 向神祷告
  alternative: 神的祷告／属于神的祷告
  rationale: 上下文描述“他”祷告，而神是祷告所指向的对象。此译法保留耶稣向神祷告这一文本陈述，不在正文中额外指明“父”，也不加入进一步的教义解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留两次“祷告”，以反映原文先说明上山的目的、再叙述整夜持续祷告的结构；代词“他”也按原文保留，由上下文确定所指。
