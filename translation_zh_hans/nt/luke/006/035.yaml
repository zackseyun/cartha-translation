  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: πλὴν ἀγαπᾶτε τοὺς ἐχθροὺς ὑμῶν καὶ ἀγαθοποιεῖτε καὶ δανίζετε μηδὲν ἀπελπίζοντες· καὶ ἔσται ὁ μισθὸς ὑμῶν πολύς, καὶ ἔσεσθε υἱοὶ Ὑψίστου, ὅτι αὐτὸς χρηστός ἐστιν ἐπὶ τοὺς ἀχαρίστους καὶ πονηρούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/035.yaml
  text: But love your enemies[a], and do good, and lend, expecting nothing in return; and your reward will be great, and you will be sons of the Most High[b], because he is kind to the ungrateful and evil.
translation:
  language: zh_hans
  text: 然而，你们要爱你们的仇敌，要行善，要借给人，不指望收回什么[a]；你们的赏赐必定丰厚，你们也将成为至高者的儿子[b]，因为他善待忘恩负义的人和恶人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不对任何人绝望”或“永不失去盼望”。希腊语 μηδὲν ἀπελπίζοντες 的意思较难确定；按这里的上下文，正文理解为借出时不期待偿还或回报。
    reason: lexical_alternative
  - marker: b
    text: “儿子”译自希腊语的阳性复数；这里也可以具有代表性的含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: 然而
  rationale: 承接上文并形成鲜明转折；“然而”自然、庄重，也保留了原文的转折力度。
- source_word: ἀγαπᾶτε τοὺς ἐχθροὺς ὑμῶν
  choice: 你们要爱仇敌
  rationale: 直接保留命令语气和“仇敌”一词的冲击力，不弱化为“对手”等较轻的说法。
- source_word: ἀγαθοποιεῖτε
  choice: 善待人
  rationale: 表达主动向人行善的含义；在现代汉语中比孤立的“行善”更顺畅，并与并列命令相协调。
- source_word: δανίζετε
  choice: 借给人
  rationale: 保留“借出”的动作，不擅自限定所借的是钱。
- source_word: μηδὲν ἀπελπίζοντες
  choice: 不指望收回什么
  rationale: 在借贷与不求互惠的上下文中，理解为不期待偿还或回报最为贴切；因希腊语短语存在释义困难，另在脚注保留其他可能。
- source_word: μισθὸς ὑμῶν πολύς
  choice: 你们的赏赐就必丰厚
  rationale: “赏赐”适合伦理及末世性的回报语境；“丰厚”自然表达 πολύς 所指的重大、丰富。
- source_word: υἱοὶ Ὑψίστου
  choice: 至高者的儿子
  rationale: 保留 υἱοί 明确的阳性复数用词；汉语在“成为……的儿子”这一表语结构中无需强加不自然的“们”，其代表性范围以脚注说明。
- source_word: χρηστός
  choice: 以仁慈待
  rationale: 将形容词的关系结构自然转化为现代汉语，突出上帝对不配之人的仁厚善待。
- source_word: τοὺς ἀχαρίστους καὶ πονηρούς
  choice: 忘恩负义的人和恶人
  rationale: 分别清楚呈现“忘恩负义”与“邪恶”两个描述，不淡化后者的道德力度。
theological_decisions:
- issue: υἱοὶ Ὑψίστου 是否采用性别中性表达
  choice: 至高者的儿子
  alternative: 至高者的儿女
  rationale: 原文使用明确的阳性复数 υἱοί，因此正文保留“儿子”；同时以脚注说明此称谓在这里可以具有代表性，避免误解为应许只限男性。
- issue: 借贷命令中 μηδὲν ἀπελπίζοντες 的解释
  choice: 不指望收回什么
  alternative: 不对任何人绝望；永不失去盼望
  rationale: 紧邻的语境谈到借贷以及超越互惠原则，故正文采用不期待偿还的理解；原短语确有词义和句法上的解释难点，因此不将其他理解静默排除，而在脚注列明。
- issue: “成为至高者的儿子”所表达的关系
  choice: 保留原文将行为相似性与儿子身份并置的张力
  alternative: 意译为“显明你们是至高者的儿女”
  rationale: 希腊语使用将来式 ἔσεσθε“你们将成为／将是”，正文不增添“显明”等解释性词语，以免预先解决身份、品格相似与末世应许之间的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“仇敌”“赏赐”“至高者”等词保留经文应有的力度与宗教语域；句式尽量自然，避免文言化。脚注标记紧随其实际说明的词句。
