base_translation:
  language: en
  yaml_path: translation/nt/luke/006/005.yaml
  text: And he was saying to them[a], “The Son of Man is Lord of the Sabbath.”
translation:
  language: zh_hans
  text: 他对他们说：“人子是安息日的主[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“人子是掌管安息日的主。”
    reason: 词义与句法上的可选表达；该译法将κύριος与属格τοῦ σαββάτου所表达的权柄关系说得更明确。
lexical_decisions:
- source_word: καὶ ἔλεγεν αὐτοῖς
  choice: 他又对他们说
  rationale: καί承接上文，译作“又”符合现代汉语叙事；ἔλεγεν虽为未完成时，但在这一具体言说场景中，汉语用“说”最自然，不必生硬地译成“正在说”。αὐτοῖς直译为“对他们”。
- source_word: Κύριος
  choice: 主
  rationale: 此处表示权柄与主权，并具有基督论分量；“主”既简洁庄重，也与该称号在新约中的通常译法一致。
- source_word: τοῦ σαββάτου
  choice: 安息日的
  rationale: 保留希腊语属格的紧凑表达，与“主”连用，表示人子对于安息日所具有的权柄；不额外加入原文没有明说的“甚至”。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人子
  rationale: 采用现代中文圣经读者熟悉的固定称号，保留其闪语背景、耶稣的自称用法及与《但以理书》传统可能存在的互文联系。
theological_decisions:
- issue: 人子与安息日之关系所表达的基督论含义
  choice: 人子是安息日的主
  alternative: 人子是掌管安息日的主
  rationale: 正文保留原文“主＋属格”的简洁结构，直接宣告人子对安息日拥有主权；备选译法将这种权柄关系表达得更明白，但解释性较强。
translation_notes:
  register: 采用自然、庄重而简洁的现代标准汉语。“安息日”沿用通行且易懂的圣经术语；全句避免添加“甚至”等解释性成分，以保留原文措辞的力度与简约。
