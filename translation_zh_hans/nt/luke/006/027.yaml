  text: Ἀλλὰ ὑμῖν λέγω τοῖς ἀκούουσιν, ἀγαπᾶτε τοὺς ἐχθροὺς ὑμῶν, καλῶς ποιεῖτε τοῖς μισοῦσιν ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/027.yaml
  text: 'But I say to you who are listening: love your enemies[a]; do good to those who hate you,'
translation:
  language: zh_hans
  text: “但是，我对你们这些正在听的人[a]说：要爱你们的仇敌，善待恨你们的人。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“听的人”。希腊文的现在分词也可作较形式化的译法；“正在听的人”在此语境中表达其进行意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀλλὰ
  choice: 可是
  rationale: 承接上文形成鲜明转折；“可是”在现代汉语中自然、简洁，同时保留原文的对比力度。
- source_word: ὑμῖν λέγω
  choice: 我对你们……说
  rationale: 保留第一人称宣告和对复数听众的直接称呼，并按现代汉语语序自然表达。
- source_word: τοῖς ἀκούουσιν
  choice: 你们这些听的人
  rationale: 保留现在分词所指正在听耶稣话语的人，也避免把“听”解释性地强化为“听从”。
- source_word: ἀγαπᾶτε
  choice: 要爱
  rationale: “爱”直接对应词义；加“要”清楚表达复数命令语气。
- source_word: τοὺς ἐχθροὺς ὑμῶν
  choice: 你们的仇敌
  rationale: 直接保留宾语和所属关系；“仇敌”庄重而易懂，也不把范围缩限为某一类敌对者。
- source_word: καλῶς ποιεῖτε
  choice: 善待
  rationale: 自然概括“行善于、对……做好事”的惯用含义，保留实际行动的要求，且适合其后所接的人。
- source_word: τοῖς μισοῦσιν ὑμᾶς
  choice: 恨你们的人
  rationale: 直译 μισέω 的强烈含义，不弱化为“不喜欢”或“敌视”。
theological_decisions:
- issue: 对敌对者的伦理命令
  choice: 将两个命令直接译为“要爱……善待……”，不添加限制条件
  alternative: 把命令限定为只适用于私人仇敌，或将其处理为修辞性夸张
  rationale: 希腊文使用直接的第二人称复数命令式，措辞本身没有明示范围限制；译文应保留其尖锐而普遍的伦理要求，不预先解决后续解释争议。
- issue: “听”的含义
  choice: 译作“听的人”，保留听见与留心聆听之间的语义张力
  alternative: 译作“听从的人”
  rationale: ἀκούω 可随语境涉及听见、聆听或听从，但此处译成“听从”会把回应性的含义明确化，超出原文在本句中的明说程度。
translation_notes:
  register: 采用现代、庄重而口语可懂的普通话。“你们这些听的人”略带讲论语体，保留耶稣对现场听众的直接点名；句末按单节出版体例使用句号。
