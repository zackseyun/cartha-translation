id: LUK.6.4
reference: Luke 6:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ⸀ὡς εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ καὶ τοὺς ἄρτους τῆς προθέσεως ⸀λαβὼν ἔφαγεν καὶ ⸀ἔδωκεν τοῖς μετ’ αὐτοῦ, οὓς οὐκ ἔξεστιν φαγεῖν εἰ μὴ μόνους τοὺς ἱερεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/004.yaml
  text: how he entered into the house of God[a], and took and ate the bread of the Presence, and gave some to those with him—which it is not lawful to eat except for the priests alone?
translation:
  language: zh_hans
  text: 他怎样进入上帝的殿，拿了陈设饼[a]吃，又分给和他在一起的人；这些饼除了祭司以外，别人都不可吃？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“陈列的饼”，指陈设在上帝面前的圣饼。
    reason: 说明ἄρτους τῆς προθέσεως的字面含义及其礼仪所指。
lexical_decisions:
- source_word: ὡς
  choice: 怎样
  rationale: 在承接上一节“你们没有读过吗”的间接问句中，引出大卫所做之事的具体经过；“怎样”自然保留了原文的表达方式。
- source_word: εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ
  choice: 进入上帝的殿
  rationale: “进入”体现动词及方向介词；οἶκος τοῦ θεοῦ按其敬拜场所的语境译为“上帝的殿”，比“上帝的家”更不易被误解为上帝的家庭，同时未具体化为后来耶路撒冷圣殿。
- source_word: ἄρτους τῆς προθέσεως
  choice: 陈设饼
  rationale: 指陈设在上帝面前的圣饼。“陈设饼”是简洁且通行的礼仪用语，并以脚注解释其字面含义。
- source_word: λαβὼν ἔφαγεν
  choice: 拿了……吃
  rationale: 用连续动作自然表达分词与主要动词的先后关系，不使中文句式生硬。
- source_word: καὶ ἔδωκεν τοῖς μετ’ αὐτοῦ
  choice: 又分给跟随他的人
  rationale: “又”表达καί的递进连接；“分给”符合把饼给多人食用的汉语习惯，“跟随他的人”保留“与他同在的人”的开放指称。
- source_word: οὓς οὐκ ἔξεστιν φαγεῖν
  choice: 这饼……别人都不可吃
  rationale: 关系代词回指复数的饼；汉语以“这饼”作主题更清楚。“不可”在上下文中表达律法上的不许可。
- source_word: εἰ μὴ μόνους τοὺς ἱερεῖς
  choice: 除了祭司以外
  rationale: 结合“别人都不可吃”，完整保留“唯独祭司”的排他含义，同时避免累赘地重复“只有”。
theological_decisions:
- issue: 圣饼所受的礼仪与律法限制
  choice: 这饼除了祭司以外，别人都不可吃
  alternative: 这饼只准祭司吃
  rationale: 此译明确呈现法律和礼仪层面的禁止，而非一般习俗；同时保留耶稣论证所依赖的张力，没有补入大卫行为是否合法的解释。
- issue: “上帝的殿”在大卫故事中的所指
  choice: 上帝的殿
  alternative: 上帝的家／上帝的圣所
  rationale: 保留οἶκος τοῦ θεοῦ作为上帝敬拜居所的表达，但不擅自把它限定为后来固定建筑意义上的耶路撒冷圣殿。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“陈设饼”保留经文的礼仪色彩，并用脚注帮助普通读者理解；全句保留承接上一节的反问语气。
