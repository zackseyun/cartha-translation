  text: ⸀καὶ ἐὰν ἀγαθοποιῆτε τοὺς ἀγαθοποιοῦντας ὑμᾶς, ποία ὑμῖν χάρις ἐστίν; ⸁καὶ οἱ ἁμαρτωλοὶ τὸ αὐτὸ ποιοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/033.yaml
  text: And if you do good to those who do good to you[a], what credit is that to you? Even sinners do the same.
translation:
  language: zh_hans
  text: 你们若善待那些善待你们的人，你们有什么功劳呢？[a]罪人也这样做。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “功劳”所译的希腊词也可表示“恩典”、“恩惠”或“感谢”；这里指因互惠的善待而得到的认可、称许或功劳。
    reason: 说明 χάρις 的词义范围，并交代其在本节互惠行为语境中的意思。
lexical_decisions:
- source_word: ἀγαθοποιῆτε / ἀγαθοποιοῦντας
  choice: 善待／善待……的人
  rationale: 这个动词表示行善、使人得益。译作“善待”自然简洁，并在主句与分词结构中保留原文的词语呼应。
- source_word: ποία ... χάρις
  choice: 有什么可称许的
  rationale: 这里的 χάρις 是在互惠行为的语境中，指可得的认可或称许；这样翻译既符合反问语气，也避免让读者误以为此处专指救恩意义上的“恩典”。
- source_word: ὑμῖν
  choice: 你们有什么
  rationale: 将与 χάρις 搭配的与格按现代汉语习惯融入“你们有什么可称许的”之中，表达称许归于听者的意思。
- source_word: ἁμαρτωλοὶ
  choice: 罪人
  rationale: 这是对原词直接而通行的翻译，保留路加福音中该词所具有的道德及社会宗教含义。
- source_word: τὸ αὐτὸ ποιοῦσιν
  choice: 也这样做
  rationale: 准确、自然地表达“做同样的事”；“这样”清楚回指前面的互惠善行。
- source_word: καὶ
  choice: 若／也
  rationale: 句首 καὶ 承接前文，在汉语中不必机械译作“并且”，由“若”引出并列条件句即可；第二个 καὶ 译作“也”，突出连罪人都采取同样做法。
theological_decisions:
- issue: 伦理教导语境中 χάρις 的含义
  choice: 可称许之处
  alternative: 恩典、恩惠或感谢
  rationale: 本节的反问着眼于只对善待自己的人行善，能否因此得到认可，并非直接论述救恩中的恩典。正文采用语境义，同时用脚注保留该词较宽的语义范围。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“善待”比“行善于”自然，又能同时表达行好事和使人得益。“有什么可称许的呢”保留原文反问的力度。脚注标记紧随其所解释的问句。
