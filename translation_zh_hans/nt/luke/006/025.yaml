  text: οὐαὶ ὑμῖν, οἱ ἐμπεπλησμένοι ⸀νῦν, ὅτι πεινάσετε. ⸀οὐαί, οἱ γελῶντες νῦν, ὅτι πενθήσετε καὶ κλαύσετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/025.yaml
  text: Woe to you who are full now[a], because you will be hungry. Woe to you who are laughing now[b], because you will mourn and weep.
translation:
  language: zh_hans
  text: 如今饱足的你们有祸了，因为你们将要挨饿[a]！如今欢笑的你们有祸了，因为你们将要哀恸、哭泣！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们将要饥饿。”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐαί
  choice: 有祸了
  rationale: 保留先知性警告和审判意味，同时采用现代汉语中清楚、庄重的表达；不弱化为单纯的同情或感叹。
- source_word: ἐμπεπλησμένοι
  choice: 饱足的人
  rationale: 该完成时分词强调因已经吃饱而处于饱足状态；“饱足”具体、简洁，并与后文的“饥饿”形成鲜明对照。
- source_word: νῦν
  choice: 如今
  rationale: 保留当前处境与将来逆转之间的时间对照；“如今”比“现在”略显庄重而仍属现代常用语。
- source_word: πεινάσετε
  choice: 你们将要饥饿
  rationale: 保留将来时所表达的未来匮乏，与当前的“饱足”平行对照；措辞不进一步界定其发生方式。
- source_word: γελῶντες
  choice: 欢笑的人
  rationale: 直接表达目前正在笑的状态，不扩大解释为一般性的喜乐，也不预先赋予道德评价。
- source_word: πενθήσετε
  choice: 哀恸
  rationale: 传达沉重的悲哀和哀悼意味，并与后面的实际哭泣保持语义区别。
- source_word: κλαύσετε
  choice: 哭泣
  rationale: 表达外显的流泪哀哭，与“哀恸”共同形成递进而不合并两个动词。
- source_word: ὅτι
  choice: 因为
  rationale: 清楚表达祸患宣告与未来逆转之间的原因或根据关系，符合现代汉语习惯。
theological_decisions:
- issue: 祸患宣告的性质
  choice: 对现今饱足、安逸之人将来遭遇逆转与审判的先知性警告
  alternative: 只是对人生境遇变迁的社会性观察
  rationale: 重复的οὐαί、两个将来时动词以及与上下文福辞的平行关系，都表明这不只是中性的世事观察。译文保留警告和未来逆转的力度，却不超出经文说明逆转的具体机制。
- issue: οὐαί兼具谴责与哀叹的语气
  choice: 正文采用“有祸了”，突出警告和审判意味
  alternative: 译作“唉”或“可叹啊”，突出哀叹意味
  rationale: 原词可承载祸患宣告及哀叹色彩；正文保留本段先知性警告的主调，脚注则注明较偏哀叹的译法，以免抹去原文的语气张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“你们这些……的人有祸了”保留两句平行结构；“如今”与“将要”凸显当前状态和未来逆转。“哀恸、哭泣”分别对应两个希腊语动词，避免将其压缩为一个概念。
