  text: Οὐ γάρ ἐστιν δένδρον καλὸν ποιοῦν καρπὸν σαπρόν, οὐδὲ ⸀πάλιν δένδρον σαπρὸν ποιοῦν καρπὸν καλόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/043.yaml
  text: For there is no good tree producing rotten fruit, nor again a rotten tree producing good fruit.
translation:
  language: zh_hans
  text: 因为没有好树结坏果子[a]，也没有坏树结好果子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “坏”也可译作“腐烂”。希腊词σαπρός可指腐烂、变质，也可泛指不好。
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ γάρ
  choice: 因为，没有
  rationale: γάρ承接上文，带有解释或论证意味；“因为”自然保留这一联系，οὐ则由“没有”表达。
- source_word: δένδρον
  choice: 树
  rationale: 这里是以结果子的树为喻，“树”是准确、自然的现代汉语表达。
- source_word: καλὸν / καλόν
  choice: 好
  rationale: καλός可指美好、优良或健全；“好”既适用于树和果子，也保留农业形象与道德寓意之间的张力。
- source_word: ποιοῦν καρπὸν
  choice: 结果子
  rationale: ποιέω与καρπός搭配时，汉语惯用“结果子”，比直译为“产生果子”更自然，并保留持续性描述。
- source_word: σαπρόν / σαπρὸν
  choice: 坏
  rationale: σαπρός可指腐烂、败坏或不好的。汉语通常说“坏果子”和“坏树”；统一译为“坏”可保持两句的严整对照，同时由脚注保留“腐烂”的具体词义。
- source_word: οὐδὲ πάλιν
  choice: 反过来，也没有
  rationale: οὐδέ连接第二个否定句，πάλιν在此显示相反方向的对应关系；“反过来，也没有”比机械译作“再者也不”更符合现代汉语。
theological_decisions:
- issue: 农业形象与道德寓意的强度
  choice: 正文将σαπρός译为“坏”，并用脚注注明“腐烂”的可能译法
  alternative: 在正文译作“腐烂的果子／腐坏的树”
  rationale: “坏”在汉语中能自然地同时修饰树和果子，保持原文平行结构，也不把比喻过早抽象化为“邪恶”或“败坏”；脚注则保留该词具体的腐朽、变质意象。
translation_notes:
  register: 采用简洁、庄重而口语自然的现代标准汉语。“结……果子”保留谚语式农业意象；分号和“反过来”凸显原文两句的对称关系。
