  text: καὶ καθὼς θέλετε ἵνα ποιῶσιν ὑμῖν οἱ ⸀ἄνθρωποι, ποιεῖτε αὐτοῖς ὁμοίως.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/031.yaml
  text: And just as you want people to do for you[a], do the same for them.
translation:
  language: zh_hans
  text: 你们希望别人怎样对待你们[a]，也要照样对待他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们愿意别人为你们做什么，也要照样为他们做。”
    reason: 保留ποιέω“做”的宽泛意义，并呈现原文“为你们／为他们”的平行结构。
lexical_decisions:
- source_word: καθὼς
  choice: 怎样
  rationale: 在“希望别人怎样……也要照样……”的汉语对应结构中，自然表达比较标准，同时保留“正如、照着”的语义。
- source_word: θέλετε
  choice: 希望
  rationale: 表达一般的意愿和愿望；“希望”在现代汉语中自然、庄重，也比“想要”更适合此处格言式语体。
- source_word: ἵνα ποιῶσιν ὑμῖν οἱ ἄνθρωποι
  choice: 别人怎样对待你们
  rationale: ἵνα从句说明所希望的内容；“别人”准确表达泛指的οἱ ἄνθρωποι，“对待”则以自然汉语概括人对人所做的事。脚注保留较宽泛、较贴近ποιέω字面的译法。
- source_word: ποιεῖτε αὐτοῖς
  choice: 也要……对待他们
  rationale: “要”体现命令语气，“也……他们”保留相互对应关系；重复“对待”映照原文重复ποιέω。
- source_word: ὁμοίως
  choice: 照样
  rationale: 简洁自然地表达相应、同样而行的意思。
theological_decisions:
- issue: οἱ ἄνθρωποι的泛指范围
  choice: 别人
  alternative: 人们／世人
  rationale: 此处泛指其他人，并非专指男性；“别人”在这一相互关系的句式中最自然，也不加入性别限制。
- issue: ποιέω在伦理命令中的宽泛含义
  choice: 对待
  alternative: 为……做
  rationale: “对待”使现代汉语清楚顺畅，但可能比原文宽泛的“做”略具体，因此以脚注提供较贴近字面的可选译法，不把经文限制为某一种具体行为。
translation_notes:
  register: 采用现代、简洁、格言式的标准普通话。“希望……怎样……也要照样……”既便于普通读者理解，也保持原文的比较结构和命令力度。
