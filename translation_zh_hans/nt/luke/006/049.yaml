  text: ὁ δὲ ἀκούσας καὶ μὴ ποιήσας ὅμοιός ἐστιν ἀνθρώπῳ οἰκοδομήσαντι οἰκίαν ἐπὶ τὴν γῆν χωρὶς θεμελίου, ᾗ προσέρηξεν ὁ ποταμός, καὶ ⸂εὐθὺς συνέπεσεν⸃, καὶ ἐγένετο τὸ ῥῆγμα τῆς οἰκίας ἐκείνης μέγα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/049.yaml
  text: But the one who heard and did not act is like a man who built a house on the ground without a foundation[a]. When the river burst against it, it immediately collapsed[b], and the ruin of that house was great.
translation:
  language: zh_hans
  text: 但那听了却不去行[a]的人，就像一个人在地面上盖房子，却不打根基。河流猛冲那房子，房子立刻倒塌；那房子的毁坏极其严重[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不去行”也可译作“不去做”或“不付诸实行”。希腊原文的动词基本意思是“做”，这里指照耶稣的话去行。
    reason: lexical_alternative
  - marker: b
    text: “毁坏极其严重”也可译作“那房子的破毁很大”。希腊原文的词可指破裂、裂口，也可指倒塌所造成的毁坏。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἀκούσας καὶ μὴ ποιήσας
  choice: 但那听了却不去行的人
  rationale: 分词短语作名词使用，指听见耶稣的话却不照着行的人。“不去行”保留 ποιέω 的基本含义以及“听”与“行”的鲜明对比。
- source_word: ἀνθρώπῳ οἰκοδομήσαντι οἰκίαν
  choice: 一个人把房子盖
  rationale: ἀνθρώπῳ 在比喻中泛指一个人；现代汉语无须添加带性别色彩的称谓。“把房子盖”自然表达建造动作。
- source_word: ἐπὶ τὴν γῆν χωρὶς θεμελίου
  choice: 在地面上，没有根基
  rationale: γῆ 在此指承载房屋的地面；χωρὶς θεμελίου 明确说明没有根基。分句表达符合现代汉语节奏。
- source_word: ᾗ προσέρηξεν ὁ ποταμός
  choice: 河水冲击那房子
  rationale: 关系代词所指为房子；προσρήγνυμι 表示猛烈撞击。“河水”比单说“河”更自然地充当冲击主体。
- source_word: εὐθὺς συνέπεσεν
  choice: 房子立刻倒塌
  rationale: συμπίπτω 用于建筑物表示倒塌，εὐθύς 译为“立刻”；补出“房子”以避免汉语代词指向不清。
- source_word: τὸ ῥῆγμα τῆς οἰκίας ἐκείνης μέγα
  choice: 那房子的毁坏十分严重
  rationale: ῥῆγμα 可指破裂、裂口或由倒塌造成的毁坏；结合前文房屋倒塌，译作“毁坏”自然，同时用脚注保留“破裂”的词义可能。μέγα 以“十分严重”表达程度。
theological_decisions:
- issue: 听见与实行耶稣话语的关系
  choice: 听了却不去行
  alternative: 听了却没有付诸实行
  rationale: 译文保持经文中“听”与“行”的直接张力，不扩展为关于行为、功德或得救次序的教义解释。
- issue: 比喻人物的性别表达
  choice: 一个人
  alternative: 一个男人
  rationale: 希腊语 ἄνθρωπος 在这里是代表性、泛指性用语，并非强调人物性别；现代汉语“一個人”准确而自然。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式保留比喻的因果推进，并以“根基—冲击—倒塌—毁坏”呈现原文意象；脚注标记均置于相关正文之后。
