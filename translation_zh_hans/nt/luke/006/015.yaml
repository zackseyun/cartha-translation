  text: ⸀καὶ Μαθθαῖον καὶ Θωμᾶν ⸁καὶ ⸀Ἰάκωβον Ἁλφαίου καὶ Σίμωνα τὸν καλούμενον Ζηλωτὴν
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/015.yaml
  text: and Matthew and Thomas[a], and James son of Alphaeus, and Simon who was called the Zealot
translation:
  language: zh_hans
  text: 还有马太和多马，亚勒腓的儿子雅各，以及被称为“热心者”[a]的西门。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“奋锐党人”。希腊文这个称号也可指“热心的人”；单凭此词，不能确定西门是否正式属于后来所称的奋锐党。
    reason: 词义存在两种合理理解：描述热心的称号，或与奋锐运动有关的称谓。
lexical_decisions:
- source_word: καὶ
  choice: 还有／和／以及
  rationale: 按现代汉语列举人名的习惯灵活处理重复出现的连词，同时保留使徒名单逐项铺陈的语气。
- source_word: Μαθθαῖον
  choice: 马太
  rationale: 采用现代中文圣经传统中通行且易于辨认的人名译法。
- source_word: Θωμᾶν
  choice: 多马
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: Ἰάκωβον Ἁλφαίου
  choice: 亚勒腓的儿子雅各
  rationale: 此处属格在姓名辨识格式中最自然地表示父子关系；明确译出“儿子”符合自然汉语，也可将这位雅各与其他同名者区分开来。
- source_word: Σίμωνα
  choice: 西门
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: τὸν καλούμενον
  choice: 人称
  rationale: 简洁自然地表达带冠词的被动分词所表示的识别性称号，即“被称为……的”。
- source_word: Ζηλωτὴν
  choice: 热心者
  rationale: 将其作为西门的称号来译，既体现该词与“热心、热忱”有关，也不在正文中断定他正式隶属于某一政治团体；脚注交代传统译法及其历史含义上的不确定性。
theological_decisions:
- issue: Ζηλωτής究竟是描述性称号，还是表示某个政治运动成员身份的名称
  choice: 正文译作“热心者”，作为识别西门的称号
  alternative: “奋锐党人”
  rationale: 希腊文明确表明这是西门的称号，却不足以单凭该词断定他正式加入了后来所谓的奋锐党。正文与脚注共同保留描述性称号和历史政治称谓之间的张力，避免过度解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。经文承接使徒名单，因此以“还有”起句；连词按汉语习惯处理，避免机械重复。称号加引号以清楚标示其识别作用。
