  text: εἶπεν ⸀δὲ ὁ Ἰησοῦς πρὸς αὐτούς· ⸀Ἐπερωτῶ ὑμᾶς, ⸀εἰ ἔξεστιν ⸂τῷ σαββάτῳ⸃ ἀγαθοποιῆσαι ἢ κακοποιῆσαι, ψυχὴν σῶσαι ἢ ⸀ἀπολέσαι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/009.yaml
  text: But Jesus said to them[a], “I ask you, is it lawful on the Sabbath to do good or to do harm[b], to save a life or to destroy it?”
translation:
  language: zh_hans
  text: 耶稣却对他们说：“我问你们：在安息日行善还是作恶[a]，救人一命还是使人丧命[b]，哪一种是合乎律法的？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“伤害人”。希腊文与“行善”构成伦理上的对照，在这里也包含采取有害行动的意思。
    reason: lexical_alternative
  - marker: b
    text: “人一命”所译的希腊词也可译作“魂”或“人”；这里按上下文译为人的生命。
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: 却
  rationale: 承接叙事，同时表现耶稣的回应与窥探他之人的态度之间的轻微转折。
- source_word: Ἐπερωτῶ ὑμᾶς
  choice: 我问你们
  rationale: 自然直接地表达耶稣向众人提出质问的语气。
- source_word: εἰ ἔξεστιν
  choice: 哪一种是合乎律法的
  rationale: 安息日争议涉及律法所准许的行为；调整为汉语问句的自然语序，同时保留其法律与伦理意味。
- source_word: τῷ σαββάτῳ
  choice: 在安息日
  rationale: 准确表达时间范围，也保留所指的特定宗教日。
- source_word: ἀγαθοποιῆσαι
  choice: 行善
  rationale: 简洁保留与 κακοποιῆσαι 的伦理对照。
- source_word: κακοποιῆσαι
  choice: 作恶
  rationale: 直接保留希腊文“行善/作恶”的伦理两极；上下文也允许理解为对人造成伤害。
- source_word: ψυχὴν σῶσαι
  choice: 救人一命
  rationale: 在医治与伤害的具体语境中，ψυχή 指人的生命；此译法是现代汉语中自然的表达。
- source_word: ἀπολέσαι
  choice: 毁掉人的性命
  rationale: 保留该词强烈的“毁灭、丧失”含义，并与“救人一命”构成鲜明对照，不把词义收窄为单纯“杀死”。
theological_decisions:
- issue: ψυχή 在“ψυχὴν σῶσαι ἢ ἀπολέσαι”中的含义
  choice: 译为“救人一命……毁掉人的性命”
  alternative: “拯救一个魂，还是毁灭它”或“救一个人，还是毁掉他”
  rationale: 当前安息日医治的语境着眼于保存或毁坏人的生命，并非专门论述灵魂与身体的关系；脚注保留“魂”这一可能较为直译的表达。
- issue: κακοποιῆσαι 的伦理及具体伤害含义
  choice: 译为“作恶”
  alternative: “伤害人”或“作坏事”
  rationale: “作恶”最清楚地对应“行善”的伦理反义关系；脚注说明在当前语境中也可具体理解为伤害人，避免排除其语境含义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。将总问句“哪一种是合乎律法的”置于句末，使两组平行对照在汉语中清楚顺畅；“行善/作恶”和“救人一命/毁掉人的性命”保留原文逐步加强的伦理张力。
