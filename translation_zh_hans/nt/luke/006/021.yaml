  text: μακάριοι οἱ πεινῶντες νῦν, ὅτι χορτασθήσεσθε. μακάριοι οἱ κλαίοντες νῦν, ὅτι γελάσετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/021.yaml
  text: Blessed are you who are hungry now[a], because you will be filled. Blessed are you who weep now[b], because you will laugh.
translation:
  language: zh_hans
  text: 你们现在饥饿的有福了[a]，因为你们将要得饱足[b]。你们现在哭泣的有福了，因为你们将要欢笑。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“现在饥饿的人有福了……现在哭泣的人有福了。”希腊文采用带冠词的分词；但上下文以及后文的第二人称复数动词支持译为直接称呼。
    reason: alternative_reading
  - marker: b
    text: 或译“得饱”或“得到满足”。此词可指吃饱，也可引申指得到充分满足。
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: 有福了
  rationale: 保留耶稣福语的固定语气及神学分量；“快乐”偏重主观感受，“幸运”则过于世俗。
- source_word: οἱ πεινῶντες
  choice: 饥饿的你们
  rationale: 希腊文是带冠词的分词，字面可作“那些饥饿的人”；但后面的第二人称复数动词及上下文显示这是对门徒的直接称呼。
- source_word: νῦν
  choice: 现在
  rationale: 明确呈现当下困乏与将来逆转之间的时间对照。
- source_word: χορτασθήσεσθε
  choice: 你们将要饱足
  rationale: 该词是将来时被动语态，常指吃饱，也可延伸为充分满足；“饱足”保留食物的具体意象，同时不排除更广的含义。
- source_word: οἱ κλαίοντες
  choice: 哭泣的你们
  rationale: 既保留 κλαίω 的具体动作，也依照本段的第二人称语境表达直接称呼；不译为“哀悼”，以免将原因限于丧亲。
- source_word: γελάσετε
  choice: 你们将要欢笑
  rationale: γελάω 的直接含义是“笑”；“欢笑”在现代汉语中自然而庄重，并保留从哭泣到笑的鲜明逆转。
theological_decisions:
- issue: 直接称呼还是第三人称的一般福语形式
  choice: 译作“饥饿的你们／哭泣的你们”
  alternative: “饥饿的人／哭泣的人”
  rationale: 虽然两个主语在形式上都是带冠词的分词，但应许中的动词为第二人称复数，且上下文是耶稣直接对门徒说话。译文保留这一话语情境，并用脚注注明形式上的另一种译法。
- issue: 所应许逆转的性质
  choice: 保留具体的“饱足”和“欢笑”
  alternative: 解释为属灵满足，或明确限定为末世的逆转
  rationale: 本节本身没有界定应验的时间与方式，因此不在译文中把应许限定为现世、属灵或末世层面。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“有福了”延续福语的经文语体；“饱足”和“欢笑”保留原文具体、鲜明的逆转意象。脚注标记置于相关首句之后，同时适用于两个平行分句。
