  text: τί δὲ βλέπεις τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ τοῦ ἀδελφοῦ σου, τὴν δὲ δοκὸν τὴν ἐν τῷ ἰδίῳ ὀφθαλμῷ οὐ κατανοεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/041.yaml
  text: But why do you see the speck in your brother’s eye[c][b][a], yet do not notice the beam in your own eye?
translation:
  language: zh_hans
  text: 可是，你为什么看见弟兄眼中的一根木屑[a][b]，却没有察觉自己眼中的房梁[c]呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “木屑”所译的希腊词也可指草屑或其他细小、干燥的碎片。
    reason: lexical_alternative
  - marker: b
    text: 原文为阳性单数“弟兄”；这里的教导并不限于男性。
    reason: cultural_note
  - marker: c
    text: “房梁”指建筑用的大木梁，也可译作“大梁”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τί
  choice: 为什么
  rationale: 在 τί δὲ βλέπεις 这一反问中，τί 带有追问和责备的意味；译作“为什么”比直译“什么”更符合现代汉语，也准确传达语用功能。
- source_word: δὲ
  choice: 可是
  rationale: 承接上文并形成轻微转折；“可是”自然地表现耶稣反问中的对照。
- source_word: βλέπεις
  choice: 只看见
  rationale: “看见”保留视觉比喻；汉语加“只”凸显此人与下半句所述自身问题之间的反差，虽非单独对应某一希腊词，却由整个对比结构支持。
- source_word: κάρφος
  choice: 小刺
  rationale: κάρφος 指细小、干燥的碎屑，如草屑或木屑；在眼睛的语境中，“小刺”形象自然，并与巨大的“房梁”形成夸张对比。
- source_word: ἀδελφοῦ
  choice: 弟兄
  rationale: 保留希腊文阳性单数的群体关系称谓；“弟兄”在庄重的现代汉语圣经语体中可指信仰共同体中的一员，而不局限于亲生弟弟。
- source_word: δοκόν
  choice: 房梁
  rationale: δοκός 是大型建筑木梁；“房梁”具体、易懂，能够保留原文与小刺之间强烈而荒诞的夸张对比。
- source_word: ἰδίῳ
  choice: 自己
  rationale: ἴδιος 强调属于本人；“自己眼中”准确保留与“弟兄眼中”的对照。
- source_word: κατανοεῖς
  choice: 没有察觉
  rationale: κατανοέω 在此指认真注意、认识到；“察觉”与前面的“看见”有所区分，也保留原文所表达的讽刺性认知落差。
theological_decisions:
- issue: ἀδελφοῦ 的性别与关系范围
  choice: 弟兄
  alternative: 弟兄姊妹；同伴；邻舍
  rationale: 原文采用阳性单数，在道德教导中具有代表性。正文保留这一形式，不擅自改成双性或中性表达；脚注说明其教导范围不限于男性亲属或男性信徒。
- issue: 对他人过失与自身过失的夸张对比
  choice: 小刺与房梁
  alternative: 碎屑与木头；木屑与大梁
  rationale: 保留原文具体的眼睛意象和极度不成比例的木料对比，不把它抽象化为“小过错”和“大过错”，从而避免替读者消解比喻的张力。
translation_notes:
  register: 采用自然、庄重而口语可懂的现代标准普通话。句式保留反问语气，以“可是”承接上文，以“小刺—房梁”和“看见—察觉”呈现原文的平行对照与讽刺张力。所有脚注标记均紧随相关词语。
