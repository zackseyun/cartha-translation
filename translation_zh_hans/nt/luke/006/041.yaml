- from: 可是，你为什么只看见弟兄眼中的小刺[a][b]，却没有察觉自己眼中的房梁[c]呢？
  to: 可是，你为什么看见弟兄眼中的一根木屑[a][b]，却没有察觉自己眼中的房梁[c]呢？
  rationale: 删除“只”以避免加入原文未明说的限制；将“小刺”改为“一根木屑”，更准确反映 κάρφος 作为细小干碎片的含义，并保留其与“房梁”的荒诞性大小对比。脚注相应修订，使其准确说明词义和阳性单数形式，同时不增加经文未限定的关系范围。
