    text: 原文为阳性单数“弟兄”；这里的教导并不限于男性。
    reason: cultural_note
  - marker: c
    text: “房梁”指建筑用的大木梁，也可译作“大梁”。
    reason: lexical_alternative
  revision_rationale: 删除“只”以避免加入原文未明说的限制；将“小刺”改为“一根木屑”，更准确反映 κάρφος 作为细小干碎片的含义，并保留其与“房梁”的荒诞性大小对比。脚注相应修订，使其准确说明词义和阳性单数形式，同时不增加经文未限定的关系范围。
