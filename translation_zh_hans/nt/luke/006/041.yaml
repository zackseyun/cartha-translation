review_pass:
  verdict: revise
  source_fidelity: The rhetorical question, the contrast between seeing and failing to notice, and the emphatic contrast between the brother's eye and one's own eye are substantially preserved. However, “只看见” adds an explicit restrictive sense not present in βλέπεις, and “小刺” can primarily suggest a thorn in modern Chinese, whereas κάρφος denotes a small dry fragment such as straw, chaff, or a splinter. “一根木屑” better preserves the concrete lexical image and its contrast with δοκός.
  naturalness: The sentence is natural, clear, and appropriately dignified in Modern Standard Mandarin. Removing “只” makes the parallel more faithful without diminishing the rhetorical force. “一根木屑” and “房梁” form a vivid, idiomatic hyperbolic contrast.
  terminology: “弟兄” appropriately retains the masculine singular relational term, while a note may clarify that the instruction is not confined to males. “房梁” is an accurate and natural rendering of δοκός. The revised note for κάρφος identifies the word as a small dry fragment rather than a thorn.
  issues:
  - severity: medium
    issue: “只看见” adds an unsupported restriction.
    rationale: βλέπεις means “you see/look at”; the Greek contrast is supplied by the following clause, not by an explicit equivalent of “only.” Adding “只” can imply that the person sees nothing else, a nuance not stated by the source.
  - severity: medium
    issue: “小刺” is lexically imprecise for κάρφος.
    rationale: κάρφος refers to a small dry particle or fragment, such as straw, chaff, or a splinter. In contemporary Chinese, “刺” commonly evokes a thorn; “一根木屑” more closely conveys the wooden/dry-fragment image and remains natural in the eye metaphor.
  - severity: low
    issue: The cultural footnote over-specifies possible contexts as male relatives or male believers.
    rationale: ἀδελφός literally denotes “brother,” but this verse itself does not explicitly delimit the referent to either family or church membership. A more general note avoids adding contextual specification while retaining the intended clarification.
  revised_text: 可是，你为什么看见弟兄眼中的一根木屑[a][b]，却没有察觉自己眼中的房梁[c]呢？
