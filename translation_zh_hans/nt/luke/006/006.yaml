base_translation:
  language: en
  yaml_path: translation/nt/luke/006/006.yaml
  text: It happened on another Sabbath that he entered the synagogue and was teaching[a]. And a man was there whose right hand was withered.
translation:
  language: zh_hans
  text: 在另一个安息日，耶稣进了会堂，正在教导。那里有一个人，他的右手萎缩了[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“枯萎”。希腊语这个词可表示干枯或枯萎；这里指那人的右手残疾、不能正常使用。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: 又有
  rationale: 这是路加常用的叙事承接表达；“又有”自然引出另一次事件，并保留δέ轻微的连接作用，而不生硬直译为“事情发生了”。
- source_word: ἐν ἑτέρῳ σαββάτῳ
  choice: 一个安息日
  rationale: 结合“又有”表达“另一个安息日”的意义，避免中文重复说“又有另一个”。
- source_word: εἰσελθεῖν αὐτὸν εἰς τὴν συναγωγὴν
  choice: 耶稣进了会堂
  rationale: 将希腊语不定式结构自然转换为中文限定句；原文代词在独立经节中以“耶稣”明确指称，便于读者理解。
- source_word: καὶ διδάσκειν
  choice: 教导人
  rationale: 现在时不定式体现活动的进行性；中文“教导人”自然表达当时正在从事的行动，而不必机械加入“正在”。宾语“人”是中文语境所需的自然补足。
- source_word: ἄνθρωπος ἐκεῖ
  choice: 在那里有一个人
  rationale: 保留人物的男性身份和ἐκεῖ的地点信息，并采用自然的中文存在句。
- source_word: ἡ χεὶρ αὐτοῦ ἡ δεξιὰ
  choice: 他的右手
  rationale: 准确保留原文特别指出的右手。
- source_word: ξηρά
  choice: 萎缩了
  rationale: 该词本义可指干枯、枯萎；在此描述失去正常功能的手。“萎缩”是现代中文清楚而不过度诊断化的表达。
