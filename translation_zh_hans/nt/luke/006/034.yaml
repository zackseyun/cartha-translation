  text: καὶ ἐὰν ⸀δανίσητε παρ’ ὧν ἐλπίζετε ⸀λαβεῖν, ποία ὑμῖν χάρις ἐστίν; ⸀καὶ ἁμαρτωλοὶ ἁμαρτωλοῖς δανίζουσιν ἵνα ἀπολάβωσιν τὰ ἴσα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/034.yaml
  text: And if you lend to those from whom you expect to receive[a], what credit is that to you? Even sinners lend to sinners so that they may receive back the same amount.
translation:
  language: zh_hans
  text: 你们若借给那些你们指望能从他们那里得到回报的人，这对你们有什么可称许的呢？[a] 就连罪人也借给罪人，为要如数收回。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这有什么值得感谢的呢？”希腊语“χάρις”也可表示“感谢”，但在这里更可能指值得称许或获得认可之处。
    reason: lexical_alternative
lexical_decisions:
- source_word: δανίσητε / δανίζουσιν
  choice: 借给
  rationale: 表示把钱财或物品借给别人；“借给”是现代汉语中自然明确的表达，并保留原文的借贷含义。
- source_word: παρ’ ὧν
  choice: 那些……从他们
  rationale: παρά加属格指出预期从其处获得回报的人；译文用“借给那些……从他们收回”分别清楚表达借出的对象和收回的来源。
- source_word: ἐλπίζετε λαβεῖν
  choice: 指望从他们收回
  rationale: ἐλπίζω在此可指“盼望”或“预期”；借贷语境下“指望”自然地传达预期，而“收回”结合上下文表达所借之物被归还。
- source_word: ποία ὑμῖν χάρις ἐστίν
  choice: 这有什么可称许的呢
  rationale: χάρις在此不是抽象的救恩性“恩典”，而是指值得认可、赞许之处；“可称许”适合修辞问句，也与上下文门徒应有的不同表现相符。
- source_word: ἁμαρτωλοὶ
  choice: 罪人
  rationale: 该形容词作名词使用，直指“罪人”；沿用路加福音中的道德类别，不加弱化或解释。
- source_word: ἵνα ἀπολάβωσιν
  choice: 为要……收回
  rationale: ἀπολαμβάνω在这里表示取回或得到归还；“收回”简洁地保留回收所借之物的方向。
- source_word: τὰ ἴσα
  choice: 如数
  rationale: 字面指相等之物，即等量的归还；“如数收回”是自然汉语，表达等额偿还而不暗示利息或收益。
theological_decisions:
- issue: 耶稣反问中χάρις的含义
  choice: 译作“可称许的”，指值得认可或赞许之处
  alternative: 恩典；感谢；好处
  rationale: 上下文连续反问这种行为有何异于罪人，重点是门徒的行为是否值得称许，并非把χάρις用作救恩论意义上的“恩典”。脚注保留“感谢”这一真实的词义可能。
- issue: 借贷中预期回报的性质
  choice: 中性地译为“如数收回”，表示等额归还
  alternative: 收取利息；连本带利收回
  rationale: τὰ ἴσα强调相等或等量，原文没有说明利息、盈利或高利贷，因此不引入超出文本的经济和伦理含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“可称许”比“有什么功劳”更少带功德色彩，也比“有什么信用”更符合汉语表达；“如数收回”简练地表达等额偿还。
