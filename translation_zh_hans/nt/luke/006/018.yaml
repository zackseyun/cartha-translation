  yaml_path: translation/nt/luke/006/018.yaml
  text: who came to hear him and to be healed of their diseases[a]; and those troubled by unclean spirits were being healed.
translation:
  language: zh_hans
  text: 他们来听他，也要得医治，脱离自己的疾病；那些受污秽的灵搅扰[a]的人正在得到医治。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “受污秽的灵搅扰”也可译作“受污秽的灵困扰”或“受污秽的灵折磨”；原文用词本身没有限定受侵扰的具体强度。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἳ ἦλθον
  choice: 他们来
  rationale: 关系代词承接上一节所说的群众；中文以“他们”自然续接上下文。简单过去叙事由“来”表达，不另加原文没有明示的先时性。
- source_word: ἀκοῦσαι αὐτοῦ
  choice: 听他讲道
  rationale: 不定式表示来此的目的。单译“听他”在现代汉语中略显不完整；“听他讲道”按本段耶稣教导的语境自然表达其意。
- source_word: ἰαθῆναι ἀπὸ τῶν νόσων αὐτῶν
  choice: 希望自己的疾病得到医治
  rationale: 被动不定式与前面的“听”并列，说明他们来的目的。补出“希望”使中文句法自然，但不改变求得医治之意；“疾病得到医治”表达ἀπό所含摆脱疾病的结果。
- source_word: ἐνοχλούμενοι ἀπὸ πνευμάτων ἀκαθάρτων
  choice: 受污灵搅扰的人
  rationale: ἐνοχλέω表示受到困扰、侵扰；“搅扰”保留程度上的宽泛性，不强化为“折磨”。“污灵”简洁保留ἀκάθαρτος的污秽含义和福音书中的属灵所指。
- source_word: ἐθεραπεύοντο
  choice: 也都不断得到医治
  rationale: 未完成时被动语态描绘现场持续或反复发生的医治；“不断得到医治”在中文中保留这一进行性。“也”对应καί，“都”自然概括该类人。
theological_decisions:
- issue: πνευμάτων ἀκαθάρτων在邪灵侵扰语境中的译法
  choice: 污灵
  alternative: 邪灵；不洁之灵
  rationale: “污灵”直接保留“灵”与“污秽”的词义及经文传统意象，不直接释义为“鬼”，也不把“污秽”泛化为单纯的邪恶。
- issue: ἐθεραπεύοντο的未完成时体
  choice: 不断得到医治
  alternative: 得到了医治
  rationale: 原文未完成时呈现当时持续或反复进行的医治，译文避免将其压平为一次性的完成事件。
- issue: ἐνοχλούμενοι所表达的受害强度
  choice: 搅扰
  alternative: 折磨；困扰
  rationale: 原词可涵盖受困扰、侵扰或折磨，具体强度并不固定；正文采用不过度强化的“搅扰”，脚注说明较强译法的可能性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“听他讲道”依语境补足汉语表达；“疾病得到医治”避免生硬的“从疾病中被医治”。脚注标记置于整节末尾，对正文中的“搅扰”提供词义说明。
