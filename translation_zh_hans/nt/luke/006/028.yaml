base_translation:
  language: en
  yaml_path: translation/nt/luke/006/028.yaml
  text: Bless those who curse you[a]; pray for those who mistreat you.
translation:
  language: zh_hans
  text: 要祝福那些咒诅你们的人；要为那些恶待[a]你们的人祷告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恶待”也可译作“凌辱”或“侮辱”。希腊语这个词可指带有敌意的侮辱、凌辱或其他恶待。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: 要祝福
  rationale: 复数命令式。采用“祝福”既自然庄重，也保留它与“咒诅”之间鲜明的伦理对照；“要”明确表达命令语气。
- source_word: τοὺς καταρωμένους ὑμᾶς
  choice: 那些咒诅你们的人
  rationale: 带冠词的分词作名词用，指“咒诅你们的人”。“咒诅”准确保留敌意言语以及求降灾祸于人的含义。
- source_word: προσεύχεσθε
  choice: 要……祷告
  rationale: 复数命令式。汉语用“要……祷告”清楚传达命令，不把希腊语现在时的体貌过度译成持续副词。
- source_word: περὶ τῶν ἐπηρεαζόντων ὑμᾶς
  choice: 为那些恶待你们的人
  rationale: περί与“祷告”连用时自然译为“为”。ἐπηρεάζω可涵盖侮辱、凌虐及其他怀有敌意的恶待；“恶待”在现代汉语中简洁自然，并保留较宽的语义范围。
theological_decisions:
- issue: 爱仇敌命令的范围
  choice: 将两项命令直接译为伦理命令，不添加教义性解释
  alternative: 在译文中补充这些行为的动机、限度或条件
  rationale: 原文以直接命令要求人以祝福和祷告回应敌意。译文应保留这种张力，不替作者补充条件，也不导入特定宗派解释。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“你们”对应原文复数第二人称；两个分句以“要”构成平行命令。脚注标记置于整节末尾，对“恶待”的语义范围作说明。
