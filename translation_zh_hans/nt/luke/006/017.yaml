source:
  edition: SBLGNT
  text: Καὶ καταβὰς μετ’ αὐτῶν ἔστη ἐπὶ τόπου πεδινοῦ, καὶ ὄχλος ⸀πολὺς μαθητῶν αὐτοῦ, καὶ πλῆθος πολὺ τοῦ λαοῦ ἀπὸ πάσης τῆς Ἰουδαίας καὶ Ἰερουσαλὴμ καὶ τῆς παραλίου Τύρου καὶ Σιδῶνος,
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/017.yaml
  text: And coming down with them[a], he stood on a level place, with a large crowd of his disciples and a great multitude of the people from all Judea and Jerusalem and the coastal region of Tyre and Sidon,
translation:
  language: zh_hans
  text: 耶稣同他们下来，站在一处平坦的地方[a]。那里有一大群他的门徒，还有大批民众，来自犹太全地、耶路撒冷，以及推罗和西顿的沿海地区。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“一片平原”。希腊原文直译为“一处平坦的地方”。
    reason: lexical_alternative
lexical_decisions:
- source_word: καταβὰς
  choice: 下来
  rationale: 这个不定过去时分词表示在主句动作之前或与之相连的向下移动。“下来”自然保留方向感，又不擅自说明是从山上下来。
- source_word: ἔστη
  choice: 站在
  rationale: ἵστημι在此表示站定或取站立的位置；“站在”符合现代汉语叙事习惯。
- source_word: ἐπὶ τόπου πεδινοῦ
  choice: 在一处平坦的地方
  rationale: τόπος意为“地方”，πεδινός意为“平坦的、平地的”。此译法贴近原文，也不把地形过度确定为广阔的平原。
- source_word: ὄχλος πολὺς μαθητῶν αὐτοῦ
  choice: 一大群他的门徒
  rationale: ὄχλος指人群，πολύς表明数量众多；属格短语说明这群人由他的门徒组成。
- source_word: πλῆθος πολὺ τοῦ λαοῦ
  choice: 大批民众
  rationale: πλῆθος πολύ强调人数众多，λαός在这里指门徒群体之外的广大民众。“大批民众”准确而自然。
- source_word: ἀπὸ πάσης τῆς Ἰουδαίας
  choice: 来自犹太全地
  rationale: ἀπό表示来源，πάσης表示范围遍及整个地区；“犹太全地”简洁保留其全面性。
- source_word: Ἰερουσαλήμ
  choice: 耶路撒冷
  rationale: 采用现代中文圣经与通行译名。
- source_word: τῆς παραλίου Τύρου καὶ Σιδῶνος
  choice: 推罗和西顿的沿海地区
  rationale: παράλιος表示临海或沿海地带；此译法清楚表达与推罗、西顿相关的海岸区域。
theological_decisions:
- issue: 讲论场景的地形用语
  choice: 一处平坦的地方
  alternative: 一片平原
  rationale: 按路加原文的词义翻译，不为协调其他福音书的场景而添加“山上”或“山下”，也不把该处明确限定为广阔的平原。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“耶稣”作为本节延续上文的主语，为中文独立成节阅读而明确补出；“那里有”使原文两个省略谓语的并列名词结构在汉语中通顺。地名使用简体中文通行译法。
