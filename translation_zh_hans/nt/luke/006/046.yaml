  text: Τί δέ με καλεῖτε· Κύριε κύριε, καὶ οὐ ποιεῖτε ἃ λέγω;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/046.yaml
  text: Why do you call me[a], ‘Lord, Lord,’ and not do what I say?
translation:
  language: zh_hans
  text: 你们为什么称呼我‘主啊，主啊’，却不照我所说的去做？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τί
  choice: 为什么
  rationale: 在“Τί……καλεῖτε”这一问句中，τί虽基本义为“什么”，但在此用于询问原因；译作“为什么”自然地保留责问语气。
- source_word: δέ
  choice: 不单独译出
  rationale: δέ是轻微的承接或转折词；本句在中文语境中无需加“但”或“而”，上下文与句内的“却”已充分体现其话语衔接和对比。
- source_word: με
  choice: 我
  rationale: 作καλεῖτε的直接宾语，直译为“我”。
- source_word: καλεῖτε
  choice: 称呼
  rationale: 此处指用“主啊”这一称谓来称耶稣；“称呼我”比单用“叫我”更明确、庄重。
- source_word: Κύριε κύριε
  choice: 主啊，主啊
  rationale: 保留κύριος的通常译法“主”及重复呼语，呈现口头承认与实际不遵行之间的强烈对比。
- source_word: καὶ οὐ
  choice: 却不
  rationale: 希腊文以并列结构形成反差；现代汉语用“却不”更自然，并清楚表达称耶稣为主与不实行其话语之间的对比。
- source_word: ποιεῖτε
  choice: 照……去做
  rationale: ποιέω在这里指实行或遵行耶稣所说的话；“照我所说的去做”自然且准确，不把含义缩窄为某一特定宗教术语。
- source_word: ἃ
  choice: 我所说的
  rationale: 中性复数关系代词概括耶稣所说的内容；汉语以“所”字结构表达最自然。
- source_word: λέγω
  choice: 我所说的
  rationale: 保留现在时的一般性表达，指耶稣所说的话；不增添原文没有明说的“告诉你们”。
theological_decisions:
- issue: κύριος作为对耶稣的称号
  choice: 主
  alternative: 主人／老师
  rationale: “主”既是κύριος的直接常用对应，也保留此处可能具有的尊称和基督论分量；不将其弱化为纯粹的师生称谓。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“主啊，主啊”保留重复呼语；“却不照我所说的去做”以自然汉语传达原文中言语称认与行为不一致的责问。未设脚注，因为“主”的主要译法可直接保留，其他可能译法不足以在本节另作必要说明。
