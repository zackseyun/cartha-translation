  text: ⸀παντὶ αἰτοῦντί σε δίδου, καὶ ἀπὸ τοῦ αἴροντος τὰ σὰ μὴ ἀπαίτει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/030.yaml
  text: Give to everyone who asks you[a], and from the one who takes what is yours, do not demand it back.
translation:
  language: zh_hans
  text: 凡向你求的人，都要给他；拿走你的东西的人，不要向他索还。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不要向他索还”也可译作“不要向他讨回来”。
    reason: ἀπαιτέω兼有要求归还、讨回之意；两个译法分别较突出正式索还和日常追讨的语气。
lexical_decisions:
- source_word: παντὶ αἰτοῦντί σε
  choice: 凡向你求的
  rationale: παντί与分词αἰτοῦντί连用，具有逐一而广泛的范围；“凡……的”在现代汉语中自然地保留“每一个向你求的人”之意。αἰτέω只表示请求，不额外限定为乞讨。
- source_word: δίδου
  choice: 都要给他
  rationale: δίδου是现在时主动命令式。“要给”明确表达命令；“都”与前面的“凡”呼应，保留普遍范围。希腊语现在时可能带有持续或惯常意味，但不宜在正文中过度显明。
- source_word: ἀπὸ τοῦ αἴροντος τὰ σὰ
  choice: 拿走你东西的人
  rationale: αἴροντος在此表示拿走或带走；“拿走”既保留物品被移走的意思，又不擅自限定为偷窃或抢夺。τὰ σὰ直译为“属于你的东西”，“你东西”在此简洁自然，范围仍较宽。
- source_word: μὴ ἀπαίτει
  choice: 不要向他索还
  rationale: ἀπαιτέω可指要求归还或索回。“索还”简洁地表达追讨原属自己之物，也保留动词较强的要求意味。
theological_decisions:
- issue: 耶稣这项伦理命令的范围与力度
  choice: 按原文译成范围广泛、直接明确的命令，不在正文中加以缓和或限制。
  alternative: 将其解释为夸张说法，或仅限于施舍、盗窃赔偿等特定情境。
  rationale: 希腊文使用直接的命令式和具有普遍范围的παντί。译文应保留这句话在实际应用上的张力，而不代替读者解决其适用范围的争议。
translation_notes:
  register: 采用现代、简洁而庄重的普通话。“凡……都……”清楚呈现普遍范围；分号保留两个并列命令之间的紧密关系。避免使用“财产”“盗取”等会缩窄原文含义的词。
