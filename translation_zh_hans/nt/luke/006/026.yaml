  text: Οὐαὶ ὅταν ⸂καλῶς ὑμᾶς⸃ εἴπωσιν ⸀πάντες οἱ ἄνθρωποι, κατὰ ⸂τὰ αὐτὰ⸃ γὰρ ἐποίουν τοῖς ψευδοπροφήταις οἱ πατέρες αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/026.yaml
  text: Woe when all people speak well of you[b][a], for their fathers used to do the same to the false prophets.
translation:
  language: zh_hans
  text: “所有人都说你们好话时，你们有祸了！因为他们的祖先[a]也曾这样对待假先知。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “祖先”原文直译为“他们的父亲”；这里指他们民族的前代人。
    reason: cultural_note
lexical_decisions:
- source_word: Οὐαί
  choice: 有祸了
  rationale: 保留先知性警告和宣告灾祸的力度；比单纯的“可悲”更符合本段四个“有祸了”的庄重语气。
- source_word: ὅταν
  choice: ……的时候
  rationale: 表达一般性的情形或将来的可能情形，中文自然，也不把警告限于某一次事件。
- source_word: καλῶς ὑμᾶς εἴπωσιν
  choice: 说你们好话
  rationale: 按习语表达对某人作正面评价，而不是“正确地谈论”；现代中文通俗自然，并保留评价意味。
- source_word: πάντες οἱ ἄνθρωποι
  choice: 所有人
  rationale: 准确表达泛指的全体人，不加入男性限定。
- source_word: κατὰ τὰ αὐτά
  choice: 也是这样
  rationale: 与ἐποίουν合译，简洁表达“以同样方式对待”的比较关系。
- source_word: γάρ
  choice: 因为
  rationale: 明确引出前面祸患宣告的理由。
- source_word: ἐποίουν
  choice: 从前也是这样待
  rationale: 用“从前”结合语境体现未完成时所指的过去惯常做法；“待”自然补足动作针对人的关系。
- source_word: τοῖς ψευδοπροφήταις
  choice: 假先知
  rationale: 采用现代中文圣经语域中清楚、简洁的对应词。
- source_word: οἱ πατέρες αὐτῶν
  choice: 他们的祖先
  rationale: 此处指那些人的前代；译作“祖先”比字面的“父亲们”更能避免误解，同时保留代际对比。
theological_decisions:
- issue: 假先知比较的所指与力度
  choice: 把普遍称赞与前代善待假先知的历史模式相比较，以此构成警告。
  alternative: 把本节理解成不加区别地谴责任何来自他人的正面评价，或仅仅批评受欢迎本身。
  rationale: γάρ和κατὰ τὰ αὐτά明确以过去对待假先知的方式说明前面的祸患；译文保留这一关联，却不扩张为对一切称赞的绝对否定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“有祸了”与路加福音6:24—26的警告格式相称；“说你们好话”通俗但不轻佻。正文中的“他们”依原文保留，指“所有人”；脚注说明“祖先”的文化与代际含义。
