    issue: “待假先知”的搭配不够自然。
    rationale: 现代汉语通常说“对待某人”；补出“对”不改变原文概括的动作含义。
  - severity: low
    issue: 脚注标记置于句末，未紧邻所注的“祖先”。
    rationale: 将标记移至“祖先”后，可清楚标示脚注所说明的词语。
  - severity: low
    issue: 脚注将原文字面义表述为“父辈”，可更精确说明为“父亲”。
    rationale: πατέρες的字面对应是“父亲”；本处按上下文指前代人。
