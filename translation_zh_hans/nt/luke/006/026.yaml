- from: “所有人都说你们好话的时候，你们有祸了！因为他们的祖先从前也是这样待假先知的。[a]”
  to: “所有人都说你们好话时，你们有祸了！因为他们的祖先[a]也曾这样对待假先知。”
  rationale: 修订仅改善汉语搭配并调整脚注锚点，同时更清楚表达过去惯常的历史模式。保留“祖先”及“这样对待”的概括性，不将比较关系解释为对任何称赞的绝对否定，也不把对假先知的“对待”擅自限定为某一种行为。
