  verdict: revise
  source_fidelity: 正文准确传达了οὐαί的警告、普遍称赞的情形，以及前代人以同样方式对待假先知这一说明。为更贴近κατὰ τὰ αὐτά与未完成时ἐποίουν，宜用“也曾这样对待”表达过去一贯的模式；不把“对待”具体化为“称赞”，从而保留原文动词的概括性。
  naturalness: “从前也是这样待假先知的”中“待”缺少“对”，略显生硬。改为“也曾这样对待假先知”更符合现代标准汉语，也维持庄重简洁的经文语体。
  terminology: “有祸了”“假先知”均合乎中文圣经常用语和本段语域。“祖先”可作为πατέρες在此代际意义上的自然译法，但脚注应明确其字面义为“父亲”，并将标记紧邻该词。
  issues:
