id: LUK.6.48
reference: Luke 6:48
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὅμοιός ἐστιν ἀνθρώπῳ οἰκοδομοῦντι οἰκίαν ὃς ἔσκαψεν καὶ ἐβάθυνεν καὶ ἔθηκεν θεμέλιον ἐπὶ τὴν πέτραν· πλημμύρης δὲ γενομένης προσέρηξεν ὁ ποταμὸς τῇ οἰκίᾳ ἐκείνῃ, καὶ οὐκ ἴσχυσεν σαλεῦσαι αὐτὴν ⸂διὰ τὸ καλῶς οἰκοδομῆσθαι αὐτήν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/048.yaml
  text: He is like a man building a house[a], who dug deep and laid a foundation on the rock. And when a flood came, the river burst against that house and was not able to shake it, because it had been well built.
translation:
  language: zh_hans
  text: 他好比一个盖房子的人：这人往下挖，挖得很深，把根基立在磐石上。洪水来时，河水猛冲那座房子，却不能摇动它，因为它建造得很好。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅμοιός ἐστιν ἀνθρώπῳ
  choice: 他好比一个……的人
  rationale: 保留耶稣比喻中的直接比较句式；ἀνθρώπῳ通常指“人”，在此不必额外断定人物的生理性别。
- source_word: οἰκοδομοῦντι οἰκίαν
  choice: 盖房子
  rationale: 采用现代汉语中自然、清楚的建筑用语。
- source_word: ἔσκαψεν καὶ ἐβάθυνεν
  choice: 往下挖，挖得很深
  rationale: 分别体现“挖”和“加深”两个并列动词，比单说“深挖”更完整地保留原文的动作与强调。
- source_word: ἔθηκεν θεμέλιον ἐπὶ τὴν πέτραν
  choice: 把根基立在磐石上
  rationale: “立根基”符合汉语建筑意象；“磐石”表达πέτρα所指的坚实岩体，同时保留定指意象。
- source_word: πλημμύρης δὲ γενομένης
  choice: 洪水来时
  rationale: 自然地表达属格独立结构所表示的时间背景。
- source_word: προσέρηξεν ὁ ποταμὸς τῇ οἰκίᾳ ἐκείνῃ
  choice: 河水猛冲那座房子
  rationale: “猛冲”传达προσρήγνυμι所含的猛烈冲击力；“河水”在汉语中比单说“河”作施事更自然。
- source_word: οὐκ ἴσχυσεν σαλεῦσαι αὐτήν
  choice: 却不能摇动它
  rationale: 保留“没有能力使之动摇”的结构及房屋未被撼动的形象。
- source_word: διὰ τὸ καλῶς οἰκοδομῆσθαι αὐτήν
  choice: 因为房子建造得很牢固
  rationale: 明确原因关系并保留被动建造的含义；“牢固”在本语境中自然表达καλῶς所指的良好建造质量。
theological_decisions:
- issue: ἀνθρώπῳ在代表性比喻中的性别表达
  choice: 一个……的人
  alternative: 一个……的男人
  rationale: ἄνθρωπος在此首先表示比喻中的一个人，并不要求断定其为男性；中文“人”忠实保留代表性，也避免把语法阳性扩大为原文未明说的生理性别。
- issue: 磐石意象是否解释为特定神学对象
  choice: 保留“磐石”而不在本节内解释
  alternative: 将磐石直接解释为基督、信心或顺服
  rationale: 本节的明喻聚焦于听见并实行耶稣话语的人；译文保留建筑意象，不加入原文没有明说的教义性等同。
translation_notes:
  register: 采用现代、庄重而通俗的叙事语言。“这人往下挖，挖得很深”保留原文两个动作的递进感；末句重复“房子”以避免连续代词在中文中指代含混。
