  to: 他好比一个盖房子的人：这人往下挖，挖得很深，把根基立在磐石上。洪水来时，河水猛冲那座房子，却不能摇动它，因为它建造得很好。
  rationale: 仅将末句改为“因为它建造得很好”，以对应διὰ τὸ καλῶς οἰκοδομῆσθαι αὐτήν所表达的原因、被动语态和概括性的‘建造得好’，不把其限定为“牢固”。其余措辞忠实、自然，无须改动。
