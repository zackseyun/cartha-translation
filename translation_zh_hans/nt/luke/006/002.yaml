  text: τινὲς δὲ τῶν Φαρισαίων ⸀εἶπαν· Τί ποιεῖτε ὃ οὐκ ⸀ἔξεστιν τοῖς σάββασιν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/002.yaml
  text: But some of the Pharisees said[a], “Why are you doing what is not lawful on the Sabbaths?”
translation:
  language: zh_hans
  text: 但有些法利赛人说：“你们为什么在安息日[a]做不合律法的事？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文“安息日”为复数形式；这是指“在安息日”的常见惯用表达。
    reason: 说明原文复数形式及其惯用的单数意义，避免中文读者误以为这里强调多个安息日。
lexical_decisions:
- source_word: τινὲς
  choice: 有几个
  rationale: 表示法利赛人中的一部分，并非整个群体；“有几个”在现代汉语中自然且明确。
- source_word: δὲ
  choice: 但
  rationale: 承接上文并引出质疑，带有轻微转折；“但”能体现叙事中的对立变化。
- source_word: Φαρισαίων
  choice: 法利赛人
  rationale: 采用这一犹太群体名称在中文圣经及现代汉语中的通行译名。
- source_word: εἶπαν
  choice: 说
  rationale: 简单过去时将这次发言作为完整事件叙述；汉语用“说”即可自然表达。
- source_word: Τί ποιεῖτε
  choice: 你们为什么……做
  rationale: τί 字面可作“什么”，但在此质问结构中询问的是做这事的理由，译作“为什么”符合希腊语语用和自然汉语。
- source_word: ὃ οὐκ ἔξεστιν
  choice: 不合律法的事
  rationale: 指在宗教律法规范下不获准许的行为；“不合律法”保留法律—宗教语气，也比单纯“不允许”更贴合争议背景。
- source_word: τοῖς σάββασιν
  choice: 在安息日
  rationale: 希腊语使用复数形式，但这是指安息日或安息日守例的常见表达；中文以单数“安息日”最自然，脚注说明原文形式。
theological_decisions:
- issue: 安息日表达的单复数
  choice: 正文译作“在安息日”，并用脚注说明希腊语为复数形式
  alternative: 在各安息日
  rationale: τοῖς σάββασιν 在形式上为复数，但这里是指安息日的惯用表达，并不强调多个不同的安息日。中文直译复数容易造成误解，因此正文采用自然的单数，同时通过脚注保持对原文形式的透明度。
- issue: οὐκ ἔξεστιν 的规范性质
  choice: 不合律法
  alternative: 不准做
  rationale: 上下文是有关安息日行为规范的争议。“不合律法”保留法利赛人质问中的法律—宗教色彩，但不替叙述者判断他们的解释是否正确。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“有几个法利赛人”避免将质疑归于所有法利赛人；问句保持直接质问的语气。
