  text: καὶ ἀποκριθεὶς πρὸς αὐτοὺς εἶπεν ὁ Ἰησοῦς· Οὐδὲ τοῦτο ἀνέγνωτε ὃ ἐποίησεν Δαυὶδ ⸀ὁπότε ἐπείνασεν αὐτὸς καὶ οἱ μετ’ αὐτοῦ ⸀ὄντες;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/003.yaml
  text: And Jesus answered them, “Have you not even read this, what David did when he was hungry, he and those who were with him?”
translation:
  language: zh_hans
  text: 耶稣回答他们说：“大卫和与他同在的人饥饿时，大卫所做的事，你们连这也没有读过吗？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: 回答……说
  rationale: 保留分词加限定动词的希腊语表达，同时符合现代汉语叙事习惯；比只译“回答”更完整地呈现原文形式。
- source_word: πρὸς αὐτοὺς
  choice: 他们
  rationale: 作为“回答”的对象，译作“回答他们”自然准确。
- source_word: Οὐδὲ τοῦτο
  choice: 连这件事……也没有
  rationale: 用“连……也”保留 οὐδέ 的强调语气，使反问保持其尖锐力度。
- source_word: ἀνέγνωτε
  choice: 读过
  rationale: 在反问中用“读过”自然表达对听者是否熟悉经文的追问。
- source_word: ὃ ἐποίησεν Δαυὶδ
  choice: 大卫所做的事
  rationale: 准确保留关系从句的内容，在汉语中采用自然的名词化结构。
- source_word: Δαυὶδ
  choice: 大卫
  rationale: 采用现代中文圣经及一般读者熟悉的标准人名译法。
- source_word: ὁπότε
  choice: ……时
  rationale: 简洁表达时间关系，不添加原文没有的因果含义。
- source_word: ἐπείνασεν
  choice: 饥饿
  rationale: 直接表达 πεινάω 的意义；不强化为“饿极了”，以免超出原文。
- source_word: αὐτὸς καὶ οἱ μετ’ αὐτοῦ ὄντες
  choice: 大卫和跟随他的人
  rationale: 明确重复“大卫”以避免汉语中“他”所指含混；“跟随他的人”贴近“与他同在的人”，且在叙事中自然。
theological_decisions: []
