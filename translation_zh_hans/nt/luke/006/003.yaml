- from: 耶稣回答他们说：“连这件事你们也没有读过吗？大卫和跟随他的人饥饿时，大卫所做的事。”
  to: 耶稣回答他们说：“大卫和与他同在的人饥饿时，大卫所做的事，你们连这也没有读过吗？”
  rationale: 把“大卫所做的事”恢复为“读过”的完整宾语，并保留“连这也没有”的强调性反问。将“跟随他的人”改为“与他同在的人”，以忠实保留原文未具体界定的同行关系。
  reviewer_model: gpt-5.6-terra
