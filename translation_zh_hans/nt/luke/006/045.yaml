id: LUK.6.45
reference: Luke 6:45
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ ἀγαθὸς ἄνθρωπος ἐκ τοῦ ἀγαθοῦ θησαυροῦ τῆς καρδίας ⸀αὐτοῦ προφέρει τὸ ἀγαθόν, καὶ ὁ ⸀πονηρὸς ἐκ τοῦ ⸀πονηροῦ προφέρει τὸ πονηρόν· ἐκ γὰρ ⸀περισσεύματος καρδίας λαλεῖ τὸ στόμα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/045.yaml
  text: The good man brings forth what is good out of the good treasure of his heart[a], and the evil man out of his evil treasure brings forth what is evil; for out of the overflow of the heart his mouth speaks.
translation:
  language: zh_hans
  text: 善人从心里所存的善发出善来，恶人从心里所存的恶发出恶来；因为心里所充满的，口里就说出来。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为心里满溢什么，口里就说出什么。”
    reason: περίσσευμα既可强调“充满、丰富”，也可突出多到“满溢”的形象；脚注保留后一种较具象的理解。
lexical_decisions:
- source_word: ὁ ἀγαθὸς ἄνθρωπος
  choice: 善人
  rationale: 用简洁自然的汉语保留对人的道德定性；此处ἄνθρωπος泛指一类人，不必在汉语中另加性别标记。
- source_word: θησαυροῦ
  choice: 所存的
  rationale: θησαυρός在此指内在积存、储藏之物；译作“所存的”既保留储存意象，也比直译“宝藏”更符合现代汉语语境。
- source_word: καρδίας
  choice: 心里
  rationale: “心”在此指人的内在思想、意愿和情感；“心里”是自然且庄重的现代汉语表达。
- source_word: προφέρει
  choice: 发出……来
  rationale: 保留从内在储存中带出、产生外在结果的动态意象，并使善恶两句保持平行。
- source_word: πονηρὸς / πονηροῦ / πονηρόν
  choice: 恶人／所存的恶／恶
  rationale: 以“恶”一致呈现πονηρός的道德含义，不弱化为一般性的“不好”。
- source_word: περισσεύματος
  choice: 所充满的
  rationale: 表达内心内容丰盛到显露于言语的含义；“满溢”更具象，但“所充满的”在汉语箴言式句法中更自然。
- source_word: λαλεῖ
  choice: 说出来
  rationale: 自然表达口所发出的言语，并与前文“发出……来”的内外关系呼应。
- source_word: τὸ στόμα αὐτοῦ
  choice: 口里
  rationale: 保留原文明确提到“口”的身体意象，而不简化为“他就说”。
theological_decisions:
- issue: ἀγαθός与πονηρός所构成的人格及伦理对照
  choice: 保留“善人／恶人”和“善／恶”的道德范畴
  alternative: 好人／坏人，或健康的人／败坏的人
  rationale: 上下文强调内在品格与外在言行之间的道德关系；“善／恶”准确保留原文的伦理力度，也维持整句鲜明的对称。
- issue: 心、口与行为之间的关系
  choice: 保留内心储存之物从口中显露的意象
  alternative: 意译为“人的言语反映他的品格”
  rationale: 原文以“心”“口”和“发出”构成具体比喻；直陈其意会削弱耶稣话语的形象和张力。
translation_notes:
  register: 采用现代、庄重而易懂的箴言式表达。两句“善／恶”严格平行；不机械直译“宝藏”，而以“心里所存的”传达内在储备的隐喻。脚注标记置于整句末尾，明确对应末句的词义替代。
