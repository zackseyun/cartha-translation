  text: Σίμωνα ὃν καὶ ὠνόμασεν Πέτρον καὶ Ἀνδρέαν τὸν ἀδελφὸν αὐτοῦ ⸀καὶ Ἰάκωβον καὶ Ἰωάννην ⸁καὶ Φίλιππον καὶ Βαρθολομαῖον
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/014.yaml
  text: Simon, whom he also named Peter, and Andrew his brother, and James and John, and Philip and Bartholomew,
translation:
  language: zh_hans
  text: 西门（耶稣又给他取名为彼得）、他的兄弟安得烈、雅各、约翰、腓力和巴多罗买。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σίμωνα
  choice: 西门
  rationale: 采用现代中文圣经中该使徒姓名的通行译名，也与路加福音的语境相符。
- source_word: ὃν καὶ ὠνόμασεν Πέτρον
  choice: 耶稣又给他取名叫彼得
  rationale: ὀνομάζω在此表示赋予名字；补明省略的主语“耶稣”，使独立呈现的中文经节清楚自然，“又”对应καί。
- source_word: Πέτρον
  choice: 彼得
  rationale: 采用Πέτρος在现代中文圣经中的通行译名。
- source_word: Ἀνδρέαν
  choice: 安得烈
  rationale: 采用该使徒姓名在现代中文圣经中的通行译名。
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: 他的兄弟
  rationale: 此处指西门的亲生男性手足；“他的兄弟”准确而自然。
- source_word: Ἰάκωβον
  choice: 雅各
  rationale: 采用Ἰάκωβος在中文新约中的通行姓名形式。
- source_word: Ἰωάννην
  choice: 约翰
  rationale: 采用Ἰωάννης的通行中文译名。
- source_word: Φίλιππον
  choice: 腓力
  rationale: 采用Φίλιππος的通行中文译名。
- source_word: Βαρθολομαῖον
  choice: 巴多罗买
  rationale: 采用Βαρθολομαῖος的通行中文译名。
- source_word: καὶ
  choice: 、／和；又
  rationale: 列举中的重复καί按现代汉语习惯用顿号及末项前的“和”表达；关系从句中的καί译作“又”。
