id: LUK.6.20
reference: Luke 6:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ αὐτὸς ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ εἰς τοὺς μαθητὰς αὐτοῦ ἔλεγεν· Μακάριοι οἱ πτωχοί, ὅτι ὑμετέρα ἐστὶν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/020.yaml
  text: 'And he[a], lifting up his eyes toward his disciples, was saying: “Blessed are the poor[b], because yours is the kingdom of God.”'
translation:
  language: zh_hans
  text: 耶稣抬眼望着他的门徒，说：“贫穷的人有福了[a]，因为上帝的国是你们的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文“贫穷的人”在形式上是第三人称，但下文“你们的”表明耶稣是在直接对门徒说话。另可译作：“你们贫穷的人有福了。”路加在这里说“贫穷的人”，没有说“心灵贫穷的人”（参太5:3）。
    reason: 说明语法上的第三人称形式与语境中的直接称呼，并防止将马太平行经文的限定语加入路加原文。
lexical_decisions:
- source_word: ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: 抬眼
  rationale: 保留“举目”的具体动作，同时采用自然、简洁的现代汉语表达；不必机械重现希腊语所有格“他的”。
- source_word: εἰς τοὺς μαθητὰς αὐτοῦ
  choice: 望着他的门徒
  rationale: εἰς在这里表示目光所朝的方向；“望着”比生硬的“向着”更符合现代汉语习惯。
- source_word: ἔλεγεν
  choice: 说
  rationale: 希腊语未完成时在此可用于引出一段讲话。汉语用“说”已能自然承担这一叙事功能；译成“正说着”反而可能误示讲话已在进行。
- source_word: Μακάριοι
  choice: 有福了
  rationale: “有福”保留福宣语境中蒙福、处于可称羡境况的含义，比单纯的“快乐”或“幸运”更准确；句末“了”使宣告在现代汉语中自然有力。
- source_word: οἱ πτωχοί
  choice: 贫穷的人
  rationale: 按路加原文直译为物质及社会意义开放的“贫穷的人”，不增添马太平行经文中的“心灵”限定。
- source_word: ὅτι
  choice: 因为
  rationale: 明确表达后半句对前面福宣的原因说明。
- source_word: ὑμετέρα ἐστὶν ἡ βασιλεία τοῦ θεοῦ
  choice: 上帝的国是你们的
  rationale: 保留原文“你们的”这一直接复数称呼，也保持“上帝的国”的传统且宽广的语义，不窄化为单纯的统治行为。
theological_decisions:
- issue: πτωχοί是否应解释为“心灵贫穷”
  choice: 贫穷的人
  alternative: 心灵贫穷的人
  rationale: 路加文本只说“贫穷的人”，没有“心灵”一词；不以马太福音5:3补充或协调本节。
- issue: 福宣采用第三人称形式还是直接第二人称表达
  choice: 贫穷的人有福了……上帝的国是你们的
  alternative: 你们贫穷的人有福了
  rationale: οἱ πτωχοί在形式上是带冠词的第三人称类别表达，而ὑμετέρα随即转为直接的第二人称。正文保留这种张力，并以脚注说明。
- issue: βασιλεία τοῦ θεοῦ译作“上帝的国”还是“上帝的统治”
  choice: 上帝的国
  alternative: 上帝的统治
  rationale: “国”既可涵盖上帝的王权，也可涵盖其统治所形成的领域与秩序，避免在本节中过早限定语义。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“耶稣”补出希腊语代词所指，使独立经节清楚；“抬眼望着”保留具体画面；福宣采用“有福了”的圣经语域，但避免古奥表达。
