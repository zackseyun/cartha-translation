  to: 全体群众都设法触摸他，因为有能力从他身上发出[a]，医治众人。
  rationale: 修订以“全体群众都设法触摸他”传达πᾶς ὁ ὄχλος与ἐζήτουν的集体性和持续尝试；保留“能力”对应δύναμις及其从耶稣而出的具象表述；以“医治众人”清楚地使从他发出的能力承担医治作用。脚注仍锚定“发出”，并只提供原文措辞的可行替代，不作神学扩展。
