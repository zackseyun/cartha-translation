  text: καὶ πᾶς ὁ ὄχλος ⸀ἐζήτουν ἅπτεσθαι αὐτοῦ, ὅτι δύναμις παρ’ αὐτοῦ ἐξήρχετο καὶ ἰᾶτο πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/019.yaml
  text: And the whole crowd was trying to touch him[a], because power was coming out from him and healing them all.
translation:
  language: zh_hans
  text: 全体群众都设法触摸他，因为有能力从他身上发出[a]，医治众人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从他那里出来。”
    reason: 原文παρ’ αὐτοῦ ἐξήρχετο可较贴近字面地译为“从他那里出来”；正文“从他身上发出”较符合现代汉语，并保留能力源自他的意思。
lexical_decisions:
- source_word: πᾶς ὁ ὄχλος
  choice: 群众都
  rationale: 以现代汉语自然的总括结构表达单数集合名词加 πᾶς，保留全体群众都参与其中的意思。
- source_word: ἐζήτουν
  choice: 想
  rationale: 结合不定式表示群众持续设法接触耶稣；汉语“都想摸他”自然地传达当时持续的意愿和行动，不强加“不断”等更强语气。
- source_word: ἅπτεσθαι
  choice: 摸
  rationale: 在求医治的接触语境中，ἅπτομαι 的基本意思是触摸；“摸”通俗自然，也不增添“抓住”的含义。
- source_word: δύναμις
  choice: 能力
  rationale: 保留 δύναμις 的有效力量之意；“能力”在此可由医治语境明确其超常功效，同时避免增译“神奇的”。
- source_word: παρ’ αὐτοῦ ἐξήρχετο
  choice: 从他身上发出
  rationale: 表达能力以持续方式源自耶稣；“从他身上发出”在现代汉语中自然，并保留原文形象而不解释其机制。
- source_word: ἰᾶτο
  choice: 医治
  rationale: 未加完成体标记，配合上下文表达能力当时持续产生医治功效，避免把未完成时静默改成一次性的完成动作。
- source_word: πάντας
  choice: 他们所有人
  rationale: 明确其复数所指为相关人群，并完整保留“所有人”的范围。
theological_decisions:
- issue: 从耶稣发出的 δύναμις 的性质
  choice: 有能力从他身上发出
  alternative: 有神奇的能力从他身上发出
  rationale: 原文直接把具有医治功效的能力呈现为从耶稣而出，但没有加上“神奇的”等限定；译文保留这一陈述及其张力，不进一步说明能力的本体或运作方式。
- issue: “医治所有人”的范围
  choice: 医治他们所有人
  alternative: 医治每一个人
  rationale: πάντας 表示全体，但本节的语境范围由现场群众及前文前来求医治的人限定；译文保留全称表达，却不将其扩大为无语境限制的普遍命题。
translation_notes:
  register: 采用庄重而通俗的现代标准汉语。“群众都想摸他”简明自然；“能力从他身上发出”保留原文鲜明形象。脚注标记放在其实际对应的短语之后。
