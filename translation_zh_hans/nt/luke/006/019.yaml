  naturalness: “有能力从他身上发出”可理解，但略显生硬；改为“有能力从他身上发出，医治众人”更符合庄重、清晰的现代汉语。以“设法触摸”表达群众的动作，既自然也更贴近原文语气。
  terminology: “能力”可对应δύναμις，无须增添“神奇的”或其他教义性限定。“医治众人”准确保留ἰᾶτο πάντας的范围，并由上下文限定为在场相关人群。
