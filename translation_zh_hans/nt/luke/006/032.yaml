  text: Καὶ εἰ ἀγαπᾶτε τοὺς ἀγαπῶντας ὑμᾶς, ποία ὑμῖν χάρις ἐστίν; καὶ γὰρ οἱ ἁμαρτωλοὶ τοὺς ἀγαπῶντας αὐτοὺς ἀγαπῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/032.yaml
  text: And if you love those who love you[a], what credit is that to you? For even sinners love those who love them.
translation:
  language: zh_hans
  text: “你们若爱那些爱你们的人，你们有什么可称许的呢？因为连罪人也爱那些爱他们的人。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαπᾶτε / ἀγαπῶντας / ἀγαπῶσιν
  choice: 爱
  rationale: 三处均译作“爱”，保留原文刻意的词语重复和修辞对照；“关爱”会削弱这里互爱的直接性。
- source_word: ποία
  choice: 什么
  rationale: 在反问句“有什么可称许的”中自然表达“何种、什么样的”，不作不必要的扩译。
- source_word: χάρις
  choice: 可称许的
  rationale: 此处指因行为而得到的认可、称许，而非主要指救恩意义上的“恩典”；采用形容性表达，使现代汉语自然，同时保留反问的伦理重点。
- source_word: ἁμαρτωλοὶ
  choice: 罪人
  rationale: 准确保留原文的道德类别，也是新约语境中自然、通行的译法。
- source_word: καὶ γὰρ
  choice: 就是……也
  rationale: 以现代汉语惯用结构同时体现γάρ的说明作用和καί的强调作用。
- source_word: ὑμῖν
  choice: 在你们
  rationale: 与“有什么可称许的”搭配，表达此事对听众而言能得到何种认可；比逐字译为“给你们”更符合汉语习惯。
theological_decisions:
- issue: χάρις在耶稣这句话中的含义
  choice: 称许、认可
  alternative: 恩典；感谢；好处
  rationale: 上下文所问的是，只爱那些爱自己的人有何值得认可之处。译作“恩典”容易使现代读者首先联想到救恩论含义，而这并非本句前景；正文采用“可称许的”，脚注保留“恩惠”等词义可能。
translation_notes:
  register: 采用现代、庄重而易懂的口语化书面语。保留三次“爱”的重复，并用“就是……也……”呈现原文的强调。χάρις在正文中按语境译为“可称许的”，同时以脚注保留其较宽的词义范围。
