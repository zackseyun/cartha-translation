  text: ⸀καὶ Ἰούδαν Ἰακώβου καὶ Ἰούδαν ⸀Ἰσκαριὼθ ⸀ὃς ἐγένετο προδότης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/016.yaml
  text: and Judas son of James[a], and Judas Iscariot, who became a traitor.
translation:
  language: zh_hans
  text: 又有雅各的儿子犹大[a]，还有加略人犹大；他成了叛徒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“雅各的兄弟犹大”；希腊文只说“雅各的犹大”。
    reason: 原文的属格没有明说两人是父子还是兄弟关系。
lexical_decisions:
- source_word: Ἰούδαν Ἰακώβου
  choice: 雅各的儿子犹大
  rationale: 希腊文直译是“雅各的犹大”，属格所指的亲属关系被省略。门徒名单中通常理解为“雅各的儿子犹大”；正文补出“儿子”以符合现代汉语习惯，同时用脚注保留原文的含混性。
- source_word: Ἰσκαριὼθ
  choice: 加略人
  rationale: 按现代中文圣经传统，将这一名称译作“加略人”，既保留其专名性质，也便于普通读者辨认。
- source_word: ὃς ἐγένετο
  choice: 他后来成了
  rationale: ἐγένετο具有“成为”的动态含义；“后来成了”既保留其变化过程，也自然表达这是对名单中此人的后续说明。
- source_word: προδότης
  choice: 叛徒
  rationale: 该词指背叛者。“叛徒”简洁自然，并与“成了”搭配顺畅。
- source_word: καὶ
  choice: 又有；还有
  rationale: 重复的καὶ承接名单并连接最后两个人名；依现代汉语列举习惯分别译为“又有”和“还有”。
theological_decisions:
- issue: Ἰακώβου在“雅各的犹大”中所表示的关系
  choice: 正文译作“雅各的儿子犹大”
  alternative: “雅各的兄弟犹大”；或较生硬地直译“雅各的犹大”
  rationale: 希腊文只用属格，没有明说是儿子还是兄弟。按此类名单的一般表达，“儿子”较可能，也最适合作为自然汉语正文；但不把这一判断绝对化，脚注明确保留另一种可能。
translation_notes:
  register: 采用现代、庄重而易懂的名单体表达。“又有……还有……”承接上文列举；分号使“他后来成了叛徒”明确回指加略人犹大。
