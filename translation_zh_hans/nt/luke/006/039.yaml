  text: Εἶπεν δὲ ⸀καὶ παραβολὴν αὐτοῖς· Μήτι δύναται τυφλὸς τυφλὸν ὁδηγεῖν; οὐχὶ ἀμφότεροι εἰς βόθυνον ⸀ἐμπεσοῦνται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/039.yaml
  text: 'And he also told them a parable: “Can a blind man guide a blind man? Will not both fall into a pit?”[a][b]'
translation:
  language: zh_hans
  text: 他又给他们讲了一个比喻：“盲人岂能给盲人领路？他们两人不都会掉进坑里吗？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “坑”也可译作“沟”。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: 又
  rationale: 与 δὲ 连用，在叙事中自然表达附加推进之意，表明耶稣接着又讲了一个比喻。
- source_word: παραβολὴν
  choice: 比喻
  rationale: 这是福音书中该词的常见体裁用语，既准确又为现代普通读者熟悉。
- source_word: Μήτι δύναται
  choice: 岂能
  rationale: Μήτι 引出预期否定答案的反问；“岂能”简洁、庄重，并保留其反问力度。
- source_word: τυφλὸς ... τυφλὸν
  choice: 瞎子……瞎子
  rationale: 原文以阳性单数名词化形容词作泛指。汉语“瞎子”本身不标语法性别，能自然保留谚语式的泛指表达。
- source_word: ὁδηγεῖν
  choice: 领路
  rationale: 贴合一个人引导另一个人行路的具体画面，比抽象的“指导”更准确自然。
- source_word: οὐχὶ
  choice: 不……吗
  rationale: 构成预期肯定答案的反问，与前一句预期否定答案的反问形成自然对应。
- source_word: ἀμφότεροι
  choice: 两个人都
  rationale: 明确表达两者无一例外，也使汉语句意清楚。
- source_word: βόθυνον
  choice: 坑
  rationale: 该词可指坑或沟；“坑”含义较宽，画面鲜明，也符合现代汉语习惯。
- source_word: ἐμπεσοῦνται
  choice: 会掉进
  rationale: 自然表达将来的结果，并准确体现 εἰς 所表达的进入方向。
theological_decisions:
- issue: τυφλός 的阳性单数泛指形式
  choice: 译作“瞎子……瞎子”，不另加性别限定
  alternative: 译作“盲人……盲人”或“一个瞎眼的人……另一个瞎眼的人”
  rationale: 希腊语形式虽为阳性单数，却在谚语式问句中具有代表性泛指作用。现代汉语“瞎子”不标明男性，既不缩小适用范围，也不需添加原文没有的性别信息。
translation_notes:
  register: 采用现代、简洁而庄重的口语化叙述。“讲了一个比喻”符合现代汉语表达；两句反问分别用“岂能”和“不……吗”，保留原文相反的预期回答方向。主文中的脚注标记与脚注完全对应。
