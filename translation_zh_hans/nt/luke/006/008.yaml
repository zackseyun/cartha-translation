  text: αὐτὸς δὲ ᾔδει τοὺς διαλογισμοὺς αὐτῶν, ⸂εἶπεν δὲ⸃ τῷ ⸀ἀνδρὶ τῷ ξηρὰν ἔχοντι τὴν χεῖρα· ⸀Ἔγειρε καὶ στῆθι εἰς τὸ μέσον· ⸀καὶ ἀναστὰς ἔστη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/008.yaml
  text: But he knew their thoughts[a], and he said to the man who had the withered hand[c][b], “Get up and stand in the middle.” And he got up and stood there.
translation:
  language: zh_hans
  text: 耶稣却知道他们的心思[a]，就对那只手萎缩的男人[b]说：“起来，站到中间去[c]。”那人就起来，站在那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他们的盘算”。
    reason: lexical_alternative
  - marker: b
    text: 或译“那只手枯干的男人”。
    reason: lexical_alternative
  - marker: c
    text: 直译“进入中间”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: 知道
  rationale: οἶδα 的这一形式在此具有现在意义；“知道”自然、直接地陈述耶稣知悉他们内心所想，而不解释这种知识的来源。
- source_word: διαλογισμοὺς
  choice: 心思
  rationale: 该词可指思想、推想或内心盘算。“心思”在现代汉语中自然，也保留了原词所容纳的范围；脚注列出“盘算”这一较强调思量过程的译法。
- source_word: ἀνδρὶ
  choice: 人
  rationale: 上下文已用“那个……的人”明确指向特定人物；现代汉语这样表达自然，不必机械译作“男人”。
- source_word: ξηρὰν ... τὴν χεῖρα
  choice: 一只手萎缩
  rationale: ξηρός 用于肢体时指枯干、萎缩。“一只手萎缩”清楚、自然，并避免把病症解释得过于具体。
- source_word: Ἔγειρε
  choice: 起来
  rationale: 保留第一个命令所表达的起身动作，并与随后表示站立的 στῆθι 区分。
- source_word: στῆθι
  choice: 站
  rationale: 译出第二个独立命令，保留“起来”与“站”的两步表达。
- source_word: εἰς τὸ μέσον
  choice: 到中间来
  rationale: εἰς 带有朝向中间、进入众人当中的动态意味；“到中间来”符合汉语现场命令的自然说法。
- source_word: ἀναστὰς ἔστη
  choice: 就起来，站在那里
  rationale: 分别译出起身和站立两个连续动作；补出“在那里”使汉语自然，其所指来自前句的“中间”。
theological_decisions:
- issue: 耶稣知道他人的内心所想
  choice: 直接译为“耶稣却知道他们的心思”
  alternative: 译为“耶稣看出了他们的意图”或加入“凭超自然能力”等说明
  rationale: 原文断言耶稣知道他们的内心思想，却没有交代他如何知道；译文保留这一陈述，不额外解释其机制。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“起来，站到中间来”保留原文两个命令及方向感；“那人就起来，站在那里”保留回应中的两个连续动作。
