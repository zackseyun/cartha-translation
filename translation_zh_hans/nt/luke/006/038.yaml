  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: δίδοτε, καὶ δοθήσεται ὑμῖν· μέτρον καλὸν πεπιεσμένον ⸀σεσαλευμένον ὑπερεκχυννόμενον δώσουσιν εἰς τὸν κόλπον ὑμῶν· ⸂ᾧ γὰρ μέτρῳ⸃ μετρεῖτε ἀντιμετρηθήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/038.yaml
  text: 'Give[a], and it will be given to you: a good measure—pressed down, shaken together, overflowing—they will give into your lap. For with the measure by which you measure[b], it will be measured back to you.'
translation:
  language: zh_hans
  text: 你们要给，也会给你们：人会把一份好量——压紧了，摇实了，满得溢出来[a]——装进你们的衣襟里[b]。因为你们用什么量器来量，也必用什么量器量给你们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“流溢出来”。这里描绘容器装得极满，里面的东西已经溢出的情景。
    reason: lexical_alternative
  - marker: b
    text: “衣襟”指长袍前面折起后形成的兜囊，古人可用它盛接量好的谷物等物品。
    reason: cultural_note
lexical_decisions:
- source_word: δίδοτε
  choice: 你们要给人
  rationale: 现在时主动命令语气复数。汉语用“要给人”自然表达普遍性的劝勉；不另加“不断”，以免把希腊语体貌解释得过实。补出“人”作为接受者，使汉语完整，但不把所给之物限定为金钱。
- source_word: δοθήσεται ὑμῖν
  choice: 也必有给你们的
  rationale: 保留将来被动及未明说的施予者，也与下文不定主语“人会……”衔接；“必”表达此处将来陈述的确定语气。
- source_word: μέτρον καλὸν
  choice: 足足的分量
  rationale: μέτρον可指量器或量出的分量；这里随后描写压紧、摇实和溢出，译作“足足的分量”较符合现代汉语，并保留充足而不直接引申为财富回报。后半句则用“量器”保留衡量工具的比喻。
- source_word: πεπιεσμένον
  choice: 压紧了
  rationale: 表达把谷物等压实以容纳更多的市场计量图景，并体现完成时被动分词所描写的状态。
- source_word: σεσαλευμένον
  choice: 摇实了
  rationale: 不是泛指摇动，而是摇晃容器，使其中货物下沉落实；“摇实”简洁传达这一语境含义。
- source_word: ὑπερεκχυννόμενον
  choice: 满得溢出来
  rationale: 保留现在分词所呈现的持续、鲜明图景：容器装得过满，内容物正在外溢。
- source_word: δώσουσιν
  choice: 人会……装进
  rationale: 希腊语为第三人称复数、主语未指明。汉语以泛指的“人”保留不定施事者，不改成明确的神圣被动。结合衣襟盛物的图景，以“装进”自然表达δώσουσιν εἰς。
- source_word: εἰς τὸν κόλπον ὑμῶν
  choice: 装进你们的衣襟里
  rationale: κόλπος在此指长袍前襟形成、可盛接货物的兜囊。“衣襟里”比现代汉语的“怀里”更能保留古代生活图景，并用脚注说明。
- source_word: ᾧ γὰρ μέτρῳ μετρεῖτε
  choice: 因为你们用什么量器量给人
  rationale: 保留量器与衡量的重复比喻。补出“给人”使汉语中的互惠关系清楚，但不限定所量的是钱财。
- source_word: ἀντιμετρηθήσεται ὑμῖν
  choice: 也必用什么量器量给你们
  rationale: ἀντι-带有回量、照样量还的互惠意味；汉语借前后平行结构自然呈现，不额外加入“报偿”等神学解释。
theological_decisions:
- issue: 这句话是否专指金钱或周济
  choice: 保留广义的“给”，不限定为金钱、施舍或物质奉献。
  alternative: 译成专指周济穷人或金钱奉献的命令。
  rationale: 本节希腊文没有明说所给之物，而上下文涉及怜悯、不论断、不定罪和饶恕。宽泛译法保留其语境张力，也避免导入成功神学式的物质回报观。
- issue: 未明说的回报施予者是否应明确译为上帝
  choice: 保留泛指主语“人”，不在正文中点明上帝。
  alternative: 把被动式和不定复数统一解释为“上帝必给你们”。
  rationale: δοθήσεται是被动式，δώσουσιν则是不定主语的第三人称复数。经文可能容许神圣被动的理解，但没有明说施事者，因此译文不替原文消除这一含混。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“足足的分量——压紧了，摇实了，满得溢出来——”保留原文层层加强的节奏；“量器量给人／量给你们”保留结尾的对称和互惠比喻。脚注标记均置于正文对应词句之后。
