  terminology: “判断”与“定罪”保持由一般判断到不利裁断的递进。“宽免／蒙宽免”保留ἀπολύω在此处可指释放、赦免或免除追究的开放性；脚注列出“饶恕”和“释放”等可行理解，而不把任一解释强加于正文。
