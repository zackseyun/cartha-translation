  rationale: 修订“评断”为更自然的“判断”，并将容易产生人身释放联想的“释放／得释放”改为“宽免／蒙宽免”。这在判断和定罪的紧邻语境中更准确地表达免除追究或责罚，同时借脚注保留该词的“释放”及“饶恕”可能性。
