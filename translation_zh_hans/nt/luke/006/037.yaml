  text: Καὶ μὴ κρίνετε, καὶ οὐ μὴ κριθῆτε· ⸀καὶ μὴ καταδικάζετε, καὶ οὐ μὴ καταδικασθῆτε. ἀπολύετε, καὶ ἀπολυθήσεσθε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/037.yaml
  text: And do not judge[a], and you will certainly not be judged; and do not condemn, and you will certainly not be condemned. Forgive, and you will be forgiven.
translation:
  language: zh_hans
  text: “不要判断人，你们就绝不会被判断；不要定人的罪，你们就绝不会被定罪。要宽免人[a]，你们也必蒙宽免。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “宽免”所译的希腊词也可指“释放”“放走”或“使自由”；在本节的语境中，也可理解为“饶恕”或“赦免”：要饶恕人，你们也必蒙饶恕。
    reason: 保留ἀπολύω可指释放、免除或赦免的语义范围，并说明本语境中合理的“饶恕”理解。
lexical_decisions:
- source_word: κρίνετε
  choice: 评断人
  rationale: κρίνω可指判断、评断或审断；“评断人”在现代汉语中自然，也保留了它与后文较强的“定罪”之间的层次差别。原文未明说宾语，汉语补出泛指的“人”以使表达完整。
- source_word: οὐ μὴ κριθῆτε
  choice: 你们就绝不会受评断
  rationale: οὐ μή加虚拟式构成强烈否定；“绝不会”传达其强调语气，“受评断”则对应原文的被动形式。
- source_word: καταδικάζετε
  choice: 定人的罪
  rationale: καταδικάζω比κρίνω语义更强，指判定有罪或谴责；“定人的罪”既清楚表达递进，也符合现代庄重汉语。
- source_word: οὐ μὴ καταδικασθῆτε
  choice: 你们就绝不会被定罪
  rationale: 以“绝不会”保留οὐ μή的强调，以“被定罪”准确对应被动语态，并与前半句形成平行。
- source_word: ἀπολύετε
  choice: 释放人
  rationale: ἀπολύω的语义范围包括释放、放走、解除，也可能在本语境中表示饶恕。“释放人”保留较宽的词义，不在正文中把含义限定为饶恕；补出泛指宾语使汉语自然。
- source_word: ἀπολυθήσεσθε
  choice: 你们也必得释放
  rationale: “得释放”保留被动意义，并与“释放人”形成原文所具有的词语呼应；“必”自然表达此处应许式将来的确定性。
- source_word: καὶ
  choice: 就／也
  rationale: 重复的καί连接命令与结果。汉语以“就”和“也”呈现相应关系和排比节奏，比逐一译成“并且”更自然。
theological_decisions:
- issue: ἀπολύετε在本节应窄译为“饶恕”，还是宽译为“释放”
  choice: 正文译作“释放人”
  alternative: “饶恕人”或“宽免人”
  rationale: 该词本身可指释放、放走或解除；在评断和定罪的上下文中，也可理解为免除追究或饶恕。正文采用较宽的“释放”，保存原文的语义张力；脚注说明常见且合乎语境的“饶恕”理解。
- issue: 两处οὐ μή是否表达强调否定
  choice: 译作“绝不会”
  alternative: 较平的“不会”
  rationale: οὐ μή与不定过去时虚拟式在此构成强烈否定。译作“绝不会”可传达其力度，而不额外指明评断或定罪的施行者。
translation_notes:
  register: 采用现代、庄重且便于普通读者理解的简体中文。以分号呈现两个彼此平行的禁令和结果，再以短句收束。正文保留原文从“评断”到“定罪”的语义递进，并以“绝不会”体现两处强调否定。
