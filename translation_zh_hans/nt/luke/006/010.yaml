  text: καὶ περιβλεψάμενος πάντας αὐτοὺς εἶπεν αὐτῷ· Ἔκτεινον τὴν χεῖρά σου· ὁ δὲ ἐποίησεν, καὶ ἀπεκατεστάθη ἡ χεὶρ ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/010.yaml
  text: And after looking around at them all[a], he said to him, “Stretch out your hand.” And he did so, and his hand was restored.
translation:
  language: zh_hans
  text: 他环视众人之后，对那人说：“伸出你的手。”那人就伸出手来，他的手便复原了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他的手便治好了。”希腊原文更直译为“他的手便复原了”，强调恢复到正常状态。
    reason: lexical_alternative
lexical_decisions:
- source_word: περιβλεψάμενος
  choice: 环视……之后
  rationale: 不定过去时中间语态分词表示耶稣先环顾在场的人，随后说话；“环视……之后”自然保留动作次序。
- source_word: πάντας αὐτούς
  choice: 众人
  rationale: 保留“所有人”的整体意味，同时符合现代汉语叙事表达。
- source_word: εἶπεν αὐτῷ
  choice: 对那人说
  rationale: 忠实表达带与格对象的“说”；根据上下文以“那人”清楚指向枯手的人，而不增加身份解释。
- source_word: Ἔκτεινον τὴν χεῖρά σου
  choice: 伸出你的手
  rationale: 准确表达不定过去时主动命令式及 χείρ 的通常含义，语气直接自然。
- source_word: ὁ δὲ ἐποίησεν
  choice: 那人就伸出手来
  rationale: ποιέω 在此指执行刚才的命令；汉语将所做之事明说，比直译“他就这样做了”更流畅。δέ 在此为轻微承接，以“就”体现。
- source_word: ἀπεκατεστάθη
  choice: 复原了
  rationale: 该被动动词强调恢复到原有或正常状态；“复原”比笼统的“治好了”更贴近词义。
- source_word: ἡ χεὶρ αὐτοῦ
  choice: 他的手
  rationale: 保留原文再次明确提到“手”的表达，突出神迹的结果。
theological_decisions:
- issue: ἀπεκατεστάθη 对神迹结果的表述
  choice: 他的手便复原了
  alternative: 他的手便治好了
  rationale: 选择恢复、复原的措辞，以保留希腊动词所强调的回归正常状态；不把它收窄为明确的医疗术语，同时仍清楚表达神迹。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“环视众人之后”保留原文分词所表达的先后关系；“那人就伸出手来”以自然汉语明确承接命令。脚注标记置于相关结果句之后。
