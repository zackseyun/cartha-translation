source:
  edition: SBLGNT
  text: πᾶς ὁ ἐρχόμενος πρός με καὶ ἀκούων μου τῶν λόγων καὶ ποιῶν αὐτούς, ὑποδείξω ὑμῖν τίνι ἐστὶν ὅμοιος·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/047.yaml
  text: Everyone who comes to me and hears my words and does them—I will show you what he is like:[a][b]
translation:
  language: zh_hans
  text: 凡到我这里来，听见我的话又照着做的人，我要告诉你们，他像什么人：[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文采用阳性单数形式作泛指，指任何到耶稣这里、听见他的话并照着做的人，并非只限男性。
    reason: cultural_note
lexical_decisions:
- source_word: πᾶς ὁ ἐρχόμενος πρός με
  choice: 凡到我这里来……的人
  rationale: πᾶς 加带冠词的分词构成泛指，涵盖每一个符合条件的人；“凡……的人”在现代汉语中自然，并保留普遍范围。πρός με 表示朝向并来到耶稣这里。
- source_word: ἀκούων μου τῶν λόγων
  choice: 听见我的话
  rationale: μου 与 τῶν λόγων 在此自然理解为所属或来源关系。“听见”直接对应 ἀκούων，也与下文“照着做”形成清楚的听与行之对照。
- source_word: λόγων
  choice: 话
  rationale: 此处指耶稣所说的教导。“话”比“言语”更符合现代汉语，同时没有把复数 λόγων 过度概括成单数的“信息”。
- source_word: ποιῶν αὐτούς
  choice: 照着做
  rationale: ποιέω 以所听见的话为宾语，表示实行或遵行。“照着做”比直译“做它们”自然，又保留从听见到实践的意义。
- source_word: ὑποδείξω ὑμῖν
  choice: 我要告诉你们
  rationale: ὑποδείκνυμι 在这里引出随后的比喻，含有指明、说明之意；汉语“告诉你们”自然清楚，且不把表达强化为视觉性的“展示”。
- source_word: τίνι ἐστὶν ὅμοιος
  choice: 他像什么人
  rationale: τίνι 是疑问代词的与格，形式上意为“与谁相像”。“像什么人”是自然汉语，并为下一节具体的人物比喻留下衔接。
- source_word: masculine singular participles / ὅμοιος
  choice: 他
  rationale: 希腊文用阳性单数作泛指。汉语“凡……的人……他”可保留代表性单数，同时按语境涵盖任何这样的人。
theological_decisions:
- issue: 听道与实行之间的关系
  choice: 译作“听见我的话又照着做”
  alternative: 译作“听从我的话”或“遵行我的话”
  rationale: 原文分别使用 ἀκούων 与 ποιῶν，刻意保留“听”与“行”两个动作。译文不将二者合并，以免预先消解耶稣所强调的对照与关联。
- issue: 泛指阳性单数
  choice: 在比较分句中使用“他”
  alternative: 重复“这个人”，或省略代词
  rationale: 原文以阳性单数形式泛指任何到耶稣这里、听见并实行的人。“他”保留代表性单数，不将原文改成复数；脚注说明其泛指功能，避免误解为只指男性。
translation_notes:
  register: 采用现代、庄重而通俗的普通话。“凡……的人”适合格言式教导；“照着做”自然表达实行所听之话。“他像什么人”保留原文的单数比较结构，并由脚注说明泛指用法。
