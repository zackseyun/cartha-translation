  text: αὐτοὶ δὲ ἐπλήσθησαν ἀνοίας, καὶ διελάλουν πρὸς ἀλλήλους τί ἂν ποιήσαιεν τῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/011.yaml
  text: But they were filled with rage[a], and they discussed with one another what they might do to Jesus.
translation:
  language: zh_hans
  text: 可是，他们却满心愤怒，失去理智[a]，彼此商议要对耶稣做什么。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“满心愚妄”或“满心狂乱”。希腊语原词可指无理性、愚妄或狂乱；本句的上下文显示他们带着强烈敌意。
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ δὲ
  choice: 可是，他们却
  rationale: δὲ承接上文并形成鲜明反差；αὐτοὶ带强调意味。用“可是……却”在现代汉语中自然地传达这种对比，而不生硬地译作“他们自己”。
- source_word: ἐπλήσθησαν ἀνοίας
  choice: 被狂怒冲昏了头
  rationale: 保留“充满”这一被动意象的功能，同时表达ἄνοια所含的失去理性、愚妄乃至狂乱之意，以及本语境中的强烈敌意。此译法避免把词义临床化为精神疾病。
- source_word: διελάλουν πρὸς ἀλλήλους
  choice: 彼此商议
  rationale: διελάλουν为未完成时，描写持续或反复的相互商谈；“彼此商议”简洁、自然，并保留共同谋划的意味。
- source_word: τί ἂν ποιήσαιεν
  choice: 要怎样对付
  rationale: τί加ἄν和希求语气表达间接的商议与可能性。“要怎样”体现他们正在盘算；“对付”传达语境中的敌意，但不具体断定他们计划采取何种行动。
- source_word: τῷ Ἰησοῦ
  choice: 耶稣
  rationale: 此与ποιέω连用的与格表示行动所针对的对象；结合“对付”译出为“对付耶稣”，符合现代汉语习惯。
theological_decisions:
- issue: ἄνοια应侧重“狂怒”、失去理性，还是“愚妄”
  choice: 被狂怒冲昏了头
  alternative: 满心愚妄；陷入狂乱；充满愤怒
  rationale: 原词核心涉及无理性、愚妄或狂乱，语境又显示强烈敌意。正文兼顾认知失常与情绪激烈，脚注保留“愚妄、狂乱”等真实词义范围，避免将其解释为现代临床意义上的精神疾病。
- issue: τί ἂν ποιήσαιεν τῷ Ἰησοῦ是否明确指伤害耶稣
  choice: 要怎样对付耶稣
  alternative: 可以怎样处置耶稣；要对耶稣做什么
  rationale: 上下文清楚带有敌意，但原文没有明说具体伤害方式。“对付”保留敌对方向而不把计划具体化。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“被狂怒冲昏了头”比直译“充满无知”更符合当代汉语，也保留原文中失去理性与强烈敌意相结合的张力。
