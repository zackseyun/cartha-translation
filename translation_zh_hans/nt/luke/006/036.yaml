  text: ⸀γίνεσθε οἰκτίρμονες ⸀καθὼς ὁ πατὴρ ὑμῶν οἰκτίρμων ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/036.yaml
  text: Be merciful[a], just as your Father is merciful.
translation:
  language: zh_hans
  text: 你们要心存怜悯[a]，正如你们的父心存怜悯一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“富有同情心”。希腊语形容词可指因同情而施怜悯的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: γίνεσθε
  choice: 要
  rationale: 这是现在时命令语气，表达持续践行的劝命。现代汉语用“要”构成自然、明确的命令句；无需生硬译作“成为”。
- source_word: οἰκτίρμονες / οἰκτίρμων
  choice: 怜悯人
  rationale: 该形容词指因同情而向人施怜悯。汉语用“怜悯人”自然地表达这种品格与行动，并在前后两处保持同一措辞。
- source_word: καθὼς
  choice: 正如……一样
  rationale: 明确表达比较与效法关系，以父的怜悯作为门徒行事的典范，而不改译为因果关系。
- source_word: ὁ πατὴρ ὑμῶν
  choice: 你们的父
  rationale: 忠实保留原文简洁的“你们的父”，不从平行经文增添“天上的”。
theological_decisions:
- issue: 命令与父之品格的关系
  choice: 将καθὼς译为“正如……一样”，表明父的怜悯是门徒的行为典范。
  alternative: 译为“因为你们的父怜悯人”，理解为因果关系。
  rationale: καθὼς在此最自然地表达比较；这样既保留伦理效法的含义，也不加入原文未明说的因果解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“怜悯人”比单用可能略显抽象的“仁慈”更清楚地体现对人的同情与施怜悯；全句保留第二人称复数“你们”，并维持原文前后对应的结构。
