  text: τῷ τύπτοντί σε ἐπὶ τὴν σιαγόνα πάρεχε καὶ τὴν ἄλλην, καὶ ἀπὸ τοῦ αἴροντός σου τὸ ἱμάτιον καὶ τὸν χιτῶνα μὴ κωλύσῃς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/029.yaml
  text: To the one who strikes you on the cheek[a], offer the other also; and from the one who takes away your cloak[c][b], do not withhold your tunic also.
translation:
  language: zh_hans
  text: 有人打你一边脸，就把另一边也给他；有人拿走你的外衣，也不要拦阻他拿走你的里衣。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “外衣”指穿在外面的衣服；“里衣”指穿在外衣里面、贴身的长衣，并非特指现代意义的内衣。
    reason: cultural_note
lexical_decisions:
- source_word: τῷ τύπτοντί σε
  choice: 有人打你
  rationale: 带冠词的现在分词泛指实施这一动作的人；汉语用“有人打你”自然简洁，并保留泛指语气。
- source_word: ἐπὶ τὴν σιαγόνα
  choice: 一边脸
  rationale: σιαγών可指面颊或下颌；此处指脸部受击。“一边脸”既符合现代汉语习惯，也为下文“另一边”提供自然照应。
- source_word: πάρεχε καὶ τὴν ἄλλην
  choice: 连另一边也由他打
  rationale: παρέχω本义为提供、交出或任其使用，并非“转过去”。在受击语境中，“由他打”自然表达主动不加拦阻地把另一边也交出的意思，同时避免借用《马太福音》的措辞。
- source_word: ἀπὸ τοῦ αἴροντός σου
  choice: 有人拿走你的
  rationale: αἴρω在此表示取走、拿走；“有人……你的”自然呈现带冠词分词的泛指结构。
- source_word: τὸ ἱμάτιον
  choice: 外衣
  rationale: ἱμάτιον指穿在外面的衣物；“外衣”准确、通俗，并能与χίτων形成清楚区别。
- source_word: τὸν χιτῶνα
  choice: 你的内衣
  rationale: χίτων指贴身穿着、位于外衣里面的衣服。现代汉语“内衣”容易理解，但可能被读作现代贴身衣物，故以脚注说明古代服饰含义。
- source_word: μὴ κωλύσῃς
  choice: 也不要拦阻他拿
  rationale: κωλύω意为阻止、妨碍。译作“不要拦阻”贴近原词，也比“不要扣留”更符合有人正在取走衣物的情境。
theological_decisions:
- issue: 是否采用与《马太福音》相协调的“把另一边也转过去”
  choice: 保留路加的独特表达，以“连另一边也由他打”体现πάρεχε
  alternative: 把另一边脸也转过去让他打
  rationale: 原文用πάρεχε（提供、交出），不是表示“转”的动词；译文不应以平行经文替换路加的措辞。
- issue: 是否给这些命令添加有关不报复、夸张法或适用范围的解释
  choice: 直接保留命令的力度，不在正文中添加限定
  alternative: 在正文中解释为“不报复”或加入适用条件
  rationale: 原文直接使用命令语气；译文应保留耶稣教导所具有的张力，不预先裁定其伦理应用方式。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“一边脸／另一边”避免生硬重复；“由他打”在汉语中自然呈现πάρεχε的交出、不拦阻之意。正文保留两个命令的直接性及其伦理张力。
