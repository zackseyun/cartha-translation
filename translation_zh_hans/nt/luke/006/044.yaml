  source_fidelity: 译文整体准确保留了逐一性的“每一棵树”、以果子辨识树的被动/通则表达，以及两项否定的农业谚语。惟“蒺藜丛”对 βάτος 过度具体化；βάτος指带刺的灌木、悬钩子类/荆棘类灌木，不能安全地确定为蒺藜。
