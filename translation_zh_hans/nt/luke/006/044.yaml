  text: ἕκαστον γὰρ δένδρον ἐκ τοῦ ἰδίου καρποῦ γινώσκεται· οὐ γὰρ ἐξ ἀκανθῶν συλλέγουσιν σῦκα, οὐδὲ ἐκ βάτου ⸂σταφυλὴν τρυγῶσιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/044.yaml
  text: For each tree is known by its own fruit[a]. For they do not gather figs from thorns[b], nor do they harvest grapes from a bramble bush.
translation:
  language: zh_hans
  text: 因为每一棵树都凭自己的果子被认出来；人不会从荆棘中摘无花果，也不会从刺灌木上采收葡萄。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕκαστον ... δένδρον
  choice: 每一棵树
  rationale: ἕκαστον与单数名词搭配，具有逐一、分配的意味；“每一棵树”自然保留这一强调。
- source_word: γὰρ
  choice: 因为
  rationale: 首个γάρ说明本节与上文之间的解释关系。第二个γάρ在中文中不必机械重复，可借分号和后句的例证关系自然表达。
- source_word: ἐκ τοῦ ἰδίου καρποῦ γινώσκεται
  choice: 凭自己的果子被认出来
  rationale: “凭”自然表达ἐκ在辨认依据上的功能；“自己的”保留ἰδίου所强调的树与其所结果子之间的对应关系；被动式也得到保留。
- source_word: ἀκανθῶν
  choice: 荆棘
  rationale: 该复数词泛指有刺植物；“荆棘”是现代汉语中简洁、熟悉且不过度限定物种的表达。
- source_word: συλλέγουσιν σῦκα
  choice: 摘无花果
  rationale: 在中文农业语境中，“摘”比笼统的“收集”更自然，并准确表达采集果实。
- source_word: ἐκ βάτου
  choice: 从蒺藜丛里
  rationale: βάτος指一类有刺的灌木或荆棘丛。“蒺藜丛”传达其刺灌木性质，同时避免仅译作泛泛的“灌木”。
- source_word: σταφυλὴν τρυγῶσιν
  choice: 采葡萄
  rationale: τρυγάω用于采收成熟果实，尤常用于葡萄；“采葡萄”符合现代汉语习惯。希腊文虽用单数，中文以集合意义的“葡萄”表达最自然。
theological_decisions:
- issue: 果子意象的比喻力量
  choice: 保留农业谚语本身，不在译文中明说它指人的品格、行为或教导。
  alternative: 解释性扩写为“人的品格或行为显明他是怎样的人”。
  rationale: 原文只陈述树与果子的对应关系；其道德和属灵应用由上下文显明。保留意象可避免超出原文，也保留其修辞张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“凭自己的果子被认出来”略带书面色彩，以保留原文的被动结构和谚语语气；后半句使用日常可懂的采摘用语。
