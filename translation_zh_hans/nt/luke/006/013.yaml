id: LUK.6.13
reference: Luke 6:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ὅτε ἐγένετο ἡμέρα, προσεφώνησεν τοὺς μαθητὰς αὐτοῦ, καὶ ἐκλεξάμενος ἀπ’ αὐτῶν δώδεκα, οὓς καὶ ἀποστόλους ὠνόμασεν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/013.yaml
  text: And when day came[a], he called his disciples, and chose twelve from among them[b], whom he also named apostles.
translation:
  language: zh_hans
  text: 天亮的时候，他把自己的门徒召来[a]，从他们中间拣选了十二人，又称他们为使徒[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“招呼自己的门徒”。这个希腊词可以指呼唤、招呼或向人说话；这里的上下文较支持把门徒召集过来。
    reason: lexical_alternative
  - marker: b
    text: “使徒”意为“奉差遣的人”。这里是耶稣给十二人的称号。
    reason: lexical_clarification
lexical_decisions:
- source_word: ὅτε ἐγένετο ἡμέρα
  choice: 天亮的时候
  rationale: 自然表达白昼来到这一时间背景，既贴近原文，也符合现代汉语习惯。
- source_word: προσεφώνησεν
  choice: 召来
  rationale: 该动词可指呼唤或招呼；在此处，随后从众门徒中拣选十二人的语境表明，重点是把门徒召集到身边。
- source_word: τοὺς μαθητὰς αὐτοῦ
  choice: 自己的门徒
  rationale: “门徒”是福音书语境中 μαθητής 的通行译法；“自己的”自然传达 αὐτοῦ 与主语之间的所属关系。
- source_word: ἐκλεξάμενος
  choice: 拣选了
  rationale: “拣选”准确表达从较大群体中有意选出若干人的含义，也保持庄重而通俗的圣经语体。
- source_word: ἀπ’ αὐτῶν
  choice: 从他们中间
  rationale: 明确表达十二人是从更大的门徒群体中选出的，这是此处 ἀπό 的语境含义。
- source_word: δώδεκα
  choice: 十二人
  rationale: 补出量词“人”使现代汉语完整自然，并未增加原文没有的身份信息。
- source_word: ἀποστόλους
  choice: 使徒
  rationale: “使徒”是路加叙事中这一称号的通行且准确的汉语译法，既保留其逐渐形成的专门含义，也不额外加入教义解释。
- source_word: ὠνόμασεν
  choice: 称……为
  rationale: 表达给予名称或称号之意，并与前面的“召来”清楚区分。
theological_decisions:
- issue: ἀποστόλους 是译作通行称号，还是按词源译作“奉差遣者”
  choice: 使徒
  alternative: 奉差遣者；受差遣的人
  rationale: 此处该词是耶稣赋予十二人的称号，而不只是泛指执行差事的人；采用通行称号“使徒”可保留其叙事意义，又不扩展为额外的教会论主张。
- issue: 是否把分词 ἐκλεξάμενος 的动作解释为具有特殊仪式或职分设立含义
  choice: 仅译为“拣选了”
  alternative: 设立了；按立了
  rationale: 原文明确表达选择，却没有使用表示按立或仪式性设职的词；因此不把后来的制度性含义加入译文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“天亮的时候”比直译“成为白天的时候”自然；“召来—拣选—称为”清楚呈现三个连续动作，并避免用同一个汉语动词混淆 προσεφώνησεν 与 ὠνόμασεν。保留原文主语“他”，不在本节自行补入“耶稣”。
