  text: οὐκ ἔστιν μαθητὴς ὑπὲρ τὸν ⸀διδάσκαλον, κατηρτισμένος δὲ πᾶς ἔσται ὡς ὁ διδάσκαλος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/040.yaml
  text: A disciple is not above his teacher[b][a], but everyone when fully trained will be like his teacher.
translation:
  language: zh_hans
  text: 学生不能高过老师；每一个受过充分训练的人[a]，都将像自己的老师一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “受过充分训练的人”也可译作“得到充分装备的人”或“预备妥当的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: μαθητής
  choice: 学生
  rationale: 在本节与“老师”相对，重点是学习和受训练的关系；“学生”自然清楚，同时不排除门徒式的跟随含义。
- source_word: ὑπὲρ
  choice: 高过
  rationale: 这里表达地位或程度上的超越；“高过”保留原文简洁的比较意象。
- source_word: διδάσκαλος
  choice: 老师
  rationale: 这是现代汉语中自然、通行的对应词，也与“学生”形成清楚对照。
- source_word: κατηρτισμένος
  choice: 受过完备训练的
  rationale: 该完成时被动分词表示一个人经过塑造、装备或训练而达到完备状态；上下文是学生与老师，因此正文采用“受过完备训练”。
- source_word: πᾶς
  choice: 凡……的
  rationale: 表达泛指的“每一个人”，用“凡……的”符合汉语箴言式表达。
- source_word: ὡς
  choice: 像……一样
  rationale: 明确表达学生与老师之间的比较。
- source_word: αὐτοῦ
  choice: 他的
  rationale: 保留原文单数代词与老师之间的对应；现代汉语中可作泛指理解。
theological_decisions:
- issue: κατηρτισμένος在本句中的含义
  choice: 受过完备训练的
  alternative: 得到装备的／预备完善的／被成全的
  rationale: 该词语义范围包括修复、装备、预备和使之完备。学生—老师的语境支持“训练”，但脚注保留更宽的可能性，避免把原文仅限于课堂教育。
- issue: 泛指单数αὐτοῦ的表达
  choice: 他的老师
  alternative: 自己的老师／其老师
  rationale: “他的”保留希腊文单数阳性形式及个体对应关系，在汉语中仍可作一般性陈述，不必额外限定性别或改变所指。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语，保持箴言式对偶。脚注标记置于相关整句之后；正文中的“学生—老师”突出本节明确的教导和受训语境。
