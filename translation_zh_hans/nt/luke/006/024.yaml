  text: πλὴν οὐαὶ ὑμῖν τοῖς πλουσίοις, ὅτι ἀπέχετε τὴν παράκλησιν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/024.yaml
  text: But woe to you who are rich[b][a], for you have received your comfort.
translation:
  language: zh_hans
  text: 但你们富足的人有祸了！因为你们已经得到了自己的安慰。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “已经得到了”也可译作“已经全数领受了”；原词可带有把应得之物全数收讫的意思。“安慰”也可译作“慰藉”。
    reason: 保存ἀπέχετε的收讫语气及παράκλησις的词义选择。
lexical_decisions:
- source_word: πλὴν
  choice: 但
  rationale: 承接前面的福语并形成强烈转折；“但”简洁自然，保留其对比作用。
- source_word: οὐαὶ ὑμῖν
  choice: 你们……有祸了
  rationale: 保留先知性警告和审判宣告的严肃力度，不弱化为单纯的哀叹。
- source_word: τοῖς πλουσίοις
  choice: 富足的人
  rationale: 直接指向拥有财富的一类人；“富足”既自然又庄重，不添加“倚靠钱财”等原文未明说的限制。
- source_word: ὅτι
  choice: 因为
  rationale: 清楚表达后半句是前述祸患宣告的理由。
- source_word: ἀπέχετε
  choice: 已经得到了
  rationale: 该词虽是现在时形式，但常有收讫、已经领到所应得之物的惯用含义；译文表达当前已经拥有的状态，脚注补明“全数领受”的可能语气。
- source_word: τὴν παράκλησιν ὑμῶν
  choice: 自己的安慰
  rationale: “安慰”准确而易懂；“自己的”自然表达反身关联，指他们今生已经享有的安适，却不在正文中扩展其具体性质。
theological_decisions:
- issue: 对富足之人的警告性质
  choice: 直译为对“富足的人”的严肃祸患宣告
  alternative: 弱化为“可叹”或补译成“倚靠财富的人”
  rationale: 希腊文直接称呼富足者并使用οὐαί；应保留其尖锐性，同时不加入经文没有明说的道德条件。
- issue: ἀπέχετε的时态及收讫含义
  choice: 正文译作“已经得到了”，脚注说明可理解为“已经全数领受”
  alternative: “正在得到”或正文直接译成“已经全数领受”
  rationale: 现在时可描述现有状态，而ἀπέχω又具有收讫、领足的语用色彩；正文采取自然表达，脚注保存较强的商业性语感，避免过度确定。
- issue: παράκλησις的含义
  choice: 安慰
  alternative: 慰藉
  rationale: 两者均可表达此处的安适或慰藉；“安慰”更通俗自然，且不提前界定末世逆转的全部含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句首“但”与前文福语形成鲜明对照；感叹号体现οὐαί的警告力度。脚注标记置于所解释的整句之后。
