source:
  edition: SBLGNT
  text: ⸀πῶς δύνασαι λέγειν τῷ ἀδελφῷ σου· Ἀδελφέ, ἄφες ἐκβάλω τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ σου, αὐτὸς τὴν ἐν τῷ ὀφθαλμῷ σοῦ δοκὸν οὐ βλέπων; ὑποκριτά, ἔκβαλε πρῶτον τὴν δοκὸν ἐκ τοῦ ὀφθαλμοῦ σοῦ, καὶ τότε διαβλέψεις ⸂τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ τοῦ ἀδελφοῦ σου ἐκβαλεῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/042.yaml
  text: How can you say to your brother[a], ‘Brother, let me take out the speck that is in your eye,’ while you yourself do not see the beam that is in your own eye? Hypocrite, first take the beam out of your own eye[c][b], and then you will see clearly to take out the speck that is in your brother’s eye.
translation:
  language: zh_hans
  text: 你怎么能对你的弟兄说：‘弟兄，让我把你眼里的木屑[a]取出来’，自己却看不见自己眼里的房梁[b]呢？假冒为善的人！先把你自己眼里的房梁取出来，那时你才会看清楚，好把你弟兄眼里的木屑取出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “木屑”也可译作“碎屑”或“小木刺”；希腊语κάρφος指很小的一片干燥物。
    reason: lexical_alternative
  - marker: b
    text: “房梁”也可译作“梁木”；希腊语δοκός指大型木构件。
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς δύνασαι λέγειν
  choice: 你怎么能……说
  rationale: 保留反问的语气，既质疑其能力，也质疑这种做法是否恰当；现代汉语自然明确。
- source_word: ἀδελφῷ / Ἀδελφέ / ἀδελφοῦ
  choice: 弟兄
  rationale: 原文为阳性单数亲属称谓，并在直接称呼中重复使用；“弟兄”能保留其性别和群体关系色彩。
- source_word: ἄφες ἐκβάλω
  choice: 让我……取出来
  rationale: ἄφες在此是请求许可的惯用表达；“让我”自然传达其功能。ἐκβάλλω结合眼中异物的语境译为“取出来”。
- source_word: κάρφος
  choice: 木屑
  rationale: 指细小的干燥物碎片；“木屑”与眼中异物的形象相符，并与“房梁”形成强烈对比。
- source_word: δοκός
  choice: 房梁
  rationale: 指大型木构件；“房梁”准确保留夸张意象，也比泛称“木头”更具体。
- source_word: αὐτὸς ... οὐ βλέπων
  choice: 自己却看不见
  rationale: 以“自己”和“却”体现原文强调代词及对比关系。
- source_word: ὑποκριτά
  choice: 假冒为善的人
  rationale: 在现代中文圣经语域中自然、庄重，传达对言行不一者的直接斥责。
- source_word: διαβλέψεις
  choice: 你才会看清楚
  rationale: 该动词在此表示恢复清楚的视觉，从而能够采取行动；“才”体现先后条件。
theological_decisions:
- issue: 伦理教导中阳性单数ἀδελφός的表达
  choice: 弟兄
  alternative: 弟兄或姐妹；同伴；信徒同伴
  rationale: 保留原文阳性单数及直接称呼，不在正文中把适用范围明确扩写；这并不否认教导可以有更广泛的适用性。
- issue: κάρφος与δοκός的比喻性对比
  choice: 木屑……房梁
  alternative: 碎屑……大木头；刺……梁木
  rationale: 保留耶稣话语中的夸张张力：一方极小，另一方大到荒诞，不把比喻抽象化为一般性的“小错”和“大错”。
- issue: 自我省察与纠正他人的先后关系
  choice: 先……那时才……好把……取出来
  alternative: 先……然后就能……
  rationale: 原文并非绝对禁止帮助弟兄，而是要求先处理自身的问题；译文保留这一先后次序和目的关系，不作额外神学推论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。反问、直接引语和斥责均保留原文力度；用“木屑／房梁”维持鲜明而夸张的视觉对比。脚注标记均置于正文相应词后。
