  text: χάρητε ἐν ἐκείνῃ τῇ ἡμέρᾳ καὶ σκιρτήσατε, ἰδοὺ γὰρ ὁ μισθὸς ὑμῶν πολὺς ἐν τῷ οὐρανῷ· κατὰ ⸂τὰ αὐτὰ⸃ γὰρ ἐποίουν τοῖς προφήταις οἱ πατέρες αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/023.yaml
  text: Rejoice in that day and leap for joy[a], for behold, your reward is great in heaven[b]; for in the same way their fathers used to do to the prophets.
translation:
  language: zh_hans
  text: 在那一天，你们要欢喜雀跃[a]；看哪，你们在天上的赏赐是极大的，因为他们的祖先从前总是这样对待先知[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在那一天要欢喜，并跳跃起来。”
    reason: lexical_alternative
  - marker: b
    text: 直译：“因为他们的祖先从前也向先知做同样的事。”原文在此没有明说具体做了什么。
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρητε
  choice: 要欢喜
  rationale: 该词是复数命令式，表达主动欢喜的命令；“要欢喜”自然、庄重，也准确保留其劝令语气。
- source_word: σκιρτήσατε
  choice: 雀跃
  rationale: 该动词指因强烈喜乐而跳跃；“雀跃”兼顾身体动作和喜乐之情，比单说“跳”更符合此处语境。
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留原文引人注意、强调随后理由的话语功能，同时符合庄重的经文语体。
- source_word: μισθὸς
  choice: 赏赐
  rationale: 此处指来自上帝的正面报偿；“赏赐”比经济意义较强的“工钱”更贴合上下文，同时不额外说明其性质。
- source_word: πολὺς
  choice: 是大的
  rationale: 按原文作表语，说明赏赐之大；这一表达保留原句结构和强调，不扩写为“丰厚”。
- source_word: ἐν τῷ οὐρανῷ
  choice: 在天上
  rationale: 直接保留原文所说赏赐所在的领域，不增补“在上帝那里”等解释。
- source_word: κατὰ τὰ αὐτά
  choice: 也曾这样
  rationale: 自然表达“按同样的方式”，把当前遭遇与先知所受的待遇对应起来。
- source_word: ἐποίουν
  choice: 对待
  rationale: 未完成时在此可表达过去反复或惯常发生的行为；结合汉语搭配，以“从前也曾这样对待”自然传达其含义。
- source_word: τοῖς προφήταις
  choice: 先知
  rationale: 作为“对待”的对象自然译出，不明确增添原文未明说的“迫害”等行为。
- source_word: οἱ πατέρες αὐτῶν
  choice: 他们的祖先
  rationale: πατέρες在此指历史上的先辈；现代汉语用“祖先”比字面的“父辈”更清楚，同时保留群体世代相承的指向。
theological_decisions:
- issue: 所应许之赏赐的性质与所在
  choice: 你们在天上的赏赐是大的
  alternative: 上帝在天上为你们预备了丰厚的赏赐
  rationale: 原文只说赏赐“在天上”且“是大的”；采用较直接的表达，保留其末世性张力，不增添施予方式或预备状态。
- issue: “他们的祖先”所指及其行为
  choice: 他们的祖先从前也曾这样对待先知
  alternative: 他们的祖先从前也曾迫害先知
  rationale: 上下文暗示敌对待遇，但原句本身只用宽泛的“做”；正文用“对待”保持这种含蓄，不把具体行为限定为“迫害”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“欢喜雀跃”保留两个并列命令的喜乐与身体动作；“看哪”保留经文式提示语。“祖先”避免现代读者把“父辈”误解为直接上一代。
