  yaml_path: translation/nt/luke/002/047.yaml
  text: And all who heard him were astonished at his understanding and his answers[a].
translation:
  language: zh_hans
  text: 凡听他讲话的人，都因他的悟性和回答而感到惊奇[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“都大为惊奇。”原文动词表达强烈的惊异。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξίσταντο
  choice: 惊叹
  rationale: 此处未完成时形式描写众人持续的强烈惊异反应。“惊叹”自然、庄重，也避免采用可能让现代读者误解的过度直译。
- source_word: δὲ
  choice: （不单独译出）
  rationale: δέ在此是轻微的叙事连接词；汉语承接上文时无需机械译作“而”或“但”，省略更自然。
- source_word: πάντες οἱ ἀκούοντες αὐτοῦ
  choice: 所有听见他的人
  rationale: 保留πάντες的全称范围，并以自然汉语表达正在听他说话的群体。
- source_word: ἐπὶ τῇ συνέσει καὶ ταῖς ἀποκρίσεσιν αὐτοῦ
  choice: 因他的悟性和回答
  rationale: ἐπί加与格在此表示引起惊叹的缘由；“因”清楚呈现这一关系。“悟性”表达σύνεσις所指的理解、领悟能力，“回答”符合对话场景中的ἀπόκρισις。
- source_word: συνέσει
  choice: 悟性
  rationale: “悟性”兼有理解力与洞察力之意，既准确又比“智力”更符合此处语境。
- source_word: ἀποκρίσεσιν
  choice: 回答
  rationale: 指对交谈或提问所作的回答；现代汉语简洁自然。
theological_decisions: []
