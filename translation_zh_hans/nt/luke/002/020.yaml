  text: καὶ ὑπέστρεψαν οἱ ποιμένες δοξάζοντες καὶ αἰνοῦντες τὸν θεὸν ἐπὶ πᾶσιν οἷς ἤκουσαν καὶ εἶδον καθὼς ἐλαλήθη πρὸς αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/020.yaml
  text: And the shepherds returned[a], glorifying and praising God for all that they had heard and seen[c][b], just as it had been told to them.
translation:
  language: zh_hans
  text: 牧羊人回去了[a]，一边将荣耀归给神，一边赞美神；因为他们所听见、所看见的一切[b]，都正如先前对他们所说的那样[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“返回了。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“因着他们所听见、所看见的一切。”
    reason: lexical_alternative
  - marker: c
    text: 直译：“正如对他们所说的。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπέστρεψαν
  choice: 回去了
  rationale: 表示牧人离开探访之处，回到先前所在之处或原来的活动中；“回去了”自然、清楚，也符合叙事语体。
- source_word: οἱ ποιμένες
  choice: 牧人们
  rationale: 承接上文已经出现的牧人；加“们”符合现代汉语表达复数群体的自然习惯。
- source_word: δοξάζοντες
  choice: 将荣耀归给
  rationale: 保留该动词与“荣耀”的词义联系；汉语中“将荣耀归给神”比“荣耀神”更自然、庄重。
- source_word: αἰνοῦντες
  choice: 赞美
  rationale: 与“将荣耀归给”并列，保留原文两个意义相近却不完全相同的分词，不将二者合并。
- source_word: τὸν θεὸν
  choice: 神
  rationale: 是两个分词共同的宾语；后一句以“他”自然承接，避免重复而不改变所指。
- source_word: ἐπὶ πᾶσιν οἷς
  choice: 因……一切
  rationale: ἐπί加与格在此表示归荣耀和赞美的缘由或根据；“因”在现代汉语中简洁自然。
- source_word: ἤκουσαν καὶ εἶδον
  choice: 所听见、所看见的
  rationale: 两个简单过去时所指的事情先于牧人的返回和赞美；汉语“所……的”结构自然表达其作为“一切”的限定内容，无须另加时态标记。
- source_word: καθὼς ἐλαλήθη πρὸς αὐτούς
  choice: 正如先前对他们所说的那样
  rationale: 保留被动表达和未明说的说话者；“正如”对应καθώς，“先前”按叙事次序自然表明所说的话早于他们的见闻。
theological_decisions:
- issue: 是否明确指出先前说话的是天使
  choice: 保留无施事者的被动表达：“正如先前对他们所说的那样”
  alternative: “正如天使先前对他们所说的那样”
  rationale: 上下文表明所指是天使的信息，但本节希腊文没有明说施事者。译文不补出“天使”，以免把上下文推知的信息写成本节明说的内容。
- issue: 如何表达牧人的“荣耀”和“赞美”
  choice: 分别译为“将荣耀归给神，赞美他”
  alternative: 合译为“颂赞神”
  rationale: 原文并列使用δοξάζοντες和αἰνοῦντες。分别翻译可保留其修辞并列及细微差别，不把两个动作压缩为一个宗教术语。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“将荣耀归给神，赞美他”既自然又保留两个并列动作；末句维持原文被动式，不明确补出说话者。所有脚注标记均置于正文相应位置。
