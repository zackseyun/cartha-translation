id: LUK.2.34
reference: Luke 2:34
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ εὐλόγησεν αὐτοὺς Συμεὼν καὶ εἶπεν πρὸς Μαριὰμ τὴν μητέρα αὐτοῦ· Ἰδοὺ οὗτος κεῖται εἰς πτῶσιν καὶ ἀνάστασιν πολλῶν ἐν τῷ Ἰσραὴλ καὶ εἰς σημεῖον ἀντιλεγόμενον,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/034.yaml
  text: And Simeon blessed them and said to Mary his mother, “Look, this one is appointed for the fall and rise of many in Israel, and for a sign that is opposed,[a]”
translation:
  language: zh_hans
  text: 西面祝福了他们，又对孩子的母亲马利亚说：“看哪，这孩子被立定，是为以色列中许多人的跌倒和兴起，并成为一个遭人反对的记号[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “遭人反对”也可译作“被人驳斥”或“被人抵触”。
    reason: 说明 ἀντιλεγόμενον 包含言语反驳与敌对抵触的语义范围。
lexical_decisions:
- source_word: εὐλόγησεν
  choice: 祝福
  rationale: 直接表达为人求福、宣告福分之意；宾语“他们”保留原文复数。
- source_word: Ἰδοὺ
  choice: 看哪
  rationale: 保留提示听者特别留意的庄重语气，同时符合现代中文圣经语体。
- source_word: οὗτος
  choice: 这孩子
  rationale: 所指是婴孩耶稣；补出“孩子”使中文自然清楚，但不增添身份解释。
- source_word: κεῖται εἰς
  choice: 被立定，要使
  rationale: κεῖται 在此表示处于神所定的使命或结局中；“被立定”保留被动意味，并避免明说原文未明示的施事者。
- source_word: πτῶσιν καὶ ἀνάστασιν
  choice: 跌倒……兴起
  rationale: 保留两个名词所构成的强烈对照；“兴起”既可指恢复、站起，也不排除复活联想。
- source_word: σημεῖον ἀντιλεγόμενον
  choice: 一个遭人反对的记号
  rationale: ἀντιλέγω 表示反驳、抵触或反对；被动分词译作“遭人反对”，自然呈现持续受到敌对回应的记号。
theological_decisions:
- issue: “跌倒和兴起”是否指同一批人
  choice: 译为“使以色列中许多人跌倒，也使许多人兴起”
  alternative: “使以色列中许多人跌倒和兴起”
  rationale: 希腊文 πολλῶν 只出现一次，语法上可能涵盖同一群人，也可能概括两类人。中文为流畅而重复“许多人”，但不加入“另一些”，从而不武断区分两群人。
- issue: κεῖται 的神学施事者
  choice: 被立定
  alternative: 神已经立定他
  rationale: 原文使用无施事者的表达；保留被动形式，传达使命的确定性，却不把隐含施事者明文化。
- issue: ἀνάστασις 的含义范围
  choice: 兴起
  alternative: 复活／重新站立
  rationale: 该词可指起来、恢复或复活。此处采用较宽的“兴起”，保留语义张力，不把经文限定为末日复活或属灵恢复。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”保留先知性宣告的语气；其余句式尽量自然。脚注标记置于相关短语之后、引号之内。
