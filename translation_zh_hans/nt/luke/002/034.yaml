    rationale: 希腊文为 εἰς πτῶσιν καὶ ἀνάστασιν πολλῶν，仅有一个 πολλῶν。原文可被理解为同一概括群体经历跌倒与兴起，或指不同人的不同结果；“使许多人跌倒，也使许多人兴起”较明确地分列两组结果。改为“以色列中许多人的跌倒和兴起”可较好保留原文的表达与歧义。
  - severity: low
