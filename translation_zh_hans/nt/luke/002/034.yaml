revisions:
- from: 西面给他们祝福，又对孩子的母亲马利亚说：“看哪，这孩子被立定，要使以色列中许多人跌倒，也使许多人兴起，并要成为一个遭人反对的记号[a]。”
  to: 西面祝福了他们，又对孩子的母亲马利亚说：“看哪，这孩子被立定，是为以色列中许多人的跌倒和兴起，并成为一个遭人反对的记号[a]。”
  rationale: 修订以单一的“许多人的跌倒和兴起”对应原文单一 πολλῶν，避免在中文中预先裁定跌倒者与兴起者是否为不同群体。“是为……”对应 κεῖται εἰς 所表达的既定目的／作用，且不明说施事者。其余关键词和脚注锚点均予保留。
