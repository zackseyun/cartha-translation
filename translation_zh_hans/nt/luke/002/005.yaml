base_translation:
  language: en
  yaml_path: translation/nt/luke/002/005.yaml
  text: to register with Mary[b][a], who was betrothed to him and was pregnant.
translation:
  language: zh_hans
  text: 要和已许配给他的马利亚[a]一同登记，她当时已怀孕[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“和他订了婚的”。原文所指的是正式的婚约关系，其法律和社会约束力强于现代一般意义上的订婚。
    reason: lexical_alternative
  - marker: b
    text: 或译：“有孕”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπογράψασθαι
  choice: 登记
  rationale: 这里是不定式，承接上文说明约瑟前往的目的；“登记”自然、简洁，也符合人口登记的行政语境。
- source_word: σὺν Μαριὰμ
  choice: 和马利亚一同
  rationale: σύν表示陪同、伴随；“和……一同”准确表达马利亚与约瑟同行登记。
- source_word: ἐμνηστευμένῃ αὐτῷ
  choice: 许配给他的
  rationale: 完成时被动分词表示已经确立、仍然有效的正式婚约关系。“许配”比现代语境中的一般“订婚”更能体现当时婚约的法律和社会约束力，同时没有将她直接称为“妻子”。
- source_word: οὔσῃ ἐγκύῳ
  choice: 她当时怀着孕
  rationale: 分词短语说明马利亚在登记之时的状况；“当时怀着孕”清楚自然，并保留与同行登记同时发生的关系。
theological_decisions:
- issue: 马利亚与约瑟在本节所述的婚姻关系
  choice: 许配给他的
  alternative: 和他订了婚的；他的妻子
  rationale: 原文明确使用表示正式许配的 μνηστεύομαι。“他的妻子”超出了本句明说的内容，而普通现代意义的“订婚”又可能弱化古代婚约的法律和社会效力；“许配给他的”较好地保留了原文的历史含义与张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“许配”虽略带传统色彩，但在现代读者可理解的范围内，且能准确传达一世纪正式婚约的性质；分号使经文片段在中文中流畅，并清楚交代马利亚的状况。
