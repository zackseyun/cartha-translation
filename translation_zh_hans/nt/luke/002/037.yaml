  text: καὶ αὐτὴ χήρα ⸀ἕως ἐτῶν ὀγδοήκοντα τεσσάρων,) ἣ οὐκ ⸀ἀφίστατο τοῦ ἱεροῦ νηστείαις καὶ δεήσεσιν λατρεύουσα νύκτα καὶ ἡμέραν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/037.yaml
  text: and then as a widow until she was eighty-four years old[a]. She did not depart from the temple[c][b], worshiping with fastings and prayers night and day.
translation:
  language: zh_hans
  text: 她守寡直到八十四岁[a]。她从不离开圣殿[b]，昼夜以禁食和祈求[c]敬拜上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“她守寡已有八十四年。”希腊文既可指亚拿当时八十四岁，也可指她守寡八十四年。
    reason: alternative_reading
  - marker: b
    text: 这里的“圣殿”指圣殿建筑群或院区，并非专指内殿。
    reason: cultural_note
  - marker: c
    text: “祈求”也可译作“恳求”或“祷告”。
    reason: lexical_alternative
lexical_decisions:
- source_word: χήρα
  choice: 守寡
  rationale: 表示丈夫去世后一直处于寡居状态；结合上节，用动词表达在现代汉语中自然流畅。
- source_word: ἕως ἐτῶν ὀγδοήκοντα τεσσάρων
  choice: 直到八十四岁
  rationale: 正文采用指亚拿年龄的理解，符合该压缩结构的一种自然读法；希腊文也可能指守寡年数，故以脚注保留。
- source_word: ἀφίστατο τοῦ ἱεροῦ
  choice: 从不离开圣殿
  rationale: 未完成时表达持续或惯常的情形；“从不离开”清楚传达 οὐκ ἀφίστατο。
- source_word: ἱεροῦ
  choice: 圣殿
  rationale: 现代中文通顺且符合传统宗教语境；此词指整个圣殿区域而非内殿，脚注说明其范围。
- source_word: νηστείαις
  choice: 禁食
  rationale: 复数表示反复实行的禁食；中文以无标记名词表达惯常实践比“多次禁食”更自然。
- source_word: δεήσεσιν
  choice: 祈求
  rationale: 保留 δέησις 所强调的恳求、请求含义，比泛称“祷告”更具体。
- source_word: λατρεύουσα
  choice: 敬拜上帝
  rationale: 该词在此指向上帝履行宗教敬奉；中文补出隐含对象，使句意自然明确，并不增加新的对象。
- source_word: νύκτα καὶ ἡμέραν
  choice: 昼夜
  rationale: 依照希腊文“夜和日”的次序，以现代中文凝练习语表达持续不断的敬虔生活。
theological_decisions:
- issue: 八十四年所指的是年龄还是守寡时长
  choice: 正文理解为她守寡直到八十四岁，即当时八十四岁。
  alternative: 她守寡已有八十四年。
  rationale: 希腊文结构简略，两种理解在句法上皆有可能；正文选取较自然的年龄读法，并以脚注保存另一读法，避免消除原文歧义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“昼夜禁食祈求，敬拜上帝”保留分词结构所表达的方式与持续敬奉；所有脚注标记均置于相关词句之后。
