base_translation:
  language: en
  yaml_path: translation/nt/luke/002/006.yaml
  text: And while they were there[a], the days were fulfilled for her to give birth.
translation:
  language: zh_hans
  text: 他们在那里时，她分娩的日子到了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“她分娩的日子满了。”
    reason: 保留原文“日子”与“满了／得以圆满”的表达方式；正文采用现代汉语中自然的习语。
lexical_decisions:
- source_word: ἐγένετο δὲ
  choice: （不单独译出，以整句起首承接叙事）
  rationale: 这一结构主要推进叙事。现代汉语无需生硬译作“事情发生了”，直接进入时间从句即可自然保留上下文的承接作用。
- source_word: ἐν τῷ εἶναι αὐτοὺς ἐκεῖ
  choice: 他们在那里的时候
  rationale: 介词ἐν加冠词化不定式表示同时发生的时间；此译自然、明确，也保留“他们”及“那里”。
- source_word: ἐπλήσθησαν
  choice: 满了
  rationale: 该被动形式表示达到圆满或完成。与“日子”搭配译作“满了”，既贴近原文，也保留路加措辞中可能含有的圆满意味。
- source_word: αἱ ἡμέραι
  choice: 日子
  rationale: 原文明确使用复数“日子”，指妊娠期满；保留这一表达，避免简化为较概括的“时候”。
- source_word: τοῦ τεκεῖν αὐτήν
  choice: 她生产的
  rationale: 属格冠词化不定式说明这些日子与她生产有关；汉语定语结构简洁自然，并保留动词“生产”的事件性。
theological_decisions:
- issue: “日子满了”是否暗示上帝所定时间或应验
  choice: 保留“她生产的日子满了”
  alternative: “她生产的时候到了”
  rationale: 原文首先说明妊娠期已经完成，同时“满了”也可能与路加常用的圆满、成就措辞形成呼应。译文不把这种潜在意味明说为神学断言，也不将其完全淡化。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。“生产”在现代汉语中清楚易懂；“日子满了”略带圣经叙事风格，却不晦涩，并贴近希腊原文。
