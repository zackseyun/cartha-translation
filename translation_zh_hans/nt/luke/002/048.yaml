  text: καὶ ἰδόντες αὐτὸν ἐξεπλάγησαν, καὶ ⸂εἶπεν πρὸς αὐτὸν ἡ μήτηρ αὐτοῦ⸃· Τέκνον, τί ἐποίησας ἡμῖν οὕτως; ἰδοὺ ὁ πατήρ σου καὶ ἐγὼ ὀδυνώμενοι ⸀ἐζητοῦμέν σε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/048.yaml
  text: And when they saw him[a], they were astonished, and his mother said to him, “Child, why have you done this to us? Look, your father and I have been anxiously looking for you.”
translation:
  language: zh_hans
  text: 他们一看见他，就大为惊讶。他母亲对他说：“孩子，你为什么这样对待我们？你看，你父亲和我一直忧心焦急地找你[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “忧心焦急地”也可译作“在痛苦不安中”；希腊文分词表达他们寻找时内心所受的痛苦和忧急。
    reason: 词义备选
lexical_decisions:
- source_word: ἰδόντες
  choice: 他们看见他，就
  rationale: 将不定过去时分词按时间先后关系自然译出，既保留“看见”在先，也符合现代汉语叙事表达。
- source_word: ἐξεπλάγησαν
  choice: 惊讶不已
  rationale: 表达该动词所含的强烈惊讶，比单说“惊讶”更能体现原文力度，同时自然易懂。
- source_word: Τέκνον
  choice: 孩子
  rationale: 保留母亲对孩子亲切而带有情感的称呼，不额外加入原文没有的“我的”，也不因语境而窄化为“儿子”。
- source_word: τί ἐποίησας ἡμῖν οὕτως
  choice: 你为什么这样对待我们？
  rationale: 以自然汉语表达带有责问意味的问句，并保留ἡμῖν所体现的关系指向。
- source_word: ἰδοὺ
  choice: 你看
  rationale: 在直接引语中自然传达提醒对方注意的强调语气，避免使用古雅的“看哪”。
- source_word: ὁ πατήρ σου
  choice: 你父亲
  rationale: 直译原文的亲属称谓，不加入“养父”或“世上的父亲”等解释性限定。
- source_word: ὀδυνώμενοι
  choice: 心急如焚地
  rationale: 该分词表示寻找期间深切的痛苦和忧急；此译法在现代汉语中自然地传达强烈的内心煎熬。
- source_word: ἐζητοῦμέν σε
  choice: 一直……找你
  rationale: “一直”体现未完成过去时所表示的持续寻找过程；“找你”符合家庭对话中的自然口吻。
theological_decisions:
- issue: 马利亚称约瑟为耶稣的“父亲”与耶稣神圣儿子身份之间的张力
  choice: 正文保留“你父亲”，不加限定。
  alternative: 你在地上的父亲；你的养父
  rationale: 原文记录马利亚说“你父亲和我”。这种日常家庭称谓不应在翻译中被解释性改写；紧接着的下一节会继续呈现有关耶稣儿子身份的叙事张力。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事与家庭对话风格。“惊讶不已”保留原文强度；“心急如焚”以普通读者熟悉的表达呈现持续寻找中的深切忧急。
