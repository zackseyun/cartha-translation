  text: because my eyes have seen your salvation[a]
translation:
  language: zh_hans
  text: 因为我亲眼看见了你的救恩。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你的救主。”希腊原文作“你的救恩”；但在这里，上帝的救恩具体呈现在耶稣身上。
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 本词在这里说明西面为何能安然离世；译作“因为”可清楚衔接上一节的陈述。
- source_word: εἶδον
  choice: 看见了
  rationale: 希腊语不定过去时表示已经发生的看见；现代汉语用“看见了”自然表达动作已经完成及其当前意义。
- source_word: οἱ ὀφθαλμοί μου
  choice: 我亲眼
  rationale: 原文直译为“我的眼睛”。汉语“我亲眼”既保留亲身目睹的强调，也比“我的眼睛看见了”更自然。
- source_word: τὸ σωτήριόν σου
  choice: 你的救恩
  rationale: σωτήριον在此指拯救、救恩，而不是通常指人的σωτήρ（“救主”）；“你的救恩”保留原文措辞，并让上下文显明这救恩呈现在耶稣身上。
theological_decisions:
- issue: τὸ σωτήριόν σου应译作抽象性的“你的救恩”，还是按婴孩弥赛亚在场的语境人格化为“你的救主”
  choice: 你的救恩
  alternative: 你的救主
  rationale: 原文使用σωτήριον，而非通常表示“救主”的σωτήρ。译作“你的救恩”可忠实保留路加的表达及其中张力，同时让读者从语境看出上帝的救恩具体彰显在耶稣身上。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“我亲眼看见了”避免生硬照译“我的眼睛看见了”，同时保存原文对亲身目睹的强调；“救恩”沿用普通中文读者可理解的圣经核心词汇。
