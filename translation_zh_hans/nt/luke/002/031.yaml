  text: 就是你在万民面前所预备的[a][b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在所有人民眼前”；这个希腊语习语可以指公开摆在众人眼前。
    reason: lexical_alternative
  - marker: b
    text: “万民”或译：“万国”。
    reason: alternative_reading
lexical_decisions:
- source_word: ὃ
  choice: 就是……的
  rationale: 中性单数关系代词回指上一节的“救恩”。汉语用“就是你……所预备的”自然承接前文，同时保留关系从句的功能。
- source_word: ἡτοίμασας
  choice: 你……所预备的
  rationale: 第二人称单数不定过去时主动直陈式，所指对象是上帝；“预备”准确、庄重，也符合本段语境。
- source_word: κατὰ πρόσωπον
  choice: 在……面前
  rationale: 这一希腊语习语表示置于众人面前、为众人所见；“在……面前”既贴近原文意象，也符合现代汉语表达。
- source_word: πάντων
  choice: 万
  rationale: 修饰复数“族”，表达总体、无一遗漏的范围；“万”在“万族”中自然且庄重。
- source_word: τῶν λαῶν
  choice: 万族
  rationale: λαῶν为复数，指多个群体或民族。“万族”保留复数群体的意味，并避免在第32节明确提到外族人与以色列之前，过早将其限定为政治意义上的“万国”。
theological_decisions:
- issue: λαῶν与下一节的关系及其范围
  choice: 万族
  alternative: 万国；所有人民
  rationale: “万族”保留希腊语复数所表达的多个人民群体，也让下一节自行说明外族人与以色列的关系，不在本节提前消解其范围上的张力。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。“在万族面前”保留原文的空间与公开可见意象；句末逗号表明本节与下一节在句法上相连。
