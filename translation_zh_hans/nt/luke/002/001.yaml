  text: Ἐγένετο δὲ ἐν ταῖς ἡμέραις ἐκείναις ἐξῆλθεν δόγμα παρὰ Καίσαρος Αὐγούστου ἀπογράφεσθαι πᾶσαν τὴν οἰκουμένην·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/001.yaml
  text: It happened in those days that a decree went out from Caesar Augustus that all the inhabited world should be registered[a].
translation:
  language: zh_hans
  text: 那些日子，凯撒奥古斯都颁布谕令，要给天下所有居民登记[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“整个罗马世界的人都要登记”或“整个帝国的人都要登记”。这里的希腊词指有人居住的世界；在罗马帝国的语境中，常可指罗马世界。
    reason: 说明οἰκουμένη的语义范围及其历史语境，避免把“天下”误解为严格的全球地理陈述。
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: 那些日子（不另译为“事情发生了”）
  rationale: Ἐγένετο δὲ在此承担叙事推进和引入事件的作用。现代汉语直接进入时间背景更自然；事件本身由“颁布谕令”表达，无须生硬增译“事情发生了”。
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: 那些日子
  rationale: 贴近原文常见时间表达，简洁自然，并承接上文所述时期。
- source_word: ἐξῆλθεν δόγμα
  choice: 颁布谕令
  rationale: 原文直译为“谕令发出”；现代汉语以“颁布谕令”自然表达官方命令的发布，且保持正式语体。
- source_word: παρὰ Καίσαρος Αὐγούστου
  choice: 凯撒奥古斯都
  rationale: παρά加属格表明谕令的来源。汉语“凯撒奥古斯都颁布”以主动句自然呈现同一来源关系。
- source_word: ἀπογράφεσθαι
  choice: 登记
  rationale: 指官方登记，可能与人口统计或税务有关；“登记”保留其基本含义，不在本节中过度限定为“人口普查”或“报税”。
- source_word: πᾶσαν τὴν οἰκουμένην
  choice: 天下所有居民
  rationale: οἰκουμένη字面涉及有人居住的世界，也常在罗马帝国语境中指罗马世界。“天下所有居民”在现代汉语中自然表达普遍范围，同时脚注说明其历史语境下可能较窄的所指。
theological_decisions:
- issue: οἰκουμένη的范围
  choice: 天下所有居民
  alternative: 整个罗马世界；整个帝国
  rationale: 这是历史与词义范围问题。正文保留该词表面的普遍性，不直接把范围限定为罗马帝国；脚注则呈现其在当时帝国语境中的可能所指。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“谕令”体现帝国命令的正式性质；主动句符合现代汉语习惯。脚注标记[a]已置于正文相关短语之后。
