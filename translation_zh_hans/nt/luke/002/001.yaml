  terminology: “谕令”恰当地对应δόγμα的正式帝国命令；“登记”避免把ἀπογράφεσθαι过度具体化为人口普查或税务登记。“天下”保留庄重叙事色彩，脚注应说明其所指未必是现代意义的全球范围。
