base_translation:
  language: en
  yaml_path: translation/nt/luke/002/018.yaml
  text: And all who heard it were amazed about what had been told to them by the shepherds,[a]
translation:
  language: zh_hans
  text: 凡听见的人，都对牧人向他们所说的事感到惊奇。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “感到惊奇”或译“觉得希奇”。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: （承接上文，不单独译出）
  rationale: καί承接前文叙事；汉语以紧接上一节的句流自然表达这种连接，若机械译作“而且”或“于是”反而可能增加原文没有的逻辑色彩。
- source_word: πάντες οἱ ἀκούσαντες
  choice: 凡听见的人
  rationale: 带冠词的过去时分词作名词用，意为“所有听见的人”。“凡听见的人”简洁自然，也不必补出希腊文未明说的宾语。
- source_word: ἐθαύμασαν
  choice: 感到惊奇
  rationale: 表达因所听见之事而惊讶、诧异；措辞现代自然，同时不把这种反应解释为信心或怀疑。
- source_word: περὶ τῶν λαληθέντων
  choice: 对……所说的事
  rationale: περί加属格表示所关注或反应所针对的内容；中译采用“对……感到惊奇”的自然搭配，τῶν λαληθέντων则译作“所说的事”。
- source_word: ὑπὸ τῶν ποιμένων
  choice: 牧人……所说
  rationale: ὑπό加属格标明被动结构中的施事者；汉语转为“牧人所说”的主动定语结构，更自然且保留施事关系。
- source_word: πρὸς αὐτούς
  choice: 向他们
  rationale: πρός加宾格在言说语境中表示话语所指向的对象。“他们”保留代词指称，不额外限定听众身份。
theological_decisions:
- issue: ἐθαύμασαν所描述的回应性质
  choice: 只表达听众感到惊奇，不说明这反应是否构成信心
  alternative: 将其解释为积极相信，或仅仅出于好奇
  rationale: θαυμάζω本身描述惊异、赞叹一类反应；经文没有进一步判定其属灵性质，因此译文保留这种开放性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“凡听见的人”准确涵盖全体听众；“牧人”符合圣经叙事语体。“感到惊奇”避免较古雅的“希奇”，同时在脚注保留该常见译法。
