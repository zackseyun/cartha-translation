  text: καὶ μὴ ⸀εὑρόντες ὑπέστρεψαν εἰς Ἰερουσαλὴμ ⸀ἀναζητοῦντες αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/045.yaml
  text: And when they did not find him[a], they returned to Jerusalem, searching for him.
translation:
  language: zh_hans
  text: 他们没有找到他，就回到耶路撒冷，寻找他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: 就
  rationale: 承接上一节的叙事并表示随后的行动；现代汉语中用“就”比直译为“并且”更自然。
- source_word: μὴ εὑρόντες
  choice: 没有找到他
  rationale: 将否定的简过去分词自然译成汉语动词短语，保留先于主句动作发生的情境关系。
- source_word: ὑπέστρεψαν
  choice: 回到
  rationale: 准确表达返回先前所在之处；与目的地“耶路撒冷”搭配自然。
- source_word: εἰς Ἰερουσαλήμ
  choice: 耶路撒冷
  rationale: 以“回到耶路撒冷”自然表达 εἰς 所指的移动目的地。
- source_word: ἀναζητοῦντες
  choice: 去找
  rationale: 表达带有持续、主动搜寻意味的伴随分词，在现代叙事汉语中简洁自然；“去”也清楚表明返回的目的。
- source_word: αὐτόν
  choice: 他
  rationale: 阳性单数宾格代词，指耶稣。
theological_decisions: []
translation_notes:
  register: 采用自然、简洁而庄重的现代标准汉语。把两个希腊语分词分别处理为前置情境“没有找到他”和目的性表达“去找他”，使叙事关系清楚，同时不增添原文没有的神学解释。
