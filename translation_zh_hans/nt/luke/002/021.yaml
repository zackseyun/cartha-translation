  text: Καὶ ὅτε ἐπλήσθησαν ἡμέραι ὀκτὼ τοῦ περιτεμεῖν αὐτόν, καὶ ἐκλήθη τὸ ὄνομα αὐτοῦ Ἰησοῦς, τὸ κληθὲν ὑπὸ τοῦ ἀγγέλου πρὸ τοῦ συλλημφθῆναι αὐτὸν ἐν τῇ κοιλίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/021.yaml
  text: And when eight days were fulfilled for circumcising him[a], his name was called Jesus[c][b], the name called by the angel before he was conceived in the womb.
translation:
  language: zh_hans
  text: 八天满了，要给他行割礼的时候，就给他起名叫耶稣；这名字是天使在他于母腹中成胎以前所起的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπλήσθησαν ἡμέραι ὀκτὼ
  choice: 满了八天
  rationale: 保留希腊文表示时日届满的完成意味，同时符合现代汉语叙事习惯。
- source_word: τοῦ περιτεμεῖν αὐτόν
  choice: 到了给他行割礼的时候
  rationale: 将带冠词不定式所表达的目的或相关时点自然地译出，明确第八天与割礼的关系。
- source_word: ἐκλήθη τὸ ὄνομα αὐτοῦ Ἰησοῦς
  choice: 就给他起名叫耶稣
  rationale: 以自然汉语表达命名这一被动事件，并保留“名字”这一语义内容；直译为“他的名字被叫作”在现代汉语中较生硬。
- source_word: Ἰησοῦς
  choice: 耶稣
  rationale: 采用新约人名在现代中文圣经传统中的标准译名。
- source_word: τὸ κληθὲν ὑπὸ τοῦ ἀγγέλου
  choice: 这名字是……天使所起的
  rationale: 分词回指前述名字，并保留天使为命名者的被动关系；中文用“起名”比重复“叫作”更自然。
- source_word: πρὸ τοῦ συλλημφθῆναι αὐτὸν
  choice: 他还没有……成胎以前
  rationale: 按上下文将 συλλαμβάνω 译为受孕、成胎，陈述其人性受孕的时间，不加入原文没有的神学术语。
- source_word: ἐν τῇ κοιλίᾳ
  choice: 在母腹中
  rationale: 此处 κοιλία 指孕育胎儿之处；“母腹”准确自然，也让隐含的母体关系在中文中清楚可懂。
theological_decisions:
- issue: 受孕从句与基督论的关系
  choice: 他还没有在母腹中成胎以前
  alternative: 在他于母腹中受孕以前
  rationale: 忠实陈述耶稣人性受孕之前天使已经命名这一时间关系，不把后期神学术语或额外解释写入正文。
- issue: 天使在命名中的作用
  choice: 天使所起的
  alternative: 天使所称的
  rationale: κληθὲν 可表达“称为”或“命名”；上下文指天使预先指定名字。译作“所起的”不暗示天使赋予耶稣身份或本质，只表达命名行为。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“满了八天”保留路加行文的完成意味；“行割礼”“母腹中成胎”是普通读者可懂且适合经文语体的表达。
