  text: Νῦν ἀπολύεις τὸν δοῦλόν σου, δέσποτα, κατὰ τὸ ῥῆμά σου ἐν εἰρήνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/029.yaml
  text: Now you are dismissing your slave[a], Master, according to your word[b], in peace.
translation:
  language: zh_hans
  text: 主宰啊，如今你照你的话，让你的奴仆[a]平安离去[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“奴隶”或“仆人”。希腊语δοῦλος既可着重隶属于主人的身份，也可着重服事主人的角色；这里与“主宰”相呼应，隶属意味较为明显。
    reason: lexical_alternative
  - marker: b
    text: 希腊语直译为“释放”或“遣走”。这里暗示西面已经可以安然离世，但原文没有直接说“死去”。
    reason: alternative_reading
lexical_decisions:
- source_word: Νῦν
  choice: 如今
  rationale: 表示西面所等候之事此刻已经实现；“如今”自然、庄重，也比单用“现在”更符合颂赞语境。
- source_word: ἀπολύεις
  choice: 让……离去
  rationale: 该动词可指释放、放行或遣走。这里用“让……离去”，既符合现代汉语，又保留离世的语境暗示，不直接把动词解释成“让……死去”。
- source_word: τὸν δοῦλόν σου
  choice: 你的奴仆
  rationale: δοῦλος指处于主人权下、服事主人的人。“奴仆”保留“奴”的隶属意味，同时适合对上帝说话的庄重语域；脚注说明也可译作“奴隶”或“仆人”。
- source_word: δέσποτα
  choice: 主宰啊
  rationale: δεσπότης强调拥有权柄的主人。“主宰”保留其权威和支配含义，并与“奴仆”形成对应；“主啊”不足以显出该词与通常κύριος之间的差别。
- source_word: κατὰ τὸ ῥῆμά σου
  choice: 照你的话
  rationale: κατά加宾格表示依照、符合；ῥῆμα在此指上帝所说的话或应许。“照你的话”简洁自然，并保留对上帝应许的呼应。
- source_word: ἐν εἰρήνῃ
  choice: 平安
  rationale: 用“平安离去”自然表达“在平安中”，并保留圣经语境中在上帝恩惠下安然离开的意味。
theological_decisions:
- issue: 西面的话是否应在正文中明确译为死亡
  choice: 保留“离去”的含蓄表达，不在正文中明说死亡
  alternative: 如今你让你的奴仆平安死去
  rationale: 上下文强烈暗示西面已经准备好离世，但ἀπολύω本身是“释放、放行、遣走”，并不直接意为“使人死亡”。保留这一意象可避免消除原文的诗意和神学张力。
- issue: δοῦλος与δεσπότης之间的关系是否应弱化为一般服事关系
  choice: 译作“奴仆”与“主宰”，保留隶属和权柄的对应
  alternative: 仆人／主
  rationale: 两个词相互呼应，凸显说话者完全属于并服从上帝；但“奴仆”也避免现代汉语“奴隶”在正文中可能产生的过窄社会制度联想。
translation_notes:
  register: 采用自然、庄重而可朗读的现代标准汉语。“主宰啊”保留呼语，“照你的话”延续应许语境；全句避免生硬的逐词结构，同时维持原文关于释放与离世之间的含蓄张力。
