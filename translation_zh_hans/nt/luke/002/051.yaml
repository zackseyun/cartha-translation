source:
  edition: SBLGNT
  text: καὶ κατέβη μετ’ αὐτῶν καὶ ἦλθεν εἰς Ναζαρέθ, καὶ ἦν ὑποτασσόμενος αὐτοῖς. καὶ ἡ μήτηρ αὐτοῦ διετήρει πάντα τὰ ῥήματα ⸀ταῦτα ἐν τῇ καρδίᾳ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/051.yaml
  text: And he went down with them and came to Nazareth[a], and he was subject to them[b]. And his mother kept all these things in her heart.
translation:
  language: zh_hans
  text: 他就跟他们一同下去，来到拿撒勒，并且一直顺从他们。[a] 他母亲把这一切话都存在心里。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一直顺从”也可译作“服从他们”或“听从他们”。希腊文表达持续的顺从状态或行动。
    reason: lexical_alternative
  - marker: b
    text: “这一切话”也可译作“这一切事”或“这一切所说的事”。希腊文 ῥήματα 可指话语、言论，也可指所说或所发生的事情。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβη
  choice: 下去
  rationale: 保留从耶路撒冷往拿撒勒行程中的地势方向，同时避免较生硬的“下行”或“降到”。
- source_word: μετ’ αὐτῶν
  choice: 跟他们一同
  rationale: 直接表达同行之意；“他们”按上下文指马利亚和约瑟。
- source_word: ἦλθεν εἰς Ναζαρέθ
  choice: 来到拿撒勒
  rationale: 按叙事视角自然表达抵达目的地，不额外加入原文没有的“回”字。
- source_word: ἦν ὑποτασσόμενος αὐτοῖς
  choice: 一直顺从他们
  rationale: 迂回未完成时结构表达持续的状态或行动；“一直顺从”既自然，又保留耶稣持续服从父母的含义。
- source_word: διετήρει
  choice: 存在
  rationale: 结合“心里”构成自然的汉语表达，传达谨慎保存、牢记之意，同时不在正文中强化为较具解释性的“珍藏”。
- source_word: πάντα τὰ ῥήματα ταῦτα
  choice: 这一切话
  rationale: 较直接对应 ῥήματα；该词在此也可能广指所说的事或相关事情，因此以脚注保留语义范围。
- source_word: ἐν τῇ καρδίᾳ αὐτῆς
  choice: 心里
  rationale: 保留圣经中表示内在记忆与思量的惯用表达，并符合现代汉语习惯。
theological_decisions:
- issue: 耶稣与地上父母的关系
  choice: 一直顺从他们
  alternative: 服在他们权下／听从他们
  rationale: 原文明确陈述耶稣在这一人生阶段持续顺从马利亚和约瑟。译文保留这一张力，不借此削弱他的身份，也不加入后来的教义解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“跟他们一同下去”保留地势方向；“一直顺从”清楚传达持续性；“存在心里”沿用普通读者容易理解的圣经表达。
