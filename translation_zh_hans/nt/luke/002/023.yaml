  text: καθὼς γέγραπται ἐν νόμῳ κυρίου ὅτι Πᾶν ἄρσεν διανοῖγον μήτραν ἅγιον τῷ κυρίῳ κληθήσεται,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/023.yaml
  text: as it is written in the Law of the Lord[a], that every male opening the womb shall be called holy to the Lord[c][b],
translation:
  language: zh_hans
  text: 正如主的律法上所记：“凡头生的男孩[a]，都要被称为归主为圣。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译：“凡开母胎的男性”；指头生的男孩。参见《出埃及记》13:2、12。
    reason: 说明原文的字面表达及其律法语境。
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: 正如……所记
  rationale: 保留经文引述公式及καθὼς所表达的对应关系；“所记”在现代中文中庄重而自然，也传达成文律法持续有效的意味。
- source_word: ἐν νόμῳ κυρίου
  choice: 主的律法上
  rationale: νόμος在这里指以色列的成文律法；中文惯用“律法上所记”，比逐字译作“在主的律法中”更自然。κύριος按希腊文本译为“主”。
- source_word: Πᾶν ἄρσεν διανοῖγον μήτραν
  choice: 凡头生的男子
  rationale: 这是源于律法的固定表达，指首先开启母胎的男性后代。“头生”自然传达其语境含义，同时以脚注保留希腊文的字面形象。
- source_word: ἅγιον τῷ κυρίῳ
  choice: 归主为圣
  rationale: 既保留ἅγιον的“圣”这一核心用语，也表达与格τῷ κυρίῳ所含的归属、奉献关系，而不以单纯“献给”取代圣洁概念。
- source_word: κληθήσεται
  choice: 要称为
  rationale: 表达将来被动态的称谓或认定含义；“要”适合律法引文的语气，又避免过分古雅。
theological_decisions:
- issue: 律法引文中κύριος的译法
  choice: 主
  alternative: 耶和华
  rationale: 本节直接翻译所依据的希腊文本写作κύριος，因此正文译为“主”；不越过希腊文本，直接按其可能对应的希伯来神名改译。
- issue: ἅγιον的圣洁与奉献含义
  choice: 归主为圣
  alternative: 献给主；分别给主
  rationale: “归主为圣”同时保留明确的圣洁词汇和归属于主的关系，避免只译“奉献”而淡化ἅγιον，也避免将两者之间的神学联系拆开。
translation_notes:
  register: 采用现代、庄重而易懂的经文语体。“正如……所记”和“归主为圣”保留律法引文的正式感；“头生的男子”延续圣经语汇，但脚注补明其字面形象，帮助普通读者理解。
