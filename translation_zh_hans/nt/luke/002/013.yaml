  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἐξαίφνης ἐγένετο σὺν τῷ ἀγγέλῳ πλῆθος στρατιᾶς ⸀οὐρανίου αἰνούντων τὸν θεὸν καὶ λεγόντων·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/013.yaml
  text: 'And suddenly there was with the angel a multitude of the heavenly host[a], praising God and saying:'
translation:
  language: zh_hans
  text: 忽然，有一大群天军[a]与那位天使同在，赞美神说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“天上的军队”或“天上的大军”。
    reason: “天军”可直译为“天上的军队”或“天上的大军”，以保留στρατιά的军队意象；主文的“一大群”表达πλῆθος的数量含义。
lexical_decisions:
- source_word: ἐξαίφνης
  choice: 忽然
  rationale: 准确表达事情突如其来，也保留叙事中的惊奇感。
- source_word: ἐγένετο
  choice: 有
  rationale: 此处 γίνομαι 用于存在句，引出天军来到场景中；译作“有”不额外限定他们是以何种方式出现的。
- source_word: σὺν τῷ ἀγγέλῳ
  choice: 同那位天使在一起
  rationale: 直接表达 σύν 加与格所表示的陪同关系；“那位天使”承接上文已经提到的天使。
- source_word: πλῆθος
  choice: 一大群
  rationale: 传达数量众多，并符合现代汉语对众多有位格者的自然表达。
- source_word: στρατιᾶς οὐρανίου
  choice: 天军
  rationale: “天军”简洁地保留 στρατιά 的军队意象和 οὐράνιος 的属天含义，且是自然庄重的中文表达。
- source_word: αἰνούντων τὸν θεόν
  choice: 赞美神
  rationale: 准确表达持续进行的赞美行动及其对象。
- source_word: καὶ λεγόντων
  choice: 说
  rationale: 引出下一节赞美的内容；汉语中在“赞美神说”里不必另译连接词，语意仍然完整。
theological_decisions:
- issue: στρατιᾶς οὐρανίου 的军队意象
  choice: 天军
  alternative: 天上的大军
  rationale: “天军”保留有组织的属天军队这一意象，而没有把该群体泛化为普通的“众天使”；本节描写的是他们赞美神，并未消除词语本身的军事色彩。
- issue: 赞美者与那位天使的关系
  choice: 让“一大群天军”作为“赞美神说”的语意主体
  alternative: 明确写成“他们赞美神说”
  rationale: 希腊文复数分词 αἰνούντων、λεγόντων 按意义与构成天军的众者相应。省去可能指向天军和那位天使双方的“他们”，避免无根据地明确那位天使是否也包括在赞美者之内。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“有……在一起”贴近原文的存在结构，避免用“显现”过度规定 ἐγένετο 的视觉含义；句末冒号承接下一节的直接引语。
