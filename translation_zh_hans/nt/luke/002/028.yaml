  text: καὶ αὐτὸς ἐδέξατο αὐτὸ εἰς τὰς ⸀ἀγκάλας καὶ εὐλόγησεν τὸν θεὸν καὶ εἶπεν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/028.yaml
  text: And he took him into his arms and blessed God and said,[a]
translation:
  language: zh_hans
  text: 西面就把孩子接到怀里，称颂上帝，说：[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “接到”也可译作“接过”或“迎接”。原文动词可表示“接受、接过、迎接”；这里因下文说“到怀里”，主要指西面把孩子接抱过来。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ αὐτὸς
  choice: 西面就
  rationale: 结合上文明确主语为西面；用“就”自然承接叙事，也体现原文 καί 的推进作用，而不把 αὐτός 过度强化为“他亲自”。
- source_word: ἐδέξατο αὐτό
  choice: 把孩子接到
  rationale: δέχομαι 基本义为“接受、接过、迎接”；与“到怀里”连用时，“接到”既符合汉语动作表达，也保留“接纳/接过”的语义。中性代词 αὐτό 指向婴孩耶稣，汉语用“孩子”明确所指，避免机械译成“它”。
- source_word: εἰς τὰς ἀγκάλας
  choice: 怀里
  rationale: ἀγκάλαι 指用于搂抱或抱持的双臂；现代汉语“接到怀里”自然表达方向和动作结果。原文没有明说物主，但汉语无需加“自己的”也能清楚理解。
- source_word: εὐλόγησεν τὸν θεόν
  choice: 称颂上帝
  rationale: εὐλογέω 以上帝为宾语时表示向上帝发出颂赞。“称颂上帝”比“祝福上帝”更符合现代汉语习惯，同时保留其敬虔、庄重的语域。
- source_word: καὶ εἶπεν
  choice: 说：
  rationale: 以冒号自然引出后续直接引语；汉语无需重复主语或直译连接词。
theological_decisions:
- issue: 中性代词 αὐτό 的所指
  choice: 译为“孩子”，指婴孩耶稣
  alternative: 按语法形式机械译为“它”
  rationale: 代词的中性形式与其先行词的语法性别相应，并不否定所指者的人格；汉语明确为“孩子”可避免误解，也不额外加入神学判断。
- issue: εὐλόγησεν τὸν θεόν 的表达
  choice: 称颂上帝
  alternative: 祝福上帝
  rationale: 原文确实使用“祝福/称颂”这一动词，但在现代汉语中，当上帝为宾语时，“称颂”更准确地传达向上帝颂赞的意义，不暗示人向上帝赐福。
translation_notes:
  register: 采用现代、庄重而通俗的叙事语言。“西面就”清楚衔接上文；“接到怀里”符合普通话习惯；“称颂上帝”保留圣经语体而不显生硬。
