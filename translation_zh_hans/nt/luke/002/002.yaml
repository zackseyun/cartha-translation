  yaml_path: translation/nt/luke/002/002.yaml
  text: This registration took place first while Quirinius was governing Syria[a][b].
translation:
  language: zh_hans
  text: （这是第一次登记，发生在居里扭治理叙利亚期间[a][b]。）
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这次登记是在居里扭治理叙利亚以前进行的。”有人认为这里的“第一次”具有比较性的时间含义。
    reason: alternative_reading
  - marker: b
    text: “登记”也可译作“人口普查”。希腊语指官方登记，往往与征税有关。
    reason: lexical_alternative
lexical_decisions:
- source_word: αὕτη
  choice: 这
  rationale: 指回上一节所说的登记；现代汉语用“这”自然明确。
- source_word: ἀπογραφὴ
  choice: 登记
  rationale: 指官方造册登记，常与人口统计或征税有关；“登记”保留行政含义而不过度限定。
- source_word: πρώτη
  choice: 第一次
  rationale: 采用最直接的序数含义，并使其自然地修饰“登记”；“在……以前”的比较时间解释保留在脚注中。
- source_word: ἐγένετο
  choice: 进行的
  rationale: 在此表达该行政事件发生、施行；结合汉语句式译作“进行的”自然通顺。
- source_word: ἡγεμονεύοντος
  choice: 治理……期间
  rationale: 保留属格独立结构所表达的同时性，也不把该动词强行限定为某一具体官衔。
- source_word: τῆς Συρίας
  choice: 叙利亚
  rationale: 采用该地名的现代标准译法。
- source_word: Κυρηνίου
  choice: 居里扭
  rationale: 采用中文圣经传统中较为通行的人名音译，便于读者识别。
theological_decisions:
- issue: 历史上有争议的 πρώτη 及整句结构应如何理解
  choice: 正文采用序数义：“这是第一次登记，是在居里扭治理叙利亚期间进行的。”
  alternative: “这次登记是在居里扭治理叙利亚以前进行的。”
  rationale: πρώτη 最直接的含义是“第一、第一次”。由于句法和历史背景存在争议，正文不以争议较大的比较时间义消解张力，而在脚注中保留该解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留原文括号形式。正文以“第一次登记”自然表达 πρώτη 作为序数词的通常含义，同时借脚注保存有争议的“以前”解释；“治理”避免把 ἡγεμονεύω 过度具体化为某一固定官衔。
