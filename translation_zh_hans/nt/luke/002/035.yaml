  text: καὶ σοῦ ⸀δὲ αὐτῆς τὴν ψυχὴν διελεύσεται ῥομφαία, ὅπως ἂν ἀποκαλυφθῶσιν ἐκ πολλῶν καρδιῶν διαλογισμοί.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/035.yaml
  text: and a sword will pass through your own soul also[b][a], so that the thoughts of many hearts may be revealed.
translation:
  language: zh_hans
  text: 也有一把剑要刺透你自己的心[a][b]，使许多人心里的意念显露出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “刺透”也可译作“穿过”。希腊语动词的字面意思是“穿过”，而“刺透”的意思来自剑的意象。
    reason: lexical_alternative
  - marker: b
    text: 这里的“剑”是比喻，表示马利亚将经历深切的痛苦；本节没有进一步说明这痛苦的具体方式。
    reason: cultural_note
lexical_decisions:
- source_word: σοῦ ... αὐτῆς τὴν ψυχήν
  choice: 你自己的心
  rationale: σοῦ与强调性的αὐτῆς突出“你自己”；ψυχή在此指人的内在生命与感受中心。现代汉语用“心”比“灵魂”更自然，也与下文“心里的意念”形成合宜呼应，但不把它缩减为单纯情绪。
- source_word: διελεύσεται
  choice: 要刺透
  rationale: 该动词本义是“穿过、经过”；以剑为主语时，汉语“刺透”自然表达剑穿过的意象。脚注保留更贴近动词字面的“穿过”。
- source_word: ῥομφαία
  choice: 一把剑
  rationale: ῥομφαία可指较大的剑；此处一般译作“剑”已足以传达强烈意象，避免在正文中过度具体化武器种类。
- source_word: ὅπως ἂν
  choice: 使
  rationale: 引出目的或结果；“使”简洁自然，同时不强行限定为纯目的或纯结果。
- source_word: ἀποκαλυφθῶσιν
  choice: 显露出来
  rationale: 保留被揭开、被显明的被动意义，并符合现代汉语表达。
- source_word: ἐκ πολλῶν καρδιῶν διαλογισμοί
  choice: 许多人心里的意念
  rationale: ἐκ表示意念源自内心；汉语以“心里的意念”自然表达这种来源关系。διαλογισμοί可指思想、盘算或内在思量，“意念”保持其宽泛性，不预设善恶。
theological_decisions:
- issue: 剑的比喻及马利亚受苦的具体所指
  choice: 保留剑刺透马利亚内心的比喻，不在正文中指明具体应验方式
  alternative: 明确解释为马利亚在耶稣受难时的悲痛，或解释为耶稣使命引发分争而带来的痛苦
  rationale: 原文直接对马利亚说话，并预告深切痛苦，却没有明确限定这痛苦的具体历史机制；译文应保留这种张力。
- issue: ὅπως ἂν所表达的逻辑关系
  choice: 译为“使”，容纳目的与结果两种色彩
  alternative: 明确译为“为要”或“结果就”
  rationale: 该结构可表达目的或预期结果，正文不宜把两者之间的开放性消除。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“你自己的心”保留对马利亚的强调；正文用“刺透”使剑的意象在汉语中清晰有力，并以脚注交代原动词更字面的译法。
