  text: καὶ τοῦ δοῦναι θυσίαν κατὰ τὸ εἰρημένον ἐν ⸀τῷ νόμῳ κυρίου, ζεῦγος τρυγόνων ἢ δύο νοσσοὺς περιστερῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/024.yaml
  text: 'and to offer a sacrifice according to what had been said in the Law of the Lord: a pair of turtledoves or two young pigeons[a].'
translation:
  language: zh_hans
  text: 又照主的律法中所说的话[a]献上祭物：“一对斑鸠，或两只雏鸽。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“照主的律法中已经说过的话。”原文的动词形式可强调这话已经说出，并且持续有效。
    reason: 说明κατὰ τὸ εἰρημένον的完成时语气及另一种较明示的译法。
lexical_decisions:
- source_word: τοῦ δοῦναι θυσίαν
  choice: 献上祭物
  rationale: 带冠词的不定式在上下文中表示目的；δίδωμι本义为“给”，但与θυσία连用时，汉语自然表达为“献上祭物”，既保留献祭含义，也承接前文的行动目的。
- source_word: κατὰ τὸ εἰρημένον
  choice: 照……所说的
  rationale: 保留λέγω“说”的言语意象，不改译为解释性更强的“所规定的”。完成时被动分词表示这话已经说出，并作为有效内容存续；正文采用简洁自然的汉语表达，相关语气在脚注说明。
- source_word: ἐν τῷ νόμῳ κυρίου
  choice: 主的律法上
  rationale: νόμος在此指作为圣经权威的摩西律法；κύριος译为“主”。“律法上所说的”符合现代汉语引用成文律法的习惯。
- source_word: ζεῦγος τρυγόνων
  choice: 一对斑鸠
  rationale: ζεῦγος在此指成对的鸟；τρυγών特指斑鸠，故译为“一对斑鸠”。
- source_word: δύο νοσσοὺς περιστερῶν
  choice: 两只雏鸽
  rationale: νοσσός指幼鸟，περιστερά指鸽子；“雏鸽”简明准确，也符合献祭语境。
theological_decisions:
- issue: 圣经律法表述中κύριος的译法
  choice: 主
  alternative: 耶和华；主人
  rationale: 希腊文直接使用κύριος，此处所指是颁布律法的上帝。“主”既忠于新约希腊文，也保留与旧约神圣名号之间的关联，而不把潜在底本直接明示为“耶和华”。
- issue: κατὰ τὸ εἰρημένον是否译成规定性措辞
  choice: 照……所说的
  alternative: 照……所规定的
  rationale: “所规定的”能传达律法效力，却会淡化原文λέγω的“说”这一表达。正文保留原文措辞，让律法既是已说出的话，也是持续有效的权威文本。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“献上祭物”比直译“给出祭物”自然，同时保留祭祀语境；引号呈现律法中的祭物条文。句首“又”承接前文并列的目的结构。
