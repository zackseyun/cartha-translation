  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ ἦν Ἅννα προφῆτις, θυγάτηρ Φανουήλ, ἐκ φυλῆς Ἀσήρ (αὕτη προβεβηκυῖα ἐν ἡμέραις πολλαῖς, ζήσασα ⸂μετὰ ἀνδρὸς ἔτη⸃ ἑπτὰ ἀπὸ τῆς παρθενίας αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/036.yaml
  text: And there was a prophetess[a], Anna, the daughter of Phanuel, from the tribe of Asher. She was advanced in years, having lived with her husband seven years from her virginity[b],
translation:
  language: zh_hans
  text: 又有一位女先知，名叫亚拿，是法内力的女儿，属亚设支派。她年事已高[a]，离开童女时期后，同丈夫生活了七年[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“在许多日子上长进”，是表示年老的习语。
    reason: 说明希腊语习语的字面形式及其含义。
  - marker: b
    text: 直译“从她的童贞起”；意思是她离开童女时期、结婚以后，同丈夫生活了七年。
    reason: 保留原文较为压缩的时间表达，并说明其在婚姻语境中的含义。
lexical_decisions:
- source_word: προφῆτις
  choice: 女先知
  rationale: 该名词为阴性单数，明确指女性先知；“女先知”在现代汉语中自然、清楚，也保留了原文的性别标记。
- source_word: θυγάτηρ Φανουήλ
  choice: 法内力的女儿
  rationale: 直接表达亲属关系，并采用华语圣经传统中较为通行的人名译法“法内力”。
- source_word: ἐκ φυλῆς Ἀσήρ
  choice: 属亚设支派
  rationale: ἐκ在这里表示出身或归属；“属……支派”符合自然的现代汉语圣经表达。
- source_word: προβεβηκυῖα ἐν ἡμέραις πολλαῖς
  choice: 年事已高
  rationale: 原文直译为“在许多日子上长进”，是表示年老的希腊语习语；正文按其实际意义译为自然庄重的汉语，并在脚注说明字面措辞。
- source_word: ζήσασα μετὰ ἀνδρὸς
  choice: 同丈夫生活
  rationale: 语境所指是婚姻生活，而非泛指同住；汉语需用“丈夫”明确这种关系。原文没有必要在汉语中机械保留不定性。
- source_word: ἔτη ἑπτὰ
  choice: 七年
  rationale: 准确表达原文的时间长度。
- source_word: ἀπὸ τῆς παρθενίας αὐτῆς
  choice: 离开童女时期后
  rationale: παρθενία可指童贞或未婚的童女时期。此处说明婚后七年的起算点；该译法在现代汉语中较清楚，同时脚注保留原文较直译的表达。
theological_decisions:
- issue: 亚拿的身份（προφῆτις）
  choice: 明确称她为“女先知”
  alternative: 弱化为虔诚妇女、宗教人物或荣誉称号
  rationale: 路加使用的是“先知”的阴性名词，正文应保留这一明确身份，不因任何教派立场而弱化。
- issue: 年老习语的处理
  choice: 正文译为“年事已高”，脚注保留“在许多日子上长进”的字面意象
  alternative: 正文直译为“在许多日子上长进”
  rationale: 直译在现代汉语中难以自然传达年龄含义；意译准确表达习语，同时脚注让读者看到原文措辞，且不把下一节的年龄计算提前带入本节。
- issue: ἀπὸ τῆς παρθενίας αὐτῆς的时间关系
  choice: 理解为从结束童女时期、进入婚姻生活后算起
  alternative: 机械译作“从她的童贞起”，不说明与婚姻的关系
  rationale: 上下文的“同丈夫生活七年”表明这里以离开未婚童女阶段为起点；脚注仍保留原表达，以免遮蔽其措辞和可能的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“又有一位……名叫……”顺应汉语叙事习惯；“年事已高”自然表达希腊语年龄习语。句末保留逗号，因为原文句法延续至下一节。
