lexical_decisions:
- source_word: ἐγένετο ἐτῶν δώδεκα
  choice: 他到了十二岁
  rationale: γίνομαι与年龄属格连用，表示达到某一年龄；“到了十二岁”既符合现代汉语，也保留“达到”的语感。主语依上文指耶稣。
- source_word: ἀναβαινόντων αὐτῶν
  choice: 他们……上去
  rationale: 现在分词与属格代词构成属格独立结构，表示与“他到了十二岁时”同时发生的背景行动。“他们”保留代词的概括性，不把所指收窄为“他的父母”；“上去”保留前往耶路撒冷常用的上行表达，而不补入原文此处未重复的地名。
- source_word: κατὰ τὸ ἔθος
  choice: 照……的惯例
  rationale: 表示依循既定习惯或规例。“照……的惯例”自然、清楚，并保留原文所指的特定节期惯例。
- source_word: τῆς ἑορτῆς
  choice: 节期
  rationale: ἑορτή在这里指宗教节期；“节期”贴合犹太逾越节语境，也比“节日”更能体现朝圣守节的背景。
- source_word: καὶ ὅτε
  choice: ……时
  rationale: καί承接叙事，ὅτε引出时间从句。汉语无需机械译出句首“和”，用“时”自然表达时间关系，并保持与前文的连续。
