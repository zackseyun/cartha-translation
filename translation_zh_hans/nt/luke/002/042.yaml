translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。本节在希腊文中是延续到下一节的未完句，因此中文以逗号收束。“他们”保留原文所指范围，不在正文中明确改成“他的父母”；“上去”也不补写“耶路撒冷”，因为地点已由上文交代。
