  text: ὅτι ἐτέχθη ὑμῖν σήμερον σωτὴρ ὅς ἐστιν χριστὸς κύριος ἐν πόλει Δαυίδ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/011.yaml
  text: because today a Savior was born for you in the city of David[a], who is Messiah the Lord.
translation:
  language: zh_hans
  text: 因为今天在大卫的城里，有一位救主为你们降生了；他就是弥赛亚，是主。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文“χριστὸς κύριος”直译近于“弥赛亚、主”，通常理解为两个并列的称号，即“弥赛亚，是主”。也可理解为“主所立的弥赛亚”；传统译法常作“主基督”。
    reason: 说明两个主格称号的句法关系、可能的另一种理解，以及传统译法。
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 承接上一节天使报喜的内容并说明喜乐的缘由；“因为”在现代汉语中自然、清楚。
- source_word: ἐτέχθη
  choice: 降生了
  rationale: 准确表达被动式“出生”，同时符合庄重而通俗的叙事语体；“了”体现不定过去时所指的已发生事件。
- source_word: ὑμῖν
  choice: 为你们
  rationale: 这里的与格表示受益者；“为你们”比“给你们”更清楚地传达这降生与听众福祉的关系。
- source_word: σήμερον
  choice: 今天
  rationale: 直接、自然地表达时间副词，并保留宣告的即时性。
- source_word: σωτήρ
  choice: 救主
  rationale: 这是现代汉语中兼具拯救含义和称号性质的通行对应词，比“解救者”更符合本节庄重的王权与弥赛亚语境。
- source_word: ὅς ἐστιν
  choice: 他就是
  rationale: 以自然汉语引出对前述“救主”身份的说明，同时保留关系从句的辨认功能。
- source_word: χριστός
  choice: 弥赛亚
  rationale: 此处是称号，指受膏立、为人期待的那一位；译出称号含义，避免把它误解为姓名。
- source_word: κύριος
  choice: 主
  rationale: 保留其权柄与神学分量；“主人”或“主宰”在此处均不如“主”准确、凝练。
- source_word: ἐν πόλει Δαυίδ
  choice: 在大卫的城里
  rationale: 贴近原文介词短语，并保留与大卫王系的关联；上下文表明所指为伯利恒。
theological_decisions:
- issue: χριστὸς κύριος 两个称号之间的关系
  choice: 弥赛亚，是主
  alternative: 主所立的弥赛亚；主基督
  rationale: 原文并列两个主格称号，可自然理解为“救主”同时是“弥赛亚”和“主”。正文用两个谓语保持两重称号及其分量；脚注保留另一种句法理解和传统译法，不把存在的解释空间静默抹去。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“有一位救主为你们降生了”符合汉语报喜语境；分号清楚区分降生事件与身份宣告。正文中的[a]与脚注对应。
