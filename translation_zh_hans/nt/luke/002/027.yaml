base_translation:
  language: en
  yaml_path: translation/nt/luke/002/027.yaml
  text: And he came in the Spirit into the temple[a]; and when the parents brought in the child Jesus to do for him according to the custom of the law[b],
translation:
  language: zh_hans
  text: 他在圣灵里来到圣殿[a]；当父母[b]把孩子耶稣带进来，要为他遵行律法的惯例时，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他受圣灵引导来到圣殿。”希腊文也可这样理解；正文“在圣灵里”更贴近原文措辞，并保留路加在本段反复强调圣灵的表达。
    reason: lexical_alternative
  - marker: b
    text: 希腊文作“父母”。路加在这里按日常家庭关系称呼照料耶稣的马利亚和约瑟。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τῷ πνεύματι
  choice: 在圣灵里
  rationale: 直译介词结构，并结合上下文将πνεῦμα理解为圣灵；这样既保留路加在本段对圣灵的强调，也不把表达完全改写成单一的工具或引导关系。
- source_word: ἱερόν
  choice: 圣殿
  rationale: ἱερόν指整个圣殿区域，而非专指内殿；“圣殿”是现代中文中准确、自然的常用译法。
- source_word: ἐν τῷ εἰσαγαγεῖν
  choice: 把……带进来
  rationale: 带冠词的不定式与ἐν构成时间关系；中文借上下句次序自然表达“当父母带进来时”的含义，无须保留生硬的名词化结构。
- source_word: γονεῖς
  choice: 父母
  rationale: 忠实表达该词通常的社会家庭称谓，按叙事语境指马利亚和约瑟，不额外改写为“监护人”或“约瑟和马利亚”。
- source_word: παιδίον Ἰησοῦν
  choice: 孩子耶稣
  rationale: παιδίον在此指幼小的孩子；“孩子耶稣”自然保留名称与称谓的结合。
- source_word: τοῦ ποιῆσαι αὐτοὺς
  choice: 要……办理
  rationale: 属格带冠词不定式表达父母带耶稣进来的目的；中文以“要”清楚呈现目的关系，并将父母理解为该动作的施行者。
- source_word: κατὰ τὸ εἰθισμένον τοῦ νόμου
  choice: 照律法的惯例
  rationale: εἰθισμένον指惯常所行之事；此译既保留“惯例”的词义，也表明其依据是律法。
- source_word: περὶ αὐτοῦ
  choice: 为他……有关的事
  rationale: περί加属格表示所行之事与耶稣有关；“为他办理有关的事”在中文礼仪语境中自然，同时不擅自具体说明经文未在本节列出的仪式。
theological_decisions:
- issue: 西面行动中“灵”的所指
  choice: 圣灵
  alternative: 西面自己的心灵或内在状态
  rationale: 路加福音2:25–27连续提到圣灵，强烈支持这里也是指圣灵；正文仍以“在圣灵里”保留原文介词表达的张力。
- issue: 称马利亚和约瑟为“父母”
  choice: 直接译作“父母”
  alternative: 监护人；约瑟和马利亚
  rationale: 这是路加在叙事中的普通家庭称谓，应照原文表达；它描述二人在社会和家庭中的身份，并不对耶稣的生物学父系作额外断言。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“在圣灵里”略带圣经语体，是为保存原文介词结构及其神学张力；其较自然的动态译法列入脚注。句末用逗号，反映本节句法尚未结束，并与下一节衔接。
