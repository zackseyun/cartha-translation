  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ εἶπεν πρὸς αὐτούς· Τί ὅτι ἐζητεῖτέ με; οὐκ ᾔδειτε ὅτι ἐν τοῖς τοῦ πατρός μου δεῖ εἶναί με;
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/049.yaml
  text: And he said to them[a], “Why were you looking for me? Did you not know that I must be in my Father’s house?”
translation:
  language: zh_hans
  text: 他对他们说：“为什么找我呢？难道你们不知道，我必须在我父的家中[a]吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我必须在我父的事上。”希腊文这里是省略表达，既可指父的家，也可指属于父的事或事务。
    reason: 保留ἐν τοῖς τοῦ πατρός μου的省略性及其两种主要理解，避免把替代义限定为“关心”或“办理”。
lexical_decisions:
- source_word: Τί ὅτι
  choice: 为什么
  rationale: 这一惯用表达询问原因；译作“为什么”自然、准确，也保留了问句的直接力度。
- source_word: ἐζητεῖτέ
  choice: 找
  rationale: ζητέω在此指马利亚和约瑟寻找耶稣；现代汉语用“找”比“寻找”或“寻求”更自然，并与叙事情境相符。
- source_word: οὐκ ᾔδειτε
  choice: 难道你们不知道
  rationale: οἶδα表示知道或意识到；“难道……不知道”保留了希腊文否定疑问句的反问语气。
- source_word: ἐν τοῖς τοῦ πατρός μου
  choice: 在我父的家里
  rationale: 原文是省略表达，直译近似“在我父的那些事物中”。鉴于耶稣当时身在圣殿，正文采用“在我父的家里”；同时以脚注保留“关心或办理我父的事”这一可能含义。
- source_word: δεῖ
  choice: 必须
  rationale: δεῖ表达必要性，在路加叙事中也可能带有神圣使命的意味；“必须”简洁而有分量，不把这种必要性弱化为一般意愿。
- source_word: εἶναί με
  choice: 我……在
  rationale: 在δεῖ之后，带宾格主语的不定式自然译为“我必须在……”；不另行扩展动词含义，以免消除后接省略短语的歧义。
- source_word: πατρός μου
  choice: 我父
  rationale: 这里的“父”在圣殿语境中指上帝。译作“我父”既保留耶稣独特的父子宣称，也不在正文中添加原文没有的解释。
theological_decisions:
- issue: ἐν τοῖς τοῦ πατρός μου这一省略短语的含义
  choice: 正文译为“在我父的家里”
  alternative: “关心我父的事”“办理我父的事”或较直译的“在我父的事物中”
  rationale: 紧接的圣殿场景支持“我父的家”这一理解，但希腊文并未明说“家”，也可能指父的事务或关切。正文采用最符合当前场景的读法，并用脚注保存真实歧义。
- issue: “我父”所指
  choice: 保留“我父”，按上下文指上帝
  alternative: 解释性地译为“上帝——我父”
  rationale: 耶稣以“我父”称上帝，与约瑟形成含蓄对照。正文无需补入“上帝”，以免把叙事中的含蓄表达改成显明注释。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事语言。“为什么找我呢”符合家庭对话语境；“难道你们不知道”保留反问力度。“我父”简洁庄重，也准确呈现耶稣对上帝的称呼。脚注标记紧接存在歧义的短语。
