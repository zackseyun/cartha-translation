  text: νομίσαντες δὲ αὐτὸν ⸂εἶναι ἐν τῇ συνοδίᾳ⸃ ἦλθον ἡμέρας ὁδὸν καὶ ἀνεζήτουν αὐτὸν ἐν τοῖς συγγενεῦσιν ⸀καὶ τοῖς γνωστοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/044.yaml
  text: But supposing him to be in the traveling group[a], they went a day's journey[b], and they began searching for him among their relatives and acquaintances.
translation:
  language: zh_hans
  text: 他们以为他在同行的队伍中[a]，走了一天的路后，就开始在亲属和熟人中寻找他[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “同行的队伍”也可译作“结伴而行的人群”；希腊语指一同旅行的一群人。
    reason: lexical_alternative
  - marker: b
    text: “开始……寻找”也可译作“一直在……寻找”，强调搜寻持续进行。
    reason: lexical_alternative
lexical_decisions:
- source_word: νομίσαντες
  choice: 以为
  rationale: 表达马利亚和约瑟当时所作、后来证明并不正确的推想，语气自然，也保留其认知上的不确定性。
- source_word: δὲ
  choice: （不单独译出）
  rationale: δέ在此轻微推进叙事并带出转折；现代汉语可借上下文和整句结构自然体现，若硬译“但是”反而显得突兀。
- source_word: εἶναι ἐν τῇ συνοδίᾳ
  choice: 在同行的人群中
  rationale: συνοδία指结伴旅行的一群人；此译清楚自然，不额外引入商旅队伍等原文未明说的含义。
- source_word: ἦλθον ἡμέρας ὁδὸν
  choice: 走了一天的路
  rationale: 准确传达这个表示一日行程的希腊语习语，同时符合现代汉语表达。
- source_word: ἀνεζήτουν
  choice: 开始……寻找
  rationale: 未完成时可突出搜寻行动的开始及其持续过程；正文采用起始性表达，脚注保留持续性译法。
- source_word: συγγενεῦσιν
  choice: 亲属
  rationale: 广泛指有亲属关系的人，不限性别，庄重而自然。
- source_word: γνωστοῖς
  choice: 熟人
  rationale: 指他们所认识的人，不必然是亲密朋友；“熟人”比“朋友”更准确，也比“相识的人”更简洁自然。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“同行的人群”便于普通读者理解当时结伴旅行的情形；“亲属和熟人”准确区分亲缘关系与一般相识者。所有脚注标记均置于正文相应位置。
