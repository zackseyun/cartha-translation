base_translation:
  language: en
  yaml_path: translation/nt/luke/002/008.yaml
  text: And there were shepherds in that same region[b][a], staying out in the fields and keeping watch over their flock by night.
translation:
  language: zh_hans
  text: 在那一带，有牧羊人露宿野外[a]，夜间看守着自己的羊群[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“住在野外”。希腊文动词强调牧羊人在田野露天过夜。
    reason: lexical_alternative
  - marker: b
    text: 直译“为自己的羊群守夜间的更次”；这可暗示他们分班守夜。
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιμένες
  choice: 牧羊人
  rationale: 准确指照料羊群的人；比泛称“牧人”更明确，也符合现代汉语习惯。
- source_word: ἐν τῇ χώρᾳ τῇ αὐτῇ
  choice: 在同一地区
  rationale: χώρα在此指前文所述地点附近的区域；“同一地区”自然、清楚，不将范围扩大为国家。
- source_word: ἀγραυλοῦντες
  choice: 露宿野外
  rationale: 该动词强调在户外、田野中过夜；“露宿野外”简洁保留过夜含义，而非仅指白天留在野外。
- source_word: φυλάσσοντες φυλακὰς τῆς νυκτὸς
  choice: 夜间轮班看守
  rationale: 同源词结构直指守夜的班次，暗示分班值守；此译法自然呈现这一含义。
- source_word: ἐπὶ τὴν ποίμνην αὐτῶν
  choice: 看守自己的羊群
  rationale: ποίμνη是集合名词“羊群”；“自己的”自然表达αὐτῶν所指他们所照管的羊群。
- source_word: Καὶ ... ἦσαν
  choice: 有
  rationale: 汉语以“有”自然引入新场景；句首不硬译καί，叙事承接仍由上下文自然体现。
theological_decisions: []
