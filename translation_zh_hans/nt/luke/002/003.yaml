  yaml_path: translation/nt/luke/002/003.yaml
  text: And everyone was going to be registered[b][a], each to his own city.
translation:
  language: zh_hans
  text: 众人都前往各自的城去登记[a]。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“登记入册”。这里指为人口统计而办理官方登记。
    reason: lexical_alternative
  - marker: b
    text: 希腊文此处用阳性单数的分配式表达，直译为“每一个人到他自己的城”。
    reason: source_form
lexical_decisions:
- source_word: ἐπορεύοντο
  choice: 都去
  rationale: 该未完成时形式描写众人陆续前往的过程；现代汉语以“都去”配合上下文自然表达持续展开的行动，不必生硬标示时体。
- source_word: πάντες
  choice: 众人
  rationale: 表达“所有人”的总体范围，同时与后面的“各自”构成自然的总括—分述结构。
- source_word: ἀπογράφεσθαι
  choice: 登记
  rationale: 在本段人口登记的行政语境中，指接受官方登记；“登记”清楚、现代且不过度增译为具体的征税或户籍制度。
- source_word: ἕκαστος
  choice: 各自
  rationale: 保留逐一、分配性的强调，并与反身代词ἑαυτοῦ自然结合。
- source_word: ἑαυτοῦ
  choice: 自己的
  rationale: 准确表达反身所有关系。现代汉语“自己”不标明语法性别和单复数，因此不必人为加入“他的”。
- source_word: πόλιν
  choice: 城
  rationale: πόλις可指城或城镇；“城”是简洁而庄重的对应，也避免将其解释性扩展为“家乡”或“祖籍地”。
theological_decisions:
- issue: ἕκαστος…ἑαυτοῦ的阳性单数分配式表达
  choice: 译为“各自到自己的城去”，以自然汉语保留逐一归属关系，并在脚注说明希腊文形式
  alternative: 各人到他自己的城去
  rationale: 原文在语法上是阳性单数，但此处重点是分配关系；“各自……自己”在现代汉语中准确且自然，不会擅自断定只有男性参与，同时脚注保留原文的形式信息。
- issue: “自己的城”是否解释为家乡或祖籍地
  choice: 保留“自己的城”
  alternative: 各自回本乡／各自回祖籍所在的城
  rationale: 本节本身只说πόλις“城”；“家乡”“祖籍地”虽可能符合叙事背景，却会把解释直接写进正文。
translation_notes:
  register: 采用现代、简洁而庄重的叙事语体。“众人……各自……”符合汉语习惯，并保留原文从总体到个体的结构。未增译“回”“家乡”或“祖籍”，以免超出本节明说的内容。
