  text: καὶ εἶπεν αὐτοῖς ὁ ἄγγελος· Μὴ φοβεῖσθε, ἰδοὺ γὰρ εὐαγγελίζομαι ὑμῖν χαρὰν μεγάλην ἥτις ἔσται παντὶ τῷ λαῷ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/010.yaml
  text: And the angel said to them[a], “Do not be afraid, for behold, I bring you good news of great joy that will be for all the people,”
translation:
  language: zh_hans
  text: 天使对他们说：“不要害怕，因为看哪，我向你们报一个有关大喜乐的好消息；这大喜乐将归给全体百姓。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“所有人。”希腊文更直译为“全体百姓”；在路加的叙事中，这个说法常按上下文特指一个群体。
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἄγγελος
  choice: 天使
  rationale: 定冠词承接上文已经出现的那位天使；汉语通常无须另加指示词，也能自然表达这一回指。
- source_word: Μὴ φοβεῖσθε
  choice: 不要害怕
  rationale: 准确表达带 μή 的命令式禁令，也是自然、现代的普通话说法。
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留引人注意的语篇功能和庄重语气；“看哪”虽略带书面色彩，但在经文语体中清楚易懂。
- source_word: γὰρ
  choice: 以语义关系和标点体现，未单独译出
  rationale: 原文以 γάρ 说明不必害怕的理由；汉语在“不要害怕”之后直接用“看哪”引出理由更自然，逻辑关系仍然清楚。
- source_word: εὐαγγελίζομαι ὑμῖν
  choice: 我向你们报一个……好消息
  rationale: 表达向听者宣告好消息的基本词义，并明确保留复数受益者 ὑμῖν；避免把该动词直接术语化为“传福音”。
- source_word: χαρὰν μεγάλην
  choice: 带来大喜乐
  rationale: 保留“极大的喜乐”这一核心意义，并用“带来”使“报好消息”与“喜乐”在现代汉语中自然衔接。
- source_word: ἥτις ἔσται
  choice: 这喜乐将临到
  rationale: 明确把关系代词的先行词理解为阴性名词 χαρά（喜乐），并保留将来时；“临到”自然表达这喜乐将为人所得。
- source_word: παντὶ τῷ λαῷ
  choice: 全体百姓
  rationale: 保留定冠词所指向的特定群体意味；在路加此处的叙事背景中，很可能首先指以色列百姓，而不提前把范围明确扩大为全人类。
theological_decisions:
- issue: παντὶ τῷ λαῷ 所指的范围
  choice: 全体百姓
  alternative: 所有人
  rationale: 原文 λαῷ 带定冠词，眼前语境很可能指特定的百姓，即以色列。“全体百姓”保留这种确定性，同时不否认路加著作后来展开的普世性救恩主题。
- issue: 关系代词 ἥτις 的指向
  choice: 这喜乐将临到
  alternative: 这个好消息将临到
  rationale: ἥτις 为阴性单数，与 χαρά（喜乐）一致，因此让后半句明确承接“喜乐”，不把它改指“好消息”。
translation_notes:
  register: 采用现代、清楚而庄重的普通话。“看哪”保留原文的强调和宣告语气；“报一个……好消息”避免过度术语化，“全体百姓”则保留原文可能特指以色列百姓的张力。
