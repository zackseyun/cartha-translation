  text: Καὶ ἰδοὺ ⸂ἄνθρωπος ἦν⸃ ἐν Ἰερουσαλὴμ ᾧ ὄνομα Συμεών, καὶ ὁ ἄνθρωπος οὗτος δίκαιος καὶ εὐλαβής, προσδεχόμενος παράκλησιν τοῦ Ἰσραήλ, καὶ πνεῦμα ἦν ἅγιον ἐπ’ αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/025.yaml
  text: And behold[a], there was a man in Jerusalem whose name was Simeon, and this man was righteous and devout, waiting for the consolation of Israel[b], and the Holy Spirit was upon him.
translation:
  language: zh_hans
  text: 看哪，耶路撒冷有一个人，名叫西面。这人公义虔诚，正等候以色列的安慰[a]；圣灵在他身上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“以色列的慰藉”。这句话指以色列所盼望、由上帝带来的安慰与复兴。
    reason: lexical_alternative
  - marker: b
    text: 按希腊文形式，或可理解为“有圣洁的灵在他身上”；但按路加在上下文中的用法，这里最自然是指圣灵。
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留路加用来引起注意、突出新人物登场的叙事标记；“看哪”庄重而仍能为现代读者理解。
- source_word: ἄνθρωπος
  choice: 一个人
  rationale: 所指是男性西面；汉语“一个人”在随后姓名的限定下自然明确，无须另加“男子”。
- source_word: ᾧ ὄνομα Συμεών
  choice: 名叫西面
  rationale: 以自然简洁的现代汉语表达希腊语的姓名辨识结构。
- source_word: δίκαιος
  choice: 公义
  rationale: 兼顾道德正直与在上帝面前合宜的圣经语义；比单纯的“公平”更全面。
- source_word: εὐλαβής
  choice: 虔诚
  rationale: 自然表达对上帝心存敬畏并谨慎持守信仰生活的品格。
- source_word: προσδεχόμενος
  choice: 正等候
  rationale: 表达持续而带着盼望的等候；“正”凸显当时持续的状态，但不额外强化为焦急或迫切。
- source_word: παράκλησιν τοῦ Ἰσραήλ
  choice: 以色列的安慰
  rationale: 保留属格结构及其一定的语义浓度，指以色列所盼望、由上帝带来的安慰与复兴；不在正文中把范围解释得过窄。
- source_word: πνεῦμα ἅγιον
  choice: 圣灵
  rationale: 虽无冠词，但路加的用法和紧接的上下文最自然地指向圣灵；汉语专名不需冠词。
- source_word: ἐπ’ αὐτόν
  choice: 在他身上
  rationale: 保留圣灵临在于人的圣经表达，同时避免擅自具体化为“充满”或“降临”。
theological_decisions:
- issue: πνεῦμα ἦν ἅγιον ἐπ’ αὐτόν 的所指
  choice: 圣灵在他身上
  alternative: 有圣洁的灵在他身上
  rationale: 从路加福音2:26–27的紧邻语境和路加—使徒行传的惯常表达看，这里最自然地指上帝的圣灵。不过，因希腊文此处没有冠词，脚注保留语法上较不可能的另一理解。
- issue: παράκλησις τοῦ Ἰσραήλ 的含义
  choice: 以色列的安慰
  alternative: 以色列的复兴／给以色列的安慰
  rationale: “安慰”保留该词本义及其与先知书中上帝安慰、恢复其子民之盼望的呼应；不把丰富含义缩减为政治解放或某一种特定末世方案。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“看哪”有意保留原文醒目的叙事提示；其余句式力求自然简洁。脚注标记与所解释的短语直接对应，分别置于“以色列的安慰”和“圣灵在他身上”之后。
