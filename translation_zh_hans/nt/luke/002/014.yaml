base_translation:
  language: en
  yaml_path: translation/nt/luke/002/014.yaml
  text: Glory to God in the highest[c][b][a], and on earth peace among people of good pleasure.
translation:
  language: zh_hans
  text: “在至高之处，荣耀归于上帝！在地上，蒙悦纳的人中有平安！[a][b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“在地上，上帝所喜悦的人中有平安。”
    reason: lexical_alternative
  - marker: b
    text: 有些抄本作：“在地上有平安，在人间有美意。”
    reason: textual_variant
lexical_decisions:
- source_word: Δόξα
  choice: 荣耀
  rationale: 这里是把荣耀归给上帝的颂赞式宣告；“荣耀”保留了原文的礼仪色彩和神学分量。
- source_word: ἐν ὑψίστοις
  choice: 在至高之处
  rationale: 指最高的天上领域，并与“在地上”形成空间上的对照；此译法既简明又保留原文的方位表达。
- source_word: θεῷ
  choice: 归于上帝
  rationale: 以“归于”自然表达希腊文与格所表示的归属或颂赞对象。
- source_word: ἐπὶ γῆς
  choice: 在地上
  rationale: 直接、自然地呈现原文，并与“在至高之处”相对。
- source_word: εἰρήνη
  choice: 平安
  rationale: 保留该词在圣经语境中兼具安宁、和好与福祉的宽广含义。
- source_word: ἐν ἀνθρώποις
  choice: 临到……的人
  rationale: 介词短语表示平安存在于这些人当中；汉语用“临到……的人”能自然表达这种关系。ἄνθρωποι在这里泛指人，不限于男性。
- source_word: εὐδοκίας
  choice: 蒙悦纳的
  rationale: 属格修饰“人”，表明这些人是悦纳或恩宠所指向的对象。“蒙悦纳”自然表达其受惠含义，同时不在正文中展开为完整的神学解释。
theological_decisions:
- issue: εὐδοκίας属格在天使宣告中的含义
  choice: 把平安与“蒙悦纳的人”相连
  alternative: “在地上有平安，在人间有美意”，依据主格εὐδοκία的异文
  rationale: SBLGNT正文采用属格εὐδοκίας，因此它最自然地限定“人”，指蒙悦纳或蒙恩眷的人，而不是与“荣耀”“平安”并列的第三项。译文只呈现这一语法关系，不进一步规定蒙悦纳者的范围或引入特定教派的拣选观。
- issue: εὐδοκίας所隐含的悦纳主体
  choice: 正文译作“蒙悦纳”，不明说“上帝所喜悦”
  alternative: “上帝所喜悦的人”或“他所喜悦的人”
  rationale: 上下文自然表明悦纳来自上帝，但原文此处没有明示所有格代词。被动式汉语既通顺，也避免增加原文未明说的成分；脚注提供更明确的意译。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。两个感叹句保留天使颂歌的宣告和礼仪语气；“人”在现代汉语中自然泛指所有人，无须另加性别说明。
