  text: καὶ ἐγένετο μετὰ ἡμέρας τρεῖς εὗρον αὐτὸν ἐν τῷ ἱερῷ καθεζόμενον ἐν μέσῳ τῶν διδασκάλων καὶ ἀκούοντα αὐτῶν καὶ ἐπερωτῶντα αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/046.yaml
  text: And it happened that after three days they found him in the temple[b][a], sitting among the teachers and listening to them and asking them questions.
translation:
  language: zh_hans
  text: 过了三天，他们在圣殿里[a]找到了他。他正坐在教师们中间，听他们讲，也向他们提问[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的希腊语ἱερόν指整个圣殿建筑群或院区，不是专指内殿。
    reason: cultural_note
  - marker: b
    text: 或译：“询问他们。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: （融入叙事句式，不单独译出）
  rationale: 这是路加常用的叙事衔接语。现代汉语以“过了三天”直接推进叙事，更自然，也保留了事件发生和场景转换的功能。
- source_word: μετὰ ἡμέρας τρεῖς
  choice: 过了三天
  rationale: μετά加宾格表示时间上的随后；“过了三天”贴近原文，同时符合现代汉语表达。
- source_word: εὗρον
  choice: 找到了
  rationale: 准确表达寻找之后发现他的叙事语境，也自然对应简单过去时事件。
- source_word: ἐν τῷ ἱερῷ
  choice: 在圣殿里
  rationale: ἱερόν指圣殿建筑群或院区，而非特指内殿；正文采用通行且易懂的“圣殿”，并以脚注说明范围。
- source_word: καθεζόμενον
  choice: 正坐着
  rationale: 现在分词描写他们找到他时正在持续的姿态；在整句中译为“正坐在……中间”。
- source_word: ἐν μέσῳ τῶν διδασκάλων
  choice: 在教师们中间
  rationale: 忠实表达“在……中间”。διδάσκαλοι是宗教教师，但原文未明说“律法教师”，因此不作限定性增译。
- source_word: ἀκούοντα αὐτῶν
  choice: 听他们讲
  rationale: 表达专注聆听的持续动作；补出“讲”符合现代汉语搭配，并未增加具体讲授内容。
- source_word: ἐπερωτῶντα αὐτούς
  choice: 向他们提问
  rationale: ἐπερωτάω可指询问或发问；“向他们提问”自然呈现交流场景，又不暗示敌意、盘问或对抗。
theological_decisions:
- issue: 耶稣与教师们互动的性质
  choice: 译为“听他们讲，也向他们提问”，呈现聆听和主动参与讨论两方面。
  alternative: 译为“询问他们”或“质问他们”，后者可能让人误以为是在挑战或审问教师。
  rationale: 原文同时描写耶稣聆听和发问，既不应削弱他的智慧，也不应把互动过度解释为对抗或考核。此译法保留经文本身的谦逊姿态与非凡智慧之间的张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“过了三天”简洁承接叙事；“教师们”保留其宗教教导者身份，又避免增添原文没有的“律法”限定。所有脚注标记均置于相关词句之后。
