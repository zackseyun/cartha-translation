  text: ⸀καὶ ἄγγελος κυρίου ἐπέστη αὐτοῖς καὶ δόξα κυρίου περιέλαμψεν αὐτούς, καὶ ἐφοβήθησαν φόβον μέγαν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/009.yaml
  text: And an angel of the Lord stood before them[a], and the glory of the Lord shone around them[b], and they feared a great fear.
translation:
  language: zh_hans
  text: 有一位主的天使忽然站在他们身旁[a]，主的荣光在他们周围照耀，他们就极其惧怕[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“来到他们身旁”或“出现在他们面前”。原文动词可表示突然临到，也可表示站在近旁。
    reason: lexical_alternative
  - marker: b
    text: 直译“惧怕了极大的惧怕”；这是以同根词加强语气的表达，意思是极其害怕。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελος κυρίου
  choice: 主的一位天使
  rationale: ἄγγελος在本叙事语境中指天使；原文无定冠词，译作“一位”较自然，也避免将其特定化为“那位天使”。κυρίου译作“主的”。
- source_word: ἐπέστη αὐτοῖς
  choice: 忽然站在他们身旁
  rationale: ἐφίστημι可表示来到近旁、站在旁边或突然出现；“忽然站在他们身旁”兼顾其突然临近与具体站立的含义。
- source_word: δόξα κυρίου
  choice: 主的荣光
  rationale: “荣光”既保留δόξα的神圣尊荣含义，也适合此处可见光辉的语境。
- source_word: περιέλαμψεν αὐτούς
  choice: 四面照着他们
  rationale: περιλάμπω指光从周围照耀；此译保留环绕照射的空间意象，且符合现代汉语表达。
- source_word: ἐφοβήθησαν φόβον μέγαν
  choice: 他们就非常惧怕
  rationale: 原文以同根动词和名词构成加强语气，直译“惧怕了极大的惧怕”在汉语中生硬；“非常惧怕”自然表达强烈恐惧，同时不添加原文没有的心理状态。
theological_decisions:
- issue: 两处κύριος的译法
  choice: 主
  alternative: 主人
  rationale: 此处所指为上帝；“主”既符合路加叙事中的神圣称谓，也保留新约用语的神学分量。
- issue: ἄγγελος κυρίου是否特指
  choice: 主的一位天使
  alternative: 主的那位天使
  rationale: 希腊文ἄγγελος前无冠词，语境中也是首次引入该天使，因此不将其译成特指称谓。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“一位天使”避免不必要的特指；“忽然站在他们身旁”保留原文动词的突发性与位置含义；末句用自然汉语传达希腊语同根宾语结构的强烈语气。
