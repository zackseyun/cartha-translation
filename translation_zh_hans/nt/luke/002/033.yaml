base_translation:
  language: en
  yaml_path: translation/nt/luke/002/033.yaml
  text: And his father and mother were marveling at the things being said about him[a].
translation:
  language: zh_hans
  text: 他的父亲和母亲对那些关于他的话感到惊奇。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作“他的父亲”。这里按叙事中通常的家庭和法律关系指约瑟；有些译本为避免与路加先前所记童女怀孕生耶稣的事相混淆，译作“约瑟和他的母亲”。
    reason: 说明原文措辞及另一译法所要避免的神学误解。
lexical_decisions:
- source_word: ὁ πατὴρ αὐτοῦ
  choice: 他的父亲
  rationale: 按希腊文本直译为“他的父亲”，不为消除神学张力而改作“约瑟”；在叙事中这是日常家庭和法律关系的称呼。
- source_word: μήτηρ
  choice: 母亲
  rationale: μήτηρ的常规对应词；与“他的父亲”并列，构成父母二人的表达。
- source_word: ἦν ... θαυμάζοντες
  choice: 感到惊奇
  rationale: 该迂回结构表达过去持续的反应；现代汉语无需机械复制形式，以自然表达传达他们当时一直怀有的惊异。
- source_word: ἐπὶ τοῖς λαλουμένοις
  choice: 对那些……的话
  rationale: 保留复数带冠词的被动分词所指向的言谈内容；中文用“那些……的话”比逐字译为“正在被说的事”自然。
- source_word: περὶ αὐτοῦ
  choice: 关于他
  rationale: 准确传达περί加属格表示“论到、关于”的意义。
theological_decisions:
- issue: 在童女生子叙事中称约瑟为耶稣的“父亲”
  choice: 正文按希腊文译作“他的父亲”，并用脚注说明其叙事层面的家庭／法律意义。
  alternative: 译作“约瑟和他的母亲”，或在正文中解释为“他的养父”。
  rationale: 原文明确写“他的父亲”。路加可按日常家庭和法律关系如此称呼约瑟，而不因此否定本章先前所叙述的童女怀孕；译文不应擅自消解原文保留的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“感到惊奇”自然传达θαυμάζω的惊异之意；脚注保留原文在基督论语境中的措辞与张力。
