  text: Καὶ Ἰησοῦς προέκοπτεν ⸂σοφίᾳ καὶ ἡλικίᾳ⸃ καὶ χάριτι παρὰ θεῷ καὶ ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/052.yaml
  text: And Jesus kept increasing in wisdom and stature[b][a], and in favor with God and men.
translation:
  language: zh_hans
  text: 耶稣的智慧和身量[a]不断增长，在上帝和人[b]面前也越来越蒙喜爱。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “身量”或译“年龄”或“成熟程度”；希腊词可有这些含义。
    reason: lexical_alternative
  - marker: b
    text: “人”指一般人或众人。
    reason: lexical_clarification
lexical_decisions:
- source_word: προέκοπτεν
  choice: 不断增长／越来越
  rationale: 未完成时表示随时间持续进展。中文分别用“不 断增长”和“越来越”自然表达这一持续过程，避免理解为一次性的改变。
- source_word: σοφίᾳ
  choice: 智慧
  rationale: 准确表达广义的理解力、判断力和明辨能力，也是现代中文自然且庄重的对应词。
- source_word: ἡλικίᾳ
  choice: 身量
  rationale: ἡλικία可指年龄或身体的身量；正文采用“身量”，与成长语境相符，同时以脚注保留原词的歧义。
- source_word: χάριτι
  choice: 喜爱
  rationale: 在παρὰ θεῷ καὶ ἀνθρώποις这一关系性结构中，χάρις主要指在上帝和人那里所得的好感或青睐，而非抽象的救恩论术语“恩典”。“蒙……喜爱”在现代中文中自然清楚。
- source_word: παρὰ θεῷ
  choice: 蒙上帝……喜爱
  rationale: παρά加与格在此表示在某人那里或眼中所得的好感；中文用“蒙上帝……喜爱”表达这种关系。
- source_word: ἀνθρώποις
  choice: 人
  rationale: 复数ἀνθρώποις泛指人类或众人，并非仅指男性；现代汉语“人”准确而自然。
theological_decisions:
- issue: 耶稣真实的人性成长与基督论张力
  choice: 直接陈述耶稣的智慧和身量持续增长，并越来越蒙喜爱。
  alternative: 为避免基督论张力而弱化或模糊耶稣的发展。
  rationale: 希腊文明确说耶稣持续长进。译文保留他在人性上真实成长的陈述，不以释义消除经文本身的神学张力。
- issue: χάρις在本节中的含义
  choice: 译为关系性的“喜爱”。
  alternative: 译为神学术语“恩典”。
  rationale: “在上帝和人那里”的平行结构表明，此处重点是好感、青睐或认可；采用“喜爱”可避免无根据地将其专门化为救恩论意义。
translation_notes:
  register: 采用现代、清楚而庄重的标准普通话。“不断增长……越来越……”自然体现未完成时的持续意义；“蒙上帝和人的喜爱”保持两个对象的并列关系。
