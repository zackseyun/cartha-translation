  text: Τὸ δὲ παιδίον ηὔξανεν καὶ ἐκραταιοῦτο ⸂πληρούμενον σοφίᾳ⸃, καὶ χάρις θεοῦ ἦν ἐπ’ αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/040.yaml
  text: And the child grew and became strong[a], being filled with wisdom, and the favor of God was upon him.
translation:
  language: zh_hans
  text: 那孩子渐渐长大，也日渐强健，充满智慧；神的恩惠[a]在他身上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“神的恩典”。
    reason: χάρις可指“恩惠”或“恩典”；此处“恩惠”侧重神眷顾的临在。
lexical_decisions:
- source_word: Τὸ δὲ παιδίον
  choice: 这孩子
  rationale: παιδίον指年幼的孩子；结合婴孩时期的上下文，译为“孩子”最自然。δέ在此仅起轻微承接作用，汉语用“这孩子”即可顺畅衔接上文，无须机械译出。
- source_word: ηὔξανεν
  choice: 渐渐长大
  rationale: 未完成时表示持续的发展过程；“渐渐长大”自然传达这一进行性。
- source_word: ἐκραταιοῦτο
  choice: 强健起来
  rationale: 该未完成时中间／被动形式描述持续变得强壮；“强健起来”兼顾成长过程和身体力量。
- source_word: πληρούμενον σοφίᾳ
  choice: 充满智慧
  rationale: 现在分词描述伴随孩子成长的持续状态，σοφίᾳ表示所充满的内容。汉语并列谓语“充满智慧”比直译为“正被智慧充满”更自然，同时不改变其含义。
- source_word: χάρις θεοῦ
  choice: 神的恩惠
  rationale: χάρις在这里可指神的恩惠、恩宠或恩典。“恩惠”清楚表达神施恩眷顾的临在，并保留“恩典”这一可能译法于脚注。
- source_word: ἦν ἐπ’ αὐτό
  choice: 在他身上
  rationale: ἐπί与εἰμί连用，表达某种眷顾或临在落在某人身上；“在他身上”保留原文简洁的空间性表达，不额外加入“停留”或“覆庇”等解释。
theological_decisions:
- issue: 在基督成长的语境中如何翻译χάρις θεοῦ
  choice: 神的恩惠
  alternative: 神的恩典
  rationale: 原词在此可表达神施恩的眷顾或恩宠。“恩惠”避免把经文解释为耶稣原先欠缺某种属灵恩典，同时不否定“恩典”这一真实的词义可能；该可能保留在脚注中。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“渐渐长大，强健起来”体现两个未完成时的持续过程；分号区分孩子的成长状态与神的恩惠临在，又保持全句连贯。
