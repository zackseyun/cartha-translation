base_translation:
  language: en
  yaml_path: translation/nt/luke/002/019.yaml
  text: But Mary was treasuring up all these words[b][a], pondering them in her heart.
translation:
  language: zh_hans
  text: 马利亚却把这一切话都珍藏着[a]，在心里反复揣摩[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “珍藏着”也可译作“谨慎保存”或“不断保存”；原文的动词表示持续地、小心地保存。
    reason: lexical_alternative
  - marker: b
    text: “反复揣摩”原文可含“把这些内容放在一起比较、思量”的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: 却
  rationale: 承接上文众人的反应，并以轻微转折引出马利亚内在、沉思的回应；“却”在现代汉语中自然地表达这一对照。
- source_word: Μαρία
  choice: 马利亚
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: πάντα
  choice: 都
  rationale: 与“这一切话”配合，表达马利亚把所听见的整全内容无一遗漏地保存下来。
- source_word: συνετήρει
  choice: 珍藏
  rationale: 该未完成过去时表示持续的动作；“珍藏”兼顾了谨慎保存和珍视于心的含义，而不只是一般记忆。
- source_word: τὰ ῥήματα ταῦτα
  choice: 这一切话
  rationale: ῥήματα在此首先指牧人所传述的话语和信息；译作“话”保留其言说性质，同时脚注说明也可泛指这些事。
- source_word: συμβάλλουσα
  choice: 反复揣摩
  rationale: 该分词含有把各项内容放在一起比较、思量的意味；“反复揣摩”自然表达持续深入的内心思考，但不暗示马利亚已经完全明白。
- source_word: ἐν τῇ καρδίᾳ αὐτῆς
  choice: 在心里
  rationale: 保留原文“心”的隐喻，涵盖内在的思想、体会和珍视，避免将其窄化为纯理性分析。
theological_decisions:
- issue: 马利亚回应的性质
  choice: 她在心里持续珍藏并揣摩所听见的信息
  alternative: 她只是记住这些事件，或此时已经完全理解其意义
  rationale: 原文同时表达谨慎保存和把各项内容联系起来思量，却没有说明她已经完全领悟；译文保留这种未决张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“珍藏在心里”保留经文的文学意象；“反复揣摩”表达持续思量，同时避免断言马利亚已经完全理解。
