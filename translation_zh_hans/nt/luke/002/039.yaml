  rationale: 修订仅改善现代汉语的句法与行文：以“当……后”呈现时间关系，并以单一“回到”统领加利利及其具体城镇拿撒勒。原草案脚注a所给“律法所规定”的替代译法属于可从上下文得出的解释，但正文已清楚表达“照着主的律法办完一切事”，无需保留该替代脚注。地名规模说明保留，并将其锚定于“城”。
