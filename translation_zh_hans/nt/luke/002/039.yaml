  text: Καὶ ὡς ἐτέλεσαν ⸀πάντα τὰ κατὰ τὸν νόμον κυρίου, ⸀ἐπέστρεψαν εἰς τὴν Γαλιλαίαν ⸀εἰς πόλιν ἑαυτῶν Ναζαρέθ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/039.yaml
  text: And when they had completed everything according to the law of the Lord[a], they returned to Galilee, to their own town[b], Nazareth.
translation:
  language: zh_hans
  text: 当他们照着主的律法办完一切事后，就回到加利利他们自己的城拿撒勒[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “城”也可译作“城镇”；拿撒勒当时是个较小的聚居地。
    reason: cultural_note
lexical_decisions:
- source_word: ὡς
  choice: ……以后
  rationale: 在与不定过去时动词连用的时间从句中，引出主句行动发生的时间；汉语以“办完……，就……”自然表达先后关系，而不强化为“立刻”。
- source_word: ἐτέλεσαν
  choice: 办完了
  rationale: 此处指完成律法所涉及的各项礼仪和要求。“办完”符合现代汉语叙事，也避免“成全”可能带来的预言或神学联想。
- source_word: πάντα τὰ κατὰ τὸν νόμον κυρίου
  choice: 照主的律法办完了一切事
  rationale: 保留“按照／依照”这一较贴近原文的关系，同时自然表达他们把相关事项全部完成；“律法所规定的一切”作为解释性替代见脚注。
- source_word: νόμον κυρίου
  choice: 主的律法
  rationale: 准确保留属格关系及犹太经文语体，指从神而来的律法。
- source_word: κυρίου
  choice: 主
  rationale: κύριος在此指神；译作“主”既符合希腊文本，也不把原文未明写的神名直接代入。
- source_word: ἐπέστρεψαν
  choice: 回到
  rationale: 在行程语境中表示返回某地；“回到”比“返回到”更自然。
- source_word: εἰς τὴν Γαλιλαίαν
  choice: 回到加利利
  rationale: εἰς标示目的地，汉语自然译作“到”；与“回”结合为“回到”。
- source_word: εἰς πόλιν ἑαυτῶν
  choice: 回到自己的城
  rationale: 保留πόλις的基本词义“城”和ἑαυτῶν的反身领属强调“自己的”；拿撒勒规模较小的背景说明置于脚注，以免正文过度解释。
- source_word: Ναζαρέθ
  choice: 拿撒勒
  rationale: 采用现代中文圣经及一般中文语境中通行的地名译法。
theological_decisions:
- issue: “主的律法”中“主”的所指
  choice: “主”指神，即圣经中从神而来的律法。
  alternative: 本语境没有具有重大 theological 后果的其他合理所指。
  rationale: 这是犹太—圣经语境中的惯常表达；直译既凸显这个家庭遵行律法，也不加入原文没有提出的进一步教义判断。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。以“办完……，就……”清楚呈现时间和叙事顺序；正文保留“城”以贴近πόλις，并用脚注说明按聚落规模可译“城镇”。所有脚注标记均已置于正文对应位置。
