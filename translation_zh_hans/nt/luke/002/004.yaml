    reason: 说明οἶκος和πατριά两个相关的祖系用语，并保留其可译差异。
  revision_rationale: 修订将原文由广至狭的地理关系以现代汉语自然地整合为“加利利的拿撒勒城”至“犹太的伯利恒”，保留“上到”的地理语感，并以“就是”表达伯利恒与“大卫城”的解释性同位关系。将祖系短语调整为“家系和宗族”，使双词表达更清楚、自然；脚注锚点移至相关短语后。
