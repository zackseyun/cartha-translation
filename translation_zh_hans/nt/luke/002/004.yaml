  text: Ἀνέβη δὲ καὶ Ἰωσὴφ ἀπὸ τῆς Γαλιλαίας ἐκ πόλεως Ναζαρὲθ εἰς τὴν Ἰουδαίαν εἰς πόλιν Δαυὶδ ἥτις καλεῖται Βηθλέεμ, διὰ τὸ εἶναι αὐτὸν ἐξ οἴκου καὶ πατριᾶς Δαυίδ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/004.yaml
  text: And Joseph also went up from Galilee[a], from the town of Nazareth, to Judea, to the city of David which is called Bethlehem, because he was from the house and family line of David,
translation:
  language: zh_hans
  text: 约瑟也从加利利的拿撒勒城上到犹太的伯利恒，就是大卫城，因为他出自大卫的家系和宗族。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “家系和宗族”也可译作“家室和世系”。原文使用两个意义相关但不完全相同的祖系词，表明约瑟出自大卫的后裔家系。
    reason: 说明οἶκος和πατριά两个相关的祖系用语，并保留其可译差异。
lexical_decisions:
- source_word: Ἀνέβη
  choice: 上到
  rationale: 保留原文表示向高处行进的动词，也符合从加利利前往犹太山区的地理语感。
- source_word: δὲ καὶ
  choice: 也
  rationale: 以自然的汉语轻连接承接上文，并保留καί所表达的附加意义；不强加明确的时间先后。
- source_word: ἐκ πόλεως Ναζαρὲθ
  choice: 从……拿撒勒城
  rationale: πόλις可泛指城镇；“拿撒勒城”符合现代中文圣经地名表达，同时不夸大其规模。
- source_word: εἰς τὴν Ἰουδαίαν
  choice: 到犹太
  rationale: 指当时的地理区域，采用通行而简洁的中文名称。
- source_word: πόλιν Δαυὶδ ἥτις καλεῖται Βηθλέεμ
  choice: 一座称为伯利恒的大卫之城
  rationale: 保留“大卫之城”这一重要称号及原文解释其名称的关系结构，同时用“一座”表明此处所指是伯利恒。
- source_word: διὰ τὸ εἶναι αὐτὸν
  choice: 因为他……
  rationale: διά加带冠词不定式在此表示原因，汉语用原因从句最自然。
- source_word: ἐξ οἴκου καὶ πατριᾶς Δαυίδ
  choice: 出自大卫的家族和宗族
  rationale: 分别译出οἶκος与πατριά，不把两个相关的祖系概念合并；“出自”准确传达ἐξ所指的来源或血统。
theological_decisions:
- issue: 约瑟的大卫后裔身份用语
  choice: 出自大卫的家族和宗族
  alternative: 属于大卫的家室和世系
  rationale: 保留两个祖系名词，突出约瑟与大卫的血统关联，却不据此引入经文本身未明说的后续神学结论。
- issue: “大卫之城”的所指
  choice: 一座称为伯利恒的大卫之城
  alternative: 那称为伯利恒的大卫城
  rationale: 依原文明确将此称号用于伯利恒，并保留其解释性结构；不将其改成其他传统上也称为“大卫城”的地点。
translation_notes:
  register: 采用庄重、流畅的现代标准汉语。“上到”保留地理方向感；句末脚注专门解释两个祖系词，正文则避免古奥难懂的表达。
