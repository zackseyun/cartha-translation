  yaml_path: translation/nt/luke/002/032.yaml
  text: a light for revelation to the Gentiles[a], and glory to your people Israel.
translation:
  language: zh_hans
  text: 作使外邦人得启示的光，并作你子民以色列的荣耀。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φῶς
  choice: 光
  rationale: 直接保留光的意象；现代汉语在这一诗歌式并列结构中无需添加量词。
- source_word: εἰς ἀποκάλυψιν
  choice: 带来启示
  rationale: εἰς在这里表达目的或结果，ἀποκάλυψις指揭开、显明。译作“带来启示”既自然，也避免把原文明确收窄为单纯的物理照明。
- source_word: ἐθνῶν
  choice: 外族人
  rationale: 该词本义可指各国、列国或各族；本节将其与“你子民以色列”并列，语境主要指以色列之外的人。“外族人”以现代汉语清楚表达这一对照，同时用脚注保留“列国”的译法。
- source_word: δόξαν
  choice: 荣耀
  rationale: 保留该词所含的尊荣、光辉及其圣经语境中的神学分量。
- source_word: λαοῦ σου Ἰσραήλ
  choice: 你子民以色列
  rationale: 将以色列理解为“你子民”的同位说明；“子民”自然表达属于上帝的群体，并保持庄重语体。
- source_word: καὶ
  choice: 并
  rationale: 连接两个平行成分：给外族人带来启示的光，以及上帝子民以色列的荣耀。
theological_decisions:
- issue: ἐθνῶν与以色列的关系
  choice: 外族人
  alternative: 列国
  rationale: 与“你子民以色列”的并列显示，这里重点是以色列以外的人；但希腊词本身仍可较广泛地指“列国”，故以脚注保留该词义。
- issue: “启示”与“照亮”的表达
  choice: 给外族人带来启示的光
  alternative: 照亮外族人的光
  rationale: “照亮”较为顺口，却可能弱化ἀποκάλυψις所表达的揭示、显明之意。正文保留“启示”，不进一步说明启示的具体内容，以免消解原文的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的汉语，并维持原文的诗歌式并列。正文是路加福音2:29—32长句中的一个片段，因此保留“作……并作……”的承接结构。
