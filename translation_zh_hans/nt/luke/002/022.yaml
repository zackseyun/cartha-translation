source:
  edition: SBLGNT
  text: Καὶ ὅτε ἐπλήσθησαν αἱ ἡμέραι τοῦ καθαρισμοῦ αὐτῶν κατὰ τὸν νόμον Μωϋσέως, ἀνήγαγον αὐτὸν εἰς Ἱεροσόλυμα παραστῆσαι τῷ κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/022.yaml
  text: And when the days of their purification were fulfilled according to the law of Moses[a], they brought him up to Jerusalem to present him to the Lord,
translation:
  language: zh_hans
  text: 当按摩西的律法，他们洁净的日子满了[a]，他们就带他上耶路撒冷，要把他呈献给主，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“她洁净的日子”。
    reason: textual_variant
lexical_decisions:
- source_word: ἐπλήσθησαν
  choice: 满了
  rationale: 这里的被动形式用于表示一段规定的日子达到期限；“日子满了”自然、庄重，也保留原文“达到满数”的意味。
- source_word: καθαρισμοῦ
  choice: 洁净
  rationale: 此处指摩西律法所规定、与生育有关的礼仪性洁净；“洁净”在现代中文圣经语境中清楚且符合礼仪背景。
- source_word: αὐτῶν
  choice: 他们
  rationale: 所据SBLGNT正文为复数属格代词，故正文保留“他们”，不按利未记背景或异文改成单数。
- source_word: κατὰ τὸν νόμον Μωϋσέως
  choice: 按摩西的律法
  rationale: 准确表达依照摩西律法规定而行，中文简洁自然，并保留法律语体。
- source_word: ἀνήγαγον
  choice: 带着他上
  rationale: 既表达携带婴孩前往，也保留前往耶路撒冷时“上去”的方向意味。
- source_word: Ἱεροσόλυμα
  choice: 耶路撒冷
  rationale: 采用现代中文通行地名译法。
- source_word: παραστῆσαι
  choice: 把他献在……面前
  rationale: 此处是在敬拜和律法语境中将孩子呈到主面前；“献在主面前”比单说“呈交”自然庄重，又不额外说明献祭方式。
- source_word: κυρίῳ
  choice: 主
  rationale: κύριος在此指上帝，译作“主”，符合敬虔及盟约语境。
theological_decisions:
- issue: “洁净”所属代词的数
  choice: 正文保留复数“他们洁净的日子”
  alternative: “她洁净的日子”
  rationale: 所给希腊正文读作复数αὐτῶν。尽管依利未记背景或部分抄本可见单数理解，译文不应默默消除这种张力，因此正文从复数，单数异文置于脚注。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“日子满了”保留原文的时间完成意象；“他们洁净的日子”虽在中文中略显不寻常，但忠实反映所据希腊正文的复数，并用脚注交代异文。句末逗号保留本节与下一节在原句中的连续关系。
