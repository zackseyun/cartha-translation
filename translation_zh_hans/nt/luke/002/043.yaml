  text: καὶ τελειωσάντων τὰς ἡμέρας, ἐν τῷ ὑποστρέφειν αὐτοὺς ὑπέμεινεν Ἰησοῦς ὁ παῖς ἐν Ἰερουσαλήμ, καὶ οὐκ ⸂ἔγνωσαν οἱ γονεῖς⸃ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/043.yaml
  text: And when they had completed the days[a], as they were returning, Jesus the boy remained in Jerusalem[b], and his parents did not know it.
translation:
  language: zh_hans
  text: 过完了那些日子，在他们返回的时候，少年耶稣仍留在[a]耶路撒冷；他的父母[b]却不知道。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“留在后面”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文直译为“他的父母”。路加在这里采用日常的家庭称谓，并不否定本福音前文所记的童女怀孕生子。
    reason: cross_reference
lexical_decisions:
- source_word: τελειωσάντων τὰς ἡμέρας
  choice: 过完了那些日子
  rationale: 属格独立结构表示主句行动之前已经完成的情形；“那些日子”保留希腊文的表达，并由上下文自然指向节期的日子，不在正文中过度明说。
- source_word: ἐν τῷ ὑποστρέφειν αὐτοὺς
  choice: 在他们返回的时候
  rationale: 带ἐν的冠词化不定式表达同时发生的时间背景；此译法体现他们正在返程时耶稣留在耶路撒冷。
- source_word: ὑπέμεινεν
  choice: 仍留在
  rationale: 此处ὑπομένω意为留下、留在原处；“仍留在”与地点“耶路撒冷”搭配自然，也暗含其他人已经离开的对比。
- source_word: ὁ παῖς
  choice: 少年
  rationale: παῖς可指孩子、男孩或少年；紧邻上下文说明耶稣十二岁，因此“少年”在现代汉语中自然且符合年龄。
- source_word: ἐν Ἰερουσαλήμ
  choice: 在耶路撒冷
  rationale: 按ἐν加地名的通常处所用法直译。
- source_word: οὐκ ἔγνωσαν
  choice: 却不知道
  rationale: γινώσκω在此表示知道或察觉某事；汉语可由上下文省略宾语，而“却”清楚表现父母离开与不知耶稣留下之间的转折。
- source_word: οἱ γονεῖς αὐτοῦ
  choice: 他的父母
  rationale: γονεῖς的直接词义是“父母”；忠实保留路加在叙事中使用的日常家庭称谓。
theological_decisions:
- issue: 称马利亚和约瑟为耶稣的γονεῖς
  choice: 他的父母
  alternative: 他的母亲和约瑟
  rationale: 希腊文明确使用“父母”。译文保留路加的措辞及其与前文童女生子叙事之间的张力，不以解释性改写加以调和。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“过完了那些日子”保留原文节期语境中的含蓄表达；“少年耶稣”符合十二岁的近距离上下文。脚注标记按其实际所说明的词语分别置于“耶路撒冷”和“父母”之后。
