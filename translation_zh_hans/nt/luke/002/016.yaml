  text: καὶ ἦλθαν σπεύσαντες καὶ ἀνεῦραν τήν τε Μαριὰμ καὶ τὸν Ἰωσὴφ καὶ τὸ βρέφος κείμενον ἐν τῇ φάτνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/016.yaml
  text: And they came in haste and found Mary and Joseph[a], and the baby lying in the manger.
translation:
  language: zh_hans
  text: 他们便急忙赶去，找到了马利亚、约瑟和那躺在马槽[a]里的婴孩。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“牲口的食槽”。希腊语φάτνη可指供牲畜吃食的槽。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθαν σπεύσαντες
  choice: 急忙赶去
  rationale: 将主要动词与表方式的分词合并为自然的现代汉语表达，保留行动的急切感；“赶去”也符合牧人朝天使所指地点前往的叙事方向。
- source_word: ἀνεῦραν
  choice: 找到了
  rationale: 该词可指经过寻找而发现；“找到了”既自然，也比单纯“看见”更能体现寻找后成功发现的意味。
- source_word: τήν τε Μαριὰμ καὶ τὸν Ἰωσὴφ
  choice: 马利亚、约瑟
  rationale: 采用现代中文圣经语境中通行的人名译法，并以汉语并列结构自然表达希腊文的连词组合。
- source_word: τὸ βρέφος
  choice: 婴孩
  rationale: βρέφος指年幼婴儿；“婴孩”准确、庄重，也适合降生叙事的语体。
- source_word: κείμενον
  choice: 躺在
  rationale: 该现在分词描述婴孩当时所处的状态，而不是别人把他放下的动作，因此译为“躺在”。
- source_word: ἐν τῇ φάτνῃ
  choice: 在马槽里
  rationale: φάτνη在本语境中指盛放牲畜饲料的槽；“马槽”是准确且为普通中文读者熟悉的传统表达，同时用脚注说明更直白的词义。
- source_word: καὶ ... τε ... καὶ ... καὶ
  choice: 便……、……和……
  rationale: 按现代汉语习惯处理连续并列关系，不机械重复每一个连词，同时保留叙事的推进和三项并列结构。
