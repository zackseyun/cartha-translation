id: LUK.2.38
reference: Luke 2:38
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ⸀καὶ αὐτῇ τῇ ὥρᾳ ἐπιστᾶσα ἀνθωμολογεῖτο τῷ ⸀θεῷ καὶ ἐλάλει περὶ αὐτοῦ πᾶσιν τοῖς προσδεχομένοις ⸀λύτρωσιν Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/038.yaml
  text: And at that very hour[a], coming up[c][b], she began giving thanks to God and speaking about him to all who were waiting for the redemption of Jerusalem.
translation:
  language: zh_hans
  text: 就在那时[a]，她也走上前来，称谢上帝[b]，又向所有盼望耶路撒冷得救赎的人讲论他[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“就在同一时刻”。
    reason: lexical_alternative
  - marker: b
    text: 或译“赞美上帝”。这里的希腊文可表示感谢或赞美。
    reason: lexical_alternative
  - marker: c
    text: “他”按上下文最自然指婴孩耶稣；不过，希腊文中最近明确提到的是上帝。
    reason: alternative_reading
lexical_decisions:
- source_word: αὐτῇ τῇ ὥρᾳ
  choice: 就在那时
  rationale: 这是表示时间的与格短语；“就在”体现 αὐτῇ 的强调意味，并自然表达她当时即刻来到。
- source_word: ἐπιστᾶσα
  choice: 走上前来
  rationale: 该不定过去时分词在这里表示她来到现场、走近众人；此译自然，又不额外限定她行动的具体方式。
- source_word: ἀνθωμολογεῖτο τῷ θεῷ
  choice: 称谢上帝
  rationale: 该未完成过去时动词可表示向上帝表达感谢或赞美。“称谢”兼具庄重与可懂性；中文语境已可传达持续或当时发生的行动，无须明确补入“开始”。
- source_word: ἐλάλει περὶ αὐτοῦ
  choice: 讲论他
  rationale: 未完成过去时表达持续讲话；保留代词“他”，不在正文中把所指对象改写为解释性名词。
- source_word: πᾶσιν τοῖς προσδεχομένοις
  choice: 向所有盼望……的人
  rationale: προσδέχομαι 在此含怀着期待等候之意；“盼望”自然体现这种带有期待的等待。
- source_word: λύτρωσιν Ἰερουσαλήμ
  choice: 耶路撒冷得救赎
  rationale: λύτρωσις 含释放、拯救和救赎的分量；“得救赎”保留其救恩内涵，也不把耶路撒冷的盼望缩减为纯政治或纯属灵的解释。
theological_decisions:
- issue: αὐτοῦ（“他”）的所指
  choice: 正文保留“他”，按上下文最自然理解为婴孩耶稣
  alternative: 因“上帝”是希腊文中最近的明确先行词，也可能被理解为指上帝
  rationale: 叙事焦点是婴孩耶稣，亚拿对盼望救赎之人所讲的也最自然是关于他；但正文保留原文代词，并以脚注说明语法上的张力，不强行消除歧义。
- issue: “耶路撒冷得救赎”的含义
  choice: 保留为“耶路撒冷得救赎”
  alternative: 耶路撒冷得解救；上帝的子民得拯救
  rationale: 该短语可指上帝为其子民施行的拯救，并带有群体性及末世性的意味；不把它限定为政治解放、属灵救恩或拟人化解释中的任何一种。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“走上前来”比直译“站在旁边”更符合此处到场、走近的语境；“称谢”保留经文语体的庄重感，但仍为普通读者熟悉。所有歧义均在正文或脚注中保留，未加入宗派性解释。
