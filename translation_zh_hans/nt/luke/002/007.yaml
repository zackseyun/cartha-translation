  text: καὶ ἔτεκεν τὸν υἱὸν αὐτῆς τὸν πρωτότοκον, καὶ ἐσπαργάνωσεν αὐτὸν καὶ ἀνέκλινεν αὐτὸν ⸀ἐν φάτνῃ, διότι οὐκ ἦν αὐτοῖς τόπος ἐν τῷ καταλύματι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/007.yaml
  text: And she gave birth to her firstborn son[a], and wrapped him in cloths and laid him in a feeding trough[c][b], because there was no place for them in the guest room.
translation:
  language: zh_hans
  text: 她生下了她的长子，用布把他包裹起来，放在牲口槽里[b]，因为客房[c]里没有可供他们住的地方。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 或译“马槽”。希腊语指牲畜进食的地方或饲料槽。
    reason: lexical_alternative
  - marker: c
    text: 传统译作“客店”。希腊语κατάλυμα可指客房或住宿处；路加在10:34使用另一个词指商业客店。
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτεκεν
  choice: 生下
  rationale: 在分娩语境中自然、准确地表达“生产、生育”，符合现代汉语习惯。
- source_word: τὸν υἱὸν αὐτῆς τὸν πρωτότοκον
  choice: 自己的长子
  rationale: 表达“她的头生儿子”；“长子”自然体现出生次序，不额外引入后续神学含义。
- source_word: ἐσπαργάνωσεν
  choice: 用布把他裹好
  rationale: 该动词指用布包裹婴儿；此译法清楚自然，并避免使用现代读者可能不熟悉的专门词。
- source_word: ἀνέκλινεν
  choice: 放在
  rationale: 在婴儿的语境中表示使其躺下、安放；“放在”简洁自然。
- source_word: φάτνῃ
  choice: 牲口槽
  rationale: 该词指动物取食的地方或饲料槽；“牲口槽”在现代汉语中直观明确，传统译法“马槽”列入脚注。
- source_word: τόπος
  choice: 地方
  rationale: 保留 τόπος 的宽泛含义，说明客房中没有可供他们使用的空间。
- source_word: καταλύματι
  choice: 客房
  rationale: κατάλυμα 可指供客人住宿的房间或住宿处；路加在22:11用该词指客房，而在10:34用另一词指商业客店，因此正文采用“客房”。
theological_decisions:
- issue: κατάλυμα 应译为传统的“客店”，还是住宅中的客房或较宽泛的住宿处
  choice: 客房
  alternative: 客店；住宿处
  rationale: 原文并不要求理解为商业客店。路加在22:11以 κατάλυμα 指客房，在10:34则以 πανδοχεῖον 指客店；“客房”较少把传统圣诞场景中未由原文明确表达的细节带入正文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。正文避免古雅的“头生”和可能过度限定动物种类的“马槽”，同时用脚注保留传统译法及关键解释。英文资料中脚注[a]的位置与内容不相符：其内容涉及“包裹”，而不是“长子”；本稿未机械沿用该错置标记。
