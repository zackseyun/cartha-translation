revisions:
- from: 事情是这样：天使离开他们、升入天上以后，牧人就彼此说：“我们现在到伯利恒去[a]，看看所发生的这件事[b]，就是主让我们知道的。”
  to: 事情是这样：天使离开牧人、往天上去以后，牧人彼此说：“我们现在到伯利恒去[a]，看看这件已经发生、主让我们知道的事[b]。”
  rationale: 修订使叙事衔接和直接引语更符合现代标准汉语，同时避免把天使“往天上去”具体化为“升入”。脚注a保留ἕως的较字面表达；脚注b保留ῥῆμα的“话／事情”词义幅度，并仍明确其所指为已经发生的内容。
