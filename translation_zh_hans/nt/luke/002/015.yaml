source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ὡς ἀπῆλθον ἀπ’ αὐτῶν εἰς τὸν οὐρανὸν οἱ ἄγγελοι, ⸀οἱ ποιμένες ⸀ἐλάλουν πρὸς ἀλλήλους· Διέλθωμεν δὴ ἕως Βηθλέεμ καὶ ἴδωμεν τὸ ῥῆμα τοῦτο τὸ γεγονὸς ὃ ὁ κύριος ἐγνώρισεν ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/015.yaml
  text: And it happened that when the angels had gone away from them into heaven[a], the shepherds said to one another, “Let us go now to Bethlehem and see this thing that has happened[b], which the Lord has made known to us.”
translation:
  language: zh_hans
  text: 事情是这样：天使离开牧人、往天上去以后，牧人彼此说：“我们现在到伯利恒去[a]，看看这件已经发生、主让我们知道的事[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“直到伯利恒”；这里指前往伯利恒。
    reason: lexical_alternative
  - marker: b
    text: 或译“这件已经发生的事”或“这已经发生的话”；希腊语ῥῆμα可指“话”“事情”或“事件”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: 事情是这样
  rationale: 保留路加常用的叙事衔接语气，同时避免采用现代汉语中显得古旧的“事情就这样成了”。
- source_word: ὡς ἀπῆλθον ἀπ’ αὐτῶν εἰς τὸν οὐρανὸν οἱ ἄγγελοι
  choice: 天使离开他们、升入天上以后
  rationale: 将先于牧人说话发生的动作自然表达为时间背景；“天上”在此指向属天领域，而不只指可见的天空。
- source_word: οἱ ποιμένες ἐλάλουν πρὸς ἀλλήλους
  choice: 牧人就彼此说
  rationale: λαλέω在引出直接引语时译为“说”最自然；“彼此”保留相互交谈之意。
- source_word: Διέλθωμεν δὴ
  choice: 我们现在……去
  rationale: 以“我们……去”表达劝勉式虚拟语气，并用“现在”传达δὴ在语境中的即时、催促意味。
- source_word: ἕως Βηθλέεμ
  choice: 到伯利恒去
  rationale: 现代汉语以“到……去”自然表达抵达目的地；ἕως较字面的“直到”另见脚注。
- source_word: καὶ ἴδωμεν
  choice: 看看
  rationale: “看看”自然表达与“去”并列的劝勉，同时保留亲自察看的意思。
- source_word: τὸ ῥῆμα τοῦτο τὸ γεγονός
  choice: 所发生的这件事
  rationale: ῥῆμα在这里指天使所宣告并已经发生的事情；“这件事”清楚自然，同时以脚注保留“话／事情”等词义幅度。
- source_word: ὃ ὁ κύριος ἐγνώρισεν ἡμῖν
  choice: 就是主让我们知道的
  rationale: “让我们知道”准确表达ἐγνώρισεν的使知含义，不强化为技术性的“启示”；“主”保留κύριος的神学称谓及其语境张力。
theological_decisions:
- issue: ὁ κύριος（“主”）的所指
  choice: 译作“主”，不在正文中进一步限定所指
  alternative: 明确译为“主上帝”，或按弥赛亚含义加以解释
  rationale: 近处语境表明信息的最终来源是上帝，但原文只用“主”；保留这一称谓可避免把叙事中的神学呼应过早限定为某一更具体表述。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“事情是这样”保留路加叙事公式；引语使用日常可懂但不过分口语化的表达。所有词义歧义均以脚注呈现，正文不作宗派性解释。
