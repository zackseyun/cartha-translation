  naturalness: “事情是这样：”和“牧人就彼此说”略显生硬；引语末尾的“就是主让我们知道的”在现代汉语中指代关系不够顺畅。改为“天使离开牧人、往天上去以后”和“牧人彼此说”，并把定语整合入“这件已经发生、主让我们知道的事”，更自然庄重。
  terminology: “天使”“牧人”“伯利恒”“主”均合适。“主”应保留，不进一步限定其所指。
