base_translation:
  language: en
  yaml_path: translation/nt/luke/002/041.yaml
  text: And his parents went to Jerusalem year by year for the Feast of the Passover.
translation:
  language: zh_hans
  text: 每年逾越节，他的父母都上耶路撒冷去。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπορεύοντο
  choice: 都……去
  rationale: 未完成时在“每年”的限定下表示过去惯常、反复发生的行动；“都……去”用自然的现代汉语传达这一习惯性。
- source_word: γονεῖς
  choice: 父母
  rationale: 该复数名词通常就是“父母”，既准确又符合本段朴素的家庭叙事。
- source_word: κατ’ ἔτος
  choice: 每年
  rationale: 准确表达κατά加宾格的逐年、年年之意，比“逐年”更符合现代汉语叙事习惯。
- source_word: Ἰερουσαλὴμ
  choice: 耶路撒冷
  rationale: 采用现代中文圣经及一般中文通行的地名译法；与“上……去”连用，也自然反映前往耶路撒冷的惯用表达。
- source_word: τῇ ἑορτῇ τοῦ πάσχα
  choice: 逾越节
  rationale: 指特定的犹太节期；置于句首作时间和场合说明，汉语中已足以表达他们在此节期前往耶路撒冷。
theological_decisions:
- issue: 如何称呼耶稣的家庭成员
  choice: 他的父母
  alternative: 他的父亲和母亲
  rationale: 原文使用普通的亲属称谓“父母”。照原文翻译保留叙事的直接含义，不因路加福音其他地方关于童女生子的记述而改写或回避这一称谓。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“每年……都……”清楚表达惯常行动；“上耶路撒冷去”是中文中前往圣城的自然说法。
