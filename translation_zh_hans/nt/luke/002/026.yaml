  text: καὶ ἦν αὐτῷ κεχρηματισμένον ὑπὸ τοῦ πνεύματος τοῦ ἁγίου μὴ ἰδεῖν θάνατον πρὶν ⸂ἢ ἂν⸃ ἴδῃ τὸν χριστὸν κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/026.yaml
  text: And it had been revealed to him by the Holy Spirit that he would not see death before he had seen the Lord’s Messiah[a].
translation:
  language: zh_hans
  text: 圣灵曾向他启示：他在见到主的弥赛亚[a]以前，必不会死。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“主的受膏者”；传统译法为“主所立的基督”。
    reason: 说明χριστός可按词义译为“受膏者”，并保留汉语传统译本对“主的基督”的惯用表达。
lexical_decisions:
- source_word: κεχρηματισμένον
  choice: 曾指示
  rationale: 被动形式表示领受来自神的启示或指示；结合随后明确的施事者“圣灵”，译作“圣灵曾指示他”自然清楚，又不缩窄为“警告”。
- source_word: ὑπὸ τοῦ πνεύματος τοῦ ἁγίου
  choice: 圣灵曾指示他
  rationale: ὑπό加属格标明施事者；采用主动式汉语句法，仍明确保留圣灵亲自施行指示的作用。
- source_word: μὴ ἰδεῖν θάνατον
  choice: 必不见死
  rationale: 保留原文“见死亡”的意象；“见死”虽具经文语体色彩，但现代读者仍能理解为死亡。
- source_word: πρὶν ἢ ἂν ἴδῃ
  choice: 在见到……以前
  rationale: 准确表达时间上的先后与尚待发生的条件：在见到弥赛亚之前，他不会死。
- source_word: τὸν χριστὸν κυρίου
  choice: 主的弥赛亚
  rationale: χριστός在此是称号，译作“弥赛亚”；属格κυρίου直译为“主的”，保留其可表示归属或差遣关系的宽度，不擅自补入“所立”“所应许”等解释。
- source_word: κυρίου
  choice: 主的
  rationale: 以所有格形式对应属格，简洁地保留原文关系。
theological_decisions:
- issue: χριστός作为弥赛亚称号的译法
  choice: 弥赛亚
  alternative: 基督；受膏者
  rationale: 此处带定冠词并与“主的”相连，作为称号使用；正文用“弥赛亚”呈现其犹太弥赛亚背景，脚注保留词义性和传统性译法。
- issue: “主的弥赛亚”中属格关系
  choice: 主的
  alternative: 主所膏立的；主所差来的
  rationale: 原文属格可涵盖归属、授权或来源等关系；直译“主的”避免把其中一种解释写入正文。
translation_notes:
  register: 采用自然而庄重的现代书面汉语。“必不见死”有适度的经文语体色彩，用来保留原文意象；冒号使圣灵所指示的内容清楚易读。
