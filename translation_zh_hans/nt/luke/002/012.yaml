base_translation:
  language: en
  yaml_path: translation/nt/luke/002/012.yaml
  text: 'And this will be the sign for you: you will find a baby wrapped in cloths and lying in a manger[a][b].'
translation:
  language: zh_hans
  text: 这就是给你们的记号：你们会找到一个婴孩，用布包裹着[a]，躺在食槽里[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “用布包裹着”也可译作“用襁褓裹着”。
    reason: lexical_alternative
  - marker: b
    text: “食槽”传统译作“马槽”；原词泛指牲畜的喂食槽，并未限定是马使用的。
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖον
  choice: 记号
  rationale: 这里指牧人辨认婴孩的标志或凭据；“记号”自然保留其叙事功能，不将其限定为神迹或证明。
- source_word: εὑρήσετε
  choice: 你们会看见
  rationale: εὑρίσκω在此表示牧人寻找后见到所描述的婴孩；现代汉语用“会看见”自然通顺，也保留将来陈述的语气。
- source_word: βρέφος
  choice: 一个婴孩
  rationale: βρέφος指年幼的婴儿；“婴孩”庄重、清楚，并符合本段语体。
- source_word: ἐσπαργανωμένον
  choice: 裹着布
  rationale: 该分词描述婴孩被布包裹的状态；“裹着布”简明易懂，不额外规定布的具体形制。
- source_word: κείμενον
  choice: 躺在
  rationale: κεῖμαι描述当时所处的位置和状态；“躺在”比“被放在”更准确地保留其静态意义。
- source_word: φάτνῃ
  choice: 食槽
  rationale: φάτνη在这里指牲畜进食用的槽；“食槽”对现代读者具体清楚，同时不添加原文没有明说的牲畜类别。
- source_word: τοῦτο ὑμῖν τὸ σημεῖον
  choice: 这就是给你们的记号
  rationale: 希腊文省略系词；“这就是”自然补足判断关系，并强调下文所述是给牧人的辨认记号。
theological_decisions:
- issue: 给牧人的“记号”具有何种性质
  choice: 译作辨认性的“记号”，不明说它是神迹。
  alternative: 把它表述为上帝所赐的超自然凭证或证明。
  rationale: 本节直接说明牧人将凭什么认出婴孩。译文保留“记号”的宽度，让其可能具有的神学确认意义保持含蓄，而不替经文作进一步界定。
translation_notes:
  register: 采用现代、庄重而通俗的叙事语言。“婴孩”比“婴儿”略具经文语体感，但仍为普通读者熟悉；“食槽”较传统的“马槽”更贴近原词范围。所有脚注标记均置于相关经文句末。
