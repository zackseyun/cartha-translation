  text: καὶ αὐτοὶ οὐ συνῆκαν τὸ ῥῆμα ὃ ἐλάλησεν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/050.yaml
  text: And they did not understand the statement that he spoke to them[a].
translation:
  language: zh_hans
  text: 他们不明白他对他们所说的这句话[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“这话”、“这番话”或“这件事”。
    reason: 词义选择：ῥῆμα可表示具体的话语、所说的内容，也可表示事情。
lexical_decisions:
- source_word: καὶ
  choice: 却
  rationale: καί通常是连接词“并且”，但在这里承接耶稣刚才的话，并引出父母不明白的反应；汉语用“却”能自然表达语境中的转折，而不改变命题内容。
- source_word: αὐτοὶ
  choice: 他们
  rationale: 在上下文中指耶稣的父母。希腊文明确使用代词，汉语译作“他们”自然清楚，无须加“自己”来强化。
- source_word: οὐ συνῆκαν
  choice: 不明白
  rationale: συνίημι在此表示理解、领会；“不明白”是现代汉语中直接自然的表达，不弱化为“不完全明白”，也不引申为“不接受”。
- source_word: τὸ ῥῆμα
  choice: 这句话
  rationale: ῥῆμα可指话语、所说的话或事情；此处具体回指耶稣刚说的内容，译为“这句话”在现代汉语中清楚自然。
- source_word: ὃ ἐλάλησεν αὐτοῖς
  choice: 他对他们所说的
  rationale: 保留关系从句的修饰关系，并准确表达ἐλάλησεν αὐτοῖς“他向他们说”；汉语调整为前置定语，使句子流畅。
theological_decisions:
- issue: 耶稣父母对他话语的反应
  choice: 直述他们“不明白”耶稣所说的话
  alternative: 他们“不完全明白”或“不接受”
  rationale: 希腊文明确表达未能理解，而没有限定为仅仅理解不充分，也没有表示拒绝接受。译文保留有关耶稣身份与使命的叙事张力，不另作神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“他对他们所说的这句话”贴近原文结构，同时符合汉语习惯；“却”体现上下文中的自然转折。
