  text: ἰδόντες δὲ ⸀ἐγνώρισαν περὶ τοῦ ῥήματος τοῦ λαληθέντος αὐτοῖς περὶ τοῦ παιδίου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/017.yaml
  text: And when they saw it[a], they made known the message that had been spoken to them about this child.
translation:
  language: zh_hans
  text: 他们看见后，就把那曾对他们说过的、关于这孩子的话告诉了人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “话”也可译为“信息”或“说的话”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: 他们看见以后
  rationale: 不定过去时分词在此表示先于主句动作发生的时间背景。原文没有明说“看见”的宾语，因此中文也不补出具体宾语，以保留其含蓄性。
- source_word: δὲ
  choice: 就
  rationale: δέ在这里温和地推进叙事，并非表示强烈转折；“就”自然承接前后动作及其先后次序。
- source_word: ἐγνώρισαν
  choice: 传开了
  rationale: γνωρίζω在此意为使人知道、传扬出去。“传开了”符合牧人把所得知之事告诉他人的语境，同时不把动作强化为正式宣告。
- source_word: περὶ τοῦ ῥήματος
  choice: 关于这孩子的话
  rationale: ῥῆμα可指所说的话、信息或事情；结合λαληθέντος，译作“话”既直接呼应“说过”，又保留其所传内容的含义。
- source_word: τοῦ λαληθέντος αὐτοῖς
  choice: 那曾对他们说过的
  rationale: 保留定冠词化被动分词的修饰关系和被动表达，并用“曾”表明这话先前已经对他们说过。
- source_word: περὶ τοῦ παιδίου τούτου
  choice: 关于这孩子
  rationale: παιδίον在本段指新生的耶稣；“这孩子”现代、自然，也保留原文指示词τούτου。
theological_decisions:
- issue: ῥῆμα与先前天使宣告的关系
  choice: 话
  alternative: 信息；事情
  rationale: “话”可同时指说出的言语及其内容，并与“曾对他们说过的”紧密衔接；译文不明说说话者是天使，因为本节原文本身没有重述主语，从而避免添加解释性信息。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“他们看见以后”不补宾语，保留希腊文的省略；“传开了”清楚表达使他人知道的动作。定语较长，但通过顿号分隔两层修饰，使句意清晰。
