id: LUK.21.7
reference: Luke 21:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ἐπηρώτησαν δὲ αὐτὸν λέγοντες· Διδάσκαλε, πότε οὖν ταῦτα ἔσται, καὶ τί τὸ σημεῖον ὅταν μέλλῃ ταῦτα γίνεσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/007.yaml
  text: And they asked him[a], saying, “Teacher, when then will these things be, and what will be the sign when these things are about to happen?”
translation:
  language: zh_hans
  text: 于是，他们问他：“老师，那么，这些事什么时候会发生？这些事快要发生时[a]，会有什么征兆呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这些事将要发生时”。希腊语动词也可作比“快要”更宽泛的理解。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπηρώτησαν
  choice: 他们问
  rationale: 不定过去时直陈语气叙述一次过去的询问；“问”是现代汉语中最自然的对应表达。
- source_word: δὲ
  choice: 于是
  rationale: 此处是推进叙事的轻微连接词，并非强烈转折；“于是”自然承接上文。
- source_word: λέγοντες
  choice: 以直接引语表达，不另译“说”
  rationale: 该分词引出询问的具体内容；现代汉语在“问”后直接接引语更自然，也完整传达其功能。
- source_word: Διδάσκαλε
  choice: 老师
  rationale: 保留“教导者”的基本词义，采用普通读者易懂的现代称呼，不强化为“主人”。
- source_word: πότε οὖν
  choice: 那么……什么时候
  rationale: “什么时候”表达时间疑问，“那么”保留οὖν承接上文并作推论的语气。
- source_word: ταῦτα ἔσται
  choice: 这些事……会发生
  rationale: εἰμί与中性复数指示代词连用时表示事情出现或发生；汉语译作“会发生”比直译“会是”自然。
- source_word: σημεῖον
  choice: 征兆
  rationale: 指预示重大事件将发生的可辨认迹象；“征兆”符合此处语境，也保留其指示功能。
- source_word: ὅταν
  choice: ……时
  rationale: 与虚拟语气连用，引出面向未来的时间从句；汉语以“……时”自然表达。
- source_word: μέλλῃ
  choice: 快要
  rationale: 表达事情临近或即将发生的意味，同时不规定其具体时间距离。
- source_word: γίνεσθαι
  choice: 发生
  rationale: 此处指相关事件成为现实；“发生”是清楚自然的现代汉语表达。
theological_decisions:
- issue: 末世事件的时间意味
  choice: 将μέλλῃ译为“快要”，保留临近发生的语感
  alternative: 译为较宽泛的“将要”或“要”
  rationale: 经文提出有关时间与征兆的问题，但没有说明事件究竟距离多远；译文保留原文的迫近意味，同时不据此建立特定的末世时间表。
- issue: σημεῖον的单复数
  choice: 译为单数概念“什么征兆”
  alternative: 译为复数意味较强的“哪些征兆”
  rationale: 原文使用单数τὸ σημεῖον，应保留门徒询问一个识别性征兆的表达，不擅自扩展为多个征兆。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“老师”保持日常可理解性；“那么”保留推论语气；避免机械保留“说”而造成“问他说”的生硬结构。脚注标记置于其实际说明的“快要发生时”之后。
