  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐγὼ γὰρ δώσω ὑμῖν στόμα καὶ σοφίαν ᾗ οὐ δυνήσονται ⸂ἀντιστῆναι ἢ ἀντειπεῖν⸃ ⸀ἅπαντες οἱ ἀντικείμενοι ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/015.yaml
  text: For I will give you words and wisdom that all who oppose you will not be able to withstand or contradict.
translation:
  language: zh_hans
  text: 因为我必赐给你们言辞和智慧，所有反对你们的人都无法抗拒或反驳。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στόμα
  choice: 当说的话
  rationale: 字面为“口”，此处以转喻指临场作答的言辞；译作“当说的话”符合现代汉语，也保留这是耶稣所赐的表达能力。
- source_word: σοφίαν
  choice: 智慧
  rationale: 直接对应“智慧”，与言辞并列，指应对反对者时蒙赐的洞察和判断。
- source_word: ἀντιστῆναι
  choice: 抗拒
  rationale: 表达站出来抵挡、成功对抗之意，并与后面的言语反驳相区别。
- source_word: ἀντειπεῖν
  choice: 驳倒
  rationale: 该词指反驳、顶嘴；结合语境译作“驳倒”，自然表达反对者无法以言辞推翻门徒的答辩。
- source_word: οἱ ἀντικείμενοι ὑμῖν
  choice: 反对你们的人
  rationale: 准确传达与门徒敌对、作对的人，不额外限定其身份。
theological_decisions:
- issue: 耶稣所赐的是字面意义的“口”还是言辞能力
  choice: 当说的话
  alternative: 口才／口和智慧
  rationale: “口”在此是转喻。意译为“当说的话”既符合汉语习惯，也不把应许缩减为一般性的口才。
- issue: “无法抗拒或驳倒”的应许范围
  choice: 按原文保留绝对措辞，不补充“最终”“成功地”等限制语
  alternative: 无法成功抗拒或最终驳倒
  rationale: 原文明确说所有反对者都不能抵挡或反驳；译文不替文本解释该应许在具体事件中的实现方式。
translation_notes:
  register: 采用庄重而自然的现代普通话。“因为”承接上文原因说明；“必赐给”体现将来时的郑重应许。句式清晰，适合公开诵读。
