source:
  edition: SBLGNT
  text: Πρὸ δὲ τούτων πάντων ἐπιβαλοῦσιν ἐφ’ ὑμᾶς τὰς χεῖρας αὐτῶν καὶ διώξουσιν, παραδιδόντες εἰς ⸀τὰς συναγωγὰς καὶ φυλακάς, ⸀ἀπαγομένους ἐπὶ βασιλεῖς καὶ ἡγεμόνας ἕνεκεν τοῦ ὀνόματός μου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/012.yaml
  text: But before all these things[a], they will lay their hands on you and persecute you, handing you over to synagogues and prisons[b], bringing you before kings and governors because of my name.
translation:
  language: zh_hans
  text: 但在这一切事发生以前，他们要向你们下手[a]，迫害你们，把你们交给会堂，关进监狱；你们还会被押到君王和总督面前，因为我的名[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“抓捕你们”。原文直译是“把手加在你们身上”，在这里是指带着敌意抓人或加害于人。
    reason: lexical_alternative
  - marker: b
    text: “因为我的名”也可译作“为了我的名”，或按含义译作“因为我”。正文保留圣经中“名”与耶稣本人及其权柄相连的表达。
    reason: alternative_reading
lexical_decisions:
- source_word: Πρὸ δὲ τούτων πάντων
  choice: 但在这一切事发生以前
  rationale: πρό加属格表示时间上的先后；πάντων保留“一切”的范围，δέ则以“但”承接并转折前文。
- source_word: ἐπιβαλοῦσιν ἐφ’ ὑμᾶς τὰς χεῖρας αὐτῶν
  choice: 他们要向你们下手
  rationale: 原文是带敌意的惯用表达，可指抓捕或施加暴力。“向你们下手”既保留“手”的意象，也符合现代汉语表达。
- source_word: διώξουσιν
  choice: 迫害你们
  rationale: 上下文涉及门徒因耶稣的名遭受拘捕和审讯，因此译为“迫害”，而非一般意义的“追赶”。
- source_word: παραδιδόντες
  choice: 把你们交给
  rationale: 该分词说明迫害的实施方式，含有把人交由敌对机构或司法机关处置的意味。
- source_word: εἰς τὰς συναγωγὰς καὶ φυλακάς
  choice: 交给会堂，关进监狱
  rationale: “会堂”保留原有机构名称；φυλακάς在此指监禁场所。为使汉语自然，按两个对象分别搭配“交给”和“关进”，但不把“会堂”明确解释为某种特定法庭。
- source_word: ἀπαγομένους
  choice: 你们还会被押到
  rationale: ἀπαγομένους是被动分词，描写他们被强制带走；“被押到”既保留被动关系，也体现拘押和司法场景。
- source_word: ἐπὶ βασιλεῖς καὶ ἡγεμόνας
  choice: 君王和总督面前
  rationale: ἐπί在此司法语境中表示被带到统治者面前受审或陈诉；“面前”自然传达这一含义。
- source_word: ἕνεκεν τοῦ ὀνόματός μου
  choice: 因为我的名
  rationale: ἕνεκεν表示原因或缘故；保留“我的名”这一圣经表达，使其继续承载耶稣本人、权柄及对他的承认等内涵，而不将其收窄为单一解释。
theological_decisions:
- issue: “我的名”在受迫害语境中的含义
  choice: 保留“因为我的名”
  alternative: 因为我；为了我的名；因为你们属于我
  rationale: “我的名”在圣经用语中与耶稣本人及其权柄密切相关。直保留这一表达，可维持其神学分量和含义张力，避免加入原文未明确说明的从属关系。
- issue: 会堂在交付语境中的功能
  choice: 保留“会堂”而不扩写为“会堂法庭”或“会堂领袖”
  alternative: 交给会堂的审判机关；交给会堂领袖
  rationale: 会堂在此可能包含审理或惩戒功能，但原文只使用机构名称。正文不将隐含功能定为唯一解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“向你们下手”保留原文具体意象；“被押到”体现希腊文被动分词。用分号整理连续迫害行动，避免过长串句。所有脚注标记均置于其实际说明的词语之后。
