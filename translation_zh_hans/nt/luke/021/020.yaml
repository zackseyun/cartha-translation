  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ὅταν δὲ ἴδητε κυκλουμένην ὑπὸ ⸀στρατοπέδων Ἰερουσαλήμ, τότε γνῶτε ὅτι ἤγγικεν ἡ ἐρήμωσις αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/020.yaml
  text: But when you see Jerusalem surrounded by armies[b][a], then know that her desolation has drawn near.
translation:
  language: zh_hans
  text: 但你们看见耶路撒冷被军队[a]包围时，就要知道，这城的荒凉[b]已经临近了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“被军营包围”。希腊语这个词可以指军营，也可以指驻扎的军队；这里指围困耶路撒冷的军事力量。
    reason: lexical_alternative
  - marker: b
    text: “荒凉”呼应先知书中有关审判的用语；另参《马太福音》24:15和《马可福音》13:14中的相关表述。
    reason: cross_reference
lexical_decisions:
- source_word: Ὅταν δὲ ἴδητε
  choice: 但你们看见……时
  rationale: ὅταν与虚拟语气构成面向未来的时间条件；“……时”在现代汉语中自然。δὲ表示轻微转折或话题推进，译作“但”。
- source_word: κυκλουμένην ὑπὸ στρατοπέδων
  choice: 被军队包围
  rationale: κυκλουμένην是现在时被动分词，描写耶路撒冷正处于被围困的状态。στρατόπεδον可指军营、驻扎的部队或军队；上下文是围城，因此正文译作“军队”，并以脚注保留词义上的另一种表达。
- source_word: Ἰερουσαλήμ
  choice: 耶路撒冷
  rationale: 采用现代中文圣经传统中通行的地名译法。
- source_word: τότε γνῶτε
  choice: 就要知道
  rationale: τότε标明随之而来的判断；γνῶτε为命令语气，要求听众认清这一征兆的意义，“要知道”保留了命令的力度。
- source_word: ἤγγικεν
  choice: 已经临近了
  rationale: 该动词为完成时，表达某事已趋近并处于近在眼前的状态；“已经临近了”兼顾其时态意味和自然汉语。
- source_word: ἡ ἐρήμωσις αὐτῆς
  choice: 这城的荒凉
  rationale: αὐτῆς回指耶路撒冷；汉语不必用阴性代词，改以“这城”明确所指。ἐρήμωσις含荒凉、毁坏之意，“荒凉”保留先知性审判用语，也不把含义缩减为单指彻底毁灭。
theological_decisions:
- issue: 耶路撒冷将受审判的具体所指
  choice: 正文仅说“这城的荒凉已经临近了”，不指定更完整的末世解释框架。
  alternative: 译成“毁灭”，或在正文中明确关联“那造成荒凉的可憎之物”。
  rationale: 本节本身只说明军队围城是耶路撒冷荒凉临近的征兆。“荒凉”既保存原词及先知性审判的回响，也避免把本节未明说的解释体系加入正文。相关经文联系放在脚注中。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“被军队包围”清楚呈现围城景象；“这城的荒凉”避免把城市人格化为“她”所造成的现代汉语生硬感，同时保留原文的所有格关系和审判语气。正文中的脚注标记按首次出现顺序排列为[a]、[b]。
