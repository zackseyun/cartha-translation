source:
  edition: SBLGNT
  text: ἀγρυπνεῖτε ⸀δὲ ἐν παντὶ καιρῷ δεόμενοι ἵνα ⸀κατισχύσητε ἐκφυγεῖν ⸀ταῦτα πάντα τὰ μέλλοντα γίνεσθαι, καὶ σταθῆναι ἔμπροσθεν τοῦ υἱοῦ τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/036.yaml
  text: But stay awake at all times[a], praying that you may have strength to escape all these things that are about to happen[c][b], and to stand before the Son of Man.
translation:
  language: zh_hans
  text: 但你们要时刻警醒，祈求能有力量[a]逃过这一切将要发生的事，并站在人子面前。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本在“能有力量”处作“被算为配得”，即“祈求你们被算为配得逃过这一切……”。
    reason: textual_variant
  - marker: b
    text: “站在人子面前”可能含有在他面前得以站立、蒙悦纳或得到证实的意味，但希腊原文没有明说。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγρυπνεῖτε
  choice: 警醒
  rationale: 命令式要求持续保持清醒与警觉；“警醒”在现代汉语中自然、庄重，也保留了原文清醒守望的意象。
- source_word: δὲ
  choice: 但
  rationale: 承接上文并形成轻微转折，提醒听众不要被先前所说的事压住，反要警醒。
- source_word: ἐν παντὶ καιρῷ
  choice: 时刻
  rationale: 表达“在每一个时候、始终”的持续性，汉语简洁自然。
- source_word: δεόμενοι
  choice: 祈求
  rationale: 该分词指带着恳求意味的祷告；“祈求”比泛指的“祷告”更准确体现请求的语义。
- source_word: ἵνα κατισχύσητε
  choice: 祈求自己能有力量
  rationale: κατισχύω表示有能力、足以做到或胜过；此处译出力量与能力，而不采用异文所表达的“算为配得”。
- source_word: ἐκφυγεῖν
  choice: 逃过
  rationale: 表达从将临之事中逃脱；“逃过”与汉语宾语“一切……的事”搭配自然。
- source_word: ταῦτα πάντα τὰ μέλλοντα γίνεσθαι
  choice: 这一切将要发生的事
  rationale: μέλλω加不定式可表达未来或临近发生；“将要发生”保留这种开放度，不额外强化时间上的迫近。
- source_word: σταθῆναι
  choice: 站
  rationale: 保留原文站立的形象，不在正文中明说蒙接纳、被判无罪或站立得稳。
- source_word: ἔμπροσθεν
  choice: 在……面前
  rationale: 自然表达处于某位面前或临到其面前的关系。
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: 人子
  rationale: 采用福音书中该称号通行而准确的中文译法，保留其犹太背景及基督论意义。
theological_decisions:
- issue: κατισχύσητε与末世忍耐或逃脱的关系
  choice: 译为“能有力量”，强调有能力逃过并站立。
  alternative: “可以算为配得”
  rationale: SBLGNT正文为κατισχύσητε，语义是有力量、足以做到或得胜；“算为配得”来自另一文本异文，应置于脚注而非正文。
- issue: σταθῆναι ἔμπροσθεν τοῦ υἱοῦ τοῦ ἀνθρώπου的含义
  choice: 直译为“站在人子面前”。
  alternative: “蒙接纳地站在人子面前”或“到人子面前受审”
  rationale: 上下文可能暗含末世审判中的站立、蒙接纳或得以坚立，但希腊文本没有明说结果，因此保留其神学张力。
- issue: 末世灾难中的“逃过”是否专指肉身免灾
  choice: 不在译文中限定逃脱的方式或范围。
  alternative: 明确译作“免受所有灾难”或“在灾难中属灵得胜”
  rationale: ἐκφυγεῖν确实表示逃脱，但经文本身未在本句解释这种逃脱如何实现；不应加入特定末世体系。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“警醒”“祈求”“人子”保持经文语体；句法顺畅，避免古奥。“将要发生”既可表达未来，也不把μέλλω过度限定为迫在眉睫。脚注标记均置于正文相关句末。
