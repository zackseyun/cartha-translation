  text: καὶ ἔσεσθε μισούμενοι ὑπὸ πάντων διὰ τὸ ὄνομά μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/017.yaml
  text: And you will be hated by all because of my name[a].
translation:
  language: zh_hans
  text: 你们将因我的名[a]被众人憎恨。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因我”。“我的名”可以指耶稣的身份、权柄，以及人对他的认信和效忠。
    reason: 说明词义上的可译方式，并保留“我的名”在本语境中的多重内涵。
lexical_decisions:
- source_word: ἔσεσθε μισούμενοι
  choice: 将……被……憎恨
  rationale: ἔσεσθε与现在时被动分词μισούμενοι构成将来被动表达。现代汉语用“将……被……憎恨”自然传达其将来意义与被动关系；上下文也容许持续遭受敌视的含义。
- source_word: ὑπὸ πάντων
  choice: 被众人
  rationale: ὑπό加属格标明施事者，πάντων意为所有人或众人。“众人”既简洁自然，也保留原文概括性的广泛范围，不额外限定具体群体。
- source_word: διὰ τὸ ὄνομά μου
  choice: 因我的名
  rationale: διά加宾格在此表示原因。“因”准确而凝练；“我的名”保留原文的表达及其关于耶稣身份、权柄和对他认信效忠的丰富内涵。
theological_decisions:
- issue: “我的名”在门徒受迫害语境中的含义
  choice: 正文保留“因我的名”
  alternative: “因我”或“因为你们属于我”
  rationale: 原文明确使用“我的名”。在路加—使徒行传中，“名”可以涵盖耶稣的身份、权柄以及人对他的公开认信。保留这一措辞可避免将其含义缩减为单一解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“憎恨”比“恨恶”更符合当代通行表达；句序把原因置于谓语前，符合自然汉语，同时清楚保留原文的因果关系和被动意义。
