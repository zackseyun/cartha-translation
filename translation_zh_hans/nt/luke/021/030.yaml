    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: 一……就
  rationale: 引出带有不确定条件色彩的时间从句；在这则观察树木的比喻中，用“一……就”自然表达事情发生时随即作出的判断。
- source_word: προβάλωσιν
  choice: 长出嫩芽
  rationale: 该动词本身泛指长出或萌发，宾语并未明说；结合上文无花果树和各样树木的植物语境，“嫩芽”自然传达新生长的枝叶，同时以脚注保留原文的概括性。
- source_word: ἤδη
  choice: 已经
  rationale: 本节两次出现ἤδη。中文在前半句以“一长出”表达新生长已经出现的时序，后半句明译“已经”，避免生硬重复而保留时间推进。
- source_word: βλέποντες
  choice: 看见了
  rationale: 分词表示伴随情形或判断的依据；中文用“看见了，就知道”自然呈现由观察而得知的关系。
- source_word: ἀφ’ ἑαυτῶν
  choice: 你们自己
  rationale: 表示凭自身的观察便能作出判断；“你们自己看见了”清楚传达无需别人说明、亲自辨认的意思。
- source_word: γινώσκετε
  choice: 知道
  rationale: 表示从所见现象作出的通常认知，“知道”简明自然。
- source_word: ἐγγὺς
  choice: 近了
  rationale: 表达时间上的临近，“近了”符合现代汉语季节将至的说法。
- source_word: θέρος
  choice: 夏天
  rationale: 指夏季；“夏天”是普通读者最自然易懂的表达。
