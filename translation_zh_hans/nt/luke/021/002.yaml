  source_fidelity: 基本忠实地译出“他看见”“一个穷寡妇”及“两枚小铜币”。但βάλλουσαν为现在分词，原稿“投了”较明确地表为已完成的动作；改为“投进”更能保留所见动作的进行性。ἐκεῖ是地点副词，“在那里”比“往那里”更贴合原文，也更合汉语表达。
  naturalness: “往那里投了”在现代汉语中略显生硬，且“两个小铜钱”的量词搭配不如“两枚小铜钱”自然。修订后保持简洁、庄重的叙事语体。
