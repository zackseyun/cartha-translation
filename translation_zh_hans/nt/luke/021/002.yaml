  text: And he saw a poor widow putting in two small copper coins there,[a]
translation:
  language: zh_hans
  text: 他又看见一个穷寡妇在那里投进两枚小铜钱。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作“两个雷普塔”，即两枚极小的铜币。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδεν
  choice: 看见
  rationale: 直译ὁράω的简单过去叙事动作，保持经文自然推进，不额外加入“留意”或“观察”的意味。
- source_word: δέ
  choice: 又
  rationale: 此处δέ是较弱的叙事连接词；“又”自然承接上一节，并不过分强调转折。
- source_word: τινα
  choice: 一个
  rationale: τις表示身份未具体说明的人；现代汉语用“一个”即可自然表达这种不定性。
- source_word: χήραν
  choice: 寡妇
  rationale: 准确对应χήρα，也保留该身份在当时社会中所暗含的脆弱处境。
- source_word: πενιχράν
  choice: 穷
  rationale: πενιχρός指经济贫困、资财微薄；“穷”通俗准确，而“赤贫”可能过度强化。
- source_word: βάλλουσαν
  choice: 投了
  rationale: βάλλω本义为投、放；在向奉献箱投入钱币的语境中，“投了”简洁自然，也与前文动作相衔接。
- source_word: ἐκεῖ
  choice: 往那里
  rationale: 保留地点副词ἐκεῖ的明确表达；所指地点由上一节语境确定。
- source_word: λεπτὰ δύο
  choice: 两个小铜钱
  rationale: λεπτόν是面值极小的铜币；正文采用读者易懂的功能性表达，并由脚注保留原币名及价值信息。
