  text: ἀρχομένων δὲ τούτων γίνεσθαι ἀνακύψατε καὶ ἐπάρατε τὰς κεφαλὰς ὑμῶν, διότι ἐγγίζει ἡ ἀπολύτρωσις ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/028.yaml
  text: But when these things begin to happen[a], straighten up and lift up your heads[c][b], because your redemption is drawing near.
translation:
  language: zh_hans
  text: 但这些事开始发生时[a]，你们要挺起身来，抬起头[b]，因为你们的救赎近了[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“随着这些事开始发生。”
    reason: lexical_alternative
  - marker: b
    text: “挺起身来，抬起头”也可译为“挺直身子，仰起头”。
    reason: lexical_alternative
  - marker: c
    text: “救赎”也可译为“解救”；这里指即将临到的最终解救。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχομένων δὲ τούτων γίνεσθαι
  choice: 但这些事开始发生时
  rationale: 属格独立结构表达时间背景，可理解为“当／随着这些事开始发生”；“但”体现 δέ 从前文灾难景象转向劝勉的轻微转折。
- source_word: ἀνακύψατε
  choice: 挺起身来
  rationale: 该动词可指从弯曲姿态直起身子，也含振作、勇敢面对之意；此译保留身体动作及其象征意味。
- source_word: ἐπάρατε τὰς κεφαλὰς ὑμῶν
  choice: 抬起头
  rationale: 忠实保留命令语气和“抬头”这一表达信心与盼望的形象，现代汉语也自然。
- source_word: διότι
  choice: 因为
  rationale: 清楚表达原因关系，符合现代汉语行文。
- source_word: ἐγγίζει
  choice: 近了
  rationale: 现在时表示正在临近；“近了”简洁自然，并保留动态趋近感。
- source_word: ἀπολύτρωσις
  choice: 救赎
  rationale: 保留该词兼具释放、拯救和救赎的丰富含义，不把它缩减为一般性的脱险。
theological_decisions:
- issue: 末世语境中“你们的救赎”的含义
  choice: 正文保留“你们的救赎”，在注释中说明也可译作“解救”，并指出此处指耶稣的子民所盼望的最终解救。
  alternative: 仅理解为摆脱当时的历史危机，或完全非末世化地理解为抽象的属灵状态。
  rationale: 上下文具有面向未来的末世性；保留“救赎”既维持其神学分量，也不在正文中过度限定其实现方式。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“挺起身来，抬起头”保留原文连续两个命令及其充满盼望的身体意象；句式简洁，适合公开诵读。
