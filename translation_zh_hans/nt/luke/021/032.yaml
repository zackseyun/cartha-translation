  text: ἀμὴν λέγω ὑμῖν ὅτι οὐ μὴ παρέλθῃ ἡ γενεὰ αὕτη ἕως ἂν πάντα γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/032.yaml
  text: Truly I say to you[c][b][a], this generation will certainly not pass away until all things happen.
translation:
  language: zh_hans
  text: 我实在告诉你们：这一代[a]绝不会过去，直到一切[b]都发生[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这一代”也可理解为“这一族人”或“这个时代”；这个希腊词可有不止一种理解，但“这一代”是最直接的译法。
    reason: alternative_reading
  - marker: b
    text: 希腊文直译为“一切”或“所有的事”。有些译本按上下文译为“这一切（事）”，但原文此处并没有“这些”。
    reason: lexical_alternative
  - marker: c
    text: 或译：“成就”或“成为事实”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: 实在
  rationale: 用于引出郑重而权威的断言；“实在”符合现代中文圣经语体，又保留原文的庄严语气。
- source_word: λέγω ὑμῖν
  choice: 我告诉你们
  rationale: 自然、清楚地表达对复数听众说话；较逐字的“我对你们说”更符合现代汉语习惯。
- source_word: οὐ μὴ παρέλθῃ
  choice: 还没有过去……都必定发生
  rationale: 将强调否定与“直到”结构按自然中文重组，以“还没有……都必定……”表达这一代在所有事情发生以前绝不会过去的强烈断言。
- source_word: ἡ γενεὰ αὕτη
  choice: 这一代
  rationale: γενεά在此最直接的词义是“代、世代”；正文不替读者判定其具体所指。
- source_word: ἕως ἂν
  choice: 还没有……都
  rationale: 在中文中以“还没有过去，这一切都……”自然表达原文“直到……为止”的时间界限。
- source_word: πάντα
  choice: 这一切
  rationale: πάντα本身是“所有的事／一切”；中文“这一切”自然回指上文所述诸事，但不具体增列内容。
- source_word: γένηται
  choice: 发生
  rationale: 此处表示事情发生、成为事实；避免译作“应验”，以免加入原词未必要求的神学含义。
theological_decisions:
- issue: 末世言论中“这一代”的所指
  choice: 正文译作“这一代”，不界定是耶稣同时代的人、看见征兆的一代，还是某一族群。
  alternative: 这一族人；这个时代；看见这些事的那一代
  rationale: 原文词语本身可直译为“这一代”，但其所指历来有争议；译文应保留这种解释张力，不在正文中替读者作神学判定。
- issue: πάντα是否应明确译作“这一切事”
  choice: 译作“这一切”，让它自然回指语境，同时不增加具体名词。
  alternative: 万事；所有这些事
  rationale: 希腊文只有πάντα，没有另写“这些”；中文若译成孤立的“万事”容易被理解为宇宙间的一切，而“这一切”能自然承接上下文，但脚注说明原文字面形式。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“我实在告诉你们”保留郑重宣告的语气；整句按汉语习惯重组“直到”结构，并用“必定”体现οὐ μή的强烈否定。所有脚注标记均置于对应正文词语之后。
