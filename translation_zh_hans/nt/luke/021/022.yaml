  text: ὅτι ἡμέραι ἐκδικήσεως αὗταί εἰσιν τοῦ πλησθῆναι πάντα τὰ γεγραμμένα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/022.yaml
  text: For these are days of vengeance[b][a], that all the things written may be fulfilled.
translation:
  language: zh_hans
  text: 因为这些日子是报应的日子[a]，为要使一切所写的都得以应验[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “报应”也可译作“惩罚”或“追讨”。这里指司法性的报偿，并非任意泄愤。
    reason: lexical_alternative
  - marker: b
    text: “为要使”也可译作“以致”。原文在目的和结果之间留有余地。
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 承接上文，为先前的警告说明原因；“因为”自然保留其因果和解释作用。
- source_word: ἡμέραι ἐκδικήσεως
  choice: 报应的日子
  rationale: 保留复数“日子”及司法性追讨、惩治的严肃含义；“报应”比单纯的“惩罚”更能体现按公义施行追讨，但不把它解释成人的泄愤。
- source_word: αὗταί εἰσιν
  choice: 这些日子是
  rationale: 直译指示代词和系词，并明确承接上下文所说的那些日子。
- source_word: τοῦ πλησθῆναι
  choice: 要使……都得以应验
  rationale: τοῦ加不定式可表达目的或结果；“要使……得以”在现代汉语中保留这种指向实现的关系，而不将其严格限定为单一语义。
- source_word: πάντα τὰ γεγραμμένα
  choice: 所写的一切
  rationale: 保留实词化分词的广泛指称，不在正文中擅自补成“圣经”或“预言”；结合“应验”即可自然表明其经文背景。
theological_decisions:
- issue: ἐκδίκησις所指的审判性质
  choice: 报应
  alternative: 惩罚；伸冤；追讨
  rationale: 本节所说的是与经上记载之应验相连的司法性报偿。“报应”保留其严厉和公义追讨的意味，同时避免将其弱化为一般的“公义”，也不把它描述成任性的报复。
- issue: τοῦ加不定式的目的或结果意味
  choice: 要使所写的一切都得以应验
  alternative: 以致所写的一切都得以应验
  rationale: 原结构可兼具目的与结果色彩；正文采用较中性的表达，脚注提示结果性理解，不强行消除原文张力。
- issue: τὰ γεγραμμένα的范围
  choice: 所写的一切
  alternative: 经上所写的一切
  rationale: 原文没有明说“经上”或“圣经”；保留较宽泛的说法，避免在正文中过度限定其指涉。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“报应的日子”保留经文的审判语域；“所写的一切”避免添加原文未明说的“经上”，并由“应验”自然呈现其经文背景。所有脚注标记均已置于正文相应位置。
