  text: Καὶ ⸀ἔσονται σημεῖα ἐν ἡλίῳ καὶ σελήνῃ καὶ ἄστροις, καὶ ἐπὶ τῆς γῆς συνοχὴ ἐθνῶν ἐν ἀπορίᾳ ⸀ἤχους θαλάσσης καὶ σάλου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/025.yaml
  text: And there will be signs in sun and moon and stars[a], and on the earth distress of nations in perplexity because of the roaring of the sea and the surging waves[b],
translation:
  language: zh_hans
  text: 日月星辰将显出征兆[a]；地上的列国将陷入困苦，面对海的轰鸣和翻腾，茫然无措[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“在太阳、月亮和星辰中将有征兆。”
    reason: 说明希腊文介词结构；正文采用自然的现代汉语语序。
  - marker: b
    text: 原文较直译：“在海和翻腾的响声中陷入困惑。”也可理解为“因海和翻腾的响声而困惑”。
    reason: 说明原文紧凑的关联结构，并保留其是否表达严格因果关系的歧义。
lexical_decisions:
- source_word: σημεῖα
  choice: 异象
  rationale: 这里指非同寻常、具有指示意义的现象。“异象”简洁庄重，又不预先断定这些现象只是象征或全属字面事件。
- source_word: ἐν ἡλίῳ καὶ σελήνῃ καὶ ἄστροις
  choice: 日月星辰将出现
  rationale: 希腊文直译为“在太阳、月亮和星辰中”。汉语改用“日月星辰将出现异象”，自然地表达异象出现于这些天体之中，同时保留并列结构。
- source_word: συνοχὴ ἐθνῶν
  choice: 各国都将陷入困苦
  rationale: συνοχή表示受压迫般的困顿、焦灼；ἐθνῶν在此泛指世上各国或各族人民，而不是专指与犹太人相对的外邦人。
- source_word: ἐν ἀπορίᾳ
  choice: 不知所措
  rationale: ἀπορία含有无路可走、找不到办法的意味；“不知所措”比“困惑”更充分地传达这种无助状态。
- source_word: ἤχους θαλάσσης καὶ σάλου
  choice: 海洋的轰鸣和波涛的翻腾
  rationale: ἦχος本指声音或响声，在此自然表达为“轰鸣”；σάλος指海水的翻腾、动荡。补出“波涛”使现代汉语清楚流畅，但不增加解释性的末世论内容。
theological_decisions:
- issue: 天体异象的性质
  choice: 直接译为日月星辰出现异象，不说明这些异象是字面的天文变动、象征性图景，还是兼有两者。
  alternative: 将其明确解释为实际的宇宙灾变，或明确解释为政治与历史变动的象征。
  rationale: 本节只宣告天上有异象、地上各国困苦，并未在句内解决其实现方式；译文应保留这一解释空间。
- issue: 海洋动荡与列国困苦的关系
  choice: 用“面对……不知所措”表达列国因海洋的轰鸣翻腾而陷入无助，却不把语法关系限定为严格的单一因果。
  alternative: 明确译成“因为海洋……而困苦”，或仅并列海洋动荡与列国困苦。
  rationale: 希腊文结构紧凑，声音与翻腾可理解为列国困惑无措所面对的情势；本译法既呈现关联，也避免过度拆解句法。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“日月星辰”凝练自然；“各国”比传统的“列国”更易为普通现代读者直接理解。句子以分号区分天上异象与地上困苦，同时保留两者在同一末世图景中的联系。
