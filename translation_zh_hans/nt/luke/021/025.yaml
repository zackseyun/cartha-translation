revisions:
- from: 日月星辰将出现异象[a]；地上各国都将陷入困苦，面对海洋的轰鸣和波涛的翻腾，不知所措[b]。
  to: 日月星辰将显出征兆[a]；地上的列国将陷入困苦，面对海的轰鸣和翻腾，茫然无措[b]。
  rationale: 修订以“征兆”保留σημεῖα的宽泛含义，避免把天体征兆解释为特定类型的幻见；以“列国”准确而庄重地表达ἐθνῶν，并删去原文未明示的“都”。“面对海的轰鸣和翻腾，茫然无措”保留列国困苦、困惑与海上动荡之间的关联，不强行裁定其为唯一严格因果。脚注b改正直译说明，并明确原文句法关系存在可保留的歧义。
