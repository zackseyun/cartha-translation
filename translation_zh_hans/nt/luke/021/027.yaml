  text: καὶ τότε ὄψονται τὸν υἱὸν τοῦ ἀνθρώπου ἐρχόμενον ἐν νεφέλῃ μετὰ δυνάμεως καὶ δόξης πολλῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/027.yaml
  text: And then they will see the Son of Man coming in a cloud with power and great glory[a].
translation:
  language: zh_hans
  text: 那时，他们要看见人子在云中[a]带着能力和极大的荣耀而来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在云上”。希腊原文用单数“云”，直译为“在云中”；这一意象也呼应《但以理书》第7章及相关经文中人子随着天云而来的景象。
    reason: 说明介词短语的译法可能性，并保留原文单数形式及其互文背景。
lexical_decisions:
- source_word: ὄψονται
  choice: 要看见
  rationale: 该词是ὁράω的将来时形式，在此表示将来的视觉感知；“要看见”自然清楚，也保留原文的直接语气。
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: 人子
  rationale: “人子”是现代中文圣经语境中确立已久的称号，既保留其称号性质，也维持与《但以理书》第7章意象的互文联系。
- source_word: ἐρχόμενον
  choice: 而来
  rationale: 现在分词描述他们将看见人子正在来临；“而来”在中文句法中自然，并保留来临的动态意味。
- source_word: ἐν νεφέλῃ
  choice: 在云中
  rationale: 原文为单数名词，并以ἐν加与格表达；“在云中”最贴近字面，同时不排除《但以理书》及神显传统中的云彩意象。
- source_word: μετὰ δυνάμεως
  choice: 带着能力
  rationale: μετά加属格在此表示伴随；“带着能力”准确、通顺，不额外限定这种能力的性质。
- source_word: δόξης πολλῆς
  choice: 极大的荣耀
  rationale: πολλῆς修饰“荣耀”，在此表示程度宏大；“极大的荣耀”以自然中文传达其强调语气和庄严色彩。
theological_decisions:
- issue: 基督论称号τὸν υἱὸν τοῦ ἀνθρώπου的译法
  choice: 人子
  alternative: 那一位属人的／人之子
  rationale: 保留公认的“人子”称号，既不把它简化为一般的人，也不在译文中添加超出原文的基督论解释，并维持与《但以理书》第7章的联系。
- issue: 云彩意象及其但以理书／神显背景
  choice: 在云中
  alternative: 在云上；驾云；随着云彩
  rationale: 依照路加此处单数νεφέλῃ和ἐν的表述，不与其他经文的复数“云彩”协调，也不把介词明确解释为“在……上”；脚注保留可能的空间理解。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“那时……要看见……”保持末世宣告的肃穆语气；语序尽量自然，同时使“人子”“能力”“荣耀”等关键意象清晰突出。
