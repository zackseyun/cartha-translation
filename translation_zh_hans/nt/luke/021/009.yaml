id: LUK.21.9
reference: Luke 21:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὅταν δὲ ἀκούσητε πολέμους καὶ ἀκαταστασίας, μὴ πτοηθῆτε· δεῖ γὰρ ταῦτα γενέσθαι πρῶτον, ἀλλ’ οὐκ εὐθέως τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/009.yaml
  text: But when you hear of wars and upheavals[a], do not be terrified; for these things must happen first[b], but the end is not at once.
translation:
  language: zh_hans
  text: 但你们听见战争和动乱[a]时，不要惊恐；因为这些事必须先发生，但终局不会立刻来到。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “动乱”也可译作“骚乱”、“混乱”或“动荡”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“但终局并不立刻发生。”
    reason: alternative_reading
lexical_decisions:
- source_word: ὅταν δὲ
  choice: 但……时
  rationale: ὅταν引出将来不定时间从句，δὲ在上下文中表示轻微转折或推进；译作“但……时”自然承接前文。
- source_word: ἀκούσητε
  choice: 听见
  rationale: 在有关战争和动乱的消息这一语境中，“听见”可自然表达听到相关报道。
- source_word: πολέμους
  choice: 战争
  rationale: 准确表达πόλεμος的复数所指，即各样武装冲突；汉语中“战争”可作集合性表达。
- source_word: ἀκαταστασίας
  choice: 动乱
  rationale: 该词可指失序、骚乱或社会政治动荡；“动乱”范围较宽，不把含义限定为暴动或叛乱。
- source_word: μὴ πτοηθῆτε
  choice: 不要惊恐
  rationale: 保留原词被吓住、陷入恐慌的较强情绪力度，同时符合现代汉语表达。
- source_word: δεῖ γὰρ
  choice: 因为……必须
  rationale: γάρ说明原因，δεῖ表达必要性；此译法清楚而自然。
- source_word: ταῦτα γενέσθαι πρῶτον
  choice: 这些事必须先发生
  rationale: γίνομαι在此指事件发生，πρῶτον表明次序；译文保留其先后关系。
- source_word: ἀλλ’ οὐκ εὐθέως τὸ τέλος
  choice: 但终局不会立刻来到
  rationale: 希腊文后半句省略谓语；汉语补出“来到”以表达自然，同时保留其核心意思：终局并非紧接着发生。
theological_decisions:
- issue: 末世时间次序
  choice: 战争和动乱必须先发生，但终局不会随即来到。
  alternative: 这些事件属于终局之前的时期，却不等于终局本身。
  rationale: 译文保留经文对时间先后的强调和刻意留下的张力，不引入任何特定的末世论体系。
- issue: τὸ τέλος的表达
  choice: 终局
  alternative: 末日；结局
  rationale: “终局”保留“那终结”的概括性和末世语境，又不擅自把它限定为某个具体事件；“末日”较易加入解释性联想。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“惊恐”保留原文较强的恐惧色彩；“终局”避免过度解释τὸ τέλος。所有脚注标记均已置于正文。
