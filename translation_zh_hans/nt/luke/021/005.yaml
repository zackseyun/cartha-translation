  text: Καί τινων λεγόντων περὶ τοῦ ἱεροῦ, ὅτι λίθοις καλοῖς καὶ ἀναθήμασιν κεκόσμηται εἶπεν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/005.yaml
  text: And as some were speaking about the temple[a], that it had been adorned with beautiful stones and votive offerings, he said[b],
translation:
  language: zh_hans
  text: 正当有些人谈论圣殿[a]，说它用美石和奉献之物[b]装饰得华美时，他说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的希腊语指整个圣殿区域，不只是内部的圣所。
    reason: cultural_note
  - marker: b
    text: 或译“献给上帝的礼物”；指奉献给上帝并陈列在圣殿里的物品。
    reason: lexical_alternative
lexical_decisions:
- source_word: τινων λεγόντων
  choice: 正当有些人谈论
  rationale: 以时间情境从句表达属格独立结构，并用“正当……时”保留未完成动作的持续意味。
- source_word: τοῦ ἱεροῦ
  choice: 圣殿
  rationale: ἱερόν泛指整个圣殿区域；“圣殿”是现代中文中自然、通行的译法，范围差异以脚注说明。
- source_word: λίθοις καλοῖς
  choice: 美石
  rationale: 简洁保留καλοῖς对石材美观、上乘的评价，也符合庄重的经文语体。
- source_word: ἀναθήμασιν
  choice: 奉献之物
  rationale: 指献给上帝并陈列于圣殿的礼物；“奉献之物”比“还愿物”涵盖面更宽，也比音译或专门礼仪术语更易懂。
- source_word: κεκόσμηται
  choice: 装饰得十分华美
  rationale: 表达完成时被动语态所呈现的现存结果，即圣殿因这些装饰而显得华美；“十分华美”自然传达装饰效果，并未将美感仅限于石头。
- source_word: εἶπεν
  choice: 他说
  rationale: 原文动词仅隐含第三人称主语，因此不在正文中增添“耶稣”这一名字；冒号承接下一节的话。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“正当……时”使较长的希腊语句式在中文中保持清晰；以“它”回指圣殿，并保留本节作为下一节引语导语的开放结构。英文咨询层的脚注标记与脚注内容显然错位，本稿按希腊词实际对应关系将圣殿范围说明置于[a]，将ἀναθήμασιν的词义说明置于[b]。
