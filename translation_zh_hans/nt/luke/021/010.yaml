id: LUK.21.10
reference: Luke 21:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: τότε ἔλεγεν αὐτοῖς· Ἐγερθήσεται ἔθνος ἐπ’ ἔθνος καὶ βασιλεία ἐπὶ βασιλείαν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/010.yaml
  text: Then he said to them[a], “Nation will rise against nation, and kingdom against kingdom,”
translation:
  language: zh_hans
  text: 接着，他对他们说：“民要起来[a]攻打民，国要起来攻打国。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “起来”也可译作“兴起”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: 接着
  rationale: 作为时间与话语推进标记，承接上文并引出耶稣进一步的讲论；“接着”比直译“那时”更符合此处现代汉语叙事。
- source_word: ἔλεγεν
  choice: 说
  rationale: 虽为未完成时，但在直接引语的引介公式中，现代汉语用“说”最自然，不额外强调持续或反复。
- source_word: αὐτοῖς
  choice: 对他们
  rationale: 自然表达与格间接宾语。
- source_word: Ἐγερθήσεται
  choice: 要起来
  rationale: 该将来时被动/中间形在敌对冲突公式中表示起来与另一方对抗；“要起来”既保留动态意象，也符合现代汉语表达。
- source_word: ἔθνος
  choice: 民
  rationale: 此处指民族或人民群体；用“民”既保留与“国”的平行关系，也避免把它完全等同于现代民族国家。
- source_word: ἐπ’ ἔθνος
  choice: 攻打民
  rationale: ἐπί加宾格在此表达敌对关系；汉语“攻打”清楚呈现冲突含义，比生硬的“对着”自然。
- source_word: βασιλεία
  choice: 国
  rationale: 此处指具体的王国或政治疆域；“国”简洁自然，并与前半句“民”构成传统而清楚的平行。
- source_word: ἐπὶ βασιλείαν
  choice: 攻打国
  rationale: 延续前一平行分句的敌对含义，使重复结构在汉语中清晰可辨。
theological_decisions:
- issue: 末世语境中的冲突公式
  choice: 将本句译为对民与民、国与国彼此冲突的直接预告，不加入特定末世体系。
  alternative: 将其限定为只指耶路撒冷陷落，或视为末日事件的详细时间表。
  rationale: 本节本身只陈述群体和政权之间将发生冲突；译文保留这一概括性表述，不替经文裁定更广泛的末世论争议。
translation_notes:
  register: 采用庄重、简明的现代标准汉语。“民……民，国……国”保留原文紧凑的平行结构；第二个“要起来”在汉语中补出，使两个分句自然对称。脚注标记置于其实际说明的词语之后。
