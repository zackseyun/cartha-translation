  text: And not a hair from your head will perish[a].
translation:
  language: zh_hans
  text: 你们头上的一根头发也绝不会失掉[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作：“你们头上的一根头发也绝不会失掉。”希腊文将两个否定词连用，以表达坚定的保证。
    reason: 说明原文强调否定的语法形式与语气。
lexical_decisions:
- source_word: καὶ
  choice: 也
  rationale: καί在这里承接上文；现代汉语把它自然地置于句中，用“也”突出连一根头发都不例外，同时不额外加入“然而”之类的明确转折。
- source_word: θρὶξ
  choice: 一根头发
  rationale: 单数名词按汉语量词习惯译为“一根头发”，保留原文细微到一根头发的谚语式表达。
- source_word: ἐκ τῆς κεφαλῆς ὑμῶν
  choice: 你们头上的
  rationale: 这是表示所属或部分关系的短语；译成“你们头上的”符合现代汉语习惯，并保留复数受话者。
- source_word: οὐ μὴ
  choice: 绝不会
  rationale: οὐ μή与虚拟式构成强烈否定；“绝不会”简洁自然地传达其确定而强调的语气。
- source_word: ἀπόληται
  choice: 失落
  rationale: ἀπόλλυμι可指灭亡、毁坏或失去；“失落”保留“有所丧失”的意象，也避免把本句限定为绝不会受到任何肉体伤害。
theological_decisions:
- issue: 本节的保证与上文所说有些门徒会被杀之间的张力
  choice: 保留“一根头发也绝不会失落”这一谚语式、强烈的保证，不在正文中解释其具体层面。
  alternative: 译成绝不会有任何头发受损，从而理解为不会遭受任何身体伤害。
  rationale: 紧邻的上下文明确提到逼迫和死亡，因此不应在翻译中消除表面张力。现有译法既保留原文形象和保证，也不额外规定它只指身体安全或只指终极保全。
translation_notes:
  register: 采用简洁、庄重而通顺的现代标准汉语。“失落”保持原文的严肃语气和语义张力；脚注说明希腊文强烈否定，正文不作超出原文的神学解释。
