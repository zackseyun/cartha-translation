  text: Ἦν δὲ τὰς ἡμέρας ⸂ἐν τῷ ἱερῷ διδάσκων⸃, τὰς δὲ νύκτας ἐξερχόμενος ηὐλίζετο εἰς τὸ ὄρος τὸ καλούμενον Ἐλαιῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/037.yaml
  text: And during the days he was teaching in the temple[b][a], but at night he would go out and lodge on the mountain called the Mount of Olives.
translation:
  language: zh_hans
  text: 耶稣白天在圣殿里[a]教导，晚上则出去，到那座称为橄榄山的山上过夜[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣殿”原文指整个圣殿区域，并非专指里面的圣所。
    reason: lexical_alternative
  - marker: b
    text: “过夜”也可译作“住宿”；原词有时可以指露宿。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦν ... διδάσκων
  choice: 教导人
  rationale: 未完成时的εἰμί与现在分词构成迂回表达，表示一段时期内持续或惯常进行的活动；结合“白天……晚上……”的对照，汉语用“白天……教导人”自然表达这种反复状态。
- source_word: τὰς ἡμέρας
  choice: 白天
  rationale: 时间宾格表示活动发生的时段，并与复数的“晚上”形成惯常性的昼夜对照；现代汉语“白天”最自然。
- source_word: ἐν τῷ ἱερῷ
  choice: 在圣殿里
  rationale: ἱερόν指整个圣殿区域，而非专指内层圣所；正文采用通行且易懂的“圣殿”，脚注说明其范围。
- source_word: τὰς δὲ νύκτας
  choice: 晚上
  rationale: 与“白天”形成对照，并表示反复发生的夜间活动；δέ的对照关系由汉语句式及“就”自然体现。
- source_word: ἐξερχόμενος
  choice: 出去
  rationale: 分词与主要动词所述活动相伴，语境中指耶稣夜间离开圣殿或城中所在之处；“出去”保留原文未明说出发点的特点。
- source_word: ηὐλίζετο
  choice: 过夜
  rationale: 该词指住宿或度过夜晚，也可能暗示露宿；“过夜”不额外限定住宿方式，并以脚注保留露宿的可能。
- source_word: εἰς τὸ ὄρος
  choice: 到……山上
  rationale: εἰς表达趋向，而过夜则发生在抵达后的地点；“到……山上过夜”同时自然呈现移动及结果位置。
- source_word: τὸ καλούμενον Ἐλαιῶν
  choice: 那座称为橄榄山的山
  rationale: 保留原文“山……称为橄榄”的完整命名结构，并采用现代汉语通行地名“橄榄山”。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准汉语。以“白天……晚上……”呈现原文的惯常性昼夜对照；没有把过夜方式具体化，也没有把ἱερόν误解为内层圣所。所有脚注标记均置于正文相关词句之后。
