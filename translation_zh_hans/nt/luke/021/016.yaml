  yaml_path: translation/nt/luke/021/016.yaml
  text: But you will be handed over even by parents and brothers and relatives and friends[a], and they will put some of you to death.
translation:
  language: zh_hans
  text: 然而，就连父母、兄弟、亲属和朋友也会把你们交出去[a]；他们会杀害你们中的一些人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “兄弟”也可理解为“兄弟姐妹”或“同胞手足”，因为希腊语阳性复数有时可指包括男女在内的一群同胞。
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδοθήσεσθε
  choice: 会把你们交出去
  rationale: 该词是 παραδίδωμι 的将来时被动态，基本意思是把人交给当权者或敌对者。“交出去”自然清楚，也保留了亲近之人如此行所产生的背叛意味，而不把该词直接限定为“出卖”。
- source_word: δὲ
  choice: 然而
  rationale: δέ承接上文，并带出温和的转折。“然而”能体现这一转向，又不过分强化对立。
- source_word: καὶ
  choice: 就连……也
  rationale: δέ之后第一个καί在语境中有递进、强调作用：不只是外人，就连至亲好友也会这样做。
- source_word: ὑπὸ
  choice: 由……（以主动句式表达为“父母……会把”）
  rationale: ὑπό与被动态连用，标明行为的施事者。汉语改用主动句式更自然，且准确保留施事关系。
- source_word: γονέων
  choice: 父母
  rationale: γονεύς的复数统称父亲和母亲；“父母”是准确、自然的现代汉语。
- source_word: ἀδελφῶν
  choice: 兄弟
  rationale: ἀδελφός的阳性复数在此亲属清单中直译为“兄弟”；该词也可能涵盖同胞姊妹，因此以脚注保留这一词义可能性。
- source_word: συγγενῶν
  choice: 亲属
  rationale: 该词指同族或有亲缘关系的人；“亲属”现代、清楚，范围也与原文相符。
- source_word: φίλων
  choice: 朋友
  rationale: φίλος复数的直接、自然对应。
- source_word: θανατώσουσιν
  choice: 处死
  rationale: θανατόω意为使人死亡。“处死”保留蓄意致死或执行死刑般的庄重语气，但不限定具体方式。
- source_word: ἐξ ὑμῶν
  choice: 你们中的一些人
  rationale: ἐξ ὑμῶν在致死动词之后表示群体中的一部分；“你们中的一些人”准确而自然。
theological_decisions:
- issue: 亲属清单中ἀδελφῶν的范围
  choice: 正文译作“兄弟”
  alternative: “兄弟姐妹”或“同胞手足”
  rationale: 保留原文阳性复数的形式，不在正文中擅自消除其性别表达；同时，希腊语阳性复数在此类语境中可能泛指男女同胞，因此在脚注中说明较广的可能范围。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。以主动句式表达希腊语被动态，使施事关系在汉语中更自然；“就连……也”传达递进强调。“处死”保持经文的严肃语气。
