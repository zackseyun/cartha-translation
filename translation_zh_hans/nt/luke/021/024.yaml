  text: καὶ πεσοῦνται στόματι μαχαίρης καὶ αἰχμαλωτισθήσονται εἰς ⸂τὰ ἔθνη πάντα⸃, καὶ Ἰερουσαλὴμ ἔσται πατουμένη ὑπὸ ἐθνῶν, ἄχρι ⸀οὗ ⸀πληρωθῶσιν καιροὶ ἐθνῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/024.yaml
  text: And they will fall by the edge of the sword and will be led captive into all the nations[c][b][a], and Jerusalem will be trampled by the nations until the times of the nations are fulfilled.
translation:
  language: zh_hans
  text: 他们要倒在刀刃下，被掳到列国中去[a]；耶路撒冷要被列国践踏[b]，直到列国的时期满了[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“被掳到各外邦中去”。希腊语ἔθνη既可指“列国”，也可指“外邦人（非犹太人）”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“耶路撒冷要被外邦人践踏”。
    reason: alternative_reading
  - marker: c
    text: 或译：“直到外邦人的时期满了”；也可译：“直到列国所定的时期结束了”。
    reason: alternative_reading
lexical_decisions:
- source_word: πεσοῦνται
  choice: 要倒下
  rationale: πίπτω的将来时形式；在战争语境中指倒下毙命。译作“倒下”保留原文意象，死亡方式由下文“在刀刃下”说明。
- source_word: στόματι μαχαίρης
  choice: 在刀刃下
  rationale: 原文直译为“在刀剑之口下”，是指被刀剑杀死的惯用表达。“在刀刃下”在现代汉语中自然，也保留刀剑的具体意象。
- source_word: αἰχμαλωτισθήσονται
  choice: 被掳到……去
  rationale: 该词为将来时被动形式，表示被俘并被带走；“被掳到……去”兼顾被动语态和迁移、流放之意。
- source_word: εἰς τὰ ἔθνη πάντα
  choice: 到列国中去
  rationale: εἰς加宾格表达进入或去往；πάντα表示全部。中文“列国”在此可涵盖众国，并与本节后两处ἔθνη保持用词呼应。
- source_word: Ἰερουσαλὴμ
  choice: 耶路撒冷
  rationale: 采用该地名通行的现代中文译名。
- source_word: πατουμένη
  choice: 被……践踏
  rationale: 该被动分词与ἔσται构成迂回式将来表达，并带有持续受压制的意味。“践踏”保留脚下踩踏和受制于人的双重意象。
- source_word: ὑπὸ ἐθνῶν
  choice: 被列国
  rationale: ὑπό标明施事者；“列国”保留ἔθνη可指各国或外族人的语义空间，并与本节其他两处相呼应。
- source_word: ἄχρι οὗ
  choice: 直到
  rationale: 准确、简洁地表达时间界限。
- source_word: πληρωθῶσιν
  choice: 满了
  rationale: πληρόω的简短被动形式，既可表示时期完成，也可带有达到所定限度的意味；“满了”不预先规定具体末世解释。
- source_word: καιροὶ ἐθνῶν
  choice: 列国的时期
  rationale: καιροί指具有特定意义或所定界限的时期，而不只是流逝的时间；此译法也保留属格关系的开放性。
theological_decisions:
- issue: 本节三处ἔθνη的译法
  choice: 列国
  alternative: 外族人／非犹太人
  rationale: 同一希腊词在本节出现三次。“列国”既保持词语呼应，也不把含义过早限定为族群或宗教身份；上下文允许“外族人／非犹太人”的理解，因此在脚注中保留。
- issue: καιροὶ ἐθνῶν的含义
  choice: 列国的时期满了
  alternative: 外族人的时期满了／列国所定的时期结束了
  rationale: 原文可能指一个有界限、终将完成的时期，但未说明具体的末世时间表。“时期满了”保留其完成及可能的神定意味，而不引入特定神学体系。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“倒在刀刃下”保留原文战争意象；“被掳到……去”清楚表达被俘后带往异地。“列国”略带经文语体，但现代读者容易理解，并能在一句内维持三处ἔθνη的词汇连贯。
