  text: Προσέχετε δὲ ἑαυτοῖς μήποτε βαρηθῶσιν ⸂ὑμῶν αἱ καρδίαι⸃ ἐν κραιπάλῃ καὶ μέθῃ καὶ μερίμναις βιωτικαῖς, καὶ ⸂ἐπιστῇ ἐφ’ ὑμᾶς αἰφνίδιος⸃ ἡ ἡμέρα ἐκείνη
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/034.yaml
  text: But watch yourselves[a], lest your hearts be weighed down with dissipation and drunkenness and the worries of life, and that day come upon you suddenly
translation:
  language: zh_hans
  text: “你们要谨慎自守，免得你们的心因狂欢宴饮[a]、醉酒和今生的忧虑而变得沉重，那日子突然临到你们。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “狂欢宴饮”所译的希腊词，也可特指饮酒过量后头痛、恶心等不适。
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσέχετε δὲ ἑαυτοῖς
  choice: 你们要谨慎自守
  rationale: προσέχω 加反身代词表示留意自己、警戒自己；“谨慎自守”自然凝练，并保留命令和警醒的语气。δέ 在此起承接兼转折作用，中文无需机械译出。
- source_word: μήποτε
  choice: 免得
  rationale: 引出所要防止的负面结果；“免得”准确表达警告中的预防意味。
- source_word: βαρηθῶσιν … αἱ καρδίαι
  choice: 你们的心……变得沉重
  rationale: 保留 βαρέω 的重量隐喻；“心”在这里指人的内在生命、判断与属灵警觉，不仅是情感。
- source_word: κραιπάλῃ
  choice: 纵酒无度
  rationale: 该词可指饮酒过度的放纵状态，也可侧重其不适后果；正文采用较宽泛、易懂的“纵酒无度”，脚注保留词义范围。
- source_word: μέθῃ
  choice: 醉酒
  rationale: 直接表达因酒而醉的状态，并与 κραιπάλῃ 所指的纵酒放荡相区别。
- source_word: μερίμναις βιωτικαῖς
  choice: 今生的忧虑
  rationale: μερίμναις 指忧虑、挂虑，βιωτικαῖς 指属于现世生活的事；“今生的忧虑”简洁且保留其范围。
- source_word: ἐπιστῇ ἐφ’ ὑμᾶς αἰφνίδιος
  choice: 突然临到你们
  rationale: ἐφίστημι 结合 ἐπί 表示来到、临到某人，αἰφνίδιος 表示突如其来；中文以副词“突然”自然表达。
- source_word: ἡ ἡμέρα ἐκείνη
  choice: 那日子
  rationale: 原文只说“那日子”；保留上下文中的末世指向，不增添“审判”等解释性措辞。
theological_decisions:
- issue: “那日子”的末世含义
  choice: 那日子
  alternative: 审判的日子
  rationale: 讲论语境赋予该短语末世意味，但原文没有明说“审判”；因此保留其简约措辞及神学张力。
- issue: 心“变得沉重”的含义
  choice: 保留重量隐喻
  alternative: 心变得麻木／迟钝
  rationale: 语境包含警觉受损的意思，但 βαρέω 的直接意象是被压重；不把隐喻完全解释为某一种心理或属灵状态。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“谨慎自守”保持警告的力度；“心变得沉重”保留原文形象。脚注标记[a]已置于相关词语之后。
