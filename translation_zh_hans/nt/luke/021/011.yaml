  text: σεισμοί τε μεγάλοι ⸂καὶ κατὰ τόπους⸃ ⸂λιμοὶ καὶ λοιμοὶ⸃ ἔσονται, φόβητρά τε καὶ ⸂σημεῖα ἀπ’ οὐρανοῦ μεγάλα⸃ ἔσται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/011.yaml
  text: There will be great earthquakes[a], and in various places famines and plagues[c][b]; and there will be terrors and great signs from heaven.
translation:
  language: zh_hans
  text: 将有大地震，各地会有饥荒和瘟疫；还会有可怕的事，以及来自天上的大征兆[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “来自天上”也可译作“从天空而来”。希腊语οὐρανός既可指天界，也可指可见的天空；这里可能是在说人能看见的天象。
    reason: lexical_alternative
lexical_decisions:
- source_word: σεισμοί τε μεγάλοι
  choice: 大地震
  rationale: σεισμός在此通常指字面意义的地震；μέγας表示规模或严重程度。“大地震”既直接，又符合现代汉语习惯。
- source_word: κατὰ τόπους
  choice: 各地
  rationale: 该短语表示事件分布在不同地点。“各地”简洁自然，也保留地域广泛分布的含义。
- source_word: λιμοὶ
  choice: 饥荒
  rationale: 该词指严重缺粮所造成的饥荒，而不只是一般性的食物短缺。
- source_word: λοιμοὶ
  choice: 瘟疫
  rationale: λοιμός指流行性疫病或灾疫。“瘟疫”在现代汉语中清楚表达其严重性与群体传播性质。
- source_word: φόβητρα
  choice: 可怕的事
  rationale: 这个罕见的中性复数名词泛指令人恐惧的事物或事件。“可怕的事”不把它限缩为视觉景象或某一类灾难。
- source_word: σημεῖα
  choice: 神迹
  rationale: σημεῖον意为具有指示意义的记号或异乎寻常的征象。此处与“来自天上”和“大”连用，“神迹”能自然表达其非凡、具有征兆意义的性质，但不具体说明其形式。
- source_word: ἀπ’ οὐρανοῦ
  choice: 来自天上
  rationale: οὐρανός既可指天界，也可指可见的天空。“天上”在中文中保留这种空间与神学上的双重可能；脚注说明另一种理解。
- source_word: ἔσονται / ἔσται
  choice: 将有／会有
  rationale: 两个将来时的εἰμί在此引出将要出现的事件。中文采用存在句，并稍作变化以保持自然流畅。
- source_word: τε ... καὶ
  choice: 并列递进的“……；还……”
  rationale: 这些连接词累加列举将发生的事件。中文用逗号、分号和“还”清楚呈现层次，而不机械重复连词。
theological_decisions:
- issue: 末世语境中οὐρανός的含义
  choice: 天上
  alternative: 天空中
  rationale: 原词既可能指天界，也可能指可见天空及其中的天象。“天上”保留可能的神学意涵，同时不排除可见天象；脚注明确提示这一歧义。
- issue: σημεῖα在此处是一般“记号”还是末世性的“征兆／神迹”
  choice: 神迹
  alternative: 大征兆
  rationale: 上下文描述非凡而令人畏惧的末世事件，“神迹”体现σημεῖα作为显著记号的力量；同时不进一步断定这些现象的具体性质。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“将有／会有”保留预告语气；“可怕的事”避免把φόβητρα过度具体化。脚注标记已置于其所说明的“来自天上的大神迹”之后。
