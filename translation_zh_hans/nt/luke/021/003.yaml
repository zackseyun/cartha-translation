  yaml_path: translation/nt/luke/021/003.yaml
  text: And he said[a], “Truly I tell you that this poor widow put in more than all of them.”
translation:
  language: zh_hans
  text: 他说：“我实在告诉你们，这位贫穷的寡妇投进去的，比众人合起来投的都多。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “投进去”也可译作“投下”；原文动词的基本义是“投、扔”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀληθῶς
  choice: 实在
  rationale: 用于引出郑重而有强调力的断言；“实在”既保留耶稣话语的庄重语气，也符合现代中文表达。
- source_word: λέγω ὑμῖν
  choice: 我告诉你们
  rationale: 自然表达直接对听众说话的含义，并保留原文第一人称的权威语气。
- source_word: χήρα
  choice: 寡妇
  rationale: 准确对应丈夫已经去世的妇女，是现代中文的标准用语。
- source_word: πτωχή
  choice: 穷
  rationale: 直接表达贫困；上下文虽显示她极其贫穷，但本节的形容词本身不必扩译为“穷困潦倒”。
- source_word: αὕτη
  choice: 这个
  rationale: 保留指示代词的现场指向作用，表明耶稣所指的是特定的寡妇。
- source_word: πλεῖον
  choice: 更多
  rationale: 保留比较级的数量含义，同时不提前加入下一节关于奉献比例或动机的解释。
- source_word: πάντων
  choice: 比所有人……都
  rationale: 按比较结构理解为与在场其他奉献者整体相比；中文补出共同动作，使比较对象清楚自然。
- source_word: ἔβαλεν
  choice: 投进去
  rationale: 在圣殿奉献的语境中，表示把钱投入奉献箱；比传统的“投了”更清楚地呈现动作方向，又不显得古旧。
theological_decisions:
- issue: 寡妇奉献的比较范围与性质
  choice: “比所有人投的都多”
  alternative: “比任何一个人投的都多”或“比众人所投的更多”
  rationale: πλεῖον πάντων可自然表示她比其他奉献者都投得更多，也可能在形式上让人听出与众人整体的强烈对比。正文保留概括性的“所有人”，不提前用第4节的比例性解释来限定本节。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“我实在告诉你们”保留耶稣郑重宣告的惯用语气；全句避免古旧的“投入库中”等说法，也不增添原文未明说的奉献动机或比例解释。
