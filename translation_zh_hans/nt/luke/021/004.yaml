  naturalness: 原句的“投进供物”搭配不自然；“从自己的富余中拿来奉献”以及“维生所需的一切”符合现代标准汉语，并保留庄重、简明的叙述语体。
  terminology: 保留“富余／匮乏”的对照。“奉献”在此作为对献礼行为的自然汉语表达；脚注保留δῶρα的“礼物”字面义及其圣殿语境。以“维生所需的一切”取代“生活费用”，避免不必要地将βίος限缩为费用项目，也明确不是指她的整个生命。
