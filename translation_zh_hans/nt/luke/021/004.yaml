  text: ⸀πάντες γὰρ οὗτοι ἐκ τοῦ περισσεύοντος αὐτοῖς ἔβαλον εἰς τὰ ⸀δῶρα, αὕτη δὲ ἐκ τοῦ ὑστερήματος αὐτῆς ⸀πάντα τὸν βίον ὃν εἶχεν ἔβαλεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/004.yaml
  text: For all these gave into the gifts out of their abundance, but she, out of her lack, put in all the livelihood she had.
translation:
  language: zh_hans
  text: 因为这些人都是从自己的富余中拿来奉献[a]；但她却从自己的匮乏[b]中，把自己维生所需的一切全都投了进去[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“把钱投进献礼中”。希腊文直译为“礼物”；在这里指圣殿中人们献上的礼物或奉献。
    reason: lexical_alternative
  - marker: b
    text: 或译“贫乏”或“缺乏”。
    reason: lexical_alternative
  - marker: c
    text: 或译“她所有的生计”或“她赖以为生的一切”；这里不是说她把整个生命都献上了。
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες γὰρ οὗτοι
  choice: 因为这些人都是
  rationale: “因为”保留γάρ对上一节的解释关系；“这些人都是”自然表达πάντες与οὗτοι的合意。
- source_word: ἐκ τοῦ περισσεύοντος αὐτοῖς
  choice: 从自己的富余中
  rationale: περισσεύον指超过所需、富余之物；此译与下文“匮乏”形成鲜明对照。
- source_word: ἔβαλον εἰς τὰ δῶρα
  choice: 投进供物
  rationale: ἔβαλον保留把钱投入的具体动作；δῶρα直指献上的礼物，在圣殿语境中用“供物”既简洁又不过度具体化为银库或奉献箱。
- source_word: αὕτη δὲ
  choice: 但她却
  rationale: 以“她”承接上文的寡妇，并用“但……却”清楚表达δέ带出的对比。
- source_word: ἐκ τοῦ ὑστερήματος αὐτῆς
  choice: 从自己的匮乏中
  rationale: ὑστέρημα表示缺少、贫乏；“匮乏”保留与“富余”的词义张力，而不把含义限缩为一种特定贫困状态。
- source_word: πάντα τὸν βίον ὃν εἶχεν
  choice: 自己所有的生活费用全都
  rationale: 此处βίος按金钱奉献的语境指维持生活的物质资源，而非她整个生命；“所有……全都”也传达πάντα的强调意味。
- source_word: ἔβαλεν
  choice: 投了进去
  rationale: 保留投入钱币的动作意象，并与前半句的ἔβαλον形成词语呼应。
theological_decisions:
- issue: 寡妇所献之βίος的含义
  choice: 译为物质层面的“生活费用”
  alternative: “她的一生”或“她全部的生命”
  rationale: 金钱奉献的上下文表明βίος在这里是维持生活的资源。译成“生命”容易引出原文并未明说的献上整个存在之意。
- issue: τὰ δῶρα所指为何
  choice: 译为“供物”
  alternative: “奉献”或“圣殿银库”
  rationale: δῶρα本义为献上的礼物；“供物”适合圣殿语境，同时不额外断定它专指容器、银库或奉献制度。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“富余／匮乏”保留原文的对照，“投进／投了进去”保留实际投入钱币的动作；脚注说明“供物”和“生活费用”的可选译法及语义边界。
