  to: 因为这些人都是从自己的富余中拿来奉献[a]；但她却从自己的匮乏[b]中，把自己维生所需的一切全都投了进去[c]。
  rationale: 修订仅处理汉语搭配和βίος的语义范围：“拿来奉献”自然表达向献礼投入的行为，而不增添“奉献箱／银库”等原文未明说的对象；“维生所需的一切”准确表达她献出全部生活资源。脚注锚点均与相关译词对应。
