base_translation:
  language: en
  yaml_path: translation/nt/luke/021/019.yaml
  text: By your endurance you will gain your lives[a][b].
translation:
  language: zh_hans
  text: 你们要凭着坚忍，赢得自己的生命[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“你们必凭着坚忍赢得自己的生命”，动词为将来陈述式；本译正文依SBLGNT所采用的命令式。
    reason: textual_variant
  - marker: b
    text: “生命”也可译作“灵魂”或“自己”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν
  choice: 凭着
  rationale: 此处ἐν加与格表示方式或凭借；“凭着”在现代汉语中自然地表达坚忍是达到结果的途径。
- source_word: ὑπομονῇ
  choice: 坚忍
  rationale: ὑπομονή指人在患难和逼迫中坚定持守、忍耐到底；“坚忍”比一般的“耐心”更贴合上下文，也简洁庄重。
- source_word: κτήσασθε
  choice: 要……赢得
  rationale: SBLGNT正文为不定过去时中间语态命令式，故在正文中保留命令语气。“赢得”表达κτάομαι取得、获得的基本意义，同时不把经文直接解释成单纯的肉身保命。
- source_word: ψυχὰς
  choice: 生命
  rationale: ψυχή可指生命、自身或灵魂；在受逼迫、可能遭杀害而终必蒙保守的语境中，“生命”较能呈现其整体含义，并避免预先限定为与身体分离的非物质部分。
theological_decisions:
- issue: 末世逼迫语境中ψυχή的含义
  choice: 译作“生命”，保留人在肉身危险与终极得生命之间的张力
  alternative: 译作“灵魂”或“自己”
  rationale: “生命”符合ψυχή在此处的宽广语义，也不把耶稣的应许窄化为今世免死或仅指非物质灵魂。
- issue: κτήσασθε的命令语气与异文中的将来陈述
  choice: 依SBLGNT正文译为命令式“要……赢得”
  alternative: 依异文译为“必……赢得”
  rationale: 原文所给版本的正文是命令式，应优先在正文中体现；抄本异文所呈现的将来式结果含义则在脚注中保留。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“坚忍”突出受逼迫时坚定持守的含义；正文依希腊文命令式直译，同时以脚注保留重要异文和ψυχή的语义幅度。
