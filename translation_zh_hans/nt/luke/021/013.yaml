  text: ⸀ἀποβήσεται ὑμῖν εἰς μαρτύριον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/013.yaml
  text: This will turn out for you as a testimony[a].
translation:
  language: zh_hans
  text: 这事必成为你们的见证[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这事必成为你们作见证的机会。”原文“见证”也可指证言或证据。
    reason: 保留μαρτύριον可指见证、证言或证据的范围，并说明结合上下文的“作见证的机会”译法。
lexical_decisions:
- source_word: ἀποβήσεται
  choice: 终将成为
  rationale: 该词在这里表示事情最终产生的结果，而不只是单纯发生；“终将成为”自然地传达其将来结果。
- source_word: ὑμῖν
  choice: 你们
  rationale: 与“成为……的机会”连用，表达这结果临到门徒并与他们有关；中文无需另加生硬的“对你们来说”。
- source_word: εἰς
  choice: 成为
  rationale: εἰς在此可表示结果或目的；融入“成为……的机会”能以自然中文呈现这一关系。
- source_word: μαρτύριον
  choice: 作见证
  rationale: 该词可指见证、证言或证据。结合门徒被带到君王和官长面前的语境，“作见证”较自然，同时脚注保留把它理解为所形成的见证或证据的可能。
theological_decisions:
- issue: 门徒受逼迫并被带到掌权者面前所产生的结果
  choice: 这些事将成为门徒作见证的机会
  alternative: 这些事本身将成为门徒的见证或证据
  rationale: 上下文最自然地指门徒将在受审时作见证，但希腊文的简洁表达也可能强调事情所形成的见证或证据，因此正文采用语境通顺的表达，并以脚注保留歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“这事”承接前文所说的逼迫、拘捕和受审；“终将”突出预告之事最终产生的结果。
