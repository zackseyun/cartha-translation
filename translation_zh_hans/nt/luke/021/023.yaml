source:
  edition: SBLGNT
  text: ⸀οὐαὶ ταῖς ἐν γαστρὶ ἐχούσαις καὶ ταῖς θηλαζούσαις ἐν ἐκείναις ταῖς ἡμέραις· ἔσται γὰρ ἀνάγκη μεγάλη ἐπὶ τῆς γῆς καὶ ⸀ὀργὴ τῷ λαῷ τούτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/023.yaml
  text: Woe to those who are pregnant and to those who are nursing infants in those days! For there will be great distress upon the land[a], and wrath against this people[b],
translation:
  language: zh_hans
  text: 在那些日子，怀孕的和正在哺乳的妇女有祸了！因为大灾难将临到这地[a]，烈怒也将临到这百姓[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“全地”。希腊词 γῆ 可指某一地区，也可指全地或世界；这里的上下文集中于耶路撒冷和犹太地。
    reason: lexical_alternative
  - marker: b
    text: 或译“烈怒针对这百姓”或“烈怒为这百姓而发”。
    reason: alternative_reading
lexical_decisions:
- source_word: οὐαί
  choice: 有祸了
  rationale: 保留先知性哀叹与审判警告的力度；比单纯的“可怜”更贴近原文。
- source_word: ταῖς ἐν γαστρὶ ἐχούσαις
  choice: 怀孕的
  rationale: 以现代汉语自然、简洁地表达“腹中有孩子的人”，不采用古旧措辞。
- source_word: ταῖς θηλαζούσαις
  choice: 哺乳婴儿的
  rationale: 原动词本身表示哺乳；补出自然隐含的宾语“婴儿”，使汉语意思完整。
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: 在那些日子
  rationale: 贴近希腊文结构，也是现代汉语中自然的时间表达。
- source_word: ἀνάγκη μεγάλη
  choice: 大灾难
  rationale: 在耶路撒冷受围困和毁灭的语境中，该词组指重大的困厄、灾祸，而非抽象的“必要”。
- source_word: ἐπὶ τῆς γῆς
  choice: 临到这地
  rationale: γῆ可指“地、土地”或“全地、世界”；上下文集中于耶路撒冷和犹太地区，因此正文采用局部意义的“这地”，并用“临到”自然表达灾难压在其上的含义。
- source_word: ὀργή
  choice: 烈怒
  rationale: 保留强烈愤怒及审判性的语义，但不在正文中补出原文未明说的施怒者。
- source_word: τῷ λαῷ τούτῳ
  choice: 临到这百姓
  rationale: 与ὀργή连用的与格表示烈怒所针对或波及的对象；“这百姓”保留指示词的力度。
theological_decisions:
- issue: γῆ与“这百姓”的所指及范围
  choice: 正文译作“这地”，主要指当前话语中的犹太地，并让“这百姓”保持原文的直接指称。
  alternative: 译作“全地”或“世界”，理解为普世性的灾难。
  rationale: 紧接的上下文谈到耶路撒冷被军队围困、犹太境内的人逃避以及城中居民的遭遇，局部所指更合语境；脚注保留γῆ的广义可能。
- issue: ὀργή的来源与性质
  choice: 译作“烈怒”，不明说是“上帝的烈怒”。
  alternative: 译作“上帝的烈怒”或解释为“审判”。
  rationale: 语境可以使人理解为神圣审判，但希腊文本身没有明说施怒者；正文不补出主语，以保留原文的神学张力。
- issue: οὐαί的语气
  choice: 译作“有祸了”，兼具哀叹和审判警告。
  alternative: 译作“可悲啊”或“可怜”。
  rationale: 原词在先知性言说中不只是同情，也宣告临近的灾祸；“有祸了”较完整地保留双重意味。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“有祸了”保留经文的先知性语气；“怀孕的和哺乳婴儿的”简明易懂。两处“临到”使后半句在汉语中连贯，并避免把原文未明确说出的施怒者补入正文。
