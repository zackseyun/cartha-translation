  yaml_path: translation/nt/luke/021/038.yaml
  text: And all the people would come early in the morning to him in the temple to hear him[a].
translation:
  language: zh_hans
  text: 众人都清早到圣殿[a]里来听他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“圣殿”指整个圣殿建筑群或院区，并非专指内殿。
    reason: cultural_note
lexical_decisions:
- source_word: πᾶς ὁ λαὸς
  choice: 众人
  rationale: 概括当时前来聚集的民众；“众人”自然保留整体、广泛的语气，又不必理解为毫无例外的每一个人。
- source_word: ὤρθριζεν
  choice: 每天清早都到……来
  rationale: 未完成时在上下文中表示惯常、反复发生的行动；ὀρθρίζω也含清早行动、黎明即来的意味。加入“每天……都”以自然汉语表达这种反复性。
- source_word: πρὸς αὐτόν
  choice: 来见他
  rationale: πρός加宾格表示朝向某人而来；“来见他”在汉语中自然表达民众到耶稣那里聚集，同时不重复姓名。
- source_word: ἐν τῷ ἱερῷ
  choice: 在圣殿里
  rationale: ἱερόν指圣殿整体范围或院宇，而非专指内殿；正文采用通行、易懂的“圣殿”，并以脚注说明范围。
- source_word: ἀκούειν αὐτοῦ
  choice: 要听他讲道
  rationale: 不定式表示目的；属格αὐτοῦ与ἀκούω连用，意为听他说话。“听他讲道”按此教导场景自然传达其意，避免生硬的“听他”。
