translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。以“耶稣”补明希腊文省略的主语，承接上下文并避免中文起句含混；“抬眼观看，看见”保留原文分词与主要动词的动作关系。所有脚注标记均置于相关正文词语之后。
