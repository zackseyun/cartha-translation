  yaml_path: translation/nt/luke/021/001.yaml
  text: Then he looked up and saw rich people putting their gifts into the treasury[a][b].
translation:
  language: zh_hans
  text: 耶稣抬头，看见富人把他们的礼物投进奉献箱[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “礼物”也可译作“奉献物”。
    reason: lexical_alternative
  - marker: b
    text: 译作“奉献箱”的希腊词，既可指圣殿中存放奉献的库房区域，也可指收取奉献的容器。
    reason: cultural_note
lexical_decisions:
- source_word: Ἀναβλέψας
  choice: 抬眼观看
  rationale: 该词在此表示把视线抬起；“抬眼观看”自然、庄重，也与后面的“看见”衔接清楚。
- source_word: δὲ
  choice: 不单独译出
  rationale: δέ在此是轻微的叙事连接词；汉语顺承可由句序自然表达，若硬译作“然后”反而可能使动作先后显得过强。
- source_word: εἶδεν
  choice: 看见
  rationale: 直接表达视觉感知，不增添“留意到”等主观关注意味。
- source_word: τοὺς βάλλοντας
  choice: 把……投进
  rationale: βάλλω本义有“投、放”之意；在投入奉献物的语境中，“投进”既自然，也保留了原词的动作感。
- source_word: εἰς τὸ γαζοφυλάκιον
  choice: 进奉献箱
  rationale: 该词可指圣殿库房区域，也可指收纳奉献的容器；正文采用现代读者容易理解、且符合此处投入动作的“奉献箱”，并以脚注保留词义范围。
- source_word: τὰ δῶρα αὐτῶν
  choice: 他们的礼物
  rationale: δῶρα直译为“礼物”；上下文表明这是献上的财物，但正文保留原词的一般含义，并在脚注注明“供物”这一语境性译法。
- source_word: πλουσίους
  choice: 有钱人
  rationale: 该形容词在此名词化，指富有的人；“有钱人”是普通现代汉语中自然、清楚的表达。
