  text: οὕτως καὶ ὑμεῖς, ὅταν ἴδητε ταῦτα γινόμενα, γινώσκετε ὅτι ἐγγύς ἐστιν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/031.yaml
  text: So also you[a], when you see these things happening[b], know that the kingdom of God is near.
translation:
  language: zh_hans
  text: 同样，你们看见这些事发生时，就要知道，神的国近了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “神的国”也可译作“神的统治”。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: 同样，你们
  rationale: 承接前文无花果树的比喻，并把其中的判断原则应用到门徒身上；“同样”自然保留推论和类比关系，明说“你们”也对应原文显式代词的强调。
- source_word: ὅταν ἴδητε
  choice: 看见……时
  rationale: ὅταν加不定过去时虚拟语气表示将来条件；“……时”在现代汉语中自然表达预期发生的情形，又不增添反复发生之意。
- source_word: ταῦτα γινόμενα
  choice: 这些事发生
  rationale: γινόμενα在此指前述事件正在出现或发生；“这些事发生”清楚保留指向前文各项征兆的指示语。
- source_word: γινώσκετε
  choice: 就要知道
  rationale: 原文为现在时命令语气，要求门徒根据所见明白其意义；“就要知道”既表达命令，也符合汉语条件句的自然衔接。
- source_word: ἐγγύς ἐστιν
  choice: 近了
  rationale: 原文表达临近或在近处，没有明确限定为空间还是时间意义；“近了”简洁自然，并保留这种开放性。
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: 神的国
  rationale: 这是现代中文圣经语境中自然且熟悉的表达，同时可涵盖神的国度及神掌权的含义，不把原文缩窄为单一解释。
theological_decisions:
- issue: 末世语境中“神的国”的含义
  choice: 保留“神的国”，不作解释性扩写。
  alternative: 神的统治近了；神君王般的统治即将完全显明。
  rationale: 本节把神国的临近与前述事件相连，却没有明确说明这里主要指神国的显现、成全还是伸冤；保留经文惯用语可避免预先裁定末世论争议。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“同样”承接上文比喻，“看见这些事发生时”语序自然；“神的国近了”保留圣经术语及原文在时间、临近程度和神国含义上的张力。
