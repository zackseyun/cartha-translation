  text: 耶稣又给他们讲了一个比喻：“你们看无花果树和所有的树。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: 又
  rationale: 承接前文并推进叙述；现代汉语用“又”自然地表达耶稣接着说话，不额外强化严格的时间先后。
- source_word: εἶπεν παραβολὴν αὐτοῖς
  choice: 给他们讲了一个比喻
  rationale: 汉语通常说“讲比喻”，比直译为“说一个比喻”自然；“给他们”保留间接宾语 αὐτοῖς。
- source_word: Ἴδετε
  choice: 你们看
  rationale: 准确表达复数命令式所要求的定向注意，简洁自然，也与下文观察树木的语境相符。
- source_word: τὴν συκῆν
  choice: 无花果树
  rationale: 指无花果的树，而非仅指果实；这是现代汉语中明确、通行的对应表达。
- source_word: πάντα τὰ δένδρα
  choice: 所有的树
  rationale: 直接保留 πάντα 的整体范围，不擅自加入原文没有明说的“其他”。
