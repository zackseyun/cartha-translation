  text: ὁ δὲ εἶπεν· Βλέπετε μὴ πλανηθῆτε· πολλοὶ γὰρ ἐλεύσονται ἐπὶ τῷ ὀνόματί μου ⸀λέγοντες· Ἐγώ εἰμι καί· Ὁ καιρὸς ἤγγικεν· ⸀μὴ πορευθῆτε ὀπίσω αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/008.yaml
  text: And he said[a], “See that you are not led astray. For many will come in my name, saying, ‘I am he,’ and, ‘The time has drawn near.’ Do not go after them.”
translation:
  language: zh_hans
  text: 耶稣说：“你们要当心，不要被迷惑；因为将有许多人奉我的名而来，说：‘我就是[a]’，又说：‘时候近了。’你们不要跟从他们。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我是那一位”；也可能指假冒者自称为众人所期待的那一位，或自称为弥赛亚。
    reason: 说明Ἐγώ εἰμι省略补语所产生的歧义，避免正文过度限定。
lexical_decisions:
- source_word: Βλέπετε μὴ πλανηθῆτε
  choice: 你们要当心，不要被迷惑
  rationale: Βλέπετε在此发出警戒，后接μή和虚拟式，表示须防范的事。“要当心”自然表达警醒语气；“被迷惑”保留πλανηθῆτε的被动意义。
- source_word: ἐλεύσονται ἐπὶ τῷ ὀνόματί μου
  choice: 将有许多人冒我的名而来
  rationale: ἐπὶ τῷ ὀνόματί μου表示借用耶稣的名义、以其身份或权柄自居。汉语“冒我的名”清楚传达这里的虚假宣称，也符合警告假冒者的语境。
- source_word: Ἐγώ εἰμι
  choice: 我就是
  rationale: 原文没有明说补语。“我就是”在现代汉语中保留悬而未明的自我认定，既可理解为“我就是那一位”，又不擅自补入“基督”。
- source_word: Ὁ καιρὸς ἤγγικεν
  choice: 时候近了
  rationale: καιρός指具有决定意义或所定的时机；ἤγγικεν为完成时，带有当前已经临近的意味。“时候近了”简洁自然，并保留原句的末世紧迫感。
- source_word: μὴ πορευθῆτε ὀπίσω αὐτῶν
  choice: 你们不要跟从他们
  rationale: 该表达既有走在某人后面的方向意象，也指成为其追随者。“跟从”在此准确表达不要随从这些迷惑人的人。
theological_decisions:
- issue: Ἐγώ εἰμι在假冒者语境中的含义
  choice: 我就是
  alternative: 我是那一位；我是基督
  rationale: 希腊文只写“我，是”，其补语由语境暗示。正文不明说“基督”，以免加入原文没有明示的称号；脚注说明这很可能是假冒者自称为众人所期待的那一位，也可能特指弥赛亚，从而保留语义和神学张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“耶稣说”明示希腊文代词ὁ所指，避免汉语单节引用中“他说”指代不清；“冒我的名”较直译“奉我的名”更明确显示此处为虚假借名。脚注标记[a]已置于相关短语之后。
