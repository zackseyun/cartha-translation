  text: Therefore[a], settle it in your hearts not to prepare beforehand to defend yourselves[b],
translation:
  language: zh_hans
  text: 所以，你们要立定心意[a]，不要预先思量怎样为自己申辩[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“要在你们心里定意”或“要把这事放在你们心里”。
