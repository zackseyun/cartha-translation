    reason: lexical_alternative
lexical_decisions:
- source_word: θέτε
  choice: 立定
  rationale: 该词是不定过去时主动命令式，与“在你们心里”构成习语，表示在内心确定、下定决心；“立定心意”既自然又保留命令语气。
- source_word: οὖν
  choice: 所以
  rationale: 表示从上文得出的推论；“所以”清楚连接上下文，也符合现代汉语表达。
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: 你们要立定心意
  rationale: 希腊文直译为“放在你们心里”，指内在的决意。汉语用“立定心意”自然传达这一习语，并保留对众门徒的复数称呼“你们”。
- source_word: μὴ
  choice: 不要
  rationale: 否定受命令式支配的不定式内容；汉语以“不要”自然表达禁止预先筹划。
- source_word: προμελετᾶν
  choice: 预先琢磨
  rationale: 该动词可指事前思量或演练。“预先琢磨”保留事先盘算如何陈述的含义，又不把词义限制为正式排练。
- source_word: ἀπολογηθῆναι
  choice: 怎样为自己申辩
  rationale: 该动词常用于法律或正式场合中的答辩、自辩；“为自己申辩”保留其辩护性质和中间语态所体现的自身关联。
