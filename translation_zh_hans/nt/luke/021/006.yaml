  text: Ταῦτα ἃ θεωρεῖτε, ἐλεύσονται ἡμέραι ἐν αἷς οὐκ ἀφεθήσεται λίθος ἐπὶ ⸀λίθῳ ὃς οὐ καταλυθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/006.yaml
  text: As for these things that you are looking at[b][a], days will come in which not one stone will be left upon another that will not be torn down.
translation:
  language: zh_hans
  text: 至于你们所观看的这一切[a]，日子将到，在那些日子里，没有一块石头会留在另一块石头上而不被拆毁[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “所观看的”也可译作“所看见的”。原文动词既可泛指看见，也可强调观看、察看。
    reason: lexical_alternative
  - marker: b
    text: 直译为“不会有石头留在石头上而不被拆毁”，是表达彻底毁坏的说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα ἃ θεωρεῖτε
  choice: 至于你们所观看的这一切
  rationale: Ταῦτα 前置，具有话题和强调作用；θεωρεῖτε 是现在时，可指观看、察看。“所观看的”保留持续注视的意味，同时保持庄重自然。
- source_word: ἐλεύσονται ἡμέραι
  choice: 日子将到
  rationale: 按希腊语常见的未来表达直译，指某些将要来临的日子，不擅自补入特定末世框架。
- source_word: ἐν αἷς
  choice: 那时
  rationale: 关系短语在此具有时间意义；译作“那时”比“在那些日子里”更符合现代汉语，同时不改变语义。
- source_word: οὐκ ἀφεθήσεται
  choice: 没有……会留在
  rationale: ἀφίημι 的将来时被动式在拆毁语境中意为“被留下、存留”；“会留在”清楚表达建筑石块不再保持原位。
- source_word: λίθος ἐπὶ λίθῳ
  choice: 一块石头……在另一块石头上
  rationale: 保留“石头在石头上”的具体建筑意象；配合否定结构，表达彻底拆毁。
- source_word: ὃς οὐ καταλυθήσεται
  choice: 而不被拆毁
  rationale: καταλύω 在建筑语境中指拆除、毁坏；关系从句强化没有任何石头例外，采用“而不……”保留希腊语的否定结构与修饰关系。
theological_decisions:
- issue: 耶稣对所见建筑之预言的范围和力度
  choice: 译为对可见建筑将被彻底拆毁的具体预言，不附加特定末世论解释。
  alternative: 将其主要解释为象征性审判，或把它明确纳入某一后世神学体系。
  rationale: 希腊文直接描述眼前之物被逐石拆毁。译文应保留这一具体力度，但不加入本节未明说的时间认定或教义框架。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“至于”体现前置宾语的话题作用；“日子将到，那时”兼顾原文结构与汉语流畅度。脚注标记均置于正文相关词句之后。
