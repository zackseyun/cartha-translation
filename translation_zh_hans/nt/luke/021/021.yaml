  rationale: 修改“犹太”为“犹太地”，使地名含义明确；以“逃往山里”自然表达逃往群山的方向；并精确化脚注对希腊文阴性代词及其可能所指的说明。其余措辞保留原稿的平行命令结构和不强行明确代词所指的处理。
