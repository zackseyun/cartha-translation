  text: τότε οἱ ἐν τῇ Ἰουδαίᾳ φευγέτωσαν εἰς τὰ ὄρη, καὶ οἱ ἐν μέσῳ αὐτῆς ἐκχωρείτωσαν, καὶ οἱ ἐν ταῖς χώραις μὴ εἰσερχέσθωσαν εἰς αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/021.yaml
  text: Then let those in Judea flee to the mountains[a], and let those in the midst of her depart, and let those in the countryside not enter into her.
translation:
  language: zh_hans
  text: 那时，在犹太地的人要逃往山里；在其中的人要离开[a]；在乡间的人不要进去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文中与“其中”和“进去”相对应的位置都用阴性代词。按上文和本节情境，所指很可能是耶路撒冷；但从语法形式看，也可与前面的“犹太地”呼应。
    reason: 说明未在正文中明说的代词所指，并保留原文在语法形式上的可能歧义。
lexical_decisions:
- source_word: τότε
  choice: 那时
  rationale: 承接上一节所说的征兆，简洁自然地标明随后的行动时机。
- source_word: οἱ ἐν τῇ Ἰουδαίᾳ
  choice: 在犹太的人
  rationale: 准确表达位于犹太地区的人，不把范围缩小为某一座城。
- source_word: φευγέτωσαν εἰς τὰ ὄρη
  choice: 要逃到山上
  rationale: 第三人称命令式表达紧迫命令；“要逃”在现代汉语中比直译为“让……逃”更自然。“山上”概括复数的山区目的地。
- source_word: οἱ ἐν μέσῳ αὐτῆς
  choice: 在其中的人
  rationale: 保留代词回指，不在正文中直接补出“耶路撒冷”或“犹太”；“其中”自然表达ἐν μέσῳ的内部位置。
- source_word: ἐκχωρείτωσαν
  choice: 要离开
  rationale: 表达从所在之处撤离的命令，现代、清楚，并不额外指定撤离方向。
- source_word: οἱ ἐν ταῖς χώραις
  choice: 在乡下的人
  rationale: χῶραι在此指城外或乡间地区；“乡下”是普通读者容易理解的现代说法。
- source_word: μὴ εἰσερχέσθωσαν εἰς αὐτήν
  choice: 不要进去
  rationale: 准确保留否定命令和代词回指；汉语省略宾语代词更自然，也避免武断补明所指。
theological_decisions:
- issue: αὐτῆς与αὐτήν所指为何
  choice: 正文译作“其中”和“进去”，保留回指；脚注说明按上下文很可能指耶路撒冷。
  alternative: 在正文中明确译作“城里”和“进城”，或理解为指犹太地区。
  rationale: 上一节直接提到耶路撒冷，撤离城内且乡下人不要进城也最符合语境；但本节没有再次写出城市名称，而代词在语法形式上也可与“犹太”呼应。译文不应无声消除这种形式上的张力。
translation_notes:
  register: 采用现代、庄重而易懂的命令语气；以三个平行分句呈现原文结构，用分号突出紧迫而连续的指示。
