  text: ὡς παγίς· ⸂ἐπεισελεύσεται γὰρ⸃ ἐπὶ πάντας τοὺς καθημένους ἐπὶ πρόσωπον πάσης τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/035.yaml
  text: like a trap[c][b][a]. For it will come upon all those dwelling on the face of the whole earth.
translation:
  language: zh_hans
  text: 像陷阱一样[a]。因为那日子必临到住在全地上的所有人[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“像网罗一样。”
    reason: lexical_alternative
  - marker: b
    text: “住在……上的人”直译为“坐在……上的人”；这里是指居住或生活在地上的人。
    reason: lexical_alternative
  - marker: c
    text: “全地”也可理解为“全境”；但本句的表达较支持“整个大地”的广泛范围。
    reason: alternative_reading
lexical_decisions:
- source_word: ὡς παγίς
  choice: 像陷阱一样
  rationale: παγίς可指捕捉人的陷阱或网罗。“陷阱”是现代汉语中清楚自然的表达，也保留了突然而难以逃脱的意象；ὡς直译为“像……一样”。
- source_word: ἐπεισελεύσεται
  choice: 必临到
  rationale: 该动词表示来到某人身上、临到或袭来。“必临到”既传达将来时，也符合警告语境；根据上文补出隐含主语“那日子”。
- source_word: γὰρ
  choice: 因为
  rationale: γάρ说明前述警告的理由，“因为”在现代汉语中自然地保留这一因果衔接。
- source_word: ἐπὶ πάντας
  choice: 临到……所有……的人
  rationale: ἐπί与宾格在这里表示临及某些人；汉语将“所有”置于关系短语之前，更自然清楚。
- source_word: τοὺς καθημένους
  choice: 居住的人
  rationale: κάθημαι字面可指“坐着”，但在此地理性表达中是居住、定居之意。“居住的人”传达习语含义，又不过度释义。
- source_word: ἐπὶ πρόσωπον
  choice: 在……之上
  rationale: 该受闪语影响的表达字面为“在……表面”，实际指位于地上。“在全地之上”保留其空间意象，同时比“在全地的脸面上”自然。
- source_word: πάσης τῆς γῆς
  choice: 全地
  rationale: γῆ可指“地、土地”或“地球、世界”。在“所有居住的人”这一广泛范围中，“全地”自然保留普世范围，也维持原词一定的语义张力。
theological_decisions:
- issue: 末世警告中γῆ所指的范围
  choice: 全地
  alternative: 全境／整个地方
  rationale: γῆ本可指某一片土地，也可指整个大地；这里与“所有居住的人”连用，较支持普遍范围。“全地”既传达这一广度，又不像“全球”那样加入现代地理措辞。
- issue: ἐπεισελεύσεται的隐含主语
  choice: 补出“那日子”
  alternative: 仅译作“它必临到”
  rationale: 希腊文主语由上一节的“那日子”承接。汉语补出“那日子”可避免代词指向含混，并未改变原文所指。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“陷阱”比传统的“网罗”更直接，后者列入脚注；“全地之上所有居住的人”保留原文庄严的空间表达，同时避免生硬照译“地的脸面”。
