base_translation:
  language: en
  yaml_path: translation/nt/luke/021/033.yaml
  text: Heaven and earth will pass away[a], but my words will certainly not pass away.
translation:
  language: zh_hans
  text: 天地要过去，但我的话绝不会过去。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我的话永远不会过去。”希腊文使用了强调否定的表达（οὐ μή）。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ οὐρανὸς καὶ ἡ γῆ
  choice: 天和地
  rationale: 这是表示整个受造世界的固定配对；译为“天和地”既符合现代汉语圣经语域，也保留原文的宇宙性范围。
- source_word: παρελεύσονται
  choice: 都要过去／不会过去
  rationale: παρέρχομαι在此指消逝、终止。前后重复译作“过去”，保留原文同一动词所形成的鲜明对照；首句加入“都”使复合主语下的汉语表达自然，但不改变范围。
- source_word: δὲ
  choice: 但
  rationale: δέ在这里表达受造天地的短暂与耶稣话语的恒久之间的转折。
- source_word: οἱ λόγοι μου
  choice: 我的话
  rationale: λόγοι指耶稣所说的话语；“我的话”直接、庄重，也符合现代汉语习惯。
- source_word: οὐ μὴ
  choice: 绝不会
  rationale: οὐ μή与将来时动词构成强烈否定；“绝不会”自然地传达其强调力度，而不是弱化为普通的“不”。
theological_decisions:
- issue: 耶稣话语永不消逝这一宣告的强调程度
  choice: 以“绝不会过去”保留οὐ μή的强烈否定
  alternative: “永远不会过去”
  rationale: 原文不只是一般否定，而是强调其绝无可能发生。“绝不会”准确表达这一力度，同时不额外解释耶稣话语如何存留。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准普通话。保留“过去”的前后重复，以再现原文修辞平行；脚注标记置于相关句末。
