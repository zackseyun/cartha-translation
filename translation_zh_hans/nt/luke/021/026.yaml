  text: ἀποψυχόντων ἀνθρώπων ἀπὸ φόβου καὶ προσδοκίας τῶν ἐπερχομένων τῇ οἰκουμένῃ, αἱ γὰρ δυνάμεις τῶν οὐρανῶν σαλευθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/026.yaml
  text: with people fainting from fear and expectation of the things coming upon the inhabited world[b][a], for the powers of the heavens will be shaken.
translation:
  language: zh_hans
  text: 人们因恐惧和对那些将要临到世上[a]之事的预期而昏厥；因为诸天的力量[b]都要震动。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“世界”或“大地”；希腊文直译为“有人居住的世界”。
    reason: lexical_alternative
  - marker: b
    text: 或译“天上的众势力”或“天上的权能”。这个短语可广指宇宙或属天的力量。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποψυχόντων
  choice: 吓得昏厥
  rationale: 该现在分词描写人因恐惧而失去气力、近乎昏倒；“吓得昏厥”兼顾身体反应与心理冲击，也避免采用仅指死亡的表达。
- source_word: ἀνθρώπων
  choice: 人们
  rationale: 此处泛指人类，并非专指男性；“人们”符合现代汉语的自然表达。
- source_word: ἀπὸ φόβου
  choice: 因惧怕
  rationale: ἀπό加属格在此表示原因；“因惧怕”简洁保留其因果关系。
- source_word: προσδοκίας
  choice: 预料
  rationale: 该词表示期待、等候或预期；上下文本身显明这种预期令人恐惧，因此正文不另加“凶险”“不祥”等原文未明说的限定。
- source_word: τῶν ἐπερχομένων
  choice: 那些将要临到……的事
  rationale: 保留中性复数分词所指的多项将临事件，并以现代汉语清楚表达其迫近性。
- source_word: τῇ οἰκουμένῃ
  choice: 世上
  rationale: οἰκουμένη指有人居住的世界或人类社会所在的世界；“世上”在正文中自然简明，脚注说明其较直译的含义。
- source_word: αἱ δυνάμεις τῶν οὐρανῶν
  choice: 诸天的力量
  rationale: 贴近希腊文复数结构，并保留它可广指宇宙、天体或属天势力的含混性，不擅自限定为某一类对象。
- source_word: σαλευθήσονται
  choice: 都要震动
  rationale: 保留将来被动式所描绘的摇撼与宇宙动荡意象；汉语中用“要震动”表达未来性，用“都”自然承接复数主语。
theological_decisions:
- issue: 启示性语境中“诸天的力量”的所指
  choice: 保留“诸天的力量”这一宽泛的宇宙性表达
  alternative: 明确译作“天体”或“天使等属天势力”
  rationale: 原短语可能使人联想到宇宙秩序、天上发光体或属天势力。译文不将其缩窄为单一解释，以保存原文的神学张力和启示文学意象。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“吓得昏厥”使因果关系自然清楚；“诸天的力量”略带经文体色彩，用以保留原文启示文学的广阔意象及其有意的含混性。
