  text: ὁ δὲ στυγνάσας ἐπὶ τῷ λόγῳ ἀπῆλθεν λυπούμενος, ἦν γὰρ ἔχων κτήματα πολλά.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/022.yaml
  text: But he[a], becoming gloomy at the word, went away grieving[c][b], for he had many possessions.
translation:
  language: zh_hans
  text: 他听了这话，脸色就沉了下来[a]，忧伤地离去了[b]，因为他有许多财产[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “脸色就沉了下来”也可译作“神情变得阴沉”或“神情沮丧”；希腊文含有神色明显转为阴沉的意味。
    reason: lexical_alternative
  - marker: b
    text: “忧伤地离去了”也可译作“带着忧愁走了”；原文现在时分词表明他离去时仍处于忧伤之中。
    reason: lexical_alternative
  - marker: c
    text: “财产”也可译作“所拥有的财物”或“许多 possessions（所有物）”。
    reason: lexical_alternative
lexical_decisions:
- source_word: στυγνάσας
  choice: 顿时神色黯然
  rationale: 该不定过去时分词描写因所听之话而出现的明显阴沉反应；“神色黯然”兼顾可见的表情变化和内在低落，“顿时”自然体现事件性的转变。
- source_word: ἐπὶ τῷ λόγῳ
  choice: 因这话
  rationale: 介词短语在此表示反应的原因或触发点；“因这话”简洁自然，并保留 λόγος 的单数表达。
- source_word: ἀπῆλθεν
  choice: 离去了
  rationale: 准确表达人物从现场离开，符合现代汉语叙事语体。
- source_word: λυπούμενος
  choice: 忧伤地
  rationale: 现在时分词描写他离去时持续处于忧伤之中；状语形式自然地把这一持续情绪与“离去”相连。
- source_word: κτήματα πολλά
  choice: 许多产业
  rationale: κτήματα 指所拥有的财产或产业；“许多产业”既对应 πολλά，也比笼统的“东西”更准确。
- source_word: ἦν γὰρ ἔχων
  choice: 因为他有
  rationale: 这一迂回结构表达持续拥有的状态；现代汉语自然压缩为“他有”。
theological_decisions:
- issue: 这人面对耶稣要求时的情绪性质
  choice: 保留其外在神色转暗与持续忧伤，不附加道德评判
  alternative: 译为“恼怒”“不满”或仅译作“失望”
  rationale: 原文明确描写阴沉的神色和忧伤，却没有明说愤怒、反叛或悔改；译文应保留这种叙事和神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“顿时神色黯然”保留原文可见的表情变化；“忧伤地离去了”避免过度解释其动机；句末“因为”自然承接原文 γάρ 所给出的原因。
