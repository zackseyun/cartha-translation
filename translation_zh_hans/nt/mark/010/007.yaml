  text: ἕνεκεν τούτου καταλείψει ἄνθρωπος τὸν πατέρα αὐτοῦ καὶ τὴν μητέρα ⸂καὶ προσκολληθήσεται πρὸς τὴν γυναῖκα αὐτοῦ⸃,
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/007.yaml
  text: For this reason a man will leave his father and mother and be joined to his wife,[a]
translation:
  language: zh_hans
  text: “因此，男人要离开自己的父亲和母亲，与妻子结合。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“紧紧依附妻子。”希腊语动词可强调亲密而牢固的依附。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕνεκεν τούτου
  choice: 因此
  rationale: 自然、简洁地表达该短语引出缘由或结论的作用，符合现代汉语经文语体。
- source_word: καταλείψει
  choice: 要离开
  rationale: 未来时在引文中表达婚姻所带来的典型行动；“要离开”既准确又自然，不加入“抛弃”等过强含义。
- source_word: ἄνθρωπος
  choice: 人
  rationale: ἄνθρωπος本可泛指人，但此处由“妻子”明确所指为男性；汉语“人”与后文搭配即可保留这一语境限定，无须额外添加“男人”。
- source_word: τὸν πατέρα αὐτοῦ καὶ τὴν μητέρα
  choice: 父亲和母亲
  rationale: 按现代汉语习惯省略重复的“他的”；人物关系和所属关系在上下文中清楚。
- source_word: προσκολληθήσεται
  choice: 结合
  rationale: 该动词表示紧密依附、联结；“结合”在婚姻语境中自然庄重，并保留关系联结的含义。
- source_word: πρὸς τὴν γυναῖκα αὐτοῦ
  choice: 与妻子
  rationale: γυνή在婚姻语境中明确指“妻子”；介词短语依汉语搭配译为“与妻子”。
theological_decisions:
- issue: 婚姻引文中的性别指向
  choice: 人……妻子
  alternative: 男人……妻子；一个人……配偶
  rationale: 原文ἄνθρωπος虽可泛指人，后接“他的妻子”则明确描写男性一方。译作“人……妻子”不将婚配双方中性化，也符合中文引文的自然表达。
- issue: προσκολληθήσεται的关系含义
  choice: 与妻子结合
  alternative: 依附妻子；与妻子联合；紧紧依恋妻子
  rationale: “结合”保留婚姻中的紧密联结，同时不把动词的情感、法律或神秘层面作单一化解释；脚注补出“紧紧依附”的词义侧重。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“因此”承接上文；“要离开……与……结合”保持引文的简洁和平行感。脚注标记已在正文中出现。
