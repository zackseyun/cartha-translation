  text: οἱ δὲ εἶπαν αὐτῷ· Δὸς ἡμῖν ἵνα εἷς ⸂σου ἐκ δεξιῶν⸃ καὶ εἷς ἐξ ⸀ἀριστερῶν καθίσωμεν ἐν τῇ δόξῃ σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/037.yaml
  text: They said to him, “Grant to us that one of us may sit at your right and one at your left in your glory.”
translation:
  language: zh_hans
  text: 他们对他说：“请准许我们中一个坐在你右边，另一个坐在你左边，在你的荣耀里。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δὸς ἡμῖν ἵνα
  choice: 求你准许我们
  rationale: 这里并非字面意义上的“给”，而是请求耶稣准许他们获得所求的位置；“求你准许”自然表达了祈使语气和请求含义。
- source_word: ἐκ δεξιῶν / ἐξ ἀριστερῶν
  choice: 坐在你右边 / 坐在你左边
  rationale: 按当时席位和权位语境译为“右边、左边”，既自然，也保留原文对称结构。
- source_word: ἐν τῇ δόξῃ σου
  choice: 在你的荣耀里
  rationale: 保留δόξα的核心神学用语“荣耀”，不把它具体化为“国度”或“得荣之时”，从而保留原文可能兼具状态与场景的张力。
theological_decisions:
- issue: “在你的荣耀里”所指为何
  choice: 保留“在你的荣耀里”
  alternative: 在你得荣耀的时候／在你的荣耀国度里
  rationale: 原文没有明说是时间、状态还是国度；直译式表达可保留其开放性，避免加入原文未明说的末世论解释。
- issue: 门徒所求席位的含义
  choice: 仅译“右边、左边”
  alternative: 最高位／尊位
  rationale: 这些位置暗示尊荣和权柄，但原文以空间意象表达；不在正文中将其解释性改写为职位或等级。
translation_notes:
  register: 采用现代、庄重且口语可懂的表达。“一个……一个……”准确体现εἷς…καὶ εἷς的对称结构；“我们”与后面的两个位置自然表明二人各坐一边，无需增添“我们中”。
