  text: καὶ ἐὰν ⸂αὐτὴ ἀπολύσασα τὸν ἄνδρα αὐτῆς γαμήσῃ ἄλλον⸃ μοιχᾶται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/012.yaml
  text: and if she divorces her husband and marries another man[a], she commits adultery.
translation:
  language: zh_hans
  text: 她若与丈夫离婚[a]，再嫁给另一个男人，也犯奸淫。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文较直译为“遣走她的丈夫”；在这里的婚姻语境中，指“与丈夫离婚”。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: 也
  rationale: 承接第11节与之平行的情形；现代汉语用“也”比句首“并且”更自然，并保留两者的对应关系。
- source_word: ἐὰν
  choice: 如果
  rationale: 自然表达条件关系，不把条件句强化为普遍时间句“每当”。
- source_word: αὐτὴ
  choice: 她
  rationale: 保留原文明确的阴性主语及其与前节男性主语的对照；汉语无需另加“她自己”来表达轻微强调。
- source_word: ἀπολύσασα
  choice: 离开
  rationale: 原词基本义涉及放走、遣离；在婚姻语境中指解除婚姻关系。此处女方为施事，译作“离开自己的丈夫”较自然，同时用脚注说明也可按语境译作“与丈夫离婚”，避免把特定法律程序直接读入原文。
- source_word: τὸν ἄνδρα αὐτῆς
  choice: 自己的丈夫
  rationale: ἀνήρ在婚姻语境中是“丈夫”；“自己的”清楚表达属格关系。
- source_word: γαμήσῃ ἄλλον
  choice: 另嫁别人
  rationale: ἄλλον为阳性单数，指另一名男子；“另嫁别人”是自然汉语，并保留再婚对象为另一男子的含义。
- source_word: μοιχᾶται
  choice: 犯奸淫
  rationale: 直接表达持续时态形式在格言性陈述中的行为意义；“犯奸淫”庄重、清楚，也与传统圣经语域相通。
theological_decisions:
- issue: 是否保留本节性别明确的表述
  choice: 用“她……自己的丈夫……另嫁别人”保留女性主语和男性婚配对象
  alternative: 泛化为“人若离婚后再婚”
  rationale: 原文明确使用阴性主语，并与前节男性离妻的情形形成刻意平行；不应把性别差异中性化。
- issue: 如何处理ἀπολύω在女方为施事时的含义
  choice: 正文译“离开自己的丈夫”，脚注说明婚姻语境中也可译“与丈夫离婚”
  alternative: 直接译“与丈夫离婚”或字面译“遣走丈夫”
  rationale: “遣走丈夫”在现代汉语中生硬且可能误导；“离开”较贴近此语境下女方结束婚姻关系的表达，而脚注保留其离婚义，使原词措辞与语境含义都可见。
- issue: μοιχᾶται的伦理判断力度
  choice: 译作“犯奸淫”
  alternative: 译作“成为淫妇”或弱化为“是不忠”
  rationale: 原文直接判定该行为为通奸；译文既不弱化，也不额外转为对人格身份的定性。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“另嫁别人”自然表达女性再婚，并与上文形成平行；“犯奸淫”保留经文的严肃伦理语气。正文脚注标记[a]与脚注完全对应。
