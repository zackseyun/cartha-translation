  text: ὅτι Ἰδοὺ ἀναβαίνομεν εἰς Ἱεροσόλυμα, καὶ ὁ υἱὸς τοῦ ἀνθρώπου παραδοθήσεται τοῖς ἀρχιερεῦσιν καὶ ⸀τοῖς γραμματεῦσιν, καὶ κατακρινοῦσιν αὐτὸν θανάτῳ καὶ παραδώσουσιν αὐτὸν τοῖς ἔθνεσιν
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/033.yaml
  text: that[a], ‘Look, we are going up to Jerusalem, and the Son of Man will be handed over to the chief priests and the scribes[b], and they will condemn him to death and hand him over to the Gentiles.’
translation:
  language: zh_hans
  text: 说：“看，我们正往耶路撒冷上去；人子将被交给[a]祭司长和文士，他们要定他死罪，再把他交给外邦人[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “交给”也可译作“移交给”；本节两处都使用同一个希腊语动词。
    reason: lexical_alternative
  - marker: b
    text: “外邦人”也可译作“列国的人”；这里指非犹太人。
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: 说
  rationale: 本词承接上一节，引出耶稣所说的具体内容。汉语用“说”自然衔接直接引语，不赋予因果含义。
- source_word: Ἰδοὺ
  choice: 看
  rationale: 保留提示听者注意的强调作用，同时采用自然的现代汉语。
- source_word: ἀναβαίνομεν
  choice: 我们正上……去
  rationale: 既表达正在前往的动态，也保留前往地势较高的耶路撒冷时“上去”的惯用说法。
- source_word: εἰς Ἱεροσόλυμα
  choice: 耶路撒冷去
  rationale: 按目的地用法译出，符合现代汉语表达。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人子
  rationale: 保留这一称谓的字面形式、经文互涉和基督论含义，不作解释性改写。
- source_word: παραδοθήσεται
  choice: 将被交给
  rationale: 表达被置于他人权力之下，且不把意义过早限定为“被出卖”。
- source_word: τοῖς ἀρχιερεῦσιν
  choice: 祭司长
  rationale: 指居领导地位的祭司群体；这是准确且通行的现代汉语称呼。
- source_word: τοῖς γραμματεῦσιν
  choice: 经学家
  rationale: 指研习、解释并教授律法的专业人士；较“文士”更易为现代普通读者理解，又避免扩写为完整解释。
- source_word: κατακρινοῦσιν αὐτὸν θανάτῳ
  choice: 他们要定他死罪
  rationale: 自然表达正式作出致死判决的司法含义。
- source_word: παραδώσουσιν αὐτὸν
  choice: 又把他交给
  rationale: 与前一个同源动词统一译为“交给”，保留连续移交的叙事链条。
- source_word: τοῖς ἔθνεσιν
  choice: 外族人
  rationale: 在受难叙事中指犹太群体之外、掌握政权的人；“外族人”保留群体区分，同时比音译或传统术语更直观。
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου 的译法
  choice: 人子
  alternative: 那位属人的／人之子
  rationale: “人子”是忠于原文且为汉语读者熟悉的称谓，保留其与《但以理书》的关联及其神学张力，不将其扁平化为一般的人类称谓。
- issue: τοῖς ἔθνεσιν 的指称
  choice: 外族人
  alternative: 列国的人／非犹太人
  rationale: 上下文描写耶稣从犹太宗教领袖手中被移交给外族掌权者。“外族人”保留历史上的群体区别，却不额外引入更广泛的神学判断。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。用“经学家”取代现代读者可能不易理解的“文士”；用分号清楚呈现宗教领袖定罪、随后移交外族人的两阶段过程。
