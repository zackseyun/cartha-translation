review_pass:
  verdict: revise
  source_fidelity: 译文整体准确呈现了耶稣预告中的行动次序，并保留了“人子”及两次 παραδίδωμι（交给）的重复。可是“外族人”通常偏指族属上的外国人，未能如“外邦人”一样准确表达本处犹太人与非犹太人之间的历史语境和 τοῖς ἔθνεσιν 的常规新约用法。
  naturalness: “我们正上耶路撒冷去”虽可理解，但“我们正往耶路撒冷上去”在现代标准汉语中更顺畅。以“文士”译 γραμματεῖς 是简洁、通行且较直接的对应；可在注释或译本词汇表中说明其职能，避免将该词直接扩展为泛指的“经学家”。
  terminology: “人子”“祭司长”“文士”“外邦人”构成汉语圣经语境中稳定且准确的术语组合。“外邦人”不带贬义，指本段历史情境中的非犹太人／非犹太权力者；不宜以含义较宽或重心不同的“外族人”替代。
  issues:
  - severity: medium
    issue: “外族人”对 τοῖς ἔθνεσιν 的对应不够准确。
    rationale: 本处在受难叙事中指非犹太人，尤其是随后接手处置耶稣的非犹太权力者。“外族人”可泛指外国或异族人士，弱化了原文在犹太—外邦语境中的既定指称；“外邦人”更合适。
  - severity: low
    issue: “我们正上耶路撒冷去”语序略显生硬。
    rationale: 改作“我们正往耶路撒冷上去”能自然保留 ἀναβαίνομεν 的动态及“上耶路撒冷”的地理／叙事用语。
  - severity: low
    issue: “经学家”较“文士”更具解释性。
    rationale: γραμματεῖς 的直接而通行译名为“文士”。“经学家”虽非错误，却较容易使读者理解为一般经学研究者，而非本段所指的具体社会与宗教群体。
