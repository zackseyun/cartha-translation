  to: 说：“看，我们正往耶路撒冷上去；人子将被交给[a]祭司长和文士，他们要定他死罪，再把他交给外邦人[b]。”
  rationale: 修订仅调整了三个安全且必要的层面：以更自然的语序表达“上耶路撒冷”，以“文士”直接对应 γραμματεῖς，并以“外邦人”准确表达 τοῖς ἔθνεσιν 在本段的历史语境。保留“说”作为承接上节、引出直接引语的自然汉语处理；保留两次“交给”以反映原文重复；脚注锚点及脚注内容均完整保留并相应更新。
