  text: ⸀ἐμβλέψας αὐτοῖς ὁ Ἰησοῦς λέγει· Παρὰ ἀνθρώποις ἀδύνατον ἀλλ’ οὐ παρὰ θεῷ, πάντα γὰρ ⸀δυνατὰ παρὰ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/027.yaml
  text: Jesus looked at them and said, “With men it is impossible, but not with God, because all things are possible with God.”
translation:
  language: zh_hans
  text: 耶稣看着他们，说：“在人这是不可能的，但在上帝却不是，因为在上帝凡事都可能。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβλέψας αὐτοῖς
  choice: 看着他们
  rationale: 表达带有定向、专注意味的注视，同时保持现代汉语自然简洁。
- source_word: Παρὰ ἀνθρώποις
  choice: 在人
  rationale: 保留παρά在此表示‘就人而言、在人这一方’的关系性含义，并与后文‘在上帝’形成对称。
- source_word: ἀδύνατον
  choice: 不可能的
  rationale: 保留原文省略主语的表述，让具体所指由上文语境补足。
- source_word: πάντα
  choice: 凡事
  rationale: 自然概括‘一切事’，保留原文宽广表述，不擅自增添限定。
- source_word: δυνατὰ παρὰ τῷ θεῷ
  choice: 在上帝凡事都可能
  rationale: 维持与前半句的平行结构，并自然传达‘对上帝而言／在上帝那里是可能的’。
theological_decisions:
- issue: 人的不可能与上帝的可能之间的对比
  choice: “在人这是不可能的，但在上帝却不是”
  alternative: “人不能做到，上帝却能”
  rationale: 所选译法保留原文形容词式、略带开放性的表达，不把它具体化为单纯的行动能力，也保留上下文有关得救之可能性的张力。
- issue: γάρ的逻辑关系
  choice: “因为”
  alternative: “因为/原来/要知道”
  rationale: 此处说明为何‘在上帝却不是不可能’，因果关系明确；译作‘因为’符合原文论证连接，也与审定英文咨询层一致。
- issue: πάντα的范围
  choice: “凡事”
  alternative: “这事”
  rationale: 保留原文的普遍措辞，同时让上下文限定其实际论域，避免把经文改写为更窄的命题。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。句式尽量保留原文‘在人／在上帝’的对称和神学张力；不添加脚注，因为本节没有必须向普通读者说明的文本异文或不可兼容译法。
