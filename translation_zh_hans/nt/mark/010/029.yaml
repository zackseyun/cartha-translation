source:
  edition: SBLGNT
  text: ⸂ἔφη ὁ Ἰησοῦς⸃· Ἀμὴν λέγω ὑμῖν, οὐδείς ἐστιν ὃς ἀφῆκεν οἰκίαν ἢ ἀδελφοὺς ἢ ἀδελφὰς ἢ ⸂μητέρα ἢ πατέρα⸃ ἢ τέκνα ἢ ἀγροὺς ἕνεκεν ἐμοῦ καὶ ἕνεκεν τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/029.yaml
  text: Jesus said, “Truly I say to you, there is no one who has left house or brothers or sisters or mother or father or children or fields for my sake and for the sake of the gospel,”
translation:
  language: zh_hans
  text: 耶稣说：“我实在告诉你们，凡为我和福音的缘故，离开房屋、弟兄、姐妹、母亲、父亲、儿女或田地的人，没有一个……[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文的句子在下一节继续并完成；这里的“没有一个”不是说无人这样离开，而是引出下一节所说的结果。
    reason: 本节在希腊文中是跨节复句的前半部分。单独呈现时，现代汉语容易把否定范围误解为“没有人离开”，因此需说明句法延续。
lexical_decisions:
- source_word: ἔφη ὁ Ἰησοῦς
  choice: 耶稣说
  rationale: φημί在这里直接引出耶稣的话；“说”自然准确，不额外加入“回答”或“宣告”的语气。
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: 我实在告诉你们
  rationale: 这是耶稣郑重引出教导的固定表达。“实在”传达ἀμήν的郑重肯定，“告诉你们”符合现代汉语，同时保留直接宣告的语气。
- source_word: οὐδείς ἐστιν ὃς
  choice: 凡……的人，没有一个……
  rationale: 希腊文采用全称否定结构，而且句意延续到下一节。汉语用“凡……的人，没有一个……”既保留普遍范围和否定力量，也让未完句式自然指向下文。
- source_word: ἀφῆκεν
  choice: 离开
  rationale: ἀφίημι在此指因门徒身份而离开亲属、住所或产业；“离开”保留其代价，却不暗示彻底遗弃或否认家庭责任。
- source_word: οἰκίαν
  choice: 房屋
  rationale: 这里与亲属及田地并列，较可能指住所或产业；“房屋”比带有较强情感色彩的“家”更贴近原词。
- source_word: ἀδελφοὺς ἢ ἀδελφὰς
  choice: 弟兄、姐妹
  rationale: 原文分别列出男性和女性手足，译文也分别表达；“弟兄”在庄重现代汉语中自然，并与“姐妹”对应。
- source_word: μητέρα ἢ πατέρα
  choice: 母亲、父亲
  rationale: 按原文次序直译两种亲属关系，不合并为泛称。
- source_word: τέκνα
  choice: 儿女
  rationale: τέκνα泛指子女，不限定性别；“儿女”在此比“孩子”更适合亲属关系清单的庄重语体。
- source_word: ἀγρούς
  choice: 田地
  rationale: ἀγρός指田地或耕地；“田地”具体、自然，也不扩展为整个农场或泛指一切土地。
- source_word: ἕνεκεν ἐμοῦ καὶ ἕνεκεν τοῦ εὐαγγελίου
  choice: 为我和福音的缘故
  rationale: 保留两个ἕνεκεν所表达的双重缘由，同时以自然汉语避免机械重复“为了……并为了……”。
theological_decisions:
- issue: 如何表达离开亲属和产业而不夸大为遗弃责任
  choice: 离开
  alternative: 撇下；抛弃
  rationale: 经文强调跟随耶稣和福音所付的代价，但ἀφῆκεν本身并不必然表示恶意抛弃或永久废除家庭义务。“离开”保留这一张力，不替经文作额外裁断。
- issue: 如何处理跨至下一节才完成的否定结构
  choice: 凡……的人，没有一个……
  alternative: 任何……的人；没有人为……离开……
  rationale: οὐδείς的主句要到10:30才完整。译成“没有人为……”若单独阅读会暂时产生相反意思；保留“没有一个……”并以省略号显示句子未完，既忠于语法，也不提前翻入下一节内容。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。亲属与产业逐项列出，以保持原文的累积力度；句末省略号和脚注明确显示本句尚未结束，而不擅自把10:30的内容并入本节。
