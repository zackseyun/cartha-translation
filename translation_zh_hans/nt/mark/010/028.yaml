  text: Ἤρξατο ⸂λέγειν ὁ Πέτρος⸃ αὐτῷ· Ἰδοὺ ἡμεῖς ἀφήκαμεν πάντα καὶ ⸀ἠκολουθήκαμέν σοι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/028.yaml
  text: Peter began to say to him[a], “Look, we have left everything and followed you.”
translation:
  language: zh_hans
  text: 彼得开始对他说：“你看[a]，我们已经撇下一切，跟从了你。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“看哪”或“你看。”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤρξατο λέγειν
  choice: 就……说
  rationale: 原文是“开始说”的惯用结构；在这段简短的直接引语前，现代汉语用“就……说”更自然，也交代了彼得接续上文开口回应。
- source_word: ὁ Πέτρος
  choice: 彼得
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: αὐτῷ
  choice: 对他说
  rationale: 保留原文代词，不在正文中补出“耶稣”；其所指可由上下文确定。
- source_word: Ἰδοὺ
  choice: 你看
  rationale: 这是引起对方注意、强调随后陈述的语篇标记。“你看”自然传达其呼语功能；亦可译作“看哪”。
- source_word: ἡμεῖς
  choice: 我们
  rationale: 明示主语，保留原文显性代词所带的强调，并与前文提到的人形成对照。
- source_word: ἀφήκαμεν
  choice: 已经撇下
  rationale: “撇下”符合此处离开所有物和原有依附而作门徒的语境；“已经”自然表达过去行动对当前处境仍有影响。
- source_word: πάντα
  choice: 一切
  rationale: 简洁保留原文涵盖性的表达，不把其范围限定为财物或家庭。
- source_word: ἠκολουθήκαμέν
  choice: 跟从了
  rationale: 原文完成时表示已经开始且具有持续意义的跟从关系；“跟从了你”在现代庄重中文中自然，并与“已经撇下”共同呈现现时相关性。
- source_word: σοι
  choice: 你
  rationale: 直接保留第二人称宾语，不附加原文没有的强调或身份说明。
theological_decisions:
- issue: 彼得关于门徒牺牲的自我陈述
  choice: 按彼得本人的强调直译为“我们已经撇下一切，跟从了你”
  alternative: 加入“舍弃所有”或预先按耶稣随后的回答解释、修正彼得的话
  rationale: 本节只记录彼得的宣称，并未由叙述者在此评价其准确性；译文不替说话者背书，也不削弱其语气，从而保留上下文中的神学张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“撇下”保留门徒离开原有事物的语境色彩；“你看”较口语化但不过分随便，脚注列出较庄重的“看哪”。
