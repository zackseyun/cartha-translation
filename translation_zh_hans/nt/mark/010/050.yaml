  yaml_path: translation/nt/mark/010/050.yaml
  text: And throwing off his cloak[a], he sprang up and came to Jesus.
translation:
  language: zh_hans
  text: 他甩掉自己的外衣，跳起来，来到耶稣跟前。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποβαλών
  choice: 一甩
  rationale: 该不定过去时分词描写果断、迅速地把衣服丢开；“把外衣一甩”既保留动作的突发感，也符合现代汉语叙事表达。
- source_word: ἱμάτιον
  choice: 外衣
  rationale: ἱμάτιον在此通常指穿在外面的衣服；“外衣”准确而通俗，比“袍子”更少加入具体款式。
- source_word: ἀναπηδήσας
  choice: 跳起来
  rationale: 该分词表示突然跃起的有力动作；“跳起来”自然地传达人物的急切和活力。
- source_word: ἦλθεν πρὸς τὸν Ἰησοῦν
  choice: 来到耶稣跟前
  rationale: ἔρχομαι与πρός表示朝向耶稣移动并来到他那里；“来到耶稣跟前”在汉语中清楚自然。
- source_word: δὲ
  choice: 就
  rationale: δὲ在这里是推动叙事的轻度连接词；“就”承接上文并表现随即发生的动作，不制造过强转折。
theological_decisions: []
