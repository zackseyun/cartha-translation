base_translation:
  language: en
  yaml_path: translation/nt/mark/010/049.yaml
  text: And Jesus stopped and said[a], “Call him.” And they called the blind man, saying to him, “Take courage; get up[b], he is calling you.”
translation:
  language: zh_hans
  text: 耶稣停下脚步[a]，说：“叫他来。”他们就叫那盲人，对他说：“鼓起勇气来[b]，起来吧，他在叫你。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“站住”或“站定”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“放心吧”或“振作起来”。
    reason: lexical_alternative
lexical_decisions:
- source_word: στὰς
  choice: 停下脚步
  rationale: 该词形式上是“站住、站定”的分词；在叙事语境中表示耶稣停止前行。“停下脚步”符合现代汉语习惯，同时保留动作画面。
- source_word: Φωνήσατε αὐτόν
  choice: 叫他来
  rationale: φωνέω在此表示呼叫或召唤某人。“叫他来”直接自然，也表明是要那人来到耶稣面前。
- source_word: φωνοῦσι
  choice: 叫
  rationale: 沿用“叫”来对应同一希腊动词，与耶稣的命令及后文“叫你”形成有意的词语重复。
- source_word: τὸν τυφλὸν
  choice: 那盲人
  rationale: τυφλός在此作名词使用，指上下文中的巴底买；“那盲人”自然、准确，不额外添加原文没有的称谓。
- source_word: Θάρσει
  choice: 鼓起勇气来
  rationale: 该命令式用于鼓励和安慰。“鼓起勇气来”既传达鼓励的力度，也适合当前紧迫而正面的语境。
- source_word: ἔγειρε
  choice: 起来
  rationale: 该命令要求他起身；“起来”简洁自然，并保留原文直接的命令语气。
- source_word: φωνεῖ σε
  choice: 他在叫你
  rationale: 现在时在此表达当下正在发生的召唤；“他在叫你”自然传达即时性，并保持φωνέω的重复。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准普通话。保留φωνέω在本节中的三次重复，统一译为“叫”；用“停下脚步”表达στὰς在行进叙事中的惯用含义。
