id: MRK.10.9
reference: Mark 10:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὃ οὖν ὁ θεὸς συνέζευξεν ἄνθρωπος μὴ χωριζέτω.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/009.yaml
  text: Therefore[a], what God has joined together, man must not separate.
translation:
  language: zh_hans
  text: 所以，神所结合的，人[a]不可分开。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人”在原文中是单数泛称，指任何人；也可译作“任何人”。
    reason: 说明ἄνθρωπος的泛指范围，并保留原文单数形式。
lexical_decisions:
- source_word: ὃ
  choice: ……的
  rationale: 用“神所结合的”这一现代汉语名词化结构承接中性单数关系代词，整体指上文所说的婚姻结合；既自然，也不把它改成人称性的“谁”。
- source_word: οὖν
  choice: 所以
  rationale: 表示由前文关于神设立婚姻的论述所得出的结论；“所以”清楚、自然地传达推论关系。
- source_word: ὁ θεὸς
  choice: 神
  rationale: 直接对应原文作主语的“神”，符合现代中文圣经语体。
- source_word: συνέζευξεν
  choice: 所结合的
  rationale: 该动词指连接、使二者同负一轭。这里译作“结合”既保留婚姻语境中的联合含义，又避免“同负一轭”在现代中文中可能造成的过度比喻化。
- source_word: ἄνθρωπος
  choice: 人
  rationale: 原文为无冠词单数，作泛称，意为任何人或人类一方；中文“人”能简洁自然地保留这种泛指用法。
- source_word: μὴ χωριζέτω
  choice: 不可分开
  rationale: μή加现在时命令语气表达禁止；“不可”传达规范性禁令，“分开”准确对应使婚姻结合分离的意思。
theological_decisions:
- issue: 婚姻结合中神的行动与人的禁止
  choice: 保留“神所结合的，人不可分开”的鲜明对照
  alternative: 神所结合的，任何人都不应使他们离婚
  rationale: 原文将神的结合与人的分开直接对置；主文本不把“分开”具体解释为法律上的离婚，也不削弱命令语气，因而保留经文本身的范围与张力。
- issue: ἄνθρωπος在婚姻教导中的泛指范围
  choice: 译作“人”，并以脚注说明其泛指意义
  alternative: 任何人
  rationale: “人”既贴近原文的单数形式，在现代汉语中也自然包含男女；脚注防止读者误解为仅指男性。
translation_notes:
  register: 采用简洁、庄重而通顺的现代标准普通话。“所以”明确承接前文推论；“神所结合的，人不可分开”保持原句的凝练、对称和命令力度。
