  text: Καὶ ἐκεῖθεν ἀναστὰς ἔρχεται εἰς τὰ ὅρια τῆς Ἰουδαίας ⸀καὶ πέραν τοῦ Ἰορδάνου, καὶ συμπορεύονται πάλιν ὄχλοι πρὸς αὐτόν, καὶ ὡς εἰώθει πάλιν ἐδίδασκεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/001.yaml
  text: And from there[a], rising, he comes into the region of Judea and beyond the Jordan, and crowds gather to him again, and as was his custom[b], he again taught them.
translation:
  language: zh_hans
  text: 耶稣从那里起身，来到犹太地区和约旦河对岸[a]。群众又聚集到他那里；他照常又教导他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这句话也可理解为“约旦河对岸的犹太地区”。原文的结构既可能指“犹太地区”和“约旦河对岸”，也可能把两者合为一个地点。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκεῖθεν
  choice: 从那里
  rationale: 自然、准确地表示从前一地点离开。
- source_word: ἀναστὰς
  choice: 起身
  rationale: 表示在主要动作之前起身离开；在此不含复活之意。
- source_word: ἔρχεται
  choice: 来到
  rationale: 中文叙事通常不以时态形态重现希腊语历史现在时；“来到”既自然，也保留抵达目的地的动态。
- source_word: τὰ ὅρια τῆς Ἰουδαίας
  choice: 犹太境内
  rationale: ὅρια在旅行语境中指地区或疆域，而不只是边界线。
- source_word: καὶ πέραν τοῦ Ἰορδάνου
  choice: 和约旦河对岸
  rationale: 依照希腊语顺序，将其呈现为并列的地理表述，同时用脚注保留也可能与“犹太境内”合为一体理解的句法张力。
- source_word: συμπορεύονται
  choice: 聚集到
  rationale: 该词本有一同行进之意，但与“群众”和πρὸς αὐτόν连用时，语境重点是人群来到耶稣那里会合。
- source_word: πάλιν
  choice: 又
  rationale: 原文两次出现πάλιν，正文两处均予保留，以呈现马可反复推进叙事的风格。
- source_word: ὄχλοι
  choice: 群众
  rationale: 现代汉语中自然地表达复数人群，且语体庄重平实。
- source_word: ὡς εἰώθει
  choice: 照常
  rationale: 简洁自然地表达惯常行为，避免生硬直译。
- source_word: ἐδίδασκεν αὐτούς
  choice: 教导他们
  rationale: 准确表达持续或惯常的教导行动；与“照常”结合，已清楚传达未完成时的习惯性意义。
theological_decisions:
- issue: 叙事历史现在时
  choice: 译作自然的中文叙事“来到”
  alternative: 用更具现场感的“来到了”或刻意标示现在时
  rationale: 现代汉语没有与希腊语时态直接对应的动词屈折；自然叙事无需人为制造时态突兀，同时“来到”仍保留动作的鲜明感。
- issue: καὶ πέραν τοῦ Ἰορδάνου的地理句法
  choice: 正文译为“犹太境内和约旦河对岸”，脚注说明另一种句法理解
  alternative: 译为单一地点“约旦河对岸的犹太境内”
  rationale: 原文结构紧缩，既可能列出两个地理表述，也可能把后语理解为修饰前语。正文贴近词序，不武断消除歧义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“起身”“境内”“照常教导”等表达贴近原文而不显生硬；保留原文两次“又”。
