  text: οὐχ οὕτως δέ ⸀ἐστιν ἐν ὑμῖν· ἀλλ’ ὃς ⸀ἂν θέλῃ ⸂μέγας γενέσθαι⸃ ἐν ὑμῖν, ἔσται ὑμῶν διάκονος,
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/043.yaml
  text: But it is not so among you[a]. Instead, whoever wants to become great among you will be your servant[b],
translation:
  language: zh_hans
  text: 但在你们中间并不是这样[a]；相反，谁想在你们中间成为大人物，谁就要作你们的仆人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“但你们中间不是这样。”
    reason: lexical_alternative
  - marker: b
    text: 原文作“将会是你们的仆人”。这里的将来时在教导语境中也可带有规范性的意味。
    reason: alternative_reading
lexical_decisions:
- source_word: οὐχ οὕτως δέ ἐστιν ἐν ὑμῖν
  choice: 但你们中间不是这样
  rationale: 以自然的现代汉语表达否定方式的结构，并让“但”体现δέ在上下文中与外族统治者作风形成的对比。
- source_word: ἀλλ’
  choice: 相反
  rationale: 清楚标示耶稣所提出的强烈转折：门徒群体中的伟大与世俗权力模式相反。
- source_word: ὃς ἂν θέλῃ
  choice: 谁想……谁
  rationale: 汉语“谁……谁……”自然表达带ἄν和虚拟语气的泛指条件，同时保留θέλω的意愿含义。
- source_word: μέγας γενέσθαι
  choice: 成为大人物
  rationale: “成为”保留γενέσθαι的进入某种状态之意；“大人物”在此表达群体中的显要地位，比单说“伟大”更自然，也不局限于名望。
- source_word: ἐν ὑμῖν
  choice: 你们中间
  rationale: 符合群体内部的社会关系语境；原文两次出现，译文也相应保留。
- source_word: ἔσται ὑμῶν διάκονος
  choice: 就要作你们的仆人
  rationale: “要作”既保留将来式的形式痕迹，也能在此语境中传达规范性要求；“仆人”表达διάκονος的服事含义，避免误解为后来的教会职分。
theological_decisions:
- issue: ἔσται这一将来时动词在耶稣教导中的语力
  choice: 译作“就要作你们的仆人”
  alternative: “就会作你们的仆人”或“就必须作你们的仆人”
  rationale: 原文是将来直陈式，但在语境中带有规范或命令意味。“要作”在现代汉语中兼顾二者，不把语力弱化为单纯预测，也不直接强化成明说的“必须”。
- issue: διάκονος的含义
  choice: 仆人
  alternative: 服事者
  rationale: 这里强调在群体中谦卑服事，而不是指一种正式教会职分。“仆人”保留身份倒转的力度，同时不与表示奴隶的δοῦλος完全等同。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“大人物”表达群体中的地位之大；“仆人”突出服务他人的角色。分号呈现否定与正面教导之间的强转折。
