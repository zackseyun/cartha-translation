id: MRK.10.23
reference: Mark 10:23
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ περιβλεψάμενος ὁ Ἰησοῦς λέγει τοῖς μαθηταῖς αὐτοῦ· Πῶς δυσκόλως οἱ τὰ χρήματα ἔχοντες εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελεύσονται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/023.yaml
  text: And looking around[a], Jesus says to his disciples, “How difficult it is for those who have wealth to enter the kingdom of God!”
translation:
  language: zh_hans
  text: 耶稣环顾四周，对他的门徒说：“有钱财的人[a]要进入上帝的国，是多么难啊！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “钱财”也可译作“财物”或“财富”。
    reason: 保留 χρήματα 可指金钱、财物或财富的词义范围。
lexical_decisions:
- source_word: περιβλεψάμενος
  choice: 环顾四周
  rationale: 该词描写向周围观看；用简洁自然的汉语保留分词动作与随后说话之间的叙事次序。
- source_word: λέγει
  choice: 说
  rationale: 这是马可常用的历史现在时；汉语“说”无需标明过去时，也能保持叙述的鲜明感。
- source_word: Πῶς δυσκόλως
  choice: 是多么难啊
  rationale: 保留原文感叹语气和“困难、艰难”的程度，不把意思强化为绝对不可能。
- source_word: οἱ τὰ χρήματα ἔχοντες
  choice: 有钱财的人
  rationale: 按原文保留描述性分词结构，不直接归类为固定社会身份“富人”。
- source_word: χρήματα
  choice: 钱财
  rationale: “钱财”在现代汉语中自然，也可涵盖金钱及物质财产；脚注保留“财物、财富”等词义可能。
- source_word: βασιλείαν τοῦ θεοῦ
  choice: 上帝的国
  rationale: 采用清楚而传统的对应表达，保留“国”的意象及马可福音中的术语连贯性。
- source_word: εἰσελεύσονται
  choice: 要进入
  rationale: “要”自然体现希腊文将来时，而“进入”准确表达进入上帝之国。
theological_decisions:
- issue: 这句话是指有钱财者绝不可能进入上帝的国，还是强调进入极其困难
  choice: 译为“是多么难啊”，表达严重困难
  alternative: 采用暗示实际上不可能的强化译法
  rationale: 原文使用 δυσκόλως（艰难地、困难地），并未直接使用“不可能”的措辞；译文保留其神学张力，不替本节作更强的结论。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“环顾四周”生动呈现动作；“是多么难啊”保留感叹力度。脚注标记置于其实际说明的“有钱财的人”之后。
