  yaml_path: translation/nt/mark/010/036.yaml
  text: And he said to them, “What do you want me to do for you?”
translation:
  language: zh_hans
  text: 他对他们说：“你们要我为你们做什么？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ
  choice: 他
  rationale: 此处冠词带δέ是叙事中的惯用衔接，主语由上下文确定。现代汉语无需机械译出连接词；省去“于是”或“但”可避免过度强调先后或转折。
- source_word: εἶπεν
  choice: 说
  rationale: λέγω是普通的说话动词；虽然下文是问句，译作“说”更直接地对应原文，疑问语气由问句本身表达。
- source_word: αὐτοῖς
  choice: 对他们
  rationale: 与说话动词搭配时，复数与格代词自然译为“对他们”。原文没有明确说“他们两人”，因此不增译。
- source_word: Τί
  choice: 什么
  rationale: 中性疑问代词直接询问所期望的事情，现代汉语以“什么”自然对应。
- source_word: θέλετε
  choice: 你们要
  rationale: θέλω表示意愿或愿望；此处“要”简洁自然，也保留问话的直接语气。
- source_word: ποιήσω
  choice: 我……做
  rationale: θέλετε之后的第一人称不定过去时虚拟式表达他们希望耶稣采取的行动。汉语用“要我……做”自然呈现这一结构；本语境宜译“做”而非“制造”。
- source_word: ὑμῖν
  choice: 为你们
  rationale: 此与格表示受益者，即所做之事是为他们而做；“为你们”比“给你们”更贴合此处行动的受益关系。
theological_decisions: []
