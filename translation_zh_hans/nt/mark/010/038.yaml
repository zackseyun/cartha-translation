  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Οὐκ οἴδατε τί αἰτεῖσθε· δύνασθε πιεῖν τὸ ποτήριον ὃ ἐγὼ πίνω, ⸀ἢ τὸ βάπτισμα ὃ ἐγὼ βαπτίζομαι βαπτισθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/038.yaml
  text: But Jesus said to them[a], “You do not know what you are asking. Are you able to drink the cup that I drink[b], or to be baptized with the baptism with which I am baptized?”
translation:
  language: zh_hans
  text: 耶稣却对他们说：“你们不知道自己所求的是什么。我所喝的杯[a]，你们能喝吗？或是我所受的洗礼[b]，你们能受吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “杯”在圣经中可比喻分派给一个人的份；这里尤其指耶稣将要遭受的苦难。
    reason: cross_reference
  - marker: b
    text: 也可较意译为：“我所经历的洗礼，你们能经历吗？”希腊原文重复使用“洗礼”这一词族的名词和动词，以加强表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς
  choice: 耶稣却对他们说
  rationale: δέ在这里带出耶稣对前述请求的纠正和转折；“却”自然地表达这种轻微对比。
- source_word: Οὐκ οἴδατε τί αἰτεῖσθε
  choice: 你们不知道自己所求的是什么
  rationale: 保留οἶδα“知道”的基本含义，同时用“自己所求的是什么”准确、自然地表达间接问句。
- source_word: δύνασθε
  choice: 你们能……吗
  rationale: 直接表达能力或承受力，符合δύναμαι在本句中的语义，也适合现代汉语问句。
- source_word: πιεῖν τὸ ποτήριον ὃ ἐγὼ πίνω
  choice: 我所喝的杯，你们能喝吗
  rationale: 保留“喝杯”的原文隐喻，不在正文中提前解释为受苦、死亡或忿怒。
- source_word: ποτήριον
  choice: 杯
  rationale: 直译并保留其圣经隐喻意义；原文没有明说“苦杯”，因此不作增译。
- source_word: ἢ
  choice: 或是
  rationale: 忠实反映SBLGNT所采用的析取连词，不按平行经文或其他抄本传统改成合取关系。
- source_word: τὸ βάπτισμα ὃ ἐγὼ βαπτίζομαι βαπτισθῆναι
  choice: 我所受的洗，你们能受吗
  rationale: 用“受的洗／受”尽量保留βάπτισμα与βαπτίζω同源词的重复及被动意味，同时避免把隐喻直接释为“经历苦难”。
theological_decisions:
- issue: “杯”和“洗”的隐喻所指
  choice: 在正文中保留“杯”和“洗”两个隐喻
  alternative: 直接译作“我所受的苦，你们能承受吗”或明确解释为死亡、上帝的忿怒
  rationale: 上下文指向耶稣将要遭受的苦难，但本节没有把隐喻的全部神学内涵明说出来。保留原有意象可维持其开放性和张力，避免把某一种解释写入正文。
- issue: “洗”之措辞的礼仪含义与隐喻含义
  choice: 译作“我所受的洗……能受吗”
  alternative: 译作“我所经历的遭遇……能经历吗”
  rationale: 保留洗礼词群的语言形式及经文互文联系，同时由上下文让读者辨认其隐喻用法，不把它局限为水礼，也不将其完全抽象化。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“所求的是什么”略带正式感，适合耶稣严肃的纠正；两个问句保持平行结构。“受的洗／能受”在日常汉语中略显修辞性，但有意保留原文同源词重复和隐喻张力。脚注标记按内容分别置于“杯”和“洗”之后。
