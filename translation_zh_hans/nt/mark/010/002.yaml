  text: ⸀Καὶ ⸀ἐπηρώτων αὐτὸν εἰ ἔξεστιν ἀνδρὶ γυναῖκα ἀπολῦσαι, πειράζοντες αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/002.yaml
  text: And they were asking him whether it is lawful for a man to divorce a wife[a], testing him.
translation:
  language: zh_hans
  text: 他们问他：“男人休妻是否合法？”[a]他们这样问，是要试探他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“丈夫休掉妻子是否合法？”
    reason: ἀνήρ可指“男人”或“丈夫”；γυνή在此可相应表达为“妻子”。此译法把原文语境中隐含的婚姻关系说得更明确。
lexical_decisions:
- source_word: ἐπηρώτων
  choice: 问
  rationale: 未完成时描写当时持续进行的询问；现代汉语在此用“问”最自然，语境已足以呈现其盘问性质，不必生硬加入“一直”或“一再”。
- source_word: ἔξεστιν
  choice: 是否合法
  rationale: 这里讨论的是律法层面的许可，而非一般意义上的可能或准许；“是否合法”准确体现法律争议的语气。
- source_word: ἀνδρὶ
  choice: 男人
  rationale: ἀνήρ既可指“男人”，也可指“丈夫”。主译保留其一般性的男性表达，婚姻关系由“休妻”自然显明。
- source_word: γυναῖκα
  choice: 妻
  rationale: γυνή可指“女人”或“妻子”；在ἀπολῦσαι所表达的离婚语境中明确指妻子。汉语“休妻”无需另加物主代词。
- source_word: ἀπολῦσαι
  choice: 休妻
  rationale: 该动词本义可指释放、打发离开，但在婚姻法律语境中特指离婚。“休妻”简洁、明确，也符合当时由男子提出解除婚姻的表述。
- source_word: πειράζοντες
  choice: 试探
  rationale: 该分词说明提问的目的或伴随意图，带有敌意的考验意味。“试探”保留原文力度，又不像“设圈套”那样把隐含动机完全明说。
- source_word: Καὶ
  choice: 他们
  rationale: καί承接上文，汉语分节独立呈现时无需机械译作“并且”；直接以主语起句更自然，同时不增加原文没有的时间关系。
theological_decisions:
- issue: ἀνδρὶ在婚姻律法问题中应译为“男人”还是“丈夫”
  choice: 男人
  alternative: 丈夫
  rationale: 原词兼有两义，且句式具有一般性。主文译“男人”保留原文形式，脚注列出婚姻身份更明确的译法，避免将词义张力静默消除。
- issue: πειράζοντες是否明译为“企图陷害”
  choice: 试探
  alternative: 企图设圈套陷害
  rationale: 原文明确表达试验或考验，却没有直接使用“陷害”一词；因此不把可能的敌对目的扩写成更具体的行动。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“休妻”略带法律与历史语域，能简洁表达当时由男子解除婚姻的议题；后一句拆开表达目的分词，使中文清楚自然。
