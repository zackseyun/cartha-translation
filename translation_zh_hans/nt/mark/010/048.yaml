  text: καὶ ἐπετίμων αὐτῷ πολλοὶ ἵνα σιωπήσῃ· ὁ δὲ πολλῷ μᾶλλον ἔκραζεν· Υἱὲ Δαυίδ, ἐλέησόν με.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/048.yaml
  text: And many were rebuking him so that he would be silent[a], but he was crying out all the more, “Son of David, have mercy on me!”
translation:
  language: zh_hans
  text: 许多人斥责他，要他安静；他却越发喊叫：“大卫之子，怜悯我吧！”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大卫之子”是具有王室和弥赛亚含义的称号；也可按其含义译作“弥赛亚”，但这里保留希腊原文的称呼。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπετίμων
  choice: 斥责
  rationale: 未完成时表示持续或反复的动作；“斥责”保留了动词的严厉语气，比“劝告”更贴近人们试图制止他的情境。
- source_word: πολλοὶ
  choice: 许多人
  rationale: 形容词在此作名词使用；直译为“许多人”，不擅自具体化为“群众”。
- source_word: ἵνα σιωπήσῃ
  choice: 要他安静
  rationale: 自然地表达ἵνα所引目的，同时保留使他停止出声的含义。
- source_word: πολλῷ μᾶλλον
  choice: 越发
  rationale: 简洁、自然地表达程度上的加强，不额外加入原文未明说的“更大声”。
- source_word: ἔκραζεν
  choice: 喊叫
  rationale: 未完成时与“越发”结合，传达持续呼喊；“喊叫”保留κράζω的急切和强烈程度。
- source_word: Υἱὲ Δαυίδ
  choice: 大卫之子
  rationale: 按原文保留这一王室—弥赛亚称号，既庄重又不把称号直接释义为“弥赛亚”。
- source_word: ἐλέησόν με
  choice: 可怜我吧
  rationale: 这是现代汉语中自然且急切的恳求，表达向对方求怜悯与援助；“吧”使命令式在此呈现为恳求语气。
theological_decisions:
- issue: “大卫之子”的弥赛亚意义
  choice: 保留称号“大卫之子”
  alternative: 译作“弥赛亚”
  rationale: 希腊文直接使用Υἱὲ Δαυίδ。保留称号本身，既忠于措辞，也让读者从上下文体会其王室和弥赛亚意义，而不在正文中以解释取代原文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。分号呈现群众的制止与他的强烈回应之间的转折；引语保留直接而迫切的呼求。
