  text: τὸ δὲ καθίσαι ἐκ δεξιῶν μου ⸀ἢ ἐξ εὐωνύμων οὐκ ἔστιν ἐμὸν δοῦναι, ἀλλ’ οἷς ἡτοίμασται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/040.yaml
  text: But to sit at my right or at my left is not mine to give[a], but for those for whom it has been prepared.
translation:
  language: zh_hans
  text: 至于坐在我的右边或左边，不是我可以赐予的[a]；这些座位是为谁预备的，就赐给谁。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“并不由我赐予。”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ... καθίσαι
  choice: 至于坐
  rationale: 带冠词的不定式在句中名词化；用“至于坐”既保留动作意义，也自然引出本句主题。
- source_word: ἐκ δεξιῶν μου
  choice: 在我的右边
  rationale: 该惯用语表示位于说话者右侧；“在我的右边”符合现代汉语空间表达，且不额外加入原文未明说的“手”。
- source_word: ἢ ἐξ εὐωνύμων
  choice: 或左边
  rationale: 复数形式的惯用语表示左侧；与“右边”构成简洁、对称的表达。
- source_word: οὐκ ἔστιν ἐμὸν δοῦναι
  choice: 不是我可以赐予的
  rationale: 此结构表明赐予这些座位并不属于耶稣在这里所声称的权限。“不是我可以赐予的”贴近原文，同时以脚注保留“并不由我赐予”这一语气略有不同的译法。
- source_word: ἀλλ’ οἷς
  choice: 而是为谁预备的，就归谁
  rationale: 原文在ἀλλά之后省略了需由上文补足的成分。汉语采用“为谁……就归谁”补明省略关系，表达这些位置属于获预备者，而不指定原文未说明的施事者。
- source_word: ἡτοίμασται
  choice: 预备的
  rationale: 完成时被动语态表示预备已经完成并且结果持续存在；在“为谁预备的”结构中，现代汉语无需另加“已经”也能自然表达既成安排。
theological_decisions:
- issue: 耶稣的话应否译成绝对否认其权柄，或用附加说明将其限制在特定语境中
  choice: 直接译作“不是我可以赐予的”，不添加解释性限定
  alternative: “不是由我独自决定赐予的”或“不是我可以离开父的旨意赐予的”
  rationale: 希腊文本明确陈述限制，却没有解释限制的性质或原因。译文不加入“独自”或“离开父的旨意”等神学协调语，以保留原文的张力。
- issue: 被动式ἡτοίμασται的施事者是否应明确为上帝
  choice: 保留被动表达“为谁预备的”
  alternative: “上帝为谁预备，就归谁”
  rationale: 上下文可能使读者理解上帝为施事者，但本节没有明说。保留被动语态可避免把合理推断写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“赐予”适合权位授予的语境；末句以汉语对应结构补足希腊文省略，避免生硬直译，同时不补出预备者是谁。
