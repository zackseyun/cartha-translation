  text: And he took them in his arms and blessed them[b][a], laying his hands on them.
translation:
  language: zh_hans
  text: 他把孩子们抱在怀里，一边把手放在他们身上，一边不断地为他们祝福。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不断地为他们祝福”也可译作“热切地为他们祝福”。原文动词采用未完成时态，并带有加强意味，表示持续、反复或恳切地祝福。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐναγκαλισάμενος
  choice: 把孩子们抱在怀里
  rationale: 该动词具体表示把人抱入怀中；此译法自然、明确，也保留耶稣动作中的亲切与温柔。
- source_word: κατευλόγει
  choice: 不断地为他们祝福
  rationale: 未完成时态表现持续或反复的动作，而带加强意味的复合动词也不宜弱化为一次性的动作；中文用“不停地”会显得绝对化，因此采用“不断地”传达持续、恳切施福的意味。
- source_word: τιθεὶς τὰς χεῖρας ἐπ’ αὐτά
  choice: 一边把手按在他们身上
  rationale: 现在分词说明伴随祝福进行的动作。“按在……身上”准确表达手实际放在孩子们身上，又不额外引入后来的礼仪术语。
- source_word: αὐτὰ ... αὐτά
  choice: 孩子们……他们
  rationale: 希腊文代词承接上文的孩子。中文首次明说“孩子们”可避免单节阅读时指代不明，随后用“他们”保持自然。
- source_word: καὶ
  choice: 他
  rationale: 希腊文καί承接前文；现代中文逐节表达时不必机械译成“并且”，直接起句更自然，叙事衔接仍由上下文体现。
theological_decisions:
- issue: 耶稣对孩子们所做之事的性质
  choice: 保留抱在怀里、把手按在身上和祝福这三项具体行动，不加仪式性或圣礼性术语。
  alternative: 译作“拥抱他们并为他们举行按手祝福”或“借着按手为他们祝福”。
  rationale: 原文描写耶稣亲切接纳并祝福孩子们，但没有把这一行动界定为后来的特定宗教礼仪；译文不应替原文作神学定性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“抱在怀里”比泛泛的“拥抱”更贴合原词；用两个“一边”自然呈现按手与持续祝福同时进行。脚注标记已在正文中对应出现。
