  text: καὶ ἐμπαίξουσιν αὐτῷ καὶ ⸂ἐμπτύσουσιν αὐτῷ καὶ μαστιγώσουσιν αὐτὸν⸃ καὶ ⸀ἀποκτενοῦσιν, καὶ ⸂μετὰ τρεῖς ἡμέρας⸃ ἀναστήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/034.yaml
  text: And they will mock him[a], and spit on him, and flog him, and kill him, and after three days he will rise.
translation:
  language: zh_hans
  text: 他们要嘲弄他，往他身上吐唾沫，鞭打他，杀死他；三天以后[a]，他将复活。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“三天以后”；其他经文常用“第三天”来表达这一时间。
    reason: 说明马可原文的时间措辞及其与其他经文平行表述的关系，避免在正文或脚注中无声地协调不同说法。
lexical_decisions:
- source_word: ἐμπαίξουσιν
  choice: 嘲弄
  rationale: 表达带有轻蔑和侮辱意味的戏弄，比口语化的“取笑”更能体现这里的敌意，同时仍是现代汉语常用词。
- source_word: ἐμπτύσουσιν αὐτῷ
  choice: 往他身上吐唾沫
  rationale: 自然、明确地表达唾沫直接吐向他、以此羞辱他的动作；比“向他吐唾沫”更清楚地传达行为落在他身上。
- source_word: μαστιγώσουσιν
  choice: 鞭打
  rationale: 准确表达以鞭施行的严厉责打，适合司法暴力的语境，也比古雅的措辞更便于现代读者理解。
- source_word: ἀποκτενοῦσιν
  choice: 杀死
  rationale: 直接对应“杀死”，不额外加入“处死”的司法含义或“谋杀”的道德定性。
- source_word: μετὰ τρεῖς ἡμέρας
  choice: 三天以后
  rationale: 直接保留 μετά 加宾格通常表示的“……以后”，不在正文中协调为其他福音书常见的“第三天”。
- source_word: ἀναστήσεται
  choice: 他将复活
  rationale: 该将来时中间形式在此自然表达不及物的“起来、复活”；“复活”在死亡语境中清楚自然，又不改成被动的“被复活”，也不添加原文没有明说的“再次”。
theological_decisions:
- issue: 复活的语态
  choice: 他将复活
  alternative: 他将被复活；他将再次复活
  rationale: ἀναστήσεται 在本句中自然作不及物理解。译作“复活”保留本节自身的表达方式，同时不否定新约其他经文所说上帝使耶稣复活；原文没有单独表达“再次”，故不增译。
- issue: 复活时间的表述
  choice: 三天以后
  alternative: 第三天；三天之内
  rationale: 忠实保留马可此处 μετὰ τρεῖς ἡμέρας 的字面时序表达，不为消除与其他经文措辞之间的张力而在正文中加以协调。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。连续四个动作保留原文的递进节奏，分号突出死亡与复活之间的转折。脚注标记置于其实际说明的“三天以后”之后。
