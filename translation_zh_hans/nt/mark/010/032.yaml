  text: Ἦσαν δὲ ἐν τῇ ὁδῷ ἀναβαίνοντες εἰς Ἱεροσόλυμα, καὶ ἦν προάγων αὐτοὺς ὁ Ἰησοῦς, καὶ ἐθαμβοῦντο, ⸂οἱ δὲ⸃ ἀκολουθοῦντες ἐφοβοῦντο. καὶ παραλαβὼν πάλιν τοὺς δώδεκα ἤρξατο αὐτοῖς λέγειν τὰ μέλλοντα αὐτῷ συμβαίνειν
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/032.yaml
  text: They were on the road[a], going up to Jerusalem, and Jesus was going ahead of them; and they were astonished, while those who were following were afraid. And taking the Twelve aside again[b], he began to tell them the things that were about to happen to him.
translation:
  language: zh_hans
  text: 他们在路上[a]，正上耶路撒冷去。耶稣走在他们前面[b]；他们感到惊异，跟在后面的人却害怕。耶稣又把十二人带到一旁，开始告诉他们将要发生在他身上的事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在途中”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“在他们前头走”；这里不一定特别强调“带领”。
    reason: lexical_clarification
lexical_decisions:
- source_word: ἐν τῇ ὁδῷ
  choice: 在路上
  rationale: 保留具体的行路场景，同时用现代汉语自然表达；“在途中”也是可能的译法。
- source_word: ἀναβαίνοντες εἰς Ἱεροσόλυμα
  choice: 正上耶路撒冷去
  rationale: “上耶路撒冷”既反映地势，也保留前往圣城的传统表达；“正”体现分词所描写的进行状态。
- source_word: προάγων αὐτούς
  choice: 走在他们前面
  rationale: 直接表达耶稣在队伍前方行走的位置，不额外断定这里着重于“带领”。
- source_word: ἐθαμβοῦντο
  choice: 感到惊异
  rationale: 表达强烈的惊讶和困惑，但不把语气加重为“惊骇”；与下文的“害怕”保持词义区别。
- source_word: οἱ δὲ ἀκολουθοῦντες
  choice: 而那些跟随的人
  rationale: 保留分词结构所指的群体，不擅自把他们限定为十二门徒或另一类特定人物。
- source_word: ἐφοβοῦντο
  choice: 却害怕
  rationale: 直接传达持续的惧怕反应，并以“却”体现前后两种情绪的对照。
- source_word: παραλαβὼν ... τοὺς δώδεκα
  choice: 把十二门徒带到一旁
  rationale: 结合语境表达耶稣把十二人带在身边、单独教导他们的动作；“十二门徒”是现代读者易懂的惯用称呼。
- source_word: πάλιν
  choice: 又
  rationale: 自然表达动作再次发生。
- source_word: ἤρξατο αὐτοῖς λέγειν
  choice: 开始告诉他们
  rationale: 保留“开始”的起始体意义，并按现代汉语习惯表达向对象讲述内容。
- source_word: τὰ μέλλοντα αὐτῷ συμβαίνειν
  choice: 将要发生在他身上的事
  rationale: 保留事件即将发生及以耶稣为承受者的含义，不额外加入“命定”或专指受难的解释。
theological_decisions:
- issue: 叙事中两组人的情绪区别
  choice: 分别译为“感到惊异”和“害怕”
  alternative: 把两者笼统译成相近的惊惧反应
  rationale: 原文使用两个不同动词，并在叙事上区分前一组“他们”和“那些跟随的人”；译文保留这种张力，不把两种反应调和为同一种情绪。
- issue: 耶稣走在前面的叙事含义
  choice: 译作“走在他们前面”
  alternative: 译作“带领他们”
  rationale: 原文明确描写位置和行进动作，但是否强调领队作用并不完全确定，因此采用较少解释性的表达。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“上耶路撒冷去”保留圣经旅行语境中的传统说法；全句避免添加原文没有的开篇时间副词。
