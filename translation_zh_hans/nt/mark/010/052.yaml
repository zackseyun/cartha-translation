  text: ⸂καὶ ὁ⸃ Ἰησοῦς εἶπεν αὐτῷ· Ὕπαγε, ἡ πίστις σου σέσωκέν σε. καὶ ⸀εὐθὺς ἀνέβλεψεν, καὶ ἠκολούθει ⸀αὐτῷ ἐν τῇ ὁδῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/052.yaml
  text: And Jesus said to him[a], “Go[c][b]; your faith has saved you.” And immediately he regained his sight and followed him on the road.
translation:
  language: zh_hans
  text: 耶稣对他说：“去吧！你的信心[c]救了你[a]。”他立刻恢复了视力，继续跟随耶稣走在路上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “救了你”也可译作“医好了你”或“使你康复了”。原文动词既可指医治，也可指拯救。
    reason: lexical_alternative
  - marker: b
    text: “走在路上”也可译作“在途中”。
    reason: lexical_alternative
  - marker: c
    text: 这里的“信心”也可表达为“信靠”。
    reason: alternative_reading
lexical_decisions:
- source_word: Ὕπαγε
  choice: 去吧
  rationale: 准确表达离开的命令；“吧”使现代汉语语气自然，并未加入原文没有的“走你的路”等含义。
- source_word: πίστις
  choice: 信心
  rationale: 在本段指这人对耶稣的信靠。“信心”保留新约中的重要用词，同时以脚注说明“信靠”也是合适的表达。
- source_word: σέσωκέν
  choice: 救了
  rationale: σῴζω在此既可指医治、康复，也可指更广义的拯救。正文采用“救了”，以保留肉身得医治与更完整救恩之间的语义张力。
- source_word: εὐθύς
  choice: 立刻
  rationale: 自然传达马可叙事中常见的紧迫、明快节奏。
- source_word: ἀνέβλεψεν
  choice: 恢复了视力
  rationale: 在盲人得医治的语境中，该动词表示重新看见；此译法比字面化的“抬头看”准确清楚。
- source_word: ἠκολούθει
  choice: 跟随
  rationale: 未完成时态描写持续进行的跟随；现代汉语中的“在路上跟随”可自然呈现其延续性，无须使用生硬的进行体。
- source_word: ἐν τῇ ὁδῷ
  choice: 在路上
  rationale: 既保留具体行路的场景，也不排除马可叙事中“道路”可能具有的门徒之路意味。
- source_word: αὐτῷ
  choice: 耶稣
  rationale: 原文为代词“他”；汉语若连续使用“他”容易误指刚恢复视力的人，因此按明确所指复现“耶稣”，不改变原意。
theological_decisions:
- issue: 耶稣宣告中σῴζω的含义
  choice: 救了你
  alternative: 医好了你／使你康复了
  rationale: 上下文明确叙述视力恢复，但原文动词的范围也包括拯救。采用较宽的“救了你”，避免把耶稣的话限定为肉身医治，同时以脚注交代医疗含义。
- issue: πίστις在本节的表达
  choice: 信心
  alternative: 信靠
  rationale: 此处强调那人对耶稣的信赖。“信心”保留关键术语的一致性，“信靠”则在脚注中说明其具体语用含义。
- issue: ὁδός可能具有的双重意味
  choice: 路上
  alternative: 道路上／在这条道路上
  rationale: “路上”首先自然呈现耶稣一行的实际旅程，也没有排除跟随耶稣之道路这一潜在的门徒主题。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“去吧”简洁口语化但不随便；“恢复了视力”清楚说明医治结果；末句复现“耶稣”以消除汉语代词指向歧义。脚注标记均紧随其所解释的词语。
