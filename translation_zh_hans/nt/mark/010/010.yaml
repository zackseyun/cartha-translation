  text: Καὶ ⸂εἰς τὴν οἰκίαν⸃ πάλιν οἱ μαθηταὶ ⸂περὶ τούτου⸃ ⸀ἐπηρώτων αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/010.yaml
  text: And in the house again[b][a], the disciples were asking him about this.
translation:
  language: zh_hans
  text: 进了屋里，门徒又问他这件事。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文的“又”也可理解为修饰“进了屋里”，译作：“再次进了屋里，门徒问他这件事。”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: （不单独译出）
  rationale: 此处是承接前文的叙事连接词；汉语直接转入下一场景更自然，也保留了连续的叙事流程。
- source_word: εἰς τὴν οἰκίαν
  choice: 进了屋里
  rationale: εἰς本有进入某处的方向意味；“进了屋里”既贴近原文，也自然地表明场景从公开谈话转到屋内。原文只说“那屋子”，不宜擅自确定为家。
- source_word: πάλιν
  choice: 又
  rationale: 放在“问”前，最自然地理解为门徒再次询问；但原文词序也容许它与进屋的场景联系，因此以脚注保留另一种理解。
- source_word: οἱ μαθηταὶ
  choice: 门徒
  rationale: 定冠词指上下文中已知的门徒群体；汉语无需补出“他的”。
- source_word: περὶ τούτου
  choice: 这件事
  rationale: 指前文关于休妻的讨论；“这件事”自然、明确，同时不在正文中增添原文未明说的解释。
- source_word: ἐπηρώτων
  choice: 问
  rationale: 未完成时可描写持续或反复的询问，但现代汉语用“问”已能自然表达此叙事情景；“又”同时带出再次询问的意味，无需额外添加“开始”或“不断”。
- source_word: αὐτόν
  choice: 他
  rationale: 代词所指为耶稣；上下文清楚，按原文译作“他”，不重复专名。
theological_decisions:
- issue: πάλιν（又／再次）的修饰范围
  choice: 理解为门徒又问他
  alternative: 理解为他们再次进到屋里，随后门徒问他
  rationale: 就上下文而言，再次询问同一问题较顺畅；但希腊语词序没有完全排除“再次进屋”的理解，故不将另一读法静默排除，而在脚注中说明。
translation_notes:
  register: 采用简洁、庄重而自然的现代汉语。“进了屋里”保留εἰς的方向意味；避免把未完成时过度解释为“开始问”或“不断问”，并借脚注保留πάλιν修饰范围上的真实歧义。
