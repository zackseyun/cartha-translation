  text: ⸂καὶ προσκαλεσάμενος αὐτοὺς ὁ Ἰησοῦς⸃ λέγει αὐτοῖς· Οἴδατε ὅτι οἱ δοκοῦντες ἄρχειν τῶν ἐθνῶν κατακυριεύουσιν αὐτῶν καὶ οἱ μεγάλοι αὐτῶν κατεξουσιάζουσιν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/042.yaml
  text: And Jesus called them to himself and said to them[a], “You know that those who are considered rulers of the Gentiles lord it over them[b], and their great ones exercise authority over them.”
translation:
  language: zh_hans
  text: 耶稣叫他们过来，对他们说：“你们知道，那些被视为统治列国的人辖制列国；列国中居高位的人，也对列国行使权柄。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: 把他们叫到跟前
  rationale: 中间语态表示把人叫到自己这里；这一译法自然地保留了动作方向，也符合现代汉语叙事表达。
- source_word: λέγει
  choice: 对他们说
  rationale: 希腊文使用历史现在时；汉语叙事用“说”即可自然表达其话语功能，无须机械标明时态。
- source_word: Οἴδατε
  choice: 你们知道
  rationale: οἶδα虽为完成时形式，在这里具有现在时意义；“知道”直接、自然。
- source_word: οἱ δοκοῦντες ἄρχειν
  choice: 那些被视为统治者的人
  rationale: δοκέω在此可指“被认为、被视为”，不必暗示这些人只有表面权力；脚注保留“看似统治”的可能。
- source_word: τῶν ἐθνῶν
  choice: 列国
  rationale: ἔθνη既可泛指各国，也可从犹太语境指外族人。“列国”庄重而易懂，并由脚注说明另一种语境性译法。
- source_word: κατακυριεύουσιν
  choice: 辖制
  rationale: 该复合动词带有强势支配、作威作福的负面意味；“辖制”比中性的“统治”更能体现这一点。
- source_word: οἱ μεγάλοι αὐτῶν
  choice: 他们的权贵
  rationale: 指列国中有地位、有权势的人，并不限定某种正式官职；“权贵”简洁地传达社会与政治上的显要地位。
- source_word: κατεξουσιάζουσιν
  choice: 用权势管辖
  rationale: 表达行使权力并带有压制意味，同时与前一动词“辖制”保持一定区别，不把两个近义动词完全合并。
- source_word: αὐτῶν
  choice: 百姓
  rationale: 两处代词在语义上指列国统治之下的人。汉语若直译为“他们”容易误指统治者，因此以“百姓”明确所指，未改变关系结构。
theological_decisions:
- issue: τῶν ἐθνῶν的所指
  choice: 列国
  alternative: 外族人／非犹太人
  rationale: 马可福音的犹太语境容许“外族人”的理解，但本句同时描写各国的政治统治形态。“列国”保留群体与国家两方面的广度，脚注则保存语境中的族群含义。
- issue: δοκοῦντες的语气
  choice: 被视为统治者
  alternative: 看似统治者／似乎在统治的人
  rationale: 此处可以表示公众承认其统治地位，也可能含有“看似”的距离感。正文采用较中性的社会认定含义，不借翻译否认其实际权力；脚注保存另一可能。
- issue: 两个支配类动词的负面力度
  choice: 辖制……用权势管辖
  alternative: 作威作福……滥用权力
  rationale: 两个带κατα-前缀的动词都可能具有强势、压制色彩，但经文本身没有明确使用“滥用”一词。所选译法保留负面倾向，同时避免加入过强的道德判语。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。“叫到跟前”“辖制”“权贵”普通读者容易理解，又保持经文的严肃语气。为避免连续代词在汉语中产生歧义，将两处αὐτῶν按语义明确为“百姓”。
