review_pass:
  verdict: revise
  source_fidelity: 正文基本准确传达了耶稣召集门徒、对其讲话，以及外邦／列国权力结构的两重描述。可是两处 αὐτῶν 均以“百姓”处理，虽意在消除汉语代词歧义，却将原文较宽的“他们”（即列国／其中的人）具体化为受统治的百姓；应保留原文所指的广度。第二分句也宜更清楚地对应“他们中居高位的人”。
  naturalness: “耶稣叫他们过来”比“把他们叫到跟前”更自然简洁；以重复“列国”替代连续代词，可避免指代不清，同时不需要加入“百姓”。“行使权柄”是现代汉语中庄重且通顺的表达。
  terminology: “辖制”恰当反映 κατακυριεύουσιν 的强势、压制意味；“居高位的人”可表达 οἱ μεγάλοι 而不不当地限定为特定官职。“列国”可保留；脚注应将不够准确、易带负面或民族学含义的“外族人”改为较常用且贴合语境的“外邦人”，并保留“非犹太人”说明。
  issues:
  - severity: medium
    issue: 两处 αὐτῶν 译为“百姓”
    rationale: 原文的代词指向列国／其成员，并未明说“百姓”或仅指被统治阶层。“百姓”缩窄了所指，并在第二句弱化了“他们中居高位者”的并列结构。
  - severity: low
    issue: 脚注 a 的“外族人”措辞
    rationale: 就此犹太语境，τῶν ἐθνῶν 可指“外邦人”或“非犹太人”；“外族人”在现代汉语中不够稳定，也可能引入不必要的民族学联想。
  revised_text: 耶稣叫他们过来，对他们说：“你们知道，那些被视为统治列国的人辖制列国；列国中居高位的人，也对列国行使权柄。”
  revised_footnotes:
  - marker: a
    text: “列国”也可译作“外邦人”或“非犹太人”。
    reason: lexical_alternative
  - marker: b
