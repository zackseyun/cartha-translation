revisions:
- from: 耶稣把他们叫到跟前，对他们说：“你们知道，列国[a]中那些被视为统治者的人[b]辖制百姓，他们的权贵也用权势管辖百姓。”
  to: 耶稣叫他们过来，对他们说：“你们知道，那些被视为统治列国的人辖制列国；列国中居高位的人，也对列国行使权柄。”
  rationale: 修订保留“列国”对 τῶν ἐθνῶν 的可行主译及其脚注替代义，并保持 δοκοῦντες 的“被视为”与“看似”两种可能。将“百姓”改回“列国”，避免把 αὐτῶν 过度具体化；以“列国中居高位的人”呈现 οἱ μεγάλοι αὐτῶν 的关系，以“行使权柄”对应 κατεξουσιάζουσιν。
