  text: And when the ten heard it[a], they began to be indignant with James and John.
translation:
  language: zh_hans
  text: 那十人听见了，就开始对雅各和约翰[a]感到愤慨。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因雅各和约翰而感到愤慨。”希腊语介词可表示他们愤慨所针对的对象，也可表示引发愤慨的缘由。
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: （以“就”承接）
  rationale: 作为叙事连接词，结合前置的时间从句，以“就”自然承接事件进展，不额外强化严格的时间先后。
- source_word: ἀκούσαντες
  choice: 听见后
  rationale: 不定过去时分词表示相对于主句动作在先；汉语用“听见后”简洁自然。原文未明说听见的宾语，汉语也无需补出“这事”。
- source_word: οἱ δέκα
  choice: 那十个人
  rationale: 直译为“那十个”；语境虽表明是另外十个门徒，原文却没有“另外”或“门徒”，因此正文不予增补。汉语以量词“个人”使表达完整。
- source_word: ἤρξαντο
  choice: 开始
  rationale: 保留ἄρχομαι与不定式结构所表达的起始意义。
- source_word: ἀγανακτεῖν
  choice: 感到愤慨
  rationale: 该词表示强烈不满或义愤式的恼怒；“感到愤慨”既保留情绪强度，也比单纯“生气”更贴近词义。
- source_word: περὶ Ἰακώβου καὶ Ἰωάννου
  choice: 对雅各和约翰
  rationale: περί在情绪反应动词后可标示情绪所针对的对象，也可标示引发情绪的缘由。正文采用自然的对象表达，并以脚注保留另一种理解。
- source_word: Ἰακώβου
  choice: 雅各
  rationale: 采用现代中文圣经语境中通行的人名译法。
- source_word: Ἰωάννου
  choice: 约翰
  rationale: 采用现代中文圣经语境中通行的人名译法。
