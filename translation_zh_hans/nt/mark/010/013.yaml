source:
  edition: SBLGNT
  text: Καὶ προσέφερον αὐτῷ παιδία ἵνα ⸂αὐτῶν ἅψηται⸃· οἱ δὲ μαθηταὶ ⸂ἐπετίμησαν αὐτοῖς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/013.yaml
  text: And they were bringing children to him so that he might touch them[a], but the disciples rebuked them.
translation:
  language: zh_hans
  text: 有人不断把孩子带到耶稣那里，要他摸他们[a]，可是门徒却斥责那些人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “孩子”也可译作“年幼的孩子”。希腊语παιδία可泛指儿童，也包括年幼的孩子。
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέφερον
  choice: 不断把……带到
  rationale: 未完成时描写过去持续或反复发生的动作；“不断”自然地保留这一体貌，而“带到……那里”表达把人带到某人面前的意思。
- source_word: παιδία
  choice: 孩子
  rationale: 该词可广泛指儿童，也可包括年幼的孩子；“孩子”在现代汉语中自然、清楚，又不把年龄范围限定得过窄。
- source_word: ἵνα αὐτῶν ἅψηται
  choice: 要他摸他们
  rationale: ἵνα加虚拟式表示目的；ἅπτομαι的直接含义是“触摸”。此译法不从平行经文引入“按手”等原文未明说的动作。
- source_word: ἐπετίμησαν
  choice: 斥责
  rationale: 表达严厉责备的力度，比口语化的“说了他们”更准确，也符合庄重而现代的叙事语体。
- source_word: αὐτοῖς
  choice: 那些人
  rationale: 代词最自然地指前面把孩子带来的人。汉语若只译作“他们”，容易被理解为孩子，因此用“那些人”明确所指。
- source_word: δὲ
  choice: 可是
  rationale: 表示带孩子来与门徒反应之间的轻微转折；“可是”在现代叙事中自然地传达这一对比。
theological_decisions:
- issue: 门徒斥责的对象
  choice: 把孩子带来的人
  alternative: 孩子们
  rationale: 从句法和叙事衔接看，αὐτοῖς最合理地回指προσέφερον所隐含的复数主语，即带孩子来的人，而不是作宾语的孩子。
translation_notes:
  register: 采用自然、庄重的现代标准普通话。“耶稣”补明原文代词“他”的所指，使单节独立阅读时清楚；后文仍用“他”。“不断”保留未完成时的持续或反复意味；用“那些人”避免两个“他们”造成指代歧义。
