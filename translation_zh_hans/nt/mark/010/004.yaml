base_translation:
  language: en
  yaml_path: translation/nt/mark/010/004.yaml
  text: They said[b][a], “Moses permitted us to write a certificate of divorce and send her away.”
translation:
  language: zh_hans
  text: 他们说：“摩西准许人写休书[a]，并休妻[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “休书”指具有法律效力的离婚文书。也可译作“离婚证书”。
    reason: lexical_alternative
  - marker: b
    text: “休妻”原文直译为“遣走她”，在这里指与妻子离婚。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: 他们说
  rationale: 定冠词作名词用，指上文的法利赛人；δέ在此表示叙事承接或轻微对照，现代汉语无需另译“而”或“但”。
- source_word: Ἐπέτρεψεν
  choice: 准许
  rationale: ἐπιτρέπω表示允许、准许；“准许”保留法律语境，也维持下文“准许”与“吩咐”之间的重要区别。
- source_word: Μωϋσῆς
  choice: 摩西
  rationale: 采用现代中文圣经与通行用法中的标准人名译法。
- source_word: βιβλίον ἀποστασίου
  choice: 休书
  rationale: 该词组指申命记24:1所说具有法律效力的离婚文书；“休书”简洁自然，并在脚注中说明其法律文书性质。
- source_word: γράψαι
  choice: 写
  rationale: γράψαι直接表示“写”；不增译为“起草”，以免过度限定。
- source_word: καὶ ἀπολῦσαι
  choice: 就可以休妻
  rationale: ἀπολύω在婚姻语境中指遣走妻子，即离婚。“休妻”清楚表达语境中的法律行为；“妻”由上下文补出，希腊文没有明说宾语。καί在这组获准采取的连续行动中自然译作“就可以”。
theological_decisions:
- issue: 摩西有关离婚规定的性质
  choice: 摩西“准许”离婚
  alternative: 摩西“吩咐”人写休书并离婚
  rationale: 原文Ἐπέτρεψεν明确表示准许，而非命令。此区别关系到紧接下来的论述：耶稣把这项规定说明为因人心刚硬而作出的容许，并与上帝创造时的旨意形成张力。
- issue: ἀπολῦσαι的表达方式
  choice: 正文译为“休妻”，脚注保留字面意象“让她离去”
  alternative: 正文直译为“让她离去”
  rationale: 婚姻语境使该动词具有离婚含义；正文采用现代读者能直接理解的法律行为表达，同时以脚注保存其字面措辞，避免抹去原文意象。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“休书”和“休妻”在中文中略带传统法律色彩，但含义清楚，适合对应本节的犹太法律语境；脚注提供现代释义并保留原文字面表达。
