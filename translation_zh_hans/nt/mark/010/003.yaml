base_translation:
  language: en
  yaml_path: translation/nt/mark/010/003.yaml
  text: But he answered them, “What did Moses command you?”
translation:
  language: zh_hans
  text: 耶稣回答他们：“摩西吩咐你们什么？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: （不单独译出）
  rationale: δέ在此是轻微的叙事连接词。现代汉语接续上文时无需机械译作“但”或“于是”；省略可使对话自然，也不损失实质意义。
- source_word: ἀποκριθεὶς εἶπεν
  choice: 回答……说
  rationale: 这一常见组合表达回应并发言。汉语“回答他们说”自然保留了回应的语气，也避免生硬地逐词译成“回答着说”。
- source_word: αὐτοῖς
  choice: 他们
  rationale: 作为“回答”的对象，译作“回答他们”符合现代汉语习惯。
- source_word: Τί
  choice: 什么
  rationale: 疑问代词询问摩西命令的内容，译作“什么”准确自然。
- source_word: ὑμῖν
  choice: 你们
  rationale: 复数第二人称是命令的接受者；“吩咐你们什么”自然体现与格关系。
- source_word: ἐνετείλατο
  choice: 吩咐
  rationale: 该词指带权威的命令或指示。“吩咐”在此兼具权威性和自然度，比“命令”稍显自然，又没有弱化为一般性的“教导”。
- source_word: Μωϋσῆς
  choice: 摩西
  rationale: 采用现代中文圣经及一般文化中通行的人名译法。
- source_word: ὁ
  choice: 耶稣
  rationale: 希腊文用阳性代词性冠词结构承接上文，实际主语是耶稣。中文若仅译“他”也可，但在单节独立呈现时明确译出“耶稣”更清楚，且未增添原文语境之外的信息。
theological_decisions:
- issue: 耶稣回答中对摩西权威的提法
  choice: 保留“摩西”作为吩咐者，不扩写为“摩西的律法”或“上帝借摩西”。
  alternative: “摩西的律法吩咐你们什么？”或“上帝借着摩西吩咐你们什么？”
  rationale: 原文明确点名摩西，却没有在本句解释摩西与上帝或律法的关系。直译这一表述可保留文本本身的神学张力，避免加入解释。
translation_notes:
  register: 采用现代、庄重而口语自然的问答表达。“回答他们说”保留原文回应结构；“吩咐”适合律法讨论的权威语境。无脚注。
