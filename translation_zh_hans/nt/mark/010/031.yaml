  text: πολλοὶ δὲ ἔσονται πρῶτοι ἔσχατοι καὶ ⸀οἱ ἔσχατοι πρῶτοι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/031.yaml
  text: But many who are first will be last[a], and the last first.
translation:
  language: zh_hans
  text: 但许多在前的，将要在后[a]；在后的，将要在前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“但许多居首位的人将要成为末后的，末后的人将要成为居首位的。”
    reason: 词义表达的另一种较明确译法；补出“人”并用“居首位／末后”凸显这里可能涉及地位或次序。
lexical_decisions:
- source_word: πολλοὶ
  choice: 许多
  rationale: 该形容词在此作名词性用法，泛指许多人，但并非每一个人。“许多”简洁自然，也保留了范围的开放性。
- source_word: δὲ
  choice: 但
  rationale: δέ在上下文中带有温和的转折意味；“但”既承接上一节，也引出次序逆转的原则。
- source_word: ἔσονται
  choice: 将要
  rationale: 这是εἰμί的将来时形式；与后面的“在后／在前”连用，能以现代汉语自然表达将来的状态。
- source_word: πρῶτοι
  choice: 在前的／在前
  rationale: πρῶτος在这里主要指地位或次序居前。“在前”保留了简洁的比照关系，也避免把含义限定为某一种社会或宗教身份。
- source_word: ἔσχατοι
  choice: 在后的／在后
  rationale: ἔσχατος与πρῶτος形成直接对照，表示地位或次序居后；“在后”保留了原文的反转格言形式。
- source_word: οἱ ἔσχατοι
  choice: 在后的
  rationale: 冠词使该短语具有名词性，指那些处于后位的人。汉语用“在后的”即可自然表达，无须在正文中补出“人”。
- source_word: καὶ
  choice: ；
  rationale: καί连接格言中彼此平行的两半。汉语用分号比直译为“和”更自然，并清楚呈现对称结构而不增加解释。
theological_decisions:
- issue: 次序逆转之言的性质
  choice: 译作普遍而开放的末后逆转原则，不具体限定“在前”与“在后”所指的群体。
  alternative: 将其专指富人与穷人、门徒与外人，或理解为毫无例外地适用于每一个人的绝对规则。
  rationale: 本节以悖论式格言陈述广泛原则，但没有在句内穷尽这些类别的具体所指。译文因此保留原文的简练与神学张力，不缩窄为单一应用。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。正文保留“在前／在后”的对称与简洁；逗号标示名词性短语后的停顿，分号呈现两半的平行反转。
