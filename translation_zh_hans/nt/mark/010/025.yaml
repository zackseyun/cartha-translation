  text: εὐκοπώτερόν ἐστιν κάμηλον διὰ ⸂τῆς τρυμαλιᾶς τῆς⸃ ῥαφίδος ⸀διελθεῖν ἢ πλούσιον εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/025.yaml
  text: It is easier for a camel to go through the eye of a needle than for a rich man to enter the kingdom of God[a][b][c].
translation:
  language: zh_hans
  text: 骆驼穿过针眼，比富人进入上帝的国还容易。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有人提出这里应作“粗绳”，但本节希腊正文是“骆驼”。
    reason: alternative_reading
  - marker: b
    text: “针眼”指缝衣针的孔眼；原文没有提到一座名为“针眼”的城门。
    reason: cultural_note
lexical_decisions:
- source_word: εὐκοπώτερόν
  choice: 还容易
  rationale: 比较级意为“更容易”；用“比……还容易”自然地保留原文鲜明的夸张比较。
- source_word: κάμηλον
  choice: 骆驼
  rationale: SBLGNT正文为κάμηλος，即“骆驼”；不采用缺乏本节正文支持的“粗绳”说。
- source_word: διὰ τῆς τρυμαλιᾶς τῆς ῥαφίδος
  choice: 穿过针眼
  rationale: 指缝衣针的孔眼；“针眼”是现代汉语中准确、自然的说法。
- source_word: διελθεῖν
  choice: 穿过
  rationale: διέρχομαι在此表示从孔眼中通过，“穿过”贴合具体意象。
- source_word: πλούσιον
  choice: 富人
  rationale: 阳性单数形容词名词化，泛指一个富有的人；汉语“富人”自然，并保留代表性而不额外限定为某一男子。
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελθεῖν
  choice: 进入上帝的国
  rationale: 准确表达“进入”以及福音书核心用语“上帝的国”，句式简洁自然。
theological_decisions:
- issue: 骆驼与针眼意象的解释
  choice: 保留骆驼穿过真实针眼这一强烈的夸张意象
  alternative: 解释为骆驼通过所谓耶路撒冷的“针眼门”，或把“骆驼”改作“粗绳”
  rationale: 希腊正文呈现骆驼与缝衣针孔眼的鲜明对照，突出近乎不可能；译文不引入正文没有依据的后期解释，也不削弱这句话的张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“骆驼穿过针眼”保留原文的具体画面；“比……还容易”清楚呈现比较结构。中文名词不标语法性别，因此不另加“男人”，以免造成原文所无的排他意味。
