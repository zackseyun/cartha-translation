  yaml_path: translation/nt/mark/010/020.yaml
  text: And he said to him, “Teacher, I have kept all these things from my youth.”
translation:
  language: zh_hans
  text: 他对耶稣说：“老师，这一切我从年轻时起都遵守了。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ ἔφη αὐτῷ
  choice: 他对耶稣说
  rationale: ἔφη是普通的叙事性言说动词，译为“说”自然准确；αὐτῷ按上下文明确为耶稣，在中文中补出所指可避免代词连用造成含混。δέ在此是轻微的叙事连接，中文无需另译连接词。
- source_word: Διδάσκαλε
  choice: 老师
  rationale: 这是διδάσκαλος的呼格，指教导人的人；“老师”是现代汉语中自然、直接的称呼，也避免“夫子”或“主公”等带来的古雅或额外权威色彩。
- source_word: ταῦτα πάντα
  choice: 这一切……都
  rationale: 以“这一切……都”的呼应结构自然表达指示代词与πᾶς的总体意义，所指是上文列出的诫命。
- source_word: ἐφυλαξάμην
  choice: 遵守了
  rationale: φυλάσσω用于诫命时表示持守、遵行；“遵守”符合现代汉语搭配。希腊语不定过去时概括从年轻时至今的行为，句中的“从……时就”使持续至当前语境的意义清楚。
- source_word: ἐκ νεότητός μου
  choice: 从年轻时就
  rationale: ἐκ加属格标明时间起点；νεότης是青年、年轻时期，不宜过度具体化为“小时候”。“从……时就”在中文中自然表达自该时期开始。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“老师”保留原文普通称谓的语义；“遵守”准确体现诫命语境。未添加脚注，因为本节没有必须向读者标示的文本或语义歧义。
