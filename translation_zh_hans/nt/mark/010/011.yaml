- from: 他对他们说：“凡休妻另娶的，就是对妻子犯奸淫。”
  to: 他对他们说：“谁若与妻子离婚，又娶别的女人，就是犯奸淫，得罪了她。”
  rationale: 修订采用现代标准普通话的“与妻子离婚”，明确译出“又娶别的女人”，并以“得罪了她”自然保留ἐπ’ αὐτήν所强调的对前妻的冒犯。未添加原文没有的法律、伦理或教义限定。
