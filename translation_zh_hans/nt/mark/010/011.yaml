review_pass:
  verdict: revise
  source_fidelity: 草稿准确传达了离婚、再娶及“对她”所犯之罪的基本意义。不过，“休妻”带有较强的传统单方弃妻色彩，虽可指涉古代婚姻实践，却不是现代标准普通话中最自然、最中性的法律／关系表达；且“对妻子”最好明确回指被离的妻子。
  naturalness: “凡休妻另娶的”简洁但文言色彩较浓，且“的”后的“就是”略显凝缩。改为“谁若与妻子离婚，又娶别的女人”更符合现代普通话，同时保留格言式的庄重语体。
  terminology: “犯奸淫”是恰当且庄重的固定圣经用语。“别的女人”明确译出阴性ἄλλην；“得罪了她”以自然汉语表达ἐπ’ αὐτήν所表示的对前妻的冒犯，而不把它误作单纯的通奸对象。
  issues:
  - severity: medium
    issue: “休妻”在现代普通话中的语体和语义不够中性
    rationale: 该词具有传统、单方弃妻的强烈色彩。原文在此婚姻语境确指离婚，但现代译文以“与妻子离婚”表达更自然，也避免不必要地将古代法律程序具体化。
  - severity: low
    issue: “对妻子”未明确其为被离之妻，且搭配略显生硬
    rationale: ἐπ’ αὐτήν回指前句的“妻子”。用“得罪了她”能以自然现代汉语保留该行为针对、伤害她的意思。
  revised_text: 他对他们说：“谁若与妻子离婚，又娶别的女人，就是犯奸淫，得罪了她。”
