  text: καὶ λέγει αὐτοῖς· Ὃς ⸀ἂν ἀπολύσῃ τὴν γυναῖκα αὐτοῦ καὶ γαμήσῃ ἄλλην μοιχᾶται ἐπ’ αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/011.yaml
  text: And he says to them[a], “Whoever divorces his wife and marries another commits adultery against her.”
translation:
  language: zh_hans
  text: 他对他们说：“谁若与妻子离婚，又娶别的女人，就是犯奸淫，得罪了她。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: 说
  rationale: 采用汉语叙事中自然的“说”，既可承接马可常用的历史现在时，也不生硬复制希腊语时态形式。
- source_word: αὐτοῖς
  choice: 对他们
  rationale: 准确表达与格代词所指的受话者。
- source_word: Ὃς ἂν
  choice: 凡……的
  rationale: 表达带ἄν的不定关系结构所具有的普遍条件意义，在现代汉语中简洁自然。
- source_word: ἀπολύσῃ
  choice: 休妻
  rationale: 在婚姻语境中指解除婚姻关系；“休妻”简洁明确，并与后文“另娶”形成自然搭配。
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: 妻
  rationale: γυνή在离婚及所属关系的语境中明确指妻子；汉语“休妻”已包含其为自己的妻子之意。
- source_word: γαμήσῃ ἄλλην
  choice: 另娶
  rationale: ἄλλην为阴性，意为另一个女人；“另娶”在汉语中自然包含另娶别的女人之义。
- source_word: μοιχᾶται
  choice: 犯奸淫
  rationale: 这是该动词在婚姻不忠语境中的标准、清楚且庄重的表达。
- source_word: ἐπ’ αὐτήν
  choice: 对妻子
  rationale: 保留ἐπί短语所表达的针对性，表明这一行为是对原妻所犯的过错；重复“妻子”比仅用“她”更清楚。
theological_decisions:
- issue: 是否保留ἐπ’ αὐτήν所强调的对妻子的侵犯
  choice: 译为“对妻子犯奸淫”
  alternative: 只译“犯奸淫”，或译“与另一个女人犯奸淫”
  rationale: 原文明确保留这一介词短语；译出“对妻子”可避免抹平经文所强调的关系性伤害。
- issue: Ὃς ἂν的泛指范围
  choice: 译为“凡……的”
  alternative: 译为“任何男人若……”
  rationale: 该结构提出一般原则，而上下文中的“休妻”“另娶”已经表明此处具体谈论丈夫，无须额外添加“男人”。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。保留简洁的格言式句法；“休妻”“另娶”“犯奸淫”均为现代读者熟悉的圣经及婚姻伦理用语，同时准确反映原文。
