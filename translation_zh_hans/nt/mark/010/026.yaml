  text: οἱ δὲ περισσῶς ἐξεπλήσσοντο λέγοντες πρὸς ⸀ἑαυτούς· Καὶ τίς δύναται σωθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/026.yaml
  text: And they were exceedingly astonished[a], saying to one another, “Then who can be saved?”
translation:
  language: zh_hans
  text: 他们极其惊讶，彼此说：“这样，谁能得救呢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ
  choice: 他们
  rationale: 冠词指回上下文中的门徒；中文省去生硬的连接词，使叙事自然衔接。
- source_word: περισσῶς
  choice: 越发
  rationale: 在上下文中表达惊讶程度进一步加深，也保留该副词可有的“更加”意味。
- source_word: ἐξεπλήσσοντο
  choice: 惊讶
  rationale: 传达强烈震惊；与“越发”连用，既自然又保留原文的强调。
- source_word: λέγοντες πρὸς ἑαυτούς
  choice: 彼此说
  rationale: 复数交谈语境中的反身代词具有相互意义；译为“彼此说”比直译“对自己说”更符合现代汉语。
- source_word: Καὶ τίς
  choice: 这样，谁
  rationale: 此处 καί承接耶稣先前的话而引出推论；“这样”自然表达“既然如此”的结果意味，同时不把逻辑关系说得过满。
- source_word: δύναται σωθῆναι
  choice: 能得救
  rationale: 保留能力或可能性的提问，并以“得救”承载本段关于进入神国的救恩含义。
theological_decisions:
- issue: σωθῆναι在上下文中的救恩含义
  choice: 得救
  alternative: 获救／蒙拯救
  rationale: 上下文讨论进入神的国，因此这里不只是脱离一般危险；“得救”保留其神学和末世性的分量，又不额外界定得救的具体机制。
- issue: 门徒问题的推论语气
  choice: 这样，谁能得救呢？
  alternative: 那么，谁还能得救呢？
  rationale: “这样”表达由前文引出的推论；不加入原文没有明确对应词的“还”，避免强化为绝对无人可能得救。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“越发惊讶”简明表达 περισσῶς 的强化作用；“彼此说”符合群体交谈语境。问句末用“呢”呈现震惊和追问语气，不增加实质内容。
