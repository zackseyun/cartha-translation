  text: καὶ ἀκούσας ὅτι Ἰησοῦς ὁ ⸀Ναζαρηνός ἐστιν ἤρξατο κράζειν καὶ λέγειν· ⸀Υἱὲ Δαυὶδ Ἰησοῦ, ἐλέησόν με.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/047.yaml
  text: And when he heard that it was Jesus the Nazarene[a], he began to cry out and say, “Jesus, Son of David, have mercy on me!”
translation:
  language: zh_hans
  text: 他一听说是拿撒勒人耶稣[a]，就开始呼喊说：“大卫之子耶稣，怜悯我吧！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“拿撒勒的耶稣。”希腊文作“耶稣，这位拿撒勒人”，保留的是称号式的表达，而非较明确的地理说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: 他听见
  rationale: 将先于主句动作的不定过去时分词自然地译为时间背景，保留动作次序。
- source_word: Ναζαρηνός
  choice: 拿撒勒人
  rationale: 原词是带有称号性质的形容词，而不是更明确的地理短语“来自拿撒勒”；“拿撒勒人”在现代汉语中自然，也较好保留原文称号形式。
- source_word: ἤρξατο κράζειν καὶ λέγειν
  choice: 就开始高声喊着说
  rationale: 保留“开始”的起始含义，并用“高声喊着说”体现两个不定式及马可的叙述风格。
- source_word: κράζειν
  choice: 高声喊
  rationale: 表达公开、急切而响亮的呼求，不额外暗示愤怒。
- source_word: Υἱὲ Δαυὶδ
  choice: 大卫之子
  rationale: 保留原文的直接称呼和王室—弥赛亚意味，不弱化为单纯的血统说明。
- source_word: ἐλέησόν με
  choice: 可怜我吧
  rationale: 自然表达向耶稣发出的迫切怜悯之求；“吧”使汉语祈求语气自然，而不削弱其郑重性。
- source_word: Ἰησοῦ
  choice: 耶稣
  rationale: 采用现代中文圣经传统中通行的人名译法。
theological_decisions:
- issue: “大卫之子”的弥赛亚含义
  choice: 正文保留“大卫之子”，作为对耶稣的称号和直接称呼。
  alternative: 译作“大卫的后裔”。
  rationale: 在马可叙事中，这一称呼具有王室和弥赛亚意味；直译能够保留其神学张力，不将其压缩成纯粹的家谱陈述。
- issue: Ναζαρηνός的表达
  choice: 译作“拿撒勒人”。
  alternative: 译作“拿撒勒的耶稣”或“来自拿撒勒的耶稣”。
  rationale: 原文使用称号式形容词，正文尽量保留这一形式；脚注提供更明确的地理表达。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“高声喊着说”保留马可略显重复的叙述节奏；“大卫之子”保留传统称号的辨识度和神学分量。
