  text: and the two will become one flesh. So they are no longer two[a], but one flesh.
translation:
  language: zh_hans
  text: “二人将成为一体[a]。”因此，他们不再是两个人，而是一体。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“二人将归于一体。”
    reason: 说明原文εἰς σάρκα μίαν所含的趋向／结果结构，同时避免将固定的婚姻表达误解为进入某一个人的肉身。
lexical_decisions:
- source_word: ἔσονται
  choice: 将成为
  rationale: 虽然ἔσονται本义为“将是”，但与εἰς及宾格表语连用时表示达到一种结果状态；“将成为”自然传达二人结合为一的含义。
- source_word: οἱ δύο
  choice: 二人
  rationale: 保留原文明确的数目概念，并与下文“不再是两个人”形成呼应。
- source_word: εἰς σάρκα μίαν
  choice: 成为一体
  rationale: “一体”是现代汉语中自然、庄重的圣经婚姻用语，既表达结合的结果，也保留与《创世记》引文的联系；脚注注明较直译的表达。
- source_word: ὥστε
  choice: 这样
  rationale: 在这里引出由前句所得的结果或推论；“这样”符合现代汉语表达，并保持逻辑衔接。
- source_word: οὐκέτι
  choice: 不再
  rationale: 准确表达先前状态已经终止。
- source_word: ἀλλὰ μία σάρξ
  choice: 而是一体了
  rationale: 保留原文从“二”到“一”的鲜明对照；句末“了”自然表达如今形成的结果状态。
theological_decisions:
- issue: “一体”在耶稣引用《创世记》时的含义
  choice: 保留“一体”这一婚姻结合用语，不作解释性扩写
  alternative: 一个身体；一个人；在性方面结合
  rationale: 原文σάρξ保有身体、亲属及婚约结合等丰富意涵，本节并未将其限定为其中某一方面；保留传统而自然的“一体”可避免缩窄其神学含义。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“一体”承接汉语圣经传统，同时以脚注呈现原文较具体的“肉身”措辞。
