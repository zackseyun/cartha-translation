  text: ἐὰν μὴ λάβῃ ἑκατονταπλασίονα νῦν ἐν τῷ καιρῷ τούτῳ οἰκίας καὶ ἀδελφοὺς καὶ ἀδελφὰς καὶ ⸀μητέρας καὶ τέκνα καὶ ἀγροὺς μετὰ διωγμῶν, καὶ ἐν τῷ αἰῶνι τῷ ἐρχομένῳ ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/030.yaml
  text: who will not receive a hundredfold now in this time—houses and brothers and sisters and mothers and children and fields[a], with persecutions—and in the age to come[b], eternal life.
translation:
  language: zh_hans
  text: 谁会不在现今这个时期得到百倍[a]——房屋、弟兄、姊妹、母亲、儿女和田地，同时也遭受迫害——又在将要来到的世代[b]得到永生呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一百倍之多。”
    reason: ἑκατονταπλασίονα可直接译为“百倍”，也可译为“一百倍之多”；两者都保留数量上的丰厚回报。
  - marker: b
    text: 或译：“在来世。”
    reason: αἰών可指“世代、时代”；此处与“现今这个时期”相对，指将要来到的世代。
lexical_decisions:
- source_word: λάβῃ
  choice: 得到
  rationale: 在应许和回报的语境中，“得到”自然表达领受所赐之物，又不带主动夺取的意味。
- source_word: ἑκατονταπλασίονα
  choice: 百倍的
  rationale: 保留原文明确的数量力度，并可自然统摄后列的房屋、亲属和田地。
- source_word: νῦν ἐν τῷ καιρῷ τούτῳ
  choice: 在现今这个时期
  rationale: 明确保留“现今”与“这个时期”的双重时间表达，并与后文“来世”形成对照。
- source_word: οἰκίας καὶ ἀδελφοὺς καὶ ἀδελφὰς καὶ μητέρας καὶ τέκνα καὶ ἀγρούς
  choice: 房屋、弟兄、姊妹、母亲、儿女和田地
  rationale: 逐项保留具体的物质与家庭意象；ἀδελφοὺς和ἀδελφὰς分别译出，以反映原文的性别区分。
- source_word: μετὰ διωγμῶν
  choice: 同时也遭受迫害
  rationale: 用自然汉语表达祝福与迫害相伴而来的张力；“迫害”虽为集合表达，仍充分传达复数διωγμῶν所指的反复或多方面逼迫。
- source_word: ἐν τῷ αἰῶνι τῷ ἐρχομένῳ
  choice: 在来世
  rationale: 以现代汉语中简洁而通行的末世性表达呈现“将要来到的世代”，并以脚注保留较贴近形式的译法。
- source_word: ζωὴν αἰώνιον
  choice: 永生
  rationale: 这是该短语在本语境中准确、通行且易懂的对应语，保留其末世性生命含义。
theological_decisions:
- issue: 现今所得回报的性质
  choice: 直接保留房屋、亲属和田地等具体项目，同时明确说“也遭受迫害”
  alternative: 把所应许的回报全部解释为纯属灵福分，或把它解释成不伴随苦难的物质昌盛
  rationale: 原文并置丰盛回报与迫害，译文不应消解这种神学张力，也不应替读者限定这些项目实现的具体方式。
- issue: 家庭称谓的性别表达
  choice: 分别译为“弟兄、姊妹”
  alternative: 合并译为“手足”或泛称“弟兄姊妹”
  rationale: 原文分别列出阳性复数ἀδελφοὺς和阴性复数ἀδελφὰς，逐项翻译更忠实。
- issue: 否定结构与上文的衔接
  choice: 保留“谁不会……得到”的反问式否定结构
  alternative: 改写为肯定句“他必得到”
  rationale: 本节开头ἐὰν μὴ λάβῃ承接上一节的οὐδείς ἐστιν，属于“没有人……不会得到”的结构；当前分节虽依赖上文，仍尽量保留原有句法力度。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“现今这个时期”刻意保留原文时间短语的强调；“来世”简洁通行，脚注则提示其字面上的“将来的世代”含义。
