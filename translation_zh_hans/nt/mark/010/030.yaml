review_pass:
  verdict: revise
  source_fidelity: 译文逐项保留了房屋、弟兄、姊妹、母亲、儿女和田地，也没有增添“父亲”；并保留现今的丰盛回报与迫害并存，以及将来世代的永生。可是“谁不会……”在现代汉语中容易理解为“谁没有能力”，未能清楚呈现原文承接上节“没有人”的否定关系。将其改为“谁会不……呢”可保留反问式的承接力度，同时更自然。
  naturalness: “在来世”虽通行，但“将要来到的世代”更准确地表达ἐν τῷ αἰῶνι τῷ ἐρχομένῳ与“现今这个时期”的时代性对照，且不把重点缩窄为个人死后的处境。“百倍”后以破折号引出所列项目，也比“百倍的房屋、弟兄……”更合乎现代汉语句法。
  terminology: “弟兄、姊妹”“母亲”“儿女”“田地”“迫害”和“永生”均恰当。保留“弟兄、姊妹”的分别表达，避免把原文明确区分的两个词合并。“将要来到的世代”避免“来世”可能带来的语义收窄。
  issues:
  - severity: medium
    issue: “谁不会……得到”有能力义歧义。
    rationale: 现代汉语的“不会”常表示不会做、不能做或未来未发生；这里原文是在οὐδείς承接下表达“没有人不领受”。“谁会不……呢”更清楚地传达修辞性否定。
  - severity: low
    issue: “来世”略缩窄αἰών的时代性含义。
    rationale: 原文与“现今这个时期”形成两个时代的对照；“将要来到的世代”更直接保留此对照。
  - severity: low
    issue: 脚注a的现有文字不适合其锚点及修订后的表达。
    rationale: “得到一百倍”不是对原短语的清晰独立替代；应改为对数量表达方式的自然替译，并将锚点置于“百倍”之后。
  revised_text: 谁会不在现今这个时期得到百倍[a]——房屋、弟兄、姊妹、母亲、儿女和田地，同时也遭受迫害——又在将要来到的世代[b]得到永生呢？
