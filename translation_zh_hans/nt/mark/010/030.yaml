revisions:
- from: 谁不会在现今这个时期得到百倍的房屋、弟兄、姊妹、母亲、儿女和田地[a]，同时也遭受迫害，并在来世[b]得到永生。
  to: 谁会不在现今这个时期得到百倍[a]——房屋、弟兄、姊妹、母亲、儿女和田地，同时也遭受迫害——又在将要来到的世代[b]得到永生呢？
  rationale: 修订主要消除“不会”的能力义歧义，改善“百倍”与随后项目的汉语衔接，并以“将要来到的世代”保留原文的末世时代对照。没有解释或限定现今回报的实现方式，仍明确保留其与迫害并存的张力。
