  text: οἱ δὲ μαθηταὶ ἐθαμβοῦντο ἐπὶ τοῖς λόγοις αὐτοῦ. ὁ δὲ Ἰησοῦς πάλιν ἀποκριθεὶς λέγει αὐτοῖς· Τέκνα, πῶς δύσκολόν ⸀ἐστιν εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελθεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/024.yaml
  text: But the disciples were astonished at his words. Jesus answered again and said to them[a], “Children, how difficult it is to enter the kingdom of God!”
translation:
  language: zh_hans
  text: 门徒却因他的话大为惊讶。耶稣又回答他们说：“孩子们，进入上帝的国是多么难啊！”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作：“孩子们，倚靠钱财的人进入上帝的国是多么难啊！”
    reason: textual_variant
lexical_decisions:
- source_word: ἐθαμβοῦντο
  choice: 惊讶
  rationale: 未完成时描写门徒持续的惊讶反应；“惊讶”自然、庄重，也保留了动词较强的语气。
- source_word: ἐπὶ τοῖς λόγοις αὐτοῦ
  choice: 因他的话
  rationale: ἐπί加与格在这里表示引发惊讶的根据或缘由；“因他的话”符合现代汉语表达。
- source_word: πάλιν
  choice: 又
  rationale: 表示耶稣再次开口，简洁地衔接上下文。
- source_word: ἀποκριθεὶς λέγει
  choice: 对他们说
  rationale: 这是受闪语影响的叙事套语；若机械译出“回答说”，现代汉语略显累赘。结合πάλιν译为“又对他们说”，既保留回应和再次发言的语篇功能，又自然流畅。
- source_word: Τέκνα
  choice: 孩子们
  rationale: 保留亲切、温和的称呼，不增添原文没有的“我的”，也不误译为仅指男性的称谓。
- source_word: πῶς δύσκολόν ἐστιν
  choice: 是多么难啊
  rationale: “多么……啊”传达πῶς的感叹和强调作用，同时准确表达δύσκολον。
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελθεῖν
  choice: 进上帝的国
  rationale: “进……国”是清楚自然的现代汉语，并保留进入上帝国度这一核心意象。
theological_decisions:
- issue: 是否在正文加入“倚靠钱财的人”这一较长异文
  choice: 依照SBLGNT采用短读法：“进上帝的国是多么难啊”
  alternative: “倚靠钱财的人进上帝的国是多么难啊”
  rationale: 所给希腊文本采用短读法，其表述较宽，并保留本节本身的张力。较长读法把困难明确限定于倚靠财富的人，影响解释，因此不并入正文，而在脚注中说明。
translation_notes:
  register: 采用现代标准普通话，语气自然、庄重，适合普通读者。“孩子们”保留耶稣称呼中的亲切感；正文遵循较短读法，不以异文消解原文的神学张力。
