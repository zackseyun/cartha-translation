- from: 门徒因他的话而惊讶。耶稣又对他们说[a]：“孩子们，进上帝的国是多么难啊！”
  to: 门徒却因他的话大为惊讶。耶稣又回答他们说：“孩子们，进入上帝的国是多么难啊！”[a]
  rationale: 修订保留SBLGNT短读法及其未被限定的张力，同时补出原文的转折和“回答”语义，并以“大为惊讶”更贴近动词的语势。脚注仍忠实呈现较长异文，且不将其解释性限定纳入正文。
