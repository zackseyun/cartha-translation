  source_fidelity: 译文整体准确传达了雅各和约翰走近耶稣、称他为“老师”，并提出笼统请求的内容。“为我们做”恰当地保留了ποιήσῃς的宽泛性，未擅自解释为“应允”或“赐给”。但“我们无论求你什么，都希望你为我们做”的语序使“都”与“希望”的搭配略显不稳，也稍微模糊了原文“我们要你……做”的主从关系。
  naturalness: “走到耶稣跟前”“对他说”和“老师”均自然合乎现代标准汉语。将请求改为“我们想要你无论我们向你求什么，都为我们做”，可更清晰、自然地表达原文的直接要求及“无论什么”的范围。
  terminology: 人名“西庇太、雅各、约翰”采用通行译名；“老师”准确对应Διδάσκαλε，且符合现代语体。脚注宜避免“明确”这类可能过强的表述，并以更贴近原文的替代译法说明动词的趋向意义。
