  text: Καὶ προσπορεύονται αὐτῷ Ἰάκωβος καὶ Ἰωάννης ⸀οἱ υἱοὶ Ζεβεδαίου λέγοντες ⸀αὐτῷ· Διδάσκαλε, θέλομεν ἵνα ὃ ἐὰν αἰτήσωμέν ⸀σε ποιήσῃς ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/035.yaml
  text: And James and John[a], the sons of Zebedee, came to him and said to him, “Teacher, we want you to do for us whatever we ask of you.”
translation:
  language: zh_hans
  text: 西庇太的儿子雅各和约翰走到耶稣跟前[a]，对他说：“老师，我们想要你无论我们向你求什么，都为我们做。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“来到他面前。”希腊文动词表示朝耶稣而来、走近他。
    reason: lexical_alternative
lexical_decisions:
- source_word: προσπορεύονται αὐτῷ
  choice: 走到耶稣跟前
  rationale: 该动词表达朝某人走近；补出“耶稣”可避免汉语代词指向含混，并保留动作感。叙事现在时按现代汉语通常以一般叙事形式表达。
- source_word: οἱ υἱοὶ Ζεβεδαίου
  choice: 西庇太的儿子
  rationale: 直接保留希腊文的属格身份说明，与“雅各和约翰”构成自然的同位结构。
- source_word: λέγοντες αὐτῷ
  choice: 对他说
  rationale: 将希腊文分词结构转为自然的汉语连续谓语，不改变其叙事关系。
- source_word: Διδάσκαλε
  choice: 老师
  rationale: 准确表达称呼语“教师、老师”，比“夫子”更符合现代标准汉语，也不额外强化主权含义。
- source_word: θέλομεν
  choice: 希望
  rationale: 表达说话者的意愿；“希望”在此比“想要”更自然，同时仍保留请求中显出的直接性。
- source_word: ὃ ἐὰν αἰτήσωμέν σε
  choice: 无论求你什么
  rationale: ὃ ἐάν构成不定关系表达，意为“无论什么”；“求你”符合此处向人提出请求的语境。
- source_word: ποιήσῃς ἡμῖν
  choice: 为我们做
  rationale: 贴近ποιέω的宽泛含义，不预先解释为“应允”或“赐给”，从而保留原话的开放性。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留门徒请求的直接和笼统，不把“做”解释性地改译成“答应”或“成全”。脚注给出动作表达的另一种自然译法。
