  text: καὶ γὰρ ὁ υἱὸς τοῦ ἀνθρώπου οὐκ ἦλθεν διακονηθῆναι ἀλλὰ διακονῆσαι καὶ δοῦναι τὴν ψυχὴν αὐτοῦ λύτρον ἀντὶ πολλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/045.yaml
  text: For even the Son of Man did not come to be served[a], but to serve, and to give his life as a ransom for many.
translation:
  language: zh_hans
  text: 因为就连人子也不是来受人服侍，而是来服侍人，并且献出自己的生命，为许多人作赎价[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“作赎价，代替许多人。”这里译作“为”的希腊语介词可以表达替代或交换。
    reason: 保留ἀντί较明确的替代或交换意味。
lexical_decisions:
- source_word: καὶ γὰρ
  choice: 因为就连……也
  rationale: γάρ承接并说明前文，译作“因为”；καί在这里带强调意味，以“就连……也”自然地保留这种语气。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人子
  rationale: 保留耶稣这一固定自称及其与《但以理书》相关的互文意味，不改写为解释性称呼。
- source_word: οὐκ ἦλθεν διακονηθῆναι ἀλλὰ διακονῆσαι
  choice: 不是来受人服侍，而是来服侍人
  rationale: 用同一词根对应被动与主动的不定式，清楚呈现本句的修辞反转；补出“人”使现代汉语自然，并不限定服侍者或受服侍者的范围。
- source_word: δοῦναι τὴν ψυχὴν αὐτοῦ
  choice: 献出自己的生命
  rationale: ψυχή在此指为死亡而交出的生命，并非专指非物质的“灵魂”；“献出自己的生命”既自然庄重，也保留主动给予的含义。
- source_word: λύτρον
  choice: 赎价
  rationale: 该词指为使人获释而付出的代价；“赎价”简洁地保留释放、赎回及代价的语义。
- source_word: ἀντὶ πολλῶν
  choice: 为许多人
  rationale: 正文采用自然流畅的汉语表达；ἀντί较强的替代或交换意味则在脚注中明确保留。πολλῶν译作“许多人”，不擅自解释其范围。
theological_decisions:
- issue: 赎价之言中ἀντί的语义力度
  choice: 正文译作“为许多人作赎价”，并以脚注注明“代替许多人”的可能译法
  alternative: 作赎价，代替许多人
  rationale: ἀντί最自然地可表达交换或替代，但正文若直接写“代替”会比普通现代汉语更具解释性。正文保持可读性，脚注则使原文的替代意味清楚可查，同时不进一步界定赎价意象的教义机制。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“服侍”比“侍奉”较少带专门宗教色彩，又能维持前后主动与被动的对应；“赎价”保留本句核心意象。
