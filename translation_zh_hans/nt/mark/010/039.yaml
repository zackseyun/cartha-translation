id: MRK.10.39
reference: Mark 10:39
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν αὐτῷ· Δυνάμεθα. ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· ⸀Τὸ ποτήριον ὃ ἐγὼ πίνω πίεσθε καὶ τὸ βάπτισμα ὃ ἐγὼ βαπτίζομαι βαπτισθήσεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/039.yaml
  text: And they said to him[a], “We are able.” But Jesus said to them, “The cup that I drink, you will drink; and the baptism with which I am baptized[b], you will be baptized,”
translation:
  language: zh_hans
  text: 他们对他说：“我们能[a]。”耶稣却对他们说：“我所喝的杯，你们也要喝；我所受的洗，你们也要受。[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“我们做得到”。
    reason: lexical_alternative
  - marker: b
    text: 这里的“杯”和“洗”都是隐喻，指耶稣即将承受的苦难和命运；他的门徒也将一同经历。
    reason: cross_reference
lexical_decisions:
- source_word: Δυνάμεθα
  choice: 我们能
  rationale: 直接对应能力或可能性的表达，也自然承接上文耶稣的问话；保留门徒简短而肯定的回答。
- source_word: ποτήριον
  choice: 杯
  rationale: 保留原文的隐喻意象，不在正文中直接改译为“苦难”或“命运”。
- source_word: πίνω / πίεσθε
  choice: 我所喝 / 你们也要喝
  rationale: 保留现在时与将来时的对照，并维持“喝杯”这一隐喻的平行结构。
- source_word: βάπτισμα
  choice: 洗
  rationale: “受洗”是现代汉语中对应 βάπτισμα／βαπτίζω 的通行表达；此处保留原文意象，由语境和脚注说明其隐喻意义。
- source_word: βαπτίζομαι / βαπτισθήσεσθε
  choice: 我所受的洗 / 你们也要受
  rationale: 以自然汉语保留同根词形成的对应关系，并反映原文的被动含义。
- source_word: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς
  choice: 耶稣却对他们说
  rationale: “却”体现 δέ 所表达的轻微转折，显出门徒自信的回答与耶稣随后宣告之间的张力。
theological_decisions:
- issue: “杯”和“洗”的隐喻意义
  choice: 正文保留“杯”和“洗”两个意象
  alternative: 在正文中直译其含义为“苦难”“死亡”或“考验”
  rationale: 原文刻意使用两个具有圣经背景的隐喻；保留这些意象能避免把丰富含义缩减为单一解释。
- issue: 此处的“洗”与礼仪性洗礼的关系
  choice: 译作“受洗”，同时由脚注指出上下文中的隐喻用法
  alternative: 译作“被淹没”或“经历考验”，以排除礼仪性理解
  rationale: βάπτισμα 与 βαπτίζω 的词形联系应予保留；上下文指向耶稣将经历的苦难和命运，但译文不应抹去原有的“洗”之意象。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我们能”保持回答的简洁有力；“我所喝的杯”和“我所受的洗”形成清楚的平行句式。“却”表达温和转折，不把耶稣的话处理成对门徒回答的简单认同。
