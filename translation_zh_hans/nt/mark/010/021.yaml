  text: ὁ δὲ Ἰησοῦς ἐμβλέψας αὐτῷ ἠγάπησεν αὐτὸν καὶ εἶπεν αὐτῷ· Ἕν ⸀σε ὑστερεῖ· ὕπαγε ὅσα ἔχεις πώλησον καὶ δὸς ⸀τοῖς πτωχοῖς, καὶ ἕξεις θησαυρὸν ἐν οὐρανῷ, καὶ δεῦρο ἀκολούθει ⸀μοι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/021.yaml
  text: 'And Jesus[a], looking at him, loved him and said to him, “One thing you lack: go, sell whatever you have and give to the poor, and you will have treasure in heaven; and come, follow me.”'
translation:
  language: zh_hans
  text: 耶稣注视着他，爱他，并对他说：“你还缺少一件事：去变卖你所有的一切[a]，分给穷人，你就会有财宝在天上；来跟从我。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“凡你有的”。希腊语ὅσα ἔχεις可译作“凡你有的”或“你所有的一切”；在此上下文中，指他全部的财物。
    reason: 词义译法
lexical_decisions:
- source_word: ἐμβλέψας
  choice: 注视着他
  rationale: 该词表示有意识地把目光投向某人；“注视着”既体现专注，又不额外加入严厉、审视等语气。
- source_word: ἠγάπησεν αὐτόν
  choice: 就爱他
  rationale: 直接保留动词“爱”的明确含义，不弱化为友善，也不赋予经文本身未明说的技术性神学含义。
- source_word: Ἕν σε ὑστερεῖ
  choice: 你还缺少一件事
  rationale: 中性数词Ἕν在此作名词用，汉语自然补出“一件事”；“还缺少”清楚表达此人目前仍有所欠缺。
- source_word: ὅσα ἔχεις
  choice: 你所有的
  rationale: 此关系表达可指“凡你所有的”或“你所有的一切”；结合上下文，“你所有的”自然且保留其涵盖全部财物的力度。
- source_word: πώλησον
  choice: 变卖
  rationale: 表达将所拥有之物卖掉；较单说“卖”更符合汉语中处理全部财物的语境。
- source_word: δὸς τοῖς πτωχοῖς
  choice: 分给穷人
  rationale: “分给”在汉语中自然表达把变卖所得给予穷人；“穷人”准确对应实体化形容词τοῖς πτωχοῖς。
- source_word: θησαυρὸν ἐν οὐρανῷ
  choice: 财宝在天上
  rationale: “有财宝在天上”贴近希腊语结构，同时保留属天赏赐的意象，不作进一步解释。
- source_word: δεῦρο ἀκολούθει μοι
  choice: 然后来跟从我
  rationale: δεῦρο表达“来”的召唤，ἀκολούθει为现在时命令式，含持续作门徒的意味；“跟从我”在现代汉语中庄重自然，并能承载这一持续含义。
theological_decisions:
- issue: 耶稣对这个人的爱具有什么含义
  choice: 译为“就爱他”，按经文保留真实而直接的爱。
  alternative: 弱化为外在的友善，或解释成某种技术性的拣选之爱。
  rationale: ἠγάπησεν αὐτόν明确陈述耶稣爱他。译文既不应削弱这一陈述，也不应以经文未明说的后期教义体系限定它，从而保留本节本有的情感与神学张力。
- issue: 变卖财物之命令的范围
  choice: 译为“变卖你所有的”，保留命令涵盖其全部财物的力度。
  alternative: 软化为一般性的慷慨施舍，或在正文中扩写成解释性的措辞。
  rationale: ὅσα ἔχεις在本语境中具有全面范围。译文直陈其力度，同时以脚注交代词语可译形式。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“注视着”体现专注目光；“变卖”“跟从”保留经文语体的庄重感，但仍属当代读者容易理解的表达。脚注标记紧随其所说明的“你所有的”，避免指代错位。
