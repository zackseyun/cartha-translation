  text: καὶ ὃς ⸀ἂν θέλῃ ⸂ἐν ὑμῖν εἶναι⸃ πρῶτος, ἔσται πάντων δοῦλος·
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/044.yaml
  text: And whoever wants to be first among you will be the slave of all[a].
translation:
  language: zh_hans
  text: 凡想在你们中间居首的，就要做众人的奴仆。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“众人的奴隶。”原文“奴仆”一词是doulos，比上一节译作“仆人”的词语气更强。
    reason: 说明可能的更强译法，并保留与上一节用词之间的递进。
lexical_decisions:
- source_word: ὃς ἂν θέλῃ
  choice: 凡想……的
  rationale: 关系代词配合ἄν和虚拟语气表达泛指条件；“凡……的”自然地传达“无论谁”，“想”保留θέλω的意愿含义。
- source_word: ἐν ὑμῖν
  choice: 在你们中间
  rationale: 此处指门徒群体内部的地位，而非单纯的空间位置。
- source_word: πρῶτος
  choice: 居首
  rationale: πρῶτος在这里表示地位或显要程度上的第一；“居首”既简洁，又符合社会排序的语境。
- source_word: ἔσται
  choice: 就要做
  rationale: 原文是将来时“将是”；在耶稣的教导中带有规范、命令意味。“就要做”保留条件句结构，也自然传达这种要求。
- source_word: πάντων
  choice: 众人的
  rationale: 属格与δοῦλος构成从属关系；“众人的”简明地保留范围上的普遍性。
- source_word: δοῦλος
  choice: 奴仆
  rationale: 该词比上一节的διάκονος更强，含受支配、地位卑下之意。“奴仆”比单用“仆人”更能保留这种强化，同时在现代中文经文语体中自然庄重。
theological_decisions:
- issue: 门徒教导中δοῦλος的译法
  choice: 奴仆
  alternative: 仆人；奴隶
  rationale: 紧接上一节的διάκονος，δοῦλος刻意加强自我降卑和服属于众人的力度。“仆人”会削弱两词的差别；“奴隶”虽更直接，却在现代中文中较易只让人联想到特定历史制度。“奴仆”兼顾原词力度与经文语境。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“居首”体现群体中的地位追求；“就要做”使原文将来时在教导语境中的规范意味自然呈现。
