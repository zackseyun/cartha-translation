  text: τὰς ἐντολὰς οἶδας· Μὴ ⸂φονεύσῃς, Μὴ μοιχεύσῃς⸃, Μὴ κλέψῃς, Μὴ ψευδομαρτυρήσῃς, Μὴ ἀποστερήσῃς, Τίμα τὸν πατέρα σου καὶ τὴν μητέρα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/019.yaml
  text: 'You know the commandments: Do not murder[a], do not commit adultery, do not steal, do not bear false witness, do not defraud[b], honor your father and mother.'
translation:
  language: zh_hans
  text: 你知道这些诫命：“不可杀人[a]，不可奸淫，不可偷盗，不可作假见证，不可亏负人[b]，要孝敬父母。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的希腊语动词特指谋杀或不法杀人，并非泛指一切致人死亡的行为；也可译作“不可谋杀”。
    reason: lexical_alternative
  - marker: b
    text: “不可亏负人”也可译作“不可剥夺人应得之物”或“不可欺诈人”。原词指扣留、夺去或使人失去本应属于他的财物、工价或其他应得之物，常含不公正地谋利的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰς ἐντολὰς
  choice: 这些诫命
  rationale: “诫命”符合十诫语境；加“这些”自然表达希腊文定冠词所指向的那组众所周知的诫命。
- source_word: οἶδας
  choice: 你是知道的
  rationale: οἶδα虽为完成时形式，在通用希腊语中具有现在时意义；这一表达也自然保留了原文对听者已有认知的强调。
- source_word: Μὴ φονεύσῃς
  choice: 不可杀人
  rationale: 采用现代中文读者熟悉的十诫措辞；φονεύω在这里指蓄意或不法杀人，并非泛指一切致死行为，故用脚注说明。
- source_word: Μὴ μοιχεύσῃς
  choice: 不可奸淫
  rationale: “奸淫”是中文诫命语体中简洁、明确的表达，指违反婚姻忠贞的性行为。
- source_word: Μὴ κλέψῃς
  choice: 不可偷盗
  rationale: 准确对应κλέπτω，并保持诫命列表整齐庄重的语体。
- source_word: Μὴ ψευδομαρτυρήσῃς
  choice: 不可作假见证
  rationale: 保留ψευδομαρτυρέω的法律及作证语境，比宽泛的“不可说谎”更准确。
- source_word: Μὴ ἀποστερήσῃς
  choice: 不可侵占他人的权益
  rationale: ἀποστερέω指扣留、剥夺或侵占本应属于他人的东西；“权益”兼顾财物、工价及其他正当所得，避免将含义局限于一般欺诈。
- source_word: Τίμα
  choice: 要孝敬
  rationale: 在父母语境中，“孝敬”是中文十诫的通行表达，包含尊重、看重并尽相应责任的意义，比单纯“尊敬”更完整。
- source_word: τὸν πατέρα σου καὶ τὴν μητέρα
  choice: 父母
  rationale: 现代汉语以“父母”自然、完整地表达成对的亲属称谓；所有关系由上下文清楚限定为听者自己的父母。
theological_decisions:
- issue: 十诫引文或典故的表达方式
  choice: 采用读者熟悉的中文诫命句式，同时用脚注交代容易误解的词义范围
  alternative: 全部改用更解释性的现代散文，如“不可谋杀”“不可欺诈或剥夺别人”
  rationale: “不可……要……”保留了诫命清单的辨识度和庄重感；脚注则防止把“杀人”理解为涵盖任何形式的致死，并保留ἀποστερέω较宽的语义。
- issue: ἀποστερέω所指行为的范围
  choice: 译为“侵占他人的权益”
  alternative: 译为“不可欺诈”或“不可亏负人”
  rationale: 原词可涉及扣留工价、剥夺财物或以不正当方式使人失去其应得之物。“侵占他人的权益”不把经文限定为某一种经济手段，也不额外引入特定教义解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话，并沿用中文读者熟悉的十诫句式。“这些诫命你是知道的”体现原文先置宾语及οἶδας的现时含义；列表用平行短句维持口头宣告的节奏。所有脚注标记均已置于正文相应词句之后。
