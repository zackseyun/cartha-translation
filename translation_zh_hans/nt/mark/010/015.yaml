  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ὃς ⸀ἂν μὴ δέξηται τὴν βασιλείαν τοῦ θεοῦ ὡς παιδίον, οὐ μὴ εἰσέλθῃ εἰς αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/015.yaml
  text: Truly I say to you[a], whoever does not receive the kingdom of God like a child will certainly not enter it.
translation:
  language: zh_hans
  text: 我实在告诉你们：凡不像小孩子一样[a]接受上帝之国的人，绝不能进去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或可理解为“以小孩子的身份”。这里也可能使人想到小孩子的谦卑、信赖或依靠，但希腊文没有明确指出所强调的是哪一点。
    reason: 保留ὡς παιδίον的表达空间，避免把某一种儿童特质写进正文。
lexical_decisions:
- source_word: ἀμὴν
  choice: 实在
  rationale: 在“我告诉你们”这一庄严宣告公式中，“实在”自然传达其郑重、权威的语气，也避免把闪语音译形式直接带入正文。
- source_word: λέγω ὑμῖν
  choice: 我告诉你们
  rationale: 现代汉语中比“我对你们说”更自然，同时准确表达向复数听众所作的直接宣告。
- source_word: ὃς ἂν
  choice: 凡……的人
  rationale: 关系代词与ἄν构成不定、概括性的条件，汉语“凡……的人”清楚表达任何符合该条件者。
- source_word: μὴ δέξηται
  choice: 不……接受
  rationale: δέχομαι可指领受、接受或接纳；“接受”与“上帝之国”搭配自然，并保留领受而非凭行为取得的意象。
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: 上帝之国
  rationale: “上帝之国”是简洁、庄重且通行的表达，可同时容纳上帝掌权及其国度的含义，不偏向其中一面。
- source_word: ὡς παιδίον
  choice: 像小孩子一样
  rationale: ὡς表达比较，παιδίον指孩子；此译自然保留比喻，又不擅自限定所比较的是谦卑、信赖或依靠等某一种品质。
- source_word: οὐ μὴ εἰσέλθῃ
  choice: 绝不能进去
  rationale: οὐ μή加虚拟语气构成强烈否定；“绝不能”准确传达强调语气，“进去”则自然承接前文所说的国。
- source_word: εἰς αὐτήν
  choice: 进去
  rationale: αὐτήν回指“上帝之国”。现代汉语可用“进去”自然表达进入其中，无须重复宾语。
theological_decisions:
- issue: “像小孩子一样接受上帝之国”的具体含义
  choice: 保留比较，不指定小孩子的哪一种特质
  alternative: 明确解释为像小孩子那样谦卑、信赖或依靠
  rationale: 希腊文只陈述与小孩子相似，却没有明说相似之处。正文不替原文消除这一解释空间。
- issue: “像小孩子一样”所表达的是方式还是身份
  choice: 正文采用较自然的方式性理解“像小孩子一样”
  alternative: 译作“以小孩子的身份”或“在还是小孩子时”
  rationale: ὡς παιδίον在语境中最自然地表示比较方式，但措辞本身可以引发身份性理解，因此以脚注提示而不在正文中强行排除。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我实在告诉你们”保留耶稣郑重宣告的语气；“凡……的人，绝不能……”既符合汉语习惯，也保存原句的普遍条件和强烈否定。脚注标记紧接其所说明的比较短语。
