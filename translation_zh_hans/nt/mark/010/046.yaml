  text: Καὶ ἔρχονται εἰς Ἰεριχώ. καὶ ἐκπορευομένου αὐτοῦ ἀπὸ Ἰεριχὼ καὶ τῶν μαθητῶν αὐτοῦ καὶ ὄχλου ἱκανοῦ ⸀ὁ υἱὸς Τιμαίου Βαρτιμαῖος ⸀τυφλὸς ⸂προσαίτης ἐκάθητο παρὰ τὴν ὁδόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/046.yaml
  text: And they came to Jericho[a]. And as he was going out from Jericho, along with his disciples and a considerable crowd, Bartimaeus, the son of Timaeus, a blind beggar[c][b], was sitting beside the road.
translation:
  language: zh_hans
  text: 他们来到耶利哥。耶稣和他的门徒以及一大群人正从耶利哥出来时，底买的儿子巴底买，就是那个瞎眼的乞丐，坐在路旁。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρχονται
  choice: 来到
  rationale: 希腊文采用历史现在时；现代汉语叙事通常无须用形态时态标示，译作“来到”自然地承接事件进程。
- source_word: ἐκπορευομένου αὐτοῦ
  choice: 耶稣正……出来
  rationale: 属格独立结构表达与主句同时发生的动作；“正……出来”保留进行中的动态。汉语补明“耶稣”，避免连续代词造成指代不清。
- source_word: ὄχλου ἱκανοῦ
  choice: 一大群人
  rationale: ἱκανός在这里表示人数很多、规模可观；“一大群人”是自然清楚的现代汉语。
- source_word: ὁ υἱὸς Τιμαίου Βαρτιμαῖος
  choice: 底买的儿子巴底买
  rationale: 保留原文同时给出的父名说明和巴底买这一闪语名字，并依照自然汉语次序表达。
- source_word: τυφλὸς προσαίτης
  choice: 盲眼的乞丐
  rationale: 直接表达此人的失明状况和以乞讨为生的身份；措辞清楚、通俗而庄重。
- source_word: παρὰ τὴν ὁδόν
  choice: 坐在路旁
  rationale: παρά加宾格在此表示沿路、路边的位置；“路旁”简洁自然。
- source_word: Ἰεριχώ
  choice: 耶利哥
  rationale: 采用现代中文圣经读者熟悉的标准地名译法。
theological_decisions:
- issue: 巴底买的叙事身份说明
  choice: 正文同时保留“巴底买”和“底买的儿子”
  alternative: 只保留名字“巴底买”，或只意译为“底买的儿子”
  rationale: 原文本身既给出闪语名字，又给出其父名说明；两者并存应予保留，不替作者删减或化解这种解释性重复。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“跟着他”将原文并列成分转化为自然汉语，表达门徒和人群与耶稣一同出城；不把“巴底买”仅当作已完成汉化的普通姓名，而保留原文紧接的父名解释。
