revisions:
- from: 他们来到耶利哥。耶稣正从耶利哥出来，他的门徒和一大群人也跟着他。底买的儿子巴底买，是个盲眼的乞丐，坐在路旁。[a]
  to: 他们来到耶利哥。耶稣和他的门徒以及一大群人正从耶利哥出来时，底买的儿子巴底买，就是那个瞎眼的乞丐，坐在路旁。
  rationale: 修订将门徒和群众从“跟着他”改为与耶稣并列的出城者，避免超过原文所明说的关系。删除无所据的文本异文脚注。其余内容保留原文的叙事顺序、人物识别、失明与乞讨身份及路旁位置。
