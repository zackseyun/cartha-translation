source:
  edition: SBLGNT
  text: ἰδὼν δὲ ὁ Ἰησοῦς ἠγανάκτησεν καὶ εἶπεν αὐτοῖς· Ἄφετε τὰ παιδία ἔρχεσθαι πρός με, μὴ κωλύετε αὐτά, τῶν γὰρ τοιούτων ἐστὶν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/014.yaml
  text: But when Jesus saw it[a], he was indignant and said to them, “Let the children come to me; do not hinder them, for the kingdom of God belongs to such as these.”
translation:
  language: zh_hans
  text: 耶稣看见了，就很愤慨，对他们说：“让孩子们到我这里来，不要拦阻他们，因为神的国属于这样的人[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为神的国是这等人的。”
    reason: 保留τῶν τοιούτων ἐστίν较贴近原文形式的表达，并显示“属于”是为现代汉语通顺而作的等值处理。
lexical_decisions:
- source_word: ἰδὼν δὲ ὁ Ἰησοῦς
  choice: 耶稣看见了，就
  rationale: 不定过去时分词交代耶稣作出反应的情境；汉语可依上下文省略所见之事的宾语。“就”自然连接看见与随后的反应，δὲ在此处的轻微转折由上下文及语流体现，无须生硬加“但是”。
- source_word: ἠγανάκτησεν
  choice: 很气愤
  rationale: 表达强烈的不悦和义愤，又不夸大为失控的暴怒；现代汉语自然清楚。
- source_word: εἶπεν αὐτοῖς
  choice: 对他们说
  rationale: 准确、自然地表达标准的说话引介语。
- source_word: Ἄφετε τὰ παιδία ἔρχεσθαι πρός με
  choice: 让孩子们到我这里来
  rationale: Ἄφετε在此意为允许；παιδία泛指孩子，原词本身不必强译为“小孩子”；“到我这里来”自然表达朝向耶稣的行动。
- source_word: μὴ κωλύετε αὐτά
  choice: 不要拦阻他们
  rationale: 保留妨碍、阻止他们接近耶稣的含义；“拦阻”庄重而仍为现代读者熟悉。
- source_word: τῶν γὰρ τοιούτων ἐστὶν
  choice: 因为……属于这样的人
  rationale: τοιούτων指“这一类的人”，不限于在场的这些具体孩子；用“属于”使希腊文属格结构在汉语中自然，同时以脚注保留较贴近形式的表达。
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: 神的国
  rationale: 采用简洁、通行的圣经用语，保留“国”所含的领域与王权意象，不缩减为单纯抽象的“统治”。
theological_decisions:
- issue: “τῶν τοιούτων”所指的范围
  choice: 译为“这样的人”，表达这些孩子所代表的一类人
  alternative: 仅指在场的孩子，或译成形式较直的“神的国是这等人的”
  rationale: τοιούτων具有类别和代表性，但经文本身未说明这种相似具体在于无辜、谦卑或其他特质，因此不在正文中补入任何教义性解释。
- issue: “神的国属于这样的人”的含义
  choice: 保留归属关系，不进一步解释为自动得救或国度只由儿童构成
  alternative: 将其解释为所有儿童必然得救，或神的国仅由儿童组成
  rationale: 原文肯定神的国与“这样的人”的关系，却没有展开其全部救恩论含义；译文应保留这一神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“很气愤”传达强烈情绪但不过度；“拦阻”和“神的国”保持适度的经文语体。脚注标记[a]已置于相关正文之后。
