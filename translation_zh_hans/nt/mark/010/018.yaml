  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτῷ· Τί με λέγεις ἀγαθόν; οὐδεὶς ἀγαθὸς εἰ μὴ εἷς ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/018.yaml
  text: But Jesus said to him[a], “Why do you call me good? No one is good except one—God.”
translation:
  language: zh_hans
  text: 耶稣对他说：“你为什么称我为良善？除了上帝一位以外，没有谁是良善的。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: 不单独译出
  rationale: 此处是轻微的承接或回应转折。现代汉语用“耶稣对他说”即可自然推进对话；若硬译为“但是”会使转折显得过强。
- source_word: εἶπεν αὐτῷ
  choice: 对他说
  rationale: 准确表达 λέγω 加间接宾语的结构，也是自然、庄重的现代汉语。
- source_word: Τί
  choice: 为什么
  rationale: τί 在此与动词连用，具有询问缘由的副词功能；“为什么”比形式对应的“为着什么”更符合现代汉语，同时保留耶稣对这一称呼的追问。
- source_word: με λέγεις ἀγαθόν
  choice: 称我为良善的
  rationale: 保留宾语 με 和表语 ἀγαθόν 的关系。“称……为……”准确而自然，也没有把问句扩展为对说话者动机的额外解释。
- source_word: ἀγαθόν / ἀγαθὸς
  choice: 良善的
  rationale: 两处采用同一译法，以保留原文的词语重复和修辞联系。“良善”在本句中庄重自然，也不额外限定为仅指道德品质。
- source_word: οὐδεὶς
  choice: 没有谁
  rationale: 自然表达普遍否定，并与后面的例外结构顺畅衔接。
- source_word: εἰ μὴ εἷς
  choice: 除了独一的……以外
  rationale: εἰ μή 表示例外，εἷς 强调只有一位；“独一的”保留其唯一性，并自然引出“上帝”。
- source_word: ὁ θεός
  choice: 上帝
  rationale: 作为专名自然表达原文所指的神；希腊语冠词无需在汉语中另行对应。
theological_decisions:
- issue: 耶稣关于“良善”的话可能引发的基督论含义
  choice: 直接翻译耶稣的追问和关于上帝独一良善的陈述，不添加解释性限定。
  alternative: 把本句译成耶稣否认自己具有神性，或译成耶稣在此明确宣告自己具有神性。
  rationale: 原句本身保留了修辞和神学张力。译文不应替读者断定耶稣是在否认自身神性，或是在本句中直接宣称自身神性。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“良善”保持两次 ἀγαθός 的一致性；句式清楚，适合经文朗读。
