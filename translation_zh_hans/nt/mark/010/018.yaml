    reason: 保留τί在此习语中按字面理解为“什么／为了什么”的可行译法；正文采用更自然的“为什么”。
  revision_rationale: 修订仅改善现代汉语句法，并更直接保留原文“except one—God”的强调和语序关系。正文不对耶稣这句话作基督论推断；脚注仅说明词汇性替代译法。
