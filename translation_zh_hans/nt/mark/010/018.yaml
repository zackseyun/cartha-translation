  to: 耶稣对他说：“你为什么称我为良善？除了上帝一位以外，没有谁是良善的。”
  rationale: 修订仅改善现代汉语句法，并更直接保留原文“except one—God”的强调和语序关系。正文不对耶稣这句话作基督论推断；脚注仅说明词汇性替代译法。
