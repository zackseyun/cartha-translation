source:
  edition: SBLGNT
  text: ⸂ὁ δὲ⸃ Ἰησοῦς εἶπεν αὐτοῖς· Πρὸς τὴν σκληροκαρδίαν ὑμῶν ἔγραψεν ὑμῖν τὴν ἐντολὴν ταύτην·
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/005.yaml
  text: But Jesus said to them[c][b][a], “Because of your hardness of heart he wrote this commandment for you.”
translation:
  language: zh_hans
  text: 耶稣却对他们说：“他[a]是因为你们心硬，才给你们写下这条诫命[b]的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文只说“他”，所指是上一节提到的摩西。
    reason: cross_reference
  - marker: b
    text: “诫命”也可译作“命令”。
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: 却
  rationale: 承接对话并表达轻微转折，表明耶稣针对他们诉诸摩西之言作出回应。
- source_word: Πρὸς τὴν σκληροκαρδίαν ὑμῶν
  choice: 是因为你们心硬
  rationale: 在本句中表达缘由或针对某种处境；“因为”自然传达因果意味，“心硬”保留希腊文的身体隐喻及道德张力。
- source_word: ἔγραψεν
  choice: 写下
  rationale: 准确表达书面制定；其省略的第三人称单数主语由上文的摩西承接。
- source_word: ἐντολήν
  choice: 诫命
  rationale: 表达具有权威和律法性质的命令，适合此处讨论摩西律法的语境；也可译作“命令”。
- source_word: ταύτην
  choice: 这条
  rationale: 指向当前正在讨论的具体规定，符合现代汉语对“诫命”的自然量词搭配。
theological_decisions:
- issue: 是否在正文中明确“写下”的主语是摩西
  choice: 正文写明“摩西”，并以脚注说明原文依上文省略主语
  alternative: 用“他”承接上文
  rationale: 希腊文主语虽未明说，但明确承接上一节的摩西。现代汉语若只说“他”，在独立呈现本节时指向稍弱；写明“摩西”可清楚传达所指，同时脚注保留原文的篇章形式。
- issue: 如何翻译 σκληροκαρδία
  choice: 心硬
  alternative: 硬着心；顽固不化
  rationale: “心硬”简洁、自然，并保留原文“心变硬”的圣经隐喻和道德含义，不将其缩减为一般意义上的固执。
- issue: 摩西所写规定与人的心硬之间的关系
  choice: 译作“是因为……才……”
  alternative: 针对你们心硬的情形；鉴于你们心硬
  rationale: πρός 加宾格在此表示针对该处境而作出的规定，并带有因由意味。“因为……才……”自然表达这种回应关系，但不进一步断定命令的神学性质或目的。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“心硬”保留圣经性的隐喻；“这条诫命”维持律法语境。以“是因为……才……”使汉语句法自然，并保留原文中该规定与人的心硬之间的因由关系。
