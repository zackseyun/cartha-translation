  text: καὶ ἀποκριθεὶς ⸂αὐτῷ ὁ Ἰησοῦς εἶπεν⸃· Τί ⸂σοι θέλεις ποιήσω⸃; ὁ δὲ τυφλὸς εἶπεν αὐτῷ· Ραββουνι, ἵνα ἀναβλέψω.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/051.yaml
  text: And answering him[a], Jesus said, “What do you want me to do for you?” And the blind man said to him, “Rabboni, that I may see again.”
translation:
  language: zh_hans
  text: 耶稣回答他说：“你要我为你做什么？”那盲人对他说：“拉波尼[a]，让我能重见光明。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拉波尼”是亚兰语称呼，意思是“我的老师”或“我的主人”。
    reason: 解释原文保留的闪语称呼及其可能的词义范围。
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: 回答
  rationale: 希腊文使用分词，直译为“回答着……说”在现代汉语中累赘；用“回答他说”保留回应动作及其对象，同时表达自然。
- source_word: Τί σοι θέλεις ποιήσω
  choice: 你要我为你做什么？
  rationale: “要”表达 θέλεις 的意愿含义，“为你”明确体现与格 σοι，整体符合现代汉语问句习惯。
- source_word: τυφλὸς
  choice: 那盲人
  rationale: 希腊文以形容词作名词使用，指前文特定的失明者；“那盲人”简洁自然，也保留特指性。
- source_word: Ραββουνι
  choice: 拉波尼
  rationale: 原文保留了闪语称呼的音译形式，正文同样音译，以保存其历史语感和称呼色彩；含义在脚注中说明。
- source_word: ἵνα ἀναβλέψω
  choice: 让我能重见光明
  rationale: 在医治失明的语境中，ἀναβλέπω 表示恢复视力；“重见光明”准确、自然。“让我能”体现 ἵνα 从句在此作为请求内容的功能。
theological_decisions:
- issue: Ραββουνι 这一称呼的译法
  choice: 正文音译为“拉波尼”，并以脚注解释
  alternative: 译作“我的老师”或“我的主人”
  rationale: 希腊文本身保留了闪语音译，而没有换成普通希腊语头衔。正文保留音译可呈现原文特色，脚注则帮助现代读者理解其意义。
- issue: ἵνα ἀναβλέψω 的请求语气
  choice: 让我能重见光明
  alternative: 我能再看见
  rationale: 该短句在上下文中直接回答耶稣的问题，具有请求内容的功能；译文表达这一语用含义，同时不增添关于医治方式或信心性质的解释。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事表达。“重见光明”是普通读者熟悉的恢复视力说法；脚注标记紧随其所解释的“拉波尼”。
