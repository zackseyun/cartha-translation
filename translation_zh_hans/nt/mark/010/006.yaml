  text: ἀπὸ δὲ ἀρχῆς κτίσεως ἄρσεν καὶ θῆλυ ἐποίησεν ⸀αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/006.yaml
  text: But from the beginning of creation[b][a], he made them male and female.
translation:
  language: zh_hans
  text: 但从创造之初，他就把他们造为男和女。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“男和女，他造了他们。”这样更贴近希腊文的词序。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ δὲ ἀρχῆς κτίσεως
  choice: 但从创造之初
  rationale: δὲ在上下文中带有转折意味，译为“但”；ἀπὸ ἀρχῆς κτίσεως表示以创造的开端为时间起点，“从创造之初”简洁、自然，并保留“创造”这一广义指涉。
- source_word: ἄρσεν καὶ θῆλυ
  choice: 男和女
  rationale: 原文是一对表示生理性别的词，呼应《创世记》的创造叙述；“男和女”比“男人和女人”更贴近其简练的类别表达。
- source_word: ἐποίησεν
  choice: 造为
  rationale: ποιέω的基本义是“做、造”，此处置于创造语境中。“造为”既保留动词本身的表达，也自然说明他们被造为男和女；不另行强化为专门术语。
- source_word: αὐτούς
  choice: 他们
  rationale: 阳性复数代词指向作为男女两者的人类。“他们”直接对应原文，不增添“二人”等原文未明说的强调。
theological_decisions:
- issue: 如何翻译创造引文中的性别词
  choice: 男和女
  alternative: 男人和女人
  rationale: 采用简练的性别对应词，保留原文对受造性别之配对的强调，不把它改写为社会角色或婚姻称谓。
- issue: 是否明确补出神为主语
  choice: 他就把他们造为男和女
  alternative: 神就把他们造为男和女
  rationale: 希腊文动词的主语未在本节明说，而是由上下文及《创世记》引文得知。用“他”保持这种含蓄；直接补“神”虽意义正确，却比本节原文更明确。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“从创造之初”凝练地表达时间起点；“造为男和女”保留《创世记》引文的创造语感。主文按自然汉语调整词序，脚注交代较贴近希腊文的排列。
