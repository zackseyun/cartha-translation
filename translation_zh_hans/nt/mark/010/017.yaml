  text: Καὶ ἐκπορευομένου αὐτοῦ εἰς ὁδὸν προσδραμὼν εἷς καὶ γονυπετήσας αὐτὸν ἐπηρώτα αὐτόν· Διδάσκαλε ἀγαθέ, τί ποιήσω ἵνα ζωὴν αἰώνιον κληρονομήσω;
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/017.yaml
  text: And as he was going out onto the road[a], one man ran up and knelt before him and asked him, “Good Teacher, what must I do so that I may inherit eternal life?”
translation:
  language: zh_hans
  text: 耶稣正出发上路[a]的时候，有一个人跑来，跪在他面前，问他：“良善的老师，我该做什么，才能承受永生？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“耶稣正走到路上时。”原文既可指走到路上，也可指启程上路。
    reason: 词义与场景存在真实的翻译可能性，脚注保留这一歧义。
lexical_decisions:
- source_word: ἐκπορευομένου αὐτοῦ εἰς ὁδόν
  choice: 耶稣正要出发上路的时候
  rationale: 属格独立结构交代与主要动作同时发生的背景；εἰς ὁδόν既可描写走到路上，也可惯用地表示启程。正文采用自然的现代汉语“出发上路”，并以脚注保留另一种场景理解。
- source_word: προσδραμὼν
  choice: 跑来
  rationale: 保留该不定过去时分词所呈现的迅速、急切接近，同时符合汉语叙事习惯。
- source_word: εἷς
  choice: 有一个人
  rationale: 该阳性单数数词在此作名词使用，引入一个具体人物；“一个人”既准确，又不添加原文未明说的身份。
- source_word: γονυπετήσας αὐτόν
  choice: 跪在他面前
  rationale: 准确表达屈膝跪下以及面对耶稣的姿态，不额外强化为扑倒或敬拜。
- source_word: ἐπηρώτα αὐτόν
  choice: 问他
  rationale: 未完成时在此可呈现当时进行的询问；汉语叙事用“问他”最自然，无须机械体现持续体。
- source_word: Διδάσκαλε ἀγαθέ
  choice: 良善的老师
  rationale: διδάσκαλος是“老师”，不是“主”；“良善”较“好”更适合郑重称呼，并保留ἀγαθός与下一节关于“良善”的回应之间的词语联系。
- source_word: τί ποιήσω
  choice: 我该做什么
  rationale: 表达商议式疑问中对所需行动的询问；“该”自然呈现实践上的要求，又不将语气过度加强为绝对命令。
- source_word: ἵνα ζωὴν αἰώνιον κληρονομήσω
  choice: 才能承受永生
  rationale: “才能”自然表达ἵνα引出的目的或预期结果；“永生”是ζωὴ αἰώνιος的通行准确译法；“承受”保留κληρονομέω作为继承、得产业的含义及其神学张力。
theological_decisions:
- issue: 对耶稣的称呼
  choice: 良善的老师
  alternative: 好老师；良善的夫子
  rationale: 原文是διδάσκαλε而非κύριε，因此不译作“主”；同时保留“良善”，使下一节耶稣对这一用词的回应仍然清楚。
- issue: κληρονομήσω与人的行动之间的张力
  choice: 我该做什么，才能承受永生
  alternative: 我该做什么，才可以得到永生
  rationale: 保留“做什么”与“承受产业”并置的原文张力，不把问题预先解释为靠行为赚取，也不将“承受”弱化成一般的“得到”。
- issue: εἷς的性别表达
  choice: 一个人
  alternative: 一名男子；有人
  rationale: 希腊语形式为阳性单数，但本节并未使用ἀνήρ明确强调成年男性身份；“一个人”忠实而自然，也避免从语法性别推入不必要的信息。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“良善的老师”略带郑重感，以保存后文的关键词呼应；“承受永生”沿用现代中文圣经语域中可理解的产业继承表达，而不改写为单纯“获得永生”。
