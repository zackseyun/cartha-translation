base_translation:
  language: en
  yaml_path: translation/nt/mark/007/026.yaml
  text: The woman was a Greek[a], a Syrophoenician by birth[b], and she kept asking him to cast the demon out of her daughter.
translation:
  language: zh_hans
  text: 这妇人是希腊人[a]，属叙利亚腓尼基族[b]。她一再求耶稣把那鬼从她女儿身上赶出去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“外邦人”。原文直译为“希腊人”；在这里，这一称谓很可能也表明她不是犹太人，并具有希腊文化背景。
    reason: lexical_alternative
  - marker: b
    text: 直译“按族类（或出身）是叙利亚腓尼基人”，即她的族裔来源属于叙利亚腓尼基。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἑλληνίς
  choice: 希腊人
  rationale: 直接保留原文“希腊女性”的称谓；在本语境中也表明她不是犹太人，但正文不将这一含义替换为较宽泛的“外邦人”。
- source_word: Συροφοινίκισσα τῷ γένει
  choice: 按出身说是叙利亚腓尼基人
  rationale: τῷ γένει 指出身、族裔来源；“按出身说”既贴近原文，也避免现代汉语中“种族”可能带来的生物化意味。
- source_word: ἠρώτα
  choice: 一再求
  rationale: 未完成过去时呈现持续或反复的请求；“一再求”自然表达其体貌，同时不过度强化为“苦苦哀求”。
- source_word: ἵνα ... ἐκβάλῃ
  choice: 求……把……赶出去
  rationale: 此处 ἵνα 从句表达请求的内容；“赶出去”符合现代汉语驱逐鬼魔的语境，并保留 ἐκβάλλω 的力度。
- source_word: τὸ δαιμόνιον
  choice: 那鬼
  rationale: 原文明确使用 δαιμόνιον；“鬼”是普通现代汉语中直接且清楚的对应，并以“那”体现定冠词所指的特定鬼魔。
- source_word: ἐκ τῆς θυγατρὸς αὐτῆς
  choice: 从她女儿身上
  rationale: 汉语通常说把鬼“从某人身上赶出去”；这样既传达 ἐκ 的离出含义，又避免生硬直译。
- source_word: δὲ
  choice: 不单独译出
  rationale: δὲ 在这里主要承接叙事、轻微转折；中文分句和上下文足以体现衔接，无须添加容易显得突兀的“现在”或强化为“但是”。
theological_decisions:
- issue: 妇人的族群身份
  choice: 同时保留“希腊人”和“按出身说是叙利亚腓尼基人”两个称谓
  alternative: 译作“外邦人，祖籍叙利亚腓尼基”
  rationale: 原文有意并列文化或宗教层面与族裔地理层面的身份信息；正文不把二者合并，也不以较宽泛的“外邦人”取代 Ἑλληνίς。
- issue: 女儿所受的侵扰
  choice: 译作“把那鬼……赶出去”
  alternative: 译作“把邪灵……赶出去”
  rationale: 遵循本节明确的 δαιμόνιον，不将其淡化或改写成原文此处未使用的“污灵”等称谓，保留经文的超自然陈述。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“她一再求耶稣”明确补出上下文中的代词所指，以免中文产生歧义；“从她女儿身上赶出去”符合现代汉语习惯。所有脚注标记均置于对应正文称谓之后。
