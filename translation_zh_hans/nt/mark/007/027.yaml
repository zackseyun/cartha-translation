  text: ⸂καὶ ἔλεγεν⸃ αὐτῇ· Ἄφες πρῶτον χορτασθῆναι τὰ τέκνα, οὐ γὰρ ⸂καλόν ἐστιν⸃ λαβεῖν τὸν ἄρτον τῶν τέκνων καὶ ⸂τοῖς κυναρίοις βαλεῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/027.yaml
  text: And he was saying to her[a], “Let the children be fed first, for it is not good to take the children’s bread and throw it to the little dogs.”
translation:
  language: zh_hans
  text: 他对她说：“先让孩子们吃饱，因为拿孩子们的饼丢给小狗[a]，是不合宜的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“家里的狗”，也可简称“狗”。希腊文使用指小形式，可能指小狗或家养的狗，而不是着重描写在外游荡觅食的野狗。
    reason: 说明 κυναρίοις 的词形特点与可译范围，避免把“小狗”误解为必然指幼犬。
lexical_decisions:
- source_word: ἔλεγεν
  choice: 说
  rationale: 未完成时在叙事中可表示当时正在进行的言说；现代汉语用“说”已能自然承载该叙事功能，若译作“不断对她说”则会过度强调反复性。
- source_word: Ἄφες
  choice: 让
  rationale: 此处为准许某事发生的命令语气；“让”简洁自然，也与后面的被动不定式相接。
- source_word: πρῶτον
  choice: 先
  rationale: 保留时间与次序上的优先性，同时不把这句话解释成对后来者的永久排斥。
- source_word: χορτασθῆναι
  choice: 吃饱
  rationale: 该词表示进食而得饱足；“吃饱”既贴合饭食场景，也比单纯“喂养”更充分地保留饱足之意。
- source_word: τὰ τέκνα
  choice: 孩子们
  rationale: 保留普通、无性别限定的家庭称谓及其比喻性，不在正文中直接解释其所指。
- source_word: καλόν ἐστιν
  choice: 合宜
  rationale: καλόν 在此不仅指一般意义上的“好”，也可指合适、得体；“不合宜”贴合家庭饭桌比喻中的秩序判断，同时不把它强化为明确的道德定罪。
- source_word: λαβεῖν
  choice: 拿
  rationale: 直接表达取走或拿起，中文自然，无须额外加入原文未明说的“夺走”。
- source_word: τὸν ἄρτον
  choice: 饼
  rationale: 在圣经时代语境中，“饼”比现代汉语的“面包”更贴近此处具体主食意象，也保留家庭饭食的比喻。
- source_word: κυναρίοις
  choice: 小狗
  rationale: 保留 κυνάριον 的指小形式及家庭场景的可能意味，但不擅自限定为幼犬。
- source_word: βαλεῖν
  choice: 丢给
  rationale: 保留 βάλλω 的投掷动作和比喻的鲜明感；“丢给”在现代汉语中自然，并比“给”更贴近原词。
theological_decisions:
- issue: “孩子们”与“小狗”的比喻所指
  choice: 正文保留家庭饭桌的比喻，不直接释为犹太人和外族人。
  alternative: 在正文中将两者解释性改译为“犹太人”和“外族人”。
  rationale: 原文以比喻表达身份与次序；保留比喻可避免把上下文推断写入正文，也保留话语本身的张力。
- issue: πρῶτον 所表达的次序
  choice: 译作“先”，明确保留优先次序。
  alternative: 省略“先”，或译成暗示永久排斥的说法。
  rationale: “先”既显示孩子们在当下的优先地位，又没有断言其他对象以后绝无所得，从而保存原文的神学与叙事张力。
- issue: καλόν ἐστιν 的规范力度
  choice: 译作“不合宜”。
  alternative: 译作“不好”或“不对”。
  rationale: “不合宜”保留关于何为恰当、合适的判断；“不对”可能强化为绝对道德判断，“不好”则在现代汉语中略显宽泛。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式保持家庭饭桌比喻的具体感；以“先”“吃饱”“不合宜”兼顾原文次序、饱足和合宜性的语义。脚注标记紧随“小狗”，与其词汇说明准确对应。
