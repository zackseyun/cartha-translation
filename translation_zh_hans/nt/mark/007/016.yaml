  text: If anyone has ears to hear, let him hear.
translation:
  language: zh_hans
  text: 人若有耳可听，就应当听。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节不见于现存最早的一些希腊文抄本（包括四世纪的西奈抄本和梵蒂冈抄本）及早期科普特文译本，却见于拜占庭多数文本、拉丁文传统和大多数叙利亚文见证。它很可能是后来的抄写者增添的，与马可福音4:9和4:23中的相同说法相呼应。
    reason: textual_critical
lexical_decisions:
- source_word: ὦτα
  choice: 耳
  rationale: 保留原文表示身体器官的复数名词及其比喻意味，指向领受和理解信息的能力；汉语用“有耳可听”自然表达，无须机械标出复数。
- source_word: ἀκουέτω
  choice: 就应当听
  rationale: 该词为第三人称单数现在时主动命令式；“应当听”既传达劝令力量，也比生硬的“让他听”更符合现代汉语。此处“听”不仅指听见声音，也含认真领受之意。
theological_decisions:
- issue: 听觉表述是否明确解释为属灵领悟
  choice: 保留“有耳可听，就应当听”的比喻表达
  alternative: 译作“有领悟力的人应当领会”
  rationale: 原文借耳和听来发出劝令，没有明说“属灵”或直接改用抽象的“领悟”；保留意象可避免把经文本身的含义范围解释得过窄。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“人若……就……”简洁对应条件句；避免使用带明显古典色彩的“凡有耳的，就应当听”。脚注标记置于整节之后，因为脚注讨论的是全节的文本存疑问题。
