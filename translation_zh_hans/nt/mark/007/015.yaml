  text: οὐδέν ἐστιν ἔξωθεν τοῦ ἀνθρώπου εἰσπορευόμενον εἰς αὐτὸν ὃ δύναται ⸂κοινῶσαι αὐτόν⸃· ἀλλὰ τὰ ⸂ἐκ τοῦ ἀνθρώπου ἐκπορευόμενά⸃ ἐστιν τὰ κοινοῦντα τὸν ⸀ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/015.yaml
  text: There is nothing outside a man that by going into him is able to defile him; rather, the things that come out from the man are what defile the man.
translation:
  language: zh_hans
  text: 没有一样从人外面进入人里面的东西能使人污秽[a]；相反，从人里面出来的，才是使人污秽的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使人污秽”也可译作“使人成为不洁净的”。这里的希腊词可指使人在礼仪洁净的意义上成为不洁，也可带有道德玷污的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδέν
  choice: 没有一样
  rationale: 表达中性单数不定代词的绝对用法，在现代汉语中自然、准确，并与后面的“能”顺畅衔接。
- source_word: ἔξωθεν τοῦ ἀνθρώπου εἰσπορευόμενον εἰς αὐτόν
  choice: 从外面进入人里面的
  rationale: 保留“外面—里面”的空间关系和分词修饰结构，也为后半句“从人里面出来的”形成鲜明对照。
- source_word: κοινῶσαι / κοινοῦντα
  choice: 使人污秽
  rationale: κοινόω在本段洁净争议中可指使人成为不洁，同时也具有道德玷污的意味；“使人污秽”兼顾这两层含义。
- source_word: ἀλλὰ
  choice: 相反
  rationale: 体现强烈的转折与纠正语气，比单用“但是”更清楚。
- source_word: τὰ ἐκ τοῦ ἀνθρώπου ἐκπορευόμενα
  choice: 从人里面出来的
  rationale: 保留复数实体化分词的概括性，不擅自把所指限定为言语、行为或特定身体之物。
- source_word: ἐστιν τὰ κοινοῦντα
  choice: 才是使人污秽的
  rationale: 用“才是”自然呈现希腊文表语结构的强调，并加强与前半句的对照。
theological_decisions:
- issue: 洁净语境中κοινόω的含义
  choice: 使人污秽
  alternative: 使人成为不洁净的
  rationale: “不洁净”更明确指向礼仪洁净范畴，但可能缩窄下文所揭示的道德含义；“污秽”既能承载洁净语境，也保留更广的伦理力度。
- issue: ἄνθρωπος的泛指表达
  choice: 人
  alternative: 一个人
  rationale: 现代汉语“人”可自然地作全人类泛指，无须用带性别色彩的“男人”；同时重复“人”，保持原文论述对象和前后呼应。
- issue: “从人里面出来的”具体指什么
  choice: 保持概括表达，不在正文中具体化
  alternative: 从人心里出来的恶念和行为
  rationale: 本节原文本身使用概括性的复数表达，具体内容到后文才展开；译文不提前解释，以保存本节的修辞张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。以“从外面进入人里面的”对照“从人里面出来的”，尽量保留原文的结构和平行关系；“才是”使转折重点在汉语中清楚自然。
