  text: ἀκυροῦντες τὸν λόγον τοῦ θεοῦ τῇ παραδόσει ὑμῶν ᾗ παρεδώκατε· καὶ παρόμοια τοιαῦτα πολλὰ ποιεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/013.yaml
  text: thus nullifying the word of God by your tradition that you have handed down[c][b][a]. And you do many other similar things.
translation:
  language: zh_hans
  text: 这样，你们就借着你们所传下来的传统[b]，使上帝的话失效[a]。你们还做许多其他类似的事。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使……失效”也可译作“废掉”、“架空”或“使……无效”。
    reason: lexical_alternative
  - marker: b
    text: “你们所传下来的”也可译作“你们所传授的”。
    reason: lexical_alternative
  - marker: c
    text: 或译“许多诸如此类的事”。
    reason: previous_rendering
lexical_decisions:
- source_word: ἀκυροῦντες
  choice: 废掉
  rationale: 表达使某事失去效力或权威的意思，承接上一节的责备；“废掉”简洁有力，也符合现代汉语表达。
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: 上帝的话
  rationale: 直接保留“上帝”与“话”的属格关系，突出其与“你们的传统”之间的对照。
- source_word: τῇ παραδόσει ὑμῶν
  choice: 借着……传统
  rationale: 将与格理解为工具用法，说明这些传统是他们废掉上帝之话的手段；“借着”在汉语中自然清楚。
- source_word: παραδόσει
  choice: 传统
  rationale: 忠实对应 παράδοσις。本节原文只说“你们的传统”，不额外加入“人的”，让上下文显明其负面性质。
- source_word: ᾗ παρεδώκατε
  choice: 自己传下来的
  rationale: 既保留 παραδίδωμι 的传递含义，又以自然的定语结构修饰“传统”；“自己”明确关系代词所指向的第二人称复数主体。
- source_word: παρόμοια τοιαῦτα πολλὰ
  choice: 许多诸如此类的事
  rationale: “诸如此类”自然传达“许多类似这样的事”，避免机械复制希腊语重叠表达所造成的汉语累赘，同时保留概括和强调。
- source_word: ποιεῖτε
  choice: 你们还做
  rationale: 用一般现在式表达持续或惯常行为；“还”自然连接前述具体指控与其他同类行为。
theological_decisions:
- issue: 耶稣所责备之“传统”的性质
  choice: 译为“自己传下来的传统”，让上下文显示这一特定传统与上帝的话相冲突。
  alternative: 译为“人的传统”。
  rationale: 原文在本节没有“人的”这一形容词，而是说“你们的传统”；不补入原文没有的限定，以免把针对特定传统的责备泛化为对一切传统的判断。
- issue: ἀκυροῦντες 对上帝之话所产生的作用
  choice: 译为“废掉”，指使其在实际遵行中失去效力。
  alternative: 译为“取消”或“使……无效”。
  rationale: “废掉”保留强烈的控诉语气，但不暗示人能够从本体上消灭上帝的话；语境所指是他们借传统架空其约束力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“废掉”保留原文控诉力度；“自己传下来的传统”形成同源词意上的呼应，但避免生硬复制希腊语词形；末句用“诸如此类”简练呈现原文略带重叠的强调。所有脚注标记均置于相应正文之后。
