  yaml_path: translation/nt/mark/007/001.yaml
  text: And the Pharisees and some of the scribes[a], who had come from Jerusalem, gather around him.
translation:
  language: zh_hans
  text: 法利赛人和一些文士从耶路撒冷来，聚集到他那里。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: （由上下文自然承接，不单独译出）
  rationale: καί在马可叙事中常用于推进情节；本句用现代汉语直接起句即可自然承接上文，若机械译作“并且”反显生硬。
- source_word: συνάγονται πρὸς αὐτὸν
  choice: 聚集到他那里
  rationale: “聚集”体现συνάγονται，“到他那里”保留πρός所表达的趋向和以耶稣为聚集目标的关系；比“围住他”更中性，不额外暗示敌意或包围。
- source_word: οἱ Φαρισαῖοι
  choice: 法利赛人
  rationale: 采用现代中文圣经和历史论述中通行的群体名称。
- source_word: τινες τῶν γραμματέων
  choice: 几个文士
  rationale: τινες与部分属格表示文士群体中的若干人；“几个文士”在现代汉语中自然，并保留人数未定的含义。
- source_word: γραμματέων
  choice: 文士
  rationale: 这是福音书语境中γραμματεύς的传统且简洁的对应词；“律法教师”等译法会进一步解释其职能。
- source_word: ἐλθόντες ἀπὸ Ἱεροσολύμων
  choice: 从耶路撒冷来
  rationale: 简洁表达分词所指的先行动作及来源地；句序使他们先来、继而聚集的关系清楚，同时不把分词过度解释为更具体的时间关系。
