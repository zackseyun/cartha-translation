  source_fidelity: “不再准他……做任何事”准确传达οὐκέτι、ἀφίετε及οὐδὲν ποιῆσαι。惟原文开头没有与“就”相当的词；且本句在上下文中明确指该人的父母，中文宜明确为“自己的父亲或母亲”，避免泛指任何父母的歧义。
  naturalness: “准他”为现代汉语可接受，但“准许他”在庄重、通行的经文语体中更完整自然。“为自己的父亲或母亲做任何事”保留原文宽泛性，且语义清楚。
  terminology: 不应在正文直接译为“供养”，因为ποιῆσαι…τῷ πατρὶ ἢ τῇ μητρί的表述本身较宽；脚注可说明本段语境所涵盖的实际或经济支持。
