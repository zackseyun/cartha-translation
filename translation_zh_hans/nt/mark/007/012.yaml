  yaml_path: translation/nt/mark/007/012.yaml
  text: you no longer allow him to do anything for his father or mother,[a]
translation:
  language: zh_hans
  text: 你们不再准许他为自己的父亲或母亲做任何事。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“做任何事来帮助自己的父亲或母亲。”这里较宽泛的希腊文措辞，在本段语境中可以包括实际或经济上的供养。
    reason: 词义替代：说明上下文所含的帮助、供养意味，同时不在正文中缩窄原文。
lexical_decisions:
- source_word: οὐκέτι
  choice: 不再
  rationale: 自然保留停止先前状态的时间含义。
- source_word: ἀφίετε
  choice: 准
  rationale: 此处表示允许、准许；结合否定语境，表达他们不准那人采取行动，而非“饶恕”或“离开”。
- source_word: αὐτὸν
  choice: 他
  rationale: 保留阳性单数宾语，指上文中作出“各耳板”宣告的人。
- source_word: οὐδὲν ποιῆσαι
  choice: 做任何事
  rationale: 在“不再准”之后以“任何事”自然表达希腊文否定不定代词与不定式的组合。
- source_word: τῷ πατρὶ ἢ τῇ μητρί
  choice: 为父亲或母亲
  rationale: 与格在此表达受益对象；中文无需补出所有格也能按上下文自然理解为其本人的父母，并保留原文宽泛的“为……做事”。
theological_decisions:
- issue: 是否明说各耳板语境中的经济供养含义
  choice: 正文保留宽泛措辞“为父亲或母亲做任何事”
  alternative: “做任何事帮助父亲或母亲”或“供养父亲或母亲”
  rationale: 上下文确实涉及实际或经济支持，但本节希腊文本身用语宽泛。正文不将含义缩窄，脚注说明语境中可能包含的具体层面。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“准”简洁自然；语序贴合现代汉语，并保留原文概括性的表达。
