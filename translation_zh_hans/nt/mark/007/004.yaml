  text: καὶ ἀπ’ ⸀ἀγορᾶς ἐὰν μὴ ⸀βαπτίσωνται οὐκ ἐσθίουσιν, καὶ ἄλλα πολλά ἐστιν ἃ παρέλαβον κρατεῖν, βαπτισμοὺς ποτηρίων καὶ ξεστῶν καὶ χαλκίων ⸂καὶ κλινῶν⸃—
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/004.yaml
  text: 'And when they come from the marketplace[a], they do not eat unless they wash themselves[b], and there are many other things that they have received to keep: washings of cups and pitchers and copper vessels and dining couches—'
translation:
  language: zh_hans
  text: 他们从集市回来，若不洗濯[a]，就不吃东西。他们还领受并持守许多别的规矩：洗濯杯、罐、铜器和餐榻[b]——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“把自己浸洗”。这里的希腊词常译作“施洗”，但在本节的洁净习俗语境中，指礼仪性的洗濯。
    reason: lexical_alternative
  - marker: b
    text: 有些抄本没有“和餐榻”。
    reason: textual_variant
lexical_decisions:
- source_word: ἀγορᾶς
  choice: 集市
  rationale: 指公开交易的市场区域；“集市”简洁自然，也符合当时公共市场的语境。
- source_word: βαπτίσωνται
  choice: 洗过身
  rationale: 此处所说的是从集市回来后、吃饭前按洁净习俗进行的身体洗濯；用“洗过身”既表达中间语态涉及自身的动作，也避免误解为基督教洗礼。
- source_word: παρέλαβον κρατεῖν
  choice: 领受了……要遵守
  rationale: 保留“领受”与“持守”两层意思，表明这些规矩是承接而来并持续奉行的，没有改写成着重传给别人的“传下来”。
- source_word: βαπτισμοὺς
  choice: 洗濯
  rationale: 这里指器具按礼俗进行的清洗；“洗濯”比“洗礼”准确，也不把具体方式限定为完全浸没。
- source_word: ξεστῶν
  choice: 罐
  rationale: 该词指一种盛装用的器皿，确切形制并不确定；“罐”具体易懂，又不过度限定。
- source_word: χαλκίων
  choice: 铜器
  rationale: 概括由铜或铜合金制成的器皿，既贴近词义，又符合现代汉语习惯。
- source_word: κλινῶν
  choice: 餐榻
  rationale: κλίνη可指床或榻；在饮食与洁净习俗的语境中，很可能是用餐时斜倚的榻，“餐榻”可交代其用途。
- source_word: ἄλλα πολλά
  choice: 许多别的规矩
  rationale: 希腊文直译为“许多别的事”；结合前后文，这些事是所遵守的传统规矩。译作“规矩”使中文自然，但不进一步赋予褒贬色彩。
theological_decisions:
- issue: 洁净语境中 βαπτίσωνται / βαπτισμοὺς 的含义
  choice: 译作“洗过身”及“洗濯”
  alternative: “浸洗自己”及“浸洗”；或“给自己施洗”及“洗礼”
  rationale: 本节讨论法利赛人的礼仪洁净习俗，并非基督教洗礼。正文采用一般性的“洗”类词，避免不合语境的圣礼联想；脚注保留“浸洗”这一可能译法，也不武断规定具体操作方式。
- issue: κλινῶν 的文本异文
  choice: 正文保留“和餐榻”，并以脚注注明异文
  alternative: 正文省略“和餐榻”
  rationale: SBLGNT正文以异文标记列出该短语；正文照所给底本保留，同时明确说明有些抄本没有，避免掩盖文本证据。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“洗过身”是日常可懂的表达，“洗濯”则适合概括器具的礼仪性清洗；“餐榻”保留古代斜倚用餐的文化背景。破折号照应原文句子尚未结束。脚注标记均置于对应词语之后。
