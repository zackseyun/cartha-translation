  rationale: 删去给καί增义的“于是”，将“反而”改为更直接对应ἀλλά的“却”，并将“吃饭”改为“吃饼”以保留ἄρτος。脚注仍说明κοινός的礼仪含义和“饼”在语境中的泛指可能性。
