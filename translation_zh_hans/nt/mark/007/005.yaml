  text: ⸀καὶ ἐπερωτῶσιν αὐτὸν οἱ Φαρισαῖοι καὶ οἱ γραμματεῖς· Διὰ τί ⸂οὐ περιπατοῦσιν οἱ μαθηταί σου⸃ κατὰ τὴν παράδοσιν τῶν πρεσβυτέρων, ἀλλὰ ⸀κοιναῖς χερσὶν ἐσθίουσιν τὸν ἄρτον;
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/005.yaml
  text: And the Pharisees and the scribes asked him[a], “Why do your disciples not walk according to the tradition of the elders, but eat bread with unclean hands?”
translation:
  language: zh_hans
  text: 法利赛人和文士问他：“你的门徒为什么不照古人的传统行事，却用不洁净的手吃饼呢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπερωτῶσιν
  choice: 问
  rationale: 这是叙事中的历史现在时；汉语自然地用“问”表达该言语行为，不额外加入反复追问的意味。
- source_word: γραμματεῖς
  choice: 文士
  rationale: 这是福音书语境中对犹太律法学者这一公认群体的传统而简洁的称呼。
- source_word: Διὰ τί
  choice: 为什么
  rationale: 符合现代汉语疑问句的自然表达。
- source_word: περιπατοῦσιν
  choice: 行事
  rationale: 原词直译为“行走”，此处是按某种规范生活、行事的惯用义；译作“行事”自然，并保留行为方式的重点。
- source_word: κατὰ τὴν παράδοσιν
  choice: 照……传统
  rationale: 表达κατά加宾格所表示的遵照某一既定规范。
- source_word: τῶν πρεσβυτέρων
  choice: 古人的
  rationale: 此处指以往具有权威的前辈所传下来的传统；“古人”可避免让现代读者误以为是当时教会中的长老。
- source_word: κοιναῖς χερσὶν
  choice: 用不洁净的手
  rationale: κοινός在这里不是指手上有污垢，而是指礼仪上属于俗的、受到玷污的状态；“不洁净”能传达礼仪洁净争议，同时脚注保留其字面色彩。
- source_word: ἐσθίουσιν τὸν ἄρτον
  choice: 吃饭
  rationale: 字面是“吃饼”，但在此为吃饭的惯常表达；正文译为自然现代汉语，脚注注明字面形式。
theological_decisions:
- issue: κοινός所指的礼仪状态
  choice: 译为“不洁净”，并以脚注说明其礼仪含义
  alternative: 玷污的；俗的；普通的
  rationale: 争论关乎法利赛传统中的礼仪洁净，而非卫生、道德邪恶或手本身肮脏；此译保留争议的宗教背景，不预先引入后文的神学结论。
- issue: τῶν πρεσβυτέρων的身份
  choice: 古人
  alternative: 长老；先辈
  rationale: 这里是传统所归于的前代权威人士，不宜使读者联想到基督教会职分；“古人”与上下文中的传统相合。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“法利赛人”“文士”保留标准圣经术语；“照古人的传统行事”自然表达希腊语的生活行为习语；“吃饭”避免生硬的“吃饼”，脚注则保存字面证据与礼仪背景。
