review_pass:
  verdict: revise
  source_fidelity: “问”“照……传统行事”准确传达ἐπερωτῶσιν及κατὰ τὴν παράδοσιν。 “古人的传统”在中文圣经语境中可指前代权威所传的传统。可是τὸν ἄρτον的字面对象是“饼”；正文译作“吃饭”虽可解释为转喻，却弱化了原文明确的“饼”。“于是”也给单纯连接词καί增添了未明说的承接意味。
  naturalness: 修订后的句子保持现代、庄重且自然的普通话。以“却”对应ἀλλά，并把问号置于引语之内，更符合中文引语标点习惯。
  terminology: “法利赛人”“文士”均为合宜的固定术语。“不洁净”可用来表达此处礼仪上的κοινός，但须由脚注明确不是卫生意义，也不应与ἀκάθαρτος完全等同。
  issues:
  - severity: low
    issue: “于是”超出καί的连接语义。
    rationale: 原文只作“和／而”；删去“于是”能避免暗示更强的时间或因果推进。
  - severity: medium
    issue: “吃饭”没有保留τὸν ἄρτον（饼）。
    rationale: “饼”在此可以带有进食的广义含义，但原文仍明确使用该词；译为“吃饼”可在不牺牲自然度的前提下保留该词汇。
  revised_text: 法利赛人和文士问他：“你的门徒为什么不照古人的传统行事，却用不洁净的手吃饼呢？”
  revised_footnotes:
  - marker: a
    text: “不洁净的手”直译为“俗的手”，指礼仪上不洁净，并非只是手没有洗干净。“吃饼”原文也可泛指进食。
    reason: 说明κοιναῖς的礼仪含义，并保留τὸν ἄρτον的字面用词及其可能的广义用法。
