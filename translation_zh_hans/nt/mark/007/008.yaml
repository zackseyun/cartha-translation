  text: ⸀ἀφέντες τὴν ἐντολὴν τοῦ θεοῦ κρατεῖτε τὴν παράδοσιν τῶν ⸀ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/008.yaml
  text: Leaving the commandment of God[a], you hold fast to the tradition of men.
translation:
  language: zh_hans
  text: 你们撇下上帝的诫命，却紧守人的传统。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφέντες
  choice: 撇下
  rationale: 该词为不定过去时主动分词，在这里表示把某事搁置、舍弃；“撇下”自然简洁，也保留了责备的力度，而不像“废弃”那样过度强化。
- source_word: τὴν ἐντολὴν τοῦ θεοῦ
  choice: 上帝的诫命
  rationale: ἐντολή在宗教争议语境中指具有约束力的神圣命令；“诫命”比一般的“命令”更贴合语域。属格τοῦ θεοῦ表明诫命属于并源自上帝。
- source_word: κρατεῖτε
  choice: 紧守
  rationale: κρατέω在此表示坚定持守、牢牢依附；“紧守”既体现力度，又符合现代汉语表达。
- source_word: τὴν παράδοσιν
  choice: 传统
  rationale: παράδοσις指传承下来的规条或惯例；“传统”准确简明，不额外加入经文本身未明说的评价。
- source_word: τῶν ἀνθρώπων
  choice: 人的
  rationale: ἄνθρωποι在此泛指人类，与上帝形成来源上的鲜明对照，并非专指男性；现代汉语“人的”自然保留了神与人的对比。
theological_decisions:
- issue: 上帝的诫命与人的传统之间的对比
  choice: 保留“上帝的诫命”与“人的传统”的直接对照，并以“却”显明转折
  alternative: 译作“人所传的规矩”或把本节扩展成对一切传统的普遍否定
  rationale: 原文责备的是撇下上帝诫命而紧守人类传统的行为；译文应保留尖锐对比，却不把论断扩大为对所有传统本身的否定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“撇下……却紧守……”结构紧凑，重现分词与主要动词之间的对照；“人”在汉语中自然泛指人类，无须添加性别说明脚注。
