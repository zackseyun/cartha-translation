  text: Μωϋσῆς γὰρ εἶπεν· Τίμα τὸν πατέρα σου καὶ τὴν μητέρα σου, καί· Ὁ κακολογῶν πατέρα ἢ μητέρα θανάτῳ τελευτάτω·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/010.yaml
  text: For Moses said[a], ‘Honor your father and your mother,’ and[b], ‘Whoever speaks evil of father or mother must surely die.’
translation:
  language: zh_hans
  text: 因为摩西说：“要孝敬你的父亲和母亲”，又说：“咒骂父亲或母亲的，必须处死。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “咒骂”也可译作“恶言辱骂”或“毁谤”；末句所用的是表示死亡刑罚的法律公式，也可译作“必须死”。
    reason: 说明κακολογέω的词义范围，并保留θανάτῳ τελευτάτω法律公式的另一种译法，同时避免将其中一种惯用表达误称为唯一的字面译法。
lexical_decisions:
- source_word: Μωϋσῆς
  choice: 摩西
  rationale: 采用现代中文圣经与一般读者熟悉的标准人名译法。
- source_word: γὰρ
  choice: 因为
  rationale: 承接上文，为耶稣的论证说明根据；“因为”自然保留其解释性连接作用。
- source_word: εἶπεν
  choice: 说
  rationale: 作为引述摩西律法的常规引语动词，简洁自然。
- source_word: Τίμα
  choice: 要孝敬
  rationale: 在父母诫命的语境中，“孝敬”既表达尊重，也含有以实际行动尊荣、奉养之意，是现代中文中稳妥且庄重的对应。
- source_word: τὸν πατέρα σου καὶ τὴν μητέρα σου
  choice: 你的父亲和母亲
  rationale: 明确保留原文中两个带属格代词的并列宾语。
- source_word: Ὁ κακολογῶν
  choice: 咒骂……的
  rationale: κακολογέω可指恶言毁谤、辱骂或咒诅；在所引律法的严肃法律语境中，“咒骂”简洁自然，同时脚注保留较宽的词义范围。
- source_word: πατέρα ἢ μητέρα
  choice: 父亲或母亲
  rationale: 原文此处没有明说物主代词，中文也可自然省略，并保留“或”的选择关系。
- source_word: θανάτῳ τελευτάτω
  choice: 必须处死
  rationale: 这是带法律命令效力的死亡刑罚公式；中文“必须处死”自然表达其法定刑罚性质。脚注同时说明较贴近希腊文表层形式的译法。
theological_decisions:
- issue: θανάτῳ τελευτάτω这一法律刑罚公式的译法
  choice: 必须处死
  alternative: 必须死；必要死无疑
  rationale: 该句引自律法中的刑罚规定，第三人称命令式具有强制性的法律效力。“必须处死”在中文中最清楚地传达法定死刑，但不进一步说明执行者或方式；脚注保留希腊文较直接的“必须死”这一可能译法。
- issue: κακολογῶν的语义范围
  choice: 咒骂
  alternative: 恶言辱骂；毁谤
  rationale: 该词语义可涵盖说坏话、辱骂和咒诅。在父母与死刑规定的引文语境中选用“咒骂”，但以脚注避免把词义范围限定得过窄。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“孝敬”延续诫命语境中的成熟中文表达；引文以简洁命令句呈现。脚注集中交代两个真实的词汇与法律措辞歧义，正文不额外加入执行主体或刑罚方式。
