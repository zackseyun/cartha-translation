  source_fidelity: 正文准确表达了κωφός的“耳聋”和μογιλάλος的“说话困难”，没有把后者夸大为“哑”。不过脚注把希腊文的两个并列形容词直译成仿佛指“两个人”，不符合其同为阳性单数宾格、共同修饰同一受词的语法关系。
  naturalness: 正文基本自然；将“求”调整为“恳求”更能传达παρακαλοῦσιν在此处恳切请求的语气。“把手按在他身上”自然且保留单数“手”。
  terminology: “耳聋、说话困难”清楚、现代，并恰当地避免“聋哑”这一会过度说明原文的译法。
