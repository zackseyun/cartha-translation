  text: καὶ φέρουσιν αὐτῷ κωφὸν ⸀καὶ ⸀μογιλάλον, καὶ παρακαλοῦσιν αὐτὸν ἵνα ἐπιθῇ αὐτῷ τὴν χεῖρα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/032.yaml
  text: And they brought to him a man who was deaf and had difficulty speaking[a], and they begged him to lay his hand on him.
translation:
  language: zh_hans
  text: 有人把一个耳聋、说话困难的人带到耶稣那里，恳求耶稣把手按在他身上。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一个耳聋且说话困难的人。”
    reason: lexical_alternative
lexical_decisions:
- source_word: φέρουσιν
  choice: 带着……来
  rationale: 这是马可叙事中常见的历史现在时；汉语叙事无需标明过去时。“带着……来”自然表达把人带到耶稣面前。
- source_word: αὐτῷ
  choice: 来见耶稣
  rationale: 与表示移动的动词连用，指带到耶稣那里。为避免汉语代词指向不清，明确译出“耶稣”。
- source_word: κωφόν
  choice: 耳聋
  rationale: κωφός在此指听觉丧失；后面的μογιλάλον另行说明言语障碍，因此不译作“聋哑”。
- source_word: μογιλάλον
  choice: 说话困难
  rationale: 这个罕见词表示说话艰难或有言语障碍，并非完全不能说话；“说话困难”准确而易懂。
- source_word: παρακαλοῦσιν
  choice: 求
  rationale: 在医治语境中表示恳切请求。“求”简洁自然，并保留其迫切意味。
- source_word: ἵνα ἐπιθῇ αὐτῷ τὴν χεῖρα
  choice: 把手按在他身上
  rationale: 表达请求的内容；“手”保留希腊文单数，且“按在……身上”是现代汉语中自然的医治动作表述。
theological_decisions:
- issue: 此人的障碍性质
  choice: 耳聋，并且说话困难
  alternative: 又聋又哑
  rationale: κωφός和μογιλάλος分别描述听觉与言语状况；后者表示说话艰难，不足以断定此人完全不能说话。
translation_notes:
  register: 采用现代、庄重而通俗的叙事语言。“有人”概括未明说身份的复数主语；两次明确使用“耶稣”，以消除连续男性代词在汉语中的歧义。脚注保留原文并列结构可能带来的字面张力，同时说明语境所指。
