  text: ⸂Ἐκεῖθεν δὲ⸃ ἀναστὰς ἀπῆλθεν εἰς τὰ ⸀ὅρια ⸀Τύρου. καὶ εἰσελθὼν εἰς οἰκίαν οὐδένα ἤθελεν γνῶναι, καὶ οὐκ ἠδυνήθη λαθεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/024.yaml
  text: From there he got up and went away to the region of Tyre[a]. After entering a house, he wanted no one to know it[c][b], yet he could not remain hidden.
translation:
  language: zh_hans
  text: 耶稣从那里起身，往推罗地区[a]去了。他进了一所房子，不愿让任何人知道[b]，却无法不被人察觉[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“往推罗的辖区”或“往推罗边境一带”。希腊词可指推罗所属的地区或边境区域，不一定只指边界线。
    reason: lexical_alternative
  - marker: b
    text: 直译“他不愿任何人知道”；希腊文没有明说所知道的内容，语境可指他的到来、所在或行踪。
    reason: lexical_alternative
  - marker: c
    text: 或译“却无法逃过人的注意”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐκεῖθεν δὲ
  choice: 从那里
  rationale: Ἐκεῖθεν表示从先前地点离开；δέ在此只是轻微承接，现代汉语无需另译。
- source_word: ἀναστὰς ἀπῆλθεν
  choice: 起身……去了
  rationale: 保留ἀναστὰς的具体动作，同时以自然的叙事汉语表达随后的离去。
- source_word: εἰς τὰ ὅρια Τύρου
  choice: 往推罗境内
  rationale: ὅρια在这里可指与推罗相关的地域或辖区，不必限于边界线；“境内”简洁自然，但其范围仍有词义上的弹性。
- source_word: εἰσελθὼν εἰς οἰκίαν
  choice: 进了一所房子
  rationale: 分词表示先后发生的动作；οἰκίαν无冠词，译作不特定的“一所房子”。
- source_word: οὐδένα ἤθελεν γνῶναι
  choice: 不愿让任何人知道他在那里
  rationale: 希腊文没有明说“知道”的内容，语境所指是耶稣的所在或到来；正文作最低限度的补足，并以脚注说明原文的省略。
- source_word: οὐκ ἠδυνήθη λαθεῖν
  choice: 却无法隐藏行踪
  rationale: λανθάνω表示不被察觉、避开注意；“隐藏行踪”在现代汉语中自然地表达他未能继续不为人知。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。“耶稣”作为主语由上下文补出，使独立经节清楚；“却”体现他的意愿与实际结果之间的转折。所有词义歧义均以脚注保留。
