source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῇ· Διὰ τοῦτον τὸν λόγον ὕπαγε, ἐξελήλυθεν ⸂ἐκ τῆς θυγατρός σου τὸ δαιμόνιον⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/029.yaml
  text: And he said to her[a], “Because of this word, go; the demon has gone out of your daughter.”
translation:
  language: zh_hans
  text: 他对她说：“因你这句话[a]，去吧，鬼已经从你女儿身上出去了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为你这样说。”
    reason: λόγος在这里指妇人刚才的回答，既可较贴近形式地译为“这句话”，也可按语境译为“这样说”。
lexical_decisions:
- source_word: καὶ εἶπεν αὐτῇ
  choice: 他对她说
  rationale: καί在此承接叙事；汉语不必机械译出“并且”。根据上下文补出省略的主语“他”，并直接表达对她说话。
- source_word: Διὰ τοῦτον τὸν λόγον
  choice: 因你这句话
  rationale: διά加宾格在这里表达原因；λόγος指妇人刚才所说的话。“因你这句话”既保留单数“话”的形式，也自然传达因由。希腊文直译为“因这句话”，但汉语加“你”可清楚指出话语的说话者，未改变所指。
- source_word: ὕπαγε
  choice: 去吧
  rationale: 该现在时命令式在这里有准许离去、打发回去的作用。“去吧”简洁自然；译作“回去吧”虽符合情境，却增加了希腊文未明说的方向。
- source_word: ἐξελήλυθεν
  choice: 已经……出去了
  rationale: 完成时表示动作已经完成且结果持续有效。“已经……出去了”兼顾完成状态与赶鬼语境中的空间意象。
- source_word: ἐκ τῆς θυγατρός σου
  choice: 从你女儿身上
  rationale: ἐκ标明鬼离开的对象或所在之处。现代汉语用“从……身上出去”自然表达这种离开人的意象。
- source_word: τὸ δαιμόνιον
  choice: 鬼
  rationale: δαιμόνιον明确指邪灵或鬼。“鬼”是简洁、直接且符合现代汉语圣经语境的对应词，不借用本句没有出现的“不洁之灵”。
theological_decisions:
- issue: 是否弱化赶鬼的超自然陈述
  choice: 鬼已经从你女儿身上出去了
  alternative: 邪恶的力量已经离开你女儿了
  rationale: 原文明确使用δαιμόνιον，并说它从女儿身上出去；译文保留具人格性的鬼及其离开的陈述，不把它解释为疾病或非人格化的恶势力。
- issue: 妇人的话与女儿得释放之间的关系
  choice: 因你这句话
  alternative: 鉴于你这样回答
  rationale: διά加宾格表达原因或根据，但本节没有进一步解释这句话如何与医治相关。译文保留原文简洁而具有张力的因果表达，不擅自加入“信心”“谦卑”等神学解释。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事表达。“去吧”保留命令兼准许离去的语气；“已经……出去了”突出完成且持续的结果。脚注置于相关短语之后，避免误以为注释针对“她”。
