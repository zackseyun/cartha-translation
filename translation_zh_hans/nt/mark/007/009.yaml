id: MRK.7.9
reference: Mark 7:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ ἔλεγεν αὐτοῖς· Καλῶς ἀθετεῖτε τὴν ἐντολὴν τοῦ θεοῦ, ἵνα τὴν παράδοσιν ὑμῶν ⸀τηρήσητε·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/009.yaml
  text: And he was saying to them[a], “You neatly set aside the commandment of God so that you may keep your tradition.”
translation:
  language: zh_hans
  text: 他又对他们说：“你们可真会废弃上帝的诫命，好持守你们的传统！[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“你们做得可真好，竟废弃上帝的诫命，为要持守你们的传统！”希腊文的“好”在这里是反讽，并非赞许。
    reason: 说明 Καλῶς 的字面形式及其反讽语气，避免读者误解为耶稣在称赞他们。
lexical_decisions:
- source_word: ἔλεγεν
  choice: 又对他们说
  rationale: 未完成时在叙事中可表示持续说话，也常用于引出接续的话语；现代汉语用“又对他们说”自然承接上文，而不生硬地译成“不断说”。
- source_word: Καλῶς
  choice: 可真会
  rationale: 此处按语境是尖锐反讽，并非赞许。“可真会”在现代汉语中能清楚传达讽刺语气，同时保留对方仿佛很擅长这样做的意味。
- source_word: ἀθετεῖτε
  choice: 废弃
  rationale: 该词可指拒绝、搁置或使之失效。“废弃”表达主动排除并使诫命不再起作用，也与后面的“持守”形成鲜明对照。
- source_word: τὴν ἐντολὴν τοῦ θεοῦ
  choice: 上帝的诫命
  rationale: “诫命”保留宗教和权威语域；所属结构自然明确，并与“你们的传统”形成对照。
- source_word: ἵνα
  choice: 好
  rationale: 在此引出目的；“好持守……”是简洁自然的现代汉语目的结构，没有把目的关系弱化为单纯结果。
- source_word: τὴν παράδοσιν ὑμῶν
  choice: 你们的传统
  rationale: παράδοσις 在本语境指群体所传承的人为传统。直译为“传统”准确、易懂，并保留与上帝诫命之间的权威冲突。
- source_word: τηρήσητε
  choice: 持守
  rationale: 该词指遵守、维护。“持守”既表达持续遵行，也适合有关宗教传统的庄重语境，并与“废弃”构成修辞对照。
theological_decisions:
- issue: 耶稣话语的语气
  choice: 将 Καλῶς 译作反讽性的责备：“可真会”
  alternative: 按字面译为表面赞许：“你们做得好，竟废弃……”
  rationale: 上下文表明耶稣正在谴责以人的传统排除上帝诫命的做法。译文应显明反讽而不误导为真实赞许，但脚注保留较贴近字面的另一种表达。
- issue: ἵνα 所表达的关系
  choice: 保留目的意味：“好持守”
  alternative: 理解为结果：“以致保住”
  rationale: ἵνα 通常引出目的或预期结果；本句把废弃诫命与维护传统紧密相连。采用目的表达，不额外判断行为者是否明确自觉其全部后果。
translation_notes:
  register: 采用自然、庄重而有力度的现代标准汉语。“可真会”明确传达原文反讽；句末感叹号体现责备力度，但不增添原文没有的教派性解释。脚注标记置于整句引语末尾。
