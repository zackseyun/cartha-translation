  text: μοιχεῖαι⸃, πλεονεξίαι, πονηρίαι, δόλος, ἀσέλγεια, ὀφθαλμὸς πονηρός, βλασφημία, ὑπερηφανία, ἀφροσύνη·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/022.yaml
  text: adulteries[a], greed, wickedness, deceit, sensuality, an evil eye, slander, pride[b], foolishness.
translation:
  language: zh_hans
  text: 奸淫、贪婪、种种恶行、诡诈、放荡、嫉妒[a]、毁谤[b]、骄傲、愚昧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“邪恶的眼”；这是一个习语，可指嫉妒、吝啬，或心怀恶意的眼光。
    reason: lexical_alternative
  - marker: b
    text: 或译“亵渎”。原词既可指毁谤人，也可指说亵渎上帝的话。
    reason: alternative_reading
lexical_decisions:
- source_word: μοιχεῖαι
  choice: 奸淫
  rationale: 原文为复数，指奸淫行为；现代汉语用集合性名词“奸淫”更自然，且不削弱其行为层面的含义。
- source_word: πλεονεξίαι
  choice: 贪婪
  rationale: 指贪得无厌、总想攫取更多的欲望；“贪婪”清楚自然，适合恶德清单。
- source_word: πονηρίαι
  choice: 种种恶行
  rationale: 原文为复数，表示邪恶的多种表现；“种种恶行”既保留复数意味，也比生硬的“邪恶们”自然。
- source_word: δόλος
  choice: 诡诈
  rationale: 指蓄意欺骗或以诡计害人；“诡诈”简洁、庄重，符合上下文。
- source_word: ἀσέλγεια
  choice: 放荡
  rationale: 指无耻而不受约束的行为，常含性方面的意味；“放荡”在现代汉语中自然，并保留其道德力度。
- source_word: ὀφθαλμὸς πονηρός
  choice: 嫉妒
  rationale: 字面为“邪恶的眼”，在犹太及希腊语境中是表示嫉妒、吝啬或恶意眼光的习语；正文译出其主要语用意义，脚注保留原有意象及其他可能含义。
- source_word: βλασφημία
  choice: 毁谤
  rationale: 可指针对人的毁谤辱骂，也可指针对上帝的亵渎；此处恶德清单中“毁谤”自然，但以脚注保留“亵渎”的可能。
- source_word: ὑπερηφανία
  choice: 骄傲
  rationale: 指自高自大、傲慢；“骄傲”简洁常用，在此贬义语境中明确。
- source_word: ἀφροσύνη
  choice: 愚昧
  rationale: 指道德和实践上的无知无见识，而非单指智力不足；“愚昧”能表达这一层面。
theological_decisions:
- issue: βλασφημία在恶德清单中的指向
  choice: 正文译作“毁谤”
  alternative: 亵渎
  rationale: 该词既可指伤害人的毁谤性言语，也可指冒犯上帝的亵渎。上下文并未明确限定对象，因此正文采用较符合人际恶行清单的“毁谤”，并用脚注保留神学上重要的另一可能。
- issue: ὀφθαλμὸς πονηρός的习语意义
  choice: 正文译作“嫉妒”
  alternative: 恶眼；吝啬或心怀恶意的眼光
  rationale: 逐字译为“恶眼”在现代汉语中容易被理解为施法或迷信概念，偏离原语境。译出“嫉妒”较易理解，同时脚注保留字面意象及其较宽的语义范围。
translation_notes:
  register: 采用现代、庄重而易懂的恶德清单体。汉语不以名词复数词尾对应希腊语复数，必要处用“种种”保留复数意义。正文避免生硬直译会造成的误解，并以脚注呈现真实的词义歧义。
