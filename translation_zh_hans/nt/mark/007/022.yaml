  terminology: “放荡”充分涵盖 ἀσέλγεια 所含无耻、不受约束且常带性意味的行为；“骄傲”在此贬义语境中可传达 ὑπερηφανία；“愚昧”也能表达 ἀφροσύνη 的道德性、实践性不明智。需仅调整脚注 b 的锚点，使之实际附着于 βλασφημία 的译词“毁谤”，而非“骄傲”。
