  text: Καὶ προσκαλεσάμενος ⸀πάλιν τὸν ὄχλον ἔλεγεν αὐτοῖς· ⸀Ἀκούσατέ μου πάντες καὶ ⸀σύνετε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/014.yaml
  text: And calling the crowd to him again, he was saying to them, “Listen to me, all of you, and understand.”
translation:
  language: zh_hans
  text: 耶稣又叫众人到他跟前，对他们说：“你们都要听我说，也要明白。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: 叫……到他跟前
  rationale: 该分词表示把人召到自己这里；此译法自然表达动作方向，并保留其先于主句动作的关系。
- source_word: πάλιν
  choice: 又
  rationale: 简明保留“再次”的叙事衔接。
- source_word: ἔλεγεν
  choice: 说
  rationale: 未完成时在这里可呈现随后的直接引语，不必机械译成“不断地说”；中文用“说”最自然，同时不排除持续或展开中的言说。
- source_word: Ἀκούσατέ μου πάντες
  choice: 你们都要听我说
  rationale: 保留命令语气及 πάντες 所强调的全体听众；“听我说”符合现代汉语表达。
- source_word: σύνετε
  choice: 要明白
  rationale: 保留命令语气，表达领会、理解所听内容的要求。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语自然的叙事语言。直接引语中的两个命令以“都要……也要……”表达其并列关系和强调；本节无须脚注。
