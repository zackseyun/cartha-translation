  text: ⸀καὶ ⸀ἠνοίγησαν αὐτοῦ αἱ ἀκοαί, καὶ ἐλύθη ὁ δεσμὸς τῆς γλώσσης αὐτοῦ, καὶ ἐλάλει ὀρθῶς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/035.yaml
  text: And his ears were opened[a], and the bond of his tongue was released[c][b], and he spoke plainly.
translation:
  language: zh_hans
  text: 他的耳朵就开了[a]，他的舌头的束缚也解开了[b]，他就说话清楚了[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他的听觉恢复了。”原文“耳朵／听觉”既可指耳朵，也可指听觉功能。
    reason: lexical_alternative
  - marker: b
    text: 直译：“他舌头的束缚解开了”；意即妨碍他说话的障碍被除去了。
    reason: lexical_alternative
  - marker: c
    text: 或译：“他说得正确”、“恰当”或“清晰”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠνοίγησαν
  choice: 开了
  rationale: 保留不定过去时被动式所表达的突然恢复；汉语“开了”在此自然地带有结果和被动意味，无须生硬地译成“被打开”。
- source_word: αἱ ἀκοαί
  choice: 双耳
  rationale: 复数名词可指耳朵，也可指听觉；医治叙事中“双耳”具体、自然，同时脚注保留“听觉”的可能。
- source_word: ἐλύθη
  choice: 解开了
  rationale: 对应 λύω 的解除、解开之意，与 δεσμός 的束缚意象相配，且清楚表达限制已被除去。
- source_word: ὁ δεσμὸς τῆς γλώσσης αὐτοῦ
  choice: 舌头的束缚
  rationale: 保留原文“束缚”的具体比喻，不直接改写为临床性的“言语障碍”，避免过度解释。
- source_word: ἐλάλει
  choice: 他说话
  rationale: 未完成时在这里呈现医治后的说话状态；现代汉语用“他说话”简洁自然，不额外加入“开始”。
- source_word: ὀρθῶς
  choice: 清楚
  rationale: 在言语得医治的语境中，表示说得正常、正确、清晰；“清楚”最自然，同时脚注列出“正确、清晰”等语义可能。
theological_decisions:
- issue: 舌头得医治的表达应保留比喻还是直接解释
  choice: 舌头的束缚也解开了
  alternative: 他的言语障碍也消除了／他的舌头也自由了
  rationale: 原文以“束缚—解开”的具体意象描述医治。正文保留这一意象，既传达神迹，也不把比喻悄然改成临床诊断。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“双耳就开了”延续圣经叙事中可理解的身体意象；“舌头的束缚也解开了”保留原文比喻；三个脚注标记均置于对应正文之后。
