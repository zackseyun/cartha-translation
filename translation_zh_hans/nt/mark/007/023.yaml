  text: πάντα ταῦτα τὰ πονηρὰ ἔσωθεν ἐκπορεύεται καὶ κοινοῖ τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/023.yaml
  text: All these evil things come out from within and defile the man[a].
translation:
  language: zh_hans
  text: 这一切恶事都是从里面出来，并且使人污秽。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντα ταῦτα τὰ πονηρά
  choice: 这一切恶事
  rationale: πάντα、ταῦτα与名词化的复数形容词共同构成强调而全面的表达，回指上文所列各样恶行；“这一切恶事”既保留具体的复数含义，也符合现代汉语。
- source_word: ἔσωθεν
  choice: 从里面
  rationale: 该副词指明来源在人的内部，并与上下文所谈外在进入之物形成对照；“从里面”自然清楚。
- source_word: ἐκπορεύεται
  choice: 出来
  rationale: 尽管希腊语动词为单数，但与中性复数主语搭配是常见句法；“出来”准确表达由内部向外发出的动态。
- source_word: κοινοῖ
  choice: 使……污秽
  rationale: 在马可福音本段洁净与污秽的语境中，κοινόω表示使人陷于礼仪兼道德意义上的污秽；“使……污秽”比字面的“使……成为普通”准确，也与上下文相称。
- source_word: τὸν ἄνθρωπον
  choice: 人
  rationale: ἄνθρωπος在此为单数泛指，指任何人。现代汉语“人”本身不标示性别，并能自然保留泛指含义，无需添加脚注。
theological_decisions:
- issue: τὸν ἄνθρωπον在关于人之污秽的普遍陈述中如何表达
  choice: 人
  alternative: 那个人；一个人；世人
  rationale: 原文使用单数的ἄνθρωπος作泛指，并非专指男性或某一个人。汉语“人”既简洁又涵盖所有人，也避免把普遍陈述误解为特定对象。
- issue: κοινοῖ所表达的污秽性质
  choice: 使人污秽
  alternative: 使人不洁净
  rationale: 上下文以洁净规范为背景，同时把污秽的根源落在人里面所出的恶事上，因此既有礼仪背景，也带有道德含义。“污秽”保留这种张力，不把它缩减为单纯卫生状态或仅礼仪不洁。
translation_notes:
  register: 采用自然、庄重而通俗的现代标准汉语。句式紧贴原文的来源—行动—结果结构；“都是”体现πάντα与ταῦτα组合所带的概括和强调。
