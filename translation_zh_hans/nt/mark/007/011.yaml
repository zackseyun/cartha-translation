  text: ὑμεῖς δὲ λέγετε· Ἐὰν εἴπῃ ἄνθρωπος τῷ πατρὶ ἢ τῇ μητρί· Κορβᾶν, ὅ ἐστιν Δῶρον, ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/011.yaml
  text: But you say[a], ‘If a man says to his father or his mother, “Corban” (that is, a gift)[b], whatever you might have benefited from me—’
translation:
  language: zh_hans
  text: 你们却说：“人若对父亲或母亲说：‘各耳板[a]’（意思是‘礼物’[b]），你可从我这里得到的任何帮助——”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “各耳板”指献给上帝的礼物。本段所举的情形中，这一称谓被用来使本可给父母的帮助不再供其使用。
    reason: cultural_note
  - marker: b
    text: “礼物”也可译作“供物”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς δὲ λέγετε
  choice: 你们却说
  rationale: δὲ承接上文形成对比；λέγετε为现在时，在这里自然表达他们一贯所教导或准许的做法。
- source_word: Ἐὰν εἴπῃ ἄνθρωπος
  choice: 人若……说
  rationale: ἐὰν加虚拟语气引出假设情形；“人若”既保留单数代表性用法，也符合现代汉语的庄重叙述。
- source_word: τῷ πατρὶ ἢ τῇ μητρί
  choice: 对父亲或母亲
  rationale: 两个与格名词表示说话的对象，并保留原文父母双方的平衡结构。
- source_word: Κορβᾶν
  choice: 各耳板
  rationale: 原文保留了闪语宗教术语，随后才加解释；采用中文圣经传统中较为人熟悉的音译，以保留其历史文化特指性。
- source_word: ὅ ἐστιν Δῶρον
  choice: 意思是“礼物”
  rationale: ὅ ἐστιν是作者给读者的释义；δῶρον基本义为“礼物”，其献给上帝的宗教含义由语境和脚注说明。
- source_word: ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς
  choice: 无论你本可从我这里得到什么帮助
  rationale: 关系代词与ἐὰν构成不定表达，译作“无论……什么”；ὠφεληθῇς指父母原可从儿女得到的帮助或供养，不将其限缩为金钱。句末破折号保留本节尚待下一节完成的句法悬置。
theological_decisions:
- issue: 涉及奉献及家庭责任时，如何处理Κορβᾶν这一誓献术语
  choice: 正文保留音译“各耳板”，并依照马可自己的解释注明“意思是‘礼物’”
  alternative: 在正文中直接译作“献给上帝的礼物”或“供物”
  rationale: 希腊文本有意保留闪语词并另加释义。照此结构翻译可保存历史宗教背景，又不把后世关于誓愿具体效力的理解加入正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“人若”保持经文语体但不过分古雅；“帮助”兼容物质供养和其他实际益处。引号与破折号清楚呈现话中之话，并保留第11节在句法上未完、需由第12节接续的特点。
