  text: ὅτι οὐκ εἰσπορεύεται αὐτοῦ εἰς τὴν καρδίαν ἀλλ’ εἰς τὴν κοιλίαν, καὶ εἰς τὸν ἀφεδρῶνα ἐκπορεύεται; —⸀καθαρίζων πάντα τὰ βρώματα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/019.yaml
  text: because it does not enter into his heart but into his stomach[a], and goes out into the latrine"—thus cleansing all foods.
translation:
  language: zh_hans
  text: 因为它不是进入人的心里，而是进入肚子里，然后排到厕所里去。”——这样就洁净了各样食物。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或理解为“这样就排净了各样食物”，即末句指消化和排泄的过程，而不是马可所作的解释。
    reason: alternative_reading
lexical_decisions:
- source_word: καρδίαν
  choice: 心
  rationale: 直译为“心”，保留内在之人与消化器官之间的对比，不把其含义缩窄为“思想”或“内心”。
- source_word: κοιλίαν
  choice: 肚腹
  rationale: 在消化语境中自然明确，又比现代解剖学意味较强的“胃”更能涵盖原词所指的腹部、消化系统。
- source_word: ἀφεδρῶνα
  choice: 茅厕
  rationale: 具体表达排泄之处，语体庄重而易懂；避免“下水道”所暗示的现代管道设施。
- source_word: καθαρίζων
  choice: 这样就洁净了
  rationale: 保留分词的结果意味，并采用无明确主语的汉语表达，以尽量保留它究竟是叙述者的解释还是指消化排泄过程的句法歧义。
- source_word: βρώματα
  choice: 各样食物
  rationale: 体现希腊文复数，适合上下文所谈不同类别的食物。
- source_word: αὐτοῦ
  choice: 人的
  rationale: 原文阳性单数代词回指所谈之人；现代汉语以泛指的“人的”表达更自然，也避免不必要的性别突出。
- source_word: εἰσπορεύεται / ἐκπορεύεται
  choice: 进入 / 排入
  rationale: 保留一进一出的动态对照；在排泄语境中将后者译为“排入”，比笼统的“出去”更清楚。
theological_decisions:
- issue: καθαρίζων πάντα τὰ βρώματα 的解释
  choice: 正文译作“这样就洁净了各样食物”，不明说主语
  alternative: 理解为消化排泄过程“排净了各样食物”
  rationale: 阳性单数分词常被理解为马可的解释性插语，说明耶稣由此使所有食物成为洁净；但将其联系于前述消化排泄过程，在句意上也有可能。正文保留较直接且可开放理解的措辞，脚注说明另一种读法，不替读者消除这项具有神学意义的歧义。
translation_notes:
  register: 采用现代、庄重而通俗的叙述语言。“肚腹”和“茅厕”具体清楚；末句刻意不补出“耶稣宣告”等原文没有明说的内容，以保存句法与神学上的张力。
