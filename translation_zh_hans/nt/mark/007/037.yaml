  text: καὶ ὑπερπερισσῶς ἐξεπλήσσοντο λέγοντες· Καλῶς πάντα πεποίηκεν, καὶ τοὺς κωφοὺς ποιεῖ ἀκούειν ⸀καὶ ἀλάλους λαλεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/037.yaml
  text: And they were utterly astonished[a], saying, “He has done everything well[b]. He makes even the deaf hear and the mute speak.”
translation:
  language: zh_hans
  text: 他们惊讶万分，说：“他把一切都做得很好[a]！他使聋人听见，也使不能说话的人说话[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他把一切都做得很好”也可译作“他所做的一切都好”；这句话可能使人联想到圣经中对上帝作为的称颂。
    reason: lexical_alternative
  - marker: b
    text: 这句话使人联想到以赛亚书35:5–6；那里描述上帝施行拯救时，聋子的耳必开通，不能说话者的舌头必能歌唱。
    reason: cross_reference
lexical_decisions:
- source_word: ὑπερπερισσῶς
  choice: 万分
  rationale: 这个强烈程度副词表示“超乎寻常、到了极点”；“惊讶万分”既自然，又保留其强化语气。
- source_word: ἐξεπλήσσοντο
  choice: 惊讶
  rationale: 未完成时描写众人持续处于强烈震惊之中；与“万分”连用，准确传达其力度。
- source_word: λέγοντες
  choice: 说
  rationale: 该分词引出众人惊讶时所说的话，译作“说”简洁自然。
- source_word: Καλῶς
  choice: 好
  rationale: 此处评价耶稣所做之事的品质；“好”贴近原文，也保留可能的经文回响。
- source_word: πάντα
  choice: 一切
  rationale: 保留原文概括全面的范围，比仅指当前一件神迹更宽广。
- source_word: πεποίηκεν
  choice: 所做的
  rationale: 完成时指已经做成而其结果仍具现实意义；“他所做的一切”在现代汉语中自然，并避免把 ποιέω 限定为“创造”。
- source_word: τοὺς κωφοὺς
  choice: 聋人
  rationale: 在本段医治语境中指不能听见的人；用现代汉语简明表达。
- source_word: ποιεῖ ἀκούειν
  choice: 使……听见
  rationale: ποιεῖ 加不定式表达使动关系，“使……听见”准确保留原文结构。
- source_word: ἀλάλους
  choice: 哑巴
  rationale: 指不能说话的人；“哑巴”是普通读者易懂的现代汉语，并与具体医治语境相符。
- source_word: λαλεῖν
  choice: 说话
  rationale: 直接表达恢复言语能力，符合现代汉语习惯。
- source_word: καὶ
  choice: 也
  rationale: 连接“聋人听见”与“哑巴说话”两个并列结果；“也”自然呈现其递进兼并列作用，不额外强化原文。
theological_decisions:
- issue: “他所做的一切都好”可能同时带有创造叙事与以赛亚书复兴应许的回响
  choice: 正文按原文直译其广泛评价，并把相关经文回响放入脚注说明
  alternative: 在正文中明确译出“上帝般的创造之工”或直接标明预言应验
  rationale: 原文没有明说创世记或以赛亚书，也没有在此句直接陈述耶稣身份；保留措辞的开放性，可让潜在的经文回响存在而不把暗示提升为明说。
- issue: καί是否译作强调性的“甚至”
  choice: 译作并列性的“也”
  alternative: 译作“甚至”，如“他甚至使聋人听见，使哑巴说话”
  rationale: 此处希腊文自然连接两个并列的医治结果；“也”更少解释性，同时不排除整句话具有惊叹和高潮意味。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“惊讶万分”传达原文异常强烈的惊叹；引语中用感叹号呈现群众的惊叹语气。“他所做的一切都好”保持简洁和经文感，同时不把潜在的创造或预言回响解释进正文。
