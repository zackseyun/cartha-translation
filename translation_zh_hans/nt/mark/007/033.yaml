  text: καὶ ἀπολαβόμενος αὐτὸν ἀπὸ τοῦ ὄχλου κατ’ ἰδίαν ἔβαλεν τοὺς δακτύλους αὐτοῦ εἰς τὰ ὦτα αὐτοῦ καὶ πτύσας ἥψατο τῆς γλώσσης αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/033.yaml
  text: And taking him aside from the crowd privately[a], he put his fingers into his ears, and after spitting[b], he touched his tongue.
translation:
  language: zh_hans
  text: 耶稣把他从人群中单独带到一旁[a]，将手指放进他的耳朵，又吐了唾沫[b]，摸了他的舌头。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“私下带到一旁。”
    reason: lexical_alternative
  - marker: b
    text: 希腊文只说他“吐了唾沫，摸了他的舌头”，并未明确说耶稣把唾沫抹在那人的舌头上。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολαβόμενος αὐτὸν ἀπὸ τοῦ ὄχλου
  choice: 把他从人群中……带到一旁
  rationale: 该分词短语表示把这人从众人中分开；“带到一旁”在现代汉语中自然，也保留了离开人群的意思。
- source_word: κατ’ ἰδίαν
  choice: 单独
  rationale: 该短语表示私下、与众人分开；“单独”与“带到一旁”搭配自然，且不把含义限缩为秘密行事。
- source_word: ἔβαλεν τοὺς δακτύλους αὐτοῦ εἰς τὰ ὦτα αὐτοῦ
  choice: 将手指放进他的耳朵
  rationale: βάλλω在此处是“放入”，不是猛烈地“插”或“投”；译文明确保留具体的身体动作。
- source_word: πτύσας
  choice: 又吐了唾沫
  rationale: 该不定过去时分词表示在摸舌头之前或与之相连发生的动作；“吐了唾沫”符合现代汉语，但不说明唾沫落在哪里。
- source_word: ἥψατο τῆς γλώσσης αὐτοῦ
  choice: 摸了他的舌头
  rationale: ἅπτομαι加属格在此表示触摸；“摸了”简明自然，所指是那人的舌头。
theological_decisions:
- issue: 耶稣医治动作的描述
  choice: 照原文直接叙述吐唾沫和摸舌头两个动作，不说明唾沫是否抹在那人的舌头上。
  alternative: 译作“用唾沫摸他的舌头”或“把唾沫抹在他的舌头上”。
  rationale: 希腊文只明确说耶稣吐了唾沫，随后摸那人的舌头，并未明说唾沫的去向或这些动作的象征、医疗意义；译文应保留这种叙事上的克制与含混。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“耶稣”作为本节动作主体在中文中明示，以避免连续代词造成歧义；“又”自然连接连续动作。所有脚注标记均置于正文相应位置。
