  text: καὶ ἀναβλέψας εἰς τὸν οὐρανὸν ἐστέναξεν, καὶ λέγει αὐτῷ· Εφφαθα, ὅ ἐστιν Διανοίχθητι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/034.yaml
  text: And looking up to heaven[a], he sighed and said to him, “Ephphatha,” that is[b], “Be opened.”
translation:
  language: zh_hans
  text: 他仰望天上，叹了口气[a]，对他说：“以法大[b]！”意思是：“开了吧！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“呻吟”；此词可指深沉的叹息或呻吟。
    reason: 保留ἐστέναξεν的词义幅度，并锚定所译词语。
  - marker: b
    text: “以法大”是亚兰语，意思是“开了吧！”
    reason: 说明马可保留的亚兰语原话，并锚定音译词。
lexical_decisions:
- source_word: ἀναβλέψας εἰς τὸν οὐρανόν
  choice: 抬头望天
  rationale: 自然地表达向上观看的动作，并保留分词所表示的先行动作；此处语境指向“天”而不只是天空。
- source_word: ἐστέναξεν
  choice: 深深叹息
  rationale: στενάζω可指叹息或呻吟；“深深叹息”既传达内在重负和可闻的气息，又不过度限定为痛苦呻吟。
- source_word: λέγει αὐτῷ
  choice: 对那人说
  rationale: 将叙事性现在时按现代汉语叙事习惯译出，并明确αὐτῷ指受医治的那个人。
- source_word: Εφφαθα
  choice: 以法大
  rationale: 保留马可所记的亚兰语声音形式，采用适合现代普通话的音译，随后照原文给出释义。
- source_word: Διανοίχθητι
  choice: 开了吧
  rationale: 保留第二人称单数被动命令的含义；“开了吧”比“要开”更能体现被开启的语态，同时适合直接命令的语境。
theological_decisions:
- issue: αὐτῷ的指称
  choice: 对那人说
  alternative: 理解为间接向那人的耳朵或言语机能发令
  rationale: 希腊语与上下文最自然地指向那位耳聋舌结的人；译文保留对人的直接称呼，不把隐含的身体部位写入正文。
- issue: “开了吧”的隐含对象
  choice: 保持原文不说明具体是耳朵、舌头还是整个人
  alternative: 明确译为“耳朵开了吧”或“你要开通”
  rationale: διανοίχθητι没有明说主语所涉及的具体机能；保留这种简练和张力，避免把上下文推断写成原文明示内容。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“以法大”保留原话的声音质感，“开了吧”直接简洁。脚注标记置于整句之后，同时说明音译及词义替代。
