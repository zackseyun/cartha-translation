  text: ἡ δὲ ἀπεκρίθη καὶ λέγει αὐτῷ· ⸀Κύριε, ⸀καὶ τὰ κυνάρια ὑποκάτω τῆς τραπέζης ⸀ἐσθίουσιν ἀπὸ τῶν ψιχίων τῶν παιδίων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/028.yaml
  text: But she answered and said to him[a], “Lord[b], even the little dogs under the table eat from the children's crumbs.”
translation:
  language: zh_hans
  text: 她却回答他说：“主啊[a]，桌子底下的小狗[b]也吃孩子们的碎屑。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“先生”。希腊语κύριε既可意为“主”，也可用作尊敬的称呼。
    reason: alternative_reading
  - marker: b
    text: 希腊语用的是指小词形式，可指小狗或家中饲养的狗。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη καὶ λέγει αὐτῷ
  choice: 回答他说
  rationale: 合并表达希腊文“回答并对他说”，既保留回应与说话两层意思，又符合现代汉语叙事习惯；不机械复制历史现在时。
- source_word: Κύριε
  choice: 主啊
  rationale: 保留κύριε作为对耶稣的称呼“主”，并用“啊”自然呈现汉语直接呼语；该词在语境中也可能只是尊称。
- source_word: καὶ
  choice: 也
  rationale: 这里表示小狗同样能得到食物，译作“也”自然体现妇人顺着比喻作出的补充回应，同时不把语气过度解释为让步。
- source_word: κυνάρια
  choice: 小狗
  rationale: 该词是κύων的指小形式，可指小狗或家中饲养的狗；“小狗”保留其指小色彩，又避免擅自限定为幼犬。
- source_word: ὑποκάτω τῆς τραπέζης
  choice: 桌子底下
  rationale: 准确而自然地表达空间位置。
- source_word: ἐσθίουσιν
  choice: 吃
  rationale: 现在时在这里表达一般或惯常情形，汉语用“吃”即可。
- source_word: ἀπὸ τῶν ψιχίων
  choice: 吃……的碎屑
  rationale: ψιχίων指细小食物碎屑；ἀπό与“吃”连用表示取食来源，汉语无需机械译出“从”。
- source_word: τῶν παιδίων
  choice: 孩子们的
  rationale: 保留属格对“碎屑”的修饰，不增添原文未明说的“掉下”或“食物”。
theological_decisions:
- issue: 妇人以κύριε称呼耶稣的含义
  choice: 主啊
  alternative: 先生
  rationale: κύριε既可作为“主”的称号，也可用作礼貌称呼。正文采用传统且与上下文相称的“主啊”，脚注保留“先生”的可能，避免把此处的基督论含义规定得过满。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“她却回答他说”保持经文叙事风格；引语简洁，保留妇人回应中顺着耶稣比喻申辩的张力。所有脚注标记均置于其所说明的词语之后。
