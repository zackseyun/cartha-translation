  text: μάτην δὲ σέβονταί με, διδάσκοντες διδασκαλίας ἐντάλματα ἀνθρώπων·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/007.yaml
  text: But they worship me in vain[a], teaching as doctrines the commandments of men.
translation:
  language: zh_hans
  text: 他们敬拜我却是徒然的；他们把人的诫命当作教义[a]来教导。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“教导人的诫命作为教义。”
    reason: 原文将“教义”和“人的诫命”紧密并置；此译法保留其较凝缩的表达，而正文清楚呈现人为诫命被当作教义教导的意思。
lexical_decisions:
- source_word: μάτην
  choice: 枉然
  rationale: 表示“徒然、毫无实效”。“枉然”简洁庄重，并保留先知引文对这种敬拜无效的严厉判断。
- source_word: δὲ
  choice: 也是
  rationale: 此处承接上一节“嘴唇尊敬、心却远离”的对比与结论。汉语用“也是”结合“枉然”较自然地呈现语势；对立关系由上下文清楚表达。
- source_word: σέβονταί με
  choice: 他们敬拜我
  rationale: σέβομαι在以神为对象时指敬奉、敬拜；直译为“敬拜我”准确而自然。
- source_word: διδάσκοντες
  choice: 来教导
  rationale: 现在分词说明这种枉然敬拜所伴随或赖以实行的行为；用“因为……来教导”表达其解释性关联，同时不把因果推得过强。
- source_word: διδασκαλίας
  choice: 当作教义
  rationale: 与ἐντάλματα形成紧密关系，意思是把人的诫命作为应受权威教导的内容。“当作教义”使压缩的希腊语关系在现代汉语中清楚可懂。
- source_word: ἐντάλματα ἀνθρώπων
  choice: 人的诫命
  rationale: ἐντάλματα指具有权威色彩的命令或规条，ἀνθρώπων表示其来源是人。“人的诫命”保留与神之权威相对的宗教语气；“人”在此泛指人类，并非特指男性。
theological_decisions:
- issue: 神圣敬拜与人为权威之间的对照
  choice: 把人的诫命当作教义来教导
  alternative: 所教导的教义，不过是人的诫命
  rationale: 原文凝缩地把“教义/教导”与“人的诫命”并置，重点在于人为命令被赋予教义权威。正文以自然汉语明确这一关系，但脚注保留另一种更贴近引文句法的表达，避免过度限定其语法关联。
translation_notes:
  register: 采用现代、庄重且普通读者易懂的表达。“枉然”保留经文引语的凝练力度；“教义”“诫命”维持宗教语境中的权威色彩。脚注标记置于相关分句之后。
