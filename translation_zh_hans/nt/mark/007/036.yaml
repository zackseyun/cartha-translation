  text: καὶ διεστείλατο αὐτοῖς ἵνα μηδενὶ ⸀λέγωσιν· ὅσον δὲ ⸂αὐτοῖς διεστέλλετο, αὐτοὶ⸃ μᾶλλον περισσότερον ἐκήρυσσον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/036.yaml
  text: And he ordered them to tell no one. But the more he ordered them[a], the more abundantly they proclaimed it.
translation:
  language: zh_hans
  text: 耶稣严嘱他们不要告诉任何人。然而，他越是严嘱他们，他们就越发广为传扬。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διεστείλατο / διεστέλλετο
  choice: 嘱咐
  rationale: 该动词在这里表示郑重而明确地发出指示。“嘱咐”在现代汉语中自然，并保留命令的分量；结合后文“越是”也能体现未完成时所表达的反复劝止。
- source_word: ἵνα μηδενὶ λέγωσιν
  choice: 不要告诉任何人
  rationale: 自然表达命令的内容，并按上下文将 λέγω 理解为把所发生的事告诉别人。
- source_word: ὅσον δὲ ... μᾶλλον περισσότερον
  choice: 然而，他越是……他们反而越发……
  rationale: 用“越是……反而越发……”重现希腊文的程度关联和鲜明反差，同时保留 μᾶλλον περισσότερον 的加强语气。
- source_word: ἐκήρυσσον
  choice: 广为传扬
  rationale: κηρύσσω 指公开宣扬；“传扬”比“讲道”少一层宗教技术色彩，“广为”体现公开扩散及加强副词的力度。
- source_word: αὐτοῖς / αὐτοί
  choice: 他们
  rationale: 按复数代词直译，所指为当时在场并听到嘱咐的人，不擅自缩窄具体对象。
theological_decisions:
- issue: 耶稣要求保密的命令及所谓弥赛亚隐秘主题
  choice: 将其直接译为真实、郑重的禁止，不解释耶稣为何要求保密
  alternative: 译成“严厉警告”以加强严厉程度，或在正文中说明要求沉默的神学动机
  rationale: 原文明确呈现耶稣的吩咐与众人更广传扬之间的张力，却没有在本节解释命令的动机；译文应保留这种张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“嘱咐”避免“命令”可能带来的过强行政色彩，又不弱化郑重指示；“反而越发广为传扬”清楚呈现违背吩咐及传播加剧的反差。
