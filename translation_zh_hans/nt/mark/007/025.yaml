  text: ⸂ἀλλ’ εὐθὺς ἀκούσασα⸃ γυνὴ περὶ αὐτοῦ, ἧς εἶχεν τὸ θυγάτριον αὐτῆς πνεῦμα ἀκάθαρτον, ἐλθοῦσα προσέπεσεν πρὸς τοὺς πόδας αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/025.yaml
  text: But immediately a woman whose little daughter had an unclean spirit[a], having heard about him[c][b], came and fell at his feet.
translation:
  language: zh_hans
  text: 可是，有一个妇人，她的小女儿[a]身上有污灵[b]；她一听说他的事，就立刻前来，俯伏在他脚前。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“女儿”。希腊语 θυγάτριον 是“女儿”的指小形式，可表示年幼或亲昵。
    reason: lexical_alternative
  - marker: b
    text: 或译“邪灵”；传统上也理解为“鬼”。
    reason: alternative_reading
  - marker: c
    text: 也可译作：“可是，有一个妇人听说了他的事后，立刻前来俯伏在他脚前；她的小女儿身上有污灵。”
    reason: previous_rendering
lexical_decisions:
- source_word: ἀλλ’
  choice: 可是
  rationale: 保留承接上文而略带转折的叙事语气；“可是”在现代汉语中自然、清楚。
- source_word: εὐθὺς ἀκούσασα ... περὶ αὐτοῦ
  choice: 她一听说他的事，就立刻前来
  rationale: “一……就……”自然表达听见消息后随即采取行动的紧迫感，同时“听说他的事”准确传达 περί αὐτοῦ 所指的有关耶稣的消息。
- source_word: γυνὴ
  choice: 有一个妇人
  rationale: 原文无冠词，在叙事中首次引入此人；“有一个妇人”符合现代汉语叙事习惯。
- source_word: θυγάτριον
  choice: 小女儿
  rationale: 保留指小或带亲昵意味的指小形式，也明确她与妇人的母女关系。
- source_word: πνεῦμα ἀκάθαρτον
  choice: 污灵
  rationale: 保留马可反复使用的术语及“不洁净”的语义，不直接解释为“鬼”，以免缩窄原文表达。
- source_word: ἐλθοῦσα
  choice: 前来
  rationale: 按叙事视角表达她来到耶稣所在之处，简洁自然。
- source_word: προσέπεσεν πρὸς τοὺς πόδας αὐτοῦ
  choice: 俯伏在他脚前
  rationale: 既保留身体动作，也传达恳求与谦卑的姿态，而不把具体姿势解释得过细。
theological_decisions:
- issue: πνεῦμα ἀκάθαρτον 的译法
  choice: 污灵
  alternative: 邪灵；鬼
  rationale: “污灵”直接保留原文“不洁净的灵”这一马可特色用语；“鬼”虽可能指同一类存在，却比原词更具解释性，“邪灵”则偏重邪恶而弱化“不洁净”的语义。
- issue: 女儿与污灵的关系
  choice: 身上有污灵
  alternative: 被污灵附着
  rationale: 采用接近原文“有”的表述，避免把其作用方式进一步明确为原文未在本句直接说明的“附身”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“妇人”保持经文语体但不过分古雅；以“一听说……就立刻……”化解希腊语分词结构在汉语中的生硬，同时保留马可叙事的紧迫感。所有代词均保留上下文指向，不额外加入原文没有的称谓。
