  text: ἔλεγεν δὲ ὅτι Τὸ ἐκ τοῦ ἀνθρώπου ἐκπορευόμενον ἐκεῖνο κοινοῖ τὸν ἄνθρωπον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/020.yaml
  text: And he was saying, “What comes out from the man—that defiles the man.”
translation:
  language: zh_hans
  text: 他又说：“从人里面出来的，那才使人污秽[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使人不洁净。”原文动词属于洁净与污秽的用语，指使人沾染污秽或成为不洁净。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: 他又说
  rationale: 未完成时在叙事中可表示持续说话；现代汉语以“说”自然承接上下文，“又”同时传达 δὲ 的轻微连接作用，避免生硬地译成“他一直说”。
- source_word: δὲ
  choice: 又
  rationale: 此处是轻微的叙事连接，并非强烈转折；“又”自然延续前文。
- source_word: ὅτι
  choice: 引号
  rationale: ὅτι 引出说话内容，汉语以直接引语表达最自然。
- source_word: Τὸ ἐκ τοῦ ἀνθρώπου ἐκπορευόμενον
  choice: 从人里面出来的
  rationale: 将冠词化分词结构译为名词性短语；“从人里面”结合上下文清楚表达来源，也保留 ἐκ 的方向意义。
- source_word: ἀνθρώπου / ἄνθρωπον
  choice: 人
  rationale: ἄνθρωπος 在此具有泛指、代表性含义；汉语“人”自然涵盖人类个体，并能保留原文两次用词形成的呼应。
- source_word: ἐκεῖνο
  choice: 那才
  rationale: 指示代词具有强调作用；“那才”在现代汉语中突出真正造成污秽的是从人里面出来的东西，而未增添新的命题内容。
- source_word: κοινοῖ
  choice: 使人污秽
  rationale: 此处 κοινόω 属洁净与污秽语域。“使……污秽”兼具礼仪背景和道德语境中的可理解性；“使……不洁净”作为可行替代保留于脚注。
theological_decisions:
- issue: κοινόω 所表达的洁净／污秽范畴
  choice: 使人污秽
  alternative: 使人不洁净
  rationale: 上下文同时触及犹太洁净观念及内在道德污秽。“污秽”在正文中简洁自然，而“不洁净”更直显礼仪洁净语域，故列作脚注异译，不将两层含义强行限定为其中之一。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“从人里面出来的，那才……”保留原文的指示强调与前后“人”的修辞呼应；避免把泛指的 ἄνθρωπος 性别化。
