  text: ἔσωθεν γὰρ ἐκ τῆς καρδίας τῶν ἀνθρώπων οἱ διαλογισμοὶ οἱ κακοὶ ἐκπορεύονται, ⸂πορνεῖαι, κλοπαί, φόνοι,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/021.yaml
  text: 'For from within[a], out of the heart of men, evil thoughts come out: sexual immoralities, thefts, murders[b],'
translation:
  language: zh_hans
  text: 因为从里面，就是从人的心里，发出种种恶念：淫乱[a]、偷盗、凶杀，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “淫乱”原文为复数，广指各种不正当的性行为。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσωθεν
  choice: 从里面
  rationale: 保留内在来源的空间性意象，并与上下文所谈外在与内在的污秽形成对照。
- source_word: γὰρ
  choice: 因为
  rationale: 表明本句是在解释并支持前一句的论断。
- source_word: καρδίας
  choice: 心
  rationale: 保留圣经人论中表示人内在思想、意志与道德中心的核心意象，不将其解释性改写为“内心深处”等。
- source_word: ἀνθρώπων
  choice: 人的
  rationale: 此处复数属格泛指人类；现代汉语以“人的心里”自然、准确地表达普遍所指，并不限定性别。
- source_word: διαλογισμοὶ οἱ κακοὶ
  choice: 种种恶念
  rationale: διαλογισμοί 指内在的思想、盘算或意念；“恶念”简洁保留其道德意味，添加“种种”自然体现希腊语复数。
- source_word: ἐκπορεύονται
  choice: 发出
  rationale: 与“从里面、从心里”搭配自然，也保留由内向外而出的动态意象。
- source_word: πορνεῖαι
  choice: 淫乱
  rationale: 概括各种不合正当规范的性行为，不狭义限定为某一种行为；汉语集合性名词无需生硬复数化。
- source_word: κλοπαί
  choice: 偷盗
  rationale: 自然表达各类盗窃行为，并符合恶行清单的简洁文体。
- source_word: φόνοι
  choice: 凶杀
  rationale: 表达带有罪责的非法杀人，比宽泛的“杀人”更贴近该词在恶行清单中的道德与法律分量。
theological_decisions:
- issue: ἀνθρώπων 在普遍性人论陈述中的所指
  choice: 译作“人的”，泛指所有人
  alternative: 译作“人们的”或“世人的”
  rationale: 希腊语虽为语法上的阳性复数，却在此泛指人类。现代汉语“人的心里”既忠实又不制造男性专指，也不额外加入“世人”可能带出的神学色彩。
- issue: πορνεῖαι 的范围与复数形式
  choice: 译作“淫乱”
  alternative: 译作“各种不正当的性行为”或“淫乱的行为”
  rationale: 原词广指不正当的性行为，不能无根据地缩窄到某一现代类别。“淫乱”保留传统且概括的道德含义；汉语中它可作集合性行为名词，故不必机械体现复数。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。以“因为从里面，就是从人的心里”保留原文先概括、后具体说明来源的结构；恶行清单使用简洁并列名词。
