  text: καὶ ἀπελθοῦσα εἰς τὸν οἶκον αὐτῆς εὗρεν τὸ ⸂παιδίον βεβλημένον ἐπὶ τὴν κλίνην καὶ τὸ δαιμόνιον ἐξεληλυθός⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/030.yaml
  text: And when she went away to her house, she found the child lying on the bed[a], and the demon gone.
translation:
  language: zh_hans
  text: 她回到自己家里，看见孩子躺在床上，鬼已经出去了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπελθοῦσα εἰς τὸν οἶκον αὐτῆς
  choice: 她回到自己家里
  rationale: 不定过去时分词表示先于主句动作的行动；中文以顺承句式自然表达这一先后关系。“回到自己家里”准确传达她离开耶稣所在之处、前往自己住所的语境。
- source_word: εὗρεν
  choice: 看见
  rationale: εὑρίσκω在此表示她到家后所见到的情形；“看见”比“发现”更自然，也不额外暗示意外或搜寻。
- source_word: παιδίον
  choice: 孩子
  rationale: 本节使用中性名词παιδίον，而非明确表示女儿或女孩的词；“孩子”保留原文措辞，性别可由上下文得知。
- source_word: βεβλημένον ἐπὶ τὴν κλίνην
  choice: 躺在床上
  rationale: 完成时被动分词在这一结构中着重描写孩子处于床上的状态；“躺在床上”自然表达结果状态，避免“被扔在床上”所可能带来的不必要暴力含义。
- source_word: δαιμόνιον
  choice: 鬼
  rationale: δαιμόνιον指邪灵性的鬼；“鬼”是简洁、通行且符合本段叙事语境的现代汉语译法，同时不把本节词语改成前文的“不洁之灵”。
- source_word: ἐξεληλυθός
  choice: 已经出去了
  rationale: 完成时主动分词表达鬼已经出去、此刻不再附在孩子身上的完成结果；“已经出去了”同时保留“出去”的动作和持续至当时的结果状态。
theological_decisions:
- issue: 赶鬼结果的表述
  choice: 鬼已经出去了
  alternative: 鬼已经离开了
  rationale: 原文完成时分词既陈述鬼出去这一动作已经完成，也表明它当时已不在孩子身上。“已经出去了”较直接地保留ἐξέρχομαι的方向性，而不增添赶逐过程的细节。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。句式依照希腊文的事件次序展开，不生硬复制分词结构；对完成时的结果意义用“已经”明确表达。
