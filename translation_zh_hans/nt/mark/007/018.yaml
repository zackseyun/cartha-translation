  text: καὶ λέγει αὐτοῖς· Οὕτως καὶ ὑμεῖς ἀσύνετοί ἐστε; οὐ νοεῖτε ὅτι πᾶν τὸ ἔξωθεν εἰσπορευόμενον εἰς τὸν ἄνθρωπον οὐ δύναται αὐτὸν κοινῶσαι,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/018.yaml
  text: And he said to them[b][a], “So are you also without understanding? Do you not understand that everything that enters into the man from outside is not able to defile him,”
translation:
  language: zh_hans
  text: 耶稣对他们说：“连你们也这样不明白吗？难道你们不晓得，从外面进入人里面的一切，都不能使他污秽[a]吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使他成为不洁净的。”这里的希腊语动词含有礼仪上不洁净的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: 说
  rationale: 希腊文为叙事中的历史现在时；现代汉语叙事用“说”即可自然表达，不必显式标注时态。
- source_word: Οὕτως καὶ ὑμεῖς
  choice: 连你们也这样
  rationale: “连……也”体现 καί 与强调代词 ὑμεῖς 所带出的责问语气，“这样”对应 οὕτως，并承接上文。
- source_word: ἀσύνετοί
  choice: 不明白
  rationale: 表达缺乏领悟力，并与下句 νοεῖτε 形成有意的语义重复；语气严肃但不过度强化为“愚昧”。
- source_word: νοεῖτε
  choice: 晓得
  rationale: 表示理解、领会；用“晓得”避免汉语中紧邻重复“不明白／明白”，同时保留认知意义。
- source_word: πᾶν τὸ ἔξωθεν εἰσπορευόμενον
  choice: 从外面进入……的任何东西
  rationale: 以自然的汉语关系结构表达带冠词的分词短语；“任何东西”保留 πᾶν 的全称、概括意味。
- source_word: εἰς τὸν ἄνθρωπον
  choice: 进入人里面
  rationale: 明确表达 εἰς 的进入方向；“人”在现代汉语中自然地保留 ἄνθρωπον 的泛指单数，无须译成带性别色彩的“男人”。
- source_word: κοινῶσαι
  choice: 使人污秽
  rationale: 在本段洁净争议的语境中，“污秽”既可表达玷污，也保留礼仪上不洁净的意味；另以脚注明示该语境义。
theological_decisions:
- issue: κοινόω 的洁净术语
  choice: 使人污秽
  alternative: 使人成为不洁净的
  rationale: 上下文讨论洁净与不洁净。“使人污秽”简洁自然，但可能被理解为一般道德玷污，因此脚注指出这里含有礼仪上不洁净的意味，不把经文的论述预先限定为某种后来的教义结论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“连你们也这样不明白吗”保留耶稣责问门徒的力度；“从外面进入人里面”忠实呈现来源和方向。主语“耶稣”由叙事语境补明，以避免汉语连续代词指向含混。
