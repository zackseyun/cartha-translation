  to: 耶稣对他们说：“连你们也这样不明白吗？难道你们不晓得，从外面进入人里面的一切，都不能使他污秽[a]吗？”
  rationale: 修正缺失的右引号，并作两处不改变意义的措辞微调：“一切”自然表达πᾶν的概括范围；“使他污秽”明确对应αὐτόν。脚注保留共同语根在此礼仪洁净语境中的含义，避免将其仅理解为道德意义的污秽。
