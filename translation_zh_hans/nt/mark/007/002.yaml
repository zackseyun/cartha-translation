  text: καὶ ἰδόντες τινὰς τῶν μαθητῶν αὐτοῦ ⸂ὅτι κοιναῖς χερσίν, τοῦτ’ ἔστιν ἀνίπτοις, ἐσθίουσιν⸃ ⸀τοὺς ⸀ἄρτους—
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/002.yaml
  text: and they saw that some of his disciples were eating the bread with defiled hands—that is[a], unwashed hands—
translation:
  language: zh_hans
  text: 他们看见他的一些门徒用不洁净的手[a]（就是没有洗过的手）吃饼——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不洁净”原文直译为“凡俗的”或“普通的”；这里指礼仪性的不洁净，并非仅指手上有污垢。
    reason: 说明κοινός在犹太洁净礼仪语境中的特殊含义，并保留其字面意义。
lexical_decisions:
- source_word: ἰδόντες
  choice: 他们看见
  rationale: 不定过去时分词在这里承接第1节的主语，即法利赛人和一些经学家；译为汉语限定动词自然地表达他们所观察到的情形。
- source_word: τινὰς τῶν μαθητῶν αὐτοῦ
  choice: 他的一些门徒
  rationale: τινάς与部分属格连用，意思是门徒中的一部分；“一些”符合现代汉语习惯，也不暗示全部门徒。
- source_word: ὅτι
  choice: （不单独译出，由“看见……吃饼”体现）
  rationale: 这里的ὅτι引出“看见”的内容。汉语可直接采用兼语式结构，不必生硬译作“看见……是……”。
- source_word: κοιναῖς χερσίν
  choice: 用不洁净的手
  rationale: κοινός字面为“普通的、凡俗的”，在此处犹太洁净礼仪的语境中指礼仪上不洁净。“凡俗的手”在现代汉语中容易被误解，故正文采用语境明确而不过度指向物理污垢的“不洁净”。
- source_word: τοῦτ’ ἔστιν ἀνίπτοις
  choice: 就是没有洗过的手
  rationale: 保留作者为读者加上的解释。“没有洗过”准确表达ἀνίπτοις，并与前面的“手”形成清楚的同位说明。
- source_word: ἐσθίουσιν
  choice: 吃
  rationale: 叙事中的现在时表示当时被看见的动作；现代汉语无须另加进行体标记也能自然表达。
- source_word: τοὺς ἄρτους
  choice: 饼
  rationale: ἄρτοι在此泛指作为食物的饼；“饼”比逐字译作复数“饼块”更符合汉语表达。
theological_decisions:
- issue: κοινός所表达的洁净礼仪含义
  choice: 正文译作“不洁净”，脚注注明字面意义为“凡俗、普通”及其礼仪语境
  alternative: 正文译作“凡俗的”或“不干净的”
  rationale: 本节关注按传统礼仪洗手所涉及的洁净身份，而不只是手上有没有尘土。“不洁净”能保留礼仪意味；脚注则呈现原词较为特殊的字面表达，避免把该词简单等同于卫生意义上的脏。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“他的一些门徒”忠实表达部分关系；破折号保留原句尚未完结、下文继续解释的结构。脚注标记[a]已置于正文相关词语之后。
