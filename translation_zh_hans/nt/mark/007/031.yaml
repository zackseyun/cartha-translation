  text: Καὶ πάλιν ἐξελθὼν ἐκ τῶν ὁρίων Τύρου ⸂ἦλθεν διὰ Σιδῶνος εἰς⸃ τὴν θάλασσαν τῆς Γαλιλαίας ἀνὰ μέσον τῶν ὁρίων Δεκαπόλεως.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/031.yaml
  text: And again[a], after departing from the region of Tyre, he came through Sidon to the Sea of Galilee[b], through the midst of the region of the Decapolis.
translation:
  language: zh_hans
  text: 耶稣又离开推罗地区，途经西顿[a]，来到加利利海，穿过低加坡里地区的中部[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“取道西顿”。希腊语可指经过西顿，也可指经由西顿前往。
    reason: lexical_alternative
  - marker: b
    text: 或译：“从低加坡里各地区中间经过”。“穿过……的中部”所对应的希腊语也可较直译为“在……中间”或“在……之间”；这里所描述的路线在地理上不易确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: 又
  rationale: 承接叙事，表示再次发生的行动；现代汉语中“又”简洁自然。
- source_word: ἐξελθὼν ἐκ τῶν ὁρίων Τύρου
  choice: 离开推罗地区
  rationale: 不生硬照译分词结构；ὅρια在此指地域、辖境，而非边界线。
- source_word: ἦλθεν
  choice: 来到
  rationale: 保留ἔρχομαι的叙事视角，同时符合汉语路线叙述。
- source_word: διὰ Σιδῶνος
  choice: 途经西顿
  rationale: διά加属格表示经过或取道某地；“途经”自然且保留路线含义。
- source_word: εἰς τὴν θάλασσαν τῆς Γαλιλαίας
  choice: 来到加利利海
  rationale: 采用现代汉语中通行的地名“加利利海”。
- source_word: ἀνὰ μέσον
  choice: 穿过……的中部
  rationale: 保留该短语置身其中、由其中穿行的空间意味；因原文路线在地理上较难确定，另以脚注说明可能译法。
- source_word: τῶν ὁρίων Δεκαπόλεως
  choice: 低加坡里地区
  rationale: ὅρια表示地域；Δεκάπολις采用较贴近希腊语读音的专名音译，并加“地区”说明其地域性质。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。为避免汉语中分词式长句的生硬感，将前置分词译为顺承动作。“低加坡里”作为Decapolis的音译，既避免把专名直接释义为普通名词，也以“地区”帮助普通读者识别其地理性质。所有脚注标记均置于正文相应位置。
