  to: 耶稣离开众人，进了一所房子后，他的门徒就这比喻[a]问他。
  rationale: 修订删除“是什么意思”，以免将门徒的提问限定为请求解释；用“进了一所房子后”明确ὅτε的时间关系，并以“就这比喻问他”保留希腊文“问他这比喻”的简洁与开放性。保留“一所房子”以反映οἶκον无冠词，保留“离开众人”以传达ἀπὸ τοῦ ὄχλου所示与人群分离的场景。
