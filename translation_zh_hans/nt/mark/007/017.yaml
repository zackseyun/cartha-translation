  source_fidelity: 译文基本传达了进屋、离开人群及门徒发问的情节，但“问他这比喻是什么意思”补入了原文未明说的“是什么意思”。ἐπηρώτων αὐτὸν τὴν παραβολήν只表明门徒向他询问该比喻；中文可用“就这比喻问他”自然表达而不限定问题内容。
  naturalness: “耶稣离开众人，进了一所房子；他的门徒就问他这比喻是什么意思”流畅，但改为“耶稣离开众人，进了一所房子后，他的门徒就这比喻问他”更贴合原文的时间结构，也避免补足具体问法。
  terminology: “比喻”适当地对应παραβολή；脚注所列“这句话”“这个譬喻”可保留。“譬喻”在现代标准汉语中略显书面，作为词汇替代项仍可接受。
