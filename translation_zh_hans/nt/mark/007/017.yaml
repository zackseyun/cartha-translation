  text: Καὶ ὅτε εἰσῆλθεν ⸀εἰς οἶκον ἀπὸ τοῦ ὄχλου, ἐπηρώτων αὐτὸν οἱ μαθηταὶ αὐτοῦ ⸂τὴν παραβολήν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/017.yaml
  text: And when he entered a house away from the crowd[a], his disciples asked him about the parable.
translation:
  language: zh_hans
  text: 耶稣离开众人，进了一所房子后，他的门徒就这比喻[a]问他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这句话”或“这个譬喻”。希腊文是παραβολή（parabolē）。
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: ；……就
  rationale: 以分号和“就”承接前文并保持马可叙事的连续推进，比生硬直译为“并且”更符合现代汉语。
- source_word: ὅτε
  choice: （以顺承分句表达）
  rationale: 希腊文的时间关系在汉语中通过“离开……进了……；……就……”自然呈现，无须另加“当……的时候”。
- source_word: εἰσῆλθεν εἰς οἶκον
  choice: 进了一所房子
  rationale: οἶκον前无冠词，译作“一所房子”较贴近原文；“进了”保留进入之意。
- source_word: ἀπὸ τοῦ ὄχλου
  choice: 离开众人
  rationale: 表达耶稣进屋后与人群分开的场景关系；“众人”是ὄχλος在本语境中自然、简明的译法。
- source_word: ἐπηρώτων
  choice: 问
  rationale: 未完成时可能带有持续发问的意味，但汉语叙事用简单的“问”最自然，不排除其过程性。
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: 他的门徒
  rationale: 自然保留原文的所属关系。
- source_word: τὴν παραβολήν
  choice: 这比喻
  rationale: 保留παραβολή的基本类别及马可对耶稣形象化教导的称呼；“这”自然回指上文内容。
- source_word: ἐπηρώτων αὐτὸν ... τὴν παραβολήν
  choice: 问他这比喻是什么意思
  rationale: 希腊文“问某人关于某事”的结构若直译为“问他关于这比喻”不自然；补出“是什么意思”明确汉语句法中已隐含的询问内容，并与后文解释相衔接。
theological_decisions:
- issue: παραβολή在此处既可指比喻，也可较宽泛地指一句含比喻意味的话
  choice: 比喻
  alternative: 话；譬喻
  rationale: 选择“比喻”直接保留原词及马可的叙述分类，同时用脚注承认此处所指内容简短、词义可以更宽。
translation_notes:
  register: 采用现代、清楚而庄重的叙事汉语。“一所房子”反映原文无冠词；语序调整为“离开众人，进了一所房子”，使ἀπὸ τοῦ ὄχλου与进入房子的场景关系在汉语中清楚自然。脚注标记已在正文相应词后标出。
