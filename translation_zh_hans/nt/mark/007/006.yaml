source:
  edition: SBLGNT
  text: ὁ ⸀δὲ εἶπεν ⸀αὐτοῖς· Καλῶς ἐπροφήτευσεν Ἠσαΐας περὶ ὑμῶν τῶν ὑποκριτῶν, ὡς γέγραπται ⸀ὅτι Οὗτος ὁ λαὸς τοῖς χείλεσίν με τιμᾷ, ἡ δὲ καρδία αὐτῶν πόρρω ἀπέχει ἀπ’ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/006.yaml
  text: 'But he said to them[a], “Isaiah prophesied well about you hypocrites, as it is written: ‘This people honors me with their lips, but their heart is far from me.’”'
translation:
  language: zh_hans
  text: '他对他们说：“以赛亚指着你们这些假冒为善的人预言得真好！正如经上所记：


    ‘这百姓用嘴唇尊敬我，

    心却远离我。’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: 他对他们说
  rationale: δὲ在此承接并转入耶稣的回应，汉语叙事中不必机械译作“但是”；上下文的转折可由直接回应自然体现。
- source_word: Καλῶς ἐπροφήτευσεν
  choice: 所说的预言，说得真好
  rationale: 保留“说预言”和Καλῶς的肯定评价；“说得真好”自然有力，又不限定为道德上的“正确”或预言细节上的“准确”。
- source_word: περὶ ὑμῶν τῶν ὑποκριτῶν
  choice: 指着你们这些假冒为善的人
  rationale: περὶ ὑμῶν表示所论及的对象，τῶν ὑποκριτῶν与“你们”同位。“指着”符合先知话语被应用于眼前听众的语境；“假冒为善的人”是现代汉语中清楚且沿用已久的对应表达。
- source_word: ὡς γέγραπται ὅτι
  choice: 正如经上所记
  rationale: 采用自然、庄重的经文引语格式；冒号足以表达ὅτι引出的引文。
- source_word: Οὗτος ὁ λαὸς
  choice: 这百姓
  rationale: 保留单数集合名词和先知性语气；“这百姓”比“这些人”更贴近λαός及《以赛亚书》引文的措辞。
- source_word: τοῖς χείλεσίν με τιμᾷ
  choice: 用嘴唇尊敬我
  rationale: 直译工具格表达，并以“尊敬”传达τιμάω；在汉语中集合主体“百姓”可自然搭配身体部位单数概念，无须改为复数。
- source_word: ἡ δὲ καρδία αὐτῶν πόρρω ἀπέχει ἀπ’ ἐμοῦ
  choice: 心却远离我
  rationale: 保留原文单数“心”的集合性意象及δὲ的对照。“远离我”既可表达关系和属灵距离，也不排除原有的空间隐喻。
theological_decisions:
- issue: 耶稣将以赛亚书29:13的责备直接用于面前的听众
  choice: 保留“你们这些假冒为善的人”以及“这百姓”的直接指斥
  alternative: 将引文泛化为对一切虚假敬拜者的普遍评论，或弱化为“表里不一的人”
  rationale: 希腊文明确以περὶ ὑμῶν把先知的话应用于当前听众；译文不应削弱其针对性，也不额外扩展为系统性的教义判断。
- issue: “嘴唇”与“心”的对照
  choice: 保留外在尊敬与内心远离之间的张力
  alternative: 解释性改写为“口头敬拜却不真心相信”
  rationale: 原文只陈述嘴唇尊敬与心远离的对照；保留意象可避免把“心”的含义窄化为某一种特定心理或教义状态。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“假冒为善的人”保持经文语域和道德指斥的力度；诗行分排凸显引文结构。未添加脚注，因为汉语的“这百姓……心”能够自然保留希腊文的集合性单数，不存在英语代词数的一致问题。
