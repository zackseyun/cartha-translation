  text: οἱ γὰρ Φαρισαῖοι καὶ πάντες οἱ Ἰουδαῖοι ἐὰν μὴ πυγμῇ νίψωνται τὰς χεῖρας οὐκ ἐσθίουσιν, κρατοῦντες τὴν παράδοσιν τῶν πρεσβυτέρων,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/003.yaml
  text: For the Pharisees and all the Jews do not eat unless they wash their hands with a fist[a], holding to the tradition of the elders.
translation:
  language: zh_hans
  text: 原来，法利赛人和所有犹太人若不按特定方式洗手[a]，就不吃饭，仍持守着长老的传统。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文用词含义不确定，字面可作“用拳头”；也可能指“洗到手腕”或“彻底洗净”。它很可能是指一种惯常的礼仪洗手方式。
    reason: 保留 πυγμῇ 的词义歧义及主要解释。
lexical_decisions:
- source_word: γὰρ
  choice: 原来
  rationale: 本节是叙述者向读者补充的解释性插语；“原来”在现代汉语中自然体现说明缘由的作用。
- source_word: Φαρισαῖοι
  choice: 法利赛人
  rationale: 采用现代中文圣经和一般中文语境中通行的群体名称。
- source_word: πάντες οἱ Ἰουδαῖοι
  choice: 所有犹太人
  rationale: 忠实保留原文的概括性表达 πάντες，同时将 Ἰουδαῖοι 按此处广义的族群—宗教含义译为“犹太人”，而不是限于犹太地区居民。
- source_word: ἐὰν μὴ
  choice: 若不
  rationale: 简洁自然地表达否定条件。
- source_word: πυγμῇ
  choice: 按特定方式
  rationale: 该词含义历来有争议，可能指“用拳头”、洗到手腕，或彻底洗净，并且很可能涉及一种惯常的礼仪洗手方式。正文避免把某一重构当作定论，脚注保留具体可能。
- source_word: νίψωνται τὰς χεῖρας
  choice: 洗手
  rationale: νίπτω 指洗身体的一部分；此处宾语明确是双手，汉语以“洗手”表达最自然。
- source_word: οὐκ ἐσθίουσιν
  choice: 就不吃饭
  rationale: 表达习惯性行为；“吃饭”在汉语中自然表示进食，不必另补具体食物。
- source_word: κρατοῦντες
  choice: 因为他们持守
  rationale: κρατέω 在此表示坚持遵守；“持守”体现坚定遵循。按汉语句法补出“因为他们”，明示分词所表达的伴随原因，同时不改变其逻辑关系。
- source_word: παράδοσιν τῶν πρεσβυτέρων
  choice: 长老的传统
  rationale: 保留属格表达，可自然理解为由长老传承或与长老相关的传统，不额外限定其精确关系。
theological_decisions:
- issue: “所有犹太人”的范围和修辞力度
  choice: 保留“所有犹太人”这一广义概括
  alternative: “犹太人”或“许多犹太人”
  rationale: 原文明确有 πάντες。译文不擅自缩小范围；但该表述是叙述者的概括性说明，不必理解为对每一个个体的统计断言。
- issue: πυγμῇ 的含义
  choice: 正文译作“按特定方式”，脚注列出主要解释
  alternative: “用拳头”“洗到手腕”“彻底洗净”
  rationale: 该词本身晦涩且解释不一。直译“用拳头”在现代汉语中容易造成错误的具体印象；选定“洗到手腕”或“彻底洗净”又会过早消除原文歧义。因此正文仅表明存在特定惯常方式，脚注保存争议。
- issue: κρατοῦντες 与主句的关系
  choice: 以“因为他们持守”表达
  alternative: “持守着”或“遵守”
  rationale: 分词可描述伴随状态，也在语境中说明这种习惯的依据。汉语用“因为”使解释关系顺畅，但不把“传统”评价为正面或负面。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“原来”标明解释性插语；“按特定方式”避免生硬且可能误导的字面表达，并由脚注交代原文难点。
