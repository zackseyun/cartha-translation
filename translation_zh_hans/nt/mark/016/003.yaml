base_translation:
  language: en
  yaml_path: translation/nt/mark/016/003.yaml
  text: And they were saying to one another[a], “Who will roll away the stone for us from the entrance of the tomb?”
translation:
  language: zh_hans
  text: 她们彼此说着：“谁来替我们把石头从墓口[a]滚开呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“墓门”。
    reason: θύρα可指“门”或“入口”；正文的“墓口”在墓穴语境中更自然，脚注保留另一可行译法。
lexical_decisions:
- source_word: ἔλεγον
  choice: 正说着
  rationale: 未完成时体现当时正在持续的交谈；“正说着”在现代汉语中自然保留这一进行性。
- source_word: πρὸς ἑαυτάς
  choice: 彼此
  rationale: 字面可理解为“对她们自己”，但复数语境表达同行妇女互相交谈；“彼此”简洁自然。
- source_word: Τίς
  choice: 谁
  rationale: 直接保留询问能执行该行动之人的疑问语气。
- source_word: ἀποκυλίσει
  choice: 滚开
  rationale: 该动词具体指将物体滚离原位，保留堵墓石被滚走的形象。
- source_word: ἡμῖν
  choice: 替我们
  rationale: 此处与格表示受益或代劳；“替我们”自然表达有人为她们完成此事。
- source_word: τὸν λίθον
  choice: 石头
  rationale: 原文仅说“石头”，定指含义由语境自然体现，不额外加入“大”字。
- source_word: ἐκ τῆς θύρας
  choice: 从墓口
  rationale: θύρα可指门或入口；墓穴的开口用“墓口”表达清楚，也避免使人必然联想到带门扇的门。
- source_word: τοῦ μνημείου
  choice: 墓
  rationale: 此处指安放遗体的坟墓；与“口”组合为现代汉语自然的“墓口”。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“彼此正说着”保留未完成时的持续意味；问句末用“呢”呈现她们面对实际困难时的商议语气。脚注标在存在词义选择的“墓口”之后。
