  text: καὶ εἶπεν αὐτοῖς· Πορευθέντες εἰς τὸν κόσμον ἅπαντα κηρύξατε τὸ εὐαγγέλιον πάσῃ τῇ κτίσει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/015.yaml
  text: And he said to them[b][a], “Go into all the world and proclaim the good news to all creation.”
translation:
  language: zh_hans
  text: 他对他们说：“你们要到全世界去，向一切受造之物[a]宣讲福音[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“向整个受造界”或“向每一个受造物”。希腊语可指整体，也可作逐一分配的理解。
    reason: alternative_reading
  - marker: b
    text: “福音”字面意思是“好消息”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πορευθέντες
  choice: 你们要到……去
  rationale: 该不定过去时分词位于主要命令语气动词之前，在这里具有伴随情境的命令作用。译成“你们要到……去”既符合现代汉语，也保留差遣的力度，避免生硬地译作“去了以后”。
- source_word: κόσμον ἅπαντα
  choice: 全世界
  rationale: κόσμος在此指使命所及的世界范围，ἅπαντα强调完整、无遗漏。“全世界”自然简明，并保留普世性的范围。
- source_word: κηρύξατε
  choice: 宣讲
  rationale: κηρύσσω指像传令者一样公开宣告。“宣讲”兼具公开传扬和权威宣告之意，又比仅限宗教场合的表达更易懂。
- source_word: τὸ εὐαγγέλιον
  choice: 这好消息
  rationale: εὐαγγέλιον本义为“好消息”。定冠词结合上下文可自然译为“这好消息”；脚注保留传统术语“福音”。
- source_word: πάσῃ τῇ κτίσει
  choice: 向一切受造之物
  rationale: κτίσις既可指“受造界”，也可指个别“受造之物”。“一切受造之物”较贴近单数集合性短语，同时保留其宽广范围，不擅自缩窄为“所有人”。
- source_word: εἶπεν αὐτοῖς
  choice: 他对他们说
  rationale: 直接对应常规叙事引语格式，不额外加入“吩咐”等解释性语气。
theological_decisions:
- issue: 差遣宣告的对象 πάσῃ τῇ κτίσει 的范围
  choice: 译为“向一切受造之物”，保留希腊语宽广而兼具集合性的表达。
  alternative: 向整个受造界；向每一个受造物
  rationale: 原文可从整体、宇宙性的角度理解，也可作逐一分配性的理解。正文不将它缩限为人类个体；脚注说明两种可能，以保存原文的张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“你们要……去”清楚表达差遣；“宣讲”保留公开宣告的意味。正文中的脚注标记按相关词语出现顺序排列。
