  text: ἐκεῖνοι δὲ ἐξελθόντες ἐκήρυξαν πανταχοῦ, τοῦ κυρίου συνεργοῦντος καὶ τὸν λόγον βεβαιοῦντος διὰ τῶν ἐπακολουθούντων ⸀σημείων.⟧
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/020.yaml
  text: And they went out and proclaimed everywhere[b][a], while the Lord worked with them and confirmed the message through the accompanying signs.
translation:
  language: zh_hans
  text: 他们出去，到处传扬。主与他们同工，并借着伴随而来的神迹证实所传的道。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些最早且重要的抄本没有16:9—20；另有抄本采用不同的结尾。
    reason: textual_variant
lexical_decisions:
- source_word: ἐκεῖνοι
  choice: 他们
  rationale: 该指示代词承接上文所说的门徒群体；现代汉语用“他们”自然准确，不必生硬译成“那些人”。
- source_word: ἐξελθόντες
  choice: 出去
  rationale: 不拘泥于希腊语分词形式，按叙事中的先行动作译为“出去”，简洁自然。
- source_word: ἐκήρυξαν
  choice: 传扬
  rationale: κηρύσσω指公开宣告；“传扬”既保留公开传播之意，也符合庄重而通俗的经文语体。
- source_word: πανταχοῦ
  choice: 到处
  rationale: 直接表达“各处、 everywhere”的范围，符合现代汉语习惯。
- source_word: τοῦ κυρίου
  choice: 主
  rationale: 承接16:19的“主”，上下文所指为复活的耶稣；正文保留称号而不额外明说所指。
- source_word: συνεργοῦντος
  choice: 与他们同工
  rationale: 保留 συνεργ- 的共同工作含义；“与他们同工”准确表达主在他们传扬时一同作工。
- source_word: τὸν λόγον
  choice: 所传的道
  rationale: λόγος在这里指他们所宣讲的信息。“道”保留传统而宽广的词义，加上“所传的”使现代读者清楚其语境功能。
- source_word: βεβαιοῦντος
  choice: 证实
  rationale: 表达βεβαιόω在此处确认、印证宣讲内容的意思。
- source_word: διὰ
  choice: 借着
  rationale: διά加属格表示媒介或手段；“借着”在此自然准确。
- source_word: τῶν ἐπακολουθούντων σημείων
  choice: 随后的神迹
  rationale: ἐπακολουθούντων可指“随后”或“伴随”；“随后的”保留其基本动态含义和原文中关系对象未明说的特点。σημεῖον在此为具有印证作用的超常记号，译作“神迹”符合中文读者习惯。
theological_decisions:
- issue: “主”所指
  choice: 正文只译“主”，由紧邻上文自然表明是复活的耶稣。
  alternative: 明确译为“主耶稣”，或泛指上帝。
  rationale: 16:19已称耶稣为“主”，本节延续同一所指；不在正文补入原文没有的专名，可避免过度解释。
- issue: 神迹的功能
  choice: 神迹是主用来证实所传之道的媒介。
  alternative: 神迹只是随后发生，并不具有印证功能。
  rationale: 句法把“证实所传的道”与“借着……神迹”直接相连，明确呈现其印证功能；但不据此延伸讨论神迹持续多久或是否为普遍规范。
- issue: 马可福音长结尾的文本地位
  choice: 翻译所给SBLGNT文本，并以脚注提示古抄本证据。
  alternative: 不作文本提示，或把本节从正文删除。
  rationale: 16:20属于马可福音16:9–20这一著名文本问题范围。既然所给来源收录本节并以括号界定长结尾，就译入正文，同时让读者知道重要抄本证据。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“到处传扬”避免过度宗教术语化；“与他们同工”保留原文共同作工的表达；“随后的神迹”不擅自限定神迹究竟伴随传道人还是所传信息。脚注标记置于整节末尾，因为它涉及本节所属长结尾的整体文本问题。
