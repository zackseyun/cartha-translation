  text: σημεῖα δὲ τοῖς πιστεύσασιν ⸂ταῦτα παρακολουθήσει⸃, ἐν τῷ ὀνόματί μου δαιμόνια ἐκβαλοῦσιν, γλώσσαις λαλήσουσιν ⸀καιναῖς,
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/017.yaml
  text: 'And these signs will accompany those who have believed: in my name they will cast out demons[b][a]; they will speak in new tongues.'
translation:
  language: zh_hans
  text: 这些神迹将伴随[a]信了的人：他们将奉我的名赶出鬼魔；将说新的方言[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“跟随”。原文动词既可表示跟随，也可表示伴随、随同。
    reason: lexical_alternative
  - marker: b
    text: 或译“新的语言”。原文可泛指语言；正文用“方言”以保留此处表达的开放性。
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖα
  choice: 神迹
  rationale: 该词指具有指示、印证作用的异能之事；“神迹”是现代中文圣经语境中自然且庄重的表达，也保留其作为记号的意味。
- source_word: τοῖς πιστεύσασιν
  choice: 信了的人
  rationale: 保留不定过去时分词所表达的已经相信、进入信仰的意味，同时仍可泛指这一类人。
- source_word: ταῦτα
  choice: 这些
  rationale: 直接对应指示词，并向后指向随后列举的神迹。
- source_word: παρακολουθήσει
  choice: 必伴随着
  rationale: 该动词在这里表示随同、伴随；此译法避免只表达先后次序。“必”对应将来陈述的确定语气。
- source_word: ἐν τῷ ὀνόματί μου
  choice: 奉我的名
  rationale: 这是现代中文表达凭某人的权柄或代表某人行事的自然惯用语。
- source_word: δαιμόνια
  choice: 鬼魔
  rationale: 直接表达邪灵性的存在，不以“污灵”等相关但不同的原文用语替代。
- source_word: ἐκβαλοῦσιν
  choice: 赶出
  rationale: 准确表达强行驱逐，符合中文赶鬼语境，也比“抛出”自然。
- source_word: γλώσσαις
  choice: 方言
  rationale: 该词可指舌头，也可指语言；“方言”保留中文圣经传统中“说方言”的开放表达，不在正文中断定是已知人类语言还是其他形式的言语。
- source_word: λαλήσουσιν
  choice: 要说
  rationale: 自然表达将来的说话行为；承接前一分句共用主语“他们”。
- source_word: καιναῖς
  choice: 新的
  rationale: 直接保留其在种类或性质上为新的含义，不擅自解释为“陌生的”或“前所未有的”。
theological_decisions:
- issue: “说新的方言”所指现象的性质
  choice: 正文译作“新的方言”，不界定为已知的人类语言或超自然的舌语。
  alternative: 可译作“新的语言”，或解释为特殊的灵恩言语。
  rationale: γλώσσαις 本身可表示语言，而本节没有进一步界定这种现象；保留开放性可避免把特定宗派解释写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“奉我的名”符合当代中文惯用表达；用“伴随着”澄清神迹与信者相随，而非仅在时间上随后发生。分号保留原文列举神迹的节奏。
