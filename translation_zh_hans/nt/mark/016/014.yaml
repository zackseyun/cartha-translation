  text: Ὕστερον ⸀δὲ ἀνακειμένοις αὐτοῖς τοῖς ἕνδεκα ἐφανερώθη, καὶ ὠνείδισεν τὴν ἀπιστίαν αὐτῶν καὶ σκληροκαρδίαν ὅτι τοῖς θεασαμένοις αὐτὸν ⸀ἐγηγερμένον οὐκ ἐπίστευσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/014.yaml
  text: Later[a], he appeared to the eleven themselves as they were reclining at the table, and he rebuked their unbelief and hardness of heart[c][b], because they had not believed those who had seen him after he had been raised.
translation:
  language: zh_hans
  text: 后来[a]，耶稣向正在席间斜躺的那十一个人显现，责备他们的不信和心里刚硬，因为他们不相信那些看见他已经复活的人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“此后”。
    reason: lexical_alternative
  - marker: b
    text: 原文更直译可作：“那些看见他已被复活的人。”其中“被复活”为完成时被动形式；正文用自然中文表达复活已经发生的状态。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὕστερον
  choice: 后来
  rationale: 表示随后发生的事；“后来”自然、清楚，又不额外限定具体时间。
- source_word: ἀνακειμένοις
  choice: 正在席间斜躺着
  rationale: 保留古代用餐时斜躺的姿势，并以“席间”点明用餐场景，避免现代读者误解为一般躺卧。
- source_word: τοῖς ἕνδεκα
  choice: 十一个门徒
  rationale: 原文直译为“那十一人”，在此指犹大离去后余下的门徒群体；补出“门徒”使中文指代清楚。
- source_word: ἐφανερώθη
  choice: 显现
  rationale: 符合复活显现语境，也保留该动词所含的使人看见、显露之意。
- source_word: ὠνείδισεν
  choice: 责备
  rationale: 准确表达强烈的斥责，同时是现代中文自然、庄重的说法。
- source_word: ἀπιστίαν
  choice: 不信
  rationale: 此处具体指他们不肯相信见证人的报告；“不信”比抽象的“缺乏信心”更贴合上下文。
- source_word: σκληροκαρδίαν
  choice: 心里刚硬
  rationale: 保留原文“硬心”的圣经性隐喻，同时采用现代中文较自然的表达。
- source_word: θεασαμένοις
  choice: 那些看见……的人
  rationale: 直接表达亲眼见到的证人身份，不加入原文没有明说的评价。
- source_word: ἐγηγερμένον
  choice: 他已经复活
  rationale: 完形被动分词表明复活已经发生且结果持续；中文“已经复活”自然表达其状态，脚注补明原文被动形式。
- source_word: οὐκ ἐπίστευσαν
  choice: 他们不相信
  rationale: 指耶稣显现之前，他们未接受那些目击者的见证；中文由语境自然体现先后关系。
theological_decisions:
- issue: ἐγηγερμένον 的复活表述
  choice: 看见他已经复活
  alternative: 看见他已经被复活／看见他是复活了的
  rationale: 正文以自然中文表达复活已成事实的状态；脚注保留希腊文完形被动分词的形式及其可能呈现的神圣被动，不明确补出施事者。
- issue: σκληροκαρδία 的隐喻力度
  choice: 心里刚硬
  alternative: 顽固
  rationale: 保留“心”的原文隐喻及其神学张力，不将其简化为纯粹性格上的固执。
- issue: τοῖς ἕνδεκα 的群体称谓
  choice: 十一个门徒
  alternative: 那十一人
  rationale: 补出语境中明确的身份以符合中文习惯，但不把他们进一步专称为“使徒”，以免增加原文此处没有使用的称号。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“席间斜躺”交代古代用餐姿势；“心里刚硬”保留原文隐喻。正文中的脚注标记按出现顺序为[a]、[b]。
