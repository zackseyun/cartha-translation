  text: ὁ δὲ λέγει αὐταῖς· Μὴ ἐκθαμβεῖσθε· Ἰησοῦν ζητεῖτε τὸν Ναζαρηνὸν τὸν ἐσταυρωμένον· ἠγέρθη, οὐκ ἔστιν ὧδε· ἴδε ὁ τόπος ὅπου ἔθηκαν αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/006.yaml
  text: But he says to them[a], “Do not be alarmed. You are looking for Jesus the Nazarene, the one who has been crucified. He has been raised; he is not here[b]. Look—the place where they laid him.”
translation:
  language: zh_hans
  text: 他却对她们说：“不要惊慌！你们在找那位拿撒勒人耶稣[a]，就是那位被钉十字架的。他已经复活了[b]，不在这里。看，这就是他们安放他的地方。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拿撒勒人”也可译作“拿撒勒的”；希腊文采用一个由“拿撒勒”这一地名衍生的称谓。
    reason: lexical_alternative
  - marker: b
    text: “他已经复活了”也可译作“他已经被兴起了”。希腊文动词为被动态，暗示上帝使他复活，但原文未明说施事者。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκθαμβεῖσθε
  choice: 惊慌
  rationale: 该词表达强烈的震惊和不安；“惊慌”在墓穴场景中自然、清楚，不仅指一般的惊讶。
- source_word: Ναζαρηνὸν
  choice: 拿撒勒人
  rationale: 保留由地名“拿撒勒”构成的称号性质；中文“拿撒勒人”比“来自拿撒勒的”更贴近原文的形容词性称谓。
- source_word: ἐσταυρωμένον
  choice: 那位被钉十字架的
  rationale: 用“被钉”保留被动态；“那位……的”体现分词对耶稣的进一步限定，并以自然中文传达已完成之事件的持续关联。
- source_word: ἠγέρθη
  choice: 他已经复活了
  rationale: “复活”是现代中文表达从死里被兴起的常用说法；“已经……了”传达不定过去时所宣告的已成事实。原文被动态及其可能暗示的施动者在脚注中说明，避免正文生硬。
- source_word: ὧδε
  choice: 这里
  rationale: 直接、自然地表达地点副词。
- source_word: ἴδε
  choice: 看
  rationale: 以简洁的祈使语引导听者注意眼前地点，现代而不失庄重。
- source_word: τόπος
  choice: 地方
  rationale: 在语境中准确指耶稣曾被安放之处，普通读者容易理解。
- source_word: ἔθηκαν
  choice: 安放
  rationale: 既表达“放置”，又符合安葬语境，比“放”更庄重；复数主语译作“他们”。
- source_word: ζητεῖτε
  choice: 你们在找
  rationale: 自然体现现在时所描述的当下行动，比“你们寻找”更符合现代口语叙事。
- source_word: λέγει αὐταῖς
  choice: 他却对她们说
  rationale: 保留马可叙事中的历史现在时，用“说”而非“说道”；δέ在上下文中的轻微转折以“却”表达。
theological_decisions:
- issue: 复活用语及语态
  choice: 正文译“他已经复活了”，脚注注明原文也可直译为“他已经被使复活了”
  alternative: 他已经被使复活了；他已经起来了
  rationale: ἠγέρθη在形式上是被动态，应当让读者知晓，不宜抹去其可能暗示的上帝行动；但中文“被使复活”较生硬，因此正文采用自然且不否定被动含义的“复活了”，脚注保存原文语态和可译空间。
- issue: “拿撒勒人”的称号性质
  choice: 拿撒勒人耶稣
  alternative: 拿撒勒的耶稣；拿撒勒派的耶稣
  rationale: 原词是源于拿撒勒地名的称谓。采用“拿撒勒人”保留称号形式，同时避免把它解释为宗派归属。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。保留历史现在时“说”，以体现马可叙事的现场感；引语使用短句和感叹号传达命令的力度。脚注标记[a]紧随“拿撒勒人耶稣”，[b]紧随复活宣告，均在正文中出现。
