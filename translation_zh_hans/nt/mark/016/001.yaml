  text: Καὶ διαγενομένου τοῦ σαββάτου ⸀Μαρία ἡ Μαγδαληνὴ καὶ Μαρία ⸂ἡ τοῦ⸃ Ἰακώβου καὶ Σαλώμη ἠγόρασαν ἀρώματα ἵνα ἐλθοῦσαι ἀλείψωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/001.yaml
  text: And when the Sabbath was over[a], Mary Magdalene, Mary the mother of James, and Salome bought spices so that they might come and anoint him.
translation:
  language: zh_hans
  text: 安息日一过，抹大拉的马利亚、雅各的母亲马利亚[a]和撒罗米买了香料，好去膏他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译“雅各的那位（马利亚）”，即以她与雅各的关系来辨认她；传统上理解为雅各的母亲。
    reason: 原文省略具体关系；正文按《马可福音》上下文补作“母亲”，脚注保留原文的省略和解释空间。
lexical_decisions:
- source_word: διαγενομένου τοῦ σαββάτου
  choice: 安息日过后
  rationale: 属格独立结构表示先于主要动作的时间；此译简洁自然，准确表达安息日已经结束。
- source_word: Μαρία ἡ Μαγδαληνὴ
  choice: 抹大拉的马利亚
  rationale: 采用现代中文圣经读者熟悉的人名和地名式称谓，同时保留原文对她的识别方式。
- source_word: Μαρία ἡ τοῦ Ἰακώβου
  choice: 雅各的母亲马利亚
  rationale: 原文直译是“雅各的马利亚”，关系有所省略；结合本福音的称谓习惯，在正文补出“母亲”，并用脚注保留原文的含混性。
- source_word: Σαλώμη
  choice: 撒罗米
  rationale: 采用通行且易识别的现代中文音译。
- source_word: ἠγόρασαν
  choice: 买了
  rationale: 准确对应简单叙事中的不定过去时，中文自然明白。
- source_word: ἀρώματα
  choice: 香料
  rationale: 指用于殓葬的芳香物质；“香料”具体、简明，也符合上下文。
- source_word: ἵνα ἐλθοῦσαι ἀλείψωσιν αὐτόν
  choice: 要去膏耶稣的身体
  rationale: ἵνα表达目的，ἐλθοῦσαι表示前往后实施动作；“要去膏”自然呈现这一目的和动作次序。原文代词“他”在中文中补明为“耶稣”，并以“身体”说明殓葬语境，避免“膏耶稣”在现代中文中显得突兀。
- source_word: ἀλείψωσιν
  choice: 膏
  rationale: 保留涂抹香料或香膏的具体动作及其殓葬含义，不泛化为“料理后事”等解释性表达。
theological_decisions:
- issue: Μαρία ἡ τοῦ Ἰακώβου中省略的亲属关系
  choice: 正文译作“雅各的母亲马利亚”，并加脚注说明
  alternative: 雅各的马利亚
  rationale: 希腊文只说“雅各的那位（马利亚）”，并未明说亲属关系；根据《马可福音》上下文，通常理解为母亲。正文需用自然中文明确表达，同时脚注保存原文真实的省略与解释空间。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“安息日过后”“买了香料”“要去膏”保持叙事简洁；人名使用简体中文圣经传统中通行的译法。脚注保留原文对马利亚身份关系的省略。
