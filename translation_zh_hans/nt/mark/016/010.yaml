  text: ἐκείνη πορευθεῖσα ἀπήγγειλεν τοῖς μετ’ αὐτοῦ γενομένοις πενθοῦσι καὶ κλαίουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/010.yaml
  text: She went and reported it to those who had been with him[a], who were mourning and weeping.
translation:
  language: zh_hans
  text: 她去把这消息[a]告诉了那些曾跟他在一起、正在哀恸哭泣的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文没有明说“这消息”，也可译作“她去告诉了那些曾跟他在一起、正在哀恸哭泣的人”。
    reason: 说明宾语由上下文补出，并保留不补明宾语的译法。
lexical_decisions:
- source_word: ἐκείνη
  choice: 她
  rationale: 这个指示代词回指上一节的抹大拉的马利亚；现代汉语用“她”自然清楚，无须生硬译作“那女人”或“那一位”。
- source_word: πορευθεῖσα
  choice: 去
  rationale: 这个不定过去时分词表示先于主要动词发生的行动；“去……告诉”简洁自然地保留了行动次序。
- source_word: ἀπήγγειλεν
  choice: 把这消息告诉了
  rationale: 该动词表示传报、告知。原文未明说宾语，译文根据上文补出“这消息”，指耶稣显现之事，使汉语表达完整。
- source_word: τοῖς μετ’ αὐτοῦ γενομένοις
  choice: 那些曾跟他在一起的人
  rationale: 这一短语指先前与耶稣同在的一群人。“曾跟他在一起”既保留原文的关系表达，也不将其过度限定为某一特定身份称谓。
- source_word: πενθοῦσι καὶ κλαίουσιν
  choice: 正在哀恸哭泣
  rationale: 两个现在时分词描写这些人当时持续的状态。“哀恸”表达因死亡和失落而悲痛，“哭泣”保留外在流泪哀哭的动作。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“曾跟他在一起”避免过度解释群体身份；“哀恸哭泣”保留原文两个并列动词的情感与动作层面。
