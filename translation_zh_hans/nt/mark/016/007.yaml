  text: ἀλλὰ ὑπάγετε εἴπατε τοῖς μαθηταῖς αὐτοῦ καὶ τῷ Πέτρῳ ὅτι Προάγει ὑμᾶς εἰς τὴν Γαλιλαίαν· ἐκεῖ αὐτὸν ὄψεσθε, καθὼς εἶπεν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/007.yaml
  text: But go[a], tell his disciples and Peter, ‘He is going ahead of you into Galilee. There you will see him[b], just as he told you.’
translation:
  language: zh_hans
  text: 但你们去告诉他的门徒和彼得[a]：‘他先你们一步往加利利去[b]。你们在那里会见到他，正如他先前告诉你们的那样。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 彼得在“他的门徒”之外被单独点名。这可能凸显他在否认耶稣之后将被挽回，但希腊文并没有明确说“尤其是彼得”。
    reason: alternative_reading
  - marker: b
    text: 或译：“进入加利利”。这里的希腊介词既可表示“往、到”，也可表示“进入”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: 但
  rationale: 承接前文并形成鲜明转折，从妇女的惊惧转到她们受命采取的行动；“但”简洁自然。
- source_word: ὑπάγετε
  choice: 你们去
  rationale: 保留复数命令的语气；现代汉语中“你们去”自然明确，不额外强化其体貌。
- source_word: εἴπατε
  choice: 告诉
  rationale: 这里是把随后信息传达给指定对象，“告诉”比直译为“说”更符合现代汉语习惯。
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: 他的门徒
  rationale: 自然表达所属关系，并准确指向耶稣的门徒。
- source_word: καὶ τῷ Πέτρῳ
  choice: 和彼得
  rationale: 希腊文只是以καί并列彼得和门徒，并未明确说“尤其是彼得”或“包括彼得”，故保留简单并列。
- source_word: ὅτι
  choice: 用直接引语引出信息内容
  rationale: ὅτι在此引出所要传达的信息；中文用冒号和引号呈现直接引语，清楚而自然。
- source_word: Προάγει ὑμᾶς
  choice: 他要在你们前面
  rationale: προάγει表达耶稣先于他们前往或走在他们前面；此译保留方向与先行含义，也不把它收窄为“先到达”。
- source_word: εἰς τὴν Γαλιλαίαν
  choice: 往加利利去
  rationale: εἰς可表示“到、往”或“进入”；“往加利利去”在现代汉语中自然，并保留目的地方向。
- source_word: ἐκεῖ
  choice: 在那里
  rationale: 直接回指加利利，符合中文表达。
- source_word: αὐτὸν ὄψεσθε
  choice: 你们会见到他
  rationale: 准确表达将来的看见或相见；“见到”在这里比单说“看”更自然。
- source_word: καθὼς εἶπεν ὑμῖν
  choice: 正如他告诉过你们的
  rationale: καθώς表示与耶稣先前所说的话相符；“告诉过”自然体现此前的言说。
theological_decisions:
- issue: 在“他的门徒”之后单独提到彼得
  choice: 保留“他的门徒和彼得”的平行并列，不在正文中解释其意义。
  alternative: 他的门徒，尤其是彼得；他的门徒，包括彼得
  rationale: 单独点名彼得可能具有叙事和牧养意义，尤其联系到他的否认，但希腊文没有明确表达“尤其”或“包括”。保留原文张力，避免把推论写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。命令句简洁直接；引语保持叙事力度。“在你们前面”保留προάγει可能兼有先行与引领的空间意象，不将其过度解释为单纯的抵达先后。脚注[b]置于其实际说明的“往加利利去”之后，以避免指代不清。
