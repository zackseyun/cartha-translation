  text: καὶ ἀναβλέψασαι θεωροῦσιν ὅτι ⸀ἀποκεκύλισται ὁ λίθος, ἦν γὰρ μέγας σφόδρα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/004.yaml
  text: And looking up[a], they saw that the stone had been rolled away, for it was extremely large.
translation:
  language: zh_hans
  text: 她们抬头一看，见石头已经滚开了[a]，因为那块石头非常大。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “已经滚开了”也可译作“已被滚开”。希腊文的完成时强调：她们看见时，石头已经处于滚开的状态。
    reason: 说明完成时被动态所表达的既成动作及持续结果，避免只理解为她们眼前正在发生的动作。
lexical_decisions:
- source_word: ἀναβλέψασαι
  choice: 抬头一看
  rationale: 该词为不定过去时分词，在这里自然表示妇女们朝坟墓方向抬起视线；“抬头一看”既保留动作关系，也符合现代汉语叙事习惯。
- source_word: θεωροῦσιν
  choice: 见
  rationale: θεωρέω在此表示亲眼看见、注意到眼前情形；译作“见”简洁庄重，并与“抬头一看”自然衔接。
- source_word: ὅτι
  choice: （由汉语宾语结构体现）
  rationale: ὅτι引出她们所看见的内容；汉语在“见石头……”中无需另译“那”，含义已经清楚。
- source_word: ἀποκεκύλισται
  choice: 已经滚开了
  rationale: 完成时被动态兼有动作完成及结果状态的含义；“已经滚开了”表明她们看见时，石头已处于被滚开的状态。
- source_word: ὁ λίθος
  choice: 石头／那块石头
  rationale: λίθος指封住坟墓入口的石头；正文不增添“墓门”等原文没有的说明，后半句用“那块”自然回指。
- source_word: ἦν γὰρ μέγας σφόδρα
  choice: 因为那块石头非常大
  rationale: “因为”保留γάρ的解释作用，“非常大”自然传达σφόδρα对μέγας的强烈修饰。
- source_word: καὶ
  choice: （由上下文承接体现）
  rationale: καί承接前文叙事；本节独立呈现时，汉语不必机械加“于是”或“并且”，以免加入更明确的时间或逻辑色彩。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“抬头一看，见……”保持叙事简洁；保留“因为”所表达的解释关系，不替原文消解石头极大与已经滚开之间的张力。
