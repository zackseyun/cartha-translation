review_pass:
  verdict: revise
  source_fidelity: “他们就去告诉”大致传达了行动与传报，但“就”没有明确表达κἀκεῖνοι中的连接／指示作用，且“去”未清楚体现ἀπελθόντες先于主要动词的“离开”动作。将其明确为“离开后”可更贴合原文的分词关系。后半句以“其余的人”作不相信的主语，并以“也不相信他们”表达οὐδὲ与ἐκείνοις，准确。
  naturalness: 原译通顺，但“他们就去告诉其余的人”略口语化且动作关系较含混。“那两个人离开后，去告诉其余的人”在现代汉语中清楚自然，并保留上下文所指的两位见证者。
  terminology: “其余的人”恰当对应τοῖς λοιποῖς；“不相信他们”在此见证语境中恰当对应ἐπίστευσαν，未引入不必要的教义色彩。
