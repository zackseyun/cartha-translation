  yaml_path: translation/nt/mark/016/013.yaml
  text: And they went away and reported it to the rest[a], but they did not believe them either.
translation:
  language: zh_hans
  text: 那两个人离开后，去告诉其余的人[a]；可是其余的人也不相信他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“其他人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖνοι
  choice: 他们就
  rationale: κἀκεῖνοι由καί与ἐκεῖνοι合成，意为“而那些人／他们也”。上下文已明确指那两个人，现代汉语用“他们”自然；“就”承接叙事推进，不额外明说性别。
- source_word: ἀπελθόντες
  choice: 去
  rationale: 该不定过去时分词表示先于主要动词发生的行动，即他们离开所在之处前去传报。汉语连动结构“去告诉”自然表达这一先后关系。
- source_word: ἀπήγγειλαν
  choice: 告诉
  rationale: ἀπαγγέλλω在此指把所经历的事传达给别人。汉语“告诉”符合叙事语境；希腊文未明示宾语，因此正文也不强加“这件事”。
- source_word: τοῖς λοιποῖς
  choice: 其余的人
  rationale: λοιπός指群体中剩下的人。“其余的人”准确而自然；“其他人”也是可行的词义替代。
- source_word: οὐδὲ
  choice: 可是……也不
  rationale: οὐδέ在承接前文“不信”的同时表示这一次同样不信。用“也不”保留附加含义，并以“可是”自然呈现叙事中的转折。
- source_word: ἐκείνοις
  choice: 他们
  rationale: 该与格复数代词回指前来传报的两个人；在“不相信”之后用“他们”符合现代汉语。
- source_word: ἐπίστευσαν
  choice: 不相信
  rationale: πιστεύω在此指接受传报者的见证为真，而非强调对人的倚靠，因此译作“不相信”最贴切。
theological_decisions:
- issue: 叙事见证语境中πιστεύω的译法
  choice: 不相信
  alternative: 不信任
  rationale: 本节焦点是其余的人不接受两人的传报，并非讨论对传报者的个人信赖；“不相信”保留直接的叙事含义，避免赋予该词不必要的教义色彩。
translation_notes:
  register: 采用现代、清楚而庄重的叙事用语。以汉语连动句表达分词与主要动词的关系，并重复“其余的人”以避免第二个“他们”造成指代含混。
