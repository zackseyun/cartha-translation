source:
  edition: SBLGNT
  text: Ὁ μὲν οὖν κύριος ⸀Ἰησοῦς μετὰ τὸ λαλῆσαι αὐτοῖς ἀνελήμφθη εἰς τὸν οὐρανὸν καὶ ἐκάθισεν ἐκ δεξιῶν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/019.yaml
  text: So then, the Lord Jesus, after speaking to them, was taken up into heaven and sat down at the right hand of God.
translation:
  language: zh_hans
  text: 所以，主耶稣对他们说完了话，就被接到天上，坐在上帝的右边。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὲν οὖν
  choice: 所以
  rationale: 这一组合承接上文并推进叙述，兼有总结、过渡意味；现代汉语用“所以”自然简洁，不必机械拆译各粒子。
- source_word: κύριος Ἰησοῦς
  choice: 主耶稣
  rationale: “主”保留 κύριος 作为基督称号的分量；汉语专名结构无需另加冠词。
- source_word: μετὰ τὸ λαλῆσαι αὐτοῖς
  choice: 对他们说完了话
  rationale: μετά 加冠词不定式表示时间先后；“说完了话”自然表达该动作完成之后，同时保留 αὐτοῖς 的对象。
- source_word: ἀνελήμφθη
  choice: 被接
  rationale: 保留希腊文的被动语态，不明说施动者；与“到天上”连用，在汉语中清楚表达被接升之意。
- source_word: εἰς τὸν οὐρανόν
  choice: 到天上
  rationale: εἰς 表示趋向或目的地；“到天上”是自然现代汉语，并避免生硬的“进入天”。
- source_word: ἐκάθισεν
  choice: 坐在
  rationale: 表达坐下并处于相应位置；与后面的地点短语自然衔接。
- source_word: ἐκ δεξιῶν τοῦ θεοῦ
  choice: 在上帝的右边
  rationale: ἐκ δεξιῶν 是固定方位表达，意为在右边；按汉语习惯译为“在上帝的右边”，不按 ἐκ 的字面意义误译为“从……右边”。
theological_decisions:
- issue: 如何表达升天与被高举而不增加经文未明说的教义解释
  choice: 被接到天上，坐在上帝的右边
  alternative: 被接升天，在上帝右边就座
  rationale: 所选译法直接保留升天的被动表达和坐在上帝右边的圣经意象，不补出施动者，也不把“右边”解释成特定系统神学概念。
- issue: κύριος 作为耶稣的称号
  choice: 主耶稣
  alternative: 耶稣主人
  rationale: “主”是新约语境中 κύριος 的标准、庄重译法，既保留其基督论分量，也不将其弱化为一般社会关系中的主人。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。句式紧凑，保留原文事件顺序和被动语态；无脚注，因此正文不设脚注标记。
