  text: κἀκεῖνοι ἀκούσαντες ὅτι ζῇ καὶ ἐθεάθη ὑπ’ αὐτῆς ἠπίστησαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/011.yaml
  text: And they[a], when they heard that he was alive and had been seen by her[b], did not believe.
translation:
  language: zh_hans
  text: 他们听说他活着[a]，也曾被她看见[b]，却不相信。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他活。”希腊文动词为现在时，意为“他活着”。
    reason: 说明ζῇ的现在时及可行的简洁译法，避免将其误作一次性的“他活了”。
  - marker: b
    text: 或译：“她曾见过他。”原文直译为“他曾被她看见”。
    reason: 说明汉语可作主动转换，同时保留原文被动语态的表达。
lexical_decisions:
- source_word: κἀκεῖνοι
  choice: 他们
  rationale: καί与ἐκεῖνοι合为一词，承接前文并指刚提到的那群人。汉语用“他们”自然明确；句中“却”体现后文出人意料的转折，不必把连接词生硬译作“并且他们”。
- source_word: ἀκούσαντες
  choice: 听见
  rationale: 不定过去时分词在此表示时间或情境，即他们听到这消息之后；汉语以连动结构“听见……却……”自然表达事件次序。
- source_word: ὅτι
  choice: （以宾语从句表达）
  rationale: ὅτι引出所听见的内容。汉语可直接把“他活着，并且……”置于“听见”之后，无须另加对应词。
- source_word: ζῇ
  choice: 他活着
  rationale: ζάω的现在时形式表明他处于活着的状态。“活着”既自然，又保留希腊文现在时所表达的持续生命，避免因叙事时态而改成“当时还活着”。
- source_word: καὶ
  choice: 并且
  rationale: 连接他们所听见的两项内容：他活着，以及她见过他。
- source_word: ἐθεάθη
  choice: 见过他
  rationale: θεάομαι的不定过去时被动式原义为“被看见”。汉语被动句“他被她看见”较生硬，正文转换为主动表达“她见过他”，仍保留实际看见而非仅听闻的含义；被动形式收入脚注。
- source_word: ὑπ’ αὐτῆς
  choice: 她
  rationale: 施事短语指前文所说的女子。保留代词“她”，不在本节擅自补出“马利亚”。
- source_word: ἠπίστησαν
  choice: 却不相信
  rationale: ἀπιστέω在此指不相信所听见的报告。“不相信”直接而自然；“却”清楚表达他们虽听到消息仍不信的语义反差，但不强化为“拒绝相信”。
theological_decisions:
- issue: 复活后生命的时态表达
  choice: 他活着
  alternative: 他活了／他仍然活着
  rationale: 希腊文ζῇ是现在时，表达耶稣活着这一持续状态。“他活着”保留该时态含义而不额外加入“仍然”；“他活了”在现代汉语中可能被理解为康复或复苏，也较难明确表达持续状态。
- issue: 显现还是被看见
  choice: 她见过他
  alternative: 他曾被她看见／他向她显现过
  rationale: ἐθεάθη是θεάομαι的被动式，直接表达“被她看见”，并不必然要求译成主动显现。正文采用自然汉语的主动转换，脚注保留被动形式；不译作“向她显现”，以免把经文没有明说的主动自我显现概念加入正文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“他们……却不相信”简洁呈现听闻与不信之间的反差；不补出代词所指的姓名，也不把“被看见”神学化为“显现”。所有脚注标记均置于相关短语之后。
