revisions:
- from: 她们进了坟墓，看见一个年轻人[a]坐在右边，身穿白袍，就十分惊愕。
  to: 她们进了墓穴，看见一个年轻人[a]坐在右边，身穿白袍；她们十分惊愕。
  rationale: 修正脚注中改变人物关系的严重表述错误，并将“坟墓”调整为更符合可进入之 μνημεῖον 的“墓穴”。正文仍保留“年轻人”，不在正文中预先解释为天使；语序和标点作轻微调整，使叙事更自然且不额外暗示因果关系。
