  text: καὶ εἰσελθοῦσαι εἰς τὸ μνημεῖον εἶδον νεανίσκον καθήμενον ἐν τοῖς δεξιοῖς περιβεβλημένον στολὴν λευκήν, καὶ ἐξεθαμβήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/005.yaml
  text: And when they entered the tomb, they saw a young man sitting on the right, clothed in a white robe, and they were alarmed.
translation:
  language: zh_hans
  text: 她们进了墓穴，看见一个年轻人[a]坐在右边，身穿白袍；她们十分惊愕。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“天使”。马可在这里称他为“年轻人”；不过上下文和各平行记载表明他是一位天使。
    reason: 保留原文的直接称谓，同时说明根据上下文及平行记载对其身份的合理理解；避免将其误说成“天使的使者”。
lexical_decisions:
- source_word: εἰσελθοῦσαι
  choice: 她们进了
  rationale: 不定过去时分词为阴性复数，承接上文的妇女；汉语用连动结构自然表达其先于“看见”发生的动作。
- source_word: μνημεῖον
  choice: 坟墓
  rationale: 指安放遗体的墓穴；在复活叙事中，“坟墓”准确、通俗。
- source_word: νεανίσκον
  choice: 一个年轻人
  rationale: 原词直接表示年轻男子，本节并未明说其为天使，因此正文保留马可的描述性称谓。
- source_word: καθήμενον ἐν τοῖς δεξιοῖς
  choice: 坐在右边
  rationale: 简洁保留其姿态及在墓内所处的方位，不额外补出原文未明说的参照点。
- source_word: περιβεβλημένον στολὴν λευκήν
  choice: 身穿白袍
  rationale: 完成时分词描述其已穿着白色长衣的状态；“白袍”既简明，又体现 στολή 所指较长、醒目的衣袍。
- source_word: ἐξεθαμβήθησαν
  choice: 就十分惊愕
  rationale: 该动词表达强烈的震惊和不安，力度强于一般的“惊讶”，但不必明确译成“恐惧”或“惊恐”。
theological_decisions:
- issue: νεανίσκος的身份
  choice: 正文译作“年轻人”，脚注说明也可按其身份理解为“天使”。
  alternative: 正文直接译作“天使”。
  rationale: 本节原文使用 νεανίσκος（年轻人），并未直接使用 ἄγγελος。白袍、受差遣传话的角色及平行记载支持天使身份，但不宜在正文中取代马可有意采用的叙事描述。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“她们进了……看见……”符合汉语叙事习惯；“十分惊愕”传达强烈反应而不把语义过度限定为恐惧。
