  text: And very early on the first day of the week[c][b][a], they come to the tomb when the sun had risen.
translation:
  language: zh_hans
  text: 一周的第一天[a]清早，太阳已经升起时[b]，她们来到坟墓[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“安息日的第一日”；这是指“一周的第一天”的习语。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“太阳升起以后”。希腊文的属格独立结构交代她们抵达时的时间背景。
    reason: lexical_alternative
  - marker: c
    text: 希腊文使用历史现在时，直译可作“她们来到”，使叙事更鲜活；现代汉语在这里通常仍按过去发生的事件来理解。
    reason: lexical_alternative
lexical_decisions:
- source_word: λίαν πρωῒ
  choice: 天刚蒙蒙亮
  rationale: λίαν加强πρωῒ，表示时间非常早；“天刚蒙蒙亮”是自然、庄重的现代汉语表达，也能与后文“太阳已经升起”形成清晨时分的具体画面。
- source_word: τῇ μιᾷ τῶν σαββάτων
  choice: 一周的第一天
  rationale: 这是闪语色彩浓厚的通用希腊语习语，字面近于“安息日中的第一日”，实际指一周的第一天。
- source_word: ἔρχονται
  choice: 她们来到
  rationale: ἔρχονται是历史现在时，使叙事更鲜活；现代汉语不以动词形态区分现在与过去，“来到”可自然承载该叙事推进。主语依上文指几位妇女，故用“她们”。
- source_word: ἐπὶ τὸ μνημεῖον
  choice: 到坟墓那里
  rationale: 在安葬语境中，μνημεῖον指坟墓；ἐπί加宾格表示朝向该处的移动。“那里”避免“来到坟墓”的生硬，同时不增添进入墓内之意。
- source_word: ἀνατείλαντος τοῦ ἡλίου
  choice: 太阳已经升起时
  rationale: 属格独立结构交代她们抵达时的时间背景；不译成“日出时”，以保留太阳升起这一动作相对于抵达已经发生的含义，也不把关系强化为明确的“之后”。
theological_decisions: []
