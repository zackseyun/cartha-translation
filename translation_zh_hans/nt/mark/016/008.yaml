  text: καὶ ἐξελθοῦσαι ἔφυγον ἀπὸ τοῦ μνημείου, εἶχεν ⸀γὰρ αὐτὰς τρόμος καὶ ἔκστασις· καὶ οὐδενὶ οὐδὲν εἶπαν, ἐφοβοῦντο ⸁γάρ. ⟦Πάντα δὲ τὰ παρηγγελμένα τοῖς περὶ τὸν Πέτρον συντόμως ἐξήγγειλαν. μετὰ δὲ ταῦτα καὶ αὐτὸς ὁ Ἰησοῦς ἀπὸ ἀνατολῆς καὶ ἄχρι δύσεως ἐξαπέστειλεν δι’ αὐτῶν τὸ ἱερὸν καὶ ἄφθαρτον κήρυγμα τῆς αἰωνίου σωτηρίας. ἀμήν.⟧
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/008.yaml
  text: And they went out and fled from the tomb[a], for trembling and astonishment had seized them. And they said nothing to anyone, for they were afraid.
translation:
  language: zh_hans
  text: 她们出来后，就逃离了墓穴[a]，因为战栗和惊愕攫住了她们。她们没有告诉任何人，因为她们害怕。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本在这里加上所谓的短结尾：“她们把一切受吩咐的事，简要地报告给彼得身边的人。此后，耶稣自己也借着她们，把永恒救恩那神圣而永不朽坏的宣告，从东方直到西方传扬出去。阿们。”
    reason: textual_variant
lexical_decisions:
- source_word: ἐξελθοῦσαι
  choice: 她们出来
  rationale: 以时间背景表达阴性复数不定过去时分词，并自然衔接主句动作，不额外强化先后间隔。
- source_word: ἔφυγον
  choice: 逃走了
  rationale: 保留φεύγω所表达的仓促逃离之强度，比一般的“离开”更准确。
- source_word: μνημείου
  choice: 坟墓
  rationale: 在复活叙事中，μνημεῖον指安放遗体的墓穴；“坟墓”是现代汉语中清楚、通行的对应词。
- source_word: εἶχεν αὐτὰς
  choice: 她们又发抖又惊愕
  rationale: 该结构表示两种强烈反应控制、笼罩着她们。汉语用主谓结构自然表达其实际状态，避免生硬直译为“抓住了她们”。
- source_word: τρόμος
  choice: 发抖
  rationale: 保留身体战栗的具体含义，并与末句明确的“害怕”有所区分。
- source_word: ἔκστασις
  choice: 惊愕
  rationale: 表达因震惊而近乎失常、不知所措的状态，避免现代汉语“狂喜”可能造成的误解。
- source_word: οὐδενὶ οὐδὲν εἶπαν
  choice: 她们什么也没有告诉任何人
  rationale: 用自然汉语保留两个否定成分所形成的全面否定。
- source_word: ἐφοβοῦντο
  choice: 她们害怕
  rationale: 简洁表达未完成时所描写的持续恐惧状态，同时保留马可叙事在此处的突兀收束。
- source_word: γάρ
  choice: 因为
  rationale: 两处均译为“因为”，清楚呈现原因关系；第二处仍置于末句，使经文以恐惧的原因说明收尾。
theological_decisions:
- issue: 马可福音16:8之后方括号内的所谓短结尾
  choice: 不纳入经文正文，以脚注保存
  alternative: 将短结尾列入正文，或把不同结尾都排入正文
  rationale: SBLGNT以双重方括号标示该段，表明编者不将其视为正文的一部分。译文据主文本止于“她们害怕”，同时在脚注中完整说明异文，以保持文本证据透明，并保留马可现存主文本的突兀结尾。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“她们出来，就……”紧凑呈现动作推进；“又发抖又惊愕”便于普通读者理解，同时保留身体战栗与震惊失措并存的张力。脚注完整翻译短结尾，但不让其进入正文。
