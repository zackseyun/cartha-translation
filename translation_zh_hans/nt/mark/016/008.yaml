revisions:
- from: 她们出来，就从坟墓那里逃走了[a]，因为她们又发抖又惊愕。她们什么也没有告诉任何人，因为她们害怕。
  to: 她们出来后，就逃离了墓穴[a]，因为战栗和惊愕攫住了她们。她们没有告诉任何人，因为她们害怕。
  rationale: 修订使正文更准确表达“战栗和惊愕攫住她们”的原文结构和力度，同时将离开墓的动作调整为自然简洁的现代汉语。脚注仍将双重方括号中的短结尾严格作为异文处理；其译文改为更贴合“耶稣借着她们传扬神圣、永不朽坏的永恒救恩宣告”的句法与语义，不把该异文纳入正文。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T03:20:49Z'
review_pass:
  verdict: revise
  source_fidelity: 正文准确呈现了妇女从墓中出来并逃离、因战栗与惊愕而受震慑、未告诉任何人以及害怕的因果关系。可是“她们又发抖又惊愕”把εἶχεν αὐτὰς（战栗和惊愕临到／攫住她们）的支配性表达弱化为单纯状态，宜更贴近原文。脚注保留短结尾的做法正确，但其中个别措辞可更准确自然。
  naturalness: “从坟墓那里逃走”略显拖沓，“她们出来后，就逃离了坟墓”更符合现代汉语叙事。“战栗和惊愕攫住了她们”庄重、自然，并保留原文的强烈语气。
  terminology: “坟墓”可用，但本段所指为安放耶稣遗体的墓穴；“墓穴”在此更精确。短结尾中的κήρυγμα宜译为“宣告”或“宣讲”，而非泛称“信息”；“彼得身边的人”也比“彼得周围的人”自然。
  issues:
  - severity: medium
    issue: “她们又发抖又惊愕”未充分表达εἶχεν αὐτὰς。
    rationale: 原文主语是“战栗和惊愕”，并以“抓住／攫住她们”的习语表达这两种反应强烈临到她们；现译改成她们的普通状态，削弱了语义力度。
  - severity: low
    issue: “从坟墓那里逃走了”表达稍显冗余。
    rationale: “从……那里”与“逃走”搭配不如“逃离了墓穴”简洁自然，且μνημεῖον在此可具体译为“墓穴”。
  - severity: medium
    issue: 脚注中“把永恒救恩那神圣、永不朽坏的信息，从东方一直传到西方”对ἐξαπέστειλεν…τὸ κήρυγμα的表达不够贴切。
    rationale: 该句的主语是耶稣，谓语是“差出／发送”，宾语是“宣告”；应保留“耶稣借着她们把……宣告从东方直到西方传扬出去”的结构，避免将κήρυγμα泛化为“信息”。
