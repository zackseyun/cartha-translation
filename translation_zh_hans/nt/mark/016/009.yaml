  text: ⟦Ἀναστὰς δὲ πρωῒ πρώτῃ σαββάτου ἐφάνη πρῶτον Μαρίᾳ τῇ Μαγδαληνῇ, ⸀παρ’ ἧς ἐκβεβλήκει ἑπτὰ δαιμόνια.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/009.yaml
  text: After he had risen[a], early on the first day of the week, he appeared first to Mary Magdalene, from whom he had cast out seven demons.
translation:
  language: zh_hans
  text: 他复活以后[a]，在一周的第一天清早，先向抹大拉的马利亚显现；耶稣曾从她身上赶出七个鬼。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 马可福音16:9–20不见于一些早期抄本；另一些抄本收录这段，经文形式有时存在差异。
    reason: textual_variant
lexical_decisions:
- source_word: Ἀναστὰς
  choice: 他复活以后
  rationale: 不定过去时分词在此相对于主要动词ἐφάνη表达先发生的时间关系；译为“复活以后”自然清楚，又保留事件次序。
- source_word: δὲ
  choice: 不单独译出
  rationale: δὲ是轻微的承接词；现代汉语在此无需硬加“现在”或“但是”，按上下文自然承接更为顺畅。
- source_word: πρωῒ πρώτῃ σαββάτου
  choice: 在一周的第一天清早
  rationale: πρωῒ指清早；πρώτῃ σαββάτου是犹太—希腊语习用表达，意为一周的第一天。
- source_word: ἐφάνη πρῶτον
  choice: 先……显现
  rationale: ἐφάνη在复活显现语境中自然译作“显现”；πρῶτον表示显现次序，译作“先”。
- source_word: Μαρίᾳ τῇ Μαγδαληνῇ
  choice: 抹大拉的马利亚
  rationale: 采用现代中文圣经语境中通行且易于辨认的人名、地名形式；与“向”搭配表达希腊文与格关系。
- source_word: παρ’ ἧς ἐκβεβλήκει
  choice: 曾从她身上赶出
  rationale: 过去完成时说明赶鬼发生在此次显现以前；“曾”自然体现这一先时关系，“从她身上赶出”明确表达鬼被逐离其人。
- source_word: ἑπτὰ δαιμόνια
  choice: 七个鬼
  rationale: 在福音书赶鬼语境中，δαιμόνια指邪灵性存在；“鬼”简洁、通俗，并保留原文的具体数目。
theological_decisions:
- issue: 马可福音16:9位于长结尾中的文本鉴别地位
  choice: 依所给SBLGNT正文翻译本节，并以脚注说明16:9–20的抄本差异。
  alternative: 部分早期抄本止于16:8，不含16:9–20；其他抄本收录这段，经文形式有时存在差异。
  rationale: 所给希腊文本收录本节但以括号标示争议。正文应予翻译，同时不应掩盖重要的文本证据差异。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。主句用“先向……显现”保持原文次序；后半句补出“耶稣”以避免中文中“他”可能误指马利亚，同时不增加新的解释性内容。
