  text: ὁ πιστεύσας καὶ βαπτισθεὶς σωθήσεται, ὁ δὲ ἀπιστήσας κατακριθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/016.yaml
  text: The one who has believed and been baptized will be saved[b][a], but the one who has disbelieved will be condemned.
translation:
  language: zh_hans
  text: 信了并受了洗的人必得救；但不信的人必被定罪。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ πιστεύσας
  choice: 信了……的人
  rationale: 定冠词加不定过去时分词作名词用，泛指具有这一行为特征的人。“信了……的人”保留单数代表性表达，也体现相对于将来结果已经发生的行动。
- source_word: βαπτισθεὶς
  choice: 受了洗
  rationale: 不定过去时被动分词与“信了”并列；“受了洗”明确保留被动含义，并自然表达先于“必得救”的行动。
- source_word: σωθήσεται
  choice: 必得救
  rationale: 将来时被动语态在此具有救恩语境中的“得救”之意；“必”自然表达将来结果的确定性，而不额外说明其机制。
- source_word: ὁ δὲ ἀπιστήσας
  choice: 但不信的人
  rationale: δέ在此表示对比，译作“但”。ἀπιστέω与πιστεύω构成直接反义；现代汉语用“不信的人”比“已经不信的人”自然，同时保留泛指意义。
- source_word: κατακριθήσεται
  choice: 必被定罪
  rationale: 将来时被动语态指受到不利判决；“被定罪”既保留被动形式，也准确表达定罪的司法含义。
- source_word: καὶ
  choice: 并
  rationale: 连接“信了”和“受了洗”两个并列分词，不增加因果或轻重关系。
theological_decisions:
- issue: 相信、受洗与得救之间的关系
  choice: 按原文并列陈述“信了并受了洗的人必得救”，同时按原文只说“不信的人必被定罪”。
  alternative: 把受洗明确解释为得救的工具性必要条件，或将受洗弱化为与得救无关的附带事项。
  rationale: 希腊文以两个并列分词描述将要得救的人，但后半句明确被定罪的是不信的人，并未明说未受洗的人。译文保留这种张力，不作宗派性推论。
- issue: 阳性单数名词化分词的泛指功能
  choice: 译作单数形式的“……的人”。
  alternative: 译作复数“那些……的人”或条件式“凡……的”。
  rationale: “……的人”在现代汉语中可自然泛指任何人，不限男性，同时较贴近原文的代表性单数结构。
translation_notes:
  register: 采用简洁、庄重而通顺的现代标准汉语。“信了并受了洗”保留两个行动的并列及完成意味；分号凸显前后结果的对照。
