source:
  edition: SBLGNT
  text: ⸀ὄφεις ἀροῦσιν κἂν θανάσιμόν τι πίωσιν οὐ μὴ αὐτοὺς βλάψῃ, ἐπὶ ἀρρώστους χεῖρας ἐπιθήσουσιν καὶ καλῶς ἕξουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/018.yaml
  text: They will pick up snakes[a], and if they drink anything deadly, it will certainly not harm them; they will lay hands on the sick[d][c][b], and they will recover.
translation:
  language: zh_hans
  text: 他们将拿起蛇[a][b]；即使喝了什么致命的东西[c]，也绝不会受到伤害；他们把手按在病人身上，病人就会康复[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些早期抄本没有马可福音16:9—20；本节属于马可福音较长的结尾。
    reason: textual_variant
  - marker: b
    text: “蛇”也可译作“蛇类”；原文并未特别说明是毒蛇。
    reason: lexical_alternative
  - marker: c
    text: 或译：“任何致命之物”；原文含义宽泛，不仅限于毒药。
    reason: lexical_alternative
  - marker: d
    text: 直译：“他们就会安好。”这里的“他们”指病人。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄφεις
  choice: 蛇
  rationale: 采用现代汉语中自然、通用的名称；既可对应普通意义的蛇，也不增添“毒蛇”等原文未明说的限定。
- source_word: ἀροῦσιν
  choice: 将拿起
  rationale: αἴρω在此表示拿起、举起；“拿起”自然地表达与蛇有关的实际动作，同时不擅自说明是主动抓取还是偶然接触。
- source_word: κἂν
  choice: 即使
  rationale: καὶ ἐάν引出条件，并在本句语境中带有让步意味；“即使”与后面的强调否定配合自然。
- source_word: θανάσιμόν τι
  choice: 什么致命的东西
  rationale: 保留表达的宽泛性，指任何足以致命之物，不把含义缩限为“毒药”。
- source_word: πίωσιν
  choice: 喝了
  rationale: 条件从句中的不定过去时虚拟语气在汉语中自然表达为“即使喝了”，呈现可能发生的事件。
- source_word: οὐ μὴ
  choice: 绝不会
  rationale: 以“绝不会”传达希腊文双重否定结构的强烈否定语气。
- source_word: βλάψῃ
  choice: 受到伤害
  rationale: βλάπτω表示造成损害或伤害；被动式汉语表达符合原句中致命之物不会伤害他们的关系。
- source_word: ἐπὶ ἀρρώστους
  choice: 在病人身上
  rationale: 与“把手按”组成自然的现代汉语表达；ἀρρώστους明确指患病的人。
- source_word: χεῖρας ἐπιθήσουσιν
  choice: 他们把手按在
  rationale: 准确呈现“将手放在……上”的动作，也保留圣经语境中按手的惯用表达。
- source_word: καλῶς ἕξουσιν
  choice: 病人就会康复
  rationale: 该短语直译近于“会安好/状况良好”；在病人的语境中，“康复”清楚自然地表达结果，并以脚注保留较直译的可能。
theological_decisions:
- issue: 所应许的保护和医治具有什么性质
  choice: 按原文直接陈述这些未来的行动和结果，不添加其是否适用于所有信徒、是否具有时代限制或是否属于象征的解释。
  alternative: 可解释为历代所有信徒普遍具有的常态、仅限使徒时代的记号，或纯粹象征性的语言。
  rationale: 原文只直接陈述这些行动与结果；译文应保留其神学张力，避免引入延续论、终止论或象征说的宗派立场。
- issue: 马可福音16:9—20的文本鉴别状况
  choice: 翻译所提供的SBLGNT经文，同时用脚注说明本节属于马可福音较长结尾，而一些早期抄本没有16:9—20。
  alternative: 因其文本鉴别问题而省略本节，或在正文中把整节置于括号内。
  rationale: 所给原文包含本节，故正文予以翻译；但这一重要抄本差异应向读者透明说明。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“将……；即使……也绝不会……；……就会……”保留原文的并列推进、条件让步和强调否定。用“把手按在病人身上”避免过度礼仪化，同时保持圣经语境中按手的含义；用“康复”使普通读者易懂，并在脚注中保留καλῶς ἕξουσιν较直译的表达。
