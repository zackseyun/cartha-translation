  text: Μετὰ δὲ ταῦτα δυσὶν ἐξ αὐτῶν περιπατοῦσιν ἐφανερώθη ἐν ἑτέρᾳ μορφῇ πορευομένοις εἰς ἀγρόν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/012.yaml
  text: After these things[b][a], he appeared in a different form to two of them as they were walking on their way into the countryside.
translation:
  language: zh_hans
  text: 这些事以后，耶稣以不同的形貌[a]向他们中的两个人显现；当时他们正步行前往乡间[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以另一种形貌”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“前往田野。”这里将ἀγρός译作“乡间”，反映它在本语境中很可能指乡野地区。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ ταῦτα
  choice: 这事以后
  rationale: 保留时间上的承接关系；现代汉语用“这事以后”比逐字译作“这些事以后”更自然。δέ在此主要起续接作用，无须机械译出。
- source_word: δυσὶν ἐξ αὐτῶν
  choice: 向他们中间的两个人
  rationale: 表达这两人是从较大群体中选出的成员，同时保持自然、清楚的现代汉语。
- source_word: περιπατοῦσιν
  choice: 正步行
  rationale: 用“正”体现现在分词与主句动作同时发生及其持续性。
- source_word: ἐφανερώθη
  choice: 显现
  rationale: 此处指复活后的出现；“显现”自然、庄重，也比“被显明”更符合汉语叙事习惯。
- source_word: ἐν ἑτέρᾳ μορφῇ
  choice: 以另一种形态
  rationale: μορφή可指形态或外在样貌；“形态”较贴近原文，并不进一步解释这种差异如何产生。脚注保留“不同的样貌”这一自然译法。
- source_word: πορευομένοις εἰς ἀγρόν
  choice: 前往乡间
  rationale: πορεύομαι表示有目的地前行，与前面的“步行”结合为“步行前往”；ἀγρός在此很可能泛指乡野地区，而非特定的一块田。
theological_decisions:
- issue: ἐν ἑτέρᾳ μορφῇ所描述的复活显现之性质
  choice: 译作“以另一种形态”，不说明这种差异的具体机制
  alternative: “以不同的样貌”
  rationale: 经文只陈述耶稣以有别的μορφή显现，并未说明这是外貌改变、认知受限，还是其他情形；译文保留这一张力，不加入额外的神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。明确补出主语“耶稣”，以符合汉语表达并承接上下文；分号用于清楚呈现显现与两人行路这一同时发生的情景。
