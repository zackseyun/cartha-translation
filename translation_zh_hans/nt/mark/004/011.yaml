  text: καὶ ἔλεγεν αὐτοῖς· Ὑμῖν ⸂τὸ μυστήριον δέδοται⸃ τῆς βασιλείας τοῦ θεοῦ· ἐκείνοις δὲ τοῖς ἔξω ἐν παραβολαῖς τὰ πάντα γίνεται,
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/011.yaml
  text: And he was saying to them, “To you the mystery of the kingdom of God has been given, but to those outside everything comes in parables,”
translation:
  language: zh_hans
  text: 他对他们说：“神国的奥秘已经赐给你们；但对那些在外面的人，一切都在比喻中发生，[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一切都在比喻中发生”也可译作“一切都以比喻的形式呈现”。原文ἐν παραβολαῖς τὰ πάντα γίνεται结构紧凑；γίνεται的动态含义，以及介词短语与“一切”的具体关系，在中文中可有不同表达。
    reason: 说明原文句法和γίνεται的语义开放性，避免把比喻的作用预先限定为单纯教学、遮蔽或审判。
lexical_decisions:
- source_word: τὸ μυστήριον
  choice: 奥秘
  rationale: 保留希腊词所指由神启示、原先隐藏的真相，不弱化为一般的‘秘密’。
- source_word: δέδοται
  choice: 已经赐给
  rationale: 以完成体表达已经发生且结果持续的赐予，并保留神为隐含施事者的被动语态。
- source_word: τοῖς ἔξω
  choice: 外面的人
  rationale: 保留原文的空间性群体称谓及其语境张力，不擅自具体化为某一类不信者。
- source_word: ἐν παραβολαῖς
  choice: 用比喻
  rationale: 自然表达方式或媒介，同时保留复数所涵盖的比喻性教导。
- source_word: τὰ πάντα γίνεται
  choice: 一切都……临到他们
  rationale: 尽量体现 γίνεται 的动态意味，并保留其较为开放的语义，不静态化为‘一切都是比喻’。
theological_decisions:
- issue: 神国奥秘的领受
  choice: 已经赐给你们
  alternative: 你们可以知道
  rationale: 原文强调这是被赐下的，而非仅指认知能力；保留神恩赐与启示的意味。
- issue: 比喻与外面之人的关系
  choice: 一切都用比喻临到他们
  alternative: 一切对他们来说都是比喻
  rationale: 选择动态译法对应 γίνεται，同时不在本节内预先裁定比喻究竟只是教学形式，还是兼具遮蔽或审判作用。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“外面的人”刻意保留原文简洁而带张力的称呼；句末逗号反映本节话语在下一节继续。
