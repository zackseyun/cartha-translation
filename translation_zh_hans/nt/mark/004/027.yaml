  text: καὶ καθεύδῃ καὶ ἐγείρηται νύκτα καὶ ἡμέραν, καὶ ὁ σπόρος ⸀βλαστᾷ καὶ μηκύνηται ὡς οὐκ οἶδεν αὐτός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/027.yaml
  text: and he sleeps and rises night and day[a], and the seed sprouts and grows[b], though he himself does not know how.
translation:
  language: zh_hans
  text: 他夜里睡觉，白天起来，种子发芽、长高[a]，他自己却不知道是怎么回事。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“发芽长大”。“长高”所译的原文动词具体含有伸长或增高之意。
    reason: lexical_alternative
  - marker: b
    text: 直译：“怎样他自己不知道。”这里指他自己不知道种子是怎样生长的。
    reason: lexical_alternative
lexical_decisions:
- source_word: καθεύδῃ
  choice: 睡觉
  rationale: 现在时虚拟语气在比喻的叙述中表达反复、持续的日常动作；汉语用普通动词即可自然传达。
- source_word: ἐγείρηται
  choice: 起来
  rationale: 此处为不及物用法，指睡醒起身；“起来”自然简洁，也避免引入复活的含义。
- source_word: νύκτα καὶ ἡμέραν
  choice: 夜里……白天……
  rationale: 保留原文“夜和昼”的时间循环，并按现代汉语习惯与“睡觉、起来”分别搭配。
- source_word: ὁ σπόρος
  choice: 种子
  rationale: 定冠词表明这是上文所撒的种子；“种子”准确而通俗。
- source_word: βλαστᾷ
  choice: 发芽
  rationale: 准确表达植物开始萌发生长，符合现代汉语。
- source_word: μηκύνηται
  choice: 长高
  rationale: 该词具体含有伸长、增高之意；“长高”既保留词义特点，也比“变长”更符合植物生长的汉语表达。
- source_word: ὡς οὐκ οἶδεν αὐτός
  choice: 他自己却不知道是怎么长成的
  rationale: “却”自然表达在种子生长与撒种者不明其过程之间的张力；“怎么”补明原文ὡς在此结构中所指的方式，αὐτός则以“自己”体现强调。
theological_decisions:
- issue: 比喻中种子生长的施事与机制
  choice: 只说明撒种的人不知道种子如何长成，不点明生长的施事
  alternative: 明确译成上帝使种子生长，或仅将其解释为自然过程
  rationale: 原文强调种子持续生长以及那人对此过程并不知晓，却没有在本节明说是上帝所为，也没有作纯自然主义解释；译文保留这一神学张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“夜里睡觉，白天起来”保持原文的节奏和昼夜循环；“发芽长高”呈现植物生长的两个阶段。
