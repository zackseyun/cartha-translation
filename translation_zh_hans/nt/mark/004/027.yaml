  naturalness: “他夜里睡觉，白天起来”及“种子发芽、长高”自然、简洁，适合现代标准汉语。“他自己却不知道是怎么回事”清楚表达对过程／方式的不知，而不使句子显得累赘。
  terminology: “种子”“发芽”“长高”恰当。“长高”在植物语境中可自然传达 μηκύνηται 的伸长、长高之意。修订脚注以“怎样”说明 ὡς 的方式性用法，避免把它不必要地固定为“正如”。
