  text: Καὶ πάλιν ἤρξατο διδάσκειν παρὰ τὴν θάλασσαν. καὶ ⸀συνάγεται πρὸς αὐτὸν ὄχλος ⸀πλεῖστος, ὥστε αὐτὸν ⸂εἰς πλοῖον ἐμβάντα⸃ καθῆσθαι ἐν τῇ θαλάσσῃ, καὶ πᾶς ὁ ὄχλος πρὸς τὴν θάλασσαν ἐπὶ τῆς γῆς ⸀ἦσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/001.yaml
  text: And again he began to teach beside the sea. And a very large crowd gathers to him, so that he got into a boat and sat on the sea, and the whole crowd was by the sea on the land.
translation:
  language: zh_hans
  text: 耶稣又开始在海边教导人。一大群人聚集到他那里[a]，以致他上了船，坐在船上，船在海面上[b]；众人则都在海边的岸上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“正聚集到他那里”。马可常用叙事现在时，使叙述更生动。
    reason: lexical_alternative
  - marker: b
    text: 直译“在海中”；这里是指耶稣坐在海面上的船中，而众人留在岸上。
    reason: cultural_note
lexical_decisions:
- source_word: πάλιν
  choice: 又
  rationale: 简洁自然地表达耶稣再次进行教导，保留重复之意。
- source_word: ἤρξατο διδάσκειν
  choice: 开始……教导人
  rationale: 保留起始体结构；补出“人”使现代汉语表达自然，并未增加新的指称对象。
- source_word: παρὰ τὴν θάλασσαν
  choice: 在海边
  rationale: παρά加宾格在此表示沿海的地点；仍译“海”，不以背景知识改作“湖”。
- source_word: συνάγεται
  choice: 聚集
  rationale: 希腊文使用叙事现在时，中文以无时态标记的“聚集”自然承载叙事推进，并在脚注提示其生动用法。
- source_word: ὄχλος πλεῖστος
  choice: 一大群人
  rationale: “一大群”以自然现代汉语表达πλεῖστος所强调的庞大人数。
- source_word: πρὸς αὐτόν
  choice: 到他那里
  rationale: 表达众人朝向耶稣并聚到他身边的动态。
- source_word: ὥστε
  choice: 以致
  rationale: 明确表示前述人群众多所产生的结果。
- source_word: εἰς πλοῖον ἐμβάντα
  choice: 他上了船
  rationale: 自然表达登船动作，同时与后面的“坐”共同置于结果结构之下。
- source_word: πλοῖον
  choice: 船
  rationale: 通俗准确，不擅自限定船只大小。
- source_word: καθῆσθαι
  choice: 坐
  rationale: 直接保留耶稣在船上坐下或坐着教导的姿态。
- source_word: ἐν τῇ θαλάσσῃ
  choice: 在海面上
  rationale: 结合船只语境，表达船位于水面；脚注说明并非指耶稣直接坐在水上。
- source_word: πᾶς ὁ ὄχλος
  choice: 众人则都
  rationale: 自然表达整个群体，并借“则”清楚对照耶稣在水上、群众在岸上的位置。
- source_word: ἐπὶ τῆς γῆς
  choice: 岸上
  rationale: 在海边场景中自然表达“陆地上”，与船所在的海面形成空间对照。
