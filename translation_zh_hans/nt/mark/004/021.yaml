  text: Καὶ ἔλεγεν ⸀αὐτοῖς· Μήτι ⸂ἔρχεται ὁ λύχνος⸃ ἵνα ὑπὸ τὸν μόδιον τεθῇ ἢ ὑπὸ τὴν κλίνην, οὐχ ἵνα ἐπὶ τὴν λυχνίαν ⸀τεθῇ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/021.yaml
  text: And he was saying to them[a], “A lamp does not come to be put under a basket or under a bed[b], does it? Is it not to be put on the lampstand?”
translation:
  language: zh_hans
  text: 他又对他们说：“难道灯来[a]，是要放在量器[b]底下或床底下吗？不是要放在灯台上吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“灯来”，把灯说得仿佛会自己来到，是一种鲜明的拟人表达；也可意译为“人拿灯来”。
    reason: lexical_alternative
  - marker: b
    text: 这里的“量器”指一种用来量干物的容器；传统上有译作“斗”的。
    reason: cultural_note
lexical_decisions:
- source_word: ἔλεγεν
  choice: 还对他们说
  rationale: 未完成时在这里延续叙事中的教导话语；“还……说”既自然，也体现耶稣继续对他们讲话。
- source_word: Μήτι
  choice: 难道……吗
  rationale: Μήτι引出预期否定回答的反问；现代汉语用“难道……吗”能保留其反问力度。
- source_word: ἔρχεται ὁ λύχνος
  choice: 灯来
  rationale: 保留希腊文把灯人格化的鲜明主动表达，而不直接改写成“有人把灯拿来”；因汉语中略显特殊，附注说明。
- source_word: λύχνος
  choice: 灯
  rationale: 指具体的便携油灯，而不是抽象的“光”；上下文已足以表达其功能，无须在正文中加上“油”。
- source_word: μόδιον
  choice: 量器
  rationale: μόδιος本指一定容量的干量单位，也指相应的量具容器；“量器”比“斗”更少地域和古代中国度量衡联想，并由脚注补充文化背景。
- source_word: κλίνην
  choice: 床
  rationale: 在这一家庭场景中，“床”是自然、清楚的现代汉语表达。
- source_word: λυχνίαν
  choice: 灯台
  rationale: 准确指放置灯的台架，并保留与“灯”的词义关联。
- source_word: ἵνα ... τεθῇ
  choice: 是为了放在
  rationale: 以自然汉语表达ἵνα所含的目的意义；汉语无须机械加入被动标记，也能清楚表达灯被放置的位置。
theological_decisions:
- issue: 是否保留“灯来”的人格化表达
  choice: 正文采用“灯来”，并以脚注说明
  alternative: 译作“人拿灯来”或“灯被拿来”
  rationale: 原文主动说“灯来”，是刻意鲜明的箴言式表达。保留这一张力可避免把隐含的行动者直接补入正文。
- issue: ὁ λύχνος在格言中的定指性
  choice: 译作泛指的“灯”
  alternative: 译作“那灯”或“一盏灯”
  rationale: 冠词在此可用于类别性的泛指。汉语裸名词“灯”自然表达一般性的原则，也不误导为某一盏已知的灯。
- issue: 两处ἵνα是否都表达目的
  choice: 两处均译为“为了”
  alternative: 第一处译为结果，第二处译为目的
  rationale: 平行结构强调灯应有的用途；统一译法保留原文修辞对应，同时不提前解释比喻的神学所指。
translation_notes:
  register: 采用现代、庄重而易懂的口语化书面语。反问句保持耶稣教导中的鲜明力度；正文保留“灯来”这一略显特殊但源于希腊文的拟人意象，并用脚注帮助普通读者理解。
