  text: χωρὶς δὲ παραβολῆς οὐκ ἐλάλει αὐτοῖς, κατ’ ἰδίαν δὲ τοῖς ⸂ἰδίοις μαθηταῖς⸃ ἐπέλυεν πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/034.yaml
  text: And he was not speaking to them without a parable[b][a], but in private he was explaining everything to his own disciples.
translation:
  language: zh_hans
  text: 他若不借着比喻，就不对他们讲论；但私下里，他却向他自己的门徒[b]讲解一切[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “讲解一切”也可译作“解释一切”或“阐明一切”。这个动词可指讲解、解释或阐释。
    reason: lexical_alternative
  - marker: b
    text: “他自己的门徒”保留了希腊文中“自己的”这一强调。
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς παραβολῆς
  choice: 不用比喻
  rationale: χωρίς表示“没有、离开”，与单数παραβολῆς连用，指不用比喻这种讲论方式；译文保留原文的否定结构及“比喻”的具体含义。
- source_word: οὐκ ἐλάλει αὐτοῖς
  choice: 就不对他们讲
  rationale: 未完成时在这段叙事总结中表示一贯或反复的做法；汉语用条件式否定自然传达这种惯常意义，又不额外补明所讲的内容。
- source_word: κατ’ ἰδίαν
  choice: 私下里
  rationale: 这是表示非公开场合的固定用语；“私下里”与前半句面向众人的讲论形成清楚对照。
- source_word: τοῖς ἰδίοις μαθηταῖς
  choice: 向自己的门徒
  rationale: ἰδίοις带有“自己的”这一强调，不宜仅译作“门徒”；“向”也自然表达希腊语与格所标示的对象。
- source_word: ἐπέλυεν
  choice: 讲解
  rationale: 此处动词可表示解释、阐明或解说。译作“讲解”通俗自然，也与未完成时所表达的一贯做法相称。
- source_word: πάντα
  choice: 一切
  rationale: 原文只笼统地说“一切”，没有明确限定为“一切比喻”或“一切所讲的话”；译文保留这一范围上的开放性。
theological_decisions:
- issue: 耶稣私下讲解的范围
  choice: 译作“讲解一切”，不在正文中限定“一切”的具体所指。
  alternative: 讲解所有比喻；把所讲的一切都解释清楚
  rationale: 上下文可能使“一切”主要指他的比喻或教导，但希腊文πάντα本身没有明说这一限制。保留简洁、宽泛的表达，可避免替原文消除其含义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“他不用比喻，就不对他们讲”简洁保留原文的否定句式，并以“就”自然表达其惯常做法；后半句不添加“一切比喻”等上下文推断。脚注标记置于各自实际对应的词语之后。
