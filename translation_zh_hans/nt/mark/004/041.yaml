  text: καὶ ἐφοβήθησαν φόβον μέγαν, καὶ ἔλεγον πρὸς ἀλλήλους· Τίς ἄρα οὗτός ἐστιν ὅτι καὶ ὁ ἄνεμος καὶ ἡ θάλασσα ⸀ὑπακούει αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/041.yaml
  text: And they feared a great fear[a], and they said to one another, “Who then is this, that even the wind and the sea obey him?”
translation:
  language: zh_hans
  text: 他们就大为惧怕[a]，彼此说：“这到底是谁，连风和海也听从他？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译近似“他们惧怕了极大的惧怕”；希腊原文以同源动词和名词加强语气。
    reason: 说明原文的同源宾语加强结构及较直译法。
lexical_decisions:
- source_word: ἐφοβήθησαν φόβον μέγαν
  choice: 大为惧怕
  rationale: 原文以同源动词和名词构成加强语气，直译近似“惧怕了极大的惧怕”。“大为惧怕”既保留强烈程度，也符合现代汉语表达。
- source_word: ἔλεγον
  choice: 说
  rationale: 未完成时可表示持续或反复，但此处在叙事中用“说”自然流畅，且不排除当时彼此交谈的过程性。
- source_word: πρὸς ἀλλήλους
  choice: 彼此说
  rationale: 直接表达相互交谈，简洁自然。
- source_word: Τίς ἄρα οὗτός ἐστιν
  choice: 这到底是谁
  rationale: “到底”传达ἄρα在惊讶中作出推断、追问究竟的语气。
- source_word: ὅτι
  choice: ？
  rationale: 汉语以两个紧接的问句自然呈现后半句作为惊叹式追问的内容和依据，不必生硬译出连接词。
- source_word: καὶ ὁ ἄνεμος καὶ ἡ θάλασσα
  choice: 连风和海也
  rationale: “连……也……”准确体现第一个καί的强调意味，并以“和”连接两个主语。
- source_word: ὑπακούει αὐτῷ
  choice: 听从他
  rationale: ὑπακούω意为听从、服从；“听从他”既体现风和海响应命令，也保留拟人化色彩。
theological_decisions:
- issue: 耶稣对受造界的权柄
  choice: 保留门徒惊讶的提问，以及风和海听从他的直接陈述，不增添明说其神圣身份的解释。
  alternative: 在译文中直接说明这一神迹证明耶稣的神性。
  rationale: 本节借门徒的疑问和风海的顺服有力显出耶稣非凡的权柄，但原文本身仍以问题呈现，译文不应替门徒回答。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“大为惧怕”比逐字译法自然，又比“很害怕”更能保留原文的强烈语气；“这到底是谁”呈现门徒在神迹后的震惊与追问。
