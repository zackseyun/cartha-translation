  text: καὶ ἄλλο ἔπεσεν εἰς τὰς ἀκάνθας, καὶ ἀνέβησαν αἱ ἄκανθαι καὶ συνέπνιξαν αὐτό, καὶ καρπὸν οὐκ ἔδωκεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/007.yaml
  text: And other seed fell among the thorns[a], and the thorns came up and choked it[b], and it yielded no fruit.
translation:
  language: zh_hans
  text: 另有种子落在荆棘丛中[a]；荆棘长起来，把它挤住了，它就没有结出果实[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“落进荆棘中。”原文介词有“进入”的意思；正文按此处农业场景译作较自然的“落在荆棘丛中”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“它就没有结果子。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλο
  choice: 另有种子
  rationale: 中性单数“另一个”承接上文，所指是种子。中文补出“种子”，可使指代清楚而不增加新的内容。
- source_word: ἔπεσεν
  choice: 落在
  rationale: 按 πίπτω 的基本意义译为“落”，不以“撒”代替原文动词，从而避免把上下文中的撒种动作直接带入本句。
- source_word: εἰς τὰς ἀκάνθας
  choice: 在荆棘丛中
  rationale: εἰς 本义带有“进入”的方向感；在此农业场景中，“落在荆棘丛中”是自然中文，也保留种子落入长有荆棘之处的意思。
- source_word: ἀνέβησαν
  choice: 长起来
  rationale: 用于植物时，“长起来”自然表达其向上生长，既贴合原文，也不过度强化生长速度。
- source_word: συνέπνιξαν
  choice: 挤住了
  rationale: 该复合动词在植物竞争的语境中指一同挤压、窒碍其生长。“挤住”比字面化的“掐住”更符合现代中文农业场景，同时保留荆棘使种子无法结果的强烈作用。
- source_word: αὐτό
  choice: 它
  rationale: 原文用单数代词回指那粒种子；中文“它”足以保持这一指代。
- source_word: καρπὸν οὐκ ἔδωκεν
  choice: 它就没有结出果实
  rationale: 原文直译为“没有给出果实”。中文以“结出果实”表达植物结果最自然，并由“就”清楚呈现前述挤压造成的结果。
theological_decisions: []
