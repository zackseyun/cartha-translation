  text: ⸂καὶ ὅτε ἀνέτειλεν ὁ ἥλιος⸃ ⸀ἐκαυματίσθη καὶ διὰ τὸ μὴ ἔχειν ῥίζαν ἐξηράνθη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/006.yaml
  text: And when the sun rose[a], it was scorched, and because it had no root, it withered.
translation:
  language: zh_hans
  text: 太阳一出来，它就被晒焦了；又因为没有根，便枯萎了[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“干枯了”。这个希腊语动词可以表示变干或枯萎。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ὅτε ἀνέτειλεν ὁ ἥλιος
  choice: 太阳一出来
  rationale: ὅτε引出时间从句，ἀνατέλλω与“太阳”连用表示升起；“一……就……”在现代汉语中自然地衔接随后发生的结果。句首καί承接上文，其连接作用已由语流体现，不必机械译出“并且”。
- source_word: ἐκαυματίσθη
  choice: 被晒焦了
  rationale: 该被动动词表示受热灼伤；在阳光与幼苗的农业语境中，“被晒焦了”既保留被动意义，也自然明确地表达烈日造成的损害。
- source_word: διὰ τὸ μὴ ἔχειν ῥίζαν
  choice: 因为没有根
  rationale: διά加带冠词的不定式结构表示原因；ῥίζαν为单数，直译为“根”符合汉语习惯。
- source_word: ἐξηράνθη
  choice: 枯萎了
  rationale: ξηραίνω在此表示植物变干、枯萎；“枯萎了”贴合农业意象，同时保留可理解为“干枯”的词义范围。
theological_decisions: []
translation_notes:
  register: 采用现代、自然而庄重的叙事语言。“它”承接上文落在石地上的种子及其长出的幼苗，避免在本节中增添原文未明说的名词。分号清楚呈现日晒与无根这两个紧密相连的因素。
