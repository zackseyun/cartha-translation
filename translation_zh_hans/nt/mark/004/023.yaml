  yaml_path: translation/nt/mark/004/023.yaml
  text: If anyone has ears to hear[a], let him hear.
translation:
  language: zh_hans
  text: 如果有人有耳可听，就应当听。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἴ
  choice: 如果
  rationale: 保留希腊文条件句的形式，也符合现代汉语表达。
- source_word: τις
  choice: 有人
  rationale: 表达不定、普遍的指向，与“如果”连用自然，不限定性别。
- source_word: ἔχει
  choice: 有
  rationale: 按其通常的所有、具备之义直译。
- source_word: ὦτα
  choice: 耳
  rationale: 保留身体器官的字面意象；汉语惯用表达中单数形式“耳”即可泛指听觉器官。
- source_word: ἀκούειν
  choice: 可听
  rationale: 在“有耳可听”这一凝练结构中表达听的能力或用途，并保留与后一个ἀκούω的词语呼应。
- source_word: ἀκουέτω
  choice: 就应当听
  rationale: 表达第三人称命令的劝令力量；“听”保留原文动词重复，也可涵盖领会并接受之意，而不将其明说。
theological_decisions:
- issue: “听”的含义是否明确扩展为顺服或领会
  choice: 仍译“听”
  alternative: 就应当留心听／就应当领会
  rationale: 原文重复ἀκούω，既可指听见，也在语境中暗含接受和领悟；译文保留其语义张力，不把隐含意义直接解释进正文。
- issue: 不定单数与第三人称单数命令的表达
  choice: 如果有人……就应当听
  alternative: 凡有耳可听的，都应当听
  rationale: 汉语无需用性别代词即可保留开放、普遍的对象；同时以单数式的“有人”贴近原文，不改成显式复数。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“有耳可听”保留原文格言式结构和两个“听”之间的呼应；“就应当听”清楚传达命令语气，同时避免生硬的“让他听”。
