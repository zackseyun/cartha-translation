  text: καὶ ⸂αὐτὸς ἦν⸃ ⸀ἐν τῇ πρύμνῃ ἐπὶ τὸ προσκεφάλαιον καθεύδων· καὶ ⸀ἐγείρουσιν αὐτὸν καὶ λέγουσιν αὐτῷ· Διδάσκαλε, οὐ μέλει σοι ὅτι ἀπολλύμεθα;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/038.yaml
  text: But he himself was in the stern[a], asleep on the cushion; and they woke him and said to him, “Teacher, do you not care that we are perishing?”
translation:
  language: zh_hans
  text: 耶稣自己却在船尾，枕着垫子睡觉。门徒叫醒他，对他说：“老师，我们快没命了，你不在乎吗？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτὸς ἦν
  choice: 耶稣自己却在
  rationale: 显明主语为耶稣，并以“自己却”保留显式代词的强调和与门徒处境的对比。
- source_word: πρύμνῃ
  choice: 船尾
  rationale: 准确表达船的后部，也比航海术语更便于普通现代读者理解。
- source_word: ἐπὶ τὸ προσκεφάλαιον
  choice: 枕着垫子
  rationale: 该词指供头部倚枕的垫子；这样译既自然，又不越过原文断定其具体形制。
- source_word: καθεύδων
  choice: 睡觉
  rationale: 自然表达分词所描述的持续状态。
- source_word: ἐγείρουσιν
  choice: 叫醒
  rationale: 按汉语叙事习惯表达希腊文历史现在时，并准确呈现门徒使他醒来的动作。
- source_word: λέγουσιν
  choice: 对他说
  rationale: 按现代汉语叙事习惯处理历史现在时，并保留说话对象。
- source_word: Διδάσκαλε
  choice: 老师
  rationale: 直接对应其“教导者”的通常含义，避免“主人”等可能引入的额外身份色彩。
- source_word: οὐ μέλει σοι
  choice: 你不在乎吗
  rationale: 保留原问句急迫而带责问的语气，不将其弱化为一般性的询问。
- source_word: ἀπολλύμεθα
  choice: 我们快没命了
  rationale: 在风暴语境中自然表达迫近的毁灭或死亡，也保留门徒呼喊的紧迫感。
theological_decisions:
- issue: 门徒质问耶稣的叙事力度
  choice: 译作“我们快没命了，你不在乎吗？”
  alternative: “我们要丧命了，这对你无所谓吗？”
  rationale: 原文语气急迫且带有责问；此译不淡化张力，也不替读者判断耶稣的动机或门徒的信心。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事语言。“船尾”准确且易懂；直接引语保留危急场景中的情绪力度。原文中的头垫含义已自然融入“枕着垫子”，无需另设脚注。
