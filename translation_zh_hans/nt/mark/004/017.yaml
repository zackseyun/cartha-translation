  rationale: 修订“跌倒了”为“跌倒”，以对应原文现在时并保留其概括性；将“后来”调整为“随后”，使时间推进更自然；“因着这道遭遇”保留患难或迫害与所传之道的因果关联。脚注保留σκανδαλίζονται的绊跌意象及语境中可能的离弃含义，同时更准确说明其“感到冒犯”的词义范围。
