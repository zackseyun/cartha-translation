  text: καὶ οὐκ ἔχουσιν ῥίζαν ἐν ἑαυτοῖς ἀλλὰ πρόσκαιροί εἰσιν, εἶτα γενομένης θλίψεως ἢ διωγμοῦ διὰ τὸν λόγον ⸀εὐθὺς σκανδαλίζονται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/017.yaml
  text: and they have no root in themselves[a], but are temporary; then, when affliction or persecution arises because of the word, they immediately fall away.
translation:
  language: zh_hans
  text: 他们里面没有根，不过是暂时的；随后，一旦因着这道遭遇患难或迫害，就立刻跌倒[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“被绊倒”或“离弃”；这个希腊语动词也可指“感到冒犯”或“反感”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥίζαν ἐν ἑαυτοῖς
  choice: 自己里面没有根
  rationale: 保留种子与土壤比喻中的“根”，也保留反身表达；不添加原文没有明说的“深”或“牢固”。
- source_word: πρόσκαιροί
  choice: 不过是暂时的
  rationale: 表达只能存留一段时间，不额外解释为性格上的反复无常。
- source_word: εἶτα
  choice: 后来
  rationale: 自然标明随后发生的发展，与前文短暂维持的情形衔接。
- source_word: γενομένης θλίψεως ἢ διωγμοῦ
  choice: 一旦……遭遇患难或迫害
  rationale: 把属格独立结构自然地译作时间情境；“患难”传达压力与困苦，“迫害”保留因信仰而受逼迫的明确含义。
- source_word: διὰ τὸν λόγον
  choice: 因这道
  rationale: “道”保留本段反复出现的 λόγος 用语；加“这”明确指前文所听见并领受的道，不将其泛化为任何言论。
- source_word: εὐθὺς
  choice: 立刻
  rationale: 保留马可叙述中 εὐθύς 所体现的即时性和紧迫感。
- source_word: σκανδαλίζονται
  choice: 跌倒了
  rationale: “跌倒”保留该动词的绊跌意象及其语义张力；在本语境中也可指因压力而离弃先前所领受的道，相关可能含义置于脚注中。
theological_decisions:
- issue: 门徒承受压力语境中 σκανδαλίζονται 的含义
  choice: 跌倒了
  alternative: 离弃这道；被绊倒；因而反感
  rationale: 原文可涵盖绊跌、失足、因某事反感乃至离弃。正文采用较贴近原词意象的“跌倒”，既呈现事态的严重性，也不替文本断定其最终救恩状态；脚注说明语境中可能更强的离弃含义。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“自己里面没有根”有意保留农业比喻；“这道”与本段上下文的关键词保持一致。脚注标记紧随其所解释的“跌倒了”，避免误指前半句。
