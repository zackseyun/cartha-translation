  text: Ἀκούετε. ἰδοὺ ἐξῆλθεν ὁ ⸀σπείρων σπεῖραι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/003.yaml
  text: Listen! Behold[a], the sower went out to sow.
translation:
  language: zh_hans
  text: 你们听！看哪，[a]撒种的人出去撒种。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们听！看，撒种的人出去撒种。”
    reason: “ἰδού”是唤起注意的话语标记，也可较口语化地译为“看”。
lexical_decisions:
- source_word: Ἀκούετε
  choice: 你们听！
  rationale: 现在时主动命令语气第二人称复数，是对众人的注意命令。“你们听”既保留复数对象，也自然传达命令的力度。
- source_word: ἰδού
  choice: 看哪，
  rationale: 这是引导听者注意下文的话语标记。“看哪”保留原文突出的提示作用和庄重的叙事语气；“看”也是可行的现代译法。
- source_word: ἐξῆλθεν
  choice: 出去
  rationale: 不定过去时主动直说语气，表示从原处向外行动；“出去”在本语境中简洁自然。
- source_word: ὁ σπείρων
  choice: 撒种的人
  rationale: 带冠词的现在时分词作名词使用，指从事撒种者。“撒种的人”准确保留其角色含义，又比名词化程度较高的“撒种者”更口语自然。
- source_word: σπεῖραι
  choice: 撒种
  rationale: 不定过去时主动不定式，在“出去”之后表达目的。汉语用连动结构“出去撒种”自然传达这一目的关系。
theological_decisions: []
