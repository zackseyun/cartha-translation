base_translation:
  language: en
  yaml_path: translation/nt/mark/004/008.yaml
  text: And other seed fell into the good soil[a], and it was producing fruit, growing up and increasing, and bearing thirtyfold and sixtyfold and a hundredfold.
translation:
  language: zh_hans
  text: 另有一些种子落在好土里[a]，结果，长起来，渐渐增多，结出三十倍、六十倍、一百倍的收成。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“另有一些落在好土里”；“种子”一词可由上下文补足。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα
  choice: 另有一些种子
  rationale: ἄλλα是中性复数，承接比喻中前述的种子；汉语补出“种子”，既清楚自然，也保留复数含义。
- source_word: γῆν τὴν καλήν
  choice: 好土
  rationale: 在撒种的农业语境中，γῆ指适合生长的土壤；“好土”简洁自然，也符合现代汉语表达。
- source_word: ἐδίδου καρπὸν
  choice: 就结出果实
  rationale: 未完成时描写持续产生果实的过程；“结出果实”是自然的农业用语，“就”呈现随后发生的结果而不改变时态重点。
- source_word: ἀναβαίνοντα
  choice: 长起来
  rationale: 该现在分词描述作物向上生长；“长起来”自然呈现萌发后向上生长的动态。
- source_word: αὐξανόμενα
  choice: 越发茂盛
  rationale: 该现在分词表示持续增长；“越发茂盛”与前面的“长起来”有所区别，表现作物继续增大、繁盛。
- source_word: ἔφερεν
  choice: 收成有
  rationale: 未完成时表示持续结实、产出；结合后面的倍数，“收成有”在现代汉语中清楚表达产量，而避免重复“结出”。
- source_word: ἓν τριάκοντα καὶ ἓν ἑξήκοντα καὶ ἓν ἑκατόν
  choice: 三十倍、六十倍、一百倍
  rationale: 这一省略式表达指不同种子所得的产量倍数；以并列倍数翻译，准确而易懂。
