  text: ⸂καὶ ἄλλο⸃ ἔπεσεν ἐπὶ τὸ πετρῶδες ⸀ὅπου οὐκ εἶχεν γῆν πολλήν, καὶ ⸀εὐθὺς ἐξανέτειλεν διὰ τὸ μὴ ἔχειν βάθος γῆς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/005.yaml
  text: And other seed fell on the rocky ground[a], where it did not have much soil, and it sprang up at once because it had no depth of soil.
translation:
  language: zh_hans
  text: 又有种子落在岩石地上[a]，那里土不多；因为土层不深，种子很快就发芽了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“石头地”。希腊原文指岩石地带，其上只有一层薄土。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλο
  choice: 另有一些种子
  rationale: 中性单数形容词作名词用，承接上文所撒的种子。中文补出“种子”，并用“一些”表达集合性的种子形象，使语意自然清楚。
- source_word: πετρῶδες
  choice: 土浅石多的地方
  rationale: 该词指多石或下有岩层、表土浅薄的地带，不只是散落着几块石头。“土浅石多”结合本节后文，清楚呈现农业环境。
- source_word: γῆν πολλήν
  choice: 泥土不多
  rationale: γῆ在此指可供种子生长的土壤；“泥土不多”是自然现代汉语，也保留数量不足的表述。
- source_word: εὐθὺς
  choice: 很快
  rationale: 表示迅速发生。这里种子迅速出芽是因为土层浅，译作“很快”既自然，又避免让“立刻”产生过度机械的时间意味。
- source_word: ἐξανέτειλεν
  choice: 发芽了
  rationale: 农业语境中指植物萌发、长出；“发芽”准确而通俗，并与种子的隐含主语相配。
- source_word: διὰ τὸ μὴ ἔχειν βάθος γῆς
  choice: 因为土不深
  rationale: διά加带冠词不定式表达原因。“因为土不深”直接保留因果关系，也自然表达土层缺乏深度。
- source_word: ὅπου
  choice: 那里
  rationale: 原词为地点关系副词。拆分为分句后用“那里”承接前面的地点，符合现代汉语表达。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。将希腊文较紧密的关系从句重组为自然汉语分句，并保留“土不多—土不深—迅速发芽”的因果推进。
