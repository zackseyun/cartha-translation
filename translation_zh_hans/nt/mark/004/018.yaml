base_translation:
  language: en
  yaml_path: translation/nt/mark/004/018.yaml
  text: And others are those sown among the thorns[a]; these are the ones who have heard the word[b],
translation:
  language: zh_hans
  text: 还有的是撒在荆棘里的[a]；这些就是听了道[b]的人，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“撒进荆棘里的”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“信息”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλοι
  choice: 还有的
  rationale: 该词在此作名词用，与前面几类相对；“还有的”自然地承接比喻的分类，也保留原文的对比。
- source_word: εἰς τὰς ἀκάνθας
  choice: 在荆棘中
  rationale: εἰς通常有“进入”的方向含义，但在撒种的农业语境中，“撒在荆棘中”是自然的现代汉语，并表达种子落入长有荆棘之处；脚注保留较形式对应的译法。
- source_word: ἀκάνθας
  choice: 荆棘
  rationale: “荆棘”简洁、具体，也符合本比喻在汉语中的庄重表达。
- source_word: σπειρόμενοι
  choice: 撒在
  rationale: 现在时被动分词延续种子的比喻；汉语“撒在……中的”可自然表达被撒下的状态，而不把比喻解释性改写为一般人物描述。
- source_word: οὗτοί εἰσιν
  choice: 这些就是
  rationale: 保留原文用于解释比喻的指认结构；“就是”在现代汉语中清楚体现对应关系。
- source_word: οἱ ... ἀκούσαντες
  choice: 听了……的人
  rationale: 不定过去时分词表示听这一行动先于后文所述的发展；“听了……的人”既自然，也保留已发生的动作。
- source_word: τὸν λόγον
  choice: 这道
  rationale: 在本段语境中指所宣讲的话语或信息；“道”保留圣经语言的互文意味，加“这”使所指在现代汉语中清楚。脚注列出“这信息”这一语境化译法。
theological_decisions:
- issue: 比喻解释中人与种子的隐喻性对应
  choice: 保留“还有的是撒在荆棘中的”这一撒种隐喻
  alternative: 还有的是落在长满荆棘的地里的人／在荆棘中所栽种的人
  rationale: 希腊文继续把这些人说成“被撒下的”，并未立即将隐喻改写成解释性陈述。保留这一张力可维持耶稣解释比喻时的文学结构，避免加入原文没有明说的阐释。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“撒在荆棘中”延续上下文的撒种图景；分号体现原文由类别陈述转入解释性指认。句末逗号保留本节与下一节在句法和意义上的连续性。
