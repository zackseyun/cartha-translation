  text: ὡς ⸀κόκκῳ σινάπεως, ὃς ὅταν σπαρῇ ἐπὶ τῆς γῆς, ⸂μικρότερον ὂν⸃ πάντων τῶν ⸀σπερμάτων τῶν ἐπὶ τῆς γῆς—
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/031.yaml
  text: It is like a mustard seed[a], which, when it is sown on the ground[b], being smaller than all the seeds on the ground—
translation:
  language: zh_hans
  text: 好比一粒芥菜种子[a]，当它被撒在地上时，它比地上所有的种子都小[b]——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“一粒芥菜籽”。
    reason: lexical_alternative
  - marker: b
    text: 希腊原文用的是比较级“更小”，不是最高级“最小”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: 好比
  rationale: 承接上一节关于上帝的国可用什么来比拟的问题，以自然的汉语引出比喻；原文省略的主语可由上下文补足，无须在本节另加“它”。
- source_word: κόκκῳ σινάπεως
  choice: 一粒芥菜种子
  rationale: κόκκος可指一粒谷物或种子；在此植物意象中，“一粒芥菜种子”既自然，也保留其微小、可播种的形象。
- source_word: ὅταν σπαρῇ
  choice: 它种……时
  rationale: ὅταν加不定过去时虚拟语气表达一般性的时间情形；汉语“种……时”简洁自然，并以主动形式表达原文被动而不改变受事关系。
- source_word: ἐπὶ τῆς γῆς
  choice: 在地上
  rationale: γῆ在播种语境中指土地或土壤；“在地上”贴近ἐπί的表面方位，并保留原文两次出现的限定。
- source_word: μικρότερον ὂν
  choice: 比……都小
  rationale: 以汉语比较结构表达原文的比较级μικρότερον；不改写为明示最高级的“最小”。
- source_word: πάντων τῶν σπερμάτων τῶν ἐπὶ τῆς γῆς
  choice: 地上所有的种子
  rationale: 保留比较范围及重复出现的“地上”，不额外限定为某一植物学类别。
theological_decisions:
- issue: 芥菜种子的比较级与最高级
  choice: 比地上所有的种子都小
  alternative: 是地上所有种子中最小的
  rationale: 原文使用比较级μικρότερον，而非明确的最高级。译文采用比较句式，既保留其广泛比较，也不把原文形式悄然改成最高级；比喻所强调的起初微小仍然清楚。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙述。“芥菜种子”比单用“芥子”更便于普通读者理解；保留句末破折号，表明句意延续至下一节。
