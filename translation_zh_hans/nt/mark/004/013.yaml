  text: Καὶ λέγει αὐτοῖς· Οὐκ οἴδατε τὴν παραβολὴν ταύτην, καὶ πῶς πάσας τὰς παραβολὰς γνώσεσθε;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/013.yaml
  text: And he says to them[a], “Do you not understand this parable? Then how will you understand all the parables?”
translation:
  language: zh_hans
  text: 他对他们说：“你们不明白这个比喻吗？那么，又怎么能明白所有的比喻呢？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较形式地可译作：“你们不知道这个比喻吗？又怎么会知道所有的比喻呢？”原文用了两个不同的“知道”类动词，在这里都含有“明白、领会”的意思。
    reason: 说明两个希腊动词的基本词义及其在本语境中的译法，并保留原文用词差异。
lexical_decisions:
- source_word: λέγει
  choice: 说
  rationale: 希腊文用叙事现在时，体现马可叙事的鲜明感；现代汉语动词本身不标时态，因此用自然的“说”，不另加“当时”或“就”。
- source_word: οἴδατε
  choice: 明白
  rationale: οἶδα本可表示“知道”，但以“这个比喻”为宾语时，重点是领会其含义；“明白”符合本处语境和现代汉语表达。
- source_word: παραβολὴν
  choice: 比喻
  rationale: “比喻”是中文圣经语境中对παραβολή的通行译法，也准确指向耶稣在此所用的教导形式。
- source_word: ταύτην
  choice: 这个
  rationale: 保留指示词，指向紧接在前面的撒种比喻。
- source_word: καὶ πῶς
  choice: 那么，又怎么
  rationale: καί连接两个问句，而第二问由第一问推出；“那么”显明推论关系，“又”保留连接语气。
- source_word: πάσας τὰς παραβολὰς
  choice: 所有的比喻
  rationale: 保留πᾶς与复数定冠词所表达的整体范围，泛指这些比喻性教导。
- source_word: γνώσεσθε
  choice: 能明白
  rationale: γινώσκω在这里指领会比喻的意义；汉语反问句用“怎么能明白”自然表达将来所涉及的能力与结果。
theological_decisions:
- issue: οἴδατε与γνώσεσθε之间的关系
  choice: 两处均译为“明白”
  alternative: 分别译为“知道”和“明白”，或两处都译为“知道”
  rationale: 本节所关切的是门徒能否领会比喻，而非仅仅是否听说或知道它。两处都用“明白”保留修辞上的呼应；脚注同时交代两个希腊动词在较形式对应的译法中都可译为“知道”，不掩盖原文用词的差异。
- issue: 第二问与第一问的逻辑关系
  choice: 用“那么，又怎么”表达承接和推论
  alternative: 较形式地译为“又怎么”或“并且怎么”
  rationale: καί本身通常表示连接，但在此语境中第二问显然承接第一问形成推论。译文使这一关系在现代汉语中清楚可辨，同时不增加教义性解释。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。保留原文的两个反问句及责问语气；不以汉语时态副词强行标示希腊文的叙事现在时。
