  text: οὐ γάρ ἐστιν ⸀κρυπτὸν ἐὰν μὴ ⸀ἵνα φανερωθῇ, οὐδὲ ἐγένετο ἀπόκρυφον ἀλλ’ ἵνα ⸂ἔλθῃ εἰς φανερόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/022.yaml
  text: For nothing is hidden except to be revealed[b][a], nor has anything become concealed except to come to light.
translation:
  language: zh_hans
  text: 因为没有什么隐藏的事不是为了被显明；也没有什么事变得隐秘，不是为了显露出来。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为了”也可理解为结果：没有什么隐藏的事最终不被显明，也没有什么隐秘的事最终不显露出来。希腊文两个ἵνα从句既可带目的意味，也可带结果意味。
    reason: alternative_reading
lexical_decisions:
- source_word: γάρ
  choice: 因为
  rationale: 承接前文并说明灯不应放在斗底下的理由；现代汉语以“因为”自然表达解释关系。
- source_word: κρυπτόν
  choice: 隐藏的事
  rationale: 保留“被隐藏、看不见”的基本意义；补出“事”使中性单数形容词的名词性用法在汉语中自然。
- source_word: ἐὰν μὴ ἵνα φανερωθῇ
  choice: 不是为了显明出来的
  rationale: 表达例外结构，并保留ἵνα通常具有的目的意味；同时不排除结果意味。
- source_word: φανερωθῇ
  choice: 显明出来
  rationale: 既可指变得可见，也可指变得为人所知，并保留被动含义。
- source_word: ἐγένετο ἀπόκρυφον
  choice: 成为隐秘的事
  rationale: “成为”对应ἐγένετο所表达的进入某种状态；“隐秘”与前句“隐藏”形成细微变化而不夸大词义差异。
- source_word: ἔλθῃ εἰς φανερόν
  choice: 显露出来
  rationale: 自然表达进入公开可见状态的动态意象，避免生硬直译为“来到可见之中”。
theological_decisions:
- issue: 两个ἵνα从句的目的／结果意味
  choice: 正文采用“为了”，保留较明显的目的意味
  alternative: 可理解为结果：“没有什么隐藏的事最终不被显明……没有什么隐秘的事最终不显露出来。”
  rationale: ἵνα通常标示目的，但在通用希腊语中也可能带结果色彩。正文保留目的张力，脚注说明结果理解，避免断言隐藏状态必由某一明确主体特意安排。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。两句保持平行结构，以“隐藏／隐秘”和“显明／显露”传达原文近义词的变化；正文中的脚注标记与脚注一致。
