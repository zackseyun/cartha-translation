  text: καὶ αἱ μέριμναι τοῦ ⸀αἰῶνος καὶ ἡ ἀπάτη τοῦ πλούτου καὶ αἱ περὶ τὰ λοιπὰ ἐπιθυμίαι εἰσπορευόμεναι συμπνίγουσιν τὸν λόγον, καὶ ἄκαρπος γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/019.yaml
  text: and the cares of the age[a], and the deceitfulness of riches, and the desires for other things entering in choke the word[d][c][b], and it becomes unfruitful.
translation:
  language: zh_hans
  text: 今世的忧虑[a]、财富的迷惑[b]，以及对其他事物的欲望，进来把这道挤住了；这道就变得不能结果实了[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “今世”也可译作“这个时代”或“现今的世界秩序”。希腊语 αἰών 首先有时间上的“时代”之意，也可延伸指该时代的世界秩序。
    reason: lexical_alternative
  - marker: b
    text: 或译：“财富的欺骗性”或“财富所带来的迷惑”。
    reason: lexical_alternative
  - marker: c
    text: 原文直译为“它就变得不能结果实了”。“它”最直接可指“这道”，也有人按比喻理解为听道的人或种子所长成的植物。
    reason: referent_ambiguity
lexical_decisions:
- source_word: μέριμναι
  choice: 忧虑
  rationale: 既可指令人挂心的事务，也可指由此产生的焦虑；“忧虑”简洁自然，并保留其压迫、分心的意味。
- source_word: αἰῶνος
  choice: 今世
  rationale: αἰών基本指“时代、世代”，在这里指现今的时代及其秩序；“今世”兼顾时间含义和上下文中的现实生活指向。
- source_word: ἀπάτη τοῦ πλούτου
  choice: 财富的欺骗
  rationale: 该短语指财富所具有的迷惑、欺骗人之特性；“财富的欺骗”自然凝练，也保留属格结构的开放性。
- source_word: αἱ περὶ τὰ λοιπὰ ἐπιθυμίαι
  choice: 对其他事物的欲望
  rationale: 直陈欲望所指向的其余事物，不把它限定为某一类贪欲。
- source_word: εἰσπορευόμεναι
  choice: 进来
  rationale: 保留这些力量从外而入、侵占人心的动态画面，同时避免用“侵入”增加原文没有明说的强烈色彩。
- source_word: συμπνίγουσιν
  choice: 挤住
  rationale: 呼应荆棘使植物窒息、无法生长的比喻；“挤住”是现代汉语中自然且形象的表达。
- source_word: τὸν λόγον
  choice: 这道
  rationale: “道”保留 λόγος 在福音书语境中的宣讲含义与经文呼应；指示词“这”使中文衔接自然。
- source_word: ἄκαρπος γίνεται
  choice: 变得不能结果实
  rationale: 保留 γίνεται 的状态变化以及 ἄκαρπος 的结果意象，不简化为静态的“没有果效”。
theological_decisions:
- issue: 末尾单数谓语与形容词所指为何
  choice: 主文本以最近的单数先行词“这道”为所指
  alternative: 也可按比喻的整体图景理解为听道的人或由种子长成的植物不能结果实
  rationale: 语法上最近的明确单数先行词是 τὸν λόγον；同时，比喻中的道与种子相互对应。主文本依从最直接的语法关系，脚注则保留所指在意象层面的张力。
- issue: 分词 εἰσπορευόμεναι 修饰范围
  choice: 中文将“进来”置于三项并列成分之后，使其自然涵盖全部三项
  alternative: 只理解为修饰最后一项“对其他事物的欲望”
  rationale: 该分词为阴性复数，在句法上可与三个阴性主语构成的整体一致；宽范围理解也最符合三者共同挤住道的语义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“今世”“这道”“结果实”保留经文的核心意象和互文色彩；句式避免生硬逐词对应，并让“进来”自然统摄前面的三项并列主语。
