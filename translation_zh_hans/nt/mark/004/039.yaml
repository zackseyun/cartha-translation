  text: καὶ διεγερθεὶς ἐπετίμησεν τῷ ἀνέμῳ καὶ εἶπεν τῇ θαλάσσῃ· Σιώπα, πεφίμωσο. καὶ ἐκόπασεν ὁ ἄνεμος, καὶ ἐγένετο γαλήνη μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/039.yaml
  text: And having awakened[a], he rebuked the wind and said to the sea, “Be silent! Be still!” And the wind ceased[b], and there was a great calm.
translation:
  language: zh_hans
  text: 他醒来[a]后，斥责风，又对海[c]说：“住口！安静下来！”[b]风便停了，海面变得十分平静。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他被叫醒后。”希腊语形式没有在这里明确说明使他醒来的是谁。
    reason: 语法歧义
  - marker: b
    text: “安静下来”按字面可译作“封住嘴！”原文用了两个命令：“住口！封住嘴！”
    reason: 词义说明
  - marker: c
    text: 指加利利海；希腊文作“海”。
    reason: 地理文化说明
lexical_decisions:
- source_word: διεγερθεὶς
  choice: 他醒来
  rationale: 以自然的现代汉语表达先于主句动作的时间关系；希腊语形式为被动形态，但在此可表达从睡眠中醒来，不在正文中过度限定是谁使他醒来。
- source_word: ἐπετίμησεν
  choice: 斥责
  rationale: 保留ἐπιτιμάω在《马可福音》中严厉、带权柄的语气，强于一般的“吩咐”。
- source_word: ἀνέμῳ
  choice: 风
  rationale: 原文直接指“风”，不将其扩展为“暴风”或“风暴”。
- source_word: θαλάσσῃ
  choice: 海
  rationale: 按θάλασσα的原词翻译为“海”，不在正文中地理化改写成“湖”。
- source_word: Σιώπα
  choice: 住口！
  rationale: 用直接有力的命令表达“不要出声”，也保留耶稣把海当作受命对象的鲜明修辞。
- source_word: πεφίμωσο
  choice: 安静下来！
  rationale: 在现代汉语中自然表达使风浪止息的强制命令；其字面“封住嘴”意象由脚注保留，以免正文显得生硬。
- source_word: ἐκόπασεν
  choice: 停了
  rationale: 简洁表达风停止、平息，直接对应以“风”为主语的κοπάζω。
- source_word: γαλήνη μεγάλη
  choice: 完全平静下来
  rationale: 以自然汉语传达“大平静”的强度和结果状态，避免生硬的“一场大平静”。
theological_decisions:
- issue: 是否沿用传统译法“平静吧”，或保留两个命令及第二个命令的“封嘴”意象
  choice: 正文译作“住口！安静下来！”，脚注说明第二个命令的字面意象
  alternative: 住口！封住嘴！
  rationale: 原文是两个命令，并没有名词“平安”；正文保留双重命令和权威语气，同时通过脚注保存φιμόω的强烈比喻，不把比喻或传统措辞当作唯一解释。
- issue: θαλάσσα译作“海”还是“湖”
  choice: 海
  alternative: 湖
  rationale: 遵循原文用词，也保留《马可福音》叙事中“海”的表达；地理所指另以脚注说明。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。命令语简短有力；叙事句避免古奥表达。脚注标记均置于相关正文位置，并保留原文在语法、比喻和地理称谓上的信息。
