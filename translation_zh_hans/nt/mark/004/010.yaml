  naturalness: “后来……时”略显松散，改为“当……时”更直接自然。“向他询问这些比喻”可理解，但“问他有关这些比喻的事”更符合现代汉语中“问某人某事”的搭配，同时不预先限定他们所问的是比喻的哪一方面。
  terminology: “十二门徒”“比喻”均为合宜、通行的圣经汉语用语。“那些跟随在他身边的人”自然表达οἱ περὶ αὐτόν所指较广的圈子，且不与十二门徒混同。
