revisions:
- from: 后来，耶稣独自一处时[a]，他身边的那些人和十二门徒一同向他询问这些比喻。
  to: 当耶稣在私下里时[a]，那些跟随在他身边的人和十二门徒一起问他有关这些比喻的事。
  rationale: 修订将κατὰ μόνας译为“在私下里”，在现代汉语中更贴合此处“离开群众、与门徒及随从私下相处”的语境，同时保留脚注所需的语义范围。改用“当”直接表达Καὶ ὅτε的时间结构；将“询问这些比喻”调整为“问他有关这些比喻的事”，使汉语搭配更自然，且不添加“解释”等原文没有明确说明的内容。
