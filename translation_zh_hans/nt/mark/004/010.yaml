  text: ⸂Καὶ ὅτε⸃ ἐγένετο κατὰ μόνας, ⸀ἠρώτων αὐτὸν οἱ περὶ αὐτὸν σὺν τοῖς δώδεκα ⸂τὰς παραβολάς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/010.yaml
  text: And when he was alone[a], those around him with the Twelve were asking him about the parables.
translation:
  language: zh_hans
  text: 当耶稣在私下里时[a]，那些跟随在他身边的人和十二门徒一起问他有关这些比喻的事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在私下里”也可译作“单独在一处”或“在僻静处”。这里指耶稣离开众人的私下场合，并不一定表示他身边完全无人。
    reason: 说明κατὰ μόνας的习语含义，并避免将其误解为绝对无人，从而与下文在场的随从和十二门徒相协调。
lexical_decisions:
- source_word: Καὶ ὅτε
  choice: 后来……时
  rationale: καί承接马可的叙事，ὅτε引出时间从句；“后来……时”在现代汉语中自然地保留了承接和时间关系。
- source_word: ἐγένετο κατὰ μόνας
  choice: 耶稣独自一处
  rationale: κατὰ μόνας表示离开众人、处于私下或僻静的场合；此处补明主语“耶稣”，并用脚注避免被误解为身边绝对无人。
- source_word: ἠρώτων
  choice: 向他询问
  rationale: 未完成时描写当时持续进行的询问；汉语凭语境即可表达过程性，无须强加“不断”等较强语气。
- source_word: οἱ περὶ αὐτὸν
  choice: 他身边的那些人
  rationale: 保留“围绕他、与他在一起的一群人”的宽泛含义，不将他们限定为十二门徒，也不把表达缩减为纯粹的空间位置。
- source_word: σὺν τοῖς δώδεκα
  choice: 和十二门徒一同
  rationale: σύν表示共同参与；“十二门徒”是现代汉语对这一固定群体的清楚表达，同时维持他们与前述较广群体之间的区别。
- source_word: τὰς παραβολάς
  choice: 这些比喻
  rationale: 依照所给SBLGNT正文保留复数；“这些”自然指向耶稣刚讲过的比喻性教导，而不擅自添加“意思”或“解释”。
theological_decisions:
- issue: 询问者的身份
  choice: 耶稣身边较广的一群人连同十二门徒一起询问
  alternative: 只有十二门徒询问；或一群与十二门徒完全分开的核心追随者询问
  rationale: οἱ περὶ αὐτὸν σὺν τοῖς δώδεκα最自然地指耶稣身边的人与十二门徒共同参与。译文保留两种称谓的区分，不把较广群体等同于十二门徒。
- issue: “独自”与在场者之间的表面张力
  choice: 理解为离开群众、处于私下场合
  alternative: 理解为耶稣一度完全独自一人，其他人随后才来
  rationale: κατὰ μόνας可表示私下或僻静的情境；下文直接提到他身边的人和十二门徒，因此不宜把它绝对化为无人陪伴。脚注保留了该习语的语义范围。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“后来”承接叙事；“询问这些比喻”忠实保留宾语的复数和开放性，不提前解释为只问某一个比喻的含义。脚注标记[a]已置于相关短语之后。
