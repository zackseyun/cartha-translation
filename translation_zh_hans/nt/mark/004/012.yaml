source:
  edition: SBLGNT
  text: ἵνα βλέποντες βλέπωσι καὶ μὴ ἴδωσιν, καὶ ἀκούοντες ἀκούωσι καὶ μὴ συνιῶσιν, μήποτε ἐπιστρέψωσιν καὶ ἀφεθῇ ⸀αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/012.yaml
  text: so that seeing they may see and not perceive[a], and hearing they may hear and not understand[c][b], lest they turn back and it be forgiven them.
translation:
  language: zh_hans
  text: 为要叫他们看是看，却看不明白[a]；听是听，却不明白[c]；免得他们回转[b]，得到赦免。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“却不能辨明”。
    reason: lexical_alternative
  - marker: b
    text: “回转”也可译作“转回”；在本语境中含有“悔改”之意。
    reason: lexical_alternative
  - marker: c
    text: 耶稣在这里呼应《以赛亚书》6:9–10，保留了神的审判与百姓不肯回应之间的张力。
    reason: cross_reference
lexical_decisions:
- source_word: ἵνα
  choice: 为要叫
  rationale: 保留希腊文所表达的目的／结果意味，不将本节的神学张力弱化为单纯的结果说明。
- source_word: βλέποντες βλέπωσι
  choice: 看是看
  rationale: 用现代汉语可理解的重叠式表达再现分词与限定动词的重复和悖论性强调。
- source_word: ἴδωσιν
  choice: 看明白
  rationale: 与前面的 βλέπω 区分，表达真正看出、领会之意；脚注保留“辨明”这一词义可能。
- source_word: ἀκούοντες ἀκούωσι
  choice: 听是听
  rationale: 保留原文的重复形式及其对《以赛亚书》措辞的呼应，同时使中文自然凝练。
- source_word: συνιῶσιν
  choice: 明白
  rationale: 准确表达心智和属灵层面的理解，也是现代普通话中清楚自然的说法。
- source_word: μήποτε
  choice: 免得
  rationale: 自然保留否定性的前瞻／目的意味，并维持经文庄重语气。
- source_word: ἐπιστρέψωσιν
  choice: 回转
  rationale: 保留转回、归回的动作意象及悔改含义的可能性，而不在正文中将其收窄为明确的神学术语“悔改”。
- source_word: ἀφεθῇ αὐτοῖς
  choice: 得到赦免
  rationale: 以自然中文表达无主语被动，其施行赦免者仍保持含蓄，不补出原文未明说的宾语或施事者。
theological_decisions:
- issue: ἵνα与μήποτε所带出的目的／结果关系，以及比喻似乎阻止人回转的含义
  choice: 保留“为要叫……免得……”的目的性措辞
  alternative: 译作“结果……否则他们就会……”或改写为单纯描述人的无回应
  rationale: 原文有意保留神的审判与人的不回应之间的张力；译文不以解释性改写偏向决定论或纯描述性理解。
- issue: ἐπιστρέψωσιν是否应明确译为“悔改”
  choice: 正文译作“回转”，脚注说明也可理解为“转回”，在本语境中含有“悔改”之意
  alternative: 正文直接译作“悔改”
  rationale: 该词在先知性语境中确有悔改意味，但基本动作意象较宽；如此处理可保留真实的词义幅度。
- issue: ἀφεθῇ αὐτοῖς的神圣被动
  choice: 译作“得到赦免”，不补明施事者
  alternative: “神就赦免他们”
  rationale: 保留原文含蓄的神圣被动，不添加希腊文未明说的主语。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看是看”“听是听”以汉语惯用对举保留原文重复和反讽力度；标点将两个平行分句清楚分开。所有脚注标记均置于正文相关词句之后。
