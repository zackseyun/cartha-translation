  text: καὶ οὗτοί εἰσιν ⸀ὁμοίως οἱ ἐπὶ τὰ πετρώδη σπειρόμενοι, οἳ ὅταν ἀκούσωσιν τὸν λόγον ⸀εὐθὺς μετὰ χαρᾶς λαμβάνουσιν αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/016.yaml
  text: 'And these are likewise the ones sown on the rocky ground: when they hear the word[a], they immediately receive it with joy,'
translation:
  language: zh_hans
  text: 同样，撒在石头地上[a]的，就是这些人：他们听见这道，就立刻欢欢喜喜地领受它。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“多石之处”或“多石的地上”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοίως
  choice: 同样
  rationale: 简洁地承接前面对另一类土地的解释，保留类比性的篇章联系。
- source_word: ἐπὶ τὰ πετρώδη
  choice: 在石头地上
  rationale: 自然地呈现有浅薄土层、下面多石的农耕场景；“石头地”也与本段比喻的用语相称。
- source_word: σπειρόμενοι
  choice: 被撒
  rationale: 保留希腊文被动分词及比喻中种子与所代表之人的重叠意象，不改写为对人心状况的解释。
- source_word: τὸν λόγον
  choice: 这道
  rationale: “道”延续本段对所传信息的核心称呼；加“这”使现代汉语指代清楚，并指向前文所说的道。
- source_word: εὐθύς
  choice: 立刻
  rationale: 准确保留动作的即时性，也体现马可叙事中该副词鲜明、反复出现的风格。
- source_word: μετὰ χαρᾶς
  choice: 欢喜地
  rationale: 自然表达领受时的喜悦状态，不额外暗示这种回应是否持久。
- source_word: λαμβάνουσιν αὐτόν
  choice: 领受了
  rationale: “领受”适合听见并接受所传之道的语境，同时不把暂时的接受扩大解释为持久的信心。
theological_decisions:
- issue: “被撒在石头地上的”所指为何
  choice: 保留“那些被撒在石头地上的”这一比喻性说法
  alternative: 意译为“心田像石头地的人”
  rationale: 原文在解释比喻时仍让种子与其所代表的人相互重叠；直陈为“心田”会加入原文没有的解释，并消除其有意保留的比喻张力。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“被撒”略带比喻性的陌生感，是为忠实保留原文种子与人相互对应的表达；整体句式则按现代汉语调整，使关系清楚。
