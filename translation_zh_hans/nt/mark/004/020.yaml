  text: καὶ ⸀ἐκεῖνοί εἰσιν οἱ ἐπὶ τὴν γῆν τὴν καλὴν σπαρέντες, οἵτινες ἀκούουσιν τὸν λόγον καὶ παραδέχονται καὶ καρποφοροῦσιν ⸂ἓν τριάκοντα καὶ ἓν ἑξήκοντα καὶ ἓν⸃ ἑκατόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/020.yaml
  text: 'And those are the ones sown on the good soil: they hear the word and receive it and bear fruit—thirtyfold and sixtyfold and a hundredfold[a].'
translation:
  language: zh_hans
  text: 那些撒在好土里的，就是听这道、领受[a]并结出果实的人：有的结三十倍，有的结六十倍，有的结一百倍。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “领受”也可译作“接受”或“欣然接纳”（παραδέχονται）。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνοί
  choice: 那些
  rationale: 回指比喻解释中的最后一类人，并与前面几类形成对照；“那些”在现代汉语中自然清楚。
- source_word: οἱ ἐπὶ τὴν γῆν τὴν καλὴν σπαρέντες
  choice: 撒在好土里的
  rationale: 保留被动分词和种子撒在土里的农业意象；汉语按上下文可自然理解为所撒的种子所代表的人。
- source_word: γῆν τὴν καλὴν
  choice: 好土
  rationale: 在撒种比喻中，“土”比“土地”更简洁自然，也保留与其他土壤的评价性对照。
- source_word: οἵτινες
  choice: 就是……的
  rationale: 用汉语判断句引出这类人的界定性特征，表达其听道、领受和结果实。
- source_word: ἀκούουσιν τὸν λόγον
  choice: 听了这道
  rationale: “道”保留 λόγος 在本段中作为所宣讲之信息的传统及互文意味；“这”明确回指前文所说的道。
- source_word: παραδέχονται
  choice: 领受了
  rationale: 表达积极接纳、接受之意，并与“听了”和“结出果实”构成自然递进。
- source_word: καρποφοροῦσιν
  choice: 结出果实
  rationale: 保留农业比喻及其属灵含义，不进一步限定果实的具体内容。
- source_word: ἓν τριάκοντα καὶ ἓν ἑξήκοντα καὶ ἓν ἑκατόν
  choice: 有三十倍的，有六十倍的，有一百倍的
  rationale: 明确表达收成倍数，并以重复的“有……的”体现希腊文连续列举的节奏。
theological_decisions:
- issue: 好土之人对道的回应性质
  choice: 译文仅表明他们听道、领受并结果实，是对所宣讲之道的真实积极回应。
  alternative: 将好土解释为必然坚持到底，或仅指最初的回应。
  rationale: 原文没有在本节中明确建立关于最终坚忍或背道的完整教义，因此不把任何宗派性结论加入译文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留撒种、好土和结果实的连贯农业意象；句式按汉语习惯调整，同时保留原文三组倍数的重复节奏。
