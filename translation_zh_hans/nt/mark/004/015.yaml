source:
  edition: SBLGNT
  text: οὗτοι δέ εἰσιν οἱ παρὰ τὴν ὁδὸν ὅπου σπείρεται ὁ λόγος, καὶ ὅταν ἀκούσωσιν ⸀εὐθὺς ἔρχεται ὁ Σατανᾶς καὶ αἴρει τὸν λόγον τὸν ἐσπαρμένον ⸂εἰς αὐτούς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/015.yaml
  text: 'And these are the ones along the road where the word is sown: when they hear[a], Satan immediately comes and takes away the word that was sown in them.'
translation:
  language: zh_hans
  text: 这些人就是路旁的地，道撒在那里；他们一听见，撒但立刻来，把撒在他们里面[a]的道拿走。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“撒进他们里面”。
    reason: εἰς αὐτούς可按方向性译为“进他们里面”；正文“在他们里面”则以自然汉语表达道与听者的内在关系。
lexical_decisions:
- source_word: οὗτοι δέ εἰσιν οἱ παρὰ τὴν ὁδόν
  choice: 路旁的那些人是这样
  rationale: οὗτοι与εἰσιν指明比喻所对应的人；παρὰ τὴν ὁδόν表示“在路旁”。将δέ作为轻微承接处理，不另加明显转折词，以符合现代汉语叙述。
- source_word: ὅπου σπείρεται ὁ λόγος
  choice: 道撒在那里
  rationale: 保留ὅπου的地点关系和σπείρεται的被动播撒意象；λόγος译作“道”，既指所传的信息，也维持本段反复出现的关键词。
- source_word: ὅταν ἀκούσωσιν
  choice: 他们一听见
  rationale: ὅταν加虚拟式表达一般性的时间情形；“一听见”自然简洁，并与下文的立即发生衔接。
- source_word: εὐθὺς ἔρχεται ὁ Σατανᾶς
  choice: 撒但立刻来
  rationale: εὐθύς保留马可叙事中特有的紧迫感；ὁ Σατανᾶς按具有行动主体性的专名译为“撒但”。
- source_word: αἴρει τὸν λόγον
  choice: 把……道夺去
  rationale: αἴρω在此意为拿走、除去；“夺去”符合敌对语境，又不增添原文没有明说的动作细节。
- source_word: τὸν ἐσπαρμένον εἰς αὐτούς
  choice: 撒在他们里面的
  rationale: 保留分词对“道”的修饰关系；εἰς αὐτούς可表达进入或处于他们里面，正文采用自然的“在他们里面”，并以脚注保留方向性译法。
theological_decisions:
- issue: 撒但在比喻解释中的行动主体性
  choice: 直译为具有行动主体性的“撒但”，他来夺去道
  alternative: 译作较抽象的“敌对者”或将其理解为非人格力量
  rationale: 希腊文使用带冠词的ὁ Σατανᾶς，并以“来”和“夺去”为其行动，最自然地指向一个有行动主体性的邪恶者；译文不将其抽象化。
- issue: 道与听者之间的内在关系
  choice: 撒在他们里面
  alternative: 撒进他们里面
  rationale: εἰς既可强调朝向、进入，也可在此语境中自然表达内在领域；正文选用通顺而不失原意的表达，脚注保留较强的方向性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“道”保持本段的关键词和播种比喻；分号帮助读者分辨场景说明与随后的动作。脚注标记紧接其所说明的“他们里面”。
