  text: καὶ ἐγένετο ἐν τῷ σπείρειν ὃ μὲν ἔπεσεν παρὰ τὴν ὁδόν, καὶ ἦλθεν τὰ πετεινὰ καὶ κατέφαγεν αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/004.yaml
  text: And as he was sowing[a], some seed fell along the path, and the birds came and devoured it.
translation:
  language: zh_hans
  text: 他撒种的时候，有些种子落在路旁[a]，飞鸟来把它吃光了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“路边”。希腊语短语指道路或小径的旁边。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ σπείρειν
  choice: 他撒种的时候
  rationale: 这是叙事中表示某事发生于另一动作进行期间的惯用结构；译为“他撒种的时候”自然地保留时间关系，而不生硬地直译“事情发生在……时”。“他”由上下文中的撒种者补出。
- source_word: ὃ μὲν
  choice: 有些种子
  rationale: 中性关系代词配合 μέν，在此以分配方式指所撒种子中的一部分；现代汉语需明说“种子”，因此译为“有些种子”。
- source_word: ἔπεσεν
  choice: 落在
  rationale: 按 πίπτω 在撒种场景中的通常意义直译，并与地点短语自然衔接。
- source_word: παρὰ τὴν ὁδόν
  choice: 路旁
  rationale: παρά 加宾格在此表示沿着或靠近道路、小径的位置；“路旁”简洁自然，也符合田间撒种的场景。
- source_word: τὰ πετεινὰ
  choice: 飞鸟
  rationale: 该词泛指鸟类；“飞鸟”是庄重而通俗的现代汉语表达，不添加原文没有的“天空的”等修饰语。
- source_word: κατέφαγεν
  choice: 吃光了
  rationale: κατεσθίω 比一般的“吃”语气更强，表示完全吃掉；“吃光了”既保留强化意味，也符合现代汉语叙事习惯。
- source_word: αὐτό
  choice: 它
  rationale: 单数代词把前面的那一部分种子视为一个整体；中文用“它”可保留这种集合性指称。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重且易懂的现代标准汉语。“撒种”保留比喻叙事的传统核心用语；“吃光了”比“吞吃了”更口语自然，同时准确传达原文复合动词的强化语气。脚注标记置于其实际说明的“路旁”之后。
