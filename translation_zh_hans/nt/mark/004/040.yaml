  yaml_path: translation/nt/mark/004/040.yaml
  text: And he said to them[c][b][a], “Why are you so fearful? Do you still have no faith?”
translation:
  language: zh_hans
  text: 他对他们说：“你们为什么这样胆怯？你们还没有信心吗？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: （承接上下文，不单独译出）
  rationale: καί承接前文叙事；现代汉语在此省略显式连词更自然，语义关系仍然清楚。
- source_word: εἶπεν αὐτοῖς
  choice: 他对他们说
  rationale: 准确表达叙事中的说话动作及复数受话者。
- source_word: Τί
  choice: 为什么
  rationale: τί与谓语形容词及系词连用，在此构成责问，汉语宜译为“为什么”。
- source_word: δειλοί
  choice: 胆怯
  rationale: δειλός不只是一般的害怕，也含退缩、怯懦的负面意味；“胆怯”既保留责备力度，也符合风暴场景。
- source_word: οὔπω
  choice: 还没有
  rationale: 直接保留“不曾达到某状态直到如今”的时间含义，也自然传达反问语气。
- source_word: ἔχετε πίστιν
  choice: 有信心
  rationale: ἔχω加πίστις在此表示具有信靠的心；“有信心”是自然、凝练且符合经文语境的现代汉语表达。
theological_decisions:
- issue: πίστις在危难语境中可表示“信心”或“信靠”
  choice: 信心
  alternative: 信靠
  rationale: 原文使用名词πίστις而未明说信靠的对象；“信心”保留其名词形式及一定开放性，同时在上下文中自然指向对耶稣的信靠，不额外补入原文未明说的对象。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“为什么这样胆怯”保留耶稣责问的力度；“还没有信心吗”贴近οὔπω的时间含义，并避免把反问解释得过满。
