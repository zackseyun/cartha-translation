  text: Καὶ λέγει αὐτοῖς ἐν ἐκείνῃ τῇ ἡμέρᾳ ὀψίας γενομένης· Διέλθωμεν εἰς τὸ πέραν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/035.yaml
  text: And he says to them on that day[a], when evening had come, “Let us go across to the other side.”
translation:
  language: zh_hans
  text: 那天到了晚上，他对他们说：“我们渡到对岸去吧。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们到另一边去吧。”
    reason: 保留διέρχομαι与τὸ πέραν可采用较一般性措辞表达的词汇译法；正文根据渡湖语境译作“渡到对岸”。
lexical_decisions:
- source_word: λέγει
  choice: 说
  rationale: 希腊文用叙事性现在时；现代汉语的“说”本身不标明完成体，既自然，也不必用“说了”把时态明确改成过去完成事件。
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: 那天
  rationale: 自然、简洁地表达这一时间短语，并保留它对前文同一天事件的指向。
- source_word: ὀψίας γενομένης
  choice: 傍晚
  rationale: 这是表示时间的属格独立结构；合并为“那天傍晚”符合现代汉语习惯，并保留“到了晚上”的时间意义。
- source_word: Διέλθωμεν
  choice: 我们渡到……去吧
  rationale: 第一人称复数不定过去时虚拟语气在此作劝勉用；“我们……去吧”准确传达共同采取行动的提议，“渡”也切合横越水面的语境。
- source_word: εἰς τὸ πέραν
  choice: 到对岸
  rationale: 在横渡湖面的叙事语境中，指水域另一边；“对岸”比直译“另一边”更自然明确。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语自然的叙事表达。“他”依原文保留代词，不在本节擅自补出姓名；“他们”同样不把所指对象具体化为“门徒”。脚注标记置于其所说明的引语之后。
