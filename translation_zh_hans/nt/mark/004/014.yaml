  text: The sower sows the word[a].
translation:
  language: zh_hans
  text: 撒种的人所撒的是道[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“信息”。希腊语λόγος可按语境指“话”或“信息”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ σπείρων
  choice: 撒种的人
  rationale: 带冠词的现在分词作名词用，指以撒种这一行动为特征的人。“撒种的人”自然、准确，并保留比喻意象；“农夫”会把原文未明说的职业身份带入译文。
- source_word: τὸν λόγον
  choice: 道
  rationale: λόγος在此可指“话”或“信息”。“道”在本段宣讲语境中简洁而庄重，也不擅自扩展为“神的道”或“福音”；脚注保留“信息”这一可能译法。
- source_word: σπείρει
  choice: 所撒的是
  rationale: 现在时直陈语气在比喻解释中表达一般性的对应关系。译作“所撒的是”在现代汉语中自然，并与“撒种的人”保留同一词根所形成的重复，同时清楚表达种子所代表的对象。
theological_decisions:
- issue: 比喻解释中“道”的所指
  choice: 正文仅译为“道”，不补出限定语
  alternative: 信息；神的道；福音
  rationale: 希腊文只写τὸν λόγον。上下文虽指向所宣讲的神圣信息，本节却没有明说“神的”或“福音”，因此不在正文中加以限定，以保留原文的概括性和解释空间。
translation_notes:
  register: 采用现代、庄重且通俗的普通话。“撒种的人所撒的是道”适合比喻讲解的语气，避免生硬的“撒种者”，也没有把人物具体化为“农夫”。
