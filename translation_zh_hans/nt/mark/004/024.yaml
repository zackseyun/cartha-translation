  text: καὶ ἔλεγεν αὐτοῖς· Βλέπετε τί ἀκούετε. ἐν ᾧ μέτρῳ μετρεῖτε μετρηθήσεται ὑμῖν καὶ προστεθήσεται ⸀ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/024.yaml
  text: And he was saying to them[a], “Pay attention to what you hear. With the measure you use, it will be measured to you[b], and more will be added to you.”
translation:
  language: zh_hans
  text: 他对他们说[a]：“要留心你们所听的。你们用什么量器量，也必照样量给你们，并且还要加给你们[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他对他们说”也可译作“他一直对他们说”；希腊文动词形式可表示持续或反复的言说。
    reason: aspectual_alternative
  - marker: b
    text: 有些人认为，“还要加给你们”是指接受耶稣教导的人会得到更多的领悟。
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλεγεν
  choice: 又对他们说
  rationale: 未完成时可表示持续或反复的言说；叙事性的“又对他们说”在现代汉语中自然，也承接上下文，但不强行断定动作持续多久。
- source_word: Βλέπετε
  choice: 要留心
  rationale: 此处不是字面上的“看”，而是劝人谨慎注意；“要留心”简洁、自然，并保留劝诫语气。
- source_word: τί ἀκούετε
  choice: 你们所听的
  rationale: τί 是“什么／所……的”，指所听的内容。译文保留马可的“听什么”，不与路加福音8:18的“怎样听”调和。
- source_word: ἐν ᾧ μέτρῳ μετρεῖτε
  choice: 你们用什么量器量
  rationale: 保留“量器／衡量”的比喻和工具性结构；“什么”在汉语中自然表达关系结构 ᾧ，同时不限定具体所量之物。
- source_word: μετρηθήσεται ὑμῖν
  choice: 也会照样量给你们
  rationale: 保留将来被动所表达的对应关系。“照样”传达同一量器这一含义，但不加入希腊文没有明说的施事者。
- source_word: προστεθήσεται ὑμῖν
  choice: 并且还要加给你们
  rationale: 按动词本义译为“加给”，保留被动形式及所加之物未明说的特点，避免在正文中直接解释为知识、恩赐或报偿。
theological_decisions:
- issue: 对等量回报之语的具体所指
  choice: 保留为与听取耶稣教导相关、但具体对象未明说的对应原则
  alternative: 明确解释为审判、慷慨施予，或属灵理解力的增长
  rationale: 紧邻语境强调“听”，但量器比喻和两个被动动词没有明说施事者及所量、所加之物；因此正文不把它收窄为某一教义应用。
- issue: “还要加给你们”的含义
  choice: 正文保留未指明所加内容的表达
  alternative: 译成“你们会得到更多理解”
  rationale: 语境容许理解为领受耶稣教导的人得到更多领悟，但希腊文本身只说“将被加给你们”，应保留其神学张力与开放性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“量器”保留原文的具体比喻；“照样量给你们”呈现对应关系；“加给”略带经文语体，但能自然保留原文没有说明所加内容的开放性。所有脚注标记均已置于正文相应位置。
