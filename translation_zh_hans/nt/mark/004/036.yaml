  text: καὶ ἀφέντες τὸν ὄχλον παραλαμβάνουσιν αὐτὸν ὡς ἦν ἐν τῷ πλοίῳ, καὶ ἄλλα ⸀πλοῖα ἦν μετ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/036.yaml
  text: And leaving the crowd[a], they take him with them just as he was, in the boat[b], and other boats were with him.
translation:
  language: zh_hans
  text: 他们离开众人，就照他当时的样子，带着他仍在船上；还有别的船与他同行。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “照他当时的样子，带着他仍在船上”也可理解为：耶稣已经在船上，他们就带着他前行；或他们没有另作准备，便带着他前行。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφέντες
  choice: 离开
  rationale: 不定过去时分词表示先于主句的伴随动作；此处译作“离开”自然，也不额外断定他们正式遣散了众人。
- source_word: τὸν ὄχλον
  choice: 众人
  rationale: ὄχλος指聚集的人群；“众人”符合叙事语境，简洁自然。
- source_word: παραλαμβάνουσιν αὐτόν
  choice: 把他带上了
  rationale: παραλαμβάνω在此有“带着同行、带上”的意思；结合水上行程译为“带上”，同时避免误解为此刻才把耶稣带进船里。
- source_word: ὡς ἦν ἐν τῷ πλοίῳ
  choice: 照耶稣当时在船上的样子
  rationale: 尽量保留希腊语的结构及其含混性：既明确耶稣已经在船上，也可暗示门徒没有另作准备便带他同行。
- source_word: ἄλλα πλοῖα
  choice: 另有几只船
  rationale: ἄλλα表示“别的、另外的”，πλοῖα为复数；汉语用量词“只”自然。“几”只表达不确定的复数，并未断定具体数量。
- source_word: ἦν μετ’ αὐτοῦ
  choice: 与他同行
  rationale: μετ’ αὐτοῦ字面为“与他同在”；在船只航行的叙事中，“与他同行”自然表达这些船伴随耶稣一行。
theological_decisions:
- issue: ὡς ἦν与ἐν τῷ πλοίῳ的关系
  choice: 正文译作“照耶稣当时在船上的样子”并加注说明
  alternative: “他既在船上，门徒就这样带他同行”或“门徒没有另作准备，就带他同行”
  rationale: 原文可着重于耶稣已经在船上的位置，也可着重于门徒照他当时的状态、未经额外准备便带他走。正文不独断其中一种理解。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“照耶稣当时在船上的样子”略带原文结构感，是为保留ὡς ἦν ἐν τῷ πλοίῳ的真实歧义；脚注说明两种可能侧重点。
