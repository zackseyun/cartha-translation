  text: Καὶ ἔλεγεν· Οὕτως ἐστὶν ἡ βασιλεία τοῦ θεοῦ ⸀ὡς ἄνθρωπος βάλῃ τὸν σπόρον ἐπὶ τῆς γῆς
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/026.yaml
  text: 'And he was saying[c][b][a], “The kingdom of God is like this: as when a man casts the seed upon the ground,”'
translation:
  language: zh_hans
  text: 他又说：“上帝的国是这样：就像一个人把种子撒在地上，[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“上帝的国好比一个人把种子撒在地上。”原文的比较结构较为紧缩，并延续到下一节。
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλεγεν
  choice: 又说
  rationale: 未完成时在叙事中可表示持续或反复的言说；现代汉语以“又说”自然衔接上下文，同时不生硬地仿造希腊语时体。
- source_word: Οὕτως
  choice: 是这样
  rationale: 引出比喻所说明的情形，既贴近原文“如此、这样”，也符合现代汉语表达。
- source_word: βασιλεία τοῦ θεοῦ
  choice: 上帝的国
  rationale: 保留“国”既可指上帝掌权，也可指其统治所呈现的领域；这是福音书比喻中清楚而为普通读者熟悉的表达。
- source_word: ὡς
  choice: 就像
  rationale: 引出随后延续至下一节的比较；“就像”保留比较关系，也与前面的“是这样”形成可理解的紧缩结构。
- source_word: ἄνθρωπος
  choice: 一个人
  rationale: 此处是比喻中的代表性人物；“一个人”准确传达单数而不把语法阳性过度解释为特意强调男性。
- source_word: βάλῃ
  choice: 撒
  rationale: βάλλω本义为投、抛，但在种子与土地的农业语境中表示撒种；“撒”既保留抛撒动作，也自然明确。
- source_word: τὸν σπόρον
  choice: 种子
  rationale: 希腊语有冠词，但此处可作类指；汉语不必机械加“这些”或“那种”，译作“种子”最自然。
- source_word: ἐπὶ τῆς γῆς
  choice: 在地上
  rationale: 农业语境中的γῆ指地面或土壤，并非宇宙意义的“大地”；“在地上”贴近介词结构及播撒画面。
theological_decisions:
- issue: 本节的比较结构在语法和意义上延续到下一节
  choice: 译作“是这样：就像……”，并以逗号保留未完待续的语势
  alternative: 译作“上帝的国好比一个人把种子撒在地上。”
  rationale: 原文Οὕτως…ὡς结构紧缩，完整情形要到下一节才展开。保留开放式比较，可避免把本节擅自整理成独立完结的定义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“又说”适合叙事衔接；“一个人”自然表达比喻中的代表人物；句末逗号有意提示话意在下一节继续。
