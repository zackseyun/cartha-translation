  text: ὅταν δὲ ⸀παραδοῖ ὁ καρπός, ⸀εὐθὺς ἀποστέλλει τὸ δρέπανον, ὅτι παρέστηκεν ὁ θερισμός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/029.yaml
  text: But when the crop is ready[a], he immediately sends in the sickle, because the harvest has come.
translation:
  language: zh_hans
  text: 但庄稼一成熟[a]，他就立刻下镰收割，因为收获的时候到了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“成熟了”或“可以收割”；更直译是“把自己交出来”。希腊文采用一种不寻常的主动表达，以“庄稼”为主语。
    reason: 保留παραδοῖ在此处“交出自己／达到可收割状态”的罕见主动表达，避免“结出果实”造成的语义偏移。
lexical_decisions:
- source_word: ὅταν δὲ
  choice: 但……一……
  rationale: ὅταν引出不定时间条件，δὲ在此表示轻微转折或承接；“但……一……”自然地表达情节推进。
- source_word: παραδοῖ
  choice: 成熟
  rationale: παραδίδωμι通常意为“交出、交付”，但此处以庄稼为主语，是罕见的主动表达，指庄稼达到可收割的状态。正文用“成熟”确保现代读者易懂，并以脚注保留原文不寻常的措辞及其他可能译法。
- source_word: ὁ καρπός
  choice: 庄稼
  rationale: καρπός可泛指果实或产物；本段紧接镰刀与收获意象，“庄稼”最符合田间语境，又不限定具体作物。
- source_word: εὐθὺς
  choice: 立刻
  rationale: 准确传达马可常用的迅速、即时之意。
- source_word: ἀποστέλλει τὸ δρέπανον
  choice: 下镰收割
  rationale: 原文直译为“差出镰刀”，是开始收割的农业表达。“下镰收割”在现代汉语中自然清楚，同时保留镰刀意象。
- source_word: ὅτι
  choice: 因为
  rationale: 此处引出立刻下镰的原因。
- source_word: παρέστηκεν ὁ θερισμός
  choice: 收获的时候到了
  rationale: παρέστηκεν为完成时，表示收获已经来到并且当前在场；“到了”自然体现这一结果状态。“收获的时候”也避免把抽象的“收获”拟人化得过于生硬。
theological_decisions:
- issue: 天国比喻中庄稼成熟与收获的象征意义
  choice: 只保留庄稼成熟并随即收割的农业图景，不在正文中指明其具体神学所指。
  alternative: 将收获明确解释为审判、宣教成果或末世终局。
  rationale: 原文在本节没有明说收获具体象征何事；译文应保留比喻本身的开放性与神学张力，不替读者预先裁定。
translation_notes:
  register: 采用现代、庄重而通俗的普通话。“庄稼一成熟”和“下镰收割”符合自然汉语农业表达；句式简洁，保留马可叙事的迅速感。
