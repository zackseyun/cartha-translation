  yaml_path: translation/nt/mark/004/002.yaml
  text: 'And he was teaching them many things in parables[a], and in his teaching he was saying to them:'
translation:
  language: zh_hans
  text: 他用比喻教导他们许多事[a]；在他的教导中，他对他们说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他用比喻教导他们许多。”希腊语πολλά可译为“许多事”，也可较概括地译为“许多”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδίδασκεν
  choice: 教导
  rationale: 希腊语未完成时描写当时持续展开的教导；现代汉语在此由上下文自然表达持续过程，无须另加“正在”。
- source_word: ἐν παραβολαῖς
  choice: 用比喻
  rationale: ἐν加与格在此表示方式或媒介；“用比喻”是自然、准确的现代汉语。
- source_word: πολλά
  choice: 许多事
  rationale: 中性复数可理解为所教导的许多内容；“许多事”保留其广度，也符合汉语表达。
- source_word: ἔλεγεν
  choice: 说
  rationale: 未完成时引出随后持续的讲话内容；汉语“对他们说”可自然承接下一节的直接引语。
- source_word: ἐν τῇ διδαχῇ αὐτοῦ
  choice: 在教导中
  rationale: 贴近原文结构，表明接下来的话属于他的教导，同时避免把名词结构完全改写为从句。
- source_word: καὶ
  choice: 就
  rationale: 承接上一节的叙事，在现代汉语中用“就”比句首“并且”更自然，也保留事件推进关系。
- source_word: αὐτοὺς / αὐτοῖς
  choice: 他们／对他们
  rationale: 分别体现ἐδίδασκεν的受教对象和ἔλεγεν的间接宾语，符合希腊语句法与汉语习惯。
theological_decisions: []
