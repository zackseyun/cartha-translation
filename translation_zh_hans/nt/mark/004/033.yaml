  text: Καὶ τοιαύταις παραβολαῖς πολλαῖς ἐλάλει αὐτοῖς τὸν λόγον, καθὼς ἠδύναντο ἀκούειν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/033.yaml
  text: And with many such parables he was speaking the word to them[b][a], as they were able to hear it.
translation:
  language: zh_hans
  text: 他用许多这样的比喻，按他们所能听的程度[a]，把这道[b]讲给他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“尽他们所能听的”或“照他们能听的程度”。
    reason: lexical_alternative
  - marker: b
    text: “这道”也可译为“这信息”或“这教导”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τοιαύταις
  choice: 这样的
  rationale: 回指前文所举的同类比喻；“这样的”自然地保留了指示和类比意味。
- source_word: παραβολαῖς
  choice: 比喻
  rationale: 这是耶稣此类教导形式的通行译法，也符合本段语境。
- source_word: πολλαῖς
  choice: 许多
  rationale: 直接表达数量多，并自然修饰“比喻”。
- source_word: ἐλάλει
  choice: 讲
  rationale: 未完成时态描写持续或反复进行的教导；汉语结合“许多”已能自然体现这一过程，无须生硬添加进行体标记。
- source_word: αὐτοῖς
  choice: 给他们听
  rationale: 表达说话的对象；与“讲”搭配，符合现代汉语习惯。
- source_word: τὸν λόγον
  choice: 这道
  rationale: “道”保留 λόγος 的经文用语及马可福音中的呼应；“这”使其在汉语中自然指向耶稣所宣讲的内容，同时脚注列出较解释性的可行译法。
- source_word: καθὼς
  choice: 按
  rationale: 在此引出程度上的对应关系，表示所讲的与听众能听的程度相称。
- source_word: ἠδύναντο
  choice: 所能
  rationale: 准确表达持续的能力或容量，并与“程度”自然搭配。
- source_word: ἀκούειν
  choice: 听
  rationale: 保留该词的基本义，不将其中可能包含的领会意味直接译成“明白”或“理解”。
theological_decisions:
- issue: τὸν λόγον 在耶稣教导事工中的含义
  choice: 正文译作“这道”
  alternative: “这信息”或“这教导”
  rationale: 此处指耶稣宣讲和教导的内容。“道”保留原文措辞和经文呼应，但不把它限定为某一更窄的教义概念；脚注提示其他合乎语境的译法。
- issue: ἀκούειν 是否明确包含理解
  choice: 译作“听”
  alternative: “理解”或“领受”
  rationale: 原文直接说的是听众听的能力；语境可能涉及领会，但正文不把这种含义强化为明确的“理解”，以保留原文的张力。
- issue: καθὼς ἠδύναντο ἀκούειν 所表达的程度关系
  choice: 译作“按他们所能听的程度”
  alternative: “把他们所能听的都讲给他们”
  rationale: καθὼς 可表示相应的程度。正文保留耶稣的讲授与听众听取能力之间的对应关系，而不进一步断定这是内容数量、理解深度或其他具体层面的限制。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“把这道讲给他们听”清楚表达宣讲对象，并保留“道／听”的原文联系；“按他们所能听的程度”虽略带书面色彩，却能准确保留程度关系及“听”与“理解”之间未被明说的张力。
