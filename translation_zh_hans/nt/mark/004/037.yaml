- from: 忽然起了猛烈的风暴[a]，波浪不断打进船里[b]，以致船已经开始灌满了水[c]。
  to: 一阵大风暴[a]起来了，波浪不断涌进船里[b]，以致船里已经进了水[c]。
  rationale: 修订删除无明确原文根据的“忽然”，以“大风暴”直接对应μεγάλη，并将末句改为“船里已经进了水”，自然表达船已开始进水而未断言已经完全灌满。脚注保留语态和进行过程的说明，且所有脚注标记均与正文锚点对应。
