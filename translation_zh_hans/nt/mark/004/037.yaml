  text: καὶ γίνεται λαῖλαψ ⸂μεγάλη ἀνέμου⸃, ⸂καὶ τὰ⸃ κύματα ἐπέβαλλεν εἰς τὸ πλοῖον, ὥστε ⸂ἤδη γεμίζεσθαι τὸ πλοῖον⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/037.yaml
  text: And a great windstorm arose[a], and the waves were breaking into the boat[c][b], so that the boat was already filling.
translation:
  language: zh_hans
  text: 一阵大风暴[a]起来了，波浪不断涌进船里[b]，以致船里已经进了水[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译作“一场大风暴起来了”。
    reason: lexical_alternative
  - marker: b
    text: 或译“波浪不断拍打着船，涌进船里”。希腊语未完成时描写反复或持续的动作。
    reason: lexical_alternative
  - marker: c
    text: 或译“以致船已经在被灌满”。原文动词形式可理解为被动或中间语态，着重描写当时正在发生的过程。
    reason: lexical_alternative
lexical_decisions:
- source_word: γίνεται
  choice: 忽然起了
  rationale: 这是马可叙事中生动的历史现在时，表示风暴发生、兴起；结合突发场景译作“忽然起了”，符合现代汉语叙事。
- source_word: λαῖλαψ μεγάλη ἀνέμου
  choice: 猛烈的风暴
  rationale: λαῖλαψ指骤起而猛烈的风暴，ἀνέμου表明由风引发；“猛烈的风暴”自然传达其强度和风暴性质。
- source_word: τὰ κύματα
  choice: 波浪
  rationale: κῦμα的常用现代汉语对应词；语境已明确所指，不必机械体现希腊语冠词。
- source_word: ἐπέβαλλεν εἰς τὸ πλοῖον
  choice: 不断打进船里
  rationale: 未完成时描写反复、持续的动作；“不断打进”同时保留波浪冲击船只并涌入其中的意思。
- source_word: τὸ πλοῖον
  choice: 船
  rationale: 加利利湖语境中的船只以现代汉语“船”表达最自然，不需使用偏古或暗示大型船舶的词。
- source_word: ὥστε
  choice: 以致
  rationale: 明确表达结果关系，简洁且符合现代书面汉语。
- source_word: ἤδη
  choice: 已经
  rationale: 直接表达进水过程已发展到显著阶段。
- source_word: γεμίζεσθαι τὸ πλοῖον
  choice: 船已经开始灌满了水
  rationale: 该现在时不定式表达正在发生的结果过程；“灌满了水”在汉语中自然交代船被水充满，同时“开始”避免误解为已经完全灌满。
theological_decisions: []
