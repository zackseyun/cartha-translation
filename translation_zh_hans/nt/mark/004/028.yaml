  text: ⸀αὐτομάτη ἡ γῆ καρποφορεῖ, πρῶτον χόρτον, ⸂εἶτα στάχυν, εἶτα⸃ ⸂πλήρης σῖτον⸃ ἐν τῷ στάχυϊ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/028.yaml
  text: 'The soil bears fruit by itself: first the stalk[a], then the head, then the full grain in the head.'
translation:
  language: zh_hans
  text: 土地自己出产作物：先是嫩苗[a]，随后是穗，最后是穗中饱满的籽粒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“幼芽”。
    reason: χόρτος在此指谷物最初长出的绿色部分；“嫩苗”自然，原词所指的具体形态未完全限定。
lexical_decisions:
- source_word: αὐτομάτη
  choice: 自己
  rationale: 该词修饰“土地”，表示作物生长并非靠农夫持续操控；“自己”自然简明，也避免“自动”所带的机械意味。
- source_word: ἡ γῆ
  choice: 土地
  rationale: 这里指耕种、出产作物的地土；“土地”符合农业语境，也比“地球”或泛指的“大地”更准确。
- source_word: καρποφορεῖ
  choice: 结出作物来
  rationale: 该动词可指结果或出产庄稼；结合随后谷物生长的描述，“结出作物来”既保留结果意象，又适合上下文。
- source_word: πρῶτον χόρτον
  choice: 先长苗
  rationale: χόρτος在谷物生长过程中指最初出现的绿色嫩苗或叶片；译作“长苗”符合现代汉语对作物初生阶段的表达。
- source_word: εἶτα στάχυν
  choice: 然后抽穗
  rationale: στάχυς指谷穗；汉语通常用“抽穗”描述谷物长出穗的阶段，比“然后是穗”更自然。
- source_word: εἶτα πλήρης σῖτον ἐν τῷ στάχυϊ
  choice: 再后穗中结出饱满的籽粒
  rationale: 保留连续生长的次序，并将πλήρης理解为籽粒充实饱满，而不额外加入“成熟”或特定作物如“小麦”的含义。
theological_decisions:
- issue: 土地“自己”出产的含义
  choice: 保留“自己”，仅表达生长不靠农夫持续、可见的操控
  alternative: 译作“自然会”或明确说“靠上帝使它生长”
  rationale: 原文强调土地自发出产，却没有在本句明说其终极成因；译文不应把这种表述解释成独立于上帝，也不应把未明说的神学说明加入正文。
translation_notes:
  register: 采用现代、简洁而庄重的农业用语。“先长苗—然后抽穗—再后结出籽粒”使生长次序清楚；正文中的脚注标记[a]与脚注对应。
