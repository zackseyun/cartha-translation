  text: καὶ ὅταν σπαρῇ, ἀναβαίνει καὶ γίνεται ⸂μεῖζον πάντων τῶν λαχάνων⸃ καὶ ποιεῖ κλάδους μεγάλους, ὥστε δύνασθαι ὑπὸ τὴν σκιὰν αὐτοῦ τὰ πετεινὰ τοῦ οὐρανοῦ κατασκηνοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/032.yaml
  text: and when it is sown[a], it comes up and becomes larger than all the garden plants, and it produces large branches[b], so that the birds of the sky are able to nest under its shade.
translation:
  language: zh_hans
  text: 种下时，它就长起来，变得比园中所有的菜蔬都大，又长出大的枝条，以致天空中的飞鸟[a]能够在它的荫下栖息[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“天上的飞鸟”，或按较传统的说法译作“空中的飞鸟”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“居住”或“停留”。这里的措辞可能呼应旧约中飞鸟在大树的枝头或荫下得到庇护的图景（例如结17:23；但4:12）。
    reason: cross_reference
lexical_decisions:
- source_word: σπαρῇ
  choice: 种下以后
  rationale: 不定时间从句在汉语中自然译作“种下以后”；保留播种的农业意象，也承接比喻中的种子。
- source_word: ἀναβαίνει
  choice: 长起来
  rationale: 在植物语境中指从土里向上生长；“长起来”符合现代汉语表达。
- source_word: γίνεται
  choice: 变得
  rationale: 表达植物生长后达到的新状态，不把动态过程弱化为静态的“是”。
- source_word: μεῖζον πάντων τῶν λαχάνων
  choice: 比园中所有的菜蔬都大
  rationale: 直接保留比较级结构。λάχανα指园圃中栽种的草本或菜蔬，并非树木；“菜蔬”比现代口语中较狭义的“蔬菜”更能涵盖此义。
- source_word: ποιεῖ κλάδους μεγάλους
  choice: 长出巨大的枝条
  rationale: ποιεῖ与枝条连用表示生出、长出；“长出”比直译“造出”自然，并保留枝条体量很大的描述。
- source_word: ὥστε δύνασθαι
  choice: 使……能够
  rationale: 保留ὥστε所表达的结果关系，同时用自然汉语呈现能力含义。
- source_word: ὑπὸ τὴν σκιὰν αὐτοῦ
  choice: 在它的荫下
  rationale: 此处σκιά指植物遮蔽形成的阴荫；“荫下”既简洁又符合飞鸟寻求遮蔽的场景。
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: 天空中的飞鸟
  rationale: 贴近“天空之飞鸟”的构造而符合现代汉语习惯，并保留可能与旧约经文相呼应的圣经意象。
- source_word: κατασκηνοῦν
  choice: 栖息
  rationale: 该词可指居住、安顿；用于飞鸟时，“栖息”自然贴合语境，同时不像“筑巢”那样过度限定具体行为。
theological_decisions:
- issue: 飞鸟在大枝条荫下安顿的旧约互文意象
  choice: 正文直接保留飞鸟在荫下栖息的图景，不明说其象征意义
  alternative: 采用更字面的“居住”，以凸显以西结书17:23、但以理书4:12等大树国度意象可能产生的回响
  rationale: 希腊文只呈现图景，并未在本节解释飞鸟或大树的象征对象。正文不加入解释，以保存可能的互文联系和神学张力；相关背景仅在注释中提示。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“菜蔬”准确涵盖园圃植物且略具经文语体；“荫下”“栖息”自然呈现遮蔽和安顿的画面。注释标记放在各自所说明的短语之后。
