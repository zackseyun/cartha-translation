  text: ὃς γὰρ ⸀ἔχει, δοθήσεται αὐτῷ· καὶ ὃς οὐκ ἔχει, καὶ ⸀ὃ ἔχει ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/025.yaml
  text: For whoever has[a], more will be given to him; and whoever does not have, even what he has will be taken away from him.
translation:
  language: zh_hans
  text: 因为凡有的，还要给他更多[a]；凡没有的，连他所有的也要从他那里夺去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊原文直译为“要给他”，没有明说“更多”；“更多”是按本句前后对比所暗示的意思补出的。
    reason: 说明为符合自然汉语而补出的隐含宾语，并保留原文省略所产生的简练表达。
lexical_decisions:
- source_word: ὃς
  choice: 凡……的
  rationale: 这是带普遍、概括意味的不定关系表达；“凡……的”自然传达格言对任何人的普遍适用性。
- source_word: γὰρ
  choice: 因为
  rationale: 承接并说明上一节所说之话的理由，保留原文的解释性连接。
- source_word: ἔχει
  choice: 有
  rationale: 原词是一般性的“拥有”；这里不明说所拥有的是什么，保留上下文中的开放指向。
- source_word: δοθήσεται αὐτῷ
  choice: 还要给他更多
  rationale: 原文直译为“要给他”，没有明说宾语；汉语为清楚表达前后对照所暗示的增加，用“更多”补出隐含意义，并以脚注说明。
- source_word: οὐκ ἔχει
  choice: 没有
  rationale: 简洁自然地表达否定的拥有状态，并与前半句“有”形成鲜明对照。
- source_word: καὶ ὃ ἔχει
  choice: 连他所有的也
  rationale: 第二个 καὶ 在这里有递进强调作用，“连……也”准确表现“甚至他所有的”这一语气。
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: 要从他那里夺去
  rationale: 未来被动式配合 ἀπό 表示某物被拿走、使其失去；“夺去”简洁有力，并保留“从他那里”的来源表达。
theological_decisions:
- issue: δοθήσεται 的宾语在原文中省略
  choice: 正文译作“还要给他更多”，并加脚注说明“更多”是按对比关系补出的。
  alternative: 只译作“要给他”，不补明宾语。
  rationale: 原文有意采用简练的格言式表达，但前后两部分的对照清楚暗示所得将增加。现代汉语若完全不补宾语会显得突兀；补出“更多”能自然表达语义，同时脚注避免让读者误以为原文明确含有该词。
- issue: “有”与“没有”具体所指
  choice: 不在正文中限定为信心、悟性、知识或其他特定对象。
  alternative: 将其明确解释为“有领受能力”“有真理”或“有信心”。
  rationale: 本句及其上下文容许这些概念上的联系，却没有在句中明说宾语；保留“有／没有”的开放性，可避免把一种解释写进经文本身。
- issue: 概括性阳性单数
  choice: 用“凡……的……他”表达普遍适用的个体。
  alternative: 改用复数“凡有的人……他们”。
  rationale: 原文以阳性单数作概括性指称；汉语的“凡……的”兼具普遍性，而“他”保留单数对应，不表示此原则只适用于男性。
translation_notes:
  register: 采用现代、庄重而易懂的格言式汉语。“凡有的／凡没有的”保留原文的简洁对称；“连……也”表现递进强调。未把“有”的对象解释为某一特定神学概念。
