  text: Καὶ ἔλεγεν· ⸀Πῶς ὁμοιώσωμεν τὴν βασιλείαν τοῦ θεοῦ, ἢ ἐν ⸀τίνι ⸂αὐτὴν παραβολῇ θῶμεν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/030.yaml
  text: And he was saying[a], “How should we compare the kingdom of God, or in what parable should we set it forth?”
translation:
  language: zh_hans
  text: 他又说：“我们该怎样比拟上帝的国呢？或者该用什么比喻来表明它呢？[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “用什么比喻来表明它”也可译作“在什么比喻中把它呈现出来”。原文介词既可表示所采用的方式，也可表示表达内容所在的框架。
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἔλεγεν
  choice: 他又说
  rationale: καί承接前文，译作“又”；未完成时ἔλεγεν在叙事中引出持续讲论中的下一句话，现代汉语用“说”最自然，不强行加入“一直”等可能过度凸显体貌的措辞。
- source_word: Πῶς ὁμοιώσωμεν
  choice: 我们该怎样比拟
  rationale: Πῶς表示方式；ὁμοιώσωμεν是商议性虚拟语气，用“该怎样”表达自问式商议语气。“比拟”既保留比较、比作的含义，也适合随后谈论比喻的语境。
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: 上帝的国
  rationale: 保留βασιλεία的“国”这一既定意象，同时在中文中自然表达属格关系；不缩窄为单指统治行为。
- source_word: ἢ
  choice: 又
  rationale: 这里第二问是对第一问的换一种说法，而非互相排斥的选择；汉语用“又”连接两个并列的商议性问题更自然，并保留递进重述的作用。
- source_word: ἐν τίνι παραβολῇ
  choice: 用什么比喻
  rationale: ἐν加与格在此可作工具性理解，即借着什么比喻；“用什么比喻”是现代汉语中最直接自然的表达。
- source_word: αὐτὴν ... θῶμεν
  choice: 来表明它
  rationale: τίθημι本义为“放置”，但与παραβολή连用时指借比喻将所谈对象呈现、表达出来；“表明”避免生硬直译，同时以“它”明确回指上帝的国。
theological_decisions:
- issue: βασιλεία既可侧重领域，也可侧重王权或统治
  choice: 上帝的国
  alternative: 上帝的统治
  rationale: 本节以比喻描绘其性质，原词的意象和语义范围不宜缩窄；“上帝的国”保留领域与王权之间的张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。两个“该”保留原文商议性虚拟语气的修辞效果；“比拟”与“比喻”形成自然呼应。
