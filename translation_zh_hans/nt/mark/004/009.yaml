  yaml_path: translation/nt/mark/004/009.yaml
  text: And he was saying[a], “Whoever has ears to hear, let him hear.”
translation:
  language: zh_hans
  text: 他说[a]：“有耳可听的，就应当听！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文动词为未完成时，也可译为“他不断地说”；但这里不一定强调反复。
    reason: 说明希腊语未完成时的体貌含义及其翻译可能。
lexical_decisions:
- source_word: καὶ
  choice: 又
  rationale: 承接前文，并自然引出耶稣接着所说的话；“又”不强加明确的时间先后。
- source_word: ἔλεγεν
  choice: 说
  rationale: 未完成时在叙事中可用于引出言语；中文用“说”最自然，其持续或反复的意味不宜在正文中过度强调。
- source_word: Ὃς ἔχει
  choice: 有……的
  rationale: 保留泛指关系结构，不限定性别，也符合现代汉语格言式表达。
- source_word: ὦτα
  choice: 耳
  rationale: 直译复数名词的整体概念；汉语格言中用“耳”比“耳朵”更凝练庄重。
- source_word: ἀκούειν
  choice: 可听
  rationale: 与“耳”构成自然的汉语结构，并与后面的“听”保持词语重复。
- source_word: ἀκουέτω
  choice: 就应当听
  rationale: 表达第三人称现在时命令的劝令力量，同时保留ἀκούειν与ἀκουέτω之间的修辞重复。
theological_decisions:
- issue: 格言中的阳性单数泛指结构
  choice: 译为“有耳可听的，就应当听”
  alternative: 译为“凡有耳可听的人，都应当听”
  rationale: 希腊语阳性单数在此具有泛指作用，并非特指男性。正文以汉语无性别的“……的”保留其普遍指向，也尽量维持单数格言式结构。
- issue: “听”的含义是否明确解释为顺服
  choice: 保留“听”
  alternative: 译为“听从”或“领会”
  rationale: 原文ἀκούω既可指听见，也可在语境中含有认真领受的意味。直译为“听”可保留这层开放性，避免把隐含意义直接写进正文。
translation_notes:
  register: 采用现代、凝练而庄重的格言式汉语。“有耳可听的，就应当听”保留原文中“听”的重复和命令语气；不用“耳朵”以维持经文警句的简洁力度。
