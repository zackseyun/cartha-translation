  source_fidelity: 正文准确保留了诫命引文的命令性，以及心、ψυχή、心思和力量四项的完整次序。原稿的“尽性”虽有汉语圣经传统，却在现代普通话中通常指性情、性质，不能清楚承载ψυχή的“生命／全人”范围；改为“全性命”能较少歧义地保留该项。
  naturalness: “尽心、尽性、尽意、尽力”节奏凝练，但“尽性”及“主你的上帝”的无标记连用对现代读者不够清晰。修订以“全性命”“全心思”提高可懂度，并以破折号标出“主——你的上帝”的同位关系，仍保持庄重简洁。
  terminology: “主”和“上帝”分别对应κύριος和θεός，未将原文的κύριος直接替换为专名。“性命”对应ψυχή的生命／全人语义范围；“心思”对应διάνοια；“全力”对应ἰσχύς。脚注不把“大能”列作常规替代，以免引入偏向神圣权能的含义。
