  text: καὶ ἀγαπήσεις κύριον τὸν θεόν σου ἐξ ὅλης ⸀τῆς καρδίας σου καὶ ἐξ ὅλης τῆς ψυχῆς σου καὶ ἐξ ὅλης τῆς διανοίας σου καὶ ἐξ ὅλης τῆς ἰσχύος ⸀σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/030.yaml
  text: And you shall love the Lord your God with all your heart and with all your soul and with all your mind and with all your strength[a][b][c].
translation:
  language: zh_hans
  text: 你要以全心、全性命[a]、全心思[b]和全力[c]爱主——你的上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “性命”也可译作“生命”或“全人”；原文ψυχή可指生命或整个人。
    reason: lexical_alternative
  - marker: b
    text: “心思”也可译作“悟性”或“理解力”。
    reason: lexical_alternative
  - marker: c
    text: “全力”也可译作“尽一切力量”或“尽力”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπήσεις
  choice: 你要……爱
  rationale: 这里的将来时直陈语气出现在诫命引文中，具有命令效力；用“要”既自然，又保留郑重的诫命语气。
- source_word: κύριον τὸν θεόν σου
  choice: 主你的上帝
  rationale: κύριος译为“主”，θεός译为“上帝”；整体保留“主你的上帝”这一盟约性称谓，并反映两个名词之间的同位关系。
- source_word: ἐξ ὅλης
  choice: 尽
  rationale: 该短语直译为“从全部”，在这里表示以整个人的每一方面去爱；“尽”简洁自然，并可重复呈现原文强调完全投入的结构。
- source_word: καρδίας
  choice: 心
  rationale: “心”准确保留其作为意志、情感和内在生命中心的常用意象，不作解释性扩展。
- source_word: ψυχῆς
  choice: 性
  rationale: 在“尽心、尽性”的汉语经文表达中，“性”指人的生命或全人，可与“心、意、力”保持区别；因现代读者可能将其误解为性情或性质，脚注列出“生命”这一词义选择。
- source_word: διανοίας
  choice: 意
  rationale: διάνοια指思想、理解的官能；“意”在四重并列中简洁庄重，表达心思意念，同时脚注提供更直白的“心思”。
- source_word: ἰσχύος
  choice: 力
  rationale: ἰσχύς表示力量、能力；“力”在“尽力”中是自然、清楚且有力的现代汉语表达。
- source_word: καὶ ... καὶ ... καὶ ... καὶ
  choice: 四个“尽……”并列项
  rationale: 汉语以反复的“尽”来再现原文各项累加和反复强调的效果；若逐项重复“和”，则会显得生硬。
theological_decisions:
- issue: 诫命引文中κύριος的译法
  choice: 主
  alternative: 耶和华；主人
  rationale: 希腊文本使用κύριος。“主”既符合新约通常用法，也保留其所呼应的以色列盟约称谓，而不把希腊文本未明说的专名直接放入正文。
- issue: 四个人论性词语的区分
  choice: 心／性／意／力
  alternative: 心／生命／心思／力量
  rationale: 保留四个彼此有别而又共同表达全然委身的词，不将其化约为笼统的“全人”；脚注提示其中真实存在的词义范围，而不武断界定各部分的人论边界。
translation_notes:
  register: 正文采用现代读者熟悉而庄重的“尽心、尽性、尽意、尽力”排比，保持诫命的节奏和四重结构。用“要”表达希腊文将来时在律法引文中的命令效力；疑义较大的词义以脚注说明。
