  - severity: low
    issue: “主你的上帝”同位关系未明确标示
    rationale: 此连用可读，但现代汉语中以破折号标出“主”与“你的上帝”的同位关系更自然清楚，且不改变原文的称谓结构。
  - severity: low
    issue: “大能”不宜作为ἰσχύος的常规词汇替代
    rationale: “大能”在现代汉语宗教语境常指神的能力；本句指人的力量、能力或尽力的投入，脚注宜限于“力量”“能力”等中性表达。
