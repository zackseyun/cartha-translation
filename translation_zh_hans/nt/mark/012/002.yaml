  text: καὶ ἀπέστειλεν πρὸς τοὺς γεωργοὺς τῷ καιρῷ δοῦλον, ἵνα παρὰ τῶν γεωργῶν λάβῃ ἀπὸ ⸂τῶν καρπῶν⸃ τοῦ ἀμπελῶνος·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/002.yaml
  text: And at the proper time he sent a slave to the vine-growers[b][a], so that he might receive from the vine-growers some of the fruit of the vineyard.
translation:
  language: zh_hans
  text: 到了适当的时候，他派一个奴仆[a]到那些葡萄种植者[b]那里，要从他们那里收取葡萄园的一部分出产。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “奴仆”也可译作“奴隶”或“仆人”。原文δοῦλος通常指受主人支配、非自由身份的人；“仆人”较为宽泛。
    reason: alternative_reading
  - marker: b
    text: “葡萄种植者”也可译作“农夫”或“佃户”。原词指耕作土地的人；这里因场景是葡萄园而作具体翻译。“佃户”符合比喻中的社会关系，但不是该词本身直接表达的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: 派……到……那里
  rationale: 表达差遣某人前往某处的动作，符合现代汉语叙事习惯。
- source_word: γεωργούς / γεωργῶν
  choice: 种葡萄的人
  rationale: γεωργός泛指耕作土地的人；在葡萄园语境中用“种葡萄的人”既自然，又保留具体农业背景，不直接加入“佃户”这一社会身份推断。
- source_word: τῷ καιρῷ
  choice: 到了适当的时候
  rationale: καιρός指合宜或既定的时机；此处可能是收获期，但原文没有明说，故不译作“收获的时候”。
- source_word: δοῦλον
  choice: 奴仆
  rationale: δοῦλος表示受主人支配、属于主人权下的人；“奴仆”保留其非自由身份，同时较适合庄重的现代叙事语体。脚注列出更直截的“奴隶”和较弱的“仆人”。
- source_word: ἵνα ... λάβῃ
  choice: 要……收取
  rationale: 以自然汉语目的结构表达ἵνα从句；“收取”符合主人派代表领取园中出产的语境。
- source_word: παρὰ τῶν γεωργῶν
  choice: 从他们那里
  rationale: παρά加属格表示来源；代词避免在同一句中生硬重复“种葡萄的人”。
- source_word: ἀπὸ τῶν καρπῶν τοῦ ἀμπελῶνος
  choice: 葡萄园的一些果实
  rationale: ἀπό加属格在此有从整体中取一部分的含义；“一些”明确其部分性，而不增添原文未直说的“他应得的份额”。
- source_word: ἀμπελῶνος
  choice: 葡萄园
  rationale: ἀμπελών的标准、清楚译法。
