  text: And a poor widow came and put in two lepta[c][b][a], which is a quadrans.
translation:
  language: zh_hans
  text: 有一个贫穷的寡妇来了，投进两个小铜钱[a]，合一个夸德兰[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“两个雷普顿”。雷普顿是面值很小的钱币；两个雷普顿等于一个罗马夸德兰。
    reason: cultural_note
  - marker: b
    text: “夸德兰”是希腊原文所用的罗马钱币名称。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθοῦσα
  choice: 来
  rationale: 不拘泥于希腊语的不定过去时分词形式，而按现代汉语叙事习惯与主句动作顺接，表达“来……投进”。
- source_word: μία
  choice: 一个
  rationale: 此处用于引入一位人物，并非强调数目上的“一个”；现代汉语用“一个穷寡妇”自然清楚。
- source_word: χήρα πτωχὴ
  choice: 穷寡妇
  rationale: 准确保留“寡妇”和“贫穷”两项信息；“穷”通俗自然，而“赤贫”会把程度说得过满。
- source_word: ἔβαλεν
  choice: 投进了
  rationale: 符合向奉献箱中放入钱币的语境，也保留βάλλω在此处的动作感；不像“扔进”那样容易暗示用力或随意。
- source_word: λεπτὰ δύο
  choice: 两个小铜钱
  rationale: λεπτόν指面值极小的钱币。正文采用普通读者一看即懂的描述性译法，具体币名及币值关系由脚注补充。
- source_word: ὅ ἐστιν
  choice: 合
  rationale: 这里说明两枚λεπτά折合一枚κοδράντης的价值；“合”比逐字译作“就是”更准确自然。
- source_word: κοδράντης
  choice: 一个夸德兰
  rationale: 音译该罗马钱币名称，保留历史文化信息，避免用现代币值或其他时代的钱币作误导性替换。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“小铜钱”提高正文可读性，“夸德兰”则保留原文明确给出的罗马币名；所有文化背景说明置于脚注。
