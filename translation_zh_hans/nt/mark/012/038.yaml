  text: Καὶ ⸂ἐν τῇ διδαχῇ αὐτοῦ ἔλεγεν⸃· Βλέπετε ἀπὸ τῶν γραμματέων τῶν θελόντων ἐν στολαῖς περιπατεῖν καὶ ἀσπασμοὺς ἐν ταῖς ἀγοραῖς
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/038.yaml
  text: And in his teaching he was saying[b][a], “Beware of the scribes who want to walk around in long robes and receive greetings in the marketplaces,”
translation:
  language: zh_hans
  text: 耶稣在教导时说：“你们要提防[a]那些喜欢穿着长袍[b]走来走去、喜欢在市集上受人问候的经学家。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “提防”也可译作“当心”或“要防备”。
    reason: lexical_alternative
  - marker: b
    text: “长袍”指显眼的外衣，与身份地位和公开尊荣有关。
    reason: cultural_note
lexical_decisions:
- source_word: ἐν τῇ διδαχῇ αὐτοῦ ἔλεγεν
  choice: 耶稣在教导时说
  rationale: 用自然的现代汉语表达说话发生在教导过程中；“在……时”也在一定程度上保留未完成时所呈现的持续背景。为避免汉语代词指向不明，明确主语为耶稣。
- source_word: Βλέπετε ἀπὸ
  choice: 你们要提防
  rationale: 该祈使结构表示警戒、防备。“提防”简洁自然，并保留严肃的警告语气。
- source_word: γραμματέων
  choice: 经学家
  rationale: 指熟悉并讲授犹太经书和律法的人。“经学家”比传统用语“文士”更便于现代普通读者理解，同时避免将其职能过度窄化为单纯的律法教师。
- source_word: τῶν θελόντων
  choice: 那些喜欢……、喜欢……的
  rationale: 分词描述这类人的惯常意愿和偏好；在本语境中，“喜欢”比“想要”更自然地表达其一贯追求，又不消除意愿色彩。
- source_word: ἐν στολαῖς περιπατεῖν
  choice: 穿着长袍走来走去
  rationale: στολή指长袍或显眼的正式外衣；“走来走去”保留περιπατεῖν在此所含的公开活动意味。
- source_word: ἀσπασμοὺς ἐν ταῖς ἀγοραῖς
  choice: 在市集上受人问候
  rationale: 直译公开市场或聚集场所中的问候；“受人问候”在汉语中自然呈现他们以获得公开礼遇为乐的语境。
theological_decisions:
- issue: 耶稣警告的对象范围
  choice: 将限定性描述直接置于“经学家”之前，指向那些以公开身份和尊荣为追求的经学家
  alternative: 把这句话理解为对所有经学家的整体谴责
  rationale: 希腊文以τῶν θελόντων及后续成分描述所说的经学家。译文保留“经学家”这一群体称谓，同时让限定性描述承担界定作用，不把警告扩展为对每一位经学家的无差别定罪。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式按汉语习惯重组为“那些……的经学家”，清楚保留限定关系；“市集”兼顾古代公共市场和社交场所的背景。
