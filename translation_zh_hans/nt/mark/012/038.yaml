  source_fidelity: 译文准确传达了希腊文的警告命令（Βλέπετε ἀπό）、受警告的对象（γραμματεῖς）及其后限定的特征：他们追求穿长袍公开走动，并在市集获得问候。将上下文中的αὐτοῦ明确为“耶稣”是清楚且合乎经文语境的处理。“在教导时说”自然表达ἐν τῇ διδαχῇ αὐτοῦ；虽未逐字复制未完成时的持续感，但中文过去叙事中不必强行标出，未造成意义损失。
