base_translation:
  language: en
  yaml_path: translation/nt/mark/012/020.yaml
  text: There were seven brothers; and the first took a wife[a], and when he died he left no offspring.
translation:
  language: zh_hans
  text: 有兄弟七人。第一个娶了妻子，死时没有留下后代[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“种子”；希腊文在这里以“种子”指子嗣或后代。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑπτὰ ἀδελφοὶ ἦσαν
  choice: 有兄弟七人
  rationale: 自然表达存在句，并保留这里特指七名男性手足的含义。
- source_word: ὁ πρῶτος
  choice: 第一个
  rationale: 表示七兄弟中的先后次序；不译作“老大”，以免加入原文未明确表达的年龄含义。
- source_word: ἔλαβεν γυναῖκα
  choice: 娶了妻
  rationale: 按希腊语婚姻习语译为自然、简明的现代汉语。
- source_word: ἀποθνῄσκων
  choice: 死时
  rationale: 用时间结构自然表达分词与主句的关系。
- source_word: οὐκ ἀφῆκεν
  choice: 没有留下
  rationale: 在死亡语境中，ἀφίημι指死后未留下某人或某物。
- source_word: σπέρμα
  choice: 后代
  rationale: 该词本义为“种子”，在此家庭与婚姻语境中惯指子嗣或后代；“后代”清楚且不限定为一个孩子。
theological_decisions: []
