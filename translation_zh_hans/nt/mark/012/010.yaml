  text: οὐδὲ τὴν γραφὴν ταύτην ἀνέγνωτε· Λίθον ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες, οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/010.yaml
  text: 'Have you not even read this Scripture: ‘The stone that the builders rejected[a], this has become the cornerstone’?”'
translation:
  language: zh_hans
  text: '“你们连这段经文也没有读过吗？


    ‘匠人弃绝的石头，

    成了房角的首石[a]。’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“房角石”。直译：“房角之首”；传统译法为“房角的头块石头”。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ
  choice: 连……也没有
  rationale: 保留οὐδέ在反问中的加强语气，比单纯译作“没有”更能传达责问意味。
- source_word: τὴν γραφὴν ταύτην
  choice: 这段经文
  rationale: γραφή在此指神圣经典中的一处文字；“这段经文”自然地表达耶稣正在引用一段具体经文。
- source_word: ἀνέγνωτε
  choice: 读过
  rationale: 不定过去时在这一反问中是对听者既往阅读经验的追问；现代汉语用“读过”最自然。
- source_word: Λίθον
  choice: 石头
  rationale: 保留诗篇引文中的建筑隐喻，不在译文中直接解释其所指。
- source_word: ἀπεδοκίμασαν
  choice: 弃绝
  rationale: 该词含经评判后拒绝之意；“弃绝”简洁、有力度，也符合庄重的经文语体。
- source_word: οἱ οἰκοδομοῦντες
  choice: 匠人
  rationale: 此处为名词性分词，指从事建造的人；“匠人”在汉语建筑比喻中简洁自然。
- source_word: οὗτος ἐγενήθη
  choice: 竟成了
  rationale: “成了”表达状态转变；“竟”体现原先被弃绝与后来居首要地位之间出人意料的反转，并对应οὗτος的强调效果。
- source_word: εἰς κεφαλὴν γωνίας
  choice: 房角的头块石头
  rationale: 较直接地保留“角”与“头”的词汇构造，并避免武断限定为现代建筑意义上的某一种角石；脚注列出更通行的译法。
theological_decisions:
- issue: 诗篇118:22的弥赛亚性运用
  choice: 在正文中保留石头、匠人及房角头块石头的比喻，不直接点明石头就是弥赛亚。
  alternative: 在译文中明确补出“弥赛亚”或“耶稣”
  rationale: 上下文使该比喻指向耶稣，但原句仍以经文意象表达；保留比喻可避免把解释写入翻译。
- issue: κεφαλὴ γωνίας所指的建筑部位
  choice: 采用较为字面的“房角的头块石头”，保留其可能指首要角石或顶部收束石的开放性。
  alternative: 径直译为“房角石”或“奠基石”
  rationale: 原短语的确切建筑指向存在讨论；正文保留源语形象，脚注提供传统和通行译法，不静默消除歧义。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“你们连这段经文也没有读过吗”自然传达责问；诗体引文分行呈现。用“匠人”而非较口语的“盖房子的人”，并以“房角的头块石头”保留原文意象和建筑部位上的歧义。
