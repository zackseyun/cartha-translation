  text: ὁ δὲ εἰδὼς αὐτῶν τὴν ὑπόκρισιν εἶπεν αὐτοῖς· Τί με πειράζετε; φέρετέ μοι δηνάριον ἵνα ἴδω.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/015.yaml
  text: But knowing their hypocrisy[a], he said to them[b], “Why are you testing me? Bring me a denarius so that I may see it.”
translation:
  language: zh_hans
  text: 耶稣知道他们的虚伪，就对他们说：“为什么试探我？拿一个第纳尔[a]来，让我看看。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 第纳尔是罗马银币，当时通常相当于普通工人一天的工资。
    reason: cultural_note
lexical_decisions:
- source_word: εἰδὼς
  choice: 知道
  rationale: 表达耶稣已洞悉他们内在动机的认知含义，中文自然简洁。
- source_word: ὑπόκρισιν
  choice: 虚伪
  rationale: 这里指他们以貌似真诚的言辞掩饰设陷阱的意图；“虚伪”比音译式或宗教化表达更符合现代汉语。
- source_word: Τί με πειράζετε
  choice: 为什么试探我
  rationale: Τί在此表示缘由；πειράζετε在敌意语境中是设法考验、试探。“试探”保留其可能涵盖考验与诱陷的语义张力。
- source_word: φέρετέ μοι
  choice: 拿……来给我
  rationale: 自然表达命令对方把该物带到耶稣面前。
- source_word: δηνάριον
  choice: 第纳尔
  rationale: 保留罗马钱币的历史专名，并用脚注说明其性质与大致价值。
- source_word: ἵνα ἴδω
  choice: 给我看看
  rationale: 以自然现代汉语表达目的从句；所看的对象由“第纳尔”清楚限定。
theological_decisions:
- issue: πειράζετε所表达的指控性质
  choice: 试探我
  alternative: 考验我／诱惑我
  rationale: 上下文表明这是带敌意的设套，而非中性的询问；“试探”既能表达恶意测试，也不把含义缩窄为引诱犯罪。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“虚伪”准确体现ὑπόκρισις；“第纳尔”保留历史特指。主文中的[a]紧接相关钱币名称所在短语之后。
