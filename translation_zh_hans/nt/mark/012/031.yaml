  text: ⸀δευτέρα αὕτη· Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν. μείζων τούτων ἄλλη ἐντολὴ οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/031.yaml
  text: 'The second is this: ‘You shall love your neighbor as yourself.’ There is no other commandment greater than these[a].'
translation:
  language: zh_hans
  text: 第二条是：“你要爱邻人，如同爱自己。”再没有别的诫命比这些更大了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这些”在原文中是复数，按上下文指前述爱上帝与爱邻人的两条诫命。
    reason: 说明复数指示词的语境所指，避免读者误以为只指本节刚引述的第二条诫命。
lexical_decisions:
- source_word: δευτέρα αὕτη
  choice: 第二条是
  rationale: 希腊文为省略表达，所省略的是“诫命”；译文补出判断结构，既自然，也保留“第二条”在句首的强调。
- source_word: Ἀγαπήσεις
  choice: 你要爱
  rationale: 将来时直陈语气在经文诫命的引文中具有命令作用；“你要爱”在现代汉语中兼顾命令力度与经文语体。
- source_word: τὸν πλησίον σου
  choice: 邻人
  rationale: “邻人”准确承接利未记19:18的互文，也保留该词在伦理语境中可超越地理上邻居的含义；汉语中不必机械译出属格“你的”。
- source_word: ὡς σεαυτόν
  choice: 如同爱自己
  rationale: 希腊文直译为“如同自己”，汉语补出比较中省略的“爱”，使句意清楚自然而不改变内容。
- source_word: μείζων τούτων ἄλλη ἐντολὴ οὐκ ἔστιν
  choice: 再没有别的诫命比这些更大了
  rationale: 保留比较级“更大”、复数指示词“这些”以及“没有别的”这一排他结构；“再没有”符合现代汉语表达。
- source_word: ἐντολή
  choice: 诫命
  rationale: “诫命”保留了讨论律法命令时的圣经与盟约语域，比一般性的“命令”更贴切。
theological_decisions:
- issue: 末句 τούτων（“这些”）的所指
  choice: 正文保留复数“这些”，按上下文理解为前述两条诫命
  alternative: 仅泛指紧接在前的第二条诫命
  rationale: 希腊文指示代词明确为复数，最自然地回指上下文中的两条诫命；正文不改成单数，脚注说明其语境所指，以保留原文形式和两条诫命并列的张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“你要爱”保留诫命语气；“邻人”维持与旧约引文的联系；末句保留原文复数“这些”，并以脚注澄清。
