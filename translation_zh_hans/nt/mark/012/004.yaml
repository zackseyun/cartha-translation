  yaml_path: translation/nt/mark/012/004.yaml
  text: And again he sent another servant to them[c][b][a], and they struck him on the head and dishonored him.
translation:
  language: zh_hans
  text: 他又差遣另一个仆人[a]到他们那里去；他们打他的头[b]，又羞辱他[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“另一个奴隶”。希腊语 doulos 可按语境指“仆人”或“奴隶”。
    reason: alternative_reading
  - marker: b
    text: 这里使用的动词很少见，指暴力施于头部；也可译作“打伤他的头”，并不是“斩他的头”。
    reason: lexical_alternative
  - marker: c
    text: 或译“可耻地对待他”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: 又
  rationale: 在比喻的连续叙事中表示动作再次发生；现代汉语用“又”简洁自然。
- source_word: ἀπέστειλεν πρὸς αὐτοὺς
  choice: 差……到他们那里去
  rationale: 保留“差遣”的主仆关系，并自然表达πρός所指的方向和对象。
- source_word: ἄλλον δοῦλον
  choice: 另一个仆人
  rationale: δοῦλος可指仆人或奴隶；本句以“仆人”表达庄园主所差派之人的身份，较符合现代叙事语体，同时以脚注保留“奴隶”这一可能译法。
- source_word: κἀκεῖνον
  choice: 他们……他
  rationale: κἀκεῖνον含“而那一个也”的承接意味；汉语借后续分句和宾语“他”自然体现，不生硬直译为“那一个”。
- source_word: ἐκεφαλίωσαν
  choice: 打伤了他的头
  rationale: 这是罕见动词，表示暴力施于头部；“打伤了他的头”既保留受伤含义，也避免误解为斩首。
- source_word: ἠτίμασαν
  choice: 羞辱他
  rationale: 表达以不尊重、可耻的方式对待某人；“羞辱”简洁自然，并保留荣辱层面的含义。
