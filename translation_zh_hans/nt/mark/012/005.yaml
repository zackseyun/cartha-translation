  text: ⸀καὶ ἄλλον ἀπέστειλεν· κἀκεῖνον ἀπέκτειναν, καὶ πολλοὺς ἄλλους, ⸂οὓς μὲν δέροντες οὓς δὲ ἀποκτέννοντες⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/005.yaml
  text: And he sent another[a], and they killed that one; and many others—some they beat, and some they killed.
translation:
  language: zh_hans
  text: 他又派了另一个仆人去，他们把那人也杀了。他又派了许多别的仆人去；他们打了一些，杀了另一些。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλον
  choice: 另一个仆人
  rationale: ἄλλον承接上下文，指另一个受差派的仆人。汉语补出“仆人”可明确所指，不增加原文叙事中的新信息。
- source_word: ἀπέστειλεν
  choice: 派……去
  rationale: 准确表达差派某人前往的动作，也符合现代汉语叙事习惯。
- source_word: κἀκεῖνον
  choice: 把那人也
  rationale: 同时保留ἐκεῖνον的指示意味和καί的附加意味，即“那一个也”。
- source_word: ἀπέκτειναν
  choice: 杀了
  rationale: 直接传达ἀποκτείνω的暴力含义，语言自然，不弱化为较含蓄的说法。
- source_word: πολλοὺς ἄλλους
  choice: 许多别的仆人
  rationale: 指在先前仆人之外继续受差派的许多人；补出“仆人”使汉语所指清楚。
- source_word: οὓς μὲν ... οὓς δὲ
  choice: 一些……另一些
  rationale: 自然表达希腊文的分配结构，区分两组仆人所遭受的不同待遇。
- source_word: δέροντες
  choice: 打了
  rationale: δέρω在此表示殴打；“打”不额外限定为司法性的鞭打。
- source_word: ἀποκτέννοντες
  choice: 杀了
  rationale: 以汉语限定动词自然表达概括性的分配结构，并与前面的“杀了”保持语义一致。
theological_decisions:
- issue: 如何表达分词构成的概括性分配结构
  choice: 译作“他们打了一些，杀了另一些”
  alternative: 译作“有的被打，有的被杀”或“打一些，杀另一些”
  rationale: 原文用现在分词概括许多仆人分别遭受的待遇。改用现代汉语限定动词，可清楚保留分配关系和暴力程度，不对比喻作额外的神学解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。为使独立经节中的指代清楚，两处在ἄλλος后补出上下文已明确的“仆人”；用“后来”衔接压缩的连续差派，但不改变事件次序。
