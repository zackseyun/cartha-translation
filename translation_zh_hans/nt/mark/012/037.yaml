  text: ⸀αὐτὸς Δαυὶδ λέγει αὐτὸν κύριον, καὶ πόθεν ⸂αὐτοῦ ἐστιν υἱός⸃; καὶ ὁ πολὺς ὄχλος ἤκουεν αὐτοῦ ἡδέως.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/037.yaml
  text: David himself calls him Lord[b][a], so how is he his son? And the large crowd was listening to him gladly.
translation:
  language: zh_hans
  text: 大卫自己称他为主；他怎会是大卫的儿子呢？[a]一大群人都乐意听他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译：“从哪里／怎会是他的儿子呢？”“儿子”呼应弥赛亚称号“大卫之子”；在此称号中也可指大卫的后裔。
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς Δαυὶδ
  choice: 大卫自己
  rationale: 保留αὐτός的强调作用，突出大卫本人正是如此称呼弥赛亚。
- source_word: λέγει αὐτὸν κύριον
  choice: 称他为主
  rationale: 这里λέγει构成称谓表达，现代汉语自然译作“称他为主”；“主”保留κύριος在经文引述及基督论语境中的分量。
- source_word: πόθεν
  choice: 怎么会
  rationale: πόθεν字面可指“从哪里”，但此处询问逻辑上如何成立；“怎么会”自然地传达反问力度。
- source_word: αὐτοῦ ἐστιν υἱός
  choice: 是大卫的子孙
  rationale: 此处υἱός涉及“大卫之子”这一弥赛亚称号，语义上指后裔；用“子孙”在现代汉语中避免被误解为大卫的直接儿子，同时保留血统关系。
- source_word: ὁ πολὺς ὄχλος
  choice: 众人
  rationale: 该短语指人数众多的群众；“众人”简洁自然，不把它解释为社会阶层意义上的“平民”。
- source_word: ἤκουεν αὐτοῦ
  choice: 听耶稣讲论
  rationale: 未完成时表示持续聆听；补出“耶稣”以消除连续代词在汉语中的指称含混，“讲论”符合此处公开教导的语境。
- source_word: ἡδέως
  choice: 乐意
  rationale: 表达听众带着愉悦和欣然的态度聆听，现代汉语自然且庄重。
theological_decisions:
- issue: 大卫称弥赛亚为“主”的基督论张力
  choice: 保留“称他为主”及随后未加解释的反问
  alternative: 明说“大卫称弥赛亚为主，因此弥赛亚不只是他的后裔”
  rationale: 原文提出张力，却没有在本节展开完整的教义解释；译文不替经文消解这一张力。
- issue: υἱός在弥赛亚语境中的译法
  choice: 子孙
  alternative: 儿子；后裔
  rationale: “子孙”能表达大卫家系中的后代，又与传统“大卫的子孙”这一弥赛亚表达相呼应；脚注提供更贴近字面的“儿子”，以保留原文措辞的修辞张力。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“怎么会”保留反问语气；末句避免生硬直译为“群众欢喜地听他”，以“众人都乐意听耶稣讲论”呈现持续聆听及欣然态度。
