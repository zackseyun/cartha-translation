  text: ⸀καὶ λαβόντες αὐτὸν ἔδειραν καὶ ἀπέστειλαν κενόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/003.yaml
  text: And they took him[a], beat him, and sent him away empty-handed.
translation:
  language: zh_hans
  text: 他们抓住他，打了他一顿，又把他空手送了回去。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “空手”所译的希腊词字面是“空的”，这里指这个仆人没有得到任何东西，就被送了回去。
    reason: 说明κενόν的字面义及其在本句中指仆人被遣回时一无所得。
lexical_decisions:
- source_word: λαβόντες（λαμβάνω）
  choice: 抓住
  rationale: 这是不定过去时分词，在句中表示先于后续动作发生。结合佃户敌意对待仆人的语境，“抓住”自然体现控制住他的意思，又不增添“逮捕”等原文没有的正式含义。
- source_word: ἔδειραν（δέρω）
  choice: 打了他一顿
  rationale: δέρω在此指殴打、痛打。“打了他一顿”是现代汉语中自然清楚的表达，也避免把行为过度具体化为正式的鞭打。
- source_word: ἀπέστειλαν（ἀποστέλλω）
  choice: 叫他……回去
  rationale: 本词基本义为“差遣、送走”。本句所说的是佃户把主人派来的仆人送回，因此译作“叫他……回去”符合叙事方向，也较自然。
- source_word: κενόν（κενός）
  choice: 空手
  rationale: 该形容词字面义为“空的”，在这里补充说明仆人离开时一无所得。“空手”准确传达他没有带回主人应得之物的含义。
- source_word: καὶ … καὶ
  choice: ……，……，又……
  rationale: 重复的καί串联连续动作。汉语以逗号和“又”保持简洁的并列推进，同时避免生硬重复“并且”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“打了他一顿”清楚表达暴力程度，但不擅自限定为鞭打；整体保留原文一连串动作的紧凑节奏。
