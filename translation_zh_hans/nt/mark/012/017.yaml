base_translation:
  language: en
  yaml_path: translation/nt/mark/012/017.yaml
  text: But Jesus said to them[a], “Give back to Caesar the things that are Caesar’s, and to God the things that are God’s.” And they were utterly amazed at him.
translation:
  language: zh_hans
  text: 耶稣却对他们说：“把凯撒的东西归给凯撒，把上帝的东西归给上帝。”他们都对他大为惊奇。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόδοτε
  choice: 归还……；归给……
  rationale: 该命令式可指归还、偿付或交付应当给出的东西。第一分句用“归还”体现凯撒的钱币及其所属关系；第二分句用自然的“归给”保持平行，同时避免暗示人能以同样方式偿还上帝。
- source_word: Τὰ Καίσαρος ... Καίσαρι
  choice: 凯撒的东西……归还凯撒
  rationale: 保留中性复数所表达的广泛所属关系，不把含义局限为税款，也不扩展为完整的政治理论。
- source_word: τὰ τοῦ θεοῦ ... τῷ θεῷ
  choice: 上帝的东西……归给上帝
  rationale: 与前句形成刻意的平行结构，保留哪些东西属于上帝这一开放而富张力的表达。
- source_word: ἐξεθαύμαζον
  choice: 惊叹不已
  rationale: ἐκθαυμάζω带有加强语气；“惊叹不已”自然地传达强烈、持续的惊异反应。
- source_word: ἐπ’ αὐτῷ
  choice: 对他
  rationale: 按惊叹类动词与ἐπί加与格的结构，直译其惊叹所指向的对象，不把它明确缩窄为只针对这句话。
- source_word: δὲ
  choice: 却
  rationale: “却”自然表达δέ在敌对问答中的轻微转折。
- source_word: εἶπεν αὐτοῖς
  choice: 对他们说
  rationale: 采用现代汉语中自然、直接的引语导入方式。
theological_decisions:
- issue: 公民义务与对上帝义务之间的关系
  choice: 直接保留两个平行分句，不解释二者范围或彼此关系
  alternative: 把本句明确解释为支持政权，或解释为削弱凯撒的一切主张
  rationale: 经文本身承认有归凯撒和归上帝的事物，却未在此建立完整的政教理论；译文应保留这种神学张力。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“凯撒的东西／上帝的东西”通俗清楚，并保留原文范围未明的所属表达；两分句以“归还／归给”兼顾ἀπόδοτε的词义和现代汉语习惯。
