- from: 耶稣却对他们说：“凯撒的东西，要归还凯撒；上帝的东西，要归给上帝。”他们就对他惊叹不已。
  to: 耶稣却对他们说：“把凯撒的东西归给凯撒，把上帝的东西归给上帝。”他们都对他大为惊奇。
  rationale: 修订仅统一两个平行命令中的动词，并以较中性的汉语表达众人的强烈惊异。译文仍保留“凯撒的东西／上帝的东西”所指范围的开放性，且不加入任何政治或教义解释。
