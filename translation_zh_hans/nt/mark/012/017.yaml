review_pass:
  verdict: revise
  source_fidelity: 核心意思译出准确：保留了凯撒与上帝之间的平行对照，未将“凯撒的东西”限缩为税款，也没有引入政教关系的解释。不过，原文对两个分句使用同一个命令式ἀπόδοτε；草稿以“归还／归给”分别处理，削弱了刻意的词汇平行。
  naturalness: “凯撒的东西”“上帝的东西”及引语结构自然。将命令句改为“把……归给……”更符合现代汉语，并使两分句完全对称。“惊叹不已”在汉语中较易带出赞赏、赞叹意味；“大为惊奇”较稳妥地表达ἐξεθαύμαζον所指强烈的惊异。
  terminology: “凯撒”与“上帝”一致、恰当。“归给”能表达ἀπόδοτε所含交付应得之物的意思，又避免将第一句专门解释为纳税；同一措辞用于两句也保留原文修辞平行。
  issues:
  - severity: medium
    issue: 两个平行分句将同一希腊动词分别译作“归还”和“归给”。
    rationale: ἀπόδοτε在两处均出现一次，原文以重复强化平行。中文采用同一动词可更忠实保留这一结构；“归给”在两个对象处均可表达交付其应得之物。
  - severity: low
    issue: “惊叹不已”可能偏向赞赏性的“赞叹”。
    rationale: ἐξεθαύμαζον表达强烈惊异，未必含正面赞赏。“大为惊奇”更中性，且保留其强度。
  revised_text: 耶稣却对他们说：“把凯撒的东西归给凯撒，把上帝的东西归给上帝。”他们都对他大为惊奇。
