base_translation:
  language: en
  yaml_path: translation/nt/mark/012/008.yaml
  text: And they took him[a], killed him, and threw him out of the vineyard.
translation:
  language: zh_hans
  text: 于是他们抓住他[a]，杀了他，又把他扔到葡萄园外。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些读者因平行经文中的比喻传统，可能预期这里的次序是“把他扔出葡萄园，杀了他”；但马可福音此处的希腊文本是“杀了他，又把他扔到葡萄园外”。
    reason: cross_reference
lexical_decisions:
- source_word: λαβόντες
  choice: 抓住他
  rationale: 这是λαμβάνω的不定过去时分词，在这里引出连续动作。结合园户对儿子的敌对行为，“抓住”自然表达将他控制住，但不额外强化为更猛烈的“擒拿”。
- source_word: ἀπέκτειναν
  choice: 杀了他
  rationale: ἀποκτείνω直指杀死；“杀了”简明、现代，也保留原文叙述的 stark force。
- source_word: ἐξέβαλον
  choice: 把他扔到……外
  rationale: ἐκβάλλω在此表示强行扔出；与ἔξω τοῦ ἀμπελῶνος连用，译为“把他扔到葡萄园外”既自然，也保留驱逐和抛弃的力度。
- source_word: ἔξω τοῦ ἀμπελῶνος
  choice: 葡萄园外
  rationale: ἔξω加属格在此表示朝向葡萄园之外的动作；汉语以“扔到葡萄园外”清楚表达这一方向。
- source_word: ἀμπελῶνος
  choice: 葡萄园
  rationale: ἀμπελών在该比喻语境中的标准含义是种植葡萄的园子，即“葡萄园”。
theological_decisions:
- issue: 杀害与扔出葡萄园的先后次序
  choice: 按马可此处希腊文本的顺序，先杀了他，随后把他扔到葡萄园外。
  alternative: 受平行比喻传统影响，理解或翻译为先扔出葡萄园，再杀害。
  rationale: SBLGNT的动词顺序是ἀπέκτειναν，随后ἐξέβαλον；译文不与平行经文协调，而保留马可文本本身的叙事次序及其可能产生的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“于是”承接上下文，“抓住—杀了—扔到……外”保持原文快速、严厉的动作链。脚注标记[a]置于“抓住他”之后，与咨询层位置一致，同时脚注说明整句动作次序。
