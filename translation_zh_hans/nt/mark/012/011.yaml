  text: παρὰ κυρίου ἐγένετο αὕτη, καὶ ἔστιν θαυμαστὴ ἐν ὀφθαλμοῖς ἡμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/011.yaml
  text: This came from the Lord[b][a], and it is marvelous in our eyes.
translation:
  language: zh_hans
  text: 这事出于主[a]，在我们眼中甚为奇妙。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这是主所成就的。”希腊语短语既可表示来源，也可表示施事者。
    reason: lexical_alternative
  - marker: b
    text: 本句引自《诗篇》118:23。
    reason: cross_reference
lexical_decisions:
- source_word: παρὰ κυρίου
  choice: 出于主
  rationale: παρά接属格通常表示来源或起源。“出于主”既准确表达这一含义，也符合现代汉语的经文语体；希腊语在此也可带有施事意味。
- source_word: κυρίου
  choice: 主
  rationale: 此处是引自《诗篇》118:23，所指为上帝；但新约希腊文本使用κύριος，因此译作“主”，不把希伯来语原文中的神名形式直接引入正文。
- source_word: ἐγένετο
  choice: 是出于
  rationale: γίνομαι在这里与παρὰ κυρίου构成表达来源及成就的结构。“是出于”在汉语中自然地传达“由主而来、因主而成”的意思，同时避免把事情说成偶然发生。
- source_word: αὕτη
  choice: 这
  rationale: 阴性指示代词回指上文所引之事，即被弃的石头成了房角石。译作“这”保留原文简洁的回指，不额外明确为“这块石头”或“这事”。
- source_word: θαυμαστὴ
  choice: 奇妙的
  rationale: θαυμαστός表示令人惊叹、非同寻常。“奇妙”保留诗篇引文庄重而赞叹的语气，在现代汉语中也清楚自然。
- source_word: ἐν ὀφθαλμοῖς ἡμῶν
  choice: 在我们眼中
  rationale: 直译保留原文的视觉意象及其闪语式表达，同时现代汉语读者能自然理解为“在我们看来”。
theological_decisions:
- issue: 在指向上帝的《诗篇》引文中如何翻译κύριος
  choice: 主
  alternative: 耶和华
  rationale: 虽然《诗篇》118:23的希伯来语底本使用神名，但本节新约希腊文本写的是κυρίου。正文据当前希腊文本译作“主”，既保留旧约引文背景，也不以希伯来语形式取代新约用词。
- issue: παρὰ κυρίου所表达的来源与施事关系
  choice: 出于主
  alternative: 是主所成就的
  rationale: 希腊语短语首先可表达来源，但在语境中也可能包含主使此事成就的施事意味。正文选择“出于主”以保留来源重点，并用脚注呈现施事性译法，避免排除原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的经文语体。“出于主”和“在我们眼中”保留原文及诗篇引文的表达特色；加入“也”使两个并列分句在汉语中衔接自然，而不改变语义。
