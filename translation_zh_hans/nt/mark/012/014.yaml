id: MRK.12.14
reference: Mark 12:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ⸀καὶ ἐλθόντες λέγουσιν αὐτῷ· Διδάσκαλε, οἴδαμεν ὅτι ἀληθὴς εἶ καὶ οὐ μέλει σοι περὶ οὐδενός, οὐ γὰρ βλέπεις εἰς πρόσωπον ἀνθρώπων, ἀλλ’ ἐπ’ ἀληθείας τὴν ὁδὸν τοῦ θεοῦ διδάσκεις· ἔξεστιν ⸂δοῦναι κῆνσον Καίσαρι⸃ ἢ οὔ; δῶμεν ἢ μὴ δῶμεν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/014.yaml
  text: And they came and said to him[a], “Teacher, we know that you are truthful and do not care about anyone, for you do not look at the face of men, but truly teach the way of God. Is it lawful to pay the poll tax to Caesar or not? Should we pay it[b], or should we not pay it?”
translation:
  language: zh_hans
  text: 他们来对他说：“老师，我们知道你诚实，不受任何人左右，因为你不看人的情面[a]，而是按真理教导上帝的道路。向凯撒缴纳人头税[b]合不合法？我们该缴，还是不该缴？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不看人的情面”也可译作“不偏待人”或“不受人的外表和地位影响”。
    reason: lexical_alternative
  - marker: b
    text: 这里的“人头税”指罗马政府按人口征收的税。
    reason: cultural_note
lexical_decisions:
- source_word: Διδάσκαλε
  choice: 老师
  rationale: 这是现代汉语中对教导者自然、清楚的称呼，也保留了福音书语境中的教导职分。
- source_word: ἀληθὴς
  choice: 诚实
  rationale: 在此作人物谓语，表示言行真实可信；“诚实”比单说“真实”更符合现代汉语表达。
- source_word: οὐ μέλει σοι περὶ οὐδενός
  choice: 不受任何人左右
  rationale: 结合下句可知，重点不是对人漠不关心，而是不因任何人的身份、意见或压力改变立场。
- source_word: οὐ ... βλέπεις εἰς πρόσωπον ἀνθρώπων
  choice: 不看人的情面
  rationale: 保留“看……面”的源语意象，同时以自然汉语传达不徇情面、不按身份偏待人的习语含义。
- source_word: ἐπ’ ἀληθείας
  choice: 按真理
  rationale: 既可表示真实、诚恳地教导，也可强调教导符合真理；此译保留其庄重语气及一定的语义张力。
- source_word: τὴν ὁδὸν τοῦ θεοῦ
  choice: 上帝的道路
  rationale: 保留圣经中“道路”的具体比喻，不将其简化为一般性的教训或旨意。
- source_word: ἔξεστιν
  choice: 合不合法
  rationale: 以现代汉语自然表达许可性和法律伦理层面的争议，同时保留设问的正式性质。
- source_word: δοῦναι κῆνσον Καίσαρι
  choice: 向凯撒缴纳人头税
  rationale: “缴纳”符合税款搭配；κῆνσος在此指罗马征收的人头税，而“凯撒”保留其称号。
- source_word: δῶμεν ἢ μὴ δῶμεν
  choice: 我们该缴，还是不该缴
  rationale: 保留原文重复动词所形成的紧迫二选一问法，并采用简洁自然的现代汉语。
theological_decisions:
- issue: 如何表达不看人的脸面这一习语
  choice: 正文译作“不看人的情面”，脚注说明其含义
  alternative: 不偏待人；不按人的外貌或地位判断
  rationale: 这样既保留源语“脸面”的具体意象，又避免读者误以为只是视觉上的“不看脸”，也不引入特定教派解释。
- issue: 如何理解οὐ μέλει σοι περὶ οὐδενός
  choice: 不受任何人左右
  alternative: 不在乎任何人；不顾忌任何人
  rationale: 若直译为“不在乎任何人”，现代汉语容易被理解为冷漠无情；上下文强调的是耶稣不因人的身份和压力而徇私，因此采用功能上准确且不消解下句说明作用的表达。
- issue: ἐπ’ ἀληθείας的表达
  choice: 按真理
  alternative: 真实地；诚诚实实地
  rationale: 该短语既可作方式状语，也与“上帝的道路”形成真理层面的联系；“按真理”自然且保留这种开放性。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事与对话体。“老师”“缴纳”“合不合法”符合当代普通读者的表达习惯；保留“上帝的道路”“凯撒”等圣经和历史语汇。所有脚注标记均已置于正文相应位置。
