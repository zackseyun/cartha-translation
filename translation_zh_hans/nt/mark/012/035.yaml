  text: Καὶ ἀποκριθεὶς ὁ Ἰησοῦς ἔλεγεν διδάσκων ἐν τῷ ἱερῷ· Πῶς λέγουσιν οἱ γραμματεῖς ὅτι ὁ χριστὸς υἱὸς ⸂Δαυίδ ἐστιν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/035.yaml
  text: And Jesus answered and said[a], as he was teaching in the temple, “How do the scribes say that the Messiah is the son of David?”
translation:
  language: zh_hans
  text: 耶稣在圣殿里教导时说：“经学家怎么说弥赛亚是大卫的子孙呢？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弥赛亚”也可译作“基督”。希腊语 Christos 在这里用作弥赛亚称号。
    reason: 保留传统译名，并说明该词在本节中的称号用法。
lexical_decisions:
- source_word: ἀποκριθεὶς ... ἔλεγεν
  choice: 说道
  rationale: ἀποκριθείς常表示“回答”，但这里前面没有直接问题，可作为回应当时论题的叙事引介。汉语若译作“回答说”容易暗示有人刚刚发问，因此用自然的“说道”，不强加这一含义。
- source_word: διδάσκων
  choice: 教导时
  rationale: 现在分词说明耶稣说这话时正在施教；“在……教导时”自然表达同时发生的动作。
- source_word: ἐν τῷ ἱερῷ
  choice: 在圣殿里
  rationale: ἱερόν指圣殿建筑群或其范围，并非专指内殿；“圣殿”是简洁、通行的对应语。
- source_word: Πῶς λέγουσιν
  choice: 怎么说
  rationale: 紧贴希腊文“怎么说”，保留疑问可能兼具询问依据与质疑说法的语用张力，不增译为更强的“怎么能说”。
- source_word: οἱ γραμματεῖς
  choice: 经学家
  rationale: 指研习、解释并教授律法的专业人士；“经学家”比“文士”更便于现代普通读者理解，同时保留其历史身份。
- source_word: ὁ χριστός
  choice: 弥赛亚
  rationale: 此处是犹太语境中的称号，译作“弥赛亚”比名称化的“基督”更清楚地呈现其受膏君王含义。
- source_word: υἱὸς Δαυίδ
  choice: 大卫的子孙
  rationale: υἱός在谱系称谓中可指后裔；现代汉语“子孙”自然表达大卫后裔的弥赛亚称号，并避免误解为大卫直接所生的儿子。
theological_decisions:
- issue: Χριστός作为称号的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 上下文讨论的是犹太人的弥赛亚身份与大卫后裔关系，因此正文采用“弥赛亚”；“基督”作为传统对应词列入脚注。
- issue: “大卫之子”的关系
  choice: 大卫的子孙
  alternative: 大卫的儿子
  rationale: 此处称号表达谱系上的后裔关系；译作“子孙”避免现代读者误以为是直接父子关系，同时不消解后文所提出的身份张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“经学家”兼顾历史角色与现代可懂度；问句保留原文简洁形式及其修辞张力。脚注标记置于整句引文之后。
