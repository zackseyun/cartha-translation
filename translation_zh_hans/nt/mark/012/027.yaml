  text: οὐκ ἔστιν ⸀θεὸς νεκρῶν ⸀ἀλλὰ ζώντων· ⸀πολὺ πλανᾶσθε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/027.yaml
  text: He is not God of the dead[a], but of the living[b]. You are greatly mistaken.
translation:
  language: zh_hans
  text: 他不是死人的上帝，而是活人的上帝。你们大大错了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θεὸς
  choice: 上帝
  rationale: 这里指前文所说亚伯拉罕、以撒、雅各的上帝，是专指独一的上帝；汉语用“上帝”自然明确，不译作泛指的“一个神”。
- source_word: νεκρῶν
  choice: 死人
  rationale: 属格复数作名词使用，指“死去的人”；译作“死人”简洁自然，并与“活人”形成鲜明对照。
- source_word: ἀλλὰ ζώντων
  choice: 而是活人的上帝
  rationale: ζώντων为现在分词复数、名词性使用，指活着的人。汉语补出“上帝”，使“不……而是……”的对照完整清楚，同时不增添复活或中间状态的解释。
- source_word: οὐκ ἔστιν
  choice: 他不是
  rationale: 希腊文在语境中承接前句所指的上帝。汉语以“他”承接自然，并保留原句判断结构。
- source_word: πολὺ
  choice: 大
  rationale: 在“大错了”中作程度强化，准确表达πολύ修饰πλανᾶσθε的强烈语气，符合现代汉语习惯。
- source_word: πλανᾶσθε
  choice: 错了
  rationale: 该中间/被动形态在此表示陷入严重错误。译作“错了”自然直接；与“大”组合，既保留责备力度，又不限定为受人欺骗或主动走迷。
theological_decisions:
- issue: 耶稣论证中人在上帝面前仍然活着的含义
  choice: 直译为“死人”与“活人”的对照，不扩写其对复活或死后状态的具体含义。
  alternative: 解释性译为“在上帝面前，所有人都是活的”或直接说明复活教义。
  rationale: 本句服务于耶稣关于复活的论证，但原文本身以简洁对照表达。保留这一表述，既呈现其神学张力，也避免把解释写进正文。
- issue: θεὸς在前后两个属格短语中的句法表达
  choice: 在“不……而是……”两部分都表达“上帝”，即“不是死人的上帝，而是活人的上帝”。
  alternative: 较省略地译为“他不是死人的上帝，而是活人的”。
  rationale: 汉语重复“上帝”更清楚庄重，也准确显明两组属格同受θεός支配，不改变原文意义。
translation_notes:
  register: 采用现代、庄重而口语可懂的标准普通话。“他不是死人的上帝，而是活人的上帝”清楚保留原文对称；“你们大错了”简洁有力，传达πολὺ πλανᾶσθε的强烈责备。正文没有需要脚注才能保留的实质歧义，因此不设脚注。
