  text: οἱ κατεσθίοντες τὰς οἰκίας τῶν χηρῶν καὶ προφάσει μακρὰ προσευχόμενοι· οὗτοι λήμψονται περισσότερον κρίμα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/040.yaml
  text: who devour widows’ houses and for appearance’s sake pray at length—these will receive greater condemnation[a][b].
translation:
  language: zh_hans
  text: 他们侵吞寡妇的家产，又假意[a]作很长的祷告。这些人必受更重的定罪[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以作掩饰”或“为了给人看”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“更重的审判”。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεσθίοντες
  choice: 侵吞
  rationale: 原词本义为“吞吃”，此处以强烈的比喻描写贪婪夺取他人财物；“侵吞”在现代汉语中自然地传达这种掠夺意味。
- source_word: τὰς οἰκίας
  choice: 家产
  rationale: 字面为“房屋”，在此语境中可指寡妇的家庭产业或生计。“家产”既保留具体的财产含义，也避免被误解为仅指建筑物。
- source_word: τῶν χηρῶν
  choice: 寡妇的
  rationale: 忠实表达所有格复数，明确指出受侵害的是处于弱势地位的寡妇。
- source_word: προφάσει
  choice: 假意
  rationale: 该词表示借口、托词或外在掩饰；“假意”简洁自然地表达祷告并非出于真诚，而是作为伪装。
- source_word: μακρὰ
  choice: 冗长
  rationale: 此处作副词性用法，表示祷告持续很久；“冗长”同时传达篇幅长及语境中的负面意味。
- source_word: προσευχόμενοι
  choice: 作……祷告
  rationale: 以现代汉语的谓语结构表达希腊文分词，使句子流畅，同时保留持续祷告的描述。
- source_word: λήμψονται
  choice: 必受
  rationale: 表达将来必然领受的结果，符合警告和审判语境的庄重语气。
- source_word: περισσότερον
  choice: 更重的
  rationale: 保留比较级，指出这些人所受的定罪程度更重，而不进一步规定比较对象。
- source_word: κρίμα
  choice: 定罪
  rationale: 在本段关于宗教虚伪与剥削的警告中，该词带有不利且惩罚性的审判意味；“定罪”比宽泛的“审判”更贴合语境。
theological_decisions:
- issue: κρίμα在宗教虚伪警告中的含义
  choice: 定罪
  alternative: 审判
  rationale: 上下文所说的不只是接受评断，而是遭受不利的神圣裁决；“定罪”体现其惩罚性，同时脚注保留较宽泛的“审判”，不把经文扩展成更具体的末世审判体系。
- issue: προφάσει所表达的虚伪方式
  choice: 假意
  alternative: 以此作掩饰；为了给人看
  rationale: 原文可强调托词、掩饰或外在表演。“假意”适合作正文，但脚注保留其他可能侧重，以免过度限定其具体动机。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“侵吞寡妇的家产”清楚传达掠夺弱势者产业的含义；“假意作冗长的祷告”保留宗教表演与虚伪之间的张力。正文中的[a]、[b]均与脚注对应。
