  text: ἔτι ⸂ἕνα εἶχεν, υἱὸν ἀγαπητόν· ἀπέστειλεν⸃ αὐτὸν ⸂ἔσχατον πρὸς αὐτοὺς⸃ λέγων ὅτι Ἐντραπήσονται τὸν υἱόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/006.yaml
  text: He still had one[a], a beloved son. He sent him last to them, saying[c][b], ‘They will respect my son.’
translation:
  language: zh_hans
  text: 他还剩下一位，就是他的爱子；最后，他派他到他们那里去，说：“他们会敬重我的儿子。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “敬重”也可理解为“因他而感到惭愧”或“对他表示敬畏”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι ἕνα εἶχεν
  choice: 他还有一位
  rationale: 表达在先前仆人之后，园主仍有一位可以差派；“还有一位”自然保留了“仅余这一位”的语意，而不额外加入原文未明说的“只”。
- source_word: υἱὸν ἀγαπητόν
  choice: 就是他的爱子
  rationale: “爱子”简洁、庄重，表达ἀγαπητός所含“所爱的、亲爱的”之意，也保留《马可福音》中相关措辞的呼应，不在正文中扩展其神学含义。
- source_word: ἀπέστειλεν αὐτὸν ἔσχατον πρὸς αὐτούς
  choice: 最后，他把儿子派到他们那里
  rationale: “最后”保留ἔσχατον的次序与高潮意味；补出“儿子”作宾语，使现代汉语指代清楚。
- source_word: λέγων ὅτι
  choice: 心想
  rationale: 这里引出园主对佃户反应的预期；现代汉语用“心想”比直译“说”更自然，同时不改变话语内容。
- source_word: Ἐντραπήσονται
  choice: 总会敬重
  rationale: 在此语境中，动词表示因对方身份而有所顾忌、给予尊重；“敬重”兼具尊敬和郑重对待之意。“总会”传达园主在屡遭拒绝后仍持有的期待，但不把它强化为绝对保证。
- source_word: τὸν υἱόν μου
  choice: 我的儿子
  rationale: 直接保留第一人称领属表达及比喻中“儿子”的分量。
theological_decisions:
- issue: “爱子”的基督论呼应
  choice: 正文保留“爱子”，不加解释性扩写
  alternative: 我深爱的儿子
  rationale: “爱子”忠实承载短语本身，并自然呼应《马可福音》对耶稣的称呼；翻译不替读者明说比喻所指。
- issue: 园主期待的语气
  choice: 译作“他们总会敬重我的儿子”
  alternative: 他们会因我的儿子而惭愧／他们会尊重我的儿子
  rationale: ἐντρέπομαι在此可涉及羞愧、顾忌或敬重。上下文侧重佃户会因儿子的身份而改变行为，因此正文采用自然的“敬重”，脚注保留词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“爱子”保留经文的凝练和互文回响；“派到他们那里”符合现代汉语表达。脚注标记置于相关引语之后。
