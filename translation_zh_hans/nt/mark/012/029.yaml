  text: ⸂ἀπεκρίθη ὁ Ἰησοῦς⸃ ὅτι Πρώτη ⸀ἐστίν· Ἄκουε, Ἰσραήλ, κύριος ὁ θεὸς ἡμῶν κύριος εἷς ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/029.yaml
  text: 'Jesus answered[a], “The first is: Hear, O Israel, the Lord our God[b], the Lord is one.'
translation:
  language: zh_hans
  text: 耶稣回答说：“第一是：‘以色列啊，你要听！主是我们的上帝；主是独一的。[a][b]’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“主我们的上帝是独一的主”，又或：“主是我们唯一的上帝。”希腊文呼应《申命记》6:4，可能强调上帝的独一，也可能强调唯独他是主，或两者兼有。
    reason: alternative_reading
  - marker: b
    text: 本句引用“示玛”（《申命记》6:4）；这里的“主”对应希腊文 κύριος，而七十士译本用这个词代称神圣之名 YHWH。
    reason: cross_reference
lexical_decisions:
- source_word: ἀπεκρίθη ὁ Ἰησοῦς
  choice: 耶稣回答说
  rationale: 按对话叙事的自然汉语表达译出回应意味；“说”用于顺畅引出直接引语。
- source_word: Πρώτη
  choice: 第一是
  rationale: 原文阴性形容词作名词用，承接上文所问的“诫命”；不在正文补出“诫命”，以保留原文的简洁。
- source_word: Ἄκουε
  choice: 你要听
  rationale: 既保留命令语气，也再现《申命记》6:4“示玛”开头的郑重呼召；补出汉语中自然的主语“你”。
- source_word: Ἰσραήλ
  choice: 以色列啊
  rationale: 用“啊”明确呼格和庄重的直接呼唤，比单说“以色列”更符合现代汉语。
- source_word: κύριος
  choice: 主
  rationale: 直接对应希腊文 κύριος；在此引用“示玛”的语境中，它也承载七十士译本以 κύριος 代称神圣之名的背景。
- source_word: ὁ θεὸς ἡμῶν
  choice: 我们的上帝
  rationale: 忠实表达第一人称复数所属关系，并采用现代标准汉语中自然、庄重的词序。
- source_word: εἷς
  choice: 独一的
  rationale: “独一的”在汉语中比孤立的“一个”更自然地表达神的唯一性，同时不把含义扩展为正文中的“唯独”。
theological_decisions:
- issue: “示玛”末句的句法与神学张力
  choice: 主我们的上帝，主是独一的
  alternative: 我们的上帝主是独一的主；主是我们的上帝，唯独他是主
  rationale: 所选译法尽量贴近希腊文次序和重复的 κύριος，承认神的独一，又不在正文中断定重点仅在本体上的“一”或敬拜对象的排他性；其他可能译法置于脚注。
- issue: 引用中 κύριος 与神圣之名的关系
  choice: 正文译“主”，脚注说明其旧约背景
  alternative: 正文译作代表神圣之名的特殊字形
  rationale: 正文直接反映新约希腊文 κύριος，同时通过脚注保留其引用《申命记》6:4及代称 YHWH 的背景，避免在正文中改换文本层次。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。“以色列啊，你要听”保留经文宣告的呼唤感；末句略带原文式重复，以保存“示玛”的句法密度和解释空间。脚注标记均置于相关引文末尾。
