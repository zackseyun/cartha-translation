id: MRK.12.34
reference: Mark 12:34
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ὁ Ἰησοῦς ἰδὼν ⸀αὐτὸν ὅτι νουνεχῶς ἀπεκρίθη εἶπεν αὐτῷ· Οὐ μακρὰν εἶ ἀπὸ τῆς βασιλείας τοῦ θεοῦ. καὶ οὐδεὶς οὐκέτι ἐτόλμα αὐτὸν ἐπερωτῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/034.yaml
  text: And Jesus[a], seeing that he had answered wisely, said to him, “You are not far from the kingdom of God.” And no one any longer dared to question him.
translation:
  language: zh_hans
  text: 耶稣见他回答得很有见识，就对他说：“你离上帝的国不远了。”[a] 从此，再没有人敢向他发问。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你已经接近上帝的国。”希腊原文表达的是距离接近，并未明确表示已经进入。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: 见
  rationale: 以自然的汉语承接分词结构，并结合“他回答得很有见识”表达耶稣观察后作出评价的语义关系。
- source_word: νουνεχῶς
  choice: 很有见识
  rationale: 该副词表示明智、审慎而有理解力地作答；“很有见识”在现代汉语中自然，也保留肯定其判断力的意味。
- source_word: ἀπεκρίθη
  choice: 回答
  rationale: 汉语依靠语序即可清楚表达回答先于耶稣说话，无须另加完成体标记。
- source_word: Οὐ μακρὰν εἶ ἀπὸ
  choice: 你离……不远了
  rationale: 保留原文的空间距离比喻与“接近但未明说进入”的张力；句末“了”自然表达其当前所处状态，不表示已经进入。
- source_word: βασιλείας τοῦ θεοῦ
  choice: 上帝的国
  rationale: 这是现代汉语中清楚而庄重的表达，可兼容上帝掌权与其国度的语义，不额外限定为单一含义。
- source_word: οὐκέτι
  choice: 从此，再没有
  rationale: 明确表达从这一刻以后不再有人继续发问的时间推进。
- source_word: ἐτόλμα
  choice: 敢
  rationale: 直接保留原文关于勇气或胆量的含义，符合自然汉语。
- source_word: ἐπερωτῆσαι
  choice: 向他发问
  rationale: 既表达向耶稣提出问题，也比中性的“问”略显正式，适合此前带有试探或诘问意味的语境，而不夸大为“审问”。
theological_decisions:
- issue: 文士相对于上帝之国的地位
  choice: 你离上帝的国不远了
  alternative: 你已经接近上帝的国
  rationale: 原文只断言距离不远，并未明确宣告他已经进入或拥有上帝的国；译文保留耶稣肯定其见识、却不消除其是否已经进入之张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“回答得很有见识”避免生硬直译；“向他发问”与全段公开辩问的语境相称。脚注标记置于相关引语之后。
