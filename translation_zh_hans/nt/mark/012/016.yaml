  text: οἱ δὲ ἤνεγκαν. καὶ λέγει αὐτοῖς· Τίνος ἡ εἰκὼν αὕτη καὶ ἡ ἐπιγραφή; οἱ δὲ εἶπαν αὐτῷ· Καίσαρος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/016.yaml
  text: And they brought one. And he says to them[a], “Whose image is this, and whose inscription?” And they said to him, “Caesar’s.”
translation:
  language: zh_hans
  text: 他们就拿来一枚。耶稣问他们：“这是谁的像，谁的铭文？”他们回答：“凯撒的。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤνεγκαν
  choice: 拿来一枚
  rationale: φέρω在此意为“拿来”；宾语承接上文所说的银币（一个第纳尔）而省略。现代汉语需要适度补出量词，“一枚”自然指向硬币，又不重复增添原文未明说的币名。
- source_word: λέγει
  choice: 问
  rationale: 原词本义为“说”，但其后是直接问句，汉语叙事中译作“问”更自然，并准确表达言语行为。希腊文历史现在时所产生的叙事鲜活感，在现代汉语中若机械译成“问道/说”并不能稳定对应，故按汉语叙事习惯处理。
- source_word: αὐτοῖς
  choice: 他们
  rationale: 保留间接宾语，明确耶稣是在向拿来银币的人发问。
- source_word: εἰκών
  choice: 像
  rationale: “像”简洁而准确，可指钱币上的人物肖像，也保留该词较广的“形像”语义范围；此处无需专门化为“肖像”。
- source_word: ἐπιγραφή
  choice: 题字
  rationale: 指钱币上铸刻的文字。“题字”在现代汉语中自然易懂，也比泛泛的“文字”更能体现铭刻性质。
- source_word: Καίσαρος
  choice: 凯撒的
  rationale: 属格简洁回答前面的“谁的”，可表示钱币上的像和题字属于或关联于凯撒；不额外判定更具体的关系。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语自然的叙事表达。“耶稣”补明λέγει的主语，以免汉语中指代含混；“一枚”依据上文钱币语境补足省略宾语。问句中的“谁的”分别支配“像”和“题字”，清楚反映希腊文两个带冠词名词的并列结构。
