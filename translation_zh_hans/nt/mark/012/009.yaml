id: MRK.12.9
reference: Mark 12:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ⸀τί ποιήσει ὁ κύριος τοῦ ἀμπελῶνος; ἐλεύσεται καὶ ἀπολέσει τοὺς γεωργούς, καὶ δώσει τὸν ἀμπελῶνα ἄλλοις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/009.yaml
  text: What will the owner of the vineyard do? He will come and destroy the tenant farmers[a], and give the vineyard to others.
translation:
  language: zh_hans
  text: 葡萄园的主人会怎么做呢？他会来除灭那些佃农，把葡萄园交给别人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί ποιήσει
  choice: 会怎么做呢
  rationale: 以自然的现代汉语表达希腊文的将来时反问；“呢”体现修辞性语气，却不增添原文没有的逻辑连接词。
- source_word: ὁ κύριος τοῦ ἀμπελῶνος
  choice: 葡萄园的主人
  rationale: 这里的 κύριος 指比喻情境中葡萄园的业主。“主人”既自然，又不把该词在此处直接处理成神学称号。
- source_word: ἀμπελῶνος / ἀμπελῶνα
  choice: 葡萄园
  rationale: 这是 ἀμπελών 在农业及比喻语境中的标准对应表达。
- source_word: ἐλεύσεται
  choice: 他会来
  rationale: 直接表达 ἔρχομαι 的将来意义，并保留主人亲自介入的鲜明动作。
- source_word: ἀπολέσει
  choice: 除灭
  rationale: 保留 ἀπόλλυμι 所表达的严厉、彻底审判，同时不像“杀死”那样把词义过度收窄。
- source_word: τοὺς γεωργούς
  choice: 那些佃农
  rationale: 这些人耕种别人的葡萄园，并非普通雇工；“佃农”简洁地兼顾耕作者和承租者两层含义。指示词“那些”在汉语中自然承接上文已知对象。
- source_word: δώσει
  choice: 交给
  rationale: δίδωμι 的基本义是“给”。在葡萄园由一批经营者转交另一批人的语境中，“交给”比单说“给”自然，又不具体限定为出租或托付。
- source_word: ἄλλοις
  choice: 别人
  rationale: 保持原文所指的开放性，不擅自补成“别的佃农”。
theological_decisions:
- issue: 比喻中非直接神称语境下 κύριος 的译法
  choice: 主人
  alternative: 主；园主
  rationale: 直接所指是故事中的葡萄园业主，因此不译作带有明确神学称号色彩的“主”。“主人”符合现代汉语叙事习惯，同时让比喻更广的神学含义由上下文呈现。
- issue: ἀπολέσει 所表达的审判强度
  choice: 除灭
  alternative: 杀死；毁灭
  rationale: “除灭”保留行动的决定性和严厉性，又不强行把动词限定为某一种具体死亡方式；这使比喻的审判张力得到保留。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“主人—佃农—交给别人”清楚呈现产业归属与经营关系；句式简洁，保留原文先问后答的修辞结构。
