source:
  edition: SBLGNT
  text: Καὶ ἀποστέλλουσιν πρὸς αὐτόν τινας τῶν Φαρισαίων καὶ τῶν Ἡρῳδιανῶν ἵνα αὐτὸν ἀγρεύσωσιν λόγῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/013.yaml
  text: And they send to him some of the Pharisees and some of the Herodians[a], so that they might trap him by a word.
translation:
  language: zh_hans
  text: 他们就派了一些法利赛人和一些希律党人到他那里去，要用话语[a]设圈套捉住他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从他的话中抓住他的把柄。”希腊文“捉住”原是捕猎用语；这里指借言语设法使他落入圈套。
    reason: 说明ἀγρεύσωσιν的捕猎比喻，并提供按语境理解为从耶稣的回答中抓把柄的译法；正文仍不明定话语的归属。
lexical_decisions:
- source_word: ἀποστέλλουσιν
  choice: 派了
  rationale: 希腊文使用历史现在时；现代汉语叙事通常用完成体“派了”，并以“就”承接上下文，使叙述自然流畅。
- source_word: τινας τῶν Φαρισαίων καὶ τῶν Ἡρῳδιανῶν
  choice: 几个法利赛人和几个希律党人
  rationale: 体现τινας加属格的部分结构，表明被派去的是两个群体中的若干人，而不是全部成员。
- source_word: Φαρισαίων
  choice: 法利赛人
  rationale: 采用现代中文圣经及一般读者熟悉的群体名称。
- source_word: Ἡρῳδιανῶν
  choice: 希律党人
  rationale: 采用通行译名，指与希律势力相关的群体，不在正文中额外界定其政治或宗教性质。
- source_word: ἵνα
  choice: 要
  rationale: 简洁自然地表达目的，符合现代汉语叙事语体。
- source_word: ἀγρεύσωσιν
  choice: 设圈套抓住
  rationale: 兼顾该动词源自捕猎的意象及此处比喻性的陷害含义；“设圈套”保留捕捉、诱陷的敌意。
- source_word: λόγῳ
  choice: 用一句话
  rationale: 将单数λόγῳ及其工具性用法直接表达出来，同时不在正文中完全限定这话究竟侧重他们的提问还是耶稣的回答。
theological_decisions:
- issue: 希腊文复数动词的主语未明说
  choice: 他们
  alternative: 祭司长、经学家和长老／当权者
  rationale: 正文仅以动词词形承接前文，并未重述主语，因此保留“他们”，不把上下文中的具体身份补入本节。
- issue: λόγῳ所指话语的归属
  choice: 用一句话设圈套抓住他
  alternative: 抓住他话里的把柄
  rationale: 希腊文可表达借话语作为手段来诱捕，也可从情境理解为借耶稣的回答抓把柄；正文保留较宽的表达，脚注列出自然的语境性译法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“法利赛人”“希律党人”为通行名称；“用一句话设圈套抓住他”有意保留原文的捕猎意象、单数“话”以及手段关系。
