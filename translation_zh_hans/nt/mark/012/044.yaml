  text: πάντες γὰρ ἐκ τοῦ περισσεύοντος αὐτοῖς ἔβαλον, αὕτη δὲ ἐκ τῆς ὑστερήσεως αὐτῆς πάντα ὅσα εἶχεν ἔβαλεν, ὅλον τὸν βίον αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/044.yaml
  text: For they all gave out of their abundance[a], but she, out of her poverty, put in everything she had—her whole livelihood.
translation:
  language: zh_hans
  text: 因为众人都是从自己富余中投的；但她却从自己的缺乏中，把她所有的一切——就是她全部的生活所需——都投了进去。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“她所有用来生活的。”原文也可较直译为“她全部的生活”；这里按上下文指她维持生活所需的全部资财。
    reason: 说明βίος可指“生活”，但在本处具体指维持生活的资财或生计。
lexical_decisions:
- source_word: πάντες γὰρ
  choice: 因为他们全都是
  rationale: γάρ承接上文，说明耶稣为何判定寡妇所投的更多；πάντες强调其余捐献者无一例外。
- source_word: ἐκ τοῦ περισσεύοντος αὐτοῖς
  choice: 从自己的富余中
  rationale: περισσεύω在这里指超过所需、尚有余裕的资源；“富余”既保留有余的含义，也与下文的“穷乏”形成鲜明对照。
- source_word: ἔβαλον / ἔβαλεν
  choice: 投进去
  rationale: βάλλω本义为投、放；在圣殿银库的语境中，“投进去”自然地呈现把钱投入奉献箱的具体动作，并保留原文两次用同一动词的呼应。
- source_word: αὕτη δὲ
  choice: 但她却
  rationale: δέ表达强烈对比；“她”承接上文所说的寡妇，不重复补入原文此处没有的身份称谓。
- source_word: ἐκ τῆς ὑστερήσεως αὐτῆς
  choice: 从自己的穷乏中
  rationale: ὑστέρησις表示欠缺、匮乏；“穷乏”在经济语境中准确，也避免把含义局限为一种主观需要。
- source_word: πάντα ὅσα εἶχεν
  choice: 自己所有的一切
  rationale: 保留πάντα与ὅσα叠加形成的全面、强调语气。
- source_word: ὅλον τὸν βίον αὐτῆς
  choice: 她赖以为生的全部
  rationale: βίος在此处结合金钱奉献的语境，指维持生活的全部资财或生计；这一表达清楚自然，同时保留“全部”的强调。
theological_decisions:
- issue: βίος是指生命本身，还是维持生活的资财
  choice: 译作“她赖以为生的全部”，按经济语境理解为全部生活所依
  alternative: “她的整个生活”或“她的一生”
  rationale: 本节谈论向银库投钱，βίος常可指生计、生活资料；正文不译成“生命”，以免让人误解她当时献出了生物意义上的生命。脚注同时说明较贴近字面的表达，以保留原词的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“富余—穷乏”保持原文的对照，“投进去”保留银库场景中的具体动作；破折号呈现末尾同位说明的强调作用。
