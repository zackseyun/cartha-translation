  text: ἐκεῖνοι δὲ οἱ γεωργοὶ ⸂πρὸς ἑαυτοὺς εἶπαν⸃ ὅτι Οὗτός ἐστιν ὁ κληρονόμος· δεῦτε ἀποκτείνωμεν αὐτόν, καὶ ἡμῶν ἔσται ἡ κληρονομία.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/007.yaml
  text: But those tenant farmers said to one another[a], ‘This is the heir. Come, let us kill him[b], and the inheritance will be ours.’
translation:
  language: zh_hans
  text: 可是，那些佃户互相说道[a]：“这是继承人。来吧，我们杀了他，产业就归我们了[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“互相商量说。”
    reason: 原文表示他们在群体内部彼此交谈、商议。
  - marker: b
    text: 或译：“产业就属于我们了。”
    reason: 这是表达归属关系的另一种自然译法。
lexical_decisions:
- source_word: ἐκεῖνοι δὲ οἱ γεωργοὶ
  choice: 可是，那些佃户
  rationale: δὲ在叙事中带出轻微转折，译作“可是”；ἐκεῖνοι保留为“那些”。结合葡萄园比喻的租赁关系，γεωργοί译作“佃户”，比泛称“农夫”更准确，也比“园户”更符合现代普通话。
- source_word: πρὸς ἑαυτοὺς εἶπαν
  choice: 彼此说
  rationale: 该结构表示群体内部相互商议；“彼此说”自然保留了相互交谈的含义，同时不把话语误解为各自在心里说。
- source_word: Οὗτός ἐστιν ὁ κληρονόμος
  choice: 这是承受产业的人
  rationale: κληρονόμος指依法承受产业者。这里采用清楚自然的描述性表达，避免现代“继承人”可能使部分读者只联想到财产继承程序，同时保留其法律和家族关系含义。
- source_word: δεῦτε ἀποκτείνωμεν αὐτόν
  choice: 来吧，我们杀了他
  rationale: δεῦτε与第一人称复数虚拟式构成共同提议。“来吧，我们……”在现代汉语中自然表达煽动同伙采取行动；“杀”直接对应ἀποκτείνω，不额外加入“谋杀”的法律判断。
- source_word: καὶ ἡμῶν ἔσται ἡ κληρονομία
  choice: 产业就归我们了
  rationale: 以“归我们”表达前置属格ἡμῶν所强调的占有关系；“产业”与前面的承受关系呼应，且不擅自增添原文没有的“他的”。
theological_decisions:
- issue: γεωργοί在葡萄园比喻中的身份
  choice: 佃户
  alternative: 农夫／园户／租户
  rationale: 上下文表明这些人经营园主的葡萄园，并须向园主交纳果实。“佃户”准确呈现他们与园主的租佃和责任关系，又不进一步指定寓意所对应的群体。
- issue: κληρονόμος与κληρονομία的对应关系
  choice: 承受产业的人／产业
  alternative: 继承人／遗产
  rationale: “承受产业的人／产业”保留两个同根希腊词之间的语义联系，并避免把比喻场景过度限定为园主已经死亡后的遗产处置；原文的讽刺和张力仍予保留。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“佃户”明确社会角色；引语简洁有力。所有脚注标记均已置于正文相应位置。
