  rationale: 修订使中文叙事更自然，采用“继承人”这一简明而标准的术语，并将脚注b移至所说明的产业归属分句之后。保留“佃户”“产业”“来吧，我们杀了他”等忠实且合乎上下文的表达；未加入对比喻寓意或继承条件的解释。
