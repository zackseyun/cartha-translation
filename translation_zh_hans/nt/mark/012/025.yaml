id: MRK.12.25
reference: Mark 12:25
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὅταν γὰρ ἐκ νεκρῶν ἀναστῶσιν, οὔτε γαμοῦσιν οὔτε ⸀γαμίζονται, ἀλλ’ εἰσὶν ὡς ⸀ἄγγελοι ἐν τοῖς οὐρανοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/025.yaml
  text: For when they rise from the dead[a], they neither marry nor are given in marriage, but are like angels in heaven.
translation:
  language: zh_hans
  text: 因为他们从死人中复活时，既不娶，也不嫁，而是像天上的天使一样。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “天上”原文为复数，也可译作“诸天之中”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν γὰρ
  choice: 因为……时
  rationale: γάρ承接上文，说明耶稣论证的理由，因此译出“因为”；ὅταν引出复活发生之时，译作“……时”。
- source_word: ἐκ νεκρῶν ἀναστῶσιν
  choice: 他们从死人中复活
  rationale: ἀναστῶσιν为主动形式，译作“复活”而不改成被动；ἐκ νεκρῶν按复活语境译作自然且准确的“从死人中”。
- source_word: οὔτε γαμοῦσιν οὔτε γαμίζονται
  choice: 既不娶，也不嫁
  rationale: “既不……也不……”保留οὔτε…οὔτε的并列否定。“娶、嫁”以现代汉语的惯用对举表达主动成婚与被许配成婚的区别，避免生硬的“被嫁出去”。
- source_word: ἀλλ’ εἰσὶν
  choice: 而是
  rationale: ἀλλά在此形成明确对比；汉语用“而是”自然承接前面的双重否定。
- source_word: ὡς ἄγγελοι
  choice: 像……天使一样
  rationale: ὡς表示比较而非身份等同；此译法不暗示复活的人变成天使。
- source_word: ἐν τοῖς οὐρανοῖς
  choice: 天上的
  rationale: 按现代汉语习惯将处所短语自然地修饰“天使”；正文用单数概念“天上”，并以脚注说明希腊文为复数。
theological_decisions:
- issue: 复活的人与天使之间的关系
  choice: 复活的人像天使一样，不再娶嫁
  alternative: 复活的人变成天使
  rationale: 比较词ὡς只表达相似，并不表示本体或身份发生转换；译文保留比较关系。
- issue: 比较所涉及的范围
  choice: 按句法让“不娶、不嫁”成为上下文中明确的相似点
  alternative: 将复活的人与天使在所有方面等同
  rationale: 本句的直接对比集中于婚姻状态；译文不额外扩张比较范围，也不加入经文未明说的解释。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“既不娶，也不嫁”是汉语中清楚自然的对举，适合公众诵读；脚注标在所说明的“天上”相关分句之后。
