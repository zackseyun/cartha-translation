source:
  edition: SBLGNT
  text: καὶ τὸ ἀγαπᾶν αὐτὸν ἐξ ὅλης ⸀τῆς καρδίας καὶ ἐξ ὅλης τῆς ⸀συνέσεως καὶ ἐξ ὅλης τῆς ἰσχύος καὶ τὸ ἀγαπᾶν τὸν πλησίον ὡς ἑαυτὸν ⸀περισσότερόν ἐστιν πάντων τῶν ὁλοκαυτωμάτων καὶ θυσιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/033.yaml
  text: and to love him with all the heart and with all the understanding and with all the strength[a], and to love one’s neighbor as oneself, is more than all burnt offerings and sacrifices.
translation:
  language: zh_hans
  text: 并且尽心、尽智、尽力爱他，又爱邻人如同爱自己，这比一切燔祭[a]和祭物都更重要。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “燔祭”指完全在祭坛上焚烧献上的祭物。
    reason: 说明ὁλοκαύτωμα所指祭物完全焚烧献上的特征，避免将其不必要地限定为“整只祭牲”。
lexical_decisions:
- source_word: ἀγαπᾶν
  choice: 爱
  rationale: 以动词“爱”保留两个带冠词不定式的平行结构；中文借助“并且……又……”自然表达。
- source_word: αὐτόν
  choice: 他
  rationale: 保留希腊文代词形式，不在本节中明说“上帝”；所指对象可由上文确定。
- source_word: ἐξ ὅλης τῆς καρδίας
  choice: 尽心
  rationale: 自然表达全心投入和内在忠诚，同时保留“全部”的总括意义。
- source_word: συνέσεως
  choice: 智
  rationale: “尽智”在并列结构中简洁自然，指全部的理解、领悟和辨识能力，避免与一般性的“心思”完全等同。
- source_word: ἰσχύος
  choice: 力
  rationale: “尽力”清楚表达用上全部力量与能力，并与“尽心、尽智”形成自然排比。
- source_word: πλησίον
  choice: 邻人
  rationale: “邻人”保留其泛指意义，既不局限于实际住在附近的人，也不改成直接对读者说话。
- source_word: ὡς ἑαυτόν
  choice: 如同爱自己
  rationale: 按现代汉语补出比较中自然省略的“爱”，清楚表达“像爱自己一样”，而不改变泛指语气。
- source_word: περισσότερόν ἐστιν
  choice: 比……都更重要
  rationale: 明确保留比较级所表达的优越性；“更重要”在现代汉语中自然，也不额外断言祭祀制度已被废除。
- source_word: πάντων τῶν ὁλοκαυτωμάτων καὶ θυσιῶν
  choice: 一切燔祭和祭物
  rationale: “燔祭”是中文圣经及宗教语境中对全烧祭的明确称呼；“祭物”则保留较广义的祭献类别。
theological_decisions:
- issue: 爱之诫命与献祭敬拜的关系
  choice: 译文表明全心爱上帝并爱邻人比一切燔祭和祭物更重要。
  alternative: 将本节解释为彻底废除献祭，或弱化为爱与献祭同等重要。
  rationale: περισσότερόν ἐστιν 明确表示前者胜过后者，但本节本身没有明说献祭制度已被废除，因此保留这种神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“尽心、尽智、尽力”形成简洁排比；“邻人”保留经文伦理用语的广泛所指。脚注标记置于“燔祭”之后，与注释对象直接对应。
