base_translation:
  language: en
  yaml_path: translation/nt/mark/012/023.yaml
  text: In the resurrection[a], when they rise, whose wife will she be? For the seven had her as wife.
translation:
  language: zh_hans
  text: 在复活的时候[a]，他们起来时，她会是那七个人中谁的妻子呢？因为那七个人都曾以她为妻。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们再次起来的时候。”希腊原文直译为“他们起来的时候”；这里的上下文表明所指的是复活。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῇ ἀναστάσει
  choice: 在复活的时候
  rationale: ἀνάστασις在撒都该人所提出的末世性问题中指复活；用“复活”既符合现代汉语惯用表达，也不额外加入“从死人中”等原文此处未明说的成分。
- source_word: ὅταν ἀναστῶσιν
  choice: 他们起来以后
  rationale: ὅταν加不定过去时虚拟语气构成面向将来的时间从句。“起来”贴近原文，前面的“复活”已明确其语境；“以后”使汉语问句自然，并表达该动作发生后所问的状态。
- source_word: τίνος αὐτῶν
  choice: 他们中谁的
  rationale: 以“他们中谁的”自然表达疑问属格与部分属格的关系，清楚保留问题限定在七人之中。
- source_word: ἔσται γυνή
  choice: 她会是……妻子
  rationale: 谓语名词结构表达她届时与谁具有妻子的关系；汉语采用“会是……妻子”自然地保留未来指向。
- source_word: γυνή
  choice: 妻子
  rationale: 两处均处于婚姻关系的语境，因此应译为“妻子”，而不是较宽泛的“女人”。
- source_word: οἱ γὰρ ἑπτὰ
  choice: 因为那七个人
  rationale: γάρ说明提问的理由；“那七个人”承接上文已经提到的七兄弟，不必在本节补入“兄弟”。
- source_word: ἔσχον αὐτὴν γυναῖκα
  choice: 都曾以她为妻
  rationale: 保留ἔχω加宾语和补语所表达的婚姻关系状态；“曾”与“都”自然表明七个人过去均与她有过夫妻关系，又避免只突出结婚这一事件。
theological_decisions:
- issue: 与撒都该人争论中的复活用语
  choice: 复活……他们起来
  alternative: 从死人中复活……他们再次起来
  rationale: 译文承认问题所预设的未来复活，同时不加入本节希腊原文没有明说的“从死人中”或“再次”，从而保留原文简洁的表述。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“在复活的时候……他们起来以后”保留原文名词与动词的重复，而不为追求流畅将其中一项删去；“以她为妻”略带正式色彩，但准确表达婚姻关系，且普通读者容易理解。
