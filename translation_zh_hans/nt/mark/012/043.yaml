  naturalness: “耶稣叫门徒到身边来”及“我实在告诉你们”自然、庄重。修订后以“所投的”明确比较对象，并避免“银库钱柜”这一不自然的脚注用语。
  terminology: 将 γαζοφυλάκιον 译为“奉献箱”，并以脚注保留“圣殿库房／银库”及“器具或区域”的词义范围，较符合现代普通话和原词在本段的语境。
