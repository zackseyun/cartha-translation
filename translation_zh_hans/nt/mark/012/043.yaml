- from: 耶稣叫门徒到身边来，对他们说：“我实在告诉你们，这个穷寡妇投进银库[a]的，比所有其他人投的都多。”
  to: 耶稣叫门徒到身边来，对他们说：“我实在告诉你们，这个穷寡妇所投进奉献箱[a]的，比所有投进奉献箱的人所投的都多。”
  rationale: 修订以“奉献箱”取代容易误解的“银库”，并更新脚注以自然、准确地保留该词的器具与区域两种指涉可能。“所投的”使中文比较结构完整；删去“其他”则避免在正文中增加原文未明说的限定。
