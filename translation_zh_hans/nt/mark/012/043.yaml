  text: καὶ προσκαλεσάμενος τοὺς μαθητὰς αὐτοῦ ⸀εἶπεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν ὅτι ἡ χήρα αὕτη ἡ πτωχὴ πλεῖον πάντων ⸀ἔβαλεν τῶν βαλλόντων εἰς τὸ γαζοφυλάκιον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/043.yaml
  text: And calling his disciples to himself[a], he said to them, “Truly I say to you that this poor widow has put in more than all those who are putting into the treasury.”
translation:
  language: zh_hans
  text: 耶稣叫门徒到身边来，对他们说：“我实在告诉你们，这个穷寡妇所投进奉献箱[a]的，比所有投进奉献箱的人所投的都多。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “奉献箱”也可译作“圣殿库房”或“银库”。希腊词可指圣殿中收纳奉献的钱柜，也可指相关的库藏区域。
    reason: 说明 γαζοφυλάκιον 可指具体的收纳器具，或指圣殿中相关的库藏区域。
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: 叫……到身边来
  rationale: 表达不定过去时中间语态分词所呈现的动作：耶稣把门徒叫到自己身边，随后向他们说话；中文简洁自然。
- source_word: μαθητὰς
  choice: 门徒
  rationale: 这是新约语境中 μαθητής 的标准译法，保留跟随与受教的关系含义。
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: 我实在告诉你们
  rationale: 用现代中文清楚传达耶稣郑重断言的固定引言，同时避免把 Ἀμήν 音译后留给读者自行理解。
- source_word: χήρα
  choice: 寡妇
  rationale: 直接、标准地对应原词。
- source_word: πτωχὴ
  choice: 穷
  rationale: 准确表达贫穷之意，措辞朴素，不超出本节而强化为“赤贫”或“穷困潦倒”。
- source_word: πλεῖον πάντων
  choice: 比所有其他人……都多
  rationale: 清楚表达这位寡妇与其余奉献者之间的比较，同时保留“多”的开放含义，不在本节中解释其衡量标准。
- source_word: ἔβαλεν / τῶν βαλλόντων
  choice: 投进……的／其他人投的
  rationale: “投”符合把钱币投入收纳器具的场景；中文借前文补足宾语即可自然表达已完成之举与其他奉献者的行动。
- source_word: γαζοφυλάκιον
  choice: 银库
  rationale: 采用简洁而有传统辨识度的译法，指圣殿中收纳奉献的钱柜或相关区域；脚注说明具体所指。
theological_decisions:
- issue: 寡妇奉献“更多”的衡量方式
  choice: 正文保留“比所有其他人投的都多”这一比较，不明说是金额、比例或价值上的“更多”。
  alternative: 解释为她所献的绝对金额超过任何一个人，或直接意译为她的奉献在属灵价值上最大。
  rationale: 原文本身使用未加限定的比较表达；下一节才说明她在贫穷中献上一切。保留原文张力，避免在本节正文中预先解决其含义。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“叫门徒到身边来”自然呈现动作关系；“我实在告诉你们”保留郑重语气。脚注标记置于其实际解释的“银库”之后。
