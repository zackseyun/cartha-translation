id: MRK.12.1
reference: Mark 12:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ ἤρξατο αὐτοῖς ἐν παραβολαῖς ⸀λαλεῖν· Ἀμπελῶνα ⸂ἄνθρωπος ἐφύτευσεν⸃, καὶ περιέθηκεν φραγμὸν καὶ ὤρυξεν ὑπολήνιον καὶ ᾠκοδόμησεν πύργον, καὶ ἐξέδετο αὐτὸν γεωργοῖς, καὶ ἀπεδήμησεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/001.yaml
  text: 'And he began to speak to them in parables: “A man planted a vineyard[a], and put a fence around it, and dug a winepress pit, and built a tower, and leased it to tenant farmers[d][c][b], and went away.”'
translation:
  language: zh_hans
  text: 耶稣开始用比喻对他们说：“有一个人栽了一个葡萄园，在周围筑起篱笆[a]，挖了一个榨酒池[b]，建了一座守望楼，把葡萄园租给佃农[c]，就出远门去了。[d]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “篱笆”也可译作“围栏”或“树篱”；原词泛指环绕、防护的屏障。
    reason: lexical_alternative
  - marker: b
    text: 指榨酒设备下方承接葡萄汁的槽或池。也可译作“榨酒池的槽”。
    reason: lexical_alternative
  - marker: c
    text: “佃农”也可译作“承租的农夫”或“种葡萄的人”。这里指租用别人的葡萄园并负责耕作的人。
    reason: lexical_alternative
  - marker: d
    text: 这里的图景呼应《以赛亚书》5:1–2，其中也提到栽种葡萄园、围上篱笆、凿出榨酒池并建造守望楼。
    reason: cross_reference
lexical_decisions:
- source_word: ἤρξατο αὐτοῖς ἐν παραβολαῖς λαλεῖν
  choice: 就开始用比喻对他们说
  rationale: 保留起始体意义及说话对象；“用比喻”在现代汉语中比直译“在比喻中”自然。主语依上文明确为耶稣，中文补出姓名以避免代词指向不清。
- source_word: Ἀμπελῶνα ἄνθρωπος ἐφύτευσεν
  choice: 有一个人栽了一座葡萄园
  rationale: “有一个人”符合汉语故事开篇方式；“一座葡萄园”自然表达作为一片经营场所的葡萄园。
- source_word: περιέθηκεν φραγμόν
  choice: 在四周围上篱笆
  rationale: 表达设置环绕葡萄园的防护边界；φραγμός也可泛指围栏或树篱，故加脚注保留词义范围。
- source_word: ὤρυξεν ὑπολήνιον
  choice: 挖了一个榨酒池
  rationale: ὑπολήνιον特指榨酒设备下方承接汁液的槽池；正文采用普通读者易懂的“榨酒池”，脚注说明其具体构造。
- source_word: ᾠκοδόμησεν πύργον
  choice: 盖了一座守望楼
  rationale: 葡萄园中的πύργος用于看守和防护；“守望楼”较“塔”更自然地传达农业场景中的用途，但不作超出语境的细节扩展。
- source_word: ἐξέδετο αὐτὸν γεωργοῖς
  choice: 把葡萄园租给佃农
  rationale: ἐκδίδομαι表示出租；在租赁关系中，γεωργοί是耕种他人土地的农户，“佃农”准确保留园主与承租耕作者的关系。
- source_word: ἀπεδήμησεν
  choice: 出远门去了
  rationale: 该词表示离开本地前往外地一段时间；“出远门去了”是自然、庄重且符合叙事语体的汉语。
theological_decisions:
- issue: ἄνθρωπος的性别与身份表达
  choice: 有一个人
  alternative: 有一个园主
  rationale: 原文只称ἄνθρωπος，并未在该词中明说“园主”；叙事行为已显明其所有者身份，因此不把解释写入称谓。汉语“一个人”不强行突出性别，也未改变具体人物。
- issue: γεωργοῖς的社会经济关系
  choice: 佃农
  alternative: 农夫／种葡萄的人
  rationale: 上下文明确说葡萄园被出租，故“佃农”保留所有权与承租耕作之间的区别，这一关系对后续比喻发展重要，又不预先判定其象征所指。
- issue: 以赛亚书5章的互文
  choice: 在脚注指出呼应，不在正文中解释象征
  alternative: 在正文或脚注直接说明葡萄园象征以色列
  rationale: 种植、围护、榨酒池和守望楼共同明显呼应赛5:1–2；只提示互文可帮助读者，却保留本比喻自身逐步展开的神学张力，不提前锁定全部象征解释。
translation_notes:
  register: 采用现代、清楚而庄重的叙事汉语。动词依次排列，保留原文紧凑的筹备过程；使用“佃农”准确呈现租赁关系。所有脚注标记均置于相应正文内容之后，其中互文脚注放在整句末尾。
