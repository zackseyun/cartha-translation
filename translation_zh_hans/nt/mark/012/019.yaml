  text: Διδάσκαλε, Μωϋσῆς ἔγραψεν ἡμῖν ὅτι ἐάν τινος ἀδελφὸς ἀποθάνῃ καὶ καταλίπῃ γυναῖκα καὶ ⸂μὴ ἀφῇ τέκνον⸃, ἵνα λάβῃ ὁ ἀδελφὸς αὐτοῦ τὴν ⸀γυναῖκα καὶ ἐξαναστήσῃ σπέρμα τῷ ἀδελφῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/019.yaml
  text: Teacher[a], Moses wrote for us that if someone's brother dies and leaves behind a wife and leaves no child[c][b], his brother should take the wife and raise up offspring for his brother.
translation:
  language: zh_hans
  text: “老师，摩西为我们写下规定说[a]：‘如果一个人的兄弟死了，留下妻子，却没有留下孩子，他的兄弟就应娶那妻子，为死去的兄弟生养后代[b]。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 参申命记25:5。这里所引的是摩西律法中有关兄终弟及婚制的规定。
    reason: cross_reference
  - marker: b
    text: 直译“为他的兄弟兴起种子”；这是指借着这种婚姻为死去的兄弟延续后代。
    reason: lexical_alternative
lexical_decisions:
- source_word: Διδάσκαλε
  choice: 老师
  rationale: 这是对耶稣的呼语；“老师”是现代汉语中清楚、自然的称呼，也准确表达其教导者身份。
- source_word: ἔγραψεν ἡμῖν
  choice: 为我们写下规定
  rationale: “为我们”体现与格所表达的受益或关联意义；结合这里援引摩西律法的语境，补出“规定”可使现代读者自然理解，但不增加具体律法内容。
- source_word: ἐάν τινος ἀδελφὸς ἀποθάνῃ
  choice: 如果一个人的兄弟死了
  rationale: τινος是不定代词属格，译作“一个人的”自然且保持概括性；ἀδελφός明确保留为“兄弟”。
- source_word: καταλίπῃ γυναῖκα
  choice: 留下妻子
  rationale: καταλείπω在死亡语境中指死后留下；“妻子”准确反映此处婚姻关系中的γυνή。
- source_word: μὴ ἀφῇ τέκνον
  choice: 却没有留下孩子
  rationale: τέκνον为单数，但在否定结构中“没有留下孩子”可自然表达没有任何子女，同时保留原文措辞的概括性。
- source_word: ἵνα λάβῃ ὁ ἀδελφὸς αὐτοῦ τὴν γυναῖκα
  choice: 他的兄弟就应娶那妻子
  rationale: 在此法律婚姻语境中，λαμβάνω与γυνή连用表示娶妻；“娶那妻子”既清楚表达婚姻含义，也贴近原文的指称。
- source_word: ἐξαναστήσῃ σπέρμα τῷ ἀδελφῷ αὐτοῦ
  choice: 为死去的兄弟生养后代
  rationale: “兴起种子”是源于兄终弟及婚姻制度的习语；“生养后代”以自然现代汉语传达其意义。“死去的”由前文明确蕴含，在汉语中补出可避免两个“兄弟”所指混淆。
theological_decisions:
- issue: 如何表达兄终弟及婚姻律法中的习语
  choice: 译为“他的兄弟就应娶那妻子，为死去的兄弟生养后代”
  alternative: “他的兄弟就应把那女人娶来，为他的兄弟兴起种子”
  rationale: 正文清楚表达婚姻和延续后代的法律要求，同时以脚注保留“种子”这一字面意象，避免正文晦涩，也不进一步说明后代的法律身份。
- issue: 亲属与婚姻用语的性别信息
  choice: 保留“兄弟”和“妻子”
  alternative: 使用“手足”和“配偶”等中性称谓
  rationale: 原文明确使用ἀδελφός和γυνή，并且所引律法针对特定的男女婚姻情境；保留性别信息忠实于原文。
- issue: “为他的兄弟”所指对象
  choice: 译为“为死去的兄弟”
  alternative: 直译为“为他的兄弟”
  rationale: 上下文已确定受益者是先前死去的兄弟；汉语若连续使用“他的兄弟”容易产生指代混乱，补明“死去的”只显明原文已给出的关系，不增添新的神学判断。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“老师”通俗清楚；“为我们写下规定”体现援引律法的语境；“娶那妻子”和“生养后代”兼顾原文形式与现代可懂度。脚注标记按正文出现顺序设置，并分别说明交叉经文和原文习语。
