  text: ⸂ἔφη αὐτοῖς ὁ Ἰησοῦς⸃· Οὐ διὰ τοῦτο πλανᾶσθε μὴ εἰδότες τὰς γραφὰς μηδὲ τὴν δύναμιν τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/024.yaml
  text: 'Jesus said to them[a], “Is this not why you are mistaken: because you know neither the Scriptures nor the power of God?”'
translation:
  language: zh_hans
  text: 耶稣对他们说：“你们不正是因为既不明白圣经，也不知道神的能力而错了吗[a]？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“走入歧途”或“受了迷惑”。
    reason: 词义备选：πλανᾶσθε可指“犯错、走入歧途”或“受迷惑”；正文采用较中性、符合上下文的“错了”。
lexical_decisions:
- source_word: ἔφη αὐτοῖς ὁ Ἰησοῦς
  choice: 耶稣对他们说
  rationale: φημί在此引出直接引语，采用自然、中性的“说”，不额外加入“回答”等原文未明示的语气。
- source_word: Οὐ διὰ τοῦτο
  choice: 不正是因为
  rationale: οὐ引出的问句期待肯定回答，διὰ τοῦτο表达原因；“不正是因为”自然保留反问和因果关系。
- source_word: πλανᾶσθε
  choice: 你们错了
  rationale: πλανάω的中间／被动形式在此可指犯错、受迷惑或走入歧途；上下文着重撒都该人对复活的错误认识，“错了”简洁自然，同时不把被动受骗的含义强加给原文。
- source_word: μὴ εἰδότες
  choice: 因为既不明白……也不知道……
  rationale: 否定分词说明他们犯错的原因。汉语用明确的因果结构表达，并以“既不……也不……”对应两个并列宾语。
- source_word: τὰς γραφὰς
  choice: 圣经
  rationale: γραφή复数在犹太及早期基督教语境中指公认的神圣经卷；“圣经”是现代汉语中准确且通行的表达。
- source_word: μηδὲ τὴν δύναμιν τοῦ θεοῦ
  choice: 也不知道神的能力
  rationale: δύναμις直译为“能力”，τοῦ θεοῦ译为“神的”；避免用“大能”增添原文未明说的程度色彩。
theological_decisions:
- issue: πλανᾶσθε所描述的错误性质
  choice: 错了
  alternative: 受了迷惑／走入歧途
  rationale: 原词可涵盖认识上的错误、受迷惑或偏离正道。此处译文保留耶稣责备他们错误的核心意思，却不限定错误纯属理性误解，也不强化为外在欺骗或道德背离。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不正是因为……吗”保留原文期待肯定回答的反问语气；“明白圣经”与“知道神的能力”按汉语搭配分别措辞，同时仍受同一个否定原因结构统摄。
