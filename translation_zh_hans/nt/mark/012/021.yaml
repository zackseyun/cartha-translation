  text: καὶ ὁ δεύτερος ἔλαβεν αὐτήν, καὶ ἀπέθανεν ⸂μὴ καταλιπὼν⸃ σπέρμα, καὶ ὁ τρίτος ὡσαύτως·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/021.yaml
  text: And the second took her[a], and died, leaving no offspring, and the third likewise.
translation:
  language: zh_hans
  text: 第二个娶了她[a]，也死了，没有留下子嗣；第三个也是这样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“取了她”；这里指娶她为妻。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δεύτερος
  choice: 第二个
  rationale: 带冠词的序数词作名词用。上下文已说明所指是兄弟，因此正文不增添原句未明说的“兄弟”。
- source_word: ἔλαβεν αὐτήν
  choice: 娶了她
  rationale: λαμβάνω 基本义为“拿、领受”，但在此处接续娶寡嫂的婚姻语境中，指娶她为妻。现代汉语若直译“取了她”不自然且容易误解，故按语境译为“娶了她”。
- source_word: ἀπέθανεν
  choice: 也死了
  rationale: 直译为“死了”，并用“也”自然承接前一个兄弟同样的结局；不用委婉的“去世了”。
- source_word: μὴ καταλιπὼν
  choice: 没有留下
  rationale: 否定的简式过去分词表示他死时未留下后代；“没有留下”自然表达伴随情形及结果。
- source_word: σπέρμα
  choice: 后代
  rationale: 该词本义可指“种子”，在娶寡嫂以立后的语境中指子嗣。译作“后代”保留集合性，不把原文限定为单数的“孩子”。
- source_word: ὁ τρίτος ὡσαύτως
  choice: 第三个也是这样
  rationale: 保留原文简洁的省略结构，概括第三个经历了同样的事，不擅自重述各项动作。
