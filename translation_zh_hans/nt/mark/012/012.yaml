id: MRK.12.12
reference: Mark 12:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ ἐζήτουν αὐτὸν κρατῆσαι, καὶ ἐφοβήθησαν τὸν ὄχλον, ἔγνωσαν γὰρ ὅτι πρὸς αὐτοὺς τὴν παραβολὴν εἶπεν. καὶ ἀφέντες αὐτὸν ἀπῆλθον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/012.yaml
  text: And they were seeking to seize him[a], but they feared the crowd, for they knew that he had spoken the parable against them. So they left him and went away.
translation:
  language: zh_hans
  text: 他们一直想抓住他，却害怕人群，因为他们知道，他所说的这个比喻是针对他们的。[a]于是，他们撇下他，走了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“是指着他们说的”，或“是对他们说的”。
    reason: πρὸς αὐτούς在敌对语境中可理解为“针对他们”，也可较直译为“指着他们”或“对他们”。
lexical_decisions:
- source_word: ἐζήτουν
  choice: 一直想
  rationale: 未完成时表示持续的意图或尝试；“一直想”在现代汉语中自然保留其持续性，又不把行动明确解释为正式逮捕。
- source_word: κρατῆσαι
  choice: 抓住
  rationale: 保留κρατέω“抓住、拿住”的基本意义；上下文虽可理解为拘捕，但原文没有明说正式法律程序。
- source_word: ἐφοβήθησαν τὸν ὄχλον
  choice: 害怕人群
  rationale: 直接表达他们因人群而惧怕；“人群”自然清楚，也避免“群众”在现代语境中可能带有的政治色彩。
- source_word: ἔγνωσαν
  choice: 知道
  rationale: 直接对应其认知意义，并保留原文没有进一步说明他们是在何时或如何领悟的。
- source_word: πρὸς αὐτοὺς
  choice: 针对他们
  rationale: 结合敌对语境，表达比喻矛头所向；同时用脚注保留“指着他们／对他们”的较中性可能。
- source_word: τὴν παραβολὴν
  choice: 这个比喻
  rationale: 汉语用“这个”自然指回紧接在前面的比喻；其指称与希腊语定冠词在此处的功能相符。
- source_word: εἶπεν
  choice: 说
  rationale: 现代汉语无需借助过去完成形式即可从上下文表达该言说先于他们的认知。
- source_word: ἀφέντες αὐτὸν
  choice: 撇下他
  rationale: 表达他们不再对耶稣采取行动并把他留在那里；比“释放他”更少暗示他们已经实际拘押了他。
- source_word: ἀπῆλθον
  choice: 走了
  rationale: 简洁自然地表达离去，与前面的“撇下他”共同保留两个动作。
theological_decisions:
- issue: πρὸς αὐτούς所表达的比喻与宗教领袖之间的关系
  choice: 针对他们
  alternative: 指着他们说的／对他们说的
  rationale: 上下文支持比喻带有不利于他们的指向，但介词短语本身也可较中性地表示“关于、指向或对着”；正文呈现语境中的力度，脚注保留真实歧义。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“一直想”保留未完成时的持续意味；“抓住”避免过早解释成正式逮捕；结尾用“撇下他走了”简洁重现分词加限定动词的连续动作。
