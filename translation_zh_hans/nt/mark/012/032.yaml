  text: ⸀καὶ εἶπεν αὐτῷ ὁ γραμματεύς· Καλῶς, διδάσκαλε, ἐπ’ ἀληθείας εἶπες ὅτι εἷς ἐστιν καὶ οὐκ ἔστιν ἄλλος πλὴν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/032.yaml
  text: And the scribe said to him[a], “Well said, Teacher. You have spoken truly that he is one, and there is no other besides him.”
translation:
  language: zh_hans
  text: 那经学家对他说：“老师，你说得好；确实如此：他是独一的[a]，除他以外，再没有别的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 按上下文，也可明确译作“神是独一的”。希腊原文只说“他是独一的”，所指由上文补足。
    reason: 说明原文的省略表达及一种更明确的译法。
lexical_decisions:
- source_word: γραμματεύς
  choice: 经学家
  rationale: 指当时专门研习并讲解摩西律法的人；“经学家”在现代汉语中简洁自然，也比“文士”更直接传达其身份。
- source_word: Καλῶς
  choice: 你说得好
  rationale: 此处是对耶稣上一番回答的赞许；这一表达符合现代汉语对话习惯。
- source_word: διδάσκαλε
  choice: 老师
  rationale: 这是福音书中对教导者的常见称呼；“老师”现代、清楚，不额外加入“主上”等权威意味。
- source_word: ἐπ’ ἀληθείας
  choice: 也说得真实
  rationale: 该短语以副词方式肯定耶稣所说内容真实；保留“真实”可与前面的赞许相区分，而不只译为泛泛的“对”。
- source_word: εἶπες
  choice: 你……说
  rationale: 希腊语简单过去时在紧接前文的对话中用现代汉语“说”即可自然表达，无须机械标出时态。
- source_word: ὅτι
  choice: ：
  rationale: 这里引出耶稣所说的内容。现代汉语直接引述式的冒号比加入“就是说”更简洁自然，同时保留内容从属关系。
- source_word: εἷς ἐστιν
  choice: 他是独一的
  rationale: 原文没有在本节重说“神”，而由上文提供所指。“他”保留原文的省略，“独一的”表达数词 εἷς 在此处关于神唯一性的含义。
- source_word: ἄλλος
  choice: 别的
  rationale: 在存在句“再没有别的”中自然表达“另一个、别的”，并保留原文未明说名词的简略形式。
- source_word: πλὴν αὐτοῦ
  choice: 除他以外
  rationale: 准确表达带属格的排除、例外意义，现代汉语自然且明确。
theological_decisions:
- issue: εἷς ἐστιν 的隐含主语
  choice: 正文译作“他是独一的”，并以脚注说明所指为神。
  alternative: 正文明确译作“神是独一的”或“只有一位神”。
  rationale: 上下文清楚表明所指是神，但本节希腊文本没有重述 θεός。保留代词可忠实呈现原文的省略，不把上下文补足直接写入正文；脚注则帮助脱离上下文阅读的读者理解。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“经学家”兼顾历史身份与当代可懂度；句式保持口语对答的流畅。正文保留希腊文隐含主语造成的简约表达，并用脚注消除可能的指代障碍。
