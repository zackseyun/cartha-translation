  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: περὶ δὲ τῶν νεκρῶν ὅτι ἐγείρονται οὐκ ἀνέγνωτε ἐν τῇ βίβλῳ Μωϋσέως ἐπὶ τοῦ βάτου ⸀πῶς εἶπεν αὐτῷ ὁ θεὸς λέγων· Ἐγὼ ὁ θεὸς Ἀβραὰμ καὶ ⸂ὁ θεὸς Ἰσαὰκ καὶ ὁ⸃ θεὸς Ἰακώβ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/026.yaml
  text: And concerning the dead[a], that they are raised, have you not read in the book of Moses, in the passage about the bush, how God spoke to him, saying, ‘I am the God of Abraham and the God of Isaac and the God of Jacob’?”
translation:
  language: zh_hans
  text: 至于死人得以复活这件事，你们没有读过摩西书中有关荆棘丛的那段经文[a]吗？神怎样对摩西说：‘我是亚伯拉罕的神，以撒的神，雅各的神。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在荆棘丛那里。”希腊语也可借荆棘丛事件来标识这段经文。
    reason: 保留ἐπὶ τοῦ βάτου既可作地点表达、也可作经文段落标识的词义可能。
lexical_decisions:
- source_word: περὶ δὲ τῶν νεκρῶν
  choice: 至于死人
  rationale: περί加属格引出正在讨论的主题；δέ在此仅轻微推进话题，现代汉语用“至于”即可自然承接，不必强化为明显转折。
- source_word: ὅτι ἐγείρονται
  choice: 得以复活
  rationale: ἐγείρονται为现在时被动形式，在此指死人复活。汉语“得以复活”既自然，也避免把被动形式直接硬译成生涩的“被复活”，同时保留复活并非死者自主行动的意味。
- source_word: οὐκ ἀνέγνωτε
  choice: 你们没有读过……吗
  rationale: 以现代汉语常用的反问句表达耶稣诉诸听众所熟悉经文的语气。
- source_word: ἐν τῇ βίβλῳ Μωϋσέως
  choice: 摩西书中
  rationale: βίβλος可指书卷；“摩西书”在现代汉语中简明自然，指摩西著述而不必拘泥于古代载体形态。
- source_word: ἐπὶ τοῦ βάτου
  choice: 有关荆棘的那段经文
  rationale: 此表达可按当时引用经文的方式，以荆棘事件标识某段经文；正文采用这一语境上较清楚的理解，并用脚注保留地点式理解。
- source_word: πῶς εἶπεν αὐτῷ ὁ θεὸς λέγων
  choice: 神在那里怎样对摩西说
  rationale: πῶς引出所引用的话；汉语无需重复翻译εἶπεν与λέγων。“对摩西”明确代词αὐτῷ的指代，避免汉语歧义；“在那里”承接经文场景。
- source_word: Ἐγὼ ὁ θεὸς Ἀβραὰμ καὶ ὁ θεὸς Ἰσαὰκ καὶ ὁ θεὸς Ἰακώβ
  choice: 我是亚伯拉罕的神，以撒的神，雅各的神
  rationale: 保留三个“神”的重复结构及“我是”的现在式表达，因为该引文的措辞对上下文论证至关重要；省去后两项前的汉语连词，使引文庄重而自然，不削弱并列关系。
theological_decisions:
- issue: ὅτι ἐγείρονται的复活及被动意味
  choice: 死人得以复活
  alternative: 死人复活；死人被复活
  rationale: “得以复活”在自然汉语中保留希腊语被动形式所暗示的受动意味，却不额外明说施事者；因此既不抹去神使人复活的语义空间，也不把经文未明说的内容加入正文。
- issue: 神自我表述的时态与重复结构
  choice: 我是亚伯拉罕的神，以撒的神，雅各的神
  alternative: 我曾是亚伯拉罕、以撒、雅各的神
  rationale: 保留“我是”而不改成过去式，并逐一保留“神”，因为耶稣在此后的论证与引文本身的表述密切相关；译文不代替读者进一步解释其神学含义。
- issue: ἐπὶ τοῦ βάτου的经文标识与地点含义
  choice: 有关荆棘的那段经文
  alternative: 在荆棘那里
  rationale: 上下文中的“摩西书中”支持将其理解为用荆棘事件标识经文段落，但希腊语也容许较直接的地点式表达，因此将后者收入脚注，不消除原文的真实歧义。
translation_notes:
  register: 采用现代、庄重且易懂的普通话书面语。“摩西书”“有关荆棘的那段经文”帮助普通读者把握引用场景；引文保持简洁和重复力度。脚注标记[a]紧随其所说明的短语。
