source:
  edition: SBLGNT
  text: Καὶ προσελθὼν εἷς τῶν γραμματέων ἀκούσας αὐτῶν συζητούντων, ⸀ἰδὼν ὅτι καλῶς ⸂ἀπεκρίθη αὐτοῖς⸃, ἐπηρώτησεν αὐτόν· Ποία ἐστὶν ⸂ἐντολὴ πρώτη πάντων⸃;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/028.yaml
  text: And one of the scribes came up and heard them debating, and seeing that he had answered them well, he asked him, “Which commandment is the first of all?”
translation:
  language: zh_hans
  text: 有一个文士走上前来，听见他们辩论，又见耶稣回答得好，就问他：“所有诫命中，哪一条诫命是第一的？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“所有诫命中，哪一条居首位？”或“所有诫命中，哪一条最重要？”
    reason: 词义选择：πρώτη既可直译为“第一”，也可表示地位或重要性居首。
lexical_decisions:
- source_word: γραμματέων
  choice: 文士
  rationale: 在福音书的犹太背景中，γραμματεύς指熟悉并讲解律法的公认宗教法律人士；“文士”是简明、沿用已久且不过度解释其具体职分的译法。
- source_word: προσελθὼν
  choice: 走上前来
  rationale: 该分词表达向耶稣靠近的动作；“走上前来”自然地保留了这一动态。
- source_word: ἀκούσας αὐτῶν συζητούντων
  choice: 听见他们辩论
  rationale: συζητέω可指讨论、争辩或辩论；这里是围绕争议问题展开的公开交锋，“辩论”既体现分歧，又不必暗示敌意。
- source_word: ἰδὼν ὅτι καλῶς ἀπεκρίθη αὐτοῖς
  choice: 又见耶稣回答得好
  rationale: 直译其感知及评价；补出“耶稣”以避免现代汉语中连续代词造成指称不清，未增加原文以外的实质信息。
- source_word: ἐπηρώτησεν
  choice: 问
  rationale: ἐπερωτάω在此表示提出问题；“问”是最清楚自然的现代汉语表达。
- source_word: Ποία
  choice: 哪一条
  rationale: ποῖος在此要求从众诫命中作出辨识；配合量词“条”符合现代汉语询问诫命的习惯。
- source_word: ἐντολή
  choice: 诫命
  rationale: 在摩西律法语境中，“诫命”准确承接ἐντολή的命令性，并保留合宜的经文语体。
- source_word: πρώτη πάντων
  choice: 所有诫命中……第一的
  rationale: πρώτη既可表示次序上的第一，也可表示地位上的首要；正文保留“第一”，让上下文说明其优先性，并以脚注列出更明确的排序性译法。
theological_decisions:
- issue: 问题中πρώτη所表达的优先性
  choice: 译作“所有诫命中，哪一条是第一的”
  alternative: “所有诫命中，哪一条最首要／最重要”
  rationale: πρώτη本义为“第一”，在这里可以指地位或重要性居首。正文保留其较直接且略带开放性的表达，避免把语义范围静默限定为“最重要”；脚注说明自然的解释性译法。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“文士”“诫命”保留必要的圣经历史语汇；句法按汉语叙事习惯调整，并补明“耶稣”以消除代词歧义。
