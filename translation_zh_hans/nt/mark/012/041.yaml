  text: Καὶ ⸀καθίσας ⸀κατέναντι τοῦ γαζοφυλακίου ἐθεώρει πῶς ὁ ὄχλος βάλλει χαλκὸν εἰς τὸ γαζοφυλάκιον· καὶ πολλοὶ πλούσιοι ἔβαλλον πολλά·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/041.yaml
  text: And sitting opposite the treasury[a], he was watching how the crowd was putting money into the treasury; and many rich people were putting in much.
translation:
  language: zh_hans
  text: 他坐在银库[a]对面，看着众人怎样把钱币投入银库；许多富人投入了很多钱。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“奉献箱”或“银库箱”；希腊文可指圣殿的银库，也可指与银库相关、用来收纳奉献的容器。
    reason: 保留γαζοφυλάκιον所指地点与容器之间的词义空间。
lexical_decisions:
- source_word: καθίσας
  choice: 坐在
  rationale: 以自然的汉语交代主句动作发生时的姿态和位置；其先行动作无需生硬译作“坐下以后”。
- source_word: κατέναντι
  choice: 对面
  rationale: 准确表达正对着某处的位置关系，简洁自然。
- source_word: γαζοφυλάκιον
  choice: 银库
  rationale: 保留该词可指圣殿库房或与之相关收款设施的宽泛含义，不在正文中贸然限定为某一种容器。
- source_word: ἐθεώρει
  choice: 看着
  rationale: 未完成时表示持续观察；汉语“看着”在叙事中自然体现这一过程。
- source_word: πῶς
  choice: 怎样
  rationale: 保留对众人投钱方式或情形的关注，而不弱化为仅仅看见他们投钱这一事实。
- source_word: ὄχλος
  choice: 众人
  rationale: 符合叙事语体，表达聚集的人群，也比“群众”更适合圣经叙事。
- source_word: βάλλει / ἔβαλλον
  choice: 投入 / 投入了
  rationale: 在投放钱币的语境中，“投入”自然传达βάλλω的动作含义，同时避免“扔”可能带来的随意或轻蔑意味。
- source_word: χαλκόν
  choice: 钱币
  rationale: 该词本指铜或铜制币，在此作货币用；“钱币”明确其货币意义，又避免“铜钱”使现代汉语读者联想到中国古代方孔钱。
- source_word: πολλοὶ πλούσιοι
  choice: 许多财主
  rationale: “财主”简洁表达富有之人，符合庄重而通俗的叙事语体。
- source_word: πολλά
  choice: 很多钱
  rationale: 按货币语境将中性复数的数量意义自然表达为大额钱财，不把它误解为许多不同物件。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。正文保留“银库”的传统简洁表达，并用脚注说明其具体所指可能是收纳奉献的箱柜。分号呈现原文两个相连但有层次的观察内容。
