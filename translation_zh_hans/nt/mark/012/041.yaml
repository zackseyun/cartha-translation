  source_fidelity: 正文基本忠实反映原文：καθίσας的场景性分词、κατέναντι的位置、ἐθεώρει及两个未完成时所表达的持续观察／投放，以及πῶς“怎样”均得到保留。γαζοφυλάκιον译为“银库”并以脚注保留其可指圣殿库藏或相关奉献容器的范围，处理稳妥。
  naturalness: “他坐在银库对面，看着众人怎样把钱币投入银库”自然清楚。末句“许多财主都投入了很多钱”中的“都”容易把“许多富人”这一群体内的每一位都投入很多钱明示化；原文只陈述许多富人确实投入许多。因此删去“都”。“富人”较“财主”更符合现代标准汉语，且不引入传统地主阶层的联想。
  terminology: “银库”作为传统而简洁的圣殿语境译法可保留，脚注充分说明并未将词义限定为库房或箱柜之一。“钱币”适当地表达χαλκόν在此的货币意义，不必具体化为中国式“铜钱”。
