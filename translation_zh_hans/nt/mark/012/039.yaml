  text: 又喜欢会堂里的上座和宴席上的首位。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρωτοκαθεδρίας
  choice: 上座
  rationale: 指会堂中彰显身份和地位的首要座位。“上座”是现代汉语中自然、凝练且庄重的对应表达。
- source_word: συναγωγαῖς
  choice: 会堂
  rationale: 此处指犹太人的会堂，是准确且通行的译法。
- source_word: πρωτοκλισίας
  choice: 首位
  rationale: 指宴席中地位最尊贵的位置；“首位”保留了“第一、居首”的词义，也符合汉语宴席语境。
- source_word: δείπνοις
  choice: 宴席
  rationale: 上下文强调公开场合中的尊荣与地位，“宴席”比普通的“晚餐”更贴合此处的社会场景。
- source_word: καὶ ... καὶ
  choice: 又……和……
  rationale: 承接上一节列举的行为，并连接会堂与宴席两个并列场景；汉语中如此表达自然，同时保留累加效果。
- source_word: ἐν ταῖς συναγωγαῖς ... ἐν τοῖς δείπνοις
  choice: 会堂里的……宴席上的……
  rationale: 分别按现代汉语习惯表达地点和席间位置。
