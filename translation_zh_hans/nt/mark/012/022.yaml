  text: καὶ ⸂οἱ ἑπτὰ⸃ οὐκ ἀφῆκαν σπέρμα· ⸀ἔσχατον πάντων ⸂καὶ ἡ γυνὴ ἀπέθανεν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/022.yaml
  text: And the seven left no offspring. Last of all[a], the woman also died.
translation:
  language: zh_hans
  text: 那七个人都没有留下后代[a]。最后，那女人也死了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “后代”原文直译为“种子”，在这里指子嗣或后裔。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἑπτὰ
  choice: 那七个人
  rationale: 定冠词加数词在这里作名词用，回指上文所说的七兄弟。译作“那七个人”符合现代汉语，也不在本节重复补入原文未明说的“兄弟”。
- source_word: οὐκ ἀφῆκαν σπέρμα
  choice: 都没有留下后代
  rationale: σπέρμα字面意为“种子”，在这里指子嗣或后代。“留下后代”自然清楚；“都”结合“那七个人”准确表达七人无一留下后代。
- source_word: ἔσχατον πάντων
  choice: 最后
  rationale: 这是表示次序的惯用语，意思是“在所有人之后”或“最后”。简洁译作“最后”最符合现代汉语。
- source_word: καὶ ἡ γυνὴ
  choice: 那女人也
  rationale: 定冠词回指故事中已知的女人，καί在此有追加之意，译作“也”自然地表明她随后同样死去。
- source_word: ἀπέθανεν
  choice: 死了
  rationale: 该动词直接表示死亡；“死了”准确、清楚，不采用语气较委婉的表达。
theological_decisions: []
translation_notes:
  register: 采用自然、简明而庄重的现代标准普通话。“那七个人”保持对上文的回指；“后代”传达原文习语的实际含义，并用脚注保留其字面意象。
