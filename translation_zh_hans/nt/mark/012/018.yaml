  text: 撒都该人来到耶稣那里；他们说没有复活这回事，就开始问他：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σαδδουκαῖοι
  choice: 撒都该人
  rationale: 采用现代中文圣经读者熟悉的群体名称音译。
- source_word: ἀνάστασιν
  choice: 复活
  rationale: 在此指死人复活；上下文已足以确定所指，采用简明且通行的神学用语。
- source_word: ἐπηρώτων
  choice: 问
  rationale: 未完成时在叙事中可表示开始或持续发问；中文以“问……说”自然引出下文，不强行加入原文未明说的“开始”。
theological_decisions:
- issue: 撒都该人对复活的否认
  choice: 他们说没有复活这回事
  alternative: 他们说死人不会复活
  rationale: 保留原文较概括的“没有复活”，同时用“这回事”使现代中文自然；不提前把表述收窄为某一种复活观。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。分号呈现来者身份与其立场，末尾冒号承接下一节的直接引语。
