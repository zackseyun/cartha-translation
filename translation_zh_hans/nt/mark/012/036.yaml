  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ⸀αὐτὸς Δαυὶδ εἶπεν ἐν ⸂τῷ πνεύματι τῷ⸃ ἁγίῳ· ⸀Εἶπεν ⸀κύριος τῷ κυρίῳ μου· ⸀Κάθου ἐκ δεξιῶν μου ἕως ἂν θῶ τοὺς ἐχθρούς σου ⸀ὑποκάτω τῶν ποδῶν σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/036.yaml
  text: David himself said in the Holy Spirit[a], ‘The Lord said to my Lord[b], “Sit at my right hand until I put your enemies under your feet.”’
translation:
  language: zh_hans
  text: '大卫自己在圣灵里说过[a]：

    “主对我的主说[b]：

    ‘你坐在我的右边，

    直到我把你的仇敌放在你脚下。’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“藉着圣灵”。
    reason: alternative_reading
  - marker: b
    text: 这段引文出自《诗篇》110:1。希伯来文本中，第一个“主”代表神的名YHWH（传统上常译作“耶和华”），第二个“主”则指大卫的主。
    reason: cross_reference
lexical_decisions:
- source_word: αὐτὸς
  choice: 自己
  rationale: αὐτός在此为强调用法；“大卫自己”自然保留了对说话者身份的强调。
- source_word: ἐν τῷ πνεύματι τῷ ἁγίῳ
  choice: 在圣灵里
  rationale: 直译ἐν加与格，保留其可表达范围或媒介的含义，不在正文中把圣灵感动的具体方式限定得过窄。
- source_word: κύριος
  choice: 主
  rationale: “主”是κύριος在此庄重且通行的对应词；引文中两次使用同一希腊词，正文也保留重复。
- source_word: τῷ κυρίῳ μου
  choice: 对我的主
  rationale: “我的主”既符合现代汉语，也保留大卫称对方为主所形成的论证张力。
- source_word: Κάθου
  choice: 你坐
  rationale: 以简洁自然的命令句表达现在时中间语态命令式，并符合登基语境。
- source_word: ἐκ δεξιῶν μου
  choice: 在我的右边
  rationale: 这是该希腊习语在现代汉语中的自然表达，指尊荣和权柄的位置。
- source_word: ἕως ἂν θῶ
  choice: 直到我把
  rationale: “直到”保留ἕως ἄν所表达的将来界限；“把”与后面的处置结构构成自然汉语。
- source_word: ὑποκάτω τῶν ποδῶν σου
  choice: 放在你脚下
  rationale: 贴近马可所引希腊文“在你脚下”，不擅自补入诗篇希伯来文本中“脚凳”的完整措辞。
theological_decisions:
- issue: 大卫在圣灵中说话的表达
  choice: 大卫自己在圣灵里说过
  alternative: 大卫自己藉着圣灵说过
  rationale: 正文保留ἐν的直接表达，肯定圣灵参与大卫的话语，同时不把其作用方式限定为单一解释；另一种工具性理解列入脚注。
- issue: 诗篇110:1引文中两次“主”的所指
  choice: 主对我的主说
  alternative: 耶和华对我的主说
  rationale: 马可的希腊文两处均为κύριος，因此正文保留同词重复；希伯来诗篇首处为神名YHWH这一重要背景在脚注说明，避免把希伯来文本的区别直接覆盖到希腊正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“在圣灵里”稍具经文语体色彩，但能保留原文介词的开放性；诗歌式分行呈现引文，并用嵌套引号清楚区分耶稣的话、大卫的引述和其中神的发言。
