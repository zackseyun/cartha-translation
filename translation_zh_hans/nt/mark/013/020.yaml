source:
  edition: SBLGNT
  text: καὶ εἰ μὴ ⸂ἐκολόβωσεν κύριος⸃ τὰς ἡμέρας, οὐκ ἂν ἐσώθη πᾶσα σάρξ. ἀλλὰ διὰ τοὺς ἐκλεκτοὺς οὓς ἐξελέξατο ἐκολόβωσεν τὰς ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/020.yaml
  text: And if the Lord had not cut short the days[a], no flesh would have been saved. But for the sake of the elect, whom he chose, he cut short the days.
translation:
  language: zh_hans
  text: 若不是主缩短了那些日子，没有一个人能得救[a]。但为了他所拣选的选民，他缩短了那些日子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“没有一个有血肉的”。这是指人的习语；这里“得救”在上下文中主要指性命得以保全。
    reason: 说明πᾶσα σάρξ的习语含义，并交代σῴζω在本节语境中的直接所指。
lexical_decisions:
- source_word: ἐκολόβωσεν
  choice: 缩短了
  rationale: κολοβόω表示使某段时间缩短或截短；“缩短了”在现代汉语中自然准确，并在两处保持同一译法。
- source_word: κύριος
  choice: 主
  rationale: 此处虽无冠词，κύριος在语境中仍指特定的“主”；汉语无需另加定冠表达。
- source_word: τὰς ἡμέρας
  choice: 那些日子
  rationale: 指上文所说患难的那段日子；“那些日子”既保留复数形式，也清楚承接前文。
- source_word: οὐκ ἂν ἐσώθη
  choice: 就没有一个能得救
  rationale: ἄν与过去时态构成非现实条件的结果；“能得救”保留σῴζω的基本用语，同时上下文表明这里首先涉及性命得以保全。
- source_word: πᾶσα σάρξ
  choice: 凡有血肉的，就没有一个
  rationale: 在否定句中，πᾶσα σάρξ意为“没有任何有血肉者”。译文保留“血肉”这一庄重的圣经意象，并以“没有一个”使现代读者清楚理解其范围。
- source_word: διὰ τοὺς ἐκλεκτούς
  choice: 为了选民
  rationale: διά加宾格在这里表达缘故或受益对象；“为了”简明表达这些日子是为他们的缘故而缩短。
- source_word: ἐκλεκτούς
  choice: 选民
  rationale: “选民”是ἐκλεκτός在此类圣经语境中的简洁通行译法；不进一步界定拣选是群体性的还是个体性的。
- source_word: οὓς ἐξελέξατο
  choice: 就是他所拣选的人
  rationale: 如实保留关系从句及ἐκλέγομαι“拣选”的含义；“就是”使汉语同位说明自然，并保留原文“选民／拣选”的词根呼应。
theological_decisions:
- issue: “得救”在本节中的含义
  choice: 正文保留“得救”，让上下文首先指向灾难中性命蒙保全。
  alternative: 直接译作“存活”或“保住性命”。
  rationale: 上下文谈到灾难的日子若不缩短，人人都会丧命，因此眼前意义是身体和性命得以保全；不过σῴζω本身是“拯救、使得救”，正文不宜过度缩窄其表达。
- issue: “选民”的所指和拣选的性质
  choice: 保留“选民”和“他所拣选的人”，不解释其范围或拣选方式。
  alternative: 明确译成具有群体意义或个体预定意义的“蒙拣选者”。
  rationale: 本节确认这些人是主所拣选的，却没有在这里说明更广泛的拣选教义；译文应保留这种神学张力。
- issue: 缩短日子的施事者
  choice: 两处都让“主／他”作主语。
  alternative: 将第二处明确扩译为“主缩短了”。
  rationale: 原文第二处省略明说的名词主语，以第三人称动词承接“主”；汉语用“他”既衔接自然，也不增添原文没有的重复。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“凡有血肉的，就没有一个”保留原文意象，同时避免生硬的“没有任何肉体”；“选民，就是他所拣选的人”保留原文的词义呼应和神学开放性。
