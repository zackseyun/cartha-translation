  text: οὕτως καὶ ὑμεῖς, ὅταν ⸂ἴδητε ταῦτα⸃ γινόμενα, γινώσκετε ὅτι ἐγγύς ἐστιν ἐπὶ θύραις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/029.yaml
  text: So also you[a], when you see these things happening, know that it is near, at the doors.
translation:
  language: zh_hans
  text: 同样，你们看见这些事发生时，也要知道：近在门口了[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊原文没有明确说出“临近”的主语；或译“他已近在门口了”。
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: 同样，你们
  rationale: “同样”承接前文无花果树的比喻，并把门徒与比喻中的观察者对应起来；现代汉语无需机械重复“也”，仍能自然表达 οὕτως καὶ 的衔接和强调。
- source_word: ὅταν ἴδητε
  choice: 你们看见……时
  rationale: ὅταν 加不定过去时虚拟语气在这里表示将来的条件情形，译作“……时”比“每当”更符合这段预告的语境。
- source_word: ταῦτα γινόμενα
  choice: 这些事发生
  rationale: 保留 ταῦτα 的复数含义；“发生”自然表达 γινόμενα 所指事情的出现或成就，不额外限定这些事的性质。
- source_word: γινώσκετε
  choice: 就要知道
  rationale: 现在时命令语气要求门徒根据所见作出判断；“要知道”既保留命令意味，也符合现代汉语表达。
- source_word: ὅτι ἐγγύς ἐστιν
  choice: 那已经临近了
  rationale: 希腊文没有明说 ἐστιν 的主语。“那”以较宽泛的方式指向征兆所显示的临近之事，避免在正文中擅自确定为某件事、神的国或人子；“已经……了”自然传达当前临近的状态。
- source_word: ἐπὶ θύραις
  choice: 就在门口
  rationale: 这是表示极其接近的惯用语。希腊文 θύραις 虽为复数，但现代汉语惯用“在门口”，若译成复数反而生硬；“就”加强迫近之意。
theological_decisions:
- issue: ἐστιν（“临近”）的隐含主语
  choice: 正文用较宽泛的“那已经临近了”
  alternative: “他已经临近了”
  rationale: 原文未明确说出主语。正文不把所指强行限定为人子或其他特定对象，同时用脚注保留可理解为“他”的个人性读法，以保存原文的歧义和神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“同样”清楚承接前文比喻；冒号标示“知道”的内容。“就在门口”保留原文迫近的形象，同时符合自然汉语习惯。
