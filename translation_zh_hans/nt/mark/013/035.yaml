  text: γρηγορεῖτε οὖν, οὐκ οἴδατε γὰρ πότε ὁ κύριος τῆς οἰκίας ἔρχεται, ⸀ἢ ὀψὲ ἢ ⸀μεσονύκτιον ἢ ἀλεκτοροφωνίας ἢ πρωΐ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/035.yaml
  text: 'Therefore stay awake[a], for you do not know when the master of the house is coming: whether in the evening, or at midnight, or at cockcrow[b], or in the morning.'
translation:
  language: zh_hans
  text: 所以，你们要警醒[a]，因为你们不知道家主什么时候来：或在晚上，或在半夜，或在鸡叫时[b]，或在清晨。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“要守望”。这个命令含有持续保持清醒和警觉的意思。
    reason: lexical_alternative
  - marker: b
    text: “鸡叫时”指以公鸡啼叫为标志的夜间一更。
    reason: cultural_note
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: 要警醒
  rationale: 该命令要求人持续保持清醒、警觉。“警醒”在现代中文中自然而庄重，也兼有不睡着和谨慎守望的含义。
- source_word: οὖν
  choice: 所以
  rationale: 表明本句是根据上文所得出的劝告；“所以”清楚而自然地保留这一逻辑联系。
- source_word: οὐκ οἴδατε
  choice: 你们不知道
  rationale: 直接表达否定的“知道”，不加入原文没有的确定性修饰。
- source_word: πότε
  choice: 什么时候
  rationale: 自然表达间接问句中的时间含义。
- source_word: ὁ κύριος τῆς οἰκίας
  choice: 家主
  rationale: 原文指一家的主人或掌权者。“家主”简洁地保留家庭场景和权柄含义，又不把比喻中的普通称谓直接处理为神圣称号。
- source_word: ἔρχεται
  choice: 来
  rationale: 现在时在语境中指预期的到来；中文“什么时候来”自然地表达这一将来指向。
- source_word: ὀψὲ
  choice: 晚上
  rationale: 在连续列举夜间时段的语境中，指夜晚的第一个更次；译作“晚上”清楚易懂。
- source_word: μεσονύκτιον
  choice: 半夜
  rationale: 准确、自然地表达午夜时段，并与整组夜间时段的口吻协调。
- source_word: ἀλεκτοροφωνίας
  choice: 鸡叫时
  rationale: 指以公鸡啼叫为标志的夜间时段。“鸡叫时”比专门术语更易懂，同时保留原文的时间标记。
- source_word: πρωΐ
  choice: 清晨
  rationale: 指夜晚最后一更进入早晨的时段；“清晨”比笼统的“早上”更贴合此处。
theological_decisions:
- issue: κύριος在家庭比喻中既直接指家中主人，也可能间接影射耶稣
  choice: 家主
  alternative: 主／房主／一家之主
  rationale: 句内直接语境是家庭场景，因此采用普通身份称谓“家主”，保留其管理权柄；这并不排除比喻在更大语境中对耶稣再来的指向，也不把这一间接含义强行明说。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“所以”承接上文；四个时间表达按夜间次序排列。主句用“要警醒”传达持续警觉的命令，脚注保留“守望”这一词义选择。
