  text: καὶ ὁ εἰς τὸν ⸀ἀγρὸν μὴ ἐπιστρεψάτω εἰς τὰ ὀπίσω ἆραι τὸ ἱμάτιον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/016.yaml
  text: And the one in the field must not turn back to get his cloak[a].
translation:
  language: zh_hans
  text: 在田里的人，不要转身回去拿他的外衣[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“外袍”。
    reason: 词语ἱμάτιον可泛指外衣，也可按当时衣着语境译作“外袍”；脚注保留这一较具体的词汇选择。
lexical_decisions:
- source_word: ὁ εἰς τὸν ἀγρόν
  choice: 在田里的人
  rationale: 该带冠词结构作名词使用，指身处田里的人；译文保留单数、泛指的表达，又符合现代汉语习惯。
- source_word: ἀγρός
  choice: 田里
  rationale: 本词在这里指田地或农田；“田里”直接、自然，也适合紧急逃离的语境。
- source_word: μὴ ἐπιστρεψάτω εἰς τὰ ὀπίσω
  choice: 不要转身回去
  rationale: μή加不定过去时命令式构成禁令，εἰς τὰ ὀπίσω强化向后返回之意；“不要转身回去”清楚传达紧迫的禁止语气。
- source_word: ἆραι
  choice: 拿
  rationale: 该不定式表示回去的目的，即取走那件衣物；“拿”在现代汉语中简洁自然，不额外限定衣物当时是放下、遗留还是另有存放。
- source_word: ἱμάτιον
  choice: 外衣
  rationale: 本词通常指穿在外面的衣物；“外衣”准确而通俗，同时避免把具体式样限定得过窄。
- source_word: αὐτοῦ
  choice: 他的
  rationale: 原文为阳性单数代词，与前面的单数阳性泛指结构呼应；“他的”保留这一语法形式，同时上下文仍可作代表性泛指理解。
theological_decisions:
- issue: 阳性单数的泛指表达
  choice: 保留“在田里的人……他的外衣”这一单数阳性形式
  alternative: 改为复数“在田里的人不要回去拿他们的外衣”，或省略所属关系
  rationale: 原文使用单数阳性名词化结构和相应的阳性单数代词。译文保留其形式与代表性泛指力量，不把所指不必要地限定为只有男性，也不将其复数化。
translation_notes:
  register: 采用自然、简洁而庄重的现代标准汉语。“转身回去”保留原文动作方向的强调；逗号使警告句的节奏清楚。脚注标记已在正文中以[a]出现。
