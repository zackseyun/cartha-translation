  text: καὶ τότε ἀποστελεῖ τοὺς ⸀ἀγγέλους καὶ ἐπισυνάξει τοὺς ⸀ἐκλεκτοὺς ἐκ τῶν τεσσάρων ἀνέμων ἀπ’ ἄκρου γῆς ἕως ἄκρου οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/027.yaml
  text: And then he will send out the angels and gather the chosen ones from the four winds[c][b][a], from the end of the earth to the end of heaven.
translation:
  language: zh_hans
  text: 那时，他要差遣天使，把蒙拣选的人[a]从四方[b]、从地极直到天的尽头[c]聚集起来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“选民”。原文是形容词作名词用，意思是“蒙拣选的人”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“从四风”，是指从各个方向。
    reason: cultural_note
  - marker: c
    text: 原文也可较直译为“从地的尽头直到天的尽头”；有些译本按整体意思译作“从天这边直到天那边”。
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: 那时
  rationale: 表示末世讲论中事件的时间与次序；“那时”在现代汉语中自然，也与上文所述情景衔接。
- source_word: ἀποστελεῖ
  choice: 要差遣
  rationale: 将来时动词在此表示派出承担任务的使者；“差遣”比单纯的“派”更庄重，并保留受命而出的意味。
- source_word: ἀγγέλους
  choice: 天使
  rationale: 在末世性语境中指超自然的使者，而非一般人间信使。
- source_word: ἐπισυνάξει
  choice: 都聚集起来
  rationale: 表达从各处召聚到一起；句末的“起来”符合现代汉语表达，“都”照应其范围之广，并未增加被聚集者的身份限定。
- source_word: ἐκλεκτούς
  choice: 蒙拣选的人
  rationale: 该形容词作名词使用，指被拣选的人；“蒙拣选的人”保留被动含义和神学分量，又避免把它直接处理成某一后期教义体系的专门术语。
- source_word: ἐκ τῶν τεσσάρων ἀνέμων
  choice: 从四方
  rationale: 原文直译为“从四风”，是表示各个方向的惯用意象；正文采用汉语自然的“四方”，脚注保留原文图像。
- source_word: ἀπ’ ἄκρου γῆς ἕως ἄκρου οὐρανοῦ
  choice: 从地极直到天边
  rationale: 保留“地”与“天”两端相接、涵盖全部范围的表达；“地极”“天边”比“地的尽头”“天的尽头”更自然凝练，同时不把本句改写成另一种传统表述。
- source_word: καὶ τότε ... καὶ
  choice: 那时……把……都……
  rationale: 汉语不必机械重复连接词；通过时间状语和兼具目的结果关系的句式，自然呈现两个相连的行动：差遣天使并聚集蒙拣选的人。
theological_decisions:
- issue: ἐκλεκτούς在末世语境中的译法
  choice: 蒙拣选的人
  alternative: 选民；被选中的人
  rationale: 正文清楚表达这些人是被拣选的，却不补入原文没有明说的“他的”，也不借译词裁定有关拣选的后期系统神学争论。
- issue: 聚集范围的宇宙性意象
  choice: 从四方，从地极直到天边
  alternative: 从四风，从地的尽头直到天的尽头；从天这边直到天那边
  rationale: 原文将“四风”的方向性惯用语与“地极—天边”的全域表达并置。正文尽量保留这种张力，不将其完全抹平为“世界各地”，也不改成原文并未直接采用的传统释义。
- issue: οὐρανός的空间含义
  choice: 天边
  alternative: 天的尽头；天空的尽头
  rationale: 此处主要构成空间范围的极端表达，并不要求把οὐρανός解释为神居住之“天堂”；“天边”保留空间意象而避免不必要的教义化。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“差遣”“蒙拣选”“地极”保留经文语体的庄重感，但句法按现代汉语调整。正文不添加原文没有的领属词“他的”；脚注分别说明传统术语、四风意象及末尾短语的其他译法。
