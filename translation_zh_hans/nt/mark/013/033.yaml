  yaml_path: translation/nt/mark/013/033.yaml
  text: Be on guard; stay awake[a], for you do not know when the time is.
translation:
  language: zh_hans
  text: 你们要当心，要警醒，因为你们不知道那时刻[a]何时来到。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“那指定的时候”或“那时机”。希腊语καιρός常指关键的或指定的时刻。
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπετε
  choice: 你们要当心
  rationale: 该复数命令式在此是警告人保持警觉，并非单指用眼观看；“要当心”自然传达警戒之意，也与下一命令有所区分。
- source_word: ἀγρυπνεῖτε
  choice: 要警醒
  rationale: 该词可指保持清醒或保持警觉；“警醒”既保留不睡的隐喻，也符合末世劝诫的语境。
- source_word: οὐκ οἴδατε
  choice: 你们不知道
  rationale: 直接表达否定的认知状态，不添加“确切”等原文没有的限定。
- source_word: γὰρ
  choice: 因为
  rationale: 引出前面两个命令的理由，现代汉语用“因为”衔接清楚自然。
- source_word: πότε
  choice: 何时
  rationale: 直接对应询问时间的副词，在此与“不知道”搭配自然。
- source_word: ὁ καιρός
  choice: 那时候
  rationale: καιρός在此指语境中所关注的关键时刻；“那时候”保留其特指性及一定的开放性，避免直接增添“指定”的解释。
- source_word: ἐστιν
  choice: 来到
  rationale: 希腊文直译为“是”，但汉语说“那时候何时是”不自然；结合时间临到的语义，以“何时来到”自然呈现句意，未明确所指事件。
theological_decisions:
- issue: 末世语境中καιρός的含义
  choice: 那时候
  alternative: 那指定的时候；那时机
  rationale: 该词可暗示决定性或预定的时刻，但原文没有在词面上明确说“指定”。正文保持较宽的表达，脚注列出较明确的可能含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“当心”和“警醒”并列，以保留两个命令各自的重点；用“来到”避免生硬的系词直译。
