  text: ὁ οὐρανὸς καὶ ἡ γῆ ⸀παρελεύσονται, οἱ δὲ λόγοι μου οὐ ⸀μὴ ⸁παρελεύσονται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/031.yaml
  text: Heaven and earth will pass away[a], but my words will certainly not pass away.
translation:
  language: zh_hans
  text: 天和地都要过去，但我的话绝不会过去。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“永远不会过去”或较传统的“断不会过去”。希腊文使用了强调否定。
    reason: 说明强调否定的语气及可行译法。
lexical_decisions:
- source_word: ὁ οὐρανὸς καὶ ἡ γῆ
  choice: 天和地
  rationale: 这是表示整个受造世界的固定搭配；“天和地”自然、庄重，也保留原文的宇宙性范围。
- source_word: παρελεύσονται
  choice: 都要过去
  rationale: παρέρχομαι在此指消逝、终结；译作“过去”既贴近原文，又避免具体说明其消逝方式。加入“都”使并列主语在现代汉语中更顺畅，不改变语义。
- source_word: οἱ λόγοι μου
  choice: 我的话
  rationale: λόγοι指耶稣所说的话或宣告；“我的话”直接、自然，并保留复数集合意义。
- source_word: οὐ μὴ παρελεύσονται
  choice: 绝不会过去
  rationale: οὐ μή加将来时构成强烈否定；“绝不会”在现代汉语中清楚传达强调语气。
theological_decisions:
- issue: 耶稣的话不会过去这一否定的强调力度
  choice: 译为“绝不会过去”
  alternative: “永远不会过去”或“断不会过去”
  rationale: 原文以强调否定，将天地的消逝与耶稣话语的恒久形成鲜明对比。“绝不会”充分表达其确定性，又不额外加入原文未明说的时间措辞。
translation_notes:
  register: 采用现代标准普通话，措辞简洁、庄重。“过去”保留末世语境中的含蓄性；“绝不会”自然传达希腊文的强烈否定。
