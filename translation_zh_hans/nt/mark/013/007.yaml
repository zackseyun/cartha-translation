  text: ὅταν δὲ ⸀ἀκούσητε πολέμους καὶ ἀκοὰς πολέμων, μὴ θροεῖσθε· ⸀δεῖ γενέσθαι, ἀλλ’ οὔπω τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/007.yaml
  text: And when you hear of wars and reports of wars[a], do not be alarmed; these things must happen, but the end is not yet.
translation:
  language: zh_hans
  text: 你们听见战争和战争的消息[a]时，不要惊慌；这些事必然会发生，但终局还没有到。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“战争的传闻”。希腊语可指人们听到的消息、报道或传闻。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν δὲ
  choice: ……时
  rationale: ὅταν引出将来情境中的时间从句；δέ是轻微的衔接词。现代汉语可借上下文自然承接，不必硬译为“但”或“而”。
- source_word: ἀκούσητε
  choice: 听见
  rationale: 在ὅταν所引出的从句中，这一不定过去时虚拟语气表示将来可能出现的情形；汉语用“听见”自然表达。
- source_word: πολέμους
  choice: 战争
  rationale: 直接、常用地表达πόλεμος的复数；汉语“战争”本身无须显明复数。
- source_word: ἀκοὰς πολέμων
  choice: 战争的消息
  rationale: ἀκοή在这里可指所听见的消息、报道或传闻。“消息”范围较宽，不预设内容是否可靠；脚注保留“传闻”这一可能译法。
- source_word: μὴ θροεῖσθε
  choice: 不要惊慌
  rationale: θροέομαι表示因局势而受惊、慌乱。“不要惊慌”简洁自然，也保留禁止陷入恐慌的力度。
- source_word: δεῖ γενέσθαι
  choice: 这些事必然会发生
  rationale: δεῖ表达必要性，γενέσθαι意为发生。根据语境补出“这些事”，同时不说明这种必要性的具体机制。
- source_word: ἀλλ’ οὔπω τὸ τέλος
  choice: 但终局还没有到
  rationale: τέλος在此指所期待的末后终点。“终局”比日常的“结束”更能表达末世语境，同时避免加入具体末世体系；“还没有到”符合现代汉语表达。
theological_decisions:
- issue: δεῖ γενέσθαι所表达的末世必要性
  choice: 这些事必然会发生
  alternative: 这些事必须发生
  rationale: “必然会发生”保留δεῖ的必要性和预告语气，却不进一步界定其神学机制或引入特定末世论体系。
- issue: τὸ τέλος的所指
  choice: 终局
  alternative: 结局；末期
  rationale: 定冠词与上下文表明这是特指的末后终点。“终局”保留末世含义，但不把它具体化为某一套时间表。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“惊慌”传达受扰和恐慌；“终局”保留末世语境的分量。脚注标记[a]已置于正文相应词语之后。
