source:
  edition: SBLGNT
  text: ἐγερθήσεται γὰρ ἔθνος ἐπ’ ἔθνος καὶ βασιλεία ἐπὶ βασιλείαν, ⸀ἔσονται σεισμοὶ κατὰ τόπους, ⸁ἔσονται ⸀λιμοί· ⸀ἀρχὴ ὠδίνων ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/008.yaml
  text: For nation will rise against nation[a], and kingdom against kingdom. There will be earthquakes in various places; there will be famines. These are the beginning of birth pains.
translation:
  language: zh_hans
  text: 因为民要起来攻打民，国要起来攻打国；多处将有地震，也将有饥荒。这些事是分娩阵痛的开始[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “分娩阵痛”也可译作“生产之痛”或“产痛”。希腊语以分娩时的疼痛作比喻，指随后之事发生以前所经历的苦难。
    reason: 说明ὠδίνων的词义范围和分娩隐喻，避免读者将其理解为一般疼痛。
lexical_decisions:
- source_word: ἐγερθήσεται
  choice: 要起来攻打
  rationale: 该动词在“民对民”的结构中表示群体兴起敌对或开战；“起来攻打”在现代汉语中自然表达冲突含义，不机械保留希腊语的被动形式。
- source_word: ἔθνος ... ἐπ’ ἔθνος
  choice: 民要起来攻打民
  rationale: ἔθνος可指民族、人民或邦国；这里与“国攻打国”平行。“民攻打民”保留用词层次和传统而清楚的对偶，也不把它限定为现代民族国家。
- source_word: βασιλεία ... ἐπὶ βασιλείαν
  choice: 国要起来攻打国
  rationale: 此处指政治疆域或王国。“国攻打国”准确保留与前句的平行，并比重复使用“王国”更符合自然现代汉语。
- source_word: σεισμοὶ κατὰ τόπους
  choice: 各处将有地震
  rationale: κατὰ τόπους具有分布于不同地点的意思；“各处”简洁保留这种分布性，σεισμοί则直接译为“地震”。
- source_word: λιμοί
  choice: 饥荒
  rationale: λιμός表示由粮食匮乏造成的饥荒，而不只是个人饥饿；汉语集合名词“饥荒”在此无需强行标示复数。
- source_word: ἀρχὴ
  choice: 开始
  rationale: 这里说明上述事件只是后续过程的起头；“开始”自然准确，不额外说明其持续时间或阶段安排。
- source_word: ὠδίνων
  choice: 产痛
  rationale: ὠδίν指分娩时的疼痛，并在此作为苦难的隐喻。“产痛”简洁、现代，保留分娩意象而没有把它泛化为普通灾难。
- source_word: ταῦτα
  choice: 这些事
  rationale: 指代前述战争、地震和饥荒等多项事件；“这些事”符合现代汉语，也清楚呈现复数所指。
theological_decisions:
- issue: ἀρχὴ ὠδίνων中的末世性分娩隐喻
  choice: 这些事是产痛的开始
  alternative: 这些不过是灾难的开端；这些是特指某套末世阶段次序的生产阵痛
  rationale: 译文保留痛苦如分娩阵痛、并且尚属开始的张力，却不把该隐喻淡化成一般灾难，也不加入经文本身未明确规定的末世时间体系。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“民要起来攻打民，国要起来攻打国”保留原文紧凑的平行结构；两个“将有”对应原文重复的ἔσονται。脚注标记置于其实际解释的“产痛的开始”之后。
