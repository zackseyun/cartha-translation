  text: ἀμὴν λέγω ὑμῖν ὅτι οὐ μὴ παρέλθῃ ἡ γενεὰ αὕτη μέχρις οὗ ⸂ταῦτα πάντα⸃ γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/030.yaml
  text: Truly I say to you that this generation will certainly not pass away until all these things happen[a][b].
translation:
  language: zh_hans
  text: 我实在告诉你们：这一代人[a]绝不会过去[b]，直到这一切全都发生。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“这族人”或“这个民族”；希腊语 γενεά 可以有较宽泛的含义，不过这里译作“这一代人”最自然。
    reason: lexical_alternative
  - marker: b
    text: “绝不会过去”所对应的希腊语用了强烈的否定句式，强调这一代人在这一切全都发生以前绝不会过去。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: 实在
  rationale: 在共观福音中用于引出庄严而权威的宣告；“实在”既自然，又保留其郑重语气。
- source_word: λέγω ὑμῖν
  choice: 我告诉你们
  rationale: 符合现代汉语直接告知的表达，也准确保留复数受话者。
- source_word: οὐ μὴ παρέλθῃ
  choice: 还没有过去……都必定发生
  rationale: 以“还没有……都必定……”的先时结构传达“直到……以前绝不会过去”，并用“必定”体现 οὐ μή 的强烈否定语气。
- source_word: ἡ γενεὰ αὕτη
  choice: 这一代人
  rationale: 在当前时间与话语语境中，γενεά 最自然地指“这一代人”；不借译文消解其末世论解释上的张力。
- source_word: μέχρις οὗ
  choice: 还没有……
  rationale: 与后面的“都必定发生”共同构成自然的汉语时间界限表达，相当于“直到……以前”。
- source_word: ταῦτα πάντα
  choice: 这一切
  rationale: 自然、明确地表达复数指示语与“全部”的合意，回指上文所说的各件事。
- source_word: γένηται
  choice: 发生
  rationale: 在此指所预告的事件成为事实；“发生”清楚而符合现代汉语。
theological_decisions:
- issue: 末世论讲论中“ἡ γενεὰ αὕτη”的含义
  choice: 直译为“这一代人”，不作解释性扩充
  alternative: “这族人／这个民族”，或看见这些征兆开始出现的未来一代
  rationale: 希腊语在此最自然的理解是“这一代人”。由于该短语在解释上争议很大，正文应保留原文措辞及其张力，而不偏向某一种末世论体系。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“我实在告诉你们”保留耶稣宣告的郑重语气；主句调整为自然汉语的先时结构，同时以“必定”呈现原文的强调。所有脚注标记均置于正文对应句末。
