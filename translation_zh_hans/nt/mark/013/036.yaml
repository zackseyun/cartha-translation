  text: lest, coming suddenly, he find you sleeping.
translation:
  language: zh_hans
  text: 免得他忽然来到，发现你们正在睡觉。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ
  choice: 免得
  rationale: 承接上文的警戒，以否定目的或所要避免的结果来表达。
- source_word: ἐλθὼν ἐξαίφνης
  choice: 忽然来到
  rationale: 保留分词所表达的伴随情形，并以自然汉语呈现 ἐξαίφνης 的突发意味。
- source_word: εὕρῃ
  choice: 发现
  rationale: 此处表示主人来到时见到众人的实际状态；“发现”符合现代汉语。
- source_word: ὑμᾶς καθεύδοντας
  choice: 你们正在睡觉
  rationale: 用“正在”体现现在分词所描写的持续状态，同时保留字面的睡觉意象。
theological_decisions:
- issue: “睡觉”是否解释为属灵懈怠
  choice: 正文保留“睡觉”
  alternative: 意译为“毫无警醒”或“属灵沉睡”
  rationale: 原文使用具体的睡觉意象；上下文虽赋予其警戒含义，正文不应把比喻所指直接替换进译文。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语；保留原句的警告语气和意象，不添加原文未明说的解释。
