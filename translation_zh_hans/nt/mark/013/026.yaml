  text: καὶ τότε ὄψονται τὸν υἱὸν τοῦ ἀνθρώπου ἐρχόμενον ἐν νεφέλαις μετὰ δυνάμεως πολλῆς καὶ δόξης·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/026.yaml
  text: And then they will see the Son of Man coming in the clouds with great power and glory[a].
translation:
  language: zh_hans
  text: 那时，他们要看见人子在云中而来，带着大能和荣耀[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在云中而来”也可译作“驾云而来”。希腊文直译为“在云中”，而“驾云而来”可显出这里可能对《但以理书》7:13的呼应。
    reason: 词义替代及互文说明
lexical_decisions:
- source_word: ὄψονται
  choice: 要看见
  rationale: 这是ὁράω的将来时形式；“要看见”自然地表达将来的公开可见事件，不额外加入“仰望”等解释性意味。
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: 人子
  rationale: “人子”是现代中文圣经语境中稳定而透明的称谓，也保留了与《但以理书》7章的互文联系和末世性张力。
- source_word: ἐρχόμενον
  choice: 而来
  rationale: 现在分词修饰“人子”；“而来”在中文句法中自然、庄重，并保留其动态意象，避免“抵达”所带来的日常化和过度终点化色彩。
- source_word: ἐν νεφέλαις
  choice: 驾云
  rationale: 希腊文直译为“在云中”，但此处很可能呼应《但以理书》7:13；“驾云”是自然凝练的现代中文圣经表达，呈现随云而来的意象。直译方案列入脚注，以保留介词表达的幅度。
- source_word: μετὰ δυνάμεως πολλῆς
  choice: 带着大能
  rationale: μετά加属格表示伴随；“带着大能”准确表达伴随状态，“大能”也比“很大的能力”更符合庄重而通俗的中文圣经语体。
- source_word: καὶ δόξης
  choice: 和荣耀
  rationale: “荣耀”保留δόξα在此处所指的彰显出来的威荣及其圣经互文色彩；“光彩”虽较具象，却会削弱其神学和末世语境。
theological_decisions:
- issue: 末世性称谓与云彩意象
  choice: 保留“人子”这一称谓，并用“驾云而来”呈现云彩来临的意象，不在正文中展开解释。
  alternative: 译作“那一位人”或直接在正文说明这是对《但以理书》7:13的呼应。
  rationale: 本句强烈呼应《但以理书》7:13，但翻译应让互文自行发挥作用，而不把暗示改写成解释。“人子”既保留已确立的称谓，也避免将其压缩成泛指人类的陈述；“驾云而来”不进一步判定云彩意象的全部神学含义。
translation_notes:
  register: 采用现代、庄重且普通读者易懂的中文。“那时……要看见……”清楚保留时间推进和将来意义；将“带着大能和荣耀”前置，使“驾云而来”成为自然的句末焦点。
