  text: Ὅταν δὲ ἴδητε τὸ βδέλυγμα τῆς ἐρημώσεως ⸀ἑστηκότα ὅπου οὐ δεῖ, ὁ ἀναγινώσκων νοείτω, τότε οἱ ἐν τῇ Ἰουδαίᾳ φευγέτωσαν εἰς τὰ ὄρη,
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/014.yaml
  text: But when you see the abomination of desolation standing where it ought not to be (let the reader understand)[a], then let those in Judea flee to the mountains[b],
translation:
  language: zh_hans
  text: 但你们看见“那造成荒凉的可憎之物”站在不该站的地方时（读的人应当明白）[a]，那时，在犹太地的人要逃到山里去[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那造成荒凉的可憎之物站在他不该站的地方。”原文“站着的”是阳性分词，可能暗示“可憎之物”背后所指的是一个人。
    reason: alternative_reading
  - marker: b
    text: “那造成荒凉的可憎之物”呼应《但以理书》的用语；参但9:27；11:31；12:11。
    reason: cross_reference
lexical_decisions:
- source_word: Ὅταν δὲ
  choice: 但……时
  rationale: ὅταν引出将来情境中的时间条件，δὲ在此承接上文并略带转折；“但……时”自然表达这种推进。
- source_word: ἴδητε
  choice: 你们看见
  rationale: 第二人称复数形式应明确译出“你们”；在时间从句中，用现代汉语的一般形式“看见”最自然。
- source_word: τὸ βδέλυγμα τῆς ἐρημώσεως
  choice: 那造成荒凉的可憎之物
  rationale: 保留βδέλυγμα所指可憎、亵渎之物的开放性，同时用“造成荒凉的”自然呈现属格短语与《但以理书》的典故；不在正文中限定其具体历史所指。
- source_word: ἑστηκότα
  choice: 站
  rationale: ἵστημι的完成时分词强调已经处于站立或立在那里的状态；“站”保留原文的鲜明意象，而不解释为“被设立”。
- source_word: ὅπου οὐ δεῖ
  choice: 在不该站的地方
  rationale: δεῖ在否定式中表达不合宜或不应当；结合“站”补足汉语表达。原文阳性分词可能暗示人物所指，此点置于脚注。
- source_word: ὁ ἀναγινώσκων νοείτω
  choice: 读的人应当明白
  rationale: 保留原文插入式劝告；“读的人”贴近实词分词，“应当明白”传达第三人称命令式的劝勉力度。
- source_word: τότε
  choice: 那时
  rationale: 明确标出看见该征兆之后随即应采取的行动。
- source_word: οἱ ἐν τῇ Ἰουδαίᾳ
  choice: 在犹太地区的人
  rationale: 自然、明确地保留地域范围；“犹太地区”比单用音译地名更便于现代普通读者理解。
- source_word: φευγέτωσαν
  choice: 要逃
  rationale: 第三人称复数现在时命令式表达紧迫指令；“要逃”在现代汉语中简洁而有命令力度。
- source_word: εἰς τὰ ὄρη
  choice: 到山上去
  rationale: ὄρη可指山岭或山区；“到山上去”是自然汉语，并保留向山区避难的方向。
theological_decisions:
- issue: “τὸ βδέλυγμα τῆς ἐρημώσεως”的性质与历史所指
  choice: 译作“那造成荒凉的可憎之物”，不指明具体对象、事件或人物。
  alternative: “那荒凉的可憎之物”；“那行毁坏的亵渎者”
  rationale: 该短语呼应《但以理书》，可能涉及亵渎之物、行为或人物，解释历来有争议。正文应保留其末世文学的典故和所指开放性，不代替读者确定历史应验。
- issue: 阳性分词ἑστηκότα与中性名词βδέλυγμα之间的不一致
  choice: 正文按明说的“可憎之物”处理，以中性的“之物”保持流畅；脚注说明也可理解为“那人”。
  alternative: 正文直接译成“他站在不该站的地方”
  rationale: 阳性分词可能暗示这可憎之物背后有一位人物，或将其人格化；但原文仍以中性名词命名它。正文不宜消除任一层面，故采用可读的中性表达，并用脚注保存人物性解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留插入语“读的人应当明白”和紧迫的命令语气；脚注标记[a]、[b]均已置于正文相应位置。
