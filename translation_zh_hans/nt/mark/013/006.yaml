  text: ⸀πολλοὶ ἐλεύσονται ἐπὶ τῷ ὀνόματί μου λέγοντες ὅτι Ἐγώ εἰμι, καὶ πολλοὺς πλανήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/006.yaml
  text: Many will come in my name[a], saying, ‘I am he,’ and they will lead many astray.
translation:
  language: zh_hans
  text: 将有许多人打着我的名号而来，说：‘我就是那一位[a]。’他们会迷惑许多人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或直译：“我是。”希腊文没有明说表语。
    reason: 保留 Ἐγώ εἰμι 的原文形式及其未明说表语的含混性。
lexical_decisions:
- source_word: πολλοὶ
  choice: 许多人
  rationale: 该形容词在这里作名词使用，泛指人数众多的人；“许多人”自然、明确。
- source_word: ἐλεύσονται
  choice: 会……而来
  rationale: 直译其将来时意义，并与后面的分词“说”自然衔接。
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: 冒我的名
  rationale: 此处指借耶稣的名义或声称与其身份、权柄有关而来；鉴于上下文明确警告假冒者，“冒我的名”简洁而自然，也避免让人误以为他们确实受耶稣差遣。
- source_word: λέγοντες
  choice: 说
  rationale: 保留分词朴素直接的言说意义，不额外强化为“宣称”或“断言”。
- source_word: ὅτι Ἐγώ εἰμι
  choice: 我就是那一位
  rationale: 希腊文直为“我是”，没有明说表语；汉语“我就是那一位”能自然表达语境中的身份认领，同时用脚注保留原文形式上的开放性。
- source_word: πολλοὺς
  choice: 许多人
  rationale: 作为动词宾语，与句首的“许多人”呼应，并准确表达不定多数。
- source_word: πλανήσουσιν
  choice: 会使……走迷
  rationale: 既表达误导、欺骗的含义，也保留原词使人偏离正路的意象。
theological_decisions:
- issue: 假冒者所说 Ἐγώ εἰμι 的身份含义
  choice: 我就是那一位
  alternative: 我是；我就是
  rationale: 上下文表明这些人借耶稣的名而来，所作的是身份或角色上的认领；“那一位”使现代汉语通顺，却不具体补成“基督”或其他称号，以免超出原文。脚注说明希腊文未明说表语，从而保留其含混与潜在的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“冒我的名”符合警告假冒者的语境；“使许多人走迷”保留 πλανάω 的路径隐喻。脚注标记紧随其所解释的“那一位”。
