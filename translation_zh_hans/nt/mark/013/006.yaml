  source_fidelity: “我就是那一位”恰当地传达了此处省略表语的身份认领，脚注也保留了希腊文“我是”的形式。可是“冒我的名而来”较强地断定其冒用、伪造耶稣的名义；ἐπὶ τῷ ὀνόματί μου更直接表示他们打着／凭借耶稣的名号而来。改为“打着我的名号而来”既符合警告语境，也较少提前解释其行为性质。
