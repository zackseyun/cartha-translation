id: MRK.13.21
reference: Mark 13:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ⸀καὶ τότε ἐάν τις ὑμῖν εἴπῃ· ⸀Ἴδε ὧδε ὁ ⸀χριστός, ⸁Ἴδε ἐκεῖ, μὴ πιστεύετε·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/021.yaml
  text: And then[a], if anyone says to you, ‘Look, here is the Messiah!’ or, ‘Look, there!’ do not believe it.
translation:
  language: zh_hans
  text: 那时，如果有人对你们说：“看，弥赛亚在这里！”或说：“看，在那里！”你们不要相信。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弥赛亚”也可译作“基督”。
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ τότε
  choice: 那时
  rationale: 承接上文并标示时间推进；现代汉语中“那时”已自然表达连接和时间关系，不必生硬补出“并且”。
- source_word: ἐάν τις ὑμῖν εἴπῃ
  choice: 如果有人对你们说
  rationale: 准确保留一般条件句、未定指的“有人”以及复数受话者“你们”。
- source_word: Ἴδε
  choice: 看
  rationale: 作为引人注意的呼语，简洁、有力，也符合现代汉语。
- source_word: ὧδε
  choice: 在这里
  rationale: 表达近指地点，并与后面的“在那里”形成清楚对照。
- source_word: ὁ χριστός
  choice: 弥赛亚
  rationale: 此处带冠词并用于末世性宣称，明显是“受膏者”这一称号，而非姓名化用法。
- source_word: ἐκεῖ
  choice: 在那里
  rationale: 保留远指地点，与“在这里”对举。
- source_word: μὴ πιστεύετε
  choice: 你们不要相信
  rationale: 希腊文未明说相信的宾语，中文无需强加“他”或“这话”，从而保留对象上的开放性。
theological_decisions:
- issue: Χριστός的称号性译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 上下文谈到有人声称那位受膏的拯救者出现在某处，因此采用称号性的“弥赛亚”；脚注保留传统译称“基督”。
- issue: πιστεύετε的隐含宾语
  choice: 不补明宾语，译作“不要相信”
  alternative: 不要相信这话／不要相信他
  rationale: 原文宾语隐含，既可指所说的消息，也可能涵盖说话者；不补明可避免缩窄原文警告。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“看”保留原文呼语的直接力度；两个地点短语形成简明对照。脚注标记置于整节末尾，正文中的“弥赛亚”与脚注对应。
