  text: Περὶ δὲ τῆς ἡμέρας ἐκείνης ἢ ⸀τῆς ὥρας οὐδεὶς οἶδεν, οὐδὲ οἱ ἄγγελοι ⸀ἐν οὐρανῷ οὐδὲ ὁ υἱός, εἰ μὴ ὁ πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/032.yaml
  text: But concerning that day or hour[a], no one knows—not even the angels in heaven, nor the Son, but only the Father.
translation:
  language: zh_hans
  text: 但至于那一天或那时辰，没有人知道——连在天上的天使、子也不知道，只有父知道。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些解释者认为，“子也不知道”是指子在道成肉身的使命中，或是就其人性而言；本译文不把这种解释加入正文，而保留希腊原文的措辞。
    reason: theological_tension
lexical_decisions:
- source_word: Περὶ δὲ
  choice: 但至于
  rationale: περί加属格引出所谈论的主题，δὲ表示承接前文而略带转折；“但至于”自然保留这两层话语功能。
- source_word: τῆς ἡμέρας ἐκείνης ἢ τῆς ὥρας
  choice: 那日子或那时辰
  rationale: 分别保留ἡμέρα“日子”与ὥρα“时辰”的时间范围；中文不必重复指示词，也能清楚表达二者并列。
- source_word: οὐδεὶς οἶδεν
  choice: 没有人知道
  rationale: οὐδείς表示全然否定，οἶδα虽在形态上是完成时，却通常具有现在时意义，因此译为现代汉语自然的“没有人知道”。
- source_word: οὐδὲ οἱ ἄγγελοι ἐν οὐρανῷ
  choice: 连天上的天使也不知道
  rationale: οὐδέ在否定句中具有递进强调作用，“连……也……”准确传达其力度；ἐν οὐρανῷ按地点理解，修饰“天使”。
- source_word: οὐδὲ ὁ υἱός
  choice: 子也不知道
  rationale: 重复的οὐδέ延续否定并加强递进；“子”保留ὁ υἱός作为基督论称号的简洁形式，不作解释性扩写。
- source_word: εἰ μὴ ὁ πατήρ
  choice: 只有父知道
  rationale: εἰ μή在否定陈述之后引出唯一例外；中文补出“知道”，自然明确地表达排他意义。
theological_decisions:
- issue: 经文陈述“子”不知道那日子或时辰
  choice: 在正文中直接保留“子也不知道”，不加弱化或解释性限定
  alternative: 在正文中添加“按他的人性”或“在道成肉身的使命中”等限定
  rationale: 希腊文本明确写有οὐδὲ ὁ υἱός。为忠实于原文并保留其神学张力，译文不把后来的神学综合加入正文；相关解释仅置于脚注。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“日子”“时辰”“子”“父”保留经文语体及称号特征；破折号呈现后半句逐层递进的强调。
