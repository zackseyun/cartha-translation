id: MRK.13.11
reference: Mark 13:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ⸂καὶ ὅταν⸃ ⸀ἄγωσιν ὑμᾶς παραδιδόντες, μὴ προμεριμνᾶτε τί ⸀λαλήσητε, ἀλλ’ ὃ ἐὰν δοθῇ ὑμῖν ἐν ἐκείνῃ τῇ ὥρᾳ τοῦτο λαλεῖτε, οὐ γάρ ἐστε ὑμεῖς οἱ λαλοῦντες ἀλλὰ τὸ πνεῦμα τὸ ἅγιον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/011.yaml
  text: And when they lead you away and hand you over[a], do not worry beforehand about what you should say; but whatever is given to you in that hour, speak that. For it is not you who are speaking[b], but the Holy Spirit.
translation:
  language: zh_hans
  text: 当他们押走你们，把你们交出去[a]时，不要预先忧虑要说什么；在那一刻，赐给你们什么，你们就说什么[b]。因为说话的不是你们，而是圣灵。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“押走你们去交出去。”希腊文以“押走”为主要动词，以分词“交出去”描述伴随的行动；正文按自然汉语分成两个并列动作。
    reason: previous_rendering
  - marker: b
    text: 希腊文在“要说什么”和“你们就说什么”两处使用同一动词（λαλέω，意为“说、说话”）；正文也以“说”保持这一呼应。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ὅταν
  choice: 当……时
  rationale: 承接上文并引出将来可能发生的情形；现代汉语中无需机械译出句首的 καί，也能保持连贯。
- source_word: ἄγωσιν ὑμᾶς
  choice: 他们押走你们
  rationale: 在受迫害的语境中，ἄγω 表示受强制地被带走；“押走”自然地传达这一含义。
- source_word: παραδιδόντες
  choice: 把你们交出去
  rationale: 这里指把人移交给掌权者处置，并非特指个人性的“背叛”；保留受交付对象未明说的特点。
- source_word: μὴ προμεριμνᾶτε
  choice: 不要预先忧虑
  rationale: 既保留 προ- 的“预先”含义，也表达因将要说什么而焦虑不安，而非禁止一切事前思考。
- source_word: τί λαλήσητε
  choice: 要说什么
  rationale: “要说什么”是自然的现代汉语，并准确表达间接疑问；λαλέω 在此为一般的“说话”。
- source_word: ὃ ἐὰν δοθῇ ὑμῖν
  choice: 赐给你们什么
  rationale: 保留被动结构所暗示的神圣来源；“赐给”符合上下文，但不在正文中另行明说赐予者。
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: 就在那一刻
  rationale: 表达决定性的当下时刻；“就在”强化不可预先筹划、届时才得赐予的时间对照。
- source_word: τοῦτο λαλεῖτε
  choice: 你们就说什么
  rationale: 与前面的“赐给你们什么”形成汉语关联结构，清楚传达 τοῦτο 所指的正是当时所得的话。
- source_word: οὐ γάρ ἐστε ὑμεῖς οἱ λαλοῦντες
  choice: 因为说话的不是你们
  rationale: 自然保留 ὑμεῖς 的强调，以及与后句“而是”构成的鲜明对比。
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: 圣灵
  rationale: 这是现代汉语基督教语境中标准而庄重的称谓。
theological_decisions:
- issue: 受迫害时言语的施予者与说话者
  choice: 保留“赐给你们什么，你们就说什么”与“说话的不是你们，而是圣灵”两方面
  alternative: 译成圣灵逐字口授、门徒只是被动工具；或弱化为圣灵仅提供一般性的帮助
  rationale: 原文一面命令门徒实际开口说，另一面把根本的说话主体归于圣灵。译文保留神圣主动性与人的真实参与之间的张力，不把它解释成机械口授或模糊的内在影响。
- issue: “赐给”这一神学被动式的施予者
  choice: 不在正文中补出“神”或“圣灵”作明确主语
  alternative: 译为“圣灵赐给你们什么”
  rationale: 希腊原文使用未说明施予者的被动式。上下文强烈暗示神圣来源，但译文不应把暗示改成原文没有明说的语法主语。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“押走”体现强制处境，“交出去”避免擅自补明接收者；“预先忧虑”保留原文的时间成分；整句维持耶稣教导中的紧迫感及圣灵与门徒说话行动之间的张力。脚注标记依其实际内容重新对应：关于移交句法的说明置于[a]，关于 λαλέω 重复的说明置于[b]。
