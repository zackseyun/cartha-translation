base_translation:
  language: en
  yaml_path: translation/nt/mark/013/037.yaml
  text: 'And what I say to you I say to all: stay awake[a].'
translation:
  language: zh_hans
  text: 我对你们所说的，也是对所有人说的：要警醒[a]！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“要保持清醒”，或“要警戒”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ
  choice: 所说的
  rationale: 中性单数关系代词在此作名词性成分；与“我……说”组合译为“我所说的”，自然表达概括、回指的意义。
- source_word: δὲ
  choice: 也
  rationale: δέ在此连接上下文，语气轻微，不必译成强转折；结合“对你们……对所有人”的扩展关系，用“也”能自然体现承接。
- source_word: ὑμῖν
  choice: 对你们
  rationale: 保留第二人称复数，首先指向当时直接听见这番话的门徒。
- source_word: λέγω ... λέγω
  choice: 说……说
  rationale: 保留原文动词的重复及其修辞结构，同时符合现代汉语表达。
- source_word: πᾶσιν
  choice: 对所有人
  rationale: 明确表达πᾶσιν的广泛、包容范围，又不把它限缩为当时在场的人。
- source_word: γρηγορεῖτε
  choice: 要警醒
  rationale: 现在时命令语气要求持续保持警觉；“警醒”在此既能承载不睡着的形象，也能表达属灵与处境上的戒备。
theological_decisions:
- issue: 耶稣劝告的适用范围
  choice: 这话先对门徒说，也明确扩展到所有人。
  alternative: 只把劝告理解为针对叙事现场的直接听众。
  rationale: 原文以“对你们”和“对所有人”形成明确的范围扩展；译文保留这种普遍指向，不进一步界定“所有人”的具体群体。
- issue: γρηγορεῖτε的意象与含义
  choice: 正文译作“要警醒”，保留持续警觉的命令。
  alternative: 译作“要保持清醒”或“要警戒”。
  rationale: 上下文同时容纳醒着与戒备的意象；正文不把它单纯处理成身体上不睡觉，也不把其神学含义解释得过满。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“也是”自然呈现由直接听众到所有人的扩展；句末用感叹号体现命令的力度。
