  text: καὶ ὁ ⸀Ἰησοῦς εἶπεν αὐτῷ· Βλέπεις ταύτας τὰς μεγάλας οἰκοδομάς; οὐ μὴ ἀφεθῇ ⸀ὧδε λίθος ἐπὶ ⸀λίθον ὃς οὐ μὴ καταλυθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/002.yaml
  text: And Jesus said to him[c][b][a], “Do you see these great buildings? Not one stone will be left here upon another that will not be torn down.”
translation:
  language: zh_hans
  text: 耶稣对他说：“你看见这些宏伟的建筑[a]吗？在这里，绝不会有一块石头留在另一块石头上而不被拆毁[b][c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“这些宏伟的圣殿建筑”。上下文所指的是圣殿建筑群，但希腊原文这里只说“建筑”。
    reason: lexical_alternative
  - marker: b
    text: “不留一块石头在另一块石头上”是形容彻底毁灭的说法。
    reason: cultural_note
  - marker: c
    text: “拆毁”也可译作“摧毁”或“推倒”。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ὁ Ἰησοῦς εἶπεν αὐτῷ
  choice: 耶稣对他说
  rationale: 直接表达叙事引语公式；汉语在本节开头省去机械对应 καί 的“于是/并且”，更自然，也不额外加入时间或回答意味。
- source_word: Βλέπεις
  choice: 你看见……吗
  rationale: 按直陈式在语境中的疑问用法处理，保留直接提问的语气，而不译成带命令意味的“你看”。
- source_word: ταύτας τὰς μεγάλας οἰκοδομάς
  choice: 这些宏伟的建筑
  rationale: “建筑”忠实保留 οἰκοδομάς 的一般性，不在正文增添“圣殿”；“宏伟”兼顾 μεγάλας 所表达的庞大与壮观。
- source_word: οὐ μὴ ἀφεθῇ ὧδε
  choice: 这里绝不会留下
  rationale: 用“绝不会”体现 οὐ μή 加虚拟式的强烈将来否定，“这里”直接对应地点副词 ὧδε。
- source_word: λίθος ἐπὶ λίθον
  choice: 一块石头叠在另一块石头上
  rationale: 保留原文具体意象，并以自然汉语表达石头上下相叠的关系。
- source_word: ὃς οὐ μὴ καταλυθῇ
  choice: 没有一块不被拆毁
  rationale: 保留关系从句所强调的无一例外，并用“拆毁”准确表达建筑物被拆除、毁坏的语境义。
theological_decisions:
- issue: 预言所指建筑的范围
  choice: 正文译作“建筑”，由上下文表明是圣殿建筑群
  alternative: 这些宏伟的圣殿建筑
  rationale: οἰκοδομάς 本身仅指“建筑”；不在正文补入“圣殿”，可避免把语境信息写成词汇明示，同时以脚注说明所指。
- issue: 毁灭程度的表达
  choice: 保留“一块石头叠在另一块石头上”的意象，并译出“没有一块不被拆毁”
  alternative: 意译为“将被彻底摧毁”
  rationale: 原文以强烈否定和具体画面宣告彻底毁灭；保留该张力和形象，不把预言压缩成抽象结论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“宏伟”兼顾建筑的巨大规模和壮观感；“绝不会”传达原文强烈的否定语气。句末保留重复否定形成的强调，以呈现原文宣告无一幸免的力度。
