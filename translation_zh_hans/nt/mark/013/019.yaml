    rationale: 原文为“从神所创造的创造／受造界之初”（κτίσεως ἣν ἔκτισεν ὁ θεός），而现有表述可被读作神开始创造万物的时间点。改为“从神所创造的万物之初”更完整地保留原文修饰关系，且不增加解释性立场。
