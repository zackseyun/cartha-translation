source:
  edition: SBLGNT
  text: ἔσονται γὰρ αἱ ἡμέραι ἐκεῖναι θλῖψις οἵα οὐ γέγονεν τοιαύτη ἀπ’ ἀρχῆς κτίσεως ⸀ἣν ἔκτισεν ὁ θεὸς ἕως τοῦ νῦν καὶ οὐ μὴ γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/019.yaml
  text: For those days will be a tribulation such as has not been from the beginning of the creation that God created until now[a], and never will be.
translation:
  language: zh_hans
  text: 因为在那些日子，必有患难；这样的患难，从神所创造的万物之初直到如今，从未有过，以后也绝不会再有。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “患难”也可译作“苦难”。
    reason: θλῖψις可表示压迫、困苦或患难；“苦难”更突出受苦本身，“患难”则较能兼顾此处严重灾难性的语境。
lexical_decisions:
- source_word: θλῖψις
  choice: 患难
  rationale: 在末世性讲论的语境中，指极其严重的压迫与苦难。“患难”庄重而通俗，也保留了该词在圣经语境中的分量。
- source_word: ἔσονται ... αἱ ἡμέραι ἐκεῖναι θλῖψις
  choice: 在那些日子，必有患难
  rationale: 希腊文直译近于“那些日子将是患难”，汉语如此表达较生硬；译作“在那些日子，必有患难”自然地传达那些日子将构成患难时期的意思。
- source_word: οἵα οὐ γέγονεν τοιαύτη
  choice: 这样的患难……从未有过
  rationale: 保留比较结构所强调的空前性，同时避免机械复制希腊文中在汉语里显得累赘的呼应措辞。
- source_word: ἀπ’ ἀρχῆς κτίσεως ἣν ἔκτισεν ὁ θεὸς
  choice: 从神创造万物之初
  rationale: 明确保留神为创造者和创造起初这两层含义；以自然现代汉语表达希腊文“从神所创造的受造界之初”，避免“受造界”对普通读者过于术语化。
- source_word: ἕως τοῦ νῦν
  choice: 直到如今
  rationale: 直接传达时间范围，措辞庄重而自然。
- source_word: οὐ μὴ γένηται
  choice: 以后也绝不会再有
  rationale: “绝不会”体现 οὐ μή 的强烈否定，“以后”标明未来指向；“再有”承接前文同类患难的比较关系。
theological_decisions:
- issue: “创造”用语的范围
  choice: 译作“从神创造万物之初”，指向神所创造的整体秩序。
  alternative: 译作“从世界开始以来”或将其限定为某一地方性、圣约性的起点。
  rationale: 原文同时使用 κτίσις 与 κτίζω，并以神为创造的主体。译文保留其创造论范围，不将其缩窄，也不据此加入特定的末世时间体系。
- issue: 患难的空前与绝后性质
  choice: 保留“从未有过……绝不会再有”的双重强调。
  alternative: 把这句话弱化为一般性的严重灾难描述。
  rationale: 原文的比较结构和 οὐ μή 强烈否定共同强调这患难前所未有、后亦不再有；译文保留此张力，但不解释其具体历史或末世对应。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“必有患难”化解希腊文名词谓语结构在汉语中的生硬感；分号帮助读者把患难的出现与其空前绝后的性质区分开来。脚注标记已在正文中对应出现。
