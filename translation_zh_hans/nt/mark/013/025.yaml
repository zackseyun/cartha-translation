source:
  edition: SBLGNT
  text: καὶ οἱ ἀστέρες ⸂ἔσονται ἐκ τοῦ οὐρανοῦ πίπτοντες⸃, καὶ αἱ δυνάμεις αἱ ἐν τοῖς οὐρανοῖς σαλευθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/025.yaml
  text: And the stars will be falling from heaven[b][a], and the powers in the heavens will be shaken.
translation:
  language: zh_hans
  text: 众星将从天上坠落[a]，天上的力量也将被震动[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “天上”也可译作“天空”；希腊语 οὐρανός 依语境可指天空或天界。
    reason: lexical_alternative
  - marker: b
    text: “天上的力量”可能指天上的权能者、宇宙力量，或诸天的结构与秩序；希腊原文没有进一步说明。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀστέρες
  choice: 众星
  rationale: 采用普通而庄重的天文、宇宙性含义；“众星”自然对应希腊语复数。
- source_word: ἔσονται ... πίπτοντες
  choice: 将……坠落
  rationale: 以“将……坠落”表达迂回将来时；汉语通常不必生硬添加持续标记，而“坠落”仍保留生动的动态感。
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: 从天上
  rationale: “天上”在现代汉语中既可指天空，也可带有天界色彩，适合保留 οὐρανός 在此处的词义开放性。
- source_word: δυνάμεις
  choice: 力量
  rationale: “力量”不预先限定为天使、天体或宇宙结构，保留复数 δυνάμεις 在启示性语境中的宽泛含义。
- source_word: αἱ ἐν τοῖς οὐρανοῖς
  choice: 天上的
  rationale: 汉语不自然地强制区分希腊语单复数“天”；“天上的”保持宇宙性范围，又不把所指具体化。
- source_word: σαλευθήσονται
  choice: 将被震动
  rationale: 直接表达将来被动语态，也保留 σαλεύω 所含的摇撼、动荡意象。
theological_decisions:
- issue: “天上的众力量”所指为何
  choice: 笼统译作“天上的众力量”
  alternative: 可理解为天上的权能者、宇宙力量或诸天的结构与秩序
  rationale: 希腊语没有明确限定其为灵界存在、天体还是宇宙秩序；译文不替原文消除这项启示文学中的歧义。
- issue: οὐρανός 在本节中的空间含义
  choice: 译作“天上”
  alternative: “天空”或“天界”
  rationale: “天上”可涵盖可见天空与超越性的天界，避免在语境未明确时作单一判定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“众星”“坠落”“震动”保持启示文学的宏大意象；“众力量”略带非常规色彩，但有助于保留希腊语复数及其所指歧义。
