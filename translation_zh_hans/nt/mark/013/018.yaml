  text: προσεύχεσθε δὲ ἵνα μὴ ⸀γένηται χειμῶνος·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/018.yaml
  text: But pray that it may not happen in winter[a].
translation:
  language: zh_hans
  text: 但你们要祷告，求这事不要发生在冬天。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 按上下文，也可更明确地译作：“求你们逃跑的事不要发生在冬天。”马可的希腊原文比《马太福音》24:20的平行记载更为简略。
    reason: 说明原文的省略表达及一种按语境补足的译法，同时不把平行经文的明确措辞直接加入正文。
lexical_decisions:
- source_word: προσεύχεσθε
  choice: 你们要祷告
  rationale: 现在时中间形态的命令语气，第二人称复数。用“你们要祷告”自然表达复数命令；不译作“要不断祷告”，以免过度强调时体含义。
- source_word: δὲ
  choice: 但
  rationale: δέ在此作轻微转折和衔接；承接上文的紧迫警告，“但”比单纯的“和”更贴合语篇关系。
- source_word: ἵνα μὴ
  choice: 求……不要
  rationale: 在“祷告”之后引出祈求的内容并带否定。现代汉语用“求……不要”比逐字译作“为要不……”更自然。
- source_word: γένηται
  choice: 这事不要发生
  rationale: γίνομαι的不定过去时中间形态虚拟语气。原文省略了所指事件，译作“这事……发生”既符合汉语，又保留马可叙述中的含蓄，没有直接补入“你们逃跑”。
- source_word: χειμῶνος
  choice: 在冬天
  rationale: 属格在此表示时间或季节；“在冬天”是简洁自然的现代汉语表达。
theological_decisions:
- issue: γένηται所指事件在原文中未明说
  choice: 用“这事不要发生”保留概括和省略
  alternative: 明确译作“你们逃跑的事不要发生”
  rationale: 马可的希腊文本没有明写“你们逃跑”，与《马太福音》24:20较明确的说法不同。正文不从平行经文补足，以尊重原文的简略和可能涵盖更广的语境所指；脚注说明其可能的明确含义。
translation_notes:
  register: 采用现代、庄重而通俗的表达。“你们”明示希腊语第二人称复数；“这事”使汉语句子自然，同时仍保留原文未明确说出所指事件的特点。
