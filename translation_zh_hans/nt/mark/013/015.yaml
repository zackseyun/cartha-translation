  text: ⸀ὁ ἐπὶ τοῦ δώματος μὴ ⸀καταβάτω μηδὲ εἰσελθάτω ⸂τι ἆραι⸃ ἐκ τῆς οἰκίας αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/015.yaml
  text: Let the one on the housetop not go down[a], nor enter to take anything out of his house.
translation:
  language: zh_hans
  text: 在房顶[a]上的人，不要下来，也不要进屋去拿自己家里的任何东西。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“房顶”指房屋的平顶，当时人们常在上面活动。
    reason: cultural_note
lexical_decisions:
- source_word: ὁ ἐπὶ τοῦ δώματος
  choice: 在房顶上的人
  rationale: 希腊语带冠词的介词短语作名词用，指身处该位置的人；译文保留单数泛指，并用现代汉语自然表达。
- source_word: δώματος
  choice: 房顶
  rationale: δώμα在这里指房屋上方可到达的平顶区域；“房顶”简明自然，文化背景另以脚注说明。
- source_word: μὴ καταβάτω
  choice: 不要下来
  rationale: 第三人称否定命令在汉语中自然译为“不要”；“下来”准确表达从房顶向下移动。
- source_word: μηδὲ εἰσελθάτω
  choice: 也不要进屋
  rationale: μηδέ连接第二项禁令；“进屋”依据后面的“从他家里”明确汉语中自然所需的目的地，而不改变语境所指。
- source_word: τι ἆραι
  choice: 拿任何东西
  rationale: 不定代词τι处于否定禁令的辖域内，译作“任何东西”能体现毫无例外的紧迫禁令；不定式表示进去的目的。
- source_word: ἐκ τῆς οἰκίας αὐτοῦ
  choice: 从他家里
  rationale: ἐκ表示东西取自屋内；“从他家里”既保留来源关系，也保留原文阳性单数代词。
theological_decisions:
- issue: 具有普遍指向的阳性单数表述
  choice: 他家里
  alternative: 自己家里／他们家里
  rationale: 原文用阳性单数αὐτοῦ指回那个人。译作“他家里”保留其语法形式，同时在上下文中仍自然具有泛指效力。
translation_notes:
  register: 采用现代、庄重而易懂的命令句。“房顶”比“屋顶平台”更自然，脚注补充古代犹太地区平顶房屋的文化背景；全句保持逃离情境中的紧迫感。
