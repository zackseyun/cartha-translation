base_translation:
  language: en
  yaml_path: translation/nt/mark/013/010.yaml
  text: And the good news must first be proclaimed to all the nations[a][b].
translation:
  language: zh_hans
  text: 福音[a]必须先传到万国[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “福音”原文直译为“好消息”。
    reason: lexical_alternative
  - marker: b
    text: 也可译为“在万国中传扬”；“万国”所译的词在某些语境中也可指“外邦人”。
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: （不单独译出）
  rationale: 本节在上下文中由 καὶ 承接前文。现代汉语若直译为“并且”略显生硬；省略显性连词仍能自然保留话语的连续性。
- source_word: εἰς πάντα τὰ ἔθνη
  choice: 遍万国
  rationale: εἰς 与 κηρυχθῆναι 连用，可表示宣讲所达到的方向或范围；“遍万国”以自然、庄重的现代汉语表达其普世范围，同时不把 ἔθνη 限定为“外邦人”。
- source_word: πρῶτον
  choice: 先
  rationale: 准确保留时间上的优先次序，不进一步规定它与随后事件之间的具体时间关系。
- source_word: δεῖ
  choice: 必须
  rationale: 保留原文所表达的必要性；不明说这种必要性的来源，以免加入经文本身未明言的解释。
- source_word: κηρυχθῆναι
  choice: 传遍
  rationale: 该被动不定式表示信息被公开宣扬。“传遍”与范围短语“万国”搭配自然，也体现宣讲达到广泛对象；脚注保留“在万国中传扬”这一更贴近宣讲行为的表达。
- source_word: τὸ εὐαγγέλιον
  choice: 福音
  rationale: “福音”是现代中文读者熟悉且庄重的对应词；其字面意义为“好消息”，在脚注中说明，以兼顾传统术语和词义透明度。
theological_decisions:
- issue: ἔθνη 的范围
  choice: 万国
  alternative: 所有外邦人
  rationale: 此处更可能强调福音传扬的普世范围；“万国”保留民族、国家或族群的广度，不把经文提前收窄为犹太人与外邦人的对照。
- issue: δεῖ 所表达的必要性
  choice: 必须
  alternative: 有必要
  rationale: “必须”保留原文较强的必要性以及可能存在的神圣、末世性意味，但不明言必要性的来源。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“福音必须先传遍万国”语序清楚，保留“先”与“必须”的重点；两个脚注分别说明“福音”的字面意义，以及介词短语和 ἔθνη 的真实语义弹性。
