base_translation:
  language: en
  yaml_path: translation/nt/mark/013/005.yaml
  text: Then Jesus began to say to them[a], “See to it that no one leads you astray.”
translation:
  language: zh_hans
  text: 耶稣就开始对他们说：“你们要当心，别让任何人把你们引入歧途。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们要谨慎，免得有人欺骗你们。”
    reason: 词义可选译法：Βλέπετε可译为“要谨慎”，πλανήσῃ也可突出“欺骗”的含义。
lexical_decisions:
- source_word: δὲ
  choice: 就
  rationale: δὲ在此是轻微的叙事连接词；“就”自然承接上文，不强化为明显转折。
- source_word: ἤρξατο λέγειν
  choice: 开始……说
  rationale: 保留马可常用的起始表达，同时符合现代汉语叙事习惯；本节没有“回答”一词，因此不从平行经文或上下文补入。
- source_word: αὐτοῖς
  choice: 对他们
  rationale: 希腊文只使用代词；虽可由上下文判断所指为门徒，正文仍保留原文的指称方式。
- source_word: Βλέπετε
  choice: 你们要当心
  rationale: 现在时命令语气要求持续警醒；“要当心”在现代汉语中自然地引出后面的警告。
- source_word: μή τις ὑμᾶς πλανήσῃ
  choice: 别让任何人把你们引入歧途
  rationale: μή加虚拟语气在命令语之后表达应当防止的事；“引入歧途”兼顾πλανάω所含的欺骗与使人偏离正路之意。
theological_decisions:
- issue: πλανήσῃ所警告的性质
  choice: 因受欺骗而偏离正路
  alternative: 仅指认知层面的受骗
  rationale: πλανάω既可指误导、欺骗，也保留使人走迷或偏离的意象；译为“引入歧途”保存其较宽的道德与属灵张力，而不额外加入教义解释。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“开始对他们说”贴近原文句法；警告句使用口语可懂但不过分随意的“要当心……别让……”，并借脚注保留另一种较形式对应的译法。
