  text: οὐαὶ δὲ ταῖς ἐν γαστρὶ ἐχούσαις καὶ ταῖς θηλαζούσαις ἐν ἐκείναις ταῖς ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/017.yaml
  text: But woe to those who are pregnant and to those who are nursing infants in those days[a][b].
translation:
  language: zh_hans
  text: 在那些日子，怀孕的和给婴儿哺乳的有祸了！
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐαὶ
  choice: 有祸了
  rationale: 保留先知性警告与哀叹的强烈语气；相较于单纯的“可悲”，更能表达将临困苦的严重性。
- source_word: δὲ
  choice: 不单独译出
  rationale: 此处是轻微的承接或转折。现代汉语将时间状语前置后，句间推进已自然显明；硬译为“但是”会使对比显得过强。
- source_word: ταῖς ἐν γαστρὶ ἐχούσαις
  choice: 怀孕的
  rationale: 按希腊语惯用语“腹中有孕”的实际含义翻译，简洁、自然，并保留对女性群体的指称。
- source_word: θηλαζούσαις
  choice: 哺乳婴儿的
  rationale: 表达给幼儿喂奶的含义，并把希腊语语境中隐含的受事“婴儿”明确出来，使现代读者容易理解。
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: 在那些日子
  rationale: 直接保留时间表达，也维持与上下文所述时期的联系。
theological_decisions:
- issue: οὐαί的语气是哀叹还是审判宣告
  choice: 译为“有祸了”，保留警告与哀叹兼具的张力
  alternative: 译为“可悲啊”或“苦啊”
  rationale: 上下文重点在逃难时孕妇和哺乳者所遭遇的格外艰难，不宜把这句话单纯解释为对她们的定罪；“有祸了”仍保留原文庄重而强烈的灾祸语气。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“怀孕的”和“哺乳婴儿的”均为名词化表达，与希腊语两个阴性复数分词结构相称；句末用感叹号呈现οὐαί的感叹力度。
