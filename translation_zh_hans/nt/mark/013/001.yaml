  text: Καὶ ἐκπορευομένου αὐτοῦ ἐκ τοῦ ἱεροῦ λέγει αὐτῷ εἷς τῶν μαθητῶν αὐτοῦ· Διδάσκαλε, ἴδε ποταποὶ λίθοι καὶ ποταπαὶ οἰκοδομαί.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/001.yaml
  text: And as he was going out of the temple[a], one of his disciples says to him, “Teacher[b], look—what wonderful stones and what wonderful buildings!”
translation:
  language: zh_hans
  text: 耶稣从圣殿区[a]出来的时候，他的一个门徒对他说：“老师，请看！这些石头多么宏伟，这些建筑多么壮观！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文ἱερόν指整个圣殿建筑群或院区，不是专指内殿。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκπορευομένου αὐτοῦ
  choice: 耶稣……出来的时候
  rationale: 属格独立结构配现在分词，表示与主句同时发生、尚在进行的动作；“出来的时候”符合现代汉语叙事习惯。补明“耶稣”以避免汉语代词指向含混。
- source_word: τοῦ ἱεροῦ
  choice: 圣殿区
  rationale: ἱερόν指整个圣殿建筑群或院区，并非专指内殿（ναός）；“圣殿区”在正文中直接保留这一范围区别。
- source_word: λέγει
  choice: 对他说
  rationale: 原文使用马可常见的历史现在时。现代汉语通常不以动词时态形态区分历史现在，故采用自然的叙事表达，不额外添加“当时”等过去时标记。
- source_word: εἷς τῶν μαθητῶν αὐτοῦ
  choice: 他的一个门徒
  rationale: 准确保留部分关系，表达简洁自然。
- source_word: Διδάσκαλε
  choice: 老师
  rationale: 直接表达称呼语“教师”，是现代汉语中自然、易懂的对应词，且不引入“主人”等额外含义。
- source_word: ἴδε
  choice: 请看
  rationale: 祈使语用于引起对方注意；“请看”既自然，也符合门徒对耶稣说话的语气。
- source_word: ποταποὶ λίθοι καὶ ποταπαὶ οἰκοδομαί
  choice: 这些石头多么宏伟，这些建筑多么壮观
  rationale: ποταπός在此构成感叹，表达对规模、品质或样貌的惊叹。“宏伟／壮观”按各自搭配对象作自然表达，同时保留赞叹语气；脚注注明也可侧重理解为“多么巨大”。
- source_word: λίθοι
  choice: 石头
  rationale: 直译原文，语境已清楚表明是圣殿建筑所用的石块，无须在正文增补。
- source_word: οἰκοδομαί
  choice: 建筑
  rationale: 复数指圣殿区内的建筑物或建筑群；现代汉语“这些建筑”自然清楚。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语自然的叙事语言。以“圣殿区”准确区分ἱερόν与内殿ναός；感叹句保留门徒面对巨大石块和建筑时的惊叹。
