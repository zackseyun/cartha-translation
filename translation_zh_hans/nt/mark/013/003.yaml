  text: Καὶ καθημένου αὐτοῦ εἰς τὸ Ὄρος τῶν Ἐλαιῶν κατέναντι τοῦ ἱεροῦ ⸀ἐπηρώτα αὐτὸν κατ’ ἰδίαν Πέτρος καὶ Ἰάκωβος καὶ Ἰωάννης καὶ Ἀνδρέας·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/003.yaml
  text: And as he was sitting on the Mount of Olives opposite the temple, Peter and James and John and Andrew were asking him privately,
translation:
  language: zh_hans
  text: 耶稣坐在橄榄山上，正对着圣殿[a]的时候，彼得、雅各、约翰和安得烈私下问他：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文的“圣殿”指整个圣殿建筑群或院区，不单指里面的圣所。
    reason: 说明希腊语 ἱερόν 的范围，避免读者将其误解为专指内殿的 ναός。
lexical_decisions:
- source_word: καθημένου αὐτοῦ
  choice: 耶稣……坐……的时候
  rationale: 属格独立结构中的现在分词描写与主句同时进行的背景动作；用“坐……的时候”既保留进行中的场景，也符合现代汉语叙事习惯。代词按上下文明确为“耶稣”，避免汉语句首“他”指代不清。
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: 在橄榄山上
  rationale: εἰς 在表示姿态的语境中指所在位置；“橄榄山”是通行地名，“在……上”自然准确。
- source_word: κατέναντι τοῦ ἱεροῦ
  choice: 正对着圣殿
  rationale: κατέναντι 表示位于对面或面对；“正对着”清楚呈现空间关系。ἱερόν 指整个圣殿建筑群或院区，正文采用通行称呼“圣殿”，并以脚注说明范围。
- source_word: ἐπηρώτα
  choice: 问他
  rationale: 未完成过去时以背景中的未完成体呈现询问；现代汉语通常不必加“正在”也能在“……的时候”结构中表达同时进行，避免生硬。
- source_word: κατ’ ἰδίαν
  choice: 私下
  rationale: 表示与其他人分开、非公开地交谈；“私下”简洁自然。
- source_word: Πέτρος καὶ Ἰάκωβος καὶ Ἰωάννης καὶ Ἀνδρέας
  choice: 彼得、雅各、约翰和安得烈
  rationale: 采用现代中文圣经中通行的人名形式；汉语列举以顿号和末项前的“和”表达，既清楚又自然。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。句末用冒号承接下一节的直接问话；不把希腊语未完成时机械译成“正在问”，而由时间从句自然体现同时进行的背景。
