  yaml_path: translation/nt/mark/013/023.yaml
  text: But you[a], watch out[b]; I have told you all things beforehand.
translation:
  language: zh_hans
  text: 但你们要警醒[a]；我已经预先把一切告诉你们了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“要谨慎”“要当心”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“我已经预先把一切说给你们听了”或“我已经把一切都预先警告你们了”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: 你们
  rationale: 原文明确使用第二人称复数，并置于句首以加强与前文的对照；汉语保留“你们”，自然体现这一强调。
- source_word: δὲ
  choice: 但
  rationale: 在此承接上文并带有对照意味；“但”能自然传达警告语境中的转折。
- source_word: βλέπετε
  choice: 要警醒
  rationale: 该词是现在时主动命令语气复数，在本段中不是单指视觉上的“看”，而是吩咐门徒持续留意、保持戒备；“要警醒”兼顾语境、持续性与庄重语体。
- source_word: προείρηκα
  choice: 已经……预先告诉……了
  rationale: 该动词表示事先说出；完成时强调此前的告知至今仍然有效。“已经……预先告诉……了”保留预先告知及其当前相关性。
- source_word: ὑμῖν
  choice: 告诉你们
  rationale: 该与格是说话动词的间接宾语；现代汉语自然表达为“告诉你们”。
- source_word: πάντα
  choice: 这一切
  rationale: 中性复数表示“一切”或“所有这些事”。“这一切”在汉语中自然回指本段所谈之事，同时不把范围限定得比上下文更窄。
theological_decisions:
- issue: 耶稣警告的力度与预先启示的范围
  choice: 译文既强调门徒必须保持警醒，也表明耶稣已预先告诉他们“这一切”。
  alternative: 将本句解释为耶稣已经毫无遗漏地启示未来的每一个细节，或把“一切”严格限定为紧邻本节的几项警告。
  rationale: πάντα 本身具有概括性，但其具体范围须由上下文判断。译作“这一切”保留这种张力，不在翻译中断定是未来所有细节，也不擅自缩窄为某几句话。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“警醒”符合末世劝诫语境，又不流于口语化；句式简洁，保留原文两分句之间直接而有力的关系。
