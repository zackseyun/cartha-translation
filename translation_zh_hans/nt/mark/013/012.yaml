  text: ⸂καὶ παραδώσει⸃ ἀδελφὸς ἀδελφὸν εἰς θάνατον καὶ πατὴρ τέκνον, καὶ ἐπαναστήσονται τέκνα ἐπὶ γονεῖς καὶ θανατώσουσιν αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/012.yaml
  text: And brother will hand over brother to death[a], and a father his child[b], and children will rise up against parents and put them to death.
translation:
  language: zh_hans
  text: 兄弟要把兄弟交去处死[a]；父亲也要把自己的孩子交去处死。儿女要起来反对父母，杀害他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “交去处死”也可译作“出卖”；希腊语动词可指“交出”或“交付”，按这里的语境也可译为“出卖”。
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδώσει
  choice: 要把……交出去
  rationale: παραδίδωμι的基本意思是“交出、交给”。在受迫害的语境中，这里指把亲人交给有权处死他们的人；此译法保留具体动作，又不把“背叛”的解释性意味直接写入正文。
- source_word: ἀδελφὸς ἀδελφὸν
  choice: 兄弟要把兄弟
  rationale: 保留原文阳性亲属称谓及刻意而尖锐的重复，表达家庭内部彼此出卖的情景。
- source_word: εἰς θάνατον
  choice: 使他被处死
  rationale: 该短语表示交出去所导致的结局或目的。中文补出“使他被”，清楚表达这不是一般意义上的死亡，而是遭人处死。
- source_word: πατὴρ τέκνον
  choice: 父亲也要把自己的孩子交出去
  rationale: 原文省略了由前句承接的谓语和结果短语；中文将其补出，以自然、清楚地表达父亲把自己的孩子交出去。τέκνον不限定孩子的性别，故译“孩子”。
- source_word: ἐπαναστήσονται
  choice: 要起来反对
  rationale: 该动词在此表示带有敌意地起来攻击或反对，译法保留了原文“起来”的形象和敌对意味。
- source_word: γονεῖς
  choice: 父母
  rationale: γονεῖς是γονεύς的复数，通常统称父母；“父母”是准确自然的现代汉语表达。
- source_word: θανατώσουσιν αὐτούς
  choice: 置他们于死地
  rationale: θανατόω意为使人死亡或将人处死。“置他们于死地”保留其使役意味，并与本节受迫害、被处死的语境协调。
theological_decisions:
- issue: 代表性陈述中的性别化亲属称谓
  choice: 前两句保留“兄弟”和“父亲”，而将τέκνον与γονεῖς分别译为“孩子”和“父母”。
  alternative: 将前两句泛化为“手足”与“父母中的一方”。
  rationale: ἀδελφός和πατήρ在此是明确的阳性亲属称谓，而τέκνον和γονεῖς本身涵盖更广。按原文分别处理，既不缩窄后两词，也不把前两词中性化。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“交出去”具体呈现把亲人交给迫害者的动作；“使他被处死”和“置他们于死地”保持本节严肃的受难语境。原文第二分句省略谓语，译文为汉语清晰起见予以补出。
