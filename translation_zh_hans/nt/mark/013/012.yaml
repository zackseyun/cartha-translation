revisions:
- from: 兄弟要把兄弟交出去，使他被处死[a]；父亲也要把自己的孩子交出去，使孩子被处死。儿女要起来反对父母，置他们于死地。
  to: 兄弟要把兄弟交去处死[a]；父亲也要把自己的孩子交去处死。儿女要起来反对父母，杀害他们。
  rationale: 修订仅提升汉语的凝练度和脚注的词义表述精确性。“交去处死”保留了原文“交出……至于死亡／处死”的方向与结果，未增添具体交付对象；末句改用“杀害他们”直接、自然地对应“使他们死亡／处死”。
