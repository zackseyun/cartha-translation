  text: Ἀλλὰ ἐν ἐκείναις ταῖς ἡμέραις μετὰ τὴν θλῖψιν ἐκείνην ὁ ἥλιος σκοτισθήσεται, καὶ ἡ σελήνη οὐ δώσει τὸ φέγγος αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/024.yaml
  text: But in those days[a], after that tribulation, the sun will be darkened, and the moon will not give its light,
translation:
  language: zh_hans
  text: 但在那些日子，那场患难[a]过后，太阳将变暗，月亮将不发出光来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “患难”也可译作“困苦”或“苦难”。
    reason: 词义备选：θλῖψις可指患难、困苦或苦难；正文选择“患难”以保留启示性语境中的力度。
lexical_decisions:
- source_word: Ἀλλὰ
  choice: 但
  rationale: 表示与前文的强烈转折或话题推进；“但”简洁自然。
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: 在那些日子
  rationale: 保留原文的时间表达及末世论语境中的庄重语气。
- source_word: μετὰ τὴν θλῖψιν ἐκείνην
  choice: 那场患难过后
  rationale: μετά加宾格表示时间上的“过后”；“患难”既涵盖困苦、压迫和灾难，也保留启示性语境中的分量，而不引入特定末世体系。
- source_word: ὁ ἥλιος σκοτισθήσεται
  choice: 太阳将变暗
  rationale: 准确表达将来的变暗状态；现代汉语不宜为形式对应而生硬地译成“被变暗”，但“将”保留了未来指向。
- source_word: καὶ ἡ σελήνη
  choice: 月亮也
  rationale: “也”自然连接两个彼此对应的天象，同时体现καί的并列作用。
- source_word: οὐ δώσει τὸ φέγγος αὐτῆς
  choice: 将不再发光
  rationale: 以自然汉语表达“不给出它的光”；“发光”保留月亮不放出光辉的鲜明意象。
theological_decisions:
- issue: 启示性话语中θλῖψις的译法
  choice: 患难
  alternative: 困苦；苦难；灾难
  rationale: “患难”在现代汉语中庄重而易懂，能保留该词在上下文中的强度和经文互文色彩，同时不把它限定为某一宗派所定义的专门末世阶段。
- issue: 太阳变暗的施事是否明说
  choice: 不明说施事，译作“太阳将变暗”
  alternative: 太阳将被变暗
  rationale: 希腊文使用将来被动式，但没有明说施事；汉语采用状态变化式既自然，也不擅自补出施事者，保留原文的含蓄。
translation_notes:
  register: 采用现代、庄重而通顺的标准普通话。语序略按汉语习惯调整为“那场患难过后”；避免生硬复制希腊语被动结构，也避免使用带有特定末世论体系色彩的术语。
