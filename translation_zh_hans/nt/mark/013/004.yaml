  text: Εἰπὸν ἡμῖν πότε ταῦτα ἔσται, καὶ τί τὸ σημεῖον ὅταν μέλλῃ ⸂ταῦτα συντελεῖσθαι πάντα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/004.yaml
  text: Tell us[a], when will these things be, and what will be the sign when all these things are about to be accomplished?
translation:
  language: zh_hans
  text: “请告诉我们，这些事什么时候会发生？当这一切快要完成时，会有什么征兆？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“当这一切将要完成时。”希腊文使用μέλλῃ加不定式，较明确地表达“将要”或“快要”的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰπὸν ἡμῖν
  choice: 请告诉我们
  rationale: 命令式在此是门徒向耶稣提出请求；加“请”符合现代汉语礼貌表达，“告诉我们”自然保留间接宾语。
- source_word: πότε ταῦτα ἔσται
  choice: 这些事什么时候会发生
  rationale: ταῦτα保留为复数“这些事”；ἔσται在事件语境中译作“会发生”比直译“会是”更自然。
- source_word: τί τὸ σημεῖον
  choice: 会有什么征兆
  rationale: σημεῖον在末世言论语境中指可辨识的预兆；“征兆”比泛称“记号”更贴合此处，同时不具体规定其形式。
- source_word: ὅταν μέλλῃ
  choice: 当……即将……时
  rationale: ὅταν引出时间从句；μέλλω加不定式所含的临近、将要之意以“即将”明确保留。
- source_word: ταῦτα συντελεῖσθαι πάντα
  choice: 这一切……全部成就
  rationale: πάντα修饰并强调ταῦτα的整体范围；“成就”保留συντελεῖσθαι的被动、达至完成之意，而不额外限定为预言的应验。
theological_decisions:
- issue: μέλλῃ加不定式的末世论语气
  choice: 译作“即将全部成就”
  alternative: 译作“将全部成就”
  rationale: “即将”保留μέλλω所表达的前瞻性及临近意味，但不据此裁定更广泛的末世时间体系。
- issue: συντελεῖσθαι的完成含义
  choice: 成就
  alternative: 完成；终结；应验
  rationale: “成就”兼顾达到完成状态和被动意味；避免“应验”把词义过度收窄为预言应验，也避免“终结”过早指定为宇宙末日。
translation_notes:
  register: 采用现代、庄重而易懂的问句。以两个问句呈现原文并列的询问；“请”传达请求语气。“这一切……全部”略有强调，旨在对应πάντα对ταῦτα的总体强调。
