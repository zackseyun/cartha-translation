  text: Ἀπὸ δὲ τῆς συκῆς μάθετε τὴν παραβολήν· ὅταν ⸂ἤδη ὁ κλάδος αὐτῆς⸃ ἁπαλὸς γένηται καὶ ἐκφύῃ τὰ φύλλα, γινώσκετε ὅτι ἐγγὺς τὸ θέρος ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/028.yaml
  text: 'Learn the parable from the fig tree: when its branch has already become tender and puts out leaves[a], you know that summer is near.'
translation:
  language: zh_hans
  text: “你们要从无花果树学习这个比喻[a]：当它的枝条已经变嫩，长出叶子时，你们就知道夏天近了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “比喻”也可理解为“教训”或“比方”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ δὲ τῆς συκῆς
  choice: 要从无花果树学
  rationale: ἀπό加属格表示学习的来源；δέ仅作轻微承接，汉语无需另加“现在”或强转折词。
- source_word: μάθετε
  choice: 要……学
  rationale: μανθάνω的不定过去时命令语气要求听者领受教训；“要……学”直接保留命令意味。
- source_word: τὴν παραβολήν
  choice: 这个比喻
  rationale: παραβολή在此指从无花果树引出的类比性教导；“比喻”既保持福音书中的术语连贯，也适合现代汉语。
- source_word: ὅταν
  choice: 当……时
  rationale: ὅταν加虚拟语气表达一般性的时间条件；“当……时”自然准确。
- source_word: ἤδη ὁ κλάδος αὐτῆς ἁπαλὸς γένηται
  choice: 它的枝条已经变嫩
  rationale: ἤδη保留“已经”的时间意味；ἁπαλός描述新生枝条柔嫩的状态。
- source_word: ἐκφύῃ τὰ φύλλα
  choice: 长出叶子
  rationale: ἐκφύω表示萌发、长出；“长出叶子”是自然清楚的现代汉语。
- source_word: γινώσκετε
  choice: 你们就知道
  rationale: 此处为陈述式，说明人从迹象作出的判断，而非另一个命令；“就”呈现条件与认知结果的关系。
- source_word: ἐγγὺς τὸ θέρος ἐστίν
  choice: 夏天近了
  rationale: θέρος通常指夏天，ἐγγύς表示时间临近；此译简洁并保留季节意象。
theological_decisions:
- issue: 本节中παραβολή的含义
  choice: 正文译作“比喻”
  alternative: “教训”或“譬喻”
  rationale: “比喻”保留福音书常用术语及原文的类比性质，同时不额外引入寓意化解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你们要……学”保留命令语气；句末脚注标记对应παραβολή的词义选择。
