source:
  edition: SBLGNT
  text: ἐγερθήσονται γὰρ ψευδόχριστοι καὶ ψευδοπροφῆται καὶ δώσουσιν σημεῖα καὶ τέρατα πρὸς τὸ ἀποπλανᾶν εἰ ⸀δυνατὸν τοὺς ἐκλεκτούς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/022.yaml
  text: For false messiahs and false prophets will arise and will give signs and wonders in order to lead astray[a], if possible[c][b], the elect.
translation:
  language: zh_hans
  text: 因为假弥赛亚和假先知将要兴起，并且施行神迹奇事，企图迷惑——若是可能——蒙拣选的人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “若是可能”也可放在句末，译作“企图迷惑蒙拣选的人——若是可能”。原文没有明确说明蒙拣选的人事实上能否被迷惑，只陈述了迷惑者的企图。
    reason: 保留εἰ δυνατόν的修饰范围及神学上的开放性
lexical_decisions:
- source_word: ἐγερθήσονται
  choice: 将要兴起
  rationale: 在此语境中指这些人物将会出现或兴起；这样译既自然，也保留预言式警告的语气，同时不暗示是上帝使他们兴起。
- source_word: γὰρ
  choice: 因为
  rationale: 承接上文并说明警告的理由；现代汉语中“因为”能清楚表达其解释性连接作用。
- source_word: ψευδόχριστοι
  choice: 假弥赛亚
  rationale: 复合词中的 Χριστός 在这里是称号，意为“弥赛亚”；“假弥赛亚”既准确又符合犹太弥赛亚语境。
- source_word: ψευδοπροφῆται
  choice: 假先知
  rationale: 这是该复合名词准确、通行且易懂的译法。
- source_word: δώσουσιν σημεῖα καὶ τέρατα
  choice: 施行神迹奇事
  rationale: δώσουσιν 字面为“给出”，但与“神迹奇事”搭配时，汉语自然说“施行”。“神迹奇事”保留固定的圣经表达；其中“神迹”传达 σημεῖα 作为超常记号的语境含义。
- source_word: πρὸς τὸ ἀποπλανᾶν
  choice: 企图迷惑
  rationale: 该结构表达目的。“企图”明确这是欺骗者的意图；“迷惑”自然传达使人偏离真道的含义。
- source_word: εἰ δυνατόν
  choice: 若是可能
  rationale: 直译这个简洁的条件语，不把它强化为反事实条件，因此不预先断定所拣选的人究竟能否被迷惑。
- source_word: τοὺς ἐκλεκτούς
  choice: 上帝所拣选的人
  rationale: “所拣选的人”自然表达 ἐκλεκτούς 的被拣选含义；补出“上帝”说明此处隐含的施事者，符合该词在本段中的神学语境，也比单用名词化的“选民”更透明。
theological_decisions:
- issue: ψευδόχριστοι 中 Χριστός 作为称号的译法
  choice: 假弥赛亚
  alternative: 假基督
  rationale: 这里显然指冒称弥赛亚身份的人。“弥赛亚”比“基督”更清楚地保留称号意义及其犹太背景。
- issue: εἰ δυνατόν 是否暗示所拣选的人不可能被迷惑
  choice: 若是可能
  alternative: 倘若这可能的话
  rationale: 原文只使用条件短语，没有明确判定这种迷惑最终可能还是不可能。正文用破折号保留其插入位置和修饰范围，不替原文消除神学张力。
- issue: τοὺς ἐκλεκτούς 的表达
  choice: 上帝所拣选的人
  alternative: 选民
  rationale: 所选译法保留“被拣选”的词义，又不借“选民”一词限定其群体范围或引入特定宗派的拣选论解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“神迹奇事”保留熟悉的圣经搭配；以破折号标出“若是可能”的插入性质，使中文既可读，又尽量反映原文词序所保留的范围歧义。
