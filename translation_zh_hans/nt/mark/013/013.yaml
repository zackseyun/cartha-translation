source:
  edition: SBLGNT
  text: καὶ ἔσεσθε μισούμενοι ὑπὸ πάντων διὰ τὸ ὄνομά μου. ὁ δὲ ὑπομείνας εἰς τέλος οὗτος σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/013.yaml
  text: And you will be hated by all because of my name[d][c][b][a]. But the one who endures to the end will be saved.
translation:
  language: zh_hans
  text: 你们必因我的名被众人恨恶。[a] 但忍耐到底的人必得救。[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为了我的名”。
    reason: lexical_alternative
  - marker: b
    text: “忍耐到底”也可译作“坚持到底”或“坚守到底”。
    reason: lexical_alternative
  - marker: c
    text: “得救”也可译作“蒙拯救”。希腊文既可指获救、脱险，也可指救恩；上下文并未完全限定这里的侧重点。
    reason: alternative_reading
lexical_decisions:
- source_word: μισούμενοι
  choice: 被……恨恶
  rationale: 与ἔσεσθε构成将来时的迂回表达；汉语用“必被……恨恶”自然地表达将来被动含义，并保留原文强烈措辞。
- source_word: ὑπὸ πάντων
  choice: 被众人
  rationale: 保留πάντων概括性的全称表达，不擅自加以限制；“众人”在现代汉语中比“所有人”更庄重凝练。
- source_word: διὰ τὸ ὄνομά μου
  choice: 因我的名
  rationale: διά加宾格表示原因；“因我的名”既简洁自然，也保留“名”所承载的本人、权柄及归属含义。
- source_word: ὁ δὲ ὑπομείνας
  choice: 但忍耐……的人
  rationale: 带冠词的过去时态分词作名词性用法，指在压力下坚持的人；“忍耐”保留承受并持守的含义，又避免引入特定神学术语。
- source_word: εἰς τέλος
  choice: 到底
  rationale: 表示持续达到终点；“到底”是自然、凝练的汉语，也保留终点究竟指患难结束、生命终结或末世终局的开放性。
- source_word: οὗτος
  choice: 由“……的人必……”句式体现
  rationale: οὗτος具有回指和强调作用；汉语无需生硬译成“这人”，以主谓句式已能清楚突出该人。
- source_word: σωθήσεται
  choice: 必得救
  rationale: σῴζω既可指获救脱险，也可有更完整的救恩含义；“得救”保留其神学分量，而脚注说明语境中亦可能侧重蒙拯救。
theological_decisions:
- issue: 忍耐之言中σωθήσεται的含义
  choice: 必得救
  alternative: 必蒙拯救
  rationale: 本节把受逼迫中的忍耐与最终得救相连，但不应将其收窄为仅仅今世脱险，也不应据此加入某一宗派关于坚忍的完整教义体系。“得救”保留原文的广度与张力。
- issue: πάντων的范围
  choice: 众人
  alternative: 所有人
  rationale: 保留原文概括而强烈的普遍说法，不添加“许多人”等缓和限定；其语境性和修辞力度留给读者从上下文理解。
- issue: 忍耐与得救之间的关系
  choice: 保留原文直接陈述
  alternative: 解释为忍耐是得救的功德条件或得救的必然证据
  rationale: 原文直接说忍耐到底的人必得救，却未在本句阐明其中的系统神学关系；译文不额外解释，以保存其劝诫力度和神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“因我的名”“忍耐到底”“必得救”保留经文语体及原文的神学张力；避免照搬希腊语回指结构而造成“这人”式冗赘。所有脚注标记均置于正文相应位置。
