  source_fidelity: 译文准确传达了将来被动式“将被……恨恶”、原因短语“因我的名”、以及忍耐至终与得救的应许。“众人”保留了πάντων未加限定的概括性；“忍耐到底”也保留εἰς τέλος所指终点未被上下文具体界定的开放性。将οὗτος的回指强调自然融入“……的人必……”句式，符合汉语表达，未损失实质意义。
  naturalness: “你们必因我的名被众人恨恶”及“但忍耐到底的人必得救”庄重、清晰，符合现代标准汉语的经文语体。“恨恶”“必得救”虽带有传统经文色彩，但并不生硬，且恰当地维持了本句的郑重和神学语域。
  terminology: “因我的名”忠实保留ὄνομα在此处的表达，未擅自释义为“因信我”或“因跟从我”。“忍耐到底”恰当对应ὑπομείνας εἰς τέλος；“得救”保留σωθήσεται可涵盖拯救与救恩的语义广度。脚注c适当地说明“蒙拯救”的可能性，而没有将经文限定为仅属肉身脱险或特定教义结论。
