source:
  edition: SBLGNT
  text: ὡς ἄνθρωπος ἀπόδημος ἀφεὶς τὴν οἰκίαν αὐτοῦ καὶ δοὺς τοῖς δούλοις αὐτοῦ τὴν ἐξουσίαν, ⸀ἑκάστῳ τὸ ἔργον αὐτοῦ, καὶ τῷ θυρωρῷ ἐνετείλατο ἵνα γρηγορῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/034.yaml
  text: It is like a man away on a journey[a], who left his house and gave authority to his slaves, to each one his work, and commanded the doorkeeper to stay awake.
translation:
  language: zh_hans
  text: 这就像一个人出外远行，离开自己的家，把权柄交给自己的奴仆[a]，并把各人的工作分派给他们；又吩咐看门的人要警醒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“仆人”；希腊文指处在主人权下的家内奴仆。
    reason: 说明δοῦλος的社会身份及可选的自然中文译法。
lexical_decisions:
- source_word: ὡς
  choice: 这就像
  rationale: 希腊文以比较词引入比喻性说明；中文补出“这”可自然承接上文，又不增添实质内容。
- source_word: ἄνθρωπος ἀπόδημος
  choice: 一个远行的人
  rationale: ἀπόδημος指离乡、外出在外；“远行的人”兼顾其离家与出行之意，表达自然。
- source_word: ἀφεὶς τὴν οἰκίαν αὐτοῦ
  choice: 离开自己的家
  rationale: 保留分词所表达的先行动作；οἰκία在此指此人所离开的家宅。
- source_word: δοὺς τοῖς δούλοις αὐτοῦ τὴν ἐξουσίαν
  choice: 把权柄交给他的奴仆
  rationale: δίδωμι按语境译为“交给”，ἐξουσία保留为“权柄”，体现主人授予其属下行动和管理的权限。
- source_word: ἑκάστῳ τὸ ἔργον αὐτοῦ
  choice: 给每个人分派各自的工作
  rationale: 原文为省略式并列结构；中文补出“分派”以清楚表达每人各有其工，同时不过度具体化任务内容。
- source_word: τῷ θυρωρῷ
  choice: 看门的人
  rationale: θυρωρός指守门者；“看门的人”是普通现代汉语中清楚自然的说法。
- source_word: ἐνετείλατο ἵνα γρηγορῇ
  choice: 吩咐……要警醒
  rationale: ἐντέλλομαι具有权威性的命令意味，“吩咐”符合主人对属下说话的语境；γρηγορέω既可指保持醒着，也有警觉守望之意，此处“警醒”保留本章反复出现的劝诫重点。
theological_decisions:
- issue: 家宅比喻中δοῦλος的译法
  choice: 奴仆
  alternative: 仆人；奴隶
  rationale: δοῦλος表示处于主人权下、具有隶属身份的人。“奴仆”比单纯“仆人”更能保留这种从属关系，又比现代汉语“奴隶”在此比喻语境中更自然；脚注说明其身份含义，避免淡化原文。
- issue: γρηγορέω的译法
  choice: 警醒
  alternative: 保持清醒；守望
  rationale: 本节既涉及看门者实际不可睡着，也承载末世讲论中保持警觉的劝诫。“警醒”能保留两层意味，不把它限定为纯粹生理上的不睡觉。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“权柄”“警醒”保留经文中的权威与守望色彩；句法适度显明原文省略关系，使中文顺畅。
