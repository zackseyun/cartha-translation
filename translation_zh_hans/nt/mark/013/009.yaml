  text: βλέπετε δὲ ὑμεῖς ἑαυτούς· ⸀παραδώσουσιν ὑμᾶς εἰς συνέδρια καὶ εἰς συναγωγὰς δαρήσεσθε καὶ ἐπὶ ἡγεμόνων καὶ βασιλέων σταθήσεσθε ἕνεκεν ἐμοῦ εἰς μαρτύριον αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/009.yaml
  text: But watch yourselves. They will hand you over to councils[a], and you will be beaten in synagogues, and you will stand before governors and kings because of me, as a testimony to them.
translation:
  language: zh_hans
  text: 但你们自己要谨慎。他们要把你们交给议会；你们要在会堂里受殴打，也要因我的缘故站在总督和君王面前，向他们作见证。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “向他们作见证”也可理解为“作为对他们的见证”，即可能带有对他们不利或审判性的含义。
    reason: alternative_reading
lexical_decisions:
- source_word: βλέπετε δὲ ὑμεῖς ἑαυτούς
  choice: 但你们自己要谨慎
  rationale: 现在时命令语气表达持续警醒；“你们自己”保留显式人称代词与反身代词的强调，“要谨慎”自然传达警戒意味。
- source_word: παραδώσουσιν ὑμᾶς
  choice: 他们要把你们交给
  rationale: 在受迫害和司法语境中，指被移交给掌权机构；“交给”清楚自然，并避免将其限定为私人意义上的“背叛”。
- source_word: συνέδρια
  choice: 议会
  rationale: 复数形式大概指地方性的治理或审判议会，不一定专指耶路撒冷的公议会；“议会”保留其广义制度色彩。
- source_word: συναγωγάς
  choice: 会堂
  rationale: 这是该词在犹太制度和聚会场所意义上的标准现代汉语译法，也符合施行纪律性责打的语境。
- source_word: δαρήσεσθε
  choice: 受鞭打
  rationale: 该动词指身体遭受击打；在会堂惩戒语境中，“受鞭打”比笼统的“挨打”更准确，同时没有额外规定刑具或次数。
- source_word: ἐπὶ ἡγεμόνων καὶ βασιλέων σταθήσεσθε
  choice: 站在总督和君王面前
  rationale: 保留“站立”的原文形象和正式出庭的含义；“总督和君王”分别对应两类统治者。
- source_word: ἕνεκεν ἐμοῦ
  choice: 因我的缘故
  rationale: 表达门徒遭遇这些事是由于与耶稣的关系；措辞庄重、自然，并准确保留因果意义。
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: 向他们作见证
  rationale: 表达门徒在掌权者面前的遭遇成为向他们作见证的机会；不在正文中强加“控告他们”的敌对含义。
theological_decisions:
- issue: εἰς μαρτύριον αὐτοῖς 中见证的指向和性质
  choice: 向他们作见证
  alternative: 作为反对他们或控告他们的证据
  rationale: αὐτοῖς本身可自然理解为见证所面向的对象，而语境也容许更具审判性的含义。正文采用较少限定的“向他们作见证”，脚注说明另一可能，以保留神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“议会”不专指耶路撒冷公议会；分号呈现被交付、受鞭打与站在统治者面前之间紧密而有层次的关系。脚注标记置于所注释的见证短语之后。
