  yaml_path: translation/nt/mark/008/010.yaml
  text: And immediately[a], getting into the boat with his disciples, he went to the region of Dalmanutha.
translation:
  language: zh_hans
  text: 他随即与他的门徒一同上船，来到大玛努他一带[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“到大玛努他的各地区”；希腊文采用复数表达，指大玛努他一带的地区。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: 随即
  rationale: 保留马可叙事中紧接发生、迅速推进的时间意味，同时符合现代汉语表达。
- source_word: ἐμβὰς
  choice: 上了船
  rationale: 该不定过去时分词表示先于主要动词发生的动作；汉语以连动结构自然呈现，无须生硬译出分词形式。
- source_word: πλοῖον
  choice: 船
  rationale: 在加利利海的语境中，“船”准确自然，不暗示现代意义上的大型船舶。
- source_word: μετὰ τῶν μαθητῶν αὐτοῦ
  choice: 和门徒
  rationale: 准确表达 μετά 加属格所表示的陪同关系；主语“他”已明确，因此现代汉语中不必重复“他的”。
- source_word: ἦλθεν
  choice: 来到
  rationale: 表示抵达所述目的地；“来到”在汉语叙事中自然，也保留 ἔρχομαι 的移动与到达意味。
- source_word: τὰ μέρη
  choice: 一带
  rationale: 希腊文虽为复数形式，但在此惯指某地周边的区域；“一带”既自然又保留范围并非精确地点的意味。
- source_word: Δαλμανουθά
  choice: 达玛努他
  rationale: 作为地名按希腊文音译，不对其来源或确切位置作未经文本支持的解释。
