  text: καὶ ⸀γνοὺς λέγει αὐτοῖς· Τί διαλογίζεσθε ὅτι ἄρτους οὐκ ἔχετε; οὔπω νοεῖτε οὐδὲ συνίετε; ⸀πεπωρωμένην ἔχετε τὴν καρδίαν ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/017.yaml
  text: And knowing[a], he says to them[c][b], “Why are you discussing that you have no bread? Do you not yet perceive or understand? Do you have your heart hardened?”
translation:
  language: zh_hans
  text: 耶稣知道了，就对他们说：“你们为什么议论没有饼这件事？你们还不领会，还不明白吗？你们的心已经刚硬了吗？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνοὺς
  choice: 知道了
  rationale: 用简洁的过去时表达不定过去时分词所引出的知悉；所知道的内容由上文自然补足，不另加“这事”。
- source_word: διαλογίζεσθε
  choice: 议论
  rationale: 这里指门徒彼此谈论、思量没有饼的事；“议论”既保留共同商议的意味，也符合现代汉语语境。
- source_word: ἄρτους
  choice: 饼
  rationale: 希腊文为复数，但汉语“饼”在此可作类称，无须机械标明复数，也能衔接本段关于饼的语境。
- source_word: νοεῖτε
  choice: 领会
  rationale: 表达心智上的察觉和把握，并与下一个表示理解的动词有所区分。
- source_word: συνίετε
  choice: 明白
  rationale: 自然表达理解之意，与“领会”构成递进而不把两个近义动词合并。
- source_word: πεπωρωμένην
  choice: 刚硬
  rationale: 保留完成时被动分词所描述的持续状态，也保留圣经中内心迟钝、不肯回应的隐喻。
- source_word: καρδίαν
  choice: 心
  rationale: 保留原文隐喻，所指包括人的理解力、意志和属灵回应，不仅是情感。
theological_decisions:
- issue: 末句对门徒内在状态的问法
  choice: 你们的心还是刚硬的吗？
  alternative: 你们仍有一颗刚硬的心吗？
  rationale: 原文是“有”加宾语和分词的结构，字面近于“你们有自己的心处于刚硬状态吗”。现代汉语若机械保留“有……被刚硬”会很不自然，因此采用状态问句；“心”保留原文集合性单数，“还是”体现οὔπω及语境中持续未能领悟的责问，但不额外判定刚硬的原因。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。主语补出“耶稣”，避免汉语中连续零主语造成指代不清；三个反问保持原文责问的力度与节奏。
