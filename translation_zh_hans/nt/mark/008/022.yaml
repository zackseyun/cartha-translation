- from: 他们来到伯赛大。有人把一个盲人带到耶稣面前，恳求耶稣摸他。
  to: 他们来到伯赛大。他们把一个盲人带到耶稣那里，恳求耶稣摸他。
  rationale: 仅将“有人”改回与希腊文复数动词相符的“他们”，并保留“耶稣”以消除现代汉语中多个“他”可能造成的指代歧义。其余措辞准确自然，无需增设脚注。
