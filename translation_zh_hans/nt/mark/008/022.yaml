  text: Καὶ ⸀ἔρχονται εἰς Βηθσαϊδάν. καὶ φέρουσιν αὐτῷ τυφλὸν καὶ παρακαλοῦσιν αὐτὸν ἵνα αὐτοῦ ἅψηται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/022.yaml
  text: And they came to Bethsaida. And they brought a blind man to him and begged him to touch him.
translation:
  language: zh_hans
  text: 他们来到伯赛大。他们把一个盲人带到耶稣那里，恳求耶稣摸他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρχονται
  choice: 来到
  rationale: 这是叙事中的历史现在时；现代汉语无需以时态形态对应，用“来到”自然地推进事件，同时保留到达某地的含义。
- source_word: εἰς Βηθσαϊδάν
  choice: 伯赛大
  rationale: εἰς与地名连用表示前往该地；“来到伯赛大”已自然表达方向。地名采用现代中文圣经中通行的音译。
- source_word: φέρουσιν
  choice: 带到
  rationale: 原词宽泛表示把人带来，并未说明是搀扶、抬或背，因此不用会把方式具体化的词；“带到耶稣面前”符合现代汉语叙事。
- source_word: τυφλὸν
  choice: 一个盲人
  rationale: 该形容词在此作名词使用，指一名失明者；“一个盲人”准确、自然。
- source_word: παρακαλοῦσιν
  choice: 恳求
  rationale: 此处表达迫切而郑重的请求，语气强于普通的“请求”，而“恳求”庄重且符合医治场景。
- source_word: ἵνα αὐτοῦ ἅψηται
  choice: 摸他
  rationale: ἵνα加虚拟式在这里说明恳求的内容；汉语用兼语结构“恳求耶稣摸他”最自然。ἅπτομαι意为触摸，不额外引入医治结果。
- source_word: καὶ
  choice: 他们……。有人……
  rationale: 两个καί体现马可简洁并列的叙事风格。现代汉语若逐一译作“并且”会生硬，因此以连续短句保留并列推进；第二句按语境译为“有人”，避免汉语中无明确先行对象的“他们”造成指代含混。
theological_decisions: []
translation_notes:
  register: 采用现代、简洁而庄重的叙事语体。“耶稣”在原文中由代词αὐτῷ/αὐτόν指称；中文若连续使用“他”，会使带人者、盲人和耶稣之间的指代不清，因此在第二句显明为“耶稣”。保留原文未说明带来者身份和人数的开放性，以“有人”表达。
