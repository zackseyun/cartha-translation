  source_fidelity: 原文两次使用第三人称复数动词（ἔρχονται、φέρουσιν），草稿首句准确译为“他们来到”，但第二句将明确的复数施事者改为“有人”，弱化并改变了原文的语法信息。将代词所指的耶稣显明出来可避免汉语歧义，且不改变原意。
  naturalness: 修订后语句仍为自然、简洁的现代汉语叙事；“带到耶稣那里，恳求耶稣摸他”清楚区分带来者、耶稣与盲人。
  terminology: “伯赛大”“盲人”“恳求”“摸”均恰当。“耶稣”是为处理汉语代词指向而作的必要明示，符合上下文。
