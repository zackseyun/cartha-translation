  text: καὶ ἐὰν ἀπολύσω αὐτοὺς νήστεις εἰς οἶκον αὐτῶν, ἐκλυθήσονται ἐν τῇ ὁδῷ· ⸂καί τινες⸃ αὐτῶν ⸀ἀπὸ μακρόθεν ⸀ἥκασιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/003.yaml
  text: And if I send them away hungry to their homes[a], they will collapse on the way, and some of them have come from far away.
translation:
  language: zh_hans
  text: 我若叫他们饿着回家，他们会在路上体力不支[a]；他们中还有些人是从远方来的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“昏倒在路上”。这个希腊语动词可指人变得虚弱或精疲力竭，以致支撑不住。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολύσω
  choice: 叫他们……回家
  rationale: 在给众人食物的语境中，指让众人离去；结合εἰς οἶκον αὐτῶν译为“叫他们回家”，符合现代汉语表达。
- source_word: νήστεις
  choice: 饿着
  rationale: 这里不是强调宗教性的禁食，而是说他们没有吃东西；“饿着”简洁地表达其饥饿状态。
- source_word: εἰς οἶκον αὐτῶν
  choice: 回家
  rationale: 希腊语表示各人回到自己的家；汉语用“回家”即可自然表达这种分配性的含义。
- source_word: ἐκλυθήσονται
  choice: 体力不支
  rationale: 该动词在这里指因饥饿和疲惫而虚弱、支撑不住；“体力不支”自然准确，同时不武断限定为实际昏厥。
- source_word: ἐν τῇ ὁδῷ
  choice: 在路上
  rationale: 直接表达他们返程途中的情形，简洁自然。
- source_word: καί τινες αὐτῶν
  choice: 他们中还有些人
  rationale: 保留καί的附加意味，并自然引出众人中的一部分。
- source_word: ἀπὸ μακρόθεν
  choice: 从远方
  rationale: 指这些人从很远的地方前来；“从远方”庄重而通俗。
- source_word: ἥκασιν
  choice: 来的
  rationale: 希腊语完成时强调他们已经从远方来到、如今仍在这里；汉语“是从远方来的”自然体现其当前身份和来处。
