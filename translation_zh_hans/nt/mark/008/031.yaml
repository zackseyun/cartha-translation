source:
  edition: SBLGNT
  text: Καὶ ἤρξατο διδάσκειν αὐτοὺς ὅτι δεῖ τὸν υἱὸν τοῦ ἀνθρώπου πολλὰ παθεῖν καὶ ἀποδοκιμασθῆναι ⸀ὑπὸ τῶν πρεσβυτέρων καὶ τῶν ἀρχιερέων καὶ τῶν γραμματέων καὶ ἀποκτανθῆναι καὶ μετὰ τρεῖς ἡμέρας ἀναστῆναι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/031.yaml
  text: And he began to teach them that the Son of Man must suffer many things[a], and be rejected by the elders and the chief priests and the scribes, and be killed, and after three days rise again.
translation:
  language: zh_hans
  text: 于是，耶稣开始教导他们：人子必须受许多苦，被长老、祭司长和经学家弃绝，被杀，并在三天后复活。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“在三天之后”；有些译本依惯用表达，或参照说“第三天”的平行经文，译作“第三天”或“三天内”。
    reason: 说明原文时间短语及常见替代译法，避免将马可的措辞与平行经文静默协调。
lexical_decisions:
- source_word: ἤρξατο διδάσκειν
  choice: 开始教导
  rationale: 保留起始体意义，清楚标示叙事转折，同时符合现代汉语表达。
- source_word: δεῖ
  choice: 必须
  rationale: 准确传达强烈的必要性，又不在译文中额外界定这种必要性的机制。
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: 人子
  rationale: 采用这一称号通行而简洁的中文译法，保留其福音书语境及与《但以理书》的互文联系。
- source_word: πολλὰ παθεῖν
  choice: 受许多苦
  rationale: 自然传达 πολλά 与 πάσχω 所表示的广泛而深重的苦难。
- source_word: ἀποδοκιμασθῆναι
  choice: 被……弃绝
  rationale: 既表达拒绝，也保留经审断后不予接纳的正式意味；比单纯的“拒绝”更适合此处。
- source_word: ὑπὸ τῶν πρεσβυτέρων
  choice: 被长老
  rationale: 这里指犹太群体中获承认的领袖阶层，而非泛指年长者。
- source_word: τῶν ἀρχιερέων
  choice: 祭司长
  rationale: 复数在此指主要祭司及祭司领袖阶层，不宜译成多位“大祭司”。
- source_word: τῶν γραμματέων
  choice: 经学家
  rationale: 在现代汉语中较清楚地表达其研习、解释宗教律法与经文的职能，同时保留历史群体的特定性。
- source_word: ἀποκτανθῆναι
  choice: 被杀
  rationale: 直接、自然地传达被动不定式，不额外加入司法处决的限定。
- source_word: μετὰ τρεῖς ἡμέρας
  choice: 在三天之后
  rationale: 按 μετά 加宾格的明文译出“在三天之后”，不与平行经文的“第三天”措辞协调化。
- source_word: ἀναστῆναι
  choice: 复起
  rationale: 保留希腊文主动、不及物的形式及从死亡中起来的含义；避免译成被动的“复活”。
theological_decisions:
- issue: δεῖ 所表达的受难必要性
  choice: 必须
  alternative: 有必要
  rationale: “必须”保留人子受苦、被弃绝、被杀和复起所具有的强烈必要性，但不在译文中进一步说明这种必要性的神学机制。
- issue: μετὰ τρεῖς ἡμέρας 的时间表达
  choice: 在三天之后
  alternative: 第三天；三天内
  rationale: 忠实保留马可在本节的原文措辞，不以其他经文的时间表达取代或协调它。
- issue: ἀναστῆναι 的语态
  choice: 复起
  alternative: 复活；被使复活
  rationale: 原文是不及物主动形式；“复起”既表达从死里起来，又不把语态改为被动，从而不预先消解行动主体方面的表达张力。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“于是”承接上文并引出新的教导阶段；保留受难预告中各被动成分的递进。“经学家”比“文士”更便于现代普通读者理解其身份；“复起”用于保留原文主动形式。脚注标记置于与其所释时间短语相关的整句末尾。
