  text: καὶ ἀναβλέψας ἔλεγεν· Βλέπω τοὺς ἀνθρώπους ὅτι ὡς δένδρα ὁρῶ περιπατοῦντας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/024.yaml
  text: And looking up, he said, “I see people, because I see them walking around like trees.”
translation:
  language: zh_hans
  text: 他抬眼一看，说：“我看见人了；我看见他们好像树木，在走动。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναβλέψας
  choice: 抬眼一看
  rationale: 既保留“向上看”的基本动作，也符合此处恢复视力后尝试看清的语境；不擅自明确为“又看见了”。
- source_word: ἔλεγεν
  choice: 说
  rationale: 未完成时在叙事中自然译为“说”，无需在中文中机械标示持续体。
- source_word: τοὺς ἀνθρώπους
  choice: 人
  rationale: 泛指所见的人群，现代汉语用“人”自然简洁。
- source_word: ὡς δένδρα
  choice: 好像树木
  rationale: 保留明喻及视觉模糊造成的比较，不解释为人的具体形状。
- source_word: περιπατοῦντας
  choice: 在走动
  rationale: 分词在句中描述那些人的活动；“走动”比“到处走”更少加入范围意味。
theological_decisions:
- issue: ὅτι 的句法与语义
  choice: 采用分号并列呈现两次视觉陈述，不把 ὅτι 明确译成单一因果连接词
  alternative: “因为我看见他们好像树木在走动”或“我看见人像树一样走动”
  rationale: ὅτι 可作说明或引出所见内容，原句结构略显突兀；中文以并列重述保存这种张力，也避免强行断定“因为”的逻辑关系。
- issue: ὡς δένδρα 与 περιπατοῦντας 的关系
  choice: “好像树木，在走动”
  alternative: “像走动的树木”
  rationale: 希腊语明确是阳性复数的 περιπατοῦντας，与“人”一致，而非与中性复数“树木”一致；因此走动的是人。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事表达。引语保留病人视觉尚未完全恢复时略显断续的陈述方式；无脚注标记。
