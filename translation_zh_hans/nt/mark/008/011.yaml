    issue: “想要试探他”弱化πειράζοντες的实际施行意义。
    rationale: πειράζοντες是现在分词，描述法利赛人提出要求时所进行／所意图的试探性举动；“想要”可能使其听起来只是尚未实施的愿望。用“来试探他”既自然地表达目的，也不减弱敌对动机。
  - severity: low
    issue: “显一个神迹”搭配略不完整。
    rationale: 现代汉语通常说“显出一个神迹”或“行一个神迹”。“显出”保留所要求的是展示性征兆，避免“行”可能更强的施行色彩。
  - severity: low
    issue: 脚注中“来自上帝的来源或认证”措辞重复。
    rationale: 可改为“出于上帝或由上帝认可”，更符合现代汉语，并准确表达该短语在此处较可能的神圣来源／授权含义。
