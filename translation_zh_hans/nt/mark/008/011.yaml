  text: Καὶ ἐξῆλθον οἱ Φαρισαῖοι καὶ ἤρξαντο συζητεῖν αὐτῷ, ζητοῦντες παρ’ αὐτοῦ σημεῖον ἀπὸ τοῦ οὐρανοῦ, πειράζοντες αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/011.yaml
  text: And the Pharisees came out and began to argue with him[a], seeking from him a sign from heaven, testing him.
translation:
  language: zh_hans
  text: 法利赛人出来，开始同他辩论，要求他显出一个从天上来的神迹[a]，来试探他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “天上”也可译作“天空”；这里更可能是指这神迹具有属天的性质，即出于上帝或由上帝认可。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον
  choice: 出来
  rationale: 保留ἐξέρχομαι所表达的进入当前场景的动作，同时不擅自说明他们从哪里出来。
- source_word: ἤρξαντο συζητεῖν
  choice: 开始同他辩论
  rationale: ἤρξαντο表达动作的开始；在敌意试探的语境中，συζητεῖν不是中性的讨论，而是带有争辩意味的交锋。
- source_word: ζητοῦντες παρ’ αὐτοῦ
  choice: 要求他显
  rationale: ζητοῦντες在此表示向耶稣求取某物；结合敌意挑战的语境，用“要求”比“寻求”更自然。“显”使中文能顺畅连接所要求的神迹，但不额外规定施行方式。
- source_word: σημεῖον
  choice: 神迹
  rationale: σημεῖον本义侧重具有指示、证明作用的“记号”；在福音书此类语境中，“神迹”是普通现代读者最自然的表达，但应理解为用来验证身份或权柄的征象，而不只是超自然奇事。
- source_word: ἀπὸ τοῦ οὐρανοῦ
  choice: 从天上来的
  rationale: 直译保留“天上／天空”的语义形式，也保留其更可能指向来自上帝的来源或认证这一含义，不在正文中将其解释性展开。
- source_word: πειράζοντες αὐτόν
  choice: 想要试探他
  rationale: πειράζω可指检验、考验或试探；此处法利赛人的敌对要求表明其动机并不中立。“想要”自然表达该分词所说明的目的或意图。
theological_decisions:
- issue: “从天上来的神迹”的含义
  choice: 正文保留“从天上来的”，主要可理解为具有属天、即来自上帝的来源或认证
  alternative: 从天空出现的神迹
  rationale: 犹太及福音书语境更支持神圣来源或授权的理解；但οὐρανός也可指天空，因此用脚注保留字面上的另一可能，不把解释直接写死在正文中。
- issue: πειράζοντες所表达的动机
  choice: 试探
  alternative: 考验／检验
  rationale: 上下文具有敌意和挑战性，“试探”能表达其不良动机；同时不将其具体解释成引诱耶稣犯罪。
translation_notes:
  register: 采用现代、自然而庄重的普通话。“同他辩论”保留对抗意味；“要求他显一个……神迹”比逐字译作“向他寻求一个记号”更符合现代汉语，同时保留法利赛人要求验证性征象的意思。
