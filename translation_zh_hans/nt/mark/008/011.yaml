  source_fidelity: “法利赛人出来，开始同他辩论”准确传达ἐξῆλθον、ἤρξαντο及συζητεῖν的进入场景与敌对争辩。“从天上来的”也恰当保留ἀπὸ τοῦ οὐρανοῦ的字面及其神圣来源的语境含义。但“想要试探他”将πειράζοντες弱化为仅是意向；原文分词直接说明他们是在试探他。
  naturalness: 正文整体自然、现代，语体适合叙事文本。“要求他显一个……”虽可理解，但“要求他显出一个……”更合现代汉语搭配，也更清楚表达他们要求耶稣提供一个神迹。末句改为“来试探他”简洁自然，并保留该分词的目的性。
  terminology: “法利赛人”“神迹”“天上”均为稳定且适切的译法。脚注的“来自上帝的来源或认证”表达重复且略显生硬；“出于上帝或由上帝认可”更清楚，且不将正文的含义过度限定。
  issues:
