  text: καὶ ἀφεὶς αὐτοὺς ⸂πάλιν ἐμβὰς⸃ ἀπῆλθεν εἰς τὸ πέραν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/013.yaml
  text: And leaving them[a], he got back into the boat and went to the other side.
translation:
  language: zh_hans
  text: 于是他离开他们，又[a]上了船，往对岸去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “又”也可按旅行语境译为“回到船上”。
    reason: πάλιν可表示“再次”，在此也可表达回到先前所乘的船上。
lexical_decisions:
- source_word: ἀφεὶς
  choice: 离开
  rationale: 此处表示耶稣离开那些人；用“离开”自然准确，并以汉语顺承结构体现分词与主句动作的联系。
- source_word: αὐτοὺς
  choice: 他们
  rationale: 指上文的法利赛人；保留代词即可清楚承接语境。
- source_word: πάλιν
  choice: 又
  rationale: πάλιν可表示“又、再次”，也可在移动语境中表达“回去”。正文用“又”紧接“上了船”，既自然，也保留动作再次发生的意义。
- source_word: ἐμβὰς
  choice: 上了船
  rationale: 该分词意为进入或登上；船虽未明说，却由叙事语境清楚暗示。现代汉语以“上了船”最自然。
- source_word: ἀπῆλθεν
  choice: 去了
  rationale: 表示离去；目的地随后说明，因此译作“去了”简洁流畅。
- source_word: εἰς τὸ πέραν
  choice: 往对岸
  rationale: 马可常用此语表示渡到湖的另一边；“往对岸”保留方向与地理含义。
theological_decisions: []
translation_notes:
  register: 采用现代、简洁而庄重的叙事语言。“于是”承接前文，“又上了船”符合普通话表达；脚注保留πάλιν在修饰范围上的真实歧义。
