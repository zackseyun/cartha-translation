  text: εἶτα πάλιν ⸀ἐπέθηκεν τὰς χεῖρας ἐπὶ τοὺς ὀφθαλμοὺς αὐτοῦ, καὶ ⸂διέβλεψεν καὶ ἀπεκατέστη καὶ ἐνέβλεπεν⸃ τηλαυγῶς ⸀ἅπαντα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/025.yaml
  text: Then again he laid his hands on his eyes[a], and he saw clearly and was restored[b], and he was seeing everything distinctly.
translation:
  language: zh_hans
  text: 接着，耶稣又把双手按在他的眼睛上[a]；他就看清楚了，视力也恢复了，并且能清清楚楚地看见一切[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本采用不同措辞，可译作：“他定睛一看，视力就恢复了，清楚地看见了一切。”
    reason: textual_variant
  - marker: b
    text: 末句也可译作：“他一直清楚地看见一切。”原文用未完成时动词配合表示清晰视觉的副词，既可强调持续看见，也可着重表达恢复后能够看清的状态。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶτα πάλιν
  choice: 接着……又
  rationale: εἶτα表示事件的先后推进，πάλιν表示动作重复；“接着……又”自然保留两层意思。
- source_word: ἐπέθηκεν τὰς χεῖρας ἐπὶ τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: 把双手按在他的眼睛上
  rationale: 保留复数“手”和具体的医治动作；“按在”符合现代汉语叙事习惯。主语补作“耶稣”，避免汉语中指代不清。
- source_word: διέβλεψεν
  choice: 看清楚了
  rationale: διαβλέπω在这里表示清楚看见或恢复清晰视觉；此译法符合从模糊到清楚的上下文，也不引入异文所可能支持的“定睛看”。
- source_word: ἀπεκατέστη
  choice: 视力也恢复了
  rationale: ἀποκαθίστημι表示恢复到原有或正常状态；结合眼睛得医治的语境，明示“视力”在汉语中更自然，但不扩展为笼统的身体医治。
- source_word: ἐνέβλεπεν
  choice: 能……看见
  rationale: 未完成时在这一连串不定过去时之后描写持续或结果状态。汉语缺少相同形态对立，用“能……看见”自然表达恢复后持续具备视觉的状态，不误译为“开始看见”。
- source_word: τηλαυγῶς
  choice: 清清楚楚地
  rationale: 该副词强调视觉清晰、分明，也可能隐含远处也能看清的色彩；正文采用自然的“清清楚楚地”，较窄的距离含义不强加于正文。
- source_word: ἅπαντα
  choice: 一切
  rationale: 中性复数在此概括所见的全部事物；“一切”简洁地保留其全面性。
theological_decisions:
- issue: 两阶段医治的叙事进程
  choice: 保留“又—看清楚—恢复—持续能清楚看见”的递进次序
  alternative: 把各动词合并为一次完成的医治，或全部译成无差别的完成动作
  rationale: 原文以连续动词叙述，并以未完成时ἐνέβλεπεν收束，呈现医治逐步完成并进入持续结果状态。译文不解释这一过程的神学原因，也不把它抹平。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。以分号呈现动作推进，避免连续多个“并且”造成生硬；“清清楚楚”虽属常用叠词，在此仍保持端正自然。所有脚注标记均已置于正文。
