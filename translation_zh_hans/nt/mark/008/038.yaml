  text: ὃς γὰρ ἐὰν ἐπαισχυνθῇ με καὶ τοὺς ἐμοὺς λόγους ἐν τῇ γενεᾷ ταύτῃ τῇ μοιχαλίδι καὶ ἁμαρτωλῷ, καὶ ὁ υἱὸς τοῦ ἀνθρώπου ἐπαισχυνθήσεται αὐτὸν ὅταν ἔλθῃ ἐν τῇ δόξῃ τοῦ πατρὸς αὐτοῦ μετὰ τῶν ἀγγέλων τῶν ἁγίων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/038.yaml
  text: For whoever is ashamed of me and of my words in this adulterous and sinful generation[a], the Son of Man will also be ashamed of him when he comes in the glory of his Father with the holy angels.
translation:
  language: zh_hans
  text: 因为，凡在这淫乱、罪恶的世代中以我和我的话为耻的人，当人子在他父的荣耀中同圣天使降临时，也要以这人为耻。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “淫乱”也可理解为“不忠”。原文沿用具体的先知性比喻，以婚姻不忠描绘对神的不忠。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαισχυνθῇ / ἐπαισχυνθήσεται
  choice: 以……为耻 / 也要以……为耻
  rationale: 直接表达该动词的羞耻含义，并保留人在现今的回应与人子将来的回应之间鲜明的对应关系；“不认”比原词本身更强。
- source_word: λόγους
  choice: 话
  rationale: 保留希腊文复数所指的言语整体；现代汉语中“我的话”自然庄重，也不像“信息”那样偏向解释。
- source_word: γενεᾷ
  choice: 世代
  rationale: 既可指当时的人群，也带有其所处时代的意味，符合本句的社会与道德语境。
- source_word: μοιχαλίδι
  choice: 淫乱
  rationale: 保留原文具体而尖锐的先知性比喻，不直接化解为“背信”；在汉语中与“世代”搭配自然。
- source_word: ἁμαρτωλῷ
  choice: 罪恶的
  rationale: 准确传达其“有罪、受罪支配”的道德性质；“邪恶”可能增添原词未必要求的强度。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人子
  rationale: 采用通行的圣经称号，保留其自指性、弥赛亚意义及但以理书背景，不改写成“我”或“弥赛亚”。
- source_word: δόξῃ
  choice: 荣耀
  rationale: 保留神圣尊荣与荣光的双重意味，也是现代汉语圣经语体中自然且有神学分量的表达。
- source_word: μετὰ τῶν ἀγγέλων τῶν ἁγίων
  choice: 同圣天使
  rationale: 忠实表达定冠结构中的属性关系；原文没有“他的”，因此不补入所属关系。
- source_word: ὃς γὰρ ἐὰν
  choice: 因为，凡……的
  rationale: “凡……的”自然表达泛指条件，“因为”保留 γάρ 与上文的解释性连接。
- source_word: ὅταν ἔλθῃ
  choice: 降临的时候
  rationale: “来”是字面对应，但此处指人子末后的显现；“降临”是自然且不额外限定具体方式的汉语表达。
theological_decisions:
- issue: “淫乱”的比喻意义
  choice: 正文保留“淫乱”，脚注说明也可理解为“背信”。
  alternative: 正文译作“背信”或“不忠”。
  rationale: μοιχαλίδι 使用通奸/淫乱这一具体的先知性比喻，可能指向对神的不忠；保留比喻可维持经文的互文性与张力。
- issue: “人子”的所指
  choice: 保留称号“人子”。
  alternative: 译作“我”或“弥赛亚”。
  rationale: 原文刻意使用具有末世与基督论意义的称号；以代词或解释性称号替换会消除原有表达层次。
- issue: αὐτόν 的泛指单数
  choice: 译作“他”。
  alternative: 译作“他们”或省略宾语。
  rationale: 原文以阳性单数代词承接泛指单数结构；汉语“凡……的……他”能够保留这种逐人对应的表达。
- issue: “他父的荣耀”中所属关系
  choice: 按原文译作“他父的荣耀”。
  alternative: 译作“父神的荣耀”或“他父所赐的荣耀”。
  rationale: 原文只说明荣耀与父的所属关系，没有明确说荣耀由父赐予；因此不补充来源或身份解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“以……为耻”的重复保留原文的对应结构；“在他父的荣耀里同圣天使降临”维持原文语序和末世语气，同时避免补入原文没有的“他的圣天使”。
