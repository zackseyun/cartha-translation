  yaml_path: translation/nt/mark/008/021.yaml
  text: And he was saying to them[a], “Do you not yet understand?”
translation:
  language: zh_hans
  text: 他对他们说：“你们还不明白吗？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们到现在还不明白吗？”
    reason: οὔπω 可译为“还不”或更明确地译为“到现在还不／尚未”；后者突出截至说话时仍未明白的意味。
lexical_decisions:
- source_word: καὶ
  choice: 又
  rationale: 承接前文耶稣接连发问的语境；“又”自然表达简单的叙事连接，同时不强化为明确的时间先后。
- source_word: ἔλεγεν
  choice: 对……说
  rationale: 这是 λέγω 的未完成过去时。汉语在此用“说”最自然；连续或反复的意味可由前后文中连串的问题体现，不必生硬译成“一直说”。
- source_word: αὐτοῖς
  choice: 他们
  rationale: 原文只有第三人称复数代词，并未在本节明说“门徒”，因此保留为“他们”，不把上下文中的指代对象直接加入正文。
- source_word: Οὔπω
  choice: 还不
  rationale: οὔπω 表示“尚未、还没有”。在否定疑问句中，“还不”既自然，也保留直到此刻仍未明白的责问意味。
- source_word: συνίετε
  choice: 明白
  rationale: συνίημι 在这里指领会、理解；“明白”是现代汉语中清楚自然的表达，也不额外补出原文未明说的宾语。
theological_decisions:
- issue: 是否为“明白”补出“这件事”“我的意思”等宾语
  choice: 不补宾语：“你们还不明白吗？”
  alternative: 你们还不明白这件事吗？
  rationale: 希腊文没有明说宾语。保留开放式问句，既维持耶稣责问的广度，也避免把问题限定为译者所指定的某一事项。
- issue: 如何表达 οὔπω 所含“直到现在仍未”的意味
  choice: 还不
  alternative: 尚未／到现在还不
  rationale: “还不”在现代口语和庄重叙事中都自然，能表达持续至今的未理解状态；脚注列出更显明时间意味的译法。
translation_notes:
  register: 采用现代、简洁而庄重的叙事语言。“他又对他们说”忠实保留代词，不将“他们”解释性改写为“门徒”；问句不补宾语，以保存原文的开放性和责问力度。
