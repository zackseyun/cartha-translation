  text: καὶ ἀναστενάξας τῷ πνεύματι αὐτοῦ λέγει· Τί ἡ γενεὰ αὕτη ⸂ζητεῖ σημεῖον⸃; ἀμὴν λέγω ⸀ὑμῖν, εἰ δοθήσεται τῇ γενεᾷ ταύτῃ σημεῖον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/012.yaml
  text: And sighing deeply in his spirit[a], he says, “Why does this generation seek a sign? Truly I say to you, no sign will be given to this generation.”
translation:
  language: zh_hans
  text: 他在灵里深深叹息，说：“这世代为什么求神迹呢？我实在告诉你们，绝不会有神迹赐给这世代。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 按字面可译为“如果有神迹赐给这世代”；这是希腊文中带有誓言意味的表达，意思是绝不会有神迹赐下。
    reason: 说明誓言式 εἰ 从句的字面形式及其实际含义
lexical_decisions:
- source_word: ἀναστενάξας
  choice: 深深叹息
  rationale: 该词带有加强意味，表示深沉的叹息或呻吟；“深深叹息”既传达情感力度，又符合现代汉语表达。
- source_word: τῷ πνεύματι αὐτοῦ
  choice: 在灵里
  rationale: 保留希腊文有关“灵”的表述，并体现此处的范围与层面；相比“暗自”或“心里”，不把原文仅仅化约为心理活动。
- source_word: λέγει
  choice: 说
  rationale: 原文使用历史现在时，使叙述更生动；现代汉语的“说”不标明时态，可自然承接这一叙事效果。
- source_word: Τί
  choice: 为什么
  rationale: τί 在此与动词连用，表达询问原因，译为“为什么”自然且准确。
- source_word: γενεὰ
  choice: 世代
  rationale: “世代”保留了该词兼具群体和时代的含义，也符合本段对当代人的整体指称。
- source_word: ζητεῖ
  choice: 求
  rationale: “求”直接表达寻求或索求，不像“强求”或“要求”那样额外强化对抗语气。
- source_word: σημεῖον
  choice: 神迹
  rationale: 在本语境中指用来证实身份或权柄的超自然记号；“神迹”是现代中文圣经语境中清楚、通行的表达。
- source_word: ἀμὴν λέγω ὑμῖν
  choice: 我实在告诉你们
  rationale: 这是耶稣言语中庄严强调的固定表达；此译法自然，并保留其郑重语气。
- source_word: εἰ δοθήσεται τῇ γενεᾷ ταύτῃ σημεῖον
  choice: 绝不会有神迹赐给这世代
  rationale: εἰ 在此用于闪语式的省略誓言，实际表达强烈否定；“绝不会”明确传达其语用力量，而脚注保留其字面形式。
theological_decisions:
- issue: 如何翻译 ἀμὴν λέγω ὑμῖν 之后带 εἰ 的誓言式从句
  choice: 按强烈否定译为“绝不会有神迹赐给这世代”
  alternative: 按字面译为“如果有神迹赐给这世代”
  rationale: 原句是省略誓言后果的惯用表达，意思并非提出条件，而是郑重否认。正文明确其实际含义，脚注则让读者看见原文的特殊形式。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“在灵里”略带圣经语体，以保留原文的人论措辞；其余句式力求口语可懂而不失郑重。脚注标记置于其实际所说明的否定誓言句之后。
