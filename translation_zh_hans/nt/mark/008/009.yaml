  text: ἦσαν ⸀δὲ ὡς τετρακισχίλιοι. καὶ ἀπέλυσεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/009.yaml
  text: There were about four thousand[a], and he sent them away.
translation:
  language: zh_hans
  text: 人数约有四千。耶稣遣散了他们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦσαν
  choice: 人数……有
  rationale: 这里的 εἰμί 表存在或数量；结合上下文，译为“人数……有”自然地说明群众规模，并避免中文“他们是”造成谓语不完整。
- source_word: δὲ
  choice: 不单独译出
  rationale: δέ 是轻微的承接成分；中文以分句衔接即可自然体现，不必硬译成“现在”或“而”。
- source_word: ὡς
  choice: 约
  rationale: ὡς 与数词连用表示概数，“约”简洁、自然，并保留人数并非精确统计的含义。
- source_word: τετρακισχίλιοι
  choice: 四千
  rationale: 按原文直译该数词；其所指为上下文中的群众人数。
- source_word: ἀπέλυσεν
  choice: 让……散去
  rationale: ἀπολύω 在此指遣散群众。“让他们散去”符合现代汉语叙事习惯，也保留了耶稣准许或吩咐众人离开的语义。
- source_word: αὐτούς
  choice: 他们
  rationale: 该代词回指在场的群众，译作“他们”清楚自然。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“耶稣”由上下文明确补出主语，以免两个分句在中文中衔接含混；不增加原文未表达的时间意味。英文咨询层的脚注似乎错置：其正文“sent them away”与脚注“dismissed them”均对应 ἀπέλυσεν 的近义译法，但脚注标记却附在人数之后，因此中文稿不沿用该标记，以免误导读者。
