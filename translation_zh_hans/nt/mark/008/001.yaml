base_translation:
  language: en
  yaml_path: translation/nt/mark/008/001.yaml
  text: In those days[a], when again a large crowd was present and they had nothing to eat, he called his disciples and says to them[b],
translation:
  language: zh_hans
  text: 在那些日子，又有一大群人在场，并且没有什么可吃的；耶稣把门徒叫来，对他们说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν ἐκείναις ταῖς ἡμέραις
  choice: 那些日子
  rationale: 采用自然、庄重的现代汉语时间表达，保留叙事背景而不额外限定持续时间。
- source_word: πάλιν πολλοῦ ὄχλου ὄντος
  choice: 又有一大群人聚集
  rationale: “又”体现类似情形再次发生；将属格独立结构自然转换为汉语背景分句。“聚集”符合群众在场的语境。
- source_word: καὶ μὴ ἐχόντων τί φάγωσιν
  choice: 并且没有什么可吃的
  rationale: 清楚表达这群人缺少食物，并保留原文 τί φάγωσιν 的惯用意义。
- source_word: προσκαλεσάμενος τοὺς μαθητάς
  choice: 叫门徒来
  rationale: 表达 προσκαλέομαι 召来身边的含义，同时避免生硬直译；原文定冠词在汉语中无需强行译出所有格。
- source_word: λέγει αὐτοῖς
  choice: 对他们说
  rationale: 现代汉语动词本身通常不标示过去或现在，因此可自然承载马可所用历史现在时，而无需另加时态词。
theological_decisions:
- issue: 马可叙事中的历史现在时 λέγει
  choice: 译作不标时态的“对他们说”
  alternative: 用“就对他们说”加强叙事推进，或刻意加“现在对他们说”
  rationale: 汉语“说”不以形态标明时态，既忠实于希腊文事件叙述，也不人为把历史现在时解释成现实现在或显式过去时；此处不涉及教义取舍。
translation_notes:
  register: 采用现代标准普通话书面语，句式清楚而庄重。“又有一大群人聚集”顺应汉语表达，并保留原文属格独立结构所提供的背景信息。以“耶稣”明确原文省略但由上文确定的主语，避免汉语中指代不清。
