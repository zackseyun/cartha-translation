  text: Σπλαγχνίζομαι ἐπὶ τὸν ὄχλον ὅτι ἤδη ἡμέραι τρεῖς προσμένουσίν μοι καὶ οὐκ ἔχουσιν τί φάγωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/002.yaml
  text: I have compassion on the crowd, because they have already remained with me for three days and have nothing to eat.
translation:
  language: zh_hans
  text: 我怜悯这群人，因为他们留在我这里已经三天了，也没有东西可吃。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σπλαγχνίζομαι
  choice: 我怜悯
  rationale: 该动词表达发自内心的深切怜悯。“我怜悯”简洁、庄重，并保留希腊文现在时的直接陈述。
- source_word: ἐπὶ τὸν ὄχλον
  choice: 这群人
  rationale: ἐπί加宾格在此标明怜悯的对象；汉语用“怜悯这群人”自然表达，无须另译介词。定冠词结合语境译为“这”。
- source_word: ὅτι
  choice: 因为
  rationale: ὅτι引出耶稣怜悯众人的原因，译作“因为”清楚自然。
- source_word: ἤδη ἡμέραι τρεῖς
  choice: 已经三天了
  rationale: “已经……了”自然表达ἤδη所强调的、截至此时已持续三天的状态。
- source_word: προσμένουσίν μοι
  choice: 他们跟我在一起
  rationale: προσμένω在此表示继续留在某人身边；“跟我在一起”既自然，也保留持续陪伴、未离开的含义。持续性由上下文中的“已经三天了”表达。
- source_word: οὐκ ἔχουσιν τί φάγωσιν
  choice: 现在没有什么可吃的
  rationale: 该结构表示没有可供他们吃的东西。“没有什么可吃的”是自然准确的汉语；“现在”在汉语中承接三天后的当前处境，使句意顺畅，但不改变原文所述的现状。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语自然的叙事语言。“怜悯”保留较深的情感与圣经语体；全句避免生硬照搬希腊语序，同时保持因果关系、三天的持续时间和缺乏食物的现状。
