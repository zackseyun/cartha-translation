  yaml_path: translation/nt/mark/008/016.yaml
  text: And they were discussing with one another that they had no bread[a].
translation:
  language: zh_hans
  text: 他们彼此议论，说他们没有饼。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διελογίζοντο
  choice: 议论
  rationale: 未完成时表达持续进行的交谈或思量；“议论”自然地体现门徒之间正在相互讨论，同时保留该词可含推想、争辩的语义空间。
- source_word: πρὸς ἀλλήλους
  choice: 彼此
  rationale: 该短语表示相互互动；“彼此议论”是简洁、自然的现代汉语表达。
- source_word: ὅτι
  choice: 是因为
  rationale: ὅτι在此既可引出议论的内容，也可能带因由色彩。结合前文耶稣关于酵的警告，门徒似乎把警告理解为与没带饼有关；正文采用自然的“是因为”，并以脚注保留内容从句的译法。
- source_word: ἄρτους
  choice: 饼
  rationale: ἄρτους是ἄρτος的复数，指可数的饼；汉语“饼”本身可按语境作集合性或可数理解，也与上下文数算饼的叙事相衔接。
- source_word: οὐκ ἔχουσιν
  choice: 没有
  rationale: 希腊文用现在时，置于过去时叙事中的间接话语内。现代汉语通常无需像英语那样进行时态回移，“没有”自然表达门徒当时所处的状况。
theological_decisions:
- issue: ὅτι所引从句是议论内容还是原因
  choice: 正文译作“是因为没有饼”
  alternative: “他们彼此议论，说他们没有饼”
  rationale: 两种句法理解均有依据。上下文支持门徒把耶稣的话归因于缺饼，但直译也可理解为他们谈论“没有饼”这一事实；脚注保留后者，避免把歧义完全消除。
translation_notes:
  register: 采用现代、简洁而庄重的叙事语言。“彼此议论”通顺易懂；“饼”贴合一世纪语境及本段关于饼数目的上下文。
