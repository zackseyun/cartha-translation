  text: ὀφθαλμοὺς ἔχοντες οὐ βλέπετε καὶ ὦτα ἔχοντες οὐκ ἀκούετε; καὶ οὐ μνημονεύετε
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/018.yaml
  text: Having eyes[a], do you not see? And having ears, do you not hear? And do you not remember?
translation:
  language: zh_hans
  text: 你们有眼睛，却看不见吗？有耳朵，却听不见吗？你们还不记得吗？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀφθαλμοὺς ἔχοντες
  choice: 有眼睛，却……吗
  rationale: 分词结构在此具有让步和责问意味；汉语用“有……却……”自然传达这种张力，也保留眼睛这一具体意象。
- source_word: βλέπετε
  choice: 看不见
  rationale: 采用“看”这一普通感官动词，不在正文中直接解释为“领悟”，让上下文表达属灵迟钝的深层含义。
- source_word: ὦτα ἔχοντες
  choice: 有耳朵，却……吗
  rationale: 与前一句保持平行，重现原文反复而递进的责问结构。
- source_word: ἀκούετε
  choice: 听不见
  rationale: 保留“听”这一基本词义；虽然语境可能兼含听从或理解之意，但不在正文中将其单一化。
- source_word: μνημονεύετε
  choice: 还不记得
  rationale: “记得”是现代汉语中直接自然的对应表达；“还”体现连续责问及在先前经历之后仍未记住的语用意味。
- source_word: καὶ
  choice: 还／句间并列
  rationale: 原文连续使用καὶ形成累积语势；汉语前两问以并列句式连接，末问用“还”自然呈现递进。
- source_word: οὐ / οὐκ
  choice: 不
  rationale: 在三个反问句中以否定形式保留原文责问语气。
theological_decisions:
- issue: “看”与“听”是纯感官意义还是比喻性的属灵领悟
  choice: 正文保留具体动词“看”和“听”，由语境暗示领悟与理解层面的含义。
  alternative: 译作“察觉”和“明白”，直接点出比喻意义。
  rationale: 希腊文使用普通的感官动词，而语境及其先知性回响赋予其更深含义；保留具体措辞可维持原文意象、含混性及神学张力。
translation_notes:
  register: 采用现代、庄重而口语可懂的责问句式。“有眼睛，却看不见吗？有耳朵，却听不见吗？”在简体中文中自然，并保留原文的平行结构和修辞力度。未设置脚注，因为正文已能兼顾直译意象与语境暗示，无需用注释解决其刻意保留的双重意味。
