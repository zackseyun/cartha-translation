  yaml_path: translation/nt/mark/008/005.yaml
  text: And he asked them, “How many loaves do you have?” They said, “Seven.”
translation:
  language: zh_hans
  text: 他问他们：“你们有多少个饼？”他们说：“七个。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: （不单独译出）
  rationale: 此处是常见的叙事连接词。汉语直接承接上文更自然，不必机械译作“于是”或“又”，以免增添希腊文未明确表达的时间或重复意味。
- source_word: ἠρώτα
  choice: 问
  rationale: ἐρωτάω的未完成过去时在此叙事语境中可自然译为一次完整的提问；汉语“问”简洁清楚，无须刻意译成持续体。
- source_word: αὐτούς
  choice: 他们
  rationale: 宾格复数代词，依语境指门徒。
- source_word: Πόσους
  choice: 多少个
  rationale: 与可数的复数名词ἄρτους搭配，译作“多少个”符合现代汉语计数问句。
- source_word: ἔχετε
  choice: 你们有
  rationale: 直译第二人称复数现在时，并保持自然的汉语问句语序。
- source_word: ἄρτους
  choice: 饼
  rationale: ἄρτος在此指可逐个计数的饼。译作“饼”既符合一世纪语境，也比不可数的“面包”更适合与数量词搭配。
- source_word: οἱ δὲ εἶπαν
  choice: 他们说
  rationale: δέ在问答转换中不必强译为“但是”；εἶπαν本义为“说”，故保留简洁的回应形式，而不改作解释性的“回答”。
- source_word: Ἑπτά
  choice: 七个
  rationale: 原文只说“七”，所指的“饼”可由上下文补足。现代汉语答数量时加量词“个”更自然，同时不重复名词。
theological_decisions: []
translation_notes:
  register: 采用现代、自然而庄重的叙事语言。问答简短直接，保留马可叙事的朴素节奏；“饼”沿用圣经语境中清楚且易懂的常用词。
