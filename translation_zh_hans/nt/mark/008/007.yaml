  text: καὶ εἶχον ἰχθύδια ὀλίγα· καὶ εὐλογήσας ⸀αὐτὰ εἶπεν ⸂καὶ ταῦτα παρατιθέναι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/007.yaml
  text: And they had a few small fish[a]; and after blessing them[b], he said to set these also before them.
translation:
  language: zh_hans
  text: 他们还有几条小鱼；耶稣祝福了这些小鱼后[a]，吩咐也把这些摆上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“为这些小鱼献上感谢后”。在用餐语境中，“祝福”可包含向上帝称颂、感谢之意。
    reason: lexical_alternative
  - marker: b
    text: “摆上”也可译作“端给众人”。原文在此没有明说执行者；受供者可从上下文推知。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰχθύδια ὀλίγα
  choice: 几条小鱼
  rationale: ἰχθύδια 是指鱼的指小形式，ὀλίγα 表示数量不多；“几条小鱼”既保留两层含义，也符合现代汉语量词习惯。
- source_word: εὐλογήσας αὐτά
  choice: 为这些祝福后
  rationale: 分词表示先于主句发生的动作；αὐτά 为中性复数，回指小鱼。“为这些祝福”保留 εὐλογέω 的基本意义及其宾语关系，不径自改译为“献上感谢”。
- source_word: εἶπεν
  choice: 吩咐
  rationale: εἶπεν 本义是“说”，但其后不定式在这里表达指令；汉语用“吩咐”可自然传达这一句法功能，且避免生硬的“说要……”。
- source_word: καὶ ταῦτα
  choice: 这些也
  rationale: “也”保留 καί 的附加意义，“这些”保留 ταῦτα 对小鱼的指示和强调。
- source_word: παρατιθέναι
  choice: 摆上
  rationale: παρατίθημι 在供餐语境中指把食物摆到人面前、供人食用；“摆上”简洁自然，并保留动作意象，脚注补充动态译法。
theological_decisions:
- issue: εὐλογήσας 在用餐语境中的含义
  choice: 为这些祝福
  alternative: 献上感谢
  rationale: 原文使用 εὐλογέω 而非 εὐχαριστέω；译文保留“祝福”，不将二者完全等同，同时脚注说明语境上的可能理解。
- issue: εἶπεν 加不定式所表达的指令
  choice: 吩咐把这些也摆上
  alternative: 说要把这些也摆上
  rationale: 该结构带有命令或指示作用；“吩咐”在现代汉语中更自然，但不补出原文未明说的受命者。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。“耶稣”承接上下文，补明希腊文省略的主语；不补出门徒或众人，以保留原句在执行者和接受者上的含蓄。
