source:
  edition: SBLGNT
  text: Καὶ ἐξῆλθεν ὁ Ἰησοῦς καὶ οἱ μαθηταὶ αὐτοῦ εἰς τὰς κώμας Καισαρείας τῆς Φιλίππου· καὶ ἐν τῇ ὁδῷ ἐπηρώτα τοὺς μαθητὰς αὐτοῦ λέγων αὐτοῖς· Τίνα με λέγουσιν οἱ ἄνθρωποι εἶναι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/027.yaml
  text: And Jesus went out[a], with his disciples, to the villages of Caesarea Philippi. And on the way he was asking his disciples, saying to them, “Who do people say that I am?”
translation:
  language: zh_hans
  text: 耶稣和他的门徒出去，往凯撒利亚·腓立比一带的村庄去。路上，他问门徒说：“人们说我是谁？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: 出去
  rationale: 保留ἐξέρχομαι的基本移动含义；“出去”自然简明，不额外推断具体出发地点。
- source_word: κώμας
  choice: 村庄
  rationale: κώμη通常指规模小于城市的村落或乡间聚居地，“村庄”准确而通俗。
- source_word: Καισαρείας τῆς Φιλίππου
  choice: 凯撒利亚·腓立比
  rationale: 采用现代中文圣经地名的通行音译，并以间隔号清楚标示复合专名。
- source_word: εἰς τὰς κώμας Καισαρείας τῆς Φιλίππου
  choice: 往凯撒利亚·腓立比一带的村庄去
  rationale: 属格短语表示与凯撒利亚·腓立比相关或其周边的村庄；加入“一带”可避免误解为该城本身由多个村庄组成。
- source_word: ἐν τῇ ὁδῷ
  choice: 路上
  rationale: 既贴合字面，也以自然现代汉语保留马可叙事中的行路意象。
- source_word: ἐπηρώτα
  choice: 问
  rationale: 希腊语未完成时把询问置于行路过程的叙事背景中；中文借“路上”已自然表达这一过程，不用“不断问”以免把持续或反复意味说得过强。
- source_word: λέγων αὐτοῖς
  choice: 说
  rationale: 用“问门徒说”自然保留希腊语“询问……对他们说”的结构，同时避免生硬重复代词。
- source_word: Τίνα με λέγουσιν οἱ ἄνθρωποι εἶναι;
  choice: 人们说我是谁？
  rationale: τίνα与εἶναι询问身份；“人们”准确表达ἄνθρωποι在此处泛指一般大众，并保留λέγουσιν的现在时语感。
- source_word: οἱ μαθηταὶ αὐτοῦ / τοὺς μαθητὰς αὐτοῦ
  choice: 他的门徒 / 门徒
  rationale: 首次出现时明译所有关系；同句再次出现时省去中文语境中多余的“他的”，所指仍然清楚。
theological_decisions:
- issue: 耶稣问题中的泛指ἄνθρωποι
  choice: 人们
  alternative: 众人；人
  rationale: 这里指一般大众，并非专指男性；“人们”准确保留其泛指范围，不引入性别限制。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。句式清楚，保留原文的行程推进和直接引语；不以“不断问”等措辞过度解释未完成时，也不为本节无必要地增设脚注。
