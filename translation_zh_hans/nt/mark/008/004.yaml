  text: καὶ ἀπεκρίθησαν αὐτῷ οἱ μαθηταὶ αὐτοῦ ⸀ὅτι Πόθεν τούτους δυνήσεταί τις ὧδε χορτάσαι ἄρτων ἐπ’ ἐρημίας;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/004.yaml
  text: And his disciples answered him[a], “From where will anyone be able to satisfy these people with bread here in a desolate place?”
translation:
  language: zh_hans
  text: 他的门徒回答他说：“在这荒野之地，从哪里能弄到饼，让这些人吃饱呢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: 回答
  rationale: 这是叙事中常见的回应动词；“回答”直接、自然。
- source_word: ὅτι
  choice: 用冒号和引号表示直接引语
  rationale: 此处引出直接话语，现代汉语通常不另译“说”。
- source_word: Πόθεν
  choice: 从哪里
  rationale: 保留原文对供应来源的追问，不将其解释性地改成“怎么”。
- source_word: τούτους
  choice: 这些人
  rationale: 代词指在场的群众；“这些人”明确所指，又不局限于男性。
- source_word: δυνήσεταί τις
  choice: 谁能
  rationale: 用自然的汉语反问表达不定代词与能力含义；其前瞻意味由语境充分体现。
- source_word: ὧδε
  choice: 在这
  rationale: 与“荒野之地”合译，简洁表达“这里”的地点含义。
- source_word: χορτάσαι
  choice: 让……吃饱
  rationale: 准确表达以食物充分满足、使人饱足的意思，也比抽象的“满足”更符合现代汉语饮食语境。
- source_word: ἄρτων
  choice: 饼
  rationale: “饼”是圣经语境中 ἄρτος 的简洁常用对应，既保留具体食物，也不泛化成“食物”。
- source_word: ἐπ’ ἐρημίας
  choice: 荒野之地
  rationale: 表达无人居住、缺乏供应的荒凉区域，同时保留“荒野”的语境色彩。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语自然的叙事表达。“谁能从哪里弄到饼”刻意保留 Πόθεν（从哪里）与 δύναμαι（能够）并存的结构及其略显强烈的反问语气，不将问题简化为单纯的“怎么喂饱”。
