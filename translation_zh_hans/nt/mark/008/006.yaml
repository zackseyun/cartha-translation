  text: καὶ ⸀παραγγέλλει τῷ ὄχλῳ ἀναπεσεῖν ἐπὶ τῆς γῆς· καὶ λαβὼν τοὺς ἑπτὰ ἄρτους εὐχαριστήσας ἔκλασεν καὶ ἐδίδου τοῖς μαθηταῖς αὐτοῦ ἵνα ⸀παρατιθῶσιν καὶ παρέθηκαν τῷ ὄχλῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/006.yaml
  text: And he instructed the crowd to recline on the ground[a]. Then, taking the seven loaves, after giving thanks he broke them and kept giving them to his disciples so that they might set them before the crowd[b], and they set them before the crowd.
translation:
  language: zh_hans
  text: 他吩咐众人坐在地上[a]。随后，他拿起那七个饼，献上感谢，就掰开饼，递给门徒，让他们把饼摆在众人面前[b]；门徒就把饼摆在众人面前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “坐”原文更具体地指用餐时斜倚就席。
    reason: lexical_alternative
  - marker: b
    text: 或译“让他们分给众人”。原文直译是“摆在……面前”，在这里有供应食物的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγγέλλει
  choice: 吩咐
  rationale: 表示带有权威的指示或命令；“吩咐”在现代汉语叙事中自然，也保留其权威意味。希腊文的历史现在时按汉语叙事习惯处理，不刻意标示。
- source_word: ἀναπεσεῖν
  choice: 坐下
  rationale: 该词在用餐场景中更具体地指斜倚就席，但现代汉语直译为“斜倚”容易显得生硬或引起姿势上的误解；正文用自然的“坐下”，脚注保留原词的用餐姿态含义。
- source_word: ἐπὶ τῆς γῆς
  choice: 在地上
  rationale: 此处指众人就坐的地面，“在地上”准确而自然。
- source_word: λαβὼν τοὺς ἑπτὰ ἄρτους
  choice: 拿起那七个饼
  rationale: ἄρτοι在此指作为食物的饼；“七个饼”符合圣经语境及现代汉语表达。“那”承接上文已经提到的七个饼。
- source_word: εὐχαριστήσας
  choice: 献上感谢
  rationale: 表达为食物感谢的动作，同时不擅自补出希腊文未明说的受词“神”，也不引入圣餐术语。
- source_word: ἔκλασεν
  choice: 掰开
  rationale: 上下文中的受词是饼；汉语“掰开”能自然呈现分饼的具体动作，无须重复“饼”。
- source_word: ἐδίδου
  choice: 递给
  rationale: 未完成时显示持续或反复把饼交给门徒；汉语叙事中“递给”结合分发场景可自然传达这一过程，而不增加累赘的体貌标记。
- source_word: ἵνα παρατιθῶσιν
  choice: 让他们摆在众人面前
  rationale: 保留ἵνα的目的意味，也保留παρατίθημι“摆在……面前”的具体图像；脚注说明可按功能理解为“分给／服侍”。
- source_word: παρέθηκαν
  choice: 门徒就摆在众人面前
  rationale: 与前一παρατιθῶσιν保持词汇呼应，并明确汉语中容易含混的主语是门徒；受词由上文可知，故不强行补出。
- source_word: ὄχλος
  choice: 众人
  rationale: “众人”在现代汉语福音书叙事中简洁自然，比“群众”庄重，也比“人群”更适合作为接受食物的群体。
theological_decisions:
- issue: 感谢用语与圣餐含义
  choice: 按普通用餐语境译为“献上感谢”，不使用专门的圣餐术语，也不明说感谢的对象。
  alternative: 译为“祝谢”或“向神献上感谢”，强化圣餐联想或补明对象。
  rationale: εὐχαριστήσας本身表明感谢，却没有在本句明说受词。译文保留其可能引发的礼仪共鸣，但不把这种共鸣扩展为本节未明言的教义。
- issue: 递饼动作的持续性
  choice: 以自然汉语动作链“掰开，递给门徒”呈现，并在词汇决策中保留未完成时的持续／反复意味。
  alternative: 明确译为“一再递给”或“不断递给”。
  rationale: 希腊文ἐδίδου可呈现持续或反复动作，但汉语若加“一再／不断”可能造成不必要的强调；上下文中的分发过程已能承载这一体貌意味。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。以“吩咐”“献上感谢”“掰开”“摆在众人面前”保留原文动作次序和具体意象；正文优先自然可读，较陌生的古代用餐姿势及παρατίθημι的功能性译法放入脚注。所有脚注标记均已在正文中出现。
