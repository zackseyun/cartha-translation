base_translation:
  language: en
  yaml_path: translation/nt/mark/008/008.yaml
  text: And they ate and were satisfied[a], and they picked up seven baskets of leftover pieces.
translation:
  language: zh_hans
  text: 他们吃了，也吃饱了；又收拾了七筐剩下的碎块[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里译作“筐”的希腊词是σπυρίς，可能指容量较大的筐；马可记述五千人吃饱时所用的是另一个词κόφινος（6:43）。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφαγον
  choice: 吃了
  rationale: 不定过去时主动直陈语气，平实叙述众人进食；“吃了”自然准确，不额外加强语气。
- source_word: ἐχορτάσθησαν
  choice: 吃饱了
  rationale: χορτάζω在此指吃到满足、足够；现代汉语“吃饱了”比直译“得了饱足”自然，也清楚表达供应充足。
- source_word: ἦραν
  choice: 收拾起来
  rationale: αἴρω基本义为拿起、提起；在收集余下食物的语境中，“收拾起来”符合现代汉语表达。
- source_word: περισσεύματα
  choice: 剩下的
  rationale: 指用餐之后多出来、余下之物；以定语“剩下的”修饰“碎块”，准确且流畅。
- source_word: κλασμάτων
  choice: 碎块
  rationale: κλάσμα指掰开后留下的食物块，语境中主要是饼的碎块；“碎块”保留原文未明确重复“饼”的表达。
- source_word: ἑπτὰ σπυρίδας
  choice: 七个大筐
  rationale: σπυρίς指筐篮，并与6:43的κόφινος用词不同，通常可能是容量较大的筐；正文用“大筐”传达这项词汇差异，脚注进一步说明。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。补出“众人”和“门徒”，分别承接上下文中的进食者与收拾者，使汉语指代清楚；原文两处主语均只由动词形式表达。正文保留分号以呈现进食与收集余物之间的叙事推进。
