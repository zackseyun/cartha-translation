revisions:
- from: 众人都吃了，并且吃饱了；门徒把剩下的碎块收拾起来，装满了七个大筐[a]。
  to: 他们吃了，也吃饱了；又收拾了七筐剩下的碎块[a]。
  rationale: 修订删除“装满了”，避免把可推断的结果当作原文明确陈述；将“大筐”改为中性“筐”，把大小的可能性留在脚注；同时移除原文未强调的“都”及无必要的主语限定。译文仍保留“吃了”“吃饱了”“收拾”“剩下的碎块”和“七筐”的叙事与词义对应。
