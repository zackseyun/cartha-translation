  yaml_path: translation/nt/mark/008/032.yaml
  text: And he was speaking the word openly[a]. And Peter took him aside and began to rebuke him.
translation:
  language: zh_hans
  text: 他明明白白地[a]讲这话。彼得便把他带到一旁，开始责备他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“公开地”或“放胆地”。希腊语原词表示坦率、毫不隐讳地说话。
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησίᾳ
  choice: 坦然地
  rationale: 该词表示言语坦率、公开而不隐讳；“坦然地”在现代汉语中兼顾直率与不加掩饰的语气。脚注保留“明白地、放胆地”等可能侧重。
- source_word: τὸν λόγον
  choice: 这话
  rationale: 此短语回指上一节耶稣关于受苦、被杀和复活的预告。“这话”既保留篇章指向，也比直译“这道/这言语”更自然。
- source_word: ἐλάλει
  choice: 讲
  rationale: 希腊语未完成时描写当时持续进行的讲说；中文在上下文中用“讲”即可自然表达，不宜机械添加“正在”或“不断”。
- source_word: προσλαβόμενος
  choice: 拉他到一旁
  rationale: 该分词在此表示彼得把耶稣带到一边。“拉……到一旁”符合汉语叙事，并传达私下交谈的情境。
- source_word: ἤρξατο ἐπιτιμᾶν αὐτῷ
  choice: 开始责备他
  rationale: 保留“开始”的起始体意义；“责备”传达ἐπιτιμάω强烈斥责、纠正的力度，又不过度解释彼得具体说了什么。
theological_decisions:
- issue: παρρησίᾳ如何刻画耶稣对受难预告的讲述
  choice: 坦然地
  alternative: 明白地；放胆地；公开地
  rationale: 原词兼有坦率、无所隐讳和公开言说的意味。正文选择自然且较宽的“坦然地”，脚注列出其他可能侧重，不把重点单一限定为内容清晰、公开场合或勇气。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事表达。“这话”清楚回指前文；“拉他到一旁”符合中文习惯；避免将彼得的责备内容或动机补入正文。
