  text: Καὶ ἐπελάθοντο λαβεῖν ἄρτους, καὶ εἰ μὴ ἕνα ἄρτον οὐκ εἶχον μεθ’ ἑαυτῶν ἐν τῷ πλοίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/014.yaml
  text: And they had forgotten to take bread[a], and except for one loaf they had no bread with them in the boat.
translation:
  language: zh_hans
  text: 他们忘了带饼[a]；他们在船上随身除了有一块饼以外，没有别的饼。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文“饼”为复数，直译可作“带饼（复数）”。这复数既可指一个个饼，也可在这里泛指饼食或口粮。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπελάθοντο
  choice: 忘了
  rationale: 不定过去时在叙事中说明他们先前忘记带饼，现代汉语用“忘了”即可自然表达这一已发生的动作。
- source_word: λαβεῖν
  choice: 带
  rationale: 此处指随身带上船；“带”比“拿”更符合现代汉语语境。
- source_word: ἄρτους
  choice: 饼
  rationale: 复数可指一个个饼，也可泛指作为食物的饼；正文用汉语可作集合意义的“饼”，并以脚注保留复数信息。
- source_word: εἰ μὴ ἕνα ἄρτον
  choice: 除了一块饼
  rationale: εἰ μή在这里表示排除关系；“一块饼”保留单数及可数含义。
- source_word: οὐκ εἶχον
  choice: 再没有别的饼
  rationale: 结合前面的排除短语，明确表示除那一块以外没有饼；补出“饼”可避免汉语省略造成不清。
- source_word: μεθ’ ἑαυτῶν
  choice: 他们身边
  rationale: 自然表达这些饼是他们随身携带的。
- source_word: ἐν τῷ πλοίῳ
  choice: 在船上
  rationale: 现代汉语通常说“在船上”，比“在船里”自然，同时准确交代场景。
