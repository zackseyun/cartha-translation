source:
  edition: SBLGNT
  text: καὶ ἀπέστειλεν αὐτὸν ⸀εἰς οἶκον αὐτοῦ λέγων· Μηδὲ εἰς τὴν κώμην ⸀εἰσέλθῃς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/026.yaml
  text: And he sent him to his home[a], saying, “Do not even enter the village.”
translation:
  language: zh_hans
  text: 耶稣打发他回家[a]，对他说：“连那村子也不要进去。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本在此补有：“也不要告诉村里的任何人。”
    reason: textual_variant
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: 打发
  rationale: 此处指耶稣让那人离开并回去；“打发”符合现代汉语叙事语体，也不额外赋予差遣使命的含义。
- source_word: εἰς οἶκον αὐτοῦ
  choice: 回家
  rationale: 原文表达前往他自己的住所；结合叙事情境，“回家”比生硬的“到他的房子里”更自然，并保留归返自己住处的意思。
- source_word: λέγων
  choice: 对他说
  rationale: 希腊语分词引出伴随主动作的话语；汉语以“对他说”自然连接“打发”与直接引语。
- source_word: Μηδὲ
  choice: 连……也不要
  rationale: μηδέ在此带强调否定意味；“连……也不要”比单纯的“不要”更能传达其语气。
- source_word: κώμην
  choice: 村子
  rationale: κώμη通常指规模较小的聚落，“村子”是直接、通俗且合乎语境的译法。
- source_word: εἰσέλθῃς
  choice: 进去
  rationale: 该词在否定命令结构中表示不要进入；“进去”自然体现进入前文所指村子的方向。
theological_decisions:
- issue: 耶稣关于村子的禁令范围
  choice: 正文只译为禁止那人进入村子，不补充禁令的动机或对象。
  alternative: 部分抄本扩展为还不可告诉村里的任何人。
  rationale: SBLGNT正文仅有不得进入村子的命令；扩展文字属于抄本异文，应放在脚注中，而不纳入正文。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“打发他回家”简洁自然；“连那村子也不要进去”保留原文强调性的否定，同时不解释耶稣发出禁令的原因。
