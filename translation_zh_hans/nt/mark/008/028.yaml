  to: 他们回答他：“有人说你是施洗约翰；有人说你是以利亚；还有人说你是众先知中的一位。”
  rationale: 修订仅改善现代汉语的自然度与指向清晰度。“你是”根据上文问题及本节希腊文省略的谓语补出，不改变三项公众意见并列列举的结构或含义；“施洗约翰”采用通行称号。
