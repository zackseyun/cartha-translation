  text: οἱ δὲ ⸂εἶπαν αὐτῷ λέγοντες⸃ ⸀ὅτι Ἰωάννην τὸν βαπτιστήν, καὶ ἄλλοι Ἠλίαν, ἄλλοι δὲ ⸂ὅτι εἷς⸃ τῶν προφητῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/028.yaml
  text: They told him[a], saying, “John the Baptist; and others, Elijah; but others, one of the prophets.”
translation:
  language: zh_hans
  text: 他们回答他：“有人说你是施洗约翰；有人说你是以利亚；还有人说你是众先知中的一位。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ
  choice: 他们
  rationale: 定冠词作代词，承接上文的门徒；δέ仅有轻微承接作用，现代汉语无需另译。
- source_word: εἶπαν αὐτῷ λέγοντες
  choice: 回答他说
  rationale: 保留λέγω有限动词与同词根分词构成的复合引语公式；结合上文耶稣的提问，用“回答”自然表达语境中的回应，“说”则引出原话。
- source_word: ὅτι
  choice: 用直接引语标点体现
  rationale: 此处ὅτι引出所转述的内容；汉语以冒号和引号表达最自然，无需硬译为“说”。
- source_word: Ἰωάννην τὸν βαπτιστήν
  choice: 施洗者约翰
  rationale: βαπτιστής是施行洗礼的人；“施洗者约翰”既透明又避免把称号误解为后世宗派名称。
- source_word: ἄλλοι ... ἄλλοι δὲ
  choice: 有人……有人……还有人
  rationale: 以现代汉语的分列句式清楚表达不同人群的不同看法；末项δέ在此体现为“还有”，不强加过度转折。
- source_word: Ἠλίαν
  choice: 以利亚
  rationale: 采用现代中文圣经传统中广为人知的人名形式。
- source_word: ὅτι εἷς τῶν προφητῶν
  choice: 是先知中的一位
  rationale: 补出汉语表达所需的系词“是”，但保留“先知中的一位”的非特指性，不把它解释成某一位具体先知。
- source_word: προφητῶν
  choice: 先知
  rationale: 在此指以色列传统中的先知人物，译为通行的“先知”。
theological_decisions:
- issue: 群众对耶稣身份的几种判断
  choice: 将各项译成简洁并列的身份判断：“有人说是……有人说是……还有人说是……”。
  alternative: 逐项补全为“有人说你是……”，或保留完全无谓语的名词列表。
  rationale: 希腊文后续分句有所省略，重点是列举公众对耶稣身份的不同看法。汉语补出“是”可避免生硬，但不补“你”，从而既清楚又保留原文的压缩感。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“回答他说”略带经文叙事色彩，用来对应原文重复的说话公式；引语内部则使用普通读者易懂的并列结构。
