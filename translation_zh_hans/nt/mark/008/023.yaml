  text: καὶ ἐπιλαβόμενος τῆς χειρὸς τοῦ τυφλοῦ ⸀ἐξήνεγκεν αὐτὸν ἔξω τῆς κώμης, καὶ πτύσας εἰς τὰ ὄμματα αὐτοῦ, ἐπιθεὶς τὰς χεῖρας αὐτῷ, ἐπηρώτα αὐτόν· Εἴ τι ⸀βλέπεις;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/023.yaml
  text: And taking the blind man by the hand[a], he led him out of the village; and after spitting on his eyes and laying his hands on him, he asked him, “Do you see anything?”
translation:
  language: zh_hans
  text: 他拉着盲人的手，把他领到村外；又向他的眼睛吐了唾沫[a]，把双手放在他身上，问他：“你看得见什么吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译作：“吐唾沫到他的眼睛里。”
    reason: 说明介词εἰς可作更具方向性、较为直观的译法；正文的“向他的眼睛吐了唾沫”保留动作朝向，避免在汉语中不必要地断定唾沫进入眼内。
lexical_decisions:
- source_word: ἐπιλαβόμενος τῆς χειρὸς τοῦ τυφλοῦ
  choice: 拉着盲人的手
  rationale: ἐπιλαμβάνομαι接属格在这里表示抓住、拉住某人的手。“拉着……的手”既保留具体动作，也自然符合随后领他出村的情景。τυφλός为名词化形容词，译作“盲人”。
- source_word: ἐξήνεγκεν αὐτὸν ἔξω τῆς κώμης
  choice: 把他领到村外
  rationale: ἐκφέρω本可指带出或抬出；结合前文拉着手的动作，译作“领到”最合语境。κώμη指村庄或较小的聚落，译作“村”。
- source_word: πτύσας εἰς τὰ ὄμματα αὐτοῦ
  choice: 吐唾沫在他的眼睛上
  rationale: 保留医治行动具体而令人惊讶的身体细节。εἰς本有朝向、进入之意，但现代汉语若直译“吐进眼睛里”容易过度限定动作结果，正文用自然的“在……上”，较直译法收入脚注。
- source_word: ἐπιθεὶς τὰς χεῖρας αὐτῷ
  choice: 把双手按在他身上
  rationale: 原文为复数“手”，故译“把双手按在”。这一表达描述实际触摸，不额外引入按立或礼仪含义。
- source_word: ἐπηρώτα αὐτόν
  choice: 问他
  rationale: 未完成时可描写进行中的询问，但在汉语叙事中简洁译作“问他”最自然，不必强加反复询问的含义。
- source_word: Εἴ τι βλέπεις;
  choice: 你看见什么了吗？
  rationale: εἴ与不定代词τι构成询问是否看见任何东西的直接问句。“你看见什么了吗？”在现代汉语中自然，并保留问题的开放性。
theological_decisions:
- issue: 医治行动的身体性
  choice: 明确保留吐唾沫在眼睛上以及把双手按在身上的动作次序
  alternative: 以概括性的“医治他”弱化或省略这些细节
  rationale: 原文刻意叙述具体动作；译文不应因现代读者可能感到突兀而加以净化。
- issue: 按手动作可能引起的礼仪联想
  choice: 译作“把双手按在他身上”，仅陈述身体接触
  alternative: 采用带有正式宗教仪式意味的措辞
  rationale: 本节语境是医治中的触摸，原文没有要求将其解释为按立、圣礼或其他后期教会仪式。
- issue: 医治结果在本节中的悬念
  choice: 保留“你看见什么了吗？”这一询问，不提前说明医治是否完全生效
  alternative: 改写为暗示已经完全复明的问句
  rationale: 本句本身留下结果尚待回答的叙事张力，译文不应根据后文提前消解。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。以“他”承接上下文中的耶稣，不在本节原文没有明说之处重复补名；分号呈现动作铺陈与最后发问之间的结构。脚注标记置于其实际说明的“吐唾沫在他的眼睛上”之后。
