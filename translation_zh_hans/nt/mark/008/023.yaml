  to: 他拉着盲人的手，把他领到村外；又向他的眼睛吐了唾沫[a]，把双手放在他身上，问他：“你看得见什么吗？”
  rationale: 修订仅改善三处汉语表达并更准确反映原文：以“向……吐了唾沫”替代不自然的介词搭配，以“放在”表达实际触摸而非按压，并以“看得见什么吗”表达对当下视觉能力的开放式询问。其余叙事次序、身体细节和悬念均保持不变。
