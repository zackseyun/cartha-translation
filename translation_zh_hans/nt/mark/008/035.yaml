  text: ὃς γὰρ ⸀ἐὰν θέλῃ τὴν ⸂ψυχὴν αὐτοῦ⸃ σῶσαι ἀπολέσει αὐτήν· ὃς δ’ ἂν ⸀ἀπολέσει τὴν ⸄ψυχὴν αὐτοῦ⸅ ἕνεκεν ἐμοῦ καὶ τοῦ εὐαγγελίου ⸀σώσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/035.yaml
  text: For whoever wants to save his life will lose it[b][a], but whoever loses his life for my sake and for the gospel will save it.
translation:
  language: zh_hans
  text: 因为凡想救自己生命的人，必失去生命；但凡为我和福音失去自己生命的人，必救自己的生命。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ψυχή
  choice: 生命
  rationale: 在舍己和跟从耶稣的语境中，此词首先指人的生命或整个自我。“生命”能自然呈现想保住生命反而失去、为耶稣和福音失去生命反而得救的悖论，同时不把含义限定为非物质的“灵魂”。
- source_word: σῶσαι / σώσει
  choice: 救／必救回
  rationale: 保留σῴζω在前后两处的“救”这一核心意义及其神学分量；末句用“救回”使现代汉语更自然，也清楚承接已经“失去”的生命。
- source_word: ἀπολέσει
  choice: 必失去／失去
  rationale: 与ψυχή搭配时译作“失去”最符合这里的悖论性表达；“毁灭”过强，“丧掉”虽可行，但语体稍显传统。
- source_word: ἕνεκεν ἐμοῦ καὶ τοῦ εὐαγγελίου
  choice: 为了我和福音
  rationale: ἕνεκεν表示缘故、动机或目的，统摄“我”和“福音”两个并列成分；此译简洁自然，不必在第二项重复“为了”。
- source_word: εὐαγγέλιον
  choice: 福音
  rationale: “福音”是现代汉语中成熟且易懂的对应词，也保留该词在《马可福音》中的重要主题作用。
- source_word: ὃς ... ὃς
  choice: 凡……的／凡……的
  rationale: 用“凡……的”表达希腊文不定、概括性的条件关系，适用于所有人，并保持格言式语气。
- source_word: θέλῃ
  choice: 想
  rationale: “想”准确表达意愿，现代、清楚，不显生硬。
theological_decisions:
- issue: ψυχή在耶稣悖论式教导中的人论含义
  choice: 正文译为“生命”
  alternative: 译为“灵魂”
  rationale: 上下文论及舍己、跟从以及为耶稣和福音付上生命，故“生命”最能传达直接语境，也容许终末得救的更深意涵；脚注保留“灵魂”这一真实的词义可能，避免消除原词较宽的语义范围。
- issue: “救生命”兼具今世保全与终末拯救的张力
  choice: 保留前后“救”的对应，末句译作“救回”
  alternative: 译为“保全……保全”
  rationale: “保全”更偏向维持现世性命，可能削弱末句的救恩意涵；“救／救回”既保留同一希腊动词的呼应，也不明确限定得救实现的方式和时间。
- issue: ἕνεκεν对两个并列对象的统摄关系
  choice: 译为“为了我和福音”
  alternative: 译为“为了我，也为了福音”
  rationale: 原文一个介词统摄“我”和“福音”；简洁的并列译法忠实反映其句法，并保留两者紧密相连的关系。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“凡……的，必……”保留格言式力度；“救回生命”避免句末“救生命”的生硬感，同时维持“救—失去—救回”的鲜明悖论。
