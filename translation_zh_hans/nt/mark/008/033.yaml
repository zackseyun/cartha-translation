  terminology: '"门徒"、"责备"、"撒但"和"神"均为福音书语境中稳定、恰当的术语。"人的事"能自然表达ἀνθρώπων泛指人类的含义，无需性别脚注。译文没有把彼得与撒但的关系解释为额外的形而上断言，也没有擅自将"神的事"限定为计划、旨意或利益。'
