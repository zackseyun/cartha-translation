  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ δὲ ἐπιστραφεὶς καὶ ἰδὼν τοὺς μαθητὰς αὐτοῦ ἐπετίμησεν ⸀Πέτρῳ ⸂καὶ λέγει⸃· Ὕπαγε ὀπίσω μου, Σατανᾶ, ὅτι οὐ φρονεῖς τὰ τοῦ θεοῦ ἀλλὰ τὰ τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/033.yaml
  text: But turning around and seeing his disciples[a], he rebuked Peter and said, “Get behind me, Satan, because you are not setting your mind on the things of God, but on the things of men.”
translation:
  language: zh_hans
  text: 耶稣转过身来，看见他的门徒，就责备彼得说：“撒但，退到我后面去！因为你所想的不是神的事，而是人的事。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιστραφεὶς
  choice: 转过身来
  rationale: 该不定过去时分词在这里以不及物方式使用，描述耶稣身体转向的动作；“转过身来”自然地保留了动作次序。
- source_word: ἰδὼν
  choice: 看见
  rationale: 保留耶稣转身后看见门徒这一动作，并与后面的责备形成清楚的叙事推进。
- source_word: τοὺς μαθητὰς αὐτοῦ
  choice: 他的门徒
  rationale: “门徒”是福音书中 μαθητής 的标准译法，兼具学习者和跟随者的含义；“他的”对应 αὐτοῦ。
- source_word: ἐπετίμησεν
  choice: 责备
  rationale: ἐπιτιμάω 在本语境中表示严厉的言语斥责；“责备”准确而且适合现代庄重叙事。
- source_word: καὶ λέγει
  choice: 就……说
  rationale: λέγει 是叙事中的历史现在时；汉语按上下文自然译为过去叙事，并以“就”衔接前面的动作。
- source_word: Ὕπαγε ὀπίσω μου
  choice: 退到我后面去
  rationale: 既保留命令的强烈语气，也保留 ὀπίσω μου 的空间性和门徒应在耶稣身后跟随的潜在意涵，不将其缩减为单纯的“走开”。
- source_word: Σατανᾶ
  choice: 撒但
  rationale: 此处为直接称呼，采用新约语境中通行的音译，不把它仅仅解释成一般意义的“敌对者”。
- source_word: φρονεῖς
  choice: 你所想的
  rationale: φρονέω 涉及思想、取向和关注；“你所想的”在现代汉语中自然，并在“神的事／人的事”的对照中传达其思想取向。
- source_word: τὰ τοῦ θεοῦ
  choice: 神的事
  rationale: 保留希腊文宽泛的属格表达，不具体限定为神的计划、旨意或利益。
- source_word: τὰ τῶν ἀνθρώπων
  choice: 人的事
  rationale: ἀνθρώπων 在此泛指人类，与“神的事”形成对照；汉语“人”本身自然涵盖所有人。
theological_decisions:
- issue: 耶稣称彼得为“撒但”的所指与含义
  choice: 保留耶稣在责备彼得时直接说“撒但”的尖锐称呼
  alternative: 解释为耶稣越过彼得向撒但说话，或把“撒但”仅译作非人格化的“敌对者”
  rationale: 经文明确说耶稣责备彼得，随后使用直接称呼；译文不额外断定彼得就是撒但，也不削弱彼得言论与撒但式敌对之间的强烈关联。
- issue: “神的事”与“人的事”的范围
  choice: 采用宽泛的“神的事／人的事”
  alternative: 译为“神的旨意／人的利益”或“神所关心的／人所关心的”
  rationale: 希腊文的中性复数属格结构有意保持宽泛；直译式汉语可保留其神学张力，避免擅自限定为旨意、利益或计划。
- issue: ὀπίσω μου 的含义
  choice: 译作“退到我后面去”
  alternative: 只译作“走开”或“离开我”
  rationale: 原文不仅有驱斥意味，也明确含有“在我后面”的位置表达，可能呼应门徒跟随耶稣的位置；译文保留两层可能性。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语体。“责备”保留话语的严厉程度；“退到我后面去”比单纯“走开”更贴近原文。“人的事”在现代汉语中自然泛指人类层面的事，无须另加性别说明。
