  text: καὶ αὐτὸς ⸂ἐπηρώτα αὐτούς⸃· Ὑμεῖς δὲ τίνα με λέγετε εἶναι; ⸀ἀποκριθεὶς ὁ Πέτρος λέγει αὐτῷ· Σὺ εἶ ὁ χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/029.yaml
  text: And he was asking them[a], “But who do you say that I am?” Peter answered him, “You are the Messiah.”
translation:
  language: zh_hans
  text: 耶稣又问他们：“但你们说我是谁？”彼得回答他：“你是弥赛亚[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“基督”。
    reason: 提供 χριστός 的传统中文译法；正文采用更能凸显其称号和犹太背景的“弥赛亚”。
lexical_decisions:
- source_word: ἐπηρώτα
  choice: 又问
  rationale: 未完成时在叙事中可体现持续或推进中的发问；结合上文语境，“又问”自然表达耶稣接着提出问题，而不生硬译作“不断问”。
- source_word: Ὑμεῖς δὲ
  choice: 但你们
  rationale: 明确保留独立人称代词的强调，并以“但”表达与众人看法之间的对比。
- source_word: τίνα με λέγετε εἶναι
  choice: 说我是谁
  rationale: 以现代汉语自然表达希腊语宾格加不定式结构，意义为对耶稣身份的判断。
- source_word: ἀποκριθεὶς ὁ Πέτρος λέγει αὐτῷ
  choice: 彼得回答他说
  rationale: 将分词和马可常见的历史现在时合并为自然的汉语叙事表达，同时保留“对他说”的对象信息。
- source_word: Σὺ εἶ
  choice: 你是
  rationale: 保留明确主语；在彼得的回答中，汉语“你是”自然承载其强调。
- source_word: ὁ χριστός
  choice: 弥赛亚
  rationale: 此处 χριστός 是称号，指受膏者；“弥赛亚”能保留其犹太背景及称号性质，而不把它处理成姓名。
theological_decisions:
- issue: χριστός作为称号的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 彼得在此宣认耶稣的身份，ὁ χριστός 是“受膏者”的称号。“弥赛亚”在现代中文中清楚呈现这一称号及其犹太语境；传统译法“基督”列于脚注，以保留熟悉的对应表达。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事语体。“但你们”保留原文对比与强调；“又问”承接上文并适度体现未完成时，不刻意制造汉语中不自然的持续体。
