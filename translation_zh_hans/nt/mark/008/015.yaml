source:
  edition: SBLGNT
  text: καὶ διεστέλλετο αὐτοῖς λέγων· Ὁρᾶτε, βλέπετε ἀπὸ τῆς ζύμης τῶν Φαρισαίων καὶ τῆς ζύμης Ἡρῴδου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/015.yaml
  text: And he kept instructing them[a], saying, “Watch out[b]; beware of the leaven of the Pharisees and the leaven of Herod.”
translation:
  language: zh_hans
  text: 他一再嘱咐他们说：“你们要留心，要提防法利赛人的酵[a]和希律的酵[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “酵”也可表达为“酵母”或“发酵物”；这里保留简洁的比喻用语，突出它能渗透整体的特点。
    reason: lexical_alternative
  - marker: b
    text: 这里的“酵”比喻与法利赛人和希律相关的有害影响，但本节没有明确说明具体所指。另参马太福音16:6、12和路加福音12:1。
    reason: cross_reference
lexical_decisions:
- source_word: διεστέλλετο
  choice: 一再嘱咐
  rationale: 未完成时表示过去持续或反复的动作；“一再”体现这一语法力量，“嘱咐”则保留郑重告诫的语气，又不把它局限为一次正式命令。
- source_word: λέγων
  choice: 说
  rationale: 该分词引出嘱咐的具体内容；汉语用“说”衔接自然。
- source_word: Ὁρᾶτε
  choice: 要留心
  rationale: 这里的命令不是单指视觉上的“看”，而是要求保持警觉。“要留心”符合现代汉语的警戒语境。
- source_word: βλέπετε
  choice: 要提防
  rationale: 与前一个命令近义叠用，形成强调；用“要留心，要提防”既保留双重警告，也避免生硬重复。
- source_word: ἀπὸ
  choice: 提防……
  rationale: 该介词与警戒动词连用，表达远离、防备之意；汉语以“提防”直接支配对象最自然。
- source_word: ζύμης
  choice: 酵
  rationale: “酵”保留发酵物渗透整体的比喻及其圣经语汇关联；不在正文中将其直接解释为“教训”“假冒为善”或“腐化影响”。
- source_word: Φαρισαίων
  choice: 法利赛人
  rationale: 采用该群体名称通行的中文译名；属格在此表示与“酵”的归属或关联。
- source_word: Ἡρῴδου
  choice: 希律
  rationale: 原文直接称“希律”，并与“法利赛人”构成平行；不在正文中扩写为希律党、希律家族或希律的政治影响。
theological_decisions:
- issue: “酵”的比喻所指
  choice: 正文保留“酵”的比喻，不明确限定其含义
  alternative: 译作“教训”“假冒为善”或“腐化人的影响”
  rationale: 本节本身没有明说“酵”具体指什么。相关对观经文有助于理解其负面、渗透性的意味，却不足以在马可福音本节正文中消除其开放性。
- issue: “希律的酵”的所指范围
  choice: 按原文译作“希律的酵”
  alternative: 解释为“希律党的影响”“希律家族的作风”或“世俗政治势力的腐化”
  rationale: 原文只以希律的名字构成属格，没有进一步界定关联范围；直译可避免加入经文未明说的特定解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“一再嘱咐”体现未完成时的持续或反复意味；“要留心，要提防”保留原文两个近义命令的修辞强调。正文保留“酵”这一含蓄比喻，不作教派化或过度具体的解释。
