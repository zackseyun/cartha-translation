  text: ⸂τί γὰρ⸃ ⸀δοῖ ἄνθρωπος ἀντάλλαγμα τῆς ψυχῆς αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/037.yaml
  text: For what can a man give in exchange for his life?[a]
translation:
  language: zh_hans
  text: 因为人还能拿什么换回自己的生命呢？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“灵魂”。希腊语ψυχή可按语境指“生命”、“自己”或“灵魂”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γὰρ
  choice: 因为……什么……呢
  rationale: τί引出“什么”的反问；γάρ承接并说明上一节，因此用“因为”保留解释性的连接，同时以“呢”呈现自然的汉语反问语气。
- source_word: δοῖ
  choice: 还能拿……换回
  rationale: δοῖ是δίδωμι的不定过去时主动虚拟式，用于修辞性问句。结合ἀντάλλαγμα，译作“还能拿什么换回”比逐字译为“能给什么作为交换”更符合现代汉语，并表达无物可换的反问力度。
- source_word: ἄνθρωπος
  choice: 人
  rationale: ἄνθρωπος在此是泛指单数；汉语“人”自然涵盖任何人，无须添加性别限定。
- source_word: ἀντάλλαγμα
  choice: 拿……换回
  rationale: 该词指作为交换、代价或补偿之物。汉语以动词结构“拿什么换回”自然表达其意义，也保留交换代价的意象。
- source_word: τῆς ψυχῆς αὐτοῦ
  choice: 自己的生命
  rationale: ψυχή在本段可指生命、自己或灵魂，即人的整个自我。正文用“生命”与8:35—37的语境衔接最自然；脚注保留“灵魂”等可能含义，避免把语义限于肉身生命。
theological_decisions:
- issue: 救恩语境中ψυχή的译法
  choice: 生命
  alternative: 灵魂；自己；整个自我
  rationale: 上下文将得着全世界与丧失ψυχή对照，既涉及生命，也触及人的整个自我及其终极得失。正文采用清楚自然的“生命”，脚注说明其较宽的语义范围，以保留经文的神学张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“还能……呢”加强反问语气，却不补入原文没有的答案；“换回”承接上一节失去生命的语境。
