source:
  edition: SBLGNT
  text: Καὶ προσκαλεσάμενος τὸν ὄχλον σὺν τοῖς μαθηταῖς αὐτοῦ εἶπεν αὐτοῖς· ⸂Εἴ τις⸃ θέλει ὀπίσω μου ⸀ἐλθεῖν, ἀπαρνησάσθω ἑαυτὸν καὶ ἀράτω τὸν σταυρὸν αὐτοῦ καὶ ἀκολουθείτω μοι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/034.yaml
  text: And after calling the crowd together with his disciples[a], he said to them, “If anyone wants to come after me, let him deny himself, take up his cross[b], and follow me.”
translation:
  language: zh_hans
  text: 他把众人和他的门徒一同召来，对他们说：“若有人愿意跟在我后面，就当舍弃自己[a]，背起自己的十字架[b]，跟从我。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “舍弃自己”直译为“否认自己”，指弃绝以自我为主，并非只指克制某些欲望。
    reason: lexical_alternative
  - marker: b
    text: “背起自己的十字架”保留原文具体的十字架意象，不把它泛化为一般的重担或困难。
    reason: cultural_note
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: 召来
  rationale: 该词表示把人叫到自己这里来；“召来”简洁保留这一方向性。分词所表达的先行动作通过“把……召来，对……说”自然呈现。
- source_word: τὸν ὄχλον σὺν τοῖς μαθηταῖς αὐτοῦ
  choice: 众人和他的门徒一同
  rationale: ὄχλος译为现代、自然的“众人”；σύν表示陪同或共同在场，以“和……一同”明确众人与门徒都被召来并受教。
- source_word: Εἴ τις θέλει
  choice: 若有人愿意
  rationale: 保留一般条件句的开放性；“愿意”既表达θέλει的意愿，也符合庄重而自然的现代汉语。
- source_word: ὀπίσω μου ἐλθεῖν
  choice: 跟在我后面
  rationale: 尽量保留“到我后面来”的空间意象和门徒语境，同时避免与句末ἀκολουθείτω μοι完全合并为同一个措辞。
- source_word: ἀπαρνησάσθω ἑαυτόν
  choice: 就当舍弃自己
  rationale: ἀπαρνέομαι在此有否认、弃绝或不再以自己为中心的强烈含义。“舍弃自己”比“否认自己”更符合现代汉语，又不把含义缩减为一般克己。脚注保留较直译的表达。
- source_word: ἀράτω τὸν σταυρὸν αὐτοῦ
  choice: 背起自己的十字架
  rationale: αἴρω可表示拿起、提起或背负；中文固定搭配“背起十字架”既保持具体刑具意象，也自然表达承担并携行。αὐτοῦ译作“自己的”，保留个人性的要求。
- source_word: ἀκολουθείτω μοι
  choice: 跟从我
  rationale: 现在时命令语气在门徒语境中可含持续行动，但“跟从我”已自然包含持续作门徒的意味，无须增译“不断”。
theological_decisions:
- issue: 作门徒命令的力度
  choice: 用“若有人愿意……就当……”同时表达开放的邀请和随后的命令
  alternative: 译作“任何想……的人都必须……”
  rationale: 希腊文先用一般条件句，再用三个第三人称命令式。所选表达既不削弱要求，也不把邀请改写成超出原文的强制口吻。
- issue: “舍弃自己”的含义
  choice: 保留自我弃绝的强烈要求，不解释为一般节制或自我厌恶
  alternative: 克制自己；否定自我价值
  rationale: 原文要求人不再坚持以自己为主，却没有否定人的受造价值，也不只指放弃某些享受；译文和脚注保留这一张力，不加入特定宗派解释。
- issue: 十字架意象
  choice: 直译为“自己的十字架”
  alternative: 自己的重担；自己的苦难；殉道
  rationale: σταυρός首先指罗马处刑的十字架，其比喻意义正建立在这一具体而严酷的形象上。将它泛化为重担或限定为某一种苦难都会缩窄原文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“跟在我后面”与“跟从我”分别对应原文两个相关但不相同的表达；“背起”符合中文搭配，同时保持十字架作为罗马刑具的具体形象。主句以“他”承接上下文，不擅自把原文隐含的主语改写为专名。
