  terminology: “门徒”“十字架”“跟从”均为稳定且适切的圣经汉语术语，同时没有落入过度文言化。“众人”适合叙事中的ὄχλος；“自己的十字架”准确保留所属关系。脚注a没有把该短语缩窄为单纯的欲望克制，脚注b恰当地防止将十字架泛化为一般困难。
