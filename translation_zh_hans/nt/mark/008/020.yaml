base_translation:
  language: en
  yaml_path: translation/nt/mark/008/020.yaml
  text: And when the seven were for the four thousand[a], how many large baskets full of broken pieces did you pick up? They said to him, “Seven.”
translation:
  language: zh_hans
  text: “又有一次，用那七个饼给四千人吃的时候，你们收拾了多少个装满碎饼的大筐[a]？”他们对他说：“七筐。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大筐”所译的希腊词是 σπυρίς，与8:19所用、指较小篮子的词不同。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε καὶ
  choice: 又有一次……时
  rationale: 承接上一件喂饱众人的事，并引出第二次相似事件；用“又有一次”自然表达 καί 的追加、对照作用，同时以“时”保留 ὅτε 的时间关系。
- source_word: τοὺς ἑπτὰ
  choice: 那七个饼
  rationale: 希腊文直译为“那七个”，按8:5–6的上下文所指是七个饼。中文若只说“那七个”不够自然，补出隐含的“饼”可使指代清楚。
- source_word: εἰς τοὺς τετρακισχιλίους
  choice: 分给四千人
  rationale: 在喂饱众人的语境中，εἰς 表示这七个饼与四千人的关系；“分给四千人”以自然中文明确表达其用途，但不额外限定四千人的构成。
- source_word: πόσων σπυρίδων
  choice: 多少大筐
  rationale: σπυρίς 指较大的筐，与8:19的 κόφινος 用词不同；译作“大筐”保留马可刻意采用的词汇区别。
- source_word: πληρώματα κλασμάτων
  choice: 碎饼，装得满满的
  rationale: πληρώματα 表示装满的分量，κλασμάτων 是掰开后剩下的碎块；结合上下文译为“碎饼，装得满满的”，具体且符合现代中文表达。
- source_word: ἤρατε
  choice: 你们收拾了
  rationale: 此处 αἴρω 指把剩余碎饼收集起来；“收拾”比字面的“拿起”更贴合用餐后收集余物的语境。
- source_word: καὶ λέγουσιν αὐτῷ
  choice: 他们对他说
  rationale: λέγουσιν 是叙事现在时，现代中文叙事无需机械保留时态变化；译为“他们对他说”自然清楚。
- source_word: Ἑπτά
  choice: 七筐
  rationale: 原文只说“七”，所省略的是前问中的筐数。中文补出“筐”，使简短回答明确自然，而数值不变。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事表达。“那七个饼”补明希腊文省略成分；“七筐”也补出中文回答所需的量词。保留“大筐”与上一节较小篮子之间的词汇区别。
