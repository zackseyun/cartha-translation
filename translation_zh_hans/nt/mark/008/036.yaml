  text: τί γὰρ ⸀ὠφελεῖ ⸀ἄνθρωπον ⸂κερδῆσαι τὸν κόσμον ὅλον καὶ ζημιωθῆναι⸃ τὴν ψυχὴν αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/036.yaml
  text: For what does it profit a man to gain the whole world and forfeit his life?[a][b]
translation:
  language: zh_hans
  text: 人即使赚得全世界，却赔上自己的生命[a]，又有什么益处呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“自己的灵魂”。希腊语ψυχή可按语境指“生命”“灵魂”或“自身”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γὰρ
  choice: 又有什么……呢
  rationale: τί引出反问，γάρ承接并说明上文。在汉语中用“又有什么……呢”自然地保留这种承接和反问语气。
- source_word: ὠφελεῖ
  choice: 益处
  rationale: ὠφελέω表示使人受益或得利；“有什么益处”是自然的汉语反问表达，同时与下文得失的比喻相呼应。
- source_word: ἄνθρωπον
  choice: 人
  rationale: ἄνθρωπος在这里泛指任何人；现代汉语的“人”自然涵盖所有人，无须加入性别限定。
- source_word: κερδῆσαι
  choice: 赚得
  rationale: κερδαίνω有赚取、获得之意；“赚得”保留了本句贯穿始终的经济性得失比喻。
- source_word: τὸν κόσμον ὅλον
  choice: 全世界
  rationale: κόσμος与ὅλος合用，强调范围的完整性；“全世界”准确且自然。
- source_word: ζημιωθῆναι
  choice: 赔上
  rationale: ζημιόω的被动式可表示遭受损失或丧失。“赔上”既保留与“赚得”相对的得失意象，也表达为了所得而失去更宝贵之物的意味。
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: 自己的生命
  rationale: ψυχή可指生命、灵魂或自身。马可福音8:35–37的直接语境谈到保全或失去ψυχή，因此正文采用“生命”，并在脚注保留“灵魂”这一可能译法。
theological_decisions:
- issue: 门徒教导中ψυχή的“生命／灵魂”歧义
  choice: 生命
  alternative: 灵魂
  rationale: 紧接的上下文以保全和失去ψυχή构成悖论，“生命”最能保持语境连贯，也避免把原词限定为某一种灵魂观；但“灵魂”在词义上仍然成立，故以脚注保留。
translation_notes:
  register: 采用现代、庄重而通俗的反问句式。“赚得／赔上”保留原文的得失对照；“人”在现代汉语中本已是泛称，因此不另设性别说明脚注。
