  yaml_path: translation/nt/mark/008/030.yaml
  text: And he warned them to tell no one about him[a].
translation:
  language: zh_hans
  text: 耶稣严厉地警告他们，不要向任何人谈论他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “严厉地警告”或译“责备他们”或“严厉地命令他们”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπετίμησεν
  choice: 严肃地嘱咐
  rationale: 该动词常有“斥责”的意思，也可在命令语境中表达严厉告诫。这里的内容是禁止门徒向人透露耶稣的身份，因此译作“严肃地嘱咐”既体现命令的强度，也符合现代汉语表达。
- source_word: αὐτοῖς
  choice: 他们
  rationale: 与格复数代词，按上文指耶稣所问的门徒。
- source_word: ἵνα μηδενὶ λέγωσιν
  choice: 不可……告诉任何人
  rationale: ἵνα加虚拟式在告诫或命令动词之后表示命令的内容；μηδενὶ意为“不给任何人”，用“不可以……告诉任何人”自然传达禁止意味。
- source_word: περὶ αὐτοῦ
  choice: 他的事
  rationale: περί加属格意为“关于他”。结合上文彼得对耶稣身份的宣认，“他的事”在汉语中自然，同时不把具体内容明说得超过原文。
theological_decisions:
- issue: 耶稣禁止门徒透露其身份时命令的力度
  choice: 以“严肃地嘱咐”表达强烈禁令，但不解释禁令背后的原因
  alternative: 译作“斥责他们”或“严厉命令他们”
  rationale: 原文明确表现出强烈的禁止，却没有在本节说明原因。译文保留这种力度和神学张力，不把某种“弥赛亚隐秘”理论写进正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“严肃地嘱咐”比单纯的“嘱咐”更能体现ἐπιτιμάω的强度，又避免“斥责他们不可……”在现代汉语中的生硬感。正文中的[a]与脚注对应。
