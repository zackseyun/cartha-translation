  text: ὅτε τοὺς πέντε ἄρτους ἔκλασα εἰς τοὺς πεντακισχιλίους, πόσους κοφίνους ⸂κλασμάτων πλήρεις⸃ ἤρατε; λέγουσιν αὐτῷ· Δώδεκα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/019.yaml
  text: When I broke the five loaves for the five thousand[a], how many baskets full of broken pieces did you pick up?” They said to him[c][b], “Twelve.”
translation:
  language: zh_hans
  text: “我为那五千人[a]掰开五个饼时，你们收拾起来多少篮满满的碎块[b]？”他们对他说：“十二。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“那五千”；所用的是语法阳性形式，也可译作“那五千名男子”。
    reason: alternative_reading
  - marker: b
    text: “碎块”指饼掰开后留下的块；也可译作“零碎”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε
  choice: ……时
  rationale: 引出时间从句，回指给五千人吃饱的事件；置于从句末尾符合现代汉语习惯。
- source_word: τοὺς πέντε ἄρτους
  choice: 五个饼
  rationale: ἄρτος在此是可数的食物单位；“五个饼”具体、自然，也与本段喂饱众人的叙事相符。
- source_word: ἔκλασα
  choice: 我……掰开
  rationale: κλάω指把饼掰开；“掰开”比泛泛的“擘”更符合现代普通话，同时保留具体动作。
- source_word: εἰς τοὺς πεντακισχιλίους
  choice: 分给那五千人
  rationale: εἰς在语境中表示动作朝向受食物的群体；补出“分给”使汉语关系清楚。“那”保留希腊文定冠词所指向的已知群体。
- source_word: κοφίνους
  choice: 篮子
  rationale: κόφινος指篮子；本节不必在正文中过度限定其具体大小或式样。
- source_word: κλασμάτων
  choice: 碎块
  rationale: 指饼被掰开后形成并收集的块状零碎；“碎块”既简洁又与前面的“掰开”呼应。
- source_word: πλήρεις
  choice: 装满了
  rationale: 将希腊文“满的篮子”调整为自然汉语的述谓结构：“碎块装满了多少篮子”。
- source_word: ἤρατε
  choice: 你们收拾起来的
  rationale: αἴρω在此语境中指把剩余碎块收集起来；“收拾起来”自然表达这一动作，而不误解为单纯举起。
- source_word: λέγουσιν αὐτῷ
  choice: 他们对他说
  rationale: 希腊文使用叙事现在时；汉语采用一般叙事表达，既自然又保留说话对象。
- source_word: Δώδεκα
  choice: 十二
  rationale: 原文只给出数字回答，所指的篮子由上文清楚确定，因此不在正文中补出“篮子”。
theological_decisions:
- issue: πεντακισχιλίους所指群体的性别表达
  choice: 那五千人
  alternative: 那五千名男子
  rationale: 希腊文采用阳性形式，并以定冠词指称已知的五千人群体；现代汉语“人”不额外限定性别，既能自然指称该群体，也避免把本节没有明说的范围过度具体化。脚注保留另一种可能译法。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“掰开”“收拾起来”“装满”均为普通读者容易理解的当代用语；句法经过汉语化处理，同时保留问答的简洁和原文“十二”这一省略式回答。
