revisions:
- from: “我把五个饼掰开，分给那五千人[a]时，你们收拾起来的碎块[b]装满了多少篮子？”他们对他说：“十二。”
  to: “我为那五千人[a]掰开五个饼时，你们收拾起来多少篮满满的碎块[b]？”他们对他说：“十二。”
  rationale: 修订避免把“为那五千人”明确扩展为“分给那五千人”，并重组“篮子、装满、碎块”的汉语表达，使其既准确对应κοφίνους κλασμάτων πλήρεις，又保持现代普通话问句的自然性。“多少篮满满的碎块”在汉语中以“篮”为量词，表达收集到的多篮、每篮满满的碎块。
