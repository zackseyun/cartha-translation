base_translation:
  language: en
  yaml_path: translation/nt/mark/006/039.yaml
  text: And he commanded them all to recline in groups on the green grass[a][b].
translation:
  language: zh_hans
  text: 他吩咐他们安排众人在青草地上，一组一组地[a]坐下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊原文重复“组”这个词，可译作“分成一组一组”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέταξεν
  choice: 吩咐
  rationale: 该动词表示带有权威的命令；“吩咐”在现代汉语叙事中自然，同时保留了权威性，强于一般的“告诉”。
- source_word: αὐτοῖς
  choice: 他们
  rationale: 保留希腊文代词的表达，不在正文中明说其所指；上下文表明这是门徒。
- source_word: ἀνακλῖναι πάντας
  choice: 安排众人……坐下
  rationale: 这里的主动式不定词带宾语 πάντας，意思是让众人就坐。此译法清楚区分领受命令的“他们”与被安排坐下的“众人”，并以现代汉语自然表达用餐时就坐的动作。
- source_word: συμπόσια συμπόσια
  choice: 一组一组地
  rationale: 希腊文重复该复数名词，具有逐组、分组的分配意义；“一组一组地”既保留重复形式，也传达有组织地分组就坐。
- source_word: ἐπὶ τῷ χλωρῷ χόρτῳ
  choice: 在青草地上
  rationale: χλωρός 表示青绿、鲜嫩，χόρτος 在此指草；“青草地上”简洁自然，并保留场景色彩。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“安排众人……坐下”避免把 αὐτοῖς（领受命令的人）与 πάντας（被安排就坐的众人）混为同一对象；标点和语序按自然汉语调整。
