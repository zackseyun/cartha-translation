  text: Καὶ συνάγονται οἱ ἀπόστολοι πρὸς τὸν Ἰησοῦν, καὶ ἀπήγγειλαν αὐτῷ ⸀πάντα ὅσα ἐποίησαν καὶ ὅσα ἐδίδαξαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/030.yaml
  text: And the apostles gathered to Jesus[a], and they reported to him all that they had done and taught.
translation:
  language: zh_hans
  text: 使徒们聚集到耶稣那里，把他们所做的一切和所教导的一切都报告给他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνάγονται
  choice: 聚集到
  rationale: 这是叙事中的历史现在时，汉语可自然地按已发生的事件叙述；“聚集到耶稣那里”既保留众人会合的集体含义，也表达πρός加宾格所指向的趋近。
- source_word: οἱ ἀπόστολοι
  choice: 使徒们
  rationale: 在本段语境中，这是对受差遣出去又返回的十二门徒的角色称谓；“使徒”是现代汉语中准确而通行的对应词。
- source_word: ἀπήγγειλαν
  choice: 报告
  rationale: 此词在这里指受差遣者回来后把经历向耶稣陈述；“报告”比泛泛的“告诉”更能体现复命汇报的语境。
- source_word: πάντα ὅσα ἐποίησαν καὶ ὅσα ἐδίδαξαν
  choice: 他们所做的一切和所教导的一切
  rationale: 保留两个ὅσα分句的平行结构和πάντα的周全含义，同时用自然清楚的现代汉语表达。
theological_decisions:
- issue: ἀπόστολοι在叙事中的身份含义
  choice: 译作“使徒们”，作为受差遣者的角色称谓
  alternative: 使者们；受差遣的人
  rationale: 语境指先前受耶稣差遣出去、如今返回的特定门徒群体。采用通行称谓“使徒”可保留马可对他们受差遣职分的描述，又不额外引入经文未明说的教义限定。
translation_notes:
  register: 采用庄重、简明的现代标准汉语。句式保留原文“所做”与“所教导”的平行关系；不为无实质翻译歧义之处添加脚注。
