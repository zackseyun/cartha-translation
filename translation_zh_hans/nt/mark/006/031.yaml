  text: καὶ ⸀λέγει αὐτοῖς· Δεῦτε ὑμεῖς αὐτοὶ κατ’ ἰδίαν εἰς ἔρημον τόπον καὶ ⸀ἀναπαύσασθε ὀλίγον. ἦσαν γὰρ οἱ ἐρχόμενοι καὶ οἱ ὑπάγοντες πολλοί, καὶ οὐδὲ φαγεῖν εὐκαίρουν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/031.yaml
  text: And he said to them[a], “Come away by yourselves to a desolate place and rest a little.” For many were coming and going[b], and they did not even have an opportunity to eat.
translation:
  language: zh_hans
  text: 他对他们说：“你们自己单独到一个荒僻的地方去[a]，稍微休息一下。”因为来来往往的人很多，他们甚至连吃饭的机会都没有[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“僻静的地方”或“无人居住的地方”。希腊文指偏远、少有人烟之处，不一定是现代意义上的沙漠。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“他们甚至连吃饭的时间都没有”。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: 他对他们说
  rationale: 希腊文采用历史现在时；现代汉语叙事通常自然地用“说”，无需以时态形式特别标示，同时保留叙事的直接感。
- source_word: Δεῦτε
  choice: 到……去
  rationale: 此邀请语在上下文中要求门徒离开人群，前往另一处；汉语用“到……去”自然表达受邀采取的行动，又不额外加入原文没有明说的“跟我”。
- source_word: ὑμεῖς αὐτοὶ κατ’ ἰδίαν
  choice: 你们自己
  rationale: ὑμεῖς αὐτοὶ带有强调，κατ’ ἰδίαν表示私下、与众人分开；结合后面的“荒僻的地方”，“你们自己”简洁地保留了强调和离开人群的含义，避免生硬重复。
- source_word: ἔρημον τόπον
  choice: 一个荒僻的地方
  rationale: ἔρημος在这里指无人居住、远离人群或僻静之处，不一定是现代意义上的沙漠；“荒僻”兼顾地点的偏远与少有人烟。
- source_word: ἀναπαύσασθε ὀλίγον
  choice: 稍微休息一下
  rationale: ἀναπαύσασθε指停止劳作、恢复体力，ὀλίγον表示短暂或少量；此译文符合现代汉语口吻。
- source_word: οἱ ἐρχόμενοι καὶ οἱ ὑπάγοντες πολλοί
  choice: 来来往往的人很多
  rationale: 两个带冠词的现在分词描写不断有人前来又离去；“来来往往的人很多”自然保留持续、繁忙的场景。
- source_word: οὐδὲ φαγεῖν εὐκαίρουν
  choice: 他们甚至连吃饭的机会都没有
  rationale: εὐκαιρέω指有空闲或合适机会，οὐδέ带有“甚至连……也不”的递进意味；“机会”比单说“时间”更贴近词义。
theological_decisions: []
