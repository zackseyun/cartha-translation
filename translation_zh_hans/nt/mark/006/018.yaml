  text: ἔλεγεν γὰρ ὁ Ἰωάννης τῷ Ἡρῴδῃ ὅτι Οὐκ ἔξεστίν σοι ἔχειν τὴν γυναῖκα τοῦ ἀδελφοῦ σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/018.yaml
  text: For John had been saying to Herod[a], “It is not lawful for you to have your brother’s wife.”
translation:
  language: zh_hans
  text: 因为约翰一直对希律说：“你娶你兄弟的妻子是不合法的。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγεν
  choice: 曾一再……说
  rationale: 未完成时表示过去持续或反复发生的言说；“曾一再……说”在现代汉语中自然地传达这种延续、反复的意味。
- source_word: γὰρ
  choice: 因为
  rationale: 承接上文，说明希罗底敌视约翰的原因；“因为”清楚保留解释性的连接功能。
- source_word: Ἡρῴδῃ
  choice: 希律
  rationale: 采用现代中文圣经传统中通行的人名音译。
- source_word: Οὐκ ἔξεστίν σοι
  choice: 你……是不合法的
  rationale: ἔξεστιν涉及被准许或合乎律法之事；此处保留道德与律法层面的禁止意味，同时不擅自补明具体律法条文。
- source_word: ἔχειν
  choice: 娶
  rationale: ἔχειν本义为“拥有、有”，但在此婚姻语境中指将某女子据为妻；汉语用“娶”较自然，也避免“拥有妻子”的生硬表达。
- source_word: γυναῖκα
  choice: 妻子
  rationale: γυνή可指“女人”或“妻子”；属格短语“你兄弟的”明确表明这里是婚姻关系。
- source_word: τοῦ ἀδελφοῦ σου
  choice: 你兄弟的
  rationale: 直接保留亲属关系及属有结构，这是约翰责备的核心内容。
theological_decisions:
- issue: 约翰责备的性质
  choice: 译作具有律法和道德禁止意味的“不合法”
  alternative: 较弱地译作“不合适”，或较口语化地译作“不可以”
  rationale: οὐκ ἔξεστίν表达不被准许、不合律法。上下文可能涉及利未记中的婚姻禁令，但本节没有明说律法出处，因此既保留法律—道德力度，也不在正文中增添解释。
- issue: ἔχειν在婚姻语境中的表达
  choice: 译作“娶”
  alternative: 较形式对应地译作“占有”或“拥有”
  rationale: “娶”准确传达希律将兄弟之妻作为自己妻子的关系，符合自然现代汉语；它不进一步判定该关系形成的具体法律程序。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“曾一再”体现未完成时的持续或反复意味；“不合法”保留先知责备中的律法—道德力度。脚注标记已在正文中对应出现。
