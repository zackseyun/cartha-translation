  text: πάντες γὰρ αὐτὸν εἶδον καὶ ἐταράχθησαν. ⸂ὁ δὲ εὐθὺς⸃ ἐλάλησεν μετ’ αὐτῶν, καὶ λέγει αὐτοῖς· Θαρσεῖτε, ἐγώ εἰμι, μὴ φοβεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/050.yaml
  text: For they all saw him and were troubled. But he immediately spoke with them and says to them, “Take courage; I am; do not be afraid.”
translation:
  language: zh_hans
  text: 因为他们都看见了他，惊慌不安。但他立刻对他们说：“放心吧，是我[a]；不要害怕。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “是我”：希腊文直译为“我是”；在此语境中通常是自我辨认的话，也可被理解为带有更广的回响。
    reason: 保留ἐγώ εἰμι的字面形式及其解释空间，同时让正文采用自然的现代汉语表达。
lexical_decisions:
- source_word: ἐταράχθησαν
  choice: 惊慌不安
  rationale: 既表达他们受到强烈惊扰，也保留内心不安的意味，符合门徒见到海面人影时的反应。
- source_word: ἐλάλησεν μετ’ αὐτῶν
  choice: 对他们说
  rationale: 现代汉语中自然表达向他们讲话；不机械直译介词结构。
- source_word: Θαρσεῖτε
  choice: 放心
  rationale: 在安抚恐惧的语境中自然传达“鼓起勇气、不要丧胆”的命令语气。
- source_word: ἐγώ εἰμι
  choice: 我是
  rationale: 贴近希腊文的简短表述，并保留它既可作为自我辨认、又可能带有更深回响的开放性。
- source_word: μὴ φοβεῖσθε
  choice: 不要害怕
  rationale: 直接、自然地表达现在时否定命令的安慰与劝止。
theological_decisions:
- issue: ἐγώ εἰμι 的含义是否只限定为普通的自我辨认
  choice: 正文译作“我是”
  alternative: “是我”
  rationale: “是我”是此处自然的语境解释，但会更明确地将短语限定为身份辨认；“我是”较形式对应，并保留其潜在的神学回响而不在正文中断定。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“惊慌不安”避免过弱的“烦恼”；“放心”符合耶稣随即安抚门徒的口吻。正文保留历史叙事的自然汉语时态，不机械再现希腊语历史现在时。
