  yaml_path: translation/nt/mark/006/054.yaml
  text: And when they got out of the boat[a], immediately they recognized him.
translation:
  language: zh_hans
  text: 他们从船上下来后，当地人立刻认出了他[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文在“他们从船上下来后”之后只说“立刻认出他来”，没有明说“认出”的主语；按上下文，是当地人。
    reason: 说明原文中“认出”的主语未明说，以及正文依据上下文补出“当地人”。
lexical_decisions:
- source_word: ἐξελθόντων αὐτῶν
  choice: 他们一下船
  rationale: 属格独立结构表达时间关系；“一下船”自然简洁，也与紧接着发生的认出相衔接。
- source_word: πλοίου
  choice: 船
  rationale: 在加利利海的叙事语境中指船只，现代汉语用“船”最自然。
- source_word: εὐθὺς
  choice: 立刻
  rationale: 保留马可常用副词所表达的即时性，同时符合现代汉语叙事风格。
- source_word: ἐπιγνόντες
  choice: 认出了
  rationale: 此处表示看见耶稣后辨认出他的身份；“认出了”准确而自然。
- source_word: αὐτὸν
  choice: 他
  rationale: 根据上下文，代词所指是耶稣；正文保留代词形式。
- source_word: implicit subject of ἐπιγνόντες
  choice: 当地的人
  rationale: 该分词的主语未明说，但不能自然地回指属格独立结构中的αὐτῶν；下文表明是当地居民认出了耶稣。汉语补出“当地的人”，可避免把认出者误解为耶稣和门徒。
theological_decisions:
- issue: 认出耶稣者的身份
  choice: 正文补明为“当地的人”
  alternative: 保留为“他们立刻认出了他”
  rationale: 这是句法和语境上的判断，并非教义性增译。希腊文以主格复数分词隐含认出者，而前句“他们”位于属格独立结构中；下一节也显示当地人是行动主体。脚注说明原文并未明说该主语，以保留原文形式上的含蓄。
translation_notes:
  register: 采用现代、庄重而易懂的叙事用语。“当地的人”依据上下文补明隐含主语，并以脚注交代原文的歧义；“一下船……立刻”保留动作紧接发生的节奏。
