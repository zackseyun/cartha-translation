  text: καὶ προσκαλεῖται τοὺς δώδεκα, καὶ ἤρξατο αὐτοὺς ἀποστέλλειν δύο δύο, καὶ ἐδίδου αὐτοῖς ἐξουσίαν τῶν πνευμάτων τῶν ἀκαθάρτων,
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/007.yaml
  text: And he called the Twelve and began to send them out two by two[c][b][a], and he was giving them authority over the unclean spirits.
translation:
  language: zh_hans
  text: 耶稣叫来那十二人[a]，开始差遣他们两人一组地出去[b]，并赐给他们制伏不洁的灵的权柄[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文“召集／叫来”采用叙事现在时，直译可作“叫来”；正文按汉语叙事习惯译为过去式。
    reason: source_aspect
  - marker: b
    text: 或译：“两个两个地”或“成对地”。
    reason: lexical_alternative
  - marker: c
    text: “权柄”也可译为“权力”或“能力”；这里侧重所授予的权威。
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεῖται
  choice: 叫来
  rationale: 该词是叙事现在时，且中态形式带有召到自己跟前的意味。“叫来”在现代汉语中自然地表达这一动作；正文按上下文采用过去叙事的通常表达，不强行复制希腊语的时态转换。
- source_word: τοὺς δώδεκα
  choice: 那十二人
  rationale: 原文把“十二”用作耶稣所拣选之群体的固定称谓，但本节没有明说“门徒”或“使徒”。“那十二人”既自然，也避免加入原文未出现的身份名词。
- source_word: ἤρξατο ... ἀποστέλλειν
  choice: 开始差遣……出去
  rationale: 保留“开始”这一阶段性含义；“差遣……出去”体现使命语境，又不把动词名词化为“使徒”。
- source_word: δύο δύο
  choice: 两个两个地
  rationale: 保留原文重复形成的分配性表达和节奏；脚注提供更简洁的现代汉语说法。
- source_word: ἐδίδου
  choice: 赐给
  rationale: 未完成过去时可表示与差遣同时展开或逐次进行的授予行动。汉语无需机械添加“不断”，以免过度限定其体貌。
- source_word: ἐξουσίαν
  choice: 权柄
  rationale: 该词在此指耶稣授予的行动资格与支配权，不只是能力或力量；“权柄”能保留其授权性质。
- source_word: τῶν πνευμάτων τῶν ἀκαθάρτων
  choice: 不洁之灵
  rationale: 按原文保留“灵”与“不洁”的称呼，不直接改译为“鬼”或“邪灵”，以免缩窄或解释性替换马可的用语。
theological_decisions:
- issue: ἐξουσίαν与不洁之灵之间所表达的关系
  choice: 赐给他们辖制不洁之灵的权柄
  alternative: 赐给他们胜过不洁之灵的能力
  rationale: “权柄”保留由耶稣授予的权威性质；“辖制”自然表达属格在此所指向的对象关系，而不把它弱化为未经授权的自身能力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“那十二人”保留原文称谓，不增添“门徒”或“使徒”；“不洁之灵”保持马可的术语。句式简洁，并借“两个两个地”保留原文的分配性节奏。
