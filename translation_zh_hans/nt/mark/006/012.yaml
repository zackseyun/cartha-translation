  text: Καὶ ἐξελθόντες ⸀ἐκήρυξαν ἵνα ⸀μετανοῶσιν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/012.yaml
  text: And they went out and proclaimed that people should repent[a].
translation:
  language: zh_hans
  text: 他们就出去，宣讲人应当悔改。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“他们应当悔改”；“他们”指听见宣讲的人。
    reason: 说明希腊语动词中隐含的复数主语，并保留较直译的表达。
lexical_decisions:
- source_word: Καὶ
  choice: 就
  rationale: 承接前文差遣的叙事，并自然表达门徒随即采取行动；不额外强化严格的时间先后。
- source_word: ἐξελθόντες
  choice: 出去
  rationale: 该不定过去时分词所指的是门徒出去的行动；与主要动词合译为现代汉语的连动结构“出去，宣讲”，自然且保留动作关系。
- source_word: ἐκήρυξαν
  choice: 宣讲
  rationale: κηρύσσω指公开传扬、宣告；“宣讲”既保留公开传告的意味，又符合本段语境。
- source_word: ἵνα
  choice: （宣讲的内容）人应当
  rationale: 此处引出所宣讲的要求或内容。汉语不必机械对应连词，可直接用“宣讲人应当……”清楚表达。
- source_word: μετανοῶσιν
  choice: 悔改
  rationale: μετανοέω在福音书语境中不只是改变想法，也包含转变心意和生活方向；“悔改”简洁、自然，并保留其神学分量。
theological_decisions:
- issue: 是否明确补出悔改者的身份
  choice: 人应当悔改
  alternative: 他们应当悔改
  rationale: 希腊语复数动词的隐含主语是听见宣讲的人，而不是门徒。译作“人”可避免汉语中的“他们”被误解为门徒，同时不增加额外教义内容。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“宣讲”体现公开传告；“悔改”保留原词在福音书语境中的完整分量。脚注明示直译形式及代词所指。
