  text: Καὶ ὀψίας γενομένης ἦν τὸ πλοῖον ἐν μέσῳ τῆς θαλάσσης, καὶ αὐτὸς μόνος ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/047.yaml
  text: And when evening had come[a], the boat was in the middle of the sea, and he was alone on the land.
translation:
  language: zh_hans
  text: 到了晚上，船在海中央，他独自在陆地上。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“岸上”。希腊原文作“陆地上”，与船在海中的位置形成对照。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀψίας γενομένης
  choice: 到了晚上
  rationale: 这是表示时间背景的属格独立结构；“到了晚上”自然、简洁，并保留进入晚间这一时间变化。
- source_word: τὸ πλοῖον
  choice: 船
  rationale: 在加利利海的语境中，“船”符合当时船只的规模，也符合现代汉语习惯。
- source_word: ἐν μέσῳ τῆς θαλάσσης
  choice: 在海中央
  rationale: 直接表达船位于海中、远离陆地的位置；“中央”保留 μέσῳ 的空间含义。
- source_word: τῆς θαλάσσης
  choice: 海
  rationale: 虽然加利利海在现代地理分类上属于湖泊，原文用 θάλασσα（海），故保留原文称呼。
- source_word: αὐτὸς μόνος
  choice: 他独自
  rationale: μόνος 表明耶稣单独一人；“他独自”在现代汉语中自然，并保留强调。
- source_word: ἐπὶ τῆς γῆς
  choice: 在陆地上
  rationale: 直译 γῆ，并清楚呈现他所在的陆地与船所在的海上之间的对照；“岸上”虽符合场景，但解释性略强。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准汉语。句式简洁，保留原文中船在海上与耶稣独自在陆地上的空间对照；代词“他”承接上下文所指的耶稣，不在正文中增添原文未明说的专名。
