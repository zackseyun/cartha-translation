  text: ⸂περιέδραμον ὅλην τὴν χώραν ἐκείνην καὶ⸃ ἤρξαντο ἐπὶ τοῖς κραβάττοις τοὺς κακῶς ἔχοντας περιφέρειν ὅπου ἤκουον ⸀ὅτι ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/055.yaml
  text: They ran throughout that whole region and began carrying those who were sick on mats to wherever they heard he was[a].
translation:
  language: zh_hans
  text: 他们跑遍那一带，开始把病人放在褥垫[a]上抬送到所听说他在的地方。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “褥垫”也可译作“草席”或“简易卧榻”；希腊文指便于搬动的简陋寝具。
    reason: lexical_alternative
lexical_decisions:
- source_word: περιέδραμον
  choice: 跑遍
  rationale: 既表达迅速奔走，也保留行动遍及整个地区的分布意味。
- source_word: ὅλην τὴν χώραν ἐκείνην
  choice: 那一带
  rationale: χώρα在这里指周围地区；“那一带”符合现代汉语习惯，而“遍”已体现ὅλην的整体范围。
- source_word: ἤρξαντο ... περιφέρειν
  choice: 开始……抬着……送到
  rationale: 保留ἤρξαντο所表示的行动起始；结合便携寝具和目的地语境，用“抬着……送到”自然表达搬运病人的动作。
- source_word: ἐπὶ τοῖς κραβάττοις
  choice: 用褥垫抬着
  rationale: κράβαττος指简陋、可搬动的寝具；“褥垫”比现代固定床具更贴近其物质形态，也便于表达承载病人的功能。
- source_word: τοὺς κακῶς ἔχοντας
  choice: 病人
  rationale: 这是表示患病者的惯用语；译作“病人”简洁、清楚。
- source_word: ὅπου ἤκουον ὅτι ἐστίν
  choice: 所听说他在的地方
  rationale: 保留间接听闻及地点的不确定性，不额外限定具体地点。
