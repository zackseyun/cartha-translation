  yaml_path: translation/nt/mark/006/019.yaml
  text: But Herodias held a grudge against him and wanted to kill him[a], but she could not.
translation:
  language: zh_hans
  text: 可是，希罗底亚一直对他怀恨在心[a]，想要杀他，却办不到。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一直怨恨他”或“对他怀有敌意”。希腊语这一表达表示持续的敌意。
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: 可是
  rationale: 承接上文并表达转折，突出希罗底对约翰的敌意与前述情形之间的对照。
- source_word: Ἡρῳδιὰς
  choice: 希罗底
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: ἐνεῖχεν αὐτῷ
  choice: 对他怀恨在心
  rationale: 该习语在此表示持续的敌意和怨恨；“怀恨在心”自然地体现未完成时所表达的延续状态。
- source_word: ἤθελεν
  choice: 想要
  rationale: 直接表达她持续存在的意愿或企图，不额外强化为已经制定具体计划。
- source_word: αὐτὸν ἀποκτεῖναι
  choice: 杀他
  rationale: 忠实而直接地表达ἀποκτείνω；不译作“谋杀”，以免加入原词未明确表达的法律或道德定性。
- source_word: καὶ οὐκ ἠδύνατο
  choice: 却办不到
  rationale: καί在语境中带有转折效果；“办不到”既自然，又保留她当时无法实现意图的含义。
