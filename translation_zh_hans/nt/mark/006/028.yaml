  text: καὶ ἤνεγκεν τὴν κεφαλὴν αὐτοῦ ἐπὶ πίνακι καὶ ἔδωκεν αὐτὴν τῷ κορασίῳ, καὶ τὸ κοράσιον ἔδωκεν αὐτὴν τῇ μητρὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/028.yaml
  text: And he brought his head on a platter and gave it to the girl[a], and the girl gave it to her mother.
translation:
  language: zh_hans
  text: 他把他的头放在盘子上[a]端来，交给那女孩；那女孩又把头交给她母亲。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“托盘”或“大盘”。希腊语πίναξ指盛放食物的盘或托盘。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤνεγκεν
  choice: 拿来
  rationale: 这里指把被砍下的头实际带到宴席现场。“拿来”符合现代汉语叙事习惯，又不额外说明搬运方式。
- source_word: τὴν κεφαλὴν αὐτοῦ
  choice: 他的头
  rationale: 按原文保留第三人称所属关系；所指的人由上文确定为施洗约翰。
- source_word: ἐπὶ πίνακι
  choice: 放在盘子上
  rationale: πίναξ指盛放食物的盘、大盘或托盘；“盘子”自然易懂，也符合宴席场景。用“放在……上”表达ἐπί的空间关系。
- source_word: ἔδωκεν
  choice: 交给
  rationale: δίδωμι在两处均表示把物件转交给另一人。“交给”比单说“给”更清楚地表现连续转交的动作，同时在两句中保留原文的重复结构。
- source_word: τῷ κορασίῳ / τὸ κοράσιον
  choice: 那女孩
  rationale: κοράσιον指女孩或年轻女子。“女孩”现代、自然，不采用较古雅的“少女”或“闺女”；“那”承接上文已出现的人物。
- source_word: τῇ μητρὶ αὐτῆς
  choice: 给她母亲
  rationale: 自然表达与格和所属关系，清楚保留女孩把头转交给自己母亲的叙事链条。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而直接的叙事语言。第二句将阴性代词αὐτήν明说为“头”，避免汉语中的指代含混；这不改变原文所指。脚注标记置于其实际说明的“盘子上”之后，而非置于“女孩”之后。
