  text: Καὶ ⸀εὐθὺς ἠνάγκασεν τοὺς μαθητὰς αὐτοῦ ἐμβῆναι εἰς τὸ πλοῖον καὶ προάγειν ⸂εἰς τὸ πέραν⸃ πρὸς Βηθσαϊδάν, ἕως αὐτὸς ⸀ἀπολύει τὸν ὄχλον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/045.yaml
  text: And immediately he compelled his disciples to get into the boat and go ahead to the other side[a], toward Bethsaida[b], until he himself dismissed the crowd.
translation:
  language: zh_hans
  text: 耶稣随即强令门徒上船，先往对岸去，朝伯赛大的方向前行[a]，直到他亲自解散众人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “朝伯赛大的方向”也可译作“到伯赛大去”。希腊文介词可泛指方向，也可较明确地表示目的地。
    reason: lexical_alternative
  - marker: b
    text: 希腊文直译为“直到他解散众人”，其中“解散”使用现在时；在这一叙事性的时间从句中，汉语无需专门标示时态。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: 随即
  rationale: 保留马可叙事中紧凑、迅速的推进感，同时符合现代汉语叙事习惯。
- source_word: ἠνάγκασεν
  choice: 催促
  rationale: 表达促使门徒立即行动的强烈推动力，又不把原词过度解释为身体强迫。
- source_word: τοὺς μαθητὰς αὐτοῦ
  choice: 门徒
  rationale: “门徒”是福音书语境中 μαθηταί 的通行译法，能准确体现师徒关系；汉语中无需重复译出“他的”。
- source_word: ἐμβῆναι εἰς τὸ πλοῖον
  choice: 上船
  rationale: 简洁、自然地表达进入船中的动作。
- source_word: προάγειν
  choice: 先……去
  rationale: 明确表达门徒要走在耶稣前面的相对意义，而不只表示一般性的前行。
- source_word: εἰς τὸ πέραν
  choice: 往对岸
  rationale: 按加利利湖的叙事背景，将该惯用语自然译为前往湖的另一边。
- source_word: πρὸς Βηθσαϊδάν
  choice: 朝伯赛大的方向
  rationale: 保留 πρός 加宾格所表达的方向性，不武断地把伯赛大定为明确且必然抵达的终点。
- source_word: ἕως
  choice: 直到
  rationale: 保留原文所标示的时间界限，不以较解释性的“趁……的时候”取代。
- source_word: αὐτὸς
  choice: 他亲自
  rationale: 体现显明主语代词的强调意味：耶稣本人留下处理众人。
- source_word: ἀπολύει
  choice: 解散
  rationale: 切合让聚集的众人离开的语境；虽为希腊文现在时，汉语在“直到”从句中无需另加过去时标记。
- source_word: τὸν ὄχλον
  choice: 众人
  rationale: 在福音书叙事中自然表达聚集的人群，语体庄重而不陈旧。
