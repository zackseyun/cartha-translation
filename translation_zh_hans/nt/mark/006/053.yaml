base_translation:
  language: en
  yaml_path: translation/nt/mark/006/053.yaml
  text: And after crossing over to the land[b][a], they came to Gennesaret and moored there.
translation:
  language: zh_hans
  text: 他们渡到陆地，来到革尼撒勒，就把船停泊在那里。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“把船靠岸了”或“停靠在那里”；原文动词指船只靠泊或停靠。
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: 他们
  rationale: 希腊文以简单连接词承接上文；现代汉语叙事中不必机械译出“并且”，以主语“他们”自然起句即可，连续关系由语序表达。
- source_word: διαπεράσαντες
  choice: 渡过去
  rationale: 不定过去时分词表示先于主要动词发生的动作；“渡过去”简洁保留了横渡水面的动作和先后次序。
- source_word: ἐπὶ τὴν γῆν ἦλθον εἰς Γεννησαρὲτ
  choice: 来到革尼撒勒一带的岸边
  rationale: γῆ本义范围包括“地、陆地”，在行船语境中指抵达岸上；Γεννησαρέτ在此可指湖西岸的地区。“一带的岸边”既合乎地理与语境，也避免将两个方向短语硬译得生涩。
- source_word: Γεννησαρὲτ
  choice: 革尼撒勒
  rationale: 采用现代中文圣经读者较熟悉的音译地名。
- source_word: προσωρμίσθησαν
  choice: 把船靠岸了
  rationale: 该动词具有明确的航海意味，指船只靠泊；希腊文虽为被动形式，汉语用处置式表达更自然，并从语境补出宾语“船”。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“一带的岸边”自然呈现抵达革尼撒勒地区陆岸的含义；“把船靠岸了”保留原文动词的航海色彩。所有脚注标记均置于相关正文之后。
