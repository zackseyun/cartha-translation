  text: καὶ οὐκ ἐδύνατο ἐκεῖ ⸂ποιῆσαι οὐδεμίαν δύναμιν⸃, εἰ μὴ ὀλίγοις ἀρρώστοις ἐπιθεὶς τὰς χεῖρας ἐθεράπευσεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/005.yaml
  text: And he was not able to do any mighty work there[a], except that he laid his hands on a few sick people and healed them.
translation:
  language: zh_hans
  text: 他在那里不能行任何大能的事[a]，只不过给几个病人按手，治好了他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大能的事”或译“神迹”或“彰显能力的作为”；希腊文为“能力”或“大能”，马可常用这个词指神奇的作为。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδύνατο
  choice: 不能
  rationale: 直接表达否定式 δύναμαι 所陈述的不能，不将其弱化为“不愿意”，保留原文的张力。
- source_word: ποιῆσαι
  choice: 行
  rationale: 与“大能的事”搭配自然，也贴近 ποιέω 在此处“做、行”的宽泛含义。
- source_word: οὐδεμίαν δύναμιν
  choice: 什么大能的事
  rationale: δύναμις 字面关联“能力、大能”，在马可福音中可指彰显能力的神迹作为；此译法既保留词义联系，也避免直接限定为“神迹”。
- source_word: εἰ μὴ
  choice: 只
  rationale: 在前句否定之后自然引出例外，准确表达“除了……以外”的作用。
- source_word: ὀλίγοις ἀρρώστοις
  choice: 几个病人
  rationale: 简洁自然地表达数量不多和患病者。
- source_word: ἐπιθεὶς τὰς χεῖρας
  choice: 给……按手
  rationale: 准确表达把手放在病人身上的动作，并采用现代中文圣经语境中自然易懂的说法。
- source_word: ἐθεράπευσεν
  choice: 治好了
  rationale: 表达 θεραπεύω 在此处使病人得医治的结果，现代中文自然清楚。
theological_decisions:
- issue: 是否弱化 οὐκ ἐδύνατο，以免暗示耶稣受到限制
  choice: 保留直陈语气：“不能”
  alternative: 译作“不愿意”或仅说“没有行”
  rationale: 希腊文明确使用 δύναμαι 的否定形式陈述不能。译文不替作者消解这一神学张力；本节的例外以及上下文可为读者提供叙事语境。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“不能”保留原文直接陈述；“行大能的事”兼顾希腊语词形和中文可读性。脚注列出较解释性的替代译法。
