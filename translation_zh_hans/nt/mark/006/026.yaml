  text: καὶ περίλυπος γενόμενος ὁ βασιλεὺς διὰ τοὺς ὅρκους καὶ τοὺς ⸀ἀνακειμένους οὐκ ἠθέλησεν ⸂ἀθετῆσαι αὐτήν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/026.yaml
  text: And the king[a], becoming deeply grieved, because of his oaths and those reclining at the table[c][b], did not want to refuse her.
translation:
  language: zh_hans
  text: 王十分忧愁；他却因自己所起的誓和同席的人[a]，不愿拒绝她[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“斜倚席间的人”，指在宴席上同桌用餐的宾客。
    reason: lexical_alternative
  - marker: b
    text: 或译“驳回她的要求”。这里指他不愿废弃对她所作的承诺。
    reason: lexical_alternative
lexical_decisions:
- source_word: περίλυπος γενόμενος
  choice: 虽然十分忧愁
  rationale: περίλυπος表示强烈的忧愁；分词在语境中与主句形成让步关系，译为“虽然……但……”既自然，也保留他内心悲痛与实际决定之间的张力。
- source_word: ὁ βασιλεὺς
  choice: 王
  rationale: 按马可叙事对希律的称谓直译为“王”，不改作较宽泛的“统治者”。
- source_word: διὰ τοὺς ὅρκους
  choice: 因自己所起的誓
  rationale: διά加宾格表达原因；ὅρκους是誓言，结合上下文明确为王本人所起的誓。
- source_word: τοὺς ἀνακειμένους
  choice: 同席的人
  rationale: 该词本指按当时习俗斜倚席间用餐的人；正文采用自然而仍具宴席语境的表达，并以脚注说明字面形象。
- source_word: οὐκ ἠθέλησεν
  choice: 不愿
  rationale: 准确表达意愿上的不肯，而非能力上的不能。
- source_word: ἀθετῆσαι αὐτήν
  choice: 拒绝她
  rationale: 此处指不肯驳回她的要求、使先前承诺落空；“拒绝她”简洁自然，同时脚注保留“驳回她的要求”的语境化表达。
theological_decisions:
- issue: 分词γενόμενος与主句的逻辑关系
  choice: 以“虽然……但……”表达隐含的让步关系
  alternative: 译作“王变得十分忧愁，因……就不愿……”
  rationale: 希腊文未明说让步连词，但叙事逻辑显出忧愁与不愿拒绝之间的反差。显化为让步结构可避免中文误读为忧愁本身导致他的决定，又不改变事件内容。
translation_notes:
  register: 采用现代、庄重而易懂的叙事中文。“王”贴近原文称谓；“同席的人”比字面“斜倚席间的人”自然，同时以脚注交代古代宴席姿势。
