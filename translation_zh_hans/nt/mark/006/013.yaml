  text: καὶ δαιμόνια πολλὰ ἐξέβαλλον, καὶ ἤλειφον ἐλαίῳ πολλοὺς ἀρρώστους καὶ ἐθεράπευον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/013.yaml
  text: And they were casting out many demons[a], and were anointing many sick people with oil and healing them.
translation:
  language: zh_hans
  text: 他们赶出许多鬼，又给许多病人抹油，并医治他们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δαιμόνια
  choice: 鬼
  rationale: δαιμόνιον通常指邪灵或鬼；“鬼”是现代汉语圣经叙事中直接、自然的对应词，也不把邻近经文的“污灵”措辞引入本节。
- source_word: πολλὰ
  choice: 许多
  rationale: 修饰δαιμόνια，表达单纯的数量意义；“许多”准确而自然。
- source_word: ἐξέβαλλον
  choice: 赶出了
  rationale: 该未完成时在这里概括门徒反复进行的行动。汉语通常以简洁的完成式叙事表达这类概述；“赶出”也是驱逐鬼灵的自然说法。
- source_word: ἤλειφον
  choice: 抹了
  rationale: ἀλείφω指涂抹或膏抹；在“用油”这一明确宾语下，“抹”自然易懂，并避免让“膏抹”承载原文未明说的礼仪含义。
- source_word: ἐλαίῳ
  choice: 用油
  rationale: ἔλαιον泛指油，在当时通常是橄榄油。正文保留较宽泛的“油”，脚注说明可具体理解为橄榄油。
- source_word: πολλοὺς ἀρρώστους
  choice: 许多病人
  rationale: ἄρρωστος在此作名词使用，指患病的人；“许多病人”符合现代汉语习惯。
- source_word: ἐθεράπευον
  choice: 治好了他们
  rationale: θεραπεύω表示医治。“治好了”自然表达医治的结果；“他们”清楚回指前面的病人。
- source_word: καὶ
  choice: 又
  rationale: 重复的καί连接并列行动；第二处译作“又”，既保留并列推进，也符合汉语叙事节奏。
theological_decisions:
- issue: 用油与医治之间的关系
  choice: 按历史叙述直译为门徒用油抹病人并治好他们，不说明油如何参与医治。
  alternative: 将油解释为本身产生医治功效，或解释为与医治毫无作用的纯粹象征。
  rationale: 本节只叙述用油和医治这两个相连的行动，并未界定其神学机制，也没有在此建立圣礼教义；译文因此保留原文的叙事关联和未决张力。
translation_notes:
  register: 采用现代、简洁而庄重的普通话。“赶出鬼”“用油抹病人”“治好”均便于普通读者理解；不以“膏油礼”等术语加入后来的宗派或礼仪解释。
