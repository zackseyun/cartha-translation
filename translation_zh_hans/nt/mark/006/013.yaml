  - severity: low
    issue: “赶出了”“抹了”均采用完成式表述
    rationale: 汉语叙事可用完成式概述过去事件，但此处三项希腊文动词一致为未完成时。以无“了”的动词串联可更一致地保留原文的概括性与反复性。
