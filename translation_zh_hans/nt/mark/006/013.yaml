  to: 他们赶出许多鬼，又给许多病人抹油，并医治他们。
  rationale: 修订仅调整汉语体貌和结果色彩：去除“了”及“治好”所带出的完成性，改以“赶出／抹油／医治”对应三个并列的未完成时动词。译文仍只叙述用油与医治相连的行动，不界定油的作用机制。
