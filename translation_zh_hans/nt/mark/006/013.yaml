  verdict: revise
  source_fidelity: 译文准确传达了赶出鬼、给患病者用油涂抹及医治三项行动；但“治好了他们”明确加入完成/结果性，而原文三个动词均为未完成时，叙述反复或持续发生的事。“赶出了”“抹了”也同样较强地完成化。汉语不必机械标示未完成体，但宜避免在末项特别强化结果。
  naturalness: “他们赶出许多鬼，又给许多病人抹油，并医治他们”是自然、简洁且庄重的现代普通话。“给……抹油”清楚表达以油涂抹，不需使用可能带有较强礼仪联想的“膏抹”。
  terminology: “鬼”可直接对应本节的δαιμόνια，且没有改用本节未出现的“污灵”。“许多病人”“油”“医治”均恰当。“橄榄油”的脚注作为词汇上的可译法合适。
  issues:
