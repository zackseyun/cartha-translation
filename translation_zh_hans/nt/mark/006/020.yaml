source:
  edition: SBLGNT
  text: ὁ γὰρ Ἡρῴδης ἐφοβεῖτο τὸν Ἰωάννην, εἰδὼς αὐτὸν ἄνδρα δίκαιον καὶ ἅγιον, καὶ συνετήρει αὐτόν, καὶ ἀκούσας αὐτοῦ πολλὰ ⸀ἠπόρει, καὶ ἡδέως αὐτοῦ ἤκουεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/020.yaml
  text: For Herod feared John[a], knowing that he was a righteous and holy man, and he kept him safe. And when he heard him, he was greatly perplexed, and yet he listened to him gladly.
translation:
  language: zh_hans
  text: 因为希律惧怕约翰，知道他是个公义、圣洁的人，并且保护他。希律听约翰讲的时候，十分困惑[a]，却仍乐意听他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“他做了许多事”，而不是“他十分困惑”。
    reason: textual_variant
lexical_decisions:
- source_word: ἐφοβεῖτο
  choice: 惧怕
  rationale: 保留φοβέομαι直接表达的惧怕之意；上下文中希律对约翰品格的认识，也使这种惧怕带有敬重成分，但不宜只译作较弱的“尊敬”而消除张力。
- source_word: εἰδὼς
  choice: 知道
  rationale: 该分词在语境中说明希律惧怕并保护约翰的缘由；用“知道”自然简洁，并以“所以”显明其因果关联。
- source_word: ἄνδρα δίκαιον καὶ ἅγιον
  choice: 是个公义、圣洁的人
  rationale: “公义”表达δίκαιος所指的正直合宜，“圣洁”保留ἅγιος的宗教与道德内涵，“人”对应ἄνδρα。
- source_word: συνετήρει
  choice: 保护他
  rationale: 在希罗底想要杀害约翰的上下文中，此词最自然地表示希律使约翰免受伤害；“保护他”比含混的“看守他”更准确。
- source_word: ἀκούσας αὐτοῦ
  choice: 听约翰讲的时候
  rationale: 属格结构表示听某人说话；补出“讲”符合现代汉语习惯，也避免“听约翰”产生歧义。
- source_word: πολλὰ ἠπόρει
  choice: 十分困惑
  rationale: 按SBLGNT的ἠπόρει，表达不知如何是好、深感困惑；πολλὰ在此作程度修饰，译为“十分”。
- source_word: ἡδέως αὐτοῦ ἤκουεν
  choice: 却仍乐意听他
  rationale: ἡδέως表示乐意、愉快地；“却仍”自然呈现希律一面困惑、一面乐意聆听的反差，而不消解这种张力。
theological_decisions:
- issue: 希律听约翰之后的抄本异文
  choice: 采用SBLGNT正文ἠπόρει：“十分困惑”
  alternative: 部分抄本作ἐποίει：“做了许多事”
  rationale: 正文读法呈现希律面对约翰信息时内心困惑，却仍乐意聆听的张力。另一读法会显著改变句义，因此收入脚注而不并入正文。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“惧怕”保留原文力度，“公义、圣洁”沿用清楚且广为理解的圣经用语。脚注标记置于实际存在异文的“十分困惑”之后。
