source:
  edition: SBLGNT
  text: οὐχ οὗτός ἐστιν ὁ τέκτων, ὁ υἱὸς ⸀τῆς Μαρίας ⸂καὶ ἀδελφὸς⸃ Ἰακώβου καὶ ⸀Ἰωσῆτος καὶ Ἰούδα καὶ Σίμωνος; καὶ οὐκ εἰσὶν αἱ ἀδελφαὶ αὐτοῦ ὧδε πρὸς ἡμᾶς; καὶ ἐσκανδαλίζοντο ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/003.yaml
  text: Is this not the carpenter[b][a], the son of Mary and brother of James and Joses and Judas and Simon? And are not his sisters here with us? And they took offense at him.
translation:
  language: zh_hans
  text: “这不是那个木匠，马利亚的儿子，雅各、约西、犹大和西门的兄弟[a]吗？他的姐妹[a]不也在这里和我们一起吗？”他们就因他感到反感[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “兄弟”和“姐妹”也可理解为“亲属”。希腊词通常指兄弟姐妹，但有些基督教传统认为这里指较广义的亲属或继兄弟姐妹。
    reason: alternative_reading
  - marker: b
    text: 或译：“他们因他跌倒。”这里的“跌倒”指因他而不肯接受他。
    reason: lexical_alternative
lexical_decisions:
- source_word: τέκτων
  choice: 木匠
  rationale: 该词可泛指手艺人或建造者，但在此处传统且最可能的含义是从事木作等手工劳动的工匠；“木匠”简明自然，也符合乡里人辨认耶稣的语境。
- source_word: υἱὸς τῆς Μαρίας
  choice: 马利亚的儿子
  rationale: 直接保留希腊文以母亲称呼耶稣这一显著表达，不在正文中解释其可能带有的社会意味。
- source_word: ἀδελφὸς / ἀδελφαὶ
  choice: 兄弟 / 姐妹
  rationale: 希腊词通常指亲兄弟和亲姐妹。正文保留其直接词义，不裁定他们究竟是同母或同父母的手足、继亲手足，还是较广义的亲属。
- source_word: Ἰωσῆτος
  choice: 约西
  rationale: 按本节所见希腊名字形式音译为“约西”，不将其规范化为“约瑟”，以保留原文名字形式的区别。
- source_word: ὧδε πρὸς ἡμᾶς
  choice: 在这里和我们一起
  rationale: 自然表达这些女子就在说话者所在的本地群体中，保留原语所含的地点和社会亲近感。
- source_word: ἐσκανδαλίζοντο ἐν αὐτῷ
  choice: 因他而反感
  rationale: 此处不是字面上的绊倒，而是耶稣成为他们不接受他的缘由。“因他而反感”在现代汉语中自然，并保留介词结构所表达的缘由关系；脚注列出更贴近“绊倒”意象的译法。
theological_decisions:
- issue: 耶稣的“兄弟”和“姐妹”所指的具体亲属关系
  choice: 正文采用通常的亲属称谓“兄弟”和“姐妹”，不进一步界定关系。
  alternative: 可理解为较广义的亲属，或约瑟先前婚姻所生的继亲手足，也有人理解为马利亚后来所生的儿女。
  rationale: ἀδελφός和ἀδελφή通常意为兄弟、姐妹，但经文本身没有明确说明更精确的家族关系。正文应保留原文表层意义，并以脚注呈现传统中的其他理解，避免替读者解决神学争议。
- issue: “马利亚的儿子”的社会语气
  choice: 直接译出，不添加贬义或中性解释。
  alternative: 可将其理解为中性的母系身份说明，也可能认为乡里人的称呼带有轻蔑意味。
  rationale: 上下文可能暗示这一称呼带有社会锋芒，但原文没有明说；译文不应把推断写进正文。
- issue: ἐσκανδαλίζοντο ἐν αὐτῷ的神学与叙事张力
  choice: 译为“他们就因他而反感”。
  alternative: “他们因他跌倒”或“他成了他们的绊脚石”。
  rationale: 在叙事中，该表达指乡里人因耶稣而产生排斥、不肯接受他；主译文传达实际语用意义，脚注保留希腊词的“绊倒”意象。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事语言。引语中的“这不是……吗”和“不也……吗”保留乡里人带有质疑色彩的反问；“那个木匠”自然体现他们把耶稣视为熟悉的本地人物。所有脚注标记均置于相关正文词语之后。
