  text: καὶ ἀνέβη πρὸς αὐτοὺς εἰς τὸ πλοῖον, καὶ ἐκόπασεν ὁ ἄνεμος. καὶ λίαν ⸂ἐκ περισσοῦ⸃ ἐν ἑαυτοῖς ⸀ἐξίσταντο,
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/051.yaml
  text: And he got into the boat with them[a], and the wind stopped. And they were utterly astonished within themselves[b],
translation:
  language: zh_hans
  text: 他上到他们所在的船上，风就停了。他们心里极其[a]惊愕[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文连续使用强化程度的词语，直译近于“极其、超乎寻常地”。
    reason: lexical_alternative
  - marker: b
    text: “惊愕”也可译作“惊奇”；这个希腊词语气很强，也可表达“震惊得几乎失去常态”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβη … εἰς τὸ πλοῖον
  choice: 上了船
  rationale: ἀναβαίνω本义为“上去”，与εἰς τὸ πλοῖον连用时表示登上、进入船中；“上了船”既自然又保留动作意象。
- source_word: πρὸς αὐτούς
  choice: 到他们那里
  rationale: πρός在此随趋向动作表达朝向并来到门徒身边；译作“到他们那里”比单纯译成“和他们一起”更直接保留原文的趋向含义。
- source_word: πλοῖον
  choice: 船
  rationale: 在加利利海的叙事语境中，现代汉语用“船”准确自然，无须具体化为大型船只。
- source_word: ἐκόπασεν ὁ ἄνεμος
  choice: 风便停了
  rationale: κοπάζω用于风时可指止息或平静下来；“停了”清楚简洁，“便”自然承接耶稣上船与风止息的叙事次序，但不额外明说因果。
- source_word: λίαν ἐκ περισσοῦ
  choice: 万分
  rationale: 两个强化成分叠加，表达极高程度；“万分”在现代汉语中凝练、庄重，并保留强烈语气。
- source_word: ἐν ἑαυτοῖς
  choice: 心里
  rationale: 该短语表示反应发生在他们自身内部；“心里”是现代汉语自然表达，不把它误解为彼此私下交谈。
- source_word: ἐξίσταντο
  choice: 惊愕
  rationale: ἐξίστημι在此为未完成时中动/不及物用法，表示强烈震惊、诧异；“惊愕”比一般的“惊讶”更能传达其力度，同时不把“失去常态”的词源形象硬译进正文。
theological_decisions:
- issue: 门徒反应的强烈程度
  choice: “心里万分惊愕”
  alternative: “心里极其惊奇”或“惊愕得几乎失去常态”
  rationale: 原文以λίαν ἐκ περισσοῦ强化ἐξίσταντο，突出门徒面对耶稣及风止息时的强烈反应。正文保留这种力度，却不补入原文未明说的信仰评价或基督论解释。
translation_notes:
  register: 采用自然、庄重的现代标准普通话。“上了船，到他们那里”保留动作的趋向；“风便停了”简洁而不额外强化因果；“心里万分惊愕”重现原文叠加强调的力度。所有脚注标记均置于所解释的词语之后。
