  text: οὐ γὰρ συνῆκαν ἐπὶ τοῖς ἄρτοις, ⸂ἀλλ’ ἦν⸃ αὐτῶν ἡ καρδία πεπωρωμένη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/052.yaml
  text: for they did not understand about the loaves[b][a], but their hearts were hardened.
translation:
  language: zh_hans
  text: 因为他们不明白那些饼的意义[a]，他们的心却是刚硬的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不明白关于那些饼的事。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“他们的心是麻木的。”
    reason: lexical_alternative
lexical_decisions:
- source_word: συνῆκαν
  choice: 明白
  rationale: συνίημι表示理解、领会；“明白”自然清楚，并保留门徒在认知和属灵层面的迟钝。
- source_word: ἐπὶ τοῖς ἄρτοις
  choice: 那些饼所显明的意义
  rationale: ἐπί加与格在这里指向五饼事件及其意义。直译“关于那些饼”在现代汉语中略显含混，因此正文明确表达其语境含义，同时用脚注保留较贴近形式的译法。
- source_word: ἄρτοις
  choice: 那些饼
  rationale: 复数ἄρτοις指前述喂饱众人的几个饼；“那些饼”既保留复数指称，也与叙事上下文衔接。
- source_word: αὐτῶν ἡ καρδία
  choice: 他们的心
  rationale: 希腊文使用单数集合名词καρδία，指众门徒共同的内在理解与态度；汉语“他们的心”自然，也保留原文单数形式。
- source_word: πεπωρωμένη
  choice: 刚硬
  rationale: πωρόω具有变硬、麻木迟钝之意；“刚硬”是庄重而熟悉的圣经表达，且不额外断定这种状态的最终成因。
- source_word: ἀλλ’ ἦν
  choice: 仍是
  rationale: ἀλλά构成与前句的对照，ἦν描述持续状态。汉语中因果句后用“仍是”自然呈现其解释关系和持续状态；对照关系由句意体现。
theological_decisions:
- issue: πεπωρωμένη所描述的门徒状态及其成因
  choice: 他们的心仍是刚硬的
  alternative: 他们的心已经麻木了
  rationale: “刚硬”保留属灵迟钝的隐喻，却不将其明确解释为上帝施行的审判性刚硬，也不把它仅仅化约为智力上的不理解。
- issue: 饼与门徒不明白之事的关系
  choice: 不明白那些饼所显明的意义
  alternative: 不明白关于那些饼的事
  rationale: 上下文表明问题不只是他们不记得饼，而是未领会喂饱众人之事所显明的意义；该译法表达语境所要求的含义，但不具体规定其全部基督论或神学内容。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“那些饼”回指五饼喂饱众人的事件；保留“他们的心”这一集合性单数表达。所有脚注标记均置于正文相应位置。
