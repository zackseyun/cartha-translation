  text: ἄλλοι ⸀δὲ ἔλεγον ὅτι Ἠλίας ἐστίν· ἄλλοι δὲ ἔλεγον ὅτι ⸀προφήτης ὡς εἷς τῶν προφητῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/015.yaml
  text: But others were saying[a], “He is Elijah,” and others were saying, “He is a prophet, like one of the prophets.”
translation:
  language: zh_hans
  text: 另一些人却说：“他是以利亚。”还有一些人说：“他是个先知，就像众先知中的一位。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他是个先知”也可译作“他是那位先知”，即把这话理解为指某位特定的末世人物；不过，原文随后说“就像众先知中的一位”，因此泛指“一位先知”更为自然。
    reason: alternative_reading
lexical_decisions:
- source_word: ἄλλοι δὲ
  choice: 另一些人却
  rationale: ἄλλοι指人群中的另一部分，δέ表示轻微转折或话语推进；“另一些人却”自然呈现不同意见。
- source_word: ἔλεγον
  choice: 说
  rationale: 希腊语未完成时可表示当时持续或反复流传的说法；现代汉语在此用“说”已可自然承载语境，不必生硬加入“不断”。
- source_word: ὅτι Ἠλίας ἐστίν
  choice: “他是以利亚。”
  rationale: 改用直接引语符合现代汉语叙事习惯；Ἠλίας按通行圣经译名译作“以利亚”。
- source_word: προφήτης
  choice: 先知
  rationale: 无冠词的谓语名词在本句中较自然地表达类别身份；汉语不使用不定冠词，“他是先知”可表达“他是一位先知”，同时保留少量原文可能具有的歧义。
- source_word: ὡς εἷς τῶν προφητῶν
  choice: 像古时的一位先知
  rationale: ὡς表达比较，εἷς τῶν προφητῶν意为“众先知中的一位”。补出“古时”使普通读者明白这里是与以往的先知相比，并未指定某一位先知。
theological_decisions:
- issue: προφήτης是泛指“一位先知”，还是特指末世性的“那位先知”
  choice: 先知（即一位先知）
  alternative: 那位先知
  rationale: 原文没有冠词，且紧接着以“像古时的一位先知”加以说明，因此泛指的理解更自然；脚注仍保留特指读法的可能性，避免完全消除原文的潜在张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“另一些人却……还有一些人……”清楚呈现群众中并列而不同的看法；正文保留“先知”的汉语自然表达，并以脚注交代可能但较不自然的特指读法。
