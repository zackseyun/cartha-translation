  text: καὶ ἀποταξάμενος αὐτοῖς ἀπῆλθεν εἰς τὸ ὄρος προσεύξασθαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/046.yaml
  text: And after saying goodbye to them[a], he went away to the mountain to pray.
translation:
  language: zh_hans
  text: 他辞别了他们[a]，就到山上去祷告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“向他们告别”。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: 就
  rationale: 承接前文并推进叙事；现代汉语用“就”自然表达随后发生的动作，不必机械译作“并且”。
- source_word: ἀποταξάμενος
  choice: 辞别了
  rationale: 该中间语态分词在此表示向人告别、与人辞行。“辞别”庄重而自然，也与间接受格αὐτοῖς顺畅搭配；“遣散”虽在某些语境可能成立，但此处更侧重耶稣与他们分别。
- source_word: αὐτοῖς
  choice: 他们
  rationale: 复数代词指向上文提到的人群；汉语置于“辞别”之后作宾语即可清楚表达。
- source_word: ἀπῆλθεν
  choice: 去
  rationale: 该动词含离开原处而去之意；前面的“辞别”已经表明离开的语境，译作“去”简洁自然，避免重复表达。
- source_word: εἰς τὸ ὄρος
  choice: 到山上
  rationale: 保留ὄρος的具体地点意义。现代汉语叙事中“到山上”比“到那座山”更自然；希腊文定冠词未必要求汉语明确指示某一座山。
- source_word: προσεύξασθαι
  choice: 去祷告
  rationale: 不定式表示目的；“去祷告”直接、自然地传达他上山的目的。
theological_decisions:
- issue: “山”的所指与意义
  choice: 译作“山上”，不附加象征或神学含义
  alternative: 译作“那座山上”，或解释为特殊启示之地
  rationale: 原文虽有定冠词，但没有说明具体是哪座山，也未明说其象征意义。译文保留具体场景而不增添文本没有表达的神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“辞别”较“说了再见”更符合经文语体，同时不显古奥；句式简洁，保留原文动作次序与祷告目的。
