source:
  edition: SBLGNT
  text: καὶ γενομένου σαββάτου ἤρξατο ⸂διδάσκειν ἐν τῇ συναγωγῇ⸃· καὶ ⸀οἱ πολλοὶ ἀκούοντες ἐξεπλήσσοντο λέγοντες· Πόθεν τούτῳ ταῦτα, καὶ τίς ἡ σοφία ἡ δοθεῖσα ⸀τούτῳ, καὶ ⸀αἱ δυνάμεις τοιαῦται διὰ τῶν χειρῶν αὐτοῦ ⸀γινόμεναι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/002.yaml
  text: And when the Sabbath came[a], he began to teach in the synagogue. And many who heard him were astonished, saying, “Where did this man get these things? And what is this wisdom given to him, and such mighty works happening through his hands?”
translation:
  language: zh_hans
  text: 到了安息日，他开始在会堂里教导人。许多听见的人都十分惊讶，说：“这个人从哪里得来这一切？赐给他的是什么智慧？这些借着他的手所成就的大能作为[a]又是怎么回事？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大能作为”也可译作“神迹”或“能力的彰显”。希腊文复数δυνάμεις可指超常的作为，或能力的彰现。
    reason: 说明δυνάμεις的语义范围，并保留其可指非凡作为或能力彰现的译法空间。
lexical_decisions:
- source_word: γενομένου σαββάτου
  choice: 到了安息日
  rationale: 这是属格独立结构，交代时间背景。“到了安息日”既保留“来到、发生”的时间意味，也符合现代汉语叙事习惯。
- source_word: ἤρξατο διδάσκειν
  choice: 开始……教导人
  rationale: 保留ἄρχομαι加不定式所表达的起始意义；补出“人”使汉语自然，并未限定听众身份。
- source_word: συναγωγῇ
  choice: 会堂
  rationale: 此处指犹太人聚会和受教的固定场所，“会堂”是准确而通行的译法。
- source_word: οἱ πολλοὶ ἀκούοντες
  choice: 许多人听见了
  rationale: οἱ πολλοί在这里指许多听众；汉语依上下文不必补出“他所讲的”，从而避免添加原文没有明说的宾语。
- source_word: ἐξεπλήσσοντο
  choice: 十分惊讶
  rationale: 表达该动词强烈的震惊、诧异意味；“十分”体现其强度，同时保持普通读者易懂的措辞。
- source_word: Πόθεν τούτῳ ταῦτα
  choice: 这个人从哪里得来这一切？
  rationale: πόθεν询问来源；“这个人”体现τούτῳ在语境中略带疏离的指称语气，“这一切”概括其教导、智慧和能力。
- source_word: τίς ἡ σοφία ἡ δοθεῖσα τούτῳ
  choice: 赐给他的是什么智慧？
  rationale: 保留δοθεῖσα的被动含义，不明说赐予者；疑问句也保留众人既惊异又质疑的语气。
- source_word: δυνάμεις
  choice: 异能
  rationale: 复数δυνάμεις在马可福音中常指彰显能力的超常作为。“异能”简洁保留能力与奇异作为两方面含义，脚注列出其他可能译法。
- source_word: διὰ τῶν χειρῶν αὐτοῦ γινόμεναι
  choice: 借着他的手施行出来
  rationale: 保留διά加属格的媒介含义和“手”的原文意象；“施行出来”自然表达这些作为正在发生或成就。
theological_decisions:
- issue: δυνάμεις所指的性质
  choice: 译作“异能”，指彰显能力的非凡作为
  alternative: “神迹”或“大能的作为”
  rationale: 语境把智慧与借他的手发生的非凡作为并列。采用“异能”既反映马可福音中的常见语义，又不像“神迹”那样完全压缩为一种解释。
- issue: 智慧的赐予者是否明说
  choice: 采用被动式“赐给他的”，不补出赐予者
  alternative: “上帝赐给他的”
  rationale: 希腊文使用被动分词而未明说施事者；译文保留这种开放性，不把可能暗含的神圣被动直接明文化。
- issue: τούτῳ的语气
  choice: 首次译作“这个人”
  alternative: “他”或“这人”
  rationale: “这个人”能适度传达当地听众对耶稣略显疏离、质疑的语气，又不把轻蔑程度夸大。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以连续问句重现听众惊讶和质疑交织的语气；末句补入“又是怎么回事”以承接希腊文省略结构，使汉语完整流畅而不替原文消解其张力。
