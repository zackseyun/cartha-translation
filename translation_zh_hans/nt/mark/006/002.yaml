revisions:
- from: 到了安息日，他开始在会堂里教导人。许多人听见了，就十分惊讶，说：“这个人从哪里得来这一切？赐给他的是什么智慧？这样的异能[a]竟借着他的手施行出来，又是怎么回事？”
  to: 到了安息日，他开始在会堂里教导人。许多听见的人都十分惊讶，说：“这个人从哪里得来这一切？赐给他的是什么智慧？这些借着他的手所成就的大能作为[a]又是怎么回事？”
  rationale: 修订集中于δυνάμεις及末句句法。“大能作为”明确其在本节指发生的非凡作为，又不把它预先限定为某一神学解释；直接询问“这些……作为”保留原文与前一问并列的结构及惊异语气。其余内容维持原译的时间、被动“赐给他”、以及“这个人”所传达的适度疏离语气。
