  text: Καὶ ἐξῆλθεν ἐκεῖθεν, καὶ ⸀ἔρχεται εἰς τὴν πατρίδα αὐτοῦ, καὶ ἀκολουθοῦσιν αὐτῷ οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/001.yaml
  text: And he went out from there and came to his hometown[a], and his disciples followed him.
translation:
  language: zh_hans
  text: 耶稣离开那里，来到自己的家乡；他的门徒跟随他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文先用过去时叙述“离开”，随后用历史现在时叙述“来到”和“跟随”，使叙事更有现场感；中文通常不通过动词词形标示这种时态转换。
    reason: 说明原文的叙事时态及其文体效果。
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: 离开
  rationale: 该词为ἐξέρχομαι的不定过去时，表示从先前所在之处出去、离去。“离开”符合现代汉语叙事习惯，也与ἐκεῖθεν“那里”自然搭配。
- source_word: ἐκεῖθεν
  choice: 那里
  rationale: 地点副词指明出发之处；在“离开那里”中已自然表达“从那里”的意思。
- source_word: ἔρχεται
  choice: 来到
  rationale: 原文为历史现在时，表示向目的地而来。“来到”保留移动到达的方向，又不额外加入原词没有明说的“返回”含义。现代汉语动词不借形态标示过去或现在，因此可自然承载原文生动的叙事效果。
- source_word: πατρίδα
  choice: 家乡
  rationale: πατρίς在本段语境中指耶稣自己的故乡，即本乡本地，而非广义的国家。“家乡”自然、准确，并不把范围过度限定为城镇。
- source_word: ἀκολουθοῦσιν
  choice: 跟随
  rationale: 该词既可描述随同行动，也保留福音书中门徒跟从师傅的关系含义；“跟随”比泛指同行的“陪同”更贴近原词。
- source_word: μαθηταὶ
  choice: 门徒
  rationale: “门徒”是福音书语境中μαθηταί的通行且准确译法，同时体现学习者与跟随者的身份。
theological_decisions:
- issue: 历史现在时ἔρχεται与ἀκολουθοῦσιν的处理
  choice: 译作“来到”和“跟随”，不在正文中强加汉语时态，并以脚注说明希腊文的时态转换。
  alternative: 按过去叙事明确译作“来到了”和“跟随了”，或用“这时来到……也跟随着”刻意凸显现场感。
  rationale: 这是叙事文体问题，并非教义判断。现代汉语动词本身不作时态屈折，因此正文可保持自然，同时脚注保存原文由不定过去时转入历史现在时所带来的鲜明效果。
- issue: πατρίς所指范围
  choice: 家乡
  alternative: 故乡、家乡城镇、本乡本地
  rationale: 上下文所指是耶稣的本乡，但本节没有直接写出“拿撒勒”，也未将范围严格界定为一座城；“家乡”既符合语境，又避免过度具体化。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“耶稣”补明希腊文动词所隐含且由上下文清楚确定的主语，避免中文独立成节时指代突兀；分号呈现主句与门徒跟随这一并列动作之间的关系。
