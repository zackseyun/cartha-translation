  text: And they picked up twelve basketfuls of broken pieces[a], and some of the fish.
translation:
  language: zh_hans
  text: 他们收拾起碎块，收了满满十二个篮子；又收拾了鱼的剩余部分[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以及一些鱼。”原文直译为“以及从鱼来的（部分）”；动词“收拾起”和所收集之物在此省略。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦραν
  choice: 收拾起来
  rationale: 此处指筵席后把剩下的食物收集起来；“收拾起来”符合现代汉语叙事，也保留了具体动作。
- source_word: κλάσματα
  choice: 碎块
  rationale: κλάσματα指掰开后留下的块状食物；结合上文主要指饼的碎块。“碎块”简洁而具体。
- source_word: δώδεκα κοφίνων πληρώματα
  choice: 装满了十二篮子
  rationale: 该短语把“十二篮子”和“装满之物／满量”结合起来；译作“装满了十二篮子”自然地表达十二个篮子都被收集物填满。
- source_word: κόφινος
  choice: 篮子
  rationale: κόφινος指篮子；原文在本节无须进一步说明大小，因此不作过度限定。
- source_word: πληρώματα
  choice: 装满了
  rationale: 复数πληρώματα可指各篮所装的满量或内容；“装满了”保留满载之意，又避免生硬的“十二篮子的满量”。
- source_word: ἀπὸ τῶν ἰχθύων
  choice: 还有鱼的碎块
  rationale: ἀπό在这里表示来源，说明所收集的也有来自鱼的部分；依上下文补出“碎块”，比直译“还有从鱼来的”更符合汉语，同时不把它误解为十二篮全都包含鱼。
theological_decisions: []
