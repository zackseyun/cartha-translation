  yaml_path: translation/nt/mark/006/044.yaml
  text: And those who ate the loaves were five thousand men[a][b].
translation:
  language: zh_hans
  text: 吃了那些饼的男人共有五千人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文“男人”，特指成年男性，并非泛指所有人。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν
  choice: 共有
  rationale: 此处未完成时的 εἰμί 作系词，陈述吃饼者的总数；汉语用“共有”自然表达数量关系，不额外引入“被数点”等含义。
- source_word: οἱ φαγόντες
  choice: 吃饼的
  rationale: 带冠词的不定过去时分词以已经发生的“吃”为特征界定这群人；“吃饼的”简洁自然，也不把不定过去时过度译成过去完成时。
- source_word: τοὺς ἄρτους
  choice: 饼
  rationale: ἄρτος 可指饼或作为集合概念的食物“饼/面包”；这里复数特指本次喂饱众人的叙事中所分的那些饼。现代汉语在此用“饼”即可自然承接上下文，无须生硬标示复数。
- source_word: πεντακισχίλιοι
  choice: 五千
  rationale: 直接对应原文基数词。
- source_word: ἄνδρες
  choice: 男人
  rationale: ἀνήρ 在此特指男性，而非泛指所有人；“男人”保留原文性别限定，并比“男性”更符合叙事语体。
theological_decisions:
- issue: 计数对象的性别限定
  choice: 在正文中将 ἄνδρες 译为“男人”。
  alternative: 人
  rationale: 原文使用特指男性的 ἀνήρ，而不是泛指人的词。译文保留这一限定，不把五千解释成不分性别的总人数；同时也不擅自断定未被计入者的具体人数。
translation_notes:
  register: 采用现代、简洁而庄重的叙事语言。“吃饼的男人共有五千”符合自然汉语数量表达；脚注保留原文性别用词所涉及的解释空间。
