  text: καὶ λαβὼν τοὺς πέντε ἄρτους καὶ τοὺς δύο ἰχθύας ἀναβλέψας εἰς τὸν οὐρανὸν εὐλόγησεν καὶ κατέκλασεν τοὺς ἄρτους καὶ ἐδίδου τοῖς μαθηταῖς ⸀αὐτοῦ ἵνα ⸀παρατιθῶσιν αὐτοῖς, καὶ τοὺς δύο ἰχθύας ἐμέρισεν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/041.yaml
  text: And taking the five loaves and the two fish[a], looking up to heaven, he blessed and broke the loaves, and kept giving them to his disciples to set before them[b], and he divided the two fish among them all.
translation:
  language: zh_hans
  text: 耶稣拿起那五个饼和两条鱼，举目望天，祝福后掰开了饼，不断递给门徒，让他们摆在众人面前；又把两条鱼分给众人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαβὼν
  choice: 拿起
  rationale: 不定过去时分词引出随后一连串动作；“拿起”自然、具体，并保留动作次序。
- source_word: τοὺς πέντε ἄρτους
  choice: 那五个饼
  rationale: ἄρτος在此指可数的饼；现代汉语用“个”计数自然，“那”承接上文已提及的食物。
- source_word: τοὺς δύο ἰχθύας
  choice: 两条鱼
  rationale: 直译复数名词，并使用现代汉语中鱼的常用量词“条”。
- source_word: ἀναβλέψας εἰς τὸν οὐρανὸν
  choice: 举目望天
  rationale: 准确表达向天仰望的动作，也保留οὐρανός在场景中的宗教意蕴；措辞简洁庄重。
- source_word: εὐλόγησεν
  choice: 祝福
  rationale: 原文用εὐλογέω，宾语未明说；不补出“这些食物”，避免断定祝福的直接对象，并以脚注说明用餐语境中的另一种理解。
- source_word: κατέκλασεν τοὺς ἄρτους
  choice: 掰开饼
  rationale: 保留明确宾语和具体动作；“掰开”比泛指的“擘”更符合现代普通读者的语言。
- source_word: ἐδίδου
  choice: 不断递给
  rationale: 未完成时可体现分发过程中持续或反复的动作；“不断递给”在汉语中清楚传达这一体貌。
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: 门徒
  rationale: 汉语语境中所属关系已由主语耶稣清楚限定，不必机械补出“他的”，以免行文累赘。
- source_word: ἵνα παρατιθῶσιν αὐτοῖς
  choice: 让他们摆在众人面前
  rationale: 表达ἵνα的目的含义，并保留παρατίθημι“摆在……面前”的具体图景；用“众人”澄清第二个复数代词指群众，避免汉语双重“他们”的歧义。
- source_word: ἐμέρισεν πᾶσιν
  choice: 分给众人
  rationale: ἐμέρισεν表示分开、分配；“分给”自然包含分配含义，πᾶσιν译作“众人”，表达在场所有人。
theological_decisions:
- issue: 用餐语境中εὐλόγησεν的译法及其隐含对象
  choice: 祝福
  alternative: 献上感谢；为这些食物祝福
  rationale: 原文是εὐλογέω而非εὐχαριστέω，且没有明示宾语。正文采用“祝福”，既贴近词形，也不擅自确定耶稣所祝福的是上帝还是食物；脚注保留用餐语境下“献上感谢”的可能含义。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“举目望天”保留经文语体但仍通俗；“掰开”避免使用现代读者较陌生的“擘开”。通过“门徒／众人”明确两个复数代词的不同所指，同时不增加原文没有的神学解释。
