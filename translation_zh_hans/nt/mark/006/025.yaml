  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ εἰσελθοῦσα ⸀εὐθὺς μετὰ σπουδῆς πρὸς τὸν βασιλέα ᾐτήσατο λέγουσα· Θέλω ἵνα ⸂ἐξαυτῆς δῷς μοι⸃ ἐπὶ πίνακι τὴν κεφαλὴν Ἰωάννου τοῦ βαπτιστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/025.yaml
  text: And she immediately went in with haste to the king and asked[a], saying, “I want you to give me at once, on a platter, the head of John the Baptizer.”
translation:
  language: zh_hans
  text: 她立刻匆匆进去，到王面前请求，说：“我要你马上把施洗者约翰的头放在盘子上给我。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰσελθοῦσα
  choice: 进去见王
  rationale: 该不定过去时分词表示她进入王所在之处；“进去见王”在现代汉语中自然，也结合下文 πρὸς τὸν βασιλέα 清楚交代她所到的人面前。
- source_word: εὐθὺς
  choice: 立刻
  rationale: 保留马可叙事中常见的即时性，并与后文 ἐξαυτῆς 所要求的“马上”分别表达。
- source_word: μετὰ σπουδῆς
  choice: 匆匆
  rationale: 表达行动急促、迫切，而不额外赋予正面的热忱意味。
- source_word: βασιλέα
  choice: 王
  rationale: 尽管希律·安提帕在历史上的正式称号是分封王，原文在此使用 βασιλεύς，因此按叙事措辞译为“王”。
- source_word: ᾐτήσατο λέγουσα
  choice: 向他求道
  rationale: αἰτέω 在此表示提出请求；“求道”简洁自然，命令般的强硬语气由随后引语体现，无须在动词中加重。
- source_word: Θέλω ἵνα ... δῷς μοι
  choice: 我要你……给我
  rationale: ἵνα 从句说明意愿的内容；“我要你……给我”既符合现代汉语，也保留说话者直截了当的意志。
- source_word: ἐξαυτῆς
  choice: 马上
  rationale: 此词要求立即执行，与前面的 εὐθύς 分属两个动作，故分别译出，避免合并。
- source_word: ἐπὶ πίνακι
  choice: 放在盘子上
  rationale: πίναξ 指盘或托盘；“盘子”通俗自然，并适合宴席场景。汉语加入“放”以自然表达头置于盘上的关系。
- source_word: τὴν κεφαλὴν Ἰωάννου τοῦ βαπτιστοῦ
  choice: 施洗者约翰的头
  rationale: 直译该请求的具体内容，不淡化其残酷性；βαπτιστής 是对约翰行为或身份的描述，译为“施洗者”。
theological_decisions:
- issue: Ἰωάννου τοῦ βαπτιστοῦ 的称谓
  choice: 施洗者约翰
  alternative: 施洗约翰
  rationale: “施洗者”直接保留 βαπτιστής 作为描述性称号的功能；“施洗约翰”是汉语传统称法，也表达同一身份，但称号的名词性质略不明显。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“立刻”与“马上”分别对应两个表示即时性的希腊词，以保留原文重复加强的紧迫感。引语保持女孩要求的直率和冷酷，不用文言式表达。
