  naturalness: “立刻匆匆”自然地保留了迅速和急促；“进去见王”也可通。将“向他求道”改为“到王面前请求，说”能消除歧义，且更合乎现代叙事汉语。
  terminology: “王”遵循原文叙事称谓；“施洗者约翰”准确呈现描述性称号，亦可为现代读者理解。“盘子”对应 πίναξ 合宜。
