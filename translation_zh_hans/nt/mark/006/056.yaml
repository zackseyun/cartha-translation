source:
  edition: SBLGNT
  text: καὶ ὅπου ἂν εἰσεπορεύετο εἰς κώμας ἢ ⸂εἰς πόλεις ἢ εἰς⸃ ἀγροὺς ἐν ταῖς ἀγοραῖς ⸀ἐτίθεσαν τοὺς ἀσθενοῦντας, καὶ παρεκάλουν αὐτὸν ἵνα κἂν τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ ἅψωνται· καὶ ὅσοι ἂν ⸀ἥψαντο αὐτοῦ ἐσῴζοντο.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/056.yaml
  text: And wherever he entered villages or cities or countryside[a], they were laying the sick in the marketplaces and begged him that they might even touch the fringe of his garment[c][b]; and as many as touched it were being healed.
translation:
  language: zh_hans
  text: 他无论进到村庄、城镇还是乡间，人们总把病人安置在集市上，恳求他让他们哪怕只摸到他衣服的边穗[a]；凡摸到他的人，都得了医治[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “边穗”也可译作“衣边”或“下摆”。这里的希腊词可指衣服的边缘，也可能让人想到犹太人衣服上的穗子。
    reason: lexical_alternative
  - marker: b
    text: “得了医治”：希腊文直译为“得救了”；在这里指病得医治、身体康复。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου ἂν
  choice: 无论……到哪里（按后接地点具体译为“无论进到……”）
  rationale: ὅπου与ἄν构成不定、概括性的表达，说明这是耶稣每到一处反复发生的情形。
- source_word: εἰσεπορεύετο
  choice: 进到
  rationale: 未完成时在概述中表达反复、惯常的行动；“无论……还是……”及“总”自然传达这一迭代意味。
- source_word: κώμας ἢ εἰς πόλεις ἢ εἰς ἀγρούς
  choice: 村庄、城镇还是乡间
  rationale: κώμη指村庄，πόλις在此可自然译为城镇，ἀγροί在地点并列中指乡野或农村地区，而非特指一块块田地。
- source_word: ἐν ταῖς ἀγοραῖς
  choice: 在集市上
  rationale: ἀγορά可指市场或公共广场；“集市”简明表达公众聚集的场所。
- source_word: ἐτίθεσαν
  choice: 总把……安置
  rationale: 未完成时表示反复进行；“总”保留惯常意味，“安置”比单纯“放”更适合病人的语境。
- source_word: τοὺς ἀσθενοῦντας
  choice: 病人
  rationale: 该现在分词实质化，指患病或身体软弱的人；“病人”自然简洁。
- source_word: παρεκάλουν
  choice: 恳求
  rationale: 在求医治的语境中表示迫切请求，“恳求”兼具庄重与自然。
- source_word: ἵνα κἂν ... ἅψωνται
  choice: 让病人哪怕只摸到
  rationale: κἄν表达最低限度的请求，可译“哪怕只”；补出“病人”使汉语指代清楚，不改变原意。
- source_word: τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ
  choice: 他衣服的边穗
  rationale: κράσπεδον可指衣服边缘、下摆或边穗；“边穗”保留具体形象及犹太服饰背景，同时用脚注交代词义范围。
- source_word: ἥψαντο αὐτοῦ
  choice: 摸到的
  rationale: 希腊文αὐτοῦ语法上可指“他”，而紧接前句也可理解为摸到其衣服边穗；汉语省略宾语可保留这种衔接，避免过度限定。
- source_word: ἐσῴζοντο
  choice: 都得了医治
  rationale: σῴζω本义范围包括拯救、保全和使痊愈；此处明确谈病人，语境义为身体得医治，同时脚注保留原词“得救”的字面范围。
theological_decisions:
- issue: σῴζω在医治叙事中的译法
  choice: 得了医治
  alternative: 得救了／康复了
  rationale: 上下文聚焦患病者因触摸而恢复，主文采用明确的身体医治义；脚注说明希腊文直译可为“得救”，以保留该动词较宽的神学语义而不把救恩含义强加给本节。
- issue: 触摸对象αὐτοῦ的指向
  choice: 省略宾语，译作“凡摸到的”
  alternative: 凡摸到他的／凡摸到那边穗的
  rationale: αὐτοῦ在语法上是阳性单数“他／他的”，可理解为摸到耶稣；前句又明确说摸衣服边穗。汉语省略宾语既自然，也不武断消除原文与语境之间的张力。
translation_notes:
  register: 采用现代、庄重而通俗的叙事语言。“总把”传达未完成时的反复性；“哪怕只”体现最低限度请求。主文所有脚注标记均已出现，且按出现次序排列。
