  text: ⸀καὶ ἐξελθοῦσα εἶπεν τῇ μητρὶ αὐτῆς· Τί ⸀αἰτήσωμαι; ἡ δὲ εἶπεν· Τὴν κεφαλὴν Ἰωάννου τοῦ ⸀βαπτίζοντος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/024.yaml
  text: And after going out, she said to her mother, “What should I ask for?” And she said, “The head of John the Baptizer.”
translation:
  language: zh_hans
  text: 她出去后，对母亲说：“我该求什么呢？”母亲说：“施洗者约翰的头。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξελθοῦσα
  choice: 出去
  rationale: 不定过去时分词表示她先离开在场的人，再向母亲发问；汉语用“出去问”即可自然表达动作次序。
- source_word: Τί αἰτήσωμαι
  choice: 我该求什么呢？
  rationale: 不定过去时中间语态虚拟式用于商议性问句；“该……呢”自然保留她询问应当提出何种要求的语气。
- source_word: μητρὶ αὐτῆς
  choice: 母亲
  rationale: 按现代汉语的篇章衔接，主语“她”已经明确，省去重复的“她的”更自然，所指并不含混。
- source_word: κεφαλήν
  choice: 头
  rationale: 直译具体请求，不以“首级”等带有额外文体色彩的词替换，也不淡化其残酷性。
- source_word: τοῦ βαπτίζοντος
  choice: 施洗者
  rationale: 现在时主动分词名词化，按约翰具有标志性的施洗活动来称呼他；“施洗者”既透明又避免把称号误解为现代宗派名称。
theological_decisions:
- issue: 约翰称号 βαπτίζων 的译法
  choice: 施洗者
  alternative: 施洗约翰
  rationale: 原文是名词化分词，意为“施洗的那一位”。“施洗者约翰”较直接保留其称号结构及活动含义；“施洗约翰”虽是熟悉的传统译名，但较不明显地呈现分词所表达的身份特征。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。对话简洁直接；“我该求什么呢”保留商议语气，“施洗者约翰”忠实呈现原文称号，不添加解释性内容。
