  text: Καὶ γενομένης ἡμέρας εὐκαίρου ὅτε Ἡρῴδης τοῖς γενεσίοις αὐτοῦ δεῖπνον ⸀ἐποίησεν τοῖς μεγιστᾶσιν αὐτοῦ καὶ τοῖς χιλιάρχοις καὶ τοῖς πρώτοις τῆς Γαλιλαίας,
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/021.yaml
  text: And when an opportune day came[a], Herod gave a banquet on his birthday for his nobles and military commanders and the leading men of Galilee[d][c][b],
translation:
  language: zh_hans
  text: 一个有利的时机到了[a]：希律在自己生日那天设宴[b]，款待他的显贵、军队长官和加利利的头面人物[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“一个合宜的日子到了”。原文含有适合采取行动、可加利用的时机之意。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“办了一顿晚餐”，这里指举办宴席。
    reason: lexical_alternative
  - marker: c
    text: 或译“加利利的显要人物”，指当地居于首位、有声望和权势的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ γενομένης ἡμέρας εὐκαίρου
  choice: 机会终于来了
  rationale: 该属格独立结构交代情境；εὔκαιρος表示合宜、可利用的时机。结合上文希罗底伺机杀害约翰的叙事，“机会终于来了”自然保留蓄势已久、带有凶兆的语感。
- source_word: ὅτε
  choice: ：
  rationale: ὅτε引出构成这一机会的具体场合。中文用冒号衔接，既表达解释关系，也避免重复使用“当……时”。
- source_word: τοῖς γενεσίοις αὐτοῦ
  choice: 在自己生日那天
  rationale: γενέσια指生日庆祝；此译符合现代汉语习惯，并清楚表明是希律本人的生日。
- source_word: δεῖπνον ἐποίησεν
  choice: 设宴
  rationale: 该短语字面为“办一顿晚餐”，实际指主人举办正式宴席；“设宴”简洁、庄重且符合宾客身份。
- source_word: τοῖς μεγιστᾶσιν αὐτοῦ
  choice: 他的显贵
  rationale: μεγιστᾶνες指与希律有关的高位权贵。“显贵”保留其社会和宫廷地位，又不过度限定为某一种官职。
- source_word: τοῖς χιλιάρχοις
  choice: 军队长官
  rationale: χιλίαρχοι是高级军官；“军队长官”传达职能，又避免误套特定罗马军衔。
- source_word: τοῖς πρώτοις τῆς Γαλιλαίας
  choice: 加利利的头面人物
  rationale: πρῶτοι在此指当地居首位、有声望和权势的人。“头面人物”是自然现代汉语，可表达地区精英的身份。
- source_word: Καὶ
  choice: 承接上文，不单独译出
  rationale: καί是马可常用的叙事连接词；中文在此直接承接即可，若机械译作“于是/并且”反而生硬。
- source_word: Ἡρῴδης
  choice: 希律
  rationale: 采用现代中文圣经传统中通行的人名音译。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“机会终于来了”承接上文希罗底一直伺机杀害约翰的语境；冒号使ὅτε从句解释这个机会为何出现。句末改用句号，以适应单节呈现；若与下一节连续排版，可按项目标点规范调整。
