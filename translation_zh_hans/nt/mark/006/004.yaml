base_translation:
  language: en
  yaml_path: translation/nt/mark/006/004.yaml
  text: And Jesus was saying to them[c][b][a], “A prophet is not without honor except in his hometown and among his relatives and in his household.”
translation:
  language: zh_hans
  text: 耶稣对他们说：“先知除了在自己的家乡[a]、亲属中[b]和自己家中[c]以外，没有不受尊敬的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “家乡”也可译作“故乡”或“本地”。希腊语πατρίς指一个人的原籍或家乡；这里的场景是拿撒勒。
    reason: lexical_alternative
  - marker: b
    text: “亲属”也可译作“亲戚”或“亲族”，指属于同一亲属群体的人。
    reason: lexical_alternative
  - marker: c
    text: “自己家中”也可译作“自己的家”或“自己的家人中”。希腊语οἰκία既可指房屋，也可指家庭或家中成员。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: 说
  rationale: 该未完成时在叙事中可描写当时的言说过程；现代汉语以“说”表达最自然，不另加原文未明确要求的“一再”。
- source_word: προφήτης
  choice: 先知
  rationale: 这是 προφήτης 的标准、清楚且符合上下文的现代汉语译法。
- source_word: ἄτιμος
  choice: 不受尊敬
  rationale: 保留“没有不受尊敬……除了……”这一荣辱对照和格言式表达；相比“被羞辱”，此译法不额外强调主动侮辱。
- source_word: εἰ μὴ
  choice: 除了……以外
  rationale: 在否定句中引出例外，译作“除了……以外”准确而自然，不译成条件性的“除非”。
- source_word: πατρίδι
  choice: 本乡
  rationale: πατρίς 指一个人的本地或故乡；本段场景是拿撒勒，因此“本乡”既简洁又不误解为整个国家。
- source_word: συγγενεῦσιν
  choice: 亲族
  rationale: 指同一亲属群体中的人；“亲族”自然地涵盖亲戚、族人，并与后面的“自己家里”有所区分。
- source_word: οἰκίᾳ
  choice: 自己家里
  rationale: οἰκία 可指房屋，也可指家中成员或家庭圈子；“自己家里”在汉语中保留一定的空间与家庭双重含义。
- source_word: καὶ ... καὶ ... καὶ
  choice: 本乡、亲族和自己家里
  rationale: 汉语列举通常以顿号连接前项，并在末项前用“和”；这样自然地保留三个逐步收窄的范围，而不机械重复“和”。
theological_decisions:
- issue: 耶稣关于先知受尊敬范围的格言如何应用
  choice: 按一般格言直译，并让上下文将其应用于耶稣，不在译文中增添身份解释。
  alternative: 明确补译为耶稣宣称自己是遭拒绝的弥赛亚，或将其改述为关于不信的一般教训。
  rationale: 希腊文本以“先知”为主语陈述格言。上下文确实将此话用于耶稣，但本节没有明说进一步的基督论结论；译文应保留这一张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“没有不受尊敬……除了……”保留原文否定加例外的格言结构；三个范围依次由本乡收窄到亲族，再到自己家里。所有脚注标记均置于对应词语之后。
