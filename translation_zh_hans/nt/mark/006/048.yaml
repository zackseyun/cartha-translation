  text: καὶ ⸀ἰδὼν αὐτοὺς βασανιζομένους ἐν τῷ ἐλαύνειν, ἦν γὰρ ὁ ἄνεμος ἐναντίος ⸀αὐτοῖς, περὶ τετάρτην φυλακὴν τῆς νυκτὸς ἔρχεται πρὸς αὐτοὺς περιπατῶν ἐπὶ τῆς θαλάσσης· καὶ ἤθελεν παρελθεῖν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/048.yaml
  text: And seeing them straining at the oars[a], because the wind was against them, about the fourth watch of the night he comes to them, walking on the sea[d][c][b]; and he intended to pass by them.
translation:
  language: zh_hans
  text: 他看见他们划船十分吃力[d]，因为风迎面阻挡他们。约在夜间第四更[a]，他在海面上行走[b]，来到他们那里；他有意从他们身旁经过[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “夜间第四更”按当时罗马人的计时法，大约是凌晨三点至六点。
    reason: cultural_note
  - marker: b
    text: 或译：“在水面上行走。”希腊原文直译为“在海上”。
    reason: lexical_alternative
  - marker: c
    text: “有意从他们身旁经过”可以只是说他打算从他们旁边走过，也可能呼应旧约中上帝“经过”并显现自己的场景（例如出埃及记33:19、22；34:6；列王纪上19:11）。
    reason: alternative_reading
  - marker: d
    text: 较直译：“他们划船时备受折磨。”原词可表达受折磨或深受煎熬。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: 看见
  rationale: 以时间关系自然的汉语表达不定过去时分词，保留耶稣看见门徒处境后前来的叙事联系，而不额外限定先后间隔。
- source_word: βασανιζομένους ἐν τῷ ἐλαύνειν
  choice: 划船十分吃力
  rationale: βασανίζω本身语气较强，可指受折磨或备受煎熬；结合划船语境，译作“十分吃力”既表达他们遭受的严重困苦，又符合现代汉语习惯。较直译的强烈表达收入脚注。
- source_word: ἐναντίος αὐτοῖς
  choice: 迎面阻挡他们
  rationale: 形容逆风正对着他们并妨碍前行，比单说“风是相反的”更符合自然汉语，同时保留敌对、逆向的力量感。
- source_word: περὶ τετάρτην φυλακὴν τῆς νυκτός
  choice: 约在夜里四更天
  rationale: 保留古代按更次划分夜间的表达；“约”对应περί，具体时段在脚注说明。
- source_word: ἔρχεται πρὸς αὐτούς
  choice: 来到他们那里
  rationale: 希腊文使用历史现在时增强现场感；现代汉语不以相同方式标记时态，采用流畅的叙事表达，不强行加入已完成或持续意味。
- source_word: περιπατῶν ἐπὶ τῆς θαλάσσης
  choice: 在海面上行走
  rationale: “海”直接对应θάλασσα，“在……上”自然表达ἐπί；“海面”使汉语清楚而不改成较宽泛的“水面”。
- source_word: ἤθελεν παρελθεῖν αὐτούς
  choice: 他有意从他们身旁经过
  rationale: “有意”表达θέλω在此处的意图；“从……身旁经过”保留παρέρχομαι既可指实际经过、又可能承载显现意涵的开放性，避免在正文中预先解释。
theological_decisions:
- issue: “他有意从他们身旁经过”的含义
  choice: 正文保留“从他们身旁经过”的直陈表达
  alternative: 明确译为“他打算越过他们继续前行”，或解释为“他要经过他们显现自己”
  rationale: 原文没有说明这一意图的原因。该措辞既可按普通行动理解，也可能使读者联想到旧约中上帝“经过”而显现自己的场景；正文不消除这种神学张力，脚注列出两种可能。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“四更天”保留经文的古代时间表达并以脚注解释；“海面上行走”自然清楚，又忠实保留“海”。句末措辞刻意不解释耶稣为何要从他们身旁经过，以保存原文的歧义和潜在旧约呼应。
