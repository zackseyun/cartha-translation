source:
  edition: SBLGNT
  text: καὶ ⸂ὃς ἂν τόπος μὴ δέξηται⸃ ὑμᾶς μηδὲ ἀκούσωσιν ὑμῶν, ἐκπορευόμενοι ἐκεῖθεν ἐκτινάξατε τὸν χοῦν τὸν ὑποκάτω τῶν ποδῶν ὑμῶν εἰς μαρτύριον ⸀αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/011.yaml
  text: And whatever place does not receive you or listen to you, as you leave there, shake off the dust that is under your feet as a testimony against them.
translation:
  language: zh_hans
  text: 无论哪一个地方，若不接待你们，也不听你们，你们离开那里的时候，就要把脚下的尘土抖掉[b]，作为对他们的见证[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“作为给他们的见证”，也可理解为“作为控告他们的见证”。希腊文直译较接近“对他们的见证”；但在本节拒绝使者的语境中，这见证很可能带有不利于他们的警告意味。
    reason: alternative_reading
  - marker: b
    text: 把脚下的尘土抖掉，是遭到拒绝时表明与对方划清界限并发出警告的象征性行动。
    reason: cultural_note
lexical_decisions:
- source_word: ὃς ἂν τόπος
  choice: 无论哪个地方
  rationale: 这一不定关系结构表达普遍、开放的条件；译文保留了 τόπος“地方”这一名词及其单数形式，同时符合现代汉语表达。
- source_word: μὴ δέξηται ὑμᾶς
  choice: 不接待你们
  rationale: δέχομαι 在这里指接纳并款待受差遣的人。“接待”既自然，也保留了当时待客语境，不把含义扩大为笼统的“接受”。
- source_word: μηδὲ ἀκούσωσιν ὑμῶν
  choice: 也不听你们
  rationale: ἀκούω 后接属格，在此不只是听见声音，也包含听取话语之意；“听你们”简洁地保留了这种语义范围，没有强化为“听从”。
- source_word: ἐκπορευόμενοι ἐκεῖθεν
  choice: 你们离开那里的时候
  rationale: 将分词按时间性情境表达，清楚呈现离开之际所要采取的行动。
- source_word: ἐκτινάξατε
  choice: 抖掉
  rationale: 该动词指通过抖动除去尘土；“抖掉”准确、自然，也避免把动作具体化为原文未明说的“跺脚”。
- source_word: τὸν χοῦν τὸν ὑποκάτω τῶν ποδῶν ὑμῶν
  choice: 脚下的尘土
  rationale: 简明保留 χοῦς“尘土”和 ὑποκάτω τῶν ποδῶν“脚下”的空间关系。
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: 作为对他们的见证
  rationale: “对他们的见证”贴近 αὐτοῖς 的与格表达，并在汉语中保留见证是“给他们”还是带有不利指证作用的张力；上下文所暗示的负面意味交由脚注说明。
theological_decisions:
- issue: 抖掉尘土这一行动及 εἰς μαρτύριον αὐτοῖς 的指向
  choice: 正文译为“作为对他们的见证”，不直接加入“控告”或“反对”
  alternative: 作为控告他们的见证；作为给他们的见证
  rationale: 希腊文 αὐτοῖς 形式上是“对／给他们”，而拒绝使者的上下文使该见证很可能带有警告或不利指证的意味。正文保留原文张力，脚注说明其语境倾向，避免把仍然存在的语义空间完全消除。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“无论哪个地方……的时候，就要……”使条件与行动次序清楚；“接待”“抖掉”“见证”兼顾日常可懂性与经文语体。正文中的[a]、[b]均与脚注对应。
