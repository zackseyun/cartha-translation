source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· Δότε αὐτοῖς ὑμεῖς φαγεῖν. καὶ λέγουσιν αὐτῷ· Ἀπελθόντες ἀγοράσωμεν δηναρίων διακοσίων ἄρτους καὶ ⸀δώσομεν αὐτοῖς φαγεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/037.yaml
  text: But he answered and said to them[a], “You yourselves give them something to eat.” And they said to him[b], “Should we go and buy bread for two hundred denarii and give it to them to eat?”
translation:
  language: zh_hans
  text: 他却回答他们说：“你们自己给他们东西吃吧。”他们对他说：“难道要我们去花二百第纳里[a]买饼[b]，给他们吃吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “第纳里”是当时的货币单位；一个第纳里通常相当于一名雇工或士兵一天的工资。
    reason: cultural_note
  - marker: b
    text: “饼”也可译作“面包”；希腊语 ἄρτους 既可泛指面包，也可指一个个的饼。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: 回答……说
  rationale: 保留原文常见的叙事性双动词表达；现代汉语中“回答……说”自然、庄重，也明确表示这是对前文的回应。
- source_word: Δότε
  choice: 给
  rationale: 直接保留 δίδωμι 的命令语气，不以较抽象的“供应”取代。
- source_word: ὑμεῖς
  choice: 你们自己
  rationale: 原文显式使用代词，带有强调意味；“你们自己”在汉语中清楚传达这一重点。
- source_word: φαγεῖν
  choice: 东西吃
  rationale: δίδωμι 加不定式在此意为“给……吃”；补出“东西”符合现代汉语习惯，同时没有限定食物种类。
- source_word: Ἀπελθόντες ἀγοράσωμεν
  choice: 要我们去买
  rationale: 将分词与商议式虚拟语气合译为自然的反问表达，保留“去而购买”的动作关系。
- source_word: δηναρίων διακοσίων
  choice: 价值二百第纳里
  rationale: 该属格表示价格；“价值……”比“用……”更准确地保留金额与所购物品之间的关系，并保留古代货币单位。
- source_word: ἄρτους
  choice: 饼
  rationale: ἄρτος 可泛指饼或面包，也可按个数指饼；正文采用简洁且符合经文时代饮食背景的“饼”，脚注保留另一译法。
- source_word: δώσομεν αὐτοῖς φαγεῖν
  choice: 给他们吃
  rationale: 与耶稣命令中的“给……吃”形成原文所具有的措辞呼应，不简化为“喂饱他们”。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事语体。“难道要我们……”传达门徒问话中商议兼反问的语气；不额外说明他们的情绪或动机。脚注标记按其实际所解释的词语安放，并依正文出现顺序编号。
