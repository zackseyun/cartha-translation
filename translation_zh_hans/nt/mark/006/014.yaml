id: MRK.6.14
reference: Mark 6:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ ἤκουσεν ὁ βασιλεὺς Ἡρῴδης, φανερὸν γὰρ ἐγένετο τὸ ὄνομα αὐτοῦ, καὶ ⸀ἔλεγον ὅτι Ἰωάννης ὁ βαπτίζων ⸂ἐγήγερται ἐκ νεκρῶν⸃, καὶ διὰ τοῦτο ἐνεργοῦσιν αἱ δυνάμεις ἐν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/014.yaml
  text: And King Herod heard of it[a], for his name had become well known, and people were saying, “John the Baptizer has been raised from the dead[c][b], and because of this these powers are at work in him.”
translation:
  language: zh_hans
  text: 希律王听说了这事，因为耶稣的名声已经传开了。人们说：“施洗的约翰[a]已经从死人中复活了[b]，所以这些能力[c]在他身上发挥作用。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作传统称法“施洗约翰”。原文直译为“那位施洗的约翰”。
    reason: lexical_alternative
  - marker: b
    text: 希腊语动词为被动语态，直译可作“已经从死人中被唤醒（或被使复活）了”。
    reason: alternative_reading
  - marker: c
    text: 或译“大能”“神奇的作为”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ βασιλεὺς Ἡρῴδης
  choice: 希律王
  rationale: 符合现代汉语称谓习惯，也准确表达 βασιλεύς 的王者头衔。
- source_word: ἤκουσεν
  choice: 听说了
  rationale: 原文没有明说宾语，所指承接上文耶稣的事迹和名声；“听说了”在汉语中自然保留这种语境补足。
- source_word: φανερὸν γὰρ ἐγένετο τὸ ὄνομα αὐτοῦ
  choice: 因为他的名声已经传开了
  rationale: ὄνομα 字面为“名字”，在此也涵盖声名、名望；“名声已经传开”自然表达其广为人知的语境意义，同时保留“他的”而不在正文中明确代词所指。
- source_word: ἔλεγον
  choice: 人们说
  rationale: 第三人称复数在此主语不定；译作“人们说”比无先行词的“他们说”更符合现代汉语。
- source_word: Ἰωάννης ὁ βαπτίζων
  choice: 施洗的约翰
  rationale: 保留现在分词 ὁ βαπτίζων 的动作含义，即“施行洗礼的人”，又符合汉语表达。
- source_word: ἐγήγερται ἐκ νεκρῶν
  choice: 已经从死人中复活了
  rationale: 表达完成时所指的既成状态；现代汉语通常用“复活”自然表达从死人中起来。希腊语的被动形式在脚注中说明，以免用生硬的“被复活”破坏正文可读性。
- source_word: διὰ τοῦτο
  choice: 所以
  rationale: 自然表达前述复活判断与随后异能运行之间的因果关系。
- source_word: ἐνεργοῦσιν
  choice: 运行
  rationale: 表达持续发挥作用、产生效力的含义，并能自然搭配“异能”。
- source_word: αἱ δυνάμεις
  choice: 这些异能
  rationale: δύναμις 在此可指发挥作用的能力，也可关联神奇作为；“异能”能传达超常能力而不把复数直接限定为若干具体神迹，其他可能译法列于脚注。
- source_word: ἐν αὐτῷ
  choice: 在他里面
  rationale: 直接保留 ἐν 的内在、在其中之意，不擅自改译为工具性的“借着他”。
theological_decisions:
- issue: 复活语境中 ἐγήγερται 的语态
  choice: 正文译作“复活了”，脚注注明原文为被动语态
  alternative: 从死人中被唤醒了／被使复活了
  rationale: 希腊语明确为完成时被动语态，但现代汉语“被复活”不够自然，“被唤醒”又容易令人误解为普通睡醒。正文采用自然的复活用语，脚注保留被动语态所含的神学张力，不明说施动者。
- issue: Ἰωάννης ὁ βαπτίζων 的称号
  choice: 施洗的约翰
  alternative: 施洗约翰
  rationale: 原文是带冠词的分词结构，强调“那位施洗的人”；正文用“施洗的约翰”透明呈现其动作性质，脚注提供汉语传统称法。
- issue: αἱ δυνάμεις 是能力还是神迹
  choice: 异能
  alternative: 大能／神奇的作为
  rationale: 不把原文过早限定为抽象能力或具体神迹事件；脚注保留两方面的词义可能。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。“施洗的约翰”较透明地呈现原文分词，“异能在他里面运行”则有意保留原文略显不寻常的拟人化表达及 ἐν αὐτῷ 的内在方位，不改成解释性的“他能行神迹”或“借着他施行神迹”。
