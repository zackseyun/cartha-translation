  to: 希律王听说了这事，因为耶稣的名声已经传开了。人们说：“施洗的约翰[a]已经从死人中复活了[b]，所以这些能力[c]在他身上发挥作用。”
  rationale: 明确“耶稣的名声”以忠实传达本段的语篇指向，避免汉语代词造成反向指代；将“异能在他里面运行”调整为现代汉语更自然的“这些能力在他身上发挥作用”，同时保留原文的复数“能力”、持续起作用的动词及 ἐν αὐτῷ 的范围。其余措辞和脚注可保留。
