  naturalness: “异能在他里面运行”虽逐字对应，却不符合现代汉语通常搭配，且“在他里面”容易产生不必要的内在化理解。“这些能力在他身上发挥作用”既自然，也能表达 δυνάμεις 为运行中的能力以及 ἐν αὐτῷ 的范围。
  terminology: “施洗的约翰”可接受，准确反映分词性质；“异能”可用，但正文改为“这些能力”更贴近 δυνάμεις，脚注保留“大能”“神奇的作为”等替代可能。“复活”配合脚注说明被动语态，处理恰当。
