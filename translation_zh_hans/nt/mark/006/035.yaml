  text: Καὶ ἤδη ὥρας πολλῆς γενομένης προσελθόντες αὐτῷ οἱ μαθηταὶ αὐτοῦ ⸀ἔλεγον ὅτι Ἔρημός ἐστιν ὁ τόπος, καὶ ἤδη ὥρα πολλή·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/035.yaml
  text: And when it was already very late[a], his disciples came to him and were saying, “This place is deserted[b], and it is already very late.”
translation:
  language: zh_hans
  text: 天色已经很晚的时候，他的门徒来到耶稣跟前，对他说：“这地方很荒僻，天色也已经很晚了。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤδη
  choice: 已经
  rationale: 两处均表示时间进展至当前阶段；“已经”在现代汉语中自然、直接。
- source_word: ὥρας πολλῆς γενομένης
  choice: 天色已经很晚了
  rationale: 这一独立属格结构表示时候已晚；译作自然的时间状况句，既传达时间推移，也避免生硬直译为“很大的时辰来到”。
- source_word: προσελθόντες αὐτῷ
  choice: 来到耶稣跟前
  rationale: 准确表达门徒走近他的动作；补明“耶稣”可使单节独立阅读时指代清楚。
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: 门徒
  rationale: 上下文已由“耶稣”明确所属关系，汉语省去重复的“他的”更流畅，含义不变。
- source_word: ἔλεγον
  choice: 对他说
  rationale: 未完成时呈现当时正在发生的言说；汉语叙事用“对他说”自然表达，不强行解释为反复劝说。
- source_word: Ἔρημός ἐστιν ὁ τόπος
  choice: 这里是荒僻的地方
  rationale: ἔρημος在此指偏远、少有人烟之地；“荒僻”比“荒凉”更少带情绪色彩，也不暗示绝对无人。
- source_word: καὶ ἤδη ὥρα πολλή
  choice: 天色也已经很晚了
  rationale: 保留门徒话中对时辰已晚的重申；“也”承接前一项处境，符合现代汉语表达。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“荒僻”保留地点偏远、少有人烟的含义；两次“已经很晚”均予保留，以呈现原文的叙事铺陈和门徒话语中的重复。
