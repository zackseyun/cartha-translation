  text: And immediately the king sent an executioner and ordered him to bring his head[a]. And he went and beheaded him in the prison.
translation:
  language: zh_hans
  text: 王立刻派了一名行刑者[a]，命令他把约翰的头拿来。他便去，在监牢里斩下了约翰的头。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“卫兵”或“贴身护卫”。希腊文采用一个源自拉丁语的借词（spekoulatōr），指统治者卫队中的成员；此人在这里执行处决任务。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: 立刻
  rationale: 自然传达马可叙事中行动迅速、紧接发生的意味。
- source_word: βασιλεὺς
  choice: 王
  rationale: 忠实保留马可所用的称号，不因希律·安提帕在历史上的正式头衔是分封王而加以校正。
- source_word: σπεκουλάτορα
  choice: 行刑的卫兵
  rationale: 该词是源自拉丁语的借词，指统治者卫队中的成员；在本语境中此人奉命处决约翰。此译法兼顾其卫兵身份和实际职能。
- source_word: ἐπέταξεν ἐνέγκαι
  choice: 命令他……拿来
  rationale: 准确表达命令的强制语气，并符合现代汉语表达习惯。
- source_word: τὴν κεφαλὴν αὐτοῦ
  choice: 约翰的头
  rationale: 希腊文直译为“他的头”；依上下文明确指约翰。汉语中点明姓名可避免连续代词造成歧义。
- source_word: ἀπεκεφάλισεν
  choice: 砍下了……的头
  rationale: 清楚、自然地表达斩首动作，比偏书面的“斩首”更具叙事现场感，又不流于粗俗。
- source_word: ἐν τῇ φυλακῇ
  choice: 在监牢里
  rationale: 保留已由上下文确定的具体关押地点；“监牢”符合庄重而通俗的叙事语体。
