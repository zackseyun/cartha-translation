  text: ὁ δὲ λέγει αὐτοῖς· Πόσους ⸂ἔχετε ἄρτους⸃; ⸀ὑπάγετε ἴδετε. καὶ γνόντες λέγουσιν· Πέντε, καὶ δύο ἰχθύας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/038.yaml
  text: But he said to them, “How many loaves do you have? Go and see.” And when they found out, they said, “Five, and two fish.”
translation:
  language: zh_hans
  text: 耶稣对他们说：“你们有多少个饼？去看看。”他们弄清楚后，说：“五个，还有两条鱼。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄρτους
  choice: 饼
  rationale: 指当时作为主食的饼；用现代汉语圣经语境中自然且准确的“饼”，不具体限定形状或制作方式。
- source_word: ὑπάγετε ἴδετε
  choice: 去看看
  rationale: 保留两个复数命令所表达的简洁直接语气；“看看”在现代汉语中自然地传达查明数量之意。
- source_word: γνόντες
  choice: 弄清楚后
  rationale: 该分词表示他们经过查看而得知实情；此译法比单纯“知道后”更能体现查明的过程。
- source_word: ἰχθύας
  choice: 鱼
  rationale: 普通的鱼类称谓；量词用“条”符合现代汉语习惯。
theological_decisions:
- issue: 叙事现在时 λέγει / λέγουσιν 的时态呈现
  choice: 均译为过去叙事式“说”
  alternative: 译为“对他们说……他们说”，并以汉语上下文自然承载时态；或刻意使用“说道”突出现场感
  rationale: 希腊文使用叙事现在时增强生动感，但现代汉语无需机械标示现在时；统一按既成事件叙述，符合自然汉语，也不改变事件内容。
- issue: 主语代词 ὁ 的指称
  choice: 明示为“耶稣”
  alternative: 译为“他”
  rationale: 原文冠词代词在上下文中明确指耶稣；独立经节用“耶稣”可避免脱离上下文时指代含混，不增添神学解释。
translation_notes:
  register: 采用简洁、庄重而口语自然的现代标准汉语。对话保持直接，数量表达按汉语习惯加入量词；不加脚注，因为本节没有需要在正文中标记的实质性文本或释义问题。
