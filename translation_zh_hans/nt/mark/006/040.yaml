  text: καὶ ἀνέπεσαν πρασιαὶ πρασιαὶ ⸀κατὰ ἑκατὸν καὶ ⸁κατὰ πεντήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/040.yaml
  text: And they reclined in groups of hundreds and of fifties[a].
translation:
  language: zh_hans
  text: 众人就一组一组地坐席，有的一百人一组，有的五十人一组。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一组一组”原文直译为“园畦一畦又一畦”，形象地描绘众人像园中整齐的畦块那样分区排列。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέπεσαν
  choice: 坐席
  rationale: 该动词在用餐语境中指就座或斜倚用餐。现代汉语“坐席”既自然地表达入席用餐，也比单纯“坐下”更能保留宴席语境，而不必生硬描写古代斜倚姿势。
- source_word: πρασιαὶ πρασιαὶ
  choice: 一组一组地
  rationale: πρασιά本指园圃中的畦或地块，重叠形式在此描绘众人分区而有秩序地聚集。“一组一组地”清楚传达其分组和分布意义；具体的园畦意象置于脚注保留。
- source_word: κατὰ ἑκατὸν
  choice: 有的一百人一组
  rationale: κατά与数词连用表示按数目分配或编组。此译法用自然的现代汉语明确表达每组一百人的分组方式。
- source_word: κατὰ πεντήκοντα
  choice: 有的五十人一组
  rationale: 与前一短语平行，κατά表示按五十人编组；“有的……有的……”自然呈现两种组别人数，同时不暗示所有组都先后同时符合两个数目。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“坐席”保留用餐场景；主句以“一组一组”呼应希腊文的名词重叠，并用脚注保留“园畦”的鲜明意象。
