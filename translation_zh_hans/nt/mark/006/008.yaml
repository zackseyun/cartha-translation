  yaml_path: translation/nt/mark/006/008.yaml
  text: And he instructed them to take nothing for the journey except a staff only—no bread[a], no bag[b], no copper in their belt—
translation:
  language: zh_hans
  text: 他嘱咐他们：路上什么也不要带，只带一根手杖；不要带饼，不要带行囊，腰带里也不要带铜[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“铜”，在这里指铜制的钱币。
    reason: lexical_alternative
lexical_decisions:
- source_word: παρήγγειλεν
  choice: 嘱咐
  rationale: 表示带有权威的指示；“嘱咐”在现代汉语中自然，也保留了耶稣给门徒明确指令的语气。
- source_word: μηδὲν αἴρωσιν εἰς ὁδὸν
  choice: 路上什么也不要带
  rationale: 按旅行语境表达“不要为路程携带任何东西”，简洁自然。
- source_word: εἰ μὴ ῥάβδον μόνον
  choice: 只带一根手杖
  rationale: “手杖”准确指旅行用的杖；“只”体现 μόνον 的强调。
- source_word: ἄρτον
  choice: 饼
  rationale: 保留原文具体的主食名称，不泛化为“食物”；“饼”符合圣经时代无酵或扁平面饼的常用汉语表达。
- source_word: πήραν
  choice: 行囊
  rationale: 指旅行时装食物或用品的袋子；“行囊”比笼统的“袋子”更清楚地体现旅行语境。
- source_word: ζώνην
  choice: 腰带
  rationale: 指束腰并可用来携带钱币的带子；“腰带”是清楚自然的现代汉语。
- source_word: χαλκόν
  choice: 铜钱
  rationale: 原义是“铜”，在此转指铜制钱币；“铜钱”既保留材质意象，又清楚传达实际所指。
