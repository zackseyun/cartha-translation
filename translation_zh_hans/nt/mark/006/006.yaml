base_translation:
  language: en
  yaml_path: translation/nt/mark/006/006.yaml
  text: And he was amazed because of their unbelief[a]. And he went around among the villages[b], teaching.
translation:
  language: zh_hans
  text: 他因他们的不信而诧异[a]。他在附近各村庄间巡行，教导人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他因他们不信而感到惊讶。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“他巡回周围的村庄，教导人。”或“他在各村庄间绕行，教导人。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐθαύμαζεν
  choice: 感到惊讶
  rationale: 未完成时描写当时持续的反应；“感到惊讶”自然、清楚地表达 θαυμάζω，同时不弱化叙事张力。
- source_word: διὰ τὴν ἀπιστίαν αὐτῶν
  choice: 因他们不信
  rationale: διά 加宾格在此表示原因；ἀπιστία 在上下文中指不信或拒绝相信，而不只是信心软弱。
- source_word: περιῆγεν
  choice: 走遍
  rationale: περιάγω 的未完成时表示持续从一处到另一处行走；“走遍”简洁地传达巡行之意。
- source_word: τὰς κώμας κύκλῳ
  choice: 周围的村庄
  rationale: κώμη 指村庄或乡村聚落；κύκλῳ 可指周围一带或巡回路线。“周围的村庄”在现代汉语中自然，并保留地域环绕的含义。
- source_word: διδάσκων
  choice: 一路教导人
  rationale: 现在分词表示与巡行同时进行的活动；“一路教导人”自然体现他边走边教导，补出的“人”是汉语中不定受事的自然表达。
theological_decisions:
- issue: 如何表达耶稣面对不信时的惊讶，而不以神学解释消解经文本身的张力
  choice: 他因他们不信而感到惊讶
  alternative: 他因他们的不信而诧异
  rationale: 原文直接陈述耶稣因他们不信而惊讶。译文保留这一叙事陈述，不添加关于其知识或神性的推测性说明。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“随后”承接原文第二个 καί，避免汉语中连续使用“又”；“一路教导人”使同时发生的分词结构自然清楚。
