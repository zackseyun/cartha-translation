  text: καὶ ὤμοσεν ⸀αὐτῇ· ⸂Ὅ τι⸃ ἐάν με αἰτήσῃς δώσω σοι ἕως ἡμίσους τῆς βασιλείας μου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/023.yaml
  text: And he swore to her[a], “Whatever you ask me, I will give you[b], up to half of my kingdom.”
translation:
  language: zh_hans
  text: 他就向她起誓：“无论你向我求什么[a]，我都会给你，最多到我王国的一半[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“无论你向我请求什么”。
    reason: lexical_alternative
  - marker: b
    text: “最多到我王国的一半”是古代君王式的惯用夸张承诺。
    reason: cultural_note
lexical_decisions:
- source_word: ὤμοσεν
  choice: 起誓
  rationale: 该词表示郑重立誓；“起誓”在现代汉语中自然、庄重，也保留了话语的誓言效力。
- source_word: αὐτῇ
  choice: 向她
  rationale: 阴性单数与格在此指上下文中的女孩，“向她”准确表达说话对象。
- source_word: Ὅ τι ἐάν
  choice: 无论……什么
  rationale: 这一带有ἐάν的不定关系表达涵盖任何可能的请求；汉语用“无论……什么”自然地保留其开放性。
- source_word: με αἰτήσῃς
  choice: 你向我求
  rationale: αἰτέω在这里指向某人提出请求；“向我求”既符合语境，也能自然衔接宾语“什么”。
- source_word: δώσω σοι
  choice: 我都给你
  rationale: 将来时在誓言中具有明确的承诺意味；“都”与前面的“无论”呼应，体现无条件应允的语气。
- source_word: ἕως ἡμίσους
  choice: 最多可达……的一半
  rationale: ἕως在此表示数量或范围的上限，而非时间终点；此译法清楚表达“直到半数为止”的限度。
- source_word: τῆς βασιλείας μου
  choice: 我王国的
  rationale: βασιλεία可指统治、王权或国度；在这套宫廷式夸张承诺中，“王国”最贴合具体语境，同时避免赋予该词神学专义。
theological_decisions:
- issue: 希律话语中βασιλεία的含义
  choice: 王国
  alternative: 统治、王权
  rationale: 该词在此更自然地指君王所辖的国土或领域。译作“王国”保留宫廷承诺的惯用表达，不把本句误读为有关神圣国度的技术性陈述。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“他又向她起誓”承接前文动作；引语以“无论……我都……”呈现誓言的广泛承诺，并以“最多可达”明确数量上限。
