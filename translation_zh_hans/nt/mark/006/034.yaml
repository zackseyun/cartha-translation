  text: καὶ ἐξελθὼν ⸀εἶδεν πολὺν ὄχλον, καὶ ἐσπλαγχνίσθη ἐπ’ ⸀αὐτοὺς ὅτι ἦσαν ὡς πρόβατα μὴ ἔχοντα ποιμένα, καὶ ἤρξατο διδάσκειν αὐτοὺς πολλά.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/034.yaml
  text: And when he went ashore[a], he saw a large crowd, and he had compassion on them, because they were like sheep without a shepherd[b]. And he began to teach them many things.
translation:
  language: zh_hans
  text: 他上了岸[a]，看见一大群人，就怜悯他们，因为他们好像没有牧人的羊[b]。于是，他开始教导他们许多事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“出来以后”；结合上下文，指从船上出来、登岸。
    reason: lexical_alternative
  - marker: b
    text: “没有牧人的羊”呼应圣经中百姓缺少忠信带领者的说法；参民数记27:17；列王纪上22:17；以西结书34:5。
    reason: cross_reference
lexical_decisions:
- source_word: ἐξελθὼν
  choice: 上了岸
  rationale: 字面为“出来以后”。结合6:32-33乘船渡行的语境，所指最自然的是从船里出来、登上岸；“上了岸”在现代汉语中清楚自然。
- source_word: εἶδεν
  choice: 看见
  rationale: ὁράω的不定过去时，直接表示“看见”，无需加入更强的解释。
- source_word: πολὺν ὄχλον
  choice: 一大群人
  rationale: ὄχλος指聚集的人群，πολύς强调人数众多；“一大群人”自然保留其数量意义。
- source_word: ἐσπλαγχνίσθη ἐπ’ αὐτοὺς
  choice: 怜悯他们
  rationale: 该动词表达发自内心的深切怜悯；汉语“怜悯他们”简洁、庄重，也自然表达ἐπί所指向的怜悯对象。
- source_word: ὅτι
  choice: 因为
  rationale: 明确引出耶稣怜悯众人的原因。
- source_word: ὡς πρόβατα μὴ ἔχοντα ποιμένα
  choice: 好像没有牧人的羊
  rationale: 保留原文牧羊意象及明喻结构，不在正文中把它解释为缺乏属灵领袖。
- source_word: ἤρξατο διδάσκειν
  choice: 开始教导
  rationale: 准确表达开始进行某一行动的结构，并采用庄重而自然的现代汉语。
- source_word: αὐτοὺς πολλά
  choice: 教导他们许多事
  rationale: πολλά最自然地指许多内容；“许多事”保留其宾语性质，不将其解释性改写为“长时间”。
theological_decisions:
- issue: 没有牧人的羊这一牧养意象
  choice: 正文保留“好像没有牧人的羊”的比喻
  alternative: 解释性扩写为“好像没有属灵领袖的人”
  rationale: 该表述很可能呼应旧约中神子民及其领袖的牧养意象，但正文应保留比喻本身及其神学张力，不限定为单一解释。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。以“于是”衔接耶稣因怜悯而开始教导的行动；保留牧人和羊的圣经意象。
