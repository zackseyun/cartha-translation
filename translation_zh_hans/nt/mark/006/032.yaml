  text: καὶ ἀπῆλθον ⸂ἐν τῷ πλοίῳ εἰς ἔρημον τόπον⸃ κατ’ ἰδίαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/032.yaml
  text: And they went away in the boat to a desolate place by themselves[a][b].
translation:
  language: zh_hans
  text: 他们就坐船离开，独自前往一个荒僻的地方[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一个无人居住的地方”或“一个旷野之地”。
    reason: lexical_alternative
  - marker: b
    text: “独自”也可译为“私下里”或“单独地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: 就
  rationale: 承接上文的叙事发展，符合马可福音中 καί 常见的连续叙事用法；“就”在现代汉语中自然，又不过度强调因果。
- source_word: ἀπῆλθον
  choice: 离开
  rationale: 表达从先前所在之处离去，简洁自然，也保留了 ἀπέρχομαι 的移动含义。
- source_word: ἐν τῷ πλοίῳ
  choice: 坐船
  rationale: 希腊文直译为“在船里”，但现代汉语通常以“坐船”表达这种出行方式，既准确又自然；此处无需使用较正式的“船只”。
- source_word: εἰς ἔρημον τόπον
  choice: 前往一个荒僻的地方
  rationale: ἔρημος 在这里指无人居住、远离人群或僻静之处。“荒僻”兼顾人烟稀少与隔离感，而不把该地限定为沙漠地貌。
- source_word: κατ’ ἰδίαν
  choice: 独自
  rationale: 该习语表示与别人分开、私下地；“独自”简洁地对应复数主语共同避开人群的情形，同时保留其可理解为“私下”的语义空间。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。“坐船”符合普通读者的自然表达；“荒僻的地方”避免把 ἔρημος 过度具体化为沙漠；整体保留希腊文简洁连贯的叙事节奏。
