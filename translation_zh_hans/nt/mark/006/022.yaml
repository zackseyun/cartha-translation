  text: καὶ εἰσελθούσης τῆς θυγατρὸς ⸂αὐτῆς τῆς⸃ Ἡρῳδιάδος καὶ ὀρχησαμένης ⸂καὶ ἀρεσάσης⸃ τῷ Ἡρῴδῃ καὶ τοῖς συνανακειμένοις, ⸂εἶπεν ὁ βασιλεὺς⸃ τῷ κορασίῳ· Αἴτησόν με ὃ ἐὰν θέλῃς, καὶ δώσω σοι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/022.yaml
  text: And when Herodias's daughter came in and danced[a], and pleased Herod and those reclining at the table with him, the king said to the girl, “Ask me for whatever you want[b], and I will give it to you.”
translation:
  language: zh_hans
  text: 希罗底的女儿[a]进来跳舞，使希律和同席的人[b]都很高兴。王对女孩说：“无论你想要什么，都向我求吧，我会给你。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本或传统把这里理解为“他的女儿希罗底”，而不是“希罗底的女儿”。本译所据希腊文本作“希罗底的女儿”。
    reason: textual_variant
  - marker: b
    text: 也可译作“和他一同用餐的人”；当时赴宴的人通常斜倚在席间用餐。
    reason: cultural_note
lexical_decisions:
- source_word: εἰσελθούσης
  choice: 进来
  rationale: 以时间背景中的连续动作自然表达希腊语不定过去分词，保留她进入宴席场合的动作。
- source_word: τῆς θυγατρὸς αὐτῆς τῆς Ἡρῳδιάδος
  choice: 希罗底的女儿
  rationale: 所据希腊文本的属格结构最自然地表明女孩是希罗底的女儿；相关异文或不同断句另见脚注。
- source_word: ὀρχησαμένης
  choice: 跳舞
  rationale: 直接、自然地表达该分词所指的动作，不额外渲染舞蹈的性质。
- source_word: ἀρεσάσης
  choice: 使……很高兴
  rationale: ἀρέσκω表示使人喜悦或满意；此译符合现代汉语表达，又不采用语气更强的“迷住”等词。
- source_word: τοῖς συνανακειμένοις
  choice: 同席的人
  rationale: 该词具体指与希律一同斜倚席间用餐的人；正文简洁译为“同席的人”，文化背景见脚注。
- source_word: εἶπεν ὁ βασιλεὺς
  choice: 王就……说
  rationale: 忠实保留马可所用的βασιλεύς“王”，不以历史上更精确的“分封王”取代原文称谓。
- source_word: τῷ κορασίῳ
  choice: 对女孩
  rationale: κοράσιον指女孩或少女；“女孩”是自然、清楚且不过分古雅的现代汉语。
- source_word: Αἴτησόν με
  choice: 只管向我求
  rationale: 表达命令式所带的准许和鼓励语气，同时保留“向我求”的对象关系。
- source_word: ὃ ἐὰν θέλῃς
  choice: 你想要什么
  rationale: 自然表达不定关系结构所涵盖的开放选择，不缩小请求的范围。
- source_word: δώσω σοι
  choice: 我会给你
  rationale: 直接表达将来时的承诺；所给之物由前句“什么”自然补足，无须另加宾语。
theological_decisions:
- issue: 如何翻译用于希律·安提帕的βασιλεύς
  choice: 王
  alternative: 分封王；统治者
  rationale: 马可叙事在此明确使用“王”。译文保留原文称谓，不以外部历史资料中的技术性头衔修正文本。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“同席的人”简洁保留宴席语境；两个脚注标记放在各自实际说明的词语之后，以免造成错指。
