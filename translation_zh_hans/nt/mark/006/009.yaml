  text: ἀλλὰ ὑποδεδεμένους σανδάλια, καὶ μὴ ⸀ἐνδύσησθε δύο χιτῶνας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/009.yaml
  text: but wear sandals[a], and do not put on two tunics.
translation:
  language: zh_hans
  text: 却要穿着凉鞋，不要穿上两件贴身衣。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要同时穿两件贴身衣。”原文可以理解为不要穿上第二件，也可以理解为不要同时穿两件。
    reason: 保留“两件贴身衣”这一禁令在具体所指上的语义张力，避免中文主文被误解为连第一件也不可穿。
lexical_decisions:
- source_word: ἀλλὰ
  choice: 却要
  rationale: 承接上一节的出行吩咐并形成转折；“却要”自然表达这里的对比和命令语气。
- source_word: ὑποδεδεμένους
  choice: 穿上
  rationale: 该完成时分词带有命令作用，表示脚上已经穿妥；中文“穿上凉鞋”既自然，也保留穿戴的动作意味。
- source_word: σανδάλια
  choice: 凉鞋
  rationale: 直接表达古代以带子系在脚上的鞋类，现代读者容易理解。
- source_word: μὴ ἐνδύσησθε
  choice: 不要穿上
  rationale: μή加不定过去时中间语态虚拟式构成禁令；“不要穿上”保留穿衣这一动作，也体现中间语态所含的给自己穿上之意。
- source_word: δύο
  choice: 两件
  rationale: 按汉语量词习惯，在数字后加“件”，明确指两件衣物。
- source_word: χιτῶνας
  choice: 贴身衣
  rationale: χίτων指穿在身上的基本内层衣物；“贴身衣”比泛称“衣服”准确，又比“内衣”更少现代联想。
theological_decisions: []
translation_notes:
  register: 采用现代、简洁而庄重的命令句。“贴身衣”交代古代χίτων的基本性质，同时避免使用容易产生现代服装联想的“衬衫”或“内衣”。
