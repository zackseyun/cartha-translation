  text: καὶ ἀκούσαντες οἱ μαθηταὶ αὐτοῦ ἦλθον καὶ ἦραν τὸ πτῶμα αὐτοῦ καὶ ἔθηκαν αὐτὸ ἐν μνημείῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/029.yaml
  text: And when his disciples heard[a], they came and took up his body and laid it in a tomb.
translation:
  language: zh_hans
  text: 他的门徒听见了，就来领走他的遗体，安放在坟墓里。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσαντες
  choice: 听见了，就
  rationale: 不定过去时分词在此具有时间背景作用；用“听见了，就”自然表达获悉消息后随即采取行动的叙事次序。
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: 他的门徒
  rationale: μαθηταί通常译为“门徒”，既保留师徒关系，也比“跟随者”更准确；依紧邻上下文，“他”指施洗约翰。
- source_word: ἦλθον
  choice: 来
  rationale: 按叙事视角自然译作“来”，表示他们来到遗体所在之处。
- source_word: ἦραν
  choice: 领走
  rationale: αἴρω可指拿起、带走；在收殓语境中，“领走”兼顾移走遗体的动作与现代汉语的庄重自然。
- source_word: τὸ πτῶμα αὐτοῦ
  choice: 他的遗体
  rationale: πτῶμα明确指尸体或死者的身体；“遗体”准确传达死亡含义，同时比“尸体”更符合安葬叙事的庄重语体。
- source_word: ἔθηκαν
  choice: 安放
  rationale: τίθημι在埋葬语境中意为放置；“安放”自然、庄重，并与遗体安葬搭配。
- source_word: ἐν μνημείῳ
  choice: 在坟墓里
  rationale: μνημεῖον在此指埋葬死者的墓穴或坟墓；“坟墓”是普通现代读者容易理解且符合新约语境的表达。
theological_decisions:
- issue: “他的门徒”中代词的所指
  choice: 施洗约翰的门徒
  alternative: 耶稣的门徒
  rationale: 紧邻的叙事主角是刚被处死的施洗约翰，本句又说门徒领走并安葬“他的遗体”，因此代词自然回指约翰；译文保留原文代词，不在正文中补出姓名。
translation_notes:
  register: 采用现代、简洁而庄重的叙事语言。“遗体”和“安放”明确死亡与安葬场景，避免“尸体”的生硬感；句式保留原文连续动作的节奏。
