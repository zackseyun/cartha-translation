revisions:
- from: 原来，希律亲自派人逮捕了约翰[a]，把他捆绑在监里；这是因希罗底的缘故。希罗底是他兄弟腓力的妻子，希律娶了她。
  to: 原来，希律亲自派人捉拿约翰[a]，捆绑他，把他下在监里；这是因为希罗底——他兄弟腓力的妻子——的缘故，因为希律娶了她。
  rationale: 修订恢复原文两个因果短语的关联，并以“捆绑他，把他下在监里”分别对应“捆绑”和“在监禁中”。保留希律作为行动发起者的强调、婚姻关系的原有表述，以及不在本节加入额外道德评断。
