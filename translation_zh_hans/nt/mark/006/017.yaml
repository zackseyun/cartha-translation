  text: Αὐτὸς γὰρ ὁ Ἡρῴδης ἀποστείλας ἐκράτησεν τὸν Ἰωάννην καὶ ἔδησεν αὐτὸν ἐν φυλακῇ διὰ Ἡρῳδιάδα τὴν γυναῖκα Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ, ὅτι αὐτὴν ἐγάμησεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/017.yaml
  text: For Herod himself had sent and seized John[a], and bound him in prison because of Herodias, the wife of Philip his brother[b], because he had married her.
translation:
  language: zh_hans
  text: 原来，希律亲自派人捉拿约翰[a]，捆绑他，把他下在监里；这是因为希罗底——他兄弟腓力的妻子——的缘故，因为希律娶了她。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译可作“希律自己先派遣，便捉拿了约翰”。“派人捉拿”表达希律下令并促成这次逮捕，并不表示他亲手捉拿约翰。
    reason: 说明前置分词的先行动作、主语的强调及“派人捉拿”的自然汉语表达。
lexical_decisions:
- source_word: Αὐτὸς γὰρ ὁ Ἡρῴδης
  choice: 原来，希律亲自
  rationale: γάρ承接上文作叙事性解释，用“原来”自然引出背景；Αὐτός强调希律本人负有主使责任，“亲自”保留这一强调，但不表示他亲手实施逮捕。
- source_word: ἀποστείλας ἐκράτησεν
  choice: 派人逮捕了
  rationale: 前置的不定过去时分词ἀποστείλας表示先行的“派遣”，主句动词ἐκράτησεν在此指抓捕、拘押。汉语用“派人逮捕”自然表达希律通过所派之人执行逮捕，也避免误解为希律亲手抓人。
- source_word: ἔδησεν αὐτὸν ἐν φυλακῇ
  choice: 把他捆绑在监里
  rationale: “捆绑”保留δέω的具体动作，不擅自加入锁链等细节；“在监里”准确表达ἐν φυλακῇ的囚禁场所。
- source_word: διὰ Ἡρῳδιάδα
  choice: 这是因希罗底的缘故
  rationale: διά加宾格在此表示原因。“因……的缘故”既保留因果关系，也避免把希罗底本身描写成唯一或主动的施事者。
- source_word: τὴν γυναῖκα Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ
  choice: 希罗底是他兄弟腓力的妻子
  rationale: γυνή在与腓力的属格关系中指“妻子”；τοῦ ἀδελφοῦ αὐτοῦ自然译作“他兄弟”。按原文保留关系陈述，不在本节擅加“前妻”或“原是”等时间解释。
- source_word: ὅτι αὐτὴν ἐγάμησεν
  choice: 希律娶了她
  rationale: γαμέω直指结婚、娶妻。重复“希律”可在现代汉语中消除连续代词可能造成的指代含混。
theological_decisions:
- issue: 希律婚姻的历史与道德定性
  choice: 本节只陈述希罗底与腓力的婚姻关系以及希律娶她这一事实，不额外加入“非法”“不合律法”等评价。
  alternative: 在正文中直接称这段婚姻为非法或乱伦。
  rationale: 原句在此交代约翰被囚的历史原因；明确的律法与道德评断由后文第18节表达。译文不提前加入本句未明说的判断，同时保留原文形成的张力。
- issue: 希律是否亲手逮捕约翰
  choice: 译为“希律亲自派人逮捕”，将“亲自”理解为强调他的主使责任。
  alternative: 译为“希律亲手逮捕约翰”。
  rationale: ἀποστείλας表明先有派遣行动；原文强调希律本人发起并负责此事，却不要求理解为他亲手执行抓捕。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“原来”承接上文解释背景；分号及后续短句化解原文连续两个原因结构在汉语中的生硬感。专名采用通行译名“希律、约翰、希罗底、腓力”。
