review_pass:
  verdict: revise
  source_fidelity: 原译将“διὰ Ἡρῳδιάδα……ὅτι αὐτὴν ἐγάμησεν”拆成“这是因希罗底的缘故。希罗底是他兄弟腓力的妻子，希律娶了她”，基本信息虽仍在，却削弱并改变了原句的因果嵌套：希律囚禁约翰，是因为希罗底——即他兄弟腓力的妻子——而他娶了她。应在中文中明确“因为……，因为/因他娶了她”的关系。另，“ἐν φυλακῇ”是“在监狱里/下在监里”，不是“把他捆绑在监里”；后者容易把地点附着于捆绑动作，且“监里”不够现代自然。
  naturalness: “把他捆绑在监里”现代汉语不够顺畅；“把约翰捉拿来，下在监里”或“把约翰逮捕，囚在监狱里”更自然。为保留δέω的“捆绑”，可译为“捆绑他，把他下在监里”。“原来”可自然承接上下文。
  terminology: 专名“希律、约翰、希罗底、腓力”采用通行现代汉语译名，可保留。“派人捉拿”恰当体现ἀποστείλας的派遣及希律的主使责任，不应将“亲自”理解为亲手执行。
  issues:
  - severity: medium
    issue: 因果关系被拆散并弱化
    rationale: 原文的“因为希罗底……，因为他娶了她”整体说明囚禁约翰的缘由。现有两短句没有明确把“希律娶了她”作为前述“因希罗底”的具体原因。
  - severity: medium
    issue: “把他捆绑在监里”表达不自然且句法关系模糊
    rationale: ἐν φυλακῇ表明监禁的地点/状态；中文应将“捆绑”与“下在监里（或囚在监狱里）”分别表达。
  - severity: low
    issue: 脚注“直译”不够严格
    rationale: “希律派遣后，抓住了约翰”遗漏原文的强调性“他自己/希律本人”，也不宜作为完整直译。可改为说明该分词结构所表达的先行动作和主使关系。
