  yaml_path: translation/nt/mark/006/042.yaml
  text: And they all ate and were satisfied.
translation:
  language: zh_hans
  text: 众人都吃了，并且吃饱了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφαγον
  choice: 吃了
  rationale: 这是ἐσθίω的简单过去时，表示普通的“吃”。不另加宾语，以免增添原文没有明说的内容，也避免与下文“吃饱”重复。
- source_word: πάντες
  choice: 众人都
  rationale: πάντες在此作名词用，指上下文中的全体群众。“众人都”既明确其群体所指，也保留了无一例外的范围。
- source_word: ἐχορτάσθησαν
  choice: 吃饱了
  rationale: χορτάζω的被动形式在此表示充分得食、达到饱足。现代汉语用“吃饱了”最自然，也清楚表达进食后的结果；“得了饱足”较生硬。
- source_word: καὶ ... καὶ
  choice: ……并且……
  rationale: 两个καί依次连接叙事和动作。句首在本节独立呈现时不必机械译作“而且”；以自然汉语起句，并用“并且”连接第二个动作，保留并列推进关系。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“众人都吃了，并且吃饱了”保留马可叙事的直接性，并避免把两个动词合并为一个强化表达。
