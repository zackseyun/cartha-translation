  text: ἀπόλυσον αὐτούς, ἵνα ἀπελθόντες εἰς τοὺς κύκλῳ ἀγροὺς καὶ κώμας ἀγοράσωσιν ἑαυτοῖς ⸂τί φάγωσιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/036.yaml
  text: Send them away[a], so that they may go into the surrounding countryside and villages and buy themselves something to eat.
translation:
  language: zh_hans
  text: 请让他们散去[a]，好叫他们到周围的乡间和村庄去，为自己买些吃的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“请遣散他们。”
    reason: ἀπόλυσον可较形式对应地译为“遣散”；正文“让他们散去”更符合现代汉语习惯。
lexical_decisions:
- source_word: ἀπόλυσον αὐτούς
  choice: 请让他们散去
  rationale: ἀπολύω在这里指遣散群众。中文用“让他们散去”既自然，也保留命令的指向；按本句是门徒对耶稣说话的语境，加“请”符合现代汉语表达，并未削弱祈使语气。
- source_word: ἵνα
  choice: 好叫
  rationale: 引出目的，保留“使他们能够去购买食物”的目的关系；“好叫”庄重而易懂。
- source_word: ἀπελθόντες
  choice: 到……去
  rationale: 这个不定过去时分词表达先去往别处、再购买的动作次序；汉语将其自然整合为“到……去”。
- source_word: τοὺς κύκλῳ ἀγροὺς καὶ κώμας
  choice: 周围的田野和村庄
  rationale: κύκλῳ意为周围；ἀγροί可指田地、农庄或乡间地方。选择“田野”贴近词面，并与“村庄”构成自然并列，同时不把它限定为有建筑物的农庄。
- source_word: ἀγοράσωσιν
  choice: 买
  rationale: 准确表达以钱购得之意，现代汉语自然明白。
- source_word: ἑαυτοῖς
  choice: 给自己
  rationale: 保留反身与受益含义，表明他们为自身购买。
- source_word: τί φάγωσιν
  choice: 些吃的
  rationale: τί在此为不定意义，指可供食用的东西；“些吃的”是自然现代汉语，避免生硬直译为“他们可以吃什么”。
