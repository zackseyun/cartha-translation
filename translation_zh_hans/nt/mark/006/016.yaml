  text: ἀκούσας δὲ ⸀ὁ Ἡρῴδης ⸀ἔλεγεν· Ὃν ἐγὼ ἀπεκεφάλισα Ἰωάννην, οὗτος ⸀ἠγέρθη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/016.yaml
  text: But when Herod heard it[a], he said, “John, whom I beheaded[b], has been raised.”
translation:
  language: zh_hans
  text: 可是，希律听见了，就说[a]：“我所斩首的约翰——就是这个人，他已经被兴起了[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他不断地说”或“他一直说”；原文动词为未完成时。
    reason: lexical_alternative
  - marker: b
    text: 或译：“他复活了”或“他起来了”。原文动词为被动语态，直译可作“他被兴起了”。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας
  choice: 听见了，就
  rationale: 将不定过去时分词按时间关系自然译出；“听见了，就”清楚表达希律听到消息后作出反应。
- source_word: δὲ
  choice: 可是
  rationale: δέ在这里标示叙事推进中的轻微转折，译作“可是”比单纯的“于是”更能体现视角转回希律。
- source_word: ἔλεγεν
  choice: 说
  rationale: 未完成时可表示持续或反复说，但现代汉语叙事中“说”最自然；可能的反复意味保留在脚注中。
- source_word: Ὃν ἐγὼ ἀπεκεφάλισα Ἰωάννην
  choice: 我所斩首的约翰
  rationale: 保留原文对“我”和宾语的强调，同时按现代汉语语序重组；“斩首”准确对应ἀποκεφαλίζω。
- source_word: οὗτος
  choice: 就是他
  rationale: 用“就是他”体现指示代词的强调作用，又比生硬的“这一个”更符合现代汉语直接引语。
- source_word: ἠγέρθη
  choice: 被使复活了
  rationale: 保留希腊语被动语态及从死亡中被兴起的意思；虽略带书面色彩，却避免用主动式“复活了”抹去原文的语态。
theological_decisions:
- issue: ἠγέρθη在复活语境中的语态
  choice: 被使复活了
  alternative: 复活了／起来了
  rationale: 原文是被动形式。正文保留被动，不明说施动者，以免加入原文没有明说的解释；脚注列出较自然但语态较弱的译法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“斩首”准确简洁；“被使复活了”刻意保留原文被动语态及其神学张力。脚注标记放在各自所说明的词句之后。
