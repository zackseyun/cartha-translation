  text: καὶ εἶδον αὐτοὺς ὑπάγοντας καὶ ⸀ἐπέγνωσαν πολλοί, καὶ πεζῇ ἀπὸ πασῶν τῶν πόλεων συνέδραμον ἐκεῖ καὶ προῆλθον ⸀αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/033.yaml
  text: And many saw them going and recognized them[b][a], and on foot from all the towns they ran there together and got there ahead of them.
translation:
  language: zh_hans
  text: 许多人看见他们离去，也认出了他们；他们就从各城[a]步行[b]一同跑到那里，比他们先到了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “城”也可译作“城镇”。
    reason: lexical_alternative
  - marker: b
    text: “步行”也可译作“从陆路”，以突出与乘船相对。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδον
  choice: 看见
  rationale: 按叙事顺序表达直接的视觉感知，不增添“留意”或“观察”等额外意味。
- source_word: ὑπάγοντας
  choice: 离去
  rationale: 承接上文乘船离开的情境；“离去”自然表达正在前往别处，同时不在本节重复说明乘船。
- source_word: ἐπέγνωσαν
  choice: 认出了
  rationale: 此处指辨认出他们是谁，而非泛指获得知识。
- source_word: πολλοί
  choice: 许多人
  rationale: 希腊文形容词作名词用；中文补出“人”更自然清楚。
- source_word: πεζῇ
  choice: 步行
  rationale: 保留与乘船相对的陆路徒步方式；另可按较宽泛的意义理解为“从陆路”。
- source_word: ἀπὸ πασῶν τῶν πόλεων
  choice: 从各城
  rationale: πόλις 可指城或城镇；“各城”简洁自然，并保留 πασῶν 的周遍含义。
- source_word: συνέδραμον
  choice: 众人一同跑去
  rationale: 表达 συντρέχω 所含的奔跑与汇聚之意，且避免把人群误解为始终从同一点同行。
- source_word: ἐκεῖ
  choice: 那里
  rationale: 直接对应地点副词，符合现代汉语叙事。
- source_word: προῆλθον αὐτούς
  choice: 比他们先到了
  rationale: 在本语境中表示人群先于耶稣和门徒抵达；此译法自然呈现比较关系。
