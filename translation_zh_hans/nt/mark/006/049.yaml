  text: οἱ δὲ ἰδόντες αὐτὸν ⸂ἐπὶ τῆς θαλάσσης περιπατοῦντα⸃ ἔδοξαν ⸂ὅτι φάντασμά ἐστιν⸃ καὶ ἀνέκραξαν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/049.yaml
  text: But when they saw him walking on the sea[a], they thought that it was a ghost, and they cried out,
translation:
  language: zh_hans
  text: 可是，他们看见他在海面上行走，以为是幽灵[a]，就喊叫起来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“鬼影”或“幻影”。希腊语φάντασμα指鬼魅般显现的形象。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: 可是，他们
  rationale: δέ在这里轻微转折并推进叙事；“可是”自然引出门徒与前述情景相反的反应，实词化冠词所指的群体则以“他们”表达。
- source_word: ἰδόντες αὐτόν
  choice: 他们看见他
  rationale: 将不定过去时分词按时间关系自然译出；“他”指耶稣。
- source_word: ἐπὶ τῆς θαλάσσης περιπατοῦντα
  choice: 在海面上行走
  rationale: ἐπί加属格在本叙事中表示行走于水面之上；“海面上”既保留θάλασσα的“海”，也避免误解为沿海边行走。
- source_word: ἔδοξαν
  choice: 以为
  rationale: δοκέω在此表示基于错误观感作出判断；“以为”简洁自然，并含后来证明并非如此的语感。
- source_word: ὅτι φάντασμά ἐστιν
  choice: 是鬼影
  rationale: φάντασμα指幽灵般显现的形象；“鬼影”是普通现代汉语中清楚而不失庄重的表达。希腊文间接引语中的现在时在中文无需显式回移。
- source_word: καὶ ἀνέκραξαν
  choice: 就喊叫起来
  rationale: ἀνακράζω表示突然大声呼喊；“喊叫起来”传达起始性与强度，但不额外限定为尖叫。
theological_decisions:
- issue: 耶稣在水上的行动
  choice: 在海面上行走
  alternative: 在海边行走
  rationale: 结合介词短语、上下文及门徒的反应，此处的自然含义是行走在水面上；译文直接呈现叙事所述的神迹，不加发挥。
- issue: 门徒所认定之形象的性质
  choice: 鬼影
  alternative: 幽灵；幻影
  rationale: φάντασμα可指鬼魅般的显现，但原文并未说明门徒对其本体的完整观念；“鬼影”保留这种现象性与含混性，脚注列出其他可能译法。
translation_notes:
  register: 采用现代、自然而庄重的叙事语体。“可是”承接前文并凸显门徒的误认；“海面上”明确空间关系；脚注标记紧接其实际说明的“鬼影”，避免标记与释义错位。
