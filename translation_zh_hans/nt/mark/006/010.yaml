  text: καὶ ἔλεγεν αὐτοῖς· Ὅπου ⸀ἐὰν εἰσέλθητε εἰς οἰκίαν, ἐκεῖ μένετε ἕως ἂν ἐξέλθητε ἐκεῖθεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/010.yaml
  text: And he was saying to them[a], “Wherever you enter a house, stay there until you leave that place.”
translation:
  language: zh_hans
  text: 他对他们说：“无论你们进到哪一家，就住在那里，直到你们离开那里[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“直到你们从那里出去。”原文较直译为“直到你们从那里出去”；按上下文，“那里”很可能指当地。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: 又对他们说
  rationale: 未完成时在叙事中可表示持续或反复的言说；现代汉语通常以“又……说”承接上下文，比直译为“持续说”更自然，同时保留耶稣继续吩咐的语气。
- source_word: Ὅπου ἐὰν
  choice: 无论你们在哪里
  rationale: 该组合表达不定关系意义，即“无论在哪里”；此译法自然、清楚。
- source_word: εἰσέλθητε εἰς οἰκίαν
  choice: 进了一户人家
  rationale: εἰσέρχομαι与εἰς表示进入；“一户人家”兼顾房屋及接待住宿的家庭语境，比生硬的“进入一个房子”更符合现代汉语。
- source_word: ἐκεῖ μένετε
  choice: 就住在那里
  rationale: μένω在此指停留、住宿；“住在那里”贴合旅行传道时投宿的语境，也自然传达不要另换住处的指示。
- source_word: ἕως ἂν ἐξέλθητε ἐκεῖθεν
  choice: 直到你们离开那个地方
  rationale: ἐκεῖθεν字面为“从那里”；结合差遣与住宿的语境，通常指离开当地。不过原文也可较直接地理解为从那里出去，因此用脚注保留这一可能性。
theological_decisions:
- issue: ἐκεῖθεν在离开分句中的指涉范围
  choice: 理解为门徒离开当地以前，都住在同一户人家
  alternative: 理解为直到从那所房子出去
  rationale: 上下文是在规定门徒传道期间的投宿方式，指向不要在当地各家之间更换住处；但希腊文“从那里出去”本身并未明确说“当地”，故以脚注保留较字面的理解，避免消除原有歧义。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“一户人家”体现住宿接待语境；“就住在那里”简洁传达持续停留的命令。脚注保留ἐκεῖθεν指涉范围上的真实歧义。
