  text: ὁ δὲ εἶπεν αὐτῇ· ⸀Θυγάτηρ, ἡ πίστις σου σέσωκέν σε· ὕπαγε εἰς εἰρήνην, καὶ ἴσθι ὑγιὴς ἀπὸ τῆς μάστιγός σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/034.yaml
  text: But he said to her[a], “Daughter, your faith has saved you. Go in peace[b], and be well from your affliction.”
translation:
  language: zh_hans
  text: 耶稣却对她说：“女儿，你的信救了你[a]。平安地去吧，并要从你的病痛中恢复健康[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “救了你”也可译作“使你痊愈了”或“医治了你”。希腊语动词可指拯救、解救或医治。
    reason: 保留σῴζω在拯救与医治之间的语义幅度。
  - marker: b
    text: “恢复健康”也可译作“健康”或“痊愈”。
    reason: 说明ἴσθι ὑγιής可表达健康、完好或痊愈的状态。
lexical_decisions:
- source_word: Θυγάτηρ
  choice: 女儿
  rationale: 保留呼格的亲切与家人般的意味，不增添原文没有的“我的”。
- source_word: πίστις
  choice: 信
  rationale: 在本语境中指女子对耶稣的信靠；“信”既自然，也保留本词在新约中的关键用语一致性。
- source_word: σέσωκέν
  choice: 救了
  rationale: σῴζω既可指拯救，也可指医治或使人恢复完整。译作“救了”保留较宽的语义，并与下文身体康复的表述有所区别。
- source_word: ὕπαγε εἰς εἰρήνην
  choice: 平安地去吧
  rationale: 以自然的现代汉语表达离去时处于平安之中的含义。
- source_word: ἴσθι ὑγιὴς
  choice: 安康无恙
  rationale: 原文是表示持续状态的命令式，重点在成为并保持健康完好；“安康无恙”比单纯“得医治”更能体现这一状态。
- source_word: μάστιγος
  choice: 病痛
  rationale: 本词本义可指鞭打或鞭子，此处比喻折磨人的疾病；“病痛”在上下文中自然，并保留痛苦折磨的意味。
theological_decisions:
- issue: σῴζω在医治叙事中的含义
  choice: 救了你
  alternative: 使你痊愈了／医治了你
  rationale: 原词同时容纳拯救、恢复和医治的意义。正文采用“救了你”，不把其意义局限于身体医治；脚注交代语义可能性，以保留原文的张力。
- issue: πίστις所指
  choice: 你的信
  alternative: 你的信靠
  rationale: 这里侧重女子信靠耶稣的行动，而非长期的忠信品格；“信”保留核心神学词汇，同时不额外界定信心发挥作用的机制。
- issue: ἴσθι ὑγιὴς的状态性
  choice: 安康无恙
  alternative: 痊愈／健康
  rationale: 采用状态性表达，不把命令式悄然改成单纯的过去事件；同时与前句“救了你”保持区分。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“女儿”保留亲切称呼；两个短句与感叹号体现耶稣直接而安慰性的宣告。将脚注标记分别置于其实际说明的“救了你”和“安康无恙”之后。
