  text: And they began to beg him to leave their region[a].
translation:
  language: zh_hans
  text: 他们就恳求他离开他们的地区。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“催促他离开他们的境内。”
    reason: “催促”反映παρακαλεῖν可有的敦促义；“境内”对应ὅρια所指的地域。
lexical_decisions:
- source_word: καὶ
  choice: 于是
  rationale: 承接上文叙事，并自然表达事件推进；这里不刻意强化严格的时间先后。
- source_word: ἤρξαντο
  choice: 开始
  rationale: 保留ἄρχομαι加不定式所表达的起始义。
- source_word: παρακαλεῖν
  choice: 恳求
  rationale: 既体现请求的迫切和郑重，也符合此处众人面对耶稣时的情境；“劝请”也是可能译法。
- source_word: αὐτὸν
  choice: 耶稣
  rationale: 原文为代词“他”，所指是耶稣；汉语叙事中明确姓名可避免指代含混。
- source_word: ἀπελθεῖν
  choice: 离开
  rationale: 自然表达ἀπέρχομαι在此处“离去”的含义，并与后面的地点成分顺畅搭配。
- source_word: ἀπὸ τῶν ὁρίων αὐτῶν
  choice: 离开他们的地区
  rationale: ὅρια字面涉及边界，复数在此转指边界所圈定的地域；“地区”比直译“边界”更符合现代汉语。
