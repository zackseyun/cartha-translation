  text: καὶ παρεκάλεσαν ⸀αὐτὸν λέγοντες· Πέμψον ἡμᾶς εἰς τοὺς χοίρους, ἵνα εἰς αὐτοὺς εἰσέλθωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/012.yaml
  text: And they begged him[a], saying, “Send us into the pigs, so that we may enter them.”
translation:
  language: zh_hans
  text: 它们央求他，说：“请把我们送到那些猪那里去，好让我们进入它们里面。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρεκάλεσαν
  choice: 央求
  rationale: 这里表示强烈、迫切的恳求；“央求”比一般的“请求”更贴合语境，也符合现代汉语叙事表达。
- source_word: αὐτὸν
  choice: 他
  rationale: 作直接宾语，按上下文指耶稣；正文保留希腊文的代词表达，不重复补出姓名。
- source_word: λέγοντες
  choice: 说
  rationale: 该分词引出央求的具体内容；汉语用“央求他说”自然地表达这一结构。
- source_word: Πέμψον
  choice: 请把我们送到
  rationale: πέμπω的明确词义是“差遣、送去”。加“请”体现请求语气，但不把动词释为仅仅“准许”。
- source_word: εἰς τοὺς χοίρους
  choice: 到那些猪那里去
  rationale: χοῖρος指猪；定冠词在此指上下文中特定的猪。译成“到那些猪那里去”既自然，也避免提前把后一句“进入它们里面”的意思合并进来。
- source_word: ἵνα
  choice: 好让
  rationale: 引出目的，保留“被送到猪那里”与“进入猪里面”之间的目的关系。
- source_word: εἰς αὐτοὺς εἰσέλθωμεν
  choice: 让我们进入它们里面
  rationale: 直译其进入内部的含义，并保留复数代词所指的那些猪。
theological_decisions:
- issue: 说话者对耶稣权柄的态度
  choice: 译作“央求”并使用命令式请求“请把我们送到”，呈现它们在耶稣面前恳求处置。
  alternative: 弱化为一般性的“请求”或仅译成“准许我们去”。
  rationale: 原文的παρακαλέω语气强烈，而πέμπω明确表示“送、差遣”；这样的译法显出叙事中的权柄关系，却不额外加入超出经文的教义说明。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“它们”按上下文指污灵，符合现代汉语对非人灵体的常见指称；句中保留原文“送到……好让……进入……”的层次与轻微重复。
