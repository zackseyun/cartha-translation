  text: ⸂καὶ ἰδὼν⸃ τὸν Ἰησοῦν ἀπὸ μακρόθεν ἔδραμεν καὶ προσεκύνησεν ⸀αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/006.yaml
  text: And seeing Jesus from a distance[a], he ran and bowed down before him,
translation:
  language: zh_hans
  text: 他从远处看见耶稣，就跑过去，俯伏在他面前[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“敬拜他”或“向他下拜”。希腊语动词可指敬拜，也可按语境指俯伏或致敬。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: 看见
  rationale: 不定过去时分词在此自然表达先于主句动作发生的情形；与“就”搭配，清楚呈现叙事顺序，又不额外强调时间间隔。
- source_word: ἀπὸ μακρόθεν
  choice: 从远处
  rationale: 准确表达空间上的距离，符合现代汉语常用说法。
- source_word: ἔδραμεν
  choice: 跑过去
  rationale: τρέχω直指奔跑；补出趋向成分“过去”使汉语叙事自然，但不加入“冲”“飞奔”等原文未明说的强度。
- source_word: προσεκύνησεν αὐτόν
  choice: 俯伏在他面前
  rationale: προσκυνέω可指敬拜，也可指俯伏、致敬。正文呈现可见动作，不先行断定这里是否特指宗教敬拜，并在脚注保留其他语义可能。
- source_word: καὶ
  choice: 就
  rationale: 首个καί在汉语中可由句内承接体现；第二个καί译作“就”，自然连接看见与随后发生的动作，同时保留马可叙事的紧凑推进。
- source_word: τὸν Ἰησοῦν
  choice: 耶稣
  rationale: 专名按现代汉语圣经惯用形式音译；希腊语冠词无需另译。
theological_decisions:
- issue: 是否把προσεκύνησεν明确译成对耶稣的“敬拜”
  choice: 正文译作“俯伏在他面前”
  alternative: “敬拜他”或“向他下拜”
  rationale: 该动词可表示敬拜，也可表示俯伏或致敬。此处正文保留身体动作及其神学张力，避免在原文容许多重语义时预先判定行为的确切性质；脚注说明其他可能译法。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“俯伏在他面前”兼顾动作画面与词义开放性；“跑过去”使动作方向在汉语中清楚，但不增添原文没有的情绪或速度强度。
