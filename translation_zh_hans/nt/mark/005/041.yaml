  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ κρατήσας τῆς χειρὸς τοῦ παιδίου λέγει αὐτῇ· Ταλιθα ⸀κουμ, ὅ ἐστιν μεθερμηνευόμενον· Τὸ κοράσιον, σοὶ λέγω, ⸀ἔγειρε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/041.yaml
  text: And taking the child's hand[a], he says to her, “Talitha koum,” which is translated, “Little girl, I say to you, get up.”
translation:
  language: zh_hans
  text: 他握住孩子的手，对她说：“塔利塔，库姆[a]！”翻译出来就是：“小女孩，我对你说，起来！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这是亚兰语的音译。有些中文译本按传统音译作“大利大，古米”；本节所据希腊文本作κουμ，因此这里音译为“库姆”。
    reason: 说明亚兰语音译及传统译法的差异。
lexical_decisions:
- source_word: κρατήσας τῆς χειρὸς
  choice: 握住……的手
  rationale: κρατέω与手的属格连用，表示抓住或握住某人的手；“握住”既保留实际接触，也符合本段语境，不采用力度过强的“抓牢”或“攫住”。
- source_word: τοῦ παιδίου
  choice: 孩子
  rationale: παιδίον指孩子，原文随后才用κοράσιον明确为女孩；先译“孩子”可避免提前重复性别信息。
- source_word: λέγει αὐτῇ
  choice: 对她说
  rationale: λέγει是马可常用的历史现在时。现代汉语叙事中的“说”本身通常不标时态，因此“对她说”自然地保留叙事的直接感。
- source_word: Ταλιθα κουμ
  choice: 塔利塔，库姆
  rationale: 原文特意保存亚兰语话语并随即给出翻译，正文因此保留音译；“库姆”直接对应本版希腊文本的κουμ。
- source_word: μεθερμηνευόμενον
  choice: 翻译出来就是
  rationale: 该词明确引出对亚兰语的翻译或解释；此译法清楚、自然，并保留马可的说明语气。
- source_word: Τὸ κοράσιον
  choice: 小女孩
  rationale: κοράσιον指年幼的女孩，并带有小称意味；“小女孩”准确表达年龄与亲切语气。
- source_word: σοὶ λέγω
  choice: 我对你说
  rationale: 原文明确包含σοί，具有强调对象的作用；保留整句，不因汉语中似显重复而省略。
- source_word: ἔγειρε
  choice: 起来
  rationale: ἐγείρω的命令式在此可表示起身或醒起；“起来”简洁自然，也与随后女孩起身的叙事相合。
theological_decisions:
- issue: 是否在正文保留耶稣所说的亚兰语
  choice: 保留音译“塔利塔，库姆”，并紧接马可所给的翻译。
  alternative: 只译作“小女孩，我对你说，起来”，或采用传统音译“大利大，古米”。
  rationale: 希腊原文本身先保存这句亚兰语，再作解释。两者并存可忠实呈现叙事特色，同时确保读者明白其含义；不借翻译扩展任何教义解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“握住孩子的手”自然具体；直接引语简洁有力。标点将两段亚兰语分别音译，并用正文中的[a]对应脚注。
