  text: καὶ κράξας φωνῇ μεγάλῃ ⸀λέγει· Τί ἐμοὶ καὶ σοί, Ἰησοῦ υἱὲ τοῦ θεοῦ τοῦ ὑψίστου; ὁρκίζω σε τὸν θεόν, μή με βασανίσῃς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/007.yaml
  text: And crying out with a loud voice[a], he says, “What have I to do with you, Jesus, Son of the Most High God? I adjure you by God[c][b], do not torment me.”
translation:
  language: zh_hans
  text: 他大声喊着说：“耶稣，至高上帝的儿子，我跟你有什么相干？[a]我奉上帝的名郑重嘱咐你，[b]不要折磨我！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“你跟我有什么关系？”这是一个惯用语，表达双方之间的疏离、冲突或互不介入。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“我指着上帝叫你起誓”或“我奉上帝的名恳求你”。原文动词含有使人起誓、郑重嘱咐或庄严恳求的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: κράξας φωνῇ μεγάλῃ
  choice: 大声喊叫
  rationale: 保留分词所表达的强烈呼喊及“大声”的场景感，同时采用自然简洁的现代汉语。
- source_word: λέγει
  choice: 说
  rationale: 希腊文采用历史现在时以增强叙事现场感；汉语动词本身不标时态，用“说”即可自然保留其鲜明感。
- source_word: Τί ἐμοὶ καὶ σοί
  choice: 我跟你有什么相干
  rationale: 这是表达疏离、拒绝介入或冲突的惯用语；此译法简洁有力，也不把其语用范围限定得过窄。
- source_word: υἱὲ τοῦ θεοῦ τοῦ ὑψίστου
  choice: 至高上帝的儿子
  rationale: 明确保留“儿子”这一称号以及“至高者”这一对上帝的尊称，并符合现代汉语语序。
- source_word: ὁρκίζω σε τὸν θεόν
  choice: 我凭上帝郑重要求你
  rationale: 既表现这句话借上帝之名发出严肃要求的分量，又避免正文使用普通读者难懂的法律或宗教术语；其起誓、郑重嘱咐的意味在脚注中说明。
- source_word: μή με βασανίσῃς
  choice: 不要折磨我
  rationale: “折磨”自然传达 βασανίζω 所含的强烈痛苦，却不额外限定痛苦的具体方式。
theological_decisions:
- issue: 污灵对耶稣身份的称呼
  choice: 至高上帝的儿子
  alternative: 至高者上帝的儿子
  rationale: 照原文完整保留污灵对耶稣身份的承认，不削弱“儿子”称号，也不加入本节没有明说的后期教义表述。
- issue: 污灵借上帝之名向耶稣提出要求的张力
  choice: 我凭上帝郑重要求你
  alternative: 我指着上帝叫你起誓
  rationale: 保留污灵竟借上帝之名对耶稣发出庄严要求这一突兀张力，同时以脚注呈现原动词所带的起誓或郑重嘱咐意味，不将其弱化成一般恳求。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“有什么相干”略带书面色彩，但仍为普通读者熟悉，并能传达原文短促尖锐的抗拒语气；“郑重要求”兼顾原文的誓言色彩与正文可读性。
