  text: καὶ ⸀εὐθὺς ἐξηράνθη ἡ πηγὴ τοῦ αἵματος αὐτῆς, καὶ ἔγνω τῷ σώματι ὅτι ἴαται ἀπὸ τῆς μάστιγος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/029.yaml
  text: And immediately the flow of her blood dried up[b][a], and she knew in her body that she had been healed of the affliction.
translation:
  language: zh_hans
  text: 她出血的源头[a]立刻干涸了；她从身体的状况知道，自己已经从这病痛[b]中得了医治。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“她血的泉源干涸了”；原文以泉源或源头为生动意象，指她出血的源头。
    reason: lexical_alternative
  - marker: b
    text: “病痛”原文也可译作“鞭打”或“灾病”。此处指使她受折磨的病患。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: 立刻
  rationale: 保留马可叙事中鲜明的即时性，现代汉语自然简洁。
- source_word: ἐξηράνθη
  choice: 干涸了
  rationale: 保留ξηραίνω“变干、干涸”的生动意象，而不弱化为仅仅“止住了”。
- source_word: ἡ πηγὴ τοῦ αἵματος αὐτῆς
  choice: 她的血源
  rationale: πηγή本义为泉源、源头；“血源”保留原文意象，并在上下文中指她出血的源头。
- source_word: ἔγνω τῷ σώματι
  choice: 她也从身体上知道
  rationale: 兼顾ἔγνω的“知道、察觉”和与格τῷ σώματι所表达的身体感知，避免只译为主观“感觉”。
- source_word: ἴαται
  choice: 已经……得了医治
  rationale: 用“已经”体现完成时所表达的医治已经成就并持续有效。
- source_word: ἀπὸ τῆς μάστιγος
  choice: 从这病痛中
  rationale: μάστιξ本指鞭子、鞭打，也可比喻造成折磨的灾病；此处“病痛”自然地指她那使人受苦的疾病，同时保留痛苦意味。
theological_decisions:
- issue: 医治陈述的性质
  choice: 同时陈述出血源头客观停止，以及妇人身体上的确知，不添加医治机制或来源的解释。
  alternative: 将本句意译为她主观觉得症状有所缓解。
  rationale: 原文既描写身体状况立即改变，也用完成时说明她已得医治；译文保留两者之间的张力与完整性。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“血源”略带意象性，以贴近原文；“从身体上知道”刻意保留认知与身体感受两层含义。
