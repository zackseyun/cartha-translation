  source_fidelity: “血源”在现代汉语中通常指血液的来源或供血来源，不能清楚表达πῆγη所指的出血源头，且容易产生误解。改为“出血的源头”既保留原文的泉源意象，也准确说明其在语境中的所指。“从身体的状况知道”自然地表达了τῷ σώματι所含的身体性认知，而不把ἔγνω弱化为单纯感觉。
  naturalness: 原译“她的血源”“从身体上知道”均稍显生硬。“她出血的源头”“她从身体的状况知道”是自然、庄重的现代书面汉语；“得了医治”也恰当表达完成的医治状态。
  terminology: “医治”适合ἴαται；“病痛”可在本节表达μάστιξ作为使人受苦之病患的引申义。脚注改用更自然且更审慎的说明，保留“鞭打”和“灾病/灾祸”的词义可能性，且不将该词断定为单一的比喻。
