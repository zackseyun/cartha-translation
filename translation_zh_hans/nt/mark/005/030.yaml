  text: καὶ ⸀εὐθὺς ὁ Ἰησοῦς ἐπιγνοὺς ἐν ἑαυτῷ τὴν ἐξ αὐτοῦ δύναμιν ἐξελθοῦσαν ἐπιστραφεὶς ἐν τῷ ὄχλῳ ἔλεγεν· Τίς μου ἥψατο τῶν ἱματίων;
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/030.yaml
  text: And immediately Jesus[a], perceiving in himself that power had gone out from him, turned around in the crowd and said, “Who touched my garments?”
translation:
  language: zh_hans
  text: 耶稣立刻察觉到有能力从自己身上出去了，就在众人中转过身来，说：“谁摸了我的衣服？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐθὺς
  choice: 立刻
  rationale: 保留马可叙事中迅速推进的节奏，是现代汉语自然、准确的时间副词。
- source_word: ἐπιγνοὺς ἐν ἑαυτῷ
  choice: 察觉到
  rationale: 表达耶稣内在而清楚的感知；汉语无需机械直译“在自己里面”，即可自然传达原意。
- source_word: δύναμιν
  choice: 能力
  rationale: 直译该词在此处所指实际发生作用的力量，同时不擅自增添“医治”或“神奇”等解释性限定。
- source_word: ἐξ αὐτοῦ … ἐξελθοῦσαν
  choice: 从自己身上出去了
  rationale: 保留能力出自耶稣以及动作已发生的含义；“了”体现相对于察觉而言已经完成。
- source_word: ἐπιστραφεὶς ἐν τῷ ὄχλῳ
  choice: 在 crowd中转过身来
  rationale: 准确呈现耶稣身处 crowd并作出转身动作的场景。
- source_word: ἔλεγεν
  choice: 说
  rationale: 未完成时在这里自然用作引出直接引语；上下文不要求译成反复地说。
- source_word: ἥψατο τῶν ἱματίων
  choice: 摸了我的衣服
  rationale: “摸”符合叙事情境及现代汉语习惯；“衣服”保留ἱμάτια宽泛的衣物含义，不缩窄为某一种外衣。
theological_decisions:
- issue: 耶稣察觉能力从自己身上出去
  choice: 按叙事直陈为“察觉到有能力从自己身上出去了”
  alternative: 解释性译作“知道自己的医治能力发了出去”
  rationale: 原文把能力从耶稣而出作为真实事件来叙述，却没有说明其运作机制；译文既保留这一陈述，也不加入超出经文的教义解释。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语；句式保持紧凑，以再现马可叙事的即时感。
