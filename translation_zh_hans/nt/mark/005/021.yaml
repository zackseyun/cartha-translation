  text: Καὶ διαπεράσαντος τοῦ Ἰησοῦ ἐν τῷ πλοίῳ πάλιν εἰς τὸ πέραν συνήχθη ὄχλος πολὺς ἐπ’ αὐτόν, καὶ ἦν παρὰ τὴν θάλασσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/021.yaml
  text: And after Jesus had crossed over again in the boat to the other side[a], a large crowd gathered around him, and he was beside the sea.
translation:
  language: zh_hans
  text: 耶稣又坐船渡到对岸[a]后，一大群人聚集到他那里；他在海边。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里所说的是加利利海；它是一个湖，但福音书通常称它为“海”。
    reason: cultural_note
lexical_decisions:
- source_word: διαπεράσαντος
  choice: 渡到……以后
  rationale: 该不定过去时分词用于属格独立结构，表示先于主句发生的动作；译为“渡到……以后”自然地保留了时间先后关系。
- source_word: ἐν τῷ πλοίῳ
  choice: 坐船
  rationale: 现代汉语通常用“坐船”表达乘船渡行；虽不逐字对应“在船里”，但准确保留出行方式，且叙事自然。
- source_word: πάλιν
  choice: 又
  rationale: “又”简洁自然地表达动作再次发生。
- source_word: εἰς τὸ πέραν
  choice: 到对岸
  rationale: 在加利利海的渡行语境中，该短语指水域的另一边；“到对岸”清楚自然。
- source_word: συνήχθη
  choice: 聚集
  rationale: 该动词虽为被动形式，但此处自然表达群众汇集；汉语用主动式“聚集”无需暗示某人召集他们。
- source_word: ὄχλος πολὺς
  choice: 一大群人
  rationale: 准确表达群众人数众多，也符合现代汉语叙事习惯。
- source_word: ἐπ’ αὐτόν
  choice: 到他那里
  rationale: 在 συνάγω 的搭配中，ἐπί 加宾格表示朝向并汇聚于某人；“到他那里”保留趋向性，同时避免把原文明确化为完全包围。
- source_word: παρὰ τὴν θάλασσαν
  choice: 正在海边
  rationale: παρά 加宾格在此表示沿水域边缘的位置；“在海边”自然准确。“正在”结合未完成时 ἦν，呈现当时持续的场景。
- source_word: θάλασσαν
  choice: 海
  rationale: 原文使用 θάλασσα（海）；正文保留福音书惯称，地理上实际为湖泊的信息置于脚注。
