base_translation:
  language: en
  yaml_path: translation/nt/mark/005/005.yaml
  text: And continually[a], night and day, among the tombs and on the mountains, he was crying out and cutting himself with stones.
translation:
  language: zh_hans
  text: 他昼夜不停地在坟墓间和山上喊叫，并用石头割伤自己。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ παντὸς νυκτὸς καὶ ἡμέρας
  choice: 昼夜不停地
  rationale: 该短语表达贯穿昼夜的持续状态；“昼夜不停地”既保留时间范围，也自然传达反复持续之意。
- source_word: μνήμασιν
  choice: 坟墓
  rationale: μνῆμα指埋葬死者之处，语境中很可能是可供人出入的墓穴；现代汉语用“坟墓”清楚而不作过度具体化。
- source_word: ὄρεσιν
  choice: 山中
  rationale: ὄρος通常指山；“山中”与前面的“坟墓间”形成自然的地点表达。
- source_word: ἦν κράζων
  choice: 喊叫
  rationale: 未完成时的εἰμί加现在分词表示过去持续进行的动作；“昼夜不停地”已承载其持续性，因此用“喊叫”简洁自然。
- source_word: κατακόπτων ἑαυτὸν
  choice: 割伤自己
  rationale: κατακόπτω可表示猛烈击打或割砍而造成伤害；“割伤自己”明确传达以石头自伤，同时避免把伤势程度解释得过满。
- source_word: λίθοις
  choice: 用石头
  rationale: 此处与格表示工具；“用石头”是自然、明确的现代汉语表达。
theological_decisions: []
translation_notes:
