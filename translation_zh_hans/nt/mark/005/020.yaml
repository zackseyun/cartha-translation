  text: καὶ ἀπῆλθεν καὶ ἤρξατο κηρύσσειν ἐν τῇ Δεκαπόλει ὅσα ἐποίησεν αὐτῷ ὁ Ἰησοῦς, καὶ πάντες ἐθαύμαζον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/020.yaml
  text: And he went away and began to proclaim in the Decapolis how much Jesus had done for him[a], and everyone was amazed.
translation:
  language: zh_hans
  text: 他离开后，开始在低加波利地区传扬耶稣为他所做的一切[a]，众人都很惊奇。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“耶稣为他做了多少事。”
    reason: ὅσα既可概括“所做的一切”，也可突出所做之事的多少或程度。
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: 离开了
  rationale: 表达从现场离去，简洁自然，不采用较书面的“离去”。
- source_word: ἤρξατο κηρύσσειν
  choice: 开始……传扬
  rationale: 保留ἤρξατο的不定式起始义；“传扬”体现公开宣告，又不把场景限定为正式讲道。
- source_word: ἐν τῇ Δεκαπόλει
  choice: 在十城地区
  rationale: Δεκάπολις是通称“十城”的地区；加“地区”帮助现代普通读者理解，ἐν直译为“在”。
- source_word: ὅσα
  choice: 一切
  rationale: 在ὅσα ἐποίησεν结构中概括耶稣所做的事；“多少”也是可能理解，故列入脚注，以保留范围或程度上的弹性。
- source_word: ἐποίησεν αὐτῷ
  choice: 为他所做的
  rationale: 与格αὐτῷ在语境中表示使他受益，译作“为他”，而非可能带负面意味的“对他”。
- source_word: πάντες
  choice: 众人都
  rationale: 自然表达所有在场或听见的人，不额外限定其身份。
- source_word: ἐθαύμαζον
  choice: 感到惊奇
  rationale: 符合现代汉语叙事语体；希腊语未完成时所含持续或反复意味可由语境领会，不生硬加词。
- source_word: ὁ Ἰησοῦς
  choice: 耶稣
  rationale: 采用现代汉语中通行的人名译法。
theological_decisions:
- issue: 那人的传扬与耶稣身份之间的关系
  choice: 只陈述他传扬耶稣为他所做的事
  alternative: 增译为宣告耶稣的神圣权柄或身份
  rationale: 本节叙述耶稣的作为和众人的惊奇，虽暗示非凡权能，却没有明说教义结论，因此不作神学扩写。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“十城地区”兼顾地名含义与普通读者理解；分号清楚连接传扬的内容与众人的反应。
