  yaml_path: translation/nt/mark/005/032.yaml
  text: And he kept looking around to see the one who had done this[a].
translation:
  language: zh_hans
  text: 他一直环顾四周，想看见那做了这事的人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊原文中“那做了这事的人”采用阴性形式，所指者为女性。
    reason: 原文以语法阴性标明所指者为女性，但现代汉语正文中的“人”本身不体现性别。
lexical_decisions:
- source_word: καὶ
  choice: （不单独译出）
  rationale: 希腊文连词承接叙事；现代汉语在本句中省略连接词更自然，前后关系仍然清楚，也不额外加入推论意味。
- source_word: περιεβλέπετο
  choice: 不断环顾四周
  rationale: 未完成过去时表达持续进行的动作；“不断”体现其延续性，“环顾四周”准确表达向周围察看的意思。
- source_word: ἰδεῖν
  choice: 要看看
  rationale: 不定式在此表示察看的目的；“要看看”符合现代汉语叙事表达，并保留“看见、辨认”的基本含义。
- source_word: τὴν ... ποιήσασαν
  choice: 那做了……的人
  rationale: 这是带阴性冠词的实体化分词，指实施该动作的特定女性。正文用自然的汉语“那……的人”，不增添原文没有明说的名词“女子”；其阴性语法信息由脚注说明。
- source_word: τοῦτο
  choice: 这事
  rationale: 指向上文刚发生的行为；“这事”简洁自然，并保留指示语的回指功能。
theological_decisions: []
