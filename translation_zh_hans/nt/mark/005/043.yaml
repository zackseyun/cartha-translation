base_translation:
  language: en
  yaml_path: translation/nt/mark/005/043.yaml
  text: And he strictly ordered them that no one should know this[c][b][a], and he said that she should be given something to eat.
translation:
  language: zh_hans
  text: 耶稣严正嘱咐他们，不可让任何人知道这事[a]；又吩咐给她东西吃[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “严正嘱咐”也可译作“郑重嘱咐”或“严厉警告”。原文含有一个字面意为“许多、多多”的加强语，用以加强这项嘱咐的语气。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“给她吃”，意思是“给她东西吃”。
    reason: lexical_alternative
lexical_decisions:
- source_word: διεστείλατο αὐτοῖς πολλὰ
  choice: 再三严厉嘱咐他们
  rationale: διαστέλλομαι表示郑重而强烈地吩咐或警告；πολλὰ在此加强语气，可能兼有殷切、反复嘱咐的意味。译文以“再三严厉嘱咐”自然传达这一强化表达。
- source_word: ἵνα μηδεὶς γνοῖ τοῦτο
  choice: 不可让任何人知道这事
  rationale: ἵνα加虚拟语气在这里表达命令所指向的目的或内容；γνοῖ表示得知、知晓。译文保留禁令的范围，不增添其神学原因。
- source_word: εἶπεν
  choice: 吩咐
  rationale: 字面为“说”，但后接被动不定式，在语境中具有指示、吩咐的功能；“吩咐”符合现代汉语表达。
- source_word: δοθῆναι αὐτῇ φαγεῖν
  choice: 给她东西吃
  rationale: 字面结构近于“给她吃”；汉语需要补出隐含的受事“东西”，如此既自然，也忠实表达应当给女孩食物的意思。
theological_decisions:
- issue: 弥赛亚隐秘主题及命令的范围
  choice: 只译出耶稣严厉禁止在场者让别人知道此事
  alternative: 在正文中解释为马可福音整体的“弥赛亚隐秘”主题，或把命令明确限定为只针对女孩的家人和见证人
  rationale: 原文只陈述强烈的禁令，没有解释原因，也没有在本句中进一步界定对象；译文保留这种张力，不加入神学说明。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“再三严厉嘱咐”保留原文强化语气；分号清楚连接两个连续动作。
