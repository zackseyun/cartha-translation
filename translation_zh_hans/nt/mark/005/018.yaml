  text: καὶ ⸀ἐμβαίνοντος αὐτοῦ εἰς τὸ πλοῖον παρεκάλει αὐτὸν ὁ δαιμονισθεὶς ἵνα ⸂μετ’ αὐτοῦ ᾖ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/018.yaml
  text: And as he was getting into the boat[a], the man who had been demon-possessed kept begging him that he might be with him.
translation:
  language: zh_hans
  text: 耶稣正登上船时，那曾被鬼附的人一再恳求耶稣，让他能和耶稣在一起。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβαίνοντος αὐτοῦ εἰς τὸ πλοῖον
  choice: 耶稣正要上船的时候
  rationale: 属格独立结构中的现在分词表示与主句动作同时发生、正在进行的动作；“正要上船的时候”符合现代汉语叙事习惯，并保留时间关系。根据上下文将代词所指明说为“耶稣”，避免单节阅读时含混。πλοῖον在加利利海的语境中自然译作“船”。
- source_word: παρεκάλει
  choice: 一再恳求
  rationale: 未完成时体现持续或反复的恳求；“一再恳求”既传达延续性，也保留请求的迫切意味。
- source_word: ὁ δαιμονισθείς
  choice: 那曾被鬼附的人
  rationale: 名词化的过去分词指前文已获释放的人。“曾被鬼附”表明这是他先前的状态，不暗示此刻仍被鬼控制；“那……的人”也自然承接前文已知对象。
- source_word: ἵνα μετ’ αὐτοῦ ᾖ
  choice: 让他能和耶稣在一起
  rationale: ἵνα加虚拟语气说明恳求的内容；译文保留“与他在一起”的关系性含义，而不扩大为特定职分或正式门徒身份。再次明说“耶稣”，是为避免现代汉语中连续第三人称代词造成指代混乱。
theological_decisions:
- issue: 如何表达δαιμονισθείς所指的邪灵辖制，同时不引入现代临床或纯比喻解释
  choice: 曾被鬼附
  alternative: 曾受群鬼辖制；曾被邪灵控制
  rationale: “被鬼附”是普通现代中文读者熟悉且直接的福音书用语，体现叙事所述真实的邪灵辖制；加上“曾”则与此人已经获释放的上下文一致。
- issue: μετ’ αὐτοῦ ᾖ是否应解释为正式跟随或成为门徒
  choice: 和耶稣在一起
  alternative: 跟随耶稣；陪同耶稣
  rationale: 原文直接表达“与他同在”，可能包含同行愿望，却没有在本句明说正式门徒身份；采用较贴近原文的关系性表达，保留其开放性。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准普通话。“一再恳求”传达未完成时的持续性；适度明说“耶稣”以消除汉语代词歧义，但不增加原文没有的神学身份说明。
