  text: Ἔτι αὐτοῦ λαλοῦντος ἔρχονται ἀπὸ τοῦ ἀρχισυναγώγου λέγοντες ὅτι Ἡ θυγάτηρ σου ἀπέθανεν· τί ἔτι σκύλλεις τὸν διδάσκαλον;
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/035.yaml
  text: While he was still speaking[a], people came from the synagogue leader's house, saying, “Your daughter has died[b]. Why do you still trouble the Teacher?”
translation:
  language: zh_hans
  text: 耶稣还在说话的时候，有人从会堂主管家里来[a]，说：“你的女儿死了，何必还麻烦[b]老师呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“从会堂主管那里来”。
    reason: 原文省略了具体地点；正文依上下文补出“家里”。
  - marker: b
    text: “麻烦”也可译为“打扰”或“劳烦”。
    reason: σκύλλεις在此表示给人添麻烦或继续打扰，汉语有数个相近译法。
lexical_decisions:
- source_word: Ἔτι αὐτοῦ λαλοῦντος
  choice: 耶稣还在说话的时候
  rationale: 这是表示同时发生的属格独立结构；“还在……的时候”自然保留了ἔτι的持续意味。代词按上下文明确为“耶稣”，避免汉语句首代词指向不清。
- source_word: ἔρχονται
  choice: 有人……来
  rationale: 这是叙事中的历史现在时，现代汉语通常按事件顺序自然叙述。“有人”保留来者身份与人数未具体说明的特点。
- source_word: ἀπὸ τοῦ ἀρχισυναγώγου
  choice: 从会堂主管家里来
  rationale: 原文形式上是“从会堂主管那里”，按上下文是指从其家中或所属处而来；补出“家里”可避免误解为主管本人派出，而主管此时正在耶稣身边。脚注保留原文较简略的表达。
- source_word: λέγοντες ὅτι
  choice: 说：“
  rationale: 分词引出直接引语，汉语用“说”最自然。
- source_word: Ἡ θυγάτηρ σου ἀπέθανεν
  choice: 你的女儿死了
  rationale: ἀπέθανεν陈述已经发生的死亡；“死了”是现代汉语直接、庄重且符合现场消息语气的表达。
- source_word: τί ἔτι
  choice: 何必还
  rationale: 该组合询问为何仍继续某事；“何必还”既自然，也传达说话者认为继续求助已无必要。
- source_word: σκύλλεις
  choice: 麻烦
  rationale: 此处指继续劳烦、打扰某人，并非“骚扰”或身体上的折磨；“麻烦”准确而符合现代汉语语境。
- source_word: τὸν διδάσκαλον
  choice: 老师
  rationale: διδάσκαλος的基本义是教师、老师。保留称号而不直接改成“耶稣”，维持说话者的视角；汉语普通名词在此无需用大写表示。
theological_decisions:
- issue: “老师”所指及其称号性质
  choice: 译作“老师”，由上下文指耶稣，但不在引语中改用其名字。
  alternative: 夫子；耶稣
  rationale: 原文使用称号διδάσκαλος而非名字。直译称号可保留来人对耶稣的称呼方式，不额外加入关于其身份或权柄的神学解释。
- issue: 来者出处的省略表达
  choice: 正文按语境译作“从会堂主管家里来”，并以脚注说明原文形式。
  alternative: 从会堂主管那里来
  rationale: 会堂主管睚鲁当时与耶稣同在，因此原短语在语境中自然指其家中或所属处。补出“家里”使汉语清楚，但用脚注保留原文的简略与潜在范围。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“会堂主管”准确表达ἀρχισυνάγωγος的职分；“何必还麻烦老师呢”保留来人认为死亡已使继续求助失去意义的语气，同时不替经文解决随后叙事中的神学张力。
