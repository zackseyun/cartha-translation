source:
  edition: SBLGNT
  text: ἡ δὲ γυνὴ φοβηθεῖσα καὶ τρέμουσα, εἰδυῖα ὃ γέγονεν ⸀αὐτῇ, ἦλθεν καὶ προσέπεσεν αὐτῷ καὶ εἶπεν αὐτῷ πᾶσαν τὴν ἀλήθειαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/033.yaml
  text: But the woman[a], fearing and trembling, knowing what had happened to her[b], came and fell down before him and told him the whole truth.
translation:
  language: zh_hans
  text: 那女人却又害怕又战兢；她知道自己身上发生了什么，就来到耶稣跟前，俯伏在他面前[a]，把全部实情都告诉了他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“倒在他面前”；也可理解为“伏在他脚前”。
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: 却
  rationale: 表示轻微转折并推进叙事，与上一节耶稣的询问及众人的反应形成对照，又不过分强化语气。
- source_word: ἡ γυνὴ
  choice: 那女人
  rationale: 指前文已经出现的患病女人；“那女人”在现代汉语叙事中自然地表达特指。
- source_word: φοβηθεῖσα καὶ τρέμουσα
  choice: 又害怕又战兢
  rationale: 保留两个并列分词所描写的强烈情绪和身体反应；“战兢”庄重而仍为现代读者所理解。
- source_word: εἰδυῖα
  choice: 她知道
  rationale: 用独立分句自然表达分词，同时不把它与后续行动的关系限定为纯粹因果。
- source_word: ὃ γέγονεν αὐτῇ
  choice: 自己身上发生了什么
  rationale: 自然表达发生在她身上的医治经历，又不将原文宽泛的“发生”解释得过细。
- source_word: ἦλθεν
  choice: 来到耶稣跟前
  rationale: 忠实表达简单的移动动作；补明上下文中的指称对象，使汉语清楚自然。
- source_word: προσέπεσεν αὐτῷ
  choice: 俯伏在他面前
  rationale: 表达她倒伏在耶稣面前的动作及恭敬、恳求的姿态，但不直接把该动作定性为敬拜。
- source_word: εἶπεν αὐτῷ πᾶσαν τὴν ἀλήθειαν
  choice: 把全部实情都告诉了他
  rationale: “告诉了他”符合汉语搭配；“全部实情”保留 πᾶσαν 的强调，表示毫无隐瞒地完整陈述。
theological_decisions:
- issue: προσέπεσεν αὐτῷ 所表达的姿态及其意义
  choice: 俯伏在他面前
  alternative: 倒在他面前；伏在他脚前
  rationale: 该动词可描写人在尊敬、惧怕或恳求中倒伏于某人面前。本译法保留动作及其庄重意味，却不越过经文本身，将其明确解释为敬拜。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“又害怕又战兢”保留原文的双重描写；分号使连续分词结构在汉语中层次清晰。“耶稣”由上下文补明，避免连续代词造成指称不清。
