  text: ὁ δὲ Ἰησοῦς ⸀παρακούσας τὸν λόγον λαλούμενον λέγει τῷ ἀρχισυναγώγῳ· Μὴ φοβοῦ, μόνον πίστευε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/036.yaml
  text: But Jesus[a], overhearing the word being spoken, says to the synagogue leader, “Do not be afraid[b]; only believe.”
translation:
  language: zh_hans
  text: 耶稣听见[a]这话，就对会堂主管说：“不要怕，只要信[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “听见”或译“不理会、没有把所说的话放在心上”。希腊词 παρακούσας 在这里可有这两种理解。
    reason: alternative_reading
  - marker: b
    text: “信”也可译“信靠”；这里的希腊动词是 πιστεύω。现在时命令也可能含有“继续相信”的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακούσας
  choice: 听见
  rationale: 该分词既可指“听见、无意中听到”，也可指“不理会”。上下文中耶稣随即回应刚传来的消息，因此正文采用“听见”；另一种词义保留在注脚中。
- source_word: τὸν λόγον λαλούμενον
  choice: 他们所说的话
  rationale: 按汉语自然表达处理为“他们所说的话”，指前文来人刚刚说出的消息，同时保留“话”与言说动作。
- source_word: λέγει
  choice: 就……说
  rationale: 希腊文使用历史现在时以增强叙事现场感；现代汉语叙事中用“就……说”自然地表现紧接发生的动作。
- source_word: ἀρχισυναγώγῳ
  choice: 会堂主管
  rationale: 该词指负责管理或主持犹太会堂的人。“会堂主管”简明、现代，也避免把职务误解为政治统治者。
- source_word: Μὴ φοβοῦ
  choice: 不要怕
  rationale: 简洁自然地传达否定命令，符合当时危急处境中的直接劝勉。
- source_word: μόνον
  choice: 只要
  rationale: 在汉语命令句“不要……，只要……”中自然表达 μόνον 的限定作用。
- source_word: πίστευε
  choice: 信
  rationale: 直接对应 πιστεύω，并与“只要”构成自然、庄重的劝勉。现在时命令可能含持续之意，但正文不强行增译；“信靠”等可能含义在注脚交代。
theological_decisions:
- issue: παρακούσας 的语义
  choice: 耶稣听见了所说的话
  alternative: 耶稣不理会／不把所说的话放在心上
  rationale: 两种解释在词义上都有依据。耶稣随即针对那消息向会堂主管说话，故“听见”较符合直接的叙事衔接；但“不理会”会改变叙事语气，需在注脚中保留。
- issue: πίστευε 在命令中的含义
  choice: 信
  alternative: 信靠；继续信
  rationale: “信”是 πιστεύω 最直接且不预先缩窄语义的译法。“信靠”可突出关系性的倚靠，而现在时命令也可能带有持续意味；这些可能性不应在正文中被强制确定。
translation_notes:
  register: 采用现代、简洁而庄重的叙事语言。“会堂主管”力求让普通读者明白其职务；正文避免生硬照搬“正在被说的话”，改用自然的“他们所说的话”。注脚标记均置于相关句末，保留原文两处真实的语义张力。
