  rationale: 删除无明文根据的“耶稣那里”，并将两项连续动作分为两句，使中文更自然清楚。保留“会堂主管”“睚鲁”及“俯伏在耶稣脚前”，以对应原文的身份称谓、姓名和动作；不把俯伏解释为敬拜。
