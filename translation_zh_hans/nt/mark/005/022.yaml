  text: ⸀καὶ ἔρχεται εἷς τῶν ἀρχισυναγώγων, ὀνόματι Ἰάϊρος, καὶ ἰδὼν αὐτὸν πίπτει πρὸς τοὺς πόδας αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/022.yaml
  text: And one of the synagogue rulers[a], named Jairus, came, and when he saw him[b], he fell at his feet.
translation:
  language: zh_hans
  text: 有一位会堂主管，名叫睚鲁，来了。他看见耶稣，就俯伏在耶稣脚前。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρχεται
  choice: 来到
  rationale: 这是叙事中的历史现在时；现代汉语通常不以动词时态形态区分现在与过去，“来到”既自然，也保留了马可叙事的现场感。结合语境补出目的地“耶稣那里”，使汉语表达完整清楚。
- source_word: εἷς τῶν ἀρχισυναγώγων
  choice: 有一个会堂主管
  rationale: εἷς τῶν 是部分结构，指若干会堂管理者中的一位；“有一个”自然引入新人物，“会堂主管”准确表达其管理职分，又避免现代政治意义较强的“官”。
- source_word: ὀνόματι Ἰάϊρος
  choice: 名叫睚鲁
  rationale: ὀνόματι 是介绍姓名的惯用表达；“名叫”简洁自然。“睚鲁”采用中文圣经传统中广为人知的译名。
- source_word: ἰδὼν αὐτὸν
  choice: 他一看见耶稣
  rationale: 不定过去时分词表示与随后动作紧密相连的先行动作；“一……就……”自然呈现这种紧接关系。将代词明确为“耶稣”，可避免连续多个“他”造成指代含混。
- source_word: πίπτει πρὸς τοὺς πόδας αὐτοῦ
  choice: 就俯伏在他脚前
  rationale: πίπτει 同为历史现在时；“俯伏”表现身体伏下的动作，πρὸς τοὺς πόδας αὐτοῦ 在此自然译为“在他脚前”，保留恳求、敬畏等可能含义，而不直接解释为敬拜。
theological_decisions:
- issue: 睚鲁在耶稣面前所作动作的性质
  choice: 俯伏在他脚前
  alternative: 敬拜他；跪在他面前
  rationale: 希腊文只直接描述他倒伏在耶稣脚前的身体动作；这可能表达敬畏、迫切恳求或尊崇，却未明确使用“敬拜”一词。“俯伏”保留这一神学与叙事张力，也比“跪下”更贴近 πίπτει。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。句首“有一个”自然引入人物；以分号连接人物来到与俯伏两个连续动作。未为历史现在时增设脚注，因为现代汉语动词本身不强制标示过去或现在，正文已能自然保留其叙事鲜活感。
