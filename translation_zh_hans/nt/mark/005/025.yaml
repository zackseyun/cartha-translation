lexical_decisions:
- source_word: καὶ
  choice: 有一个
  rationale: 希腊文以连接词承接叙事并引入新人物；汉语用“有一个女人”自然进入场景，无须生硬译出“和”。
- source_word: γυνὴ
  choice: 一个女人
  rationale: 无冠词名词在此引入新的叙事人物，译为“一个女人”符合现代汉语习惯。
- source_word: οὖσα
  choice: 患……已经……了
  rationale: 分词表示持续存在的状况，结合十二年的时间长度，用“患……已经……了”自然呈现其延续性。
- source_word: ἐν ῥύσει αἵματος
  choice: 患血漏
  rationale: 该短语描述处于持续出血的病况。“血漏”简洁、庄重，并保留原文名词性病症表达；具体医学性质原文未作进一步界定。
- source_word: ῥύσει
  choice: 漏
  rationale: ῥύσις指流出或排出；“漏”在“血漏”中保留持续流血的意象。
- source_word: αἵματος
  choice: 血
  rationale: 直接对应表示血的属格名词，与ῥύσις构成“血的流出”。
- source_word: δώδεκα ἔτη
  choice: 已经十二年
  rationale: 宾格表示时间延续；现代汉语以“已经十二年”明确持续时长。
