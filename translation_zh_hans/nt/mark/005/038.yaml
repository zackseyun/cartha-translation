  text: And they come to the house of the synagogue leader[a], and he sees a commotion, and people weeping and wailing loudly.
translation:
  language: zh_hans
  text: 他们来到会堂主管的家。耶稣看见一片喧闹[a]：人们哭泣，大声哀号。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“骚动”；希腊词可指嘈杂混乱或骚动。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχονται
  choice: 他们来到
  rationale: 保留叙事性现在时所带来的现场感；现代汉语叙事中用“来到”自然地表达一行人抵达并进入这一场景。
- source_word: οἶκον
  choice: 家
  rationale: 此处指会堂主管的住所；中文“家”比“房屋”更自然，且不额外增添原文没有的情感含义。
- source_word: ἀρχισυναγώγου
  choice: 会堂主管
  rationale: 表示负责或主持犹太会堂事务的人；“会堂主管”现代、清楚，也避免“管会堂的”等较旧表达。
- source_word: θεωρεῖ
  choice: 耶稣看见
  rationale: 希腊文为单数动词，按上下文主语是耶稣；中文明说姓名可避免与前句复数主语“他们”产生歧义。
- source_word: θόρυβον
  choice: 一片喧闹
  rationale: 该词不只表示声音，也可指嘈杂骚动；“一片喧闹”自然呈现哀悼现场的嘈杂情形，同时以脚注保留“骚乱”的可能。
- source_word: κλαίοντας
  choice: 有人哭泣
  rationale: 分词在此描写现场的人群；补出“有人”符合现代汉语表达，并保留其持续哭泣的动作。
- source_word: ἀλαλάζοντας
  choice: 有人……哀号
  rationale: 该词指在哀悼中放声哭喊；“哀号”准确传达强烈而有声的悲恸。
- source_word: πολλά
  choice: 大声
  rationale: πολλά在此作程度或方式上的加强语，修饰哀号；译作“大声”比直译“很多”更符合现代汉语，也贴合语境。
