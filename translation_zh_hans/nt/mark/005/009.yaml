  yaml_path: translation/nt/mark/005/009.yaml
  text: And he was asking him, “What is your name?” And he says to him, “My name is Legion,[a] because we are many.”
translation:
  language: zh_hans
  text: 耶稣一直问他：“你叫什么名字？”他对耶稣说：“我名叫‘军团’[a]，因为我们很多。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “军团”是从拉丁语借入希腊语的罗马军事术语，指一支规模很大的罗马部队；这里用作所报的名字，并暗示为数众多。
    reason: cultural_note
lexical_decisions:
- source_word: ἐπηρώτα
  choice: 一直问
  rationale: 未完成时表示过去持续或反复进行的动作；“一直问”在现代汉语中自然地保留这一体貌，不把它简化为一次性的“问”。
- source_word: Τί ὄνομά σοι
  choice: 你叫什么名字？
  rationale: 这是希腊语“名字”加与格代词结构的自然汉语表达，直接而不生硬。
- source_word: λέγει αὐτῷ
  choice: 他对耶稣说
  rationale: λέγει 是叙事性现在时；汉语叙事通常用不标时态的“说”即可保持现场感。补明“耶稣”可清楚区分此处两个阳性代词所指，避免汉语连续使用“他”造成歧义。
- source_word: Λεγιών
  choice: 军团
  rationale: 该词是从拉丁语借入希腊语的罗马军事术语，在此作为所报出的名字或称号。“军团”既传达其词义，又由引号标明其名称功能。
- source_word: ὄνομά μοι
  choice: 我名叫
  rationale: 自然对应希腊语以与格代词表达姓名归属的结构，并保留单数第一人称的自我指称。
- source_word: ὅτι πολλοί ἐσμεν
  choice: 因为我们数量众多
  rationale: ὅτι 在此说明如此命名的原因；“我们”严格保留第一人称复数，“数量众多”自然传达 πολλοί 的群体性含义。
theological_decisions:
- issue: 说话者由单数自称转为复数自称
  choice: 保留“我名叫‘军团’”与“我们数量众多”之间的转换
  alternative: 改成“我们名叫‘军团’”，使前后人称一致
  rationale: 原文先用单数 μοι，随后用复数 ἐσμεν，形成显著张力；译文不应替原文消解这一个体发言与群体身份之间的转换。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。用“一直问”体现未完成时，用引号表明“军团”在此是名字。为消除汉语代词指向不明，将第二个 αὐτῷ 明示为“耶稣”，不增加新的解释性内容。
