  text: καὶ ⸂ἐξελθόντος αὐτοῦ⸃ ἐκ τοῦ πλοίου ⸂εὐθὺς ὑπήντησεν⸃ αὐτῷ ἐκ τῶν μνημείων ἄνθρωπος ἐν πνεύματι ἀκαθάρτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/002.yaml
  text: And when he got out of the boat[a], immediately a man with an unclean spirit came out from the tombs to meet him,
translation:
  language: zh_hans
  text: 耶稣从船上下来，立刻有一个身上有污灵的人[a]从坟墓中出来迎见他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“被污灵附身的人。”原文较直译为“身上有污灵的人”。
    reason: 说明ἐν πνεύματι ἀκαθάρτῳ所表达的与污灵相关的状态；“被污灵附身”是较具解释性的译法，正文保留较少诠释的表述。
lexical_decisions:
- source_word: ἐξελθόντος αὐτοῦ
  choice: 耶稣一下船
  rationale: 属格独立结构中的不定过去分词表达时间关系；按上下文明确“他”指耶稣。“一下船”自然简洁，并与下文“立刻”衔接。
- source_word: πλοίου
  choice: 船
  rationale: πλοῖον可指船只；在加利利湖的叙事场景中，“船”是现代汉语最自然的表达。
- source_word: εὐθὺς
  choice: 立刻
  rationale: 保留马可叙事中常见的紧迫、鲜明节奏。
- source_word: ὑπήντησεν αὐτῷ
  choice: 迎见他
  rationale: ὑπαντάω意为迎面遇见或前来相见；“迎见他”既表达朝向耶稣的动作，也避免额外说明其意图。
- source_word: ἐκ τῶν μνημείων
  choice: 从坟墓里出来
  rationale: μνημεῖον指坟墓或墓穴，复数形式译为集合意义的“坟墓”；结合介词ἐκ，表达从墓穴所在处出来。
- source_word: ἄνθρωπος
  choice: 一个……的人
  rationale: 此处指一名具体的男性；汉语“一个……的人”自然引入该人物。
- source_word: ἐν πνεύματι ἀκαθάρτῳ
  choice: 身有污灵
  rationale: 原文介词结构较直译为“在污灵里”，表示此人的状态或与污灵的关联。“身有污灵”在现代汉语中较自然，又不直接加入“附体”或“被鬼附”等更具解释性的措辞。
theological_decisions:
- issue: 如何表达污灵所造成的状态
  choice: 身有污灵
  alternative: 被污灵附着
  rationale: 原文ἐν πνεύματι ἀκαθάρτῳ并未采用明确表示“占有”或“附体”的动词。“身有污灵”保留原文在关联方式上的含蓄；脚注提供较具解释性的译法，而不在正文中消除这一张力。
translation_notes:
  register: 采用自然、庄重而清楚的现代标准汉语。“一下船，立刻……”保留马可叙事的迅速节奏；“污灵”延续圣经语境中的术语感，同时普通读者仍可理解。脚注标记紧跟其实际所解释的“身有污灵的人”，而非置于“船”之后。
