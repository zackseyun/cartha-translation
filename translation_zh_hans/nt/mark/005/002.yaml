revisions:
- from: 耶稣一下船，立刻有一个身有污灵的人[a]从坟墓里出来迎见他。
  to: 耶稣从船上下来，立刻有一个身上有污灵的人[a]从坟墓中出来迎见他。
  rationale: 修订只处理汉语自然度和脚注的语义说明。“从船上下来”明确对应“从船中出来”；“身上有污灵”比“身有污灵”更符合现代标准汉语，同时不将原文未明说的附身机制直接写入正文。“坟墓中”在汉语中可作集合性地点用法，保留原文复数所指的墓地／墓穴区域。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T03:15:03Z'
review_pass:
  verdict: revise
  source_fidelity: 正文准确保留了耶稣离船后紧接发生的相遇、那人从坟墓区域出来、以及他与“污灵”的关联。应将“身有污灵”调整为更自然且仍不预断该关联性质的“身上有污灵”。
  naturalness: “耶稣一下船”与随后“立刻”相连略显语义重复，且“身有污灵的人”不符合现代标准汉语的常用搭配。改为“耶稣从船上下来，立刻……”和“身上有污灵的人”更流畅、庄重。
  terminology: “污灵”可保留，忠实对应πνεῦμα ἀκάθαρτον，也避免直接在正文采用“附身”这类较具解释性的表述。脚注可将“被污灵附身”作为可选解释性译法，并说明正文措辞较贴近原文。
  issues:
  - severity: medium
    issue: “身有污灵的人”措辞生硬
    rationale: 现代汉语通常说“身上有……的人”或采用更解释性的“被……附身的人”。前者既自然，又较好保留原文ἐν πνεύματι ἀκαθάρτῳ未明说“附身”的表达。
  - severity: low
    issue: “一下船，立刻”节奏略有重复
    rationale: “一下”本身可带有即时意味，和εὐθύς所译“立刻”并置略显堆叠。用“从船上下来，立刻”可分别清楚表达离船与紧随其后的动作。
  - severity: low
    issue: 脚注将原文称为“在污灵里的人”易造成汉语字面误解
    rationale: 介词ἐν的逐字对应虽可作“在……里”，但此处结构的自然语义更接近“有污灵在身／带着污灵”。脚注应避免把不自然的逐字汉语当作原文的实际意思。
