  text: διὰ τὸ αὐτὸν πολλάκις πέδαις καὶ ἁλύσεσι δεδέσθαι καὶ διεσπάσθαι ὑπ’ αὐτοῦ τὰς ἁλύσεις καὶ τὰς πέδας συντετρῖφθαι, καὶ οὐδεὶς ⸂ἴσχυεν αὐτὸν⸃ δαμάσαι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/004.yaml
  text: because he had often been bound with shackles and chains[a], and the chains had been torn apart by him and the shackles smashed to pieces, and no one was strong enough to subdue him.
translation:
  language: zh_hans
  text: 因为他屡次被人用脚镣和锁链捆绑，锁链竟被他挣断，脚镣也被他弄碎，谁也没有足够的力量制伏他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“驯服他。”希腊语这个动词既可指“驯服”，也可泛指“制伏、使其受控制”。
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὸ αὐτὸν
  choice: 因为……他
  rationale: διά加冠词化不定式表示原因；用“因为”自然承接上一节，说明无人能捆住他的缘故。
- source_word: πολλάκις
  choice: 屡次
  rationale: 准确表达多次发生，简洁而符合庄重的叙事语体。
- source_word: πέδαις / τὰς πέδας
  choice: 脚镣
  rationale: πέδη特指拘束双脚的刑具；“脚镣”既现代易懂，又能与一般性的锁链区分。
- source_word: ἁλύσεσι / τὰς ἁλύσεις
  choice: 锁链
  rationale: ἅλυσις指链条；译作“锁链”，保留原文两种拘束器具的区别。
- source_word: δεδέσθαι
  choice: 捆住
  rationale: δέω的完成时不定式描述以往反复捆绑所造成的状态；汉语以“屡次用……捆住”自然表达。
- source_word: διεσπάσθαι ὑπ’ αὐτοῦ
  choice: 他却挣断
  rationale: διασπάω表示用力扯开或断开；主动化为“他挣断”符合现代汉语，也保留ὑπό所标明的施事者。
- source_word: συντετρῖφθαι
  choice: 砸碎
  rationale: συντρίβω表示打碎、压碎；“砸碎”生动体现脚镣被破坏成碎片的强烈程度。
- source_word: οὐδεὶς ἴσχυεν αὐτὸν
  choice: 谁也没有力气
  rationale: ἰσχύω侧重力量而非单纯能力；此译保留“没有足够力量”的语义。
- source_word: δαμάσαι
  choice: 制伏
  rationale: δαμάζω可指驯服，也可广义指制伏、控制；在拘束失效的语境中，“制伏”最自然，且避免令人误以为是在训练动物。
theological_decisions:
- issue: 这人的状况与非凡力量的性质
  choice: 仅描述人们反复拘束失败以及无人有力制伏他的事实
  alternative: 以“谁也不能驯服他”等措辞更突出超常或邪灵性的力量
  rationale: 本节希腊文强调拘束失败和力量不足，却没有在句内重新说明其力量的来源；译文让上下文交代邪灵背景，不额外加入神学解释。
- issue: δαμάσαι所含“驯服／制伏”的张力
  choice: 正文译为“制伏”，脚注保留“驯服”这一可能意义
  alternative: 正文直译为“驯服”
  rationale: “制伏”最切合以脚镣和锁链拘束人的场景；脚注保留词语较窄的“驯服”义，避免抹平原词的语义范围。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语体。“脚镣／锁链”保留两种拘束器具，“挣断／砸碎”再现两个不同而有力度的动作。脚注标记置于其所解释的“制伏他”之后。
