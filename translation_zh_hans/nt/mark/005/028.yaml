  text: ἔλεγεν γὰρ ὅτι ⸂Ἐὰν ἅψωμαι κἂν τῶν ἱματίων αὐτοῦ⸃ σωθήσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/028.yaml
  text: For she was saying[a], "If I touch even his garments, I will be healed."
translation:
  language: zh_hans
  text: 因为她一直说：“哪怕只摸到他的衣裳，我也会痊愈[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译“我就会得救”。这个动词可以表示“得救”“痊愈”或“恢复健康”；这里的语境主要指身体得医治。
    reason: 保留 σωθήσομαι 在医治与拯救之间的词义范围及神学张力。
lexical_decisions:
- source_word: ἔλεγεν
  choice: 一直在想
  rationale: 未完成时表达过去持续或反复的活动；上下文没有明确她是否出声，因此用“想”自然地保留内心言说的可能，避免断定她是在公开说话。
- source_word: γὰρ
  choice: 因为
  rationale: 说明她此前采取行动的原因，与上文形成自然的因果衔接。
- source_word: ὅτι
  choice: 以直接引语表达
  rationale: 该词引出她所说或所想的内容；现代汉语用引号最自然。
- source_word: ἐὰν ἅψωμαι
  choice: 只要摸到
  rationale: 表达她所设想的条件；“摸到”准确传达接触之意，“只要”也与随后 κἂν 的最低条件语气共同构成自然汉语。
- source_word: κἂν
  choice: 只要
  rationale: 此处带有“哪怕只是、即使仅仅”的最低限度强调；汉语“只要……就……”简洁地传达这一重点。
- source_word: τῶν ἱματίων αὐτοῦ
  choice: 他的衣裳
  rationale: ἱμάτια 为复数，泛指衣物；“衣裳”庄重而通俗，不像“外衣”那样过度具体。
- source_word: σωθήσομαι
  choice: 就会痊愈
  rationale: 在血漏得医治的直接语境中指身体恢复健康；“痊愈”自然明确，同时以脚注保留该动词也可表示“得救”的语义张力。
theological_decisions:
- issue: 医治叙事中 σωθήσομαι 的译法
  choice: 就会痊愈
  alternative: 就会得救／就会好起来
  rationale: 当前语境明确指妇人的身体疾病得医治，因此正文采用“痊愈”；但原词兼有“拯救、得救”之义，可能保留医治与拯救之间的语义重叠，故不在正文中强行展开，而在脚注说明。
- issue: ἔλεγεν 是出声说还是心里想
  choice: 一直在想
  alternative: 一直说／反复说
  rationale: 希腊文仅表明持续或反复地“说”，本节并未明确声音是否可闻；结合叙事场景，“一直在想”是自然汉语，但不把内容解释为公开宣告。
translation_notes:
  register: 采用现代、庄重而通俗的叙事语言。“衣裳”比“衣服”略庄重，又不至于古奥；“只要……就……”自然呈现妇人确信最低限度的接触便足够。
