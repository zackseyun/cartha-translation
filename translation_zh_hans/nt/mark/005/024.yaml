  text: καὶ ἀπῆλθεν μετ’ αὐτοῦ. Καὶ ἠκολούθει αὐτῷ ὄχλος πολύς, καὶ συνέθλιβον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/024.yaml
  text: And he went with him[a]. And a large crowd was following him and pressing around him.
translation:
  language: zh_hans
  text: 耶稣就和他一同去了。有一大群人跟着耶稣，紧紧地挤着他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“挤压着他”或“在他周围挤作一团”。希腊文动词描写人群紧紧挤压耶稣。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: 去了
  rationale: 此处不定过去时叙述耶稣回应睚鲁后随即前往；“去了”自然简洁，也不含“离去”可能带出的疏离意味。
- source_word: μετ’ αὐτοῦ
  choice: 和他一同
  rationale: μετά加属格表示陪同；“和他一同”准确表达耶稣与睚鲁同行。
- source_word: ἠκολούθει
  choice: 跟着
  rationale: 未完成时表示持续进行的动作；汉语“跟着”在叙事语境中自然表达一路随行。
- source_word: ὄχλος πολύς
  choice: 一大群人
  rationale: 兼顾ὄχλος的群体含义与πολύς所强调的人数众多，符合现代汉语习惯。
- source_word: συνέθλιβον
  choice: 拥挤着
  rationale: 该动词表示从四周挤压、挤在一起；“拥挤着”保留实际的身体挤压感，同时不夸大为造成伤害。
- source_word: αὐτόν
  choice: 他
  rationale: 代词所指为耶稣；正文前句明确使用“耶稣”，此处以“他”承接自然。
theological_decisions: []
