  yaml_path: translation/nt/mark/005/008.yaml
  text: For he was saying to him[a], “Come out of the man, unclean spirit.”
translation:
  language: zh_hans
  text: 原来他正对他说[a]：“不洁的灵啊，从这人里面出来！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他”在叙事中指那人；引号内的命令则直接对附在他身上的不洁之灵发出。“出来”也可译作“出去”。
    reason: 说明代词在叙事框架中的受话者与命令直接针对的对象，并保留Ἔξελθε的自然译法差异。
lexical_decisions:
- source_word: ἔλεγεν
  choice: 一直对他说
  rationale: 未完成时描写过去正在持续或反复进行的言说；“一直……说”比单纯的“说了”更能保留这一叙事背景。
- source_word: γὰρ
  choice: 原来
  rationale: γάρ在这里补充说明上一节所述情形的原因或背景；“原来”在现代汉语叙事中自然地表达这种解释关系。
- source_word: αὐτῷ
  choice: 对他说
  rationale: 保留阳性单数代词的表达，不擅自判定这里具体指那人还是附在他身上的污灵；汉语的“他”也能保留上下文中的指涉张力。
- source_word: Ἔξελθε
  choice: 出来
  rationale: 不定过去时命令语气表达直接命令；与“从这人里面”搭配时，“出来”自然地呈现从人里面离开的动作。
- source_word: τὸ πνεῦμα τὸ ἀκάθαρτον
  choice: 不洁的灵啊
  rationale: 直译其“不洁”含义，不以较解释性的“邪灵”取代；原文虽使用带冠词的主格形式，但在此命令句中发挥呼语作用，汉语用“啊”清楚体现直接称呼。
- source_word: ἐκ τοῦ ἀνθρώπου
  choice: 从这人里面
  rationale: ἐκ表示从内部出来；上下文指特定的男子，“这人”在汉语中自然明确，“里面”则保留空间方向。
theological_decisions:
- issue: πνεῦμα ἀκάθαρτον在赶鬼语境中的译法
  choice: 不洁的灵
  alternative: 邪灵
  rationale: 原文明确使用“不洁”而非泛指“邪恶”；主文保留其礼仪和道德层面的不洁意涵，避免以解释性较强的“邪灵”缩窄表达。
- issue: αὐτῷ所指对象
  choice: 以“他”保留原文代词
  alternative: 明确译作“那人”或“那污灵”
  rationale: 命令直接针对不洁的灵，但叙事中的外在受话者也是被附之人；原文代词本身未在本节重新点明对象，因此不在译文中强行消除这种指涉张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“原来”承接上文并引出解释；“不洁的灵啊”既忠于原词，也自然体现呼语。
