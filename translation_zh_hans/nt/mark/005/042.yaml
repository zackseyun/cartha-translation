  text: καὶ ⸀εὐθὺς ἀνέστη τὸ κοράσιον καὶ περιεπάτει, ἦν γὰρ ἐτῶν δώδεκα. καὶ ἐξέστησαν ⸁εὐθὺς ἐκστάσει μεγάλῃ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/042.yaml
  text: And immediately the girl stood up and began walking[a], for she was twelve years old[b]. And immediately they were overcome with great amazement.
translation:
  language: zh_hans
  text: 那女孩立刻站起来，走动起来；她那时十二岁。他们立刻大为惊奇[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 原文以同源的动词和名词构成加强表达，表示他们极其惊奇。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: 立刻／顿时
  rationale: 保留马可叙事中鲜明的即时感；根据上下文分别用“立刻”和“顿时”，使现代汉语自然流畅。
- source_word: ἀνέστη
  choice: 站了起来
  rationale: 这里直接描写女孩在耶稣吩咐之后起身；“站了起来”既自然，也不把该动词本身过度限定为复活术语。
- source_word: τὸ κοράσιον
  choice: 女孩
  rationale: κοράσιον指女孩；本节随后明确交代她十二岁，无须在正文中另加“小”或“年幼的”。
- source_word: περιεπάτει
  choice: 开始走动
  rationale: 未完成时描绘起身之后持续可见的行走动作；“开始走动”在汉语中自然地表达动作的起始与延续。
- source_word: ἦν γὰρ ἐτῶν δώδεκα
  choice: 她原来已经十二岁了
  rationale: γάρ说明她能起身走动的年龄背景；“原来”体现解释关系，“已经十二岁了”符合现代汉语年龄表达。
- source_word: ἐξέστησαν
  choice: 惊讶
  rationale: 此处表示因所见之事而极度震惊；与后面的同源名词合译为自然的汉语强势表达。
- source_word: ἐκστάσει μεγάλῃ
  choice: 万分
  rationale: 与ἐξέστησαν构成同源加强表达；“惊讶万分”既保留强烈程度，又避免生硬重复或容易误解的“狂喜”。
theological_decisions:
- issue: ἀνέστη可能带有复活语感
  choice: 正文译作“站了起来”
  alternative: “起来了”或“复起”
  rationale: 上下文确实是从死亡中恢复生命，但该动词本身在这里也直接表示起身。译文呈现事件，却不让单个动词承担超过原文的教义限定。
- issue: 同源表达ἐξέστησαν ἐκστάσει μεγάλῃ的强度
  choice: 译作“惊讶万分”
  alternative: “大大地惊讶”或“惊讶得出神”
  rationale: 原文以同源动词和名词强化震惊；汉语用程度补语自然传达强度，同时在脚注保留其形式特色。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“走动”比单纯“走路”更能体现女孩起身后持续行动；“众人”补明复数主语，但不具体限定在场者身份。脚注标记均放在其所说明的正文语句之后。
