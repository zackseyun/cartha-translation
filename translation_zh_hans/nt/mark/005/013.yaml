id: MRK.5.13
reference: Mark 5:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἐπέτρεψεν ⸀αὐτοῖς. καὶ ἐξελθόντα τὰ πνεύματα τὰ ἀκάθαρτα εἰσῆλθον εἰς τοὺς χοίρους, καὶ ὥρμησεν ἡ ἀγέλη κατὰ τοῦ κρημνοῦ εἰς τὴν θάλασσαν, ⸀ὡς δισχίλιοι, καὶ ἐπνίγοντο ἐν τῇ θαλάσσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/013.yaml
  text: And he permitted them[a]. Then the unclean spirits came out and entered the pigs, and the herd—about two thousand—rushed down the steep bank into the sea[b], and they drowned in the sea.
translation:
  language: zh_hans
  text: 他就准许了它们。污灵便出来，进入猪群；那群猪约有两千头，沿着陡坡[a]猛冲进海里[b]，淹死在海中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“沿着陡岸”或“冲下悬崖”；希腊词可指陡峭的斜坡、岸坡或峭壁。
    reason: lexical_alternative
  - marker: b
    text: 希腊文直译为“海”；这里指加利利海。
    reason: cultural_note
lexical_decisions:
- source_word: ἐπέτρεψεν αὐτοῖς
  choice: 他就准许了它们
  rationale: ἐπιτρέπω表示准许、允许；“准许”简洁庄重。“它们”在上下文中指请求进入猪群的污灵，不在译文中另加解释。
- source_word: τὰ πνεύματα τὰ ἀκάθαρτα
  choice: 污灵
  rationale: “污灵”保留ἀκάθαρτος所含的不洁意涵，也保留πνεύματα所指的灵界存在；在现代中文中简洁自然。
- source_word: ἐξελθόντα ... εἰσῆλθον εἰς τοὺς χοίρους
  choice: 出来，进入猪群
  rationale: 按希腊文的动作次序表达污灵离开原来的对象并进入猪群；“猪群”符合中文叙事习惯。
- source_word: ὥρμησεν ἡ ἀγέλη
  choice: 那群猪……猛冲
  rationale: ὁρμάω表示突然而猛烈地冲去；“猛冲”准确传达动作力度，不额外引入“受惊狂奔”等原因。
- source_word: κατὰ τοῦ κρημνοῦ
  choice: 沿着陡坡
  rationale: κρημνός可指陡坡、陡岸或悬崖；“陡坡”不把地形过度限定为垂直悬崖，并以脚注保留其他可能。
- source_word: εἰς τὴν θάλασσαν
  choice: 进海里
  rationale: 依原文保留θάλασσα的“海”，不在正文中改为“湖”；脚注说明此处的地理所指。
- source_word: ὡς δισχίλιοι
  choice: 约有两千头
  rationale: ὡς置于数词前表示约数；中文以量词“头”自然地数算猪。
- source_word: ἐπνίγοντο ἐν τῇ θαλάσσῃ
  choice: 淹死在海中
  rationale: 未完成时在叙事中描写猪群在海中溺亡；“淹死”自然表达结果，同时不添加外在施事者。
theological_decisions:
- issue: “它们”的所指
  choice: 按紧邻上下文理解为污灵
  alternative: 在正文中明确译作“污灵”或“邪灵”
  rationale: 原文保留代词αὐτοῖς；中文也保留代词，避免把上下文信息重复写进正文。
- issue: τὰ πνεύματα τὰ ἀκάθαρτα的表达
  choice: 保留为具有行动能力的“污灵”
  alternative: 译作非人格化的“邪恶力量”
  rationale: 经文叙事把这些灵描写为请求许可、出来并进入猪群的行动者；保留“灵”忠实于原文，又不扩展经文本身未说明的灵界理论。
- issue: 溺亡动词是否暗示外在施事者
  choice: 译为不及物的“淹死”
  alternative: 译为“被淹死”
  rationale: ἐπνίγοντο虽为中间/被动形式，但此处可自然表示溺亡；中文“淹死”避免无根据地暗示某个外在施事者。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“便”和分号使连续动作清楚流畅；保留原文两次提到“海”的重复，并将两个脚注标记放在各自所说明的词语之后。
