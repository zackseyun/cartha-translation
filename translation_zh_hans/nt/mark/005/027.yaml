  text: ⸀ἀκούσασα περὶ τοῦ Ἰησοῦ, ἐλθοῦσα ἐν τῷ ὄχλῳ ὄπισθεν ἥψατο τοῦ ἱματίου αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/027.yaml
  text: having heard about Jesus[a], she came up behind him in the crowd and touched his garment.
translation:
  language: zh_hans
  text: 她听说了耶稣的事，就在人群中从后面走近他，摸了他的衣服[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“外衣”或“衣裳”。希腊语 ἱμάτιον 泛指衣服，也常指穿在外面的衣物。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσασα περὶ τοῦ Ἰησοῦ
  choice: 她听说了耶稣的事
  rationale: 不定过去时分词表示先于主要动作发生的事；用“听说了……的事”自然表达 περί 加属格“有关、关于”的含义，同时保留动作先后。
- source_word: ἐλθοῦσα ἐν τῷ ὄχλῳ ὄπισθεν
  choice: 就在 人群中从后面走近他
  rationale: ἐλθοῦσα 表示她来到、走近；ἐν τῷ ὄχλῳ 指身处人群中，ὄπισθεν 指从后面。中文补出语境中明确的宾语“他”，使方位关系清楚。
- source_word: ἥψατο
  choice: 摸了
  rationale: 这里的关身语态不定过去时形式表示触碰；“摸了”符合叙事情境，又不强化为抓住或紧握。
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: 他的衣服
  rationale: ἱμάτιον 可泛指衣服，也常指外衣；“衣服”是现代汉语中自然、宽泛的表达，不额外限定具体款式。
theological_decisions: []
