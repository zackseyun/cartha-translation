  text: καὶ ⸀παρακαλεῖ αὐτὸν πολλὰ λέγων ὅτι Τὸ θυγάτριόν μου ἐσχάτως ἔχει, ἵνα ἐλθὼν ἐπιθῇς ⸂τὰς χεῖρας αὐτῇ⸃ ⸀ἵνα σωθῇ καὶ ⸀ζήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/023.yaml
  text: And he begged him earnestly[a], saying, “My little daughter is at the point of death. Come and lay your hands on her, so that she may be healed and live.”
translation:
  language: zh_hans
  text: 他苦苦恳求耶稣，说：“我的小女儿快要死了，求你来，把手按在她身上，好让她得救[a]，活下去。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “得救”或译“得医治”或“康复”。希腊语动词可指拯救、救助或医治；这里的直接语境是身体得医治。
    reason: 保留σωθῇ在本节中的语义宽度，并说明其语境意义。
lexical_decisions:
- source_word: παρακαλεῖ αὐτὸν πολλὰ
  choice: 再三恳求耶稣
  rationale: παρακαλέω在此表示迫切央求；πολλά加强恳求的程度，也可能含反复恳求之意。“再三恳求”自然地传达父亲的急切。根据上下文以“耶稣”明确代词所指。
- source_word: θυγάτριόν μου
  choice: 我的小女儿
  rationale: θυγάτριον是带有小称色彩的“女儿”，可体现年幼或亲昵；“小女儿”保留这种语气。
- source_word: ἐσχάτως ἔχει
  choice: 快要死了
  rationale: 该习语表示处于生命的最后关头。“快要死了”准确、自然，并传达情况紧急。
- source_word: ἐλθὼν ἐπιθῇς τὰς χεῖρας αὐτῇ
  choice: 求你来按手在她身上
  rationale: 虽然ἐλθών在形式上是分词，但在请求中与后面的动作连用，汉语自然表达为“来……”。“按手在她身上”保留医治行动的具体形象。
- source_word: σωθῇ
  choice: 得救
  rationale: σῴζω可表示拯救、救助或医治。正文用“得救”保留其较宽的词义及与其他经文的词汇联系；脚注说明本处按语境也可理解为“得医治”或“康复”。
- source_word: ζήσῃ
  choice: 活下去
  rationale: ζάω意为“活”。在濒死语境中，“活下去”清楚表达获救或得医治的结果。
theological_decisions:
- issue: 医治语境中σωθῇ的译法
  choice: 得救
  alternative: 得医治；康复
  rationale: 这里的直接语境是身体疾病和死亡危险，但原词σῴζω的语义范围也包括拯救、救助。正文保留“得救”，不把词义完全限定为医疗含义；脚注列出语境上很合适的其他译法，以保存原文的语义张力。
translation_notes:
  register: 采用现代、庄重而口语可懂的表达。“再三恳求”表现迫切感；“快要死了”比生硬的“到了末境”更自然。脚注标记紧随“得救”，与所解释的词准确对应。
