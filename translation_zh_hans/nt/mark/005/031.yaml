  text: καὶ ἔλεγον αὐτῷ οἱ μαθηταὶ αὐτοῦ· Βλέπεις τὸν ὄχλον συνθλίβοντά σε, καὶ λέγεις· Τίς μου ἥψατο;
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/031.yaml
  text: And his disciples were saying to him[a], “You see the crowd pressing in on you, and you say, ‘Who touched me?’”
translation:
  language: zh_hans
  text: 他的门徒对他说：“你看，人群正挤着你，你还问：‘谁碰了我？’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: 对他说
  rationale: 未完成时可表示当时正在发生的言说；汉语叙事中直接译作“对他说”自然流畅，不必机械加入“不断”或“正在”。
- source_word: μαθηταὶ
  choice: 门徒
  rationale: “门徒”是现代中文圣经语境中清楚而通行的称呼，兼具跟随者和受教者的关系含义。
- source_word: Βλέπεις
  choice: 你看
  rationale: 保留现在时的直接陈述，并以自然汉语表达门徒指向眼前明显情形的语气。
- source_word: ὄχλον
  choice: 人群
  rationale: 准确表达聚集的大批民众，现代、自然，不带古奥色彩。
- source_word: συνθλίβοντά
  choice: 正挤着
  rationale: 表达众人从周围贴近并造成身体挤压的动态；“挤着”比“压碎”克制，也比单纯“围着”更能体现原词的压力感。
- source_word: λέγεις
  choice: 你还问
  rationale: 原文直译为“你说”，但其后内容在汉语中是问句；“还问”自然传达门徒因眼前情形而产生的诧异和反问语气。
- source_word: Τίς μου ἥψατο
  choice: 谁碰了我？
  rationale: ἅπτομαι在此指一次具体的触碰；“碰了我”简洁自然，并保留上下文中普通拥挤与那次特殊触碰之间的张力。
- source_word: μου
  choice: 我
  rationale: 希腊语属格受ἥψατο支配，现代汉语自然处理为动词“碰”的宾语“我”。
theological_decisions: []
translation_notes:
  register: 采用现代、简洁而庄重的叙事口吻。以“你还问”体现καὶ在此连接中的语用推进和门徒的诧异；不额外说明耶稣为何询问，以保留叙事张力。
