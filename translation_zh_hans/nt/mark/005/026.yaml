  text: καὶ πολλὰ παθοῦσα ὑπὸ πολλῶν ἰατρῶν καὶ δαπανήσασα τὰ παρ’ αὐτῆς πάντα καὶ μηδὲν ὠφεληθεῖσα ἀλλὰ μᾶλλον εἰς τὸ χεῖρον ἐλθοῦσα,
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/026.yaml
  text: and after suffering much under many physicians[a], and after spending all that she had and benefiting nothing, but rather becoming worse[b],
translation:
  language: zh_hans
  text: 她经许多医生医治，受了许多苦[a]，又花光了自己所有的一切[b]，却毫无益处，反而更糟了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因许多医生而受了许多苦”，或“在许多医生的医治下受了许多苦”。希腊语可强调医生是使她受苦的施事者，也可强调她承受了他们的治疗。
    reason: lexical_alternative
  - marker: b
    text: 直译：她所有的一切，或她可支配的一切。
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλὰ παθοῦσα
  choice: 受了许多苦
  rationale: 保留πάσχω所表达的亲身受苦，以及πολλά所强调的程度；用现代汉语自然表达分词所交代的先行情形。
- source_word: ὑπὸ πολλῶν ἰατρῶν
  choice: 在许多医生手下
  rationale: ὑπό加属格可表示施事者，也可突出她处于众多医生诊治之下；正文采用简洁表达，并以脚注保留其中的语义幅度。
- source_word: δαπανήσασα
  choice: 花光了
  rationale: δαπανάω本身表示花费；结合后面的“所有的一切”，译作“花光了”自然地传达全部耗尽的结果，而不额外限定钱财的具体形式。
- source_word: τὰ παρ’ αὐτῆς πάντα
  choice: 自己所有的一切
  rationale: παρά短语指她所拥有或可支配的东西；该译法保留原文概括性的范围，不窄化为现金。
- source_word: μηδὲν ὠφεληθεῖσα
  choice: 一点也没有好转
  rationale: ὠφελέω的被动形式表示没有得到任何益处；在疾病语境中，“没有好转”清楚自然，同时保留治疗毫无成效之意。
- source_word: ἀλλὰ μᾶλλον
  choice: 反而
  rationale: 准确体现否定之后进一步加强的反向对比：不仅没有获益，结果还更坏。
- source_word: εἰς τὸ χεῖρον ἐλθοῦσα
  choice: 越来越严重
  rationale: 这是表示进入更坏状态的惯用结构；按疾病语境译为“越来越严重”，符合现代汉语，又不增添具体诊断。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以连续分句再现原文一连串分词所形成的累积推进，并用“却……反而……”清楚呈现毫无获益与病情恶化之间的强烈对照。
