  text: ⸂καὶ διηγήσαντο⸃ αὐτοῖς οἱ ἰδόντες πῶς ἐγένετο τῷ δαιμονιζομένῳ καὶ περὶ τῶν χοίρων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/016.yaml
  text: And those who had seen it told them how it had happened to the demon-possessed man[a], and about the pigs.
translation:
  language: zh_hans
  text: 看见的人向他们讲述了那被鬼附的人身上发生的事的经过，以及猪群的事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ διηγήσαντο
  choice: 都告诉了
  rationale: διηγέομαι指叙述、讲述事情的经过；“告诉了”符合现代汉语叙事语体，“都”自然承接并涵盖后面两项报告内容。
- source_word: οἱ ἰδόντες
  choice: 看见这事的人
  rationale: 保留带冠词分词所指的亲眼见证者；补出“这事”使汉语表达完整，但不使用解释性更强的“目击者”。
- source_word: πῶς ἐγένετο τῷ δαιμονιζομένῳ
  choice: 那被鬼附的人所遭遇的事
  rationale: πῶς ἐγένετο在此询及事情如何临到此人；“所遭遇的事”是自然汉语，并保留事件发生在此人身上的含义。δαιμονιζομένῳ译作“被鬼附的人”，清楚表达其受邪灵控制的状态。
- source_word: περὶ τῶν χοίρων
  choice: 以及猪群的事
  rationale: περί加属格表示“关于”；上下文涉及一群猪，因此汉语用“猪群”比单说“猪”更明确自然。
theological_decisions:
- issue: δαιμονιζομένῳ对邪灵侵扰状态的表达
  choice: 被鬼附的人
  alternative: 受鬼控制的人；被邪灵附身的人
  rationale: “被鬼附”是现代中文圣经语境中清楚而简洁的表达，承认马可叙事所呈现的真实邪灵活动，同时不进一步界定这种状态的机制或程度。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“所遭遇的事”避免生硬直译“怎样发生在……身上”；“猪群”依据上下文使复数所指清楚。
