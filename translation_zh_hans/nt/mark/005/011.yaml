    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ
  choice: 有
  rationale: ἦν表达存在，译为“有”自然准确；δέ是轻微的叙事连接词，汉语在此无需另加“那时”或“而”。
- source_word: ἐκεῖ
  choice: 在那里
  rationale: 直接表达地点，与上下文所指之处相应。
- source_word: πρὸς τῷ ὄρει
  choice: 靠近山边
  rationale: πρός加与格在此表示临近、在旁；“靠近山边”保留空间关系，又不把位置说得过于精确。
- source_word: ἀγέλη
  choice: 群
  rationale: 指成群的动物；与量词“大”及“猪”组合为“一大群猪”，符合现代汉语习惯。
- source_word: χοίρων
  choice: 猪
  rationale: χοῖρος指猪；现代汉语用“猪”最直接自然。
- source_word: μεγάλη
  choice: 一大群
  rationale: 修饰猪群的规模或数量，汉语自然表达为“一大群”。
- source_word: βοσκομένη
  choice: 正在吃食
  rationale: 现在分词描写猪群当时进食的状态；“吃食”比“吃草”范围更宽，避免加入原文没有限定的食物种类。
