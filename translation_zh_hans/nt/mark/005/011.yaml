  text: 在那里，山附近有一大群猪正在进食[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在山旁”。希腊语短语πρὸς τῷ ὄρει表示在山附近或山旁。
    reason: lexical_alternative
  - marker: b
