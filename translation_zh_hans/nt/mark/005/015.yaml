revisions:
- from: 他们来到耶稣那里，看见那被鬼附过的人坐着，穿上了衣服，神志清醒，就是从前被“群”附着的那个人[a]，他们就害怕。
  to: 他们来到耶稣那里，看见那曾被鬼附身的人坐着，穿着衣服，神志清醒，就是从前被“军团”附身的那个人；他们就害怕了。
  rationale: 修订以“军团”恢复λεγιών的词义和上下文回指，并用引号及脚注保留其可能为名称性称谓的开放性；同时将“附着”改为自然准确的“附身”，并将“穿上了衣服”调整为描述可见状态的“穿着衣服”。未引入任何额外的神学或解释性判断。
