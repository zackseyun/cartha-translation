  text: καὶ ἔρχονται πρὸς τὸν Ἰησοῦν, καὶ θεωροῦσιν τὸν δαιμονιζόμενον ⸀καθήμενον ἱματισμένον καὶ σωφρονοῦντα, τὸν ἐσχηκότα τὸν ⸀λεγιῶνα, καὶ ἐφοβήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/015.yaml
  text: And they came to Jesus and saw the demon-possessed man sitting there[b][a], clothed and in his right mind—the one who had the legion—and they were afraid.
translation:
  language: zh_hans
  text: 他们来到耶稣那里，看见那曾被鬼附身的人坐着，穿着衣服，神志清醒，就是从前被“军团”附身的那个人；他们就害怕了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρχονται
  choice: 他们来到
  rationale: 希腊文用叙事性现在时；现代汉语叙事无需机械标示时态，“来到”自然表达事件推进。
- source_word: θεωροῦσιν
  choice: 看见
  rationale: 此处也是叙事性现在时，表示他们亲眼见到那人的状态；“看见”自然且不增加“仔细观察”等原文未明说的意味。
- source_word: δαιμονιζόμενον
  choice: 那被鬼附过的人
  rationale: 分词在此名词化，指上下文中那位受鬼控制的人；因他此时已经恢复，“附过”既保留真实的邪灵侵扰，也避免误示仍在被附。
- source_word: καθήμενον
  choice: 坐着
  rationale: 直接呈现他们眼前所见的姿态，不额外加入希腊文没有的方位副词。
- source_word: ἱματισμένον
  choice: 穿上了衣服
  rationale: 表达他已经有衣服遮身的恢复状态，并与此前赤身的处境形成自然对照。
- source_word: σωφρονοῦντα
  choice: 神志清醒
  rationale: σωφρονέω在这里表示心智恢复正常、能够自持；“神志清醒”通俗庄重，也不把叙述缩减为现代临床诊断。
- source_word: ἐσχηκότα
  choice: 从前被……附着的
  rationale: 完成时分词回指先前状态，并以该经历辨认此人；“从前”清楚表明这种状态现已过去，同时保留其与当前场景的关联。
- source_word: λεγιῶνα
  choice: “群”
  rationale: 该词回指5:9中众鬼的自称，既可视作名称，也带有罗马军团及数量众多的含义；正文用引号标出称谓，并以脚注保留音译方案。
- source_word: ἐφοβήθησαν
  choice: 他们就害怕
  rationale: 自然表达不定过去时所叙述的即时反应；“就”体现他们见到这一景象后的反应而不夸大强度。
theological_decisions:
- issue: 邪灵侵扰的描述
  choice: 那被鬼附过的人
  alternative: 那曾受污灵控制的人
  rationale: 译文保留叙事所陈述的真实鬼附，不将其弱化为单纯疾病；同时用“过”表明他如今已获释放。
- issue: λεγιών是称谓、名称还是普通名词
  choice: “群”
  alternative: “军团”（音译“利群”）
  rationale: 上下文说明此称谓与鬼的数量众多有关，但原词也明确借用罗马军团用语。正文采用简洁、可理解的“群”，脚注说明直译和音译，以免将其性质单一化。
- issue: ἐσχηκότα所表达的时间关系
  choice: 从前被“群”附着的
  alternative: 被“群”附着过的
  rationale: 完成时分词以先前且已结束的状态来辨认此人。“从前”在汉语中清楚自然，又不暗示邪灵仍附在他身上。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。句子保留原文连续列举所见状态及最后恐惧反应的结构，但适度加入“从前”以在汉语中明确已结束的鬼附状态；避免古雅的“正襟危坐”“心智健全”等不自然表达。
