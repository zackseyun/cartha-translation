review_pass:
  verdict: revise
  source_fidelity: 译文基本保留了叙事顺序、人物所见的三项状态及众人的恐惧反应，也正确将此人辨认为先前受邪灵辖制者。但“群”未充分表达λεγιών所借用的“军团”一词；“利群”并非可靠或合宜的音译，且容易造成无关联想。“附着”用于鬼附语境不自然，应改为“附身”。
  naturalness: “穿上了衣服”较强调穿衣动作，原文所描写的是当时已穿着衣服的状态；“穿着衣服”更自然贴切。“神志清醒”庄重自然。以分号分隔最后的反应，可避免原译逗号连接过长。
  terminology: 建议一致使用“被鬼附身／被‘军团’附身”，忠实呈现δαιμονιζόμενον及上下文的λεγιών。将λεγιών译为“军团”保留其普通词义及可能作为自称的称谓性质；引号和脚注足以保留名称性歧义，无须采用不规范音译。
  issues:
  - severity: medium
    issue: “群”弱化了λεγιών的具体“军团”意象，脚注所列“利群”音译不合宜。
    rationale: λεγιών是借自拉丁语legio的“军团”，并回指5:9的自称。译作“军团”可保留该词的语义；“利群”在现代汉语中有强烈的既有商业词联想，且不是稳妥的译名。
  - severity: medium
    issue: “被‘群’附着”搭配不自然。
    rationale: 现代汉语中描述鬼附通常说“被鬼附身”；“附着”多用于物体黏附或一般依附关系，不能准确、自然地表达原文语境。
  - severity: low
    issue: “穿上了衣服”偏向动作而非可见状态。
    rationale: ἱματισμένον描述此人被看见时已穿着衣服的状态；“穿着衣服”更直接。
  revised_text: 他们来到耶稣那里，看见那曾被鬼附身的人坐着，穿着衣服，神志清醒，就是从前被“军团”附身的那个人；他们就害怕了。
  revised_footnotes:
