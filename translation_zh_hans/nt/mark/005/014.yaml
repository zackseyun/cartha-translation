  text: ⸂Καὶ οἱ⸃ βόσκοντες ⸀αὐτοὺς ἔφυγον καὶ ⸀ἀπήγγειλαν εἰς τὴν πόλιν καὶ εἰς τοὺς ἀγρούς· καὶ ⸀ἦλθον ἰδεῖν τί ἐστιν τὸ γεγονός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/014.yaml
  text: And those who were tending them fled and reported it in the city and in the countryside[a], and they came to see what had happened.
translation:
  language: zh_hans
  text: 放猪的人逃走了，把这事传到城里和乡间[a]；人们就来看看发生了什么事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“田野”。这里的希腊词可以按字面这样翻译，但与“城里”相对时，很可能指城外的乡村地区。
    reason: lexical_alternative
lexical_decisions:
- source_word: βόσκοντες
  choice: 放猪的人
  rationale: 该分词指照管上一节所述猪群的人；结合明确语境译作“放猪的人”，比泛称“照管它们的人”更自然，也不改变所指。
- source_word: αὐτούς
  choice: 猪（融入“放猪的人”）
  rationale: 代词指上一节的猪群。汉语用“放猪的人”自然地合并了动作与宾语，避免“照管它们的人”显得生硬。
- source_word: ἔφυγον
  choice: 逃走了
  rationale: 准确表现突然逃离的叙事动作；“逃走”在现代汉语中自然且有力度。
- source_word: ἀπήγγειλαν
  choice: 把这事传到
  rationale: 该动词表示报告、传报消息；“把这事传到”既说明所传的是刚发生的事，也能自然连接两个地点。
- source_word: εἰς τὴν πόλιν
  choice: 到城里
  rationale: εἰς本有“到、进入”之意；与“传到”搭配，既贴近希腊文方向性，也符合汉语表达。
- source_word: εἰς τοὺς ἀγρούς
  choice: 到乡间
  rationale: ἀγροί可指田地，也可在与城市对举时指周围乡村地区；“乡间”在此更符合语境，同时以脚注保留字面可能。
- source_word: ἦλθον
  choice: 人们就来
  rationale: 希腊文主语隐含在第三人称复数动词中，所指是听见消息后前来的人；汉语补出泛指的“人们”可避免与最近的“放猪的人”误相指，并未限定其具体身份。
- source_word: ἰδεῖν
  choice: 来看看
  rationale: 表达目的；“来看看”是自然的现代汉语，也保留亲自察看的意味。
- source_word: τί ἐστιν τὸ γεγονός
  choice: 发生了什么事
  rationale: 自然传达对已经发生之事的询问；无需机械复制希腊文系词结构。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“放猪的人”承接上文明确语境；分号保留希腊文连续叙事的紧密关系。“人们”用于澄清隐含复数主语，避免汉语读者误以为仍是放猪的人回来观看。
