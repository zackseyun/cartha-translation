base_translation:
  language: en
  yaml_path: translation/nt/mark/005/001.yaml
  text: And they came to the other side of the sea[a], to the region of the Gerasenes.
translation:
  language: zh_hans
  text: 他们来到海的对岸，就是格拉森人的地区。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“加大拉人”；另有抄本作“革迦撒人”。
    reason: textual_variant
lexical_decisions:
- source_word: Καὶ
  choice: （不单独译出）
  rationale: 希腊文以连接词承接上文；现代汉语叙事中可由句序自然表达，避免生硬地以“于是”强化时间推进。
- source_word: ἦλθον
  choice: 他们来到
  rationale: 简明保留不定过去时直陈语气第三人称复数；“他们”按上文指耶稣和同行的人。
- source_word: εἰς τὸ πέραν
  choice: 到……的对岸
  rationale: 自然表达抵达水域另一边的方向和终点。
- source_word: τῆς θαλάσσης
  choice: 海
  rationale: 虽所指为加利利海这一湖泊，希腊文用“海”，译文保留福音书惯用称呼。
- source_word: εἰς τὴν χώραν
  choice: 到了……的地区
  rationale: χώρα在此指地域或辖区；“地区”符合现代汉语，不会引发现代民族国家意义的联想。
- source_word: Γερασηνῶν
  choice: 格拉森人的
  rationale: 按SBLGNT正文的族称音译，表示与格拉森相关的人群或地域；不以其他抄本地名取代正文读法。
theological_decisions:
- issue: 赶鬼叙事中地名的异文及地理争议
  choice: 格拉森人
  alternative: 有些抄本作“加大拉人”，另有抄本作“革迦撒人”
  rationale: 正文依SBLGNT的Γερασηνῶν；主要异文放入脚注，以保留文本证据和由此产生的地理张力，不在译文中擅自调和。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“他们来到……到了……”保留原文两个方向短语所表达的抵达过程，同时符合现代汉语。脚注标记置于整句末，清楚关联地名异文。
