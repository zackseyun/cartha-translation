  text: καὶ οὐκ ἀφῆκεν οὐδένα ⸂μετ’ αὐτοῦ⸃ συνακολουθῆσαι εἰ μὴ ⸀τὸν Πέτρον καὶ Ἰάκωβον καὶ Ἰωάννην τὸν ἀδελφὸν Ἰακώβου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/037.yaml
  text: And he allowed no one to accompany him except Peter and James and John, the brother of James.
translation:
  language: zh_hans
  text: 除了彼得、雅各和雅各的兄弟约翰以外，耶稣不许任何人跟他同去。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφῆκεν
  choice: 不许
  rationale: 该动词与不定式连用时表示准许或容许；与否定词搭配译作“不许”，符合现代汉语习惯，也准确表达耶稣不准其他人同行。
- source_word: οὐδένα
  choice: 任何人
  rationale: 在否定结构“不许任何人”中，自然表达原文对其余所有人的全面排除。
- source_word: μετ’ αὐτοῦ συνακολουθῆσαι
  choice: 跟他同去
  rationale: συνακολουθέω表示随同、一起跟去；“跟他同去”简明自然，同时保留共同随行的含义。
- source_word: εἰ μὴ
  choice: 除了……以外
  rationale: 此处引出例外而非条件；“除了……以外”清楚表明所列三人不在前述禁令之内。
- source_word: τὸν Πέτρον καὶ Ἰάκωβον καὶ Ἰωάννην
  choice: 彼得、雅各和约翰
  rationale: 采用现代中文圣经人名的通行译法；汉语列举使用顿号和“和”，自然传达原文并列关系。
- source_word: τὸν ἀδελφὸν Ἰακώβου
  choice: 雅各的兄弟
  rationale: 该同位语用于指明是哪一位约翰；直译为“雅各的兄弟”，清楚保留人物关系。
theological_decisions: []
