  text: ⸀καὶ οὐκ ἀφῆκεν αὐτόν, ἀλλὰ λέγει αὐτῷ· Ὕπαγε εἰς τὸν οἶκόν σου πρὸς τοὺς σούς, καὶ ⸀ἀπάγγειλον αὐτοῖς ὅσα ⸂ὁ κύριός σοι⸃ πεποίηκεν καὶ ἠλέησέν σε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/019.yaml
  text: And he did not permit him[a], but said to him, “Go to your home, to your own people[c][b], and report to them how much the Lord has done for you and has shown mercy to you.”
translation:
  language: zh_hans
  text: 耶稣不许他跟随自己，却对他说：“回家去，到你自己人那里[a]，把主[b]为你所做的一切，以及他怎样怜悯你，都告诉他们。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译“到属于你的人那里”，可广指他的家人、亲属和亲近的人。
    reason: lexical_alternative
  - marker: b
    text: 这里的“主”可理解为神；经文也可能有意保留神的怜悯与耶稣亲自行使的权柄和作为之间的联系。
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ ἀφῆκεν αὐτόν
  choice: 不许他跟随
  rationale: ἀφίημι在这里表示“准许、允许”。结合上一节此人请求跟随耶稣，补出“跟随”，使现代汉语指向清楚，又不改变语境所含的动作。
- source_word: λέγει αὐτῷ
  choice: 却对他说
  rationale: 希腊文用历史现在时λέγει；汉语叙事自然采用“说”。ἀλλά译为“却”，凸显耶稣没有准许请求，反而另作吩咐。
- source_word: Ὕπαγε εἰς τὸν οἶκόν σου
  choice: 回家去
  rationale: ὕπαγε表示“去”，οἶκος在此指家或家庭生活范围；语境明确是返回自己的家，因此“回家去”简洁自然。
- source_word: πρὸς τοὺς σούς
  choice: 到你自己人那里
  rationale: 原文直译为“到属于你的人那里”。“自己人”保留其宽泛性，可包括家人、亲属及亲近的人，不把范围限定为核心家庭。
- source_word: ἀπάγγειλον αὐτοῖς
  choice: 都告诉他们
  rationale: ἀπαγγέλλω指把消息或所发生的事报告、讲述出来；“告诉他们”在此庄重而自然。“都”与前面的ὅσα呼应，表达所行之事的整体范围。
- source_word: ὅσα ὁ κύριός σοι πεποίηκεν
  choice: 主为你做了多么大的事
  rationale: ὅσα在此既涵盖所做之事，也可突出其程度或重大性。“多么大的事”符合汉语表达，同时避免将其机械拆成“多少事情”。σοι按受益与格译为“为你”。
- source_word: ὁ κύριος
  choice: 主
  rationale: κύριος在此译作“主”，既符合通常的神圣称谓，也保留经文中神的作为与耶稣亲自行事之间未明说透的关联。
- source_word: ἠλέησέν σε
  choice: 怎样怜悯了你
  rationale: ἐλεάω表示施怜悯、以慈悲相待。“怎样怜悯了你”保留主动施予怜悯的含义，并与“多么大的事”共同作“告诉”的内容。
theological_decisions:
- issue: 耶稣所说“主”为谁
  choice: 主
  alternative: 神；主人
  rationale: 原文κύριος本身可以依语境指主、主人或神。这里直接改译“神”会提前消解一种重要张力：耶稣吩咐那人宣讲“主”的作为，而本段叙事所述的医治和怜悯又是耶稣亲自施行的。因此正文保留“主”，不替读者确定其所指，也不削弱马可叙事可能形成的联系。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“回家去”“告诉他们”自然明白；“你自己人”略带原文色彩，但在现代汉语中仍可理解，并借脚注说明其范围。正文保留“主”的指称张力。
