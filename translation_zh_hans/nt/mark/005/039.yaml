  naturalness: “你们为什么喧闹又哭泣？”是现代标准汉语中更自然、直接的责问式问句；“又”清楚连接两个并列动作，避免“喧闹哭泣”可能造成的偏正或连续动作歧义。
  terminology: “孩子”“没有死”“在睡觉”均恰当保留原文用语和叙事张力。脚注应避免将即将发生的事件仅说成“叫起来”，因为这在汉语中容易被理解为唤醒；改为“使她复起”较清楚，同时仍以“可能”保留解释的非决定性。
