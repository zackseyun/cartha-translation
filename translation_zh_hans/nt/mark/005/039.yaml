  to: 他进去后，对他们说：“你们为什么喧闹又哭泣？孩子没有死，而是在睡觉。”[a]
  rationale: 修订仅除去未明示的“这样”，明确两个动词的并列关系，并使脚注对随后事件的表述更准确。正文继续保留耶稣“没有死，而是在睡觉”的未经解释的张力。
