  text: καὶ εἰσελθὼν λέγει αὐτοῖς· Τί θορυβεῖσθε καὶ κλαίετε; τὸ παιδίον οὐκ ἀπέθανεν ἀλλὰ καθεύδει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/039.yaml
  text: And after entering, he says to them, “Why are you making a commotion and weeping? The child has not died, but is sleeping.”
translation:
  language: zh_hans
  text: 他进去后，对他们说：“你们为什么喧闹又哭泣？孩子没有死，而是在睡觉。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“孩子没有死，而是睡着了。”鉴于随后使她复起的事，耶稣在这里可能以睡眠比喻死亡。
    reason: 说明καθεύδει可译为“在睡觉”或“睡着了”，并保留其可能作为死亡比喻的含义。
lexical_decisions:
- source_word: εἰσελθὼν
  choice: 进去后
  rationale: 不定过去时分词所表达的动作先于主句的“说”；“进去后”在现代汉语中自然清楚，又不增添具体地点。
- source_word: λέγει
  choice: 说
  rationale: 希腊文采用马可常见的历史现在时。汉语的“说”本身不标明时态，既适合叙事语境，也无需刻意改写为带明显过去标记的形式。
- source_word: Τί
  choice: 为什么
  rationale: 此处疑问词用于询问并责问眼前的行为，译作“为什么”最符合现代汉语习惯。
- source_word: θορυβεῖσθε
  choice: 这样喧闹
  rationale: 该动词指身处或造成嘈杂骚动；“喧闹”保留现场公开而有声的骚动，同时语体庄重自然。
- source_word: κλαίετε
  choice: 哭泣
  rationale: “哭泣”准确表达流泪哀哭，语气自然庄重；不译作“哀号”，以免过度限定为仪式性的号哭。
- source_word: παιδίον
  choice: 孩子
  rationale: 原词是泛指孩子的中性名词。虽然上下文表明她是女孩，本节仍按原词译作“孩子”。
- source_word: οὐκ ἀπέθανεν
  choice: 没有死
  rationale: 保留原文表示死亡事件的动词表达，不改成状态性的“不是死的”或“并非死人”。
- source_word: καθεύδει
  choice: 在睡觉
  rationale: 以进行性表达对应现在时，并保留耶稣所用的睡眠说法，不在正文中解释其比喻或预示意味。
theological_decisions:
- issue: 耶稣的话是从字面否认孩子死亡，还是以睡眠比喻死亡
  choice: 正文直译为“孩子没有死，而是在睡觉”，不作解释性扩充。
  alternative: 可解释为“孩子不是永久地死了，只是睡着了”，或“因耶稣将使她起来，所以在他看来她如同睡着”。
  rationale: 希腊文刻意把“没有死”与“在睡觉”直接并列。译文保留这一张力，不擅自判定这是字面陈述、死亡的比喻，还是预示即将发生的复起。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“喧闹哭泣”简洁呈现哀悼现场的声响；“在睡觉”刻意保留原文措辞及其神学张力。
