  text: ὃς τὴν κατοίκησιν εἶχεν ἐν τοῖς μνήμασιν, καὶ ⸂οὐδὲ ἁλύσει οὐκέτι⸃ οὐδεὶς ἐδύνατο αὐτὸν δῆσαι
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/003.yaml
  text: who had his dwelling among the tombs[a], and no one could bind him anymore, not even with a chain.
translation:
  language: zh_hans
  text: 这人住在坟墓中[a]；再也没有人能捆住他，即使用锁链也不能。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这人以坟墓为住处。”
    reason: 词汇与句式替代译法；较形式地保留κατοίκησιν εἶχεν（直译为“有住处”）的名词结构。
lexical_decisions:
- source_word: κατοίκησιν εἶχεν
  choice: 住
  rationale: 这是表示居住状态的希腊语表达。中文译作“住”自然清楚，也不额外暗示这是温馨或固定的“家”。
- source_word: ἐν τοῖς μνήμασιν
  choice: 在坟墓中
  rationale: μνῆμα指坟墓或安葬之处；“坟墓”比“坟地”更贴近原词，而“中”保留ἐν的空间表达，同时未限定他始终身处某一座墓穴内部。
- source_word: οὐδὲ ἁλύσει
  choice: 即使用铁链也不能
  rationale: 保留ἅλυσις的单数含义，并以中文让步式表达οὐδέ的加强语气。补出“铁”符合现代汉语对金属锁链的自然称呼，语境也明确是用于捆绑的链条。
- source_word: οὐκέτι
  choice: 再也
  rationale: 表达从先前尚能捆绑到如今不能的状态变化，与中文叙事语气自然相合。
- source_word: οὐδεὶς ἐδύνατο αὐτὸν δῆσαι
  choice: 没有人能捆住他
  rationale: δῆσαι表示捆绑；“捆住”既保留身体束缚的具体含义，也自然体现动作预期的结果。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“这人”承接上文关系代词ὃς；分为两句以符合现代汉语节奏。保留“再也”的时间变化和“即使……也……”的强调，不对其原因作神学解释。
