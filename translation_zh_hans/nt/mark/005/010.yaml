base_translation:
  language: en
  yaml_path: translation/nt/mark/005/010.yaml
  text: And he begged him repeatedly not to send them out of the region[a].
translation:
  language: zh_hans
  text: 他再三恳求耶稣，不要把它们送出这地区。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他多次央求耶稣，不要把它们送到这地方以外。”
    reason: 提供πολλὰ与ἔξω τῆς χώρας的较直译表达，保留“多次”及“这地方以外”的措辞可能，并以“送到”对应ἀποστείλῃ。
lexical_decisions:
- source_word: παρεκάλει
  choice: 恳求
  rationale: 在赶鬼的语境中，该词表达迫切的请求；“恳求”自然、庄重，也保留了强烈语气。
- source_word: πολλὰ
  choice: 再三
  rationale: 此处作状语，加强并可能表示反复进行的恳求；“再三”以现代汉语自然传达这种反复性。
- source_word: ἵνα μὴ
  choice: 不要
  rationale: 用“不要”自然表达恳求的否定内容，不把内容与目的之间的细微语法关系过度明确化。
- source_word: αὐτὰ
  choice: 它们
  rationale: 原文为中性复数，回指众污灵；“它们”保留复数，同时与前面的单数恳求者形成原文所有的数目张力。
- source_word: ἀποστείλῃ
  choice: 赶出
  rationale: 该动词在这里指差遣离开、送出某地；结合赶鬼语境，“赶出”是自然汉语，但不额外加入毁灭等含义。
- source_word: ἔξω τῆς χώρας
  choice: 出那地区
  rationale: χώρα在此指当地的区域或地界，并非现代民族国家；“那地区”清楚表达地理范围。
theological_decisions:
- issue: 邪灵说话语境中单数动词主语与复数代词所指之间的转换
  choice: 以单数“他”作为恳求者，以复数“它们”作为被赶出的对象。为避免汉语中两个“他”造成指代含混，将受求者明示为“耶稣”。
  alternative: 把说话者与众鬼统一处理为复数，以消除数目转换。
  rationale: 希腊文让一个单数说话者代表众鬼恳求，并以复数代词指众鬼。译文保留这种张力，不将其协调消除。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“再三恳求”传达迫切且反复的动作；明示“耶稣”可避免连续代词在独立经节中产生歧义。
