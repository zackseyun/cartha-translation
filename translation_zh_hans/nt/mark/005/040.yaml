source:
  edition: SBLGNT
  text: καὶ κατεγέλων αὐτοῦ. ⸀αὐτὸς δὲ ἐκβαλὼν πάντας παραλαμβάνει τὸν πατέρα τοῦ παιδίου καὶ τὴν μητέρα καὶ τοὺς μετ’ αὐτοῦ, καὶ εἰσπορεύεται ὅπου ἦν τὸ ⸀παιδίον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/040.yaml
  text: And they were laughing at him[a]. But he, after putting them all outside, takes the child's father and mother and those with him[b], and goes in where the child was.
translation:
  language: zh_hans
  text: 他们就嘲笑他[a]。耶稣却把众人都赶出去，带着孩子的父母和同他一起的人[b]，进到孩子所在的地方。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他们就讥笑他”。希腊语这个动词可指带着轻蔑意味的笑。
    reason: lexical_alternative
  - marker: b
    text: 指当时随耶稣同行的门徒。
    reason: cross_reference
lexical_decisions:
- source_word: κατεγέλων
  choice: 嘲笑
  rationale: 未完成时描写众人持续或纷纷发出带轻蔑意味的笑；“嘲笑”在现代汉语中自然，也保留该动词的贬抑色彩。
- source_word: ἐκβαλὼν πάντας
  choice: 把众人都赶出去
  rationale: 分词表示先于主要动作发生的行动；“赶出去”准确表达使众人离开，同时在本语境中不会自然地被误解为赶鬼。
- source_word: παραλαμβάνει
  choice: 只带着
  rationale: 历史现在时在汉语叙事中不必机械标记；“带着”表达耶稣选定几人与自己一同进去，“只”由把其余众人赶出去的对比关系自然显明。
- source_word: παιδίου / παιδίον
  choice: 孩子
  rationale: 原文使用中性的 παιδίον；上下文虽表明是女孩，本节仍译作“孩子”，避免增加本句未明说的性别称谓。
- source_word: τοὺς μετ’ αὐτοῦ
  choice: 跟随他的人
  rationale: 保留表达的一定概括性，同时比直译“与他同在的人”更符合现代汉语；具体所指可由脚注说明。
- source_word: εἰσπορεύεται
  choice: 进到
  rationale: 自然表达进入孩子所在之处的动作；马可的历史现在在汉语中通过连续动作和叙事节奏体现。
- source_word: ὅπου ἦν τὸ παιδίον
  choice: 孩子所在的地方
  rationale: 原文只陈述位置，没有明确说孩子躺着，因此不补入“躺卧”等细节。
theological_decisions:
- issue: 叙事时态与历史现在
  choice: 采用自然的汉语连续叙事，不以显式现在时硬译 παραλαμβάνει、εἰσπορεύεται
  alternative: 译成带突显效果的“便带着……进去”或机械保留现在时形式
  rationale: 现代汉语动词本身不屈折标示时态；按事件先后自然铺陈，既保留马可叙事的鲜明推进，也避免不合汉语习惯的时态表达。
- issue: τοὺς μετ’ αὐτοῦ 的身份
  choice: 正文译为概括性的“跟随他的人”，脚注说明是随行的门徒
  alternative: 正文直接译为“跟随他的门徒”
  rationale: 原文本身没有在此处使用“门徒”一词；正文保留其概括性，脚注结合上文澄清所指，不把解释直接写入经文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“嘲笑”“赶出去”“带着”“进到”均为自然叙事用语。正文保留“孩子”的中性称谓及“跟随他的人”的概括表达，以免超出本节原文；所有脚注标记均已置于正文对应位置。
