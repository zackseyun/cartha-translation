  text: καὶ τὰ ἱμάτια αὐτοῦ ⸀ἐγένετο στίλβοντα λευκὰ ⸀λίαν οἷα γναφεὺς ἐπὶ τῆς γῆς οὐ δύναται ⸀οὕτως λευκᾶναι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/003.yaml
  text: And his clothes became gleaming[a], very white, such as no launderer on earth is able to whiten.
translation:
  language: zh_hans
  text: 他的衣服变得闪耀，洁白无比；世上任何漂布匠[a]都不能把衣服漂得这样白。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文指从事清洗、整理并漂白布料的工匠；传统上称为“漂布匠”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱμάτια
  choice: 衣服
  rationale: 这是泛指衣着的常用词；“衣服”自然、准确，不把它过度具体化为袍服。
- source_word: ἐγένετο
  choice: 变得
  rationale: 表达状态的转变，符合变像场景中的动态变化。
- source_word: στίλβοντα
  choice: 闪闪发亮
  rationale: 传达明亮闪耀的视觉效果，同时不加入“荣耀”等解释性神学用语。
- source_word: λευκὰ λίαν
  choice: 洁白无比
  rationale: 既保留白色的基本含义，也自然有力地表达 λίαν 的强烈程度。
- source_word: γναφεύς
  choice: 漂洗衣物的人
  rationale: 此词指清洗、处理并漂白布料的工匠；功能性译法比现代汉语中生僻或可能误解的专门称谓更清楚。
- source_word: ἐπὶ τῆς γῆς
  choice: 世上
  rationale: 自然表达地上人类能力范围内的比较。
- source_word: οὐ δύναται οὕτως λευκᾶναι
  choice: 没有……能漂得那么白
  rationale: 自然呈现能力否定和程度比较；“那么”对应 οὕτως，并从上下文明确漂白的对象是衣服。
theological_decisions:
- issue: 变像所产生的可见效果
  choice: 仅以鲜明的视觉语言描写耶稣衣服超乎人力所能达到的明亮洁白
  alternative: 译作“闪耀着荣耀”等带有明确神学解释的措辞
  rationale: 本节直接描写衣服的外观，没有明说其神学含义；译文应让上下文呈现其意义，而不在本节添加解释。
translation_notes:
  register: 采用现代、庄重而通俗的叙事语言。“洁白无比”与“漂得那么白”使强烈程度及比较关系清楚可感；脚注说明古代职业含义，避免读者把它仅理解为普通洗衣者。
