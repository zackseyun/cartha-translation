  text: And he asked them[a], “What are you discussing with one another?”
translation:
  language: zh_hans
  text: 他问他们：“你们在互相讨论什么[a]？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们在互相争论什么？”这个动词按上下文可指讨论、辩论或争论。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπηρώτησεν
  choice: 问
  rationale: 此处是不定过去时，在叙事中自然地引出直接引语；“问”准确、简洁，不额外增添正式或强烈语气。
- source_word: αὐτούς
  choice: 他们
  rationale: 希腊文只使用复数代词，本节没有明说所指对象；译作“他们”可保留这种不特定性。
- source_word: Τί
  choice: 什么
  rationale: 此处询问争论的内容或议题，而非主要询问原因。
- source_word: συζητεῖτε
  choice: 在争论
  rationale: συζητέω可指讨论、辩论或争论；结合上下文中经学家与门徒的对峙场景，“争论”较自然，但其较中性的含义以脚注保留。
- source_word: πρὸς αὑτούς
  choice: 彼此
  rationale: 此表达在这里表示群体之间的相互互动；“彼此”是自然、简洁的现代汉语说法。
- source_word: καὶ
  choice: 他问
  rationale: καί连接前后叙事；汉语中承接上下文直接说“他问”最自然，无须机械译出“于是”或“并且”。
