  text: καὶ λαβὼν παιδίον ἔστησεν αὐτὸ ἐν μέσῳ αὐτῶν καὶ ἐναγκαλισάμενος αὐτὸ εἶπεν αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/036.yaml
  text: 'And taking a child[a], he set him in their midst, and taking him in his arms[b], he said to them:'
translation:
  language: zh_hans
  text: 他领来一个孩子，让孩子站在他们中间[a]，又把他抱在怀里[b]，对他们说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把孩子安置在他们中间。”原文动词的基本意思是“使他站立”，在这里也可较概括地理解为“安置”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“搂着他。”原文动词可指把人抱在怀里，也可指拥抱、搂抱。
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν παιδίον
  choice: 领来一个孩子
  rationale: λαβών是先于主句动作的简单过去时分词；结合随后让孩子站在众人中间的动作，译作“领来”比生硬的“拿起”更符合现代汉语，也不额外限定孩子的年龄。
- source_word: ἔστησεν αὐτὸ ἐν μέσῳ αὐτῶν
  choice: 让孩子站在他们中间
  rationale: ἔστησεν在这里具有使役含义，即“使……站立”；“站在他们中间”保留了原文具体的姿态和空间位置。重复“孩子”可避免中性名词παιδίον在汉语代词表达上的歧义。
- source_word: ἐναγκαλισάμενος αὐτό
  choice: 把他抱在怀里
  rationale: 该动词可指把人搂入怀中或拥抱；此译法具体、自然，并保留了亲近的身体动作。
- source_word: εἶπεν αὐτοῖς
  choice: 对他们说
  rationale: 直接、自然地对应“向他们说”，并以冒号承接下一节的话。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准汉语。以“让孩子站在他们中间”保留原文的具体动作；“又把他抱在怀里”顺畅呈现分词所表达的后续动作。经文承接上文，沿用省略姓名的“他”，不在本节补入原文没有明说的主语名称。
