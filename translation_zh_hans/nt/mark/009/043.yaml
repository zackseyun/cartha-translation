source:
  edition: SBLGNT
  text: Καὶ ἐὰν ⸀σκανδαλίζῃ σε ἡ χείρ σου, ἀπόκοψον αὐτήν· καλόν ⸂ἐστίν σε⸃ κυλλὸν ⸂εἰσελθεῖν εἰς τὴν ζωὴν⸃ ἢ τὰς δύο χεῖρας ἔχοντα ἀπελθεῖν εἰς τὴν γέενναν, εἰς τὸ πῦρ τὸ ⸀ἄσβεστον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/043.yaml
  text: And if your hand causes you to stumble[a], cut it off. It is better for you to enter into life crippled than, having two hands, to go away into Gehenna[b], into the unquenchable fire.
translation:
  language: zh_hans
  text: 若你的手使你跌倒[a]，就把它砍掉。你缺一只手进入生命，比双手齐全却到革赫拿[b]去，进入那不灭的火里，更好。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使你犯罪。”这个希腊语动词可指使人绊跌、跌倒或犯罪。
    reason: lexical_alternative
  - marker: b
    text: “革赫拿”是与欣嫩谷有关的希腊语地名形式，在犹太传统中与上帝的审判相关；传统上也常译作“地狱”。
    reason: historical_and_lexical_clarification
lexical_decisions:
- source_word: σκανδαλίζῃ
  choice: 使你跌倒
  rationale: 保留希腊语中使人绊跌、陷入网罗的比喻，同时不把含义过早限定为某一种罪行；上下文仍清楚表达犯罪与偏离的危险。
- source_word: ἀπόκοψον
  choice: 把它砍掉
  rationale: 准确传达不定过去时命令语气的直接和强烈，也保留原文令人震撼的具体身体意象。
- source_word: καλόν
  choice: 更好
  rationale: καλόν本义为“好”，但在与ἤ构成的比较句中，自然表达为“更好”。
- source_word: κυλλόν
  choice: 缺一只手
  rationale: κυλλός指肢体残缺；这里前文明确说砍掉一只手，译为“缺一只手”比笼统的“残废”更具体、自然，也避免不必要的贬抑色彩。
- source_word: εἰσελθεῖν εἰς τὴν ζωὴν
  choice: 进入生命
  rationale: 保留进入某一终末性生命境域的表达，不将“生命”解释性扩展为某一神学术语。
- source_word: ἀπελθεῖν
  choice: 到……去
  rationale: 在中文比较句中自然传达离去并到达某处的方向性，与“进入生命”形成对照。
- source_word: γέενναν
  choice: 欣嫩谷
  rationale: γέεννα源于希伯来地名“欣嫩谷”；用中文圣经语境中可识别的地名称谓，保留其犹太历史背景及审判意象，而不直接以较宽泛的“地狱”取代。
- source_word: ἄσβεστον
  choice: 不灭的
  rationale: 简洁准确地表达火不会熄灭或不能被扑灭的意思，符合庄重而自然的现代汉语。
- source_word: τὰς δύο χεῖρας ἔχοντα
  choice: 双手齐全
  rationale: 自然表达“有两只手”，并突出与“缺一只手”的鲜明对比。
theological_decisions:
- issue: 审判语境中γέεννα的译法
  choice: 欣嫩谷
  alternative: 地狱；革赫拿
  rationale: 原词是由具体地名发展而来的审判用语。正文保留地名背景和原文意象，脚注说明其审判含义及传统译法，避免把它无声地等同于后世较宽泛的神学概念。
- issue: 砍手警告的修辞力度
  choice: 保留具体的身体语言
  alternative: 改写为远离罪恶或除去犯罪诱因
  rationale: 原文使用强烈、骇人的身体意象，译文不替读者判定这是字面命令、夸张修辞或其他表达方式，也不以解释性意译削弱其张力。
- issue: “进入生命”的含义
  choice: 直译为“进入生命”
  alternative: 进入永生；进入天国
  rationale: 原文只说“生命”，在语境中带有终末意义，但不宜在正文中补入“永”或“天国”，以免消除原文简洁而富张力的表达。
translation_notes:
  register: 采用庄重、直接而易懂的现代标准汉语。以“缺一只手”具体对应上下文，避免使用可能带有贬抑意味的残障称谓；保留原文强烈的命令和终末审判张力。
