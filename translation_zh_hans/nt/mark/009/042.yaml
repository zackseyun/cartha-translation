  source_fidelity: 译文整体准确反映原文的警告、"使……跌倒"的隐喻、信靠耶稣的“小者”、比较性的“倒不如”，以及将驴驱动的大磨石置于颈上并投入海中的画面。惟“驴拉的大磨石”可能被理解为由驴拖拉搬运的一块磨石，未能清楚表达ὀνικός所指由驴驱动的磨石。
  naturalness: “小子”虽有传统经文语感，但在现代普通话中常指男孩或带轻蔑色彩，且不够自然地涵盖儿童、弱小者或卑微信徒。改为“这些微小的人”稍显直译但语义明确；采用“这些小人物”则会过强地引向社会地位。为保留原文开放性，保留“小子”并非不可，但本节可用“这些小小的人”获得较自然且宽泛的表达。句式也宜以“凡是”起首，并明确两个被动动作的受事。
  terminology: “使……跌倒”及其脚注恰当地保留σκανδαλίζω的比喻和较广语义。将μύλος ὀνικός译作“由驴拉动的大磨石”，并在脚注说明其区别于手磨石，较为准确。
