source:
  edition: SBLGNT
  text: Καὶ ὃς ⸀ἂν σκανδαλίσῃ ἕνα τῶν μικρῶν ⸀τούτων τῶν πιστευόντων ⸂εἰς ἐμέ⸃, καλόν ἐστιν αὐτῷ μᾶλλον εἰ περίκειται ⸂μύλος ὀνικὸς⸃ περὶ τὸν τράχηλον αὐτοῦ καὶ βέβληται εἰς τὴν θάλασσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/042.yaml
  text: And whoever causes one of these little ones who believe in me to stumble[a], it is better for him if a donkey millstone is put around his neck and he is thrown into the sea.
translation:
  language: zh_hans
  text: 凡是使这些信我的小小的人中的一个跌倒[a]的，他倒不如让人把一块由驴拉动的大磨石[b]套在他的脖子上，把他扔进海里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “跌倒”也可指被引诱犯罪或背离信仰。
    reason: lexical_alternative
  - marker: b
    text: 指由驴拉动的大磨石，区别于手磨所用的小磨石。
    reason: historical_cultural_clarification
lexical_decisions:
- source_word: σκανδαλίσῃ
  choice: 使……跌倒
  rationale: 保留希腊文“绊倒、使跌倒”的比喻，同时容纳使人犯罪、背离或信仰受损等严重含义；“冒犯”在现代汉语中语义过轻。
- source_word: μικρῶν τούτων
  choice: 这些……小子
  rationale: “小子”保留“小、卑微、弱小者”的表达幅度，也与上下文中的孩子意象相呼应，不把所指强限定为儿童。
- source_word: τῶν πιστευόντων εἰς ἐμέ
  choice: 信我的
  rationale: 直接表达分词短语对“小子”的限定，即相信并信靠耶稣的人。
- source_word: καλόν ἐστιν αὐτῷ μᾶλλον
  choice: 他倒不如
  rationale: 用自然现代汉语表达比较性的严厉警告：遭受随后描述的结局，对他反而更好。
- source_word: μύλος ὀνικός
  choice: 驴拉的大磨石
  rationale: 该短语特指由驴带动、区别于手推小磨的磨石；译文既呈现动力来源，也明确其巨大沉重。
- source_word: περίκειται ... περὶ τὸν τράχηλον
  choice: 被人把……套在脖子上
  rationale: 清楚表达磨石被置于颈项周围的被动情形。
- source_word: βέβληται εἰς τὴν θάλασσαν
  choice: 扔进海里
  rationale: 以简洁有力的现代汉语传达被投入海中的动作和结果。
theological_decisions:
- issue: “这些小子”的所指
  choice: 译法兼容儿童、弱小者和地位卑微的信徒，不在正文中限定为某一类。
  alternative: 明确译为“这些小孩子”或“这些卑微的门徒”。
  rationale: 上下文有儿童意象，但“信我的”表明这里至少以信徒身份来描述他们；保留宽泛表达可避免过早消除原文张力。
- issue: “使……跌倒”的严重程度
  choice: 保留跌倒比喻，并以脚注说明其可涉及犯罪或背离信仰。
  alternative: 正文直接译为“使……犯罪”或“使……离弃信仰”。
  rationale: 原词语义范围较宽，直接选定某一种后果会缩窄原文。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“小子”略带传统经文语体，但能比“小孩子”更好地保留原文所指的开放性；两个脚注分别说明“跌倒”的宽广含义和驴拉磨石的文化背景。
