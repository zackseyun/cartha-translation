- from: 凡使这些信我的小子中的一个跌倒[a]的，他倒不如被人把一块驴拉的大磨石[b]套在脖子上，扔进海里。
  to: 凡是使这些信我的小小的人中的一个跌倒[a]的，他倒不如让人把一块由驴拉动的大磨石[b]套在他的脖子上，把他扔进海里。
  rationale: 修订澄清“驴驱动的磨石”的词义，避免“驴拉的大磨石”的附着关系歧义；并将“小子”改为“小小的人”，以较自然的现代普通话保留原文对儿童、弱小者或卑微信徒的开放指称。其余措辞保留原文的比喻、严厉比较和被动结局，未将“跌倒”狭义化为犯罪或背道。
