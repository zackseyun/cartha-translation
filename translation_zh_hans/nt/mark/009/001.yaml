  - severity: medium
    issue: “上帝的国带着大能来临”未充分体现ἐληλυθυῖαν的完成状态。
    rationale: 该完成时分词修饰“上帝的国”，表示所看见的是国已经来到的状态；“已经以大能降临”既自然又保留此重点。
  - severity: low
    issue: 脚注标记未紧邻各自所说明的词语或短语。
    rationale: 将[a]置于“经历死亡”后、[b]置于“已经以大能降临”后，可使锚点明确，避免两个标记集中句末造成指向不清。
