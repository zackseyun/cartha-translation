revisions:
- from: 耶稣又对他们说：“我实在告诉你们：站在这里的人中，有些人在看见上帝的国带着大能来临以前，绝不会尝到死味。[a][b]”
  to: 耶稣又对他们说：“我实在告诉你们：站在这里的人中，有些人绝不会经历死亡[a]，直到他们看见上帝的国已经以大能降临[b]。”
  rationale: 修订以现代、庄重的普通话表达死亡习语，同时通过脚注保留原文的比喻。将国度表述为“已经以大能降临”，明确保留完成时分词所表示的已然状态；不在正文中指定该应验所指的事件。脚注锚点也移至其所解释的内容之后。
