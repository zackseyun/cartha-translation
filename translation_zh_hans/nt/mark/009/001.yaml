  text: καὶ ἔλεγεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν ὅτι εἰσίν τινες ⸂τῶν ὧδε⸃ ἑστηκότων οἵτινες οὐ μὴ γεύσωνται θανάτου ἕως ἂν ἴδωσιν τὴν βασιλείαν τοῦ θεοῦ ἐληλυθυῖαν ἐν δυνάμει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/001.yaml
  text: And he was saying to them[a], “Truly I say to you[d][c][b], there are some standing here who will certainly not taste death until they see the kingdom of God having come in power.”
translation:
  language: zh_hans
  text: 耶稣又对他们说：“我实在告诉你们：站在这里的人中，有些人绝不会经历死亡[a]，直到他们看见上帝的国已经以大能降临[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“尝到死亡”；这是指经历死亡，也就是死去。
    reason: lexical_alternative
  - marker: b
    text: “上帝的国已经以大能降临”可能与登山变像、耶稣复活并升高、五旬节、耶路撒冷受审判，或上帝之国最终圆满实现有关；本节没有明确说明所指的是哪一件事。
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ ἔλεγεν αὐτοῖς
  choice: 耶稣又对他们说
  rationale: καί承接前文，可自然译作“又”；主语虽为代词且本节省略明说，但上下文清楚指耶稣。ἔλεγεν为未完成时，在这里采用自然的汉语叙事表达“说”，不生硬复制持续体。
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: 我实在告诉你们
  rationale: 这是耶稣引出郑重宣告的固定表达；“实在”既自然庄重，也保留ἀμήν的强调作用。
- source_word: τινες τῶν ὧδε ἑστηκότων
  choice: 站在这里的人中，有些人
  rationale: 明确保留属格所表达的部分关系，即在场者中的一部分人。
- source_word: οὐ μὴ γεύσωνται θανάτου
  choice: 绝不会尝到死味
  rationale: “绝不会”传达οὐ μή的强烈否定；“尝到死味”保留希腊文的比喻性习语，而脚注说明其含义。
- source_word: ἕως ἂν ἴδωσιν
  choice: 在看见……以前
  rationale: 自然表达未来时间界限，语义相当于“直到……才”；并避免汉语中“绝不会……直到……”可能产生的拗口感。
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: 上帝的国
  rationale: “上帝的国”是福音书语境中βασιλεία τοῦ θεοῦ的通行译法，并保留其统治与末世实现的语义空间。
- source_word: ἐληλυθυῖαν ἐν δυνάμει
  choice: 带着大能来临
  rationale: “来临”表达ἔρχομαι的到来意义，“带着大能”自然对应ἐν δυνάμει；汉语难以无碍地完整复制完成时分词，但上下文所设的看见时点保留了国以大能来到并显现的意义。
theological_decisions:
- issue: “上帝的国带着大能来临”所指的事件
  choice: 正文不指明具体事件，仅译作“看见上帝的国带着大能来临”
  alternative: 明确解释为登山变像、复活与升高、五旬节、耶路撒冷受审判，或上帝之国最终圆满实现
  rationale: 希腊文本身没有明确指定所指事件。译文保留这一开放性，不以翻译代替释经。
- issue: 死亡与看见国来临之间的时间关系
  choice: 译作“在看见……以前，绝不会尝到死味”
  alternative: 改写为“他们活着的时候就会看见……”
  rationale: 保留原文强烈否定和“尝死味”的表达，不额外推导或限定其末世论含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我实在告诉你们”保留福音书郑重宣告的语体；“尝到死味”有意保留原文意象，并以脚注释义。正文的脚注标记均紧随相关内容，其中[a]解释死亡习语，[b]说明事件指向的诠释开放性。
