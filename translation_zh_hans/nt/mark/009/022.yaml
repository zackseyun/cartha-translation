source:
  edition: SBLGNT
  text: καὶ πολλάκις ⸂καὶ εἰς πῦρ αὐτὸν⸃ ἔβαλεν καὶ εἰς ὕδατα ἵνα ἀπολέσῃ αὐτόν· ἀλλ’ εἴ τι ⸀δύνῃ, βοήθησον ἡμῖν σπλαγχνισθεὶς ἐφ’ ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/022.yaml
  text: And many times it has thrown him both into fire and into waters to destroy him[a]. But if you can do anything, help us[b], having compassion on us.
translation:
  language: zh_hans
  text: 它屡次把他扔进火里，也扔进水中，要毁掉他[a]。但你若能做什么，求你怜悯我们，帮助我们！[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文“水”是复数；也可译作“众水中”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作：“请向我们动慈心，帮助我们”或“请怜恤我们，帮助我们”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλάκις
  choice: 屡次
  rationale: 表达反复发生，简洁自然，也符合父亲叙述长期以来多次发作的语境。
- source_word: ἔβαλεν
  choice: 把他扔进
  rationale: 该不定过去时概括以往反复发生的动作；现代汉语用“屡次……扔进”即可自然体现这一点。
- source_word: εἰς πῦρ ... καὶ εἰς ὕδατα
  choice: 扔进火里，又扔进水中
  rationale: 保留两个εἰς所形成的重复和强调；“水中”在汉语里自然，希腊文复数ὕδατα的形式信息另以脚注说明。
- source_word: ἵνα ἀπολέσῃ αὐτόν
  choice: 要毁掉他
  rationale: 体现ἵνα加虚拟式所表达的目的，并保留ἀπόλλυμι较宽的毁灭含义，不直接窄化为“杀死”。
- source_word: ἀλλ’ εἴ τι δύνῃ
  choice: 但你若能做什么
  rationale: 明确译出不定代词τι，保留父亲对耶稣能力有所迟疑的语气，不替原文消解张力。
- source_word: βοήθησον ἡμῖν
  choice: 帮助我们
  rationale: 直接、自然地表达请求立即援助的不定过去时命令式，并保留复数“我们”。
- source_word: σπλαγχνισθεὶς ἐφ’ ἡμᾶς
  choice: 怜悯我们
  rationale: 自然传达σπλαγχνίζομαι所指发自内心的深切同情；与后面的“帮助我们”连用，符合现代汉语恳求语序。
theological_decisions:
- issue: 父亲请求的语气及其对耶稣能力的迟疑
  choice: 但你若能做什么
  alternative: 但你若能；但你若有能力做什么
  rationale: 原文εἴ τι δύνῃ直白表达迟疑。译文保留这一神学与叙事张力，不将其润饰成更有信心的宣告。
- issue: σπλαγχνισθεὶς与命令式的关系
  choice: 求你怜悯我们，帮助我们
  alternative: 请因怜悯我们而帮助我们；请向我们动慈心，帮助我们
  rationale: 希腊文分词可表达伴随情形或构成请求的一部分。正文采用自然汉语而不限定其精确逻辑关系，脚注列出可体现分词结构的译法。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事和恳求语体。“它”承接上文污灵；“屡次”“扔进”“毁掉”清楚有力。“但你若能做什么”略带不寻常感，是为保留原文中父亲迟疑而迫切的措辞。所有脚注标记均已置于正文。
