  text: καὶ ἐπηρώτων αὐτὸν λέγοντες· Ὅτι λέγουσιν οἱ γραμματεῖς ὅτι Ἠλίαν δεῖ ἐλθεῖν πρῶτον;
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/011.yaml
  text: And they were asking him[a], saying, “Why do the scribes say that Elijah must come first?”
translation:
  language: zh_hans
  text: 他们问他：“为什么经学家说，以利亚必须先来？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπηρώτων
  choice: 问
  rationale: 未完成时可表示当时持续进行的询问；现代汉语叙事通常以“问”自然表达，不必机械添加“不断”。
- source_word: λέγοντες
  choice: 以冒号引出直接引语
  rationale: 该分词引出问题内容；汉语用冒号和引号比直译“说”更自然，也不损失信息。
- source_word: Ὅτι
  choice: 为什么
  rationale: ὅτι在此问句中具有“为什么／怎么会”的惯用功能；“为什么”清楚自然，另一个可能译法收入脚注。
- source_word: οἱ γραμματεῖς
  choice: 经学家
  rationale: 指熟悉、讲授并解释犹太律法与经文的人；“经学家”在现代汉语中较为明白，也保留其历史职分。
- source_word: Ἠλίαν
  choice: 以利亚
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: δεῖ
  choice: 必须
  rationale: 准确保留必要性语气，同时不进一步断定这种必要性的具体来源。
- source_word: ἐλθεῖν πρῶτον
  choice: 先来
  rationale: 自然表达时间上的优先次序，不添加“再来”或“在弥赛亚以前”等原文未明说的内容。
theological_decisions:
- issue: Ὅτι所引问题的语气
  choice: 译作“为什么经学家说……”
  alternative: “经学家怎么会说……”或“为什么会有经学家所说的……”
  rationale: 直接呈现门徒对经学家教导的疑问，又以脚注保留偏向“怎么会如此”的语气可能性。
- issue: 以利亚之来的性质与时间参照
  choice: 仅译“以利亚必须先来”
  alternative: “以利亚必须再来”或“以利亚必须在弥赛亚以前来”
  rationale: 原文只说明以利亚来的优先性；不加入“再”或明确补出相对于谁先来，以免替读者解决本节保留的语境与神学张力。
- issue: δεῖ所表达的必要性
  choice: 保留为“必须”，不说明是经文预言、上帝旨意或经学家的主张所造成的必要性
  alternative: 扩译为“按照经上的预言必须”
  rationale: 上下文可能使读者联想到经文和神圣计划，但本句没有明说必要性的来源。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“经学家”比“文士”更便于普通现代读者理解。用冒号直接引出问话，避免生硬保留希腊语的“问他说”。
