source:
  edition: SBLGNT
  text: Ὃς γὰρ ἂν ποτίσῃ ὑμᾶς ποτήριον ὕδατος ἐν ⸀ὀνόματι ὅτι χριστοῦ ἐστε, ἀμὴν λέγω ὑμῖν ⸀ὅτι οὐ μὴ ⸀ἀπολέσῃ τὸν μισθὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/041.yaml
  text: For whoever gives you a cup of water to drink in the name that you are Messiah's[a], truly I say to you, he will certainly not lose his reward.
translation:
  language: zh_hans
  text: 因为无论谁以你们属于弥赛亚为名，给你们一杯水喝，我实在告诉你们：他绝不会失去自己的赏赐。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὃς γὰρ ἂν
  choice: 因为，无论谁
  rationale: 用“因为”保留γάρ与上文的论证联系；“无论谁”自然表达不定关系结构。
- source_word: ποτίσῃ ὑμᾶς ποτήριον ὕδατος
  choice: 给你们一杯水喝
  rationale: 准确而自然地表达ποτίζω“给……喝”和ποτήριον ὕδατος“一杯水”。
- source_word: ἐν ὀνόματι
  choice: 以这名义
  rationale: 原文没有明确的“我”，因此不补作“奉我的名”；“以这名义”保留名义或身份依据的含义，并与后面的ὅτι从句相连。
- source_word: ὅτι χριστοῦ ἐστε
  choice: 因你们是弥赛亚的人
  rationale: 将ὅτι按因果理解，并以“是……的人”表达属格所表示的归属关系；Χριστός在此作为称号译为“弥赛亚”。
- source_word: ἀμὴν λέγω ὑμῖν
  choice: 我实在告诉你们
  rationale: 采用现代汉语中庄重而通顺的福音书宣告公式。
- source_word: οὐ μὴ ἀπολέσῃ
  choice: 绝不会失去
  rationale: “绝不会”传达οὐ μή加虚拟式的强烈否定语气。
- source_word: τὸν μισθὸν αὐτοῦ
  choice: 自己的赏赐
  rationale: “赏赐”适合此处道德及末世性的回报语境；“自己的”明确反身指向施予者。
theological_decisions:
- issue: Χριστός在归属结构中的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: χριστοῦ在此指向耶稣的称号，译作“弥赛亚”保留其受膏者称号的意义，不把它单纯名字化。
- issue: ἐν ὀνόματι ὅτι χριστοῦ ἐστε的句法关系
  choice: 因你们是弥赛亚的人，而以这名义
  alternative: 奉我的名，因为你们属于弥赛亚
  rationale: 原文未出现“我的”，故不将其补入正文；把ὅτι理解为原因，同时保留“名义”与门徒归属身份之间略显紧密而有张力的表达。
translation_notes:
  register: 采用庄重、现代、易懂的标准普通话。“以这名义”略具正式色彩，用来避免添加原文没有的“我的”，并尽量保存希腊文结构的歧义与张力。
