  text: καὶ ἐγένετο νεφέλη ἐπισκιάζουσα αὐτοῖς, καὶ ⸀ἐγένετο φωνὴ ἐκ τῆς νεφέλης· Οὗτός ἐστιν ὁ υἱός μου ὁ ἀγαπητός, ⸂ἀκούετε αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/007.yaml
  text: 'And a cloud came[a], overshadowing them, and a voice came out of the cloud: “This is my beloved Son; listen to him.”'
translation:
  language: zh_hans
  text: 有一朵云彩出现，笼罩着他们；又有声音从云中传来：“这是我的爱子，你们要听他[a]！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“听”不只是听见，也有留心听取、听从的意思。
    reason: 说明ἀκούω在此命令语境中的语义范围，避免读者将其理解为单纯的听觉行为，同时不把正文过度解释成“服从”。
lexical_decisions:
- source_word: ἐγένετο
  choice: 出现／传来
  rationale: γίνομαι在本节先以“云彩”、后以“声音”为主语，表示事件发生或事物来到；按各自主语分别译为“出现”和“传来”，既自然，也保留突然而至的动态感。
- source_word: νεφέλη
  choice: 云彩
  rationale: 按其通常词义直译，不在正文中加入关于神显或神同在的解释。
- source_word: ἐπισκιάζουσα
  choice: 笼罩着
  rationale: 表达云彩覆临并将众人包围在其下的景象，同时避免把原文具体化为原文未明说的物理细节。
- source_word: φωνή
  choice: 声音
  rationale: 原文指从云中发出的可理解言语；“声音”忠实对应名词，也不额外补入“说”这一动词。
- source_word: ἐκ τῆς νεφέλης
  choice: 从云中
  rationale: 保留ἐκ所表达的来源或由内而出的空间意味，现代汉语也自然。
- source_word: ὁ υἱός μου ὁ ἀγαπητός
  choice: 我的爱子
  rationale: “爱子”简洁而庄重，兼顾“我的儿子”与“所爱的”两层意义，符合现代中文圣经语境而不作额外神学阐释。
- source_word: ἀκούετε αὐτοῦ
  choice: 你们要听他
  rationale: “听”保留听见、留心听取并作出回应之间的语义张力；不直接译成“服从”，以免把原文含义收窄为单一的顺从行动。
theological_decisions:
- issue: 天上声音对耶稣身份的宣告
  choice: 这是我的爱子
  alternative: 这是我所爱的儿子
  rationale: 原文明白宣告耶稣是说话者的儿子，并以ἀγαπητός修饰；“我的爱子”完整保留这一基督论宣告，但不在正文中添加其教义含义。
- issue: ἀκούετε αὐτοῦ的命令力度
  choice: 你们要听他
  alternative: 你们要听从他
  rationale: 原词既可指听，也可在语境中包含留心和听从。“要听他”保存这种幅度；脚注说明其回应性的含义，而正文不把它限定为“服从”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“云彩”与“爱子”保留经文语体的尊严感；分号呈现云彩出现与声音传来两个相连事件，直接引语以感叹号体现命令语气。
