  naturalness: “就必做众人中最末的”在现代汉语中略显生硬；以“就必是……，也是……”可自然地表达原文由同一“将是”统摄的两个表语。
  terminology: 将“十二使徒”改为“那十二个人”，避免在原文没有使用“使徒”一词之处补入职分称谓；“仆人”可恰当地传达διάκονος在此处的服事性身份。
