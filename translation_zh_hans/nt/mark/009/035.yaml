  text: καὶ καθίσας ἐφώνησεν τοὺς δώδεκα καὶ λέγει αὐτοῖς· Εἴ τις θέλει πρῶτος εἶναι ἔσται πάντων ἔσχατος καὶ πάντων διάκονος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/035.yaml
  text: And sitting down, he called the twelve and says to them, “If anyone wants to be first, he will be last of all and servant of all.”
translation:
  language: zh_hans
  text: 耶稣坐下，叫那十二个人，对他们说：“谁想居首，就必是众人中最末的，也是众人的仆人。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθίσας
  choice: 坐下
  rationale: 准确表达坐下施教的动作；汉语中补出主语“耶稣”，使独立经节自然清楚。
- source_word: ἐφώνησεν τοὺς δώδεκα
  choice: 叫十二使徒过来
  rationale: ἐφώνησεν表示召唤；“过来”自然体现叫到跟前的语意。“十二使徒”在现代汉语中清楚指明“十二人”这一固定群体。
- source_word: λέγει
  choice: 说
  rationale: 原文用历史现在时“他说”；汉语叙事通常不以现在时作同样标记，译作“说”既自然，也不改变事件次序。
- source_word: πρῶτος
  choice: 居首
  rationale: 保留地位或次序上“第一”的含义，措辞简洁庄重。
- source_word: πάντων ἔσχατος
  choice: 众人中最末的
  rationale: 明确πάντων与ἔσχατος的范围关系，保留与“居首”的强烈反转。
- source_word: διάκονος
  choice: 仆人
  rationale: 此处指服事他人的人；“仆人”保留身份降卑和服务众人的力度，较“服务者”更符合经文语域。
theological_decisions:
- issue: ἔσται的陈述语气可理解为结果、要求或格言式必然
  choice: 就必做
  alternative: 就要做／就会成为
  rationale: 保留原文直陈式所表达的确定性，同时不把它单纯改写成命令，以免消除“想居首”与“成为最末、服事众人”之间的张力。
- issue: πάντων在两个短语中的普遍范围
  choice: 众人中最末的，作众人的仆人
  alternative: 所有人中最后的，并且服事所有人
  rationale: 两次明确译出“众人”，保留原文重复和普遍范围，不将对象限制为门徒群体。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留原文“居首—最末”与“众人—众人”的平行和反转；不机械复制希腊文历史现在时，以符合自然汉语叙事。
