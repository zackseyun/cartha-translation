translation:
  language: zh_hans
  text: 因为每个人都必用火腌[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“每个人都必用火调味。”这个意象可能使人想到审判、洁净或献祭的语言；参《利未记》2:13。
    reason: lexical_alternative
  - marker: b
    text: 有些抄本增添：“每样祭物都必用盐腌。”
    reason: textual_variant
lexical_decisions:
- source_word: Πᾶς
  choice: 每个人
  rationale: 该词为阳性单数主格，在此作名词用；结合上下文对人的警告与教导，译作“每个人”最自然，同时不扩大为“万物”。
- source_word: γὰρ
  choice: 因为
  rationale: γάρ说明本句是对前文警告的解释或依据；“因为”清楚保留这一逻辑联系。
- source_word: πυρὶ
  choice: 被火
  rationale: 此与格可表达手段或相关要素。“被火……过”在中文中既可理解为借着火，也可保留处于火之作用下的意味，避免强行限定。
- source_word: ἁλισθήσεται
  choice: 必被……腌过
  rationale: ἁλίζω的将来时被动语态本义是“用盐腌、加盐调味”。“腌过”保留“用盐处理”的突兀比喻及被动语态；“必”体现将来陈述的确定语气，而不把意象解释成审判、洁净或献祭。
theological_decisions:
- issue: “被火腌过”这一比喻的解释
  choice: 正文保留直译式比喻，不判定其主要指审判、洁净、献祭，还是门徒所受的试炼。
  alternative: 可解释为“每个人都必经火的审判”“每个人都必被火炼净”或“每个人都要像祭物一样加盐献上”。
  rationale: 希腊文简短而含蓄，语境及《利未记》2:13的祭物意象容许几种彼此相关的理解。译文应保留这种神学张力，不在正文中替读者作出单一解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“被火腌过”刻意保留原文不寻常且富有张力的搭配；脚注说明词义选择与抄本异文。
