  text: καὶ ἐξάπινα περιβλεψάμενοι οὐκέτι οὐδένα εἶδον ⸂ἀλλὰ τὸν Ἰησοῦν μόνον μεθ’ ἑαυτῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/008.yaml
  text: And suddenly, looking around, they no longer saw anyone except Jesus alone with them.
translation:
  language: zh_hans
  text: 他们忽然环顾四周，不再看见任何人，只有耶稣同他们在一起。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξάπινα
  choice: 忽然
  rationale: 准确表达事情突然而迅速发生，也符合现代汉语叙事习惯。
- source_word: περιβλεψάμενοι
  choice: 环顾四周
  rationale: 表达门徒向周围察看的动作，比单说“观看”更完整。
- source_word: οὐκέτι οὐδένα εἶδον
  choice: 不再看见任何人
  rationale: 保留οὐκέτι所表示的情势转变，以及οὐδένα的全称否定。
- source_word: ἀλλὰ τὸν Ἰησοῦν μόνον
  choice: 只有耶稣
  rationale: 自然呈现排除其他人的意思，并保留μόνον对耶稣是唯一所见之人的强调。
- source_word: μεθ’ ἑαυτῶν
  choice: 同他们在一起
  rationale: 明确保留耶稣与门徒同在这一空间和关系表达。
theological_decisions:
- issue: 是否把“只有耶稣”扩展为带有教义解释的表述
  choice: 维持简洁的“只有耶稣”
  alternative: 译作“只剩下耶稣”或加入耶稣独一地位的解释
  rationale: 原文叙述门徒此时所见，不应在正文中加入超出经文本身的神学阐释；同时“只有”保留了原文的强调。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“环顾四周”清楚易懂；句序贴近希腊文叙事推进，同时避免生硬直译。
