  footnotes:
  - marker: a
    text: 本节不见于现存最早的一批希腊文抄本（包括四世纪的西奈抄本和梵蒂冈抄本）以及早期科普特文译本，但见于拜占庭多数文本传统和拉丁文传统。它很可能是后来的抄写者增补，重复了第48节（以及第44节）相同的话。
    reason: textual_critical
lexical_decisions:
- source_word: σκώληξ
  choice: 虫
  rationale: 指吞食腐物的虫或蛆；译作“虫”既准确自然，也保留与《以赛亚书》66:24引文的直接联系和传统意象。
- source_word: τελευτᾷ
  choice: 死
  rationale: τελευτάω可表示“终结”或“死亡”；本句以“虫不死”自然表达现在时所描绘的持续、不止息状态。
- source_word: σβέννυται
  choice: 灭
  rationale: σβέννυμι指火被熄灭；汉语“火不灭”简洁有力，符合审判语境，也保留原文的被动含义而不必明说施事者。
theological_decisions:
- issue: “虫不死、火不灭”的意象是否应解释为某种特定的末世刑罚理论
  choice: 保留原文意象，不在正文中加以体系化解释
  alternative: 将其释义为某一特定形式或持续时间的刑罚
  rationale: 经文本身借用《以赛亚书》66:24的审判图景；直译可保留其张力，避免导入宗派性结论。
translation_notes:
  register: 采用现代、庄重而简明的标准普通话。“在那里”承接上下文地点描述；“他们的虫不死，火也不灭”保留原文平行结构及《以赛亚书》式意象。
