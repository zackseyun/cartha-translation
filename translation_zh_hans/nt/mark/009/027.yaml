base_translation:
  language: en
  yaml_path: translation/nt/mark/009/027.yaml
  text: But Jesus[a], taking hold of his hand, raised him up[b], and he stood up.
translation:
  language: zh_hans
  text: 但耶稣拉住他的手，把他扶起来[a]，他就站起来了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使他起来”；这个希腊动词也可用于从睡梦中醒来或使人从死里复活的语境。
    reason: lexical_alternative
  - marker: b
    text: 或译“他就起来了”。
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: 但
  rationale: 承接上一节众人以为孩子已经死了的判断，表达轻微转折，同时自然推进叙事。
- source_word: κρατήσας
  choice: 拉住
  rationale: 表达实际抓住、握住的动作，比单纯“牵着”更能保留κρατέω的力度，又不带“抓捕”之类的负面意味。
- source_word: τῆς χειρὸς αὐτοῦ
  choice: 他的手
  rationale: 忠实保留χείρ所指的具体身体部位，并与“拉住”构成自然的现代汉语表达。
- source_word: ἤγειρεν
  choice: 把他扶了起来
  rationale: 在本段语境中，耶稣使倒在地上的孩子起来；“扶了起来”自然清楚，也避免把此处直接解释为从死里复活。脚注保留该词更广的语义范围。
- source_word: ἀνέστη
  choice: 他就站了起来
  rationale: 说明孩子在耶稣扶起之后实际起身站立的结果；“就”自然体现前后动作的承接。
theological_decisions:
- issue: ἤγειρεν与ἀνέστη可能带有复活用语的回响
  choice: 正文采用日常身体动作的表达“扶了起来……站了起来”，并以脚注保留原词可用于从睡眠或死亡中起来的语义联系。
  alternative: 译作“使他起来，他就起来了”，更明显保留与复活叙事相近的措辞。
  rationale: 上下文描述的是赶鬼之后孩子从地上起来，并未明确说他曾死亡；因此不应把复活含义强加于正文。但两个希腊动词在其他语境中确可用于睡醒或从死里复起，适合通过脚注保存这种潜在回响。
translation_notes:
  register: 采用现代、自然而庄重的叙事汉语。“拉住他的手”保留具体动作；“扶了起来……站了起来”虽有适度重复，却准确呈现两个连续动词，并让普通读者容易理解。
