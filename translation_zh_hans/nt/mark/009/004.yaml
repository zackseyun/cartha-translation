  text: καὶ ὤφθη αὐτοῖς Ἠλίας σὺν Μωϋσεῖ, καὶ ἦσαν συλλαλοῦντες τῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/004.yaml
  text: And Elijah appeared to them with Moses[a], and they were talking with Jesus.
translation:
  language: zh_hans
  text: 以利亚同摩西向他们显现，并且两人正与耶稣交谈。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὤφθη
  choice: 显现
  rationale: 该词是ὁράω的不定过去时被动形式，此处具有“出现、让人看见”的含义；“显现”既自然，也保留叙事中突然可见的意味。
- source_word: αὐτοῖς
  choice: 向他们
  rationale: 与“显现”搭配，直接表达以利亚向在场门徒出现。
- source_word: Ἠλίας σὺν Μωϋσεῖ
  choice: 以利亚同摩西
  rationale: 按希腊语次序保留以利亚在前，并用“同”准确表达伴随关系。
- source_word: συλλαλοῦντες
  choice: 交谈
  rationale: 该分词表示彼此说话、一起谈话；“交谈”自然、庄重，并清楚体现相互交流。
- source_word: τῷ Ἰησοῦ
  choice: 与耶稣
  rationale: 尽管形式上是与格，复合动词συλλαλέω本身含共同谈话之意，因此译作“与耶稣”最符合汉语习惯。
- source_word: ἦσαν συλλαλοῦντες
  choice: 正与……交谈
  rationale: 迂回结构强调当时持续进行的动作；“正”在现代汉语中简洁地传达这一进行状态。
- source_word: καὶ ἦσαν
  choice: 并且两人正
  rationale: 希腊语谓语为复数，所指是以利亚和摩西；补出“两人”可避免汉语主语含混，同时不增加原文没有的人物。
theological_decisions:
- issue: 登山变像场景中以利亚和摩西的身份及显现的真实性
  choice: 按叙事直接表述以利亚和摩西显现并与耶稣交谈，不加限制性说明。
  alternative: 将其解释为纯粹异象或象征性形象。
  rationale: 希腊文本直接将二人写作显现并交谈；译文不应把事件弱化为主观经验，也不应加入超出经文的教义解释。
translation_notes:
  register: 采用现代、简洁而庄重的叙事语体。“以利亚”“摩西”“耶稣”沿用简体中文圣经传统中通行的人名译法。原文在本节没有需要借脚注保留的实质歧义；英文所列脚注内容似与正文位置不一致，且“交谈”已充分表达συλλαλοῦντες的互惠含义，因此不设脚注。
