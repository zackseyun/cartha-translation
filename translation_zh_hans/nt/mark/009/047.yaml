  text: καὶ ἐὰν ὁ ὀφθαλμός σου σκανδαλίζῃ σε, ἔκβαλε αὐτόν· καλόν ⸀σέ ἐστιν μονόφθαλμον εἰσελθεῖν εἰς τὴν βασιλείαν τοῦ θεοῦ ἢ δύο ὀφθαλμοὺς ἔχοντα βληθῆναι εἰς ⸀τὴν ⸀γέενναν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/047.yaml
  text: And if your eye causes you to stumble[a], throw it out. It is better for you to enter the kingdom of God with one eye than, having two eyes, to be thrown into Gehenna,
translation:
  language: zh_hans
  text: 如果你的一只眼使你跌倒，就把它扔掉。你独眼进入上帝的国，比你有两只眼却被扔进革赫拿更好。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σκανδαλίζῃ
  choice: 使你跌倒
  rationale: 保留“使人绊倒、跌倒”的比喻，同时在本段警告的语境中自然指向诱使人犯罪，却不把词义缩窄为单纯的“使你犯罪”。
- source_word: ἔκβαλε
  choice: 把它扔掉
  rationale: ἐκβάλλω的直接意思是“扔出、赶出”。此译法有力度且符合现代汉语，也不额外加入原文没有明说的“挖出”或“剜出”动作。
- source_word: καλόν ... ἢ
  choice: 胜过
  rationale: καλόν本义为“好”，但在“……而不是……”的比较结构中，译作“胜过”自然地表达“对你更好”的比较含义。
- source_word: μονόφθαλμον
  choice: 只有一只眼
  rationale: 准确传达“独眼、只有一只眼”的具体形象，并与“有两只眼”形成自然对照。
- source_word: βασιλείαν τοῦ θεοῦ
  choice: 上帝的国
  rationale: 透明而庄重地保留该短语的核心称谓和新约语境中的神学分量。
- source_word: βληθῆναι
  choice: 被扔进
  rationale: 准确表达βάλλω被动不定式的力度，并与前面的“扔掉”形成原文中相近的动词呼应。
- source_word: γέενναν
  choice: 革赫拿
  rationale: 采用音译以保留γέεννα作为特定审判用语的历史与神学特征，不把它直接并入含义更宽泛、带有后期观念的“地狱”；脚注说明其来源和通常译法。
theological_decisions:
- issue: 审判语境中γέεννα的译法
  choice: 革赫拿
  alternative: 地狱
  rationale: 原文使用特定词γέεννα，而不是泛指阴间或刑罚的词。音译保留它与欣嫩谷传统及末世审判意象的联系；读者熟悉的“地狱”作为可选译法放入脚注，避免在正文中消除这些词汇差别。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“跌倒”的原文比喻和身体意象；以“扔掉”而非传统的“剜出来”避免加入动词本身未明确表达的动作。
