  text: Καὶ μετὰ ἡμέρας ἓξ παραλαμβάνει ὁ Ἰησοῦς τὸν Πέτρον καὶ τὸν Ἰάκωβον ⸀καὶ Ἰωάννην, καὶ ἀναφέρει αὐτοὺς εἰς ὄρος ὑψηλὸν κατ’ ἰδίαν μόνους. καὶ μετεμορφώθη ἔμπροσθεν αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/002.yaml
  text: And after six days[a], Jesus takes Peter and James and John, and brings them up onto a high mountain by themselves. And he was transfigured before them[c][b],
translation:
  language: zh_hans
  text: 六天后[a]，耶稣带着彼得、雅各和约翰，私下里只带着他们三人上了一座高山。他在他们面前变了形象[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“过了六天”。
    reason: lexical_alternative
  - marker: c
    text: 或译：“改变了形貌”；传统译法为“变了形像”或“变像”。
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ ἡμέρας ἓξ
  choice: 六天后
  rationale: μετά加宾格表示时间上的随后；“六天后”是现代汉语自然、准确的表达，也可较形式化地译作“过了六天”。
- source_word: παραλαμβάνει
  choice: 带着
  rationale: 此处是马可常用的历史现在时；汉语叙事通常不必机械保留现在时。“带着”自然表达耶稣特意带这三位门徒同行。
- source_word: ἀναφέρει αὐτοὺς εἰς ὄρος ὑψηλὸν
  choice: 领他们上了一座高山
  rationale: ἀναφέρει表达向上带领，εἰς表示朝向或进入目的地；“领……上了”兼顾带领和登高的含义。
- source_word: κατ’ ἰδίαν μόνους
  choice: 单独与他们在一起
  rationale: 原文以κατ’ ἰδίαν和μόνους双重强调与其他人分开。汉语用“单独与他们在一起”既保持这种排他意味，又避免生硬重复。
- source_word: μετεμορφώθη
  choice: 变了形象
  rationale: 该动词表示形态或外在样貌发生改变。“变了形象”比单用“改变”明确，也不预先解释变化的性质；传统术语可作脚注备选。
- source_word: ἔμπροσθεν αὐτῶν
  choice: 在他们面前
  rationale: 直接表达这变化发生在三位门徒眼前，符合原文的空间及见证意味。
theological_decisions:
- issue: 基督论语境中μετεμορφώθη的译法
  choice: 变了形象
  alternative: 改变了形貌；显出荣光；变像
  rationale: “变了形象”忠实保留原文所陈述的可见变化，却不把后文所显明的荣光提前加入本节，也不说明变化的机制。传统“变像”简洁但在现代普通读者看来较术语化。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“彼得、雅各、约翰”沿用通行圣经人名。“单独与他们在一起”保留原文双重强调而避免汉语赘复；句末不用英文底稿中不完整的逗号。
