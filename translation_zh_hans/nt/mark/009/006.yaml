  text: οὐ γὰρ ᾔδει τί ⸀ἀποκριθῇ, ⸂ἔκφοβοι γὰρ ἐγένοντο⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/006.yaml
  text: For he did not know what he should answer[b][a], for they were terrified.
translation:
  language: zh_hans
  text: 因为他不知道该回答什么[a]；因为他们都吓坏了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“该说什么来回应。”
    reason: lexical_alternative
  - marker: b
    text: 希腊文更直译为：“他们变得极其害怕。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: 不知道
  rationale: οἶδα在这里表示知道或意识到；否定式自然译为“不知道”。
- source_word: τί ἀποκριθῇ
  choice: 该回答什么
  rationale: ἀποκρίνομαι具有“回答、回应”的含义；τί加虚拟语气在此表达斟酌意味，现代汉语自然译为“该回答什么”。
- source_word: ἔκφοβοι
  choice: 吓坏了
  rationale: ἔκφοβος表达强烈恐惧，不只是一般的“害怕”；“吓坏了”清楚而自然地保留其加强语气。
- source_word: ἐγένοντο
  choice: 都吓坏了
  rationale: γίνομαι表示进入某种状态；汉语“吓坏了”本身含有变成极其恐惧状态的动态意味，无需生硬译作“变得”。“都”也清楚体现复数主语。
- source_word: γὰρ ... γὰρ
  choice: 因为……；……
  rationale: 第一个γάρ译为“因为”，承接上文并说明彼得发言的原因。第二个γάρ继续解释他为何不知如何回答；汉语用分号并列解释更自然，若重复“因为”则显得累赘，但逻辑关系仍被保留。
theological_decisions:
- issue: 复数分句的主语
  choice: 他们都吓坏了
  alternative: 他吓坏了
  rationale: 形容词ἔκφοβοι和动词ἐγένοντο均为复数，因此不能缩减为彼得一人；上下文中最自然地指彼得和同伴。
- issue: 第二个γάρ的解释范围
  choice: 将“他们都吓坏了”保留为对彼得不知如何回答的进一步解释
  alternative: 把它处理成与前句无明显因果关系的独立陈述
  rationale: 重复的γάρ形成层层说明：彼得之所以如此说，是因为不知道该怎样回答，而这又是因为他们极其恐惧。中文标点和语序保留这种关系，同时避免机械重复连接词。
translation_notes:
  register: 采用现代、庄重而口语可懂的普通话。“该回答什么”简洁自然；“吓坏了”虽较通俗，但准确传达ἔκφοβοι的强烈程度。分号呈现两层解释关系。所有脚注标记均置于正文相应位置。
