  to: 因为他在教导门徒，对他们说：“人子正被交到人的手中[a]，他们要杀死他；他被杀以后，过了三天[b]，他要复活。”
  rationale: 修订仅处理脚注b的语义准确性，并轻微调整两处汉语表达。正文仍按原文保留：人子被交付给未指名的人、他们将杀害他、他被杀后过三天复活；没有指定交付的施事者，也没有把‘过了三天’调和为‘第三天’。
