id: MRK.9.31
reference: Mark 9:31
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐδίδασκεν γὰρ τοὺς μαθητὰς αὐτοῦ καὶ ἔλεγεν αὐτοῖς ὅτι Ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται εἰς χεῖρας ἀνθρώπων, καὶ ἀποκτενοῦσιν αὐτόν, καὶ ἀποκτανθεὶς ⸂μετὰ τρεῖς ἡμέρας⸃ ἀναστήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/031.yaml
  text: For he was teaching his disciples and telling them[a], “The Son of Man is being handed over into the hands of men, and they will kill him, and after he is killed[b], after three days he will rise.”
translation:
  language: zh_hans
  text: 因为他在教导门徒，对他们说：“人子正被交到人的手中[a]，他们要杀死他；他被杀以后，过了三天[b]，他要复活。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊原文直译为“进入人的手中”，意思是落入人的掌控之下。
    reason: 说明原文具体惯用语及其含义。
  - marker: b
    text: 希腊原文直译为“在三天以后”或“过了三天”。本节采用这一表述，不直接改作“第三天”。
    reason: 保留μετὰ加宾格的通常时间意义，并避免将本节与其他经文中不同的计日措辞混同。
lexical_decisions:
- source_word: ἐδίδασκεν
  choice: 一直在教导
  rationale: 未完成时描写持续进行的教导；“一直在教导”在现代汉语中自然地表达其延续性。
- source_word: γὰρ
  choice: 因为
  rationale: 承接上文并说明原因；“因为”清楚保留解释性的连接作用。
- source_word: τοὺς μαθητὰς αὐτοῦ
  choice: 门徒
  rationale: “门徒”是福音书语境中自然且通行的译法，兼有学习者与跟随者的关系含义；汉语中不必另译物主代词。
- source_word: ἔλεγεν αὐτοῖς
  choice: 对他们说
  rationale: 与前面的持续教导相连，表达耶稣在教导过程中反复或持续告诉门徒；汉语无需再次使用进行标记。
- source_word: Ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人子
  rationale: 保留这一固定称号及其可能具有的《但以理书》背景，不作解释性改写。
- source_word: παραδίδοται
  choice: 正被交到
  rationale: 保留现在时的临近、正在展开之感和被动语态；不译成“被出卖”，以免将含义过早限定为背叛。
- source_word: εἰς χεῖρας ἀνθρώπων
  choice: 人的手中
  rationale: 保留“交到……手中”这一表示落入他人权势之下的具体惯用语，也保留“人子”与“人”的措辞呼应。
- source_word: ἀποκτενοῦσιν
  choice: 他们要杀死他
  rationale: 直接表达将来主动复数形式；“他们”承接前面的未明确指名的人类行动者。
- source_word: ἀποκτανθεὶς
  choice: 他被杀以后
  rationale: 保留不定过去时被动分词所表示的先行动作，以及被杀的被动语态。
- source_word: μετὰ τρεῖς ἡμέρας
  choice: 过了三天
  rationale: μετά加宾格通常表示“在……之后”；此译法保留本节的时间表述，不与其他经文的“第三天”静默调和。
- source_word: ἀναστήσεται
  choice: 他将复活
  rationale: 以汉语自然的主动、不及物表达对应将来中间语态；“复活”在此语境中准确表达从死里起来，同时不改译为被动的“被使复活”或“被复活”。
theological_decisions:
- issue: παραδίδοται的语态、施事者与含义范围
  choice: 正被交到
  alternative: 将被出卖；将被交付
  rationale: 希腊文使用被动语态而未说明施事者，其含义可涵盖背叛、拘捕、交付以及神的许可。所选译法保留这些层次之间的张力，不将经文限缩为单一行动或单一施事者。
- issue: “人子”与ἀνθρώπων之间的措辞呼应
  choice: 人子……人的手中
  alternative: 人子……世人手中；人子……人类手中
  rationale: “人”既可泛指人类行动者，也能在汉语中保留“人子”与“人”之间的修辞呼应；译文不据此附加超出原文的教义判断。
- issue: ἀναστήσεται的语态
  choice: 他将复活
  alternative: 他将被复活；他将起来
  rationale: 希腊文是将来中间语态，适合译作不及物的“复活”；不改成被动式，以免输入本句语法并未明说的施事表达。
- issue: “过了三天”与“第三天”的关系
  choice: 过了三天
  alternative: 第三天；三天内
  rationale: 按本节希腊文μετὰ τρεῖς ἡμέρας直译其“在三天之后”的形式，同时用脚注说明古代计日表达可能与“第三天”并用，避免在正文中静默调和。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“一直在教导”体现未完成时的持续背景；“正被交到人的手中”有意保留原文现在被动式及未说明施事者的张力。句末依照希腊文顺序先说被杀，再说三天以后复活。
