  text: where[a] their worm does not die, and the fire is not quenched.
translation:
  language: zh_hans
  text: 在那里[a]，他们的虫不死，火也不灭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节不见于现存最早的一批希腊文抄本（包括四世纪的西奈抄本和梵蒂冈抄本）及早期科普特语译本，但见于五世纪的亚历山大抄本、拉丁文传统和较晚的拜占庭多数抄本。它很可能是后来的抄写者从第48节补入的，因为两处希腊文措辞完全相同。
    reason: textual_critical
lexical_decisions:
- source_word: σκώληξ
  choice: 虫
  rationale: 指蛆虫或以腐物为食的虫；译作“虫”简洁自然，也保留了《以赛亚书》66:24的意象与措辞联系。
- source_word: τελευτᾷ
  choice: 死
  rationale: τελευτάω可表示“到尽头”或“死亡”；主语是活物“虫”，译作“不死”最自然准确。
- source_word: σβέννυται
  choice: 灭
  rationale: 这是现在时被动形式，意为被熄灭；汉语惯用“火不灭”既准确又庄重，并保留持续不熄的含义。
- source_word: ὅπου
  choice: 在那里
  rationale: 该关系副词承接上文所说的地方；译作“在那里”符合现代汉语表达，也保留原文的空间指向。
theological_decisions:
- issue: “他们的虫”这一惩罚意象的表达
  choice: 保留直译“他们的虫”，不解释其具体所指
  alternative: 释义为“啃噬他们的虫”或“尸虫”
  rationale: 原文沿用《以赛亚书》66:24的浓缩意象，本身未明确说明虫与“他们”的具体关系；直译可保留其歧义和神学张力，避免在正文中添加解释。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“虫不死，火也不灭”保留原文平行结构及经文传统回响；正文依所给拜占庭希腊文本翻译，同时用脚注如实说明重要的文本异文。
