source:
  edition: SBLGNT
  text: Ὃς ⸀ἂν ἓν τῶν τοιούτων παιδίων δέξηται ἐπὶ τῷ ὀνόματί μου, ἐμὲ δέχεται· καὶ ὃς ⸁ἂν ἐμὲ ⸀δέχηται, οὐκ ἐμὲ δέχεται ἀλλὰ τὸν ἀποστείλαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/037.yaml
  text: Whoever receives one of such children in my name receives me; and whoever receives me receives not me, but the one who sent me.
translation:
  language: zh_hans
  text: “谁奉我的名接待这类孩子中的一个，谁就是接待我；谁接待我，所接待的不是我，而是差我来的那一位。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὃς ἂν
  choice: 谁……谁就……
  rationale: 关系代词与ἄν构成泛指条件；汉语用“谁……谁就……”自然表达“无论谁”的普遍条件关系。
- source_word: ἓν τῶν τοιούτων παιδίων
  choice: 一个这样的孩子
  rationale: 保留ἓν的单数和τοιούτων“这样的、这一类的”之定性含义；汉语不宜生硬直译为“这类孩子中的一个”。
- source_word: δέξηται / δέχεται / δέχηται
  choice: 接待
  rationale: δέχομαι在此可指接受或欢迎；“接待”既自然适用于孩子，也能贯穿接待耶稣与差他来者的宾客、代表性语境，并保留各分句中的词语重复。
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: 奉我的名
  rationale: 表达因耶稣的名、以他的名义或基于与他的关系而行动；“奉我的名”简洁且保留“名”所承载的身份与权柄意味。
- source_word: οὐκ ἐμὲ δέχεται ἀλλὰ
  choice: 所接待的不是我，而是
  rationale: 保留οὐκ…ἀλλά的鲜明对比，不增译“不是只接待我”，从而保存原文表面上带有张力的表达。
- source_word: τὸν ἀποστείλαντά με
  choice: 差我来的那一位
  rationale: 以实词化关系短语表达带冠词的过去主动分词，保留差遣关系，同时用“那一位”自然指称差遣者。
theological_decisions:
- issue: 末句“不是我，而是差我来的那一位”的对比力度
  choice: 按原文保留排他形式：“不是我，而是……”
  alternative: 解释性译为“不是只接待我，也是接待差我来的那一位”
  rationale: 原文使用οὐκ…ἀλλά，而非“不是只……也是……”。虽上下文表明接待耶稣确实就是接待耶稣，句子的重点却把接待关系推进到差遣他的那一位；正文不应以解释性增词消解这种神学张力。
- issue: 接待孩子、耶稣与差遣者之间的代表关系
  choice: 在三个相关分句中一贯使用“接待”
  alternative: 分别译作“欢迎孩子”“接受我”“接受差我来的那一位”
  rationale: 重复同一动词可呈现原文刻意建立的连锁关系，避免因汉语润色而削弱身份与差遣之间的关联。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“一个这样的孩子”兼顾τοιούτων的类别意味与汉语自然度；标点划分两层递进关系。未设置脚注，因为主要词义与结构可在正文中充分表达，且没有必须另列的文本异读。
