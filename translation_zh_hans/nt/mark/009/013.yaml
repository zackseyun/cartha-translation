  rationale: 作出仅限文体和搭配的安全修订：以“随意对待他”更自然地表达“他们向他做了他们所愿的一切”，并调整“经上所记”的语序。正文仍保留未明说的行为者及“以利亚”这一原文称谓；脚注仍仅提供上下文解释。
