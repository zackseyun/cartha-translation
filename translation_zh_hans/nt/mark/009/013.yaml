  text: ἀλλὰ λέγω ὑμῖν ὅτι καὶ Ἠλίας ἐλήλυθεν, καὶ ἐποίησαν αὐτῷ ὅσα ⸀ἤθελον, καθὼς γέγραπται ἐπ’ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/013.yaml
  text: But I tell you that Elijah also has come[a], and they did to him whatever they wanted, just as it is written about him.
translation:
  language: zh_hans
  text: 但我告诉你们，以利亚也已经来了[a]，人们随意对待他，正如经上所记关于他的事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 即以利亚已经以施洗约翰的身分和事工来到。见马可福音9:11–12；另参马太福音11:14；17:12–13。
    reason: 交叉引用并说明上下文所暗示的身份关联，同时不把解释加入正文。
lexical_decisions:
- source_word: ἀλλὰ
  choice: 但
  rationale: 承接上文并形成转折，简洁自然。
- source_word: λέγω ὑμῖν
  choice: 我告诉你们
  rationale: 准确保留直接陈述和复数受话对象，也符合现代汉语表达。
- source_word: ὅτι καὶ Ἠλίας ἐλήλυθεν
  choice: 以利亚也已经来了
  rationale: “也”体现 καὶ；“已经来了”表达完成时所强调的到来已经发生，并与当前讨论相关。
- source_word: ἐποίησαν αὐτῷ ὅσα ἤθελον
  choice: 人们任意待他
  rationale: 希腊文主语为未明说的第三人称复数；译作“人们”避免生硬。“任意待他”自然概括“照他们所想要的对待他”，同时保留其恶意和不受约束的意味。
- source_word: καθὼς γέγραπται
  choice: 正如经上……所记的
  rationale: 采用汉语常见的经文引述表达，并保留完成时所指向的既有记载。
- source_word: ἐπ’ αὐτόν
  choice: 关于他
  rationale: 在此与 γράφω 连用，最自然地表示“关于、论到”；不采用语境较不支持的“攻击他”。
theological_decisions:
- issue: 本句中“以利亚”的身份
  choice: 正文只保留“以利亚”，不直接加入施洗约翰的名字
  alternative: 在正文中译为“作为以利亚而来的施洗约翰”或“以利亚已经以施洗约翰的身份来了”
  rationale: 原文明确说“以利亚”，却未在本句直接点明施洗约翰。上下文支持二者的关联，但应由脚注说明，不宜在正文中消除原有的含蓄和张力。
- issue: 未明说的迫害者是谁
  choice: 译为泛指的“人们”
  alternative: 具体译为“希律和他的人”或“他们”
  rationale: 原文只有第三人称复数动词，没有明说行为者；不应擅自限定为某一群体。“人们”在独立成句的现代汉语中比无先行对象的“他们”更自然。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“任意待他”比逐字译作“向他做了他们所想要的一切”更流畅，同时保持原文的开放性和力度。脚注标记[a]已置于相关短语之后。
