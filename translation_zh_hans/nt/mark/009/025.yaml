source:
  edition: SBLGNT
  text: ἰδὼν δὲ ὁ Ἰησοῦς ὅτι ἐπισυντρέχει ὄχλος ἐπετίμησεν τῷ πνεύματι τῷ ἀκαθάρτῳ λέγων αὐτῷ· Τὸ ⸂ἄλαλον καὶ κωφὸν πνεῦμα⸃, ἐγὼ ⸂ἐπιτάσσω σοι⸃, ἔξελθε ἐξ αὐτοῦ καὶ μηκέτι εἰσέλθῃς εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/025.yaml
  text: But when Jesus saw that a crowd was quickly gathering[a], he rebuked the unclean spirit, saying to it, “You mute and deaf spirit, I command you, come out of him and never enter him again.”
translation:
  language: zh_hans
  text: 耶稣看见众人正迅速聚拢过来[a]，就斥责那污灵，对它说：“这不能说话、不能听见的灵，我命令你：从他身上出来，再也不要进入他身上！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“众人正从各处跑来聚集。”希腊语动词含有许多人迅速会合的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν δὲ ὁ Ἰησοῦς
  choice: 耶稣看见
  rationale: 以时间性分词结构自然引出主句；δέ在此是轻微的叙事衔接，汉语不必机械译作“但是”或“于是”。
- source_word: ἐπισυντρέχει ὄχλος
  choice: 众人正迅速聚拢过来
  rationale: ἐπισυντρέχω表示人群从各处快速会合、聚集；“正……过来”也保留现在时所呈现的进行状态。
- source_word: ἐπετίμησεν
  choice: 斥责
  rationale: 保留ἐπιτιμάω在福音书中所表达的严厉责令和权威语气，并与耶稣对污灵的直接命令相称。
- source_word: τῷ πνεύματι τῷ ἀκαθάρτῳ
  choice: 那污灵
  rationale: “污灵”简洁保留ἀκάθαρτος所含的不洁含义，也是现代汉语圣经语境中可理解的称谓，不将其淡化为疾病现象。
- source_word: Τὸ ἄλαλον καὶ κωφὸν πνεῦμα
  choice: 这使人不能说话、不能听见的灵
  rationale: 希腊语以带冠词的主格形式作呼语。结合上下文，这两个形容词描述该灵造成或体现的失语与失聪特征；如此表达比直接称“哑聋的灵”更自然清楚，同时不把两项合并。
- source_word: ἐγὼ ἐπιτάσσω σοι
  choice: 我命令你
  rationale: 准确表达ἐπιτάσσω的权威命令；显明主语“我”保留ἐγώ的强调，而不额外扩写为“我亲自”。
- source_word: ἔξελθε ἐξ αὐτοῦ
  choice: 从他里面出来
  rationale: 贴近希腊语的空间表达和赶逐污灵的语境，同时符合现代汉语习惯。
- source_word: καὶ μηκέτι εἰσέλθῃς εἰς αὐτόν
  choice: 再也不要进去
  rationale: μηκέτι加禁止性虚拟语气表达对今后再次进入的明确禁令；汉语承接前句时省略重复的“他里面”更自然，所指仍清楚。
theological_decisions:
- issue: 污灵的称谓与耶稣权威的表达
  choice: 将πνεῦμα τὸ ἀκάθαρτον译为“污灵”，将ἐπετίμησεν和ἐπιτάσσω分别译为“斥责”和“命令”
  alternative: “邪灵／不洁之灵”；“严厉地对它说／吩咐”
  rationale: 原文把该灵呈现为受耶稣直接称呼和命令的主体。译文既不将其改释为单纯疾病，也不添加原文没有的恶魔论说明；强有力的动词保留耶稣命令的直接权威。
- issue: ἄλαλον καὶ κωφὸν所修饰对象的表达
  choice: 译作“这使人不能说话、不能听见的灵”
  alternative: “这又哑又聋的灵”或“哑聋的灵”
  rationale: 语法上两个形容词直接修饰“灵”，但在叙事情境中也表明这灵与男孩不能说话、不能听见的状况相关。功能性表达避免让现代读者误以为重点是灵本身具有生理器官障碍，同时不把经文简化成纯医学诊断。
translation_notes:
  register: 采用自然、庄重而清楚的现代标准汉语。“聚拢过来”保留现场的动态感；直接引语用短促命令句体现权威。脚注标记[a]已置于相应主文位置。
