  verdict: revise
  source_fidelity: 主句和命令的基本结构译得准确：耶稣看见人群迅速聚集，斥责污灵，并命令它离开且不得再进入。可是“这使人不能说话、不能听见的灵”把原文直接修饰“灵”的两个形容词改成了该灵对人造成的作用；虽与上下文相合，却属于不必要的解释性扩写。应保留原文的直接称呼及其歧义空间。
  naturalness: 整体庄重、通顺。“众人正迅速聚拢过来”自然地呈现人群正在快速会合。“从他里面出来”可理解，但“从他身上出来”在现代汉语的赶鬼叙事中更顺畅，同时仍能表达ἐξ αὐτοῦ。末句宜补出“他身上”，使禁止再次进入的对象明确。
  terminology: “污灵”可对应πνεῦμα ἀκάθαρτον，并保留福音书的术语性质；“斥责”“我命令你”也恰当地表达ἐπετίμησεν和ἐπιτάσσω。称呼应改为“这不能说话、不能听见的灵”，避免将原文的直接描述改释为致病功能。
