  text: καὶ τὸν λόγον ἐκράτησαν πρὸς ἑαυτοὺς συζητοῦντες τί ἐστιν τὸ ἐκ νεκρῶν ἀναστῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/010.yaml
  text: And they kept the matter to themselves[b][a], discussing what it meant to rise from the dead.
translation:
  language: zh_hans
  text: 他们把这话留在彼此之间[a]，讨论“从死人中复活”是什么意思[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们持守这话，只在彼此之间谈论。”
    reason: 原文ἐκράτησαν既可侧重把话保留在他们中间，也可带有牢牢记住、持守的意味。
  - marker: b
    text: 原文直说“从死人中起来”，并使用带冠词的不定式结构，指“从死人中起来”这件事；正文按现代汉语表达为“是什么意思”。
    reason: 说明原文的名词性不定式结构，并保留ἐκ νεκρῶν“从死人中”的措辞。
lexical_decisions:
- source_word: τὸν λόγον
  choice: 这话
  rationale: λόγος在这里回指耶稣刚才所说的话（第9节）；“这话”既自然，也比泛指的“这件事”更贴近原文。
- source_word: ἐκράτησαν πρὸς ἑαυτοὺς
  choice: 留在彼此之间
  rationale: κρατέω与πρὸς ἑαυτούς合用，表示门徒把这话保留在自己的圈子里；此译也保留了“彼此之间”可能包含私下共同谈论的意味。
- source_word: συζητοῦντες
  choice: 讨论
  rationale: 该词表示共同探究或议论；“讨论”不额外加入争辩或冲突的色彩。
- source_word: τί ἐστιν
  choice: 是什么意思
  rationale: 字面为“是什么”，但此处门徒是在探究该说法的含义；“是什么意思”符合现代汉语，同时保留他们的不理解。
- source_word: τὸ ἐκ νεκρῶν ἀναστῆναι
  choice: “从死人中复活”
  rationale: 采用名词性引语来呈现带冠词的不定式结构；“从死人中”较明确地保留ἐκ νεκρῶν所表达的“从死者当中出来”，而不只译作较宽泛的“死而复活”。
theological_decisions:
- issue: 门徒所讨论的复活用语
  choice: “从死人中复活”是什么意思
  alternative: “从死里复活”是什么意思
  rationale: “从死人中”更直接保留ἐκ νεκρῶν的表达，同时不替门徒解释这一说法，也不把后来的教义认识带入他们当时的疑问。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“这话”承接上文；引号标明门徒正在讨论耶稣所用的具体说法。
