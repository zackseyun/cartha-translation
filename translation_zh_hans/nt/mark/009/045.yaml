source:
  edition: SBLGNT
  text: καὶ ἐὰν ὁ πούς σου σκανδαλίζῃ σε, ἀπόκοψον αὐτόν· καλόν ἐστίν ⸀σε εἰσελθεῖν εἰς τὴν ζωὴν χωλὸν ἢ τοὺς δύο πόδας ἔχοντα βληθῆναι εἰς τὴν ⸀γέενναν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/045.yaml
  text: And if your foot causes you to stumble[a], cut it off. It is better for you to enter into life lame than, having both feet, to be thrown into Gehenna.
translation:
  language: zh_hans
  text: 如果你的脚使你失足，就把它砍掉。对你来说，瘸着进入生命，胜过双脚齐全却被扔进革亨拿[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“地狱”。“革亨拿”（Gehenna）是希腊语原词，名称与欣嫩谷有关，并带有上帝审判的含义。
    reason: 说明γέεννα的历史背景和审判语境，并提供传统的解释性译法，而不把正文的专门术语直接缩窄为地名或预设为单一译法。
lexical_decisions:
- source_word: σκανδαλίζῃ
  choice: 使你失足
  rationale: 保留原文“绊倒、跌倒”的比喻，也让现代读者能够领会陷入罪或背离正道的含义，而不把词义缩窄为单纯的“使你犯罪”。
- source_word: ἀπόκοψον
  choice: 把它砍掉
  rationale: 准确传达不定过去时命令语气的强烈、具体和震撼性，不将这一夸张鲜明的命令弱化为“除掉”。
- source_word: καλόν ἐστίν … ἢ
  choice: 胜过
  rationale: 在带有ἢ的比较结构中，καλόν具有“更好”的惯用含义；用“胜过”使汉语比较关系清楚自然。
- source_word: εἰσελθεῖν εἰς τὴν ζωὴν
  choice: 进入生命
  rationale: 保留“进入”的意象和末世生命的庄重含义；原文只说“生命”，因此不擅自扩写为“永生”。
- source_word: χωλὸν
  choice: 瘸着腿
  rationale: χωλός特指行动上的跛瘸；结合脚被砍掉的语境，“瘸着腿”比泛指残疾的表达更准确，也更符合现代汉语。
- source_word: βληθῆναι
  choice: 被扔进
  rationale: 直接体现βάλλω被动式的强烈动作；“扔进”是现代汉语中自然且有力度的说法。
- source_word: γέενναν
  choice: 欣嫩谷
  rationale: γέεννα源自欣嫩谷这一具体名称，并在犹太语境中承载上帝审判的联想。正文保留其历史和语言上的特指性，脚注说明传统译法“地狱”。
- source_word: τοὺς δύο πόδας ἔχοντα
  choice: 双脚齐全
  rationale: 自然传达“有两只脚”的分词短语，并与“瘸着腿”形成清晰鲜明的对比。
theological_decisions:
- issue: 审判语境中γέεννα的译法
  choice: 欣嫩谷
  alternative: 地狱
  rationale: 原文使用的是具有特定历史和犹太末世审判联想的γέεννα，而非泛指来世刑罚之处的普通词。正文采用“欣嫩谷”以保留原词的具体性，脚注列出读者熟悉的传统译法，避免在正文中把概念预先泛化。
translation_notes:
  register: 采用现代、庄重而直接的普通话。保留耶稣话语中鲜明强烈的身体意象，不予淡化；“失足”兼具实际跌倒与陷入罪恶的比喻空间。脚注标记置于“欣嫩谷”之后，以对应脚注实际解释的词语。
