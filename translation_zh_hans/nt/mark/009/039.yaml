base_translation:
  language: en
  yaml_path: translation/nt/mark/009/039.yaml
  text: But Jesus said[a], “Do not stop him[b], for there is no one who will do a mighty work in my name and soon be able to speak evil of me.”
translation:
  language: zh_hans
  text: 耶稣却说：“不要拦阻他，因为没有人会奉我的名行一件大能的事[a]，又能很快说我坏话[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“行神迹”或“行有能力的作为”；希腊语δύναμιν意为“能力”或“大能”，此处指大能的作为。
    reason: lexical_alternative
  - marker: b
    text: 或译：“辱骂我”或“毁谤我”；希腊语意为“说我坏话”或“恶言攻击我”。
    reason: lexical_alternative
lexical_decisions:
- source_word: κωλύετε
  choice: 拦阻
  rationale: μή加现在时命令式在本语境中表达禁止；“不要拦阻他”既自然，也保留阻止对方继续行动的含义。
- source_word: δύναμιν
  choice: 大能的事
  rationale: δύναμις本义涉及能力、力量，在福音书中也可指彰显能力的非凡作为。“大能的事”保留其词义宽度，避免将其过早限定为现代汉语所理解的“神迹”。
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: 奉我的名
  rationale: 在此语境中表示借着耶稣之名并在其名所代表的权柄下行事；“奉我的名”是清楚自然的现代汉语表达。
- source_word: ταχὺ
  choice: 很快就
  rationale: 此副词表达时间上的迅速或不久之后；“很快就”自然地修饰随后说坏话的可能性。
- source_word: κακολογῆσαί
  choice: 说我的坏话
  rationale: 该动词泛指恶言相向、辱骂或毁谤。“说我的坏话”保留较宽的语义范围，不将其限定为法律意义上的诽谤或正式咒诅。
- source_word: οὐδεὶς γάρ ἐστιν ὃς
  choice: 因为没有人……
  rationale: 保留原文“没有人……会……”的概括性结构和因果连接，同时符合现代汉语习惯。
- source_word: δυνήσεται
  choice: 还能
  rationale: 未来式的δύναμαι表示随后有能力或可能做某事；“还能”在汉语中自然承接前一行动，并保留能力语气。
theological_decisions:
- issue: 奉耶稣之名所行之事的性质
  choice: 译为“大能的事”
  alternative: “神迹”或“有能力的作为”
  rationale: 原文δύναμις可指能力，也可指彰显能力的非凡作为。“大能的事”既贴近原词，又不把所指过度收窄为某一种神迹观念。
- issue: 此人与耶稣关系的含义
  choice: 只陈述奉耶稣之名行大能之事的人不会很快说他坏话
  alternative: 增译为真正门徒，或暗示此人只是利用耶稣之名
  rationale: 本节只说明这两种行为在短时间内难以并存，并未明确判断此人的完整门徒身份、动机或教义立场，因此不作额外推断。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“拦阻”“奉我的名”延续经文语域而不过分古雅；“大能的事”保留原文词义张力，脚注列出较常见的替代译法。所有脚注标记均置于其所说明的词语之后。
