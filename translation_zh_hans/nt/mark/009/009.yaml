  source_fidelity: 正文准确传达了下山、耶稣的命令、不得向任何人讲述所见之事、人子从死人中复活这一核心内容。“从死人中复活”恰当保留了ἐκ νεκρῶν的复数群体意象。惟“除非等到……以后”在现代汉语中把例外条件与等待结构叠加，句法和逻辑关系都不够清晰；改为明确的时间禁令可忠实表达此处εἰ μὴ ὅταν的实际语义。
  naturalness: “除非等到人子从死人中复活以后”不够自然：“除非”通常引出条件，“等到……以后”又引出时间界限，组合后显得重复且稍有歧义。改作“在人子从死人中复活以前……不要……”是现代标准汉语中清楚、庄重且自然的叙事表达。
  terminology: “人子”和“从死人中复活”均应保留。“吩咐”比“嘱咐”更能体现διεστείλατο在本处的明确指令性质，同时仍符合现代叙事语体。
