  rationale: 修订以“在人子从死人中复活以前”自然表达原文禁令在复活后解除的时间限制，避免“除非等到……以后”的汉语搭配问题。脚注保留εἰ μὴ ὅταν较贴近字面的例外—时间表达，且不把其句法争议过度解释。补出“从山上”以对应ἐκ τοῦ ὄρους，并将“嘱咐”调整为更具命令性的“吩咐”。
