  text: ⸂Καὶ καταβαινόντων⸃ αὐτῶν ⸀ἐκ τοῦ ὄρους διεστείλατο αὐτοῖς ἵνα μηδενὶ ⸂ἃ εἶδον διηγήσωνται⸃, εἰ μὴ ὅταν ὁ υἱὸς τοῦ ἀνθρώπου ἐκ νεκρῶν ἀναστῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/009.yaml
  text: And as they were coming down from the mountain[a], he ordered them to tell no one what they had seen[b], except when the Son of Man had risen from among the dead.
translation:
  language: zh_hans
  text: 他们从山上下来时，耶稣吩咐他们：在人子从死人中复活以前，不要把所看见的事告诉任何人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“除非当人子从死人中复活的时候。”
    reason: alternative_reading
lexical_decisions:
- source_word: καταβαινόντων αὐτῶν ἐκ τοῦ ὄρους
  choice: 他们下山的时候
  rationale: 属格独立结构表达与主句同时发生的持续动作；“下山的时候”自然、清楚，并保留山上的叙事场景。
- source_word: διεστείλατο αὐτοῖς
  choice: 耶稣嘱咐他们
  rationale: 该动词表示郑重地发出指示或命令。“嘱咐”符合现代汉语叙事语体，保留其约束力，又不显生硬；主语按上下文明确为耶稣。
- source_word: ἵνα μηδενὶ ἃ εἶδον διηγήσωνται
  choice: 不要把所看见的事告诉任何人
  rationale: 自然呈现命令的内容，并保留μηδενί“任何人都不”和διηγέομαι“讲述、叙说”的含义。
- source_word: εἰ μὴ ὅταν
  choice: 除非等到……以后
  rationale: “除非”保留εἰ μή的例外形式，“等到……以后”则自然表达ὅταν所指向的未来时间点，避免仅译作“直到”而抹平原文形式。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人子
  rationale: 沿用简洁而通行的圣经称谓，保留其称号性质及可能的《但以理书》背景，不释义为泛指的人。
- source_word: ἐκ νεκρῶν
  choice: 从死人中
  rationale: ἐκ表示从某一群体之中出来；“从死人中”比单说“从死里”更直接保留复数νεκρῶν及‘从死者当中’的含义。
- source_word: ἀναστῇ
  choice: 复活
  rationale: 在死人语境中，ἀνίστημι指从死中起来；“复活”是自然、明确且不过度增释的汉语表达。
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου的称号表达
  choice: 人子
  alternative: 那位属人的／人之子
  rationale: “人子”既是现代中文读者熟悉的耶稣自称，也保留原表达的称号性和经文互文空间；改作解释性称呼会过早限定其意义。
- issue: εἰ μὴ ὅταν的时间与例外关系
  choice: 除非等到人子从死人中复活以后
  alternative: 直到人子从死人中复活
  rationale: 原文形式是“除非／除了……时候”，而实际语境形成时间禁令。正文兼用“除非”和“等到……以后”，既保留形式上的例外关系，也让现代汉语读者清楚禁令在复活后解除。
- issue: ἐκ νεκρῶν的范围含义
  choice: 从死人中复活
  alternative: 从死里复活
  rationale: 选择“从死人中”以保留复数名词所呈现的‘从死者当中’这一图景，不据此额外说明其他死者的状态或复活次序。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事汉语。“嘱咐”表达郑重指示；“除非等到……以后”略带刻意的结构感，用来保留希腊文εἰ μὴ ὅταν兼具例外与时间限制的张力。脚注标记已在正文中出现。
