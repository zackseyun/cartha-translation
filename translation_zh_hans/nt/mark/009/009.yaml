    rationale: εἰ μὴ ὅταν字面含有例外与时间成分，但在此语境中的功能是规定禁令持续至复活之后。汉语若机械并列“除非”和“等到……以后”，会产生冗余，并可能被读作另一项条件。应以“在……以前”表达禁令的时间范围，并以脚注说明较贴近原文形式的译法。
  - severity: low
