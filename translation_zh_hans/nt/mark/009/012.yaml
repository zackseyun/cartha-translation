  text: ὁ δὲ ⸀ἔφη αὐτοῖς· Ἠλίας μὲν ἐλθὼν πρῶτον ⸀ἀποκαθιστάνει πάντα, καὶ πῶς γέγραπται ἐπὶ τὸν υἱὸν τοῦ ἀνθρώπου ἵνα πολλὰ πάθῃ καὶ ⸀ἐξουδενηθῇ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/012.yaml
  text: He said to them[a], “Elijah indeed, having come first, restores all things. And how is it written about the Son of Man that he should suffer many things and be treated with contempt?”
translation:
  language: zh_hans
  text: 他对他们说：“以利亚固然先来，恢复一切；而经上关于人子是怎么写的呢？不是说他要受许多苦，并被人藐视[a]吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“被视为无足轻重”。希腊语动词含有把某人看作不重要、予以鄙弃的意思。
    reason: 说明ἐξουδενηθῇ可指被视为毫无价值或不重要，并保留较贴近该词语义范围的替代译法。
lexical_decisions:
- source_word: ἔφη αὐτοῖς
  choice: 他对他们说
  rationale: 采用现代汉语自然的叙事引语格式，准确保留说话对象。
- source_word: Ἠλίας μὲν ἐλθὼν πρῶτον
  choice: 以利亚固然先来
  rationale: “先来”表达ἐλθὼν πρῶτον相对于恢复行动的先行关系；“固然”体现μέν所标示的承接与对照，同时为后句保留张力。
- source_word: ἀποκαθιστάνει πάντα
  choice: 恢复一切
  rationale: “恢复”表达使事物回到原有或应有状态的含义；“一切”保留πάντα宽泛而未限定的指向，不擅自说明具体所指。
- source_word: πῶς γέγραπται ἐπὶ τὸν υἱὸν τοῦ ἀνθρώπου
  choice: 经上关于人子是怎么写的呢
  rationale: “经上……写”保留γέγραπται指向圣经记载的惯用语义；“关于”准确表达ἐπί在此的论及含义；问句形式保留原文的修辞张力。
- source_word: υἱὸν τοῦ ἀνθρώπου
  choice: 人子
  rationale: 沿用福音书中这一重要称号的通行中文译法，不改写为“弥赛亚”等解释性称谓。
- source_word: ἵνα πολλὰ πάθῃ
  choice: 不是说他要受许多苦……吗
  rationale: 以汉语反问句承接前面的“怎么写”，使ἵνα所引出的记载内容清楚自然；“受许多苦”保留πολλά的复数性与广度。
- source_word: ἐξουδενηθῇ
  choice: 被人藐视
  rationale: 既保留被动含义，也表达被视为无足轻重、遭到鄙弃的语义；其他较展开的译法列入脚注。
theological_decisions:
- issue: 以利亚恢复一切与人子受苦之间的关系
  choice: 保留两个陈述的并置，并将后半句译为修辞问句
  alternative: 用“然而，这怎么可能……”等措辞明确解释两者为逻辑冲突，或直接改写为教义说明
  rationale: 原文以καὶ πῶς引出问题，却没有在本节内消解恢复与受苦之间的张力；译文因此不替读者补出解释。
- issue: “人子”的所指
  choice: 保留“人子”这一称号
  alternative: 译作“弥赛亚”或直接改为“我”
  rationale: 这些替代说法虽可能表达上下文中的解释，却超出原文称号本身，会削弱其经文互文和神学含义。
- issue: ἵνα在经文记载问句中的功能
  choice: 译成“不是说他要……吗”，表达经上所写的内容与预期
  alternative: 译为严格目的关系“为要使他……”
  rationale: 这里的ἵνα自然地引出经上关于人子的内容；译成目的关系会在汉语中造成不必要的神学限定。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“固然……可是……”使句间关系清楚，但不消除原文的神学张力；“恢复一切”“受许多苦”“被人藐视”均保持简洁，并避免加入宗派性解释。
