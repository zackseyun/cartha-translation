  text: καὶ ἐπηρώτησεν τὸν πατέρα αὐτοῦ· Πόσος χρόνος ἐστὶν ὡς τοῦτο γέγονεν αὐτῷ; ὁ δὲ εἶπεν· ⸀Ἐκ παιδιόθεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/021.yaml
  text: And he asked his father[a], “How long has this been happening to him?” And he said, “From childhood.”
translation:
  language: zh_hans
  text: 他问孩子的父亲：“他这样有多久了？”父亲说：“从小[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“自幼。”
    reason: 说明Ἐκ παιδιόθεν也可用较书面的“自幼”表达；两种译法都以幼年为起点。
lexical_decisions:
- source_word: ἐπηρώτησεν
  choice: 问
  rationale: 这里的动词引出直接问话；“问”自然准确，不额外加入盘问或正式询问的意味。
- source_word: τὸν πατέρα αὐτοῦ
  choice: 孩子的父亲
  rationale: αὐτοῦ在上下文中指受折磨的孩子。汉语若直译为“他的父亲”，指代容易含混，因此用“孩子的父亲”作必要澄清。
- source_word: Πόσος χρόνος ἐστὶν ὡς
  choice: 有多久了
  rationale: 这一结构询问某种情况从开始至今持续的时间；“有多久了”符合现代汉语习惯，并保留持续至今的含义。
- source_word: τοῦτο γέγονεν αὐτῷ
  choice: 他这样
  rationale: γέγονεν为完成时，结合语境表示这种情况一直存在至今。“他这样”简洁自然，也不把原文笼统的τοῦτο过度具体化。
- source_word: ὁ δὲ εἶπεν
  choice: 父亲说
  rationale: δέ在此主要推进叙事，不必译出强烈转折。为避免连续使用“他”造成指代不清，明确为“父亲”。
- source_word: Ἐκ παιδιόθεν
  choice: 从小
  rationale: ἐκ与παιδιόθεν表示起点在幼年时期。“从小”简洁、自然，准确表达原意。
theological_decisions: []
translation_notes:
  register: 采用现代、简洁而庄重的叙事语言。通过“孩子的父亲”和“父亲说”消除汉语代词歧义，同时保留原文对病况的概括说法“这样”，不擅自具体化其性质。
