id: MRK.9.18
reference: Mark 9:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ὅπου ⸀ἐὰν αὐτὸν καταλάβῃ ῥήσσει αὐτόν, καὶ ἀφρίζει καὶ τρίζει τοὺς ⸀ὀδόντας καὶ ξηραίνεται· καὶ εἶπα τοῖς μαθηταῖς σου ἵνα αὐτὸ ἐκβάλωσιν, καὶ οὐκ ἴσχυσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/018.yaml
  text: And wherever it seizes him[a], it throws him down, and he foams and grinds his teeth and becomes rigid. And I told your disciples to cast it out, but they were not able.
translation:
  language: zh_hans
  text: 它无论在什么地方抓住他，就把他摔倒在地；他就口吐白沫，磨牙，身体僵直[a]。我曾对你的门徒说，叫他们把它赶出去，他们却办不到。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“渐渐消瘦”；也可按字面译为“枯干”或“枯萎”。
    reason: 保留ξηραίνεται的词义歧义：正文依症状语境译作“身体僵直”，但该词的基本义可指干枯、枯萎，具体含义存在讨论。
lexical_decisions:
- source_word: ὅπου ἐὰν
  choice: 无论……在哪里
  rationale: 这一组合表达不定关系和反复发生的可能情形；“无论……在哪里”在现代汉语中自然地保留了这种语气。
- source_word: καταλάβῃ
  choice: 抓住
  rationale: 此处指污灵敌意地控制或攫住孩子；“抓住”简洁、形象，又不额外说明控制的方式。
- source_word: ῥήσσει
  choice: 把他摔倒
  rationale: 该动词在这里描写污灵对孩子造成的猛烈身体动作。“摔倒”比字面化的“撕裂”更符合上下文，也避免让人误以为身体被撕伤。
- source_word: ἀφρίζει
  choice: 口吐白沫
  rationale: 原词意为“起沫、吐沫”。现代汉语通常以“口吐白沫”描述这种身体症状；“口”虽属语境性补足，却使表达清楚自然。
- source_word: τρίζει τοὺς ὀδόντας
  choice: 咬牙切齿
  rationale: 短语指牙齿彼此磨轧。“咬牙切齿”是现代汉语的惯用表达，在此按身体症状理解，而非引入愤怒的含义。
- source_word: ξηραίνεται
  choice: 身体僵硬
  rationale: 在一连串发作症状中，“身体僵硬”是通顺且符合语境的理解；但原词通常有“干枯、枯萎”的意思，因此用脚注保留词义上的真实歧义。
- source_word: εἶπα
  choice: 我叫
  rationale: 在“对某人说，要他做某事”的结构中，“我叫你的门徒……”自然表达吩咐或请求他们采取行动，不使汉语显得生硬。
- source_word: ἐκβάλωσιν
  choice: 赶出去
  rationale: ἐκβάλλω在驱逐污灵的语境中意为逐出或赶出；“赶出去”是普通读者容易理解的现代汉语。
- source_word: οὐκ ἴσχυσαν
  choice: 他们却办不到
  rationale: 原文表示没有能力或力量做到。“办不到”清楚传达实际上的无能为力，又不推断失败的原因。
theological_decisions:
- issue: “把它赶出去”中αὐτό所指为何
  choice: 按紧邻叙事语境理解为折磨孩子的污灵，并保留中性代词“它”。
  alternative: 也可较笼统地理解为要除去这种折磨或病患。
  rationale: 上下文描写一个抓住孩子、需要被赶出的敌对灵体；“把它赶出去”既符合驱灵语境，也没有超出希腊文代词而另加名称。
- issue: ξηραίνεται所描述的状态
  choice: 正文采用语境性理解“身体僵硬”。
  alternative: 可译为“干枯”“枯萎”“渐渐枯瘦”或“衰弱”。
  rationale: 症状序列支持“僵硬”的理解，但该动词的常见词义并不等同于“僵硬”；因此不应把争议悄然消除，而应在脚注中保留其他可能。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“口吐白沫”“咬牙切齿”让症状描写清楚有力；分号区分污灵的动作与孩子随后的表现。“它”保持原文代词的简洁，不在正文额外补出“污灵”。
