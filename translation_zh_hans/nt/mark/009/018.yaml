  source_fidelity: 草稿总体忠实呈现了反复发生的抓住、摔倒、起沫、牙齿动作、状态变化，以及门徒未能赶出的意思。不过，“把他摔倒”在汉语中搭配不完整，宜改为“把他摔倒在地”；“咬牙切齿”常带愤怒、仇恨等惯用语义，不适合作为此处纯粹的发作症状，宜用“磨牙”。
