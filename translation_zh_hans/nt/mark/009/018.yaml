  terminology: “赶出去”在上下文中自然表达ἐκβάλω的驱逐意味，并以“它”保留原文中性代词的指代开放性。对ξηραίνεται采用“身体僵直”可以保留语境性理解；脚注应提供更贴近该词基本义的“枯干、枯萎、消瘦”等替代译法，避免把“衰弱”这种较宽泛的解释列作直接词义。
