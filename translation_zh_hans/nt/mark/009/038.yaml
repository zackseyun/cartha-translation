base_translation:
  language: en
  yaml_path: translation/nt/mark/009/038.yaml
  text: John said to him[a], “Teacher, we saw someone casting out demons in your name, and we tried to stop him because he was not following us.”
translation:
  language: zh_hans
  text: 约翰对他说：“老师，我们看见有人奉你的名赶鬼，就想阻止他[a]，因为他不跟从我们。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“就一直阻止他。”希腊文的未完成过去时可表示持续、反复或尝试中的动作，因此正文译作“想阻止他”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔφη αὐτῷ ὁ Ἰωάννης
  choice: 约翰对他说
  rationale: 以自然的汉语叙事过去时表达常见的说话动词ἔφη，同时保留间接宾语“对他”和明确主语“约翰”。
- source_word: Διδάσκαλε
  choice: 老师
  rationale: διδάσκαλος直接指教导者；“老师”是现代汉语中准确、自然且庄重的称呼，不需将其解释性地译作“拉比”或较古雅的“夫子”。
- source_word: εἴδομέν τινα
  choice: 我们看见有人
  rationale: τινα是不定代词，未强调此人的具体身份；“有人”自然保留这种不确定性。
- source_word: ἐν τῷ ὀνόματί σου
  choice: 奉你的名
  rationale: 这是现代汉语基督教语境中自然的圣经表达，传达借着耶稣的名和权柄行事，同时保留“名”这一源文意象。
- source_word: ἐκβάλλοντα δαιμόνια
  choice: 赶鬼
  rationale: ἐκβάλλω与δαιμόνια连用表示把邪灵逐出；“赶鬼”在现代汉语福音书语境中简明、通顺且意义明确。
- source_word: καὶ ἐκωλύομεν αὐτόν
  choice: 就想阻止他
  rationale: 未完成过去时ἐκωλύομεν可表示持续、反复或尝试中的动作。“想阻止他”自然呈现尝试的意味，又不武断断定他们已经成功制止了他；脚注保留另一种可能。
- source_word: ὅτι οὐκ ἠκολούθει ἡμῖν
  choice: 因为他不跟从我们
  rationale: 直译ἡμῖν为“我们”，不改成“你”或解释成“不是我们这一伙的”，从而保留约翰以门徒群体为中心的表述及其叙事张力。
theological_decisions:
- issue: 末句所说那人跟从的对象
  choice: 按ἡμῖν直译为“不跟从我们”
  alternative: “不跟从你”或“不是我们中间的人”
  rationale: 希腊文明确说“我们”，而非“你”。保留原文可让读者看见约翰关注门徒群体界限的说法，并避免提前消解耶稣随后回应所形成的张力。
- issue: “奉你的名”的含义
  choice: 保留“名”的圣经意象，不展开解释
  alternative: “靠你的权柄”或“借用你的名义”
  rationale: 原文既可传达权柄和代表关系，也保留“名”本身的重要意象；正文不把其中含义缩减为单一解释。
translation_notes:
  register: 采用现代、自然、庄重的叙事语言。“老师”“有人”“阻止”等词普通读者易懂；“奉你的名赶鬼”保留福音书惯用表达。句法尽量贴近源文，同时以“就想阻止他”呈现未完成过去时在此处可能具有的尝试意味。
