  text: καὶ ⸀εὐθὺς πᾶς ὁ ὄχλος ⸂ἰδόντες αὐτὸν ἐξεθαμβήθησαν⸃, καὶ προστρέχοντες ἠσπάζοντο αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/015.yaml
  text: And immediately the whole crowd[a], when they saw him, were greatly amazed, and running up to him, greeted him.
translation:
  language: zh_hans
  text: 众人一看见他，都立刻大为惊讶[a]，便跑上前去向他问安。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“大为震惊”或“惊惶不已”。希腊语这个动词可按语境表示强烈的惊讶、震惊或惊惶。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: 立刻
  rationale: 保留马可叙事中常见的紧迫感，同时符合现代汉语语序。
- source_word: πᾶς ὁ ὄχλος
  choice: 众人……都
  rationale: 以自然的汉语周遍结构表达整个群众无一例外，而不生硬直译为“整个群众”。
- source_word: ἰδόντες αὐτόν
  choice: 一看见他
  rationale: 将不定过去时分词理解为触发后续反应的时间情境；“一……就/便……”也传达动作紧接发生。
- source_word: ἐξεθαμβήθησαν
  choice: 非常惊讶
  rationale: 表达该动词强烈的惊异程度，同时不擅自解释众人为何如此，也不限定为恐惧。
- source_word: προστρέχοντες
  choice: 跑上前去
  rationale: 保留朝向耶稣奔跑靠近的动态感，现代汉语自然明晰。
- source_word: ἠσπάζοντο αὐτόν
  choice: 向他问安
  rationale: ἀσπάζομαι在此指见面致意；“问安”比单纯“欢迎”更中性，也比“向他打招呼”更庄重。
theological_decisions:
- issue: ἐξεθαμβήθησαν所表达的众人反应
  choice: 非常惊讶
  alternative: 大为震惊；惊惶不已；因耶稣显出如摩西般的荣光而惊讶
  rationale: 原文只说明众人看见耶稣后产生强烈反应，随后跑来问安；正文保留强烈惊异，却不添加恐惧或超自然荣光等经文本身未明说的原因。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“众人……都”符合普通话表达；“问安”保留见面致意之义，并避免过于口语化。脚注保留原词在惊异与惊惶之间的语义张力。
