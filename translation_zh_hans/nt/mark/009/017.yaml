  text: καὶ ⸂ἀπεκρίθη αὐτῷ εἷς ἐκ τοῦ ὄχλου⸃· Διδάσκαλε, ἤνεγκα τὸν υἱόν μου πρὸς σέ, ἔχοντα πνεῦμα ἄλαλον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/017.yaml
  text: And one from the crowd answered him[a], “Teacher, I brought my son to you, having a mute spirit.”
translation:
  language: zh_hans
  text: 人群中有一个人回答耶稣说：“老师，我把我的儿子带到你这里来，他身上有一个使他不能说话的灵[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一个不能说话的灵。”
    reason: 原文ἄλαλον在语法上直接修饰“灵”，可理解为灵本身不能说话；正文依上下文译出它使男孩不能说话的作用。
lexical_decisions:
- source_word: ἀπεκρίθη αὐτῷ
  choice: 回答耶稣说
  rationale: ἀπεκρίθη是叙事中常见的“回答”；中文明确补出代词所指的“耶稣”，比“回答他说”更自然，也没有增加新的所指。
- source_word: εἷς ἐκ τοῦ ὄχλου
  choice: 人群中有一个人
  rationale: 保留部分结构和不定单数；“一个人”符合现代汉语，且不额外强调其身份。
- source_word: Διδάσκαλε
  choice: 老师
  rationale: 直接表达διδάσκαλος的教导者含义；现代汉语自然易懂，又不加入“主”或“师尊”等额外权威色彩。
- source_word: ἤνεγκα
  choice: 我把……带到……来
  rationale: 以自然的现代汉语表达简单过去的带领动作，并保留朝向耶稣的语义。
- source_word: τὸν υἱόν μου
  choice: 我的儿子
  rationale: 准确保留亲属关系；不根据上下文改译为“孩子”或“男孩”。
- source_word: πρὸς σέ
  choice: 到你这里来
  rationale: 自然表达πρός加宾格在“带来”之后的趋向意义。
- source_word: ἔχοντα
  choice: 他身上有
  rationale: 该分词修饰“我的儿子”；独立为中文分句，既清楚连接所描述的状况，又不强行译成因果关系。
- source_word: πνεῦμα ἄλαλον
  choice: 一个使他不能说话的灵
  rationale: 按叙事语境自然表达这灵给儿子造成的失语状态；正文仍只称“灵”，不擅加“邪”或“污”。脚注保留形容词直接修饰灵的译法。
theological_decisions:
- issue: πνεῦμα在赶鬼叙事中的性质
  choice: 灵
  alternative: 邪灵／污灵
  rationale: 上下文暗示这是折磨并控制男孩的灵，但本节希腊文只写πνεῦμα，因此不在正文中加入“邪”或“污”。
- issue: ἄλαλον是描述灵本身还是描述它造成的症状
  choice: 使他不能说话的灵
  alternative: 不能说话的灵
  rationale: 主译采用符合现代汉语和叙事情境的致使表达；脚注保留希腊语形容词直接修饰“灵”的结构，以免掩盖原文的语法张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“老师”适合普通读者；句法避免古雅的“有一人”及生硬的“有着一个灵”。
