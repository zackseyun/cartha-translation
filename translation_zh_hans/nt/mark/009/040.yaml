  text: For whoever is not against us is for us[a].
translation:
  language: zh_hans
  text: 因为凡不反对我们的，就是支持我们的[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“就是站在我们这一边的。”希腊语ὑπὲρ ἡμῶν也可表达“为我们”或“站在我们这一边”的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: ……的（泛指结构）
  rationale: 关系代词在此作泛指的实体性用法；用“……的”结构自然表达“凡是……的人／谁”，又不必添出性别。
- source_word: γὰρ
  choice: 因为
  rationale: γάρ承接上文并说明理由；“因为”清楚表达解释关系，符合现代汉语习惯。
- source_word: οὐκ ἔστιν
  choice: 不……的
  rationale: 直接表达否定系词的含义，并与汉语泛指结构自然结合。
- source_word: καθ’ ἡμῶν
  choice: 反对我们
  rationale: κατά加属格表示敌对或反对；“反对我们”准确、自然，也保留第一人称复数。
- source_word: ὑπὲρ ἡμῶν
  choice: 支持我们
  rationale: ὑπέρ加属格可指站在某方、为某方或代表某方；在与“反对我们”的对举中，“支持我们”简洁自然，脚注保留其他可能的语义色彩。
- source_word: ἐστιν
  choice: 就是
  rationale: “就是”承接前面的泛指主语并突出对举判断，符合汉语格言式表达。
theological_decisions:
- issue: “反对我们／支持我们”所指的归属范围
  choice: 保留第一人称复数的关系表达，不扩写其对象或使命范围。
  alternative: 译作“不反对我们使命的，就是站在我们这一边的”，或改成“不反对上帝的，就是支持上帝的”。
  rationale: 希腊文明确使用“我们”，没有明说“上帝”“国度”或“使命”；直译这一人称关系可保留经文本身的解释空间与张力。
translation_notes:
  register: 采用现代、简洁而庄重的口吻；保留原文“反对我们／支持我们”的紧凑对举。脚注标记已置于正文相应位置。
