  text: Καὶ ⸀ἦλθον εἰς Καφαρναούμ. καὶ ἐν τῇ οἰκίᾳ γενόμενος ἐπηρώτα αὐτούς· Τί ἐν τῇ ⸀ὁδῷ διελογίζεσθε;
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/033.yaml
  text: And they came to Capernaum. And when he was in the house, he was asking them, “What were you discussing on the way?”
translation:
  language: zh_hans
  text: 他们来到迦百农。耶稣在屋里时，问他们：“你们一路上在议论什么[a]？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“争论什么？”这个动词可指议论、辩论或争论；下一节表明，他们谈的是谁最大。
    reason: 词义存在真实幅度，且下文使较强的“争论”语气成为可能。
lexical_decisions:
- source_word: ἦλθον
  choice: 来到
  rationale: 不定过去时在这里叙述一行人抵达迦百农；“来到”自然表达向目的地行进并到达。
- source_word: Καφαρναούμ
  choice: 迦百农
  rationale: 采用现代中文圣经中通行的地名译法。
- source_word: ἐν τῇ οἰκίᾳ γενόμενος
  choice: 耶稣进了屋里
  rationale: 分词结构表示随后进入并身处那所屋子；中文以“进了屋里”清楚、自然地交代时间与场景，并保留定冠词所指的具体屋舍，不解释为“回到家”。
- source_word: ἐπηρώτα
  choice: 就问
  rationale: 未完成过去时可呈现持续或反复的询问，但本句中文叙事用“就问”最自然；上下文并未要求明确表达多次询问。
- source_word: ἐν τῇ ὁδῷ
  choice: 一路上
  rationale: 在行旅语境中自然表达“在路上、途中”，也与抵达迦百农形成清楚衔接。
- source_word: διελογίζεσθε
  choice: 在议论
  rationale: διαλογίζομαι可指商议、讨论、辩论或争论。“议论”保留语气上的宽度，不提前把下一节显出的争竞意味完全写入本节。
theological_decisions:
- issue: 复数ἦλθον之后转为单数γενόμενος与ἐπηρώτα的叙事主语
  choice: 前句译为“他们来到”，后句明确译出“耶稣”
  alternative: “他们来到迦百农；进了屋里以后，他就问他们……”
  rationale: 希腊文从复数主语自然转到单数主语，语境表明单数主语是耶稣。中文明确说出“耶稣”，可避免代词所指含混，不增加教义性解释。
- issue: 是否把门徒途中谈话直接定性为争吵
  choice: 正文用较宽泛的“议论”，脚注说明“争论”这一可能译法
  alternative: 正文译作“争论”或“争辩”
  rationale: 该动词本身容许讨论、辩论或争执等含义；下一节显示话题涉及谁最大，却不必在本节中提前锁定语气。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“他们来到……耶稣进了……”清楚呈现原文由复数转为单数主语；“一路上”口吻自然，“议论”则保留原词在讨论与争论之间的语义张力。
