  text: καὶ εἶπεν αὐτοῖς· Τοῦτο τὸ γένος ἐν οὐδενὶ δύναται ἐξελθεῖν εἰ μὴ ἐν ⸀προσευχῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/029.yaml
  text: And he said to them[a], “This kind cannot come out by anything except prayer.”
translation:
  language: zh_hans
  text: 他对他们说：“这一类除了借着祷告，绝不能出来。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 部分后期抄本作“祷告和禁食”。
    reason: textual_variant
lexical_decisions:
- source_word: Τοῦτο τὸ γένος
  choice: 这一类
  rationale: γένος在此指某一类别；上下文表明所指的是污灵，但希腊文没有明说“灵”，因此译作“这一类”，既自然又避免增添原文未明说的名词。
- source_word: ἐν οὐδενὶ
  choice: 绝不可能
  rationale: ἐν与οὐδενί在此表达手段或方式上的完全否定。结合δύναται译为“绝不可能”，自然传达“没有任何别的办法能使其出来”的意思。
- source_word: δύναται ἐξελθεῖν
  choice: 可能出来
  rationale: δύναται加不定式表示能力或可能性；在否定结构中译作“不可能出来”。“出来”符合上下文中污灵从人身上出去的叙述。
- source_word: εἰ μὴ
  choice: 若不……
  rationale: εἰ μὴ引出唯一例外。汉语“若不借着……，就绝不可能……”清楚保留排他条件。
- source_word: ἐν προσευχῇ
  choice: 借着祷告
  rationale: ἐν在此表示凭借的方式或手段；“借着祷告”比单说“祷告”更明确保留其工具性含义。
theological_decisions:
- issue: 是否纳入“和禁食”
  choice: 正文只作“祷告”
  alternative: “祷告和禁食”
  rationale: SBLGNT正文只有προσευχῇ（“祷告”）。部分后期抄本增加“和禁食”，故不纳入正文，但在脚注中保留这一传统异文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“这一类”保留原文的简洁和指称上的含蓄；“若不借着祷告，是绝不可能出来的”兼顾希腊文的排他结构与自然汉语表达。脚注标记置于整句引文之后。
