  text: καὶ ἤνεγκαν αὐτὸν πρὸς αὐτόν. καὶ ἰδὼν αὐτὸν ⸂τὸ πνεῦμα εὐθὺς⸃ ⸀συνεσπάραξεν αὐτόν, καὶ πεσὼν ἐπὶ τῆς γῆς ἐκυλίετο ἀφρίζων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/020.yaml
  text: And they brought him to him[a]. And when the spirit saw him, it immediately convulsed him, and he fell on the ground and rolled about[b], foaming.
translation:
  language: zh_hans
  text: 他们把孩子带到耶稣那里。那灵[a]一看见耶稣，立刻使孩子猛烈地抽搐[b]。孩子倒在地上，翻滚着，吐着白沫。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节原文只说“那灵”；上下文表明这是污灵。
    reason: 保留本节用词，同时说明上下文所指。
  - marker: b
    text: 或译：“使孩子剧烈痉挛”。
    reason: 说明συνεσπάραξεν所表达的剧烈痉挛动作，避免加入原文未明说的“全身”。
lexical_decisions:
- source_word: ἤνεγκαν αὐτὸν πρὸς αὐτόν
  choice: 他们把孩子带到耶稣那里
  rationale: φέρω在这里表示把孩子带到某人那里；根据上下文将两个代词分别明确为“孩子”和“耶稣”，避免现代汉语中连续使用“他”所造成的不自然歧义。
- source_word: ἰδὼν αὐτὸν τὸ πνεῦμα
  choice: 那灵一看见耶稣
  rationale: 将不定过去时分词按时间关系译为“一……”，并保留τὸ πνεῦμα为动作主体；代词所指按上下文明确为耶稣。
- source_word: τὸ πνεῦμα
  choice: 那灵
  rationale: 本节原文只说“那灵”，不擅自增添“污”或改译为“鬼”；“那”也自然承接上文已提到的灵。
- source_word: εὐθὺς
  choice: 立刻
  rationale: 准确保留马可叙事中常见的即时性，同时符合现代汉语表达。
- source_word: συνεσπάραξεν αὐτόν
  choice: 使孩子猛烈抽搐
  rationale: 该动词表示造成剧烈痉挛或抽搐；“猛烈抽搐”比旧式的“撕裂”更准确，也避免误解为身体被撕伤。
- source_word: πεσὼν ἐπὶ τῆς γῆς ἐκυλίετο
  choice: 孩子倒在地上，翻滚着
  rationale: 明确倒地的是孩子，并以“翻滚着”体现未完成过去时所描写的持续动作，同时自然呈现分词与主要动词的动作衔接。
- source_word: ἀφρίζων
  choice: 吐着白沫
  rationale: 以现代汉语的惯用说法表达“起沫、冒沫”的状态；不额外加入原文未明说的医学解释。
theological_decisions:
- issue: πνεῦμα的身份
  choice: 正文译作“那灵”
  alternative: “那污灵”或“那鬼”
  rationale: 上下文表明这是污灵，但本节自身只用τὸ πνεῦμα。正文保留本节措辞，并用脚注交代上下文身份，不把解释直接加入经文。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。为避免连续代词造成指代不清，依照明确的上下文分别使用“孩子”和“耶稣”；保留简短有力的马可叙事节奏。
