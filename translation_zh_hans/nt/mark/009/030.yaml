  text: Κἀκεῖθεν ἐξελθόντες ⸀παρεπορεύοντο διὰ τῆς Γαλιλαίας, καὶ οὐκ ἤθελεν ἵνα τις γνοῖ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/030.yaml
  text: And from there[a] they went on through Galilee[b], and he did not want anyone to know.
translation:
  language: zh_hans
  text: 他们离开那里，一路经过加利利；耶稣不想让任何人知道[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文没有明说“不想让任何人知道”的具体内容；按上下文，可能是指耶稣在那里，或他们经过加利利的行踪。
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀκεῖθεν ἐξελθόντες
  choice: 他们离开那里
  rationale: Κἀκεῖθεν兼有承接叙事和“从那里”的空间含义，ἐξελθόντες表示离开先前所在之处。合译为“离开那里”既保留动作，也符合现代汉语表达。
- source_word: παρεπορεύοντο
  choice: 一路经过
  rationale: 该未完成时形式描写持续行进。“一路经过”自然地呈现他们正在穿行，而不把时体过度解释为特定的行程方式。
- source_word: διὰ τῆς Γαλιλαίας
  choice: 经过加利利
  rationale: διά加属格表示穿过某一区域；“经过加利利”准确而自然。
- source_word: οὐκ ἤθελεν
  choice: 不想
  rationale: θέλω在此表达意愿。“不想”是清楚、自然的现代汉语，没有额外强化为绝对拒绝。
- source_word: ἵνα τις γνοῖ
  choice: 让任何人知道
  rationale: ἵνα加虚拟式在这里表达所不希望发生的事。原文没有明说“知道”的宾语，译文也保留这一省略。
theological_decisions:
- issue: ἤθελεν的隐含主语
  choice: 明确译为“耶稣”
  alternative: 译为“他”
  rationale: 单数动词的主语按上下文是耶稣。现代汉语在分句中明确姓名可避免“他们……他……”造成指代不清，并未增加原文之外的神学含义。
- issue: γνοῖ所省略的宾语
  choice: 正文保留省略，仅说“知道”
  alternative: 补作“知道他在那里”或“知道他们的行踪”
  rationale: 希腊文并未明说人们不应知道什么；上下文可指耶稣在当地或他们的行程。正文不替原文消除这一含混。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“一路经过”体现未完成时所描写的持续行进；分号保留行程叙述与耶稣意愿之间的紧密联系。
