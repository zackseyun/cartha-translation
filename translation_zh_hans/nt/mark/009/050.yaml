base_translation:
  language: en
  yaml_path: translation/nt/mark/009/050.yaml
  text: Salt is good[a]; but if the salt becomes unsalty, with what will you season it? Have salt in yourselves[c][b], and be at peace with one another.
translation:
  language: zh_hans
  text: 盐是好的；但盐若变得不咸了，你们用什么使它有咸味呢？你们里面要有盐[a]，彼此和睦相处。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你们里面要有盐”保留了原文的比喻。这里的“盐”可能指纯洁、智慧、忠于盟约或能产生保存作用的影响力等，但经文本身没有明确限定其中一种解释。
    reason: lexical_alternative
lexical_decisions:
- source_word: καλὸν
  choice: 好的
  rationale: 保留宽泛而格言式的正面评价，不把含义限缩为“有用”或“有益”。
- source_word: ἅλας / ἅλα
  choice: 盐
  rationale: 前后统一译作“盐”，并在命令句中保留原文没有解释的比喻。
- source_word: ἄναλον γένηται
  choice: 变得不咸了
  rationale: 表达由有咸味到无咸味的状态变化，同时在现代汉语中自然保留“盐—咸”的文字关联。
- source_word: ἐν τίνι αὐτὸ ἀρτύσετε
  choice: 你们还能用什么使它有咸味呢
  rationale: ἐν τίνι 表示所凭借的手段；ἀρτύω在此指调味。结合盐已“不咸”的语境，译为“使它有咸味”比泛称“调味”更明确地维持反问的逻辑。
- source_word: ἔχετε ἐν ἑαυτοῖς ἅλα
  choice: 你们里面要有盐
  rationale: ἔχετε为命令语气；“里面”自然表达ἐν ἑαυτοῖς所指向的内在拥有，又不把比喻解释成某一种品格。
- source_word: εἰρηνεύετε ἐν ἀλλήλοις
  choice: 彼此和睦相处
  rationale: εἰρηνεύετε要求持续处于和平关系中；“和睦相处”是现代汉语中自然、清楚的关系性命令。
theological_decisions:
- issue: 命令句中“盐”的比喻含义
  choice: 按原文保留为“你们里面要有盐”
  alternative: 在正文中解释为纯洁、智慧、盟约忠诚或保存性的影响力
  rationale: 上下文没有明确指定唯一所指；直译比喻可保留其与门徒生活及前文盐之意象的联系，避免把某一解释写入正文。
- issue: 末句和平命令的表达
  choice: 译为“彼此和睦相处”
  alternative: 译为“彼此要和平”或“彼此保持和睦”
  rationale: 所选译法既体现持续性的伦理命令，也符合现代标准汉语习惯，不增加宗派性解释。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“不咸”直观呈现原文ἄναλος的反常意象；只在比喻命令处加注，避免正文过度释义。
