  text: ⸀εὐθὺς κράξας ὁ πατὴρ τοῦ ⸀παιδίου ἔλεγεν· ⸀Πιστεύω· βοήθει μου τῇ ἀπιστίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/024.yaml
  text: Immediately the father of the child cried out and said[a], “I believe[b]; help my unbelief!”
translation:
  language: zh_hans
  text: 孩子的父亲立刻喊着说：“我信！求你帮助我的不信！[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “帮助我的不信”也可理解为“帮助我信心的不足”。“不信”所译的希腊词可指不信，也可指信心不足。
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθύς
  choice: 立刻
  rationale: 保留马可叙事中迅速、紧迫的语气，且符合现代汉语表达。
- source_word: κράξας
  choice: 喊着
  rationale: 表达大声而急切地出声；与后面的“说”自然衔接，又不过度限定为尖叫。
- source_word: ὁ πατὴρ τοῦ παιδίου
  choice: 孩子的父亲
  rationale: 自然呈现属格关系；παιδίον在此译作“孩子”，不在本节无须必要时进一步窄化为“男孩”。
- source_word: ἔλεγεν
  choice: 说
  rationale: 未完成时在引出直接引语时用现代汉语的“说”最自然；前面的“喊着”已保留场景的生动和持续感。
- source_word: Πιστεύω
  choice: 我信
  rationale: 简洁对应πιστεύω，并与ἀπιστία形成直接、醒目的张力。
- source_word: βοήθει
  choice: 求你帮助
  rationale: 呈现现在时命令式的迫切请求；补出“求你”符合汉语恳求语气，不改变命题内容。
- source_word: μου τῇ ἀπιστίᾳ
  choice: 我的不信
  rationale: 尽量直接保留“不信”与“我信”之间刻意形成的悖论；希腊语与格在此表达帮助所针对的需要或困境。
theological_decisions:
- issue: Πιστεύω与ἀπιστίᾳ之间的张力
  choice: “我信！求你帮助我的不信！”
  alternative: “我信！求你补足我信心的不足！”
  rationale: 正文保留真实相信与仍有不信并存的尖锐张力，不把它解释性地化解为单纯信心不足。
translation_notes:
  register: 采用现代、庄重而口语可懂的表达。“我信”与“我的不信”刻意重复同一语义场，保留原文简短、急切且带张力的呼求。脚注标记置于整句引语末尾，说明ἀπιστία的词义范围。
