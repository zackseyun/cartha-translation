  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτῷ· Τὸ Εἰ ⸀δύνῃ, πάντα δυνατὰ τῷ πιστεύοντι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/023.yaml
  text: But Jesus said to him[b][a], “ ‘If you can’? All things are possible for the one who believes.”
translation:
  language: zh_hans
  text: 耶稣对他说：“‘你若能’？[a] 对信的人[b]来说，凡事都可能。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译作：“‘你若能’这话？”耶稣复述并质问孩子父亲在上一节所说的话。
    reason: 词语的另一译法及语用说明
  - marker: b
    text: “信的人”也可译作“相信的人”“有信心的人”或“信靠的人”。
    reason: 词义的其他可能表达
lexical_decisions:
- source_word: Τὸ Εἰ δύνῃ
  choice: “你若能”？
  rationale: 中性冠词 Τὸ 将后面的 Εἰ δύνῃ 作为一句被引用的话提出。耶稣是在尖锐地复述并反问父亲上一节所说的“你若能”，中文用引号加问号，既自然，也保留其挑战意味。
- source_word: δύνῃ
  choice: 你若能
  rationale: δύναμαι 的基本意思是“能够”；置于 εἰ 引导的条件句中，译作“你若能”简洁而符合上下文。
- source_word: πάντα
  choice: 凡事
  rationale: πάντα 是中性复数，指“一切事”；“凡事”保留原文概括性的修辞力度，又适合庄重的现代汉语。
- source_word: δυνατὰ
  choice: 都可能
  rationale: δυνατός 在此作谓语，表示“可能的”。译作“都可能”避免补入原文没有明说的施事者。
- source_word: τῷ πιστεύοντι
  choice: 对信的人来说
  rationale: 现在时分词 πιστεύοντι 泛指正在相信或持守信心的人。“信的人”保留动词性质，不把它固化为身份称号；“对……来说”自然表达希腊语与格在此所表示的关联。
theological_decisions:
- issue: “凡事都可能”的范围
  choice: 正文保留原文看似绝对的陈述，不添加限制语。
  alternative: 译作“靠着上帝，信的人凡事都可能”或明确限定为“在上帝旨意之内”。
  rationale: 本节希腊文没有明说“靠着上帝”或其他限制。虽然上下文涉及上帝的能力，但翻译不应把解释性限定加入正文，以免消解原句的修辞力度和神学张力。
- issue: πιστεύοντι 所指信心的对象
  choice: 译作“信的人”，不在正文补出“信上帝”或“信耶稣”。
  alternative: 译作“信上帝的人”“信耶稣的人”或“信靠上帝的人”。
  rationale: 上下文可以引导读者理解其信靠方向，但本节语法上没有明说宾语；保留这种省略可避免过度解释。
translation_notes:
  register: 采用自然、庄重而简洁的现代标准汉语。引号和反问保留耶稣复述对方话语时的尖锐语气；“凡事都可能”保留原文的绝对表达，不作解释性扩写。
