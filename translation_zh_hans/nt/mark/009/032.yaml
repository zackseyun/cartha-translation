  text: οἱ δὲ ἠγνόουν τὸ ῥῆμα, καὶ ἐφοβοῦντο αὐτὸν ἐπερωτῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/032.yaml
  text: But they did not understand the statement[a], and they were afraid to ask him.
translation:
  language: zh_hans
  text: 可是，他们不明白这话[a]，又不敢问他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“这番话”。希腊语ῥῆμα可指说出的话、言语或陈述。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: 可是，他们
  rationale: δέ在这里承接上文并形成轻微转折；结合语境，省略的所指是门徒，用“可是，他们”自然表达。
- source_word: ἠγνόουν
  choice: 不明白
  rationale: ἀγνοέω在此指未能理解耶稣刚才所说的话；未完成时表示当时持续的状态，汉语无需另加进行标记。
- source_word: τὸ ῥῆμα
  choice: 这话
  rationale: ῥῆμα在此指耶稣刚说出的内容。“这话”是现代汉语中自然、庄重的表达，也保留“话语/所说内容”的语义范围。
- source_word: ἐφοβοῦντο
  choice: 不敢
  rationale: 希腊文直义为“害怕”；与不定式“问他”连用时，汉语“不敢问他”最自然地表达因害怕而没有询问，仍保留其因惧怕而退缩的含义。
- source_word: αὐτὸν
  choice: 他
  rationale: 代词指向耶稣，直接译为“他”。
- source_word: ἐπερωτῆσαι
  choice: 问
  rationale: ἐπερωτάω在此意为询问；“问”简洁自然，符合现代汉语。
theological_decisions:
- issue: 门徒不询问耶稣的原因
  choice: 译作“又不敢问他”，表明惧怕导致他们没有询问，但不说明他们具体怕什么。
  alternative: “又害怕问他”
  rationale: 原文没有交代惧怕的对象或原因，不宜加入对门徒动机的神学解释；“不敢问”在汉语中自然保留这种未明说的惧怕。
translation_notes:
  register: 采用现代、简明而庄重的叙事语体。“这话”比“这陈述”更符合自然汉语；“又不敢问他”流畅表达原文的惧怕与询问之间的关系。
