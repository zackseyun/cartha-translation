base_translation:
  language: en
  yaml_path: translation/nt/mark/009/026.yaml
  text: And after crying out and convulsing him greatly[a], it came out; and he became like a dead man, so that many were saying[b], “He is dead.”
translation:
  language: zh_hans
  text: 那灵喊叫，又使孩子剧烈抽搐[a]，然后出来了。孩子变得像死人一样，以致许多人说[b]：“他死了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使他剧烈地抽搐。”
    reason: lexical_alternative
  - marker: b
    text: 原文先说孩子“像死人一样”；随后所引“他死了”是许多旁观者的判断。
    reason: lexical_alternative
lexical_decisions:
- source_word: κράξας
  choice: 喊叫一声
  rationale: 用简洁自然的汉语保留该动词“喊叫”的意义，不额外限定为尖叫或哀号；不定过去时分词与随后动作紧密相连。
- source_word: πολλὰ σπαράξας
  choice: 又使孩子剧烈抽搐
  rationale: 在赶鬼语境中，σπαράσσω指使人痉挛、抽搐，而非字面上的撕裂；πολλά在此加强程度，译作“剧烈”。宾语“孩子”由上下文补明。
- source_word: ἐξῆλθεν
  choice: 就出来了
  rationale: 省略的主语是上下文中的污灵；汉语承接前句用“就出来了”自然清楚。
- source_word: ἐγένετο ὡσεὶ νεκρός
  choice: 孩子变得像死人一样
  rationale: 保留ὡσεὶ的比较意义，只陈述孩子呈现如同死人的状态，不断言他实际死亡。
- source_word: ὥστε τοὺς πολλοὺς λέγειν
  choice: 以致许多人都说
  rationale: τοὺς πολλούς译为“许多人”，不武断译成“大多数人”；“以致”体现结果关系。
- source_word: ὅτι ἀπέθανεν
  choice: “他死了。”
  rationale: 改为自然的汉语直接引语；“死了”表达旁观者根据眼前情形作出的结论。
theological_decisions:
- issue: 孩子是实际死亡还是看起来像死了
  choice: 叙述者只说孩子“像死人一样”，而“他死了”是许多人的判断。
  alternative: 孩子确实短暂死亡，或本节完全不区分实际死亡与表面死亡。
  rationale: ὡσεὶ明确保留比较意味，死亡判断又被置于旁观者的话中；因此译文不把本节改写为实际死亡或复活的断言。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“那灵”承接上下文，避免把灵界主体非人格化；“孩子”补出原文省略但语境明确的受事者。所有脚注标记均已置于正文相应位置。
