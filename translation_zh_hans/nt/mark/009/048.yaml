  yaml_path: translation/nt/mark/009/048.yaml
  text: where their worm does not die[b][a], and the fire is not quenched.
translation:
  language: zh_hans
  text: 在那里，他们的虫不死[b][a]，火也不熄灭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们的蛆虫没有尽头，火也不被扑灭。”
    reason: 词义可选译法：σκώληξ可具体理解为“蛆虫”，τελευτάω可译为“终结”，σβέννυται可译为“被扑灭”。
  - marker: b
    text: 本句呼应《以赛亚书》66:24。
    reason: 交叉经文。
lexical_decisions:
- source_word: ὅπου
  choice: 在那里
  rationale: 引出所描述的所在之处；“在那里”在现代汉语中自然，也保留原文的地点关系。
- source_word: ὁ σκώληξ αὐτῶν
  choice: 他们的虫
  rationale: 直译所有格结构，保留虫与受审判者之间的关联。“虫”既不把所指过度限定为蛆，也能呼应《以赛亚书》66:24。
- source_word: οὐ τελευτᾷ
  choice: 不死
  rationale: τελευτάω可指终结或死亡；以“虫”为主语时，“不死”简洁自然，并保留原文鲜明的意象。
- source_word: τὸ πῦρ
  choice: 火
  rationale: 直接对应原文名词，语义清楚，无须释义性改写。
- source_word: οὐ σβέννυται
  choice: 不熄灭
  rationale: 保留现在时被动形式所表达的持续、未被扑灭状态；现代汉语中“火不熄灭”自然庄重。
theological_decisions:
- issue: 审判意象的性质
  choice: 保留“虫”和“火”的具体意象，不在译文中将其解释为永恒受苦、彻底毁灭或纯粹隐喻。
  alternative: 可分别理解为持续的刑罚、不可逆转的毁灭，或羞辱与污秽的象征。
  rationale: 本节呼应《以赛亚书》66:24，却没有自行裁定更广泛的末世刑罚争论；直保留意象可维持原文的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。正文保持短促有力，并按所给英文咨询层的顺序保留脚注标记[b][a]。
