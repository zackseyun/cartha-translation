  text: καὶ ⸂εἰσελθόντος αὐτοῦ⸃ εἰς οἶκον οἱ μαθηταὶ αὐτοῦ ⸂κατ’ ἰδίαν ἐπηρώτων αὐτόν⸃· Ὅτι ἡμεῖς οὐκ ἠδυνήθημεν ἐκβαλεῖν αὐτό;
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/028.yaml
  text: And when he had entered the house[a], his disciples were asking him privately, “Why were we not able to cast it out?”
translation:
  language: zh_hans
  text: 耶稣进了屋子以后，门徒私下问他：“为什么我们没能把它赶出去[a]呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把他赶出去”，若把这里的代词理解为指那男孩，而不是污灵。希腊文代词为中性，更自然地指污灵。
    reason: alternative_reading
lexical_decisions:
- source_word: εἰσελθόντος αὐτοῦ
  choice: 耶稣进了……以后
  rationale: 属格独立结构中的不定过去时分词交代先于主句发生的时间背景；中文用“……以后”自然表达这一先后关系。为避免连续代词造成指代含混，以“耶稣”明示主语。
- source_word: εἰς οἶκον
  choice: 进了屋子
  rationale: οἶκον虽无冠词，但叙事中指双方所进入的具体室内地点；“屋子”比“家”少作无根据的地点认定，也符合现代汉语。
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: 门徒
  rationale: “门徒”是福音书语境中μαθηταί准确而通行的译法；前文已明确耶稣，中文不必重复“他的”。
- source_word: κατ’ ἰδίαν
  choice: 私下
  rationale: 表示与别人分开、单独交谈；“私下”简洁自然，并保留其副词作用。
- source_word: ἐπηρώτων
  choice: 问
  rationale: 未完成时可描写当时正在进行的询问；现代汉语无需机械加入“不断”或“正在”，否则容易过度翻译。
- source_word: Ὅτι
  choice: 为什么
  rationale: 在此直接问句中ὅτι具有询问原因的惯用意义，译为“为什么”最自然。
- source_word: ἡμεῖς οὐκ ἠδυνήθημεν
  choice: 我们不能
  rationale: ἡμεῖς为显式主语，带有“我们”的强调；οὐκ ἠδυνήθημεν表达未能做到，中文“我们不能”简洁保留能力层面的意思。
- source_word: ἐκβαλεῖν
  choice: 赶出去
  rationale: ἐκβάλλω在驱逐污灵的语境中指使其离开；“赶出去”是现代汉语自然、清楚的表达。
- source_word: αὐτό
  choice: 它
  rationale: 该代词为中性单数，较自然地回指污灵，而非阳性的男孩；译作“它”保留希腊文的形式线索。
theological_decisions:
- issue: 句末代词αὐτό的所指
  choice: 理解为污灵，译作“它”
  alternative: 理解为受苦的男孩，译作“他”
  rationale: 中性单数αὐτό更自然地指向前文的污灵，并且“赶出去”的直接对象在此语境中通常是污灵。不过上下文仍容许将其理解为男孩，因此用脚注保留这一歧义，不将其绝对化。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“屋子”“私下问”“赶出去”均为普通读者自然可懂的表达；正文保留代词的原文线索，并以脚注说明真实的指代歧义。
