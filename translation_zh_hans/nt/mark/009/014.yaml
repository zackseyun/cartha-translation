  text: Καὶ ⸂ἐλθόντες πρὸς τοὺς μαθητὰς εἶδον⸃ ὄχλον πολὺν περὶ αὐτοὺς καὶ γραμματεῖς συζητοῦντας ⸂πρὸς αὐτούς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/014.yaml
  text: And when they came to the disciples[a], they saw a large crowd around them, and scribes arguing with them.
translation:
  language: zh_hans
  text: 他们来到其余的门徒那里，看见一大群人围着那些门徒，又有文士正在同那些门徒辩论。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλθόντες
  choice: 来到
  rationale: 不定过去时分词与主句动词相连，在汉语叙事中自然译为顺承动作“来到……看见”，既简洁又保留动作次序。
- source_word: πρὸς τοὺς μαθητάς
  choice: 来到其他门徒那里
  rationale: πρός加宾格表示朝向某些人移动。上下文中来的是耶稣、彼得、雅各和约翰，因此“其他门徒”自然说明所指对象；“那里”使现代汉语表达完整。
- source_word: εἶδον
  choice: 看见
  rationale: 按叙事中的简单不定过去时直译，不作不必要扩展。
- source_word: ὄχλον πολύν
  choice: 一大群人
  rationale: 准确表达ὄχλος与πολύς所指的人群及其规模，符合现代汉语习惯。
- source_word: περὶ αὐτούς
  choice: 围着门徒
  rationale: περί加宾格在这里表示空间上的环绕；重复“门徒”可避免连续代词在汉语中的指代含混。
- source_word: γραμματεῖς
  choice: 经学教师
  rationale: 该词指熟悉并讲授、解释犹太律法的经学专家；“经学教师”比仅指抄写职业的“文士”更便于现代普通读者理解，同时保留其群体身份。
- source_word: συζητοῦντας
  choice: 辩论
  rationale: συζητέω可表示讨论、质询或争辩；本处语境具有争议性，但“辩论”保留了它未必等同激烈争吵的语义幅度。
- source_word: πρὸς αὐτούς
  choice: 和他们
  rationale: 在συζητέω之后，πρός表示与对方展开辩论；“他们”依叙事脉络指门徒。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“其他门徒”依据上下文补明，以免读者误以为前句中的同行者来到包括自己在内的门徒那里；“经学教师”传达γραμματεῖς作为律法经学专家的功能。“辩论”兼顾争议语境与原词可涵盖讨论、争辩的语义范围。
