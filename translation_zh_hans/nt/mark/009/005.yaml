  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ Πέτρος λέγει τῷ Ἰησοῦ· Ῥαββί, καλόν ἐστιν ἡμᾶς ὧδε εἶναι, καὶ ποιήσωμεν ⸂τρεῖς σκηνάς⸃, σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ Ἠλίᾳ μίαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/005.yaml
  text: 'And Peter answered and said to Jesus[a], “Rabbi, it is good for us to be here, and let us make three shelters: one for you, one for Moses, and one for Elijah.”'
translation:
  language: zh_hans
  text: 彼得回应耶稣说：“拉比，我们在这里真好！让我们搭三座棚子[a]：一座给你，一座给摩西，一座给以利亚。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“帐棚”或“棚屋”。希腊语 σκηνάς 指可供栖身的棚子或帐棚，通常带有临时性质；这里也可能令人联想到住棚节或会幕，但本节并未明说这种关联。
    reason: 保留词义选择以及可能但不确定的文化和神学联想。
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: 回应
  rationale: 这是叙事希腊语中的惯用分词；上下文并无明确提问，因此现代汉语用“回应”比“回答”更自然，同时保留彼得对眼前情景作出反应的意味。
- source_word: λέγει
  choice: 说
  rationale: 希腊文使用历史现在时；现代汉语叙事中的“说”不强制标示时态，表达自然，也无需刻意复制历史现在时。
- source_word: Ῥαββί
  choice: 拉比
  rationale: 保留这一肖像鲜明的闪语尊称及一世纪犹太背景；其含义近于“老师”，但直接译作“老师”会弱化原文形式。
- source_word: καλόν ἐστιν ἡμᾶς ὧδε εἶναι
  choice: 我们在这里真好
  rationale: 自然表达彼得对众人在场这一情形的正面评价；“真”体现感叹语境，却不把 καλόν 夸大为“太美妙了”等更强措辞。
- source_word: ποιήσωμεν
  choice: 让我们搭
  rationale: 第一人称复数虚拟式在此表示劝议。“让我们”保留这一语气；对棚子而言，“搭”比泛义的“做”更符合现代汉语搭配，也不过度强调永久性建造。
- source_word: σκηνάς
  choice: 棚子
  rationale: σκηνή 可指帐棚、棚屋或临时遮蔽物。“棚子”是清楚、自然且相对中性的现代汉语，不把住棚节或会幕的关联直接写进正文；其他可能译法置于脚注。
- source_word: σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ Ἠλίᾳ μίαν
  choice: 一座给你，一座给摩西，一座给以利亚
  rationale: 保留原文 μίαν 三次重复所形成的逐一分配和平行结构；量词“座”与所搭的棚子自然搭配。
theological_decisions:
- issue: σκηνάς 可能具有节期或敬拜场所的联想
  choice: 正文采用较中性的“棚子”
  alternative: 帐棚；棚屋；会幕
  rationale: 本节没有明说住棚节，也没有明确把这些结构等同于圣所或会幕。正文不强化原文未明言的神学关联，同时用脚注保留词义范围。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“拉比”保留历史文化色彩；“回应……说”适度贴近原文结构；感叹号体现彼得话语中的评价和现场感。脚注标记 [a] 已置于正文对应词后。
