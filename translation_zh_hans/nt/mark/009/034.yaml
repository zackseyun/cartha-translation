base_translation:
  language: en
  yaml_path: translation/nt/mark/009/034.yaml
  text: But they kept silent[a], because on the road they had argued with one another about who was greater.
translation:
  language: zh_hans
  text: 他们却一直不作声，因为他们在路上彼此争论谁更大[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“谁最大。”原文用比较级“更大”；按上下文，有时可习惯性地译为最高级“最大”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσιώπων
  choice: 一直不作声
  rationale: 未完成时表示持续的沉默；“一直不作声”自然呈现他们面对耶稣提问时持续不回答的状态。
- source_word: διελέχθησαν
  choice: 争论
  rationale: 该词可指讨论或辩论；结合争夺地位的内容，“争论”较准确地传达这里的对抗意味。按汉语叙事习惯，由“因为”和“在路上”即可清楚表明此事先于当下的沉默，无须另加完成体标记。
- source_word: πρὸς ἀλλήλους
  choice: 彼此
  rationale: 保留相互之间交谈、争论的互指含义，并符合现代汉语表达。
- source_word: ἐν τῇ ὁδῷ
  choice: 在路上
  rationale: 直接而自然地表达行程中的场景，也与马可福音的旅行叙事相符。
- source_word: τίς μείζων
  choice: 谁更大
  rationale: 保留 μείζων 的比较级形式，不将其直接改写为最高级；“谁更大”在现代汉语中自然，也保留比较对象未明说的特点。
- source_word: οἱ δὲ
  choice: 他们却
  rationale: “他们”承接上文的门徒，“却”表达 δέ 与耶稣提问之间的轻微转折。
- source_word: γὰρ
  choice: 因为
  rationale: 明确表达他们沉默的原因，符合现代汉语因果关系的常用说法。
theological_decisions:
- issue: 比较级 μείζων 与习惯性最高级表达
  choice: 谁更大
  alternative: 谁最大／谁是最大的
  rationale: 原文使用比较级，直译为“谁更大”既合乎汉语，也保留门徒彼此比较地位的表达，不把原文悄然规整为最高级。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“一直不作声”体现持续状态；“彼此争论谁更大”简洁保留原文的地位竞争及比较级形式。
