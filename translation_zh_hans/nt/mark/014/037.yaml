  text: καὶ ἔρχεται καὶ εὑρίσκει αὐτοὺς καθεύδοντας, καὶ λέγει τῷ Πέτρῳ· Σίμων, καθεύδεις; οὐκ ἴσχυσας μίαν ὥραν γρηγορῆσαι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/037.yaml
  text: And he comes and finds them sleeping[a], and he says to Peter, “Simon, are you sleeping? Were you not able to stay awake one hour?”
translation:
  language: zh_hans
  text: 他过来，见他们正在睡觉，就对彼得说：“西门，你在睡觉吗？你连一个小时也不能保持清醒[a]吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“警醒”。
    reason: γρηγορέω 既可指保持醒着，也可指警觉、守望；本节因与睡觉直接对照，正文采用“保持清醒”。
lexical_decisions:
- source_word: ἔρχεται
  choice: 他过来
  rationale: 希腊文采用历史现在时；现代汉语动词本身不标时态。“过来”保留动作的临场感，又不额外加入原文未明说的“回来”。
- source_word: εὑρίσκει αὐτοὺς καθεύδοντας
  choice: 见他们正在睡觉
  rationale: “见”自然表达 εὑρίσκει 在此处的发现之意；“正在睡觉”保留分词所表达的持续动作。
- source_word: λέγει τῷ Πέτρῳ
  choice: 就对彼得说
  rationale: “对……说”自然表达与格所指的说话对象；“就”连接连续发生的叙事动作，不改变其逻辑关系。
- source_word: Σίμων
  choice: 西门
  rationale: 保留耶稣对彼得本名的直接称呼，并与叙述中的“彼得”明确区分。
- source_word: καθεύδεις
  choice: 你在睡觉吗
  rationale: 以现代汉语进行体表达当前正在发生的动作，保留直接责问的语气。
- source_word: οὐκ ἴσχυσας
  choice: 你……也不能
  rationale: 此处表示没有能力做到某事；“不能”比“没有足够力气”更符合语境，也自然传达否定问句。
- source_word: μίαν ὥραν
  choice: 连一个小时
  rationale: “一个小时”表达时间延续的宾格；“连……也”自然呈现原句否定问句中的责备意味。
- source_word: γρηγορῆσαι
  choice: 保持清醒
  rationale: 紧接门徒睡觉的情景，首先表达不睡着、保持醒着之意，同时不排除警觉守望的语义。
theological_decisions:
- issue: 马可叙事中历史现在时的呈现
  choice: 采用不显式标注过去时的连续动作叙述：“过来……见……说”。
  alternative: 加入“了”等完成标记，译成较明确的过去叙事。
  rationale: 现代汉语动词没有与希腊语相同的时态形态；现有译法既自然，又能保留原文鲜明直接的叙事推进。
- issue: γρηγορέω 在本节中的含义
  choice: 保持清醒
  alternative: 警醒；守望
  rationale: 上下文直接把该动作与睡觉对照，因此正文以前景意义“保持清醒”为主；“警醒”所含的警觉、守望意味则作为脚注保留，避免排除原词的较宽语义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“彼得／西门”的名称转换；问句维持耶稣直接而带责备的语气。
