  text: ὁ δὲ ἤρξατο ἀναθεματίζειν καὶ ὀμνύναι ὅτι Οὐκ οἶδα τὸν ἄνθρωπον τοῦτον ὃν λέγετε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/071.yaml
  text: But he began to call down curses and to swear[a], “I do not know this man you are talking about.”
translation:
  language: zh_hans
  text: 他却开始赌咒发誓[a]，说：“你们说的这个人，我不认识。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“咒诅”；也可能指“求咒诅临到自己身上”。希腊文没有明确说明咒诅的对象。
    reason: 词义存在合理的不同理解，且原文省略了咒诅的对象。
lexical_decisions:
- source_word: ὁ δὲ
  choice: 他却
  rationale: δέ在此推动叙事并带有轻微转折；“却”自然体现彼得在指认加剧时的反应。
- source_word: ἤρξατο
  choice: 开始
  rationale: 与后接不定式连用，表达动作的起始，直译为“开始”准确自然。
- source_word: ἀναθεματίζειν
  choice: 赌咒
  rationale: 该词指祈求或招致咒诅，并非单指说脏话。“赌咒”在现代汉语中能表达以咒诅强化否认，又不明确补出咒诅的对象。
- source_word: ὀμνύναι
  choice: 发誓
  rationale: 准确表达正式起誓或立誓的含义；与“赌咒”并列也符合自然汉语习惯。
- source_word: ὅτι
  choice: 说：“……”
  rationale: ὅτι引出誓言和否认的内容；汉语用直接引语表达最自然。
- source_word: Οὐκ οἶδα
  choice: 我不认识
  rationale: οἶδα基本义为“知道、认识”；谈到人时，“不认识”自然地表达否认与此人相识，同时不额外解释关系性质。
- source_word: τὸν ἄνθρωπον τοῦτον
  choice: 这个人
  rationale: 保留指示词τοῦτον的指向性，不加入“家伙”等原文未必具有的贬抑语气。
- source_word: ὃν λέγετε
  choice: 你们说的
  rationale: 简洁自然地表达“你们所说到的那个人”，避免较生硬的“你们所谈论的”。
theological_decisions:
- issue: ἀναθεματίζειν所指咒诅的性质与对象
  choice: 正文译为“赌咒”，不说明他咒诅谁或是否求咒诅临到自己。
  alternative: “咒诅”或“求咒诅临到自己身上”
  rationale: 在起誓语境中，该词可能暗含自我咒诅，但希腊文没有明说咒诅的对象。正文因此保留宽泛含义，脚注交代可能解释，避免把彼得咒诅耶稣或明确自我咒诅的理解写入经文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“赌咒发誓”是自然汉语搭配，既表现彼得否认的升级，也保留原文关于咒诅对象的含混。
