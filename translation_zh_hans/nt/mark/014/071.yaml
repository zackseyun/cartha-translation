  source_fidelity: “他却开始赌咒发誓”准确对应ὁ δὲ ἤρξατο ἀναθεματίζειν καὶ ὀμνύναι：保留了动作的开始、叙事中的轻微转折，以及“招致/宣告咒诅”与“起誓”两个并列动作。“你们说的这个人，我不认识”忠实传达Οὐκ οἶδα τὸν ἄνθρωπον τοῦτον ὃν λέγετε，并保留了指示词“这个”。
