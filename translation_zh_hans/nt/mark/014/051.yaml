  text: Καὶ ⸂νεανίσκος τις⸃ ⸀συνηκολούθει αὐτῷ περιβεβλημένος σινδόνα ἐπὶ γυμνοῦ, καὶ κρατοῦσιν ⸀αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/051.yaml
  text: And a certain young man was following him[a], wearing only a linen cloth over his naked body, and they seize him,
translation:
  language: zh_hans
  text: 有一个年轻人跟着耶稣，身上只裹着一块细麻布[a]；他们就抓住他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“细麻布单”。希腊语σινδών可指细麻布，也可指布单一类的衣物。
    reason: lexical_alternative
lexical_decisions:
- source_word: νεανίσκος τις
  choice: 有一个年轻人
  rationale: νεανίσκος指年轻男子，τις带有不确指而略加特指的意味；“有一个年轻人”自然引入这位未具名人物。
- source_word: συνηκολούθει αὐτῷ
  choice: 跟着耶稣
  rationale: 未完成时表达当时持续进行的动作；汉语“跟着”可自然体现这一动态。代词所指按上下文明确为耶稣。
- source_word: περιβεβλημένος σινδόνα
  choice: 披着一块细麻布
  rationale: περιβάλλω表示披上或裹上；σινδών可指细麻布、布单或由此制成的简便衣物。“披着一块细麻布”既自然，又不把具体形制说死。
- source_word: ἐπὶ γυμνοῦ
  choice: 只在赤身上
  rationale: 该短语表明麻布直接披在裸身上，没有其他衣物；“只在赤身上”保留原文强调的状态。
- source_word: κρατοῦσιν αὐτόν
  choice: 众人就抓他
  rationale: κρατέω在此表示抓住或拿住，而非必须解释为正式逮捕。希腊文采用历史现在时增强现场感；现代汉语叙事以“就抓他”自然传达动作的突然推进。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“赤身”比“裸体”更符合经文语体；“披着”保留布料可能只是裹在身上的含义。经文本句在原文中以逗号衔接下文，但中文出版可用句号完整呈现本节。
