  text: And not even in this way was their testimony consistent[a].
translation:
  language: zh_hans
  text: 即便如此，他们的证词仍不一致[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“仍不相符”；按字面为“仍不相等”。
    reason: 保留ἴση在证词语境中的“相符／一致”之义，并说明其字面义为“相等”。
lexical_decisions:
- source_word: καὶ οὐδὲ
  choice: 即使……也……不
  rationale: 在本句语境中共同构成递进性的否定，承接前文并强调：即便采用上述说法，证词仍未吻合。
- source_word: οὕτως
  choice: 这样
  rationale: 回指上一节所述的作证方式或指控内容，简洁自然，并保留原文的指示意义。
- source_word: ἴση
  choice: 彼此一致
  rationale: 该词字面义为“相等”；在多名证人作证的司法语境中，表示证词互相吻合。“彼此一致”清楚传达其语境义，同时以脚注保留字面表达。
- source_word: ἦν
  choice: （也）……不一致
  rationale: εἰμί的未完成过去时在汉语叙事中无需另加时态标记，由上下文表达过去情境。
- source_word: ἡ μαρτυρία αὐτῶν
  choice: 他们的证词
  rationale: μαρτυρία在审讯语境中指所作的证言；属格αὐτῶν自然译为“他们的”。
