  text: ⸀ἤρξαντο λυπεῖσθαι καὶ λέγειν αὐτῷ εἷς κατὰ εἷς· Μήτι ⸀ἐγώ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/019.yaml
  text: They began to be grieved and to say to him[a], one by one, “Surely not I?”
translation:
  language: zh_hans
  text: 他们就忧愁起来，一个一个地对他说：“不会是我吧？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译作：“不是我吧？”希腊语的问句预期否定的回答。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντο
  choice: 就……起来
  rationale: 与后接不定式共同表示动作或状态的开始；“忧愁起来”自然传达起始意义，句中的“就”也承接耶稣先前的话所引发的反应。
- source_word: λυπεῖσθαι
  choice: 忧愁
  rationale: 表示陷入悲伤、愁苦的状态；“忧愁”庄重而通俗，符合席间沉重的语境。
- source_word: καὶ λέγειν αὐτῷ
  choice: 对他说
  rationale: 保留 λέγειν 的一般言说义和 αὐτῷ 的代词形式，不把动词窄化为“问”，也不把“他”明说为“耶稣”。
- source_word: εἷς κατὰ εἷς
  choice: 一个一个地
  rationale: 准确表达逐一、分别作出回应的分配性含义，现代汉语自然清楚。
- source_word: Μήτι ἐγώ;
  choice: 不会是我吧？
  rationale: μήτι 引导预期否定回答的疑问；“不会……吧”既保留门徒希望答案是否定的语气，也自然表达惊惧与不安。
theological_decisions:
- issue: 门徒疑问句的语气
  choice: 译作“不会是我吧？”以表达预期否定回答
  alternative: “是我吗？”
  rationale: 希腊语 μήτι 通常暗示说话者预期答案为“不是”；若仅译作“是我吗”，会失去这种否认期待，同时不宜进一步断定他们究竟是在抗议还是惶恐。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“一个一个地”贴近日常表达；“不会是我吧”自然呈现原文问句所期待的否定回答。
