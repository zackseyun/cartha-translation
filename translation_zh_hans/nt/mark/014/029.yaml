  text: ὁ δὲ Πέτρος ἔφη αὐτῷ· ⸂Εἰ καὶ⸃ πάντες σκανδαλισθήσονται, ἀλλ’ οὐκ ἐγώ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/029.yaml
  text: But Peter said to him[a], “Even if all fall away, I will not.”
translation:
  language: zh_hans
  text: 彼得却对他说：“即使众人都跌倒[a]，我也不会。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“被绊倒”、“动摇”或“离弃”。希腊文这个动词可指被绊倒、因某事动摇，或从忠诚中退去。
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: 却
  rationale: 承接上文，并突出彼得对耶稣预言的反驳；“却”符合现代汉语叙事表达。
- source_word: ἔφη αὐτῷ
  choice: 对他说
  rationale: 保留希腊文的间接宾语代词，不将“他”明示为“耶稣”；“说”自然准确。
- source_word: Εἰ καὶ
  choice: 即使
  rationale: 表达让步条件，保留彼得所设想的极端情形。
- source_word: πάντες
  choice: 众人
  rationale: 在上下文中指其余门徒；“众人”既概括全体，也不额外补入解释。
- source_word: σκανδαλισθήσονται
  choice: 跌倒
  rationale: 该词可指被绊倒、因某事动摇或离弃；“跌倒”保留其比喻色彩与语义张力，脚注说明较强的可能含义。
- source_word: ἀλλ’ οὐκ ἐγώ
  choice: 我也不会
  rationale: 希腊文是强调“我”的省略句；汉语补出前句所隐含的动作，并以“也”自然表达即便众人如此、彼得自称仍不会如此的对照。
theological_decisions:
- issue: σκανδαλισθήσονται 在门徒失败语境中的力度
  choice: 跌倒
  alternative: 离弃；被绊倒；动摇
  rationale: “离弃”能突出随后逃散的严重性，却可能过早限定该词；正文采用“跌倒”保留比喻及神学张力，并用脚注交代其可包含动摇或离弃之意。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“彼得却对他说”清楚呈现转折；引语简洁直接。正文与脚注标记[a]一致。
