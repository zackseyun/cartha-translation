  naturalness: “彼得却对他说：‘即使众人都跌倒，我也不会。’”是自然、简洁且适合现代汉语庄重叙事文体的表达。“我也不会”在此条件句中可清楚理解为“我也不会跌倒”，并自然承接前句省略的谓语。
