  to: 有些人开始向他吐唾沫，遮住他的脸[a]，用拳头打他，对他说：“预言吧！”差役就用巴掌打他[b]。
  rationale: 修订将末句改为现代汉语中清楚的“差役就用巴掌打他”，忠实传达其实际语义；脚注保留ἔλαβον与ῥαπίσμασιν构成的特殊表达及较贴近字面的替代译法。将“说预言吧”简化为“预言吧”，更符合现代汉语，也不增添原文未明说的嘲弄内容。
