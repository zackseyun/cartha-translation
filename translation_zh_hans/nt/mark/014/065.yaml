  text: καὶ ἤρξαντό τινες ἐμπτύειν αὐτῷ καὶ περικαλύπτειν ⸂αὐτοῦ τὸ πρόσωπον⸃ καὶ κολαφίζειν αὐτὸν καὶ λέγειν αὐτῷ· Προφήτευσον, καὶ οἱ ὑπηρέται ῥαπίσμασιν αὐτὸν ⸀ἔλαβον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/065.yaml
  text: And some began to spit on him[a], and to cover his face, and to strike him with their fists, and to say to him[b], “Prophesy!” And the officers received him with blows.
translation:
  language: zh_hans
  text: 有些人开始向他吐唾沫，遮住他的脸[a]，用拳头打他，对他说：“预言吧！”差役就用巴掌打他[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“蒙住他的眼睛。”希腊文直译为“遮住他的脸”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“差役用击打接待他”或“差役以掌击对待他”。希腊文的措辞直译近于“差役用击打接过了他”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντό τινες
  choice: 有些人开始
  rationale: 保留不定复数“有些人”和动作起始的叙事推进。
- source_word: ἐμπτύειν αὐτῷ
  choice: 向他吐唾沫
  rationale: 自然表达直接针对耶稣的侮辱行为；“向他”不必限定唾沫是否落在身上。
- source_word: περικαλύπτειν αὐτοῦ τὸ πρόσωπον
  choice: 遮住他的脸
  rationale: 贴近希腊文“遮盖他的脸”，不在正文中直接将其解释为蒙眼。
- source_word: κολαφίζειν αὐτόν
  choice: 用拳头打他
  rationale: κολαφίζω通常指以拳击打，比笼统的“殴打”更具体。
- source_word: Προφήτευσον
  choice: 说预言吧！
  rationale: 保留单独的命令式嘲讽，不补入“告诉我们是谁打你”等其他经文中的解释性内容。
- source_word: οἱ ὑπηρέται
  choice: 差役
  rationale: 在审讯场景中指执行事务的下属人员，不是家仆；“差役”能体现其职务身份。
- source_word: ῥαπίσμασιν
  choice: 用巴掌打
  rationale: ῥάπισμα指击打，常可指掌掴；这里与前面的拳打形成自然区别，同时避免过度限定具体次数。
- source_word: ἔλαβον
  choice: 接过他来
  rationale: 尽量保留λαμβάνω“接过、接手”的形象及希腊语表达的特殊性，同时用后面的“用巴掌打他”使中文意义清楚。
theological_decisions:
- issue: 嘲弄命令Προφήτευσον与耶稣身份之间的叙事张力
  choice: 说预言吧！
  alternative: 显显你先知的本事吧！
  rationale: 原文只用“说预言”这一命令，没有明说对耶稣身份的解释；直译可保留嘲讽与叙事反讽，而不把神学含义提前说破。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“说预言吧”保留简短而尖刻的嘲讽；“差役”符合司法场景。“接过他来”略带书面色彩，用来保留末句希腊文不同寻常的措辞，脚注同时提供更自然的译法。
