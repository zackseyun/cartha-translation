  source_fidelity: 正文前半准确保留了不定主语、动作起始、吐唾沫、遮脸、拳打及嘲弄性的命令。末句“接过他来，用巴掌打他”虽试图反映ἔλαβον，却在现代汉语中造成不必要的动作衔接歧义；原句是一个惯用而略显特殊的表达，明确传达差役以掌击对待他。
  naturalness: “接过他来”在此不合现代汉语叙事习惯，且读者容易理解为先由他人移交给差役，原文并未明确这一情节。“预言吧！”比“说预言吧！”更简洁自然，也更直接对应命令式Προφήτευσον。
  terminology: “差役”可指司法或执行事务的下属人员，能对应审讯场景中的ὑπηρέται；“巴掌”恰当地表达ῥαπίσμασιν常见的掌击含义，但不应把它说成绝对限定。
