  text: ἠκούσατε τῆς βλασφημίας· τί ὑμῖν φαίνεται; οἱ δὲ πάντες κατέκριναν αὐτὸν ⸂ἔνοχον εἶναι⸃ θανάτου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/064.yaml
  text: You have heard the blasphemy[b][a]. What does it seem to you? And they all condemned him as deserving death.
translation:
  language: zh_hans
  text: “你们已经听见这亵渎的话了。你们怎么看？”众人都判定他该受死刑。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“判定他当受死刑”、“判定他犯了该死的罪”或“判定他应对死亡负责”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκούσατε
  choice: 你们已经听见
  rationale: 不定过去时在此指向众人刚刚听见的话；用“已经听见”自然表达大祭司依据刚发生之事发问的语气。
- source_word: τῆς βλασφημίας
  choice: 这亵渎的话
  rationale: ἀκούω 后接属格表示听见某事；定冠词指上文刚被指控的言论。“亵渎的话”既保留宗教和司法分量，也比单说“亵渎”更符合现代汉语。
- source_word: τί ὑμῖν φαίνεται
  choice: 你们看该怎么办？
  rationale: 该短语按字面是“在你们看来如何”，在审讯语境中是征询意见或裁断；此译自然地传达其实际功能，同时不把问题过度限定为正式宣判。
- source_word: πάντες
  choice: 一致
  rationale: 保留 πάντες 所强调的全体同意；汉语以“一致判定”自然简洁地表达“他们全都”。
- source_word: κατέκριναν
  choice: 判定
  rationale: κατακρίνω 是司法性用语，表示作出不利裁决或定罪；与后面的“应当受死”搭配时，“判定”能避免汉语“判处……应当……”的累赘。
- source_word: ἔνοχον εἶναι θανάτου
  choice: 应当受死
  rationale: 该结构表示须承担死亡刑罚、配受死；正文采用自然而庄重的汉语，脚注保留“当受死刑”的司法表达。
theological_decisions:
- issue: 审讯语境中 βλασφημία 的表述
  choice: 这亵渎的话
  alternative: 这亵渎；亵渎神的话
  rationale: 经文呈现大祭司所提出的指控，并非叙述者确认该指控成立。“这亵渎的话”保留指控的宗教和法律重量，又不添加原文未明说的“神”，从而维持文本中的神学张力。
- issue: ἔνοχον εἶναι θανάτου 的刑罚含义
  choice: 应当受死
  alternative: 当受死刑；犯了该死的罪
  rationale: 原文可表达应承担死亡刑罚或配受死。选择“应当受死”保留两者之间的张力，不将其改写成具体罪名，也避免“该死”在现代汉语中的辱骂色彩。
translation_notes:
  register: 采用现代、庄重而易懂的审讯叙事语体。“你们看该怎么办？”是 τί ὑμῖν φαίνεται 的自然汉语表达；“一致判定他应当受死”保留全体裁决及死刑责任。脚注标记已在正文中出现。
