  text: Καὶ ἐσθιόντων αὐτῶν ⸀λαβὼν ἄρτον εὐλογήσας ἔκλασεν καὶ ἔδωκεν αὐτοῖς καὶ εἶπεν· ⸀Λάβετε, τοῦτό ἐστιν τὸ σῶμά μου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/022.yaml
  text: And as they were eating[a], he took bread, blessed it, broke it, and gave it to them, and said, “Take; this is my body.”
translation:
  language: zh_hans
  text: 他们正吃的时候，耶稣拿起饼来，祝福后，就掰开，给了他们，说：“拿去；这是我的身体。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可理解为“这代表我的身体”或“这是指我的身体”。希腊文直译为“这是我的身体”。
    reason: 说明可能的解释性理解，同时明确正文所依据的希腊文字面表达。脚注标记置于它实际说明的宣告之后。
lexical_decisions:
- source_word: ἐσθιόντων αὐτῶν
  choice: 他们正吃的时候
  rationale: 属格独立结构中的现在分词表示与主句动作同时进行；“正吃的时候”自然地保留了动作持续的意味。
- source_word: λαβὼν ἄρτον
  choice: 耶稣拿起饼来
  rationale: 将不定过去时分词按汉语叙事习惯译成连续动作；ἄρτον没有冠词，译作“饼”而不具体限定为某一种饼。主语“耶稣”由上下文补明，避免汉语指代含混。
- source_word: εὐλογήσας
  choice: 祝福后
  rationale: 该词在用餐语境中指祝福或宣告祝福；不明说祝福的对象，以免超出希腊文所表达的内容。
- source_word: ἔκλασεν
  choice: 就掰开
  rationale: 指把饼掰开以便分给众人；汉语从上文自然承接宾语“饼”，“掰开”比传统的“擘开”更符合现代通用语。
- source_word: ἔδωκεν αὐτοῖς
  choice: 给了他们
  rationale: 直译“给他们”；所给之物由上下文清楚可知，无须添加“分发”等解释性含义。
- source_word: Λάβετε
  choice: 拿去
  rationale: 不定过去时命令式直接吩咐门徒拿取饼；“拿去”在这一递交场景中比孤立的“拿”更自然，也没有加入“吃”等原文未明说的动作。
- source_word: τοῦτό ἐστιν
  choice: 这是
  rationale: 保留普通系词ἐστιν的直接表达，不在正文中改译为“代表”或“意思是”。
- source_word: τὸ σῶμά μου
  choice: 我的身体
  rationale: σῶμα在此直接译为“身体”，不在译文中预先判定其象征性或圣礼性解释。
theological_decisions:
- issue: 耶稣在晚餐中所说“这是我的身体”的含义
  choice: 正文直译为“这是我的身体”
  alternative: “这代表我的身体”或“这是指我的身体”
  rationale: 希腊文使用普通系词ἐστιν。直译既忠于原文，也保留不同圣餐理解之间真实存在的神学张力，不由译者在正文中替读者作出裁决。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“正吃的时候”保留同时进行的动作，“掰开”避免过于古雅的“擘开”。正文中的分号表现命令与随后解释之间的停顿，并保留原句简洁有力的语气。
