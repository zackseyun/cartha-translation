  terminology: “祭司长”准确对应复数ἀρχιερεῖς；“整个议会”保留ὅλον τὸ συνέδριον的整体范围，并以脚注提供该机构在本段历史语境中的具体名称。“处死”适合θανατόω的司法语境，且不带宗派性解释。
