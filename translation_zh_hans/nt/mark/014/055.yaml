  text: οἱ δὲ ἀρχιερεῖς καὶ ὅλον τὸ συνέδριον ἐζήτουν κατὰ τοῦ Ἰησοῦ μαρτυρίαν εἰς τὸ θανατῶσαι αὐτόν, καὶ οὐχ ηὕρισκον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/055.yaml
  text: The chief priests and the whole council were seeking testimony against Jesus in order to put him to death, and they were not finding any.
translation:
  language: zh_hans
  text: 祭司长和整个议会[a]一直在寻找控告耶稣的证词，好把他处死，却始终找不到。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“整个犹太公议会”。
    reason: 提供συνέδριον在此历史语境中更具体的名称。
lexical_decisions:
- source_word: οἱ δὲ
  choice: 祭司长和……
  rationale: δέ仅作轻微的叙事衔接或转折；现代汉语在此无需另加“这时”或“但是”，由上下文自然承接。
- source_word: ἀρχιερεῖς
  choice: 祭司长
  rationale: 复数形式在此指耶路撒冷的祭司领袖群体；“祭司长”是准确、通行的译法，并非指多位现任大祭司。
- source_word: ὅλον τὸ συνέδριον
  choice: 整个议会[a]
  rationale: συνέδριον指统治和审判事务的议事机构；“议会”直接表达其意义，“整个”保留ὅλον。脚注注明其更具体的历史称谓。
- source_word: ἐζήτουν
  choice: 一直在寻找
  rationale: 未完成时表达持续进行的行动；“一直在寻找”自然地保留这一延续意味。
- source_word: κατὰ τοῦ Ἰησοῦ μαρτυρίαν
  choice: 控告耶稣的证词
  rationale: κατά加属格在此具有敌对、针对之意；μαρτυρία处于审判语境，指证言内容，因此译为“控告……的证词”。
- source_word: εἰς τὸ θανατῶσαι αὐτόν
  choice: 好把他处死
  rationale: εἰς加冠词化不定式表达目的；θανατόω在审判场景中译作“处死”，兼顾明确含义与司法语气。
- source_word: καὶ οὐχ ηὕρισκον
  choice: 却始终找不到
  rationale: καί连接的末句在语境中形成结果上的反差，汉语用“却”更自然；未完成时与前句呼应，“始终找不到”保留反复寻找而无所得的持续意味，并未强化为能力上的“不能”。
theological_decisions:
- issue: συνέδριον所指机构的识别
  choice: 正文译作“整个议会”，脚注说明为“整个犹太公议会”。
  alternative: 正文直接译作“整个犹太公议会”。
  rationale: 原文使用该议事机构的普通名称；正文翻译其基本意义，避免要求普通读者预先了解历史专名，同时借脚注保留其在本段语境中的具体历史指称。此选择不涉及宗派立场。
- issue: 寻找证词的目的
  choice: 译作“好把他处死”，明确保留目的关系。
  alternative: 译作“为了判他死刑”。
  rationale: 原文说的是使他死亡或将他处死，并未在此动词本身中明确说“判刑”；因此不把审判程序中可能隐含的判决步骤写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“一直在寻找……却始终找不到”自然呈现两个未完成时的持续性和语境中的反差；避免生硬照搬英语进行体，也不额外加入原文没有的时间副词。
