base_translation:
  language: en
  yaml_path: translation/nt/mark/014/008.yaml
  text: She did what she could[a]; she anointed my body beforehand for burial.
translation:
  language: zh_hans
  text: 她尽了自己所能[a]；她把香膏预先抹在我的身体上，为安葬作准备。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“她所拥有的，她做了。”
    reason: 保留 ὃ ἔσχεν ἐποίησεν 的字面结构；正文采用其在语境中的惯用含义。
lexical_decisions:
- source_word: ὃ ἔσχεν ἐποίησεν
  choice: 她做了自己所能做的
  rationale: 这一短语字面可理解为“她所有的，她做了”，但在上下文中是能力范围的惯用表达。译作“她做了自己所能做的”既自然，也保留了她已尽力而为的含义。
- source_word: προέλαβεν
  choice: 预先
  rationale: 该动词表示抢先或提前采取行动；与后面的不定式连用时，译为“预先……了”清楚表达时间上的提前，不误加“来到”等移动含义。
- source_word: μυρίσαι
  choice: 用香膏膏了
  rationale: μυρίζω 指把香料或香膏涂在某人身上。在本段语境中，“用香膏膏了”既准确说明所用之物，也符合现代汉语表达。
- source_word: τὸ σῶμά μου
  choice: 我的身体
  rationale: 直接对应原文宾语，措辞清楚而庄重。
- source_word: εἰς τὸν ἐνταφιασμόν
  choice: 为安葬作准备
  rationale: 介词短语指向安葬这一目的；“为安葬作准备”自然呈现香膏涂身与安葬准备之间的关系。
theological_decisions:
- issue: 是否按照上下文补出原文动词中隐含的女性主语
  choice: 补出“她”
  alternative: 不明说主语，译成省略主语的汉语句式
  rationale: 希腊文以第三人称单数动词承载主语，紧接的上下文明确所指是那位女子。现代汉语补出“她”能避免含混，并未增加新的神学内容。
- issue: 如何表达此行动与安葬之间的关系
  choice: 为安葬作准备
  alternative: 为了安葬；为我的安葬
  rationale: 原文 εἰς 可表达目的或指向结果，而“我的”虽可由“我的身体”及说话者推知，却没有在“安葬”一词前再次明说。所选译法保留目的关系，同时不作不必要的扩充。
translation_notes:
  register: 采用自然、庄重而通俗的现代标准汉语。“用香膏膏了”保留圣经语境中的动作含义，同时避免仅译“膏了”可能造成的不清楚；分号对应原文两个紧密相连的陈述。
