  text: πολλοὶ γὰρ ἐψευδομαρτύρουν κατ’ αὐτοῦ, καὶ ἴσαι αἱ μαρτυρίαι οὐκ ἦσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/056.yaml
  text: For many were giving false testimony against him[a], and their testimonies were not consistent.
translation:
  language: zh_hans
  text: 因为有许多人作假见证控告他，但他们的证词彼此不一致。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλοὶ
  choice: 有许多人
  rationale: 该形容词在此作名词使用，指许多人；不补出原文未明说的“证人”。
- source_word: γὰρ
  choice: 因为
  rationale: 承接并解释上下文中未能找到定罪证据的原因，现代汉语用“因为”自然保留其解释作用。
- source_word: ἐψευδομαρτύρουν
  choice: 作假见证
  rationale: 保留法律审讯语境以及“假见证”的明确含义；上下文已呈现持续、反复作证的场景，汉语不必另加体貌词。
- source_word: κατ’ αὐτοῦ
  choice: 控告他
  rationale: κατά加属格在此具有敌对、司法性的指向；“控告他”比单纯“反对他”更切合审讯语境。
- source_word: ἴσαι
  choice: 彼此一致
  rationale: 字面为“相等”，用于多份证词时表示相互吻合；“彼此一致”自然且准确。
- source_word: αἱ μαρτυρίαι
  choice: 他们的证词
  rationale: 定冠词指向前述众人所作的见证；汉语以“他们的”明确所指，“证词”保留司法语域。
- source_word: οὐκ ἦσαν
  choice: 不一致
  rationale: 与ἴσαι合译为“不一致”，简洁表达否定的系词结构。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的司法叙事用语。“作假见证”保留经文的法律与道德分量，“证词彼此不一致”准确表达各项陈述不能吻合。
