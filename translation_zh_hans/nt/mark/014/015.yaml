  yaml_path: translation/nt/mark/014/015.yaml
  text: And he himself will show you a large upper room[a], furnished and ready; prepare for us there.
translation:
  language: zh_hans
  text: 他会亲自指给你们看一间宽敞的楼上房间[a]，已经布置妥当，预备好了；你们要在那里为我们预备。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一间宽敞的楼上房间，已经铺设妥当，预备好了。”这里译作“布置妥当”的希腊语也可指房间已经铺设、陈设或布置好，不一定只表示备有家具。
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς
  choice: 亲自
  rationale: 该代词带有强调意味；用“亲自”自然地保留这一强调，又不必生硬地译作“他自己”。
- source_word: ὑμῖν δείξει
  choice: 带你们去看
  rationale: δείξει意为“给……看、指给……看”；在带领门徒寻找房间的语境中，“带你们去看”是自然且不增添实质信息的表达。
- source_word: ἀνάγαιον
  choice: 楼上房间
  rationale: 指房屋上层的房间；“楼上房间”比传统措辞“楼房”更符合现代普通话，也不额外指定其用途。
- source_word: μέγα
  choice: 宽敞的
  rationale: μέγα表示房间大；中文描述房间时，“宽敞”较“大”自然，并保留其空间充足之意。
- source_word: ἐστρωμένον
  choice: 铺设妥当
  rationale: 该分词源于στρώννυμι，可指铺开、陈设或布置妥当；“铺设妥当”保留其具体意象，同时不武断限定为仅有家具或仅铺坐席。
- source_word: ἕτοιμον
  choice: 预备好了
  rationale: 表示已经就绪；这样既保留其状态意义，也与随后要求门徒进一步“预备”逾越节所需之物形成原文中的张力。
- source_word: ἐκεῖ
  choice: 在那里
  rationale: 直接表达地点副词的含义，清楚指回楼上房间。
- source_word: ἑτοιμάσατε
  choice: 预备
  rationale: 不定过去时命令语气复数，直接吩咐门徒采取行动；“预备”在此庄重而自然。
- source_word: ἡμῖν
  choice: 为我们
  rationale: 忠实保留复数代词，不扩展其具体所指。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的普通话。“铺设妥当，预备好了”刻意保留两个相近却不完全相同的描述，并与后文“你们就在那里为我们预备”区分：房间本身已经就绪，门徒仍须在那里作进一步准备。
