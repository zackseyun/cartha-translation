  text: ἀλλὰ μετὰ τὸ ἐγερθῆναί με προάξω ὑμᾶς εἰς τὴν Γαλιλαίαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/028.yaml
  text: But after I am raised[a], I will go ahead of you into Galilee.
translation:
  language: zh_hans
  text: 但我复活以后，要比你们先到加利利去。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我被复活以后”。原文使用“使……起来”的被动式，是常用于指复活的表达。
    reason: 说明原文被动形式，并提供不在正文中强行复制被动语态的替代译法。
lexical_decisions:
- source_word: ἀλλὰ
  choice: 但
  rationale: 承接上文门徒将要四散的预告，简洁表达转折。
- source_word: μετὰ τὸ ἐγερθῆναί με
  choice: 我复活以后
  rationale: μετά加冠词化不定式表示时间先后；现代汉语用“……以后”自然清楚。被动式在汉语复活语境中通常自然表达为“复活”，脚注说明原文形式。
- source_word: προάξω ὑμᾶς
  choice: 要在你们前面……去
  rationale: 保留προάγω在此处先于他人前往目的地的方向含义；“你们”明确第二人称复数。
- source_word: εἰς τὴν Γαλιλαίαν
  choice: 往加利利去
  rationale: 自然表达εἰς所指向的移动目的地，同时避免生硬的“进入加利利”。
theological_decisions:
- issue: ἐγερθῆναί的复活与被动语态
  choice: 复活
  alternative: 被使其起来／被复活
  rationale: “复活”是现代汉语表达耶稣从死里起来的自然用语；不在正文中生硬复制希腊语被动形式，也不把施事者补入正文。原文的被动语态通过脚注保留，避免消除其神学张力。
translation_notes:
  register: 采用现代、庄重而口语自然的标准普通话。“在你们前面往加利利去”保留先行前往的空间含义；正文以“复活”传达语境中的复活意义，并用脚注交代希腊语被动式。
