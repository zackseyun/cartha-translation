  naturalness: ‘在你们前面往加利利去’语序和搭配略显生硬。改为‘比你们先到加利利去’更符合现代标准汉语，并保留先行至该地的意义。
  terminology: ‘复活’是庄重、通行且符合本节语境的用语。原脚注中的‘我被使其起来以后’不合汉语语法，‘被唤起’也不适合作为此处复活表达，宜改为清楚的被动式替代译法。
