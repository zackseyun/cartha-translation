  text: Καὶ τῇ πρώτῃ ἡμέρᾳ τῶν ἀζύμων, ὅτε τὸ πάσχα ἔθυον, λέγουσιν αὐτῷ οἱ μαθηταὶ αὐτοῦ· Ποῦ θέλεις ἀπελθόντες ἑτοιμάσωμεν ἵνα φάγῃς τὸ πάσχα;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/012.yaml
  text: And on the first day of Unleavened Bread[a], when they were sacrificing the Passover lamb, his disciples said to him, “Where do you want us to go and prepare so that you may eat the Passover?”
translation:
  language: zh_hans
  text: 除酵节的第一天，当人们宰杀逾越节羊羔的时候，耶稣的门徒问他：“你要我们到哪里去，为你预备逾越节筵席，好让你吃呢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῇ πρώτῃ ἡμέρᾳ τῶν ἀζύμων
  choice: 除酵节的第一天
  rationale: “除酵节”是现代汉语中自然且通行的节期名称；原文虽未明说“节”，但复数属格 τῶν ἀζύμων 在此作为节期称谓，译出“节”可避免误解为普通无酵饼。
- source_word: ὅτε τὸ πάσχα ἔθυον
  choice: 就是人们宰杀逾越节羊羔的时候
  rationale: θύω 在献祭语境中意为宰杀、献祭；与 πάσχα 连用时，此处具体指逾越节的祭牲，即羊羔。未明确的复数主语译为泛指的“人们”，并以“的时候”自然表达未完成时的背景性动作。
- source_word: λέγουσιν
  choice: 问
  rationale: 原文是叙事历史现在时“说”；后接疑问句，汉语用“问”更自然，并按叙事惯例表达为过去事件而不另加时态标记。
- source_word: Ποῦ θέλεις
  choice: 你要我们到哪里去
  rationale: θέλω 在此表达意愿或安排；“你要我们……”是自然的现代汉语问法，也与后面的第一人称复数虚拟式相衔接。
- source_word: ἀπελθόντες ἑτοιμάσωμεν
  choice: 我们到哪里去预备
  rationale: 将先行分词 ἀπελθόντες 与主要动词合并为汉语连动结构“到……去预备”，既保留行动次序，也避免生硬直译。
- source_word: ἵνα φάγῃς τὸ πάσχα
  choice: 好让你吃逾越节的筵席
  rationale: “好让”清楚表达 ἵνα 的目的关系。此处 πάσχα 与“吃”连用，指逾越节筵席；补出“筵席”可与前句所指的祭牲区别开来。
theological_decisions:
- issue: 本节两处 πάσχα 所指是否相同
  choice: 第一处译为“逾越节羊羔”，第二处译为“逾越节的筵席”
  alternative: 两处都只译作“逾越节”
  rationale: 两处含义由搭配动词决定：与 θύω“宰杀、献祭”连用时指祭牲，与 ἐσθίω“吃”连用时指筵席。这是依语境区分词义，并非为解决年代或神学问题而作协调。
- issue: ὅτε τὸ πάσχα ἔθυον 的主语与语态
  choice: 译作主动泛指“人们宰杀……”
  alternative: 译作被动“逾越节羊羔被宰杀……”
  rationale: ἔθυον 的形态可作第三人称复数，原文未明说主语。用泛指“人们”保留其主动形式，同时不指定祭司、百姓或门徒等具体群体。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“除酵节”“逾越节羊羔”“筵席”均为普通读者可理解的圣经语汇；句式简洁，保留原文的节期背景、祭牲与筵席之间的语义区分。
