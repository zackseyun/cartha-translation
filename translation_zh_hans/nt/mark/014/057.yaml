lexical_decisions:
- source_word: καί
  choice: 又
  rationale: 承接前文并推进叙事；“又”自然表明另一些人接着采取行动，符合马可简洁的并列叙述。
- source_word: τινες
  choice: 有几个人
  rationale: 保留不定复数的含义，不说明具体人数或身份；现代汉语自然通顺。
- source_word: ἀναστάντες
  choice: 站起来
  rationale: 准确表达不定过去时分词所指的先行或伴随动作，也符合审讯场景。
- source_word: ἐψευδομαρτύρουν
  choice: 作假见证
  rationale: 兼顾法庭语境和该词“作伪证、提供虚假证言”的含义；汉语中的持续性可由上下文体现，无需生硬添加“不断”。
- source_word: κατ’ αὐτοῦ
  choice: 控告他
  rationale: 在法律语境中表达 κατά 加属格的敌对指向；与“作假见证”连用清楚自然。
- source_word: λέγοντες
  choice: 说：
  rationale: 引出下一节所载证言的具体内容；冒号符合现代汉语引语格式。
