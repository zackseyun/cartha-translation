  yaml_path: translation/nt/mark/014/004.yaml
  text: 'But some were indignant among themselves: “Why has this waste of the perfume happened?”[a][b]'
translation:
  language: zh_hans
  text: 但有几个人心中愤愤不平，彼此议论说：“为什么这样浪费香膏呢？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “彼此议论”或可译作“各自在心里不满”。希腊语原文既可指他们彼此之间的议论，也可指他们各自内心的反应。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν δέ
  choice: 但有……
  rationale: δέ在这里承接叙事，并使这些人的反应与女子的举动形成轻微对照；“但”自然地体现这一转折。
- source_word: τινες
  choice: 几个人
  rationale: 保留指代不明确的复数意义，同时符合现代汉语表达。
- source_word: ἀγανακτοῦντες
  choice: 很不满
  rationale: 该词表示强烈的不悦或愤慨；“很不满”自然易懂，也保留了责难意味。
- source_word: πρὸς ἑαυτούς
  choice: 彼此
  rationale: 上下文随即引出他们的议论，因此译作“彼此”最顺畅；原短语也可能指各自在心里，故加注说明。
- source_word: Εἰς τί
  choice: 为什么
  rationale: 这是询问目的或结果的习惯表达；现代汉语用“为什么”最自然。
- source_word: ἡ ἀπώλεια αὕτη τοῦ μύρου
  choice: 这样浪费香膏
  rationale: ἀπώλεια在此指说话者认为香膏遭到耗费；汉语动词结构比“香膏的这种浪费”更自然，并保留其负面判断。μύρον指带香气的膏或油，“香膏”准确且符合语境。
- source_word: γέγονεν
  choice: 呢（体现在整句状态结果中）
  rationale: 该完成时形式所表达的既成事件及当前结果，在汉语反问“为什么这样……呢”中自然体现，无须机械补出“发生了”。
