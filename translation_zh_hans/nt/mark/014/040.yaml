  text: καὶ ⸂πάλιν ἐλθὼν εὗρεν αὐτοὺς⸃ καθεύδοντας, ἦσαν γὰρ ⸂αὐτῶν οἱ ὀφθαλμοὶ⸃ ⸀καταβαρυνόμενοι, καὶ οὐκ ᾔδεισαν τί ⸂ἀποκριθῶσιν αὐτῷ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/040.yaml
  text: And coming again[a], he found them sleeping, for their eyes were weighed down, and they did not know what they should answer him.
translation:
  language: zh_hans
  text: 他又回来，发现他们正在睡觉；因为他们的眼睛很沉重，他们不知道该回答他什么[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“他们的眼睛正被压沉”，形容困倦使眼睛发沉。
    reason: 说明καταβαρυνόμενοι所保留的“被压沉”身体意象。
lexical_decisions:
- source_word: πάλιν
  choice: 又
  rationale: 表示叙事中动作再次发生；“又”简洁自然。
- source_word: ἐλθὼν
  choice: 回来
  rationale: 结合上下文，耶稣是离开门徒祷告后回到他们那里；用“回来”自然表达先于主句的动作。
- source_word: εὗρεν αὐτοὺς καθεύδοντας
  choice: 见他们正在睡觉
  rationale: 保留 καθεύδοντας 所表达的持续动作；“见”在此自然地表达“发现”。
- source_word: ἦσαν γὰρ αὐτῶν οἱ ὀφθαλμοὶ καταβαρυνόμενοι
  choice: 因为他们的眼皮沉重
  rationale: 希腊文直指“眼睛正被压沉”；现代汉语用“眼皮沉重”更自然，也保留困倦压眼的形象。
- source_word: οὐκ ᾔδεισαν
  choice: 他们不知道
  rationale: 直接保留 οἶδα 的认知含义，不改译为“不能理解”。
- source_word: τί ἀποκριθῶσιν αὐτῷ
  choice: 该怎样回答他
  rationale: 间接疑问中的虚拟语气表示不知应作何回答；“该怎样回答他”符合现代汉语表达。
