  text: Καὶ ἀπήγαγον τὸν Ἰησοῦν πρὸς τὸν ἀρχιερέα, καὶ ⸀συνέρχονται πάντες οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι καὶ οἱ γραμματεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/053.yaml
  text: And they led Jesus away to the high priest[a], and all the chief priests and the elders and the scribes gathered together.
translation:
  language: zh_hans
  text: 他们把耶稣带到大祭司那里。祭司长、长老和经学家全都聚集起来[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作“聚集起来”，这里使用现在时形式，在过去事件的叙述中带出生动、如临现场的效果。
    reason: 说明历史现在时的原文形式与叙事作用。
lexical_decisions:
- source_word: ἀπήγαγον（ἀπάγω）
  choice: 把……带到
  rationale: 该动词在这里指把耶稣带离原处并带往大祭司那里。“带到”在现代汉语中自然地表达了受人控制而被带往某处的情形，同时不额外限定押解的具体方式。
- source_word: ἀρχιερέα
  choice: 大祭司
  rationale: 单数在此指当时居首位的大祭司，与下文复数的祭司领导群体相区别。
- source_word: συνέρχονται（συνέρχομαι）
  choice: 聚集起来
  rationale: 该词表示众人来到一起、形成集会。“聚集起来”自然清楚；正文按汉语叙事习惯表达已发生之事，脚注说明希腊文采用历史现在时。
- source_word: πάντες
  choice: 全都
  rationale: 保留原文对这些领导群体悉数聚集的强调，并让其在汉语中自然地统摄并列的三类人。
- source_word: ἀρχιερεῖς
  choice: 祭司长
  rationale: 复数指祭司阶层中的领导人物；“祭司长”既区别于前面的单数“大祭司”，也是现代中文圣经语境中清楚而通行的称呼。
- source_word: πρεσβύτεροι
  choice: 长老
  rationale: 这里是制度性称谓，指受认可的领袖，而非泛指年长者。
- source_word: γραμματεῖς
  choice: 经学家
  rationale: 这里指熟悉并讲授、解释经书与律法的专业人士。“经学家”比传统的“文士”更便于普通现代读者理解，同时避免把其职能仅限于抄写。
theological_decisions:
- issue: 过去叙事中的历史现在时 συνέρχονται
  choice: 正文译作“聚集起来”，按自然汉语叙事表达过去事件，并以脚注交代其现在时形式
  alternative: 正文直译为“聚集起来了／这时聚集起来”，刻意凸显叙事现场感
  rationale: 此处的时态转换主要具有叙事上的生动效果，并不改变事件内容。正文优先采用自然、庄重的现代汉语，脚注则保存原文形式，避免无声地抹平这一特点。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“大祭司”与“祭司长”明确区分单数职位和复数领导群体；句号分开押送与聚集两个动作，使汉语层次清楚。脚注标记紧随其实际说明的“聚集起来”，而不是置于“大祭司”之后。
