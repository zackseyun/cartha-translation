id: MRK.14.21
reference: Mark 14:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ⸀ὅτι ὁ μὲν υἱὸς τοῦ ἀνθρώπου ὑπάγει καθὼς γέγραπται περὶ αὐτοῦ, οὐαὶ δὲ τῷ ἀνθρώπῳ ἐκείνῳ δι’ οὗ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται· ⸀καλὸν αὐτῷ εἰ οὐκ ἐγεννήθη ὁ ἄνθρωπος ἐκεῖνος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/021.yaml
  text: For the Son of Man goes just as it is written about him[a], but woe to that man through whom the Son of Man is betrayed. It would have been good for him if that man had not been born.
translation:
  language: zh_hans
  text: 因为人子固然要照着经上所记关于他的而去；但那出卖人子的人有祸了[a]！那人若没有出生，对他倒还好。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被出卖”也可译作“被交出去”。
    reason: 保留 παραδίδοται 的较字面词义及其在受难叙事中的词汇联系。
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 承接上文，引出耶稣对即将发生之事的解释，保留因果、说明的语气。
- source_word: ὁ μὲν ... δὲ
  choice: 固然……但……
  rationale: 明确表达 μέν…δέ 的对照结构，同时符合现代汉语习惯。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人子
  rationale: 采用这一称号在中文圣经传统中的通行译法，保留其自称性质及可能的《但以理书》背景。
- source_word: ὑπάγει
  choice: 要离去
  rationale: ὑπάγω 在这里不只是普通空间移动，也含有走向受难和死亡的语境意味；“要离去”自然地保留其含蓄性，不直接把死亡说明。
- source_word: καθὼς γέγραπται περὶ αὐτοῦ
  choice: 正如经上指着他所写的
  rationale: 保留 καθώς 的比较意义，以及 γέγραπται 所指向的成文圣经权威；“指着他”自然表达 περὶ αὐτοῦ。
- source_word: οὐαὶ
  choice: 有祸了
  rationale: 保留先知性警告与审判的严肃力度，比单纯表示哀叹的措辞更贴合语境。
- source_word: τῷ ἀνθρώπῳ ἐκείνῳ
  choice: 那……的人
  rationale: 结合后面的关系从句译为“那出卖人子的人”，既指明特定人物，又使汉语顺畅。
- source_word: δι’ οὗ
  choice: 那……的人
  rationale: διά 加属格表示中介或施事；在汉语中以关系结构表达，比直译“借着谁”更自然。
- source_word: παραδίδοται
  choice: 被出卖
  rationale: 在犹大背叛耶稣的直接语境中，“被出卖”清楚传达其背信性质；同时用脚注保留“被交出去”这一较字面的译法。
- source_word: καλὸν αὐτῷ
  choice: 对他倒好
  rationale: 与后面的反事实条件连用，表达“那样反而对他更好”的评价；不额外加入原文没有的比较级措辞。
- source_word: εἰ οὐκ ἐγεννήθη
  choice: 若没有出生
  rationale: 准确表达与事实相反的条件，不增加“从来”等强调成分。
- source_word: ὁ ἄνθρωπος ἐκεῖνος
  choice: 那人
  rationale: 保留指示词和郑重的重复，同时避免中文累赘。
theological_decisions:
- issue: 受难语境中 παραδίδοται 的译法
  choice: 被出卖
  alternative: 被交出去
  rationale: 直接语境突出犹大的背叛，因此正文采用“被出卖”；但原词也可指“交出、交付”，故在脚注中保留较字面的译法，以呈现受难叙事中的词汇联系。
- issue: 神所预示的受难与人的责任之间的张力
  choice: 同时保留“正如经上……所写的”和“那……的人有祸了”
  alternative: 将其中一面解释为决定论或减轻出卖者责任
  rationale: 原文并列陈述人子的道路符合经上所写，同时宣告出卖者有祸；译文不替原文消解这两者之间的神学张力。
- issue: καλὸν αὐτῷ 的评价力度
  choice: 对他倒好
  alternative: 对他更好
  rationale: 原文使用 καλόν 而非明确的比较级；中文“倒好”能表达反事实语境中的强烈评价，同时避免在字面上补出比较级。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“固然……但……”凸显原文的对照；“人子”“经上”保留通行的圣经表达。脚注标记置于整节末尾，但其内容明确对应正文中的“被出卖”。
