source:
  edition: SBLGNT
  text: ἀμὴν ⸀δὲ λέγω ὑμῖν, ὅπου ⸀ἐὰν κηρυχθῇ τὸ ⸀εὐαγγέλιον εἰς ὅλον τὸν κόσμον, καὶ ὃ ἐποίησεν αὕτη λαληθήσεται εἰς μνημόσυνον αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/009.yaml
  text: Truly I tell you[a], wherever the good news is proclaimed in the whole world[b], what this woman has done will also be spoken of in memory of her.
translation:
  language: zh_hans
  text: 我实在告诉你们：无论这好消息[a]在全世界什么地方被宣讲，这女人所做的事也会被人传述，作为对她的纪念[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“福音”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“为记念她”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: 我实在告诉你们
  rationale: ἀμήν在这里引出郑重而权威的宣告；与λέγω ὑμῖν合译为现代汉语常用而庄重的“我实在告诉你们”，既保留语气，也避免生硬音译。
- source_word: δὲ
  choice: 不另行明译
  rationale: δὲ在此是轻微的语篇连接词；上下文和汉语句流已足以体现其承接作用，强译为“但是”或“而”反会加重转折。
- source_word: ὅπου ἐὰν
  choice: 无论在……什么地方
  rationale: 该组合表达不定而普遍的地点范围；“无论在……什么地方”自然地保留“任何发生宣讲之处”的含义。
- source_word: κηρυχθῇ
  choice: 被宣讲
  rationale: κηρύσσω指公开宣告、传扬；“宣讲”保留其公开传播的意味，又不把动作局限于正式讲道。
- source_word: τὸ εὐαγγέλιον
  choice: 这好消息
  rationale: εὐαγγέλιον的基本意义是“好消息”；“这”体现希腊文定冠词在语境中所指的特定信息，并以脚注保留传统基督教术语“福音”。
- source_word: εἰς ὅλον τὸν κόσμον
  choice: 在全世界
  rationale: 此处表达广泛、普世的地域范围；“在全世界”符合现代汉语习惯，同时保留整体范围。
- source_word: καὶ
  choice: 也
  rationale: καί在此具有附加作用：伴随好消息的宣讲，这女人的行为“也”将被述说。
- source_word: ὃ ἐποίησεν αὕτη
  choice: 这女人所做的
  rationale: αὕτη是阴性单数指示代词，指向当前叙事中的女人；明确译出“这女人”可使现代汉语指代清楚，而不增加语境之外的信息。
- source_word: λαληθήσεται
  choice: 会被人述说
  rationale: 未来被动式表示这件事将在人们的讲述中流传；汉语被动句中补出泛指施事“人”，表达自然且不限定具体讲述者。
- source_word: εἰς μνημόσυνον αὐτῆς
  choice: 来记念她
  rationale: 该短语表示使她被记住或作为对她的纪念；“来记念她”是自然、庄重的现代汉语，并以脚注保留较贴近名词结构的译法。
theological_decisions:
- issue: 如何翻译世界各处将被宣讲的εὐαγγέλιον
  choice: 好消息
  alternative: 福音
  rationale: “好消息”直接呈现该词的普通词义，便于现代读者理解；“福音”是已确立的基督教术语，列入脚注以保留其传统和神学语域，不在正文中额外限定其内容。
- issue: 是否明确αὕτη所指的人物
  choice: 这女人
  alternative: 她；这个人
  rationale: 希腊文形式明确为阴性单数，且紧接上文所述女人；译出“这女人”使指代清楚，并未加入超出原文语境的身份判断。
- issue: 如何表达εἰς μνημόσυνον αὐτῆς的纪念含义
  choice: 来记念她
  alternative: 作为对她的纪念
  rationale: 正文采用自然的目的表达，同时不判定纪念的具体礼仪形式或制度意义；脚注保存更贴近希腊文名词结构的可能译法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“实在告诉你们”保留耶稣宣告的郑重感；“被宣讲”“被人述说”体现原文两个被动式。脚注标记均置于对应词语之后，避免英文咨询层中标记位置可能造成的错配。
