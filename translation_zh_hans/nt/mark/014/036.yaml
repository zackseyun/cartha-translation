  text: καὶ ἔλεγεν· Αββα ὁ πατήρ, πάντα δυνατά σοι· παρένεγκε τὸ ποτήριον ⸂τοῦτο ἀπ’ ἐμοῦ⸃· ἀλλ’ οὐ τί ἐγὼ θέλω ἀλλὰ τί σύ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/036.yaml
  text: And he was saying[a], “Abba, Father, all things are possible for you. Take this cup away from me. Yet not what I will[c][b], but what you will.”
translation:
  language: zh_hans
  text: 他一再说[a]：“阿爸[b]，父啊，对你来说，凡事都可能。求你使这杯[c]离开我。然而，不是我所愿的，而是你所愿的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他说。”希腊语未完成时在这里可能表示持续或反复地说。
    reason: lexical_alternative
  - marker: b
    text: “阿爸”是亚兰语中对父亲的称呼；原文在这里将它与希腊语“父”并列保留下来。
    reason: cultural_note
  - marker: c
    text: “杯”是圣经中用来表示临到一个人身上之苦难的比喻；参《马可福音》10:38。
    reason: cross_reference
lexical_decisions:
- source_word: ἔλεγεν
  choice: 他一直说
  rationale: 未完成时可表达持续或反复进行的言说；“一直说”在现代汉语中自然地保留这一体貌，同时脚注说明也可译作简单过去时。
- source_word: Αββα ὁ πατήρ
  choice: 阿爸，父啊
  rationale: 音译亚兰语称呼“Αββα”，并把随后带定冠词的希腊语“父”按呼语译出；不添加原文没有明说的“我的”。
- source_word: πάντα δυνατά σοι
  choice: 对你来说，凡事都可能
  rationale: 保留πάντα的全面范围及δυνατά的“可能”含义，也以“对你来说”表达与格σοι，避免仅译成抽象的能力陈述。
- source_word: παρένεγκε
  choice: 求你把……拿走
  rationale: παραφέρω的简单过去时命令式在此是祈求把杯移开；汉语祷告语境中加“求你”自然表达请求语气，并未改变命令式的内容。
- source_word: τὸ ποτήριον τοῦτο
  choice: 这杯
  rationale: 保留“杯”的圣经隐喻，不直接改译为“苦难”或“命运”，使其上下文和互文意义保持开放。
- source_word: ἀπ’ ἐμοῦ
  choice: 从我这里
  rationale: 与“拿走”搭配，清楚表达使这杯离开说话者。
- source_word: ἀλλ’ οὐ τί ἐγὼ θέλω ἀλλὰ τί σύ
  choice: 然而，不要照我所愿的，而要照你所愿的
  rationale: 原文后半句省略了可由上下文补足的动词；汉语以对称结构自然补出，同时保留“我的意愿”与“你的意愿”之间的张力。
theological_decisions:
- issue: 耶稣用亚兰语和希腊语双重称呼上帝
  choice: 阿爸，父啊
  alternative: 阿爸，我父啊
  rationale: 原文同时保留亚兰语称呼及其希腊语对应表达。译文保留两者，但不加入本节未明确出现的物主成分“我的”。
- issue: “杯”的隐喻意义
  choice: 这杯
  alternative: 这苦难
  rationale: “杯”在此指向耶稣将要承受的苦难，但原文有意使用隐喻。保留意象可维持其神学张力及与《马可福音》10:38等经文的联系。
- issue: 耶稣的意愿与父的意愿之间的表达
  choice: 不要照我所愿的，而要照你所愿的
  alternative: 不是我想要的，而是你想要的
  rationale: 选用“所愿的”体现θέλω在祷告中的意愿色彩，不把真实的意愿张力弱化为日常偏好，也不进一步解释二者的关系。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。“父啊”明确呼语；“对你来说，凡事都可能”既自然又贴近希腊语结构。所有解释性信息置于脚注，不在正文中消解“杯”及双方意愿的张力。
