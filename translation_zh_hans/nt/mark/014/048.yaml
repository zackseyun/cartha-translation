  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτοῖς· Ὡς ἐπὶ λῃστὴν ἐξήλθατε μετὰ μαχαιρῶν καὶ ξύλων συλλαβεῖν με;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/048.yaml
  text: And Jesus answered and said to them[a], “Have you come out as against a robber, with swords and clubs, to arrest me?”
translation:
  language: zh_hans
  text: 耶稣回应他们说：“你们带着刀剑和棍棒出来抓我，把我当作强盗[a]吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “强盗”也可译作“匪徒”或“叛乱者”；希腊语λῃστής可指暴力劫掠的匪徒或起事者，并非只指一般的贼。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν
  choice: 回应他们说
  rationale: 这是引出话语的常见叙事表达；译为“回应他们说”既保留回应意味，也符合现代汉语表达，避免生硬重复“回答说”。
- source_word: Ὡς ἐπὶ λῃστὴν
  choice: 把我当作强盗
  rationale: ὡς ἐπί表达把耶稣当作某类危险人物来对付；“把我当作”在现代汉语中自然地传达这一比较和针对意味。
- source_word: λῃστὴν
  choice: 强盗
  rationale: “强盗”比“贼”更能表达λῃστής所含的暴力劫掠意味，同时保留其也可指武装匪徒或叛乱者的语义空间；更广含义收入脚注。
- source_word: ἐξήλθατε
  choice: 出来
  rationale: 在这一逮捕场景中，指众人出动前来；“出来”简洁保留了原文动作，不额外补入“成群”等解释。
- source_word: μετὰ μαχαιρῶν καὶ ξύλων
  choice: 带着刀剑和棍棒
  rationale: μάχαιρα可指剑或大刀，概括译为“刀剑”；ξύλα在此指用作武器的木棍，译为“棍棒”清楚自然。
- source_word: συλλαβεῖν
  choice: 抓
  rationale: 此处指拘捕耶稣；“抓”准确、自然，并与武装前来抓捕的现场话语相称。
theological_decisions:
- issue: λῃστής在耶稣反问中的含义
  choice: 正文译“强盗”，脚注说明也可指武装匪徒或叛乱者
  alternative: 匪徒；亡命之徒；叛乱者
  rationale: 原词不只指一般偷窃者，也可能指暴力劫掠者或反叛者。正文采用普通读者易懂且含暴力色彩的“强盗”，脚注保留其历史语义的宽度，不把经文限定为单一政治解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。反问句调整为“把我当作……吗”的汉语语序，以清楚传达原文责问语气；不增添原文未明说的政治或法律判断。
