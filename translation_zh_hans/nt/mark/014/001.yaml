  text: Ἦν δὲ τὸ πάσχα καὶ τὰ ἄζυμα μετὰ δύο ἡμέρας. καὶ ἐζήτουν οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς πῶς αὐτὸν ἐν δόλῳ κρατήσαντες ἀποκτείνωσιν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/001.yaml
  text: The Passover and Unleavened Bread were two days away[a]. And the chief priests and the scribes were seeking how, by deceit, they might arrest him and kill him[c][b],
translation:
  language: zh_hans
  text: 逾越节和除酵节[b]还有两天就到了[a]。祭司长和经学家正在谋划怎样用诡计捉拿他[c]，好杀害他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“两天以后。”这里是说逾越节和除酵节即将来到。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“无酵之物”，在这里是指除酵节。
    reason: cultural_note
  - marker: c
    text: “捉拿”也可译作“抓住”或“逮捕”；“用诡计捉拿”也可译作“设诡计捉拿”。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἦν δὲ
  choice: ……还有两天就到了
  rationale: δέ在这里起轻微的叙事承接作用，中文不必机械译出“而”或“现在”；结合整句自然表达节期临近。
- source_word: τὸ πάσχα
  choice: 逾越节
  rationale: 在此指犹太节期，而非特指逾越节羊羔；采用现代中文通行名称。
- source_word: τὰ ἄζυμα
  choice: 除酵节
  rationale: 原文直译为“无酵之物”，在节期语境中是除酵节的惯用称呼；正文明确译出节名，并以脚注保留字面形式。
- source_word: μετὰ δύο ἡμέρας
  choice: 还有两天就到了
  rationale: 字面为“两天以后”；此处强调逾越节和除酵节即将来到，这一译法符合现代汉语时间表达。
- source_word: ἐζήτουν
  choice: 正在设法
  rationale: 未完成时表示持续筹谋；“正在设法”既保留进行意味，也自然引出后面的方式从句。
- source_word: οἱ ἀρχιερεῖς
  choice: 祭司长
  rationale: 指处于领导地位的祭司群体，是新约中文的准确通行译法。
- source_word: οἱ γραμματεῖς
  choice: 经学家
  rationale: 指研习、解释宗教律法的专业群体；“经学家”较“文士”更便于普通现代读者理解，又不过度释义为“律法教师”。
- source_word: πῶς
  choice: 设法
  rationale: 与ἐζήτουν合译为“正在设法”，自然表达他们在筹划以何种方式行动。
- source_word: ἐν δόλῳ
  choice: 用诡计
  rationale: δόλος含欺骗、诡诈之意；“用诡计”保留其道德意味，不把它窄化为仅仅秘密行事。
- source_word: κρατήσαντες
  choice: 抓住
  rationale: 该分词表示抓住、拘捕；“抓住”保留原词较宽的动作含义，脚注提示在此也可理解为“逮捕”。
- source_word: ἀποκτείνωσιν
  choice: 把他杀死
  rationale: 直接表达杀害之意，不额外赋予司法处决色彩。
theological_decisions:
- issue: 逾越节与除酵节的关系
  choice: 分别译作“逾越节和除酵节”
  alternative: 将两者合并为一个节期名称
  rationale: 原文明确并列两个称呼；译文保持二者的区分，同时不否认它们在犹太节期实践中紧密相连。
- issue: 领袖们计划的道德性质
  choice: 将ἐν δόλῳ译为“用诡计”
  alternative: “暗中”或“偷偷地”
  rationale: 原文不仅涉及隐秘行动，也明确含有欺骗、诡诈的意味；译文不应削弱这一伦理色彩。
- issue: κρατήσαντες的具体性质
  choice: 正文译“抓住”，脚注说明也可译“逮捕”或“暗中捉拿”
  alternative: 正文直接译为“逮捕”
  rationale: 原词可指抓住或拘捕；上下文支持官方拘捕，但正文保留较宽词义，以免把参与者的法律权限解释得过满。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“还有两天就到了”清楚表达节期临近；“祭司长”和“经学家”兼顾历史语境与当代可懂度。所有脚注标记均置于正文对应位置。
