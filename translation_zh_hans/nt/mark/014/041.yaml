  text: καὶ ἔρχεται τὸ τρίτον καὶ λέγει αὐτοῖς· Καθεύδετε ⸀τὸ λοιπὸν καὶ ἀναπαύεσθε· ἀπέχει· ἦλθεν ἡ ὥρα, ἰδοὺ παραδίδοται ὁ υἱὸς τοῦ ἀνθρώπου εἰς τὰς χεῖρας τῶν ἁμαρτωλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/041.yaml
  text: And he comes the third time and says to them[a], “Are you still sleeping and resting? It is enough; the hour has come. Look[c][b], the Son of Man is being handed over into the hands of sinners.”
translation:
  language: zh_hans
  text: 他第三次回来，对他们说：“你们还在睡觉、歇息吗？[a]够了！[b]时候到了。看哪，人子正被交到罪人手中。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这句话也可译作带讽刺或许可意味的陈述：“你们继续睡觉、歇息吧。”其中译作“还”的希腊语短语，较直译为“余下的时候”或“从此以后”，在这里意思不易确定。
    reason: alternative_reading
  - marker: b
    text: “够了”所译的希腊语表达含义较难确定；也可译作“这就够了”。有人提出商业用语的意思，如“已经收足了”，但在这里可能性较小。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται τὸ τρίτον
  choice: 第三次回来
  rationale: 叙事现在时在现代汉语中自然地按上下文译为过去时；结合耶稣先前离开门徒祷告的场景，“回来”比单纯“来”更清楚。
- source_word: Καθεύδετε τὸ λοιπὸν καὶ ἀναπαύεσθε
  choice: 你们还在睡觉、歇息吗？
  rationale: 希腊语形式可理解为带讽刺意味的陈述或许可，也可理解为责问。正文采用符合紧迫语境的反问，同时用脚注保留另一种读法。
- source_word: ἀπέχει
  choice: 够了！
  rationale: 这是语义困难的表达；“够了”简洁地标明话语转折，又不引入证据不足的商业含义。
- source_word: ἦλθεν ἡ ὥρα
  choice: 时候到了
  rationale: “时候”在现代汉语中自然、庄重，也保留所指定时刻已经来到的含义。
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留引人注意和指示眼前事态的力量；“看哪”虽较书面，但仍是普通读者熟悉的经文语体。
- source_word: παραδίδοται
  choice: 正被交
  rationale: 保留“交出、交在权下”的宽泛意义，不把动词过早收窄为“被出卖”，并以“正”表现现在时被动态的临近过程。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人子
  rationale: 采用现代中文圣经传统中稳定而可识别的称谓，保留其自称和称号性质。
- source_word: εἰς τὰς χεῖρας τῶν ἁμαρτωλῶν
  choice: 在罪人手里
  rationale: 保留“落入某人手中、受其权势支配”的具体意象；“罪人”准确对应名词化形容词且不额外标明性别。
theological_decisions:
- issue: Καθεύδετε ... καὶ ἀναπαύεσθε 的语气
  choice: 正文译作责问：“你们还在睡觉、歇息吗？”
  alternative: 带讽刺或许可意味的陈述：“你们继续睡觉、歇息吧。”
  rationale: 早期希腊文标点不能决定语气，两种理解在语法和语境上都可成立。正文选择较符合随即危机来到的责问，但以脚注明确保留陈述式读法。
- issue: ἀπέχει 的意义
  choice: 够了！
  alternative: “这就够了”或商业用语意义如“已经收足了”
  rationale: 该词在此处含义确有争议。“够了”适合从门徒睡眠转向受难时刻的叙事转折，同时避免引入推测性的技术含义。
- issue: παραδίδοται 的译法
  choice: 正被交
  alternative: “被出卖”或“被交付”
  rationale: “交”保留 παραδίδωμι 在受难叙事中的宽广范围，不把行动者和意义只限定为犹大的背叛。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。叙事动词按中文习惯处理；“看哪”“人子”保留经文语体及称谓辨识度。脚注只用于真实存在的句法和词义歧义。
