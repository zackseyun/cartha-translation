  text: ὁ δὲ ⸂ἐκπερισσῶς ἐλάλει⸃· Ἐὰν ⸂δέῃ με⸃ συναποθανεῖν σοι, οὐ μή σε ⸀ἀπαρνήσομαι. ὡσαύτως δὲ καὶ πάντες ἔλεγον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/031.yaml
  text: But he kept insisting all the more[a], “If I must die together with you[c][b], I will certainly not deny you.” And they all were saying the same thing.
translation:
  language: zh_hans
  text: 彼得却越发坚持地说[a]：“如果我必须和你一同死[b]，我也绝不会否认你[c]。”众人也都这样说。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他越发强调地说。”
    reason: lexical_alternative
  - marker: b
    text: 原文直译：“与你一同死。”
    reason: lexical_alternative
  - marker: c
    text: 或译：“我永远不会否认你。”原文使用强烈的否定形式。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκπερισσῶς ἐλάλει
  choice: 越发坚决地说
  rationale: ἐκπερισσῶς加强语气，ἐλάλει为未完成时；结合上文，表达彼得持续且更强烈地坚持自己的话。中文用“越发坚决地说”自然呈现递进和强调。
- source_word: Ἐὰν δέῃ με
  choice: 即使我必须
  rationale: δέῃ表示必要性；条件句在此带有让步意味，“即使……必须”既保留条件形式，也符合现代汉语表达。
- source_word: συναποθανεῖν σοι
  choice: 和你一同死
  rationale: 复合动词 συναποθνῄσκω 明示“共同死去”，故用“一同死”保留 σύν 的共同含义。
- source_word: οὐ μή
  choice: 绝不会
  rationale: οὐ μή与将来时构成强烈否定；“绝不会”准确传达彼得斩钉截铁的保证。
- source_word: ἀπαρνήσομαι
  choice: 不认你
  rationale: 在本叙事语境中指否认与耶稣的关系。现代汉语“不认你”清楚自然，并与随后彼得不认耶稣的情节相衔接。
- source_word: ὡσαύτως δὲ καὶ πάντες ἔλεγον
  choice: 众人也都这样说
  rationale: ὡσαύτως指众人所说内容与彼得相同；ἔλεγον为未完成时，但汉语无需机械标出持续体，“也都这样说”简洁自然。
theological_decisions:
- issue: 彼得誓言中的强烈否定
  choice: “也绝不会不认你”
  alternative: “我永远不会不认你”或“我决不会否认你”
  rationale: 保留 οὐ μή 的强烈语气，也保留彼得自信誓言与后来失败之间的叙事张力，不在译文中添加解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“越发坚决地说”呈现彼得言辞升级的语势；“不认你”贴合口语叙事场景，又不过度引入“弃绝”等更强的神学含义。所有脚注标记均置于相关主文本之后。
