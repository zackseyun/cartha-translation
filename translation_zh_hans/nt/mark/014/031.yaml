review_pass:
  verdict: revise
  source_fidelity: 译文基本准确传达了彼得更加强烈、持续地表态，及其“若必须与耶稣同死，也绝不否认”的誓言；但“即使”把希腊语的条件式Ἐὰν（“若／如果”）较明确地改成让步式，宜改为“如果”。“越发坚决地说”可表达加强，但未充分体现ἐλάλει的持续、反复说话；“越发坚持地说”较贴切。
  naturalness: 整体为自然、庄重的现代汉语。“众人也都这样说”清楚自然。“不认你”在叙事中可懂，但“否认你”更准确对应ἀπαρνέομαι，并与本段预言彼得否认耶稣的用语保持清晰关联。
  terminology: “一同死”恰当保留συναποθανεῖν的共同含义。“绝不会”充分表达οὐ μή的强烈否定。建议采用“否认你”而非较口语且略宽泛的“不认你”。脚注a的“极其激烈地说”不够准确：ἐκπερισσῶς强调格外、越发、极其，并不必然指“激烈”。
  issues:
  - severity: medium
    issue: “即使我必须”将条件句改为让步句。
    rationale: Ἐὰν δέῃ με直陈“如果我必须／若我不得不”，虽语境可带誓言式的让步色彩，但译文不宜将其固定为“即使”。
  - severity: low
    issue: “越发坚决地说”未明显呈现未完成时的持续或反复。
    rationale: ἐλάλει表示他不断地说；“越发坚持地说”既自然，也更好体现其一再强调。
  - severity: low
    issue: 脚注a的“极其激烈地说”带入原文未明示的“激烈”语义。
    rationale: ἐκπερισσῶς的重点是格外、尤其、越发地，不必表示情绪激烈。
  - severity: low
    issue: “不认你”略显宽泛。
    rationale: ἀπαρνήσομαι在此指否认与耶稣的关系；“否认你”更精确且符合本叙事常用表达。
