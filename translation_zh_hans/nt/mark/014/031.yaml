  to: 彼得却越发坚持地说[a]：“如果我必须和你一同死[b]，我也绝不会否认你[c]。”众人也都这样说。
  rationale: 修订保留原文的条件关系、共同死亡的含义和强烈否定，同时以“越发坚持地说”较完整地呈现副词的加强与未完成时的反复语势。脚注a改除“激烈”这一原文未必含有的情绪色彩；脚注c同步采用“否认你”。
