  text: καὶ ⸂προελθὼν μικρὸν ἔπιπτεν⸃ ἐπὶ τῆς γῆς, καὶ προσηύχετο ἵνα εἰ δυνατόν ἐστιν παρέλθῃ ἀπ’ αὐτοῦ ἡ ὥρα,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/035.yaml
  text: And going a little farther[a], he fell to the ground and was praying that, if it were possible, the hour might pass from him.
translation:
  language: zh_hans
  text: 他往前走了一小段[a]，就俯伏在地，祷告，求若有可能，那时刻可以离开他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“稍微往前去了一点。”
    reason: lexical_alternative
lexical_decisions:
- source_word: προελθὼν μικρὸν
  choice: 往前走了一小段
  rationale: προέρχομαι结合μικρόν表示从同行者那里再向前走一小段距离；此译自然保留了方向和短距离之意。
- source_word: ἔπιπτεν ἐπὶ τῆς γῆς
  choice: 就俯伏在地
  rationale: 未完成时在叙事中可描写动作的发生或姿态；结合祷告场景，“俯伏在地”比生硬的“倒在地上”更自然，同时不额外规定具体跪拜姿势。
- source_word: προσηύχετο
  choice: 祷告说
  rationale: 未完成时呈现持续进行的祷告；汉语以“祷告说”自然引出其祷告内容，过程性由上下文保留。
- source_word: ἵνα
  choice: 愿
  rationale: 此处引出祷告的内容；“愿”符合现代汉语祷告语体，也保留所求之事而不强行限定为单纯目的关系。
- source_word: εἰ δυνατόν ἐστιν
  choice: 倘若可能
  rationale: 忠实保留条件与可能性；“倘若”庄重而现代，适合这一严肃语境。
- source_word: παρέλθῃ ἀπ’ αὐτοῦ ἡ ὥρα
  choice: 那时刻离开他
  rationale: παρέρχομαι在此有“经过、过去”之意，ἀπ’ αὐτοῦ表示从他那里离去；“那时刻”保留ὥρα的象征张力，不解释成受苦或死亡。
theological_decisions:
- issue: “ἡ ὥρα”（那时刻）的含义
  choice: 保留为“那时刻”
  alternative: 受苦的时刻／死亡临到的时候
  rationale: 原文用具有神学分量但未在本句展开解释的“时刻”；直译可保留耶稣即将受苦与受死的语境及其张力，避免将含义提前限定。
- issue: 耶稣祷告中的条件性
  choice: 译作“倘若可能，愿……”
  alternative: 如果可以，就让……
  rationale: 保留εἰ δυνατόν ἐστιν的真实条件表达，不借译文推断这种“可能”在神学上的具体性质。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“俯伏在地”贴合祷告场景；“那时刻”保留原文定冠词所指向的特定时刻及其神学含义。脚注给出προελθὼν μικρόν较贴近结构的另一译法。
