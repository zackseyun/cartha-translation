base_translation:
  language: en
  yaml_path: translation/nt/mark/014/026.yaml
  text: And after singing a hymn[a], they went out to the Mount of Olives.
translation:
  language: zh_hans
  text: 他们唱完赞美诗[a]，就出去，往橄榄山去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较形式地译作“唱了赞美诗以后”。希腊语分词表明，唱赞美诗发生在他们出去之前。
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: 就
  rationale: 承接前文并推进叙事；现代汉语用“就”自然表达动作相继发生，不额外加入转折或因果含义。
- source_word: ὑμνήσαντες
  choice: 唱完赞美诗
  rationale: ὑμνέω指唱颂赞之歌；不定过去时分词表示此动作先于主要动词发生。“唱完”既自然，也保留先后关系。
- source_word: ἐξῆλθον
  choice: 出去
  rationale: 直接体现ἐξέρχομαι的基本叙事含义，措辞朴素自然。
- source_word: εἰς
  choice: 往……去
  rationale: 此处表示目的地；以“往……去了”符合现代汉语地名移动表达。
- source_word: τὸ Ὄρος τῶν Ἐλαιῶν
  choice: 橄榄山
  rationale: 这是该地点通行、准确的中文名称；既保留地理专名，也避免机械译作“橄榄树之山”。
theological_decisions: []
