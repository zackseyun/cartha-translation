  source_fidelity: “带着彼得、雅各和约翰同去”准确传达 παραλαμβάνει…μετ’ αὐτοῦ，且以自然汉语处理历史现在时。“开始”保留 ἤρξατο 的起始意义。不过“惊恐不已”较明确地指向恐惧；ἐκθαμβεῖσθαι 在此处可指强烈震骇、惊愕或不安，未必限定为恐惧。
  naturalness: 原句整体通顺，但“就开始惊恐不已，万分苦恼”中“开始”对后一个并列状态的管辖略不够清晰；“极其惊骇和苦恼”更紧凑自然，也保留两项并列描述。
  terminology: 人名译法“彼得、雅各、约翰”符合通行圣经汉语用法。将 ἐκθαμβεῖσθαι 译为“极其惊骇”比“惊恐不已”更能保留原词的语义开放性；ἀδημονεῖν 译为“苦恼”可接受。
  issues:
