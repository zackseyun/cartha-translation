- from: 他带着彼得、雅各和约翰同去，就开始惊恐不已[a]，万分苦恼。
  to: 他带着彼得、雅各和约翰同去，就开始极其惊骇和苦恼[a]。
  rationale: 修订避免把具有语义弹性的 ἐκθαμβεῖσθαι 固定解释为“恐惧”，同时保留其强度；并以“开始极其惊骇和苦恼”清楚呈现 ἤρξατο 对两个并列不定式的起始作用。人名、同行关系和庄重现代叙事语体均予保留。
