  text: καὶ παραλαμβάνει τὸν Πέτρον καὶ ⸂Ἰάκωβον καὶ⸃ Ἰωάννην μετ’ ⸀αὐτοῦ, καὶ ἤρξατο ἐκθαμβεῖσθαι καὶ ἀδημονεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/033.yaml
  text: And he takes Peter and James and John with him[a], and he began to be greatly distressed and troubled,
translation:
  language: zh_hans
  text: 他带着彼得、雅各和约翰同去，就开始极其惊骇和苦恼[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “极其惊骇”或译“极其不安”“深感震骇”。原词在这里可表达强烈的惊骇、震动或痛苦。
    reason: lexical_alternative
lexical_decisions:
- source_word: παραλαμβάνει
  choice: 带着……同去
  rationale: 表达把特定同伴带在身边同行的意思；汉语不以动词时态标明历史现在时，无须另加时间标记。
- source_word: μετ’ αὐτοῦ
  choice: 同去
  rationale: 自然表达彼得、雅各和约翰与他同行，同时避免生硬重复“和他一起”。
- source_word: ἤρξατο
  choice: 开始
  rationale: 保留原文起始体意义，明确指出这种强烈情绪在此刻开始显现。
- source_word: ἐκθαμβεῖσθαι
  choice: 惊恐不已
  rationale: 该词在此语境中表达强烈的震骇、惊恐或痛苦，不只是普通的惊讶；“惊恐不已”既有足够力度，又不加入原文未明说的原因。
- source_word: ἀδημονεῖν
  choice: 万分苦恼
  rationale: 表达极深的内在痛苦和煎熬，并与前一个动词区分，保留原文双重描述。
- source_word: καὶ ... καὶ
  choice: ……、……和……；……，……
  rationale: 人名列举依照自然汉语采用顿号与“和”；后半句保留两个并列的情绪描述，不将其合并为一个概念。
theological_decisions:
- issue: 客西马尼园中耶稣的情绪状态
  choice: 以“惊恐不已，万分苦恼”直接呈现真实而强烈的情绪痛苦
  alternative: 采用较弱的“十分惊讶、忧愁”，或更具解释性的“因恐惧而陷入绝望”
  rationale: 原文明确描述强烈的情绪震动与内在痛苦。译文既不淡化耶稣真实的人性经历，也不推断其情绪的具体成因或加入原文没有的神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“带着……同去”自然承载陪同关系；“惊恐不已，万分苦恼”保留两个希腊动词的区别与递进力度。
