    issue: “惊恐不已”将 ἐκθαμβεῖσθαι 窄化为恐惧。
    rationale: 该词可表达强烈的惊骇、震动或不安；本节语境支持强烈痛苦，却不明说其情绪对象或成因。采用“极其惊骇”可避免加入“恐惧”这一较具体的解释。
  - severity: low
    issue: “开始”与两个并列不定式的关系可更明确。
    rationale: 希腊文的 ἤρξατο 同时支配“惊骇”和“苦恼”。改为“开始极其惊骇和苦恼”可清楚反映这一结构。
