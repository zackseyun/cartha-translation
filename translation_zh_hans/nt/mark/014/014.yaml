  text: καὶ ὅπου ⸀ἐὰν εἰσέλθῃ εἴπατε τῷ οἰκοδεσπότῃ ὅτι Ὁ διδάσκαλος λέγει· Ποῦ ἐστιν τὸ κατάλυμά ⸀μου ὅπου τὸ πάσχα μετὰ τῶν μαθητῶν μου φάγω;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/014.yaml
  text: And wherever he enters[a], say to the master of the house, ‘The Teacher says, “Where is my guest room where I may eat the Passover with my disciples?”’
translation:
  language: zh_hans
  text: 他无论进哪一家，你们就对那家的主人说：“老师说：‘我和我的门徒可以吃逾越节筵席的客房[a]在哪里？’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “客房”也可译作“住宿的地方”或“房间”；希腊词指可供住宿之处，此处很可能是私人住宅中的客房，而不是商业客店。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου ἐὰν εἰσέλθῃ
  choice: 他无论进哪一家
  rationale: ὅπου与ἐάν及虚拟语气构成不定关系表达，意为“无论哪里”。结合前文所跟随之人及随后“那家的主人”，汉语补出“哪一家”能自然交代进入房屋的场景。
- source_word: εἴπατε
  choice: 你们都要……说
  rationale: 不定过去时命令语气复数，是对两名门徒的直接吩咐；“要……说”保留命令语气和直接引语结构。
- source_word: οἰκοδεσπότῃ
  choice: 那家的主人
  rationale: 指掌管该房屋或家庭的人。“那家的主人”符合现代汉语叙事习惯，同时保留其在家中的权责含义。
- source_word: Ὁ διδάσκαλος
  choice: 老师
  rationale: 按通常词义译为“老师”，在引语中作为对耶稣的特定称呼；不采用可能额外强化权威或基督论色彩的译法。
- source_word: τὸ κατάλυμά μου
  choice: 我的客房
  rationale: κατάλυμα可指住宿处或房间；此处是在私人住宅中预备逾越节晚餐的地方，语境最适合“客房”。μου明确译作“我的”，保留原文的所属表达。
- source_word: τὸ πάσχα
  choice: 逾越节晚餐
  rationale: πάσχα可指逾越节、逾越节羔羊或节期筵席；与“吃”连用时，现代汉语译作“逾越节晚餐”可清楚表达这里所指的筵席，而不致误解为吃一个节日。
- source_word: μετὰ τῶν μαθητῶν μου
  choice: 和我的门徒
  rationale: 保留μετά的共同参与含义、μου的所属关系，以及μαθηταί在福音书中的惯常称谓“门徒”。
- source_word: φάγω
  choice: 吃
  rationale: 不定过去时虚拟语气处于修饰κατάλυμα的关系从句中，表示所寻房间的用途。汉语以“我和我的门徒吃……的客房”自然表达这一目的或预期行动，无须另加情态词。
theological_decisions:
- issue: 耶稣的自称Ὁ διδάσκαλος如何翻译
  choice: 老师
  alternative: 夫子；主人
  rationale: διδάσκαλος的基本意义是“老师、教师”。此处是听者能够识别的称呼，但原文本身没有使用更强的权威性或基督论头衔，因此不译作“主人”，也不以较古雅的“夫子”为正文。
translation_notes:
  register: 采用现代、自然而庄重的叙事语言。“他无论进哪一家”衔接上下文中的带路人；“那家的主人”比“家主”更易为普通读者理解。将关系从句整合为“我和我的门徒吃逾越节晚餐的客房”，使汉语流畅，同时保留该从句限定所寻房间的功能。脚注标记[a]置于整节末，正文与脚注相互对应。
