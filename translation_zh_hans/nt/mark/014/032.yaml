  text: Καὶ ἔρχονται εἰς χωρίον οὗ τὸ ὄνομα Γεθσημανί, καὶ λέγει τοῖς μαθηταῖς αὐτοῦ· Καθίσατε ὧδε ἕως προσεύξωμαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/032.yaml
  text: And they came to a place whose name was Gethsemane[a], and he says to his disciples, “Sit here until I pray.”
translation:
  language: zh_hans
  text: 他们来到一个地方，名叫客西马尼。耶稣对门徒说：“你们坐在这里，等我祷告。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρχονται
  choice: 来到
  rationale: 希腊文用叙事性现在时增强现场感；现代汉语动词本身不标明时态，“来到”在叙事中自然表达事件推进，无须机械添加时态标记。
- source_word: χωρίον
  choice: 一个地方
  rationale: χωρίον可指地方、地块或产业；上下文没有要求更具体地译作“庄园”或“农庄”，因此采用宽泛而自然的“一个地方”。
- source_word: οὗ τὸ ὄνομα Γεθσημανί
  choice: 名叫客西马尼
  rationale: 以现代汉语自然表达“其名为”的希腊文结构；Γεθσημανί按通行中文专名音译为“客西马尼”。
- source_word: λέγει
  choice: 说
  rationale: 此处同样是叙事性现在时。汉语“说”不受形态时态限制，既自然承接叙事，也不必把希腊文的生动表达硬性处理成过去时。为避免代词所指在独立经节中不清楚，主语明示为“耶稣”。
- source_word: μαθηταῖς
  choice: 门徒
  rationale: “门徒”是福音书语境中准确且通行的译法，保留师徒关系的含义。
- source_word: Καθίσατε
  choice: 你们坐
  rationale: 直接表达复数命令；补出“你们”符合现代汉语对话习惯，也明确命令对象。
- source_word: ὧδε
  choice: 在这里
  rationale: 直接、自然地对应指示地点副词ὧδε。
- source_word: ἕως προσεύξωμαι
  choice: 等我祷告
  rationale: 保留ἕως所表达的时间界限，同时避免增译为“等我祷告完”而过度强调完成，也不译作“在我祷告的时候”而把界限改成单纯的持续时间。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语自然的叙事表达。两处希腊文叙事性现在时在汉语中无需另加时态词即可自然呈现；句中明示“耶稣”，使单节独立阅读时指代清楚。
