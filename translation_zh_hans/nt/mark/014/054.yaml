  text: καὶ ὁ Πέτρος ἀπὸ μακρόθεν ἠκολούθησεν αὐτῷ ἕως ἔσω εἰς τὴν αὐλὴν τοῦ ἀρχιερέως καὶ ἦν συγκαθήμενος μετὰ τῶν ὑπηρετῶν καὶ θερμαινόμενος πρὸς τὸ φῶς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/054.yaml
  text: And Peter followed him from a distance[a], as far as inside the courtyard of the high priest. He was sitting with the officers and warming himself by the fire.
translation:
  language: zh_hans
  text: 彼得远远地跟着他，一直进到大祭司的院子里。他和差役们坐在一起，对着火光[a]取暖。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“对着光取暖。”希腊文直译为“对着光”；这里很可能指院中火堆发出的光。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ μακρόθεν
  choice: 远远地
  rationale: 自然表达彼得与耶稣保持距离跟随的空间和叙事意味。
- source_word: ἠκολούθησεν αὐτῷ
  choice: 跟着他
  rationale: 以简明的叙事过去动作表达不定过去时；代词所指依上下文保留为“他”。
- source_word: ἕως ἔσω εἰς
  choice: 一直进到……里
  rationale: 体现彼得跟随所达到的范围，并明确他进入了院子内部，而非进入屋内。
- source_word: τὴν αὐλὴν τοῦ ἀρχιερέως
  choice: 大祭司的院子
  rationale: 此处αὐλή指大祭司住所内围合的院落；“院子”现代、清楚，不额外引入“宫殿”等含义。
- source_word: ἦν συγκαθήμενος μετὰ τῶν ὑπηρετῶν
  choice: 他和差役们坐在一起
  rationale: “坐在一起”体现σύν的共同意味；“差役”指在拘捕与审讯场景中执行公务的属员，避免误解为普通家仆。
- source_word: θερμαινόμενος πρὸς τὸ φῶς
  choice: 对着火光取暖
  rationale: φῶς本义为“光”，但取暖的语境表明是火所发出的光；“火光”兼顾字面意象与实际场景。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“远远地”“一直进到……里”保持原文的空间推进；分为两句以符合现代汉语节奏，同时不改变事件关系。
