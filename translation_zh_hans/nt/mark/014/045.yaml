  text: καὶ ἐλθὼν ⸀εὐθὺς προσελθὼν αὐτῷ λέγει· ⸀Ῥαββί, καὶ κατεφίλησεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/045.yaml
  text: And when he came[a], he immediately went up to him and said, “Rabbi!” and kissed him repeatedly.
translation:
  language: zh_hans
  text: 他一到，就立刻走到耶稣跟前，说：“拉比！”随后热烈地亲吻了他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“连连亲吻了他”或“亲切地吻了他”；原文动词比一般的“亲吻”语气更强，但可能强调动作反复，也可能强调亲吻的热烈或亲切程度。
    reason: 保留 κατεφίλησεν 在强调方式上的词义歧义。
lexical_decisions:
- source_word: ἐλθὼν
  choice: 他一到
  rationale: 不定过去时分词在这里表示时间先后；“一到”自然地引出犹大随即采取的行动。
- source_word: εὐθὺς
  choice: 立刻
  rationale: 保留马可叙事中常见的迅速、紧迫感。
- source_word: προσελθὼν αὐτῷ
  choice: 走到耶稣跟前
  rationale: 明确表达朝向并接近耶稣的身体动作；以“耶稣”指明代词所指，也使现代汉语行文清楚。
- source_word: λέγει
  choice: 说
  rationale: 希腊文采用历史现在时；现代汉语叙事用“说”即可自然呈现，不必机械标示时态。
- source_word: Ῥαββί
  choice: 拉比
  rationale: 保留原文中的闪语称号及场景的历史文化色彩；其基本含义是“老师”。
- source_word: κατεφίλησεν
  choice: 热烈地亲吻了他
  rationale: 该复合动词比普通的“亲吻”语气更强。“热烈地”体现其强调意味，同时用脚注说明原文也可能侧重反复亲吻，避免把具体方式绝对化。
theological_decisions:
- issue: 犹大对耶稣的称呼 Ῥαββί
  choice: 拉比
  alternative: 老师
  rationale: 音译可保留犹大在现场实际使用的称号及其中的叙事反讽，不额外加入对其动机或信仰状态的解释。
- issue: κατεφίλησεν 所表达的强调方式
  choice: 热烈地亲吻了他
  alternative: 连连亲吻了他；亲吻了他
  rationale: 原文动词具有比普通“亲吻”更强的表达力，但究竟强调热烈程度还是动作反复并不完全确定；正文采用自然且能体现强调的译法，并以脚注保留其他可能。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“一到……立刻……”保持马可叙事的紧凑节奏；“拉比”保留历史语境。脚注标记紧随其所解释的“亲吻”句之后。
