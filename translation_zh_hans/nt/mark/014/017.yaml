  language: zh_hans
  text: 到了晚上，耶稣同那十二人[a]一起来了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“十二门徒”；这个短语可作为耶稣十二位门徒群体的称呼。
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: （不单独译出）
  rationale: 此处καί承接叙事；汉语以时间短语直接起句更自然，也不损失事件推进的关系。
- source_word: ὀψίας γενομένης
  choice: 到了晚上
  rationale: 这是表示时间背景的属格独立结构；“到了晚上”自然、简洁，并保留“夜晚来临时”的时间含义。
- source_word: ἔρχεται
  choice: 来了
  rationale: 原文用历史现在时，使叙述更鲜活。现代汉语叙事通常用“来了”表达事件发生；若硬译成“来”，会显得不够自然。主语由上下文确定为耶稣，因此明示“耶稣”。
- source_word: μετὰ τῶν δώδεκα
  choice: 和那十二个人
  rationale: μετά加属格表示陪同；“那十二个人”简洁地指耶稣所拣选的十二人，而不额外加入“门徒”或“使徒”等解释性称谓。
theological_decisions:
- issue: “那十二个人”的所指
  choice: 保留简洁群体称呼，按叙事指耶稣的十二人团体，此时包括犹大
  alternative: 译作“十二门徒”或“十二使徒”
  rationale: 原文只说“那十二个”，没有明说“门徒”或“使徒”；保留较直译的称呼可避免增添原文没有的身份术语，并保存其作为固定群体称号的可能性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“到了晚上”符合自然汉语；“那十二个人”既清楚又避免过度解释。脚注标记已置于相关短语之后。
