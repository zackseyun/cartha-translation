  text: ὁ δὲ καταλιπὼν τὴν σινδόνα γυμνὸς ⸀ἔφυγεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/052.yaml
  text: But he left the linen cloth behind and fled naked[a][b].
translation:
  language: zh_hans
  text: 他却丢下那块细麻布，赤身逃走了。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “细麻布”也可译作“细麻床单”或“细麻衣”。
    reason: lexical_alternative
  - marker: b
    text: “赤身”在某些语境中也可指衣着不足；但这里紧接着说他丢下了所披的细麻布，直接意思是他没有穿着那件遮身之物便逃走了。
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: 却
  rationale: 在承接上文的同时形成轻微转折：众人抓住他，他却挣脱逃走。
- source_word: καταλιπὼν
  choice: 丢下
  rationale: 表达把身上的布留在对方手中、舍下而逃的动作，符合不定过去时分词所交代的先行动作。
- source_word: σινδόνα
  choice: 细麻布
  rationale: σινδών指一块细麻布，也可作裹身之物；译作“细麻布”既保留材质，又不武断限定其具体样式。
- source_word: γυμνὸς
  choice: 赤身
  rationale: 此处最直接的意思是他丢下所披之物后未着衣而逃；“赤身”自然、庄重，也保留原词在其他语境中可能指衣着不足的范围。
- source_word: ἔφυγεν
  choice: 逃走了
  rationale: 准确传达φεύγω所表示的逃离，并符合现代汉语叙事表达。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“细麻布”保留原文对材质和形制的开放性；“赤身”直译γυμνός，同时以脚注说明其语义范围。
