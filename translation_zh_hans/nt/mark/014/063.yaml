  text: ὁ δὲ ἀρχιερεὺς διαρρήξας τοὺς χιτῶνας αὐτοῦ λέγει· Τί ἔτι χρείαν ἔχομεν μαρτύρων;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/063.yaml
  text: Then the high priest tore his garments and said[b][a], “What further need do we have of witnesses?”
translation:
  language: zh_hans
  text: 大祭司便撕裂自己的衣服[a]，说：“我们还需要见证人做什么呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “衣服”原文为复数，也可译作“长衣”；该词可较具体地指贴身穿的长衣。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχιερεὺς
  choice: 大祭司
  rationale: 指主持审讯的单数宗教职分；“大祭司”是现代汉语中准确且通行的对应表达。
- source_word: διαρρήξας
  choice: 撕裂
  rationale: 表达将衣物扯开的实际动作，力度明确，又不加入悲痛、愤怒等解释。
- source_word: τοὺς χιτῶνας αὐτοῦ
  choice: 自己的衣服
  rationale: χίτων可特指贴身长衣，但此处用复数泛指其衣物；“衣服”自然易懂，并避免把它限定为礼仪袍服。
- source_word: λέγει
  choice: 说
  rationale: 希腊文使用历史现在时；现代汉语动词本身不标示过去或现在，因此“说”既自然，也无须人为增加时态信息。
- source_word: Τί ἔτι χρείαν ἔχομεν μαρτύρων
  choice: 我们还需要见证人做什么呢？
  rationale: 保留ἔτι“还、再”的含义及反问语气，清楚表达说话者认为不再需要见证人。
theological_decisions:
- issue: 大祭司撕裂衣服这一动作的含义
  choice: 只叙述他撕裂衣服，不说明其动机
  alternative: 明确解释为因所听见的话而悲愤，或认定耶稣亵渎而震怒
  rationale: 本节只记载动作和话语，并未直接解释这个动作；译文不加入神学或心理判断，以保留叙事张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“便”承接上下文并体现δὲ的叙事推进；反问句按现代汉语习惯表达，同时保留原文的力度。
