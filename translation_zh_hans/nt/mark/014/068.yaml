  text: ὁ δὲ ἠρνήσατο λέγων· ⸂Οὔτε οἶδα οὔτε ἐπίσταμαι σὺ τί⸃ λέγεις, καὶ ἐξῆλθεν ἔξω εἰς τὸ προαύλιον ⸂καὶ ἀλέκτωρ ἐφώνησεν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/068.yaml
  text: But he denied it[a], saying, “I neither know nor understand what you are saying.” And he went out into the forecourt, and a rooster crowed.
translation:
  language: zh_hans
  text: 他却否认，说：“我不知道，也不明白你在说什么。”他出去，来到前院；鸡叫了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本没有“鸡叫了”这句话。
    reason: textual_variant
lexical_decisions:
- source_word: ἠρνήσατο
  choice: 否认
  rationale: 此处指否认刚才对他的指认或说法。汉语可自然地单用“否认”，既不必补出宾语，也避免把原文未明说的“否认耶稣”直接写入本句。
- source_word: Οὔτε οἶδα οὔτε ἐπίσταμαι
  choice: 我不知道，也不明白
  rationale: 两个近义动词连用，加强彼得的否认。“不知道，也不明白”保留这种重复和递进，同时符合现代汉语表达。
- source_word: σὺ τί λέγεις
  choice: 你在说什么
  rationale: 直接对应原文，保留“说”这一动词，也比“你是什么意思”少一层解释。
- source_word: ἐξῆλθεν ἔξω
  choice: 走出去
  rationale: 原文动词与方向副词叠用，带有明确向外移动的意味；“走出去”在汉语中自然地表达这一动作。
- source_word: προαύλιον
  choice: 前院
  rationale: 该词指内院或房屋前面的区域。“前院”简明地保留其空间位置，不笼统译作主要的“院子”。
- source_word: ἀλέκτωρ ἐφώνησεν
  choice: 鸡叫了
  rationale: 这是现代汉语表达公鸡啼叫的自然说法；汉语在此无须添加不定冠词或特意写作“一只公鸡”。
theological_decisions:
- issue: 是否收入 καὶ ἀλέκτωρ ἐφώνησεν（“鸡叫了”）
  choice: 正文收入“鸡叫了”
  alternative: 部分抄本没有这句话
  rationale: 所给SBLGNT正文收入该短语，同时以排印符号显示其文本不确定性。因此正文照译，并用脚注保留抄本差异，不以译文替读者裁定。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“我不知道，也不明白”保留原文近义并列所形成的强调；“前院”力求呈现 προαύλιον 与内院有别的空间含义。文本异文标记置于相关分句之后，使脚注所指清楚。
