  text: ἐγείρεσθε ἄγωμεν· ἰδοὺ ὁ παραδιδούς με ἤγγικεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/042.yaml
  text: Get up; let us go. Look[a], the one betraying me has come near.
translation:
  language: zh_hans
  text: 起来，我们走吧！看，出卖我的人已经近了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把我交出去的人已经近了。”
    reason: 保留 παραδίδωμι 较为字面的“交出、交付”含义。
lexical_decisions:
- source_word: ἐγείρεσθε
  choice: 起来
  rationale: 这是复数命令式；结合门徒刚才睡着、耶稣随即催促他们行动的语境，“起来”既自然，也不把重点局限为“醒来”。
- source_word: ἄγωμεν
  choice: 我们走吧
  rationale: 这是第一人称复数的劝勉虚拟式；“我们走吧”准确传达共同采取行动的催促语气。
- source_word: ἰδού
  choice: 看
  rationale: 该词用于引人注意；现代汉语用“看”简洁自然地保留其指示和警示作用。
- source_word: ὁ παραδιδούς με
  choice: 出卖我的人
  rationale: 带冠词的现在主动分词作名词用。受难叙事中，此处指犹大背叛耶稣；“出卖我的人”符合现代汉语，同时脚注保留“把我交出去”的较直译表达。
- source_word: ἤγγικεν
  choice: 已经近了
  rationale: 完成时表示接近这一动作已经发生，并具有当前结果；“已经近了”保留这种临近且迫在眉睫的意味，而不直接强化为“已经到了”。
theological_decisions:
- issue: 受难语境中 παραδίδωμι 的译法
  choice: 出卖
  alternative: 交出／把……交出去
  rationale: 此处所指是犹大，关系上的背叛意味十分突出，因此正文译作“出卖”；但该动词也有“交出、交付”的基本意义，故以脚注保留这一语义层面，不消除原文的张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“起来，我们走吧”有直接催促的力度；“已经近了”保留原文完成时所表达的当前临近状态。脚注标记置于相关句末。
