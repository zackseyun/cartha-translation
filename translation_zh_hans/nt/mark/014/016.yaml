base_translation:
  language: en
  yaml_path: translation/nt/mark/014/016.yaml
  text: And the disciples went out and came into the city[a], and found it just as he had told them, and they prepared the Passover.
translation:
  language: zh_hans
  text: 门徒出去，进了城，发现他们所见的情形正如耶稣对他们所说的；他们就预备了逾越节筵席[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“逾越节”。希腊语τὸ πάσχα既可泛指逾越节，也可在本语境中指逾越节的筵席。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον
  choice: 出发
  rationale: 该词表示离开先前所在之处；在这里译作“出发”符合现代汉语叙事习惯，也自然衔接进城的行动。
- source_word: οἱ μαθηταὶ
  choice: 门徒
  rationale: 这是福音书中对耶稣跟随者的标准称谓，兼有跟随与受教的含义。
- source_word: ἦλθον εἰς τὴν πόλιν
  choice: 进了城
  rationale: 准确表达进入城中的方向；汉语无需机械保留希腊语与前一动词之间“出去／来到”的形式差别。
- source_word: εὗρον καθὼς εἶπεν αὐτοῖς
  choice: 所遇见的正如耶稣对他们所说的
  rationale: 希腊文未明说εὗρον的宾语，泛指他们发现实际情形与先前所言相符；“所遇见的”自然保留这种概括性。“耶稣”用于明确汉语中的代词所指。
- source_word: ἡτοίμασαν
  choice: 预备了
  rationale: 表示把所需事物安排妥当；“预备”清楚、庄重，也符合经文语域。
- source_word: τὸ πάσχα
  choice: 逾越节的筵席
  rationale: πάσχα本身可指逾越节或逾越节筵席；此处作为“预备”的对象，语境具体指为筵席所作的准备。正文采用自然明确的表达，并以脚注保留词义范围。
theological_decisions: []
