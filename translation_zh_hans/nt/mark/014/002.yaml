  text: ἔλεγον ⸀γάρ· Μὴ ἐν τῇ ἑορτῇ, μήποτε ⸂ἔσται θόρυβος⸃ τοῦ λαοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/002.yaml
  text: For they were saying[a], “Not during the feast, lest there be an uproar from the people.”
translation:
  language: zh_hans
  text: 因为他们一直说：“不可在节期内下手，免得民众发生骚乱。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“免得在民众中间发生骚乱。”希腊语属格 τοῦ λαοῦ 既可能表示骚乱由民众而起，也可能表示骚乱发生在民众中间。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: 一直说
  rationale: 未完成时表示持续或反复的言说；“一直说”在现代汉语中自然地保留这一体貌。
- source_word: γάρ
  choice: 因为
  rationale: 承接并解释上文；“因为”清楚表达说明原因的连接作用。
- source_word: Μὴ
  choice: 不可……下手
  rationale: 原文是省略式否定，所省动作可由上文谋划捉拿并杀害耶稣补足；加入“下手”使汉语完整，同时保留简短而审慎的语气。
- source_word: ἐν τῇ ἑορτῇ
  choice: 在节期内
  rationale: ἐν 在此具有时间意义；“节期”指上下文中的逾越节及无酵节期间，并避免将其缩窄为一次筵席。
- source_word: μήποτε
  choice: 免得
  rationale: 引出所担忧并意图避免的结果，是自然、简洁的现代汉语表达。
- source_word: ἔσται
  choice: 发生
  rationale: 与“骚乱”搭配自然，并保留未来可能出现的结果。
- source_word: θόρυβος
  choice: 骚乱
  rationale: 表示喧闹的混乱或公众动荡；“骚乱”能体现局势的危险性，又不必断定为全面暴动。
- source_word: τοῦ λαοῦ
  choice: 民众发生
  rationale: 将属格主要理解为骚乱的来源，即骚乱由民众而起；脚注保留“在民众中间”的可能解释。
theological_decisions: []
