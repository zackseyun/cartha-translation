source:
  edition: SBLGNT
  text: Καὶ λέγει αὐτοῖς ὁ Ἰησοῦς ὅτι Πάντες ⸀σκανδαλισθήσεσθε, ὅτι γέγραπται· Πατάξω τὸν ποιμένα, καὶ ⸂τὰ πρόβατα διασκορπισθήσονται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/027.yaml
  text: 'And Jesus says to them[a], “You will all fall away, because it is written: ‘I will strike the shepherd, and the sheep will be scattered.’”'
translation:
  language: zh_hans
  text: 耶稣对他们说：“你们都要跌倒[a]，因为经上记着：‘我要击打牧人，羊就要四散。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你们都要离弃我”，也可较直译为“你们都要被绊倒”。
    reason: 说明σκανδαλισθήσεσθε在本处既可按上下文表达离弃，也可保留其被动形式和“绊倒”的字面意象。
lexical_decisions:
- source_word: λέγει
  choice: 说
  rationale: 希腊文用叙事性现在时，使叙述生动；现代汉语的“说”不标明时态，既自然，也不必强行改成带明确过去色彩的表达。
- source_word: σκανδαλισθήσεσθε
  choice: 都要跌倒
  rationale: 保留“绊倒、跌倒”的隐喻及被动形式可能含有的受动意味，同时在上下文中可指门徒因压力而动摇、离散，不把含义收窄为某一种神学解释。
- source_word: γέγραπται
  choice: 经上记着
  rationale: 这是引述圣经的固定表达，既体现完成时所含“已经写下且仍然有效”的意味，也符合现代汉语圣经语体。
- source_word: Πατάξω
  choice: 我要击打
  rationale: 直接保留动词的力度和第一人称将来意义，用词庄重而不古奥。
- source_word: ποιμένα
  choice: 牧人
  rationale: 忠实保留先知性引文中的单数牧羊人意象；汉语引文中无需另加定冠词。
- source_word: τὰ πρόβατα
  choice: 羊
  rationale: 自然呈现羊群意象；汉语不必以复数标记对应希腊文复数。
- source_word: διασκορπισθήσονται
  choice: 就要四散
  rationale: “四散”自然传达羊群被驱散、分散各处的被动结果；“就”也明确表现牧人被击打与羊群离散之间的联系。
theological_decisions:
- issue: σκανδαλισθήσεσθε所表达的门徒失败性质
  choice: 你们都要跌倒
  alternative: 你们都要离弃我；你们都要被绊倒
  rationale: “跌倒”保留原文隐喻及其涵义张力，既可指信心动摇，也可在本段情境中指门徒离弃耶稣而逃散；正文不把它直接定性为彻底背道。脚注列出较意译和较强调受动形式的读法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“经上记着”保留正式的引经语气；“击打牧人”“羊就要四散”保持简洁鲜明的先知性意象。
