  text: εἷς δέ ⸀τις τῶν παρεστηκότων σπασάμενος τὴν μάχαιραν ἔπαισεν τὸν δοῦλον τοῦ ἀρχιερέως καὶ ἀφεῖλεν αὐτοῦ τὸ ⸀ὠτάριον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/047.yaml
  text: But one of those standing nearby drew his sword and struck the high priest’s slave[a], and cut off his ear.
translation:
  language: zh_hans
  text: 可是，站在旁边的人中有一个拔出刀来，击中了大祭司的奴隶[a]，砍掉了他的一只耳朵。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“仆人”。希腊语δοῦλος也可按语境这样理解。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἷς δέ τις
  choice: 可是……有一个
  rationale: εἷς……τις以不确定的方式从一群人中引出一人；“有一个”保留其未具名的特点，“可是”则自然表达δέ在叙事中的轻微转折。
- source_word: τῶν παρεστηκότων
  choice: 站在旁边的人中
  rationale: παρίστημι的完成时分词在此指当时站在那里、在场的人；译文保留其空间意味。
- source_word: σπασάμενος τὴν μάχαιραν
  choice: 拔出刀来
  rationale: σπάομαι与μάχαιρα连用，指拔出武器。汉语以连续动作表达该分词结构最自然；μάχαιρα可指短剑、刀或匕首，此处用宽泛而自然的“刀”，不把具体形制说死。
- source_word: ἔπαισεν
  choice: 砍了……一刀
  rationale: παίω表示击打；结合所拔出的刀及随后耳朵被削掉的结果，“砍了……一刀”自然传达以刀击中的暴力动作。
- source_word: τὸν δοῦλον τοῦ ἀρχιερέως
  choice: 大祭司的奴隶
  rationale: δοῦλος表示处于从属和被支配地位的人；“奴隶”较完整地保留原文所反映的社会身份，而“大祭司的”自然表达属格关系。
- source_word: ἀφεῖλεν
  choice: 削掉了
  rationale: ἀφαιρέω本义为拿走、除去；在刀击耳朵的语境中，“削掉了”准确而自然地表达动作结果。
- source_word: αὐτοῦ τὸ ὠτάριον
  choice: 他的一只耳朵
  rationale: ὠτάριον虽为指“耳朵”的指小形式，此处不必机械译成“小耳朵”。“一只耳朵”符合现代汉语，也不从平行记载加入“右耳”。
theological_decisions:
- issue: 叙事社会身份语境中δοῦλος的译法
  choice: 奴隶
  alternative: 仆人
  rationale: 此处人物隶属于大祭司，从属关系明确；“奴隶”保留古代社会现实，“仆人”则作为可能的语境性译法列入脚注，避免掩盖词义范围。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“可是”承接前文并表达轻微转折；句中按动作顺序使用“拔出—砍—削掉”，既自然又贴近希腊文。保留马可未指明持刀者身份及被削掉的是哪一侧耳朵的含混性。
