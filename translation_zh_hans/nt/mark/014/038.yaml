  text: γρηγορεῖτε καὶ προσεύχεσθε, ἵνα μὴ ⸀ἔλθητε εἰς πειρασμόν· τὸ μὲν πνεῦμα πρόθυμον ἡ δὲ σὰρξ ἀσθενής.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/038.yaml
  text: Stay awake and pray[a], so that you may not enter into temptation. The spirit indeed is willing, but the flesh is weak.
translation:
  language: zh_hans
  text: 你们要警醒祷告，免得陷入试探[a]。心灵固然愿意，肉体却软弱。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “试探”也可译作“考验”或“试炼”。
    reason: 保留πειρασμός在本语境中仍可能具有的较广语义。
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: 要警醒
  rationale: 该词既可指保持清醒，也有警觉守望之意。客西马尼园的语境涉及门徒困倦，但耶稣的劝诫又不止于生理上的醒着；“警醒”自然凝练，保留双重意味。
- source_word: προσεύχεσθε
  choice: 祷告
  rationale: 现在时命令语气表达持续性的劝勉；汉语“要警醒祷告”可自然涵盖这一持续要求。
- source_word: ἵνα μὴ ἔλθητε εἰς πειρασμόν
  choice: 免得陷入试探
  rationale: ἵνα μή加虚拟语气表达防止某事发生的目的。“免得”准确而自然；“陷入”比机械的“进入”更符合现代汉语，同时保留进入某种危险处境的意象。
- source_word: πειρασμόν
  choice: 试探
  rationale: πειρασμός可指诱惑人犯罪的试探，也可指考验或试炼。正文采用此警告语境中最自然且传统上熟悉的“试探”，脚注保留其他可能含义。
- source_word: τὸ μὲν πνεῦμα πρόθυμον
  choice: 心灵固然愿意
  rationale: πνεῦμα在这里与肉体相对，较可能指人的内在心志；译为“心灵”避免误读为圣灵。“固然”自然体现μέν与随后δέ构成的对照。
- source_word: ἡ δὲ σὰρξ ἀσθενής
  choice: 肉体却软弱
  rationale: σάρξ在此强调人的身体与整体人性之脆弱，并未明确指“罪性”；“肉体”保留原文的具体用词和神学张力。ἀσθενής直译为“软弱”，与愿意的心灵形成清楚对照。
theological_decisions:
- issue: πνεῦμα所指为何
  choice: 人的心灵或内在心志
  alternative: 圣灵
  rationale: 耶稣正在对困倦而失败的门徒说话，且πνεῦμα与σάρξ直接对照，因此更自然地指人的内在意愿。译文不用“圣灵”，避免加入原文并未要求的教义判断。
- issue: σάρξ的含义
  choice: 肉体，即人性和身体方面的脆弱
  alternative: 罪性；身体
  rationale: 本节重心是门徒虽有意愿却因人的软弱而失败，不足以把σάρξ具体解释为“罪性”。译作“肉体”既保留原文，也不把含义缩限为纯粹生理身体。
- issue: πειρασμός的语义范围
  choice: 正文作“试探”
  alternative: 考验；试炼
  rationale: 语境中的警告适合“试探”，但原词也可指考验或试炼，因此通过脚注保留真实的词义宽度。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“警醒祷告”简洁有力；“心灵固然愿意，肉体却软弱”保留原文平衡的对照结构。脚注标记[a]已置于正文对应词后。
