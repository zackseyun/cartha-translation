source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Περίλυπός ἐστιν ἡ ψυχή μου ἕως θανάτου· μείνατε ὧδε καὶ γρηγορεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/034.yaml
  text: And he says to them[a], “My soul is deeply grieved, even to death[c][b]. Remain here and keep watch.”
translation:
  language: zh_hans
  text: 他对他们说：“我的心[a]极其忧伤，几乎要死[b]。你们留在这里，要警醒[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “心”或译“灵魂”，这里可指人的内在生命，甚至整个人。
    reason: lexical_alternative
  - marker: b
    text: 或译“忧伤到了要死的地步”；直译“忧伤直到死”。
    reason: lexical_alternative
  - marker: c
    text: 或译“保持清醒”或“警觉守望”；这个命令既可包括不要睡着，也可包括保持警觉。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: 说
  rationale: 希腊文采用叙事性现在时，使场景显得鲜活；现代汉语叙事中“说”本身不标明时态，可自然保留这种直接感，不必补成“说道”或“曾说”。
- source_word: Περίλυπός
  choice: 极其忧伤
  rationale: 该词表达强烈而深重的悲痛。“极其忧伤”庄重自然，也保留情绪的强度；“悲痛欲绝”则可能过度解释后面的“直到死”。
- source_word: ψυχή
  choice: 心
  rationale: 此处指人的内在生命乃至整个人。“我的心”是现代汉语表达深切忧伤的自然说法，并以脚注保留“灵魂”这一较形式对应的译法。
- source_word: ἕως θανάτου
  choice: 几乎要死
  rationale: 该短语直译为“直到死”，在语境中表达忧伤达到死亡边缘或死亡程度。“几乎要死”是自然的现代汉语，同时不把它明确限定为实际死因。
- source_word: μείνατε
  choice: 留在
  rationale: 不定过去时命令语气要求门徒待在指定地点；“留在这里”准确、自然且符合庄重语体。
- source_word: ὧδε
  choice: 这里
  rationale: 直接对应地点副词，现代汉语以“这里”表达最自然。
- source_word: γρηγορεῖτε
  choice: 警醒
  rationale: 该命令在当下包括不要睡着，也具有保持警觉的意味。“警醒”可兼顾身体清醒和警觉守望，脚注说明另一种译法。
theological_decisions:
- issue: 耶稣所说 ψυχή 的译法
  choice: 心
  alternative: 灵魂；生命；我整个人
  rationale: “心”在现代汉语中自然表达耶稣内在生命的真实痛苦，又不对人的构成作额外的教义界定。脚注列出“灵魂”，以保留希腊词的传统表达及其可能的整体人格含义。
- issue: ἕως θανάτου 所表达的程度
  choice: 几乎要死
  alternative: 直到死；到了要死的地步
  rationale: 原文可表达忧伤达到死亡的边缘，也可强调其极端程度。正文采用自然汉语而不说明这忧伤是否会直接导致死亡，脚注保留更贴近形式的选择。
- issue: γρηγορεῖτε 的命令范围
  choice: 警醒
  alternative: 保持清醒；不要睡着；警觉守望
  rationale: 语境中的命令确实涉及不睡着，但该词也可承载警觉守望的含义。“警醒”保留这层张力，不把命令缩减为单纯的生理清醒。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“极其忧伤”传达强烈悲痛而避免成语化的过度渲染；“留在这里，要警醒”保留两个并列命令的简洁和紧迫感。所有脚注标记均置于正文相关词语之后。
