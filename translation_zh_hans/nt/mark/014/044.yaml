  text: δεδώκει δὲ ὁ παραδιδοὺς αὐτὸν σύσσημον αὐτοῖς λέγων· Ὃν ἂν φιλήσω αὐτός ἐστιν· κρατήσατε αὐτὸν καὶ ⸀ἀπάγετε ἀσφαλῶς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/044.yaml
  text: The one betraying him had given them a signal[a], saying, “The one I kiss is he[c][b]. Seize him and lead him away securely.”
translation:
  language: zh_hans
  text: 出卖耶稣的人事先给了他们一个暗号[a]，说：“我亲吻[b]谁，谁就是他。你们要抓住他，稳妥地带走他[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“记号”；希腊语指事先约定、用来辨认目标的信号。
    reason: lexical_alternative
  - marker: b
    text: 亲吻在当时通常是问候礼；犹大在这里用它作为辨认耶稣的暗号。
    reason: cultural_note
  - marker: c
    text: 或译“安全地带走”。这里很可能是指严密控制住他，确保他不能脱逃。
    reason: alternative_reading
lexical_decisions:
- source_word: δεδώκει
  choice: 事先给了
  rationale: 用“事先”体现过去完成时所表示的预先安排；现代汉语不宜机械复制时态形式。
- source_word: ὁ παραδιδοὺς αὐτόν
  choice: 出卖耶稣的人
  rationale: 本节独立呈现时补明“耶稣”比单用“他”更清楚；“出卖”符合马可叙事中该词的语境意义。
- source_word: σύσσημον
  choice: 暗号
  rationale: 该词指双方约定用来识别目标的信号；“暗号”自然传达其预先约定且具有隐蔽识别作用的含义。
- source_word: Ὃν ἂν φιλήσω
  choice: 我亲谁
  rationale: 简洁自然地保留带ἄν的不定关系结构，不增添原文未明说的“男人”。
- source_word: αὐτός ἐστιν
  choice: 谁就是他
  rationale: 保留原文强调性的身份确认，同时符合现代汉语直接引语的表达。
- source_word: κρατήσατε
  choice: 抓住
  rationale: 体现强行控制住对方的动作，比程序意味较强的“逮捕”更贴近κρατέω。
- source_word: ἀπάγετε ἀσφαλῶς
  choice: 严密押走
  rationale: “押走”符合拘捕语境，“严密”表达确保其始终受控制、不致脱逃，而非保障其人身安全。
theological_decisions:
- issue: παραδίδωμι在此处的伦理色彩
  choice: 出卖
  alternative: 交出／交给
  rationale: 在犹大以暗号协助拘捕耶稣的叙事中，“出卖”是自然且有语境依据的表达，并非额外加入某一宗派解释。
- issue: ἀσφαλῶς所指的安全对象
  choice: 严密押走
  alternative: 安全地带走
  rationale: 拘捕语境更可能指确保耶稣被牢牢控制，而不是确保耶稣安然无恙；脚注保留另一种字面表达的可能。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“事先给了”交代暗号早已安排；“严密押走”避免把ἀσφαλῶς误解为保护被捕者安全。所有脚注标记均置于对应正文内容之后。
