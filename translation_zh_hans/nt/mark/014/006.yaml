  rationale: 将“在我身上做了”改为“为我做了”，使现代汉语更自然，并在正文中保留原文对耶稣的关系性指向；脚注说明ἐν ἐμοί的字面形式及其在上下文中可理解的空间性含义，避免消除原文的语义张力。其余译文忠实、自然，无须改动。
