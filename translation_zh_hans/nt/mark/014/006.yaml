  text: ὁ δὲ Ἰησοῦς εἶπεν· Ἄφετε αὐτήν· τί αὐτῇ κόπους παρέχετε; καλὸν ἔργον ἠργάσατο ἐν ἐμοί·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/006.yaml
  text: But Jesus said[a], “Leave her alone[c][b]. Why are you troubling her? She has done a beautiful work for me.”
translation:
  language: zh_hans
  text: 耶稣却说：“由她吧！为什么难为她呢？她为我做了一件美好的事[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文介词短语直译可作“在我里面”；按本段膏抹的语境，也可理解为“在我身上”。此处译作“为我”。“美好的”也可译作“好的”。
    reason: 原文 ἐν ἐμοί 的关系义与空间义均有可能；καλόν 亦可译为“好的”。
lexical_decisions:
- source_word: Ἄφετε αὐτήν
  choice: 由她吧
  rationale: 该命令要求众人立即停止干涉她；“由她吧”在现代汉语中简洁自然，也保留耶稣保护她的语气。
- source_word: τί αὐτῇ κόπους παρέχετε;
  choice: 为什么难为她呢？
  rationale: κόπους παρέχετε 是使人受困扰、添麻烦的表达；“难为她”自然传达众人给她造成压力和困扰的含义。
- source_word: καλὸν ἔργον
  choice: 一件美好的事
  rationale: καλός 兼有美好、善好、可嘉之意；“美好的事”保留对这项行动之美与合宜性的称许，不把意思缩窄为一般道德上的“好事”。
- source_word: ἠργάσατο
  choice: 做了
  rationale: 这里是对她已经实施之行动的自然汉语表达；无需机械重复为“作了一个工作”。
- source_word: ἐν ἐμοί
  choice: 在我身上
  rationale: 保留介词短语较具体的表达，并切合膏抹耶稣身体的上下文；同时避免只译作“为我”而淡化行动所指向的对象。
- source_word: δὲ
  choice: 却
  rationale: δὲ 在这里标明耶稣的话与众人的责难形成轻度转折，“却”符合叙事语气。
theological_decisions:
- issue: καλὸν ἔργον 对女子行为的评价
  choice: 译作“一件美好的事”
  alternative: 一件好事；一件高尚的事
  rationale: 译文保留耶稣对该行为美好且合宜的肯定，却不引入功德论、圣礼观等经文本身未明说的神学判断。
- issue: ἐν ἐμοί 的关系与空间含义
  choice: 译作“在我身上”
  alternative: 为我；向我；在我里面
  rationale: 原文 ἐν ἐμοί 字面具有“在我里面／身上”的形式，而上下文是把香膏倒在耶稣身上；此译既自然，也保留动作落在耶稣身上的具体性。“为我”则可作为较偏关系意义的理解列入脚注。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事语言。“由她吧”简洁有力；“难为她”比“给她劳苦”更符合现代汉语习惯。脚注标记置于其所说明的整句之后。
