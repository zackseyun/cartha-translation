id: MRK.14.30
reference: Mark 14:30
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Ἀμὴν λέγω σοι ὅτι σὺ σήμερον ⸂ταύτῃ τῇ νυκτὶ⸃ πρὶν ἢ δὶς ἀλέκτορα φωνῆσαι τρίς ⸂με ἀπαρνήσῃ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/030.yaml
  text: And Jesus says to him[a], “Truly I tell you, today, this very night, before a rooster crows twice, you will deny me three times.”
translation:
  language: zh_hans
  text: 耶稣对他说：“我实在告诉你，今天，就在今夜，鸡叫两遍以前，你会三次不认我。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: 说
  rationale: 希腊文采用历史现在时；现代汉语的“说”本身不强制标明过去或现在，既自然，也无需添加“了”来抹平马可叙事的鲜活感。
- source_word: Ἀμὴν λέγω σοι
  choice: 我实在告诉你
  rationale: ἀμήν在耶稣宣告的开头具有郑重确证的作用；“我实在告诉你”符合现代汉语表达，并保留直接、庄严的语气。
- source_word: σήμερον ⸂ταύτῃ τῇ νυκτὶ⸃
  choice: 今天，就在今夜
  rationale: 同时保留“今天”和“今夜”两个时间表达；“就在”传达指示语的强调意味，又使汉语衔接自然。
- source_word: πρὶν ἢ δὶς ἀλέκτορα φωνῆσαι
  choice: 鸡叫两遍以前
  rationale: 按汉语习惯表达时间界限，并明确保留马可所记的“两遍”。希腊文ἀλέκτωρ在此作泛指，汉语用“鸡叫”比“某只公鸡啼叫”更自然。
- source_word: τρίς με ἀπαρνήσῃ
  choice: 你会三次不认我
  rationale: “不认我”在此清楚表达否认与耶稣的关系，比可能仅指否定某项陈述的“否认我”更符合语境；“三次”完整保留数目，并以“你会”体现显明的主语及预告意味。
theological_decisions:
- issue: σήμερον与ταύτῃ τῇ νυκτί的并列时间表达
  choice: 两个表达都译出：“今天，就在今夜”
  alternative: 只译作“就在今晚”
  rationale: 原文并列使用两个时间表达，形成迫近而郑重的强调；合并会损失这一修辞力度。
- issue: ἀπαρνήσῃ所表达的否认性质
  choice: 译作“不认我”
  alternative: 译作“否认我”或“与我断绝关系”
  rationale: “不认我”保留对其具体表现方式的一定开放性，同时自然指向彼得将否认认识或跟从耶稣；“与我断绝关系”解释过多。
- issue: 马可叙事中的历史现在时λέγει
  choice: 采用无时态标记的“说”
  alternative: 译作“说了”或“说道”
  rationale: 现代汉语不必机械标示时态；“说”既忠于叙事形式，也保持简洁鲜明。
translation_notes:
  register: 采用现代、庄重而口语可懂的普通话。“今天，就在今夜”保留原文双重时间强调；“鸡叫两遍以前”与“你会三次不认我”形成清晰的数字对照。无需脚注即可准确传达本节原文。
