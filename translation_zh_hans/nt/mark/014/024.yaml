  rationale: 修订使“约”的表达更自然、忠实，并将每个脚注标记移至其实际解释的词组之后：[a]标注“立约的血”，[c]标注“许多人”，[b]标注“流出的”。正文仍保留原文的现在被动分词所表达的倾流意象、ὑπέρ的宽泛关系，以及“许多人”而非“所有人”的措辞；未加入“新”，也未作圣餐或赎罪理论的扩译。
