  text: καὶ εἶπεν αὐτοῖς· Τοῦτό ἐστιν τὸ αἷμά μου ⸀τῆς διαθήκης τὸ ⸂ἐκχυννόμενον ὑπὲρ πολλῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/024.yaml
  text: And he said to them[a], “This is my blood of the covenant[c][b], which is poured out for many.”
translation:
  language: zh_hans
  text: 耶稣对他们说：“这是我立约的血[a]，为许多人[c]流出的[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本以及平行经文作“我的新约之血”。这里所据的马可福音希腊文正文作“我立约的血”。
    reason: textual_variant
  - marker: b
    text: 或译“正在流出”；传统上也译作“流血”。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“为了许多人”或“为许多人的缘故”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτό ἐστιν
  choice: 这是
  rationale: 直译系词结构，既不改写为“这象征”，也不预先裁定圣餐意义。
- source_word: τὸ αἷμά μου
  choice: 我的……血
  rationale: 保留第一人称所属关系和“血”的祭献、立约意象，不释义为“我的死”。
- source_word: τῆς διαθήκης
  choice: 立约之
  rationale: “立约之血”自然呼应出埃及记24:8的立约背景，并保留διαθήκη在此处的盟约含义；不按遗嘱意义翻译。
- source_word: ἐκχυννόμενον
  choice: 流出
  rationale: 以中文自然表达血被倾流、流出的意象；不采用较古旧的“倾洒”，也不把分词所表达的事件改写为抽象的死亡。
- source_word: ὑπὲρ πολλῶν
  choice: 为许多人
  rationale: “为”简洁保留ὑπέρ所含的为了、代表或有利于他人的关系，而“许多人”忠实保留πολλῶν，不擅自换成“所有人”。
theological_decisions:
- issue: διαθήκη应译作盟约意义还是遗嘱意义
  choice: 立约
  alternative: 遗嘱
  rationale: 上下文中的血与出埃及记24:8立约用血的表达相呼应，因此这里是盟约语境，而非遗嘱或遗赠语境。
- issue: 是否在“约”前补入“新”
  choice: 不补入“新”
  alternative: 新约之血
  rationale: 所据SBLGNT正文没有καινῆς；不可因平行经文或熟悉的传统措辞而把“新”加入马可的正文。异文在脚注中说明。
- issue: ὑπὲρ πολλῶν是否应按赎罪范围作神学性扩译
  choice: 为许多人
  alternative: 为所有人；代替许多人
  rationale: 译文保留“许多人”以及ὑπέρ本身较宽的关系含义，不在本节中替作者解决赎罪范围或代替性表达的神学争议。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“立约之血”略带经文语体，以保留其固定的圣经互文和盟约分量；句法简洁，适合公开诵读。所有脚注标记均置于其所解释的词组之后。
