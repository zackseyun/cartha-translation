base_translation:
  language: en
  yaml_path: translation/nt/mark/014/072.yaml
  text: And immediately a rooster crowed a second time. And Peter remembered the word[a], how Jesus had said to him, “Before a rooster crows twice, you will deny me three times.” And breaking down, he wept.
translation:
  language: zh_hans
  text: 立刻，公鸡第二次啼叫。彼得想起耶稣曾对他说的话：“鸡叫两遍以前，你会三次不认我。”他想到这事，就哭了起来。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “想到这事”所译的希腊文分词含义艰深，历来有不同理解；也可理解为彼得情绪崩溃，或指某种外在的身体动作。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: 立刻
  rationale: 保留马可叙事中鲜明的紧迫感，同时符合现代汉语表达。
- source_word: ἐκ δευτέρου
  choice: 第二遍
  rationale: 明确保留“第二次”的计数含义；与“鸡叫”搭配时，“第二遍”自然顺畅。
- source_word: ἀλέκτωρ ἐφώνησεν
  choice: 鸡叫了
  rationale: 在汉语中，“鸡叫”自然指公鸡啼叫，无须生硬地译成“公鸡发声”。
- source_word: ἀνεμνήσθη
  choice: 想起
  rationale: 准确表达彼得在这一刻回想起先前所说之话，叙事语气自然。
- source_word: τὸ ῥῆμα
  choice: 那句话
  rationale: ῥῆμα在此指耶稣先前所说的话；“那句话”比直译“那个话语”更符合现代汉语，后文引语也清楚说明其内容。
- source_word: ὡς εἶπεν αὐτῷ ὁ Ἰησοῦς
  choice: 耶稣对他说过的
  rationale: 按汉语习惯嵌入“那句话”的定语结构，并以“说过”交代该话先于当前事件。
- source_word: Πρὶν ἀλέκτορα φωνῆσαι δὶς
  choice: 在鸡叫两遍之前
  rationale: 保留πρίν的时间关系和δὶς的明确次数；汉语可用泛指的“鸡”而不必指定某一只公鸡。
- source_word: τρίς με ἀπαρνήσῃ
  choice: 你会三次不认我
  rationale: “不认我”自然传达ἀπαρνέομαι在关系层面的否认、拒认之意，也与彼得三次否认认识耶稣的上下文相符。
- source_word: ἐπιβαλών
  choice: 再也抑制不住
  rationale: 该分词在此处意义艰深且解释不一；正文采用能表达情绪骤然决堤、又不指定某种身体动作的自然汉语，其他可能理解列入脚注。
- source_word: ἔκλαιεν
  choice: 哭了起来
  rationale: 用“起来”自然呈现未完成过去时所指的动作开始并延续，较单纯的“哭了”更能传达其体貌。
theological_decisions:
- issue: 如何处理含义不明确的分词ἐπιβαλών
  choice: 正文译为“再也抑制不住”，并用脚注说明歧义。
  alternative: 也可能是“他一想到这事，就哭了”，或指某种外在的身体动作。
  rationale: 这主要是词汇和句法问题，却会影响读者如何理解彼得此刻的悔恨表现。正文保留情绪转折，不武断指定原文未明确说明的身体动作；脚注则如实保留主要解释空间。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“鸡叫了第二遍”“那句话”“哭了起来”均为普通读者自然可懂的表达；正文力求流畅，脚注透明保留原文末句的真实歧义。
