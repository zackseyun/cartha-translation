  text: Then they laid hands on him and seized him[a][b].
translation:
  language: zh_hans
  text: 他们就对耶稣下手[a]，把他抓住了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“把手加在他身上。”这是指动手抓住某人的惯用说法，常带有拘捕的意思。
    reason: lexical_alternative
  - marker: b
    text: 或译：“逮捕了他。”
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ
  choice: 他们就
  rationale: οἱ作名词用，指前文来捉拿耶稣的那些人；δέ在此轻微推进叙事，用“就”自然承接犹大亲吻耶稣后的行动，不刻意强化转折。
- source_word: ἐπέβαλαν τὰς χεῖρας αὐτῷ
  choice: 下手拿住耶稣
  rationale: 这是表示动手控制某人的惯用语，语境带有敌意和拘捕意图。“下手拿住”既是自然的现代汉语，也保留实际抓住他的动作。
- source_word: ἐκράτησαν αὐτόν
  choice: 把他制伏了
  rationale: κρατέω在此指强行控制并扣住。“制伏”体现抓住之后使其受控制的结果，又避免与前一短语简单重复；拘捕之意则由上下文明确。
