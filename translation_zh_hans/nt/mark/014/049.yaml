  text: καθ’ ἡμέραν ἤμην πρὸς ὑμᾶς ἐν τῷ ἱερῷ διδάσκων καὶ οὐκ ἐκρατήσατέ με· ἀλλ’ ἵνα πληρωθῶσιν αἱ γραφαί.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/049.yaml
  text: Day after day I was with you in the temple[a], teaching, and you did not seize me[c][b]. But let the Scriptures be fulfilled.
translation:
  language: zh_hans
  text: 我天天在圣殿区[a]和你们在一起，教导人；你们却没有抓我[b]。但这是为要使经上的话得以应验[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣殿区”指整个圣殿建筑群和院落，并非专指内层圣所。
    reason: cultural_note
  - marker: b
    text: “抓我”也可译作“逮捕我”。
    reason: lexical_alternative
  - marker: c
    text: 原文在这里省略了主句的谓语；可较直译为：“但为要使经上的话得以应验。”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: 天天
  rationale: 这是逐日分配性的表达，意为“每天、日复一日”；“天天”自然简洁，也保留反复持续之意。
- source_word: ἤμην πρὸς ὑμᾶς
  choice: 我……和你们一起
  rationale: πρός与人连用在此表示与他们同在；这一译法符合现代汉语，也强调耶稣一直公开出现在他们面前。
- source_word: ἐν τῷ ἱερῷ
  choice: 在圣殿区
  rationale: ἱερόν指整个圣殿建筑群或院区，而非专指内层圣所；“圣殿区”在正文中直接表达这一范围。
- source_word: διδάσκων
  choice: 教导人
  rationale: 现在分词表示当时持续进行的公开活动；补出泛指宾语“人”使汉语顺畅，并未限定具体听众。
- source_word: οὐκ ἐκρατήσατέ με
  choice: 你们并没有抓我
  rationale: κρατέω可指抓住、拘捕；“抓”既保留动作意味，又能自然涵盖本段的逮捕语境。
- source_word: ἀλλ’ ἵνα
  choice: 但这一切发生，是要使
  rationale: 原文在ἀλλ’ ἵνα之后省略了主句谓语。正文以最少量补足使现代汉语完整，同时用脚注说明原文的省略。
- source_word: πληρωθῶσιν
  choice: 得以应验
  rationale: 被动虚拟式在ἵνα从句中表达目的或结果；“得以应验”保留被动及目的性，不把两者关系解释得过强。
- source_word: αἱ γραφαί
  choice: 经上的话
  rationale: 复数γραφαί指以色列的神圣经文；“经上的话”是现代中文圣经语境中自然、庄重且易懂的表达。
theological_decisions:
- issue: 省略的目的从句与神圣旨意
  choice: 但这一切发生，是要使经上的话得以应验
  alternative: 但为要使经上的话得以应验
  rationale: 希腊文省略了与ἵνα目的从句相配的主句。正文补出“这一切发生”以使汉语完整，但不进一步规定事件如何发生，也不强化原文未明说的决定论含义；脚注保留较贴近原文省略结构的译法。
- issue: ἵνα从句中的目的与结果张力
  choice: 是要使……得以应验
  alternative: 于是经上的话得以应验
  rationale: ἵνα通常表达目的，也可能在语境中带出结果。选择“是要使”保留主要的目的色彩，同时“得以”避免把因果机制阐释得过细。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“天天”保留持续、反复的语气；“圣殿区”避免现代读者误以为耶稣在内层圣所教导；末句以适度补足处理希腊文省略，并用脚注保存其简练和歧义。
