base_translation:
  language: en
  yaml_path: translation/nt/mark/014/060.yaml
  text: And the high priest stood up in the middle and questioned Jesus[a], saying[c][b], “Do you answer nothing? What are these men testifying against you?”
translation:
  language: zh_hans
  text: 大祭司便站起来，站到中间[a]，问耶稣说：“你什么都不回答吗？这些人正在作证指控你什么？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“到众人当中”。原文表示大祭司移到一个居中的位置，但没有明确说明这个位置的具体范围。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: 站起来
  rationale: 这里表示从座位或原先姿势起身的实际动作；“站起来”符合现代汉语叙事习惯。
- source_word: ὁ ἀρχιερεὺς
  choice: 大祭司
  rationale: 这是该审讯场景中犹太教最高祭司的标准称谓。
- source_word: εἰς μέσον
  choice: 走到中间
  rationale: εἰς带有趋向意义，表明大祭司起身后到了中央位置；译文用“走到”自然呈现这一移动，但不具体断定他位于哪些人中间。
- source_word: ἐπηρώτησεν
  choice: 问
  rationale: 该动词可指询问或质问；司法语境已由上下文体现，采用“问”避免加入原文未明确表达的强硬程度。
- source_word: ἀποκρίνῃ οὐδέν
  choice: 你什么都不回答吗
  rationale: 保留否定反问的直接、逼问语气，也自然表达完全不作答的意思。
- source_word: οὗτοί
  choice: 这些人
  rationale: 阳性复数指示代词在此指现场作证者；“这些人”明确所指，又符合现代汉语。
- source_word: καταμαρτυροῦσιν
  choice: 作证指控
  rationale: 该词表示作对某人不利的证言；“作证指控”同时保留法律场景中的作证含义和证言针对耶稣的方向。
theological_decisions:
- issue: οὗτοί所指群体的表达
  choice: 这些人
  alternative: 这些作证的人／他们
  rationale: 原文用阳性复数指示代词指向在场的证人。“这些人”既明确现场指向，又不额外加入原文没有明说的身份说明。
- issue: 第二个问句的内容与指控关系
  choice: 这些人作证指控你什么？
  alternative: 这些人作证指控你的，究竟是什么？
  rationale: 译文保留τί所询问的是证言或指控内容，并保留καταμαρτυροῦσιν的作证性质，不把问题改释为询问作证动机或证言真伪。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“便”承接前文并推动叙事；问句保持大祭司当庭逼问的简短力度，不使用文言化的“岂不作答”等表达。
