  yaml_path: translation/nt/mark/014/039.yaml
  text: And again he went away and prayed[b][a], saying the same words.
translation:
  language: zh_hans
  text: 他又走开去祷告，所说的仍是同样的话[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“同一个话语”；也可译作“同样的事”或“同样的说法”。原文用单数 λόγος 指他重复的祷告内容。
    reason: 保留 λόγος 在“话语、所说的内容、事情”之间的词义幅度，并说明中文正文采用自然的集合性表达。
lexical_decisions:
- source_word: πάλιν
  choice: 又
  rationale: 简洁自然地表达动作再次发生，并承接前文叙事。
- source_word: ἀπελθὼν
  choice: 走开
  rationale: 表达耶稣从门徒那里离开的动作；与“去祷告”连用，符合现代汉语的叙事习惯。
- source_word: προσηύξατο
  choice: 祷告
  rationale: 这是 προσεύχομαι 在本语境中的标准对应词，清楚而庄重。
- source_word: τὸν αὐτὸν λόγον
  choice: 同样的话
  rationale: λόγος 在这里指祷告所说的内容，而不是单独一个字词；“同样的话”既自然，也保留了重复先前祷告内容的意思。
- source_word: εἰπών
  choice: 说的
  rationale: 说明祷告时所说的内容；采用“说的还是……”可自然体现其与前次祷告相同。
theological_decisions: []
translation_notes:
  register: 采用现代、简洁而庄重的叙事语言。“走开去祷告”使动作次序清楚；“说的还是同样的话”自然表达原文所强调的重复内容。
