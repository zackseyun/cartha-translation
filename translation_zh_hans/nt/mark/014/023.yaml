  text: καὶ ⸀λαβὼν ποτήριον εὐχαριστήσας ἔδωκεν αὐτοῖς, καὶ ἔπιον ἐξ αὐτοῦ πάντες.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/023.yaml
  text: And taking a cup[a], after giving thanks he gave it to them, and they all drank from it.
translation:
  language: zh_hans
  text: 他拿起一只杯，献上感谢后，递给他们；他们都从这杯中喝了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαβὼν
  choice: 拿起
  rationale: 不定过去时分词表示先于主要动词发生的动作；“拿起”自然呈现动作次序，并与后面的“递给”衔接。
- source_word: ποτήριον
  choice: 一个杯子
  rationale: 希腊文名词没有冠词，直译为“一个杯子”最能保留其形式；但用餐语境也可能指特定的杯子，因此附注说明。
- source_word: εὐχαριστήσας
  choice: 感谢了
  rationale: 该词表示献上感谢，且动作先于“递给”；这一译法简洁自然，也不引入后世礼仪术语。
- source_word: ἔδωκεν αὐτοῖς
  choice: 递给他们
  rationale: “递给”符合把手中杯子交给众人的具体语境；中文无须另补宾语代词。
- source_word: ἔπιον
  choice: 喝了
  rationale: 采用现代汉语中自然、直接的过去动作表达。
- source_word: ἐξ αὐτοῦ
  choice: 喝了杯中的酒
  rationale: 希腊文直义为“从它喝”，其中中性代词回指杯子。现代汉语通常说喝杯中之物；补出“酒”依据逾越节筵席的上下文，但其具体饮料名并未在本节明说。
- source_word: πάντες
  choice: 他们都
  rationale: 保留原文对所有在场者都喝了的强调，且符合现代汉语语序。
theological_decisions:
- issue: εὐχαριστήσας可能具有的圣餐礼仪色彩
  choice: 译为“感谢了”
  alternative: “祝谢了”或“为杯祝福了”
  rationale: 原词直接表示感谢；不以“祝圣”等后世礼仪用语预先限定本节的神学意义。
- issue: ἐξ αὐτοῦ所指的是杯子还是杯中之物
  choice: 正文按自然汉语译作“喝了杯中的酒”
  alternative: 较形式对应地译作“都从这杯中喝了”
  rationale: 代词在语法上回指“杯子”，但实际喝的是杯中之物。补出“酒”使中文自然，也符合筵席语境；同时承认本节本身未重复说明饮料名称。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“感谢了，就递给他们”保留两个分词动作与主要动词之间的先后关系；分号呈现递杯与众人饮用两个紧密相连的叙事步骤。
