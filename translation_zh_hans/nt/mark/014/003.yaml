source:
  edition: SBLGNT
  text: Καὶ ὄντος αὐτοῦ ἐν Βηθανίᾳ ἐν τῇ οἰκίᾳ Σίμωνος τοῦ λεπροῦ κατακειμένου αὐτοῦ ἦλθεν γυνὴ ἔχουσα ἀλάβαστρον μύρου νάρδου πιστικῆς πολυτελοῦς· ⸀συντρίψασα ⸀τὴν ἀλάβαστρον κατέχεεν ⸀αὐτοῦ τῆς κεφαλῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/003.yaml
  text: And while he was in Bethany[a], reclining at the house of Simon the leper, a woman came with an alabaster jar of very expensive pure nard perfume; she broke the jar and poured it on his head.
translation:
  language: zh_hans
  text: 耶稣在伯大尼麻风病人西门的家里坐席时，一个女人拿着一只盛有极贵重的纯哪哒香膏的雪花石膏瓶[a]来到。她打破那瓶，把香膏倒在耶稣头上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “纯”或译“真正的”；原文这个形容词（πιστικῆς）的确切含义有争议。
    reason: 保留疑难词πιστικῆς的合理词义选择及原文的不确定性。
lexical_decisions:
- source_word: ὄντος αὐτοῦ ... κατακειμένου αὐτοῦ
  choice: 耶稣……坐席的时候
  rationale: 属格独立结构交代叙事背景；κατάκειμαι在宴席语境中指斜倚用餐。译作“坐席”符合现代汉语表达，也保留用餐场景。
- source_word: Βηθανίᾳ
  choice: 伯大尼
  rationale: 采用现代中文圣经中通行的地名音译。
- source_word: οἰκίᾳ Σίμωνος τοῦ λεπροῦ
  choice: 麻风病人西门家里
  rationale: 原文直接以“麻风病人”称呼西门，并未说明他已痊愈；不擅自增添“从前患过”等推断。
- source_word: γυνὴ
  choice: 一个女人
  rationale: 马可在此没有交代其姓名或其他身份，按上下文作不定指表达。
- source_word: ἀλάβαστρον
  choice: 玉瓶
  rationale: 该词指盛香膏的细颈容器，传统中文常译“玉瓶”；此译简洁庄重，但不旨在断定其材质就是现代矿物学所称的玉。
- source_word: μύρου
  choice: 香膏
  rationale: μύρον指芳香的膏油或香料制品；“香膏”既传达香气，也符合当时膏油的形态与用途。
- source_word: νάρδου
  choice: 哪哒
  rationale: 保留这种芳香植物及其制品的具体名称，采用中文圣经通行音译，不将其泛化为普通香料。
- source_word: πιστικῆς
  choice: 纯
  rationale: πιστικός词义有争议；“纯”可表达真实、未经掺假的哪哒，但不确定性在脚注中保留。
- source_word: πολυτελοῦς
  choice: 极贵重
  rationale: 该词突出价值高昂；“极贵重”既自然，也为下文众人的反应提供叙事背景。
- source_word: συντρίψασα τὴν ἀλάβαστρον
  choice: 她打破玉瓶
  rationale: 分词表示先于倾倒发生的动作。“打破”忠实呈现容器被破开的动作，又不过度强化为“砸碎”。
- source_word: κατέχεεν αὐτοῦ τῆς κεφαλῆς
  choice: 把香膏浇在耶稣头上
  rationale: καταχέω表示倾倒在……之上。补出“香膏”和“耶稣”以避免现代汉语代词含混，不增加原文信息。
theological_decisions:
- issue: 是否把“麻风病人西门”弱化为“曾患麻风病的西门”
  choice: 保留“麻风病人西门”
  alternative: 曾患麻风病的西门
  rationale: 原文只给出“麻风病人”这一称谓，没有明说西门已经痊愈。虽然从宴席场景可以作出历史推测，译文不应把推测写成明示事实。
- issue: 是否明确πιστικῆς为“纯”还是“真正的”
  choice: 正文译“纯”，脚注说明“真正的”这一可能
  alternative: 真正的
  rationale: 该形容词的确切含义存在词汇争议。正文采用语境顺畅且常见的“纯”，同时以脚注保存另一种合理理解，不据此建立额外神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“坐席”表达当时斜倚用餐的情景，避免生硬直译；“麻风病人西门”则刻意保留原文张力。脚注标记紧接相关词组，便于读者识别其所解释的词汇。
