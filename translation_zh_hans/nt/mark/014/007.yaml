  text: πάντοτε γὰρ τοὺς πτωχοὺς ἔχετε μεθ’ ἑαυτῶν, καὶ ὅταν θέλητε δύνασθε ⸀αὐτοῖς εὖ ποιῆσαι, ἐμὲ δὲ οὐ πάντοτε ἔχετε·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/007.yaml
  text: For you always have the poor with you[a], and whenever you want, you are able to do good to them; but you do not always have me.
translation:
  language: zh_hans
  text: 因为你们身边总有穷人；你们什么时候愿意，都可以向他们行善[a]；但你们不总有我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译为“善待他们”。原文指采取有益于他们的行动，不只是心存善意。
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντοτε
  choice: 总
  rationale: 表达穷人持续在他们身边，并与后句“不总有我”形成清楚而自然的重复对照。
- source_word: γὰρ
  choice: 因为
  rationale: 承接上文并说明理由，保留原文的解释性连接。
- source_word: τοὺς πτωχούς
  choice: 穷人
  rationale: 直接指贫穷的人，不缩窄为某一种特定需要或受助群体。
- source_word: ἔχετε μεθ’ ἑαυτῶν
  choice: 你们身边……有
  rationale: 自然表达持续同在和可接触性，同时避免生硬直译“与你们自己同在”。
- source_word: ὅταν θέλητε
  choice: 随时愿意
  rationale: 体现ὅταν加虚拟式所表达的不定时间条件，也保留意愿因素。
- source_word: δύνασθε
  choice: 都可以
  rationale: 准确表达能力与机会，符合现代汉语习惯。
- source_word: αὐτοῖς εὖ ποιῆσαι
  choice: 帮助他们
  rationale: 在本语境中自然传达采取有益于他们的行动；脚注说明原文较宽泛的“向他们行善”，避免将意义限于某一种援助。
- source_word: ἐμὲ δὲ
  choice: 但……我
  rationale: 保留δέ所标示的鲜明对比。
- source_word: οὐ πάντοτε ἔχετε
  choice: 不总有
  rationale: 保留现在时形式和时间上的对照，不擅自改成将来时“不会一直有”。
theological_decisions:
- issue: 这句话可能被误解为耶稣轻视照顾穷人
  choice: 保留对穷人持续在场及随时可向他们行善的肯定，同时突出耶稣在当时情境中并非总与门徒同在。
  alternative: 将此理解为耶稣否定对穷人的关怀，以对他的敬奉取而代之。
  rationale: “随时愿意都可以帮助他们”明确肯定持续行善的机会；原文的重点是处境和时间上的对比，并未取消对穷人的责任。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“身边总有穷人”比“常有穷人与你们同在”更自然；分号保留两部分的紧密对照。
