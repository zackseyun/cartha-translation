source:
  edition: SBLGNT
  text: οἱ δὲ ἀκούσαντες ἐχάρησαν καὶ ἐπηγγείλαντο αὐτῷ ἀργύριον δοῦναι. καὶ ἐζήτει πῶς ⸂αὐτὸν εὐκαίρως παραδοῖ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/011.yaml
  text: When they heard it[a], they rejoiced and promised to give him money[b]. And he began seeking how he might betray him at an opportune time.
translation:
  language: zh_hans
  text: 他们听了这话，就很高兴，答应给他钱[a]。于是，他开始寻找合适的时机，好出卖他[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“银子”。希腊词既可指银，也可泛指钱财。
    reason: lexical_alternative
  - marker: b
    text: 或译“把他交出去”。希腊动词可指“交出”或“交给人”；这里按犹大暗中与耶稣的敌对者合作这一语境译为“出卖”。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἀκούσαντες
  choice: 他们听了这话
  rationale: 分词结构在此具有时间意味；补出“这话”承接上文犹大的提议，使现代汉语自然流畅。
- source_word: ἐχάρησαν
  choice: 就很高兴
  rationale: 表达听见提议后的喜悦反应；“很高兴”比“欢喜”更符合现代通用汉语，同时保留其带有道德张力的反应。
- source_word: ἐπηγγείλαντο αὐτῷ ἀργύριον δοῦναι
  choice: 答应给他钱
  rationale: ἐπαγγέλλομαι表示承诺、应许；ἀργύριον在这里自然指作为报酬的钱，并未说明数额或币种。
- source_word: ἀργύριον
  choice: 钱
  rationale: 该词本义可指银，也常泛指钱财；正文采用现代汉语中自然的“钱”，脚注保留“银子”这一可能译法。
- source_word: ἐζήτει
  choice: 开始寻找
  rationale: 未完成过去时表示持续进行的行动，也可带起始意味；结合叙事推进，“开始寻找”恰当地呈现协议达成后持续谋求机会的行动。
- source_word: πῶς … εὐκαίρως
  choice: 寻找合适的时机，好……
  rationale: 将“如何”与“在适当时机”合并为自然汉语表达，传达他谋求适宜方式和机会的意思，而不添加具体情节。
- source_word: παραδοῖ
  choice: 出卖
  rationale: παραδίδωμι本可指交出或移交；在犹大与耶稣敌对者合作的语境中，“出卖”准确传达其背叛性质，同时以脚注保留较中性的字面译法。
theological_decisions:
- issue: 如何翻译犹大行动中的 παραδίδωμι
  choice: 出卖
  alternative: 交出；交给人
  rationale: 此处并非中性的移交，而是犹大暗中与耶稣的敌对者合作。“出卖”反映叙事情境中的背叛意味，但脚注保留原词较宽的语义范围。
- issue: 末句两个代词所指
  choice: 正文保留“他”
  alternative: 明确写作“犹大……耶稣”
  rationale: 希腊文以代词表达，所指可由上下文确定。中文保留代词，避免把上下文说明直接写入本节原文，也保留原文的指代形式。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“听了这话”“很高兴”“合适的时机”符合当代普通读者的表达习惯；正文避免古奥措辞，也未补入本节未明说的金额、地点或具体交付对象。
