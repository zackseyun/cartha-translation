  text: ὁ δὲ πάλιν ἠρνεῖτο. καὶ μετὰ μικρὸν πάλιν οἱ παρεστῶτες ἔλεγον τῷ Πέτρῳ· Ἀληθῶς ἐξ αὐτῶν εἶ, καὶ γὰρ Γαλιλαῖος εἶ ⸂καὶ ἡ λαλιά σου ὁμοιάζει⸃·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/070.yaml
  text: But he again denied it[a]. And after a little while, those standing nearby again were saying to Peter, “Surely you are one of them, for you are also a Galilean[b], and your speech is similar.”
translation:
  language: zh_hans
  text: 可是彼得又不承认。过了一会儿，站在旁边的人又对彼得说：“你肯定是他们中的一个，因为你也是加利利人，而且你说话的方式[a]也和他们相像。”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你的口音”或“你说话的腔调”。希腊语 λαλιά 可指说话方式、方言特征或口音。
    reason: lexical_alternative
  - marker: b
    text: 有些抄本没有“而且你说话的方式也和他们相像”。
    reason: textual_variant
lexical_decisions:
- source_word: ἠρνεῖτο
  choice: 不承认
  rationale: 未完成时在上下文中可表达持续或再次作出的否认；配合 πάλιν 译为“又不承认”，自然呈现反复之意，同时不擅自补明所否认的具体内容。
- source_word: μετὰ μικρὸν
  choice: 过了一会儿
  rationale: 自然表达短暂的时间间隔，贴合该希腊语习语。
- source_word: οἱ παρεστῶτες
  choice: 站在旁边的人
  rationale: 保留分词所含“站在近旁”的空间意味，也符合现代汉语表达。
- source_word: ἔλεγον
  choice: 又对彼得说
  rationale: 汉语通常不以形态标示未完成体；语境中的再次指认已由“又”清楚表达，避免生硬译成“一直说”。
- source_word: Ἀληθῶς
  choice: 肯定
  rationale: 体现说话者确信无疑的断言语气，在现代汉语直接引语中自然有力。
- source_word: ἐξ αὐτῶν εἶ
  choice: 你是他们中的一个
  rationale: 准确表达彼得属于与耶稣相关的那群人，不额外引入组织性或贬义色彩。
- source_word: καὶ γὰρ
  choice: 因为你也
  rationale: “因为”表达 γάρ 的理由关系，“也”表达 καί 的附加意味。
- source_word: Γαλιλαῖος
  choice: 加利利人
  rationale: 该名词在此指来自加利利的人。
- source_word: ἡ λαλιά σου
  choice: 你说话的方式
  rationale: 保留 λαλιά 可涵盖说话方式、方言特征或口音的较宽语义范围，不武断限定为单纯的“口音”。
- source_word: ὁμοιάζει
  choice: 也很像
  rationale: 忠实表达“相像、相似”；比较对象在原文中同样未明说，因此汉语正文也保留这种省略。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“可是”承接前文并表达转折；首次出现主语时补出“彼得”，避免汉语中的指代含混。将词义脚注置于“说话的方式”之后，将抄本异文脚注置于相关整句之后，以确保标记与内容准确对应。
