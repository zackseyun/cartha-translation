  text: Καὶ ⸀εὐθὺς ἔτι αὐτοῦ λαλοῦντος παραγίνεται ⸀Ἰούδας ⸀εἷς τῶν δώδεκα καὶ μετ’ αὐτοῦ ⸀ὄχλος μετὰ μαχαιρῶν καὶ ξύλων παρὰ τῶν ἀρχιερέων καὶ τῶν γραμματέων καὶ τῶν πρεσβυτέρων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/043.yaml
  text: And immediately[a], while he was still speaking, Judas arrived, one of the Twelve, and with him a crowd with swords and clubs[d][c][b], from the chief priests and the scribes and the elders.
translation:
  language: zh_hans
  text: 他还在说话的时候，立刻，十二人之一的犹大来了；同他一起来的，还有一群带着刀和棍棒的人[a]。他们来自祭司长、文士和长老[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “棍棒”所译的希腊词字面意思是“木头”或“木制物”，这里指用作武器的木棍。
    reason: lexical_alternative
  - marker: b
    text: “来自”也可理解为“由……派来”；原文强调这群人与祭司长、文士和长老之间的来源或授权关系。
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθὺς
  choice: 立刻
  rationale: 保留马可叙事中突然而紧迫的时间推进，现代汉语自然简洁。
- source_word: ἔτι αὐτοῦ λαλοῦντος
  choice: 他还在说话的时候
  rationale: 准确表达属格独立结构所表示的同时动作，并以“还在”体现ἔτι。
- source_word: παραγίνεται
  choice: 来了
  rationale: 希腊文采用生动的历史现在时；汉语叙事无需强行标示时态，“来了”自然地表现人物来到现场。
- source_word: εἷς τῶν δώδεκα
  choice: 十二人之一
  rationale: 保留原文紧凑的群体称谓，不增添原文没有的“门徒”等解释。
- source_word: ὄχλος
  choice: 一群……人
  rationale: ὄχλος本义为人群；上下文已通过武器显出敌意，无须预先强化为“暴徒”。
- source_word: μετὰ μαχαιρῶν καὶ ξύλων
  choice: 带着刀剑和棍棒
  rationale: μάχαιρα可指剑或短刀，译为较宽泛的“刀剑”可保留词义范围；ξύλον字面为木材或木制物，此处指用作武器的棍棒。
- source_word: παρὰ τῶν ἀρχιερέων καὶ τῶν γραμματέων καὶ τῶν πρεσβυτέρων
  choice: 来自祭司长、经学家和长老
  rationale: παρά加属格表示来源，也可能含授权关系；“来自”直接保留这一点，不明确增译为“奉差遣”。
- source_word: ἀρχιερέων
  choice: 祭司长
  rationale: 此复数称谓指祭司阶层中的领袖，而非同时存在多位大祭司。
- source_word: γραμματέων
  choice: 经学家
  rationale: 此处指精通并讲授经律的犹太宗教专业人士；“经学家”比现代职业意义容易过强的“文士”更易懂，同时不扩写为“律法教师”。
- source_word: πρεσβυτέρων
  choice: 长老
  rationale: 保留当时犹太社会与宗教领导层的制度性称谓。
theological_decisions:
- issue: παραγίνεται的历史现在时
  choice: 译作“来了”
  alternative: 译作“来到了”或以现在式语感译为“来了”并加强现场感
  rationale: 现代汉语不按希腊语方式形态化区分过去与现在时；“来了”既自然，也保留人物突然出现的叙事效果。
- issue: παρά与宗教领袖之间的关系
  choice: 译作“来自祭司长、经学家和长老”
  alternative: 译作“是祭司长、经学家和长老派来的”
  rationale: 原文清楚指出人群的来源或权威关联，却没有明确陈述差遣的具体动作；正文保留较宽的表达，脚注说明可能的授权含义。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“十二人之一”保留原文简洁而沉重的身份提示；分为两句以避免汉语长句拖沓，同时不改变各成分的逻辑关系。
