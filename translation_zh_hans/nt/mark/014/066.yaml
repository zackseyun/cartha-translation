  yaml_path: translation/nt/mark/014/066.yaml
  text: And while Peter was below in the courtyard[a], one of the high priest’s servant girls came,
translation:
  language: zh_hans
  text: 彼得还在下面的院子里时，大祭司的一名女仆[a]来了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“女奴”。希腊词παιδίσκη可指家中的女性仆役或女奴；本文译作“女仆”，以表达她在大祭司家中的服役身份。
    reason: 词义存在合理替代译法，需要保留“女性仆役／女奴”的语义范围。
lexical_decisions:
- source_word: ὄντος τοῦ Πέτρου
  choice: 彼得正在……时
  rationale: 将属格独立结构自然地译为时间从句，并以“正在”保留现在分词所表达的持续背景。
- source_word: κάτω
  choice: 下面
  rationale: 表达较低的空间位置，也保留其与上方审讯场景可能形成的叙事对照。
- source_word: ἐν τῇ αὐλῇ
  choice: 在……院子里
  rationale: 此处指大祭司住所内的院落；“院子”是普通现代汉语中自然清楚的表达。
- source_word: ἔρχεται
  choice: 来了
  rationale: 希腊文使用历史现在时；汉语叙事中译为“来了”更自然，同时保持人物进入当前场景的动态感。
- source_word: μία τῶν παιδισκῶν
  choice: 一个使女
  rationale: παιδίσκη可指年轻的女性家仆或女奴。“使女”简洁、庄重，并能体现其从属的家内身份；其法律身份则留在脚注说明。
- source_word: τοῦ ἀρχιερέως
  choice: 大祭司的
  rationale: 该属格表示她隶属于或服务于大祭司的家中；汉语所有格结构自然且不作过度限定。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“彼得正在下面的院子里时”保留原文的场景背景；“来了”顺应现代汉语叙事习惯。
