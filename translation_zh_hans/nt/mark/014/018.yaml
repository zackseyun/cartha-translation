  text: καὶ ἀνακειμένων αὐτῶν καὶ ἐσθιόντων ⸂ὁ Ἰησοῦς εἶπεν⸃· Ἀμὴν λέγω ὑμῖν ὅτι εἷς ἐξ ὑμῶν παραδώσει με ὁ ἐσθίων μετ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/018.yaml
  text: And while they were reclining and eating[a], Jesus said, “Truly I tell you[c][b], one of you will betray me—one who is eating with me.”
translation:
  language: zh_hans
  text: 他们正斜倚着吃饭[c]的时候，耶稣说：“我实在告诉你们[a]，你们中有一个人要出卖我[b]，就是那正和我一起吃饭的人。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“阿们，我告诉你们。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“要把我交出去。”原文动词可指交出、交付；这里是耶稣的一名同伴以背信的方式把他交出去。
    reason: lexical_alternative
  - marker: c
    text: 当时正式用餐通常是斜倚在席间，而不是坐在桌旁。
    reason: cultural_note
lexical_decisions:
- source_word: ἀνακειμένων
  choice: 斜倚席间
  rationale: 该词指古代正式用餐时斜倚在席位上的姿势；译作“斜倚席间”既保留历史场景，也避免让现代读者误以为只是普通坐席。
- source_word: ἐσθιόντων / ἐσθίων
  choice: 吃饭／吃饭的人
  rationale: 动词基本义为“吃”。前一分词自然译作“吃饭的时候”，带冠词的后一分词译作“那正和我一起吃饭的人”，保留其限定作用。
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: 我实在告诉你们
  rationale: 这是耶稣郑重引出宣告的固定表达。“实在”自然传达Ἀμήν的确认和庄重语气；较直译形式收入脚注。
- source_word: εἷς ἐξ ὑμῶν
  choice: 你们中有一个人
  rationale: 自然、清楚地表达部分属整体的结构，即此人是听众群体中的一员。
- source_word: παραδώσει
  choice: 要出卖
  rationale: 该动词本义范围包括“交出、交付”；在亲近同席者将耶稣交给敌对者的语境中，“出卖”自然传达背信性质，同时在脚注保留较字面的译法。
- source_word: μετ’ ἐμοῦ
  choice: 和我一起
  rationale: 直接表达陪同和共同用餐，符合现代汉语习惯。
theological_decisions:
- issue: 受难叙事中παραδώσει的译法
  choice: 要出卖我
  alternative: 要把我交出去／要交付我
  rationale: 原词本身不必然表示背叛，但此处主语是与耶稣同席的亲近者，语境明显带有背信性质。“出卖”传达这一关系和道德张力，却不增添额外教义判断；脚注保留原词较宽的字面义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“斜倚席间”保留古代用餐姿势，并用文化脚注说明；主句语序流畅，同时保留末尾“和我一起吃饭的人”所强调的同席关系。所有脚注标记均置于相关正文之后。
