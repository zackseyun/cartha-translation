  yaml_path: translation/nt/mark/014/050.yaml
  text: And leaving him, they all fled.
translation:
  language: zh_hans
  text: 他们都撇下他逃走了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: 于是
  rationale: 在此承接前面的逮捕场景，并自然引出随即发生的行动；“于是”符合现代汉语叙事，同时不额外引入因果解释。
- source_word: ἀφέντες
  choice: 撇下
  rationale: ἀφίημι的过去时主动分词在这里表示把耶稣留在身后。汉语“撇下”既自然，又保留临危离去、任其独处的意味，但不像“抛弃”那样过度强化主观动机。
- source_word: αὐτὸν
  choice: 他
  rationale: 代词指向上下文中的耶稣；直译为“他”即可保持简洁清楚。
- source_word: ἔφυγον
  choice: 逃走了
  rationale: φεύγω表示面对危险而逃离。“逃走了”是现代汉语自然、庄重的叙事表达，并准确传达行动已经发生。
- source_word: πάντες
  choice: 都
  rationale: πάντες强调同行者无一例外。放在主语“他们”之后译作“都”，自然保留整体性的强调。
theological_decisions:
- issue: 门徒离弃耶稣的范围
  choice: 他们都……逃走了
  alternative: 他们全都逃走了
  rationale: 原文πάντες明确强调当时在场的同行者全部逃离。译文保留这一完整范围，不削弱其张力，也不把所指范围扩大到上下文以外。
- issue: ἀφέντες所表达的离弃程度
  choice: 撇下他
  alternative: 抛弃他
  rationale: “撇下”兼顾“留下”与“离弃”的语义，能呈现耶稣被独自留下的叙事和神学张力；“抛弃”更强，容易额外断定门徒的持久意图或最终关系。
translation_notes:
  register: 采用简洁、庄重而通顺的现代标准汉语。“于是”承接叙事，“撇下他逃走了”保留原文先离开、后逃走的动作关系；全句维持马可叙事的急促与凝练。
