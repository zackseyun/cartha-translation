  text: ⸀Καὶ Ἰούδας ⸂Ἰσκαριὼθ ὁ⸃ εἷς τῶν δώδεκα ἀπῆλθεν πρὸς τοὺς ἀρχιερεῖς ἵνα αὐτὸν ⸂παραδοῖ αὐτοῖς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/010.yaml
  text: And Judas Iscariot[a], one of the Twelve, went to the chief priests in order to hand him over to them.
translation:
  language: zh_hans
  text: 十二使徒中的一个加略人犹大，去见祭司长，要把耶稣交给他们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把耶稣出卖给他们。”希腊文这个动词可指“交出、交给”；在犹大的事例中，这种交付行为构成背叛。
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: （不单独译出）
  rationale: 希腊文以普通叙事连接词承接上文；中文直接起句更自然，事件承接关系仍由语境清楚表达。
- source_word: Ἰούδας Ἰσκαριὼθ
  choice: 加略人犹大
  rationale: 采用现代中文圣经语境中通行的人名和称号译法；“加略人”保留其称号性质。
- source_word: ὁ εἷς τῶν δώδεκα
  choice: 十二使徒中的一个
  rationale: 原文直指公认的“十二人”群体。中文补出“使徒”，使普通读者清楚所指，并保留犹大身为核心群体成员的叙事张力。
- source_word: ἀπῆλθεν πρὸς τοὺς ἀρχιερεῖς
  choice: 去见祭司长
  rationale: ἀπῆλθεν表示前去，πρός在此指向会见对象；“去见”是自然、准确的现代中文表达。复数ἀρχιερεῖς指耶路撒冷的祭司领袖群体，中文惯用集合称谓“祭司长”。
- source_word: ἵνα
  choice: 打算
  rationale: 表达目的意图，同时使中文句法流畅；不把后续行动误写成此刻已经完成。
- source_word: παραδοῖ
  choice: 交给
  rationale: 保留παραδίδωμι较宽的“交出、交给”义，不在正文中直接收窄为“出卖”，从而保存受难叙事中交付与背叛并存的张力。
- source_word: αὐτὸν ... αὐτοῖς
  choice: 把耶稣交给他们
  rationale: 原文作“把他交给他们”。中文将“他”明确为“耶稣”，避免连续人称所造成的指代歧义；“他们”回指祭司长。
theological_decisions:
- issue: 在犹大语境中如何翻译παραδοῖ
  choice: 把耶稣交给他们
  alternative: 把耶稣出卖给他们
  rationale: 该动词本义范围比“出卖”更广，在受难叙事中反复构成“被交出”的主题；犹大的行为确实是背叛，但正文采用“交给”可避免过早消除词义和神学张力，并以脚注说明背叛含义。
translation_notes:
  register: 采用自然、庄重、易懂的现代标准普通话。“十二使徒中的一个”突出其群体身份；“去见……打算……”清楚表达行动及目的。脚注标记置于整句末，覆盖“交给”这一词义选择。
