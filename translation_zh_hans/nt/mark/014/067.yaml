  text: καὶ ἰδοῦσα τὸν Πέτρον θερμαινόμενον ἐμβλέψασα αὐτῷ λέγει· Καὶ σὺ μετὰ τοῦ Ναζαρηνοῦ ⸂ἦσθα τοῦ Ἰησοῦ⸃·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/067.yaml
  text: And seeing Peter warming himself, she looked at him and says, “You also were with Jesus the Nazarene.”
translation:
  language: zh_hans
  text: 她看见彼得正在烤火，就定睛看着他，说：“你也是和拿撒勒人耶稣在一起的。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβλέψασα αὐτῷ
  choice: 定睛看着他
  rationale: 表达不只是一般的“看”，而是注目端详，符合女仆辨认彼得的语境。
- source_word: λέγει
  choice: 说
  rationale: 原文使用历史现在时；现代汉语叙事中直接译作“说”最自然，无须机械标示时态转换。
- source_word: τοῦ Ναζαρηνοῦ ... τοῦ Ἰησοῦ
  choice: 那个拿撒勒人耶稣
  rationale: 保留“拿撒勒人”对耶稣的地域称谓，并用现代汉语自然的同位结构表达。
- source_word: μετὰ
  choice: 跟……一起
  rationale: 准确表达彼得曾与耶稣同在、同行的关联，不额外限定为门徒身份。
- source_word: ἦσθα
  choice: 是……一起的
  rationale: 保留未完成过去时所指向的先前持续关联，以自然口语句式呈现。
theological_decisions:
- issue: 彼得与耶稣关系的表述
  choice: 跟那个拿撒勒人耶稣一起的
  alternative: 是那个拿撒勒人耶稣的同党
  rationale: 原文只说彼得“与”耶稣同在，并未使用带贬义或政治意味的“同党”；译文不强化指控性质。
- issue: 拿撒勒称谓的语气
  choice: 拿撒勒人
  alternative: 拿撒勒的耶稣
  rationale: Ναζαρηνός是对人的地域称谓；“拿撒勒人”较直接地保存这一形式，而不赋予额外神学含义。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。女仆的话保留现场质问的口语感；叙述简洁，并以“定睛看着”体现原文观察和辨认的力度。
