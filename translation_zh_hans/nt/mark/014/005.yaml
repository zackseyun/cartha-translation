base_translation:
  language: en
  yaml_path: translation/nt/mark/014/005.yaml
  text: For this perfume could have been sold for more than three hundred denarii and given to the poor.” And they scolded her[a][b].
translation:
  language: zh_hans
  text: 因为这香膏[a]本来可以卖到超过三百个第纳尔银币，把钱给穷人。”他们就严厉地责备她。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “香膏”也可译作“香油”。
    reason: lexical_alternative
  - marker: b
    text: “严厉地责备”所译的希腊语含有强烈不满、严词斥责之意；也可译作“严厉斥责她”。
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: 因为
  rationale: 承接上文的抱怨，说明他们认为这是浪费的理由；现代汉语用“因为”自然清楚。
- source_word: τοῦτο τὸ μύρον
  choice: 这香膏
  rationale: μύρον指带香气的膏油或香油；“香膏”符合本段语境，也保留其物质形态，不仅表达抽象的香味。
- source_word: ἠδύνατο ... πραθῆναι
  choice: 本可以卖
  rationale: 表达过去未实现的可能性；汉语“本可以”准确体现其反事实意味，被动形式则可自然转为主动表达。
- source_word: ἐπάνω δηναρίων τριακοσίων
  choice: 三百多个银币
  rationale: ἐπάνω加金额表示超过该数目；“三百多个”自然表达“超过三百”。δηνάριον是古罗马银币，以“银币”保持历史货币性质并便于普通读者理解。
- source_word: καὶ δοθῆναι τοῖς πτωχοῖς
  choice: 把钱给穷人
  rationale: 语义上所给的是出售香膏所得的钱，而非香膏本身；将隐含宾语明示为“钱”，符合现代汉语习惯。
- source_word: καὶ ἐνεβριμῶντο αὐτῇ
  choice: 他们就严厉责备她
  rationale: ἐμβριμάομαι在此表达针对她的强烈不满和严厉斥责；“严厉责备”既保留力度，也自然庄重。
