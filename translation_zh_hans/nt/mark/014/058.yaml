  text: ὅτι Ἡμεῖς ἠκούσαμεν αὐτοῦ λέγοντος ὅτι Ἐγὼ καταλύσω τὸν ναὸν τοῦτον τὸν χειροποίητον καὶ διὰ τριῶν ἡμερῶν ἄλλον ἀχειροποίητον οἰκοδομήσω·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/058.yaml
  text: that[a], ‘We heard him saying, “I will destroy this temple made with hands[b], and in three days I will build another not made with hands.”’
translation:
  language: zh_hans
  text: 说：“我们听见他说：‘我要拆毁这座人手所造的圣殿，三天之内，我要另建一座不是人手所造的。’”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “三天之内”也可译作“三天内”或“三天工夫”。原文自然地表示这事会在三天这一时段内发生，并非通常表达“三天以后”的说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: 说
  rationale: 此处引出证词的内容；汉语用“说”承接上文比直译为“即”或“因为”自然，且不把它误作原因从句。
- source_word: Ἡμεῖς
  choice: 我们
  rationale: 保留显式代词，体现作证者自我强调的语气。
- source_word: ἠκούσαμεν αὐτοῦ λέγοντος
  choice: 我们听见他说
  rationale: 自然表达感知动词与分词结构，既保留“听见”的直接性，也符合现代汉语习惯。
- source_word: καταλύσω
  choice: 我要拆毁
  rationale: 用于建筑物时指拆除、毁坏；“拆毁”比笼统的“毁灭”更切合圣殿这一建筑语境。
- source_word: τὸν ναὸν τοῦτον
  choice: 这座……圣殿
  rationale: 保留指示词“这座”；ναός在此可指圣所或圣殿建筑，译作“圣殿”最自然，也不额外限定其范围。
- source_word: χειροποίητον
  choice: 人手所造的
  rationale: 以直观而庄重的表达保留与ἀχειροποίητον的形式及意义对照。
- source_word: διὰ τριῶν ἡμερῶν
  choice: 三天之内
  rationale: διά加属格的时间表达着重行动发生所跨越或限定的时段；“三天之内”自然保留这一时间范围，避免径直释作“三天以后”。
- source_word: ἄλλον
  choice: 另……一座
  rationale: 体现ἄλλος所指的另一座，保留第一座与第二座之间的区别。
- source_word: ἀχειροποίητον
  choice: 不是人手所造的
  rationale: 与“人手所造的”形成明确平行，不解释为“属神的”等神学性释义。
- source_word: οἰκοδομήσω
  choice: 我要……建
  rationale: 按原词译作“建”，不擅自扩充为“重建”。
theological_decisions:
- issue: 这句话是敌对证人的指控，还是叙述者认可的耶稣原话
  choice: 仅按引语层次呈现证人声称听见的话，不加解释
  alternative: 在正文中明说这是歪曲或虚假引述
  rationale: 本节报告的是证人的证词；译文应保持叙事距离，不从其他经文引入协调性判断。
- issue: “人手所造”与“不是人手所造”的神学含义
  choice: 保留原文的措辞对照
  alternative: 解释为“人为的”与“神所造的”
  rationale: 原文的对照可能具有神学意蕴，却未在本句中明说具体所指；直译可保留其张力与开放性。
- issue: διὰ τριῶν ἡμερῶν的时间关系
  choice: 三天之内
  alternative: 三天以后；第三天
  rationale: 原表达最自然地表示在三天这一时段内发生，不应改写成原文未明确表达的起算后时间点。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“拆毁”贴合建筑语境；“人手所造的／不是人手所造的”保持原文醒目的平行对照。脚注标记置于完整引语之后，所说明的“三天之内”已出现在正文中。
