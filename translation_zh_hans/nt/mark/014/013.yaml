  text: καὶ ἀποστέλλει δύο τῶν μαθητῶν αὐτοῦ καὶ λέγει αὐτοῖς· Ὑπάγετε εἰς τὴν πόλιν, καὶ ἀπαντήσει ὑμῖν ἄνθρωπος κεράμιον ὕδατος βαστάζων· ἀκολουθήσατε αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/013.yaml
  text: And he sends two of his disciples and says to them[a], “Go into the city, and a man carrying a jar of water will meet you. Follow him,”
translation:
  language: zh_hans
  text: 他差遣自己的两个门徒，对他们说：“你们进城去；会有一个提着一罐水[a]的男子遇见你们；跟着他。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一罐水”也可译作“一个陶制水罐”。
    reason: 原文κεράμιον可指陶制的罐或水罐；正文采用自然的概括表达，脚注保留材质与器皿含义的可能性。
lexical_decisions:
- source_word: ἀποστέλλει
  choice: 差遣
  rationale: 既表达受命派出的含义，也保留马可叙事中较庄重的行动色彩；汉语动词本身不标时态，无须强加过去时或现在时。
- source_word: δύο τῶν μαθητῶν αὐτοῦ
  choice: 两个门徒
  rationale: 自然表达部分结构；上下文已明确门徒属于他，因此汉语不必重复“他的”。
- source_word: λέγει αὐτοῖς
  choice: 对他们说
  rationale: 符合现代汉语引出直接引语的习惯，同时准确表达间接宾语。
- source_word: Ὑπάγετε εἰς τὴν πόλιν
  choice: 你们进城去
  rationale: “进城去”自然体现εἰς所表示的向城内移动，并保留复数命令的对象。
- source_word: ἀπαντήσει ὑμῖν
  choice: 迎面而来
  rationale: 在此场景中自然表达那人将与两名门徒相遇；配合“会有”清楚保留未来指向。
- source_word: ἄνθρωπος
  choice: 一个人
  rationale: 上下文指一个具体的人；现代汉语“一个人”自然且不需额外强化性别，后文代词“他”与原文阳性指称一致。
- source_word: κεράμιον ὕδατος
  choice: 一罐水
  rationale: 简洁自然地表达盛水的罐；器皿可能为陶制这一词义信息保留在脚注中。
- source_word: βαστάζων
  choice: 提着
  rationale: 符合汉语对手持水罐动作的常用说法，并保留分词所描写的持续动作。
- source_word: ἀκολουθήσατε αὐτῷ
  choice: 你们要跟着他
  rationale: 清楚传达直接命令；“跟着”比抽象的“跟随”更贴合此处实际尾随带路者的场景。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。汉语不以动词形态标示时态，因此不刻意模拟希腊文的历史现在时；通过连贯的动作叙述保留其现场感。脚注标记紧接其所说明的“一罐水”。
