  yaml_path: translation/nt/mark/014/020.yaml
  text: And he said to them[a], “One of the twelve, the one dipping with me into the bowl.”
translation:
  language: zh_hans
  text: 他对他们说：“是十二人中的一个，就是同我一起蘸进碗[a]里的那个人。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“盘子。”希腊语“τρύβλιον”可指吃饭时使用的碗或盘子。
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: （不单独译出）
  rationale: 此处是轻微的叙事连接词；汉语承接上文时无需机械译成“然后”或“但”，省译更自然，也不造成强烈转折。
- source_word: εἶπεν αὐτοῖς
  choice: 他对他们说
  rationale: 直接对应说话动词及其受事，保留直引语的引入方式。
- source_word: Εἷς τῶν δώδεκα
  choice: 十二人中的一个
  rationale: 明确指出出卖者属于耶稣身边的十二人，同时避免额外添加称号性的解释。
- source_word: ὁ ἐμβαπτόμενος
  choice: 就是……蘸……的那个人
  rationale: 定冠词加现在分词具有识别、指明的作用；“那个人”自然体现这一作用，“蘸”保留动作正在发生的语境感。
- source_word: μετ’ ἐμοῦ
  choice: 同我
  rationale: 准确表达 μετά 加属格所表示的伴随关系，语体简洁庄重。
- source_word: εἰς τὸ τρύβλιον
  choice: 蘸进碗里
  rationale: “进……里”体现 εἰς 的方向性；τρύβλιον 指餐桌上盛食物的碗或盘，此处正文选用现代汉语中自然的“碗”。
