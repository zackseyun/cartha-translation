  text: ὁ δὲ Ἰησοῦς εἶπεν· Ἐγώ εἰμι, καὶ ὄψεσθε τὸν υἱὸν τοῦ ἀνθρώπου ἐκ δεξιῶν καθήμενον τῆς δυνάμεως καὶ ἐρχόμενον μετὰ τῶν νεφελῶν τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/062.yaml
  text: And Jesus said[a], “I am[c][b], and you will see the Son of Man seated at the right hand of Power and coming with the clouds of heaven.”
translation:
  language: zh_hans
  text: 耶稣说：“我是[a]。你们将要看见人子坐在那位大能者的右边[b]，并同着天上的云而来[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我就是。”希腊文直译为“我是”，没有明说表语。
    reason: alternative_reading
  - marker: b
    text: “那位大能者”是对上帝的敬称。
    reason: cultural_note
  - marker: c
    text: 这里的话与《诗篇》110:1和《但以理书》7:13相呼应。
    reason: cross_reference
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: 我是
  rationale: 希腊文是带强调意味而没有明说表语的“我是”。中文“我是”既能直接回答大祭司先前的问题，也保留原文未补足表语所形成的庄严意味与潜在张力。
- source_word: ὄψεσθε
  choice: 你们将要看见
  rationale: 直译其将来时意义，并保留耶稣向在场审问者所说的复数“你们”。
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: 人子
  rationale: 保留耶稣惯用的自称及其与《但以理书》第7章的联系，避免改写成较为解释性的称谓。
- source_word: ἐκ δεξιῶν
  choice: 在……的右边
  rationale: 自然表达尊荣与权柄的位置，也保留《诗篇》110篇的典故。
- source_word: τῆς δυνάμεως
  choice: 那权能者
  rationale: 此处“权能”是敬称上帝的委婉说法。译作“那权能者”在现代中文中比“权能的右边”自然，同时不直接以“上帝”替换原文的敬称。
- source_word: καθήμενον
  choice: 坐
  rationale: 简洁保留分词所描绘的就座、掌权形象；上下文中的右边尊位使其登基意味自然显明。
- source_word: ἐρχόμενον
  choice: 而来
  rationale: 保留其动态与末世性意味，并与《但以理书》7:13的措辞相呼应。
- source_word: μετὰ τῶν νεφελῶν τοῦ οὐρανοῦ
  choice: 随着天上的云
  rationale: 贴近“与天云同来”的原意，既不额外加入“驾着”，也保留异象性的庄严语域。
- source_word: καὶ ... καὶ
  choice: 并……而……
  rationale: 用自然中文连接坐在尊位与随着天云而来这两个并列图景，保留原文累加的力量。
theological_decisions:
- issue: Ἐγώ εἰμι应译作单纯肯定，还是补出身份表语
  choice: 正文译作“我是”
  alternative: “我就是”或“我就是那一位”
  rationale: 原文没有明说表语。“我是”既是对问题的肯定回答，也没有把可能的神学回响限定为某一种解释。
- issue: 是否直接把τῆς δυνάμεως译作“上帝”
  choice: 保留委婉敬称，译作“那权能者”
  alternative: “上帝”或“全能者”
  rationale: 原文有意使用“权能”作为对上帝的敬称。保留这一表达可呈现审讯场景中的敬畏语气，并避免以解释取代原文。
- issue: 如何呈现诗篇110:1与但以理书7:13的复合典故
  choice: 正文保留“坐在……右边”和“随着天上的云而来”的图景，并以脚注指出出处
  alternative: 在正文中解释为登基掌权和末后的降临
  rationale: 原文以经文意象表达其宣告；保留意象可让读者直接面对其神学张力，而不在正文中先行释义。
translation_notes:
  register: 采用现代、庄重而可朗读的标准普通话。“我是”刻意保留原文的简短与未补足感；“那权能者”既维持敬称，也比生硬的抽象表达更符合中文习惯。句子以“并”连接两个异象性图景，保持审判场景中宣告式的力度。
