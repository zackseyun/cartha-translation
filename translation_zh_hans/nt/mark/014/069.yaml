  text: καὶ ἡ παιδίσκη ἰδοῦσα αὐτὸν ⸂ἤρξατο πάλιν⸃ λέγειν τοῖς ⸀παρεστῶσιν ὅτι Οὗτος ἐξ αὐτῶν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/069.yaml
  text: And the servant girl[a], seeing him, began again to say to those standing nearby, “This man is one of them.”
translation:
  language: zh_hans
  text: 那女仆[a]看见他，又开始对站在旁边的人[b]说：“这个人是他们中的一个。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “女仆”也可译作“女奴”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“在场的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδίσκη
  choice: 女仆
  rationale: 该词指年轻的女性仆役，也可能特指女奴。“女仆”是现代汉语中自然、清楚的表达；以脚注保留其身份可能是女奴的含义。
- source_word: ἰδοῦσα αὐτόν
  choice: 看见他
  rationale: 将不定过去时分词按汉语叙事习惯译为连续动作，既自然，也表明看见他是随后说话的契机。
- source_word: ἤρξατο πάλιν λέγειν
  choice: 就又开始……说
  rationale: 同时保留ἤρξατο的起始意味和πάλιν的“又、再次”之意，并采用自然的汉语语序。
- source_word: τοῖς παρεστῶσιν
  choice: 对站在旁边的人
  rationale: 保留分词所含的在场、站在近旁之意；脚注给出较概括的“在场的人”。
- source_word: Οὗτος
  choice: 这个人
  rationale: 指向彼得；汉语在指认人的语境中用“这个人”比直译为“这个”更自然，且不额外加入轻蔑语气。
- source_word: ἐξ αὐτῶν
  choice: 是他们一伙的
  rationale: 这是表示属于某一群体的习语。“他们一伙的”准确传达群体归属，也符合当时带有指认意味的口语场景。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“女仆”避免“使女”的旧式色彩；“他们一伙的”自然呈现群体归属，同时不增添原文没有明说的神学解释。
