  text: ὁ δὲ ἐσιώπα καὶ ⸂οὐκ ἀπεκρίνατο οὐδέν⸃. πάλιν ὁ ἀρχιερεὺς ἐπηρώτα αὐτὸν καὶ λέγει αὐτῷ· Σὺ εἶ ὁ χριστὸς ὁ υἱὸς τοῦ εὐλογητοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/061.yaml
  text: But he kept silent and answered nothing[a]. Again the high priest questioned him and says to him, “Are you the Messiah[b], the Son of the Blessed One?”
translation:
  language: zh_hans
  text: 他却一直沉默，什么也不回答。大祭司又问他，说：“你是弥赛亚[a]，那位当受颂赞者的儿子吗？[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“基督”。希腊语Χριστός（Christos）在这里是犹太弥赛亚语境中的称号，因此正文译作“弥赛亚”。
    reason: alternative_rendering
  - marker: b
    text: “那位当受颂赞者”是犹太人对上帝的敬称和委婉说法。
    reason: cultural_note
lexical_decisions:
- source_word: ἐσιώπα
  choice: 一直沉默
  rationale: 未完成时表达持续状态；“一直沉默”以自然的现代汉语体现耶稣持续不作声。
- source_word: ἀπεκρίνατο οὐδέν
  choice: 什么也不回答
  rationale: 保留οὐδέν所表达的完全否定，同时符合现代汉语习惯。
- source_word: πάλιν
  choice: 又
  rationale: 简洁自然地标明大祭司再次发问。
- source_word: ἀρχιερεὺς
  choice: 大祭司
  rationale: 这是该犹太祭司职分在中文圣经及一般宗教历史语境中的准确通称。
- source_word: ἐπηρώτα
  choice: 问
  rationale: 在“大祭司又问他”的审讯语境中，“问”自然且不过度强化；上下文本身已显明这是正式盘问。
- source_word: λέγει αὐτῷ
  choice: 说
  rationale: 保留原文在“问”之后另用言说动词引出直接引语的结构；汉语动词不标时态，也不会抹去马可叙事现在时的语义内容。
- source_word: χριστός
  choice: 弥赛亚
  rationale: 此处是犹太审讯语境中的称号，译作“弥赛亚”比名称化的“基督”更直接呈现受膏君王的期待。
- source_word: ὁ υἱὸς τοῦ εὐλογητοῦ
  choice: 那位当受颂赞者的儿子
  rationale: 保留对上帝的敬称和委婉指称，不直接用“上帝”取代原文，也用“那位”使这一称谓在现代汉语中清楚自然。
theological_decisions:
- issue: χριστός作为直接的弥赛亚称号如何翻译
  choice: 弥赛亚
  alternative: 基督
  rationale: 大祭司的问题处于犹太弥赛亚期待和审讯背景中；“弥赛亚”保留称号功能，而脚注注明传统译法，以免遮蔽两者对应关系。
- issue: τοῦ εὐλογητοῦ如何翻译
  choice: 那位当受颂赞者
  alternative: 上帝
  rationale: 原文以敬虔的委婉称谓指上帝。正文保留这种间接表达，避免把原文没有明说的名称直接写入；脚注说明其文化含义。
- issue: “弥赛亚”与“那位当受颂赞者的儿子”之间的关系
  choice: 保留并列称号，不添加解释性连接词
  alternative: 将后者解释为前者的定义或同义改写
  rationale: 希腊文保留两个带定冠词的称谓之间可能具有同位关系的表达张力；中文用逗号并列，不进一步判定其逻辑范围。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“一直沉默”表达未完成时的持续意味；“什么也不回答”避免文言化。“那位当受颂赞者”略带敬语色彩，以保留原文犹太宗教语境中的委婉称呼。脚注标记依实际内容置于“弥赛亚”和完整问句之后，并纠正咨询层中正文标记与脚注内容错位的问题。
