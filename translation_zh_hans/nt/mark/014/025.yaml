  text: ἀμὴν λέγω ὑμῖν ὅτι οὐκέτι οὐ μὴ πίω ἐκ τοῦ γενήματος τῆς ἀμπέλου ἕως τῆς ἡμέρας ἐκείνης ὅταν αὐτὸ πίνω καινὸν ἐν τῇ βασιλείᾳ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/025.yaml
  text: Truly I tell you[c][b][a], I will certainly not drink again from the fruit of the vine until that day when I drink it new in the kingdom of God.
translation:
  language: zh_hans
  text: 我实在告诉你们：我绝不会再喝[a]葡萄树果实所出的饮品[b]，直到那一天，我在上帝的国里喝新的葡萄树果实所出的饮品[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我再也不会喝。”希腊文在这里用了强烈的否定形式。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“葡萄树的果实（或产物）”。这里指席间饮用的、由葡萄树果实所出的饮品；原文没有直接说“酒”或“葡萄汁”。
    reason: lexical_alternative
  - marker: c
    text: 或译：“重新喝。”原文的形容词可表示“新的”，也可能暗示末后时代的更新。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν λέγω ὑμῖν
  choice: 我实在告诉你们
  rationale: 用自然、庄重的现代汉语表达郑重宣告公式；“实在”传达ἀμήν的确认和强调作用。
- source_word: οὐκέτι οὐ μὴ πίω
  choice: 我绝不会再喝
  rationale: “再”表达οὐκέτι的“不再”，而“绝不会”保留οὐ μή加虚拟语气所形成的强烈将来否定。
- source_word: ἐκ τοῦ γενήματος τῆς ἀμπέλου
  choice: 喝葡萄树的果实
  rationale: 保留原文“葡萄树的果实/产物”这一表达，不直接解释为“酒”；汉语中的“喝”表明这里所指的是由葡萄树果实所得、席间饮用之物。
- source_word: ἕως τῆς ἡμέρας ἐκείνης
  choice: 直到那一天
  rationale: 直接保留时间界限和指示词“那”。
- source_word: ὅταν αὐτὸ πίνω
  choice: 我……喝
  rationale: 在汉语中承接前述饮用之物而省略重复宾语，使句子自然；ὅταν后的现在时虚拟语气在这里指向将来的那一日。
- source_word: καινὸν
  choice: 喝新的
  rationale: 用名词省略结构保留“新的”这一直接含义，使它既可指性质上的新，也不排除“重新喝”的语感，不把原文的末世性含义限定得过窄。
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: 在上帝的国里
  rationale: 保留新约中“上帝的国”这一完整表达及其神学分量。
theological_decisions:
- issue: καινὸν在末句中的含义
  choice: 译作“新的”，不明确限定为性质上的新或“重新、再一次”
  alternative: 重新喝；喝全新的葡萄树果实
  rationale: καινός可强调性质或类别上的新，也可能在此语境中带有在上帝国度里重新饮用的意味；原文未解释这种“新”的具体方式，因此正文保留张力。
- issue: “葡萄树的果实”具体指什么
  choice: 保留原文表达“葡萄树的果实”
  alternative: 葡萄酒；葡萄汁
  rationale: 上下文表明这是席间杯中所饮之物，但原文没有在此直接使用“酒”或“汁”一词；不作进一步具体化可避免超出原文。
- issue: 否定语气的强度
  choice: 译作“绝不会再喝”
  alternative: 不再喝；永远不再喝
  rationale: οὐ μή构成强烈否定，但“直到那一天”又给出明确的时间界限；“绝不会再喝”保留强调，同时不把它误解为毫无限定的永久否定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“葡萄树的果实”和“喝新的”略保留原文表达的陌生感，以免把饮品种类及“新”的具体含义解释得过度明确；相关歧义由脚注说明。
