  yaml_path: translation/nt/mark/015/005.yaml
  text: But Jesus no longer answered anything[a], so that Pilate was amazed.
translation:
  language: zh_hans
  text: 但耶稣不再作任何回答，以致彼拉多感到惊讶。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: 但
  rationale: 承接上文并表达轻微转折，突出耶稣面对指控时不再作答。
- source_word: οὐκέτι
  choice: 不再
  rationale: 保留时间上的终止含义，表明此前曾有回答，而此时停止回答。
- source_word: οὐδὲν
  choice: 什么
  rationale: 与否定词“不”搭配成现代汉语自然表达“不回答什么”，同时保留完全沉默的含义。
- source_word: ἀπεκρίθη
  choice: 回答
  rationale: 符合审讯和问答语境，用词直接、庄重。
- source_word: ὥστε
  choice: 以致
  rationale: 明确表达结果关系：耶稣的沉默导致彼拉多惊讶。
- source_word: θαυμάζειν
  choice: 感到惊讶
  rationale: 自然传达彼拉多因耶稣沉默而产生的反应，不过度强化为赞叹或钦佩。
- source_word: Πιλᾶτον
  choice: 彼拉多
  rationale: 采用现代中文圣经中通行的人名音译。
