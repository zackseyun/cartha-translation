  yaml_path: translation/nt/mark/015/006.yaml
  text: At the feast he would release for them one prisoner whom they asked for[a].
translation:
  language: zh_hans
  text: 每逢节期，他都会照他们所求，给他们释放一名囚犯。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “照他们所求”直译为“他们所求的［那一名囚犯］”；也可译为“按他们所请求的”。
    reason: 说明关系从句直接修饰“囚犯”的原文结构，同时提供自然的中文表达，不把请求内容额外限定为“请求释放”。
lexical_decisions:
- source_word: Κατὰ δὲ ἑορτὴν
  choice: 每逢节期
  rationale: κατά加宾格表示时间；结合后文未完成时所表达的惯常行为，译为“每逢节期”自然地呈现这一惯例。δέ仅作轻微衔接，不必在中文中另译。
- source_word: ἀπέλυεν
  choice: 都会……释放
  rationale: 未完成时在此表示过去反复发生的惯常行为；“都会”比单纯的“释放了”更准确。
- source_word: αὐτοῖς
  choice: 给他们
  rationale: 与格表示释放囚犯是为他们而做；“给他们释放”符合现代汉语表达。
- source_word: ἕνα δέσμιον
  choice: 一个……囚犯
  rationale: 保留ἕνα明确的数量“一”；δέσμιος在审判和拘押语境中译为“囚犯”最贴切。
- source_word: ὃν παρῃτοῦντο
  choice: 他们所求的
  rationale: παραιτέομαι在此意为请求、求取；“所求的”简洁自然，并保留关系从句直接修饰囚犯的结构。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“他”保留原文未明说姓名的第三人称主语；“每逢”和“都会”共同清楚表达惯常做法，且不增添原文没有的制度说明。
