  text: 他们却又喊道：“把他钉在十字架上！”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ
  choice: 众人
  rationale: 定冠词在这里作名词用，指上文正在回应彼拉多的那群人。汉语用“众人”既明确所指，又不额外限定为某一特定群体。
- source_word: δὲ
  choice: 却
  rationale: δέ在这里表示轻微转折，承接彼拉多先前的话；“却”自然地体现回应中的对立意味，又不过分强化。
- source_word: πάλιν
  choice: 又
  rationale: πάλιν表示动作再次发生；“又”简洁自然，保留了重复呼喊的叙事重点。
- source_word: ἔκραξαν
  choice: 喊道
  rationale: κράζω指大声呼喊；“喊道”在现代汉语叙事中自然，并保留声音强烈、公开呼喊的意味。
- source_word: Σταύρωσον
  choice: 把他钉十字架
  rationale: 这是第二人称单数的主动命令式，直接对彼拉多发出命令。“把他钉十字架”保留直接命令的力度，也符合现代汉语表达。
- source_word: αὐτόν
  choice: 他
  rationale: 直接宾语代词，指耶稣；译作“他”准确简明。
