  text: Ἦσαν δὲ καὶ γυναῖκες ἀπὸ μακρόθεν θεωροῦσαι, ἐν ⸀αἷς καὶ ⸀Μαρία ἡ Μαγδαληνὴ καὶ Μαρία ⸀ἡ Ἰακώβου τοῦ μικροῦ καὶ ⸀Ἰωσῆτος μήτηρ καὶ Σαλώμη,
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/040.yaml
  text: There were also women watching from a distance[a], among whom were Mary Magdalene, Mary the mother of James the younger and of Joses, and Salome[c][b],
translation:
  language: zh_hans
  text: 还有妇女从远处[a]观看，其中有抹大拉的马利亚、小雅各[b]和约西[c]的母亲马利亚，以及撒罗米。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“远远地”。
    reason: lexical_alternative
  - marker: b
    text: “小雅各”中的“小”也可理解为“年幼的”或“身量较小的”；原文没有说明具体所指。
    reason: lexical_alternative
  - marker: c
    text: 原文这里的人名是“约西”，其形式与“约瑟”不同。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦσαν δὲ καὶ γυναῖκες
  choice: 也有一些妇女
  rationale: 以自然的汉语叙事表达未完成时及δέ、καί的承接和增补作用；“一些”使存在句更通顺，但不限定人数。
- source_word: ἀπὸ μακρόθεν
  choice: 从远处
  rationale: 准确表达空间上的距离，简洁自然；也可译作“远远地”。
- source_word: θεωροῦσαι
  choice: 观看
  rationale: 表达持续注视现场的动作，比单纯“看见”更符合现在分词的语义。
- source_word: ἐν αἷς
  choice: 其中有
  rationale: 说明随后列名的妇女属于前述群体，符合现代汉语表达。
- source_word: Μαρία ἡ Μαγδαληνή
  choice: 抹大拉的马利亚
  rationale: 采用现代中文圣经中清楚而通行的地名式称呼，反映定冠词所带出的识别性别称。
- source_word: Μαρία ἡ Ἰακώβου τοῦ μικροῦ καὶ Ἰωσῆτος μήτηρ
  choice: 雅各（那较小的）和约西的母亲马利亚
  rationale: 保留μήτηρ同时支配两个属格的关系，并将τοῦ μικροῦ明确附于雅各；括注式表达保留其作为辨识称号的功能及语义开放性。
- source_word: Ἰακώβου
  choice: 雅各
  rationale: 采用该新约人名在现代中文中的通行译名。
- source_word: τοῦ μικροῦ
  choice: 那较小的
  rationale: μικρός可涉及年龄、身量或地位；“较小的”保留比较性和歧义，不武断定为“年幼的”。
- source_word: Ἰωσῆτος
  choice: 约西
  rationale: 音译此处独特的希腊名字形式，不与“约瑟”混同。
- source_word: Σαλώμη
  choice: 撒罗米
  rationale: 采用该人名通行且易辨认的中文音译。
theological_decisions:
- issue: τοῦ μικροῦ作为雅各的辨识称号，其具体所指不明
  choice: 译作“那较小的”，不判定是年龄、身量还是地位
  alternative: “小雅各”“年幼的雅各”“次要的雅各”
  rationale: 原文只使用比较性描述而未说明比较维度；保留开放性可避免把传统理解或推测写入正文。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。正文保留人物关系和原文称号的歧义；用“观看”呈现持续注视，用“从远处”自然表达空间距离。所有脚注标记均置于相关正文成分之后。
