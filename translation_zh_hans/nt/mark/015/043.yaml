source:
  edition: SBLGNT
  text: ⸀ἐλθὼν Ἰωσὴφ ⸀ὁ ἀπὸ Ἁριμαθαίας εὐσχήμων βουλευτής, ὃς καὶ αὐτὸς ἦν προσδεχόμενος τὴν βασιλείαν τοῦ θεοῦ, τολμήσας εἰσῆλθεν πρὸς ⸀τὸν Πιλᾶτον καὶ ᾐτήσατο τὸ σῶμα τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/043.yaml
  text: Joseph of Arimathea[a], a respected council member who was himself also waiting for the kingdom of God[d][c][b], boldly went in to Pilate and asked for the body of Jesus.
translation:
  language: zh_hans
  text: 一位来自亚利马太、颇有声望的议会成员[a]约瑟，自己也一直等候着神的国；他鼓起勇气[b]，来到彼拉多那里，请求把耶稣的身体交给他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “颇有声望的”也可译作“受人尊敬的”或“身份显要的”。
    reason: lexical_alternative
  - marker: b
    text: 原文也可较直译为“他敢于进去见彼拉多”，着重表现约瑟采取这一行动的勇气。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: 来了
  rationale: 保留先于主要动作的“来到”之意；另起一句可避免与后面的“进去”形成累赘，同时自然引出约瑟。
- source_word: ὁ ἀπὸ Ἁριμαθαίας
  choice: 来自亚利马太的
  rationale: 直接表达ἀπό所指的来源，也符合现代汉语介绍人物籍贯或来处的习惯。
- source_word: εὐσχήμων
  choice: 有声望的
  rationale: 兼顾此词所表达的社会地位与受人敬重之意，语体庄重而不古奥。
- source_word: βουλευτής
  choice: 议会成员
  rationale: 忠实保留“某议事机构成员”的一般含义，不在正文中把该机构进一步明确为公会。
- source_word: ὃς καὶ αὐτὸς
  choice: 自己也
  rationale: 保留καὶ αὐτός对约瑟本人同样怀有这一盼望的强调。
- source_word: ἦν προσδεχόμενος
  choice: 一直等候着
  rationale: 表达迂回时态结构所呈现的持续状态，并保留带着盼望等候的意味。
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: 神的国
  rationale: 采用自然、直接且在福音书语境中稳定的译法。
- source_word: τολμήσας
  choice: 鼓起勇气
  rationale: 体现约瑟采取这一行动所需的胆量，比单纯译成“勇敢地”更清楚地呈现行动前的决意。
- source_word: εἰσῆλθεν πρὸς τὸν Πιλᾶτον
  choice: 进去见彼拉多
  rationale: 既保留εἰσῆλθεν的“进去”，也以自然汉语表达进入彼拉多面前或所在之处。
- source_word: ᾐτήσατο
  choice: 请求领取
  rationale: “请求”表达正式求取之意；补出“领取”使汉语清楚表明约瑟是在请求取得遗体，而非仅询问。
- source_word: τὸ σῶμα τοῦ Ἰησοῦ
  choice: 耶稣的身体
  rationale: 直接保留原文的庄重措辞，不以解释性的“遗体”取代σῶμα。
theological_decisions:
- issue: βουλευτής所指议事机构的身份
  choice: 正文译作“议会成员”
  alternative: “公会成员”或“犹太公会议员”
  rationale: 上下文很可能指犹太公会，但该词本身只说明约瑟是议事机构成员；正文不加入原词没有明说的专名。
- issue: τολμήσας的语义力度
  choice: 译作“鼓起勇气”
  alternative: “大胆地”或“敢于”
  rationale: 保留约瑟接近彼拉多并索取耶稣身体这一举动所体现的勇气，同时不额外解释风险的具体来源。
- issue: “等候神的国”的神学张力
  choice: 保留“等候着神的国”
  alternative: “盼望神的国降临”
  rationale: 原文没有明说“降临”，故不把对神国的期待限定为某一种时间或神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以短句化解希腊语多个分词和同位成分造成的汉语拥挤，同时保留“来了”“自己也一直等候着”以及“鼓起勇气”等原文信息。
