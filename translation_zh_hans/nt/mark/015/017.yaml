  yaml_path: translation/nt/mark/015/017.yaml
  text: And they dress him in purple[a], and after weaving a crown of thorns, they place it on him.
translation:
  language: zh_hans
  text: 他们给他穿上紫色衣服[a]，又用荆棘编了一顶冠冕，给他戴在头上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“给他穿上紫色衣料”；希腊文在本节没有明确说是“袍子”，但上下文表明所指的是衣物。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνδιδύσκουσιν
  choice: 给他穿上
  rationale: 该动词表示给某人穿衣；“给他穿上”在现代汉语中自然，并保留使动含义。
- source_word: πορφύραν
  choice: 紫色衣服
  rationale: 该词可指紫色布料或紫色衣服。单说“紫色”在汉语中不够自然，因此补出语境隐含的“衣服”，但不具体化为“袍子”。
- source_word: περιτιθέασιν
  choice: 戴在他头上
  rationale: 该动词表示放在或围在某物之上；冠冕在汉语中通常说“戴在头上”。原文虽未明说“头”，但动作和对象已清楚隐含这一部位。
- source_word: πλέξαντες
  choice: 编了
  rationale: 不定过去时分词表示编制动作先于戴上的动作；汉语以“又编了……，戴在……”自然表达先后关系。
- source_word: ἀκάνθινον
  choice: 荆棘
  rationale: 该形容词表示由荆棘制成；“荆棘冠冕”简洁、自然地表达其材质。
- source_word: στέφανον
  choice: 冠冕
  rationale: 该词可指花冠或冠冕；此处士兵以紫衣和荆棘冠冕戏仿王权，“冠冕”能够保留这一讽刺性的君王意象。
theological_decisions:
- issue: 耶稣受辱场景中的戏仿君王意象
  choice: 将 στέφανος 译为“冠冕”
  alternative: 花冠；花环
  rationale: 紫色衣服与荆棘冠冕共同构成对君王身份的嘲弄。“冠冕”保留叙事中的王权意象，同时不加入超出原文的神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“紫色衣服”避免把原文未明确说明的衣物具体化为“紫袍”；“荆棘冠冕”保留戏仿君王的语境。
