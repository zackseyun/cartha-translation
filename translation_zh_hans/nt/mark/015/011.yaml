base_translation:
  language: en
  yaml_path: translation/nt/mark/015/011.yaml
  text: But the chief priests stirred up the crowd so that he would release Barabbas to them instead[a][b].
translation:
  language: zh_hans
  text: 可是，祭司长们煽动群众，好叫彼拉多宁可把巴拉巴释放给他们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “宁可”也可译作“反而”或“更愿意”。原文表示优先选择巴拉巴；与之相对的选择由上下文交代。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: 可是
  rationale: δέ在这里承接叙事并带有轻微转折；“可是”自然体现祭司长们的行动与上文情势之间的反差。
- source_word: ἀρχιερεῖς
  choice: 祭司长们
  rationale: 指耶路撒冷祭司领袖群体；“祭司长”是福音书语境中准确而通行的译法，复数用“们”清楚表达。
- source_word: ἀνέσεισαν
  choice: 煽动
  rationale: ἀνασείω在此表示鼓动一群人采取所期望的行动；“煽动”比一般的“激动”更清楚传达有意促使群众行动的语义。
- source_word: τὸν ὄχλον
  choice: 群众
  rationale: ὄχλος指聚集的人群；“群众”在此叙事场景中自然易懂。
- source_word: ἵνα
  choice: 要
  rationale: ἵνα引出祭司长们煽动群众的目的；汉语用“要他们……”自然表达目的关系。
- source_word: μᾶλλον
  choice: 宁可
  rationale: μᾶλλον表达相对于上下文所隐含另一选择的偏向；“宁可”保留这种比较和优先选择的意味，不在本节擅自补出“耶稣”。
- source_word: τὸν Βαραββᾶν
  choice: 巴拉巴
  rationale: 按现代汉语圣经人名的通行音译处理。
- source_word: ἀπολύσῃ
  choice: 要求彼拉多释放
  rationale: ἵνα后的不定过去时虚拟语气表示预期目的。希腊文主语省略，由上下文可知执行释放的是彼拉多；汉语若直译为“让他释放”指代不够清楚，因此明示“彼拉多”，并以“要求”说明群众受煽动后所提出的诉求。
- source_word: αὐτοῖς
  choice: 给他们
  rationale: 与格代词表示释放行为所惠及或交付的一方；“给他们”直接保留原文关系。
theological_decisions:
- issue: 是否明示释放者彼拉多
  choice: 在正文中译作“要求彼拉多释放”
  alternative: “好让他释放”
  rationale: 原文省略ἀπολύσῃ的主语，但上下文明确指彼拉多。现代汉语使用“他”容易指向祭司长或巴拉巴，明示彼拉多是为消除代词歧义，并未改变叙事角色。
- issue: 是否补出与巴拉巴相对的耶稣
  choice: 不补出“而不是耶稣”
  alternative: “释放巴拉巴而不是耶稣”
  rationale: μᾶλλον确有偏向另一选择的比较意味，但本节希腊文未明说比较对象；正文以“宁可”保留由上下文补足的张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“煽动群众”准确呈现有意鼓动群体行动的意味；“宁可要求”符合自然汉语，同时保留原文未明说比较对象的表达。正文中的脚注标记与脚注条目一致。
