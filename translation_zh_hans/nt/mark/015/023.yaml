  text: καὶ ἐδίδουν ⸀αὐτῷ ἐσμυρνισμένον οἶνον, ⸀ὃς δὲ οὐκ ἔλαβεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/023.yaml
  text: And they were giving him wine mixed with myrrh[b][a], but he did not take it.
translation:
  language: zh_hans
  text: 他们正把没药调和的酒递给他[a]，他却没有接受[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们正给他没药调和的酒。”
    reason: ἐδίδουν是未完成时，表示正在进行或尝试施予的动作；可译为“给”或“递给”。
  - marker: b
    text: “接受”直译为“拿”。希腊文以关系代词回指耶稣，字面近于“而他却没有拿（它）”。
    reason: 说明λαμβάνω的基本词义，并交代ὃς δὲ的回指式表达；不将其限定为“喝”。
lexical_decisions:
- source_word: ἐδίδουν
  choice: 拿……给他
  rationale: 未完成时描写他们当时给耶稣酒的动作；现代汉语用“拿……给他”自然表达这一正在进行或尝试施予的情景，又不把“给”过度解释为特定礼俗。
- source_word: ἐσμυρνισμένον οἶνον
  choice: 没药调和的酒
  rationale: 分词ἐσμυρνισμένον表示酒经过没药调制；“没药调和的酒”清楚、庄重，并保留所用物质及调制关系。
- source_word: ὃς δὲ
  choice: 他却
  rationale: ὃς形式上是关系代词，但在这里回指耶稣，并与δέ共同形成承接而略带转折的表达；“他却”符合现代汉语叙事习惯。
- source_word: ἔλαβεν
  choice: 喝
  rationale: λαμβάνω本义为“拿、接受”；在酒作为隐含宾语的语境中，“没有喝”是自然且清楚的汉语表达。脚注保留其较直译的词义，避免掩盖原文措辞。
theological_decisions:
- issue: 耶稣不喝这酒的原因
  choice: 只叙述他没有喝，不说明原因
  alternative: 解释为他拒绝具有麻醉作用的饮料，或按某种习俗拒绝饮用
  rationale: 原文仅说明有人给他没药调和的酒，而他没有喝；译文不加入原文未明说的动机或神学解释。
translation_notes:
  register: 采用现代、自然而庄重的简体中文。“没药”沿用普通读者熟悉的圣经用语；句式简洁，不解释饮料的功用，也不推断耶稣拒绝的动机。
