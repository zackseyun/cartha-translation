  yaml_path: translation/nt/mark/015/010.yaml
  text: For he knew that the chief priests had handed him over because of envy[a].
translation:
  language: zh_hans
  text: 因为彼拉多知道，祭司长们是出于嫉妒[a]才把耶稣交了出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“出于妒忌”或“出于忌妒”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγίνωσκεν
  choice: 知道
  rationale: 未完成时在此表示彼拉多当时已有或持续持有的认识；现代汉语用“知道”自然表达。
- source_word: γὰρ
  choice: 因为
  rationale: 说明上一节彼拉多提议释放耶稣的缘由；“因为”清楚保留解释关系。
- source_word: ὅτι
  choice: （知道后的内容从句）
  rationale: 引出彼拉多所知道的内容；汉语无需另译连接词，而以逗号直接引出从句。
- source_word: διὰ φθόνον
  choice: 出于嫉妒
  rationale: διά加宾格表示原因或动机；“出于嫉妒”自然地表达祭司长们采取行动的内在动因。
- source_word: παραδεδώκεισαν
  choice: 交来
  rationale: 过去完成时表明交付发生在彼拉多认识或叙述所聚焦的时点之前；上下文已明确交给彼拉多，汉语“交来”简洁保留司法移交含义，避免译成“出卖”而过度限定。
- source_word: αὐτὸν
  choice: 耶稣
  rationale: 原文为“他”，所指是耶稣；现代汉语在本句中明说姓名可避免连续代词造成指代不清。
- source_word: οἱ ἀρχιερεῖς
  choice: 祭司长们
  rationale: 指当时居领导地位的祭司权威群体；“祭司长”是福音书语境中的通行译法，复数用“们”明确表达。
theological_decisions:
- issue: 祭司长们交付耶稣的动机
  choice: 出于嫉妒
  alternative: 出于忌妒／因为眼红
  rationale: 经文陈述彼拉多对其动机的判断；译文按 φθόνος 的通常意义直陈，不进一步解释或强化其神学含义。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“才”突出所述动机与交付行动之间的关系；“交来”承接彼拉多所在的叙事视角。
