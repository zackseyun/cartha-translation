  yaml_path: translation/nt/mark/015/007.yaml
  text: The man called Barabbas was bound with the rebels who had committed murder in the rebellion[a].
translation:
  language: zh_hans
  text: 有一个名叫巴拉巴的人，和那些在叛乱中犯过杀人罪的叛乱者一同被捆绑[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “叛乱者”也可译作“起事者”，“叛乱”也可译作“起事”。希腊原文在两处使用了同源词。
    reason: 说明同源词的呼应及可行的词义选择。
lexical_decisions:
- source_word: ἦν δὲ
  choice: 那个……的人……被捆着
  rationale: δέ只起轻微的叙事衔接作用，中文不必另加“现在”或“当时”；ἦν与完成时被动分词δεδεμένος共同表达持续的被拘禁状态。
- source_word: ὁ λεγόμενος Βαραββᾶς
  choice: 那个称为巴拉巴的人
  rationale: 保留“被称为／名叫”的描述性质，不采用可能带贬义的“所谓”；人名按通行译法作“巴拉巴”。
- source_word: μετὰ τῶν στασιαστῶν
  choice: 和叛乱者一同
  rationale: στασιασταί指参与叛乱或起事的人。“叛乱者”清楚、庄重，并与下文同词根的στάσις形成呼应。
- source_word: δεδεμένος
  choice: 被捆着
  rationale: 完成时被动分词表示已经被捆绑且仍处于这种状态；在拘押语境中虽隐含监禁，但不把原文具体意象泛化为“被关押”。
- source_word: οἵτινες
  choice: 这些人
  rationale: 承接前面的叛乱者并引出说明性关系从句；中文另起分句，用“这些人”指代清楚。
- source_word: ἐν τῇ στάσει
  choice: 在叛乱中
  rationale: στάσις在此指反叛或起事，而不只是一般骚乱；“叛乱”符合政治性暴力事件的语境。
- source_word: φόνον πεποιήκεισαν
  choice: 犯过杀人罪
  rationale: 表达在此前已经发生的杀人行为。“杀人罪”保留φόνος的犯罪意味，同时不擅自断定死者人数。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“被捆着”保留原文的具体拘押状态；分号使人物状态与随后对叛乱者的补充说明层次清楚。
