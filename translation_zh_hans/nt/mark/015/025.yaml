  yaml_path: translation/nt/mark/015/025.yaml
  text: It was the third hour[a], and they crucified him.
translation:
  language: zh_hans
  text: 那时是第三个时辰[a]，他们把他钉在十字架上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 按当时犹太人通常的计时方法，约为上午九点。
    reason: cultural_note
lexical_decisions:
- source_word: Ἦν
  choice: 那时是
  rationale: 未完成时 εἰμί 与时间短语连用，用来交代当时的时间；汉语用“那时是”自然地承接叙事。
- source_word: δὲ
  choice: 那时
  rationale: δέ 在这里是轻微的叙事连接词，并非强烈转折；结合 Ἦν 译为“那时是”，既体现叙事推进，也避免生硬地另加“而”或“但是”。
- source_word: ὥρα τρίτη
  choice: 第三个时辰
  rationale: 保留原文古代计时表达及其文化背景，不在正文中直接换算成现代钟点。
- source_word: ἐσταύρωσαν
  choice: 他们把……钉在十字架上
  rationale: 准确表达施行十字架刑的动作；这是现代汉语中自然、清楚且庄重的说法。
- source_word: αὐτόν
  choice: 他
  rationale: 宾格代词指耶稣；上下文明确，汉语用“他”即可。
theological_decisions:
- issue: 时间表达与受难叙事年代次序的关系
  choice: 正文保留“第三个时辰”
  alternative: 译作“上午九点左右”
  rationale: 经文本身采用古代时间名称，并未在本节中换算成现代钟点。保留原表达可避免把某种年代协调方案带入正文，同时用脚注帮助现代读者理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“第三个时辰”保留原文的历史文化色彩，脚注提供必要换算；“钉在十字架上”比音译式或技术性表达更自然。
