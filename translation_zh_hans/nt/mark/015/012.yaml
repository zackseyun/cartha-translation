  text: ὁ δὲ Πιλᾶτος ⸂πάλιν ἀποκριθεὶς ἔλεγεν⸃ αὐτοῖς· Τί οὖν ⸀θέλετε ποιήσω ⸂ὃν λέγετε⸃ ⸀τὸν βασιλέα τῶν Ἰουδαίων;
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/012.yaml
  text: Pilate answered them again[a], “Then what do you want me to do with the one you call the king of the Jews?”
translation:
  language: zh_hans
  text: 彼拉多又回答他们：“那么，你们要我怎样处置你们所说的‘犹太人的王’？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάλιν
  choice: 又
  rationale: 表示彼拉多在持续的对话中再次发问；“又”简洁自然，符合现代汉语叙事。
- source_word: ἀποκριθεὶς ἔλεγεν
  choice: 问
  rationale: 该分词加未完成时结构用于引出回应；结合后面的疑问句，译作“问”比直译“回答说”更自然，同时保留回应性质。
- source_word: Τί οὖν
  choice: 那么
  rationale: οὖν承接群众先前的要求并引出推论；“那么”自然保留这一逻辑联系。
- source_word: θέλετε ποιήσω
  choice: 你们要我怎样处置
  rationale: θέλω加虚拟式表达所期望采取的行动；汉语用“要我怎样……”自然准确。“处置”适合司法审讯语境，且不预先指定具体行动。
- source_word: ὃν λέγετε
  choice: 你们所说的
  rationale: 保留称号来自群众说法的修辞距离，不把它表达成彼拉多本人的认信或否认。
- source_word: τὸν βασιλέα τῶν Ἰουδαίων
  choice: ‘犹太人的王’
  rationale: 保留受难叙事中的政治性称号；引号清楚显示这是“你们所说的”称谓，而非译者对其真实性作出判断。
theological_decisions:
- issue: 彼拉多的话是否认可耶稣是犹太人的王
  choice: 译作“你们所说的‘犹太人的王’”，将称号明确置于群众的说法之中。
  alternative: “那位你们称为犹太人之王的人”或“你们称为犹太人的王的那个人”
  rationale: 希腊文ὃν λέγετε突出“你们所说的”；译文保留彼拉多的修辞距离，不将其处理为个人认信，也不处理为否认。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“处置”符合审讯及判决语境；整体语序按自然汉语调整，同时保留原文的逻辑推进和神学张力。
