  text: καὶ ⸂σταυροῦσιν αὐτὸν καὶ⸃ διαμερίζονται τὰ ἱμάτια αὐτοῦ, βάλλοντες κλῆρον ἐπ’ αὐτὰ τίς τί ἄρῃ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/024.yaml
  text: And they crucify him and divide his garments among themselves[a], casting lots for them to decide what each would take.
translation:
  language: zh_hans
  text: 他们把他钉在十字架上，又分他的衣服，拈阄决定各人拿什么。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为这些衣服拈阄，看谁拿什么。”
    reason: 原文末尾可较贴近句法地表达为针对衣服拈阄，以确定谁拿哪一件；正文则用自然汉语明确其决定作用。
lexical_decisions:
- source_word: σταυροῦσιν
  choice: 把他钉在十字架上
  rationale: 准确表达以十字架处死的具体动作。希腊文用历史现在时增强现场感；汉语不加“了”，可在自然叙事中保留这种直接、鲜明的语气。
- source_word: διαμερίζονται
  choice: 分
  rationale: 直接表达把衣物分给不同人的动作，简洁自然，也保留原文的分配含义。
- source_word: ἱμάτια
  choice: 衣服
  rationale: 指具体的衣物；“衣服”是现代汉语中自然、庄重而易懂的对应词，不必采用较古雅的“衣裳”。
- source_word: βάλλοντες κλῆρον
  choice: 拈阄
  rationale: 这是现代汉语中表示借阄决定归属的固定说法，准确对应以抽签方式分配物品。
- source_word: ἐπ’ αὐτὰ
  choice: 为这些衣服（在句中由语境隐含）
  rationale: 介词短语所指是衣服，即针对这些衣服拈阄；汉语主句省略重复宾语更自然，而上下文指代清楚。
- source_word: τίς τί ἄρῃ
  choice: 决定各人拿什么
  rationale: 保留两个疑问代词的分配关系，即由拈阄确定谁取得哪一件；“各人拿什么”比逐字译作“谁拿什么”更顺畅。
theological_decisions:
- issue: 受难叙事中的历史现在时
  choice: 采用不带完成体标记“了”的直接叙述：“他们把他钉在十字架上”
  alternative: “他们把他钉在了十字架上”或“他们把他钉在十字架上了”
  rationale: 原文现在时在马可叙事中具有鲜明、即时的效果。现代汉语虽不以动词时态对应，但省去“了”既自然，也避免把叙述单纯处理为已完成的过去事件；此选择不增添任何教义解释。
translation_notes:
  register: 采用现代、简明而庄重的叙事语言。“钉在十字架上”清楚具体；“拈阄”保留经文语境中以阄分配的做法，同时普通读者仍易理解。句中不加“了”，以适度传达马可历史现在时的鲜明感。
