  text: ὁ χριστὸς ὁ ⸀βασιλεὺς Ἰσραὴλ καταβάτω νῦν ἀπὸ τοῦ σταυροῦ, ἵνα ἴδωμεν καὶ ⸀πιστεύσωμεν. καὶ οἱ συνεσταυρωμένοι ⸀σὺν αὐτῷ ὠνείδιζον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/032.yaml
  text: Let the Messiah[a], the King of Israel, come down now from the cross[b], so that we may see and believe.” And those who were crucified with him were also insulting him.
translation:
  language: zh_hans
  text: “让弥赛亚[a]，以色列的王，现在从十字架上下来吧，好让我们看见并相信！”跟他同钉十字架的人也辱骂他[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“基督”。希腊语Χριστός在这里是称号，意为受膏者。
    reason: alternative_reading
  - marker: b
    text: “辱骂”也可译作“斥责”或“讥辱”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ χριστός
  choice: 弥赛亚
  rationale: 此处是带有君王和受膏者含义的称号，用在讥讽语境中；译作“弥赛亚”比音译式的“基督”更直接保留其犹太弥赛亚背景。
- source_word: ὁ βασιλεὺς Ἰσραήλ
  choice: 以色列的王
  rationale: 直译其称号结构，并保留讥讽耶稣王权宣称的语气。
- source_word: καταβάτω νῦν ἀπὸ τοῦ σταυροῦ
  choice: 现在从十字架上下来吧
  rationale: 第三人称命令式表达挑衅性的要求；“下来吧”自然地传达命令语气，“现在”保留其即时性和嘲弄意味。
- source_word: ἵνα ἴδωμεν καὶ πιστεύσωμεν
  choice: 好让我们看见并相信
  rationale: 保留ἵνα加虚拟式所表达的目的或结果关系，也保留“看见—相信”的紧密并列。
- source_word: οἱ συνεσταυρωμένοι σὺν αὐτῷ
  choice: 跟他同钉十字架的人
  rationale: 清楚保留共同被钉的被动含义，不额外增添原文未明说的身份信息。
- source_word: ὠνείδιζον αὐτόν
  choice: 也辱骂他
  rationale: “辱骂”准确传达责骂、羞辱的语义；“也”对应καί，未完成时的持续意味由上下文自然承载。
theological_decisions:
- issue: 讥讽语境中Χριστός的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 这里Χριστός明显作为犹太君王—受膏者称号，与“以色列的王”并列；采用“弥赛亚”可保留称号的语义，同时不把嘲弄者的话处理成名字式用法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“让……下来吧”保留公开讥讽和挑战的口吻；“同钉十字架的人”简洁自然。脚注标记均在正文中出现。
