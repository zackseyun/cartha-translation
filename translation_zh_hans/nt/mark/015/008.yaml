base_translation:
  language: en
  yaml_path: translation/nt/mark/015/008.yaml
  text: And the crowd came up and began to ask him to do as he used to do for them[a].
translation:
  language: zh_hans
  text: 众人上前来，开始请求彼拉多照他一向为他们所做的那样去做。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“众人上来，开始请求彼拉多，照他一向为他们所做的那样去做。”原文没有明说他们所请求的具体事项。
    reason: 保留ἀναβὰς较形式的“上来”，并说明καθὼς ἐποίει αὐτοῖς及所省略的受请求行动未具体说明；不提前引入下一节所述事项。
lexical_decisions:
- source_word: ἀναβὰς
  choice: 上前来
  rationale: 该词是ἀναβαίνω的不定过去时分词，字面含“上去、上来”。此处叙事中指众人走近彼拉多；“上前来”既保留趋近的动态，也符合现代汉语表达。
- source_word: ὁ ὄχλος
  choice: 众人
  rationale: ὄχλος指聚集的人群。“众人”自然、庄重，并与本段叙事情境相称。
- source_word: ἤρξατο αἰτεῖσθαι
  choice: 开始求
  rationale: ἄρχομαι加不定式表示“开始”，αἰτέω在此表示提出请求。“开始求”简洁地保留原文结构和语气。
- source_word: καθὼς
  choice: 照惯例
  rationale: καθώς本义为“正如、照着”；结合未完成时ἐποίει所表达的惯常行为，译作“照惯例”能以自然汉语传达其语境意义，同时不具体补出下一节才明说的释放囚犯。
- source_word: ἐποίει
  choice: 办理
  rationale: ποιέω基本义为“做”，未完成时在此表达过去惯常的行为。汉语若直译“做”较悬空；“办理”自然表达群众请求彼拉多照往常处理此事，并保留原文未明说具体事项的特点。
- source_word: αὐτοῖς
  choice: 为他们
  rationale: 与格在此具有受益含义，指彼拉多惯常为群众所做之事，故译作“为他们”。
theological_decisions: []
translation_notes:
  register: 采用现代、简洁而庄重的叙事语体。“彼拉多”由上下文补出，以避免汉语代词指向不清；原文此节未明确说出群众所求的具体事项，因此正文用“照惯例为他们办理”，不提前引入下一节所说明的释放囚犯。
