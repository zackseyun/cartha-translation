  text: 他们开始向他致敬，说：“犹太人的王，万岁！”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: 就
  rationale: 承接前文并推进叙事；现代汉语用“就”比机械译作“和”更自然，同时保留马可简洁的连贯风格。
- source_word: ἤρξαντο
  choice: 开始
  rationale: 保留ἄρχομαι加不定式所表达的起始义，呈现士兵随即展开这一嘲弄行为。
- source_word: ἀσπάζεσθαι
  choice: 向他行礼，说
  rationale: 该词通常指问候，在此语境中却是仿效觐见君王的正式致意。“行礼”体现其表演性和嘲弄意味；补出“说”可自然引出直接引语，并未增加实质内容。
- source_word: Χαῖρε
  choice: 万岁
  rationale: 此处不是字面命令“喜乐”，而是用于致敬的固定表达；在模拟王室欢呼的语境中，“万岁”能自然传达正式而讥讽的拥戴语气。
- source_word: βασιλεῦ τῶν Ἰουδαίων
  choice: 犹太人的王
  rationale: 保留呼格称谓和属格关系。Ἰουδαῖοι可指“犹太人”或“犹太地区的人”；在受难叙事的王号中，“犹太人”是通行且合乎语境的表达。
theological_decisions:
- issue: 如何呈现士兵对耶稣王权的讥讽性欢呼
  choice: 用“万岁！犹太人的王！”呈现仿效拥戴君王的嘲弄
  alternative: “你好，犹太人的王！”
  rationale: 原文既是问候语，也在此构成戏仿君王礼仪的欢呼。“万岁”保留其王室色彩与反讽张力，而不额外断言其神学意义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“向他行礼”比普通的“问候他”更能体现场景中的正式姿态；“万岁”在现代汉语中仍可辨识为对君王或领袖的欢呼，适合表现士兵的讥讽。
