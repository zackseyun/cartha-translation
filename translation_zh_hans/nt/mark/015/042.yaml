  text: 天色已经晚了，因为这是预备日，就是安息日的前一天，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀψίας γενομένης
  choice: 天色已经晚了
  rationale: 该独立属格结构表示时间背景；此译自然地表达入晚状态，并保留ἤδη“已经”的含义。
- source_word: παρασκευή
  choice: 预备日
  rationale: 这里不是泛指预备，而是指安息日前用于预备的特定日子；“预备日”简洁保留其历法性称谓。
- source_word: προσάββατον
  choice: 安息日的前一天
  rationale: 这是马可对“预备日”的解释；直译其基本含义，既清楚又避免直接替换为较具解释性的“星期五”。
- source_word: ἐπεὶ
  choice: 因为
  rationale: 引出说明原因的从句；“因为”在现代汉语叙事中清楚自然。
- source_word: ὅ ἐστιν
  choice: 也就是
  rationale: 保留原文解释性公式的作用，以自然现代汉语说明“预备日”。
- source_word: Καὶ
  choice: （由上下文承接，不另译）
  rationale: 希腊文Καὶ承接前文；汉语在新句开头省去显式连词更自然，同时仍由叙事顺序体现衔接。
