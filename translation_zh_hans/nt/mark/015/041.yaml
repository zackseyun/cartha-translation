  text: ⸀αἳ ὅτε ἦν ἐν τῇ Γαλιλαίᾳ ἠκολούθουν αὐτῷ καὶ διηκόνουν αὐτῷ, καὶ ἄλλαι πολλαὶ αἱ συναναβᾶσαι αὐτῷ εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/041.yaml
  text: These women[a], when he was in Galilee, used to follow him and minister to him[b]; and there were many other women who had gone up with him to Jerusalem.
translation:
  language: zh_hans
  text: 这些妇女[a]当他在加利利的时候，一直跟随他，服事他；还有许多别的妇女，曾同他上耶路撒冷去[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这些妇女”指上一节所提到的妇女。
    reason: 指代说明
  - marker: b
    text: 直译为“同他上到耶路撒冷”；“上耶路撒冷”是圣经中惯用的说法。
    reason: 文化与直译说明
lexical_decisions:
- source_word: αἳ
  choice: 这些妇女
  rationale: 关系代词回指上一节所列的妇女；汉语以“这些妇女”承接前文，指代清楚且行文自然。
- source_word: ὅτε ἦν ἐν τῇ Γαλιλαίᾳ
  choice: 在耶稣身处加利利时
  rationale: 按时间从句直译，并明确省略主语所指的是耶稣，避免汉语中误解为妇女身处加利利。
- source_word: ἠκολούθουν
  choice: 一直跟随
  rationale: 未完成时描写持续或惯常的过去行动；“一直跟随”既传达延续性，也保留门徒跟随的含义。
- source_word: διηκόνουν
  choice: 服事
  rationale: διακονέω可指实际照料、服务或支持；“服事”保留其范围和尊重意味，不把行动局限为家务，也不暗示正式教会职分。
- source_word: ἄλλαι πολλαὶ
  choice: 许多别的妇女
  rationale: 阴性复数由上下文明确指妇女；汉语补出“妇女”，使指称自然清楚。
- source_word: αἱ συναναβᾶσαι αὐτῷ
  choice: 也曾同他上……去
  rationale: 复合分词表达与耶稣同行上去；“曾”适度体现相对于当前叙事的先行行动，“同他”保留共同前往之意。
- source_word: εἰς Ἱεροσόλυμα
  choice: 耶路撒冷
  rationale: 与“上……去”组合，自然表达目的地，同时保存前往耶路撒冷常用的“上”这一圣经地理表达。
theological_decisions:
- issue: διηκόνουν所表达的妇女服事性质
  choice: 服事他
  alternative: 服侍他／照料他／供应他
  rationale: 原词可涵盖实际服务、照料与支持。“服事”保持语义广度和尊严，不缩窄为某一种家务或经济供应，也不引入后来制度化的教会职分。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“身处”使时间从句的主语明确；“一直跟随”体现未完成时的持续或惯常意味；“服事”保留原词可能包括照料、服务和支持的宽度。主文中的[a]、[b]均与脚注对应。
