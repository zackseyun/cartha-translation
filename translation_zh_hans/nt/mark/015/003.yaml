lexical_decisions:
- source_word: καὶ
  choice: 还
  rationale: 承接上一节的叙事，并自然表达祭司长们继续采取控告行动；保留马可简洁的并列推进。
- source_word: κατηγόρουν
  choice: 提出……来控告
  rationale: 未完成时表示过去持续或反复进行的控告；这一表达在现代汉语中自然，也能与 πολλά 所指的多项控告内容衔接。
- source_word: αὐτοῦ
  choice: 他
  rationale: κατηγορέω 后的属格指出被控告者；汉语用“控告他”自然表达。
- source_word: οἱ ἀρχιερεῖς
  choice: 祭司长们
  rationale: 指居领导地位的祭司权贵群体，并非多位大祭司；“祭司长们”是准确且通行的译法。
- source_word: πολλά
  choice: 许多事
  rationale: 中性复数表示控告所涉及的许多事项；不直接译成“罪名”，以免将原文宽泛的说法限定为正式法律指控。
