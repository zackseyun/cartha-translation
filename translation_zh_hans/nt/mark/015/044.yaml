  text: ὁ δὲ Πιλᾶτος ἐθαύμασεν εἰ ἤδη τέθνηκεν, καὶ προσκαλεσάμενος τὸν κεντυρίωνα ἐπηρώτησεν αὐτὸν εἰ ⸀πάλαι ἀπέθανεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/044.yaml
  text: But Pilate was amazed that he had already died[a], and summoning the centurion, he asked him whether he had died already.
translation:
  language: zh_hans
  text: 彼拉多诧异耶稣是否已经死了；他叫来百夫长，问他耶稣是否已经死了一段时间。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐθαύμασεν
  choice: 感到诧异
  rationale: 表达彼拉多因耶稣如此快便死亡而惊讶；现代汉语自然、庄重，又不过分强化为震惊。
- source_word: εἰ ἤδη τέθνηκεν
  choice: 听说他已经死了
  rationale: εἰ引出惊讶内容，并保留间接获知的语境；τέθνηκεν为完成时，既指死亡已经发生，也突出已经处于死亡状态。
- source_word: προσκαλεσάμενος
  choice: 就叫……来
  rationale: 自然表达彼拉多召来百夫长、随后询问的动作次序。
- source_word: κεντυρίωνα
  choice: 百夫长
  rationale: 沿用汉语圣经及历史叙事中通行的罗马军衔名称，准确且易懂。
- source_word: ἐπηρώτησεν
  choice: 问
  rationale: 简洁对应询问、查证之意，符合现代叙事语言。
- source_word: εἰ πάλαι ἀπέθανεν
  choice: 是否已经死了一段时间
  rationale: πάλαι在此关注死亡是否已发生一段时间，而非遥远的‘很久以前’；该译法也保留与前句ἤδη之间细微的语义差别。
