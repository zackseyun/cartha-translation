  text: ὁμοίως καὶ οἱ ἀρχιερεῖς ἐμπαίζοντες πρὸς ἀλλήλους μετὰ τῶν γραμματέων ἔλεγον· Ἄλλους ἔσωσεν, ἑαυτὸν οὐ δύναται σῶσαι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/031.yaml
  text: In the same way the chief priests[a], mocking among themselves with the scribes, were saying, “He saved others; he cannot save himself.”
translation:
  language: zh_hans
  text: 同样，祭司长们也和经学家一起，彼此议论着，讥讽地说[a]：“他救了别人；却不能救自己。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“祭司长们也和经学家一起彼此讥讽着说。”希腊语中“彼此”可紧连“讥讽”；但按上下文，这话是他们共同讥讽耶稣时彼此所说的。
    reason: 保留πρὸς ἀλλήλους与分词的句法连接可能性，同时避免把讥讽对象误解为祭司长和经学家彼此。
lexical_decisions:
- source_word: ὁμοίως
  choice: 同样
  rationale: 承接前文的嘲弄，保留比较和并列关系，中文简洁自然。
- source_word: οἱ ἀρχιερεῖς
  choice: 祭司长们
  rationale: 指居领导地位的祭司权威群体，并非表示同时有多位大祭司。
- source_word: ἐμπαίζοντες
  choice: 讥讽
  rationale: 表达带有轻蔑和嘲弄意味的言语行为，适合本处语境。
- source_word: πρὸς ἀλλήλους
  choice: 彼此
  rationale: 保留相互交谈的关系；结合“说”，表示他们互相说这些讥讽的话，而非必然指彼此为嘲弄对象。
- source_word: μετὰ τῶν γραμματέων
  choice: 和经学家一起
  rationale: 表明经学家也参与其中；“经学家”在现代汉语中较清楚地表达熟悉并讲解律法的群体。
- source_word: ἔλεγον
  choice: 说
  rationale: 中文叙事中的“说”可自然涵盖未完成时所描写的持续背景；若译作“一直说”则可能过度强调反复。
- source_word: Ἄλλους ἔσωσεν
  choice: 他救了别人
  rationale: “救”既可指搭救、医治，也保留救恩层面的反讽，并忠实保留动词的宽广语义。
- source_word: ἑαυτὸν οὐ δύναται σῶσαι
  choice: 却不能救自己
  rationale: 保留能力表达以及与前一分句同一动词的重复；“却”自然呈现嘲讽中的对比。
theological_decisions:
- issue: 两处分译 σῴζω 时是否保持一致
  choice: 救了……救
  alternative: 搭救了……搭救；拯救了……拯救
  rationale: 使用同一个“救”保留希腊文的词语重复和神学反讽，同时不把语义限定为肉身获救或属灵救恩。
- issue: πρὸς ἀλλήλους 与嘲弄行为的关系
  choice: 将“彼此”与“说”理解为他们相互交谈
  alternative: 译为“彼此嘲弄”
  rationale: 上下文显示他们共同讥讽耶稣；若译为“彼此嘲弄”，容易误解为祭司长和经学家互相成为嘲弄对象。脚注保留句法上的另一种连接方式。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“经学家”比传统的“文士”更能让普通现代读者直接理解其身份；引语简洁有力，保留原文的对称与反讽。
