  yaml_path: translation/nt/mark/015/047.yaml
  text: And Mary Magdalene and Mary the mother of Joses were watching where he was laid[a].
translation:
  language: zh_hans
  text: 抹大拉的马利亚和约西的母亲马利亚一直看着耶稣被安放在哪里[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“约西的马利亚”。希腊文以她与约西的关系来指明这位马利亚；这里按上下文译作“约西的母亲”。
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: 不单独译出
  rationale: 此处是轻微的叙事连接词。汉语承接上文时无需硬译为“并且”或“但”，省略更自然，也不损失语义。
- source_word: Μαρία ἡ Μαγδαληνή
  choice: 抹大拉的马利亚
  rationale: 采用现代中文圣经读者熟悉的地名性称谓，定冠词结构用于指明是哪一位马利亚。
- source_word: Μαρία ἡ Ἰωσῆτος
  choice: 约西的母亲马利亚
  rationale: 属格结构按马可福音语境最自然地表示她与约西的亲属关系；正文明确为“母亲”以符合自然汉语，同时用脚注保留希腊文较简略的表达。
- source_word: ἐθεώρουν
  choice: 一直看着
  rationale: 未完成时表示过去持续进行的观看；“一直看着”比单纯的“看见”更能传达延续意味。
- source_word: ποῦ
  choice: 在哪里
  rationale: 直接表达地点，与“安放”组成自然的汉语间接问句。
- source_word: τέθειται
  choice: 安放
  rationale: τίθημι的完成时被动式指已经安置并处于该处的结果状态；中文用“安放”在安葬语境中自然且庄重。句中补出“耶稣”，说明希腊文依语境省略的对象。
theological_decisions:
- issue: 被动动词所省略的对象
  choice: 在正文补出“耶稣”
  alternative: 补作“他的遗体”，或仅按语境译成“安放在哪里”而不明说对象
  rationale: 希腊文因上下文清楚而省略对象。现代汉语虽可继续省略，但补出“耶稣”能避免歧义；不用“遗体”，以免把经文所指的人仅物化为尸身。
- issue: 马利亚与约西的关系
  choice: 正文译作“约西的母亲马利亚”，脚注保留字面形式
  alternative: 正文直译为“约西的马利亚”
  rationale: 希腊文只有关系属格，本身未在此节明说“母亲”；不过结合马可福音15:40的称呼，母子关系最为自然。脚注保留形式上的含混，避免把补足信息冒充为明说。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“一直看着”保留未完成时的持续意味；“安放”符合安葬场景。正文补明耶稣和母子关系以便普通读者理解，脚注则保留原文关系属格的简略性。
