  yaml_path: translation/nt/mark/015/022.yaml
  text: And they bring him to the place Golgotha[a], which is translated, “Place of a Skull.”
translation:
  language: zh_hans
  text: 他们把他带到各各他[a]这个地方；这名称译出来就是“髑髅之地”。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “各各他”是音译。原文将“各各他这个地方”译为“髑髅之地”；“髑髅”在希腊原文中没有冠词，未明确指定为某一个或特定的髑髅。
    reason: lexical_alternative
lexical_decisions:
- source_word: φέρουσιν
  choice: 带到
  rationale: 这里是叙事中的历史现在时；现代汉语自然译作过去叙事语气。“带到”表达朝目的地移动，又不额外断定是搀扶、押送或抬运。
- source_word: ἐπὶ τὸν Γολγοθᾶν τόπον
  choice: 带到各各他这个地方
  rationale: ἐπί加宾格表示朝向某处；译文保留τόπον“地方”和专名“各各他”，同时避免添加原文没有明说的“叫作”。
- source_word: Γολγοθᾶν
  choice: 各各他
  rationale: 作为地名按汉语圣经传统音译，且便于普通读者识别。
- source_word: μεθερμηνευόμενον
  choice: 翻译出来就是
  rationale: 该分词明确表示把一个语言表达翻译或解释成另一个表达；此译法既保留“翻译”的语义，也符合现代汉语。
- source_word: Κρανίου Τόπος
  choice: 髑髅地
  rationale: Κρανίου是“髑髅”的属格，Τόπος是“地方”。“髑髅地”简洁、庄重且已自然进入现代汉语；希腊文没有冠词，具体理解见脚注。
