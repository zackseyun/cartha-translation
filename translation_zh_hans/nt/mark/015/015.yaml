  text: ὁ δὲ Πιλᾶτος βουλόμενος τῷ ὄχλῳ τὸ ἱκανὸν ποιῆσαι ἀπέλυσεν αὐτοῖς τὸν Βαραββᾶν, καὶ παρέδωκεν τὸν Ἰησοῦν φραγελλώσας ἵνα σταυρωθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/015.yaml
  text: So Pilate[a], wanting to satisfy the crowd, released Barabbas to them; and after having Jesus flogged, he handed him over to be crucified.
translation:
  language: zh_hans
  text: 于是，彼拉多想要满足群众的要求[a]，就把巴拉巴释放给他们；在鞭打耶稣之后，把他交给人钉十字架。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“讨群众欢心。”直译为：“为群众做足够的事。”
    reason: 说明原文习语的字面形式及可成立的译法，保留其语义幅度。
lexical_decisions:
- source_word: βουλόμενος
  choice: 想要
  rationale: 表达彼拉多的意愿和动机；“想要”自然清楚，又不把该分词过度解释为周密谋划。
- source_word: τῷ ὄχλῳ τὸ ἱκανὸν ποιῆσαι
  choice: 满足群众的要求
  rationale: 这一习语直译近于“为群众做足够的事”，在本语境中指顺应并满足他们的要求。“满足群众的要求”既自然，也保留政治迎合所形成的道德张力。
- source_word: ἀπέλυσεν
  choice: 释放了
  rationale: 在司法和囚犯语境中表示使人获释；“释放”准确、简洁。
- source_word: αὐτοῖς
  choice: 给他们
  rationale: 保留与格所表达的相关对象，即群众是这项释放决定所迎合的群体。
- source_word: παρέδωκεν
  choice: 交出去
  rationale: 保留παραδίδωμι把人交到他人权下的含义，同时符合现代汉语叙事表达。
- source_word: φραγελλώσας
  choice: 鞭打后
  rationale: 不定过去时分词表示先于主句动作发生的行动。“鞭打后”明确呈现先后次序；在彼拉多作为主语的司法语境中，也自然包含他下令施刑的含义，而不必额外增译。
- source_word: ἵνα σταυρωθῇ
  choice: 钉十字架
  rationale: 在“交出去”之后自然表达目的，即交付耶稣让人将他钉十字架；汉语中无须重复被动标记也能清楚表达。
- source_word: Βαραββᾶν
  choice: 巴拉巴
  rationale: 采用现代中文圣经人名的通行音译。
- source_word: Ἰησοῦν
  choice: 耶稣
  rationale: 采用现代中文的通行译名。
theological_decisions:
- issue: 如何表达彼拉多在τῷ ὄχλῳ τὸ ἱκανὸν ποιῆσαι中的动机
  choice: 彼拉多想要满足群众的要求
  alternative: 彼拉多想要讨群众喜欢；彼拉多想为群众做足够的事
  rationale: 原文习语在上下文中侧重满足群众的要求或安抚群众，而非仁慈地为群众服务。“满足群众的要求”保留政治迎合及其道德张力，却不额外断定彼拉多更具体的心理状态。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。句式保留原文的因果动机、释放巴拉巴、鞭打耶稣并交付钉十字架的叙事顺序；分号划分两项相对并列的司法行动。
