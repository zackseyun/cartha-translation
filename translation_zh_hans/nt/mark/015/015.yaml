  naturalness: “满足群众的要求”自然、庄重，符合上下文。“给他们释放了巴拉巴”可调整为更顺畅的“把巴拉巴释放给他们”。“讨群众喜欢”不如“讨群众欢心”自然。
  terminology: “彼拉多”“巴拉巴”“耶稣”“钉十字架”均为通行且合宜的现代中文圣经术语。“交给人钉十字架”较好保留παρέδωκεν的交付之意，并使受动结果清晰。
