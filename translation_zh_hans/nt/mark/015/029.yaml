  text: Καὶ οἱ παραπορευόμενοι ἐβλασφήμουν αὐτὸν κινοῦντες τὰς κεφαλὰς αὐτῶν καὶ λέγοντες· Οὐὰ ὁ καταλύων τὸν ναὸν καὶ ⸂οἰκοδομῶν ἐν τρισὶν ἡμέραις⸃,
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/029.yaml
  text: And those passing by were reviling him[a], shaking their heads and saying[b], “Aha! You who would tear down the temple and build it in three days,”
translation:
  language: zh_hans
  text: 那些从旁经过的人不断辱骂他，一边摇着头一边说：“哈！你这要拆毁圣殿[a]、三天内建造它[b]的人啊，”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣殿”或译“圣所”。
    reason: lexical_alternative
  - marker: b
    text: 也可按语境译作“重建它”；希腊文动词本身只表示“建造”。
    reason: lexical_alternative
lexical_decisions:
- source_word: παραπορευόμενοι
  choice: 从那里经过的人
  rationale: 表达这些人正从受刑现场旁边经过，既自然又保留分词所呈现的动态。
- source_word: ἐβλασφήμουν
  choice: 辱骂
  rationale: 此处指敌意旁观者对耶稣说侮辱、毁谤的话；译作“辱骂”比技术性较强的“亵渎”更符合本句语境。未完成时的持续性由上下文和并列动作自然体现。
- source_word: κινοῦντες τὰς κεφαλὰς αὐτῶν
  choice: 摇着头
  rationale: 这是表示讥讽和轻蔑的动作；“摇着头”是现代汉语自然清楚的表达。
- source_word: Οὐὰ
  choice: 哈！
  rationale: 在此是讥讽性的感叹，用“哈”传达嘲弄口吻，不误解为哀叹。
- source_word: ὁ καταλύων
  choice: 你这要拆毁……的人
  rationale: 冠词加分词在此具有直接称呼的作用；“你这……的人”保留嘲讽语气，“拆毁”适合建筑物语境。
- source_word: ναὸν
  choice: 圣殿
  rationale: ναός可特指圣所，但在这项指控中，“圣殿”是普通读者最自然且准确的主文表达；较窄含义收入脚注。
- source_word: οἰκοδομῶν ἐν τρισὶν ἡμέραις
  choice: 三天内又把它建起来
  rationale: 保留原文“建造”的基本意义，不直接改译为“重建”；“又”承接先拆毁再建造的语境，“三天内”自然表达限定时段。
theological_decisions:
- issue: 圣殿之言所指为何
  choice: 按旁观者的指控和讥讽直接翻译，不在主文中说明圣殿象征耶稣的身体。
  alternative: 在译文中解释性地表明耶稣是以自己的身体为殿。
  rationale: 本节从马可叙事中旁观者的口吻呈现这句话；译文应保留其叙事视角及神学张力，不借用其他经文的解释来消除本节的含混。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“哈”保留原文讥讽感叹；“你这……的人”呈现直接嘲弄。句末逗号保留本节话语未完、下节继续的结构。
