  text: καὶ ἐπηρώτησεν αὐτὸν ὁ Πιλᾶτος· Σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων; ὁ δὲ ἀποκριθεὶς ⸂αὐτῷ λέγει⸃· Σὺ λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/002.yaml
  text: And Pilate asked him[a], “Are you the king of the Jews?” And he answered him[b], “You say so.”
translation:
  language: zh_hans
  text: 彼拉多问他：“你是犹太人的王[a]吗？”耶稣回答他说：“这是你说的。[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “犹太人”也可按地域含义理解为“犹太地人”。这里“犹太人的王”是向彼拉多提出的标准政治指控。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“你说”。也可译作“是你说的”或“你这样说”。耶稣的回答十分简短，保留了一定的含蓄意味。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπηρώτησεν
  choice: 问
  rationale: 该动词可指询问或盘问；此处用“问”自然简洁，也不把原文的语气强化为正式审讯。
- source_word: Σὺ εἶ
  choice: 你是……吗
  rationale: 在直接问句中译为现代汉语疑问句；明确保留“你”，体现原文显式人称代词所带的着重。
- source_word: βασιλεὺς
  choice: 王
  rationale: 保留王权称号及其在彼拉多面前所具有的政治指控意味；“统治者”范围过宽。
- source_word: Ἰουδαίων
  choice: 犹太人
  rationale: “犹太人的王”在受难叙事中是向彼拉多提出的政治性称号，也是现代汉语中清楚、通行的表达；“犹太地区的人”虽有地域性词义依据，但在此处不如“犹太人”贴合固定称号。
- source_word: ἀποκριθεὶς αὐτῷ λέγει
  choice: 耶稣回答他说
  rationale: 将分词加历史现在时结构自然地整合为汉语叙述；中文动词不标时态，因此既保持叙事推进，也避免生硬仿照希腊语结构。补出“耶稣”以明确说话者。
- source_word: Σὺ λέγεις
  choice: 这是你说的
  rationale: 保留“你”的强调，并以简短、间接的说法呈现原文；不增添明确的“是”或“不是”，避免把回答解释为毫无保留的肯定或否认。
theological_decisions:
- issue: 耶稣回答“Σὺ λέγεις”的语力
  choice: 译作“这是你说的”，保留克制而含蓄的回应
  alternative: “是的，正如你所说”或较直译的“你说”
  rationale: 希腊文没有明说“是”；该回答把这一表述放在彼拉多口中，却也没有直接否认。译文应保留这种张力，不替原文作更明确的神学判断。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。问句自然直接；回答保持简短，不用文言措辞，也不把原文的含蓄表达改写成明确肯定。
