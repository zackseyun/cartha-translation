  text: Οἱ δὲ στρατιῶται ἀπήγαγον αὐτὸν ἔσω τῆς αὐλῆς, ὅ ἐστιν πραιτώριον, καὶ συγκαλοῦσιν ὅλην τὴν σπεῖραν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/016.yaml
  text: Then the soldiers led him inside the courtyard[a], which is the praetorium[b], and they call together the whole cohort.
translation:
  language: zh_hans
  text: 士兵把耶稣带进庭院内，就是总督府[a]；他们召集了全营的士兵[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “总督府”原文为“普拉托利安”（praetorium），可指罗马总督的官邸或总部。
    reason: lexical_alternative
  - marker: b
    text: “营”指罗马军队的一个编制单位（cohort）；这里指在总督府内受罗马当局指挥而被召集的全队士兵。
    reason: cultural_note
lexical_decisions:
- source_word: Οἱ δὲ στρατιῶται
  choice: 士兵
  rationale: δέ在这里推进叙事，不必机械译出；στρατιῶται直译为“士兵”，自然准确。
- source_word: ἀπήγαγον αὐτὸν
  choice: 把耶稣带进
  rationale: ἀπάγω表示带领或带走；结合表示目的地的ἔσω，译为“带进”最符合汉语表达。代词按上下文明确为“耶稣”。
- source_word: ἔσω τῆς αὐλῆς
  choice: 院内
  rationale: ἔσω加属格表示“在……里面”；αὐλή在此指官署建筑的院子。译为“院内”保留空间含义而不过度具体化。
- source_word: ὅ ἐστιν πραιτώριον
  choice: 就是总督府
  rationale: πραιτώριον是罗马行政语境中的官邸或总部。普通中文读者不熟悉音译术语，因此采用功能对等的“总督府”，同时保留希腊文解释性分句的形式。
- source_word: συγκαλοῦσιν
  choice: 然后召集了
  rationale: 该词表示把人召集到一起。希腊文用历史现在时增强现场感；中文叙事用“召集了”更自然，“然后”体现动词时态转换带来的叙事推进。
- source_word: ὅλην τὴν σπεῖραν
  choice: 全营的士兵
  rationale: σπεῖρα指罗马军队的一个编制单位；“全营的士兵”既传达集体单位，也避免现代读者误以为建筑营地。“士兵”为汉语中必要的语义补足。
