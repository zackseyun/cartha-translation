  text: ⸂Καὶ γενομένης⸃ ὥρας ἕκτης σκότος ἐγένετο ἐφ’ ὅλην τὴν γῆν ἕως ὥρας ἐνάτης.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/033.yaml
  text: And when the sixth hour had come[b][a], darkness came over the whole land until the ninth hour.
translation:
  language: zh_hans
  text: 到了第六时[a]，黑暗笼罩了全地[b]，直到第九时。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “第六时”约为中午十二点；“第九时”约为下午三点。
    reason: cultural_note
  - marker: b
    text: 希腊语原词可指“整片地区或土地”，也可指“整个大地”；此处的范围未明确。
    reason: alternative_reading
lexical_decisions:
- source_word: γενομένης ὥρας ἕκτης
  choice: 到了第六时
  rationale: 以时间从句自然表达独立属格结构，并保留原文按时辰计时的方式；现代钟点换算放入脚注。
- source_word: σκότος
  choice: 黑暗
  rationale: 直接、清楚地对应原文名词，既自然又保留叙事的庄重感。
- source_word: ἐγένετο
  choice: 笼罩了
  rationale: 结合介词短语译为“黑暗笼罩了……”，符合现代汉语表达，并保留黑暗发生并覆盖某范围的事件性。
- source_word: ἐφ’ ὅλην τὴν γῆν
  choice: 全地
  rationale: γῆ既可指一片土地，也可指大地或全世界；“全地”在正文中简洁庄重，并用脚注明确其范围上的词义歧义。
- source_word: ἕως ὥρας ἐνάτης
  choice: 直到第九时
  rationale: 与“第六时”保持一致，保留原文计时表达；现代时间换算见脚注。
theological_decisions:
- issue: 受难时黑暗所覆盖之 γῆ 的范围
  choice: 全地
  alternative: 整个大地／全世界
  rationale: 原词范围宽泛，语境本身没有明确判定是当地、整片土地还是全世界。正文采用“全地”，并在脚注中保留另一种理解，避免把全球范围的解释直接写死。
translation_notes:
  register: 采用现代、简洁而庄重的叙事语体。“第六时／第九时”保留古代计时方式，脚注帮助普通读者理解；“全地”及脚注共同保留原文 γῆ 的真实歧义。
