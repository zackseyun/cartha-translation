  text: Καὶ ἀγγαρεύουσιν παράγοντά τινα Σίμωνα Κυρηναῖον ἐρχόμενον ἀπ’ ἀγροῦ, τὸν πατέρα Ἀλεξάνδρου καὶ Ῥούφου, ἵνα ἄρῃ τὸν σταυρὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/021.yaml
  text: And they compelled a certain passerby[a], Simon of Cyrene, who was coming from the country, the father of Alexander and Rufus[c][b], to carry his cross.
translation:
  language: zh_hans
  text: 他们强迫一个正路过的人，就是从乡间来的古利奈人西门——亚历山大和鲁孚的父亲——背耶稣的十字架[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有人认为这里具体指十字架的横木，但希腊原文只说“十字架”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγγαρεύουσιν
  choice: 强迫
  rationale: 该动词指征用人服强制性差役，并非请求；“强迫”自然、明确地保留了其强制意味。
- source_word: παράγοντά τινα
  choice: 有一个路人
  rationale: παράγοντα表示正在经过的人，τινα带有不定意味；“有一个路人”简洁自然，并保留其偶然经过的叙事特征。
- source_word: Σίμωνα Κυρηναῖον
  choice: 古利奈人西门
  rationale: 按现代中文圣经地名和人名的通行表达，既交代姓名，也保留地域身份。
- source_word: ἐρχόμενον ἀπ’ ἀγροῦ
  choice: 从乡下来
  rationale: ἀγρός可指田地、乡间或城外地区；“从乡下来”保留词义范围，也自然表达他正从城外进入的情景。
- source_word: τὸν πατέρα Ἀλεξάνδρου καὶ Ῥούφου
  choice: 他是亚历山大和鲁孚的父亲
  rationale: 忠实保留原文用于辨认西门的同位说明，不进一步推断两人为何为读者所知。
- source_word: ἵνα ἄρῃ
  choice: 让他背
  rationale: ἵνα加虚拟式在强迫类动词之后表达目的或结果；中文以“强迫他背”最自然。
- source_word: σταυρὸν
  choice: 十字架
  rationale: 原文仅用σταυρός，标准对应为“十字架”；不在正文中缩窄为历史重构中的“横木”。
- source_word: αὐτοῦ
  choice: 耶稣的
  rationale: 代词在上下文中指耶稣。中文若仅译“他的”，句内可能误指西门，因此明确为“耶稣的”以避免歧义。
theological_decisions:
- issue: 西门所受差役的性质
  choice: 人们强迫西门背十字架
  alternative: 西门只是受邀或自愿帮忙
  rationale: ἀγγαρεύω明确带有强制征役的含义，译文不应弱化这种叙事力度。
- issue: 西门所背物件的具体形态
  choice: 译作“十字架”
  alternative: 译作“十字架横木”
  rationale: 尽管历史研究可能认为犯人所背的是横木，希腊文本只说σταυρός；正文应保留原文的概括性。
- issue: αὐτοῦ所指对象
  choice: 明确译作“耶稣的”
  alternative: 形式对应地译作“他的”
  rationale: 上下文所指是耶稣；在汉语句法中紧邻的男性人物是西门，直译“他的”容易造成实质歧义，故显明指称而不改变意义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“从乡下来”避免把ἀγρός过度限定为某一块田地；调整分句次序，使西门的身份说明清楚，并避免连续修饰语造成生硬。所有脚注标记均置于相应正文词语之后。
