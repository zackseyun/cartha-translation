  yaml_path: translation/nt/mark/015/009.yaml
  text: But Pilate answered them[a], saying, “Do you want me to release to you the King of the Jews?”
translation:
  language: zh_hans
  text: 彼拉多却回答他们说：“你们要我为你们释放犹太人的王[a]吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“犹太地人的王。”希腊语Ἰουδαίων既可指“犹太人”，也可指“犹太地人”；但在受难叙事的这一固定称号中，译作“犹太人的王”更符合传统和上下文。
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: 却
  rationale: 承接上文并带出轻微转折；“却”自然表现彼拉多回应众人的叙事转向。
- source_word: ἀπεκρίθη αὐτοῖς λέγων
  choice: 回答他们说
  rationale: 保留“回应”及随后引语的结构，同时符合现代汉语叙事表达。
- source_word: Θέλετε
  choice: 你们要……吗
  rationale: 此处表示意愿或愿望；“要”简洁自然，也适合彼拉多向群众发问的语境。
- source_word: ἀπολύσω ὑμῖν
  choice: 我给你们释放
  rationale: ἀπολύω在司法语境中指释放被拘押者；ὑμῖν表明这项释放是应众人的要求、给他们作出的。
- source_word: τὸν βασιλέα τῶν Ἰουδαίων
  choice: 犹太人的王
  rationale: 这是受难叙事中带有政治意味和反讽色彩的固定称号；译文不额外判定说话者是否承认其王权。
- source_word: Ἰουδαίων
  choice: 犹太人
  rationale: 该词可按地域理解为“犹太地人”，也可按族群理解为“犹太人”；在这一固定称号中，“犹太人”符合中文传统用法和上下文。
theological_decisions:
- issue: τὸν βασιλέα τῶν Ἰουδαίων这一称号的性质
  choice: 犹太人的王
  alternative: 犹太地人的王
  rationale: 保留受难叙事中罗马政治称号与叙事反讽之间的张力，不把它改写成译者直接作出的神学宣认。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“给你们释放”略保留原文与格ὑμῖν所表达的受益或关联关系；问句维持彼拉多对群众意愿的询问。脚注标记置于整句引语之后。
