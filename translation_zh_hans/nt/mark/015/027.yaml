base_translation:
  language: en
  yaml_path: translation/nt/mark/015/027.yaml
  text: And with him they crucify two robbers[a], one at his right and one at his left.
translation:
  language: zh_hans
  text: 他们把两个强盗[a]和他一同钉在十字架上，一个在他右边，一个在他左边。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“匪徒”；若此词带有政治意味，也可能指“叛乱者”。
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺν αὐτῷ
  choice: 和他一同
  rationale: σύν加与格表示伴随；“和他一同”自然、明确地表达二人与耶稣一起被钉十字架。
- source_word: σταυροῦσιν
  choice: 钉在十字架上
  rationale: 该词是现在时主动直说语气第三人称复数，属于马可叙事中常见的历史现在时。现代汉语叙事通常不以动词形态区分过去与现在，因此无需生硬添加时态标记，也能保持叙事的直接感。
- source_word: δύο λῃστάς
  choice: 两个强盗
  rationale: λῃστής可指强盗、匪徒，也可能在特定语境中带有叛乱者的政治意味。“强盗”是普通读者易懂且范围较宽的表达，不把本节未明说的政治身份写入正文。
- source_word: ἕνα ἐκ δεξιῶν
  choice: 一个在他右边
  rationale: ἐκ δεξιῶν在此表示右侧的空间位置；“在他右边”符合现代汉语习惯。
- source_word: ἕνα ἐξ εὐωνύμων αὐτοῦ
  choice: 一个在他左边
  rationale: εὐώνυμος在这里与“右边”相对，指左侧；αὐτοῦ自然落实为“他”，并按平行结构用于两处方位。
theological_decisions:
- issue: 受钉者的λῃσταί身份如何表达
  choice: 强盗
  alternative: 匪徒；若按政治意味理解，也可能指叛乱者
  rationale: 该词可指从事暴力劫掠的人，在某些历史语境中也可能与叛乱活动重叠。本节本身不足以确定其政治身份，因此正文采用较宽泛的“强盗”，脚注保留其他可能。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准普通话。“又”承接希腊文句首καί；语序调整为汉语更自然的“把”字句，同时保留同钉、人数及左右位置等全部信息。
