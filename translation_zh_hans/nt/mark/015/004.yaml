  text: ὁ δὲ Πιλᾶτος πάλιν ⸀ἐπηρώτα αὐτὸν λέγων· Οὐκ ἀποκρίνῃ οὐδέν; ἴδε πόσα σου ⸀κατηγοροῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/004.yaml
  text: But Pilate again questioned him, saying, “Do you give no answer? Look how many charges they are bringing against you.”
translation:
  language: zh_hans
  text: 彼拉多又问耶稣：“你什么都不回答吗？你看，他们对你提出了多少指控！”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: （不单独译出）
  rationale: 此处承接叙事并带轻微转折；现代汉语无需机械译作“但是”，上下文已能显出彼拉多针对耶稣沉默而再次发问。
- source_word: πάλιν ἐπηρώτα
  choice: 又问
  rationale: πάλιν 表示再次，ἐπηρώτα 的未完成时可表达持续或反复询问；汉语“又问”自然地呈现重复动作，并符合审讯语境。
- source_word: λέγων
  choice: （用冒号引出直接引语）
  rationale: 希腊语分词是常规的引语引入形式；现代汉语以冒号表达更自然，无需另译“说”。
- source_word: Οὐκ ἀποκρίνῃ οὐδέν;
  choice: 你什么都不回答吗？
  rationale: 保留 οὐκ…οὐδέν 的全然否定及问句的催逼语气，也符合现代汉语表达。
- source_word: ἴδε
  choice: 你看
  rationale: 命令式用于促使耶稣注意当前的指控；“你看”自然、庄重，又不像“看哪”那样略显古旧。
- source_word: πόσα σου κατηγοροῦσιν
  choice: 他们告了你多少事
  rationale: κατηγορέω 在司法语境中指控告、控诉；πόσα 本义为“多少事”，不把其含义完全改写为“多少项罪名”，从而保留原文表达。汉语“告了你多少事”兼顾法庭场景与口语自然度。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。以“彼拉多又问耶稣”补明代词所指，避免汉语中的指代含混；直接引语保留彼拉多催促耶稣回应的语气。
