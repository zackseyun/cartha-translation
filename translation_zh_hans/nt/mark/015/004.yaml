review_pass:
  verdict: revise
  source_fidelity: 草稿准确传达了彼拉多再次发问、耶稣不回答以及控告甚多的基本意思。不过“他们告了你多少事”中的“告了”带有完成体色彩，不够贴合原文现在时；“告……多少事”在现代汉语中也不够自然。
  naturalness: “彼拉多又问耶稣”及前一句问话自然清楚。末句宜改为“他们对你提出了多少指控”，既符合司法语境，也避免“告了你多少事”的搭配和时体问题。
  terminology: κατηγοροῦσιν 在此为司法性的“控告／提出指控”。“指控”是现代标准汉语中准确且庄重的对应语。“多少”保留 πόσα 所强调的数量；脚注保留其较字面的“多少事”表达。
  issues:
  - severity: medium
    issue: “他们告了你多少事”不够自然，且“了”容易造成已完成的语义。
    rationale: κατηγοροῦσιν 为现在时，描写当时正在提出的控告；汉语“告了……多少事”既显得口语搭配生硬，也可能误示控告行为已结束。
  revised_text: 彼拉多又问耶稣：“你什么都不回答吗？你看，他们对你提出了多少指控！”
  revised_footnotes:
  - marker: a
    text: 或译：“你看，他们控告你多少事！”
    reason: 原文 πόσα 直译为“多少事”；在 κατηγοροῦσιν 的司法语境中，正文将其自然表达为“多少指控”。
  revision_rationale: 将末句改为现代汉语中自然、准确的司法表达，并以脚注保留原文“多少事”的较字面措辞。其余措辞保留原有叙事语气和彼拉多催促耶稣回应的语势。
