- from: 彼拉多又问耶稣：“你什么都不回答吗？你看，他们告了你多少事[a]！”
  to: 彼拉多又问耶稣：“你什么都不回答吗？你看，他们对你提出了多少指控！”
  rationale: 将末句改为现代汉语中自然、准确的司法表达，并以脚注保留原文“多少事”的较字面措辞。其余措辞保留原有叙事语气和彼拉多催促耶稣回应的语势。
