  text: καὶ ἦν ἡ ἐπιγραφὴ τῆς αἰτίας αὐτοῦ ἐπιγεγραμμένη· Ὁ βασιλεὺς τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/026.yaml
  text: 'And the inscription of the charge against him was written: “The King of the Jews.”[a]'
translation:
  language: zh_hans
  text: 控告他的罪状牌上写着：“犹太人的王。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“犹太地人的王。”
    reason: 词义也可能侧重地域归属。
lexical_decisions:
- source_word: ἐπιγραφή
  choice: 罪状牌
  rationale: 指十字架上方标明罪名的书面牌子；“罪状牌”在现代汉语中简洁自然，也与后面的属格“罪状”合并表达。
- source_word: αἰτία
  choice: 罪状
  rationale: 此处是司法语境，表示控告或定罪所依据的罪名；“罪状”准确传达其法律含义。
- source_word: ἐπιγεγραμμένη
  choice: 写着
  rationale: 与ἦν构成迂说式结构，表示文字已经写上并处于可见状态；“写着”自然地保留这一状态意义。
- source_word: βασιλεὺς
  choice: 王
  rationale: 这是罪状牌所列的王权称号；汉语无需依靠大小写表示正式头衔。
- source_word: Ἰουδαίων
  choice: 犹太人
  rationale: 在受难叙事中，“犹太人的王”是固定的政治性称号，既自然又为读者熟悉；其可能的地域性译法另见脚注。
theological_decisions:
- issue: 受难罪名中Ἰουδαίων的译法
  choice: 犹太人
  alternative: 犹太地人
  rationale: 这里记述罗马人给耶稣标出的罪名或称号。“犹太人”保留福音书受难叙事中广为人知的表达，不把原文限定为纯粹的地域称呼；鉴于Ἰουδαῖος在某些语境中也可指犹太地人，脚注保留该可能性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“罪状牌上写着”避免生硬直译“罪状的题字被写着”，同时保留牌上文字作为公开指控的含义。
