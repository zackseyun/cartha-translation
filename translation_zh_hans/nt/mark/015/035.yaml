  text: καί τινες τῶν παρεστηκότων ἀκούσαντες ἔλεγον· ⸀Ἴδε Ἠλίαν φωνεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/035.yaml
  text: And some of those standing there[a], when they heard it, were saying, “Look, he is calling Elijah.”
translation:
  language: zh_hans
  text: 有些站在那里的人听见了，就说：“看哪，他在呼唤以利亚。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他在呼求以利亚。”
    reason: φωνεῖ在此既可理解为呼喊某人的名字，也可按语境理解为呼求某人；正文采用较少解释性的译法，脚注保留另一种自然理解。
lexical_decisions:
- source_word: καί
  choice: 就
  rationale: 承接前文，并自然连接听见与说话两个动作；在现代汉语叙事中比直译为“并且”更顺畅，且不额外强化时间含义。
- source_word: τινες
  choice: 有些
  rationale: 准确表达不确定的一部分人，不将其扩大为所有在场者。
- source_word: τῶν παρεστηκότων
  choice: 站在那里的人
  rationale: 保留完成时分词所呈现的在场、站立于现场的具体空间感，同时符合现代汉语表达。
- source_word: ἀκούσαντες
  choice: 听见了
  rationale: 表达先于主要谓语发生的动作；所听见的内容可由上下文得知，无须在中文中补出宾语。
- source_word: ἔλεγον
  choice: 说
  rationale: 中文通常不以形态标示未完成体；“就说”自然传达当时的反应，而不武断地译成反复说或不停地说。
- source_word: Ἴδε
  choice: 看哪
  rationale: 作为引人注意的祈使语，既保留原文的现场感与语气，又庄重且为普通现代读者所理解。
- source_word: Ἠλίαν
  choice: 以利亚
  rationale: 采用中文圣经传统中广为人知的人名译法。
- source_word: φωνεῖ
  choice: 在呼唤
  rationale: 保留现在时的进行意味；“呼唤”可以直接带人名作宾语，不强行加入“求助于”或其他解释。
theological_decisions:
- issue: 是否明确说明在场者误解了耶稣的呼喊，以为他在向以利亚求助
  choice: 正文只保留他们所说的表层陈述：“他在呼唤以利亚”
  alternative: “他在呼求以利亚来帮助他”或“他们以为他在呼唤以利亚”
  rationale: 希腊文直接报道在场者的话，并未由叙述者明说这是误解，也没有说明呼唤的目的；应让上下文呈现其中的误解与张力，不在正文中加以解释。
translation_notes:
  register: 采用自然、庄重的现代标准普通话。“看哪”略带经文语体，但仍清楚易懂，并能传达Ἴδε引人注意的功能。脚注标记置于整句引语之后。
