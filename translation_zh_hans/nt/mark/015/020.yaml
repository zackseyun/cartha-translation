base_translation:
  language: en
  yaml_path: translation/nt/mark/015/020.yaml
  text: And when they had mocked him, they stripped the purple robe off him and put his own clothes on him. And they lead him out to crucify him.
translation:
  language: zh_hans
  text: 他们戏弄完耶稣，就脱下他身上的紫袍[a]，给他穿回他自己的衣服。随后，他们把他带出去，要把他钉十字架[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“紫色的（衣物）”；也可译作“紫色外衣”或“紫色斗篷”。希腊文只说“紫色的”，具体衣物由上下文补出。
    reason: lexical_alternative
  - marker: b
    text: 或译：“为要把他钉十字架。”希腊文在此使用目的从句。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνέπαιξαν αὐτῷ
  choice: 戏弄完耶稣
  rationale: ἐμπαίζω表示以侮辱、嘲讽的方式戏弄人；“戏弄”简洁自然，并保持叙事的庄重。“完”在时间从句中自然体现该动作先于后续行动。
- source_word: ἐξέδυσαν αὐτὸν τὴν πορφύραν
  choice: 脱下他身上的紫袍
  rationale: ἐκδύω指从某人身上脱去衣物；πορφύρα本义为“紫色（之物）”，此处按上下文指先前给耶稣披上的紫色衣物。“紫袍”自然明确，脚注保留原文省略衣物名称的特点。
- source_word: ἐνέδυσαν αὐτὸν τὰ ἱμάτια τὰ ἴδια
  choice: 给他穿回自己的衣服
  rationale: ἐνδύω表示给人穿衣，ἱμάτια泛指衣服，τὰ ἴδια强调是他自己的。“穿回”根据前文恢复原来衣着的情境自然表达动作，但不增加新的事件。
- source_word: ἐξάγουσιν αὐτόν
  choice: 他们把他带出去
  rationale: ἐξάγω表示带领或押带出去。希腊文用历史现在时增强现场感；现代汉语叙事通常不标示时态，“带出去”既自然，也不必人为改成具有时态含义的形式。
- source_word: ἵνα σταυρώσωσιν αὐτόν
  choice: 要把他钉十字架
  rationale: ἵνα加虚拟式在此表达目的。“要把他钉十字架”在现代汉语中自然地保留目的关系；脚注另列更显式的“为要”表达。
- source_word: σταυρώσωσιν
  choice: 钉十字架
  rationale: σταυρόω明确指施行十字架刑；“钉十字架”是准确、通行且易懂的中文表达。
theological_decisions:
- issue: 耶稣受辱并被带去钉十字架的叙事性质
  choice: 直接叙述士兵的戏弄、除去紫袍、换回耶稣自己的衣服，以及把他带出去执行十字架刑。
  alternative: 在正文中明说紫袍是“假扮王者的袍子”，或加入对受难意义的神学解释。
  rationale: 原文在本节只陈述行动；译文保留羞辱情境，却不把上下文推论或后来的神学阐释写入正文。
- issue: ἵνα目的从句
  choice: 译为“要把他钉十字架”，保留行动目的。
  alternative: 译为“于是把他钉了十字架”，把目的写成已经实现的结果。
  rationale: 本句说的是带耶稣出去的目的，而非在本节内叙述钉十字架已经完成；因此不可把目的关系改为结果。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“戏弄”保留侮辱意味；“穿回自己的衣服”清楚呈现与紫袍的对照；“随后”衔接两个希腊文并列句。所有脚注标记均置于正文对应位置。
