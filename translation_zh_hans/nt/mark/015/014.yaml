  source_fidelity: 译文准确保留了彼拉多与众人之间的转折、κακόν的较强道德色彩、περισσῶς所表达的加剧，以及十字架刑的命令。惟“把他钉十字架”在现代汉语中缺少必要的介词结构，需改为“把他钉在十字架上”。“仍对他们说”比“还在问他们”更贴近ἔλεγεν的持续性言说，同时不把该动词限缩为单纯提问。
  naturalness: “为什么呢？他做了什么恶事？”是自然、庄重的现代汉语，既表达γάρ所带的追问/质询作用，也不人为拆成过于突兀的“为什么？”。“越发喊叫”自然传达群众呼喊的升级。
  terminology: “彼拉多”“恶事”“十字架”均符合通行的现代中文圣经术语和叙事语域。“钉在十字架上”是准确且语法完整的刑罚表述。
