  text: ὁ δὲ Πιλᾶτος ἔλεγεν αὐτοῖς· Τί γὰρ ⸂ἐποίησεν κακόν⸃; οἱ δὲ ⸀περισσῶς ἔκραξαν· Σταύρωσον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/014.yaml
  text: But Pilate was saying to them[a], “For what evil has he done?” But they cried out all the more, “Crucify him!”
translation:
  language: zh_hans
  text: 彼拉多仍对他们说：“为什么呢？他做了什么恶事？”他们却越发喊叫：“把他钉在十字架上！”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγεν
  choice: 还在问
  rationale: 未完成时表达持续进行的言说；结合问句内容，译作“还在问”自然呈现彼拉多继续追问的语气，同时不过度断定重复次数。
- source_word: Τί γὰρ ἐποίησεν κακόν
  choice: 为什么？他做了什么恶事？
  rationale: γάρ在此为追问提供理由或反驳语气，汉语用独立的“为什么？”自然传达“究竟有什么理由”的意味；“什么恶事”保留κακόν的道德分量。
- source_word: κακόν
  choice: 恶事
  rationale: 既保留“恶”的道德力度，又以“做了什么恶事”构成自然、庄重的现代汉语搭配。
- source_word: περισσῶς
  choice: 越发
  rationale: 表达群众回应进一步加剧，比单纯的“非常”更准确地呈现递进意味。
- source_word: ἔκραξαν
  choice: 喊叫
  rationale: 传达大声公开呼喊的动作，符合群众场景，且为普通现代读者所熟悉。
- source_word: Σταύρωσον αὐτόν
  choice: 把他钉十字架
  rationale: 直接保留命令语气；“钉十字架”是现代汉语圣经语境中清楚且通行的刑罚表述。
- source_word: δὲ
  choice: 却
  rationale: 两处均体现彼拉多的追问与群众要求之间的对立和转折；汉语“却”简洁自然。
- source_word: Πιλᾶτος
  choice: 彼拉多
  rationale: 采用现代中文圣经中通行的人名音译。
theological_decisions:
- issue: 彼拉多问句中κακόν的道德力度
  choice: 译作“恶事”
  alternative: 译作“错事”或“坏事”
  rationale: “恶事”保留原词在法律与道德指控语境中的较强分量，不弱化彼拉多对处死要求的质疑，也不额外加入关于耶稣无罪的解释性断言。
- issue: γάρ在问句中的功能
  choice: 译作独立追问“为什么？”
  alternative: 省略，译作“他究竟做了什么恶事？”
  rationale: 原文γάρ带有要求对方说明理由的反驳意味；以“为什么？”显明这一功能，同时保留随后问题本身的开放性。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“还在问”呈现未完成时的持续性；“越发喊叫”表现群众呼声升级。全节不添加原文没有明说的法律结论或人物动机。
