  rationale: 修订仅处理中文语法与动词表达：以“仍对他们说”对应未完成时ἔλεγεν，以“为什么呢”自然呈现γάρ的质询语气，并将刑罚命令改为语法完整的“把他钉在十字架上”。其余措辞保留原稿对转折、道德力度和呼喊升级的准确处理。
