  text: ὁ δὲ Ἰησοῦς ἀφεὶς φωνὴν μεγάλην ἐξέπνευσεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/037.yaml
  text: But Jesus[a], uttering a loud cry[b], breathed his last.
translation:
  language: zh_hans
  text: 耶稣却大喊一声[a]，断了气[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“发出一声响亮的呼喊”或“发出洪亮的声音”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“咽了气”或直接译作“死了”；原文动词含有“呼出气息”的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: 却
  rationale: δέ是轻微的连接词；这里用“却”自然承接上文，并体现叙事在耶稣临终时的转折，而不赋予过强的对立意味。
- source_word: ἀφεὶς
  choice: 喊
  rationale: ἀφίημι与φωνή连用时，表示发出声音。汉语“大喊一声”已自然包含“发出”的动作，无须生硬直译为“释放”。
- source_word: φωνὴν μεγάλην
  choice: 大喊一声
  rationale: φωνή可指声音、嗓音或呼喊；μεγάλη在这里表示声音强烈、响亮。结合受难叙事，“大喊一声”既自然，也保留了突然而有力的发声。
- source_word: ἐξέπνευσεν
  choice: 断了气
  rationale: ἐκπνέω字面与呼气有关，在此惯用为死亡。“断了气”是现代汉语中庄重而清楚的叙事表达，并保留呼吸停止的身体意象，避免加入“交出灵魂”等原文未明说的神学含义。
- source_word: ὁ δὲ Ἰησοῦς
  choice: 耶稣却
  rationale: 希腊语专名之前的冠词不需在汉语中另译；将连接词置于主语之后，符合现代汉语语序。
theological_decisions:
- issue: 如何叙述耶稣的死亡而不加入额外的神学解释
  choice: 断了气
  alternative: 死了；交出了灵魂
  rationale: “断了气”准确传达ἐξέπνευσεν在此处“停止呼吸而死”的含义，并保留其身体意象。“死了”较为概括；“交出了灵魂”则容易与其他福音书的措辞调和，加入本节动词本身没有明确表达的含义。
translation_notes:
  register: 采用现代、简洁而庄重的叙事语言。“大喊一声”比“发出宏大的声音”自然，“断了气”则保留原文呼吸意象。脚注标记分别紧随其所说明的短语，避免歧义。
