base_translation:
  language: en
  yaml_path: translation/nt/mark/015/036.yaml
  text: Then someone ran[a], filled a sponge with sour wine, put it on a reed, and gave him a drink, saying, “Leave him alone[b]. Let us see whether Elijah is coming to take him down.”
translation:
  language: zh_hans
  text: 有人跑过去，把一块海绵蘸满酸酒[a]，放在一根芦苇杆上，给他喝，说：“别管他[b]！我们看看以利亚会不会来把他取下来。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “酸酒”指一种廉价而酸涩的酒饮，不一定是现代意义上用作调味品的食醋。
    reason: cultural_note
  - marker: b
    text: 或译：“等一等！”
    reason: lexical_alternative
lexical_decisions:
- source_word: δραμὼν
  choice: 跑去
  rationale: 不定过去时分词表示叙事中的先行动作；用“跑去”自然衔接随后的一连串动作。
- source_word: τις καὶ
  choice: 有一个人
  rationale: τις指身份未明的某个人；καί在此不必生硬译成“也”，以免暗示经文没有明确表达的另一位行动者。
- source_word: γεμίσας σπόγγον ὄξους
  choice: 把海绵蘸满酸酒
  rationale: ὄξος指酸涩的廉价酒饮或酒醋；“酸酒”既保留酒类背景，也避免现代“食醋”所带来的误解。“蘸满”符合海绵吸取液体的自然汉语表达。
- source_word: περιθεὶς καλάμῳ
  choice: 安在芦苇杆上
  rationale: κάλαμος是芦苇或芦苇杆；“安在”自然表达把海绵放置、固定于杆上，又不过度说明具体固定方式。
- source_word: ἐπότιζεν αὐτόν
  choice: 递给他喝
  rationale: 未完成时呈现供饮的进行性或尝试性；“递给他喝”在汉语叙事中自然，并保留让耶稣饮用的动作，不武断判定他实际喝了多少。
- source_word: Ἄφετε
  choice: 先别管他
  rationale: 此处命令式可表示暂且放着、不加干预；加“先”体现说话人要等着观察的语境。其也可惯用地理解为“等一等”，故以脚注保留。
- source_word: ἴδωμεν εἰ ἔρχεται Ἠλίας
  choice: 我们看看以利亚会不会来
  rationale: 保留“让我们看看”的共同观察语气，并以“会不会来”自然表达εἰ引出的未定结果及ἔρχεται的临近感。
- source_word: καθελεῖν αὐτόν
  choice: 把他取下来
  rationale: καθαιρέω在钉十字架的场景中指从高处、即从十字架上取下；“取下来”准确而自然。
theological_decisions:
- issue: Ἄφετε所表达的说话人意图
  choice: 正文译作“先别管他”，理解为暂时不要干预耶稣，好观察以利亚是否会来。
  alternative: “等一等”
  rationale: 该命令既可按ἀφίημι的基本语义理解为“别管／由他”，也可在此语境中惯用地表示“等一下”。正文保留前者，脚注保留后者，不把语境歧义消解掉。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。动作链用简洁动词推进；“酸酒”和“芦苇杆”保留历史场景，“先别管他”及脚注共同保存原文命令语的歧义。
