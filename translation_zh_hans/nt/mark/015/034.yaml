  text: καὶ τῇ ⸂ἐνάτῃ ὥρᾳ⸃ ἐβόησεν ὁ Ἰησοῦς φωνῇ ⸀μεγάλῃ· Ἐλωῒ ἐλωῒ ⸀λεμὰ σαβαχθάνι; ὅ ἐστιν μεθερμηνευόμενον Ὁ θεός μου ὁ θεός μου, εἰς τί ⸂ἐγκατέλιπές με⸃;
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/034.yaml
  text: And at the ninth hour Jesus cried out with a loud voice[a], “Eloi, Eloi, lema sabachthani?” which is translated, “My God, my God[c][b], for what reason have you forsaken me?”
translation:
  language: zh_hans
  text: 到了第九个小时[a]，耶稣大声呼喊：“以罗伊！以罗伊！利马·撒巴克大尼？”[b]翻译出来是：“我的上帝！我的上帝！你为什么离弃我？”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “第九个小时”按当时通常从日出计时的方式，约为下午三点。
    reason: historical_context
  - marker: b
    text: 有些抄本和许多译经传统作“拉马·撒巴克大尼”，而非“利马·撒巴克大尼”。
    reason: textual_variant
  - marker: c
    text: 耶稣的话呼应《诗篇》22:1。
    reason: cross_reference
lexical_decisions:
- source_word: τῇ ἐνάτῃ ὥρᾳ
  choice: 到了第九个小时
  rationale: 保留马可所用的古代计时表达，不在正文中直接换算为现代时间；按当时通常算法，约为下午三点。
- source_word: ἐβόησεν ὁ Ἰησοῦς φωνῇ μεγάλῃ
  choice: 耶稣大声呼喊
  rationale: 将动词与方式短语自然合译，既表达声音响亮，也保持受难叙事的庄重语气。
- source_word: Ἐλωῒ ἐλωῒ λεμὰ σαβαχθάνι
  choice: 以罗伊！以罗伊！利马·撒巴克大尼？
  rationale: 依照马可的叙述方式，先音译保留闪语呼喊，再给出译义；“利马”对应SBLGNT的λεμά，不与马太的形式协调。
- source_word: μεθερμηνευόμενον
  choice: 这句话翻译出来就是
  rationale: 明确表明后文是前述闪语的翻译，现代汉语自然易懂。
- source_word: Ὁ θεός μου ὁ θεός μου
  choice: 我的上帝！我的上帝！
  rationale: 准确保留重复呼告及其强烈情感，并与诗篇22:1的回响相呼应。
- source_word: εἰς τί
  choice: 为什么
  rationale: 该短语在此询问原因；“为什么”是现代汉语最自然且准确的表达，同时不额外限定为目的或原因类别。
- source_word: ἐγκατέλιπές με
  choice: 离弃我
  rationale: “离弃”准确表达被撇下、被弃置的含义，也保留庄重的经文语感和诗篇回响。
theological_decisions:
- issue: 耶稣的呼喊与诗篇22:1的关系
  choice: 正文保留直接而强烈的被离弃之问，脚注指出诗篇回响，不在正文中解释其神学含义。
  alternative: 弱化“离弃”的含义，或在正文中说明圣父与圣子的关系。
  rationale: 原文让真实呼喊与经文回响并存；译文应保存这种张力，而不代替经文作教义性调和。
- issue: 耶稣所说闪语的呈现
  choice: 正文先音译原话，再依马可所附的希腊语解释给出汉译。
  alternative: 只保留汉译，或改用马太式“以利！以利！”
  rationale: 这种安排忠实保留马可刻意记录声音形式并随后翻译的结构，也避免将马可与马太协调。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“上帝”用于θεός；音译词以感叹号体现重复呼告，以问号结束整句疑问。所有脚注标记均置于正文相关句末。
