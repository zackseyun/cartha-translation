  text: “救你自己，从十字架上下来！”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σῶσον
  choice: 救救
  rationale: 这是第二人称单数不定过去时命令式，在此构成讥讽性的命令。“救救”是现代汉语中自然直接的表达，既可指脱离眼前危难，也保留了与“拯救”观念的联系；重叠形式符合当面嘲讽的口吻。
- source_word: σεαυτόν
  choice: 你自己
  rationale: 反身代词作σῶσον的直接宾语。“你自己”准确保留了嘲讽中让耶稣自救的针对性。
- source_word: καταβάς
  choice: 从……下来吧
  rationale: 这是καταβαίνω的不定过去时主动分词，依附于命令式，既可理解为伴随动作，也可带有方式或条件色彩。汉语用“下来吧”自然呈现嘲讽性的挑战；脚注说明其形式上并非另一个命令式，并保留其他句法理解。
- source_word: ἀπὸ τοῦ σταυροῦ
  choice: 从十字架上
  rationale: 介词短语表示离开十字架的动作。“从十字架上”是受难语境中准确而自然的现代汉语表达。
theological_decisions:
- issue: 分词καταβάς与命令式σῶσον之间的关系
  choice: 正文译作“救救你自己，从十字架上下来吧”，以自然汉语呈现紧密相连的讥讽性挑战。
  alternative: “从十字架上下来，救救你自己吧”或“救救你自己，也就是从十字架上下来”
  rationale: 希腊文以命令式接不定过去时分词，关系较为压缩，可能表示伴随动作、方式，或在语用上近似第二个命令。正文不明确加入“借着”之类较强的工具性连接词，脚注则保留这种句法张力。
translation_notes:
  register: 采用现代、庄重而口语自然的表达。引号体现这是对耶稣的直接讥讽；“救救”比单说“救”更符合普通话命令句习惯，同时不削弱原文的救赎词汇联系。
