  text: καὶ ἀγοράσας ⸀σινδόνα καθελὼν αὐτὸν ἐνείλησεν τῇ σινδόνι καὶ ⸀ἔθηκεν αὐτὸν ἐν ⸀μνημείῳ ὃ ἦν λελατομημένον ἐκ πέτρας, καὶ προσεκύλισεν λίθον ἐπὶ τὴν θύραν τοῦ μνημείου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/046.yaml
  text: And after buying a linen cloth[a], he took him down, wrapped him in the linen cloth, and laid him in a tomb that had been cut out of rock[c][b]. Then he rolled a stone against the entrance of the tomb.
translation:
  language: zh_hans
  text: 他买了细麻布[a]，把耶稣取下来，用细麻布裹好，安放在一座从岩石中凿出的坟墓里[b]，又把一块石头滚到坟墓的入口处，挡住入口[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “细麻布”也可译作“麻布单”或“裹尸布”。
    reason: lexical_alternative
  - marker: b
    text: “从岩石中凿出的”也可译作“在岩石中凿成的”。
    reason: lexical_alternative
  - marker: c
    text: “入口”原文也可理解为“门口”。
    reason: lexical_alternative
lexical_decisions:
- source_word: σινδόνα / σινδόνι
  choice: 细麻布 / 细麻布
  rationale: σινδών指麻质布料，在此用于裹尸。“细麻布”保留材质和用途，又不把它限定为专门制作的裹尸布。第二次出现时，中文不必机械添加指示词。
- source_word: καθελών
  choice: 把耶稣取下来
  rationale: καθαιρέω在此指把耶稣的身体从十字架上取下。原文代词所指清楚，中文直称“耶稣”可避免“把他取下来”在单节语境中的指代含混，但不增添动作细节。
- source_word: ἐνείλησεν
  choice: 裹好
  rationale: 该动词意为包裹、裹住。“裹好”自然地表达完成的包裹动作，符合安葬语境。
- source_word: ἔθηκεν
  choice: 安放
  rationale: τίθημι意为放置；“安放”在安葬语境中庄重自然，又没有额外引入仪式含义。
- source_word: μνημείῳ / μνημείου
  choice: 坟墓
  rationale: μνημεῖον在本节指安葬遗体的墓穴。“坟墓”是现代普通读者容易理解的标准表达，并与后文岩石凿成的结构相符。
- source_word: λελατομημένον ἐκ πέτρας
  choice: 从岩石中凿出的
  rationale: 完成时被动分词表示坟墓处于已经凿成的状态；“从岩石中凿出”准确保留其材料、来源及人工开凿之意。
- source_word: προσεκύλισεν
  choice: 滚过
  rationale: 动词含朝向某处滚动之意。“滚过一块石头，挡住……”以自然中文表达石头被滚到墓口前的动作及结果。
- source_word: ἐπὶ τὴν θύραν τοῦ μνημείου
  choice: 挡住坟墓的入口
  rationale: θύρα可指门或入口；就岩石墓穴而言，“入口”较自然。ἐπί与移动动作在语境中表示把石头滚到墓口处，“挡住”清楚表达关闭墓穴的作用。
- source_word: ἀγοράσας
  choice: 买了
  rationale: 不定过去时分词表示购买先于随后动作。中文以连动顺序“买了……取下来……”自然呈现这一先后关系。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。按希腊文动作顺序组织句子，以连贯中文呈现多个分词和主要动词；不额外说明十字架或遗体，但以“耶稣”明确原文代词的所指。所有词义备选均以脚注标明。
