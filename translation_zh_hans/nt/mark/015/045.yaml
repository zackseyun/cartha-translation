base_translation:
  language: en
  yaml_path: translation/nt/mark/015/045.yaml
  text: And after learning from the centurion[a], he granted the body to Joseph.
translation:
  language: zh_hans
  text: 他从百夫长那里得知后，就准许将遗体[a]交给约瑟。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“尸体”或“尸身”。
    reason: lexical_alternative
lexical_decisions:
- source_word: γνοὺς
  choice: 得知后
  rationale: 该不定过去时分词在这里表达时间和伴随情境，表明后面的行动发生在获得消息之后；“得知后”简洁自然，也不补出原文未明说的宾语。
- source_word: ἀπὸ τοῦ κεντυρίωνος
  choice: 从百夫长那里
  rationale: ἀπό加属格表示消息来源；“百夫长”是现代中文读者熟悉且较准确的罗马军职称谓。
- source_word: ἐδωρήσατο
  choice: 准许……交给
  rationale: 该词不仅表示给予，也可带有恩准、准予之意；本处涉及彼拉多正式批准交出遗体，因此译为“准许……交给”比单纯的“给”更贴合语境，同时比“赐给”更自然。
- source_word: πτῶμα
  choice: 遗体
  rationale: 该词明确指尸体或死者的身体；“遗体”在现代中文叙事中庄重自然，脚注保留更直白的词义。
- source_word: τῷ Ἰωσήφ
  choice: 给约瑟
  rationale: 与格标明接受者；在“交给约瑟”中自然表达这一关系。
