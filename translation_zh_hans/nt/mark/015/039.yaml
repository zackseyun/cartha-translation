  text: ἰδὼν δὲ ὁ κεντυρίων ὁ παρεστηκὼς ἐξ ἐναντίας αὐτοῦ ὅτι ⸀οὕτως ἐξέπνευσεν εἶπεν· Ἀληθῶς ⸂οὗτος ὁ ἄνθρωπος⸃ υἱὸς ⸂θεοῦ ἦν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/039.yaml
  text: When the centurion[a], who was standing opposite him, saw that he breathed his last in this way, he said, “Truly this man was God's Son.”
translation:
  language: zh_hans
  text: 站在耶稣对面的百夫长，看见他这样断了气，就说：“这个人真是上帝的儿子[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“上帝的一个儿子。”希腊语这个表达可作性质性理解，也可理解为不定指；但在马可福音的语境中，它很可能具有“上帝的儿子”这一称号的含义。
    reason: 保留υἱὸς θεοῦ在语法和语境解释上的真实歧义。
lexical_decisions:
- source_word: ἰδὼν δὲ
  choice: 看见……就
  rationale: 以时间关系表达不定过去时分词ἰδών；δέ仅作轻微承接，汉语无需另加表示强转折的连词。
- source_word: κεντυρίων
  choice: 百夫长
  rationale: 这是罗马军队该级军官在中文圣经及一般历史语境中的标准称谓。
- source_word: ὁ παρεστηκὼς ἐξ ἐναντίας αὐτοῦ
  choice: 那个面对着耶稣站着的
  rationale: 既保留παρεστηκώς所表示的既有站立姿态，也准确传达ἐξ ἐναντίας的相对、面对位置；为避免中文代词连续造成指代不清，将αὐτοῦ明示为“耶稣”。
- source_word: ὅτι οὕτως ἐξέπνευσεν
  choice: 他这样断了气
  rationale: “断了气”自然表达ἐκπνέω既有呼气又指死亡的含义；“这样”保留οὕτως，指出百夫长所见的是耶稣死去的方式。
- source_word: Ἀληθῶς
  choice: 真是
  rationale: 在直接宣告中自然、庄重地表达“确实、真实”的强调语气。
- source_word: οὗτος ὁ ἄνθρωπος
  choice: 这个人
  rationale: 直接而自然地保留指示词及对耶稣作为一个人的称呼。
- source_word: υἱὸς θεοῦ
  choice: 上帝的儿子
  rationale: 中文属格结构不强行补入希腊文没有明示的冠词，同时在马可叙事语境中能够承载“上帝之子”这一称号的含义；原文在定指、性质和不定解读之间的张力由脚注说明。
- source_word: ἦν
  choice: 是
  rationale: 中文系词本身不标时态；在引语的叙事环境中，“是”自然对应希腊文未完成过去时ἦν，无须生硬添加“曾经”。
theological_decisions:
- issue: 百夫长所说υἱὸς θεοῦ的语义力度
  choice: 上帝的儿子
  alternative: 上帝的一个儿子
  rationale: 无冠词的希腊语谓语名词可有性质性或不定性理解，但在马可福音的整体叙事中，“上帝的儿子”具有显著的基督论称号作用。正文采用能保留这一作用、又不额外添加汉语定冠词的表达，并在脚注中保留另一种语法上可能的理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“面对着耶稣站着”清楚呈现场景位置；“断了气”比“死了”更贴近ἐξέπνευσεν的呼吸意象，也避免过度文言化。
