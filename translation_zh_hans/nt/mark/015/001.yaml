  text: Καὶ ⸀εὐθὺς πρωῒ συμβούλιον ποιήσαντες οἱ ἀρχιερεῖς μετὰ τῶν πρεσβυτέρων καὶ γραμματέων καὶ ὅλον τὸ συνέδριον δήσαντες τὸν Ἰησοῦν ἀπήνεγκαν καὶ ⸀παρέδωκαν Πιλάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/001.yaml
  text: And immediately[a], early in the morning, the chief priests held a consultation with the elders and scribes and the whole council; then they bound Jesus, led him away, and handed him over to Pilate.
translation:
  language: zh_hans
  text: 清早，祭司长立刻同长老、经学家和全体议会[a]举行商议；随后他们把耶稣捆绑起来，押走，交给彼拉多。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译为“全体公会”。原文所用的词指犹太人的统治议事机构，通常称为“公会”（Sanhedrin）。
    reason: 说明历史机构名称及可采用的传统译法。
lexical_decisions:
- source_word: εὐθὺς πρωῒ
  choice: 清早一到……就
  rationale: 以自然的现代汉语同时表达“清早”和随即采取行动的紧迫感，保留马可叙事中 εὐθὺς 的推进作用。
- source_word: συμβούλιον ποιήσαντες
  choice: 商议
  rationale: 该短语指共同议事或磋商；“商议”简洁自然，也不把原文过度限定为另行召集会议或仅仅制订计划。
- source_word: ἀρχιερεῖς
  choice: 祭司长
  rationale: 复数在此指居领导地位的祭司权贵，并非多位同时在任的大祭司；“祭司长”是准确而通行的译法。
- source_word: πρεσβυτέρων
  choice: 长老
  rationale: 语境所指是得到承认的群体领袖，而不只是年长者。
- source_word: γραμματέων
  choice: 经学家
  rationale: 指研习、解释宗教律法的专业人士；“经学家”较“文士”更便于现代普通读者理解，又避免扩展为原文未明说的完整职能描述。
- source_word: ὅλον τὸ συνέδριον
  choice: 全体议会
  rationale: 译出这一犹太统治议事机构的性质，而非只作音译；“全体”保留 ὅλον 的范围表达。
- source_word: δήσαντες
  choice: 捆绑起来
  rationale: 直接表达耶稣在被带走前遭到捆绑的动作。
- source_word: ἀπήνεγκαν
  choice: 押走
  rationale: 在拘押语境中，“押走”自然表达受看守而被带离；不采用可能令人误以为抬走或搬运的直译。
- source_word: παρέδωκαν
  choice: 交给
  rationale: 清楚表达把耶稣正式移交给罗马长官彼拉多，同时不额外加入本节未明说的神学解释。
- source_word: Πιλάτῳ
  choice: 彼拉多
  rationale: 采用现代中文圣经及历史叙述中通行的人名译法。
theological_decisions:
- issue: συνέδριον 所指的机构
  choice: 正文译为“全体议会”
  alternative: 全体公会（Sanhedrin）
  rationale: 此词是历史制度用语，并非需要在正文中音译的教义术语。意译能让普通读者直接明白其机构性质，同时在脚注保留传统名称。
- issue: 受难叙事中 παρέδωκαν 的含义
  choice: 译为“交给”，表达司法和拘押权的移交
  alternative: 交付／解送
  rationale: 该动词在受难叙事中具有重要的反复作用，但本节明确表达的是把耶稣移交彼拉多；译文保留这一动作，不把更广泛的神学含义预先写入正文。
translation_notes:
  register: 采用庄重而流畅的现代标准汉语。“清早一到……就”兼顾时间与叙事紧迫感；“经学家”比传统的“文士”更透明；“押走”符合拘押场景。句子分为商议和移交两句，使动作次序清晰，同时不消解原文中祭司长、长老、经学家与“全体议会”并列所形成的轻微重叠。
