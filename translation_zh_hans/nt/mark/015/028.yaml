translation:
  language: zh_hans
  text: 经上[a]所说的话应验了：“他被列在不法之人中。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节不见于现存最早的一些希腊文抄本（包括四世纪的《西奈抄本》和《梵蒂冈抄本》）以及早期科普特文译本，但见于拜占庭多数文本传统和拉丁文传统。它很可能是后来的抄写员参照路加福音22:37所补入的；该处引用了以赛亚书53:12。
    reason: textual_critical
lexical_decisions:
- source_word: πληρόω（ἐπληρώθη）
  choice: 应验了
  rationale: 这里是被动形式，主语为“经上所说的这句话”，指圣经的话得到实现；“应验”是现代汉语圣经语境中自然且准确的表达。
- source_word: ἄνομος（ἀνόμων）
  choice: 不法之人
  rationale: 该词字面指不遵守律法、违背律法的人。“不法之人”既保留其律法和神学色彩，也避免将含义收窄为一般刑事意义上的“罪犯”。
- source_word: λογίζομαι（ἐλογίσθη）
  choice: 被列在……当中
  rationale: 该被动形式在这里表示被算入或归入某一类人。“被列在……当中”自然地表达他与不法之人同列，同时保留分类、计入的含义。
- source_word: γραφή
  choice: 经上所说的这句话
  rationale: γραφή在此指具有权威的圣经话语；结合后面的分词短语“所说的”，译为“经上所说的这句话”符合现代汉语表达。
theological_decisions:
- issue: 引文中ἀνόμων的身份与性质
  choice: 不法之人
  alternative: 罪犯／犯法的人
  rationale: 原词强调与律法相违，不必限定为经司法定罪的罪犯；译文保留这一较宽且带有神学张力的意义。
- issue: 经文实现的表述
  choice: 经上所说的这句话应验了
  alternative: 这段经文得以成全了
  rationale: “应验”清楚表达先前圣经话语在事件中实现，但不额外说明实现的机制或神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“于是”承接钉十字架叙事；引文保留原文句首的“他”，不擅自明确其身份。脚注标记置于正文连接词之后。
