  text: καὶ ἔτυπτον αὐτοῦ τὴν κεφαλὴν καλάμῳ καὶ ἐνέπτυον αὐτῷ, καὶ τιθέντες τὰ γόνατα προσεκύνουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/019.yaml
  text: And they were striking his head with a reed and spitting on him[a], and kneeling down they were bowing down to him.
translation:
  language: zh_hans
  text: 他们不断用芦苇击打他的头，也不断向他吐唾沫；又屈膝向他下拜[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “下拜”或译“敬拜”。这个希腊文动词可以表示“俯伏在……面前”“向……致敬”或“敬拜”；这里描写的是士兵讥诮地模仿向君王表示尊荣。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτυπτον
  choice: 一再……打
  rationale: 未完成时在叙事中表示持续或反复的动作；“一再……打”自然地传达士兵反复击打耶稣的头，而不额外强化动词本身的力度。
- source_word: αὐτοῦ τὴν κεφαλήν
  choice: 他的头
  rationale: 按现代汉语的自然领属表达翻译。
- source_word: καλάμῳ
  choice: 用芦苇
  rationale: κάλαμος通常指芦苇或芦苇制成的棍状物；“芦苇”既贴近原词，也保留与本段戏弄场景中道具的联系。
- source_word: ἐνέπτυον αὐτῷ
  choice: 向他吐唾沫
  rationale: 准确表达带与格宾语的动作方向；与前面的“一再”共同呈现未完成时所指的持续、反复凌辱。
- source_word: τιθέντες τὰ γόνατα
  choice: 跪下来
  rationale: 原文直译为“放下双膝”，是表示跪下的惯用语；此译法符合现代汉语。
- source_word: προσεκύνουν αὐτῷ
  choice: 向他下拜
  rationale: προσκυνέω可指俯伏、致敬或敬拜；“下拜”保留身体俯拜和向王致敬的含义，又不把士兵的讥诮行为直接解释为真诚敬拜。
theological_decisions:
- issue: 讥诮场景中προσκυνέω的译法
  choice: 向他下拜
  alternative: 敬拜他；俯伏在他面前
  rationale: 上下文表明士兵是在戏仿向君王致敬。“下拜”符合这一叙事情境，同时借脚注保留该词可表示“敬拜”的词义范围和经文中的反讽张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“一再”传达两个未完成时动词所呈现的反复动作；“跪下来向他下拜”保留原文中跪下与下拜两个相连但并不完全相同的动作。
