  text: καὶ τὸ καταπέτασμα τοῦ ναοῦ ἐσχίσθη εἰς δύο ἀπ’ ἄνωθεν ἕως κάτω.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/038.yaml
  text: And the curtain of the temple was torn in two[b][a], from top to bottom.
translation:
  language: zh_hans
  text: 圣殿[b]的幔子[a]裂成两半，从上到下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译作“帘子”。
    reason: lexical_alternative
  - marker: b
    text: 这里译作“圣殿”的希腊语，也可更具体地指内殿，即圣所。
    reason: lexical_alternative
lexical_decisions:
- source_word: καταπέτασμα
  choice: 幔子
  rationale: 指圣殿中的悬挂帘幕。“幔子”既保留具体形象，也符合庄重而通俗的现代汉语；脚注列出“帘子”这一更日常的译法。
- source_word: ναοῦ
  choice: 圣殿
  rationale: ναός在此可以较具体地指圣殿内部的圣所，但“圣殿”在正文中更自然、易懂；脚注保留“内殿（圣所）”这一较具体的词义可能。
- source_word: ἐσχίσθη
  choice: 裂成
  rationale: 这是σχίζω的不定过去时被动式，表明幔子发生了撕裂。汉语用不标明施事者的“裂成”表达自然，也不擅自说明是谁使它裂开。
- source_word: εἰς δύο
  choice: 两半
  rationale: 准确表达分成两部分，简洁而符合现代汉语习惯。
- source_word: ἀπ’ ἄνωθεν ἕως κάτω
  choice: 从上到下
  rationale: 自然地保留撕裂的方向和完整范围。
- source_word: καὶ
  choice: 承接上下文，不另译
  rationale: καί在此是简单的叙事连接词。现代汉语可借句序自然承接前文，无须机械译为“并且”或添加更强的时间意味。
theological_decisions:
- issue: 圣殿幔子裂开的潜在象征意义
  choice: 正文只叙述幔子裂开的事件，不解释其象征意义。
  alternative: 可解释为通往上帝的道路开启，或解释为对圣殿制度的审判。
  rationale: 本节本身没有明说这一事件的神学含义；译文应保留叙事事实和解释空间，不把后来的神学理解写入正文。
translation_notes:
  register: 采用简洁、庄重且易懂的现代标准汉语。句式紧凑，保留原文“从上到下”的空间强调；不补出撕裂者，也不在正文中解释事件的象征意义。
