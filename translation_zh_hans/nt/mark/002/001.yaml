  text: Καὶ ⸀εἰσελθὼν πάλιν εἰς Καφαρναοὺμ δι’ ⸀ἡμερῶν ἠκούσθη ὅτι ⸂ἐν οἴκῳ⸃ ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/001.yaml
  text: And when he entered Capernaum again after some days[a], it was heard that he was at home.
translation:
  language: zh_hans
  text: 过了些日子，耶稣又进了迦百农；人们听说他在家里[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在屋里。”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθὼν
  choice: 进了
  rationale: 不定过去时分词与主句构成时间关系；汉语结合“过了些日子”自然表达先后，无须机械译出分词形式。
- source_word: πάλιν
  choice: 又
  rationale: 简洁自然地表达再次进入、返回之意。
- source_word: Καφαρναούμ
  choice: 迦百农
  rationale: 采用现代中文圣经读者熟悉的标准地名译法。
- source_word: δι’ ἡμερῶν
  choice: 过了些日子
  rationale: 表达若干日子之后这一不确定的时间间隔，贴近原文且符合现代汉语。
- source_word: ἠκούσθη
  choice: 有人听说
  rationale: 希腊文为非人称式被动表达消息传开；汉语用“有人听说”自然传达这一报道语气。
- source_word: ἐν οἴκῳ
  choice: 在家里
  rationale: 该短语可指“在家”或较一般的“在屋里”；正文采用语境中自然的“在家里”，脚注保留更字面的可能。
- source_word: ἐστίν
  choice: 在
  rationale: 原文在间接话语中使用现在时；汉语“听说他在……”不必按叙事过去时改变时态，仍自然清楚。
theological_decisions:
- issue: ἐν οἴκῳ究竟表示“在家里”还是一般性的“在屋里”
  choice: 在家里
  alternative: 在屋里
  rationale: 此处主要是词义和语境上的歧义，并非教义判断。“在家里”符合迦百农叙事场景和现代汉语习惯，但原文没有明确说明房屋归属，因此以脚注保留较字面的译法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“过了些日子……又……”清楚呈现时间推进；分号连接返回迦百农与消息传开的两层叙事。
