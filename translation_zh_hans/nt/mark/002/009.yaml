  text: τί ἐστιν εὐκοπώτερον, εἰπεῖν τῷ παραλυτικῷ· ⸀Ἀφίενταί σου αἱ ἁμαρτίαι, ἢ εἰπεῖν· ⸀Ἔγειρε καὶ ἆρον ⸂τὸν κράβαττόν σου⸃ καὶ περιπάτει;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/009.yaml
  text: 'Which is easier: to say to the paralyzed man[a], ‘Your sins are forgiven,’ or to say, ‘Get up, pick up your mat, and walk’?”'
translation:
  language: zh_hans
  text: 对瘫痪的人说：‘你的罪得赦免了’，或是说：‘起来，拿起你的褥子，走吧’，哪一样更容易呢？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί ἐστιν εὐκοπώτερον
  choice: 哪一样更容易呢
  rationale: 保留比较问句的语气；放在两个选项之后，更符合现代汉语的自然语序。
- source_word: εἰπεῖν
  choice: 说
  rationale: 两次均引出直接引语，译作“说”简洁准确。
- source_word: τῷ παραλυτικῷ
  choice: 对瘫痪的人
  rationale: 清楚表达其身体状况，同时避免生硬或标签化的名词称呼。
- source_word: Ἀφίενταί σου αἱ ἁμαρτίαι
  choice: 你的罪得赦免了
  rationale: “得赦免了”自然表达现今成立的赦免状态，也不明确补出施事者；句末“了”兼顾宣告的完成与当前结果。
- source_word: ἁμαρτίαι
  choice: 罪
  rationale: “罪”是此处 ἁμαρτίαι 的标准、合乎上下文的汉语表达；汉语通常无需显明复数。
- source_word: Ἔγειρε
  choice: 起来
  rationale: 自然直接地表达起身的命令。
- source_word: ἆρον
  choice: 拿起
  rationale: 表达把物件提起并带走，在此语境中自然具体。
- source_word: τὸν κράβαττόν σου
  choice: 你的褥子
  rationale: κράβαττος 指可携带的简陋卧具；“褥子”比现代意义上较笨重的“床”更贴切。
- source_word: περιπάτει
  choice: 走吧
  rationale: 在连续命令中自然表达行走；“吧”使汉语命令句顺畅，不削弱命令效力。
theological_decisions:
- issue: 赦罪宣告的时态与语态
  choice: 你的罪得赦免了
  alternative: 你的罪蒙赦免了／你的罪正在得赦免
  rationale: 希腊文 ἀφίενταί 为现在时被动或中间形式，重点可落在赦免已经成立的现状。“得赦免了”保留被动表达，不补明赦罪的施事者，也不把它限定为持续进行的过程，从而维持叙事中不可见的赦罪与可见的医治之间的张力。
translation_notes:
  register: 采用现代、庄重而口语可懂的问句。“褥子”体现简便可携的卧具；全句依汉语习惯先列两个选项，再问“哪一样更容易呢”。
