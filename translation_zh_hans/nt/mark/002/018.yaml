  text: Καὶ ἦσαν οἱ μαθηταὶ Ἰωάννου καὶ οἱ ⸀Φαρισαῖοι νηστεύοντες. καὶ ἔρχονται καὶ λέγουσιν αὐτῷ· Διὰ τί οἱ μαθηταὶ Ἰωάννου καὶ οἱ ⸀μαθηταὶ τῶν Φαρισαίων νηστεύουσιν, οἱ δὲ σοὶ μαθηταὶ οὐ νηστεύουσιν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/018.yaml
  text: John's disciples and the Pharisees were fasting. And they come and say to him[a], "Why do John's disciples and the disciples of the Pharisees fast, but your disciples do not fast?"
translation:
  language: zh_hans
  text: 约翰的门徒和法利赛人正在禁食。有人来问他[a]：“为什么约翰的门徒和法利赛人的门徒禁食，你的门徒却不禁食呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文没有明说“来”和“说”的主语；也可译作“他们来对他说”。
    reason: 保留希腊文中行动者身份未明的含混。
lexical_decisions:
- source_word: ἦσαν ... νηστεύοντες
  choice: 正在禁食
  rationale: 未完成时的εἰμί与现在分词构成迂回结构，表示过去正在持续的行动；“正在禁食”自然地保留了这一体貌。
- source_word: οἱ μαθηταὶ Ἰωάννου
  choice: 约翰的门徒
  rationale: 属格表示归属或关联；此译法准确、自然。
- source_word: οἱ Φαρισαῖοι
  choice: 法利赛人
  rationale: 采用现代中文圣经语境中通行的群体名称。
- source_word: ἔρχονται καὶ λέγουσιν
  choice: 有人来对他说
  rationale: 两个动词是马可常用的历史现在时；现代汉语叙事中按上下文自然表达。希腊文没有明说主语，因此不指定具体群体。
- source_word: Διὰ τί
  choice: 为什么
  rationale: 以现代汉语最自然的疑问表达准确传达原因询问。
- source_word: οἱ μαθηταὶ τῶν Φαρισαίων
  choice: 法利赛人的门徒
  rationale: 保留属格关系，不把他们直接等同于法利赛人本身。
- source_word: νηστεύουσιν
  choice: 禁食
  rationale: 现在时在疑问中可表达惯常做法；简洁的“禁食”同时适合与“不禁食”形成对照。
- source_word: οἱ δὲ σοὶ μαθηταὶ
  choice: 你的门徒却
  rationale: “你的门徒”表达所属关系，“却”清楚传达δέ所标示的对比。
theological_decisions:
- issue: “来对他说”的行动者身份
  choice: 正文译作泛指的“有人”，不指明具体是哪一群人
  alternative: 译作“他们来对他说”，可能让读者把主语明确理解为前句的约翰门徒和法利赛人
  rationale: 希腊文ἔρχονται καὶ λέγουσιν没有明说主语。采用泛指表达可避免擅自认定来问话者的身份，同时以脚注说明原文的句法含混。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“正在禁食”交代当时持续的情形；问句中的“禁食／不禁食”则可自然表达惯常实践。脚注标记已置于正文对应位置。
