source:
  edition: SBLGNT
  text: Καὶ ⸀γίνεται κατακεῖσθαι αὐτὸν ἐν τῇ οἰκίᾳ αὐτοῦ, καὶ πολλοὶ τελῶναι καὶ ἁμαρτωλοὶ συνανέκειντο τῷ Ἰησοῦ καὶ τοῖς μαθηταῖς αὐτοῦ, ἦσαν γὰρ πολλοὶ καὶ ⸀ἠκολούθουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/015.yaml
  text: And it happened that he was reclining at table in his house[a], and many tax collectors and sinners were reclining with Jesus and his disciples, for there were many, and they were following him.
translation:
  language: zh_hans
  text: 有一次，耶稣在他家里[a]坐席，许多税吏和罪人同耶稣和他的门徒一同坐席；因为有许多人跟随他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在利未家里”；也有人理解为“在耶稣家里”。希腊文只说“在他家里”。
    reason: 保留所有格代词先行词的原文歧义。
lexical_decisions:
- source_word: γίνεται
  choice: 后来
  rationale: 这是马可叙事中推进情节的历史现在时；用现代汉语的叙事衔接语自然表达事件的发生和推进。
- source_word: κατακεῖσθαι
  choice: 坐席
  rationale: 指当时进餐时斜倚的姿势和用餐场景；“坐席”是自然、庄重的现代汉语圣经表达，避免误解为普通躺卧。
- source_word: ἐν τῇ οἰκίᾳ αὐτοῦ
  choice: 在他家里
  rationale: 直译所有格代词，并保留“他”所指对象在希腊文中的歧义。
- source_word: τελῶναι
  choice: 税吏
  rationale: 简洁表达替统治当局征收税款的人，是现代中文圣经语境中清楚而通行的称呼。
- source_word: ἁμαρτωλοὶ
  choice: 罪人
  rationale: 直接保留原文的宗教与社会标签，不在正文中改释为某一种特定类别。
- source_word: συνανέκειντο
  choice: 一同坐席
  rationale: 兼顾共同进餐的场景与复合动词所表达的相伴关系。
- source_word: μαθηταῖς
  choice: 门徒
  rationale: 新约中通行而准确的称呼，保留学习者与追随者的关系含义。
- source_word: ἦσαν γὰρ πολλοί
  choice: 这样的人很多
  rationale: γάρ说明为何席间有许多税吏和罪人；“这样的人”按近接语境回指他们，比孤立的“他们很多”更符合现代汉语。
- source_word: ἠκολούθουν αὐτῷ
  choice: 一直跟随他
  rationale: 以“一直”体现未完成过去时所呈现的持续或惯常行动，同时不把“跟随”削弱为偶然同行。
theological_decisions:
- issue: “他家里”（αὐτοῦ）的所指
  choice: 正文保留“他家里”，不明确屋主
  alternative: 利未家里；耶稣家里
  rationale: 希腊文只使用第三人称所有格代词，其先行词可能理解为上文的利未，也有人理解为耶稣。正文不应替原文消除歧义，因此将两种理解列入脚注。
- issue: “罪人”的性质
  choice: 保留原文标签“罪人”
  alternative: 被视为罪人的人；不守宗教规条的人
  rationale: 上下文可能带有社会与宗教分类意味，但原文直接称其为ἁμαρτωλοί；扩写会预先限定叙述者或相关群体的评价角度。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“坐席”自然指向共同用餐；分号保留后半句的解释关系。正文中的脚注标记[a]与脚注对应。
