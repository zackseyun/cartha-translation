  naturalness: “坐席”及整体叙事语体自然、庄重。“有一次”更适合现代汉语中引出此事件；将末句调整为“因为有许多人跟随他”可清楚呈现解释关系，且不强加“一直”的时间含义。
  terminology: “税吏”“罪人”“门徒”“坐席”均为准确、通行且符合经文语域的用语。“在他家里”妥善保留αὐτοῦ的歧义，脚注也完整反映了可行理解。
