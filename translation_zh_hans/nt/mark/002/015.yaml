  to: 有一次，耶稣在他家里[a]坐席，许多税吏和罪人同耶稣和他的门徒一同坐席；因为有许多人跟随他。
  rationale: 修订以“有一次”自然呈现马可的叙事性事件引入；保留“坐席”所指的共同用餐场景及“他家里”的歧义。末句改为明确的“因为”结构，以对应γάρ，并删除“一直”以免将ἠκολούθουν的未完成过去时限定为原文未明说的不间断持续。
