  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἀκούσας ὁ Ἰησοῦς λέγει αὐτοῖς ⸀ὅτι Οὐ χρείαν ἔχουσιν οἱ ἰσχύοντες ἰατροῦ ἀλλ’ οἱ κακῶς ἔχοντες· οὐκ ἦλθον καλέσαι δικαίους ἀλλὰ ⸀ἁμαρτωλούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/017.yaml
  text: And when Jesus heard it, he says to them, “Those who are strong have no need of a physician, but those who are sick. I did not come to call the righteous, but sinners.”
translation:
  language: zh_hans
  text: 耶稣听见了，就对他们说：“强健的人[a]不需要医生，有病的人才需要。我来不是要召义人[b]，而是要召罪人。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“健康的人”；希腊文直指强健或身体状况良好的人。
    reason: lexical_alternative
  - marker: b
    text: “义人”在本段语境中可能带有反讽，指被视为义人或自认为义的人；但希腊原文只说“义人”。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας
  choice: 听见了
  rationale: 以自然的汉语时间顺序表达先于主句动作的过去时分词；所听见的内容由上文补足，不另加具体宾语，以免过度解释。
- source_word: λέγει
  choice: 说
  rationale: 希腊文是叙事性历史现在时；现代汉语动词本身不标时态，“说”既自然，也不必将其明确改写为过去时。
- source_word: οἱ ἰσχύοντες
  choice: 强健的人
  rationale: 保留ἰσχύω“有力量、强健”的基本词义，同时在医生的比喻中可自然理解为身体健康；脚注列出更解释性的译法。
- source_word: χρείαν ἔχουσιν
  choice: 不需要
  rationale: 准确而自然地表达“没有需要”这一希腊语习语。
- source_word: ἰατροῦ
  choice: 医生
  rationale: 现代标准汉语中最普通、清楚的对应词，符合医疗比喻，也不过分古雅。
- source_word: οἱ κακῶς ἔχοντες
  choice: 有病的人
  rationale: 该习语字面为“状况不好的人”，在医疗语境中通常指患病者；“有病的人”清楚地呈现此义。
- source_word: καλέσαι
  choice: 召
  rationale: 保留“叫来、召来”的宽泛意义及使命语境中的庄重感，不擅自限定为邀请、命令或呼召悔改。
- source_word: δικαίους
  choice: 义人
  rationale: 简洁保留原文的道德与宗教类别，不在正文中改写为“自以为义的人”。
- source_word: ἁμαρτωλούς
  choice: 罪人
  rationale: 这是该名词化形容词在福音书语境中的直接、通行译法。
theological_decisions:
- issue: “义人”是否带有反讽
  choice: 正文直译为“义人”，并用脚注提示语境中的可能理解
  alternative: 译为“自以为是义人的人”或“被人看作义人的人”
  rationale: 上下文可能使这句话带有反讽，但希腊文本身只说“义人”。正文保留这一神学张力，不把某一种解释写进经文。
- issue: “召”是否应明确补出召去做什么
  choice: 只译为“召”
  alternative: 译为“召人悔改”或“召来作门徒”
  rationale: 本节原文没有明说所召的目的；不从相关经文或神学体系补入内容。
- issue: 是否明确补出耶稣听见的对象
  choice: 译为“耶稣听见了”，不明说所听见的是哪一句话或哪场议论
  alternative: 译为“耶稣听见他们的话”
  rationale: 希腊文省略宾语，语境虽可补足，但中文无需强制添加，因此保留原文的简略表达。
translation_notes:
  register: 采用现代、清楚而庄重的普通话。“强健的人”略带格言色彩，贴近原文字面；“医生”“有病的人”保持日常可懂。“召”比“召唤”凝练，也避免把原文未说明的目的写入正文。
