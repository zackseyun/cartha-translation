  text: ἵνα δὲ εἰδῆτε ὅτι ἐξουσίαν ἔχει ὁ υἱὸς τοῦ ἀνθρώπου ⸂ἐπὶ τῆς γῆς ἀφιέναι ἁμαρτίας⸃— λέγει τῷ παραλυτικῷ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/010.yaml
  text: But so that you may know that the Son of Man has authority on earth to forgive sins—he says to the paralyzed man[b][a],
translation:
  language: zh_hans
  text: 但为了让你们知道，人子[a]在地上有赦罪的权柄——他对瘫痪的人[b]说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人子”也可按希腊语习语理解为“人”或“那人”。这一称号也可能暗指《但以理书》7章。
    reason: alternative_reading
  - marker: b
    text: 或译：“瘫子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα δὲ
  choice: 但为了让你们知道
  rationale: “但”体现 δέ 在论述中的轻微转折，“为了”保留 ἵνα 所引出的目的；整句符合现代汉语表达。
- source_word: εἰδῆτε
  choice: 让你们知道
  rationale: 直接表达目的从句中的认知含义，并与接下来作为明证的医治行动衔接。
- source_word: ἐξουσίαν ἔχει
  choice: 有……的权柄
  rationale: ἐξουσία 在此强调合法的权限和资格，而不只是做某事的能力；“权柄”也保留本句的神学分量。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人子
  rationale: “人子”是汉语圣经传统中清楚可辨的称号，既不抹去其与人的关联，也保留其可能指向《但以理书》7章的意味。
- source_word: ἐπὶ τῆς γῆς
  choice: 在地上
  rationale: 自然表达其空间范围，并保留与天上领域形成潜在对照的可能。
- source_word: ἀφιέναι ἁμαρτίας
  choice: 赦罪
  rationale: 在此语境中，ἀφίημι 指免除、赦免罪；“赦罪”简洁、准确，也是现代汉语中通行的宗教表达。
- source_word: λέγει τῷ παραλυτικῷ
  choice: 他对瘫痪的人说
  rationale: παραλυτικός 在此作名词使用；“瘫痪的人”比标签化的“瘫子”更自然、尊重，也准确说明其状况。“说”在汉语中无需标记希腊语历史现在时。
theological_decisions:
- issue: 耶稣称号 ὁ υἱὸς τοῦ ἀνθρώπου 的译法
  choice: 人子
  alternative: 那位人／人的那一位
  rationale: 采用公认称号“人子”，保留其普通人性用语与《但以理书》7章异象背景之间的张力，不把它单向解释为某一种身份主张。
- issue: ἐξουσία 与赦罪的关系
  choice: 有赦罪的权柄
  alternative: 有赦罪的能力／有赦罪的权利
  rationale: 上下文所要证明的是耶稣赦罪的合法权限，不仅是实行某种行动的能力；“权柄”最能保留这一主张。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“但为了”保留转折与目的关系；破折号呈现原文句法中断，冒号则自然引出下一节耶稣所说的话。所有脚注标记均置于正文对应词语之后。
