  text: ⸀καὶ συνήχθησαν πολλοὶ ὥστε μηκέτι χωρεῖν μηδὲ τὰ πρὸς τὴν θύραν, καὶ ἐλάλει αὐτοῖς τὸν λόγον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/002.yaml
  text: And many were gathered together[a], so that there was no longer room, not even at the door, and he was speaking the word to them.
translation:
  language: zh_hans
  text: 许多人聚集在一起，以致再也没有地方容得下人，连门口附近也没有空位；耶稣向他们讲论这道[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“信息”。原文为“话语”（logos）；“道”保留其较直接、庄重的表达。
    reason: 说明 λόγος 可指所传讲的信息，同时保留正文“道”的词汇对应，且不补入原文未明说的所属关系。
lexical_decisions:
- source_word: συνήχθησαν πολλοὶ
  choice: 许多人聚集起来
  rationale: 以自然汉语表达不定过去时被动形式所描述的聚集结果；“聚集起来”也体现 συν- 所含的共同聚拢之意，而不生硬强译被动语态。
- source_word: ὥστε μηκέτι χωρεῖν
  choice: 甚至……都没有空地了
  rationale: ὥστε 引出实际结果，μηκέτι 表示原有空间已经耗尽；汉语用“甚至……都……了”自然连接结果并体现状态变化。
- source_word: μηδὲ τὰ πρὸς τὴν θύραν
  choice: 连门口
  rationale: 该短语指朝向门的地方或门边区域；“连门口都没有空地”准确且符合现代汉语表达。
- source_word: ἐλάλει αὐτοῖς
  choice: 就向他们讲
  rationale: 未完成时表示当时持续进行的言说；汉语语境中“向他们讲”可自然呈现这一过程，无须机械添加“正在”。
- source_word: τὸν λόγον
  choice: 道
  rationale: “道”是汉语圣经语域中对 λόγος 的凝练对应，在此表示耶稣所宣讲的话或信息，同时不擅自补入原文未明说的“上帝的”。脚注保留较通俗的词义替代。
- source_word: αὐτός（隐含主语）
  choice: 耶稣
  rationale: 希腊语动词第三人称单数的主语由上文确定为耶稣；汉语补明姓名可避免因前句“许多人”而产生主语误读。
theological_decisions:
- issue: τὸν λόγον 在耶稣言说语境中的含义
  choice: 道
  alternative: 信息；上帝的道
  rationale: “道”既贴近 λόγος 的传统语义，又可指所宣讲的信息；不译作“上帝的道”，因为本节没有明说其所属关系，也不把含义限定为某种后来的教义术语。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“空地”清楚表达房内乃至门口均已无可容人的空间；分号呈现拥挤结果与耶稣讲道之间的场景推进。
