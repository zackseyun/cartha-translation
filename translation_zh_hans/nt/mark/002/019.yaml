  text: καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Μὴ δύνανται οἱ υἱοὶ τοῦ νυμφῶνος ἐν ᾧ ὁ νυμφίος μετ’ αὐτῶν ἐστιν νηστεύειν; ὅσον χρόνον ⸂ἔχουσιν τὸν νυμφίον μετ’ αὐτῶν⸃ οὐ δύνανται νηστεύειν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/019.yaml
  text: And Jesus said to them[a], “The wedding guests cannot fast while the bridegroom is with them, can they? As long as they have the bridegroom with them, they cannot fast.”
translation:
  language: zh_hans
  text: 耶稣对他们说：“新郎和宾客在一起的时候，宾客怎能禁食呢？[a]只要新郎还和他们在一起，他们就不能禁食。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “宾客”原文直译为“婚房之子”或“婚宴之子”，是指参加婚礼庆典的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ δύνανται ... νηστεύειν;
  choice: 怎能禁食呢？
  rationale: μή加陈述语气构成预期否定回答的反问；“怎能……呢”自然传达这种语力，同时保留问句形式。
- source_word: οἱ υἱοὶ τοῦ νυμφῶνος
  choice: 宾客
  rationale: 该短语直译为“婚房之子”或“婚宴之子”，是指参与婚礼庆典之人的习语。“宾客”在现代汉语中清楚自然，也避免把范围过度缩窄为伴郎或新郎随从。
- source_word: ἐν ᾧ ... ἐστιν
  choice: ……在一起的时候
  rationale: 此处主要表达时间关系，而非空间关系；这样译符合现代汉语习惯。
- source_word: ὁ νυμφίος / τὸν νυμφίον
  choice: 新郎
  rationale: “新郎”是现代汉语中自然、明确的对应词，并保留原文的婚礼隐喻。
- source_word: μετ’ αὐτῶν
  choice: 和他们在一起
  rationale: μετά加属格表示陪伴；此译直接传达同在之意。
- source_word: ὅσον χρόνον
  choice: 只要……还……
  rationale: 该表达强调持续的时段；“只要……还……”既自然，又清楚体现时间延续。
- source_word: ἔχουσιν τὸν νυμφίον μετ’ αὐτῶν
  choice: 新郎还和他们在一起
  rationale: 汉语若直译为“他们拥有新郎和他们在一起”极不自然；用存在式表达准确传达ἔχουσιν在此语境中的关系含义。
- source_word: καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς
  choice: 耶稣对他们说
  rationale: 采用自然、庄重的汉语叙事引语格式；句首καί在本节独立呈现时无需机械译作“于是”或“又”。
theological_decisions:
- issue: 耶稣以新郎意象指向自己
  choice: 保留“新郎”隐喻，不在正文中明说其神学含义
  alternative: 用解释性译法凸显弥赛亚或神与子民关系的意象
  rationale: 原文借新郎形象说话，却未在本句中直接阐释其完整神学意义；译文应保留意象及其张力，不代替读者作进一步解释。
translation_notes:
  register: 采用现代、庄重且口语可懂的标准普通话。“怎能……呢”保留反问语气；第二句用“只要……还……”自然呈现持续时间。脚注标记紧接相关句子，说明原文习语。
