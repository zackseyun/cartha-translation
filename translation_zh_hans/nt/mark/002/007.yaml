  text: Τί οὗτος οὕτως λαλεῖ; ⸀βλασφημεῖ· τίς δύναται ἀφιέναι ἁμαρτίας εἰ μὴ εἷς ὁ θεός;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/007.yaml
  text: Why does this man speak like this? He is blaspheming! Who can forgive sins except God alone?[a][b]
translation:
  language: zh_hans
  text: “这个人为什么这样说话？他是在亵渎！除了独一的上帝以外，谁能赦免罪呢？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“除了上帝以外，谁能赦免罪呢？”也可理解为：“只有上帝能赦免罪。”
    reason: alternative_reading
lexical_decisions:
- source_word: Τί ... οὕτως λαλεῖ
  choice: 为什么这样说话
  rationale: Τί在这一问句中表达对其如此说话之缘由或根据的质问；译作“为什么”比字面的“什么”更符合现代汉语，同时保留οὕτως“这样”的修饰作用。
- source_word: οὗτος
  choice: 这个人
  rationale: 指向耶稣并带有疏离语气；“这个人”自然准确，又不把轻蔑程度夸大为“这家伙”。
- source_word: βλασφημεῖ
  choice: 他说了亵渎的话
  rationale: 表达文士针对耶稣当下言论所作的严厉宗教指控；此译在现代汉语中自然，并保留“亵渎”的神学分量。
- source_word: ἀφιέναι ἁμαρτίας
  choice: 赦免罪
  rationale: ἀφίημι与ἁμαρτίας连用，在此明确表示赦罪；“赦免罪”是准确而通行的汉语表达。
- source_word: εἰ μὴ εἷς ὁ θεός
  choice: 除了独一的上帝以外
  rationale: εἰ μή表达排除，εἷς ὁ θεός可理解为“上帝 alone”或“独一的上帝”；正文采用自然且贴近希腊语结构的“独一的上帝”，并以脚注保留另一种表达。
theological_decisions:
- issue: οὗτος是否应译出更强烈的蔑视
  choice: 这个人
  alternative: 这家伙
  rationale: 上下文显出敌意和疏离，但希腊语本身不要求加入更强的辱蔑色彩，因此不宜强化。
- issue: βλασφημεῖ的指控力度
  choice: 他说了亵渎的话
  alternative: 他在亵渎上帝
  rationale: 原文没有明说亵渎的直接宾语；正文保留指控本身，不替文士补明对象，也不提前化解叙事中的基督论张力。
- issue: εἰ μὴ εἷς ὁ θεός中εἷς的关系
  choice: 除了独一的上帝以外
  alternative: 除了上帝以外，谁也不能
  rationale: 正文保留εἷς与ὁ θεός相连而产生的“独一的上帝”读法；脚注说明也可按强调排他性理解为“只有上帝”。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。问句保持文士内心质问的直接力度；使用“上帝”对应ὁ θεός，并避免添加原文未明说的宾语或贬称。
