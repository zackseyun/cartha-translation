  text: ὥστε κύριός ἐστιν ὁ υἱὸς τοῦ ἀνθρώπου καὶ τοῦ σαββάτου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/028.yaml
  text: So the Son of Man is Lord even of the Sabbath[a].
translation:
  language: zh_hans
  text: 所以，人子甚至是安息日的主[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“所以，人子也是安息日的主。”希腊语连接词也可译为“也”；但这里很可能有递进意味，可译为“甚至”，强调人子权柄所及的范围。
    reason: 词义存在合理替代译法；正文采用递进理解，脚注保留普通附加义。
lexical_decisions:
- source_word: ὥστε
  choice: 所以
  rationale: 引出由上文论证所得的结论；“所以”自然、清楚地表达推论关系。
- source_word: κύριος
  choice: 主
  rationale: 此处作表语，表示权柄和主权；“主”既简洁，也保留了这句话的基督论分量。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人子
  rationale: 保留福音书中耶稣这一固定称谓及其可能的互文和基督论含义，不将其泛化为普通的“人”。
- source_word: καὶ
  choice: 连……也
  rationale: 这里很可能具有递进意味，强调人子的主权甚至延伸到安息日；现代汉语用“连……也”自然表达这种强调。
- source_word: σαββάτου
  choice: 安息日
  rationale: 这是该犹太圣日的通行中文名称，也与上下文关于安息日行为的争议相符。
theological_decisions:
- issue: 人子对安息日拥有权柄这一宣告的基督论力度
  choice: 直译为人子“是主”，保留强烈的主权宣告。
  alternative: 弱化为“在人如何守安息日的事上有权柄”。
  rationale: κύριος本身表达“主”的身份或地位，不只是某方面有限的许可；译文不增添解释，也不削弱原文。
- issue: “人子”的所指
  choice: 保留“人子”作为耶稣的称谓。
  alternative: 译为泛指的“人”或“那位人”。
  rationale: 在《马可福音》中，该表达作为耶稣的自称发挥作用，并保留可能的但以理书背景；译文不应替读者消解这一张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“连安息日也是主”略带强调，忠实呈现καί可能的递进用法；脚注保留“也是安息日的主”这一较中性的句法选择。
