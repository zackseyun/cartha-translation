  text: Σοὶ λέγω, ⸀ἔγειρε ἆρον τὸν κράβαττόν σου καὶ ὕπαγε εἰς τὸν οἶκόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/011.yaml
  text: I say to you[a], get up, pick up your mat[b], and go to your house.
translation:
  language: zh_hans
  text: 我对你说：起来，拿起你的褥子[a]，到你家去[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“铺盖”或“睡垫”。希腊语κράβαττος指简陋、可搬动的睡卧用具。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“回家去”。希腊语直译为“到你的家（房屋）去”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Σοὶ λέγω
  choice: 我对你说
  rationale: Σοὶ置于句首而带有强调，中文用“我对你说”自然保留直接针对这人的语气；不额外加入“亲自”等原文没有的意思。
- source_word: ἔγειρε
  choice: 起来
  rationale: 不定过去时命令式，表示立即起身；“起来”是现代汉语中清楚、直接的命令。
- source_word: ἆρον
  choice: 拿起
  rationale: 不定过去时命令式，指把身边的物件拿起来；“拿起”准确表现具体动作，也与后面的行走命令衔接自然。
- source_word: κράβαττόν
  choice: 褥子
  rationale: 指简陋、可搬动的睡卧用具，而非带床架的床。“褥子”在现代汉语中能表达可卷起或搬走的铺卧之物，并避免“担架”的医疗含义。
- source_word: ὕπαγε
  choice: 去
  rationale: 命令式动词，表示离开并前往某处；结合目的地译为“回……去”，符合现代汉语表达。
- source_word: εἰς τὸν οἶκόν σου
  choice: 回你家
  rationale: 原文直指“你的家/房屋”为目的地。按语境此人是回到自己的家，译作“回你家”既自然，也保留了第二人称所属关系。
theological_decisions:
- issue: 耶稣医治命令的语气和效力
  choice: 译为一连串直接、权威的命令：“起来，拿起……回……去”
  alternative: 采用较庄重或古雅的措辞，如“起来，拿你的床，往你家里去”
  rationale: 原文突出耶稣对这人发出的直接命令，但本节本身没有附加解释其神学机制。译文保留命令的力度和次序，不加入原文未明说的神学阐释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我对你说”保留直接称呼；“褥子”避免让读者误以为是带床架的固定床具；“回你家去”在中文中自然表达原文的方向和所属关系。
