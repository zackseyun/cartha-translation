  text: καὶ ἠγέρθη ⸂καὶ εὐθὺς⸃ ἄρας τὸν κράβαττον ἐξῆλθεν ⸀ἔμπροσθεν πάντων, ὥστε ἐξίστασθαι πάντας καὶ δοξάζειν τὸν θεὸν λέγοντας ὅτι ⸂Οὕτως οὐδέποτε⸃ εἴδομεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/012.yaml
  text: And he got up[a], and immediately picked up the mat and went out before them all, so that they were all amazed and glorified God, saying, “We have never seen anything like this.”
translation:
  language: zh_hans
  text: 他就起来，立刻拿起褥子，当着众人的面走了出去，以致众人都惊奇不已，归荣耀给上帝，说：“这样的事，我们从来没有见过！”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“我们从未这样见过。”这句希腊语的意思是，他们从未见过这样的事。
    reason: 保留原文惯用语较字面的形式，并说明其自然含义。
lexical_decisions:
- source_word: ἠγέρθη
  choice: 起来
  rationale: 在医治瘫子的叙事中，指那人依照耶稣的吩咐起身；“起来”自然准确，也不在此处额外强化复活意味。
- source_word: εὐθύς
  choice: 立刻
  rationale: 保留马可叙事中鲜明的即时性和紧迫感。
- source_word: ἄρας
  choice: 拿起
  rationale: 自然表达把褥子提起并带走的动作，也与后面的“走了出去”衔接顺畅。
- source_word: κράβαττον
  choice: 褥子
  rationale: 指简陋、可卷起携带的卧具；“褥子”比“床”更符合物件可由一人拿走的语境，也不像“担架”那样加入额外解释。
- source_word: ἔμπροσθεν πάντων
  choice: 当着众人的面
  rationale: 自然表达这件事在所有人眼前公开发生，保留其公开见证的意味。
- source_word: ὥστε ἐξίστασθαι πάντας
  choice: 以致众人都惊奇不已
  rationale: “以致”保留结果关系；“惊奇不已”传达ἐξίστημι所表达的强烈震惊，而不采用生硬的字面说法。
- source_word: δοξάζειν τὸν θεόν
  choice: 归荣耀给上帝
  rationale: 贴近δοξάζω的含义，并保留荣耀明确归向上帝这一圣经表达。
- source_word: Οὕτως οὐδέποτε εἴδομεν
  choice: 这样的事，我们从来没有见过
  rationale: 以自然现代汉语表达希腊语惯用语的意思，即他们所见之事前所未有；脚注同时保留较直译的形式。
theological_decisions:
- issue: ἠγέρθη可能带有的复活联想
  choice: 译作“起来”
  alternative: “被扶起”或带复活色彩的“复起”
  rationale: 此处直接语境是瘫子得医治后按命令起身。译文保留身体起身的本义，不把其他语境中的复活神学含义强加于本节。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“他就起来”承接前文动作；“当着众人的面”突出公开性；全句保留原文由“以致”连接的结果结构。
