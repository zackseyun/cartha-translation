base_translation:
  language: en
  yaml_path: translation/nt/mark/002/013.yaml
  text: And he went out again beside the sea[a], and the whole crowd was coming to him[c][b], and he was teaching them.
translation:
  language: zh_hans
  text: 耶稣又出去，来到海边[a]。众人都到他那里来[b]，他也教导他们。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“沿着海边。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“全体群众都到他那里来。”
    reason: lexical_alternative
  - marker: c
    text: “来”和“教导”在希腊原文中均为未完成时，可以表示过去一段时间内持续或反复进行的动作。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: 出去
  rationale: ἐξέρχομαι的简单过去时自然译为“出去”；上下文已表明主语是耶稣，不增添原文未明说的出发地点。
- source_word: πάλιν
  choice: 又
  rationale: 自然表达动作再次发生，比“再一次”更简洁流畅。
- source_word: παρὰ τὴν θάλασσαν
  choice: 来到海边
  rationale: παρά加宾格在这里表达移向并处于海边；“来到海边”与“出去”衔接自然，同时保留临海位置。
- source_word: πᾶς ὁ ὄχλος
  choice: 众人都
  rationale: 该结构指整个群众；现代汉语用“众人都”比直译“整个群众”更自然。
- source_word: ἤρχετο
  choice: 到他那里来
  rationale: 保留πρός所表达的朝向耶稣而来的意义；汉语本身不以动词形态标示过去进行体，持续情状由语境和脚注说明。
- source_word: πρὸς αὐτόν
  choice: 到他那里
  rationale: 清楚表达朝向并来到耶稣所在之处，比单说“向他”更符合汉语搭配。
- source_word: ἐδίδασκεν
  choice: 他就教导
  rationale: “教导”准确对应διδάσκω；“就”自然连接群众前来与耶稣施教，但不把未完成时过度译成“不断教导”。
- source_word: αὐτούς
  choice: 他们
  rationale: 指回前面的众人，是直接而清楚的代词表达。
