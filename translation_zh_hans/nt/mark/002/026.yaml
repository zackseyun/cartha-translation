source:
  edition: SBLGNT
  text: ⸀πῶς εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ ἐπὶ Ἀβιαθὰρ ἀρχιερέως καὶ τοὺς ἄρτους τῆς προθέσεως ἔφαγεν, οὓς οὐκ ἔξεστιν φαγεῖν εἰ μὴ ⸂τοὺς ἱερεῖς⸃, καὶ ἔδωκεν καὶ τοῖς σὺν αὐτῷ οὖσιν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/026.yaml
  text: how he entered into the house of God in the time of Abiathar the high priest[a], and ate the bread of the Presence, which it is not lawful to eat except for the priests[b], and also gave some to those who were with him?
translation:
  language: zh_hans
  text: 他在大祭司亚比亚他的时候[a]，怎样进了上帝的殿，吃了陈设饼[b]；这饼除了祭司以外，别人都不可吃；他还把饼给了跟他在一起的人？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在亚比亚他任大祭司期间”。这句话也可能较宽泛地指与大祭司亚比亚他有关的时代或叙事背景。
    reason: alternative_reading
  - marker: b
    text: “陈设饼”是放在圣所中、陈设在上帝面前的圣饼。
    reason: cultural_note
lexical_decisions:
- source_word: πῶς
  choice: 怎样
  rationale: 引出耶稣所述大卫所做之事，保留原文叙事性问句的表达。
- source_word: εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ
  choice: 进了上帝的殿
  rationale: οἶκος τοῦ θεοῦ直译为“上帝的家/房屋”，但在此祭祀场景中，“上帝的殿”更符合现代汉语习惯，也不把所指限定为后来建成的圣殿。
- source_word: ἐπὶ Ἀβιαθὰρ ἀρχιερέως
  choice: 在大祭司亚比亚他的时候
  rationale: ἐπί加属格可表达时间背景；此译保留较宽泛的时间关联，避免强行断定事情发生在亚比亚他任大祭司期间。
- source_word: ἄρτους τῆς προθέσεως
  choice: 陈设饼
  rationale: 采用汉语圣经传统中较为熟悉的礼仪用语，并以脚注说明它是陈设在上帝面前的圣饼。
- source_word: ἔφαγεν
  choice: 吃了
  rationale: 自然对应不定过去时的叙事动作。
- source_word: οὓς οὐκ ἔξεστιν φαγεῖν
  choice: 这饼……不可吃
  rationale: ἔξεστιν表示许可或合法性；“不可吃”在汉语中简洁表达礼仪法规所不许可之事。
- source_word: εἰ μὴ τοὺς ἱερεῖς
  choice: 除了祭司以外，别人都
  rationale: 明确传达只有祭司获准食用的例外关系，同时使汉语句法完整自然。
- source_word: ἔδωκεν καὶ τοῖς σὺν αὐτῷ οὖσιν
  choice: 他还把饼给了跟他在一起的人
  rationale: 明示由上下文省略的宾语“饼”，并贴近“那些与他同在的人”的原文结构。
theological_decisions:
- issue: 亚比亚他时间短语与《撒母耳记上》21章平行记载之间的张力
  choice: 正文译作“在大祭司亚比亚他的时候”
  alternative: “在亚比亚他任大祭司期间”或“在记载大祭司亚比亚他的那一段”
  rationale: 希腊语短语可表达与亚比亚他有关的较宽泛时间或叙事背景。正文不将其收窄为精确任职期，也不在翻译中消解它与旧约记载之间的张力；脚注保留其他可能理解。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“上帝的殿”自然表达神圣场所；“陈设饼”保留通行的礼仪术语并用脚注解释。句末作为承接上一节的问句处理，正文保留全角句号前的整体疑问语气可由上下文体现；出版排版时宜与2:25合并审读标点。
