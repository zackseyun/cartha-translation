  text: καὶ οἱ Φαρισαῖοι ἔλεγον αὐτῷ· Ἴδε τί ⸀ποιοῦσιν τοῖς σάββασιν ὃ οὐκ ἔξεστιν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/024.yaml
  text: And the Pharisees were saying to him[a], “Look, why are they doing what is not permitted on the Sabbath?”
translation:
  language: zh_hans
  text: 法利赛人对他说：“看，他们为什么在安息日做不被许可的事？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“看，他们在安息日做什么不被许可的事？”希腊文的τί可以理解为“什么”，不过按上下文很可能是“为什么”的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: 就
  rationale: 承接前文并推动叙事；现代汉语用“就”比机械译作“和”更自然，同时不增添强烈的时间含义。
- source_word: οἱ Φαρισαῖοι
  choice: 法利赛人
  rationale: 采用现代中文圣经及一般宗教语境中通行的群体名称。
- source_word: ἔλεγον
  choice: 对他说
  rationale: 未用“说了”这类完成体表达，保留未完成过去时可表示当时正在说或反复提出的开放性；汉语上下文中“对他说”自然清楚。
- source_word: Ἴδε
  choice: 看哪
  rationale: 保留引人注意并带有责问意味的命令语气；“看哪”庄重且仍为普通读者所理解。
- source_word: τί
  choice: 为什么
  rationale: τί形式上可作“什么”，但在此责问结构和上下文中很可能具有“为什么”的副词性功能；另解收入脚注。
- source_word: ποιοῦσιν
  choice: 他们……做
  rationale: 用直接引语中的现在式表达现场行为；现代汉语无需额外标示进行体。
- source_word: τοῖς σάββασιν
  choice: 在安息日
  rationale: 希腊文复数在此为受闪语影响的习惯表达，所指是安息日，中文自然用单数概念。
- source_word: ὃ οὐκ ἔξεστιν
  choice: 不许可做的事
  rationale: 表达许可与合规层面的指控，同时不明确断定其根据究竟是圣经律法、法利赛传统还是其他律法解释。
theological_decisions:
- issue: 法利赛人反对的规范依据
  choice: 译为“不许可做的事”
  alternative: “不合法的事”或“违反律法的事”
  rationale: 原文只说该行为是不被许可的；不把指控进一步限定为直接违反摩西律法，从而保留经文本身的神学张力。
- issue: τί在责问中的功能
  choice: 译为“为什么”
  alternative: 译为“什么”：“看哪，他们在安息日做什么不合法的事？”
  rationale: 上下文更支持原因性责问，但希腊文也可按“什么”理解，因此将真实的词义歧义保留在脚注中。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“看哪”保留原文的注意命令语气；“不许可做”保持法律—宗教层面的力度，却不引入特定宗派对安息日律法的判断。
