  text: Καὶ ἐγένετο ⸂αὐτὸν ἐν τοῖς σάββασιν παραπορεύεσθαι⸃ διὰ τῶν σπορίμων, καὶ ⸂οἱ μαθηταὶ αὐτοῦ ἤρξαντο⸃ ὁδὸν ποιεῖν τίλλοντες τοὺς στάχυας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/023.yaml
  text: And it happened that on the Sabbath he was passing through the grainfields[a], and his disciples began to make their way[c][b], plucking the heads of grain.
translation:
  language: zh_hans
  text: 有一次，在安息日，耶稣从麦田[a]经过；他的门徒开始一边走一边摘麦穗[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“从长着庄稼的田地经过”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“开始开路”或“开始造路”；这里是指他们在田地中行进，随即摘取麦穗。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: 有一次
  rationale: 以自然的现代汉语引入叙事事件，保留这一希腊语叙事公式的功能，而不采用古雅的“事情发生了”。
- source_word: ἐν τοῖς σάββασιν
  choice: 在安息日
  rationale: 原文虽使用复数形式，但在通用希腊语中可惯用地指一个安息日；本处上下文也适合用汉语单数表达。
- source_word: παραπορεύεσθαι
  choice: 经过
  rationale: 简洁表达从某处穿行、经过的动作，与“麦田”搭配自然。
- source_word: διὰ τῶν σπορίμων
  choice: 从麦田
  rationale: σπόριμα指播种后长着庄稼的田地；“麦田”结合随后提到的麦穗，清楚而自然。
- source_word: ἤρξαντο
  choice: 便开始
  rationale: 保留“开始”的起始体意义；“便”使叙事衔接符合现代汉语习惯。
- source_word: ὁδὸν ποιεῖν
  choice: 往前走
  rationale: 按上下文将字面为“造路／开路”的表达理解为行进，同时用脚注保留其字面含义及另一种可能解释。
- source_word: τίλλοντες
  choice: 一路掐着
  rationale: τίλλω表示掐下、摘下；“一路……着”表现该动作伴随他们行进。
- source_word: τοὺς στάχυας
  choice: 麦穗
  rationale: στάχυς指谷物的穗；上下文是麦田，“麦穗”是准确、简明的现代汉语。
- source_word: αὐτὸν
  choice: 耶稣
  rationale: 原文代词在汉语中若直译为“他”，本节单独阅读时指代不够清楚；依上文所指明说“耶稣”，不改变所指对象。
theological_decisions:
- issue: 安息日用语的数
  choice: 在安息日
  alternative: 在安息日的时候／在几个安息日
  rationale: 希腊语复数形式在此可作惯用单数理解。这是语言判断，不预先决定后续安息日争议的神学含义。
- issue: ὁδὸν ποιεῖν与安息日争议的关系
  choice: 往前走
  alternative: 开出一条路
  rationale: 主要译文采用符合语境的惯用意义，避免让读者误以为门徒在修路；脚注同时保留字面读法以及他们可能边掐麦穗边开路的理解，不以翻译提前消除歧义。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“有一次”用于叙事起笔；“一路掐着麦穗”清楚呈现伴随动作。对ὁδὸν ποιεῖν的真实语义张力不在正文中强行展开，而由脚注保留。
