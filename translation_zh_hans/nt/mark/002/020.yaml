source:
  edition: SBLGNT
  text: ἐλεύσονται δὲ ἡμέραι ὅταν ἀπαρθῇ ἀπ’ αὐτῶν ὁ νυμφίος, καὶ τότε νηστεύσουσιν ἐν ⸂ἐκείνῃ τῇ ἡμέρᾳ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/020.yaml
  text: But days will come when the bridegroom is taken away from them[a], and then they will fast in that day.
translation:
  language: zh_hans
  text: 但日子将到，新郎从他们那里被带走的时候，他们就要在那一天[a]禁食。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“于那一天”。原文此处为单数“那一天”，不是“那些日子”。
    reason: 说明ἐν加与格的时间表达可按汉语习惯译作“在”或“于”，并保留原文单数、特指的时间范围。
lexical_decisions:
- source_word: ἐλεύσονται δὲ ἡμέραι
  choice: 但日子将到
  rationale: 保留“日子将到”这一将来时表达，并以“但”体现与上文当前情形的转折。原文“日子”没有冠词，中文无需增添“那些”等限定。
- source_word: ὅταν
  choice: ……的时候
  rationale: 与不定过去时虚拟语气ἀπαρθῇ连用，在这里指向将来会发生的时刻；译作“……的时候”自然，也不赋予“每当”的反复含义。
- source_word: ἀπαρθῇ
  choice: 被带走
  rationale: 保留原文被动语态以及突然、非自愿地被移走的意味，同时不补明施事者或具体方式。
- source_word: ἀπ’ αὐτῶν
  choice: 从他们中间
  rationale: 清楚表达新郎与同伴分离；“从他们中间”符合现代汉语习惯，也保留群体场景。
- source_word: ὁ νυμφίος
  choice: 新郎
  rationale: 准确保留婚宴比喻；现代汉语中“新郎”自然明确，无需在正文中把比喻改写成耶稣的自称。
- source_word: καὶ τότε
  choice: 他们就要
  rationale: “就”明确表达在新郎被带走之后随即出现的结果和时序；中文无需机械另译连接词“καὶ”。
- source_word: νηστεύσουσιν
  choice: 禁食
  rationale: “禁食”是现代汉语中清楚而庄重的宗教用语，准确表达主动不进食的实践。
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: 在那一天
  rationale: 保留原文单数和特指意味，也较直接地对应ἐν加与格的结构；不把它改成复数“在那些日子”。
theological_decisions:
- issue: 新郎这一比喻是否应在正文中明说指耶稣
  choice: 保留“新郎”的比喻，不在译文中改成“我”或补出“耶稣”。
  alternative: 译作“我从他们中间被带走的时候”。
  rationale: 上下文表明耶稣以新郎自喻，但原文仍采用比喻性第三人称；保留这一形式可维持其文学与神学张力。
- issue: 新郎被带走的性质及施事者
  choice: 采用被动表达“被带走”，不说明是谁带走，也不在正文中明说死亡或受难。
  alternative: 译作“被人带去处死”或“在死亡中从他们中间被夺去”。
  rationale: 本句通常被理解为预示耶稣的死亡，但原文本身未说明施事者和具体方式；译文不应把解释直接写入正文。
- issue: 禁食发生的时间范围
  choice: 保留单数“在那一天”。
  alternative: 译作复数“在那些日子”。
  rationale: 现有希腊文本明确使用单数；保留单数，避免将禁食的时间范围扩展为一段时期。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“日子将到”略带经文语体，但在现代汉语中仍清楚自然；全句保留原文的婚宴比喻、被动语态和时间上的单数表达。
