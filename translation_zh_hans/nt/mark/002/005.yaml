  text: ⸂καὶ ἰδὼν⸃ ὁ Ἰησοῦς τὴν πίστιν αὐτῶν λέγει τῷ παραλυτικῷ· Τέκνον, ⸂ἀφίενταί σου⸃ αἱ ⸀ἁμαρτίαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/005.yaml
  text: And Jesus[a], seeing their faith, says to the paralyzed man, “Child, your sins are forgiven.”
translation:
  language: zh_hans
  text: 耶稣看见他们的信心，就对那瘫痪的人说：“孩子[a]，你的罪蒙赦免了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“儿子”；希腊文τέκνον是亲切的称呼，意思是“孩子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: 看见
  rationale: 以“看见”表达不定过去时分词，并通过“就”自然连接主句，保留其与主要动词的从属关系。
- source_word: πίστιν αὐτῶν
  choice: 他们的信心
  rationale: πίστις在此指这群人把瘫痪者带到耶稣面前所显出的信靠；αὐτῶν的复数属格保留为“他们的”，不擅自限定是否包括瘫痪者本人。
- source_word: λέγει
  choice: 说
  rationale: 希腊文现在时在叙事中是历史现在时；现代汉语用“说”最自然，语境仍保有叙事的直接感。
- source_word: παραλυτικῷ
  choice: 那瘫痪的人
  rationale: 该形容词作名词使用，指瘫痪者；此译法比术语化的“瘫子”更自然、尊重，也准确指明对象。
- source_word: Τέκνον
  choice: 孩子
  rationale: τέκνον是亲切温和的称呼，字面为“孩子”；不强加原词未必要求的男性含义。
- source_word: ἀφίενταί σου αἱ ἁμαρτίαι
  choice: 你的罪蒙赦免了
  rationale: 保留复数ἁμαρτίαι的整体意义，并以“蒙赦免”体现被动语态，不明说施事者；“了”自然表达赦免已成为当下现实，而不展开其机制。
theological_decisions:
- issue: 耶稣赦罪宣告的性质与被动语态所隐含的施事者
  choice: 你的罪蒙赦免了
  alternative: 你的罪得赦免了／你的罪被赦免了
  rationale: 译作直接、有效的宣告，同时保留神学被动的含蓄性，不额外说明赦罪的机制或施事者。“蒙”较庄重自然，也避免“被”在现代汉语中可能带出的负面语感。
- issue: “他们的信心”所涵盖的人群
  choice: 保留“他们的”，不说明是否包括瘫痪者
  alternative: 解释为抬他来之人的信心，或解释为众人连同瘫痪者的信心
  rationale: 复数代词本身没有明确划定范围；译文应保存这种真实歧义，不以注释或正文替原文作决定。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“瘫痪的人”避免标签化；“孩子”保留称呼的温情；正文中的[a]与脚注对应。
