  text: And they came[a], bringing to him a paralyzed man carried by four.
translation:
  language: zh_hans
  text: 有些人来到耶稣那里，带着一个瘫痪的人；这人由四个人抬着。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: 有人来到
  rationale: καί承接上文；中文叙事无需机械译出“并且”。结合复数动词，采用不定主语“有人”，自然引入来者。
- source_word: ἔρχονται
  choice: 来到
  rationale: 这是叙事中的历史现在时；现代汉语自然用完成性叙述“来到”，不刻意保留现在时形式。
- source_word: φέροντες
  choice: 带着
  rationale: 现在分词表示伴随动作，即来者把瘫痪的人带到耶稣那里；具体的抬行动作由αἰρόμενον表达。
- source_word: πρὸς αὐτὸν
  choice: 耶稣那里
  rationale: 原文为“到他那里”。为使单节中文指代清楚，按语境明确为耶稣，不增添新的信息。
- source_word: παραλυτικὸν
  choice: 一个瘫痪的人
  rationale: 该形容词作名词使用。译为“瘫痪的人”既准确又以人为中心，比“瘫子”更尊重且符合现代用语。
- source_word: αἰρόμενον
  choice: 抬着
  rationale: 被动分词表示此人正由别人承托搬运；“抬着”符合多人共同搬运一个人的具体情景。
- source_word: ὑπὸ τεσσάρων
  choice: 由四个人
  rationale: 希腊文只明说“由四个”，人的所指由语境省略。汉语单说“由四个抬着”不完整，因此补出自然隐含的量词中心语“人”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事表达。分号区分“带到耶稣那里”和“由四人抬着”两层相关动作，避免把“带着”与“抬着”混为一谈。原文的“四个”在汉语中须补足为“四个人”，这是语法与语用上的显明补足，不涉及神学解释。
