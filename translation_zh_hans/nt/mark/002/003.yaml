- from: 有人来到耶稣那里，带着一个瘫痪的人；他由四个人抬着。
  to: 有些人来到耶稣那里，带着一个瘫痪的人；这人由四个人抬着。
  rationale: 修订仅将可能按单数理解的“有人”改为明确复数但不限定人数的“有些人”，并以“这人”消除代词回指的不确定性。保留原文中来者与四名搬运者是否完全同一群人的句法开放性，未增添任何神学或叙事信息。
