id: MRK.2.22
reference: Mark 2:22
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ οὐδεὶς βάλλει οἶνον νέον εἰς ἀσκοὺς παλαιούς· εἰ δὲ μή, ⸂ῥήξει ὁ οἶνος⸃ τοὺς ἀσκούς, καὶ ὁ οἶνος ⸂ἀπόλλυται καὶ οἱ ἀσκοί⸃. ἀλλὰ οἶνον νέον εἰς ἀσκοὺς ⸀καινούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/022.yaml
  text: And no one puts new wine into old wineskins[a]. Otherwise, the wine will burst the wineskins, and the wine is ruined, and the wineskins too[b]. But new wine is for fresh wineskins.
translation:
  language: zh_hans
  text: 也没有人把新酒装进旧皮袋里；不然，酒会胀破皮袋，酒和皮袋也就都毁了。新酒要配新皮袋[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “新皮袋”也可理解为“崭新的皮袋”，强调其状态新、尚有弹性；原文这里的“新”与前面的“旧”相对。
    reason: lexical_alternative
lexical_decisions:
- source_word: βάλλει
  choice: 装进
  rationale: 在把液体放入容器的语境中，“装进”比字面的“投、放”更符合现代汉语，也不像“倒进”那样把希腊动词限定为特定动作。
- source_word: οἶνον νέον
  choice: 新酒
  rationale: 保留形容词与名词的直接搭配；这里指新酿、仍可能继续发酵的酒。
- source_word: ἀσκοὺς
  choice: 皮袋
  rationale: 指用兽皮制成、可盛酒的容器。“皮袋”是简明自然的汉语表达，结合“酒”的上下文不会误解其用途。
- source_word: παλαιούς
  choice: 旧
  rationale: 直接保留“旧”与末句“新”的对照，不把其含义扩展为原文未明说的“破旧”或“磨损”。
- source_word: ῥήξει
  choice: 会胀破
  rationale: “破”对应容器被撑裂的结果；加入“胀”自然呈现新酒发酵对皮袋产生压力的语境，而不改变因果关系。
- source_word: ἀπόλλυται
  choice: 毁了
  rationale: 该词可表达毁坏、丧失。此处用“毁了”概括酒被糟蹋和皮袋受损的共同结果，并保留其较宽泛的语义。
- source_word: καινούς
  choice: 新
  rationale: καινός在此与παλαιός“旧”相对，指状态新、适合使用的皮袋。正文用自然的“新皮袋”，脚注说明其质性含义。
- source_word: ἀλλὰ οἶνον νέον εἰς ἀσκοὺς καινούς
  choice: 新酒要配新皮袋
  rationale: 原文末句省略动词。“要配”以简洁的格言式汉语补足句意，表达适配关系，避免机械重复“装进”，也不将其改写为直接命令。
theological_decisions:
- issue: 末句省略动词所表达的语气
  choice: 译作一般原则“新酒要配新皮袋”
  alternative: “新酒必须装进新皮袋里”或“人把新酒装进新皮袋里”
  rationale: 希腊文末句没有明写动词。格言式的“要配”保留简洁和原则性，不强化为绝对命令，也不擅自补出明确主语。
translation_notes:
  register: 采用现代、庄重而口语可懂的标准普通话。“胀破”使古代皮袋盛装新酿酒的图景易于理解；末句保持短促的格言节奏。
