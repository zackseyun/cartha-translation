  text: καὶ ⸀λέγει αὐτοῖς· Οὐδέποτε ἀνέγνωτε τί ἐποίησεν Δαυὶδ ὅτε χρείαν ἔσχεν καὶ ἐπείνασεν αὐτὸς καὶ οἱ μετ’ αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/025.yaml
  text: And he said to them, “Have you never read what David did when he was in need and was hungry, he and those with him?”
translation:
  language: zh_hans
  text: 耶稣对他们说：“你们从来没有读过大卫所做的事吗？当他有需要、他自己和同他在一起的人都饿了的时候。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: 耶稣对他们说
  rationale: 汉语中补出本节动词的明确主语“耶稣”，承接上文，避免孤立成节时指代不清；“对他们说”自然对应间接宾语。
- source_word: Οὐδέποτε ἀνέγνωτε
  choice: 你们从来没有读过……吗
  rationale: 保留否定反问的语气，既表达责问，也不将其改写成普通陈述。
- source_word: χρείαν ἔσχεν
  choice: 他有需要
  rationale: 较贴近原文的宽泛表述，不擅自把“需要”缩窄为某一种具体困境。
- source_word: ἐπείνασεν
  choice: 饿了
  rationale: 用现代汉语直接表达进入饥饿状态的意思。
- source_word: αὐτὸς καὶ οἱ μετ’ αὐτοῦ
  choice: 自己和跟随他的人都
  rationale: “跟随他的人”自然表达当时与大卫同行者；“都”使该成分清楚地同时修饰大卫和同行者。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。将原文较长的反问句按汉语节奏分为问句和补充说明，保留“有需要”与“饿了”两个并列而不完全等同的描述。
