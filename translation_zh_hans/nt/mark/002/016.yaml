  text: καὶ οἱ γραμματεῖς ⸂τῶν Φαρισαίων⸃ ⸀ἰδόντες ⸂ὅτι ἐσθίει⸃ μετὰ τῶν ⸂ἁμαρτωλῶν καὶ τελωνῶν⸃ ἔλεγον τοῖς μαθηταῖς αὐτοῦ· ⸀Ὅτι μετὰ τῶν ⸂τελωνῶν καὶ ἁμαρτωλῶν⸃ ⸀ἐσθίει;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/016.yaml
  text: And the scribes of the Pharisees[a], seeing that he was eating with sinners and tax collectors, were saying to his disciples, “Why does he eat with tax collectors and sinners?”
translation:
  language: zh_hans
  text: 法利赛派的经学家[a]看见耶稣跟罪人和税吏一起吃饭，就对他的门徒说：“他为什么跟税吏和罪人一起吃饭？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “法利赛派的经学家”也可译作“法利赛人中的经学家”；原文表示这些经学家与法利赛派有所归属或关联。
    reason: textual_or_syntactic_ambiguity
lexical_decisions:
- source_word: γραμματεῖς
  choice: 经学家
  rationale: 指熟悉并讲授经文和律法的专业人士；“经学家”在现代汉语中比“文士”更透明，也不过度限定为一般教师。
- source_word: τῶν Φαρισαίων
  choice: 法利赛派的
  rationale: 保留属格所表达的归属或关联，不强行判定他们只是与法利赛人有关，还是本身就是法利赛人。
- source_word: ἰδόντες
  choice: 看见
  rationale: 自然表达不定过去时分词的伴随兼时间意义，使叙事流畅。
- source_word: ὅτι ἐσθίει
  choice: 看见耶稣……一起吃饭
  rationale: 用汉语叙事结构表达他们看见正在发生的情景；补出“耶稣”作为主语，避免连续代词造成指代不清。
- source_word: μετὰ
  choice: 跟……一起
  rationale: 直接表达共同进食及彼此相伴，保留席间交往的含义而不在正文中加以解释。
- source_word: ἁμαρτωλῶν
  choice: 罪人
  rationale: 保留原文带有社会和宗教评价色彩的称呼，不弱化为“有罪的人”等解释性措辞。
- source_word: τελωνῶν
  choice: 税吏
  rationale: 这是福音书语境中通行而简洁的称呼，指代替当局征收税款或关卡费用的人。
- source_word: ἔλεγον
  choice: 就对……说
  rationale: 现代汉语通常不以形态区分未完成体；上下文已经呈现当时进行中的场景。“不断说”会过度强化重复意味。
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: 对他的门徒
  rationale: “门徒”准确保留师徒关系，也是现代圣经语境中清楚通行的表达。
- source_word: Ὅτι
  choice: 为什么
  rationale: 在此疑问语境中自然引出带有责难意味的问题。
- source_word: ἐσθίει
  choice: 一起吃饭
  rationale: “吃饭”是现代汉语对共同进食最自然的说法；加“一起”明示 μετά 所表达的共同参与。
theological_decisions:
- issue: 共同进食所具有的社会与宗教意义
  choice: 正文直译为“跟……一起吃饭”，不加入“交往”或“接纳”等解释。
  alternative: 译为“与税吏和罪人同席”或“跟税吏和罪人交往吃饭”。
  rationale: 原文以普通的“吃”加“与……一起”呈现席间交往，其社会与神学张力应由叙事情境体现，而不由译文预先解释。
- issue: τῶν Φαρισαίων 的归属关系
  choice: 译作“法利赛派的经学家”，保留归属或群体关联。
  alternative: 译作“身为法利赛人的经学家”或“法利赛人的经学家”。
  rationale: 希腊文属格可表达归属或关联；正文不进一步断定这些经学家个人身份与法利赛派关系的精确性质。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“经学家”比传统的“文士”更便于普通读者理解；“税吏”保留福音书语境中的通行称谓。问句保持直接的责难语气。
