  text: ⸀Οὐδεὶς ἐπίβλημα ῥάκους ἀγνάφου ἐπιράπτει ἐπὶ ⸂ἱμάτιον παλαιόν⸃· εἰ δὲ μή, αἴρει τὸ πλήρωμα ⸀ἀπ’ αὐτοῦ τὸ καινὸν τοῦ παλαιοῦ, καὶ χεῖρον σχίσμα γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/021.yaml
  text: No one sews a patch of unshrunk cloth onto an old garment[a]; otherwise[b], the patch pulls away from it—the new from the old—and a worse tear results.
translation:
  language: zh_hans
  text: 没有人把未缩水的布补丁缝在旧衣服上[a]；不然[b]，新补丁会从旧衣服上扯脱，裂口反而更大了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“未经缩绒处理的布”。希腊语指尚未经过缩绒处理、仍可能收缩的布料。
    reason: lexical_alternative
  - marker: b
    text: 直译：“否则，填补的那块会从它上面扯走，就是新的从旧的扯走，裂口就变得更坏。”原文措辞凝缩；意思是新补丁与旧衣服分离，以致裂口更大。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπίβλημα
  choice: 补丁
  rationale: 指盖在破处、缝上去的一块布；“补丁”是现代汉语中最自然、准确的说法。
- source_word: ῥάκους ἀγνάφου
  choice: 未缩水的布
  rationale: ἄγναφος 指尚未经过缩绒等整理的布料，之后遇水仍会收缩；译作“未缩水的布”清楚传达比喻中的实际作用。
- source_word: ἐπιράπτει
  choice: 缝在……上
  rationale: 保留动词所表达的具体缝补动作，且符合现代汉语习惯。
- source_word: ἱμάτιον παλαιόν
  choice: 旧衣服
  rationale: ἱμάτιον 可泛指衣物，尤其外衣；“旧衣服”自然易懂，也避免过度限定衣服种类。
- source_word: εἰ δὲ μή
  choice: 不然
  rationale: 自然表达否定条件所引出的后果。
- source_word: αἴρει
  choice: 扯下来
  rationale: 本义为拿走、带走；在缝补语境中表示新布收缩时牵扯并脱离旧衣，译作“扯下来”具体而自然。
- source_word: τὸ πλήρωμα
  choice: 补丁
  rationale: 此处指填补破口的布块；按语境译为“补丁”比直译“填充物”更清楚。
- source_word: τὸ καινὸν τοῦ παλαιοῦ
  choice: 新补丁会从旧衣服上扯下来
  rationale: 明确补出希腊语省略成分，保留“新”与“旧”的对照，同时让因果关系在汉语中清楚。
- source_word: χεῖρον σχίσμα γίνεται
  choice: 裂口就更大了
  rationale: σχίσμα 指撕裂形成的裂口；此表达自然传达裂损变得更严重的结果。
theological_decisions: []
