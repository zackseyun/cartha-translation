  text: 但有些文士坐在那里，心里思忖：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦσαν δέ
  choice: 但有
  rationale: δέ在这里转向另一群人的内在反应，带有轻微对照；“但有”自然承接叙事，又不过度强化转折。
- source_word: τινες τῶν γραμματέων
  choice: 几个经学家
  rationale: τινες与部分属格表示这群经学家中的若干人；“几个经学家”在现代汉语中自然地保留部分性。“经学家”也能体现其研习、讲解宗教律法与经典的身份。
- source_word: ἐκεῖ καθήμενοι
  choice: 坐在那里
  rationale: 保留地点副词和表示持续姿态的分词，符合汉语叙事语序。
- source_word: διαλογιζόμενοι
  choice: 思量
  rationale: 该词在语境中指尚未说出口的内在推想和斟酌；“思量”既包含思考过程，又不预先把内容定性为争辩或质疑。
- source_word: ἐν ταῖς καρδίαις αὐτῶν
  choice: 心里
  rationale: “心里”是现代汉语表达内在思想的自然说法，也保留了καρδία以“心”为思想活动所在的圣经性意象。
theological_decisions:
- issue: καρδίαις的圣经人论习语
  choice: 心里
  alternative: 暗自；在内心；心中
  rationale: 原文把“心”作为思想和判断的所在。“心里”既忠实保留这一意象，也避免套用现代汉语中理性“头脑”与情感“内心”的二分。
- issue: διαλογιζόμενοι所表达的内在活动
  choice: 思量
  alternative: 思想；议论；质疑
  rationale: 上下文将揭示其反对性内容，但本词本身可指内在推想或推理；采用“思量”可保留语义张力，不提前加入公开争论或明确质疑的色彩。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。“经学家”比“文士”更直接传达其宗教经典与律法专家的身份；句末“说”引出下一节的内心话语。
