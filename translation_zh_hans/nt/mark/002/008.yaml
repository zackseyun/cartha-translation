  text: καὶ ⸀εὐθὺς ἐπιγνοὺς ὁ Ἰησοῦς τῷ πνεύματι αὐτοῦ ὅτι ⸀οὕτως διαλογίζονται ἐν ἑαυτοῖς ⸀λέγει αὐτοῖς· Τί ταῦτα διαλογίζεσθε ἐν ταῖς καρδίαις ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/008.yaml
  text: And immediately Jesus[a], perceiving in his spirit that they were reasoning this way within themselves, said to them, “Why are you reasoning about these things in your hearts?”
translation:
  language: zh_hans
  text: 耶稣立刻在自己的灵里察觉到[a]，他们心里正这样思量，就对他们说：“你们为什么在心里思量这些事？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在自己的灵里察觉到”也可译作“在自己的灵里知道”或“在自己里面认出”。希腊文没有明确说明耶稣以何种方式察觉。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: 立刻
  rationale: 保留马可叙事中鲜明而紧迫的推进感，也是现代汉语自然的表达。
- source_word: ἐπιγνοὺς
  choice: 察觉
  rationale: 表达清楚地认知、辨明之意，同时不具体限定耶稣获知其内心议论的方式。
- source_word: τῷ πνεύματι αὐτοῦ
  choice: 在自己灵里
  rationale: 较直接地保留希腊文的措辞及与格可能具有的范围含义，不将其简化为纯粹的心理直觉，也不预先断定为某种特定的超自然机制。
- source_word: οὕτως διαλογίζονται ἐν ἑαυτοῖς
  choice: 他们心中这样议论
  rationale: 结合上下文，διαλογίζομαι指内在思量、推论；以“心中”自然表达ἐν ἑαυτοῖς所指的内在活动，而“这样”保留οὕτως。
- source_word: Τί ταῦτα διαλογίζεσθε
  choice: 你们为什么……议论这些事
  rationale: 疑问词τί在此按汉语习惯表达为“为什么”；“议论”既可指心里的推想，也与本节重复出现的διαλογίζομαι形成对应。
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: 在心里
  rationale: “心”保留圣经语境中人的思想、意向等内在活动中心的含义；汉语无需机械保留复数。
theological_decisions:
- issue: “在自己灵里察觉”所指的认知方式
  choice: 正文保留“在自己灵里察觉”，不界定耶稣如何知道他们内心的议论。
  alternative: 明确译为耶稣凭神性全知、靠圣灵启示，或仅凭敏锐的人性直觉而知道。
  rationale: 经文清楚陈述耶稣知道他们内在的议论，但τῷ πνεύματι αὐτοῦ本身没有明确规定这种认知的机制。直译其基本措辞可保留经文的神学张力，避免加入原文没有明说的解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“在自己灵里”略带圣经语体，以保留原文πνεῦμα的措辞和歧义；其余句式力求自然流畅。脚注标记置于整节句末，对应正文中相关表达。
