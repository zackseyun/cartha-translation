source:
  edition: SBLGNT
  text: καὶ παράγων εἶδεν Λευὶν τὸν τοῦ Ἁλφαίου καθήμενον ἐπὶ τὸ τελώνιον, καὶ λέγει αὐτῷ· Ἀκολούθει μοι. καὶ ἀναστὰς ἠκολούθησεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/014.yaml
  text: And as he was passing by[a], he saw Levi the son of Alphaeus sitting at the tax booth, and he says to him, “Follow me.” And he rose and followed him.
translation:
  language: zh_hans
  text: 耶稣往前走的时候，看见亚勒腓的儿子利未坐在收税处[a]，就对他说：“跟从我。”利未便起来，跟从了他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“税关”。希腊词可指征收税款或关税的地方。
    reason: 说明τελώνιον所指地点的词义范围，保留“收税处”与“税关”之间的合理译法差异。
lexical_decisions:
- source_word: παράγων
  choice: 往前走的时候
  rationale: 现在分词交代与“看见”同时发生的背景动作；此译自然表达动作正在进行，也不把它限定为经过某个特定设施。
- source_word: εἶδεν
  choice: 看见
  rationale: 直接对应ὁράω的简单过去叙事用法，不额外加入“注意到”等解释性意味。
- source_word: Λευὶν
  choice: 利未
  rationale: 采用现代中文圣经人名的通行音译。
- source_word: τὸν τοῦ Ἁλφαίου
  choice: 亚勒腓的儿子
  rationale: 希腊文属格结构在此以父子关系标明利未的身份；中文明确补出“儿子”。
- source_word: καθήμενον
  choice: 坐在
  rationale: 准确表达利未被看见时的姿态和所在位置。
- source_word: ἐπὶ τὸ τελώνιον
  choice: 在收税处
  rationale: τελώνιον指征收税款或关税的地点。“收税处”在现代中文中清楚自然，同时避免把设施过度具体化为固定样式的亭子。
- source_word: λέγει
  choice: 就对他说
  rationale: 汉语动词本身不标语法时态，因而既可自然承接过去叙事，也不必抹去马可使用历史现在时所带来的现场感；“就”表达紧接着发生，并非另加时间间隔。
- source_word: Ἀκολούθει μοι
  choice: 跟从我
  rationale: 直接保留命令语气及“跟从”这一门徒语境中的核心动词，不添加原文没有的“来”。
- source_word: ἀναστὰς
  choice: 便起来
  rationale: 表达先起身、继而跟从的动作次序；“便”也呈现回应的直接性。
- source_word: ἠκολούθησεν αὐτῷ
  choice: 跟从了他
  rationale: 与命令中的“跟从我”保持词语呼应，并以“了”自然标示叙事中已发生的回应。
theological_decisions:
- issue: 马可叙事中的历史现在时
  choice: 用汉语不标时态的“就对他说”，不刻意改写为带明显过去时标记的形式
  alternative: 译成“就曾对他说”或以其他方式明确过去时
  rationale: λέγει在希腊文中是历史现在时。现代汉语动词通常不以形态标示时态，因此本译既维持自然叙事，也保留原文的鲜活感，而不人为制造生硬的时态对照。
- issue: “跟从”是当下行动还是持续的门徒身份
  choice: 保留简洁命令“跟从我”
  alternative: 释义为“作我的门徒”或“从今以后一直跟随我”
  rationale: 现在时命令可含持续跟从之意，但原文本身使用普通的“跟从”动词。直译可同时容纳当下随行与较深的门徒含义，避免把神学内涵单向明说。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“亚勒腓”“利未”沿用通行中文圣经音译；为使单节独立阅读时主语清楚，按上下文将省略的主语明确为“耶稣”。脚注标记置于其实际说明的“收税处”之后。
