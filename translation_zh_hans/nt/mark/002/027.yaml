  text: καὶ ἔλεγεν αὐτοῖς· Τὸ σάββατον διὰ τὸν ἄνθρωπον ἐγένετο ⸀καὶ οὐχ ὁ ἄνθρωπος διὰ τὸ σάββατον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/027.yaml
  text: And he was saying to them[a], “The Sabbath came into being for man, and not man for the Sabbath.”
translation:
  language: zh_hans
  text: 耶稣对他们说：“安息日是为了人而有的，人不是为了安息日而有的。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγεν
  choice: 又对他们说
  rationale: 未完成时在叙事中可表示当时持续的讲话，但现代汉语若直译为“不断说”会不自然；结合 καί，以“又对他们说”自然承接上文，不额外强化重复意味。
- source_word: τὸ σάββατον
  choice: 安息日
  rationale: 带冠词的单数指安息日这一日子及其制度；“安息日”是现代中文标准译法，无须另加“制度”。
- source_word: διὰ τὸν ἄνθρωπον
  choice: 为人
  rationale: διά 加宾格表示目的或受益对象。这里的单数 ἄνθρωπος 具有代表性，泛指人类；中文“人”既保留单数形式和两句的对称，也自然涵盖所有人。
- source_word: ἐγένετο
  choice: 设立
  rationale: γίνομαι 在此论及安息日因人的缘故而出现、形成；中文“设立”能自然表达制度的产生及目的。它比“被造”更符合安息日这一制度的语境，同时不指定设立者。
- source_word: οὐχ ὁ ἄνθρωπος διὰ τὸ σάββατον
  choice: 人不是为安息日设立的
  rationale: 原文后半句省略了与前句相应的谓语。中文补出“设立的”，清楚保留目的关系和鲜明的反向对照。
theological_decisions:
- issue: 代表性单数 ἄνθρωπος 的范围
  choice: 译作“人”，理解为泛指人类
  alternative: 人类／世人
  rationale: 原文以单数作普遍陈述。中文“人”可自然地代表人类整体，又能维持“安息日为人／人非为安息日”的修辞对称，无须加入性别限定。
- issue: ἐγένετο 是否明确神为设立者
  choice: 用“设立”，但不明说设立者
  alternative: 被造／产生
  rationale: 经文强调安息日存在的目的，并未在句法上明说行动者；译文因此不补入“神”，避免把隐含信息变成明说内容。
translation_notes:
  register: 采用现代、庄重而口语自然的表达。“为人……人不是为……”保留原文简洁有力的对偶结构；不设脚注，因为中文“人”本身即可自然表达代表性的全人类含义。
