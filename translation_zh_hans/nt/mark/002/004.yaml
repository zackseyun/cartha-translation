review_pass:
  verdict: revise
  source_fidelity: 译文整体准确呈现了因人群阻碍、揭开屋顶、挖开并将卧具降下的动作次序，也恰当地按上下文明确了耶稣和瘫痪者的所指。不过“缒了下去”通常带有用绳索使人或物下垂下降的意味，可能加入原文未明说的方式；χαλῶσι只要求“放下／降下”。
  naturalness: 行文总体自然、清楚，适合现代汉语叙事。“耶稣所在之处”略偏书面但可接受；改为“耶稣所在处上方”能更顺畅地表达屋顶与地点的关系。“放了下去”比“缒了下去”更中性且日常。
  terminology: “瘫痪的人”“垫子”均准确、现代。“带到耶稣那里”保留προσενέγκαι的宽泛“带来”之义，不把搬运方式作为该动词本身的语义；上下文仍清楚表明此人躺在垫子上。
  issues:
  - severity: medium
    issue: “缒了下去”可能暗示以绳索垂吊。
    rationale: “缒”在现代汉语通常指用绳索系住而放下或下垂；希腊文χαλῶσι表示放下、降下，并未交代使用绳索。宜用中性的“放了下去”。
  - severity: low
    issue: “抬到”将带人的具体方式置入προσενέγκαι的译词。
    rationale: 虽然语境确实涉及卧具和多人，προσενέγκαι本身是“带到／带来”。改为“带到”可避免在该处预先限定方式，同时不损失上下文信息。
  revised_text: 他们因人多，无法把那人带到耶稣那里，就拆开耶稣所在处上方的屋顶；挖通以后，把瘫痪的人所躺的垫子放了下去。
