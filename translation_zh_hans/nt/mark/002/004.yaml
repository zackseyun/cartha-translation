revisions:
- from: 他们因人多，无法把那人抬到耶稣跟前，就拆开耶稣所在之处的屋顶；挖通以后，把瘫痪的人所躺的垫子缒了下去。
  to: 他们因人多，无法把那人带到耶稣那里，就拆开耶稣所在处上方的屋顶；挖通以后，把瘫痪的人所躺的垫子放了下去。
  rationale: 修订仅消除“缒”所可能附带的绳索含义，并以“带到”贴合原文动词的广义，同时保留原译的因果关系、动作先后、人物指代和现代庄重的叙事语体。“上方”只是将屋顶相对于耶稣所在位置的固有空间关系明确化，不增添建筑细节。
