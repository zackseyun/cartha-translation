  text: καὶ μὴ δυνάμενοι ⸀προσενέγκαι αὐτῷ διὰ τὸν ὄχλον ἀπεστέγασαν τὴν στέγην ὅπου ἦν, καὶ ἐξορύξαντες χαλῶσι τὸν κράβαττον ⸀ὅπου ὁ παραλυτικὸς κατέκειτο.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/004.yaml
  text: And not being able to bring him to him because of the crowd[a], they removed the roof where he was, and after digging through it[c][b], they lower the mat on which the paralyzed man was lying.
translation:
  language: zh_hans
  text: 他们因人多，无法把那人带到耶稣那里，就拆开耶稣所在处上方的屋顶；挖通以后，把瘫痪的人所躺的垫子放了下去。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ δυνάμενοι
  choice: 无法
  rationale: 以简洁自然的现代汉语表达分词所交代的处境，并保留其引出后续行动的因果意味。
- source_word: προσενέγκαι αὐτῷ
  choice: 把那人抬到耶稣跟前
  rationale: 原文的宾语和与格代词分别指瘫痪的人和耶稣；汉语若直译为两个“他”会含混，因此依上下文明确所指。“抬”也符合此人躺在垫子上、由多人带来的场景。
- source_word: διὰ τὸν ὄχλον
  choice: 因人多
  rationale: 自然表达διά加宾格的原因意义；“人多”比“因为群众”更符合现代汉语叙事。
- source_word: ἀπεστέγασαν τὴν στέγην
  choice: 拆开……屋顶
  rationale: 表达揭除或拆去屋顶覆盖层的动作，同时避免生硬的同词重复。
- source_word: ὅπου ἦν
  choice: 耶稣所在之处
  rationale: 该从句说明他们在耶稣所在位置的上方动工；译文按上下文明确代词所指，但不额外说明建筑结构。
- source_word: ἐξορύξαντες
  choice: 挖通以后
  rationale: 保留对屋顶进行挖掘并打通的具体动作，也不擅自限定屋顶材料。
- source_word: χαλῶσι
  choice: 缒了下去
  rationale: “缒下”准确表达从高处把载有人的垫子放下；汉语动词本身不必机械复制希腊文历史现在时。
- source_word: κράβαττον
  choice: 垫子
  rationale: 指简陋的睡垫或卧具；“垫子”通俗自然，又不像“床”那样显得厚重，也不像“担架”那样加入原文未明说的用途。
- source_word: ὅπου ὁ παραλυτικὸς κατέκειτο
  choice: 瘫痪的人所躺的
  rationale: 按语境将关系从句理解为修饰垫子，并用现代汉语自然表达名词化形容词ὁ παραλυτικός。
