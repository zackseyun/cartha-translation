  text: καὶ ἀναμνησθεὶς ὁ Πέτρος λέγει αὐτῷ· Ῥαββί, ἴδε ἡ συκῆ ἣν κατηράσω ἐξήρανται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/021.yaml
  text: And Peter[a], remembering, says to him, “Rabbi, look—the fig tree that you cursed has withered.”
translation:
  language: zh_hans
  text: 彼得想起来，就对他说：“拉比，你看！你所咒诅的那棵无花果树已经枯萎了[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“已经干枯了”。希腊语动词既可表示干枯，也可表示枯萎；完成时强调这一结果现在仍然存在。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναμνησθεὶς
  choice: 想起来
  rationale: 该词为不定过去时被动分词，在这里具有不及物含义，可表达“想起、记起”。译作“想起来”自然地保留了彼得因回想起先前之事而开口的关系。
- source_word: λέγει
  choice: 就对他说
  rationale: 这是马可叙事中常见的历史现在时。现代汉语通常不靠动词形态标明过去或现在；“就对他说”既符合叙事习惯，也保留了动作紧接着发生的鲜明感。
- source_word: αὐτῷ
  choice: 对他说
  rationale: 原文使用代词，所指由上下文可知是耶稣，因此不直接补成“对耶稣说”。
- source_word: Ῥαββί
  choice: 拉比
  rationale: 希腊文保留了这一犹太称谓的音译。中文译作“拉比”，既保留犹太背景，也符合直接称呼的语境；其含义可作“老师”。
- source_word: ἴδε
  choice: 你看
  rationale: 这是引人注意的命令式。“你看”是自然、清楚的现代汉语，并保留彼得指向眼前景象的语气。
- source_word: συκῆ
  choice: 无花果树
  rationale: 上下文所指是树本身，译作“无花果树”明确而准确。
- source_word: κατηράσω
  choice: 你所咒诅的
  rationale: 该词是第二人称单数不定过去时形式，指耶稣先前对树所作的事。“咒诅”直接保留原词强烈而明确的含义，没有弱化为一般的责备或宣告。
- source_word: ἐξήρανται
  choice: 已经枯萎了
  rationale: 该完成时形式表达已经发生并持续到眼前的结果。“已经……了”自然传达完成及现存状态；对树而言，“枯萎”也符合现代汉语习惯。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“拉比”保留原文的犹太称谓；句中的代词不作不必要的明确化。感叹号体现ἴδε引人注意的语气，脚注标记置于其实际说明的“枯萎了”之后。
