  text: καὶ λέγει αὐτοῖς· Ὑπάγετε εἰς τὴν κώμην τὴν κατέναντι ὑμῶν, καὶ ⸀εὐθὺς εἰσπορευόμενοι εἰς αὐτὴν εὑρήσετε πῶλον δεδεμένον ἐφ’ ὃν οὐδεὶς ⸀οὔπω ἀνθρώπων ⸀ἐκάθισεν· ⸂λύσατε αὐτὸν καὶ φέρετε⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/002.yaml
  text: And he says to them[a], “Go into the village opposite you, and as soon as you enter it, you will find a colt tied there, on which no one has yet sat[b]. Untie it and bring it.”
translation:
  language: zh_hans
  text: 耶稣对他们说：“你们到对面的村子去；一进村，马上就会发现一头拴着的驴驹[a]，还没有人骑过它[b]。把它解开，带来。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “驴驹”原文可泛指幼小的动物；在这里指耶稣将要骑乘的幼驴。
    reason: lexical_alternative
  - marker: b
    text: 直译：“还没有一个人坐在它上面。”原文明确说尚未有人骑乘过它。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑπάγετε
  choice: 去
  rationale: 这是表示移动的命令式；“去”简洁自然，不额外加入“离开”等含义。
- source_word: κώμην τὴν κατέναντι ὑμῶν
  choice: 对面的村子
  rationale: κώμη指村子，κατέναντι表示在对面；这一表达准确而符合现代汉语。
- source_word: εὐθὺς εἰσπορευόμενοι εἰς αὐτήν
  choice: 一进村，马上
  rationale: 用“一……马上……”自然表达分词结构与εὐθύς的即时意义。
- source_word: πῶλον
  choice: 驴驹
  rationale: πῶλος本可泛指幼畜；本段叙事语境表明这是耶稣将要骑乘的幼驴。“驴驹”简明且符合上下文，同时以脚注保留词义范围。
- source_word: δεδεμένον
  choice: 拴着的
  rationale: 完成时被动分词表示它处于被拴住的状态；“拴着的”自然准确。
- source_word: οὐδεὶς οὔπω ἀνθρώπων ἐκάθισεν
  choice: 还没有人骑过它
  rationale: 按骑乘牲畜的语境将“坐在它上面”译为“骑过它”；“还没有人”保留οὔπω及ἀνθρώπων所强调的无人骑乘。
- source_word: λύσατε
  choice: 解开
  rationale: 指解开拴住牲畜的绳索；“解开”直接清楚。
- source_word: φέρετε
  choice: 带来
  rationale: φēρω在此意为把牲畜带到说话者这里；“带来”保留原词的宽泛意义，不限定具体以牵领或其他方式带来。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“一进村，马上”保留原文紧凑的叙事节奏；用“带来”而非“牵来”，避免把原文未明说的带领方式写入正文。
