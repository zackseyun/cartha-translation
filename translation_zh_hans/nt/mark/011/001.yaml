base_translation:
  language: en
  yaml_path: translation/nt/mark/011/001.yaml
  text: And when they were approaching Jerusalem[a], at Bethphage and Bethany, near the Mount of Olives[b], he sends two of his disciples
translation:
  language: zh_hans
  text: 他们将近耶路撒冷，来到靠近橄榄山的伯法其和伯大尼时[a]，耶稣就差派了他的两个门徒[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文连续使用空间介词；也可较直译为：“他们接近耶路撒冷，往伯法其和伯大尼、朝橄榄山的时候。”这些介词的具体空间关系可有不同译法。
    reason: lexical_alternative
  - marker: b
    text: 原文“差派”用叙事现在时，直译可作“耶稣差派他的两个门徒”；马可常用这种形式使叙述更有现场感。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγίζουσιν
  choice: 快到
  rationale: 表达正在接近目的地的动态含义；现代汉语叙事不必用显性的现在时形式，也能自然承接上下文。
- source_word: εἰς Ἱεροσόλυμα
  choice: 耶路撒冷
  rationale: 与“快到”连用时，汉语无需另加“向”或“到”，即可清楚表明所接近的目的地。
- source_word: εἰς Βηθφαγὴ καὶ Βηθανίαν
  choice: 来到……伯法其和伯大尼
  rationale: 这里的重复介词可表示行程所到的地点；“来到”比机械重复“到”更符合现代汉语叙事。
- source_word: πρὸς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: 橄榄山附近的
  rationale: πρός在此具有空间关系，可指临近或朝向；正文按上下文译为地点邻近关系，同时用脚注保留方向性译法。
- source_word: ἀποστέλλει
  choice: 差派了
  rationale: 马可使用叙事现在时增强现场感；汉语正文用自然的过去叙事表达，并在脚注说明原文形式及可选译法。
- source_word: δύο τῶν μαθητῶν αὐτοῦ
  choice: 两个门徒
  rationale: 汉语结合明确主语“耶稣”，自然表达为“两个门徒”；所属关系在语境中清楚，无需生硬译成“他的门徒中的两个”。
- source_word: Βηθφαγὴ
  choice: 伯法其
  rationale: 采用现代中文圣经中通行且易辨认的地名音译。
- source_word: Βηθανίαν
  choice: 伯大尼
  rationale: 采用现代中文圣经中通行且易辨认的地名音译。
- source_word: Ὄρος τῶν Ἐλαιῶν
  choice: 橄榄山
  rationale: 采用该地名通行、清楚的中文译法。
