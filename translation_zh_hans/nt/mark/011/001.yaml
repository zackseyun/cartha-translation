- from: 他们快到耶路撒冷，来到橄榄山附近的伯法其和伯大尼时[a]，耶稣差派了两个门徒[b]。
  to: 他们将近耶路撒冷，来到靠近橄榄山的伯法其和伯大尼时[a]，耶稣就差派了他的两个门徒[b]。
