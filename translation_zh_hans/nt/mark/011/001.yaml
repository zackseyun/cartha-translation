  source_fidelity: 正文基本传达了接近耶路撒冷、伯法其和伯大尼以及橄榄山的空间关系，也恰当地将马可的叙事现在时按汉语叙事习惯译为过去时。不过“他们快到耶路撒冷，来到……时”的衔接略显不稳：“快到”与“来到”并列时容易使读者不清楚“来到”是否已完成到耶路撒冷。并且“两个门徒”未明确保留原文“他的”这一所属关系。
  naturalness: “来到橄榄山附近的伯法其和伯大尼时”作为长定语虽可理解，但略显拥挤。改为“来到靠近橄榄山的伯法其和伯大尼时”较自然、清晰；以“将近耶路撒冷”与“来到……时”搭配也更符合现代汉语叙事。
  terminology: 伯法其、伯大尼、橄榄山均为通行且适当的中文地名。使用“差派”可准确表达ἀποστέλλει；补出“他的两个门徒”保留αὐτοῦ。耶稣作为本段明确的叙事主语可在汉语中明说，不构成神学性增译。
  issues:
