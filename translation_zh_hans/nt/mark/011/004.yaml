  text: And they went away and found a colt tied at a door outside on the street[a], and they untied it.
translation:
  language: zh_hans
  text: 他们去了，发现一匹小驹拴在门外的街道上[a]，就把它解开了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“拴在一扇临街的门旁。”希腊语中“外面”和“街道上”与“门”的空间关系可以有略微不同的理解。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθον
  choice: 去了
  rationale: 表示他们离开耶稣吩咐他们的地方前去办事；现代汉语用“去了”自然简洁，方向和离开的含义由上下文体现。
- source_word: εὗρον
  choice: 发现
  rationale: 在叙事中自然表达他们按指示找到那匹小驴。
- source_word: πῶλον
  choice: 一匹小驴
  rationale: πῶλος泛指幼小的马属动物；本节自身未明说种类，但上下文指向驴。“小驴”符合语境和普通中文表达，同时避免使用可能让人想到幼马的“小马驹”。
- source_word: δεδεμένον
  choice: 拴着
  rationale: 完成时被动分词描述当时持续存在的状态；“拴着”比“捆绑着”更符合牲畜被系住的具体场景。
- source_word: πρὸς θύραν
  choice: 一扇门旁
  rationale: πρός在此表示靠近某处；“门旁”是自然、准确的空间表达。
- source_word: ἔξω
  choice: 外面
  rationale: 保留该处位于户外的明确空间信息。
- source_word: ἐπὶ τοῦ ἀμφόδου
  choice: 街边
  rationale: ἄμφοδον可指街道、巷道或通道；ἐπί加属格在此标示临街的位置。“街边”自然地表达门与街道相接的位置，同时不把小驴的位置过度限定为街道正中。
- source_word: λύουσιν αὐτόν
  choice: 就把它解开
  rationale: λύουσιν是叙事中的历史现在时，现代汉语宜按连续事件译为完成性动作；“解开”准确表达解开拴系之物。
