  text: καὶ ⸀ἔλεγον αὐτῷ· Ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιεῖς; ⸀ἢ τίς σοι ⸂ἔδωκεν τὴν ἐξουσίαν ταύτην⸃ ἵνα ταῦτα ποιῇς;
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/028.yaml
  text: And they were saying to him[b][a], “By what authority are you doing these things? Or who gave you this authority to do these things?”
translation:
  language: zh_hans
  text: 他们对他说：“你凭着什么权柄做这些事？还是谁给了你这权柄，让你做这些事？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: 他们对他说
  rationale: 未完成时可描写当时正在进行的发问；现代汉语叙事中用“说”自然表达，不必机械加入“不断”。
- source_word: Ἐν ποίᾳ ἐξουσίᾳ
  choice: 你凭什么权柄
  rationale: ἐν加与格在此询问行动所凭借的授权或资格；“凭什么权柄”既自然，也保留对合法授权的质问。
- source_word: ἐξουσίᾳ / ἐξουσίαν
  choice: 权柄
  rationale: 此词在圣殿语境中指行事的权力、资格或授权；“权柄”能涵盖这些含义，并适合庄重的经文语体。
- source_word: ταῦτα ποιεῖς / ταῦτα ποιῇς
  choice: 做这些事／让你做这些事
  rationale: 保留ταῦτα的复数指向，使其可概括耶稣近期的行动与教导；第二处按ἵνα结构自然译出。
- source_word: ἢ
  choice: （以第二问直接承接）
  rationale: 第二问是对第一问的另一种追问。汉语中直接连问比加入生硬的“或者”更自然，同时不改变两问之间的替代表述关系。
- source_word: τίς σοι ἔδωκεν
  choice: 是谁给了你
  rationale: 准确保留发问者对授权来源的追究，并以“了”自然表达既成的授予行为。
- source_word: ἵνα ταῦτα ποιῇς
  choice: 让你做这些事
  rationale: ἵνα加虚拟式在这里依附于“给了你这权柄”，可表示所授权柄的目的或内容；“让你做”自然保留这种关系。
theological_decisions:
- issue: 耶稣所凭授权的性质与来源
  choice: 中性呈现领袖对其权柄及来源的质问
  alternative: 在译文中明说或暗示这是来自上帝的权柄
  rationale: 本节只记录质问，并未在句中回答权柄来自何处；译文不预先消解这一神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“权柄”比单纯的“权力”更能表达被授予的行事资格，也符合宗教与公共权威语境。两句问话简洁有力，保留原文的挑战语气。
