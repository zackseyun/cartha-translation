base_translation:
  language: en
  yaml_path: translation/nt/mark/011/020.yaml
  text: And as they were passing by early in the morning[a], they saw the fig tree withered from the roots.
translation:
  language: zh_hans
  text: 清早，他们经过的时候，看见那棵无花果树已经从根部枯萎了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“已经从根部干枯了。”
    reason: “枯萎”与“干枯”都可表达ἐξηραμμένην；前者更符合现代汉语对树木状态的通常描述，后者更直接体现变干的词义。
lexical_decisions:
- source_word: παραπορευόμενοι
  choice: 他们从那里经过
  rationale: 现在时分词表示与“看见”同时发生的背景动作；译为“从那里经过”既自然，也与上文叙事地点衔接，但不额外指定行进方向。
- source_word: πρωῒ
  choice: 清早
  rationale: 该副词指早晨较早的时候；“清早”简洁、自然，并保留时间上的早。
- source_word: εἶδον
  choice: 看见
  rationale: 直接表达视觉感知，不像“注意到”那样增加主动留意的含义。
- source_word: τὴν συκῆν
  choice: 那棵无花果树
  rationale: 定冠词在叙事中回指前文提到的树；现代汉语用“那棵”可自然表达这一回指。
- source_word: ἐξηραμμένην
  choice: 已经……枯萎了
  rationale: 完成时被动分词描述先前发生变化后持续存在的状态；“已经……枯萎了”适合树木，并体现结果状态。
- source_word: ἐκ ῥιζῶν
  choice: 从根部
  rationale: 忠实保留枯萎由根部起或达到根部的空间意象，不用“连根”来过度限定其确切方向或范围。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“清早”置于句首，符合汉语时间状语习惯；用一个连贯句保留原文背景动作与主要感知动作的关系。脚注标记放在其实际说明的“从根部枯萎了”之后，而非时间短语之后。
