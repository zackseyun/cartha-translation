translation:
  language: zh_hans
  text: 他不许任何人携带任何器物[b]穿过圣殿区域[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“圣殿院落”或“圣殿范围”。希腊语所指的是整个圣殿范围，并非特指内殿。
    reason: lexical_alternative
  - marker: b
