    reason: lexical_alternative
lexical_decisions:
- source_word: ἤφιεν
  choice: 不许
  rationale: 未完成时在这里表示耶稣当时持续拦阻这类行为；汉语“不许”配合语境即可自然表达持续性的禁止。
- source_word: ἵνα τις διενέγκῃ
  choice: 不许任何人……穿过，搬运
  rationale: ἵνα加虚拟式说明不被允许发生的事；现代汉语用“不许任何人……”表达最自然。
- source_word: διενέγκῃ
  choice: 穿过，搬运
  rationale: 该动词在此指把东西带过某一区域；把“穿过”提前，既保留方向含义，也使汉语句序清楚自然。
- source_word: σκεῦος
  choice: 任何器物
  rationale: σκεῦος泛指器具、物件或容器。“器物”保留其宽泛含义，不擅自限定具体种类。
- source_word: διὰ τοῦ ἱεροῦ
  choice: 从圣殿区域穿过
  rationale: ἱερόν指整个圣殿范围，而非特指内殿（ναός）；“圣殿区域”准确表达这一空间范围。
theological_decisions:
- issue: ἱερόν所指的耶路撒冷圣殿范围
  choice: 圣殿区域
  alternative: 圣殿；圣殿院宇
  rationale: 原词指较广的圣殿建筑群和院落，并非专指内殿；译作“圣殿区域”避免让读者误以为有人携物进入内殿，同时不把范围缩限为某一个院子。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。“圣殿区域”说明空间范围，“器物”保留原文词义的概括性；以“不许任何人”自然呈现未完成时所表达的持续拦阻。
