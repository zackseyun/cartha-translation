  text: καὶ ἐάν τις ὑμῖν εἴπῃ· Τί ποιεῖτε τοῦτο; εἴπατε ⸀ὅτι Ὁ κύριος αὐτοῦ χρείαν ἔχει· καὶ ⸀εὐθὺς αὐτὸν ἀποστέλλει ⸀πάλιν ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/003.yaml
  text: And if anyone says to you[a], ‘Why are you doing this?’ say[b], ‘The Lord has need of it,’ and he will send it back here immediately.
translation:
  language: zh_hans
  text: 如果有人问你们：‘你们为什么这样做？’你们就说：‘主需要它[a]，并且主会立刻把它送回这里[b]。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “主”也可译作“主人”。希腊语κύριος既可指“主”，也可指“主人”；这里按福音书的上下文译作“主”。
    reason: alternative_reading
  - marker: b
    text: 也可译作“并且主立刻把它送回这里”。希腊文动词是现在时；在此处可理解为表达将来的意思，也可按生动现在时理解。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τις ὑμῖν εἴπῃ
  choice: 如果有人问你们
  rationale: ἐάν与虚拟语气构成开放的将来条件；因后接疑问内容，现代汉语用“问”比直译“说”自然。
- source_word: Τί ποιεῖτε τοῦτο;
  choice: 你们为什么这样做？
  rationale: τί在此语境中是对行为提出质问；“为什么这样做”自然传达该语用功能，同时保留质问语气。
- source_word: εἴπατε
  choice: 你们就说
  rationale: 准确表达复数命令式；“就”与前面的条件句自然衔接。
- source_word: Ὁ κύριος
  choice: 主
  rationale: 保留κύριος在马可福音语境中作为称号的力度，不将其弱化为纯世俗意义的“主人”。
- source_word: αὐτοῦ χρείαν ἔχει
  choice: 需要它
  rationale: 所指是前文的驴驹；现代汉语“需要它”比形式化的“对它有需要”更自然。
- source_word: εὐθὺς
  choice: 立刻
  rationale: 传达马可常用的即时、紧迫意味。
- source_word: αὐτὸν ἀποστέλλει πάλιν ὧδε
  choice: 会把它送回这里
  rationale: ἀποστέλλει虽为现在时，在条件情境中可作将来意义理解；πάλιν与动词连用自然译作“送回”，ὧδε译作“这里”。
theological_decisions:
- issue: κύριος的所指与称号力度
  choice: 译作“主”，在叙事中指耶稣
  alternative: 译作“主人”，理解为一般的主人或物主
  rationale: 上下文是耶稣亲自吩咐门徒如此回答；译作“主”保留该词在福音书语境中的称号意味，同时不额外加入经文本身未明说的教义解释。
- issue: ἀποστέλλει的时态理解及隐含主语
  choice: 按将来意义译为“会……送回”，主语依上下文理解为提出质问的人
  alternative: 按形式上的现在时译为“就把它送回这里”，或把隐含主语理解为“主”
  rationale: 现在时可作生动或将来用法。语法上第三人称单数主语未明说，存在一定解释空间；正文采用最顺畅的上下文理解，脚注保留时态及主语歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你们就说”清楚体现复数命令；“需要它”避免生硬欧化表达。正文保持口语对话的自然节奏，并用脚注呈现κύριος、动词时态和隐含主语的真实歧义。
