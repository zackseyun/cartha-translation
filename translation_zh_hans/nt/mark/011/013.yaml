id: MRK.11.13
reference: Mark 11:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἰδὼν συκῆν ⸀ἀπὸ μακρόθεν ἔχουσαν φύλλα ἦλθεν εἰ ἄρα ⸂τι εὑρήσει⸃ ἐν αὐτῇ, καὶ ἐλθὼν ἐπ’ αὐτὴν οὐδὲν εὗρεν εἰ μὴ φύλλα, ⸂ὁ γὰρ καιρὸς οὐκ ἦν⸃ σύκων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/013.yaml
  text: And seeing from a distance a fig tree having leaves[a], he went to see whether perhaps he would find anything on it. But when he came to it, he found nothing except leaves, for it was not the season for figs.
translation:
  language: zh_hans
  text: 他远远看见一棵长着叶子的无花果树，就走过去，想看看能不能在树上找到什么。可是到了树前，他除了叶子，什么也没有找到，因为那时不是无花果的季节。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为那时不是结无花果的时候。”
    reason: καιρός可译为“季节”或“时候”；正文采用语境中更自然的“季节”，脚注保留较贴近词面结构的译法。
lexical_decisions:
- source_word: ἰδὼν
  choice: 看见
  rationale: 以自然的汉语叙事表达伴随并带有时间意味的分词，不额外限定为严格的先后关系。
- source_word: συκῆν
  choice: 一棵无花果树
  rationale: 这是该词在本语境中的标准含义，也符合现代汉语量词习惯。
- source_word: ἀπὸ μακρόθεν
  choice: 远远
  rationale: 简洁、自然地保留空间距离的含义。
- source_word: ἔχουσαν φύλλα
  choice: 长着叶子的
  rationale: 贴近原文“有叶子”的描述，同时比生硬的“有叶子的”更符合现代汉语。
- source_word: ἦλθεν εἰ ἄρα τι εὑρήσει ἐν αὐτῇ
  choice: 就走过去，看看或许能从树上找到什么
  rationale: “看看”表达行动目的，“或许”保留 εἰ ἄρα 的试探性和不确定性；“从树上”符合汉语表达。
- source_word: ἐλθὼν ἐπ’ αὐτὴν
  choice: 到了树前
  rationale: 自然表达走近这棵树的动作，并避免代词指代含混。
- source_word: οὐδὲν εὗρεν εἰ μὴ φύλλα
  choice: 除了叶子，什么也没有找到
  rationale: 直接保留“除……以外一无所获”的排除结构。
- source_word: ὁ γὰρ καιρὸς οὐκ ἦν σύκων
  choice: 因为那时不是无花果的季节
  rationale: καιρός 在这里指适宜的时节；此译法直接保留叙述者的解释，不扩充农业背景，也不消解经文张力。
theological_decisions:
- issue: 无花果时节说明语的解释力度
  choice: 直译为“因为那时不是无花果的季节”
  alternative: 解释性扩译为尚未到正常结果期，或借农业背景说明为何可能仍期待早果
  rationale: 原文一方面叙述耶稣寻找果子，另一方面说明当时不是无花果的时节。译文应保留这一张力，不以释义替原文解决问题。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“远远看见”“走过去”“到了树前”使动作顺序清楚；不加入原文没有的主语名称或农业解释。脚注标记置于相关解释句之后。
