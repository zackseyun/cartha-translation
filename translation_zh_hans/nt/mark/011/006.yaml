base_translation:
  language: en
  yaml_path: translation/nt/mark/011/006.yaml
  text: And they said to them just as Jesus had said[a], and they let them go.
translation:
  language: zh_hans
  text: 门徒就照耶稣所说的回答他们；那些人便让他们把驴驹牵走了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “让他们把驴驹牵走”也可译作“准许他们”或“不再拦阻他们”。希腊语动词可表示准许、释放或放走；这里是说那些人不再阻止门徒牵走驴驹。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: 门徒就
  rationale: 定冠词作名词用，承接上下文所指的两个门徒；δέ在这里推动叙事，以“就”自然表达。
- source_word: εἶπαν αὐτοῖς
  choice: 回答他们
  rationale: εἶπαν本义为“说”，但上文那些人刚提出质问，因此汉语用“回答他们”更贴合语境，同时不增加实质内容。
- source_word: καθὼς εἶπεν ὁ Ἰησοῦς
  choice: 照耶稣所说的
  rationale: καθώς表示言语与耶稣先前吩咐相符；“照……所说的”既保留对应关系，也符合现代汉语表达。
- source_word: ἀφῆκαν αὐτούς
  choice: 那些人便让他们牵走了
  rationale: ἀφίημι在此表示准许、不再阻拦；结合所牵的是驴驹，“让他们牵走”比孤立的“让他们走”更清楚。主语“那些人”依据上下文补明。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而通俗的现代标准汉语。“门徒”和“那些人”均由上下文明确角色，避免汉语连续代词造成歧义；脚注保留ἀφίημι的词义幅度。
