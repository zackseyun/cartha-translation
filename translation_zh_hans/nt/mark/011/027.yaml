  text: Καὶ ἔρχονται πάλιν εἰς Ἱεροσόλυμα. καὶ ἐν τῷ ἱερῷ περιπατοῦντος αὐτοῦ ἔρχονται πρὸς αὐτὸν οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς καὶ οἱ πρεσβύτεροι
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/027.yaml
  text: And they came again to Jerusalem. And as he was walking in the temple courts[a], the chief priests and the scribes and the elders came to him.
translation:
  language: zh_hans
  text: 他们又来到耶路撒冷。耶稣在圣殿区域[a]行走时，祭司长、经学家和长老来到他跟前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“圣殿里”或“在圣殿范围内”。希腊文指整个圣殿建筑群及其范围，并非特指内层圣所。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχονται
  choice: 来到
  rationale: 希腊文使用历史现在时推进叙事；现代汉语自然地按既成事件表达为“来到”，无需机械保留现在时。
- source_word: πάλιν
  choice: 又
  rationale: 简洁自然地表达再次来到耶路撒冷。
- source_word: Ἱεροσόλυμα
  choice: 耶路撒冷
  rationale: 采用现代汉语通行地名译法。
- source_word: ἐν τῷ ἱερῷ
  choice: 在圣殿区
  rationale: ἱερόν指较广的圣殿建筑群或范围，而非特指内殿；“圣殿区”既准确又适合现代读者。
- source_word: περιπατοῦντος αὐτοῦ
  choice: 耶稣……行走的时候
  rationale: 属格独立结构提供同时发生的背景动作；汉语补出“耶稣”以避免连续代词指向含混，并保留动作的持续性。
- source_word: ἀρχιερεῖς
  choice: 祭司长
  rationale: 复数在此指居领导地位的祭司群体；“祭司长”是准确而通行的称谓，并非多个在任大祭司。
- source_word: γραμματεῖς
  choice: 经学家
  rationale: 指研习、抄写并讲解圣经律法的专业人士；“经学家”比现代语境下容易误解为单纯抄写员的“文士”更清楚，同时不将其功能窄化为单一称谓。
- source_word: πρεσβύτεροι
  choice: 长老
  rationale: 此处指获承认的犹太领袖，而非泛指年长男子。
- source_word: πρὸς αὐτόν
  choice: 来到他跟前
  rationale: 自然表达朝向耶稣并到达其面前的动作。
theological_decisions:
- issue: ἱερόν所指的空间范围
  choice: 圣殿区
  alternative: 圣殿；圣殿范围内
  rationale: 译文避免让读者误以为耶稣进入只有祭司可进入的内殿，同时保留其为公共活动所在的较广圣殿范围；这是词义与空间背景的判断，不作额外教义推论。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。“又来到”保持马可叙事的推进感；第二句以“耶稣”明确所指。“祭司长、经学家和长老”保留三类领袖并列的结构。
