  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς λέγει αὐτοῖς· Ἔχετε πίστιν θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/022.yaml
  text: And Jesus answered them[a], “Have faith in God.”
translation:
  language: zh_hans
  text: 耶稣回答他们说[a]：“要信靠上帝。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较直译作“要有上帝的信心”；原文的属格结构也可理解为“要有上帝的信实”或“要有从上帝而来的信心”。
    reason: 保留πίστιν θεοῦ这一属格结构的真实语法与神学歧义。
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: 回答
  rationale: 该分词常用于引出回应；汉语用限定动词“回答”更自然，也准确表达其话语功能。
- source_word: λέγει
  choice: 说
  rationale: 原文采用历史现在时。现代汉语叙事不必以时态形态对应；与ἀποκριθεὶς合译为“回答他们说”，既自然又保留了发言引介。
- source_word: Ἔχετε
  choice: 要
  rationale: 这是现在时命令语气，要求一种持续的态度。汉语以“要”表达劝勉或命令，避免用“持守”等词过度阐释其体貌。
- source_word: πίστιν
  choice: 信靠
  rationale: 此处πίστις指向对上帝的信，汉语“信靠”比单说“信心”更自然地表达信赖的行动与取向。
- source_word: θεοῦ
  choice: 上帝
  rationale: 在主文中将属格理解为客体属格，即信靠所指向的对象是上帝；原文属格结构的其他可能理解在脚注中保留。
theological_decisions:
- issue: πίστιν θεοῦ中的属格歧义
  choice: 客体属格：“信靠上帝”
  alternative: 较直译为“要有上帝的信”，也可能理解为“要有上帝的信实”或“要有从上帝而来的信心”
  rationale: 上下文从枯干的无花果树转入有关相信与祷告的教导（11:23–24），因此将其理解为门徒应当信靠上帝最为连贯。不过，希腊文πίστιν θεοῦ本身确有属格歧义，故不在翻译中完全消除，而以脚注保存其他可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“回答他们说”略带经文叙事风格但仍自然；“信靠上帝”清楚表达主文所取的客体属格读法。
