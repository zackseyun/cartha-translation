  text: ἀλλὰ εἴπωμεν· Ἐξ ἀνθρώπων;— ἐφοβοῦντο τὸν ⸀ὄχλον, ἅπαντες γὰρ εἶχον τὸν Ἰωάννην ⸂ὄντως ὅτι⸃ προφήτης ἦν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/032.yaml
  text: But if we say[a], ‘From men’?”—they were afraid of the crowd[b], for everyone held that John truly was a prophet.
translation:
  language: zh_hans
  text: “但如果我们说：‘是从人来的[a]？’”——他们害怕众人，因为所有人都认定约翰确实是先知[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译为“是出于人的”或“源于人”。这里指约翰洗礼的来源。
    reason: lexical_alternative
  - marker: b
    text: 也可译为“所有人都把约翰看作真正的先知”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ εἴπωμεν
  choice: 但如果我们说
  rationale: 保留ἀλλά所引出的另一种回答，并以现代汉语自然的条件式表达商议语境中的虚拟式εἴπωμεν。
- source_word: Ἐξ ἀνθρώπων
  choice: 是从人来的
  rationale: 贴近原文“出于人”的来源表达，并承接上文关于约翰洗礼来源的问题；不在正文中扩写为“出于人的权威”。
- source_word: ἐφοβοῦντο τὸν ὄχλον
  choice: 他们又怕众人
  rationale: “怕众人”自然表达他们顾忌现场民众的反应；“又”体现这是另一回答所造成的相应困境，而不改变原文逻辑。
- source_word: ἅπαντες
  choice: 人人
  rationale: 传达“所有人、每个人”的周遍意义，行文简洁自然。
- source_word: εἶχον τὸν Ἰωάννην ὄντως ὅτι προφήτης ἦν
  choice: 都认定约翰确实是先知
  rationale: 此处ἔχω表示持有某种看法；“认定”体现坚定判断，ὄντως译为“确实”，同时把整句保持在众人的观点之内。
theological_decisions:
- issue: Ἐξ ἀνθρώπων所指的来源
  choice: 是从人来的
  alternative: 是出于人的／源于人
  rationale: 原文与“从天上来”形成对照，正文保留来源意象，不把它解释性地限定为权威、制度或纯属人为。
- issue: 众人对约翰先知身份的判断
  choice: 人人都认定约翰确实是先知
  alternative: 人人都把约翰看作真正的先知
  rationale: 所述是众人的确信，而非脱离叙事框架另加的作者断言；“确实”保留ὄντως的强调作用。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事语言。引号内的停顿和破折号保留他们没有把话说完、叙述随即说明原因的效果；“众人”符合福音书叙事语体。
