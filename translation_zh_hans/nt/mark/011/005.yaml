review_pass:
  verdict: revise
  source_fidelity: 正文准确保留了不定复数、在场站立者、对复数对象说话，以及以“解开”描述正在进行的动作。惟“有几个”容易带出数量偏少的意味，较原文不定的“有些”略窄；原问句的语序也不够自然。
  naturalness: “你们解开那头驹，是在做什么？”虽可理解，但现代汉语较为生硬。“你们解开这头驹做什么？”更自然，仍是对该动作提出直接询问，并不加入原文未明说的理由或动机。
  terminology: “驹”可在正文中保留πῶλος的概括性，但中文通常更易联想到马驹，脚注宜说明其可指马驹或驴驹，并以“通常理解”为限，避免把马可本节未明说的具体动物当作无歧义事实。
  issues:
  - severity: low
    issue: “有几个”可能暗示人数较少。
    rationale: τινες只指未明确的一部分人；“有些”更中性地保留不定性。
  - severity: medium
    issue: 问句语序不够符合自然现代汉语。
    rationale: 将分词性动作融入“解开这头驹做什么”可自然表达“你们在做什么，解开这头驹”的问题，不改变原意。
  - severity: low
    issue: 脚注将本处动物断言为驴驹，措辞略强。
    rationale: πῶλος本身是较宽泛的幼小动物称谓；虽本处通常理解为驴驹，脚注应保留这一判断的解释性质。
  revised_text: 有些站在那里的人对他们说：“你们解开这头驹做什么？”
