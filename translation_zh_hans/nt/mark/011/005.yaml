base_translation:
  language: en
  yaml_path: translation/nt/mark/011/005.yaml
  text: And some of those standing there were saying to them[a], “What are you doing, untying the colt?”
translation:
  language: zh_hans
  text: 有些站在那里的人对他们说：“你们解开这头驹做什么？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τινες
  choice: 有几个
  rationale: 表示在场者中未具体指明的一部分人，保留原文的不定性，也符合现代汉语表达。
- source_word: τῶν ἐκεῖ ἑστηκότων
  choice: 站在那里的人
  rationale: 贴近原文的实体化分词结构，不将这些人进一步解释为旁观者。
- source_word: ἔλεγον
  choice: 说
  rationale: 希腊语未完成时呈现当时正在发生的言语行为；汉语在此以“说”自然叙述，不强行加入“不断”等重复含义。
- source_word: αὐτοῖς
  choice: 对他们
  rationale: 保留复数间接宾语，所指为正在解驹的人。
- source_word: Τί ποιεῖτε
  choice: 是在做什么
  rationale: 保留原文直接询问“做什么”的形式，不改译为解释性的“为什么”。
- source_word: λύοντες
  choice: 解开
  rationale: 在牲畜被拴住的语境中，λύω自然指解开系绳；比笼统的“放开”更准确。
- source_word: τὸν πῶλον
  choice: 那头驹
  rationale: πῶλος本义可泛指幼小的马科牲畜；“驹”保留原词相对宽泛的指称，而量词“头”符合现代汉语习惯。上下文表明这里是驴驹，另以脚注说明。
theological_decisions: []
