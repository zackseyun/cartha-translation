  text: καὶ ⸀ἀποκριθεὶς εἶπεν αὐτῇ· Μηκέτι ⸂εἰς τὸν αἰῶνα ἐκ σοῦ⸃ μηδεὶς καρπὸν φάγοι. καὶ ἤκουον οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/014.yaml
  text: And answering[a], he said to it[c][b], “May no one ever eat fruit from you again.” And his disciples were listening.
translation:
  language: zh_hans
  text: 他就对无花果树说[a]：“从今以后，永远不要再有人吃你的果子。”他的门徒听见了这话[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “对……说”直译为“回答说”。即使前面没有记载任何话，希腊文也常用“回答”来引出回应。
    reason: lexical_alternative
  - marker: b
    text: 也可译为：“他的门徒当时正在听着。”希腊文的未完成过去时可以突出门徒当时持续在听。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν αὐτῇ
  choice: 他就对无花果树说
  rationale: ἀποκριθείς直译为“回答”，但希腊叙事中即使此前无人发言，也可作为引出回应的惯用表达。汉语正文自然处理为“就……说”，并以脚注保留原文形式；αὐτῇ所指为无花果树，明说所指可避免汉语代词含混。
- source_word: Μηκέτι
  choice: 从今以后……不要再
  rationale: 表达“不再、再也不”的持续否定意义，与εἰς τὸν αἰῶνα共同形成强烈而永久的禁止或咒诅语气。
- source_word: εἰς τὸν αἰῶνα
  choice: 永远
  rationale: 该短语字面为“直到世代”，在此为惯用表达，意为“永远”；不将其扩展解释为特定末世论概念。
- source_word: ἐκ σοῦ
  choice: 你的
  rationale: 原文以第二人称直接对树说话；“你的果子”自然保留了直接称呼。
- source_word: μηδεὶς καρπὸν φάγοι
  choice: 不要再有人吃……果子
  rationale: φάγοι为不定过去时祈愿式，在否定句中表达咒诅或强烈愿望，而不是普通将来预测；汉语用“不要……有人”保留其祈愿、宣告性质。
- source_word: ἤκουον
  choice: 都听见了
  rationale: 未完成过去时可表示当时正在听，也可概括为听见了；正文采用自然的汉语叙事表达，并在脚注说明体貌上的另一种译法。
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: 他的门徒
  rationale: 符合现代汉语的自然所属表达。
theological_decisions:
- issue: 耶稣对无花果树所说之话的性质
  choice: 译为带有祈愿式力量的咒诅或审判宣告：“永远不要再有人……”
  alternative: 译作单纯预言：“永远不会再有人……”
  rationale: φάγοι是祈愿式，并非将来时直陈式；译文应保留耶稣在此发出咒诅或审判宣告的语气，而不把它弱化为对未来状况的预测。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“从今以后，永远不要再……”兼顾μηκέτι与εἰς τὸν αἰῶνα的叠加强调；不照搬希腊语“回答说”造成生硬正文，但用脚注保存其形式与叙事特色。
