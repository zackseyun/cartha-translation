  to: 他就对无花果树说[a]：“从今以后，永远不要再有人吃你的果子。”他的门徒听见了这话[b]。
  rationale: 仅作两项轻微修订：删除末句中原文未明说的“也都”，并加上汉语中自然且由语境明确的宾语“这话”；相应调整脚注b，使其准确说明未完成过去时的持续性替代译法。其余译文和脚注忠实、自然，宜保留。
