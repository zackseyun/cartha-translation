  naturalness: 整体为自然、庄重的现代汉语。“对无花果树说”清楚而不生硬。将末句改为“他的门徒听见了这话”比“他的门徒也都听见了”更简洁自然，指代也更明确。
  terminology: “无花果树”“门徒”“果子”均符合通行的现代汉语圣经叙事用语。无需加入“咒诅”等解释性术语；正文的祈愿式表达已足以保存原文语气。
