  yaml_path: translation/nt/mark/011/026.yaml
  text: But[a] if you do not forgive, neither will your Father who is in heaven forgive your trespasses.
translation:
  language: zh_hans
  text: 但[a]你们若不饶恕人，你们在天上的父也不会饶恕你们的过犯。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节不见于现存最早的一些希腊文抄本（包括四世纪的西奈抄本和梵蒂冈抄本）及早期科普特文译本，但见于拜占庭多数文本、拉丁文传统和大多数叙利亚文见证。它可能是后来的抄写员为使本处与耶稣在《马太福音》6:15的话一致而增添的。
    reason: textual_critical
lexical_decisions:
- source_word: ἀφίημι
  choice: 饶恕
  rationale: 在涉及人际冒犯与父的赦免这一语境中，“饶恕”是现代汉语圣经语体中自然、准确的表达；首处依汉语需要补出宾语“人”，第二处保留“饶恕你们的过犯”的源文结构。
- source_word: παράπτωμα
  choice: 过犯
  rationale: “过犯”既表达偏离正道、冒犯的含义，也与较宽泛的“罪”有所区别，符合本节的道德与关系语境。
- source_word: ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς
  choice: 你们在天上的父
  rationale: 采用自然、庄重的现代汉语表达，完整保留“你们的父”及“在天上”的限定。
theological_decisions:
- issue: 人的饶恕与天父饶恕之间的关系
  choice: 保留“若不……也不会……”的直接条件关系
  alternative: 弱化为一般劝勉或解释为饶恕仅是得救后的证据
  rationale: 希腊原文直接陈述条件及其后果；译文不额外界定其系统神学机制，以保留经文本身的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“但”承接上文并保留 δέ 的转折；脚注标记紧随其后。首个 ἀφίετε 在希腊文中未明说宾语，汉语补作“人”以避免句意残缺，但不限定具体对象。
