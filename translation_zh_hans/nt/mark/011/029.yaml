source:
  edition: SBLGNT
  text: ὁ δὲ ⸀Ἰησοῦς εἶπεν αὐτοῖς· Ἐπερωτήσω ⸀ὑμᾶς ἕνα λόγον, καὶ ἀποκρίθητέ μοι, καὶ ἐρῶ ὑμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/029.yaml
  text: But Jesus said to them[a], “I will ask you one question. Answer me[b], and I will tell you by what authority I do these things.”
translation:
  language: zh_hans
  text: 耶稣却对他们说：“我要问你们一个问题[a]。你们回答我，我就告诉你们，我凭什么权柄做这些事。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “问题”直译“一个话语”，也可理解为“一件事”。
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: 却
  rationale: 表示耶稣针对宗教领袖的质问作出回应，带有轻微转折；“却”既承接上文，又不过分强化对立。
- source_word: Ἐπερωτήσω ὑμᾶς
  choice: 我要问你们
  rationale: 自然表达将来时所引出的反问，同时保留直接、明确的语气。
- source_word: ἕνα λόγον
  choice: 一个问题
  rationale: λόγος字面可指“话”或“事情”，但此处所指的是要求对方回答的问题；正文按语境译为“一个问题”，并用脚注保留词义范围。
- source_word: ἀποκρίθητέ μοι
  choice: 你们回答我
  rationale: 保留不定过去时命令语气的直接要求；现代汉语中简洁自然。
- source_word: ἐρῶ ὑμῖν
  choice: 我就告诉你们
  rationale: 在语境中表示对方回答之后，耶稣便会说明；“就”自然呈现相承关系，但不添加实质内容。
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: 凭什么权柄
  rationale: ἐν在此表示行事的依据或授权；“凭什么权柄”符合现代汉语习惯，并保留合法资格与权威的含义。
- source_word: ταῦτα ποιῶ
  choice: 我……做这些事
  rationale: 保留现在时所指的、正受质疑的这些行动，不具体限定为某一件事。
theological_decisions:
- issue: ἐξουσία在本段中的含义
  choice: 权柄
  alternative: 权力；权利
  rationale: 争论焦点是耶稣凭何种合法授权或资格行这些事，而非单纯具有何种能力；“权柄”能保留其制度性和神学张力，又不说明权柄来源。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“你们回答我，我就告诉你们”将希腊文并列结构转化为汉语中清楚的相承表达，同时保留命令及随后应允的力度。
