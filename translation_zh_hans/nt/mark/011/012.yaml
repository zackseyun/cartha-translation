  text: Καὶ τῇ ἐπαύριον ἐξελθόντων αὐτῶν ἀπὸ Βηθανίας ἐπείνασεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/012.yaml
  text: And on the next day, when they had gone out from Bethany, he was hungry.
translation:
  language: zh_hans
  text: 第二天，他们从伯大尼出来后，他饿了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: （不单独译出）
  rationale: 此处καί承接叙事。现代汉语以“第二天”直接衔接上下文更自然，无须机械译作“而且”或“然后”。
- source_word: τῇ ἐπαύριον
  choice: 第二天
  rationale: 该结构作时间状语，表示紧接前述事件的次日；“第二天”是自然、准确的现代汉语表达。
- source_word: ἐξελθόντων αὐτῶν
  choice: 他们……出来的时候
  rationale: 属格独立结构表示与主句相关的时间背景；复数“他们”忠实保留原文，并与主句单数主语形成区别。
- source_word: ἀπὸ Βηθανίας
  choice: 从伯大尼
  rationale: ἀπό表示从某地离开；“伯大尼”采用通行的圣经地名译法。
- source_word: ἐπείνασεν
  choice: 他饿了
  rationale: 简洁自然地表达πεινάω不定过去时所报告的饥饿状态或其发生；比“他是饥饿的”自然，也不过度强调起始体。
theological_decisions:
- issue: ἐπείνασεν的隐含主语
  choice: 译作“他”，不增补“耶稣”
  alternative: 为求明确而译作“耶稣饿了”
  rationale: 原文没有明说主语姓名，但上下文清楚指向耶稣。保留“他”既符合原文的简约，也不削弱经文对其真实饥饿的陈述。
- issue: 不定过去时是否必须译为起始意义
  choice: 译作“饿了”
  alternative: 译作“开始觉得饿了”或“感到饥饿”
  rationale: 该动词形式可以概括性地陈述饥饿，并不强制要求突出“开始”。“饿了”在汉语中既自然，又容纳状态发生与状态存在之间的语义张力。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事表达。保留“他们”与“他”的数差异；不增补原文未明说的姓名，也不设置无必要脚注。
