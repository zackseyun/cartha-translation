base_translation:
  language: en
  yaml_path: translation/nt/mark/011/017.yaml
  text: And he was teaching and saying to them[a], “Is it not written[b], ‘My house will be called a house of prayer for all the nations’? But you have made it a den of robbers.”
translation:
  language: zh_hans
  text: 他教导他们，说：“经上不是记着吗？‘我的殿必称为万国祷告的殿[a]。’你们却把它弄成了强盗的巢穴[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “万国”也可译作“万民”。这里呼应以赛亚书56:7，强调圣殿原本要接纳以色列以外的人。
    reason: lexical_alternative
  - marker: b
    text: “强盗的巢穴”呼应耶利米书7:11。“强盗”一词在某些语境中也可指“盗匪”或“匪徒”。
    reason: cross_reference
lexical_decisions:
- source_word: ἐδίδασκεν καὶ ἔλεγεν
  choice: 继续教导……说
  rationale: 两个未完成时动词表现当时持续进行的教导和讲话；现代汉语用“继续”自然传达这一叙事体意义，不机械重复“又……又……”。
- source_word: Οὐ γέγραπται
  choice: 经上不是记着吗
  rationale: 保留完成时被动态所形成的引用经书惯用语，也传达反问和诉诸经书权威的语气。
- source_word: Ὁ οἶκός μου
  choice: 我的殿
  rationale: οἶκος直译为“房屋”，但此处明确指圣殿；“殿”在现代汉语中自然、庄重，并能与后面的“祷告的殿”形成原文所有的重复。
- source_word: οἶκος προσευχῆς
  choice: 祷告的殿
  rationale: 自然表达属格结构，同时保留以圣殿为祷告场所的经文措辞。
- source_word: κληθήσεται
  choice: 必称为
  rationale: 表达将来被动态；“必”在经文引语中简洁庄重，但不添加超出原文的情态意义。
- source_word: πᾶσιν τοῖς ἔθνεσιν
  choice: 万国
  rationale: 简洁保留ἔθνη的“列国、各国”含义，并呼应以赛亚书56:7所强调的普世范围。
- source_word: ὑμεῖς δὲ
  choice: 你们却
  rationale: “却”突出上帝为圣殿所定用途与听众所造成现状之间的强烈对比；“你们”保留显式代词的强调。
- source_word: πεποιήκατε
  choice: 把它弄成了
  rationale: “成了”表达先前行为所造成的当前结果，对应希腊语完成时；“弄成”也带出责备语气。
- source_word: σπήλαιον λῃστῶν
  choice: 强盗的巢穴
  rationale: “巢穴”比字面的“洞穴”更自然地表示藏身之所，并保留耶利米书7:11的先知性回响；“强盗”不过度限定为政治叛乱者。
theological_decisions:
- issue: 先知引语的普世范围
  choice: 万国
  alternative: 万民；供万国使用
  rationale: “万国”直接对应πᾶσιν τοῖς ἔθνεσιν，并保留圣殿向以色列之外各国开放的以赛亚书背景；不把与格的具体关系解释得过窄。
- issue: λῃστῶν所指控的性质
  choice: 强盗
  alternative: 盗匪；暴徒
  rationale: 该词可指强盗或结伙的盗匪，但耶利米书7:11的互文在这里占主导；“强盗”保留广义指控，不擅自加入政治叛乱含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“经上不是记着吗”保留经书引语的反问语气；“我的殿……祷告的殿”有意保留原文οἶκος的重复。脚注标记分别放在所解释的“万国祷告的殿”和“强盗的巢穴”之后。
