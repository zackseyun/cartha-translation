  text: And many spread their cloaks on the road, and others spread leafy branches cut from the fields.
translation:
  language: zh_hans
  text: 许多人把自己的外衣铺在路上，另一些人则把从田野里割下的枝叶铺在路上。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “枝叶”也可译作“树枝”。原文所用的词泛指割下的草叶、枝条等植物材料，并非特指棕树枝。
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: 许多人
  rationale: 直接表达数量，不额外加强原文的语气。
- source_word: ἱμάτια
  choice: 外衣
  rationale: 在这一叙事场景中指铺在路上的外层衣服；“外衣”比泛称“衣服”更准确，也符合现代汉语。
- source_word: ἔστρωσαν
  choice: 铺
  rationale: 准确表达将衣物铺展在路面的动作；后半句依上下文补出同一动作，使汉语完整自然。
- source_word: εἰς τὴν ὁδόν
  choice: 在路上
  rationale: 与“铺”搭配时，εἰς 表示放置到路面上，译作“在路上”自然清楚。
- source_word: ἄλλοι δὲ
  choice: 另一些人则
  rationale: 保留 δέ 轻微的对照和转接作用，而不译成语气较强的“但是”。
- source_word: στιβάδας
  choice: 枝叶
  rationale: 该词可指成堆或成层的草叶、枝条等植物材料；“枝叶”保留其较宽泛的所指，也避免误说成约翰福音中特指的棕树枝。
- source_word: κόψαντες
  choice: 砍来的
  rationale: 自然表达先从田野割取或砍取植物、随后铺路的先后关系。
- source_word: ἐκ τῶν ἀγρῶν
  choice: 从田野里
  rationale: 直接传达 ἀγροί 所指的田地或野外区域，不限定为农场。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“把……铺在路上”符合现代汉语习惯；后半句补出原文省略而由上文承接的“铺在路上”，避免句意悬空。
