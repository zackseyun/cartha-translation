source:
  edition: SBLGNT
  text: ⸀ἀμὴν λέγω ὑμῖν ὅτι ὃς ἂν εἴπῃ τῷ ὄρει τούτῳ· Ἄρθητι καὶ βλήθητι εἰς τὴν θάλασσαν, καὶ μὴ διακριθῇ ἐν τῇ καρδίᾳ αὐτοῦ ἀλλὰ ⸀πιστεύῃ ὅτι ⸂ὃ λαλεῖ γίνεται, ἔσται αὐτῷ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/023.yaml
  text: Truly I tell you[a], whoever says to this mountain, ‘Be lifted up and be thrown into the sea,’ and does not doubt in his heart but believes that what he says is happening[b], it will be so for him.
translation:
  language: zh_hans
  text: 我实在告诉你们，无论谁对这座山说：‘拔起来，投进海里去！’心里并不疑惑[a]，只相信他所说的正在成就[b]，这事就必为他实现。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “疑惑”也可译作“动摇”或“内心不定”；希腊语动词也可带有内心分裂的意味。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“他所说的正在发生”或“他所说的就会成真”。希腊原文在后面的将来结果句之前使用现在时。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν λέγω ὑμῖν
  choice: 我实在告诉你们
  rationale: 以现代汉语中庄重而自然的宣告句式表达耶稣引出郑重话语的公式，同时保留复数受话者。
- source_word: ὃς ἂν εἴπῃ
  choice: 无论谁……说
  rationale: 表达关系代词、ἄν与虚拟语气构成的泛指条件，语义相当于“任何这样说的人”。
- source_word: τῷ ὄρει τούτῳ
  choice: 对这座山
  rationale: 保留ὄρος的通常含义“山”和指示词“这”，维持话语鲜明、具体的画面。
- source_word: Ἄρθητι
  choice: 起来
  rationale: 以简洁的被动/自发式命令表达山从原处被提起的图景；汉语若直译为“被举起来”用于直接命令会显得生硬。
- source_word: βλήθητι εἰς τὴν θάλασσαν
  choice: 投进海里去
  rationale: 自然表达被抛入海中的方向性动作；汉语命令句可省略被动标记而不损害原句意象。
- source_word: μὴ διακριθῇ ἐν τῇ καρδίᾳ αὐτοῦ
  choice: 心里并不疑惑
  rationale: 在此语境中διακρίνω指内心怀疑或动摇；保留καρδία的“心”这一圣经人观表达，并用脚注保存内在分裂的词义层次。
- source_word: πιστεύῃ
  choice: 信
  rationale: 以简明常用的“信”对应πιστεύω，保留与信心相关的核心词汇联系。
- source_word: ὅτι ὃ λαλεῖ γίνεται
  choice: 他所说的正在成就
  rationale: 保留γίνεται的现在时形态及“发生、成为现实”的开放表达，不把它提前改写成将来时。
- source_word: ἔσται αὐτῷ
  choice: 就必为他成就
  rationale: 保留未来结果和αὐτῷ的受益/关联意味；“成就”与前句呼应，又不额外指定实现机制。
theological_decisions:
- issue: 信心之言与结果之间的应许性质
  choice: 按经文直接译为以不疑惑而相信为条件的有力应许
  alternative: 将其限定为纯粹夸张，或扩展为不受任何约束的绝对应许
  rationale: 本节本身使用移山的强烈意象，却未在此明说后来的系统性限制；译文既不削弱，也不将其扩写为经文没有说明的教义公式。
- issue: αὐτοῦ与αὐτῷ的阳性单数泛指
  choice: 译为“他”
  alternative: 译为性别中性的“他们”或省略人称
  rationale: 原文使用阳性单数作代表性泛指；中文“他”既对应语法形式，也可在此承担泛指功能。
- issue: γίνεται的时态与应许的时间关系
  choice: 在前一分句保留现在时意味“正在成就”，后一分句保留将来结果“必……成就”
  alternative: 把前一分句解释性地统一改成“将要发生”
  rationale: 原文刻意先用现在时γίνεται，再用将来时ἔσται；译文保存这一张力，不替作者消除时态差异。
translation_notes:
  register: 采用现代、庄重且适合朗读的标准普通话。“我实在告诉你们”保留郑重宣告语气；山的命令采用简洁直接的汉语表达。脚注保存διακρίνω的内在分裂含义，以及γίνεται现在时在语境中的多种自然理解。
