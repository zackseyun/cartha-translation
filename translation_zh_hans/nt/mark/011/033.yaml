  text: καὶ ἀποκριθέντες ⸂τῷ Ἰησοῦ λέγουσιν⸃· Οὐκ οἴδαμεν. καὶ ὁ ⸀Ἰησοῦς λέγει αὐτοῖς· Οὐδὲ ἐγὼ λέγω ὑμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/033.yaml
  text: And answering Jesus[a], they say, “We do not know.” And Jesus says to them, “Neither do I tell you by what authority I do these things.”
translation:
  language: zh_hans
  text: 他们回答耶稣说：“我们不知道。”耶稣对他们说：“我也不告诉你们，我凭什么权柄做这些事。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθέντες
  choice: 回答
  rationale: 以自然的现代汉语表达引出回应的分词；与后面的“说”连用，保留原文回答动作与直接引语的衔接。
- source_word: λέγουσιν / λέγει / λέγω
  choice: 说 / 告诉
  rationale: 叙事中的前两处译为“说”；末处后接间接疑问，现代汉语用“告诉你们”更自然，也忠实表达信息传达。汉语不必刻意标示希腊文的历史现在时。
- source_word: Οὐκ οἴδαμεν
  choice: 我们不知道
  rationale: 直接表达否定与现在状态，语体庄重而自然。
- source_word: Οὐδὲ ἐγὼ
  choice: 我也不
  rationale: 保留耶稣回应中的否定对应关系：他们不回答，他也不告诉他们。
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: 凭什么权柄
  rationale: “凭”自然表达行动所依据的授权或资格；“权柄”准确保留 ἐξουσία 在本段语境中的权威、授权含义。
- source_word: ταῦτα
  choice: 这些事
  rationale: 保留中性复数所指的多项行动，不缩减为单数“这事”。
- source_word: ποιῶ
  choice: 做
  rationale: 简洁对应原文现在时动词，并自然指向耶稣所行的这些事。
