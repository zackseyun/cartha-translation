  text: διὰ τοῦτο λέγω ὑμῖν, πάντα ὅσα ⸂προσεύχεσθε καὶ αἰτεῖσθε⸃, πιστεύετε ὅτι ⸀ἐλάβετε, καὶ ἔσται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/024.yaml
  text: For this reason I tell you[a], whatever you pray and ask for, believe that you have received it[b], and it will be yours.
translation:
  language: zh_hans
  text: 所以我告诉你们：你们祷告祈求时，无论求什么，都要相信你们已经得到了[a]，所求的就必归给你们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“相信你们得着”；本译所据希腊文本作“已经得到了”，保留完成动作的意味。
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: 所以
  rationale: 承接上文关于信心的教导，表达自然的推论关系；现代汉语中比“为此缘故”更流畅。
- source_word: λέγω ὑμῖν
  choice: 我告诉你们
  rationale: 保留耶稣直接、带权威的复数对象称呼。
- source_word: πάντα ὅσα
  choice: 凡……的
  rationale: 以现代汉语的总括结构表达原文宽泛、无遗漏的范围。
- source_word: προσεύχεσθε καὶ αἰτεῖσθε
  choice: 祷告祈求
  rationale: 既保留“祷告”与“求取”两个动作，又以汉语常见搭配避免生硬重复。
- source_word: πιστεύετε
  choice: 只要相信
  rationale: 译出命令语气；“只要”使其与后面的应许自然衔接，但不增加信心机制的解释。
- source_word: ὅτι ἐλάβετε
  choice: 你们已经得到了
  rationale: 以“已经”保留不定过去时所呈现的完成行动及其刻意形成的时间张力。
- source_word: καὶ ἔσται ὑμῖν
  choice: 就必归给你们
  rationale: 表达将来确定性，并保留原文与格结构所含“成为你们所有”的意思。
theological_decisions:
- issue: 祷告蒙应允与信心之间的时间张力
  choice: 相信你们已经得到了，就必归给你们
  alternative: 相信你们正在得到，就必归给你们
  rationale: 所据希腊文本为不定过去时ἐλάβετε，应保留“已得到”与“将归给”并置的悖论式时序，不将其化解为某种特定的祷告神学。
- issue: 应许范围是否需要加上未明说的限制语
  choice: 不在正文中增添限制条件
  alternative: 加入“若合乎上帝旨意”等解释性限定
  rationale: 本节原文没有明说这些限定；翻译应保存本句绝对而有张力的表述，不把其他经文的神学说明直接嵌入正文。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“祷告祈求”清楚保留两个希腊动词；“已经……就必……”刻意保存原文先完成、后实现的时间张力。脚注标记置于整节末尾，对应异文说明。
