  rationale: 修订删除“只要”，以直接表达原文的命令“都要相信”；调整前半句，使“无论求什么”明确承接原文宽泛的宾语范围；将脚注移至“已经得到了”之后，并以较中性的“得着”呈现可能的现在时异读。仍保留“已经得到了”与“就必归给你们”的时间张力，不将其解释为任何特定教义体系。
