  text: καὶ ὅταν ⸀στήκετε προσευχόμενοι, ἀφίετε εἴ τι ἔχετε κατά τινος, ἵνα καὶ ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς ἀφῇ ὑμῖν τὰ παραπτώματα ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/025.yaml
  text: And whenever you stand praying[a], forgive, if you have anything against anyone[b], so that your Father who is in the heavens may also forgive you your trespasses.
translation:
  language: zh_hans
  text: 每当你们站着祷告时，若你们对任何人有什么怨怼，就要饶恕，好使你们在天上的父[a]也饶恕你们的过犯[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“在诸天中的父”；原文“天”是复数。
    reason: lexical_alternative
  - marker: b
    text: 或译“过错”“冒犯”。
    reason: lexical_alternative
lexical_decisions:
- source_word: στήκετε
  choice: 站着
  rationale: 保留原文具体的祷告姿势；与“每当”连用，表达经常或反复出现的情形，而不泛化为单纯的“祷告时”。
- source_word: προσευχόμενοι
  choice: 祷告时
  rationale: 分词表示与“站着”同时发生的动作；“站着祷告时”符合现代汉语习惯，也保留两者的关系。
- source_word: ἀφίετε
  choice: 饶恕
  rationale: 在处理人际过错的语境中指免去过错、不再追究；“饶恕”清楚自然，并与后文父的饶恕使用同一词语。
- source_word: εἴ τι ἔχετε κατά τινος
  choice: 若对任何人有任何不满
  rationale: 保留 τι 与 τινος 的双重不定意味，即无论什么事、无论什么人；“有任何不满”自然表达 κατά τινος 所含的怨隙或控诉意味。
- source_word: ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς
  choice: 你们在天上的父
  rationale: 采用现代汉语中自然、庄重且易懂的表达；原文“诸天”为复数这一形式信息在脚注中说明。
- source_word: ἀφῇ
  choice: 也饶恕
  rationale: 保留 καί 的“也”，并以“好使”体现 ἵνα 引出的目的或结果关系，不削弱人与父之饶恕之间的文本联系。
- source_word: παραπτώματα
  choice: 过犯
  rationale: παράπτωμα 指越轨、过错或冒犯；“过犯”既适合关系与祷告语境，也避免直接等同于更宽泛的“罪”。
theological_decisions:
- issue: 饶恕他人与父饶恕人之间的条件性联系
  choice: 直译为“就要饶恕，好使……父也饶恕”，保留明确的目的或结果关系。
  alternative: 弱化为饶恕他人只是已经蒙饶恕的外在证据，或改写成没有条件意味的并列关系。
  rationale: ἵνα……ἀφῇ 在句法上把人的饶恕与父的饶恕真实地联系起来。译文不借助外在教义体系消解这层张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“站着祷告”保留具体姿势；“若对任何人有任何不满”避免生硬直译，同时保持原文范围广泛。脚注标记置于各自所说明的词语之后。
