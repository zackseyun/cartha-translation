base_translation:
  language: en
  yaml_path: translation/nt/mark/011/010.yaml
  text: Blessed is the coming kingdom of our father David! Hosanna in the highest![a]
translation:
  language: zh_hans
  text: 我们祖先大卫的、即将来临的国度是蒙福的！在至高之处，和散那！[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “和散那”原有“求你拯救”或“现在拯救”的意思，但在这里用作礼仪性的赞美欢呼。
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐλογημένη
  choice: 蒙福的
  rationale: 这是阴性单数谓语形容词，与“国度”呼应，构成礼仪性的欢呼。“蒙福的”保留祝福宣告的语气，不简化为“当受赞美的”。
- source_word: ἡ ἐρχομένη βασιλεία
  choice: 那将要来临的国度
  rationale: 以“那……的”再现冠词、现在分词与名词的限定结构；“将要来临”自然表达临近中的到来，又不把它固定解释为专门术语“来世的国度”。
- source_word: βασιλεία
  choice: 国度
  rationale: 在大卫王权的语境中，“国度”既自然又能兼顾王权统治及其具体实现；“统治”虽可表达抽象的掌权，却会削弱此处大卫王朝的联想。
- source_word: τοῦ πατρὸς ἡμῶν Δαυίδ
  choice: 我们祖先大卫
  rationale: πατήρ在此是尊称性的先祖用语。现代汉语用“祖先”比直译“父亲”更清楚地传达群体血统与传统归属，同时避免让读者误以为是直接父子关系。
- source_word: Ὡσαννὰ
  choice: 和散那
  rationale: 新约语境中已成为固定的礼仪欢呼，因此正文采用传统音译；其源头所含“求你拯救”的呼求义在脚注中保留。
- source_word: ἐν τοῖς ὑψίστοις
  choice: 至高之处
  rationale: 简洁保留希腊语复数形容词名词化的表达，可能指最高的天界，但不在正文中补出“天上”而缩窄其含义。
theological_decisions:
- issue: 对大卫国度欢呼的性质
  choice: 直译为“我们祖先大卫那将要来临的国度”，不在正文加入“弥赛亚的”等解释。
  alternative: 我们祖先大卫那将要来临的弥赛亚国度
  rationale: 上下文确有弥赛亚期待，但希腊文本本身只说大卫的国度；保留原文措辞可让这层神学指向由语境呈现，而非由译文预先定论。
- issue: “和散那”的祈求义与赞美功能
  choice: 正文保留礼仪音译“和散那”，脚注说明其原初呼求义。
  alternative: 至高之处啊，求你现在拯救！
  rationale: 在此语境中，该词已经作为礼仪欢呼使用，但仍承载希伯来语“求拯救”的历史回声；正文与脚注分别保存其当下功能和词源含义。
translation_notes:
  register: 采用现代、庄重且适合公众诵读的普通话。“我们祖先大卫”避免现代读者把“我们的父亲大卫”误解为直接亲属关系；“至高之处和散那”保留原文紧凑的礼仪呼喊。
