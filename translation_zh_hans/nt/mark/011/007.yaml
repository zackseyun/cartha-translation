  text: καὶ ⸀φέρουσιν τὸν πῶλον πρὸς τὸν Ἰησοῦν, καὶ ⸀ἐπιβάλλουσιν αὐτῷ τὰ ἱμάτια αὐτῶν, καὶ ἐκάθισεν ἐπ’ ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/007.yaml
  text: And they brought the colt to Jesus, and they threw their cloaks on it, and he sat on it.
translation:
  language: zh_hans
  text: 他们把那头小驴牵到耶稣那里，把自己的外衣搭在驴背上，耶稣就骑了上去。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πῶλον
  choice: 小驴
  rationale: πῶλος本义是幼畜；结合本段上下文（可11:2）明确指驴驹。现代汉语用“小驴”自然清楚。
- source_word: ἐπιβάλλουσιν
  choice: 搭在
  rationale: 该词表示把衣物放到、铺到驴背上；“搭在”符合汉语表达，也保留动作本身，不额外说明其作为鞍垫的用途。
- source_word: ἱμάτια
  choice: 外衣
  rationale: 指穿在外面的衣袍；“外衣”准确且为普通读者易懂。
- source_word: ἐκάθισεν ἐπ’ αὐτόν
  choice: 骑了上去
  rationale: 字面为“坐在它上面”，在以驴为对象的语境中，现代汉语自然说“骑了上去”；不改变所述动作。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。三个并列动作依次表达；末句显明主语为耶稣，避免汉语代词可能造成的歧义。
