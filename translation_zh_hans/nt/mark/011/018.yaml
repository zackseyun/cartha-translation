  text: καὶ ἤκουσαν οἱ ⸂ἀρχιερεῖς καὶ οἱ γραμματεῖς⸃, καὶ ἐζήτουν πῶς αὐτὸν ἀπολέσωσιν· ἐφοβοῦντο γὰρ αὐτόν, ⸂πᾶς γὰρ⸃ ὁ ὄχλος ἐξεπλήσσετο ἐπὶ τῇ διδαχῇ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/018.yaml
  text: And the chief priests and the scribes heard it[a], and they were seeking how they might destroy him, for they feared him, because the whole crowd was astonished at his teaching.
translation:
  language: zh_hans
  text: 祭司长和经学家听见了这事，就谋划怎样除掉他；因为他们惧怕他，全体群众都因他的教导而大为惊奇。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “除掉”也可译作“杀死”或“置于死地”。希腊文动词的含义较宽，可指“毁灭”或“除灭”；但这里的上下文表明他们有致命的意图。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσαν
  choice: 听见了这事
  rationale: 动词可指“听见”或“得知”；中文补出“这事”，自然承接上文耶稣在圣殿中的言行，同时不把所听见的内容说得过细。
- source_word: ἀρχιερεῖς
  choice: 祭司长
  rationale: 这是耶路撒冷祭司领袖群体的通行称谓；避免译成“众大祭司”而令人误以为同时有多位在任大祭司。
- source_word: γραμματεῖς
  choice: 经学家
  rationale: 指研究、讲授并解释律法的犹太学者阶层；“经学家”在现代中文中较自然，也比单纯按职业字面译作“文士”更易懂。
- source_word: ἐζήτουν
  choice: 设法
  rationale: 未完成时态表达持续筹谋或尝试；“设法要怎样”保留他们一直寻求行动方式的意味。
- source_word: πῶς
  choice: 要怎样
  rationale: 引出他们所筹划的方式或手段，保留原文的审议语气。
- source_word: ἀπολέσωσιν
  choice: 除掉耶稣
  rationale: ἀπόλλυμι可指毁灭、使丧失或杀死；此处上下文显然包含致命意图。“除掉”在中文中既自然表达谋害意图，又保留比直译“杀死”稍宽的语义，并以脚注说明。
- source_word: ἐφοβοῦντο
  choice: 惧怕他
  rationale: 未完成时态表现持续的惧怕；这里可能涉及对耶稣本人、影响力及群众反应的畏惧，不进一步限定。
- source_word: πᾶς ὁ ὄχλος
  choice: 全体群众
  rationale: 保留集合性与强调意味，表示群众整体普遍受到震撼。
- source_word: ἐξεπλήσσετο
  choice: 惊叹不已
  rationale: 该词表达强烈震惊或惊奇，未完成时态显示持续状态；此译法自然地体现其强度与延续性。
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: 对他的教导
  rationale: ἐπί加与格在此表示引起惊叹的依据或缘由；现代中文以“对……惊叹”表达自然。
theological_decisions:
- issue: ἀπολέσωσιν所表达的领袖意图范围
  choice: 正文译为“除掉耶稣”
  alternative: “杀死耶稣”或“置他于死地”
  rationale: 上下文强烈暗示致命的谋害意图，但希腊动词本身语义较宽。“除掉”既没有淡化此处的险恶意图，也不把词义完全收窄为实施死亡的具体表述；脚注列出更明确的可能译法。
- issue: 领袖惧怕的具体对象或原因
  choice: 保留“他们惧怕他”，随后照原文说明群众因其教导而惊叹
  alternative: 解释为“他们害怕他在群众中的影响力”
  rationale: 原文以αὐτόν明确以耶稣为惧怕对象，却没有把惧怕直接改写成对其影响力或群众反应的害怕；译文保留这种张力，不作超出文本的心理解释。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“祭司长”沿用熟悉的圣经群体称谓；“经学家”比“文士”更直接传达其身份。“因为……因为……”保留希腊原文连续两个γάρ所呈现的因果链与修辞重复，不将二者合并而消除结构上的张力。
