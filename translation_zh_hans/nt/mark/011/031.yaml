  text: καὶ ⸀διελογίζοντο πρὸς ἑαυτοὺς λέγοντες· ⸂Τί εἴπωμεν;⸃ ἐὰν εἴπωμεν· Ἐξ οὐρανοῦ, ἐρεῖ· Διὰ τί ⸀οὖν οὐκ ἐπιστεύσατε αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/031.yaml
  text: And they were reasoning among themselves[a], saying, “What should we say? If we say, ‘From heaven,’ he will say, ‘Why then did you not believe him?’”
translation:
  language: zh_hans
  text: 他们彼此商量说：“我们该怎么说呢？如果说‘从天上来的’[a]，他会说：‘那么，你们为什么不信他呢？’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “从天上来的”是犹太人出于敬畏而采用的说法，意思是“从上帝来的”或“具有神圣来源”。
    reason: cultural_note
lexical_decisions:
- source_word: διελογίζοντο
  choice: 商量
  rationale: 未完成时描写持续进行的权衡和商议；“商量”既保留思量之意，也自然表现众人之间的讨论。
- source_word: πρὸς ἑαυτοὺς
  choice: 彼此
  rationale: 这里指这一群人内部相互讨论，而不只是各自在心里思想；“彼此”简洁地表达其相互性。
- source_word: λέγοντες
  choice: 说
  rationale: 该分词引出他们商议的具体内容；汉语用“说”衔接自然，也保留原文的叙事结构。
- source_word: Τί εἴπωμεν;
  choice: 我们该怎么说呢？
  rationale: 不定过去时虚拟语气在此表示斟酌应当怎样作答；“该怎么说”准确而符合现代汉语习惯。
- source_word: ἐὰν εἴπωμεν
  choice: 如果说
  rationale: 直接表达简单的条件关系，汉语自然简洁。
- source_word: Ἐξ οὐρανοῦ
  choice: 从天上来的
  rationale: 保留原文“从天上”的敬称性表达；补出“来的”使这个省略式回答在现代汉语中顺畅，同时不将其直接改写为“从上帝来的”。
- source_word: ἐρεῖ
  choice: 他会说
  rationale: 直译 λέγω 的将来时，并由后面的引语自然呈现质问语气。
- source_word: Διὰ τί οὖν
  choice: 那么，为什么
  rationale: “那么”表达 οὖν 基于假设回答而作出的推论，符合现代汉语问句习惯。
- source_word: οὐκ ἐπιστεύσατε αὐτῷ
  choice: 你们为什么不信他呢？
  rationale: πιστεύω 加与格在这里指相信、接受约翰的话或见证；“信他”比“信靠他”或“信仰他”更贴合此处语境。
theological_decisions:
- issue: “从天上”用于说明约翰洗礼权柄的来源
  choice: 正文保留“从天上来的”
  alternative: 从上帝来的
  rationale: “从天上”是犹太语境中敬称性地指向上帝或神圣来源的表达。保留这一措辞，既忠于原文，也避免在正文中把含蓄表达直接明说。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“彼此商量”呈现持续的群体斟酌；对话保持口语可读性。“信他”保留相信约翰及其见证的语义，不扩展为较强的宗教委身表达。脚注标记置于其实际解释的“从天上来的”之后。
