  text: Καὶ ἔρχονται εἰς Ἱεροσόλυμα. καὶ ⸀εἰσελθὼν εἰς τὸ ἱερὸν ἤρξατο ἐκβάλλειν τοὺς πωλοῦντας καὶ ⸀τοὺς ἀγοράζοντας ἐν τῷ ἱερῷ, καὶ τὰς τραπέζας τῶν κολλυβιστῶν καὶ τὰς καθέδρας τῶν πωλούντων τὰς περιστερὰς κατέστρεψεν
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/015.yaml
  text: And they came to Jerusalem. And entering the temple[a], he began to drive out those who were selling and those who were buying in the temple, and he overturned the tables of the money changers and the seats of those who were selling doves.
translation:
  language: zh_hans
  text: 他们来到耶路撒冷。耶稣进了圣殿[a]，就开始赶出在圣殿里卖东西的人和买东西的人，又推翻兑换钱币之人的桌子和卖鸽子之人的座位。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“圣殿院区”或“圣殿范围”；希腊文所指的是整个圣殿区域，并非特指内层圣所。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχονται
  choice: 他们来到
  rationale: 希腊文采用历史现在时；现代汉语叙事用“来到”自然地交代事件推进，也不必以形态时态生硬对应。
- source_word: Ἱεροσόλυμα
  choice: 耶路撒冷
  rationale: 采用现代中文通行地名。
- source_word: εἰσελθὼν
  choice: 耶稣进了
  rationale: 不定过去时分词与主句主语相同，所指是耶稣；汉语明示主语可避免“他们进了”的误读。“进了……就”自然表达进入之后随即开始行动。
- source_word: τὸ ἱερὸν / ἐν τῷ ἱερῷ
  choice: 圣殿
  rationale: ἱερόν在此指整个圣殿区域，而非特指内层圣所；正文沿用简洁熟悉的“圣殿”，脚注说明范围。
- source_word: ἤρξατο ἐκβάλλειν
  choice: 就开始赶出
  rationale: 保留ἤρξατο所标明的行动起始；“赶出”准确传达ἐκβάλλω在此处的强制意味。
- source_word: τοὺς πωλοῦντας καὶ τοὺς ἀγοράζοντας
  choice: 做买卖的人
  rationale: 现代汉语“做买卖的人”简洁而自然地涵盖卖方与买方；未把对象缩限为商贩。
- source_word: κολλυβιστῶν
  choice: 兑换银钱之人
  rationale: 指兑换货币者；“银钱”符合圣经历史语境，“兑换”清楚表达其职能。
- source_word: καθέδρας
  choice: 座位
  rationale: 保持原词的宽泛含义，不擅自具体化为椅子或长凳。
- source_word: περιστερὰς
  choice: 鸽子
  rationale: 在献祭语境中是自然且不过度细分品种的现代中文表达。
- source_word: κατέστρεψεν
  choice: 推翻
  rationale: 在桌子和座位这一语境中，准确而有力地表达翻倒之意。
theological_decisions:
- issue: 洁净圣殿叙事中ἱερόν的空间范围
  choice: 正文译作“圣殿”，理解为整个圣殿区域
  alternative: 圣殿院区；圣殿范围
  rationale: ἱερόν并非特指内层圣所。正文保留通行称谓，脚注澄清其空间范围，避免读者误以为事件发生在内层圣所。
- issue: 买卖双方是否都被赶出
  choice: “做买卖的人”同时包括卖方与买方
  alternative: 分别译作“卖东西的人和买东西的人”
  rationale: 原文明确并列τοὺς πωλοῦντας与τοὺς ἀγοράζοντας；合并表达须继续涵盖双方，不把耶稣行动的对象限于卖方。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“他们来到”承接复数主语，随后明示“耶稣”以消除希腊文分词结构转入单数主语时在汉语中可能产生的歧义；整体保留原文动作次序和力度。
