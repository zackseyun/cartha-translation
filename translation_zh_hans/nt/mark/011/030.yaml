base_translation:
  language: en
  yaml_path: translation/nt/mark/011/030.yaml
  text: Was John's baptism from heaven or from men? Answer me[a][b].
translation:
  language: zh_hans
  text: 约翰的洗礼是从天上来的，还是从人来的？你们回答我。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “从天上”也可译作“从上帝而来”。希腊原文保留了以“天”婉指上帝的犹太表达，指其出于上帝或由上帝授权。
    reason: lexical_alternative
  - marker: b
    text: “从人”指源于人，也就是只有人的来源或权柄；这里的“人”泛指人类，并不专指男性。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ βάπτισμα τὸ Ἰωάννου
  choice: 约翰的洗礼
  rationale: 属格Ἰωάννου表示与约翰相关、由他施行的洗礼；“约翰的洗礼”在现代汉语中自然简洁。
- source_word: ἐξ οὐρανοῦ
  choice: 从天上来的
  rationale: 保留希腊文“从天上”的犹太表达方式，不在正文中直接释为“从上帝而来”，从而保留其神圣来源或权柄的含义。
- source_word: ἐξ ἀνθρώπων
  choice: 从人来的
  rationale: ἀνθρώπων泛指人类；“从人来的”与“从天上来的”形成紧凑对照，表达人的来源或权柄，并不专指男性。
- source_word: ἦν ἢ
  choice: 是……还是……？
  rationale: 按照希腊文ἦν的判断句结构译出，同时添加汉语自然需要的“来的”，清楚表达来源。
- source_word: ἀποκρίθητέ μοι
  choice: 你们回答我
  rationale: 复数命令式要求在场的质问者直接作答；明示“你们”保留数的信息和命令语气。
theological_decisions:
- issue: “从天上”所指的来源和权柄
  choice: 正文保留“从天上来的”这一委婉表达
  alternative: 从上帝来的
  rationale: 这是一种以“天”指代上帝的犹太表达，暗示来自上帝的来源或授权；直译可保留修辞方式及其神学张力，而脚注说明其含义。
- issue: “从人”是否专指男性
  choice: 译作“从人来的”，按泛指人类理解
  alternative: 出于人的意思／由人授权
  rationale: ἀνθρώπων在此与“天上”对举，重点是纯属人的来源或权柄，不涉及性别区分。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。以“约翰的洗礼”避免不必要的书面僵硬；“你们回答我”保留复数对象和直接命令的力度。所有脚注标记均置于正文相应句末。
