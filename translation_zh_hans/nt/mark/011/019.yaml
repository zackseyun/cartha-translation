  yaml_path: translation/nt/mark/011/019.yaml
  text: And whenever evening came, they would go out of the city.
translation:
  language: zh_hans
  text: 每逢傍晚，他们就出城去。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅταν
  choice: 每逢
  rationale: ὅταν与未完成时动词连用，在此自然表达反复或惯常发生的动作；“每逢”既准确又符合现代汉语表达。
- source_word: ὀψὲ ἐγένετο
  choice: 傍晚
  rationale: 原文是“天色已晚／到了晚上”的时间表达；在“每逢……就……”结构中译作“傍晚”简洁自然，并保留其时间意义。
- source_word: ἐξεπορεύοντο
  choice: 就出……去
  rationale: 未完成时在此最可能表示惯常、反复的行动；“每逢……就……”已经清楚传达这一体貌意义。“出……去”也保留了向城外移动的方向。
- source_word: ἔξω τῆς πόλεως
  choice: 出城去
  rationale: 原文表达从城内到城外的移动；“出城去”是自然的现代汉语，并与动词的运动含义相合。
- source_word: πόλεως
  choice: 城
  rationale: 希腊文只说“城”，并未明说耶路撒冷；译文不补入专名，以保留原文措辞。
