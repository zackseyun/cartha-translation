id: MRK.11.11
reference: Mark 11:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ εἰσῆλθεν εἰς ⸀Ἱεροσόλυμα εἰς τὸ ἱερόν· καὶ περιβλεψάμενος πάντα ⸀ὀψὲ ἤδη οὔσης τῆς ὥρας ἐξῆλθεν εἰς Βηθανίαν μετὰ τῶν δώδεκα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/011.yaml
  text: And he entered Jerusalem[a], into the temple courts; and after looking around at everything, since it was already late[c][b], he went out to Bethany with the twelve.
translation:
  language: zh_hans
  text: 他进了耶路撒冷，来到圣殿区[a]。他把周围的一切都看过了；因为时候已经晚了[b]，便和十二人[c]一起出去，往伯大尼去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“圣殿范围”，也可简称“圣殿”。这里的希腊词指整个圣殿建筑群和院落，并非特指内殿。
    reason: lexical_alternative
  - marker: b
    text: 或译“当时时候已经晚了”或“天色已经很晚了”。
    reason: lexical_alternative
  - marker: c
    text: 指耶稣的十二个门徒。
    reason: referent_clarification
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: 进了；来到
  rationale: 这个不定过去时动词表示进入。译文结合两个连续的介词短语，用“进了耶路撒冷，来到圣殿区”自然呈现叙事中的移动，又不把同一个汉语动词生硬重复两次。
- source_word: Ἱεροσόλυμα
  choice: 耶路撒冷
  rationale: 采用现代汉语通行的地名译法。
- source_word: τὸ ἱερόν
  choice: 圣殿区
  rationale: ἱερόν通常指整个圣殿范围或建筑群，并非特指内殿（ναός）；“圣殿区”既简洁，也保留这里的空间范围。
- source_word: περιβλεψάμενος
  choice: 把周围……都看过了
  rationale: 该分词表示向四周察看。这样翻译既传达环顾的动作，也体现它先于随后离开的叙事次序。
- source_word: πάντα
  choice: 一切
  rationale: 保留原文中性复数所表达的全面性，不擅自限定耶稣具体察看了哪些事物。
- source_word: ὀψὲ ἤδη οὔσης τῆς ὥρας
  choice: 因为时候已经晚了
  rationale: 属格独立结构交代离开的时间背景，也可带原因意味；此译法自然保留这种时间与因由相连的关系。
- source_word: ἐξῆλθεν
  choice: 出去
  rationale: 保留ἐξέρχομαι的向外移动含义，同时不擅自断定是单指离开圣殿区还是离开耶路撒冷。
- source_word: Βηθανίαν
  choice: 伯大尼
  rationale: 采用现代中文圣经传统中通行的地名译法。
- source_word: μετὰ τῶν δώδεκα
  choice: 和十二人一起
  rationale: 原文以带冠词的数字称呼这个群体，直译为“十二人”可保留原文形式；脚注说明其所指，避免在正文中增添原文没有明说的名词。
theological_decisions:
- issue: τὸ ἱερόν所指的范围
  choice: 圣殿区，即较广的圣殿范围
  alternative: 圣殿
  rationale: 原词是ἱερόν，而非特指内殿的ναός。译作“圣殿区”可避免让读者误以为耶稣进入了内殿，同时符合他环顾四周的叙事情境。
- issue: “十二人”的群体身份
  choice: 正文保留“十二人”，脚注说明是耶稣的十二个门徒
  alternative: 十二门徒
  rationale: 原文只使用带冠词的数字。保留这一表达既不否认其明确所指，也不把解释性名词直接加入正文。
- issue: 属格独立结构的时间与原因关系
  choice: 因为时候已经晚了
  alternative: 当时时候已经晚了
  rationale: 该结构至少明确交代时间背景，并在上下文中自然说明他为何离开。“因为”表达这种语境关系，但脚注保留主要的时间性译法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以两个短句呈现原文行动次序；“圣殿区”提供必要的空间准确性，“十二人”保留原文简洁而具有群体指称的表达。所有脚注标记均置于正文相应词语之后。
