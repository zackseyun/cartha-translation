  text: καὶ οἱ προάγοντες καὶ οἱ ἀκολουθοῦντες ⸀ἔκραζον· Ὡσαννά· Εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου·
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/009.yaml
  text: And those going ahead and those following were crying out[b][a], “Hosanna! Blessed is the one who comes in the name of the Lord!”
translation:
  language: zh_hans
  text: 走在前面和跟在后面的人都不断高喊[b][a]：“和散那！那奉主名而来的，是当受称颂的！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “和散那”源自希伯来语或亚兰语的礼仪呼声，意思近于“求你拯救”或“现在拯救吧”；但在这里也用作赞颂的欢呼。
    reason: lexical_alternative
  - marker: b
    text: 这句欢呼呼应《诗篇》118:26。
    reason: cross_reference
lexical_decisions:
- source_word: οἱ προάγοντες
  choice: 走在前面的人
  rationale: 将实体化的现在分词译为正在队伍前面行走的人，既自然，又保留行进中的画面。
- source_word: οἱ ἀκολουθοῦντες
  choice: 跟在后面的人
  rationale: 与“走在前面的人”形成平行，明确指队伍后方跟随的人。
- source_word: ἔκραζον
  choice: 都不断高喊
  rationale: 未完成时表达持续或反复发生的公开呼喊；“不断高喊”在现代汉语中清楚传达这一体貌。
- source_word: Ὡσαννά
  choice: 和散那
  rationale: 保留已进入基督教汉语传统的礼仪性音译，因为此处既保有“求你拯救”的来源，也已用作欢呼赞颂；词源意义收入脚注。
- source_word: Εὐλογημένος
  choice: 当受称颂的
  rationale: 在诗篇式欢呼中表达对来者的祝颂，并避免现代汉语“有福的”可能偏向描述其蒙福状态的歧义。
- source_word: ὁ ἐρχόμενος
  choice: 来的人
  rationale: 自然表达实体化现在分词，不在正文中增添“弥赛亚”或“君王”等原文未明说的称号。
- source_word: ἐν ὀνόματι κυρίου
  choice: 奉主名
  rationale: 这是自然且庄重的现代圣经汉语习语，可表达在主的权柄、代表身份之下来，同时保留诗篇引文的形式。
- source_word: κυρίου
  choice: 主
  rationale: 按 κύριος 的常规神圣称谓译为“主”，不额外补入原文没有的专名。
theological_decisions:
- issue: 是否在欢呼中明确加入弥赛亚身份
  choice: 保留“奉主名来的是当受称颂的”，不增添“弥赛亚”或“君王”。
  alternative: 译作“奉主名而来的弥赛亚是当受称颂的”。
  rationale: 上下文具有弥赛亚意义，但本节希腊文本以诗篇式措辞称呼“来的人”，没有明说该称号；保留原有表达可维持其经文呼应和神学张力。
- issue: Ὡσαννά 在此是祈求还是赞颂
  choice: 正文音译为“和散那”，脚注说明其本义及此处的欢呼功能。
  alternative: 正文意译为“求你现在拯救！”或仅按功能译为“赞美！”
  rationale: 该词源自希伯来语或亚兰语的求救用语，但在这一场景中也作为礼仪性欢呼；音译并加注可同时保存两层意义。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“走在前面和跟在后面”保持原文两组人之间的平行；“奉主名来的是当受称颂的”保留诗篇引文色彩。脚注标记依正文出现顺序按所给材料置为[b][a]。
