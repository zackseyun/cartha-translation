  text: καὶ ⸂ἀποκριθεὶς αὐτοῖς λέγει⸃· Τίς ἐστιν ἡ μήτηρ μου ⸀ἢ οἱ ἀδελφοί ⸀μου;
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/033.yaml
  text: And answering them[a], he says[b], “Who are my mother and my brothers?”
translation:
  language: zh_hans
  text: 耶稣回答他们说：“我的母亲和兄弟[a]是谁？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“谁是我的母亲，或我的兄弟？”原文先提“母亲”，再以“或”引出“兄弟”；正文按现代汉语的自然表达译为“母亲和兄弟”。
    reason: 说明原文的连接词与语序，并避免对希腊文单数动词作不够准确的主谓一致解释。
lexical_decisions:
- source_word: ἀποκριθεὶς αὐτοῖς λέγει
  choice: 回答他们说
  rationale: 希腊文直译为“回答他们，他说”，由分词加叙事性现在时构成。现代汉语不以动词时态表达这种叙事效果；“回答他们说”既保留回应对象和引语结构，也自然流畅。
- source_word: μήτηρ
  choice: 母亲
  rationale: 准确、庄重而且符合现代标准汉语。
- source_word: ἢ
  choice: 和
  rationale: 原文以“或”连接母亲与兄弟，但整个问句是在询问哪些人算作耶稣的家人。汉语主句采用“和”，可避免“谁是我的母亲或兄弟”所造成的身份二选一误解；脚注保留原文连接词。
- source_word: ἀδελφοί
  choice: 兄弟
  rationale: 该词为阳性复数，本处承接上文所报信的耶稣家中男性手足；“兄弟”比带有较强宗教语体色彩的“弟兄”更符合普通现代汉语，也不擅自扩展为“兄弟姐妹”。
- source_word: Τίς ἐστιν
  choice: 是谁
  rationale: 汉语将疑问词置于判断句末最自然；“我的母亲和兄弟是谁”准确询问其身份，且无需像希腊文那样标示单复数一致。
theological_decisions:
- issue: ἀδελφοί所指的亲属范围
  choice: 兄弟
  alternative: 兄弟姐妹；手足；弟兄
  rationale: 原词是阳性复数，直接语境也明确提到耶稣的母亲和兄弟。译作“兄弟”保留原文的性别指向，同时不预先裁定这些兄弟的具体亲属性质，避免带入有关耶稣家庭关系的宗派解释。
- issue: 问句中ἢ的表达
  choice: 正文用“和”，脚注注明原文为“或”
  alternative: 我的母亲或兄弟是谁
  rationale: 原文的单数动词与靠近它的单数主语“母亲”一致，随后以ἢ引出复数“兄弟”。逐字照译在现代汉语中容易成为二选一问题；正文按整体语义自然表达，脚注则保留原文形式及其张力。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“回答他们说”保留马可叙事中回应后引语的结构；问句调整为汉语常用语序。“兄弟”在此指男性手足，不采用容易带出教会称谓色彩的“弟兄”。
