  text: Καὶ ὁ Ἰησοῦς ⸂μετὰ τῶν μαθητῶν αὐτοῦ ἀνεχώρησεν⸃ πρὸς τὴν θάλασσαν· καὶ πολὺ πλῆθος ἀπὸ τῆς Γαλιλαίας ⸀ἠκολούθησεν, καὶ ἀπὸ τῆς Ἰουδαίας
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/007.yaml
  text: And Jesus withdrew with his disciples to the sea[a], and a great crowd from Galilee followed, and from Judea[b],
translation:
  language: zh_hans
  text: 耶稣同门徒退到海边去[a][b]；有一大群来自加利利的人跟随他，也有从犹太来的，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“朝海边退去”。希腊语介词可表示朝海的方向移动。
    reason: lexical_alternative
  - marker: b
    text: 这里指加利利海；希腊原文只说“海”。
    reason: cultural_note
lexical_decisions:
- source_word: ἀνεχώρησεν
  choice: 退到……去
  rationale: 该动词可指离开、退避；结合前文敌意加剧的语境，“退到”保留了避开压力的意味，又不至于夸大为仓皇逃跑。
- source_word: μετὰ τῶν μαθητῶν αὐτοῦ
  choice: 和门徒
  rationale: “门徒”是福音书语境中 μαθηταί 的自然固定译法，兼有学习者与跟随者之意；汉语可依主语自然省略“他的”。
- source_word: πρὸς τὴν θάλασσαν
  choice: 到海边去
  rationale: πρός 带宾格表示朝向或到达某处；“到海边去”在现代汉语中自然，并保留“海”的原文用词。
- source_word: πολὺ πλῆθος
  choice: 一大群人
  rationale: 准确表达人数众多，较“一大群群众”自然，也不像“许多民众”那样弱化群体聚集的画面。
- source_word: ἠκολούθησεν
  choice: 来跟随他
  rationale: 此处首先描述人群在地域上的跟随；补出原文语境中隐含的宾语“他”，使汉语句意完整。
- source_word: ἀπὸ τῆς Γαλιλαίας
  choice: 从加利利来
  rationale: 表达来者的出发地；第二个“来”使现代汉语流畅。
- source_word: ἀπὸ τῆς Ἰουδαίας
  choice: 还有从犹太地区来的
  rationale: 原句的地域名单延续到下一节；“还有”连接并列来源，“地区”帮助普通读者理解这里是地名，同时保留句末未完结构。
