  text: πολλοὺς γὰρ ἐθεράπευσεν, ὥστε ἐπιπίπτειν αὐτῷ ἵνα αὐτοῦ ἅψωνται ὅσοι εἶχον μάστιγας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/010.yaml
  text: For he had healed many, so that all who had afflictions were pressing in on him in order to touch him.
translation:
  language: zh_hans
  text: 因为他治好了许多人，以致凡受病痛[a]折磨的，都蜂拥着挤向他[b]，为要摸他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “病痛”原文直译为“鞭子”或“鞭打”，在这里比喻折磨人的严重疾病或苦患。
    reason: lexical_alternative
  - marker: b
    text: “蜂拥着挤向他”也可译作“扑到他身上”；原文措辞力度较强，描写众人猛然涌向他。
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὺς
  choice: 许多人
  rationale: 作“治好”的宾语；补出“人”符合现代汉语习惯，也没有增加原文所无的限定。
- source_word: γὰρ
  choice: 因为
  rationale: 表明本句是在解释群众为何如此行动，保留原文的因果衔接。
- source_word: ἐθεράπευσεν
  choice: 治好了
  rationale: 表达已经发生并产生结果的医治行动；现代汉语不需另用过去完成时形式。
- source_word: ὥστε
  choice: 以致
  rationale: 自然地引出医治许多人所造成的结果。
- source_word: ἐπιπίπτειν αὐτῷ
  choice: 蜂拥着挤向他
  rationale: 保留群众猛然涌向并挤迫耶稣的力度，同时避免将“落在他身上”生硬直译。
- source_word: ἵνα
  choice: 为要
  rationale: 明确表达群众挤向耶稣的目的。
- source_word: αὐτοῦ ἅψωνται
  choice: 摸他
  rationale: ἅπτομαι在此指身体接触；“摸他”简明自然，并符合医治语境。
- source_word: ὅσοι
  choice: 凡……的，都
  rationale: 用汉语关联结构表达其概括而周全的范围。
- source_word: εἶχον μάστιγας
  choice: 受病痛折磨
  rationale: μάστιξ本义为鞭子，转喻严重折磨人的患难或疾病；“病痛”契合医治语境，“折磨”则保留其形象力度。
theological_decisions:
- issue: μάστιγας在医治语境中所指的苦患性质
  choice: 译作“受病痛折磨”
  alternative: “患疾病”“遭灾病”“受鞭打”
  rationale: 这里显然涉及寻求医治者，但原词比纯医学意义的“疾病”更形象，也强调苦楚。“受病痛折磨”既不把它误解为实际鞭打，也不抹去其严重苦患的意味。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“以致”和“为要”略带经文语体但仍属当代标准汉语；“蜂拥着挤向他”传达拥挤场面的力度。
