  text: and Judas Iscariot[a], who also betrayed him.
translation:
  language: zh_hans
  text: 还有加略人犹大，就是出卖[a]耶稣的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “出卖”也可译作“把他交出去”或“把他交付”。希腊语动词可指“交出、交付”；这里因所说的是犹大对耶稣所做的事，译作“出卖”。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: 还有
  rationale: 承接前面的十二使徒名单，并引出最后一人；现代汉语列举姓名时用“还有”自然清楚。
- source_word: Ἰούδαν
  choice: 犹大
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: Ἰσκαριώθ
  choice: 加略人
  rationale: 采用通行译名；原词的词源与确切所指存在争议，因此不作推测性意译。
- source_word: ὃς καὶ
  choice: 就是后来……的那个人
  rationale: 将关系从句自然地转成现代汉语的识别性说明；“后来”表达此处以过去时预先指出犹大后续行为的叙事视角，但不另增事件内容。
- source_word: παρέδωκεν
  choice: 出卖
  rationale: 该词基本义为“交出、交给”，在犹大对耶稣的这一特定语境中带有背叛意味；“出卖”兼顾交付行为及其负面关系含义。
- source_word: αὐτόν
  choice: 耶稣
  rationale: 希腊文代词指耶稣；中文独立节选若只译作“他”容易指代不明，因此明示为“耶稣”。
theological_decisions:
- issue: 如何翻译犹大对耶稣所做的 παρέδωκεν
  choice: 出卖
  alternative: 把他交出去；把他交给别人
  rationale: 原动词本身可泛指“交出、交付”，并不在所有语境中都等于“背叛”；但以犹大为主语、耶稣为宾语时，叙事语境明显包含背叛。正文用“出卖”传达该语境意义，同时用脚注保留较贴近字面的译法。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“就是后来……的那个人”符合中文叙事习惯，也保留原文关系从句对犹大的识别作用。脚注标记紧接“犹大”，与英文审校层的位置一致；脚注内容说明的是后续从句中的关键词。
