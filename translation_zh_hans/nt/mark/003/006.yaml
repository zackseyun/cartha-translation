  text: καὶ ἐξελθόντες οἱ Φαρισαῖοι ⸀εὐθὺς μετὰ τῶν Ἡρῳδιανῶν συμβούλιον ⸀ἐδίδουν κατ’ αὐτοῦ ὅπως αὐτὸν ἀπολέσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/006.yaml
  text: And the Pharisees went out and immediately began plotting with the Herodians against him[a], how they might destroy him.
translation:
  language: zh_hans
  text: 法利赛人出去后，立刻同希律党人商议怎样除灭耶稣。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 按本处语境，也可更明确地译作“杀死他”或“置他于死地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντες
  choice: 一出去
  rationale: 不定过去时分词在叙事中表示先行并紧接着发生的动作；“一出去”自然承接上文离开会堂的场景，并与后面的“就立刻”形成流畅的时间推进。
- source_word: εὐθὺς
  choice: 立刻
  rationale: 保留马可叙事中 εὐθύς 所传达的紧迫感；“立刻”是现代标准汉语中自然、庄重的表达。
- source_word: μετὰ τῶν Ἡρῳδιανῶν
  choice: 同希律党人
  rationale: μετά 加属格表示联合或结伴；“希律党人”是对这一亲希律政治群体的通行中文称呼。
- source_word: συμβούλιον ἐδίδουν
  choice: 商议
  rationale: 该习语意为共同议事、筹谋。未完成时体现正在展开的行动；汉语结合“立刻”即可自然表达他们随即开始谋划，无须生硬加入时态性助词。
- source_word: κατ’ αὐτοῦ
  choice: 怎样对付耶稣
  rationale: κατά 在此具有敌对含义。为避免连续使用两个“他”造成指代不够清楚，将 αὐτοῦ 明示为“耶稣”；“对付”传达敌对筹谋，但最终目的仍由后文说明。
- source_word: ὅπως
  choice: 怎样……要
  rationale: ὅπως 加虚拟式在此可兼有筹划内容与目的意味。“商议怎样……要……”在现代汉语中保留了他们谋求手段以达成目的的语气。
- source_word: ἀπολέσωσιν
  choice: 除灭他
  rationale: ἀπόλλυμι 可指毁灭、使丧亡或杀死。“除灭”保留较宽的词义，同时在此敌对密谋的语境中自然包含致死意图；脚注给出更明确的语境性译法。
theological_decisions:
- issue: 是否在正文中把领袖们的意图明确译成杀害耶稣
  choice: 正文采用较宽的“除灭他”
  alternative: “杀死他”或“置他于死地”
  rationale: ἀπόλλυμι 的语义范围比单纯“杀死”更宽，虽然本处语境明显指向致命意图。正文保留原词的宽度，脚注说明语境中的明确含义，避免替原文过早消除张力。
translation_notes:
  register: 采用现代、自然而庄重的简体中文。“法利赛人”“希律党人”为普通读者较熟悉的圣经称谓；句式简洁，保留马可叙事的迅速推进。脚注标记已在正文相应位置标明。
