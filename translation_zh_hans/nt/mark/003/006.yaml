  to: 法利赛人出去后，立刻同希律党人商议怎样除灭耶稣。[a]
  rationale: 修订保留原文的动作次序、立即性、与希律党人的联合及敌对目的。“商议怎样除灭耶稣”自然地涵盖“针对他”以及“如何／为要除灭他”的筹划结构，避免把原本连贯的表达拆成较生硬的“对付……要除灭……”。脚注继续保留 ἀπόλλυμι 在此语境中可具体指处死的译法，且锚点紧随“除灭耶稣”。
