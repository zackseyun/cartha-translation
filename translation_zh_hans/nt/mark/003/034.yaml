  text: And looking around at those seated around him in a circle[a], he says, “Behold, my mother and my brothers!”
translation:
  language: zh_hans
  text: 他环顾坐在他周围的一圈人，说：“看哪，我的母亲和我的弟兄们[a]！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“弟兄姐妹们”。希腊原文作“弟兄们”，但围坐在耶稣周围的人也可能包括女性。
    reason: lexical_alternative
lexical_decisions:
- source_word: περιβλεψάμενος
  choice: 环顾
  rationale: 概括耶稣把目光转向周围众人的有意动作，既简洁自然，也保留周视之意。
- source_word: τοὺς περὶ αὐτὸν κύκλῳ καθημένους
  choice: 坐在他周围的一圈人
  rationale: 同时表达καθημένους的“坐着”、περὶ αὐτόν的“在他周围”和κύκλῳ的环绕空间意味，符合现代汉语表达。
- source_word: λέγει
  choice: 说
  rationale: 希腊文使用历史现在时以增强叙事现场感；汉语叙事中的无标记“说”自然承接这一效果，不必生硬标明现在时。
- source_word: Ἴδε
  choice: 看哪
  rationale: 保留引人注意并指示眼前对象的语气；“看哪”庄重而仍为现代读者所能理解。
- source_word: μήτηρ
  choice: 母亲
  rationale: 采用标准亲属称谓，准确对应原词。
- source_word: ἀδελφοί
  choice: 弟兄们
  rationale: 保留希腊文阳性复数的表层形式及亲属意象；中文“弟兄们”自然承载复数，同时以脚注提示此处也可能涵盖女性。
theological_decisions:
- issue: ἀδελφοί为阳性复数，但耶稣周围的群体可能包括女性
  choice: 弟兄们
  alternative: 兄弟姐妹们／手足们
  rationale: 正文保留原文带性别的亲属用语，不把可能的广义涵盖直接写入译文；脚注则保存其在混合群体中可能泛指弟兄姐妹的解释空间。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“环顾”凝练传达动作，“一圈人”明确保留空间布局；“看哪”保留原文的指示和强调语气。脚注标记置于相关称谓之后。
