  text: καὶ ἀκούσαντες οἱ παρ’ αὐτοῦ ἐξῆλθον κρατῆσαι αὐτόν, ἔλεγον γὰρ ὅτι ἐξέστη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/021.yaml
  text: And when those close to him heard[a], they went out to seize him, for they were saying[b], “He is out of his mind.”
translation:
  language: zh_hans
  text: 耶稣身边的人听见这消息后，就出去要抓住他，因为他们一直说：“他神志失常了。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶稣身边的人”或译“他的家人”“属他的人”。原文是一个带有习语色彩的表达，可能特指属于耶稣家中或亲近圈子的人。也可译：“他失去理智了。”
    reason: alternative_reading; lexical_alternative
lexical_decisions:
- source_word: οἱ παρ’ αὐτοῦ
  choice: 和耶稣亲近的人
  rationale: 这是一个带有习语色彩且指向不完全明确的表达，可指属于耶稣家中或亲近圈子的人；此译法在现代汉语中自然，也不在正文中直接限定为家人。
- source_word: ἀκούσαντες
  choice: 听说了
  rationale: 以时间先后的方式表达不定过去时分词；原文没有明说所听见的具体内容，译文也保留这种省略。
- source_word: ἐξῆλθον
  choice: 出门去
  rationale: 表达从原处出去并采取行动的叙事动态，比单说“出去”更符合现代汉语，但不额外指定出发地点或目的地。
- source_word: κρατῆσαι
  choice: 要抓住他
  rationale: 保留κρατέω所含的实际控制和强制意味，同时不把行动具体解释为法律意义上的逮捕；“制止他”虽可能符合语境，却更具解释性。
- source_word: ἔλεγον
  choice: 他们一直说
  rationale: 用“一直”体现未完成过去时所暗示的持续或反复言说。
- source_word: ἐξέστη
  choice: 他神志失常了
  rationale: 清楚表达此处对精神状态异常的判断，又比口语化且带强烈贬义的“他疯了”更庄重，并保留这是相关人物所作的评价。
theological_decisions:
- issue: οἱ παρ’ αὐτοῦ所指的人
  choice: 正文译为“和耶稣亲近的人”
  alternative: “他的家人”“他自己的人”“他的同伴”
  rationale: 上下文可能指向耶稣的家人，但该希腊表达并非明确的亲属称谓。正文保留其范围上的含混，脚注列出较具体的可能理解，避免超出原文作出定论。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“出门去”呈现叙事动作，“抓住”保留行动的强制性；正文不把亲近者明确限定为家属，也不把他们的判断改写成客观叙述。
