base_translation:
  language: en
  yaml_path: translation/nt/mark/003/003.yaml
  text: And he says to the man with the withered hand[a], “Rise and come to the middle.”
translation:
  language: zh_hans
  text: 耶稣对那位一只手萎缩的人说：“起来，到中间来。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“起来，站到中间来”；也可意译为：“站到前面来。”
    reason: 原文“起来，到中间”既可强调起身并移到众人中间，也可按语境自然理解为走到前面。
lexical_decisions:
- source_word: λέγει
  choice: 说
  rationale: 希腊文用历史现在时，使叙事更鲜明；现代汉语叙事中的“说”本身不标明时态，既自然，也无需强行改成带过去意味的表达。
- source_word: ἀνθρώπῳ
  choice: 人
  rationale: 上下文表明所指为一名男子，但汉语“人”自然对应 ἄνθρωπος，且不会减损原文所指。
- source_word: τὴν χεῖρα ἔχοντι ξηράν
  choice: 那只手萎缩的人
  rationale: 按希腊文结构保留“有一只手处于萎缩状态”的意思；“那只”也自然表达定指的 χεῖρα。
- source_word: ξηράν
  choice: 萎缩
  rationale: 该词基本义为“干枯”，用于手的病状时，“萎缩”在现代汉语中自然、准确，又不具体断定病因。
- source_word: Ἔγειρε
  choice: 起来
  rationale: 直接对应命令式，可指起身或站起；“起来”简洁自然，并保留动作细节的一定开放性。
- source_word: εἰς τὸ μέσον
  choice: 站到中间来
  rationale: εἰς 表示朝向中间的移动；结合“起来”，汉语用“站到中间来”既保留空间含义，也比生硬直译“进入中间”自然。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。主语补出“耶稣”，以符合汉语篇章衔接；命令句保留原文的简洁和公开召唤的空间感。脚注标记置于整句之后。
