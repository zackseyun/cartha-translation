id: MRK.3.11
reference: Mark 3:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ τὰ πνεύματα τὰ ἀκάθαρτα, ὅταν αὐτὸν ⸂ἐθεώρουν, προσέπιπτον⸃ αὐτῷ καὶ ⸀ἔκραζον ⸀λέγοντα ὅτι Σὺ εἶ ὁ υἱὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/011.yaml
  text: And whenever the unclean spirits saw him[a], they fell down before him and cried out, saying, “You are the Son of God.”
translation:
  language: zh_hans
  text: 污灵每逢看见他，就俯伏在他面前[a]，喊叫说：“你是上帝的儿子！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“扑倒在他面前”。希腊语动词可指伏在某人面前，表示臣服或恳求。
    reason: 词义存在合理的表达选择；注释说明该动作的可能意味，同时避免将其直接限定为敬拜。
lexical_decisions:
- source_word: πνεύματα τὰ ἀκάθαρτα
  choice: 污灵
  rationale: “污灵”简洁保留了ἀκάθαρτα“不洁、污秽”的含义，也符合福音书叙事中的固定称谓；不译作“邪灵”，以免把原文较具体的“不洁”概念泛化为“邪恶”。
- source_word: ὅταν
  choice: 每逢
  rationale: ὅταν与随后未完成时态的动词连用，表示反复发生的情形；“每逢……就……”自然传达这种迭代意味。
- source_word: ἐθεώρουν
  choice: 看见
  rationale: 在本叙事中用现代汉语常用的“看见”即可准确表达；反复性已由“每逢”体现，无须另加解释。
- source_word: προσέπιπτον αὐτῷ
  choice: 俯伏在他面前
  rationale: 该短语描写倒伏或伏在某人面前的动作。“俯伏在他面前”保留身体姿态及服从或恳求的可能意味，却不直接断定这是敬拜。
- source_word: ἔκραζον
  choice: 喊叫
  rationale: “喊叫”保留κράζω的强烈发声意味，现代、清楚，又不增添“尖叫”等原文未明说的情绪色彩。
- source_word: λέγοντα
  choice: 说
  rationale: 该分词伴随“喊叫”，译为“喊叫说”符合汉语叙事习惯，也保留了引出直接引语的结构。
- source_word: Σὺ εἶ
  choice: 你是
  rationale: 明确译出第二人称代词；汉语的直接陈述已能自然体现指向性，无须生硬增译“你本人”。
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: 上帝的儿子
  rationale: 保留定冠词结构所具有的称号意味及基督论分量；“上帝的儿子”是现代汉语中清楚、庄重且易懂的表达。
theological_decisions:
- issue: 污灵伏在耶稣面前的动作是否应明确译为敬拜
  choice: 译作“俯伏在他面前”，不译作“敬拜他”。
  alternative: “敬拜他”或“向他下拜”
  rationale: προσπίπτω可指伏在某人面前，可能带有敬畏、恳求或被迫臣服的意味，但本节没有明确称此举为敬拜。译文保留可见动作，让其神学意义由上下文呈现。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“每逢……就……”呈现原文反复发生的意味；“污灵”保持福音书术语的一致性。脚注标记紧接其所说明的“俯伏在他面前”。
