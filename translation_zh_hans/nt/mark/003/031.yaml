  text: ⸂Καὶ ἔρχονται⸃ ⸂ἡ μήτηρ αὐτοῦ καὶ οἱ ἀδελφοὶ αὐτοῦ⸃ καὶ ἔξω ⸀στήκοντες ἀπέστειλαν πρὸς αὐτὸν ⸀καλοῦντες αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/031.yaml
  text: Then his mother and his brothers came[a], and standing outside they sent word to him[b], calling him.
translation:
  language: zh_hans
  text: 这时，耶稣的母亲和兄弟们来了。他们站在外面，派人去叫他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: 这时
  rationale: 句首连词在这里推进叙事；“这时”符合现代汉语叙事习惯，也保留了与上文的衔接。
- source_word: ἔρχονται
  choice: 来了
  rationale: 这是叙事中的历史现在时；汉语用“来了”自然地表达已发生并推进情节的动作。
- source_word: ἡ μήτηρ αὐτοῦ καὶ οἱ ἀδελφοὶ αὐτοῦ
  choice: 耶稣的母亲和兄弟们
  rationale: 用“耶稣的”明确代词所指；“兄弟们”对应阳性复数 ἀδελφοί，同时不擅自判定他们与耶稣之间更具体的亲属性质。
- source_word: ἔξω στήκοντες
  choice: 他们站在外面
  rationale: 将希腊语分词结构改为自然的汉语分句，保留其空间位置和持续状态。
- source_word: ἀπέστειλαν πρὸς αὐτὸν καλοῦντες αὐτόν
  choice: 派人去叫他
  rationale: ἀπέστειλαν 在语境中隐含派遣人到耶稣那里，καλοῦντες 表明目的，即叫他前来；“派人去叫他”简洁而完整地表达两者。
theological_decisions:
- issue: “他的兄弟们”的具体亲属关系
  choice: 译为“兄弟们”，不作进一步说明
  alternative: 译作“亲属”“表兄弟”或明确为“亲生弟弟们”
  rationale: ἀδελφοί 的通常含义是“兄弟”，但本节本身没有界定更具体的亲属关系；译文不应替任何教派传统作出经文未明说的判断。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“派人去叫他”避免生硬照搬希腊语结构，同时保留派遣和呼叫两个动作。
