base_translation:
  language: en
  yaml_path: translation/nt/mark/003/014.yaml
  text: And he appointed twelve[a], so that they might be with him and so that he might send them out to preach[b],
translation:
  language: zh_hans
  text: 他设立了十二人[a]，要他们跟他在一起，也要差他们出去传道[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本在此加上：“他也称他们为使徒。”
    reason: textual_variant
  - marker: b
    text: 或译：“宣讲”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησεν
  choice: 设立了
  rationale: 该动词字面可指“做、使成为”，但在此以“十二个人”为宾语，语境所指是组成并委任这一群人；“设立”自然、庄重，也不过度引申。
- source_word: δώδεκα
  choice: 十二个人
  rationale: 希腊文仅作“十二”，没有明说名词。现代汉语若只说“十二”较不自然，补出量词性成分“个人”能清楚表达所指，同时不把它处理成带定冠词意味的专称“十二使徒”。
- source_word: ἵνα ὦσιν μετ’ αὐτοῦ
  choice: 为要他们跟自己在一起
  rationale: ἵνα加虚拟式表达目的。“为要”明确保留目的关系；“跟自己在一起”是自然的现代汉语，并准确传达门徒陪伴耶稣之意。
- source_word: ἀποστέλλῃ
  choice: 差他们出去
  rationale: 该词意为差遣，并可含受托执行使命的意味。“差……出去”符合本段公开事奉的语境，但不在正文中提前加入异文所见的“使徒”称号。
- source_word: κηρύσσειν
  choice: 传道
  rationale: 该不定式指公开宣讲、传扬。“传道”在马可福音语境中简洁自然；“宣讲”也是可行译法，列于脚注以保留词义范围。
theological_decisions:
- issue: 是否在正文中加入“使徒”这一称号
  choice: 不加入“使徒”，译作“他设立了十二个人”。
  alternative: “他设立了十二个人，也称他们为使徒……”
  rationale: 所给SBLGNT正文没有“他也称他们为使徒”这一较长读法。正文依所给希腊文本翻译，并以脚注保存重要异文，避免把文本传统中的扩展直接并入正文。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“设立”兼顾语境中的组成与委任含义；“跟自己在一起”比“与他同在”更贴近日常现代汉语，同时仍保持经文语体。句末逗号保留，因为本节在后续经文中继续。
