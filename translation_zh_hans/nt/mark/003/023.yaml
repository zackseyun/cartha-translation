  text: καὶ προσκαλεσάμενος αὐτοὺς ἐν παραβολαῖς ἔλεγεν αὐτοῖς· Πῶς δύναται Σατανᾶς Σατανᾶν ἐκβάλλειν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/023.yaml
  text: 'And after calling them to himself, he was speaking to them in parables: “How can Satan cast out Satan?”'
translation:
  language: zh_hans
  text: 耶稣把他们叫到跟前，用比喻对他们说：“撒但怎能赶出撒但呢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: 把他们叫到跟前
  rationale: 该不定过去时中间语态分词表示耶稣先把他们叫到自己这里；此译自然表达趋近耶稣及动作先后，不必生硬直译中间语态。
- source_word: ἐν παραβολαῖς
  choice: 用比喻
  rationale: παραβολή在此指用作说明和论辩的类比性话语。中文“用比喻”既保留复数所表达的说话方式，也比“在比喻中”自然。
- source_word: ἔλεγεν
  choice: 对他们说
  rationale: 未完成时呈现当时持续展开的言说；现代汉语叙事中“对他们说”已可自然承载这一背景性动作，若译成“一直说”则可能过度强调反复。
- source_word: Πῶς δύναται
  choice: 怎能
  rationale: 合译为简洁自然的反问，表达对可能性的质疑，并保留原文的修辞力度。
- source_word: Σατανᾶς
  choice: 撒但
  rationale: 采用现代中文圣经语境中通行的音译；主格与宾格均译作同一名称。
- source_word: ἐκβάλλειν
  choice: 赶出
  rationale: ἐκβάλλω在马可福音相关语境中常指驱逐污灵；“赶出”通俗、准确，并与上下文所指的赶鬼行动相合。
theological_decisions:
- issue: 耶稣关于撒但敌对自身之问的语气
  choice: 译作反问：“撒但怎能赶出撒但呢？”
  alternative: “撒但怎么有能力赶出撒但？”
  rationale: 原文质问这种说法如何可能；译文保留其反问性质，却不在正文中额外加入“绝不可能”或撒但国度的解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“叫到跟前”比“召来”更口语自然，同时不失尊重；“怎能……呢”清楚传达反问。未添加原文没有的主语说明或神学解释。
