  text: καὶ ἐκάθητο ⸂περὶ αὐτὸν ὄχλος⸃, ⸂καὶ λέγουσιν⸃ αὐτῷ· Ἰδοὺ ἡ μήτηρ σου καὶ οἱ ἀδελφοί ⸀σου ἔξω ζητοῦσίν σε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/032.yaml
  text: And a crowd was sitting around him[a], and they said to him, “Look, your mother and your brothers are outside looking for you.”
translation:
  language: zh_hans
  text: 有一群人围着他坐着。他们对他说：“你看，你的母亲和兄弟在外面找你[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“寻找你”。原文动词可表示“寻找”或“寻求”；这里很可能是指他们正设法找到他。
    reason: 词义异译
lexical_decisions:
- source_word: ἐκάθητο
  choice: 坐着
  rationale: 未完成时描绘当时持续进行的背景情景；“坐着”自然保留这一状态。
- source_word: περὶ αὐτὸν ὄχλος
  choice: 有一群人围着他
  rationale: περί加宾格在这里表示空间上的环绕；此译保留众人围坐在耶稣周围的画面。
- source_word: λέγουσιν
  choice: 他们对他说
  rationale: 希腊文现在时在叙事中作历史现在时使用；现代汉语以“说”自然承接过去的叙事情景。
- source_word: Ἰδοὺ
  choice: 看
  rationale: 作为引人注意的话语标记，“看”既保留其提示作用，又符合现代汉语表达。
- source_word: μήτηρ
  choice: 母亲
  rationale: 按普通亲属称谓直译，语境中无需扩展。
- source_word: ἀδελφοί
  choice: 弟兄
  rationale: 保留原文阳性复数亲属称谓，不在译文中对具体亲属关系作神学性解释。
- source_word: ἔξω
  choice: 在外面
  rationale: 准确表达地点副词的基本含义。
- source_word: ζητοῦσίν σε
  choice: 找你
  rationale: ζητέω可指寻找或寻求；在此叙事情境中，“找你”最自然地表达他们要找到耶稣。
theological_decisions:
- issue: “弟兄”的具体亲属关系
  choice: 直译为“弟兄”，不作解释性扩展
  alternative: 兄弟／近亲；兄弟姐妹
  rationale: 本节使用普通的阳性复数亲属称谓，却没有进一步界定其亲属关系。直译可避免把特定宗派对于耶稣家庭关系的理解加入正文。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“有一群人围着他坐着”保留未完成时的背景状态和空间环绕的画面；直接引语简洁口语化，但不失经文语体。脚注标记置于其所说明的“找你”之后。
