  text: καὶ λέγει αὐτοῖς· Ἔξεστιν τοῖς σάββασιν ⸀ἀγαθοποιῆσαι ἢ κακοποιῆσαι, ψυχὴν σῶσαι ἢ ἀποκτεῖναι; οἱ δὲ ἐσιώπων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/004.yaml
  text: And he said to them[a], “Is it lawful on the Sabbath to do good or to do harm[b], to save a life or to kill?” But they were silent.
translation:
  language: zh_hans
  text: 耶稣对他们说：“在安息日，行善还是作恶，救人性命还是夺人性命，哪一样是合乎律法的？”他们却一声不响。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔξεστιν
  choice: 合乎律法
  rationale: 本节处于安息日规条的争论中，此词所问的是律法或公认规范是否许可；“合乎律法”自然地保留了法律伦理色彩。
- source_word: τοῖς σάββασιν
  choice: 在安息日
  rationale: 希腊文为复数形式，但在通用希腊语中常作为表示安息日的习语；上下文指眼前这个安息日，汉语用单数表达最自然，也不造成多个安息日的误解。
- source_word: ἀγαθοποιῆσαι
  choice: 行善
  rationale: 简洁、自然地表达做有益之事，并与“作恶”构成清楚的对照。
- source_word: κακοποιῆσαι
  choice: 作恶
  rationale: 该词可指作恶或加害；“作恶”保留其伦理广度，而下句“救命还是杀人”进一步显明实际伤害的含义。
- source_word: ψυχὴν σῶσαι
  choice: 救命
  rationale: ψυχή在与“杀人”对举时指人的生命，而非专指非物质的灵魂；“救命”是自然、准确的汉语。
- source_word: ἀποκτεῖναι
  choice: 杀人
  rationale: 保留“杀死”的基本意义，不加入“谋杀”所带的额外法律定性；与“救命”形成自然对举。
- source_word: ἐσιώπων
  choice: 一声不响
  rationale: 未完成时描写他们持续不作回应；“一声不响”在现代汉语叙事中自然传达这种沉默。
theological_decisions:
- issue: 安息日问题是一般原则还是当下处境
  choice: 译作“在安息日”，以习语单数表达
  alternative: 在各安息日／在安息日里
  rationale: 希腊文虽为复数，但这是常见的安息日表达法；上下文又聚焦当日的医治争议。采用自然汉语并不削弱问题所具有的一般伦理原则。
- issue: κακοποιῆσαι的伦理与伤害含义
  choice: 作恶
  alternative: 加害／伤害人
  rationale: “作恶”保留词语较宽的伦理意义，并让紧接着的“救命还是杀人”具体说明善恶的生命后果，避免把前一对比过早限缩为身体伤害。
- issue: 反问句的表达
  choice: 以“哪一样是合乎律法的？”统摄两组对举
  alternative: 行善或作恶、救命或杀人，是合乎律法的吗？
  rationale: 原文的疑问具有尖锐的伦理张力，不宜擅自补出答案；汉语用“哪一样”清楚呈现选择性反问，同时保留听者必须面对的张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“耶稣”补明原文代词“他”的所指，以适应独立经节阅读；句中保持“行善／作恶、救命／杀人”的平行结构。无需脚注，因为希腊文复数安息日属于可直接用自然汉语表达的习语，并无需要读者处理的实质异文或歧义。
