  text: because they were saying[a], “He has an unclean spirit.”
translation:
  language: zh_hans
  text: 因为他们不断地说[a]：“他有污灵。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他被污灵附身。”
    reason: 提供更符合汉语习惯、但解释性较强的表达，以说明“有污灵”在语境中的含义。
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 在上下文中引出耶稣作出前述严正判断的原因；“因为”清楚表达因果关系。
- source_word: ἔλεγον
  choice: 一直说
  rationale: 未完成时表示持续或反复的言说；“一直说”比单纯的“说”更能保留这一体貌。
- source_word: Πνεῦμα ἀκάθαρτον
  choice: 污灵
  rationale: 这是福音书中指邪灵的固定表达；“污灵”简洁保留ἀκάθαρτος所含的不洁之义，也符合现代中文圣经语域。
- source_word: ἔχει
  choice: 有
  rationale: 希腊文直译为“有”。正文不扩展为“被……附身”，以保留原文简洁而尖锐的指控。
theological_decisions:
- issue: 对耶稣之指控的性质
  choice: 保留直接说法“他有污灵”
  alternative: 他被污灵附身
  rationale: 原文直接报道反对者的指控。译作“有”既保留措辞及其冒犯性，也避免在正文中对邪灵控制的具体程度作出超出原文的解释；较符合汉语习惯的解释性说法收入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“一直说”保留希腊文未完成时的持续或反复意味；“污灵”保持新约术语的简洁性。
