source:
  edition: SBLGNT
  text: καὶ Ἰάκωβον τὸν τοῦ Ζεβεδαίου καὶ Ἰωάννην τὸν ἀδελφὸν τοῦ Ἰακώβου (καὶ ἐπέθηκεν αὐτοῖς ⸀ὀνόματα Βοανηργές, ὅ ἐστιν Υἱοὶ Βροντῆς),
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/017.yaml
  text: and James the son of Zebedee[a], and John the brother of James (he gave them the name Boanerges, which means Sons of Thunder),
translation:
  language: zh_hans
  text: 还有西庇太的儿子雅各和雅各的兄弟约翰（耶稣又给他们取名[a]为“半尼其”，意思是“雷之子”）。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊原文作“名字”（复数）；这里很可能是集合用法，指赐给这兄弟二人的一个共同名号。
    reason: 说明原文复数形式及其可能的集合用法。
lexical_decisions:
- source_word: Ἰάκωβον
  choice: 雅各
  rationale: 采用现代中文圣经中对新约人名Ἰάκωβος的通行译名。
- source_word: τὸν τοῦ Ζεβεδαίου
  choice: 西庇太的儿子
  rationale: 原文是冠词加属格的身份说明，按希腊语习惯表示父子关系；中文补出“儿子”最清楚自然。
- source_word: Ἰωάννην
  choice: 约翰
  rationale: 采用现代中文圣经中的通行译名。
- source_word: τὸν ἀδελφὸν τοῦ Ἰακώβου
  choice: 雅各的兄弟
  rationale: 保留ἀδελφός所表达的亲兄弟关系，同时不把原文未说明的长幼关系译成“哥哥”或“弟弟”。
- source_word: ἐπέθηκεν αὐτοῖς ὀνόματα
  choice: 给他们起名
  rationale: ἐπιτίθημι与“名字”连用时表示给人取名或加名号；此译法符合现代汉语，也保留间接宾语“他们”。
- source_word: Βοανηργές
  choice: 半尼其
  rationale: 保留原文中的外来名号，并采用中文圣经传统中较为人熟悉的音译；下文另照原文解释其含义。
- source_word: ὅ ἐστιν
  choice: 意思是
  rationale: 该短语在这里引出对外来名号的解释，“意思是”比直译“就是”更清楚。
- source_word: Υἱοὶ Βροντῆς
  choice: 雷之子
  rationale: 直译这一形象鲜明的称号，不额外解释“雷”的象征意义。
theological_decisions:
- issue: 是否同时保留外来名号及其解释
  choice: 保留“半尼其”，并译出“雷之子”
  alternative: 只译作“雷之子”，省略音译名号
  rationale: 原文本身同时保存了外来形式和解释；两者并列可忠实保留叙事细节，且不擅自淡化文本的语言层次。
- issue: 雅各与约翰的长幼关系
  choice: 译作“雅各的兄弟”
  alternative: 译作“雅各的弟弟”
  rationale: ἀδελφός在本句只明确兄弟关系，并未说明谁年长；因此不作超出原文的判断。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“还有”承接本节所在名单的前文；括号依照原文保留插入说明。“兄弟”避免擅自确定长幼，“雷之子”保留称号的鲜明意象。
