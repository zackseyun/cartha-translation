id: MRK.3.5
reference: Mark 3:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ περιβλεψάμενος αὐτοὺς μετ’ ὀργῆς, συλλυπούμενος ἐπὶ τῇ πωρώσει τῆς καρδίας αὐτῶν, λέγει τῷ ἀνθρώπῳ· Ἔκτεινον τὴν ⸀χεῖρα· καὶ ἐξέτεινεν, καὶ ἀπεκατεστάθη ἡ χεὶρ ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/005.yaml
  text: And after looking around at them with anger[a], grieved at the hardness of their hearts, he says to the man, “Stretch out your hand.” And he stretched it out, and his hand was restored.
translation:
  language: zh_hans
  text: 耶稣带着怒气环视他们，又因他们的心[a]刚硬而忧伤，就对那人说：“伸出手来。”他伸出手，手就复原了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文“心”用单数，可能是集合性的说法。
    reason: 说明希腊文单数名词与复数所属代词并用的形式，并保留其可能的集合含义。
lexical_decisions:
- source_word: περιβλεψάμενος
  choice: 环视他们
  rationale: 该词指向四周察看；用“环视”简洁保留耶稣逐一察看周围众人的画面。希腊语不定过去时分词表示这一动作与随后说话动作的先后关联，中文以“……就……”自然呈现。
- source_word: μετ’ ὀργῆς
  choice: 带着怒气
  rationale: μετά加属格在此表示伴随的情态。“带着怒气”直接而自然，既不淡化为一般不悦，也不强化为更具审判色彩的“震怒”。
- source_word: συλλυπούμενος
  choice: 忧伤
  rationale: 该分词表达因某事深感痛苦、悲伤。“忧伤”庄重自然，并与前面的“怒气”并列，保留两种情感同时存在的张力。
- source_word: ἐπὶ τῇ πωρώσει
  choice: 因……刚硬
  rationale: ἐπί加与格在此说明忧伤的缘由；πώρωσις含有变硬、麻木、顽钝之意。“刚硬”保留原文隐喻，也是普通读者易懂的表达。
- source_word: τῆς καρδίας αὐτῶν
  choice: 他们心里
  rationale: 原文名词“心”是单数，所属代词“他们”是复数，可能是集合性表达。中文“他们心里刚硬”自然地指众人共同呈现的内在状态，同时不必强行判定是一个集合之心还是各人的心。
- source_word: λέγει
  choice: 就对那人说
  rationale: 原文使用马可常见的历史现在时。现代汉语叙事通常不以时态形态对应，借“就”承接环视与忧伤后的发言，保持叙事鲜明和顺畅。
- source_word: τῷ ἀνθρώπῳ
  choice: 那人
  rationale: 上下文所指是那个具体的男子；“那人”准确、简洁，也符合中文叙事习惯。
- source_word: Ἔκτεινον τὴν χεῖρα
  choice: 伸出手来
  rationale: 命令式要求一个明确动作。“伸出手来”是现代汉语中自然、直接的说法，并能与下文动作形成呼应。
- source_word: ἐξέτεινεν
  choice: 他伸出手
  rationale: 直接重复命令中的动作，保留原文的词语呼应；中文补出“手”比使用代词更清楚自然。
- source_word: ἀπεκατεστάθη
  choice: 复原了
  rationale: 该被动动词表示恢复到原先正常、完好的状态。“复原了”比泛称“治好了”更贴近恢复之义，也保留被动结果的重点。
theological_decisions:
- issue: 耶稣同时表现怒气与忧伤
  choice: 直译为“带着怒气”与“忧伤”，两者都明确保留。
  alternative: 将怒气弱化为“不悦”或“义愤”，或把忧伤扩写为“深深难过”。
  rationale: 原文并列呈现耶稣的怒气和忧伤。译文不应为了神学上的平顺而削弱其中任何一种情感，也不应额外规定怒气的性质。
- issue: “心”在单数形式下与复数所属者的关系
  choice: 正文采用“他们心里刚硬”，脚注说明原文“心”为单数。
  alternative: 译作“他们的心刚硬”以形式对应单数，或译作“他们各人的心刚硬”以明确分配关系。
  rationale: 原文可能采用集合性单数，但没有明说“各人”。正文使用自然且保留开放性的汉语，脚注交代形式差异，避免无根据地消解歧义。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。“环视”“刚硬”“忧伤”“复原”均为普通读者可理解且适合经文语体的用词；避免古奥措辞，也不加入解释性神学术语。
