  rationale: 删去无原文依据的“又”，将“内部又分裂了”改为“并且自相分裂”，以准确且自然地表达ἐμερίσθη在本句中与“攻击自己”相连的内部对立。将“而是”调为“反而”，使其在“不能站立”后的汉语转折更自然。其余关键措辞及脚注锚点保留。
