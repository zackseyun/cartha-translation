  text: καὶ εἰ ὁ Σατανᾶς ἀνέστη ἐφ’ ἑαυτὸν καὶ ⸀ἐμερίσθη, οὐ δύναται ⸀στῆναι ἀλλὰ τέλος ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/026.yaml
  text: And if Satan has risen up against himself and is divided[a], he cannot stand, but has come to an end.
translation:
  language: zh_hans
  text: 撒但若起来攻击自己，并且自相分裂，就不能站立，反而到了尽头[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“反而正走向终结。”原文直译为“反而有一个尽头”。
    reason: 保留τέλος ἔχει可按中文语境理解为达到终局或趋向终结的表达空间，同时不扩展本句的神学含义。
lexical_decisions:
- source_word: Σατανᾶς
  choice: 撒但
  rationale: 采用现代中文圣经传统中通行的人名音译，不将其含义另行意译。
- source_word: ἀνέστη ἐφ’ ἑαυτὸν
  choice: 起来攻击自己
  rationale: ἀνίστημι在此有起而敌对之意；ἐπί加反身代词表示敌对行动所针对的对象。此译既保留“起来”的形象，也自然表达自相攻击。
- source_word: ἐμερίσθη
  choice: 内部又分裂了
  rationale: 被动式表示撒但自身陷入分裂；补出“内部”使中文明确这是内部割裂，同时不增添分裂的具体方式。
- source_word: οὐ δύναται στῆναι
  choice: 就站立不住
  rationale: 保留στῆναι“站立”的修辞形象，并以现代中文惯用说法表达无法继续维持。
- source_word: ἀλλὰ τέλος ἔχει
  choice: 而是到了尽头
  rationale: 原文直译近于“而是有一个尽头”。“到了尽头”简洁自然，表达其不能延续的逻辑结果，但不把本句扩展为完整的末世论宣告。
theological_decisions:
- issue: 本句是否直接宣告撒但最终且绝对的灭亡
  choice: 译作条件论证中的结果：“而是到了尽头”
  alternative: 译作更绝对的“而是彻底灭亡了”
  rationale: 上下文是耶稣以反证说明撒但若自相攻击，其权势便不能维持。原文在此不要求加入“彻底”或明确限定为末世最终败亡，因此不作神学扩充。
- issue: τέλος ἔχει的时态与结果意味
  choice: 到了尽头
  alternative: 正走向终结
  rationale: ἔχει是现在时，但整个短语可表达已经面临或达到终局；中文“到了尽头”贴近原文的简洁断言，同时脚注保留过程性理解的可能。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“起来攻击自己”与“站立不住”保留原文的动作和修辞意象；“内部又分裂了”使逻辑关系清楚。
