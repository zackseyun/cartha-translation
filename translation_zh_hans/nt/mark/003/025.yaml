  text: καὶ ἐὰν οἰκία ἐφ’ ἑαυτὴν μερισθῇ, οὐ ⸀δυνήσεται ⸂ἡ οἰκία ἐκείνη σταθῆναι⸃·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/025.yaml
  text: And if a house is divided against itself[a], that house will not be able to stand.
translation:
  language: zh_hans
  text: 一个家若自相分裂[a]，那个家就站立不住。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “家”也可译作“房屋”或“家庭”。原文οἰκία兼有这些含义；与“站立”连用时，房屋的形象较为突出。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκία
  choice: 家
  rationale: οἰκία既可指房屋，也可指家或家庭。中文“家”能自然保留这种具体建筑与家庭共同体之间的双重意味，并与“站立不住”的比喻搭配。
- source_word: ἐφ’ ἑαυτὴν
  choice: 自相
  rationale: 此处ἐπί与反身代词表达内部彼此对立；“自相”是简洁自然的现代汉语表达。
- source_word: μερισθῇ
  choice: 分裂
  rationale: 不定过去时被动虚拟式与ἐὰν构成一般条件。“分裂”保留内部破裂和彼此对立的含义。
- source_word: δυνήσεται
  choice: 就……不住
  rationale: οὐ δυνήσεται表达将不能或没有能力；中文“就站立不住”自然呈现条件所导致的必然后果与无力维持之意。
- source_word: σταθῆναι
  choice: 站立
  rationale: 保留ἵστημι的具体比喻，同时让“继续存在、维持不倒”的含义由语境传达。
- source_word: ἡ οἰκία ἐκείνη
  choice: 那个家
  rationale: “那个”明确体现指示词ἐκείνη的强调作用。
- source_word: καὶ ἐὰν
  choice: 若
  rationale: “若”清楚表达条件关系；本节单独呈现时省略句首连接词“又/并且”，使中文自然，而上下文的递进关系不受损。
