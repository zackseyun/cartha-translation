  text: καὶ ἐὰν βασιλεία ἐφ’ ἑαυτὴν μερισθῇ, οὐ δύναται σταθῆναι ἡ βασιλεία ἐκείνη·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/024.yaml
  text: And if a kingdom is divided against itself, that kingdom cannot stand.
translation:
  language: zh_hans
  text: 如果一个国自相分裂，那个国就站立不住。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: 如果（不另译“并且”）
  rationale: καὶ承接上文论证；现代汉语在条件句起首通常不必明译连接词，省略后衔接自然，逻辑关系仍然清楚。
- source_word: ἐὰν
  choice: 如果
  rationale: 与虚拟语气共同引出条件，译为“如果”准确自然，也保留格言式陈述的开放条件。
- source_word: βασιλεία
  choice: 国
  rationale: 此处指作为整体的王国或国家实体，而非抽象的统治行为。“国”简洁、自然，并与比喻中的政治共同体形象相符。
- source_word: ἐφ’ ἑαυτὴν
  choice: 自相
  rationale: 在本语境中表示内部彼此对立；“自相分裂”是自然的现代汉语表达，准确体现“反对自身”的意思。
- source_word: μερισθῇ
  choice: 分裂
  rationale: 保留μερίζω在此处被分开、陷入内部割裂的含义；汉语“自相分裂”无需另加被动标记，也不指定造成分裂的主体。
- source_word: οὐ δύναται
  choice: 就……不住
  rationale: 结合后面的“站立”表达不能维持的能力；“站立不住”自然传达οὐ δύναται σταθῆναι的否定能力。
- source_word: σταθῆναι
  choice: 站立
  rationale: 保留原文“站住、继续存在”的形象性表达；与“不住”搭配也自然表示无法维持。
- source_word: ἡ βασιλεία ἐκείνη
  choice: 那个国
  rationale: 保留重复的名词和指示词，维持原文强调与论证力度，不简化为单纯代词。
theological_decisions:
- issue: 这句话的性质与范围
  choice: 译作耶稣论证中的一般条件性原则，不额外扩展其政治或撒但论含义。
  alternative: 将其明确表述为普遍适用于所有政治共同体的格言，或直接在本节中加入对撒但国度的解释。
  rationale: 原句本身采用国度内部发生分裂的类比。译文应保留其格言般的力度，同时不把上下文推论或更广泛的教义解释添加进正文。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“自相分裂”“站立不住”既贴近原文意象，也便于普通读者理解；保留“一个国／那个国”的对应和重复，以呈现希腊文的修辞结构。
