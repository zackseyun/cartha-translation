source:
  edition: SBLGNT
  text: καὶ παρετήρουν αὐτὸν εἰ τοῖς σάββασιν θεραπεύσει αὐτόν, ἵνα ⸀κατηγορήσωσιν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/002.yaml
  text: And they were watching him closely to see whether he would heal him on the Sabbath[a], so that they might accuse him.
translation:
  language: zh_hans
  text: 他们密切监视着耶稣，看他会不会在安息日[a]医治那人，好控告他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文“安息日”采用复数形式；在当时的希腊语中，这一复数形式可以惯用地指安息日这一天。
    reason: 说明原文词形及其惯用语义，避免正文不自然或产生多次安息日的误解。
lexical_decisions:
- source_word: παρετήρουν
  choice: 密切监视着
  rationale: 未完成时表示持续进行的动作；παρατηρέω在本语境中带有仔细而敌意地窥察之意。“密切监视着”兼顾持续性与不怀好意的审视。
- source_word: αὐτόν（第一处）
  choice: 耶稣
  rationale: 按上文所指将代词明确为“耶稣”，避免现代汉语中连续两个“他”造成指代混乱。
- source_word: εἰ
  choice: 看他会不会
  rationale: 这里引出间接疑问；“看……会不会”是自然的现代汉语表达，也保留观察者尚在等待结果的语气。
- source_word: τοῖς σάββασιν
  choice: 在安息日
  rationale: 原文为复数形式，但在通用希腊语中可惯用地指安息日这一天。汉语用单数“安息日”最自然，原文形式在脚注中说明。
- source_word: θεραπεύσει
  choice: 会……医治
  rationale: 将间接疑问中的将来时译为“会……医治”，自然表达他们所观察的未来行动；θεραπεύω在此意为治愈疾病。
- source_word: αὐτόν（第二处）
  choice: 那人
  rationale: 此代词指上节那只手萎缩的人。译为“那人”可消除与耶稣之间的指代歧义，但不添加原文以外的身份信息。
- source_word: ἵνα κατηγορήσωσιν αὐτοῦ
  choice: 好控告他
  rationale: ἵνα加虚拟式表示目的。“好”简洁保留目的关系；“控告”体现κατηγορέω的指控含义，又不把场景强化为正式起诉或审判。
theological_decisions:
- issue: 观察者的敌意与目的
  choice: 译作“密切监视着……好控告他”，表明他们观察的目的在于寻找控告的依据。
  alternative: 译作“仔细观察……以便起诉他”。
  rationale: 上下文显出敌意，且ἵνα明确表达目的；但κατηγορέω本节并未必然指正式司法起诉，因此避免使用法律意味更强的“起诉”。
- issue: 安息日复数形式的解释
  choice: 正文采用汉语惯用的单数“安息日”，脚注保留原文复数这一信息。
  alternative: 正文直译为“在各安息日”。
  rationale: τοῖς σάββασιν虽为复数形式，却可惯用地指安息日当天。直译为“各安息日”容易使读者误以为他们连续多个安息日监视同一次医治事件。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“密切监视着”体现持续且带敌意的观察；为避免两个αὐτόν在汉语中指代不清，分别明确译为“耶稣”和“那人”。
