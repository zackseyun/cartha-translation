  text: Καὶ ⸀ἔρχεται εἰς οἶκον· καὶ συνέρχεται πάλιν ⸀ὁ ὄχλος, ὥστε μὴ δύνασθαι αὐτοὺς ⸀μηδὲ ἄρτον φαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/020.yaml
  text: And he comes into a house[a], and the crowd gathers again[c][b], so that they are not even able to eat bread.
translation:
  language: zh_hans
  text: 他进到一所房子里[a]；众人又聚拢来，以致他们连饭也不能吃[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“家里”。希腊语直译为“一所房子里”，但这个短语也可能按习惯用法指“家里”。
    reason: lexical_alternative
  - marker: b
    text: 希腊语直译为“连饼也不能吃”，意思是连饭也不能吃。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: 进到
  rationale: 希腊语用叙事性现在时，描写他进入房屋。现代汉语不必用形式化的时态对应；“进到”自然表达朝向并进入的动作，同时保留马可叙事的直接感。
- source_word: εἰς οἶκον
  choice: 一所房子里
  rationale: οἶκον没有冠词，也没有明确的物主成分，因此正文不擅自指定为某人的家；“家里”作为可能的习惯用法列入脚注。
- source_word: συνέρχεται πάλιν ὁ ὄχλος
  choice: 众人又聚拢来
  rationale: “聚拢来”自然表达群众集合到他所在之处；“又”准确对应πάλιν，表明此前类似情形再次发生。
- source_word: ὥστε μὴ δύνασθαι αὐτούς
  choice: 以致他们……也不能
  rationale: ὥστε加不定式表示实际结果；“以致”清楚传达结果关系。“他们”保留αὐτούς的复数指称，不在正文中进一步限定具体包括哪些人。
- source_word: μηδὲ ἄρτον φαγεῖν
  choice: 连饭也不能吃
  rationale: ἄρτος字面为“饼”或“面包”，但“吃饼”在此可泛指吃饭。正文采用现代汉语自然说法“吃饭”，脚注保留字面信息。
theological_decisions:
- issue: αὐτούς所指的人物范围
  choice: 译作“他们”，不作具体说明
  alternative: 译作“耶稣和门徒”或“耶稣和跟随他的人”
  rationale: 复数代词表明受影响的不止一人，但本节本身没有明说其完整范围。保留代词可避免把上下文推断写成经文明示。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“一所房子里”保留原文未明确房屋归属的特点；“聚拢来”和“连饭也不能吃”适合普通读者，又不弱化人群造成的实际结果。
