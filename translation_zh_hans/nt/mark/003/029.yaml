base_translation:
  language: en
  yaml_path: translation/nt/mark/003/029.yaml
  text: but whoever blasphemes against the Holy Spirit never has forgiveness[c][b][a], but is guilty of an eternal sin.
translation:
  language: zh_hans
  text: 但谁亵渎圣灵，永远不得赦免[a]，却要担当[b]永远的罪[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“直到永世都没有赦免”，也就是“永远不得赦免”或“永远没有赦免”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“要对永远的罪负责。”
    reason: lexical_alternative
  - marker: c
    text: 有些抄本作“永远的审判”或“永远的定罪”，而不是“永远的罪”。
    reason: textual_variant
lexical_decisions:
- source_word: ὃς δ’ ἂν
  choice: 但无论谁
  rationale: ὃς与ἄν构成不定关系从句，表示任何符合条件的人；δέ在这里与上文形成轻微转折，因此译作“但无论谁”。
- source_word: βλασφημήσῃ
  choice: 亵渎
  rationale: 该词可指辱骂、毁谤；以圣灵为对象时，“亵渎”既符合现代汉语宗教语境，也保留原词的严重分量。
- source_word: εἰς τὸ πνεῦμα τὸ ἅγιον
  choice: 亵渎圣灵
  rationale: εἰς在此标明亵渎行为所针对的对象。汉语及物结构无需另加“针对”，可自然表达为“亵渎圣灵”。
- source_word: οὐκ ἔχει ἄφεσιν εἰς τὸν αἰῶνα
  choice: 永远不得赦免
  rationale: ἄφεσις指赦免、免除；否定式与εἰς τὸν αἰῶνα合用，意为永远没有赦免。译文采用自然而庄重的汉语，并在脚注保留较直译的表达。
- source_word: ἀλλὰ
  choice: 却
  rationale: ἀλλά引出强烈对照；“却”在本句中比重复使用“但”更流畅。
- source_word: ἔνοχός ἐστιν
  choice: 承担罪责
  rationale: ἔνοχος可表示有罪，也可表示须承担责任或刑责。“承担罪责”在汉语中兼顾这两方面，并避免把后面的属格关系解释得过死。
- source_word: αἰωνίου ἁμαρτήματος
  choice: 永远的罪
  rationale: 依照SBLGNT正文直译αἰωνίου与ἁμαρτήματος的修饰关系，不将其改写为“永远的刑罚”或其他解释性说法。
theological_decisions:
- issue: 不可赦免之冒犯的性质
  choice: 正文只按本节直译为“亵渎圣灵”
  alternative: 解释为持续拒绝圣灵的见证，或把圣灵的工作归于邪灵
  rationale: 上下文有助于理解这句话，但本节本身并未加入这些解释性限定；正文保留其直接措辞与神学张力。
- issue: ἔνοχος与“永远的罪”的关系
  choice: 译作“为永远的罪承担罪责”
  alternative: 译作“犯了永远的罪”或“要对永远的罪负责”
  rationale: 原文ἔνοχος既有“有罪”也有“负有责任、须承担后果”的语义空间；所选译法不把这种法律性表达简化为单纯描述犯罪行为。
- issue: 句末异文
  choice: 正文采用SBLGNT的“永远的罪”
  alternative: “永远的审判”或“永远的定罪”
  rationale: 所给希腊正文为αἰωνίου ἁμαρτήματος，因此正文据此翻译；其他抄本读法列入脚注，以便查考。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“亵渎”“圣灵”“赦免”“罪责”保留经文的宗教与法律性分量；句法尽量自然，同时用脚注说明时间习语、词义选择和文本异文。
