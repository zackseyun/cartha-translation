  text: καὶ πολλὰ ἐπετίμα αὐτοῖς ἵνα μὴ ⸂αὐτὸν φανερὸν⸃ ⸀ποιήσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/012.yaml
  text: And he sternly warned them many times not to make him known[a].
translation:
  language: zh_hans
  text: 他再三严厉地警告它们，不可让人知道他[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“揭示他”、“公开他”，或较正式地译为“使他显明”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλὰ
  choice: 再三
  rationale: 此处作副词修饰ἐπετίμα，表达反复或强烈的动作；“再三”在现代汉语中自然地体现一再告诫的意味，同时不排除语气加强的色彩。
- source_word: ἐπετίμα
  choice: 严厉地警告
  rationale: 该词在此表示带权威且强硬的制止。“严厉地警告”既保留力度，也自然引出后面的禁令；单译“责备”较难清楚表达命令它们不得披露的含义。
- source_word: αὐτοῖς
  choice: 它们
  rationale: 指上文的污灵。现代汉语通常用“它们”指非人的灵体；该选择也避免将指代对象误解为人群。
- source_word: ἵνα μὴ
  choice: 不可
  rationale: 在警告、命令语境中表达禁止的内容或目的。“不可”简洁、庄重，并保留禁止意味。
- source_word: αὐτὸν φανερὸν ποιήσωσιν
  choice: 把他显露出来
  rationale: φανερὸν ποιέω意为使某人显明、公开或为人所知。“显露出来”兼顾原文“使之显明”的构式与自然汉语，也保留究竟是揭示身份还是公开其人的一定含混性。
theological_decisions:
- issue: 耶稣命令污灵的具体内容
  choice: 译为禁止它们把耶稣显露出来，不进一步说明所披露的具体身份。
  alternative: 明确译成禁止它们宣告他是上帝的儿子，或仅笼统译作叫它们住口。
  rationale: 紧接的上文涉及污灵称耶稣为上帝的儿子，但本节本身只说不可使他显明。译文不把上文的称号补入本节，也不淡化这里关于公开、揭示耶稣的措辞。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“再三严厉地警告”传达原文动作的反复性和力度；“显露出来”保留原文可指使人公开为人所知或揭示其身份的语义幅度。
