  text: ⸂ἀλλ’ οὐδεὶς δύναται⸃ ⸂εἰς τὴν οἰκίαν τοῦ ἰσχυροῦ εἰσελθὼν τὰ σκεύη⸃ αὐτοῦ διαρπάσαι ἐὰν μὴ πρῶτον τὸν ἰσχυρὸν δήσῃ, καὶ τότε τὴν οἰκίαν αὐτοῦ ⸀διαρπάσει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/027.yaml
  text: But no one can enter the house of the strong man and plunder his goods unless he first ties up the strong man[b][a]; then indeed he will plunder his house.
translation:
  language: zh_hans
  text: 可是，谁也不能进壮汉[b]的家去抢夺他的财物[a]，除非先把壮汉捆起来；然后，他才会洗劫他的家。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “财物”或译“所有物”；原文直译为“器物”或“东西”。
    reason: lexical_alternative
  - marker: b
    text: “壮汉”是耶稣用来说明胜过撒但的比喻；正文保留原有形象，没有直接把它解释出来。
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλ’
  choice: 可是
  rationale: 承接上文并引出反驳中的对比；“可是”在现代汉语中自然、清楚，又保留转折语气。
- source_word: οὐδεὶς δύναται
  choice: 没有人能
  rationale: 直接表达无人有能力做到，保留原文所述的不可能性。
- source_word: εἰς τὴν οἰκίαν τοῦ ἰσχυροῦ εἰσελθὼν
  choice: 进壮汉的家
  rationale: 以自然汉语表达进入房屋的动作，并保留“家／房屋”的具体比喻图景。
- source_word: τοῦ ἰσχυροῦ / τὸν ἰσχυρόν
  choice: 壮汉
  rationale: 原文是形容词“强壮的”名词化使用；“壮汉”简洁自然，并在两处保持同一形象。
- source_word: τὰ σκεύη αὐτοῦ
  choice: 他的财物
  rationale: σκεύη本义可指器具、物件；在入室抢夺的语境中泛指屋主的财物。“财物”比直译“器皿”更符合这里的语义。
- source_word: διαρπάσαι
  choice: 抢夺
  rationale: 该动词表示强行夺取、掠走；“抢夺”保留动作的暴力性和力度。
- source_word: ἐὰν μὴ πρῶτον
  choice: 除非先
  rationale: 准确表达必须预先满足的条件以及动作的先后次序。
- source_word: δήσῃ
  choice: 捆起来
  rationale: δέω意为捆绑；“捆起来”是现代汉语中具体而生动的表达，符合闯入壮汉家中的比喻场景。
- source_word: καὶ τότε
  choice: 到那时，才
  rationale: 清楚呈现先捆住、后洗劫的条件关系和时间推进；“才”自然体现只有条件达成后才能行动。
- source_word: τὴν οἰκίαν αὐτοῦ διαρπάσει
  choice: 他才会洗劫他的家
  rationale: “洗劫……家”是自然汉语搭配，保留将整个家作为掠夺对象的具体图景；未来语气由“会”表达。
theological_decisions:
- issue: “壮汉”在耶稣论证中的比喻所指
  choice: 正文保留“壮汉”的比喻，不直接把它改写为撒但
  alternative: 在正文中明确译成“撒但”，或抽象译成“强者”
  rationale: 上下文表明这幅图景涉及胜过撒但，但本节原文仍以壮汉及其家为比喻。保留原有意象，避免把解释直接写进正文。
- issue: “捆起来”与抢夺之间的关系
  choice: 保留为实施洗劫之前必须先完成的条件
  alternative: 抽象解释为制服或战胜邪恶势力
  rationale: 原文使用具体的捆绑动作，并强调先后次序；译文不将其提前神学化或抽象化。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“壮汉”“捆起来”“洗劫他的家”使比喻具体鲜明；句式以“除非先……到那时才……”清楚呈现原文的条件和动作次序。
