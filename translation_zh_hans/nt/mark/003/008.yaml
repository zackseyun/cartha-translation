  text: καὶ ἀπὸ Ἱεροσολύμων καὶ ἀπὸ τῆς Ἰδουμαίας ⸀καὶ πέραν τοῦ Ἰορδάνου ⸁καὶ περὶ Τύρον καὶ Σιδῶνα, πλῆθος πολύ, ⸀ἀκούοντες ὅσα ⸀ἐποίει ἦλθον πρὸς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/008.yaml
  text: and from Jerusalem[a], and from Idumea, and beyond the Jordan, and around Tyre and Sidon, a great crowd, hearing what he was doing[c][b], came to him.
translation:
  language: zh_hans
  text: 还有从耶路撒冷、以土买、约旦河对岸，以及推罗和西顿一带来的一大群人；他们听见他所做的事[a]，就来到他那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“凡他所做的事。”希腊语ὅσα可带有概括全部事项的含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ Ἱεροσολύμων
  choice: 从耶路撒冷
  rationale: ἀπό加属格表示来源；“耶路撒冷”是该地名的现代汉语标准译名。
- source_word: ἀπὸ τῆς Ἰδουμαίας
  choice: 从以土买
  rationale: 保留ἀπό所表达的来源，并采用该地区名称在中文圣经传统中通行、现代读者可识别的译法。
- source_word: πέραν τοῦ Ἰορδάνου
  choice: 约旦河对岸
  rationale: πέραν加属格指越过某界线的另一边；此处所指是约旦河另一侧的地区。“对岸”自然准确，又不擅自限定更具体的行政区域。
- source_word: περὶ Τύρον καὶ Σιδῶνα
  choice: 推罗和西顿一带
  rationale: περί加宾格在此表达空间上的周边范围，所指不一定只限于两座城本身；“一带”符合现代汉语地理表达。
- source_word: πλῆθος πολύ
  choice: 一大群人
  rationale: 该短语强调人数众多；“一大群人”自然、清楚，并适合叙事语体。
- source_word: ἀκούοντες
  choice: 他们听说了
  rationale: 现在分词与主句“来到”相连，可表达伴随、时间或原因关系。汉语用分句承接最自然；“听说”也符合其所听内容为耶稣事迹的语境，同时不把逻辑关系严格限定为因果。
- source_word: ὅσα ἐποίει
  choice: 他所做的事
  rationale: ὅσα概括他所做的事情，未必必须显明译出“所有”；未完成时ἐποίει表示当时持续进行的活动。脚注保留其可带全面含义的可能。
- source_word: ἦλθον πρὸς αὐτόν
  choice: 就来到他那里
  rationale: ἔρχομαι配πρός加宾格表示朝向某人并来到其处；“来到他那里”是自然且准确的现代汉语表达。
- source_word: καὶ … καὶ … καὶ
  choice: 还有……、……、……以及……
  rationale: 希腊文重复καί形成地域不断累加的效果。中文以“还有”承接上文，并用列举顿号和“以及”呈现累加关系，避免机械重复“和”造成不自然。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。句子以“一大群人”为中心，将多个来源地前置列举；分号帮助读者辨明主语及其随后行动。代词“他”忠实对应原文；本节虽可由上下文明确指耶稣，但不在正文中额外补入专名。原英文资料中标在“耶路撒冷”后的脚注内容实际解释“约旦河对岸”，与标记位置不符，因此未照搬；相关地理含义已直接清楚译入正文。
