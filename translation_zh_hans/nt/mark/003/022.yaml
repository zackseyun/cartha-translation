  text: καὶ οἱ γραμματεῖς οἱ ἀπὸ Ἱεροσολύμων καταβάντες ἔλεγον ὅτι Βεελζεβοὺλ ἔχει καὶ ὅτι ἐν τῷ ἄρχοντι τῶν δαιμονίων ἐκβάλλει τὰ δαιμόνια.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/022.yaml
  text: And the scribes who had come down from Jerusalem were saying[a], “He has Beelzebul,” and[c][b], “By the ruler of the demons he casts out the demons.”
translation:
  language: zh_hans
  text: 从耶路撒冷下来的经学家一直说[a]：“他身上有别西卜[b]。”又说：“他是靠着鬼王[c]赶鬼。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“反复说。”原文动词可表示持续或一再这样说。
    reason: aspectual_alternative
  - marker: b
    text: 原文为Βεελζεβούλ（Beelzebul）；“别西卜”是传统中文译名。这里“他身上有别西卜”也可意译为“他被别西卜附身了”。
    reason: lexical_alternative
  - marker: c
    text: 直译：“众鬼的统治者。”
    reason: lexical_alternative
lexical_decisions:
- source_word: γραμματεῖς
  choice: 经学家
  rationale: 在福音书语境中，指熟悉并讲授犹太律法的专业人士；“经学家”比“文士”更能避免现代读者误解为抄写员，同时保持简洁。
- source_word: ἀπὸ Ἱεροσολύμων καταβάντες
  choice: 从耶路撒冷下来的
  rationale: 以自然的汉语关系结构表达分词，并保留从地势较高的耶路撒冷“下来”的方向含义。
- source_word: ἔλεγον
  choice: 一直说
  rationale: 未完成时态表示持续或反复的言说；“一直说”在汉语中自然地保留这一体貌。
- source_word: Βεελζεβοὺλ
  choice: 别西卜
  rationale: 采用现代中文圣经读者较熟悉的传统音译；脚注注明希腊文形式，以免掩盖原文名称。
- source_word: ἔχει
  choice: 身上有
  rationale: 原文直说“有”，语境暗示被邪灵占据或控制。“身上有”既是可懂的现代汉语，也避免在正文中把暗示完全展开为“被附身”。
- source_word: ἐν τῷ ἄρχοντι τῶν δαιμονίων
  choice: 靠着鬼王
  rationale: ἐν在这里表示凭借或倚靠某种权势；“靠着”准确传达工具或能力来源。“鬼王”简明表达‘众鬼的统治者’。
- source_word: δαιμονίων / δαιμόνια
  choice: 鬼
  rationale: 此处名词是δαιμόνιον；“鬼”是普通现代汉语中简洁自然的对应词，也不混入原文此处没有的“不洁之灵”措辞。
- source_word: ἐκβάλλει
  choice: 赶鬼
  rationale: “赶鬼”是现代汉语中表达驱逐邪灵的自然固定说法，保留ἐκβάλλει的驱逐含义。
theological_decisions:
- issue: 如何表达“Βεελζεβοὺλ ἔχει”这一控告
  choice: 他身上有别西卜
  alternative: 他被别西卜附身了
  rationale: 正文尽量保留希腊文“有”的说法及其含混张力，不直接断定附身的具体方式；脚注给出语境中更明确的意译。
- issue: 如何表达ἄρχων的权势含义
  choice: 鬼王
  alternative: 众鬼的统治者
  rationale: “鬼王”在现代汉语中简洁、易懂，明确指统管众鬼者，而不引入某一宗派对邪灵等级的额外体系；较直译的说法列于脚注。
translation_notes:
  register: 采用庄重而通俗的现代标准汉语。“经学家”“靠着”“赶鬼”便于普通读者理解；正文保留“身上有”的原文张力，并用脚注说明其语境含义。所有脚注标记均置于相关词句之后。
