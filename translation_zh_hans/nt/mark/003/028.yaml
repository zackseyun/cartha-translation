source:
  edition: SBLGNT
  text: Ἀμὴν λέγω ὑμῖν ὅτι πάντα ἀφεθήσεται ⸂τοῖς υἱοῖς τῶν ἀνθρώπων, τὰ ἁμαρτήματα⸃ καὶ ⸂αἱ βλασφημίαι ὅσα ἐὰν⸃ βλασφημήσωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/028.yaml
  text: Truly I tell you that all sins will be forgiven to the sons of men[a], and whatever blasphemies they may utter;
translation:
  language: zh_hans
  text: 我实在告诉你们：世人[a]所犯的一切罪，以及他们无论说出什么亵渎的话，都将得到赦免；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“人的众子”，是泛指全人类的表达。
    reason: 说明闪语式泛指表达的字面形式及包容范围，避免把“世人”误解为仅指男性。
lexical_decisions:
- source_word: Ἀμὴν
  choice: 实在
  rationale: 在“Ἀμὴν λέγω ὑμῖν”这一庄严宣告公式中译作“实在”，既自然又保留郑重肯定的语气，不按音译作“阿们”。
- source_word: λέγω ὑμῖν
  choice: 我告诉你们
  rationale: 保留第一人称说话者和复数受话者，符合现代汉语的直接表达。
- source_word: πάντα
  choice: 一切
  rationale: 此处概括后面同位说明的“罪”和“亵渎的话”；“一切”准确表达其全面范围。
- source_word: ἀφεθήσεται
  choice: 都将得到赦免
  rationale: ἀφίημι在罪与亵渎的语境中表示赦免；未来被动语态译为“将得到赦免”，不擅自明说施动者。
- source_word: τοῖς υἱοῖς τῶν ἀνθρώπων
  choice: 世人
  rationale: 该闪语式表达泛指人类。直译“人的众子”在现代汉语中生硬，也容易造成误解，因此正文采用自然且包容原义的“世人”，并以脚注说明字面形式。
- source_word: τὰ ἁμαρτήματα
  choice: 所犯的一切罪
  rationale: 该复数名词指具体的罪行；补出“所犯”使汉语句法自然，并与后面的言语行为形成清晰对应。
- source_word: αἱ βλασφημίαι
  choice: 亵渎的话
  rationale: 上下文涉及对圣灵的亵渎，“亵渎”保留宗教与神学分量；加“的话”使汉语明确这是言语行为。
- source_word: ὅσα ἐὰν βλασφημήσωσιν
  choice: 他们无论说出什么亵渎的话
  rationale: “无论……什么”表达ἐάν加虚拟语气所具有的不定、开放范围，“说出”自然呈现动词性言语行为。
theological_decisions:
- issue: 本节全面赦免的宣告与下一节亵渎圣灵警告之间的关系
  choice: 按本节本身译为涵盖“一切罪”和各种亵渎之言的广泛宣告，不提前加入下一节的例外。
  alternative: 在本节措辞中预先加入限制或例外。
  rationale: 希腊文本先作全面宣告，下一节才提出警告；译文应保留经文推进所形成的神学张力，而不在本节先行消解。
- issue: τοῖς υἱοῖς τῶν ἀνθρώπων的泛指范围与阳性字面形式
  choice: 正文译作“世人”，脚注注明原文直译为“人的众子”，泛指全人类。
  alternative: 正文直译为“人的众子”或“人子们”。
  rationale: 该表达并非专指男性；“人子们”还可能与“人子”称号混淆。用“世人”能准确传达泛指意义，脚注则保存源语形式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我实在告诉你们”保留耶稣宣告公式的郑重语气；冒号引出宣告内容，分号承接下一节尚未说完的对比警告。
