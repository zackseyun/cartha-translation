base_translation:
  language: en
  yaml_path: translation/nt/mark/003/016.yaml
  text: And he appointed the twelve[a], and he gave Simon the name Peter,
translation:
  language: zh_hans
  text: 他设立了十二人，并给西门起名为彼得[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “彼得”意为“磐石”。
    reason: 说明音译人名所保留的希腊语词义。
lexical_decisions:
- source_word: ἐποίησεν
  choice: 设立
  rationale: 该词本义可指“做成、使成为”；在这里指耶稣组成并确立十二人这一群体。“设立”既体现这一语境中的正式意味，也不引入原文没有的后期教会职衔。
- source_word: τοὺς δώδεκα
  choice: 十二人
  rationale: 原文直指由十二人组成的特定群体；译作“十二人”自然清楚，同时避免擅自补入本节未出现的“使徒”。
- source_word: ἐπέθηκεν ὄνομα
  choice: 给……起名叫
  rationale: 这一希腊语习语直译为“把名字加在……身上”，实际表示赋予名字。“给……起名叫”是现代汉语中自然且明确的表达。
- source_word: Σίμωνι
  choice: 西门
  rationale: 按现代中文圣经传统音译此人名。
- source_word: Πέτρον
  choice: 彼得
  rationale: 此处作为赋予西门的人名，采用通行音译“彼得”；名字所含“磐石”之意放入脚注，以保留其词义而不把人名直接意译进正文。
theological_decisions:
- issue: 耶稣对十二人所行之事的表达
  choice: 设立了十二人
  alternative: 使十二人成为一个群体；选立了十二人
  rationale: “设立”传达 ἐποίησεν 在本语境中组成、确立这一群体的作用，又不将其具体化为原文未明说的教会职位。
- issue: Πέτρον 的处理
  choice: 彼得
  alternative: 磐石
  rationale: 该词在句中是耶稣赋予西门的名字，因此正文音译；其语义另以脚注说明，既保留命名事实，也呈现名字的含义。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“十二人”不加宗派性或后期制度性称谓；脚注标记紧随“彼得”，与脚注实际说明的词对应。
