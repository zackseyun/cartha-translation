  text: καὶ Ἀνδρέαν καὶ Φίλιππον καὶ Βαρθολομαῖον καὶ Μαθθαῖον καὶ Θωμᾶν καὶ Ἰάκωβον τὸν τοῦ Ἁλφαίου καὶ Θαδδαῖον καὶ Σίμωνα τὸν ⸀Καναναῖον
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/018.yaml
  text: and Andrew[a], and Philip, and Bartholomew, and Matthew, and Thomas, and James the son of Alphaeus, and Thaddaeus, and Simon the Cananaean.
translation:
  language: zh_hans
  text: 还有安得烈、腓力、巴多罗买、马太、多马、亚勒腓的儿子雅各、达太，以及奋锐者西门[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作“迦拿奈人”；这个称号很可能意为“奋锐者”，参路加福音6:15。旧译“迦南人”容易使人误以为是指族裔。
    reason: 说明原文称号的形式、最可能的含义及另一传统译法，避免将称号过度具体化为党派归属。
lexical_decisions:
- source_word: καὶ
  choice: 还有／以及
  rationale: 本节承接上一节的名单；用“还有”自然体现续列关系，并在末项前用“以及”，避免逐项机械重复“和”，同时保留希腊文并列结构。
- source_word: Ἀνδρέαν, Φίλιππον, Βαρθολομαῖον, Μαθθαῖον, Θωμᾶν, Θαδδαῖον
  choice: 安得烈、腓力、巴多罗买、马太、多马、达太
  rationale: 采用现代中文圣经语境中通行且易辨认的人名译法。
- source_word: Ἰάκωβον τὸν τοῦ Ἁλφαίου
  choice: 亚勒腓的儿子雅各
  rationale: 冠词加属格在此用父子关系辨明这位雅各；明确译出“儿子”最符合上下文，也比含混的“亚勒腓的雅各”自然。
- source_word: Σίμωνα τὸν Καναναῖον
  choice: 奋锐党的西门
  rationale: Καναναῖος很可能反映亚兰语中“热心者／奋锐者”的称号，路加福音6:15的ζηλωτής支持这一理解；采用中文读者熟悉的“奋锐党”，并以脚注保留原词形式及其解释上的细微余地。
theological_decisions:
- issue: 西门称号 Καναναῖος 的含义
  choice: 奋锐党的西门
  alternative: 迦拿奈人西门／迦南人西门
  rationale: 该词通常不被视为表示迦南族裔或地域，而被理解为源自闪语、意为“热心者／奋锐者”的称号。正文传达其最可能的意义，脚注说明希腊文形式，避免把词源判断误当作毫无争议，也避免“迦南人”造成族裔误解。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。名单以顿号排列，并用“还有……以及……”承接上文；人名沿用现代简体中文圣经中的通行形式。脚注标记紧随其所解释的“西门”称号之后。
