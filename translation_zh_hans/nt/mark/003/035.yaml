  text: ὃς ⸀γὰρ ἂν ποιήσῃ τὸ θέλημα τοῦ θεοῦ, οὗτος ἀδελφός μου καὶ ⸀ἀδελφὴ καὶ μήτηρ ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/035.yaml
  text: For whoever does the will of God, this one is my brother and sister and mother.
translation:
  language: zh_hans
  text: 因为凡遵行上帝旨意的人，就是我的弟兄、姊妹和母亲。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“这个人就是我的弟兄、姊妹和母亲。”原文的指示代词带有强调意味。
    reason: 说明οὗτος的直译形式及强调作用。
lexical_decisions:
- source_word: ὃς γὰρ ἂν ποιήσῃ
  choice: 因为凡……的人
  rationale: 关系代词与ἄν及不定过去时虚拟语气构成泛指条件，表达“无论谁”或“凡……的人”；γάρ承接上文说明理由，译为“因为”。
- source_word: ποιήσῃ τὸ θέλημα τοῦ θεοῦ
  choice: 遵行上帝旨意
  rationale: ποιέω在此指实行、履行；汉语中“遵行……旨意”自然庄重，也保留实际行动的含义。
- source_word: οὗτος
  choice: 就是
  rationale: οὗτος具有指示和强调作用。现代汉语用判断句中的“就是”自然地体现强调，而不生硬直译为“这个人”。
- source_word: ἀδελφός μου καὶ ἀδελφὴ καὶ μήτηρ
  choice: 我的弟兄、姊妹和母亲
  rationale: 逐一保留三个具体亲属称谓及其累加效果，不将其笼统化为“家人”。
theological_decisions:
- issue: 单数泛指主体与男女亲属称谓
  choice: 凡……的人，就是
  alternative: 无论谁……，这个人就是
  rationale: 既保留单数泛指范围，也避免使用听来仅指男性的代词；谓语中的“弟兄、姊妹和母亲”完整保留。
- issue: 耶稣家属语言的性质
  choice: 保留具体亲属称谓，按语境作比喻性理解
  alternative: 译为“我的家人”
  rationale: 原文以具体称谓重新界定属灵家属关系；概括为“家人”会削弱修辞力度，并遗漏姊妹和母亲的明确表达。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“遵行上帝旨意”保留常见圣经语体但不显陈旧；“就是”承担原文指示代词的强调功能。
