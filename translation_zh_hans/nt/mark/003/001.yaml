  yaml_path: translation/nt/mark/003/001.yaml
  text: And he entered a synagogue again[c][b][a], and a man was there with a withered hand.
translation:
  language: zh_hans
  text: 耶稣又进了一座会堂[a]。那里有一个人，他的一只手萎缩了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“进了那会堂”；若马可所指的是上下文中已知的某一座会堂，可作特指理解。
    reason: alternative_reading
  - marker: b
    text: “萎缩了”也可译作“枯干了”或“干瘪了”。原文描述这只手已变得枯干、萎缩的状态。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: 进了
  rationale: 不定过去时在叙事中表示一次完成的进入动作；“进了”简洁自然。根据上文明确的主语，将希腊文省略的主语译为“耶稣”，便于本节独立阅读。
- source_word: πάλιν
  choice: 又
  rationale: 表示动作再次发生；“又”符合现代汉语叙事习惯。
- source_word: εἰς συναγωγήν
  choice: 进了一个会堂
  rationale: εἰς配合移动动词表达进入；συναγωγήν没有冠词，正文采用不特指的“一个会堂”，同时以脚注保留特指理解。
- source_word: ἦν ἐκεῖ
  choice: 那里有
  rationale: 将存在结构与地点副词自然合译，完整表达有人在该处。
- source_word: ἄνθρωπος
  choice: 一个人
  rationale: ἄνθρωπος在此指一名个体；中文“一个人”自然，并不额外强调原文未明说的性别。
- source_word: ἐξηραμμένην
  choice: 萎缩了
  rationale: ξηραίνω的完成时被动分词描述手已经枯干、失去正常功能的持续状态；“萎缩了”在现代中文中清楚自然。
- source_word: ἔχων τὴν χεῖρα
  choice: 一只手萎缩了
  rationale: 把希腊文“有着那只已经枯干的手”的结构转为自然汉语身体部位表述，保留病症状态。
