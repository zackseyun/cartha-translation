  text: καὶ ἔχειν ⸀ἐξουσίαν ἐκβάλλειν τὰ δαιμόνια·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/015.yaml
  text: and to have authority to cast out demons[a].
translation:
  language: zh_hans
  text: 并有权柄赶出鬼魔[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“驱逐鬼魔”。
    reason: 词汇替代译法；“驱逐”同样能表达 ἐκβάλλειν 所含的强制逐出之意。
lexical_decisions:
- source_word: καὶ
  choice: 并
  rationale: 连接本节与前文连续的不定式结构，表达耶稣设立十二人的相关使命；“并”在现代汉语中简洁自然。
- source_word: ἔχειν
  choice: 有
  rationale: 直接表达“拥有、具有”，与“权柄”搭配自然，也保留原文不定式在上下文中的承接关系。
- source_word: ἐξουσίαν
  choice: 权柄
  rationale: 这里侧重耶稣所授予的行事资格和权能，而非单指抽象力量；“权柄”能兼顾受委任的权威与实际能力。
- source_word: ἐκβάλλειν
  choice: 赶出
  rationale: 准确表达把某对象从所在之处逐出的动作，也是现代汉语叙述驱魔行动时自然、清楚的说法。
- source_word: τὰ δαιμόνια
  choice: 鬼魔
  rationale: 原文明确使用 δαιμόνια，而非“污灵”；“鬼魔”可准确指称邪恶的超自然灵体，并避免借用邻近经文的不同措辞。
theological_decisions:
- issue: 门徒使命中 ἐξουσίαν 的性质
  choice: 权柄
  alternative: 能力
  rationale: 上下文是耶稣设立并差遣十二人，因此该词包含受授予的行事权威；译为“权柄”既凸显委任关系，也不排除实施赶鬼所需的超自然能力。
translation_notes:
  register: 采用现代、庄重而通俗的表达。“并有权柄赶出鬼魔”结构紧凑，可自然承接前文的使命清单；正文中的脚注标记与脚注一致。
