- from: 耶稣吩咐门徒为他备着一只小船，因为人多，免得众人挤压他。[a]
  to: 耶稣吩咐门徒为他预备一条小船，随时供他使用，免得群众挤压他[a]。
  rationale: 修订将小船“随时供他使用”明确为持续待命的安排，贴合προσκαρτερῇ αὐτῷ；以“群众”对应ὄχλος，并保留“挤压”及其脚注替代译法，以维持原文的力度与语义范围。
