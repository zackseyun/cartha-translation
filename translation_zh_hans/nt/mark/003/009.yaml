  text: καὶ εἶπεν τοῖς μαθηταῖς αὐτοῦ ἵνα πλοιάριον προσκαρτερῇ αὐτῷ διὰ τὸν ὄχλον ἵνα μὴ θλίβωσιν αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/009.yaml
  text: And he told his disciples that a small boat should stay ready for him because of the crowd[a], so that they might not crush him.
translation:
  language: zh_hans
  text: 耶稣吩咐门徒为他预备一条小船，随时供他使用，免得群众挤压他[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“挤伤他”。原文动词可指拥挤、压迫，或因压力而挤伤。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: 吩咐
  rationale: 此处后接命令内容，不只是一般地“说”；“吩咐”自然表达耶稣要门徒作出具体安排。
- source_word: μαθηταῖς
  choice: 门徒
  rationale: “门徒”是福音书中 μαθητής 的通行译法，兼顾学习者与跟随者的关系。
- source_word: πλοιάριον
  choice: 一只小船
  rationale: 保留 πλοιάριον 所带的小型船只之意，也符合当时湖边场景。
- source_word: προσκαρτερῇ
  choice: 备着
  rationale: 表达持续保持可用、随时待命的状态，比仅说一次性的“预备”更贴近原文。
- source_word: αὐτῷ
  choice: 为他
  rationale: 表示这只船是为耶稣预备、供他需要时使用。
- source_word: διὰ τὸν ὄχλον
  choice: 因为人多
  rationale: διά 加宾格在此表示原因；“因为人多”比直译“因为群众”更符合现代汉语叙事。
- source_word: θλίβωσιν
  choice: 挤压
  rationale: 该词可指施加压力、拥挤压迫，甚至挤伤；“挤压”既保留力度，也不武断认定已经造成伤害。
theological_decisions: []
translation_notes:
  register: 采用现代、自然而庄重的叙事语言。“备着”体现小船须持续待用；“众人”补明复数动词的施事者，但不添加原文之外的神学解释。
