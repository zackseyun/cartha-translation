review_pass:
  verdict: revise
  source_fidelity: 译文准确传达了耶稣上山、亲自召唤所要之人，以及他们往他那里去的叙事次序。“他自己”适当地保留了αὐτός对主语的强调；“到他那里去了”也可表达ἀπῆλθον πρὸς αὐτόν的朝向性。需要调整的是“把他自己所要的人召到身边来”的句法搭配，略显生硬，且“把”字结构在此不如直接的兼语式自然。
  naturalness: 将“把……召到身边来”改为“叫……到他身边来”，更符合现代标准汉语，也清楚表达προσκαλεῖται的“召到自己这里”之意。分号可保留，以呈现两项动作。
  terminology: “耶稣”“山”“他自己所要的人”均恰当。这里的“要”忠实且自然，不应擅自改为带有更强神学色彩的“拣选”。
