  text: Καὶ ἀναβαίνει εἰς τὸ ὄρος καὶ προσκαλεῖται οὓς ἤθελεν αὐτός, καὶ ἀπῆλθον πρὸς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/013.yaml
  text: And he went up on the mountain and called to himself those whom he wanted[b][a], and they came to him.
translation:
  language: zh_hans
  text: 耶稣上了山，叫他自己所要的人到他身边来；他们就到他那里去了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναβαίνει
  choice: 上了
  rationale: 希腊文使用叙事性现在时；现代汉语叙事用“上了”自然地表达登上山的动作，同时保留方向性。
- source_word: εἰς τὸ ὄρος
  choice: 山
  rationale: 与“上”连用时，“上了山”自然表达登临山上；ὄρος可指山或山地，此处不必过度限定为某座特定的山。
- source_word: προσκαλεῖται
  choice: 召到身边来
  rationale: 该动词的中间语态带有亲自招来、归向自己的意味；“召到身边来”既保留召唤的主动性，也体现关系和方向。
- source_word: οὓς ἤθελεν αὐτός
  choice: 他自己所要的人
  rationale: 显明的αὐτός带强调意味；“他自己所要的人”保留耶稣本人作出选择的强调，又不额外引入本节未明说的教义体系。
- source_word: ἀπῆλθον πρὸς αὐτόν
  choice: 他们就到他那里去了
  rationale: ἀπέρχομαι基本表示“去”，πρὸς αὐτόν说明方向是朝向耶稣；此译比单纯“来到他那里”更直接保留原动词的去向视角，同时符合现代汉语。
theological_decisions:
- issue: 耶稣亲自拣选所召之人的强调
  choice: 译作“他自己所要的人”
  alternative: “他所要的人”
  rationale: αὐτός明确加强主语“他”的语气，应予保留；但译文只呈现耶稣在此事上的主动选择，不把它扩展为经文本身未陈述的预定论或自由意志立场。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“召到身边来”比单用“召唤”更清楚地表达προσκαλεῖται所含的归向自身意味；分号呈现召唤与回应之间紧密而有层次的关系。
