  text: καὶ ἐξεπλήσσοντο ἐπὶ τῇ διδαχῇ αὐτοῦ, ἦν γὰρ διδάσκων αὐτοὺς ὡς ἐξουσίαν ἔχων καὶ οὐχ ὡς οἱ γραμματεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/022.yaml
  text: And they were astonished at his teaching[a], for he was teaching them as one having authority, and not as the scribes.
translation:
  language: zh_hans
  text: 众人对他的教导感到惊讶，因为他教导他们时，像一位有权柄的人，不像文士那样。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξεπλήσσοντο
  choice: 感到惊讶
  rationale: 表达强烈的惊异反应；结合未完成时，在叙事语境中自然呈现众人当时持续的反应。
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: 对他的教导
  rationale: “教导”可兼指所教的内容与教导的方式，现代汉语自然，也避免“教义”在此可能造成的范围收窄。
- source_word: ἦν γὰρ διδάσκων
  choice: 因为他教导他们
  rationale: 汉语通常无需用“正在”机械对应迂回式结构；在场景叙述中，“教导他们”自然保留当时持续施教的意味。
- source_word: ὡς ἐξουσίαν ἔχων
  choice: 像有权柄的人
  rationale: 贴近ὡς引出的比较结构，并保留“具有权柄”的明确陈述；比单译“很有权威地”更能呈现原文的人物对比。
- source_word: γραμματεῖς
  choice: 经学家
  rationale: 指当时精通并讲授犹太律法的文士。“经学家”在现代汉语中较自然地表达其专业身份，且比泛称“文士”更便于普通读者理解。
theological_decisions:
- issue: 耶稣的权柄与经学家的对比
  choice: 按原文描述耶稣像有权柄的人那样教导，不进一步说明权柄的来源或性质。
  alternative: 解释性地译为“带着神圣的权柄”或“凭着从神而来的权柄”。
  rationale: 本句清楚强调耶稣与经学家在教导权柄上的差别，却没有在此明说该权柄的来源或本体性质；译文应保留这一神学张力，不加入经文本句未明言的解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“众人”承接复数主语；“像有权柄的人，不像经学家”保留原文两个ὡς所形成的鲜明平行对比。
