  text: Καὶ ἐγένετο ἐν ἐκείναις ταῖς ἡμέραις ἦλθεν Ἰησοῦς ἀπὸ Ναζαρὲτ τῆς Γαλιλαίας καὶ ἐβαπτίσθη ⸂εἰς τὸν Ἰορδάνην ὑπὸ Ἰωάννου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/009.yaml
  text: And it happened in those days that Jesus came from Nazareth of Galilee and was baptized in the Jordan by John[a].
translation:
  language: zh_hans
  text: 那些日子，耶稣从加利利的拿撒勒来，在约旦河里受约翰施洗[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“进入约旦河，受约翰施洗。”希腊文介词更直译可作“进入”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο ἐν ἐκείναις ταῖς ἡμέραις
  choice: 那些日子
  rationale: “καὶ ἐγένετο”是常见的叙事衔接语；若直译为“事情发生了”在现代汉语中显得累赘。以“那些日子”自然引入事件，同时保留时间背景和叙事推进。
- source_word: ἦλθεν Ἰησοῦς
  choice: 耶稣……来
  rationale: 按基本义译出运动动词ἦλθεν，不额外加入“到达”等终点色彩。
- source_word: ἀπὸ Ναζαρὲτ τῆς Γαλιλαίας
  choice: 从加利利的拿撒勒
  rationale: 自然表达拿撒勒与加利利的地域关系，并贴近希腊文的地点限定结构。
- source_word: ἐβαπτίσθη
  choice: 受了……的洗
  rationale: 准确表达不定过去时被动语态；“受洗”是现代汉语中清楚、通行且不限定具体施洗方式的说法。
- source_word: εἰς τὸν Ἰορδάνην
  choice: 在约旦河里
  rationale: 结合施洗语境，将εἰς自然译作事件发生的水域；“约旦河”补出中文地名通常需要的通名，“里”表明在河水中的场景。脚注保留更贴近介词通常方向义的译法。
- source_word: ὑπὸ Ἰωάννου
  choice: 受了约翰的洗
  rationale: ὑπό加属格标明被动句中的施事者。中文采用“受某人的洗”比机械直译“被约翰施洗”更自然，同时明确约翰是施洗者。
theological_decisions:
- issue: βαπτίζω在涉及施洗方式的语境中如何翻译
  choice: 受了约翰的洗
  alternative: 被约翰浸入水中
  rationale: 原文报告耶稣受洗，却不要求译文以某一宗派化术语限定施洗方式；采用通行的“受洗”既忠实于词义，也保留经文本身的表达范围。
- issue: εἰς在本句中表示地点还是方向
  choice: 在约旦河里
  alternative: 进入约旦河受洗
  rationale: 该介词可以带有“进入”的方向义，也可在此施洗语境中指向动作发生的水域。正文采用自然中文的地点表达，脚注注明较贴近字面的方向性译法，不消除原文的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“那些日子”简洁承接上文；语序依照自然汉语调整，将地点置于施洗事件之前。脚注标记已在正文中以[a]标出。
