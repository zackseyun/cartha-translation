  text: καὶ ἐκήρυσσεν λέγων· Ἔρχεται ὁ ἰσχυρότερός μου ὀπίσω μου, οὗ οὐκ εἰμὶ ἱκανὸς κύψας λῦσαι τὸν ἱμάντα τῶν ὑποδημάτων αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/007.yaml
  text: And he was proclaiming[a], saying, “The one stronger than I is coming after me[c][b], of whom I am not worthy to stoop down and untie the strap of his sandals.”
translation:
  language: zh_hans
  text: 他宣告说：“有一位比我更强的，要在我以后来；我连弯下腰来解他鞋带也不配。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “鞋带”原文指固定凉鞋的皮带。“不配”也可译作“没有资格”或“不足以胜任”。
    reason: 说明古代鞋履背景，并保留ἱκανός在“配得”与“足以胜任”之间的词义幅度。
lexical_decisions:
- source_word: ἐκήρυσσεν
  choice: 宣告
  rationale: 未完成时表示持续或反复的行动；“宣告”保留κηρύσσω公开传扬、如传令者发布信息的意味，也避免过强的宗教术语色彩。
- source_word: λέγων
  choice: 说
  rationale: 作为ἐκήρυσσεν的补充性分词，自然地引出直接引语；汉语用“宣告说”简洁清楚。
- source_word: Ἔρχεται
  choice: 要……来
  rationale: 现在时在语境中具有鲜明的临近感；现代汉语用“要来”自然表达即将来到，同时不把时间说得过于确定。
- source_word: ὁ ἰσχυρότερός μου
  choice: 有一位比我更强的
  rationale: 带冠词的比较级作名词使用。“更强”保留ἰσχυρός的基本含义，也能涵盖力量、权能和地位上的超越，而不额外指定是哪一种。
- source_word: ὀπίσω μου
  choice: 在我以后
  rationale: 此处既可有跟在身后的空间意味，也可有随后来到的时间意味；“在我以后”在本语境中自然，并保留相继而来的重点。
- source_word: ἱκανὸς
  choice: 配
  rationale: ἱκανός本可表示足够、胜任或合宜；在服事尊贵者的语境中，“不配”准确传达约翰所表达的深切自谦，而非单纯缺乏能力。
- source_word: κύψας
  choice: 弯下腰来
  rationale: 该不定过去分词表示解鞋带时先行或伴随的俯身动作；“弯下腰来”具体、自然，并体现身体降低。
- source_word: λῦσαι
  choice: 解
  rationale: 用于鞋带时，λύω自然指解开；中文“解鞋带”简明地道。
- source_word: τὸν ἱμάντα τῶν ὑποδημάτων αὐτοῦ
  choice: 他的鞋带
  rationale: ἱμάντα指固定鞋履的皮带或系带，ὑποδήματα在当时通常是凉鞋。“鞋带”是现代汉语最自然的整体表达；脚注补充其具体为凉鞋的皮带。
theological_decisions:
- issue: 约翰自谦程度的表达
  choice: 我连弯下腰来解他鞋带也不配
  alternative: 我没有资格／不能胜任弯腰解他的鞋带
  rationale: 语境重在约翰面对将来者时地位上的不配，而不只是实际能力不足；译文保留这种强烈对比，却不进一步加入关于来者身份的教义判断。
- issue: “在我以后”的关系
  choice: 要在我以后来
  alternative: 要从我后面来／要接着我来
  rationale: ὀπίσω μου可兼具空间及时间或相继意味。正文采用自然且较开放的“在我以后”，不将其限定为单纯的时间先后或门徒跟随关系。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙述。“宣告说”体现公开传扬；直接引语用“有一位”使名词化比较级在汉语中自然。“连……也不配”传达原句的强烈自谦，不添加宗派性解释。
