  yaml_path: translation/nt/mark/001/025.yaml
  text: And Jesus rebuked him[a], saying, “Be silent, and come out of him!”
translation:
  language: zh_hans
  text: 耶稣斥责他，说：“住口[a]！从他里面出来！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本词字面有“给动物套上笼嘴（或嚼子）”之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπετίμησεν
  choice: 斥责
  rationale: 该词表示严厉责备或权威性的喝令；“斥责”既保留言辞的严厉，也体现耶稣的权威。
- source_word: αὐτῷ
  choice: 他
  rationale: 阳性单数代词在上下文中指向污灵；后面的“从他里面出来”则指受污灵辖制的人，中文用两个“他”保留原文所依赖的语境区分。
- source_word: λέγων
  choice: 说
  rationale: 分词引出斥责的具体内容；译作“说”符合现代汉语叙事习惯，又不增加解释。
- source_word: Φιμώθητι
  choice: 住口
  rationale: φιμόω本义为给动物套上笼嘴，引申为强令沉默。命令语境中的“住口”简洁、有力，比“安静”更能传达原文的严厉。
- source_word: ἔξελθε
  choice: 出来
  rationale: 在赶逐污灵的语境中，表示从受辖制者里面出去；“出来”是自然直接的汉语命令。
- source_word: ἐξ αὐτοῦ
  choice: 从他里面
  rationale: ἐξ表示由内部向外的移动；“从他里面”明确保留污灵与受辖制者之间的区分。
theological_decisions:
- issue: 耶稣斥责的对象
  choice: 耶稣直接斥责污灵，而不是那个人。
  alternative: 把受污灵辖制的人理解为“斥责”的直接对象。
  rationale: 上文把污灵呈现为借那人说话的行动者，而“从他里面出来”又区分了受命令的污灵和那个人。译文保留这一叙事区分，不作额外的教义推演。
translation_notes:
  register: 采用现代、庄重而直接的口语化命令。“住口”保留原文突然而严厉的语气；未加脚注，因为中文若直译为“被套上笼嘴”既不自然，也可能遮蔽此处强令沉默的惯用意义。
