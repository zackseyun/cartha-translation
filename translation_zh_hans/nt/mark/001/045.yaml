revisions:
- from: 但那人出去后，就开始四处宣扬，广泛传开这件事，以致耶稣不能再公开进城，只好留在外面的荒僻之地；人们却从各处来到他那里。
  to: 但那人出去后，就开始到处宣扬，广传这消息，以致耶稣不能再公开进城，只好留在外面的荒僻之地；人们从各处来到他那里。
  rationale: 修订使“消息”对应 τὸν λόγον，避免把其内容限定为单一事件；删去“却”，不额外强化 καί 的连接关系。其余译法保留原文的叙事因果、地点对照及耶稣指称的清晰度。
