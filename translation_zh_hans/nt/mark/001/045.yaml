source:
  edition: SBLGNT
  text: ὁ δὲ ἐξελθὼν ἤρξατο κηρύσσειν πολλὰ καὶ διαφημίζειν τὸν λόγον, ὥστε μηκέτι αὐτὸν δύνασθαι φανερῶς εἰς πόλιν εἰσελθεῖν, ἀλλὰ ἔξω ⸀ἐπ’ ἐρήμοις τόποις ἦν· καὶ ἤρχοντο πρὸς αὐτὸν ⸀πάντοθεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/045.yaml
  text: But after he went out, he began to proclaim widely and to spread the message, so that Jesus could no longer enter a town openly, but stayed outside in deserted places; and people were coming to him from everywhere.
translation:
  language: zh_hans
  text: 但那人出去后，就开始到处宣扬，广传这消息，以致耶稣不能再公开进城，只好留在外面的荒僻之地；人们从各处来到他那里。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κηρύσσειν πολλὰ
  choice: 四处宣扬
  rationale: κηρύσσειν 表示公开宣告；πολλὰ 在此自然表达宣扬得很多、很广，而不是把“许多事”设为明确宾语。
- source_word: διαφημίζειν τὸν λόγον
  choice: 广泛传开这件事
  rationale: διαφημίζειν 指广为传播；τὸν λόγον 在语境中是关于医治之事的消息，用“这件事”保留其概括性，避免擅自限定为某句具体话语。
- source_word: φανερῶς
  choice: 公开
  rationale: 表示公开、显然地，与耶稣因消息传开而无法不受注意地进城的语境相符。
- source_word: ἐπ’ ἐρήμοις τόποις
  choice: 在外面的荒僻之地
  rationale: ἐρήμοις τόποις 指无人居住或人烟稀少之处；结合 ἔξω 译为“外面的荒僻之地”。
- source_word: πάντοθεν
  choice: 从各处
  rationale: 准确表达“从四面八方、各个地方而来”，措辞简洁自然。
theological_decisions:
- issue: αὐτόν 的指称
  choice: 明确译为“耶稣”
  alternative: 译为“他”
  rationale: 前一句的语法主语是被洁净的人，若连续使用“他”会在中文中造成误指；依叙事语境，不能公开进城者显然是耶稣。
- issue: ἦν 的表达
  choice: 译为“只好留在”
  alternative: 直译为“是在”
  rationale: “留在”符合持续处于荒僻地方的叙事含义；“只好”承接 ὥστε…μηκέτι…ἀλλά 所表达的结果关系，不引入额外教义判断。
- issue: ἤρχοντο 的未完成体
  choice: 译为“来到”
  alternative: 译为“不断来到”
  rationale: 中文叙事中的“人们……来到”已可表达群体持续前来；不额外强化频率，同时保留未完成时所描绘的进行性场景。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“但那人”清楚承接上一节被洁净的人；后半句改用“耶稣”消除代词歧义。保留原文由消息广传所导致的行动限制及“荒僻之地—从各处前来”的对照。
