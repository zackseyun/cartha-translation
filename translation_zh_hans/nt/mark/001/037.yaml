base_translation:
  language: en
  yaml_path: translation/nt/mark/001/037.yaml
  text: And they found him and said to him[a], “Everyone is looking for you.”
translation:
  language: zh_hans
  text: 他们找到耶稣，就对他说：“大家都在找你。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在找你”也可译作“在寻求你”。希腊文ζητοῦσίν可有“寻求”的意思，但在这里很可能是指人们正设法找到耶稣。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὗρον
  choice: 找到
  rationale: 不定过去时在此叙述寻找的成功结果；“找到”是现代汉语中最直接自然的表达。
- source_word: λέγουσιν
  choice: 就对他说
  rationale: 希腊文用历史现在时推进叙事；现代汉语不必机械保留时态，以“就对他说”自然承接前一动作，也体现马可叙事的紧凑感。
- source_word: ὅτι
  choice: ：“”
  rationale: ὅτι在此引出直接引语，用冒号和引号符合现代汉语书写习惯。
- source_word: Πάντες
  choice: 大家
  rationale: 这里指当时正在寻找耶稣的众人，并非无条件的绝对全称；“大家”比“所有人”更符合语境和自然口语。
- source_word: ζητοῦσίν σε
  choice: 都在找你
  rationale: ζητέω可译为“寻找”或“寻求”；结合上下文，此处主要指人们正设法找到耶稣，“在找你”清楚自然，同时脚注保留“寻求”的词义可能。
- source_word: καὶ … καὶ
  choice: ……，就……
  rationale: 两个καί连接连续动作。汉语用逗号和“就”呈现叙事推进，避免生硬重复“并且”。
- source_word: αὐτὸν / αὐτῷ / σε
  choice: 耶稣 / 他 / 你
  rationale: 首个αὐτόν按上下文明确为耶稣，以免汉语连续代词指向不清；其余代词依句法和直接引语自然译出。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“大家都在找你”保留原文的群体性表达，同时避免把πάντες误解为超出当时语境的绝对普世陈述。脚注标记置于整句引语之后。
