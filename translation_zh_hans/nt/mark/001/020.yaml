  text: καὶ ⸀εὐθὺς ἐκάλεσεν αὐτούς. καὶ ἀφέντες τὸν πατέρα αὐτῶν Ζεβεδαῖον ἐν τῷ πλοίῳ μετὰ τῶν μισθωτῶν ἀπῆλθον ὀπίσω αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/020.yaml
  text: And immediately he called them[a], and leaving their father Zebedee in the boat with the hired workers, they went after him.
translation:
  language: zh_hans
  text: 耶稣随即呼召他们。他们便把父亲西庇太和雇工们留在船上，跟着他[a]去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “跟着他”也可译作“跟在他后面”或“跟随他”。希腊语既可指实际走在某人后面，也可含有跟随他作门徒的意味。
    reason: 说明ὀπίσω αὐτοῦ兼具空间随行与门徒跟随的语义可能性，同时将脚注锚定在对应短语后。
lexical_decisions:
- source_word: εὐθὺς
  choice: 随即
  rationale: 保留马可叙事中特有的紧迫感和明确的时间推进，同时符合现代汉语表达。
- source_word: ἐκάλεσεν
  choice: 呼召
  rationale: 在门徒蒙召的语境中准确表达“叫他们来”的意思，既不弱化为单纯邀请，也不强化为强制命令。
- source_word: ἀφέντες
  choice: 留在
  rationale: 结合宾语和地点短语，译作“把……留在船上”自然地表达先于主要动作发生的伴随行动，并避免“抛弃”的负面含义。
- source_word: πατέρα αὐτῶν Ζεβεδαῖον
  choice: 父亲西庇太
  rationale: 按现代汉语亲属称谓和人名同位结构自然表达，所有关系由主语“他们”已清楚限定。
- source_word: πλοίῳ
  choice: 船
  rationale: 符合加利利捕鱼场景，不暗示大型海船。
- source_word: μισθωτῶν
  choice: 雇工们
  rationale: 准确表达受雇领薪的工人；“雇工”简洁自然，也不引入现代企业用语。
- source_word: ἀπῆλθον
  choice: 去了
  rationale: 与“跟着他”连用，自然表达他们离开原处而去；汉语无需另加“离去”，以免累赘。
- source_word: ὀπίσω αὐτοῦ
  choice: 跟着他
  rationale: 既可描写实际跟在耶稣后面行走，也能含蓄表达开始跟随他作门徒，保留原文双重意味。
theological_decisions:
- issue: ὀπίσω αὐτοῦ所含的门徒身份意味
  choice: 跟着他
  alternative: 跟在他后面；跟随他
  rationale: “跟着他”在现代汉语中可同时表示身体上的随行和关系上的跟随，不把经文仅限于空间移动，也不把隐含的门徒意义完全明说。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“随即”维持马可叙事的节奏；后半句用“把……留在船上，跟着他去了”保持动作顺序清楚流畅。
