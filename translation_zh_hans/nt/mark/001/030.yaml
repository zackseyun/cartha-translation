base_translation:
  language: en
  yaml_path: translation/nt/mark/001/030.yaml
  text: Simon’s mother-in-law was lying sick with a fever[b][a], and immediately they told him about her.
translation:
  language: zh_hans
  text: 西门的岳母正躺着，发着烧；他们立刻把她的事告诉了他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文这里用叙事现在时，直译可作“他们就对他说起她”；现代汉语通常不必用特殊时态形式表达这种生动的叙述方式。
    reason: 保留原文叙事现在时的信息，并提供较贴近形式的译法。
lexical_decisions:
- source_word: πενθερὰ Σίμωνος
  choice: 西门的岳母
  rationale: πενθερά是“岳母、婆母”这一亲属称谓；相对于西门，此处自然译作“岳母”。
- source_word: κατέκειτο
  choice: 躺着
  rationale: 未完成时表达持续状态；“躺着”保留其延续性，又不擅自加入“卧床不起”等较强含义。
- source_word: πυρέσσουσα
  choice: 正发着烧
  rationale: 该分词表示正在发烧；“正发着烧”是自然的现代汉语，也保留与“躺着”同时发生的状态。
- source_word: εὐθὺς
  choice: 立刻
  rationale: 准确传达行动的迅速，也保留马可叙事中反复出现的紧迫节奏。
- source_word: λέγουσιν αὐτῷ περὶ αὐτῆς
  choice: 他们把她的情况告诉了他
  rationale: περὶ αὐτῆς意为“关于她”；结合语境译作“把她的情况告诉了他”自然清楚，并保留代词“他”，不把原文未明说的名字加入正文。
- source_word: δὲ
  choice: 不单独译出
  rationale: δὲ在此是轻微的叙事连接词。现代汉语可借句序自然推进，无须机械加入“现在”或表示强转折的“但是”。
theological_decisions: []
