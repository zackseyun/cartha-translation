  text: And the whole city was gathered at the door[a].
translation:
  language: zh_hans
  text: 全城的人都聚集在门口[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“到门口”。希腊语介词也可较直译地表达方向，但本句语境描述的是众人聚集在房屋入口处。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν
  choice: 都聚集在
  rationale: ἦν与完成时被动分词ἐπισυνηγμένη构成迂回结构，描写当时已经聚集并处于聚集状态的场景；现代汉语以“聚集在”自然表达，不必机械译出系词。
- source_word: ὅλη ἡ πόλις
  choice: 全城的人
  rationale: 原文直译为“全城”，是生动的整体性概括；汉语补出“的人”，明确实际聚集的是居民，同时保留原文的概括力度。
- source_word: ἐπισυνηγμένη
  choice: 聚集
  rationale: 该词意为聚集到一起；“聚集”准确、自然，也不额外加入“拥挤”等原文未明说的含义。
- source_word: πρὸς τὴν θύραν
  choice: 在门口
  rationale: πρός接宾格在此静态场景中表示相对于门的位置；“在门口”是自然的现代汉语，并能表达众人聚在房屋入口处。
- source_word: θύραν
  choice: 门口
  rationale: θύρα本义为“门”，语境所指是房屋入口；汉语“门口”比单说“门”更自然地表示人群所在的位置。
