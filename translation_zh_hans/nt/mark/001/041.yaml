  text: ⸀καὶ ⸀ὀργισθεὶς ἐκτείνας τὴν χεῖρα ⸂αὐτοῦ ἥψατο⸃ καὶ λέγει αὐτῷ· Θέλω, καθαρίσθητι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/041.yaml
  text: And being angry[a], he stretched out his hand, touched him, and said to him, “I am willing; be cleansed.”
translation:
  language: zh_hans
  text: 耶稣动了怒[a]，就伸出手来摸他，对他说：“我愿意，你洁净吧！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“动了怜悯的心”。
    reason: textual_variant
lexical_decisions:
- source_word: ὀργισθεὶς
  choice: 动了怒
  rationale: 按SBLGNT所印希腊文本直译其基本含义，保留耶稣发怒这一不易解释的情感表达，不以异文或诠释性的“义愤”代替。
- source_word: ἐκτείνας τὴν χεῖρα
  choice: 伸出手来
  rationale: 自然表达连续动作，同时保留具体的身体动作。
- source_word: ἥψατο
  choice: 摸他
  rationale: 此处ἅπτομαι通常表示触摸；“摸他”清楚自然，也保留耶稣与麻风病人身体接触的重要性。
- source_word: λέγει αὐτῷ
  choice: 对他说
  rationale: 希腊文使用历史现在时；现代汉语叙事中按上下文自然译作过去发生的动作，无须额外标明时态。
- source_word: Θέλω
  choice: 我愿意
  rationale: 这里表达意愿和乐意回应，而非单纯将来意义；“我愿意”准确且庄重。
- source_word: καθαρίσθητι
  choice: 你洁净了吧
  rationale: 保留被动命令的语气，以及麻风得洁净所包含的身体与礼仪双重意味；“洁净”比单说“治好”更贴近原词。
theological_decisions:
- issue: 描述耶稣情绪的分词存在文本异文
  choice: 正文依SBLGNT的ὀργισθεὶς译为“动了怒”
  alternative: 有些抄本作“动了怜悯的心”
  rationale: 以所提供的原文版本为正文依据，同时用脚注保存影响耶稣情感描写的重要异文，不擅自调和或消除其中的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“动了怒”比“愤慨”更少加入对发怒原因的解释；句式用“就……对他说”自然串联动作。
