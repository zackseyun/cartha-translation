  text: καὶ ⸀εὐθὺς ἀναβαίνων ⸀ἐκ τοῦ ὕδατος εἶδεν σχιζομένους τοὺς οὐρανοὺς καὶ τὸ πνεῦμα ⸀ὡς περιστερὰν καταβαῖνον ⸀εἰς αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/010.yaml
  text: And immediately[a], as he was coming up out of the water[b], he saw the heavens being torn open and the Spirit descending like a dove upon him.
translation:
  language: zh_hans
  text: 他正从水里上来，立刻看见诸天被撕裂开[a]，圣灵仿佛鸽子一样降在他身上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“诸天被裂开”或“诸天被撕开”。原文动词比一般的“打开”更强烈，并以被动形式描写这一景象。
    reason: lexical_alternative
  - marker: b
    text: 或译“进入他里面”。希腊语εἰς可表示“进入”；但与圣灵的降下连用时，“降在他身上”是自然的理解。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: 立刻
  rationale: 保留马可叙事中特有的紧迫感，也符合现代汉语的自然表达。
- source_word: ἀναβαίνων ἐκ τοῦ ὕδατος
  choice: 正从水里上来时
  rationale: 用“正……时”表达现在分词与主句动作同时发生，并以“从水里”准确体现ἐκ的起点和离开之意。
- source_word: εἶδεν
  choice: 看见
  rationale: 直接表达简单过去时的感知动作，不额外加入原文没有的动作或强调。
- source_word: σχιζομένους τοὺς οὐρανούς
  choice: 诸天裂开
  rationale: “裂开”保留σχίζω强于一般“打开”的力度；“诸天”对应复数τοὺς οὐρανούς，并保留圣经叙事的庄重色彩。
- source_word: τὸ πνεῦμα
  choice: 那灵
  rationale: 定指性的“那”帮助表达冠词所标明的特定对象，同时没有把原文未明说的“圣”加入正文；结合上下文，所指可理解为上帝的灵。
- source_word: ὡς περιστερὰν
  choice: 仿佛鸽子
  rationale: 保留ὡς的比较作用，不断定所比较的是形态、动作方式还是两者兼有。
- source_word: καταβαῖνον
  choice: 降
  rationale: “降”简洁、庄重，并准确表达从上而下的动作。
- source_word: εἰς αὐτόν
  choice: 在他身上
  rationale: 与“降”搭配时，“降在他身上”是自然汉语，也符合此处圣灵临到耶稣的语境；脚注保留εἰς可能表示“进入”的词义。
theological_decisions:
- issue: τὸ πνεῦμα所指为何
  choice: 译作“那灵”，由上下文指向上帝的灵
  alternative: 译作“圣灵”
  rationale: 此处语境表明是上帝的灵，但希腊文只写τὸ πνεῦμα，并未在本节明写“圣”；正文因此避免过度明确化。
- issue: 鸽子比喻的着重点
  choice: 以“仿佛鸽子”保留未限定的比较
  alternative: 明确说那灵具有鸽子的形体，或仅以鸽子般的方式下降
  rationale: ὡς只建立比较，没有说明相似之处究竟是外形、下降方式或其他方面，译文不替原文作出裁定。
- issue: εἰς αὐτόν的方向含义
  choice: 正文译作“降在他身上”
  alternative: 译作“进入他里面”
  rationale: εἰς通常可表示进入，但与“降”连用且处于受洗场景时，“在他身上”更符合自然汉语和上下文；同时以脚注保留另一种真实可能。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“诸天”略带圣经语体，用来反映原文复数并避免把意象缩减为自然意义上的“天空”；“那灵”有意贴近原文的定指表达，避免在正文中补入本节未出现的“圣”字。
