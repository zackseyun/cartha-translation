  text: φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Ἑτοιμάσατε τὴν ὁδὸν κυρίου, εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/003.yaml
  text: 'A voice of one crying out in the wilderness: ‘Prepare the way of the Lord[b][a]; make his paths straight,’'
translation:
  language: zh_hans
  text: 有人在旷野呼喊：“预备主的道路[b][a]，修直他的路径。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或按以赛亚引文的另一种断句译作：“有声音呼喊：‘要在旷野预备主的道路……’”
    reason: alternative_reading
  - marker: b
    text: “主”译自希腊语κύριος；此处呼应以赛亚书40:3，其中希伯来文所指的是耶和华（YHWH）。
    reason: cross_reference
lexical_decisions:
- source_word: φωνὴ
  choice: 有声音
  rationale: φωναί在此引出呼喊的内容；现代汉语用“有声音”自然表达不定指，又不必补出原文未明说的“一个人”。
- source_word: βοῶντος
  choice: 呼喊
  rationale: 该属格分词依附于φωνὴ，表示发声者强有力地宣告；“呼喊”简洁保留了先知性传告的力度。
- source_word: ἐν τῇ ἐρήμῳ
  choice: 在旷野
  rationale: ἔρημος可指荒野或沙漠；“旷野”既符合马可福音中约翰活动的场景，也承接以赛亚引文的传统意象。
- source_word: Ἑτοιμάσατε
  choice: 预备
  rationale: 不定过去时命令语气复数要求听众采取明确行动；“预备”直接、庄重且为现代读者熟悉。
- source_word: τὴν ὁδὸν
  choice: 道路
  rationale: ὁδός兼有实际道路和比喻性道路之意；“道路”保留两层意象。
- source_word: κυρίου
  choice: 主的
  rationale: κύριος按希腊文本译作“主”；属格结构直译为“主的道路”，同时以脚注说明其以赛亚背景中的耶和华所指。
- source_word: εὐθείας
  choice: 直
  rationale: εὐθύς在此描述路径笔直；与“修”搭配为自然汉语，并避免误解为道德上的正直。
- source_word: ποιεῖτε
  choice: 修
  rationale: ποιεῖτε本义为“使成为”，与“直”组合可自然译为“修直”，既表达行动，也符合整治道路的意象。
- source_word: τὰς τρίβους αὐτοῦ
  choice: 他的路径
  rationale: τρίβος指小路、路径或道路，复数形式予以保留；αὐτοῦ译作“他的”，指向“主”。
theological_decisions:
- issue: 以赛亚引文中的κύριος如何译出
  choice: 主
  alternative: 耶和华
  rationale: 马可的希腊文本使用κύριος，正文据此译作“主”；但其引用的以赛亚书40:3希伯来文所指为YHWH，因此在脚注中保留这一互文背景，而不在正文中将希腊词直接改译为“耶和华”。
- issue: “在旷野”的句法归属
  choice: 连接“呼喊”
  alternative: 连接“预备主的道路”
  rationale: 按马可此处的希腊语词序和直接语境，最自然的是“在旷野呼喊”；但以赛亚引文也可按另一种标点理解为“在旷野预备……”，故以脚注保留该歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“有声音在旷野呼喊”保留原文简练的先知宣告语气；“修直他的路径”维持道路整治的具体图景及其比喻张力。脚注标记依用户所给英文正文的次序置为[b][a]，并确保两处标记均见于正文。
