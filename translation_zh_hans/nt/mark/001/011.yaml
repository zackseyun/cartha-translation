revisions:
- from: 又有声音从诸天传来[a]：“你是我的爱子；我喜悦你[b]。”
  to: 有声音从诸天传来[a]：“你是我的爱子；我因你而喜悦[b]。”
  rationale: 修订仅处理两个可安全改进之处：删去可能过度表达重复意味的“又”，并以“我因你而喜悦”更明确、自然地传达ἐν σοὶ εὐδόκησα。保留“诸天”“爱子”及脚注a，以维持原文复数、庄重语体和关键称谓。
