  text: καὶ φωνὴ ἐγένετο ἐκ τῶν οὐρανῶν· Σὺ εἶ ὁ υἱός μου ὁ ἀγαπητός, ἐν ⸀σοὶ εὐδόκησα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/011.yaml
  text: 'And a voice came from the heavens: “You are my beloved Son[b][a]; in you I am well pleased.”'
translation:
  language: zh_hans
  text: 有声音从诸天传来[a]：“你是我的爱子；我因你而喜悦[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“从天上”。希腊文“天”在这里是复数。
    reason: lexical_alternative
  - marker: b
    text: 或译“我以你为乐”或“我对你十分满意”。
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ φωνὴ ἐγένετο
  choice: 又有声音传来
  rationale: ἐγένετο在这里叙述一个事件发生；译为“有声音传来”符合现代汉语表达，也保留声音出现并传来的叙事力量。καί依上下文译作“又”。
- source_word: ἐκ τῶν οὐρανῶν
  choice: 从诸天
  rationale: 原文οὐρανῶν为复数。“诸天”自然、庄重，并保留希腊文的复数形式；常见的单数表达“从天上”列入脚注。
- source_word: Σὺ εἶ
  choice: 你是
  rationale: 明确保留第二人称代词所带出的直接称呼，不另加原文没有的强调副词。
- source_word: ὁ υἱός μου ὁ ἀγαπητός
  choice: 我的爱子
  rationale: “爱子”简洁地表达“我的儿子”和ἀγαπητός所含“蒙爱、亲爱”的意思，符合庄重而自然的现代汉语。
- source_word: ἐν σοὶ εὐδόκησα
  choice: 我喜悦你
  rationale: 这一表达在语境中宣告上帝对受话者的喜悦与认可。“我喜悦你”既保留ἐν σοὶ所指向的对象，又避免把不定过去时机械处理成仅属过去的状态；其他可能的汉语表达列入脚注。
theological_decisions:
- issue: 如何表达对耶稣的神圣宣告而不减弱其基督论分量
  choice: 我的爱子
  alternative: 我的儿子，我所爱的；我亲爱的儿子
  rationale: “爱子”同时保留儿子的身份与父的爱，不加入本节未明说的后期神学术语，也不把ἀγαπητός的含义缩减为单纯的情感描写。
- issue: 是否把οὐρανῶν的复数化为汉语惯用的单数
  choice: 从诸天
  alternative: 从天上
  rationale: 正文保留原文复数，以体现原文优先；较常见的单数译法放在脚注中，避免断言这里的复数具有原文未明确说明的特殊宇宙论含义。
- issue: 如何处理ἐν σοὶ εὐδόκησα的时态与介词表达
  choice: 我喜悦你
  alternative: 我以你为喜悦；我对你十分满意
  rationale: 希腊语不定过去时在这一宣告公式中可表达已然确立、在当下有效的喜悦或认可。正文不强行限定为仅仅过去的情形，也不把ἐν改写成过强的因果关系。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“诸天”略带经文庄严色彩，用来保留原文复数；“爱子”和“我喜悦你”简洁有力，适合直接的天上宣告。
