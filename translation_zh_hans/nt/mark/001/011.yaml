  - severity: medium
    issue: “我喜悦你”未充分呈现ἐν σοὶ的表达关系，脚注“我以你为喜悦”也不够自然。
    rationale: εὐδοκέω与ἐν加人称代词在此表达以该人为喜悦/因该人而喜悦。正文改为“我因你而喜悦”，既自然又保留该关系；脚注采用自然的替代表达。
  revised_text: 有声音从诸天传来[a]：“你是我的爱子；我因你而喜悦[b]。”
