  text: λέγων· ⸀Τί ἡμῖν καὶ σοί, Ἰησοῦ Ναζαρηνέ; ἦλθες ἀπολέσαι ἡμᾶς; οἶδά σε τίς εἶ, ὁ ἅγιος τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/024.yaml
  text: saying[a], “What have you to do with us[b], Jesus the Nazarene? Have you come to destroy us? I know who you are—the Holy One of God.”
translation:
  language: zh_hans
  text: 说：“我们跟你有什么相干[a]，拿撒勒人耶稣[b]？你来是要消灭我们吗？我知道你是谁——上帝的圣者。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们彼此有什么关系？”原文是表示疏离或敌对的习语。
    reason: lexical_alternative
  - marker: b
    text: 或译：“拿撒勒的耶稣。”原文直译为“拿撒勒人耶稣”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί ἡμῖν καὶ σοί
  choice: 我们跟你有什么相干
  rationale: 这是带有闪语色彩的希腊习语，字面为“我们与你有什么”，在此表达疏离和敌对。“我们跟你有什么相干”是自然的现代汉语，也保留了对抗语气。
- source_word: Ἰησοῦ Ναζαρηνέ
  choice: 拿撒勒人耶稣
  rationale: Ναζαρηνέ是呼格形式，指“拿撒勒人”。译作“拿撒勒人耶稣”比单纯的地名表达更贴近原文称谓。
- source_word: ἦλθες ἀπολέσαι ἡμᾶς
  choice: 你来是要消灭我们吗
  rationale: ἦλθες在问句中指带有当前意义的来到；ἀπολέσαι表示毁灭、消灭。此译文自然地表达目的关系，并保留第一人称复数“我们”。
- source_word: οἶδά σε τίς εἶ
  choice: 我知道你是谁
  rationale: 直接、自然地传达说话者对耶稣身份的辨认，不添加原文没有的解释。
- source_word: ὁ ἅγιος τοῦ θεοῦ
  choice: 上帝的圣者
  rationale: 保留定冠词短语的称号性质和属格关系；“圣者”庄重而易懂，不把这一称号扩展成更完整的教义陈述。
theological_decisions:
- issue: 污灵对耶稣的基督论称号
  choice: 上帝的圣者
  alternative: 上帝所立的圣者
  rationale: 原文只称耶稣为ὁ ἅγιος τοῦ θεοῦ，并未明确说明“所立”或其他关系，因此采用简洁的属格表达，保留其神学力度与关系上的含蓄。
- issue: 说话者使用复数“我们”
  choice: 保留“我们”
  alternative: 解释为“我们这些污灵”
  rationale: 原文由单数说话者使用复数代词，但没有说明复数具体包括谁；直译保留这一张力，不在正文中替读者作解释。
translation_notes:
  register: 采用现代、庄重而口语可懂的直接引语。“有什么相干”传达敌对疏离的习语力量；破折号突出随后揭示的身份称号。所有代词数和称号均按希腊原文保留，未解释复数“我们”的所指。
