source:
  edition: SBLGNT
  text: ⸀Καθὼς γέγραπται ἐν ⸂τῷ Ἠσαΐᾳ τῷ προφήτῃ⸃· ⸀Ἰδοὺ ἀποστέλλω τὸν ἄγγελόν μου πρὸ προσώπου σου, ὃς κατασκευάσει τὴν ὁδόν ⸀σου·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/002.yaml
  text: 'Just as it is written in Isaiah the prophet: ‘Behold[a], I send my messenger before your face[c][b], who will prepare your way.’'
translation:
  language: zh_hans
  text: 正如先知以赛亚的书上所记的[a]：“看哪，我差遣我的使者在你前面[c]，他要预备你的道路。”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“众先知”，而不是“先知以赛亚”。
    reason: textual_variant
  - marker: b
    text: 这段引文结合了《玛拉基书》3:1和《以赛亚书》40:3的措辞。
    reason: cross_reference
  - marker: c
    text: 也可译作“在你面前”；直译为“在你的脸面前”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Καθὼς
  choice: 正如
  rationale: 保留比较和对应的语气，并自然承接下文的经文引述。
- source_word: γέγραπται
  choice: 所记的
  rationale: 希腊语完成时被动式是引用圣经的惯用表达，强调文字已经写下并仍然有效；“所记的”符合现代汉语引经习惯。
- source_word: ἐν τῷ Ἠσαΐᾳ τῷ προφήτῃ
  choice: 先知以赛亚的书上
  rationale: 明确这是先知以赛亚著作中的记载，同时保留正文所指名的先知，不以复数“众先知”协调合成引文的问题。
- source_word: Ἰδοὺ
  choice: 看哪
  rationale: 保留先知性宣告中唤起注意的庄重语气；比口语化的“你看”更适合经文引述。
- source_word: ἀποστέλλω
  choice: 我差遣
  rationale: 直接反映希腊语现在时及宣告的即时感，不擅自改成单纯将来时。
- source_word: τὸν ἄγγελόν μου
  choice: 我的使者
  rationale: ἄγγελος本义可指传信者或使者；本段语境指预备道路的先行者，不应译成专指天上灵体的“天使”。
- source_word: πρὸ προσώπου σου
  choice: 走在你前面
  rationale: 该成语直译为“在你面前”，实际表达先行于某人；加入“走”使现代汉语完整自然，同时保留道路和先行的空间意象。
- source_word: κατασκευάσει
  choice: 要预备
  rationale: 准确表达“准备好、使就绪”的意思；“要”自然呈现此处将来时。
- source_word: τὴν ὁδόν σου
  choice: 你的道路
  rationale: 保留道路这一具体意象，也不排除其预备事工的比喻含义。
theological_decisions:
- issue: 正文只提先知以赛亚，但引文措辞结合了《玛拉基书》3:1和《以赛亚书》40:3。
  choice: 正文保留“先知以赛亚”，并以脚注说明合成引文。
  alternative: 按部分抄本译为“众先知”。
  rationale: SBLGNT正文为ἐν τῷ Ἠσαΐᾳ τῷ προφήτῃ。译文应忠实呈现这一读法，不在正文中替作者协调引文来源；抄本异文和合成引文情况分别在脚注交代。
- issue: πρὸ προσώπου σου既有字面身体意象，也构成表示“在你前面”的惯用语。
  choice: 正文译为“走在你前面”。
  alternative: 直译为“在你面前”。
  rationale: 正文采用自然现代汉语表达其先行含义，脚注保存较贴近字面的译法，避免完全抹去原文意象。
translation_notes:
  register: 采用现代、庄重而易懂的书面语。“看哪”保留先知性引文的郑重语域；其余措辞避免过度古雅。“走在你前面”使汉语句法自然，并与“预备道路”的连续意象相呼应。
