  text: Ὀψίας δὲ γενομένης, ὅτε ⸀ἔδυ ὁ ἥλιος, ἔφερον πρὸς αὐτὸν πάντας τοὺς κακῶς ἔχοντας καὶ τοὺς δαιμονιζομένους·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/032.yaml
  text: When evening came[a], when the sun had set[d][c][b], they brought to him all who were sick and those who were demon-possessed.
translation:
  language: zh_hans
  text: 到了傍晚，太阳落山时，人们把所有患病的人和被鬼附的人陆续带到他那里。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: 到了傍晚
  rationale: 这是表示时间转换的属格独立结构；“到了傍晚”自然、简洁，并保留叙事推进。
- source_word: ὅτε ἔδυ ὁ ἥλιος
  choice: 太阳落山的时候
  rationale: ὅτε通常表示“当……的时候”；ἔδυ是简单过去时，直译为“落山”，不额外加入原文没有明说的“之后”。
- source_word: ἔφερον
  choice: 人们不断把……带到
  rationale: 未完成过去时描绘持续或反复发生的行动；“不断”体现其叙事体意义。希腊文主语未明说，汉语用泛指的“人们”使句子自然。
- source_word: πρὸς αὐτὸν
  choice: 到他那里
  rationale: πρός加宾格表示朝向某人；保留代词“他”，不把原文代词展开为“耶稣”。
- source_word: πάντας τοὺς κακῶς ἔχοντας
  choice: 一切患病的
  rationale: κακῶς ἔχειν是指身体状况不好或患病的惯用语；“一切患病的”保留πάντας的总括意义，也与下一个名词化分词保持平行。
- source_word: τοὺς δαιμονιζομένους
  choice: 被鬼附的人
  rationale: 该被动分词指受到鬼灵支配的人。“被鬼附”是现代汉语圣经语境中清楚而自然的表达，既不把它化约为疾病，也不超出原文建立更细致的鬼魔论。
theological_decisions:
- issue: 如何翻译δαιμονιζομένους，既保留真实的鬼灵活动，又不作过度界定
  choice: 被鬼附的人
  alternative: 受鬼压制的人；被鬼缠扰的人
  rationale: “被鬼附”保留被动分词所表达的受鬼灵影响或支配的强度；“受鬼压制”可能减弱其语义，而“缠扰”也可能显得较轻。原文并未在本节进一步说明这种状态的机制。
- issue: ἔφερον的未完成过去时体
  choice: 人们不断把……带到
  alternative: 人们把……带到
  rationale: 加入“不断”体现持续或反复的行动，使读者看见人群陆续前来的场景，同时不改变事件本身。
- issue: 傍晚与日落两个时间表达之间的关系
  choice: 到了傍晚，太阳落山的时候
  alternative: 到了傍晚，太阳落山以后
  rationale: 原文用ὅτε表达“当……时”，两个短语并列而略有重复。译文保留这种重复和时间关系，不把它解释成明确的先后关系；这也避免把安息日结束等背景推论写进正文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“患病的”和“被鬼附的人”形成平行结构；不添加安息日背景说明，也不把两类人混为一类。
