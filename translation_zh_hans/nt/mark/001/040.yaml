  text: Καὶ ἔρχεται πρὸς αὐτὸν λεπρὸς παρακαλῶν αὐτὸν καὶ ⸀γονυπετῶν λέγων αὐτῷ ὅτι Ἐὰν θέλῃς δύνασαί με καθαρίσαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/040.yaml
  text: And a man with leprosy comes to him[a], pleading with him and kneeling, and saying to him, “If you are willing[d][c][b], you are able to make me clean.”
translation:
  language: zh_hans
  text: 有一个患麻风病的人来到耶稣跟前[a]，恳求他，又跪下，对他说：“你若愿意，就能使我洁净[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“有一个麻风病人来到他跟前”。“麻风病”所译的希腊词可泛指多种严重皮肤病，不一定等同于现代医学所说的汉森病。
    reason: lexical_alternative
  - marker: b
    text: 或译：“洁净我。”这里的“洁净”既可涉及身体恢复，也可涉及从礼仪上的不洁中恢复。
    reason: lexical_alternative
lexical_decisions:
- source_word: λεπρὸς
  choice: 一个患麻风病的人
  rationale: 希腊文为形容词名词化，指患有麻风或严重皮肤病的人。采用以人为先的现代汉语表达，同时保留传统语境中的“麻风病”称谓。
- source_word: παρακαλῶν
  choice: 恳求他
  rationale: 此处表示迫切地请求、央求；“恳求”自然庄重，也不超出原文所表达的迫切程度。
- source_word: γονυπετῶν
  choice: 跪下
  rationale: 准确表达屈膝跪下的动作；不额外加入原文未明说的敬拜含义。
- source_word: Ἐὰν θέλῃς
  choice: 你若愿意
  rationale: θέλω在此指意愿，不是将来时意义；这一译法保留条件式请求。
- source_word: δύνασαί
  choice: 就能
  rationale: 直接表达能力或权能，符合自然现代汉语，并与前面的条件句顺畅衔接。
- source_word: καθαρίσαι
  choice: 使我洁净
  rationale: 保留καθαρίζω兼有身体复原与礼仪上除去不洁的语义，不窄化为单纯“医治”。
- source_word: ἔρχεται
  choice: 来到
  rationale: 希腊文使用历史现在时以增强叙事现场感；现代汉语无须机械标示时态，“来到”自然承载该叙事动作。
theological_decisions:
- issue: 麻风病语境中“洁净”的性质
  choice: 使我洁净
  alternative: 治好我
  rationale: 原文使用“洁净”而非通常的“医治”动词，可能同时涉及身体恢复和礼仪身份的恢复，因此不将含义缩减为纯粹的疾病痊愈。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“来到耶稣跟前”将代词所指明示出来，避免单节引用时含混；参与式动作以“恳求他，又跪下，对他说”自然串联。保留“洁净”这一关键语义，不以“治好”消解原文的双重含义。
