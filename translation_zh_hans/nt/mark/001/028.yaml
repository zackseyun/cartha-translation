  text: ⸂καὶ ἐξῆλθεν⸃ ἡ ἀκοὴ αὐτοῦ εὐθὺς ⸀πανταχοῦ εἰς ὅλην τὴν περίχωρον τῆς Γαλιλαίας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/028.yaml
  text: And the news about him went out at once everywhere into the whole surrounding region of Galilee[a][b].
translation:
  language: zh_hans
  text: 关于他的消息[a]立刻传开，传到加利利周围整个地区的各处[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “消息”也可译作“传闻”或“名声”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“立刻传到各处，遍及加利利周围整个地区。”
    reason: previous_rendering
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: 传开
  rationale: 该动词本义为“出去”。这里的主语是消息，现代汉语用“传开”自然表达消息向外传播，同时保留其动态意味。
- source_word: ἀκοὴ
  choice: 消息
  rationale: 此处指人们所听见的、关于耶稣的报道。“消息”符合叙事语境；“名声”会更强调声望或知名度，解释性较强。
- source_word: αὐτοῦ
  choice: 关于他
  rationale: 这里的属格说明消息的内容或对象，以“关于他”表达比直译为“他的”更清楚。
- source_word: εὐθὺς
  choice: 立刻
  rationale: 准确表达马可常用的即时性用语，简洁而符合现代书面汉语。
- source_word: πανταχοῦ
  choice: 各处
  rationale: 保留“到处、各处”的广泛范围，并与后面的地域短语自然结合。
- source_word: περίχωρον
  choice: 周围整个地区
  rationale: περίχωρος指周围地区或邻近区域；此译法保留地理关系，又不擅自限定为乡村。
- source_word: εἰς ὅλην τὴν περίχωρον τῆς Γαλιλαίας
  choice: 传到加利利周围整个地区
  rationale: “传到”体现εἰς所带的方向和扩展意味，“整个”对应ὅλην；句末再以“各处”承接πανταχοῦ，使中文自然且不遗漏原文的范围强调。
theological_decisions:
- issue: ἀκοὴ αὐτοῦ所指的是报道还是名声
  choice: 关于他的消息
  alternative: 他的名声
  rationale: 上下文着重描述人们听见有关耶稣之事后，消息迅速传播。“名声”虽在词义范围内，却更突出声望，可能加入原文未必要求的评价意味。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“传开”避免生硬直译“出去”；同时以“传到……各处”保留原文εἰς与πανταχοῦ共同形成的方向和广度。脚注标记均置于正文相应位置。
