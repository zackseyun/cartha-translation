  text: Καὶ εὐθὺς τὸ πνεῦμα αὐτὸν ἐκβάλλει εἰς τὴν ἔρημον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/012.yaml
  text: And immediately the Spirit drives him out into the wilderness[a].
translation:
  language: zh_hans
  text: 圣灵随即把他赶到旷野去。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“把他驱到旷野去”或“派他到旷野去”。这里的希腊语动词语气强烈；马可常用同一个动词表示“赶出”污灵。
    reason: 说明ἐκβάλλει可有的替代译法，并保留其强烈力度及其在马可福音中的用词关联。
lexical_decisions:
- source_word: Καὶ
  choice: （不单独译出）
  rationale: 此处καί承接上文并推进叙事；现代汉语用“随即”自然衔接即可，若另加“并且”会显得累赘。
- source_word: εὐθὺς
  choice: 随即
  rationale: 保留马可叙事迅速、紧迫的节奏，同时比“立刻”更适合庄重而自然的叙事语体。
- source_word: τὸ πνεῦμα
  choice: 圣灵
  rationale: 定冠词所指的是1:10刚提到的那灵。汉语单说“灵”容易含混，因此依上下文明确译作“圣灵”，并未增加新的所指。
- source_word: αὐτὸν
  choice: 他
  rationale: 直接宾语，指耶稣；按原文保留代词，不在正文中重复其名。
- source_word: ἐκβάλλει
  choice: 把……催到……去
  rationale: “催”保留ἐκβάλλω强烈推动的力度，又避免“赶走”在现代汉语中常有排斥、厌弃或逐离某处的额外意味。脚注列出更强硬和较温和的可能译法，以呈现词义张力。
- source_word: εἰς τὴν ἔρημον
  choice: 到旷野去
  rationale: εἰς表示朝向并进入；“旷野”自然表达无人居住的荒僻之地，也保留其圣经语境中的联想，而不把场景限定为沙漠。
theological_decisions:
- issue: 圣灵对耶稣行动的推动力度
  choice: 译作“把他催到旷野去”
  alternative: “领他到旷野去”；“把他赶到旷野去”；“差他到旷野去”
  rationale: ἐκβάλλει的力度明显强于“领”，不宜为迁就其他福音书的措辞而弱化；但“赶”在汉语中容易暗示厌弃或驱逐。正文用“催”保留神主动而有力的推动，脚注则保存原词可有的更强烈表达，不消解其中的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“随即”体现马可快速推进的叙事风格；“催到”在自然汉语与原文强烈力度之间求取平衡。脚注标记[a]已置于正文对应位置。
