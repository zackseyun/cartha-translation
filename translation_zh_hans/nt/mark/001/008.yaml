  text: ⸀ἐγὼ ἐβάπτισα ⸀ὑμᾶς ὕδατι, αὐτὸς δὲ βαπτίσει ὑμᾶς ⸀ἐν πνεύματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/008.yaml
  text: I baptized you with water[a], but he will baptize you with the Holy Spirit.
translation:
  language: zh_hans
  text: 我用水给你们施洗[a]，但他要用圣灵给你们施洗。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在水里……在圣灵里。”希腊文在这两处的表达可理解为所用的媒介，也可理解为所处的范围。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ
  choice: 我
  rationale: 保留显式主语，以体现与后文“他”的强调性对比。
- source_word: ἐβάπτισα
  choice: 施洗
  rationale: 这是现代汉语圣经语境中对 βαπτίζω 自然且通行的表达，既保留礼仪含义，也不把词义限于具体施行方式。希腊语不定过去时在此概括约翰已经开展的事工，汉语用无时态标记的“施洗”自然表达。
- source_word: ὑμᾶς
  choice: 你们
  rationale: 明确保留希腊语第二人称复数。
- source_word: ὕδατι
  choice: 用水
  rationale: 无介词与格可表达工具或媒介；“用水”在现代汉语中自然，并与后半句形成平行。
- source_word: αὐτὸς
  choice: 他
  rationale: 以主语“他”承接指向那位将要来的，并借“但”及平行句式体现与“我”的对比；译作“他自己”会显得过度强调。
- source_word: δὲ
  choice: 但
  rationale: 此处连接约翰的水洗与那位将要来者的圣灵之洗，具有清楚的对比作用。
- source_word: βαπτίσει
  choice: 要……施洗
  rationale: “要”自然表达将来意义，并与前面的“施洗”保持词汇连续。
- source_word: ἐν
  choice: 用
  rationale: ἐν 加与格在这里可指媒介，也可指范围；正文用“用”较自然，并与“用水”平行，同时以脚注保留“在圣灵里”的可能译法。
- source_word: πνεύματι ἁγίῳ
  choice: 圣灵
  rationale: 在马可福音的语境中，此短语最自然地指向上帝的圣灵；现代汉语通常不加冠词式成分。
theological_decisions:
- issue: πνεύματι ἁγίῳ 是指上帝的圣灵，还是一种非人格性的神圣能力
  choice: 圣灵
  alternative: 神圣的灵；一种圣洁的灵
  rationale: 约翰把自己的水洗与更强者将施行的洗相对照；结合马可福音上下文，“圣灵”最自然地指上帝的圣灵，但译文不进一步展开其作用方式。
- issue: ἐν πνεύματι ἁγίῳ 中 ἐν 的表达
  choice: 用圣灵
  alternative: 在圣灵里
  rationale: 正文采用自然的工具或媒介表达，并保持与“用水”的句法平行；由于 ἐν 也可表达范围或领域，脚注保留另一译法，避免消除原文的解释张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我……但他……”保留原文的人称对比；两个“给你们施洗”形成清楚的平行结构。脚注同时说明两处短语的译法可能性，使正文与原文句法对应得更完整。
