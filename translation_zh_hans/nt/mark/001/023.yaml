  yaml_path: translation/nt/mark/001/023.yaml
  text: And immediately there was in their synagogue a man with an unclean spirit[a], and he cried out[b],
translation:
  language: zh_hans
  text: 随即，他们的会堂里有一个有污灵的人[a][b]，他大声喊叫：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“在污灵里”；也可译作“有污灵的人”。
    reason: lexical_alternative
  - marker: b
    text: “被污灵附身”是有些译本采用的解释性译法；希腊原文没有直接使用“附身”一词。
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθὺς
  choice: 就在那时
  rationale: 承接上一节的场景，表达事情随即发生，并保持马可叙事推进迅速的特点；比生硬的“立即”更符合现代汉语叙事。
- source_word: ἦν
  choice: 有
  rationale: 这里是存在用法，汉语以“有”自然表达某人在该场所出现或存在。
- source_word: συναγωγῇ αὐτῶν
  choice: 他们的会堂
  rationale: 保留 αὐτῶν 的“他们”，并按一世纪犹太语境将 συναγωγή 译为“会堂”。
- source_word: ἄνθρωπος
  choice: 一个……的人
  rationale: 指叙事中的一个具体人物；汉语用“一个……的人”自然，也不必另行强化性别，因为上下文没有依赖其男性身份。
- source_word: ἐν πνεύματι ἀκαθάρτῳ
  choice: 被污灵缠着
  rationale: 希腊文直译为“在污灵里”，中文若照字面翻译不自然；“被污灵缠着”表达人与污灵之间受制约的关联，同时避免采用解释性更强的“被污灵附身”。
- source_word: ἀκαθάρτῳ
  choice: 污
  rationale: “污灵”简洁而庄重，保留 ἀκάθαρτος 所含的不洁、污秽意味，也符合福音书语境。
- source_word: ἀνέκραξεν
  choice: 喊叫起来
  rationale: 该动词表示大声呼喊；“喊叫起来”既体现声量，也自然引出下一节所记的喊话内容。
theological_decisions:
- issue: ἐν πνεύματι ἀκαθάρτῳ 所表达的人与污灵的关系
  choice: 被污灵缠着
  alternative: 在污灵里；被污灵附身
  rationale: 原文使用介词 ἐν，没有直接采用表示“附身”的专门措辞。“被污灵缠着”在现代汉语中较清楚地传达异常灵界辖制，却不把关系精确化为原文没有明说的附身模式；脚注保留其形式上的歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“会堂”“污灵”保留经文语境中的宗教含义；句末用冒号承接下一节的直接引语。所有脚注标记均置于正文相应位置。
