  text: καὶ ⸀ἦν ἐν τῇ ἐρήμῳ ⸂τεσσεράκοντα ἡμέρας⸃ πειραζόμενος ὑπὸ τοῦ Σατανᾶ, καὶ ἦν μετὰ τῶν θηρίων, καὶ οἱ ἄγγελοι διηκόνουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/013.yaml
  text: And he was in the wilderness forty days[a], being tempted by Satan; and he was with the wild animals, and the angels were ministering to him.
translation:
  language: zh_hans
  text: 他在旷野四十天，受撒但的试探[a]；他与野兽同在，天使服侍他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“受撒但考验。”希腊文动词既可指“试探”，也可指“考验”；本处以撒但为施事者，译作“试探”更合适。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρήμῳ
  choice: 旷野
  rationale: “旷野”是福音书叙事中自然且常用的译法，既可指荒无人烟之地，也保留以色列在旷野受考验的经文背景，而不误导为特指沙漠。
- source_word: τεσσεράκοντα ἡμέρας
  choice: 四十天
  rationale: 直接表达持续时间，并让“四十”在圣经中的关联自然呈现，不在正文中加以解释。
- source_word: πειραζόμενος
  choice: 受撒但试探[a]
  rationale: πειράζω既可表示“试探”，也可表示“考验”。本处明确以撒但为施事者，“试探”较符合其敌对意味；脚注保留“考验”这一真实的词义可能。
- source_word: ὑπὸ τοῦ Σατανᾶ
  choice: 受撒但
  rationale: Σατανᾶς在此指具有位格的超自然敌对者，采用现代中文圣经语境中通行的音译“撒但”。
- source_word: μετὰ τῶν θηρίων
  choice: 与野兽同在
  rationale: 贴近μετά与θῆρες的表达，保留马可简洁且未说明彼此关系的叙述，不擅自补入威胁或和谐之意。
- source_word: ἄγγελοι
  choice: 天使们
  rationale: 上下文涉及撒但与超自然服侍，因此指天上的使者，而非普通人间信使；“们”自然体现希腊文复数。
- source_word: διηκόνουν αὐτῷ
  choice: 伺候他
  rationale: διακονέω表示为人服务、照料；“伺候”在现代中文中清楚自然，并保留未完成时所描写的持续服侍情景。
- source_word: καὶ ἦν ... καὶ ἦν ... καὶ
  choice: 他在……；他与……，天使们……
  rationale: 以并列分句和分号保留马可叙述的连续推进，同时避免机械重复“并且”所造成的不自然中文。
theological_decisions:
- issue: πειραζόμενος在撒但作施事者时的语义
  choice: 受撒但试探
  alternative: 受撒但考验
  rationale: 该动词兼有“试探”和“考验”的语义。撒但明确作为施事者，使敌意引诱的“试探”更为合适；但原词并不排除事件构成考验，故在脚注中保存另一译法。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“旷野”“撒但”“天使”沿用熟悉的圣经用语；整体保持马可简短、并列的叙事节奏。
