  yaml_path: translation/nt/mark/001/021.yaml
  text: And they went into Capernaum, and immediately on the Sabbath he began teaching in the synagogue.
translation:
  language: zh_hans
  text: 他们进了[a]迦百农。在安息日[b]，他随即在会堂里教导[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们进入迦百农。”马可常用现在时生动地叙述过去发生的事。
    reason: lexical_alternative
  - marker: b
    text: 希腊语原文“安息日”为复数形式；这是一种习惯用法，意为“在安息日”。
    reason: lexical_alternative
  - marker: c
    text: 也可译为“正在教导”或“开始教导”；希腊语未完成过去时可强调动作持续进行，在本语境中也可能强调动作开始。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσπορεύονται
  choice: 进了
  rationale: 这是马可叙事中常见的历史现在时；现代汉语通常用完成体叙述过去事件。“进了”既保留进入某地的方向含义，也使叙事自然。
- source_word: Καφαρναούμ
  choice: 迦百农
  rationale: 采用现代中文圣经传统中通行且易于辨认的地名译法。
- source_word: εὐθύς
  choice: 随即
  rationale: 表达动作紧接发生，保留马可叙事的明快和紧迫感，同时比“立刻”略显庄重自然。
- source_word: τοῖς σάββασιν
  choice: 在安息日
  rationale: 原文形式为复数，但在此是常见的时间习语，语境中自然理解为“在安息日”。
- source_word: ἐδίδασκεν
  choice: 教导人
  rationale: 希腊语未完成过去时可突出持续进行，也可能在语境中带有开始行动的意味。正文采用汉语中体貌相对中性的“教导人”，不强行限定为“开始教导”或“正在教导”，并以脚注保留歧义。
- source_word: συναγωγήν
  choice: 会堂
  rationale: 在一世纪犹太背景中指当地犹太会堂，而不是泛指一般集会；“会堂”是准确且通行的现代中文表达。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事语体。“他们”承接上文同行者，“他”按上下文指耶稣；不在正文重复姓名。句法尽量贴近原文的两个并列叙事动作，同时按现代汉语分成两句以便阅读。
