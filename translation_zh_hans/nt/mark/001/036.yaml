  text: And Simon and those with him pursued him,[a]
translation:
  language: zh_hans
  text: 西门和同他在一起的人去追赶耶稣。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“西门和同他在一起的人急切地寻找耶稣。”原文动词主要指追赶、追逐；在此上下文中也可理解为急切地寻找。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεδίωξεν
  choice: 追去找
  rationale: 该动词带有紧追、追寻的较强语气；“追去找”在现代汉语叙事中自然，也兼顾行动的急切和寻找的目的。
- source_word: αὐτὸν
  choice: 耶稣
  rationale: 原文是“他”，所指为上文的耶稣。汉语连续使用多个“他”容易造成西门与耶稣之间的指代含混，因此明确译出姓名。
- source_word: Σίμων
  choice: 西门
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: οἱ μετ’ αὐτοῦ
  choice: 跟他在一起的人
  rationale: 贴近原文“与他同在的人”，不擅自限定为门徒、同伴或其他特定身份。
- source_word: καὶ
  choice: 就
  rationale: 原文以并列连词承接前文；汉语用“就”自然推进叙事，同时不增加明显的时间间隔。
