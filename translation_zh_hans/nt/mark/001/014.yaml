base_translation:
  language: en
  yaml_path: translation/nt/mark/001/014.yaml
  text: And after John was handed over[a], Jesus came into Galilee[c][b], proclaiming the good news of God.
translation:
  language: zh_hans
  text: 约翰被交出以后[a]，耶稣来到加利利，宣讲上帝的福音[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“约翰被捕以后”。希腊原文较直译为“约翰被交出以后”；这一用语也呼应马可后来叙述耶稣受难时所用的“交出”。
    reason: lexical_alternative
  - marker: b
    text: “福音”也可译作“好消息”。
    reason: lexical_alternative
  - marker: c
    text: “上帝的”可能指这福音来自上帝、属于上帝，或以上帝为内容和中心。
    reason: alternative_reading
lexical_decisions:
- source_word: μετὰ τὸ παραδοθῆναι
  choice: 被交出去以后
  rationale: μετά与带冠词的不定式构成时间表达，意为“……以后”。παραδίδωμι表示把人交出、交在他人权下；译作“被交出去”既保留其较宽的含义，也保留它与马可后来叙述耶稣受难时用语的呼应。
- source_word: Ἰωάννην
  choice: 约翰
  rationale: 采用现代中文圣经传统中通行且易于辨认的人名译法。
- source_word: ἦλθεν
  choice: 来到
  rationale: ἔρχομαι在此表示来到某地；“来到”自然表达叙事中的移动，不把意义收窄为“抵达”。
- source_word: εἰς τὴν Γαλιλαίαν
  choice: 来到加利利
  rationale: εἰς表达朝向并进入某地的移动。中文“来到加利利”自然地保留这一方向性，无须生硬地译成“进入加利利”。
- source_word: κηρύσσων
  choice: 宣讲
  rationale: κηρύσσω指像传令者一样公开宣告。“宣讲”既体现公开传扬，也符合现代中文庄重而易懂的叙事语体。
- source_word: εὐαγγέλιον
  choice: 福音
  rationale: εὐαγγέλιον意为好消息、佳音。“福音”是现代中文中简洁而通行的对应词，并以脚注注明更透明的译法“好消息”。
- source_word: τοῦ θεοῦ
  choice: 上帝的
  rationale: 希腊文属格本身可以表达这福音来自上帝、属于上帝，或以上帝为内容和中心。“上帝的”保留原文的宽广含义，不在正文中限定为其中一种。
theological_decisions:
- issue: παραδοθῆναι与马可福音中受难叙事用语的联系
  choice: 被交出去
  alternative: 被捕
  rationale: 上下文所指包括约翰遭拘捕，但原词更宽泛，并在马可福音后文用于耶稣被交出。正文保留这一叙事呼应，脚注同时说明按情境可译作“被捕”。
- issue: τὸ εὐαγγέλιον τοῦ θεοῦ中属格τοῦ θεοῦ的含义
  choice: 上帝的福音
  alternative: 来自上帝的福音／关于上帝的福音
  rationale: 原文属格可能同时包含来源、归属和内容等关联。采用中文属格结构保留这种未被限定的丰富性，不替原文排除合理理解。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准普通话。“被交出去”略带非日常色彩，是为保留原词及其在全书中的呼应；脚注提供更符合具体情境的“被捕”。“宣讲”体现公开宣告，比单纯的“讲道”更宽泛。
