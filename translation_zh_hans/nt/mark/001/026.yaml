  text: καὶ σπαράξαν αὐτὸν τὸ πνεῦμα τὸ ἀκάθαρτον καὶ ⸀φωνῆσαν φωνῇ μεγάλῃ ἐξῆλθεν ἐξ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/026.yaml
  text: And the unclean spirit[a], after convulsing him and crying out with a loud voice[b], came out of him.
translation:
  language: zh_hans
  text: 污灵使那人抽搐[a]，又大声喊叫[b]，就从他身上出来了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“使那人剧烈抽动”。
    reason: 词义范围包括痉挛、抽动；正文采用较自然且不过度强化的“抽搐”。
  - marker: b
    text: 直译“用洪亮的声音喊叫”。
    reason: 希腊文直说“以大的声音”；正文按现代汉语习惯译为“大声喊叫”。
lexical_decisions:
- source_word: σπαράξαν
  choice: 使那人抽搐
  rationale: 该不定过去时分词以污灵为施事者、以那人为受事者，描写污灵离开前使人身体痉挛或抽动。“使那人抽搐”在现代汉语中自然清楚，也避免将词义过度具体化为撕裂伤害。
- source_word: τὸ πνεῦμα τὸ ἀκάθαρτον
  choice: 污灵
  rationale: “污灵”是简洁、通行的福音书用语，保留ἀκάθαρτος所含的不洁意味，并维持该灵作为行动主体的位格性。
- source_word: φωνῆσαν
  choice: 大声喊叫
  rationale: 该分词表示污灵在出来前发声喊叫；“喊叫”保留强烈的发声动作，而不额外规定其情绪。
- source_word: φωνῇ μεγάλῃ
  choice: 大声
  rationale: 此与格短语表示发声的方式或音量；“大声”是现代汉语最自然的表达，并准确传达μεγάλῃ在此处所指的响亮。
- source_word: ἐξῆλθεν ἐξ αὐτοῦ
  choice: 就从他身上出来了
  rationale: 保留驱逐污灵叙事中的空间性表达；“就”自然呈现前述动作与主要动词之间的先后推进。
- source_word: καὶ ... καὶ
  choice: 又……就……
  rationale: 按现代汉语叙事习惯处理希腊文的并列连接，既保留动作连续推进，也避免生硬重复“并且”。
theological_decisions:
- issue: 附身者的性质
  choice: 将“污灵”译为具有行动能力的主体
  alternative: 理解为非位格化的邪恶力量
  rationale: 马可的叙事明确把使人抽搐、喊叫并离开等动作归于污灵。译文保留这种主体性，但不添加经文本身未说明的教义细节。
- issue: 两个分词与“出来”的时间关系
  choice: 译作离开前发生的一连串动作
  alternative: 将喊叫理解为与离开完全同时发生
  rationale: 两个不定过去时分词置于主要动词之前，适合表达先行或伴随的动作；汉语以“又……就……”呈现紧密顺序，同时不把时间间隔说得过细。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“那人”明确αὐτόν所指，避免连续使用“他”造成污灵与被附之人的指代混淆；整体保留马可叙事简洁而迅速的节奏。
