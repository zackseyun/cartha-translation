  naturalness: “污灵使那人抽搐，又大声喊叫，就从他身上出来了”在现代标准汉语中清楚、流畅，且“那人”有效避免了“他”可能同时指污灵或被附者的歧义。语体简洁庄重，适合福音书叙事。
