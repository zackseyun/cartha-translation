  text: καὶ προσελθὼν ἤγειρεν αὐτὴν κρατήσας τῆς ⸀χειρός· καὶ ἀφῆκεν αὐτὴν ὁ ⸀πυρετός, καὶ διηκόνει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/031.yaml
  text: And coming near[a], he raised her up, taking her by the hand; and the fever left her, and she served them.
translation:
  language: zh_hans
  text: 耶稣走上前去，握住她的手，扶她起来；热病就离开了她，她便服事他们[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“她便开始服事他们”。希腊语的未完成时可以只是描述她在服事；上下文也支持把这理解为她痊愈后随即开始服事他们。
    reason: 说明动词时态可能表达持续动作，也可能在本语境中带有起始意味。
lexical_decisions:
- source_word: προσελθὼν
  choice: 走上前去
  rationale: 以自然的现代汉语表达耶稣先走近她，再采取行动的分词次序，不额外补入原文未明说的对象。
- source_word: ἤγειρεν αὐτὴν
  choice: 使她起来
  rationale: 保留ἐγείρω“使起来”的基本动词力度，既符合病人从卧处起来的语境，也不把可能的“起来”用语呼应明确解释为复活。
- source_word: κρατήσας τῆς χειρός
  choice: 拉着她的手
  rationale: κρατέω表示抓住、握住；此处属格结构表达“拉着她的手”。译文自然呈现这是使她起来时伴随的动作。
- source_word: ἀφῆκεν αὐτὴν
  choice: 离开了她
  rationale: 保留疾病“离开”患者的原文表达，同时在现代汉语中清楚可懂。
- source_word: ὁ πυρετός
  choice: 热病
  rationale: “热病”简洁表达发热性疾病，并保留定冠词所指的那场已知病症；比单说“发烧”略显庄重，适合经文语体。
- source_word: διηκόνει
  choice: 服事
  rationale: διακονέω在此指为在场的人提供照料或饮食等服务。“服事”能涵盖其意义，又不把具体服务内容补入正文；未完成时本身不必强制译为“开始”。
- source_word: αὐτοῖς
  choice: 他们
  rationale: 复数代词指耶稣和同在的人，不应缩窄为只服事耶稣一人。
theological_decisions:
- issue: ἐγείρω可能与“复活／起来”用语形成呼应
  choice: 使她起来
  alternative: 扶她起来
  rationale: “使她起来”保留马可所用动词的措辞力度及潜在呼应，但上下文仍清楚表明这里是医治，并未将其明说为复活。
- issue: διηκόνει的未完成时是否表达动作开始
  choice: 她便服事他们
  alternative: 她便开始服事他们
  rationale: 希腊语未完成时可描述持续进行的服事；上下文虽支持医治后随即开始服事，却没有必要在正文中将起始义确定化，因此把另一理解列入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“走上前去—拉着她的手—使她起来”保留原文动作顺序；分号呈现医治动作与立即结果之间的推进。脚注标记置于其实际说明的“服事他们”之后。
