  text: καὶ ἐθαμβήθησαν ⸀ἅπαντες, ὥστε συζητεῖν ⸂πρὸς ἑαυτοὺς⸃ λέγοντας· Τί ἐστιν τοῦτο; ⸂διδαχὴ καινή⸃· κατ’ ἐξουσίαν καὶ τοῖς πνεύμασι τοῖς ἀκαθάρτοις ἐπιτάσσει, καὶ ὑπακούουσιν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/027.yaml
  text: And they were all amazed[a], so that they discussed among themselves, saying, “What is this? A new teaching with authority! He even commands the unclean spirits, and they obey him.”
translation:
  language: zh_hans
  text: 众人都惊讶不已[a]，以致彼此议论说：“这是怎么回事？一种新的、带着权柄的教导！他甚至命令污灵，污灵也服从他。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这段话也可标点理解为：“这是怎么回事？这是什么新的、带着权柄的教导？”希腊文可将“新教导”更直接地纳入问句。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐθαμβήθησαν
  choice: 惊讶不已
  rationale: 表达众人受到强烈震动、十分惊讶的反应；比单用“惊讶”更能体现 θαμβέομαι 的力度，又不过分夸张。
- source_word: ἅπαντες
  choice: 众人都
  rationale: 保留该词对在场者整体反应的强调，也符合现代汉语习惯。
- source_word: ὥστε συζητεῖν πρὸς ἑαυτούς
  choice: 以致彼此议论
  rationale: “以致”体现 ὥστε 不定式所表达的结果；“彼此议论”自然传达相互交谈、讨论之意，不额外赋予敌对争辩色彩。
- source_word: Τί ἐστιν τοῦτο;
  choice: 这是怎么回事？
  rationale: 在惊愕的现场语境中，这是自然的现代汉语问法；既保留直接疑问，也避免生硬的“这是什么？”。
- source_word: διδαχὴ καινή
  choice: 一种……的新教导
  rationale: “教导”比“教义”更贴合现场所听见的教训，也较少技术色彩；“新”保留其新颖性。
- source_word: κατ’ ἐξουσίαν
  choice: 带着权柄
  rationale: “权柄”兼具权威与实际支配能力，适合本节耶稣教导并命令污灵的语境；措辞也保留该短语与“新教导”及随后命令之间可能存在的语义联系。
- source_word: τοῖς πνεύμασι τοῖς ἀκαθάρτοις
  choice: 污灵
  rationale: 简洁保留 ἀκάθαρτος 的污秽、不洁意味；在现代中文圣经语域中清楚可懂。
- source_word: ἐπιτάσσει
  choice: 命令
  rationale: 直接体现权威性的吩咐，与全节的“权柄”主题相呼应。
- source_word: ὑπακούουσιν αὐτῷ
  choice: 服从他
  rationale: 准确表达污灵对命令作出顺从反应；比“听他的话”更明确体现服从权柄。
theological_decisions:
- issue: “带着权柄”在句法和意义上的关联范围
  choice: 正文译作“一种带着权柄的新教导”，同时由下一句展现这权柄也见于他命令污灵。
  alternative: 可把整段理解并标点为连续疑问：“这是怎么回事？这是什么带着权柄的新教导？”；也可使“带着权柄”主要修饰随后“命令”。
  rationale: 希腊文的标点与短语衔接容许不同处理。正文采用自然可读的感叹式表达，但不把“权柄”限制为纯粹的教学风格；下句仍使其在赶逐污灵的行动中具体显明。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“这是怎么回事”保留现场惊愕感；“污灵”“权柄”保持经文语域及原文的重要概念。脚注仅说明原文标点和句法上的真实歧义。
