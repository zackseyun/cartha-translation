  text: καὶ ἐθεράπευσεν πολλοὺς κακῶς ἔχοντας ποικίλαις νόσοις, καὶ δαιμόνια πολλὰ ἐξέβαλεν, καὶ οὐκ ἤφιεν λαλεῖν τὰ δαιμόνια, ὅτι ᾔδεισαν ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/034.yaml
  text: And he healed many who were sick with various diseases[a], and he cast out many demons, and he would not allow the demons to speak, because they knew him.
translation:
  language: zh_hans
  text: 他医治了许多患各种疾病的人，又赶出了许多鬼；他不许那些鬼说话，因为它们认识他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“它们知道他是谁。”希腊文只说：“它们认识他。”
    reason: 说明上下文可能蕴含对耶稣身份的辨认，但原文只以代词“他”作宾语。
lexical_decisions:
- source_word: ἐθεράπευσεν
  choice: 医好了
  rationale: θεραπεύω在此指医治并使人痊愈；“医好了”自然清楚，也体现动词的完成体叙事形式。
- source_word: πολλοὺς κακῶς ἔχοντας ποικίλαις νόσοις
  choice: 许多患各种疾病的人
  rationale: κακῶς ἔχω是“患病”的惯用表达，ποικίλαις νόσοις强调疾病种类多样；此译避免生硬直译，同时保留原意。
- source_word: δαιμόνια πολλὰ ἐξέβαλεν
  choice: 赶出了许多鬼
  rationale: ἐκβάλλω在驱鬼语境中表示强行使其离开；“赶出”在现代汉语中自然，并保留驱逐的力度。
- source_word: οὐκ ἤφιεν λαλεῖν
  choice: 不许……说话
  rationale: ἤφιεν为未完成时，在这一场景中表示持续不准其说话；“不许”简洁地表达许可被拒绝。
- source_word: ὅτι
  choice: 因为
  rationale: 此处最自然地引出耶稣禁止鬼说话的原因。
- source_word: ᾔδεισαν αὐτόν
  choice: 它们认识他
  rationale: 希腊文宾语只是αὐτόν（“他”），没有明说“他是谁”；“认识他”保留原文的简洁与身份认知上的含蓄。
theological_decisions:
- issue: 是否把鬼对耶稣的认识扩展为明确的基督论称认
  choice: 它们认识他
  alternative: 它们知道他是谁／它们知道他是弥赛亚或上帝的儿子
  rationale: 本节只说鬼“认识他”，没有明说所认识的具体身份。采用简洁译法，不从相邻经文补入称号，从而保留原文的神学张力。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。“鬼”符合普通读者的常用表达；以分号连接医治、赶鬼和禁止说话三个紧密相关的动作。脚注标记置于“认识他”之后，与注释所说明的词语准确对应。
