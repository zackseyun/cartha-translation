  verdict: revise
  source_fidelity: 译文准确传达了医治、驱赶许多鬼，以及因它们认识他而禁止其说话的叙事。惟“医好了”较容易在汉语中表示已完全治愈，较“ἐθεράπευσεν／healed”的宽泛医治用语略强；改为“医治了”更稳妥。
  naturalness: 整体为自然、庄重的现代书面汉语。“不许那些鬼说话”清楚地表达了未完成时在场景中的持续禁止；以逗号串联三个动作也比在此使用分号更顺畅。
  terminology: “鬼”是现代汉语圣经语境中对δαιμόνια的常用且可理解的译法；本节原文并未称其为“污鬼”，不应擅自补入。“认识他”保留αὐτόν的简洁宾语，未将其扩展为明确的基督论称号。
