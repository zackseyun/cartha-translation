    rationale: θεραπεύω在此可译“医治／治好”；虽然上下文可蕴含痊愈，“医治了”更直接对应原文和英文审计文本的“healed”，避免把动词的结果含义表述得过强。
  - severity: low
    issue: 脚注中“希腊文直译”措辞可更精确。
    rationale: 注释所要说明的是希腊文只以“他”为宾语，宜明确说“希腊文只说”，避免把整句标为严格逐词直译，同时保留“知道他是谁”仅为可能的解释性译法。
