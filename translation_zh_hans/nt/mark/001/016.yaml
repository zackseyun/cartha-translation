revisions:
- from: 耶稣沿着加利利海边走时，看见西门和西门的兄弟安得烈正在海里撒网；他们原是渔夫。
  to: 耶稣沿着加利利海边走时，看见西门和西门的兄弟安得烈正往海里撒网，因为他们是渔夫。
  rationale: 仅修正两处可能改变或额外限定原意的汉语表达：以“往海里”避免误解为渔夫身在水中；以“因为他们是渔夫”避免“原是”所可能产生的已不再从事该职业的推断。其余措辞保留原稿对动作同时性、地名、人名、兄弟关系及叙事语体的恰当处理。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:09:12Z'
review_pass:
  verdict: revise
  source_fidelity: “在海里撒网”在现代汉语中通常会理解为西门和安得烈人在水中撒网，改变了原文所描写的动作对象／落点。ἀμφιβάλλω配合ἐν τῇ θαλάσσῃ在此是向水中投撒渔网的场景，宜译为“往海里撒网”。“原是渔夫”也可能暗示他们后来不再是渔夫；原文未表达这一时间对比，而是以γάρ提供当时的背景说明。
  naturalness: 修订后的“耶稣沿着加利利海边走时，看见西门和西门的兄弟安得烈正往海里撒网，因为他们是渔夫。”符合现代标准汉语，叙事自然清楚。
  terminology: “加利利海”“西门”“安得烈”“渔夫”均为稳妥、通行的现代中文圣经用语。“西门的兄弟安得烈”不预设长幼，准确保留ἀδελφός的未定性。
  issues:
  - severity: medium
    issue: “在海里撒网”可能将施事者置于海中。
    rationale: 汉语“在海里”通常修饰人所在的位置；此处需要表达将网撒向海中。改为“往海里撒网”既自然，也准确呈现渔网投入水中的动作。
  - severity: low
    issue: “他们原是渔夫”可能带出“曾经是、如今不再是”的含义。
    rationale: ἦσαν γὰρ ἁλιεῖς是对当时撒网行为的背景解释，并无职业已改变的暗示。以“因为他们是渔夫”明确保留γάρ的解释作用。
  revised_text: 耶稣沿着加利利海边走时，看见西门和西门的兄弟安得烈正往海里撒网，因为他们是渔夫。
