  yaml_path: translation/nt/mark/001/016.yaml
  text: And as he was passing along beside the Sea of Galilee, he saw Simon and Andrew, Simon’s brother, casting a net into the sea, for they were fishermen.
translation:
  language: zh_hans
  text: 耶稣沿着加利利海边走时，看见西门和西门的兄弟安得烈正往海里撒网，因为他们是渔夫。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ παράγων
  choice: 耶稣……走时
  rationale: 现在分词表示与主句“看见”同时发生的持续动作。希腊文以省略的主语承接上文；汉语为避免指代含混，补出“耶稣”。句首Καί在此主要承接叙事，现代汉语无需机械译作“又”或“并且”。
- source_word: παρὰ τὴν θάλασσαν
  choice: 沿着……海边
  rationale: παρά加宾格在此表示沿着、靠着某处移动；“沿着……海边走”自然地表达行进路线。
- source_word: τὴν θάλασσαν τῆς Γαλιλαίας
  choice: 加利利海
  rationale: 虽在地理上是湖，原文使用θάλασσα；“加利利海”也是现代中文圣经语境中清楚而稳定的地名。
- source_word: εἶδεν
  choice: 看见
  rationale: 直译ὁράω的简单过去时，不额外加入“注意到”等解释性意味。
- source_word: Σίμωνα καὶ Ἀνδρέαν
  choice: 西门和……安得烈
  rationale: 采用现代中文圣经中通行且易辨识的人名音译。
- source_word: τὸν ἀδελφὸν Σίμωνος
  choice: 西门的兄弟
  rationale: 保留原文对安得烈与西门关系的同位说明；“兄弟”不擅自判定长幼，保存ἀδελφός本身未明说的关系方向。
- source_word: ἀμφιβάλλοντας
  choice: 正在……撒网
  rationale: 该动词特指撒投渔网；“正在”体现现在分词与“看见”同时展开的动作。
- source_word: ἐν τῇ θαλάσσῃ
  choice: 在海里
  rationale: 保留ἐν的处所表达，并以自然汉语描写他们在水中撒网的作业情景；不强行改成方向性的“往海里”。
- source_word: ἦσαν γὰρ ἁλιεῖς
  choice: 他们原是渔夫
  rationale: “原是”自然传达γάρ所引出的背景解释，说明他们为何撒网，同时保持简洁的叙事语气。
theological_decisions:
- issue: 安得烈与西门的兄弟关系是否注明长幼
  choice: 译作“西门的兄弟”
  alternative: 译作“西门的弟弟”
  rationale: 本节ἀδελφός只说明兄弟关系，并未明确安得烈较年幼；不根据传统或推断补入长幼信息。
translation_notes:
  register: 采用现代、庄重而清楚的叙事文体。语序按汉语习惯调整为“沿着加利利海边走时”，保留原文动作的同时性和末尾解释关系；不用生硬的欧化连接词。
