  text: καὶ λέγει αὐτοῖς· Ἄγωμεν ⸀ἀλλαχοῦ εἰς τὰς ἐχομένας κωμοπόλεις, ἵνα καὶ ἐκεῖ κηρύξω, εἰς τοῦτο γὰρ ⸀ἐξῆλθον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/038.yaml
  text: And he said to them[a], “Let us go elsewhere, to the neighboring towns, so that I may preach there also[b], for that is why I came out.”
translation:
  language: zh_hans
  text: 他对他们说：“我们到别处去，去附近的村镇[a]，好让我也在那里传道，因为我正是为此出来的[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “村镇”所译的希腊词可指较小的聚落，规模大致介于村庄与城镇之间。
    reason: lexical_alternative
  - marker: b
    text: 也可理解为“我就是为这目的出来的”。这句话可能只指耶稣离开当时所在的地方，也可能更广泛地指他出来传道的目的。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄγωμεν
  choice: 我们……去
  rationale: 第一人称复数劝勉虚拟式，译作“我们……去”自然地保留共同前往的劝请语气。
- source_word: ἀλλαχοῦ
  choice: 到别处去
  rationale: 表示前往当前地点以外的地方；“到别处去”符合现代汉语表达。
- source_word: τὰς ἐχομένας
  choice: 附近的
  rationale: ἐχομένας用于地点时指相邻或接续的地方；“附近的”既自然，也不过度限定为紧挨着。
- source_word: κωμοπόλεις
  choice: 乡镇
  rationale: 该词指规模介于村庄与城镇之间的聚落；“乡镇”简洁地保留这种规模层次，脚注说明其语义范围。
- source_word: ἵνα καὶ ἐκεῖ κηρύξω
  choice: 好让我也在那里传道
  rationale: “好让”表达ἵνα的目的意义，“也在那里”保留καὶ ἐκεῖ的强调，“传道”自然表达κηρύσσω在此处公开宣讲的含义。
- source_word: εἰς τοῦτο
  choice: 正是为此
  rationale: 表达目的或缘由；加入“正是”能自然传达指向前述传道行动的强调。
- source_word: ἐξῆλθον
  choice: 我……出来的
  rationale: 直译保留“出来”的空间意象，同时不明确补出出发地点，使其既可指离开当前所在之处，也可能含有更广的使命意味。
- source_word: λέγει αὐτοῖς
  choice: 他对他们说
  rationale: 希腊文采用历史现在时；现代汉语叙事用“说”无需标明时态，表达自然且不改变意义。
theological_decisions:
- issue: ἐξῆλθον所指范围
  choice: 译作“我正是为此出来的”，不说明从哪里出来
  alternative: “我就是为这事离开那里的”或“我正是为这使命而来的”
  rationale: 原文既可能仅指耶稣离开当时所在之处，也可能在上下文中带有更广的传道使命意味。正文保留这种张力，避免将其限定为单纯的地理移动，或提升为关于其来源与使命的明确神学陈述。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事表达。“乡镇”避免生硬的“村镇式城邑”；“出来”刻意保留原文可能具有的地点与使命双重指向。脚注标记依其实际所注释的词语安置。
