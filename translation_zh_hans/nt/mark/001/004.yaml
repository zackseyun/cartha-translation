  text: ἐγένετο Ἰωάννης ⸀ὁ βαπτίζων ἐν τῇ ⸀ἐρήμῳ κηρύσσων βάπτισμα μετανοίας εἰς ἄφεσιν ἁμαρτιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/004.yaml
  text: John the Baptist appeared in the wilderness[a], proclaiming a baptism of repentance for the forgiveness of sins.
translation:
  language: zh_hans
  text: 施洗者约翰[a]出现在旷野，宣讲悔改的洗礼，为使罪得赦免。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“约翰，那施洗的”。希腊文用带冠词的分词，按约翰施洗的工作来称呼他。
    reason: 保留ὁ βαπτίζων既可作为称号、也可较直白地表达为描述性短语的译法差异。
lexical_decisions:
- source_word: ἐγένετο
  choice: 出现在
  rationale: 在马可的叙事中，这个动词在此引出约翰登场；“出现在”比生硬的“成为”更自然，也不额外说明他从何处来到。
- source_word: Ἰωάννης
  choice: 约翰
  rationale: 采用现代汉语圣经传统中通行的人名译法。
- source_word: ὁ βαπτίζων
  choice: 施洗者
  rationale: 带冠词的现在分词按约翰所从事的施洗工作来称呼他；“施洗者”准确、简洁，也保留其称号性质。
- source_word: ἐν τῇ ἐρήμῳ
  choice: 在旷野
  rationale: “旷野”既符合当地荒僻地貌，也保留该词在圣经叙事中的呼应，不把它限定为沙漠。
- source_word: κηρύσσων
  choice: 宣讲
  rationale: 体现像传令者一样公开宣告信息的含义，同时符合现代汉语表达。
- source_word: βάπτισμα μετανοίας
  choice: 悔改的洗礼
  rationale: 保留属格结构，将其表达为以悔改为特征或与悔改相连的洗礼，不扩写为特定的教义解释。
- source_word: εἰς ἄφεσιν ἁμαρτιῶν
  choice: 使罪得赦免
  rationale: 自然表达洗礼、悔改与罪得赦免之间的指向关系，同时不进一步断定其关系属于工具、象征或宣告。
theological_decisions:
- issue: 洗礼、悔改与罪得赦免之间的关系
  choice: 译为“悔改的洗礼，使罪得赦免”
  alternative: “象征悔改、为使罪得赦免的洗礼”或“借着悔改带来赦罪的洗礼”
  rationale: 原文说明三者彼此相关，却没有要求译者裁定后来关于洗礼功效的教义争论；正文保留这一神学张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“施洗者约翰”作为称号简洁明确；句子保持原文紧凑的叙事推进，并避免用解释性措辞消解洗礼、悔改和赦罪之间的开放关系。
