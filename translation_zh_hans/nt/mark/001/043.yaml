  text: καὶ ἐμβριμησάμενος αὐτῷ ⸀εὐθὺς ἐξέβαλεν αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/043.yaml
  text: And after sternly warning him[a], he immediately sent him away[b],
translation:
  language: zh_hans
  text: 他严厉地警告那人[a]，随即把他赶了出去[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“严正地嘱咐那人”；这个希腊词也可含有强烈不悦或严厉斥责的意味。
    reason: lexical_alternative
  - marker: b
    text: 或译：“把他打发走了”；原文所用的动词比一般的“让他离开”语气更强。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: 他……，
  rationale: 作为承接叙事的连接词，中文不必机械译出“和”；用连续分句自然延续上文。
- source_word: ἐμβριμησάμενος
  choice: 严厉地警告
  rationale: 该分词带有强烈情绪和严正告诫的意味。“严厉地警告”既保留力度与指令性，也不武断地断定耶稣是在责骂那人。
- source_word: αὐτῷ
  choice: 那人
  rationale: 与格代词指刚得洁净的人；中文用“那人”明确指代，避免连续使用“他”造成歧义。
- source_word: εὐθύς
  choice: 随即
  rationale: 保留马可叙事中动作紧接发生的节奏；“随即”庄重、自然，也准确表达即时性。
- source_word: ἐξέβαλεν
  choice: 赶了出去
  rationale: ἐκβάλλω比中性的“打发走”更强，可表示赶出、逐出。此处直译其力度，同时以脚注说明较缓和的语境译法。
- source_word: αὐτόν
  choice: 他
  rationale: 宾格代词仍指同一人，直接译为“他”。
theological_decisions:
- issue: 耶稣对得洁净之人的语气和行动力度
  choice: 保留“严厉警告”和“赶出去”所表达的明显强度，但不说明这种强度必然等于愤怒或对那人的定罪。
  alternative: 译为较缓和的“郑重嘱咐他，随即打发他走”，或更明确地译成“责骂他”。
  rationale: ἐμβριμησάμενος和ἐξέβαλεν都是力度较强的词。正文保留这种张力，不将其淡化，也不加入原文没有明说的道德或情绪判断。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“严厉地警告”与“赶了出去”保留原文两个强势动词的力度；句末逗号承接下一节尚未说完的行动与命令。
