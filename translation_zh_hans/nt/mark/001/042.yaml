  text: καὶ ⸀εὐθὺς ἀπῆλθεν ἀπ’ αὐτοῦ ἡ λέπρα, καὶ ἐκαθαρίσθη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/042.yaml
  text: And immediately the leprosy left him[a], and he was cleansed.
translation:
  language: zh_hans
  text: 麻风立刻离开了他，他就洁净了[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他就成为洁净的。”这个动词也含有礼仪上得洁净的意思，并不只是身体康复。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: 立刻
  rationale: 这个词在《马可福音》中常表达事情迅速发生；“立刻”简洁自然，也保留了叙事的紧迫感。
- source_word: ἀπῆλθεν ἀπ’ αὐτοῦ
  choice: 离开了他
  rationale: ἀπέρχομαι本义为“离去”，与“从他身上”连用且以“麻风”为主语时，译作“离开了他”符合现代汉语表达，也准确保留原意。
- source_word: ἡ λέπρα
  choice: 麻风
  rationale: 在圣经语境中，这个词所指的皮肤病范围可能比现代医学所称的麻风病更广。“麻风”沿用熟悉而简洁的圣经用语，同时避免把原文严格限定为现代汉森病。
- source_word: ἐκαθαρίσθη
  choice: 他就洁净了
  rationale: καθαρίζω的被动形式在此既涉及身体状况恢复，也涉及从不洁状态中得到洁净。“洁净了”保留这双重含义，比单译为“医好了”更贴近原文。
theological_decisions:
- issue: καθαρίζω所表达的身体康复与礼仪洁净之间的关系
  choice: 译为“他就洁净了”
  alternative: 他就痊愈了；他就成为洁净的
  rationale: 经文不只描写症状消失；在麻风所关联的圣经背景中，洁净也关系到不洁状态的解除。此译法保留原文的礼仪和神学意涵，却不额外加入教义解释。
translation_notes:
  register: 采用简洁、庄重而自然的现代普通话。“麻风立刻离开了他”保留原文以疾病为主语的生动表达；“他就洁净了”兼顾可读性以及身体康复和礼仪洁净的双重含义。
