  text: Καὶ πρωῒ ἔννυχα λίαν ἀναστὰς ἐξῆλθεν καὶ ἀπῆλθεν εἰς ἔρημον τόπον κἀκεῖ προσηύχετο.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/035.yaml
  text: And very early[a], while it was still dark, he got up, went out, and went away to a desolate place, and there he was praying.
translation:
  language: zh_hans
  text: 清晨很早，天还黑着的时候，耶稣起来，出去，往一处荒僻的地方[a]去了；他在那里祷告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“僻静的地方”“无人的地方”或“旷野般的地方”。希腊语可形容无人居住、荒凉或类似旷野的地点。
    reason: lexical_alternative
lexical_decisions:
- source_word: πρωῒ ἔννυχα λίαν
  choice: 天还很黑的时候，一大早
  rationale: 三个时间成分共同强调清晨极早、夜色未退。这样的语序自然清楚，同时保留“很早”和“仍黑”两层意思。
- source_word: ἀναστὰς
  choice: 起来
  rationale: 不定过去时分词表示先于主要动作发生的伴随行动；用“起来”简洁呈现动作次序。
- source_word: ἐξῆλθεν καὶ ἀπῆλθεν
  choice: 出去，往……去了
  rationale: 分别保留“从所在之处出去”和“离开前往另一地点”两个连续动作，避免将马可的叙述压缩为单一的“离开”。
- source_word: εἰς ἔρημον τόπον
  choice: 往一处荒僻的地方
  rationale: ἔρημος 可指无人、荒凉或类似旷野的地方。“荒僻”在现代汉语中自然，也不必然将其限定为正式的地理旷野。
- source_word: κἀκεῖ
  choice: 在那里
  rationale: 自然表达 καὶ ἐκεῖ 的地点承接关系。
- source_word: προσηύχετο
  choice: 祷告
  rationale: 希腊语未完成时态呈现持续进行的行动。汉语“在那里祷告”在此叙事语境中可自然表达一段时间内的活动，而无需生硬添加“正在”。
theological_decisions:
- issue: 耶稣祷告的叙事重点
  choice: 按经文直接叙述耶稣离开并在荒僻处祷告
  alternative: 在译文中强化独处对门徒生活的示范意义，或加入关于耶稣借祷告表现倚靠的基督论解释
  rationale: 原文只叙述耶稣清早前往荒僻之处祷告；神学含义应由上下文和读者理解，不宜加入译文本身。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“荒僻的地方”保留地点本身无人、偏远的特征；以连续动词呈现马可简洁而推进迅速的叙事风格。
