  text: καὶ λέγει αὐτῷ· Ὅρα μηδενὶ μηδὲν εἴπῃς, ἀλλὰ ὕπαγε σεαυτὸν δεῖξον τῷ ἱερεῖ καὶ προσένεγκε περὶ τοῦ καθαρισμοῦ σου ἃ προσέταξεν Μωϋσῆς εἰς μαρτύριον αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/044.yaml
  text: And he says to him[a], “See that you say nothing to anyone; rather, go, show yourself to the priest, and offer for your cleansing what Moses commanded, as a testimony to them.”
translation:
  language: zh_hans
  text: 他对那人说：“你要当心，什么都不要告诉任何人；而要去，让祭司察看你，并为你的洁净献上摩西所吩咐的，作为给他们的见证。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “作为给他们的见证”也可译作“作为给他们的证据”。“他们”可能指祭司或其他人；也有人把这句话理解为“作为反对他们的见证”。
    reason: 说明原文中αὐτοῖς的所指及“见证”性质的歧义，避免正文过度限定。
lexical_decisions:
- source_word: Ὅρα
  choice: 你要当心
  rationale: 这是带警戒意味的命令，用来引出紧接着的禁令；“你要当心”既保留劝诫力度，也符合现代汉语表达。
- source_word: μηδενὶ μηδὲν εἴπῃς
  choice: 什么都不要告诉任何人
  rationale: 保留两个否定成分所涵盖的全面范围：不可说出任何事，也不可告诉任何人。
- source_word: ἀλλὰ ὕπαγε
  choice: 只管去
  rationale: ἀλλά在这里把不可做的事与应当做的事鲜明对照；“只管去”自然地表达纠正和转折。
- source_word: σεαυτὸν δεῖξον τῷ ἱερεῖ
  choice: 让祭司察看你
  rationale: 按洁净条例，祭司需要检验当事人；此译法自然表达“把自己给祭司看”的实际含义，同时不额外说明检验结果。
- source_word: ἱερεῖ
  choice: 祭司
  rationale: 指按律法负责察验的祭司。汉语不使用冠词，故不强行区分“这位”或“一位”。
- source_word: προσένεγκε
  choice: 献上
  rationale: 上下文涉及摩西所规定的洁净礼和祭物，因此采用具有礼仪、献祭意味的“献上”，而非泛指的“带来”。
- source_word: περὶ τοῦ καθαρισμοῦ σου
  choice: 为你的洁净
  rationale: περί在礼仪语境中可表示相关事项或目的；“为你的洁净”简洁，并与利未记洁净条例的背景相合。
- source_word: ἃ προσέταξεν Μωϋσῆς
  choice: 摩西所吩咐的
  rationale: 以汉语名词化结构自然概括原文中性的复数关系代词，指摩西规定的相关献物和礼仪。
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: 作为对他们的见证
  rationale: 保留εἰς所表达的目的或结果，也保留μαρτύριον的见证、证据含义；不擅自确定“他们”专指祭司、众人或其他人，也不在正文加入敌对意味。
theological_decisions:
- issue: “作为对他们的见证”中“他们”的所指及见证的性质
  choice: 保留宽泛表达“作为对他们的见证”
  alternative: “作为给祭司的证据”或“作为反对他们的见证”
  rationale: 希腊文没有明确加入“反对”的意思，也没有明说“他们”仅指祭司。宽泛译法可同时容纳祭司察验、向群体提供证据，以及较强的审判性理解，而不替原文消除张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“只管去”清楚呈现禁令与正面命令的对照；“让祭司察看你”比直译“把自己显示给祭司”自然，也符合律法背景。脚注标记置于真正存在歧义的末句，而非人物引介处。
