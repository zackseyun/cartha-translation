id: MRK.1.15
reference: Mark 1:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ λέγων ὅτι Πεπλήρωται ὁ καιρὸς καὶ ἤγγικεν ἡ βασιλεία τοῦ θεοῦ· μετανοεῖτε καὶ πιστεύετε ἐν τῷ εὐαγγελίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/015.yaml
  text: and saying[a], “The time has been fulfilled, and the kingdom of God has drawn near[b]. Repent and believe in the good news.”
translation:
  language: zh_hans
  text: 说：“时候已经成熟，上帝的国已经临近了[a]。你们要悔改，相信这好消息[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “上帝的国”或译“上帝的统治”。
    reason: lexical_alternative
  - marker: b
    text: “好消息”也常译作“福音”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πεπλήρωται
  choice: 已经成熟
  rationale: 完成时表达已经达成、其结果延续至今；“已经成熟”与“时候”搭配自然，也保留时机达到圆满阶段的含义。
- source_word: ὁ καιρὸς
  choice: 时候
  rationale: 这里指具有决定意义的特定时机，而非抽象、连续的时间；“时候”自然明白，又不把“所定的”这一语境含义直接增补进正文。
- source_word: ἤγγικεν
  choice: 已经临近了
  rationale: 完成时表明临近这一行动已经发生，并形成当前近在眼前的状态；“已经临近了”兼顾动词形态与现代汉语表达。
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: 上帝的国
  rationale: “国”保留该词可同时涉及上帝的统治、王权及其领域的宽广含义，不将其缩减为单一层面。
- source_word: μετανοεῖτε
  choice: 你们要悔改
  rationale: “悔改”简洁表达思想、态度和生活方向的转变；加入“你们要”清楚呈现复数命令语气，却不把现在时命令过度解释为持续反复的行动。
- source_word: πιστεύετε
  choice: 相信
  rationale: “相信”是 πιστεύω 在此处自然且贴切的对应词，保留对所宣告之好消息作出信心回应的要求。
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: 这好消息
  rationale: εὐαγγέλιον 的基本意义是“好消息”；汉语在“相信”之后不必机械译出介词 ἐν，而以“相信这好消息”自然表达其关系。指示词“这”承接耶稣正在宣告的内容。
- source_word: λέγων
  choice: 说
  rationale: 该分词承接上一节的叙事；中文以“说”自然引出直接引语，无需生硬保留分词结构。
theological_decisions:
- issue: ἡ βασιλεία τοῦ θεοῦ 的译法
  choice: 上帝的国
  alternative: 上帝的统治
  rationale: 正文采用传统而含义宽广的“上帝的国”，既可涵盖上帝施行统治，也不排除其国度的领域性；脚注列出动态性的另一译法，以保留原文张力。
- issue: εὐαγγέλιον 的译法
  choice: 好消息
  alternative: 福音
  rationale: “好消息”直接传达希腊词的普通词义，便于现代读者理解；“福音”作为通行的教会用语保留在脚注中。
- issue: μετανοεῖτε καὶ πιστεύετε 的命令语气与体貌
  choice: 你们要悔改，相信
  alternative: 你们要不断悔改、相信
  rationale: 现在时命令可能带有持续性，但本处宣告中的简明命令不要求把这种体貌明确扩写；正文保留呼召的迫切性而不作过度诠释。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“时候已经成熟”避免生硬的“时候已经满了”，同时保留 Πεπλήρωται 所表达的圆满与现今结果；“临近了”不擅自判定上帝的国只是尚未来到，还是已经以临近的方式临到。
