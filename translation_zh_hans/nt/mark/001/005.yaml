  text: καὶ ἐξεπορεύετο πρὸς αὐτὸν πᾶσα ἡ Ἰουδαία χώρα καὶ οἱ Ἱεροσολυμῖται ⸂πάντες, καὶ ἐβαπτίζοντο⸃ ⸂ὑπ’ αὐτοῦ ἐν τῷ Ἰορδάνῃ ποταμῷ⸃ ἐξομολογούμενοι τὰς ἁμαρτίας αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/005.yaml
  text: And all the Judean countryside and all the people of Jerusalem were going out to him, and they were being baptized by him in the Jordan River, confessing their sins.
translation:
  language: zh_hans
  text: 犹太全地的人和耶路撒冷的居民都不断到他那里去，在约旦河里受他施洗，承认自己的罪。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξεπορεύετο
  choice: 不断到他那里去
  rationale: 未完成时描写过去持续或反复发生的行动；“不断……去”在现代汉语中自然地保留这一体貌。原词的“出去”在此以目的地“到他那里”表达，避免生硬直译。
- source_word: πᾶσα ἡ Ἰουδαία χώρα
  choice: 犹太全境
  rationale: χώρα可指地区、地域或乡野；上下文强调来自犹太地区各处的人。“犹太全境”简洁保留πᾶσα的整体性修辞，又不把地域本身误写成行动主体中的每一个个人。
- source_word: οἱ Ἱεροσολυμῖται πάντες
  choice: 所有耶路撒冷的居民
  rationale: Ἱεροσολυμῖται指耶路撒冷居民；“所有……的居民”自然且保留πάντες的集体性强调。
- source_word: ἐβαπτίζοντο
  choice: 受他的洗
  rationale: 未完成时被动语态表示许多人持续、反复接受施洗；“受……的洗”保留被动意义，并采用现代中文基督教语境中通行而不过度解释施洗方式的表达。
- source_word: ὑπ’ αὐτοῦ
  choice: 他的
  rationale: 希腊文使用代词，语境所指是约翰；译文保留代词，不擅自补出名字。
- source_word: ἐν τῷ Ἰορδάνῃ ποταμῷ
  choice: 在约旦河里
  rationale: ποταμός明确指河流；“约旦河”是标准中文地名，“在……里”忠实保留ἐν的空间表达，而不据此判定具体施洗方式。
- source_word: ἐξομολογούμενοι
  choice: 承认
  rationale: 分词表示与受洗相伴的行动；“承认自己的罪”是自然、庄重的现代汉语，也保留公开认罪或宣认罪过的基本语义。
- source_word: τὰς ἁμαρτίας αὐτῶν
  choice: 自己的罪
  rationale: 反身领属在中文中用“自己的”更自然，也清楚表明所承认的是各人自身的罪。
theological_decisions:
- issue: “全”和“所有”的范围
  choice: 保留整体性用语“犹太全境”和“所有耶路撒冷的居民”，容许叙事中的概括性修辞
  alternative: 弱化为“犹太地区和耶路撒冷有许多人”
  rationale: 原文有πᾶσα和πάντες，应保留其强烈的整体性表达；但不额外断言这是数学意义上毫无例外的每一个人。
- issue: 施洗的方式及神学意义
  choice: 译作“受他的洗”，不进一步说明方式或功效
  alternative: 译作“被他浸入水中”或“受他洁净”
  rationale: βαπτίζω在本节叙述施洗之举，但本句本身没有要求译者加入特定宗派关于方式或神学功效的解释。
- issue: 认罪与受洗的关系
  choice: 用并列相伴结构“受他的洗，承认自己的罪”
  alternative: 解释为“因为承认了罪，所以受洗”或“借着受洗承认罪”
  rationale: 希腊文现在分词说明伴随行动，但未明确规定严格的时间先后或因果关系；译文保留这种张力。
translation_notes:
  register: 采用现代、庄重、易懂的简体中文。“犹太全境”比“犹太全乡”自然，也能涵盖χώρα的地域义；“不断到他那里去”体现未完成时的持续或反复动作。无脚注，因此正文不设脚注标记。
