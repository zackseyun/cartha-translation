  yaml_path: translation/nt/mark/001/039.yaml
  text: And he went throughout all Galilee[a], preaching in their synagogues and casting out demons.
translation:
  language: zh_hans
  text: 他走遍整个加利利[a]，在他们的各会堂里宣讲，并赶出鬼魔。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他来到加利利各地，在他们的各会堂里宣讲，并赶出鬼魔。”希腊文动词也可译作“来到”，但按上下文，这里很可能是在描述他巡行这一地区。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν
  choice: 走遍
  rationale: ἔρχομαι的未完成过去时在此与地域短语及两个现在分词连用，描写耶稣巡行各处的持续事奉；“走遍”以自然汉语表达区域内的移动，同时避免机械译作“来”。
- source_word: κηρύσσων
  choice: 传道
  rationale: κηρύσσω指公开宣告；在会堂语境中，“传道”自然庄重，也保留公开宣讲的含义。
- source_word: εἰς τὰς συναγωγὰς αὐτῶν
  choice: 在他们的各会堂里
  rationale: 此处εἰς结合活动动词可表达活动的场所；“在……里”符合现代汉语。保留αὐτῶν为“他们的”，并以“各会堂”体现多个会堂及巡回活动。
- source_word: εἰς ὅλην τὴν Γαλιλαίαν
  choice: 加利利全境
  rationale: 第二个εἰς与ὅλην共同表示行动遍及整个地区；“全境”简洁地保留整体范围。
- source_word: τὰ δαιμόνια
  choice: 鬼魔
  rationale: δαιμόνια指具有位格性的邪灵存在；“鬼魔”是现代中文圣经语体中直接而易懂的对应词，不将其泛化为疾病或抽象邪恶。
- source_word: ἐκβάλλων
  choice: 赶出
  rationale: ἐκβάλλω在驱邪语境中表示逐出、驱赶；“赶出”是自然清楚的现代汉语表达。
theological_decisions:
- issue: δαιμόνια的性质
  choice: 译作“鬼魔”，按经文通常的有位格灵界存在理解
  alternative: 邪灵
  rationale: “鬼魔”直接对应δαιμόνια，保留耶稣对这类存在施行权柄的叙述，又不增添经文以外的系统教义说明。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“走遍……全境”突出巡回事奉；脚注保留ἦλθεν可译“来到”的词义与句法歧义。
