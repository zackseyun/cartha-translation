  text: 耶稣——弥赛亚[b]——的好消息[a]的开端。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“福音”。希腊语εὐαγγέλιον既可译作“好消息”，传统上也译作“福音”。
    reason: lexical_alternative
  - marker: b
