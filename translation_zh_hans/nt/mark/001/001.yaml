    reason: alternative_reading
lexical_decisions:
- source_word: Ἀρχὴ
  choice: 开端
  rationale: 保留原文名词式、题记般的开篇，不补成完整叙事句；“开端”在现代汉语中庄重而自然，也不限定它究竟指叙事的起头还是宣讲的起源。
- source_word: εὐαγγελίου
  choice: 好消息
  rationale: 直接传达该词的普通词义，使现代读者无需依赖教会术语也能理解；传统译法“福音”列入脚注。
- source_word: Ἰησοῦ
  choice: 耶稣
  rationale: 采用现代中文通行的人名译法。
- source_word: χριστοῦ
  choice: 这位弥赛亚
  rationale: Χριστός在这里具有称号作用；译作“弥赛亚”可显明其职分含义。“这位”使“耶稣”与称号在现代汉语中衔接自然，并不把“基督”误作姓氏。
theological_decisions:
- issue: Χριστοῦ应译为称号“弥赛亚”，还是沿用较像专名的“基督”
  choice: 弥赛亚
  alternative: 基督
  rationale: 本节开篇以该称号确认耶稣的弥赛亚身份。译出称号的意义，既保留其犹太背景，也避免现代读者将“基督”只理解为名字的一部分。
- issue: 属格Ἰησοῦ χριστοῦ与“好消息”的关系
  choice: 用“……的好消息”保留宽泛属格关系
  alternative: 关于耶稣这位弥赛亚的好消息
  rationale: 原文可自然理解为关于耶稣的好消息，但属格本身没有明说“关于”；采用汉语“的”结构，避免把关系限定得过窄。
translation_notes:
  register: 采用现代、庄重的名词式开篇。“……之开端”保留原文简洁而近似标题的形式；正文未补入“是”或“从这里开始”等原文没有的谓语。
