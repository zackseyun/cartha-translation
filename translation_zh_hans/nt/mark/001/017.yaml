  text: καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Δεῦτε ὀπίσω μου, καὶ ποιήσω ὑμᾶς γενέσθαι ἁλιεῖς ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/017.yaml
  text: And Jesus said to them, “Come after me, and I will make you become fishers of men.”
translation:
  language: zh_hans
  text: 耶稣对他们说：“来跟从我，我要使你们成为得人的渔夫。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δεῦτε ὀπίσω μου
  choice: 来跟从我
  rationale: 直译为“来，到我后面”，在门徒召唤的语境中自然表达为“来跟从我”，既保留行动性的邀请，也准确传达跟随耶稣之意。
- source_word: ποιήσω ὑμᾶς γενέσθαι
  choice: 我要使你们成为
  rationale: 保留“使……成为”的变化过程；γενέσθαι 不宜被省略为单纯的身份指定。
- source_word: ἁλιεῖς ἀνθρώπων
  choice: 得人的渔夫
  rationale: 保留原文“渔夫”的比喻；ἀνθρώπων 在此泛指人类或众人，汉语惯用的“得人的渔夫”简洁、庄重，且不把范围限定为男性。
theological_decisions:
- issue: “使你们成为”是否表达即时任命还是塑造过程
  choice: 我要使你们成为
  alternative: 我要叫你们作
  rationale: 原文 ποιήσω ὑμᾶς γενέσθαι 明确包含“使……成为”，可含逐渐塑造之意；译文不进一步界定过程长短，以保留原文张力。
- issue: ἀνθρώπων 的性别范围
  choice: 人
  alternative: 男人
  rationale: 希腊语 ἄνθρωπος 在此通常泛指人，而非专指成年男性；译作“人”避免加入原文没有的性别限制。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“得人的渔夫”保留圣经传统意象，同时普通读者可从语境理解为带领人归向耶稣。
