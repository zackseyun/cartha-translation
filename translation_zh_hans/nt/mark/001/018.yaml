  text: καὶ ⸀εὐθὺς ἀφέντες τὰ ⸀δίκτυα ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/018.yaml
  text: And immediately they left the nets and followed him[a].
translation:
  language: zh_hans
  text: 他们立刻撇下渔网，跟从了他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: （不单独译出）
  rationale: 此处 καὶ 承接前文；现代汉语可借句序自然表达叙事推进。若硬译为“于是”会稍添推论色彩，译为“并且”则不自然。
- source_word: εὐθὺς
  choice: 立刻
  rationale: 准确传达行动的即时与迅速，也符合马可叙事中该词的紧迫感；现代汉语自然明白。
- source_word: ἀφέντες
  choice: 撇下
  rationale: 此处是不定过去时分词，所指动作先于主要动词。汉语以连动结构表达为“撇下……跟从”，既自然，也不必明确补出“之后”；“抛弃”语气过重。
- source_word: τὰ δίκτυα
  choice: 渔网
  rationale: δίκτυα 指捕鱼用的网。汉语加“渔”可清楚说明用途而不增添实质信息；不补作“他们的”，以贴近希腊文仅用定冠词的表达。
- source_word: ἠκολούθησαν
  choice: 跟从了
  rationale: ἀκολουθέω 在此兼有实际随行和开始作门徒的语境意味。“跟从”保留这两层可能，不扩译为“作了他的门徒”。“了”标示叙事中已经发生的完整行动。
- source_word: αὐτῷ
  choice: 他
  rationale: 原文用代词，所指由上文明确为耶稣，因此保留代词，不改为专名。
theological_decisions:
- issue: ἠκολούθησαν 的门徒含义
  choice: 译为“跟从了他”，不作解释性扩展
  alternative: “跟他去了”或“成了他的门徒”
  rationale: “跟从”既能表示实际随行，也能让作门徒的神学意义从上下文自然显明；“跟他去了”会削弱门徒意味，“成了他的门徒”则把隐含意义明确化，超过原文字面。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。句式紧凑，以“立刻”突出马可叙事的迅速节奏；本节无需脚注，因为“立刻”已充分表达 εὐθὺς，英文脚注所列“at once”在中文没有需要另注的实质差异。
