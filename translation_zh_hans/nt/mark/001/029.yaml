source:
  edition: SBLGNT
  text: Καὶ ⸀εὐθὺς ἐκ τῆς συναγωγῆς ⸂ἐξελθόντες ἦλθον⸃ εἰς τὴν οἰκίαν Σίμωνος καὶ Ἀνδρέου μετὰ Ἰακώβου καὶ Ἰωάννου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/029.yaml
  text: And immediately, after leaving the synagogue, they came into the house of Simon and Andrew, with James and John.
translation:
  language: zh_hans
  text: 他们一出会堂，就立刻同雅各、约翰一起，来到西门和安得烈的家里。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐθὺς
  choice: 立刻
  rationale: 保留马可叙事中这一特色副词所表达的紧迫感和快速推进；“立刻”自然、简洁。
- source_word: ἐκ τῆς συναγωγῆς ἐξελθόντες
  choice: 一出会堂
  rationale: 以现代汉语自然表达先离开会堂、随后来到住宅的时间关系，同时保留ἐκ与ἐξέρχομαι共同呈现的离开动作。
- source_word: ἦλθον
  choice: 来到
  rationale: ἔρχομαι可依叙述视角译为“来”或“去”；这里以目的地为叙事落点，“来到”自然且不改变行动方向。
- source_word: εἰς τὴν οἰκίαν
  choice: 到……的家里
  rationale: εἰς表示进入的方向，οἰκία在此指居所；“家里”比“房子里”更符合现代汉语对私人住所的表达。
- source_word: Σίμωνος καὶ Ἀνδρέου
  choice: 西门和安得烈的
  rationale: 两个属格共同说明该住所与西门、安得烈的关系；不进一步推断具体产权或家庭安排。
- source_word: μετὰ Ἰακώβου καὶ Ἰωάννου
  choice: 同雅各、约翰一起
  rationale: μετά加属格表示陪同；此译明确雅各和约翰与他们同行。
- source_word: Σίμωνος / Ἀνδρέου / Ἰακώβου / Ἰωάννου
  choice: 西门／安得烈／雅各／约翰
  rationale: 采用现代中文圣经语境中通行且易识别的人名译法。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“一出……就立刻……”清楚呈现分词所指的先行动作及εὐθὺς的紧接关系；保留主语“他们”，不在本节擅自补明具体人物。
