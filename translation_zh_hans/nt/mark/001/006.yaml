base_translation:
  language: en
  yaml_path: translation/nt/mark/001/006.yaml
  text: John was clothed with camel’s hair and a leather belt around his waist[a], and he was eating locusts and wild honey.
translation:
  language: zh_hans
  text: 约翰身穿骆驼毛制的衣服，腰间束着一条皮带；他吃的是蝗虫和野蜜。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 约翰的衣着使人想起《列王纪下》1:8对以利亚的描述，也有助于理解马可如何把约翰呈现为一位具有先知性、作先驱的人物。
    reason: cross_reference
lexical_decisions:
- source_word: ἐνδεδυμένος τρίχας καμήλου
  choice: 身穿骆驼毛的衣服
  rationale: 完成时分词描写约翰当时持续的穿着状态；“骆驼毛的衣服”明确指以骆驼毛制成的衣物，避免被误解为披着骆驼皮。
- source_word: ζώνην δερματίνην
  choice: 皮带
  rationale: ζώνη指束在腰间的带子，δερματίνην说明材质为皮革；“皮带”简洁自然。
- source_word: περὶ τὴν ὀσφὺν αὐτοῦ
  choice: 腰束
  rationale: 准确表达带子围在腰部，同时采用自然凝练的现代汉语。
- source_word: ἔσθων
  choice: 吃的是
  rationale: 现在时分词在人物肖像式描写中可表示持续或惯常的饮食；“吃的是”自然地呈现其日常食物，而非一次性的进食动作。
- source_word: ἀκρίδας
  choice: 蝗虫
  rationale: 该词通常指可食用的蝗虫，原文没有支持改作植物名称。
- source_word: μέλι ἄγριον
  choice: 野蜜
  rationale: 直译为野生环境中取得的蜂蜜；“野蜜”简明自然，并保留原文的修饰关系。
- source_word: ⸂καὶ ἦν⸃
  choice: 约翰身穿
  rationale: καί承接上下文，ἦν与分词构成迂回表达；现代汉语无需机械译出句首“并且”或系词，即可自然保留叙事连续性与状态描写。
theological_decisions:
- issue: 约翰的衣着与以利亚形象之间的关系
  choice: 正文只描述约翰的衣着，不直接称他为以利亚或先知性的先锋。
  alternative: 在正文中明确说明这身衣着象征以利亚。
  rationale: 本节用语使人联想到《列王纪下》1:8，但并未明说约翰就是以利亚；将这层互文意义放入脚注，既帮助读者理解，也不把解释写进正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“身穿……腰束……”保持人物描写的凝练感；正文脚注标记[a]与脚注完全对应。
