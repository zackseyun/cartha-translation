  text: καὶ ⸀προβὰς ὀλίγον εἶδεν Ἰάκωβον τὸν τοῦ Ζεβεδαίου καὶ Ἰωάννην τὸν ἀδελφὸν αὐτοῦ, καὶ αὐτοὺς ἐν τῷ πλοίῳ καταρτίζοντας τὰ δίκτυα,
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/019.yaml
  text: And going on a little farther[a], he saw James the son of Zebedee and John his brother, and they were in the boat mending the nets,
translation:
  language: zh_hans
  text: 他再往前走了一点，看见西庇太的儿子雅各和雅各的兄弟约翰，正在船上修补渔网[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“整理”或“预备”渔网；希腊语动词可指把某物整顿妥当，或使其恢复到合用的状态。
    reason: lexical_alternative
lexical_decisions:
- source_word: προβὰς ὀλίγον
  choice: 又往前走了不远
  rationale: 不定过去时分词在叙事中表示伴随或先于主句的行动；此译自然表达继续前行一小段距离，同时保留ὀλίγον所表示的短距离。
- source_word: εἶδεν
  choice: 看见
  rationale: 按ὁράω的普通叙事含义直译，不额外加入“注意到”等强调。
- source_word: Ἰάκωβον τὸν τοῦ Ζεβεδαίου
  choice: 西庇太的儿子雅各
  rationale: 定冠词加属格结构以父子关系说明雅各的身份；此表达符合现代汉语习惯。
- source_word: Ἰωάννην τὸν ἀδελφὸν αὐτοῦ
  choice: 雅各的兄弟约翰
  rationale: αὐτοῦ最自然地回指雅各；明确说出“雅各”可避免汉语代词指向含混。
- source_word: ἐν τῷ πλοίῳ
  choice: 在船上
  rationale: 定冠词指场景中与他们相关的那条船；汉语通常无需另译定冠词。
- source_word: καταρτίζοντας
  choice: 修补
  rationale: καταρτίζω可指使某物恢复妥善状态、整理或预备；在渔网语境中，“修补”最自然，但脚注保留其较宽的词义范围。
- source_word: τὰ δίκτυα
  choice: 渔网
  rationale: δίκτυα在此指捕鱼用的网；加“渔”能在汉语中自然明确其用途，而不添加所有关系。
- source_word: καὶ αὐτούς
  choice: 他们也
  rationale: αὐτούς是εἶδεν的另一个宾语，后接分词说明耶稣看见他们正在做的事；汉语改用分句“他们也……”较自然，并以“也”保留καί的关联作用。
