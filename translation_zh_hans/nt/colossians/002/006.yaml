  text: Ὡς οὖν παρελάβετε τὸν Χριστὸν Ἰησοῦν τὸν κύριον, ἐν αὐτῷ περιπατεῖτε,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/006.yaml
  text: Therefore[a], just as you received Messiah Jesus the Lord, walk in him,
translation:
  language: zh_hans
  text: 所以，你们怎样领受了弥赛亚耶稣，就是主，也要怎样在他里面行事为人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὡς
  choice: 怎样……也要怎样
  rationale: 以现代汉语的关联结构保留比较意味，把他们起初的领受与如今持续的生活方式相联系。
- source_word: οὖν
  choice: 所以
  rationale: 明确承接上文并引出推论，符合该词在此处的推论功能。
- source_word: παρελάβετε
  choice: 领受了
  rationale: 既可指领受所传的信息，也可指接纳所宣讲的那一位；“领受”保留这种宽度，且不把含义缩减为单纯的认知接受。
- source_word: τὸν Χριστὸν Ἰησοῦν τὸν κύριον
  choice: 主弥赛亚耶稣
  rationale: 将Χριστός按其称号意义译为“弥赛亚”，并用自然的汉语次序表达κύριος这一称号；不增添“以……为主”，以免把希腊文的同位称号结构解释为补语结构。
- source_word: ἐν αὐτῷ
  choice: 在他里面
  rationale: 保留保罗简洁而内涵丰富的联合用语，不扩写为“与他联合”，从而保留其空间隐喻和神学张力。
- source_word: περιπατεῖτε
  choice: 行事为人
  rationale: 在现代汉语中自然表达“行走”作为生活与品行的隐喻，并体现现在时命令所要求的持续生活方式。
theological_decisions:
- issue: Χριστός在称号组合中的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处带冠词并与“耶稣”“主”构成称号性表达，“弥赛亚”较直接呈现其受膏君王称号的意义；传统译法“基督”列入脚注。
- issue: τὸν κύριον与前面宾语的关系
  choice: 主弥赛亚耶稣
  alternative: 领受弥赛亚耶稣为主
  rationale: 希腊文可自然理解为同位称号。正文避免用“为主”明确设定补语关系，从而不超出原文作语法和神学上的限定。
- issue: ἐν αὐτῷ的联合语言
  choice: 在他里面
  alternative: 与他联合
  rationale: 直译保留原文的简洁和多重可能内涵，不将其化约为解释性措辞。
translation_notes:
  register: 采用庄重而可理解的现代标准汉语。“怎样……也要怎样”保留原文的比较结构；“行事为人”自然传达保罗以行走比喻生活方式的用法。
