id: COL.2.15
reference: Colossians 2:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἀπεκδυσάμενος τὰς ἀρχὰς καὶ τὰς ἐξουσίας ἐδειγμάτισεν ἐν παρρησίᾳ, θριαμβεύσας αὐτοὺς ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/015.yaml
  text: Having disarmed the rulers and the authorities, he made a public spectacle of them, triumphing over them in him.
translation:
  language: zh_hans
  text: 他解除了执政者和掌权者的武装[a]，把他们公开示众，并在他里面凯旋，胜过了他们[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “解除了……的武装”也可理解为“剥去了……”。
    reason: 提示 ἀπεκδυσάμενος 的字面图像和主要译法之间的关系。
  - marker: b
    text: “在他里面”也有人译作“借着他”；另有人把这里理解为“在十字架上”。
    reason: 保留 ἐν αὐτῷ 在介词意义及代词所指上的真实歧义。
lexical_decisions:
- source_word: ἀπεκδυσάμενος
  choice: 解除了……的武装
  rationale: 该分词本义涉及脱去、剥除；以军事胜利为语境时可表达解除敌对势力的武装，同时在脚注保留“剥去”的词义可能。
- source_word: τὰς ἀρχὰς καὶ τὰς ἐξουσίας
  choice: 执政者和掌权者
  rationale: 保留两个复数位格名词及其超自然权势的语感，不笼统改写为“邪恶势力”。
- source_word: ἐδειγμάτισεν ἐν παρρησίᾳ
  choice: 把他们公开示众
  rationale: 自然表达公开展示并使敌手蒙羞的胜利场景，不额外加入原文未明说的评价词。
- source_word: θριαμβεύσας αὐτοὺς
  choice: 凯旋，胜过了他们
  rationale: 表达罗马凯旋行列意象及对敌手的胜利；兼顾现代汉语可懂性，避免误解为敌手一同得胜。
- source_word: ἐν αὐτῷ
  choice: 在他里面
  rationale: 形式上保留介词短语和阳性代词，不擅自将其明确改成“十字架”或工具性的“借着他”。
theological_decisions:
- issue: 主要动词及分词的主语身份
  choice: 沿用上下文中的单数男性主语“他”，不在本节直接点明
  alternative: 明确译作“上帝”或“基督”
  rationale: 本节自身仅以动词形态延续上文主语；直接补出专名会消除上下文中需要判断的指涉。
- issue: ἐν αὐτῷ 的所指与关系
  choice: 译为“在他里面”
  alternative: “借着他”或“在十字架上”
  rationale: SBLGNT 为阳性/中性同形代词，语法与上下文存在解释空间；按所给审定方向保留“在他里面”，不把工具、领域或十字架所指单一定案。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“公开示众”“凯旋”保留古代胜利游行的画面；避免加入宗派性术语。
