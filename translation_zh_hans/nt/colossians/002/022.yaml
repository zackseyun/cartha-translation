  text: ἅ ἐστιν πάντα εἰς φθορὰν τῇ ἀποχρήσει, κατὰ τὰ ἐντάλματα καὶ διδασκαλίας τῶν ἀνθρώπων;
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/022.yaml
  text: These all perish with use[c][b][a], according to the commandments and teachings of men.
translation:
  language: zh_hans
  text: 这些东西都在使用中归于毁坏[a]；这些禁令是按照人的命令和教导而定的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这些东西都会在使用中毁坏。”希腊文可较紧凑地表达，重点在这些受规管之物是暂时且会被耗用的。
    reason: lexical_alternative
  - marker: b
    text: “人的命令和教导”很可能呼应《以赛亚书》29:13，强调这些禁令出于人，而不是出于神。
    reason: cross_reference
lexical_decisions:
- source_word: ἅ ἐστιν πάντα
  choice: 这些东西……都
  rationale: 中性复数关系代词回指上一节所禁戒接触、品尝、触摸的事物；用“这些东西”自然承接上下文，并明确其复数总括意义。
- source_word: εἰς φθοράν
  choice: 归于朽坏
  rationale: 保留εἰς所表达的趋向或结局，也涵盖φθορά在此可指朽坏、消逝或毁坏的语义，不把含义缩窄为单纯物理腐烂。
- source_word: τῇ ἀποχρήσει
  choice: 一经使用
  rationale: ἀπόχρησις指使用、用尽或消费；此处与φθορά连用，表示这些东西在使用中便被耗用。“一经使用”简洁表达这一情状，同时不强行限定为食用。
- source_word: κατὰ τὰ ἐντάλματα καὶ διδασκαλίας
  choice: 照着……命令和教导而定的
  rationale: κατά表示依据或准则；“命令和教导”分别保留ἐντάλματα的规条性和διδασκαλίαι的教导意义。汉语补出“这些规条……而定的”，使其与上一节的禁令衔接清楚。
- source_word: τῶν ἀνθρώπων
  choice: 人的
  rationale: 复数ἄνθρωποι在此泛指人类或人，与神形成来源上的对照；“人的”比“男人的”准确，也符合现代汉语。
theological_decisions:
- issue: 本节是在批评受禁之物，还是在批评禁戒规条
  choice: 正文既说明那些受规管之物会随使用而朽坏，也指出相关规条源于人的命令和教导。
  alternative: 可更紧凑地理解为：这些禁戒所涉及的东西全是用后即废的，而整套禁戒依循人的规条。
  rationale: 希腊文先以关系从句描述所指之物，随后用κατά短语指出禁戒的依据。译文保留两方面的批评，不把保罗的重点单独锁定在物品或规条之一。
- issue: 与以赛亚书29:13的呼应
  choice: 采用“人的命令和教导”，保留与七十士译本措辞的明显联系。
  alternative: 可译为“人的规条和训诲”，但会弱化ἐντάλματα与“命令”的直接对应。
  rationale: 这组措辞很可能呼应以赛亚书29:13，强调这些禁戒来自人而非神；脚注提示互文，但正文不把“呼应”提升为确定引文。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“归于朽坏”保留原文的趋向和较宽语义；分号呈现原句中解释受禁之物与评断规条来源的两层意思。补出“这些规条”属于汉语衔接所需，所指来自上一节。
