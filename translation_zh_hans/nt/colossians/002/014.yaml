source:
  edition: SBLGNT
  text: ἐξαλείψας τὸ καθ’ ἡμῶν χειρόγραφον τοῖς δόγμασιν ὃ ἦν ὑπεναντίον ἡμῖν, καὶ αὐτὸ ἦρκεν ἐκ τοῦ μέσου προσηλώσας αὐτὸ τῷ σταυρῷ·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/014.yaml
  text: having wiped out the record of debt against us in decrees[a], which was opposed to us, and he has taken it out of the way[b], having nailed it to the cross.
translation:
  language: zh_hans
  text: 他涂去了那份以规条为内容、原是与我们为敌的债务字据[a]；他又把它除掉，钉在十字架上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “债务字据”也可译作“欠据”或“书面凭据”。希腊词可指亲笔写成、确认债务或法律义务的文书。“以规条为内容”也可理解为“用规条写成”或“由规条构成”。
    reason: 说明 χειρόγραφον 的词义范围及 τοῖς δόγμασιν 的句法歧义。
  - marker: b
    text: “钉在十字架上”可理解为他除掉这字据的方式，也可理解为与除掉同时发生的行动。
    reason: 保留 προσηλώσας 与主要动词之间的语法关系。
lexical_decisions:
- source_word: ἐξαλείψας
  choice: 涂去了
  rationale: 保留擦除书写内容的具体意象，也表达使其失效、消除的语义；与下文“字据”自然呼应。
- source_word: χειρόγραφον
  choice: 债务字据
  rationale: 该词可指亲笔写成的欠据或承担义务的书面凭证。“债务字据”兼顾文书和负债两方面，不把它限定为摩西律法、罪单或某种特定法律文书。
- source_word: καθ’ ἡμῶν
  choice: 对我们不利
  rationale: 直接表达这份字据针对我们、构成不利约束；又避免与后面的“与我们为敌”完全重复。
- source_word: τοῖς δόγμασιν
  choice: 以规条为内容
  rationale: 这里的与格句法有歧义，可描述字据由规条构成或以规条表达。“以规条为内容”保留这种关联，不擅自把规条限定为某一套律法。
- source_word: ὑπεναντίον
  choice: 与我们为敌
  rationale: 传达其敌对、与人相反的强烈意味，同时符合现代汉语表达。
- source_word: ἦρκεν ἐκ τοῦ μέσου
  choice: 他把它从中除去
  rationale: 完成时表达已经完成而结果持续的行动；“从中除去”较贴近原文习语，也表明障碍已被移走。
- source_word: προσηλώσας
  choice: 把它钉在
  rationale: 在汉语中自然表达方式或伴随行动，并保留钉附的具体意象。
- source_word: τῷ σταυρῷ
  choice: 十字架上
  rationale: 这是本语境中 σταυρός 清楚、通行且符合历史处刑意象的译法。
theological_decisions:
- issue: χειρόγραφον τοῖς δόγμασιν 的含义
  choice: 一份以规条为内容、对我们不利的债务字据
  alternative: 摩西律法本身；罪债清单；法律控状
  rationale: 原文使用含有书面债务或义务的比喻，但具体所指有争议。译文保留“字据—债务—规条”的意象和张力，不将其纳入某一特定的律法、罪或圣约体系。
- issue: ἦρκεν 的主语
  choice: 译作“他”，承接上下文中的上帝
  alternative: 不明说行动者，采用近似无主句的表达
  rationale: 希腊文动词本身含有第三人称单数主语，上下文指向上帝；汉语明说“他”使句意清楚，而不额外加入神学判断。
- issue: 分词 προσηλώσας 与主要动词的关系
  choice: 译为“把它钉在十字架上”，表达除去字据的方式或伴随行动
  alternative: 明确译成“借着把它钉在十字架上”
  rationale: 原文分词可带方式或伴随意味。正文不加“借着”，以免过早排除句法上的细微开放性。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“债务字据”保持法律文书比喻；“规条”比“法令”更适合此处，却不限定其为摩西律法。将较长的希腊句拆成两句以提高可读性，并保留所有代词指向和十字架意象。
