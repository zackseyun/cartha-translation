  text: Μὴ οὖν τις ὑμᾶς κρινέτω ἐν βρώσει ⸀ἢ ἐν πόσει ἢ ἐν μέρει ἑορτῆς ἢ νουμηνίας ἢ σαββάτων,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/016.yaml
  text: Therefore[a], let no one judge you in food or in drink[c][b], or with regard to a festival or a new moon or Sabbaths.
translation:
  language: zh_hans
  text: 所以，不要让任何人在饮食[b]上，或在有关节期、新月[c]或安息日[a]的事上论断你们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为复数，可指每周反复来到的安息日。
    reason: lexical_alternative
  - marker: b
    text: 即关于食物和饮品的规定；原文也可理解为“吃喝”。
    reason: cultural_note
  - marker: c
    text: “节期、新月、安息日”呼应犹太宗教历法中每年、每月和每周的日子；“新月”指新月之日及其相关的月朔观察。
    reason: cross_reference
lexical_decisions:
- source_word: Μὴ οὖν τις ὑμᾶς κρινέτω
  choice: 所以，不要让任何人……评断你们
  rationale: οὖν承接上文并作推论，译为“所以”；μή与第三人称命令式构成禁令。“评断”表达κρίνω在此按宗教规条衡量、论断人的含义，同时不擅自强化为定罪。
- source_word: ἐν βρώσει ἢ ἐν πόσει
  choice: 在饮食上
  rationale: βρῶσις与πόσις既可指吃喝行为，也可指食物和饮品；上下文涉及规条类别，现代汉语合译“饮食”简洁自然，并由脚注说明。
- source_word: ἐν μέρει ἑορτῆς
  choice: 在节期……的事上
  rationale: ἐν μέρει在此是“关于、就……而言”的惯用表达，不译作“节期的一部分”；ἑορτή指宗教节期。
- source_word: νουμηνίας
  choice: 初一
  rationale: 该词指每月新月之日及其宗教礼仪；“初一”是中文圣经语境中自然且准确的历法表达，脚注补明新月节庆含义。
- source_word: σαββάτων
  choice: 安息日
  rationale: 希腊文为复数形式，可概括反复出现的每周安息日；汉语类别名词通常无需显出复数，因此译作“安息日”，并以脚注交代原文形式及历法序列。
theological_decisions:
- issue: 所列饮食和历法实践的性质
  choice: 本节禁止别人以这些事项评断信徒，但不在译文中断言这些实践已被绝对废除。
  alternative: 译成这些礼仪本身已经彻底无效，或限定为仅指人为、禁欲主义的规条。
  rationale: 希腊文的直接重点是不可在饮食与特定日子的事上评断人；单凭本节不能完全解决这些礼仪是否延续的更广泛神学问题。
- issue: σαββάτων的范围
  choice: 保留概括性的“安息日”，理解为年度、月度、每周宗教历法序列中的每周项目。
  alternative: 译作“各安息日”以明确复数，或将其扩大解释为所有安息制度。
  rationale: 复数形式属于常见的“节期—初一—安息日”历法三联语；中文用单数类别名词较自然，也不额外界定其神学范围。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“评断”比单纯“判断”更能体现对人的负面宗教评判，又避免过度强化为司法性的“定罪”。将“饮食”合并表达汉语习惯；以脚注保留原文两项并列及可能指吃喝行为的歧义。脚注标记均置于相应主文词语之后。
