  text: ἅτινά ἐστιν λόγον μὲν ἔχοντα σοφίας ἐν ἐθελοθρησκίᾳ καὶ ταπεινοφροσύνῃ καὶ ἀφειδίᾳ σώματος, οὐκ ἐν τιμῇ τινι πρὸς πλησμονὴν τῆς σαρκός.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/023.yaml
  text: These indeed have an appearance of wisdom in self-made religion and humility and harsh treatment of the body[d][c][b][a], but are of no value against the indulgence of the flesh.
translation:
  language: zh_hans
  text: 这些规条在自创的宗教礼仪、谦卑和严酷对待身体上，的确显得有智慧[a][b]，但对于克制肉体的放纵[c][d]，毫无价值。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“的确有智慧之名。”
    reason: lexical_alternative
  - marker: b
    text: “自创的宗教礼仪”也可译作“自定的敬拜”；传统上有“随己意的敬拜”之意。
    reason: lexical_alternative
  - marker: c
    text: 末句的希腊文意思很难确定。也可译作：“却毫无任何尊荣，为要满足肉体”，或“却不给身体任何尊重，虽是为了抑制肉体的饱足”。
    reason: alternative_reading
  - marker: d
    text: 这里的“肉体”可能指堕落之人的欲望；可参照保罗在其他语境中对这个词的用法。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅτινά
  choice: 这些规条
  rationale: 回指21—22节所说的禁令；补出“规条”使现代汉语指代清楚。
- source_word: λόγον μὲν ἔχοντα σοφίας
  choice: 的确显得有智慧
  rationale: λόγον ἔχειν在此表示具有名声、说法或表象；结合μέν的让步意味，译为“的确显得”既自然又不认定其真有智慧。
- source_word: ἐθελοθρησκίᾳ
  choice: 自定的敬拜
  rationale: 这个罕见词指由人的意愿自行设定的宗教敬拜；“自定的敬拜”保留敬拜层面的含义及负面语境。
- source_word: ταπεινοφροσύνῃ
  choice: 谦卑
  rationale: 保留该词通常的词义，不在正文中直接解释为虚假的自我贬抑，让上下文表达反讽。
- source_word: ἀφειδίᾳ σώματος
  choice: 严酷对待身体
  rationale: 表达毫不顾惜身体的苦待和禁欲严苛，比直译“不给身体宽待”更符合现代汉语。
- source_word: οὐκ ἐν τιμῇ τινι
  choice: 毫无价值
  rationale: 按上下文将τιμή理解为效用或价值，与前文“显得有智慧”形成转折；希腊文结构的其他可能理解收入脚注。
- source_word: πρὸς πλησμονὴν
  choice: 对于克制……的放纵
  rationale: 在主流语境理解中，整句指出这些做法不能有效抵制或约束肉体的满足；汉语补出“克制”以表达πρός所关联的对抗关系。
- source_word: τῆς σαρκός
  choice: 肉体
  rationale: 保留σάρξ的神学张力，不直接改译为“罪性”或“邪欲”；此处可能指堕落的人欲，另以脚注说明。
theological_decisions:
- issue: 难解末句 οὐκ ἐν τιμῇ τινι πρὸς πλησμονὴν τῆς σαρκός 的含义
  choice: 这些禁欲规条对于克制肉体的放纵毫无价值。
  alternative: 它们并不尊重身体，反而满足肉体；或：它们虽然意在抑制肉体的饱足，却不给身体任何尊重。
  rationale: 希腊文高度压缩，句法和语义均有争议。正文采用最切合上下文论证的理解：这些规条貌似有智慧，却无力约束肉体的欲望；脚注保留其他真实可能，避免将争议静默定论。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“自定的敬拜”比“自创宗教”更贴近θρησκεία的敬拜含义；“严酷对待身体”清楚表达禁欲行为。脚注标记按相关短语自然排列，并全部在正文出现。
