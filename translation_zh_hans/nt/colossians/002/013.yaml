  text: καὶ ὑμᾶς νεκροὺς ὄντας ⸀ἐν τοῖς παραπτώμασιν καὶ τῇ ἀκροβυστίᾳ τῆς σαρκὸς ὑμῶν, συνεζωοποίησεν ὑμᾶς σὺν αὐτῷ· χαρισάμενος ἡμῖν πάντα τὰ παραπτώματα,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/013.yaml
  text: And you[a], being dead in your trespasses and the uncircumcision of your flesh, he made alive together with him, having forgiven us all our trespasses[c][b],
translation:
  language: zh_hans
  text: 你们从前死在过犯和肉身未受割礼的状态[a]中，神使你们与他一同活过来，赦免了我们[b]一切的过犯。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “肉身未受割礼的状态”首先指他们身体上未受割礼，但在本段语境中也带有属灵意味。
    reason: cultural_note
  - marker: b
    text: 希腊文在这里由“你们”转为“我们”：神“赦免了我们一切的过犯”。
    reason: lexical_alternative
lexical_decisions:
- source_word: νεκροὺς ὄντας
  choice: 从前死在
  rationale: 用自然的现代汉语表达持续处于死亡状态的分词结构；“从前”由全句过去处境与如今活过来的对比显明。
- source_word: ἐν τοῖς παραπτώμασιν
  choice: 死在过犯中
  rationale: 保留ἐν所表达的处境或范围，不把它单纯解释成因果关系；“过犯”也便于前后保持词汇一致。
- source_word: ἀκροβυστίᾳ τῆς σαρκὸς ὑμῶν
  choice: 肉身未受割礼的状态
  rationale: ἀκροβυστία在此首先指身体未受割礼的状态；译作“肉身”保留具体含义及其可能具有的属灵意味，避免直接释为“罪性”。
- source_word: συνεζωοποίησεν ὑμᾶς σὺν αὐτῷ
  choice: 使你们与他一同活过来
  rationale: 既表达复合动词的“使……活过来”，又保留σύν所强调的与他一同得生命。
- source_word: χαρισάμενος
  choice: 并且赦免了
  rationale: 按上下文表达与主句紧密相连的恩慈赦免行动；“赦免”准确传达此处χαρίζομαι的语义。
- source_word: ἡμῖν
  choice: 我们
  rationale: 忠实保留希腊文由第二人称“你们”转为第一人称复数“我们”的变化，不擅自统一人称。
- source_word: πάντα τὰ παραπτώματα
  choice: 一切的过犯
  rationale: “一切”保留πάντα的全括性，并重复“过犯”以对应前面的同一希腊词。
theological_decisions:
- issue: τῆς σαρκὸς ὑμῶν中σάρξ的含义
  choice: 肉身
  alternative: 罪性
  rationale: 紧接上下文关于割礼的论述，本短语首先涉及身体未受割礼；保留“肉身”也不排除语境中的属灵意味，而“罪性”会过早限定解释。
- issue: σὺν αὐτῷ中αὐτῷ的所指
  choice: 保留代词“他”
  alternative: 明确译作“基督”
  rationale: 2:12的上下文表明所指最可能是基督，但原文在本节使用代词；保留代词可忠实呈现原文，同时由上下文确定所指。
- issue: 主句未明说之施事者
  choice: 补出“神”
  alternative: 仅译“他”
  rationale: 希腊文动词主语由上文2:12使基督从死人中复活的神承接而来。汉语若完全省略主语容易生硬或误读，补出“神”属于语境所要求的明示。
- issue: “你们”转为“我们”
  choice: 保留人称转换
  alternative: 统一为“你们”或“我们”
  rationale: 原文明确由ὑμᾶς转为ἡμῖν；该变化可能把陈述由歌罗西信徒扩展到包括保罗在内的众信徒，不应在翻译中消除。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“活过来”比“使之复活”更贴近本句与基督一同得生命的表达；保留“过犯”“肉身”“割礼”等经文核心术语，并用“状态”帮助普通读者理解抽象名词ἀκροβυστία。脚注标记均置于相关主文中。
