  yaml_path: translation/nt/colossians/002/017.yaml
  text: These are a shadow of the things to come[b][a], but the body is Messiah's.
translation:
  language: zh_hans
  text: 这些是将来之事的影子；但实体是弥赛亚的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较字面地译作：“但身体（或形体）是弥赛亚的。”这里“实体”表达σῶμα与“影子”相对的含义。
    reason: 保留σῶμα的字面译法，并说明正文在影子／实体比喻中的表达；不把属格τοῦ Χριστοῦ改写为“实体就是弥赛亚”。
lexical_decisions:
- source_word: ἅ
  choice: 这些
  rationale: 中性复数关系代词回指上一节所说的饮食、节期、朔日和安息日等事；用“这些”自然承接上文。
- source_word: σκιὰ
  choice: 影子
  rationale: 保留原文“影子”与“形体”的比喻对照，表达前者是后者所投下的轮廓。
- source_word: τῶν μελλόντων
  choice: 将来之事
  rationale: 带冠词的分词作名词使用；此译保留其面向将来的含义，不限定为某一种末世或应验观。
- source_word: δὲ
  choice: 却
  rationale: 表达影子与形体之间鲜明而自然的转折。
- source_word: σῶμα
  choice: 形体
  rationale: σῶμα通常指身体或形体；在与“影子”的对照中，“形体”既保留具体比喻，也能暗示与影子相对的实体，而不直接把解释写入正文。
- source_word: τοῦ Χριστοῦ
  choice: 是弥赛亚的
  rationale: 属格结构简约，原文省略第二个系词；“是弥赛亚的”保留平行句式和所属关系，并将Χριστός按称号译为“弥赛亚”。
theological_decisions:
- issue: σῶμα在“影子”对照中的含义
  choice: 译作“形体”，保留身体/实体之间的比喻张力。
  alternative: 译作“实体”或“实质”，明确指向影子所对应的真实。
  rationale: 原词本义是身体，在此又可能借影子与投影之物的关系表达真实或实质。“形体”避免过早排除其具体意象，也不把某一神学解释定为唯一含义。
- issue: τοῦ Χριστοῦ的关系
  choice: 译作“是弥赛亚的”，按所属关系理解。
  alternative: 译作“就是弥赛亚”，把弥赛亚本人视为与影子相对的形体或实体。
  rationale: 希腊语属格最直接可表达所属，但句法简略，另一种关系理解也有人提出；正文采用较直接的属格表达，脚注提示另一可能。
- issue: Χριστοῦ的称号性质
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处Χριστός带有称号意义；“弥赛亚”明确传达“受膏者”的身份，同时不加入宗派性解释。
translation_notes:
  register: 采用庄重而通顺的现代普通话。“不过……却……”清楚呈现对照；“形体”略带书面色彩，但普通读者可懂，并能维持原文影子与身体/实体之间的意象。
