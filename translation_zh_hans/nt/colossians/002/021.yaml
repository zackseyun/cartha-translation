  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不可触摸，不可尝，不可触碰。”第一个动词（ἅψῃ）也可译为“触摸”或“抓住”；正文译作“拿”，以便与后面的“触碰”（θίγῃς）有所区别。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ
  choice: 不可
  rationale: μή与不定过去时虚拟语气构成禁令；“不可”简洁庄重，也适合连续列举规则的语体。
- source_word: ἅψῃ
  choice: 拿取
  rationale: ἅπτω的中间语态可指“触摸”或“抓住、拿取”。译作“拿取”既保留其可能的取用意味，也与末后的θίγῃς有所区别。
- source_word: μηδὲ
  choice: 不可……不可……
  rationale: 重复的μηδέ连接一连串否定禁令。汉语以重复“不可”比逐字译作“也不”更自然，并保留累积、急促的修辞效果。
- source_word: γεύσῃ
  choice: 尝
  rationale: γεύομαι的直接意义是“品尝”；此处无需扩大为“吃”或“享用”。
- source_word: θίγῃς
  choice: 触碰
  rationale: θιγγάνω通常表示接触、触摸。译作“触碰”自然清楚，并与前面的“拿取”区别开来。
theological_decisions:
- issue: 这些禁令在上下文中的性质
  choice: 保留为引语式、简短突兀的三项禁令，不补出对象或解释。
  alternative: 译成“这个不可拿取，那个不可尝，也不可触碰”，或明确补成“人的规条说”。
  rationale: 本节希腊文只有三项简短禁令；补充对象或来源会把上下文解释写进经文本身，并消解原文刻意保留的简略性。
translation_notes:
  register: 采用现代、简洁而庄重的规则语体。三个分句重复“不可”，保留原文排比式的急促节奏；不用“勿”以免过于文言，也不补出原文没有的宾语。
