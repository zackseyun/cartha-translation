  text: ὅτι ἐν αὐτῷ κατοικεῖ πᾶν τὸ πλήρωμα τῆς θεότητος σωματικῶς,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/009.yaml
  text: For in him all the fullness of deity dwells bodily,[a]
translation:
  language: zh_hans
  text: 因为神性的一切丰盛，都有形有体地住在他里面。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“神本性一切的丰盛，都有形有体地住在他里面。”
    reason: 提供θεότης与πᾶν τὸ πλήρωμα的另一种自然表达；“神本性”凸显作为神的本质，“一切的丰盛”凸显整体性。
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 在上下文中引出前述警告的根据；“因为”自然保留其因果作用。
- source_word: ἐν αὐτῷ
  choice: 在他里面
  rationale: 直接表达处所关系，所指为基督；不增添原文没有的排他含义。
- source_word: κατοικεῖ
  choice: 住
  rationale: 表达持续、安居的含义；与“在他里面”搭配自然，也不削弱神住在基督里的分量。
- source_word: πᾶν τὸ πλήρωμα
  choice: 一切丰盛
  rationale: 兼顾πᾶν所表达的全然性与πλήρωμα的“丰盛、充满”之义，中文简洁自然。
- source_word: τῆς θεότητος
  choice: 神性
  rationale: θεότης指作为神的本性或实质，语力强于泛指“神圣性质”；“神性”在现代中文中准确而易懂。
- source_word: σωματικῶς
  choice: 有形有体地
  rationale: 保留副词所强调的身体性和具体性，又避免擅自把它限定为仅指道成肉身的某一阶段或其他特定解释。
theological_decisions:
- issue: θεότης与σωματικῶς所表达的基督论含义
  choice: 本节宣告神性全部的丰盛有形有体地住在基督里面。
  alternative: 仅指某些神圣属性或神的同在住在基督里面。
  rationale: θεότης是表示神之本性或实质的强词，πᾶν τὸ πλήρωμα强调完全无缺；σωματικῶς则保留其身体性的表达。译文应呈现这一高基督论宣告，同时不超出原文去界定其全部方式。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“有形有体地”虽带有传统圣经语感，但在本句中能简明保存σωματικῶς的身体性；脚注提供更显明表达“神本性”和整体性的译法。
