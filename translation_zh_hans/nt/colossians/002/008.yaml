  text: Βλέπετε μή τις ὑμᾶς ἔσται ὁ συλαγωγῶν διὰ τῆς φιλοσοφίας καὶ κενῆς ἀπάτης κατὰ τὴν παράδοσιν τῶν ἀνθρώπων, κατὰ τὰ στοιχεῖα τοῦ κόσμου καὶ οὐ κατὰ Χριστόν·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/008.yaml
  text: See to it that no one takes you captive through philosophy and empty deceit[a], according to human tradition, according to the elemental principles of the world[b], and not according to Messiah.
translation:
  language: zh_hans
  text: 你们要谨慎，免得有人借着哲学和虚空的欺骗[a]把你们掳去；这种哲学和欺骗是照着人的传统，照着世上的基本原理[b]，不是照着基督。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “哲学和虚空的欺骗”也可理解为“哲学，就是虚空的欺骗”；原文并未明确两者是否为同位关系。
    reason: 保留καί连接两个名词时可能存在的句法歧义。
  - marker: b
    text: “世上的基本原理”也可译作“世上的元素”或“世上的元素之灵”。原文可指基本元素或原理，也可能指宇宙性的灵界势力。
    reason: 保留στοιχεῖα τοῦ κόσμου的重要语义与神学歧义。
lexical_decisions:
- source_word: Βλέπετε μή τις
  choice: 你们要谨慎，免得有人
  rationale: Βλέπετε在这里是复数命令式，带有警戒意味；“要谨慎，免得”自然表达对潜在威胁的告诫。
- source_word: ἔσται ὁ συλαγωγῶν
  choice: 把你们掳去
  rationale: συλαγωγέω原指把人当作战利品掳走；“掳去”保留鲜明的俘虏隐喻，也符合现代汉语圣经语体。
- source_word: διὰ τῆς φιλοσοφίας καὶ κενῆς ἀπάτης
  choice: 借着哲学和空洞的欺骗
  rationale: 保留两个由καί连接的名词表达，不武断地把“哲学”解释为“空洞的欺骗”的同位语；“借着”体现διά加属格所表达的手段。
- source_word: φιλοσοφίας
  choice: 哲学
  rationale: 采用希腊词在现代汉语中的常规对应词，不将其缩窄为某一特定学派或一般性的思想。
- source_word: κενῆς ἀπάτης
  choice: 空洞的欺骗
  rationale: “空洞”表达κενός所含的空虚、无实质之意，“欺骗”直接对应ἀπάτη。
- source_word: κατὰ τὴν παράδοσιν τῶν ἀνθρώπων
  choice: 依照人的传统
  rationale: κατά在此表示依据或准则；“人的”是泛指人类来源，并非特指男性。
- source_word: κατὰ τὰ στοιχεῖα τοῦ κόσμου
  choice: 依照世上的元素之理
  rationale: στοιχεῖα语义有争议，可指基本元素、初步原理，也可能指宇宙灵力。“元素之理”在正文中尽量保留其关于基本构成或支配原理的开放性，脚注列出重要替代解释。
- source_word: οὐ κατὰ Χριστόν
  choice: 而不是依照基督
  rationale: Χριστός在中文基督教语境中以“基督”自然保留其受膏者称号含义；句中它是与人的传统及世上元素之理相对的准则。
theological_decisions:
- issue: στοιχεῖα τοῦ κόσμου的含义
  choice: 世上的元素之理
  alternative: 世上的元素之灵／世上的基本原理
  rationale: 保罗书信中这一短语可能指世界的基本构成或原则，也可能指宇宙性的灵界势力。正文不明确人格化，脚注保留“元素之灵”这一重要理解，以免消除原文的神学张力。
- issue: Χριστός是称号还是专名
  choice: 基督
  alternative: 弥赛亚
  rationale: “基督”是Χριστός在现代中文圣经语体中的直接、通行译法，同时本身承载“受膏者”的称号背景；这里不需另行改译为“弥赛亚”。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“掳去”保留原文的俘虏隐喻；分号使后半句的两项依据与“不是依照基督”的对照关系更清晰。所有脚注标记均已置于正文。
