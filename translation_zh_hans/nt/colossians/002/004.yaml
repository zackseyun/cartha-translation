  text: ⸀τοῦτο λέγω ἵνα ⸀μηδεὶς ὑμᾶς παραλογίζηται ἐν πιθανολογίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/004.yaml
  text: I say this so that no one may deceive you with persuasive argument.
translation:
  language: zh_hans
  text: 我说这话，是免得有人用有说服力的言辞欺骗你们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“用似乎有理的论辩”，或“用听来可信的话”。
    reason: πιθανολογία既可强调言辞具有说服力，也可强调其貌似合理、听来可信；正文与脚注共同保留这一语义幅度。
lexical_decisions:
- source_word: τοῦτο λέγω
  choice: 我说这话
  rationale: τοῦτο为中性单数，回指前文所说的内容；译作“这话”既自然，也不把所指范围限定得过窄。λέγω用简洁的现在时“说”表达。
- source_word: ἵνα μηδεὶς
  choice: 是免得有人
  rationale: ἵνα在此引出目的；与否定词μηδεὶς结合，现代汉语用“免得有人”可自然表达“为要使无人”的意思。
- source_word: ὑμᾶς
  choice: 你们
  rationale: 明确保留希腊语第二人称复数，指歌罗西信徒群体。
- source_word: παραλογίζηται
  choice: 欺骗
  rationale: 该动词在这里指借错误或误导性的推理使人受骗；“欺骗”清楚自然，并由后面的短语说明所用手段。
- source_word: ἐν πιθανολογίᾳ
  choice: 用有说服力的言辞
  rationale: ἐν表示手段或方式；πιθανολογία指听来可信、足以劝服人的言谈或论说。“有说服力的言辞”保留其修辞吸引力，而不擅自把它译成某一种特定教义或哲学体系。脚注补充“似乎有理”等可能译法，以呈现其“貌似可信”的语义侧重。
theological_decisions:
- issue: παραλογίζηται ἐν πιθανολογίᾳ所警告的对象
  choice: 笼统地警告信徒不要被具有说服力的言辞欺骗
  alternative: 明确译成对“虚假哲学”或单纯“华丽辞藻”的警告
  rationale: 本节本身没有点名某一思想体系，也不只批评文辞华丽；译文应保留其一般性的警告，让上下文进一步说明威胁的性质。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我说这话，是免得……”符合书信劝诫语气；避免使用“花言巧语”，因为该说法容易额外引入浮夸、谄媚或明显不诚实的含义。
