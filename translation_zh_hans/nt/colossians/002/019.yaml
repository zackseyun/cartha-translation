revisions:
- from: 却不持定元首[a]。全身靠着他，借着关节和韧带得着供应，并联结在一起[b]，就以上帝的成长而成长[c]。
  to: 却不紧紧持守元首；全身从他那里，借着关节和韧带得着供应并联结在一起，就以出于上帝的成长而成长。
  rationale: 修订恢复原句与前文的从属、连续关系，保持“元首—身体—关节和韧带”的比喻及两个被动分词的并列。末句采用“以出于上帝的成长而成长”：既保留希腊文动词与名词的重复，也避免“上帝的成长”在现代中文中所产生的错误指向。脚注保留可行的词汇替代和属格说明。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T03:56:14Z'
review_pass:
  verdict: revise
  source_fidelity: 草稿正确表达了“元首”与“全身”的身体隐喻，也保留了借关节和韧带获得供应、联结的基本结构。但将 καὶ οὐ κρατῶν τὴν κεφαλήν 断为独立句，削弱了它与前文所指之人的连续关系；更重要的是“以上帝的成长而成长”在中文中会自然理解为“上帝自身的成长”，不合 τοῦ θεοῦ 在此最可能表示来源的用法。
  naturalness: “却不持定元首。全身靠着他”句法断裂，且“以上帝的成长而成长”不符合现代汉语搭配。改为分号连接的连续句，并用“出于上帝的成长”保留原文同根重复，同时使来源关系可理解。
  terminology: “元首”“关节”“韧带”庄重、通行，且适合本节的身体隐喻。“紧紧持守”比“持定”更自然地传达 κρατῶν 的牢固依附；“得着供应并联结在一起”保留两个被动分词的并列。
  issues:
  - severity: high
    issue: “以上帝的成长而成长”可能表示上帝自己在成长。
    rationale: τοῦ θεοῦ 的属格虽有一定语义弹性，但在本句中最自然是来源关系；中文“上帝的成长”没有保留这种可接受的张力，反而造成与上下文不符的歧义。
  - severity: medium
    issue: 首句以句号截断 συμμε词结构。
    rationale: καὶ οὐ κρατῶν τὴν κεφαλήν 是承接上文对错误实践者的描述，不宜在中文中成为完整独立句；以分号衔接能更好保留原文句法关系。
  - severity: low
    issue: “持定”在现代汉语中较生硬。
    rationale: “紧紧持守”自然表达持续牢靠地抓住、依附的比喻意义，且不增加解释。
  revised_text: 却不紧紧持守元首；全身从他那里，借着关节和韧带得着供应并联结在一起，就以出于上帝的成长而成长。
  revised_footnotes:
  - marker: a
    text: 或译：“紧紧依附元首。”
    reason: κρατῶν 可指牢牢持守，也可强调持续依附。
  - marker: b
    text: “得着供应”也可译为“得到滋养”；“联结在一起”也可译为“结合在一起”或“连成一体”。
    reason: ἐπιχορηγούμενον 表示得到供应、扶助；συμβιβαζόμενον 表示被结合、连成协调的整体。
  - marker: c
    text: 直译近于“以（或按）上帝的成长而成长”。这里的“上帝”通常理解为成长的来源，即“出于上帝的成长”；原文属格本身较为凝练。
    reason: 说明 αὔξει 与 αὔξησιν 的同根重复，并交代 τοῦ θεοῦ 最可能的来源含义，而不把属格形式误解为上帝自身成长。
  revision_rationale: 修订恢复原句与前文的从属、连续关系，保持“元首—身体—关节和韧带”的比喻及两个被动分词的并列。末句采用“以出于上帝的成长而成长”：既保留希腊文动词与名词的重复，也避免“上帝的成长”在现代中文中所产生的错误指向。脚注保留可行的词汇替代和属格说明。
