  text: καὶ οὐ κρατῶν τὴν κεφαλήν, ἐξ οὗ πᾶν τὸ σῶμα διὰ τῶν ἁφῶν καὶ συνδέσμων ἐπιχορηγούμενον καὶ συμβιβαζόμενον αὔξει τὴν αὔξησιν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/019.yaml
  text: and not holding fast to the Head[a], from whom the whole body, being supplied and held together through the joints and ligaments[c][b], grows with the growth of God.
translation:
  language: zh_hans
  text: 却不紧紧持守元首；全身从他那里，借着关节和韧带得着供应并联结在一起，就以出于上帝的成长而成长。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κρατῶν
  choice: 持定
  rationale: 表达牢牢抓住并持续依附的含义，比单说“抓住”更能体现此处关系性的隐喻。
- source_word: κεφαλήν
  choice: 元首
  rationale: 在身体隐喻中指作为头的基督；“元首”既保留领属意味，也符合庄重而通行的中文表达。
- source_word: ἐξ οὗ
  choice: 靠着他
  rationale: 阳性关系代词回指“元首”；“靠着他”自然表达全身以元首为来源和依托。
- source_word: πᾶν τὸ σῶμα
  choice: 全身
  rationale: 简洁保留一个完整身体的整体意象。
- source_word: ἁφῶν
  choice: 关节
  rationale: 在解剖性的身体隐喻中，指各部分接触、衔接之处；“关节”是最自然的现代中文。
- source_word: συνδέσμων
  choice: 韧带
  rationale: 该词指把各部分系在一起之物；“韧带”准确延续身体意象。
- source_word: ἐπιχορηγούμενον
  choice: 得着供应
  rationale: 保留被动意义及广义的供给、扶持，不把含义收窄为仅仅得到滋养。
- source_word: συμβιβαζόμενον
  choice: 联结在一起
  rationale: 表达各部分被结合为协调整体的结构性意义。
- source_word: αὔξει
  choice: 成长
  rationale: 与身体意象吻合，也在中文中自然承接同根名词“成长”。
- source_word: τὴν αὔξησιν τοῦ θεοῦ
  choice: 以上帝的成长而成长
  rationale: 贴近希腊文同根动词与名词及属格的紧凑表达，在正文中保留属格可能表示来源、归属或性质的张力，再由脚注说明通常理解。
theological_decisions:
- issue: τὴν αὔξησιν τοῦ θεοῦ 中属格 τοῦ θεοῦ 的含义
  choice: 正文译作“以上帝的成长而成长”，保留属格的形式与张力
  alternative: 按着上帝所赐的成长而成长
  rationale: 上下文很可能表示成长来自上帝，而不是上帝自己成长；但希腊文只用属格，并未明说“赐下”。正文不把一种解释直接写死，脚注则交代较自然的来源理解。
translation_notes:
  register: 采用现代、庄重而可理解的中文。“持定元首”保留保罗身体与头的核心隐喻；末句有意保留原文同根反复及属格张力，并以脚注帮助普通读者理解。
