  text: καὶ ἐστὲ ἐν αὐτῷ πεπληρωμένοι, ὅς ἐστιν ἡ κεφαλὴ πάσης ἀρχῆς καὶ ἐξουσίας,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/010.yaml
  text: and in him you have been made full, who is the head of every ruler and authority.
translation:
  language: zh_hans
  text: 并且，你们在他里面已经得了丰盛[a]；他是一切统治者和掌权者的头[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“已经被充满”或“已经达到丰盛”。
    reason: lexical_alternative
  - marker: b
    text: “头”保留了希腊文的比喻；这里的意思是，他居于一切统治者和掌权者之上。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: 并且
  rationale: 保留与上文的连接，表明本节继续前一节关于基督里一切丰盛的论述。
- source_word: ἐστὲ … πεπληρωμένοι
  choice: 已经得了丰盛
  rationale: 以“已经”表达完成动作所产生的当前状态，以“得了丰盛”保留 πληρόω 与上一节“丰盛”主题的词义联系，同时避免把它窄化为无所欠缺或无罪完全等特定教义。
- source_word: ἐν αὐτῷ
  choice: 在他里面
  rationale: 保留保罗简洁而富有神学含义的表达，指向信徒与基督的联合或在基督里的地位，不在正文中加以展开解释。
- source_word: ὅς ἐστιν
  choice: 他是
  rationale: 希腊文关系代词所指的是基督；汉语分句以“他是”承接，更自然清楚。
- source_word: ἡ κεφαλή
  choice: 头
  rationale: 直接保留希腊文“头”的比喻；本语境含有居首和至高的意义，但正文不以“统治者”之类解释性词语取代原比喻。
- source_word: πάσης ἀρχῆς καὶ ἐξουσίας
  choice: 一切统治者和掌权者
  rationale: 在歌罗西书的语境中，这组词指具有统治权和权柄的势力或存在；采用现代读者易懂的称谓，并以“一切”表达全面涵盖。
theological_decisions:
- issue: 信徒在基督里“得了丰盛”的含义
  choice: 保留信徒在基督里已经得享丰盛、现今处于这一状态的宽广表述
  alternative: 译作“已经完全”或“已经被充满”，并进一步理解为救恩上一无所缺、领受神性丰盛，或达到无罪完全
  rationale: 原文承接上一节基督里神性一切的丰盛，却未在本节具体界定这种丰盛的各层含义；译文应维持其丰富性和张力，不导入某一后来的教义体系。
- issue: 基督作为 κεφαλή 与各样权势的关系
  choice: 正文保留“头”的比喻，理解为基督居于一切统治者和掌权者之上
  alternative: 把 κεφαλή 解释为一切统治者和掌权者的“源头”
  rationale: 在本段涉及宇宙权势的语境中，居首和至高的意义更为突出；但为了不过度解释，正文仍保留原文比喻，并在脚注说明。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“在他里面”保留保罗惯用的浓缩表达；“得了丰盛”与上文形成词义呼应。用分号自然连接关于信徒与关于基督的两个分句。
