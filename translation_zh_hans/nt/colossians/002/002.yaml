  source_fidelity: 正文基本准确地表达了目的、在爱中的联结、悟性带来的确信与对上帝奥秘的认识。但“悟性所带来的一切丰盛确信”在汉语中修饰关系不清，容易读成“悟性带来丰盛”，未清楚呈现“悟性之充分确信的丰富”。末尾用破折号保留所给短读法中“上帝的奥秘，弥赛亚”的压缩同位关系，避免“就是”所带来的过强释义。
  naturalness: “并得着悟性所带来的一切丰盛确信”搭配生硬且有歧义。调整为“并得着由悟性而来的充分确信的一切丰盛”后，层次较清晰，也保持庄重、现代的书面普通话。脚注标记应紧贴各自所说明的词语或短语，而非全部置于句末。
  terminology: “心”“爱”“奥秘”“上帝”“弥赛亚”均恰当，并与项目术语取向一致。“充分确信”比单用“确信”更完整地反映 πληροφορίας 的强化。“弥赛亚”保留 Χριστός 的称号性质。
