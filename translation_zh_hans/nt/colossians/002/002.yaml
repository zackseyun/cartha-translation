revisions:
- from: 为要使他们的心得到鼓励，在爱中紧密联结，并得着悟性所带来的一切丰盛确信，进而认识上帝的奥秘，就是弥赛亚。[a][b][c][d]
  to: 为要使他们的心得到鼓励，在爱中彼此紧密联结[a]，并得着由悟性而来的充分确信的一切丰盛，以认识[b]上帝的奥秘——弥赛亚[c][d]。
  rationale: 修订“充分确信”短语的汉语层次，令其较准确对应连续属格结构；以“以认识”表达第二个 εἰς 所指向的目标。将“就是弥赛亚”改为破折号同位，既可读又不过度消解所给短读法的句法压缩与解释空间。重置脚注锚点，并校正异文注释的中文表述。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T03:56:27Z'
review_pass:
