id: COL.2.2
reference: Colossians 2:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἵνα παρακληθῶσιν αἱ καρδίαι αὐτῶν, ⸀συμβιβασθέντες ἐν ἀγάπῃ καὶ εἰς ⸂πᾶν πλοῦτος⸃ τῆς πληροφορίας τῆς συνέσεως, εἰς ἐπίγνωσιν τοῦ μυστηρίου τοῦ ⸀θεοῦ, Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/002.yaml
  text: so that their hearts may be encouraged[a], having been knit together in love and unto all the riches of the full assurance of understanding, unto the knowledge of the mystery of God, Messiah[d][c][b],
translation:
  language: zh_hans
  text: 为要使他们的心得到鼓励，在爱中彼此紧密联结[a]，并得着由悟性而来的充分确信的一切丰盛，以认识[b]上帝的奥秘——弥赛亚[c][d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “紧密联结”也可译作“联合在一起”。原词可指人们被带到一起或紧密结合。
    reason: lexical_alternative
  - marker: b
    text: “认识”也可译作“充分认识”；希腊词 ἐπίγνωσις 有时带有更深入或更完全认识的意味。
    reason: lexical_alternative
  - marker: c
    text: 希腊原文十分简练，直译近似“上帝的奥秘，弥赛亚”。本译文以破折号呈现其可能的同位关系；也保留原文的简练。
    reason: alternative_reading
  - marker: d
    text: 有些抄本采用较长的读法，如“上帝（即父）和弥赛亚的奥秘”。本译文依照所提供希腊文本的较短读法。
    reason: textual_variant
lexical_decisions:
- source_word: παρακληθῶσιν
  choice: 得到鼓励
  rationale: 此处涵盖内在的鼓舞、安慰与坚固；“得到鼓励”在现代汉语中自然，也不过度缩窄词义。
- source_word: καρδίαι
  choice: 心
  rationale: 保留圣经常用的人论隐喻，所指不只情感，也包括人的内在生命。
- source_word: συμβιβασθέντες
  choice: 紧密联结
  rationale: 结合“在爱中”，这里主要表示被带到一起、彼此联合；“紧密联结”自然地保留关系性的意象。
- source_word: ἐν ἀγάπῃ
  choice: 在爱中
  rationale: 保留介词短语，表达爱是他们联结的领域或纽带。
- source_word: εἰς πᾶν πλοῦτος
  choice: 得着……一切丰盛
  rationale: 以目的或结果性的表达传达 εἰς；“一切丰盛”反映 πᾶν πλοῦτος 的强调，同时符合现代汉语。
- source_word: πληροφορίας
  choice: 确信
  rationale: 表示充分、坚定的把握，而非单纯拥有信息；“确信”简洁地传达这种确定性。
- source_word: συνέσεως
  choice: 悟性
  rationale: 指理解、洞察的能力；“悟性”适合本段智慧与认识的语境。
- source_word: ἐπίγνωσιν
  choice: 认识
  rationale: 表示真实、深入的认识；正文用自然的“认识”，其可能含有强化意味则留在脚注说明。
- source_word: μυστηρίου
  choice: 奥秘
  rationale: 这是保罗书信中指上帝曾隐藏、如今启示之旨意的惯用表达。
- source_word: θεοῦ, Χριστοῦ
  choice: 上帝的奥秘，就是弥赛亚
  rationale: 将 Χριστοῦ 理解为同位语，以“就是”使压缩的希腊结构在汉语中可懂，同时用“弥赛亚”保留 Χριστός 的称号性质。
theological_decisions:
- issue: τοῦ μυστηρίου τοῦ θεοῦ, Χριστοῦ 中 Χριστοῦ 的句法关系
  choice: 将“弥赛亚”理解为同位语，即上帝的奥秘就是弥赛亚
  alternative: 保留为较含混的“上帝的奥秘，弥赛亚”；或按较长异文译作“上帝，就是父，并弥赛亚的奥秘”等
  rationale: 所给 SBLGNT 短读法最自然地容许同位关系；汉语若完全照排会晦涩，因此正文以“就是”明示此关系，并用脚注承认原文的简练和其他理解空间。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“心得到鼓励”“在爱中紧密联结”保留原文的人论和关系性意象；两个 εἰς 依汉语逻辑处理为递进的目标与结果（“并得着……进而认识”），避免生硬重复。“弥赛亚”作为称号处理。所有脚注标记均置于正文相关句末。
