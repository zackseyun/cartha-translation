id: COL.2.1
reference: Colossians 2:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Θέλω γὰρ ὑμᾶς εἰδέναι ἡλίκον ἀγῶνα ἔχω ⸀ὑπὲρ ὑμῶν καὶ τῶν ἐν Λαοδικείᾳ καὶ ὅσοι οὐχ ἑόρακαν τὸ πρόσωπόν μου ἐν σαρκί,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/001.yaml
  text: For I want you to know how great a struggle I have for you and for those in Laodicea[a], and for all who have not seen my face in the flesh,
translation:
  language: zh_hans
  text: 因为我愿意你们知道，我为你们、为在老底嘉的人，以及为所有未曾亲身见过我的人[a]，所付出的努力有多大。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“未曾在肉身中见过我的面”。这里指未曾亲身、实际见过我。
    reason: 说明τὸ πρόσωπόν μου和ἐν σαρκί的字面形式，并表明本句所指是身体上的实际在场。
lexical_decisions:
- source_word: Θέλω γὰρ
  choice: 因为我愿意
  rationale: “因为”保留γάρ与上文的解释性联系；“我愿意”自然表达θέλω的意愿语气，并保持书信体的庄重。
- source_word: ὑμᾶς εἰδέναι
  choice: 你们知道
  rationale: 按现代汉语习惯，将θέλω所支配的不定式结构译为“我愿意你们知道”，直接保留原文意思。
- source_word: ἡλίκον ἀγῶνα
  choice: 有多么艰苦的奋斗
  rationale: ἡλίκον强调程度之大；ἀγών在此指付出艰苦努力的争战或奋斗，并非字面意义的体育竞赛。“艰苦的奋斗”兼顾其强度与现代汉语的可懂度。
- source_word: ἔχω ὑπὲρ ὑμῶν
  choice: 我为你们……有
  rationale: ὑπέρ表示为某人的益处或缘故；保留“为”，并使之与ἀγών构成“为……有……奋斗”的整体表达。
- source_word: τῶν ἐν Λαοδικείᾳ
  choice: 老底嘉的人
  rationale: 冠词加介词短语在此作名词使用，指身处老底嘉的人；采用现代中文常见地名“老底嘉”。
- source_word: ὅσοι οὐχ ἑόρακαν
  choice: 所有未曾……见过……的人
  rationale: “所有”体现ὅσοι的周延范围；“未曾见过”表达完成时所指截至当时仍无此经历。
- source_word: τὸ πρόσωπόν μου
  choice: 当面见过我
  rationale: πρόσωπον字面为“面”，在此与“见”构成亲身相见的表达；译作“当面见过我”比“见过我的面”更符合现代汉语，同时不改变所指。
- source_word: ἐν σαρκί
  choice: 当面
  rationale: 此处ἐν σαρκί指身体实际在场，而非“肉体”作为道德意义上的罪性。“当面”自然传达亲身相见之意，字面形式则在脚注中说明。
theological_decisions:
- issue: 非比喻语境中σάρξ的译法
  choice: 正文译“当面”，脚注注明原文直译“在肉身中”
  alternative: 在肉身中见过我的面
  rationale: ἐν σαρκί在这里强调保罗身体实际在场，不涉及“罪性”等伦理或神学含义。中文若直译“在肉身中见过我的面”明显生硬，因此正文采用自然的“当面”，脚注保留原文意象和可替代译法。
translation_notes:
  register: 采用现代、庄重而易懂的书信体。“艰苦的奋斗”保留ἀγών的争战意象与强度；并列结构重复“为”，使较长句子层次清楚。脚注标记紧随其所解释的“未曾当面见过我的人”。
