source:
  edition: SBLGNT
  text: μηδεὶς ὑμᾶς καταβραβευέτω θέλων ἐν ταπεινοφροσύνῃ καὶ θρησκείᾳ τῶν ἀγγέλων, ⸀ἃ ἑόρακεν ἐμβατεύων, εἰκῇ φυσιούμενος ὑπὸ τοῦ νοὸς τῆς σαρκὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/018.yaml
  text: Let no one disqualify you[a], delighting in humility and the worship of angels, dwelling on what he has seen, vainly puffed up by the mind of his flesh[c][b],
translation:
  language: zh_hans
  text: 不要让任何人以谦卑和敬拜天使[a]为乐，使你们失去资格[b]。这样的人详述自己所见的事[c]，因自己属肉体的心思而毫无根据地自高自大[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “敬拜天使”也可理解为“天使所行的敬拜”或“与天使一同敬拜”。这里的希腊语属格关系可以有不同理解。
    reason: alternative_reading
  - marker: b
    text: “使你们失去资格”也可译作“夺去你们的奖赏”或“判你们不合格”。原词带有裁判作出不利裁决的意味。
    reason: lexical_alternative
  - marker: c
    text: “详述自己所见的事”也可译作“沉迷于自己所见的事”或“进入自己所见的事”。这里的希腊语动词罕见，含义难以确定。
    reason: lexical_alternative
  - marker: d
    text: 有些抄本作“自己未见的”，意思类似“对自己未见的事大谈特谈”。
    reason: textual_variant
lexical_decisions:
- source_word: καταβραβευέτω
  choice: 取消你们的资格
  rationale: 该动词有裁判作出不利裁决、使人失去资格或奖赏之意；此译法简洁自然，并保留竞赛裁决的背景。
- source_word: θέλων ἐν
  choice: 凭着自己所喜好的
  rationale: θέλων在此可能表示乐意、偏爱或执意选择；译文表达其自选并以之为乐的倾向，而不只译作一般的“愿意”。
- source_word: ταπεινοφροσύνῃ
  choice: 谦卑
  rationale: 保留该词通常的词义；上下文足以显出这种谦卑受到保罗批评，不在正文中直接加入“假装”或“苦待己身”等解释。
- source_word: θρησκείᾳ τῶν ἀγγέλων
  choice: 对天使的敬拜
  rationale: 正文采用较直接且常见的受事属格理解，即敬拜以天使为对象；原文属格关系的歧义在脚注中保留。
- source_word: ἃ ἑόρακεν ἐμβατεύων
  choice: 沉迷于自己所见的
  rationale: ἐμβατεύω罕见且含义困难，可能指进入、详述或专注于异象经验；“沉迷于”在现代汉语中自然，也能传达持续专注而不把具体情形说死。
- source_word: εἰκῇ
  choice: 毫无根据地
  rationale: 该副词可表示无缘无故、徒然；这里修饰自高自大，强调其骄傲没有真实根据。
- source_word: φυσιούμενος
  choice: 吹得自高自大
  rationale: 保留保罗所用“膨胀”的比喻，同时以现代汉语清楚表达骄傲自负。
- source_word: νοὸς τῆς σαρκὸς αὐτοῦ
  choice: 属肉体的心思
  rationale: 用“属肉体的”保留σάρξ与人的肉体取向之间的联系，避免直接释为体系化的“罪性”；“心思”自然表达νοῦς。
theological_decisions:
- issue: θρησκείᾳ τῶν ἀγγέλων中属格的含义
  choice: 对天使的敬拜，即敬拜以天使为对象
  alternative: 天使所行的敬拜，或与天使一同敬拜
  rationale: 受事属格在警戒错误宗教实践的语境中较为直接，但语法上不能排除主事或伴随性的理解，故以脚注保持开放。
- issue: τῆς σαρκὸς αὐτοῦ中σάρξ的解释
  choice: 属肉体的
  alternative: 罪恶本性的
  rationale: 不把保罗含有张力的σάρξ预先归结为某一套教义术语；译文仍清楚表示这种心思受肉体取向支配。
- issue: ἃ ἑόρακεν的文本异文
  choice: 自己所见的
  alternative: 自己未见的
  rationale: 正文依SBLGNT所采用的读法；部分抄本加入否定词，形成明显不同的意思，因此在脚注中说明。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。正文避免生硬直译“他肉体的心”，改作“属肉体的心思”，同时保留σάρξ的词义张力。所有脚注标记均置于正文相应位置；关于天使敬拜的歧义应以[d]标示。
