  text: Εἰ ἀπεθάνετε σὺν Χριστῷ ἀπὸ τῶν στοιχείων τοῦ κόσμου, τί ὡς ζῶντες ἐν κόσμῳ δογματίζεσθε·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/020.yaml
  text: 'If you died with the Messiah from the elemental principles of the world[a], why, as if living in the world[b], are you submitting yourselves to decrees:'
translation:
  language: zh_hans
  text: 你们若与基督一同死了，脱离了世上的基本原则[a]，为什么还像活在世上一样，受规条约束[b]呢：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“世上的灵界势力”；也可译：“世上的基本成分”。
    reason: στοιχεῖα含义有争议，可能指初步原则、基本成分或宇宙性的灵界势力。
  - marker: b
    text: 或译：“你们为什么服从规条呢？”
    reason: δογματίζεσθε可按中间或被动意味理解。
lexical_decisions:
- source_word: Εἰ
  choice: 若
  rationale: 保留希腊文条件句形式；上下文虽可能视条件为事实，正文不把它直接改成“既然”。
- source_word: ἀπεθάνετε σὺν Χριστῷ
  choice: 与基督一同死了
  rationale: 以自然中文表达简单过去时所指向的决定性事件，并保留与基督联合的含义。中文传统与现代读者通常以“基督”表达此称号。
- source_word: ἀπὸ
  choice: 脱离了
  rationale: ἀπό在这里表示分离；“脱离”比单独的“从”更能自然表达死亡所带来的断开关系。
- source_word: τῶν στοιχείων τοῦ κόσμου
  choice: 世上的基本法则
  rationale: στοιχεῖα可指基本成分、初步原则，也可能指宇宙性的灵界势力；正文用“基本法则”贴合本段规条语境，同时以脚注保留其他可能。
- source_word: τί ὡς ζῶντες ἐν κόσμῳ
  choice: 为什么还像活在世上一样
  rationale: 保留反问和ὡς所表达的假设性比较；“还”使中文衔接自然，但不改变论证。
- source_word: δογματίζεσθε
  choice: 让规条辖制你们
  rationale: 该中间／被动形式可表示受规条约束，也可带有自行服从的意味；正文采用自然的被动容许式表达，另一种理解列入脚注。
theological_decisions:
- issue: 保罗所说στοιχεῖα的含义
  choice: 正文译作“基本法则”
  alternative: “灵界势力”或“基本成分”
  rationale: 此词可能同时涉及世界的初步秩序、宗教规条及属灵权势。正文不将其明确人格化，脚注则保留真实的释义张力。
- issue: δογματίζεσθε的语态含义
  choice: 译作“让规条辖制你们”
  alternative: “你们为什么服从规条”或“为什么受规条辖制”
  rationale: 希腊文形式容许被动和反身意味；主译文兼顾读者的参与和规条施加的约束，不把语态争议完全消解。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“基督”“规条”“辖制”符合经文论辩语境；问号结束本节，同时保留其与下一节所列禁令的紧密衔接。
