  text: συνταφέντες αὐτῷ ἐν τῷ ⸀βαπτισμῷ, ἐν ᾧ καὶ συνηγέρθητε διὰ τῆς πίστεως τῆς ἐνεργείας τοῦ θεοῦ τοῦ ἐγείραντος αὐτὸν ⸀ἐκ νεκρῶν·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/012.yaml
  text: having been buried with him in baptism[a], in which you also were raised with him through faith in the working of God[b], who raised him from the dead.
translation:
  language: zh_hans
  text: 你们既在洗礼中与他一同被埋葬，也在这洗礼中借着对上帝所施行的作为的信心，与他一同复活；这位上帝曾使他从死人中复活。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνταφέντες αὐτῷ
  choice: 与他一同埋葬
  rationale: 保留不定过去时被动分词的完成意味和 συν- 所表达的“与……一同”，并以自然的现代汉语承接上下文。
- source_word: ἐν τῷ βαπτισμῷ
  choice: 在洗礼中
  rationale: “在……中”保留 ἐν 在此处兼具范围与途径色彩的开放性，不把经文限定为某一种宗派性的洗礼观。
- source_word: ἐν ᾧ
  choice: 在其中
  rationale: 最近且最自然的先行词是“洗礼”；“其中”既符合句法，也避免把关系过度解释为纯粹工具意义。
- source_word: συνηγέρθητε
  choice: 与他一同复活
  rationale: 明确表达 συν- 的共同参与含义；“他”由复合动词及紧邻语境补出。被动意义由上帝使基督复活的后续分句表明。
- source_word: διὰ τῆς πίστεως
  choice: 借着……信心
  rationale: διά 加属格表示途径或媒介；“信心”是 πίστις 在此语境中自然且通行的译法。
- source_word: τῆς ἐνεργείας τοῦ θεοῦ
  choice: 对上帝作为的
  rationale: 将属格理解为信心所指向的对象，即信靠上帝有效施行的工作；“作为”比“运作”更自然，也不把 ἐνέργεια 缩减为抽象的能力。
- source_word: τοῦ ἐγείραντος αὐτὸν ἐκ νεκρῶν
  choice: 上帝使他从死人中复活了
  rationale: 把希腊语修饰“上帝”的分词结构转换为独立分句，使中文清楚流畅，同时保留上帝是使基督复活者这一含义；“从死人中”比单说“从死里”更贴近复数 νεκρῶν。
theological_decisions:
- issue: ἐν ᾧ 的所指
  choice: 正文按最近先行词译为指洗礼的“在其中”
  alternative: 可理解为指弥赛亚的“在他里面”
  rationale: βαπτισμῷ 是最近的语法先行词，因此正文采用此解；脚注保留指向弥赛亚的真实可能，不消除经文中洗礼与联合于基督之间的张力。
- issue: 洗礼、信心与一同复活的关系
  choice: 保留洗礼、信心和上帝作为之间的紧密联系，不界定其圣礼机制
  alternative: 将其明确解释为圣礼本身产生功效，或仅仅象征已经发生的事实
  rationale: 原文确实把一同埋葬和一同复活与洗礼及信心相连，却没有在本节中裁定后世宗派关于洗礼功效的争论。
- issue: πίστις 与上帝作为的关系
  choice: 译作“对上帝作为的信心”
  alternative: 可较字面地译作“借着上帝作为所产生的信心”，或把 πίστις 译作“信靠”
  rationale: 属格链在形式上容许不同关系，但语境最自然地表达信心以上帝使基督复活的作为为对象；不将其解释为人的功德或抽象认同。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“一同埋葬／一同复活”形成清晰对应；后半句拆为分号后的独立分句，以避免多重属格和分词在中文中造成歧义。称谓使用“上帝”，代词“他”依上下文指弥赛亚。
