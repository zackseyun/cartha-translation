revisions:
- from: 在他里面[a]，你们也受了非人手所行的割礼[b]，就是脱去肉体的身体[c][d]，受弥赛亚的割礼[e]。
  to: 在他里面[a]，你们也受了非人手所行的割礼[b]，就是在脱去肉体的身体[c][d]、在弥赛亚的割礼[e]中所受的割礼。
  rationale: 修订只调整汉语句法：以“就是在……、在……中所受的割礼”将两个平行的ἐν短语共同连回“受了……割礼”。这避免把最后一短语误读为第二次受割礼，也不决定“弥赛亚的割礼”究竟是弥赛亚所施行、属于弥赛亚，还是与弥赛亚相关。其余关键词及脚注锚点均予保留；脚注a改为更直接的形式替代。
