  text: ἐν ᾧ καὶ περιετμήθητε περιτομῇ ἀχειροποιήτῳ ἐν τῇ ἀπεκδύσει τοῦ ⸀σώματος τῆς σαρκός, ἐν τῇ περιτομῇ τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/011.yaml
  text: In him you also were circumcised with a circumcision not made by hands[a], in the removal of the body of flesh, in the circumcision of Messiah[e][d][c][b],
translation:
  language: zh_hans
  text: 在他里面[a]，你们也受了非人手所行的割礼[b]，就是在脱去肉体的身体[c][d]、在弥赛亚的割礼[e]中所受的割礼。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在谁里面。”所指的是上文的弥赛亚。
    reason: lexical_alternative
  - marker: b
    text: 或译：“不是人手所做的割礼。”
    reason: lexical_alternative
  - marker: c
    text: “脱去”也可译作“剥除”或“除掉”。
    reason: lexical_alternative
  - marker: d
    text: “肉体”有时可按语境解释为受罪支配的本性，但这里保留希腊语较直译的表达。
    reason: lexical_alternative
  - marker: e
    text: 或译：“由弥赛亚所施行的割礼”或“弥赛亚自己的割礼”。希腊语可指弥赛亚所施行、所属，或与他相关的割礼。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ
  choice: 在他里面
  rationale: 关系代词所指的是上文的弥赛亚；译文保留“在他里面”这一与弥赛亚联合的表达。
- source_word: περιετμήθητε
  choice: 你们受了……割礼
  rationale: 按不定过去时被动直陈语气，表达已经发生在受事者身上的行动，并保留割礼的比喻。
- source_word: περιτομῇ ἀχειροποιήτῳ
  choice: 非人手所行的割礼
  rationale: 既保留非人力施行的对比，也比逐字的“非手造”更符合现代汉语。
- source_word: ἐν τῇ ἀπεκδύσει
  choice: 就是脱去
  rationale: ἀπέκδυσις表示脱下、除去；用“脱去”保留衣物剥脱的意象。“就是”将此短语与前面的属灵割礼相连，同时不展开其具体教义含义。
- source_word: τοῦ σώματος τῆς σαρκός
  choice: 肉体的身体
  rationale: 保留希腊语不寻常的属格结构，不擅自限定为肉身、罪性或犯罪的身体。
- source_word: σάρξ
  choice: 肉体
  rationale: “肉体”保留保罗用语的多义性，避免直接解释为“罪性”。
- source_word: ἐν τῇ περιτομῇ τοῦ Χριστοῦ
  choice: 受弥赛亚的割礼
  rationale: “弥赛亚的割礼”保留τοῦ Χριστοῦ的属格开放性，可指弥赛亚所施行、所属或与他相关的割礼；“受”承接本句的被动动词，使汉语通顺。
theological_decisions:
- issue: “弥赛亚的割礼”的含义
  choice: 保留为开放的属格“弥赛亚的割礼”
  alternative: 弥赛亚所施行的割礼；弥赛亚自己所受的割礼；属于弥赛亚群体的新约割礼
  rationale: 希腊语τοῦ Χριστοῦ本身未明确属格关系，且上下文把信徒的属灵割礼与他们在弥赛亚里面相连，因此不把经文限定为某一种解释。
- issue: “肉体的身体”的含义
  choice: 保留原文较生硬而多义的表达
  alternative: 属肉体的身体；罪性的身体；有罪肉体的身体
  rationale: SBLGNT的正文没有后期抄本所见的扩充；直译关键名词可避免把保罗的人论预先解释为某一特定体系。
translation_notes:
  register: 采用现代、庄重而可朗读的书面普通话。“非人手所行”保留圣经语体但不显古奥；“肉体的身体”和“弥赛亚的割礼”刻意保留原文的解释张力。
