  yaml_path: translation/nt/colossians/002/003.yaml
  text: in whom are hidden all the treasures of wisdom and knowledge[a][b].
translation:
  language: zh_hans
  text: 在他里面，智慧和知识的一切宝藏都隐藏着[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在这奥秘里”；若把关系代词理解为更宽泛地回指“上帝的奥秘”，而不是专指基督本人。
    reason: alternative_reading
  - marker: b
    text: “隐藏着”也可译作“储藏着”；希腊语这个词既可表示隐藏，也可含有保留、存放之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: 在他里面
  rationale: 关系代词为阳性或中性与格单数；就近最自然地回指2:2的基督，因此正文采用人格性的“他”，并以“在……里面”保留ἐν的空间性表达。更宽泛地回指“上帝的奥秘”在语法和语境上仍有可能，故列入脚注。
- source_word: πάντες οἱ θησαυροὶ
  choice: 一切宝藏
  rationale: 冠词加复数名词构成明确的集合性表达；“一切宝藏”自然地保留原文全面、总括的语气。
- source_word: τῆς σοφίας καὶ γνώσεως
  choice: 智慧和知识的
  rationale: 分别译出σοφία与γνῶσις，不将两个相关却有区别的概念合并；汉语中将所属成分前置，形成自然表达。
- source_word: ἀπόκρυφοι
  choice: 隐藏着
  rationale: 该词可指隐藏、隐蔽，也可带有珍藏或留存之意；正文用中性的“隐藏着”，避免断定这些宝藏是不可接近的秘密，或只是为人储存备用。
- source_word: εἰσιν ... ἀπόκρυφοι
  choice: 都隐藏着
  rationale: 将系词与表语形容词按现代汉语习惯译为状态谓语“隐藏着”；“都”对应πάντες的总括范围。
theological_decisions:
- issue: ἀπόκρυφοι是强调秘传性质，还是强调智慧与知识稳妥地存于基督里
  choice: 用“隐藏着”保持中性，不进一步解释其可接近性或隐秘对象
  alternative: 译作“珍藏着”以强调存留和可供取用，或译作“隐秘的”以强调对外人隐藏
  rationale: 上下文可能针对声称拥有特殊知识的人，但该形容词本身不足以确定完整的神学含义；译文应保留这种张力。
- issue: ἐν ᾧ的先行词是基督本人，还是更宽泛的“上帝的奥秘”
  choice: 正文按就近的人格性先行词译作“在他里面”
  alternative: 若回指较宽泛的“上帝的奥秘”，可译作“在这奥秘里”
  rationale: 2:2中紧邻的“基督”使人格性回指最为自然，但希腊文关系代词的形式并未排除对更宽泛概念的理解，故用脚注保留。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“在他里面”延续保罗书信常见的联合或领域表达，不扩写其神学含义；“智慧和知识的一切宝藏”保持原文修饰关系，“都隐藏着”则符合自然汉语语序。
