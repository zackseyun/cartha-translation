  text: ἐρριζωμένοι καὶ ἐποικοδομούμενοι ἐν αὐτῷ καὶ ⸀βεβαιούμενοι τῇ πίστει καθὼς ἐδιδάχθητε, ⸀περισσεύοντες ἐν εὐχαριστίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/007.yaml
  text: having been rooted and being built up in him[a], and being established in the faith just as you were taught, overflowing with thanksgiving.
translation:
  language: zh_hans
  text: 你们既已在他里面扎根，又正在被建造，并且照着所受的教导，在信仰[a]上不断得以坚固，满有感恩。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“信心”；也可译“忠信”。希腊词 πίστις 可指信、信靠或忠信；这里的定冠词以及“照着你们所受的教导”较支持“信仰”，即他们所领受的信仰内容。
    reason: 保留 πίστις 的词义范围及可能的不同理解。
lexical_decisions:
- source_word: ἐρριζωμένοι
  choice: 已经扎根
  rationale: 保留农业比喻，并以“已经”体现完成时分词所表达的既成行动及其持续结果。
- source_word: ἐποικοδομούμενοι
  choice: 正在被建造
  rationale: 保留建筑比喻和被动语态；“正在”体现现在时分词所表达的持续过程。
- source_word: ἐν αὐτῷ
  choice: 在他里面
  rationale: 原文使用代词，指向上文的基督；译文保留代词及保罗书信中“在……里面”的联合含义。其位置可自然涵盖“扎根”和“被建造”两个并列分词。
- source_word: βεβαιούμενοι
  choice: 不断得以坚固
  rationale: 表达被确立、变得稳固的含义，并以“不断”反映现在时分词的持续性。
- source_word: τῇ πίστει
  choice: 在信仰上
  rationale: 定冠词及下文“照着你们所受的教导”较支持所传授、所信之道这一客观含义；“信仰”在现代汉语中比单用“信”更自然，同时不排除信靠的层面。
- source_word: καθὼς ἐδιδάχθητε
  choice: 照着你们所受的教导
  rationale: 自然表达 καθώς 的对应或准则意味，并保留受教的被动含义。
- source_word: περισσεύοντες
  choice: 满怀
  rationale: 在“感恩”这一搭配中，“满怀”自然表达充盈、丰盛之意，也与前面持续性的分词链相协调。
- source_word: ἐν εὐχαριστίᾳ
  choice: 感恩
  rationale: 以现代汉语的自然表达传达 εὐχαριστία 的感谢、感恩之意，避免生硬直译介词 ἐν。
theological_decisions:
- issue: τῇ πίστει 的含义
  choice: 信仰，主要指他们所受教导的信仰内容或所信之道
  alternative: 信心，指个人的信靠；或忠信
  rationale: 定冠词及紧接的“照着你们所受的教导”较支持客观的信仰内容，但 πίστις 本身可指信、信靠或忠信，因此用脚注保留真实的词义张力，不将其限定为某一宗派解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留“扎根”与“建造”两个并置的原文比喻，并用“已经”与“正在／不断”区分完成时和现在时分词的体貌。整句承接上一节的劝勉，因此保留分词式推进，而不另加原文没有的命令语气。
