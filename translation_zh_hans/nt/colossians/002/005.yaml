id: COL.2.5
reference: Colossians 2:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἰ γὰρ καὶ τῇ σαρκὶ ἄπειμι, ἀλλὰ τῷ πνεύματι σὺν ὑμῖν εἰμι, χαίρων καὶ βλέπων ὑμῶν τὴν τάξιν καὶ τὸ στερέωμα τῆς εἰς Χριστὸν πίστεως ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/005.yaml
  text: For even if I am absent in the flesh[a], yet I am with you in spirit[c][b], rejoicing and seeing your good order and the firmness of your faith in Messiah.
translation:
  language: zh_hans
  text: 我虽然肉身不在你们那里，灵里却与你们同在，欢喜地看到你们秩序井然，也看到你们对弥赛亚的信心坚定[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你们对弥赛亚的信心坚定”也可理解为“你们对弥赛亚忠信不移”。
    reason: alternative_reading
lexical_decisions:
- source_word: τῇ σαρκί
  choice: 肉身
  rationale: 这里指保罗身体上的缺席，并非伦理意义上的“罪性”；与下文“灵里”形成直接对照。
- source_word: τῷ πνεύματι
  choice: 灵里
  rationale: 在与“肉身”对照的语境中，最自然地指保罗非身体层面的同在；不明确限定为圣灵，以保留原文可能的张力。
- source_word: χαίρων καὶ βλέπων
  choice: 欢喜地看到
  rationale: 两个现在分词描述与“同在”同时发生的状态；中文合并为自然的状语结构，同时保留喜乐与看见两层意思。
- source_word: τὴν τάξιν
  choice: 秩序井然
  rationale: 表达群体中良好、有条理的状态，既传达褒义，也避免过度强化军事纪律色彩。
- source_word: τὸ στερέωμα
  choice: 坚定
  rationale: 该词表示牢固、稳固；译为“信心坚定”符合现代汉语习惯，并保留稳定坚实的意象。
- source_word: πίστεως
  choice: 信心
  rationale: 在此结构中，译作对弥赛亚的“信心”最为自然；“忠信”仍是可能的词义，故在脚注中说明。
- source_word: εἰς Χριστόν
  choice: 对弥赛亚
  rationale: εἰς标明信心所指向的对象；Χριστός在这里保留头衔含义，译作“弥赛亚”。
theological_decisions:
- issue: “肉身不在……灵里同在”中“灵”的所指
  choice: 正文译作“灵里”，理解为保罗虽身体缺席，却在灵里与他们同在
  alternative: 指保罗借着圣灵与他们同在
  rationale: 上下文的直接对照支持身体与非身体层面的个人同在；“灵里”不加限定，可避免把原文未明说的机制确定化。
- issue: Χριστόν的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处该词仍可清楚理解为头衔，译作“弥赛亚”保留其称号意义。
- issue: πίστις的语义
  choice: 信心
  alternative: 忠信
  rationale: “对弥赛亚的信心”是该结构中最自然的理解，但πίστις也可能带有忠信、忠诚的意味，因此以脚注保存另一种可能。
translation_notes:
  register: 采用现代、庄重而自然的书面汉语。“我虽然……却……”准确呈现让步结构；将两个并列宾语分别译为“你们秩序井然”和“你们……信心坚定”，使中文清楚流畅。
