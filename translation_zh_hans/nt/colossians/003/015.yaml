id: COL.3.15
reference: Colossians 3:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἡ εἰρήνη τοῦ ⸀Χριστοῦ βραβευέτω ἐν ταῖς καρδίαις ὑμῶν, εἰς ἣν καὶ ἐκλήθητε ἐν ἑνὶ σώματι· καὶ εὐχάριστοι γίνεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/015.yaml
  text: And let the peace of Messiah rule in your hearts[a], to which indeed you were called in one body[c][b]. And be thankful.
translation:
  language: zh_hans
  text: 要让弥赛亚[a]的平安在你们心里作主[b]；你们也正是为这平安蒙召，在一个身体里[c]。你们要心存感恩。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“基督”。希腊语Χριστός意为“受膏者”，可作为称号译作“弥赛亚”。
    reason: lexical_alternative
  - marker: b
    text: “作主”所译的动词也可指“担任裁判”或“作出裁决”，强调弥赛亚的平安在群体内心生活中起裁定和支配作用。
    reason: lexical_alternative
  - marker: c
    text: 或理解为“进入一个身体”，突出蒙召的人被纳入同一个群体。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰρήνη
  choice: 平安
  rationale: 这是保罗书信中常用的表达，既可指内在安宁，也包含群体关系和好、完整无损的意味；“平安”自然且能保留这些层面。
- source_word: τοῦ Χριστοῦ
  choice: 弥赛亚的
  rationale: Χριστός在这里仍有“受膏者”这一称号的意义；译作“弥赛亚”可保留其称号性质，并在脚注列出传统译法“基督”。
- source_word: βραβευέτω
  choice: 作主
  rationale: 该动词本可描写裁判作出裁决；这里引申为让弥赛亚的平安发挥支配、裁定的作用。“作主”符合现代汉语劝勉语气，又没有抹去其治理意味。
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: 在你们心里
  rationale: 保留原文复数领属和圣经中“心”所指的内在思想、情感与意志，同时“你们”也维持群体语境。
- source_word: εἰς ἣν
  choice: 为这平安
  rationale: 将关系代词明确回指“平安”，并把εἰς表达的目标意味译为“为”，但不把它扩展成额外的神学解释。
- source_word: καὶ ἐκλήθητε
  choice: 也正是……蒙召
  rationale: 这里的καί带有强调意味；“也正是”在汉语中自然传达这一强调。
- source_word: ἐν ἑνὶ σώματι
  choice: 在一个身体里
  rationale: 直译ἐν加与格并保留保罗的身体隐喻，不在正文中径直解释为“教会”；“进入一个身体”的可能理解收入脚注。
- source_word: εὐχάριστοι γίνεσθε
  choice: 要心存感恩
  rationale: 自然表达持续成为感恩之人的劝勉，比生硬的“成为感恩的”更符合现代汉语，同时保留命令语气。
theological_decisions:
- issue: Χριστοῦ的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 正文保留“受膏者”称号的语义力度；传统且常见的“基督”作为脚注异译，避免把两者误作不同对象。
- issue: “一个身体”的所指
  choice: 保留身体隐喻，不在正文解释
  alternative: 明确译作“一个教会”
  rationale: 上下文暗示群体性的教会合一，但原文仍使用“身体”这一隐喻；保留它可避免把含义缩窄或过早解释。
- issue: ἐν ἑνὶ σώματι与蒙召的关系
  choice: 在一个身体里蒙召归向平安
  alternative: 蒙召进入一个身体
  rationale: 正文依照ἐν的通常用法译为所在的群体范围，同时以脚注保留“进入一个身体”的方向性理解。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“作主”“蒙召”“心存感恩”具有适度的圣经语体，但普通读者仍易于理解；分号呈现前两句之间紧密的劝勉与解释关系。
