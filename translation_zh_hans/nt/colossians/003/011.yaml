revisions:
- from: 在这里，不再分希腊人和犹太人、受割礼的和未受割礼的、外族人和斯基泰人[a]、奴隶和自由人；唯有弥赛亚[b]是一切，也在一切之中[c]。
  to: 在这里并不分希腊人和犹太人、受割礼的和未受割礼的、蛮族人和斯基泰人[a]、奴隶和自由人；唯有弥赛亚[b]是一切，也在一切之中[c]。
  rationale: 将“不再分”改为“并不分”，避免原文未明示的时间性；将“外族人”改为“蛮族人”，并修订历史脚注以如实说明 βάρβαρος 的古代文化色彩而不把它当作对群体的客观评价。其余措辞维持原稿对原文结构、对举和神学开放性的忠实呈现。
