id: COL.3.11
reference: Colossians 3:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὅπου οὐκ ἔνι Ἕλλην καὶ Ἰουδαῖος, περιτομὴ καὶ ἀκροβυστία, βάρβαρος, Σκύθης, δοῦλος, ἐλεύθερος, ἀλλὰ ⸀τὰ πάντα καὶ ἐν πᾶσιν Χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/011.yaml
  text: where there is no Greek and Jew[a], circumcision and uncircumcision, barbarian, Scythian, slave, free, but Messiah is all[c][b], and in all.
translation:
  language: zh_hans
  text: 在这里并不分希腊人和犹太人、受割礼的和未受割礼的、蛮族人和斯基泰人[a]、奴隶和自由人；唯有弥赛亚[b]是一切，也在一切之中[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “蛮族人”译自希腊文 βάρβαρος，指希腊人眼中语言文化不同、被视为文明圈外的人；这是古代带有文化优越色彩的称呼。斯基泰人是古代欧亚草原上的一个族群，在当时的希腊罗马语境中常被当作这种称呼的极端例子。
    reason: historical_context
  - marker: b
    text: 希腊文为 Christos，意为“受膏者”；传统译作“基督”。
    reason: lexical_alternative
  - marker: c
    text: “在一切之中”也可理解为“在所有人里面”。上下文主要指更新群体中的众成员，但原文措辞凝练，仍可作较宽泛的理解。
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπου
  choice: 在这里
  rationale: 承接上一节“新人”的领域或处境，保留其空间性表达，同时符合现代汉语习惯。
- source_word: οὐκ ἔνι
  choice: 不再分
  rationale: 表达这些身份在新人群体中不再构成区隔；比直译“没有”更能避免误解为这些人实际不存在。
- source_word: Ἕλλην καὶ Ἰουδαῖος
  choice: 希腊人和犹太人
  rationale: 按原文保留具体的族群—文化配对，不泛化为“外邦人和犹太人”。
- source_word: περιτομὴ καὶ ἀκροβυστία
  choice: 受割礼的和未受割礼的
  rationale: 原文用抽象名词指代宗教与群体身份；汉语采用人物化表达更自然，也清楚呈现双方对照。
- source_word: βάρβαρος
  choice: 外族人
  rationale: 该词在希腊文化语境中指语言文化不同、被视为文明圈外的人；“外族人”保留其局外人意味，同时避免把古代贬称直接当作客观描述。
- source_word: Σκύθης
  choice: 斯基泰人
  rationale: 采用该古代族群名称在现代汉语中的通行译名。
- source_word: δοῦλος
  choice: 奴隶
  rationale: 与“自由人”直接对举，所指是受奴役的社会法律身份，不能弱化为“仆人”。
- source_word: ἐλεύθερος
  choice: 自由人
  rationale: 准确呈现与奴隶相对的社会身份。
- source_word: ἀλλὰ
  choice: 唯有
  rationale: 在否定各类身份区隔之后引出强烈转折，并自然突出弥赛亚的决定性地位。
- source_word: τὰ πάντα
  choice: 是一切
  rationale: 保留原文简洁而全面的断言，不增添原文没有明确说明的形而上限定。
- source_word: ἐν πᾶσιν
  choice: 在一切之中
  rationale: 保留 πᾶσιν 可指所有人、也可具有较宽泛范围的凝练表达，不在正文中强行消除歧义。
- source_word: Χριστός
  choice: 弥赛亚
  rationale: 此处作为称号使用，译出“受膏者”的称号含义，而不是仅作音译名称处理。
theological_decisions:
- issue: ἐν πᾶσιν 的范围
  choice: 在一切之中
  alternative: 在所有人里面
  rationale: 上下文主要谈更新群体中的众成员，因此人物性理解很自然；但希腊语表达简洁，范围并未在语法上完全限定，正文保留其开放性，脚注说明主要语境。
- issue: τὰ πάντα 的含义
  choice: 弥赛亚是一切
  alternative: 弥赛亚就是一切的一切
  rationale: 采用简洁直译，保留其神学张力，不把它解释成某一套更具体的体系。
- issue: Χριστός 的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处该词具有称号功能；“弥赛亚”直接呈现“受膏者”称号，与仅沿用传统音译“基督”相比语义更透明。
- issue: 身份对举的效力
  choice: 不再分
  alternative: 没有
  rationale: 经文不是否认各族群和社会身份的人实际存在，而是宣告这些身份在新人领域中不再构成决定性的区隔；此译法避免本体性误读，同时不抹去原文的强烈否定。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。用并列结构保留原文连续列举的修辞力量；分号凸显前半节身份区隔的否定与后半节以弥赛亚为中心的肯定之间的转折。“外族人”避免现代汉语中“野蛮人”过强且容易被误当作作者客观评价的贬义，同时在脚注交代原词的历史色彩。
