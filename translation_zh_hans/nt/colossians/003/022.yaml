  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οἱ δοῦλοι, ὑπακούετε κατὰ πάντα τοῖς κατὰ σάρκα κυρίοις, μὴ ἐν ⸀ὀφθαλμοδουλίαις, ὡς ἀνθρωπάρεσκοι, ἀλλ’ ἐν ἁπλότητι καρδίας, φοβούμενοι τὸν ⸀κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/022.yaml
  text: Slaves[a], obey in everything those who are your masters according to the flesh, not with eye-service, as people-pleasers, but with sincerity of heart[b][c], fearing the Lord.
translation:
  language: zh_hans
  text: 作奴隶的[a]，凡事要听从你们肉身的主人[b]；不要只做给人看[c]，像讨好人的人一样；却要以真诚专一的心，敬畏主。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “奴隶”也可译作“仆人”或“为奴的人”；原词通常指处在主人权下、没有自由身份的人。
    reason: lexical_alternative
  - marker: b
    text: “肉身的主人”也可译作“世上的主人”，强调他们的权柄属于今世的人际关系范围。
    reason: lexical_alternative
  - marker: c
    text: “只做给人看”指只有在人注视时才认真做事。
    reason: cultural_note
lexical_decisions:
- source_word: οἱ δοῦλοι
  choice: 作奴隶的
  rationale: δοῦλοι 在此家庭规训语境中指处于主人权下的被奴役者；直译“奴隶”保留古代社会现实，不淡化为现代雇佣关系中的“仆人”。
- source_word: ὑπακούετε κατὰ πάντα
  choice: 凡事都要听从
  rationale: ὑπακούετε 是命令语气，表示服从；“听从”在现代汉语中自然，并保留 κατὰ πάντα 的全面范围。
- source_word: τοῖς κατὰ σάρκα κυρίοις
  choice: 你们肉身上的主人
  rationale: 保留 κατὰ σάρκα 的保罗式措辞及其限定作用，同时用“主人”与末尾作为神圣称号的“主”相区别。
- source_word: μὴ ἐν ὀφθαλμοδουλίαις
  choice: 不要只做给人看
  rationale: ὀφθαλμοδουλία 指仅在受人注视时才尽力的服事；意译比生硬的“眼前事奉”更易被普通现代读者理解。
- source_word: ὡς ἀνθρωπάρεσκοι
  choice: 像讨人喜欢的人一样
  rationale: 表达以取悦人为目标的贬义含义，同时避免可能过强或过于口语化的“讨好人”。
- source_word: ἐν ἁπλότητι καρδίας
  choice: 存诚实专一的心
  rationale: ἁπλότης 在此兼有真诚、不虚伪和心志单一之意；“诚实专一”保留这一语义幅度，而不误解为头脑简单。
- source_word: φοβούμενοι τὸν κύριον
  choice: 敬畏主
  rationale: “敬畏”是现代中文圣经语域中自然的表达，兼顾敬重与畏惧，且“主”明确区别于前面的属人主人。
theological_decisions:
- issue: 奴隶制度语境中的伦理劝告
  choice: 明确译作“奴隶……主人”，并保留属人主人和“主”之间的对照
  alternative: 淡化为“仆人……雇主”
  rationale: 原文反映古代奴隶制度下的真实身份关系；改写成现代雇佣关系会掩盖经文的历史处境和伦理张力。
- issue: κατὰ σάρκα 对主人权柄的限定
  choice: 译作“肉身上的主人”并加注说明
  alternative: 直接译作“世上的主人”
  rationale: 正文保留 σάρξ 的原文意象与神学对照，脚注则解释其在此指今世人际关系范围内的权柄，避免误读为主人只支配奴隶的身体。
- issue: φοβούμενοι τὸν κύριον 中“惧怕”的性质
  choice: 译作“敬畏主”
  alternative: 译作“害怕主”或仅作“尊敬主”
  rationale: “敬畏”既不把 φόβος 缩减为单纯尊敬，也避免将其理解为只有惊恐，保留圣经“畏主”观念的张力。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“作奴隶的”保留历史现实；“肉身上的主人”有意保留原文限定语，并以脚注辅助理解；“不要只做给人看”以自然汉语传达罕见复合词的实际含义。所有脚注标记均置于正文相应锚点。
