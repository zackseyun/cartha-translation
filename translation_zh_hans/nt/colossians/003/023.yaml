  text: ⸀ὃ ἐὰν ποιῆτε, ἐκ ψυχῆς ἐργάζεσθε, ὡς τῷ κυρίῳ καὶ οὐκ ἀνθρώποις,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/023.yaml
  text: Whatever you do[a], work from the soul, as for the Lord and not for men[c][b],
translation:
  language: zh_hans
  text: 无论你们做什么，都要从心里去做[a]，如同是为主[b]而做，不是为人而做。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “从心里”字面为“出于魂”（希腊文ψυχή）；也可译作“全心全意地”或“由衷地”，指真诚而全心投入。
    reason: lexical_alternative
  - marker: b
    text: 这里的“主”在当时的家庭关系语境中也可带有“主人”的意味。
    reason: alternative_reading
lexical_decisions:
- source_word: ὃ ἐὰν ποιῆτε
  choice: 无论你们做什么
  rationale: 中性关系代词加ἐάν表达不定、概括的范围；“无论……什么”自然传达“凡所做的任何事”。动词为第二人称复数，因此明示“你们”。
- source_word: ἐκ ψυχῆς
  choice: 从心里
  rationale: 字面为“从魂里”，表示出于人的内在、真诚而全心投入。现代汉语“从心里”既自然，又保留由内而发的意象；脚注说明其字面形式，以免抹平ψυχή的表达。
- source_word: ἐργάζεσθε
  choice: 去做
  rationale: 此处是命令语气，要求实际投入行动。因前文已经有“做什么”，译作“去做”可避免汉语中生硬重复，同时保留持续认真做事的劝勉意味。
- source_word: ὡς τῷ κυρίῳ
  choice: 像是为主做的
  rationale: ὡς引出做事的方式和取向，意为把工作视为献给主而做；“像是为主做的”在汉语中清楚自然，并保留比较语气。
- source_word: καὶ οὐκ ἀνθρώποις
  choice: 而不是为人做的
  rationale: ἀνθρώποις泛指人类或世人，与主形成对照，并非专指男性；现代汉语“人”简洁、自然且准确。“而不是”清楚表达καὶ οὐκ在此的对比作用。
theological_decisions:
- issue: 家庭训诫语境中κύριος的译法
  choice: 主
  alternative: 主人
  rationale: 上下文虽涉及奴仆与主人，但这里的κύριος最自然地指至高的主，并与“人”相对；因此正文保留基督论称号“主”。同时，家庭关系的语境会使“主人”的含义色彩浮现，故在脚注中注明这一可能的语感，而不把两者强行合并。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留第二人称复数“你们”，并用“从心里”呈现希腊文由内而发的意象；“为人”在汉语中自然泛指人，不带男性限定。
