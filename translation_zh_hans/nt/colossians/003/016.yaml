id: COL.3.16
reference: Colossians 3:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ λόγος τοῦ Χριστοῦ ἐνοικείτω ἐν ὑμῖν πλουσίως ἐν πάσῃ σοφίᾳ· διδάσκοντες καὶ νουθετοῦντες ἑαυτοὺς ⸀ψαλμοῖς, ⸀ὕμνοις, ᾠδαῖς πνευματικαῖς ⸀ἐν χάριτι, ᾄδοντες ἐν ⸂ταῖς καρδίαις⸃ ὑμῶν τῷ ⸀θεῷ·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/016.yaml
  text: Let the word of Messiah dwell in you richly in all wisdom[a], teaching and admonishing one another with psalms, hymns, and spiritual songs[b], singing with grace in your hearts to God.
translation:
  language: zh_hans
  text: 要让弥赛亚的话丰丰富富地住在你们里面[a]。你们要用各样的智慧，借着诗篇、赞美诗和属灵的诗歌彼此教导、彼此劝戒；也要带着恩典[b]，在你们心中向上帝歌唱。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你们”是复数；这句话既可指弥赛亚的话住在整个群体中，也可指住在各信徒里面。也可译作“住在你们中间”。
    reason: alternative_reading
  - marker: b
    text: 或译“带着感恩”或“怀着感谢”。希腊语 ἐν χάριτι 在这里可以表达恩典、优雅／恩慈的方式，或感恩。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λόγος τοῦ Χριστοῦ
  choice: 弥赛亚的话
  rationale: “话”保留 λόγος 的宽广含义；“弥赛亚”体现 Χριστός 在此所带的称号意义。属格仍保留一定开放性，可指来自弥赛亚的话，也可指关于弥赛亚的信息。
- source_word: ἐνοικείτω
  choice: 要让……住
  rationale: 保留“居住、内住”的比喻，并以持续性的劝勉表达现在时命令语气。
- source_word: ἐν ὑμῖν
  choice: 在你们里面
  rationale: 直接对应希腊文复数表达，既可理解为在整个群体中，也可理解为在各信徒里面；脚注保留这种张力。
- source_word: πλουσίως
  choice: 丰丰富富地
  rationale: 以自然的现代汉语表达充盈、丰盛的程度，同时延续内住的意象。
- source_word: ἐν πάσῃ σοφίᾳ
  choice: 用各样的智慧
  rationale: 采用自然汉语，同时让该短语主要关联后面的彼此教导和劝戒；希腊文在句法上也可能与前面的“住”相连。
- source_word: διδάσκοντες καὶ νουθετοῦντες ἑαυτούς
  choice: 彼此教导、彼此劝戒
  rationale: 复数反身代词在互惠语境中自然译作“彼此”；“劝戒”保留 νουθετέω 的纠正和提醒意味。
- source_word: ψαλμοῖς, ὕμνοις, ᾠδαῖς πνευματικαῖς
  choice: 借着诗篇、赞美诗和属灵的歌曲
  rationale: 将与格理解为方式或工具，并保持三类歌唱用语的区别；“属灵的”按希腊文最自然地修饰“歌曲”。
- source_word: ἐν χάριτι
  choice: 心怀恩典
  rationale: χάρις 可表达恩典、蒙恩意识或感恩；正文保留“恩典”的词汇联系，脚注注明“感恩”的可能译法。
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: 在心里
  rationale: 以自然汉语表达内在、由衷的歌唱，不把它限制为无声歌唱。
- source_word: τῷ θεῷ
  choice: 上帝
  rationale: 清楚直接地表达歌唱所指向的对象。
theological_decisions:
- issue: Χριστοῦ 是译作“弥赛亚”还是“基督”
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处保留该词作为受膏者称号的意义及其犹太弥赛亚背景，不将它完全处理为姓名式标签。
- issue: ἐν ὑμῖν 的群体性与个体性
  choice: 在你们里面
  alternative: 在你们中间
  rationale: 希腊文的“你们”为复数，既可强调这话住在群体中，也可包括住在每位信徒里面；正文采用较贴近原文且保持开放的表达，并在脚注说明。
- issue: ἐν χάριτι 的含义
  choice: 心怀恩典
  alternative: 怀着感恩
  rationale: 该短语可指恩典、蒙恩的状态或感恩。正文避免只锁定为感恩，脚注保留常见替代解释。
- issue: ἐν πάσῃ σοφίᾳ 的句法归属
  choice: 主要与“彼此教导、彼此劝戒”相连
  alternative: 与“丰丰富富地住在你们里面”相连
  rationale: 标点并非原始文本的一部分，短语的关联范围有一定开放性。当前语序在现代汉语中较自然，但不据此排除另一种句法理解。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“丰丰富富地住”保留原文的内住与丰盛意象；用分号理清参与分词所表达的群体实践和向上帝歌唱的层次。所有脚注标记均已置于正文相应位置。
