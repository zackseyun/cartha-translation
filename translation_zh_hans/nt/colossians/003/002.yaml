  text: τὰ ἄνω φρονεῖτε, μὴ τὰ ἐπὶ τῆς γῆς,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/002.yaml
  text: Set your minds on the things above[b][a], not on the things on the earth.
translation:
  language: zh_hans
  text: 要把心思放在上面的事上[a]，不要放在地上的事上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“要思想上面的事。”希腊语动词不仅指思考，也包括把自己的心态或关注放在某事上。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἄνω
  choice: 上面的事
  rationale: 中性复数冠词与副词ἄνω构成名词性短语，指上面的种种事物或现实；“上面的事”保留其复数性含义，并与后半句“地上的事”形成对应。
- source_word: φρονεῖτε
  choice: 要把心思放在……上
  rationale: φρονέω不只表示思考，也可表示使心态、关注和意向持续朝向某事。此译法自然表达现在时命令语气所要求的持续取向，又不把含义局限为理智思考。
- source_word: μὴ
  choice: 不要
  rationale: μή否定与命令动词相连的第二个对象，构成鲜明对比；汉语用“不要”准确传达禁戒语气。
- source_word: τὰ ἐπὶ τῆς γῆς
  choice: 地上的事
  rationale: 该短语与τὰ ἄνω相对。“地上的事”保留具体的空间对照和名词性结构，比“属世的事”更少解释性。
- source_word: γῆς
  choice: 地上
  rationale: 在与“上面”构成的宇宙空间对照中，γῆ指大地、地上，而不是某一片土地。
theological_decisions:
- issue: φρονεῖτε所表达的劝勉性质
  choice: 劝人使自己的心思、态度和关注持续朝向上面的现实
  alternative: 仅仅在理智上思想天上的事
  rationale: φρονέω的语义范围包括思想、心态、取向和关注。“把心思放在”保留较广的伦理和属灵力度，但没有加入原文未明说的教义内容。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“上面的事／地上的事”保留原文简洁且具有空间感的对照；“把心思放在”比“思念”更符合当代常用表达，也较完整地呈现φρονεῖτε的含义。
