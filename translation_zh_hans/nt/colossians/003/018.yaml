base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/018.yaml
  text: Wives[a], submit yourselves to your husbands[b], as is fitting in the Lord.
translation:
  language: zh_hans
  text: 作妻子的，你们要顺服自己的丈夫；这在主里是合宜的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “是合宜的”也可按句法译作“正如在主里所合宜的”。希腊语动词采用未完成时形式，但在这里通常理解为表达一般性的现时原则。
    reason: lexical_alternative
lexical_decisions:
- source_word: Αἱ γυναῖκες
  choice: 作妻子的
  rationale: 在家庭训诲的语境中，并且与后面的 ἀνδράσιν 相对应，γυναῖκες 指妻子，而非泛指妇女。“作妻子的”既明确婚姻关系，也自然保留了直接劝勉的语气。
- source_word: ὑποτάσσεσθε
  choice: 你们要顺服自己的丈夫
  rationale: 该词在此是复数命令式，表达在这一关系中主动置身于相应秩序之下。“要顺服”简洁自然；加上“自己的”配合中文表达，也传达中间语态所含的主体参与意味，而不译成强制性的“被制服”。
- source_word: τοῖς ἀνδράσιν
  choice: 自己的丈夫
  rationale: 在夫妻关系的上下文中，ἀνήρ 指“丈夫”，不是一般的“男人”。希腊文定冠词与关系语境在中文中自然表达为“自己的”。
- source_word: ὡς
  choice: 这……是
  rationale: ὡς 在这里引出衡量前述行为是否合宜的标准，而非原因。中文用独立分句“这……是合宜的”自然传达这一关系，避免误译成“因为”。
- source_word: ἀνῆκεν
  choice: 是合宜的
  rationale: 该词表示合宜、恰当。虽然词形是未完成时，但在此劝勉语境中通常具有一般现在意义，因此正文译为“是合宜的”，并用脚注保留时态表达的可能性。
- source_word: ἐν κυρίῳ
  choice: 在主里
  rationale: 直译并保留该短语的神学定位：前述之事的合宜性是在与主的关系中来理解的。“主”按本项目对 κύριος 的通常译法处理。
theological_decisions:
- issue: 劝勉的范围及其根据
  choice: 将“在主里”与“是合宜的”连在一起，表明这项劝勉是在与主的关系中受到界定的。
  alternative: 把它理解为不带神学限定的一般社会规范，或只把“在主里”看作对妻子身份的修饰。
  rationale: 希腊文把 ἐν κυρίῳ 放在关于“合宜”的陈述中。译文保留这一限定，却不进一步解释其具体边界，以免加入本节没有明说的教义结论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“作妻子的，你们……”保留原文直接称呼群体的语气；分号清楚连接命令与其在主里的合宜性。避免使用过于古雅的“妇人”或带强制色彩的“服从命令”。
