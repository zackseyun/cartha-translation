id: COL.3.8
reference: Colossians 3:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: νυνὶ δὲ ἀπόθεσθε καὶ ὑμεῖς τὰ πάντα, ὀργήν, θυμόν, κακίαν, βλασφημίαν, αἰσχρολογίαν ἐκ τοῦ στόματος ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/008.yaml
  text: 'But now you also must put away all these things: anger, rage, malice, slander, and filthy speech from your mouth.'
translation:
  language: zh_hans
  text: 但如今，你们也要除去这一切：愤怒、暴怒、恶意、毁谤，以及从你们口中说出的污言秽语。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόθεσθε
  choice: 除去
  rationale: 该词本义可指脱下、放下；在此比喻彻底弃绝这些恶行。“除去”自然庄重，也与本段脱去旧人的语境相符。
- source_word: ὀργήν
  choice: 愤怒
  rationale: 表示较持续或内在的怒气，与随后较强烈、爆发性的 θυμός 区分。
- source_word: θυμόν
  choice: 暴怒
  rationale: 突出怒气猛烈爆发的一面，并保留它与 ὀργή 的语义差别。
- source_word: κακίαν
  choice: 恶意
  rationale: 在这组人际言行之恶中，侧重存心伤害人的恶念；较笼统的“邪恶”不如“恶意”贴合语境。
- source_word: βλασφημίαν
  choice: 毁谤
  rationale: 该词可指亵渎或辱骂、毁谤；此处位于人际恶行和口舌罪的清单中，“毁谤”最符合上下文，同时不把对象限定为上帝。
- source_word: αἰσχρολογίαν
  choice: 污言秽语
  rationale: 指可耻、下流或不合宜的话语。“污言秽语”是现代汉语中自然且范围相近的表达。
- source_word: ἐκ τοῦ στόματος ὑμῶν
  choice: 你们口中的
  rationale: 保留原文从口而出的意象，同时避免汉语中生硬的“从你们口中除去”。
theological_decisions:
- issue: βλασφημίαν 的对象与含义
  choice: 毁谤
  alternative: 亵渎；辱骂
  rationale: 原词本身涵盖对上帝的亵渎和对人的毁谤、辱骂。这里没有明说对象，且上下文集中于群体生活中的言语行为，因此采用“毁谤”；不增添原文未明示的神学对象。
- issue: ὀργή 与 θυμός 的并列关系
  choice: 愤怒、暴怒
  alternative: 怒气、忿怒
  rationale: 以两个不同词语保留原文的并列和语义张力，前者较偏持续的怒意，后者较偏激烈爆发；不将二者合并为一个概念。
translation_notes:
  register: 采用自然、庄重、易懂的现代标准汉语。“但如今”承接前文形成转折；“你们也”准确保留 καὶ ὑμεῖς。清单节奏清楚，不添加原文没有的解释性内容。
