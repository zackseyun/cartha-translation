  text: δι’ ἃ ἔρχεται ἡ ὀργὴ τοῦ θεοῦ ⸂ἐπὶ τοὺς υἱοὺς τῆς ἀπειθείας⸃·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/006.yaml
  text: Because of these things the wrath of God is coming upon the sons of disobedience[a].
translation:
  language: zh_hans
  text: 正因这些事，上帝的愤怒正在临到那些悖逆的人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “那些悖逆的人”直译为“悖逆之子”，指以悖逆为特征的人。有些古抄本省略“向那些悖逆的人”这一短语。
    reason: 说明“悖逆之子”的属性性习语，并准确标示SBLGNT中括号所示异文的省略范围。
lexical_decisions:
- source_word: δι’ ἃ
  choice: 正因这些事
  rationale: διά接宾格关系代词表示原因；“这些事”自然地回指上一节所列的恶行，“正因”则清楚表达因果关系。
- source_word: ἔρχεται
  choice: 正临到
  rationale: 现在时在此具有正在来临或确定将临的审判意味；“正临到”兼顾其动态性和末世性的张力。
- source_word: ἡ ὀργὴ τοῦ θεοῦ
  choice: 上帝的震怒
  rationale: ὀργή在此指上帝针对罪恶的审判性忿怒；“震怒”庄重且符合现代中文圣经语体。
- source_word: ἐπὶ
  choice: 临到
  rationale: ἐπί接宾格标明震怒所朝向并落到的对象；中文以“临到”与ἔρχεται合译，表达自然。
- source_word: τοὺς υἱοὺς τῆς ἀπειθείας
  choice: 那些悖逆的人
  rationale: 这是闪语式属性表达，实际所指是以悖逆为特征的人，并非强调生理性别或亲子关系；正文按其惯用意义自然翻译，脚注保留直译信息。
theological_decisions:
- issue: 是否在正文保留“悖逆之子”这一源语习语
  choice: 正文译作“那些悖逆的人”
  alternative: “悖逆之子”或“悖逆的儿女”
  rationale: “……之子”在希腊文中是受闪语影响的属性习语，表示被某种特质支配或以其为特征的人。现代汉语直译容易被误解为血缘或男性限定，因此正文表达其真实语义，同时用脚注保存源语形式。
- issue: ἐπὶ τοὺς υἱοὺς τῆς ἀπειθείας这一短语的文本状态
  choice: 收入正文
  alternative: 依较短读法省略“临到那些悖逆的人”
  rationale: SBLGNT以文本变异符号标出该短语，显示抄本证据存在分歧。按所给正文收入翻译，但以脚注说明有古抄本省略，避免掩盖文本不确定性。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“震怒”保留审判语境的神学分量；“那些悖逆的人”避免把源语属性习语误读为只指男性，同时以脚注交代直译和文本异文。
