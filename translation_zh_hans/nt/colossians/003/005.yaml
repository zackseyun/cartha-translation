  naturalness: “所以，要治死”及恶行清单整体庄重、清楚。“邪情”虽略带圣经语体，仍能在与“恶欲”并列时传达失序的激情。将“在地上的”调整为“属地的”，并以“身上”明确其与人的关联，可显著避免现代汉语中的地点歧义，同时仍保留“肢体”隐喻。
  terminology: “淫乱、污秽、邪情、恶欲、贪婪”和“拜偶像”均适合本段的伦理和神学语域。“贪婪就是拜偶像”正确地显明关系代词的单数回指，避免中文“这/它”可能扩大所指范围。
