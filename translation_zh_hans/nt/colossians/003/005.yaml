source:
  edition: SBLGNT
  text: Νεκρώσατε οὖν τὰ ⸀μέλη τὰ ἐπὶ τῆς γῆς, πορνείαν, ἀκαθαρσίαν, πάθος, ἐπιθυμίαν κακήν, καὶ τὴν πλεονεξίαν ἥτις ἐστὶν εἰδωλολατρία,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/005.yaml
  text: 'Therefore[a], put to death the members that are on the earth: sexual immorality, impurity, passion, evil desire, and greed[b], which is idolatry.'
translation:
  language: zh_hans
  text: 因此，要治死你们身上属地的肢体[a]：淫乱、污秽、邪情、恶欲和贪婪[b]；贪婪就是拜偶像。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们里面属地的东西。”原文直译为“在地上的肢体”。
    reason: lexical_alternative
  - marker: b
    text: “贪婪”也可译作“贪心”，指贪求更多。
    reason: lexical_alternative
lexical_decisions:
- source_word: Νεκρώσατε
  choice: 要治死
  rationale: 不定过去时主动命令式要求采取坚决行动。“治死”保留死亡意象和命令力度，也是现代中文圣经语境中可理解的表达。
- source_word: οὖν
  choice: 所以
  rationale: 承接上文并引出推论；“所以”自然、清楚地保留逻辑关系。
- source_word: τὰ μέλη τὰ ἐπὶ τῆς γῆς
  choice: 你们在地上的肢体
  rationale: 原文直译为“在地上的肢体”。中文补出从语境可知的“你们”，使所属关系自然明确，同时保留身体肢体及空间领域的隐喻，不改写为“属世的本性”。
- source_word: πορνείαν
  choice: 淫乱
  rationale: 概括各种不合宜性行为的常用中文对应，简洁且不把词义限缩为某一种行为。
- source_word: ἀκαθαρσίαν
  choice: 污秽
  rationale: 保留保罗伦理用语中道德不洁的广泛含义。
- source_word: πάθος
  choice: 邪情
  rationale: 在这一恶行清单中指失序而有罪的激情；“邪情”既体现负面语境，也与后面的“恶欲”有所区分。
- source_word: ἐπιθυμίαν κακήν
  choice: 恶欲
  rationale: 直接表达被 κακήν 明确定性的邪恶欲望，凝练自然。
- source_word: πλεονεξίαν
  choice: 贪婪
  rationale: 表示贪求更多、攫取不止的欲望；“贪婪”是现代中文中清楚而通行的表达。
- source_word: ἥτις ἐστὶν εἰδωλολατρία
  choice: 贪婪就是拜偶像
  rationale: 阴性单数关系代词最自然地回指紧邻的阴性单数名词“贪婪”。中文重复名词可消除代词所可能造成的范围歧义，并保留原文直接、强烈的等同判断。
theological_decisions:
- issue: “就是拜偶像”的所指
  choice: 明确回指“贪婪”
  alternative: 概括前面的整份恶行清单
  rationale: ἥτις 为阴性单数，与最近的阴性单数 πλεονεξίαν 在语法上自然一致。重复“贪婪”不是增添解释，而是在中文中清楚呈现原文的语法指向。
- issue: “在地上的肢体”的解释
  choice: 正文保留肢体和空间领域的隐喻
  alternative: 译作“属世的本性”或“你们里面属世的东西”
  rationale: 原文明确使用 μέλη（肢体），后面的恶行可视为同位说明。保留隐喻可避免将保罗的措辞预先抽象化，也保留其修辞张力。
translation_notes:
  register: 采用庄重而可懂的现代标准普通话。“所以”自然承接上文；“治死”保留命令的力度及死亡隐喻。恶行清单使用简洁、彼此可辨的伦理词汇。正文中的所有脚注标记均已对应列出。
