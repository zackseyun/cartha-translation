  to: 因此，要治死你们身上属地的肢体[a]：淫乱、污秽、邪情、恶欲和贪婪[b]；贪婪就是拜偶像。
  rationale: 修订仅处理脚注 a 的原文信息错误及正文中“在地上的肢体”的汉语地点歧义。“属地的肢体”保留 μέλη 的身体隐喻，并自然表达 τὰ ἐπὶ τῆς γῆς 所指的地上领域；“你们身上”是中文表达所属关系所需的自然补足。其余术语、清单结构及“贪婪就是拜偶像”的单数回指均予保留。
