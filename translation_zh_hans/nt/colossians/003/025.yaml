  text: For the wrongdoer will be repaid for what he has done wrong[b][a], and there is no partiality.
translation:
  language: zh_hans
  text: 因为，行不义的人必因自己所行的不义受报[a]；并没有偏待[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“行不义的人必领受自己所行不义的报应。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“并没有徇私”；直译为“没有接纳面貌”，意思是不按人的外在身份或地位区别对待。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ γὰρ ἀδικῶν
  choice: 因为，行不义的人
  rationale: 带冠词的现在分词作名词用，泛指任何行不义的人；“因为”表达γάρ对上文的解释或依据。
- source_word: κομίσεται
  choice: 必……受报
  rationale: 此处表示人将按自己的行为领受相应的回报；“受报”自然地传达报应意味，同时不明说执行者、方式或时间。
- source_word: ὃ ἠδίκησεν
  choice: 因自己所行的不义
  rationale: 关系代词与ἀδικέω相呼应，指此人已经做出的不义之事；重复“不义”保留原文词根呼应。
- source_word: οὐκ ἔστιν προσωπολημψία
  choice: 并没有偏待人的事
  rationale: προσωπολημψία指因身份、地位或外在条件而区别对待；“偏待人”庄重清楚，也贴合现代中文圣经语体。
- source_word: ὁ ... ἀδικῶν / ἠδίκησεν的阳性单数形式
  choice: 行不义的人……自己
  rationale: 希腊文阳性单数在这里具有泛指作用；中文用“人”和反身代词“自己”，既保留单数泛指，也不引入不必要的性别限定。
theological_decisions:
- issue: 公正报应的性质与范围
  choice: 译作普遍性的警告：行不义者必按其不义受报，且不存在偏待。
  alternative: 将其限定为末日审判，或只限定在奴仆与主人之间的社会关系中。
  rationale: 原文没有明说报应的具体时间、机制或执行方式；译文保留其广泛的道德与神学力度，不作超出经文的限定。
- issue: “没有偏待”所指的主体
  choice: 沿用原文的无人称表达“并没有偏待人的事”。
  alternative: 明确增补“神不偏待人”。
  rationale: 上下文很可能指向神公正的判断，但本句没有明说主语；不增补“神”，可保存原文表达上的含蓄。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“行不义”“受报”“偏待人”保持经文警告的严肃语气；分号呈现报应与不偏待这两个紧密相连的陈述。所有脚注标记均置于正文相应位置。
