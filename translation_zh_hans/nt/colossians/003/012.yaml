  text: Ἐνδύσασθε οὖν ὡς ἐκλεκτοὶ τοῦ θεοῦ, ἅγιοι καὶ ἠγαπημένοι, σπλάγχνα οἰκτιρμοῦ, χρηστότητα, ταπεινοφροσύνην, πραΰτητα, μακροθυμίαν,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/012.yaml
  text: Put on[a], then, as God’s chosen ones, holy and beloved, compassion, kindness, humility, gentleness[b], and patience[c],
translation:
  language: zh_hans
  text: 所以，你们作为上帝所拣选、圣洁蒙爱的人，要穿上怜悯的心肠[a]、恩慈、谦卑、温柔[b]和忍耐[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“怜悯的心肠”，指发自内心深处的怜悯；也可译作“深切的怜悯”。
    reason: 说明原文身体意象及可采用的动态表达。
  - marker: b
    text: 或译“谦和”。
    reason: 保留πραΰτης在柔和、谦顺方面的词义范围。
  - marker: c
    text: 这里的“忍耐”尤指长期容忍他人、不轻易发怒。
    reason: 说明μακροθυμία在关系语境中的具体语义。
lexical_decisions:
- source_word: Ἐνδύσασθε
  choice: 穿上
  rationale: 保留原文以衣着比喻品格实践的表达；“穿上”简洁自然，也与上下文的“脱去／穿上”意象相连。
- source_word: οὖν
  choice: 所以
  rationale: 明确承接前文并引出由此而来的劝勉。
- source_word: ὡς
  choice: 既是
  rationale: 在汉语中自然表达信徒按其既有身份而行的意思；不把原文进一步限定为单纯的因果关系。
- source_word: ἐκλεκτοὶ τοῦ θεοῦ
  choice: 上帝所拣选的
  rationale: 保留拣选出于上帝这一含义，同时避免使用可能带有后世体系化色彩的术语。
- source_word: ἅγιοι
  choice: 圣洁
  rationale: 保留形容词形式及其身份性的神学分量。
- source_word: ἠγαπημένοι
  choice: 蒙爱的
  rationale: 表达被动含义，并传达已经蒙爱、仍处于爱中的身份。
- source_word: σπλάγχνα οἰκτιρμοῦ
  choice: 怜悯的心肠
  rationale: 原文直指内在脏腑所象征的深切怜悯；“怜悯的心肠”在现代汉语中仍可理解，并保留身体意象与感情深度。
- source_word: χρηστότητα
  choice: 恩慈
  rationale: 准确表达待人的良善与仁厚，也符合保罗书信德目表的庄重语体。
- source_word: ταπεινοφροσύνην
  choice: 谦卑
  rationale: 自然、通行地表达谦逊的心态。
- source_word: πραΰτητα
  choice: 温柔
  rationale: 现代汉语中清楚表达柔和而非软弱的品格；“谦和”也是可能译法。
- source_word: μακροθυμίαν
  choice: 忍耐
  rationale: 表达面对他人时长久克制、不轻易发怒的德性，简明且符合本段语境。
theological_decisions:
- issue: 如何翻译ἐκλεκτοὶ τοῦ θεοῦ而不引入特定宗派的拣选论体系
  choice: 上帝所拣选的
  alternative: 上帝的选民
  rationale: 原文确认这些人是上帝所拣选的，却没有在本节说明拣选的机制或次序；所选译法忠实保留神圣主动性及身份语言。
- issue: 如何呈现ἅγιοι καὶ ἠγαπημένοι与“所拣选的”的句法关系
  choice: 是圣洁、蒙爱的
  alternative: 圣洁而蒙爱的上帝选民
  rationale: 将三项都作为读者的身份描述，同时不强行判定后两项究竟是并列称谓还是补充修饰语。
- issue: 如何处理πραΰτης的伦理含义
  choice: 温柔
  alternative: 谦和
  rationale: “温柔”在现代汉语中易懂，并保留柔和、克制的伦理力量，不将其误解为怯弱。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“穿上”的衣着比喻和“心肠”的身体意象；用“既是……就要……”使身份与劝勉之间的关系在汉语中清晰自然。所有脚注标记均置于相关词语之后。
