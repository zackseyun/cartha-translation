  text: Τὰ τέκνα, ὑπακούετε τοῖς γονεῦσιν κατὰ πάντα, τοῦτο γὰρ ⸂εὐάρεστόν ἐστιν⸃ ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/020.yaml
  text: Children[a], obey your parents in everything[b], for this is pleasing in the Lord.
translation:
  language: zh_hans
  text: 儿女们，你们要在一切事上[a]听从父母，因为在主里，这样做是蒙悦纳的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在一切事上”直译“按一切事”；本节在此处没有明说例外。
    reason: scope_clarification
  - marker: b
    text: “在主里”也可理解为在与主的关系或范围之内；“蒙悦纳的”可理解为“为主所喜悦（或悦纳）”。
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: Τὰ τέκνα
  choice: 儿女们
  rationale: τέκνα指家庭中的子女，不限于儿子；“儿女们”既明确包含两性，也适合作为直接称呼。
- source_word: ὑπακούετε
  choice: 要……听从
  rationale: ὑπακούω在亲子权柄关系中表示听从、服从；“听从”自然庄重，并保留顺从指示的实际含义。
- source_word: τοῖς γονεῦσιν
  choice: 父母
  rationale: γονεῦσιν是“父母”的复数形式；汉语无需另加物主代词，也能自然表达“你们的父母”。
- source_word: κατὰ πάντα
  choice: 凡事
  rationale: 该短语表示范围，即“在一切事上”；“凡事”简洁自然，不会误解为单纯的时间意义“总是”。
- source_word: τοῦτο
  choice: 这
  rationale: τοῦτο回指前面的吩咐；保留指示代词可忠实呈现原文结构。
- source_word: γὰρ
  choice: 因为
  rationale: γάρ引出前述命令的理由；“因为”清楚表达解释关系。
- source_word: εὐάρεστόν ἐστιν
  choice: 是蒙喜悦的
  rationale: εὐάρεστος可指令人喜悦或可蒙悦纳；“蒙喜悦”保持其正面评价，同时没有强行补出喜悦者。
- source_word: ἐν κυρίῳ
  choice: 在主里
  rationale: 直译保留保罗常用的关系或范围表达，避免窄化为单一的“讨主喜悦”。
theological_decisions:
- issue: “凡事”与“在主里”的关系及命令范围
  choice: 按原文次序保留“凡事”，并把“在主里”放在说明何为蒙喜悦的分句中，不增添原文未明说的例外条款。
  alternative: 把“在主里”直接理解为对听从父母的限制，即“只要合乎主的旨意，就凡事听从”；或译成“因为这是主所喜悦的”。
  rationale: 从句法看，“在主里”更直接地与“是蒙喜悦的”相连，但它仍把整项劝勉置于人与主的关系之中。译文保留这种张力，不在翻译中替读者确定更具体的伦理限定。
- issue: “在主里”是关系范围还是喜悦的主体
  choice: 译作“在主里”，保留关系或范围意义。
  alternative: 译作“为主所喜悦”或“讨主喜悦”。
  rationale: ἐν通常表示“在……里”，而非直接标明接受喜悦的对象；上下文容许理解为主的悦纳，但不宜在正文中把这一解释定死。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。“儿女们”适合家庭训诫中的直接称呼；“蒙喜悦”略具经文语体，但仍清楚自然，并有助于保留原文没有明确说出喜悦主体的特点。
