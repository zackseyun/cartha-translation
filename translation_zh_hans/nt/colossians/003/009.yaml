  text: μὴ ψεύδεσθε εἰς ἀλλήλους· ἀπεκδυσάμενοι τὸν παλαιὸν ἄνθρωπον σὺν ταῖς πράξεσιν αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/009.yaml
  text: Do not lie to one another[a], since you have stripped off the old man with his practices[b],
translation:
  language: zh_hans
  text: 不要彼此说谎；你们既然[a]已经把旧人[b]连同他的行为都脱去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊语也可较形式地译为“你们已经脱去了……”或理解为“你们脱去……以后”。这里译作“既然”，表明这件事是“不彼此说谎”的根据。
    reason: 语法关系
  - marker: b
    text: 或译“旧我”。原文直译为“旧人”，与下一节的“新人”相对。
    reason: 词义选择
lexical_decisions:
- source_word: μὴ ψεύδεσθε
  choice: 不要说谎
  rationale: μή加现在时命令语气在这里自然表达禁令；上下文并不要求译成强调正在持续之行为的“不要再说谎”。
- source_word: εἰς ἀλλήλους
  choice: 彼此
  rationale: 与ψεύδεσθε连用，表示相互关系中的说谎；“彼此说谎”简洁自然，并保留相互性。
- source_word: ἀπεκδυσάμενοι
  choice: 既然已经……脱去了
  rationale: 不定过去时中动分词修饰隐含的复数主语。此处很可能说明前面禁令的根据；“既然”表达这一因果关系，“已经……脱去”保留已完成的动作和脱衣隐喻。分词关系仍在脚注中保留较形式对应的译法。
- source_word: τὸν παλαιὸν ἄνθρωπον
  choice: 旧人
  rationale: 直译其单数人物意象，并保留与下一节“新人”的对应；“旧我”虽较口语化，却会把保罗可能具有的群体性、代表性意涵收窄为个人内在自我。
- source_word: σὺν ταῖς πράξεσιν αὐτοῦ
  choice: 连同他的行为
  rationale: σύν表示伴随，“连同”清楚呈现旧人及其行为一并被脱去。πρᾶξις在此指实际行为；“他的”对应阳性单数αὐτοῦ，也自然回指“旧人”。
theological_decisions:
- issue: ἀπεκδυσάμενοι与禁令之间的逻辑关系
  choice: 用“既然”表达原因或根据
  alternative: 较形式地译作“已经脱去了……，就不要彼此说谎”或“脱去……以后”
  rationale: 上下文把不说谎建立在信徒已经脱去旧人的事实之上，因果理解最为顺畅；但希腊语分词本身也可较宽泛地表示伴随或先行动作，因此脚注保留其他可能。
- issue: τὸν παλαιὸν ἄνθρωπον的表达
  choice: 旧人
  alternative: 旧我
  rationale: “旧人”保留与下一节“新人”的明确对照，也不把原文可能包含的代表性人类意象限定为纯粹心理层面的“自我”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“把旧人连同他的行为都脱去了”保留原文脱衣隐喻；分号呈现命令与其根据之间紧密但不完全等同的关系。
