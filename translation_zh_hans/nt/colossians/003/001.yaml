  text: Εἰ οὖν συνηγέρθητε τῷ Χριστῷ, τὰ ἄνω ζητεῖτε, οὗ ὁ Χριστός ἐστιν ἐν δεξιᾷ τοῦ θεοῦ καθήμενος·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/001.yaml
  text: If[a], then, you were raised with the Messiah, seek the things above[b], where the Messiah is, seated at the right hand of God.
translation:
  language: zh_hans
  text: 所以，你们若[a]已经与弥赛亚一同复活了，就要寻求上面的事；弥赛亚在那里，坐在上帝的右边。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “若”也可译作“既然”。这里的希腊文保留条件句形式，但按上下文，很可能把这个条件视为真实。
    reason: alternative_reading
lexical_decisions:
- source_word: Εἰ οὖν
  choice: 所以……若
  rationale: 保留 εἰ 的条件形式和 οὖν 的推论作用；中文用“所以……若”自然衔接上文，同时不把条件直接改写成既定事实。
- source_word: συνηγέρθητε τῷ Χριστῷ
  choice: 与弥赛亚一同复活了
  rationale: συνηγέρθητε 是简单过去时被动直陈语气，含“使一同起来”的意思；中文“与……一同复活”既表达被上帝使之复活的语义，也清楚保留与弥赛亚联合的观念。Χριστός 在此仍有称号意味，译为“弥赛亚”。
- source_word: τὰ ἄνω
  choice: 上面的事
  rationale: 保留带冠词的中性复数所指的广泛内容，避免具体化为仅仅“天上的事物”。
- source_word: ζητεῖτε
  choice: 要寻求
  rationale: 准确表达现在时命令语气；“要寻求”在现代中文中自然庄重，也容纳持续追求的语境含义。
- source_word: οὗ ὁ Χριστός ἐστιν
  choice: 弥赛亚正在那里
  rationale: οὗ 是地点关系副词，回指“上面”；“正在那里”自然引出弥赛亚当前所在之处。
- source_word: ἐν δεξιᾷ τοῦ θεοῦ καθήμενος
  choice: 坐在上帝的右边
  rationale: 保留诗篇及尊荣、掌权的空间意象；不扩译为“登基”，以免把隐含意义直接写入正文。
theological_decisions:
- issue: Εἰ 所引条件句的语力
  choice: 保留“若”的条件形式
  alternative: 译作“既然”
  rationale: 上下文很可能把该条件视为真实，但希腊文仍采用条件结构；正文保留这种形式，避免替保罗消除修辞张力。
- issue: Χριστός 的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 本节中 Χριστός 指那位与信徒一同复活、如今居于上帝右边的受膏者，称号意味仍然鲜明，因此译出其称号含义。
- issue: “坐在上帝右边”的含义
  choice: 保留原有位置与尊荣意象
  alternative: 译作“在上帝右边掌权”或“登基”
  rationale: 掌权和登基是该意象所含的神学意义，但不是本句各词直接表达的全部内容；保留原喻更忠实，也让读者看见其经文互文。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“上面的事”保留原文开放的复数范围；“弥赛亚”凸显 Χριστός 的称号意义。脚注仅说明条件句语力这一真实翻译歧义。
