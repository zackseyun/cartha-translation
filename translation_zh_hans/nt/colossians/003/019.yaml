  text: οἱ ἄνδρες, ἀγαπᾶτε τὰς γυναῖκας καὶ μὴ πικραίνεσθε πρὸς αὐτάς.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/019.yaml
  text: Husbands[a], love your wives, and do not be harsh toward them.
translation:
  language: zh_hans
  text: 作丈夫的，要爱你们的妻子，不可苦待她们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不可对她们心怀苦毒。”原文动词可指变得苦毒或心生怨愤；在这里也可指以严厉、刻薄的态度对待妻子。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἄνδρες
  choice: 作丈夫的
  rationale: ἀνήρ可指“男人”或“丈夫”；在家庭训诫语境中，且与“妻子”相对应，明确指丈夫。
- source_word: ἀγαπᾶτε
  choice: 要爱
  rationale: 保留ἀγαπάω的基本意义及命令语气；“要爱”在现代汉语中自然、庄重。
- source_word: τὰς γυναῖκας
  choice: 你们的妻子
  rationale: γυνή可指“女人”或“妻子”；本节婚姻关系的语境要求译作“妻子”。希腊文虽用定冠词，汉语补出“你们的”可清楚表达各丈夫与自己妻子的对应关系。
- source_word: μὴ πικραίνεσθε
  choice: 不可苦待
  rationale: πικραίνω与“苦、苦毒”有关；其中间/被动形式在此可表达对妻子怀有苦毒或以严厉、刻薄的态度待她。“苦待”简洁传达关系中的伤害性态度和行为，同时以脚注保留“心怀苦毒”的词义可能。
- source_word: πρὸς αὐτάς
  choice: 她们
  rationale: πρός加宾格表示态度或行为所针对的对象；在“苦待她们”中由汉语动宾结构自然表达。
theological_decisions:
- issue: 家庭训诫中的性别与婚姻关系称谓
  choice: 保留“丈夫”和“妻子”这一明确的婚姻关系称谓。
  alternative: 泛译为“男人”和“女人”。
  rationale: 原文在家庭训诫的上下文中明确针对已婚男子与其妻子的关系，不宜扩大为一般男女。
- issue: πικραίνεσθε所表达的是内在态度还是外在对待
  choice: 正文译作“不可苦待她们”，脚注保留“不可对她们心怀苦毒”的可能。
  alternative: 正文直译为“不可对她们心怀苦毒”。
  rationale: 原词确有变苦、怀有苦毒之义，而πρὸς αὐτάς又使这种态度明确指向妻子；“苦待”更自然地传达本语境中严厉、怨愤的关系表现，但不应抹去其内在苦毒的词义张力。
translation_notes:
  register: 采用现代、庄重且易懂的家庭训诫语体。“作丈夫的”直接呼告受众；“不可苦待”比“不要严厉对待”更凝练，也保留原词“苦”的语义回响。脚注标记置于对应分句之后。
