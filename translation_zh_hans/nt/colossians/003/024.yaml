  text: εἰδότες ὅτι ἀπὸ κυρίου ⸀ἀπολήμψεσθε τὴν ἀνταπόδοσιν τῆς κληρονομίας· ⸀τῷ κυρίῳ Χριστῷ δουλεύετε·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/024.yaml
  text: knowing that from the Lord you will receive the reward of the inheritance[b][a]. Serve the Lord Messiah.
translation:
  language: zh_hans
  text: 因为你们知道，必从主那里领受产业的赏报[a]。你们所服侍的乃是主弥赛亚[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译：“产业的赏报。”也可理解为“作为赏报的产业”。
    reason: grammatical_ambiguity
  - marker: b
    text: “弥赛亚”传统上常译作“基督”。这里“服侍”在希腊语中是陈述式，不是直接的命令式。
    reason: alternative_reading
lexical_decisions:
- source_word: εἰδότες
  choice: 因为你们知道
  rationale: 该完成时主动分词承接上一节的劝勉，并在语境中具有理由或根据的意味；汉语用“因为你们知道”自然表达这种联系，同时不把它另立为新的命令。
- source_word: ἀπὸ κυρίου
  choice: 从主那里
  rationale: ἀπό加属格表示来源；赏报来自“主”。在仆人与主人的语境中虽可译“主人”，但此处同时带有基督论称号的意味，故译“主”。
- source_word: ἀπολήμψεσθε
  choice: 必……得到
  rationale: 这是将来时中间语态陈述式，表示将会领受；“必”传达将来应许的确定性，“得到”符合现代汉语。
- source_word: ἀνταπόδοσιν
  choice: 赏报
  rationale: 该词指回报、报偿；本节语境为正面的末世性奖赏，“赏报”既保留回报意味，也比“报偿”更明确地表达正面含义。
- source_word: τῆς κληρονομίας
  choice: 产业作为赏报
  rationale: 属格短语与“赏报”的关系紧密，可理解为赏报就是产业，或赏报以产业为内容。正文采用自然汉语表达其内容关系，并以脚注保留希腊语结构的简洁性与可能张力。
- source_word: τῷ κυρίῳ Χριστῷ
  choice: 主弥赛亚
  rationale: δουλεύετε所支配的与格表示服侍的对象。Χριστός在此具有称号作用，译作“弥赛亚”；κύριος译作“主”。
- source_word: δουλεύετε
  choice: 你们所服侍的是
  rationale: 该形式为现在时主动陈述式第二人称复数，不是命令式。此处是提醒这些仆人真正服侍的对象；“所服侍的是”以自然汉语保留陈述语气及强调作用。
theological_decisions:
- issue: δουλεύετε的语气
  choice: 陈述句：“你们所服侍的是……”
  alternative: 命令句：“要服侍……”
  rationale: 希腊语形态是陈述式，语境中用来激励并提醒信徒真正的主是谁。部分译本按劝勉语境译成命令句，但正文优先保留原文形态。
- issue: Χριστῷ作为称号的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处Χριστός仍有“受膏者”这一称号的功能，故正文译“弥赛亚”；脚注保留华人教会传统而熟悉的“基督”。
- issue: 赏报与产业的关系
  choice: 产业作为赏报
  alternative: 产业的赏报
  rationale: τῆς κληρονομίας为属格，可表达赏报以产业为内容，也可较形式化地直译为“产业的赏报”。正文避免让现代汉语读者误以为产业本身另有一份赏报，同时在脚注交代原文结构。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“赏报”比“酬劳”更适合本节的末世性应许；“所服侍的是”既自然，又突出真正服侍对象的对比。所有脚注标记均已置于正文相应位置。
