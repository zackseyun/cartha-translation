  text: ἀνεχόμενοι ἀλλήλων καὶ χαριζόμενοι ἑαυτοῖς ἐάν τις πρός τινα ἔχῃ μομφήν· καθὼς καὶ ὁ ⸀κύριος ἐχαρίσατο ὑμῖν οὕτως καὶ ὑμεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/013.yaml
  text: bearing with one another and forgiving each other[a], if anyone has a complaint against anyone; just as the Lord also forgave you[b], so also you must do.
translation:
  language: zh_hans
  text: 彼此包容，彼此饶恕；若有人对谁有抱怨[a]，主怎样饶恕了你们，你们也要这样饶恕[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“若有人对另一个人有嫌隙。”
    reason: lexical_alternative
  - marker: b
    text: 希腊文末句没有重述“饶恕”这一动词，直译为“你们也照样”；此处按上下文补出“饶恕”。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνεχόμενοι
  choice: 包容
  rationale: 表达持续容忍彼此软弱和过失的关系性行动，语气自然，又不带“勉强忍受”的过强负面色彩。
- source_word: ἀλλήλων
  choice: 彼此
  rationale: 准确表达群体成员之间的相互关系，并与后面的“互相”形成自然的汉语行文。
- source_word: χαριζόμενοι
  choice: 饶恕
  rationale: 在处理人际过犯的语境中，χαρίζομαι指宽免、赦免；“饶恕”既清楚又保留其施恩意味。
- source_word: ἑαυτοῖς
  choice: 互相
  rationale: 形式上是反身代词，但在群体劝勉中具有相互意义；译作“互相”符合现代汉语。
- source_word: ἐάν τις πρός τινα ἔχῃ μομφήν
  choice: 如果有人对别人有所不满
  rationale: 保留条件句的泛指性质。“有所不满”自然表达对人有可抱怨、可责怪之处，又不夸大为正式控告。
- source_word: μομφήν
  choice: 不满
  rationale: 此处指抱怨或责怪的缘由；“不满”适合现代人际语境，并通过脚注提示较具体的译法。
- source_word: καθὼς καὶ
  choice: 怎样
  rationale: 与后面的“也要照样”构成自然的汉语比较结构，清楚连接主的饶恕与信徒应有的行动。
- source_word: ὁ κύριος
  choice: 主
  rationale: 保留κύριος的称号，不在正文中进一步限定其所指。
- source_word: ἐχαρίσατο
  choice: 饶恕了
  rationale: 与前面的χαριζόμενοι保持语义呼应；不定过去时所指的既成行动以“了”自然表达。
- source_word: οὕτως καὶ ὑμεῖς
  choice: 你们也要照样做
  rationale: 希腊文末句省略动词；汉语补入概括性的“做”以使劝勉完整自然，同时不重复添加原文未明说的动词。
theological_decisions:
- issue: ὁ κύριος所指
  choice: 正文仅译“主”，语境中最自然地指基督
  alternative: 理解为较一般意义上的神
  rationale: 歌罗西书的语境及本段劝勉模式倾向于以基督的饶恕为榜样，但原文只用称号“主”，故译文不作超出原文的明示。
- issue: 末句省略动词
  choice: 译为“你们也要照样做”
  alternative: 明确译作“你们也要照样饶恕”，或保留更强的省略“你们也要照样”
  rationale: 原文由上下文补足“饶恕”的行动。现代汉语若完全省略略显突兀，故补入中性的“做”，并以脚注说明原文结构，避免掩盖其简洁性。
translation_notes:
  register: 采用现代、庄重而易懂的劝勉语体。“彼此包容，互相饶恕”保持两项并列行动的节奏；后半句用“怎样……也要照样……”形成清楚自然的对应。
