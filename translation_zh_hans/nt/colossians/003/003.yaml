  text: ἀπεθάνετε γάρ, καὶ ἡ ζωὴ ὑμῶν κέκρυπται σὺν τῷ Χριστῷ ἐν τῷ θεῷ·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/003.yaml
  text: For you died, and your life has been hidden with the Messiah in God.
translation:
  language: zh_hans
  text: 因为你们已经死了，你们的生命已经与弥赛亚[a]一同被藏在上帝里面[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“基督”。希腊语 Χριστός 既可译作“弥赛亚”，也可译作“基督”；这里按称号译出其含义。
    reason: alternative_reading
  - marker: b
    text: 或译：“隐藏着”。希腊语完成时可强调一个已经完成的行动所产生并持续至今的状态。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεθάνετε
  choice: 你们已经死了
  rationale: 不定过去时直陈语气第二人称复数，指信徒已经发生的决定性死亡；“已经死了”用自然汉语表达这一过去事实。
- source_word: γάρ
  choice: 因为
  rationale: 说明上一节劝勉的理由；“因为”清楚保留其解释和论证功能。
- source_word: ἡ ζωὴ ὑμῶν
  choice: 你们的生命
  rationale: 直译 ζωή，并保留原文对这种生命的神学含义，不在正文中加以解释性扩展。
- source_word: κέκρυπται
  choice: 藏在
  rationale: 完成时被动语态强调过去行动所形成的当前状态；现代汉语“藏在”自然地突出当前隐藏的状态，同时上下文容许其被动含义。
- source_word: σὺν τῷ Χριστῷ
  choice: 与弥赛亚一同
  rationale: σύν 表示同在或联合；Χριστός 在此保留其“受膏者／弥赛亚”的称号意义。“一同”使联合关系在汉语中表达清楚。
- source_word: ἐν τῷ θεῷ
  choice: 在上帝里面
  rationale: ἐν 表示所在或领域；“在上帝里面”保留原文的空间性隐喻及其神学张力，不改写为“与上帝同在”。
theological_decisions:
- issue: Χριστῷ 应译为称号还是姓名化形式
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处 Χριστός 可理解为称号，译作“弥赛亚”能显明“受膏者”的含义；“基督”是通行的音译性教会用语，列入脚注作为可接受的另一译法。
- issue: κέκρυπται 的完成时应侧重既成行动还是当前状态
  choice: 藏在
  alternative: 已经被藏在
  rationale: 希腊语完成时兼有既成行动与持续结果；正文采用自然汉语突出当前状态，脚注说明也可用“已经被藏在”突出先前行动及其结果。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“已经死了”明确表达决定性的过去事实；“一同藏在上帝里面”保留原文关于联合、隐藏和所在领域的意象，不作教派性阐释。
