  rationale: 将“藏在”改为“已经……被藏在”，明确完成时被动语态，同时保留其过去行动所导致的当前状态。“已经”不应被理解为对希腊语完成时的机械逐词对应，而是汉语中自然表达既成结果的方式。相应调整脚注 b，使其提供侧重当前状态的可行替代译法，而不与修订后的正文重复。
