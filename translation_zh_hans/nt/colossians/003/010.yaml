  text: καὶ ἐνδυσάμενοι τὸν νέον τὸν ἀνακαινούμενον εἰς ἐπίγνωσιν κατ’ εἰκόνα τοῦ κτίσαντος αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/010.yaml
  text: and have put on the new self[a], which is being renewed in knowledge according to the image of the one who created it[b],
translation:
  language: zh_hans
  text: 并且穿上了新人[a]；这新人正在认识上不断更新，照着创造他的那一位的形象[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “新人”也可译作“新我”或“新的人”。原文这一表达与上文的“旧人”相对。
    reason: lexical_alternative
  - marker: b
    text: “认识”也可译作“充分的认识”。原文用词可以含有更充分或更深入认识的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνδυσάμενοι
  choice: 穿上了
  rationale: 保留以衣着为喻的表达；不定过去时中间语态分词在上下文中指向已经发生的“穿上”，用“了”自然传达这一点。
- source_word: τὸν νέον
  choice: 新人
  rationale: 原文以形容词“新的”作名词，并与上文的“旧人”相对。“新人”简洁、自然，也保留个体身份与群体性人类两方面的可能含义。
- source_word: ἀνακαινούμενον
  choice: 正……不断更新
  rationale: 现在时被动分词表示持续进行的更新过程；“正……不断更新”保留进行性，而汉语中不必生硬地明说被动。
- source_word: εἰς ἐπίγνωσιν
  choice: 以达到认识
  rationale: εἰς 表示更新所趋向的目标或结果；ἐπίγνωσις 可指认识，也可能带有充分、深入认识的意味，正文采用较不释义化的“认识”。
- source_word: κατ’ εἰκόνα
  choice: 照着……的形象
  rationale: κατά 加宾格在此表示标准或样式；“照着……的形象”保留与创世记中神形象语言的呼应。
- source_word: τοῦ κτίσαντος αὐτόν
  choice: 创造他的那一位
  rationale: 保留原文属格分词短语和创造者的位格性；“他”以“新人”为先行词，也对应原文阳性代词 αὐτόν。
theological_decisions:
- issue: τὸν νέον 在人论语境中的译法
  choice: 新人
  alternative: 新我；新的人
  rationale: “新人”与上下文“旧人”的对照清楚，并保留这表达既可关乎信徒更新后的身份，也可能具有群体性的人类意涵，不将其缩减为单纯心理层面的“自我”。
- issue: ἐπίγνωσις 的语义强度
  choice: 认识
  alternative: 充分的认识；更深的认识
  rationale: 该词可能含充分或深入认识的意味，但这一强化程度在本节并非毫无歧义；正文不予强化，脚注提示可能的语义。
- issue: 更新、形象与创造者之间的关系
  choice: 照着创造他的那一位的形象不断更新
  alternative: 不断更新，在认识上有创造他的那一位的形象
  rationale: 将 κατ’ εἰκόνα 理解为更新所依循的标准，最直接反映原文结构，并保留创造与神形象的神学关联，而不进一步界定这种更新如何实现。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“穿上了”保留衣着隐喻；“新人”沿用汉语中清楚自然的对举表达。为准确呈现 εἰς 的趋向意义，使用“以达到认识”，虽略带书面色彩，但比单说“在认识上”更能保留原文的目标或结果关系。
