  to: 并且穿上了新人[a]；这新人正在认识上不断更新，照着创造他的那一位的形象[b]。
  rationale: 将“以达到认识”改为“在认识上”，以符合汉语自然表达，并避免将原文的更新过程过度表述为通往一个独立终点的目的关系。保留“新人”、创造者的位格表述、形象语言及脚注所保留的语义可能性。
