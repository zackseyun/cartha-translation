  text: οἱ πατέρες, μὴ ἐρεθίζετε τὰ τέκνα ὑμῶν, ἵνα μὴ ἀθυμῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/021.yaml
  text: Fathers[a], do not provoke your children, so that they may not become discouraged.
translation:
  language: zh_hans
  text: 父亲们，不要惹儿女的气，免得他们灰心[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灰心”或译“失去勇气”。
    reason: 词义替代译法：ἀθυμέω可表达失去勇气、意志消沉。
lexical_decisions:
- source_word: οἱ πατέρες
  choice: 父亲们
  rationale: πατέρες在此明确指“父亲们”；保留家庭规训中具体的受话对象，不泛化为“父母”。
- source_word: μὴ ἐρεθίζετε
  choice: 不要惹……的气
  rationale: ἐρεθίζω在此指以不当行为激怒、刺激对方；“惹儿女的气”是自然的现代汉语，也保留了引发负面反应的主动含义。
- source_word: τὰ τέκνα ὑμῶν
  choice: 儿女
  rationale: τέκνα是涵盖子女的通称；“儿女”简洁、自然，并明确包括男女子女。
- source_word: ἵνα μὴ
  choice: 免得
  rationale: ἵνα μή表达否定目的或所要避免的结果；“免得”在现代汉语中简明地保留这种关系。
- source_word: ἀθυμῶσιν
  choice: 灰心
  rationale: ἀθυμέω指失去勇气、意志消沉；“灰心”准确、自然，并保留其内在受挫的意味。
theological_decisions:
- issue: 家庭训诫中πατέρες的指称范围
  choice: 具体称呼父亲们
  alternative: 泛指父母
  rationale: 希腊文本明确使用“父亲们”。译文保留具体受话对象；即使原则可作更广泛应用，也不在翻译中将其泛化。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“惹儿女的气”贴近日常表达但不失经文语体；“免得他们灰心”简洁保留了原文的目的或结果张力。
