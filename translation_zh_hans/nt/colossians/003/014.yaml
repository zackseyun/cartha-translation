id: COL.3.14
reference: Colossians 3:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐπὶ πᾶσιν δὲ τούτοις τὴν ἀγάπην, ⸀ὅ ἐστιν σύνδεσμος τῆς τελειότητος.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/014.yaml
  text: And above all these[a], put on love, which is the bond of perfection.
translation:
  language: zh_hans
  text: 在这一切之上，还要穿上爱；爱是完全的纽带。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “完全”也可译作“完整”或“成熟”。
    reason: τελειότης的语义范围包括完全、完整和成熟；正文采用“完全”，脚注保留其他合理理解。
lexical_decisions:
- source_word: ἐπὶ πᾶσιν δὲ τούτοις
  choice: 在这一切之上
  rationale: 保留ἐπί加与格在上下文穿衣比喻中的空间意象：爱如同穿在其他品德之上的衣物；同时也能表达其突出的地位，而不把含义限定为单纯的“此外”。
- source_word: τὴν ἀγάπην
  choice: 爱
  rationale: 以现代汉语中直接、庄重且通行的“爱”表达ἀγάπη，符合本段将爱列为统摄其他品德之要的语境。
- source_word: '[由上文ἐνδύσασθε补出的动词]'
  choice: 穿上
  rationale: 本句希腊文省略动词，宾格τὴν ἀγάπην承接第12节的命令语气ἐνδύσασθε。汉语补出“穿上”，使句子完整，并延续上下文的穿衣比喻。
- source_word: ὅ
  choice: 爱是
  rationale: 希腊文关系代词ὅ为中性单数，与阴性的ἀγάπην并不作通常的性一致，可能概括“爱”这一观念或前面的劝勉。汉语重提“爱”可自然引出解释，但不进一步界定其语法所指。
- source_word: σύνδεσμος
  choice: 纽带
  rationale: “纽带”准确表达使各部分联结在一起之物，既适合抽象语境，也保留“联结”的比喻；比“韧带”自然，比“联系”更具凝聚力。
- source_word: τῆς τελειότητος
  choice: 完全的
  rationale: τελειότης可指完全、完整或成熟。“完全”较贴近原文的宽广语义，也使属格结构保持简洁，不预先断定这是所属、结果还是目标关系。
theological_decisions:
- issue: 爱作为σύνδεσμος τῆς τελειότητος的含义
  choice: 译作“爱是完全的纽带”，保留紧凑的属格表达
  alternative: “爱是使一切达到完整的纽带”或“爱是成熟的纽带”
  rationale: 原文属格可表示属于完全的纽带，也可暗示爱把各样品德联结成完整整体，或促成成熟。正文不补入因果或目标关系，以保留原文的神学张力；脚注提示主要词义选择。
translation_notes:
  register: 采用现代、简洁而庄重的普通话。“穿上”延续3:12以来的穿衣意象；分号清楚连接命令与解释。脚注标记置于相关短语之后。
