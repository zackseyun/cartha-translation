  text: ὅταν ὁ Χριστὸς φανερωθῇ, ἡ ζωὴ ⸀ὑμῶν, τότε καὶ ὑμεῖς σὺν αὐτῷ φανερωθήσεσθε ἐν δόξῃ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/004.yaml
  text: When Messiah[a], who is your life, is revealed[c][b], then you also will be revealed with him in glory.
translation:
  language: zh_hans
  text: 当弥赛亚[a]——你们的生命[b]——显现时，那时你们也将与他一同在荣耀中显现[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“基督”。希腊文Χριστός是称号，意为“受膏者”；“弥赛亚”和“基督”在这里所指相同。
    reason: alternative_reading
  - marker: b
    text: 直译：“弥赛亚，你们的生命。”希腊文以同位语认定弥赛亚就是你们的生命。
    reason: lexical_alternative
  - marker: c
    text: “显现”也可译作“出现”或“被显明”。本节前后两处在希腊文中使用同一词根。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: 当……时
  rationale: 与虚拟语气连用，引出将来预期发生的事件；“当……时”在现代汉语中自然，也不把它误解为反复发生的情形。
- source_word: ὁ Χριστός
  choice: 弥赛亚
  rationale: Χριστός在此带冠词并具有称号作用；“弥赛亚”保留“受膏者”这一称号的身份意义。脚注列出教会汉语中更常见的“基督”。
- source_word: φανερωθῇ / φανερωθήσεσθε
  choice: 显现 / 显现
  rationale: 两处是φανερόω同一词根的不同形式，分别为不定过去时被动虚拟语气和将来时被动直陈语气。“显现”既可表达由隐藏转为公开可见，也保留两处的词语呼应；汉语无需生硬地译出被动标记。
- source_word: ἡ ζωὴ ὑμῶν
  choice: 你们的生命
  rationale: 按希腊文同位结构直译，并以破折号标明“弥赛亚”就是“你们的生命”，不另加解释性关系词。
- source_word: τότε καὶ ὑμεῖς
  choice: 你们也要
  rationale: “也”体现καί所表达的参与和对应关系；汉语的时间从句已经自然表达τότε的“那时”，避免重复使用“那时”。
- source_word: σὺν αὐτῷ
  choice: 同他一同
  rationale: 明确表达信徒与弥赛亚共同显现的紧密关联；重复性的“一同”在此用于强调共同参与。
- source_word: ἐν δόξῃ
  choice: 在荣耀中
  rationale: 保留介词结构及δόξα的神学分量，不限定它究竟主要表示显现的领域、状态还是方式。
theological_decisions:
- issue: Χριστός应译作称号还是沿用名号化形式
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处ὁ Χριστός有明显称号功能；正文用“弥赛亚”保留称号意义，同时脚注给出汉语基督教传统中通行的“基督”，不把两者之间的翻译选择提升为教义差异。
- issue: “弥赛亚”与“你们的生命”的关系
  choice: 以同位语“——你们的生命——”呈现
  alternative: “弥赛亚，就是你们的生命”或“那作为你们生命的弥赛亚”
  rationale: 原文是紧凑的同位结构，直接认定弥赛亚为信徒的生命。破折号既自然又保留原文的浓缩力度，不进一步解释这种生命联合的性质。
- issue: 两次φανερόω的对应
  choice: 两处都译作“显现”
  alternative: 前作“显现”，后作“被显明”或“出现”
  rationale: 同词复现显示信徒将参与弥赛亚的末世显现；统一译法保留这一呼应，同时不说明显现的具体机制。
- issue: ἐν δόξῃ修饰范围
  choice: 置于“显现”之前，保持开放
  alternative: 译作“带着荣耀显现”或“在荣耀里与他一同出现”
  rationale: 希腊文可侧重荣耀作为显现的领域、状态或方式；“在荣耀中显现”不强行排除这些可能。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。破折号保留原文同位语的紧凑与强调；“同他一同”略带庄重色彩，用来凸显共同显现。正文不加入原文没有的因果说明，并借“在荣耀中”保留末世语境中的语义开放性。
