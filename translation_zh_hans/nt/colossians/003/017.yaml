  text: καὶ πᾶν ⸂ὅ τι⸃ ⸀ἐὰν ποιῆτε ἐν λόγῳ ἢ ἐν ἔργῳ, πάντα ἐν ὀνόματι κυρίου Ἰησοῦ, εὐχαριστοῦντες τῷ ⸀θεῷ πατρὶ δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/017.yaml
  text: And whatever you do[a], in word or in deed, do everything in the name of the Lord Jesus[b], giving thanks to God the Father through him.
translation:
  language: zh_hans
  text: 你们无论说话或行事[a]，一切都要奉主耶稣的名而做，并且借着他感谢父神。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“无论在言语上或在行为上。”
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν ὅ τι ἐὰν ποιῆτε
  choice: 你们无论做什么
  rationale: 这一不定概括结构涵盖一切可能的行为；“无论做什么”既自然，也保留了原文开放而全面的语气。
- source_word: ἐν λόγῳ ἢ ἐν ἔργῳ
  choice: 不论是言语还是行为
  rationale: λόγος与ἔργον在这里构成言语与实际行动的对举；此译简洁、自然，并保留原文的修辞平衡。
- source_word: πάντα
  choice: 一切
  rationale: πάντα回指并概括前面的全部范围。“一切”保留了原文再次强调全面性的作用，未将其与前句合并省略。
- source_word: ἐν ὀνόματι κυρίου Ἰησοῦ
  choice: 奉主耶稣的名
  rationale: “奉……的名”是现代汉语中自然且庄重的圣经惯用语，能够同时容纳权柄、代表和归属等含义，不把原文限定为其中一种。
- source_word: κυρίου
  choice: 主
  rationale: 此处κύριος是耶稣的称号；“主”符合新约语境，也保留其基督论分量。
- source_word: εὐχαριστοῦντες
  choice: 并且……感谢
  rationale: 现在分词表达与前述行动同时伴随的感恩；用“并且”连接，在汉语中自然呈现这一伴随关系。
- source_word: τῷ θεῷ πατρὶ
  choice: 父神
  rationale: πατρί与θεῷ构成同位关系。“父神”是简洁、自然的现代汉语表达，清楚表明感谢的对象。
- source_word: δι’ αὐτοῦ
  choice: 借着他
  rationale: 代词最自然地回指紧邻的“主耶稣”；“借着他”保留了原文的中介意味，又不把代词改写得过度明确。
theological_decisions:
- issue: “奉主耶稣的名”的含义
  choice: 正文保留“奉主耶稣的名”这一宽广的圣经表达。
  alternative: 按主耶稣的权柄；作为主耶稣的代表
  rationale: 原语可包含权柄、代表、归属和认同等层面。正文不将其缩减为单一解释，脚注则提示主要含义范围。
- issue: “借着他”的指代
  choice: 保留代词“他”，按句法自然回指主耶稣。
  alternative: 直接译作“借着耶稣”
  rationale: 最近的先行词是“主耶稣”，但原文使用代词；保留代词既忠于形式，也保留由上下文确定所指的方式。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“言语还是行为”保持原文对举；“一切”保留原文的重复强调；“奉……的名”和“借着他”维持经文的神学丰富性与指代方式。
