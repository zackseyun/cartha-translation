  text: In these things you too once walked[a], when you were living in them.
translation:
  language: zh_hans
  text: 你们从前也曾在这些事上行事为人[a]，那时你们活在其中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们从前也曾行在其中，那时你们活在这些事中。”原文关系代词更直译为“在其中”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν οἷς
  choice: 在这些事上
  rationale: 关系代词复数所指的是上文列举的恶行。“在这些事上”在现代汉语中自然地明示其所指，同时保留介词结构；脚注说明更贴近原文形式的译法。
- source_word: καὶ ὑμεῖς
  choice: 你们……也
  rationale: 保留καί与强调代词ὑμεῖς所表达的重点：歌罗西信徒从前也曾有这种生活方式。
- source_word: περιεπατήσατε
  choice: 行事为人
  rationale: περιπατέω在这里比喻人的生活和行为方式。“行事为人”是庄重而易懂的现代汉语表达，也避免与后面的ζάω同译为“生活”。
- source_word: ποτε
  choice: 从前
  rationale: 表示已经过去的一段不确定时间；“从前”简洁自然，并清楚标明这是他们以往的状况。
- source_word: ὅτε
  choice: 那时
  rationale: 引出与先前行为相伴的过去状态，符合汉语时序表达。
- source_word: ἐζῆτε
  choice: 还活
  rationale: 未完成时呈现持续的过去状态。“还活在其中”不是单指生理存活，而是指以这些事为生活领域；同时与“行事为人”保持词义区别。
- source_word: ἐν τούτοις
  choice: 在其中
  rationale: τούτοις回指上文所说的恶行。“其中”避免重复“这些事”，并保留身处这一生活领域的意味。
theological_decisions:
- issue: “行事为人”与“活在其中”的关系
  choice: 分别表达从前的行为方式和持续身处的生活领域
  alternative: 把两个动词都译作“生活”或“过日子”
  rationale: 原文分别使用περιπατέω和ζάω。保留二者的区别，可呈现保罗对信徒昔日行为及生活状态的双重描述，而不额外加入教义解释。
translation_notes:
  register: 采用现代、庄重而通顺的简体中文。“行事为人”保留保罗“行走”一词在伦理语境中的惯用比喻功能；全句维持原文两个介词短语和两个动词之间的层次。
