  text: ἀσπάσασθε τοὺς ἐν Λαοδικείᾳ ἀδελφοὺς καὶ ⸂Νύμφαν καὶ τὴν κατ’ οἶκον αὐτῆς⸃ ἐκκλησίαν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/015.yaml
  text: Greet the brothers in Laodicea[a], and Nympha and the church in her house.
translation:
  language: zh_hans
  text: 请问候老底嘉的弟兄姊妹，也问候宁法和在她家里的教会。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本读作“宁法斯和在他家里的教会”；另有些读作“宁法和在他们家里的教会”。
    reason: textual_variant
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: 请问候
  rationale: 这是第二人称复数的命令式；“请问候”在现代中文书信语境中自然、庄重，也保留了嘱咐的语气。
- source_word: τοὺς ἐν Λαοδικείᾳ ἀδελφοὺς
  choice: 老底嘉的弟兄姊妹
  rationale: ἀδελφοὺς虽为阳性复数，但在保罗书信中常统指男女信徒；译作“弟兄姊妹”明确表达其包容意义，同时保留信仰群体中的亲属称谓。
- source_word: Νύμφαν
  choice: 宁法
  rationale: SBLGNT正文作Νύμφαν，并与阴性单数αὐτῆς呼应，最直接理解为女性名字；其他抄本读法在脚注中交代。
- source_word: τὴν κατ’ οἶκον αὐτῆς ἐκκλησίαν
  choice: 她家里的教会
  rationale: κατ’ οἶκον在此指以某人的家为聚会地点的信徒群体；“她家里的教会”简洁自然，并保留原文的空间关系，没有在正文中增补“聚会”。
- source_word: ἐκκλησίαν
  choice: 教会
  rationale: 在保罗书信语境中指基督徒群体；“教会”是现代中文最通行且符合语境的对应词。
theological_decisions:
- issue: Νύμφαν的身份、性别及相应物主代词
  choice: 宁法……她家里的教会
  alternative: 宁法斯……他家里的教会；或宁法……他们家里的教会
  rationale: SBLGNT所印正文Νύμφαν及αὐτῆς支持女性单数读法，故正文据此翻译。由于抄本传统中存在男性单数及复数物主代词等异文，脚注保留这些可能，不将文本问题转化为教义判断。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“请问候”符合中文书信表达；人名采用“宁法”，以区别于异文所支持的男性名字“宁法斯”。脚注标记置于整句末尾，涵盖姓名和物主代词的相关异文。
