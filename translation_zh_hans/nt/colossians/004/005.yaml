  text: Ἐν σοφίᾳ περιπατεῖτε πρὸς τοὺς ἔξω, τὸν καιρὸν ἐξαγοραζόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/005.yaml
  text: Walk in wisdom toward outsiders[b][a], making the most of the time.
translation:
  language: zh_hans
  text: 你们对外人[a]要以智慧行事，把握时机[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在外面的人”，指信徒群体以外的人。
    reason: lexical_alternative
  - marker: b
    text: 原文含“买回／赎回”的商业性比喻；意思是充分利用机会。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν σοφίᾳ
  choice: 以智慧
  rationale: 保留名词“智慧”及其伦理分量，同时在现代汉语中自然地表达行事的方式。
- source_word: περιπατεῖτε
  choice: 行事
  rationale: 原词直指“行走”，在这里比喻人的生活方式和行为表现；“行事”自然传达这一惯用意义，而不把命令局限为实际步行。
- source_word: πρὸς τοὺς ἔξω
  choice: 对外人
  rationale: πρός在这里表示行为所面向的对象；“外人”简洁保留“在外面的人”这一群体界线，脚注说明其具体所指，避免被误解为外地人或外国人。
- source_word: τὸν καιρόν
  choice: 时机
  rationale: καιρός侧重适当、可用的时刻或机会，不是抽象或连续的时间；“时机”在本语境中比“时间”更准确。
- source_word: ἐξαγοραζόμενοι
  choice: 把握
  rationale: 该分词在此表示充分利用可得的时机；“把握时机”是自然、清楚的现代汉语表达，也避免“赎买”可能引起的救赎论联想。
theological_decisions:
- issue: ἐξαγοραζόμενοι是否应带入救赎含义
  choice: 译作“把握时机”，理解为明智地善用与非信徒相处的机会
  alternative: 较直译为“赎买时间／时机”，可能使读者联想到神学意义上的救赎
  rationale: 本句中的动词与καιρός搭配，语境指抓住并善用机会，而非论述代赎或救恩；脚注保留原文的商业性比喻。
- issue: τοὺς ἔξω所指的群体
  choice: 译作“外人”，并注明指信徒群体以外的人
  alternative: 直接在正文解释为“非信徒”
  rationale: “外人”保留原文从群体边界角度说“外面的人”的表达，并避免把原文在称谓上的含蓄完全解释掉。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“以智慧行事”保留保罗“行走／生活行事”的伦理语义；“对外人”明确行为所面向的对象；“把握时机”符合现代汉语习惯，并由脚注交代希腊文背后的商业比喻。
