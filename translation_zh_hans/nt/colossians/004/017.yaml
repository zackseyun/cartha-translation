  text: καὶ εἴπατε Ἀρχίππῳ· Βλέπε τὴν διακονίαν ἣν παρέλαβες ἐν κυρίῳ, ἵνα αὐτὴν πληροῖς.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/017.yaml
  text: And tell Archippus[a], “See to the ministry that you received in the Lord, so that you may fulfill it.”
translation:
  language: zh_hans
  text: 你们也要告诉亚基布：“你要留心你在主里[a]所领受的服事，好把它完成。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在主里所领受的服事”也可理解为“从主所领受的服事”。
    reason: 说明ἐν κυρίῳ可侧重在主里的关系或领域，也可能在语境中暗含来源。
lexical_decisions:
- source_word: εἴπατε
  choice: 告诉
  rationale: 这是对会众所用的复数命令式；“告诉”自然地传达向亚基布转达劝告的意思，并保留命令语气。
- source_word: Ἀρχίππῳ
  choice: 亚基布
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: Βλέπε
  choice: 留心
  rationale: 该现在时命令式在这里表示持续谨慎地关注；“留心”简明、自然，又保留劝诫力度。
- source_word: διακονίαν
  choice: 服事
  rationale: διακονία可指服务、事工或受托的职责；“服事”既符合基督徒事奉语境，也不把它限定为某种具体职分。
- source_word: παρέλαβες
  choice: 领受
  rationale: 这里表示接受一项交托；“领受”保留这项服事并非自行取得、而是受托而来的意味。
- source_word: ἐν κυρίῳ
  choice: 在主里
  rationale: 按ἐν的通常含义直译，保留这短语可能表达领域、关系或关联来源的开放性，不径直解释为“从主领受”。
- source_word: ἵνα αὐτὴν πληροῖς
  choice: 务要尽好它
  rationale: ἵνα引出目的或所要求的结果，πληρόω在此指充分履行、完成所受的服事；“务要尽好它”以自然中文表达认真完成受托职责的意思。
theological_decisions:
- issue: ἐν κυρίῳ的含义
  choice: 在主里
  alternative: 从主领受
  rationale: 原文使用ἐν，并非明确表示来源的παρά或ἀπό。“在主里”保留这项服事是在与主的关系或主所界定的领域中领受的含义，也不排除主是其最终来源的理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“留心”保留持续警醒的命令语气；“务要尽好”比生硬的“使它完全”更符合现代汉语，同时传达充分履行受托服事的意思。脚注标记置于整句引语之后，所说明的是引语中的“在主里”。
