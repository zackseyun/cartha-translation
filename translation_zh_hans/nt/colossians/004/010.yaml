  text: Ἀσπάζεται ὑμᾶς Ἀρίσταρχος ὁ συναιχμάλωτός μου, καὶ Μᾶρκος ὁ ἀνεψιὸς Βαρναβᾶ (περὶ οὗ ἐλάβετε ἐντολάς, ἐὰν ἔλθῃ πρὸς ὑμᾶς δέξασθε αὐτόν),
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/010.yaml
  text: Aristarchus[a], my fellow prisoner, greets you, and Mark, the cousin of Barnabas (about whom you received instructions—if he comes to you, welcome him)[b],
translation:
  language: zh_hans
  text: 与我一同被囚的亚里达古向你们问安，巴拿巴的表亲马可也向你们问安（关于他，你们已经领受了指示：如果他到你们那里，就要接待他）。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀσπάζεται
  choice: 向你们问安
  rationale: 这是书信问候语的自然现代汉语表达，既保留动词的直接语气，也比“致意”更易为普通读者理解。
- source_word: συναιχμάλωτός
  choice: 与我一同坐牢的
  rationale: 该复合名词指一同被囚的人。“一同坐牢”在现代汉语中自然清楚，同时不擅自补入“在基督里”等原文没有的限定。
- source_word: ἀνεψιὸς
  choice: 表弟
  rationale: 通用希腊语中的ἀνεψιός明确指堂表兄弟姊妹。汉语必须进一步指明性别；马可是男性，故用“表弟”。至于年长或年幼，原词并未说明，“表弟”虽符合常见中文圣经传统，却比原文更具体，因此另加脚注说明。
- source_word: ἐλάβετε ἐντολάς
  choice: 已经领受了指示
  rationale: ἐντολή可指命令或指示；此处涉及马可来访时的安排，“指示”自然且仍保留一定的权威性。“领受”与书信语体相称。
- source_word: ἐὰν ἔλθῃ πρὸς ὑμᾶς
  choice: 如果他到你们那里去
  rationale: 准确表达ἐάν加虚拟语气所表示的未来可能条件，并符合中文叙述视角。
- source_word: δέξασθε αὐτόν
  choice: 就要接待他
  rationale: δέχομαι在旅行与款待语境中可表示接纳、迎接或款待。“接待”既自然，也保留原词可能涵盖的接纳与款待之意。
theological_decisions:
- issue: συναιχμάλωτός μου所表达的亚里达古与保罗的关系
  choice: 译作“与我一同坐牢的”，不说明其为字面监禁还是比喻性受困
  alternative: 与我一同为主被囚的；与我一同受苦的同工
  rationale: 原文直接称亚里达古为“同囚者”，没有在本节加入“为主”或“同工”等解释；译文保留其历史与神学解释空间。
translation_notes:
  register: 采用现代、庄重而易懂的书信语体。“问安”“领受了指示”保持经文风格，“一同坐牢”“接待”则避免过度文言化。将希腊文括号内的内容改用句号和冒号展开，以符合自然中文，同时保持信息关系。
