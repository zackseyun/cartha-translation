  source_fidelity: 草稿总体忠实传达问安、同囚、马可与巴拿巴的亲属关系、已收到的指示，以及有条件的接待命令。可是“表弟”把ἀνεψιός未表达的年龄关系译入正文；即使脚注加以说明，正文仍不应作此无根据的限定。
  naturalness: “向你们问安”“接待他”自然恰当。“如果他到你们那里去”中的“去”从说话者视角略显不顺，改为“如果他到你们那里”更自然。以中文圆括号保留原文插入语的结构和语气，也比拆成独立句更清晰。
  terminology: “与我一同被囚的”准确保留συναιχμάλωτός的字面意义，未擅加属灵化说明。“表亲”可表达男性马可与巴拿巴的cousin关系，同时不标示长幼，优于“表弟”。“指示”及“接待”分别适切表达ἐντολάς和δέξασθε。
