id: COL.4.12
reference: Colossians 4:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἀσπάζεται ὑμᾶς Ἐπαφρᾶς ὁ ἐξ ὑμῶν, δοῦλος ⸀Χριστοῦ, πάντοτε ἀγωνιζόμενος ὑπὲρ ὑμῶν ἐν ταῖς προσευχαῖς, ἵνα ⸀σταθῆτε τέλειοι καὶ ⸀πεπληροφορημένοι ἐν παντὶ θελήματι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/012.yaml
  text: Epaphras[a], who is one of you, greets you—a slave of Messiah, always striving for you in his prayers[b], so that you may stand mature and fully assured in all the will of God.
translation:
  language: zh_hans
  text: 以巴弗是你们中间的一员，他向你们问安；他是弥赛亚[a]的奴仆，常常在祷告中为你们竭力祈求，好使你们在上帝一切的旨意中站立得住，成熟，并且确信不疑[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊语Χριστός意为“受膏者”，传统音意结合的译法是“基督”。本节原文此处没有“耶稣”。
    reason: 说明称号译法，并防止把英文审校记录中曾出现的“耶稣”误加进正文。
  - marker: b
    text: 也可译作“完全站稳”或“完全确立”。这个希腊词既可表示充分确信，也可表示处于完全稳固的状态。
    reason: 保留πεπληροφορημένοι在本句中的词义歧义。
lexical_decisions:
- source_word: ἀσπάζεται
  choice: 向……问安
  rationale: 符合保罗书信结尾问候语的常见用法，在现代汉语中自然、庄重。
- source_word: ὁ ἐξ ὑμῶν
  choice: 你们中间的一员
  rationale: 表达以巴弗属于歌罗西信徒群体，比直译“出自你们”更清楚自然。
- source_word: δοῦλος
  choice: 奴仆
  rationale: 保留归属和完全效忠的含义，也比泛指服事者的“仆人”更有力度；同时符合现代中文圣经语体。
- source_word: Χριστοῦ
  choice: 弥赛亚
  rationale: 原文只有Χριστοῦ，并无“耶稣”；译作“弥赛亚”以保留该称号“受膏者”的意义。
- source_word: ἀγωνιζόμενος
  choice: 竭力
  rationale: 传达持续而强烈的努力或挣扎，同时避免在中文中把竞技或摔跤意象具体化。
- source_word: ἐν ταῖς προσευχαῖς
  choice: 在祷告中
  rationale: 自然表达以巴弗反复为他们代求；汉语无需机械保留希腊语复数。
- source_word: ἵνα σταθῆτε
  choice: 好使……站立得住
  rationale: 保留“站立”的意象，并以“得住”使现代汉语表达完整自然，而不额外强化为“坚定不移”。
- source_word: τέλειοι
  choice: 成熟
  rationale: 在此更可能指属灵上的成熟或完备，而非毫无瑕疵的绝对完美。
- source_word: πεπληροφορημένοι
  choice: 确信不疑
  rationale: 表达完全确信、心中有充分把握的状态；另一种“完全站稳”的理解收入脚注。
- source_word: ἐν παντὶ θελήματι τοῦ θεοῦ
  choice: 在上帝一切的旨意上
  rationale: 尽量保留原文介词短语的宽度，不武断限定为“上帝所愿的一切事”或“旨意的每一部分”。
theological_decisions:
- issue: Χριστοῦ的称号意义及原文是否含“耶稣”
  choice: 弥赛亚
  alternative: 基督；弥赛亚耶稣
  rationale: Χριστός在这里是称号，译作“弥赛亚”显明“受膏者”之义；本节希腊正文没有Ἰησοῦ，因此不增补“耶稣”。
- issue: δοῦλος的归属与身份含义
  choice: 奴仆
  alternative: 奴隶；仆人
  rationale: “奴仆”既保留完全属于弥赛亚、向他效忠的强烈含义，也避免“仆人”可能带来的普通雇佣服务意味；“奴隶”虽更直接，却在此中文宗教身份表达中容易产生不必要的现代制度联想。
- issue: πεπληροφορημένοι的语义
  choice: 确信不疑
  alternative: 完全站稳；完全确立
  rationale: 该完成时被动分词可侧重充分确信，也可能描述完全确立、站稳的状态。正文采用较常见的确信义，脚注保留另一可能，以免消除经文张力。
- issue: τέλειοι是否表示无罪的完美
  choice: 成熟
  alternative: 完全；完美
  rationale: 在此祷告语境中，该词较自然地指成熟、完备；不把它解释为绝对无罪的完美。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“向你们问安”“奴仆”“旨意”保持经文语体；句序略作汉语化处理，把“成熟、确信不疑、站立得住”并列呈现，同时不消除它们与“在上帝一切的旨意上”之间可能的修饰关系。
