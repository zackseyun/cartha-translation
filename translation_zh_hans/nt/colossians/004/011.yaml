  text: καὶ Ἰησοῦς ὁ λεγόμενος Ἰοῦστος, οἱ ὄντες ἐκ περιτομῆς, οὗτοι μόνοι συνεργοὶ εἰς τὴν βασιλείαν τοῦ θεοῦ, οἵτινες ἐγενήθησάν μοι παρηγορία.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/011.yaml
  text: and Jesus who is called Justus[a]. These are the only ones from the circumcision who are fellow workers for the kingdom of God[c][b], and they became a comfort to me.
translation:
  language: zh_hans
  text: 还有那称为犹士都的耶稣。在受割礼的人中[a]，只有这些人是为神的国一同做工的[b]；他们成了我的安慰[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “受割礼的人”即有犹太背景的人。原文直译为“出于割礼的人”。
    reason: lexical_alternative
  - marker: b
    text: 也可理解为：“这些人是为神的国一同做工的人中仅有的受割礼者。”
    reason: syntactic_alternative
  - marker: c
    text: 或译：“他们使我得到安慰”，或“他们给了我鼓励”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰησοῦς ὁ λεγόμενος Ἰοῦστος
  choice: 那称为犹士都的耶稣
  rationale: 保留新约中Ἰησοῦς的通行译名“耶稣”，并把Ἰοῦστος音译为“犹士都”；“称为”自然表达其另一个名字。
- source_word: οἱ ὄντες ἐκ περιτομῆς
  choice: 在受割礼的人中
  rationale: 该短语直指“出于割礼”的群体，即有犹太背景的人；此译法既保留割礼这一原文意象，又以“在……中”显明后文“只有”的范围。
- source_word: οὗτοι μόνοι
  choice: 只有这些人
  rationale: 准确保留排他强调，并按照希腊文的推进，先界定受割礼的群体，再说明其中只有这些人是同工。
- source_word: συνεργοὶ εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: 为神的国一同做工的
  rationale: 把συνεργοί译成普通读者易懂的“一同做工”，并将εἰς表达为服事目标“为神的国”。
- source_word: ἐγενήθησάν μοι παρηγορία
  choice: 他们成了我的安慰
  rationale: “成了”较直接反映ἐγενήθησαν，同时“安慰”涵盖παρηγορία在此处的安慰、慰藉之意；其他可能语感置于脚注。
theological_decisions:
- issue: “受割礼的人”所指的群体
  choice: 正文保留割礼表述，理解为有犹太背景的人，尤其是此处所列的犹太背景同工。
  alternative: 特指主张外邦信徒必须受割礼的“割礼派”。
  rationale: 上下文是在列举保罗的同工，原文并未在此明确给该群体加上党派或敌对色彩，因此不把较窄的派别解释写入正文。
- issue: μόνοι所限定的范围
  choice: “只有”限定受割礼的人中与保罗为神国做工的这些人。
  alternative: 这些人是所有为神国同工的人中仅有的受割礼者。
  rationale: 希腊文先提出οἱ ὄντες ἐκ περιτομῆς，再说οὗτοι μόνοι συνεργοί，较自然地把排他范围放在受割礼者之内；但另一种句法理解仍在脚注保留。
translation_notes:
  register: 采用现代、庄重而通顺的书信体。“一同做工”避免只在教会语境中常见的名词化术语“同工”造成理解门槛；正文保留“割礼”“神的国”等关键圣经意象，并用脚注说明其指向及句法歧义。
