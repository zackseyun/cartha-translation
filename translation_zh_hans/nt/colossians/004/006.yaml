  text: ὁ λόγος ὑμῶν πάντοτε ἐν χάριτι, ἅλατι ἠρτυμένος, εἰδέναι πῶς δεῖ ὑμᾶς ἑνὶ ἑκάστῳ ἀποκρίνεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/006.yaml
  text: Let your speech always be with grace[a], seasoned with salt[b], so that you may know how you ought to answer each person.
translation:
  language: zh_hans
  text: 你们的言谈要总是满有恩慈[a]，用盐调味[b]，好叫你们知道该怎样回答每一个人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“带着恩典”。这里也可指言谈亲切、温厚、充满善意。
    reason: lexical_alternative
  - marker: b
    text: “用盐调味”是比喻，形容言谈合宜、有智慧、能吸引人，而非淡而无味；其确切含义不宜限定为单一解释。
    reason: cultural_note
lexical_decisions:
- source_word: ὁ λόγος ὑμῶν
  choice: 你们说话
  rationale: 此处 λόγος 指信徒日常言谈的方式，而非单独一个“字词”或正式“信息”；译为“你们说话”符合现代汉语表达。
- source_word: πάντοτε ἐν χάριτι
  choice: 总是带着恩慈
  rationale: 保留介词结构及 χάρις 所含的恩惠、亲切意味；“恩慈”在本语境中自然地表达言语温厚、善意的性质，同时不完全消除“恩典”的保罗书信背景。
- source_word: ἅλατι ἠρτυμένος
  choice: 用盐调和
  rationale: 保留原文以盐调味的比喻；“调和”体现完成时分词所描述的既成特质，也适合修饰言谈。
- source_word: εἰδέναι
  choice: 使你们知道
  rationale: 该不定式与前面的劝勉在句法上关系略有张力，可表示目的或结果；“使你们知道”清楚连接上下文，又不额外限定为单一解释。
- source_word: πῶς δεῖ
  choice: 该怎样
  rationale: δεῖ 表达必要或合宜；“该怎样”在劝勉语境中兼有责任与得体之意，不显得过分强硬。
- source_word: ἑνὶ ἑκάστῳ
  choice: 每一个人
  rationale: 保留这一分配式表达对个别对象的强调，表示回答须顾及每个人。
- source_word: ἀποκρίνεσθαι
  choice: 回答
  rationale: 直接表达对他人作出答复，符合上下文所暗示的交谈场景。
theological_decisions:
- issue: ἐν χάριτι 在此是指人的亲切恩慈，还是神恩典所塑造的言语
  choice: 正文译作“带着恩慈”，脚注说明也可译作“带着恩典”
  alternative: 总是亲切温和／总是带着恩典
  rationale: 语境主要要求言语具有温厚、善意的特征，但 χάρις 仍可能保留较宽的“恩典、恩惠”意涵，因此不在正文中将其神学含义完全排除。
- issue: 盐的比喻具体指智慧、吸引力、得体，还是防腐洁净
  choice: 正文保留“用盐调和”的比喻，脚注仅概括其可能功用
  alternative: 说话要明智得体、富有感染力
  rationale: 原文没有明确拆解比喻，直接释义会不必要地锁定单一含义；保留比喻更忠于文本的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“带着恩慈”兼顾自然表达与 χάρις 的语义张力；“用盐调和”保留原文形象，并以脚注帮助普通读者理解。
