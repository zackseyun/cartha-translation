  rationale: 将“用盐调和”改为“用盐调味”，以改善现代汉语搭配并更贴近原文的调味意象；相应修订脚注。将“你们说话”调整为“你们的言谈”，并以“满有恩慈”使句式更庄重自然。其他核心语义及原文保留的比喻性、歧义性均予保留。
