id: COL.4.1
reference: Colossians 4:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οἱ κύριοι, τὸ δίκαιον καὶ τὴν ἰσότητα τοῖς δούλοις παρέχεσθε, εἰδότες ὅτι καὶ ὑμεῖς ἔχετε κύριον ἐν ⸀οὐρανῷ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/001.yaml
  text: Masters[a], provide your slaves with what is right and fair, knowing that you also have a Lord in heaven.
translation:
  language: zh_hans
  text: 作主人的，你们要给你们的奴隶公正、公平的待遇[a]，知道你们也有一位主在天上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “公平”或译“平等”或“公允”。希腊语ἰσότης可表达公平、公允，也可表达平等。
    reason: 保留ἰσότης的重要词义可能，避免正文把其含义限定得过窄。
lexical_decisions:
- source_word: οἱ κύριοι
  choice: 作主人的
  rationale: 在家庭规训的语境中，指与奴隶相对的世上主人。“作主人的”既自然，也与后文天上的“主”形成原文所有的呼应。
- source_word: τὸ δίκαιον
  choice: 公正
  rationale: 这个名词化形容词指合乎正义、正确的事；“公正”简洁地保留其伦理要求，并适合修饰“待遇”。
- source_word: τὴν ἰσότητα
  choice: 公平
  rationale: ἰσότης可表达公平、公允或平等；本句中“公平的待遇”符合现代汉语习惯，同时用脚注保留“平等”这一重要词义可能。
- source_word: τοῖς δούλοις
  choice: 你们的奴隶
  rationale: 这里明确呈现主人与受其支配者的社会关系，因此译作“奴隶”，不以较弱的“仆人”淡化其受奴役身份；“你们的”把语境中的所属关系自然表达出来。
- source_word: παρέχεσθε
  choice: 要给……待遇
  rationale: 该命令式动词有给予、提供之意；汉语以“给……待遇”自然承接“公正、公平”这组宾语概念。
- source_word: εἰδότες
  choice: 知道
  rationale: 保留分词所表达的伴随认知或命令依据，不把它强行限定为单一的因果关系。
- source_word: καὶ ὑμεῖς
  choice: 你们也
  rationale: 保留καί和显式代词的强调：世上的主人自己也处于另一位主的权柄之下。
- source_word: κύριον
  choice: 一位主
  rationale: 译作“主”既保留其神学分量，也与前面的世上“主人”形成有意的语义呼应；不直接补出身份，以免超出原文。
- source_word: ἐν οὐρανῷ
  choice: 在天上
  rationale: 这是该介词短语自然、通行的现代汉语表达。
theological_decisions:
- issue: 家庭规训语境中δοῦλοι的译法
  choice: 奴隶
  alternative: 仆人；奴仆
  rationale: 本节直接对作主人的发言，奴役关系在语境中十分突出；“奴隶”准确呈现其社会身份，不弱化制度现实。
- issue: ἰσότητα所表达的是公平还是平等
  choice: 正文译“公平”，脚注保留“平等”
  alternative: 平等；公允
  rationale: 该词既可指平等，也可指公平、公允。语境可理解为要求主人给予公正而公平的待遇，但“平等”具有真实且重要的词汇依据，因此不应被静默排除。
- issue: 两处κύριος的呼应
  choice: 分别译作“作主人的”和“一位主”
  alternative: 主人们……一位主人
  rationale: 中文需要区分世上的奴隶主人与天上的主，同时尽量保留原文以同一词根构成的权柄对照。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“作主人的”作为直接称呼自然清楚；“公正、公平的待遇”比逐字译成“公正和平等”更符合汉语搭配，同时借脚注保留原文的词义张力。
