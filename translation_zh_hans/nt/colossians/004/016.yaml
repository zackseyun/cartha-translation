  text: καὶ ὅταν ἀναγνωσθῇ παρ’ ὑμῖν ἡ ἐπιστολή, ποιήσατε ἵνα καὶ ἐν τῇ ⸀Λαοδικέων ἐκκλησίᾳ ἀναγνωσθῇ, καὶ τὴν ἐκ Λαοδικείας ἵνα καὶ ὑμεῖς ἀναγνῶτε.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/016.yaml
  text: And when this letter has been read among you[a], see that it is also read in the church of the Laodiceans[b], and that you also read the one from Laodicea.
translation:
  language: zh_hans
  text: 这封信在你们中间读过以后[a]，要确保它也在老底嘉人的教会中读；你们也要读那封从老底嘉来的信[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“宣读过”。这里的语境是教会群体，可能指在聚会中公开宣读。
    reason: lexical_alternative
  - marker: b
    text: 这封信的具体身份无法确定。“从老底嘉来”可能指当时存放在老底嘉或由那里转来的信，不一定是原先写给老底嘉教会的信。
    reason: cultural_note
lexical_decisions:
- source_word: ἀναγνωσθῇ / ἀναγνῶτε
  choice: 读过 / 读
  rationale: ἀναγινώσκω意为“读”，在早期基督徒聚会的语境中常含公开宣读之意。正文用自然且不过度限定的“读”，脚注说明“宣读”的可能含义。
- source_word: παρ’ ὑμῖν
  choice: 在你们那里
  rationale: παρά加与格在此表达处所和群体范围，指信在歌罗西信徒群体中被读；“在你们那里”自然地保留这一含义。
- source_word: ἡ ἐπιστολή
  choice: 这封信
  rationale: 定冠词在语境中回指保罗正在写给歌罗西人的这封信；汉语用“这封信”可清楚表达这一指向。
- source_word: ποιήσατε ἵνα
  choice: 要让
  rationale: ποιήσατε与ἵνα连用，表示采取行动以确保后述事情发生。“要让”既保留命令语气，也符合现代汉语表达。
- source_word: ἐν τῇ Λαοδικέων ἐκκλησίᾳ
  choice: 在老底嘉人的教会中
  rationale: 保留ἐκκλησία的教会含义及Λαοδικέων的群体性表达，指由老底嘉人组成或属于他们的教会。
- source_word: τὴν ἐκ Λαοδικείας
  choice: 那封从老底嘉来的信
  rationale: 希腊文省略了“信”，但由前文可明确补出。ἐκ按通常意义译为“从……来”，不擅自改成“写给老底嘉”。
theological_decisions:
- issue: “从老底嘉来的信”的身份
  choice: 不确认其具体身份，只译为“那封从老底嘉来的信”
  alternative: 保罗写给老底嘉人的信；由老底嘉转来的另一封信；与老底嘉有关的传阅信（有人推测为《以弗所书》）
  rationale: 原文只说明这封信与老底嘉的来源关系，没有交代其收信人、作者或现今身份。正文和脚注均保留这种不确定性，避免引入未经原文确认的历史或正典判断。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“在你们那里”体现群体场景；“读一遍”使重复动作在汉语中自然清楚，同时不把公开宣读绝对化。地名采用现代中文圣经通行译名“老底嘉”。
