  text: Τῇ προσευχῇ προσκαρτερεῖτε, γρηγοροῦντες ἐν αὐτῇ ἐν εὐχαριστίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/002.yaml
  text: Devote yourselves to prayer[a], staying alert in it with thanksgiving,
translation:
  language: zh_hans
  text: 你们要坚持不懈地祷告[a]，在祷告中保持警醒，心存感恩。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们要专心祷告，在祷告中保持警醒，心存感恩。”
    reason: προσκαρτερεῖτε兼有持续坚守和专心投入的含义；正文突出前者，脚注保留后者。
lexical_decisions:
- source_word: Τῇ προσευχῇ
  choice: 祷告
  rationale: 带冠词的与格在这里指祷告这一持续的属灵实践，并非某一篇特定的祷文；现代汉语自然表达为“祷告”，不另译冠词。
- source_word: προσκαρτερεῖτε
  choice: 要坚持不懈地
  rationale: 现在时命令语气要求持续投入并坚忍不放弃。“坚持不懈地”以自然现代汉语传达持续、恒常的命令语气；“专心”则作为脚注中的可行译法保留其委身色彩。
- source_word: γρηγοροῦντες
  choice: 保持警醒
  rationale: 该现在时分词说明祷告时应有的持续状态。“保持警醒”表达警觉、留心之意，避免把词义过度字面化为“不睡觉”。
- source_word: ἐν αὐτῇ
  choice: 在祷告中
  rationale: 阴性代词最自然地回指“祷告”。汉语若直译为“在其中”略显含混，因此明确重复“祷告”，不改变所指。
- source_word: ἐν εὐχαριστίᾳ
  choice: 心存感恩
  rationale: 该介词短语表达伴随祷告与警醒的态度或方式。“心存感恩”符合现代汉语习惯，也保留感恩持续伴随祷告的含义。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。正文保留命令的持续性，并把分词结构译为伴随祷告的状态；避免使用可能只为教会读者熟悉的“恒切”，改用更普遍易懂的“坚持不懈”。
