  text: so that I may make it clear[b][a], as I ought to speak.
translation:
  language: zh_hans
  text: 好叫我把它讲明白[a]，正如我应当说的那样[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “讲明白”也可译作“显明出来”或“使人知道”。“它”指上一节所说的“基督的奥秘”。
    reason: lexical_alternative
  - marker: b
    text: “正如我应当说的那样”也可译作“正如我必须说的那样”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: 好叫
  rationale: 引出目的，承接上一节请人代祷的内容；“好叫”在现代汉语中自然，也保留目的意味。
- source_word: φανερώσω
  choice: 讲明白
  rationale: 该动词有显明、揭示、使人知道之意；在本节说话和上一节传讲的语境中，“讲明白”既表达公开显明，也兼顾清楚传达。
- source_word: αὐτὸ
  choice: 它
  rationale: 保留希腊文代词形式，所指承接上一节的“基督的奥秘”，不在正文中直接改写为名词。
- source_word: ὡς
  choice: 照着
  rationale: 表达方式或规范，即按应有的方式说；与后面的“所当说的”组合成自然汉语。
- source_word: δεῖ
  choice: 所当
  rationale: 表达必要性或责任，而不把语气单一限定为强制性的“必须”；另以脚注保留较强的译法。
- source_word: με
  choice: 我
  rationale: 希腊文虽为不定式结构中的宾格逻辑主语，汉语按惯用表达译为“我”。
- source_word: λαλῆσαι
  choice: 说
  rationale: 采用宽泛直接的对应词，不额外加入“宣讲”等较具体的含义；其传讲语境由上下文提供。
theological_decisions:
- issue: αὐτό的所指
  choice: 正文保留代词“它”
  alternative: 直接译作“这奥秘”或“基督的奥秘”
  rationale: 上下文清楚表明其所指，但希腊文此处使用代词；保留代词避免把解释性先行词直接写入正文，脚注则说明其指代。
- issue: δεῖ所表达的必要性
  choice: 译为“所当说的”
  alternative: 译为“我必须说的”
  rationale: δεῖ可表示责任、合宜或必要；正文保留较宽的义域，脚注注明较强的必要性译法，以免消除原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句序按汉语习惯调整为“照着所当说的，把它讲明白”，同时保留原文的目的关系、代词指代及必要性表达。脚注标记依正文相关词语顺序排列。
