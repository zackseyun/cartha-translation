  text: ὃν ἔπεμψα πρὸς ὑμᾶς εἰς αὐτὸ τοῦτο ἵνα ⸀γνῶτε τὰ περὶ ⸀ἡμῶν καὶ παρακαλέσῃ τὰς καρδίας ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/008.yaml
  text: 'I sent him to you for this very purpose: that you may know how we are[a], and that he may encourage your hearts.'
translation:
  language: zh_hans
  text: 我派他到你们那里去，正是为了让你们知道我们的近况[a]，也让他鼓励你们的心。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“让我们知道你们的近况”。
    reason: textual_variant
lexical_decisions:
- source_word: ὃν
  choice: 他
  rationale: 阳性单数关系代词回指上一节的推基古；汉语在此自然承接为“他”，无需保留关系从句形式。
- source_word: ἔπεμψα
  choice: 我……派
  rationale: 不定过去时陈述差派这一行动；现代汉语用“派”自然表达，不额外加入完成体标记。
- source_word: πρὸς ὑμᾶς
  choice: 到你们那里去
  rationale: πρός加宾格与差派动词连用，表示朝向收信人；此译法比生硬的“向你们”更符合现代汉语。
- source_word: εἰς αὐτὸ τοῦτο
  choice: 特意……就是要
  rationale: 该短语强调差派的明确目的；以“特意”和“就是要”共同传达强调与目的，避免直译腔。
- source_word: ἵνα
  choice: 就是要
  rationale: 引出目的从句；结合前文译为“就是要”，清楚保留目的意义。
- source_word: γνῶτε
  choice: 让你们知道
  rationale: 不定过去时虚拟语气受ἵνα支配，表达差派的目的；“知道”保留γινώσκω的宽泛含义。
- source_word: τὰ περὶ ἡμῶν
  choice: 我们的近况
  rationale: 指保罗及同伴当前的情形和消息；“近况”简洁自然，也保留其人际与处境层面的含义。
- source_word: παρακαλέσῃ
  choice: 让他鼓励
  rationale: παρακαλέω可指鼓励、安慰或劝勉；此处与传递消息及“心”搭配，“鼓励”能兼顾坚固和安慰而不过度限定。
- source_word: τὰς καρδίας ὑμῶν
  choice: 你们的心
  rationale: 保留圣经中“心”的整体人格与内在生命意象，不将其窄化为情绪或思想。
theological_decisions:
- issue: 目的从句中人称及消息方向的文本异文
  choice: 正文依SBLGNT作“让你们知道我们的近况”（γνῶτε τὰ περὶ ἡμῶν）。
  alternative: 有些抄本作“让我们知道你们的近况”（γνῶμεν τὰ περὶ ὑμῶν，或相近形式）。
  rationale: 正文忠实采用指定的SBLGNT文本；异文改变了获知消息的主体与对象，因此以脚注保留，避免掩盖重要的文本差异。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“我特意派他到你们那里去”顺应汉语叙事次序；“我们的近况”避免“关于我们的事”之类直译腔；保留“你们的心”这一圣经核心意象。
