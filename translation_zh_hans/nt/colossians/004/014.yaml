  text: ἀσπάζεται ὑμᾶς Λουκᾶς ὁ ἰατρὸς ὁ ἀγαπητὸς καὶ Δημᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/014.yaml
  text: Luke, the beloved physician, and Demas greet you.
translation:
  language: zh_hans
  text: 亲爱的医生路加和底马问候你们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσπάζεται
  choice: 问候
  rationale: 这是书信中常见的问候表达。希腊文虽用单数动词，但动词置于由路加和底马构成的并列主语之前；现代汉语自然地译为两人共同“问候”收信人。
- source_word: ὑμᾶς
  choice: 你们
  rationale: 第二人称复数宾格，明确指歌罗西的众收信人；“你们”保留了复数信息。
- source_word: Λουκᾶς
  choice: 路加
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: ἰατρὸς
  choice: 医生
  rationale: 准确表达其职业，在现代汉语中比“医师”更自然通俗，同时保持庄重。
- source_word: ἀγαπητὸς
  choice: 亲爱的
  rationale: 表达受爱与珍视之意，既保留保罗称许路加的温情，也符合现代汉语称呼人的自然方式。
- source_word: καὶ
  choice: 和
  rationale: 简单连接路加与底马，表明二人都向收信人问候。
- source_word: Δημᾶς
  choice: 底马
  rationale: 采用现代中文圣经传统中通行的人名译法。
theological_decisions:
- issue: “ὁ ἀγαπητός”（亲爱的）的修饰范围
  choice: “亲爱的”与“医生”都修饰路加，不修饰底马。
  alternative: 将“亲爱的”理解为可能同时涉及路加和底马。
  rationale: 希腊文“Λουκᾶς ὁ ἰατρὸς ὁ ἀγαπητός”中两个带冠词的同位成分都直接描述路加；底马在καὶ之后另行出现。中文将“亲爱的医生”置于“路加”之前，清楚保留这一关系。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“亲爱的医生路加”简洁传达原文对路加的双重描述；“问候你们”保留书信问安语气及复数受词。
