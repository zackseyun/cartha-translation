source:
  edition: SBLGNT
  text: Τὰ κατ’ ἐμὲ πάντα γνωρίσει ὑμῖν Τυχικὸς ὁ ἀγαπητὸς ἀδελφὸς καὶ πιστὸς διάκονος καὶ σύνδουλος ἐν κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/007.yaml
  text: Tychicus[a], the beloved brother and faithful minister and fellow slave in the Lord[c][b], will make known to you everything about me.
translation:
  language: zh_hans
  text: 推基古会把关于我的一切事情[a]都告诉你们。他是亲爱的弟兄、忠心的服事者[b]，也是与我同作奴仆的[c]，在主里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“有关我的一切情况”或“我的一切近况”。
    reason: lexical_alternative
  - marker: b
    text: “服事者”也可译作“仆人”；希腊语 διάκονος 在某些语境中也可指教会的“执事”。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“与我同作仆人的”。原文 σύνδουλος 含有共同隶属于主人并为其服事的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὰ κατ’ ἐμὲ πάντα
  choice: 关于我的一切事
  rationale: 这一习语泛指与保罗有关的事情、处境和近况；此译保留 πάντα 的广泛范围，不把意思限缩为某一种“情况”。
- source_word: γνωρίσει ὑμῖν
  choice: 会……告诉你们
  rationale: γνωρίζω 在此意为使人知道、告知。现代汉语用“告诉你们”自然清楚，未来意义由“会”表达。
- source_word: Τυχικὸς
  choice: 推基古
  rationale: 采用现代中文圣经中通行且易辨认的人名译法。
- source_word: ὁ ἀγαπητὸς ἀδελφὸς
  choice: 亲爱的弟兄
  rationale: 既表达 ἀγαπητός 的亲爱和珍视，也准确保留对推基古这位男性信徒的称呼。
- source_word: πιστὸς διάκονος
  choice: 忠心的服事者
  rationale: διάκονος 可泛指服事者、仆役，也可能在特定语境指教会职分；本节不足以确定专门职分，因此采用不预先限定的“服事者”。πιστός 在此表示忠诚可靠，译作“忠心的”。
- source_word: σύνδουλος
  choice: 和我一同作奴仆的人
  rationale: 该复合词以 δοῦλος 为核心，表达与保罗共同处于主人权下并共同服事的身份；“奴仆”兼顾归属、受约束和服事的语义，又比现代汉语单说“奴隶”更适合此处关系性称谓。
- source_word: ἐν κυρίῳ
  choice: 在主里
  rationale: 保留保罗常用的关系与领域表达，不将其窄化为仅仅“为主工作”。
theological_decisions:
- issue: διάκονος 是否指正式的教会职分
  choice: 服事者
  alternative: 执事；仆人
  rationale: 上下文称赞推基古的忠心服事，却没有足够证据断定这里使用的是正式职衔；正文保留较宽泛的含义，脚注列出可能译法。
- issue: σύνδουλος 中 δοῦλος 身份语言的力度
  choice: 和我一同作奴仆的人
  alternative: 同作仆人的；同作受约束之仆的
  rationale: 此词不仅表示共同工作，也含有共同隶属于一位主人的意味。“奴仆”保留这种受主权支配的力度，同时脚注说明较柔和的译法。
- issue: ἐν κυρίῳ 的修饰范围
  choice: 以“在主里”统摄相连的服事者与同作奴仆者身份
  alternative: 仅修饰“和我一同作奴仆的人”
  rationale: 希腊语把 ἐν κυρίῳ 放在两个并列称谓之后，语法上可能紧接后者，也可自然理解为涵盖整组事奉身份。中文保持其在并列称谓中的关联，不作排他性限定。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“关于我的一切事”保留原文的宽泛性；“服事者”和“奴仆”分别呈现 διάκονος 与 σύνδουλος 的差异。正文分为两句以提高可读性，但保持原文的信息次序和称赞语气。
