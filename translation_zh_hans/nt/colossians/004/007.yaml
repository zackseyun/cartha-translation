  naturalness: “关于我的一切事”稍显生硬；“关于我的一切事情”是自然的现代标准汉语，同时不将泛指的原文限缩为仅指近况或处境。“与我同作奴仆的”较原稿“和我一同作奴仆的人”更简洁庄重。
