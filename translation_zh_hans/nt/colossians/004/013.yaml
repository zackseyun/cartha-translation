revisions:
- from: 因为我为他作证：他为你们，也为老底嘉和希拉波立的人，十分劳苦[a]。
  to: 因为我为他作证：他为你们，以及为在老底嘉的人和在希拉波立的人，付出了许多辛劳[a]。
  rationale: 修订仅改善汉语中动词与受益对象的关系，并更清楚地保留两个平行的地点短语。“因为”保留γάρ的解释性连接；“我为他作证”不强行裁定与格只能是“论到他”或“替他”；脚注继续标示πόνος在此语境中可能包含的关切意味。
