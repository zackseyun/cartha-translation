  text: μαρτυρῶ γὰρ αὐτῷ ὅτι ἔχει ⸂πολὺν πόνον⸃ ὑπὲρ ὑμῶν καὶ τῶν ἐν Λαοδικείᾳ καὶ τῶν ἐν Ἱεραπόλει.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/013.yaml
  text: For I testify for him that he has great labor for you and for those in Laodicea and those in Hierapolis[a].
translation:
  language: zh_hans
  text: 因为我为他作证：他为你们，以及为在老底嘉的人和在希拉波立的人，付出了许多辛劳[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“有许多劳苦”、“非常挂心”或“深感忧苦”。希腊语这个说法可指艰辛的劳作，在本节语境中也可延伸指强烈的关切。
    reason: 说明πολὺν πόνον的词义范围，保留其在实际辛劳与深切关怀之间的语义张力。
lexical_decisions:
- source_word: μαρτυρῶ αὐτῷ
  choice: 我为他作证
  rationale: μαρτυρῶ是现在时主动直陈语气，表示保罗亲自作证；与人称代词的与格αὐτῷ连用，在此自然理解为“为他作证”，即替以巴弗所付出的辛劳作证。
- source_word: γὰρ
  choice: 因为
  rationale: 保留解释性连接，承接上一节保罗对以巴弗祷告事奉的描述。
- source_word: πολὺν πόνον
  choice: 十分劳苦
  rationale: πόνος首先指辛劳、劳苦或艰辛；“十分劳苦”在现代汉语中自然地表达强烈程度，同时不把含义限定为情感上的忧虑。
- source_word: ὑπὲρ ὑμῶν
  choice: 为你们
  rationale: ὑπέρ在此表示辛劳所关切、服事或使之受益的对象；“为你们”简洁而准确。
- source_word: τῶν ἐν Λαοδικείᾳ
  choice: 老底嘉……的人
  rationale: 冠词加介词短语指当地的人，结合语境是当地信徒；正文保留原文较宽泛的“人”，不额外补明“信徒”。
- source_word: τῶν ἐν Ἱεραπόλει
  choice: 希拉波立的人
  rationale: 与前一地名短语保持平行，并采用通行的中文圣经地名译法。
theological_decisions:
- issue: πόνος所指的是外在劳作还是内心忧苦
  choice: 译作“十分劳苦”，保留艰辛付出的宽泛含义
  alternative: “非常挂心”或“深感忧苦”
  rationale: 上一节提到以巴弗在祷告中竭力，因此本词可包含强烈关切；但πόνος本身更基本的意义是劳苦或艰辛。正文采用较宽的表达，让祷告中的竭力和内心的关切都可由上下文涵盖。
- issue: μαρτυρῶ αὐτῷ中与格的关系
  choice: 译作“为他作证”
  alternative: “为他证明”或“论到他，我可以作证”
  rationale: 此结构可表达为某人作有利的见证。中文“为他作证”自然保留这种关系，同时内容从后面的ὅτι从句得到说明。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我为他作证”直接有力；“十分劳苦”避免生硬照译“有许多劳苦”，并保留原文的宽泛含义。地名采用“老底嘉”和“希拉波立”。
