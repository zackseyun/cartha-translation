  text: σὺν Ὀνησίμῳ τῷ πιστῷ καὶ ἀγαπητῷ ἀδελφῷ, ὅς ἐστιν ἐξ ὑμῶν· πάντα ὑμῖν γνωρίσουσιν τὰ ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/009.yaml
  text: together with Onesimus[a], the faithful and beloved brother, who is one of you[b]. They will make known to you everything here.
translation:
  language: zh_hans
  text: 阿尼西谋也一同来；他是你们中的一员，是忠信、亲爱的弟兄。他们会把这里的一切都告诉你们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σὺν
  choice: 与他同行
  rationale: σύν表示陪同；结合上一节，主语所指为推基古。译作“与他同行”自然承接上下文，同时没有把希腊文未重复的姓名加入本节。
- source_word: Ὀνησίμῳ
  choice: 阿尼西谋
  rationale: 采用现代中文圣经语境中较通行的人名音译。
- source_word: πιστῷ
  choice: 忠信
  rationale: πιστός在此可指忠诚、可靠；“忠信”保留其品格与信仰语境中的双重色彩，不限定为单纯“可信赖”。
- source_word: ἀγαπητῷ
  choice: 亲爱的
  rationale: ἀγαπητός表达群体中的爱与亲密；“亲爱的”在现代中文书信和教会语境中自然庄重。
- source_word: ἀδελφῷ
  choice: 弟兄
  rationale: 阳性单数在此指一位男性同信者；“弟兄”保留原文的家属式群体称谓。
- source_word: ὅς ἐστιν ἐξ ὑμῶν
  choice: 他是你们中间的人
  rationale: ἐξ ὑμῶν可表达出身于或属于收信群体；此译法兼顾来源和群体归属，且不引入《腓利门书》中的社会身份信息。
- source_word: πάντα
  choice: 一切
  rationale: πάντα为中性复数，作概括性宾语；“一切”简洁并保留全面含义。
- source_word: γνωρίσουσιν
  choice: 会……告诉
  rationale: γνωρίζω意为使人知道、告知；中文“告诉”自然清楚，也准确表达复数主语将情况传达给收信人的意思。
- source_word: τὰ ὧδε
  choice: 这里的一切
  rationale: τὰ ὧδε指保罗所在地的各样事情或情况；直译为“这里的一切”保留原文概括性，不擅自限定为“这里发生的事”。
theological_decisions:
- issue: ἀδελφῷ的教会群体含义
  choice: 弟兄
  alternative: 信仰上的弟兄
  rationale: 原文以亲属称谓表达同信群体关系，但没有附加“信仰上的”等解释语；直译可保留其神学与修辞力量。
- issue: ἐξ ὑμῶν的语义范围
  choice: 他是你们中间的人
  alternative: 他是从你们那里来的
  rationale: 该短语既可能强调来源，也可能强调属于歌罗西群体；所选译文避免只锁定地理来源，并不从《腓利门书》引入额外身份判断。
- issue: πάντα τὰ ὧδε所指范围
  choice: 这里的一切
  alternative: 这里发生的一切事
  rationale: 原文概括保罗所在地的事务，并未明确只指事件；保留较宽泛表达，以免过度解释。
translation_notes:
  register: 采用现代、清楚而庄重的书信体。句首“还有”承接上一节未在本节重述的推基古；分号使阿尼西谋的身份说明与二人共同告知消息的陈述层次清楚。
