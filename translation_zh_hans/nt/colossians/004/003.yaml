source:
  edition: SBLGNT
  text: προσευχόμενοι ἅμα καὶ περὶ ἡμῶν, ἵνα ὁ θεὸς ἀνοίξῃ ἡμῖν θύραν τοῦ λόγου, λαλῆσαι τὸ μυστήριον τοῦ Χριστοῦ, δι’ ὃ καὶ δέδεμαι,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/003.yaml
  text: while also praying for us[a], that God may open to us a door for the word, to speak the mystery of Messiah, because of which I am also bound[d][c][b],
translation:
  language: zh_hans
  text: 同时也要为我们祷告，求上帝给我们开一扇门，使我们能传讲这道[a]，讲说弥赛亚的奥秘[b]；我也因此被捆绑[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“给我们开一扇传讲这道的门”或“给我们机会传讲这道”。原文保留了“开门”的比喻。
    reason: 说明“门”的比喻，并反映λόγος在本语境中指所传讲的信息。
  - marker: b
    text: “弥赛亚”也常音译为“基督”。原文直译为“弥赛亚的奥秘”，也可理解为“关于弥赛亚的奥秘”。
    reason: 说明Χριστός的传统译法，并保留属格关系的可能理解。
  - marker: c
    text: 或译：“我也正是为此身带锁链”，即因此被囚禁。
    reason: 说明δέδεμαι的字面形象和监禁语境。
lexical_decisions:
- source_word: προσευχόμενοι ἅμα καὶ περὶ ἡμῶν
  choice: 同时也要为我们祷告
  rationale: 分词承接上一节的祷告劝勉；“同时也”兼顾ἅμα的同时性和καί的附加意味，并用现代汉语自然表达。
- source_word: ἵνα ὁ θεὸς ἀνοίξῃ ἡμῖν
  choice: 求上帝给我们开
  rationale: ἵνα从句在这里表达祷告的内容或目的；“求”清楚保留祈求语气。
- source_word: θύραν τοῦ λόγου
  choice: 一扇传道的门
  rationale: 保留θύρα“门”的比喻，同时把λόγος在本语境中所指的宣讲信息自然译为“传道”，避免生硬的“话语之门”。
- source_word: λαλῆσαι
  choice: 使我们能讲说
  rationale: 表达不定式的目的，并保留λαλέω较普通的“说、讲说”含义，不擅自强化为技术性的“宣讲”。
- source_word: τὸ μυστήριον τοῦ Χριστοῦ
  choice: 弥赛亚的奥秘
  rationale: “奥秘”保持保罗书信中μυστήριον的用语及其曾隐藏、今显明的张力；Χριστός在这里按称号译为“弥赛亚”。
- source_word: δι’ ὃ καὶ δέδεμαι
  choice: 我也正是为此受捆绑的
  rationale: διά加宾格表达原因；完成时被动态表示因先前被捆绑而处于当前状态。“为此”保留关系代词所指可能涵盖奥秘及其宣讲内容。
theological_decisions:
- issue: τοῦ Χριστοῦ的译法与属格关系
  choice: 弥赛亚的奥秘
  alternative: 基督的奥秘；关于弥赛亚的奥秘
  rationale: Χριστός在此具有称号意义，故译“弥赛亚”；保留“的”所承载的属格宽度，不把它单限定为“关于”。
- issue: θύραν τοῦ λόγου的比喻
  choice: 一扇传道的门
  alternative: 传讲这道的机会
  rationale: 正文保留“门”的原文意象，同时让现代读者能理解为传道的通路或机会；脚注说明解释性译法。
- issue: δέδεμαι所指的囚禁状态
  choice: 受捆绑
  alternative: 被囚禁；身带锁链
  rationale: 正文贴近动词δέω的被动态并保留形象；脚注点明语境中实际指身陷囹圄，不淡化保罗因信息而受苦的含义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“同时也要”使本节与上一节的劝勉相连；“传道的门”保留原文比喻而避免过度生硬；“受捆绑”带有经文庄重感，脚注补足现代读者所需的监禁含义。
