  text: Ὁ ἀσπασμὸς τῇ ἐμῇ χειρὶ Παύλου. μνημονεύετέ μου τῶν δεσμῶν. ἡ χάρις μεθ’ ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/018.yaml
  text: The greeting is in my own hand—Paul's[a]. Remember my chains[b]. Grace be with you.
translation:
  language: zh_hans
  text: 这段问安是我保罗亲笔写的[a]。要记念我的锁链[b]。愿恩典与你们同在。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “问安”也可译作“致意”。这里指保罗亲手写下的书信结尾问候。
    reason: lexical_alternative
  - marker: b
    text: “锁链”也可译作“捆锁”或“被囚的处境”；原文直译为“锁链”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπασμός
  choice: 问安
  rationale: 指书信结尾的问候或致意。“问安”简洁自然，也符合书信语境。
- source_word: τῇ ἐμῇ χειρὶ Παύλου
  choice: 我保罗亲笔
  rationale: 与“问安”连用，表达这段结尾问候由保罗本人亲手写下，并保留原文对“我的手”的强调。
- source_word: μνημονεύετέ
  choice: 要记念
  rationale: 准确表达命令语气；原文现在时可含持续留意之意，但中文不必另加“不断”，以免过度翻译。
- source_word: μου τῶν δεσμῶν
  choice: 我的锁链
  rationale: 保留 δεσμοί 的具体形象，同时让读者理解这是保罗被囚处境的转喻。
- source_word: ἡ χάρις
  choice: 恩典
  rationale: 符合保罗书信结尾祝福的惯用表达；原文没有明说恩典的所属者，因此不增译“上帝的”。
- source_word: μεθ’ ὑμῶν
  choice: 与你们同在
  rationale: 直接表达 μετά 加属格在此处的含义；“你们”保留原文复数。
theological_decisions:
- issue: 结尾祝福在希腊文中没有明写动词
  choice: 愿恩典与你们同在
  alternative: 恩典与你们同在
  rationale: 加入“愿”使现代中文自然地呈现祝福语气，但不增添原文没有的神学内容。
- issue: “锁链”是实物还是监禁处境的转喻
  choice: 正文保留“锁链”
  alternative: 我的监禁／我的捆锁
  rationale: 具体意象可能同时指实际锁链和被囚处境；保留“锁链”可避免把原文的张力缩减为抽象解释。
translation_notes:
  register: 采用现代、庄重而易懂的书信语体。“我保罗亲笔问安”简明呈现原文略带省略的署名式句法；“记念”保留郑重的劝勉意味，“愿恩典与你们同在”则以自然中文表达无动词的希腊文祝福句。
