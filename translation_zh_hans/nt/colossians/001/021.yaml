  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ὑμᾶς ποτε ὄντας ἀπηλλοτριωμένους καὶ ἐχθροὺς τῇ διανοίᾳ ἐν τοῖς ἔργοις τοῖς πονηροῖς—
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/021.yaml
  text: And you[a], who once were alienated and hostile in mind in evil deeds—
translation:
  language: zh_hans
  text: 还有你们，从前与上帝隔绝，心思上与他为敌，行邪恶的事[a]——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “心思上与他为敌，行邪恶的事”也可较直译为“在邪恶的行为中，心思上与他为敌”。希腊语结构紧凑，没有明确说明邪恶行为与敌对心思之间是原因、表现，还是所处的领域。
    reason: 保留ἐν τοῖς ἔργοις τοῖς πονηροῖς与前文之间的句法和语义歧义。
lexical_decisions:
- source_word: καὶ ὑμᾶς
  choice: 还有你们
  rationale: 承接上文未完的句子，并把读者也纳入基督使万有和好的范围；“还有你们”在现代汉语中自然地保留了连接和强调作用。
- source_word: ποτε ὄντας
  choice: 从前
  rationale: 概括读者过去所处的状态，并与下一节所述如今已经和好的处境形成对照；汉语无需生硬复现希腊语分词。
- source_word: ἀπηλλοτριωμένους
  choice: 与上帝隔绝
  rationale: 该完成时被动分词表示持续的疏远、隔绝状态。根据上文与上帝和好的语境补明关系对象，使现代读者容易理解，同时不把它误解为一般的人际疏远。
- source_word: ἐχθροὺς τῇ διανοίᾳ
  choice: 心里与他为敌
  rationale: ἐχθρούς可指“仇敌”或“敌对的”，与τῇ διανοίᾳ连用时描述内在心思中的敌对状态；“心里与他为敌”既自然，也保留其强烈的关系性含义。
- source_word: ἐν τοῖς ἔργοις τοῖς πονηροῖς
  choice: 行为邪恶
  rationale: 直译“在邪恶的行为中”在汉语中较生硬。“行为邪恶”简洁表达其外在生活表现，但不明确断言恶行是敌对的原因；原文紧凑结构的歧义在脚注中说明。
- source_word: ἔργοις
  choice: 行为
  rationale: 此处指实际所行之事；“行为”比“工作”或带特定神学色彩的“功德”更准确自然。
- source_word: πονηροῖς
  choice: 邪恶
  rationale: 直接保留其道德判断，语体庄重而符合现代普通话。
theological_decisions:
- issue: 疏远和敌对所指向的对象
  choice: 在译文中以“上帝”和回指的“他”补明
  alternative: 译作“从前是疏远的，心思上为敌”而不说明对象
  rationale: 希腊文本在本节省略关系对象，但上文谈到借着基督与上帝和好。汉语若完全省略对象会显得残缺；按语境补明上帝并未引入新的教义主张。
- issue: 内在敌意与邪恶行为之间的关系
  choice: 并列译为“心里与他为敌，行为邪恶”
  alternative: 译作“因恶行而心里与他为敌”或“在恶行中与他为敌”
  rationale: 介词短语ἐν τοῖς ἔργοις τοῖς πονηροῖς可以表示敌意显现或存在的领域，但没有明确表达严格的因果关系。并列式译法兼顾内在心思和外在行为，不强行确定二者的逻辑关系；其结构歧义由脚注保留。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“隔绝”“为敌”“邪恶”保留原文严肃的关系和道德力度；破折号表明本句语法和思想延续到下一节。
