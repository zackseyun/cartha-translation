  to: 为此[a]，我也劳苦，竭力奋斗[b]，照着他的工作[c]，就是那在我里面以大能发挥作用[d]的工作。
  rationale: 修订仅改善汉语搭配和语序：“工作”对应ἐνέργεια，“发挥作用”对应ἐνεργουμένην，“以大能”对应ἐν δυνάμει。用“就是那……的工作”清楚表达原文关系从句对“他的工作”的限定，且仍保留原文的同源呼应、持续性以及代词指代的开放性。
