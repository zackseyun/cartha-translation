  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἰς ὃ καὶ κοπιῶ ἀγωνιζόμενος κατὰ τὴν ἐνέργειαν αὐτοῦ τὴν ἐνεργουμένην ἐν ἐμοὶ ἐν δυνάμει.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/029.yaml
  text: For this I also labor[a], striving according to his working[d][c][b], which is working in me in power.
translation:
  language: zh_hans
  text: 为此[a]，我也劳苦，竭力奋斗[b]，照着他的工作[c]，就是那在我里面以大能发挥作用[d]的工作。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为此”也可译作“为这个目标”或“为这事”。
    reason: lexical_alternative
  - marker: b
    text: “竭力奋斗”也可译作“奋力挣扎”或“竭力争战”。
    reason: lexical_alternative
  - marker: c
    text: 原文作“他的工作”，本句没有明确说明“他”是指上帝还是基督。
    reason: alternative_reading
  - marker: d
    text: “在我里面以大能发挥作用”也可译作“有力地在我里面运行”或“在我里面发挥大能”。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ὃ
  choice: 为此
  rationale: 承接上文保罗事奉的目标，简洁保留回指和目的意味，不把所指限定得过细。
- source_word: καὶ
  choice: 也
  rationale: 表达保罗的劳苦与上文所述事奉之间的递进或附加关系。
- source_word: κοπιῶ
  choice: 劳苦
  rationale: 体现辛勤工作甚至疲惫的意味，庄重而符合现代汉语表达。
- source_word: ἀγωνιζόμενος
  choice: 竭力奋斗
  rationale: 保留竞赛、奋力争取的意象，也突出强烈而持续的投入。
- source_word: κατὰ
  choice: 照着
  rationale: 表示保罗奋斗所依据的准则、程度或动力来源，不简化为单纯工具关系。
- source_word: ἐνέργειαν
  choice: 运行
  rationale: 指实际发挥作用的能力；采用“运行”可与随后同源的分词形成呼应。
- source_word: αὐτοῦ
  choice: 他的
  rationale: 原文只用代词，并未在本句明确说明指上帝还是基督；译文保留这种开放性。
- source_word: τὴν ἐνεργουμένην
  choice: 这运行……发挥作用
  rationale: 表达持续进行、实际生效的活动，并在汉语中自然回指前面的“运行”。
- source_word: ἐν ἐμοὶ
  choice: 在我里面
  rationale: 直接保留内在领域的含义，不擅自改译为“借着我”。
- source_word: ἐν δυνάμει
  choice: 大有能力地
  rationale: 自然表达该运行发挥作用的有力方式，同时保留 δύναμις 的能力含义。
theological_decisions:
- issue: αὐτοῦ（“他的”）所指是谁
  choice: 保留“他的”，不明确指认上帝或基督
  alternative: 译作“上帝的”或“基督的”
  rationale: 本节语法上只有代词，具体所指须由上下文判断；保留代词可避免译文替原文消除神学上的张力。
- issue: 神圣运行与保罗劳苦之间的关系
  choice: 同时保留保罗的“劳苦、竭力奋斗”和“他的运行”在保罗里面发挥作用
  alternative: 将全句意译为保罗完全凭神的能力工作，或主要靠自己的努力工作
  rationale: 原文并置人的奋力与神圣能力的有效运行；译文不把二者化约为单一因果关系。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“运行”重复对应原文 ἐνέργεια 与 ἐνεργουμένην 的同源呼应；以分号展开关系从句，使汉语清楚而不削弱原句中人的劳苦与神圣能力并存的张力。
