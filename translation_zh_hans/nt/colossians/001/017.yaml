  text: And he is before all things[b][a], and in him all things hold together.
translation:
  language: zh_hans
  text: 他在万有之先[a]；万有都在他里面得以维系[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在万有之先”主要表示先于万有，也可含有超乎万有、居于万有之上的意味。
    reason: alternative_reading
  - marker: b
    text: 或译：“万有都在他里面存在”，或“万有都在他里面结合在一起”。
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτός
  choice: 他
  rationale: 希腊文代词因位置而略带强调；现代汉语用“他”即可自然承接上文所说的爱子，若译作“他自己”则显得生硬并可能过度强化。
- source_word: πρὸ πάντων
  choice: 在万有之先
  rationale: πρό加属格首先表达先于、在……以前；“在万有之先”既保留时间上的优先，也不排除上下文所含的超越地位。
- source_word: τὰ πάντα
  choice: 万有
  rationale: “万有”简洁而全面，并可与本段上下文中反复出现的τὰ πάντα保持用词一致，不把范围擅自缩窄为“整个受造界”。
- source_word: ἐν αὐτῷ
  choice: 在他里面
  rationale: 直译保留ἐν所表达的领域或关系，避免径直改成工具性的“借着他”或“靠他”，从而保存原文可能包含的层次。
- source_word: συνέστηκεν
  choice: 维系着
  rationale: 完成时表示由既往形成而持续至今的状态；“维系着”以自然现代汉语表达万有持续结合、保持秩序之意，但其语义也可能理解为“共存”或“结合在一起”。
theological_decisions:
- issue: πρὸ πάντων所表达的基督与万有的关系
  choice: 正文译为“在万有之先”，以时间上的先在为主要表达
  alternative: “超乎万有之上”，强调地位或权能上的至高
  rationale: 希腊语首先表示先于万有；在歌罗西书1:15–20的语境中，这一说法亦可蕴含至高地位，但正文不将这种神学含义扩写成唯一解释。
- issue: συνέστηκεν的效力
  choice: 译为“维系着”，表达万有在基督里面持续保持结合与秩序
  alternative: “存在”“共存”或“结合在一起”
  rationale: 完成时着重现今持续的状态；“维系着”清楚传达宇宙凝聚与存续的意义，同时以脚注保存较少解释性的译法。
translation_notes:
  register: 采用庄重、简明的现代标准汉语。“万有”适合经文语域且普通读者可理解；分号呈现两个并列陈述。所有脚注标记均置于正文相关短语之后。
