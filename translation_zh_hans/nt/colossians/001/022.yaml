  text: νυνὶ δὲ ⸀ἀποκατηλλάγητε ἐν τῷ σώματι τῆς σαρκὸς αὐτοῦ διὰ τοῦ θανάτου— παραστῆσαι ὑμᾶς ἁγίους καὶ ἀμώμους καὶ ἀνεγκλήτους κατενώπιον αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/022.yaml
  text: But now he has reconciled you in his body of flesh through death[a], to present you holy and blameless and beyond reproach before him[b],
translation:
  language: zh_hans
  text: 但如今，你们已经借着他肉身之躯的死亡得以和好[a]，为要把你们呈献在他面前，成为圣洁、毫无瑕疵[b]、无可指责的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊语动词是被动语态；也可译作“他已经使你们与自己和好”。
    reason: alternative_reading
  - marker: b
    text: “毫无瑕疵”也可译作“无可指摘”；原词可使人联想到献祭时没有残缺的祭牲。
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: 但如今
  rationale: 自然地承接上一节，并保留从从前的隔绝转向如今和好的鲜明对比。
- source_word: ἀποκατηλλάγητε
  choice: 你们已经……得以和好
  rationale: 保留希腊语被动语态及神主动施行和好的含义，同时避免在正文中补出原文未明说的施事者。
- source_word: ἐν τῷ σώματι τῆς σαρκὸς αὐτοῦ διὰ τοῦ θανάτου
  choice: 借着他肉身的死亡
  rationale: 以自然中文表达和好是借着他真实身体所经历的死亡成就的；“肉身”在此指真实、有血有肉的身体，不指所谓“罪性”。
- source_word: παραστῆσαι
  choice: 为要把你们呈献
  rationale: 表达不定式的目的意义；“呈献”兼顾带到某位面前以及献上的语感。
- source_word: ἁγίους
  choice: 圣洁
  rationale: 保留分别为圣和纯洁的基本含义。
- source_word: ἀμώμους
  choice: 毫无瑕疵
  rationale: 比单用“无可指摘”更能保留该词可能具有的祭牲无残缺意象，并与后面的法庭性用语相区别。
- source_word: ἀνεγκλήτους
  choice: 无可指责
  rationale: 自然表达不受控告、没有可成立之指控的法庭性含义。
- source_word: κατενώπιον αὐτοῦ
  choice: 在他面前
  rationale: 忠实保留代词指向，不擅自限定这里的“他”究竟指父神还是基督。
theological_decisions:
- issue: ἀποκατηλλάγητε的被动语态和施事者
  choice: 正文译为“你们已经……得以和好”，不明说施事者
  alternative: “他已经使你们与自己和好”
  rationale: 希腊语形式是被动语态。上下文表明和好出于神的行动，但正文保留原文未明说施事者的特点，脚注说明另一种顺畅译法。
- issue: σάρξ在本节的含义
  choice: 译作“肉身”，理解为真实的身体
  alternative: 译作“有罪的本性”
  rationale: 本句把肉身、身体和死亡紧密相连，强调真实具身的死亡；把它解释为“有罪的本性”会引入本语境没有表达的观念。
- issue: ἀμώμους与ἀνεγκλήτους的区别
  choice: 分别译作“毫无瑕疵”和“无可指责”
  alternative: 分别译作“无可指摘”和“无可非议”
  rationale: 所选译法既保留前者可能含有的献祭意象，也保留后者较明显的控告或定罪语感，避免把两词压平为近义重复。
- issue: κατενώπιον αὐτοῦ中代词的指向
  choice: 保留为“在他面前”
  alternative: 明确译为“在神面前”或“在基督面前”
  rationale: 原文只用代词，可能的先行词不宜由译者在正文中替读者确定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“肉身”保留具身性而不暗示罪性；“呈献”兼顾目的、献上和站立在某位面前的语境。
