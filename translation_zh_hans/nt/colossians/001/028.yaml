source:
  edition: SBLGNT
  text: ὃν ἡμεῖς καταγγέλλομεν νουθετοῦντες πάντα ἄνθρωπον καὶ διδάσκοντες πάντα ἄνθρωπον ἐν πάσῃ σοφίᾳ, ἵνα παραστήσωμεν πάντα ἄνθρωπον τέλειον ἐν ⸀Χριστῷ·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/028.yaml
  text: Him we proclaim, warning every person and teaching every person with all wisdom, so that we may present every person mature in Messiah.
translation:
  language: zh_hans
  text: 我们所传扬的正是他；我们用各样的智慧劝戒每一个人，教导每一个人，为要把每一个人作为在基督里成熟的人呈献出来。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταγγέλλομεν
  choice: 传扬
  rationale: 表达公开宣告、广为传讲之意，比单纯的“告诉”更符合保罗事工的语境。
- source_word: νουθετοῦντες
  choice: 劝戒
  rationale: 兼顾劝勉与警戒两个语义成分，不将其弱化为一般建议，也不强化为严厉斥责。
- source_word: ἐν πάσῃ σοφίᾳ
  choice: 用各样的智慧
  rationale: 保留介词短语修饰劝戒与教导的自然可能性；“各样”表达 πάσῃ 在此处智慧运用的充分与全面。
- source_word: τέλειον
  choice: 成熟
  rationale: 在人的属灵成长语境中指成熟、完备，而不是毫无缺点的“完美”。
- source_word: παραστήσωμεν
  choice: 呈献
  rationale: 保留使人站在某位面前、将其献上的语感；结合上下文，采用“把他们呈献出来”使中文对象关系清楚。
- source_word: ἐν Χριστῷ
  choice: 在基督里
  rationale: 保留保罗书信中具有联合、领域和关系意涵的固定表达，不将其窄化为“借着基督”。
theological_decisions:
- issue: τέλειον 是否译作道德上绝对的“完美”
  choice: 成熟
  alternative: 完全／完美
  rationale: 此处关乎使每一个人在基督里达到成熟、完备的状态；“成熟”避免暗示今生绝对无罪，同时保留成长目标。
- issue: πάντα ἄνθρωπον 三次重复的范围
  choice: 三次均译为“每一个人”
  alternative: 众人／所有人
  rationale: 保留原文刻意重复及个体性的普遍范围，突出传扬、劝戒、教导和呈献所面向的每一个人。
- issue: ἐν Χριστῷ 与 τέλειον 的关系
  choice: 译为“在基督里成熟”
  alternative: 在基督里把每一个成熟的人呈献出来
  rationale: 按最自然的句法，使“在基督里”界定成熟的领域或关系；同时不进一步解释其具体神学机制。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留原文三次“每一个人”的修辞重复；将关系代词 ὃν 前置所形成的强调译为“正是他”。为避免中文末句误把“每一个人”只理解为“成熟”的主语，补出代词“他们”，不增加新的指称对象。
