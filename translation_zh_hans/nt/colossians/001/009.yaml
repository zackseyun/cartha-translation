id: COL.1.9
reference: Colossians 1:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Διὰ τοῦτο καὶ ἡμεῖς, ἀφ’ ἧς ἡμέρας ἠκούσαμεν, οὐ παυόμεθα ὑπὲρ ὑμῶν προσευχόμενοι καὶ αἰτούμενοι ἵνα πληρωθῆτε τὴν ἐπίγνωσιν τοῦ θελήματος αὐτοῦ ἐν πάσῃ σοφίᾳ καὶ συνέσει πνευματικῇ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/009.yaml
  text: For this reason[a], we also, from the day we heard, have not ceased praying for you and asking that you may be filled with the knowledge of his will in all spiritual wisdom and understanding[b],
translation:
  language: zh_hans
  text: 因此，自从听见的那一天起，我们也一直不停地为你们祷告、祈求，愿你们在一切属灵的[b]智慧和悟性上，满有对他旨意的认识[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “认识”也可译作“充分的认识”或“深入的认识”；希腊语词可带有更完全、更深入地认识的意味。
    reason: lexical_alternative
  - marker: b
    text: “属灵的”可以指在性质上属灵，也可以指由圣灵所赐。
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: 因此
  rationale: 该短语承接上文所述歌罗西人的信心和爱心，表达因果兼推论关系；“因此”简洁自然。
- source_word: καὶ ἡμεῖς
  choice: 我们……也
  rationale: 保留καί所表达的附加和强调意味，把保罗及其同工也包括在相应行动之中。
- source_word: ἀφ’ ἧς ἡμέρας ἠκούσαμεν
  choice: 自从听见的那一天起
  rationale: 明确标示持续祷告的起点，同时保留原文没有重述所听见之事的简略表达。
- source_word: οὐ παυόμεθα
  choice: 一直不停地
  rationale: 以现代汉语自然表达现在时所含的持续状态，即从当日起直到如今未曾停止。
- source_word: ὑπὲρ ὑμῶν
  choice: 为你们
  rationale: 此处ὑπέρ表示为了对方的益处，是汉语祷告语境中最自然的说法。
- source_word: προσευχόμενοι καὶ αἰτούμενοι
  choice: 祷告、祈求
  rationale: 分别保留一般性的祷告和具体的求告，既避免合并两词，也使汉语句式流畅。
- source_word: ἵνα πληρωθῆτε
  choice: 愿你们满有
  rationale: “满有”保留πληρόω的充满意象；“愿”在祷告语境中自然引出祈求内容。原文被动式暗示施行者，却未明说，因此译文也不增补“上帝使”。
- source_word: τὴν ἐπίγνωσιν
  choice: 认识
  rationale: ἐπίγνωσις可含充分、深入认识之意，但未必必须词汇化为“完全认识”；“满有……认识”既承接充满意象，也避免过度解释。
- source_word: τοῦ θελήματος αὐτοῦ
  choice: 对他旨意的
  rationale: 自然表达属格关系；“旨意”准确保留θέλημα在此处所指上帝的意愿。
- source_word: ἐν πάσῃ σοφίᾳ καὶ συνέσει πνευματικῇ
  choice: 具备一切属灵的智慧和悟性
  rationale: ἐν可表示范围或伴随方式；“具备”使其与“满有认识”的关系在汉语中清楚，同时不把它硬性限定为结果或工具。“属灵的”自然修饰“智慧和悟性”两项。
- source_word: σοφίᾳ
  choice: 智慧
  rationale: “智慧”是σοφία的标准对应词，可涵盖对真理的把握及其实践运用。
- source_word: συνέσει
  choice: 悟性
  rationale: σύνεσις指领会、融会和辨明事理的能力；“悟性”与“智慧”并列时能保留两词的区别，比再次使用“认识”更清楚。
theological_decisions:
- issue: ἐπίγνωσις的语义强度
  choice: 认识
  alternative: 充分的认识；深入的认识
  rationale: 该词可能带有更充分或深入认识的意味，但原文是否特意强化并不完全确定。正文采用中性而自然的“认识”，把可能的强化含义留在脚注中。
- issue: πνευματικῇ所表达的关系
  choice: 属灵的智慧和悟性
  alternative: 圣灵所赐的智慧和悟性
  rationale: 形容词可指性质上属灵，也可能暗示由圣灵赐予。原文没有明确说出赐予者，故正文保留紧凑而开放的表达，并在脚注说明另一可能。
- issue: πληρωθῆτε的隐含施事者
  choice: 愿你们满有
  alternative: 愿上帝使你们满有
  rationale: 被动式在祷告语境中很可能以上帝为隐含施事者，但原文没有明说；译文避免补出主语，以保存原文的表达方式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“一直不停地”清楚表达持续性；“祷告、祈求”保留原文两个近义而不完全相同的动作。“悟性”虽略具书面色彩，但在此处与“智慧”搭配自然，也能避免与前面的“认识”重复。
