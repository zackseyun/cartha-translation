  text: εὐχαριστοῦντες τῷ πατρὶ τῷ ἱκανώσαντι ⸀ὑμᾶς εἰς τὴν μερίδα τοῦ κλήρου τῶν ἁγίων ἐν τῷ φωτί,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/012.yaml
  text: giving thanks to the Father[a], who has qualified you for the share of the inheritance of the saints in the light[b],
translation:
  language: zh_hans
  text: 并且感谢父，他使你们[a]有资格在光明中得享众圣徒基业中的一份[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“我们”。
    reason: textual_variant
  - marker: b
    text: 或译：“在光明中分给众圣徒的产业份额。”原文含有按抽签分配产业的意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐχαριστοῦντες
  choice: 并且感谢
  rationale: 现在时主动分词承接上文，表达持续的感谢；译作“并且感谢”既保留与前文的连接，也符合现代汉语表达。
- source_word: τῷ πατρὶ
  choice: 父
  rationale: 原文明确为“父”，不增添本节未出现的“上帝”。
- source_word: ἱκανώσαντι
  choice: 使……有资格
  rationale: ἱκανόω表示使人足以、合宜或具备资格；此译法保留父主动成就这一资格的含义，不弱化为单纯许可。
- source_word: ὑμᾶς
  choice: 你们
  rationale: 依照所给SBLGNT正文采用第二人称复数；异文“我们”列入脚注。
- source_word: εἰς τὴν μερίδα τοῦ κλήρου
  choice: 分享……的基业
  rationale: μερίς与κλῆρος共同唤起分配份额和承受产业的意象；正文采用自然的现代汉语，脚注保留更贴近形式的译法。
- source_word: τῶν ἁγίων
  choice: 众圣徒
  rationale: 保留保罗书信中对归属上帝、分别为圣之群体的传统称谓，同时明确其群体性。
- source_word: ἐν τῷ φωτί
  choice: 在光明中
  rationale: 保留“光明”的隐喻及其修饰范围上的一定开放性，不具体解释为某个地点、时代或道德状态。
theological_decisions:
- issue: 受词代词的文本异文
  choice: 你们
  alternative: 我们
  rationale: 所给SBLGNT正文为ὑμᾶς（你们）；部分抄本作ἡμᾶς（我们），故正文遵从指定原文，异文收入脚注。
- issue: μερίς与κλῆρος的产业分配意象
  choice: 分享众圣徒的基业
  alternative: 得着分给众圣徒的份额
  rationale: 正文力求自然清楚，并保留共同承受基业的意义；脚注呈现“份额／分配”的原文意象，避免将两词之间的关系解释得过死。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“并且感谢”保留本节分词承接上文的性质；“有资格”强调资格由父成就；“基业”兼顾圣经传统和普通读者的可理解性。所有脚注标记均置于正文相应位置。
