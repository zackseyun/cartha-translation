  text: 保罗，奉上帝旨意作弥赛亚耶稣[a]的使徒，和弟兄提摩太，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“基督耶稣”。希腊语“基督”意为“受膏者”，相当于“弥赛亚”。
    reason: 说明Χριστός的通行译法及其称号含义。
lexical_decisions:
- source_word: Παῦλος
  choice: 保罗
  rationale: 采用该人名在现代汉语《圣经》中的通行译名。
- source_word: ἀπόστολος
  choice: 使徒
  rationale: 这里是保罗对自身职分的正式称谓；“使徒”既符合该词的语义，也保留了其在早期教会中的职分含义。
- source_word: Χριστοῦ Ἰησοῦ
  choice: 弥赛亚耶稣
  rationale: Χριστός在此仍具有“受膏者／弥赛亚”的称号意义；译作“弥赛亚”可使这一含义在现代汉语中保持清楚。“基督耶稣”作为通行教会用语列入脚注。
- source_word: διὰ θελήματος θεοῦ
  choice: 奉上帝旨意
  rationale: διά加属格在此表达保罗成为使徒所依据的神圣旨意；“奉……旨意”是自然、庄重且简洁的现代汉语表达。
- source_word: Τιμόθεος
  choice: 提摩太
  rationale: 采用该人名在现代汉语《圣经》中的通行译名。
- source_word: ὁ ἀδελφὸς
  choice: 弟兄
  rationale: 保留早期信徒群体中的亲属式称谓。汉语“弟兄提摩太”无需补出“我们的”，便能自然表达原文定冠词短语的关系含义。
theological_decisions:
- issue: Χριστός的称号含义
  choice: 弥赛亚
  alternative: 基督
  rationale: 在“Χριστοῦ Ἰησοῦ的使徒”这一正式身份说明中，Χριστός仍可理解为称号，而不只是姓名的一部分。正文译为“弥赛亚”以呈现其语义，同时用脚注保留汉语基督教传统中更通行的“基督”。
- issue: ὁ ἀδελφός的群体关系
  choice: 弟兄
  alternative: 我们的弟兄
  rationale: 原文直译为“那弟兄／弟兄”，并无第一人称复数代词。现代汉语在此用“弟兄提摩太”已足以表达共同信仰群体中的关系，避免不必要地补入“我们的”。
translation_notes:
  register: 采用现代、庄重而易懂的书信开头语体。句末保留逗号，因为本节是书信署名的一部分，语法和内容在下一节继续。
