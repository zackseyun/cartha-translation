id: COL.1.16
reference: Colossians 1:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὅτι ἐν αὐτῷ ἐκτίσθη τὰ ⸀πάντα ἐν τοῖς οὐρανοῖς ⸀καὶ ἐπὶ τῆς γῆς, τὰ ὁρατὰ καὶ τὰ ἀόρατα, εἴτε θρόνοι εἴτε κυριότητες εἴτε ἀρχαὶ εἴτε ἐξουσίαι· τὰ πάντα δι’ αὐτοῦ καὶ εἰς αὐτὸν ἔκτισται·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/016.yaml
  text: For in him all things were created[a], in the heavens and on the earth, the visible and the invisible, whether thrones or dominions or rulers or authorities[d][c][b]; all things have been created through him and for him.
translation:
  language: zh_hans
  text: 因为万有都是在他里面被创造的[a]：无论是天上的、地上的，看得见的、看不见的，或是宝座、统治权、统治者、权柄[b]；万有都是借着他而被创造，也是为着他而被创造的[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在他里面”也有人理解为“由他”；这里保留原文的“在……里面”，与后文“借着他”所用的不同介词相区别。
    reason: lexical_alternative
  - marker: b
    text: “宝座、统治权、统治者、权柄”可能指各种受造的权位或掌权力量；本节没有限定它们只属于灵界或人间。
    reason: ambiguity_preservation
  - marker: c
    text: “为着他”也可译作“归于他”；原文含有以他为目的和终向的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 承接上文，为关于子的崇高地位提供理由；中文“因为”自然保留其因果作用。
- source_word: ἐν αὐτῷ
  choice: 在他里面
  rationale: 保留ἐν的表达，不译作工具性的“借着他”，因为后文另用δι’ αὐτοῦ表达中介或途径，从而保存三个介词短语的区别。
- source_word: ἐκτίσθη / ἔκτισται
  choice: 被创造的 / 创造的
  rationale: 前者是不定过去时被动语态，指创造的发生；后者是完成时被动语态，强调已成就且结果仍然成立。中文第二处以语境自然的“都是……创造的”表达。
- source_word: τὰ πάντα
  choice: 万有
  rationale: “万有”简洁、庄重，并能表达受造界无所不包的范围，不将其缩窄为某一类事物。
- source_word: ἐν τοῖς οὐρανοῖς καὶ ἐπὶ τῆς γῆς
  choice: 天上的、地上的
  rationale: 符合现代汉语并保留天地之间的总体对举；希腊文“诸天”为复数，但中文通常用“天上”自然涵盖。
- source_word: τὰ ὁρατὰ καὶ τὰ ἀόρατα
  choice: 看得见的、看不见的
  rationale: 将作名词使用的形容词译成自然易懂的中文，同时清楚保留可见与不可见的对照。
- source_word: θρόνοι
  choice: 宝座
  rationale: 采用直接对应词，保留其可能指某类崇高权位或掌权者的意象，不在正文中限定其性质。
- source_word: κυριότητες
  choice: 主权
  rationale: 表达κυριότης所含的统辖、支配地位，并与“统治者”和“权柄”保持词义区分。
- source_word: ἀρχαὶ
  choice: 统治者
  rationale: 以现代读者容易理解的词表达掌权者或统治力量之意，避免较生僻的“执政者”式术语化表达。
- source_word: ἐξουσίαι
  choice: 权柄
  rationale: 直接表达被授予或具有的权威、管辖权，并与ἀρχαί区分。
- source_word: δι’ αὐτοῦ καὶ εἰς αὐτόν
  choice: 借着他、为着他
  rationale: “借着”表达中介关系，“为着”表达趋向和目的；不把两者合并为笼统的创造主体陈述。
theological_decisions:
- issue: 子与创造在ἐν αὐτῷ、δι’ αὐτοῦ、εἰς αὐτόν三个介词短语中的关系
  choice: 译作“在他里面……借着他、为着他”
  alternative: 译作“由他……借着他……归于他”
  rationale: 原文刻意使用不同介词，分别呈现创造与子的多重关系。译文保留这种层次，不把“在他里面”直接解释为“由他”，也不消除εἰς所含的趋向和目的意味。
- issue: “宝座、主权、统治者、权柄”的具体所指
  choice: 保留为受造权势或权位的类别，不限定为纯属天使、灵界或人间政治秩序
  alternative: 明确译成天使的等级，或明确解释为地上的政治制度
  rationale: 本节将这些类别纳入万有，却没有在此精确定义其本体性质；译文不应加入原文没有明说的分类。
- issue: εἰς αὐτόν的目的与终向意味
  choice: 译作“为着他”
  alternative: 译作“归于他”
  rationale: “为着他”自然表达创造以他为目的；“归于他”能突出终向，但可能使读者偏重最终归宿。正文采用前者，脚注保存后者。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“万有”保持经文的宇宙性范围；“在他里面—借着他—为着他”保留原文介词层次。句中用分号对应前后两个创造陈述，并避免把权势类别过度解释为特定的天使等级或政治组织。
