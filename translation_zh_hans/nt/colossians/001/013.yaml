  text: ὃς ἐρρύσατο ἡμᾶς ἐκ τῆς ἐξουσίας τοῦ σκότους καὶ μετέστησεν εἰς τὴν βασιλείαν τοῦ υἱοῦ τῆς ἀγάπης αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/013.yaml
  text: who rescued us from the authority of darkness and transferred us into the kingdom of the Son of his love,[a]
translation:
  language: zh_hans
  text: 他救我们脱离了黑暗的权势，又把我们迁入他所爱的儿子的国度[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他的爱子的国度”；原文较直译为“他之爱的儿子的国度”。
    reason: 保留τοῦ υἱοῦ τῆς ἀγάπης αὐτοῦ的惯用理解及其属格结构所具有的表达张力。
lexical_decisions:
- source_word: ἐρρύσατο
  choice: 救……脱离
  rationale: ῥύομαι表示从危险或敌对势力中搭救、解救；“救……脱离”自然清楚，也保留了上帝主动施行拯救的含义。
- source_word: ἐξουσίας
  choice: 权势
  rationale: ἐξουσία可指权柄、管辖权或统治势力；在“黑暗”的拟人化统治语境中，“权势”既贴近词义，也比“领域”少一层空间化解释。
- source_word: σκότους
  choice: 黑暗
  rationale: σκότος直译为“黑暗”；其道德和属灵含义由上下文承载，不在正文中加以扩展。
- source_word: μετέστησεν
  choice: 迁入
  rationale: μεθίστημι表示从一处或一种处境转移到另一处或另一种处境；“迁入”与后面的“国度”搭配自然，并保留从一种统治转到另一种统治之下的图景。
- source_word: βασιλείαν
  choice: 国度
  rationale: βασιλεία可表示王权、统治或国度；在εἰς和转移图景之下，“国度”最自然，同时仍含有儿子掌权的意思。
- source_word: υἱοῦ
  choice: 儿子
  rationale: υἱός的基本义是“儿子”。现代汉语没有通过大小写标示独特身份的方式，因此不另加解释性称号。
- source_word: τοῦ υἱοῦ τῆς ἀγάπης αὐτοῦ
  choice: 他所爱的儿子
  rationale: 希腊文直译近于“他之爱的儿子”。“他所爱的儿子”以自然现代汉语表达该属格结构通常传达的意思，又保留父对子的爱这一明确关系；较凝练的“他的爱子”列入脚注。
theological_decisions:
- issue: 如何翻译τοῦ υἱοῦ τῆς ἀγάπης αὐτοῦ这一属格短语
  choice: 他所爱的儿子
  alternative: 他的爱子；较直译：他之爱的儿子
  rationale: 该短语强调父对儿子的爱。正文采用语义透明、现代自然的表达，不把它扩展为额外的基督论说明；脚注保留传统凝练译法及希腊文结构的提示，以呈现原文语感。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“救……脱离”与“迁入”形成从黑暗权势转入儿子国度的对应；加入“又”使两个并列动词在汉语中衔接自然，但不增加新的逻辑关系。
