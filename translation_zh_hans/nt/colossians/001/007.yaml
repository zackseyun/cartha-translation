source:
  edition: SBLGNT
  text: ⸀καθὼς ἐμάθετε ἀπὸ Ἐπαφρᾶ τοῦ ἀγαπητοῦ συνδούλου ἡμῶν, ὅς ἐστιν πιστὸς ὑπὲρ ⸀ἡμῶν διάκονος τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/007.yaml
  text: just as you learned from Epaphras[a], our beloved fellow slave, who is a faithful minister of the Messiah on our behalf[c][b],
translation:
  language: zh_hans
  text: 正如你们从以巴弗那里所学到的；他是我们亲爱的同作奴仆[a]，并且代表我们[b]作弥赛亚[c]的一位忠心服事者。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “同作奴仆”所译的希腊词，字面指与别人一同隶属于同一位主人的奴仆；也可译作“一同服事的仆人”。
    reason: lexical_alternative
  - marker: b
    text: “代表我们”也可译作“为我们”。有些古抄本作“代表你们”或“为你们”。
    reason: textual_and_translation_alternative
  - marker: c
    text: 希腊文为Christou，意为“受膏者”；传统上也译作“基督”。
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: 正如
  rationale: 承接上文，保留比较和对应关系，也符合现代汉语书面表达。
- source_word: ἐμάθετε ἀπὸ Ἐπαφρᾶ
  choice: 你们从以巴弗那里所学到的
  rationale: ἀπό表示学习内容的来源；不补出希腊文没有明说的宾语。
- source_word: τοῦ ἀγαπητοῦ συνδούλου ἡμῶν
  choice: 我们亲爱的同作奴仆
  rationale: 保留亲爱之情，也保留σύνδουλος所表达的共同隶属于同一位主人的奴仆意象。
- source_word: πιστὸς
  choice: 忠心的
  rationale: 在服事语境中既可表达可靠，也可表达忠诚；“忠心”自然且贴合语境。
- source_word: ὑπὲρ ἡμῶν
  choice: 代表我们
  rationale: 突出ὑπέρ加属格在此可能具有的代表性含义，同时脚注保留较宽泛的受益性译法。
- source_word: διάκονος
  choice: 服事者
  rationale: 表达承担服事的人，不把该词技术化为后来教会职分意义上的“执事”。
- source_word: τοῦ Χριστοῦ
  choice: 弥赛亚
  rationale: Χριστός在此指受膏者这一称号；译作“弥赛亚”保留称号的语义。
theological_decisions:
- issue: σύνδουλος中的奴仆意象
  choice: 同作奴仆
  alternative: 一同服事的仆人
  rationale: 原词不只表示共同工作，也含有共同隶属同一主人的关系；正文保留这一张力，不将其弱化为一般同工。
- issue: Χριστός的称号意义
  choice: 弥赛亚
  alternative: 基督
  rationale: 本处可自然理解为称号；采用“弥赛亚”显明“受膏者”的身份意义，同时以脚注说明传统译法。
- issue: ὑπὲρ ἡμῶν的范围
  choice: 代表我们
  alternative: 为我们
  rationale: 正文表达代表性，但“为我们”也可能涵盖受益或服务之意，因此不将较宽的可能性完全排除。
- issue: διάκονος是否指正式职分
  choice: 服事者
  alternative: 执事
  rationale: 上下文没有要求将其理解为制度化职分；“服事者”避免把后来的教会职称读入经文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“同作奴仆”有意保留原文较强的隶属意象；“服事者”则避免让读者误以为这里必然指正式的教会职分。
