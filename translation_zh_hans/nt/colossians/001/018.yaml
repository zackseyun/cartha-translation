  text: καὶ αὐτός ἐστιν ἡ κεφαλὴ τοῦ σώματος τῆς ἐκκλησίας· ὅς ⸀ἐστιν ἀρχή, πρωτότοκος ἐκ τῶν νεκρῶν, ἵνα γένηται ἐν πᾶσιν αὐτὸς πρωτεύων,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/018.yaml
  text: And he is the head of the body[a], the church; he is the beginning, the firstborn from the dead, so that he himself might become preeminent in all things[b],
translation:
  language: zh_hans
  text: 他也是身体的头；这身体就是教会。他是开端[a]，是从死人中复生的长子，为要使他自己在万有中居首位[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “开端”或译“源头”或“掌权者”。
    reason: lexical_alternative
  - marker: b
    text: 或译“在一切事上占第一位”。
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτός
  choice: 他／他自己
  rationale: 首处按现代汉语自然表达译作“他”；末处保留强调语气，译作“他自己”。
- source_word: κεφαλή
  choice: 头
  rationale: 直接保留基督与身体的比喻，不将其限定解释为“领袖”或“源头”。
- source_word: σῶμα
  choice: 身体
  rationale: 与“头”相配，保留群体性身体的完整意象。
- source_word: ἐκκλησία
  choice: 教会
  rationale: 符合保罗书信语境，指作为基督身体的信徒群体。
- source_word: ἀρχή
  choice: 开端
  rationale: 与下文“从死人中复生的长子”相呼应，表达基督开启复活的新秩序，同时以脚注保留“源头”或“掌权者”的词义可能。
- source_word: πρωτότοκος
  choice: 长子
  rationale: 保留“首生者”的词形及其圣经互文意义；此词在这里涉及复活中的首位，不应直接改写为仅表示时间次序的“第一个复活者”。
- source_word: ἐκ τῶν νεκρῶν
  choice: 从死人中复生
  rationale: 以自然汉语表达从死人中出来的复活含义；“复生”为语境所明确蕴含。
- source_word: ἵνα γένηται
  choice: 为要使……居
  rationale: “为要”保留目的兼结果的语气；中文谓语“居首位”自然承载“成为／处于”的含义。
- source_word: ἐν πᾶσιν
  choice: 在万有中
  rationale: 中性复数在上下文中具有广阔、宇宙性的范围，“万有”比“所有人中”更贴切。
- source_word: πρωτεύων
  choice: 居首位
  rationale: 直接表达占第一位、居于首位，避免用较抽象的“至高无上”扩大原词含义。
theological_decisions:
- issue: 基督作为身体之“头”（κεφαλή）的含义
  choice: 保留“头”的比喻，不明确限定为权柄或源头
  alternative: 领袖／身体的源头
  rationale: 希腊文的比喻内涵丰富；直译可保留其神学张力，避免替文本裁定有争议的单一解释。
- issue: ἀρχή在复活语境中的含义
  choice: 开端
  alternative: 源头／掌权者
  rationale: 紧接着的“从死人中复生的长子”支持“开端”这一理解，但该词仍有“源头”及“掌权者”的词义可能，故在脚注中保留。
- issue: πρωτότοκος ἐκ τῶν νεκρῶν的力量
  choice: 从死人中复生的长子
  alternative: 第一个从死人中复生的／死人中的首位者
  rationale: “长子”保留原词及其关于地位与次序的双重意味；下文“居首位”进一步明说其尊首地位，不能把该词理解为受造性陈述。
- issue: ἵνα γένηται中“成为”的语气
  choice: 为要使他自己……居首位
  alternative: 使他自己……成为居首位的
  rationale: 保留目的或结果关系以及强调代词，同时采用自然汉语；不将“成为”解释为基督此前缺少尊荣。
translation_notes:
  register: 采用现代、庄重而通顺的书面普通话。“身体——教会——”以破折号清楚表明“教会”是“身体”的同位说明；“长子”“万有”保留经文的圣经语体，但整体仍便于普通读者理解。
