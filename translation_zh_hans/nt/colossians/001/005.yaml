  text: διὰ τὴν ἐλπίδα τὴν ἀποκειμένην ὑμῖν ἐν τοῖς οὐρανοῖς, ἣν προηκούσατε ἐν τῷ λόγῳ τῆς ἀληθείας τοῦ εὐαγγελίου
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/005.yaml
  text: because of the hope laid up for you in the heavens[a], which you heard before in the word of truth[d][c][b], the gospel
translation:
  language: zh_hans
  text: 因为那为你们存留在诸天里的盼望[a]；关于这盼望，你们先前已经在真理的话语——就是福音——中听闻过[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在天上”。希腊文是复数，直译为“在诸天里”。
    reason: lexical_alternative
  - marker: b
    text: “先前已经听闻过”也可译为“预先听见”或“从前听见”。
    reason: lexical_alternative
  - marker: c
    text: “真理的话语”也可译为“真理的信息”；“福音”与它是同位语，用来说明这话语或信息是什么。
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὴν ἐλπίδα
  choice: 因为……盼望
  rationale: διά加宾格在这里最自然地表示原因，承接上文保罗感恩的缘由；“盼望”保留ἐλπίς在保罗书信中的常用表达。
- source_word: ἀποκειμένην ὑμῖν
  choice: 为你们存留
  rationale: ἀπόκειμαι指保存、留待将来享有；“存留”既保留这一意象，也以“为你们”表达ὑμῖν所含的受益关系。
- source_word: ἐν τοῖς οὐρανοῖς
  choice: 在诸天之上
  rationale: 保留希腊文复数形式；“诸天”在现代中文圣经语体中可懂，“之上”自然表达该盼望存留于天上领域。
- source_word: ἣν προηκούσατε
  choice: 关于这盼望，你们先前已经……听见了
  rationale: 阴性单数关系代词ἣν直接回指ἐλπίδα；加入“关于”使中文自然，并让προακούω的“先前听见”之意清楚呈现。
- source_word: ἐν τῷ λόγῳ τῆς ἀληθείας
  choice: 在真理的话语……中
  rationale: λόγος可指“话语”或“信息”；正文采用较贴近原文且庄重易懂的“话语”，不把“真理”仅处理为形容词“真实的”。
- source_word: τοῦ εὐαγγελίου
  choice: 就是福音
  rationale: 将属格短语理解为同位说明，以“就是”明确指出“福音”说明前面的“真理的话语”，而不是另添一个独立概念。
theological_decisions:
- issue: 关系从句的所指
  choice: 明确回指“盼望”
  alternative: 宽泛地指前述整件事或直接指福音信息
  rationale: ἣν在性、数上与ἐλπίδα一致，最直接的句法所指是“盼望”；正文用“关于这盼望”保留这一重点。
- issue: οὐρανοῖς的单复数
  choice: 正文采用复数“诸天”
  alternative: 采用惯用单数“天上”
  rationale: 希腊文使用复数。保留复数不必然建立特定宇宙层级教义，只是忠实呈现原文形式。
- issue: “真理的话语”与“福音”的关系
  choice: 把“福音”处理为同位说明
  alternative: 把τοῦ εὐαγγελίου理解为所属或内容关系，如“福音的真理之道”
  rationale: 同位关系最顺畅地解释连续属格结构，也保留原文以“福音”识别“真理的话语”的表达。
translation_notes:
  register: 采用现代、庄重而可懂的中文。保留“诸天”“真理的话语”等原文特色，同时借助“关于”和“就是”使句法关系自然清楚。本节在原文中承接上文，故以“因为”起句，保留其跨节连接。
