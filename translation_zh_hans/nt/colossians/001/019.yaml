  yaml_path: translation/nt/colossians/001/019.yaml
  text: For in him all the fullness was pleased to dwell[c][b][a],
translation:
  language: zh_hans
  text: 原来，一切的丰盛[c]都乐意居住在他里面[b][a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “原来”也可译作“因为”；原文连接词在上下文中可用不同方式表达其解释或说明作用。
    reason: lexical_alternative
  - marker: b
    text: “一切的丰盛”也可按宾语理解，并补出原文没有明说的主语，译作：“因为上帝乐意使一切的丰盛居住在他里面”或“因为父乐意……”。原文并未直接说明这个主语。
    reason: alternative_reading
  - marker: c
    text: “一切的丰盛”通常被理解为上帝的丰盛；参歌罗西书2:9。
    reason: cross_reference
lexical_decisions:
- source_word: ὅτι
  choice: 原来
  rationale: 此处承接上文，为关于子的论述说明根据。“原来”在现代汉语中自然地表达解释、说明的语气，同时避免把逻辑关系限定得过死。
- source_word: ἐν αὐτῷ
  choice: 在他里面
  rationale: 代词在上下文中回指爱子；保留代词，不在本节正文中增添“基督”或“弥赛亚”等称号。
- source_word: εὐδόκησεν
  choice: 乐意
  rationale: 表达 εὐδοκέω 所含的喜悦、认可和意愿；“乐意”既简洁自然，也保留原句将“一切的丰盛”理解为语法主语的可能。
- source_word: πᾶν τὸ πλήρωμα
  choice: 一切的丰盛
  rationale: 保留 πᾶν 的整体、完全之意及 πλήρωμα 的神学分量，不把原文未明说的“上帝的”加入正文。
- source_word: κατοικῆσαι
  choice: 住
  rationale: κατοικέω 指居住、安居；“住在他里面”是清楚自然的现代汉语，也与本书2:9的相关表述便于呼应。
theological_decisions:
- issue: εὐδόκησεν 的主语及 πᾶν τὸ πλήρωμα 的句法功能
  choice: 正文按“一切的丰盛”作主语译为“一切的丰盛都乐意住在他里面”，并以脚注说明另一种常见分析。
  alternative: 补出隐含主语，译为“上帝乐意使一切的丰盛住在他里面”或“父乐意使自己一切的丰盛住在他里面”。
  rationale: 中性形式 πᾶν τὸ πλήρωμα 在形态上既可能是主格，也可能是宾格。正文采用不补出“上帝”或“父”的译法，尽量贴近原文字面；脚注保存把它视为宾语并补出隐含主语的解释可能。
- issue: “丰盛”的所指
  choice: 保留“一切的丰盛”，不在正文中扩写为“上帝一切的丰盛”。
  alternative: 上帝一切的丰盛；他一切的丰盛。
  rationale: 上下文以及歌罗西书2:9强烈支持这里指上帝的丰盛，但本节没有明说所属关系，因此正文不增添所有格，脚注提供说明和交叉参照。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“原来”保持解释性衔接；“乐意住在他里面”略带拟人色彩，但忠实保存原文可将“丰盛”视为主语的结构。所有必要的句法和神学补充均置于脚注，不在正文中消除原文张力。
