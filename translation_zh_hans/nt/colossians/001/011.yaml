  text: ἐν πάσῃ δυνάμει δυναμούμενοι κατὰ τὸ κράτος τῆς δόξης αὐτοῦ εἰς πᾶσαν ὑπομονὴν καὶ μακροθυμίαν μετὰ χαρᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/011.yaml
  text: being strengthened with all power[a], according to the might of his glory, for all endurance and patience with joy,
translation:
  language: zh_hans
  text: 照着他荣耀的权能，不断得着各样能力，为要有完全的坚忍和忍耐，并带着喜乐。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “带着喜乐”也可能与下一节相连，译作“带着喜乐感谢父”。另，“照着他荣耀的权能”也可顺译为“照着他荣耀的大能”；原文较直译为“照着他荣耀的权能”。
    reason: syntactic_ambiguity; lexical_alternative
lexical_decisions:
- source_word: ἐν πάσῃ δυνάμει
  choice: 以一切能力
  rationale: ἐν加与格在此可表凭借或所处范围；“以一切能力”既保留原文的概括性，也符合现代汉语表达。
- source_word: δυναμούμενοι
  choice: 不断得着刚强
  rationale: 现在时被动分词表示持续领受力量；“得着刚强”保留被动意味，不明说原文未明示的施动者。
- source_word: κατὰ τὸ κράτος
  choice: 照着……的权能
  rationale: κατά加宾格表示准则或尺度；“照着”保留所得力量与神的权能相称之意。“权能”也与前面的“能力”有所区别，反映δύναμις和κράτος两个近义词的叠用。
- source_word: τῆς δόξης αὐτοῦ
  choice: 他荣耀的
  rationale: 保留属格结构及其浓缩表达，不直接将其化解为单纯形容词“荣耀的大能”。
- source_word: εἰς πᾶσαν ὑπομονὴν
  choice: 为要有充分的坚忍
  rationale: εἰς表示目的或结果；“为要”在此自然地表达目的。“充分的”传达πᾶσαν的完备、全面意味；“坚忍”侧重在困境中持守不移。
- source_word: μακροθυμίαν
  choice: 耐心
  rationale: 此词可指长久忍耐，尤其是对人不轻易发怒；“耐心”通俗自然，并与“坚忍”保持相关而有区别。
- source_word: μετὰ χαρᾶς
  choice: 带着喜乐
  rationale: 直译介词短语并保留χαρά的名词形式，同时不过度限定它只修饰“坚忍和耐心”还是与下节的感谢相连。
theological_decisions:
- issue: 信徒所得力量与神荣耀之间的关系
  choice: “照着他荣耀的权能”保留原文“他荣耀的权能”这一浓缩属格结构。
  alternative: “照着他荣耀的大能”或“照着他荣耀所彰显的权能”
  rationale: 原文可自然理解为与神荣耀相关、具有荣耀特质的权能；不添加“所彰显的”等解释性措辞，可避免把神学关系限定得过窄。
- issue: “带着喜乐”的句法归属
  choice: 正文将其放在本节末尾，同时用脚注说明也可能与下节相连。
  alternative: “并且喜乐地感谢父”
  rationale: 希腊文连续书写容许μετὰ χαρᾶς修饰本节的坚忍和耐心，也可能与下一节的感谢相连；译文不应悄然消除这一真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“不断得着刚强”呈现持续的被动过程；“坚忍和耐心”分别表达在困境中持守与长久忍耐。保留“他荣耀的权能”的密集表达，并以脚注交代可接受的顺译及跨节句法歧义。
