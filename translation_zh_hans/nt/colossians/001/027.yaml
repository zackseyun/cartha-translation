  text: οἷς ἠθέλησεν ὁ θεὸς γνωρίσαι τί τὸ πλοῦτος τῆς δόξης τοῦ μυστηρίου τούτου ἐν τοῖς ἔθνεσιν, ⸀ὅ ἐστιν Χριστὸς ἐν ὑμῖν, ἡ ἐλπὶς τῆς δόξης·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/027.yaml
  text: To them God chose to make known what is the riches of the glory of this mystery among the Gentiles[a], which is Messiah in you[b], the hope of glory.
translation:
  language: zh_hans
  text: 神愿意让他们知道，这奥秘在外邦人中有何等丰盛的荣耀；这奥秘就是弥赛亚在你们里面[a]，是荣耀的盼望。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在你们中间”。原文既可指弥赛亚在信徒里面，也可指他在外邦信徒群体中间。
    reason: 保留ἐν ὑμῖν在内在同在与群体中同在之间的真实歧义。
lexical_decisions:
- source_word: οἷς
  choice: 让他们知道
  rationale: 关系代词为复数与格，回指上一节的圣徒，并作“使……知道”的间接宾语；汉语用“让他们知道”自然表达。
- source_word: ἠθέλησεν
  choice: 愿意
  rationale: θέλω表示意愿或定意；“愿意”既贴近词义，也不额外强化为预定意义。
- source_word: γνωρίσαι
  choice: 让……知道
  rationale: γνωρίζω的基本义是“使知道、使人认识”；此处采用现代汉语的自然表达。
- source_word: τί τὸ πλοῦτος τῆς δόξης
  choice: 有何等丰盛的荣耀
  rationale: 该希腊语结构浓缩而带强调意味；这一译法保留“丰盛”和“荣耀”的修饰关系，并以自然汉语传达其程度意味。
- source_word: μυστηρίου
  choice: 奥秘
  rationale: 保罗所说的是从前隐藏、如今显明的神圣旨意，并非无法理解的谜；“奥秘”是准确且通行的译法。
- source_word: ἐν τοῖς ἔθνεσιν
  choice: 在外族人中
  rationale: 语境中ἔθνη指犹太人以外的各族；“外族人”清楚保留犹太人与列族之间的区别，同时避免“外邦人”在现代汉语中可能带有的贬义色彩。
- source_word: ὅ ἐστιν
  choice: 这奥秘就是
  rationale: 关系代词解释并确认前述奥秘的内容；汉语补出“这奥秘”，使指代清楚。
- source_word: Χριστὸς
  choice: 弥赛亚
  rationale: 此处Χριστός在解释奥秘内容时保有称号功能，译为“弥赛亚”可显明其“受膏者”称号，而非仅作名字处理。
- source_word: ἐν ὑμῖν
  choice: 在你们里面
  rationale: 直译保留内在同在的可能性；原文也可表示“在你们中间”，故以脚注保留群体性理解。
- source_word: ἡ ἐλπὶς τῆς δόξης
  choice: 荣耀的盼望
  rationale: 保留紧凑的属格结构，不进一步限定为“得荣耀的盼望”或“对荣耀的盼望”。
theological_decisions:
- issue: Χριστός的称号性质
  choice: 弥赛亚
  alternative: 基督
  rationale: 该词在“奥秘就是……”的解释性陈述中具有明确称号意味；采用“弥赛亚”而不把它仅当作专名。
- issue: ἐν ὑμῖν的范围
  choice: 在你们里面
  alternative: 在你们中间
  rationale: 复数“你们”既可指弥赛亚在信徒里面，也可指他在外族信徒群体中间；正文采用较直接的空间表达，脚注保留群体性读法，避免消解原文张力。
- issue: τῆς δόξης与πλοῦτος的关系
  choice: 丰盛的荣耀
  alternative: 荣耀的丰盛
  rationale: 希腊语属格结构可用不同汉语次序表达；正文以较自然的现代汉语传达奥秘之荣耀的丰盛，不将其改写成额外的系统神学命题。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“外族人”用于表达犹太人以外的各族；以分号划分奥秘的丰盛荣耀与其具体内容，使长句清晰。所有脚注标记均已置于正文。
