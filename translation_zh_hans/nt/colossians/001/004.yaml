  text: ἀκούσαντες τὴν πίστιν ὑμῶν ἐν Χριστῷ Ἰησοῦ καὶ τὴν ἀγάπην ⸂ἣν ἔχετε⸃ εἰς πάντας τοὺς ἁγίους
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/004.yaml
  text: having heard of your faith in Messiah Jesus and the love that you have for all the saints,[a]
translation:
  language: zh_hans
  text: 我们听说了你们在弥赛亚耶稣里的信心，也听说了你们对所有圣徒所怀的爱。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “信心”也可译作“信实”或“信靠”。希腊语 pistis（πίστις）可依语境表达这些彼此相关的意思。
    reason: 保留 πίστις 的相关语义可能，避免将本节只限定为一种神学解释。
lexical_decisions:
- source_word: ἀκούσαντες
  choice: 我们听说了
  rationale: 该不定过去时分词承接上一节的主语“我们”，说明感恩祷告的背景。汉语以完整谓语表达较自然，同时不额外断定其时间关系。
- source_word: πίστιν
  choice: 信心
  rationale: “信心”是现代汉语中对 πίστις 的常用表达；在 ἐν Χριστῷ Ἰησοῦ 这一结构中，主要指读者与弥赛亚耶稣相关联的信。其“信靠”或“信实”意味在脚注中保留。
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: 在弥赛亚耶稣里
  rationale: 保留 ἐν 的关系性、领域性表达，不简化为单纯的“对”；Χριστός 按称号译为“弥赛亚”，Ἰησοῦ 按人名译为“耶稣”。
- source_word: ἀγάπην
  choice: 爱
  rationale: “爱”准确、自然地表达 ἀγάπη，也适合本节所说信徒对群体中众人的爱。
- source_word: ἣν ἔχετε
  choice: 所怀的
  rationale: 明确保留原文关系从句，表达这爱是读者实际具有并持守的；“所怀的爱”比直译“所拥有的爱”更符合现代汉语。
- source_word: εἰς πάντας τοὺς ἁγίους
  choice: 对所有圣徒
  rationale: εἰς 在此表示爱的对象，译为“对”自然准确；“所有”完整表达 πάντας，“圣徒”保留保罗对属神群体成员的惯用称呼。
theological_decisions:
- issue: Χριστῷ 应译作称号还是沿用音译式传统用语
  choice: 弥赛亚耶稣
  alternative: 基督耶稣
  rationale: Χριστός 在此与人名“耶稣”连用，仍具有称号意义；译作“弥赛亚”使普通读者能辨认其“受膏者”的身份称号，同时避免把它当作姓氏。
- issue: πίστις 在本节中的语义范围
  choice: 信心
  alternative: 信实；信靠
  rationale: 上下文最自然地指歌罗西信徒在弥赛亚耶稣里的信，但 πίστις 本身可涵盖信靠和信实。正文采用常用且较宽的“信心”，脚注保留其他真实可能，不将其神学张力静默消除。
- issue: ἀκούσαντες 与上一节的逻辑关系
  choice: 以“我们听说了”承接上下文
  alternative: 因为我们听说了；自从我们听说以后
  rationale: 分词可能带有原因或时间色彩，但原文未用明确的原因或时间连词。正文不添加“因为”或“自从”，以免过度限定其逻辑关系。
translation_notes:
  register: 采用现代、庄重而通顺的标准普通话。“在弥赛亚耶稣里”保留保罗特有的关系性措辞；“圣徒”作为关键群体称谓予以保留。为使分词结构在汉语中自然，补出承接上一节的主语“我们”，并以两个“听说了”清楚统摄并列的“信心”和“爱”。
