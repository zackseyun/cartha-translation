  text: ὁ καὶ δηλώσας ἡμῖν τὴν ὑμῶν ἀγάπην ἐν πνεύματι.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/008.yaml
  text: and who also made known to us your love in the Spirit[a].
translation:
  language: zh_hans
  text: 他也把你们在圣灵里的爱告诉了我们[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们属灵的爱”或“你们在灵里的爱”。
    reason: 原文ἐν πνεύματι既可能指“在圣灵里”，也可能较宽泛地指属灵的领域或方式。
lexical_decisions:
- source_word: ὁ ... δηλώσας
  choice: 他……告诉了
  rationale: 带冠词的过去时分词作名词性用法，回指上一节的以巴弗；中文用“他……告诉了”自然承接。δηλόω在此指把某事报告或告知别人。
- source_word: καὶ
  choice: 也
  rationale: 表示以巴弗在上一节所述行动之外又做了一件事；中文以“也”准确表达其附加意味。
- source_word: ἡμῖν
  choice: 我们
  rationale: 该与格作间接宾语，指保罗及其同工；“告诉了我们”符合现代汉语习惯。
- source_word: τὴν ὑμῶν ἀγάπην
  choice: 你们……的爱
  rationale: ἀγάπη按本项目常规译为“爱”；属格ὑμῶν表达这爱属于或出自歌罗西信徒。
- source_word: ἐν πνεύματι
  choice: 在圣灵里
  rationale: 保罗书信的语境支持将πνεῦμα理解为圣灵；“在圣灵里”保留介词短语的领域意味，不将其过度解释为圣灵所赐或所产生的爱。原文没有冠词所留下的另一种理解在脚注中保留。
theological_decisions:
- issue: πνεύματι的所指
  choice: 正文采用“圣灵”，将短语译为“你们在圣灵里的爱”
  alternative: “你们属灵的爱”或“你们心灵里的爱”
  rationale: 在保罗惯常用语及基督徒生命结果子的语境中，指圣灵较为可能；然而原文形式也容许把它理解为属灵领域或心灵状态，因此用脚注保留这一真实歧义。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“他”明确承接上一节的以巴弗；“在圣灵里”保留原文简洁结构及神学张力。
