  text: ἧς ἐγενόμην ἐγὼ διάκονος κατὰ τὴν οἰκονομίαν τοῦ θεοῦ τὴν δοθεῖσάν μοι εἰς ὑμᾶς πληρῶσαι τὸν λόγον τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/025.yaml
  text: of which I became a servant according to the stewardship from God given to me for you[a], to fulfill the word of God[b],
translation:
  language: zh_hans
  text: 我成了这教会的仆人，是照着神所赐给我的管家职分，为了你们，为要成全神的话。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使神的话充分传开”，或“完成神的话”。
    reason: alternative_reading
lexical_decisions:
- source_word: ἧς
  choice: 这教会的
  rationale: 阴性单数属格关系代词回指上一节的 ἐκκλησία（教会）；结合本节独立呈现的需要，明确译出所指对象。
- source_word: ἐγενόμην
  choice: 我成了
  rationale: 保留 γίνομαι 不定过去时所表达的进入某种身份或职分之意，不强化原文未明说的被动任命。
- source_word: διάκονος
  choice: 仆人
  rationale: 此处指为教会服事的人；“仆人”通俗自然，也避免误读为后期固定的教会职衔“执事”。
- source_word: κατὰ τὴν οἰκονομίαν τοῦ θεοῦ
  choice: 照着神所赐给我的管家职分
  rationale: οἰκονομία 表示受托管理的责任或职分；“管家职分”保留受托管理的意象，并将其来自神的关系自然融入下文。
- source_word: τὴν δοθεῖσάν μοι
  choice: 所赐给我的
  rationale: 准确表达修饰 οἰκονομίαν 的被动分词及与格 μοι；“赐”符合神授予使命的语境。
- source_word: εἰς ὑμᾶς
  choice: 为了你们
  rationale: 表达该受托职分以歌罗西信徒为对象并使他们受益的方向。
- source_word: πληρῶσαι
  choice: 使……得以成全
  rationale: 保留 πληρόω 的“使之达到完全、成全”语义及本书的丰满语言，同时不把含义单一限定为“充分传扬”。
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: 神的话
  rationale: 既可指神所启示并传扬的信息，也保留该固定表达的经文互文意味。
theological_decisions:
- issue: πληρῶσαι τὸν λόγον τοῦ θεοῦ 的含义
  choice: 使神的话得以成全
  alternative: 把神的话充分传开；使神的话完满实现
  rationale: 该短语可能强调充分宣讲、贯彻完成或使神的话达到完满。正文采用较宽泛的“得以成全”，不替读者消除原文的神学张力；脚注列出主要语义可能。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“管家职分”保留古代受托管理的比喻；句序尽量贴近希腊文的修饰关系，同时用“这教会”补明跨节关系。
