  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ δι’ αὐτοῦ ἀποκαταλλάξαι τὰ πάντα εἰς αὐτόν, εἰρηνοποιήσας διὰ τοῦ αἵματος τοῦ σταυροῦ αὐτοῦ, ⸂[δι’ αὐτοῦ]⸃ εἴτε τὰ ἐπὶ τῆς γῆς εἴτε τὰ ⸀ἐν τοῖς οὐρανοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/020.yaml
  text: and through him to reconcile all things to himself[d][c][b][a], having made peace through the blood of his cross—through him—whether the things on the earth or the things in the heavens.
translation:
  language: zh_hans
  text: 并且借着他[a]，使万有[b]与自己和好；借着他十字架上的血成就了和平——借着他[c]——无论是地上的，还是诸天之中的[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “借着他”也可译作“由他”；本节两处相同的希腊语都是如此。
    reason: lexical_alternative
  - marker: b
    text: 这里的“万有”依照希腊原文保留宽广含义，与后面的“地上的、诸天之中的”相呼应；本节本身没有说明这种和好与最终得救之间有怎样的关系。
    reason: alternative_reading
  - marker: c
    text: 有些抄本没有第二个“借着他”。
    reason: textual_variant
  - marker: d
    text: 希腊原文的“天”是复数，因此译作“诸天”。
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ αὐτοῦ
  choice: 借着他
  rationale: διά加属格表示媒介或施事。“借着他”自然地保留了圣子作为创造与和好之中介的含义，也不排除“由他”的施事色彩。
- source_word: ἀποκαταλλάξαι
  choice: 使……和好
  rationale: 该动词表示使关系恢复和好。译作“使……和好”符合现代汉语；不额外加入“完全”，以免把前缀可能具有的加强作用解释过度。
- source_word: τὰ πάντα
  choice: 万有
  rationale: 这是涵盖广泛的中性复数表达，与上下文有关创造的宇宙性范围及后文“地上的……诸天之中的”相呼应。“万有”庄重而通晓，并未把范围缩窄为人类。
- source_word: εἰς αὐτόν
  choice: 与自己
  rationale: 介词短语在“和好”的语境中自然译为“与自己”，保留关系指向；“自己”反映上下文中上帝使万有借着圣子与自己和好的理解。
- source_word: εἰρηνοποιήσας
  choice: 成就了和平
  rationale: 简练表达该不定过去时分词所指的促成和平之行动，并与“使……和好”保持逻辑联系。分号保留其伴随或方式上的关系，而不将二者割裂。
- source_word: διὰ τοῦ αἵματος τοῦ σταυροῦ αὐτοῦ
  choice: 借着他十字架上的血
  rationale: 保留“血”与“十字架”的具体措辞及工具含义，不将其释义化为笼统的“死亡”。“他十字架上的血”在现代汉语中比逐字的“他十字架的血”更自然。
- source_word: ⸂[δι’ αὐτοῦ]⸃
  choice: 借着他
  rationale: 正文保留这一有抄本差异的重复语，并用破折号体现其恢复前文、加重语气的修辞作用。
- source_word: εἴτε ... εἴτε
  choice: 无论是……还是……
  rationale: 这一关联结构在现代汉语中最自然地表达为“无论是……还是……”，并保留两项合起来的广泛范围。
- source_word: τὰ ἐπὶ τῆς γῆς
  choice: 地上的
  rationale: 用名词化的“地上的”对应希腊文中性复数，并与后项形成简洁对称的宇宙性对照。
- source_word: τὰ ἐν τοῖς οὐρανοῖς
  choice: 诸天之中的
  rationale: “诸天”保留 οὐρανοῖς 的复数形式；“之中的”与“地上的”相对，既清楚又庄重。
theological_decisions:
- issue: τὰ πάντα（万有）所指的和好范围
  choice: 保留为范围宽广的“万有”，不限定为所有人，也不说明这种和好必然等同于每一个受造者最终得救。
  alternative: 译成“所有人”，或直接解释为整个宇宙中的一切都在救恩意义上最终得救。
  rationale: 希腊文本及“地上的、诸天之中的”具有宇宙性广度，但本节本身没有界定这种和好与个人最终得救之间的关系。译文应保存这一神学张力。
- issue: εἰς αὐτόν 中“自己”的所指
  choice: 依承接第19节的句法，理解为上帝借着圣子使万有与上帝自己和好。
  alternative: 理解为基督使万有与基督自己和好。
  rationale: 本句延续第19节的旨意结构，最自然的隐含主语是上帝；但正文不额外补出“上帝”，避免消除原文由代词和上下文形成的含蓄性。
- issue: “十字架上的血”的意义
  choice: 保留具体的流血与十字架措辞。
  alternative: 释义为“他在十字架上的死”。
  rationale: 原文明确同时使用“血”和“十字架”，保留二者可传达献祭及历史性受难的分量，而不把经文限定在某一种特定的赎罪理论中。
- issue: 重复的 δι’ αὐτοῦ
  choice: 在正文保留第二个“借着他”，并标明抄本差异。
  alternative: 因部分抄本省略而不译，或将重复顺入句中以弱化其修辞效果。
  rationale: SBLGNT将该短语置于方括号内；保留它既尊重所给正文，也让读者看见其强调作用，同时由脚注交代文本证据。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“万有”“诸天”保留经文的宇宙性和复数形式；主要句式以“借着……使……和好”自然呈现希腊文的中介结构。破折号保留重复“借着他”的强调效果，脚注则交代词义选择、神学张力和抄本异文。
