  text: Νῦν χαίρω ἐν τοῖς παθήμασιν ὑπὲρ ὑμῶν, καὶ ἀνταναπληρῶ τὰ ὑστερήματα τῶν θλίψεων τοῦ Χριστοῦ ἐν τῇ σαρκί μου ὑπὲρ τοῦ σώματος αὐτοῦ, ὅ ἐστιν ἡ ἐκκλησία,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/024.yaml
  text: Now I rejoice in my sufferings for your sake[a], and in my flesh I am filling up what is lacking in the afflictions of the Messiah for the sake of his body, which is the church[b],
translation:
  language: zh_hans
  text: 现在，我为你们所受的苦而欢喜；并且我为了弥赛亚的身体——就是教会——在自己的肉身上补足弥赛亚患难所欠缺的[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“把弥赛亚患难余下的部分补满”。这并不是说弥赛亚的赎罪工作有所不足，而是说保罗正在参与同弥赛亚及其身体——教会——相关的患难。
    reason: 说明另一种译法，并保留原文张力而不把它误解为弥赛亚赎罪工作的缺陷。
lexical_decisions:
- source_word: Νῦν
  choice: 现在
  rationale: 作为时间性话语标记，引出保罗目前的处境和态度。
- source_word: χαίρω ἐν τοῖς παθήμασιν ὑπὲρ ὑμῶν
  choice: 我为你们受苦，反而欢喜
  rationale: 保留ὑπέρ的受益意义，并以自然汉语表达在受苦中仍然欢喜的反差；“受苦”按第一人称语境补足所属关系。
- source_word: ἀνταναπληρῶ τὰ ὑστερήματα
  choice: 补足……所欠缺的
  rationale: 保留原文“补足欠缺”的强烈表达和张力，不在正文中将其弱化为仅仅“经历”。
- source_word: τῶν θλίψεων τοῦ Χριστοῦ
  choice: 弥赛亚患难所欠缺的
  rationale: “患难”与前面的“受苦”有所区分；Χριστός在此具有称号意味，译为“弥赛亚”。
- source_word: ἐν τῇ σαρκί μου
  choice: 在自己的肉身上
  rationale: 指保罗具身、现实的受苦，并非“罪性”；“肉身”比单说“身体”更贴近σάρξ。
- source_word: ὑπὲρ τοῦ σώματος αὐτοῦ
  choice: 为了弥赛亚的身体
  rationale: 再次保留ὑπέρ的受益、目的意味；为避免汉语代词指代含混，将“他的”明示为“弥赛亚的”。
- source_word: ὅ ἐστιν ἡ ἐκκλησία
  choice: 就是教会
  rationale: 自然明确地说明“身体”所指的就是教会，同时保留保罗的身体隐喻。
theological_decisions:
- issue: “弥赛亚患难所欠缺的”是什么意思
  choice: 正文保留原文张力，表明保罗以自己的肉身参与同弥赛亚及其身体、教会相关的持续患难。
  alternative: 把它理解为弥赛亚赎罪之工本身有所不足，须由保罗的受苦来补全；或只理解为末世患难尚未达到的固定总额。
  rationale: 原文确实使用“补足”和“欠缺”，不宜在翻译中消解；但θλῖψις及“为了他的身体，就是教会”的语境指向使徒使命和教会所经历的患难，并未明说弥赛亚的赎罪工作有缺陷。
- issue: Χριστοῦ的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处称号意味清楚，译为“弥赛亚”能显出其受膏者称号及犹太弥赛亚背景。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“反而欢喜”使汉语自然地显出受苦与欢喜之间的反差；句序略作调整，将“为了弥赛亚的身体”前置，以免长定语难以理解。正文仅设一条脚注，且标记[a]已在正文出现。
