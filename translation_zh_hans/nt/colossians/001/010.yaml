id: COL.1.10
reference: Colossians 1:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ⸀περιπατῆσαι ἀξίως τοῦ κυρίου εἰς πᾶσαν ἀρεσκείαν ἐν παντὶ ἔργῳ ἀγαθῷ καρποφοροῦντες καὶ αὐξανόμενοι ⸂τῇ ἐπιγνώσει⸃ τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/010.yaml
  text: so as to walk worthily of the Lord[a], to all pleasing, bearing fruit in every good work and growing in the knowledge of God[b],
translation:
  language: zh_hans
  text: 好使你们行事为人与主相称，凡事讨他喜悦[a]，在各样善事上结出果子，并且在对上帝的认识上不断长进[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“为了各样的取悦”，没有明说所取悦的对象；按上下文，这里是指凡事讨主喜悦。
    reason: 说明ἀρεσκεία的“取悦”含义，以及原文未明说对象而语境指向主。
  - marker: b
    text: “认识”也可译作“充分的认识”或“更深入的认识”。这里的与格也有人理解为“借着认识上帝而不断长进”。
    reason: 保留ἐπίγνωσις的语义幅度，以及与格在范围义和工具义之间的可能理解。
lexical_decisions:
- source_word: περιπατῆσαι
  choice: 行事为人
  rationale: 保留保罗以“行走”比喻生活方式的含义，同时采用现代汉语中自然、庄重的对应表达；不直译为容易引起字面误解的“行走”。
- source_word: ἀξίως τοῦ κυρίου
  choice: 配得上主
  rationale: 表达行为应当与主相称、符合主身份与呼召的意思，同时避免把它解释为靠行为赚取资格。
- source_word: εἰς πᾶσαν ἀρεσκείαν
  choice: 凡事讨他喜悦
  rationale: 希腊文直陈“为着一切喜悦”，没有明说宾语；中文若完全照搬会生硬难懂，因此依上下文补出指向主的“他”，并以脚注保留原文的含蓄性。
- source_word: ἐν παντὶ ἔργῳ ἀγαθῷ
  choice: 在各样善事上
  rationale: “各样”自然表达 παντί 的广泛、分配意义，并使该短语清楚修饰“结出果子”。
- source_word: καρποφοροῦντες
  choice: 结出果子
  rationale: 保留原文的植物生长比喻，也呼应本章1:6的用语。
- source_word: αὐξανόμενοι
  choice: 不断长进
  rationale: 现在分词表示持续过程；“不断长进”既自然，又与“结果子”的生长意象相配。
- source_word: τῇ ἐπιγνώσει τοῦ θεοῦ
  choice: 在对上帝的认识上
  rationale: 把与格理解为成长的范围或方面，而非明确的工具；ἐπίγνωσις 在正文中译作“认识”，其可能具有的充分、深入含义留在脚注说明。
theological_decisions:
- issue: ἀρεσκείαν 所隐含的对象
  choice: 正文译作“凡事讨他喜悦”，以“他”承接前文的“主”
  alternative: 凡事都蒙喜悦；达到一切喜悦
  rationale: 原文没有明说喜悦的对象，但上下文清楚指向主。现代汉语需要补足指代才能自然通顺；脚注说明这一补充，避免掩盖原文语法上的含蓄。
- issue: ἐπίγνωσις 的语义强度
  choice: 正文译作“认识”
  alternative: 充分的认识；深入的认识；确切的认识
  rationale: 该词可带有更充分、更深入认识的意味，但在此不必把这一细微差别固定成专门的神学术语；正文保持宽度，脚注列出可能含义。
- issue: τῇ ἐπιγνώσει 的与格功能
  choice: 理解为范围或方面：“在对上帝的认识上”
  alternative: 借着对上帝的认识；因认识上帝而
  rationale: 与格可有范围或工具等理解。这里与“长进”搭配时，范围义较顺畅，也不排除认识上帝与生命成长之间的密切关系。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“行事为人”是中文圣经语体中已广为人知且仍自然的生活方式表达；“讨他喜悦”比生硬直译更符合汉语，同时以脚注交代补出的代词。句子保持与上一节祷告内容相连的目的结构。
