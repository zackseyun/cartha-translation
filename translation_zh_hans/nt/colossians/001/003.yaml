id: COL.1.3
reference: Colossians 1:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Εὐχαριστοῦμεν τῷ ⸀θεῷ πατρὶ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ πάντοτε ⸀περὶ ὑμῶν προσευχόμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/003.yaml
  text: We always give thanks to God[a], the Father of our Lord Jesus the Messiah, when we pray for you,
translation:
  language: zh_hans
  text: 我们为你们祷告时，总是感谢上帝，就是我们主耶稣基督[a]的父。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “基督”意为“受膏者”，也就是“弥赛亚”。
    reason: 说明Χριστός的称号含义及可译形式。
lexical_decisions:
- source_word: Εὐχαριστοῦμεν
  choice: 感谢
  rationale: 该动词表示向某位对象表达感恩；现代汉语用“感谢上帝”自然、准确，也符合书信感恩段落的语体。
- source_word: τῷ θεῷ πατρὶ
  choice: 上帝——……的父
  rationale: θεῷ与πατρὶ为同位关系。破折号使“父”明确说明“上帝”的身份，同时避免把两者误读为并列对象。
- source_word: τοῦ κυρίου ἡμῶν
  choice: 我们主……的
  rationale: 保留属格关系及κύριος的称号意义；“我们主”是简洁、庄重且通行的汉语表达。
- source_word: Ἰησοῦ Χριστοῦ
  choice: 耶稣基督
  rationale: Χριστός在此仍带有“受膏者、弥赛亚”的称号背景；“耶稣基督”是现代汉语最自然、最广为理解的表达，并以脚注说明称号含义。
- source_word: πάντοτε
  choice: 总是
  rationale: 直接表达“始终、每次如此”的持续性，并按最自然的句法将其连于主句“感谢”。
- source_word: περὶ ὑμῶν
  choice: 为你们
  rationale: 在祷告语境中，περί加属格表示代求所关涉的对象，汉语自然译作“为你们”。
- source_word: προσευχόμενοι
  choice: 为你们祷告时
  rationale: 现在分词表示与主句同时发生的情形；“……时”自然保留其伴随或时间性质，不把它改写成独立的主要陈述。
theological_decisions:
- issue: Χριστός在本节是称号还是近似专名
  choice: 正文译“基督”，脚注说明意为“弥赛亚”
  alternative: 正文译“弥赛亚”
  rationale: 希腊词本义是“受膏者”，在这里仍可理解为称号；但现代汉语“耶稣基督”比“耶稣弥赛亚”自然得多。脚注保留其称号内涵，避免把“基督”误当作姓氏。
- issue: πάντοτε的修饰范围
  choice: 理解为修饰主句“感谢”
  alternative: 理解为修饰“祷告”，即“总是为你们祷告”
  rationale: 词序和书信感恩句式支持“总是感谢”；不过希腊语在形式上容许把它与随后分词联系起来，因此不据此引申额外神学结论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“上帝”对应θεός；破折号清楚呈现同位说明。句子避免生硬照搬希腊语词序，同时保留主句、分词结构和亲属称谓关系。
