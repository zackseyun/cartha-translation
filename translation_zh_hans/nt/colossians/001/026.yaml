  text: τὸ μυστήριον τὸ ἀποκεκρυμμένον ἀπὸ τῶν αἰώνων καὶ ἀπὸ τῶν γενεῶν,— ⸀νῦν δὲ ἐφανερώθη τοῖς ἁγίοις αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/026.yaml
  text: the mystery hidden from the ages and from the generations—but now revealed to his saints[b][a],
translation:
  language: zh_hans
  text: 那从历世历代以来一直被隐藏着的奥秘[a]，如今却向他的圣徒[b]显明了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“秘密”。保罗所说的“奥秘”通常指上帝从前隐藏、如今已经揭示的旨意。
    reason: lexical_alternative
  - marker: b
    text: 或译“他的圣者”。这里指属于上帝、被分别为圣的人，并非少数特殊人物。
    reason: lexical_alternative
lexical_decisions:
- source_word: μυστήριον
  choice: 奥秘
  rationale: “奥秘”符合保罗书信中的常用含义，指上帝从前隐藏、如今揭示的旨意，并非人无法明白的玄秘之事。
- source_word: ἀποκεκρυμμένον
  choice: 一直隐藏着的
  rationale: 希腊语完成时被动分词表达先前被隐藏并持续处于隐藏状态；中文用“一直隐藏着的”自然地保留这一结果状态。
- source_word: ἀπὸ τῶν αἰώνων καὶ ἀπὸ τῶν γενεῶν
  choice: 历世历代
  rationale: “历世历代”以自然、庄重的现代汉语表达 αἰώνων 与 γενεῶν 的并列时间跨度；结合“一直”传达从以往各时代延续至今的隐藏状态，而不额外加入“所有”等原文没有的强调。
- source_word: νῦν δὲ
  choice: 如今却
  rationale: 准确表现从先前隐藏到现今显明的强烈转折。
- source_word: ἐφανερώθη
  choice: 显明了
  rationale: 保留不定过去时被动语态，指出奥秘如今已被显露，同时不明说施事者。
- source_word: τοῖς ἁγίοις αὐτοῦ
  choice: 向他的圣徒
  rationale: “圣徒”是保罗书信中对归属上帝、被分别为圣之信徒群体的惯用称呼，既保留神学分量，也不泛化为“子民”。
theological_decisions:
- issue: “他的圣徒”的所指范围
  choice: 译作“他的圣徒”，指属于上帝、被分别为圣的信徒群体
  alternative: 他的圣者；他的子民
  rationale: 保罗通常用 ἅγιοι 称全体信徒，并非特指少数受册封或属灵地位较高的人；保留“圣徒”可维持原文的教会群体含义。
- issue: “奥秘”的性质
  choice: 译作“奥秘”，由上下文说明它是从前隐藏、如今显明的上帝旨意
  alternative: 秘密
  rationale: 原文的 μυστήριον 不是不可知的玄理，而是上帝曾隐藏、现已启示的计划；“奥秘”保留保罗术语及其张力，不把它弱化为一般秘密。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“历世历代”保持原文两组时间名词的广阔跨度；“如今却”突出隐藏与显明之间的转折。脚注标记均紧随相应词语。
