id: COL.1.23
reference: Colossians 1:23
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἴ γε ἐπιμένετε τῇ πίστει τεθεμελιωμένοι καὶ ἑδραῖοι καὶ μὴ μετακινούμενοι ἀπὸ τῆς ἐλπίδος τοῦ εὐαγγελίου οὗ ἠκούσατε, τοῦ κηρυχθέντος ἐν ⸀πάσῃ κτίσει τῇ ὑπὸ τὸν οὐρανόν, οὗ ἐγενόμην ἐγὼ Παῦλος διάκονος.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/023.yaml
  text: if indeed you continue in the faith[a], grounded and steadfast, and not moved away from the hope of the gospel that you heard, which has been proclaimed in all creation under heaven, of which I, Paul[b], became a servant.
translation:
  language: zh_hans
  text: 如果你们确实持续持守信仰，根基稳固，坚定不移，不从你们所听见的福音所带来的盼望上挪开；这福音已经在天下一切受造界中被传扬[a]。我保罗成了这福音的仆人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“已经向天下一切受造之物传扬。”希腊语“κτίσις”可指“受造界”，也可在某些语境中指“受造之物”。
    reason: lexical_alternative
  - marker: b
    text: “仆人”也可译作“服事者”。希腊语“διάκονος”可指仆人或承担服事的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ γε
  choice: 只要……确实
  rationale: 保留εἰ的条件意味和γε的强调语气，既不弱化为单纯的“既然”，也不把条件解释为特定的救恩论结论。
- source_word: ἐπιμένετε τῇ πίστει
  choice: 持续在信仰中
  rationale: ἐπιμένετε表达持续、恒久处于某种状态；带冠词的πίστις在此可指信徒所持守的信仰或信心。“信仰”自然保留这种范围。
- source_word: τεθεμελιωμένοι καὶ ἑδραῖοι
  choice: 根基稳固，坚定不移
  rationale: 以“根基稳固”保留τεθεμελιωμένοι的建筑根基意象及既成状态；“坚定不移”表达ἑδραῖοι的稳固。
- source_word: μὴ μετακινούμενοι
  choice: 不偏离
  rationale: 表达不被移离原有位置的意思，并与后面的ἀπό自然衔接。
- source_word: ἀπὸ τῆς ἐλπίδος τοῦ εὐαγγελίου
  choice: 不偏离你们从所听见的福音而有的盼望
  rationale: 将属格关系理解为福音所带来或呈明的盼望，同时避免生硬的“福音的盼望”；补出“你们”仅为汉语衔接。
- source_word: τοῦ κηρυχθέντος ἐν πάσῃ κτίσει τῇ ὑπὸ τὸν οὐρανόν
  choice: 这福音已经传遍天下一切受造之物
  rationale: “天下”自然对应“天之下”；κτίσις可指受造界或受造之物，此处正文采用“受造之物”，并以脚注保留集合意义的可能。
- source_word: οὗ ἐγενόμην ἐγὼ Παῦλος διάκονος
  choice: 我保罗成了这福音的仆人
  rationale: 明确关系代词所指的“福音”；διάκονος译为“仆人”，避免加入原文未明确表达的制度性教职含义。
theological_decisions:
- issue: εἴ γε所表达的持守条件
  choice: 译作“只要你们确实持续”，保留真实条件及强调意味
  alternative: 译作“既然你们持续”，或把它译成明确断言信徒可能失去救恩的措辞
  rationale: 本节把持续在信仰中作为条件，却没有在此解决坚忍、背道和救恩确据等更广泛的神学争论。
- issue: τῇ πίστει中πίστις的含义
  choice: 信仰
  alternative: 信心；忠信
  rationale: 上下文重点是信徒持续立足的信仰领域；“信仰”既可指所信的内容，也不排除个人信靠。“忠信”在此较不可能。
- issue: 福音传遍一切受造之物的普世性表述
  choice: 按原文保留广阔、普世性的宣告
  alternative: 将其收窄为当时已知地区，或解释为每一个个体都已实际听见
  rationale: 原文使用宏阔表述；翻译不应擅自将其地理化或绝对个体化。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“根基稳固，坚定不移”保留建筑与稳定意象；以分号分开持守的条件和福音普传、保罗受托服事的陈述。所有脚注标记均置于正文对应位置。
