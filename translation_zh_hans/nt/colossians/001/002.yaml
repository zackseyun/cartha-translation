  text: τοῖς ἐν ⸀Κολοσσαῖς ἁγίοις καὶ πιστοῖς ἀδελφοῖς ἐν Χριστῷ· χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ⸀ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/002.yaml
  text: 'To the holy and faithful brothers in Messiah at Colossae: grace to you and peace from God our Father[a][b][c].'
translation:
  language: zh_hans
  text: '写给在歌罗西、在弥赛亚[c]里圣洁而忠信[a]的弟兄们[b]：


    愿恩典与平安从我们的父上帝临到你们。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或可指“相信的人”；希腊词πιστοῖς既可指相信，也可指忠信。
    reason: lexical_alternative
  - marker: b
    text: 原文用词为“弟兄们”；在这里，保罗很可能是在称呼包括女性在内的整个群体。
    reason: lexical_alternative
  - marker: c
    text: “弥赛亚”的传统译法是“基督”；希腊称号Χριστός意为“弥赛亚”。
    reason: alternative_reading
lexical_decisions:
- source_word: τοῖς ἐν Κολοσσαῖς
  choice: 写给在歌罗西……的
  rationale: 以自然的中文书信格式标明收信人的所在地，同时保留ἐν的处所含义。
- source_word: ἁγίοις
  choice: 圣洁
  rationale: 按形容词用法译出分别归于上帝的基本含义，避免“圣徒”在现代语境中可能带来的后期制度性联想。
- source_word: πιστοῖς
  choice: 忠信
  rationale: πιστός既可指忠诚可靠，也可指相信；正文采用能描述信徒忠诚品格的“忠信”，并以脚注保留“信”的可能含义。
- source_word: ἀδελφοῖς
  choice: 弟兄们
  rationale: 保留希腊文阳性复数的表达；其语境所指很可能包括群体中的女性，另以脚注说明。
- source_word: ἐν Χριστῷ
  choice: 在弥赛亚里
  rationale: Χριστός在这里仍是称号，译为“弥赛亚”；“在……里”保留保罗关于归属和联合的空间性表达。
- source_word: χάρις ὑμῖν καὶ εἰρήνη
  choice: 愿恩典与平安……临到你们
  rationale: 原文为省略动词的问安语；中文补出“愿……临到”，自然表达祝愿而不改变其内容。
- source_word: ἀπὸ θεοῦ πατρὸς ἡμῶν
  choice: 从我们的父上帝
  rationale: 将πατρὸς ἡμῶν理解为对θεοῦ的同位说明，表达同一位既是上帝、也是我们的父，不增添原文没有的连词。
theological_decisions:
- issue: ἐν Χριστῷ中Χριστός的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 该词本为受膏者的称号；译出“弥赛亚”保留称号的语义，传统译法“基督”列入脚注。
- issue: ἀδελφοῖς的性别与群体指向
  choice: 弟兄们
  alternative: 弟兄姊妹；众信徒
  rationale: 正文反映原文的阳性复数形式，同时由脚注说明保罗很可能在称呼包括女性在内的整个群体。
- issue: πιστοῖς的语义张力
  choice: 忠信
  alternative: 信；有信心
  rationale: 原文可能强调忠诚，也可能强调相信，不能由本节完全判定；正文选择“忠信”，脚注保留另一可能。
translation_notes:
  register: 采用现代、庄重而易懂的中文书信语体。“在歌罗西、在弥赛亚里”并列保留两个ἐν短语，一指所在地，一指群体在弥赛亚里的身份。问安公式以“愿……临到你们”补足中文所需谓语。
