id: COL.1.6
reference: Colossians 1:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: τοῦ παρόντος εἰς ὑμᾶς, καθὼς καὶ ἐν παντὶ τῷ ⸀κόσμῳ ἐστὶν καρποφορούμενον καὶ αὐξανόμενον καθὼς καὶ ἐν ὑμῖν, ἀφ’ ἧς ἡμέρας ἠκούσατε καὶ ἐπέγνωτε τὴν χάριν τοῦ θεοῦ ἐν ἀληθείᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/006.yaml
  text: which has come to you[a], just as also in all the world it is bearing fruit and growing, just as also among you[d][c][b], from the day you heard and came to know the grace of God in truth.
translation:
  language: zh_hans
  text: 这福音已经临到你们[a]；正如它在全世界[b]不断结果、不断增长一样，自从你们听见并在真理中[d]认识神的恩典的那一天起，它在你们中间[c]也是这样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“如今与你们同在”，或“已经来到你们中间”。
    reason: lexical_alternative
  - marker: b
    text: 或译“遍及全世界”。
    reason: lexical_alternative
  - marker: c
    text: 或译“在你们里面”；希腊语既可指福音在整个群体中工作，也可指它在信徒里面工作。
    reason: lexical_alternative
  - marker: d
    text: 或译“真正认识了神的恩典”，或“按真理认识了神的恩典”。
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦ παρόντος εἰς ὑμᾶς
  choice: 这福音已经临到你们
  rationale: 定冠词分词承接第5节的“福音”；“临到”兼顾其来到并现今与他们同在的含义，也符合现代汉语表达。
- source_word: καθὼς καὶ
  choice: 正如……一样；也同样如此
  rationale: 以自然汉语保留两次比较结构和καί所表达的关联，将歌罗西群体中的果效与福音在世界上的扩展相连。
- source_word: ἐν παντὶ τῷ κόσμῳ
  choice: 在全世界
  rationale: 保留原文广阔的普世性措辞；这里是强调福音广泛传播的修辞表达，不在译文中擅自限定其地理范围。
- source_word: ἐστὶν καρποφορούμενον καὶ αὐξανόμενον
  choice: 正在……结果、增长
  rationale: “正在”体现持续进行的动作；“结果、增长”保留农业意象以及两个并列分词。
- source_word: καθὼς καὶ ἐν ὑμῖν
  choice: 它在你们中间也同样如此
  rationale: “在你们中间”自然指福音在整个群体中的工作；“同样如此”承接前面的“结果、增长”，避免不必要的重复。
- source_word: ἀφ’ ἧς ἡμέρας
  choice: 从……的那天起
  rationale: 准确标明福音在他们中间持续发挥功效的起点。
- source_word: ἠκούσατε
  choice: 你们听见
  rationale: 按简单过去事件翻译，不添加原文没有明说的“初次”。
- source_word: ἐπέγνωτε
  choice: 认识
  rationale: 表达他们对神恩典的真实认知，同时避免把ἐπιγινώσκω过度解释为技术性的“完全认识”。
- source_word: τὴν χάριν τοῦ θεοῦ
  choice: 神的恩典
  rationale: 采用现代中文自然且庄重的所有格结构，保留保罗神学用语。
- source_word: ἐν ἀληθείᾳ
  choice: 在真理中
  rationale: 保留介词短语的形式及其可能表示方式、真实性或范围的开放性，不在正文中单独锁定为“真正地”。
theological_decisions:
- issue: “全世界”的范围
  choice: 保留“全世界”这一广泛而带修辞色彩的表述
  alternative: 解释为当时地球上的每一个地区或每一个人都已听见福音
  rationale: 原文使用普世性语言突出福音扩展的广度；译文保留其力度，却不添加严格地理穷尽性的解释。
- issue: ἐν ἀληθείᾳ的含义
  choice: 译作“在真理中”，保留方式、真实性及范围之间的语义张力
  alternative: 译作“真正地”或“按真理”
  rationale: 希腊语容许几个彼此相关的理解；正文不宜静默地排除其他可能。
- issue: ἐν ὑμῖν所指
  choice: 译作“在你们中间”，主要呈现福音在群体中的工作
  alternative: 译作“在你们里面”，强调福音在信徒内里的工作
  rationale: 复数代词既可具有群体性，也可能含内在性的意味；正文采用现代中文较自然的群体表达，并以脚注保留另一可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“这福音”明确承接上一节，以“同样如此”自然补足希腊语省略的谓语；保留“结果、增长”的生动意象，并将各脚注标记放在对应词语之后。
