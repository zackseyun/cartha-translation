  text: ὅς ἐστιν εἰκὼν τοῦ θεοῦ τοῦ ἀοράτου, πρωτότοκος πάσης κτίσεως,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/015.yaml
  text: He is the image of the invisible God[a], the firstborn of all creation.
translation:
  language: zh_hans
  text: 他是那位看不见的神的形象，是一切受造之物的长子[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一切受造之物的长子”也可译为“在一切受造之物之上的长子”。这里的“长子”在圣经语境中可表示尊位和承受产业的权利，并不只表示出生的先后；参下文16—17节。
    reason: 说明πάσης κτίσεως这一属格关系可作不同理解，并说明πρωτότοκος的语义范围；不在正文中预先消除其解释张力。
lexical_decisions:
- source_word: ὅς ἐστιν
  choice: 他是
  rationale: 关系代词ὅς承接上文的“爱子”；汉语另起一句时用“他是”自然清楚，同时保留现在时判断句。
- source_word: εἰκὼν
  choice: 形像
  rationale: 保留“像”的代表性和彰显性，不扩译为“显现”或“完全体现”，以免加入原文未明说的解释。
- source_word: τοῦ θεοῦ τοῦ ἀοράτου
  choice: 那看不见的神的
  rationale: 按希腊语属格结构译出，并以“看不见的”自然表达ἀοράτου；“那”使整个名词短语在现代汉语中更顺畅。
- source_word: πρωτότοκος
  choice: 首生者
  rationale: 保留该词与出生次序、尊位和承受产业相关的隐喻范围；不直接意译为“至高者”或“居首位者”，以免消除原文张力。
- source_word: πάσης κτίσεως
  choice: 一切受造物的
  rationale: 用属有结构直接反映希腊语属格，不在正文中预先判定它表示所属、比较还是统辖关系；相关语义在脚注中说明。
theological_decisions:
- issue: πρωτότοκος πάσης κτίσεως所表达的基督与受造界之关系
  choice: 一切受造物的首生者
  alternative: 在一切受造物之上的首生者
  rationale: 正文贴近希腊语的属格形式，保留其真实的语义张力，不把“之上”的统辖含义直接写入正文；同时脚注指出“首生者”可涉及尊位和产业承受权，并引导读者结合紧接着的16—17节理解，而不暗示子必然属于受造物。
translation_notes:
  register: 采用现代、庄重而易懂的书面语。“形像”和“首生者”略带圣经语体，但含义可辨，并能较准确地保留原文的核心隐喻。脚注标记紧跟其所解释的短语。
