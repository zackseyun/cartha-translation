  text: in whom we have redemption[a], the forgiveness of sins.
translation:
  language: zh_hans
  text: 我们在他里面得蒙救赎[a]——罪得赦免。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “救赎”和“赦免”也都可译作“释放”；保罗在这里很可能用“罪得赦免”具体说明这里所说的救赎是什么。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: 在他里面
  rationale: 关系代词为阳性单数，承接上一节的爱子。“在他里面”既保留其人称所指，也保留与基督联合、处于他里面的关系性含义；不译作偏工具性的“借着他”。
- source_word: ἔχομεν
  choice: 得蒙
  rationale: 希腊文直译为“我们有”。现代汉语中“有救赎”较生硬，因此用“得蒙救赎”自然表达信徒现今享有这一恩惠，同时不增添得救过程的细节。
- source_word: ἀπολύτρωσιν
  choice: 救赎
  rationale: “救赎”保留该词藉代价获得释放的保罗书信语感，也比单译“释放”更能承载其上下文中的神学分量。
- source_word: ἄφεσιν
  choice: 赦免
  rationale: 该词在此指罪被免除，并与“救赎”构成同位说明。“赦免”是现代汉语中清楚、庄重且符合伦理语境的表达。
- source_word: τῶν ἁμαρτιῶν
  choice: 罪得赦免
  rationale: 属格复数表示赦免的对象。汉语以主谓式“罪得赦免”自然表达“罪的赦免”，不必机械保留属格结构。
theological_decisions:
- issue: “救赎”与“罪得赦免”的关系
  choice: 用破折号构成同位说明：“救赎——罪得赦免”
  alternative: 译为“救赎，也就是罪得赦免”或并列为“救赎，罪得赦免”
  rationale: 希腊文第二个名词短语与“救赎”同位。破折号能在不加入“也就是”等解释性词语的情况下显示说明关系，并避免把两者误读为互不相关的两项恩惠。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“得蒙”略带经文语体，但仍为当代读者熟悉，并可避免“有救赎”的生硬表达。破折号清楚呈现原文的同位结构。
