source:
  edition: SBLGNT
  text: Ἐχάρην λίαν ὅτι εὕρηκα ἐκ τῶν τέκνων σου περιπατοῦντας ἐν ἀληθείᾳ, καθὼς ἐντολὴν ἐλάβομεν παρὰ τοῦ πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/004.yaml
  text: I rejoiced greatly that I have found some of your children walking in the truth[b][a], just as we received a commandment from the Father.
translation:
  language: zh_hans
  text: 我十分欢喜，因为我发现你的儿女中有些人[a]按真理而行[b]，正如我们从父所领受的命令所要求的那样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从你的儿女中。”原文的表达指儿女中的一部分，并不一定包括所有人。
    reason: lexical_alternative
  - marker: b
    text: 或译：“在真理中行事。”这里不只指为人诚实，也可指生活符合所启示的真理。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐχάρην λίαν
  choice: 我非常喜乐
  rationale: 将喜乐的动词与加强语气的副词一并译出；“非常喜乐”自然、庄重，也保留了原文强烈的喜悦。
- source_word: εὕρηκα
  choice: 我发现
  rationale: 希腊文完成时强调发现及其当前意义；现代汉语通常无需另加时态词，“发现”在本句语境中即可自然表达。
- source_word: ἐκ τῶν τέκνων σου
  choice: 你的儿女中有人
  rationale: ἐκ加属格具有部分性，表明所说的是儿女中的一部分，并未断言所有人都是如此；“儿女”也不把τέκνα限于男性。
- source_word: περιπατοῦντας
  choice: 行事
  rationale: 原词字面为“行走”，在此是生活行为的伦理隐喻。“行事”在现代汉语中自然，并保留行为方式的含义。
- source_word: ἐν ἀληθείᾳ
  choice: 在真理中
  rationale: 保留原文所表达的范围或准则，不把它缩减为仅仅“诚实”；同时脚注提供较自然的另一种表达。
- source_word: καθὼς
  choice: 正如……一样
  rationale: 清楚表达这些人的行为与从父领受的命令相一致。
- source_word: ἐντολὴν ἐλάβομεν
  choice: 我们所领受的命令
  rationale: 保留复数主语“我们”和领受命令的动作；“命令”是现代汉语中自然而有分量的表达。
- source_word: παρὰ τοῦ πατρός
  choice: 从父
  rationale: 严格保留原文“父”的称谓，不解释性增添“神”。
theological_decisions:
- issue: “父”的所指
  choice: 保留“父”，不扩译
  alternative: 从父神
  rationale: 约翰文献的语境使其所指清楚，但原文本身只写“父”；译文不额外加入神学性说明。
- issue: “你的儿女”的范围
  choice: 译作“你的儿女中有人”
  alternative: 你的儿女
  rationale: 部分结构ἐκ τῶν τέκνων σου只明确指出其中一部分，不能据此断言全部儿女都在真理中行事。
- issue: “在真理中”的含义
  choice: 保留范围性表达“在真理中”
  alternative: 诚实地；按真理生活
  rationale: 原语可能带有以真理为生活领域或准则的含义，不宜缩减为个人真诚；脚注说明可能的自然译法，同时不消除原有张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“儿女中有人”自然表达部分关系；“在真理中行事”兼顾约翰文献的伦理意象和现代汉语可读性。所有脚注标记均置于对应短语之后。
