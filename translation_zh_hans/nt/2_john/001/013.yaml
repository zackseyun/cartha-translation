base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/013.yaml
  text: The children of your chosen sister greet you.
translation:
  language: zh_hans
  text: 你那蒙拣选的姊妹的儿女都问候你。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀσπάζεταί
  choice: 问候
  rationale: 准确表达书信结尾的致意用语；希腊语动词为单数，与中性复数主语搭配属于正常语法现象，汉语自然译为“都问候”。
- source_word: τὰ τέκνα
  choice: 儿女
  rationale: τέκνα可指子女，也可能在书信语境中具有群体性或比喻性；“儿女”保留原文的亲属称谓及其潜在含义。
- source_word: τῆς ἀδελφῆς σου
  choice: 你……的姊妹
  rationale: 按原文直译亲属关系，不擅自判定“姊妹”究竟是个人还是教会的隐喻。
- source_word: τῆς ἐκλεκτῆς
  choice: 蒙拣选的
  rationale: ἐκλεκτός在此是带被动意味的称谓，表示被拣选；“蒙拣选的”既自然，也保留其神学色彩。
theological_decisions:
- issue: “蒙拣选的姊妹”所指对象
  choice: 保留“姊妹”的原文表述，不明说是某位女性或某个教会
  alternative: 译作“蒙拣选的姐妹教会”或明确理解为某位女性
  rationale: 原文容许个人与教会隐喻两种理解；正文不应消除这一真实歧义。
- issue: ἐκλεκτή的译法
  choice: 蒙拣选的
  alternative: 被选中的／特选的
  rationale: “蒙拣选”在现代中文基督教语境中清楚庄重，并保留其可能涉及神拣选的含义，而不把它弱化为一般性的挑选。
translation_notes:
  register: 采用现代、庄重而自然的书信结语。“姊妹”沿用较具经文文体且清楚可懂的写法；不加脚注，因为本节的歧义可由正文直接保留。
