source:
  edition: SBLGNT
  text: Ὁ πρεσβύτερος ἐκλεκτῇ κυρίᾳ καὶ τοῖς τέκνοις αὐτῆς, οὓς ἐγὼ ἀγαπῶ ἐν ἀληθείᾳ, καὶ οὐκ ἐγὼ μόνος ἀλλὰ καὶ πάντες οἱ ἐγνωκότες τὴν ἀλήθειαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/001.yaml
  text: The elder[a], to the chosen lady and her children, whom I love in truth—and not I alone[b], but also all who have come to know the truth—
translation:
  language: zh_hans
  text: 长老，致蒙拣选的夫人[a]和她的儿女：我在真理中爱她的儿女；不只是我，所有已经认识真理的人也都爱他们——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “夫人”也可译作“女士”；有人认为这里的“夫人”是对地方教会的比喻，也有人把“基里娅”理解为人名。
    reason: alternative_reading
lexical_decisions:
- source_word: Ὁ πρεσβύτερος
  choice: 长老
  rationale: 此处是书信开头的自称，最自然地表示一种受认可的身份或职分；“长老”也保留了年龄、地位和群体带领者之间的语义空间，避免采用带有特定宗派色彩的技术称谓。
- source_word: ἐκλεκτῇ
  choice: 蒙拣选的
  rationale: “蒙拣选的”自然表达其被拣选的含义，既可修饰一位具体女子，也可用于人格化的教会，不预先判定所指。
- source_word: κυρίᾳ
  choice: 夫人
  rationale: κυρία通常指受尊敬的女子或女主人；“夫人”适合书信称呼，也容许将其理解为人格化的地方教会。作为人名“基里娅”的可能性收入脚注。
- source_word: τοῖς τέκνοις αὐτῆς
  choice: 她的儿女
  rationale: τέκνα泛指儿女，并非仅指儿子。“她的儿女”贴合表层语法；若“夫人”象征教会，也可自然指其成员。
- source_word: οὓς
  choice: 就是……所爱的人
  rationale: 希腊文阳性复数关系代词指向前述作为人的收信群体。中文以“人”承接，既不局限于儿女，也不消除“夫人”与“儿女”共同作为对象的可能。
- source_word: ἀγαπῶ
  choice: 爱
  rationale: 采用该词通常而直接的对应语，不添加原文没有的程度修饰。
- source_word: ἐν ἀληθείᾳ
  choice: 在真理中
  rationale: 这一译法保留了“真诚地”和“处于真理之中”两层可能含义，也保留约翰著作中“真理”的神学回响。
- source_word: οὐκ ἐγὼ μόνος ἀλλὰ καὶ πάντες
  choice: 不只是我，所有……的人也都
  rationale: 自然呈现原文“不是只有我，而是也包括所有人”的对比和强调。
- source_word: οἱ ἐγνωκότες
  choice: 已经认识
  rationale: 以“已经”体现完成时分词所表达的结果状态：他们曾认识真理，如今仍处于认识真理的状态。
- source_word: τὴν ἀλήθειαν
  choice: 真理
  rationale: 保留约翰文献中兼具一般意义与神学内涵的“真理”用语，并与前面的ἀληθείᾳ形成词语呼应。
theological_decisions:
- issue: ἐκλεκτῇ κυρίᾳ所指的身份
  choice: 正文译作“蒙拣选的夫人”，表面上保留对一位女子的称呼，同时不排除其人格化地指地方教会。
  alternative: 可理解为一位具体的基督徒女子及其儿女、一个会众及其成员，或把“基里娅”视为人名。
  rationale: 希腊文不能确定所指究竟是个人还是人格化的教会。正文采用普通名词意义，脚注列出主要可能，以免替原文解决其保留的歧义。
- issue: ἐν ἀληθείᾳ的含义
  choice: 译作“在真理中”。
  alternative: 也可理解为“真诚地”或“确实地”。
  rationale: 约翰的“真理”常具有层叠含义。“在真理中”既保留真诚之爱的意味，也保留以真理为范围或根基的神学意味。
translation_notes:
  register: 采用现代、庄重而易懂的书信语体。“长老写信给”补出中文书信称呼中自然需要的关系；末尾保留破折号，表明句意延续至下一节。脚注标记放在其实际解释的词组之后。
