base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/011.yaml
  text: For the one who says to him[a], “Greetings,” shares in his evil works.
translation:
  language: zh_hans
  text: 因为向他问安的人，就在他的恶行上有分。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ λέγων
  choice: 对……说……的
  rationale: 冠词加现在分词在此作名词性用法，泛指任何这样说的人；汉语以“对……说……的”自然表达这一结构。
- source_word: γάρ
  choice: 因为
  rationale: γάρ承接上一节，说明禁止接待并问候那人的理由；“因为”清楚保留解释关系。
- source_word: αὐτῷ
  choice: 对他
  rationale: 代词回指上一节所说的人；不在正文中扩展其所指，以保留原文的简洁。
- source_word: χαίρειν
  choice: “愿你喜乐”
  rationale: χαίρειν在λέγων之后用作惯常问候语，同时字面含有“喜乐”之意；此译保留原词表达与上下文中欢迎、认同意味之间的张力。
- source_word: κοινωνεῖ
  choice: 在……上有分
  rationale: κοινωνέω接与格，表示参与、分担；“有分”准确表达道德上的参与或连带关系，又不把含义限定为教会语境中的“团契”。
- source_word: τοῖς ἔργοις αὐτοῦ τοῖς πονηροῖς
  choice: 他的恶行
  rationale: 该与格短语说明所参与的是那人被定性为邪恶的行为；“恶行”在现代汉语中自然、凝练。
theological_decisions:
- issue: 这种问候是一般礼貌，还是表示欢迎、支持而导致同流合污
  choice: 正文保留问候语本身，并按κοινωνεῖ译出问候者在那人的恶行上有分；脚注指出上下文所涉及的欢迎或认同意味。
  alternative: 把本节理解为在任何情境下都禁止对这样的人说任何礼貌问候。
  rationale: χαίρειν本身是惯常问候语，但第10节谈到接待此人，且κοινωνεῖ明确指出参与其恶行。因此，经文所警告的是带有接待、支持或认同作用的问候；正文不把这一语境性解释直接写入，以免消除原文的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“愿你喜乐”略带书面色彩，但能保留希腊问候公式的字面意象；脚注补明其惯常问候功能及语境含义。
