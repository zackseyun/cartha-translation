  text: καὶ αὕτη ἐστὶν ἡ ἀγάπη, ἵνα περιπατῶμεν κατὰ τὰς ἐντολὰς αὐτοῦ· αὕτη ⸂ἡ ἐντολή ἐστιν⸃, καθὼς ἠκούσατε ἀπ’ ἀρχῆς, ἵνα ἐν αὐτῇ περιπατῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/006.yaml
  text: 'And this is love: that we walk according to his commandments. This is the commandment[a], just as you heard from the beginning, that you should walk in it.'
translation:
  language: zh_hans
  text: 爱就是这样：我们遵照他的诫命而行。这就是那诫命，正如你们从起初所听见的：你们要行在其中[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们要行在爱中。”末句“其中”所对应的希腊语代词也可能指“爱”，而不是“诫命”。
    reason: 保留αὐτῇ可能回指ἀγάπη或ἐντολή的真实歧义。
lexical_decisions:
- source_word: ἀγάπη
  choice: 爱
  rationale: 采用现代汉语中自然、庄重的常用对应词，并保留约翰著作上下文中的词汇联系。
- source_word: ἵνα περιπατῶμεν
  choice: 我们要……而行
  rationale: 此处ἵνα说明爱在实践中的具体内容；译文既表达应然意味，也保留“行”的伦理隐喻。
- source_word: περιπατέω
  choice: 行
  rationale: 不将隐喻完全释为“生活”，以保留本节前后两次出现的行走意象及其呼应。
- source_word: κατὰ τὰς ἐντολὰς αὐτοῦ
  choice: 遵照他的诫命
  rationale: κατά加宾格表达依照、符合；“遵照”在现代汉语中自然清楚，同时保留复数“诫命”。
- source_word: ἐντολάς / ἐντολή
  choice: 诫命 / 诫命
  rationale: 前后采用同一词根的译法，保留原文由复数转为单数的修辞关系。
- source_word: αὕτη ἡ ἐντολή ἐστιν
  choice: 这就是……诫命
  rationale: 原文此处没有明确的物主成分，因此不增译为“他的诫命”；后接定语内容，使汉语表达自然。
- source_word: καθὼς ἠκούσατε ἀπ’ ἀρχῆς
  choice: 你们从起初所听见的
  rationale: 保留约翰著作惯用的“从起初”，并按现代汉语语序将其处理为修饰“诫命”的定语。
- source_word: ἵνα ἐν αὐτῇ περιπατῆτε
  choice: 你们要行在其中
  rationale: 保留περιπατέω的“行”及ἐν αὐτῇ的空间隐喻，不在正文中释义性扩展。
theological_decisions:
- issue: 末句αὐτῇ所指为何
  choice: 正文按最近的阴性单数先行词ἐντολή理解为“诫命”
  alternative: 也可能回指前句阴性单数ἀγάπη，即“爱”
  rationale: “诫命”是最近的语法先行词，但“爱”在语法和上下文观念上同样可能；因此正文采用较近指代，脚注保留另一种理解，不武断消除歧义。
translation_notes:
  register: 采用现代标准普通话，语气庄重而易懂。“爱就是这样”自然引出爱的实践定义；两次以“行”保留原文重复的伦理隐喻。脚注标记[a]已置于正文相关位置。
