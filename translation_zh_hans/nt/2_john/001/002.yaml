  text: διὰ τὴν ἀλήθειαν τὴν μένουσαν ἐν ἡμῖν, καὶ μεθ’ ἡμῶν ἔσται εἰς τὸν αἰῶνα·
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/002.yaml
  text: because of the truth that remains in us and will be with us forever[a].
translation:
  language: zh_hans
  text: 因为那常在我们里面[a]、也必永远与我们同在的真理。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “常在”也可译作“住在”。
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ
  choice: 因为
  rationale: διά加宾格在此表示原因，承接上一节，说明相爱的缘由；“因为”自然清楚。
- source_word: ἀλήθειαν
  choice: 真理
  rationale: 保留ἀλήθεια的基本含义及约翰文献中丰富但未被明确限定的神学内涵，不扩译为“福音真理”或“真道”。
- source_word: τὴν μένουσαν
  choice: 那常在……的
  rationale: 现在时分词表达持续存在；“常在”既保留持续性，也符合庄重而自然的现代中文表达。“住在”是可行的词汇替代。
- source_word: ἐν ἡμῖν
  choice: 在我们里面
  rationale: 直译ἐν加与格，保留真理内在于信徒及群体之中的表达；不改成解释性较强的“在我们中间”。
- source_word: καὶ μεθ’ ἡμῶν ἔσται
  choice: 也必与我们同在
  rationale: 忠实表达μετά加属格的“与……同在”和ἔσται的将来意义；“必”在中文中自然体现此陈述的确定性，并未另加“继续”等原文没有的动词。
- source_word: εἰς τὸν αἰῶνα
  choice: 永远
  rationale: 这是表示永久持续的固定表达，“永远”是现代中文最清楚自然的对等译法。
theological_decisions:
- issue: “真理”在约翰文献中的神学所指
  choice: 仅译作“真理”，不进一步限定
  alternative: “福音真理”或“真实的教导”
  rationale: 上下文容许“真理”指向福音信息、神的启示或更丰富的约翰式神学现实，但希腊文本没有明确缩窄其所指，因此译文保留原有的广度和张力。
- issue: 真理“在我们里面”的含义
  choice: 保留空间性隐喻“在我们里面”
  alternative: “在我们中间”
  rationale: 原文既可能涉及信徒内在的持守，也带有群体维度；直译可避免只解释为群体中的存在。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。句子保留原文作为上一节原因说明的从属性质；用“常在”呈现μένω的持续意味，并以脚注保留“住在”这一较具空间感的译法。
