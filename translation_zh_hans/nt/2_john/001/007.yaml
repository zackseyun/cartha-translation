source:
  edition: SBLGNT
  text: ὅτι πολλοὶ πλάνοι ⸀ἐξῆλθον εἰς τὸν κόσμον, οἱ μὴ ὁμολογοῦντες Ἰησοῦν Χριστὸν ἐρχόμενον ἐν σαρκί· οὗτός ἐστιν ὁ πλάνος καὶ ὁ ἀντίχριστος.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/007.yaml
  text: For many deceivers have gone out into the world[a], those who do not confess Jesus the Messiah coming in the flesh[b]. This is the deceiver and the antichrist.
translation:
  language: zh_hans
  text: 因为有许多迷惑人的人已经出到世上去了；他们不承认耶稣基督是以肉身而来的[a]。这样的人就是那迷惑人的，也是敌基督者。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以肉身而来的”也可译作“已经以肉身来了”。希腊文直译为“在肉身中而来的”，强调耶稣基督真实具有人性和肉身。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 承接上文，说明前面劝勉的理由；现代汉语中“因为”自然保留其解释性作用。
- source_word: πολλοὶ πλάνοι
  choice: 许多迷惑人的
  rationale: πλάνος在此指误导他人的人，不只是自身走迷的人；这样译也能与后文单数“那迷惑人的”保持词汇呼应。
- source_word: ἐξῆλθον εἰς τὸν κόσμον
  choice: 已经进入世上
  rationale: 表达这些人已公开出现在世上并开展活动；不把κόσμος过度解释为抽象的“世界体系”。
- source_word: οἱ μὴ ὁμολογοῦντες
  choice: 他们不承认
  rationale: 实词化分词指前述那些人；“承认”在此包含公开认信之意，同时比生硬的“宣认”更易为普通读者理解。
- source_word: Ἰησοῦν Χριστόν
  choice: 耶稣是……基督
  rationale: 宾语与其补足成分可理解为认信耶稣的弥赛亚身份；“基督”是现代中文圣经语域中对Χριστός这一称号成熟且易识别的译法。
- source_word: ἐρχόμενον
  choice: 来的
  rationale: 保留希腊文现在分词的形式，不径直改成完成式“已经来过”；中文定语结构也容许其时间指向保持一定开放性。
- source_word: ἐν σαρκί
  choice: 在肉身中
  rationale: 保留约翰文献中具有神学分量的具身表达，指真实的人性和身体存在，并非“罪性”。
- source_word: οὗτός ἐστιν
  choice: 这样的人就是
  rationale: 单数指示词将前述一类人个体化或类型化；“这样的人”比直译“这一个”自然，也避免误指前面整件事。
- source_word: ὁ πλάνος
  choice: 那迷惑人的
  rationale: 与前面的复数πλάνοι保持一致，并保留定冠词所带的识别、归类意味。
- source_word: ὁ ἀντίχριστος
  choice: 敌基督者
  rationale: 采用中文基督教文献中通行的对应语，同时“者”明确指人。
theological_decisions:
- issue: Χριστός的译法与句法关系
  choice: 耶稣是……基督
  alternative: 耶稣基督
  rationale: 本节聚焦认信的内容，Χριστός的称号意味较强；加入“是”使中文清楚表达对耶稣身份的承认，而不把“基督”仅当作名字的一部分。
- issue: ἐρχόμενον ἐν σαρκί的时态与体貌
  choice: 在肉身中来的
  alternative: 已经在肉身中来了
  rationale: 希腊文是现在分词“来的”，译文保留这一形式及其张力，不擅自将其限定为完成的过去事件；同时明确肯定耶稣真实具身而来。
- issue: σάρξ的含义
  choice: 肉身，即真实具身的人性
  alternative: 罪性
  rationale: 在此基督论语境中，σάρξ指真实的人类身体存在，不指道德败坏或罪性。
- issue: 单数οὗτος对前述复数的回指
  choice: 这样的人
  alternative: 这就是
  rationale: 将单数理解为对每一个具有上述特征者或此类人的概括，既保留从复数到单数的变化，也不强行指定某一个具体人物。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“迷惑人的”兼顾名词功能与自然表达；以分号划分“进入世上”与对这些人的进一步说明。全文只在确有必要处设置脚注，并在正文中以[a]标示。
