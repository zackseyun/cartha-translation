source:
  edition: SBLGNT
  text: εἴ τις ἔρχεται πρὸς ὑμᾶς καὶ ταύτην τὴν διδαχὴν οὐ φέρει, μὴ λαμβάνετε αὐτὸν εἰς οἰκίαν καὶ χαίρειν αὐτῷ μὴ λέγετε·
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/010.yaml
  text: If anyone comes to you and does not bring this teaching, do not receive him into your house, and do not say a greeting to him.
translation:
  language: zh_hans
  text: 如果有人到你们那里，不带来这教导，你们就不要接待他进家里，也不要向他问安。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“不要对他说‘愿你喜乐’”；这里是指向他致意或问安。
    reason: lexical_alternative
  - marker: b
    text: 按上下文，这项警告针对不带来“这教导”的人，很可能是所传信息偏离前文所述使徒宣认的巡回教师。
    reason: cross_reference
lexical_decisions:
- source_word: εἴ τις
  choice: 如果有人
  rationale: 保留不定条件句的开放、泛指意味，符合现代汉语表达。
- source_word: ἔρχεται πρὸς ὑμᾶς
  choice: 到你们那里
  rationale: 直接表达朝收信人而来，不把上下文中的教会接待含义提前写入正文。
- source_word: ταύτην τὴν διδαχήν
  choice: 这教导
  rationale: “教导”清楚自然，也保留 διδαχή 可指所传内容的意义；保留指示词“这”。
- source_word: οὐ φέρει
  choice: 不带来
  rationale: 贴近 φέρω 的基本意象，又能自然表达来者没有带着或传讲这教导。
- source_word: μὴ λαμβάνετε αὐτὸν εἰς οἰκίαν
  choice: 不要接他到家里
  rationale: λαμβάνω 与 εἰς οἰκίαν 合起来涉及接纳和款待；此译法保留具体的家庭接待场景，同时不扩大为禁止一切接触。
- source_word: χαίρειν αὐτῷ μὴ λέγετε
  choice: 不要向他问安
  rationale: χαίρειν 在此是问候语的内容；“问安”是自然、庄重的现代汉语，也保留向对方致意的含义。
theological_decisions:
- issue: 对不带来这教导之人的禁令范围
  choice: 保留“接到家里”和“问安”两个具体禁令，不在正文中解释为全面禁止任何社会交往，也不限定为仅禁止教会正式接待。
  alternative: 译成完全不可与此人来往，或明确限定为不可接待他作巡回教师。
  rationale: 上下文很可能涉及偏离使徒宣认的巡回教师，但希腊文自身只陈述具体行动；译文应保留其应用范围上的张力。
- issue: αὐτόν / αὐτῷ 的性别与数
  choice: 他
  alternative: 对方／他们
  rationale: 原文为阳性单数代词；汉语用“他”忠实保留其语法形式，同时条件句中的“有人”仍有泛指作用。
translation_notes:
  register: 采用现代、清楚而庄重的普通话。“到你们那里”“接他到家里”保持具体直接；“问安”比“说一句问候的话”更自然，又不失经文语体。脚注标记均置于正文句末，分别补充原文问候表达及上下文范围。
