id: 2JN.1.9
reference: 2 John 1:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: πᾶς ὁ ⸀προάγων καὶ μὴ μένων ἐν τῇ διδαχῇ τοῦ Χριστοῦ θεὸν οὐκ ἔχει· ὁ μένων ἐν τῇ ⸀διδαχῇ, οὗτος καὶ τὸν πατέρα καὶ τὸν υἱὸν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/009.yaml
  text: Everyone who goes on ahead and does not remain in the teaching of Messiah does not have God[a]. The one who remains in the teaching[b], this one has both the Father and the Son.
translation:
  language: zh_hans
  text: 凡走在前头[a]、不持守弥赛亚的教导[b]的人，没有神；持守这教导的人，这人既有父，也有子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “走在前头”也可译作“走得太远”或“越过界限”；有些抄本作“违犯”。
    reason: textual_variant
  - marker: b
    text: “弥赛亚的教导”既可理解为“弥赛亚所作的教导”，也可理解为“关于弥赛亚的教导”。
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ὁ προάγων
  choice: 凡越过界限……的人
  rationale: πᾶς与带冠词的分词构成泛指。προάγων本义为“走在前面、向前进”，此处语境含越出正确教导范围之意；“越过界限”保留前行过头的比喻性，又不采用异文“违犯”的措辞。
- source_word: μὴ μένων
  choice: 不持守
  rationale: μένω是约翰著作中的关键词，意为停留、常在、持续。“持守”在教导的语境中自然明确，并与下句重复对应。
- source_word: ἐν τῇ διδαχῇ
  choice: 持守……教导
  rationale: διδαχή译作“教导”，比“教义”更通俗，也保留其可指所教内容的含义。中文以“持守教导”自然表达μένω ἐν的关系。
- source_word: τοῦ Χριστοῦ
  choice: 弥赛亚
  rationale: Χριστός在此作为称号，译作“弥赛亚”。属格既可指弥赛亚所作的教导，也可指关于弥赛亚的教导，正文用紧凑结构保留这种可能性。
- source_word: θεὸν οὐκ ἔχει
  choice: 没有神
  rationale: 直译ἔχει与θεόν的鲜明表述，不扩写为“与神没有相交”等解释性措辞。
- source_word: ὁ μένων ἐν τῇ διδαχῇ, οὗτος
  choice: 持守这教导的人，才是……的人
  rationale: 以“才是”体现οὗτος的强调作用，同时使中文自然，并保持与前句的对照。
- source_word: καὶ τὸν πατέρα καὶ τὸν υἱὸν ἔχει
  choice: 既有父又有子
  rationale: 用“既……又……”对应καὶ…καὶ，保留“父”和“子”这两个关系性称谓。
theological_decisions:
- issue: προάγων在本节的意义及异文
  choice: 正文译为“越过界限”
  alternative: 走在前头；走得太远；违犯
  rationale: SBLGNT正文为προάγων，而不是异文παραβαίνων。语境明显带负面含义，“越过界限”传达越出弥赛亚教导范围的意思，却不把异文直接写入正文。
- issue: τοῦ Χριστοῦ的属格关系
  choice: 以“弥赛亚教导”保留紧凑表达
  alternative: 弥赛亚所作的教导；关于弥赛亚的教导
  rationale: 希腊文属格可作主属格或宾属格理解，语境不能排除任何一种，故不在正文中强行消除歧义。
- issue: Χριστοῦ的称号表达
  choice: 弥赛亚
  alternative: 基督
  rationale: 这里Χριστός作为称号使用；“弥赛亚”直接呈现该称号的含义。
- issue: “有神”的神学力度
  choice: 保留“没有神／有父又有子”的原文说法
  alternative: 与神没有相交／与父和子相交
  rationale: 原文使用ἔχω，措辞刻意鲜明；解释为“相交”虽可能符合相关语境，却超出本节明说的内容。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“持守”适合书信劝诫语体，并呼应约翰著作中μένω反复出现的持续、常在观念。两个脚注标记集中置于全节末尾，分别说明前半句中的词义及异文，以及贯穿两句的属格歧义。
