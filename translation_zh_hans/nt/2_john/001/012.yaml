id: 2JN.1.12
reference: 2 John 1:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Πολλὰ ἔχων ὑμῖν γράφειν οὐκ ἐβουλήθην διὰ χάρτου καὶ μέλανος, ἀλλὰ ἐλπίζω ⸀γενέσθαι πρὸς ὑμᾶς καὶ στόμα πρὸς στόμα λαλῆσαι, ἵνα ἡ χαρὰ ⸀ὑμῶν ⸂πεπληρωμένη ᾖ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/012.yaml
  text: Though I have many things to write to you[a], I did not want to do so with paper and ink. Instead, I hope to come to you and speak face to face, so that your joy may be made complete.
translation:
  language: zh_hans
  text: 我还有许多事要写给你们，却不愿用纸墨来写；我盼望到你们那里，和你们当面交谈，好使你们的喜乐得以完全。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“我们的喜乐”。
    reason: textual_variant
lexical_decisions:
- source_word: Πολλὰ ἔχων ὑμῖν γράφειν
  choice: 我还有许多事要写给你们
  rationale: 保留Πολλά的复数含义，并以现代汉语自然表达分词结构所带的让步背景；ὑμῖν按复数译为“你们”。
- source_word: οὐκ ἐβουλήθην διὰ χάρτου καὶ μέλανος
  choice: 却不愿用纸墨来写
  rationale: βούλομαι表达意愿；διά加属格表示凭借的媒介。“用纸墨来写”自然清楚，也保留原文的工具含义。
- source_word: ἀλλὰ ἐλπίζω γενέσθαι πρὸς ὑμᾶς
  choice: 我盼望到你们那里
  rationale: γενέσθαι πρὸς ὑμᾶς在此表示来到收信人身边；“到你们那里”保留πρός的方向性。
- source_word: στόμα πρὸς στόμα λαλῆσαι
  choice: 和你们当面交谈
  rationale: στόμα πρὸς στόμα是直接亲身谈话的习语，不宜机械译作“口对口”；“当面交谈”符合现代汉语，并体现λαλῆσαι的双向交流语境。
- source_word: ἵνα ἡ χαρὰ ὑμῶν πεπληρωμένη ᾖ
  choice: 好使你们的喜乐得以完全
  rationale: “好使”保留目的从句；“得以完全”表达完成时分词与虚拟式所指向的圆满状态，同时保留原文略显神学性的措辞。
theological_decisions:
- issue: 喜乐归属代词的文本异文
  choice: 你们的喜乐
  alternative: 我们的喜乐
  rationale: 所给SBLGNT正文采用ὑμῶν（你们的），故正文据此翻译；部分抄本的ἡμῶν（我们的）可能影响对共同喜乐的理解，因此在脚注中保留，不予消解。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“纸墨”凝练地对应χάρτου καὶ μέλανος；“当面交谈”避免“口对口”在现代汉语中的误解。异文标记置于相关分句之后。
