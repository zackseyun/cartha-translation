  source_fidelity: 译文准确传达了请求、非新命令、从起初已有以及彼此相爱的核心内容。但“我写给你的并不是什么新命令”较容易被理解为作者正在写的内容完全不是一条命令，且未清楚对应原文“不是仿佛在写一条新命令，而是［那条］从起初已有的命令”的对照。
  naturalness: 整体为自然、庄重的现代汉语。“我现在请求你，夫人”及“我写给你的不是……而是……”能更清楚地呈现书信语境和原句对照。
  terminology: “夫人”“新命令”“从起初”“彼此相爱”均合适。“夫人”保留了κυρία可指具体女性、拟人化教会或专名的未决所指；脚注应继续说明这一点。
  issues:
