source:
  edition: SBLGNT
  text: καὶ νῦν ἐρωτῶ σε, κυρία, οὐχ ὡς ἐντολὴν ⸂καινὴν γράφων σοι⸃ ἀλλὰ ἣν εἴχομεν ἀπ’ ἀρχῆς, ἵνα ἀγαπῶμεν ἀλλήλους.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/005.yaml
  text: 'And now I ask you[a], lady, not as though I were writing to you a new commandment, but the one we have had from the beginning: that we love one another.'
translation:
  language: zh_hans
  text: 我现在请求你，夫人[a]：我写给你的不是一条新命令，而是我们从起初就有的那一条命令，就是要我们彼此相爱。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “夫人”也可能是对教会的拟人称呼；另有人认为“居里亚”（Kyria）是人名。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐρωτῶ
  choice: 请求
  rationale: 此处表示郑重而温和地提出请求；“请求”比单纯的“问”更符合书信语境，又不至于强化为“劝勉”。
- source_word: κυρία
  choice: 夫人
  rationale: 这是该词呼格形式的直接对应，既可指一位女性，也保留其可能象征教会或被理解为名字的歧义。
- source_word: ἐντολὴν καινὴν
  choice: 新命令
  rationale: 采用约翰文献中自然且一致的表达，并保留与相关经文的互文呼应。
- source_word: γράφων σοι
  choice: 我写给你的
  rationale: 结合 οὐχ ὡς 的比较结构译成自然汉语；“并不是什么……命令”传达“并非仿佛在写一条新命令”的意思。
- source_word: ἣν εἴχομεν
  choice: 我们……就有的命令
  rationale: 未完成时与“从起初”连用，表达这命令自起初已为群体所持有；汉语借“从起初就有”自然体现延续性。
- source_word: ἀπ’ ἀρχῆς
  choice: 从起初
  rationale: 保留约翰文献的惯用表达及其文学、神学连贯性。
- source_word: ἵνα ἀγαπῶμεν ἀλλήλους
  choice: 就是要我们彼此相爱
  rationale: 将 ἵνα 从句理解为前述命令的内容；“要我们”兼顾虚拟语气所含的劝勉意味。
theological_decisions:
- issue: κυρία 的所指
  choice: 正文直译为“夫人”，不判定所指
  alternative: 将其解释为人格化的地方教会，或将 Κυρία 视为专名
  rationale: 希腊文容许多种理解；正文保留词面的称呼及其真实歧义，脚注列出主要可能。
- issue: ἵνα 从句与“命令”的关系
  choice: 译为解释命令内容的“就是要……”
  alternative: 译为目的性的“为要……”
  rationale: 在当前句法中，该从句最自然地说明那条命令的内容，同时仍保留劝勉的语气。
translation_notes:
  register: 采用现代、庄重而易懂的书信体。“夫人”比“女士”略具书信称呼的庄重感；破折号帮助读者把握 οὐχ ὡς…ἀλλά… 的插入式对照结构。
