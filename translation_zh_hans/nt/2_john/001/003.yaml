  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἔσται μεθ’ ἡμῶν χάρις ἔλεος εἰρήνη παρὰ θεοῦ πατρός, καὶ ⸀παρὰ Ἰησοῦ Χριστοῦ τοῦ υἱοῦ τοῦ πατρός, ἐν ἀληθείᾳ καὶ ἀγάπῃ.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/003.yaml
  text: Grace[a], mercy, and peace will be with us from God the Father and from Jesus the Messiah, the Father's Son[b], in truth and love.
translation:
  language: zh_hans
  text: 恩典、怜悯与平安，必从父神和父的儿子耶稣弥赛亚[a]而来，在真理和爱中与我们同在。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弥赛亚”是称号，意思是“受膏者”；也常译作“基督”。
    reason: 说明Χριστός的称号意义，并保留中文常见传统译法。
lexical_decisions:
- source_word: ἔσται μεθ’ ἡμῶν
  choice: 必……与我们同在
  rationale: ἔσται是将来时直陈语气，直译其确定的将来含义；μετά加属格在此表示“与……同在”。
- source_word: χάρις ἔλεος εἰρήνη
  choice: 恩典、怜悯和平安
  rationale: 三个并列名词共同作ἔσται的主语；采用现代中文教会内外均较易理解的常用对应词。
- source_word: παρὰ θεοῦ πατρός
  choice: 从父上帝……而来
  rationale: παρά加属格表示来源；原文没有“我们的”，故不增补。将θεοῦ πατρός自然表达为“父上帝”。
- source_word: παρὰ Ἰησοῦ Χριστοῦ
  choice: 从……耶稣基督而来
  rationale: 第二个παρά同样表示来源。中文以通行称号“基督”表达Χριστός，并用脚注说明其称号含义。
- source_word: τοῦ υἱοῦ τοῦ πατρός
  choice: 父的儿子
  rationale: 保留两个定冠词所表达的明确关系，并使该短语直接同位说明耶稣基督的身份。
- source_word: ἐν ἀληθείᾳ καὶ ἀγάπῃ
  choice: 在真理和爱中
  rationale: 保留ἐν的范围或处境含义，也不擅自限定该短语只修饰某一个成分。
theological_decisions:
- issue: Χριστός的译法
  choice: 基督，并以脚注释为“受膏者”
  alternative: 受膏者；弥赛亚
  rationale: Χριστός在此是耶稣的称号。正文采用现代中文最通行且庄重的称呼，同时以脚注明示其称号意义，避免读者只把它理解为姓名。
- issue: “父的儿子”与耶稣基督的关系
  choice: 作为同位语直接认定耶稣基督是父的儿子
  alternative: 将其处理为较松散的描述语
  rationale: 希腊文属格短语紧接在Ἰησοῦ Χριστοῦ之后，最自然地构成同位说明；译文不增加原文以外的教义术语。
- issue: “在真理和爱中”的修饰范围
  choice: 置于句末，保留其可修饰“与我们同在”乃至整句祝福的开放性
  alternative: 明确改写为“使我们活在真理和爱中”
  rationale: 原文句末介词短语的关联范围具有一定开放性；不通过增添“使我们活”等成分替作者作出限定。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“必……与我们同在”保留书信祝福语的确定语气；调整语序为“从……而来，在……中与我们同在”，以避免中文中来源短语连续堆叠，同时维持原文各成分及句末短语的张力。
