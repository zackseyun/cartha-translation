  text: βλέπετε ἑαυτούς, ἵνα μὴ ⸀ἀπολέσητε ἃ ⸀εἰργασάμεθα, ἀλλὰ μισθὸν πλήρη ⸀ἀπολάβητε.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/008.yaml
  text: Watch yourselves[a], so that you may not lose what we have worked for, but may receive a full reward.
translation:
  language: zh_hans
  text: 你们要当心自己，免得失去我们所做成的，反要得到完全的赏赐。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“你们所做成的”，而不是“我们所做成的”。
    reason: textual_variant
lexical_decisions:
- source_word: βλέπετε ἑαυτούς
  choice: 你们要谨慎自守
  rationale: 现在时命令语气要求持续警醒；“谨慎自守”自然地表达“留意自己、当心自己”，保留对读者直接而郑重的警告。
- source_word: ἵνα μὴ ἀπολέσητε
  choice: 免得失去
  rationale: ἵνα加否定词及虚拟语气表达应当避免的结果；此处ἀπόλλυμι指丧失已有或将得的成果，不宜译作“毁灭”。
- source_word: ἃ εἰργασάμεθα
  choice: 我们劳作所得的成果
  rationale: 按所给SBLGNT文本保留第一人称复数“我们”；“成果”将关系代词ἃ所指的劳作结果自然传达出来，同时不把它与后面的“赏赐”完全等同。
- source_word: μισθὸν πλήρη
  choice: 完全的赏赐
  rationale: μισθός在本段劝勉语境中译为“赏赐”比“工钱”自然；πλήρης强调赏赐完整、没有亏损。
- source_word: ἀπολάβητε
  choice: 得到
  rationale: 该词在此表示获得或领受；“得到”简明通顺，不强加“收回”的可能语义。
theological_decisions:
- issue: εἰργασάμεθα的主语及文本异文
  choice: 我们劳作所得的成果
  alternative: 你们劳作所得的成果
  rationale: 所给SBLGNT正文为第一人称复数εἰργασάμεθα，指作者及同工的劳作；部分抄本作第二人称复数，使其指读者的劳作。正文依源文本，异文在脚注中保留。
- issue: “成果”与“赏赐”的关系
  choice: 使用两个相关但不完全相同的词
  alternative: 将两者都处理为同一种所得
  rationale: 原文以ἃ（劳作所成之事）和μισθός（赏赐）分别表达。译文保留这种区分，避免武断断定二者完全相同，也不消解两者显然存在的关联。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“谨慎自守”保留劝诫力度；句式以“免得……反要……”清楚呈现原文的否定目的与正面转折。
