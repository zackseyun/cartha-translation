  text: σπουδαιοτέρως οὖν ἔπεμψα αὐτὸν ἵνα ἰδόντες αὐτὸν πάλιν χαρῆτε κἀγὼ ἀλυπότερος ὦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/028.yaml
  text: Therefore I sent him all the more eagerly, so that when you see him again you may rejoice, and I may be less distressed.
translation:
  language: zh_hans
  text: 所以，我更加迫切地差他去，好让你们再见到他时可以喜乐，我也可以少些忧愁。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπουδαιοτέρως
  choice: 更加迫切地
  rationale: 比较级副词，表示保罗因前述情况而更为急切、认真地差派以巴弗提；“更加迫切地”自然保留比较意味与紧迫感。
- source_word: οὖν
  choice: 所以
  rationale: 承接前文并引出相应行动；“所以”在现代汉语中清楚自然。
- source_word: ἔπεμψα
  choice: 差他去
  rationale: 不定过去时直陈语气表述差派行动；结合书信递送场景，汉语“差他去”比孤立的“差了他”更自然。
- source_word: ἵνα
  choice: 好让
  rationale: 引出差派行动的目的；“好让”既自然又保留目的意味。
- source_word: ἰδόντες
  choice: 见到他时
  rationale: 不定过去时分词在目的从句中构成伴随的时间情境，译作“见到他时”符合现代汉语表达。
- source_word: πάλιν
  choice: 再
  rationale: 表示再次见到以巴弗提；置于“见到”之前简洁自然。
- source_word: χαρῆτε
  choice: 可以喜乐
  rationale: 不定过去时虚拟语气受ἵνα支配，表达预期目的；“喜乐”保留腓立比书中反复出现的主题词。
- source_word: κἀγὼ
  choice: 我也
  rationale: καὶ与ἐγώ的缩合，表示并列并带有“也”的意味；汉语译出“也”可清楚呈现双方结果。
- source_word: ἀλυπότερος
  choice: 少些忧愁
  rationale: 比较级形容词表示忧伤减轻，而非完全消失；“少些忧愁”保留其程度比较，也符合庄重而通俗的汉语。
- source_word: ὦ
  choice: 可以
  rationale: εἰμί的现在虚拟语气与比较级谓语连用；汉语以“可以少些忧愁”自然表达目的从句中的预期结果。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重且易懂的简体中文。“喜乐”保留保罗书信的关键词呼应；“少些忧愁”不把保罗的情绪具体化为焦虑或悲痛，从而保存原文λύπη语义的宽度及比较级所体现的张力。
