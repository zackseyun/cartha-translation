  source_fidelity: 译文准确传达了原文的推论关系（οὖν）、比较级的加重语气（σπουδαιοτέρως）、差派行动（ἔπεμψα）、目的（ἵνα）、再次见面（πάλιν）、喜乐以及保罗忧愁减轻的比较意义（ἀλυπότερος）。「再见到他时」自然地表达了ἰδόντες的时间性情境；「少些忧愁」没有把原文宽泛的忧伤具体化过度。
  naturalness: 「所以，我更加迫切地差他去，好让你们再见到他时可以喜乐，我也可以少些忧愁」在现代标准汉语中通顺、庄重，并适合书信体经文。「差他去」虽略带书面色彩，但与使徒差派同工的语境相称，且不生硬。
