id: PHP.2.12
reference: Philippians 2:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ὥστε, ἀγαπητοί μου, καθὼς πάντοτε ὑπηκούσατε, μὴ ὡς ἐν τῇ παρουσίᾳ μου μόνον ἀλλὰ νῦν πολλῷ μᾶλλον ἐν τῇ ἀπουσίᾳ μου, μετὰ φόβου καὶ τρόμου τὴν ἑαυτῶν σωτηρίαν κατεργάζεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/012.yaml
  text: So then[a], my beloved, just as you have always obeyed—not only in my presence, but now much more in my absence—work out your own salvation with fear and trembling[c][b],
translation:
  language: zh_hans
  text: 所以，我亲爱的，你们一向顺从；不只是我在场时如此，如今我不在场时更是如此。你们要怀着敬畏战兢，作成自己的救恩[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “作成”也可译作“完成”或“贯彻到底”，指使救恩在生活中得到实现；并非指以行为赚取救恩。
    reason: alternative_reading
  - marker: b
    text: “敬畏战兢”表达在神面前肃穆、敬畏和谦卑的认真态度。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥστε
  choice: 所以
  rationale: 承接上文的论述并引出推论；“所以”在现代汉语中自然、清楚。
- source_word: ἀγαπητοί μου
  choice: 我亲爱的弟兄姊妹
  rationale: 原文是带有牧养温情的复数称呼；按书信受众以“弟兄姊妹”自然表达群体性，同时保留“我亲爱的”所传达的亲密语气。
- source_word: καθὼς πάντοτε ὑπηκούσατε
  choice: 你们既然一向顺从
  rationale: καθώς在此既可表比较，也可结合既有事实引出劝勉；“既然”使汉语句法顺畅，而“一向顺从”概括他们过去持续表现出的顺从。
- source_word: μὴ ὡς ἐν τῇ παρουσίᾳ μου μόνον ἀλλὰ νῦν πολλῷ μᾶλλον ἐν τῇ ἀπουσίᾳ μου
  choice: 不仅我在你们那里时如此，如今我不在，更要顺从
  rationale: 保留保罗在场与不在场的鲜明对照，并将希腊文省略的动词在汉语中补出，使意思清楚自然。
- source_word: μετὰ φόβου καὶ τρόμου
  choice: 怀着敬畏战兢
  rationale: “敬畏”兼顾φόβος在此语境中的肃穆与敬虔意味，“战兢”保留τρόμος的强烈力度，避免淡化为一般尊重。
- source_word: τὴν ἑαυτῶν σωτηρίαν
  choice: 自己的救恩
  rationale: “救恩”保留σωτηρία的神学分量；“自己的”对应反身代词ἑαυτῶν，强调受众应亲自认真回应，却不把群体劝勉改写成孤立的个人主义。
- source_word: κατεργάζεσθε
  choice: 活出
  rationale: 该动词表示实行、成就或贯彻到底；“活出”在现代汉语中能表达使救恩落实于生活，但不暗示靠行为赚取救恩。脚注保留其也可译作“成就”的语义张力。
theological_decisions:
- issue: “成就／活出自己的救恩”的含义
  choice: 正文译为“活出自己的救恩”，表示把救恩贯彻并落实在生活中。
  alternative: “成就自己的救恩”或理解为凭人的努力取得救恩。
  rationale: κατεργάζεσθε的语义可包括实行、完成、产生结果；紧接的第13节强调神在他们里面运行。正文避免造成“赚取救恩”的自然误解，脚注则注明较形式对应的译法，以保留原文张力。
- issue: “敬畏战兢”的力度
  choice: 理解为人在神面前肃穆、谦卑而郑重的敬畏。
  alternative: 只指惊恐畏缩，或仅指不带情感力度的一般尊重。
  rationale: 固定搭配φόβος καὶ τρόμος具有强烈的严肃性；译文既保留“战兢”，也用“敬畏”避免把它窄化为纯粹恐怖。
- issue: 劝勉的个人与群体维度
  choice: 保留“自己的”，同时以复数“你们”和“弟兄姊妹”显示这是对整个群体的劝勉。
  alternative: 把经文处理为完全孤立的个人救恩命令，或删去反身代词的强调。
  rationale: ἑαυτῶν为复数反身代词；译文不消除个人责任，也不抹去腓立比教会群体共同受劝勉的语境。
translation_notes:
  register: 采用现代、庄重而易懂的书信语体。“弟兄姊妹”自然表达复数受众；分号理清原文较长的句法。“敬畏战兢”保留传统表达及原文力度，“活出自己的救恩”则避免现代读者误读为靠功劳换取救恩。
