  text: ἐταπείνωσεν ἑαυτὸν γενόμενος ὑπήκοος μέχρι θανάτου, θανάτου δὲ σταυροῦ·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/008.yaml
  text: he humbled himself[b][a], becoming obedient to the point of death—even death on a cross.
translation:
  language: zh_hans
  text: 他降卑自己，顺服至死[a]，甚至死在十字架上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“直到死”；原文表示他的顺服一直延伸到死亡本身。
    reason: lexical_alternative
  - marker: b
    text: 直译“十字架的死”；这里指死在十字架上。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐταπείνωσεν
  choice: 降卑
  rationale: 采用现代中文圣经语体中自然而庄重的表达，保留主动使自己处于卑微地位的含义。
- source_word: ἑαυτὸν
  choice: 自己
  rationale: 明确保留反身代词，突出这一降卑是他主动施于自身的行动。
- source_word: γενόμενος
  choice: （以）顺服
  rationale: 原文分词与“降卑自己”相连，说明其具体表现或方式；中文以紧接的谓语“顺服”自然表达，不强行限定为纯时间先后关系。
- source_word: ὑπήκοος
  choice: 顺服
  rationale: 直接表达听从、服从之意，符合上下文，同时避免加入原文没有明说的顺服对象。
- source_word: μέχρι θανάτου
  choice: 至死
  rationale: 简洁保留顺服一直达到死亡的界限或程度；脚注说明也可直译为“直到死”，不消除其表达张力。
- source_word: δὲ
  choice: 甚至
  rationale: 在重复“死”的递进结构中体现强调：不只是死，更是十字架上的死。
- source_word: σταυροῦ
  choice: 死在十字架上
  rationale: 将压缩的属格短语“十字架的死”按自然现代汉语展开，清楚呈现死亡的具体方式，同时保留十字架这一鲜明意象。
theological_decisions:
- issue: θανάτου δὲ σταυροῦ末句的语气和关系
  choice: 译作“甚至死在十字架上”，表达递进强调。
  alternative: “就是十字架上的死”或较直译的“十字架之死”
  rationale: 原文以重复“死”并加δέ形成高潮，重点在于死亡进一步被具体限定为十字架上的死；译文保留这种强调，但不额外加入关于羞辱、咒诅或救赎机制的解释。
- issue: γενόμενος ὑπήκοος与“降卑自己”的关系
  choice: 用“顺服至死”紧接主句，作为降卑的表现或方式。
  alternative: “成为顺服的，直到死”
  rationale: 分词可带有伴随、方式或结果色彩；中文不添加“借着”或“于是”，以免将语法关系限定得过死，同时避免生硬的“成为顺服的”。
translation_notes:
  register: 采用现代、庄重而通顺的简体中文。“降卑自己”保留原文的主动和反身意味；“顺服至死”凝练但不古奥；末句用“甚至”重现原文的递进高潮。所有脚注标记均置于其所说明的短语之后。
