id: PHP.2.5
reference: Philippians 2:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: τοῦτο ⸀φρονεῖτε ἐν ὑμῖν ὃ καὶ ἐν Χριστῷ Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/005.yaml
  text: Have this mindset among yourselves[a], which was also in Messiah Jesus[b],
translation:
  language: zh_hans
  text: 你们彼此之间要有这样的心思[a]，这也是弥赛亚耶稣所怀的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们在弥赛亚耶稣里也要有这样的心思。”
    reason: alternative_reading
  - marker: b
    text: 希腊文为“基督”；这里译作“弥赛亚”，因为Χριστός在此具有称号的作用。
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: 这样的
  rationale: 指向下文所展现的心思；用“这样的”自然承接后文，同时保留指示作用。
- source_word: φρονεῖτε
  choice: 要有……心思
  rationale: φρονέω在保罗书信中常指持续的思想取向和态度，不只是一次性的思考；“要有……心思”兼顾命令语气与现代汉语的自然表达。
- source_word: ἐν ὑμῖν
  choice: 你们彼此之间
  rationale: ὑμῖν为复数，且上文强调群体生活与彼此相顾，因此按群体关系表达为“彼此之间”，而非仅指个人内心。
- source_word: ὃ καὶ ἐν Χριστῷ Ἰησοῦ
  choice: 这也是弥赛亚耶稣所怀的
  rationale: 希腊文省略动词，主译按紧接下文基督自我降卑的榜样性理解补出“所怀的”；另在脚注保留“在弥赛亚耶稣里”的参与性理解。
- source_word: Χριστῷ
  choice: 弥赛亚
  rationale: Χριστός在此作为耶稣的称号，译作“弥赛亚”能明确呈现其“受膏者”的称号性质。
theological_decisions:
- issue: 后半句是指耶稣亲自怀有并示范这种心思，还是指信徒在与弥赛亚联合中应当有这种心思。
  choice: 正文采用榜样性理解：“这也是弥赛亚耶稣所怀的”。
  alternative: “你们在弥赛亚耶稣里也要有这样的心思。”
  rationale: 下文立即叙述基督的自我降卑，支持榜样性理解；但原文结构紧缩且未明说动词，也容许参与或联合的理解，因此以脚注保存这一真实歧义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“彼此之间”突出群体语境；“所怀的”使省略动词的希腊文在汉语中完整自然，同时用脚注保留另一种句法和神学理解。
