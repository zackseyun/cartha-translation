  text: οὐδένα γὰρ ἔχω ἰσόψυχον ὅστις γνησίως τὰ περὶ ὑμῶν μεριμνήσει,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/020.yaml
  text: For I have no one like him who will genuinely care about your welfare[b][a],
translation:
  language: zh_hans
  text: 因为我没有一个与我同心的人[a]，能真诚地关心你们的事[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“与我心志相同”；原文较直译为“同魂”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“真诚地挂念与你们有关的事”。
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: 因为
  rationale: 保留本句对上文所作的解释，现代汉语中衔接自然。
- source_word: οὐδένα … ἔχω
  choice: 我没有一个……的人
  rationale: 直接表达“我没有人”的意思，不额外加入原文未明说的比较词“别人”。
- source_word: ἰσόψυχον
  choice: 与我同心
  rationale: 该词字面含有“同魂、同心志”之意；这里指在内在心志上与保罗相契合。译文补出语境中隐含的比较对象“我”，使中文清楚自然，同时以脚注保留较直译的表达。
- source_word: ὅστις
  choice: 能……的人
  rationale: 融入汉语定语结构，表达这样的人会承担下文所说的关怀。
- source_word: γνησίως
  choice: 真诚地
  rationale: 表达关怀的真实、诚挚，并保持庄重自然的语气。
- source_word: τὰ περὶ ὑμῶν
  choice: 你们的事
  rationale: 贴近原文“与你们有关的事”，范围可包括处境、需要和福祉，不将含义限定得过窄。
- source_word: μεριμνήσει
  choice: 关心
  rationale: 此处表示积极而深切的挂念，并非负面的焦虑；“关心”符合上下文和现代汉语习惯。
theological_decisions: []
