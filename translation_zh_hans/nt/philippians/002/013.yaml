  text: ⸀θεὸς γάρ ἐστιν ὁ ἐνεργῶν ἐν ὑμῖν καὶ τὸ θέλειν καὶ τὸ ἐνεργεῖν ὑπὲρ τῆς εὐδοκίας.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/013.yaml
  text: For God is the one working in you both to will and to work for his good pleasure[a][b].
translation:
  language: zh_hans
  text: 因为上帝在你们里面作工，使你们既立志又行事，为要成就他的美意。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使你们有意愿，也有行动。”
    reason: 原文两个带冠词的不定式也可按名词性结构表达为“意愿”和“行动”。
  - marker: b
    text: 或译：“按照他的美意。”
    reason: 此处介词短语也有人理解为表示准则或依据，而非目的或所为。
lexical_decisions:
- source_word: γάρ
  choice: 因为
  rationale: 承接上一节的劝勉，说明其根据；“因为”在现代汉语中自然保留解释性的连接作用。
- source_word: ὁ ἐνεργῶν
  choice: 运行
  rationale: 现在时分词表达持续发挥作用；“运行”也能与后面的 τὸ ἐνεργεῖν 保持词义呼应。
- source_word: ἐν ὑμῖν
  choice: 在你们里面
  rationale: 保留原文既可能指各信徒内在、也可能指群体之中的开放性；“你们”明确为复数。
- source_word: τὸ θέλειν
  choice: 愿意
  rationale: 表达意志与意愿，不将其弱化为一般愿望，也不增添原文没有明说的“能力”。
- source_word: τὸ ἐνεργεῖν
  choice: 行动
  rationale: 与“愿意”形成意志和实践的并列，同时用自然汉语表达实际实行之意。
- source_word: ὑπὲρ τῆς εὐδοκίας
  choice: 为着他的美意
  rationale: ὑπέρ 加属格在此自然表示目的或所为；“为着”保留这种关系，“他的”按主语上帝补明 εὐδοκία 的所属。
theological_decisions:
- issue: 上帝的运行与人的意愿、行动之间的关系
  choice: 译作“上帝在你们里面运行，使你们既愿意又行动”
  alternative: “上帝在你们里面运行，既运行在意愿上，也运行在行动上”
  rationale: 明确保留上帝在人的意愿和行动两个层面所发挥的作用，同时仍以“你们既愿意又行动”表达人的真实意志与实践，不进一步用特定宗派体系解释二者关系。
- issue: εὐδοκία 所指的归属
  choice: 他的美意
  alternative: 美意
  rationale: 原文名词本身未带所有格，但就近主语是上帝；补出“他的”使汉语明确自然，同时不把“美意”改释为更具体的神学概念。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“运行”保留原文 ἐνεργέω 词族在本节中的重复，“愿意又行动”则避免生硬名词化。主文与脚注共同保留目的性和准则性两种理解。
