  source_fidelity: 正文准确传达 μὴ…ἀλλὰ καί 的对照与附加：并非禁止关心自身事务，而是禁止只顾自身，也当顾及他人。‘各人’恰当表达 ἕκαστοι 的逐一分配意味；‘自己的事／别人的事’保留 τὰ ἑαυτῶν／τὰ ἑτέρων 的宽泛性，不限于财物或狭义利益；‘顾’自然表达 σκοποῦντες 在此处的留意、关切。
  naturalness: “各人不要只顾自己的事，也要顾别人的事”是现代标准汉语中简洁、庄重且顺畅的劝勉表达。两处“事”的平行结构清楚，并与上下文相称。
