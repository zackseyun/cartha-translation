id: PHP.2.4
reference: Philippians 2:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: μὴ τὰ ἑαυτῶν ⸀ἕκαστοι ⸀σκοποῦντες, ἀλλὰ καὶ τὰ ἑτέρων ⸁ἕκαστοι.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/004.yaml
  text: Each of you should look not only to your own interests[a], but also to the interests of others.
translation:
  language: zh_hans
  text: 各人不要只顾自己的事[a]，也要顾别人的事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“各人不要看自己的事，也要看别人的事。”
    reason: 说明原文“看／留意”及“自己的事”这一较为字面的表达；正文用“顾”呈现其在语境中的关注、照料含义。
lexical_decisions:
- source_word: σκοποῦντες
  choice: 顾
  rationale: 此处分词表达留意、关注并为之考虑；现代汉语“顾”简洁自然，也能在“顾自己的事／顾别人的事”的对应结构中保留主动关切之意。
- source_word: τὰ ἑαυτῶν
  choice: 自己的事
  rationale: 中性复数短语含义宽泛，可涵盖自己的事务、利益和关切，并不只指财物；“自己的事”保留这种宽度，避免把含义限缩为个人利益。
- source_word: ἕκαστοι
  choice: 各人
  rationale: 保留其逐一分配的语气，表明群体中的每一个人都受到劝勉。
- source_word: ἀλλὰ καὶ
  choice: 不要只……也要……
  rationale: 希腊文直陈结构在上下文中具有劝勉作用；这一汉语关联结构自然表达否定性的对比与附加，同时不把前项理解为完全禁止。
- source_word: τὰ ἑτέρων
  choice: 别人的事
  rationale: 与“自己的事”形成平行，宽泛涵盖他人的事务、需要、福祉和关切，而不局限于所有物。
theological_decisions:
- issue: 本句是否要求完全不顾自己的事
  choice: 译作“不要只顾自己的事”，表达在关注自己的同时也必须关注别人。
  alternative: 直译为“不要顾自己的事，而要顾别人的事”。
  rationale: ἀλλὰ καί明确包含“也”，且上下文重在反对只求自己的事，并非要求彻底忽略自身正当需要；“不要只……也要……”自然保留这种张力。
translation_notes:
  register: 采用现代、简洁而庄重的劝勉语体。“各人”适合群体性教导；两个“事”保持原文平行和语义宽度。正文中的脚注标记[a]与脚注一致。
