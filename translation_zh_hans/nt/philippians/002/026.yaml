  text: since he was longing for all of you and was deeply distressed because you heard that he was sick[a].
translation:
  language: zh_hans
  text: 因为他一直想念你们众人，又因你们听说他病了而十分忧伤。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπειδὴ
  choice: 因为
  rationale: 引出以巴弗提被送回去的原因；“因为”自然、清楚地保留因果关系。
- source_word: ἐπιποθῶν ἦν
  choice: 一直切切想念
  rationale: 现在分词与未完成时的ἦν构成迂回表达，描写过去持续的状态；“一直”体现持续性，“切切想念”传达强烈的思念。
- source_word: πάντας ὑμᾶς
  choice: 你们众人
  rationale: 保留πάντας所强调的全体范围，同时采用庄重而通顺的现代汉语。
- source_word: ἀδημονῶν
  choice: 深感不安
  rationale: 该词表示强烈的忧苦或困扰；此译比一般的“担心”更有力度，又避免过度解释为身体上的痛苦。
- source_word: διότι
  choice: 因
  rationale: 直接表达使他深感不安的原因，并与前面的“因为”形成自然的汉语句式。
- source_word: ἠκούσατε
  choice: 你们听说
  rationale: 按第二人称复数直译，并以“听说”自然表达得知消息。
- source_word: ὅτι ἠσθένησεν
  choice: 他病了
  rationale: ἀσθενέω在此指身体患病；“病了”既自然，也可体现不定过去时所可能包含的发病意味。
theological_decisions: []
