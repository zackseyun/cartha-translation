id: PHP.2.25
reference: Philippians 2:25
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ἀναγκαῖον δὲ ἡγησάμην Ἐπαφρόδιτον τὸν ἀδελφὸν καὶ συνεργὸν καὶ συστρατιώτην μου, ὑμῶν δὲ ἀπόστολον καὶ λειτουργὸν τῆς χρείας μου, πέμψαι πρὸς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/025.yaml
  text: But I considered it necessary to send to you Epaphroditus—my brother and fellow worker and fellow soldier[b][a], and your messenger and minister to my need—
translation:
  language: zh_hans
  text: 但我认为有必要差遣以巴弗提到你们那里去；他是我的弟兄、同工和战友，也是你们的使者[a]，在我的需要上服侍的人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使徒”，即你们所差派的人。
    reason: 保留ἀπόστολον的形式对应，并说明其在此语境中指受腓立比信徒差派的代表。
  - marker: b
    text: 或译“为我的需要服侍的人”。
    reason: 保留λειτουργός的“服侍者”含义，并反映τῆς χρείας μου所指向保罗需要的服务。
lexical_decisions:
- source_word: Ἀναγκαῖον
  choice: 有必要
  rationale: 表达保罗经过判断所认定的必要性；“有必要”符合现代汉语表达，也没有加强为外在强迫。
- source_word: ἡγησάμην
  choice: 我认为
  rationale: 体现ἡγέομαι在此作出判断、评估的含义，而不只是随意想到。
- source_word: πέμψαι
  choice: 差……到你们那里去
  rationale: 保留“差遣、派送”的基本意义；原文此处并未明说“差回去”，所以不把上下文推断写入正文。
- source_word: ἀδελφὸν
  choice: 弟兄
  rationale: 直接保留信仰群体中的亲属称谓，现代教会语境中自然易懂。
- source_word: συνεργὸν
  choice: 同工
  rationale: 简洁表达与保罗一同劳作的人，并符合现代汉语基督徒群体中通行而庄重的用语。
- source_word: συστρατιώτην
  choice: 战友
  rationale: 保留原文鲜明的军事比喻，同时比直译式的“同当兵者”自然。
- source_word: ἀπόστολον
  choice: 使者
  rationale: 此处指腓立比信徒所差派的代表；“使者”保留受差遣之意，又不预先认定为专门意义上的使徒职分。
- source_word: λειτουργὸν
  choice: 服侍我
  rationale: 按上下文表达以巴弗提实际承担服务的意思；采用动词结构可避免现代汉语“执事”或“部长”等职衔联想。
- source_word: τῆς χρείας μου
  choice: 在我有需要时
  rationale: 自然表达其服侍所针对的是保罗的需要，同时保留该属格短语在关系上的一定弹性。
theological_decisions:
- issue: ἀπόστολον应理解为专门职分“使徒”，还是广义的受差遣者
  choice: 使者
  alternative: 使徒，即你们所差派的人
  rationale: ὑμῶν表明以巴弗提是腓立比信徒的受差代表；正文用“使者”最贴合局部语境，脚注保留“使徒”这一形式对应及其可能引起的理解。
- issue: λειτουργόν是否应译成带有固定教会职分色彩的称号
  choice: 以“服侍”表达其职能
  alternative: 服事者／供职者
  rationale: 该词在此强调为保罗需要而承担服务，不足以确定现代意义上的固定职分；动词化处理避免增添制度性含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。前三个称谓“弟兄、同工和战友”保持并列递进；后两个称谓以“你们的使者”和服侍保罗需要的人相接。为避免汉语长句累赘，将希腊文一个句法单位分成两句，但不改变逻辑关系。
