  to: 但我认为有必要差遣以巴弗提到你们那里去；他是我的弟兄、同工和战友，也是你们的使者[a]，在我的需要上服侍的人[b]。
  rationale: 修订“差”字的现代汉语搭配，并将“在我有需要时”改为“在我的需要上”，避免把原文表示服务对象／范围的短语转成时间状语。保留“使者”的非技术性译法及“弟兄、同工、战友”的并列称谓，不增添职分或教派含义。
