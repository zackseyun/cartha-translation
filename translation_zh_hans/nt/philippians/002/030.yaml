reference: Philippians 2:30
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὅτι διὰ τὸ ἔργον ⸀Χριστοῦ μέχρι θανάτου ἤγγισεν, ⸀παραβολευσάμενος τῇ ψυχῇ ἵνα ἀναπληρώσῃ τὸ ὑμῶν ὑστέρημα τῆς πρός με λειτουργίας.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/030.yaml
  text: because for the work of Messiah he came near to death[c][b][a], risking his life to make up for what was lacking in your service to me.
translation:
  language: zh_hans
  text: 因为他为基督[a]的工作几乎丧命，冒着生命危险，要补上你们因无法亲自服侍我而缺少的那一部分[b]。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “基督”意为“受膏者”，也可译作“弥赛亚”。希腊文直译为“基督／弥赛亚的工作”。
    reason: alternative_reading
  - marker: b
    text: 这里并非说腓立比信徒不愿服侍，而是说他们因不在保罗身边，无法亲自完成的那一部分服侍。
    reason: cultural_note
  - marker: c
    text: “为基督的工作”也可译作“因基督的工作”。
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τὸ ἔργον Χριστοῦ
  choice: 为了基督的工作
  rationale: διά加宾格在这里表示缘故或所为的目标；“为了”自然表达他因投身这项工作而濒临死亡，同时保留“工作”的直白含义。
- source_word: Χριστοῦ
  choice: 基督
  rationale: Χριστός在此是称号；现代汉语圣经语境中“基督”是通行且庄重的称谓，其含义为“受膏者／弥赛亚”。
- source_word: μέχρι θανάτου ἤγγισεν
  choice: 几乎丧命
  rationale: 原文意为临近死亡、到了死亡边缘；“几乎丧命”是自然清楚的现代汉语表达。
- source_word: παραβολευσάμενος τῇ ψυχῇ
  choice: 冒着生命危险
  rationale: 分词表示使自己暴露于危险；此处ψυχή指今世的性命，不是专指非物质的灵魂。
- source_word: ἵνα ἀναπληρώσῃ
  choice: 为要补足
  rationale: ἵνα引出目的；ἀναπληρόω表示填补实际未能提供的部分。
- source_word: τὸ ὑμῶν ὑστέρημα
  choice: 你们未能亲自……的那一部分
  rationale: 这里所缺的是腓立比人因不在场而无法亲自提供的服侍，并非指责他们不情愿或有道德亏欠。
- source_word: τῆς πρός με λειτουργίας
  choice: 服侍我
  rationale: λειτουργία在此指向保罗提供的实际服务或援助；“服侍”既保留其事奉色彩，也适合具体关怀的语境。
theological_decisions:
- issue: 如何翻译保罗书信中的Χριστοῦ
  choice: 基督
  alternative: 弥赛亚
  rationale: “基督”是现代汉语中对Χριστός这一称号的标准译法，并未把它当作普通人名；脚注说明其称号含义，以保留“受膏者／弥赛亚”的语义。
- issue: “你们所缺少的”是否含责备意味
  choice: 明确为他们未能亲自完成的服侍部分
  alternative: 你们服侍我的不足
  rationale: 上下文表明以巴弗提代表腓立比信徒完成他们因距离而不能亲自做的事；译文避免把ὑστέρημα误读为不情愿或属灵缺陷。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“几乎丧命”和“冒着生命危险”清楚传达濒死与自愿涉险；“未能亲自……的那一部分”避免把原文的实际缺口误解为对腓立比信徒品格或意愿的责备。
