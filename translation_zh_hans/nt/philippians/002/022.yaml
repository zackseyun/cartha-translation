  text: τὴν δὲ δοκιμὴν αὐτοῦ γινώσκετε, ὅτι ὡς πατρὶ τέκνον σὺν ἐμοὶ ἐδούλευσεν εἰς τὸ εὐαγγέλιον.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/022.yaml
  text: But you know his proven character[b][a], that as a child with his father he served with me for the gospel.
translation:
  language: zh_hans
  text: 但你们知道他经过考验所显明的品格[a]：他曾像孩子同父亲一起服事那样[b]，与我一同为福音服事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “经过考验所显明的品格”也可译作“经验证实的品格”；原词指经过考验而被证明可靠的品质。
    reason: lexical_alternative
  - marker: b
    text: 原文为压缩的家庭类比，意为“如同孩子同父亲一起（服事）”。“与我一同”表明提摩太与保罗共同为福音服事，并不是说他服事保罗。
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: 但
  rationale: 承接上文并保留轻微的转折意味。
- source_word: δοκιμὴν αὐτοῦ
  choice: 他经受考验所显出的品格
  rationale: δοκιμή指经检验而显明的可靠品格；采用展开式表达，使现代读者能自然理解其受考验并获证实的含义。
- source_word: γινώσκετε
  choice: 你们知道
  rationale: 直接表达腓立比信徒对提摩太已有的认识；复数“你们”体现希腊语动词的人称与数。
- source_word: ὅτι
  choice: ：
  rationale: 在此引出他们所知道的具体内容；中文用冒号比生硬译作“就是”更自然。
- source_word: ὡς πατρὶ τέκνον
  choice: 像孩子与父亲同在一样
  rationale: 保留明示的比拟关系，也保留τέκνον不限定性别的“孩子”，不擅自窄化为“儿子”。
- source_word: σὺν ἐμοὶ
  choice: 与我一同
  rationale: 准确表达提摩太与保罗共同参与服事。
- source_word: ἐδούλευσεν
  choice: 服事
  rationale: 保留δουλεύω所含的尽心效力意味，同时符合中文福音事工语境，避免不自然地直译成“作奴隶”。
- source_word: εἰς τὸ εὐαγγέλιον
  choice: 为福音
  rationale: 自然表达其服事的目标和方向，同时保留“福音”作为事工中心。
theological_decisions:
- issue: 父子意象中τέκνον的性别范围
  choice: 孩子
  alternative: 儿子
  rationale: 原词τέκνον本身不指明性别；虽上下文所指的提摩太是男性，译作“孩子”更忠实地保留原句措辞。
- issue: 共同服事关系的句法张力
  choice: 他像孩子与父亲同在一样，与我一同……服事
  alternative: 他像儿子服事父亲那样服事我
  rationale: 原文明确说σὺν ἐμοί（与我一同），不是“服事我”；本译避免把保罗改成服事的对象，并保留两人共同为福音服事的关系。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“经受考验所显出的品格”略作展开，以传达δοκιμή的检验与证实双重含义；“像孩子与父亲同在一样”保留原文略显压缩的家庭比拟，而不将其解释性改写为“儿子服事父亲”。所有脚注标记均置于正文相关位置。
