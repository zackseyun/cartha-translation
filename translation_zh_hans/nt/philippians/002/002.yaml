  text: πληρώσατέ μου τὴν χαρὰν ἵνα τὸ αὐτὸ φρονῆτε, τὴν αὐτὴν ἀγάπην ἔχοντες, σύμψυχοι, τὸ ἓν φρονοῦντες,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/002.yaml
  text: complete my joy[a], so that you may think the same way, having the same love, being united in soul[c][b], thinking one thing.
translation:
  language: zh_hans
  text: 你们要使我的喜乐圆满，好让你们有同样的心思[a]，怀着同样的爱，心灵相合[b]，想着同一件事[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“有同样的想法”或“同心合意”。
    reason: φρονέω兼有思想、态度和心志等含义。
  - marker: b
    text: 直译：“同魂”；也可译：“同心”或“心灵一致”。
    reason: σύμψυχοι是由“共同”与“魂、生命”构成的复合词，中文可有数种表达。
  - marker: c
    text: 或译：“一心专注于同一个目标”。
    reason: τὸ ἓν既可较直地理解为“同一件事”，也可在语境中表达共同的目标或旨趣。
lexical_decisions:
- source_word: πληρώσατέ μου τὴν χαρὰν
  choice: 使我的喜乐圆满
  rationale: πληρόω含有使之充满、达到完满的意思。“使我的喜乐圆满”既自然，也保留了保罗所说喜乐达到完全程度的意象。
- source_word: ἵνα
  choice: 冒号引出具体内容
  rationale: 此处ἵνα可表达目的或进一步说明前面命令的内容。用冒号连接，使中文流畅，同时不把它狭义地限定为单一逻辑关系。
- source_word: τὸ αὐτὸ φρονῆτε
  choice: 存同样的心思
  rationale: φρονέω在《腓立比书》中不只是认知上的“想”，也涉及态度、取向和心志。“存同样的心思”保留这种较宽的含义。
- source_word: τὴν αὐτὴν ἀγάπην ἔχοντες
  choice: 怀着同样的爱
  rationale: 保留分词短语的伴随关系，并以现代汉语自然表达共同具有同一种爱。
- source_word: ἀγάπην
  choice: 爱
  rationale: “爱”是ἀγάπη在现代汉语中清楚、通用且不带宗派色彩的译法。
- source_word: σύμψυχοι
  choice: 心灵相合
  rationale: 该复合形容词含有共同心灵或同心的鲜明意象。“心灵相合”比泛称“团结”更贴近原文，也较自然。
- source_word: τὸ ἓν φρονοῦντες
  choice: 思想同一件事
  rationale: 尽量保留原文“那一件事”及再次使用φρονέω所形成的呼应；脚注交代它也可按共同目标来理解。
theological_decisions:
- issue: 如何处理两次φρονέω及本节对合一的强调
  choice: 译为“存同样的心思……思想同一件事”，保留同一词根所形成的重复和递进
  alternative: 译为“同心合意……专注于同一目标”
  rationale: 原文强调共同的心思、爱和内在取向，但未明说这等于所有意见毫无差异。保留重复及末句的开放性，避免将经文收窄为制度性一致或某一种特定目标。
- issue: σύμψυχοι所表达的合一性质
  choice: 心灵相合
  alternative: 同心合意；有同一个灵
  rationale: “心灵相合”保留ψυχή的内在生命意象，同时不把它明确解释为圣灵，也不把它弱化为一般合作。
translation_notes:
  register: 采用现代、庄重而易懂的书面语。整体保持原文四个平行表达的节奏；以“心思—爱—心灵—思想”呈现合一主题，同时避免生硬直译或将合一解释为绝对意见一致。
