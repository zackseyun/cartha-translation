  text: so that at the name of Jesus every knee should bow[a], of those in heaven and on earth and under the earth[b],
translation:
  language: zh_hans
  text: 使天上的、地上的和地底下的一切都因耶稣的名屈膝[a][b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或按字面译：“在耶稣的名里”。
    reason: lexical_alternative
  - marker: b
    text: 直译：“每一膝……属天者、属地者和属地下者的。”原文以三个实体化形容词指这三类存在者；正文按汉语习惯表达其范围。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: 使
  rationale: 承接上文，表达由前述行动所产生的目的或结果；“使”在现代汉语中简洁自然，同时保留目的—结果色彩。
- source_word: ἐν τῷ ὀνόματι Ἰησοῦ
  choice: 因耶稣的名
  rationale: 在屈膝致敬的语境中，“因……的名”自然表达对耶稣之名及其所代表身份与尊荣的回应；原文介词短语也可理解为“在耶稣的名里”，故加注保留歧义。
- source_word: πᾶν γόνυ
  choice: 一切……都……屈膝
  rationale: “屈膝”保留原文“每一个膝盖弯下”的鲜明身体意象；汉语不直说“一切膝盖”，以免生硬，但“一切……都”仍表达普遍性。
- source_word: κάμψῃ
  choice: 屈膝
  rationale: 原义为弯曲膝盖；“屈膝”在现代汉语中凝练而庄重，并能表达敬拜或臣服的动作。
- source_word: ἐπουρανίων καὶ ἐπιγείων καὶ καταχθονίων
  choice: 天上的、地上的和地底下的一切
  rationale: 以三个领域表达宇宙性的范围，汉语自然通顺；同时用脚注说明原文形式上是三个实体化形容词，避免把具体对象解释得过窄。
theological_decisions:
- issue: ἐπουρανίων、ἐπιγείων、καταχθονίων所指对象的范围
  choice: 保留为“天上的、地上的和地底下的一切”，表达受造界各领域的普遍范围，而不具体点明各类存在者。
  alternative: 明确译作“天使、世人和死人”，或“天使、人和邪灵”。
  rationale: 原文强调向耶稣普遍屈膝，却没有逐一界定三组对象；较宽泛的译法保留其宇宙性和解释空间。
- issue: ἐν τῷ ὀνόματι Ἰησοῦ的关系
  choice: 正文译为“因耶稣的名”，侧重屈膝是对耶稣之名的回应。
  alternative: “在耶稣的名里”，可能侧重名所代表的领域、权柄或关联。
  rationale: 此处与屈膝相连，“因……的名”在汉语中较自然，也不引入“奉……授权行事”的含义；脚注保留较形式对应的译法。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“屈膝”保留原文的身体意象和敬拜、臣服语境；三重并列表达保持整齐，且避免用“阴间”“地狱”等解释性更强的词替代“地底下”。
