  text: ἀλλὰ ἑαυτὸν ἐκένωσεν μορφὴν δούλου λαβών, ἐν ὁμοιώματι ἀνθρώπων γενόμενος· καὶ σχήματι εὑρεθεὶς ὡς ἄνθρωπος
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/007.yaml
  text: but emptied himself[a], taking the form of a slave, becoming in the likeness of men[d][c][b]; and being found in appearance as a man
translation:
  language: zh_hans
  text: 反而倒空了自己[a]，取了奴隶的形态[b]，成为人的样式[c]；在外表上被人看出是人，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “倒空了自己”也可译作“使自己一无所有”。
    reason: lexical_alternative
  - marker: b
    text: “奴隶”也可译作“仆人”；原文指处于主人权下、受役使的人。
    reason: lexical_alternative
  - marker: c
    text: 直译为“在人的样式中成为”。这里的“人”泛指人类；“样式”对应原文用词，不表示他只有人的外貌而没有真实人性。
    reason: source_clarification
lexical_decisions:
- source_word: ἀλλὰ
  choice: 反而
  rationale: 承接上文构成强烈转折；“反而”自然表达不是抓住不放、而是自我降卑的对照。
- source_word: ἑαυτὸν ἐκένωσεν
  choice: 倒空了自己
  rationale: 保留κενόω的核心隐喻，不擅自解释为放弃神性或某些属性；后续分词说明其具体方式。
- source_word: μορφὴν δούλου λαβών
  choice: 取了奴隶的形态
  rationale: “形态”保留μορφή与上文同词的对应；“奴隶”准确传达δοῦλος的受役身份和本句降卑语境中的力度。
- source_word: ἐν ὁμοιώματι ἀνθρώπων γενόμενος
  choice: 成为人的样式
  rationale: “成为”直接对应γενόμενος，“人的”以现代汉语自然表达复数泛指人类，“样式”保留ὁμοίωμα的措辞及其张力。
- source_word: σχήματι εὑρεθεὶς ὡς ἄνθρωπος
  choice: 既显现为人的样子
  rationale: σχῆμα侧重可被辨认的外在样态，因此用“样子”与前面的μορφή“形态”有所区别；“显现为”自然传达εὑρεθείς的被发现、被看出之意。
theological_decisions:
- issue: “倒空自己”（ἑαυτὸν ἐκένωσεν）的基督论含义
  choice: 保留“倒空”隐喻，让后面的“取了……成为……”说明其方式。
  alternative: 译成“使自己一无所有”，或解释为舍弃神性属性。
  rationale: 原文没有说明倒掉了什么；直译隐喻可避免把特定虚己论写入正文，同时保留经文本身的神学张力。
- issue: “成为人的样式”（ἐν ὁμοιώματι ἀνθρώπων）的力度
  choice: 保留“样式”，不把它解释为仅仅貌似为人，也不改写为比原文更直接的本体陈述。
  alternative: 译成“只有人的外表”，或直接扩写为“成为完全真实的人”。
  rationale: ὁμοίωμα的措辞应予保留；它并不必然否认真实人性，而本节下一分句又从可见样态加以补充。
- issue: μορφή与σχῆμα的区分
  choice: 分别译作“形态”和“样子”。
  alternative: 两处都译作“形象”或“形式”。
  rationale: 这样既维持语义联系，又不过度抹平两个希腊词的区别，也不赋予它们未经明说的形而上定义。
translation_notes:
  register: 采用庄重而现代的普通话。用“倒空”保留经文的核心隐喻；用“奴隶”而非较弱的“仆人”体现降卑语境；以“形态—样式—样子”呈现μορφή、ὁμοίωμα、σχῆμα之间相关但不相同的表达。末尾逗号保留本节与第8节句法上的连续性。
