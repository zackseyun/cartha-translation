source:
  edition: SBLGNT
  text: ἀλλὰ εἰ καὶ σπένδομαι ἐπὶ τῇ θυσίᾳ καὶ λειτουργίᾳ τῆς πίστεως ὑμῶν, χαίρω καὶ συγχαίρω πᾶσιν ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/017.yaml
  text: But even if I am being poured out as a drink offering upon the sacrifice and service of your faith[c][b][a], I rejoice and rejoice with all of you.
translation:
  language: zh_hans
  text: 然而，即使我被作为奠酒[a]浇奠在你们信心[c]的祭物和供奉[b]上，我也喜乐，也与你们众人一同喜乐。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我被浇奠”。这里使用的是浇献奠酒的祭祀用语。
    reason: lexical_alternative
  - marker: b
    text: “供奉”也可译作“服事”或“职事”；原文在这里保留了敬拜用语的色彩。
    reason: lexical_alternative
  - marker: c
    text: “信心”也可译作“忠信”。
    reason: alternative_reading
lexical_decisions:
- source_word: σπένδομαι
  choice: 作为奠酒被浇在
  rationale: 该动词指把奠酒浇献出来；译文明确保留献祭隐喻和被动语态，同时让现代读者容易理解。
- source_word: ἐπὶ
  choice: 在……上
  rationale: 与后接与格相配，可表达保罗如奠酒浇在祭物之上；也不排除附加于该祭献的含义。
- source_word: θυσίᾳ
  choice: 祭物
  rationale: 保留标准的献祭用语，并与“奠酒”和“供奉”共同构成敬拜场景。
- source_word: λειτουργίᾳ
  choice: 供奉
  rationale: 上下文献祭色彩浓厚，“供奉”既保留敬拜语境，也比限定为制度性的“祭司职分”更为中性。
- source_word: πίστεως
  choice: 信心
  rationale: 按通常义译作“信心”，同时以较紧凑的属格结构保留它与“祭物和供奉”之间关系的开放性。
- source_word: χαίρω
  choice: 我也喜乐
  rationale: 保留《腓立比书》中反复出现的喜乐主题及现在时陈述。
- source_word: συγχαίρω
  choice: 也与你们众人一同喜乐
  rationale: 直接表达共同喜乐，而不误解为向对方道贺。
- source_word: πᾶσιν ὑμῖν
  choice: 与你们众人
  rationale: 明确保留对整个群体的包容性强调。
theological_decisions:
- issue: 保罗可能受死的献祭意象
  choice: 保罗把自己描写为浇在腓立比人之祭物和供奉上的奠酒。
  alternative: 保罗只说自己的生命与他们的服事一同倾倒，并不强化献祭含义。
  rationale: σπένδομαι、θυσία和λειτουργία集中出现，构成清楚的敬拜与献祭意象，故不宜淡化为一般性的付出或服事。
- issue: “你们的信心”与“祭物和供奉”的关系
  choice: 用“你们信心的祭物和供奉”保留希腊文属格结构的张力。
  alternative: 明确译成“你们凭信心所献的祭物和所作的服事”或“以你们的信心为祭物”。
  rationale: 原文可被理解为源于信心、以信心为内容，或与信心密切相关的祭献与供奉；主文不应无依据地排除其他可能。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。“奠酒、祭物、供奉”有意维持原文连续的献祭语汇；重复“喜乐”则对应χαίρω与συγχαίρω，保留保罗的修辞呼应。
