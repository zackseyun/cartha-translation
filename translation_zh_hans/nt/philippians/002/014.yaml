  text: Do everything without grumbling or arguing[b][a],
translation:
  language: zh_hans
  text: 你们做每一件事，都不要发怨言，也不要争论[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “争论”也可译作“争辩”或“质疑”；这里更可能指带有对抗性的争执。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντα
  choice: 凡事
  rationale: 该中性复数宾格在此作概括性用法，表示一切所做的事；“凡事”简洁、自然，并保留命令的全面范围。
- source_word: ποιεῖτε
  choice: 都要做
  rationale: 现在时主动命令语气表达持续适用的吩咐；汉语用“要做”自然传达命令语气，“都”与“凡事”相应。
- source_word: χωρὶς
  choice: 不……也不……
  rationale: χωρίς加属格表示行为中应当没有某事；拆作汉语并列否定句，比直译“没有”更自然清楚。
- source_word: γογγυσμῶν
  choice: 发怨言
  rationale: γογγυσμός指低声抱怨、发牢骚；“发怨言”庄重而通俗，也保留了该词可能引起的旷野抱怨背景。
- source_word: διαλογισμῶν
  choice: 起争论
  rationale: διαλογισμός可指思量、质疑或争辩；在本劝勉语境中，较可能指带有对抗性的争执。“起争论”保留人际冲突的意味，同时以脚注说明其词义幅度。
theological_decisions:
- issue: διαλογισμῶν是内在疑虑还是外在争辩
  choice: 正文译为“争论”
  alternative: “疑问”“质疑”“争辩”
  rationale: 与复数“怨言”并列且处于群体行为劝勉中，外在争执最符合语境；不过该词本身可涵盖思量或质疑，因此不把其他可能性完全排除，并在脚注中交代。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“凡事”保持经文的概括力度；并列结构“不发……也不起……”读来顺畅。正文仅设一个脚注，并在相应词后标明[a]。
