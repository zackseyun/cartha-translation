  text: τοῦτον μὲν οὖν ἐλπίζω πέμψαι ὡς ἂν ἀφίδω τὰ περὶ ἐμὲ ἐξαυτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/023.yaml
  text: Therefore[a], I hope to send him as soon as I see how things go with me.
translation:
  language: zh_hans
  text: 所以，我希望等我一看清自己的情况，就立刻派他去。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“所以，我希望一看清有关我的事，就马上派他去。”
    reason: 保留τὰ περὶ ἐμέ较为形式对应的译法，并反映ὡς ἂν ἀφίδω也可译作“一看清”。
lexical_decisions:
- source_word: τοῦτον
  choice: 他
  rationale: 该指示代词承接上文的提摩太；现代汉语用“他”最自然，也不会丢失所指。
- source_word: μὲν οὖν
  choice: 所以
  rationale: 表示承接上文并作出推论；“所以”自然体现这里的推导和过渡作用。
- source_word: ἐλπίζω πέμψαι
  choice: 我希望……派他去
  rationale: 保留ἐλπίζω所表达的希望或期待，而不把语气强化为确定的计划。
- source_word: ὡς ἂν ἀφίδω
  choice: 等我一看清
  rationale: 该结构指向尚未确定的将来时间，以保罗弄清事态为条件；“等……一……”兼顾时间性和条件性。
- source_word: ἀφίδω
  choice: 看清
  rationale: 此动词在这里不只是视觉上的“看”，而是看明、弄清事态；“看清”保留其感知意象。
- source_word: τὰ περὶ ἐμέ
  choice: 自己的情况
  rationale: 指保罗本人所面临的事态或处境；“自己的情况”是自然、清楚而不过度具体化的现代汉语。
- source_word: ἐξαυτῆς
  choice: 立刻
  rationale: 明确保留该副词的即时性，使它修饰“派他去”；避免仅以“一……就……”承载全部语义而弱化其强调。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“等我一看清……就立刻……”保留原文将派遣提摩太与保罗自身处境明朗相联系的关系；脚注提供更贴近原文形式的表达。
