  text: λόγον ζωῆς ἐπέχοντες, εἰς καύχημα ἐμοὶ εἰς ἡμέραν Χριστοῦ, ὅτι οὐκ εἰς κενὸν ἔδραμον οὐδὲ εἰς κενὸν ἐκοπίασα.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/016.yaml
  text: holding fast the word of life[a], for a boast to me in the day of Messiah[b], that I did not run in vain or labor in vain.
translation:
  language: zh_hans
  text: 紧紧持守生命之道[a]，使我在弥赛亚的日子[b]可以夸耀：我没有徒然奔跑，也没有徒然劳苦。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“将生命之道呈现出来”或“把生命之道传出来”。
    reason: lexical_alternative
  - marker: b
    text: 传统译法：“基督的日子”。
    reason: alternative_reading
lexical_decisions:
- source_word: λόγον ζωῆς
  choice: 生命之道
  rationale: λόγος既可指“话语”，也可指“信息”；“生命之道”保留了希腊语的凝练表达，也兼顾“赐生命的道”与“关乎生命的信息”两层可能含义。
- source_word: ἐπέχοντες
  choice: 紧紧持守
  rationale: ἐπέχω在此既可能指坚定持守，也可能指向外持出、呈献。上文强调顺服、纯全和坚忍，因此正文采用“紧紧持守”，并在脚注保留向外呈现的可能。
- source_word: καύχημα
  choice: 有所夸耀
  rationale: καύχημα指可引以夸耀之事或夸耀的根据；“有所夸耀”在现代汉语中自然，也表明腓立比信徒将成为保罗正当夸耀的缘由。
- source_word: ἡμέραν Χριστοῦ
  choice: 弥赛亚的日子
  rationale: Χριστοῦ在这一末世性短语中具有称号意味；译作“弥赛亚”保留其受膏君王的称号内涵，传统译法列入脚注。
- source_word: οὐκ εἰς κενὸν
  choice: 没有徒然
  rationale: 该习语表示行动并非空泛无果；“没有徒然”简洁清楚，并保留原文两次重复所形成的平行和强调。
- source_word: ἔδραμον
  choice: 奔跑
  rationale: 保留保罗以赛跑比喻使徒事奉历程与竭力付出的形象。
- source_word: ἐκοπίασα
  choice: 劳苦
  rationale: κοπιάω强调令人疲惫的辛勤劳作；“劳苦”准确传达其强度，并与“奔跑”形成有力并列。
theological_decisions:
- issue: 末世性称号短语中Χριστοῦ的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 在“弥赛亚的日子”这一末世性表达中，Χριστός的称号和君王意味仍然鲜明；正文译作“弥赛亚”，同时以脚注保留教会传统中熟悉的“基督的日子”。
- issue: ἐπέχοντες所表达的是持守还是向外呈献
  choice: 紧紧持守
  alternative: 将生命之道呈现出来／传给人
  rationale: 语境既可支持信徒坚定持守生命之道，也容许他们在世人中将这道呈现出来的宣教性理解。正文依循上文劝勉的脉络采用前者，但不排除后者。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“好让我……有所夸耀”表达εἰς καύχημα ἐμοί的目的或结果关系；“因为”引出ὅτι所说明的夸耀内容。“徒然”重复两次，以保留原文的修辞平行。
