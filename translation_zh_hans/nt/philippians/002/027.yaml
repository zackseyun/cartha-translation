id: PHP.2.27
reference: Philippians 2:27
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ γὰρ ἠσθένησεν παραπλήσιον ⸀θανάτῳ· ἀλλὰ ὁ θεὸς ⸂ἠλέησεν αὐτόν⸃, οὐκ αὐτὸν δὲ μόνον ἀλλὰ καὶ ἐμέ, ἵνα μὴ λύπην ἐπὶ λύπην σχῶ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/027.yaml
  text: For indeed he was sick[a], nearly to death; but God had mercy on him, and not on him only but also on me[b], so that I might not have sorrow upon sorrow.
translation:
  language: zh_hans
  text: 他确实病了，几乎要死[a]；然而，神怜悯了他，不但怜悯了他，也怜悯了我，使我不至于忧上加忧[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“病得濒临死亡”或“病到几乎丧命的地步”。
    reason: lexical_alternative
  - marker: b
    text: 直译：“忧愁加在忧愁之上”，表示接连而来、层层加重的忧伤。
    reason: cultural_note
lexical_decisions:
- source_word: ἠσθένησεν
  choice: 病了
  rationale: 上下文明确指以巴弗提身体患病；“病了”自然简洁，也保留不定过去时所陈述的事实，不泛化为“软弱”。
- source_word: παραπλήσιον θανάτῳ
  choice: 几乎要死
  rationale: 该短语表示非常接近死亡而并未实际死亡；“几乎要死”是现代汉语中清楚自然的表达。
- source_word: ἠλέησεν
  choice: 怜悯了
  rationale: 保留ἐλεάω所含的怜悯与施恩意味，并恰当地表达神是主动施怜悯者。
- source_word: οὐκ αὐτὸν δὲ μόνον ἀλλὰ καὶ ἐμέ
  choice: 不但怜悯了他，也怜悯了我
  rationale: 在汉语中补出承前省略的“怜悯”，使对比清楚，同时保留保罗强调自己也蒙怜悯的意思。
- source_word: ἵνα μὴ
  choice: 使我不至于
  rationale: 自然表达否定目的或所避免的结果，不把两者之间的语义张力过度限定。
- source_word: λύπην ἐπὶ λύπην
  choice: 忧上加忧
  rationale: 保留原文累加、加重的修辞效果，同时采用现代读者容易理解的汉语表达。
- source_word: σχῶ
  choice: 不至于（有）
  rationale: ἔχω在此表示经历或承受忧愁；汉语“使我不至于忧上加忧”自然省略“有”，而完整传达其意义。
theological_decisions:
- issue: 神的怜悯与病者康复之间的关系
  choice: 直译为“神怜悯了他”
  alternative: 明确译为“神医治了他”
  rationale: 原文说神施怜悯，并未直接使用“医治”一词；上下文暗示康复，但正文不把怜悯缩窄为医治，以保留原文的神学广度。
- issue: ἵνα所表达的目的或结果
  choice: 译为“使我不至于”
  alternative: 译为“结果我没有”
  rationale: ἵνα通常带目的色彩，但在此也可体现神怜悯所产生的结果；所选措辞保留这种张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“确实”对应καὶ γάρ的确认与解释语气；“然而”清楚标示转折。“忧上加忧”兼顾原文重复修辞和汉语可读性，并以脚注说明其字面结构。
