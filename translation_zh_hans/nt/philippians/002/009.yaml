  text: διὸ καὶ ὁ θεὸς αὐτὸν ὑπερύψωσεν, καὶ ἐχαρίσατο αὐτῷ ⸀τὸ ὄνομα τὸ ὑπὲρ πᾶν ὄνομα,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/009.yaml
  text: Therefore God also highly exalted him and graciously gave him the name that is above every name[b][a],
translation:
  language: zh_hans
  text: 所以，神也极其高举他，并把那超乎万名之上的名恩赐给他[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恩赐给”也可译作“赐给”或“赏赐给”。
    reason: lexical_alternative
  - marker: b
    text: 这里的“名”不一定只指一个口头称呼，也可能包含身份、地位或称号的含义；本节尚未明确说明具体是哪一个名。
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ καὶ
  choice: 所以……也
  rationale: “所以”保留διό承接上文的推论作用，“也”保留καί的附加语气，并符合现代汉语语序。
- source_word: ὁ θεὸς
  choice: 神
  rationale: 希腊文主语明确且带定冠词；以“神”作标准的现代汉语称谓。
- source_word: ὑπερύψωσεν
  choice: 把他升为至高
  rationale: 表达ὑπερ-所加强的高举含义，同时比生硬的“极其高举”更自然，也保留神主动使他升高的意思。
- source_word: ἐχαρίσατο
  choice: 施恩赐给
  rationale: 既表达“赐给”，又显明该动词与χάρις（恩典、恩惠）相关的恩慈意味；“赐给”本身也可成立，故列入脚注。
- source_word: τὸ ὄνομα
  choice: 那……名
  rationale: 保留原文的“名”，不在正文中径直解释为称号、地位或身份；“那”与后置修饰语配合，体现其特指性。
- source_word: τὸ ὑπὲρ πᾶν ὄνομα
  choice: 那超乎万名之上的名
  rationale: 保留ὑπέρ的“在……之上”关系和πᾶν的普遍范围，以庄重而易懂的现代汉语表达。
theological_decisions:
- issue: “那名”的具体所指
  choice: 正文只译作“名”，不明确指定具体是哪一个名。
  alternative: 明确解释为“耶稣”这名，或以下文的神圣称号“主”为所指。
  rationale: 本节本身尚未明说是哪一个名；保留原文的开放性，避免把第10—11节的一种解释预先写入第9节。
- issue: 基督被高举与获赐“名”的表述
  choice: 依原文保留神施行高举并赐名的叙述。
  alternative: 为避免可能的教义误解而弱化“赐给”或改写为仅仅公开已有身份。
  rationale: 翻译不应消解经文本身关于高举和赐予的神学张力，也不额外规定其与基督先存身份之间的关系。
translation_notes:
  register: 采用现代、庄重且适合普通读者的标准普通话。“升为至高”传达加强动词的力度；“施恩赐给”略带经文体色彩，用以保留χαρίζομαι的恩惠内涵。正文中的脚注标记[a][b]均与脚注对应。
