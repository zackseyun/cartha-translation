  rationale: 修订“升为至高”为“极其高举他”，以准确传达ὑπερύψωσεν的强化高举之意，而不暗示职位任命。将“施恩赐给”调整为较凝练的“恩赐给”，保留ἐχαρίσατο的恩惠意味，并修正脚注a的词类问题。其余内容忠实保留原文的推论与附加关系，以及“那名”所指尚未明说的开放性。
