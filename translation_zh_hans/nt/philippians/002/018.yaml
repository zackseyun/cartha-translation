  text: τὸ δὲ αὐτὸ καὶ ὑμεῖς χαίρετε καὶ συγχαίρετέ μοι.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/018.yaml
  text: In the same way[a], you also rejoice and rejoice with me.
translation:
  language: zh_hans
  text: 同样[a]，你们也要喜乐，并且和我一同喜乐。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“照样”。
    reason: 原文τὸ αὐτό在此为副词性惯用表达，可译作“同样”或“照样”。
lexical_decisions:
- source_word: τὸ δὲ αὐτὸ
  choice: 同样
  rationale: τὸ αὐτό在这里作副词性用法，承接上文保罗的喜乐；“同样”自然简洁，也保留了彼此共享喜乐的衔接关系。δέ主要表示话语推进，在中文中由句首衔接自然体现，不另译为“但是”。
- source_word: χαίρετε
  choice: 要喜乐
  rationale: 这是现在时主动命令语气第二人称复数；“要喜乐”保留劝勉或命令的语气，并呼应《腓立比书》中反复出现的喜乐主题。
- source_word: συγχαίρετέ
  choice: 一同喜乐
  rationale: 该复合动词表达与他人共同欢喜；“一同喜乐”直接传达共同参与喜乐的含义，并与前面的“喜乐”形成原文所有的重复。
- source_word: μοι
  choice: 和我
  rationale: 与συγχαίρω连用的与格指出共同喜乐的对象；“和我”是现代汉语中清楚自然的表达。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“喜乐”保留保罗书信中的关键词及原文两个相关动词的重复；“并且和我一同喜乐”虽有轻微重复，却准确呈现χαίρετε与συγχαίρετέ的修辞联系。
