id: PHP.2.1
reference: Philippians 2:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Εἴ τις οὖν παράκλησις ἐν Χριστῷ, εἴ τι παραμύθιον ἀγάπης, εἴ τις κοινωνία πνεύματος, εἴ τις σπλάγχνα καὶ οἰκτιρμοί,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/001.yaml
  text: So if there is any encouragement in Messiah[a], if any comfort from love, if any fellowship of the Spirit, if any affection and compassion,
translation:
  language: zh_hans
  text: 所以，若在弥赛亚里有任何鼓励，若有任何出于爱的安慰，若有任何圣灵的团契[a]，若有任何深情和怜悯，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“有分于圣灵”；较不可能是：“在心灵里相交”。
    reason: 保留κοινωνία πνεύματος中所有格关系及πνεύματος所指的歧义。
lexical_decisions:
- source_word: οὖν
  choice: 所以
  rationale: 承接上文并表达推论关系，符合现代汉语行文。
- source_word: παράκλησις
  choice: 鼓励
  rationale: 此处侧重给人力量、促成合一的劝慰；“鼓励”既自然，也不把词义限缩为命令式的“劝勉”或单纯情绪性的“安慰”。
- source_word: ἐν Χριστῷ
  choice: 在弥赛亚里
  rationale: 保留介词ἐν的联合领域含义，并将Χριστός按其称号意义译为“弥赛亚”。
- source_word: παραμύθιον
  choice: 安慰
  rationale: 该词指安抚、慰藉的话语或作用；如此可与前面的“鼓励”保持适度区别。
- source_word: ἀγάπης
  choice: 从爱而来
  rationale: 将所有格理解为来源关系，以自然汉语表达由爱产生的安慰，同时不改变基本语义。
- source_word: κοινωνία πνεύματος
  choice: 圣灵的团契
  rationale: κοινωνία含共同有分、相交和团契之意；紧凑的“圣灵的团契”保留了所有格关系本身的开放性，其他可能译法列入脚注。
- source_word: σπλάγχνα
  choice: 深情
  rationale: 原指内脏，惯用义为发自内心的深厚柔情；“深情”避免生硬的身体意象。
- source_word: οἰκτιρμοί
  choice: 怜悯
  rationale: 表达对他人苦况的同情与慈悲，与“深情”并列自然。
theological_decisions:
- issue: πνεύματος是否特指圣灵，以及它与κοινωνία的所有格关系
  choice: 圣灵的团契
  alternative: 有分于圣灵；较不可能：心灵相通
  rationale: 在保罗的基督徒共同体语境中，πνεῦμα较可能指圣灵；但希腊文所有格没有明确限定这是圣灵所产生的团契、与圣灵的相交，还是共同有分于圣灵，因此正文保持紧凑，脚注保留主要解释空间。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。句子保留原文连续四个条件分句及末尾逗号，因为本节在语法和论证上延续至下一节；“团契”是基督徒语境中通行用语，并由脚注帮助普通读者把握其可能含义。
