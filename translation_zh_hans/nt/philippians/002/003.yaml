source:
  edition: SBLGNT
  text: μηδὲν κατ’ ἐριθείαν ⸂μηδὲ κατὰ⸃ κενοδοξίαν, ἀλλὰ τῇ ταπεινοφροσύνῃ ἀλλήλους ἡγούμενοι ὑπερέχοντας ἑαυτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/003.yaml
  text: Do nothing from selfish ambition or empty conceit[a], but in humility regard one another as more important than yourselves[b],
translation:
  language: zh_hans
  text: 不要出于自私的野心或虚荣[a]做任何事；反要以谦卑的心，彼此看对方比自己更重要[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“空洞的自夸”或“虚浮的荣耀”。
    reason: κενοδοξία字面含“空洞的荣耀”之意，可指虚浮的自我夸耀。
  - marker: b
    text: 或译：“彼此看对方胜过自己。”
    reason: ὑπερέχοντας可表示“高于、胜过”；原文的比较所指未作进一步限定。
lexical_decisions:
- source_word: μηδὲν
  choice: 不可
  rationale: 结合后面两个由 κατά 引出的动机，译为“不可出于……”，自然表达劝诫语气，并使“什么事都”在汉语中可由全句否定范围体现。
- source_word: κατ’ ἐριθείαν
  choice: 出于自私的野心
  rationale: ἐριθεία 指自利、争竞性的谋求；“自私的野心”保留其自我图谋和争胜色彩。
- source_word: μηδὲ κατὰ κενοδοξίαν
  choice: 也不可出于虚荣
  rationale: κενοδοξία 字面涉及空洞的荣耀，指没有实质的自我夸耀；“虚荣”简明自然，并保留其空泛性。
- source_word: τῇ ταπεινοφροσύνῃ
  choice: 反要存谦卑的心
  rationale: 该与格表达态度或方式；“存谦卑的心”是自然、庄重的现代汉语，清楚呈现内在心态。
- source_word: ἀλλήλους ἡγούμενοι
  choice: 看别人
  rationale: ἡγέομαι 在此指作出评价、看待；ἀλλήλους 是群体内部彼此相待，汉语“看别人”简洁自然，并与“自己”形成清楚对照。
- source_word: ὑπερέχοντας ἑαυτῶν
  choice: 比自己更重要
  rationale: ὑπερέχω 表示高于、胜过。正文采用关系和实践层面的“更重要”，避免让读者误解为人的本体价值有等级；脚注保留较直译的“胜过自己”。
theological_decisions:
- issue: ὑπερέχοντας 是否表示他人在本质上更优越
  choice: 看别人比自己更重要
  alternative: 看别人胜过自己
  rationale: 经文要求谦卑地评价和对待他人，并不必然断言他人在本体、道德或能力上一概更优越。正文采用自然的关系性表达，脚注保留原文较宽泛的比较含义。
translation_notes:
  register: 采用现代、庄重而易懂的劝勉语体。用“不可……反要……”呈现 μηδὲν…ἀλλά 的鲜明对比；避免过度文言化，也不将比较关系解释为人的本体价值等级。
