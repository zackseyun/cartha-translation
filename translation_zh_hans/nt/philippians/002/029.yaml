  text: προσδέχεσθε οὖν αὐτὸν ἐν κυρίῳ μετὰ πάσης χαρᾶς, καὶ τοὺς τοιούτους ἐντίμους ἔχετε,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/029.yaml
  text: So welcome him in the Lord with all joy[a], and hold people like him in honor.
translation:
  language: zh_hans
  text: 所以，你们要在主里满心喜乐地接待他，也要尊重这样的人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文这里使用阳性复数形式，也可译作“像他这样的男子”。
    reason: 说明 τοὺς τοιούτους 的语法形式；正文采用汉语中自然且可泛指同类人的“这样的人”。
lexical_decisions:
- source_word: προσδέχεσθε
  choice: 接待
  rationale: 这个现在时命令语气要求信徒欢迎以巴弗提；“接待”既表达接纳，也符合迎接来者的具体语境。
- source_word: οὖν
  choice: 所以
  rationale: 自然地保留本句承接前文而得出的推论关系。
- source_word: ἐν κυρίῳ
  choice: 在主里
  rationale: 保留保罗简洁而富有神学内涵的惯用表达，不把它限定解释为“因主的缘故”或“作为属主的人”。
- source_word: μετὰ πάσης χαρᾶς
  choice: 满心喜乐地
  rationale: 以自然的现代汉语传达 πάσης 所强调的充分、完全之喜乐，而不削弱为一般的“高兴地”。
- source_word: τοὺς τοιούτους
  choice: 这样的人
  rationale: 指以巴弗提这一类人；“这样的人”贴近原文的类别指称，也避免在正文中加入原文并未明说的限定。
- source_word: ἐντίμους ἔχετε
  choice: 尊重
  rationale: 原短语意为把这类人视为有尊荣、值得敬重；“尊重”在现代汉语中简洁自然，并包含相应的看重与对待。
theological_decisions:
- issue: “在主里”的关系含义
  choice: 保留“在主里”
  alternative: 把他当作属主的人来接待
  rationale: 原文可涵盖在与主联合的共同关系中接待，也可能带有按着主的心意或因主而接待的意味；直译可保留这种丰富性，不预先锁定单一解释。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。“满心喜乐地”比逐字式的“带着一切喜乐”更自然；“在主里”则有意保留保罗原语的凝练与神学张力。
