id: PHP.2.15
reference: Philippians 2:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἵνα γένησθε ἄμεμπτοι καὶ ἀκέραιοι, τέκνα θεοῦ ⸂ἄμωμα μέσον⸃ γενεᾶς σκολιᾶς καὶ διεστραμμένης, ἐν οἷς φαίνεσθε ὡς φωστῆρες ἐν κόσμῳ
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/015.yaml
  text: so that you may become blameless and pure[a], children of God without blemish in the midst of a crooked and twisted generation[c][b], among whom you shine as lights in the world
translation:
  language: zh_hans
  text: 好使你们成为无可指责、纯洁的人，作上帝无瑕疵的儿女，身处弯曲悖谬的世代之中[b]；你们在他们中间如同明光[c]，在世上照耀[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“显现为明光”。
    reason: lexical_alternative
  - marker: b
    text: “弯曲悖谬的世代”很可能呼应《申命记》32:5，把上帝的儿女与败坏的世代相对照。
    reason: cross_reference
  - marker: c
    text: “明光”或译：“发光体”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: 好使
  rationale: 既自然地承接上文，也保留目的或结果的语气。
- source_word: γένησθε
  choice: 成为
  rationale: 保留γίνομαι所表达的成为、达到某种状态之意，以及劝勉的推进感。
- source_word: ἄμεμπτοι
  choice: 无可指责
  rationale: 准确表达在品行上没有可受责难之处，并与后面的“无瑕疵”有所区别。
- source_word: ἀκέραιοι
  choice: 纯洁
  rationale: 以现代汉语表达未受搀杂、纯正无邪的伦理含义；“纯真无邪”也可，但略显解释性。
- source_word: τέκνα θεοῦ
  choice: 上帝的儿女
  rationale: τέκνα是涵盖男女的“儿女”，不宜窄化为男性的“儿子”。
- source_word: ἄμωμα
  choice: 无瑕疵
  rationale: 保留该词的无斑点、无残缺意象，并避免与前面的ἄμεμπτοι重复译成“无可指责”。
- source_word: μέσον γενεᾶς
  choice: 身处……世代之中
  rationale: 自然表达信徒置身于周围世代之中的空间与群体关系。
- source_word: σκολιᾶς καὶ διεστραμμένης
  choice: 弯曲悖谬
  rationale: 保留两个形容词的强烈伦理评价，也以庄重而可懂的汉语传达可能的经文回响。
- source_word: ἐν οἷς
  choice: 在他们中间
  rationale: 其先行对象在语意上是该世代中的人，因此采用指人的“他们”。
- source_word: φαίνεσθε
  choice: 照耀
  rationale: 与φωστῆρες搭配时，发光、照耀的意义最切合语境；“显现”这一真实可能性收入脚注。
- source_word: φωστῆρες
  choice: 明光
  rationale: 能涵盖发光体或光源的意思，较“星辰”宽泛，也比“发光体”更自然庄重。
- source_word: ἐν κόσμῳ
  choice: 世上的
  rationale: κόσμος在此宜理解为人所处的世界；置于“明光”之前，使汉语流畅，同时不限定为物理宇宙。
theological_decisions:
- issue: “无瑕疵”与“上帝的儿女”的关系，以及申命记32:5的可能回响
  choice: 译作“作上帝无瑕疵的儿女”，让“无瑕疵”直接修饰“儿女”，并在脚注说明可能的旧约回响。
  alternative: 将“无瑕疵”泛指整个劝勉内容，或在正文中更明确地展开申命记的对照。
  rationale: 希腊语词序最自然地让ἄμωμα修饰τέκνα θεοῦ；正文保留伦理与圣约性的张力，但不把可能的互文解释直接写入译文。
- issue: φαίνεσθε应理解为“照耀”还是“显现”
  choice: 正文采用“照耀”。
  alternative: 译作“显现”或“被看见”。
  rationale: 在“如同明光”的直接语境中，“照耀”最为自然，但该动词本身确有“显现”的词义，因此以脚注保留歧义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“无可指责—纯洁—无瑕疵”分别对应三个相关但不完全相同的希腊词，避免把层次压平；分号呈现目的从品格与身份推进到在世界中照耀的结构。
