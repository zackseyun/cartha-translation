  text: πέποιθα δὲ ἐν κυρίῳ ὅτι καὶ αὐτὸς ταχέως ἐλεύσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/024.yaml
  text: I am confident in the Lord that I myself will also come soon.
translation:
  language: zh_hans
  text: 不过，我在主里深信，我自己也很快会来。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πέποιθα
  choice: 深信
  rationale: 完成时表达已经形成并持续存在的坚定信念；“深信”在现代汉语中自然地传达这种稳定、强烈的确信。
- source_word: δὲ
  choice: 不过
  rationale: 作为轻微转折或承接词，联系上文保罗先差遣提摩太的安排与自己也盼望前往的计划；“不过”能自然显示语篇推进，不赋予过强对立。
- source_word: ἐν κυρίῳ
  choice: 在主里
  rationale: 保留保罗书信中常见的表达，既可指信心所在的属灵范围，也可暗示其根据和制约在于主，避免将其窄化为单纯个人把握。
- source_word: ὅτι
  choice: （由宾语分句体现）
  rationale: 希腊语以ὅτι引出所深信的内容；汉语无需另译“即”，直接接宾语分句更自然。
- source_word: καὶ αὐτὸς
  choice: 我自己也
  rationale: “自己”保留αὐτός对保罗本人亲自前往的强调，“也”保留καί的附加意义，与提摩太的前往相呼应。
- source_word: ταχέως
  choice: 很快
  rationale: 此处主要表示时间临近，而非行动速度；“很快”是自然且准确的现代汉语表达。
- source_word: ἐλεύσομαι
  choice: 会来
  rationale: 保留ἔρχομαι面向腓立比收信人的指向视角；“会来”自然表达将来的行动。
- source_word: κυρίῳ
  choice: 主
  rationale: 按保罗语境将κύριος译为“主”，既符合常见的新约称谓，也不引入额外解释。
theological_decisions:
- issue: 保罗的确信与“主”的关系
  choice: 译作“我在主里深信”
  alternative: “我信靠主，深信我自己也很快会来”
  rationale: “在主里”保留ἐν κυρίῳ在属灵范围、根据及对主旨意之依赖等方面的张力，不把它明确收窄为以主作直接宾语，也不暗示保罗所得的是无条件启示。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“我自己也”同时保留原文的人称强调和附加关系；句式简洁，适合经文朗读。
