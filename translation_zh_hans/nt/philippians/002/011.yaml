id: PHP.2.11
reference: Philippians 2:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ πᾶσα γλῶσσα ἐξομολογήσηται ὅτι κύριος Ἰησοῦς Χριστὸς εἰς δόξαν θεοῦ πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/011.yaml
  text: and every tongue should confess that Jesus the Messiah is Lord[b][a], to the glory of God the Father.
translation:
  language: zh_hans
  text: 并且万口都要宣认：耶稣是弥赛亚，是主[a]，使荣耀归于父神。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“耶稣基督是主。”
    reason: 保留 Χριστός 的传统音译，并呈现把“耶稣基督”作为组合称谓的可行译法。
lexical_decisions:
- source_word: πᾶσα γλῶσσα
  choice: 万口
  rationale: 保留“舌头”所表达的口头宣认意象，同时采用现代汉语中自然、庄重的集合性说法，表达人人无不宣认。
- source_word: ἐξομολογήσηται
  choice: 都要宣认
  rationale: “宣认”兼顾公开表达和郑重承认的语义；“要”承接第10节所开始的目的从句及虚拟语气，不把本句误作独立命令。
- source_word: κύριος
  choice: 主
  rationale: “主”是 κύριος 在此基督论宣认中的标准译法，也保留其与旧约经文所述普世臣服的呼应。
- source_word: Ἰησοῦς Χριστός
  choice: 耶稣是弥赛亚
  rationale: 把 Χριστός 作为称号译为“弥赛亚”，而非仅作姓名的一部分；补出汉语系词，使“弥赛亚”和“主”两个称谓的关系清楚自然。
- source_word: εἰς δόξαν
  choice: 使荣耀归于
  rationale: 表达 εἰς 的趋向或结果意味，同时避免过度限定究竟是目的还是结果。
- source_word: θεοῦ πατρός
  choice: 父神
  rationale: 这是 θεοῦ πατρός 简洁、自然且为现代中文读者熟悉的表达。
theological_decisions:
- issue: Χριστός 在宣认句中是称号还是固定姓名成分
  choice: 耶稣是弥赛亚，是主
  alternative: 耶稣基督是主
  rationale: 原文虽无冠词，但 Χριστός 在此仍带有称号意义；译作“弥赛亚”显明其受膏者称号。中文补出“是”属于句法调整，并未增加原文之外的身份断言，因为后面的 κύριος 本身就是谓语性宣认。传统译名“基督”列入脚注。
- issue: εἰς δόξαν 表示目的还是结果
  choice: 使荣耀归于父神
  alternative: 为荣耀父神
  rationale: “使荣耀归于”能保留目的与结果之间的张力，不把介词短语仅仅限定为人的主观目的。
translation_notes:
  register: 采用现代、庄重而便于诵读的汉语。“万口”保留原文身体意象而避免生硬的“每条舌头”；冒号突出随后的核心宣认。经文作为第10节目的结构的延续，以“并且……都要”起句。
