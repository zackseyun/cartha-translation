id: PHP.2.19
reference: Philippians 2:19
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ἐλπίζω δὲ ἐν κυρίῳ Ἰησοῦ Τιμόθεον ταχέως πέμψαι ὑμῖν, ἵνα κἀγὼ εὐψυχῶ γνοὺς τὰ περὶ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/019.yaml
  text: But I hope in the Lord Jesus to send Timothy to you soon[a], so that I too may be encouraged when I learn the things concerning you.
translation:
  language: zh_hans
  text: 但我靠着主耶稣[a]，盼望很快差提摩太到你们那里去，好让我得知你们的情况，也能振作起来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“在主耶稣里”。
    reason: 保留ἐν的形式表达及其可能包含的关系、领域或依靠意味。
lexical_decisions:
- source_word: Ἐλπίζω
  choice: 盼望
  rationale: 表达保罗当前怀有的希望和期待；“盼望”在现代汉语中自然，也不把语气强化为确定的预期。
- source_word: δὲ
  choice: 但
  rationale: 承接上文并标示轻微转折；“但”简洁地保留了这一篇章作用。
- source_word: ἐν κυρίῳ Ἰησοῦ
  choice: 靠着主耶稣
  rationale: 在现代汉语中自然表达保罗的盼望以主耶稣为依托；脚注保留“在主耶稣里”这一较形式对应、且可能带有关系或领域意味的译法。
- source_word: Τιμόθεον
  choice: 提摩太
  rationale: 采用中文圣经传统中通行的人名音译。
- source_word: ταχέως
  choice: 很快
  rationale: 这里主要表示预期发生的时间临近，而不是动作速度快；“很快”符合语境。
- source_word: πέμψαι ὑμῖν
  choice: 差提摩太到你们那里去
  rationale: “差……去”准确表达派遣之意；“到你们那里”自然呈现与格所指的目的地。
- source_word: ἵνα
  choice: 好让
  rationale: 清楚而自然地标示目的。
- source_word: κἀγὼ
  choice: 我……也
  rationale: 保留καί与ἐγώ合成形式所含的附加和强调意味，即保罗本人也能因此振作。
- source_word: εὐψυχῶ
  choice: 能振作起来
  rationale: 该动词指心情好转、精神振奋；“振作起来”比笼统的“得鼓励”更贴近其情绪意义。
- source_word: γνοὺς
  choice: 得知
  rationale: 以目的从句中的自然汉语表达这个不定过去时分词所指的先行情形：得知消息之后便振作。
- source_word: τὰ περὶ ὑμῶν
  choice: 你们的情况
  rationale: 这是现代汉语对“有关你们的事”最自然的概括，同时不限定具体是健康、属灵状况或教会事务。
theological_decisions:
- issue: ἐν κυρίῳ Ἰησοῦ中ἐν的关系和神学意味
  choice: 正文译作“靠着主耶稣”，脚注列出“在主耶稣里”
  alternative: 在主耶稣里
  rationale: “靠着”使现代读者自然理解保罗的计划和盼望受主支配、以主为依托；“在……里”可能更宽泛地指联合、关系或行动领域，因此以脚注保留，不把含义完全锁定为工具性。
- issue: κύριος用于耶稣的称号
  choice: 主
  alternative: 主人
  rationale: “主”是新约基督论语境中κύριος庄重、通行且准确的汉语称号；“主人”在此会不恰当地收窄其称号意义。
translation_notes:
  register: 采用现代、庄重而口语可懂的书面汉语。“差……去”保留使徒书信的派遣语气；“得知你们的情况”自然表达原文较宽泛的τὰ περὶ ὑμῶν，不擅自限定具体内容。
