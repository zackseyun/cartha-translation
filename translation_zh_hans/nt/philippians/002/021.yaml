  text: οἱ πάντες γὰρ τὰ ἑαυτῶν ζητοῦσιν, οὐ τὰ ⸂Ἰησοῦ Χριστοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/021.yaml
  text: For they all seek their own interests[a], not those of Jesus the Messiah.
translation:
  language: zh_hans
  text: 因为他们都只顾自己的事，不顾耶稣基督[a]的事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“耶稣弥赛亚”。
    reason: 保留Χριστός作为称号的另一种通行表达。
lexical_decisions:
- source_word: οἱ πάντες
  choice: 众人都
  rationale: 带冠词的复数形式作名词使用，指上下文中所说的所有人；“众人都”保留其整体强调，又不额外加入原文没有明说的“其他”。
- source_word: γὰρ
  choice: 因为
  rationale: γάρ说明前一句的理由；“因为”在现代汉语中自然地表达这一解释关系。
- source_word: τὰ ἑαυτῶν
  choice: 自己的事
  rationale: 中性复数惯用语泛指属于自己、关乎自身的事情或利益；“自己的事”既宽泛，又能在语境中显出自我中心的对比。
- source_word: ζητοῦσιν
  choice: 只顾……不顾……
  rationale: ζητέω在此不是字面寻找，而是以某事为追求和关注；汉语“只顾……不顾……”自然传达两个并列分句中的强烈道德对比。
- source_word: τὰ Ἰησοῦ Χριστοῦ
  choice: 耶稣基督的事
  rationale: 中性复数冠词承接前面的“事”，指属于或关乎耶稣基督的事；明说“的事”比在汉语中省略更清楚。Χριστός采用现代汉语基督教语境中通行的“基督”。
theological_decisions:
- issue: Ἰησοῦ Χριστοῦ中Χριστοῦ的译法
  choice: 耶稣基督
  alternative: 耶稣弥赛亚
  rationale: “基督”是现代汉语对Χριστός最通行且庄重的译法，也保留其称号性质；“弥赛亚”更直接显明“受膏者”称号，故列入脚注，不把两者之间的表达差异强行消除。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“只顾……不顾……”避免生硬重复“寻求”，同时保留原文对“自己的事”和“耶稣基督的事”的鲜明对照。
