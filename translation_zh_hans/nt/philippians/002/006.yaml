  text: ὃς ἐν μορφῇ θεοῦ ὑπάρχων οὐχ ἁρπαγμὸν ἡγήσατο τὸ εἶναι ἴσα θεῷ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/006.yaml
  text: who[a], though he was in the form of God, did not consider equality with God something to be grasped[c][b],
translation:
  language: zh_hans
  text: 他虽具有上帝的形像[a]，却不认为与上帝同等[c]是可攫取的东西[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他具有上帝的形像。”ὑπάρχων可理解为让步关系（“虽具有”），也可只作状态陈述。
    reason: lexical_alternative
  - marker: b
    text: “可攫取的东西”也可理解为“可夺取的东西”、“应紧抓不放的东西”，或“可利用来为自己谋利的东西”。原词ἁρπαγμός的确切含义有争议。
    reason: alternative_reading
  - marker: c
    text: 直译：“与上帝同等。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν μορφῇ θεοῦ
  choice: 以上帝的形态存在
  rationale: 将 μορφή 译为“形态”，保留希腊文的表达及其基督论分量，不以“本质”之类较窄的后期形上术语替代原文。
- source_word: ὑπάρχων
  choice: 虽……存在
  rationale: 在本句与第7节的对比中按让步关系处理，使基督原有状态与随后自我倒空之间的转折清楚；其纯状态性读法另见脚注。
- source_word: ἁρπαγμὸν
  choice: 可攫取之物
  rationale: “攫取”直接保留该词与抓取、夺取有关的意象，同时避免在正文中完全锁定为“利用来谋利”或“紧抓不放”；这些语境上可行的理解收入脚注。
- source_word: ἡγήσατο
  choice: 认为
  rationale: 自然对应“看作、认定、认为”，符合现代汉语表达。
- source_word: τὸ εἶναι ἴσα θεῷ
  choice: 与上帝同等
  rationale: 以自然汉语表达该冠词化不定式结构；脚注保留其较直译的“成为与上帝同等”。
theological_decisions:
- issue: ἐν μορφῇ θεοῦ 的基督论含义
  choice: 正文保留“以上帝的形态存在”
  alternative: 具有上帝的本质；本质上是上帝
  rationale: 原文具有鲜明而崇高的基督论含义，但翻译不应以较后期的教义术语取代保罗所用的 μορφή，也不应削弱其分量。
- issue: ἁρπαγμός 与基督同上帝平等的关系
  choice: 正文译为“可攫取之物”，保留抓取意象
  alternative: 可利用来为自己谋利的东西；应紧抓不放的东西；可夺取之物
  rationale: 该词既可被理解为获取或抓住之物，也可能在上下文中指不拿来谋取自身利益的优势。正文采用较少解释性的表达，脚注呈现真实存在的释义分歧。
- issue: ὑπάρχων 的逻辑关系
  choice: 按让步关系译为“虽……存在”
  alternative: 只作状态陈述：“他以上帝的形态存在”
  rationale: 第6至7节的论述转折支持让步理解，但分词本身并未明示“虽然”，故在脚注保留状态性译法。
translation_notes:
  register: 采用现代、庄重而可读的汉语。“形态”保留原文术语，“攫取”略带书面色彩，但能简洁保留抓取、夺取的意象。逗号保留本节与下一节在原句中的连续关系。
