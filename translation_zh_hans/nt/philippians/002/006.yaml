  naturalness: “以上帝的形态存在”较生硬，也容易引起不必要的误解。改为“虽具有上帝的形像”较符合庄重、现代的圣经汉语。将“可攫取之物”改为“可攫取的东西”也更自然，同时不预断该争议词的意义。
  terminology: “上帝”用语一致。“形像”是汉语圣经传统中可理解且庄重的对应语；它比“形态”更适合此处的μορφή，同时避免把原文直接替换为“本质”。“与上帝同等”准确表达ἴσα θεῷ；脚注应避免加入“成为”。
