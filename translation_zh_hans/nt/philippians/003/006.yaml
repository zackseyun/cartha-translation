  text: κατὰ ⸀ζῆλος διώκων τὴν ἐκκλησίαν, κατὰ δικαιοσύνην τὴν ἐν νόμῳ γενόμενος ἄμεμπτος.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/006.yaml
  text: as to zeal[a], persecuting the church; as to righteousness under the law[b], having become blameless.
translation:
  language: zh_hans
  text: 就热心来说，我曾逼迫教会；就律法上的义来说，我成了无可指责的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “无可指责”是就“律法上的义”这一方面说的，并非宣称在神面前绝对无罪。
    reason: theological_clarification
lexical_decisions:
- source_word: κατὰ
  choice: 就……来说
  rationale: κατά在两处引出衡量保罗往昔资历的方面；重复译为“就……来说”，既保留平行结构，也符合现代汉语表达。
- source_word: ζῆλος
  choice: 热心
  rationale: ζῆλος在这里指强烈的宗教热忱；“热心”自然通顺，也能与随后逼迫教会的行动形成张力。
- source_word: διώκων
  choice: 曾逼迫
  rationale: 上下文明确指敌对地迫害基督徒群体，故译“逼迫”而非一般的“追赶”；“曾”点明这是保罗所回顾的往昔行为。
- source_word: τὴν ἐκκλησίαν
  choice: 教会
  rationale: 此处指基督徒群体；“教会”是现代汉语中清楚、通行的对应词。
- source_word: δικαιοσύνην
  choice: 义
  rationale: “义”能涵盖按律法标准而有的正直或合宜地位，并保留保罗书信中δικαιοσύνη的神学关联；此处不宜窄化为现代社会意义的“正义”。
- source_word: τὴν ἐν νόμῳ
  choice: 律法中的
  rationale: 直译并保留ἐν所表达的领域或范围，避免把它完全解释为“靠遵行律法而得的”，从而保留原文的开放度。
- source_word: γενόμενος
  choice: 成了
  rationale: 保留γίνομαι分词的动态意味，而不将其仅仅平化为静态的“是”。
- source_word: ἄμεμπτος
  choice: 无可指责的人
  rationale: 表示在刚刚限定的律法评价范围内没有可受责难之处；“无可指责”不必然暗示绝对无罪。
theological_decisions:
- issue: 保罗所称“无可指责”的范围
  choice: 将其限定在“律法中的义”这一评价范围内
  alternative: 理解为保罗宣称自己在神面前绝对无罪，或把整句话视为纯粹反讽
  rationale: 语法上，ἄμεμπτος与“律法中的义”紧密相连；经文是在列举保罗从前可夸的宗教资历，并未作不受限定的无罪宣称。
translation_notes:
  register: 采用现代、庄重而易懂的汉语，并以两次“就……来说”再现原文κατά的平行修辞。用“律法中的义”保留原文ἐν νόμῳ的表达和一定程度的语义开放性。
