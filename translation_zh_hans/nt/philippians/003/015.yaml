id: PHP.3.15
reference: Philippians 3:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὅσοι οὖν τέλειοι, τοῦτο φρονῶμεν· καὶ εἴ τι ἑτέρως φρονεῖτε, καὶ τοῦτο ὁ θεὸς ὑμῖν ἀποκαλύψει·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/015.yaml
  text: Therefore[a], all of us who are mature should think this way; and if you think differently about anything[b], God will reveal this also to you.
translation:
  language: zh_hans
  text: 所以，我们中间凡是成熟[a]的人，都应当这样想；如果你们在任何事上有不同的想法，神也会把这事启示给你们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “成熟”或译“完全”。希腊语τέλειοι可以指完全，也可以指已经长成、成熟；结合上文，这里更可能是指属灵上的成熟。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: 所以
  rationale: 承接上文并引出推论；“所以”自然地表达保罗的逻辑过渡。
- source_word: ὅσοι
  choice: 我们中间凡是……的人
  rationale: 表达所指群体的完整范围，也保留保罗将自己包括在内的语气。
- source_word: τέλειοι
  choice: 成熟
  rationale: 结合前文保罗承认自己尚未达到完全、仍在竭力追求，这里主要指属灵上成熟；脚注保留“完全”这一直接词义及经文张力。
- source_word: τοῦτο φρονῶμεν
  choice: 都应当这样想
  rationale: τοῦτο回指上文所述的心态，φρονῶμεν是劝勉性虚拟语气；译文同时传达思想取向和劝勉语气。
- source_word: εἴ τι ἑτέρως φρονεῖτε
  choice: 如果你们在任何事上有不同的想法
  rationale: 保留条件句、τι所表达的不限定范围，以及ἑτέρως所指的思想差异。
- source_word: καὶ τοῦτο
  choice: 也会把这事
  rationale: “也”保留καί的附加意味，“这事”指他们看法有异之处或对此应有的认识，不进一步限定。
- source_word: ἀποκαλύψει
  choice: 会……启示
  rationale: 直接保留神主动使人明白的启示性用语及其神学意味。
theological_decisions:
- issue: τέλειοι是指“成熟”还是“完全”
  choice: 正文译作“成熟”，脚注注明“完全”
  alternative: 正文译作“完全”
  rationale: 紧接3:12，保罗刚说明自己尚未成为完全，因此这里宜理解为达到成熟地步的人，而不是已经毫无缺欠的人；同时脚注保留该词的字面可能性，避免消除保罗有意形成的张力。
- issue: 神将启示的内容
  choice: 译作“把这事启示给你们”，保留指代的开放性
  alternative: 明确解释为“使你们接受保罗的观点”
  rationale: 原文τοῦτο的具体所指并未完全展开；译文不把神的启示具体化为某种未经明说的教义结论。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“这样想”和“有不同的想法”前后照应φρονέω词族；避免较生硬的“存这样的心”及可能带有特定传统色彩的术语。
