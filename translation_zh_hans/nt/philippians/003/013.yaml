  text: ἀδελφοί, ἐγὼ ἐμαυτὸν ⸀οὐ λογίζομαι κατειληφέναι· ἓν δέ, τὰ μὲν ὀπίσω ἐπιλανθανόμενος τοῖς δὲ ἔμπροσθεν ἐπεκτεινόμενος,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/013.yaml
  text: 'Brothers[a], I do not consider myself to have taken hold of it. But one thing: forgetting the things behind and reaching forward to the things ahead,'
translation:
  language: zh_hans
  text: 弟兄们[a]，我不认为自己已经得着了。不过只有一件事：忘记背后的，向着前面的伸展，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄们”译自希腊语阳性呼格 adelphoi；保罗常用这个称呼指整个信徒群体，其中也包括女性。
    reason: cultural_note
lexical_decisions:
- source_word: ἀδελφοί
  choice: 弟兄们
  rationale: 保留希腊语阳性呼格的形式；保罗常以此称呼包括女性在内的整个信徒群体，因此用脚注说明其涵盖范围。
- source_word: λογίζομαι
  choice: 认为
  rationale: 自然、现代地表达说话者对自己的判断或评估。
- source_word: κατειληφέναι
  choice: 已经得着了
  rationale: 承接第12节中“得着”的重复用语，保留抓住、取得的意象；原文宾语省略，中文也不补明，以保留其含混性。
- source_word: ἓν δέ
  choice: 不过只有一件事
  rationale: 保留原文省略谓语的突兀表达，不补入“我做”。
- source_word: τὰ μὲν ὀπίσω
  choice: 背后的
  rationale: 以名词化的“背后的”表达复数中性结构，并与“前面的”形成平衡对照。
- source_word: ἐπιλανθανόμενος
  choice: 忘记
  rationale: 采用该词直接的词义，不将其解释性改写为“撇下”或“置之不理”。
- source_word: τοῖς δὲ ἔμπροσθεν
  choice: 前面的
  rationale: 与“背后的”构成清楚、简洁的空间对照，并保留开放的指涉。
- source_word: ἐπεκτεινόμενος
  choice: 努力伸向
  rationale: 表达身体向前伸展的动态意象；“努力”传达该复合动词所呈现的用力前伸，而不把比喻具体化。
theological_decisions:
- issue: κατειληφέναι所省略宾语的指涉
  choice: 不补出明确宾语，仅译“已经得着了”
  alternative: 补作“已经得着这一切”或“已经达到目标”
  rationale: 希腊文此处未明说宾语，其含义须由第12节及上下文领会；不具体补足可避免过早限定为某一神学概念。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句法保留原文“不过只有一件事”之后省略谓语的 abrupt 转折，并以两个并列分词短语维持未完句式，因为本节在下一节继续。
