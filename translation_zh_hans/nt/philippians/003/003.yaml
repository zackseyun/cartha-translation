id: PHP.3.3
reference: Philippians 3:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἡμεῖς γάρ ἐσμεν ἡ περιτομή, οἱ πνεύματι θεοῦ λατρεύοντες καὶ καυχώμενοι ἐν Χριστῷ Ἰησοῦ καὶ οὐκ ἐν σαρκὶ πεποιθότες,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/003.yaml
  text: For we are the circumcision[a], who worship by the Spirit of God and boast in Messiah Jesus and put no confidence in the flesh[c][b],
translation:
  language: zh_hans
  text: 因为受割礼的其实是我们：我们靠上帝的灵敬拜[a]，以弥赛亚[b]耶稣为夸耀，并不倚靠肉体[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有异文作“以灵敬拜上帝”。
    reason: textual_variant
  - marker: b
    text: “弥赛亚”译自希腊语头衔Christos，传统上也译作“基督”。
    reason: lexical_alternative
  - marker: c
    text: 这里的“肉体”主要指人可倚靠的身体条件或属人凭据，例如割礼、血统、身份和宗教成就。
    reason: cultural_note
lexical_decisions:
- source_word: περιτομή
  choice: 受割礼的
  rationale: 保留“割礼”这一具体的盟约用语，同时用现代汉语中自然的名词化表达指受割礼的群体；“其实”传达保罗以“我们”重新界定真正割礼群体的强调语气。
- source_word: πνεύματι θεοῦ
  choice: 靠上帝的灵
  rationale: 按SBLGNT正文，θεοῦ最自然地修饰πνεύματι，指上帝的灵；“靠”清楚表达圣灵作为敬拜的能力来源，也不排除其作为敬拜领域的意味。
- source_word: λατρεύοντες
  choice: 敬拜
  rationale: 该词在此指向上帝献上的宗教性事奉；“敬拜”简明自然，并保留其神圣礼仪和事奉色彩。
- source_word: καυχώμενοι
  choice: 以……为夸耀
  rationale: 保留“夸耀”的鲜明修辞力度，并与下文不倚靠肉体形成对照，避免较弱的“喜乐”或“引以为荣”。
- source_word: Χριστῷ Ἰησοῦ
  choice: 弥赛亚耶稣
  rationale: 将Χριστός作为仍有语义作用的头衔译为“弥赛亚”，同时保持希腊文中头衔在前、名字在后的次序。
- source_word: σαρκί
  choice: 肉体
  rationale: 保留σάρξ的字面—比喻双重张力；上下文表明它尤其涉及割礼、血统、身份和成就等属于身体及人的凭据，而不只是“罪性”。
- source_word: πεποιθότες
  choice: 丝毫不倚靠
  rationale: “倚靠”自然表达把信心寄托于某种凭据；“丝毫不”传达οὐκ的明确否定，而完成时分词所含的稳定依赖状态由整体表述体现。
- source_word: γάρ
  choice: 因为
  rationale: 保留本句对上一节警告所作的解释性连接。
theological_decisions:
- issue: 本节中σάρξ（肉体）的含义
  choice: 保留“肉体”，主要指身体条件及人的宗教身份、资历和成就等可供倚靠的凭据
  alternative: 译作“罪性”，指内在的道德败坏原则
  rationale: 腓立比书3章紧接着列举割礼、族裔、律法身份和宗教表现，因此此处首先是人的外在及属人凭据；保留“肉体”也避免排除该词可能具有的更广泛神学张力。
- issue: πνεύματι θεοῦ的所指及功能
  choice: 指上帝的灵，作为敬拜的能力来源，也可含敬拜所在领域之意
  alternative: 指人的灵，或泛指以属灵方式敬拜上帝
  rationale: SBLGNT正文的θεοῦ使“上帝的灵”成为最自然的理解；工具格和领域义在此不必被强行二选一，中文“靠”突出主要意义，脚注交代异文。
- issue: “受割礼的”所指
  choice: 保罗以这一称谓指由圣灵敬拜、以弥赛亚耶稣夸耀且不倚靠肉体的群体
  alternative: 仅指身体上接受割礼的犹太人
  rationale: 三个分词短语共同界定“我们”，显示保罗正在反讽性地重新界定真正具有割礼身份的人，但译文不进一步引入某一宗派的盟约体系。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“受割礼的其实是我们”兼顾希腊文系词句的强调和汉语可读性；三个并列短语保持原文修辞结构。“夸耀”“肉体”等关键术语予以保留，以免消解原文的神学张力。
