  yaml_path: translation/nt/philippians/003/016.yaml
  text: Only[a], let us keep in step with what we have attained.
translation:
  language: zh_hans
  text: 不过，我们已经达到什么程度，就该按这程度而行。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“只要按同一准则而行”或“持守同一标准”。原文没有明说“准则”或“标准”。
    reason: 原文的τῷ αὐτῷ未明示所指的名词；这些译法补出了“准则”或“标准”，可作为解释性的替代译法。
lexical_decisions:
- source_word: πλήν
  choice: 不过
  rationale: 此处用作带有限定和转折意味的衔接语；“不过”自然地承接上文，也保留保罗把重点收束到当前责任上的语气。
- source_word: εἰς ὃ
  choice: 哪一步
  rationale: 该短语指已经到达的阶段或程度。结合前后文的进展意象，译作“哪一步”比抽象的“什么程度”更自然，也便于与“继续前行”呼应。
- source_word: ἐφθάσαμεν
  choice: 已经达到
  rationale: 表示到达了某个阶段；“已经达到”既表达过去取得的进展，也凸显这一进展对当前生活仍有约束力。
- source_word: τῷ αὐτῷ
  choice: 照着这一步
  rationale: 希腊文用中性单数“同一者”而未明说“准则”或“标准”。这里回指已达到的阶段，以“照着这一步”表达其隐含关系，同时避免在正文中增添原文没有的名词。
- source_word: στοιχεῖν
  choice: 继续前行
  rationale: 该词本有列队、循序而行或按准则行事之意。“继续前行”保留行走意象，并在本句中自然表达生活应与已经达到的阶段相称。
theological_decisions:
- issue: 是否在τῷ αὐτῷ处补出“准则”或“标准”
  choice: 正文不补出明确名词，而译为“照着这一步继续前行”
  alternative: “照着同一准则前行”或“持守同一标准”
  rationale: SBLGNT所据的较短文本没有“准则”一词。正文保留这种含蓄性，避免受较长异文或传统译法影响而过度明确；脚注列出可表达其语义的其他译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“达到哪一步……照着这一步继续前行”保留原文关于进展与行走的意象，避免生硬直译，也不补入较短希腊文本未明说的“准则”。
