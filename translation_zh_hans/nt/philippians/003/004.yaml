id: PHP.3.4
reference: Philippians 3:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καίπερ ἐγὼ ἔχων πεποίθησιν καὶ ἐν σαρκί. Εἴ τις δοκεῖ ἄλλος πεποιθέναι ἐν σαρκί, ἐγὼ μᾶλλον·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/004.yaml
  text: Though I myself have confidence even in the flesh. If anyone else thinks he has confidence in the flesh[a], I have more.
translation:
  language: zh_hans
  text: 尽管如此，我自己也有凭肉体自信的理由。若有人以为自己可以凭肉体自信，我更有理由这样自信。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “凭肉体自信”也可理解为“凭人的资历”或“凭外在身份自信”。希腊文直译为“在肉体中有信心／把握”。这里的“肉体”在本段主要指人的出身、身份和外在条件。
    reason: 说明σάρξ在本段中的语境含义，同时保留正文的源语意象。
lexical_decisions:
- source_word: καίπερ
  choice: 其实……也
  rationale: 原词引出让步。鉴于本节承接上文“我们不倚靠肉体”，用“其实……也”自然表达：尽管保罗否定这种倚靠，他本人并非没有相应资本。
- source_word: ἐγὼ ἔχων πεποίθησιν
  choice: 我自己也有理由倚靠
  rationale: 保留第一人称的强调，并将名词“信心、把握”按此处语境自然表达为“有理由倚靠”，避免生硬的“有信心在……里”。
- source_word: ἐν σαρκί
  choice: 倚靠肉体
  rationale: 保留σάρξ的源语意象及其神学张力；上下文表明这里指以人的身份、出身和外在资历为倚靠，而非专指“罪性”。
- source_word: δοκεῖ
  choice: 自以为
  rationale: 表达某人认为自己具备这种资格或理由；“自以为”符合比较挑战的语气，但不必然断言其判断错误。
- source_word: πεποιθέναι
  choice: 可以倚靠
  rationale: 结合ἐν σαρκί表达一种已确立的信赖或把握；汉语用“可以倚靠”自然呈现其拥有根据之意。
- source_word: μᾶλλον
  choice: 更可以
  rationale: 简洁保留比较意味，并与前句“可以倚靠”形成自然照应。
theological_decisions:
- issue: 腓立比书3:4中σάρξ的含义
  choice: 正文保留“肉体”，脚注说明这里所指的人的资历和外在身份。
  alternative: 直接译为“人的资历”或“外在身份”；或误解为“罪性”。
  rationale: 随后3:5–6列举割礼、族裔、律法身份和热心，显示这里主要是人的出身、宗教身份与成就。保留“肉体”可维持保罗原有措辞及其与上下文的联系，同时以脚注澄清。
- issue: καίπερ让步关系的呈现
  choice: 译作“其实，我自己也……”，让其承接上一节并隐含让步。
  alternative: 译作“虽然我自己也……”；若独立成节，可能形成未完成的汉语从句。
  rationale: 希腊文分词结构具有让步性，但本节在汉语中也需能自然独立朗读；“其实……也”既回应上文，也保留“我并非没有这些条件”的反转意味。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“倚靠肉体”保留保罗的核心措辞；“我更可以”简明呈现其强烈的比较性断言。
