id: PHP.3.12
reference: Philippians 3:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Οὐχ ὅτι ἤδη ἔλαβον ἢ ἤδη τετελείωμαι, διώκω δὲ εἰ καὶ καταλάβω, ἐφ’ ᾧ καὶ κατελήμφθην ὑπὸ ⸀Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/012.yaml
  text: Not that I have already received it or have already been perfected[c][b][a], but I press on to see if I may also take hold of that for which I too was taken hold of by Christ.
translation:
  language: zh_hans
  text: 这不是说我已经得着了[a]，或已经被成全[b]；我乃是竭力追求，看看是否也能得着基督[c]抓住我时所要我得着的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“已经取得了”；原文没有明说宾语，须由上下文理解。
    reason: lexical_alternative
  - marker: b
    text: 或译“已经成为完全的人”或“已经达到完全”。
    reason: lexical_alternative
  - marker: c
    text: 希腊文Christos，意为“受膏者”；也可译作“弥赛亚”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλαβον
  choice: 已经得到了
  rationale: 原文未明说宾语，所指须由上下文补足。中文保留宾语隐含的表达，以免过度限定其具体所指；“得到”可涵盖取得、获得或达到目标。
- source_word: τετελείωμαι
  choice: 已经达到完全
  rationale: 该词为完成时被动形式，表达进入并处于完成状态。中文“达到完全”自然地传达尚未臻于完成的意思，同时不把经文强行纳入后来的“无罪完全”教义框架。
- source_word: διώκω
  choice: 竭力追求
  rationale: διώκω在此表示持续追赶目标；“竭力追求”既保留其主动而迫切的力度，也符合现代汉语。
- source_word: εἰ καὶ καταλάβω
  choice: 或者可以得着
  rationale: εἰ καί在此表达带有期待的未定目标，可译为“或者可以”。“得着”与后面的被动式“得着我”形成刻意的词语呼应。
- source_word: ἐφ’ ᾧ
  choice: 所要我得着的
  rationale: 此短语存在目的性与因果性两种解释；正文采用目的性理解，即基督得着保罗是为了一个目标，并以中文关系结构自然表达。
- source_word: κατελήμφθην
  choice: 得着我
  rationale: 被动式表示保罗先被基督抓住、取得；“得着我”保留被动含义，并与前面的“得着”重现同根动词的修辞联系。
- source_word: Χριστοῦ
  choice: 基督耶稣
  rationale: 按SBLGNT此处正文为Χριστοῦ；“基督”是现代中文圣经语域中通行的称谓。抄本存在加入“耶稣”的重要异文，正文依通常较完整的保罗称谓呈现，并在脚注注明文本差异。
theological_decisions:
- issue: τετελείωμαι是否意味着后世教义所说的无罪完全
  choice: 达到完全
  alternative: 已经成为完全的人／已经被成全
  rationale: 原文否认保罗已经处于完成状态，却没有界定某一后世神学体系中的“完全”。译文保留完成状态的张力，不作额外教义判断。
- issue: ἐφ’ ᾧ表示目的还是原因
  choice: 基督得着我是要我得着某个目标
  alternative: 因为我也已经被基督得着
  rationale: 介词结构可有目的或因果色彩。正文采用在上下文中较连贯的目的性理解，但不把隐含目标具体化，以保留原文开放性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“竭力追求……得着……得着我”尽量重现原文追赶和抓住的动态意象及同根词呼应。句首用“这并不是说”承接上文；不补出ἔλαβον的具体宾语，以保存原文含混。
