base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/005.yaml
  text: circumcised on the eighth day, from the people of Israel, of the tribe of Benjamin, a Hebrew from Hebrews; according to the law, a Pharisee,
translation:
  language: zh_hans
  text: 出生后第八天受割礼，出自以色列族，属于便雅悯支派，出自希伯来人的希伯来人[a]；按律法说，是法利赛人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“希伯来人中的希伯来人。”此语强调保罗的希伯来血统和身份。
    reason: lexical_alternative
lexical_decisions:
- source_word: περιτομῇ ὀκταήμερος
  choice: 出生后第八天受割礼
  rationale: 把希腊文高度压缩的表达自然展开，准确保留受割礼的时间及其犹太圣约身份标志。
- source_word: ἐκ γένους Ἰσραήλ
  choice: 出自以色列族
  rationale: γένος在此指族裔和血统来源；“出自以色列族”简洁地表达保罗的以色列人血统。
- source_word: φυλῆς Βενιαμίν
  choice: 属于便雅悯支派
  rationale: 明确表达支派归属，符合现代中文习惯。
- source_word: Ἑβραῖος ἐξ Ἑβραίων
  choice: 是希伯来人所生的希伯来人
  rationale: 保留ἐξ所表达的出身来源，并以自然中文呈现其希伯来血统和身份的强调意味；脚注注明更贴近字面的表达。
- source_word: κατὰ νόμον
  choice: 就律法而言
  rationale: κατά在列举资格的语境中表示“在……方面、就……而言”，此译法自然，也不预先限定“律法”的具体所指。
- source_word: Φαρισαῖος
  choice: 法利赛人
  rationale: 采用现代中文中对这一犹太教派成员的通行名称。
theological_decisions:
- issue: Ἑβραῖος ἐξ Ἑβραίων所强调的是血统、文化身份，还是两者兼有
  choice: 正文译为“希伯来人所生的希伯来人”，突出原文明确的出身关系，同时不排除身份认同的含义
  alternative: 希伯来人中的希伯来人；出自希伯来人的希伯来人
  rationale: 原文ἐξ首先表示来源，而整句也可能包含语言文化和身份认同上的强调；正文不将其缩减为单纯“最典型的希伯来人”，脚注保留字面形式。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语，保留原文逐项列举的节奏；以分号区分血统身份与律法立场。
