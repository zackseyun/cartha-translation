id: PHP.3.8
reference: Philippians 3:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἀλλὰ ⸀μενοῦνγε καὶ ἡγοῦμαι πάντα ζημίαν εἶναι διὰ τὸ ὑπερέχον τῆς γνώσεως Χριστοῦ Ἰησοῦ τοῦ κυρίου μου δι’ ὃν τὰ πάντα ἐζημιώθην, καὶ ἡγοῦμαι ⸀σκύβαλα ἵνα Χριστὸν κερδήσω
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/008.yaml
  text: More than that[a], I consider all things to be loss because of the surpassing value of the knowledge of Messiah Jesus my Lord, for whose sake I have suffered the loss of all things and consider them rubbish[c][b], so that I may gain Messiah.
translation:
  language: zh_hans
  text: 不但如此，我还把万事看作亏损，因为认识我主基督耶稣具有无比的价值。我因他已经遭受万事的损失，并把这一切看作垃圾[a]，为要得着基督。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “垃圾”原文是一个语气强烈的词，也可指废弃物、污秽物或粪便。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ μενοῦνγε καὶ
  choice: 不但如此，我甚至
  rationale: 这一组语气词推进并加强上文的论述；“不但如此……甚至”在现代汉语中自然地表达递进和强调。
- source_word: ἡγοῦμαι
  choice: 看作
  rationale: 该动词表示经过衡量后作出的判断或评价；两处均译为“看作”，既清楚又保持一致。
- source_word: πάντα / τὰ πάντα
  choice: 万事
  rationale: 保留原文有意使用的全面范围，同时符合庄重而通顺的现代汉语表达。
- source_word: ζημίαν
  choice: 亏损
  rationale: “亏损”准确延续本段得失核算的比喻，并与后文“得着”形成呼应。
- source_word: διὰ τὸ ὑπερέχον τῆς γνώσεως
  choice: 因为认识……具有无比的价值
  rationale: 既表达ὑπερέχον所指的超越性价值，也让γνῶσις在汉语中呈现亲身认识的动态和关系意味，而不把它局限为抽象知识。
- source_word: Χριστοῦ Ἰησοῦ
  choice: 基督耶稣
  rationale: “基督”是现代中文圣经及一般中文语境中对Χριστός最通行、可辨识的称呼，并保留其称号性质。
- source_word: τοῦ κυρίου μου
  choice: 我主
  rationale: 简洁保留第一人称所属关系及κύριος的主权分量。
- source_word: δι’ ὃν
  choice: 为了他
  rationale: 自然表达因这位具体对象而承受牺牲的关系性和目的取向。
- source_word: ἐζημιώθην
  choice: 我已经失去
  rationale: 表达已经实际遭受损失的结果；“已经”使希腊语不定过去时所述的既成事实在汉语中清楚可感。
- source_word: σκύβαλα
  choice: 垃圾
  rationale: 这是强烈的贬抑词，可指丢弃物、污秽物甚至粪便；“垃圾”在现代汉语中直接自然，较好保留弃绝意味，更粗重的可能含义列入脚注。
- source_word: ἵνα Χριστὸν κερδήσω
  choice: 为要得着基督
  rationale: “为要”明确表达ἵνα的目的关系，“得着”则延续与“亏损”相对的得失比喻。
theological_decisions:
- issue: Χριστός在本节中的译法
  choice: 基督
  alternative: 弥赛亚（受膏者）
  rationale: 此处Χριστός仍具有称号意味，但“基督”在现代标准汉语中既是通行称呼，也承载“受膏者”的传统含义；采用“弥赛亚”会使“弥赛亚耶稣”在本句中较不自然，且可能造成不必要的风格突显。
- issue: γνῶσις的关系性与认知性
  choice: 认识我主基督耶稣
  alternative: 关于我主基督耶稣的知识
  rationale: 属格结构本身可用较静态的“知识”表达，但上下文强调保罗对基督的亲身认识和价值判断；“认识”保留认知与关系两方面，又不额外界定这种认识的神学机制。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以“万事—亏损—得着”维持原文的得失比喻；断为两句以避免中文长句负担，同时保留论证的连续性。
