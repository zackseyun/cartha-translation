  to: 因为有许多人行事为人；这些人，我曾多次告诉你们，如今我甚至流着泪告诉你们：他们是弥赛亚[a]的十字架的仇敌。
  rationale: 将“弥赛亚的十字架”的所属关系明确化，避免“弥赛亚十字架”的歧义；并按自然现代汉语重组原文被插入语打断的句法。译文仍保留“许多人”、过去多次告知、如今流泪告知，以及“十字架的仇敌”这一未予解释的概括表述。
