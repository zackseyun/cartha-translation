  text: πολλοὶ γὰρ περιπατοῦσιν οὓς πολλάκις ἔλεγον ὑμῖν, νῦν δὲ καὶ κλαίων λέγω, τοὺς ἐχθροὺς τοῦ σταυροῦ τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/018.yaml
  text: For many walk[a], whom I often told you about, and now even weeping I say, are enemies of the cross of Messiah,
translation:
  language: zh_hans
  text: 因为有许多人行事为人；这些人，我曾多次告诉你们，如今我甚至流着泪告诉你们：他们是弥赛亚[a]的十字架的仇敌。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弥赛亚”或译“基督”。
    reason: 提供Χριστός称号的传统汉语译法，说明两种译名，而非表示抄本异文。
lexical_decisions:
- source_word: πολλοὶ
  choice: 许多人
  rationale: 该形容词在这里名词化使用，指数量众多的一群人；“许多人”自然、准确，不额外强化数量。
- source_word: γὰρ
  choice: 因为
  rationale: 该连词说明本节是对上文劝勉的依据；“因为”清楚保留其解释、论证作用。
- source_word: περιπατοῦσιν
  choice: 行事为人
  rationale: περιπατέω在此比喻人的生活方式。“行事为人”既保留行为与生活的含义，也符合庄重而易懂的现代汉语。
- source_word: πολλάκις ἔλεγον ὑμῖν
  choice: 我曾多次向你们提到
  rationale: 未完成时ἔλεγον与πολλάκις共同表达过去反复发生的行动；“曾多次”保留这一反复性。
- source_word: νῦν δὲ καὶ κλαίων λέγω
  choice: 现在甚至流着泪说
  rationale: κλαίων是与“说”同时发生的现在分词，描写保罗正在哭泣；“流着泪说”自然地保留动作的同时性和情感强度，καί译作“甚至”体现递进。
- source_word: ἐχθροὺς
  choice: 仇敌
  rationale: 该词指敌对者；“仇敌”保留原文强烈的敌对含义，比“反对者”更贴切。
- source_word: τοῦ σταυροῦ
  choice: 十字架的
  rationale: σταυρός直接指十字架，并在语境中承载弥赛亚受死的意义；采用通行而直接的译法。
- source_word: τοῦ Χριστοῦ
  choice: 弥赛亚
  rationale: Χριστός在这里作为称号，意为“受膏者”；“弥赛亚”明确呈现其称号含义，同时以脚注提供传统译法“基督”。
theological_decisions:
- issue: Χριστοῦ在“十字架”所属短语中的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处无需把Χριστός视为单纯姓名，按称号译为“弥赛亚”可显明“受膏者”的含义；“基督”是汉语基督教传统中通行的音译，故列为译法备选，不将两者解释成不同所指。
- issue: “十字架的仇敌”所描述的对象
  choice: 保留为“他们是弥赛亚十字架的仇敌”
  alternative: 解释为“他们反对十字架的道理”或“他们的生活否认十字架”
  rationale: 原文只称这些人为十字架的仇敌，并未明确说明敌对的具体方式；译文不加入教义性解释，以保留原文的概括性和张力。
translation_notes:
  register: 采用现代、庄重且可朗读的普通话。“行事为人”表达保罗常用的生活方式隐喻；破折号保留原文主句被关系从句和插入说明打断的修辞效果，同时使较复杂的希腊语句法在汉语中清楚可读。
