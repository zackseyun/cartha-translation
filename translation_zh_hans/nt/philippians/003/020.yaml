  text: ἡμῶν γὰρ τὸ πολίτευμα ἐν οὐρανοῖς ὑπάρχει, ἐξ οὗ καὶ σωτῆρα ἀπεκδεχόμεθα κύριον Ἰησοῦν Χριστόν,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/020.yaml
  text: For our citizenship is in heaven[a], from where we also eagerly await a Savior[d][c][b], the Lord Jesus the Messiah.
translation:
  language: zh_hans
  text: 因为我们的公民身份是在天上[a]；我们也热切等候救主从那里来，就是主耶稣基督。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我们的城邦在天上”或“我们所属的共同体在天上”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πολίτευμα
  choice: 公民身份
  rationale: 该词带有城邦、公民共同体及归属的语义；在本段与属地取向形成对照。“公民身份”自然清楚地保留其公民性含义，同时不把它过度具体化为国家或故乡。
- source_word: ἐν οὐρανοῖς
  choice: 在天上
  rationale: 希腊文使用复数“诸天”，现代汉语通常以“天上”表达这一领域，既自然又保留空间指向。
- source_word: ὑπάρχει
  choice: 是
  rationale: 此处表明公民身份现实而持续地存在；汉语系词“是”足以自然传达。
- source_word: ἐξ οὗ
  choice: 从那里来
  rationale: 关系代词回指“天上”，并指明所等候的救主由此而来；补出“来”符合汉语表达，也与等候的对象相连。
- source_word: ἀπεκδεχόμεθα
  choice: 热切等候
  rationale: 该动词表达持续而殷切的期待，“热切等候”兼顾其期待性和延续性。
- source_word: σωτῆρα
  choice: 救主
  rationale: “救主”是现代汉语中准确、庄重且通行的基督论称谓，也保留拯救者的语义。
- source_word: κύριον
  choice: 主
  rationale: 在此基督论称号组合中，“主”是准确而惯用的译法。
- source_word: Χριστόν
  choice: 基督
  rationale: 在“主耶稣基督”这一完整称谓中，“基督”是现代汉语最自然、最广为理解的形式，且仍承载受膏者／弥赛亚的称号背景。
theological_decisions:
- issue: κύριον Ἰησοῦν Χριστόν与σωτῆρα的句法关系
  choice: 译作“救主……就是主耶稣基督”
  alternative: 译作“等候一位救主——主耶稣基督”
  rationale: 希腊文中“救主”与“主耶稣基督”均为宾格，后者说明前者是谁。“就是”清楚表达同位关系，却不增加本体论之外的新解释。
- issue: Χριστόν在完整称谓中的呈现
  choice: 主耶稣基督
  alternative: 主耶稣弥赛亚
  rationale: Χριστός本义为“受膏者”，即“弥赛亚”；但现代汉语在这一固定称谓中通常说“主耶稣基督”。这样既保持庄重自然，也没有把它当作普通姓氏；必要的称号含义可由全书术语处理保持。
- issue: “公民身份”所指的神学张力
  choice: 保留“公民身份是在天上”的空间与归属表达
  alternative: 意译为“我们的家乡在天上”
  rationale: 原文既涉及公民／共同体归属，也明确以“天上”为其所在。译文不将其简化为情感性的“家乡”，也不进一步解释为教会或未来国度，从而保留原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“但”承接γάρ对上文的解释与对比作用；分号使前后两项紧密相连。“从那里来”按汉语习惯补出方向动词，但未明说原文未直接出现的再临等术语。
