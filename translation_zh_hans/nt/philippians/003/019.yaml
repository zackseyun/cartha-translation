  text: ὧν τὸ τέλος ἀπώλεια, ὧν ὁ θεὸς ἡ κοιλία καὶ ἡ δόξα ἐν τῇ αἰσχύνῃ αὐτῶν, οἱ τὰ ἐπίγεια φρονοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/019.yaml
  text: Their end is destruction[a], their god is the belly[b], and their glory is in their shame—their minds are set on earthly things.
translation:
  language: zh_hans
  text: 他们的结局是灭亡；他们的神就是肚腹[a]；他们以自己的羞耻为荣耀——他们的心思放在地上的事上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “肚腹”也可按其隐喻意义译作“食欲”或“欲望”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“他们思念地上的事”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τέλος
  choice: 结局
  rationale: 这里指这些人最终的归宿或结果；“结局”既自然，又保留末世审判的指向，而不把它过度解释为预定的“命运”。
- source_word: ἀπώλεια
  choice: 灭亡
  rationale: 保留原词严厉的毁灭、沉沦含义，也是现代中文圣经语境中清楚而庄重的表达。
- source_word: κοιλία
  choice: 肚腹
  rationale: 保留希腊文具体而尖锐的身体隐喻，不直接释为“食欲”或一般的“欲望”。
- source_word: δόξα
  choice: 荣耀
  rationale: 直译原词，并保留“以羞耻为荣耀”这一强烈的反讽张力。
- source_word: αἰσχύνη
  choice: 羞耻
  rationale: 简洁表达可耻之事以及由此产生的耻辱，不限定为某一种具体恶行。
- source_word: τὰ ἐπίγεια
  choice: 地上的事
  rationale: 贴近希腊文中性复数表达，范围保持开放，不擅自缩窄为物质、钱财或肉体享受。
- source_word: φρονοῦντες
  choice: 思念
  rationale: 表达持续的思想取向和关注所在；中文简洁庄重，也不把该词弱化为偶尔“想到”。
- source_word: ὧν ... ὧν
  choice: 他们的……他们的……
  rationale: 以中文所有格承接上一节所说的人，同时保留原文反复刻画这些人的修辞结构。
theological_decisions:
- issue: “他们的神就是肚腹”的隐喻范围
  choice: 正文保留“肚腹”这一具体隐喻
  alternative: 他们的神就是自己的食欲／欲望
  rationale: 原文没有明确把 κοιλία 限定为食量、性欲或某一种感官欲望；保留隐喻可避免过早消解保罗刻意留下的广泛谴责。
- issue: “以自己的羞耻为荣耀”的反讽
  choice: 按原文保留“荣耀”与“羞耻”的并置
  alternative: 他们竟以可耻的事自夸
  rationale: 释义式译法虽较直白，却会削弱 δόξα 与 αἰσχύνη 形成的神学和修辞张力。
- issue: 末句与前三句的关系
  choice: 用破折号引出“他们思念地上的事”，作为对这些人的概括性刻画
  alternative: 译成独立并列句“他们的心思都放在地上的事上”
  rationale: 希腊文以带冠词的分词短语描述同一群人；破折号既呈现补充说明的关系，又不强行判定它只解释前一句或全部前三句。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。分号保留原文连续三次刻画的节奏，破折号呈现末尾分词短语的总结性说明。避免使用“沉沦”“永远毁灭”等可能增加古旧色彩或超出本节明说内容的表达。
