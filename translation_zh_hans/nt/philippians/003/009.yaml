  text: καὶ εὑρεθῶ ἐν αὐτῷ, μὴ ἔχων ἐμὴν δικαιοσύνην τὴν ἐκ νόμου ἀλλὰ τὴν διὰ πίστεως Χριστοῦ, τὴν ἐκ θεοῦ δικαιοσύνην ἐπὶ τῇ πίστει,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/009.yaml
  text: and be found in him[a], not having my own righteousness from the law[b], but that which is through faith in Messiah—the righteousness from God based on faith.
translation:
  language: zh_hans
  text: 并且得以在他里面被发现，不是拥有自己那出于律法的义，而是有那借着信靠弥赛亚[a]而来的义，就是出于上帝、以信为依据的义。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “借着信靠弥赛亚”或译“借着弥赛亚的信实”。
    reason: alternative_reading
lexical_decisions:
- source_word: εὑρεθῶ
  choice: 得以……被找到
  rationale: 保留不定过去时被动虚拟语气的被动形式，并在中文中自然承接上文所表达的目标或结果。
- source_word: ἐν αὐτῷ
  choice: 在他里面
  rationale: 直译保罗书信中重要的联合表达，保留其神学广度，不缩减为某一种解释。
- source_word: μὴ ἔχων
  choice: 不是有
  rationale: 保留分词所说明的状态，并与后面的“而是有”形成清楚对照。
- source_word: δικαιοσύνην
  choice: 义
  rationale: “义”是中文圣经语境中对 δικαιοσύνη 的简洁、自然且涵盖面较广的对应词；“公义”作为可行词义列入脚注。
- source_word: τὴν ἐκ νόμου
  choice: 那出于律法的
  rationale: 准确表达来源，且不额外限定为靠行为取得，避免加入原文未明说的解释。
- source_word: διὰ πίστεως Χριστοῦ
  choice: 借着信弥赛亚
  rationale: 主文采用将 Χριστοῦ 理解为信心对象的读法，同时用脚注保留“借着弥赛亚的信实”这一真实存在的语法可能。
- source_word: Χριστοῦ
  choice: 弥赛亚
  rationale: 在此保留 Χριστός 的称号意义，不仅将其当作名字音译。
- source_word: τὴν ἐκ θεοῦ δικαιοσύνην
  choice: 出于上帝……的义
  rationale: 保留原文对先前之“义”的同位重述，并突出其来源是上帝。
- source_word: ἐπὶ τῇ πίστει
  choice: 以信为依据
  rationale: 表达 ἐπί 加与格在此所指的基础或依据，同时保持现代中文清楚简洁。
theological_decisions:
- issue: πίστεως Χριστοῦ 的属格关系
  choice: 信弥赛亚（宾语属格）
  alternative: 弥赛亚的信实（主语属格）
  rationale: 这一结构在语法和神学解释上确有争议；主文采用“信弥赛亚”，脚注保留另一读法，不把歧义静默消除。
- issue: δικαιοσύνη 的译法
  choice: 义
  alternative: 公义
  rationale: “义”能自然承接保罗论述，并避免将词义只限定为司法层面的“正义”；脚注提示“公义”可用于本节两处。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。保留“在他里面”和“被找到”等原文意象，以免过度释义；通过重复“义”呈现希腊文的论证结构。
