  to: 并且得以在他里面被发现，不是拥有自己那出于律法的义，而是有那借着信靠弥赛亚[a]而来的义，就是出于上帝、以信为依据的义。
  rationale: 修正脚注 a 的锚点，使其准确对应有争议的希腊文短语 διὰ πίστεως Χριστοῦ；将不完整的“信弥赛亚”改为自然的“信靠弥赛亚”，并微调“不是有”为“不是拥有”。保留“义”“弥赛亚”“在他里面”及“以信为依据”，以维持原文的术语、论证结构和未决歧义。脚注 b 内容本身无误，仍保留。
