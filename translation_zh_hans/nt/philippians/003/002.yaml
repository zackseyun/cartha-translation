  yaml_path: translation/nt/philippians/003/002.yaml
  text: Watch out for the dogs[a]; watch out for the evil workers[c][b]; watch out for the mutilation.
translation:
  language: zh_hans
  text: 要提防那些狗！要提防那些作恶的人！要提防那割损之事[a]！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “割损”原文是一个带贬义的抽象名词，字面可指切割、残损；保罗用它与下一节的“割礼”形成尖锐的文字对照。
    reason: lexical_alternative
lexical_decisions:
- source_word: Βλέπετε
  choice: 要提防
  rationale: 这里是现在时主动命令语气，并连续重复三次，表达迫切而持续的警告。“要提防”符合现代汉语，也能在三次复现中保留原文的强调节奏。
- source_word: τοὺς κύνας
  choice: 那些狗
  rationale: 保留原文尖锐的动物隐喻，不在正文中添加“污秽”等原文没有的修饰语。
- source_word: τοὺς κακοὺς ἐργάτας
  choice: 那些作恶的人
  rationale: κακούς带有明确的道德否定，ἐργάτας指做工者；“作恶的人”在现代汉语中自然直接，同时保留他们以行为造成恶果的含义。
- source_word: τὴν κατατομήν
  choice: 那些割损派
  rationale: κατατομή字面指割损、切碎，在此与下一节的περιτομή（割礼）形成贬义双关。汉语若只译“割损”不易自然指向一群人，因此用“割损派”保留群体指向和尖锐的文字对照，并用脚注说明其字面形式。
theological_decisions:
- issue: 如何表达κατατομή与下一节“割礼”用语之间的关系
  choice: 译作“那些割损派”，保留贬义的“割损”而不淡化为普通的“受割礼者”
  alternative: 那些自残身体的人；那些假割礼派；那割损
  rationale: 保罗刻意不用通常表示割礼的περιτομή，而使用音近且带贬义的κατατομή。译文应保留其修辞锋芒，却不加入“假”等原文未明说的判断。
translation_notes:
  register: 采用现代、庄重而有力度的普通话。“要提防”三次重复，保存原文排比和警告语气；三个宾语都用“那些”明确指人。末句“割损派”略带修辞性，以便在汉语中既能指涉群体，又保留与3:3“割礼”的词语对照。
