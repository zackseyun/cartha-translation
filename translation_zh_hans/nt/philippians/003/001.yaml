id: PHP.3.1
reference: Philippians 3:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Τὸ λοιπόν, ἀδελφοί μου, χαίρετε ἐν κυρίῳ. τὰ αὐτὰ γράφειν ὑμῖν ἐμοὶ μὲν οὐκ ὀκνηρόν, ὑμῖν δὲ ἀσφαλές.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/001.yaml
  text: Finally[a], my brothers, rejoice in the Lord. To write the same things to you is not troublesome for me[d][c][b], and is safe for you.
translation:
  language: zh_hans
  text: 此外[a]，我的弟兄们[b]，你们要在主里喜乐。把同样的事写给你们，对我并不麻烦[c]，对你们却是稳妥的[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“末了”，或“从今以后”。
    reason: lexical_alternative
  - marker: b
    text: “弟兄们”在这里是对全体会众的称呼，也包括姊妹。
    reason: cultural_note
  - marker: c
    text: 或译“对我并不为难”，或“不会使我厌烦”。
    reason: lexical_alternative
  - marker: d
    text: 或译“对你们却是一种保障”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὸ λοιπόν
  choice: 此外
  rationale: 这是承接下文的话语转换语。译作“此外”既符合现代汉语，也避免因全信尚有较长篇幅而把“末了”理解得过于严格；其他可能含义列入脚注。
- source_word: ἀδελφοί μου
  choice: 我的弟兄们
  rationale: 保留希腊语阳性复数的称呼形式；在这里其实际受众是整个会众，包括女性，故以脚注说明。
- source_word: χαίρετε
  choice: 你们要喜乐
  rationale: 保留复数命令语气，以及保罗书信中 χαίρω 所表达的劝勉力度。
- source_word: ἐν κυρίῳ
  choice: 在主里
  rationale: 直接保留介词短语，使喜乐与主之间的关系不被改写为单一、过度明确的解释。
- source_word: τὰ αὐτά
  choice: 同样的事
  rationale: 保持原文所指对象的宽泛性，不擅自断定是前文劝勉、既有教导，还是别的重复内容。
- source_word: γράφειν
  choice: 写
  rationale: 按汉语句法将不定式结构自然译为“把同样的事写给你们”。
- source_word: οὐκ ὀκνηρόν
  choice: 并不麻烦
  rationale: 表达重复写这些事不会使保罗为难、厌烦或退缩；“并不麻烦”是自然且不过度限定的现代汉语。
- source_word: ἀσφαλές
  choice: 稳妥的
  rationale: 保留安全、可靠的形容词意义；不在正文中把它具体化为某一种保护机制。
theological_decisions:
- issue: 对全体会众使用阳性复数称呼
  choice: 我的弟兄们
  alternative: 我的弟兄姊妹们
  rationale: 正文保留希腊语称呼的形式，脚注则说明该称呼在此涵盖全体会众，避免读者误以为仅指男性。
- issue: 重复写信内容所具有的保护作用
  choice: 对你们却是稳妥的
  alternative: 对你们却是一种保障
  rationale: 正文保留 ἀσφαλές 的直接形容词意义，不额外加入名词性比喻；“保障”的保护意味作为可行译法列入脚注。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“此外”作为段落转换语较为顺畅；“在主里”保留保罗式神学表达；后半句以“对我……对你们却……”呈现希腊文 μὲν…δὲ… 的对照结构。
