source:
  edition: SBLGNT
  text: Συμμιμηταί μου γίνεσθε, ἀδελφοί, καὶ σκοπεῖτε τοὺς οὕτω περιπατοῦντας καθὼς ἔχετε τύπον ἡμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/017.yaml
  text: Brothers[a], join in imitating me, and keep your eyes on those who walk this way[b], just as you have us as a pattern.
translation:
  language: zh_hans
  text: 弟兄们[a]，你们要一同效法我，也要留心那些如此行事[b]的人，正如你们以我们为榜样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“弟兄姊妹们”；希腊语形式为阳性复数，但这里很可能是在称呼全体会众。
    reason: cultural_note
  - marker: b
    text: “行事”直译为“行走”，在这里比喻一个人的生活方式。
    reason: lexical_alternative
lexical_decisions:
- source_word: Συμμιμηταί μου γίνεσθε
  choice: 你们要一同效法我
  rationale: Συμμιμηταί 表达共同效法的群体性含义，γίνεσθε 构成命令。译为“一同效法我”既保留共同参与的意味，也比“一同成为效法我的人”更符合现代汉语。
- source_word: ἀδελφοί
  choice: 弟兄们
  rationale: 原文为阳性复数呼格；正文保留其语法形式，并用脚注说明在本语境中很可能指全体会众。
- source_word: σκοπεῖτε
  choice: 留心
  rationale: 该词表示持续注意、仔细观察。“留心”自然地传达命令语气和审慎关注之意。
- source_word: οὕτω περιπατοῦντας
  choice: 那些照样行事的人
  rationale: περιπατέω 原义为“行走”，在此比喻生活方式或行为表现；“行事”以自然汉语表达这一惯用含义，“照样”对应 οὕτω，并与上文的榜样衔接。
- source_word: τύπον
  choice: 榜样
  rationale: τύπος 在此指可供仿效的典范。“榜样”在现代汉语中清楚自然，同时保留其规范性示范含义。
- source_word: ἡμᾶς
  choice: 我们
  rationale: 原文明确使用复数代词，可能包括保罗及其同工；不将其简化为单数“我”。
- source_word: καθὼς ἔχετε τύπον ἡμᾶς
  choice: 你们既有我们作榜样
  rationale: καθώς 表明后半句与已有榜样之间的对应关系。汉语调整语序，把依据先说出来，使逻辑清楚，但不把该词强释为因果关系。
theological_decisions:
- issue: ἀδελφοί 是否包含女性会众
  choice: 正文译作“弟兄们”，脚注说明也可能包括姊妹
  alternative: 正文直接译作“弟兄姊妹们”
  rationale: 原文形式为阳性复数，但在书信称呼中很可能面向全体会众。正文保留形式，脚注交代语境范围，从而兼顾语法准确性与实际所指。
- issue: “效法我”与“我们作榜样”的单复数变化
  choice: 分别保留“我”和“我们”
  alternative: 为求表面一致，全部译为“我”或“我们”
  rationale: 原文有意先用单数 μου，后用复数 ἡμᾶς。保留这一变化，避免抹去保罗本人和他与同工共同作榜样之间可能存在的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“一同效法”保留共同效法的含义；分号呈现两个并列命令。后半句适度调整语序，使“我们作榜样”与“照样行事”的关系在汉语中更清楚，同时不消除原文由单数“我”转为复数“我们”的变化。
