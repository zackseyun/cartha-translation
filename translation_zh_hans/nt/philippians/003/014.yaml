  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: κατὰ σκοπὸν διώκω ⸀εἰς τὸ βραβεῖον τῆς ἄνω κλήσεως τοῦ θεοῦ ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/014.yaml
  text: I press on toward the goal for the prize of the upward call of God in Messiah Jesus[a][b].
translation:
  language: zh_hans
  text: 我向着目标竭力追求，为要得着神在弥赛亚耶稣里向上呼召的奖赏[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “向上呼召”也可译作“属天的呼召”或“从上面来的呼召”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文作“在基督耶稣里”；这里译作“弥赛亚耶稣”，因为“基督”在此是称号，意思是“弥赛亚”。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ σκοπόν
  choice: 向着目标
  rationale: κατά与宾格在这里表达朝向既定目标的运动；“向着目标”自然保留赛跑场景，也不把该短语误解为“按照某个标准”行事。
- source_word: διώκω
  choice: 奋力追赶
  rationale: 该动词基本义为追逐、追求；结合上下文的赛跑意象，“奋力追赶”体现持续而竭力向前的动作，同时避免把结果说成已经达到。
- source_word: εἰς τὸ βραβεῖον
  choice: 为要得着……奖赏
  rationale: εἰς在此指追赶的目标或目的。“为要得着……奖赏”符合现代汉语，并未断言奖赏已经获得。
- source_word: ἄνω
  choice: 向上
  rationale: “向上”直接保留ἄνω的空间意味及上下文中的运动意象；“属天的”与“从上面来的”虽可能成立，却分别偏向性质或来源的解释。
- source_word: κλήσεως τοῦ θεοῦ
  choice: 神……呼召
  rationale: τοῦ θεοῦ最自然地表明呼召出于或属于神；汉语依惯用语序将“神”置于“呼召”之前，同时不进一步限定该属格关系。
- source_word: Χριστῷ
  choice: 弥赛亚
  rationale: Χριστός在此仍带有称号意义；译作“弥赛亚”使普通读者看出其含义，而不是把它仅当作名字的一部分。
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: 在弥赛亚耶稣里
  rationale: 保留ἐν的“在……里”表达，不将保罗关于人与弥赛亚关系的语言改写成较窄的因果、媒介或地点解释。
theological_decisions:
- issue: ἄνω κλήσεως的含义
  choice: 向上呼召
  alternative: 属天的呼召；从上面来的呼召
  rationale: “向上”保留ἄνω的直接空间意义，也与赛跑中朝目标前进的意象相协调；脚注列出“属天”与“从上面来”两种可能，避免在正文中消除其关于方向、性质或来源的张力。
- issue: βραβεῖον与κλήσεως的关系
  choice: 神……向上呼召的奖赏
  alternative: 神向上呼召人去得的奖赏
  rationale: 正文尽量保留希腊语“呼召的奖赏”这一属格结构，不明确补出呼召的对象或目的，以免把原文可容纳的关系解释得过窄。
- issue: ἐν Χριστῷ Ἰησοῦ的关联范围
  choice: 保留在句末，作“在弥赛亚耶稣里”
  alternative: 明确限定为神在弥赛亚耶稣里发出的呼召，或人在弥赛亚耶稣里所得的奖赏
  rationale: 原文句末介词短语可自然关联神的呼召乃至整个奖赏与呼召的表达；译文不擅自缩小其修饰范围。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“目标、奋力追赶、奖赏”共同维持赛跑意象；语序以汉语自然表达为准，同时尽可能保留原文属格结构和句末介词短语的开放性。所有脚注标记均置于正文相应位置。
