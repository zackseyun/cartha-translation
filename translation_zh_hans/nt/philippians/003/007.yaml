  text: Ἀλλὰ ἅτινα ἦν μοι κέρδη, ταῦτα ἥγημαι διὰ τὸν Χριστὸν ζημίαν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/007.yaml
  text: But whatever things were gains to me[b][a], these I have considered loss because of Messiah.
translation:
  language: zh_hans
  text: 然而，从前对我有利的那些事，我都因弥赛亚[a]看作亏损[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“基督”。
    reason: lexical_alternative
  - marker: b
    text: “看作亏损”也可译为“算作亏损”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀλλὰ
  choice: 然而
  rationale: 承接上文并形成鲜明转折；“然而”庄重自然，适合本段论述语气。
- source_word: ἅτινα ἦν μοι κέρδη
  choice: 从前对我有利的那些事
  rationale: ἅτινα概括保罗刚才列举的全部旧有优势；κέρδη为复数，表示曾被视为收益或有利条件的事物。
- source_word: ἥγημαι
  choice: 我都……看作
  rationale: 该词为完成时，表达经过重新评估后形成并持续有效的判断；“看作”在现代汉语中自然，也保留认定、评估之意。
- source_word: διὰ τὸν Χριστὸν
  choice: 因弥赛亚
  rationale: διά加宾格在此表示原因；Χριστός按其称号含义译为“弥赛亚”，同时以脚注保留传统译法“基督”。
- source_word: ζημίαν
  choice: 亏损
  rationale: 与κέρδη构成收益与亏损的财务比喻；单数“亏损”概括先前各项优势如今所得的总体评价。
theological_decisions:
- issue: Χριστόν的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处可理解为称号，译作“弥赛亚”显明其受膏者含义；“基督”是通行的音意传统译法，列入脚注以保留另一自然读法。
- issue: διὰ τὸν Χριστόν所表达的关系
  choice: 因弥赛亚
  alternative: 为了弥赛亚的缘故
  rationale: διά加宾格通常表达原因，因此正文采用“因”；“为了……的缘故”可带目的或受益意味，可能过度限定原文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“从前……有利”与“亏损”保留原文的收益—亏损对照；句式尽量贴近希腊文的转折和回顾结构，又避免生硬直译。
