source:
  edition: SBLGNT
  text: ὃς μετασχηματίσει τὸ σῶμα τῆς ταπεινώσεως ⸀ἡμῶν σύμμορφον τῷ σώματι τῆς δόξης αὐτοῦ κατὰ τὴν ἐνέργειαν τοῦ δύνασθαι αὐτὸν καὶ ὑποτάξαι ⸀αὑτῷ τὰ πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/021.yaml
  text: who will transform our lowly body to be like the body of his glory[c][b][a], by the power that enables him even to subject all things to himself.
translation:
  language: zh_hans
  text: 他要改变我们这卑微的身体[a]，使它与他荣耀的身体[b]相符合；这是按照他大能的作为[c]，就是他甚至能使万有归服自己的大能。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“我们卑微（或受屈辱）的身体。”
    reason: lexical_alternative
  - marker: b
    text: 直译：“他荣耀之身体。”
    reason: lexical_alternative
  - marker: c
    text: 或译：“按照那使他能够甚至使万有归服自己的运行之力。”
    reason: lexical_alternative
lexical_decisions:
- source_word: μετασχηματίσει
  choice: 要改变
  rationale: 该动词表示形态或状态的真实改变；“改变”在现代汉语中自然，也保留将来行动的明确性。
- source_word: τὸ σῶμα τῆς ταπεινώσεως ἡμῶν
  choice: 我们这卑微的身体
  rationale: 以自然汉语表达属格结构，同时保留身体目前处于卑微、受贬抑状态的含义；“身体”保持原文单数。
- source_word: σύμμορφον
  choice: 有同样的形态
  rationale: 保留 σύμμορφος 所表达的强烈对应关系，比笼统的“相似”更具体，又比生硬的“同形化”更易懂。
- source_word: τῷ σώματι τῆς δόξης αὐτοῦ
  choice: 他荣耀的身体
  rationale: 将“他荣耀的身体”这一属格结构按现代汉语习惯表达，指以荣耀为特征的身体。
- source_word: κατὰ τὴν ἐνέργειαν
  choice: 照着他大能的运行
  rationale: ἐνέργεια 强调实际发挥作用的能力；此译既保留“照着”的关系，也呈现能力正在运行的意味。
- source_word: τοῦ δύνασθαι αὐτὸν καὶ ὑποτάξαι αὑτῷ τὰ πάντα
  choice: 他凭这大能甚至能使万有归服自己
  rationale: 明确这一运行之力与基督使万有服从自己的能力相连；“万有”保留 τὰ πάντα 的广泛范围，“归服”保留 ὑποτάσσω 的权柄关系。
theological_decisions:
- issue: 信徒现今卑微的身体与将来荣耀身体之间的关系
  choice: 译为基督将改变信徒现今卑微的身体，使之与他荣耀的身体有同样的形态。
  alternative: 可直接加入“复活”一词来解释这种改变。
  rationale: 原文清楚陈述身体将被改变并与基督荣耀的身体相符，却没有在本节说明其具体机制；因此不额外加入“复活”等解释性措辞。
- issue: σύμμορφον 所表示的相符程度
  choice: 译作“有同样的形态”，表达强烈的形态对应。
  alternative: 可译作较宽泛的“相似”，或较术语化的“同形”。
  rationale: 此译不把信徒与基督等同，也不削弱原文所说的真实相符，保留其神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我们这卑微的身体”与“他荣耀的身体”形成清楚对照；分号后的表达适度展开希腊语密集的能力结构，但没有加入原文未明说的复活机制或宗派性解释。
