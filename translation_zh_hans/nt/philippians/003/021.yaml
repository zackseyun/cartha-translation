  to: 他要改变我们这卑微的身体[a]，使它与他荣耀的身体[b]相符合；这是按照他大能的作为[c]，就是他甚至能使万有归服自己的大能。
  rationale: 将能力结构重新连回主句，以更自然的现代汉语表达 κατὰ τὴν ἐνέργειαν τοῦ δύνασθαι αὐτὸν……；以“相符合”表达未来改变所达成的 σύμμορφον，避免“同样的形态”的静态和生硬感。保留“卑微”“荣耀”“万有”“归服自己”等关键语义，未添加复活机制或任何宗派解释。
