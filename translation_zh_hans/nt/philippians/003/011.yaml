base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/011.yaml
  text: if somehow I may attain to the resurrection from the dead[a].
translation:
  language: zh_hans
  text: 或者我可以达到从死人中复活[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 更直译可作“从死人中出来的复活”。原文“复活”一词带有“出来”的构词成分。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ πως
  choice: 或者我总可以
  rationale: 保留原文带有试探性和谦卑语气的表达，指达到目标的途径或情形尚未明说，并不擅自解释为保罗怀疑上帝的应许。
- source_word: καταντήσω
  choice: 达到
  rationale: 该词在此表示抵达一个目标；“达到”自然地传达其比喻性、终末性的用法。
- source_word: εἰς
  choice: 达到
  rationale: 汉语用及物动词“达到”即可自然表达向着目标而最终抵达的关系，不必另译介词。
- source_word: ἐξανάστασιν
  choice: 复活
  rationale: 该名词指复活；正文采用现代汉语通行而清楚的说法，不用生硬的仿造词，但在脚注中提示其特殊构词。
- source_word: τὴν ἐκ νεκρῶν
  choice: 从死人中复活
  rationale: “从死人中”较明确地保留ἐκ的分离意味以及νεκρῶν无冠词复数的群体性，比单说“死里复活”更贴近此处措辞。
theological_decisions:
- issue: εἴ πως是否表示保罗怀疑自己最终复活
  choice: 以“或者我总可以”保留试探性和谦卑语气，不断言这是对上帝应许的怀疑
  alternative: “无论如何，我都要达到”或“盼望我可以达到”
  rationale: 原文表达尚未确定的方式或结果导向，但上下文没有要求把它解释为教义上的不确定，也不宜反向消除其真实的条件色彩。
- issue: ἐξανάστασις是否必须译成一种有别于一般复活的特殊“出复活”
  choice: 正文译为“复活”，并由“从死人中”及脚注保留其独特措辞
  alternative: “从死人中出来的复活”或“出复活”
  rationale: 该罕见名词确有“起来、出来”的构词色彩，但仅凭此词不足以断定一种特定类别或阶段的复活；正文不预先解决这一神学张力。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“或者我总可以”力求保留εἴ πως的谦卑、试探性色彩；脚注说明罕见名词的构词特点，而不在正文中使用晦涩的新造词。
