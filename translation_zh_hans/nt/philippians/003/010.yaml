  to: 为要认识他、他复活的大能，并有分于他的苦难[a]，渐渐与他的死相合[b]，
  rationale: 修订使“为要认识”自然统领“他”和“他复活的大能”，同时将 κοινωνίαν 直接译为“有分于”，表达真实参与而非仅仅知道某种经历。以“渐渐与他的死相合”表达现在分词的过程性，并避免在正文中决定其究竟偏中间还是偏被动。脚注保留相关的自然替代译法。
