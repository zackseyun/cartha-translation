  text: τοῦ γνῶναι αὐτὸν καὶ τὴν δύναμιν τῆς ἀναστάσεως αὐτοῦ καὶ ⸀κοινωνίαν παθημάτων αὐτοῦ, ⸀συμμορφιζόμενος τῷ θανάτῳ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/010.yaml
  text: to know him[a], and the power of his resurrection, and the fellowship of his sufferings, being conformed to his death[b],
translation:
  language: zh_hans
  text: 为要认识他、他复活的大能，并有分于他的苦难[a]，渐渐与他的死相合[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“与他的苦难相交”，或“参与他的苦难”。
    reason: lexical_alternative
  - marker: b
    text: 或译“渐渐变得与他的死相似”，或“被塑造成与他的死相合”。
    reason: lexical_alternative
lexical_decisions:
- source_word: γνῶναι
  choice: 认识
  rationale: 保留不定式所表达的目的，并传达亲身、关系性的认识；在汉语中也自然适用于后续并列宾语。
- source_word: δύναμιν
  choice: 大能
  rationale: 准确表达 δύναμις 所指在基督复活中彰显并产生功效的能力；“大能”符合庄重而通行的现代圣经语体。
- source_word: ἀναστάσεως
  choice: 复活
  rationale: “复活”是此处最明确、通行的对应词，准确指向基督从死里复起。
- source_word: κοινωνίαν
  choice: 有分
  rationale: “有分”清楚传达实际参与，而不只表示同情或抽象的团契；与“在……中”连用也符合现代汉语。
- source_word: παθημάτων
  choice: 苦难
  rationale: 直接表达基督所经历的受苦，语义宽度与原文相称。
- source_word: συμμορφιζόμενος
  choice: 被塑造得……相似
  rationale: 保留分词的持续过程和可能的被动意味，同时用可理解的现代汉语表达与某一形态相合。
- source_word: τῷ θανάτῳ αὐτοῦ
  choice: 与他的死相似
  rationale: 表达 συμμορφιζόμενος 后与格补语的关系，把焦点保留在与基督之死相合上。
theological_decisions:
- issue: κοινωνίαν παθημάτων αὐτοῦ 的含义
  choice: 在他的苦难中有分
  alternative: 与他的苦难相交
  rationale: 译文表达真实参与基督苦难，而非仅在情感上同情；同时不把这种参与限定为某一宗派性的教义解释。
- issue: συμμορφιζόμενος 的语态与过程性
  choice: 被塑造得与他的死相似
  alternative: 渐渐变得与他的死相似
  rationale: 原词形可作中间或被动理解，且现在时分词含持续过程；正文保留被动可能，脚注列出偏中间、过程性的译法，以免消除原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留希腊文中“认识”统领三个并列对象的结构，并以“也认识”帮助汉语读者辨明句法。“有分”避免把 κοινωνία 弱化为一般交往；“被塑造得……相似”则保留 συμμορφιζόμενος 的持续性及语态上的开放性。
