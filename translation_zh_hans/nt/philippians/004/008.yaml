source:
  edition: SBLGNT
  text: Τὸ λοιπόν, ἀδελφοί, ὅσα ἐστὶν ἀληθῆ, ὅσα σεμνά, ὅσα δίκαια, ὅσα ἁγνά, ὅσα προσφιλῆ, ὅσα εὔφημα, εἴ τις ἀρετὴ καὶ εἴ τις ἔπαινος, ταῦτα λογίζεσθε·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/008.yaml
  text: Finally[a], brothers, whatever is true, whatever is honorable, whatever is just, whatever is pure, whatever is lovely, whatever is commendable—if there is any virtue and if there is any praise—think about these things.
translation:
  language: zh_hans
  text: 最后，弟兄们[a]，凡是真实的，凡是庄重的，凡是公正的，凡是纯洁的，凡是可爱的，凡是有美名的——若有什么美德，若有什么值得称赞的——你们要思考这些事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“弟兄姊妹们”；希腊语“弟兄们”可以用来称呼整个信徒群体。
    reason: cultural_note
lexical_decisions:
- source_word: Τὸ λοιπόν
  choice: 末了
  rationale: 作为话语转换语，引出接近结尾的劝勉；“末了”庄重自然，也保留其总结和过渡作用。
- source_word: ἀδελφοί
  choice: 弟兄们
  rationale: 保留希腊语阳性复数称呼的形式；在保罗的群体称呼中可涵盖整个信徒群体，故以脚注说明。
- source_word: ὅσα
  choice: 凡是
  rationale: 重复译为“凡是”，自然呈现原文逐项列举和概括一切相关事物的语势。
- source_word: ἀληθῆ
  choice: 真实的
  rationale: 涵盖真实、诚实和不虚假的广义道德认知范畴。
- source_word: σεμνά
  choice: 庄重的
  rationale: 表达值得尊敬、具有道德分量的事物，不局限于外在礼仪。
- source_word: δίκαια
  choice: 公正的
  rationale: 在伦理清单中表达正直、公平、合乎正道；避免过度限定为教义性的“称义”含义。
- source_word: ἁγνά
  choice: 纯洁的
  rationale: 保留道德和内在洁净的双重意味，比“贞洁”范围更广。
- source_word: προσφιλῆ
  choice: 可爱的
  rationale: 指能引发爱意、令人喜爱的事物；“可爱的”简洁保留这一关系性含义。
- source_word: εὔφημα
  choice: 有美名的
  rationale: 较贴近该词“被人说得好、声誉良好”的含义，并与后文“称赞”保持词义区别。
- source_word: εἴ τις ἀρετὴ
  choice: 若有什么美德
  rationale: 保留原文条件式和抽象名词结构；“美德”涵盖道德上的卓越。
- source_word: εἴ τις ἔπαινος
  choice: 若有什么值得称赞的
  rationale: “值得称赞的”在现代汉语中比“有什么称赞”自然，同时保留 ἔπαινος 的赞许含义。
- source_word: ταῦτα λογίζεσθε
  choice: 这些事，你们都要思想
  rationale: 表达持续、审慎地把心思放在这些事上；“思想”比单纯“想想”更符合命令的分量。
theological_decisions:
- issue: ἀδελφοί 所指群体的性别范围
  choice: 正文译“弟兄们”，脚注说明可包括姊妹
  alternative: 正文译“弟兄姊妹们”
  rationale: 既保留希腊语阳性复数的明示形式，也不掩盖该称呼在保罗书信中常用于全体信徒这一语用事实。
- issue: δίκαια 的伦理与神学语感
  choice: 公正的
  alternative: 公义的
  rationale: 本节是广泛的伦理德目清单，“公正的”能表达正直与公平，又不把词义不必要地收窄为特定的神学术语。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。保留“凡是……凡是……”的排比节奏及两重“若有什么……”的条件结构；破折号标明总结性插语。“有美名的”避免与后面的“值得称赞的”重复。
