id: PHP.4.3
reference: Philippians 4:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ναὶ ἐρωτῶ καὶ σέ, ⸂γνήσιε σύζυγε⸃, συλλαμβάνου αὐταῖς, αἵτινες ἐν τῷ εὐαγγελίῳ συνήθλησάν μοι μετὰ καὶ Κλήμεντος καὶ τῶν λοιπῶν συνεργῶν μου, ὧν τὰ ὀνόματα ἐν βίβλῳ ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/003.yaml
  text: Yes[a], I ask you also, true companion, help these women, who contended alongside me in the gospel[b], together with Clement and the rest of my fellow workers, whose names are in the book of life.
translation:
  language: zh_hans
  text: 是的，我也请你这位真诚的同伴[a]帮助她们。她们曾在福音的事上与我并肩奋斗；一同奋斗的还有革利免和我其余的同工。这些人的名字都在生命册上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “真诚的同伴”也可直译为“真正同负一轭的人”；也有人认为这里是人名“Syzygus”。
    reason: alternative_reading
lexical_decisions:
- source_word: ναί
  choice: 是的
  rationale: 保留保罗在劝勉开头所用的肯定语气和直接口吻。
- source_word: ἐρωτῶ
  choice: 请
  rationale: 表达个人恳请的语气，不把力度强化为命令或严厉催促。
- source_word: γνήσιε σύζυγε
  choice: 忠实的同伴
  rationale: 将该词组理解为对一位未具名同工的称呼；译文自然表达真实可靠、共同承担使命的关系，另在脚注保留轭的比喻及人名解法。
- source_word: συλλαμβάνου
  choice: 帮助
  rationale: 清楚表达主动扶助她们的命令，同时避免生硬直译“共同抓住”。
- source_word: αὐταῖς
  choice: 她们
  rationale: 使用阴性复数，与上文的友阿蝶和循都基相呼应。
- source_word: συνήθλησάν μοι
  choice: 与我并肩奋斗
  rationale: 保留 συναθλέω 所含共同竞技、奋力争取的意象，也符合现代汉语表达。
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: 在福音的事上
  rationale: 尽量保留希腊文简练而宽泛的介词结构，不限定为传讲、捍卫或其他某一种具体服事。
- source_word: συνεργῶν
  choice: 同工
  rationale: 采用现代中文基督教语境中清楚、简洁且广为理解的保罗式用语。
- source_word: βίβλῳ ζωῆς
  choice: 生命册
  rationale: 采用中文圣经传统中明确而凝练的固定表达。
theological_decisions:
- issue: γνήσιε σύζυγε 的解释
  choice: 作为对一位未具名同伴的描述性称呼：“忠实的同伴”
  alternative: 可直译为“真正同负一轭的人”，也可能把 σύζυγος 当作人名“苏求古”
  rationale: 形容词 γνήσιε 与普通名词作呼语的理解自然，也符合保罗请一位可靠同工介入帮助的上下文；由于人名说和轭的比喻均有依据，脚注保留这些可能。
- issue: ὧν 的指代范围
  choice: 以“这些人”涵盖两位妇女、革利免及保罗其余的同工
  alternative: 仅指最靠近的“我其余的同工”
  rationale: 关系代词在句中可自然回指前述共同为福音奋斗的整组人；译作“这些人”既使中文清晰，也不把生命册的陈述局限于最后一组。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“并肩奋斗”保留原文的竞技意象；分为三句以理清长句关系，同时维持保罗恳切而肯定的语气。
