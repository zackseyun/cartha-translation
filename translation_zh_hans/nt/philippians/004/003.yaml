  terminology: “福音”“同工”“生命册”均合乎现代中文基督教文本的常用庄重表达。“并肩奋斗”恰当地反映συναθλέω的共同奋力意象。将呼语改为“真诚的同伴”，并在脚注保留“真正同负一轭的人”的较直译说法，可避免把γνήσιος过度具体化为“忠实”。
