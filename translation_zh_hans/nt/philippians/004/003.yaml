  to: 是的，我也请你这位真诚的同伴[a]帮助她们。她们曾在福音的事上与我并肩奋斗；一同奋斗的还有革利免和我其余的同工。这些人的名字都在生命册上。
  rationale: 仅作两项安全修订：将“忠实的同伴”调整为更贴近γνήσιε、且不额外限定品格含义的“真诚的同伴”；将未经证实的中文人名音译改为“Syzygus”。其余句法安排、女性复数指代、共同奋斗的关系，以及“生命册”的传统术语均可保留。
