  text: Ἐχάρην δὲ ἐν κυρίῳ μεγάλως ὅτι ἤδη ποτὲ ἀνεθάλετε τὸ ὑπὲρ ἐμοῦ φρονεῖν, ἐφ’ ᾧ καὶ ἐφρονεῖτε ἠκαιρεῖσθε δέ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/010.yaml
  text: I rejoiced greatly in the Lord that now at last you have revived your concern for me[a]; indeed, you were concerned[b], but you lacked opportunity.
translation:
  language: zh_hans
  text: 我在主里大大欢喜，因为你们对我的关怀如今终于又重新萌发了[a]。其实，你们原是关心我的[b]，只是没有机会。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“如今你们终于再次表现出对我的关怀”；原文直译为“你们再次开花”，用以比喻关怀重新复苏。
    reason: lexical_alternative
  - marker: b
    text: 或译：“你们原是惦念着我的”；原文动词可指思念、留心或关心某人。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐχάρην
  choice: 我……喜乐
  rationale: 采用简洁的过去事件表达，保留保罗亲自因腓立比人的行动而欢喜之意；汉语由上下文自然表达已发生的动作。
- source_word: ἐν κυρίῳ
  choice: 在主里
  rationale: 保留保罗惯用的神学表达，可兼指喜乐的领域、关系与根据，不缩减为单纯的“因主”。
- source_word: μεγάλως
  choice: 大大
  rationale: 自然而庄重地保留程度副词的强调，并直接修饰“喜乐”。
- source_word: ἤδη ποτὲ
  choice: 如今……终于
  rationale: 表达经过一段间隔后事情再次显明或实现；“终于”在此陈述时机，不必然含责怪意味。
- source_word: ἀνεθάλετε
  choice: 重新萌发
  rationale: 保留该词“再次开花、复苏”的植物意象，同时与“关怀”搭配仍能为现代读者理解；脚注说明也可译为较少比喻性的“重新表现”。
- source_word: τὸ ὑπὲρ ἐμοῦ φρονεῖν
  choice: 对我的关怀
  rationale: φρονέω在语境中不只是认知活动，也包含挂念和实际关切；“关怀”能体现其关系性与实践意味。
- source_word: ἐφ’ ᾧ
  choice: 其实
  rationale: 按上下文作解释性衔接，引出保罗的澄清：他们并非先前不关心，而是缺少机会。
- source_word: ἐφρονεῖτε
  choice: 你们一直关心我
  rationale: 与前面的φρονεῖν保持语义对应；“一直”自然传达未完成时所呈现的持续状态，同时避免暗示他们曾停止关心。
- source_word: ἠκαιρεῖσθε
  choice: 没有机会
  rationale: 指出缺少合适时机或条件，而非缺少意愿；现代汉语简洁自然。
theological_decisions:
- issue: “在主里”与喜乐的关系
  choice: 保留“在主里”
  alternative: 译作“因主而”或“靠着主”
  rationale: 原文ἐν κυρίῳ可表达领域、关系或根据；直保留这一保罗式表达，避免只确定为单一因果或能力来源。
- issue: 腓立比人此前是否停止关心保罗
  choice: 译为“其实，你们一直关心我，只是没有机会”
  alternative: 理解为他们先前不再关心、如今才恢复
  rationale: 后半句明确肯定他们原有的关切，并将问题归于缺少机会，因此不应暗示属灵冷淡或故意忽略。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“大大喜乐”“在主里”保留经文语体；“重新萌发”保存原文鲜明比喻，并由脚注提供较少比喻性的译法。主文中的[a]、[b]均与脚注对应。
