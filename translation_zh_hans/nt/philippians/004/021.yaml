id: PHP.4.21
reference: Philippians 4:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ἀσπάσασθε πάντα ἅγιον ἐν Χριστῷ Ἰησοῦ. ἀσπάζονται ὑμᾶς οἱ σὺν ἐμοὶ ἀδελφοί.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/021.yaml
  text: Greet every saint in Messiah Jesus[b][a]. The brothers with me greet you.
translation:
  language: zh_hans
  text: 请问候在弥赛亚耶稣里的每一位圣徒[a]。跟我在一起的弟兄们[b]都向你们问安。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弥赛亚”也常译作“基督”。
    reason: lexical_alternative
  - marker: b
    text: 这里的“弟兄们”按语境也可能广指与保罗同在的信徒，包括弟兄姊妹。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάσασθε
  choice: 请问候
  rationale: 这是书信结尾中传达问候的命令式；“请问候”既准确表达祈使语气，也符合现代汉语礼貌而自然的表达。
- source_word: πάντα ἅγιον
  choice: 每一位圣徒
  rationale: 单数 πᾶς 与单数名词连用具有逐一、分配性的含义；“每一位圣徒”自然保留这一点，并以“圣徒”表达归神为圣之人的身份。
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: 在弥赛亚耶稣里
  rationale: ἐν 保留联合或归属的关系表达；Χριστός 在此作为称号，译为“弥赛亚”，同时以脚注提供传统译法“基督”。
- source_word: ἀσπάζονται ὑμᾶς
  choice: 都向你们问安
  rationale: 在书信问候语境中，“向你们问安”比逐字重复“问候你们”更自然；“你们”准确反映复数 ὑμᾶς，“都”呼应复数主语。
- source_word: οἱ σὺν ἐμοὶ ἀδελφοί
  choice: 跟我在一起的弟兄们
  rationale: “跟我在一起”自然表达 σὺν ἐμοί；主文保留 ἀδελφοί 的阳性复数形式“弟兄们”，并用脚注说明其在语境中可能涵盖更广的同信群体。
theological_decisions:
- issue: Χριστός 作为称号的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 原词意为受膏者，并在此作为耶稣的称号；主文采用透明表达其称号意义的“弥赛亚”，脚注保留汉语基督教传统中熟悉的“基督”。
- issue: “在弥赛亚耶稣里”的关系含义
  choice: 保留“在……里”的原文表达
  alternative: 属于弥赛亚耶稣／与弥赛亚耶稣联合
  rationale: 原文介词短语可承载归属、联合或关系范围等彼此相关的含义；直译结构可保留其神学张力，避免只限定为一种解释。
translation_notes:
  register: 采用现代、庄重而易懂的书信语体。“请问候”表达命令式而不显生硬；“向你们问安”符合汉语书信结语习惯。主文中的所有脚注标记均紧随其所说明的词语。
