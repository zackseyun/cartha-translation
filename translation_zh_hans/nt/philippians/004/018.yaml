revisions:
- from: 不过，我已经全数收到了[a]，而且有余。我从以巴弗提收到了你们送来的东西，如今供应充足；这礼物是馨香之气，是蒙悦纳的祭物，是上帝所喜悦的。
  to: 不过，我已经全数收到了[a]，而且绰有余裕；我从以巴弗提那里收到了你们送来的馈赠，已经十分充足。这馈赠是馨香之气，是蒙悦纳、为上帝所喜悦的祭物。
  rationale: 修订不改变原文的收受、丰足与祭祀隐喻。以“馈赠”替代“东西”，并将保罗因收到馈赠而“已经十分充足”的状态明确表达出来；最后将“蒙悦纳”和“为上帝所喜悦”并列修饰“祭物”，更贴近希腊文的结构与意义。
