  text: ἀπέχω δὲ πάντα καὶ περισσεύω· πεπλήρωμαι δεξάμενος παρὰ Ἐπαφροδίτου τὰ παρ’ ὑμῶν, ὀσμὴν εὐωδίας, θυσίαν δεκτήν, εὐάρεστον τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/018.yaml
  text: But I have received everything[a], and I abound. I am fully supplied, having received from Epaphroditus what came from you—a fragrant aroma, an acceptable sacrifice, pleasing to God.
translation:
  language: zh_hans
  text: 不过，我已经全数收到了[a]，而且绰有余裕；我从以巴弗提那里收到了你们送来的馈赠，已经十分充足。这馈赠是馨香之气，是蒙悦纳、为上帝所喜悦的祭物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我已经全都收足了”；也可能带有“款项已经收清”的意思。
    reason: 词义选择：ἀπέχω在本语境中可泛指“收到”，也可能带有足额收讫或结清的商业语感。
lexical_decisions:
- source_word: ἀπέχω
  choice: 我已经全数收到了
  rationale: 该动词在收受财物的语境中可表示“收到”或“收足”。译作“已经全数收到了”既体现完成、足额在手的语感，也保留与商业收据用语可能存在的联系，而不把经文限定为正式清偿。
- source_word: πάντα
  choice: 全数
  rationale: 概括腓立比信徒所送来的一切；与“收到了”搭配自然，并表达完整范围。
- source_word: περισσεύω
  choice: 有余
  rationale: 表达超过所需、富有余裕，简洁保留与后文“供应充足”相呼应的充盈语义。
- source_word: πεπλήρωμαι
  choice: 如今供应充足
  rationale: 完成时强调因收到馈赠而形成并持续至今的充足状态；结合物质支持的上下文译出实际含义。
- source_word: δεξάμενος
  choice: 我从……收到了
  rationale: 将分词自然转化为汉语谓语，说明保罗处于供应充足状态的缘由。
- source_word: παρὰ Ἐπαφροδίτου
  choice: 从以巴弗提
  rationale: 直译直接来源；随后“你们送来的”表明礼物最终来自腓立比信徒，因此无需改译为“借着”。
- source_word: τὰ παρ’ ὑμῶν
  choice: 你们送来的东西
  rationale: 明确指腓立比信徒所提供并托人带来的馈赠，同时不额外指定具体物品。
- source_word: ὀσμὴν εὐωδίας
  choice: 馨香之气
  rationale: 保留源于祭祀和敬拜语境的固定意象，庄重而为现代中文读者所能理解。
- source_word: θυσίαν δεκτήν
  choice: 蒙悦纳的祭物
  rationale: 保留“祭物”的敬拜隐喻，并以“蒙悦纳”表达其被上帝接纳的性质。
- source_word: εὐάρεστον τῷ θεῷ
  choice: 上帝所喜悦的
  rationale: 准确表达该礼物令上帝喜悦；用关系结构承接前面的“祭物”，自然且庄重。
theological_decisions:
- issue: 把腓立比信徒的物质馈赠描写为祭物
  choice: 完整保留“馨香之气—蒙悦纳的祭物—上帝所喜悦”的献祭意象
  alternative: 将其意译为一般性的感谢，或仅说这是上帝悦纳的礼物
  rationale: 原文有意用祭祀敬拜语言解释信徒的馈赠。保留连续意象能呈现馈赠作为敬拜行为的神学力度，又不把隐喻实体化或加入特定宗派解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“不过”承接上文并保留 δέ 的轻微转折；以分号划分保罗自身供应充足与礼物作为祭物的评价。保留“馨香之气”和“祭物”的经文敬拜语域，避免把祭祀意象淡化为普通感谢。
