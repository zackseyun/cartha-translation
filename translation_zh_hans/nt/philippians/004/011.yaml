  text: οὐχ ὅτι καθ’ ὑστέρησιν λέγω, ἐγὼ γὰρ ἔμαθον ἐν οἷς εἰμι αὐτάρκης εἶναι·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/011.yaml
  text: Not that I am speaking from need[a], for I have learned to be content in whatever circumstances I am in.
translation:
  language: zh_hans
  text: 我并不是因为缺乏才这样说；因为我已经学会，无论处在什么境况，都能知足。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“自足”。这个希腊词可指自身足够，不过这里按上下文译作“知足”。
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ὑστέρησιν
  choice: 因为缺乏
  rationale: 该短语表示因匮乏或短缺而说话；“因为缺乏”自然地表明保罗并非出于个人所缺才这样说。
- source_word: λέγω
  choice: 才这样说
  rationale: 结合上文语境补出“这样”，以自然的现代汉语表达当前这番话，同时没有增添新的命题内容。
- source_word: ἔμαθον
  choice: 已经学会
  rationale: 不定过去时指向已经发生的学习过程，而所得能力延续至今；“已经学会”在汉语中自然表达这种当前相关性。
- source_word: ἐν οἷς εἰμι
  choice: 无论处在什么境况
  rationale: 这一关系结构在此指所处的各种情形，而非单纯空间位置；该译法简洁保留其概括性。
- source_word: αὐτάρκης
  choice: 知足
  rationale: 此处表示在不同境况中有满足、够用的状态。“知足”符合上下文，也避免把自主而不倚赖他人的哲学意味过度写入正文。
theological_decisions:
- issue: αὐτάρκης可能包含的自足意味
  choice: 正文译作“知足”
  alternative: 自足
  rationale: 上下文强调保罗在各种境况中学得的满足状态，随后又说明力量的来源（4:13）。“知足”不将其误解为绝对独立，同时脚注保留“自足”这一真实的词义可能。
translation_notes:
  register: 采用现代、庄重而通顺的标准普通话。“我并不是……才……”自然承接上文；“无论处在什么境况，都能知足”清楚表达原文的普遍范围。脚注标记置于其所说明的“知足”之后。
