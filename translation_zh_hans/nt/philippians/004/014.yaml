  text: πλὴν καλῶς ἐποιήσατε συγκοινωνήσαντές μου τῇ θλίψει.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/014.yaml
  text: Nevertheless[b][a], you did well by sharing in my affliction.
translation:
  language: zh_hans
  text: 不过，你们分担我的患难，做得很好。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“然而，你们在我的患难中与我一同有分，做得很好。”
    reason: 保留πλὴν可译为“然而”的转折，以及συγκοινωνήσαντες所含与保罗共同参与、同有分的较直译表达。
lexical_decisions:
- source_word: πλὴν
  choice: 不过
  rationale: 表示与上文的轻微转折：保罗虽已说明自己无论处境如何都能知足，仍肯定腓立比人的帮助；“不过”自然且不过度强化对立。
- source_word: καλῶς ἐποιήσατε
  choice: 确实做得好
  rationale: 保留对腓立比人行动的明确肯定；加入“确实”使现代汉语句势自然，也衔接前面的转折。
- source_word: συγκοινωνήσαντές
  choice: 分担
  rationale: 该词表达共同参与、成为同伴；与“患难”搭配时，“分担”简洁自然，并保留他们实际参与保罗困境的关系性含义。
- source_word: μου τῇ θλίψει
  choice: 我的患难
  rationale: μου在此与“患难”形成自然的所属关系；θλῖψις指压力、困苦或患难，“患难”兼具分量与庄重感，又不夸大为末世性的“大灾难”。
theological_decisions:
- issue: 腓立比人参与保罗患难的具体方式
  choice: 采用概括性的“分担我的患难”
  alternative: “与我一同经历患难”或“在我的患难上与我有分”
  rationale: 原文强调共同参与，但本节未单独限定这种参与只是金钱资助或亲身受苦；概括表达保留语义范围和上下文张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不过”形成温和转折；“分担我的患难”简练自然。脚注提供较形式对应的译法，并避免把共同参与狭义化为单一形式的援助。
