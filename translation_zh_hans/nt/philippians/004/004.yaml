  text: Rejoice in the Lord always[a]; again I will say[b], rejoice.
translation:
  language: zh_hans
  text: 你们要始终在主里喜乐[a]；我再说一次[b]：你们要喜乐！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们要始终在主里欢喜。”
    reason: lexical_alternative
  - marker: b
    text: 直译：“我再一次要说：你们要喜乐。”
    reason: lexical_alternative
lexical_decisions:
- source_word: Χαίρετε
  choice: 你们要喜乐
  rationale: 这是现在时主动语态第二人称复数命令式。“你们要喜乐”既明确表达对众人的劝勉，也保留保罗此处郑重而持续的命令语气。
- source_word: ἐν
  choice: 在……里
  rationale: 此处最自然地表示范围或关系，即在与主的联合和关系中；直译为“在……里”能保留原文的神学广度，不限定为原因或凭借。
- source_word: κυρίῳ
  choice: 主
  rationale: κύριος在此依保罗书信的用法指基督；“主”是现代中文圣经语体中自然、庄重且准确的对应。
- source_word: πάντοτε
  choice: 常常
  rationale: “常常”在现代汉语中自然地表达贯常、任何时候都如此的意思；这里不是仅指高频发生。
- source_word: πάλιν
  choice: 再……一遍
  rationale: πάλιν引出强调性的重复；“再说一遍”符合现代汉语习惯，并清楚呈现保罗重申命令的修辞作用。
- source_word: ἐρῶ
  choice: 我再说一遍
  rationale: ἐρῶ是将来时主动直陈语气。“我再说一遍”在中文中可自然表达紧接着将要重申的话，比生硬的“我将说”更合乎语用，同时没有改成单纯现在时。
- source_word: χαίρετε
  choice: 你们要喜乐
  rationale: 重复的命令与前一句保持一致，以保存原文的强调；句末感叹号自然传达劝勉力度。
theological_decisions:
- issue: “在主里”的含义
  choice: 保留范围／关系含义：信徒受命在与主的关系和联合中喜乐，而不只是因主而喜乐。
  alternative: 也可能带有“靠主的能力”这一凭借义，或“因为主”这一原因义。
  rationale: 保罗惯用的ἐν κυρίῳ常表示关系或所属范围。“在主里”能保留其神学张力，不把含义收窄为原因或能力来源。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“喜乐”虽略带圣经语体色彩，但在基督教语境中清楚自然，并能比“高兴”更好承载χαίρω的劝勉语气。第二人称复数明确译作“你们”。以分句和冒号呈现原文的重复强调。
