source:
  edition: SBLGNT
  text: ὥστε, ἀδελφοί μου ἀγαπητοὶ καὶ ἐπιπόθητοι, χαρὰ καὶ στέφανός μου, οὕτως στήκετε ἐν κυρίῳ, ἀγαπητοί.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/001.yaml
  text: So then[a], my beloved and longed-for brothers, my joy and crown, stand firm in the Lord in this way[b], beloved.
translation:
  language: zh_hans
  text: 所以，我所亲爱、所深深想念的弟兄们[a]，你们是我的喜乐和冠冕[b]；亲爱的弟兄们，你们要这样在主里站立得稳。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄们”对应希腊语的阳性形式；在这里，保罗是对会众中的信徒说话，并非只指男性。
    reason: cultural_note
  - marker: b
    text: 也可译作“得胜者的花冠”；希腊语这个词指颁给优胜者的花冠或冠冕。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: 所以
  rationale: 表示由前文引出的推论和劝勉，符合现代汉语的自然衔接。
- source_word: ἀδελφοί
  choice: 弟兄们
  rationale: 对应希腊语阳性复数呼格，同时保留初期教会群体中的亲属称谓；上下文所指范围在脚注中说明。
- source_word: ἀγαπητοί
  choice: 所亲爱的／亲爱的
  rationale: 保留保罗亲切而郑重的称呼，并在句首和句末两处都译出，以呈现原文的重复强调。
- source_word: ἐπιπόθητοι
  choice: 所想念的
  rationale: 自然表达因深切思念而渴望相见的含义，不把情感弱化为一般问候。
- source_word: χαρά
  choice: 喜乐
  rationale: 准确保留保罗称腓立比信徒本身为他喜乐的表述。
- source_word: στέφανος
  choice: 冠冕
  rationale: 采用现代中文圣经语体中自然且易懂的对应词；其获胜者花冠的具体意象以脚注说明。
- source_word: οὕτως
  choice: 这样
  rationale: 明确保留方式副词的作用，也保留其与前文劝勉相连的可能性。
- source_word: στήκετε
  choice: 站立得稳
  rationale: 既保留站立的形象，也清楚传达坚定持守的命令语气。
- source_word: ἐν κυρίῳ
  choice: 在主里
  rationale: 保留保罗常用表达中的关系性和领域性含义，不进一步释义为某一种特定神学解释。
theological_decisions:
- issue: ἀδελφοί所代表的对象范围
  choice: 正文译作“弟兄们”，脚注说明这里是对会众中的信徒说话，并非只指男性。
  alternative: 弟兄姊妹／信徒同胞
  rationale: 正文保留原文阳性复数称谓的形式特征，同时通过脚注呈现其在该语境中的群体性范围。
- issue: οὕτως的指向
  choice: 译作“这样”，不在正文中明确限定它只回指前文或只预指后文。
  alternative: 因此要在主里站稳／要按上述方式在主里站稳
  rationale: 原文可自然承接前文，同时也引入当前劝勉；简洁的“这样”保存这种衔接张力。
- issue: ἐν κυρίῳ的关系含义
  choice: 译作“在主里”。
  alternative: 靠着主／与主联合
  rationale: 直译保留该短语可能包含的归属、关系、领域及能力来源等丰富含义，避免只选定其中一种。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。首句以“我所亲爱、所想念的弟兄们”呈现两个并列形容词；末句再次译出“亲爱的弟兄们”，保留原文首尾呼应的深厚情感。“你们就是”补出汉语判断结构，使“我的喜乐和冠冕”自然清楚。
