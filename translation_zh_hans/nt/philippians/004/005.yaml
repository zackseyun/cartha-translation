  text: τὸ ἐπιεικὲς ὑμῶν γνωσθήτω πᾶσιν ἀνθρώποις. ὁ κύριος ἐγγύς·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/005.yaml
  text: Let your graciousness be known to all people[b][a]. The Lord is near.
translation:
  language: zh_hans
  text: 你们的宽厚要让所有人都知道。主近了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “主近了”可以指主就在近旁，也可以指主来临的日子近了，或兼有这两层意思。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπιεικές
  choice: 宽厚
  rationale: 该词在这里不只指性情温和，也包含体谅、谦让、不苛刻地待人。“宽厚”在现代汉语中较自然地涵盖这种广泛的伦理品格。
- source_word: γνωσθήτω
  choice: 要让……都知道
  rationale: 以汉语使动表达自然传达被动命令语气，意思是这种品格应当为人所知、明显可见。
- source_word: πᾶσιν ἀνθρώποις
  choice: 所有人
  rationale: 准确表达范围的普遍性，并避免不必要的性别限定。
- source_word: κύριος
  choice: 主
  rationale: 保留 κύριος 作为尊称及其神学分量，也是现代汉语圣经语体中的自然译法。
- source_word: ἐγγύς
  choice: 近了
  rationale: “近了”保留原文可能兼有空间上的临近与时间上的临近，不把含义限定为主就在身旁或主即将来临。
theological_decisions:
- issue: ὁ κύριος ἐγγύς 的含义
  choice: 主近了
  alternative: 主就在近旁；主快要来了
  rationale: 原文可指主临近同在，也可指主来临的时间近了，或兼有两义。正文采用不作限定的表达，以保留这一神学张力。
translation_notes:
  register: 采用现代、简洁、庄重的普通话。“宽厚”避免把 ἐπιεικές 缩窄为单纯的温柔性情；句式清楚，适合普通读者。脚注标记置于其所解释的第二句之后。
