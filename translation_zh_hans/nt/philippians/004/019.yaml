id: PHP.4.19
reference: Philippians 4:19
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ δὲ θεός μου πληρώσει πᾶσαν χρείαν ὑμῶν κατὰ ⸂τὸ πλοῦτος⸃ αὐτοῦ ἐν δόξῃ ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/019.yaml
  text: And my God will supply every need of yours according to his riches in glory in Messiah Jesus[a][b][c][d].
translation:
  language: zh_hans
  text: 而我的神必照着他的丰盛，在荣耀中、在弥赛亚耶稣里，满足你们一切的需要。[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弥赛亚耶稣”也可译作“基督耶稣”。
    reason: lexical_alternative
  - marker: b
    text: “照着他的丰盛”表示神供应的尺度与他的丰盛相称，不只是说供应来自他的丰盛。
    reason: alternative_reading
  - marker: c
    text: “在荣耀中”也可能理解为“荣耀地”；原文中它与前后成分的具体修饰关系并未完全限定。
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ θεός μου
  choice: 而我的神
  rationale: δέ在这里是轻微的承接词；“而”既衔接上文，也不过分强化转折。“我的神”保留保罗带有个人见证色彩的表达。
- source_word: πληρώσει
  choice: 必……满足
  rationale: πληρόω在此指补足所缺、供应需要。“满足……需要”是现代汉语中自然且贴合语境的表达；“必”体现将来陈述中的确信。
- source_word: πᾶσαν χρείαν ὑμῶν
  choice: 你们一切的需要
  rationale: χρεία指需要或必需之物；“一切的需要”保留πᾶσαν的周全意味，同时不把经文扩展为满足一切欲望。
- source_word: κατὰ τὸ πλοῦτος αὐτοῦ
  choice: 照着他的丰盛
  rationale: κατά加宾格表示尺度或准则，而不只是来源。“照着”保留按其丰盛之程度供应的含义；πλοῦτος在此用“丰盛”比直译“财富”更适合描述神充足的资源。
- source_word: ἐν δόξῃ
  choice: 在荣耀中
  rationale: 保留介词短语的形式及其修饰关系上的开放性，不武断限定为“荣耀地”或只与“丰盛”相连。
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: 在弥赛亚耶稣里
  rationale: Χριστός在此仍是称号，译作“弥赛亚”显明其“受膏者”的身份；“在……里”保留保罗所用联合或领域性表达，而不将其释义化。
theological_decisions:
- issue: Χριστός在ἐν Χριστῷ Ἰησοῦ中的译法
  choice: 在弥赛亚耶稣里
  alternative: 在基督耶稣里
  rationale: 此处Χριστός可辨认为称号，因此正文译作“弥赛亚”；传统且已名称化的“基督”保留在脚注中，避免排除另一种正当理解。
- issue: ἐν δόξῃ的归属与语义
  choice: 保留为“在荣耀中”
  alternative: “荣耀地”或将其理解为修饰“他的丰盛”
  rationale: 希腊文允许介词短语与供应的方式、领域，或神的丰盛发生联系。正文维持原文张力，不以解释性改写固定其修饰范围。
- issue: 神供应的范围
  choice: 满足“你们一切的需要”
  alternative: 满足“一切愿望”
  rationale: χρεία明确指需要、缺乏之物，不支持将应许扩大为满足人的所有愿望。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“照着他的丰盛”略带经文语体，但能准确表达κατά所指的尺度；两个“在……”短语用顿号分隔，以提升可读性，同时避免用标点武断确定其句法归属。
