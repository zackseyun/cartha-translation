  text: ἀσπάζονται ὑμᾶς πάντες οἱ ἅγιοι, μάλιστα δὲ οἱ ἐκ τῆς Καίσαρος οἰκίας.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/022.yaml
  text: All the saints greet you[a], especially those of Caesar’s household.
translation:
  language: zh_hans
  text: 众圣徒都向你们问安，尤其是凯撒家中的人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “凯撒家中的人”也可译作“来自凯撒家中的人”。这词组指与皇帝家户或宫廷体系有关联的人，不一定是凯撒的亲属。
    reason: 说明οἱ ἐκ τῆς Καίσαρος οἰκίας可指帝国家户体系中的各类关联人员，避免将其误解为仅指凯撒的家属；同时保留ἐκ的“来自／出自”这一可选表达。
lexical_decisions:
- source_word: ἀσπάζονται
  choice: 向……问安
  rationale: 这是书信结尾常用的问候语；“向你们问安”符合现代汉语书信语体，也保留了直接致意的意味。
- source_word: πάντες οἱ ἅγιοι
  choice: 众圣徒
  rationale: ἅγιοι 是保罗对信徒群体的常用称谓。“众圣徒”保留其词汇和神学色彩，又不把它解释性改写为“所有信徒”或“上帝的子民”。
- source_word: μάλιστα δὲ
  choice: 尤其是
  rationale: 该短语从整个群体中特别突出一部分人；“尤其是”自然地表达这种强调，δέ 无须另行硬译。
- source_word: οἱ ἐκ τῆς Καίσαρος οἰκίας
  choice: 凯撒府上的人
  rationale: ἐκ τῆς…οἰκίας 在这里指隶属或关联于凯撒家府体系的人。“府上的人”比“家人”涵盖面更广，不把他们限定为血亲，同时保持简洁自然。
- source_word: Καίσαρος
  choice: 凯撒
  rationale: 原文使用 Καῖσαρ 这一罗马帝国称号；音译“凯撒”保留历史措辞，不直接解释为“皇帝”。
theological_decisions:
- issue: 保罗书信中“圣徒”的所指
  choice: 保留“圣徒”，作为对信徒群体的称谓
  alternative: 译作“上帝的子民”或“信徒”
  rationale: 这里的“圣徒”并非仅指少数格外圣洁的人，而是对基督徒群体的称呼；保留原词可维持保罗用语的神学内涵，又避免用释义替代正文。
- issue: “凯撒府上的人”的身份范围
  choice: 译文不限定其为凯撒的亲属
  alternative: 理解并译作“凯撒的家人”
  rationale: οἰκία 可指家户及其所属人员，ἐκ 表明关联或归属；原文没有进一步说明这些人是亲属、奴仆、获释奴隶还是官员，因此不应缩窄其身份。
translation_notes:
  register: 采用现代、庄重而自然的书信语体。“问安”符合经文结语的语境；“众圣徒”保留保罗的惯用称谓；“凯撒府上”兼顾历史感与普通读者的可理解性。
