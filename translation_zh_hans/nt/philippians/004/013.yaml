    reason: alternative_reading
lexical_decisions:
- source_word: πάντα
  choice: 凡事
  rationale: πάντα是中性复数宾格，表达范围广泛的“所有事”。译作“凡事”保留原文的广度；结合上文保罗谈到富足、缺乏、饱足和饥饿，也自然包括各种处境。
- source_word: ἰσχύω
  choice: 都能应对
  rationale: ἰσχύω表示有力量、有能力。这里没有明说具体要“做”什么，而上文所指是面对各种境遇；“能应对”以现代汉语自然表达这种蒙赐力量而具有的能力，同时避免把本句误解为可以任意成就一切目标。
- source_word: ἐν
  choice: 靠着
  rationale: ἐν与指人的实体化分词连用，在此可表达能力所在的凭借或途径。“靠着”是自然的汉语表达，也保留能力并非出于保罗自身的含义。
- source_word: τῷ ἐνδυναμοῦντί με
  choice: 那赐我力量的
  rationale: 带冠词的现在时分词作名词性用法，直指“那位正在使我有力量者”。“那赐我力量的”保留持续赋能的意义，又不把本节希腊文本没有明说的名字加入正文。
theological_decisions:
- issue: “那赐我力量的”所指是谁
  choice: 正文保留“那赐我力量的”，不直接增译“基督”
  alternative: 靠着赐我力量的基督
  rationale: 上下文强烈指向基督，但本节希腊文本本身只写了实体化分词“那赐我力量的”。保留隐含指称，既忠于原文，也不否认上下文所提示的对象。
- issue: “凡事都能”是否表示毫无限制地达成任何目标
  choice: 译为“凡事都能应对”，按上下文表达在各种境遇中有能力面对
  alternative: 凡事都能做
  rationale: 上文列举缺乏、富足、饥饿和饱足，焦点是保罗在不同处境中都能持守和面对，而不是宣称能够完成任何设想之事。“应对”使语境意义清楚，同时以“凡事”保留πάντα的广度。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“凡事”保留原文的概括性，“应对”承接4:11—12所述的各种生活境遇；避免沿用容易被理解为无条件成就任何目标的口号式措辞。所有脚注标记均置于正文相应位置。
