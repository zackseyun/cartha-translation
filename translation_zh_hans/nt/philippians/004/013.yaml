  text: I am able to do all things through the one who strengthens me[a][b].
translation:
  language: zh_hans
  text: 我靠着那赐我力量的，凡事都能做[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我有能力应付一切。”原文表达范围较广；按上下文，主要指在各种处境中都有能力面对。
    reason: lexical_alternative
  - marker: b
