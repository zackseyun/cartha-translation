  text: ἃ καὶ ἐμάθετε καὶ παρελάβετε καὶ ἠκούσατε καὶ εἴδετε ἐν ἐμοί, ταῦτα πράσσετε· καὶ ὁ θεὸς τῆς εἰρήνης ἔσται μεθ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/009.yaml
  text: What you also learned and received and heard and saw in me—practice these things[b][a], and the God of peace will be with you.
translation:
  language: zh_hans
  text: 你们所学习、所领受、所听见，以及在我身上所看见的[a]，这些事，你们要实行[b]；平安的神必与你们同在。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在我身上所看见的”也可表达为“从我的榜样中所看到的”或“在我的生活中所看到的”。
    reason: lexical_alternative
  - marker: b
    text: “实行”或译“去做”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἃ
  choice: ……的；这些事
  rationale: 先用“……的”引出关系从句，再以“这些事”承接，既体现中性复数所指的多项内容，也符合现代汉语表达。
- source_word: ἐμάθετε
  choice: 所学习
  rationale: 表达腓立比信徒已经从教导中学到的内容，不额外限定学习方式。
- source_word: παρελάβετε
  choice: 所领受
  rationale: “领受”可涵盖接受教导或传承的意思，同时不把此词过度限定为正式的“传统”。
- source_word: ἠκούσατε
  choice: 所听见
  rationale: 保持与前后动词并列，并忠实保留原文未在此动词后明说“从我”的特点。
- source_word: εἴδετε ἐν ἐμοί
  choice: 在我身上所看见的
  rationale: 贴近原文介词短语，指信徒在保罗本人身上观察到的言行，同时不在正文中增添“榜样”或“生活”等解释。
- source_word: ταῦτα πράσσετε
  choice: 这些事都要实行
  rationale: “实行”传达把所学内容持续付诸行动的含义；“都”自然承接前列的多项内容，但不改变命令的范围。
- source_word: ὁ θεὸς τῆς εἰρήνης
  choice: 平安的神
  rationale: 直接保留属格表达及保罗书信中的称谓，避免解释性地改为“赐平安的神”。
- source_word: ἔσται μεθ’ ὑμῶν
  choice: 必与你们同在
  rationale: “必”自然表达将来时的应许语气，“与你们同在”直接对应神的临在。
theological_decisions:
- issue: 实行劝勉与神同在之间的关系
  choice: 用分号连接命令与应许，不添加条件连词
  alternative: 译为“你们若实行这些事，平安的神就必与你们同在”
  rationale: 原文以 καί 并列两句，并未采用明确的条件句式；这样既保留劝勉之后应许的紧密联系，也不把它强化为机械的因果条件。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。四个动词以“所……”结构平行排列，同时用“以及”使较长句子清晰易读；“平安的神”保留原文神学称谓的凝练与开放性。
