  text: Εὐοδίαν παρακαλῶ καὶ Συντύχην παρακαλῶ τὸ αὐτὸ φρονεῖν ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/002.yaml
  text: I urge Euodia[a], and I urge Syntyche, to think the same way in the Lord.
translation:
  language: zh_hans
  text: 我劝友阿蝶，也劝循都基，要在主里同心。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“要在主里有同样的心思”；也可能译作：“要在主里意见一致。”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐοδίαν
  choice: 友阿蝶
  rationale: 按现代中文圣经人名的通行音译处理，不按名字词义意译。
- source_word: παρακαλῶ
  choice: 我劝
  rationale: 表达保罗恳切而亲自的劝勉；原文对两位妇女分别重复该动词，译文也保留重复，以体现同等、分别劝告的语气。
- source_word: Συντύχην
  choice: 循都基
  rationale: 按现代中文圣经人名的通行音译处理，不按名字词义意译。
- source_word: τὸ αὐτὸ φρονεῖν
  choice: 同心
  rationale: φρονεῖν兼有思想、心态和取向的意味；“同心”在现代中文中自然凝练，可表达共同心志，但不强行限定为对每件事意见完全一致。脚注保留较贴近形式的译法。
- source_word: ἐν κυρίῳ
  choice: 在主里
  rationale: 保留原文关系性和神学性的表达，表明所劝的共同心志以主为范围和根基，并非仅指一般的人际和解。
theological_decisions:
- issue: τὸ αὐτὸ φρονεῖν所指的合一程度
  choice: 译作“同心”
  alternative: “有同样的心思”或“在主里意见一致”
  rationale: 原文可以指相同的心态、取向或思想，并不明确要求所有具体意见都相同；采用“同心”并以脚注说明，以保留这一张力。
translation_notes:
  register: 采用自然、庄重而简洁的现代标准汉语。保留“我劝……也劝……”的平行重复，避免把保罗对两人的分别劝告压缩成笼统命令。
