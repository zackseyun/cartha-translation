base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/020.yaml
  text: To our God and Father be the glory forever and ever[a]. Amen.
translation:
  language: zh_hans
  text: 愿荣耀归给我们的神和父，直到永永远远[a]。阿们！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较直译：“直到万世的万世。”这是表示永无穷尽的强化说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: 不单独译出
  rationale: 此处是轻微的连接或转折成分，用于引出结尾的颂赞；汉语直接进入颂赞更自然，且上下文足以体现衔接关系。
- source_word: τῷ θεῷ καὶ πατρὶ ἡμῶν
  choice: 我们的父神
  rationale: 两个名词共同指向同一位，ἡμῶν自然同时限定“神”和“父”；“我们的父神”是简洁、自然的现代汉语表达。
- source_word: ἡ δόξα
  choice: 愿荣耀归给
  rationale: 希腊文是无动词的颂赞公式；补出“愿……归给”既符合汉语句法，也保留祈愿式颂赞的功能，同时不把它僵硬地处理成单纯陈述。
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: 直到永永远远
  rationale: 这是表达无尽久远的强化习语；“直到永永远远”自然庄重，并保留原文层叠加强的修辞力量。
- source_word: ἀμήν
  choice: 阿们
  rationale: 采用现代汉语基督教传统中通行的音译，保留其礼仪性肯定作用。
theological_decisions:
- issue: 颂赞句中省略动词的补译
  choice: 愿荣耀归给
  alternative: 荣耀是属于；荣耀归给
  rationale: 原文没有明说动词，因此既可理解为祈愿式颂赞，也可理解为归属陈述。“愿荣耀归给”最贴合此处颂赞语用，但不将补出的动词误当作原文明确出现的形式。
- issue: θεῷ καὶ πατρὶ ἡμῶν所指的关系
  choice: 我们的父神
  alternative: 神和我们的父；神，就是我们的父
  rationale: 该短语最自然地指同一位既是神又是父者；合并为“父神”避免让读者误以为是两个对象，同时不添加原文没有的解释性同位语。
translation_notes:
  register: 采用现代、庄重而易懂的颂赞语体。“永永远远”和“阿们”保留经文颂赞的节奏与礼仪色彩；感叹号体现结尾颂赞的力度。
