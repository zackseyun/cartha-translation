  text: οὐχ ὅτι ἐπιζητῶ τὸ δόμα, ἀλλὰ ἐπιζητῶ τὸν καρπὸν τὸν πλεονάζοντα εἰς λόγον ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/017.yaml
  text: Not that I seek the gift[a], but I seek the fruit that increases to your account.
translation:
  language: zh_hans
  text: 并不是我寻求馈赠，而是寻求那不断增多、记在你们账上的果实。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“而是寻求那在你们账上越发增多的果实。”
    reason: πλεονάζοντα εἰς λόγον ὑμῶν可较贴近字面地理解为“在你们账上增多的果实”；正文以“不断增多、记在你们账上的果实”较清楚地保留增长与记账的双重意象。
lexical_decisions:
- source_word: ἐπιζητῶ
  choice: 求
  rationale: 此词表示积极寻求或渴望；前后两次均译作“求”，保留原文的重复和对比。首处结合否定语境译为“贪求”，自然表达保罗并非图谋馈赠，并未改变动词的核心意义。
- source_word: δόμα
  choice: 馈赠
  rationale: 指腓立比人所赠之物。“馈赠”直接而庄重，也适合本节谈论资助的语境。
- source_word: καρπὸν
  choice: 果实
  rationale: 保留原文的结果或收成隐喻，不将其直接化约为“收益”，从而保留它与后面记账用语之间的张力。
- source_word: πλεονάζοντα
  choice: 不断加在
  rationale: 分词表达增长、增多；“不断”体现其持续意味，“加在……账上”也能自然连接后面的账目隐喻。
- source_word: εἰς λόγον ὑμῶν
  choice: 加在你们账上
  rationale: λόγος 在此承接4:15的商业记账语境；此译保留“记入账户”的隐喻，同时避免将其明确解释为某一种属灵奖赏。
- source_word: οὐχ ὅτι ... ἀλλὰ
  choice: 并不是……而是……
  rationale: 自然保留原文用于澄清的对照结构。
theological_decisions:
- issue: “果实”及“账目”所指的具体内容
  choice: 保留“果实”和“账上”的双重隐喻，不明确限定为今生福分、属灵成长或末日奖赏
  alternative: 译为“使你们得更多属灵益处”或“记作你们的赏赐”
  rationale: 原文没有明说果实的具体形态；保留隐喻可避免加入特定神学体系的解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“馈赠”比“礼物”略正式，符合保罗谈论教会资助的语境；“账上”保留商业核算意象，整句维持原文简洁有力的对照。
