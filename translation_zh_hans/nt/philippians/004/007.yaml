  text: καὶ ἡ εἰρήνη τοῦ θεοῦ ἡ ὑπερέχουσα πάντα νοῦν φρουρήσει τὰς καρδίας ὑμῶν καὶ τὰ νοήματα ὑμῶν ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/007.yaml
  text: And the peace of God[a], which surpasses all understanding, will guard your hearts and your minds in Messiah Jesus.
translation:
  language: zh_hans
  text: 神的平安，超越一切理解，必在弥赛亚耶稣里守护你们的心和意念。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弥赛亚耶稣”也可译为“基督耶稣”。
    reason: 说明Χριστός在该短语中的传统译法，同时保留正文将其作为称号译出的处理。
lexical_decisions:
- source_word: εἰρήνη τοῦ θεοῦ
  choice: 神的平安
  rationale: 按希腊文属格直译为“神的平安”，既可包含平安属于神，也不排除平安来自神；避免在正文中把属格单一解释为来源。
- source_word: ἡ ὑπερέχουσα πάντα νοῦν
  choice: 就是超越一切理解的平安
  rationale: ὑπερέχουσα 表示超过、胜过；πάντα νοῦν 在此自然指一切理解或领会能力。“超越一切理解”准确且符合现代汉语。补出“就是……的平安”使长定语清楚自然。
- source_word: φρουρήσει
  choice: 必……守护
  rationale: 该动词带有警戒、守卫的鲜明意味。“守护”保留其保护性意象；“必”表达将来陈述的确定语气。
- source_word: τὰς καρδίας ὑμῶν
  choice: 你们的心
  rationale: “心”保留圣经语境中人的内在生命、情感与意志中心等丰富含义；汉语中集合性单数比“心灵”或“心脏”更自然。
- source_word: τὰ νοήματα ὑμῶν
  choice: 你们的意念
  rationale: νοήματα 指思想、意念或思维活动。“意念”与“心”并列自然，又比笼统的“头脑”更贴近原词。
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: 在弥赛亚耶稣里
  rationale: ἐν 表达所处的领域或联合关系；Χριστός 在此保留称号意义，译为“弥赛亚”，同时用“在……里”保存保罗用语的空间隐喻。
theological_decisions:
- issue: τοῦ θεοῦ 是所属还是来源
  choice: 神的平安
  alternative: 神所赐的平安
  rationale: “神所赐的”明确限定为来源，虽符合上下文，却比希腊文属格更具解释性；正文采用较开放的“神的”。
- issue: ἐν Χριστῷ Ἰησοῦ 的表达
  choice: 在弥赛亚耶稣里
  alternative: 在基督耶稣里
  rationale: 译出 Χριστός 的称号含义，并保留“在……里”所表达的联合与生命领域，不把它弱化为一般工具或方式。
- issue: 神的平安与人的理解之间的关系
  choice: 超越一切理解
  alternative: 人无法理解
  rationale: 原文说这平安超过一切 νοῦς，并未断言人对它完全不能有任何理解；因此不采用更绝对的释义。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“神的平安”保存原文属格的开放性；“守护”传达 φρουρέω 的守卫意象；避免用“不可思议”等容易产生现代口语歧义的表达。
