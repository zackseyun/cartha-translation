  text: ἡ χάρις τοῦ κυρίου Ἰησοῦ Χριστοῦ μετὰ ⸂τοῦ πνεύματος⸃ ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/023.yaml
  text: The grace of the Lord Jesus Christ be with your spirit[a].
translation:
  language: zh_hans
  text: 愿主耶稣基督的恩典与你们的灵同在。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“愿主耶稣基督的恩典与你们众人同在”。
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: 恩典
  rationale: 这是保罗书信祝福语中的惯用词；“恩典”既保留神学分量，也自然表达所赐的恩惠。
- source_word: κυρίου
  choice: 主
  rationale: 此处是用于耶稣的尊称；“主”符合新约通常用法和现代汉语基督教语境。
- source_word: Ἰησοῦ Χριστοῦ
  choice: 耶稣基督
  rationale: “基督”是Χριστός在汉语中的通行称号，既为普通读者熟悉，也保留其作为受膏者称号的传统含义。
- source_word: μετά
  choice: 与……同在
  rationale: μετά接属格，在这句祝福语中表示伴随和临在；汉语用“与……同在”自然庄重。
- source_word: πνεύματος
  choice: 灵
  rationale: 上下文指收信人的灵或内在生命，并未明确指圣灵，因此译作小写意义的“灵”。
- source_word: ὑμῶν
  choice: 你们的
  rationale: 明确保留第二人称复数；单数“灵”可表达众信徒共同或各自的内在生命。
theological_decisions:
- issue: πνεῦμα是人的灵还是圣灵
  choice: 人的“灵”
  alternative: “圣灵”
  rationale: 属格ὑμῶν和保罗祝福语的表达方式更自然地指向收信人的灵；原文没有明确标示圣灵，不宜将所指神学化地限定为圣灵。
- issue: Χριστός译作“基督”还是“弥赛亚”
  choice: 基督
  alternative: 弥赛亚
  rationale: 此处Χριστός紧接“耶稣”，具有称号与固定称谓兼具的性质。“耶稣基督”是现代标准汉语中自然、庄重且广为理解的表达，同时不否认其“受膏者”的称号内涵。
- issue: 单数“灵”与复数“你们”的关系
  choice: 保留“你们的灵”
  alternative: 你们众人的心灵
  rationale: 原文以单数πνεύματος配复数ὑμῶν，可能带有集体意义，也可能概括每位收信人的内在生命；直译可保留这种张力，不另行解释。
translation_notes:
  register: 采用现代、庄重而易懂的书信祝福语体。“愿”补出希腊文省略的祝愿语气；“与你们的灵同在”保留原文单数“灵”与复数“你们”的搭配。脚注标记已置于正文相应位置。
