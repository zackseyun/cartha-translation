  text: οἶδα καὶ ταπεινοῦσθαι, οἶδα καὶ περισσεύειν· ἐν παντὶ καὶ ἐν πᾶσιν μεμύημαι, καὶ χορτάζεσθαι καὶ πεινᾶν, καὶ περισσεύειν καὶ ὑστερεῖσθαι·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/012.yaml
  text: 'I know how to be brought low, and I know how to abound. In every circumstance and in all things I have learned the secret: both to be well fed and to be hungry, both to abound and to be in need.'
translation:
  language: zh_hans
  text: 我知道怎样身处卑微，也知道怎样身处富足；无论面对什么事、处在什么境况中，我都已经学会了这个秘诀[a]：无论是吃饱还是挨饿，无论是有余还是缺乏。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 更直译为“我已经受过入门礼”或“我已经被引入奥秘”。保罗借用入门仪式的用语，比喻自己已经学会这个秘诀。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶδα
  choice: 我知道怎样
  rationale: 与后接不定式连用，表达从经历中获得的实际应对能力；“知道怎样”在现代汉语中自然，也不将其改写为单纯的抽象认知。
- source_word: ταπεινοῦσθαι
  choice: 处卑微
  rationale: 保留被降低、身处低微境况的含义，避免仅理解为内在谦卑的态度；“处卑微”也与下文的缺乏相呼应。
- source_word: περισσεύειν
  choice: 处丰富／有余
  rationale: 首次译为“处丰富”，与“处卑微”形成平行；再次译为“有余”，在“缺乏”的对照中更自然，并保留拥有超过所需之意。
- source_word: ἐν παντὶ καὶ ἐν πᾶσιν
  choice: 无论在什么事上、在什么处境中
  rationale: 以两个彼此相关但有区别的短语体现原文的铺陈和全面性，同时符合现代汉语表达。
- source_word: μεμύημαι
  choice: 我都学会了其中的秘诀
  rationale: 该词原指被引入某种奥秘，在此比喻保罗从各种经历中掌握了生活的秘诀；正文清楚传意，脚注保留其字面意象。
- source_word: χορτάζεσθαι
  choice: 吃饱
  rationale: 与“挨饿”构成明确的饮食对照，简洁自然。
- source_word: πεινᾶν
  choice: 挨饿
  rationale: 表达实际经历饥饿的处境，与“吃饱”平行。
- source_word: ὑστερεῖσθαι
  choice: 缺乏
  rationale: 保留广义的不足和匮乏，不限于金钱，并与“有余”形成简明对照。
