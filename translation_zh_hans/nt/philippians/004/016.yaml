  yaml_path: translation/nt/philippians/004/016.yaml
  text: because even in Thessalonica you sent for my need both once and twice[a].
translation:
  language: zh_hans
  text: 因为甚至在帖撒罗尼迦，你们也曾一次、两次送来，供给我的需要。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们不止一次送来，供给我的需要。”
    reason: 说明“一次、两次”这一希腊语重复表达可按现代汉语习惯理解为“不止一次”，而不限定为恰好两次。
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 承接上下文，引出保罗前述话语的原因或说明；“因为”在现代汉语中清楚自然。
- source_word: καὶ ἐν Θεσσαλονίκῃ
  choice: 甚至在帖撒罗尼迦时
  rationale: 保留 καί 在此可能具有的强调意味；结合上下文，用“时”自然表达保罗身处帖撒罗尼迦这一情境，而不增添具体时长。
- source_word: καὶ ἅπαξ καὶ δὶς
  choice: 也一次、两次地
  rationale: 较直接地保留希腊文“一次和两次”的强调表达，并以脚注给出更合乎现代汉语习惯的意译。
- source_word: εἰς τὴν χρείαν μοι
  choice: 供应我的需要
  rationale: 表达所送之物是为满足保罗的缺乏；“需要”保持 χρεία 的单数概念，中文无需机械区分单复数。
- source_word: ἐπέμψατε
  choice: 你们……送来
  rationale: 保留动词“差送、送来”的基本意义，不在正文中擅自补出“钱财”“礼物”或“帮助”等未明说的宾语。
theological_decisions: []
