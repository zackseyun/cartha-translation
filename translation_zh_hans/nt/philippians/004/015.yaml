source:
  edition: SBLGNT
  text: Οἴδατε δὲ καὶ ὑμεῖς, Φιλιππήσιοι, ὅτι ἐν ἀρχῇ τοῦ εὐαγγελίου, ὅτε ἐξῆλθον ἀπὸ Μακεδονίας, οὐδεμία μοι ἐκκλησία ἐκοινώνησεν εἰς λόγον δόσεως καὶ λήμψεως εἰ μὴ ὑμεῖς μόνοι,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/015.yaml
  text: And you yourselves also know[a], Philippians, that at the beginning of the gospel, when I departed from Macedonia, no church shared with me in the matter of giving and receiving except you alone.
translation:
  language: zh_hans
  text: 腓立比人哪，你们自己也知道：在福音起初的时候，当我离开马其顿时，没有一个教会在给与和接受的事上[a]与我有份，只有你们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “给与和接受的事”也可译作“给与和接受的账目”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδατε δὲ καὶ ὑμεῖς
  choice: 你们自己也知道
  rationale: 用现代汉语自然表达οἴδα的现在状态意义，并保留καί的附加意味和显明主语ὑμεῖς的强调；δὲ作为较弱的承接词，不必机械译出。
- source_word: Φιλιππήσιοι
  choice: 腓立比人哪
  rationale: 保留呼格式直接称呼；“哪”使书信中的呼语在庄重现代汉语中清楚自然。
- source_word: ἐν ἀρχῇ τοῦ εὐαγγελίου
  choice: 在福音传开的初期
  rationale: 该短语所指很可能是保罗与他们共同经历的福音事工初期；补出“传开”使现代汉语可懂，同时不把它限定为某一个具体事件。
- source_word: ὅτε ἐξῆλθον ἀπὸ Μακεδονίας
  choice: 我离开马其顿的时候
  rationale: “离开”准确、自然地表达ἐξέρχομαι在此处从某地出去的过去事件。
- source_word: οὐδεμία μοι ἐκκλησία ἐκοινώνησεν
  choice: 没有一个教会……与我有份
  rationale: “与我有份”保留κοινωνέω的共同参与含义，也符合本节经济资助的语境，而不将其缩窄为单纯捐款。
- source_word: εἰς λόγον δόσεως καὶ λήμψεως
  choice: 在收支的事上
  rationale: λόγος可指事项，也可带账目含义；“收支的事”既简洁地传达给予与收取的财务语境，也保留一定的会计色彩。
- source_word: εἰ μὴ ὑμεῖς μόνοι
  choice: 除了你们以外
  rationale: 自然表达排他结构；与前面的“没有一个教会”结合，已清楚保留“只有你们”的强调。
theological_decisions:
- issue: “给予和收取”所指的参与性质
  choice: 译为“在收支的事上与我有份”，保留经济往来与事工伙伴关系两层意味
  alternative: 译为“在给予和接受的账目上与我往来”，突出商业或会计术语
  rationale: 上下文明确涉及物质支持，但κοινωνέω表达的不限于商业交易；正文应避免把保罗与教会的关系处理成纯粹账务关系。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“腓立比人哪”保留直接呼语；“福音传开的初期”帮助普通读者理解时间所指；“与我有份”保留共同参与和支持的关系性。脚注标记置于整句末，以涵盖“收支的事”这一短语的译法说明。
