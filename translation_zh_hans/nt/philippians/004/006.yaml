id: PHP.4.6
reference: Philippians 4:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: μηδὲν μεριμνᾶτε, ἀλλ’ ἐν παντὶ τῇ προσευχῇ καὶ τῇ δεήσει μετ’ εὐχαριστίας τὰ αἰτήματα ὑμῶν γνωριζέσθω πρὸς τὸν θεόν·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/006.yaml
  text: Do not be anxious about anything[a], but in everything, by prayer and petition with thanksgiving[c][b], let your requests be made known to God.
translation:
  language: zh_hans
  text: 什么都不要忧虑[a]；反要无论什么事，借着祷告和恳求[b]，带着感恩，向上帝陈明你们的请求[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“什么都不要担忧。”
    reason: lexical_alternative
  - marker: b
    text: “恳求”也可译作“祈求”。
    reason: lexical_alternative
  - marker: c
    text: “向上帝”也可译作“在上帝面前”。
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲν μεριμνᾶτε
  choice: 什么都不要忧虑
  rationale: 否定词与命令式动词合起来，指不要为任何事陷入焦虑；此译法全面而符合现代汉语表达。
- source_word: ἐν παντὶ
  choice: 在每一件事上
  rationale: 保留原文涵盖一切处境的广度，同时比直译“在一切中”更自然。
- source_word: τῇ προσευχῇ
  choice: 祷告
  rationale: 这是 προσευχή 的常用对应词，泛指向上帝祷告。
- source_word: τῇ δεήσει
  choice: 恳求
  rationale: δέησις 指出于需要而作的具体祈求；“恳求”既与“祷告”有所区别，也保持迫切意味。
- source_word: μετ’ εὐχαριστίας
  choice: 带着感恩
  rationale: 保留祷告伴随感谢之意，表达自然、庄重。
- source_word: τὰ αἰτήματα ὑμῶν
  choice: 你们所求的
  rationale: 准确表达具体请求的内容，并避免与前面的“恳求”在汉语中重复。
- source_word: γνωριζέσθω
  choice: 把……告诉
  rationale: 原文是现在时被动命令式；汉语若机械保留被动会显得生硬，改用主动祈使结构可自然传达“使之为上帝所知”的命令语气。
- source_word: πρὸς τὸν θεόν
  choice: 告诉上帝
  rationale: πρός 在此最直接表示请求所指向的对象；“告诉上帝”与 γνωριζέσθω 搭配自然。
theological_decisions:
- issue: γνωριζέσθω πρὸς τὸν θεόν 是否暗示上帝原先不知道人的需要
  choice: 译作“把你们所求的告诉上帝”，只表达祷告中向上帝陈明所求
  alternative: 使你们所求的被上帝知道
  rationale: 原句要求信徒在祷告中将请求陈明在上帝面前，并不讨论上帝知识的范围；译文不额外作神学推论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“忧虑”比“焦虑”更适合经文劝勉的语域；“带着感恩”清楚修饰祷告与恳求的方式。脚注标记均紧随相关表达。
