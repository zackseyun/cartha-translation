  to: 什么都不要忧虑[a]；反要无论什么事，借着祷告和恳求[b]，带着感恩，向上帝陈明你们的请求[c]。
  rationale: 修订使中文句法更流畅，并以“向上帝陈明你们的请求”较贴切地表达“让你们的请求被带到上帝面前／使之为上帝所知”的祈使语气，而不对上帝是否知晓人的需要作额外神学推论。脚注 c 亦改为与其锚点和原文 πρὸς τὸν θεόν 相对应。
