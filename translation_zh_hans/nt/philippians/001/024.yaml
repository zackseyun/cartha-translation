  yaml_path: translation/nt/philippians/001/024.yaml
  text: But to remain in the flesh is more necessary for your sake[a].
translation:
  language: zh_hans
  text: 但为了你们的缘故，我继续留在肉身之中更为必要[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“继续活在身体中。”
    reason: 说明“继续留在肉身之中”可按其字面具身生命意义表达为继续活在身体中。
lexical_decisions:
- source_word: τὸ ἐπιμένειν
  choice: 继续留在
  rationale: 冠词化不定式在句中作名词性成分；“继续留在”既表达持续之意，也呼应上下文中保罗所说的离世与留下。
- source_word: δὲ
  choice: 但
  rationale: δέ在此转折于前文“离世与基督同在”的愿望，“但”自然地标明对比。
- source_word: ἐν τῇ σαρκὶ
  choice: 在肉身中
  rationale: 此处σάρξ指现今有身体的尘世生命，并非道德意义上的“罪性”；保留“肉身”可贴近原文，同时避免把含义完全释义化。
- source_word: ἀναγκαιότερον
  choice: 更为必要
  rationale: 保留希腊文比较级，表明相较于保罗个人所愿，为腓立比信徒继续活着更有必要。
- source_word: δι’ ὑμᾶς
  choice: 为了你们
  rationale: 上下文侧重保罗留下对信徒的益处；“为了你们”在现代汉语中自然地表达这一受益或目的关系。
theological_decisions:
- issue: 本节σάρξ的含义
  choice: 指有身体的尘世生命（“在肉身中”）
  alternative: 道德意义上的“罪性”，或释义为“继续活在世上”
  rationale: 上下文把“离世与基督同在”和保罗继续现今的身体生命相对照，不支持将σάρξ解释为罪性；正文保留原文意象，并以脚注给出自然释义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“肉身”保留原文用语及其神学张力；脚注帮助普通读者理解此处并非指“罪性”。
