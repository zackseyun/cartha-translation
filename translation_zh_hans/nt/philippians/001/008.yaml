  text: μάρτυς γάρ ⸀μου ὁ θεός, ὡς ἐπιποθῶ πάντας ὑμᾶς ἐν σπλάγχνοις ⸂Χριστοῦ Ἰησοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/008.yaml
  text: For God is my witness[b][a], how I long for all of you with the affections of Messiah Jesus.
translation:
  language: zh_hans
  text: 因为上帝为我作证，我是多么怀着弥赛亚耶稣的深情想念你们众人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弥赛亚耶稣”也可译作“基督耶稣”；“深情”也可译作“怜悯之心”。
    reason: 保留Χριστός的传统译法，并说明σπλάγχνα在本句中可侧重慈爱怜悯的词义。
lexical_decisions:
- source_word: μάρτυς γάρ μου ὁ θεός
  choice: 因为上帝可以为我作证
  rationale: 保留γάρ与上文的因果衔接，也以现代汉语中自然庄重的表达传达保罗郑重诉诸上帝、由上帝见证其真诚的语气。
- source_word: ὡς ἐπιποθῶ
  choice: 我是多么……想念
  rationale: ὡς在此突出程度，ἐπιποθῶ表达强烈的思念与渴望；“多么……想念”兼顾二者且符合现代汉语习惯。
- source_word: πάντας ὑμᾶς
  choice: 你们众人
  rationale: 明确保留πάντας的全体性强调，比单说“你们”更完整。
- source_word: ἐν σπλάγχνοις
  choice: 以……的深情
  rationale: σπλάγχνα字面指内脏，转喻发自内心的深厚感情、怜爱或慈怀；“深情”避免生硬直译，同时保留情感强度。
- source_word: Χριστοῦ Ἰησοῦ
  choice: 弥赛亚耶稣
  rationale: Χριστός在此虽处于保罗常用的称号—名字组合中，仍可传达“受膏者／弥赛亚”的称号意义；译作“弥赛亚耶稣”保留这一语义。
theological_decisions:
- issue: ἐν σπλάγχνοις Χριστοῦ Ἰησοῦ所表达的感情归属
  choice: 以弥赛亚耶稣的深情
  alternative: 怀着弥赛亚耶稣的怜悯之心
  rationale: 属格可理解为这深情源于、属于或体现弥赛亚耶稣；正文保留原文紧密而略带张力的表达，不把它限定为单纯模仿、领受或参与。
- issue: Χριστοῦ在称号—名字组合中的译法
  choice: 弥赛亚耶稣
  alternative: 基督耶稣
  rationale: 正文显明Χριστός的称号含义，同时以脚注保留中文基督教传统中更固定、更为熟悉的译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“上帝可以为我作证”自然传达郑重起誓式的见证用语；“深情”保留亲切与情感强度，避免将σπλάγχνα按身体器官直译。脚注标记置于整句相关译法之后。
