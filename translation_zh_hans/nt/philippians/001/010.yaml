  text: εἰς τὸ δοκιμάζειν ὑμᾶς τὰ διαφέροντα, ἵνα ἦτε εἰλικρινεῖς καὶ ἀπρόσκοποι εἰς ἡμέραν Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/010.yaml
  text: so that you may approve the things that are excellent[a], in order that you may be pure and blameless for the day of Messiah[b],
translation:
  language: zh_hans
  text: 为要使你们分辨什么是更美好的[a]，使你们纯洁、无可指责，以备弥赛亚[b]的日子来到[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“分辨什么是重要的”“认可更美好的事”；较直译为“分辨彼此不同的事”。
    reason: lexical_alternative
  - marker: b
    text: 传统译法：“基督”。“弥赛亚”和“基督”都意为“受膏者”。
    reason: alternative_reading
  - marker: c
    text: 也可译为“直到弥赛亚的日子”或“为弥赛亚的日子”。“无可指责”也可能含有“不跌倒”或“不使人跌倒”的意思。
    reason: lexical_and_syntactic_ambiguity
lexical_decisions:
- source_word: δοκιμάζειν
  choice: 辨明
  rationale: 该动词兼有检验、考察并在检验后认可之意；“辨明”在现代汉语中自然地表达经过判断而作出分辨。
- source_word: τὰ διαφέροντα
  choice: 哪些事更为美好
  rationale: 字面为“不同的事”，语境中可指更优越、更重要或更有价值的事；“哪些事更为美好”保留比较意味，同时避免把范围限定得过窄。
- source_word: εἰλικρινεῖς
  choice: 纯洁
  rationale: 该词可表示纯净、真诚或诚实；“纯洁”适合此处的伦理语境，也保留内在品格完整的含义。
- source_word: ἀπρόσκοποι
  choice: 无可指责
  rationale: 该词可指自己不跌倒，也可指不使别人跌倒或不冒犯人；正文采用概括性的伦理表达“无可指责”，其歧义另在注释说明。
- source_word: εἰς ἡμέραν Χριστοῦ
  choice: 迎接弥赛亚的日子
  rationale: εἰς带有朝向目标的意味；“迎接”自然表达以那日为指向的预备，而不武断地将其限定为单纯的时间延续。Χριστοῦ在此作为称号，译为“弥赛亚”。
theological_decisions:
- issue: 末世性短语εἰς ἡμέραν Χριστοῦ中Χριστοῦ的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处称那将临之日属于受膏者，称号意义明显，因此正文译出“弥赛亚”；传统且读者熟悉的“基督”保留在脚注中。
- issue: ἀπρόσκοποι所表达的伦理方向
  choice: 无可指责
  alternative: 不跌倒／不使人跌倒
  rationale: 原词可能着眼于信徒自身不绊跌，也可能着眼于不成为他人的绊脚石。正文不选定其中一端，脚注保留两种可能。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“辨明”体现检验后的判断；“迎接……的日子”表达εἰς的目标指向，并避免生硬的“为……日子”。正文简洁，原文中τὰ διαφέροντα、ἀπρόσκοποι及εἰς的真实歧义均由脚注保留。
