    rationale: τὸ ἀποθανεῖν指“死去／死亡”这一事项，而非强调已经死亡的完成事件。采用“死去”可更准确保留原文的平行和压缩表达。
  - severity: low
    issue: 译文未保留英文审校轨迹中Χριστός的“弥赛亚”词汇替代脚注及其锚点。
    rationale: “基督”可作为正文的标准术语，但脚注应提供“弥赛亚”这一不改变正文意义的称号性替代译法。
