  text: ἐμοὶ γὰρ τὸ ζῆν Χριστὸς καὶ τὸ ἀποθανεῖν κέρδος.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/021.yaml
  text: For to me[a], to live is Christ, and to die is gain.
translation:
  language: zh_hans
  text: 因为对我来说，活着就是基督[a]，死去就是得益。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“弥赛亚”。
    reason: Χριστός可译为“基督”或“弥赛亚”；正文采用现代中文最通行的“基督”，脚注保留其称号性词汇替代。
lexical_decisions:
- source_word: ἐμοὶ
  choice: 对我来说
  rationale: 与格代词在此标明保罗个人的立场与判断；“对我来说”自然、清楚，也保留原文的强调。
- source_word: γὰρ
  choice: 因为
  rationale: γάρ承接上文并说明缘由；现代汉语用“因为”能清楚呈现解释关系。
- source_word: τὸ ζῆν
  choice: 活着
  rationale: 带冠词的不定式作名词性成分；“活着”简洁自然，并能与后面的“死了”形成紧凑对称。
- source_word: Χριστὸς
  choice: 基督
  rationale: Χριστός在保罗书信中兼具称号和近似专名的用法；“基督”是现代中文最通行且准确的对应词。
- source_word: τὸ ἀποθανεῖν
  choice: 死了
  rationale: 该带冠词的不定式与τὸ ζῆν平行，指死亡这一结果；“死了”在中文中自然地表达进入死亡的情形。
- source_word: κέρδος
  choice: 得益
  rationale: κέρδος表示所得的益处或好处；“得益”保留获益之意，同时避免“利润”过强的商业色彩。
theological_decisions:
- issue: 省略系词所形成的压缩表达
  choice: “活着就是基督”
  alternative: “活着是为了基督”或“活着靠的是基督”
  rationale: 原文只将“活着”与“基督”并置，没有明说目的、根源或内容。译文保留这种高度凝练而开放的表达，不补入原文未明确说明的关系。
- issue: 死亡为何是得益
  choice: 仅译为“死了也是得益”
  alternative: 补明为“死后与基督同在，所以是得益”
  rationale: 上下文可帮助理解其神学含义，但本节本身没有明说原因；不把上下文推论直接写进正文。
translation_notes:
  register: 采用现代、凝练而庄重的普通话。保留原文两组名词性结构的平行和警句式力度；“也”使中文并列关系自然，但不增加新的神学内容。
