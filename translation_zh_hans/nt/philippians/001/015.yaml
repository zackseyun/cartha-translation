  text: Τινὲς μὲν καὶ διὰ φθόνον καὶ ἔριν, τινὲς δὲ καὶ δι’ εὐδοκίαν τὸν Χριστὸν κηρύσσουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/015.yaml
  text: Some indeed proclaim the Messiah because of envy and rivalry[a], but others because of goodwill.
translation:
  language: zh_hans
  text: 有些人传扬基督，是出于嫉妒和争竞；另一些人则是出于善意。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τινὲς μὲν … τινὲς δὲ
  choice: 有些人……另一些人却……
  rationale: 不定代词与 μέν……δέ 构成两组人的对比；此译法自然保留这一对照。
- source_word: καὶ διὰ φθόνον καὶ ἔριν
  choice: 确实是出于嫉妒和争竞
  rationale: διά 加宾格在此表示动机；两个 καί 共同加强列举，中文以“确实”和“和”自然体现语气。“争竞”表达因竞争而对立的含义。
- source_word: δι’ εὐδοκίαν
  choice: 出于善意
  rationale: 该短语与嫉妒和争竞相对，表示正面的动机；“善意”简洁、自然，且不过度限定具体对象。
- source_word: τὸν Χριστόν
  choice: 基督
  rationale: Χριστός 在此带冠词并具称号性质；中文传统且通行的称号“基督”既准确又易懂，无须另加脚注。
- source_word: κηρύσσουσιν
  choice: 传扬
  rationale: 保留 κηρύσσω 公开宣告的含义，同时比“讲道”更少带制度化或场合限定。
