id: PHP.1.19
reference: Philippians 1:19
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οἶδα γὰρ ὅτι τοῦτό μοι ἀποβήσεται εἰς σωτηρίαν διὰ τῆς ὑμῶν δεήσεως καὶ ἐπιχορηγίας τοῦ πνεύματος Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/019.yaml
  text: For I know that this will turn out for my deliverance through your prayer and the provision of the Spirit of Jesus the Messiah[b][a],
translation:
  language: zh_hans
  text: 因为我知道，这事终必借着你们的祷告和耶稣基督之灵的供应[b]，使我得到解救[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “解救”或译“拯救”，也可理解为“得证无辜”。
    reason: alternative_reading
  - marker: b
    text: “耶稣基督之灵的供应”也可理解为这灵所供应的帮助，或这灵本身被赐下。
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: οἶδα
  choice: 我知道
  rationale: οἶδα虽为完成时形式，却具有现在时意义；“我知道”自然地表达保罗的确信。
- source_word: τοῦτό
  choice: 这事
  rationale: 单数指示代词概括保罗当前的整个处境；“这事”保留宽泛指向，不把所指限定得过窄。
- source_word: ἀποβήσεται
  choice: 终必使……得到
  rationale: 该动词表示事情最终产生的结果；结合εἰς σωτηρίαν译为“终必使我得到解救”，既自然又保留将来意义及保罗的把握。
- source_word: σωτηρίαν
  choice: 解救
  rationale: 此处处境涉及保罗被囚及其结局，“解救”较贴近上下文，同时以脚注保留“拯救”和“辨明无辜”等可能含义。
- source_word: δεήσεως
  choice: 祷告
  rationale: 该词指向神提出的恳求；“祷告”是现代中文最清楚自然的表达。
- source_word: ἐπιχορηγίας
  choice: 供应
  rationale: 该名词表示充分供给或援助；“供应”能够较直接地保留原文名词结构，不预先判定是圣灵所赐的供应，还是圣灵本身被赐下。
- source_word: πνεύματος Ἰησοῦ Χριστοῦ
  choice: 耶稣基督之灵
  rationale: 直译其属格关系，保留这灵与耶稣基督的关联；“基督”在现代中文圣经语域中是Χριστός这一称号通行且可理解的表达。
theological_decisions:
- issue: σωτηρίαν在保罗被囚语境中的含义
  choice: 解救
  alternative: 拯救；辨明无辜
  rationale: 近期语境关乎保罗受囚之事将有何结局，“解救”最能体现现实处境；但该词也可具有更广的救恩或获证清白含义，因此不在正文中排除这些张力。
- issue: ἐπιχορηγίας τοῦ πνεύματος的属格关系
  choice: 耶稣基督之灵的供应
  alternative: 耶稣基督之灵所赐的帮助；耶稣基督之灵的赐予
  rationale: 原文属格可理解为圣灵所供应的帮助，也可能强调圣灵本身的赐予；正文保留名词结构，避免把歧义静默化解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“借着……和……”贴近原文的工具性结构；“供应”略带圣经语域色彩，但能保存原文属格的真实歧义。所有脚注标记均置于相关正文之后。
