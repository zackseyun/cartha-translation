  text: Γινώσκειν δὲ ὑμᾶς βούλομαι, ἀδελφοί, ὅτι τὰ κατ’ ἐμὲ μᾶλλον εἰς προκοπὴν τοῦ εὐαγγελίου ἐλήλυθεν,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/012.yaml
  text: I want you to know[a], brothers, that what has happened to me has actually advanced the good news[b],
translation:
  language: zh_hans
  text: 弟兄们[a]，我希望你们知道，我所遭遇的事反而促进了福音[b]的进展。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“弟兄姊妹们”；希腊文直译为“弟兄们”，在这里可能指全体信徒。
    reason: lexical_alternative
  - marker: b
    text: 或译“好消息”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Γινώσκειν ... βούλομαι
  choice: 我希望你们知道
  rationale: 保留说话者明确希望读者知悉此事的书信表达；现代汉语自然庄重，也不把“知道”强化为“明白”。
- source_word: δὲ
  choice: 不单独译出
  rationale: 此处δέ只是轻微转换话题；汉语直接称呼并进入陈述已能自然承接上下文，硬译“现在”或“但是”会加入原文没有的时间意味或过强转折。
- source_word: ἀδελφοί
  choice: 弟兄们
  rationale: 保留希腊文阳性复数称呼；该词在此很可能泛指整个信徒群体，其包容范围在脚注说明。
- source_word: τὰ κατ’ ἐμὲ
  choice: 我所遭遇的事
  rationale: 自然概括保罗当前涉及自身的处境和经历，避免直译为生硬的“关于我的事”。
- source_word: μᾶλλον
  choice: 结果反而
  rationale: 表达事情产生了与读者可能预料相反的结果；“反而”保留其修正预期的语气，“结果”使汉语句间关系清楚。
- source_word: εἰς προκοπὴν τοῦ εὐαγγελίου
  choice: 推动了福音的传播
  rationale: προκοπή表示向前进展；在本语境中以“推动……传播”传达福音事业取得进展，比“福音的进展”更符合现代汉语习惯。
- source_word: ἐλήλυθεν
  choice: 推动了
  rationale: 结合εἰς προκοπήν转化为自然汉语动词结构，表达过去处境所产生并延续至今的成效。
- source_word: εὐαγγέλιον
  choice: 福音
  rationale: “福音”是现代汉语中通行而准确的对应词，兼具“好消息”的词义及本段特定的基督信仰信息内涵。
theological_decisions: []
translation_notes:
