  text: καὶ τοῦτο προσεύχομαι ἵνα ἡ ἀγάπη ὑμῶν ἔτι μᾶλλον καὶ μᾶλλον περισσεύῃ ἐν ἐπιγνώσει καὶ πάσῃ αἰσθήσει,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/009.yaml
  text: 'And this I pray: that your love may abound still more and more in knowledge and all discernment[b][a],'
translation:
  language: zh_hans
  text: 我为此祷告：愿你们的爱在知识和各种辨别力上[a][b]越发丰富，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在知识上”也可译作“伴随着知识”；希腊语介词可表达密切伴随的关系。
    reason: lexical_alternative
  - marker: b
    text: “辨别力”也可译作“洞察力”或“道德感知力”。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ τοῦτο προσεύχομαι
  choice: 我所祷告的是
  rationale: 以自然的现代汉语引出祷告内容；承接上文的 καί 不必机械译作“并且”，而 τοῦτο 的指示作用由“所……的是”保留。
- source_word: ἵνα
  choice: 愿
  rationale: 在“祷告”之后用“愿”自然表达祷告的内容与期望，同时保留目的或意愿色彩。
- source_word: ἡ ἀγάπη ὑμῶν
  choice: 你们的爱
  rationale: 直接保留第二人称复数所有关系，并按项目常规将 ἀγάπη 译为“爱”。
- source_word: ἔτι μᾶλλον καὶ μᾶλλον περισσεύῃ
  choice: 越来越丰富
  rationale: “越来越”体现持续增长和重复的 μᾶλλον，“丰富”表达 περισσεύω 的充盈、增多之意，中文流畅而不将意象强化为“满溢”。
- source_word: ἐν ἐπιγνώσει
  choice: 在知识……上
  rationale: 保留 ἐν 的领域性表达，并用普通读者易懂的“知识”；不擅自加强为“充分的知识”。
- source_word: πάσῃ αἰσθήσει
  choice: 各种辨别力
  rationale: αἴσθησις 在此指实际或道德上的感知与判断能力；“辨别力”比“感觉”准确，“各种”自然表达 πάσῃ 所涵盖的全面性。
theological_decisions:
- issue: 爱与知识、辨别力之间的句法关系
  choice: 在知识和各种辨别力上越来越丰富
  alternative: 随着知识和各种辨别力越来越丰富／有知识和各种辨别力相伴
  rationale: 保留 ἐν 可表示领域、范围或密切伴随的弹性，不明确断定是工具、方式还是伴随关系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我所祷告的是：愿……”符合汉语祷告语体；保留原句未完的逗号，以便与下一节衔接。脚注标记依其所说明的短语顺序置于正文中。
