id: PHP.1.28
reference: Philippians 1:28
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ μὴ πτυρόμενοι ἐν μηδενὶ ὑπὸ τῶν ἀντικειμένων (ἥτις ⸂ἐστὶν αὐτοῖς⸃ ἔνδειξις ἀπωλείας, ⸀ὑμῶν δὲ σωτηρίας, καὶ τοῦτο ἀπὸ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/028.yaml
  text: and not being frightened in anything by those who oppose you[a]. This is a sign to them of destruction[c][b], but of your salvation—and this from God.
translation:
  language: zh_hans
  text: 无论在什么事上，都不要被反对你们的人吓倒[a]。这对他们而言是灭亡的迹象，对你们而言却是得救的迹象；而这出于上帝[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使你们惊慌”，或“使你们受威吓”。
    reason: lexical_alternative
  - marker: c
    text: “这出于上帝”可能专指你们得救，也可能较广地指前述整个迹象。
    reason: alternative_reading
lexical_decisions:
- source_word: πτυρόμενοι
  choice: 被……吓倒
  rationale: 该词可指受惊、惊慌或因威吓而退缩。“被……吓倒”既自然，也保留面对敌对者时不受恐吓的语气。
- source_word: ἐν μηδενί
  choice: 无论在什么事上，都不
  rationale: 这一表达具有全面否定的意思，即“在任何方面都不”；此译法符合现代汉语，并保留其概括性。
- source_word: τῶν ἀντικειμένων
  choice: 反对你们的人
  rationale: 分词实词化，指正在敌对或反对腓立比信徒的人；此译法清楚表达其关系性含义。
- source_word: ἔνδειξις
  choice: 迹象
  rationale: 该词表示可作为证据的表征或指示。“迹象”自然易懂，同时不把语气强化为无可争辩的“证明”。
- source_word: ἀπωλείας
  choice: 灭亡
  rationale: 该词可表示毁灭、败亡，且在保罗书信中常带审判意味；“灭亡”保留其神学分量而不额外界定细节。
- source_word: σωτηρίας
  choice: 得救
  rationale: 此处指来自上帝的拯救；“得救”在句中比名词“救恩”更自然，并保留保罗用语的神学含义。
- source_word: τοῦτο ἀπὸ θεοῦ
  choice: 而这出于上帝
  rationale: 保留指示代词“这”，不明确限定它只指“得救”还是指前述整个迹象，从而维持原文的指代开放性。
theological_decisions:
- issue: τοῦτο（“这”）的指代
  choice: 正文保留宽泛而未定的指代：“而这出于上帝”。
  alternative: “这”可专指信徒得救，也可较广地指前述由他们不受惊吓而显出的迹象。
  rationale: 希腊文没有明确限定先行内容；正文不替原文消除这一神学上的张力。
- issue: ἀπωλείας 与 σωτηρίας 的对应
  choice: 译为“灭亡”与“得救”，保持鲜明对照。
  alternative: 可译作“毁灭”与“拯救”。
  rationale: 原文并列两种相反结局；所选措辞在现代汉语中自然，并保留其末世与审判意涵而不作进一步教义化说明。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“无论在什么事上，都不要……”表达全面否定；“被……吓倒”兼顾受惊与受威吓退缩的语义。“而这出于上帝”略带凝练的书面色彩，以保留原文指代的含混。
