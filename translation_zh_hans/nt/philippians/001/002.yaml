  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/002.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a][b][c].
translation:
  language: zh_hans
  text: 愿恩典和平安从我们的父上帝和主耶稣基督[a]临到你们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “基督”意为“受膏者”，也可译作“弥赛亚”。
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: 恩典
  rationale: “恩典”是现代汉语基督教语境中自然且庄重的对应词，既保留保罗书信问安语的关系含义，也承载其神学分量。
- source_word: ὑμῖν
  choice: 临到你们
  rationale: 希腊语与格表示祝福的领受者；汉语将其与补出的“临到”结合，并置于句末，比逐词译作“给你们”更符合自然的祝福语体。
- source_word: εἰρήνη
  choice: 平安
  rationale: “平安”既能表达和平，也能涵盖安宁、福祉，保留此问安语与犹太传统问候的共鸣。
- source_word: ἀπό
  choice: 从
  rationale: 直接表明恩典和平安的来源，简洁忠实。
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: 我们的父上帝
  rationale: 将“上帝”与“我们的父”理解为同位关系；这一表达在现代汉语中清楚表明上帝是我们的父。
- source_word: κυρίου
  choice: 主
  rationale: “主”是 κύριος 在此基督论称号中的自然对应词，既庄重又保留其权柄含义。
- source_word: Ἰησοῦ Χριστοῦ
  choice: 耶稣基督
  rationale: “耶稣基督”是现代汉语中最自然且广为理解的固定表达，也保留 Χριστός 在保罗书信问安语中介于称号与近似专名之间的张力；脚注说明其称号含义。
theological_decisions:
- issue: Χριστοῦ 在保罗书信问安语中是称号还是近似专名
  choice: 正文译作“基督”，脚注说明其含义及另一译法
  alternative: 正文译作“弥赛亚”或“受膏者”
  rationale: 在此固定问安语中，Χριστός 仍源于“受膏者”这一称号，但在保罗用法中也已具有近似专名的性质。“基督”最自然地保留这种张力；将其直接译成“受膏者”会过度凸显词源，而“弥赛亚”同样是音译且在此处不如“耶稣基督”自然。
- issue: 补出希腊语省略的祝愿动词
  choice: 补出“愿……临到你们”
  alternative: 直译为“恩典与你们和平安，从……”
  rationale: 原文是无谓语的书信祝福公式；现代汉语需补出祝愿结构才能自然表达，且不改变其来源或内容。
translation_notes:
  register: 采用现代、庄重而易懂的书信祝福语体。保留原文中“恩典—平安”的次序以及父上帝与主耶稣基督并列作为祝福来源的结构；为符合汉语习惯，将领受者“你们”置于句末，并补出祝愿动词“愿……临到”。
