id: PHP.1.7
reference: Philippians 1:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καθώς ἐστιν δίκαιον ἐμοὶ τοῦτο φρονεῖν ὑπὲρ πάντων ὑμῶν, διὰ τὸ ἔχειν με ἐν τῇ καρδίᾳ ὑμᾶς, ἔν τε τοῖς δεσμοῖς μου καὶ ἐν τῇ ἀπολογίᾳ καὶ βεβαιώσει τοῦ εὐαγγελίου συγκοινωνούς μου τῆς χάριτος πάντας ὑμᾶς ὄντας·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/007.yaml
  text: For it is right for me to think this about all of you[a], because I have you in my heart, since both in my chains and in the defense and confirmation of the gospel[b], all of you are fellow partakers with me of grace.
translation:
  language: zh_hans
  text: 我这样看待你们众人，原是理所当然的，因为我把你们放在心上[a]。无论我身陷锁链，还是为福音辩护、证实福音的时候，你们众人都和我一同有份于恩典。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为你们把我放在心上。”希腊文这个短语可以有两种理解。
    reason: alternative_reading
lexical_decisions:
- source_word: δίκαιον
  choice: 理所当然
  rationale: 这里表示保罗这样看待腓立比信徒是正当、合宜的；“理所当然”自然地保留了伦理上的正当性。
- source_word: φρονεῖν
  choice: 这样看待
  rationale: φρονέω兼有思想、心态和态度之意；“这样看待”比单纯“这样想”更能体现持久的心意，同时符合现代汉语。
- source_word: ὑπὲρ πάντων ὑμῶν
  choice: 你们众人
  rationale: 与φρονεῖν连用时，ὑπέρ表示对众人的看法或态度；译文以“这样看待你们众人”自然表达。
- source_word: διὰ τὸ ἔχειν με ἐν τῇ καρδίᾳ ὑμᾶς
  choice: 因为我把你们放在心上
  rationale: 不定式结构中的με与ὑμᾶς均为宾格，语法上可有两种理解。正文采用保罗把他们放在心上的传统读法，另一读法收入脚注。
- source_word: δεσμοῖς
  choice: 身陷锁链
  rationale: 保留δεσμοί具体的锁链意象，同时明确表达被囚处境，避免现代读者误解为抽象束缚。
- source_word: ἀπολογίᾳ
  choice: 为福音辩护
  rationale: ἀπολογία指公开或正式的答辩、辩护；加上“为福音”清楚呈现属格τοῦ εὐαγγελίου与并列名词的关系。
- source_word: βεβαιώσει
  choice: 证实福音
  rationale: βεβαίωσις表示确认、坚立或证明其可靠；“证实”简洁传达使福音的真实性得到确认之意。
- source_word: συγκοινωνούς
  choice: 和我一同有份
  rationale: 该词强调共同参与；“和我一同有份”自然表达συν-的共同性及μου所指与保罗共同参与。
- source_word: χάριτος
  choice: 恩典
  rationale: χάρις是重要的神学用语；此处指众信徒与保罗共同领受、参与的恩典，保留为“恩典”而不限定其具体表现。
theological_decisions:
- issue: “放在心上”从句的主客体歧义
  choice: 因为我把你们放在心上
  alternative: 因为你们把我放在心上
  rationale: 希腊文中με和ὑμᾶς都采用宾格，二者谁是不定式ἔχειν的逻辑主语存在真实歧义。正文读法符合上下文中保罗对众人的深情，另一种读法也与他们同他一同有份相协调，因此以脚注保留。
- issue: 恩典所指的范围
  choice: 不具体限定，译作“恩典”
  alternative: 明确解释为使徒职分、受苦或传福音的恩赐
  rationale: 上下文可能使恩典包括保罗受囚及为福音辩护、证实福音的使命，但原文没有将χάρις明确限定为其中任何一项，因此不在正文中作教派性或过度具体化的解释。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“无论……还是……”将锁链与为福音辩护、证实福音并列，保持原句结构关系；“一同有份于恩典”保留共同参与的神学表达，不擅自限定恩典的具体内容。
