  text: ἵνα τὸ καύχημα ὑμῶν περισσεύῃ ἐν Χριστῷ Ἰησοῦ ἐν ἐμοὶ διὰ τῆς ἐμῆς παρουσίας πάλιν πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/026.yaml
  text: so that your boasting in Messiah Jesus may abound because of me through my coming to you again[a][b][c][d].
translation:
  language: zh_hans
  text: 好使你们在弥赛亚耶稣里因我而有的夸耀[a]，借着我再次到你们那里而越发增多[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “夸耀”也可指“夸耀的理由”或“可引以为荣之处”。
    reason: lexical_alternative
  - marker: b
    text: “因我”原文直译为“在我里面”；这里可理解为“因我”或“在我身上”。
    reason: lexical_alternative
  - marker: c
    text: 原文意为“借着我再次到你们那里”；“到”所译的词也可指“临在”或“到访”。
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: ἵνα
  choice: 好使
  rationale: 承接上文，表达目的或预期结果；中文用“好使”既简明又保留从属关系。
- source_word: τὸ καύχημα ὑμῶν
  choice: 你们的夸耀
  rationale: καύχημα既可指夸耀本身，也可指夸耀的理由或根据；正文采用较直接且能保留一定歧义的“夸耀”，并以脚注说明另一义项。
- source_word: περισσεύῃ
  choice: 越发增多
  rationale: 表达περισσεύω所含的丰富、增加之意，并配合ἵνα后的虚拟语气译为“可以……越发增多”。
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: 在基督耶稣里
  rationale: 保留保罗书信中“在基督耶稣里”的核心关系表达，不把它弱化为仅仅“关于”或“由于”。
- source_word: ἐν ἐμοὶ
  choice: 因我
  rationale: 字面为“在我里面”，在此较可能表示保罗是他们夸耀得以增加的缘由或关联对象；“因我”在现代汉语中自然清楚。
- source_word: διὰ τῆς ἐμῆς παρουσίας πάλιν πρὸς ὑμᾶς
  choice: 因我再次来到你们那里
  rationale: παρουσία在此指保罗亲自再度来到并与腓立比信徒同在；“来到”最符合这一访问语境，διά译作原因或途径性的“因”。
theological_decisions:
- issue: ἐν Χριστῷ Ἰησοῦ的句法归属
  choice: 修饰“夸耀”：在基督耶稣里的夸耀
  alternative: 修饰“增多”：夸耀在基督耶稣里增多
  rationale: 词序及保罗常见的“在主里夸耀”观念支持前者，但希腊语在形式上容许不同关联，因此不作超出正文所需的神学发挥。
- issue: ἐν ἐμοὶ的意义
  choice: 因我
  alternative: 在我身上／在我里面
  rationale: 这里更自然地表示保罗及其归来成为夸耀增加的缘由；脚注保留字面表达，以免抹去原文结构。
- issue: Χριστός的译法
  choice: 基督
  alternative: 受膏者／弥赛亚
  rationale: “基督耶稣”是现代中文圣经语体中通行而易懂的称谓；“基督”源于表示“受膏者”的称号，并非将其当作普通姓名处理。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“夸耀”比“自夸”更能避免必然带有负面意味，也较贴近保罗在基督里的喜乐与荣耀语境。句序基本遵循希腊文，同时借助逗号呈现“再次来到”与“越发增多”之间的关系。
