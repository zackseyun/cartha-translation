  to: 好使你们在弥赛亚耶稣里因我而有的夸耀[a]，借着我再次到你们那里而越发增多[b][c]。
  rationale: 修订区分两个与保罗相关、但功能不同的短语：ἐν ἐμοὶ译作“因我而有”，表示夸耀所关涉的对象或缘由；διὰ τῆς ἐμῆς παρουσίας译作“借着我再次到你们那里”，表示夸耀增加的途径。并将Χριστός译为“弥赛亚”，以体现其称号含义。
