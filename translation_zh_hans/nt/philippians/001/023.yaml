  text: συνέχομαι δὲ ἐκ τῶν δύο, τὴν ἐπιθυμίαν ἔχων εἰς τὸ ἀναλῦσαι καὶ σὺν Χριστῷ εἶναι, πολλῷ ⸀γὰρ μᾶλλον κρεῖσσον,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/023.yaml
  text: But I am hard pressed between the two[a], having the desire to depart and be with Messiah[b], for that is far better.
translation:
  language: zh_hans
  text: 但我在这两者之间左右为难；我渴望离世，和弥赛亚同在，因为这样好得多。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνέχομαι
  choice: 夹在……之间，左右为难
  rationale: 该动词表示受到挤压、约束；结合ἐκ τῶν δύο，译法自然表达保罗受两个选择夹迫的处境，又不把它仅仅处理成情绪上的“撕裂”。
- source_word: ἐκ τῶν δύο
  choice: 在这两者之间
  rationale: 字面为“出于这两者”，在语境中指两个选择共同造成压力；现代汉语用“在这两者之间”最清楚。
- source_word: τὴν ἐπιθυμίαν ἔχων
  choice: 我渴望
  rationale: ἐπιθυμία表示强烈愿望；“渴望”比直译“有愿望”更符合自然汉语，同时保留其强度。
- source_word: ἀναλῦσαι
  choice: 离世
  rationale: 原词本义为“离开、启程”，此处委婉指死亡。“离世”保留委婉表达，并避免增添经文没有明说的死后过程。
- source_word: Χριστῷ
  choice: 弥赛亚
  rationale: Χριστός在这里保留称号含义，译为“弥赛亚”，不将其仅按姓名式音译处理。
- source_word: πολλῷ γὰρ μᾶλλον κρεῖσσον
  choice: 因为这是好得无比的
  rationale: 原文用πολλῷ和μᾶλλον显著加强比较级κρεῖσσον；“好得无比”以自然而庄重的汉语传达“远为更好”的强烈程度。
theological_decisions:
- issue: 离世后与弥赛亚同在的含义
  choice: 离世，与弥赛亚同在
  alternative: 死后立即上天堂，与弥赛亚同在
  rationale: 译文只陈述希腊文明确表达的“离开”及“与弥赛亚同在”，不补入时间方式、地点或完整的死后状态教义。
- issue: 保罗所受的两方面压力
  choice: 夹在这两者之间，左右为难
  alternative: 内心被两个愿望撕裂
  rationale: 原文说明他受“两者”夹迫，但本节没有在句内再次明确列出两项内容；译文保留对上下文的指涉，不额外重构其心理状态。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“左右为难”承接“夹在这两者之间”，清楚传达受两种选择夹迫的语义；分号体现希腊文主句与分词结构的关系。“离世”保持保罗委婉的措辞，“弥赛亚”保留Χριστός的称号性质。
