  text: πεπληρωμένοι ⸂καρπὸν δικαιοσύνης τὸν⸃ διὰ Ἰησοῦ Χριστοῦ εἰς δόξαν καὶ ἔπαινον θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/011.yaml
  text: filled with the fruit of righteousness that comes through Jesus the Messiah[b][a], to the glory and praise of God.
translation:
  language: zh_hans
  text: 满有借着耶稣基督[b]所结的义[a]的果子，使荣耀和颂赞归给神。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “义”也可译作“公义”或“正义”。
    reason: lexical_alternative
  - marker: b
    text: “基督”意为“弥赛亚”，即“受膏者”，在这里是称号。
    reason: lexical_alternative
lexical_decisions:
- source_word: πεπληρωμένοι
  choice: 结满了
  rationale: 该完成时被动分词表达已经充满并持续处于充满的状态；结合“果子”的比喻，译作“结满了”既自然，也保留结果状态。
- source_word: καρπὸν
  choice: 果
  rationale: 保留保罗用“果子”表示生命与行为成果的比喻；与“结满”搭配符合现代汉语习惯。
- source_word: δικαιοσύνης
  choice: 义
  rationale: “义”可涵盖正直、公义以及合乎神旨意的状态，且“义的果”保留属格关系的开放性，不限定为“由义产生”或“以义为内容”。
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: 借着耶稣基督而有的
  rationale: διά加属格表示媒介或施行者；“借着……而有的”清楚表达这些果实依赖耶稣基督而产生，同时不过度界定具体机制。
- source_word: Χριστοῦ
  choice: 基督
  rationale: “基督”是现代汉语中对Χριστός的通行称谓；脚注说明其称号含义为“弥赛亚（受膏者）”，避免将它仅当作姓名的一部分。
- source_word: εἰς δόξαν καὶ ἔπαινον θεοῦ
  choice: 使荣耀和颂赞归给神
  rationale: εἰς可表达目的或结果；此译法自然地传达一切最终指向神的荣耀与颂赞。
theological_decisions:
- issue: “义的果”中属格的含义
  choice: 保留“义果”这一较开放的表达，可理解为以义为特征或内容的生命成果
  alternative: 由义产生的果子；构成义的果子；被算为义的果子
  rationale: 原文δικαιοσύνης与καρπόν之间的属格关系可以有不同理解。上下文支持借着基督产生的伦理和属灵成果，但正文不进一步锁定属格类别，以保留原文的神学张力。
- issue: διὰ Ἰησοῦ Χριστοῦ所修饰的范围
  choice: 理解为“义果”借着耶稣基督而有
  alternative: 理解为整个被充满的状态借着耶稣基督实现
  rationale: 原文位置最自然地把介词短语与“义的果”相连，但语法上不必排除它对整个状态的宽泛关联；译文采用自然的主要读法而不添加更细的因果说明。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“结满了……义果”延续果实意象，并与前文祈愿的句法相接；“使荣耀和颂赞归给神”清楚表达目的或结果。脚注标记均置于相关词语之后。
