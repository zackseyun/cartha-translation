source:
  edition: SBLGNT
  text: Παῦλος καὶ Τιμόθεος δοῦλοι ⸂Χριστοῦ Ἰησοῦ⸃ πᾶσιν τοῖς ἁγίοις ἐν Χριστῷ Ἰησοῦ τοῖς οὖσιν ἐν Φιλίπποις σὺν ἐπισκόποις καὶ διακόνοις·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/001.yaml
  text: 'Paul and Timothy[a], slaves of Messiah Jesus, to all the saints in Messiah Jesus who are in Philippi[c][b], together with the overseers and deacons:'
translation:
  language: zh_hans
  text: 保罗和提摩太——弥赛亚耶稣[b]的奴仆[a]——写信给所有在弥赛亚耶稣里、在腓立比的圣徒，连同众监督[c]和执事：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “奴仆”也可译作“奴隶”或“仆人”。原文强调归属并受主人支配的身份。
    reason: lexical_alternative
  - marker: b
    text: “弥赛亚耶稣”传统译作“基督耶稣”。“弥赛亚”和“基督”都表示“受膏者”。
    reason: alternative_reading
  - marker: c
    text: “监督”也可译作“主教”。这里采用表达其看顾职能的译法，以免预先带入后世教会制度的含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλοι
  choice: 奴仆
  rationale: 既保留受主人支配、归属于主的含义，也比现代汉语“奴隶”更适合书信问安语的庄重语域；脚注保留“奴隶”和“仆人”这两种可能译法。
- source_word: Χριστοῦ Ἰησοῦ / Χριστῷ Ἰησοῦ
  choice: 弥赛亚耶稣
  rationale: Χριστός源于称号，译作“弥赛亚”可显明其称号意义；同时以脚注列出汉语传统译法“基督耶稣”。
- source_word: πᾶσιν τοῖς ἁγίοις
  choice: 所有……作圣徒的人
  rationale: “圣徒”简洁保留保罗称呼信徒时所表达的圣洁身份；配合“在弥赛亚耶稣里”组成自然的现代汉语。
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: 在弥赛亚耶稣里
  rationale: 保留ἐν的表达以及保罗关于信徒与弥赛亚联合的措辞，不改写成较笼统的“属于”或“信奉”。
- source_word: τοῖς οὖσιν ἐν Φιλίπποις
  choice: 在腓立比
  rationale: 以自然的汉语地点短语表达分词结构，同时保留收信人的所在地。
- source_word: σὺν
  choice: 也包括
  rationale: 在汉语书信地址语中自然表达“连同、与……一起”的关联，表明监督和执事属于受信群体而又被特别提及。
- source_word: ἐπισκόποις
  choice: 监督
  rationale: 直接表达看顾、督察之职，避免把后世制度化色彩较强的“主教”直接带入本节。
- source_word: διακόνοις
  choice: 执事
  rationale: 本词与ἐπισκόποις并列，语境较可能指教会中受认可的服事职分；“执事”是清楚而通行的汉语称呼。
theological_decisions:
- issue: 如何处理保罗称呼中的Χριστός
  choice: 弥赛亚耶稣
  alternative: 基督耶稣
  rationale: 此处仍可听出受膏者称号的意义，因此正文译出“弥赛亚”；但“基督”是历史悠久且广为接受的音译式称呼，故以脚注保留。
- issue: 如何表达δοῦλοι的受约束身份
  choice: 奴仆
  alternative: 奴隶；仆人
  rationale: “奴仆”没有消除归属和受支配的含义，又能维持庄重自然的中文语体；“奴隶”更直接突出被奴役状态，“仆人”则较弱，二者均列于脚注以呈现词义张力。
- issue: ἐπίσκοποι是否译作后世教阶称号
  choice: 监督
  alternative: 主教
  rationale: 采用功能性译名，避免预先断定腓立比教会的职分与后世主教制度完全相同；传统译名“主教”在脚注中保留。
translation_notes:
  register: 采用现代、庄重而易懂的书信问安语体。“写信给”是汉语为表达希腊文省略谓语的书信地址格式所作的必要补足；破折号标明寄信人的身份说明。将地点“在腓立比”置于“在弥赛亚耶稣里”之前，既使汉语顺畅，也保留地理位置与属灵联合两个层面。“众”用于监督和执事，反映原文复数。
