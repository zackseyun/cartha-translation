id: PHP.1.27
reference: Philippians 1:27
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Μόνον ἀξίως τοῦ εὐαγγελίου τοῦ Χριστοῦ πολιτεύεσθε, ἵνα εἴτε ἐλθὼν καὶ ἰδὼν ὑμᾶς εἴτε ἀπὼν ⸀ἀκούω τὰ περὶ ὑμῶν, ὅτι στήκετε ἐν ἑνὶ πνεύματι, μιᾷ ψυχῇ συναθλοῦντες τῇ πίστει τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/027.yaml
  text: Only conduct yourselves in a manner worthy of the gospel of Messiah[a], so that whether I come and see you or am absent, I may hear about you that you are standing firm in one spirit, with one soul striving together for the faith of the gospel[e][d][c][b],
translation:
  language: zh_hans
  text: 最要紧的是，你们行事为人要与弥赛亚的福音相称[a]，好叫无论我来见你们，还是不在你们那里，我都能听到关于你们的消息：你们在同一心志中[b]坚定站立，同心[c]为福音的信仰一同奋斗[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “行事为人”所译的希腊语动词带有公民生活的意味，也可译作“像公民一样生活”。“弥赛亚”也常译作“基督”。
    reason: 保留πολιτεύεσθε的公民色彩，并说明Χριστός的通行替代译法。
  - marker: b
    text: “同一心志”也可理解为“同一位圣灵”或“在同一圣灵里”。
    reason: πνεῦμα可能指群体共有的精神或心志，也可能指圣灵。
  - marker: c
    text: “同心”直译为“以一个心灵”，也可译作“以同一心志”。
    reason: 说明μιᾷ ψυχῇ的具体意象及其在语境中的共同意志含义。
  - marker: d
    text: “为福音的信仰”也可译作“为相信福音”或“为福音真道”。
    reason: 保留τῇ πίστει τοῦ εὐαγγελίου中属格关系及πίστις含义的歧义。
lexical_decisions:
- source_word: Μόνον
  choice: 只要
  rationale: 句首强调保罗首要而统摄性的劝勉；现代汉语中“只要你们……”自然有力，又不额外扩展原文。
- source_word: ἀξίως
  choice: 配得上
  rationale: 表达行为方式与福音相称的伦理要求，简洁而自然。
- source_word: πολιτεύεσθε
  choice: 行事为人
  rationale: 这是现代中文圣经语体中自然且清楚的表达；原词的公民生活色彩保留在脚注中，避免正文生硬地译成“像公民一样生活”。
- source_word: εὐαγγελίου
  choice: 福音
  rationale: “福音”是现代中文基督教语境中清楚、通行且具有保罗书信神学分量的对应词。
- source_word: Χριστοῦ
  choice: 弥赛亚
  rationale: 此处Χριστός在属格结构中仍具头衔意味，译为“弥赛亚”能显明其“受膏者”的称号性质。
- source_word: ἀκούω τὰ περὶ ὑμῶν
  choice: 听到你们的消息
  rationale: 自然表达希腊语“听到关于你们的事”，并适合“无论来或不在”的句法环境。
- source_word: στήκετε
  choice: 坚定站立
  rationale: 保留站立的形象及坚守不移的含义。
- source_word: ἐν ἑνὶ πνεύματι
  choice: 同有一个心灵
  rationale: 与下文“同心”形成并行，正文倾向群体共有的内在精神，同时用脚注保留指圣灵的可能。
- source_word: μιᾷ ψυχῇ
  choice: 同心协力
  rationale: ψυχή字面是“魂/生命”，在此表示共同意志；“同心协力”符合现代汉语，也与共同奋斗的动作自然衔接。
- source_word: συναθλοῦντες
  choice: 并肩奋斗
  rationale: 保留共同竞技、共同奋战的动态意象。
- source_word: τῇ πίστει τοῦ εὐαγγελίου
  choice: 为福音的信仰
  rationale: 贴近原文属格结构，不在正文中过度判定是“相信福音”还是“以福音为内容的信仰”；脚注列出主要替代理解。
theological_decisions:
- issue: πνεύματι是指共同的心灵，还是圣灵
  choice: 同有一个心灵
  alternative: 在同一位圣灵里
  rationale: 紧接的“同心”使群体共有的精神或意向较合语境，但圣灵的含义仍然可能，因此不在脚注中排除。
- issue: τῇ πίστει τοῦ εὐαγγελίου中属格的关系
  choice: 为福音的信仰
  alternative: 为相信福音；为福音真道
  rationale: 原文可指以福音为内容或由福音所界定的信仰，也可能侧重相信福音这一行动；采用较形式对应的正文并以脚注保存歧义。
- issue: Χριστοῦ作为称号还是惯用专名
  choice: 弥赛亚
  alternative: 基督
  rationale: 该词在“弥赛亚的福音”中可被理解为称号；“基督”是传统音意兼具的惯用译法，列入脚注供读者了解。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。正文避免生硬直译，同时以“坚定站立”“并肩奋斗”保留原文的形象；对公民意涵、圣灵可能性及“福音的信仰”的语法歧义用脚注交代。
