  to: 最要紧的是，你们行事为人要与弥赛亚的福音相称[a]，好叫无论我来见你们，还是不在你们那里，我都能听到关于你们的消息：你们在同一心志中[b]坚定站立，同心[c]为福音的信仰一同奋斗[d]。
  rationale: 修订恢复原文“唯一/最要紧的劝勉—好叫我听见”的连贯结构；使“在同一心志中”明确修饰“坚定站立”，并以“同心……一同奋斗”对应“以一个心灵共同奋力”。同时逐一校正脚注锚点和脚注c的直译说明，未把“灵”是否指圣灵或“福音的信仰”的属格关系定于一说。
