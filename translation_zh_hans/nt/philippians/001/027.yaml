  naturalness: “为福音的信仰并肩奋斗”在现代汉语中搭配生硬，且脚注标记b、c、d全部置于句末，不能清楚锚定各自所说明的词语。修订以庄重、自然的现代书面语重组句法，并将标记置于相应短语之后。
  terminology: “福音”“弥赛亚”“行事为人”可保留。“同一心志”较“同有一个心灵”更符合汉语，也能与“同心”保持原文两组并列措辞的区分；脚注保留“圣灵”的可能。“福音的信仰”虽略具书面语色彩，却能保留原文属格关系而不在正文中预断其含义。
