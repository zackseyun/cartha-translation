  text: πεποιθὼς αὐτὸ τοῦτο ὅτι ὁ ἐναρξάμενος ἐν ὑμῖν ἔργον ἀγαθὸν ἐπιτελέσει ἄχρι ἡμέρας ⸂Χριστοῦ Ἰησοῦ⸃·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/006.yaml
  text: 'I am confident of this very thing: that he who began a good work among you will bring it to completion at the day of Messiah Jesus.'
translation:
  language: zh_hans
  text: 我深信这一点：那位在你们中间[a]开始了美好工作的，必会把这工作完成，直到弥赛亚耶稣[b]的日子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在你们里面”。
    reason: lexical_alternative
  - marker: b
    text: 传统译法：“基督耶稣”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πεποιθὼς αὐτὸ τοῦτο
  choice: 我深信这一点
  rationale: 分词承接上文保罗的第一人称陈述；“深信”自然表达完成时所体现的坚定把握，“这一点”保留 αὐτὸ τοῦτο 的强调作用而不显生硬。
- source_word: ὁ ἐναρξάμενος
  choice: 那……开始了……的
  rationale: 保留带冠词分词所指的行动主体；希腊文没有明说“神”，因此正文也不补出，以免超出原文。
- source_word: ἐν ὑμῖν
  choice: 在你们中间
  rationale: ὑμῖν 为复数，语境是对腓立比信徒群体说话；“在你们中间”自然体现群体层面，同时脚注保留“在你们里面”的可能译法。
- source_word: ἔργον ἀγαθὸν
  choice: 美好的工作
  rationale: 直接表达该词组，不擅自限定这工作具体指个人成圣、教会事工或奉献参与。
- source_word: ἐπιτελέσει
  choice: 必完成这工作
  rationale: 表达把已经开始的工作贯彻到底、使之完成；补出“这工作”作为中文宾语，指代明确且没有增加新内容。
- source_word: ἄχρι ἡμέρας
  choice: 直到……的日子
  rationale: ἄχρι 的基本时间界限义为“直到”；不改译为“在……日”或“到……日以前”，从而保留完成过程与终末日之间关系的原文张力。
- source_word: Χριστοῦ Ἰησοῦ
  choice: 弥赛亚耶稣
  rationale: Χριστός 在此表明耶稣作为受膏者的身份，译作“弥赛亚”；传统译名“基督耶稣”列入脚注。
theological_decisions:
- issue: 这项美好工作的范围是群体性的还是个人性的
  choice: 正文采用“在你们中间”，突出复数称呼和教会群体语境，但不排除工作发生在各信徒里面。
  alternative: “在你们里面”，可更直接保留 ἐν 的空间表达，也容易被理解为每个个体内在的工作。
  rationale: 原文复数形式容许群体和个体层面的理解；正文不把本节收窄为某种关于个人坚忍的特定教义命题。
- issue: ἄχρι ἡμέρας 是否指工作恰在那日完成
  choice: 译作“直到……的日子”，保留时间终点的表达。
  alternative: “到……的日子必完成”或“在……的日子完成”，会更明确地把那一日解释为完成的时刻。
  rationale: ἄχρι 清楚标示时间界限，但本句不必被改写为对完成确切时点的更强断言。
- issue: 是否明确补出工作的主体是神
  choice: 沿用原文的关系性称谓“那……的”，不在正文补出“神”。
  alternative: “神既在你们中间开始了……”，可依据语境明确隐含主体。
  rationale: 主体在神学与语境上通常理解为神，但希腊文本身没有在本节明说；不补出可避免把解释写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我深信这一点”有力度但不过度书面；“那……的”保留原文未明说主体的表达。正文所有脚注标记均已对应列出。
