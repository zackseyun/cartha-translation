  text: εἰ δὲ τὸ ζῆν ἐν σαρκί, τοῦτό μοι καρπὸς ἔργου— καὶ τί αἱρήσομαι οὐ γνωρίζω·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/022.yaml
  text: But if to go on living in the flesh means fruitful labor for me[b][a], yet which I will choose I do not know.
translation:
  language: zh_hans
  text: 但如果我继续活在肉身中[a]，这对我来说就是工作的果实[b]——可是我要选择哪一个，我不知道。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“活在身体中”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“富有成果的工作”或“能结果实的工作”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ζῆν
  choice: 继续活
  rationale: 带冠词的不定式指保罗在现今处境中继续活着；“继续活”以自然的现代汉语表达这种延续性。
- source_word: ἐν σαρκί
  choice: 在肉身中
  rationale: 这里的 σάρξ 按上下文指有形体的今世生命，并非“罪性”；“肉身”既保留保罗用语，也避免把它解释成道德败坏。
- source_word: καρπὸς ἔργου
  choice: 富有成果的工作
  rationale: 希腊语表达简约，可直译为“工作的果实”，也可理解为能结出果实的工作；正文采用通顺且兼顾两个词义的表达，并以脚注保留其他译法。
- source_word: αἱρήσομαι
  choice: 我要选择
  rationale: 此处表示在前后所说的两种可能之间作选择；“选择”清楚自然。
- source_word: οὐ γνωρίζω
  choice: 我不知道
  rationale: γνωρίζω 虽常有“使人知道”之义，但此处依语境表达不能断定或说不准；“我不知道”最直接。
theological_decisions:
- issue: 本节 σάρξ 的含义
  choice: 有形体的今世生命（“在肉身中”）
  alternative: 罪性
  rationale: 上下文把继续今世的生命与离世、同基督在一起相对照，因此这里谈的是具身体的生存，而非人的道德败坏。
- issue: καρπὸς ἔργου 的压缩表达
  choice: 富有成果的工作
  alternative: 工作的果实
  rationale: 原文没有明确展开“果实”与“工作”的关系；正文表达工作会有成果的语境含义，脚注同时保留较形式对应的理解，不把原文的张力完全消除。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“肉身”保留保罗术语，但用脚注说明其身体生命之义；破折号体现原文从条件陈述转入选择难题时的突转。“哪一个”承接上下文的生与死两种可能，不在本节内额外明说。
