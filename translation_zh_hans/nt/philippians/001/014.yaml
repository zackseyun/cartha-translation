  text: καὶ τοὺς πλείονας τῶν ἀδελφῶν ἐν κυρίῳ πεποιθότας τοῖς δεσμοῖς μου περισσοτέρως τολμᾶν ἀφόβως τὸν ⸀λόγον λαλεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/014.yaml
  text: And most of the brothers[a], having become confident in the Lord because of my chains, dare all the more to speak the word fearlessly.
translation:
  language: zh_hans
  text: 而且，弟兄们[a]中大多数人因我的锁链而在主里有了信心，就越发敢于毫无惧怕地讲说这道。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄们”也可理解为“弟兄姊妹”；这里很可能广泛指信徒群体。
    reason: 说明希腊语阳性复数形式与其在语境中可能具有的包容性所指。
lexical_decisions:
- source_word: πλείονας
  choice: 大多数人
  rationale: 定冠词加部分属格表示弟兄群体中的多数，而不只是比较意义上的“更多人”。
- source_word: ἀδελφῶν
  choice: 弟兄们
  rationale: 保留希腊语阳性复数的形式；此处很可能泛指同作信徒的人，故以脚注说明可能包括姊妹。
- source_word: ἐν κυρίῳ
  choice: 在主里
  rationale: 保留保罗书信中常见的表达，指他们确信的领域或根基；其与“有了确信”相连。
- source_word: πεποιθότας
  choice: 有了确信
  rationale: 完成时分词表达经过某种经历而形成、并持续至今的坚定状态。
- source_word: τοῖς δεσμοῖς μου
  choice: 因我的锁链
  rationale: 保留 δεσμοί 的具体意象，并用“因”表达此处自然的原因关系。
- source_word: περισσοτέρως
  choice: 越发
  rationale: 自然表达比较副词“更加、越发”的含义。
- source_word: τολμᾶν
  choice: 敢于
  rationale: 直接保留面对风险仍鼓起勇气行动的语义。
- source_word: ἀφόβως
  choice: 毫无惧怕地
  rationale: 明确表达“不惧怕”的意思，避免仅译成范围较宽的“放胆”。
- source_word: τὸν λόγον
  choice: 这道
  rationale: 在宣讲语境中，“道”自然指所传的信息，同时不增添原文没有的“神的”；“这”体现希腊语定冠词所指的已知信息。
- source_word: λαλεῖν
  choice: 传讲
  rationale: 虽是一般性的“说”，但宾语为“这道”且处于福音传播语境，“传讲”在中文中更自然，又未强化为更专门的宣告术语。
theological_decisions:
- issue: ἀδελφοί 的所指范围
  choice: 正文译作“弟兄们”，脚注说明可能包括弟兄姊妹，即同作信徒的人。
  alternative: 正文直接译作“弟兄姊妹”或“信徒”。
  rationale: 既保留希腊语阳性复数的形式，也不掩盖该词在此语境中很可能具有群体性的广义所指。
- issue: ἐν κυρίῳ 与句中成分的关系
  choice: 将“在主里”与“有了确信”相连。
  alternative: 理解为“因主而有确信”，或把“在主里”与“弟兄们”相连。
  rationale: 词序和保罗惯用语支持其主要修饰 πεποιθότας；直译“在主里”也保留了关系和神学内涵，不把它简化为单一的工具或原因。
- issue: 锁链与确信的因果关系
  choice: 译作“因我的锁链……有了确信”。
  alternative: 译作“借着我的锁链”或较中性地译为“凭我的锁链”。
  rationale: 与格可表达原因或媒介；上下文更自然地表明保罗受囚的经历促使众信徒在主里更有信心，但译文仍保留“锁链”的具体意象。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“锁链”保留监禁的具体形象；“在主里有了确信”保留保罗式表达及完成时所含的持续状态；“毫无惧怕地传讲这道”力求兼顾原文语义和自然中文。
