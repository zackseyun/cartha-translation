  text: καὶ τοῦτο πεποιθὼς οἶδα ὅτι μενῶ καὶ ⸀παραμενῶ πᾶσιν ὑμῖν εἰς τὴν ὑμῶν προκοπὴν καὶ χαρὰν τῆς πίστεως,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/025.yaml
  text: And convinced of this[a], I know that I will remain and continue with all of you for your progress and joy in the faith,
translation:
  language: zh_hans
  text: 我既对此深信，就知道我会留下，并继续和你们众人在一起，为了你们的长进和在信仰中的喜乐。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“信仰的喜乐”，或“因信而有的喜乐”。
    reason: 原文“信仰”的属格与“喜乐”之间的具体关系存在合理歧义。
lexical_decisions:
- source_word: πεποιθὼς
  choice: 确信
  rationale: 该完成时分词表达已经形成并持续存在的坚定确信；“确信”自然、庄重，又不过分强化情绪。
- source_word: μενῶ
  choice: 会留下来
  rationale: 保留 μένω“留下、存留”的基本意义和将来时态，也与后面的复合动词有所区别。
- source_word: παραμενῶ
  choice: 继续和……在一起
  rationale: παραμένω 在这里不仅指存留，也带有继续陪伴、留在众人身边的意味；此译法明确表达这一层关系。
- source_word: πᾶσιν ὑμῖν
  choice: 和你们大家在一起
  rationale: 明确保留 πᾶσιν“所有、全体”的含义，并按现代汉语自然表达与众人同在的关系。
- source_word: προκοπὴν
  choice: 长进
  rationale: προκοπή 表示向前推进或进步；在信仰语境中，“长进”简明自然，也符合现代中文习惯。
- source_word: χαρὰν τῆς πίστεως
  choice: 在信仰上……喜乐
  rationale: 属格结构可以有领域、归属或来源等不同理解；正文采用自然且不过度限定的表达，其他可能含义在脚注中保留。
- source_word: πίστεως
  choice: 信仰
  rationale: 此处指腓立比信徒相信基督的信仰生活；“信仰”能自然地与“长进”和“喜乐”相连，同时不把 πίστις 限定为“忠信”。
theological_decisions:
- issue: χαρὰν τῆς πίστεως 中属格的含义
  choice: 在信仰上……喜乐
  alternative: 信仰的喜乐；因信而有的喜乐
  rationale: 希腊文属格本身可表达关联、领域或来源。正文采用宽泛而自然的译法，不把它单一解释为因果关系；脚注列出其他合理理解，以保留原文张力。
translation_notes:
  register: 采用现代、庄重而通顺的标准普通话。“既然……我就知道”保留分词与主句的逻辑关系；“留下来，并继续和你们大家在一起”既区分两个相近动词，也避免生硬重复。脚注标记置于其所说明的“喜乐”之后。
