revisions:
- from: 既然确信这一点，我就知道，我会留下来，并继续和你们大家在一起，使你们在信仰上长进并且喜乐。[a]
  to: 我既对此深信，就知道我会留下，并继续和你们众人在一起，为了你们的长进和在信仰中的喜乐。[a]
  rationale: 修订将“信仰”明确限于“喜乐”，以反映希腊文修饰关系；同时保留“在信仰中的喜乐”这一自然、非排他的主文表达，并以脚注保留归属性和来源性的合理理解。其余措辞保留原稿对完成分词、两个将来动词、全体受众及目的短语的准确表达。
