id: PHP.1.20
reference: Philippians 1:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: κατὰ τὴν ἀποκαραδοκίαν καὶ ἐλπίδα μου ὅτι ἐν οὐδενὶ αἰσχυνθήσομαι, ἀλλ’ ἐν πάσῃ παρρησίᾳ ὡς πάντοτε καὶ νῦν μεγαλυνθήσεται Χριστὸς ἐν τῷ σώματί μου, εἴτε διὰ ζωῆς εἴτε διὰ θανάτου.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/020.yaml
  text: in keeping with my eager expectation and hope that I will not be put to shame in anything[a], but that with all boldness, as always, even now Messiah will be magnified in my body[b], whether through life or through death.
translation:
  language: zh_hans
  text: 这正符合我热切的期待和盼望：我在任何事上都不会蒙羞[a]；反而，我会一如既往，甚至如今也满有胆量，让弥赛亚[b]的伟大在我的身体上彰显出来，无论是借着生，还是借着死。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“感到羞愧”。
    reason: 希腊语可指客观地蒙羞，也可指主观地感到羞愧。
  - marker: b
    text: 或译：“基督”。“弥赛亚”和“基督”都意为“受膏者”。
    reason: 保留Χριστός作为称号的两种常见中文表达。
lexical_decisions:
- source_word: κατὰ
  choice: 这正合乎
  rationale: 表示下文与保罗的期待和盼望相一致；“这正合乎”在现代汉语中自然，也保留了原文的对应关系。
- source_word: ἀποκαραδοκίαν
  choice: 热切的期待
  rationale: 该词带有殷切向前盼望的强化意味；“热切的期待”清楚而不夸饰。
- source_word: ἐλπίδα
  choice: 盼望
  rationale: 符合保罗书信中带有信赖和期待意味的常用语义，也与“期待”自然并列。
- source_word: ἐν οὐδενὶ
  choice: 在任何事上都不会
  rationale: 表达毫无例外的全面否定，符合现代汉语习惯。
- source_word: αἰσχυνθήσομαι
  choice: 蒙羞
  rationale: 保留被动及公开受辱、最终落空的语感；另一可能是“感到羞愧”，列入脚注。
- source_word: παρρησίᾳ
  choice: 满有胆量
  rationale: 此处侧重公开见证时的坦然和勇气；“满有胆量”也对应 πάσῃ 的充分程度。
- source_word: μεγαλυνθήσεται
  choice: 显为尊大
  rationale: 保留“使之显大、彰显其伟大”的含义，同时避免把它误解为弥赛亚本身原先不够伟大。
- source_word: Χριστὸς
  choice: 弥赛亚
  rationale: 此处仍可听出称号的意义，因此译出“受膏者”称号的传统音译；“基督”作为常见替代译法列入脚注。
- source_word: ἐν τῷ σώματί μου
  choice: 借着我的身体
  rationale: 明确保留“身体”这一具身见证的要素；汉语用“借着”自然表达弥赛亚在保罗身体这一场域和媒介中显为尊大。
- source_word: εἴτε διὰ ζωῆς εἴτε διὰ θανάτου
  choice: 不论是借着我的生，还是借着我的死
  rationale: 保留 διά 所表达的途径或处境，也保持“生／死”的平行对照；补出“我的”使汉语指向清楚。
theological_decisions:
- issue: Χριστός在本节是译作称号还是惯用名称
  choice: 弥赛亚
  alternative: 基督
  rationale: 在弥赛亚于保罗的生死中被彰显尊大的语境里，称号的意义仍然可感；正文采用“弥赛亚”，并以脚注保留华语基督教传统中更常见的“基督”。
- issue: αἰσχυνθήσομαι表示外在蒙羞还是内在羞愧
  choice: 蒙羞
  alternative: 感到羞愧
  rationale: 上下文涉及保罗公开见证是否落空以及弥赛亚是否得着尊崇，“蒙羞”较能保留公开受辱或未获印证的意味；但希腊语也容许主观的“感到羞愧”，故不排除该读法。
- issue: μεγαλυνθήσεται是否意味着增加弥赛亚本有的伟大
  choice: 显为尊大
  alternative: 被尊为大
  rationale: “显为尊大”保留原文“显大”的隐喻，同时说明重点是弥赛亚的尊大借保罗身体彰显出来，而不是其本质发生增加。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“热切的期待和盼望”“满有胆量”保留原文的强烈语气；“借着我的身体显为尊大”兼顾汉语自然度、身体意象及被动彰显的神学张力。所有脚注标记均已置于正文相应词语之后。
