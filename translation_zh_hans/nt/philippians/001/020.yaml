  to: 这正符合我热切的期待和盼望：我在任何事上都不会蒙羞[a]；反而，我会一如既往，甚至如今也满有胆量，让弥赛亚[b]的伟大在我的身体上彰显出来，无论是借着生，还是借着死。
  rationale: 修订保留原文的期待、绝不蒙羞、充分胆量及生死对举；以“让……伟大……彰显出来”在自然中文中表达弥赛亚将被显为大，并将“在我的身体上”与“借着生／死”分别对应ἐν和διά。
