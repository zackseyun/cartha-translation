  text: οἱ δὲ ἐξ ⸂ἐριθείας τὸν Χριστὸν καταγγέλλουσιν, οὐχ ἁγνῶς, οἰόμενοι θλῖψιν ἐγείρειν τοῖς δεσμοῖς μου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/017.yaml
  text: But the others proclaim the Messiah out of selfish ambition[a], not sincerely[b], thinking to raise up affliction for me in my imprisonment.
translation:
  language: zh_hans
  text: 但另一些人传扬弥赛亚[a]，是出于自私的野心，动机并不纯正；他们以为能在我被囚禁时[b]加增苦难。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“基督”。
    reason: alternative_reading
  - marker: b
    text: 原文直译为“给我的锁链加增苦楚”；“锁链”在这里指被囚禁的处境。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐριθείας
  choice: 自私的野心
  rationale: 该词在这里指自我谋利、带有党争色彩的野心，而不只是一般的自私；“自私的野心”以现代汉语清楚表达其动机，并与后文“不纯正”相呼应。
- source_word: Χριστόν
  choice: 弥赛亚
  rationale: 这里是传扬的对象和内容，称号意味突出；译作“弥赛亚”保留其受膏君王的称号性质。
- source_word: καταγγέλλουσιν
  choice: 传扬
  rationale: 表达公开宣告的含义，又不把范围限定为正式讲道。
- source_word: οὐχ ἁγνῶς
  choice: 动机并不纯正
  rationale: ἁγνῶς在本句涉及动机的纯正；意译为“动机并不纯正”比逐字译作“不纯洁地”更自然明确。
- source_word: οἰόμενοι
  choice: 他们以为
  rationale: 保留其主观判断或设想，不将其是否真正成功说成既成事实。
- source_word: θλῖψιν ἐγείρειν
  choice: 增添苦楚
  rationale: ἐγείρειν与θλῖψιν搭配表示挑起、造成苦难；“增添苦楚”既保留敌对意图，也符合现代汉语表达。
- source_word: τοῖς δεσμοῖς μου
  choice: 给我在囚禁中
  rationale: δεσμοί字面为“锁链”，在此借指保罗受囚的处境；正文表达实际所指，脚注保留原文意象。
theological_decisions:
- issue: Χριστός作为称号还是名称
  choice: 弥赛亚
  alternative: 基督
  rationale: 本节谈的是众人所传扬的对象，Χριστός的称号功能较为突出，因此译作“弥赛亚”；脚注保留教会传统用语“基督”。
- issue: 对恶意传扬者内心盘算的表述
  choice: 他们以为这样能……
  alternative: 他们想要借此……
  rationale: οἰόμενοι直接表达“以为、设想”，未必单独明确表示目的；正文保留这种主观判断的语气，不把它强化为纯粹的目的从句。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“另一些人”承接上下文的两组对比；分号区分他们的动机与盘算。避免生硬直译“兴起患难”，同时用脚注保存“锁链”的原文意象。
