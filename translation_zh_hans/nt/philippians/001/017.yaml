  to: 但另一些人传扬弥赛亚[a]，是出于自私的野心，动机并不纯正；他们以为能在我被囚禁时[b]加增苦难。
  rationale: 仅作必要的中文句法和关系澄清：将“给我在囚禁中增添苦楚”改为“在我被囚禁时加增苦难”。该改动保留“以为”的主观设想、保罗受囚的处境，以及敌对者意图造成更多患难的含义。脚注锚点及其替代译法均予保留。
