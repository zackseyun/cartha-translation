  text: I thank my God at every remembrance of you,[a]
translation:
  language: zh_hans
  text: 我每逢想起你们，就感谢我的神。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我因每次记念你们而感谢我的神。”
    reason: 原文ἐπί可理解为感恩发生的场合，也可理解为感恩的缘由；μνεία可译为“想起”或“记念”。
lexical_decisions:
- source_word: Εὐχαριστῶ
  choice: 感谢
  rationale: 现在时主动直陈语气第一人称单数；“感谢”在现代汉语中自然、直接，也保留了该动词的基本意义。
- source_word: τῷ θεῷ μου
  choice: 我的神
  rationale: 与“感谢”搭配的与格在汉语中自然作动词宾语；保留第一人称所属关系。
- source_word: ἐπὶ πάσῃ τῇ μνείᾳ
  choice: 每逢想起
  rationale: ἐπί加与格可表示感恩发生的场合；πάσῃ与单数μνείᾳ构成分配意义。“每逢想起”自然表达每次忆及时，且不把介词明确解释成因果关系。
- source_word: ὑμῶν
  choice: 你们
  rationale: 保留希腊语第二人称复数；在“想起你们”中自然表达μνεία所指的内容。
