  text: 因为你们从第一天直到如今，都在福音上有份[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为福音一同尽力。”希腊语短语可指他们共同参与的领域，也可指这种参与的目标或目的。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τῇ κοινωνίᾳ ὑμῶν
  choice: 因为你们……一同参与
  rationale: ἐπί加与格在上下文中说明保罗感谢的缘由；κοινωνία强调共同参与，而不只是彼此交往。译成“因为你们……一同参与”，既自然，也保留其主动投入的含义。
- source_word: εἰς τὸ εὐαγγέλιον
  choice: 福音的事
  rationale: εἰς在这里可表示共同参与所涉及的领域，也可表示其目标。正文用“参与福音的事”保持简洁，并尽量容纳这两种关系；脚注说明另一种明确的目的性理解。
- source_word: εὐαγγέλιον
  choice: 福音
  rationale: “福音”是现代中文基督教语境中通行且庄重的对应词，适合保罗书信中的用法。
- source_word: ἀπὸ τῆς πρώτης ἡμέρας ἄχρι τοῦ νῦν
  choice: 从第一天直到如今
  rationale: 准确表达参与行动自起初延续至保罗写信当下；“如今”较庄重而仍属现代常用语。
theological_decisions:
- issue: 腓立比信徒的κοινωνία是福音范围内的共同参与，还是以福音为目标的参与
  choice: 正文采用“参与福音的事”，不将关系完全限定为领域或目的
  alternative: “为福音一同尽力”
  rationale: 希腊语εἰς τὸ εὐαγγέλιον可指向参与的领域，也可表达目标或目的。正文保留一定开放性，脚注列出目的性较强的译法，避免把其神学含义单一化。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“一同参与”比单用“团契”更能让普通读者直接理解κοινωνία在本节中的主动共同投入；保留句末逗号，以反映本节在1:3—6长句中的从属关系。
