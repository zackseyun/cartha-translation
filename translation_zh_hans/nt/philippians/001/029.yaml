id: PHP.1.29
reference: Philippians 1:29
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὅτι ὑμῖν ἐχαρίσθη τὸ ὑπὲρ Χριστοῦ, οὐ μόνον τὸ εἰς αὐτὸν πιστεύειν ἀλλὰ καὶ τὸ ὑπὲρ αὐτοῦ πάσχειν),
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/029.yaml
  text: For it has been graciously granted to you on behalf of Messiah not only to believe in him[a], but also to suffer for him[d][c][b],
translation:
  language: zh_hans
  text: 因为你们为弥赛亚[a]所蒙的恩赐，不只是信靠他[b]，也包括为他受苦[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弥赛亚”或译“基督”。希腊语Χριστός是一个称号，意思是“受膏者”。
    reason: lexical_alternative
  - marker: b
    text: “信靠他”也可译作“信他”。
    reason: lexical_alternative
  - marker: c
    text: “为他受苦”也可译作“为了他的缘故受苦”或“因他而受苦”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 承接上一节，为信徒无所惧怕的态度说明原因；中文用“因为”能清楚表达因果关系。
- source_word: ἐχαρίσθη
  choice: 蒙恩得以
  rationale: 既保留白白、恩慈赐予的含义，也保留被动语态所暗示的赐予者；比单说“获准”更符合词义。
- source_word: τὸ ὑπὲρ Χριστοῦ
  choice: 为了弥赛亚的缘故……得以做的
  rationale: 将带冠词的短语视为统摄随后两个不定式的概括语，使信靠与受苦都以弥赛亚为关联和缘由；“弥赛亚”体现 Χριστός 的称号性质。
- source_word: πιστεύειν εἰς αὐτόν
  choice: 信靠他
  rationale: 表达 εἰς 所体现的以他为信赖对象，不只表示相信某项事实。
- source_word: πάσχειν
  choice: 受苦
  rationale: 直接、自然地对应不定式，避免弱化其明确含义。
- source_word: ὑπὲρ αὐτοῦ
  choice: 为他受苦
  rationale: 简洁保留因他、为了他的缘故而受苦的含义；其他可能表达列入脚注。
theological_decisions:
- issue: 信靠与受苦是否都属于恩赐的范围
  choice: 让“蒙恩得以做的”同时统摄“信靠他”和“为他受苦”
  alternative: 弱化为仅仅获准受苦，或使恩赐只修饰信靠
  rationale: 希腊文以 οὐ μόνον…ἀλλὰ καί 并列两个带冠词的不定式，二者都受 ἐχαρίσθη 支配；译文应保留信与受苦皆被恩赐这一神学张力。
- issue: τὸ ὑπὲρ Χριστοῦ 的句法范围
  choice: 理解为概括随后两项内容，并用“为了弥赛亚的缘故”统摄全句
  alternative: 仅把该短语与“受苦”相连，或把它处理为“代表弥赛亚”
  rationale: 原文结构允许一定表达张力，但该带冠词短语位于两个具体不定式之前，最自然地作为总括；译文不进一步断定是“代表”还是“因……缘故”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“蒙恩得以做的”略保留原文名词化结构，使一个恩赐明确涵盖后面的两项内容；“不只是……也是……”自然对应 οὐ μόνον…ἀλλὰ καί。
