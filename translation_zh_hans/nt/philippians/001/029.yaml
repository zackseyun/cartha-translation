  rationale: 修订只处理中文语法与原文总括结构的表达。“为弥赛亚所蒙的恩赐”对应“已赐给你们、有关/为着弥赛亚的那一项”，并以“信靠他”与“为他受苦”说明该恩赐的两项内容。此译法保留两项同属恩赐的张力，也不将ὑπέρ的关系过度解释为“代表”或仅限于后一项。
