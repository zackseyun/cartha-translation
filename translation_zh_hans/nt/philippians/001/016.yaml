id: PHP.1.16
reference: Philippians 1:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οἱ μὲν ἐξ ⸂ἀγάπης, εἰδότες ὅτι εἰς ἀπολογίαν τοῦ εὐαγγελίου κεῖμαι⸃,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/016.yaml
  text: The former do so out of love[a], knowing that I am appointed for the defense of the good news[b],
translation:
  language: zh_hans
  text: 有些人传扬基督，是出于爱心[a]，因为他们知道，我被安排为福音辩护[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“有些人是出于爱心”，行动“传扬基督”由上文补出。
    reason: 原文为省略结构；译文为使汉语完整而补明上下文所指的行动。
  - marker: b
    text: “被安排”也可译作“被设立”或“被置于当前处境”。
    reason: κεῖμαι可指保罗被指定承担为福音辩护的角色，也可含有他被置于当前处境的意味；原文没有说明安排者。
lexical_decisions:
- source_word: οἱ μὲν
  choice: 有些人传扬基督
  rationale: οἱ μὲν与下一句的οἱ δέ构成对照，本句省略了由上文补出的行动“传扬基督”。译文补明这一行动，使现代汉语完整自然，并以脚注说明原文的省略。
- source_word: ἐξ ἀγάπης
  choice: 是出于爱心
  rationale: ἐξ表示动机或根源；“出于爱心”准确、自然地表达其含义。
- source_word: εἰδότες
  choice: 因为他们知道
  rationale: 分词说明他们如此行的依据或原因；译作原因从句，符合现代汉语表达，同时保留与主句的逻辑联系。
- source_word: εἰς ἀπολογίαν
  choice: 是为了……申辩
  rationale: ἀπολογία可指正式或理据充分的辩护、申辩；εἰς在这里表达目的。“为了……申辩”保留目的意味。
- source_word: τοῦ εὐαγγελίου
  choice: 替福音
  rationale: 属格在此表示申辩所维护的对象；“替福音申辩”比机械的“福音的申辩”更符合现代汉语。
- source_word: κεῖμαι
  choice: 我被安置在这里
  rationale: κεῖμαι基本意象是被放置、处于某种位置，在本语境中可指保罗所处的受囚境况及其使命。“被安置在这里”保留处境与受安排两层意味，又不明确添加原文未明说的施事者。
theological_decisions:
- issue: κεῖμαι是否应明确译为神所设立或任命
  choice: 我被安置在这里
  alternative: 我是奉派／被设立为福音辩护的
  rationale: 语境容许把保罗的处境理解为出于神的安排，但本句没有明说施事者。“被安置在这里”保留神圣安排的可能性，也保留其指当前受囚处境的可能性，避免把含蓄表达强化为明确的任命公式。
- issue: 省略的传扬行动是否应在正文补出
  choice: 补作“传扬基督”并加脚注
  alternative: 直译为“有些人是出于爱心”
  rationale: 行动可由1:15的“传扬基督”清楚补出。正文补明可避免汉语残缺，脚注则保持原文结构透明。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“爱心”“福音”“申辩”均为普通读者可理解且适合经文语域的表达；避免古旧的“辩明”和过强的教义化措辞。
