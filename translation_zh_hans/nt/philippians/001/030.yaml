  text: τὸν αὐτὸν ἀγῶνα ἔχοντες οἷον εἴδετε ἐν ἐμοὶ καὶ νῦν ἀκούετε ἐν ἐμοί.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/030.yaml
  text: having the same struggle that you saw in me and now hear that I still have.
translation:
  language: zh_hans
  text: 你们正经历着同样的争战，就是你们从前在我身上所看见、如今又听说我仍在经历的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγῶνα
  choice: 争战
  rationale: 该词指艰苦的抗争、奋战；此处结合保罗因福音受苦的语境，译作“争战”既保留其强度，也比单纯的“困难”更贴近原文。
- source_word: ἔχοντες
  choice: 正经历着
  rationale: 字面为“有着”，但中文以“经历争战”更自然；现在分词也表达腓立比信徒当下正在面对这种处境。
- source_word: ἐν ἐμοί
  choice: 在我身上／我仍在经历
  rationale: 第一次保留“在我身上”的观察视角；第二次按汉语自然表达展开为听说保罗仍在经历这场争战，同时保留两处短语所指向的同一现实。
theological_decisions:
- issue: 第二个ἐν ἐμοί是否表示争战仍发生在保罗身上
  choice: 译为“听说我仍在经历的”
  alternative: “如今又听见在我身上的”
  rationale: 原文椭圆地说“如今听见在我里面／身上”，所听见的内容承接前面的“争战”。“仍”虽属语义显化，却由“从前看见”与“如今听说”的时间对照自然推出，并避免生硬中文；不额外界定争战的具体性质。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“从前……如今……”呈现εἴδετε与νῦν ἀκούετε的时间对照；“同样的争战”保留信徒与保罗共同受苦的关联。
