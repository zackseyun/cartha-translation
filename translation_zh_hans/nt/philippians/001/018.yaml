reference: Philippians 1:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: τί γάρ; πλὴν ⸀ὅτι παντὶ τρόπῳ, εἴτε προφάσει εἴτε ἀληθείᾳ, Χριστὸς καταγγέλλεται, καὶ ἐν τούτῳ χαίρω· ἀλλὰ καὶ χαρήσομαι,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/018.yaml
  text: What then? Only that in every way[a], whether in pretense or in truth, Messiah is being proclaimed, and in this I rejoice. Yes[b], and I will rejoice.
translation:
  language: zh_hans
  text: 那又怎样呢？无非是，无论以何种方式，是出于假意还是真诚，弥赛亚[a]都被传扬；为此我就喜乐，并且还要喜乐。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弥赛亚”也可译作“基督”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γάρ
  choice: 那么又怎样呢？
  rationale: 保留保罗简短的反问和承接上文的转折，不扩译为“那有什么关系”。
- source_word: πλὴν ὅτι
  choice: 无非是
  rationale: 自然表达限定和归结的语气：不论传道者动机如何，关键事实如下。
- source_word: παντὶ τρόπῳ
  choice: 无论怎样
  rationale: 保留“以各种方式／无论何种情形”的宽泛含义，并让下文的两种情况自然展开。
- source_word: προφάσει
  choice: 假意
  rationale: 在与ἀληθείᾳ对举时，表达表面理由与真实动机不一致，同时以脚注保留“借口／托词”的词义可能。
- source_word: ἀληθείᾳ
  choice: 真心
  rationale: 与“假意”形成自然、清楚的汉语对举；脚注提示其较形式对应的“真实”含义。
- source_word: Χριστὸς
  choice: 弥赛亚
  rationale: 此处为所传扬者的称号，译作“弥赛亚”可显明希腊语Χριστός所表达的受膏者身份；脚注列出传统译名。
- source_word: καταγγέλλεται
  choice: 总被传扬
  rationale: 保留被动语态和公开宣告之意；“总”结合παντὶ τρόπῳ表达无论何种情况，这一事实仍然成立。
- source_word: ἐν τούτῳ χαίρω
  choice: 我为此喜乐
  rationale: 清楚表明喜乐所指向的是弥赛亚被传扬这一事实。
- source_word: ἀλλὰ καὶ χαρήσομαι
  choice: 而且我还要喜乐
  rationale: 保留ἀλλὰ καί的递进语气和将来时，不额外加入“继续”等原文未明说的时间含义。
theological_decisions:
- issue: Χριστός作为称号的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 上下文聚焦于对Χριστός的公开传扬，称号功能明显；正文用“弥赛亚”揭示其语义，脚注保留汉语基督教传统中更常见的“基督”。
- issue: 保罗喜乐与传道者错误动机之间的张力
  choice: 保留“假意／真心”的对比，并把喜乐直接连于弥赛亚被传扬
  alternative: 扩译为“不管他们动机如何，我仍因福音被传开而喜乐”
  rationale: 原文没有认可错误动机，也没有在本节进一步解释；不通过扩译消解这种神学与伦理张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“那么又怎样呢？”保留简短有力的修辞转折；“无非是”略带正式感但仍属现代常用表达。句末用“而且我还要喜乐”自然承接本节并保留面向将来的语气。
