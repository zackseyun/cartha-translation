  text: ὥστε τοὺς δεσμούς μου φανεροὺς ἐν Χριστῷ γενέσθαι ἐν ὅλῳ τῷ πραιτωρίῳ καὶ τοῖς λοιποῖς πᾶσιν,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/013.yaml
  text: so that my chains in Messiah have become known throughout the whole imperial guard and to all the rest[b][a],
translation:
  language: zh_hans
  text: 以致我因弥赛亚所受的捆锁[a]，已经在整个禁卫军[b]和所有其他人中为人所知。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我在弥赛亚里的捆锁已经为人所知。”
    reason: 保留 ἐν Χριστῷ 可能表达在弥赛亚里、与弥赛亚联合，或以弥赛亚为范围的读法。
  - marker: b
    text: 或译：“整个总督府（或皇室驻地）”；原词可指禁卫军，也可指总督或皇室的官邸、总部。
    reason: πραιτώριον 的具体所指因写作地点及语境而有歧义。
lexical_decisions:
- source_word: ὥστε
  choice: 结果
  rationale: 承接上文并表达实际产生的结果；现代汉语中“结果”比逐字译作“以致”更自然。
- source_word: τοὺς δεσμούς μου
  choice: 我受捆锁
  rationale: 保留“锁链、捆锁”的具体监禁意象，同时用“受捆锁”自然表达保罗被囚的处境。
- source_word: φανεροὺς ... γενέσθαι
  choice: 都知道
  rationale: 该结构表示保罗受捆锁的性质或缘由已经变得公开、明显；按汉语习惯转换为相关人群“都知道”。
- source_word: ἐν Χριστῷ
  choice: 是因弥赛亚而有的
  rationale: 在本语境中表达保罗的捆锁与他归属、传扬弥赛亚有关；正文采用自然的缘由性表达，同时以脚注保留“在弥赛亚里”的范围或联合含义。
- source_word: Χριστῷ
  choice: 弥赛亚
  rationale: 保留 Χριστός 作为称号的含义，而不只把它当作姓名音译。
- source_word: ἐν ὅλῳ τῷ πραιτωρίῳ
  choice: 整个禁卫军
  rationale: 在《腓立比书》的可能处境中，该词可指帝国禁卫军或相关机构；正文采用较可能且易懂的所指，脚注注明地点性解释。
- source_word: τοῖς λοιποῖς πᾶσιν
  choice: 其余所有人
  rationale: 贴近原文“所有其余的人”，并把范围扩展到禁卫军以外的人。
theological_decisions:
- issue: ἐν Χριστῷ 与保罗捆锁之间的关系
  choice: 正文译为“我受捆锁是因弥赛亚而有的”，突出众人知道他被囚与弥赛亚有关。
  alternative: “我在弥赛亚里的捆锁”，可强调保罗在与弥赛亚联合的处境中承受捆锁。
  rationale: 上下文侧重保罗被囚的缘由已经公开，但介词短语仍可能含有“在弥赛亚里”的联合或范围意义，因此不在正文中兼并两义，而以脚注保留另一读法。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。为符合汉语信息结构，将原文“捆锁变得明显”转换为“众人都知道”，同时保留“捆锁”意象；“弥赛亚”作为称号处理。
