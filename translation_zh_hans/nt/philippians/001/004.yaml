lexical_decisions:
- source_word: πάντοτε
  choice: 总是
  rationale: 表达持续、一贯的行动，并在汉语中与“每当……时”自然搭配。
- source_word: ἐν πάσῃ δεήσει μου
  choice: 每当我……祈求时
  rationale: 原文直译近于“在我的每一次祈求中”；按现代汉语调整为时间结构，保留每一次祈求的范围。
- source_word: ὑπὲρ πάντων ὑμῶν
  choice: 为你们众人
  rationale: 保留ὑπέρ的代求含义和πάντων的全体范围。
- source_word: μετὰ χαρᾶς
  choice: 满怀喜乐地
  rationale: 自然表达“带着喜乐”，保留祈求时伴随的喜乐。
- source_word: τὴν δέησιν ποιούμενος
  choice: 祈求
  rationale: 希腊语为“作出祈求”的惯用表达；译为动词“祈求”符合现代汉语，且避免生硬重复名词。
