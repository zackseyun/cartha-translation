revisions:
- from: 我给教会写了点什么[a]，可是，在他们中间喜欢居首位的丢特腓不接纳我们[b]。
  to: 我曾给教会写过一点话[a]，但在他们中间喜欢居首位的丢特腓不接纳我们[b]。
  rationale: 修订仅改善现代普通话的自然度和脚注准确性。“一点话”力求在不明确补出“信”的前提下表达 τι 的不定性；脚注 a 不再以“短信”这一现代通信术语描述古代文本，并明确“一封简短的信”属于可选理解而非正文所明说的内容。
