base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/009.yaml
  text: I wrote something to the church[a], but Diotrephes, who loves to be first among them[b], does not receive us.
translation:
  language: zh_hans
  text: 我曾给教会写过一点话[a]，但在他们中间喜欢居首位的丢特腓不接纳我们[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我曾给教会写过一封简短的信”。希腊原文使用不定的说法（“写过一点话”）；有些抄本在这里扩充了措辞。
    reason: textual_variant
  - marker: b
    text: “接纳”也可译作“欢迎”或“承认”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔγραψά
  choice: 我……写了
  rationale: 不定过去时直陈式在这里自然译为过去发生的动作；不额外赋予“已经写过”的完成意味。
- source_word: τι
  choice: 点什么
  rationale: 保留中性不定代词的含混性，既不擅自补成“一封信”，也不采用后期抄本中扩展的措辞。
- source_word: τῇ ἐκκλησίᾳ
  choice: 给教会
  rationale: 指当地的基督徒群体；“教会”是现代汉语中标准且易懂的对应词。
- source_word: ἀλλ’
  choice: 可是
  rationale: 自然表达作者写信与丢特腓拒绝接纳之间的鲜明转折。
- source_word: ὁ φιλοπρωτεύων
  choice: 喜欢居首位的
  rationale: 传达此人喜爱占据首位、追求居先的倾向，同时避免把经文未明说的正式职权结构加入译文。
- source_word: αὐτῶν
  choice: 在他们中间
  rationale: 将属格理解为丢特腓谋求首位的群体范围，不武断译成“辖管他们”。
- source_word: Διοτρέφης
  choice: 丢特腓
  rationale: 采用现代中文圣经人名的通行音译。
- source_word: οὐκ ἐπιδέχεται ἡμᾶς
  choice: 不接纳我们
  rationale: “接纳”保留该动词可兼指欢迎、接受或认可的宽广语义，不把意思限定为款待，也不限定为承认权威。
theological_decisions:
- issue: 丢特腓反对使徒一方的具体性质
  choice: 不接纳我们
  alternative: 不欢迎我们；不承认我们
  rationale: 原文可能涉及人身接待、团契接纳，或对作者及其代表的认可。译文保持宽泛，不把经文缩窄为单纯拒绝款待，也不擅自断定是在拒绝某种明确界定的教会权威。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“写了点什么”略带口语感，但这是为保留原文 τι 的不定性；“喜欢居首位”清楚表达道德批评，又不使用生硬的“贪爱为首”或带特定制度含义的措辞。
