  text: ὑπὲρ γὰρ τοῦ ὀνόματος ἐξῆλθον μηδὲν λαμβάνοντες ἀπὸ τῶν ⸀ἐθνικῶν.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/007.yaml
  text: For they went out for the sake of the Name[a], taking nothing from the Gentiles.
translation:
  language: zh_hans
  text: 因为他们是为这名的缘故出去的，没有从外邦人[a]那里接受任何东西。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“不信的人”或“异教徒”。
    reason: 保留ἐθνικῶν在本语境中可能侧重宗教身份而非单纯族群身份的词义范围。
lexical_decisions:
- source_word: ὑπὲρ
  choice: 为……的缘故
  rationale: ὑπέρ与属格“那名”连用，在这里表示行动的缘由或目的；这一译法自然地表达他们出发是为了那名，而不引入替代性的含义。
- source_word: τοῦ ὀνόματος
  choice: 那名
  rationale: 原文直译为“那名”，是带有敬意的简略称呼，语境中指耶稣或主。保留原文的含蓄表达，避免在正文中补入原文未明说的“耶稣”“基督”或“主”。
- source_word: ἐξῆλθον
  choice: 出发了
  rationale: 该不定过去时动词表示他们已经出去、启程；“出发了”在现代汉语中自然，也符合宣教行程的语境。
- source_word: μηδὲν λαμβάνοντες
  choice: 并没有……接受任何东西
  rationale: 分词短语说明他们出发时的做法。“任何东西”保留原文未具体说明钱财、食物或其他供给的宽泛性。
- source_word: ἀπὸ τῶν ἐθνικῶν
  choice: 从外邦人那里
  rationale: ἐθνικός在此作名词使用，指基督徒群体以外、属于列国的人。“外邦人”保留第一世纪犹太—基督教语境中的族群与宗教色彩；其他语境化理解列入脚注。
theological_decisions:
- issue: “那名”的所指
  choice: 正文保留敬称式的“那名”，让其隐含地指向耶稣或主。
  alternative: 译作“主的名”“耶稣的名”或“基督的名”。
  rationale: 原文没有明说所指者，只使用“那名”这一敬称式简称。保留这种表达可维持原文的神学含蓄与庄重，也避免增添正文没有的称谓。
- issue: ἐθνικῶν的含义
  choice: 正文译作“外邦人”。
  alternative: 译作“不信的人”或“异教徒”。
  rationale: “外邦人”最能保留该词的族群—宗教背景；但在本节语境中，它实际可侧重指基督信仰群体以外的人，因此以脚注保留其他可能表达。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“那名”虽不是日常说法，却有意保留原文敬称式简称的特殊语感；句中不把“任何东西”具体化为钱财或供给，以免缩窄原意。
