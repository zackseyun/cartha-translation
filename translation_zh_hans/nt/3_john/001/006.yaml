  text: οἳ ἐμαρτύρησάν σου τῇ ἀγάπῃ ἐνώπιον ἐκκλησίας, οὓς καλῶς ποιήσεις προπέμψας ἀξίως τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/006.yaml
  text: They testified before the church about your love[a], and you will do well to send them on their way in a manner worthy of God.
translation:
  language: zh_hans
  text: 他们在教会面前为你的爱作了见证；你若以合乎上帝尊荣的方式帮助他们继续行程，这样做就做得好。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“给他们送行”。原文动词常指帮助旅人继续上路，其中可能包括供应旅途所需。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμαρτύρησάν
  choice: 见证了
  rationale: 简单过去表达不定过去时所叙述的已发生事件；“见证”保留公开作证、报告的意味。
- source_word: σου τῇ ἀγάπῃ
  choice: 你的爱
  rationale: 与“见证”搭配，表达见证的内容或所指，即该犹所表现的爱；中文无需增添介词也能自然传意。
- source_word: ἐνώπιον ἐκκλησίας
  choice: 在教会面前
  rationale: 保留公开在聚集的信徒群体面前作见证的含义；“教会”符合本书信语境。
- source_word: καλῶς ποιήσεις
  choice: 你若……，就做得好了
  rationale: 既保留将来式的委婉劝勉语气，也符合现代汉语表达，避免译成生硬的命令。
- source_word: προπέμψας
  choice: 帮助他们继续行程
  rationale: 该词不只表示送别，也常包含为旅行者提供所需帮助、使其继续上路；此译法在中文中兼顾送行与实际支持。
- source_word: ἀξίως τοῦ θεοῦ
  choice: 以配得上帝的方式
  rationale: 表达行动方式应与上帝的尊荣相称，同时避免误解为人本身凭功德配得上帝。
theological_decisions:
- issue: προπέμπω在基督徒接待语境中的含义
  choice: 帮助他们继续行程
  alternative: 给他们送行；送他们上路
  rationale: 语境所称许的不只是礼貌送别，而是协助旅行传道者继续旅程，可能包括供应实际需要；正文采用不限定具体援助形式的概括表达。
- issue: ἀξίως τοῦ θεοῦ所表达的尺度
  choice: 以配得上帝的方式
  alternative: 以无愧于上帝的方式；按上帝所配得的方式
  rationale: 原文可强调与上帝相称、尊荣上帝的接待方式；所选译法保留这一神学张力，不将其具体化为人的功德或资格。
translation_notes:
  register: 采用现代、庄重而易懂的书信体。“上帝”依目标译本用语；句法适度重组为汉语条件句，以传达καλῶς ποιήσεις的委婉劝勉。脚注标记已置于正文对应词组之后。
