base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/013.yaml
  text: I had many things to write to you[a], but I do not want to write to you with ink and pen;
translation:
  language: zh_hans
  text: 我本来有许多事要写给你，但我不愿用墨和芦苇笔[a]写给你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“笔”。原文所指的是用芦苇制成的书写工具。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολλὰ
  choice: 许多事
  rationale: 中性复数形容词在此作名词使用；“许多事”自然保留复数含义。
- source_word: εἶχον
  choice: 我原有
  rationale: 未完成过去时在此引出作者原本打算写下的内容；“原有”既保留过去时框架，也符合现代汉语书信语气。
- source_word: γράψαι σοι
  choice: 要写给你
  rationale: 不定式表达拟议中的书写行动，σοι为间接宾语；译文清楚表达“写给你”。
- source_word: ἀλλ’ οὐ θέλω
  choice: 但我不愿
  rationale: θέλω表达意愿；“不愿”简洁、自然，也保持较庄重的书信语体。
- source_word: διὰ μέλανος καὶ καλάμου
  choice: 用墨和芦苇笔
  rationale: διά加属格表示工具或方式；μέλαν是墨，κάλαμος字面为芦苇，在书写语境中指芦苇制成的笔。
- source_word: γράφειν
  choice: 写给你
  rationale: 现在时不定式指书写这一过程；汉语无需另行标示其体貌，重复“写给你”则保留原文再次出现的σοι。
