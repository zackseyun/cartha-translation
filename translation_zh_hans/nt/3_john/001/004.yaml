  text: μειζοτέραν τούτων οὐκ ἔχω ⸀χαράν, ἵνα ἀκούω τὰ ἐμὰ τέκνα ἐν ⸀τῇ ἀληθείᾳ περιπατοῦντα.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/004.yaml
  text: 'I have no greater joy than this: to hear that my children are walking in the truth[a][b].'
translation:
  language: zh_hans
  text: 我最大的喜乐，莫过于听见我的儿女行在真理中。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“我没有比这些更大的喜乐。”
    reason: lexical_alternative
  - marker: b
    text: “我的儿女”很可能指写信的人属灵的儿女，即受他牧养照顾的信徒。
    reason: cultural_note
lexical_decisions:
- source_word: μειζοτέραν τούτων οὐκ ἔχω χαράν
  choice: 我最大的喜乐，莫过于
  rationale: 希腊文直译近于“我没有比这些更大的喜乐”。结合后面的内容从句，现代汉语用“最大的喜乐，莫过于”自然表达比较结构，同时不改变“没有更大喜乐”的强调。
- source_word: ἵνα ἀκούω
  choice: 听见
  rationale: 此处ἵνα引出构成喜乐的内容，而非严格表示目的；“莫过于听见”符合现代汉语表达。
- source_word: τὰ ἐμὰ τέκνα
  choice: 我的儿女
  rationale: τέκνα本义为“儿女、孩子”。保留亲属称谓，不在正文中直接限定为属灵儿女。
- source_word: ἐν τῇ ἀληθείᾳ
  choice: 在真理中
  rationale: 保留定冠词所体现的特指意味，也保留约翰文献中真理、真实生活及按真理而行之间的丰富关联。
- source_word: περιπατοῦντα
  choice: 行
  rationale: περιπατέω以“行走”比喻生活方式；“行在真理中”在中文中凝练庄重，并保留原文的伦理隐喻。
theological_decisions:
- issue: τέκνα指亲生儿女还是属灵儿女
  choice: 正文保留“我的儿女”，脚注说明语境中很可能指属灵儿女。
  alternative: 我的属灵儿女；我所带领信主的人
  rationale: 上下文较支持牧养关系，但原文仅用亲属称谓。保留其比喻可避免在正文中过度限定。
- issue: ἐν τῇ ἀληθείᾳ的含义
  choice: 译作“在真理中”。
  alternative: 诚实地；遵照真理；按真实的教导生活
  rationale: 约翰文献中的“真理”可能同时涉及所信的真理与符合真理的生活；不宜只归结为诚实或教义正确。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“莫过于”自然传达最高程度的比较；“行在真理中”保留原文的行走隐喻及其神学张力。
