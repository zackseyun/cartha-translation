source:
  edition: SBLGNT
  text: ἐχάρην γὰρ λίαν ἐρχομένων ἀδελφῶν καὶ μαρτυρούντων σου τῇ ἀληθείᾳ, καθὼς σὺ ἐν ἀληθείᾳ περιπατεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/003.yaml
  text: For I rejoiced greatly when brothers came and testified to your truth[c][b][a], just as you are walking in truth.
translation:
  language: zh_hans
  text: 因为有弟兄[a]前来，见证你持守真理[b][c]，正如你一直行在真理中，我非常喜乐。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄”也可泛指同属信仰群体的人，包括弟兄姊妹；希腊原文为阳性复数“弟兄”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“见证你里面的真理。”
    reason: alternative_reading
  - marker: c
    text: 较贴近原文形式可译：“为你的真理作见证。”这里不是说各人拥有不同的真理，而是指你与真理的关系。
    reason: literal_rendering
lexical_decisions:
- source_word: ἐχάρην
  choice: 我就……喜乐
  rationale: 该形式虽为不定过去时被动形态，却以主动意义使用。“喜乐”保留书信中鲜明的情感表达；句末安放谓语符合现代汉语叙事习惯。
- source_word: γὰρ
  choice: 因为
  rationale: 表明本句是在说明上一节所说喜乐的原因；“因为”在现代汉语中自然清楚。
- source_word: λίαν
  choice: 非常
  rationale: 准确表达程度很高，并与“喜乐”自然搭配。
- source_word: ἐρχομένων ἀδελφῶν
  choice: 有弟兄前来
  rationale: 将属格独立结构按时间或伴随情境处理。“弟兄”保留原文阳性复数和早期基督徒的亲属称谓。
- source_word: μαρτυρούντων
  choice: 见证
  rationale: 保留 μαρτυρέω 的作证意味，比“报告”更贴近原文的见证用语。
- source_word: σου τῇ ἀληθείᾳ
  choice: 你对真理的忠诚
  rationale: 原文的属格代词与与格“真理”结合，表达该受信人与真理之间的关系。“你对真理的忠诚”在汉语中自然，也与下句的生活表现相连；但此译法具有解释性，因此脚注保留较贴近形式的其他可能。
- source_word: καθὼς
  choice: 正如
  rationale: 清楚表达弟兄们的见证与该受信人实际生活之间的对应关系。
- source_word: ἐν ἀληθείᾳ περιπατεῖς
  choice: 你在真理中行事
  rationale: “行事”承接 περιπατέω 以“行走”比喻生活方式的伦理含义，同时比直译“行走”更符合现代汉语；“在真理中”保留约翰文献的特色表达。
theological_decisions:
- issue: 约翰文献伦理语境中“真理”的含义
  choice: 两处均译作“真理”，首处以“你对真理的忠诚”表达其与受信人生活的关系
  alternative: 可理解为“你里面的真理”或形式上直译为“你的真理”
  rationale: 本节把所信的真理与实际行事联系起来。“真理”可能同时涉及信仰内容、忠诚和道德实践，不宜将它缩减为单纯的诚实、教义知识或主观真诚。
- issue: σου τῇ ἀληθείᾳ 的句法与语义
  choice: 见证你对真理的忠诚
  alternative: 见证你里面的真理；为你的真理作见证
  rationale: 与 μαρτυρέω 连用的与格可指见证的对象或内容，而 σου 可说明该受信人与真理的关系。正文采用自然且符合后半句语境的理解，脚注则公开原文较为凝缩的表达及其歧义。
translation_notes:
  register: 采用现代、庄重而易懂的书信体。为使汉语顺畅，将“我就非常喜乐”置于原因和情境之后；保留两次“真理”，以呈现约翰文献中信仰与生活相连的表达。
