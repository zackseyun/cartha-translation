  source_fidelity: 草稿正确把ἀδελφούς理解为同信者，并把ξένους理解为该犹原先不认识的接待对象。不过，“尤其是”把καὶ τοῦτο解释为程度上的“特别”，这一加强语气虽见于英文审计稿，却不是希腊文所明确编码的唯一或最贴近的表达；原文更直接说明这些弟兄是陌生人。“所做的”在句末也使汉语句法悬置。
  naturalness: “你无论为弟兄们做什么，都是忠信的表现”基本通顺，但“尤其是为那些素不相识的弟兄所做的”不完整、重复“做”，且修饰关系不够清晰。改为两个分句可保留庄重亲切的书信语体，并自然表达“弟兄”与“陌生人”的同指关系。
  terminology: “亲爱的”“弟兄们”“忠信”均合适。保留“弟兄们”，并以脚注交代其语法阳性复数及语境指涉，符合原文且不武断规定群体实际性别构成。
  issues:
