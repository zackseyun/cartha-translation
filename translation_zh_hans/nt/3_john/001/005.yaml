  text: Ἀγαπητέ, πιστὸν ποιεῖς ὃ ἐὰν ἐργάσῃ εἰς τοὺς ἀδελφοὺς καὶ ⸀τοῦτο ξένους,
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/005.yaml
  text: Beloved[a], you are acting faithfully in whatever you do for the brothers[b], and especially when they are strangers.
translation:
  language: zh_hans
  text: 亲爱的[a]，你无论为弟兄们[b]所做的，都是忠信的事；他们是你素不相识的人。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亲爱的”也可译作“蒙爱的人”。原文是一个表示亲爱、关爱的单数称呼。
    reason: lexical_alternative
  - marker: b
    text: 原文“弟兄们”是阳性复数；这里指同信者，所指群体也可能包括女性。
    reason: lexical_alternative
  - marker: c
    text: 后半句较贴近原文可译作：“而且这是为素不相识的人做的。”“素不相识的人”最自然地是指前述弟兄，即该犹原先不认识的弟兄。
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: Ἀγαπητέ
  choice: 亲爱的
  rationale: 这是ἀγαπητός的阳性单数呼格，用作充满关爱的称呼。“亲爱的”自然保留书信语气和亲密温度，又不额外限定二人的关系。
- source_word: πιστὸν ποιεῖς
  choice: 都是忠信的表现
  rationale: 该结构较直译为“你做的是忠信的事”。译作“都是忠信的表现”既保留对该行为之忠信性质的肯定，也符合现代汉语表达。
- source_word: ὃ ἐὰν ἐργάσῃ
  choice: 你无论……做什么
  rationale: 关系代词ὃ与ἐάν及虚拟语气构成不定概括，意为“无论做什么”；此处ἐργάζομαι泛指实际所做的事，不必窄化为职业性的“工作”。
- source_word: εἰς τοὺς ἀδελφοὺς
  choice: 为弟兄们
  rationale: εἰς在此表达行为所惠及的对象，译作“为”自然；ἀδελφούς是阳性复数，在语境中指同信者，正文保留“弟兄们”，并以脚注说明其指涉范围。
- source_word: καὶ τοῦτο ξένους
  choice: 尤其是为那些素不相识的弟兄所做的
  rationale: τοῦτο回指该服事，ξένους与ἀδελφούς相呼应，表示这些弟兄对该犹而言是陌生人。“素不相识”避免让“陌生人”被误解为外族人；“尤其是”自然传达καὶ τοῦτο所加强的称许，但脚注保留较贴近形式的理解。
- source_word: ξένους
  choice: 素不相识的
  rationale: ξένος在本段接待旅行同信者的语境中，重点是主人原先不认识他们，而非他们必属外国人。
theological_decisions:
- issue: ἀδελφούς所指群体的性别范围
  choice: 正文译作“弟兄们”，脚注说明其在语境中泛指同信者
  alternative: “弟兄姊妹们”或“信徒们”
  rationale: 原词为语法上的阳性复数；保留其形式，同时说明该群体可能包括女性，可避免把语法性别直接等同于实际成员构成，也不对文本作过度明确化。
- issue: ξένους与“弟兄们”的关系
  choice: 理解为该犹原先不认识的弟兄
  alternative: 彼此独立的两组人，即“弟兄们和陌生人”
  rationale: ξένους的格、数、性与ἀδελφούς一致，最自然地限定同一群人；因此译为“素不相识的弟兄”，但不据此加入更多有关其身份或使命的说明。
translation_notes:
  register: 采用现代、庄重而亲切的书信语体。“忠信的表现”既避免生硬的“做忠信的事”，又不把πιστός窄化为单纯的“可靠”或泛化为“做得对”。“素不相识”符合接待语境，且避免“外人”“外国人”等可能造成的误读。
