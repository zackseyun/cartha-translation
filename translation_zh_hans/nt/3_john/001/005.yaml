    issue: “尤其是”将καὶ τοῦτο的关系明确化为程度加强。
    rationale: καὶ τοῦτο ξένους可自然理解为“而且这（是）对陌生人〔所做的〕”，其中ξένους也可与“弟兄们”同位。译作“尤其是”虽可传达称许的效果，却增加了原文未明说的比较程度。
  - severity: medium
    issue: “尤其是为那些素不相识的弟兄所做的”是句法残缺且表达重复。
    rationale: “所做的”缺少明确的中心语或谓语承接；同时它重复前面的“做什么”，妨碍现代汉语的自然性。
  - severity: low
    issue: 脚注c的“而且这是为素不相识的人做的”未明确其与“弟兄们”可能同指。
    rationale: 应说明ξένους最自然地描述前述弟兄为该犹陌生的人，同时保留原文较贴近的句法表达。
