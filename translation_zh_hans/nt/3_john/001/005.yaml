revisions:
- from: 亲爱的[a]，你无论为弟兄们[b]做什么，都是忠信的表现，尤其是为那些素不相识的弟兄所做的。[c]
  to: 亲爱的[a]，你无论为弟兄们[b]所做的，都是忠信的事；他们是你素不相识的人。[c]
  rationale: 将后半句改为“他们是你素不相识的人”，以清楚表达ξένους与前述“弟兄们”最自然的同指关系，并避免把καὶ τοῦτο固定译成带比较意味的“尤其是”。“忠信的事”比“忠信的表现”更贴近πιστὸν ποιεῖς的宾语结构，同时仍属自然、庄重的现代汉语。
