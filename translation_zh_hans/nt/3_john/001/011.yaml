id: 3JN.1.11
reference: 3 John 1:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ἀγαπητέ, μὴ μιμοῦ τὸ κακὸν ἀλλὰ τὸ ἀγαθόν. ὁ ἀγαθοποιῶν ἐκ τοῦ θεοῦ ἐστιν· ὁ κακοποιῶν οὐχ ἑώρακεν τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/011.yaml
  text: Beloved[a], do not imitate what is evil, but what is good. The one who does good is from God; the one who does evil has not seen God.
translation:
  language: zh_hans
  text: 亲爱的，不要效法恶，要效法善。行善的人是出于神；作恶的人[a]没有见过神。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “行善的人……作恶的人”也可理解为“不断行善的人……不断作恶的人”；希腊语分词可强调持续的实践或具有特征性的行为。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητέ
  choice: 亲爱的
  rationale: 这是ἀγαπητός的阳性单数呼格，用作亲切称呼。“亲爱的”保留约翰书信中温暖而郑重的语气，又不额外补入原文没有明说的身份称谓。
- source_word: μὴ μιμοῦ
  choice: 不要效法
  rationale: 现在时中间语态命令式与μή构成禁止语。“效法”直接表达μιμέομαι以榜样为对象而仿效的含义，比单纯的“跟随”更准确。
- source_word: τὸ κακὸν / τὸ ἀγαθόν
  choice: 恶 / 善
  rationale: 两个带冠词的中性形容词均作名词使用，形成概括性的伦理对比。汉语用“恶／善”简洁自然，也没有把它们限缩为某一件具体的恶事或善事。
- source_word: ὁ ἀγαθοποιῶν
  choice: 行善的人
  rationale: 现在时主动分词作名词使用。“行善的人”既保留动作含义，也可表达持续或具有特征性的行为。
- source_word: ἐκ τοῦ θεοῦ ἐστιν
  choice: 是出于神
  rationale: ἐκ表示来源，也可能带有所属关系。“是出于神”自然保留约翰著作中以神为源头的表达，不把它扩写成某一套后来的系统神学术语。
- source_word: ὁ κακοποιῶν
  choice: 作恶的人
  rationale: 现在时主动分词与ὁ ἀγαθοποιῶν平行。“作恶的人”保留其动作性和概括性的品行判断。
- source_word: οὐχ ἑώρακεν τὸν θεόν
  choice: 没有见过神
  rationale: ἑώρακεν是ὁράω的完成时。“没有见过神”保留“看见”的原有意象及完成时所表达的持续结果；译为“不认识神”会超出明说的字面。
theological_decisions:
- issue: 伦理行为与人同神之关系的约翰式表述
  choice: 保留“是出于神”和“没有见过神”这两种原文范畴
  alternative: 把经文解释性地译成“已由神重生”或“从来与神没有任何关系”
  rationale: 本节以行为作为属灵关系的判断性标志，但没有在此展开完整的系统神学定义。直译其约翰式用语，可以保留警告的力度及其神学张力，而不导入宗派性的重生论或完全主义解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“亲爱的”保留亲切呼语；“效法”“出于神”“没有见过神”延续经文的伦理与神学表达，同时避免古奥措辞。脚注标记置于第二个平行分词短语之后，使其明确涵盖“行善的人”和“作恶的人”两者。
