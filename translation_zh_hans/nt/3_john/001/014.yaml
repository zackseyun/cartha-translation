  text: ἐλπίζω δὲ εὐθέως ⸂σε ἰδεῖν⸃, καὶ στόμα πρὸς στόμα λαλήσομεν.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/014.yaml
  text: But I hope to see you soon[a], and we will speak face to face.
translation:
  language: zh_hans
  text: 不过，我盼望很快见到你[a]，那时我们会当面交谈。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“口对口”，意思是亲自在场、直接交谈，也就是“当面”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπίζω
  choice: 我盼望
  rationale: 现在时直陈语气表达作者现有的盼望或期待；“我盼望”自然贴合书信结语的语境。
- source_word: δὲ
  choice: 不过
  rationale: δέ承接上一节并形成轻微转折；“不过”在现代汉语中自然地保留这一思路转向。
- source_word: εὐθέως
  choice: 很快
  rationale: 该词本可表示“立即”，但在计划见面的语境中指时间不久以后；译作“很快”较为自然。
- source_word: σε ἰδεῖν
  choice: 见到你
  rationale: 忠实保留“看见你”的基本意义，同时在汉语中自然表达亲自会面的意思，不扩译为“拜访你”。
- source_word: στόμα πρὸς στόμα
  choice: 当面
  rationale: 原文直译为“口对口”，在此指双方亲自在场、直接交谈；“当面”是准确而自然的汉语表达，并由脚注保留原文意象。
- source_word: λαλήσομεν
  choice: 我们会……交谈
  rationale: 将来时表达预期中的谈话；“交谈”比“说话”更清楚地体现双方直接交流。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“不过”保留与上文的轻微转折；加入“那时”使两个将来行动之间的关系在汉语中更顺畅，不增添实质含义。
