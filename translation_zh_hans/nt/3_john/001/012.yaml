  text: Δημητρίῳ μεμαρτύρηται ὑπὸ πάντων καὶ ὑπὸ αὐτῆς τῆς ἀληθείας· καὶ ἡμεῖς δὲ μαρτυροῦμεν, καὶ ⸀οἶδας ὅτι ἡ μαρτυρία ἡμῶν ἀληθής ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/012.yaml
  text: Demetrius has received testimony from everyone[a], and from the truth itself. We also testify[b], and you know that our testimony is true.
translation:
  language: zh_hans
  text: 众人都为低米丢作证[a]，真理本身也为他作证[b]。我们也为他作证；你知道我们的见证是真的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文采用“作见证”的完成时被动形式，也可译作“低米丢得到了众人的见证”，表示这种认可已经确立，至今仍然有效。
    reason: lexical_alternative
  - marker: b
    text: “真理本身”可能表示低米丢的生活符合真理，也可能更广泛地表示福音或真理本身为他作证。
    reason: alternative_reading
lexical_decisions:
- source_word: Δημητρίῳ
  choice: 低米丢
  rationale: 采用现代中文圣经中较通行的人名音译，清楚指向该人物，不赋予名字额外含义。
- source_word: μεμαρτύρηται
  choice: 都为……作证
  rationale: 希腊文为完成时被动语态，表示已经形成、现今仍有效的见证或认可。中文改用自然的主动句式，并在脚注说明原文语态与时态意味；不在正文擅加原文没有的“好”字。
- source_word: ὑπὸ πάντων
  choice: 众人
  rationale: ὑπό加属格标明被动结构中的施事者；“众人都”自然保留其广泛范围。
- source_word: ὑπὸ αὐτῆς τῆς ἀληθείας
  choice: 真理本身也为他作证
  rationale: 保留αὐτῆς的强调意味及ἀλήθεια的约翰文献用语，不缩窄为“福音”，也不直接释作他的生活表现。
- source_word: καὶ ἡμεῖς δὲ μαρτυροῦμεν
  choice: 我们也为他作证
  rationale: δέ在此主要承接并增添另一重见证；“也”自然表达这种附加关系。根据上下文补出“为他”，使中文指向清楚。
- source_word: οἶδας
  choice: 你知道
  rationale: οἶδα虽具有完成时形式，在通用希腊语中通常表达现今的认知状态。
- source_word: ἡ μαρτυρία ἡμῶν
  choice: 我们的见证
  rationale: 与本节反复出现的μαρτυρέω保持词根呼应，译为“见证”自然且准确。
- source_word: ἀληθής ἐστιν
  choice: 是真的
  rationale: 直接表达谓语形容词的意义，并与前文“真理”保留语义联系。
theological_decisions:
- issue: “真理本身”如何为低米丢作证
  choice: 正文保留“真理本身也为他作证”
  alternative: 译作“福音为他作证”或“他的生活符合真理”
  rationale: 原文有意将“真理”拟人化或绝对化，其所指可能是低米丢的生活与真理相符，也可能更广泛地指福音或真理支持对他的见证。直译可保存约翰文献中的神学张力，不把其中一种解释写入正文。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。正文以主动句避免生硬的希腊式被动结构，并重复“为他作证”，呈现原文中见证词群的修辞连贯性；分号用来区分前两重见证与作者群体的补充见证。
