id: 3JN.1.10
reference: 3 John 1:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: διὰ τοῦτο, ἐὰν ἔλθω, ὑπομνήσω αὐτοῦ τὰ ἔργα ἃ ποιεῖ, λόγοις πονηροῖς φλυαρῶν ἡμᾶς, καὶ μὴ ἀρκούμενος ἐπὶ τούτοις οὔτε αὐτὸς ἐπιδέχεται τοὺς ἀδελφοὺς καὶ τοὺς βουλομένους κωλύει καὶ ἐκ τῆς ἐκκλησίας ἐκβάλλει.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/010.yaml
  text: For this reason[a], if I come, I will call attention to the works he is doing, maliciously babbling against us with evil words; and not content with these things, he himself does not receive the brothers[c][b], and he hinders those who want to do so and throws them out of the church.
translation:
  language: zh_hans
  text: 因此，我若去，就要把他所做的事提出来：他用恶毒的话胡乱攻击我们。他还不以此为足，自己不接待弟兄们[a][b]，又拦阻那些愿意接待的人，并把他们逐出教会[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “接待”也可译作“欢迎”；这里很可能包括为来访者提供款待。
    reason: lexical_alternative
  - marker: b
    text: “弟兄们”很可能指巡回服事的基督徒弟兄；这个称谓也可按较宽的群体意义理解为“信徒”。
    reason: lexical_alternative
  - marker: c
    text: “逐出教会”也可译作“赶出会众”；原文强调把人排除在当地信徒群体之外。
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: 因此
  rationale: 保留明确的因果、推论关系，简洁自然。
- source_word: ἐὰν ἔλθω
  choice: 我若去
  rationale: 按书信中作者相对于收信人的空间视角，现代汉语通常说“去”；“若”保留条件意味，语体庄重而不古奥。
- source_word: ὑπομνήσω αὐτοῦ τὰ ἔργα ἃ ποιεῖ
  choice: 就要把他所做的事提出来
  rationale: ὑπομιμνῄσκω本义涉及提醒、使人想起；在此语境中是将其行为公开提起、使人注意。“提出来”既保留提醒意味，也符合问责语境，但不额外断定具体处置方式。
- source_word: λόγοις πονηροῖς φλυαρῶν ἡμᾶς
  choice: 他用恶毒的话胡乱攻击我们
  rationale: “恶毒的话”对应λόγοις πονηροῖς；“胡乱”传达φλυαρέω所含空泛、愚妄言谈之意，“攻击我们”表达其敌对指向，同时避免把内容过度限定为某一种诽谤。
- source_word: μὴ ἀρκούμενος ἐπὶ τούτοις
  choice: 他还不以此为足
  rationale: 保留“不满足于这些事、恶行不止于此”的递进关系，语言凝练庄重。
- source_word: οὔτε αὐτὸς ἐπιδέχεται τοὺς ἀδελφούς
  choice: 自己不接待弟兄们
  rationale: ἐπιδέχομαι在这里指接受、欢迎，语境尤其涉及款待；“接待”自然涵盖欢迎并给予款待。αὐτός的强调以“自己”体现。
- source_word: τοὺς ἀδελφούς
  choice: 弟兄们
  rationale: 保留希腊文阳性复数及基督徒亲属称谓；上下文很可能指巡回服事的男性基督徒，但以脚注说明可能的语用范围。
- source_word: τοὺς βουλομένους κωλύει
  choice: 又拦阻那些愿意接待的人
  rationale: 从前句补明省略的动作“接待”，使汉语清楚；“愿意”体现βούλομαι的意愿，“拦阻”保留κωλύω可指阻碍、制止而未明确手段的宽泛含义。
- source_word: ἐκ τῆς ἐκκλησίας ἐκβάλλει
  choice: 把他们逐出教会
  rationale: “逐出”体现ἐκβάλλω强制排除的力度；“教会”是此处ἐκκλησία在地方基督徒群体语境中的自然译法。
theological_decisions:
- issue: “弟兄们”（τοὺς ἀδελφούς）的性别和所指范围
  choice: 弟兄们
  alternative: 弟兄姊妹／信徒
  rationale: 原文采用阳性复数，而且本书语境指向巡回的基督徒同工，因此保留男性标记较为稳妥；同时用脚注承认该称谓在基督徒群体中可能具有较宽的群体用法。
- issue: “逐出教会”的对象与性质
  choice: 把那些愿意接待弟兄的人逐出教会
  alternative: 把他们赶出聚会／排斥在会众之外
  rationale: 原文没有在ἐκβάλλει后重述宾语，最近的复数对象是“那些愿意的人”，故以“他们”承接；“逐出教会”表达群体排除，但不进一步规定其是否等同于后世某种正式教会纪律程序。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不以此为足”略带书面色彩，用来保持原文递进式责备的力度；其余措辞避免生硬直译。以冒号引出对“所做的事”的具体说明，再分句呈现诋毁、拒绝接待、拦阻和逐出教会等连续行为。
