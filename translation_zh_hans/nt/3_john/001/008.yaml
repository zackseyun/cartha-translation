  text: ἡμεῖς οὖν ὀφείλομεν ⸀ὑπολαμβάνειν τοὺς τοιούτους, ἵνα συνεργοὶ γινώμεθα τῇ ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/008.yaml
  text: Therefore[a], we ought to receive such people[b], so that we may become fellow workers for the truth.
translation:
  language: zh_hans
  text: 所以，我们应当接待这样的人[a]，好让我们成为为真理而同工的人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “接待”在这里也可包含欢迎、款待并在物质上支持这些出外服事的人。
    reason: lexical_alternative
  - marker: b
    text: 或译“与真理同工”或“在真理中同工”。希腊语的与格在这里可以有不止一种理解；正文采用“为真理的事业共同工作”这一含义。
    reason: alternative_reading
lexical_decisions:
- source_word: ἡμεῖς
  choice: 我们
  rationale: 保留原文显式代词所带的强调，并作为现代汉语中自然的主语。
- source_word: οὖν
  choice: 所以
  rationale: 表明本节是从上一节所述事实得出的结论；“所以”自然、清楚地承接上下文。
- source_word: ὀφείλομεν
  choice: 应当
  rationale: 表达道德责任和义务，同时不把语气强化为不容分辨的绝对命令。
- source_word: ὑπολαμβάνειν
  choice: 接待
  rationale: 在本段语境中指接纳这些出外服事的人，并可包含款待和实际供给；“接待”既贴近原词，又符合现代汉语表达。
- source_word: τοὺς τοιούτους
  choice: 这样的人
  rationale: 指上一节所描述的那一类出外服事者；译法自然，也不在原文泛指类别之处额外强化性别。
- source_word: ἵνα
  choice: 好让
  rationale: 清楚表达目的或预期结果，语气自然且庄重。
- source_word: συνεργοὶ
  choice: 同工的人
  rationale: 保留共同参与工作的含义；与后面的“为真理”连用，避免误解为仅仅彼此合作。
- source_word: γινώμεθα
  choice: 成为
  rationale: 保留γίνομαι“成为、进入某种状态”的动态含义：借着接待和支持，他们便参与这项工作。
- source_word: τῇ ἀληθείᾳ
  choice: 为真理
  rationale: 主文按与格表示受益或所效力对象来理解，即为真理的事业共同工作；同时以脚注保留“与真理”或“在真理中”的可能性。
theological_decisions:
- issue: τῇ ἀληθείᾳ与συνεργοὶ之间的关系
  choice: “为真理同工”，表示参与并支持真理的工作
  alternative: “与真理同工”或“在真理中同工”
  rationale: 上文谈到有人为了“那名”出外，本节则说明接待他们会使信徒参与其工作。“为真理”在现代汉语中较清楚地传达这种效力于真理之事业的意思；但希腊语与格容许不止一种理解，因此不在正文和脚注中消除其真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的书信体。“接待这样的人”承接上文，“好让”自然表达目的。“成为为真理同工的人”略带正式色彩，以保留原文“成为”和“同工”的结构；两个脚注标记均置于各自所说明的词语之后。
