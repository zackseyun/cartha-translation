id: 3JN.1.2
reference: 3 John 1:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ἀγαπητέ, περὶ πάντων εὔχομαί σε εὐοδοῦσθαι καὶ ὑγιαίνειν, καθὼς εὐοδοῦταί σου ἡ ψυχή.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/002.yaml
  text: Beloved[a], I pray that in all respects you may prosper and be healthy[d][c][b], just as your soul prospers.
translation:
  language: zh_hans
  text: 亲爱的，我祈求你各方面都顺利[a]，身体健康[b]，正如你的心灵景况良好[c]一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在一切事上都顺利”。传统上有译作“最要紧的是”，但希腊原文更自然地表示范围，而不是优先次序。
    reason: alternative_reading
  - marker: b
    text: 直译可作：“健康”或“有良好的健康状况”。
    reason: lexical_alternative
  - marker: c
    text: 或译：“你的灵魂兴盛”或“你的内在生命景况良好”。原文这里与前面的“顺利”使用同一个动词。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητέ
  choice: 亲爱的
  rationale: 这是ἀγαπητός的阳性单数呼格，用作充满爱意的称呼。“亲爱的”自然、庄重，并保留了与“爱”的词义联系；不增添原文没有明说的“朋友”或“弟兄”。
- source_word: περὶ πάντων
  choice: 各方面都
  rationale: 该短语在这里较自然地表示范围，即“在一切方面”，而不是表示优先次序的“最要紧的是”。
- source_word: εὔχομαί
  choice: 我祈求
  rationale: εὔχομαι在书信语境中可表示祷告或愿望。“我祈求”保留了宗教语气，也符合现代汉语表达。
- source_word: σε εὐοδοῦσθαι
  choice: 你……都顺利
  rationale: εὐοδόομαι本有行程顺利之意，引申为进展顺利、境况良好。此处采用“顺利”，避免把它收窄为物质富足。
- source_word: ὑγιαίνειν
  choice: 身体健康
  rationale: 此处与总体顺利及心灵状况并列，指身体健康；补出“身体”能在汉语中清楚呈现这一层意思。
- source_word: καθὼς
  choice: 正如……一样
  rationale: καθώς引出比较；这一表达清楚保留外在生活、身体状况与心灵状况之间的类比。
- source_word: εὐοδοῦταί σου ἡ ψυχή
  choice: 你的心灵景况良好
  rationale: 原文再次使用εὐοδόομαι，说明ψυχή正处于良好状态。若机械重复“心灵顺利”，汉语不自然，因此译为“心灵景况良好”，并在脚注保留其他可能表达。
- source_word: ψυχή
  choice: 心灵
  rationale: ψυχή可指生命、自我或灵魂。这里与身体健康相对，“心灵”能自然表达人的内在生命，又不强行规定一套精细的人论。
theological_decisions:
- issue: περὶ πάντων表示范围还是优先次序
  choice: 译作“各方面都”，表示范围
  alternative: “最要紧的是”或“首先”
  rationale: 句法和通常用法更支持范围义，即作者为收信人在各方面顺利而祈求；不应把它改成一项最高优先级的宣告。
- issue: εὐοδοῦσθαι是否专指物质兴旺
  choice: 译作“顺利”，涵盖总体境况良好
  alternative: “兴旺”或“富足”
  rationale: 该词语义较宽，并不单指财富。采用“顺利”可避免把本节变成物质繁荣的保证或教义命题。
- issue: ψυχή的含义
  choice: 译作“心灵”
  alternative: “灵魂”、“生命”或“内在生命”
  rationale: 上下文把身体健康与ψυχή的良好状况并列。“心灵”保留这种内外对照，同时不把本节用于断定人的构成方式。
translation_notes:
  register: 采用现代、自然而庄重的书信语体。“亲爱的”保留亲切称呼而不增添身份词；“各方面都顺利”避免传统“凡事兴盛”可能引发的物质繁荣联想；末句优先保证汉语自然，同时用脚注说明原文动词的重复。
