base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/001.yaml
  text: The elder to beloved Gaius[a], whom I love in truth.
translation:
  language: zh_hans
  text: 作长老的写信给亲爱的该犹，就是我在真理中[a]所爱的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我真诚地爱他”；也可理解为：“我在这真理中爱他。”希腊语可指真挚的爱、以福音真理为根基的爱，或兼有两者。
    reason: alternative_reading
lexical_decisions:
- source_word: Ὁ πρεσβύτερος
  choice: 作长老的
  rationale: 这是写信人的自称。译作“作长老的”既自然，也保留其身份或职分意味；不译成单指年龄的“老人”，也不采用较技术化的教会术语。
- source_word: Γαΐῳ
  choice: 该犹
  rationale: 采用现代中文圣经传统中通行且易辨认的音译。
- source_word: τῷ ἀγαπητῷ
  choice: 亲爱的
  rationale: 作为收信人的亲切称呼，“亲爱的”符合现代中文书信表达，也保留与后文“爱”的语义联系。
- source_word: ὃν ἐγὼ ἀγαπῶ
  choice: 就是我……所爱的人
  rationale: 关系代词作ἀγαπῶ的宾语；“就是我……所爱的人”在中文中清楚连接“该犹”，并以“我”体现希腊文显式代词ἐγώ的轻微强调。
- source_word: ἐν ἀληθείᾳ
  choice: 在真理中
  rationale: 直译并保留约翰文献中“真理”可能具有的神学内涵，同时不把该短语单一限定为“真诚地”。
theological_decisions:
- issue: ἐν ἀληθείᾳ中“真理”的含义
  choice: 在真理中
  alternative: 真诚地；在这真理中
  rationale: 该短语可能表达真挚的爱，也可能指扎根于福音真理、处于真理范围内的爱，或兼有两者。正文保留其张力，不替读者预先判定。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“作长老的写信给……”补出中文书信所需的谓语“写信”，但不增添原文没有的实质信息；整体保留原文简洁的书信开头。
