  text: Εἰρήνη σοι. ἀσπάζονταί σε οἱ φίλοι. ἀσπάζου τοὺς φίλους κατ’ ὄνομα.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/015.yaml
  text: Peace to you[a]. The friends greet you[b]. Greet the friends by name.
translation:
  language: zh_hans
  text: 愿你平安[a]。朋友们问候你。请按名字逐一问候朋友们[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“愿平安与你同在”。原文直译“平安给你”，是简洁的书信祝福语。
    reason: lexical_alternative
  - marker: b
    text: 或译“逐一问候朋友们”或“按名字问候朋友们”；原文直译“按名字”，强调亲自逐个问候。
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰρήνη σοι
  choice: 愿你平安
  rationale: 希腊文直译为“平安归与你”，是简洁的书信祝福语；现代汉语用“愿你平安”既自然，又明确表达原文省略的祝愿语气。
- source_word: ἀσπάζονταί σε
  choice: 问候你
  rationale: 这是书信结语中常见的问候用语；“问候你”准确、自然，也与下句命令式形成呼应。
- source_word: οἱ φίλοι / τοὺς φίλους
  choice: 朋友们 / 各位朋友
  rationale: 保留 φίλοι 的通常含义“朋友”，不将其同化为“弟兄”或增添原文没有的所属代词。两处按汉语句法略作变化，但词义一致。
- source_word: κατ’ ὄνομα
  choice: 逐一按名
  rationale: 原文直译为“按名字”，含有亲自、逐个问候的意味；“逐一按名”兼顾字面形象和汉语清晰度。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书信语体。“愿你平安”符合汉语祝福表达；“朋友”保留本节有别于常见“弟兄”称谓的措辞。所有脚注标记均置于相关正文之后。
