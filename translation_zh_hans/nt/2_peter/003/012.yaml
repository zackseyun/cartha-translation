  text: προσδοκῶντας καὶ σπεύδοντας τὴν παρουσίαν τῆς τοῦ θεοῦ ἡμέρας, δι’ ἣν οὐρανοὶ πυρούμενοι λυθήσονται καὶ στοιχεῖα καυσούμενα τήκεται·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/012.yaml
  text: as you wait for and hasten the coming of the day of God[a], because of which the heavens, being set on fire, will be dissolved, and the elements, burning[b], will melt.
translation:
  language: zh_hans
  text: 等候并催促上帝之日的来临[a]，因那日，诸天被火焚烧，就必瓦解；元素[b]也必在燃烧中熔化。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“热切等候上帝之日的来临。”译作“催促”的希腊词也可表示“热切期待”。
    reason: alternative_reading
  - marker: b
    text: “元素”可能指构成世界的基本成分，也可能指天体。
    reason: lexical_alternative
lexical_decisions:
- source_word: προσδοκῶντας
  choice: 等候
  rationale: 现在分词延续上一节的劝勉，表达带着期待的等候；“等候”自然且不过度强化情绪色彩。
- source_word: σπεύδοντας
  choice: 催促
  rationale: 此处以“来临”为宾语，可理解为促使其加快来到；希腊词也可能表示“热切期待”，因此在脚注保留另一种理解。
- source_word: παρουσίαν
  choice: 来临
  rationale: 该词本可表示临在或到达；在末世语境中，“来临”最清楚自然。
- source_word: τῆς τοῦ θεοῦ ἡμέρας
  choice: 上帝之日
  rationale: 保留原文不同于常见“主的日子”的特殊表达，并以较凝练庄重的中文呈现。
- source_word: δι’ ἣν
  choice: 因那日
  rationale: διά加宾格在这里最自然地表示原因；“那日”明确回指上帝之日。
- source_word: οὐρανοὶ
  choice: 诸天
  rationale: 保留希腊文复数及其宇宙性语境。
- source_word: πυρούμενοι
  choice: 被火焚烧
  rationale: 体现分词的被动含义，即诸天遭受烈火焚烧。
- source_word: λυθήσονται
  choice: 将……消解
  rationale: 此处指被拆散、瓦解，不必解释成形而上的彻底消灭；“消解”与上下文的宇宙解体相称。
- source_word: στοιχεῖα
  choice: 各种元素
  rationale: 采用涵盖面较广的译法，不强行判定它指世界的基本构成，还是天体。
- source_word: καυσούμενα
  choice: 燃烧
  rationale: 简洁表达受热或被火烧灼的状态，与随后“熔化”自然衔接。
- source_word: τήκεται
  choice: 将……熔化
  rationale: 该词表示因热而熔化或消融；按上下文未来事件译作“将熔化”，使中文时态关系清楚。
theological_decisions:
- issue: σπεύδοντας τὴν παρουσίαν的含义
  choice: 催促……来临
  alternative: 热切等候……来临
  rationale: 希腊文既可表达促使那日加快来到，也可能表达热切盼望。正文采用与直接宾语结构相符的读法，脚注保留神学意义较弱、但词义上成立的另一种解释。
- issue: στοιχεῖα的所指
  choice: 各种元素
  alternative: 天体
  rationale: 该词在末世论语境中的具体所指有争议；正文采用最低限度解释的广义译法，以免引入特定宇宙观。
translation_notes:
  register: 采用现代、庄重而易懂的书面语。“上帝之日”保留原文罕见称谓；“诸天”“消解”适合本节宇宙性的审判图景。脚注标记均置于正文相应词语之后。
