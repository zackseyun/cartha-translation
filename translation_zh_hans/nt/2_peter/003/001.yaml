source:
  edition: SBLGNT
  text: Ταύτην ἤδη, ἀγαπητοί, δευτέραν ὑμῖν γράφω ἐπιστολήν, ἐν αἷς διεγείρω ὑμῶν ἐν ὑπομνήσει τὴν εἰλικρινῆ διάνοιαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/001.yaml
  text: Beloved[a], this is now the second letter I am writing to you; in both of them I am stirring up your sincere mind by way of reminder[b],
translation:
  language: zh_hans
  text: 亲爱的各位，我现在写给你们的是第二封信；我在这两封信中都借着提醒来激发你们纯洁的心思[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“真诚的心思”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπητοί
  choice: 亲爱的弟兄姊妹们
  rationale: 这是复数呼格，表达对收信人的深厚关爱。中文以“亲爱的弟兄姊妹们”自然体现基督徒书信中的群体称呼与亲切、庄重的语气。
- source_word: Ταύτην ἤδη ... δευτέραν ... ἐπιστολήν
  choice: 我现在写给你们的是第二封信
  rationale: 按照现代汉语语序重组，保留“现在”和“第二封信”的信息及强调。
- source_word: γράφω
  choice: 写
  rationale: 希腊语现在时在书信语境中指作者当下的写作行为；现代汉语配合“现在”即可自然表达。
- source_word: ἐν αἷς
  choice: 在这两封信中……都
  rationale: 关系代词为阴性复数，与所提及的两封信呼应；明确译出“两封”和“都”，使希腊语的复数关系在中文中清楚可见。
- source_word: διεγείρω
  choice: 唤起
  rationale: 该动词有唤醒、激发之意；“唤起”保留其比喻色彩，并自然表达借提醒使人重新留意。
- source_word: ἐν ὑπομνήσει
  choice: 借着提醒
  rationale: 介词短语在这里表达方式或手段；“借着提醒”简洁自然。
- source_word: εἰλικρινῆ διάνοιαν
  choice: 纯正的心思
  rationale: διάνοια指心思、理解或思维，εἰλικρινής可指纯净、真诚、无杂质。“纯正的心思”兼顾道德与认知层面的完整性，同时以脚注保留“真诚”的词义可能。
- source_word: ὑμῶν
  choice: 你们
  rationale: 属格代词修饰“心思”，在中文中自然译作领属形式“你们的”。
theological_decisions:
- issue: 复数关系代词ἐν αἷς的所指
  choice: 指作者写给收信人的两封信
  alternative: 将复数宽泛理解为只指目前这封信
  rationale: 阴性复数关系代词最自然地回指上下文中的两封信；译作“在这两封信中，我都……”忠实呈现语法，不据此附加有关书信身份或正典范围的主张。
translation_notes:
  register: 采用现代、庄重而易懂的书信语体。“亲爱的弟兄姊妹们”传达复数称呼的群体性与亲爱语气；“借着提醒，唤起”保留原文的方式结构和唤醒比喻。主文本中的脚注标记[a]与脚注对应。
