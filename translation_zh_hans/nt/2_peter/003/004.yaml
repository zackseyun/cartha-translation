  text: καὶ λέγοντες· Ποῦ ἐστιν ἡ ἐπαγγελία τῆς παρουσίας αὐτοῦ; ἀφ’ ἧς γὰρ οἱ πατέρες ἐκοιμήθησαν, πάντα οὕτως διαμένει ἀπ’ ἀρχῆς κτίσεως.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/004.yaml
  text: and saying[a], “Where is the promise of his coming? For ever since the fathers fell asleep[b], all things continue just as they have from the beginning of creation.”
translation:
  language: zh_hans
  text: 并且说：“他降临的应许[a]在哪里呢？因为自从先辈们睡去[b]以来，万物一直保持原样，从创造之初就是如此。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “降临”所译的希腊词也可译作“临在”或“来到”；在这里，指所期待的基督未来再来。
    reason: lexical_alternative
  - marker: b
    text: “睡去”是希腊语中婉指死亡的说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: 并且说
  rationale: 保留现在分词与上文对嘲讽者之描述相衔接的语流，不擅自补入原文没有的内容。
- source_word: ἐπαγγελία
  choice: 应许
  rationale: 这是该词的常用对应，所指是关于他降临的应许；“他应许的降临”在现代汉语中自然，也保留了属格结构的关系。
- source_word: παρουσίας
  choice: 降临
  rationale: 在本段末世语境中，指所期待的基督未来来到；“降临”既能表达来到，也符合庄重的经文语体。脚注保留“临在、来到”等词义可能。
- source_word: ἀφ’ ἧς
  choice: 自从……以来
  rationale: 自然表达从过去某一时间点延续至今的时间关系。
- source_word: οἱ πατέρες
  choice: 先辈们
  rationale: 希腊文有定冠词而无物主代词。“先辈们”不擅自补作“我们的”，也比“列祖”更少限定为特定族长。
- source_word: ἐκοιμήθησαν
  choice: 睡去
  rationale: 保留原文以睡眠婉指死亡的比喻，同时在现代汉语中具有可理解的死亡委婉义。
- source_word: πάντα
  choice: 万物
  rationale: 概括性表达中性复数的普遍范围，简洁而庄重。
- source_word: οὕτως διαμένει
  choice: 一直保持原样
  rationale: 表达事物持续处于同一状态的意思，并反映嘲讽者关于世界不变的论点。
- source_word: ἀπ’ ἀρχῆς κτίσεως
  choice: 从创造之初
  rationale: 贴近原文介词和属格结构，清楚指向创造开始之时。
theological_decisions:
- issue: 末世语境中 παρουσία 的含义
  choice: 他应许的降临
  alternative: 他应许的临在／来到
  rationale: 上下文嘲讽所期待之事件迟迟未发生，因此此处主要指基督未来的来到；“降临”清楚传达这一点，但脚注承认该词也可表达“临在”或“来到”。
- issue: ἐκοιμήθησαν 的死亡委婉语
  choice: 睡去
  alternative: 死去
  rationale: 原文使用睡眠比喻而非直说死亡，译文保留这一修辞，不额外断定其神学含义；脚注说明其实际所指。
- issue: οἱ πατέρες 所指的群体
  choice: 先辈们
  alternative: 列祖／祖先
  rationale: 经文本身未明确限定这些“父辈”是族长、犹太祖先还是较近的上一代，因此采用范围较开放的“先辈们”，保留所指的含混性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“并且说”保留本节与上文的句法衔接；“从创造之初就是如此”使希腊文的持续状态在汉语中表达完整。所有脚注标记均置于其所解释的词语之后。
