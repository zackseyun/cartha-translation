  text: through which the world of that time[a], having been flooded with water[b], perished.
translation:
  language: zh_hans
  text: 那时的世界借着这些被水淹没后，就灭亡了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δι’ ὧν
  choice: 借着这些
  rationale: διά与属格表示媒介或手段；复数关系代词所指承接上一节，但具体范围略有开放，因此不在正文中限定为单一事物。
- source_word: ὁ τότε κόσμος
  choice: 那时的世界
  rationale: 自然表达τότε所形成的时间对比，并保留κόσμος既可涉及当时人类世界、也可涉及当时世界秩序的语义宽度。
- source_word: ὕδατι
  choice: 被水
  rationale: 与被动分词“淹没”结合，简洁表达水作为淹没的媒介或手段。
- source_word: κατακλυσθεὶς
  choice: 淹没
  rationale: 准确传达被洪水漫过、吞没之意；现代汉语自然，也不必把希腊文动词改写为专名式的“洪水”。
- source_word: ἀπώλετο
  choice: 灭亡了
  rationale: 表达严重毁灭而不必断言形而上的彻底消灭；与该动词在此处的不及物意义相符。
theological_decisions:
- issue: 洪水审判的性质
  choice: 灭亡了
  alternative: 被毁灭了
  rationale: 希腊文可表达灭亡或遭毁坏；“灭亡了”保留审判的严重性，同时不额外断定绝对湮灭。
- issue: δι’ ὧν的具体所指
  choice: 借着这些
  alternative: 借着它们／因此
  rationale: 复数关系代词承接上一节提到的媒介，但其精确先行项存在解释空间；译文保留复数和指代开放性，不把它限定为某一种要素。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“那时的世界”与下文“现在的天地”形成自然对照；句序尽量贴近希腊文的手段—主体—经历—结果结构，同时避免生硬欧化。
