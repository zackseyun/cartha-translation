  text: ὑμεῖς οὖν, ἀγαπητοί, προγινώσκοντες φυλάσσεσθε ἵνα μὴ τῇ τῶν ἀθέσμων πλάνῃ συναπαχθέντες ἐκπέσητε τοῦ ἰδίου στηριγμοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/017.yaml
  text: Therefore[a], you, beloved, knowing this beforehand, guard yourselves so that, being carried away by the error of the lawless[b], you may not fall from your own stability.
translation:
  language: zh_hans
  text: 所以，亲爱的，你们既然预先知道了这些事，就务要警醒自守，免得被不法之人的谬误裹挟，从自己稳固的地位上跌落[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “自己稳固的地位”也可译作“自己的坚定状态”或“自己的坚定”。希腊语 στηριγμός 可指稳固、坚定或稳固的位置。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς οὖν
  choice: 所以……你们
  rationale: οὖν承接上文作推论性转折；明确译出ὑμεῖς，以保留对受信人的强调。
- source_word: ἀγαπητοί
  choice: 亲爱的弟兄姊妹
  rationale: 这是带有牧养温情的呼语；按现代汉语书信语境作包容性表达，自然且庄重。
- source_word: προγινώσκοντες
  choice: 既然预先知道了这些事
  rationale: 保留“预先知道”的时间含义，并以“既然”体现分词在此所带的背景或原因关系；“这些事”由上下文补足。
- source_word: φυλάσσεσθε
  choice: 要谨慎自守
  rationale: 体现现在时中间语态命令所表达的持续警醒和反身意味，且符合现代汉语表达。
- source_word: ἵνα μὴ
  choice: 免得
  rationale: 自然表达目的兼警告的否定从句。
- source_word: τῇ τῶν ἀθέσμων πλάνῃ
  choice: 不守法之人的谬误
  rationale: πλάνη在此指使人偏离的错误；ἀθέσμος指无视或违背规范者，译作“不守法之人”保留其法则与道德规范意味。
- source_word: συναπαχθέντες
  choice: 被……裹挟
  rationale: 保留被动语态及“被一同带走”的复合词意味，也传达受他人错误影响而偏离的动态。
- source_word: ἐκπέσητε
  choice: 跌落
  rationale: 保留ἐκπίπτω的坠落隐喻，不将其明确解释为失去救恩或背道。
- source_word: τοῦ ἰδίου στηριγμοῦ
  choice: 从自己稳固的立足之处
  rationale: στηριγμός可指稳固、坚定或稳固的位置；此译结合“跌落”的空间隐喻，并保留ἰδίου的所属强调。
theological_decisions:
- issue: ἐκπέσητε是否特指失去救恩或背道
  choice: 从自己稳固的立足之处跌落
  alternative: 离弃自己的坚定立场；失去自己在信仰中的稳固地位
  rationale: 希腊文发出从稳固状态跌落的真实警告，却没有在本句中明确界定其最终神学后果；译文保留警告力度而不替经文解决有关坚忍或背道的教义争论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“亲爱的弟兄姊妹”自然传达ἀγαπητοί的牧养温情；“被……裹挟”与“从……立足之处跌落”保留原文鲜明的动态和空间隐喻。
