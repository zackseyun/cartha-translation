id: 2PE.3.14
reference: 2 Peter 3:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Διό, ἀγαπητοί, ταῦτα προσδοκῶντες σπουδάσατε ἄσπιλοι καὶ ἀμώμητοι αὐτῷ εὑρεθῆναι ἐν εἰρήνῃ,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/014.yaml
  text: Therefore[a], beloved, since you are waiting for these things, make every effort to be found by him spotless and blameless in peace.
translation:
  language: zh_hans
  text: 所以，亲爱的各位，你们既然等候这些事，就要竭力，以便在平安中被他[a]发现为毫无玷污、无可指责的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在他面前显为毫无玷污、无可指责的。”原文的与格既可理解为施事（“被他发现为”），也可理解为关系或临在（“在他面前”）。
    reason: alternative_reading
lexical_decisions:
- source_word: Διό
  choice: 所以
  rationale: 承接上文有关主的日子、新天新地的论述，引出相应的劝勉；“所以”自然、明确地表达推论关系。
- source_word: ἀγαπητοί
  choice: 亲爱的各位
  rationale: 保留复数呼语的亲切语气，同时不添加原文未明说的亲属称谓或性别信息。
- source_word: ταῦτα προσδοκῶντες
  choice: 你们既然等候这些事
  rationale: 表达现在分词所含持续等候的意味，并保留它与主句之间兼具背景和因由色彩的关系；“这些事”不把上文所指进一步具体化。
- source_word: σπουδάσατε
  choice: 就要竭力
  rationale: 体现命令语气和认真尽力、积极追求的力度，且符合现代汉语表达。
- source_word: ἄσπιλοι
  choice: 毫无玷污
  rationale: 保留“污点”这一道德纯洁的形象，也与后面的ἀμώμητοι形成意义相近而措辞不同的并列。
- source_word: ἀμώμητοι
  choice: 无可指责
  rationale: 自然表达不受责难、无可归咎的含义，并避免与“毫无玷污”完全合并。
- source_word: αὐτῷ εὑρεθῆναι
  choice: 被他看为
  rationale: 以自然汉语表达“被他发现处于某种状态”；保留代词“他”，不擅自明说是“主”或“神”。与格也可表示在他面前，故以脚注保留另一读法。
- source_word: ἐν εἰρήνῃ
  choice: 在平安中
  rationale: 贴近原文，并保留“平安”可能涉及内在安宁、与神和好的处境或群体和睦等不同层面，不增补原文没有的对象。
theological_decisions:
- issue: 末世语境中αὐτῷ的所指及句法功能
  choice: 正文译作“被他看为”，保留隐含的神圣审察者而不明确补出“主”或“神”。
  alternative: “在他面前显为”或“在他看来是”。
  rationale: 原文代词在语境中指向与那日来临相关的神圣人物，但本节没有重述其身份；同时，与格既可按施事理解，也可按关系或临在理解。正文采用施事读法，脚注保存另一种真实可能。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“亲爱的各位”传达书信呼语的温情而不增添原文没有的身份限定；全句保留原文的末世劝勉、伦理成对用语以及“在平安中”的开放含义。
