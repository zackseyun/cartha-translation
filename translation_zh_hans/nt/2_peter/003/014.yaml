revisions:
- from: 所以，亲爱的各位，你们既然等候这些事，就要竭力，使自己在平安中被他[a]看为毫无玷污、无可指责的人。
  to: 所以，亲爱的各位，你们既然等候这些事，就要竭力，以便在平安中被他[a]发现为毫无玷污、无可指责的。
  rationale: 修订仅将“被他看为……的人”调整为“被他发现为……的”，以更贴近εὑρεθῆναι的被动“被发现”及其后形容词补足语的结构，同时删除无对应的“人”。保留“在平安中”的位置和语义开放性，也保留αὐτῷ可作施事或关系／临在理解的脚注。
