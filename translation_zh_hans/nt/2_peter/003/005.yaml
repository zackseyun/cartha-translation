id: 2PE.3.5
reference: 2 Peter 3:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: λανθάνει γὰρ αὐτοὺς τοῦτο θέλοντας ὅτι οὐρανοὶ ἦσαν ἔκπαλαι καὶ γῆ ἐξ ὕδατος καὶ δι’ ὕδατος συνεστῶσα τῷ τοῦ θεοῦ λόγῳ,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/005.yaml
  text: 'For they deliberately overlook this: that the heavens existed long ago[a], and the earth was formed out of water and through water by the word of God[c][b],'
translation:
  language: zh_hans
  text: 因为他们故意忽略了这件事：诸天早已存在[a]，地是靠着上帝的话[c]，从水而出、借水形成的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“诸天自古就有。”
    reason: lexical_alternative
  - marker: b
    text: “地”在希腊文中没有冠词，可能着重于作为受造领域的地，而不是把它当作专名。
    reason: lexical_alternative
  - marker: c
    text: 或译：“靠着上帝的命令。”原文较直译为“靠着上帝的话”。
    reason: lexical_alternative
lexical_decisions:
- source_word: λανθάνει γὰρ αὐτοὺς τοῦτο θέλοντας
  choice: 因为他们故意忽略了这件事
  rationale: 该表达把未曾留意或不予承认与主动意愿结合起来；“故意忽略”在现代汉语中自然地保留了认知与意志两方面的含义。
- source_word: οὐρανοὶ
  choice: 诸天
  rationale: 保留希腊文复数，并符合庄重而易懂的圣经宇宙论用语。
- source_word: ἔκπαλαι
  choice: 早已存在
  rationale: 在“存在”之前用“早已”，自然表达自古以来、很久以前便存在的时间含义。
- source_word: γῆ
  choice: 地
  rationale: 希腊文虽无冠词，但现代汉语不以冠词表达定指；“地”既可指受造的大地，也避免生硬地添加数量词。
- source_word: ἐξ ὕδατος καὶ δι’ ὕδατος
  choice: 从水而出、借水
  rationale: 分别保留ἐκ所表达的来源和διά所表达的媒介或途径，且维持两个短语的并列。
- source_word: συνεστῶσα
  choice: 形成的
  rationale: 此完成时分词描述地在创造中的构成及其既成状态；“形成”在本语境中自然，也不把含义过度限定为“组成”或“维系”。
- source_word: τῷ τοῦ θεοῦ λόγῳ
  choice: 靠着上帝的话
  rationale: 以“靠着”表达工具性的与格，并保留λόγος的正式表达“话”，不将其提前解释为单纯的命令，也不明示为位格性的“道”。
theological_decisions:
- issue: λόγῳ是否应译成暗示有位格之“道”的措辞
  choice: 靠着上帝的话
  alternative: 借着上帝的命令
  rationale: 本节指向上帝在创造中有效的话语，却没有明确把λόγος用作基督的称号；译文保留原文措辞及其可能联系，而不额外加入基督论上的明确指认。
- issue: ἐξ ὕδατος καὶ δι’ ὕδατος中水与地形成的关系
  choice: 从水而出、借水形成
  alternative: 由水构成、靠水维系
  rationale: 介词组合存在来源、媒介及空间关系上的解释张力；译文尽量保留“从”与“借”的差异，不把经文限定为某一种物质构成理论。
translation_notes:
  register: 采用现代、庄重而通顺的简体中文。“诸天”保留原文复数和经文语体；“故意忽略”明确呈现意志性却不夸大为完全明知后的否认。脚注标记均置于相关词语之后，并按正文出现次序列出。
