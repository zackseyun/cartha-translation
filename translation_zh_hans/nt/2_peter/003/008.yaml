  text: Ἓν δὲ τοῦτο μὴ λανθανέτω ὑμᾶς, ἀγαπητοί, ὅτι μία ἡμέρα παρὰ κυρίῳ ὡς χίλια ἔτη καὶ χίλια ἔτη ὡς ἡμέρα μία.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/008.yaml
  text: 'But do not let this one thing escape your notice[a], beloved: with the Lord one day is like a thousand years[c][b], and a thousand years like one day.'
translation:
  language: zh_hans
  text: 亲爱的各位，有一件事你们不可忽略[a]：在主看来，一日如千年[c][b]，千年也如一日。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“有一件事你们不可不知道。”
    reason: lexical_alternative
  - marker: b
    text: 这里两次使用“如”，表达类比，并不是说一日与一千年在字面上完全相等。
    reason: cultural_note
  - marker: c
    text: 呼应《诗篇》90:4。
    reason: cross_reference
lexical_decisions:
- source_word: Ἓν δὲ τοῦτο
  choice: 有一件事
  rationale: 保留中性单数结构所突出的“这一件事”；汉语中用“有一件事”引出后文，自然且有强调作用。δέ在此作轻微转折或话语推进，结合“不可”已能自然体现，未机械译出。
- source_word: μὴ λανθανέτω ὑμᾶς
  choice: 你们不可忽略
  rationale: λανθάνω在此指未被注意、逃过注意；“不可忽略”保留命令语气，且符合现代汉语表达。脚注补充“不可不知道”这一较贴近认知状态的译法。
- source_word: ἀγαπητοί
  choice: 亲爱的弟兄姊妹
  rationale: 这是对信徒群体亲切的呼语。“亲爱的弟兄姊妹”以自然、尊重的现代教会汉语传达其群体性与亲爱语气；“弟兄姊妹”属于语境性补足，并不限定性别。
- source_word: παρὰ κυρίῳ
  choice: 在主看来
  rationale: παρά加与格可表达在某位面前或从其视角、衡量而言。“在主看来”自然传达这里的视角含义，又不把它误解为单纯空间上的“与主同在”。
- source_word: μία ἡμέρα ... ὡς χίλια ἔτη
  choice: 一日如千年
  rationale: ὡς明确标示比较。“如”简洁庄重，并保留类比而非等同；也与诗篇90:4的传统经文语感相协调。
- source_word: καὶ χίλια ἔτη ὡς ἡμέρα μία
  choice: 千年也如一日
  rationale: 保持原文前后倒置而均衡的平行结构；“也”自然承接καί，汉语无需补出系词。
- source_word: χίλια ἔτη
  choice: 千年
  rationale: 直接保留明确的数词表达，不将其象征化或改写为不确定的漫长时期。
theological_decisions:
- issue: 时间比较的性质
  choice: 译为“一日如千年，千年也如一日”，保留主与时间关系上的类比。
  alternative: 将一日与一千年视为字面等值，或把本节译成末世时间换算公式。
  rationale: 两处ὡς都表示“如、好像”，是比较而非数学等式。译文不引入预言年代计算体系，也不进一步解释神如何超越或经历时间，从而保留经文本身的张力。
- issue: παρὰ κυρίῳ所表达的关系
  choice: 采用“在主看来”，突出从主的角度或衡量而言。
  alternative: 译作“在主那里”或“在主面前”，较多保留空间或临在色彩。
  rationale: 该介词结构兼有临在与视角的可能性；上下文讨论所谓迟延，现代汉语“在主看来”最自然，但不据此构建更具体的时间神学。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“一日如千年，千年也如一日”保持原文凝练对称的修辞；称呼译作“亲爱的弟兄姊妹”，使普通读者清楚这是对信徒群体的亲切呼语。所有脚注标记均置于相关正文之后，并依照给定标记保留[c][b]的次序。
