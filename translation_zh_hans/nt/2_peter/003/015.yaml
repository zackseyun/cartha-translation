  text: καὶ τὴν τοῦ κυρίου ἡμῶν μακροθυμίαν σωτηρίαν ἡγεῖσθε, καθὼς καὶ ὁ ἀγαπητὸς ἡμῶν ἀδελφὸς Παῦλος κατὰ τὴν ⸂δοθεῖσαν αὐτῷ⸃ σοφίαν ἔγραψεν ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/015.yaml
  text: And regard the patience of our Lord as salvation[a], just as our beloved brother Paul also wrote to you according to the wisdom given to him[b],
translation:
  language: zh_hans
  text: 并且要把我们主的忍耐看作救恩[a]；正如我们亲爱的弟兄保罗，也曾照着赐给他的智慧[b]写信给你们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “忍耐”也可译作“宽容”；意思是，主迟延施行审判旨在带来救恩，并非漠不关心。
    reason: lexical_alternative
  - marker: b
    text: “赐给他的智慧”很可能指上帝所赐的智慧，不过希腊文没有明说施予者。
    reason: alternative_reading
lexical_decisions:
- source_word: μακροθυμίαν
  choice: 恒久忍耐
  rationale: 该词表示长久克制、迟延施行审判。译作“恒久忍耐”既保留词义中的时间与忍耐成分，也符合上文主尚未施行审判的语境。
- source_word: σωτηρίαν
  choice: 救恩
  rationale: 在末世审判的语境中，该词指上帝借着迟延审判所成就的拯救目的；“救恩”保留了新约中的神学分量。
- source_word: ἡγεῖσθε
  choice: 看作
  rationale: 此命令式要求读者把某事认定为某种性质；“把……看作……”自然地表达其表语关系。
- source_word: τοῦ κυρίου ἡμῶν
  choice: 我们主的
  rationale: κύριος在此按上下文指主耶稣；“主”保留称号及其神学意义。
- source_word: ὁ ἀγαπητὸς ἡμῶν ἀδελφὸς Παῦλος
  choice: 我们亲爱的弟兄保罗
  rationale: “亲爱的弟兄”自然、庄重地传达ἀγαπητός的亲爱意味，以及彼得对保罗的弟兄称呼。
- source_word: κατὰ τὴν δοθεῖσαν αὐτῷ σοφίαν
  choice: 照着赐给他的智慧
  rationale: κατά加宾格表示依照；保留被动式“赐给”，不在正文中明说施予者。
- source_word: ἔγραψεν ὑμῖν
  choice: 写信给了你们
  rationale: 简单过去时对应希腊文不定过去时；“写信给”在书信语境中比单说“写给”更自然。
- source_word: καθὼς καὶ
  choice: 正如……也
  rationale: 同时保留比较关系与附加意味，把本句劝勉和保罗相应的教导联系起来。
theological_decisions:
- issue: “赐给他的智慧”中施予者的身份
  choice: 正文保留“赐给他的”这一被动表达，不明说“上帝”。
  alternative: 照着上帝赐给他的智慧
  rationale: 上下文很可能暗示智慧由上帝所赐，但希腊文并未明说施予者；保留被动结构可避免把隐含信息提升为明文。
- issue: 主迟延行动的意义
  choice: 将μακροθυμία与σωτηρία直接译为“恒久忍耐”和“救恩”，保留“看作救恩”的直接判断。
  alternative: 把主的宽容看作得救的机会
  rationale: “得救的机会”虽能解释经意，却增加原文没有明说的“机会”；直译式判断更能保留原句的神学张力，即主的忍耐具有救赎性的目的。
translation_notes:
  register: 采用现代、庄重且易懂的普通话书面语。“恒久忍耐”比传统色彩较强的“恒忍”更清楚，也比单用“忍耐”更充分体现μακροθυμία所含的长久克制。正文保留原文的句法关系及未明说的施予者；脚注只说明词义选择和隐含信息。
