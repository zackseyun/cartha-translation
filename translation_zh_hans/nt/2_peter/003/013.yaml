source:
  edition: SBLGNT
  text: καινοὺς δὲ οὐρανοὺς καὶ γῆν καινὴν κατὰ τὸ ἐπάγγελμα αὐτοῦ προσδοκῶμεν, ἐν οἷς δικαιοσύνη κατοικεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/013.yaml
  text: But according to his promise[a], we are waiting for new heavens and a new earth, in which righteousness dwells.
translation:
  language: zh_hans
  text: 但我们照着他的应许，等候新天新地；公义[a]住在其中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “公义”也可译作“正义”。
    reason: lexical_alternative
lexical_decisions:
- source_word: καινοὺς ... οὐρανοὺς / γῆν καινὴν
  choice: 新天新地
  rationale: 保留圣经中宇宙性的新创造用语，并呼应《以赛亚书》65:17、66:22；καινός强调性质上的新，不宜径自解释为“更新后的”。
- source_word: δὲ
  choice: 但
  rationale: 表达本节与上文现今诸天和地被毁之间的温和转折。
- source_word: κατὰ τὸ ἐπάγγελμα αὐτοῦ
  choice: 照着他的应许
  rationale: κατά加宾格表示依照、符合；ἐπάγγελμα指应许。此译法自然保留对上帝所应许之话的指称。
- source_word: προσδοκῶμεν
  choice: 等候
  rationale: 现在时表达持续的期待；“等候”兼顾等待和盼望的意味。
- source_word: ἐν οἷς
  choice: 在那里
  rationale: 希腊文关系代词为复数，整体指向“新天新地”这一新创造领域；汉语用“在那里”自然，也不强行限定其语法所指。
- source_word: δικαιοσύνη
  choice: 公义
  rationale: δικαιοσύνη在此包含合乎上帝旨意的正直状态与秩序；“公义”比单指社会层面公平的“正义”更能保留其广度。
- source_word: κατοικεῖ
  choice: 常住
  rationale: κατοικέω表示居住、定居；“常住”简洁地传达稳定、持久的居所意味。
theological_decisions:
- issue: 末世语境中 δικαιοσύνη 的译法
  choice: 公义
  alternative: 正义
  rationale: “公义”保留该词在圣经语境中合乎上帝旨意的广泛道德和关系含义；“正义”也是可能的侧重，故在脚注中注明。
- issue: 新天新地是全新创造还是更新后的创造
  choice: 新天新地
  alternative: 更新后的天和地
  rationale: καινός可强调性质上的新，但本节本身没有明确说明创造方式；直译为“新”可保留这一张力，避免超出原文作出判断。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“新天新地”为普通读者熟悉的圣经表达；分号使末句对新创造的特征形成清晰强调。
