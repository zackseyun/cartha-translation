id: 2PE.3.10
reference: 2 Peter 3:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἥξει δὲ ⸀ἡμέρα κυρίου ὡς ⸀κλέπτης, ἐν ᾗ οἱ οὐρανοὶ ῥοιζηδὸν παρελεύσονται, στοιχεῖα δὲ καυσούμενα ⸀λυθήσεται, καὶ γῆ καὶ τὰ ἐν αὐτῇ ἔργα ⸀εὑρεθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/010.yaml
  text: But the day of the Lord will come like a thief[a], in which the heavens will pass away with a roar, and the elements, being burned, will be dissolved[c][b], and the earth and the works in it will be found.
translation:
  language: zh_hans
  text: 但主的日子必像贼一样来到；在那日，诸天必轰然消逝，元素必被焚烧而瓦解[a]，地和地上所做的一切都将被发现[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “元素”也可理解为“天体”；这个词在本段宇宙性的语境中，也可指宇宙的基本组成部分。
    reason: lexical_alternative
  - marker: b
    text: 有些人把“都将被发现”理解为“都将显露出来”或“都将暴露无遗”。
    reason: alternative_reading
  - marker: c
    text: 许多抄本在这里作“都将被烧尽”，而不是“都将被发现”。
    reason: textual_variant
lexical_decisions:
- source_word: ἥξει
  choice: 必……来到
  rationale: 表达将来必然发生的到来，也符合末世语境中的庄重语气。
- source_word: ἡμέρα κυρίου
  choice: 主的日子
  rationale: 保留先知和使徒传统中的末世性固定表达，避免误解为每周的敬拜日。
- source_word: ὡς κλέπτης
  choice: 像贼一样
  rationale: 保留比喻，重点在于出其不意地来到；现代汉语自然易懂。
- source_word: ἐν ᾗ
  choice: 在那日
  rationale: 自然地指回前述“主的日子”，比直译“在其中”更符合汉语表达。
- source_word: οἱ οὐρανοὶ
  choice: 诸天
  rationale: 保留希腊文复数及宇宙性语境，也与“地”形成对应。
- source_word: ῥοιζηδόν
  choice: 轰然
  rationale: 简洁传达急速而响亮的呼啸、轰鸣声，同时保持经文的力度。
- source_word: παρελεύσονται
  choice: 必……消逝
  rationale: 在末世语境中表示不再存留；“消逝”比“经过”更准确，也较自然。
- source_word: στοιχεῖα
  choice: 构成万物的元素
  rationale: στοιχεῖα 可指宇宙的基本构成成分，也可能特指天体；正文采用较宽泛且普通读者可理解的表达，不把含义限定为现代化学元素。
- source_word: καυσούμενα λυθήσεται
  choice: 必在烈火中瓦解
  rationale: 同时表达受热焚烧的过程和被解体、拆散的结果，不强行补出施事者。
- source_word: γῆ
  choice: 地
  rationale: 上下文涉及诸天及宇宙构成，故指大地而非某一地区。
- source_word: τὰ ἐν αὐτῇ ἔργα
  choice: 地上的工程
  rationale: “工程”可指人在地上所造、所做的一切，既保留 ἔργα 的“工作、成果”意味，也避免仅收窄为道德行为。
- source_word: εὑρεθήσεται
  choice: 必被发现
  rationale: 紧贴所给 SBLGNT 正文的困难读法，保留其含义上的张力，不在正文中擅自改成“烧尽”或“显露”。
theological_decisions:
- issue: 末句 καὶ γῆ καὶ τὰ ἐν αὐτῇ ἔργα εὑρεθήσεται 的含义
  choice: 地和地上的工程都必被发现
  alternative: 地和地上的工程都必显露；或都必被烧尽
  rationale: 所给正文 εὑρεθήσεται 最直接是“将被发现”。其确切语用含义及抄本传统均有争议，因此正文保留较难读法，脚注说明解释与异文。
- issue: στοιχεῖα 的所指
  choice: 构成万物的元素
  alternative: 天体
  rationale: 此词在宇宙性语境中可泛指宇宙构成成分，也可能指天体；正文保持较宽泛的含义，脚注保留更具体的理解。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“轰然消逝”“在烈火中瓦解”保持宇宙审判图景的力度；末句刻意保留原文的困难表达，并用脚注交代解释和文本异文。
