    rationale: 原词在此可指“元素／宇宙的基本组成部分”，也可能被理解为“天体”；“构成万物的”将其明确说成构成一切事物的成分，超过原文所明说的范围。正文宜保留“元素”的开放性，并在脚注说明可能所指。
  - severity: medium
    issue: “地上的工程”过度收窄 τὰ ἐν αὐτῇ ἔργα。
    rationale: ἔργα 可涵盖地上所做的事、作为或成果，并不特别指工程建设。“地上所做的一切”既自然又较完整地保留该词的范围。
  - severity: low
    issue: “在烈火中瓦解”略带具体化。
    rationale: καυσούμενα 表示正在被焚烧；“被焚烧而瓦解”直接保留参与词与主句动词之间的关系，不必补成“烈火中”的场景性表达。
