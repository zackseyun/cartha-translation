revisions:
- from: 但主的日子必像贼一样来到；在那日，诸天必轰然消逝，构成万物的元素必在烈火中瓦解[a]，地和地上的工程都必被发现[b][c]。
  to: 但主的日子必像贼一样来到；在那日，诸天必轰然消逝，元素必被焚烧而瓦解[a]，地和地上所做的一切都将被发现[b][c]。
  rationale: 修订避免为“元素”加入原文未明说的“构成万物”范围，将“工程”改为能涵盖 ἔργα 的“地上所做的一切”，并更直接表达“被焚烧而瓦解”。末句仍按所给 SBLGNT 的 εὑρεθήσεται 译为“将被发现”，不以解释性或异文读法替代；相关解释及异文保留在脚注中。
