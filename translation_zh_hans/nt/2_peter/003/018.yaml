  text: αὐξάνετε δὲ ἐν χάριτι καὶ γνώσει τοῦ κυρίου ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ. αὐτῷ ἡ δόξα καὶ νῦν καὶ εἰς ἡμέραν αἰῶνος. ⸀ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/018.yaml
  text: But grow in the grace and knowledge of our Lord and Savior Jesus the Messiah[a]. To him be the glory both now and to the day of eternity[b]. Amen.
translation:
  language: zh_hans
  text: 但你们要在我们的主和救主耶稣——这位弥赛亚——的恩典和知识上不断长进[a]。愿荣耀归给他，从现在直到永恒之日[b]。阿们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶稣——这位弥赛亚——”也可按传统译作“耶稣基督”。
    reason: alternative_reading
  - marker: b
    text: 或译：“从现在直到永远。”希腊文较直译为“从现在直到永恒之日”。
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐξάνετε
  choice: 要……不断长进
  rationale: 现在时主动命令语气、第二人称复数；“不断长进”自然表达持续性的劝勉，同时保留命令语气。
- source_word: δὲ
  choice: 但
  rationale: 承接上文的警告并形成温和转折；“但”准确而自然。
- source_word: ἐν χάριτι καὶ γνώσει
  choice: 在……的恩典和知识上
  rationale: ἐν同时支配两个与格；汉语用“在……上长进”表达成长所涉及的领域，避免把二者误解为长进的手段。
- source_word: χάριτι
  choice: 恩典
  rationale: 符合新约语境中的常用神学含义，准确且为现代中文读者熟悉。
- source_word: γνώσει
  choice: 知识
  rationale: 保留γνῶσις的基本含义，不将其过度解释为单纯的“认识”或“理解”；所属结构表明这是关于主耶稣弥赛亚的知识。
- source_word: τοῦ κυρίου ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ
  choice: 我们的主和救主耶稣弥赛亚
  rationale: 单一冠词统摄“主”和“救主”，两项称号指同一位，即耶稣；Χριστός在此作为称号译为“弥赛亚”。
- source_word: αὐτῷ ἡ δόξα
  choice: 愿荣耀归给他
  rationale: 补出希腊文颂赞句中省略的系词，以自然、庄重的现代汉语表达归荣耀的祈愿。
- source_word: καὶ νῦν καὶ εἰς ἡμέραν αἰῶνος
  choice: 从现在直到永恒之日
  rationale: 保留ἡμέραν“日”这一不寻常而有意义的措辞；“从现在直到”自然传达καὶ…καὶ及εἰς所表达的时间跨度。
- source_word: ἀμήν
  choice: 阿们
  rationale: 采用中文圣经及基督教颂赞语境中通行的音译。
theological_decisions:
- issue: Ἰησοῦ Χριστοῦ中Χριστοῦ的译法
  choice: 耶稣弥赛亚
  alternative: 耶稣基督
  rationale: Χριστός在此仍具有称号功能；译出“弥赛亚”可呈现其含义，“基督”则作为传统音译在脚注中保留。
- issue: “我们的主和救主”的所指
  choice: 两个称号都指同一位耶稣弥赛亚
  alternative: 用较含混的中文结构，不明确两个称号是否同指一位
  rationale: 希腊文以一个冠词统摄κύριος和σωτήρ，语法自然表明二者共有同一所指；译文直接反映这一点，不另加超出语法的教义解释。
- issue: “永恒之日”的末世意味
  choice: 保留“日”而不直接化约为“永远”
  alternative: 从现在直到永远
  rationale: 原文ἡμέραν αἰῶνος措辞独特，可能带有末世之日与永恒延续的张力；正文保留其形式，脚注提供惯用译法。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“不断长进”呈现命令的持续意味；“愿荣耀归给他”符合中文颂赞语体；正文保留原文“永恒之日”的特殊表达，并以脚注给出较惯用的译法。
