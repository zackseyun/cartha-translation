  rationale: 修订仅改善汉语的自然度并更清楚地呈现原文结构：以“凭着”表达与格的工具意义，以“同一”保留αὐτῷ的回指；“被保存着，留待火”分别对应完成被动分词与现在被动分词，且不对火的性质或受造界的结局作额外诠释。删除不适用于中文措辞的性别说明脚注。
