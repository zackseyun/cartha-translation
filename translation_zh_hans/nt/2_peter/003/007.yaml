  naturalness: “因着同一个话语被存留，保留给火”略显口语化且有近距离重复。“凭着同一话语被保存着，留待火”更符合现代庄重书面汉语，同时保留原文的两个相关但不相同的动词。
  terminology: “诸天”“不敬虔之人”“审判”均恰当。“人”在现代汉语本已可泛指全体人类，故不需要以性别包容性为由附加脚注。
