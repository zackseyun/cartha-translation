source:
  edition: SBLGNT
  text: οἱ δὲ νῦν οὐρανοὶ καὶ ἡ γῆ τῷ ⸀αὐτῷ λόγῳ τεθησαυρισμένοι εἰσὶν πυρὶ τηρούμενοι εἰς ἡμέραν κρίσεως καὶ ἀπωλείας τῶν ἀσεβῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/007.yaml
  text: But the present heavens and the earth are stored up by the same word, being kept for fire until the day of judgment and destruction of ungodly men.
translation:
  language: zh_hans
  text: 但现今的诸天和地，凭着同一话语被保存着，留待火，直到审判和不敬虔之人灭亡的日子。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ νῦν οὐρανοὶ καὶ ἡ γῆ
  choice: 但现在的诸天和地
  rationale: δέ承接上文并形成对比，译为“但”；νῦν指现今的受造秩序；οὐρανοί的复数形式保留为“诸天”，γῆ译为“地”。
- source_word: τῷ αὐτῷ λόγῳ
  choice: 因着同一个话语
  rationale: λόγος回指上下文中上帝有功效的话语；与格表达凭借或工具关系。“同一个”保留αὐτῷ的回指作用。
- source_word: τεθησαυρισμένοι εἰσὶν
  choice: 被存留
  rationale: 这一迂回完成时表达先前行动所造成的持续状态。“被存留”在现代汉语中兼顾被动意义与当前仍然有效的结果，也避免与后面的τηρούμενοι完全重复。
- source_word: πυρὶ τηρούμενοι
  choice: 保留给火
  rationale: τηρέω表示保守、留存；πυρί在此表示所留待的对象或目的。“给火”保留原文不带冠词的简洁表达，不额外断定火所产生的宇宙性结果。
- source_word: εἰς ἡμέραν κρίσεως
  choice: 直到审判……的日子
  rationale: εἰς在这里指向末后的时间终点，译为“直到……的日子”，自然表达所存留的终向。
- source_word: καὶ ἀπωλείας
  choice: 和……灭亡
  rationale: ἀπώλεια可指毁灭、灭亡或败亡；“灭亡”清楚而庄重，并未引入后来的专门神学含义。
- source_word: τῶν ἀσεβῶν ἀνθρώπων
  choice: 不敬虔之人
  rationale: ἀσεβής表示不敬虔、不尊敬上帝；ἄνθρωπος在复数中可泛指人类，不限于男性，因此正文自然译为“不敬虔之人”。
theological_decisions:
- issue: 将来烈火结局的性质
  choice: 经文表明现今的诸天和地被保留给将来的火，并明确把“灭亡”与不敬虔之人相连；译文不进一步界定受造界是被彻底消灭还是经火更新。
  alternative: 将本节明确解释为宇宙彻底消灭，或明确解释为受造界被洁净更新。
  rationale: 原文清楚宣告末后的火、审判和不敬虔之人的灭亡，但ἀπωλείας在语法上直接关联τῶν ἀσεβῶν ἀνθρώπων。本节本身没有完整解决关于受造界最终形态的争论，因此保留其神学张力。
translation_notes:
  register: 采用现代、庄重且易懂的书面普通话。“诸天和地”保留原文复数及圣经语域；“因着同一个话语”清楚回指上文，并避免把λόγος具体化为原文未明说的专名。脚注标记已置于正文对应词语之后。
