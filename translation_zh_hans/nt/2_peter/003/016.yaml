  text: ὡς καὶ ἐν πάσαις ⸀ταῖς ἐπιστολαῖς λαλῶν ἐν αὐταῖς περὶ τούτων, ἐν ⸀αἷς ἐστιν δυσνόητά τινα, ἃ οἱ ἀμαθεῖς καὶ ἀστήρικτοι στρεβλοῦσιν ὡς καὶ τὰς λοιπὰς γραφὰς πρὸς τὴν ἰδίαν αὐτῶν ἀπώλειαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/016.yaml
  text: as also in all his letters[a], speaking in them about these things. In them are some things hard to understand, which the ignorant and unstable twist, as they do the rest of the Scriptures[c][b], to their own destruction.
translation:
  language: zh_hans
  text: 正如他在一切书信中谈论这些事一样；这些书信中有些难懂之处，无知和不稳固的人曲解这些难懂之处，正如他们也曲解其余的圣经书卷[a]一样，结果使自己灭亡。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “其余的圣经书卷”也可译作“其他的圣经书卷”。希腊语可表达“其余的”或“其他的”；这里的比较更适合译作“其余的圣经书卷”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστολαῖς
  choice: 书信
  rationale: 采用现代中文中自然且庄重的“书信”，准确表达书面通信，无须使用较古雅的“书札”或泛化为“著作”。
- source_word: λαλῶν
  choice: 谈到
  rationale: 该分词本义为“说、讲论”，但语境是保罗在书信中论及这些事；“谈到”既保留言说含义，也符合中文书信语境。
- source_word: περὶ τούτων
  choice: 这些事
  rationale: 直译指向上文所讨论的事项，保留代词指涉，不替读者具体限定内容。
- source_word: δυσνόητά τινα
  choice: 有些内容难以明白
  rationale: “有些”对应不定代词 τινα，“难以明白”准确而自然地表达 δυσνόητα；补出“内容”使中文指代清楚。
- source_word: ἀμαθεῖς
  choice: 无知
  rationale: 表达缺少学习和认识的状态，而不把意义局限于未受正规教育或不识字。
- source_word: ἀστήρικτοι
  choice: 不坚定
  rationale: 传达未得坚固、立场不稳的含义；比单用“动摇”更贴近对人的持续状态描述。
- source_word: στρεβλοῦσιν
  choice: 曲解
  rationale: 该词含扭曲、歪曲之意；“曲解”在中文中能自然表达把文本意义扭曲的动作，同时避免误解为物理性的扭转。
- source_word: τὰς λοιπὰς γραφὰς
  choice: 其余的圣经
  rationale: γραφαί 在此语境指神圣经典，“圣经”是现代中文的标准表达；λοιπάς 译作“其余的”，保留这些书信与其他经书并列比较的自然含义。
- source_word: ἀπώλειαν
  choice: 灭亡
  rationale: “灭亡”简明而庄重，表达严重、终局性的毁灭后果，又不额外规定其神学机制。
theological_decisions:
- issue: τὰς λοιπὰς γραφὰς 是否暗示保罗书信具有圣经地位
  choice: 译作“其余的圣经”
  alternative: “其他著作”或“其余的经卷”
  rationale: 新约中复数 γραφαί 通常指圣经，λοιπάς 自然地把前述书信与其余圣经作比较。译文保留这一语法和语义上的暗示，但不添加超出原文的教义说明。
- issue: πρὸς τὴν ἰδίαν αὐτῶν ἀπώλειαν 所表达的因果关系
  choice: 译作“结果使自己灭亡”
  alternative: “以致自己灭亡”或“自取灭亡”
  rationale: πρός 在此表示趋向或结果。“结果使自己灭亡”明确呈现曲解经文所导致的严重后果；避免“自取灭亡”可能附加的定罪语气。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“都是这样”承接上文并对应 ὡς καί；分成两句以保持中文清晰度。将两个 ἐν αὐταῖς／ἐν αἷς 的指向明确为“这些书信”，避免中文代词含混；随后用“这些内容”指难懂之处。脚注标记已置于对应主文“其余的圣经”之后。
