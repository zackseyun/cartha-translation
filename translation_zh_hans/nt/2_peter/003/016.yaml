  rationale: 修改首句以清楚呈现 ὡς καὶ 和 λαλῶν 的比较结构及“谈论”动作；将“有些内容难以明白”简化为更自然的“有些难懂之处”，并以“不稳固”更贴近 ἀστήρικτοι。将“其余的圣经”调整为“其余的圣经书卷”，改善现代中文搭配，并保留原文的复数及其与保罗书信并列的语义。
