  text: Τούτων ⸀οὕτως πάντων λυομένων ποταποὺς δεῖ ὑπάρχειν ὑμᾶς ἐν ἁγίαις ἀναστροφαῖς καὶ εὐσεβείαις,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/011.yaml
  text: Since all these things are being dissolved in this way[a], what sort of people ought you to be in holy conduct and godliness[b],
translation:
  language: zh_hans
  text: 既然这一切都要这样被拆毁，你们在圣洁的品行和敬虔上应当是怎样的人呢？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τούτων ... πάντων
  choice: 这一切
  rationale: 该属格短语回指上文所说的受造世界及其中的一切；中文用“这一切”即可自然表达，无须补出“事物”。
- source_word: οὕτως
  choice: 这样
  rationale: 保留其修饰解体方式的副词作用，并与上文所描述的情形衔接。
- source_word: λυομένων
  choice: 都在……解体
  rationale: λύω的现在时被动分词在此描述现今秩序被松解、瓦解；“解体”保留原词意象，避免用“毁灭”过度强化。
- source_word: ποταποὺς
  choice: 怎样的人
  rationale: 此词在修辞问句中询问人应有的性质或样式；“怎样的人”是自然、清楚的现代汉语。
- source_word: δεῖ
  choice: 应当
  rationale: 表达处境所带来的道德必要性，同时符合劝勉语气。
- source_word: ὑπάρχειν
  choice: 成为
  rationale: 在δεῖ与宾格主语ὑμᾶς的结构中表示应当具有怎样的为人；中文“成为怎样的人”比直译“存在”自然。
- source_word: ἐν ἁγίαις ἀναστροφαῖς
  choice: 在生活中有圣洁的品行
  rationale: ἀναστροφή指生活方式或行为表现；译文既保留伦理重点，也使ἐν结构在中文中自然。
- source_word: εὐσεβείαις
  choice: 敬虔
  rationale: 指对上帝的敬畏与委身在生活中的表现；“敬虔”是现代中文圣经语域中准确而通行的表达。
theological_decisions:
- issue: 末世中现今世界的结局
  choice: 将λυομένων译为“解体”
  alternative: 毁灭；瓦解
  rationale: 原词直接表达松开、分解，而上下文赋予其末世意义；译作“解体”既保留原有意象，也不擅自断定这是彻底消灭还是转化更新。
- issue: 修辞问句的伦理力度
  choice: 译为“你们应当成为怎样的人”
  alternative: 你们必须成为何等样的人
  rationale: “应当”表达δεῖ所含的必要性，却不额外加强为生硬命令；问句继续保留原文催促读者自省的作用。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“解体”保留原文的末世性松解意象；“在生活中有圣洁的品行和敬虔”使希腊文介词结构在中文中清楚可读。末尾用感叹号体现修辞问句的强烈劝勉；本节语意在下一节继续展开。
