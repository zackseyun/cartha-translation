  rationale: 修订明确末世语境中被动分词的未来指向，保留“拆解／松开”的词汇意象，并将原文的反问句式及介词短语调整为自然、庄重的现代标准汉语。脚注a相应更新为说明正文“被拆毁”的替代译法；脚注b保留并继续锚定“敬虔”。
