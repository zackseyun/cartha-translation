  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οὐ βραδύνει ⸀κύριος τῆς ἐπαγγελίας, ὥς τινες βραδύτητα ἡγοῦνται, ἀλλὰ μακροθυμεῖ εἰς ⸀ὑμᾶς, μὴ βουλόμενός τινας ἀπολέσθαι ἀλλὰ πάντας εἰς μετάνοιαν χωρῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/009.yaml
  text: The Lord is not slow concerning the promise[a], as some consider slowness, but is patient toward you[c][b], not wanting any to perish but all to come to repentance.
translation:
  language: zh_hans
  text: 主在应许的事上并不迟延，不像有些人所认为的那样迟缓；他反而对你们恒久忍耐[a]，不愿任何人灭亡，而愿人人都悔改[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“对你们有耐心”。
    reason: lexical_alternative
  - marker: b
    text: 这里“任何人”和“人人”的范围，希腊文并未进一步说明。有人理解为特指彼得的读者，也有人理解为更广泛地指所有人。
    reason: alternative_reading
lexical_decisions:
- source_word: κύριος
  choice: 主
  rationale: 按上下文作神性称号；现代中文中“主”自然、庄重，无须补出冠词。
- source_word: οὐ βραδύνει ... τῆς ἐπαγγελίας
  choice: 在应许的事上并不迟延
  rationale: 保留βραδύνει的迟延含义，并以“在……的事上”自然表达其后的属格关系，不擅自补成“履行应许”。
- source_word: ὥς τινες βραδύτητα ἡγοῦνται
  choice: 不像有些人所认为的那样迟缓
  rationale: ἡγέομαι译作“认为”，βραδύτητα译作“迟缓”，既保留与前句迟延概念的呼应，也符合现代汉语。
- source_word: μακροθυμεῖ
  choice: 恒久忍耐
  rationale: 表达长时间克制、耐心等候的语义，比单说“耐心”更能体现μακροθυμέω的持续意味，同时仍属通俗庄重的中文。
- source_word: εἰς ὑμᾶς
  choice: 对你们
  rationale: 直接表达态度所指向的对象；“对你们”较贴近εἰς，也比目的性的“为了你们”少作解释。
- source_word: μὴ βουλόμενός
  choice: 不愿……而愿
  rationale: βούλομαι表达意愿；“不愿”不把它技术化为某一种神学意义上的旨意。后半句依据ἀλλά的对照关系补出中文所需的“愿”。
- source_word: τινας ἀπολέσθαι
  choice: 任何人灭亡
  rationale: τινας在否定结构中自然译为“任何人”；ἀπολέσθαι用不及物的“灭亡”，避免额外强化为外力造成的“被毁灭”。
- source_word: πάντας
  choice: 人人
  rationale: 简洁表达“所有人”，并与“任何人”形成自然对照，不在译文中限定其范围。
- source_word: εἰς μετάνοιαν χωρῆσαι
  choice: 都悔改
  rationale: χωρέω与εἰς在此表示进入某一状态；汉语以“悔改”直接、自然地表达“进入悔改”，避免生硬的空间性直译。
theological_decisions:
- issue: “你们”“任何人”和“人人”的范围
  choice: 照希腊文直译为“对你们……不愿任何人灭亡，而愿人人都悔改”，不进一步限定所指范围。
  alternative: 将“任何人、人人”明确限定为收信群体或蒙拣选者；或明确扩展说明为全人类。
  rationale: 原文没有明说这些词的范围。译文保留其开放性，不替后来的教义争论作结论；脚注提示读者存在范围问题。
- issue: βουλόμενος所表达的神的意愿
  choice: 译为“不愿……而愿”，按一般意愿语言处理。
  alternative: 采用带有系统神学技术色彩的“定意”“命定”，或弱化为“并不乐见”。
  rationale: 原文表达意愿，却未在本节区分不同类别的神圣旨意；普通的“愿”最能保留经文本身的力度与张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“迟延／迟缓”保留原文词根呼应；“恒久忍耐”传达持续克制。“悔改”为μετάνοια在圣经语境中的标准现代汉语表达。所有脚注标记均置于相关主文之后。
