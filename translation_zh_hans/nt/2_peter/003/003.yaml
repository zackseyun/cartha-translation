base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/003.yaml
  text: 'knowing this first: that in the last days scoffers will come with scoffing[a], walking according to their own desires[b],'
translation:
  language: zh_hans
  text: 你们首先要知道这事：在末后的日子，必有讥诮者带着讥诮而来，随从自己的欲望而行[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “讥诮者带着讥诮而来”也可译作“嘲弄的人会以嘲弄的方式来到”。原文使用两个同源词，构成强调。“欲望”也可译作“私欲”或“情欲”；原词可泛指强烈的欲求，不一定只指性欲。
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο πρῶτον γινώσκοντες
  choice: 首先要知道
  rationale: 希腊文是前置的分词结构，直译近于“首先知道这事”。汉语用“首先要知道”自然地保留其劝勉语气与πρῶτον的优先意味，又不把它强化成独立命令。
- source_word: ἐλεύσονται
  choice: 必有……而来
  rationale: 保留将来时和“来到、出现”的基本意义；“必有”配合句末“而来”，在现代汉语中自然表达预告。
- source_word: ἐπ’ ἐσχάτων τῶν ἡμερῶν
  choice: 在末后的日子
  rationale: 这是具有末世意味的时间表达。“末后的日子”既符合现代中文圣经语体，也不限定具体的末世时间体系。
- source_word: ἐν ἐμπαιγμονῇ
  choice: 带着讥诮
  rationale: 与后面的同源名词ἐμπαῖκται形成“好讥诮的人……带着讥诮”的重复，以保留原文刻意加强的语气。
- source_word: ἐμπαῖκται
  choice: 好讥诮的人
  rationale: 指惯于嘲弄、讥讽的人。“好讥诮的人”比单用“讥诮者”更符合普通现代读者的表达习惯，同时保留其负面品格意味。
- source_word: κατὰ τὰς ἰδίας ἐπιθυμίας αὐτῶν
  choice: 随从自己的欲望
  rationale: κατά在此表示依照、受支配而行；“随从”自然传达这一关系。ἐπιθυμίαι范围可宽于性欲，因此用“欲望”而不窄化为“情欲”。
- source_word: πορευόμενοι
  choice: 而行
  rationale: 该分词在这里描述生活方式或行为。“而行”保留行走隐喻的痕迹，又比“行走”更自然地表达按某种欲望生活。
theological_decisions:
- issue: ἐπ’ ἐσχάτων τῶν ἡμερῶν的末世含义
  choice: 在末后的日子
  alternative: 在日子的末期／在最后的日子
  rationale: 采用传统而仍可理解的末世性表达，但不说明其起点、长短或与任何千禧年体系的关系，以保留经文本身的开放性。
- issue: ἐπιθυμίαι的道德与语义范围
  choice: 欲望
  alternative: 私欲／情欲
  rationale: 上下文使这些欲望带有负面道德色彩，但该词本身可指广义的强烈欲求；译作“欲望”避免擅自限定为性方面的欲念。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“首先要知道”清楚衔接上下文；“好讥诮的人带着讥诮而来”有意保留希腊文同源词重复带来的强调，虽略显重复，却符合原文修辞。全句不引入特定宗派的末世解释。
