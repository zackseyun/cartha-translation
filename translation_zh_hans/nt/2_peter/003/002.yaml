id: 2PE.3.2
reference: 2 Peter 3:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: μνησθῆναι τῶν προειρημένων ῥημάτων ὑπὸ τῶν ἁγίων προφητῶν καὶ τῆς τῶν ἀποστόλων ὑμῶν ἐντολῆς τοῦ κυρίου καὶ σωτῆρος,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/002.yaml
  text: to remember the words spoken beforehand by the holy prophets and the commandment of your apostles from the Lord and Savior[b][a],
translation:
  language: zh_hans
  text: 要记住圣先知从前所说的话，以及主和救主借着你们的使徒所传的命令[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以及你们的使徒所传、属于主和救主的命令。”原文连续几个属格之间的关系，可用不止一种自然方式表达。
    reason: alternative_reading
lexical_decisions:
- source_word: μνησθῆναι
  choice: 要记住
  rationale: 承接第1节所述目的；希腊语形式虽为不定过去时被动不定式，但该动词通常以中被动形式表达主动意义，现代汉语自然译为“记住”。
- source_word: προειρημένων ῥημάτων
  choice: 从前所说的话
  rationale: 保留“预先、从前”与“说出”的含义，不把 προλέγω 限定为预言未来的“预告”。
- source_word: ὑπὸ τῶν ἁγίων προφητῶν
  choice: 圣先知
  rationale: “圣先知”简洁自然，并保留先知分别为圣的身份；施事关系由“所说”结构自然表达。
- source_word: ἐντολῆς
  choice: 命令
  rationale: 保留单数及其权威性；现代汉语中“命令”比“诫命”更能在不预设特定律法语境的情况下自然表达 ἐντολή。
- source_word: τῶν ἀποστόλων ὑμῶν
  choice: 借着你们的使徒所传
  rationale: ὑμῶν 最自然地修饰“使徒”；“你们的使徒”表示与读者相关、奉差遣到他们那里的人。“所传”使使徒作为传达者的关系在汉语中清楚自然。
- source_word: τοῦ κυρίου καὶ σωτῆρος
  choice: 主和救主
  rationale: 保留两个并列称号，不增添原文没有的“我们的”；在本句中理解为命令的来源。
- source_word: κυρίου
  choice: 主
  rationale: 符合新约称号的惯常译法，并保留权柄含义。
- source_word: σωτῆρος
  choice: 救主
  rationale: 这是基督论语境中 σωτήρ 的标准、庄重而自然的汉语对应词。
theological_decisions:
- issue: τῶν ἀποστόλων ὑμῶν 中 ὑμῶν 的修饰关系
  choice: 译作“你们的使徒”，使“你们的”修饰“使徒”
  alternative: “使徒传给你们的命令”
  rationale: 词序和属格结构更自然地把 ὑμῶν 与 ἀποστόλων 相连；主译文不把“你们”改作命令的接受者。
- issue: τοῦ κυρίου καὶ σωτῆρος 与前文的句法关系
  choice: 理解为命令来自主和救主，并由使徒传达
  alternative: 把使徒理解为属于主和救主的人，即“你们那属于主和救主的使徒”
  rationale: 与 ἐντολῆς 相连可形成清楚的关系链：命令源自主和救主，借使徒传达。不过连续属格容许不止一种自然分析，因此以脚注保留另一种表达可能。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。“从前所说的话”避免把原文过度限定为预言；“借着……所传”明确表达命令源自主和救主、由使徒传达，同时以脚注保留希腊语属格结构的歧义。
