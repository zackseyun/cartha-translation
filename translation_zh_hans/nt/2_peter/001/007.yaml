base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/007.yaml
  text: and in godliness[a], brotherly affection; and in brotherly affection, love.
translation:
  language: zh_hans
  text: 在敬虔上加弟兄之情[a]，在弟兄之情上加爱。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“弟兄之爱”。希腊语φιλαδελφία指手足般的亲爱，在这里尤其指信徒彼此之间的亲情。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐσεβείᾳ
  choice: 敬虔
  rationale: εὐσέβεια指向对上帝的敬畏与委身，并体现于生活品行；“敬虔”在现代中文圣经语体中简洁而庄重，能兼顾其向神与伦理两个层面。
- source_word: φιλαδελφίαν
  choice: 弟兄之情
  rationale: φιλαδελφία表示手足般的亲爱，在此尤其指信徒彼此间的亲情。“弟兄之情”既保留其群体与亲情色彩，也避免与下文ἀγάπη同译为“爱”而抹去两词的区别。
- source_word: ἀγάπην
  choice: 爱
  rationale: ἀγάπη在此位于德行序列的高潮；译作简洁的“爱”，保留其较宽广的涵义，不额外限定为某一种爱的表现。
- source_word: ἐν δὲ τῇ ... τὴν ...
  choice: 在……上加……
  rationale: 这一结构承接前文“要加添”的命令，表达在已有德行上进一步增添下一项德行；“在……上加……”自然呈现层层递进的链式结构。
- source_word: δέ
  choice: 省译为并列递进关系
  rationale: δέ在此是轻微的连接词，并无强烈转折；中文借重复的“在……上加……”及逗号即可清楚表达累加关系，若机械译作“并且”反而显得累赘。
theological_decisions:
- issue: 区分德行序列中的φιλαδελφία与ἀγάπη
  choice: 将φιλαδελφία译为“弟兄之情”，将ἀγάπη译为“爱”
  alternative: 将φιλαδελφία译为“弟兄之爱”，将ἀγάπη也译为“爱”
  rationale: 原文连续使用两个相关但不同的词。“弟兄之情”凸显信徒之间如家人般的亲爱，同时让随后范围更广的“爱”保持修辞上的推进；这并不武断规定ἀγάπη的对象范围。
translation_notes:
  register: 采用现代、庄重且易懂的中文。“在……上加……”承接1:5起的德行链，既保留原文的重复结构，也比逐字译作“在……里面”更符合现代汉语。脚注标记置于其实际说明的“弟兄之情”之后。
