  text: εἰδὼς ὅτι ταχινή ἐστιν ἡ ἀπόθεσις τοῦ σκηνώματός μου, καθὼς καὶ ὁ κύριος ἡμῶν Ἰησοῦς Χριστὸς ἐδήλωσέν μοι·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/014.yaml
  text: knowing that the putting off of my tent is near[c][b][a], just as our Lord Jesus the Messiah made clear to me.
translation:
  language: zh_hans
  text: 我知道，我很快就要脱去我这帐棚了[a]，正如我们的主耶稣基督已经向我表明的那样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “很快就要脱去我这帐棚”也可译作“脱去我这帐棚的日子已近”。这是以脱去临时住所来比喻彼得将要离世。
    reason: 说明ταχινή的时间含义，并解释ἀπόθεσις与σκήνωμα所构成的死亡比喻。
lexical_decisions:
- source_word: εἰδὼς
  choice: 我知道
  rationale: 用陈述式自然承接上文，同时不把分词明确限定为原因关系。
- source_word: ταχινή
  choice: 很快就要
  rationale: 在此表达事情临近、即将发生；现代汉语自然，也避免用“迫在眉睫”加强原文语气。
- source_word: ἀπόθεσις
  choice: 脱去
  rationale: 保留“脱下、放下”的动作意象，不直接释为“死亡”。
- source_word: σκηνώματός μου
  choice: 我这帐棚
  rationale: 保留身体如临时帐棚的比喻；“这”使中文表达自然，并与本章13节的意象衔接。
- source_word: καθὼς καὶ
  choice: 正如
  rationale: 自然表达原文的比较和印证关系。
- source_word: ὁ κύριος ἡμῶν
  choice: 我们的主
  rationale: 保留标准的基督论称号和原文所属关系。
- source_word: Ἰησοῦς Χριστός
  choice: 耶稣基督
  rationale: “基督”是现代汉语圣经语境中通行且可辨识的 Χριστός 称号译法，并非姓氏。
- source_word: ἐδήλωσέν μοι
  choice: 已经向我表明
  rationale: 准确表达“使清楚、使知道”，又不把它强化为特定形式的启示。
theological_decisions:
- issue: 彼得将临死亡的比喻
  choice: 保留“脱去我这帐棚”的比喻
  alternative: 我很快就要死了
  rationale: 原文没有直接说“死亡”，而是以脱去临时住所比喻离开身体；保留该意象可维持原文的神学张力和文学特色。
- issue: Χριστός 的译法
  choice: 耶稣基督
  alternative: 耶稣弥赛亚
  rationale: 两者都表达受膏者称号；“耶稣基督”在现代标准汉语中更自然、庄重且广为理解，同时仍按称号理解，不视为姓氏。
- issue: ταχινή 的语义侧重
  choice: 很快就要
  alternative: 脱去的日子已近；脱去会来得突然
  rationale: 此词可涉及时间临近或迅速发生；正文采用最自然的临近义，不进一步断定死亡过程是否突然。
translation_notes:
  register: 采用现代、庄重而清楚的书面语。“我这帐棚”刻意保留原文略显突出的身体比喻；句末“的”承接“表明”的内容，符合自然汉语。
