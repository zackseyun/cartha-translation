  text: οὐ γὰρ θελήματι ἀνθρώπου ἠνέχθη ⸂προφητεία ποτέ⸃, ἀλλὰ ὑπὸ πνεύματος ἁγίου φερόμενοι ἐλάλησαν ⸀ἀπὸ θεοῦ ἄνθρωποι.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/021.yaml
  text: For prophecy was never brought forth by the will of man[c][b][a], but men spoke from God as they were carried along by the Holy Spirit.
translation:
  language: zh_hans
  text: 因为预言从来不是出于人的意愿而产生的[a]；而是人被圣灵带领[b]，从上帝那里说话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “产生的”也可译作“被带出来的”。原文动词是被动式，并与本节后面译作“带领”的词出自同一词根。
    reason: lexical_alternative
  - marker: b
    text: “被圣灵带领”也可译作“被圣灵推动”。原文较直译为“被带着前行”，强调圣灵主动的引导。
    reason: lexical_alternative
lexical_decisions:
- source_word: θελήματι ἀνθρώπου
  choice: 由人的意愿
  rationale: 以“由”表达被动句中的凭借或动因；“人的意愿”自然保留单数代表性用法，强调预言并非源于人的意志。
- source_word: ἠνέχθη
  choice: 带来的
  rationale: 保留 φέρω 的被动含义和预言被带出、产生的意象，并与后文同词根的 φερόμενοι 形成可感知的呼应。
- source_word: προφητεία
  choice: 预言
  rationale: 这是现代中文中对应先知性启示或言说的标准、简明译法。
- source_word: οὐ…ποτέ
  choice: 从来不是
  rationale: 自然表达 οὐ 与 ποτέ 结合所构成的强烈否定。
- source_word: ὑπὸ πνεύματος ἁγίου
  choice: 受圣灵
  rationale: “受”配合后面的“带动”，清楚表达 ὑπό 所标明的施事者。
- source_word: φερόμενοι
  choice: 带动
  rationale: 保留 φέρω 的具体动态意象及其与 ἠνέχθη 的词根呼应，表达圣灵主动引导，而不只是笼统的内在感动。
- source_word: ἐλάλησαν
  choice: 说出
  rationale: 以普通而庄重的现代汉语表达“说话、发言”；“出”也使句中的来源关系更加自然。
- source_word: ἀπὸ θεοῦ
  choice: 从上帝而来的
  rationale: 保留 ἀπό 的来源含义，并与圣灵作为主动施事者的表达相区别。
- source_word: ἄνθρωποι
  choice: 人
  rationale: 现代汉语“人”自然涵盖作为说话者的人类，无须添加原文没有的性别限定。
theological_decisions:
- issue: 预言中上帝与人的行动之间的关系
  choice: 译文既保留人真实地“说出”，也表明内容来自上帝，并且说话者受圣灵主动带动。
  alternative: 将经文译成圣灵机械口授，或译成人的意愿与神的影响共同产生预言。
  rationale: 原文同时陈述人的言说与决定性的神圣来源和圣灵行动；译文不把这种张力化约为机械口授，也不赋予人的意愿以预言源头的地位。
- issue: ἀπὸ θεοῦ 与句中其他成分的关系
  choice: 译作“说出从上帝而来的话”，使上帝成为所说内容的来源。
  alternative: 译作“人从上帝那里说话”，更直接保留介词短语与“说话的人”的句法联系。
  rationale: 原文明确强调来源，但具体句法关联在中文中若逐字照搬会明显生硬；本译法传达来源意义，同时不把 ἀπό 混同于表示施事者的 ὑπό。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“预言”“圣灵”“上帝”沿用清楚而通行的圣经用语；用“人”表达原文 ἄνθρωποι 的泛指含义。句式保留前后鲜明对照，并借“带来／带动”尽可能再现原文词根呼应。
