    rationale: ἡ εἴσοδος是ἐπιχορηγηθήσεται的主语，ὑμῖν是受益与格。原草稿虽保留被动意味，却更像“你们获得供应，然后得以进入”。
  - severity: medium
    issue: “耶稣弥赛亚[b]永恒的国度”结构界限不清。
    rationale: 中文中名字后直接接称号再接属格性定语，容易造成歧义或阅读阻滞；加入“这位”可明确“弥赛亚”是耶稣的称号，随后“的”明确国度归属。
  - severity: low
