  text: οὕτως γὰρ πλουσίως ἐπιχορηγηθήσεται ὑμῖν ἡ εἴσοδος εἰς τὴν αἰώνιον βασιλείαν τοῦ κυρίου ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/011.yaml
  text: For in this way entry into the eternal kingdom of our Lord and Savior Jesus the Messiah will be richly provided for you[a][b][c].
translation:
  language: zh_hans
  text: 因为这样，必会为你们丰丰富富地预备进入我们主和救主耶稣这位弥赛亚的永恒国度的通路。[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊语εἴσοδος可指“进入”这一行动，也可指“入口”或“进入的通路”。
    reason: lexical_alternative
  - marker: b
    text: 传统译法作“耶稣基督”。这里把希腊语称号Χριστός译为“弥赛亚”，以表达这个称号本身的含义。
    reason: alternative_reading
  - marker: c
    text: 也可译为：“因为这样，进入我们主和救主耶稣这位弥赛亚的永恒国度的入口，必会丰丰富富地供应给你们。”
    reason: formal_alternative
lexical_decisions:
- source_word: οὕτως γὰρ
  choice: 因为这样
  rationale: 既保留γάρ对上文的解释关系，也用“这样”承接前文所说的行事方式。
- source_word: πλουσίως ἐπιχορηγηθήσεται ὑμῖν
  choice: 你们就必蒙丰丰富富的供应
  rationale: 保留将来时、被动意味和“丰厚、充足”的语气；“蒙……供应”在现代中文中庄重而清楚。
- source_word: ἡ εἴσοδος εἰς
  choice: 得以进入
  rationale: 将名词结构自然地转化为中文动词结构，表达获准或得着途径进入的意思，而不额外加入“资格”“门”等原文没有的概念。
- source_word: τὴν αἰώνιον βασιλείαν
  choice: 永恒的国度
  rationale: “永恒”准确表达αἰώνιος在末世语境中的含义，“国度”是βασιλεία自然且常见的译法。
- source_word: τοῦ κυρίου ἡμῶν καὶ σωτῆρος
  choice: 我们主和救主
  rationale: 单一冠词统摄两个由καί连接的单数称号，中文以“我们主和救主”自然表明两者指向同一位。
- source_word: Ἰησοῦ Χριστοῦ
  choice: 耶稣弥赛亚
  rationale: 把Χριστός作为称号译出其“弥赛亚”之义，而非仅采用传统音译“基督”；语序仍依原文先名字、后称号。
theological_decisions:
- issue: “我们主和救主”所指的是一位还是两位
  choice: 两个称号都指耶稣弥赛亚这一位
  alternative: 把“主”与“救主”理解为不同对象
  rationale: 希腊文以一个冠词统摄两个由καί连接的单数人称名词，随后以“耶稣弥赛亚”加以限定，语法强烈支持同一所指。译文据此处理，不另行加入教派性说明。
- issue: 进入国度的供应方式
  choice: 保留被动表达，不明说供应者
  alternative: 明确补出“上帝必赐给你们”
  rationale: 原文采用神学被动式，没有明说施动者；译文用“必蒙……供应”保留这一含蓄与张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“丰丰富富”传达πλουσίως的充盈语气；全句避免生硬照搬希腊语名词性主语结构，同时以脚注保留较形式对应的译法。
