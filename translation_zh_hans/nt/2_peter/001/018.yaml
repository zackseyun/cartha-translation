source:
  edition: SBLGNT
  text: καὶ ταύτην τὴν φωνὴν ἡμεῖς ἠκούσαμεν ἐξ οὐρανοῦ ἐνεχθεῖσαν σὺν αὐτῷ ὄντες ἐν τῷ ⸂ἁγίῳ ὄρει⸃.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/018.yaml
  text: And we ourselves heard this voice brought from heaven when we were with him on the holy mountain[a].
translation:
  language: zh_hans
  text: 我们在那座圣山上同他在一起的时候，亲耳听见了这从天上传来的声音。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “传来的”或译“被从天上带来的”。
    reason: ἐνεχθεῖσαν为被动分词，表示这声音被从天上传达而来；“传来的”是自然的汉语表达，另译保留较贴近字面的“被带来”意象。
lexical_decisions:
- source_word: ταύτην τὴν φωνὴν
  choice: 这……声音
  rationale: φωνή在此回指上一节神所说的话，因此译作“声音”比“声响”更准确；“这”保留指示语气。
- source_word: ἡμεῖς
  choice: 我们……亲耳
  rationale: 希腊文显明主语代词以加强语气，突出使徒亲身见证；汉语用“亲耳”自然地表达这一强调。
- source_word: ἠκούσαμεν
  choice: 听见了
  rationale: 不定过去时指一次实际发生的听见事件；“听见了”比“聆听”更符合此处语境。
- source_word: ἐξ οὐρανοῦ
  choice: 从天上
  rationale: 直接保留声音来源的意义，符合现代汉语习惯。
- source_word: ἐνεχθεῖσαν
  choice: 发出的
  rationale: 该被动分词字面有“被带来、传来”之意；结合声音的汉语搭配，“从天上发出的”较自然，同时脚注保留较贴近形式的译法。
- source_word: σὺν αὐτῷ ὄντες
  choice: 同他……的时候
  rationale: 将分词结构自然地译为时间从句；“他”按上下文指耶稣，但正文不额外明说其名。
- source_word: ἐν τῷ ἁγίῳ ὄρει
  choice: 在那座圣山上
  rationale: 汉语对山通常说“在……山上”；“圣山”保留ἅγιος的神圣含义，“那座”使特指结构自然，但不擅自确定山名。
theological_decisions:
- issue: “圣山”所指的地点
  choice: 按原文描述为耶稣登山变像所在的“那座圣山”，不注明具体山名
  alternative: 明确译为他泊山或黑门山
  rationale: 希腊文没有给出山名；正文应保留这一未确定性，不引入后来的传统认定。
- issue: 见证人的强调
  choice: 用“亲耳听见”传达ἡμεῖς的强调
  alternative: 仅译“我们听见”
  rationale: 独立主语代词在希腊文中具有强调作用，语境也着重使徒的亲身见证；“亲耳”不增加新的事件内容。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“同他”略带经文庄重感但仍自然；“亲耳听见”清楚表达原文强调。脚注标记已在正文中呈现。
