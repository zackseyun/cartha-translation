source:
  edition: SBLGNT
  text: λαβὼν γὰρ παρὰ θεοῦ πατρὸς τιμὴν καὶ δόξαν φωνῆς ἐνεχθείσης αὐτῷ τοιᾶσδε ὑπὸ τῆς μεγαλοπρεποῦς δόξης· ⸂Ὁ υἱός μου ὁ ἀγαπητός μου οὗτός ἐστιν⸃, εἰς ὃν ἐγὼ εὐδόκησα—
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/017.yaml
  text: 'For when he received honor and glory from God the Father[a], such a voice was borne to him from the Majestic Glory: “This is my Son, my Beloved[c][b], in whom I am well pleased”—'
translation:
  language: zh_hans
  text: 因为他从父神领受尊荣和荣耀时，有这样的声音从那威严的荣光[a]传到他那里：“这是我的儿子，我所爱的[b]，我喜悦他[c]。”——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“由那威严的荣光传来。”希腊语 ὑπό 可以标明施事者；正文译作“从”，较自然地突出声音的来源。
    reason: lexical_alternative
  - marker: b
    text: 或译：“这是我的爱子。”希腊语较直译为：“这是我的儿子，我所爱的。”
    reason: lexical_alternative
  - marker: c
    text: 或译：“我所喜悦的”或“我曾喜悦他”。希腊语此处的介词用法表达喜悦所指向的对象；动词为过去时，在这一宣告中未必表示喜悦已经结束。这一说法与福音书所记耶稣受洗及登山变像时的宣告相呼应。
    reason: alternative_reading
lexical_decisions:
- source_word: λαβὼν γὰρ παρὰ θεοῦ πατρὸς
  choice: 因为他从父上帝领受了
  rationale: 将原因连词 γάρ 译为“因为”，并把不定式性质的过去时分词 λαβών 自然处理为完整汉语分句；παρά 加属格所表达的来源用“从”体现。“父上帝”保留 θεοῦ πατρὸς 的两个称谓。
- source_word: τιμὴν καὶ δόξαν
  choice: 尊荣和荣耀
  rationale: 分别保留两个并列名词；“尊荣”侧重所受的尊崇，“荣耀”对应 δόξα，避免将二者合并。
- source_word: φωνῆς ἐνεχθείσης αὐτῷ τοιᾶσδε
  choice: 有这样的声音……传给他
  rationale: 用“这样的声音”体现 τοιᾶσδε 对后文引语的前指作用；“传给他”保留 ἐνεχθείσης 的被动传递意象，同时符合现代汉语表达。
- source_word: ὑπὸ τῆς μεγαλοπρεποῦς δόξης
  choice: 从那威严的荣光
  rationale: “威严的荣光”保留 μεγαλοπρεποῦς 与 δόξης 的意象，并让这一敬称仍可理解为上帝荣耀的临在；正文用“从”强调声音的来源，脚注保留 ὑπό 所容许的施事表达。
- source_word: Ὁ υἱός μου ὁ ἀγαπητός μου οὗτός ἐστιν
  choice: 这是我的儿子，我所爱的
  rationale: 保留“我的儿子”与“我所爱的”同位并列的结构，也反映原文两次 μου，而不直接压缩成惯用的“我的爱子”。
- source_word: εἰς ὃν ἐγὼ εὐδόκησα
  choice: 我喜悦他
  rationale: 以自然简洁的汉语表达 εὐδοκέω 的喜悦、认可之意；不强行把 εἰς 逐字译成汉语介词，也不因过去时形式而限定为已经终止的喜悦。
theological_decisions:
- issue: τῆς μεγαλοπρεποῦς δόξης 是否直接解释为上帝
  choice: 那威严的荣光
  alternative: 威严荣耀的上帝
  rationale: 原文采用敬畏性的迂回称谓，正文保留“荣光”意象，不把其所指明说为“上帝”，以免消除原文表达的含蓄性。
- issue: 父对子的宣告中 ὁ ἀγαπητός 的结构
  choice: 这是我的儿子，我所爱的
  alternative: 这是我的爱子
  rationale: 所选译法保留原文同位结构和重复的第一人称领属，突出“儿子”与“所爱的”两个彼此关联而又分明的表述，不加入后来的教义术语。
- issue: εὐδόκησα 的时态与 εἰς ὃν 的表达
  choice: 我喜悦他
  alternative: 我曾喜悦他；我对他十分满意
  rationale: 过去时形式在这一宣告中不必表示喜悦已经结束；使用无显式时态的汉语，可保留其语境张力。“喜悦”也比单纯的“满意”更能涵盖 εὐδοκέω 的情感与认可。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“尊荣和荣耀”“威严的荣光”维持经文的崇高语域，但避免生僻古奥；引语保留原文同位结构。句末破折号提示论述在下一节继续。
