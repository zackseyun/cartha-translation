id: 2PE.1.6
reference: 2 Peter 1:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐν δὲ τῇ γνώσει τὴν ἐγκράτειαν, ἐν δὲ τῇ ἐγκρατείᾳ τὴν ὑπομονήν, ἐν δὲ τῇ ὑπομονῇ τὴν εὐσέβειαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/006.yaml
  text: and in knowledge[a], self-control; and in self-control, steadfastness; and in steadfastness, godliness[b],
translation:
  language: zh_hans
  text: 在知识上加上节制，在节制上加上坚忍[a]，在坚忍上加上敬虔。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “坚忍”也可译作“忍耐”、“恒忍”或“坚毅”。
    reason: lexical_alternative
  - marker: b
    text: 希腊原文采用省略句式，承接上一节“加上”的意思，逐项列出彼此相连的德行。
    reason: syntax
lexical_decisions:
- source_word: γνώσει
  choice: 知识
  rationale: γνῶσις在此德目清单中指认识、知识；“知识”直接、自然，并与上节的用词衔接。
- source_word: ἐγκράτειαν / ἐγκρατείᾳ
  choice: 节制
  rationale: ἐγκράτεια指约束欲望和冲动、能够自我控制；“节制”是现代中文圣经语境中简洁而清楚的表达。
- source_word: ὑπομονήν / ὑπομονῇ
  choice: 坚忍
  rationale: ὑπομονή强调在困难中坚定持守，不只是消极忍耐；“坚忍”兼顾持续承受与不动摇的含义。
- source_word: εὐσέβειαν
  choice: 敬虔
  rationale: εὐσέβεια指对神的敬畏与委身及其生活表现；“敬虔”准确、庄重，也符合现代中文基督教通用语汇。
- source_word: ἐν δὲ τῇ ... τὴν ...
  choice: 在……上加上……
  rationale: 原文是承接上节动词的省略结构；中文补出“加上”，使句意完整，同时保留逐项递进的链式结构。
- source_word: δέ
  choice: （以逗号连接递进分句）
  rationale: 这里的δέ用于连接连续项目，并无明显转折；中文不必逐次译出“而且”或“又”，用并列递进结构更自然。
theological_decisions:
- issue: 德目链中省略句法的处理
  choice: 补出由上节承接而来的“加上”，并保留“在……上……”的递进结构。
  alternative: 逐字保留为“在知识中，节制；在节制中，坚忍；在坚忍中，敬虔”。
  rationale: 希腊文省略了上节的主要动词，读者需从上下文补足。中文若完全照录省略式会生硬且含义不明；补出“加上”并未增加新的神学判断，只是明示原句语法上已经隐含的动作。
- issue: ὑπομονή的德性内涵
  choice: 坚忍
  alternative: 忍耐；恒忍；坚毅
  rationale: “坚忍”既表达在患难中承受，也表达坚定持续，避免把该词缩减为被动等待。
- issue: εὐσέβεια的指向
  choice: 敬虔
  alternative: 虔诚；敬神
  rationale: “敬虔”既可涵盖对神的敬畏委身，也可涵盖由此产生的生活实践，不将其局限于外在宗教礼仪。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“在……上加上……”既自然地承接上节，也保留原文德目链的紧凑递进。标点使用中文全角形式。
