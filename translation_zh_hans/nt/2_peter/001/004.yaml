id: 2PE.1.4
reference: 2 Peter 1:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: δι’ ὧν τὰ ⸂τίμια καὶ μέγιστα ἡμῖν⸃ ἐπαγγέλματα δεδώρηται, ἵνα διὰ τούτων γένησθε θείας κοινωνοὶ φύσεως, ἀποφυγόντες τῆς ἐν ⸀τῷ κόσμῳ ἐν ἐπιθυμίᾳ φθορᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/004.yaml
  text: through which he has granted to us his precious and very great promises[a], so that through these you may become sharers in the divine nature[b], having escaped the corruption that is in the world because of sinful desire.
translation:
  language: zh_hans
  text: 借着这些，他已把宝贵而极大的应许赐给我们，好叫你们借着这些应许，得以有分于上帝的本性[a]；你们既已逃脱世上因私欲而有的败坏[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“分享上帝的本性”或“成为上帝本性的参与者”。这里表达的是有分、参与，并不说明人因此在本质上成为上帝。
    reason: lexical_alternative
  - marker: b
    text: “因私欲”也可译作“在欲望中”或“由于欲望”。“欲望”一词本身有时可用于中性意义，但在这里与世上的败坏相连，带有负面含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ ὧν
  choice: 借着这些
  rationale: διά加属格表示媒介或途径；“这些”保留关系代词与上文的联系，不把其先行内容限定得过死。
- source_word: τίμια καὶ μέγιστα
  choice: 宝贵而又极大的
  rationale: τίμια表达珍贵、宝贵；μέγιστα虽为最高级形式，在此用“极大的”更符合现代汉语修饰“应许”的习惯，同时保留加强语气。
- source_word: ἡμῖν
  choice: 给了我们
  rationale: 与δεδώρηται连用的与格表示领受者；译为“给了我们”自然呈现赐予关系。
- source_word: ἐπαγγέλματα
  choice: 应许
  rationale: “应许”是圣经语境中清楚而稳定的表达，也准确传达所承诺之事。
- source_word: δεδώρηται
  choice: 赐给了
  rationale: 该完成时形式表达恩赐性的给予及其持续结果；“赐给了”比普通的“给了”更能体现 δωρέομαι 的恩惠意味。希腊文主语承接上文，汉语补出“他”。
- source_word: ἵνα
  choice: 使
  rationale: 自然表达目的或结果关系，又避免生硬直译。
- source_word: διὰ τούτων
  choice: 借着这些应许
  rationale: διά加属格表示媒介；τούτων最自然地回指刚提到的应许，汉语补出“应许”可避免指代含混。
- source_word: γένησθε
  choice: 可以有分于
  rationale: γίνομαι本有“成为”之意，但与κοινωνοί搭配时，汉语“可以有分于”自然表达进入参与者身份的动态含义。
- source_word: θείας κοινωνοὶ φύσεως
  choice: 有分于上帝的本性
  rationale: κοινωνός表示分享、参与；“有分于”既庄重又通俗。θεῖος在此译为“上帝的”，较“神性”更清楚地保持与上帝相关的本性，同时不加教义性解释。
- source_word: ἀποφυγόντες
  choice: 并且已经逃脱
  rationale: 过去时分词表示与主要动作相关、通常先行的逃离；“已经”体现完成意味，“并且”使现代汉语句法流畅而不把逻辑关系规定为严格时间顺序。
- source_word: φθορᾶς
  choice: 败坏
  rationale: 此处兼有道德腐化和毁坏的意味；“败坏”符合上下文，也比“腐烂”或“衰朽”更自然。
- source_word: ἐν τῷ κόσμῳ
  choice: 世上……而有的
  rationale: 保留该短语对“败坏”的修饰关系，说明这种败坏存在于世界之中。
- source_word: ἐν ἐπιθυμίᾳ
  choice: 因私欲
  rationale: ἐν可表达领域、关联或原因；在此与世上的败坏相连。“私欲”在现代圣经汉语中传达其负面道德语境，同时脚注保留结构上的其他可能理解。
theological_decisions:
- issue: θείας κοινωνοὶ φύσεως所表达的参与
  choice: 有分于上帝的本性
  alternative: 分享上帝的本性；成为上帝本性的参与者
  rationale: 保留原文强烈而开放的参与语言，不将其弱化为仅仅领受福分，也不扩展为人在本质上成为上帝，从而避免把后期特定教义体系直接写入正文。
- issue: ἐπιθυμία的道德色彩及ἐν的关系
  choice: 因私欲
  alternative: 在欲望中；由于欲望；因邪恶的欲望
  rationale: ἐπιθυμία本身可泛指欲望，但与世上的败坏相连时明显带负面色彩。“私欲”自然传达这种语境含义；不另加“罪恶的”，以免重复解释。介词关系仍有“在……中”或“借着……”等理解空间，故以脚注说明。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“应许”“有分于”“败坏”“私欲”保留圣经语体，但整体句法符合当代汉语。正文保留参与上帝本性的神学张力，并用脚注说明词义与句法上的真实替代方案。
