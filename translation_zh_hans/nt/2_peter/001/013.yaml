source:
  edition: SBLGNT
  text: δίκαιον δὲ ἡγοῦμαι, ἐφ’ ὅσον εἰμὶ ἐν τούτῳ τῷ σκηνώματι, διεγείρειν ὑμᾶς ἐν ὑπομνήσει,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/013.yaml
  text: But I consider it right[a], as long as I am in this tent, to stir you up by way of reminder,
translation:
  language: zh_hans
  text: 但我认为，只要我还在这帐篷[a]里，借着提醒激励你们是合宜的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “帐篷”也可译作“住处”或“居所”；这里比喻彼得现今必死的身体。
    reason: 说明σκηνώματι的词义选择及其身体隐喻，同时保留正文的帐篷意象。
lexical_decisions:
- source_word: δίκαιον
  choice: 应该的
  rationale: 此处与ἡγοῦμαι连用，表示说话者经过判断，认为某事合宜、正当；“应该的”自然清楚，也保留了责任与合宜之意。
- source_word: δὲ
  choice: 但
  rationale: δέ承接上文并带有轻微转折或推进；“但”能自然呈现这里的语篇关系。
- source_word: ἡγοῦμαι
  choice: 我认为
  rationale: 该词表示经过思量而作出的判断；“我认为”符合现代汉语表达，并保留其审慎语气。
- source_word: ἐφ’ ὅσον
  choice: 只要……还……
  rationale: 与εἰμί连用时表达时间范围，即“在……期间”或“只要……仍然”；此译法自然地体现持续到某一时限。
- source_word: σκηνώματι
  choice: 帐篷
  rationale: σκἠνωμα指帐篷或临时居所，此处比喻现今必死的身体生命；直译“帐篷”保留原文意象，并与下一节“脱去”这一帐篷的说法衔接。
- source_word: διεγείρειν
  choice: 唤醒
  rationale: 该不定式本义为唤醒、激起；这里指借提醒使读者在思想和行动上警醒。“唤醒”既保留原文形象，也适合上下文。
- source_word: ἐν ὑπομνήσει
  choice: 借着提醒
  rationale: 介词短语在此表达方式或手段，即通过使读者想起已知之事来唤醒他们；“借着提醒”简洁准确。
theological_decisions:
- issue: “这帐篷”所指的比喻意义
  choice: 正文保留“这帐篷”的身体比喻
  alternative: 直接译为“这个身体”或“这住处”
  rationale: 原文使用临时居所的形象指现今必死的身体生命。保留“帐篷”可呈现生命短暂的意味，并与下一节的相关意象相连，同时避免在正文中把比喻直接解释掉。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“借着提醒唤醒你们”保留原文的手段关系和唤醒意象；句末“就是应该的”使“我认为”的判断结构在汉语中清楚自然。
