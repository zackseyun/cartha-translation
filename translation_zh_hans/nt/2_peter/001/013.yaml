  naturalness: 原句“借着提醒唤醒你们就是应该的”语序和搭配略显生硬。“我认为……借着提醒激励你们是合宜的”更符合现代书面普通话，也清晰呈现“我认为……是合宜的”的句法关系。
  terminology: 保留“帐篷”是恰当的，既忠实于σκηνώματι，也不在正文中把身体隐喻解释掉。脚注应将“必死的身体生命”改为更自然且更贴近原文所指的“必死的身体”。“合宜的”比“应该的”更准确体现δίκαιον在此与ἡγοῦμαι连用所表达的恰当、适宜判断，而非单纯义务。
