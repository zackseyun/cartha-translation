- from: 但我认为，只要我还在这帐篷[a]里，借着提醒唤醒你们就是应该的。
  to: 但我认为，只要我还在这帐篷[a]里，借着提醒激励你们是合宜的。
  rationale: 修订仅调整汉语的自然度和词义侧重：以“合宜的”表达δίκαιον的适当性判断，以“激励”表达借提醒使人警醒、奋起的διεγείρειν，并使脚注对身体隐喻的说明更清楚、自然。正文仍保留“帐篷”这一原文比喻，未增添教义性解释。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T03:56:57Z'
