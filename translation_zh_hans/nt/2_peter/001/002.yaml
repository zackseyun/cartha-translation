  text: χάρις ὑμῖν καὶ εἰρήνη πληθυνθείη ἐν ἐπιγνώσει τοῦ θεοῦ καὶ Ἰησοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/002.yaml
  text: Grace to you and peace be multiplied in the knowledge of God and of Jesus our Lord[a][b].
translation:
  language: zh_hans
  text: 愿恩典与平安，在对上帝和我们的主耶稣的认识中，多多加给你们。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“借着对上帝和我们的主耶稣的认识。”希腊语介词既可表示范围（“在……中”），也可表示凭借或途径（“借着”）。
    reason: alternative_reading
  - marker: b
    text: “认识”也可译作“充分认识”或“完全认识”；希腊词 ἐπίγνωσις 有时含有更充分、更完全的认识之意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: 恩典
  rationale: 这是新约书信祝福语中的惯用表达，既保留问安格式，也传达上帝施恩的神学内涵。
- source_word: εἰρήνη
  choice: 平安
  rationale: “平安”是现代中文基督教语境中自然且内涵丰富的对应词，也保留了其可能具有的闪语背景。
- source_word: πληθυνθείη
  choice: 多多加给
  rationale: 该词为祝愿语气中的不定过去时被动祈愿式；“愿……多多加给”在中文中自然地表达祝愿，并保留增多及被赐予的含义。
- source_word: ἐν
  choice: 因
  rationale: 此处介词既可表示范围，也可表示凭借或途径。正文采用较自然的“因”，表达恩典与平安借着认识而增多；脚注保留“在……中”的范围性解释。
- source_word: ἐπιγνώσει
  choice: 认识
  rationale: 在中文里，“认识上帝和耶稣”比“知识”更自然地表达对位格的认知与关系性认识，同时不强行加入“充分”或“完全”的强化含义。
- source_word: θεοῦ
  choice: 上帝
  rationale: 直接对应 θεός，并采用现代标准普通话中庄重、通行的称呼。
- source_word: Ἰησοῦ
  choice: 耶稣
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: κυρίου
  choice: 主
  rationale: 保留 κύριος 在新约中的称号及其基督论分量，且符合现代中文基督教通行表达。
- source_word: τοῦ θεοῦ καὶ Ἰησοῦ τοῦ κυρίου ἡμῶν
  choice: 上帝和我们的主耶稣
  rationale: 将两个并列的属格对象都置于“认识”之后；“我们的主”自然地修饰“耶稣”，不增加原文没有的身份判断。
theological_decisions:
- issue: ἐν 与 ἐπιγνώσει 连用时的语义作用
  choice: 因认识上帝和我们的主耶稣
  alternative: 在对上帝和我们的主耶稣的认识中
  rationale: 希腊介词可表示范围，也可表示凭借或途径。正文以自然中文表达凭借义，脚注明确保留范围义，避免将原文的语义开放性完全抹去。
- issue: ἐπίγνωσις 是否含有强化语气
  choice: 认识
  alternative: 充分认识／完全认识
  rationale: 该词在彼得后书中可能带有更充分认识的意味，但本节不必把这一语气明确化；正文采用不带额外限定的“认识”，并在脚注提示可能的强化含义。
- issue: θεοῦ 与 Ἰησοῦ 的关系
  choice: 上帝和我们的主耶稣
  alternative: 我们的上帝和主耶稣
  rationale: 本句的结构最自然地把“上帝”与“我们的主耶稣”作为认识的两个并列对象；不将二者合并为一个复合称号，以免加入原文在此处未明确要求的解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“愿……多多加给你们”呈现书信祝福语；“认识”避免生硬的“知识”，同时脚注保留介词与词义上的真实歧义。
