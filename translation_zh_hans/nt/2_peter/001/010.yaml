  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: διὸ μᾶλλον, ἀδελφοί, σπουδάσατε βεβαίαν ὑμῶν τὴν κλῆσιν καὶ ἐκλογὴν ποιεῖσθαι· ταῦτα γὰρ ποιοῦντες οὐ μὴ πταίσητέ ποτε·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/010.yaml
  text: Therefore[a], brothers, be all the more diligent to make your calling and election sure, for if you do these things, you will certainly never stumble.
translation:
  language: zh_hans
  text: 所以，弟兄们[a]，你们更要殷勤，使你们所蒙的呼召和拣选坚定不移；因为你们若行这些事，就绝不会跌倒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“弟兄姊妹们”；希腊文直译为“弟兄们”，在这里可以包括整个信徒群体。
    reason: 说明原文的语法形式及其在书信称呼中的包容性用法。
lexical_decisions:
- source_word: διὸ
  choice: 所以
  rationale: 承接上文并引出推论，现代汉语中自然清楚。
- source_word: μᾶλλον
  choice: 更要
  rationale: 修饰命令“殷勤”，保留比较和加强语气。
- source_word: ἀδελφοί
  choice: 弟兄们[a]
  rationale: 保留希腊文阳性复数称呼的形式，并用脚注说明它在书信语境中可以包括整个信徒群体。
- source_word: σπουδάσατε
  choice: 要殷勤
  rationale: 表达认真、热切地付诸努力，符合劝勉语气，也不过度扩写。
- source_word: βεβαίαν ... ποιεῖσθαι
  choice: 使……坚定确实
  rationale: 表达使某事得到坚立、确认而成为可靠；避免译成“获得”或“促成”，以免断定呼召和拣选源自人的努力。
- source_word: κλῆσιν
  choice: 所蒙的呼召
  rationale: “呼召”保留新约中的神学与词汇连续性；“所蒙的”使汉语自然，并体现呼召是临到人的。
- source_word: ἐκλογὴν
  choice: 拣选
  rationale: 准确表达选择、选取的意思，又不把某一宗派的完整教义体系带入经文。
- source_word: ταῦτα ... ποιοῦντες
  choice: 若行这些事
  rationale: “这些事”回指上文所列的品格与实践；“若”自然呈现分词在本句中的条件意味。
- source_word: οὐ μὴ
  choice: 绝不会
  rationale: 保留双重否定所表达的强烈否定语气，同时符合现代汉语。
- source_word: πταίσητέ
  choice: 跌倒
  rationale: 保留原文的失足隐喻，不将其收窄为“犯罪”，也不擅自限定为最终背道。
theological_decisions:
- issue: “使自己所蒙的呼召和拣选坚定确实”的含义
  choice: 译文保留对信徒的真实劝勉：借着持续实行上文所说的事，使呼召和拣选得到坚立、确认。
  alternative: 把它明确解释为人靠行为取得神的拣选，或仅仅向别人证明自己已蒙拣选。
  rationale: 原文要求读者使呼召和拣选成为“坚定的”，但没有说明这是促成神的决定，还是单指外在证明。译文保留这种张力，不引入特定宗派的体系。
- issue: “绝不会跌倒”的范围
  choice: 保留跌倒的比喻和强烈应许，不进一步界定其专指任何一次犯罪或最终失落。
  alternative: 译成绝不犯罪，或明确译成绝不最终背道。
  rationale: πταίω可指失足、跌倒或失败；上下文不足以支持把此处绝对化为无罪完全，也不足以在译文中将其收窄为某一种系统化的坚忍教义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“殷勤”“呼召”“拣选”保留必要的圣经语体和神学连续性；句式简洁，避免古奥表达。
