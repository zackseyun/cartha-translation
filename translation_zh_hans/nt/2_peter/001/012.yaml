source:
  edition: SBLGNT
  text: Διὸ ⸀μελλήσω ἀεὶ ὑμᾶς ὑπομιμνῄσκειν περὶ τούτων, καίπερ εἰδότας καὶ ἐστηριγμένους ἐν τῇ παρούσῃ ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/012.yaml
  text: Therefore I will always be ready to remind you about these things[a], even though you know them and have been established in the present truth.
translation:
  language: zh_hans
  text: 所以，我要常常提醒你们这些事[a]，尽管你们已经知道这些事，并且已经在现今的真理上坚固。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在现今的真理上”或译“在你们现在所持守的真理上”。
    reason: παρούσῃ可指当前存在、临到或为读者所拥有；脚注保留该短语的词义可能性。
lexical_decisions:
- source_word: Διὸ
  choice: 所以
  rationale: 承接上文并引出结论；“所以”自然清楚地保留推论关系。
- source_word: μελλήσω
  choice: 我要
  rationale: 此处将来时配合不定式，表达作者持续提醒读者的意愿与决心；现代汉语用“我要”简洁自然，避免误译为迫在眉睫的“即将”。
- source_word: ἀεὶ
  choice: 常常
  rationale: 结合“提醒”这一可重复的行动，表达持续、屡次之意；比“总是”更符合现代汉语搭配。
- source_word: ὑπομιμνῄσκειν
  choice: 提醒
  rationale: 准确表达使人记起已经知道之事；持续性已由“常常”体现。
- source_word: περὶ τούτων
  choice: 这些事
  rationale: 自然表达“关于这些事”；汉语“提醒你们这些事”无需另加“关于”。
- source_word: καίπερ
  choice: 尽管
  rationale: 明确保留让步关系，符合庄重而自然的现代书面语。
- source_word: εἰδότας
  choice: 你们已经知道
  rationale: οἶδα的完成形态表达已有的认知状态；“已经”使这一状态在汉语中清楚自然，宾语由上文“这些事”领会。
- source_word: ἐστηριγμένους
  choice: 得以坚固
  rationale: 保留完成时被动分词所表达的被坚固并处于稳固状态之意，同时不擅自指明施事者。
- source_word: ἐν τῇ παρούσῃ ἀληθείᾳ
  choice: 在现今的真理上
  rationale: “现今的”较贴近παρούσῃ的“当前、在场”含义；“在……上得以坚固”是自然汉语，并保留原文略显特殊的表达。
theological_decisions:
- issue: “现今的真理”的含义
  choice: 现今的真理
  alternative: 你们现在所持守的真理／如今在你们中间的真理
  rationale: 原文没有说明这是某一时代特有的技术性教义，更可能指读者当前已经领受并持有的真理。正文保留原文表达的开放性，不引入特定神学体系；脚注提示另一种自然理解。
translation_notes:
  register: 采用现代、庄重且易懂的简体中文。“常常提醒”体现持续行动；“得以坚固”保留被动和持续结果；对“现今的真理”不作体系化扩释。
