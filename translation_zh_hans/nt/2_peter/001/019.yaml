source:
  edition: SBLGNT
  text: καὶ ἔχομεν βεβαιότερον τὸν προφητικὸν λόγον, ᾧ καλῶς ποιεῖτε προσέχοντες ὡς λύχνῳ φαίνοντι ἐν αὐχμηρῷ τόπῳ, ἕως οὗ ἡμέρα διαυγάσῃ καὶ φωσφόρος ἀνατείλῃ ἐν ταῖς καρδίαις ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/019.yaml
  text: And we have the prophetic word more certain[a], to which you do well to pay attention as to a lamp shining in a dark place[b], until the day dawns and the morning star rises in your hearts.
translation:
  language: zh_hans
  text: 我们也有了更加确实的先知之言[a]；你们留心这话是好的，就如留心一盏照在幽暗之处的灯，直到天发亮，晨星在你们心里升起[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “更加确实”也可理解为：先知之言因前述使徒亲眼所见而得到进一步印证；或强调先知之言本来就更为可靠。希腊原文可作不同理解。
    reason: alternative_reading
  - marker: b
    text: “晨星”可能带有弥赛亚意象；参《启示录》22:16。
    reason: cross_reference
lexical_decisions:
- source_word: βεβαιότερον
  choice: 更加确实
  rationale: 保留比较级的力度，同时不在正文中强行判定是使徒见证使预言变得更确实，还是预言本身更为确实；“有了”自然承接ἔχομεν。
- source_word: τὸν προφητικὸν λόγον
  choice: 先知之言
  rationale: 保留λόγος与“话语”的含义以及形容词结构；比“预言”更能反映原文，同时保持庄重简洁。
- source_word: ᾧ καλῶς ποιεῖτε προσέχοντες
  choice: 你们留心这话是好的
  rationale: 自然表达καλῶς ποιεῖτε的肯定语气，并以“留心”传达持续专注、谨慎注意之意。
- source_word: ὡς λύχνῳ φαίνοντι
  choice: 如同留心照……的灯
  rationale: 在汉语中补出第二个“留心”，清楚表明比喻关系；“照”简洁传达分词φαίνοντι的持续发光意象。
- source_word: ἐν αὐχμηρῷ τόπῳ
  choice: 在幽暗之处
  rationale: “幽暗”兼具昏暗、阴沉的意象，适合灯光比喻，又保持庄重文体。
- source_word: ἡμέρα διαυγάσῃ
  choice: 天发亮
  rationale: 自然表达天光破晓、逐渐明亮的过程，避免把“日子”误解为单纯时间单位。
- source_word: φωσφόρος
  choice: 晨星
  rationale: 在此天象语境中指清晨出现的明亮星体；保留其可能具有的弥赛亚意蕴而不在正文中明说。
- source_word: ἀνατείλῃ ἐν ταῖς καρδίαις ὑμῶν
  choice: 在你们心里升起
  rationale: 直译星体升起的图像，同时保留“心里”所指内在生命的开放含义。
theological_decisions:
- issue: βεβαιότερον与使徒亲眼见证及先知之言的关系
  choice: 译作“有了更加确实的先知之言”
  alternative: “先知之言也因此更加确实”或“我们有更为可靠的先知之言”
  rationale: 原文比较级可理解为先知之言得到前述见证的印证，也可着重其本身的可靠性。正文保留比较关系而不加入明确因果，脚注说明两种可能。
- issue: “晨星”的所指
  choice: 正文仅保留“晨星”的意象
  alternative: 明确译作基督，或解释为末世性的内在光照
  rationale: 经文并未直接辨明所指。保留意象可让弥赛亚及末世性回声存在，而不把解释写入正文。
- issue: “在你们心里”与“直到”的关系
  choice: 按原文语序，译作“直到天发亮，晨星在你们心里升起”
  alternative: 将“在你们心里”同时连接于天发亮和晨星升起，或把整句解释为纯粹主观启明
  rationale: 原文最直接地把介词短语置于“晨星升起”之后；译文保持这一结构，同时不排除整幅破晓图像具有内在、末世性的多重意味。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“先知之言”“幽暗之处”略带经文语体，但仍属当代可理解表达。正文中的脚注标记[a]、[b]均与脚注对应；将[b]置于“晨星”相关分句之后，以准确对应其内容。
