id: 2PE.1.8
reference: 2 Peter 1:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ταῦτα γὰρ ὑμῖν ὑπάρχοντα καὶ πλεονάζοντα οὐκ ἀργοὺς οὐδὲ ἀκάρπους καθίστησιν εἰς τὴν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ ἐπίγνωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/008.yaml
  text: For if these things are yours and are increasing[c][b][a], they keep you from being ineffective or unfruitful in the knowledge of our Lord Jesus the Messiah.
translation:
  language: zh_hans
  text: 因为这些事若在你们身上存在，并且不断增长[a]，就会使你们在对我们的主耶稣——弥赛亚[c]的认识[b]上，既不闲懒，也不结果子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“并且越发充足”。
    reason: lexical_alternative
  - marker: b
    text: “认识”也可译作“充分认识”或“确切认识”。
    reason: lexical_alternative
  - marker: c
    text: 希腊文作“耶稣基督”；“基督”是“弥赛亚”的希腊语对应称号。
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα
  choice: 这些
  rationale: 回指第5—7节所列各项品格；保留原文概括性的指代，不在正文中解释为“这些品格”。
- source_word: ὑμῖν ὑπάρχοντα
  choice: 你们若具备
  rationale: ὑπάρχω与与格ὑμῖν合用，表示这些事存在于读者身上或为其所有。“具备”以自然汉语兼顾“在你们里面”和“为你们所有”的含义。
- source_word: πλεονάζοντα
  choice: 不断增长
  rationale: 该分词可表示增多或充盈；“不断增长”贴合上下文中品格长进的动态含义，同时以脚注保留“越发充足”的可能。
- source_word: ἀργούς
  choice: 无所作为
  rationale: 该词可指闲散、无用或没有成效；此处与“不结果子”并列，译作“无所作为”既保留不活动的意象，也表达缺乏实际成效。
- source_word: ἀκάρπους
  choice: 不结果子
  rationale: 直译其结果实的比喻，保持与新约常见属灵果效意象的联系。
- source_word: καθίστησιν
  choice: 使……不至于
  rationale: 以结果性表达处理原文“使你们成为既不……也不……”的否定结构，符合现代汉语习惯。
- source_word: εἰς τὴν ... ἐπίγνωσιν
  choice: 在认识……这件事上
  rationale: εἰς在这里可表达关联、范围或趋向；此译自然地表示这些品格在认识主这方面所产生的果效，而不把语义限定为单纯地点或目的。
- source_word: ἐπίγνωσιν
  choice: 认识
  rationale: ἐπίγνωσις可带有充分、确切认识的意味，但正文采用自然而不过度强化的“认识”，较强语气列于脚注。
- source_word: κυρίου
  choice: 主
  rationale: 保留κύριος作为对耶稣的尊称和基督论称号。
- source_word: Ἰησοῦ Χριστοῦ
  choice: 耶稣弥赛亚
  rationale: 将Χριστός按其称号意义译为“弥赛亚”，而不把它仅作为固定名字音译；脚注列出汉语教会传统译法“耶稣基督”。
theological_decisions:
- issue: Χριστοῦ在Ἰησοῦ Χριστοῦ中的译法
  choice: 耶稣弥赛亚
  alternative: 耶稣基督
  rationale: Χριστός源自“受膏者”这一称号；“弥赛亚”保存其称号含义。传统译名“基督”不改变所指，故列为脚注异译。
- issue: ἐπίγνωσις是否明确译作“充分认识”
  choice: 认识
  alternative: 充分认识
  rationale: 该词有时暗含较完整或确切的认识，但本节本身并未要求将程度含义明说；正文保留简洁表达，脚注呈现可能的强化语气。
- issue: 品格与认识主之间的作用关系
  choice: 使……不至于无所作为，也不至于不结果子
  alternative: 使……既不闲懒，也不徒然无果
  rationale: 原文表达这些事存在并增多所带来的实际结果，但没有界定果效的具体形式；译文保持这种开放性，不将其收窄为某一种事工或功德。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“具备这些”清楚回接上文；“无所作为”和“不结果子”构成意义与修辞上的并列。正文中的[a]、[b]、[c]均紧随所注词语。
