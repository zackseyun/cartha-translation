id: 2PE.1.16
reference: 2 Peter 1:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Οὐ γὰρ σεσοφισμένοις μύθοις ἐξακολουθήσαντες ἐγνωρίσαμεν ὑμῖν τὴν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ δύναμιν καὶ παρουσίαν, ἀλλ’ ἐπόπται γενηθέντες τῆς ἐκείνου μεγαλειότητος.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/016.yaml
  text: For we did not make known to you the power and coming of our Lord Jesus the Messiah by following cleverly devised myths[b][a], but by becoming eyewitnesses of his majesty.
translation:
  language: zh_hans
  text: 因为我们向你们传讲我们主耶稣基督[b]的大能和降临[a]，并不是随从巧妙编造的神话；相反，我们亲眼见过他的威荣。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “降临”所译的希腊词也可表示“临在”或“到来”；在新约中，这个词常指弥赛亚的降临。
    reason: alternative_reading
  - marker: b
    text: “基督”意为“弥赛亚”，即“受膏者”；这里是称号。
    reason: lexical_alternative
lexical_decisions:
- source_word: σεσοφισμένοις μύθοις
  choice: 巧妙编造的神话
  rationale: 既保留σοφίζω所表达的刻意加工、巧妙炮制之意，也保留μῦθος在此处带有贬义的“神话”，且符合现代汉语表达。
- source_word: ἐξακολουθήσαντες
  choice: 依据
  rationale: 该分词与后面的“亲眼见过”形成认识根据上的对比；译作“依据”自然呈现“不是凭虚构故事，而是凭亲眼所见”的论证关系。
- source_word: ἐγνωρίσαμεν ὑμῖν
  choice: 我们向你们传明
  rationale: γνωρίζω意为使人知道、传达。“传明”兼顾公开宣告和使人知晓的含义，比单纯“告诉”略显庄重。
- source_word: δύναμιν
  choice: 大能
  rationale: 直接表达能力、权能；在指主耶稣时，“大能”既自然又符合庄重语域。
- source_word: παρουσίαν
  choice: 降临
  rationale: παρουσία可指临在、到达，也常指基督将来的来临。正文采用新约语境中自然的“降临”，并以脚注保留词义范围。
- source_word: κυρίου
  choice: 主
  rationale: 符合κύριος用于耶稣之尊称的通常含义和现代汉语基督教通用表达。
- source_word: Χριστοῦ
  choice: 基督
  rationale: “基督”是现代汉语对Χριστός最通行且庄重的译法；脚注说明其称号含义为“弥赛亚”，避免把它仅当作姓名。
- source_word: ἐπόπται γενηθέντες
  choice: 我们亲眼见过
  rationale: ἐπόπτης强调亲自目睹者。汉语用“亲眼见过”自然表达其见证和证据效力，无须生硬直译“成为目击者”。
- source_word: μεγαλειότητος
  choice: 威荣
  rationale: μεγαλειότης表示宏伟、尊威或威严。“威荣”简洁庄重，并适合此处耶稣显现尊威的语境。
- source_word: ἐκείνου
  choice: 他的
  rationale: 该指示代词回指主耶稣基督；汉语用“他的”清楚自然。
theological_decisions:
- issue: παρουσία在基督论语境中的含义
  choice: 降临
  alternative: 临在；到来
  rationale: 该词本义范围包括临在和到达，在新约谈到耶稣时又常有末世降临之意。正文采用最可能且自然的“降临”，脚注保留其真实的词义歧义。
- issue: Χριστός作为称号还是姓名式用语
  choice: 基督，并用脚注说明意为“弥赛亚”
  alternative: 弥赛亚
  rationale: Χριστός源自“受膏者”，在此属于耶稣的称号。中文正文采用通行的“基督”，脚注明示其称号意义，兼顾可读性与语义透明度。
- issue: 亲眼见证的具体所指
  choice: 不在正文补入“登山变像”
  alternative: 明确解释为登山变像事件
  rationale: 上下文很可能指向登山变像，但本节原文本身只说亲眼见过他的威荣；正文不把可能的背景解释写成明说的内容。
translation_notes:
  register: 采用现代、庄重而清楚的书面汉语。“巧妙编造的神话”与“亲眼见过”形成鲜明对比；分号帮助读者把握希腊文οὐ…ἀλλά（不是……而是……）的结构。正文不擅自确定παρουσία仅指末世事件，也不明说威荣见证必然是登山变像。
