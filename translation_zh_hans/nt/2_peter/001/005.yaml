id: 2PE.1.5
reference: 2 Peter 1:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ αὐτὸ τοῦτο δὲ σπουδὴν πᾶσαν παρεισενέγκαντες ἐπιχορηγήσατε ἐν τῇ πίστει ὑμῶν τὴν ἀρετήν, ἐν δὲ τῇ ἀρετῇ τὴν γνῶσιν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/005.yaml
  text: And for this very reason[a], making every effort, supply in your faith virtue, and in virtue knowledge[d][c][b],
translation:
  language: zh_hans
  text: 正因如此[a]，你们要竭尽全力，给你们的信心[b]增添[d]美德[c]，给美德增添知识；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “正因如此”也可译作“也正为这件事”。原文用强调性的表达承接上文。
    reason: translation_alternative
  - marker: b
    text: “信心”也可译作“信实”或“信靠”。
    reason: lexical_alternative
  - marker: c
    text: “美德”也可译作“道德上的卓越”或“卓越品格”。
    reason: lexical_alternative
  - marker: d
    text: “增添”也可译作“供应”或“配备”；原词可含丰厚供给之意。原句的结构也可较直译为：“在你们的信心中供应美德，在美德中供应知识。”
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: καὶ αὐτὸ τοῦτο δὲ
  choice: 正因如此
  rationale: 这一组合承接上文并加强语气。“正因如此”在现代汉语中自然地表达“正为这缘故”的强调性过渡。
- source_word: σπουδὴν πᾶσαν παρεισενέγκαντες
  choice: 你们要竭尽全力
  rationale: 分词短语表达伴随主要命令的全心投入；合译为“竭尽全力”既自然，又保留殷勤、热切付出的力度。
- source_word: ἐπιχορηγήσατε
  choice: 增添
  rationale: 原词有供给、配备，且可含丰厚供应之意。“增添”最适合汉语中的德目递进表达；较具体的“供应、配备”语义在脚注中保留。
- source_word: ἐν τῇ πίστει ὑμῶν
  choice: 给你们的信心
  rationale: 希腊文连续使用ἐν加与格，表示各项品质之间密切相连的递进关系。汉语用“给……增添……”可避免生硬，同时不把这种关系限定为单一的逻辑类别。
- source_word: πίστει
  choice: 信心
  rationale: πίστις在这里最直接地指信；“信心”是现代汉语中清楚自然的表达。“信实”和“信靠”作为语义范围内的可能译法列入脚注。
- source_word: ἀρετήν
  choice: 美德
  rationale: ἀρετή在此指品格上的卓越或德行。“美德”简洁、庄重，也适合德目列表；“道德上的卓越”作为解释性替代译法保留。
- source_word: γνῶσιν
  choice: 知识
  rationale: γνῶσις的核心义是知识；此译法保留原文的宽泛性，不预先收窄为洞察力或辨别力。
theological_decisions:
- issue: 德目列表中πίστις的译法
  choice: 信心
  alternative: 信实；信靠
  rationale: 本处并无足够语境把πίστις单限定为人的忠信或信靠行为；正文采用其常见的“信心”，脚注保留相邻语义。
- issue: ἐν所连接的各项品质之间的关系
  choice: 给……增添……
  alternative: 在信心中供应美德，在美德中供应知识
  rationale: ἐν可表达关联、范围或基础，原文并未明确界定这些品质的逻辑关系。正文采用自然的汉语递进句式，脚注保留更贴近形式、但较生硬的译法，避免把它解释成严格的功德阶梯。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“竭尽全力”和“给……增添……”使句子自然流畅；分号表示本节句法仍向下一节延续。所有实质性的词义和句法歧义均以脚注保留。
