  text: τοῦτο πρῶτον γινώσκοντες ὅτι πᾶσα προφητεία γραφῆς ἰδίας ἐπιλύσεως οὐ γίνεται,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/020.yaml
  text: 'knowing this first: that every prophecy of Scripture does not come about from one''s own interpretation.'
translation:
  language: zh_hans
  text: 首先要知道：经上的一切预言，都不是出于人自己的解释。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο πρῶτον γινώσκοντες
  choice: 首先要知道
  rationale: 自然表达分词短语的劝诫性语气，同时保留“首要、首先”的强调。
- source_word: πᾶσα προφητεία γραφῆς
  choice: 经上的一切预言
  rationale: 将γραφῆς理解为限定“预言”的“圣经/经书”，以现代中文惯用的“经上的”表达；πᾶσα按“一切”保留其表面形式。
- source_word: ἰδίας ἐπιλύσεως
  choice: 人自己的解释
  rationale: ἰδίας在此未明说所属者；补出“人”使中文通顺，但不进一步限定为先知、作者或读者。ἐπίλυσις译作“解释”，保留原文可能涉及阐释或解说的语义。
- source_word: οὐ γίνεται
  choice: 都不是出于
  rationale: γίνεται可指发生、产生或来源；中文“出于”自然呈现预言并非由私人解释而来的含义，并避免生硬直译“成为”。
theological_decisions:
- issue: “自己的解释”所指是谁的解释
  choice: 人自己的解释
  alternative: 先知自己的解释／读者私自解释
  rationale: 原文只有ἰδίας，没有明确指出是先知、作者还是读者；正文不把这种歧义收窄为某一特定群体。
- issue: πᾶσα与否定词οὐ的组合范围
  choice: 经上的一切预言，都不是……
  alternative: 经上没有一项预言是……
  rationale: 二者在实际意义上接近；采用“一切……都不是”较贴近原文πᾶσα的表面形式，并与上下文的普遍断言相称。
- issue: γίνεται表达来源还是解释行为
  choice: 不是出于
  alternative: 不是由……解释出来的／不是自行产生的
  rationale: “出于”保留来源与产生过程之间的张力，也与下一节关于预言如何被带来的说明衔接。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“经上”是普通读者熟悉的圣经用语；句式简洁，不引入宗派性释义。
