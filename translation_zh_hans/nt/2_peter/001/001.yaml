id: 2PE.1.1
reference: 2 Peter 1:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ⸀Συμεὼν Πέτρος δοῦλος καὶ ἀπόστολος Ἰησοῦ Χριστοῦ τοῖς ἰσότιμον ἡμῖν λαχοῦσιν πίστιν ἐν δικαιοσύνῃ τοῦ θεοῦ ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/001.yaml
  text: 'Simeon Peter[a], a slave and apostle of Jesus the Messiah[d][c][b], to those who have obtained a faith as precious as ours in the righteousness of our God and Savior Jesus the Messiah:'
translation:
  language: zh_hans
  text: 西面彼得[a]，耶稣弥赛亚的奴仆和使徒，写信给那些在我们的上帝和救主耶稣弥赛亚[d]的义中[c]，得着与我们同等宝贵的信心[b]的人：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“西门彼得”。本版希腊文作“西面彼得”。
    reason: textual_variant
  - marker: b
    text: 也可译作“与我们有同等地位的信心”。原词可侧重同等的价值、尊荣、地位或特权。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“借着我们的上帝和救主耶稣弥赛亚的义”或“凭着……的义”。这里的介词既可表示所处的范围，也可表示凭借的方式。
    reason: lexical_alternative
  - marker: d
    text: 希腊文最自然的意思是“我们的上帝和救主——耶稣弥赛亚”，把耶稣称为上帝和救主。另一种较不可能的理解是，“我们的上帝”与“救主耶稣弥赛亚”分别指两位。
    reason: alternative_reading
lexical_decisions:
- source_word: Συμεὼν Πέτρος
  choice: 西面彼得
  rationale: “西面”直接对应本版希腊文的Συμεών，而非更常见的Σίμων（“西门”）；“彼得”采用现代汉语通行译名。
- source_word: δοῦλος
  choice: 奴仆
  rationale: 该词表示隶属于主人的人；“奴仆”既保留完全归属的含义，也符合使徒书信自称时庄重而自然的汉语表达，比单纯的“仆人”更能体现原词力度。
- source_word: ἀπόστολος
  choice: 使徒
  rationale: “使徒”是现代汉语中对这一受差遣职分的通行而准确的译法。
- source_word: Ἰησοῦ Χριστοῦ
  choice: 耶稣弥赛亚
  rationale: Χριστός在此保留“受膏者、弥赛亚”这一称号的意义；汉语人名与称号连用时不需另加定冠词。
- source_word: τοῖς ... λαχοῦσιν
  choice: 给那些……得着……的人
  rationale: λαγχάνω含有获分、领受之意；“得着”表明信心是领受所得，而不暗示凭努力赢取，同时不把未明说的施予者加入正文。
- source_word: ἰσότιμον ... πίστιν
  choice: 与我们同等宝贵的信心
  rationale: ἰσότιμος可表示价值、尊荣或地位相等；此译自然表达收信人的信心与使徒们的信心同样宝贵，并以脚注保留“同等地位”的可能侧重。
- source_word: πίστιν
  choice: 信心
  rationale: 上下文指信徒与使徒共同领受的信，译作“信心”最符合现代汉语习惯；原文在此不要求理解为“信实”。
- source_word: ἐν δικαιοσύνῃ
  choice: 在……的义中
  rationale: 形式上保留ἐν可能表达范围或凭借方式的开放性，避免在正文中直接限定为“借着”或“凭着”。
- source_word: δικαιοσύνῃ
  choice: 义
  rationale: “义”是δικαιοσύνη在这一神学语境中的准确通行译法，同时可涵盖公义、正直与合宜作为。
- source_word: τοῦ θεοῦ ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ
  choice: 我们的上帝和救主耶稣弥赛亚
  rationale: 一个冠词统领两个由καί连接的单数位格名词，最自然地指向同一位，即耶稣既是“我们的上帝”，也是“救主”；中文保持这一连贯结构，并以脚注说明较不可能的双指称理解。
theological_decisions:
- issue: “我们的上帝和救主耶稣弥赛亚”是指一位还是两位
  choice: 按同一位理解：耶稣弥赛亚同时被称为“我们的上帝”和“救主”。
  alternative: 按两位理解：“我们的上帝”指父，“救主耶稣弥赛亚”指耶稣。
  rationale: 希腊文以一个冠词统领两个由καί连接的单数位格名词θεός和σωτήρ，随后接Ἰησοῦ Χριστοῦ，语法上强烈支持同一指称。鉴于另一解释在释经史中存在且涉及重要基督论问题，脚注予以保留，而不在正文中隐藏争议。
translation_notes:
  register: 采用现代、庄重而易懂的书信体。以“写信给”补足汉语收信人结构，但不增添原文没有的神学主语；“奴仆”保留δοῦλος的归属和受约束意味，同时避免口语化或贬损性的表达。正文有意保留ἐν的范围／方式歧义，并将关键语法与文本异文置于脚注。
