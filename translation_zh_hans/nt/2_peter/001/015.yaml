  text: σπουδάσω δὲ καὶ ἑκάστοτε ἔχειν ὑμᾶς μετὰ τὴν ἐμὴν ἔξοδον τὴν τούτων μνήμην ποιεῖσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/015.yaml
  text: And I will make every effort so that[a], after my departure, you may be able at any time to recall these things.
translation:
  language: zh_hans
  text: 我还要竭尽全力，使你们在我离去[a]以后，随时都能想起这些事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“离去”；这里委婉指死亡。
    reason: lexical_alternative
lexical_decisions:
- source_word: σπουδάσω
  choice: 我要竭尽全力
  rationale: 将来时表达彼得将要付出殷勤而认真的努力；“竭尽全力”自然地保留了原词的力度。
- source_word: δὲ καὶ
  choice: 还要
  rationale: δὲ在这里承接上文，并非强烈转折；καὶ带出进一步的行动。“还要”符合现代汉语的连贯表达。
- source_word: ἑκάστοτε
  choice: 随时
  rationale: 表示每逢需要、在任何时候；“随时”简洁地传达持续可行的意思。
- source_word: ἔχειν ὑμᾶς
  choice: 使你们……都能
  rationale: 这里的ἔχειν结合不定式可表达能力或机会；译作“都能”比直译“拥有”自然，也保留目的结构。
- source_word: μετὰ τὴν ἐμὴν ἔξοδον
  choice: 在我离世以后
  rationale: ἔξοδος本义为离开、出发，此处委婉指彼得将死。“离世”在现代汉语中既清楚指向死亡，又在一定程度上保留“离去”的比喻。
- source_word: τὴν τούτων μνήμην ποιεῖσθαι
  choice: 想起这些事
  rationale: 这是表示记起、唤起记忆的惯用语；“想起”保留主动忆起的意味，且自然易懂。
- source_word: τούτων
  choice: 这些事
  rationale: 直接回指上文彼得所强调的内容，不额外限定其范围。
theological_decisions:
- issue: ἔξοδος对彼得将临之终局的指称
  choice: 离世
  alternative: 离开；死亡
  rationale: 原文以“离去”一词委婉指死亡。“离世”既让普通读者明白其实际所指，也保留原文的离去意象；脚注说明其字面表达，避免把比喻完全抹平。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“竭尽全力”体现σπουδάσω的力度；“离世”兼顾原文比喻和语境中的明确含义；句序按汉语习惯调整，同时保留目的、时间和随时忆起的关系。
