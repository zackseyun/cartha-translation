id: 2PE.1.9
reference: 2 Peter 1:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ᾧ γὰρ μὴ πάρεστιν ταῦτα, τυφλός ἐστιν μυωπάζων, λήθην λαβὼν τοῦ καθαρισμοῦ τῶν πάλαι αὐτοῦ ⸀ἁμαρτημάτων.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/009.yaml
  text: For whoever lacks these things is blind[a], being shortsighted[b], having forgotten the cleansing of his former sins.
translation:
  language: zh_hans
  text: 因为凡缺少这些[a]的人，是瞎眼的，只看见近处[b]；他忘了自己从前的罪已经得到洁净。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这些”也可译作“这些品德”，指上节所列的品德。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“近视的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾧ γὰρ μὴ πάρεστιν ταῦτα
  choice: 因为没有这些的
  rationale: 以自然的汉语表达“这些不在某人身上”，其中“这些”回指上文所列的品德，不在正文中将其明说，以保留原文的指代方式。
- source_word: τυφλός
  choice: 瞎眼的
  rationale: 直接保留原文的视觉隐喻，并与后面的“近视的”形成紧密并列。
- source_word: μυωπάζων
  choice: 近视的
  rationale: 该词可指近视或只能看见近处；“近视的”简洁地保留视觉意象及其可能的比喻意义。
- source_word: λήθην λαβὼν
  choice: 忘了
  rationale: 这是“陷入忘却、已经忘记”的惯用表达；译为“忘了”符合现代汉语。
- source_word: τοῦ καθαρισμοῦ
  choice: 已经得了洁净
  rationale: 将名词结构自然转为汉语动词结构，表达罪污得到清除，同时不额外指明施行洁净者或具体方式。
- source_word: τῶν πάλαι αὐτοῦ ἁμαρτημάτων
  choice: 自己从前的罪
  rationale: “自己”自然回指泛称的单数主体；“从前的罪”保留 πάλαι 的时间含义。
theological_decisions:
- issue: τυφλός 与 μυωπάζων 之间表面上的张力
  choice: 就是瞎眼的、近视的
  alternative: 就是瞎眼的，只看得见近处
  rationale: 原文把“瞎眼”与“近视”并置，可能是递进、解释或修辞性的张力。正文不替作者消解这一张力。
- issue: 洁净的事实性表达
  choice: 忘了自己从前的罪已经得了洁净
  alternative: 忘了自己从前的罪得洁净这件事
  rationale: 分词结构说明此人忘记了先前罪得洁净；译文保留其已发生的意味，但不进一步界定洁净的礼仪、救恩次序或宗派解释。
- issue: 泛称单数 αὐτοῦ 的性别表达
  choice: 自己
  alternative: 他的
  rationale: 现代汉语以“自己”清楚维持单数回指，又避免将希腊语语法阳性误解为仅指男性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“瞎眼的、近视的”刻意保留原文并置的视觉隐喻；“已经得了洁净”用自然汉语表达名词“洁净”，不添加原文未明说的施行者。
