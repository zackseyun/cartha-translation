id: 2PE.1.3
reference: 2 Peter 1:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ὡς πάντα ἡμῖν τῆς θείας δυνάμεως αὐτοῦ τὰ πρὸς ζωὴν καὶ εὐσέβειαν δεδωρημένης διὰ τῆς ἐπιγνώσεως τοῦ καλέσαντος ἡμᾶς ⸂ἰδίᾳ δόξῃ καὶ ἀρετῇ⸃,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/003.yaml
  text: As his divine power has granted to us all things for life and godliness[a], through the knowledge of the one who called us by his own glory and excellence,
translation:
  language: zh_hans
  text: 既然他的神圣能力已经借着对那位以自己的荣耀和卓越[a]呼召我们的那一位的认识，把关乎生命和敬虔的一切赐给我们，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“呼召我们归入他自己的荣耀和卓越。”希腊语的与格短语可以有不同理解。
    reason: 保留ἰδίᾳ δόξῃ καὶ ἀρετῇ可理解为呼召的工具或方式，也可理解为目标或范围的句法歧义。
lexical_decisions:
- source_word: Ὡς
  choice: 既然
  rationale: 这里引出下文劝勉的根据；“既然”在现代汉语中自然地表达这一承接和依据关系。
- source_word: πάντα ... τὰ πρὸς ζωὴν καὶ εὐσέβειαν
  choice: 关乎生命和敬虔的一切
  rationale: 保留 πάντα 的完整范围，以及 τὰ πρὸς 所表达的“与……有关、为着……”之意；不擅自添加“所需”。
- source_word: τῆς θείας δυνάμεως αὐτοῦ
  choice: 他的神圣能力
  rationale: 按希腊语属格结构自然表达；“神圣”准确保留 θεῖος 的性质含义。
- source_word: δεδωρημένης
  choice: 已经……赐给了
  rationale: 表达 δωρέομαι 所含恩赐意味，并以“已经”体现完成时所指的既成事实及持续结果。
- source_word: διὰ τῆς ἐπιγνώσεως
  choice: 借着认识
  rationale: 以动词化表达使现代汉语流畅，同时保留 διὰ 所表示的途径或媒介；不把 ἐπίγνωσις 过度技术化为“完全的知识”。
- source_word: τοῦ καλέσαντος ἡμᾶς
  choice: 那位……召我们的主
  rationale: 将实词化分词译为有位格的称谓；依上下文明确其为主，使中文不悬空，同时保留“召”的动作。
- source_word: ἰδίᾳ
  choice: 自己的
  rationale: 保留 ἴδιος 对归属的强调。
- source_word: δόξῃ
  choice: 荣耀
  rationale: 这是 δόξα 在神圣语境中的常用而庄重的译法，涵盖彰显的威荣。
- source_word: ἀρετῇ
  choice: 卓越
  rationale: ἀρετή 可指德行或卓越；此处用于呼召者并与“荣耀”并列，“卓越”较能保留宽广含义，且避免局限为人的道德品格。
- source_word: ζωὴν
  choice: 生命
  rationale: 原文没有限定词，故保持宽广含义，让今世与末世层面均可由语境呈现。
- source_word: εὐσέβειαν
  choice: 敬虔
  rationale: 准确表达 εὐσέβεια 面向神并落实于生活的态度与实践，也是庄重而通行的圣经用语。
theological_decisions:
- issue: ἰδίᾳ δόξῃ καὶ ἀρετῇ 中与格短语所表达的关系
  choice: 以自己的荣耀和卓越召我们
  alternative: 召我们归入他自己的荣耀和卓越
  rationale: 按所给 SBLGNT 文本，与格最自然可理解为工具或方式，表示呼召借其荣耀和卓越而施行；但其句法也容许目标或范围的理解，因此在脚注中保留另一译法，不消除原文张力。
- issue: 生命与敬虔的范围
  choice: 关乎生命和敬虔的一切
  alternative: 生命和敬虔所需的一切
  rationale: 原文强调与生命和敬虔有关的一切，却没有明说“所需”，故正文不补入需求或充分性的限定。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“这是……而有的”用来理清希腊语较长的属格独立结构，同时保持本节作为后续句子的依据性开端。脚注标记置于所解释的末尾短语之后。
