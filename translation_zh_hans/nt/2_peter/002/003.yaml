  text: καὶ ἐν πλεονεξίᾳ πλαστοῖς λόγοις ὑμᾶς ἐμπορεύσονται· οἷς τὸ κρίμα ἔκπαλαι οὐκ ἀργεῖ, καὶ ἡ ἀπώλεια αὐτῶν οὐ ⸀νυστάζει.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/003.yaml
  text: And in greed they will exploit you with fabricated words. Their judgment from long ago is not idle[a], and their destruction is not asleep.
translation:
  language: zh_hans
  text: 他们因贪婪，用捏造的话从你们身上牟利[a]。他们所受的审判早已定下，绝不闲着；他们的灭亡也不沉睡。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把你们当作货物来牟利。”希腊文采用商业交易的比喻，指把人当作获利的对象。
    reason: lexical_alternative
lexical_decisions:
- source_word: πλεονεξίᾳ
  choice: 因贪婪
  rationale: 介词短语在此可表达行为动机；“因贪婪”自然清楚，并保留贪得无厌的道德含义。
- source_word: πλαστοῖς λόγοις
  choice: 用捏造的话
  rationale: πλαστός有塑造、编造之意；“捏造的话”突出这些言论是人为炮制的，而不只是一般性的错误。
- source_word: ἐμπορεύσονται
  choice: 牟取你们的利益
  rationale: 该动词带商业交易的隐喻，在此指把人当作获利对象；正文以现代汉语表达剥削获利之意，脚注保留更直译的商业意象。
- source_word: κρίμα
  choice: 审判
  rationale: 保留司法判决及惩罚的宽泛含义，不把词义过度限定为某一种具体刑罚。
- source_word: ἔκπαλαι
  choice: 从古以来
  rationale: 表达这一审判早已设定、由来已久的时间意味。
- source_word: οὐκ ἀργεῖ
  choice: 并未闲着
  rationale: 保留ἀργέω“闲置、不起作用”的拟人化表达，而不单纯释为“没有迟延”。
- source_word: ἀπώλεια
  choice: 灭亡
  rationale: “灭亡”是现代中文圣经语境中清楚而庄重的对应，涵盖毁灭、败亡之意，却不自行界定其机制或持续时间。
- source_word: οὐ νυστάζει
  choice: 没有沉睡
  rationale: 保留νυστάζω所形成的生动拟人：灭亡并未打盹或失去警醒。
theological_decisions:
- issue: 所宣告惩罚的性质
  choice: 直译为必然临到的审判和灭亡，不进一步规定惩罚的机制或持续时间。
  alternative: 把“灭亡”明确解释为消灭，或仅解释为今世的败坏。
  rationale: 本节明确警告假教师将受审判并灭亡，但没有在此界定该惩罚的具体形态或期限；译文因此保留原文的神学张力。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“捏造的话”传达刻意炮制言论的意味；“审判并未闲着”和“灭亡也没有沉睡”保留原文连续的拟人化意象。
