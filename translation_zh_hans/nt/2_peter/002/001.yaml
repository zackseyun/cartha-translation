id: 2PE.2.1
reference: 2 Peter 2:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ἐγένοντο δὲ καὶ ψευδοπροφῆται ἐν τῷ λαῷ, ὡς καὶ ἐν ὑμῖν ἔσονται ψευδοδιδάσκαλοι, οἵτινες παρεισάξουσιν αἱρέσεις ἀπωλείας, καὶ τὸν ἀγοράσαντα αὐτοὺς δεσπότην ἀρνούμενοι, ἐπάγοντες ἑαυτοῖς ταχινὴν ἀπώλειαν·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/001.yaml
  text: But false prophets also arose among the people[a], just as there will also be false teachers among you, who will secretly bring in destructive heresies, even denying the Master who bought them[b], bringing swift destruction on themselves.
translation:
  language: zh_hans
  text: 从前，百姓中也兴起过假先知；同样，你们中间也将有假教师。他们会暗中引进导致灭亡的异端[a]，甚至否认那买了他们的主宰[b]，给自己招来迅速的灭亡。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “异端”也可译作“派别”或“宗派”。这个希腊词可指党派或教派；在这里大概指暗中引进、并导致灭亡的教导或运动。
    reason: 保留αἵρεσις在教义性错误与群体性派别之间的词义幅度。
  - marker: b
    text: 也可译作“那救赎了他们的主”。希腊原文直译是“那买了他们的主宰”，保留了购买的比喻，并未在这里说明这种“购买”的范围或性质。
    reason: 保留原文的购买隐喻及其未被解决的神学张力。
lexical_decisions:
- source_word: Ἐγένοντο
  choice: 出现过
  rationale: 表达不定过去时所指的历史性出现；配合“从前”，自然地与后文将来出现的假教师形成对照。
- source_word: ψευδοπροφῆται / ψευδοδιδάσκαλοι
  choice: 假先知 / 假教师
  rationale: 直接保留两个希腊复合名词的平行关系，措辞清楚而庄重。
- source_word: ἐν τῷ λαῷ
  choice: 在上帝的子民中
  rationale: 定冠词所指的“民”在旧约背景下是立约群体；此译法让现代读者明白其群体含义，但不在正文中进一步限定为以色列。
- source_word: παρεισάξουσιν
  choice: 会暗中引进
  rationale: 同时表达将来行动及偷偷带入、夹带进来的意味。
- source_word: αἱρέσεις ἀπωλείας
  choice: 使人灭亡的异端
  rationale: 将属格理解为结果或性质，表达这些异端导向毁灭；“异端”符合本处与否认主宰相连的教导层面，同时用脚注保留“派别”的词义可能。
- source_word: δεσπότην
  choice: 主宰
  rationale: 保留δεσπότης所强调的所有权和绝对权柄，并与通常译作“主”的κύριος有所区别。
- source_word: ἀγοράσαντα αὐτοὺς
  choice: 那买了他们的
  rationale: 保留ἀγοράζω的买卖隐喻，不以“救赎”代替原文，从而不预先解决其神学范围。
- source_word: ἐπάγοντες ἑαυτοῖς ταχινὴν ἀπώλειαν
  choice: 给自己招来迅速的灭亡
  rationale: 自然表达反身关系、行为后果及ταχινή所含的迅速性。
theological_decisions:
- issue: αἵρεσις在本节是教义性异端还是群体性派别
  choice: 正文译作“异端”
  alternative: “导致灭亡的派别”或“毁灭性的党派”
  rationale: 暗中引进这些事并否认主宰的语境突出错误教导，但该词也可指派别或宗派，因此在脚注中保留这一真实歧义。
- issue: τὸν ἀγοράσαντα αὐτοὺς δεσπότην的含义及神学范围
  choice: 那买了他们的主宰
  alternative: “那救赎了他们的主”或“那购得他们的主宰”
  rationale: 正文保留“买”的原始隐喻和“他们”这一明确宾语，不对这项购买的性质、范围或最终救恩结论作教派性解释。
- issue: δεσπότης与κύριος的区别
  choice: 主宰
  alternative: “主”或“主人”
  rationale: “主宰”能表达最高权柄和所有权，也避免将δεσπότης与κύριος完全合并；“主人”虽较字面，却在现代汉语中容易显得仅指日常主仆关系。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“从前……同样……”清楚呈现过去假先知与将来假教师的对照；“暗中引进”“给自己招来”是自然现代汉语，同时保持警告语气。所有脚注标记均已置于正文对应词语之后。
