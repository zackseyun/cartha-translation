  text: ὅπου ἄγγελοι ἰσχύϊ καὶ δυνάμει μείζονες ὄντες οὐ φέρουσιν κατ’ ⸀αὐτῶν βλάσφημον κρίσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/011.yaml
  text: whereas angels[a], though greater in might and power[b], do not bring a slanderous judgment against them.
translation:
  language: zh_hans
  text: 然而，天使虽在力量和能力上更为强大，也不对他们[b]作出毁谤性的[a]判决。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“亵渎性的”或“辱骂性的”。希腊语形容词可表示辱骂、诋毁或毁谤的话。
    reason: lexical_alternative
  - marker: b
    text: “他们”很可能指上节的“尊荣者”，但彼得在这里没有进一步说明其身份。
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπου
  choice: 可是
  rationale: 这里主要承接上文形成对比，并非表达地点；“可是”自然地显明假教师与天使行为之间的反差。
- source_word: ἄγγελοι
  choice: 天使
  rationale: 上下文涉及超越人的有能者，指天上的使者，而非普通人间信使。
- source_word: ἰσχύϊ καὶ δυνάμει
  choice: 在力量和能力上
  rationale: 保留两个近义名词的叠加强调，也表达天使在这些方面更为强大。
- source_word: μείζονες ὄντες
  choice: 虽然……更大
  rationale: 分词结构在语境中带让步意味：天使尽管更强大，却不作出这类判决。
- source_word: οὐ φέρουσιν
  choice: 却不提出
  rationale: φέρω与κρίσις连用，表示提出或带来判决；“提出”符合现代汉语的司法语感。
- source_word: κατ’ αὐτῶν
  choice: 来指控他们
  rationale: 表达判决针对某些对象，同时以“他们”保留原文对所指对象的含蓄表达。
- source_word: βλάσφημον
  choice: 毁谤性的
  rationale: 该词可指辱骂、诋毁或亵渎性的言语；此处针对受判者，“毁谤性的”不会把含义不必要地限定为亵渎上帝。
- source_word: κρίσιν
  choice: 判决
  rationale: 保留该词的司法判断或裁决意味；其不当性质由修饰语说明。
theological_decisions:
- issue: αὐτῶν（“他们”）所指为何
  choice: 正文保留“他们”，不明确指定其身份。
  alternative: 可理解为堕落的灵界存在、人间尊贵者，或泛指上文的“尊荣者”。
  rationale: 本节没有进一步说明代词所指，只能由上文推断；保留代词可避免加入原文未明说的教义判断。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“力量和能力”保留原文近义并列；“提出……判决来指控”兼顾司法意象与现代可读性。所有未明确的指代均保持开放。
