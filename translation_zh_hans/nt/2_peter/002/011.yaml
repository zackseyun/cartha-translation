- from: 可是，天使虽然在力量和能力上更大，却不提出毁谤性的[a]判决来指控他们[b]。
  to: 然而，天使虽在力量和能力上更为强大，也不对他们[b]作出毁谤性的[a]判决。
  rationale: 修订使“对他们”直接修饰“作出……判决”，避免把原文单一的司法表达扩展为“判决来指控”的双重动作；同时以“更为强大”改善现代汉语搭配。代词仍不明确其所指，保留原文及上下文中的解释开放性。
