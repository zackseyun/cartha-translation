  source_fidelity: 原译基本保留了让步对比、天使的优越能力、未明指的“他们”，以及βλάσφημον κρίσιν的贬义性质。但“提出……判决来指控他们”把“判决”和“指控”叠加为两个司法动作，较原文的“对他们作出／提出……判决”更具体，宜删去“来指控”。
  naturalness: “在力量和能力上更大”不合现代汉语惯用搭配，宜改为“在力量和能力上更为强大”。“对他们作出……判决”比“提出……判决来指控他们”更自然、简洁。
  terminology: “天使”“力量和能力”“毁谤性的”“判决”均可保留。“毁谤性的判决”虽略有司法语体色彩，但能在正文中保留βλάσφημον的广义贬抑性质；脚注适当地列出“亵渎性”“辱骂性”等可能译法。
