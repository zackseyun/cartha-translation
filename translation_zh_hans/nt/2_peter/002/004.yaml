id: 2PE.2.4
reference: 2 Peter 2:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Εἰ γὰρ ὁ θεὸς ἀγγέλων ἁμαρτησάντων οὐκ ἐφείσατο, ἀλλὰ ⸀σειραῖς ζόφου ταρταρώσας παρέδωκεν εἰς κρίσιν τηρουμένους,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/004.yaml
  text: For if God did not spare angels when they sinned[a], but cast them into Tartarus and committed them to chains of gloom, to be kept for judgment[b],
translation:
  language: zh_hans
  text: 因为上帝若没有宽容犯了罪的天使，反而把他们投入塔尔塔罗斯[a]，交给幽暗的锁链拘禁，留待审判[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “塔尔塔罗斯”也可概括译作“地狱”。希腊文动词特指把对象投入塔尔塔罗斯，因此正文保留这一较具体的名称。
    reason: lexical_alternative
  - marker: b
    text: 有些抄本作“幽暗的坑穴”，而不是“幽暗的锁链”。
    reason: textual_variant
lexical_decisions:
- source_word: ἐφείσατο
  choice: 没有宽容
  rationale: 在审判和惩罚的语境中，表示不予饶恕、不免除刑罚；“没有宽容”简洁保留了不施宽待的含义。
- source_word: ἀγγέλων ἁμαρτησάντων
  choice: 犯了罪的天使
  rationale: 以定语从句式表达不定过去时分词所指的既成事件，现代汉语自然，也不额外说明他们所犯何罪。
- source_word: ταρταρώσας
  choice: 把他们投入塔尔塔罗斯
  rationale: 此罕见动词特指投入塔尔塔罗斯；采用音译保留原文独特的幽冥与审判意象，避免用一般性的“地狱”代替。
- source_word: σειραῖς ζόφου
  choice: 幽暗的锁链
  rationale: σειραῖς取“锁链”，ζόφου取“幽暗”，既呈现拘禁意象，也保留阴沉、幽冥般的黑暗色彩。
- source_word: παρέδωκεν
  choice: 交在……中
  rationale: 在司法语境中有交付看管、拘禁之意；此译法与后面的锁链及等候审判自然衔接。
- source_word: εἰς κρίσιν
  choice: 等候审判
  rationale: κρίσις在此指将临的审判，并不预先把含义限定为定罪判决。
- source_word: τηρουμένους
  choice: 拘留着
  rationale: 保留现在时被动分词所表达的持续受拘禁状态；与“等候审判”连用，清楚表明拘禁尚在持续。
theological_decisions:
- issue: ταρταρώσας是否应概括译为“投入地狱”
  choice: 把他们投入塔尔塔罗斯
  alternative: 把他们投入地狱
  rationale: 原文使用特指塔尔塔罗斯的罕见动词。音译能保留彼得所采用的具体意象，不把它自动等同于后来含义更广的“地狱”概念。
- issue: 锁链、塔尔塔罗斯与持续拘禁之间的关系
  choice: 投入塔尔塔罗斯，交在幽暗的锁链中，拘留着等候审判
  alternative: 戴着幽暗的锁链投入塔尔塔罗斯，等候审判
  rationale: 原文句法紧凑，未明确锁链究竟主要表示工具、处所还是拘禁状态。正文并列保留各项意象，不把它们之间的关系解释得过于确定。
- issue: εἰ γὰρ的条件结构
  choice: 因为，上帝若……
  alternative: 因为，上帝既然……
  rationale: 保留εἰ所标示的条件语气，并以逗号结尾，显示本节是延续到后文才完成的论证，不提前将条件改成确定事实陈述的句法。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留本节作为“若……便……”论证前半部分的未完句式，并将生僻专名放在正文、以脚注解释，兼顾原文精确性与普通读者的可理解性。
