  text: καὶ δίκαιον Λὼτ καταπονούμενον ὑπὸ τῆς τῶν ἀθέσμων ἐν ἀσελγείᾳ ἀναστροφῆς ἐρρύσατο—
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/007.yaml
  text: and he rescued righteous Lot[c][b][a], who was being tormented by the sensual conduct of the lawless—
translation:
  language: zh_hans
  text: 又搭救了义人罗得，他因不法之人放荡[c]的行为[b]而饱受折磨[a]——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“深受压迫”或“深感痛苦”。
    reason: lexical_alternative
  - marker: b
    text: “行为”也可译作“生活方式”或“品行”。
    reason: lexical_alternative
  - marker: c
    text: “放荡”所译的词也可译作“荒淫”或“淫逸”，强调毫无羞耻的过度放纵。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: 又
  rationale: 承接上一节所列举的拯救行动；现代汉语中“又”比直译为“和”更自然。
- source_word: δίκαιον
  choice: 义人
  rationale: 明确保留原文对罗得的正面道德评价；“义人罗得”也是简洁、自然的圣经汉语表达。
- source_word: Λὼτ
  choice: 罗得
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: καταπονούμενον
  choice: 饱受折磨
  rationale: 现在时被动分词表达持续承受的严重痛苦或困扰；“饱受折磨”兼顾被动意味、持续性和强度。
- source_word: ὑπὸ τῆς ... ἀναστροφῆς
  choice: 因……的行为
  rationale: ὑπό在这里标明造成痛苦的原因，ἀναστροφή指行为、品行或生活方式；此处用“因……的行为”符合现代汉语，并保留原句的因果关系。
- source_word: τῶν ἀθέσμων
  choice: 不法之人
  rationale: ἄθεσμος指蔑视法律、规范或正道的人；“不法之人”保留其道德与法理色彩，又比名词化的“不法者”更自然。
- source_word: ἐν ἀσελγείᾳ
  choice: 放荡
  rationale: ἀσέλγεια表示无所顾忌、毫无羞耻的道德和情欲放纵；“放荡”简明易懂，同时不过度限定为某一种具体罪行。
- source_word: ἐρρύσατο
  choice: 搭救了
  rationale: ῥύομαι表示从危险或困境中救出；“搭救”准确、自然，也适合本段叙事语体。
theological_decisions:
- issue: 如何处理原文对罗得的道德评价
  choice: 译作“义人罗得”，不加淡化或限定
  alternative: 译作“罗得这个义人”，或因《创世记》中罗得的行为而弱化“义”的评价
  rationale: 原文明确以δίκαιος描述罗得。译文应保留作者本人的神学评价，而不因其他经文所引发的解释困难擅自调整。
- issue: ἀσέλγεια所指罪行的范围
  choice: 采用较宽的“放荡”
  alternative: 具体译作“淫乱”或“荒淫”
  rationale: 该词可涉及情欲失控，却更广泛地强调无耻、恣意的道德放纵；采用“放荡”可避免把原文无意限定的范围缩窄。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。用分号承接主句与解释罗得处境的分句，并保留句末破折号，以显示本节在上下文中的句法延续。脚注标记紧随各自说明的词语。
