id: 2PE.2.21
reference: 2 Peter 2:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: κρεῖττον γὰρ ἦν αὐτοῖς μὴ ἐπεγνωκέναι τὴν ὁδὸν τῆς δικαιοσύνης ἢ ἐπιγνοῦσιν ⸀ὑποστρέψαι ἐκ τῆς παραδοθείσης αὐτοῖς ἁγίας ἐντολῆς·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/021.yaml
  text: For it would have been better for them not to have known the way of righteousness than[a], after knowing it[c][b], to turn back from the holy commandment delivered to them.
translation:
  language: zh_hans
  text: 因为对他们来说，若未曾认识公义之路[a]，倒比认识以后回头离开那传给他们的圣洁诫命[b]更好。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “公义之路”也可译作“义路”或“正义之道”。
    reason: lexical_alternative
  - marker: b
    text: “回头离开”也可译作“转离”或“背离”；原文带有回转、折返的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: κρεῖττον γὰρ ἦν αὐτοῖς
  choice: 因为他们……倒……更好
  rationale: 保留γὰρ与上文的解释关系，也以自然汉语表达κρεῖττον ἦν的反事实比较意味。
- source_word: ἐπεγνωκέναι / ἐπιγνοῦσιν
  choice: 不曾认识 / 认识以后
  rationale: 重复使用“认识”对应同一动词，保留前后比较；不译作“完全认识”，以免把复合动词的语气强调过度。
- source_word: ὁδὸν τῆς δικαιοσύνης
  choice: 义路
  rationale: ὁδός在此比喻生活道路或行事方向；“义路”简洁、自然，并保留δικαιοσύνη的伦理与属神含义。
- source_word: ὑποστρέψαι ἐκ
  choice: 转离
  rationale: 结合动词的回转意味和介词所表示的脱离；“转离”既表达方向逆转，也避免额外断定其神学性质。
- source_word: παραδοθείσης αὐτοῖς
  choice: 传给他们的
  rationale: 准确表达被动的传递行为；“传给”在现代汉语中自然，且不额外加入“托付”所含的管家责任意味。
- source_word: ἁγίας ἐντολῆς
  choice: 神圣诫命
  rationale: 保留单数和宗教伦理分量；“神圣”在此较自然地修饰“诫命”，表达其分别为圣的性质。
theological_decisions:
- issue: 本节是否应在翻译中裁定背道与虚假信仰表白之间的神学争论
  choice: 直译其确实认识义路、后来转离诫命的比较与逆转，不进一步说明其救恩状态
  alternative: 用更强措辞暗示已经失去救恩，或用更弱措辞暗示只曾肤浅接触信仰
  rationale: 希腊文明确陈述“认识”以及此后的“转离”，但没有在本句中系统界定这些人的救恩状态；译文应保留这种神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“倒比……更好”使反事实比较在汉语中清晰；语序依照汉语习惯调整，同时保留原文的因果连接、重复的“认识”、单数“诫命”以及未被解决的神学张力。
