base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/017.yaml
  text: These are waterless springs and mists driven by a storm[b][a], for whom the gloom of darkness has been kept.
translation:
  language: zh_hans
  text: 这些人是无水的泉源和被暴风吹赶的雾气[a]；幽冥的黑暗已为他们存留[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“被暴风吹赶的云。”希腊语较确切地指“雾”或“霭”，但有些译本较宽泛地译作“云”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“漆黑的幽暗已为他们保留。”
    reason: lexical_alternative
lexical_decisions:
- source_word: πηγαὶ ἄνυδροι
  choice: 无水的泉源
  rationale: πηγή通常指泉源、泉水，而不是人工挖掘的井；ἄνυδρος意为没有水。“无水的泉源”保留了本应供水却无水的反讽意象。
- source_word: ὁμίχλαι
  choice: 雾气
  rationale: ὁμίχλη较准确地指雾或霭。“雾气”自然地表现其飘忽、短暂的形象；“云”虽是传统译法之一，却较宽泛。
- source_word: ὑπὸ λαίλαπος ἐλαυνόμεναι
  choice: 被暴风驱散
  rationale: λαῖλαψ指猛烈的风暴，ἐλαύνω表示驱赶、推动。此处雾气在暴风中被驱赶而散，“被暴风驱散”既保留被动语态，也符合现代汉语表达。
- source_word: οἷς
  choice: 为他们
  rationale: 关系代词所指的是本节开头的“这些人”，即假教师，而非仅指中间的比喻形象，因此译作指人的“为他们”。
- source_word: ὁ ζόφος τοῦ σκότους
  choice: 幽暗的黑暗
  rationale: ζόφος表示阴沉、幽暗，σκότος表示黑暗。译文保留两个词叠加的强烈意象，不把它简化为单一的“最深的黑暗”。
- source_word: τετήρηται
  choice: 已……存留
  rationale: 这是τηρέω的完成时被动形式，表示已经保留并仍处于保留状态。“已……存留”保留完成时意味，也不明说未在原文中出现的施事者。
theological_decisions:
- issue: 末句作为审判语言的表达
  choice: 保留无施事者的被动含义：“幽暗的黑暗已为他们存留”
  alternative: 明确补出“上帝已为他们存留”
  rationale: 原文暗示这是神的审判，却没有明说施事者。译文不补入“上帝”，以免超出经文本身，并保留其含蓄而庄严的审判语气。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“这些人是……是……”保留原文并列比喻；分号划分比喻与审判结论。脚注标记均在正文中出现。
