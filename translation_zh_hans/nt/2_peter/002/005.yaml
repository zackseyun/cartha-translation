  text: καὶ ἀρχαίου κόσμου οὐκ ἐφείσατο, ἀλλὰ ὄγδοον Νῶε δικαιοσύνης κήρυκα ἐφύλαξεν, κατακλυσμὸν κόσμῳ ἀσεβῶν ἐπάξας,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/005.yaml
  text: and if he did not spare the ancient world[a], but preserved Noah, an eighth person, a herald of righteousness, when he brought a flood upon a world of the ungodly[c][b],
translation:
  language: zh_hans
  text: 又如果他没有宽容上古世界，却保全了挪亚这第八人[a]——义的宣讲者[b][c]——并使洪水临到不敬虔者的世界，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “挪亚这第八人”是原文压缩的序数表达；也可理解为“挪亚是八人之一”或“挪亚连同另外七人”。
    reason: lexical_alternative
  - marker: b
    text: “宣讲者”也可译作“传令者”或“传道者”；原词指公开宣告信息的人。
    reason: lexical_alternative
  - marker: c
    text: “义”在这里也可译作“公义”或“公正”。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀρχαίου κόσμου
  choice: 上古的世界
  rationale: 指昔日、尤其是洪水以前的世界；“上古的世界”既保留时间意味，也符合现代汉语的庄重语体。
- source_word: οὐκ ἐφείσατο
  choice: 没有宽容
  rationale: φείδομαι在审判语境中表示不予宽免；“没有宽容”保留原文简洁而明确的审判意味。
- source_word: ὄγδοον Νῶε
  choice: 作为第八人的挪亚
  rationale: 原文以序数词修饰挪亚，表达压缩且有一定歧义。“作为第八人的挪亚”保留其形式，不直接把含义限定为“八人之一”；较自然的解释在脚注说明。
- source_word: δικαιοσύνης κήρυκα
  choice: 传扬义的人
  rationale: κῆρυξ是公开宣告信息的人；用“传扬……的人”比音译式或职衔式表达更易懂，同时保留宣告的性质。δικαιοσύνη译为“义”，不预先缩限为个人德行或司法公正。
- source_word: ἐφύλαξεν
  choice: 保全了
  rationale: 在洪水审判的语境中，φυλάσσω表示使其安然存留；“保全”准确表达从灾难中蒙保存的结果。
- source_word: κατακλυσμὸν
  choice: 洪水
  rationale: κατακλυσμός指淹没大地的洪水；汉语无需借助不定冠词，也自然使人联想到挪亚时代的洪水。
- source_word: κόσμῳ ἀσεβῶν
  choice: 不敬虔之人的世界
  rationale: 保留κόσμος与属格ἀσεβῶν的结构，表明这是由不敬虔者构成或具有其特征的世界，而不把它简化成抽象的“邪恶世界”。
- source_word: ἐπάξας
  choice: 使……临到
  rationale: 该不定过去时分词依附于主要动词，表示上帝使洪水临到那个世界；并列式汉语自然传达其与保全挪亚相伴的审判行动。
theological_decisions:
- issue: δικαιοσύνη的译法
  choice: 义
  alternative: 公义；公正
  rationale: “义”能涵盖合乎上帝旨意的正直及道德秩序，保留该词的神学宽度；“公正”容易仅被理解为司法公平。
- issue: ὄγδοον Νῶε所指的关系
  choice: 作为第八人的挪亚
  alternative: 八人之一的挪亚；挪亚和另外七个人
  rationale: 原文是压缩的序数表达，通常理解为挪亚连同另外七人得以保全，但正文不把其语法歧义完全消解，并在脚注交代通常解释。
- issue: 挪亚所宣告的内容
  choice: 传扬义
  alternative: 宣讲公正
  rationale: 正文不说明挪亚究竟只宣告人的正直生活，还是也宣告上帝公正的审判，因此采用较宽的“义”，避免额外增补具体教义内容。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“又”承接上一节开始的条件句及其连续例证；破折号标明“他是传扬义的人”是对挪亚的补充说明。保留“第八人”的压缩表达，并借脚注说明常见理解。
