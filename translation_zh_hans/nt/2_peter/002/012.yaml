  text: οὗτοι δέ, ὡς ἄλογα ζῷα ⸂γεγεννημένα φυσικὰ⸃ εἰς ἅλωσιν καὶ φθοράν, ἐν οἷς ἀγνοοῦσιν βλασφημοῦντες, ἐν τῇ φθορᾷ αὐτῶν ⸂καὶ φθαρήσονται⸃,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/012.yaml
  text: But these[a], like irrational animals—creatures of instinct, born for capture and destruction—blaspheming about things they do not understand, will also be destroyed in their destruction[d][c][b],
translation:
  language: zh_hans
  text: 但这些人好像没有理性的动物[a]，生来受本能支配，注定被捕捉和毁灭。他们毁谤自己所不知道的事[c]，也必在自己的毁灭中被毁灭[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “没有理性的”也可译作“不具理性的”或“不凭理性行事的”；这里指受本能支配的动物，并非仅指不会说话。
    reason: lexical_alternative
  - marker: c
    text: “毁谤”也可译作“辱骂”或“亵渎”；原文在本句中没有明说其对象。
    reason: lexical_alternative
  - marker: d
    text: 原文连续使用同根词，直译近于“在他们的毁灭中也必被毁灭”。“毁灭”也可理解为“败坏”；代词的具体所指和“在……中”的关系有不同解释，正文保留其紧凑表达。
    reason: textual_or_syntactic_ambiguity
lexical_decisions:
- source_word: ἄλογα ζῷα
  choice: 没有理性的牲畜
  rationale: ἄλογα 在此指不具理性、受本能支配，而不只是“不会说话”；“牲畜”也符合后文被捕捉和毁灭的意象。
- source_word: γεγεννημένα φυσικὰ
  choice: 生来受本性支配
  rationale: 保留 γεγεννημένα 的出生意象，并以自然现代汉语表达 φυσικά 所指按天性或本能行动。
- source_word: εἰς ἅλωσιν καὶ φθοράν
  choice: 只为被捕捉、被毁灭
  rationale: εἰς 在此表达目的或结果；被动表述自然地传达牲畜遭捕获并毁灭的命运。“只为”体现该短语强烈的目的性色彩。
- source_word: ἐν οἷς ἀγνοοῦσιν
  choice: 自己所不明白的事
  rationale: 中性复数关系代词所指最自然是他们不认识或不了解的事物、领域；“不明白”符合争论语境。
- source_word: βλασφημοῦντες
  choice: 毁谤
  rationale: βλασφημέω 可指亵渎、辱骂或毁谤；原文没有明说对象是上帝，因此“毁谤”保留强烈谴责，又不擅自限定为宗教性的“亵渎”。
- source_word: ἐν τῇ φθορᾷ αὐτῶν καὶ φθαρήσονται
  choice: 也必随着这些牲畜的毁灭而被毁灭
  rationale: 将 αὐτῶν 按较近且合乎比喻的先行词理解为牲畜，并用两个“毁灭”再现 φθορά 与 φθαρήσονται 的同根呼应；“随着……而”使汉语句法清楚。
theological_decisions:
- issue: βλασφημοῦντες 的语义强度及对象
  choice: 译为“毁谤”，不明说其对象属于神圣领域
  alternative: “亵渎”或“辱骂”
  rationale: 该动词能够表达亵渎，也能泛指恶言毁谤。上下文未在本节内明确宾语，译成“毁谤”可保留严厉性而避免加入原文未明说的对象。
- issue: φθορά / φθαρήσονται 是道德败坏还是毁灭
  choice: 两处均采用“毁灭”词组
  alternative: “败坏”或“腐化”
  rationale: 捕捉牲畜的意象和 ἅλωσις 更支持灭亡、毁坏之义；重复“毁灭”也保留原文刻意的同根词呼应，而不进一步界定审判的具体形式。
- issue: αὐτῶν 的所指
  choice: 理解为前述没有理性的牲畜
  alternative: 理解为这些人的“自身毁灭”或“自身败坏”
  rationale: 牲畜是较自然的近距离先行词，并使这些人的结局与比喻中的牲畜直接对应；脚注提示代词和结构也容许另一种理解。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“没有理性的牲畜”“受本性支配”保留论辩力度与动物比喻；后半句重复“毁灭”，有意再现希腊文同根词的修辞效果。
