id: 2PE.2.6
reference: 2 Peter 2:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ πόλεις Σοδόμων καὶ Γομόρρας τεφρώσας ⸀καταστροφῇ κατέκρινεν, ὑπόδειγμα μελλόντων ⸀ἀσεβέσιν τεθεικώς,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/006.yaml
  text: and if by reducing the cities of Sodom and Gomorrah to ashes he condemned them to destruction[a], having made them an example for those who would be ungodly[b],
translation:
  language: zh_hans
  text: 又把所多玛、蛾摩拉两城烧成灰烬，判处它们毁灭[a]，使它们成为后来不敬虔之人的鉴戒[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“判处它们倾覆。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“使它们成为将来不敬虔之人的例子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τεφρώσας
  choice: 烧成灰烬
  rationale: 该不定过去时分词表示使之化为灰烬；“烧成灰烬”在现代汉语中自然，并兼顾过程与结果。
- source_word: καταστροφῇ
  choice: 遭受毁灭
  rationale: 与 κατέκρινεν 连用，表达判决的内容或结果；译为“判定它们遭受毁灭”保留司法意味，也避免生硬直译为“以倾覆”。
- source_word: κατέκρινεν
  choice: 判定
  rationale: 该动词具有司法性的定罪、判决含义；配合“遭受毁灭”，中文用“判定”简洁自然。
- source_word: ὑπόδειγμα
  choice: 鉴戒
  rationale: 该词本义为示例或范例；在神审判的语境中明显具有警戒作用，“鉴戒”能以简洁、庄重的中文传达这一语境功能。
- source_word: μελλόντων ἀσεβέσιν
  choice: 后来不敬虔之人
  rationale: μελλόντων 指相对于该事件而言将来的人，ἀσεβέσιν 指不敬虔者；此译保留未来指向和人物所具有的性质，不扩展成具体行为描述。
- source_word: τεθεικώς
  choice: 使它们成为
  rationale: τίθημι 的完成时分词强调设立后持续成立的结果；“使它们成为”符合汉语习惯，也保留其结果状态。
- source_word: πόλεις Σοδόμων καὶ Γομόρρας
  choice: 所多玛、蛾摩拉两城
  rationale: 属格结构指所多玛和蛾摩拉这两座城；用“两城”自然地保留原文复数。
theological_decisions:
- issue: 承接上下文的隐含主语
  choice: 中文省略主语
  alternative: 他／神／主
  rationale: 希腊文此分句的主语承接上文，并未在本句重述。中文可自然省略，既维持上下文连贯，也不添入本句没有明说的称谓。
- issue: ἀσεβέσιν 的含义
  choice: 不敬虔之人
  alternative: 过不敬虔生活的人／恶人
  rationale: “不敬虔之人”直接保留该词对人与神关系及其品性的描述；“恶人”过于宽泛，“过不敬虔生活的人”则加入了原文未明说的行为性展开。
- issue: ὑπόδειγμα 的警戒功能
  choice: 鉴戒
  alternative: 例子／警告性的例子
  rationale: 审判语境使这个“例子”带有警告作用。“鉴戒”传达这种语境含义，但不加入特定教派解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“烧成灰烬”“遭受毁灭”清楚传达审判的行动与结果；“鉴戒”比单纯“例子”更符合语境，但以脚注保留较形式对应的译法。句末逗号保留本节在2:4—10长条件句中的未完结构。
