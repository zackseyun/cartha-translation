  text: ⸀ἀδικούμενοι μισθὸν ἀδικίας· ἡδονὴν ἡγούμενοι τὴν ἐν ἡμέρᾳ τρυφήν, σπίλοι καὶ μῶμοι ἐντρυφῶντες ἐν ταῖς ⸀ἀπάταις αὐτῶν συνευωχούμενοι ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/013.yaml
  text: suffering the wages of unrighteousness[a], considering daytime indulgence a pleasure. They are stains and blemishes, reveling in their deceptions while feasting with you[b],
translation:
  language: zh_hans
  text: 他们遭受不义的报偿[a]；他们把在白日纵情享乐看作乐事。他们是污点和瑕疵，在自己的诡诈中作乐，与你们一同宴饮[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为恶所得的报应”。
    reason: lexical_alternative
  - marker: b
    text: 部分抄本作“爱筵”，即：“他们在自己的爱筵中作乐，与你们一同宴饮。”
    reason: textual_variant
lexical_decisions:
- source_word: ἀδικούμενοι μισθὸν ἀδικίας
  choice: 遭受不义的报偿
  rationale: ἀδικούμενοι在此结合上下文表达承受恶行的后果；μισθός可指工价或报偿，ἀδικία可指不义或恶行。“遭受……报偿”保留惩罚性回报的语气，也避免把它误解为单纯受到别人不公正的对待。
- source_word: ἡδονὴν ἡγούμενοι τὴν ἐν ἡμέρᾳ τρυφήν
  choice: 把白昼的奢靡享乐看作快事
  rationale: ἡγέομαι与表语宾格表示“看作”；ἡδονή为快感或乐事，τρυφή指奢华放纵的享受，ἐν ἡμέρᾳ强调在白昼公开放纵的无耻。
- source_word: σπίλοι καὶ μῶμοι
  choice: 污点和瑕疵
  rationale: 两个词共同构成玷污和缺陷的比喻；此译保留成对意象及道德谴责色彩。
- source_word: ἐντρυφῶντες
  choice: 沉溺……纵情享乐
  rationale: 该分词指沉迷于奢侈享受或放纵作乐。用前后呼应的表达，既呈现其持续沉溺，也保持与本节享乐主题的联系。
- source_word: ἐν ταῖς ἀπάταις αὐτῶν
  choice: 在自己的欺骗之中
  rationale: 按SBLGNT正文ἀπάταις翻译，指欺骗、诡诈；“自己的”保留αὐτῶν的归属关系。
- source_word: συνευωχούμενοι ὑμῖν
  choice: 与你们一同宴饮时
  rationale: 该动词表示共同赴宴或一同吃喝；此译保留共同用餐的场景及分词与主要行为同时发生的关系，不限定宴席的具体性质。
theological_decisions:
- issue: ἀπάταις（欺骗）与ἀγάπαις（爱筵）的文本异文
  choice: 正文采用ἀπάταις，译作“自己的欺骗”
  alternative: 部分抄本作ἀγάπαις，可译为“他们在爱筵中纵情享乐，与你们一同宴饮”
  rationale: 所给SBLGNT正文采用ἀπάταις，且与本章假教师欺骗人的语境相合；ἀγάπαις是具有解释意义的异文，因此在脚注中保留，不在正文中取代主读法。
- issue: μισθὸν ἀδικίας中属格的关系
  choice: 译作“不义的报偿”
  alternative: 可理解为“为恶所得的报应”
  rationale: 原文属格可以概括性地关联不义与所得的报偿。正文保留较贴近形式且具有张力的说法，脚注说明更明确的因果性理解，避免把一种解释绝对化。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“奢靡享乐”“污点和瑕疵”“纵情享乐”保留原文强烈的道德谴责，同时避免过度口语化。脚注标记已放在各自所解释的词语之后。
