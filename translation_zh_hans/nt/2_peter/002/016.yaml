  text: ἔλεγξιν δὲ ἔσχεν ἰδίας παρανομίας· ὑποζύγιον ἄφωνον ἐν ἀνθρώπου φωνῇ φθεγξάμενον ἐκώλυσεν τὴν τοῦ προφήτου παραφρονίαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/016.yaml
  text: 'But he received a rebuke for his own transgression: a mute beast of burden[a], speaking with a human voice[b], restrained the prophet’s madness.'
translation:
  language: zh_hans
  text: 他却因自己的不法行为受了责备：一头不会说话的驮畜[a]，竟用人的声音说话[b]，制止了先知的疯狂。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“负重的牲畜”；这里指巴兰的驴（民数记22:28–30）。
    reason: cross_reference
  - marker: b
    text: 或译“以人的声音”。原文也可按字面译作“以一个人的声音”；但此处更可能指人的声音，与不会说话的牲畜形成对比。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγξιν
  choice: 责备
  rationale: 表示指责、斥责或纠正；“责备”在现代汉语中自然，也符合巴兰受到纠正的叙事语境。
- source_word: ἰδίας παρανομίας
  choice: 自己的不法行为
  rationale: παρανομία 指违背律法或法度的行为，不只是一般过错；“自己的”保留 ἰδίας 所强调的个人责任。
- source_word: ὑποζύγιον
  choice: 驮畜
  rationale: 原词泛指负重或受轭的牲畜；虽然上下文所指是巴兰的驴，正文仍保留希腊文较宽泛的表达。
- source_word: ἄφωνον
  choice: 不会说话的
  rationale: 原词意为无言、无语；此译比“哑的”更适合描述牲畜，并凸显它随后开口说话的反常性。
- source_word: ἐν ἀνθρώπου φωνῇ
  choice: 用人的声音
  rationale: 介词短语表达方式或凭借；这里是人的声音与不会说话的牲畜形成对照，并非特指男性。
- source_word: φθεγξάμενον
  choice: 说话
  rationale: 分词表示发出可辨识的言语；“说话”清楚自然。
- source_word: ἐκώλυσεν
  choice: 制止了
  rationale: κωλύω 可指拦阻、阻止；“制止了”表达牲畜使先知疯狂行径受到遏止，又不额外解释其具体程度。
- source_word: παραφρονίαν
  choice: 疯狂
  rationale: 原词指失去理性的疯狂状态或行为；“疯狂”保留其强烈语气，比“愚妄”更贴近原文。
- source_word: τοῦ προφήτου
  choice: 这先知的
  rationale: 定冠词在此指上文所涉及的巴兰；“这先知”在中文中指称清楚，同时不表示认可他的行为。
theological_decisions:
- issue: 是否根据巴兰故事的背景把 ὑποζύγιον 明确译为“驴”
  choice: 正文保留较宽泛的“驮畜”
  alternative: 驴
  rationale: 民数记22章清楚表明所指是巴兰的驴，但本节希腊文用的是泛称 ὑποζύγιον，而不是明确表示驴的词；正文据原文保留泛称，脚注说明具体所指。
- issue: 如何理解 ἐν ἀνθρώπου φωνῇ 中的 ἀνθρώπου
  choice: 人的
  alternative: 男人的
  rationale: 此处对比的是人的言语与牲畜原本不会说话，并非对比男性与女性，因此译作“人的”准确保留原意。
- issue: 如何处理“先知”这一称呼
  choice: 保留“这先知”
  alternative: 巴兰
  rationale: 原文称其为“先知”，在严厉谴责其行为的同时保留这一叙事称谓；译文不以专名替换，以免消除原文的张力。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“他却”承接上文并保留 δέ 的转折；“竟”体现不会说话的牲畜开口这一反常对比，但不增添新的事实内容。
