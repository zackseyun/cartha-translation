  text: καὶ πολλοὶ ἐξακολουθήσουσιν αὐτῶν ταῖς ἀσελγείαις, δι’ οὓς ἡ ὁδὸς τῆς ἀληθείας βλασφημηθήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/002.yaml
  text: And many will follow their sensuality[c][b][a], and because of them the way of the truth will be blasphemed.
translation:
  language: zh_hans
  text: 许多人会随从他们的放荡行为[a]；由于他们，真理之道[b]将受到毁谤[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “放荡行为”也可译作“无耻的放纵”或“淫荡行为”。原词指不知羞耻、不受约束的行为，常带有性方面的意味。
    reason: lexical_alternative
  - marker: b
    text: “真理之道”也可译作“真理的道路”。这短语很可能指与真理相符的信仰和生活方式。
    reason: lexical_alternative
  - marker: c
    text: “受到毁谤”也可译作“遭到辱骂”或“被人说坏话”；原词也可用于“亵渎”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: 许多人
  rationale: 自然表达数量众多，并保留原文不定指的复数主语。
- source_word: ἐξακολουθήσουσιν
  choice: 会随从
  rationale: 表达跟随他人道路或仿效其行为的意思，同时保留将来语气。
- source_word: αὐτῶν ταῖς ἀσελγείαις
  choice: 他们放荡的行为
  rationale: ἀσέλγεια指无耻、不受约束的放纵，常含性方面的意味，但不限于此；用“放荡的行为”既自然，也保留较广的道德范围。希腊文为复数，中文以集合性表达概括多种表现。
- source_word: δι’ οὓς
  choice: 因这些人的缘故
  rationale: διά加宾格在此表示原因。“这些人”保留复数人物所造成的恶劣后果，也不强行限定关系代词究竟只回指假教师还是连同随从者。
- source_word: ἡ ὁδὸς τῆς ἀληθείας
  choice: 真理之道
  rationale: 保留“道路”的隐喻和“真理”的属格关系；这短语很可能指与真理相符的信仰及生活道路。
- source_word: βλασφημηθήσεται
  choice: 将受到毁谤
  rationale: 保留将来被动语态。此动词可指亵渎、辱骂、恶言毁谤；对象是“真理之道”时，“受到毁谤”自然且不把含义限于直接亵渎上帝。
theological_decisions:
- issue: “真理之道”的所指
  choice: 采用“真理之道”，保留早期基督徒以“道路”指称信仰与生活方式的可能性。
  alternative: 译作“真道”或“真正的道路”。
  rationale: “真理之道”既保存原文隐喻与结构，也避免把它缩减为单指教义信息，或预先断定为纯粹性质性的“真正道路”。
- issue: ἀσέλγεια的道德范围
  choice: 译为“放荡的行为”，涵盖无耻、失控的道德放纵，并容纳常见的性意味。
  alternative: 译作“淫荡”“邪淫”或“荒淫无度”。
  rationale: 仅用性方面的词容易把原文宽广的无耻放纵收窄；“放荡的行为”仍传达其严重性而不过度限定。
- issue: δι’ οὓς的先行对象
  choice: 译作“因这些人的缘故”，不在正文中明确限定所指。
  alternative: 明确译成“因那些随从者的缘故”或“因那些假教师的缘故”。
  rationale: 希腊文复数关系代词的实际所指可结合上下文理解，但正文不宜加入原文没有明说的限定，以保留其可能涵盖相关人群的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“随从”保持经文语体但仍属常用表达；“放荡的行为”避免把原词仅限于性犯罪；分号呈现原文两个紧密相连的分句。所有脚注标记均置于对应词语之后。
