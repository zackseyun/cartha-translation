id: 2PE.2.10
reference: 2 Peter 2:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: μάλιστα δὲ τοὺς ὀπίσω σαρκὸς ἐν ἐπιθυμίᾳ μιασμοῦ πορευομένους καὶ κυριότητος καταφρονοῦντας. Τολμηταί, αὐθάδεις, δόξας οὐ τρέμουσιν, βλασφημοῦντες,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/010.yaml
  text: especially those who go after the flesh in the desire for defilement and despise authority[a]. Bold, self-willed, they do not tremble as they blaspheme glorious ones[d][c][b],
translation:
  language: zh_hans
  text: 尤其是那些随从肉体、贪恋污秽[a]而行，又轻蔑权柄[b]的人。他们胆大妄为，任性自恃，毁谤荣耀者[c]时毫不战兢。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “贪恋污秽”也可译作“带着污秽的欲望”。
    reason: 原文属格可表示欲望所趋向的对象，也可描述欲望的性质；正文采用前者，较清楚地表达语境中的不洁欲求。
  - marker: b
    text: “权柄”也可译作“主权”或“统治权”；原文没有明确说明这是一般权柄、主的权柄，还是属天的统治权。
    reason: 保留κυριότης所指对象的词义与神学歧义。
  - marker: c
    text: “荣耀者”很可能指有荣耀的属天存在，或特指天使；原文也可理解为“众荣耀”。
    reason: 说明δόξας可能的具体所指，同时不在正文中消除原文的含混性。
lexical_decisions:
- source_word: μάλιστα
  choice: 尤其是
  rationale: 承接上文的审判对象，突出本节所说的一类人。
- source_word: ὀπίσω σαρκὸς
  choice: 顺从肉体
  rationale: 保留“肉体”这一具有道德含义却仍带隐喻性的关键词；“顺从”自然表达跟随其后的行为取向，避免直接解释成“罪性”。
- source_word: ἐν ἐπιθυμίᾳ μιασμοῦ
  choice: 怀着污秽欲望
  rationale: 表达欲望在本语境中的负面性质，同时以脚注保留属格可理解为“贪恋污秽”的可能。
- source_word: πορευομένους
  choice: 而行
  rationale: 在现代汉语中简洁表达持续的行事方式，并与“顺从肉体”自然搭配。
- source_word: κυριότητος
  choice: 主权
  rationale: 保留“统治、作主、权柄”的语义范围，不在正文中断定是一般权柄、主的权柄，还是属天界的统治权。
- source_word: καταφρονοῦντας
  choice: 轻蔑
  rationale: 传达主动鄙视、不把对象放在眼里的强烈贬义。
- source_word: Τολμηταί
  choice: 胆大妄为
  rationale: 结合负面语境表达无所顾忌的狂妄，比中性的“勇敢”准确。
- source_word: αὐθάδεις
  choice: 任性自恃
  rationale: 体现固执、自我取悦和不受约束的自我意志。
- source_word: δόξας
  choice: 尊荣者
  rationale: 以指人的复数表达可能的有荣耀之属天存在，同时不在正文中明确译作“天使”。
- source_word: οὐ τρέμουσιν, βλασφημοῦντες
  choice: 毁谤尊荣者时竟毫不战兢
  rationale: 保留分词与主要动词的同时关系，并重现不因这项毁谤行为而畏惧战兢的强烈指责。
theological_decisions:
- issue: κυριότης所指的对象
  choice: 正文译作“主权”，不具体限定所指
  alternative: 权柄；主的权柄；属天的统治权
  rationale: 原词可指主权、统治权或作主的地位，本节没有明确说明其具体所指，因此不应加入较窄的教义判断。
- issue: δόξας所指的对象
  choice: 正文译作“尊荣者”，脚注说明很可能指有荣耀的属天存在
  alternative: 众荣耀；天使；有尊位者
  rationale: 下节提到天使，支持属天存在的理解，但本节使用较含混的δόξας，正文应保留其身份未明的张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“顺从肉体”“主权”“尊荣者”保留原文的重要词汇和含混处；“胆大妄为，任性自恃”再现希腊文短促、有力的并列指责。
