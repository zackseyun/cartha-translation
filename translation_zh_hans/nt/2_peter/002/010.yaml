  source_fidelity: 草稿总体准确地表达了本节针对一类受审判之人的限定，并保留了κυριότης和δόξας所指未完全确定的特点。不过，“顺从肉体、怀着污秽欲望而行”将ὀπίσω σαρκὸς与ἐν ἐπιθυμίᾳ μιασμοῦ拆开后关系略显松散；后者更直接是“贪恋／欲求污秽”。“主权”在现代汉语中较易指一个政体或国家的主权，不如“权柄”适合这里被轻蔑的统治性权威。
  naturalness: “顺从肉体……而行”与“怀着污秽欲望”连用略显书面拼接；“随从肉体、贪恋污秽而行”更自然，也更清楚呈现原文的修饰关系。“尊荣者”在现代汉语中不够惯用，且容易理解为受人尊敬的人；“荣耀者”较贴近δόξας的字面语义，同时仍不预断其具体身份。
