- from: 尤其是那些顺从肉体、怀着污秽欲望[a]而行，又轻蔑主权[b]的人。他们胆大妄为，任性自恃，毁谤尊荣者[c]时竟毫不战兢。
  to: 尤其是那些随从肉体、贪恋污秽[a]而行，又轻蔑权柄[b]的人。他们胆大妄为，任性自恃，毁谤荣耀者[c]时毫不战兢。
  rationale: 修订使汉语更自然，并更紧密对应希腊文：以“随从肉体、贪恋污秽而行”表达持续追随肉体及其不洁欲求；以“权柄”避免“主权”的现代政治语感；以“荣耀者”恢复δόξας的“荣耀”语义并保留其身份不明。句末仍以“毁谤……时毫不战兢”表达οὐ τρέμουσιν与βλασφημοῦντες的同时关系及原文强烈谴责的语气。
