  text: ἐλευθερίαν αὐτοῖς ἐπαγγελλόμενοι, αὐτοὶ δοῦλοι ὑπάρχοντες τῆς φθορᾶς· ᾧ γάρ τις ἥττηται, τούτῳ ⸀καὶ δεδούλωται.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/019.yaml
  text: promising them freedom while they themselves are slaves of corruption[a]; for whatever a person is overcome by[b], by this he is also enslaved.
translation:
  language: zh_hans
  text: 他们向人许诺自由，自己却是败坏[a]的奴隶；因为人被什么制伏，就也作了什么的奴隶。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “败坏”也可译作“毁坏”或“朽坏”；原词可兼指腐败的状态及其导致的毁灭。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλευθερίαν
  choice: 自由
  rationale: 直接表达不受辖制的状态，并与后文“奴隶”形成鲜明反差。
- source_word: ἐπαγγελλόμενοι
  choice: 许诺
  rationale: 保留该分词“作出承诺”的明确语义，而不弱化为“提供”或“宣称”。
- source_word: δοῦλοι
  choice: 奴隶
  rationale: 此处强调受辖制的身份；译作“奴隶”能保留与“自由”的强烈反讽，强于较温和的“仆人”。
- source_word: ὑπάρχοντες
  choice: 自己却是
  rationale: 以自然汉语表达他们实际所处的持续状态，并凸显其许诺与自身处境之间的反差。
- source_word: φθορᾶς
  choice: 败坏
  rationale: 该词在此兼有道德腐败及走向毁坏的意味；“败坏”可保留这种语义张力而不限定为单纯肉体朽坏或最终毁灭。
- source_word: ᾧ γάρ τις ἥττηται
  choice: 因为人被什么制伏
  rationale: 保留泛指的 τις 和完成时被动式所表达的被击败、受支配状态；“制伏”在现代汉语中也自然引出后文的奴役关系。
- source_word: τούτῳ καὶ δεδούλωται
  choice: 就也作了什么的奴隶
  rationale: 用对应结构承接“被什么制伏”，表达完成时被动式所产生并持续的奴役状态，同时在汉语中自然呈现工具或支配者关系。
theological_decisions:
- issue: 如何表达自由与受败坏辖制之间的对立
  choice: 采用“自由—奴隶—作了……的奴隶”这一组强烈对应的措辞
  alternative: 译为“自由—仆人—受……束缚”
  rationale: 经文的论证依赖假教师所许诺的自由与他们实际受败坏奴役之间的尖锐矛盾；较温和的词语会削弱这种神学与修辞力度。
- issue: φθορά在这里指道德败坏还是毁灭结局
  choice: 正文译“败坏”，脚注说明也含“毁坏”之意
  alternative: 只译“毁灭”或只译“腐化”
  rationale: 原词在本书语境中可涵盖腐败的性质及其毁灭性结果；不宜把这种张力单方面消解。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“他们向人许诺”避免连续两个“他们”造成指代生硬；“自己却是”清楚突出反讽。“被什么制伏，就也作了什么的奴隶”保留原文泛指格言式结构及“奴隶/被奴役”的词根呼应。
