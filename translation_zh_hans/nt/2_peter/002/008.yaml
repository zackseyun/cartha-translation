  text: βλέμματι γὰρ καὶ ἀκοῇ ⸀ὁ δίκαιος ἐγκατοικῶν ἐν αὐτοῖς ἡμέραν ἐξ ἡμέρας ψυχὴν δικαίαν ἀνόμοις ἔργοις ἐβασάνιζεν—
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/008.yaml
  text: for by what he saw and heard[a], that righteous man, living among them[c][b], was tormenting his righteous soul day after day with their lawless deeds—
translation:
  language: zh_hans
  text: 因为那义人住在他们中间，天天因所看见、所听见的那些不法行为，折磨自己那义的心灵[a][b]——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“天天因所看见、所听见的那些不法行为，折磨自己那义的心灵。”希腊文先提“所看、所听”，后提“不法的行为”，两者在句中的确切搭配可有不同理解。
    reason: lexical_alternative
  - marker: b
    text: “心灵”也可译作“灵魂”或“内在的自我”。这里着重指他里面所受的痛苦。
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέμματι … καὶ ἀκοῇ
  choice: 耳闻目睹
  rationale: 两个与感官知觉有关的与格并列，表示他所看见、所听见的事；“耳闻目睹”自然凝练，也保留视觉和听觉两方面。
- source_word: ὁ δίκαιος
  choice: 那义人
  rationale: 冠词加形容词作名词用，回指上一节的罗得；“那义人”简洁地保留回指和重复出现的“义”。
- source_word: ἐγκατοικῶν ἐν αὐτοῖς
  choice: 住在他们中间
  rationale: 分词表达持续居住在这些人当中；现代汉语用分句处理更自然。
- source_word: ἡμέραν ἐξ ἡμέρας
  choice: 天天
  rationale: 该惯用语表示日复一日、持续反复发生；“天天”清楚自然。
- source_word: ψυχὴν δικαίαν
  choice: 自己正义的心灵
  rationale: ψυχή在这里指人的内在生命或内在自我；“心灵”比容易被理解为独立实体的“灵魂”更贴合语境，同时保留修饰语“正义的”。
- source_word: ἀνόμοις ἔργοις
  choice: 那些不法的行为
  rationale: 保留ἄνομος的法律与道德色彩；“那些”按上下文指住在他周围之人的行为，而不在正文中额外加入希腊文没有明说的所有格。
- source_word: ἐβασάνιζεν
  choice: 使……饱受折磨
  rationale: 未将强烈的βασανίζω弱化为“忧伤”或“烦恼”；这一汉语使动表达传达主语因所见所闻而令自己的内心持续受煎熬，并与未完成时的持续意味相称。
theological_decisions:
- issue: ψυχή所涉及的人论含义
  choice: 译作“心灵”，指罗得内在的自我或生命
  alternative: “灵魂”或“内心”
  rationale: 本节描述的是内在的道德痛苦，并非对身体与灵魂关系作技术性界定；译文避免把经文解释成某种特定的人论体系。
- issue: 主动语态ἐβασάνιζεν与罗得所受痛苦的关系
  choice: 译作“使自己正义的心灵饱受折磨”
  alternative: “自己的正义心灵受尽折磨”
  rationale: 保留希腊文的主动构式及反身关系，不把它完全改写为被动，也不暗示罗得有意进行自我惩罚。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“耳闻目睹”使两个感官与格自然并列；保留两次“义”的呼应和句末破折号，以衔接上下文。
