id: 2PE.2.18
reference: 2 Peter 2:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὑπέρογκα γὰρ ματαιότητος φθεγγόμενοι δελεάζουσιν ἐν ἐπιθυμίαις σαρκὸς ἀσελγείαις τοὺς ⸀ὀλίγως ⸀ἀποφεύγοντας τοὺς ἐν πλάνῃ ἀναστρεφομένους,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/018.yaml
  text: For[a], speaking inflated words of emptiness, they entice by fleshly desires and sensuality those who are barely escaping from those who live in error[d][c][b],
translation:
  language: zh_hans
  text: 因为他们说着浮夸的空话[a]，借着肉体的欲望[b]和放荡[c]，引诱那些正勉强逃离生活在谬误中的人[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“夸口的空话”或“浮夸虚妄的话”。
    reason: lexical_alternative
  - marker: b
    text: “肉体的欲望”直译为“肉体的私欲”；这里的“肉体”用于道德意义，但译文保留原文的隐喻。
    reason: lexical_alternative
  - marker: c
    text: “放荡”也可能是对前面的“肉体的欲望”作进一步说明，可译作“借着肉体的欲望，即各种放荡行为”。
    reason: syntactical_ambiguity
  - marker: d
    text: “正勉强逃离”也可理解为“才刚刚逃离”。有些抄本作“确实已经逃离”。
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπέρογκα ματαιότητος
  choice: 夸张而空洞的话
  rationale: ὑπέρογκα表示夸大、浮夸或狂妄之物；与“说”连用时补出“话”符合汉语习惯。ματαιότητος说明这些话空洞、虚妄、毫无实质。
- source_word: φθεγγόμενοι
  choice: 说着
  rationale: 用现代汉语自然表达分词所描述的伴随方式，并保留持续发言的意味。
- source_word: δελεάζουσιν
  choice: 作诱饵，引诱
  rationale: 该动词本有以饵诱捕、引诱之意；这一表达既呈现其形象，也清楚传达其道德上的诱惑力。
- source_word: ἐν ἐπιθυμίαις σαρκὸς
  choice: 用肉体的欲望
  rationale: 将ἐν理解为手段；“肉体”保留σάρξ的隐喻，不把它扩大解释为某一系统性的神学概念。
- source_word: ἀσελγείαις
  choice: 放荡行为
  rationale: 该词指不受约束、无耻的放纵，且原文为复数；“放荡行为”比抽象的“放荡”更能体现其行为层面。
- source_word: ὀλίγως ἀποφεύγοντας
  choice: 正勉强逃离
  rationale: ὀλίγως在此可表示“勉强、几乎不能”，现在分词则表明逃离仍在进行中。
- source_word: τοὺς ἐν πλάνῃ ἀναστρεφομένους
  choice: 生活在谬误中之人
  rationale: ἀναστρεφομένους涉及生活方式或行事为人；πλάνη可指谬误、迷误或欺骗。“生活在谬误中”保留其持续状态。
theological_decisions:
- issue: σάρξ在道德语境中的含义
  choice: 译作“肉体的”，保留原文隐喻
  alternative: 属肉欲的；罪性所产生的
  rationale: 上下文涉及欲望与放荡，但原文并未直接使用“罪性”等系统神学术语；“肉体的欲望”保留原词的张力而不过度阐释。
- issue: 被引诱者逃离的状态
  choice: 译作“正勉强逃离”，不说明其逃离是否最终完成
  alternative: 刚刚逃离；确实已经逃脱
  rationale: ὀλίγως与现在分词共同描绘一种正在发生且处境不稳的逃离；译文不预先裁定这些人的最终属灵状态。
- issue: 被引诱者从谁那里逃离
  choice: 从“生活在谬误中之人”那里逃离
  alternative: 从谬误本身逃离
  rationale: 原文第二个τοὺς最自然地指一群人，作为ἀποφεύγοντας所支配的对象；因此保留“从……之人”逃离的句法关系。
- issue: ἀσελγείαις与“肉体的欲望”的关系
  choice: 并列呈现为引诱所用的手段
  alternative: 将“放荡行为”理解为对“肉体的欲望”的进一步说明
  rationale: 两个与格的确切关系存在一定歧义；正文采用自然的并列表达，脚注注明同位说明的可能性。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“作诱饵，引诱”保留δελεάζουσιν的诱捕意象；末尾用“生活在谬误中之人的人”虽略有重复，却能清楚保留原文两组人的句法关系，避免误读为从抽象的“谬误”逃离。
