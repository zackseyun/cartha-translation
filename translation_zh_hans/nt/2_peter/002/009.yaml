id: 2PE.2.9
reference: 2 Peter 2:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οἶδεν κύριος εὐσεβεῖς ἐκ πειρασμοῦ ῥύεσθαι, ἀδίκους δὲ εἰς ἡμέραν κρίσεως κολαζομένους τηρεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/009.yaml
  text: then the Lord knows how to rescue the godly from trial[a], and to keep the unrighteous under punishment until the day of judgment[b],
translation:
  language: zh_hans
  text: 主知道怎样救敬虔的人脱离试炼[a]，也知道怎样把不义的人留在刑罚之下，直到审判的日子[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“脱离试探”。希腊语原词既可指诱人犯罪的“试探”，也可指考验或患难的“试炼”；这里的上下文较支持“试炼”。
    reason: lexical_alternative
  - marker: b
    text: 或译“也把不义的人留下，等到审判的日子受刑罚”。希腊语分词既可理解为他们现今处在刑罚之下，也可理解为刑罚与将来的审判之日相联。
    reason: alternative_reading
lexical_decisions:
- source_word: οἶδεν
  choice: 知道怎样
  rationale: οἶδα与不定式连用，表达实际的能力或方法知识；“知道怎样”自然保留这一结构，并同时支配“救”和“留”。
- source_word: κύριος
  choice: 主
  rationale: “主”是现代汉语圣经语体中对κύριος自然、庄重且不额外限定所指的译法。
- source_word: εὐσεβεῖς
  choice: 敬虔的人
  rationale: 该形容词作名词用，指以敬畏、虔诚对待神为特征的人；“敬虔的人”比单说“虔诚人”更清楚地保留宗教伦理含义。
- source_word: ἐκ πειρασμοῦ
  choice: 脱离试炼
  rationale: πειρασμός可指试探或试炼；上文挪亚和罗得的例子着重人在患难与审判环境中蒙拯救，因此正文采用“试炼”，同时以脚注保留“试探”的可能。
- source_word: ῥύεσθαι
  choice: 救……脱离
  rationale: ῥύομαι表示从危险或困境中搭救；汉语“救……脱离”既自然，也准确呈现ἐκ所表达的脱离。
- source_word: ἀδίκους
  choice: 不义的人
  rationale: 保留ἄδικος的道德和司法色彩，也与本段关于审判的语境相符。
- source_word: εἰς ἡμέραν κρίσεως
  choice: 直到审判的日子
  rationale: 在τηρεῖν的结构中，εἰς指向未来的审判之日；“直到”自然表达被留存至该日的时间走向，但不排除“为那日而留”的理解。
- source_word: κολαζομένους
  choice: 留在刑罚之下
  rationale: 现在分词可描写持续处于受罚状态；“在刑罚之下”保留其进行或状态意味，同时避免对惩罚方式作额外说明。
- source_word: τηρεῖν
  choice: 留
  rationale: τηρέω在此有保留、拘守至未来时点之意；“留在……之下，直到……”在现代汉语中清楚自然。
theological_decisions:
- issue: πειρασμός在本段中的含义
  choice: 正文译为“试炼”
  alternative: “试探”
  rationale: 上下文回顾挪亚和罗得从灾难及恶劣环境中被救出的事，较支持外在试炼；但原词也可指引诱人犯罪的试探，因此脚注保留歧义。
- issue: κολαζομένους与τηρεῖν、εἰς ἡμέραν κρίσεως的关系
  choice: 译作现今“留在刑罚之下，直到审判的日子”
  alternative: “把不义的人留下，等到审判的日子受刑罚”
  rationale: 现在分词最直接地容许持续受罚的状态，而εἰς ἡμέραν κρίσεως指向将来的审判日；不过句法也可能把刑罚更紧密地联系到那日，故用脚注保留另一读法，不把经文扩展成完整的中间状态教义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“主知道怎样……也知道怎样……”明确呈现希腊语中一个主要动词支配两个不定式的平行结构；脚注保留πειρασμός及κολαζομένους的真实语义和句法张力。
