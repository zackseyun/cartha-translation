  text: ⸀συμβέβηκεν αὐτοῖς τὸ τῆς ἀληθοῦς παροιμίας· Κύων ἐπιστρέψας ἐπὶ τὸ ἴδιον ἐξέραμα, καί· Ὗς λουσαμένη εἰς ⸀κυλισμὸν βορβόρου.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/022.yaml
  text: 'What the true proverb says has happened to them: “A dog returns to its own vomit,” and[b][a], “A washed sow returns to wallowing in the mud.”'
translation:
  language: zh_hans
  text: 真实的谚语所说的话，已经应验在他们身上：“狗回到自己所吐之物那里”[a]；又说：“洗净了的母猪，又回到泥里打滚。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 第一句呼应《箴言》26:11。原文较直译为：“狗回到自己所吐之物那里；洗净了的母猪，回到泥中打滚。”
    reason: cross_reference_and_formal_rendering
lexical_decisions:
- source_word: συμβέβηκεν αὐτοῖς
  choice: 已经应验在他们身上
  rationale: 完成时表达已经发生并持续成立的状态；结合谚语内容，“应验在他们身上”自然地传达该谚语在这些人身上成为事实，但不额外扩展其神学含义。
- source_word: τὸ τῆς ἀληθοῦς παροιμίας
  choice: 那句真实的谚语所说的
  rationale: 原文结构有所省略；此译法保留“真实的谚语”及其所说内容，同时使现代汉语通顺。
- source_word: Κύων ἐπιστρέψας ἐπὶ τὸ ἴδιον ἐξέραμα
  choice: 狗转身回到自己所吐的东西那里
  rationale: 保留ἐπιστρέψας的“转身、返回”意象、ἴδιον的“自己的”，以及与《箴言》26:11的呼应；“所吐的东西”比名词“呕吐物”更自然。
- source_word: Ὗς λουσαμένη
  choice: 母猪洗净了
  rationale: Ὗς在此为阴性单数，译作“母猪”保留这一细节；λουσαμένη可理解为洗过或被洗净，简洁译作“洗净了”而不强定施事者。
- source_word: εἰς κυλισμὸν βορβόρου
  choice: 又回去在泥里打滚
  rationale: κυλισμός表示翻滚、打滚，βόρβορος表示泥泞或污泥；补出原文省略但语意所含的返回动作，使汉语完整并保持两个谚语的平行。
theological_decisions:
- issue: 省略式谚语引文如何应用于假教师
  choice: 表明谚语所说的情形已经在他们身上成为事实
  alternative: 直译为“真实谚语的话已经发生在他们身上”
  rationale: 译文保留复归旧态的警告意象，不据此添加有关其先前属灵状态或最终救恩状况的教义判断。
- issue: λουσαμένη的语态含义
  choice: 译作“洗净了”，不明说母猪是自己洗的还是被人洗的
  alternative: “洗过澡的母猪”或“自己洗过的母猪”
  rationale: 中间／被动形式在此不要求明确施事者；保持开放可避免超出原文。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“应验在他们身上”符合谚语应用语境；两则引语补足汉语所需的谓语和返回动作，同时脚注保留原文省略式结构。主文中的脚注标记与脚注一致。
