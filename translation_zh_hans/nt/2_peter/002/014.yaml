  edition: SBLGNT
  text: ὀφθαλμοὺς ἔχοντες μεστοὺς μοιχαλίδος καὶ ⸀ἀκαταπαύστους ἁμαρτίας, δελεάζοντες ψυχὰς ἀστηρίκτους, καρδίαν γεγυμνασμένην πλεονεξίας ἔχοντες, κατάρας τέκνα,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/014.yaml
  text: having eyes full of an adulteress and insatiable for sin, enticing unstable souls, having a heart trained in greed, children of a curse,
translation:
  language: zh_hans
  text: 他们眼中充满淫妇[a]，犯罪不止[b]；他们引诱不坚定的人，他们的心在贪婪上受过操练。他们是咒诅之子[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译是“眼睛充满淫妇”；也可按意思译作“满眼淫乱”或“满眼淫欲”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“不能停止犯罪”或“不断犯罪”；有人解释为“对罪贪得无厌”。
    reason: lexical_alternative
  - marker: c
    text: “咒诅之子”是形象说法，指为咒诅所标志或处在咒诅之下的人。
    reason: idiom_clarification
lexical_decisions:
- source_word: μεστοὺς μοιχαλίδος
  choice: 满眼都是淫妇
  rationale: 希腊文直译为“眼睛充满一个淫妇”。中文用“满眼都是淫妇”保留具体、尖锐的单数集合式意象，同时比生硬的“充满淫妇的眼睛”更自然。
- source_word: ἀκαταπαύστους ἁμαρτίας
  choice: 犯罪从不止息
  rationale: 该短语表达“不停止犯罪”的持续状态。此译法贴近希腊文，并避免把它过度解释为对罪“贪得无厌”；原文在语法上修饰“眼睛”，中文则按自然表达落实到这些人的行为。
- source_word: δελεάζοντες
  choice: 引诱
  rationale: 该动词有用饵诱捕、诱骗的意味；“引诱”在现代中文中自然，也保留其掠夺性和道德危险。
- source_word: ψυχὰς ἀστηρίκτους
  choice: 意志不坚定的人
  rationale: ψυχαί在这里指人，而非专指与身体相对的灵魂；ἀστήρικτοι指未得坚固、容易动摇。译作“意志不坚定的人”清楚呈现其易受诱惑的处境。
- source_word: καρδίαν γεγυμνασμένην πλεονεξίας
  choice: 心里早已受过贪婪的操练
  rationale: 完成时分词γεγυμνασμένην含有经过训练而形成状态的意思；“受过……操练”保留训练意象，“早已”体现既成结果。πλεονεξία译为现代通行的“贪婪”。
- source_word: κατάρας τέκνα
  choice: 咒诅之子
  rationale: 保留“……之子”的闪族式表达，表示他们为咒诅所标志并落在咒诅之下；脚注说明其含义，避免读者误解为字面血缘。
theological_decisions:
- issue: 是否淡化μοιχαλίδος的具体性意象
  choice: 正文保留“淫妇”的具体意象
  alternative: 译作“淫乱”或“淫欲”
  rationale: 原文使用阴性单数名词“淫妇”，措辞刻意鲜明。正文不将其抽象化，脚注列出解释性译法。
- issue: 如何理解ἀκαταπαύστους ἁμαρτίας
  choice: 译作“犯罪从不止息”
  alternative: 译作“对罪贪得无厌”
  rationale: 前者更直接反映“不停止”的词义，也不把持续犯罪进一步解释为无法满足的欲望；脚注保留另一种可能理解。
- issue: κατάρας τέκνα所表达的咒诅关系
  choice: 保留“咒诅之子”而不具体断定咒诅的机制
  alternative: 译作“该受咒诅的人”或“处在咒诅之下的人”
  rationale: 属格结构可表达被咒诅所刻画或归于咒诅。保留原有隐喻可避免把其神学含义压缩为单一解释。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。保留原文连续谴责的力度及“操练”“咒诅之子”等意象；为避免中文长串分词结构晦涩，分成两个句子，并以分号呈现前半节的递进关系。
