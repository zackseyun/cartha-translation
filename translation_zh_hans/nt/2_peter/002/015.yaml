    rationale: τῇ ὁδῷ τοῦ Βαλαὰμ是道德行为模式的道路隐喻。译为“巴兰的道路”既保留原文措辞，也避免不必要的物理化理解。
  - severity: low
    issue: “贪爱”比原文“爱”略强。
    rationale: 上下文确实具有不正当牟利的贬义，但ἠγάπησεν本身是“爱”。用“爱”更直接，并让“不义的工价”自身承载负面评价。
