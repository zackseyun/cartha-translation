  naturalness: “走迷了”在现代汉语中可用，但“就走迷了，跟从了……所走的路”在庄重经文语体中略显口语且逻辑次序不够清楚。改为“走迷了，随从……的道路”更自然，也更贴近原文重复ὁδός的表达。
  terminology: “正直的道路”“不义的工价”均可接受；“波梭之子巴兰”比“波梭的儿子巴兰”更符合庄重、清晰的中文经文语序。将“贪爱”改为“爱”可直接反映ἠγάπησεν，且不额外强化原词的贪婪语气。脚注内容准确，锚点应紧邻“波梭”。
