  text: ⸀καταλιπόντες εὐθεῖαν ὁδὸν ἐπλανήθησαν, ἐξακολουθήσαντες τῇ ὁδῷ τοῦ Βαλαὰμ τοῦ ⸀Βοσὸρ ὃς μισθὸν ἀδικίας ἠγάπησεν
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/015.yaml
  text: Having abandoned the straight way[a], they went astray, having followed the way of Balaam son of Bosor[b], who loved the wages of unrighteousness.
translation:
  language: zh_hans
  text: 他们离弃正直的道路，走迷了，随从波梭之子巴兰[a]的道路；巴兰爱不义的工价。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “波梭”是希腊文本中的名字形式；旧约通常称巴兰为“比珥的儿子”。
    reason: 说明希腊文本Βοσόρ与旧约常见名字“比珥”的差异。
lexical_decisions:
- source_word: καταλιπόντες
  choice: 离弃了
  rationale: 该词表示舍下、抛弃；此处带有主动背离正道的意味。“离弃”既保留其道德分量，也符合庄重而自然的现代汉语。
- source_word: εὐθεῖαν ὁδὸν
  choice: 正直的道路
  rationale: εὐθύς本义为“直”，在道路隐喻中兼有正直、正确之意。“正直的道路”保留具体的道路意象及道德含义。
- source_word: ἐπλανήθησαν
  choice: 走迷了
  rationale: 此处可作不及物或被动意义理解。“走迷了”不强加一个外在误导者，并与上下文的道路隐喻自然衔接。
- source_word: ἐξακολουθήσαντες
  choice: 跟从了
  rationale: 该不定过去分词说明与主句密切相连的行动，可理解为伴随或导致他们迷失的行动。汉语用并列的“跟从了”保持这种关系，不把句法限定得过死。
- source_word: τῇ ὁδῷ
  choice: 所走的路
  rationale: 保留ὁδός的道路隐喻；加“所走的”使“跟从某人的路”在现代汉语中更自然。
- source_word: τοῦ Βαλαὰμ τοῦ Βοσὸρ
  choice: 波梭的儿子巴兰
  rationale: 按希腊文本保留Βοσόρ的音译“波梭”，并将连续属格自然表达为父子关系；巴兰采用中文圣经传统通行译名。
- source_word: μισθὸν ἀδικίας
  choice: 不义的工价
  rationale: “工价”保留μισθός作为报酬、酬金的含义，也传达借不义获利的负面意味；“不义”保留ἀδικία的道德和神学分量。
- source_word: ἠγάπησεν
  choice: 贪爱
  rationale: 原词直译为“爱”；宾语是不义的工价，汉语“贪爱”自然显出对不正当报酬的强烈欲求，而不改变其核心含义。
theological_decisions:
- issue: εὐθεῖαν ὁδὸν与τῇ ὁδῷ的道德道路意象
  choice: 以“正直的道路”和“所走的路”保留道路意象
  alternative: 正道；正确的生活方式
  rationale: 原文重复ὁδός，以道路描绘道德和属灵方向。保留这一意象可避免把原文提前解释为抽象教义或一般生活方式。
- issue: Βοσόρ的识别
  choice: 正文依希腊文本译作“波梭”，脚注说明旧约通常作“比珥”
  alternative: 正文直接写“比珥”
  rationale: SBLGNT正文为Βοσόρ，原文优先要求正文反映该形式；但民数记中的人物通常称“比珥的儿子巴兰”，因此以脚注帮助读者辨认并保持文本透明。
- issue: ἐξακολουθήσαντες与ἐπλανήθησαν的关系
  choice: 译作“就走迷了，跟从了……”
  alternative: 因跟从……而走迷了；走迷了之后跟从……
  rationale: 希腊语分词可表示伴随行动，也可能带方式或原因色彩。并列式汉语保留这种开放性，避免把关系只限定为原因或严格的先后次序。
translation_notes:
  register: 采用现代、庄重、易懂的标准普通话。句式保留原文的道路隐喻和分词关系，同时避免生硬照搬希腊语结构；“正直的道路”“走迷了”“不义的工价”维持经文应有的道德力度。
