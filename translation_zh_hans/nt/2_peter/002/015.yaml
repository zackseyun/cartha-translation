revisions:
- from: 他们离弃了正直的道路，就走迷了，跟从了波梭的儿子巴兰[a]所走的路；这巴兰贪爱不义的工价。
  to: 他们离弃正直的道路，走迷了，随从波梭之子巴兰[a]的道路；巴兰爱不义的工价。
  rationale: 修订消除“就”所引入的较强结果关系，保留原文连续分词和主句的开放关联；以“巴兰的道路”准确维持重复的道路隐喻；并将“贪爱”收回为与ἠγάπησεν相应的“爱”。脚注仍忠实说明希腊文Βοσόρ与旧约常见“比珥”之间的名称差异，且锚点置于“波梭之子巴兰”这一相关名称短语内。
