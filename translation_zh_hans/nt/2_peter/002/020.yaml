id: 2PE.2.20
reference: 2 Peter 2:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἰ γὰρ ἀποφυγόντες τὰ μιάσματα τοῦ κόσμου ἐν ἐπιγνώσει τοῦ ⸀κυρίου καὶ σωτῆρος Ἰησοῦ Χριστοῦ τούτοις δὲ πάλιν ἐμπλακέντες ἡττῶνται, γέγονεν αὐτοῖς τὰ ἔσχατα χείρονα τῶν πρώτων.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/020.yaml
  text: For if[a], after escaping the defilements of the world through the knowledge of the Lord and Savior Jesus the Messiah, they are again entangled in these things and overcome[b], the last state has become worse for them than the first.
translation:
  language: zh_hans
  text: 因为他们若借着认识主和救主耶稣基督，逃脱了世上的污秽，后来却又被这些事缠住、制伏，那么他们末后的景况就比先前更糟了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποφυγόντες
  choice: 逃脱了
  rationale: 不定过去时分词表示相对于再次被缠住而言在先的行动；中文语序已自然体现先后，无须机械添加“之后”。
- source_word: τὰ μιάσματα τοῦ κόσμου
  choice: 世上的污秽
  rationale: μίασμα指造成玷污或污染之物；“污秽”保留其道德与沾染意味，也符合现代中文圣经语体。
- source_word: ἐν ἐπιγνώσει
  choice: 借着认识
  rationale: 此处ἐν可表达途径或凭借；ἐπίγνωσις译作“认识”，不额外断定其必然指得救的认识或仅是外在知识。
- source_word: τοῦ κυρίου καὶ σωτῆρος Ἰησοῦ Χριστοῦ
  choice: 主和救主耶稣基督
  rationale: 两个头衔共同修饰耶稣；中文惯用“耶稣基督”，其中“基督”仍保留受膏者的称号背景，表达自然庄重。
- source_word: τούτοις δὲ πάλιν ἐμπλακέντες
  choice: 后来却又被这些事缠住
  rationale: “这些事”回指世上的污秽；“缠住”保留ἐμπλέκω所含陷入网罗、难以脱身的形象，“却又”体现转折和重复。
- source_word: ἡττῶνται
  choice: 制伏
  rationale: 该动词指被击败、压倒或辖制；“制伏”与被缠住的被动处境相合，并保留道德属灵层面的受制意味。
- source_word: γέγονεν αὐτοῖς τὰ ἔσχατα χείρονα τῶν πρώτων
  choice: 他们末后的景况就比先前更糟了
  rationale: 完成时表达已经形成并持续的结果；“末后的景况”自然传达τὰ ἔσχατα所指的后来或最终处境，而不擅自限定为末世结局。
theological_decisions:
- issue: “认识”是否必然表示使人得救的认识
  choice: 仅译为“认识”，不加“真正”“得救的”或“表面的”等限定
  alternative: 译成“充分认识”，或解释为“得救的认识”/“仅有外在认识”
  rationale: ἐπίγνωσις本身不足以裁定这里的人是否曾重生；译文保留经文所具有的神学张力。
- issue: Χριστοῦ在中文中的表达
  choice: 基督
  alternative: 弥赛亚
  rationale: “基督”是现代中文中对Χριστός自然、庄重且广为理解的传统译法，在“耶稣基督”中既可作称号，也不会强行判定其已完全姓名化。
- issue: “末后的景况”是否指终末审判
  choice: 保留为一般性的末后处境
  alternative: 明确译作“最终结局”或“受审判的结局”
  rationale: 上下文强调后来处境比先前更糟，但本句没有明确把τὰ ἔσχατα限定为末世审判，因此不作扩充。
translation_notes:
  register: 采用现代标准普通话的庄重书面语。句式保持因果条件结构，并用“后来却又”清楚呈现逃脱之后再次陷入的反转；不加入原文没有的“我们的”。
