id: JUD.1.9
reference: Jude 1:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ δὲ Μιχαὴλ ὁ ἀρχάγγελος, ὅτε τῷ διαβόλῳ διακρινόμενος διελέγετο περὶ τοῦ Μωϋσέως σώματος, οὐκ ἐτόλμησεν κρίσιν ἐπενεγκεῖν βλασφημίας, ἀλλὰ εἶπεν· Ἐπιτιμήσαι σοι κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/009.yaml
  text: But Michael the archangel[a], when he was disputing with the devil and arguing about Moses' body, did not dare to bring a slanderous judgment against him, but said[b], “May the Lord rebuke you.”
translation:
  language: zh_hans
  text: 可是，天使长米迦勒[a]与魔鬼争执、就摩西的身体辩论时，不敢对他作出带有毁谤意味的判决[b]，只说：“愿主责备你！”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “天使长”也可译作“首领天使”。
    reason: lexical_alternative
  - marker: b
    text: 也可按传统译为“对他提出辱骂性的控告”。这里的希腊文短语可指带有辱骂或毁谤性质的判决／控告，具体含义有争议。
    reason: lexical_alternative
  - marker: c
    text: 这句话呼应《撒迦利亚书》3:2，那里是主责备撒但。
    reason: cross_reference
lexical_decisions:
- source_word: ἀρχάγγελος
  choice: 天使长
  rationale: 这是现代汉语中通行而清楚的称号，表达居首或统领地位的天使，不额外引入具体的天使等级体系。
- source_word: διαβόλῳ
  choice: 魔鬼
  rationale: 此处指作为位格性超自然敌对者的διάβολος；“魔鬼”是现代汉语圣经语境中自然、明确的称呼。
- source_word: διακρινόμενος
  choice: 争辩
  rationale: 在本语境中表示彼此争执、抗辩；与下一个动词分别译出，以保留原文两个相关但不完全重合的动作。
- source_word: διελέγετο
  choice: 辩论
  rationale: 未完成时态呈现持续的言语交锋；“辩论”既保留言语互动，也符合这里的对抗语气。
- source_word: περὶ τοῦ Μωϋσέως σώματος
  choice: 为摩西的身体
  rationale: “为”在汉语中自然表达争论所围绕的对象或事项；“摩西的身体”保留具体所指及属格关系。
- source_word: οὐκ ἐτόλμησεν
  choice: 尚且不敢
  rationale: “不敢”直接表达τολμάω的敢于或擅自之意；“尚且”在上下文中突出米迦勒也有所克制的对比，且未改变命题内容。
- source_word: κρίσιν ἐπενεγκεῖν βλασφημίας
  choice: 对他作出毁谤性的判决
  rationale: 该短语句法和语义存在争议。“作出……判决”保留κρίσις与ἐπιφέρω的司法色彩，“毁谤性的”让βλασφημίας描述该判决或谴责的性质，同时避免误导为米迦勒正在亵渎上帝。传统的另一种理解收入脚注。
- source_word: Ἐπιτιμήσαι σοι κύριος
  choice: 愿主责备你
  rationale: 不定过去时祈愿式表达愿望或诉诸主来施行斥责；“愿”在现代汉语中明确传达这一语气。
- source_word: κύριος
  choice: 主
  rationale: 采用κύριος的通行译法，保持庄重并自然呼应《撒迦利亚书》3:2。
theological_decisions:
- issue: 米迦勒面对魔鬼时所表现的克制
  choice: 米迦勒没有自行对魔鬼作出毁谤性的判决，而是诉诸主的责备。
  alternative: 可理解为米迦勒不敢以辱骂性的控告谴责魔鬼，或不敢作出带有亵渎性质的判断。
  rationale: κρίσιν ... βλασφημίας的确切关系有争议。正文保留清楚的对比：米迦勒不自行宣判，而诉诸主；不据此建立更细致的天使论，也不消除短语本身的张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“争辩、辩论”保留原文两个相邻动词；“作出毁谤性的判决”保留司法语感及原文的解释张力。所有脚注标记均置于正文对应位置。
