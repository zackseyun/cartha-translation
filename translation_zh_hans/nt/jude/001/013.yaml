  text: κύματα ἄγρια θαλάσσης ἐπαφρίζοντα τὰς ἑαυτῶν αἰσχύνας, ἀστέρες πλανῆται οἷς ὁ ζόφος τοῦ σκότους εἰς αἰῶνα τετήρηται.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/013.yaml
  text: wild waves of the sea[a], foaming up their own shames; wandering stars[b], for whom the gloom of darkness has been reserved forever.
translation:
  language: zh_hans
  text: 是狂暴的海浪[a]，翻腾着自己的羞耻；是漂泊的星，为他们永远保留的，是幽暗的黑暗[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“翻腾出自己的可耻行为。”这里的动词含有“起泡、翻腾”的意象。希腊文“羞耻”使用复数，既可指耻辱本身，也可指暴露他们的可耻行为。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“黑暗的幽暗”或“漆黑的幽暗”。
    reason: lexical_alternative
lexical_decisions:
- source_word: κύματα ἄγρια θαλάσσης
  choice: 海中狂暴的浪
  rationale: 保留“海—浪—狂暴”的鲜明意象；“狂暴”自然传达ἄγρια的野性和猛烈之意。
- source_word: ἐπαφρίζοντα
  choice: 翻涌出
  rationale: 该现在分词描写浪不断泛起泡沫、把东西涌出的动态；结合宾语“羞耻”，“翻涌出”在中文中较自然，也保留海浪意象。
- source_word: τὰς ἑαυτῶν αἰσχύνας
  choice: 自己的羞耻
  rationale: αἰσχύνας为复数，可指羞耻、丑事或可耻行为；汉语通常以集合性单数“羞耻”表达，避免武断限定为行为，同时保留ἑαυτῶν的强调。
- source_word: ἀστέρες πλανῆται
  choice: 漂泊的星
  rationale: πλανῆται表示游移、飘荡；“漂泊的星”保留比喻及不循固定轨迹的意味，又不引入现代天文学中“行星”的技术含义。
- source_word: οἷς
  choice: 为他们
  rationale: 关系代词虽承接“星”，实际所指是前文被比喻的人，因此使用人格化的“他们”。
- source_word: ὁ ζόφος τοῦ σκότους
  choice: 幽暗的黑暗
  rationale: 保留原文两个黑暗词语叠加形成的强化表达；“幽暗”传达ζόφος所含的阴沉、深暗之感。
- source_word: εἰς αἰῶνα
  choice: 永远
  rationale: 在审判语境中自然表达持续无尽的时间意味，不额外扩展其教义内涵。
- source_word: τετήρηται
  choice: 留存
  rationale: 完成时被动式表示已经被保留并仍处于留存状态；配合“为他们”，“留存”兼顾τηρέω的保留义和庄重语体。
theological_decisions:
- issue: εἰς αἰῶνα所表达的审判持续时间
  choice: 译作“永远”
  alternative: 译作“直到永世”或“直到那世代”
  rationale: 在本段审判意象中，“永远”最自然地传达该短语的持续性和严肃性，同时不添加原文以外的教义说明。
- issue: αἰσχύνας是羞耻状态还是可耻行为
  choice: 正文保留为“羞耻”
  alternative: 译作“丑事”或“可耻的行为”
  rationale: 原词可指羞耻、耻辱，也可转指招致羞耻的行为；正文不消解这种歧义，脚注说明可能范围。
translation_notes:
  register: 采用现代、庄重而富有诗性意象的普通话。两个并列隐喻都补出“是”，使本节作为前文人物描写的一部分在中文中读来完整；保留海浪翻涌和星体漂泊的强烈画面，并以脚注保存关键词义歧义。
