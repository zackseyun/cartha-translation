source:
  edition: SBLGNT
  text: Ὁμοίως μέντοι καὶ οὗτοι ἐνυπνιαζόμενοι σάρκα μὲν μιαίνουσιν, κυριότητα δὲ ἀθετοῦσιν, δόξας δὲ βλασφημοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/008.yaml
  text: Yet in the same way, these people also, relying on dreams, defile the flesh, reject authority, and slander glorious ones.
translation:
  language: zh_hans
  text: 然而，这些人也同样倚仗梦境[a]，玷污肉体，拒绝权柄，毁谤尊荣者[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“做梦”。希腊文分词可作较为直译的理解；这里也可能表示他们以梦境作为自己行为的依据。
    reason: lexical_alternative
  - marker: b
    text: “尊荣者”很可能指有尊荣的天上存在，也许是天使；希腊文为复数，直译为“荣耀”。
    reason: alternative_reading
lexical_decisions:
- source_word: Ὁμοίως μέντοι
  choice: 尽管如此……也照样
  rationale: “照样”保留ὁμοίως与上文例证的类比关系，“尽管如此”体现μέντοι轻微的转折意味，组合起来符合现代汉语表达。
- source_word: οὗτοι
  choice: 这些人
  rationale: 指上下文所说混入群体的人；“这些人”自然明确，也不额外限定性别。
- source_word: ἐνυπνιαζόμενοι
  choice: 倚仗梦境
  rationale: 分词可能说明他们行为的依据或伴随状态。“倚仗梦境”表达较可能的语境含义，同时以脚注保留较形式对应的“做梦”译法。
- source_word: σάρκα
  choice: 肉体
  rationale: 保留σάρξ的具体用语及其道德语境，不将其窄化为“身体”，也不引入“罪性”等神学解释。
- source_word: μιαίνουσιν
  choice: 玷污
  rationale: 兼具礼仪与道德上的污秽含义，也符合本节严肃的谴责语气。
- source_word: κυριότητα
  choice: 权柄
  rationale: 可指主权、统治权或权威；“权柄”在此保留其指向神、天上权势或一般权威的开放性。
- source_word: ἀθετοῦσιν
  choice: 拒绝
  rationale: 简洁表达弃绝、不予承认的强烈含义。
- source_word: δόξας
  choice: 尊荣者
  rationale: 希腊文直译为复数的“荣耀”，语境中很可能指具有荣耀的天上存在。“尊荣者”既适合指位格性的对象，又未直接限定为天使。
- source_word: βλασφημοῦσιν
  choice: 毁谤
  rationale: 表达以侮辱、诋毁的话攻击对象；较“亵渎”更不易让现代读者误以为对象只能是神。
theological_decisions:
- issue: δόξας所指的对象
  choice: 以“尊荣者”宽泛指称具有尊荣的存在
  alternative: 天使；天上的威荣者；抽象意义的荣耀
  rationale: 下一节提到天使长米迦勒，使天上存在成为较可能的理解，但δόξας本身并未明确说“天使”，因此正文不进一步限定，脚注说明其可能含义。
- issue: ἐνυπνιαζόμενοι的语力
  choice: 译作“倚仗梦境”，理解为梦境与其行为依据有关
  alternative: 做梦；在梦中；作梦的人
  rationale: 分词在句中可能说明他们行为的依据或方式；正文采用较符合语境的解释，但脚注保留形式上更直接的译法，避免掩盖歧义。
- issue: κυριότητα的具体所指
  choice: 保留为“权柄”
  alternative: 主权；主的权柄；天使的统治权
  rationale: 该词的所指在本节并不完全明确；宽泛译法避免武断认定为基督的主权、天使权势或人间权威。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“尽管如此……也照样”连接上文并保留转折；三个并列动词保持原文紧凑、强烈的谴责节奏。
