id: JUD.1.17
reference: Jude 1:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ὑμεῖς δέ, ἀγαπητοί, μνήσθητε τῶν ῥημάτων τῶν προειρημένων ὑπὸ τῶν ἀποστόλων τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/017.yaml
  text: But you[a], beloved, remember the words spoken beforehand by the apostles of our Lord Jesus the Messiah.
translation:
  language: zh_hans
  text: 可是，亲爱的弟兄姊妹，你们要记得我们主耶稣基督[a]的使徒从前说过的话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “基督”意为“弥赛亚”，即“受膏者”。
    reason: 说明Χριστός的称号含义及通行中文译名。
lexical_decisions:
- source_word: Ὑμεῖς δέ
  choice: 可是……你们
  rationale: 用“可是”表达δέ承接上文的对比，并明确译出带强调意味的主语Ὑμεῖς；中文语序自然。
- source_word: ἀγαπητοί
  choice: 亲爱的弟兄姊妹
  rationale: 这是带有亲切意味的复数呼语；此译法在现代中文书信语境中自然、庄重，也明确包含整个信徒群体。
- source_word: μνήσθητε
  choice: 要记得
  rationale: 准确表达不定过去时命令式在此发出的直接劝告，即回想并牢记先前领受的教导。
- source_word: τῶν ῥημάτων τῶν προειρημένων
  choice: 从前说过的话
  rationale: 保留ῥήματα所指的言语，以及προειρημένων表示的先前已说；避免译成“预言”，以免把一般的预先警告限缩为预告未来。
- source_word: ὑπὸ τῶν ἀποστόλων
  choice: 使徒……说过
  rationale: 以中文主动表达自然呈现希腊文被动结构中的施事者；“使徒”是ἀπόστολοι通行且符合语境的译法。
- source_word: τοῦ κυρίου ἡμῶν
  choice: 我们主……的
  rationale: 保留共同归属意味，并按中文习惯把“我们主”置于完整名号之前。
- source_word: Ἰησοῦ Χριστοῦ
  choice: 耶稣基督
  rationale: “耶稣基督”是现代中文最通行、最自然的固定表达；脚注说明“基督”的称号含义，避免读者把它误当作姓氏。
theological_decisions:
- issue: Χριστοῦ在“Ἰησοῦ Χριστοῦ”中的称号含义
  choice: 正文译作“基督”，脚注说明意为“弥赛亚”
  alternative: 正文译作“弥赛亚耶稣”或“耶稣弥赛亚”
  rationale: “基督”在中文基督教语境中已是此希腊称号的标准形式，与“耶稣”连用最自然；脚注保留其“弥赛亚／受膏者”的称号意义，不把它处理成普通姓氏。
translation_notes:
  register: 采用现代、庄重而易懂的书信语体。“亲爱的弟兄姊妹”自然表达复数呼语；“从前说过”保留时间先后而不额外强化为预言。
