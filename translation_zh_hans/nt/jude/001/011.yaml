base_translation:
  language: en
  yaml_path: translation/nt/jude/001/011.yaml
  text: Woe to them[a], because they have walked in the way of Cain, and have poured themselves out for pay into Balaam’s error, and have perished in Korah’s rebellion.
translation:
  language: zh_hans
  text: 他们有祸了！因为他们走上了该隐的道路；又为了报酬，一头冲进巴兰的谬误[a]；还在可拉的反叛中灭亡了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“又为了利益，鲁莽地投身于巴兰的谬误。”原文动词字面有“倾倒、倾泻”之意，在此按语境可指不顾一切地投身或冲入。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐαὶ αὐτοῖς
  choice: 他们有祸了
  rationale: 保留先知式宣告审判的力度；比“他们真可悲”更准确，也符合现代中文圣经语体。
- source_word: τῇ ὁδῷ τοῦ Κάϊν ἐπορεύθησαν
  choice: 他们走上了该隐的道路
  rationale: ὁδός在这里比喻行为方式；“走上……道路”既保留行走意象，也自然表达效法该隐的行径。
- source_word: τῇ πλάνῃ τοῦ Βαλαὰμ
  choice: 陷入巴兰的谬误
  rationale: πλάνη可指错误、迷惑或偏离正道；“谬误”保留其认知与道德层面的开放性，“陷入”则使其与运动性动词自然衔接。
- source_word: μισθοῦ
  choice: 为了报酬
  rationale: 表示工资、酬劳或利益；“报酬”清楚凸显逐利动机，又不把含义限缩为固定工资。
- source_word: ἐξεχύθησαν
  choice: 倾注自己
  rationale: 保留“被倾倒、倾泻”的鲜明隐喻，并按语境表达投身其中、自我放任之意；因中文略显凝缩，脚注提供更顺畅的意译。
- source_word: τῇ ἀντιλογίᾳ τοῦ Κόρε
  choice: 在可拉的反叛中
  rationale: ἀντιλογία可指反驳、对抗或反叛；结合《民数记》16章的典故，“反叛”最能传达具体事件，同时不额外引入宗派解释。
- source_word: ἀπώλοντο
  choice: 灭亡了
  rationale: 准确表达毁灭、丧亡的结果，语气庄重，并保留希腊文过去时所呈现的确定性。
- source_word: Κάϊν / Βαλαὰμ / Κόρε
  choice: 该隐／巴兰／可拉
  rationale: 采用现代简体中文圣经传统中通行的人名译法，便于读者辨认旧约典故。
theological_decisions:
- issue: 如何翻译压缩而多义的短语 τῇ πλάνῃ τοῦ Βαλαὰμ μισθοῦ ἐξεχύθησαν
  choice: 又为了报酬，倾注自己，陷入巴兰的谬误
  alternative: 又为了利益，一头冲进巴兰的谬误
  rationale: 正文尽量保留ἐξεχύθησαν“倾倒、倾泻”的意象，以及μισθοῦ所指出的逐利动机，不将难解隐喻完全化为解释；脚注则给出更自然、侧重鲁莽奔赴之意的译法。
- issue: ἀντιλογία在可拉典故中的含义
  choice: 反叛
  alternative: 抗争／顶撞
  rationale: 《民数记》16章的背景支持群体性反叛之义；但译文不进一步规定其教义性质或对象，以免超出本节措辞。
translation_notes:
  register: 采用现代、庄重而易懂的书面语。以三个分句重现原文依次援引该隐、巴兰和可拉的并列结构；保留第二分句刻意突出的难解隐喻，并用脚注补充较自然的意译。
