  text: οὗτοί εἰσιν οἱ ἀποδιορίζοντες, ψυχικοί, πνεῦμα μὴ ἔχοντες.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/019.yaml
  text: These are the ones who cause divisions[a], worldly people[c][b], not having the Spirit.
translation:
  language: zh_hans
  text: 这些人制造分裂；他们只随从人的天然本性，没有圣灵。[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使自己与人分开”或“自我隔离”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“不属灵”或“属血气”。这里指只按人的天然本性而活，不受圣灵引导。
    reason: lexical_alternative
  - marker: c
    text: 原文也可译作“灵”，但按上下文，最可能是指圣灵。
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτοί
  choice: 这些人
  rationale: 指回上下文所说的闯入者；补出“人”符合现代汉语表达，也不增加新的所指。
- source_word: οἱ ἀποδιορίζοντες
  choice: 制造分裂
  rationale: 该分词刻画这些人的行为；上下文较支持他们主动造成群体分裂的含义，同时在脚注保留“把自己分别出去”的可能解释。
- source_word: ψυχικοί
  choice: 只凭本性生活
  rationale: 此词与下文“没有圣灵”形成对照，表示受天然生命或人的本性支配，而非受圣灵引导。“只凭本性生活”比“属血气”更易为现代读者直接理解，并避免把该词窄化为肉体欲望。
- source_word: πνεῦμα
  choice: 圣灵
  rationale: 与 ψυχικοί 的直接对照以及本段的神学语境，使“圣灵”成为最可能的所指；原文没有冠词并不排除这一理解。脚注保留泛指“灵”的语义可能。
- source_word: μὴ ἔχοντες
  choice: 没有
  rationale: 自然、直接地表达否定分词，并保持与前面描述语的紧密连接。
theological_decisions:
- issue: πνεῦμα 的所指
  choice: 圣灵
  alternative: 灵（也可能被理解为人的灵）
  rationale: 上下文将 ψυχικοί 与没有 πνεῦμα 对照，最自然地指这些人没有圣灵；但因原词本身可泛指“灵”，故以脚注保留歧义。
- issue: ἀποδιορίζοντες 所表达的分裂方式
  choice: 主动制造分裂
  alternative: 把自己分别出去
  rationale: 犹大书对这些人的整体描写较支持其造成群体分裂的行为，但该词也可能强调他们自我隔离，因此不在正文中排除另一解释，而以脚注保存。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“只凭本性生活”用于解释 ψυχικοί 与圣灵之间的对照，避免较旧的“属血气”可能引起的误解；句式保持简洁有力，并在脚注中保存重要的词义与神学歧义。
