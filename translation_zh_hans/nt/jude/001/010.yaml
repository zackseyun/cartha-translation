  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οὗτοι δὲ ὅσα μὲν οὐκ οἴδασιν βλασφημοῦσιν, ὅσα δὲ φυσικῶς ὡς τὰ ἄλογα ζῷα ἐπίστανται, ἐν τούτοις φθείρονται.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/010.yaml
  text: But these people slander whatever they do not understand[a], and whatever they understand naturally, like irrational animals[c][b], by these things they are corrupted.
translation:
  language: zh_hans
  text: 可是，这些人毁谤他们所不明白的一切[a]；而他们像没有理性的动物一样凭本能所知道的事[b]，正使他们败坏[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “毁谤”也可译作“亵渎”或“辱骂”；“不明白”直译“所不知道”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“他们自然而然知道的事，如同没有理性的动物一样。”
    reason: lexical_alternative
  - marker: c
    text: “正使他们败坏”也可译作“他们在这些事上败坏”或“正因这些事走向毁灭”。
    reason: semantic_ambiguity
lexical_decisions:
- source_word: οὗτοι
  choice: 这些人
  rationale: 指上下文所斥责的闯入者；“这些人”在现代汉语中指向清楚，也不额外限定性别。
- source_word: βλασφημοῦσιν
  choice: 毁谤
  rationale: 该词可指亵渎、辱骂或毁谤。宾语是他们不明白的事物，译作“毁谤”保留恶言攻击的严重性，又不把含义限于直接亵渎上帝。
- source_word: ὅσα μὲν οὐκ οἴδασιν
  choice: 自己不明白的一切
  rationale: οἴδασιν本义为“知道”，但这里与凭本能具有的认识相对，“不明白”更自然地表达认知上的不了解。
- source_word: φυσικῶς
  choice: 凭本能
  rationale: 该副词意为“自然地”，在与无理性动物的比较中具体指本能性的认识；“凭本能”在现代汉语中准确而清楚。
- source_word: τὰ ἄλογα ζῷα
  choice: 没有理性的动物
  rationale: ἄλογα强调缺乏理性；此译较“禽兽”中性，避免加入原文没有的汉语贬称色彩。
- source_word: ἐπίστανται
  choice: 所知道的
  rationale: 指他们天然具有的实际认知。译作“知道”与前句“不明白”形成自然对照，同时避免把这种动物式认知提升为理性理解。
- source_word: ἐν τούτοις
  choice: 在这些事上
  rationale: 保留ἐν的范围或领域含义；原文也可能带工具意味，即“因这些事”，故以脚注说明。
- source_word: φθείρονται
  choice: 败坏自己
  rationale: φθείρονται可表达败坏、毁灭或走向灭亡；中间／被动形式在这里允许其本能行为使自身败坏的理解。“败坏自己”兼顾道德腐化与自取毁坏，但不把结果限定为单一意义。
theological_decisions:
- issue: βλασφημέω的对象并未明确限定为神圣对象
  choice: 译作“毁谤”
  alternative: “亵渎”或“辱骂”
  rationale: 原文谴责他们对不明白之事的恶言攻击，不必然只指直接冒犯上帝；“毁谤”避免加入较窄的神学限定。
- issue: φθείρονται所表达的是道德败坏还是最终毁灭
  choice: 正文译作“败坏自己”，脚注保留“走向毁灭”
  alternative: “遭到毁灭”或“走向灭亡”
  rationale: 该动词在此可同时含有腐化与毁灭的张力。正文不完全消除其自取败坏的意味，脚注则保留审判和毁灭的可能指向。
- issue: ἐν τούτοις是范围用法还是工具用法
  choice: 正文译作“在这些事上”
  alternative: “因这些事”或“被这些事所毁”
  rationale: 希腊文介词结构可以描述他们败坏的领域，也可能指出导致败坏的手段；采用较形式对应的正文，并在脚注中保存另一理解。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“可是”承接前文并突出对比；分号呈现μέν…δέ的两面对照。避免使用带传统骂詈色彩的“畜类／禽兽”，并通过脚注保留βλασφημοῦσιν、ἐν τούτοις及φθείρονται的真实语义幅度。
