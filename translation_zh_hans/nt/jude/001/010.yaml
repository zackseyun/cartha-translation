revisions:
- from: 可是，这些人毁谤自己不明白的一切[a]；至于他们像没有理性的动物一样，凭本能所知道的一切[b]，他们就在这些事上败坏自己[c]。
  to: 可是，这些人毁谤他们所不明白的一切[a]；而他们像没有理性的动物一样凭本能所知道的事[b]，正使他们败坏[c]。
  rationale: 修订后以“他们……所知道的事，正使他们败坏”清楚表达后一个ὅσα与ἐν τούτοις之间的关联；不把φθείρονται限定为明确的反身行为，并在脚注中保留较贴近介词结构的“在这些事上”及毁灭的可能含义。
