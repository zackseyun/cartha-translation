source:
  edition: SBLGNT
  text: ⸀μόνῳ θεῷ σωτῆρι ἡμῶν ⸂διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν⸃ ⸀δόξα μεγαλωσύνη κράτος καὶ ἐξουσία ⸂πρὸ παντὸς τοῦ αἰῶνος⸃ καὶ νῦν καὶ εἰς πάντας τοὺς αἰῶνας· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/025.yaml
  text: to the only God our Savior[a], through Jesus the Messiah our Lord, be glory, majesty, dominion, and authority, before all time and now and forever[b]. Amen.
translation:
  language: zh_hans
  text: 愿荣耀、威严、权能和权柄，借着我们的主耶稣基督，归于独一的上帝——我们的救主；万世以前、如今，并直到永永远远！阿们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μόνῳ θεῷ σωτῆρι ἡμῶν
  choice: 独一的上帝——我们的救主
  rationale: μόνῳ强调上帝的独一性；σωτῆρι ἡμῶν与θεῷ同为与格，作同位说明。用破折号清楚保留“上帝”与“我们的救主”的同位关系。
- source_word: διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν
  choice: 借着我们的主耶稣基督
  rationale: διά加属格表示媒介，译作“借着”；τοῦ κυρίου ἡμῶν与Ἰησοῦ Χριστοῦ同位。现代汉语中“我们的主耶稣基督”庄重而自然。
- source_word: δόξα μεγαλωσύνη κράτος καὶ ἐξουσία
  choice: 荣耀、威严、权能和权柄
  rationale: 分别保留四个赞颂名词：δόξα为“荣耀”，μεγαλωσύνη为“威严”，κράτος侧重彰显出来的力量或统治之能，译为“权能”，ἐξουσία侧重正当的权威，译为“权柄”，避免把后二者合并。
- source_word: πρὸ παντὸς τοῦ αἰῶνος
  choice: 从万世以前
  rationale: 原文直译近于“在每一个世代以前”，表达超越一切时代的既往；“从万世以前”既保留αἰών的时代意象，又符合汉语赞颂体。
- source_word: νῦν καὶ εἰς πάντας τοὺς αἰῶνας
  choice: 直到现在，并到永永远远
  rationale: 保留νῦν的当前时点，并以“永永远远”自然表达“直到所有的世代”，呈现过去、现在与无尽未来的时间跨度。
- source_word: ἀμήν
  choice: 阿们
  rationale: 采用现代汉语基督教传统中通行且易懂的音译。
theological_decisions:
- issue: 颂赞的对象及“借着耶稣基督”的中介关系
  choice: 把颂赞归于独一的上帝、我们的救主，并表明颂赞借着我们的主耶稣基督而归给他
  alternative: 也可让“借着我们的主耶稣基督”较宽松地修饰整个颂赞句
  rationale: 希腊语最自然地把与格“独一的上帝——我们的救主”视为颂赞对象，把διά短语视为媒介。译文保留这一结构，不将上帝与耶稣混为同一语法对象，也不削弱耶稣的中介角色。
- issue: Χριστός的译法
  choice: 基督
  alternative: 弥赛亚
  rationale: Χριστός本义为“受膏者／弥赛亚”，但在“耶稣基督”这一固定组合中已高度名称化；中文“耶稣基督”自然、庄重且仍保留公认的称号内涵。此处不加注，以免把正文没有的异文问题引入经文。
- issue: 颂赞在时间上的范围
  choice: 从万世以前，直到现在，并到永永远远
  alternative: 在一切世代以前、现在，直到所有世代
  rationale: 译文呈现原文独特的三重时间跨度，同时避免把“万世以前”解释成某一套特定的创世前时间学说。
translation_notes:
  register: 采用现代、庄重的汉语颂赞体。为使隐含的祈愿结构清楚，将四个颂赞名词前置为“愿……归于……”。“独一的上帝——我们的救主”用破折号显示同位关系。经文无需脚注，因此正文无脚注标记。
