id: JUD.1.4
reference: Jude 1:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: παρεισέδυσαν γάρ τινες ἄνθρωποι, οἱ πάλαι προγεγραμμένοι εἰς τοῦτο τὸ κρίμα, ἀσεβεῖς, τὴν τοῦ θεοῦ ἡμῶν χάριτα μετατιθέντες εἰς ἀσέλγειαν καὶ τὸν μόνον ⸀δεσπότην καὶ κύριον ἡμῶν Ἰησοῦν Χριστὸν ἀρνούμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/004.yaml
  text: For certain men have slipped in unnoticed[a], who long ago were designated for this judgment, ungodly men who turn the grace of our God into sensuality and deny our only Master and Lord[d][c][b], Jesus the Messiah.
translation:
  language: zh_hans
  text: 因为有些人已经暗中潜入[a]。这些不敬虔的人，早已被标明要受这样的审判[b]；他们把我们上帝的恩典变成放纵[c]，并且否认我们独一的主宰和主——耶稣基督[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“偷偷混进来了。”
    reason: παρεισέδυσαν含有隐秘渗入、未被察觉的意味。
  - marker: b
    text: “被标明”也可译作“预先被写明”或“预先被指定”。本句没有明确说明所指的是先前的经文记载，还是上帝预先作出的指定。
    reason: προγεγραμμένοι可涉及预先写下、公开标示或预先指定，应保留其真实歧义和相关神学张力。
  - marker: c
    text: “放纵”也可译作“淫荡”“无耻的纵欲”。这个词常包含性方面的放荡，但含义不限于此。
    reason: ἀσέλγεια表示无耻而不受约束的欲望或行为，译词不宜不加说明地缩窄。
  - marker: d
    text: “基督”意为“受膏者”，也就是“弥赛亚”。按本句最自然的语法，“主宰”和“主”这两个称号都指耶稣基督。
    reason: 说明Χριστός的称号意义，并交代并列称号与耶稣基督之间的句法关系。
lexical_decisions:
- source_word: παρεισέδυσαν
  choice: 已经暗中混了进来
  rationale: 表达偷偷渗入而未被察觉的意味；“已经”也显示过去的进入造成当前威胁。
- source_word: πάλαι προγεγραμμένοι
  choice: 早已被列明
  rationale: “早已”对应πάλαι；“被列明”兼顾预先写下、公开标示或预先指明的可能含义，不把措辞强化为明确的个体预定。
- source_word: κρίμα
  choice: 审判
  rationale: 保留司法性的宽泛含义，不预先限定为判决、定罪或刑罚中的某一项。
- source_word: ἀσεβεῖς
  choice: 不敬虔的人
  rationale: 指出他们对上帝缺乏敬畏，并自然承接前面的“有些人”。
- source_word: χάριτα
  choice: 恩典
  rationale: 这是现代汉语基督教语境中准确而通行的对应词，表达上帝白白赐予的恩惠。
- source_word: μετατιθέντες εἰς
  choice: 变成
  rationale: 直接保留“改变为”的结构，避免在正文中加入原文未明说的“借口”或采用解释性更强的“歪曲”。
- source_word: ἀσέλγειαν
  choice: 放纵
  rationale: 涵盖无耻、无节制的欲望与行为，也可包含性方面的淫荡，但不把词义缩窄到单一领域。
- source_word: μόνον δεσπότην καὶ κύριον
  choice: 独一的主宰和主
  rationale: 分别呈现δεσπότης的绝对权柄和κύριος的“主”这一称号，同时保留两个并列头衔。
- source_word: Ἰησοῦν Χριστόν
  choice: 耶稣基督
  rationale: “基督”是Χριστός在现代标准汉语中的通行称号译法，意为“受膏者”，即弥赛亚。
- source_word: ἀρνούμενοι
  choice: 否认
  rationale: 既可表示言语或信念上的否认，也可涵盖行为上的拒绝承认和背弃。
theological_decisions:
- issue: προγεγραμμένοι εἰς τοῦτο τὸ κρίμα所表达的预先性
  choice: 早已被列明要受这审判
  alternative: 早已被预定受这定罪；早已有人写到他们要受这审判
  rationale: 希腊文可能指先前写下、公开列明或预先指定。正文保留其预先宣告及司法意味，却不将其明确解释为个体预定论；脚注交代主要可能性。
- issue: “独一的主宰和主”的所指
  choice: 两个称号都指耶稣基督
  alternative: “主宰”指父上帝，而“主”指耶稣基督
  rationale: 希腊文将两个并列称号置于同一结构中，随后同位说明“耶稣基督”；最自然的句法理解是两个称号均指他。破折号在汉语中清楚呈现这种同位关系。
- issue: χάριτα μετατιθέντες εἰς ἀσέλγειαν的伦理含义
  choice: 把恩典变成放纵
  alternative: 把恩典当作放纵的借口；歪曲恩典，使之成为淫荡
  rationale: 正文紧贴“改变为”的原文结构，不额外说明其机制，同时保留作者对滥用恩典的严厉谴责。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“暗中混了进来”自然传达渗入感；“被列明”略带司法和公告色彩，以保存原词的多义性。分号呈现三个描述成分的关系，破折号清楚标示“耶稣基督”是前述两个称号的同位说明。全文避免古雅虚词和宗派化术语。
