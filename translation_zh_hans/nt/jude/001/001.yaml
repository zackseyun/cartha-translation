id: JUD.1.1
reference: Jude 1:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ἰούδας Ἰησοῦ Χριστοῦ δοῦλος, ἀδελφὸς δὲ Ἰακώβου, τοῖς ἐν θεῷ πατρὶ ⸀ἠγαπημένοις καὶ Ἰησοῦ Χριστῷ τετηρημένοις κλητοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/001.yaml
  text: 'Jude[a], a slave of Jesus the Messiah and brother of James, to those who are loved in God the Father and kept for Jesus the Messiah[c][b], called:'
translation:
  language: zh_hans
  text: 犹大——耶稣弥赛亚的奴仆，也是雅各的兄弟——写信给那些在父神里蒙爱[b]、为耶稣弥赛亚蒙保守[a]、蒙召的人[c]：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为耶稣弥赛亚蒙保守”也可译作“由耶稣弥赛亚保守”。这里的希腊语与格既可表示“为”，也可表示施事者“由”。
    reason: alternative_reading
  - marker: b
    text: 有些抄本作“在父神里被分别为圣”，而不是“在父神里蒙爱”。
    reason: textual_variant
  - marker: c
    text: “蒙召的人”也可较直译为“蒙召者”。
    reason: previous_rendering
lexical_decisions:
- source_word: Ἰούδας
  choice: 犹大
  rationale: 采用现代中文新约中这一人名的通行译法；中文无需像英语那样另造 Jude/Judas 的拼写区别。
- source_word: δοῦλος
  choice: 奴仆
  rationale: 既保留受主人支配、归属于主的含义，也符合庄重而自然的中文书信自称；“仆人”容易弱化其隶属意味，“奴隶”则在此自称中显得过于偏重社会身份。
- source_word: Χριστοῦ / Χριστῷ
  choice: 弥赛亚
  rationale: Χριστός在这里是称号；译作“弥赛亚”使普通读者能看出其称号意义，而非只把“基督”当作名字的一部分。
- source_word: ἀδελφὸς δὲ Ἰακώβου
  choice: 也是雅各的兄弟
  rationale: δέ在自我介绍中只有轻微的转接或对照作用；“也是”比“但是”自然，并保留两项身份并列的关系。
- source_word: ἐν θεῷ πατρὶ
  choice: 在父神里
  rationale: 保留ἐν所表达的领域或关系范围，不擅自改为“被父神”或“为父神”。“父神”是现代中文中自然、庄重的表达。
- source_word: ἠγαπημένοις
  choice: 蒙爱
  rationale: 希腊文完成时被动分词表示已经受到爱、如今仍处于被爱状态；“蒙爱”简洁地保留被动和持续结果。
- source_word: τετηρημένοις
  choice: 蒙保守
  rationale: 保留完成时被动分词所表示的受保守并持续处于被保守状态；与格Ἰησοῦ Χριστῷ的关系另以“为”呈现，并在脚注保留“由”的可能。
- source_word: κλητοῖς
  choice: 蒙召的人
  rationale: 该形容词实词化，指收信者；“蒙召的人”自然表达其被动含义和神学分量，并与其余两个描述保持同属收信者的结构。
- source_word: Ἰακώβου
  choice: 雅各
  rationale: 采用现代中文新约对Ἰάκωβος的通行译名。
theological_decisions:
- issue: τετηρημένοις与Ἰησοῦ Χριστῷ的关系
  choice: 为耶稣弥赛亚蒙保守
  alternative: 由耶稣弥赛亚保守
  rationale: 这里的与格既可理解为方向或受益对象，即“为……”，也可理解为施事者，即“由……”。正文采用较可能的“为”，脚注保留另一种真实的语法可能，不把神学张力提前消解。
- issue: ἠγαπημένοις的文本异读
  choice: 蒙爱
  alternative: 成为圣洁／分别为圣
  rationale: 正文遵循所给SBLGNT的ἠγαπημένοις；部分抄本作ἡγιασμένοις，这一异读会明显改变措辞，故列入脚注。
- issue: κλητοῖς的句法地位
  choice: 那些蒙召……的人
  alternative: 被召的众人／蒙召者
  rationale: κλητοῖς与前面的两个分词共同描述收信者，并且在语法上具有实词化作用。正文用自然中文把“蒙召”纳入并列描述，不将其解释为与前两项无关的独立称呼。
translation_notes:
  register: 采用现代、庄重、适合公开诵读的书信体。破折号清楚标出作者的双重身份，同时保持原句以“犹大”开头。正文中的[a]、[b]、[c]分别紧随其所说明的语句；冒号保留本节作为书信起首、引向后续问安的未完结构。
