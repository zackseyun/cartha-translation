revisions:
- from: 我想提醒你们[a]，虽然这一切你们已经一次而永远地知道了：耶稣曾把一个民族从埃及地救出来，后来却毁灭了那些不信的人。
  to: 我想提醒你们[a]，虽然你们早已知道这一切：耶稣曾把一群人从埃及地救出来，后来毁灭了那些不信的人。
  rationale: 修订仅改善汉语表达并避免不必要的语义限定：以“早已知道这一切”自然传达让步分词结构及ἅπαξ在此语境中的已知性／一次性重点；以“一群人”对应不定的λαόν；删去“却”，使先后关系保持与原文相称。保留“耶稣”及其异文脚注，忠实反映所给SBLGNT正文和重要文本变体。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T03:57:08Z'
review_pass:
  verdict: revise
  source_fidelity: 正文准确保留“耶稣”作为出埃及拯救与随后毁灭行动的共同主语，也正确表达了先救后审判的时序。可是“这一切你们已经一次而永远地知道了”在汉语中生硬，并把ἅπαξ的作用处理得过于机械；“早已知道这一切”在此语境下更自然，且保留作者提醒读者已知事实的重点。
  naturalness: “虽然你们早已知道这一切”是现代标准汉语中自然的让步式表达。“一群人”比“一个民族”更贴近此处λαός对作为整体之人的指称，也避免把该词限定为现代民族概念。
  terminology: “耶稣”“埃及地”“救出来”“毁灭了”“不信的人”均合乎经文的庄重语体和关键术语。文本异文脚注应保留，并清楚说明异文所替换的是“耶稣”。
  issues:
  - severity: medium
    issue: “一次而永远地知道了”不自然，且对ἅπαξ作了过度字面化处理。
    rationale: ἅπαξ在此构式的精确句法范围历来有讨论；在不消除其“已然／一次性”意味的前提下，汉语宜以“早已知道”表达作者的主要语用功能，而不制造不合汉语习惯的“永远地知道”说法。
  - severity: low
    issue: “一个民族”可能将λαός现代化为民族国家或族群范畴。
    rationale: λαός在这里指从埃及得救的一群人（即以色列民）；“一群人”较为中性自然，也保留原文的不定式表达。
  - severity: low
    issue: “后来却毁灭了”中的“却”添加了强制性的转折连接。
    rationale: 上下文确有震撼性的对照，但希腊文主要以时序表达；删去“却”可避免将连接关系明示得比原文更强。
