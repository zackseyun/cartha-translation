source:
  edition: SBLGNT
  text: Ὑπομνῆσαι δὲ ὑμᾶς βούλομαι, εἰδότας ⸂ὑμᾶς ἅπαξ⸃ ⸀πάντα, ὅτι ⸀Ἰησοῦς λαὸν ἐκ γῆς Αἰγύπτου σώσας τὸ δεύτερον τοὺς μὴ πιστεύσαντας ἀπώλεσεν,
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/005.yaml
  text: I want to remind you[a], though you know all things once for all, that Jesus, having saved a people out of the land of Egypt, afterward destroyed those who did not believe.
translation:
  language: zh_hans
  text: 我想提醒你们[a]，虽然你们早已知道这一切：耶稣曾把一群人从埃及地救出来，后来毁灭了那些不信的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“主”或“神”，而不是“耶稣”。
    reason: textual_variant
lexical_decisions:
- source_word: Ὑπομνῆσαι
  choice: 提醒
  rationale: 与 βούλομαι 连用，表达“我想提醒你们”，自然地传达使人重新想起已知之事的意思。
- source_word: βούλομαι
  choice: 我想
  rationale: 直接表达第一人称意愿，现代汉语自然清楚。
- source_word: εἰδότας ὑμᾶς ἅπαξ πάντα
  choice: 虽然这一切你们已经一次而永远地知道了
  rationale: 将分词结构按语境处理为让步关系；“这一切”把 πάντα 理解为下文所涉及的共同知识，“一次而永远地”保留 ἅπαξ 的终局性意味，也不排除“曾经”这一语感。
- source_word: Ἰησοῦς
  choice: 耶稣
  rationale: SBLGNT 所给正文明确作 Ἰησοῦς，应在正文中直接翻译，并保留其关于出埃及事件主体的强烈基督论张力。
- source_word: λαὸν
  choice: 一个民族
  rationale: 保留名词无冠词形式的非特指表达，同时在汉语中自然地指向作为整体的以色列民。
- source_word: ἐκ γῆς Αἰγύπτου
  choice: 从埃及地
  rationale: 保留圣经出埃及叙事中“埃及地”的传统回响，又符合现代汉语。
- source_word: σώσας
  choice: 曾……救出来
  rationale: 以“曾”配合后面的“后来”，清楚表达该不定过去分词先于主句动作。
- source_word: τὸ δεύτερον
  choice: 后来
  rationale: 按此处习语表达随后发生的第二项行动，比直译“第二次”更符合语义和汉语习惯。
- source_word: τοὺς μὴ πιστεύσαντας
  choice: 那些不信的人
  rationale: 直接保留未信或拒绝相信这一特征，不把“信”窄化为纯粹认知或另行解释为特定教义。
- source_word: ἀπώλεσεν
  choice: 毁灭了
  rationale: 准确传达神审判的严厉程度，不弱化为“损害”或“使败坏”。
theological_decisions:
- issue: 出埃及叙述中的基督论主语
  choice: 正文译作“耶稣”
  alternative: “主”或“神”
  rationale: 所给 SBLGNT 正文作 Ἰησοῦς。正文应遵循原文证据，保留耶稣在出埃及事件中行动这一神学张力；重要异文则在脚注中说明。
- issue: 拯救之后施行审判的张力
  choice: 保留同一主语先“救出来”、后来又“毁灭”的鲜明对照
  alternative: 通过补充解释将拯救与审判分属不同主体或不同神学范畴
  rationale: 希腊文让两个动作共享同一主语，并以先后次序并置；译文不应替读者消解这一警告性张力。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“一个民族”比“一个百姓”更符合当代用语；以冒号引出提醒的内容，使长句层次清楚。脚注标记紧跟“你们”，既保留所要求的标记，也避免打断核心基督论陈述。
