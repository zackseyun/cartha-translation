id: JUD.1.16
reference: Jude 1:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οὗτοί εἰσιν γογγυσταί, μεμψίμοιροι, κατὰ τὰς ἐπιθυμίας ⸀αὐτῶν πορευόμενοι, καὶ τὸ στόμα αὐτῶν λαλεῖ ὑπέρογκα, θαυμάζοντες πρόσωπα ὠφελείας χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/016.yaml
  text: These are grumblers[a], malcontents, walking according to their own desires, and their mouth speaks arrogant things[c][b], showing favoritism for the sake of gain.
translation:
  language: zh_hans
  text: 这些人总是抱怨，对自己的处境不满，顺着自己的欲望行事[a]；他们口出狂妄之言[b]，为谋取好处而对人另眼相看[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“顺着自己的私欲生活。”
    reason: 保留ἐπιθυμίαι在负面语境下可译作“私欲”，以及πορεύομαι可表达生活方式的可能。
  - marker: b
    text: 也可译：“他们的口说夸大的话。”
    reason: 较直译地保留单数“口”和ὑπέρογκα“膨胀、夸大”的形象。
  - marker: c
    text: 直译：“惊叹人的脸面。”这是指看人的情面而另眼相看或偏待人；在本句中也可指为得利益而讨好人。
    reason: 说明θαυμάζοντες πρόσωπα的字面形式、习语意义及其在逐利语境中的具体表现。
lexical_decisions:
- source_word: γογγυσταί
  choice: 总是抱怨
  rationale: 该词指惯于低声埋怨、发牢骚的人。“总是抱怨”以自然现代汉语表达其持续的性格特征。
- source_word: μεμψίμοιροι
  choice: 对自己的处境不满
  rationale: 这个罕见词特指埋怨自己的命运或处境；此译法与前面的泛指“抱怨”有所区分，也保留其具体含义。
- source_word: κατὰ τὰς ἐπιθυμίας αὐτῶν πορευόμενοι
  choice: 顺着自己的欲望行事
  rationale: πορεύομαι在此比喻人的生活方式，译为“行事”；ἐπιθυμίαι本身可泛指强烈欲望，负面道德色彩由本节语境表达，不限定为性欲。
- source_word: τὸ στόμα αὐτῶν λαλεῖ ὑπέρογκα
  choice: 他们口出狂妄之言
  rationale: ὑπέρογκα指夸大、自负、狂妄的话。“口出狂妄之言”自然庄重，并保留希腊文以“口”指言语的表达。
- source_word: θαυμάζοντες πρόσωπα
  choice: 奉承人
  rationale: 字面为“惊叹人的脸面”，是对人另眼相看、讨好人的习语；因下文明确指出为自身利益，译作“奉承人”最贴合此处行为动机。
- source_word: ὠφελείας χάριν
  choice: 为谋取好处
  rationale: 该短语说明动机，即为了利益或便利；“谋取好处”清楚传达其自利性质，同时不把利益限制为金钱。
- source_word: οὗτοί εἰσιν
  choice: 这些人
  rationale: 以简洁的指示表达承接上文所指的人，符合现代汉语句法。
theological_decisions:
- issue: ἐπιθυμίαι的道德含义
  choice: 正文译“欲望”，由上下文体现其负面性质
  alternative: 私欲；邪情；贪欲
  rationale: 原词可指各种强烈欲望；本节虽显然带有谴责意味，却没有限定为性欲、贪财或某一种具体欲望，因此保留较宽的语义范围。
- issue: θαυμάζοντες πρόσωπα的习语含义
  choice: 奉承人
  alternative: 偏待人；看重人的情面；抬举人的脸面
  rationale: 该习语涉及因看重某人而给予特殊对待；与“为谋取好处”连用时，重点是出于私利讨好别人。“奉承人”传达了这种自利性的偏爱，又未引入特定宗派解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“总是抱怨”与“对自己的处境不满”区分两个近义指控；分号把生活方式与言语、待人方式两组罪状分开。正文所有脚注标记均依次出现。
