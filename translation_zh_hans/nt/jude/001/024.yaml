  text: Τῷ δὲ δυναμένῳ φυλάξαι ⸀ὑμᾶς ἀπταίστους καὶ στῆσαι κατενώπιον τῆς δόξης αὐτοῦ ἀμώμους ἐν ἀγαλλιάσει
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/024.yaml
  text: To the one who is able to keep you from stumbling and to present you blameless before his glory with rejoicing[c][b][a],
translation:
  language: zh_hans
  text: 而归给那能保守你们不失脚[a]，并使你们无可指责[b]、欢欣地站在他荣耀的面前[c]的那一位——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不跌倒。”希腊语ἀπταίστους含有不绊跌、不跌倒的意思。
    reason: lexical_alternative
  - marker: b
    text: 或译：“毫无瑕疵。”希腊语ἀμώμους既可指无可指责，也可使人联想到祭物没有残缺或瑕疵。
    reason: lexical_alternative
  - marker: c
    text: 原文直译为“他的荣耀”；也有人按所表达的临在译作“他荣耀的临在”。
    reason: alternative_reading
lexical_decisions:
- source_word: Τῷ ... δυναμένῳ
  choice: 归给那能……的那一位
  rationale: 带冠词的与格分词结构承接第25节颂赞的归属对象。“归给……的那一位”在中文中保留了与格方向和分词含义；破折号提示句法尚待下一节完成。
- source_word: δὲ
  choice: 而
  rationale: 此处表示进入结尾颂赞的轻微转折或推进，不是强烈对比；“而”简洁地保留这一衔接作用。
- source_word: φυλάξαι
  choice: 保守
  rationale: φυλάσσω有看守、护卫、保存之意；“保守”自然适合神使人免于失脚的语境。
- source_word: ὑμᾶς
  choice: 你们
  rationale: 明确保留第二人称复数。
- source_word: ἀπταίστους
  choice: 不失脚
  rationale: 保留“不绊跌、不跌倒”的核心比喻，同时不把含义限定为日常过失或最终背道。
- source_word: καὶ στῆσαι
  choice: 并使你们……站在
  rationale: στῆσαι在此是使役性不定式，直指“使之站立”；该译法比单用“呈献”更贴近原文意象，在中文中也通顺。
- source_word: κατενώπιον
  choice: 面前
  rationale: 自然表达“在……之前／当面”的空间与临在含义。
- source_word: τῆς δόξης αὐτοῦ
  choice: 他荣耀
  rationale: 原文直接说“他的荣耀”，没有使用“临在”一词；中文以“他荣耀面前”保留原有神学意象。
- source_word: ἀμώμους
  choice: 无可指责
  rationale: 清楚表达道德上无可归咎的含义，同时用脚注保留该词“无瑕疵”的祭祀意象。
- source_word: ἐν ἀγαλλιάσει
  choice: 欢欣地
  rationale: ἀγαλλίασις指强烈、洋溢的喜乐；“欢欣地”自然凝练，不额外加入原文没有明说的程度词。
theological_decisions:
- issue: ἀπταίστους所指是不犯罪、免于跌倒，还是免于最终背道
  choice: 不失脚
  alternative: 不跌倒
  rationale: 保留原文的绊跌比喻，不在译文中断定它专指日常犯罪或最终离弃信仰。
- issue: τῆς δόξης αὐτοῦ是直译为“他的荣耀”，还是解释为“他荣耀的临在”
  choice: 他荣耀面前
  alternative: 他荣耀的临在中
  rationale: 原文明确使用δόξα（荣耀），而非表示“临在”的名词；直译既保留神学分量，也不排除临在的语境含义。
- issue: ἀμώμους侧重道德无可指责，还是祭物毫无瑕疵
  choice: 无可指责
  alternative: 毫无瑕疵
  rationale: 正文采用现代读者易懂的伦理表达，脚注保留该词可能唤起的祭祀与完整无损意象。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。保留本节与下一节共同构成一个颂赞句的未完结构，以破折号提示续接；不擅自补入第25节才出现的“荣耀、威严、权能、权柄”等颂赞内容。
