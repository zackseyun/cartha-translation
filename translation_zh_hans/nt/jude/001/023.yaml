  text: οὓς δὲ σῴζετε ἐκ πυρὸς ἁρπάζοντες, οὓς δὲ ἐλεᾶτε ἐν φόβῳ⸃, μισοῦντες καὶ τὸν ἀπὸ τῆς σαρκὸς ἐσπιλωμένον χιτῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/023.yaml
  text: save others by snatching them out of the fire[a]; and have mercy on others with fear[d][c][b], hating even the tunic stained by the flesh.
translation:
  language: zh_hans
  text: 有些人，你们要救他们，从火中把他们夺出来[a]；另一些人，你们要带着惧怕怜悯他们[b]，连那被肉体玷污的贴身衣也要憎恶[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“要救他们，把他们从火中夺出来”。“火”可能指将临的审判，也可能指严重的属灵危险。
    reason: alternative_reading
  - marker: b
    text: “带着惧怕”可能指敬畏上帝，也可能指谨慎戒惧，以免自己也受到腐化。
    reason: lexical_alternative
  - marker: c
    text: “肉体”也可按其道德含义理解为“有罪的本性”；原文为“被肉体玷污的贴身衣”。
    reason: lexical_alternative
lexical_decisions:
- source_word: σῴζετε
  choice: 抢救
  rationale: 本词在这里是命令语气，并由“从火中夺出”的意象说明其方式；“抢救”既传达拯救，也突出紧迫的救援行动。
- source_word: ἐκ πυρὸς ἁρπάζοντες
  choice: 把他们从火中抢救出来
  rationale: 将分词所表达的手段自然融入汉语；“抢救出来”保留ἁρπάζω强力、急迫地夺出的意味。
- source_word: ἐλεᾶτε
  choice: 怜悯
  rationale: 直接表达施予怜悯的命令，符合现代汉语和经文庄重语体。
- source_word: ἐν φόβῳ
  choice: 怀着敬畏
  rationale: “敬畏”在正文中自然，并保留对上帝的敬畏这一可能含义；脚注同时说明也可能指谨慎戒惧，以免受玷污。
- source_word: μισοῦντες
  choice: 憎恶
  rationale: 保留原文强烈的道德排斥意味，同时与对人的“怜悯”形成张力。
- source_word: χιτῶνα
  choice: 贴身衣
  rationale: χίτων通常指穿在里面、贴近身体的衣服；“贴身衣”比泛称“衣服”更具体，也比音译“长衣”更易懂。
- source_word: ἐσπιλωμένον
  choice: 玷污
  rationale: 兼顾衣物被弄脏的形象与道德污染的隐喻。
- source_word: σάρξ
  choice: 肉体
  rationale: 保留原文用词及其隐喻，不在正文中将其解释为体系化的“罪性”。
theological_decisions:
- issue: “火”的所指
  choice: 正文保留“火”的意象，不明确指定其所指
  alternative: 末后的审判；当前严重的属灵危险
  rationale: 原文没有明说火具体指什么；保留意象可同时维持审判警告与属灵危境的可能性。
- issue: ἐν φόβῳ中“惧怕”的对象和性质
  choice: 正文译作“怀着敬畏”，脚注保留谨慎戒惧的可能
  alternative: 因担心自己也受腐化而谨慎戒惧
  rationale: 该短语可能指对上帝的敬畏，也可能强调帮助别人时防备自己受污染；不宜完全消除歧义。
- issue: σάρξ在“被肉体玷污”中的含义
  choice: 正文译作“肉体”
  alternative: 罪性；有罪的本性
  rationale: 上下文显然带有道德污染意味，但直译能保留原文身体与道德双重联想，避免加入过度确定的神学解释。
- issue: 怜悯人与憎恶污染之间的张力
  choice: 并列保留“怜悯他们”与“憎恶……衣”
  alternative: 解释为只憎恶罪而不憎恶人
  rationale: 原文本身以强烈意象并置怜悯与憎恶；译文不额外添加对象区分，但借助“贴身衣”的意象保留其修辞界线。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“有些人……另一些人”清楚呈现两组对象；“抢救”强化紧迫感，“贴身衣”保存古代衣着意象而避免生硬音译。正文尽量保留“火”“肉体”等原文意象，并用脚注交代真正存在的语义歧义。
