id: JUD.1.3
reference: Jude 1:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ἀγαπητοί, πᾶσαν σπουδὴν ποιούμενος γράφειν ὑμῖν περὶ τῆς κοινῆς ⸀ἡμῶν σωτηρίας ἀνάγκην ἔσχον γράψαι ὑμῖν παρακαλῶν ἐπαγωνίζεσθαι τῇ ἅπαξ παραδοθείσῃ τοῖς ἁγίοις πίστει.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/003.yaml
  text: Beloved[a], although I was making every effort to write to you about our common salvation, I found it necessary to write[d][c][b], urging you to contend earnestly for the faith once for all delivered to the saints.
translation:
  language: zh_hans
  text: 亲爱的各位，我原本竭尽心力，想写信给你们谈论我们共同拥有的救恩；如今却感到有必要写信劝你们：要竭力捍卫那已经一次而永远地交付[a]给圣徒[b]的信仰[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “交付”也可译作“传给”，后者更突出信仰教导的传承。
    reason: lexical_alternative
  - marker: b
    text: “圣徒”在这里指属上帝的圣洁子民，也就是信徒，并非仅指后来获特殊称号的人。
    reason: lexical_alternative
  - marker: c
    text: 这里的“信仰”很可能指交托给信徒群体的信仰内容，而不只是个人相信的行动。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: 亲爱的各位
  rationale: 保留复数呼语的亲切、关爱语气，同时避免擅自加入原文没有明说的“弟兄姊妹”或“朋友”等身份称谓。
- source_word: πᾶσαν σπουδὴν ποιούμενος
  choice: 我原本竭尽心力
  rationale: 表达σπουδή所含的热切与尽力，并结合上下文用“原本……如今却……”自然呈现分词在此可能具有的让步或转折色彩。
- source_word: περὶ τῆς κοινῆς ἡμῶν σωτηρίας
  choice: 谈谈我们共同拥有的救恩
  rationale: κοινός表示共同、共享；此译法在现代汉语中自然，并保留“我们”所强调的共同参与。
- source_word: ἀνάγκην ἔσχον
  choice: 觉得有必要
  rationale: 准确表达因情势而产生的必要性，不采用“被迫”之类可能过度强化外在强制的说法。
- source_word: παρακαλῶν
  choice: 劝
  rationale: 在严肃劝勉的语境中简明自然，兼具呼吁和敦促之意。
- source_word: ἐπαγωνίζεσθαι
  choice: 竭力争战
  rationale: 该复合动词具有加强语气；“竭力争战”保留为某事奋力抗争的力度，又不把行动限定为口头争辩。
- source_word: τῇ ... πίστει
  choice: 为……信仰
  rationale: 这里的πίστις因被描述为交付给圣徒的对象，最自然地指共同领受的信仰内容，而不仅是个人相信的行为。
- source_word: ἅπαξ
  choice: 一次而永远
  rationale: 表达该词在此处一次完成、具有决定性的语气，同时不另行扩展其神学含义。
- source_word: παραδοθείσῃ
  choice: 交付
  rationale: 保留παραδίδωμι“交出、传递、交托”的基本含义；“传给”作为强调教导传承的可行译法列入脚注。
- source_word: τοῖς ἁγίοις
  choice: 给圣徒
  rationale: 采用早期基督徒群体中已确立的称谓，并以脚注说明这里泛指属上帝的圣洁子民，而非后世特定的册封身份。
theological_decisions:
- issue: πίστις在本节中的含义
  choice: 共同领受的信仰内容
  alternative: 信徒个人相信或信靠的行动
  rationale: “一次而永远交付给圣徒”表明这里所指的是群体所领受并应守护的信仰，而不是单指主观的信心；译文仍保留“信仰”这一较宽的词，并在脚注澄清语境。
- issue: ἅπαξ παραδοθείσῃ的力度
  choice: 一次而永远交付
  alternative: 曾经交付
  rationale: ἅπαξ在此具有一次完成、无需重复的决定性含义；此译法保留这一力度，却不把它发展为后世任何特定宗派的教义公式。
- issue: “圣徒”的所指
  choice: 属上帝的圣洁子民，即信徒群体
  alternative: 具有特殊册封地位的少数圣人
  rationale: 新约书信中复数ἅγιοι通常指信徒群体；脚注避免现代读者误解为少数获得特殊称号的人。
translation_notes:
  register: 采用现代、庄重而易懂的书信语体。“亲爱的各位”保留温暖呼语而不添加原文未明说的关系称谓；后半句用冒号引出劝勉，使较长的希腊句法在中文中清楚顺畅。“竭力争战”保留原文加强动词的紧迫感，但不具体限定争战方式。
