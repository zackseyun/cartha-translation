  text: ποιῆσαι κρίσιν κατὰ πάντων καὶ ἐλέγξαι ⸂πάντας τοὺς ἀσεβεῖς⸃ περὶ πάντων τῶν ἔργων ἀσεβείας αὐτῶν ὧν ἠσέβησαν καὶ περὶ πάντων τῶν σκληρῶν ὧν ἐλάλησαν κατ’ αὐτοῦ ἁμαρτωλοὶ ἀσεβεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/015.yaml
  text: to execute judgment against all and to convict all the ungodly concerning all their ungodly deeds that they committed in ungodliness[c][b][a], and concerning all the harsh things that ungodly sinners have spoken against him.
translation:
  language: zh_hans
  text: 要对所有人施行审判，并要定所有不敬虔之人的罪[a]：他们以不敬虔的方式所行的一切不敬虔之事，以及不敬虔的罪人用来攻击他[b]的一切强硬言辞[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “定……的罪”也可译作“揭露”或“证实有罪”。希腊语动词可指使罪过显明；这里它与“施行审判”并列，带有司法意味。
    reason: lexical_alternative
  - marker: b
    text: “他”按上文是指第14节所说的主。
    reason: cross_reference
  - marker: c
    text: “强硬言辞”直译为“刚硬的话”，也可理解为严厉、苛刻、悖逆或放肆的话。
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιῆσαι κρίσιν κατὰ πάντων
  choice: 审判所有的人
  rationale: ποιεῖν κρίσιν表示施行司法性的审判；κατά加属格在这里带有针对、定罪的意味。现代汉语用“审判所有的人”自然地传达该司法语境。
- source_word: ἐλέγξαι
  choice: 指证……的罪
  rationale: 该动词可指揭露过错、责备或证实有罪；因其与“审判”并列，“指证……的罪”既保留揭露罪责之意，也符合司法语境。
- source_word: πάντας τοὺς ἀσεβεῖς
  choice: 所有不敬虔之人
  rationale: 这是形容词名词化的复数结构；“不敬虔”还能与本节ἀσέβεια和ἀσεβέω的同源重复形成清楚联系。
- source_word: περὶ πάντων τῶν ἔργων ἀσεβείας αὐτῶν ὧν ἠσέβησαν
  choice: 他们以不敬虔的方式所行的一切不敬虔之事
  rationale: 译文有意重复“不敬虔”，尽量再现原文ἀσέβεια与ἀσεβέω的同源强调，同时保持现代汉语可读性。
- source_word: πάντων τῶν σκληρῶν
  choice: 一切狂妄之言
  rationale: σκληρός本义为“硬”，用于言语时可表示严厉、强硬、悖逆或狂妄；“狂妄之言”在此能自然表达敌对而放肆的话语，脚注保留其他可能。
- source_word: ἐλάλησαν κατ’ αὐτοῦ
  choice: 向他所说
  rationale: κατά加属格表示言语所针对的对象；“向他所说”结合“狂妄之言”可自然表达敌对方向，同时保留代词“他”。
- source_word: ἁμαρτωλοὶ ἀσεβεῖς
  choice: 不敬虔的罪人
  rationale: 保留“罪人”和“不敬虔”两个描述，并延续贯穿全节的ἀσεβ-词组重复。
theological_decisions:
- issue: αὐτοῦ（“他”）所指是谁
  choice: 正文保留代词“他”
  alternative: 明确译作“主”或“上帝”
  rationale: 上文第14节使读者可将其理解为“主”，但希腊文此处只用代词；正文不把所指对象直接展开，以免消除原文保留的形式与张力。
- issue: ἐλέγξαι在末世审判语境中的力度
  choice: 译为“指证……的罪”
  alternative: 译为“责备”或“定……有罪”
  rationale: “责备”可能过弱，而直接译成“定罪”容易与前面的“审判”完全重合；“指证……的罪”兼顾揭露并证实罪责的司法意味。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“不敬虔”三次出现，刻意对应原文ἀσεβ-词族的密集重复；以“就是……”展开ἐλέγξαι所涉及的两类罪状，使长句在汉语中层次清楚。
