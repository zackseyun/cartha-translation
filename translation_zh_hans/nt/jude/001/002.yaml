  text: ἔλεος ὑμῖν καὶ εἰρήνη καὶ ἀγάπη πληθυνθείη.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/002.yaml
  text: May mercy and peace and love be multiplied to you[a].
translation:
  language: zh_hans
  text: 愿怜悯、平安和爱多多地加给你们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “多多地加给”也可译作“在你们中间增多”或“丰丰富富地赐给你们”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεος
  choice: 怜悯
  rationale: 在书信祝福语境中，“怜悯”是自然且庄重的对应词，兼顾恩慈行动与体恤之意。
- source_word: ὑμῖν
  choice: 临到你们
  rationale: 与祝福公式中的与格相配，清楚表达这些福分归给收信人；复数“你们”保留原文数的信息。
- source_word: εἰρήνη
  choice: 平安
  rationale: “平安”既是现代汉语中通行的圣经用语，也保留关系和好、安宁与整体福祉等含义。
- source_word: ἀγάπη
  choice: 爱
  rationale: “爱”是现代汉语中直接、广泛而不带宗派色彩的对应词。
- source_word: πληθυνθείη
  choice: 多多地临到
  rationale: 以“多多地”表达增多、丰盛的语义，以“愿……临到”自然呈现被动祈愿式在祝福语中的功能。
- source_word: καὶ ... καὶ ... καὶ
  choice: 怜悯、平安和爱
  rationale: 汉语列举通常使用顿号并在末项前用“和”；这样读来庄重自然，而三项并列关系仍然清楚。
theological_decisions:
- issue: 祈愿式祝福公式的表达
  choice: 愿怜悯、平安和爱多多地临到你们。
  alternative: 愿怜悯、平安和爱在你们身上增多。
  rationale: 用“愿”明确表达希腊语祈愿式的祝愿语气；“临到你们”符合汉语祝福语习惯，“多多地”保留 πληθυνθείη 所含的增长与丰盛意象，而不限定爱来自谁或指向谁。
translation_notes:
  register: 采用现代、自然而庄重的书信祝福语体。“你们”明确保留复数；正文简洁，脚注说明 πληθυνθείη 的其他自然译法。
