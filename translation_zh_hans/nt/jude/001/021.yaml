id: JUD.1.21
reference: Jude 1:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἑαυτοὺς ἐν ἀγάπῃ θεοῦ τηρήσατε προσδεχόμενοι τὸ ἔλεος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ εἰς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/021.yaml
  text: keep yourselves in the love of God[c][b][a], waiting for the mercy of our Lord Jesus the Messiah unto eternal life.
translation:
  language: zh_hans
  text: 你们要保守自己常在上帝的爱中[a]，等候我们主耶稣这位弥赛亚的怜悯，以得永生[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “上帝的爱”也可理解为“上帝对你们的爱”或“你们对上帝的爱”。
    reason: alternative_reading
  - marker: b
    text: 此处也可译作“为了永生”或“引向永生”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τηρήσατε
  choice: 要保守
  rationale: 不定过去时主动命令语气第二人称复数，表达直接劝勉；“要保守自己”自然且保留命令力度。
- source_word: ἐν ἀγάπῃ θεοῦ
  choice: 常在上帝的爱中
  rationale: “在上帝的爱中”保留属格可能兼有上帝所施之爱和人对上帝之爱的歧义；加入“常”使汉语中的持续存留之意更自然，但不限定爱的方向。
- source_word: προσδεχόμενοι
  choice: 等候
  rationale: 现在时中间语态分词表示伴随主要命令的持续、期待姿态；“等候”简洁自然，不额外加入原文未明说的强烈程度。
- source_word: ἔλεος
  choice: 怜悯
  rationale: 新约语境中的常用对应词，表达出于慈悲而给予的不配得恩惠。
- source_word: κυρίου
  choice: 主
  rationale: 符合新约中 κύριος 的通常称谓用法。
- source_word: Ἰησοῦ Χριστοῦ
  choice: 耶稣弥赛亚
  rationale: Χριστός 在此仍具有称号意义；“弥赛亚”传达“受膏者”这一称号，而不是把它仅当作姓名的一部分。
- source_word: εἰς ζωὴν αἰώνιον
  choice: 直到永生
  rationale: εἰς 表示所指向的终点或结果；“直到永生”在现代汉语中简洁保留这一趋向，同时避免明确限定怜悯与永生之间究竟是时间、目的还是结果关系。
theological_decisions:
- issue: ἀγάπῃ θεοῦ 中属格 θεοῦ 的含义
  choice: 用“上帝的爱”保留歧义
  alternative: 上帝对你们的爱；你们对上帝的爱
  rationale: 该属格既可理解为上帝所施的爱，也可理解为以他为对象的爱；上下文并未要求译文排除其中一种。
- issue: Χριστοῦ 的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处 Χριστός 仍可辨认出称号功能；译作“弥赛亚”可明确呈现其称号意义，不把它悄然处理为普通姓名。
- issue: εἰς ζωὴν αἰώνιον 与前句的关系
  choice: 直到永生
  alternative: 为得永生；引向永生
  rationale: 原介词短语可表达方向、目的或结果；正文采用较少解释性的表达，并以脚注列出主要理解。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“保守自己常在……”承接20—21节的劝勉结构；“怜悯”“永生”保留新约常用神学词汇。所有脚注标记均已置于正文相应位置。
