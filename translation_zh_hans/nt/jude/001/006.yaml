  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἀγγέλους τε τοὺς μὴ τηρήσαντας τὴν ἑαυτῶν ἀρχὴν ἀλλὰ ἀπολιπόντας τὸ ἴδιον οἰκητήριον εἰς κρίσιν μεγάλης ἡμέρας δεσμοῖς ἀϊδίοις ὑπὸ ζόφον τετήρηκεν·
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/006.yaml
  text: And the angels who did not keep their own domain[a], but abandoned their proper dwelling[c][b], he has kept in eternal chains under gloom for the judgment of the great day.
translation:
  language: zh_hans
  text: 还有那些没有守住自己本来的地位[a]，反而离弃自己居所[b]的天使，他已用永远的锁链把他们拘禁在幽暗[c]中，留待那大日的审判。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “本来的地位”或译“自己的管辖范围”或“自己的权位”。
    reason: lexical_alternative
  - marker: b
    text: “自己居所”或译“本属于自己的住处”。
    reason: lexical_alternative
  - marker: c
    text: “幽暗”或译“深沉的黑暗”；希腊词表示浓重阴沉的黑暗。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγγέλους
  choice: 天使
  rationale: 在这一审判语境中，此词指超自然的灵界受造者；译作“使者”容易被理解为人间信使。
- source_word: τηρήσαντας / τετήρηκεν
  choice: 守住 / 拘禁
  rationale: 前一处译作“守住”，表达他们未持守所得的地位；后一处按锁链与审判的语境译作“拘禁”，比机械重复同一汉语动词更自然，同时保留“他们没有守住，反被拘禁”的对照。
- source_word: τὴν ἑαυτῶν ἀρχὴν
  choice: 自己本来的地位
  rationale: ἀρχή可指权柄、职位或所属领域。这里的译法表达天使未持守其原有或受派的位分，又不把含义限定为政治统治权或时间上的起点。
- source_word: ἀπολιπόντας
  choice: 离弃
  rationale: “离弃”既表达离开，也带出主动舍弃的意味，符合本节的审判语气。
- source_word: τὸ ἴδιον οἰκητήριον
  choice: 自己居所
  rationale: οἰκητήριον指居住之处，ἴδιον强调属于他们自己的；“自己居所”简明而不额外界定该居所的性质。
- source_word: εἰς κρίσιν μεγάλης ἡμέρας
  choice: 留待那大日的审判
  rationale: εἰς在这里指向审判这一目的或结局。“留待”用自然汉语表达这种指向，同时避免把介词直接解释成单纯的时间终点。
- source_word: δεσμοῖς ἀϊδίοις
  choice: 用永远的锁链
  rationale: δεσμοῖς可指锁链或捆绑；“锁链”形象清楚。ἀϊδίοις表达恒久不息，译作“永远的”符合庄重而通行的现代汉语。
- source_word: ὑπὸ ζόφον
  choice: 在幽暗之下
  rationale: ζόφος不是普通的黑暗，而是浓重、阴沉的幽暗；此译也保留ὑπό“在……之下”的空间意象。
- source_word: τε
  choice: 还有
  rationale: τε把本例与上文的审判事例相连；“还有”在汉语中自然表现追加例证的关系。
theological_decisions:
- issue: 天使所犯之罪的具体含义
  choice: 只说明他们未守住本来的地位，并离弃自己的居所
  alternative: 明确解释为《创世记》6章传统中的事件，或笼统解释为太初的天使堕落
  rationale: 本节可能唤起读者熟悉的犹太传统，但希腊文本本身没有详述其背景。正文不添加事件细节，以保留经文的含蓄性。
- issue: ἀΐδιος的效力
  choice: 永远的
  alternative: 永久的；恒久的
  rationale: 该词表达持续不息或永久的性质。“永远的”是现代汉语中清楚而标准的表达，同时不额外规定锁链与末日审判之间应如何作系统神学解释。
- issue: τετήρηκεν未明说的主语
  choice: 他
  alternative: 主；神
  rationale: 希腊文本沿用语境中的主语而未在本节重述其名号。译作“他”保留这种衔接，避免在本节正文中替原文补明称谓。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“还有……的天使，他已……”保留原句先提出受审者、再陈述处置的结构；“反而”清楚呈现ἀλλά的转折。“那大日”保留末世审判用语的凝练感。所有脚注标记均放在对应词语之后。
