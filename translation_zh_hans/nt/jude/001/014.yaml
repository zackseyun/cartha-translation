  text: Προεφήτευσεν δὲ καὶ τούτοις ἕβδομος ἀπὸ Ἀδὰμ Ἑνὼχ λέγων· Ἰδοὺ ἦλθεν κύριος ἐν ἁγίαις μυριάσιν αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/014.yaml
  text: And Enoch[a], the seventh from Adam, also prophesied to these, saying, “Behold[c][b], the Lord came with his holy myriads,”
translation:
  language: zh_hans
  text: 从亚当算第七代的以诺，也曾论到这些人说预言：“看哪，[a]主带着他的千万圣者来临了，[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的引文呼应《以诺一书》1:9。
    reason: cross_reference
  - marker: b
    text: “千万圣者”也可译作“数以万计的圣者”。原文 μυριάσιν 可指成万的数量或极其庞大的群体；这里没有明说这些圣者就是天使。
    reason: lexical_alternative
lexical_decisions:
- source_word: Προεφήτευσεν
  choice: 说预言
  rationale: 保留 προφητεύω 的先知性言说含义，不将其缩窄为单纯预告未来。
- source_word: δὲ καὶ
  choice: 也
  rationale: δέ在此是轻微的承接，καί具有添加作用；现代汉语用“也”即可自然推进论述。
- source_word: τούτοις
  choice: 针对这些人
  rationale: 与 προφητεύω 连用的与格可表示预言所针对或所涉及的对象；“针对”既符合上下文中不敬虔的闯入者，也保留可理解为“论到”或“向着”的空间。
- source_word: ἕβδομος ἀπὸ Ἀδὰμ
  choice: 亚当之后第七代的
  rationale: 表达从亚当起计算的家谱次序；现代汉语中“之后第七代”比直译“从亚当第七”清楚自然。
- source_word: Ἑνὼχ
  choice: 以诺
  rationale: 采用中文圣经传统中通行的人名译法。
- source_word: λέγων
  choice: 说
  rationale: 以自然、简洁的方式引出直接引语。
- source_word: Ἰδοὺ
  choice: 看哪
  rationale: 保留先知宣告中引人注意的庄严语气，同时在现代中文中仍易理解。
- source_word: ἦλθεν
  choice: 来临了
  rationale: 忠实体现不定过去时的完成式陈述；虽可能是“先知性过去时”，正文不擅自改译为未来。
- source_word: κύριος
  choice: 主
  rationale: 按原文只译作“主”，不额外指定所指是神还是耶稣。
- source_word: ἐν ἁγίαις μυριάσιν αὐτοῦ
  choice: 带着他的千万圣者
  rationale: ἐν在此按伴随意义译为“带着”；μυριάσιν可指万万、千万或庞大群体，“千万”自然表达浩大的数量；“圣者”不擅自具体化为天使。
theological_decisions:
- issue: 引文中“主”的身份
  choice: 正文只译作“主”
  alternative: 明确译为神，或明确译为主耶稣
  rationale: κύριος本身没有在本句明确身份；保留犹大书语境与《以诺一书》来源语境之间可能存在的神学张力。
- issue: 《以诺一书》引文的性质
  choice: 按犹大的表述将其呈现为以诺所说的预言，并以脚注标明呼应处
  alternative: 在正文中断定《以诺一书》的正典地位，或仅称其为后世传统
  rationale: 正文应忠实反映犹大的措辞，而不加入原文没有作出的正典判断。
- issue: ἦλθεν的时间指向
  choice: 译为“来临了”
  alternative: 译为“将要来临”
  rationale: 保留希腊文不定过去时的形式及先知性宣告的张力，不在翻译中直接解释为未来时。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“看哪”保留先知宣告的语体；“圣者”避免把原文未明说的群体直接解释为天使。所有脚注标记均置于正文相应位置。
