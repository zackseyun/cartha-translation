  verdict: revise
  source_fidelity: “亚当之后第七代”在现代汉语通常会理解为亚当之后再过七代，易将原文“从亚当算第七位”的家谱计数推进一代。应改为“从亚当算第七代”。τούτοις 的与格在此可表示所论及的对象；正文的“针对”较强，改为“论到”能保留原文及上下文所容许的指涉而不额外强化敌对意味。
  naturalness: “从亚当算第七代的以诺”清楚自然，也避免“之后第七代”的计数歧义。“论到这些人说预言”在庄重的现代书面语中顺畅。其余引文措辞和标点自然。
  terminology: “以诺”“主”“圣者”均恰当；“千万圣者”可作为表达庞大圣洁群体的庄重译法，脚注已说明其数量含义及未明说为天使。“来临了”适当保留ἦλθεν的过去时形式及预言性语境的张力。
  issues:
  - severity: medium
    issue: “亚当之后第七代”可能误计家谱世代。
    rationale: ἕβδομος ἀπὸ Ἀδὰμ意为从亚当算第七位；“之后第七代”在现代中文可理解为亚当之后的第七代，即未将亚当计入。
  - severity: low
    issue: “针对这些人”在正文中略强化了与格的含义。
    rationale: τούτοις可指预言所论及、关乎或针对的对象。上下文确实涉及不敬虔者，但“论到这些人”更直接保留这一与格的开放性；脚注可列“针对”为替代译法。
  revised_text: 从亚当算第七代的以诺，也曾论到这些人说预言：“看哪，[a]主带着他的千万圣者来临了，[b]”
