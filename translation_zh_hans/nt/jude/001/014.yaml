revisions:
- from: 亚当之后第七代的以诺，也曾针对这些人说预言：[a]“看哪，[b]主带着他的千万圣者来临了，[c]”
  to: 从亚当算第七代的以诺，也曾论到这些人说预言：“看哪，[a]主带着他的千万圣者来临了，[b]”
  rationale: 改正家谱计数的潜在歧义，并以“论到这些人”保留τούτοις与格的语义空间。原草稿将该词的说明脚注置于“说预言”之后，但其锚点实际附在引号前；为使每个脚注都紧贴所说明的词语，已将该脚注移除正文（正文采用较中性的“论到”），保留与引文和“千万圣者”直接对应的两个脚注。
