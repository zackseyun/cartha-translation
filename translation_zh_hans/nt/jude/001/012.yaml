id: JUD.1.12
reference: Jude 1:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οὗτοί εἰσιν ⸀οἱ ἐν ταῖς ἀγάπαις ὑμῶν σπιλάδες συνευωχούμενοι, ἀφόβως ἑαυτοὺς ποιμαίνοντες, νεφέλαι ἄνυδροι ὑπὸ ἀνέμων παραφερόμεναι, δένδρα φθινοπωρινὰ ἄκαρπα δὶς ἀποθανόντα ἐκριζωθέντα,
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/012.yaml
  text: These are hidden reefs at your love feasts[a], feasting together without fear, shepherding themselves; waterless clouds carried along by winds; autumn trees without fruit, twice dead[c][b], uprooted.
translation:
  language: zh_hans
  text: 这些人在你们的爱筵中是暗礁[a]；他们一同赴宴，毫无畏惧，只牧养自己[b][c]；他们是无水的云，随风飘荡；是秋天不结果子的树，死了两次、被连根拔起。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “暗礁”也可译作“污点”或“斑点”。这个希腊词可以从道德意义理解，也可指危险的礁石；后者较符合犹大在这里连续使用的鲜明比喻。
    reason: alternative_reading
  - marker: b
    text: “只牧养自己”也可译作“只喂养自己”，突出他们自私自利的行为。
    reason: lexical_alternative
  - marker: c
    text: 参《以西结书》34章，其中责备牧人只顾喂养自己，不喂养群羊。
    reason: cross_reference
lexical_decisions:
- source_word: σπιλάδες
  choice: 暗礁
  rationale: 该词可指礁石，也可理解为污点；在这里一连串鲜明的自然意象中，“暗礁”既保留隐藏危险的比喻，也符合宴席中潜伏危害的语境。
- source_word: ἀγάπαις
  choice: 爱筵
  rationale: 复数在此指基督徒群体以爱相交的共同宴席；“爱筵”简洁、准确，并保留与“爱”的词义联系。
- source_word: συνευωχούμενοι
  choice: 一同赴宴
  rationale: 分词表示共同参加宴席；此译自然地承接“爱筵”，且不额外补入原文未明说的对象。
- source_word: ἀφόβως
  choice: 毫无畏惧
  rationale: 保留原文“无惧”的开放含义，可涵盖肆无忌惮、毫不顾忌或缺乏敬畏，不提前限定为其中一种。
- source_word: ἑαυτοὺς ποιμαίνοντες
  choice: 只牧养自己
  rationale: 保留 ποιμαίνω 的牧养意象；加入“只”清楚传达反身结构在语境中的自私取向，同时不把意象缩减为单纯“喂饱自己”。
- source_word: νεφέλαι ἄνυδροι
  choice: 无水的云
  rationale: 直观保留看似带来雨水、实则不能供应的鲜明意象。
- source_word: ὑπὸ ἀνέμων παραφερόμεναι
  choice: 被风吹来吹去
  rationale: 体现被动地受风力带动，并以自然现代汉语表达漂移不定的画面。
- source_word: δένδρα φθινοπωρινὰ ἄκαρπα
  choice: 秋天不结果子的树
  rationale: 保留秋季本应见到果实却无果的具体意象，不先将其抽象化为“毫无成果”。
- source_word: δὶς ἀποθανόντα
  choice: 死了两次
  rationale: 直接保留原文刻意而强烈的措辞，不解释为“完全死了”，以保存其修辞张力和可能的多重理解。
- source_word: ἐκριζωθέντα
  choice: 被连根拔起
  rationale: 比单说“拔起”更完整地呈现根被除去、生命断绝的图像。
theological_decisions:
- issue: σπιλάδες 对这些人的描写
  choice: 译作群体爱筵中的危险“暗礁”
  alternative: 爱筵中的污点或污秽
  rationale: 上下文是一系列自然界的比喻，“暗礁”最能衔接隐藏危险的意象；但该词的“污点”理解有词义和译本传统依据，因此在脚注保留。
- issue: ἑαυτοὺς ποιμαίνοντες 的含义
  choice: 保留“牧养”比喻，译作“只牧养自己”
  alternative: 只喂饱自己
  rationale: ποιμαίνω 通常指牧养；保留这一表达可让读者看见自私牧者的意象，并与《以西结书》34章形成呼应，而不把含义过早收窄为吃喝。
- issue: δὶς ἀποθανόντα 的修辞张力
  choice: 直译为“死了两次”
  alternative: 完全死了
  rationale: 原文没有明说两次死亡各指什么；直译保存其刻意的悖论性和神学张力，避免代替作者作出单一解释。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。句子以分号呈现原文连续、密集的比喻；“爱筵”为较凝练的基督徒共同宴席称谓，并由上下文使其含义清楚。“死了两次”刻意保留原文的陌生感和张力。
