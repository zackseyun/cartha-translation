source:
  edition: SBLGNT
  text: ὑμεῖς δέ, ἀγαπητοί, ⸂ἐποικοδομοῦντες ἑαυτοὺς τῇ ἁγιωτάτῃ ὑμῶν πίστει⸃, ἐν πνεύματι ἁγίῳ προσευχόμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/020.yaml
  text: But you[a], beloved, building yourselves up in your most holy faith and praying in the Holy Spirit[c][b],
translation:
  language: zh_hans
  text: 但你们，亲爱的，要在你们至圣的信仰[c]上造就自己[a]，并在圣灵里[b]祷告，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在你们至圣的信仰中造就自己”。这里的希腊语既可表示在根基上建造，也可表示在信仰中得到造就。
    reason: lexical_alternative
  - marker: b
    text: 或译“借着圣灵祷告”。这个短语既可侧重祷告是在圣灵里进行，也可侧重圣灵使人能够祷告。
    reason: alternative_reading
  - marker: c
    text: “信仰”在这里也可理解为“信靠”或“忠信”，不过在犹大书的语境中，更可能指群体共同持守的基督信仰。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς δέ
  choice: 但你们
  rationale: δέ承接上文形成对比，明说的ὑμεῖς带有强调；“但你们”自然保留这两层作用。
- source_word: ἀγαπητοί
  choice: 亲爱的
  rationale: 这是带感情色彩且庄重的复数呼语，称呼同属信仰群体的人；“亲爱的”符合现代汉语，又不削弱原文分量。
- source_word: ἐποικοδομοῦντες ἑαυτούς
  choice: 造就自己
  rationale: ἐποικοδομέω保留建造、加强的比喻，复数反身代词指整个受信群体；“造就自己”既保留反身意义，也容纳群体共同成长的含义。
- source_word: τῇ ἁγιωτάτῃ ὑμῶν πίστει
  choice: 在你们至圣的信仰上
  rationale: 与建造比喻相连时，间接受格可表示建造所依据的根基；“在……上”在汉语中清楚保留这一图像。ἁγιωτάτῃ是最高级，以“至圣”表达；πίστις按语境译作“信仰”。
- source_word: πίστει
  choice: 信仰
  rationale: 本处很可能指群体共同领受和持守的基督信仰，而不主要指个人的忠信表现；“信仰”也仍可涵盖信靠之意。
- source_word: ἐν πνεύματι ἁγίῳ
  choice: 在圣灵里
  rationale: 短语最自然地指神圣的圣灵；直译ἐν为“在……里”，保留祷告所处领域或受其影响的含义，不强行限定为工具作用。
- source_word: προσευχόμενοι
  choice: 祷告
  rationale: 现在时分词与前面的ἐποικοδομοῦντες并列，并衔接下一节的主要劝勉；译文用“并”保持动作的并列和句子的延续。
theological_decisions:
- issue: ἐν πνεύματι ἁγίῳ所指
  choice: 指神圣的圣灵
  alternative: 指人的圣洁心灵或属灵状态
  rationale: 早期基督徒的惯用表达及犹大书劝勉的语境，都更支持将其理解为圣灵；同时采用“在……里”而非“借着”，避免过度限定圣灵发挥作用的方式。
- issue: πίστις在“你们至圣的信仰”中的意义
  choice: 信徒共同领受的基督信仰
  alternative: 个人信靠的行动；忠信
  rationale: 犹大书此前所说“一次交付给圣徒的信仰”支持群体共同信仰这一理解；正文仍用词义宽广的“信仰”，并以脚注保留其他可能。
- issue: 分词与劝勉主句的关系
  choice: 按劝勉语气译出，并以句末逗号保持与下一节相连
  alternative: 将两个分词译成独立完成的命令句
  rationale: ἐποικοδομοῦντες与προσευχόμενοι在语法上从属于下一节的主要命令；本节单独呈现时用“要”使汉语可读，同时用逗号提示句法尚未结束。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“亲爱的”“至圣”“造就”保留书信劝勉的温度和神学分量。句末保留逗号，因为希腊文的两个分词继续引向下一节的主要命令。
