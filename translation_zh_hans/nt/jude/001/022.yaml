  yaml_path: translation/nt/jude/001/022.yaml
  text: And have mercy on those who are doubting,[a]
translation:
  language: zh_hans
  text: 要怜悯那些疑惑的人；[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“那些动摇的人”；也可能译“那些争辩的人”。这里的希腊语分词可表达不止一种含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: 要
  rationale: 本节在一连串劝勉中承接上文；汉语用祈使语气自然衔接，无须机械译出“并且”。
- source_word: οὓς μὲν
  choice: 那些……的人
  rationale: 关系代词指向随后描述的一类人；μέν标示分组，并与后续经文形成对应，现代汉语不必直译为“一方面”。
- source_word: ἐλεᾶτε
  choice: 怜悯
  rationale: 准确表达施予怜悯、体恤的祈使含义，简洁而庄重。
- source_word: διακρινομένους
  choice: 疑惑
  rationale: 该分词在此可指疑惑、动摇，也可能指争辩；正文采用最符合牧养语境的“疑惑”，并用脚注保留真实的词义歧义。
theological_decisions:
- issue: διακρινομένους在对待受威胁信徒的牧养语境中的含义
  choice: 那些疑惑的人
  alternative: 那些动摇的人；那些争辩的人
  rationale: “疑惑”将这群人呈现为信心不确定、需要怜悯的人，符合本句的命令；但原词并不排除“动摇”或“争辩”，因此不作教义性的单一化处理，而在脚注中保留其他可能。
translation_notes:
  register: 采用现代、自然而庄重的标准普通话。“怜悯”保留经文的伦理和牧养力度；句末分号体现本句与后续分组劝勉的紧密联系。
