source:
  edition: SBLGNT
  text: ὡς Σόδομα καὶ Γόμορρα καὶ αἱ περὶ αὐτὰς πόλεις, τὸν ὅμοιον ⸂τρόπον τούτοις⸃ ἐκπορνεύσασαι καὶ ἀπελθοῦσαι ὀπίσω σαρκὸς ἑτέρας, πρόκεινται δεῖγμα πυρὸς αἰωνίου δίκην ὑπέχουσαι.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/007.yaml
  text: just as Sodom and Gomorrah and the cities around them[a], having in like manner committed sexual immorality and gone after other flesh, are set forth as an example[b], undergoing the punishment of eternal fire.
translation:
  language: zh_hans
  text: 又如所多玛、蛾摩拉和周围的城邑，也以和这些相同的方式[a]行淫，追求别样的肉体[b]；它们被摆在众人眼前作为鉴戒，承受永火的刑罚。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这些”可能指上一节所说的天使，也可能较宽泛地指前文那些反叛并受审判的事例。
    reason: alternative_reading
  - marker: b
    text: 或译“不同的肉体”；传统译法为“陌生的肉体”。这里按原文直译，不把它限定为某一种具体解释。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: 又如
  rationale: 引出本例与上文审判事例的比较；“又如”在现代汉语中自然地承接上下文。
- source_word: Σόδομα καὶ Γόμορρα
  choice: 所多玛、蛾摩拉
  rationale: 采用现代中文圣经读者熟悉的传统地名译法。
- source_word: αἱ περὶ αὐτὰς πόλεις
  choice: 周围的城邑
  rationale: 准确表达围绕所多玛和蛾摩拉的邻近城市；“城邑”庄重而易懂。
- source_word: τὸν ὅμοιον τρόπον τούτοις
  choice: 也以与这些相同的方式
  rationale: 保留原文中的指示代词“这些”和明确的比较关系，同时不在正文中断定其具体所指。
- source_word: ἐκπορνεύσασαι
  choice: 淫乱
  rationale: 直接表达该强化动词所指的性方面的不道德行为，不作委婉化或过度具体化。
- source_word: ἀπελθοῦσαι ὀπίσω
  choice: 追求
  rationale: 自然表达这一希腊语惯用语中跟随、追逐某对象的含义。
- source_word: σαρκὸς ἑτέρας
  choice: 别样的肉体
  rationale: 保留σάρξ的字面意象和ἕτερος所表达的“另一种、不同”之意，不把争议性的具体所指写入正文。
- source_word: πρόκεινται
  choice: 被摆在众人眼前
  rationale: 传达公开陈列、呈现出来的意思，并使中文形象清楚。
- source_word: δεῖγμα
  choice: 鉴戒
  rationale: 该词指被展示出来的例证；在审判语境中，“鉴戒”自然体现其警示作用。
- source_word: πυρὸς αἰωνίου
  choice: 永火
  rationale: 简洁、直接地保留“永恒之火”的审判措辞，不扩展为系统神学陈述。
- source_word: δίκην ὑπέχουσαι
  choice: 承受……的刑罚
  rationale: 保留司法性语义，并以现代汉语自然表达遭受刑罚。
theological_decisions:
- issue: τούτοις（“这些”）的所指
  choice: 正文译作“以与这些相同的方式”，保留代词而不确定其先行词。
  alternative: 可理解为指第6节的天使，也可较宽泛地指上文反叛并受审判的事例。
  rationale: 希腊文明确作出比较，但代词的具体所指存在真实歧义；译文不应替读者消除这一张力。
- issue: σαρκὸς ἑτέρας的具体含义
  choice: 译作“别样的肉体”。
  alternative: “不同的肉体”“陌生的肉体”；或解释性地限定为某一种性行为或跨越天使与人类界限的行为。
  rationale: 原文措辞本身没有明确限定其具体性质；保留字面表达，可避免加入经文未明说的教义判断。
- issue: πυρὸς αἰωνίου的神学力度
  choice: 译作“永火”。
  alternative: “永恒之火”“永远的火”。
  rationale: 直接保留原文严肃的审判语言，同时不将本节扩写为超出经文本身的完整教义说明。
translation_notes:
  register: 采用现代、庄重且普通读者可懂的书面汉语。“城邑”“鉴戒”“永火”保持经文语体的凝练与分量；“这些”和“别样的肉体”刻意保留原文的解释空间。所有脚注标记均置于其所说明的短语之后。
