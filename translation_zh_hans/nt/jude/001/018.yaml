id: JUD.1.18
reference: Jude 1:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὅτι ἔλεγον ⸀ὑμῖν· ⸂Ἐπ’ ἐσχάτου χρόνου⸃ ἔσονται ἐμπαῖκται κατὰ τὰς ἑαυτῶν ἐπιθυμίας πορευόμενοι τῶν ἀσεβειῶν.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/018.yaml
  text: that they were saying to you[a], “In the last time there will be mockers[b], going according to their own ungodly desires.”
translation:
  language: zh_hans
  text: 他们曾对你们说：“在末后的时期[a]，必有嘲弄者[b]出现，顺着自己不敬虔的欲望而行。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在末期”或“在时间的末了”。希腊文“时期”为单数，并非“日子”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“讥诮者”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: 曾对你们说
  rationale: 未完成时表示过去持续或反复的言说；“曾对你们说”在现代汉语中自然地保留过去言说的背景，又不把反复程度说得过满。
- source_word: Ἐπ’ ἐσχάτου χρόνου
  choice: 在末后的时期
  rationale: 保留 χρόνος 的单数形式及末世意味，不改写成更熟悉却并非原文措辞的“末后的日子”。
- source_word: ἐμπαῖκται
  choice: 嘲弄者
  rationale: 准确表达以讥讽、嘲笑反对真道的人，现代读者也容易理解；“讥诮者”可作较传统的译法。
- source_word: κατὰ τὰς ἑαυτῶν ἐπιθυμίας
  choice: 顺着自己的……欲望
  rationale: κατά 加宾格表示依从、按照；“顺着”符合汉语表达。ἐπιθυμίαι 含义宽泛，因此译作“欲望”，不局限为性方面的情欲。
- source_word: πορευόμενοι
  choice: 而行
  rationale: 该分词本义为行走、行进，此处比喻生活行事；“而行”既保留行走意象，也自然表达行为方式。
- source_word: τῶν ἀσεβειῶν
  choice: 不敬虔的
  rationale: 该属格最自然地修饰“欲望”，说明这些欲望带有不敬畏神的性质；形容词式表达在汉语中清楚自然。
- source_word: ἔσονται
  choice: 必有……出现
  rationale: 表达将来会有这类人出现；“必有”保留预告的确定语气，“出现”使汉语句式完整自然。
theological_decisions:
- issue: 末世时间用语
  choice: 在末后的时期
  alternative: 在末期；在时间的末了；在末后的日子
  rationale: 保留原文单数 χρόνος 的独特表述，不与其他经文常见的“末后的日子”相调和，同时维持其末世论张力。
- issue: 欲望的道德性质
  choice: 不敬虔的欲望
  alternative: 不敬虔所生的欲望；邪欲；私欲
  rationale: 清楚保留原文对这些欲望的宗教和道德判断，同时不把 ἐπιθυμίαι 过度收窄为性欲或某一种具体欲望。
- issue: 嘲弄者的性质
  choice: 嘲弄者
  alternative: 讥诮者；好讥笑的人
  rationale: 采用现代、易懂而庄重的称呼，不额外限定他们嘲弄的具体对象。
translation_notes:
  register: 采用现代标准普通话，语气庄重而清晰。“末后的时期”保留原文单数时间表达；“嘲弄者”比“讥诮者”更符合当代常用语，但以后者作为脚注备选。“顺着……欲望而行”兼顾原文结构和汉语自然度。
