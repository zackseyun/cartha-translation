  text: ὅτι ἵλεως ἔσομαι ταῖς ἀδικίαις αὐτῶν, καὶ τῶν ἁμαρτιῶν ⸀αὐτῶν οὐ μὴ μνησθῶ ἔτι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/012.yaml
  text: For I will be merciful toward their unrighteousness[b][a], and I will remember their sins no more.
translation:
  language: zh_hans
  text: 因为我要宽恕他们的不义[a]，也绝不再记念他们的罪[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我要以怜悯对待他们的不义。”原文“不义”可指不正、恶行或不公之事；这里的复数可着重具体的过犯。
    reason: lexical_alternative
  - marker: b
    text: 直译：“我绝不再记念他们的罪。”这是约的语境中表示完全赦免的说法，不是说神在认知上忘记了这些罪。
    reason: theological_clarification
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 在这段引文中引出前述新约应许的根据；“因为”自然保留了解释性的语气。
- source_word: ἵλεως ἔσομαι ταῖς ἀδικίαις αὐτῶν
  choice: 我要宽恕他们的不义
  rationale: ἵλεως 表示施怜悯、宽厚相待；与表示对象的与格连用时，此处指神对人的不义予以赦免。“宽恕”符合现代汉语习惯，也避免“宽容”可能带来的姑息之意。ἀδικίαις 是复数，但汉语集合名词“不义”无需机械表达复数，且保留其兼指不正与恶行的语义范围。
- source_word: καὶ
  choice: 也
  rationale: 连接两个彼此呼应的约中应许；汉语用“也”比重复使用“并且”更自然。
- source_word: τῶν ἁμαρτιῶν αὐτῶν
  choice: 他们的罪
  rationale: ἁμαρτία 的复数在汉语中自然译作“罪”，既可涵盖罪行，也保留经文的核心宗教伦理用语。
- source_word: οὐ μὴ μνησθῶ ἔτι
  choice: 绝不再记念
  rationale: οὐ μή 加虚拟式构成强烈否定，ἔτι 表示“不再”；“绝不再”保留强调语气。“记念”保留圣约语境中的经文惯用意象，而不将其改写为解释性的“不再追究”。
theological_decisions:
- issue: 神“不再记念”罪的含义
  choice: 保留“不再记念”的圣约性表达
  alternative: 直接解释为“不再追究”或理解为神在认知上忘记这些罪
  rationale: 原文以“记念”表达彻底赦免和不再定罪的应许。正文保留这一具有神学张力的意象，不把它化约为对神认知能力的陈述；脚注说明其约的语境。
- issue: ἵλεως 与赦罪的关系
  choice: 译为“宽恕”
  alternative: 译为“怜悯”或“恩待”
  rationale: 原文的与格对象是“他们的不义”，现代汉语不能自然地说“怜悯不义”或“恩待不义”；“宽恕他们的不义”准确传达此处有利、施怜悯的处置，又不引入特定宗派术语。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“宽恕他们的不义”符合汉语搭配；“绝不再记念”既体现 οὐ μή 的强烈否定，也保留圣经圣约语言的意象。
