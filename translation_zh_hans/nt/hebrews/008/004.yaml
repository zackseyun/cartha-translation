source:
  edition: SBLGNT
  text: εἰ μὲν ⸀οὖν ἦν ἐπὶ γῆς, οὐδ’ ἂν ἦν ἱερεύς, ⸀ὄντων τῶν προσφερόντων κατὰ ⸀νόμον τὰ δῶρα·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/004.yaml
  text: If he were on earth[a], he would not even be a priest, since there are those who offer the gifts according to the law.
translation:
  language: zh_hans
  text: 因此，他若在地上，甚至不会是祭司，因为已经有人按律法献上供物[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“礼物”。希腊文作“礼物”，在这里是献祭语境中的常用词。
    reason: 说明δῶρα的字面义，并交代正文“供物”所反映的祭祀语境义。
lexical_decisions:
- source_word: εἰ μὲν οὖν
  choice: 所以，他若
  rationale: οὖν承接上文并引出推论，译作“所以”；εἰ引出假设条件，译作“若”。μὲν的篇章作用不宜在中文中生硬另译。
- source_word: ἦν ἐπὶ γῆς
  choice: 在地上
  rationale: 此处与上下文中的天上领域形成对照；现代汉语“在地上”自然、清楚，并保留原文的空间表达。
- source_word: οὐδ’ ἂν ἦν ἱερεύς
  choice: 就连祭司也不会是
  rationale: οὐδέ加强否定，译作“连……也不”；ἄν与未完成时构成与事实相反的条件结果，中文用“不会”表达。
- source_word: ὄντων τῶν προσφερόντων
  choice: 因为已有……的人
  rationale: 属格独立结构在此说明前句的理由；译作“因为已有……的人”既传达因果关系，也不额外指明这些人的身份。
- source_word: κατὰ νόμον
  choice: 照着律法
  rationale: 指依照律法所规定的祭司献礼制度；“照着律法”准确而符合现代中文表达。
- source_word: τὰ δῶρα
  choice: 礼物
  rationale: δῶρα字面为“礼物”，在祭祀语境中指献给上帝的供物。正文保留其词汇形式，并以脚注说明语境义。
theological_decisions:
- issue: 条件句中省略的主语
  choice: 补出“他”，承接上下文所说的耶稣／弥赛亚
  alternative: 不明说主语
  rationale: 希腊文可以省略主语，中文则需明确承接对象；上下文所指清楚，补出“他”只是使句意完整，并未加入额外教义。
- issue: 条件句的事实状态
  choice: 译为与事实相反的假设：“若在地上……不会是”
  alternative: 译作一般性的现实条件：“如果他在地上……就不是”
  rationale: εἰ加未完成时、结果句含ἄν加未完成时，表明与事实相反的条件。中文用“若……不会……”自然传达这一语气，同时保留论证的张力。
- issue: 献礼者的身份
  choice: 译作“已有……的人”，不在正文补入“祭司”
  alternative: 译作“已有祭司……”
  rationale: 虽然语境表明献礼者是祭司，原文这里只说“那些献上的人”。不补入身份可更贴近原文，并避免把语境推论写进正文。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“所以”保留推论关系；“若……就连……也不会……”自然表达与事实相反的条件。脚注标记紧接其所说明的“礼物”，避免歧义。
