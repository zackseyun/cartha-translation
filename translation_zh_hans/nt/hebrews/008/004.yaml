  to: 因此，他若在地上，甚至不会是祭司，因为已经有人按律法献上供物[a]。
  rationale: 修正不自然的汉语语序，并将祭祀语境中的δῶρα译为“供物”。“因此”保留οὖν的推论作用；“若……甚至不会……”表达原文与事实相反的条件及οὐδέ的加强否定；“有人”不补入原文未明说的“祭司”身份。
