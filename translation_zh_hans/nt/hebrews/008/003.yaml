id: HEB.8.3
reference: Hebrews 8:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: πᾶς γὰρ ἀρχιερεὺς εἰς τὸ προσφέρειν δῶρά τε καὶ θυσίας καθίσταται· ὅθεν ἀναγκαῖον ἔχειν τι καὶ τοῦτον ὃ προσενέγκῃ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/003.yaml
  text: For every high priest is appointed to offer both gifts and sacrifices[a]; therefore it is necessary for this one also to have something that he may offer.
translation:
  language: zh_hans
  text: 因为每一位大祭司都是为献上礼物和祭物而受任命的；所以，这一位[a]也必须有东西可以献上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这一位”原文没有明说姓名；按上下文，是指作为大祭司的耶稣。
    reason: 说明指示代词的上下文所指，同时避免在正文中补入原文没有的姓名。
lexical_decisions:
- source_word: πᾶς γὰρ ἀρχιερεὺς
  choice: 因为每一位大祭司
  rationale: πᾶς与单数名词连用，具有逐一涵盖的意思，译作“每一位”；γάρ承接上文作解释，译作“因为”；ἀρχιερεύς按《希伯来书》的祭司语境译作“大祭司”。
- source_word: εἰς τὸ προσφέρειν
  choice: 为献上
  rationale: εἰς加冠词化不定式表示目的；“为献上”在现代汉语中简洁自然，并保留目的含义。
- source_word: δῶρά τε καὶ θυσίας
  choice: 礼物和祭物
  rationale: 保留δῶρα与θυσίαι两个不同的礼仪范畴，不合并为一个概括性用语；汉语用“和”自然连接二者。
- source_word: καθίσταται
  choice: 受任命
  rationale: 此处被动形式指被设立或委任担任大祭司职分；“受任命”既符合职分语境，也比直译“被设立”更符合现代汉语。
- source_word: ὅθεν
  choice: 所以
  rationale: ὅθεν引出由前述普遍原则所得的推论；“所以”清楚表达这一逻辑关系。
- source_word: ἀναγκαῖον ἔχειν
  choice: 必须有
  rationale: 该结构表达必要性；译作“必须有”比形式化的“有必要拥有”更自然直接。
- source_word: τι
  choice: 东西
  rationale: 不定代词τι指未明确说明的某种可献之物；“东西”保留其不特定性，且与后面的“可以献上”连用自然。
- source_word: καὶ τοῦτον
  choice: 这一位也
  rationale: “这一位”保留τοῦτον的指示意味，不在正文中补出原文未明说的姓名；“也”对应καί，并把这一位大祭司纳入前述普遍原则。
- source_word: ὃ προσενέγκῃ
  choice: 可以献上
  rationale: 关系代词加不定过去时虚拟式说明所拥有之物的预期用途或可能行动；“有东西可以献上”在汉语中自然地保留这一含义。
theological_decisions:
- issue: “这一位”（τοῦτον）所指是谁
  choice: 正文保留指示语“这一位”，脚注说明按上下文是指作为大祭司的耶稣。
  alternative: 在正文直接补作“耶稣”或“基督”。
  rationale: 上下文足以确定所指，但希腊文本本身使用指示代词而非姓名。保留“这一位”避免把解释直接写入正文，同时以脚注帮助读者理解。
- issue: 礼仪术语的区分
  choice: 分别译作“礼物和祭物”。
  alternative: 合并或释义为“各种供物”或“献祭的礼物”。
  rationale: 经文列出两个祭司礼仪范畴；分别保留可维持原文的精确性，也避免在本节提前展开基督献上自己的神学解释。
- issue: 这位大祭司所献之物的具体内容
  choice: 只译作“东西”，不在正文中明确说明其内容。
  alternative: 解释为“他自己”“身体”或某种天上的祭物。
  rationale: 本节的τι是不定代词，原文本身没有在此明说所献之物。译文应保留这种未指明状态，让后续论述自行展开。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“大祭司”“礼物”“祭物”保留《希伯来书》的祭司礼仪语汇；句式用“因为……所以……”清楚呈现解释与推论的关系。
