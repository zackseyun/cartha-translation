  to: 不像我在拉着他们的手、领他们出埃及地的那日与他们的列祖所立的约；因为他们没有持守我的约，我也不顾念他们，主说。
  rationale: 删除无原文依据的“再”，以“不顾念”对应ἠμέλησα，并将引语公式调整为“主说”。其余措辞保留，因其在原文忠实度、中文自然度及经文语域上均可接受。
