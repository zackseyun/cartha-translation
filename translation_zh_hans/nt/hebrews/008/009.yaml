  - marker: b
    text: 本节引文依照《希伯来书》所反映的希腊文措辞：“我也不顾念他们。”《耶利米书》31:32的希伯来文本含义不同，常译作：“虽然我作了他们的丈夫”，或“虽然我是他们的主人”。
    reason: 说明希腊文《希伯来书》与《耶利米书》希伯来文本之间具有神学和互文意义的异读。
  revision_rationale: 删除无原文依据的“再”，以“不顾念”对应ἠμέλησα，并将引语公式调整为“主说”。其余措辞保留，因其在原文忠实度、中文自然度及经文语域上均可接受。
