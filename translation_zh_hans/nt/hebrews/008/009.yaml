source:
  edition: SBLGNT
  text: οὐ κατὰ τὴν διαθήκην ἣν ἐποίησα τοῖς πατράσιν αὐτῶν ἐν ἡμέρᾳ ἐπιλαβομένου μου τῆς χειρὸς αὐτῶν ἐξαγαγεῖν αὐτοὺς ἐκ γῆς Αἰγύπτου, ὅτι αὐτοὶ οὐκ ἐνέμειναν ἐν τῇ διαθήκῃ μου, κἀγὼ ἠμέλησα αὐτῶν, λέγει κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/009.yaml
  text: not like the covenant that I made with their fathers on the day when I took hold of their hand to bring them out of the land of Egypt[a], because they did not continue in my covenant, and I disregarded them[b], says the Lord.
translation:
  language: zh_hans
  text: 不像我在拉着他们的手、领他们出埃及地的那日与他们的列祖所立的约；因为他们没有持守我的约，我也不顾念他们，主说。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαθήκην
  choice: 约
  rationale: 在《希伯来书》引用耶利米新约应许的语境中，指上帝与其子民所立的约；“约”准确、自然，也避免“遗嘱”造成误解。
- source_word: τοῖς πατράσιν αὐτῶν
  choice: 他们的列祖
  rationale: 指以色列人的先祖；“列祖”保留原文阳性复数及经文历史语境，又符合现代中文圣经体裁。
- source_word: ἐν ἡμέρᾳ ἐπιλαβομένου μου τῆς χειρὸς αὐτῶν
  choice: 那时，我拉着他们的手
  rationale: 将属格独立结构按时间关系表达；“拉着他们的手”保留单数“手”的具体形象，同时在中文中自然。
- source_word: ἐξαγαγεῖν αὐτοὺς ἐκ γῆς Αἰγύπτου
  choice: 领他们出了埃及地
  rationale: “领……出”兼顾ἐξάγω的带领和使之出来之意，并与拉手的形象连贯；“埃及地”保留γῆς。
- source_word: οὐκ ἐνέμειναν ἐν τῇ διαθήκῃ μου
  choice: 没有持守我的约
  rationale: ἐμμένω表示持续留在或坚持于某种委身中；中文“持守约”自然地表达持续忠于盟约，而不把意思缩减为单纯留在其中。
- source_word: κἀγὼ ἠμέλησα αὐτῶν
  choice: 我也不再顾念他们
  rationale: κἀγώ按字面保留为“我也”；ἀμελέω带有不予关切、忽视之意，“不再顾念”以自然中文传达关系性的撤回关顾，同时不强化为主动弃绝。
- source_word: λέγει κύριος
  choice: 这是主说的
  rationale: 作为引文公式，“这是主说的”在现代中文中庄重自然，并保留κύριος为“主”。
theological_decisions:
- issue: ἠμέλησα αὐτῶν与《耶利米书》31:32希伯来文本措辞不同
  choice: 我也不再顾念他们
  alternative: 虽然我作了他们的丈夫／主人
  rationale: 《希伯来书》的希腊文本明确使用ἠμέλησα，意为忽视、不予关切，故正文以希腊文为准；希伯来文本所反映的不同意义具有重要互文和神学价值，列入脚注而不在正文中调和。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“列祖”“立约”“持守”等词保留经文语域，但避免生硬古奥；标点按中文完整引语节奏处理。
