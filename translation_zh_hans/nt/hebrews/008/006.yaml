  text: ⸀νυνὶ δὲ διαφορωτέρας τέτυχεν λειτουργίας, ὅσῳ καὶ κρείττονός ἐστιν διαθήκης μεσίτης, ἥτις ἐπὶ κρείττοσιν ἐπαγγελίαις νενομοθέτηται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/006.yaml
  text: But as it is[a], he has obtained a more excellent ministry, by as much as he is also the mediator of a better covenant[c][b], which has been enacted on better promises.
translation:
  language: zh_hans
  text: 但如今，他已经得了更卓越的事奉；他作更美之约的中保，这约是依据更美的应许而设立的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “设立”或译“颁立”。
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: 但如今
  rationale: 同时表达与前文地上祭司之职的转折和现今处境；简洁自然。
- source_word: διαφορωτέρας
  choice: 更卓越的
  rationale: 这里的比较级强调质的优越；“更卓越”既保留比较意味，也符合《希伯来书》较庄重的文体。
- source_word: τέτυχεν
  choice: 已经得了
  rationale: 希腊文完成时表示已经取得并持续拥有的状态；“已经得了”在现代汉语中自然地兼顾这两方面。
- source_word: λειτουργίας
  choice: 事奉职分
  rationale: 语境所指是基督神圣的祭司性服事；“事奉职分”比单说“职分”更显出服事性质，又不把上下文已表明的“祭司”重复加入正文。
- source_word: ὅσῳ καὶ
  choice: 因为……也
  rationale: 原文以比较关联结构说明职分的卓越与所中保之约的优越相应。汉语直译为“多少……也多少”生硬，故以自然的因由表达承载论证关系，同时由前后两个“更”保留相应的比较。
- source_word: κρείττονός ... διαθήκης
  choice: 更美之约
  rationale: κρείττων是《希伯来书》反复出现的“更优越”用语；“更美”是庄重而通行的汉语表达。διαθήκη在本段承接耶利米书的新约应许，故译“约”。
- source_word: μεσίτης
  choice: 中保
  rationale: 准确表达处于双方之间、促成并维系立约关系者的法律和神学角色；也是普通中文圣经读者能够理解的既有术语。
- source_word: ἥτις
  choice: 这约
  rationale: 明确回指前面的“更美之约”，符合现代汉语，且不额外加强原文关系代词可能带有的定性意味。
- source_word: ἐπὶ κρείττοσιν ἐπαγγελίαις
  choice: 以更美的应许为依据
  rationale: ἐπί加与格在此表示根据或基础；此译比字面对译“在……之上”更清楚。
- source_word: νενομοθέτηται
  choice: 颁立
  rationale: 完成时被动态表示这约已经正式制定、设立，并继续有效；“颁立”兼顾法律性和设立之意，避免泛化为单纯“建立”。
theological_decisions:
- issue: 希伯来书8:6中διαθήκη的译法
  choice: 约
  alternative: 遗嘱
  rationale: 本章紧接着引用耶利米所预告的“新约”，并论述祭司职分与中保，因此“约”最贴合直接的旧约背景。“遗嘱”虽在某些语境中可表达διαθήκη，却会模糊本段的立约主题。
- issue: ὅσῳ καὶ所表达的比较关系
  choice: 用“因为……也”表达，并以两个比较级“更卓越／更美”保留对应关系
  alternative: 直译为“优越多少，就因……更美多少”
  rationale: 原文把基督职分的优越程度与他所中保之约的优越相联系。所选译法不把这种联系解释成某一特定教义机制，同时避免不自然的汉语比例句。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“更美之约”“中保”保留本段关键的圣经神学词汇；“事奉职分”说明λειτουργία的神圣服事性质，但不在正文中额外补入“祭司的”。脚注标记均置于其所说明的词语之后。
