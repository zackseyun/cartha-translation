  text: καὶ οὐ μὴ διδάξωσιν ἕκαστος τὸν πολίτην αὐτοῦ καὶ ἕκαστος τὸν ἀδελφὸν αὐτοῦ, λέγων· Γνῶθι τὸν κύριον, ὅτι πάντες εἰδήσουσίν με ἀπὸ ⸀μικροῦ ἕως μεγάλου αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/011.yaml
  text: And they will certainly not teach[a], each one his fellow citizen and each one his brother, saying, ‘Know the Lord,’ because they will all know me, from the least of them to the greatest.
translation:
  language: zh_hans
  text: 他们各人绝不会教导自己的同胞[a]，也不会教导自己的弟兄，说：“你要认识主。”因为他们全都必认识我，从他们当中最小的到最大的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“邻舍”。《希伯来书》的希腊文本作“同为公民的人”，而其所引用的《耶利米书》经文通常译作“邻舍”。
    reason: 说明现存希腊文本的具体措辞，以及与耶利米书传统译法之间的差异。
lexical_decisions:
- source_word: οὐ μὴ διδάξωσιν
  choice: 绝不会教导
  rationale: οὐ μή与不定过去时虚拟语气构成强烈否定；“绝不会”在现代汉语中自然地保留其强调语气。
- source_word: ἕκαστος
  choice: 谁也……谁也
  rationale: 原文两次使用ἕκαστος，强调群体中每一个人。汉语在否定句中以两次“谁也”自然表达这种逐一分配的意义，并保留原文的重复。
- source_word: πολίτην
  choice: 同胞
  rationale: πολίτης本指同一城邦或共同体中的公民。“同胞”在现代汉语中可自然指同国或同一共同体的人，比生硬的“同为公民的人”更易懂；脚注说明其字面含义及耶利米书传统译法。
- source_word: ἀδελφόν
  choice: 弟兄
  rationale: 保留阳性单数和盟约群体中的亲属称谓；“弟兄”具有庄重的经文语体，同时不把原文改写为解释性的群体称呼。
- source_word: Γνῶθι
  choice: 你要认识
  rationale: 不定过去时命令语气在此是直接吩咐；“你要认识”既明确其命令语气，也符合现代汉语表达。
- source_word: κύριον
  choice: 主
  rationale: “主”准确承载κύριος在此处耶利米书引文中的称谓及盟约语境。
- source_word: πάντες εἰδήσουσίν με
  choice: 他们全都必认识我
  rationale: “全都”保留πάντες的完整范围，“必”表达未来陈述的确定性，并明确保留宾语“我”。
- source_word: ἀπὸ μικροῦ ἕως μεγάλου αὐτῶν
  choice: 从他们当中最小的到最大的
  rationale: 这是涵盖群体全部成员的范围表达，不限定为年龄或某一种社会地位；译文保留“最小”至“最大”的张力和包举作用。
theological_decisions:
- issue: 在耶利米书31:34引文语境中如何翻译πολίτην
  choice: 同胞
  alternative: 邻舍
  rationale: 现存《希伯来书》希腊文本使用πολίτην，而非耶利米书七十士译本常见的“邻舍”用词。正文优先反映希腊文本，脚注则保留读者熟悉的耶利米书传统译法。
- issue: ἀδελφόν的性别和亲属语言
  choice: 弟兄
  alternative: 弟兄姊妹
  rationale: 原文为阳性单数，并与两次ἕκαστος构成逐一陈述。正文保留其形式及盟约性的亲属语言，不在翻译中扩写；上下文中“他们全都”已显明应许的整体范围。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“绝不会”保留强烈否定；两次“谁也”对应原文两次ἕκαστος，同时避免机械重复造成的生硬。“你要认识主”维持直接引语中的单数命令形式。
