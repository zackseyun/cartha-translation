reference: Hebrews 8:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὅτι αὕτη ἡ διαθήκη ἣν διαθήσομαι τῷ οἴκῳ Ἰσραὴλ μετὰ τὰς ἡμέρας ἐκείνας, λέγει κύριος, διδοὺς νόμους μου εἰς τὴν διάνοιαν αὐτῶν, καὶ ἐπὶ καρδίας αὐτῶν ἐπιγράψω αὐτούς, καὶ ἔσομαι αὐτοῖς εἰς θεόν καὶ αὐτοὶ ἔσονταί μοι εἰς λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/010.yaml
  text: 'For this is the covenant that I will make with the house of Israel after those days[a], says the Lord: putting my laws into their minds, and I will write them on their hearts; and I will be their God, and they will be my people.'
translation:
  language: zh_hans
  text: 因为主说：“那些日子以后，我将要与以色列家立的约是这样：我要把我的律法放进他们的心思里，也要把它们写在他们的心上[a]；我要作他们的上帝，他们要作我的子民。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文在“我要把我的律法放进……写在他们的心上”处先用分词，随后用将来时动词；较直译为：“将我的律法放进他们的心思里，并且我要把它们写在他们的心上。”
    reason: 说明διδοὺς（分词）与随后ἐπιγράψω（将来时）并列的特殊结构；正文为符合自然汉语而顺译为两个将来动作。
lexical_decisions:
- source_word: διαθήκη / διαθήσομαι
  choice: 约 / 立约
  rationale: 此处引用耶利米书的应许，表达上帝与以色列的盟约关系；“约”和“立约”既保留旧约背景，也符合现代汉语习惯。
- source_word: οἴκῳ Ἰσραήλ
  choice: 以色列家
  rationale: 保留先知文献中的群体性盟约称谓及与耶利米书的互文联系。
- source_word: μετὰ τὰς ἡμέρας ἐκείνας
  choice: 那些日子以后
  rationale: 直接保留原文的先知性时间表达，不具体解释所指时期。
- source_word: κύριος
  choice: 主
  rationale: 按希腊文本 κύριος 翻译，同时保留引文中上帝发言的语境。
- source_word: διδοὺς
  choice: 我要把……放进
  rationale: 希腊文是分词“放入／赐下”，但汉语若直译为悬垂分词会生硬；正文采用有限动词，使句意自然，原文结构差异在脚注说明。
- source_word: νόμους
  choice: 律法
  rationale: 原文为复数，指上帝的多项律例或法则；现代汉语中“律法”可作集合性名词，后文用“这些律法”明确其多项指向。
- source_word: διάνοιαν αὐτῶν
  choice: 他们的心思
  rationale: διάνοια 指思考和理解的内在官能；“心思”自然表达认知层面，并与下一句的“心”有所区分。
- source_word: ἐπὶ καρδίας αὐτῶν ἐπιγράψω
  choice: 把这些律法写在他们心上
  rationale: “写在……心上”保留 ἐπί 与书写意象，也自然表达律法的内在化。
- source_word: ἔσομαι αὐτοῖς εἰς θεόν
  choice: 我要作他们的上帝
  rationale: 采用汉语中自然、庄重的盟约公式，保留关系性的归属含义。
- source_word: αὐτοὶ ἔσονταί μοι εἰς λαόν
  choice: 他们要作我的子民
  rationale: 准确保留盟约公式中群体归属和彼此关系的含义。
theological_decisions:
- issue: 如何保留耶利米书新约应许的互文连续性
  choice: 保留“以色列家”“立约”“我的律法”“我要作他们的上帝”“他们要作我的子民”等盟约用语。
  alternative: 用更口语化的释义弱化先知书原有措辞。
  rationale: 本节的神学力度与其作为耶利米书引文的身份密切相关；保留这些用语有助于读者识别圣经内部的延续，同时不额外界定“以色列家”的范围。
- issue: 如何处理 διδοὺς（分词）与 ἐπιγράψω（将来时）的混合结构
  choice: 正文按自然汉语译为两个将来动作，并用脚注交代希腊文结构。
  alternative: 形式化直译为“把我的律法放进他们的心思里，并且我要写……”，刻意保留分词与限定动词的不对称。
  rationale: 汉语没有与希腊文此处分词完全对应且自然的结构；平顺处理不会改变两个应许动作的内容，而脚注可保存源文的语法特征。
- issue: “律法”的单复数表达
  choice: 先用汉语集合名词“律法”，再以“这些律法”回指。
  alternative: 译为“律例”或“各项律法”。
  rationale: 希腊文 νόμους 明确为复数；“这些律法”保留多项含义，而“我的律法”又符合现代中文圣经语域，避免误解为彼此无关的法律体系。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。保留先知性盟约措辞；以“心思”和“心”呈现认知与内在人格的平行关系，并避免用解释性措辞消除两者之间的张力。
