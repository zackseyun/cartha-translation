source:
  edition: SBLGNT
  text: (οἵτινες ὑποδείγματι καὶ σκιᾷ λατρεύουσιν τῶν ἐπουρανίων, καθὼς κεχρημάτισται Μωϋσῆς μέλλων ἐπιτελεῖν τὴν σκηνήν, Ὅρα γάρ, φησίν, ποιήσεις πάντα κατὰ τὸν τύπον τὸν δειχθέντα σοι ἐν τῷ ὄρει)·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/005.yaml
  text: who serve a copy and shadow of the heavenly things[a], just as Moses was divinely instructed when he was about to erect the tabernacle; for he says[b], “See that you make everything according to the pattern shown to you on the mountain.”
translation:
  language: zh_hans
  text: 这些祭司所从事的礼仪，是天上事物的摹本和影子。正如摩西将要完成会幕[b]时，曾得到神的指示[a]；因为神说：“你要留意，凡事都照着在山上指示给你的样式去做。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “得到神的指示”也可译作“受到神的警告”；希腊文动词既可强调来自神的传达，也可带有警戒、告诫的意味。
    reason: lexical_alternative
  - marker: b
    text: “完成会幕”也可译作“建造会幕”；这里的希腊文可指完成一项工作，也可按语境理解为把会幕建造起来。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: 这些祭司
  rationale: 承接上文所指的祭司；补出“祭司”使独立经节在中文中指代清楚，同时不增加新的所指。
- source_word: ὑποδείγματι καὶ σκιᾷ
  choice: 摹本和影子
  rationale: “摹本”表达地上圣所与天上事物的对应关系，“影子”保留希伯来书本有的比喻及其相对、非终极的意味。
- source_word: λατρεύουσιν
  choice: 所事奉的
  rationale: 保留礼仪和宗教服事的语境；中文用“所事奉的，是……”自然表达其服事与摹本、影子的关系，而不把含义缩窄为一般工作。
- source_word: τῶν ἐπουρανίων
  choice: 天上事物的
  rationale: 保留广义表达，不擅自限定为天上的地点、圣所或抽象的“实在”。
- source_word: κεχρημάτισται
  choice: 得到神的指示
  rationale: 该动词在此表示来自神的传达，也可带警戒意味；正文突出神圣来源和指示性质，警戒这一可行语气收入脚注。
- source_word: μέλλων ἐπιτελεῖν τὴν σκηνήν
  choice: 将要完成会幕时
  rationale: “将要”保留预期性；ἐπιτελεῖν可指完成、实行或建造，在此采用较贴近词形意义的“完成”，并以脚注注明语境中的另一译法。
- source_word: Ὅρα
  choice: 你要留意
  rationale: 在命令语境中自然表达“看、注意、务必”的力量，比字面“看”更符合现代汉语，同时保留告诫语气。
- source_word: ποιήσεις πάντα κατὰ τὸν τύπον
  choice: 凡事都照着……样式去做
  rationale: 将具有命令功能的将来式自然译成汉语命令句；“样式”既可指模型，也可指规范性的式样，不把其性质解释过度。
theological_decisions:
- issue: 地上礼仪与天上事物的关系
  choice: 译作“天上事物的摹本和影子”
  alternative: “天上实在的模型和影子”
  rationale: 正文保留对应性与非终极性之间的张力，不把地上礼仪贬为虚假之物，也不将“天上的”系统化为某种特定教义框架。
- issue: κεχρημάτισται的语气
  choice: “得到神的指示”
  alternative: “受到神的警告”
  rationale: 神圣传达是词语的核心，而引文确有告诫色彩；正文采用涵盖面较广的译法，并在脚注保留较强的警告含义。
- issue: 引文中说话者的身份
  choice: “因为他说”
  alternative: “因为神说”
  rationale: 希腊文动词只表达“他说”，其语境暗示神为说话者；不在引文介绍语中直接补出“神”，以免把隐含信息提升为明说。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“会幕”“事奉”“样式”等沿用读者熟悉的圣经语汇；句法略作汉语化处理，但保留原文的对应关系、神圣指示及命令语气。脚注标记均置于正文相关译词之后。
