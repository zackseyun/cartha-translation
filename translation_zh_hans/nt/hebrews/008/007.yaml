  text: Εἰ γὰρ ἡ πρώτη ἐκείνη ἦν ἄμεμπτος, οὐκ ἂν δευτέρας ἐζητεῖτο τόπος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/007.yaml
  text: For if that first covenant had been faultless[b][a], no place would have been sought for a second.
translation:
  language: zh_hans
  text: 因为，若那头一个约[a]没有缺陷，就不会为第二个约寻找余地了。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“那头一个”；“约”是按上下文补出的。
    reason: lexical_alternative
  - marker: b
    text: “余地”也可译作“机会”或“位置”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ γὰρ
  choice: 因为，如果
  rationale: γάρ承接上文并说明理由，εἰ引出假设条件；“因为，如果”在现代汉语中同时保留说明性和条件性。
- source_word: ἡ πρώτη ἐκείνη
  choice: 那头一个约
  rationale: 希腊文直译为“那头一个”，阴性形式按上下文指前约；正文补出“约”以明确所指，并用脚注保留原文省略。
- source_word: ἦν ἄμεμπτος
  choice: 没有缺陷
  rationale: ἄμεμπτος表示无可指摘、没有可归咎之处；“没有缺陷”自然且不过度说明缺陷究竟在约本身、施行层面还是相关的人。
- source_word: οὐκ ἂν
  choice: 就不会……了
  rationale: οὐκ与ἄν表达与事实相反条件的结果；汉语以“如果……就不会……了”清楚呈现这一反事实逻辑。
- source_word: δευτέρας
  choice: 第二个约
  rationale: 原文仅作阴性序数词“第二个”，依上下文所指仍是约；汉语补出“约”可避免指代含混。
- source_word: ἐζητεῖτο τόπος
  choice: 另寻余地
  rationale: ζητέω的被动态与τόπος构成“为……寻找位置、机会或余地”的表达；“另寻余地”既保留空间隐喻，也符合现代汉语习惯。
theological_decisions:
- issue: 是否补出希腊文省略的“约”
  choice: 在“那头一个”和“第二个”之后补出“约”，并以脚注说明
  alternative: 直译为“那头一个”和“第二个”
  rationale: 上下文明确比较前后两个约。补词使普通读者清楚所指，却不加入新的神学主张；脚注则交代原文的省略。
- issue: 如何表达头一个约的“可责之处”
  choice: 译为“没有缺陷”，不解释缺陷的归属或性质
  alternative: 译为“无可指摘”或“没有过错”
  rationale: 本节的反事实条件确实否定头一个约是完全无缺的，却未在本节内界定问题究竟属于约、约的施行，还是约下的百姓；译文保留这一神学张力。
- issue: τόπος的语义范围
  choice: 正文译作“余地”，脚注列出“机会、理由”等可能含义
  alternative: 直接译作“机会”或“理由”
  rationale: “余地”保留τόπος的基本空间意象，同时在此语境中自然表达为第二个约提供位置或契机，不强行限定作者所强调的是机会还是理由。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“头一个”比“第一个”略带经文语体色彩，但仍通俗易懂；“另寻余地”简洁保留原文意象。所有补词和语义选择均以脚注说明。
