  text: μεμφόμενος γὰρ ⸀αὐτοὺς λέγει· Ἰδοὺ ἡμέραι ἔρχονται, λέγει κύριος, καὶ συντελέσω ἐπὶ τὸν οἶκον Ἰσραὴλ καὶ ἐπὶ τὸν οἶκον Ἰούδα διαθήκην καινήν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/008.yaml
  text: For in finding fault with them he says, “Look, days are coming, says the Lord, when I will establish a new covenant with the house of Israel and with the house of Judah,”
translation:
  language: zh_hans
  text: 因为他指责他们说：“看哪，日子将到，主说，那时我要与以色列家和犹大家订立新约。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεμφόμενος … αὐτοὺς
  choice: 指责他们
  rationale: 保留分词结构所表达的责备含义及宾语“他们”；不擅自改成“指责那约”，以尊重当前正文读法。
- source_word: Ἰδοὺ
  choice: 看哪
  rationale: 以现代读者熟悉而庄重的提示语传达先知宣告的强调作用。
- source_word: συντελέσω
  choice: 订立
  rationale: 在“约”的语境中自然表达使约成立、完成缔结之意；避免仅译为泛泛的“建立”。
- source_word: διαθήκην καινήν
  choice: 新约
  rationale: 采用中文圣经语境中清楚、通行的表达，指新的盟约安排。
- source_word: οἶκον Ἰσραὴλ … οἶκον Ἰούδα
  choice: 以色列家……犹大家
  rationale: 保留“家”这一集体、宗族与民族性的圣经表达。
theological_decisions:
- issue: “指责”的对象
  choice: 他们
  alternative: 它／那约
  rationale: SBLGNT所列正文含αὐτούς，语法上明确指向复数对象“他们”；虽有文本异读与上下文解释张力，正文不将对象改释为前约。
- issue: 新约的缔约对象
  choice: 与以色列家和犹大家订立新约
  alternative: 为以色列家和犹大家设立新约
  rationale: ἐπί在此与引文的盟约语境结合，译为“与……订立”最自然，并保留双方关系含义，不扩展其神学范围。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留先知引文的宣告语气，并以“看哪”“主说”呈现原文节奏。
