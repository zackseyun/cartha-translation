  text: τῶν ἁγίων λειτουργὸς καὶ τῆς σκηνῆς τῆς ἀληθινῆς, ἣν ἔπηξεν ὁ κύριος, ⸀οὐκ ἄνθρωπος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/002.yaml
  text: a minister of the holy places and of the true tabernacle[a], which the Lord set up[b], not man.
translation:
  language: zh_hans
  text: 他在圣所和真帐幕中供职；这帐幕是主搭建的，不是人搭建的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῶν ἁγίων
  choice: 圣所
  rationale: 该复数形容词在此作名词用；按《希伯来书》的祭司与帐幕语境，指神圣的敬拜场所，即天上的圣所，而不是“圣徒”。汉语“圣所”自然涵盖这一整体概念；希腊文的复数形式则在脚注中说明。
- source_word: λειτουργὸς
  choice: 供职
  rationale: 此词指履行宗教或公共职分的人。结合本句承接上节所说的大祭司，用“在……供职”既表达其职事，也比生硬的“礼仪执行者”更符合现代汉语。
- source_word: σκηνῆς
  choice: 帐幕
  rationale: 此词既可泛指帐篷，也特指敬拜用的会幕；本段明显呼应摩西的帐幕制度，故采用具有圣经礼仪背景的“帐幕”。
- source_word: ἀληθινῆς
  choice: 真
  rationale: 保留“真实、终极实在”的含义以及与地上副本之间的含蓄对照，不扩译为“真正属天的”。
- source_word: ἔπηξεν
  choice: 支搭
  rationale: 该动词可指把帐幕固定、搭立起来。“支搭”与“帐幕”搭配自然，并保留具体的帐篷意象。
- source_word: ὁ κύριος
  choice: 主
  rationale: 按其通常神学称谓译为“主”；在汉语中无需另行表达希腊文冠词。
- source_word: οὐκ ἄνθρωπος
  choice: 不是人支搭的
  rationale: 原文以简洁方式把主与人相对照。汉语补出前文动词“支搭”，使关系清楚，同时保留“人”的泛指意义。
theological_decisions:
- issue: τῶν ἁγίων所指及其与天上圣所的关系
  choice: 译作“圣所”，理解为祭司职事所在的神圣空间
  alternative: 圣徒；圣物；诸圣所
  rationale: 8:1—5围绕大祭司、帐幕和天上的职事展开，因此祭祀空间的理解最合语境；但不在正文中额外加入“天上”，以免把上下文的推论写进本节原文。
- issue: λειτουργὸς的句法表达
  choice: 以“在圣所和真帐幕里供职”表达
  alternative: 圣所和真帐幕的执事
  rationale: 希腊文是属格搭配，既可表达所服事的领域，也可指职事所在之处。汉语采用地点式表达较自然，并与大祭司在圣所履职的语境协调，而不另加具体祭礼动作。
- issue: οὐκ ἄνθρωπος的泛指意义
  choice: “不是人支搭的”
  alternative: 不是一个人支搭的；不是人类支搭的
  rationale: “人”在现代汉语中可自然泛指人类，并保留原文主与人的凝练对照；“一个人”容易误成排除某个个体，“人类”则略显抽象。
translation_notes:
  register: 采用现代、庄重而易懂的经文语体。“帐幕”保留摩西会幕的祭祀联想；“供职”传达祭司职事而不过度技术化。为避免“圣所”和“真帐幕”被误解为两个完全分开的地点，用共同介词“在……和……里”贴近希腊文并列结构，同时保留二者关系上的张力。
