  text: Κεφάλαιον δὲ ἐπὶ τοῖς λεγομένοις, τοιοῦτον ἔχομεν ἀρχιερέα, ὃς ἐκάθισεν ἐν δεξιᾷ τοῦ θρόνου τῆς μεγαλωσύνης ἐν τοῖς οὐρανοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/001.yaml
  text: 'The main point in what is being said is this: we have such a high priest[a], who sat down at the right hand of the throne of the Majesty in the heavens[b],'
translation:
  language: zh_hans
  text: 所谈论之事的要点是：我们有这样一位大祭司，他坐在诸天之中至高威严者宝座的右边[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“总纲”或“首要之点”。希腊文作“诸天”（复数）；也可译为“天上”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Κεφάλαιον
  choice: 要点
  rationale: 这里不是字面的“头”或“篇章”，而是论述中的主旨、要点。“要点”简洁自然，也保留它可能指总结或首要之点的语义范围。
- source_word: δὲ
  choice: 不单独译出
  rationale: δέ在这里主要标示温和的论述转折或推进；汉语借句式自然承接上下文，无须机械添加“现在”或“但是”。
- source_word: ἐπὶ τοῖς λεγομένοις
  choice: 所谈论的这些事
  rationale: 既表达被动分词所指的当前论述内容，又避免把它限定为只指先前已经说完的话。
- source_word: τοιοῦτον ἔχομεν ἀρχιερέα
  choice: 我们有这样一位大祭司
  rationale: “这样一位”回指上文所描述的大祭司；“大祭司”是ἀρχιερεύς在《希伯来书》祭司语境中的标准译法。
- source_word: ἐκάθισεν
  choice: 已经坐在
  rationale: “已经”体现不定过去时所陈述的落座行动，但不加入“得胜”或“工作完成”等解释性扩展。
- source_word: ἐν δεξιᾷ τοῦ θρόνου
  choice: 在……宝座的右边
  rationale: 保留宝座及右边的位置和王权意象；现代汉语用“右边”比“右手边”用于宝座更自然。
- source_word: τῆς μεγαλωσύνης
  choice: 至尊者
  rationale: 这是对上帝庄严而间接的尊称。“至尊者”在现代汉语中自然、庄重，又没有直接改写成“上帝”。
- source_word: ἐν τοῖς οὐρανοῖς
  choice: 在诸天之上
  rationale: 保留希腊文οὐρανοῖς的复数形式；“诸天”是可理解且庄重的表达。介词短语与前面的宝座场景相连，因此用“就是”清楚标明其位置说明功能。
theological_decisions:
- issue: 是否把“至尊者”明确改写为“上帝”
  choice: 保留间接尊称“至尊者”
  alternative: 上帝；至高上帝
  rationale: 原文使用μεγαλωσύνη这一庄严的婉称，而不是θεός。译文保留间接称谓，以免比原文更明确。
- issue: 是否把ἐκάθισεν扩译为基督完成祭司工作或得胜掌权
  choice: 只译作“已经坐在”
  alternative: 完成工作后得胜地坐下；登上掌权之位
  rationale: 上下文确有相关神学含义，但本节动词本身只陈述落座，不应把推论写进正文。
- issue: “诸天”应作复数还是按惯用表达译为单数“天上”
  choice: 正文保留复数“诸天”
  alternative: 天上；天界
  rationale: 希腊文为复数。复数在汉语中仍可理解，也保留原文的宇宙空间表达；单数惯用译法列入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“大祭司”“宝座”等关键意象按原文保留；避免古奥虚词和解释性神学扩写。正文中的[a]、[b]均与相应脚注对应。
