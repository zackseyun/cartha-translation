  text: ἐν τῷ λέγειν Καινὴν πεπαλαίωκεν τὴν πρώτην, τὸ δὲ παλαιούμενον καὶ γηράσκον ἐγγὺς ἀφανισμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/013.yaml
  text: By saying[a], “new,” he has made the first obsolete[c][b]. And what is becoming obsolete and growing old is near to disappearing.
translation:
  language: zh_hans
  text: 他既说“新的”[a]，就使先前的成了旧的[b]；而那正在变旧、渐渐衰老的，离消逝已经不远了[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“在说‘新的’时”或“借着说‘新的’”。这里的“新的”承接上文“新约”一语；希腊原文在本节只写“新的”，没有重复“约”。
    reason: lexical_alternative
  - marker: b
    text: “先前的”指上文所说先前的约。希腊原文直译为“使先前的成了旧的”；也可意译为“使先前的过时了”。
    reason: implicit_referent
  - marker: c
    text: “消逝”也可译作“消失”或“被除去”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ λέγειν
  choice: 他说
  rationale: 该带冠词不定式结构可表示伴随情形或方式。中文用“他说”自然承接上文引文，同时不过度限定为纯时间或纯手段关系；脚注保留“既说／借着说”的可能。
- source_word: Καινὴν
  choice: “新的”
  rationale: 原文仅有形容词“新的”，省略了由上文可知的“约”。保留省略和引号，既忠于希腊文，也让读者听出对“新约”的回响。
- source_word: πεπαλαίωκεν
  choice: 就使……成了旧的
  rationale: 完成时表达已经发生且结果延续至今。“使……成了旧的”保留与下半句 παλαιούμενον 的词根呼应，也避免将其直接扩展成额外的教义判断。
- source_word: τὴν πρώτην
  choice: 先前的
  rationale: 原文形容词作名词使用，所指由上下文判明为先前的约。中文“先前的”自然，且不在正文补入原文未明说的名词。
- source_word: τὸ ... παλαιούμενον
  choice: 那正在变旧……的
  rationale: 现在分词表达持续过程；“正在变旧”保留过程性，并与前句“成了旧的”形成词语呼应。
- source_word: γηράσκον
  choice: 渐渐衰老
  rationale: 保留老化的形象，并以“渐渐”自然表达进行中的过程。
- source_word: ἐγγὺς ἀφανισμοῦ
  choice: 离消逝已经不远了
  rationale: ἐγγύς 加属格表示接近；ἀφανισμός 在此可指消失、隐退或除去。“离消逝已经不远了”是自然现代汉语，并保留其具体实现方式上的开放性。
theological_decisions:
- issue: “说”这一动作的隐含主语
  choice: 用“他”承接上文，不在正文明确写成“神”或“圣经”
  alternative: 神说／圣经说
  rationale: 希腊文没有明写主语，而是回指耶利米书引文中的说话者。用“他”保留原文的简约与上下文联系，避免过度具体化。
- issue: 先前之约的地位
  choice: “使先前的成了旧的”
  alternative: 使先前的过时了／废弃了
  rationale: 本句明确论证“新的”使先前的成为旧的并趋近消逝；采用“成了旧的”忠实保留 παλαιόω 的表达及与后句的词根联系，同时不额外断定律法各层面的教义结论。
- issue: ἀφανισμός 所指结果
  choice: 消逝
  alternative: 消失／除去／毁灭
  rationale: 该词在这里强调不再显现或退出；“消逝”保持作者的时间性图景，又不武断规定其历史或神学实现方式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。正文保留原文的省略结构、完成时结果和两个进行中分词的过程感，并通过“旧的／变旧”再现词根呼应。所有脚注标记均置于相关正文位置。
