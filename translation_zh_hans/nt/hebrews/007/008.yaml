  text: καὶ ὧδε μὲν δεκάτας ἀποθνῄσκοντες ἄνθρωποι λαμβάνουσιν, ἐκεῖ δὲ μαρτυρούμενος ὅτι ζῇ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/008.yaml
  text: And here mortal men receive tithes[a], but there he is testified to be living.
translation:
  language: zh_hans
  text: 在这里，必死的人收取十分之一；在那里，却有一位被见证说他活着。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在那里，却有一位收取十分之一；这位被见证说他活着。”原文第二分句可按上下文补出“收取十分之一”，但表层措辞只说这人被见证为活着。见证的根据是上下文所引用的经文；本句本身并不直接断言麦基洗德本人永不死亡。
    reason: 说明第二分句可能补出的省略成分，并保留被动“见证”的表达及其不直接断言本体性不死的限定。
lexical_decisions:
- source_word: ὧδε
  choice: 在这里
  rationale: 与ἐκεῖ构成“这里……那里”的指示性对照，前者指利未祭司的现实情形。
- source_word: δεκάτας
  choice: 十分之一
  rationale: 准确表达当时宗教与律法语境中的什一奉献；现代汉语清楚自然。
- source_word: ἀποθνῄσκοντες ἄνθρωποι
  choice: 必死的人
  rationale: 突出这些人的必死性，与经文对麦基洗德“活着”的见证形成对照。语境所指虽为男性祭司，但ἄνθρωποι本身着重其人性和必死性，中文无需另加性别限定。
- source_word: λαμβάνουσιν
  choice: 收取
  rationale: 符合收取十分之一的具体语境，又不增加原文没有的解释。
- source_word: ἐκεῖ
  choice: 在那里
  rationale: 保留与“在这里”的修辞对照，指创世记所呈现的麦基洗德场景。
- source_word: μαρτυρούμενος
  choice: 有经文为他作证
  rationale: 保留被动见证的证据性，同时明确见证来自前文援引的经文，避免将其改写为作者直接宣告麦基洗德本体上永不死亡。
- source_word: ὅτι ζῇ
  choice: 说他是活着的
  rationale: 保留ὅτι从句和现在时态，表达经文对他的呈现，不把神学张力过度解释。
theological_decisions:
- issue: 利未祭司与麦基洗德之间对照的性质
  choice: 译为经文为麦基洗德作证，说他是活着的，保留“见证”这一间接表述。
  alternative: 直译或解释为麦基洗德本人现今仍永远活着。
  rationale: 希腊文用μαρτυρούμενος强调所受的见证。希伯来书的论证依托创世记叙事对麦基洗德的呈现；译文不应越过经文见证，断定其本体性的个人不死。
- issue: 第二分句是否补出“他收取十分之一”
  choice: 不在正文补出该谓语和宾语。
  alternative: 译作“在那里，却有一位收取十分之一；经文为他作证，说他活着”。
  rationale: 上下文可推知省略的对比内容，但本节现存希腊文第二分句的表层措辞集中于“受见证说他活着”。为避免把隐含成分提升为明说内容，采用紧凑译法，并以注释说明可补足的理解。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“必死的人”凝练地表达死亡必临的性质；“有经文为他作证”在中文中自然，并显明论证所依据的是圣经叙事。脚注标记已在正文中以[a]出现。
