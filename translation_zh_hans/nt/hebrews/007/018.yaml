  text: ἀθέτησις μὲν γὰρ γίνεται προαγούσης ἐντολῆς διὰ τὸ αὐτῆς ἀσθενὲς καὶ ἀνωφελές,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/018.yaml
  text: For there is indeed a setting aside of the former commandment because of its weakness and uselessness[b][a],
translation:
  language: zh_hans
  text: 原来，先前的诫命[a]因本身软弱无益[b]，就被废除了；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在先的诫命”“先行的诫命”。
    reason: lexical_alternative
  - marker: b
    text: 这里是说它不能使人达到上下文所论的“完全”（参来7:19），并不是说神先前的启示本身是邪恶的。
    reason: cross_reference
lexical_decisions:
- source_word: ἀθέτησις
  choice: 废除
  rationale: 该词表示取消、废止，使原有规定不再有效。“废除”简明自然，也保留了法律效力被撤去的含义。
- source_word: μὲν γὰρ
  choice: 原来……；
  rationale: γάρ承接上文作解释，译作“原来”；μέν预示下一节由δέ引出的对照。句末用分号保持论证尚未完结，并为下一节的转折留出空间，避免生硬地直译为“一方面”。
- source_word: γίνεται
  choice: 就被……了
  rationale: 这里表示废除这件事成为事实；结合ἀθέτησις采用自然的汉语被动表达。
- source_word: προαγούσης ἐντολῆς
  choice: 先前的诫命
  rationale: προάγω在此表示在先、先行，所指是与先前祭司制度相关的诫命。“先前的”自然地表达时间和论证次序，同时不擅自扩大为整部摩西律法。
- source_word: ἀσθενές
  choice: 软弱
  rationale: 保留原文对能力不足的直接评价，不用“有限”等较弱措辞淡化语气。
- source_word: ἀνωφελές
  choice: 无益
  rationale: 该词表示不能带来益处或达成所需功效。“无益”保留原文尖锐措辞，又比“毫无价值”更准确，避免暗示先前启示在一切意义上都毫无价值。
theological_decisions:
- issue: “先前的诫命”受到否定评价的范围
  choice: 保留“软弱无益”的强烈评价，同时用脚注说明其具体语境是不能带来本段所说的完全。
  alternative: 将此理解为整部摩西律法在任何意义上都毫无价值，或反过来弱化原文的否定语气。
  rationale: 上下文聚焦于利未祭司制度不能使人达到完全（来7:11、19）。译文不回避原文张力，也不把批评范围扩展到作者未明说的程度。
- issue: μέν所预示的对照
  choice: 以分号保留句子向下一节δέ分句推进的结构。
  alternative: 明确译作“一方面”，或完全按独立陈述处理。
  rationale: 中文单独说“一方面”略显生硬；分号既自然，也提示本节须与下一节“更美的盼望被引进”一同理解。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“先前的诫命”“软弱无益”“废除”紧贴原文，同时保持自然。用“原来”承接上文的解释关系，以分号保留与下一节的前后对照。
