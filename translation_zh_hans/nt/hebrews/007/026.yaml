source:
  edition: SBLGNT
  text: Τοιοῦτος γὰρ ἡμῖν ⸀καὶ ἔπρεπεν ἀρχιερεύς, ὅσιος, ἄκακος, ἀμίαντος, κεχωρισμένος ἀπὸ τῶν ἁμαρτωλῶν, καὶ ὑψηλότερος τῶν οὐρανῶν γενόμενος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/026.yaml
  text: 'For such a high priest was indeed fitting for us: holy[a], innocent, undefiled, separated from sinners[b], and having become higher than the heavens.'
translation:
  language: zh_hans
  text: 这样一位大祭司正合乎我们的需要：他圣洁、无邪、毫无玷污，与罪人分离[a]，并且已成为高过诸天者[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “与罪人分离”也可译作“与罪人有别”或“从罪人中分别出来”。此语在本段强调其纯洁和尊荣的地位；不必限定为单纯的空间分离。
    reason: 说明词义范围，避免将该短语单一化为某一种分别。
  - marker: b
    text: 直译作“成为高过诸天者”。也可译作“被高举到诸天之上”，但后一译法较明确地表达升高之意。
    reason: 保留γενόμενος的动态结果和原文比较结构，同时标示较解释性的自然替代译法。
lexical_decisions:
- source_word: Τοιοῦτος
  choice: 这样一位
  rationale: 回指上文所描述的大祭司，保留指示和承接作用，同时符合现代汉语表达。
- source_word: γὰρ
  choice: 省译，以“这样”承接上文
  rationale: 原词说明本节与上文的论证关系；汉语若直译为“因为”会显得突兀，借句首回指自然体现其解释功能。
- source_word: ἡμῖν καὶ ἔπρεπεν
  choice: 正合乎我们的需要
  rationale: ἔπρεπεν表示合宜、相称；καί在此可作强调。“正合乎我们的需要”既传达对我们的适切性，也比“适合我们”更自然庄重。
- source_word: ἀρχιερεύς
  choice: 大祭司
  rationale: 希伯来书祭司语境中的标准称谓。
- source_word: ὅσιος
  choice: 圣洁
  rationale: 表达对上帝忠诚、合宜的圣洁品格，适合此处对大祭司资格的描述。
- source_word: ἄκακος
  choice: 无邪
  rationale: 表达没有恶意、没有邪恶，较“无害”更能体现道德上的纯正，也比“无辜”更贴合品格描述。
- source_word: ἀμίαντος
  choice: 毫无玷污
  rationale: 保留洁净与祭祀方面的联想；“毫无”使并列形容语在汉语中自然有力。
- source_word: κεχωρισμένος ἀπὸ τῶν ἁμαρτωλῶν
  choice: 与罪人分离
  rationale: 保留完成时分词所表达的既成状态，不把这种分别限定为纯空间、纯道德或仅指升天后的状态。
- source_word: ὑψηλότερος τῶν οὐρανῶν γενόμενος
  choice: 已经成为高过诸天的
  rationale: 保留γενόμενος的动态、结果性和比较结构，不在正文中增添被动施事者；“诸天”也保留原文复数。
theological_decisions:
- issue: “与罪人分离”与耶稣在世时接近罪人的关系
  choice: 正文直译为“与罪人分离”，脚注说明其语境重点
  alternative: 译为“与罪人有别”或限定为升天后在空间上离开罪人
  rationale: 上下文同时强调大祭司的纯洁和尊荣；直译可保留道德、祭司身份及升高状态之间的张力，又不让读者误以为这否定了他在世时与罪人来往。
- issue: γενόμενος所表达的升高
  choice: 译为“已经成为高过诸天的”
  alternative: 译为“本来高过诸天”或“被高举到诸天之上”
  rationale: “已经成为”保留救赎历史中的动态与结果，不将其弱化为纯静态属性；同时不明说施事者，也不暗示基督神性发生改变。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“他”补出并列描述的主语，使长串谓语清晰；“诸天”保留原文复数及其崇高语体。脚注标记均置于所解释的短语之后。
