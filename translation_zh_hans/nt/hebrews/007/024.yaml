  text: ὁ δὲ διὰ τὸ μένειν αὐτὸν εἰς τὸν αἰῶνα ἀπαράβατον ἔχει τὴν ἱερωσύνην·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/024.yaml
  text: But he[a], because he remains forever, holds the priesthood permanently.
translation:
  language: zh_hans
  text: 但他既然永远长存，就持有永不更替的祭司职分。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他的祭司职分永不改变”，或“他的祭司职分不可转让”。希腊语形容词可以带有这两种意味；按上下文，重点是他既然永远活着，他的祭司职分就不会转给别人。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: 但他
  rationale: 定冠词在此作名词用，承接上文的耶稣，并以 δέ 与先前许多会死亡的祭司形成对比；“但他”自然保留转折。
- source_word: διὰ τὸ μένειν αὐτὸν
  choice: 他既然……长存
  rationale: διά 加带冠词的不定式表示原因；“既然”表达因果关系，“长存”体现 μένω 在此持续存在的含义。
- source_word: εἰς τὸν αἰῶνα
  choice: 永远
  rationale: 这是表示无穷延续的时间用语；“永远”是现代汉语中自然且准确的表达。
- source_word: ἀπαράβατον
  choice: 永远持有
  rationale: 该形容词修饰“祭司职分”，可指不改变或不转让。结合上下文中祭司因死亡而更替的对比，主文用“永远持有”表达这职分持续归他所有，同时在脚注保留词义上的其他可能。
- source_word: ἔχει τὴν ἱερωσύνην
  choice: 持有祭司职分
  rationale: ἔχω 表示拥有或保有，ἱερωσύνη 指祭司的身份或职分；“持有祭司职分”既自然，也符合本段关于职分不再更替的论述。
- source_word: ἱερωσύνην
  choice: 祭司职分
  rationale: 此处所指是祭司的职位、身份，而非祭司群体；“祭司职分”在现代汉语中清楚明确。
theological_decisions:
- issue: ἀπαράβατον 描述基督祭司职分时的含义
  choice: 主文译作“永远持有祭司职分”，突出他因永远活着而持续保有此职分。
  alternative: “他的祭司职分永不改变”或“他的祭司职分不可转让”
  rationale: 原词可带有“不改变”或“不转交给别人”的意味。上下文强调先前的祭司因死亡而不断更替，因此主文表达基督永久保有这职分，但不把原词限定为单一技术性含义；其他可能保留在脚注中。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“长存”与“祭司职分”适合经文语体，又能为普通读者理解；脚注明示原文真实的词义张力。
