  text: Καὶ οἱ μὲν πλείονές εἰσιν γεγονότες ἱερεῖς διὰ τὸ θανάτῳ κωλύεσθαι παραμένειν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/023.yaml
  text: And they indeed have become many priests[a], because they are prevented by death from remaining in office[b],
translation:
  language: zh_hans
  text: 再者，那些作祭司的，人数众多[a]，因为死亡使他们不能继续担任祭司[b]；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“先后有许多人成为祭司”。
    reason: 原文结构可强调作祭司者人数众多，也可强调历来有许多人成为祭司。
  - marker: b
    text: 直译：“继续存留”；这里指继续担任祭司的职分。
    reason: 保留παραμένειν较宽泛的字面意义，并说明其在祭司语境中的具体所指。
lexical_decisions:
- source_word: Καὶ
  choice: 再者
  rationale: 承接上文并推进论证，比单纯的“并且”更符合现代汉语行文，同时不强化原文未明说的逻辑关系。
- source_word: οἱ μὲν πλείονές εἰσιν γεγονότες ἱερεῖς
  choice: 那些祭司人数众多
  rationale: 自然表达历任祭司为数众多，并以“那些”与下一节所说的耶稣形成对照；不在正文中加入原文未明说的“利未祭司”。μέν所预示的对比由句式和下文承接。
- source_word: διὰ τὸ θανάτῳ κωλύεσθαι
  choice: 因为死亡使他们不能
  rationale: 准确表达διά加冠词不定式所表示的原因，并把θανάτῳ作为阻止他们的因素自然地译出。
- source_word: παραμένειν
  choice: 继续任职
  rationale: 原义为“继续、长久留任”；在祭司语境中指继续担任职分。“任职”是必要的语境明示，脚注保留较直译的表达。
theological_decisions:
- issue: 众多祭司与耶稣祭司职分之间的对比
  choice: 正文只说明那些祭司因死亡而不能继续任职，因而人数众多，为下一节的对比作铺垫。
  alternative: 在正文中明确称他们为“利未祭司”或直接说明耶稣祭司职分永存。
  rationale: 本节希腊文没有明说“利未”，也尚未完整陈述下一节的结论；译文保留论证的推进和神学张力，不提前补入解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“再者”自然承接论述；“继续任职”避免生硬的“长久存留”，同时借脚注呈现原文措辞。标点用分号，以衔接下一节尚未完成的对比结构。
