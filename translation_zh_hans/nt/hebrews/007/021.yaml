  text: ὁ δὲ μετὰ ὁρκωμοσίας διὰ τοῦ λέγοντος πρὸς αὐτόν· Ὤμοσεν κύριος, καὶ οὐ μεταμεληθήσεται, Σὺ ἱερεὺς εἰς τὸν ⸀αἰῶνα),
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/021.yaml
  text: but this one became a priest with an oath through the one who said to him[a], “The Lord has sworn and will not change his mind, ‘You are a priest forever.’”
translation:
  language: zh_hans
  text: 但这一位成为祭司，却是借着那位对他说这话者所起的誓：“主已经起誓[a]，决不改变心意：你是祭司，直到永远。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“主起了誓，决不改变心意。”希腊文ὤμοσεν既可译作“起了誓”，也可按上下文译作“已经起誓”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: 但这一位
  rationale: 承接第20节，与先前那些祭司形成鲜明对比，同时保留希腊文略带省略的指称方式。
- source_word: μετὰ ὁρκωμοσίας
  choice: 却是有誓言为证的
  rationale: 既可表达伴随情形，也能显出誓言在任命中的确证作用，并与第20节“没有誓言”相对。
- source_word: διὰ τοῦ λέγοντος πρὸς αὐτόν
  choice: 因为那位对他说
  rationale: διά加属格表明媒介或施事；在汉语中以“因为”自然引出上帝亲口宣告的誓言，而“那位”保留原文对说话者的间接指称。
- source_word: Ὤμοσεν κύριος
  choice: 主已经起誓
  rationale: 不定过去时在此可用“已经起誓”表达一次完成且持续有效的庄严行动；“主”直接对应希腊文κύριος。
- source_word: οὐ μεταμεληθήσεται
  choice: 决不改变心意
  rationale: 这里指不会撤回或改变已经宣告的旨意，并非指道德意义上的悔改；“决不”也传达οὐ在誓言语境中的坚定语气。
- source_word: Σὺ ἱερεὺς
  choice: 你永远是祭司
  rationale: 汉语自然补出判断词“是”，明确受话者的祭司身份。
- source_word: εἰς τὸν αἰῶνα
  choice: 永远
  rationale: 该惯用语在本段表示没有终止的持续性，“永远”简洁自然，并符合永久祭司职分的上下文。
theological_decisions:
- issue: 诗篇110:4引文中祭司职分的确立方式与持续性
  choice: 译文突出这一位的祭司职分有上帝的誓言为证，并且永远持续。
  alternative: 可更形式对应地译为“主起了誓，必不后悔：‘你是祭司，直到永远。’”
  rationale: 希伯来书在此对比没有誓言而任职的先前祭司与凭上帝誓言任职的这一位。译文保留此论证及永久性，不加入经文本身未明说的后期教义表述。
- issue: ὤμοσεν的不定过去时体
  choice: 主已经起誓
  alternative: 主起了誓
  rationale: 两种汉语表达都可对应希腊文不定过去时；“已经起誓”较自然地体现誓言虽已作出、效力仍然存续，不把希腊时体机械等同于特定汉语时态。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“这一位”保留上下文中的对比；“有誓言为证”避免生硬的“带着誓言”，并清楚表达任命有神圣誓言确立。引文使用全角中文标点，脚注标记置于正文引文之后。
