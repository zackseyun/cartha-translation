  text: Θεωρεῖτε δὲ πηλίκος οὗτος ⸀ᾧ δεκάτην Ἀβραὰμ ἔδωκεν ἐκ τῶν ἀκροθινίων ὁ πατριάρχης.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/004.yaml
  text: Consider how great this man was[b][a], to whom Abraham the patriarch gave a tenth of the spoils.
translation:
  language: zh_hans
  text: 你们要想一想，这个人是何等伟大：连先祖亚伯拉罕也把战利品[a]的十分之一给了他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “战利品”所译的希腊词也可能含有战利品中最上好部分的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: Θεωρεῖτε
  choice: 你们要想一想
  rationale: 现在时复数命令式要求读者留意并深入思考；此译法自然地保留劝勉语气，而不局限于视觉上的“看”或“观察”。
- source_word: δὲ
  choice: 不单独译出
  rationale: 此处表示轻微承接或转折；中文语流无需另加“现在”或强转折词也能自然衔接上下文。
- source_word: πηλίκος
  choice: 何等伟大
  rationale: 表达程度上的重大或崇高；“何等伟大”既保留原文的感叹力度，也不预先限定这种伟大具体属于身份、尊荣还是重要性。
- source_word: οὗτος
  choice: 这个人
  rationale: 指上文的麦基洗德；补出“人”符合现代汉语表达，同时不增添身份解释。
- source_word: ᾧ
  choice: 给了他
  rationale: 以中文关系自然重组表达与格关系，清楚表明他是亚伯拉罕给予十分之一的对象。
- source_word: δεκάτην
  choice: 十分之一
  rationale: 直接呈现希腊文的数值含义，避免“什一奉献”可能带入的后期制度性联想。
- source_word: Ἀβραὰμ
  choice: 亚伯拉罕
  rationale: 采用现代简体中文圣经传统中通行的人名译法。
- source_word: ἔδωκεν
  choice: 给了
  rationale: 准确、朴素地表达 δίδωμι 的简单过去行动。
- source_word: ἐκ τῶν ἀκροθινίων
  choice: 战利品的
  rationale: ἀκροθίνια 在此指战争所得的掳物或战利品；中文以“战利品的十分之一”自然表达从其中取出一份的意思，可能含有“上好部分”的词义色彩则保留在脚注。
- source_word: ὁ πατριάρχης
  choice: 先祖亚伯拉罕
  rationale: “先祖”自然表达亚伯拉罕作为民族祖先的身份，并保留原文冠词性称号所带的强调。
theological_decisions:
- issue: 本节如何体现麦基洗德的伟大
  choice: 借“连先祖亚伯拉罕也”凸显亚伯拉罕把十分之一给麦基洗德这一事实的分量
  alternative: 直接把麦基洗德译作地位更高或高于亚伯拉罕
  rationale: 原文以亚伯拉罕的行为论证麦基洗德何等伟大，但本节没有直接陈述完整的等级结论；译文保留论证力度，同时把进一步的神学推论留给上下文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你们要想一想”保留复数命令语气；冒号呈现前半句的劝勉与后半句证据之间的修辞关系。“连……也……”使希腊语序中“先祖”称号的强调在中文里自然显明，但不明说超出本节的神学结论。
