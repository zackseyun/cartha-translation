  text: ἐφ’ ὃν γὰρ λέγεται ταῦτα φυλῆς ἑτέρας μετέσχηκεν, ἀφ’ ἧς οὐδεὶς προσέσχηκεν τῷ θυσιαστηρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/013.yaml
  text: For the one about whom these things are said belongs to another tribe[b][a], from which no one has served at the altar.
translation:
  language: zh_hans
  text: 因为这些话所论到的那一位，属于另一个支派[a]；而那个支派从来没有人在祭坛前供职[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“有分于另一个支派”或“出自另一个支派”。希腊语动词可表示参与或关联；这里是指支派归属。
    reason: lexical_alternative
  - marker: b
    text: 或译：“在祭坛前侍立”或“在祭坛那里服事”。这个表达指与祭坛有关的祭司侍奉。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφ’ ὃν
  choice: 所指的那一位
  rationale: ἐπί加宾格与λέγεται连用，表示这些话所关乎、所指向的人；此译自然保留指称关系。
- source_word: γὰρ
  choice: 因为
  rationale: 引出对前文论述的解释或根据，保持原文论证衔接。
- source_word: λέγεται ταῦτα
  choice: 这些话所指
  rationale: 将被动表达自然转化为现代汉语关系结构，同时保留复数ταῦτα“这些话”的含义。
- source_word: φυλῆς ἑτέρας
  choice: 另一个支派
  rationale: φυλή在此指以色列的支派；ἑτέρας强调与此前所论的祭司支派不同。
- source_word: μετέσχηκεν
  choice: 属于
  rationale: 该完成时动词本可表示有分、参与或关联；在这里指稳定的支派归属，用“属于”最清楚自然，同时不把它强化为明确的血统陈述。
- source_word: ἀφ’ ἧς
  choice: 那个支派
  rationale: 关系代词回指φυλή；汉语重复“那个支派”可避免“其中/从中”所可能造成的关系含混。
- source_word: οὐδεὶς
  choice: 从来没有人
  rationale: 结合完成时 προσέσχηκεν，表达截至所论时点无人曾如此行，符合汉语习惯。
- source_word: προσέσχηκεν τῷ θυσιαστηρίῳ
  choice: 在祭坛前供职
  rationale: προσέχω在此礼仪语境中指与祭坛有关的侍立、料理或服事；“供职”传达祭司性职务，又不细化为原文未明说的具体仪式。
- source_word: θυσιαστηρίῳ
  choice: 祭坛
  rationale: 这是献祭语境中的标准、清楚译法。
theological_decisions:
- issue: 耶稣与非利未支派的关系在祭司论证中的表达
  choice: 译为“属于另一个支派”
  alternative: 译为“出自另一个支派”或“是另一个支派的后裔”
  rationale: 上下文论证涉及支派归属，但μετέσχηκεν本身表达有分或关联，并未在本句直接使用“后裔”或“出自”的血统措辞；因此不作超出原文的神学性明说。
- issue: 祭坛相关行动的性质
  choice: 译为“在祭坛前供职”
  alternative: 译为“在祭坛前侍立”或“在祭坛那里服事”
  rationale: 语境显然关乎祭司职分，但动词保留了趋近、专注于或料理祭坛事务的语义幅度；“供职”表达职务性而不限定具体祭礼动作。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“所指的那一位”保留指称关系；“供职”比“服侍祭坛”更自然，也比“主持献祭”更少解释性。脚注标记紧随各自涉及的词语。
