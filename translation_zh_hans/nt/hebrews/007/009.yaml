    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ἔπος εἰπεῖν
  choice: 甚至可以说
  rationale: 这是对表达作限定的习语；“可以说”保留修辞上的缓和，而“甚至”也自然承接 καί 的强调作用。
- source_word: δι’ Ἀβραὰμ
  choice: 借着亚伯拉罕
  rationale: διά 加属格表示中介；此处说明利未因亚伯拉罕的行动而被视为参与其中，不进一步界定其机制。
- source_word: καὶ Λευὶ
  choice: 利未也
  rationale: καί 在论证中带有递进和强调意味；中文结合前面的“甚至可以说”和后面的“也”，自然表达出令人意外的延伸。
- source_word: ὁ δεκάτας λαμβάνων
  choice: 那收取十分之一的利未
  rationale: 实体化的现在分词描述利未在祭司体系中的特征性职分；“收取”准确自然。
- source_word: δεκάτας
  choice: 十分之一
  rationale: 指宗教及经济意义上的十分之一；现代中文清楚易懂，并与上下文一致。
- source_word: δεδεκάτωται
  choice: 交了十分之一
  rationale: 希腊文是完成时被动态，字面近似“被取了十分之一”；但此处语义是利未借着亚伯拉罕成为献纳者。正文采用自然中文表达其语义，脚注保留原文被动态及其压缩的论证方式。
theological_decisions:
- issue: 利未借着亚伯拉罕参与献纳十分之一
  choice: 保留“借着亚伯拉罕”及“可以说”，表明利未在某种意义上被视为交了十分之一。
  alternative: 明确解释为利未以群体或后裔身份存在于亚伯拉罕里面，或仅把这句话视为修辞比喻。
  rationale: 原文以限定语和中介表达维持张力；译文不将其固定为某种后来的教义机制，也不把论证弱化为纯粹比喻。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“甚至可以说”表达原文的修辞限定和强调；避免生硬的“被取了十分之一”，同时用脚注保留希腊文被动态。
