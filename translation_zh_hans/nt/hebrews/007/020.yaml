  yaml_path: translation/nt/hebrews/007/020.yaml
  text: And inasmuch as this was not without an oath (for they indeed have become priests without an oath,[a]
translation:
  language: zh_hans
  text: 再者，这事并非没有凭着誓言而成[a]（因为那些人成为祭司，原不是凭着誓言；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“并非不是没有誓言而成。”
    reason: 保留 οὐ χωρὶς ὁρκωμοσίας 的双重否定式表达；正文以“凭着誓言而成”使现代汉语句法更自然。
lexical_decisions:
- source_word: Καὶ
  choice: 再者
  rationale: 承接上文并推进论证；“再者”比单纯的“并且”更符合本段议论语气。
- source_word: καθ’ ὅσον
  choice: 既然
  rationale: 此处引出后续论证所依据的事实，并与下文的程度比较相衔接；“既然”在现代汉语中自然，也保留其论证功能。
- source_word: οὐ χωρὶς ὁρκωμοσίας
  choice: 不是没有誓言的
  rationale: 保留原文强调性的双重否定，不提前把句意改写成肯定表达；“誓言”涵盖起誓及其郑重确认的含义。
- source_word: οἱ μὲν γὰρ
  choice: 那些人……原是
  rationale: “那些人”指前文的祭司；“原是”既引出解释，也预示下一节将出现的对比，而不生硬直译 μέν。
- source_word: χωρὶς ὁρκωμοσίας
  choice: 没有誓言
  rationale: 与前半句保持词语一致，清楚表达他们受立为祭司时并无誓言。
- source_word: εἰσὶν ἱερεῖς γεγονότες
  choice: 成为祭司
  rationale: 自然表达完成的就职事件及其结果状态，不把原文被动化为“被立”。
theological_decisions:
- issue: 先前祭司与凭誓言确立之祭司职分的对比
  choice: 本节只陈述那些人成为祭司并无誓言，并保留与下一节所述另一位祭司的对比结构。
  alternative: 明确增补“利未祭司”或直接写明“耶稣凭誓言成为祭司”。
  rationale: 直接语境支持这一神学对比，但本节原文尚未明说双方身份；不宜把下一节的信息提前加入。
- issue: 首句省略成分的处理
  choice: 以“这”承接上文所论之祭司职分的确立，但不进一步界定。
  alternative: 补成“他成为祭司这事”或“耶稣的祭司职分”。
  rationale: 希腊文此处表达省略，意义要到后文才完整；使用宽泛的“这”可使汉语可读，同时保留原文的悬延与张力。
translation_notes:
  register: 采用现代、庄重而易懂的议论语体。保留本节未完的括号和分号，因为希腊文句法与论证在下一节继续；避免在本节内人为补足结论。
