  text: ὁ δὲ μὴ γενεαλογούμενος ἐξ αὐτῶν δεδεκάτωκεν ⸀Ἀβραάμ, καὶ τὸν ἔχοντα τὰς ἐπαγγελίας εὐλόγηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/006.yaml
  text: But the one who is not traced by genealogy from them has taken a tenth from Abraham and has blessed the one who had the promises[a][b].
translation:
  language: zh_hans
  text: 但这位的家谱并非从他们追溯而来，却从亚伯拉罕收取了十分之一[a]，并祝福了那拥有这些应许的人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从亚伯拉罕收取了什一。”原文动词指取或收取十分之一。
    reason: lexical_alternative
  - marker: b
    text: 原文为“拥有这些应许的人”；“应许”为复数，所指的是亚伯拉罕。
    reason: referent_clarification
lexical_decisions:
- source_word: ὁ δὲ μὴ γενεαλογούμενος ἐξ αὐτῶν
  choice: 可是，这位不属于他们谱系的人
  rationale: 分词结构指麦基洗德，强调他不在前文所说利未子孙的谱系之内。译文保留谱系与祭司资格的关联，同时避免推断麦基洗德的本体或身世。
- source_word: δεδεκάτωκεν Ἀβραάμ
  choice: 竟从亚伯拉罕收取了十分之一
  rationale: 动词表示向某人取或收十分之一；“竟”自然体现 δέ 所引出的强烈反差。中文用完成体“了”表达该行动已经发生，并保留其在论证中的意义。
- source_word: τὸν ἔχοντα τὰς ἐπαγγελίας
  choice: 这位拥有应许的人
  rationale: 贴近现在分词 ἔχοντα，并保留复数定冠词短语所概括的多项应许；上下文清楚表明所指仍是亚伯拉罕。
- source_word: εὐλόγηκεν
  choice: 给……祝福
  rationale: 准确表达麦基洗德对亚伯拉罕施予祝福的动作；与中文完成体配合，既叙述既成事件，也服务于本段持续的论证。
theological_decisions:
- issue: 麦基洗德与利未谱系的关系
  choice: 译为“不属于他们谱系”，将重点放在麦基洗德不属于利未支派的祭司谱系。
  alternative: 可译为“他的族谱并不是从他们那里追溯的”或“他并非他们的后裔”。
  rationale: 本段论证关乎不依赖利未家谱的祭司身份。译文不把这句话扩展为麦基洗德没有父母、没有祖先或具有某种超自然本体的断言。
- issue: 亚伯拉罕与应许的时态关系
  choice: 译为“拥有应许的人”，保留希腊文现在分词的形式和修辞力度。
  alternative: 可按过去叙事语境译为“得着了应许的人”或“拥有应许的亚伯拉罕”。
  rationale: “拥有”保留原文所呈现的持续状态，不替读者消解现在分词与过去事件之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“谱系”保留本段家谱与祭司资格的论证关联；“十分之一”比单用教会术语更透明。“竟”突出麦基洗德虽不属利未谱系，却向亚伯拉罕收取十分之一并为他祝福这一反差。
