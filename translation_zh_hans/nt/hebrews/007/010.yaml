base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/010.yaml
  text: For he was still in the loins of his father when Melchizedek met him[a].
translation:
  language: zh_hans
  text: 因为麦基洗德与他相遇时，利未还在他的先祖的腰中[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“利未还在他的先祖的身体里。”希腊文直译为“在他的先祖的腰中”，是表示祖源和血统传承的说法。
    reason: 说明原文具体的身体隐喻及其习语意义，并提供较易懂的意译。
lexical_decisions:
- source_word: ἔτι
  choice: 还
  rationale: 表达在麦基洗德与亚伯拉罕相遇之时，利未仍处于尚未出生、寓于先祖之中的状态。
- source_word: γὰρ
  choice: 因为
  rationale: 承接上一节并说明利未为何也可说借着亚伯拉罕献上了十分之一；现代汉语中“因为”自然清楚。
- source_word: ἐν τῇ ὀσφύϊ
  choice: 在……的腰中
  rationale: 保留希腊文具体的身体隐喻；这里是表示生殖来源和血统承继的古代说法。
- source_word: τοῦ πατρὸς
  choice: 他先祖的
  rationale: πατήρ在谱系语境中可指祖先；此处所指是利未的先祖亚伯拉罕。译作“先祖”既符合实际亲属关系，也避免现代读者误以为是利未的直接父亲。
- source_word: ἦν
  choice: 在
  rationale: 与“在……中”组合，自然表达希腊文未完成时ἦν所描述的当时状态。
- source_word: ὅτε
  choice: ……的时候
  rationale: 准确表达时间关系，并符合现代汉语叙述习惯。
- source_word: συνήντησεν
  choice: 迎接
  rationale: 可表示相遇或迎面会见；结合创世记14章麦基洗德出来迎接亚伯兰的背景，“迎接”较自然，同时不扩展事件内容。
- source_word: αὐτῷ
  choice: 他
  rationale: 保留原文代词；上下文表明所指为亚伯拉罕。
- source_word: Μελχισέδεκ
  choice: 麦基洗德
  rationale: 采用现代中文圣经中通行的人名译法。
theological_decisions:
- issue: 利未寓于亚伯拉罕之中的祖源表述
  choice: 正文保留“在他先祖的腰中”这一具体隐喻
  alternative: 意译为“还在他先祖的身体里”或“还没有从先祖而生”
  rationale: 作者的论证以利未按血统寓于亚伯拉罕之中为基础。保留“腰中”可使这种代表性和祖源性的论证保持可见，而脚注说明其习语意义，不将其发展为额外的神学体系。
- issue: πατήρ所指亲属关系的表达
  choice: 译作“先祖”
  alternative: 直译作“父亲”，或明确译作“先祖亚伯拉罕”
  rationale: 希腊文πατήρ可广义指祖先，而此处亚伯拉罕并非利未的直接父亲。“先祖”准确传达谱系关系；不在正文加入“亚伯拉罕”，则保留原文以普通名词和代词指称的方式。
- issue: 麦基洗德与亚伯拉罕相遇的动作
  choice: 译作“迎接”
  alternative: 译作“遇见”
  rationale: 两者均在συναντάω的语义范围内；“迎接”与创世记叙事背景相合，但不改变本节论证。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“腰中”略带古典色彩，但为保留原文关键隐喻而采用，并以脚注解释；句首“因为”清楚承接前文的论证。
