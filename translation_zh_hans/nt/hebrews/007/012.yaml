  text: μετατιθεμένης γὰρ τῆς ἱερωσύνης ἐξ ἀνάγκης καὶ νόμου μετάθεσις γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/012.yaml
  text: For when the priesthood is changed[a], of necessity there is also a change of law.
translation:
  language: zh_hans
  text: 因为祭司职分一经改变，律法[a]也必然随之改变。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “律法”在此也可理解为特指设立利未祭司职分的摩西律法。
    reason: 保留 νόμου 在语法上较宽的表达，同时说明其在上下文中指向摩西律法。
lexical_decisions:
- source_word: μετατιθεμένης
  choice: 改变
  rationale: 此处为属格独立结构中的分词，表示祭司制度由原有安排转为另一安排；“改变”自然清楚，也不把含义过度限定为单纯的转交或废除。
- source_word: ἱερωσύνης
  choice: 祭司职分
  rationale: 指祭司的制度性职任，而非某一次祭司行为；“祭司职分”在现代汉语中比单说“祭司职”更清楚。
- source_word: ἐξ ἀνάγκης
  choice: 必然
  rationale: 表达逻辑上的必要性：祭司职分若改变，相关律法也必须相应改变。
- source_word: νόμου
  choice: 律法
  rationale: 在上下文中指规范祭司职分的律法秩序，并自然包含摩西律法；希腊文无冠词，正文不额外加入“这律法”等限定。
- source_word: μετάθεσις
  choice: 改变
  rationale: 与前面的 μετατιθεμένης 同源，形成刻意的词语呼应；重复“改变”可忠实保留这一论证结构。
- source_word: γίνεται
  choice: 随之改变
  rationale: 表示相应变化发生；与“也”和“必然”结合，译为“也必然随之改变”符合现代汉语表达，并清楚呈现结果关系。
- source_word: καὶ
  choice: 也
  rationale: 表明律法的改变是祭司职分改变所带来的相应结果。
- source_word: γὰρ
  choice: 因为
  rationale: 承接上文并说明理由；“因为”在现代汉语中清楚呈现解释关系。
theological_decisions:
- issue: νόμος 的范围及其与祭司职分的关系
  choice: 正文译为“律法”，既可指规范祭司职分的律法安排，也在上下文中自然指向摩西律法。
  alternative: 可理解为“这律法”或明确译作“摩西律法”，使特指意味更突出。
  rationale: 本节论证祭司职分的改变必然伴随相关律法秩序的改变。上下文明显涉及摩西律法，但无冠词的 νόμου 本身不要求在正文中加入过强的特指限定，因此以脚注说明其具体语境。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“既然……也必然随之……”保留原文属格独立结构所表达的前提与逻辑必然性；“祭司职分”突出制度和职任层面。
