id: HEB.7.15
reference: Hebrews 7:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ περισσότερον ἔτι κατάδηλόν ἐστιν, εἰ κατὰ τὴν ὁμοιότητα Μελχισέδεκ ἀνίσταται ἱερεὺς ἕτερος,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/015.yaml
  text: And it is even more evident[a], if another priest arises according to the likeness of Melchizedek[b],
translation:
  language: zh_hans
  text: 而且，如果有另一位[a]祭司照着麦基洗德的样式[b]兴起，这一点就更加明显了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“一位不同的祭司”；ἕτερος不仅可以表示数目上的“另一位”，也可以强调性质或类别上的不同。
    reason: lexical_alternative
  - marker: b
    text: “照着麦基洗德的样式”呼应本章引用并论述的《诗篇》110:4。
    reason: cross_reference
lexical_decisions:
- source_word: περισσότερον ἔτι
  choice: 更加
  rationale: 这一比较性副词短语强化上文已经提出的论点；“更加”在现代汉语中自然地保留递进语气。
- source_word: κατάδηλόν
  choice: 明显
  rationale: 该词表示显明、清楚；“明显”准确自然，也避免与“更加”重复强化。
- source_word: εἰ
  choice: 如果
  rationale: 保留希腊文条件连词的形式；虽在论证中可接近“既然”或“当……时”，但不在正文中替作者消解其条件表达。
- source_word: κατὰ τὴν ὁμοιότητα
  choice: 照着……的样式
  rationale: 既贴近介词结构，又以自然、庄重的现代汉语表达与麦基洗德相似或相应的模式，并维持本章与诗篇110:4相关的论证措辞。
- source_word: Μελχισέδεκ
  choice: 麦基洗德
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: ἀνίσταται
  choice: 兴起
  rationale: 在祭司出现或被设立的语境中，“兴起”保留原动词意象，同时不把它过度限定为复活。
- source_word: ἱερεὺς ἕτερος
  choice: 另一位祭司
  rationale: “另一位”自然表达数目上的另一个，也容许ἕτερος所含的类别差异；其“不同”之意在脚注中说明，避免正文过度强调。
theological_decisions:
- issue: ἕτερος对于祭司职分之差异性的含义
  choice: 另一位祭司
  alternative: 一位不同的祭司
  rationale: 本节论及一位有别于利未体系、照麦基洗德样式兴起的祭司。“另一位祭司”通顺且保留基本语义；“不同的祭司”虽能突出类别差异，却可能在正文中把该层含义说得过满，因此列入脚注。
- issue: εἰ在论证中的条件或推论作用
  choice: 如果
  alternative: 既然
  rationale: 希腊文形式上使用条件连词。译作“如果”保存句法及论证张力，不预先将其解释为已确定事实的原因从句。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“而且”承接上文，“这一点”补明汉语主语，使整句自然完整；保留“如果”的条件形式，并用“照着……的样式”“兴起”等措辞维持原文意象及本章互文联系。
