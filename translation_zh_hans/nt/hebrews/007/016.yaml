  text: ὃς οὐ κατὰ νόμον ἐντολῆς ⸀σαρκίνης γέγονεν ἀλλὰ κατὰ δύναμιν ζωῆς ἀκαταλύτου,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/016.yaml
  text: who has become such not according to a law of a fleshly commandment[a], but according to the power of an indestructible life[c][b],
translation:
  language: zh_hans
  text: 他成为祭司，并不是照着属肉身的律例[a]，而是凭着不能毁灭的生命的大能[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “属肉身的律例”也可译作“关于身体的规定”或“属肉身的诫命之律”。这里的“属肉身”并非指邪恶或有罪。
    reason: lexical_alternative
  - marker: b
    text: “不能毁灭的生命”传统译作“无穷的生命”或“无尽的生命”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: 他
  rationale: 关系代词承接上文所说的那一位；汉语用“他”自然衔接，同时避免生硬照搬关系从句。
- source_word: κατὰ νόμον
  choice: 按照……之律
  rationale: κατά加宾格表示准则或依据；νόμον无冠词，故不特指“那律法”，而译作某种律则。
- source_word: ἐντολῆς σαρκίνης
  choice: 属血肉的诫命
  rationale: 保留σαρκίνης与“血肉”的词汇联系，指向身体、世系和必死层面的规定，不赋予“罪性”含义。
- source_word: γέγονεν
  choice: 成为祭司
  rationale: 完成时表达已经成为并处于这一身份；“祭司”由上文省略而得，在汉语中补出可使本节独立可读。
- source_word: ἀλλὰ κατὰ δύναμιν
  choice: 而是按照……的能力
  rationale: 与前一个κατά短语形成清楚的对照，并保留以准则或依据来陈述的句式。
- source_word: ζωῆς ἀκαταλύτου
  choice: 不能毁灭之生命
  rationale: ἀκατάλυτος指不能被拆毁、消解或终结；此译法不仅表达无尽的持续，也保留不可摧毁的力度。
theological_decisions:
- issue: σαρκίνης在本节中的含义
  choice: 译为“属血肉的”，表示身体、世系及必死层面的资格
  alternative: “身体方面的”或“肉身的”
  rationale: 上下文把外在、世系性的祭司规定与不能毁灭之生命的能力对照；这里并非说该诫命有罪。
- issue: νόμον ἐντολῆς σαρκίνης的属格关系
  choice: 译作“属血肉的诫命之律”，保留“律”与“诫命”之间较紧密但未完全解释的关系
  alternative: “由属血肉的诫命所规定的律”
  rationale: 原文可理解为性质、内容或同位关系；主文不加入“所规定的”等解释性措辞，以保存其真实歧义。
- issue: ἀκαταλύτου的语义范围
  choice: 译为“不能毁灭的”
  alternative: “无穷的”或“无尽的”
  rationale: 原词强调不能被消解或废除，不仅仅强调时间没有终点。
translation_notes:
  register: 采用现代、庄重且可朗读的书面普通话。“之律”和“之生命”略带经文体色彩，用来保留原文紧凑的属格结构；不把“属血肉”道德化。
