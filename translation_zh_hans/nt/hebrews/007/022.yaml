  text: κατὰ ⸀τοσοῦτο ⸀κρείττονος διαθήκης γέγονεν ἔγγυος Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/022.yaml
  text: By so much[a], Jesus has become the guarantor of a better covenant.
translation:
  language: zh_hans
  text: 正因如此，耶稣成了更美之约[a]的担保人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“遗嘱”。希腊词在某些语境中可以指“遗嘱”，但本节关于祭司职分和誓言的论述更适合译作“约”。
    reason: alternative_reading
lexical_decisions:
- source_word: κατὰ τοσοῦτο
  choice: 正因如此
  rationale: 该短语表示程度或相应关系，并承接上文关于誓言所显示的重大差别。“正因如此”在现代汉语中自然地保留了与前文的紧密联系；其程度含义也由下文“更美”这一比较表达共同体现。
- source_word: κρείττονος
  choice: 更美
  rationale: κρείττων是《希伯来书》中反复出现的比较词。“更美”既保留比较意味，也符合中文圣经语体，并比“更优越”更自然庄重。
- source_word: διαθήκης
  choice: 约
  rationale: 本节处于祭司职分与誓言的论证中，主要指上帝所设立的盟约关系，因此译作“约”。该词在某些上下文也可指“遗嘱”，以脚注保留这一词义可能性。
- source_word: γέγονεν
  choice: 成了
  rationale: γίνομαι的完成时表达已经发生并持续有效的状态。中文“成了”简洁自然，在语境中可表达耶稣现今具有这一身份。
- source_word: ἔγγυος
  choice: 担保人
  rationale: 该词指为某项承诺或义务提供保证的人。“担保人”准确表达其个人身份，且避免与《希伯来书》另一个术语“中保”混同。
- source_word: Ἰησοῦς
  choice: 耶稣
  rationale: 采用现代中文圣经中通行的人名译法。
theological_decisions:
- issue: διαθήκη在希伯来书7:22中的含义
  choice: 约
  alternative: 遗嘱
  rationale: 上下文讨论耶稣的祭司职分，以及上帝借誓言确立的更美安排，因而“约”最符合当前论证。脚注保留“遗嘱”这一在其他语境中可能成立的含义，不在正文中提前引入该含义。
- issue: ἔγγυος与“中保”的区分
  choice: 担保人
  alternative: 中保
  rationale: ἔγγυος强调提供担保的人，而“中保”通常对应μεσίτης。译作“担保人”可保留作者在相关术语之间的区别，不把后文的中保概念直接带入本节。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“更美之约”略带正式色彩，可体现《希伯来书》反复出现的比较性修辞；“担保人”则使用当代读者容易理解的准确用语。
