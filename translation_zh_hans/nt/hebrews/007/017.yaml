id: HEB.7.17
reference: Hebrews 7:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ⸀μαρτυρεῖται γὰρ ὅτι Σὺ ἱερεὺς εἰς τὸν αἰῶνα κατὰ τὴν τάξιν Μελχισέδεκ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/017.yaml
  text: 'For it is testified: “You are a priest forever according to the order of Melchizedek.”[a][b]'
translation:
  language: zh_hans
  text: 因为有经文作证说：“你永远是祭司，照着麦基洗德的等次。”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “等次”也可译为“样式”或“类别”。
    reason: lexical_alternative
  - marker: b
    text: 引自《诗篇》110:4。
    reason: cross_reference
lexical_decisions:
- source_word: μαρτυρεῖται
  choice: 有经文作证说
  rationale: 该词是现在时被动形式，在这里以非人称方式引出经文的见证。译文保留“作证”的含义，并按上下文自然表明这是经文的见证，但不另行指定说话者。
- source_word: γὰρ
  choice: 因为
  rationale: 承接上文，为前面的论述提供根据；“因为”在现代汉语中清楚自然。
- source_word: ὅτι
  choice: 说：
  rationale: 该词引出见证的具体内容；汉语用“说”加冒号引出直接引语，比直译为“即”或“说……是”更自然。
- source_word: Σὺ
  choice: 你
  rationale: 第二人称单数代词，位于显著位置；“你”保留诗篇引文中的直接称呼。
- source_word: ἱερεὺς
  choice: 祭司
  rationale: 准确表达祭司身份，不扩译为“ 大祭司”，以免加入本节原文没有的限定。
- source_word: εἰς τὸν αἰῶνα
  choice: 永远
  rationale: 这是表示持续到永远的惯用语；“永远”简洁、自然，也准确传达其时间意义。
- source_word: κατὰ τὴν τάξιν
  choice: 照着……的等次
  rationale: κατά表示依照或对应，τάξις可指秩序、类别或等次。“等次”保留祭司类别与秩序两方面的可能含义，并以脚注提示较通俗的译法。
- source_word: Μελχισέδεκ
  choice: 麦基洗德
  rationale: 采用现代中文圣经读者熟悉的人名音译。
theological_decisions:
- issue: 是否把ἱερεύς扩译为“大祭司”
  choice: 祭司
  alternative: 大祭司
  rationale: 本节原文只有“祭司”。虽然《希伯来书》在其他地方称耶稣为大祭司，但在此补入“大”会超出原文，并提前替本节解释其神学含义。
- issue: 如何表达“照着麦基洗德的等次”
  choice: 保留“等次”及其类别、秩序上的含混性
  alternative: 照着麦基洗德的样式
  rationale: τάξις既可强调有序的类别，也可表达对应的方式。“样式”较易懂，却可能把含义收窄为单纯相似；正文采用“等次”，脚注列出“样式”这一可能译法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“有经文作证说”清楚表明这里引述经文，同时保留原文非人称被动表达的功能；引文简洁直接。“等次”略具经文语体色彩，因此用脚注补充较通俗的可能译法。
