  text: πρόδηλον γὰρ ὅτι ἐξ Ἰούδα ἀνατέταλκεν ὁ κύριος ἡμῶν, εἰς ἣν φυλὴν ⸂περὶ ἱερέων οὐδὲν⸃ Μωϋσῆς ἐλάλησεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/014.yaml
  text: For it is evident that our Lord has arisen from Judah[a], a tribe about which Moses said nothing concerning priests.
translation:
  language: zh_hans
  text: 因为显而易见的是，我们的主是从犹大兴起的[a]；关于这个支派，摩西没有说过任何有关祭司的话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“从犹大发出”。希腊语动词带有升起或萌发的意象；这里主要指源自犹大支派，并非主要指复活。
    reason: lexical_alternative
lexical_decisions:
- source_word: πρόδηλον
  choice: 显而易见
  rationale: 作为无人称述语，引出一项明确可知的事实；“显而易见”自然、庄重，并保留原文较强的确定语气。
- source_word: γὰρ
  choice: 因为
  rationale: 承接上文并说明理由，清楚呈现本节在论证中的解释关系。
- source_word: ἐξ Ἰούδα
  choice: 从犹大
  rationale: ἐκ表示来源或出身；后文已明确提到“支派”，此处不重复增译。
- source_word: ἀνατέταλκεν
  choice: 是……兴起的
  rationale: 完成时形式表达已经发生且其结果持续的事实；“兴起”保留ἀνατέλλω所含升起、萌发的意象，同时上下文限定其主要指从犹大而出的血统来源。
- source_word: ὁ κύριος ἡμῶν
  choice: 我们的主
  rationale: 按原文保留称号和所属关系，不在正文中增补“耶稣”。
- source_word: εἰς ἣν φυλήν
  choice: 关于这个支派
  rationale: 此处εἰς引出所涉及的对象；现代汉语用“关于这个支派”自然地回指犹大支派。
- source_word: περὶ ἱερέων οὐδὲν
  choice: 从未说过任何有关祭司的事
  rationale: 保留原文具体的复数“祭司”，不抽象化为“祭司制度”或“祭司职分”；结合否定词译得符合现代汉语。
- source_word: Μωϋσῆς ἐλάλησεν
  choice: 摩西……说过
  rationale: λαλέω在此为一般的“说、谈及”；“说过”自然表达摩西律法中未曾提及此事。
theological_decisions:
- issue: “我们的主”的所指
  choice: 正文保留“我们的主”，由上下文指向耶稣
  alternative: 直接译作“我们的主耶稣”
  rationale: 希腊文只有称号“我们的主”；上下文足以确认所指，无须在正文增补名字。
- issue: ἀνατέταλκεν的含义
  choice: 译作“兴起”，并以脚注说明此处主要指源自犹大
  alternative: 译作“出自”或容易使人联想到复活的“复起”
  rationale: “兴起”保留升起、萌发的词汇意象，也不把血统含义直接取代原有隐喻；本段讨论支派出身，因此并非主要指复活。
- issue: 摩西没有谈及的范围
  choice: 摩西没有说任何有关这个支派之祭司的事
  alternative: 理解为摩西从未谈论任何祭司
  rationale: 关系从句限定“这个支派”，否定的是摩西关于犹大支派祭司的论述，而不是否认摩西曾谈论祭司。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“显而易见”保持论证力度；“兴起”保存原文意象，并通过脚注防止误解为主要指复活。正文中的[a]与脚注标记一致。
