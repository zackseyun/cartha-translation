source:
  edition: SBLGNT
  text: ὃς οὐκ ἔχει καθ’ ἡμέραν ἀνάγκην, ὥσπερ οἱ ἀρχιερεῖς, πρότερον ὑπὲρ τῶν ἰδίων ἁμαρτιῶν θυσίας ἀναφέρειν, ἔπειτα τῶν τοῦ λαοῦ (τοῦτο γὰρ ἐποίησεν ἐφάπαξ ἑαυτὸν ἀνενέγκας)·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/027.yaml
  text: who has no need[a], day after day, like the high priests, to offer up sacrifices first for his own sins and then for those of the people[d][c][b], for this he did once for all when he offered up himself.
translation:
  language: zh_hans
  text: 他不像那些大祭司那样，天天都需要先为自己的罪献上祭物，然后再为百姓的罪[b]献上；因为他献上自己时[d]，一次就永远完成了这事[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 希腊原文为省略表达，直译是“然后是百姓的那些”，其中“罪”承接上文。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“只此一次”或“一次就彻底”。原词强调这行动只发生一次，并具有决定性。
    reason: lexical_alternative
  - marker: d
    text: 或译“借着献上自己”或“献上了自己”。原文分词可侧重时间，也可兼有方式或手段的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: 天天
  rationale: 这一习语表达逐日重复的需要；“天天”简洁自然，并保留反复发生的意味。
- source_word: ἀνάγκην
  choice: 须
  rationale: 与否定词连用译作“无须”，符合现代汉语习惯，也准确表达“没有必要”。
- source_word: ὥσπερ οἱ ἀρχιερεῖς
  choice: 不像那些大祭司
  rationale: 原文作比较；结合前面的否定结构，以“不像”表达最自然，并保留“大祭司”的复数所指。
- source_word: πρότερον ... ἔπειτα
  choice: 先……然后再……
  rationale: 清楚表达献祭次序，符合现代汉语表达。
- source_word: ὑπὲρ τῶν ἰδίων ἁμαρτιῶν
  choice: 为自己的罪
  rationale: 在献祭语境中，ὑπέρ表示“为、为了处理”；此译简明准确。
- source_word: θυσίας ἀναφέρειν
  choice: 献上祭物
  rationale: ἀναφέρω与θυσία连用具有祭祀含义；“献上祭物”既保留礼仪语域，也自然易懂。
- source_word: τῶν τοῦ λαοῦ
  choice: 为百姓的罪献上
  rationale: 原文为省略结构，承接前面的“罪”和“献上祭物”；正文补足必要成分，使中文清楚通顺。
- source_word: τοῦτο γὰρ ἐποίησεν
  choice: 因为……成就了这事
  rationale: “这事”保留τοῦτο的回指作用；“成就”比单纯的“做”更适合这里一次性完成祭献行动的语境。
- source_word: ἐφάπαξ
  choice: 一次而永远地
  rationale: 兼顾“只发生一次”与其决定性、不可重复的力量，是《希伯来书》此处强调的重点。
- source_word: ἑαυτὸν ἀνενέγκας
  choice: 他献上自己时
  rationale: 保留ἀναφέρω的献祭含义，并将不定过去时分词按时间关系自然译出；同时不排除其兼具方式或手段意味。
theological_decisions:
- issue: “这事”（τοῦτο）的指代范围
  choice: 保留“这事”的回指，不在正文中明确限定其只指哪一部分祭献行动。
  alternative: 明确译成“他为百姓的罪所献的祭”或泛指“全部祭司工作”。
  rationale: 原文的回指范围存在一定张力。上下文明确将耶稣与必须先为自己献祭的大祭司区别开来，却没有在本句语法中把τοῦτο改写成一个完全明确的名词短语；保留“这事”既避免暗示他为自己的罪献祭，也不越过原文消除回指上的张力。
- issue: 基督献上自己所具有的祭献性质
  choice: 译作“献上自己”。
  alternative: 译作“舍了自己”或“把自己交出来”。
  rationale: 本段强调耶稣既是祭司又亲自成为祭物；“献上自己”保留原文的祭祀和祭司语域，避免将其淡化为一般性的自我牺牲。
- issue: ἐφάπαξ所表达的一次性和终局性
  choice: 译作“一次而永远地”。
  alternative: 只译“一次”或译“一次就彻底”。
  rationale: 此词不仅表示次数为一，也强调行动具有决定性、无需重复；正文兼顾这两层含义，但不进一步规定其系统神学表达。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“无须天天”“先……然后再……”保持句意清晰；“献上祭物”“献上自己”保留本段必要的祭祀语域。分号划分比较与解释两部分，避免长句层次不清。
