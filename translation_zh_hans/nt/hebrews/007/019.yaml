  text: οὐδὲν γὰρ ἐτελείωσεν ὁ νόμος, ἐπεισαγωγὴ δὲ κρείττονος ἐλπίδος, δι’ ἧς ἐγγίζομεν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/019.yaml
  text: For the law perfected nothing[a], but there is the introduction of a better hope[b], through which we draw near to God.
translation:
  language: zh_hans
  text: 因为律法没有使任何事达到完全[a]；但引进了一个更美的盼望[b]，借着这盼望，我们亲近上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为律法没有使什么完全。”希腊语动词也可指“使……成全”或“使……达到目标”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“一个更美盼望的引进。”原文此处为省略了限定动词的名词结构。
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: οὐδὲν
  choice: 任何事
  rationale: 作ἐτελείωσεν的中性宾语；与否定词连用译作“没有使任何事……”，保留绝对否定，同时避免误解为律法毫无任何作用。
- source_word: γὰρ
  choice: 因为
  rationale: 承接上文，说明前述论断的根据；现代汉语中“因为”清楚自然。
- source_word: ἐτελείωσεν
  choice: 使……达到完全
  rationale: τελειόω在《希伯来书》中兼有达到目标、成全及完全之意。此译保留其过程与目标含义，也维持全书相关术语的神学张力。
- source_word: ὁ νόμος
  choice: 律法
  rationale: 上下文所指为摩西律法及其祭司制度；“律法”是现代中文圣经语境中准确而通行的表达。
- source_word: ἐπεισαγωγὴ
  choice: 被引进来
  rationale: 该名词表示引入、带进。希腊文为省略谓语的名词结构；中文采用被动表达，使对比自然，又不过度指定时态。
- source_word: δὲ
  choice: 另一方面
  rationale: 标明与律法不能使事物完全之间的鲜明转折；分号后用“另一方面”既呈现对比，也避免把原文补成过强的逻辑关系。
- source_word: κρείττονος ἐλπίδος
  choice: 一个更美的盼望
  rationale: κρείττων是《希伯来书》的关键词，表示比较意义上的更好、更优越；“更美”庄重自然，并保留全书惯用的比较措辞。
- source_word: δι’ ἧς
  choice: 借着这盼望
  rationale: 阴性关系代词最自然地回指“盼望”；明示所指可避免中文关系结构含混，并表达途径或媒介。
- source_word: ἐγγίζομεν
  choice: 我们可以亲近
  rationale: 该词在《希伯来书》中带有敬拜及来到上帝面前的意味。“亲近”保留这种关系与礼仪色彩；“可以”在中文中自然呈现由此获得的途径，但不把盼望本身解释为人的功劳。
- source_word: τῷ θεῷ
  choice: 上帝
  rationale: 作ἐγγίζομεν的与格补语，译为“亲近上帝”符合现代标准汉语。
theological_decisions:
- issue: 律法与τελειόω的关系
  choice: 律法没有使任何事达到完全
  alternative: 律法什么也没有成就；律法没有使任何人完全
  rationale: 原文宾语οὐδὲν是中性，宜保留“任何事/什么”的开放性，不限定为人；同时把τελειόω译为“达到完全”，避免将本句误读为律法在所有意义上都毫无作用。
- issue: 后半句的省略结构
  choice: 译为“另一方面，一个更美的盼望被引进来”
  alternative: 但引进了一个更美的盼望；但有一个更美盼望的引进
  rationale: 原文没有明示限定动词，采用自然中文的被动结构来表达名词ἐπεισαγωγή，同时不武断补出具体施事者或时态。
- issue: 借着盼望亲近上帝
  choice: 将关系代词明确回指“盼望”
  alternative: 将其理解为借着所引进的新安排或借着基督
  rationale: 语法上ἧς与ἐλπίδος性数一致，最直接的先行词是“盼望”。译文保留此直接关系，不在本节中额外补入虽可能由上下文支持的神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“达到完全”保存《希伯来书》中τελειόω的关键词联系；“更美的盼望”和“亲近上帝”保持经文的礼仪及神学语域。主文以自然中文处理希腊文省略句，脚注则说明其较直译的形式与宾语可能性。
