  text: καὶ οἱ μὲν ἐκ τῶν υἱῶν Λευὶ τὴν ἱερατείαν λαμβάνοντες ἐντολὴν ἔχουσιν ἀποδεκατοῦν τὸν λαὸν κατὰ τὸν νόμον, τοῦτ’ ἔστιν τοὺς ἀδελφοὺς αὐτῶν, καίπερ ἐξεληλυθότας ἐκ τῆς ὀσφύος Ἀβραάμ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/005.yaml
  text: And those from the sons of Levi who receive the priesthood have a commandment according to the law to collect a tenth from the people—that is[b][a], from their brothers—though they also have come from Abraham’s loins.
translation:
  language: zh_hans
  text: 利未的子孙中，那些领受祭司职分的人，照律法受命向百姓收取十分之一；也就是说，向他们自己的弟兄[a]收取，尽管这些弟兄也都是从亚伯拉罕的腰中而出[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄”在这里广义指同属以色列民的人，也可译作“自己的以色列同胞”。
    reason: lexical_alternative
  - marker: b
    text: 也就是“都是亚伯拉罕的后裔”。原文直译为“都是从亚伯拉罕的腰中而出”。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ μὲν ἐκ τῶν υἱῶν Λευὶ
  choice: 那些利未子孙中……的人
  rationale: 保留ἐκ的部分含义和υἱῶν的家族血统表达，指利未后裔中担任祭司职分的那些人，而非笼统指所有利未人。
- source_word: τὴν ἱερατείαν λαμβάνοντες
  choice: 领受祭司职分
  rationale: “领受”体现λαμβάνοντες所表达的受任、取得，而非自行夺取；“祭司职分”在现代汉语中自然且准确。
- source_word: ἐντολὴν ἔχουσιν
  choice: 有命令
  rationale: 保留希腊文的名词结构，并传达律法所赋予的规范性命令。
- source_word: ἀποδεκατοῦν
  choice: 收取十分之一
  rationale: 该动词指从别人那里征收十分之一，而非自己奉献十分之一；此译法避免“什一奉献”可能产生的施受关系含混。
- source_word: τὸν λαὸν
  choice: 百姓
  rationale: 直接对应λαός；后面的解释语明确其所指是共同属于以色列民的弟兄。
- source_word: κατὰ τὸν νόμον
  choice: 照着律法
  rationale: 准确表达κατά加宾格的规范依据，语言简洁自然。
- source_word: τοῦτ’ ἔστιν
  choice: 也就是
  rationale: 自然呈现解释性同位语，说明“百姓”即祭司自己的弟兄。
- source_word: τοὺς ἀδελφοὺς αὐτῶν
  choice: 自己的弟兄
  rationale: 保留ἀδελφούς的男性亲属用语及其盟约群体色彩；脚注说明此处广义指同胞以色列人。
- source_word: καίπερ
  choice: 尽管
  rationale: 清楚表达让步关系，同时保持庄重、流畅。
- source_word: ἐξεληλυθότας ἐκ τῆς ὀσφύος Ἀβραάμ
  choice: 也都是从亚伯拉罕的腰中出来的
  rationale: 保留身体性的血统隐喻和完成时所呈现的既成出身；“也”突出祭司与其弟兄同出一祖，符合本段论证。
theological_decisions:
- issue: 以男性亲属词表达以色列共同体成员
  choice: 自己的弟兄
  alternative: 自己的以色列同胞
  rationale: 原文使用阳性复数ἀδελφούς，并借亲属关系表达共同的民族与盟约身份。正文保留这一形象，脚注交代其广义所指。
- issue: 保留亚伯拉罕身体所出的血统习语
  choice: 从亚伯拉罕的腰中出来
  alternative: 是亚伯拉罕的后裔
  rationale: 本章论证重视共同的肉身血统；保留具体习语可维持修辞力度，而脚注提供自然汉语释义。
- issue: 律法命令与收取十分之一的关系
  choice: 照着律法有命令向百姓收取十分之一
  alternative: 按律法受命向百姓收取十分之一
  rationale: 保留ἐντολὴν ἔχουσιν的名词结构和律法性的语气，不额外引入关于命令来源或祭司权柄的教派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“领受祭司职分”“照着律法”保持经文语域；正文保留“弟兄”和“从……腰中出来”两处原文形象，以脚注帮助普通读者理解。所有脚注标记均置于正文相应词句之后。
