  text: Οὗτος γὰρ ὁ Μελχισέδεκ, βασιλεὺς Σαλήμ, ἱερεὺς τοῦ θεοῦ τοῦ ὑψίστου, ⸀ὁ συναντήσας Ἀβραὰμ ὑποστρέφοντι ἀπὸ τῆς κοπῆς τῶν βασιλέων καὶ εὐλογήσας αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/001.yaml
  text: For this Melchizedek[a], king of Salem, priest of God Most High, met Abraham as he was returning from the slaughter of the kings and blessed him[b],
translation:
  language: zh_hans
  text: 原来，这位麦基洗德是撒冷王、至高神的祭司；他遇见从杀败众王之后归来的亚伯拉罕[a]，并为他祝福，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “杀败众王”或译“对众王的杀戮”。希腊原文更直译为“从众王的杀戮之后”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὗτος γὰρ ὁ Μελχισέδεκ
  choice: 原来，这位麦基洗德
  rationale: γάρ承接并解释上文，用“原来”自然显出论证联系；“这位”保留Οὗτος的指示意味；人名采用现代中文圣经通行译名。
- source_word: βασιλεὺς Σαλήμ
  choice: 撒冷王
  rationale: 采用简洁自然的汉语称谓，并保留与《创世记》14章的名称联系。
- source_word: ἱερεὺς τοῦ θεοῦ τοῦ ὑψίστου
  choice: 至高神的祭司
  rationale: τοῦ ὑψίστου修饰“神”，构成“至高神”这一称号；此译法准确、自然且庄重。
- source_word: ὁ συναντήσας Ἀβραὰμ
  choice: 他迎接了……亚伯拉罕
  rationale: συναντάω表示相遇、迎面遇见；结合《创世记》14章的场景，“迎接”比单纯“遇见”更贴切。
- source_word: ὑποστρέφοντι
  choice: 归来的
  rationale: 现在分词描述亚伯拉罕当时正在返回；汉语定语结构简洁地保留了动作同时发生的关系。
- source_word: ἀπὸ τῆς κοπῆς τῶν βασιλέων
  choice: 击败众王后
  rationale: κοπή字面有“砍倒、杀戮”之意，在战争语境中也可指杀败敌方；正文采用“击败”以避免断言众王本人全被杀死，同时以脚注保留原词的强烈字面含义。
- source_word: καὶ εὐλογήσας αὐτόν
  choice: 并为他祝福
  rationale: 与“迎接”并列，表达麦基洗德对亚伯拉罕所做的第二个动作；“为他祝福”是自然、明确的现代汉语。
theological_decisions:
- issue: τοῦ θεοῦ τοῦ ὑψίστου所表达的神圣称号
  choice: 至高神的祭司
  alternative: 至高者神的祭司
  rationale: “至高神”按现代汉语自然地将ὕψιστος理解为修饰θεός的称号，不增添特定宗派解释，也不改变其神学指向。
- issue: ἀπὸ τῆς κοπῆς τῶν βασιλέων是否断言众王被杀
  choice: 击败众王后
  alternative: 杀戮众王后
  rationale: 原词带有“砍杀”的强烈色彩，但属格“众王”在军事叙事中可指以众王为首的势力；正文不把语义过度限定为众王本人均被杀，脚注则保留较直译的可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以分号连接身份说明与后续行动，并保留句末逗号，反映希腊原文在本节末尚未完成、继续进入下文的长句结构。
