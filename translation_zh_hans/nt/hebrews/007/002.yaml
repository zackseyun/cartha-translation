  text: ᾧ καὶ δεκάτην ἀπὸ πάντων ἐμέρισεν Ἀβραάμ, πρῶτον μὲν ἑρμηνευόμενος βασιλεὺς δικαιοσύνης ἔπειτα δὲ καὶ βασιλεὺς Σαλήμ, ὅ ἐστιν βασιλεὺς εἰρήνης,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/002.yaml
  text: to whom Abraham also apportioned a tenth of everything[a]. First, his name is translated King of Righteousness, and then also King of Salem, that is[b], King of Peace.
translation:
  language: zh_hans
  text: 亚伯拉罕也把一切的十分之一分给了他[a]。首先，按名字解释，他是“公义之王”[b]；然后又是撒冷王，就是“和平之王”。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“十分之一。”希腊文直译为“从一切中取出的十分之一”或“一切的十分之一”。
    reason: lexical_alternative
  - marker: b
    text: “公义”也可译作“正义”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾧ
  choice: 给了他
  rationale: 与动词“分给”连用，清楚表明亚伯拉罕把十分之一交给麦基洗德；所指承接上文。
- source_word: δεκάτην ἀπὸ πάντων
  choice: 一切所得的十分之一
  rationale: δεκάτην直指“十分之一”；ἀπὸ πάντων表示从全部之中取出。补出“所得”使现代汉语自然，并与上下文所述战利品相合，但不把范围限定为某类物品。
- source_word: ἐμέρισεν
  choice: 分给了
  rationale: 保留动词“划分、分配”的意味，也自然表达交给受领者的动作。
- source_word: ἑρμηνευόμενος
  choice: 他名字的意思是
  rationale: 此处解释“麦基洗德”这个名字的含义；显明补出“名字”符合语境，也比直译“被解释为”更自然。
- source_word: βασιλεὺς δικαιοσύνης
  choice: 公义之王
  rationale: “公义”兼具正直和合乎公正标准的含义，并保留本段名称释义的神学回响。
- source_word: βασιλεὺς Σαλήμ
  choice: 撒冷王
  rationale: Σαλήμ作为地名音译为“撒冷”；汉语通常以“撒冷王”表达该城之王。
- source_word: ὅ ἐστιν βασιλεὺς εἰρήνης
  choice: 也就是“和平之王”
  rationale: ὅ ἐστιν引出对“撒冷王”的解释；“和平之王”准确传达εἰρήνης并保持称号式表达。
theological_decisions:
- issue: δικαιοσύνης在名称释义中的译法
  choice: 公义
  alternative: 正义
  rationale: δικαιοσύνη可侧重公义或正义。正文采用圣经语境中较稳定且能涵盖道德正直与公正的“公义”，脚注保留“正义”这一真实可能。
- issue: “和平之王”是对何者的解释
  choice: 将其呈现为对“撒冷王”的释义
  alternative: 仅将其视为第二个并列称号
  rationale: 原文ὅ ἐστιν明确引入解释，因此用“也就是”保留作者从“撒冷”引出“和平”的名称关联。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“一切所得的十分之一”避免生硬的“一切的十分之一”；引号标示由名字和地名引出的称号释义。所有脚注标记均已置于正文相应位置。
