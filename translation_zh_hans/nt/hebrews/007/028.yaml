- from: 因为律法所立为大祭司的，是有软弱的人；但在律法以后所起的誓言，却立了一位儿子[a]，他已经得以完全，直到永远。[b]
  to: 因为律法立有软弱的人为大祭司；但在律法以后所宣告的誓言，立了一位儿子[a]为大祭司；他已经被成全，直到永远。[b]
  rationale: 修订保留律法任立历代有软弱之人为大祭司、以及后于律法的誓言任立儿子的对比。补出汉语所需的“为大祭司”，并以“已经被成全，直到永远”对应完成时被动分词及其持续结果。脚注a保留无冠词与上下文所指的说明；脚注b保留词义范围，不把该词的祭司含义解释成唯一意义。
