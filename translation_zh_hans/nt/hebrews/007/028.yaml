id: HEB.7.28
reference: Hebrews 7:28
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ νόμος γὰρ ἀνθρώπους καθίστησιν ἀρχιερεῖς ἔχοντας ἀσθένειαν, ὁ λόγος δὲ τῆς ὁρκωμοσίας τῆς μετὰ τὸν νόμον υἱόν, εἰς τὸν αἰῶνα τετελειωμένον.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/028.yaml
  text: For the law appoints men as high priests who have weakness[a], but the word of the oath, which came after the law[b], appoints a Son who has been perfected forever.
translation:
  language: zh_hans
  text: 因为律法立有软弱的人为大祭司；但在律法以后所宣告的誓言，立了一位儿子[a]为大祭司；他已经被成全，直到永远。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“一位儿子”，没有冠词，着重与前面的“人”形成对照；按上下文，这位儿子就是耶稣。也可译作“那位儿子”。
    reason: 说明无冠词υἱόν的形式、对照作用及上下文所指。
  - marker: b
    text: “被成全”也可译作“得以完全”或“达到完全”；在祭司语境中，这个词也可能含有“使具备祭司职任的完全资格”的意味。
    reason: 保留τελειόω在希伯来书中的完成、成全与祭司职任相关的语义可能，并避免将其限定为单一解释。
lexical_decisions:
- source_word: νόμος
  choice: 律法
  rationale: 在本段指摩西律法及其中有关祭司制度的规定；“律法”是现代中文圣经语境中自然、明确的表达。
- source_word: καθίστησιν
  choice: 立……为
  rationale: 表达正式任命担任大祭司职分，比单纯的“使成为”更符合祭司语境。
- source_word: ἀνθρώπους
  choice: 人
  rationale: 这里具体指历代担任利未体系大祭司的人，与后面的“儿子”形成对照；中文“人”无需额外标示语法性别。
- source_word: ἀρχιερεῖς
  choice: 大祭司
  rationale: 准确表达祭司体系中的最高职分；原文复数体现历任担任者，中文借助“所立……的是……的人”自然涵盖多人。
- source_word: ἔχοντας ἀσθένειαν
  choice: 有软弱的人
  rationale: 保留名词“软弱”，涵盖人的有限、脆弱和易受罪影响的状态，不窄化为身体疾病。
- source_word: λόγος τῆς ὁρκωμοσίας
  choice: 所起的誓言
  rationale: λόγος在此指以誓言作出的宣告。中文若直译“誓言的话”较生硬，“所起的誓言”既自然，也保留神以起誓方式确立祭司的含义。
- source_word: τῆς μετὰ τὸν νόμον
  choice: 在律法以后
  rationale: 保留时间关系，说明誓言的宣告晚于律法，契合本章引用诗篇110篇的论证。
- source_word: υἱόν
  choice: 一位儿子
  rationale: 原文无冠词，并与复数的“人”形成性质鲜明的对照。“一位”体现无冠词形式；上下文清楚指耶稣。
- source_word: εἰς τὸν αἰῶνα
  choice: 直到永远
  rationale: 自然表达其永久有效、永不终止的状态，也呼应本章关于永远祭司职分的语言。
- source_word: τετελειωμένον
  choice: 已经得以完全
  rationale: 保留完成时被动分词的结果状态，以及“达到预定完全/完备”的广阔语义；不径直限定为“受膏立”或“被授职”。
theological_decisions:
- issue: 无冠词υἱόν与ἀνθρώπους之间的对照
  choice: 一位儿子
  alternative: 那位儿子／儿子
  rationale: “一位儿子”较贴近无冠词形式，突出律法所立的软弱之人与誓言所立的儿子之间的对照；脚注说明上下文所指，避免被误读为众多儿子中的任意一位。
- issue: τετελειωμένον在希伯来书祭司论中的含义
  choice: 已经得以完全
  alternative: 已经被成全／已经受任为祭司
  rationale: 译文保留“完全、成全、达到目的”的神学张力及完成时结果状态，不将其语义只收窄为礼仪性的授职或奉献。
- issue: εἰς τὸν αἰῶνα修饰的关系
  choice: 他已经得以完全，直到永远
  alternative: 立了一位直到永远得以完全的儿子
  rationale: 按原文最自然地让该短语与“得以完全”整体相连，同时在本章语境中也呼应儿子永久的祭司职分。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“因为……；但……”保留原文论证和强烈对比。“所立为大祭司的，是……”避免生硬逐词对应，同时清楚呈现律法任命历代软弱之人、誓言则任命儿子的结构。所有脚注标记均置于正文相应位置。
