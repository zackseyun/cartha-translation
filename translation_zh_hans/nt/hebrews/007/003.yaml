base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/003.yaml
  text: without father[a], without mother, without genealogy, having neither beginning of days nor end of life, but being made like the Son of God[b], he remains a priest perpetually.
translation:
  language: zh_hans
  text: 他无父，无母，无族谱[a]；既无年日之始，也无生命之终；他被比作上帝的儿子，就永远作祭司。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可理解为“未载谱系”。这里“无父、无母、无族谱”可指《创世记》没有记载麦基洗德的父母和家谱；《希伯来书》据此作预表性的论述。
    reason: lexical_alternative
  - marker: b
    text: “永远”也可译作“长久不断”或“始终”。这里强调按圣经叙事的呈现，他的祭司职分具有持续不止的性质。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπάτωρ, ἀμήτωρ, ἀγενεαλόγητος
  choice: 无父，无母，无族谱
  rationale: 保留希腊文三个否定形容词的简洁排比，不在正文中把经文的直接措辞弱化为“没有记载”。注释说明这可按《创世记》叙事未记载其家谱来理解。
- source_word: μήτε ἀρχὴν ἡμερῶν μήτε ζωῆς τέλος ἔχων
  choice: 他的年日无始，生命无终
  rationale: 保留成对否定及庄重语气；“年日无始”与“生命无终”自然地再现原文的对应结构。
- source_word: ἀφωμοιωμένος
  choice: 被塑造成……相似
  rationale: 该词是完成时被动分词。“被塑造成”保留被动意味以及由经文呈现而形成持续相似关系的含义，同时不把麦基洗德等同于上帝的儿子。
- source_word: τῷ υἱῷ τοῦ θεοῦ
  choice: 上帝的儿子
  rationale: 采用现代标准普通话中自然、庄重的基督论称谓。
- source_word: μένει ἱερεὺς
  choice: 并且……作祭司
  rationale: 结合持续时态和后续时间短语表达其祭司身份的延续；中文无需机械重复“仍然”。
- source_word: εἰς τὸ διηνεκές
  choice: 永远
  rationale: 简洁表达持续不止、永久的意味；注释保留“长久不断”等语义可能，并指出这里着重于其祭司职分在经文呈现中的持久性。
theological_decisions:
- issue: 本节是在断言麦基洗德实际上无父无母且本体永恒，还是按圣经叙事的呈现作预表性描述
  choice: 正文保留“无父、无母、无族谱、年日无始、生命无终”的强烈措辞，同时以“被塑造成与上帝的儿子相似”表达预表性的相似关系。
  alternative: 把麦基洗德理解为道成肉身以前的基督显现，或理解为他本身确实没有父母并且永恒。
  rationale: 原文明确说他被造成“相似”，并未说他就是上帝的儿子。译文不消解经文本身的张力，注释则指出《创世记》没有记载其谱系这一常见语境解释。
- issue: εἰς τὸ διηνεκές所表达的持续范围
  choice: 译为“永远”，并以注释说明它强调持久、不断的祭司职分。
  alternative: 译为“长久不断”或“始终”。
  rationale: “永远”符合该短语的永久性语义，但不借译文额外断定麦基洗德自身的本体永恒；相关范围由上下文和注释界定。
translation_notes:
  register: 采用现代、庄重且便于普通读者理解的表达。前三项用短句排比，后半句保持论证的隆重节奏。“被塑造成……相似”较直译，旨在保留完成时被动分词及预表性比较，避免把麦基洗德和上帝的儿子视为同一位。所有注释标记均在正文中出现。
