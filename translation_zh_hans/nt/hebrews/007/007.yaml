base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/007.yaml
  text: Beyond all dispute[a], the lesser is blessed by the greater.
translation:
  language: zh_hans
  text: 毫无争议[a]，地位较低者受到地位较高者的祝福。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“无可反驳”或“毫无异议”。
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς δὲ πάσης ἀντιλογίας
  choice: 毫无争议
  rationale: 该短语表示以下原则无可争辩。译作“毫无争议”自然、简洁，并保留χωρίς与πάσης ἀντιλογίας所表达的“没有任何反驳或争议”的力度。δέ在此只起轻微承接作用，中文无需另加生硬的连接词。
- source_word: τὸ ἔλαττον
  choice: 地位较低的
  rationale: 中性比较级名词化后泛指较低的一方；上下文谈论身份与等级，而非体积、能力或道德品质，因此用“地位较低的”避免“较小的”可能造成的误解。
- source_word: ὑπὸ τοῦ κρείττονος
  choice: 受地位较高的
  rationale: ὑπό加属格标明被动句的施事者；κρείττων在这里表示相对身份或等级较高。中文与后面的“祝福”合成“受地位较高的祝福”，准确表达施事关系。
- source_word: εὐλογεῖται
  choice: 受……祝福
  rationale: 现在时被动态表示较低者领受较高者所施的祝福。结合麦基洗德祝福亚伯拉罕的语境，“祝福”比单纯“说好话”更符合此处含义。
theological_decisions:
- issue: “较低”与“较高”的比较性质
  choice: 明确为相对地位的高低，但不进一步说明这种地位的具体性质
  alternative: 直译为“较小的”和“较大的”，或将其解释为绝对的属灵优劣
  rationale: 本节提出一个有关身份等级的普遍原则，用来支持上下文中麦基洗德相对于亚伯拉罕的优越地位。“地位较低/较高”澄清比较范畴，同时不把经文扩展成道德价值或本体地位的判断。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。用对称的“地位较低的／地位较高的”呈现原文两个名词化比较级，并使本节的论证关系清楚。
