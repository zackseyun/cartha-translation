id: HEB.7.11
reference: Hebrews 7:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Εἰ μὲν οὖν τελείωσις διὰ τῆς Λευιτικῆς ἱερωσύνης ἦν, ὁ λαὸς γὰρ ἐπ’ ⸀αὐτῆς ⸀νενομοθέτηται, τίς ἔτι χρεία κατὰ τὴν τάξιν Μελχισέδεκ ἕτερον ἀνίστασθαι ἱερέα καὶ οὐ κατὰ τὴν τάξιν Ἀαρὼν λέγεσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/011.yaml
  text: If perfection had been through the Levitical priesthood—for on its basis the people had received the law—what further need was there for another priest to arise according to the order of Melchizedek and not be spoken of according to the order of Aaron?[a][b]
translation:
  language: zh_hans
  text: 所以，若借着利未祭司的职任就能达到完全——因为百姓是在这职任的基础上领受律法的[a]——为什么还需要另有一位祭司，照着麦基洗德的等次兴起，而不说他是照着亚伦的等次呢？[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为百姓是在这职任之下领受律法的。”希腊语也可作较形式对应的表达，意思是百姓的律法安排与利未祭司的职任密切相关。
    reason: lexical_alternative
  - marker: b
    text: 或译：“照着麦基洗德的等次兴起，而不称为照着亚伦的等次呢？”
    reason: alternative_reading
lexical_decisions:
- source_word: τελείωσις
  choice: 达到完全
  rationale: 保留“完全”在《希伯来书》中礼仪与救赎层面的丰富含义，又用“达到”使现代汉语自然；不将其窄化为道德上的完美或仅仅“完成”。
- source_word: διὰ τῆς Λευιτικῆς ἱερωσύνης
  choice: 借着利未祭司的职任
  rationale: διά加属格表达途径或凭借；“借着”准确传达工具性。“祭司的职任”比单说“祭司制度”更贴近ἱερωσύνη，同时易于普通读者理解。
- source_word: ἐπ’ αὐτῆς
  choice: 在这职任的基础上
  rationale: 阴性代词最自然地回指“利未祭司的职任”；此译法表达律法安排与祭司职任之间的基础关系，同时脚注保留较形式对应的译法。
- source_word: νενομοθέτηται
  choice: 领受律法
  rationale: 该完成时被动形式表示百姓已被授予律法、置于律法安排之下；“领受律法”自然凝练，并保留结果状态。
- source_word: τίς ἔτι χρεία
  choice: 为什么还需要
  rationale: 以自然的现代汉语保留反问及“仍然、进一步”的意味。
- source_word: κατὰ τὴν τάξιν Μελχισέδεκ
  choice: 照着麦基洗德的等次
  rationale: “照着……的等次”是准确而庄重的表达，可涵盖样式、类别或所定序列，不将τάξις过度解释为世袭体系。
- source_word: ἕτερον ... ἱερέα
  choice: 另有一位祭司
  rationale: 表达另一位、并由随后与亚伦等次的对比显出其不同类别，避免过度明说“另一种”。
- source_word: ἀνίστασθαι
  choice: 兴起
  rationale: 在此指一位祭司出现或被设立；“兴起”保留原文措辞的庄重性，又不强行限定为复活。
- source_word: καὶ οὐ ... λέγεσθαι
  choice: 而不说他是照着亚伦的等次
  rationale: λέγεσθαι在此涉及如何称说或归类；此译法比生硬的被动句自然，并保留原文在两种等次之间的对照。
- source_word: Μελχισέδεκ / Ἀαρών
  choice: 麦基洗德／亚伦
  rationale: 采用现代简体中文圣经人名的通行音译。
theological_decisions:
- issue: τελείωσις在祭司论证中的含义
  choice: 译作“达到完全”，让上下文界定其礼仪与救赎含义
  alternative: 完成；完全来到上帝面前
  rationale: 本节论证若利未祭司职任能带来所要达到的终极状态，就无须另一位祭司。“完全”保留神学张力，既不缩减为道德改善，也不在正文中过度释义。
- issue: ἐπ’ αὐτῆς中代词的所指
  choice: 指利未祭司的职任
  alternative: 指律法；或泛指整个盟约安排
  rationale: 最近且性别相合的先行词是ἱερωσύνη（祭司职任）；插入语说明百姓所领受的律法安排以此为基础，最符合句法和论证。
- issue: κατὰ τὴν τάξιν所表达的关系
  choice: 保留为“照着……的等次”
  alternative: 属于……的体系；依照……的样式
  rationale: 不把“等次”限定为谱系、职位等级或单纯相似性，让《希伯来书》上下文说明麦基洗德与亚伦两种祭司归类的关系。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“所以”承接οὖν的推论关系；以破折号标出γάρ插入的解释。“祭司的职任”兼顾准确性与可读性；“等次”保留本段关键术语及其有意保留的神学开放性。所有脚注标记均置于正文相应位置。
