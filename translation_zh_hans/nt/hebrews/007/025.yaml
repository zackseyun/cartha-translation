  text: ὅθεν καὶ σῴζειν εἰς τὸ παντελὲς δύναται τοὺς προσερχομένους δι’ αὐτοῦ τῷ θεῷ, πάντοτε ζῶν εἰς τὸ ἐντυγχάνειν ὑπὲρ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/025.yaml
  text: Therefore he is also able to save completely those who draw near to God through him[a], since he always lives to intercede for them.
translation:
  language: zh_hans
  text: 所以，他也能彻底拯救所有借着他亲近上帝的人，因为他永远活着，为他们代求[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“永远拯救”；传统译法为“拯救到底”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅθεν
  choice: 所以
  rationale: 承接上文耶稣永远持有祭司职分的论述，表明由此得出的结论。
- source_word: καὶ
  choice: 都能
  rationale: 希腊文 καὶ 带有附加或强调作用；中文不机械译作“也”，而以“他都能”的自然句式体现其承接和强调。
- source_word: σῴζειν
  choice: 拯救
  rationale: 符合此处救恩语境，并保留该词的神学分量。
- source_word: εἰς τὸ παντελές
  choice: 彻底
  rationale: 突出拯救的完全、到底；原短语也可能含有时间上“永远”的意味，故在脚注保留。
- source_word: δύναται
  choice: 能
  rationale: 表达因其永存祭司职分而具有的能力；现代中文简洁自然。
- source_word: τοὺς προσερχομένους
  choice: 凡……亲近……的人
  rationale: “亲近”保留《希伯来书》中 προσέρχομαι 所含来到上帝面前、敬拜并得以进到他面前的意味。
- source_word: δι’ αὐτοῦ
  choice: 借着他
  rationale: 准确表达以耶稣为中保、借他来到上帝面前。
- source_word: τῷ θεῷ
  choice: 亲近上帝
  rationale: 与 προσέρχομαι 连用，自然表达来到上帝面前。
- source_word: πάντοτε ζῶν
  choice: 因为他永远活着
  rationale: 将分词短语理解为说明其拯救能力的根据；“永远活着”体现持续不止的生命。
- source_word: εἰς τὸ ἐντυγχάνειν
  choice: 为……代求
  rationale: 表达持续为他人向上帝祈求、居间陈情；“代求”简洁且为现代基督教中文所熟悉。
- source_word: ὑπὲρ αὐτῶν
  choice: 为他们
  rationale: 表达代表他们并为他们的益处而行。
theological_decisions:
- issue: εἰς τὸ παντελές 的语义范围
  choice: 正文译作“彻底”
  alternative: “永远”；传统上也可译作“拯救到底”
  rationale: 该短语既可强调完全、彻底，也可能强调历久不止。下文“他永远活着”使持续有效的意味尤为可见，但正文不应把含义仅限于时间层面，因此以“彻底”为正文，并在脚注保留其他理解。
- issue: πάντοτε ζῶν 与主句的逻辑关系
  choice: 以“因为”明确其依据作用
  alternative: 直译为“永远活着，为他们代求”
  rationale: 现在分词短语在语境中说明他为何能够彻底拯救；中文用“因为”自然呈现这种因果关系，同时不改变其持续性的含义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“借着他亲近上帝”保留《希伯来书》关于借祭司中保来到上帝面前的核心用语；“彻底拯救”清楚易懂，同时用脚注保存原文在完全性与永久性之间的语义张力。
