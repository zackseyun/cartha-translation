- from: 所以，凡借着他亲近上帝的人，他都能彻底拯救[a]，因为他永远活着，为他们代求。
  to: 所以，他也能彻底拯救所有借着他亲近上帝的人，因为他永远活着，为他们代求[a]。
  rationale: 修订仅调整主句语序并将“也”明确用于表达 καὶ，使中文更自然且更清楚保留原文的附加语气；其余译法及脚注维持原有的语义范围和神学张力。
  reviewer_model: gpt-5.6-terra
