    rationale: καὶ 在此带附加意义，宜以“也”明确表达；“所有……的人”可自然承载 τοὺς προσερχομένους 的复数泛指，不必以“都”承担双重功能。
  revised_text: 所以，他也能彻底拯救所有借着他亲近上帝的人，因为他永远活着，为他们代求[a]。
