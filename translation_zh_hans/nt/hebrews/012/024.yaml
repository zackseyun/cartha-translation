  text: καὶ διαθήκης νέας μεσίτῃ Ἰησοῦ, καὶ αἵματι ῥαντισμοῦ κρεῖττον λαλοῦντι παρὰ τὸν Ἅβελ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/024.yaml
  text: and to Jesus[a], the mediator of a new covenant[b], and to the sprinkled blood that speaks better than Abel.
translation:
  language: zh_hans
  text: 又来到新约的中保耶稣面前，以及所洒的血[a]面前；这血所说的比亚伯所说的更好。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “所洒的血”指礼仪中洒施的血，使人联想到立约和洁净。
    reason: cultural_note
  - marker: b
    text: 或译：“比亚伯的血所说的更好。”希腊文只说“比亚伯”，很可能暗指亚伯的血从地里呼喊（创4:10）。
    reason: alternative_reading
lexical_decisions:
- source_word: διαθήκης νέας
  choice: 新约
  rationale: διαθήκη在《希伯来书》中指上帝与人所立的约；“新约”是现代汉语圣经语境中准确、自然且广为理解的表达。希腊文此处虽无冠词，中文“新约”本身不强制区分“一个新约”与“那新约”，可保留其与经文所应许之新约的关联。
- source_word: μεσίτῃ
  choice: 中保
  rationale: “中保”准确表达在立约双方之间居间、促成约之关系的人，也保留本书中的法律与神学意味；比一般性的“中间人”更庄重、精确。
- source_word: Ἰησοῦ
  choice: 耶稣
  rationale: 采用现代简体中文通行的人名译法。
- source_word: αἵματι ῥαντισμοῦ
  choice: 所洒的血
  rationale: 该短语指用于礼仪性洒血的血，令人联想到立约与洁净。“所洒的血”简洁自然，并保留祭祀礼仪意象。
- source_word: κρεῖττον
  choice: 更好
  rationale: κρείττων及其相关形式是《希伯来书》的主题性比较用语；“更好”现代、清楚，也不额外限定究竟好在内容、功效还是结果。
- source_word: λαλοῦντι
  choice: 说得
  rationale: 现在分词修饰“血”，将血拟人化为正在发声；“这血说得……”在中文中保留这一形象及持续性的表达，同时避免另加“信息”等原文没有的名词。
- source_word: παρὰ τὸν Ἅβελ
  choice: 比亚伯
  rationale: 希腊文只写“比亚伯”，没有明说“比亚伯的血”。正文保留这种简练和省略，不把较可能的解释直接写入译文。
theological_decisions:
- issue: 与亚伯比较的具体所指
  choice: 正文译作“这血说得比亚伯更好”，保留原文只提“亚伯”的简练比较。
  alternative: 这血所说的比亚伯的血所说的更好。
  rationale: 上下文很可能使人想到亚伯的血从地里哀告（创4:10），也可能与来11:4所说亚伯仍然说话相呼应；但希腊文没有明写“亚伯的血”。正文不补出所指，以保留原文的含蓄和神学张力，并在脚注说明主要理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“又来到……这里”承接本段此前连续出现的“来到”，维持列举结构；分号帮助读者看清“这血说得……”是对“所洒的血”的进一步说明。脚注标记均置于正文对应词语之后。
