  text: Οὐ γὰρ προσεληλύθατε ⸀ψηλαφωμένῳ καὶ κεκαυμένῳ πυρὶ καὶ γνόφῳ καὶ ⸀ζόφῳ καὶ θυέλλῃ
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/018.yaml
  text: For you have not come to what can be touched[a], and to a blazing fire, and to darkness and gloom and storm[b],
translation:
  language: zh_hans
  text: 因为你们所来到的，不是那可触摸的[a]，也不是燃烧的火、幽暗、黑暗和暴风[b]；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那可触摸的山”。上下文所指的是西奈山，但本节希腊原文没有明说“山”。
    reason: alternative_reading
  - marker: b
    text: 也可按并列结构译为：“因为你们不是来到那可触摸的，也不是来到燃烧的火、幽暗、黑暗和暴风那里。”
    reason: syntactic_alternative
lexical_decisions:
- source_word: Οὐ γὰρ
  choice: 因为……并不是
  rationale: γάρ承接并解释上文，译作“因为”；οὐ否定“来到”所指向的对象。
- source_word: προσεληλύθατε
  choice: 你们所来到的
  rationale: 完成时表达已经来到、如今处于临近之状态；“来到”自然保留接近与进入神面前的意象。
- source_word: ψηλαφωμένῳ
  choice: 那可触摸的
  rationale: 原文没有明说“山”，故以名词化表达保留所指对象未明确的特点，并传达可触知、可触摸之意。
- source_word: κεκαυμένῳ πυρί
  choice: 燃烧的火
  rationale: 完成分词描述火处于燃烧状态；“燃烧的火”贴近原文，且为现代汉语自然表达。
- source_word: γνόφῳ
  choice: 幽暗
  rationale: 表示浓重、昏沉的黑暗；用“幽暗”与下一词形成有区别而重叠的累积表达。
- source_word: ζόφῳ
  choice: 黑暗
  rationale: 表示阴沉或深浓的黑暗；译作“黑暗”，保留与γνόφος的语义叠加。
- source_word: θυέλλῃ
  choice: 暴风
  rationale: 指猛烈的风暴；“暴风”简明而有力度。
theological_decisions:
- issue: 是否在正文补出“山”作为来到的对象
  choice: 正文不补“山”，译为“那可触摸的”
  alternative: “那可触摸的山”
  rationale: 上下文虽明显指向西奈山，但本节希腊文没有ὄρος（山）；正文保留原文所指未明说的状态，脚注交代上下文所暗示的对象。
- issue: 否定如何涵盖后续并列成分
  choice: 以“并不是……也不是……”使否定自然统摄整个并列清单
  alternative: 逐项重复“不是”或仅在开头使用一个“不”
  rationale: 希腊文以一个否定词配合重复的καί连接各项；汉语用“也不是”明确否定范围，同时不改变并列内容。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留原文的排比累积与未明说“山”的含混性；分号表示句意在下一节继续。
