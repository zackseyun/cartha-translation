source:
  edition: SBLGNT
  text: οὗ ἡ φωνὴ τὴν γῆν ἐσάλευσεν τότε, νῦν δὲ ἐπήγγελται λέγων· Ἔτι ἅπαξ ἐγὼ ⸀σείσω οὐ μόνον τὴν γῆν ἀλλὰ καὶ τὸν οὐρανόν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/026.yaml
  text: whose voice shook the earth then[a], but now he has promised, saying[b], “Yet once more I will shake not only the earth but also the heaven.”
translation:
  language: zh_hans
  text: 那时，他的声音震动了大地；如今，他却应许说：[a]“再一次，我不但要震动大地，还要震动天。[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 引自《哈该书》2:6。
    reason: cross_reference
  - marker: b
    text: 原文“天”为带冠词的单数，也可按语境理解为“天空”。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗ ἡ φωνὴ
  choice: 他的声音
  rationale: οὗ是属格关系代词，承接上文所说的神，并修饰“声音”。汉语用“他的声音”自然地保留这一衔接。
- source_word: ἐσάλευσεν
  choice: 震动了
  rationale: σαλεύω在此描写大地受神声音震撼；“震动”既符合宇宙性场景，也与后面的σείσω形成清楚呼应。
- source_word: τὴν γῆν
  choice: 大地
  rationale: γῆ与后文的οὐρανός相对，指受造界中的地，不宜缩小为某一片“土地”；“大地”在现代汉语中自然且庄重。
- source_word: τότε ... νῦν δὲ
  choice: 那时……如今……却
  rationale: 保留过去事件与当前仍然有效之应许之间的时间和转折对照。
- source_word: ἐπήγγελται
  choice: 应许
  rationale: 该完成时形式表达神已经作出且持续有效的承诺；“应许”准确保留其承诺意义及经文语体。
- source_word: Ἔτι ἅπαξ
  choice: 再一次
  rationale: 这一表达强调尚有一次将来的震动；“再一次”简洁自然，不额外断定“仅此最后一次”等解释。
- source_word: σείσω
  choice: 要震动
  rationale: 未来时的σείω表示神将使天地震动；“要震动”清楚表达将来意义，并与前面的“震动了”呼应。
- source_word: οὐ μόνον ... ἀλλὰ καὶ
  choice: 不但……还……
  rationale: 这是现代汉语中自然的对应结构，完整保留范围扩展。
- source_word: τὸν οὐρανόν
  choice: 天
  rationale: 原文为带冠词的单数οὐρανός，与“大地”构成宇宙性配对；汉语“天”自然保留其集合性和一定的语义宽度，避免将其限定为“天空”或解释为复数“诸天”。
theological_decisions:
- issue: 关系代词及“应许”的主语所指
  choice: 以“他”承接上文的神，神既是声音震动大地者，也是作出应许者
  alternative: 采用较含混、非人格化的说法，不明示同一位说话者
  rationale: οὗ承接上文，ἐπήγγελται的隐含主语也由上下文和《哈该书》引文确定为神。译文仅明示语法和语境已有的信息，不增添神学限定。
- issue: “地”和“天”的范围
  choice: 译为“大地”和“天”，保留广阔的宇宙性表达
  alternative: 译为“土地”和“天空”，理解为较局部或纯自然现象
  rationale: γῆ与οὐρανός明确相对，范围涵盖受造秩序的两个领域。译文保持这种张力，不具体说明震动的方式或末世事件的机制。
- issue: Ἔτι ἅπαξ是否明确表示最后一次
  choice: 译为“再一次”，不在正文中加入“最后”
  alternative: 译为“最后一次”或“仅再一次”
  rationale: 短语在后续经文中会得到解释，但本节本身只明确说还要再有一次；避免提前消解文本的解释空间。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“那时……如今……却”凸显原文对照；分号使两个分句层次清楚。引语中的“不但……还……”自然呈现希腊文关联结构。
