revisions:
- from: 因为他们承受不了所吩咐的话：“即使有走兽碰到这山，也要用石头打死它。[a]”
  to: 因为他们不能忍受所吩咐的事：“即使是一只动物碰到这山[a]，也要用石头打死它。”
  rationale: 修订仅改善现代汉语的自然度、θηρίον的泛称准确性及异文脚注的表述与锚点；保留SBLGNT正文的引文范围，不将“或被箭射杀”并入正文，也不对“所吩咐的事”作神学性扩展。
