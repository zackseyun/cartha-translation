  text: οὐκ ἔφερον γὰρ τὸ διαστελλόμενον· Κἂν θηρίον θίγῃ τοῦ ὄρους, λιθοβοληθήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/020.yaml
  text: 'For they could not endure what was being commanded: “If even an animal touches the mountain[a], it will be stoned.”'
translation:
  language: zh_hans
  text: 因为他们不能忍受所吩咐的事：“即使是一只动物碰到这山[a]，也要用石头打死它。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本在此增添“或被箭射杀”，与《出埃及记》19:12—13相呼应。
    reason: textual_variant
lexical_decisions:
- source_word: οὐκ ἔφερον
  choice: 他们承受不了
  rationale: φέρω在否定结构中表示不能承受或忍受；“承受不了”符合现代汉语，也保留了面对西奈山禁令时无法承受的语气。
- source_word: γὰρ
  choice: 因为
  rationale: γάρ承接上文并说明原因；“因为”在汉语中能清楚表达这一解释关系。
- source_word: τὸ διαστελλόμενον
  choice: 所吩咐的话
  rationale: διαστέλλομαι在此指权威性的命令或禁令；“所吩咐的话”自然地保留了分词表达，而不增添原文没有的具体内容。
- source_word: Κἂν
  choice: 即使
  rationale: κἄν（καὶ ἐάν）引出带强调意味的条件；“即使”准确传达连走兽也不例外的语气。
- source_word: θηρίον
  choice: 走兽
  rationale: θηρίον可泛指兽类；本段引用西奈山禁令，“走兽”比“野兽”更能避免把范围误限于野生动物，同时比泛称“动物”更贴近语境。
- source_word: θίγῃ
  choice: 碰到
  rationale: θιγγάνω表示触碰；“碰到”是自然、清楚的现代汉语，并适合条件句。
- source_word: τοῦ ὄρους
  choice: 这山
  rationale: 原文有定冠词，所指由上下文确定为西奈山；“这山”保留篇章中的明确所指，但不把“西奈”直接补入正文。
- source_word: λιθοβοληθήσεται
  choice: 要用石头打死它
  rationale: 该词是将来时被动语态，表示以石头击打处死；汉语用主动式泛指执行者更自然，“打死”也明确保留处死含义。
theological_decisions:
- issue: 西奈山命令引文的范围
  choice: 仅翻译SBLGNT正文中的“也要用石头打死它”
  alternative: 在正文中增添“或用箭射透”
  rationale: 所给SBLGNT正文没有扩展语句；不以出埃及记或其他抄本传统补齐正文，以免把异文无提示地并入经文。
- issue: 命令的承受对象
  choice: 保留“他们承受不了所吩咐的话”的概括表达
  alternative: 明确解释为他们因惧怕刑罚、圣洁要求或神的声音而无法忍受
  rationale: 原文没有进一步限定他们不能承受的具体层面；译文保留这种概括性及其神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“承受不了”自然表达 οὐκ ἔφερον；“所吩咐的话”避免生硬名词化；引文用“走兽”和“用石头打死”兼顾源文含义与现代可读性。脚注标记置于引文相关句末。
