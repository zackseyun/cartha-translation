    rationale: θηρίον在此可泛指动物；“走兽”较文学化，且可能使读者联想到特定类别。
  - severity: low
    issue: “所吩咐的话”汉语搭配略生硬。
    rationale: τὸ διαστελλόμενον指所发布、所吩咐的内容；“所吩咐的事”既自然又保留原文未具体说明命令内容的概括性。
  - severity: low
    issue: 异文脚注的“用箭射透”表达不够准确自然，且标记位置不够明确。
    rationale: 异文的意思是以箭射杀；将标记置于“这山”后，也与英文审校文本的脚注锚点一致。
  revised_text: 因为他们不能忍受所吩咐的事：“即使是一只动物碰到这山[a]，也要用石头打死它。”
  revised_footnotes:
