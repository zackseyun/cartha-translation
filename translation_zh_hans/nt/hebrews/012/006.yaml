  text: ὃν γὰρ ἀγαπᾷ κύριος παιδεύει, μαστιγοῖ δὲ πάντα υἱὸν ὃν παραδέχεται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/006.yaml
  text: For the Lord disciplines the one he loves[b][a], and he scourges every son whom he receives.
translation:
  language: zh_hans
  text: 因为主管教他所爱的人；他鞭打他所接纳的每一个儿子[b][a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“鞭笞”。希腊语动词语气强烈，描绘严厉的管教。
    reason: lexical_alternative
  - marker: b
    text: “每一个儿子”依照希腊原文；在本段语境中具有代表性，指神所承认为自己儿女的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃν
  choice: 所爱的／所接纳的
  rationale: 两个关系代词都保留单数、泛指的关系结构；中文用“所……的”表达自然，也维持两句的对应。
- source_word: γὰρ
  choice: 因为
  rationale: 承接上文，说明劝勉的理由；“因为”清楚保留其因由连接作用。
- source_word: ἀγαπᾷ
  choice: 爱
  rationale: 这是ἀγαπάω在现代汉语中的直接、自然译法。
- source_word: κύριος
  choice: 主
  rationale: 保留其称号及神学分量；中文不需要冠词。
- source_word: παιδεύει
  choice: 管教
  rationale: “管教”兼有纠正与培育之意，比单纯的“惩罚”更能体现παιδεύω的教育性。
- source_word: μαστιγοῖ
  choice: 鞭打
  rationale: 原词强烈，字面描绘用鞭抽打；“鞭打”是现代、清楚而不弱化的表达。
- source_word: δὲ
  choice: ；
  rationale: 用分号连接平行的第二分句，体现此处延续和加强的关系，无须硬译为转折词。
- source_word: πάντα υἱὸν
  choice: 每一个儿子
  rationale: 保留原文阳性单数及上下文的儿子名分意象；脚注说明此处具有代表性。
- source_word: παραδέχεται
  choice: 接纳
  rationale: 表达接受、认可并纳入关系之中的含义，比单纯“接受”更具关系色彩。
theological_decisions:
- issue: 神管教与儿子名分语境中υἱός的翻译
  choice: 每一个儿子
  alternative: 每一个儿女／每一个孩子
  rationale: 原文明确使用υἱός，且希伯来书12章以儿子名分为核心意象。正文保留“儿子”，脚注说明其在此代表神所承认的众儿女。
- issue: μαστιγοῖ所表达的严厉程度
  choice: 鞭打
  alternative: 严加管教／责打
  rationale: 原词描绘鞭笞，不宜为消除神的爱与痛苦管教之间的张力而弱化；“鞭打”直接保留比喻的力度。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。两分句以分号构成平行关系；保留“管教”与“鞭打”之间由培育到严厉责罚的力度递进，也不消解神的爱与痛苦管教并置所形成的神学张力。
