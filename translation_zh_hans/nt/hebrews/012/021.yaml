  text: καί, οὕτω φοβερὸν ἦν τὸ φανταζόμενον, Μωϋσῆς εἶπεν· Ἔκφοβός εἰμι καὶ ἔντρομος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/021.yaml
  text: And so terrifying was the sight that Moses said[b][a], “I am fearful and trembling.”
translation:
  language: zh_hans
  text: 所显现的景象如此可怕[a]，摩西说[b]：“我十分害怕，浑身战抖。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “所显现的景象”也可译作“所显现的”或“那景象”；希腊语所指的是西奈山上可见的显现。
    reason: lexical_alternative
  - marker: b
    text: 这句话并非逐字引自旧约，而是反映摩西在西奈事件中的恐惧反应；参申命记9:19。
    reason: cross_reference
lexical_decisions:
- source_word: καί
  choice: 连……也
  rationale: 这里承接上文，并突出就连摩西也因西奈山的显现而惧怕；现代汉语用“连……也”能自然表达这一推进作用。
- source_word: οὕτω φοβερὸν ἦν
  choice: 如此可怕
  rationale: 保留 οὕτω 所表达的程度，并以自然、庄重的现代汉语传达 φοβερόν 的强烈惊惧感。
- source_word: τὸ φανταζόμενον
  choice: 那显现的景象
  rationale: 该中性分词指当时可见的显现或景象；此译既保留“显现”的动态意味，也符合汉语表达。
- source_word: Μωϋσῆς εἶπεν
  choice: 摩西……说
  rationale: 按普通叙事语言直接翻译，不额外说明引文性质。
- source_word: Ἔκφοβός εἰμι
  choice: 我十分害怕
  rationale: ἔκφοβος 表示强烈的恐惧；“十分害怕”清楚自然，且不与后面的身体战抖混为一谈。
- source_word: καὶ ἔντρομος
  choice: 浑身战抖
  rationale: ἔντρομος 表示因恐惧而颤抖；“浑身战抖”保留其身体反应，并与前面的心理恐惧形成并列。
theological_decisions:
- issue: 这句话与旧约西奈事件记载的关系
  choice: 正文直接呈现摩西面对可怕显现时所说的话，不在正文中解释其旧约出处。
  alternative: 把这句话明说成对摩西恐惧反应的概述，而非直接引语。
  rationale: 希腊正文明确用“摩西说”引入直接话语；译文应保留这一陈述，同时用脚注说明其并非旧约中的逐字引文，以保存经文中的互文张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“那显现的景象”兼顾原文词形和汉语可读性；“我十分害怕，浑身战抖”分别呈现强烈恐惧与颤抖两个概念。脚注标记均置于正文中。
