source:
  edition: SBLGNT
  text: ἐπισκοποῦντες μή τις ὑστερῶν ἀπὸ τῆς χάριτος τοῦ θεοῦ, μή τις ῥίζα πικρίας ἄνω φύουσα ἐνοχλῇ καὶ ⸂δι’ αὐτῆς⸃ μιανθῶσιν ⸀πολλοί,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/015.yaml
  text: watching carefully lest anyone fall short of the grace of God[a], lest any root of bitterness springing up cause trouble, and through it many be defiled[b],
translation:
  language: zh_hans
  text: 你们要留心，免得有人未能得着上帝的恩典[a]；也免得有苦毒的根生长出来，造成困扰，使许多人因它受到玷污[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“免得有人亏缺上帝的恩典。”希腊文这一表达既可指未能得到所提供的，也可指有所亏缺。
    reason: lexical_alternative
  - marker: b
    text: “苦毒的根”很可能呼应《申命记》29:18；在那里，有毒的根象征在群体中蔓延的对盟约不忠。
    reason: cross_reference
lexical_decisions:
- source_word: ἐπισκοποῦντες
  choice: 谨慎察看
  rationale: 现在时分词带有持续留意、照看的意味；“谨慎察看”既表达群体应有的警醒，也避免过度制度化的措辞。
- source_word: μή τις ὑστερῶν ἀπὸ τῆς χάριτος τοῦ θεοῦ
  choice: 免得有人未能得着上帝的恩典
  rationale: ὑστερέω 与 ἀπό 连用可指未达到、未获得所提供之物。“未能得着”在现代汉语中自然，并保留警告的严肃性；脚注说明另一种可能表达。
- source_word: χάριτος
  choice: 恩典
  rationale: 此处采用现代中文圣经语境中通行的对应词，保留其救恩与盟约语境中的丰富含义。
- source_word: ῥίζα πικρίας
  choice: 苦毒的根
  rationale: 贴近属格结构，也保留其对《申命记》29:18的可能呼应；不把“苦毒”缩窄为单纯的怨恨情绪。
- source_word: ἄνω φύουσα
  choice: 长起来
  rationale: 自然呈现植物向上萌生、成长的比喻，符合现代普通话表达。
- source_word: ἐνοχλῇ
  choice: 造成祸患
  rationale: 该动词表示搅扰、带来麻烦或伤害；“造成祸患”体现其对群体的严重破坏，而不只是一时不便。
- source_word: δι’ αὐτῆς
  choice: 因它
  rationale: 阴性代词最自然地回指“根”；“因它”简洁表达 διά 的媒介或原因意义。
- source_word: μιανθῶσιν πολλοί
  choice: 许多人因它受到玷污
  rationale: 被动语态得到保留；“玷污”传达 μιαίνω 的道德及礼仪性污染色彩，比“受影响”更符合原文力度。
theological_decisions:
- issue: “未能得着上帝的恩典”是否暗示失去救恩、未曾领受恩典，或脱离群体
  choice: 采用“未能得着”，并以脚注保留“亏缺”的可能译法
  alternative: 亏缺上帝的恩典／没有得到上帝的恩典
  rationale: 原文可表示未达到或未获得，却没有在本节中明确裁定有关背道与坚忍的后世教义争论，因此正文保持警告性而不作宗派化定论。
- issue: “苦毒的根”是个人怨恨还是盟约不忠的有害根源
  choice: 保留原有隐喻，不在正文中解释为某一种心理状态
  alternative: 怨恨的根源／有毒的根
  rationale: 该短语很可能呼应《申命记》29:18，所指可比个人情绪更广；直译能保存经文互文和解释空间。
- issue: 是否将“玷污”弱化为社会性的困扰
  choice: 保留“玷污”
  alternative: 败坏／污染／受到不良影响
  rationale: μιαίνω 具有明显的道德或礼仪性不洁意味；“玷污”保持原文对群体后果的严肃表达。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“你们要谨慎察看”使分词在汉语中成为承接上下文的劝勉；分号保留原文两个 μή τις 警告之间的平行关系。所有脚注标记均已置于正文相应位置。
