  text: ἴστε γὰρ ὅτι καὶ μετέπειτα θέλων κληρονομῆσαι τὴν εὐλογίαν ἀπεδοκιμάσθη, μετανοίας γὰρ τόπον οὐχ εὗρεν, καίπερ μετὰ δακρύων ἐκζητήσας αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/017.yaml
  text: For you know that afterward[a], when he wanted to inherit the blessing, he was rejected, for he found no opportunity for repentance[b], though he sought it with tears.
translation:
  language: zh_hans
  text: 你们知道，后来以扫想要承受那祝福，却被拒绝了，因为他找不到悔改的余地[a]，尽管他流着泪恳切寻求它[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译作“他找不到悔改的余地”。这句话可指他没有机会扭转事情的结果，也可能指他无法使以撒改变心意。
    reason: alternative_reading
  - marker: b
    text: “它”可能指“那祝福”，也可能指“悔改（或改变心意）的余地”；希腊原文没有明确指出所指。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴστε
  choice: 你们知道
  rationale: οἶδα虽为完成时形式，却具有现在时意义；此译自然表达作者诉诸读者已有的认识。
- source_word: μετέπειτα
  choice: 后来
  rationale: 准确表达此后发生之事，简洁而符合现代汉语。
- source_word: θέλων
  choice: 想要
  rationale: 保留分词所表达的意愿，不额外强化为强烈渴望。
- source_word: κληρονομῆσαι τὴν εὐλογίαν
  choice: 承受那祝福
  rationale: κληρονομέω含承受产业之意；“承受”能保留继承语义，“那祝福”则指向以扫叙事中特定的父亲祝福。
- source_word: ἀπεδοκιμάσθη
  choice: 被拒绝了
  rationale: 表达经过考量后不被接受；不将其解释成技术性的救恩论术语。
- source_word: μετανοίας ... τόπον οὐχ εὗρεν
  choice: 找不到改变结局的余地
  rationale: τόπον可指余地或可能性，μετάνοια本义涉及心意改变；在创世记背景下，此处关乎无法使已经发生的结果逆转。该译避免让“悔改的机会”被误解为神拒绝真诚悔改，同时脚注保留其多种理解。
- source_word: καίπερ μετὰ δακρύων
  choice: 尽管他流着泪
  rationale: 自然传达让步关系及伴随眼泪的情状。
- source_word: ἐκζητήσας
  choice: 切切寻求
  rationale: ἐκζητέω可含恳切、竭力寻求之意；“切切”与流泪的语境相称。
- source_word: αὐτήν
  choice: 它
  rationale: 阴性代词可回指“祝福”，也可能与“心意改变／余地”相关；“它”不在正文中擅自确定所指。
theological_decisions:
- issue: μετανοίας τόπον所指的“改变”
  choice: 正文译作“改变结局的余地”，脚注说明也可直译为“悔改的余地”
  alternative: 以扫没有悔改的机会；或以撒不肯改变心意
  rationale: 希腊语表达可指没有余地扭转结果，也可能涉及以扫的悔改或以撒改变决定。结合创世记27:34-38的叙事，“改变结局”清楚呈现语境，又借脚注保存真实的解释张力。
- issue: αὐτήν的所指
  choice: 正文用“它”保留歧义
  alternative: 明确译为“祝福”；或明确译为“悔改／改变的余地”
  rationale: εὐλογία与μετάνοια都是阴性名词，语法本身不足以完全排除任一回指；不应在正文中强行消解歧义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“承受那祝福”保留圣经继承语汇；“改变结局的余地”避免生硬直译，同时用脚注呈现原文在“悔改／改变心意”及代词所指上的歧义。
