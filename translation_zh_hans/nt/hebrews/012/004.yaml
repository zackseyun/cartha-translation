base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/004.yaml
  text: You have not yet resisted to the point of shedding blood in your struggle against sin,[a]
translation:
  language: zh_hans
  text: 在与罪争战时，你们还没有抵抗到流血的地步。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们还没有抵抗到血的程度。”希腊原文较直译为“你们还没有抵抗到血”；这是一个表示程度界限的表达，指抵抗直至流血。
    reason: 说明原文惯用表达及较直译的译法。
lexical_decisions:
- source_word: οὔπω
  choice: 还没有
  rationale: 表达截至目前尚未达到某种程度，符合原文时间副词的含义，也自然衔接“到……的地步”。
- source_word: μέχρις αἵματος
  choice: 到流血的地步
  rationale: 保留“直到血”的程度含义，同时用现代汉语清楚表达抵抗达到受伤流血甚至死亡的程度；不将其限定为殉道。
- source_word: ἀντικατέστητε
  choice: 抵抗
  rationale: 该词表示站出来反对、抵挡；“抵抗”既贴近原义，也符合本节争战的语境。
- source_word: πρὸς τὴν ἁμαρτίαν
  choice: 与罪
  rationale: πρός加宾格在此表示敌对方向。配合“争战”译为“与罪争战”是自然汉语，并保留“罪”所指的宽泛性。
- source_word: ἀνταγωνιζόμενοι
  choice: 争战
  rationale: 现在时分词带有持续奋力抗争的竞技或战斗色彩；译作“争战”体现其过程，并说明主句“抵抗”发生的处境。
theological_decisions:
- issue: “罪”的具体所指
  choice: 笼统译为“罪”，不进一步界定
  alternative: 迫害者罪恶的敌对行为；一般意义上的罪；诱使人离弃信仰的罪
  rationale: 上下文同时涉及忍受敌对和摆脱罪，但本节没有限定“罪”的具体所指；保留宽泛表达可维持原文的神学张力。
- issue: “到流血的地步”是否专指殉道
  choice: 保留程度性的表达，不明确限定为殉道
  alternative: 直到为信仰殉道；直到受伤流血
  rationale: 原文只说“直到血”，可能涵盖受伤流血乃至死亡；直接限定为殉道会超出本句明说的范围。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“与罪争战”保留持续对抗的形象，“抵抗到流血的地步”则清楚呈现原文所说尚未达到的限度。
