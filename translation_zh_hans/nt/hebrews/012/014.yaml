source:
  edition: SBLGNT
  text: Εἰρήνην διώκετε μετὰ πάντων, καὶ τὸν ἁγιασμόν, οὗ χωρὶς οὐδεὶς ὄψεται τὸν κύριον,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/014.yaml
  text: Pursue peace with everyone[a], and the holiness without which no one will see the Lord.
translation:
  language: zh_hans
  text: 你们要竭力追求与众人和睦，也要追求圣洁[a]；没有这圣洁，谁也不能见主。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“成圣”。希腊语ἁγιασμός既可指圣洁的生活状态，也可指成为圣洁的过程。
    reason: 词义兼具状态与过程两方面，正文无法同时完整呈现。
lexical_decisions:
- source_word: Εἰρήνην
  choice: 和睦
  rationale: 这里的“和平”由“与众人”限定，主要指人际和群体关系中的和平状态；现代汉语用“与众人和睦”比“与众人和平”更自然。
- source_word: διώκετε
  choice: 竭力追求
  rationale: διώκω含有积极、持续用力追赶的意味。“竭力追求”既保留劝勉的力度，也符合现代汉语表达。
- source_word: μετὰ πάντων
  choice: 与众人
  rationale: 保留πάντων所表达的普遍范围，同时采用庄重而通顺的汉语。
- source_word: τὸν ἁγιασμόν
  choice: 圣洁
  rationale: ἁγιασμός可指圣洁的状态或成为圣洁的过程。正文用“圣洁”自然明白，也保留伦理生活与归属上帝的双重内涵；脚注注明“成圣”这一可能译法。
- source_word: οὗ χωρὶς
  choice: 没有这圣洁
  rationale: 阳性单数关系代词οὗ最自然地回指阳性单数的ἁγιασμόν。加入指示词“这”可在汉语中清楚呈现回指关系。
- source_word: οὐδεὶς ὄψεται
  choice: 谁也不能见
  rationale: “谁也不能”自然表达οὐδεὶς的绝对否定；“见”简洁保留ὄψεται的未来指向，汉语无需机械标出将来时。
- source_word: τὸν κύριον
  choice: 主
  rationale: κύριος在此保留为称号“主”，不擅自限定为父上帝或主耶稣。
theological_decisions:
- issue: ἁγιασμός在劝勉语境中的含义
  choice: 正文译作“圣洁”，脚注注明也可译作“成圣”
  alternative: 直接译作“成圣”
  rationale: 原词可表示圣洁的状态、生活特质，也可表示成为圣洁的过程。正文“圣洁”较通俗自然，脚注则保存其过程性含义，避免将经文限缩为某一套神学术语。
- issue: “主”的具体所指
  choice: 保留“主”而不进一步指明
  alternative: 译作“上帝”或“主耶稣”
  rationale: 希腊文只写κύριος；翻译保留原文的称号及其可能具有的经文互文张力，不替原文消除所指上的开放性。
- issue: “没有这圣洁，谁也不能见主”的条件性表述
  choice: 直接保留原文的必要条件语气
  alternative: 释义为圣洁只是见主后的结果，或将其改写为功德条件
  rationale: 原文明确使用οὗ χωρὶς（没有它／离开它）构成强烈条件表述。译文不把这句话系统化为功德论，也不削弱其严肃劝勉。
translation_notes:
  register: 采用现代、庄重且易懂的劝勉语体。“竭力追求”呈现命令的力度；为使一个希腊动词统领两个宾语的结构在汉语中清楚自然，第二项补出“追求”。
