  text: καὶ γὰρ ὁ θεὸς ἡμῶν πῦρ καταναλίσκον.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/029.yaml
  text: For our God is a consuming fire[a][b].
translation:
  language: zh_hans
  text: 因为我们的上帝是吞噬的火[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里呼应《申命记》4:24，那里也称上帝为“吞噬的火”。
    reason: cross_reference
  - marker: b
    text: 或译：“焚烧的火。”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: 因为
  rationale: γὰρ承接上一节，说明应当敬畏事奉上帝的原因；καὶ在此加强语气，可自然融入“因为”，避免生硬直译。
- source_word: ὁ θεὸς ἡμῶν
  choice: 我们的上帝
  rationale: 准确表达希腊语所属结构，并保留群体性和圣约性的语气。
- source_word: πῦρ
  choice: 火
  rationale: 保留原文直接而鲜明的隐喻，也维持与《申命记》4:24的呼应。
- source_word: καταναλίσκον
  choice: 吞噬的
  rationale: 该现在主动分词修饰“火”，表示将对象完全消耗、烧尽；“吞噬的火”既自然有力，也保留分词所呈现的持续作用。
theological_decisions:
- issue: 将上帝描述为火的隐喻
  choice: 保留直接等同的表达：“我们的上帝乃是吞噬的火”
  alternative: 我们的上帝好像吞噬的火
  rationale: 希腊文是直接的名词性断言，没有表示比较的词；不改成明喻，才能保留警告的力度及其与《申命记》4:24的经文联系。
- issue: καταναλίσκον的表达形式
  choice: 吞噬的火
  alternative: 吞噬一切的火／焚烧净尽的火
  rationale: 原文没有明说宾语或“一切”，因此正文不补足对象，以保留其开放性；较显性的动词表达列入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“乃是”略带经文庄重感，同时清楚保留原文直接等同的句式；“吞噬的火”保留强烈意象，不把隐喻解释性弱化。
