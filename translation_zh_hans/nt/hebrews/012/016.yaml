source:
  edition: SBLGNT
  text: μή τις πόρνος ἢ βέβηλος ὡς Ἠσαῦ, ὃς ἀντὶ βρώσεως μιᾶς ἀπέδετο τὰ πρωτοτόκια ⸀ἑαυτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/016.yaml
  text: that no one be sexually immoral or godless like Esau, who sold his own birthright for a single meal.
translation:
  language: zh_hans
  text: 不可有人淫乱，也不可有人像以扫那样不敬虔；他为了一顿饭，卖掉了自己的长子名分。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πόρνος
  choice: 淫乱
  rationale: 指在性行为上不道德的人；汉语用谓语式“有人淫乱”自然清楚，同时保留原文的道德警戒。
- source_word: βέβηλος
  choice: 不敬虔
  rationale: 该词本义涉及凡俗、亵渎、缺乏对神圣事物的尊重；此处用“不敬虔”表达以扫轻看长子名分所显出的属灵态度，也与审定英文 godless 对应，但不强化为明确的无神论。
- source_word: ἀντὶ βρώσεως μιᾶς
  choice: 为了一顿饭
  rationale: 直译其交换代价，表达自然，并突出以扫以一次饮食换取长子名分的反差。
- source_word: ἀπέδετο
  choice: 卖掉了
  rationale: 该动词意为出售，采用直接、通行的汉语表达。
- source_word: τὰ πρωτοτόκια ἑαυτοῦ
  choice: 自己的长子名分
  rationale: 指长子所享有的身份及相应权利；“长子名分”是准确且易懂的传统表达，“自己的”保留反身代词的强调。
theological_decisions:
- issue: βέβηλος所表达的属灵评价
  choice: 不敬虔
  alternative: 亵渎／世俗
  rationale: 原词并不必然表示公开亵渎行为，也不只是现代意义的世俗化；“不敬虔”较能涵盖对神圣之物缺乏敬重的态度，同时避免把以扫定性为哲学意义上的无神论。
- issue: πόρνος与以扫之间的句法关系
  choice: 将“淫乱”与“像以扫那样不敬虔”列为两项警戒
  alternative: 把“淫乱、不敬虔”都直接修饰以扫
  rationale: 希腊文μή τις πόρνος ἢ βέβηλος ὡς Ἠσαῦ可容许一定关联歧义，但ὡς Ἠσαῦ最自然地紧接βέβηλος；译文不把圣经未明确记载的淫乱行为强加给以扫。
translation_notes:
  register: 采用庄重而现代的劝诫语体。“不可有人……也不可有人……”使否定警戒在中文中完整自然；分号保留前半警戒与后半解释以扫行为之间的紧密联系。
