  text: καὶ ἐκκλησίᾳ πρωτοτόκων ⸂ἀπογεγραμμένων ἐν οὐρανοῖς⸃, καὶ κριτῇ θεῷ πάντων, καὶ πνεύμασι δικαίων τετελειωμένων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/023.yaml
  text: and to the assembly of the firstborn who are enrolled in the heavens[a], and to God, the judge of all, and to the spirits of righteous people made perfect,
translation:
  language: zh_hans
  text: 也来到登记在诸天上的众长子的集会[a]，来到审判万有的上帝面前，又来到已经得以完全的义人之灵那里，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“登记在天上的”。希腊文“天”在这里是复数。
    reason: 说明较自然的汉语单数译法，并交代正文保留了希腊文复数形式。
lexical_decisions:
- source_word: ἐκκλησίᾳ
  choice: 集会
  rationale: 保留“聚集起来的群体”这一基本含义，切合天上锡安的语境，同时避免把后世制度性含义直接带入经文。
- source_word: πρωτοτόκων
  choice: 众长子
  rationale: 按复数名词性用法直译，保留“长子”及其身份、产业权利的意象，不擅自补出原文没有的“儿子名分”等解释。
- source_word: ἀπογεγραμμένων
  choice: 登记
  rationale: 表达完成时被动分词所含的“已经登记且仍在册”的结果状态，也保留名册登记的意象；中文由上下文自然理解为众长子是被登记者。
- source_word: ἐν οὐρανοῖς
  choice: 在诸天之上
  rationale: 正文保留希腊文复数 οὐρανοῖς，并采用庄重而可懂的现代汉语表达；脚注注明常见单数译法。
- source_word: κριτῇ θεῷ πάντων
  choice: 审判万有的上帝
  rationale: 将 κριτῇ 与 θεῷ 理解为同位关系，既表明上帝的身份，也保留其审判者角色；“万有”不把 πάντων 限定为仅指所有人。
- source_word: πνεύμασι
  choice: 灵
  rationale: 采用直接词义，不在正文中扩展为“属灵存在”或加入关于中间状态的进一步说明。
- source_word: δικαίων
  choice: 义人
  rationale: 以自然、凝练且不限定性别的现代汉语表达复数的人类所指。
- source_word: τετελειωμένων
  choice: 已经得以完全
  rationale: 体现完成时被动分词：他们已经被带到完全的状态，并保留《希伯来书》中“完全”的主题，不将其窄化为道德上毫无瑕疵。
theological_decisions:
- issue: “众长子”的身份
  choice: 理解为具有长子身份或产业地位的群体称谓
  alternative: 理解为基督这位长子，以及属于他的集会
  rationale: πρωτοτόκων 是复数，最自然地指一个群体。译文仍使用“众长子”，不把有关身份和产业的解释写入正文。
- issue: “已经得以完全的义人之灵”所指
  choice: 指已经被带到完全状态的义人之灵
  alternative: 泛指所有义人，不论其是否处于有身体的状态
  rationale: “义人之灵”最自然地指处于灵之状态的人，但正文不加入“已死者”“无身体”等原文未明说的教义细节。
- issue: πάντων 的范围
  choice: 译为“万有”，保留可涵盖一切受造者的广度
  alternative: 译为“所有人”
  rationale: 希腊文 πάντων 在形式上可指“所有人”或“一切”；“万有”避免在正文中不必要地缩窄其范围。
translation_notes:
  register: 采用庄重、流畅的现代标准汉语，并保留本节承接上文“你们来到”的列举结构。以“集会”对应 ἐκκλησία，以免引入过强的制度色彩；句末保留逗号，表明原句仍在下一节延续。
