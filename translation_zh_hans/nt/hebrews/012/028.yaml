revisions:
- from: 所以，我们既然正在领受一个不能震动的国，就当有恩典[a]，靠着这恩典，以虔敬和敬畏蒙神悦纳地事奉他。
  to: 所以，我们既然正在领受一个不能被震动的国，就当有恩典[a]，靠着这恩典，以虔敬和敬畏事奉神，蒙他悦纳。
  rationale: 修订仅消除“不能震动的国”的汉语施受歧义，并顺畅地重组句末修饰关系。正文继续以“有恩典”对应χάριν的“恩典”义，并使“靠着这恩典”明确回指；脚注保留“感恩”的合理替代理解。
