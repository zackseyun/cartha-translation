  text: διὸ βασιλείαν ἀσάλευτον παραλαμβάνοντες ἔχωμεν χάριν, δι’ ἧς ⸀λατρεύωμεν εὐαρέστως τῷ θεῷ μετὰ ⸂εὐλαβείας καὶ δέους⸃,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/028.yaml
  text: Therefore[a], since we are receiving an unshakable kingdom, let us have grace, through which we may serve God acceptably with reverence and awe,
translation:
  language: zh_hans
  text: 所以，我们既然正在领受一个不能被震动的国，就当有恩典[a]，靠着这恩典，以虔敬和敬畏事奉神，蒙他悦纳。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“就当感恩。”希腊语ἔχωμεν χάριν既可理解为“就当有恩典”，也可按惯用法理解为“就当感恩”或“就当心存感谢”。
    reason: alternative_reading
lexical_decisions:
- source_word: διὸ
  choice: 所以
  rationale: 承接上文受造之物被震动、挪去的论述，引出相应的劝勉，保留推论关系。
- source_word: βασιλείαν ἀσάλευτον
  choice: 一个不能震动的国
  rationale: 直译“国”和“不能被震动的”，并与上下文反复出现的“震动”保持词语呼应。
- source_word: παραλαμβάνοντες
  choice: 既然正在领受
  rationale: 现在时分词表示领受中的现实处境；“既然”自然表达其与随后劝勉之间的依据关系。
- source_word: ἔχωμεν χάριν
  choice: 就当有恩典
  rationale: 保留ἔχωμεν的劝勉语气和χάριν的“恩典”义，也使下文“靠着这恩典”的工具含义清楚；“感恩”这一合理的惯用理解收入脚注。
- source_word: δι’ ἧς
  choice: 靠着这恩典
  rationale: 表达διά加属格的凭借、工具意义，并明确阴性关系代词回指“恩典”。
- source_word: λατρεύωμεν
  choice: 事奉
  rationale: 在圣经语境中指向神所献的宗教性服事；“事奉”既包含敬拜，也不把含义局限于礼仪行为。
- source_word: εὐαρέστως τῷ θεῷ
  choice: 蒙神悦纳地
  rationale: 自然表达以神为评判者、按他所喜悦和接纳的方式事奉。
- source_word: μετὰ εὐλαβείας καὶ δέους
  choice: 以虔敬和敬畏
  rationale: “虔敬”表现谨慎、尊崇的态度，“敬畏”表现面对神圣威严时的畏惧与震撼，保留两个近义而有区别的词。
theological_decisions:
- issue: ἔχωμεν χάριν中χάριν的含义
  choice: 恩典
  alternative: 感恩／心存感谢
  rationale: 后接δι’ ἧς（“靠着这恩典”），在句法上自然以χάριν为事奉得蒙悦纳的凭借，因此正文保留“恩典”。不过，ἔχειν χάριν也可能作为惯用表达表示“感恩”，故以脚注保存这一真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“不能震动的国”与上下文用语保持呼应；“事奉”体现对神的宗教性服事。正文刻意保留“有恩典”略显不寻常的表达，以免消除原文在“恩典”与“感恩”之间的歧义，并用脚注说明另一读法。
