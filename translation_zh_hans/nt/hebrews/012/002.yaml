id: HEB.12.2
reference: Hebrews 12:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἀφορῶντες εἰς τὸν τῆς πίστεως ἀρχηγὸν καὶ τελειωτὴν Ἰησοῦν, ὃς ἀντὶ τῆς προκειμένης αὐτῷ χαρᾶς ὑπέμεινεν σταυρὸν αἰσχύνης καταφρονήσας, ἐν δεξιᾷ τε τοῦ θρόνου τοῦ θεοῦ κεκάθικεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/002.yaml
  text: fixing our eyes on Jesus[a], the pioneer and perfecter of faith, who for the joy set before him endured the cross, despising the shame[b], and has sat down at the right hand of the throne of God.
translation:
  language: zh_hans
  text: 定睛仰望耶稣[a]——他是信心的开创者和成全者。他因着那摆在他前面的喜乐，忍受了十字架，轻看羞辱[b]，已经坐在上帝宝座的右边。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “信心的开创者和成全者”也可译作“信实的开创者和成全者”或“我们信心的开创者和成全者”。希腊文表达简练，πίστις既可指“信心”，也可指“信实”，还可能特指信徒的信心。
    reason: alternative_reading
  - marker: b
    text: “轻看羞辱”也可译作“不把羞辱放在眼里”。意思是，他没有让十字架刑所带来的耻辱成为决定性的阻碍。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφορῶντες
  choice: 定睛仰望
  rationale: 表达把目光从其他事物移开、专注望向特定对象的持续动作，也自然承接赛跑的语境。
- source_word: ἀρχηγὸν
  choice: 开创者
  rationale: 兼顾发起、引领和走在前面的含义；比“作者”更符合上下文中耶稣为人开路的形象。
- source_word: τελειωτὴν
  choice: 成全者
  rationale: 指使某事达到预定完成的人；与“开创者”相配，并保留达到圆满的目的性含义。
- source_word: τῆς πίστεως
  choice: 信心的
  rationale: 希腊文没有明说“我们的”，因此正文不予增补；πίστις 也可能指“信实”，相关歧义保留在脚注中。
- source_word: ἀντὶ
  choice: 因
  rationale: 在此表达耶稣以摆在前面的喜乐为前景和动力而忍受苦难；“因”在现代汉语中简洁自然，同时不把喜乐理解为他所放弃的事物。
- source_word: προκειμένης αὐτῷ χαρᾶς
  choice: 那摆在前面的喜乐
  rationale: 保留目标被置于前方的空间意象，与本章赛跑和忍耐到底的语境相合。
- source_word: ὑπέμεινεν
  choice: 忍受了
  rationale: 准确表达在苦难之下坚定承受的意思，并呼应本章对忍耐的强调。
- source_word: σταυρὸν
  choice: 十字架
  rationale: 虽然希腊文无冠词，但上下文明指耶稣所受的十字架刑；汉语无需另加限定词。
- source_word: αἰσχύνης καταφρονήσας
  choice: 轻看羞辱
  rationale: 表示把十字架所带来的耻辱视为不足以左右自己的事；既保留力度，也不暗示羞辱本身是好事。
- source_word: ἐν δεξιᾷ ... τοῦ θρόνου τοῦ θεοῦ
  choice: 在上帝宝座的右边
  rationale: 保留登上尊荣与权柄之位的意象，并采用现代汉语中清楚自然的表达。
- source_word: τε
  choice: 如今
  rationale: 原词主要起连接作用；结合完成时，“如今”自然呈现受苦之后进入现今尊荣地位的衔接，未另行强化其逻辑。
- source_word: κεκάθικεν
  choice: 已经坐
  rationale: 以“已经”体现希腊文完成时：动作已经完成，其结果持续至今。
theological_decisions:
- issue: τῆς πίστεως 在“开创者和成全者”结构中的所指
  choice: 正文译为“信心的开创者和成全者”，不增添物主成分。
  alternative: 可理解为“信实的开创者和成全者”，或“我们信心的开创者和成全者”。
  rationale: 原文结构紧凑，πίστις 既可指信心，也可指信实，还可能在语境中专指信徒的信心。正文采用未扩展的“信心”，脚注保留其他真实可能，避免以教义预先消除歧义。
- issue: ἀντὶ τῆς προκειμένης αὐτῷ χαρᾶς 的关系
  choice: 理解为耶稣因着摆在前面的喜乐这一前景而忍受十字架。
  alternative: 可按 ἀντί 的常见替代义理解为：耶稣没有取用摆在面前的喜乐，反而选择十字架。
  rationale: 本段以忍耐奔向前方目标为主线，因此以将来的喜乐作为忍受苦难的动力更切合语境；但这一选择不否认介词本身可能表达“代替”。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“定睛仰望”保留专注和方向感；“开创者和成全者”形成清楚对称。“上帝”依人民开放圣经的通行称谓使用。破折号用来说明耶稣的身份，避免首句修饰关系含混。
