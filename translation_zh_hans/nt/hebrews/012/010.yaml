  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οἱ μὲν γὰρ πρὸς ὀλίγας ἡμέρας κατὰ τὸ δοκοῦν αὐτοῖς ἐπαίδευον, ὁ δὲ ἐπὶ τὸ συμφέρον εἰς τὸ μεταλαβεῖν τῆς ἁγιότητος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/010.yaml
  text: For they disciplined us for a few days as seemed best to them[a], but he does so for our benefit[b], so that we may share in his holiness.
translation:
  language: zh_hans
  text: 因为他们在短短的日子里[a]，照自己认为合宜的方式[b]管教我们；他却为了我们的益处管教我们，使我们得以有份于他的圣洁。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在短时间内”；原文也可直译为“几天”。这短语着重说明地上父亲管教的时期有限。
    reason: lexical_alternative
  - marker: b
    text: 或译：“照他们看来是对的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς ὀλίγας ἡμέρας
  choice: 只在短暂的一段日子里
  rationale: 此短语强调世上父亲施行管教的时期有限。“短暂的一段日子”既保留时间意象，也比逐字译作“几天”更自然，并与神管教的长远目的形成对照。
- source_word: κατὰ τὸ δοκοῦν αὐτοῖς
  choice: 照自己认为合宜的方式
  rationale: δοκοῦν 表示按他们自己的判断、按他们看来合宜的做法；此译保留主观判断的意味，不断言他们的判断必然正确。
- source_word: ἐπαίδευον
  choice: 管教
  rationale: 本章语境是父亲对子女的教养、训练与纠正，不仅指惩罚；“管教”准确承接上下文。
- source_word: ὁ δὲ
  choice: 他却……管教我们
  rationale: 单数主语在上下文中指神。中文补出省略的“管教我们”，使对比完整自然，同时仍以代词“他”保留原文的含蓄表达。
- source_word: ἐπὶ τὸ συμφέρον
  choice: 为了我们的益处
  rationale: 该结构表达以益处为目标；“我们的”虽为语境所含而非明说，但中文如此表达清楚自然。
- source_word: εἰς τὸ μεταλαβεῖν
  choice: 使我们得以有份于
  rationale: εἰς τό 加不定式表达目的或预期结果；“使……得以”保留这一目的性，“有份于”准确传达参与、分享之义。
- source_word: τῆς ἁγιότητος αὐτοῦ
  choice: 他的圣洁
  rationale: ἁγιότης 指属于神的圣洁这一性质；直译为“他的圣洁”保留原文神学分量，不预先界定这种参与的具体机制。
theological_decisions:
- issue: 对比结构中单数主语 ὁ δὲ 的所指
  choice: 按上下文理解为神，但正文仍译作“他”
  alternative: 为求明确，直接译作“神”
  rationale: 希伯来书12:5—11把地上的父亲与作为父的神相对照，所指清楚；保留代词既忠于原文，也不妨碍理解。
- issue: “有份于他的圣洁”的含义
  choice: 保留为参与神的圣洁，不限定为某一种成圣模式
  alternative: 明确解释为地位上的圣洁，或明确解释为渐进的成圣过程
  rationale: 经文本身说明神管教的目的，却没有在本句中限定参与圣洁的机制；译文应保留这一神学张力。
- issue: 世上父亲管教判断的评价
  choice: 译作“自己认为合宜”，凸显其判断视角而不判定其绝对正确
  alternative: 译作“随自己的意思”或“按他们认为最好的”
  rationale: 原文表达按他们看来合宜，并未必暗示任性，也没有肯定其判断完全无误。
translation_notes:
  register: 采用现代、庄重而清楚的书面普通话。“管教”与本章上下文保持术语一致；分号凸显世上父亲与神之间的对比。所有补足成分均由上下文明确支持。
