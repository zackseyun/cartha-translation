source:
  edition: SBLGNT
  text: Τοιγαροῦν καὶ ἡμεῖς, τοσοῦτον ἔχοντες περικείμενον ἡμῖν νέφος μαρτύρων, ὄγκον ἀποθέμενοι πάντα καὶ τὴν εὐπερίστατον ἁμαρτίαν, δι’ ὑπομονῆς τρέχωμεν τὸν προκείμενον ἡμῖν ἀγῶνα,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/001.yaml
  text: Therefore[a], since we also have so great a cloud of witnesses surrounding us, laying aside every weight and the sin that so easily entangles, let us run with endurance the race set before us,
translation:
  language: zh_hans
  text: 所以，我们既有这么一大群如云彩般围绕着我们的见证人，就让我们卸下一切重担和那容易缠累人的罪[a]，以忍耐奔跑那摆在我们前面的赛跑。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那紧紧附着的罪”，或“那容易诱捕人的罪”。希腊语形容词十分罕见，可能着重于缠累、诱捕或紧紧附着。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοιγαροῦν
  choice: 所以
  rationale: 承接第11章并引出推论；“所以”自然保留其推论语气。
- source_word: τοσοῦτον ... νέφος μαρτύρων
  choice: 这么一大群见证人如云彩般
  rationale: 以自然汉语保留“云彩”的比喻及庞大群体的强调；“见证人”不预先限定他们只是观众。
- source_word: περικείμενον ἡμῖν
  choice: 围绕着我们
  rationale: 表达位于四周的空间意象，同时符合现代汉语习惯。
- source_word: ὄγκον ... πάντα
  choice: 各样重担
  rationale: ὄγκος指重量或妨碍；“重担”既保留重量感，也传达赛跑时造成阻碍之物。
- source_word: ἀποθέμενοι
  choice: 卸下
  rationale: 表达坚决除去负担，与赛跑意象相称，也比生硬直译更自然。
- source_word: τὴν εὐπερίστατον ἁμαρτίαν
  choice: 那容易缠累人的罪
  rationale: εὐπερίστατος罕见且含义有争议；正文采用符合赛跑语境的“容易缠累”，并以脚注保留“紧紧附着”或“容易诱捕”等可能。定冠词译为“那”，但不指明某一种具体的罪。
- source_word: δι’ ὑπομονῆς
  choice: 以忍耐
  rationale: ὑπομονή表示在艰难中坚定持守；“以忍耐”简洁并适合劝勉语境。
- source_word: τρέχωμεν
  choice: 奔跑
  rationale: 第一人称复数劝勉虚拟式通过“我们……就该……奔跑”自然体现共同劝勉。
- source_word: τὸν προκείμενον ἡμῖν ἀγῶνα
  choice: 摆在我们前面的赛程
  rationale: ἀγών可指竞赛、较量或斗争；因有“跑”的明确语境，译作“赛程”最贴切，并保留预先摆在面前的意象。
theological_decisions:
- issue: 第11章人物作为“见证人”的含义
  choice: 保留“见证人”，使其首先可指他们以生命为信心作见证，同时让“围绕”的形象继续发挥劝勉作用
  alternative: 把他们明确译成在天上观看信徒赛跑的观众
  rationale: 上下文首先回指第11章信心人物的见证；原文并未明确断言他们正在观看，因此不在译文中消除这一解释张力。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“如云彩般”保留原文意象；“卸下”“赛程”维持全节的赛跑画面。脚注标记置于相关短语之后。
