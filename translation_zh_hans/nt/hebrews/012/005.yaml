  text: καὶ ἐκλέλησθε τῆς παρακλήσεως, ἥτις ὑμῖν ὡς υἱοῖς διαλέγεται, Υἱέ μου, μὴ ὀλιγώρει παιδείας κυρίου, μηδὲ ἐκλύου ὑπ’ αὐτοῦ ἐλεγχόμενος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/005.yaml
  text: 'And you have forgotten the exhortation that addresses you as sons: “My son[a], do not regard lightly the Lord’s discipline[c][b], nor lose heart when you are reproved by him.”'
translation:
  language: zh_hans
  text: '你们竟忘了那劝勉的话；这话是把你们当作儿子[a]来对你们说的：


    “我儿，不可轻看主的管教[b][c]；


    受他责备时，也不可灰心。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“儿子”；这里沿用《箴言》的称呼，并以儿子的称呼向读者说话。
    reason: lexical_alternative
  - marker: b
    text: 引自《箴言》3:11。
    reason: cross_reference
  - marker: c
    text: “管教”也可理解为“训练”或“教导”，不只是惩罚。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκλέλησθε
  choice: 忘了
  rationale: 完成时表示因忘记而处于现今仍未记取的状态；“忘了”在现代汉语中自然，并保留责问意味。
- source_word: παρακλήσεως
  choice: 劝勉的话
  rationale: παράκλησις 可指鼓励、劝勉或安慰；此处引入带有警戒意味的箴言，译作“劝勉的话”既符合语境，也不排除鼓励的作用。
- source_word: ἥτις ὑμῖν ὡς υἱοῖς διαλέγεται
  choice: 就是把你们当作儿子来对你们说
  rationale: 既表达经文直接向读者说话，也保留 ὡς υἱοῖς 的儿子身份用语；“就是”自然承接并说明前面的“劝勉的话”。
- source_word: ὀλιγώρει
  choice: 不可轻看
  rationale: 该词指把某事看得无足轻重或不予重视；“轻看”简洁、自然，不把语气加强为“鄙视”。
- source_word: παιδείας
  choice: 管教
  rationale: παιδεία 涵盖塑造性的训练、教导和纠正；“管教”适合父子语境，并能容纳训练与惩戒两方面。
- source_word: ἐκλύου
  choice: 不可灰心
  rationale: 该词描写人在压力或责备之下内心松懈、失去勇气；“灰心”是自然且准确的现代汉语表达。
- source_word: ἐλεγχόμενος
  choice: 受他责备时
  rationale: ἐλέγχω 可指揭露、责备或纠正；“责备”保留其警戒力度，同时符合父亲管教儿子的语境。
theological_decisions:
- issue: 劝勉中的性别化儿子身份用语
  choice: 正文译作“儿子”和“我儿”
  alternative: 孩子、我的孩子
  rationale: 原文 υἱοῖς 与 Υἱέ 明确使用“儿子”，既呼应《箴言》的措辞，也连接本段关于儿子身份的论述；脚注说明其对全体信徒的代表性用法。
- issue: 神人关系中 παιδεία 的含义
  choice: 管教
  alternative: 训练、教导、惩戒
  rationale: 该词同时包含培育训练与纠正惩戒；“管教”保留这种张力，不将其缩减为单纯惩罚或一般教导。
- issue: 责备者 αὐτοῦ 的所指
  choice: 保留代词“他”
  alternative: 明确译作“主”
  rationale: 语境自然指向前面的“主”，但原文使用代词；保留“他”既清楚，也避免在正文中作不必要的明说。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不可轻看”“不可灰心”保留引文的劝诫语气；分行呈现旧约引文。正文保留“儿子／我儿”的互文和神学用语，并用脚注说明其代表性范围。
