  text: εἰς παιδείαν ὑπομένετε· ὡς υἱοῖς ὑμῖν προσφέρεται ὁ θεός· τίς ⸀γὰρ υἱὸς ὃν οὐ παιδεύει πατήρ;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/007.yaml
  text: Endure for discipline[a]; God is dealing with you as with sons[b]. For what son is there whom a father does not discipline?
translation:
  language: zh_hans
  text: 你们要为管教而忍耐[a]；神待你们如同待儿子[b]。因为，哪有儿子是父亲不管教的呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“要把所忍受的事当作管教。”希腊原文既可理解为“为着管教而忍耐”，也可理解为“把所忍受的事看作管教”。
    reason: alternative_reading
  - marker: b
    text: 原文为“儿子”。这里沿用父亲与儿子的比拟；其应用并不限于男性。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς παιδείαν
  choice: 为管教
  rationale: 保留 εἰς 可能表达的目的或结果关系，表明忍耐与神的管教相关；同时用脚注注明也可理解为把所忍受的事看作管教。
- source_word: ὑπομένετε
  choice: 你们要……忍耐
  rationale: 该形式可作陈述语气或命令语气；结合上下文，译作劝勉性的命令较自然，又不擅自补出原文没有的宾语。
- source_word: παιδεία / παιδεύει
  choice: 管教
  rationale: “管教”兼有纠正、训练和塑造的含义，并在本节前后保持同一词根的呼应。
- source_word: ὡς υἱοῖς
  choice: 如同儿子
  rationale: 保留父亲与儿子的比拟和原文的阳性亲属称谓；中文表达简洁自然。
- source_word: προσφέρεται
  choice: 待
  rationale: 此处表示神以某种方式对待他们；“待”准确、自然，也避免按字面误译为“被呈献”。
- source_word: τίς γὰρ υἱὸς ὃν οὐ παιδεύει πατήρ
  choice: 因为，哪有儿子是父亲不管教的呢？
  rationale: 用反问句再现原文诉诸通常父子关系的论证，并且不把原文未明说的“他的”加在“父亲”之前。
theological_decisions:
- issue: 父子比拟中的性别用语
  choice: 正文保留“儿子”
  alternative: 孩子／儿女
  rationale: 论证明确使用“父亲—儿子”的关系图像，保留“儿子”能准确呈现原文；脚注说明其应用并不限于男性，以免误解。
- issue: εἰς παιδείαν 与 ὑπομένετε 的关系
  choice: 译为“为管教而忍耐”
  alternative: 把所忍受的事当作管教而忍耐
  rationale: 原文可表示忍耐是为着管教，也可理解为把患难视为管教。正文采用较贴近表层句法的目的性表达，脚注保留另一种真实可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“为管教而忍耐”略带书面色彩，以保存原文的句法开放性；反问句则按自然汉语表达。
