  source_fidelity: 草稿准确传达了条件句、"管教"、众人共同有分，以及结论中“非合法子”与“儿子”的强烈对比。μως，“就是众人都一同有分的管教”在中文中把关系从句处理得不够清楚，容易造成“没有受的管教就是……”的黏连。
  naturalness: 建议用破折号清晰标示原文修饰“管教”的关系从句；“众人都有分”比“众人都一同有分”更自然，且不额外强调“一同”。
