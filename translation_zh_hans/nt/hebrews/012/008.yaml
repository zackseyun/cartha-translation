  text: εἰ δὲ χωρίς ἐστε παιδείας ἧς μέτοχοι γεγόνασι πάντες, ἄρα νόθοι ⸂καὶ οὐχ υἱοί ἐστε⸃.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/008.yaml
  text: But if you are without discipline, of which all have become sharers, then you are illegitimate children and not sons.
translation:
  language: zh_hans
  text: 但如果你们没有受管教——这是众人都有分的——那么你们就是私生子，而不是儿子。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παιδείας
  choice: 管教
  rationale: 此处指父亲对子女的训练、纠正和教导；“管教”既承接上下文，也保留其中可能包含的责罚意味。
- source_word: μέτοχοι γεγόνασι πάντες
  choice: 众人都一同有分
  rationale: 表达所有真正的儿女都已成为这种管教的参与者；“有分”自然且保留群体共享之意。
- source_word: νόθοι
  choice: 私生子
  rationale: 在当时的父子与继承语境中，指不具合法儿女身份者；用直接而庄重的中文保留原文尖锐的对比。
- source_word: υἱοί
  choice: 儿子
  rationale: 原文明确使用阳性复数“儿子”，并与父亲的管教及合法家属身份相连，因此不泛化为“儿女”。
theological_decisions:
- issue: “众人”的范围
  choice: 保留“众人”，由上下文表明是所有真正的儿子
  alternative: 译作“所有上帝的儿女”
  rationale: 原文只说 πάντες，没有明说“上帝的儿女”；不在正文中补入解释，以保留原文的简洁和论证张力。
- issue: 受管教与儿子身份的关系
  choice: 按条件句直译为没有管教便是私生子而非儿子
  alternative: 弱化为“就不像真正的儿女”
  rationale: 原文使用身份判断 ἄρα νόθοι καὶ οὐχ υἱοί ἐστε，语气强烈，不应改成仅仅相似性的描述。
translation_notes:
  register: 采用现代、庄重而易懂的普通话；保留原文父子身份的法律与家庭意象，以及“私生子”这一带有冲击力的措辞。
