source:
  edition: SBLGNT
  text: τὸ δὲ Ἔτι ἅπαξ δηλοῖ ⸂τῶν σαλευομένων⸃ μετάθεσιν ὡς πεποιημένων, ἵνα μείνῃ τὰ μὴ σαλευόμενα.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/027.yaml
  text: This phrase, “Yet once more,” indicates the removal of the things being shaken—as things that have been made—so that the things not being shaken may remain.
translation:
  language: zh_hans
  text: “再一次”这句话表明，那些正在被震动的事物——作为受造之物[a]——将被挪去，好让那些不被震动的事物[b]存留下来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “作为受造之物”直译为“作为已经被造的事物”。
    reason: lexical_alternative
  - marker: b
    text: “不被震动的事物”也可译作“不能被震动的事物”或“不可震动的事物”。
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ δὲ Ἔτι ἅπαξ
  choice: “再一次”这句话
  rationale: 中性冠词使所引短语名词化，指向“再一次”这几个字本身；δέ在此是轻微的承接转折，汉语不必另加生硬的连接词。
- source_word: δηλοῖ
  choice: 表明
  rationale: 表达作者由所引措辞作出的解释和推论，现代汉语自然清楚。
- source_word: τῶν σαλευομένων
  choice: 那些正在被震动的
  rationale: 保留现在被动分词的动态意味，并与后文“不被震动的”形成平行对照。
- source_word: μετάθεσιν
  choice: 将被挪去
  rationale: 此处所指不只是改变，而是从现有秩序中移除；用“挪去”既表达移除，也避免过度具体化。
- source_word: ὡς πεποιημένων
  choice: 就是受造之物
  rationale: 将ὡς理解为说明这些被震动之物乃属于已经被造之物；“受造之物”自然凝练，脚注保留更贴近字面的表达。
- source_word: ἵνα μείνῃ
  choice: 好让……存留下来
  rationale: 自然表达ἵνα所带的目的或结果，同时保留原文未明确区分二者的空间。
- source_word: τὰ μὴ σαλευόμενα
  choice: 那些不被震动的
  rationale: 按原文保留μή加分词的否定形式，不提前解释成“不能被震动的”，从而维持与下一节之间的张力。
theological_decisions:
- issue: τὰ μὴ σαλευόμενα是译作“不被震动的”还是“不能被震动的”
  choice: 那些不被震动的
  alternative: 那些不能被震动的／不可震动的
  rationale: 本节原文与前半句形成“被震动的／不被震动的”分词对照，并未明说能力或可能性；较形式对应的译法避免用下一节“不能震动的国”的措辞提前消解本节张力。
- issue: ὡς πεποιημένων如何表达受造性
  choice: 就是受造之物
  alternative: 作为已经被造的东西／因为是受造之物
  rationale: 原文ὡς可标示这些事物作为已被造之物的身份或性质；正文采用自然的说明语气，但不将其强化为明确因果关系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“再一次”直接承接上节引文；正文保留“正在被震动的／不被震动的”对照。脚注标记均置于全句末尾，分别说明“受造之物”的字面形式和“不被震动的”的解释性译法。
