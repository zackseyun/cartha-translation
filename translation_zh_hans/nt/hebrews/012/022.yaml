  text: ἀλλὰ προσεληλύθατε Σιὼν ὄρει καὶ πόλει θεοῦ ζῶντος, Ἰερουσαλὴμ ἐπουρανίῳ, καὶ μυριάσιν ἀγγέλων, πανηγύρει
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/022.yaml
  text: But you have come to Mount Zion and to the city of the living God[a], the heavenly Jerusalem, and to myriads of angels in festal gathering[b],
translation:
  language: zh_hans
  text: 但你们已经来到锡安山，来到永活的上帝的城，就是天上的耶路撒冷；也来到在欢庆聚会中的千千万万天使[a][b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “千千万万”也可译作“数以万计”；原文既可指许多个“一万”，也可泛指多得难以计数。
    reason: lexical_alternative
  - marker: b
    text: 原文的句法也可理解为：“也来到千千万万的天使那里，来到欢庆的聚会”；“欢庆的聚会”还可能与下一节的“长子们的集会”相连。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: 但
  rationale: 承接上文西奈山的景象，表达鲜明转折；“但”简洁自然。
- source_word: προσεληλύθατε
  choice: 你们已经来到
  rationale: 以“已经”体现完成时所表达的既成行动及其当前结果。
- source_word: Σιὼν ὄρει
  choice: 锡安山
  rationale: 采用现代汉语中通行的专名形式，并保留“山”的意象。
- source_word: πόλει θεοῦ ζῶντος
  choice: 永活上帝的城
  rationale: “永活”保留 ζῶντος 所强调的“活着、有生命”，又保持庄重凝练；属格译为所属关系。
- source_word: Ἰερουσαλὴμ ἐπουρανίῳ
  choice: 天上的耶路撒冷
  rationale: 此语与“永活上帝的城”同位；“天上的”直接、自然地表达 ἐπουρανίῳ。
- source_word: μυριάσιν ἀγγέλων
  choice: 千千万万的天使
  rationale: “千千万万”既有数量宏大的修辞色彩，也不把 μυριάσιν 限定为精确数字。
- source_word: πανηγύρει
  choice: 欢庆的盛会
  rationale: 表达公开、喜庆的聚集，并在正文中将其与紧邻的天使群体相连。
theological_decisions:
- issue: πανηγύρει 与前后成分的句法关系
  choice: 将“欢庆的盛会”与前面的“千千万万的天使”相连，理解为天使欢聚庆祝的盛会。
  alternative: 可把“盛会”看作列举中的独立一项；也有人将它与下一节“长子们的集会”相连。
  rationale: 希腊文的一连串与格成分容许不同断句。正文采用与最近成分“天使”相连的顺畅读法，同时以脚注保留真实的句法歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以分号帮助读者辨认层层列举的结构；结尾逗号表明本节句意延续至下一节。所有脚注标记均放在相关正文词语之后。
