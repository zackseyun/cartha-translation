revisions:
- from: 但你们已经来到锡安山，来到永活上帝的城，就是天上的耶路撒冷；也来到千千万万的天使[a]欢庆的盛会[b]，
  to: 但你们已经来到锡安山，来到永活的上帝的城，就是天上的耶路撒冷；也来到在欢庆聚会中的千千万万天使[a][b]，
  rationale: 修订使“欢庆聚会”在正文中明确修饰天使，同时不把有争议的句法关系绝对化；脚注保留其可作为列举中独立项目、或与下一节相连的可能性。另将“永活上帝”改为“永活的上帝”，使译文更符合现代标准汉语并更清楚传达原文。
