  text: πᾶσα ⸀δὲ παιδεία πρὸς μὲν τὸ παρὸν οὐ δοκεῖ χαρᾶς εἶναι ἀλλὰ λύπης, ὕστερον δὲ καρπὸν εἰρηνικὸν τοῖς δι’ αὐτῆς γεγυμνασμένοις ἀποδίδωσιν δικαιοσύνης.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/011.yaml
  text: All discipline seems for the present to be not joy but sorrow[a]; yet later it yields the peaceful fruit of righteousness to those who have been trained by it.
translation:
  language: zh_hans
  text: 一切管教，当时看来都不是喜乐，而是忧愁；后来却给那些借着它受过操练的人结出义的平安果实[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “义”也可译作“公义”。原词可指正直、合乎上帝心意的状态，也可着重公平正义；这里很可能指上帝的管教所结出的正直生命。
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδεία
  choice: 管教
  rationale: 本章以父亲教养儿女为背景，所指包括纠正、教导和塑造，不只是惩罚；“管教”在现代汉语中能较好保留这一广度。
- source_word: πρὸς μὲν τὸ παρόν
  choice: 当时
  rationale: 与后面的“后来”形成时间上的对照，表达人在受管教之际的感受；译法简洁自然。
- source_word: οὐ δοκεῖ
  choice: 似乎都不是
  rationale: 保留 δοκεῖ 所表达的主观观感，没有把当下的体验说成绝对判断。
- source_word: χαρᾶς ... ἀλλὰ λύπης
  choice: 不是喜乐，而是忧愁
  rationale: 按原文保留名词性的“喜乐”和“忧愁”，避免将 λύπη窄化为身体上的疼痛。
- source_word: ὕστερον
  choice: 后来
  rationale: 直接表达管教之后才显出的结果，并与“当时”相对。
- source_word: καρπὸν εἰρηνικόν
  choice: 平安的果实
  rationale: 保留“果实”意象，并把 εἰρηνικός理解为果实具有平安的性质，而不限定为仅仅带来平安。
- source_word: τοῖς δι’ αὐτῆς γεγυμνασμένοις
  choice: 那些借此受过操练的人
  rationale: “借此”对应 δι’ αὐτῆς；“受过操练”保留完成时被动分词所表达的持续训练及其已形成的效果，也保留 γυμνάζω 的操练意象。
- source_word: ἀποδίδωσιν
  choice: 结出
  rationale: 与“果实”自然搭配，表达管教最终产生结果；“为……结出”也体现间接受词所指的受益者。
- source_word: δικαιοσύνης
  choice: 义
  rationale: “义”是 δικαιοσύνη 在圣经语境中的简洁、庄重译法；以破折号将其作为“平安的果实”的说明，同时在脚注保留“公义”这一可能译法。
theological_decisions:
- issue: 本节中 παιδεία 所指上帝对信徒的作为
  choice: 具有塑造作用的管教，包括纠正与训练
  alternative: 惩罚；单纯教导
  rationale: 希伯来书12:5—10以父子关系说明这种行动，目标是使人得益处并有分于圣洁；“管教”保留慈爱、纠正和塑造之间的张力，不将其化约为报应性惩罚。
- issue: δικαιοσύνης 的译法及其与“果实”的关系
  choice: 义；用破折号说明“平安的果实”
  alternative: 公义；“义的平安果实”
  rationale: 此处最自然地指管教在人身上形成的正直生命，但原文属格也可理解为修饰“果实”。正文采用自然汉语说明二者关系，脚注则保留 δικαιοσύνη 可表达“公义”的词义空间。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“凡是……都……”自然表达 πᾶσα 的概括意义；分号和“后来却”清楚呈现当下忧愁与后来结果之间的转折。正文脚注标记置于其实际说明的“义”之后。
