  text: Therefore[a], strengthen your drooping hands and your weakened knees,
translation:
  language: zh_hans
  text: 所以，要挺起下垂的手和发软的膝盖。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“所以，要把垂下的手和发软的膝盖扶起来。”这里的措辞呼应《以赛亚书》35:3的希腊文译本，以身体的软弱比喻灰心疲惫，并劝人重新振作、坚忍下去。
    reason: cross_reference
lexical_decisions:
- source_word: Διὸ
  choice: 所以
  rationale: 表示由上文关于管教与忍耐的论述引出的劝勉性结论；“所以”自然简洁，并保留推论关系。
- source_word: παρειμένας χεῖρας
  choice: 下垂的手
  rationale: παρίημι 的分词在这里描绘松弛、垂下的手；“下垂的手”既贴近身体意象，也能自然表达灰心乏力。原文有定冠词但无第二人称物主词，中文无需补出“你们的”。
- source_word: παραλελυμένα γόνατα
  choice: 发软的膝盖
  rationale: παραλύω 的完成时分词表示已经软弱无力；“发软的膝盖”是自然的现代汉语表达，保留疲惫无力的形象，又避免误解为临床意义上的瘫痪。
- source_word: ἀνορθώσατε
  choice: 使……挺起来
  rationale: ἀνορθόω 可指扶起、挺直或恢复直立。此处用单一命令统摄手和膝盖；“使……挺起来”保留身体动作的原始比喻，也在语境中传达重新振作、坚持前行之意。
theological_decisions:
- issue: 身体软弱意象所表达的劝勉
  choice: 保留“手”和“膝盖”的身体意象，同时让命令自然传达重新振作、坚忍前行。
  alternative: 直接意译为“要振作起来，重新得力”。
  rationale: 上下文谈到忍耐和管教，本句也呼应希腊文传统中的以赛亚书35:3。保留比喻可维持经文互文关系，并避免把丰富的形象简化为抽象劝告。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“发软”自然表达无力状态；“挺起来”保留原文恢复直立的身体意象。标点按现代简体中文习惯处理。
