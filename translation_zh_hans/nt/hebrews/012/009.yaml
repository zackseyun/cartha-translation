source:
  edition: SBLGNT
  text: εἶτα τοὺς μὲν τῆς σαρκὸς ἡμῶν πατέρας εἴχομεν παιδευτὰς καὶ ἐνετρεπόμεθα· οὐ ⸀πολὺ μᾶλλον ὑποταγησόμεθα τῷ πατρὶ τῶν πνευμάτων καὶ ζήσομεν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/009.yaml
  text: Furthermore[a], we had our earthly fathers as disciplinarians, and we respected them[c][b]. Shall we not much more submit to the Father of spirits and live?
translation:
  language: zh_hans
  text: 再者，我们曾受肉身父亲的管教，也敬重他们；我们岂不更应当顺服万灵之父[a]，并且活着吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “万灵之父”也可理解为特指“我们灵的父”；原文的表达范围较宽。
    reason: alternative_reading
lexical_decisions:
- source_word: εἶτα
  choice: 再者
  rationale: 这里引出递进论证中的另一层理由，不主要表示时间先后；“再者”自然地承接上文。
- source_word: τοὺς τῆς σαρκὸς ἡμῶν πατέρας
  choice: 我们肉身的父亲
  rationale: 保留“肉身”与后文“灵”的对照，所指是人肉身方面的父亲，并非“罪性”。
- source_word: παιδευτὰς
  choice: 管教我们
  rationale: 将表“施行管教者”的名词按现代汉语习惯转为动词表达，同时保持与本章“管教”主题的词汇联系。
- source_word: ἐνετρεπόμεθα
  choice: 尊敬他们
  rationale: 在父亲施行管教的语境中，表示以敬重之心对待他们；“尊敬”清楚自然，又不夸大为惧怕。
- source_word: οὐ πολὺ μᾶλλον
  choice: 岂不更应当
  rationale: 体现原文由轻到重的反问和加强语气。
- source_word: ὑποταγησόμεθα
  choice: 顺服
  rationale: 表达置身于权柄之下的回应；此处以汉语主动形式自然呈现希腊语将来被动形式的实际语义。
- source_word: τῷ πατρὶ τῶν πνευμάτων
  choice: 万灵之父
  rationale: 贴近原文所有格结构并保留“灵”的复数和范围上的开放性，与“肉身的父亲”形成对照。
- source_word: ζήσομεν
  choice: 并且活着
  rationale: 保留将来或结果意味而不进一步限定为今生、属灵生命或永生。
theological_decisions:
- issue: “万灵之父”的范围
  choice: 正文保留宽泛的“万灵之父”
  alternative: 特指“我们灵的父”
  rationale: 希腊文只说“灵的父”，没有明说“我们的”；上下文虽可能侧重神与人的灵之关系，却不宜在正文中排除更宽的含义。
- issue: “活着”的生命性质
  choice: 不加限定地译为“活着”
  alternative: “得永生”或“在属灵上活着”
  rationale: 原文仅用“活”，语境赋予其深厚的神学意味，但没有在本句明确加上“永远”或“属灵”等限定。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“肉身的父亲”有意保留原文与“万灵之父”的对照；全句保持原文递进反问的力度。
