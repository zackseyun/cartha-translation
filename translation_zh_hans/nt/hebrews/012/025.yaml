id: HEB.12.25
reference: Hebrews 12:25
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Βλέπετε μὴ παραιτήσησθε τὸν λαλοῦντα· εἰ γὰρ ἐκεῖνοι οὐκ ⸀ἐξέφυγον ⸂ἐπὶ γῆς παραιτησάμενοι τὸν⸃ χρηματίζοντα, ⸀πολὺ μᾶλλον ἡμεῖς οἱ τὸν ἀπ’ οὐρανῶν ἀποστρεφόμενοι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/025.yaml
  text: See to it that you do not refuse the one who is speaking[a]. For if those did not escape when they refused the one who warned them on earth[b], much less will we if we turn away from the one who warns from heaven.
translation:
  language: zh_hans
  text: 你们要谨慎，不要拒绝那位正在说话的。因为，那些人拒绝了那位在地上向他们发出警告的，尚且不能逃脱；我们若背离那位从天上说话的，就更不能逃脱了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文后半句直译近于“何况我们这些背离那位从天上而来的（那一位）的”；“不能逃脱”承接前一句而省略。“从天上说话的”则是根据前文“正在说话的”及上下文为使汉语通顺所作的补足。
    reason: 说明原文后半句承接前句的省略结构，并澄清“说话”不是后半句重复出现的字词。
lexical_decisions:
- source_word: Βλέπετε
  choice: 你们要谨慎
  rationale: 复数命令语气在此用于郑重劝诫；“要谨慎”比直译“要看”更自然，也保留警告力度。
- source_word: μὴ παραιτήσησθε / παραιτησάμενοι
  choice: 不可拒绝 / 拒绝了
  rationale: 两处采用同一词根的表达，以保留原文有意的重复和前后呼应。
- source_word: τὸν λαλοῦντα
  choice: 那位正在说话的
  rationale: 保留现在分词所表达的持续、当下说话之意，也不擅自明确说话者的身份。
- source_word: ἐξέφυγον
  choice: 未能逃脱
  rationale: 指未能逃脱相应后果或审判；中文不补出具体对象，以保持原文含蓄。
- source_word: ἐπὶ γῆς
  choice: 在地上
  rationale: 与后文“从天上”形成原文的空间对照，不在正文中限定为西奈山。
- source_word: χρηματίζοντα
  choice: 那位传神谕警告他们的
  rationale: 该词可指来自神的指示、宣告或警告；“传神谕警告”兼顾其神圣来源和本节的警戒语境。宾语“他们”由语境补出。
- source_word: πολὺ μᾶλλον
  choice: 就更不能
  rationale: 结合前句否定，在现代汉语中用“尚且……就更不能……”自然表达由轻到重的论证。
- source_word: ἀποστρεφόμενοι
  choice: 若转身离开
  rationale: 原文分词描述“我们”转离的情形；译作条件句使省略结构在中文中清楚，同时保留主动背离的意味。
- source_word: τὸν ἀπ’ οὐρανῶν
  choice: 那位从天上说话的
  rationale: 原文仅作“那位从天上来的／从天上发声的”式省略表达；依据与前文说话者的联系补出“说话”，但不增添“神”或“基督”等身份称谓。
theological_decisions:
- issue: 说话者和警告者的身份
  choice: 正文仅称“那位正在说话的”“那位从天上说话的”
  alternative: 明确译为神或基督
  rationale: 上下文表明这是具有神圣权威的发言，但本节没有直接使用专名或称号；保留描述性说法，避免替原文消除身份上的含蓄。
- issue: χρηματίζοντα 的神圣传达色彩
  choice: 译为“传神谕警告”
  alternative: 仅译为“警告”或译为“赐神圣指示”
  rationale: 该词既可突出神圣指示，也可在此语境中具有警告意味；组合表达保留两层含义，避免将其压缩为单一解释。
- issue: 后半句省略的谓语
  choice: 补出“就更不能逃脱了”
  alternative: 照原文保留为“何况我们这些转离……的人”
  rationale: 希腊文从前句承接“逃脱”而省略谓语；中文补出可使论证完整易懂，不改变其审判警告。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“尚且……就更不能……”呈现由轻到重的警告逻辑；不使用宗派化身份称谓。脚注标记[a]已在正文出现。
