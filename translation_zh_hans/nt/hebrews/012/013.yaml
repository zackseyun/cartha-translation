  text: καὶ τροχιὰς ὀρθὰς ⸀ποιεῖτε τοῖς ποσὶν ὑμῶν, ἵνα μὴ τὸ χωλὸν ἐκτραπῇ, ἰαθῇ δὲ μᾶλλον.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/013.yaml
  text: and make straight paths for your feet[a], so that the lame may not be turned aside[b], but rather be healed.
translation:
  language: zh_hans
  text: 也要为你们的脚修直道路[a]，使那瘸弱的不致偏离[b]，反而得到医治。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的措辞呼应《箴言》4:26，并延续本段关于谨慎行走的意象。
    reason: cross_reference
  - marker: b
    text: 或译“脱臼”或“关节错位”；这个希腊词在此身体意象中也可能带有医学含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: τροχιὰς
  choice: 道路
  rationale: 该词本指车辙、轨迹或路径；此处用于行走的劝勉性比喻，“道路”自然清楚，也保留人生行程的意象。
- source_word: ὀρθὰς
  choice: 直
  rationale: 修饰“道路”，表示路线正直、方向端正；“直”既贴近原文，也呼应《箴言》4:26的道路意象。
- source_word: ποιεῖτε
  choice: 修
  rationale: 原文为现在时命令式，要求持续采取行动。“修直道路”是自然的现代汉语搭配，并表达使道路适宜行走的行动。
- source_word: τοῖς ποσὶν ὑμῶν
  choice: 为你们的脚
  rationale: 与格最自然地表示受益或所关涉的对象，即把道路修直，供自己的脚行走；保留原文身体与行走的比喻。
- source_word: τὸ χωλὸν
  choice: 瘸弱的
  rationale: 中性单数形容词在此作名词用，所指可以是瘸弱的人、肢体，或比喻性的软弱者。“瘸弱的”保留这种未明确限定的指向。
- source_word: ἐκτραπῇ
  choice: 偏离
  rationale: 该动词可指转离、偏离，也可能在身体意象中带有脱臼的医学含义。正文采用较宽泛的“偏离”，医学义列入脚注。
- source_word: ἰαθῇ
  choice: 得到医治
  rationale: ἰάομαι通常指医治、痊愈；“得到医治”保留身体意象和恢复性的目的。
- source_word: μᾶλλον
  choice: 反而
  rationale: 该词在此把前面的否定结果与正面结果相对照；“反而”准确表达“不致……而是……”的转折。
theological_decisions:
- issue: 身体意象究竟是字面意义还是比喻意义
  choice: 正文保留“脚”“瘸弱”“医治”等身体语言，不明确限定为身体残疾、属灵软弱或群体中的脆弱者。
  alternative: 明确译作“软弱的信徒”，或仅理解为泛指容易受伤害的人。
  rationale: 原文在劝勉语境中使用身体与行路的意象，却没有明确界定“瘸弱的”具体所指；保留张力可避免加入原文未说明的教义或牧养解释。
- issue: ἐκτραπῇ是一般性的“偏离”还是医学性的“脱臼”
  choice: 正文译为“偏离”，脚注保留“脱臼”的可能。
  alternative: 正文直接译为“脱臼”或“关节错位”。
  rationale: “偏离”与道路意象衔接自然，而“脱臼”与上下文的身体意象及“医治”也很贴切；原文允许两层理解，因此不在正文中排除任何一层。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“修直道路”保持经文式的凝练感；“瘸弱的”有意不补出“人”“肢体”或“信徒”，以保存原文中性单数名词化表达的开放性。脚注标记按其实际说明对象放置：道路意象后为[a]，可能的医学义后为[b]。
