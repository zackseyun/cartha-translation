source:
  edition: SBLGNT
  text: Ἀναλογίσασθε γὰρ τὸν τοιαύτην ὑπομεμενηκότα ὑπὸ τῶν ἁμαρτωλῶν εἰς ⸀ἑαυτοὺς ἀντιλογίαν, ἵνα μὴ κάμητε ταῖς ψυχαῖς ὑμῶν ἐκλυόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/003.yaml
  text: For consider the one who endured such opposition from sinners against himself[a], so that you may not grow weary[b], becoming discouraged in your souls.
translation:
  language: zh_hans
  text: 你们要仔细想想那位忍受罪人如此反对他自己的一位，免得你们疲倦，心里灰心。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: SBLGNT正文作“反对他们自己”；有些抄本作“反对他自己”。按上下文，这里的反对是针对耶稣的。
    reason: textual_variant
  - marker: b
    text: 或译：“免得你们疲倦，在内心中丧志。”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναλογίσασθε
  choice: 要仔细想想
  rationale: 该词是命令语气，要求听者认真衡量、深思；“仔细想想”自然易懂，同时保留劝勉力度。
- source_word: τοιαύτην
  choice: 这样
  rationale: 修饰“反对”，可指这种性质或这种程度的敌对；“这样”保留原文较宽泛的强调。
- source_word: ὑπομεμενηκότα
  choice: 忍受
  rationale: 完成时分词突出那位已经承受并坚持到底的事实；“忍受”简洁地表达在敌对之下坚忍。
- source_word: ἁμαρτωλῶν
  choice: 罪人
  rationale: 直接保留原文对这些人的道德称谓，也符合现代中文圣经语体。
- source_word: ἀντιλογίαν
  choice: 反对
  rationale: 该词可表示反驳、顶撞或敌对；本处涵盖耶稣所遭受的广泛抗拒，“反对”自然且不过度限定。
- source_word: κάμητε
  choice: 疲倦
  rationale: 表示因持续承受压力而困乏、厌倦；“疲倦”与下文“灰心”形成递进而不重复。
- source_word: ταῖς ψυχαῖς ὑμῶν
  choice: 心里
  rationale: ψυχή在此指人的内在生命或自我；汉语“心里”准确传达内在层面，比直译“在你们的魂里”更自然。
- source_word: ἐκλυόμενοι
  choice: 灰心
  rationale: 表示松懈、丧失勇气或支撑不住；“灰心”适合现代中文劝勉语境，另以脚注保留“心里发昏”的可能表达。
theological_decisions:
- issue: “那位”的所指
  choice: 保留“那位”，由上文表明所指是耶稣
  alternative: 直接译作“耶稣”
  rationale: 原文使用带冠词的指称表达，并未在本节重述名字；上文希伯来书12:2已清楚指出耶稣，因此保留原文表达而不增词。
- issue: εἰς ἑαυτούς的文本与所指
  choice: 正文按语境译作罪人对“自己”（即耶稣）的反对，并用脚注说明SBLGNT字面为“他们自己”
  alternative: 正文译作“罪人反对他们自己”
  rationale: SBLGNT采用复数反身代词ἑαυτούς，但单数ἑαυτόν有重要抄本支持，且上下文明确描述敌对指向耶稣。正文传达语境中的关系，脚注如实保留底本文本及异文张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“仔细想想”保留命令的劝勉力；“疲倦，心里灰心”保持两个相关表达的区别。所有脚注标记均置于正文相应位置。
