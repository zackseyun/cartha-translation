  text: καὶ σάλπιγγος ἤχῳ καὶ φωνῇ ῥημάτων, ἧς οἱ ἀκούσαντες παρῃτήσαντο ⸀μὴ προστεθῆναι αὐτοῖς λόγον·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/019.yaml
  text: and to the sound of a trumpet and to a voice of words[b][a], whose hearers begged that no further word be spoken to them.
translation:
  language: zh_hans
  text: 也不是面对号角的响声和话语的声音[a][b]；听见这声音的人恳求不要再有话对他们说。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“听见的人恳求不要再向他们说话。”这里的关系代词也可能较宽泛地指整个西奈山的显现，而不只是“话语的声音”。
    reason: alternative_reading
  - marker: b
    text: 参见《出埃及记》20:18—19；《申命记》5:23—27。以色列人曾恳求不要再直接听见神的声音。
    reason: cross_reference
lexical_decisions:
- source_word: σάλπιγγος ἤχῳ
  choice: 号角的响声
  rationale: 保留ἦχος“响声”的听觉意象，也用“号角”自然呈现西奈山场景中的σάλπιγξ。
- source_word: φωνῇ ῥημάτων
  choice: 说话的声音
  rationale: 希腊语直译近于“言语的声音”，强调所听见的是清楚的话语而非单纯声响；“说话的声音”在现代汉语中自然，同时不过度扩充内容。
- source_word: ἧς
  choice: 这声音
  rationale: 阴性单数关系代词在语法上最自然地回指紧邻的φωνή“声音”；“这声音”使中文所指清楚，同时以脚注保留其可能概括整个西奈显现的理解。
- source_word: οἱ ἀκούσαντες
  choice: 听见这声音的人
  rationale: 按实词化分词译为“听见……的人”，自然且保留实际听见这一动作。
- source_word: παρῃτήσαντο
  choice: 恳求
  rationale: 此处指以迫切请求求免于继续直接听神说话；“恳求”比“请求”更能体现语境中的惧怕与急切，又不误译成单纯“拒绝”。
- source_word: μὴ προστεθῆναι αὐτοῖς λόγον
  choice: 不要再有话对他们说
  rationale: 以自然中文表达προστίθημι的“再加、继续”含义，并保留λόγος“话”和向他们发言的被动意义。
theological_decisions:
- issue: 关系代词ἧς的所指
  choice: 正文将其直接理解为回指“说话的声音”。
  alternative: 也可能较宽泛地指前述号角声与说话声音所构成的整个西奈山显现。
  rationale: 阴性单数形式与最近的阴性名词φωνή一致，因此正文采用最直接的语法关系；但上下文表明以色列人也因整个显现而畏惧，故在脚注中保留较宽的解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“号角的响声”与“说话的声音”维持原文两个并列听觉对象；“也不是来到……那里”承接本段前文反复出现的“不是来到”。脚注标记均置于相关短语之后。
