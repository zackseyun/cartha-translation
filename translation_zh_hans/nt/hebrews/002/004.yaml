source:
  edition: SBLGNT
  text: συνεπιμαρτυροῦντος τοῦ θεοῦ σημείοις τε καὶ τέρασιν καὶ ποικίλαις δυνάμεσιν καὶ πνεύματος ἁγίου μερισμοῖς κατὰ τὴν αὐτοῦ θέλησιν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/004.yaml
  text: while God also bore witness with signs and wonders and various miracles and distributions of the Holy Spirit according to his will.
translation:
  language: zh_hans
  text: 同时，神也借着神迹、奇事、各样的异能[a]和圣灵的分赐[b]，照着自己的旨意作见证。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“各样的能力”或“各样大能的作为”。希腊语可指能力的彰显，在本节语境中指超自然的大能作为。
    reason: lexical_alternative
  - marker: b
    text: 或译“圣灵的分配”或“圣灵的各份”。原文没有明说“恩赐”。
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεπιμαρτυροῦντος
  choice: 同时，神也……作见证
  rationale: 该属格分词承接上一节的主要动词，表示伴随或同时发生的行动。“同时”交代分词关系，“也”自然表达 συν- 的附加、共同印证意味，而不强行补明神与谁“一同”见证。
- source_word: σημείοις τε καὶ τέρασιν
  choice: 借着神迹、奇事
  rationale: 与格表示手段，故用“借着”。“神迹、奇事”是现代中文中自然且熟悉的搭配，也保留这些事件作为证据并引发惊奇的含义。
- source_word: ποικίλαις δυνάμεσιν
  choice: 各样的异能
  rationale: δύναμις 原义涉及能力或大能，在此语境中指大能的彰显，即超自然作为；“异能”较简洁地表达这一语境义，同时脚注保留“能力”和“大能作为”等词义可能。
- source_word: πνεύματος ἁγίου μερισμοῖς
  choice: 圣灵的分赐
  rationale: 保留属格结构及 μερισμοί 的复数分配、分赐含义，不在正文中添入原文没有明说的“恩赐”。
- source_word: κατὰ τὴν αὐτοῦ θέλησιν
  choice: 照着自己的旨意
  rationale: κατά 加宾格表示依照、符合。反身代词“自己”自然回指本句主语“神”；短语置于句末，也避免过度限定其只修饰清单中的最后一项。
theological_decisions:
- issue: “自己的”所指
  choice: 自然回指作见证的神
  alternative: 较宽泛地理解为圣灵的旨意
  rationale: 句法上的控制主语是“神”，因此回指神最自然；但译文不另作教义发挥。
- issue: πνεύματος ἁγίου 的表达
  choice: 圣灵
  alternative: 无须扩写为“圣灵的恩赐”
  rationale: 采用公认的位格称谓，同时严格避免把原文未出现的“恩赐”加入正文。
- issue: κατὰ τὴν αὐτοῦ θέλησιν 的修饰范围
  choice: 保留在句末，使其总体上说明神按自己的旨意作见证
  alternative: 明确限定为神按旨意分配圣灵
  rationale: 希腊文末尾短语可与紧邻的“圣灵的分赐”关系密切，也可较广地统摄神借各样方式作见证；中文不应无必要地排除后一层可能。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“借着”清楚表达手段；“神迹、奇事、异能”沿用普通读者可理解的宗教语汇。“圣灵的分赐”略带名词化，但为避免擅自补入“恩赐”并保留原文结构而采用。所有脚注标记均已置于正文相应词语之后。
