language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: διεμαρτύρατο δέ πού τις λέγων· Τί ἐστιν ἄνθρωπος ὅτι μιμνῄσκῃ αὐτοῦ, ἢ υἱὸς ἀνθρώπου ὅτι ἐπισκέπτῃ αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/006.yaml
  text: But someone has testified somewhere[a], saying, “What is man, that you remember him, or the son of man[c][b], that you care for him?”
translation:
  language: zh_hans
  text: '不过，有人在某处作证说：

    “人算什么，你竟记念他？

    世人算什么，你竟眷顾他？[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “世人”原文直译为“人的儿子”，传统也常译作“人子”。这里引用诗篇8:4，在诗篇中与“人”平行，泛指人类；希伯来书下文又把这段话应用于耶稣。“眷顾”也可译作“看顾”或“探望”，原词可表示以实际关怀来探访、照料。
    reason: lexical_alternative; cross_reference
lexical_decisions:
- source_word: διεμαρτύρατο
  choice: 作证
  rationale: 该动词表示郑重作证、见证；“作证”简洁自然，也适合引出经文证言。
- source_word: δέ
  choice: 不过
  rationale: δέ在此表示温和的转折或话题推进；“不过”承接上文关于天使的论述，并引出相对照的经文证言。
- source_word: πού τις
  choice: 有人在某处
  rationale: 保留希腊文不指名见证者和出处的表达方式；这是一种引经格式，并不必然表示作者不知道出处。
- source_word: Τί ἐστιν ἄνθρωπος
  choice: 人算什么
  rationale: ἄνθρωπος是代表全人类的单数；“人算什么”既保留诗体反问，也自然表达其泛指意义。
- source_word: μιμνῄσκῃ αὐτοῦ
  choice: 记念他
  rationale: 该动词表示记得、放在心上；“记念”在庄重诗文中自然，并能表达持续关切，不只是回想。
- source_word: υἱὸς ἀνθρώπου
  choice: 世人
  rationale: 此处引用诗篇8:4，与前句的“人”构成诗歌平行，基本意义是人类、凡人；“世人”在现代汉语中较自然，同时避免在本节主文中过早将其固定为专门称号。
- source_word: ἐπισκέπτῃ αὐτόν
  choice: 眷顾他
  rationale: ἐπισκέπτομαι可指探望、看顾或施以关怀；“眷顾”准确传达带有行动和关切的看顾，也符合诗体语域。
theological_decisions:
- issue: υἱὸς ἀνθρώπου是否应在主文中译成明确的弥赛亚称号“人子”
  choice: 主文译作泛指人类的“世人”，并以脚注说明其字面形式及基督论回响。
  alternative: 译作“人子”，使其与耶稣常用的称号形成直接文字联系。
  rationale: 在诗篇8篇原有语境中，该短语与“人”平行，指人类；希伯来书后文又把这段话应用于耶稣。主文保留诗篇的普遍人类意义，脚注保留字面形式和后文的基督论张力，避免把其中一层意义提前定死。
translation_notes:
  register: 采用现代、庄重而易懂的诗体表达。引文分行呈现平行结构。“记念”“眷顾”保留经文诗歌的凝练感，同时仍为普通现代读者所理解。脚注标记[a]已置于主文相应引文末尾。
