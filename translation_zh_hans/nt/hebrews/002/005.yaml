  text: Οὐ γὰρ ἀγγέλοις ὑπέταξεν τὴν οἰκουμένην τὴν μέλλουσαν, περὶ ἧς λαλοῦμεν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/005.yaml
  text: For he did not subject the world to come to angels[a], about which we are speaking.
translation:
  language: zh_hans
  text: 因为他没有把我们所谈论的将来的世界[a]交给天使管辖。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“将要来的有人居住的世界”。
    reason: 保留οἰκουμένη可指“有人居住的世界”的词义层面。
lexical_decisions:
- source_word: Οὐ γὰρ
  choice: 因为……并没有
  rationale: γάρ承接上文并说明理由，译作“因为”；οὐ否定主要动词，译作“并没有”。
- source_word: ἀγγέλοις
  choice: 给天使管辖
  rationale: 本书上下文明确指属天的天使，而非一般使者；与ὑπέταξεν合译，表达置于其权下的意思。
- source_word: ὑπέταξεν
  choice: 交给……管辖
  rationale: 该词表示使某事物服在某权柄之下；此译法在现代汉语中自然，并保留统治和隶属的含义。
- source_word: τὴν οἰκουμένην
  choice: 世界
  rationale: οἰκουμένη本可强调“有人居住的世界”，但本句用“世界”更自然；其较具体的词义以脚注保留。
- source_word: τὴν μέλλουσαν
  choice: 那将要来的
  rationale: μέλλουσαν表示未来、将临；“将要来的”保留末世性的时间指向，不把它限定为某一特定神学时期。
- source_word: περὶ ἧς λαλοῦμεν
  choice: 我们正在谈论的
  rationale: 关系代词ἧς回指“世界”，λαλοῦμεν为现在时；前置为定语符合现代汉语表达，同时保留正在进行的论述意味。
theological_decisions:
- issue: “将要来的世界”所指为何
  choice: 保留为面向未来的“那将要来的世界”
  alternative: 特指福音时代，或泛指现今有人居住的地上世界
  rationale: τὴν οἰκουμένην τὴν μέλλουσαν自然指向将来的世界或世界秩序；译文不进一步界定其具体阶段，以保留希伯来书在诗篇第8篇、人类治理与圣子之间展开的神学张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“交给天使管辖”比直译“置于天使之下”更自然，同时准确传达ὑποτάσσω所含的权柄关系；将末尾关系从句前置，使句子符合汉语语序。
