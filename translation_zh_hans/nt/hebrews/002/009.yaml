revisions:
- from: 不过，我们看见那位暂时比天使低微的耶稣，因受了死亡的苦，已经得了荣耀和尊贵为冠冕，为要使他在上帝以外[a]替每一个人尝到死味。
  to: 不过，我们看见耶稣：他暂时被置于比天使低微的地位；因经历死亡的苦难，他被加冕，得着荣耀和尊贵，为要使他离开上帝[a]，替每一个人尝死味。
  rationale: 修订首先遵循指定的 SBLGNT 正文，将 χωρὶς θεοῦ 译为“离开上帝”，不以英文审计层所采用的 χάριτι θεοῦ 异文取代正文；该异文以脚注保留。句子重组为“我们看见耶稣”后的说明结构，使“暂时被置于比天使低微的地位”“因经历死亡的苦难”“被加冕，得着荣耀和尊贵”及目的从句的关系在中文中清楚可读。
