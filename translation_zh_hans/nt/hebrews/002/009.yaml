    rationale: “为要使他在上帝以外替每一个人尝到死味”在现代汉语中不自然，且“在上帝以外”可被误读为地点或范围状语，不能清楚表达 χωρὶς θεοῦ；需明确目的从句中的行动者是耶稣。
  - severity: medium
    issue: “得了荣耀和尊贵为冠冕”搭配生硬
    rationale: 该表达虽试图保留冠冕意象，却不符合自然中文搭配；“被加冕，得着荣耀和尊贵”既保留 στεφανόω 的意象，也更清晰。
  - severity: low
