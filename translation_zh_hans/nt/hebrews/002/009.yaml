source:
  edition: SBLGNT
  text: τὸν δὲ βραχύ τι παρ’ ἀγγέλους ἠλαττωμένον βλέπομεν Ἰησοῦν διὰ τὸ πάθημα τοῦ θανάτου δόξῃ καὶ τιμῇ ἐστεφανωμένον, ὅπως ⸀χωρὶς θεοῦ ὑπὲρ παντὸς γεύσηται θανάτου.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/009.yaml
  text: But we see Jesus[a], who was made lower than the angels for a little while, crowned with glory and honor because of the suffering of death, so that by the grace of God he might taste death for everyone.
translation:
  language: zh_hans
  text: 不过，我们看见耶稣：他暂时被置于比天使低微的地位；因经历死亡的苦难，他被加冕，得着荣耀和尊贵，为要使他离开上帝[a]，替每一个人尝死味。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些古抄本作“靠着上帝的恩典”。
    reason: textual_variant
lexical_decisions:
- source_word: βραχύ τι
  choice: 暂时
  rationale: 在诗篇第8篇的回响及本句结构中，较适合理解为时间上的短暂，而非程度上的稍低。
- source_word: παρ’ ἀγγέλους
  choice: 比天使
  rationale: παρά加宾格在比较语境中表达“比……”，与ἠλαττωμένον相配。
- source_word: ἠλαττωμένον
  choice: 低微
  rationale: 保留地位被降低的比较含义；结合“暂时”表达其受动及阶段性，同时避免仅理解为内心谦卑。
- source_word: διὰ τὸ πάθημα τοῦ θανάτου
  choice: 因受了死亡的苦
  rationale: διά加宾格在此自然表达原因；中文采用较顺畅的动词结构，同时保留死亡与受苦的紧密关联。
- source_word: δόξῃ καὶ τιμῇ ἐστεφανωμένον
  choice: 已经得了荣耀和尊贵为冠冕
  rationale: 保留στεφανόω的冠冕意象，并以“已经”体现完成时分词所表达的既成状态。
- source_word: ὅπως
  choice: 为要使
  rationale: 保留目的或结果从句的指向，不把两者之间的细微张力完全消除。
- source_word: χωρὶς θεοῦ
  choice: 在上帝以外
  rationale: 严格以所给SBLGNT正文χωρὶς θεοῦ为首要依据，保留其“离开／除……以外”的真实歧义与神学张力；不以咨询层采用的异文覆盖原文正文。
- source_word: ὑπὲρ παντός
  choice: 替每一个人
  rationale: ὑπέρ表达代表或为了某者；παντός为单数、具逐一和普遍意味。上下文以人为主要所指，译作“每一个人”，同时在脚注说明也可理解为“万有”。
- source_word: γεύσηται θανάτου
  choice: 尝到死味
  rationale: 保留γεύομαι的“尝”之比喻，也采用现代中文读者可以理解的传统表达。
theological_decisions:
- issue: 目的从句中的文本异文
  choice: 正文采用“在上帝以外”
  alternative: “靠着上帝的恩典”
  rationale: 所给SBLGNT文本明确为χωρὶς θεοῦ，故源文本优先的译文应据此翻译；χάριτι θεοῦ是重要且广为见证的异文，置于脚注供读者审视，不静默化解其神学张力。
- issue: ὑπὲρ παντός的范围
  choice: 每一个人
  alternative: 万有／每一样事物
  rationale: 上下文更自然指向基督替众人受死，但希腊文παντός本身可为阳性或中性，因此以脚注保留“万有”的可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。正文优先依据所给SBLGNT的χωρὶς θεοῦ，而不沿用英文咨询层以异文入正文的处理。注意：脚注清单含[b]，故正文相应标在“每一个人”之后。
