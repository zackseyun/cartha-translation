source:
  edition: SBLGNT
  text: Ἔπρεπεν γὰρ αὐτῷ, δι’ ὃν τὰ πάντα καὶ δι’ οὗ τὰ πάντα, πολλοὺς υἱοὺς εἰς δόξαν ἀγαγόντα τὸν ἀρχηγὸν τῆς σωτηρίας αὐτῶν διὰ παθημάτων τελειῶσαι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/010.yaml
  text: For it was fitting for him—for whom are all things and through whom are all things—in bringing many sons to glory[d][c][b][a], to perfect the pioneer of their salvation through sufferings.
translation:
  language: zh_hans
  text: 原来，万有都是为他而存在，也都是借着他而存在的；对他来说，在领许多儿子[a]进入荣耀[d]的过程中，借着苦难使他们救恩的开创者[b]达到完全[c]，是合宜的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “许多儿子”保留原文的措辞及其儿子身份、承受产业的意味；这里包括神所有的儿女，并非只指男性。
    reason: lexical_alternative
  - marker: b
    text: “开创者”也可译作“先锋”“领袖”或“创始者”。
    reason: lexical_alternative
  - marker: c
    text: 这里的“达到完全”是指达到预定的目标、完成所受的使命，并不是说他原先有道德缺陷。
    reason: lexical_alternative
  - marker: d
    text: “在领许多儿子进入荣耀的过程中……”也可理解为：“为了领许多儿子进入荣耀，他借着苦难使……”。
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: Ἔπρεπεν
  choice: 这是合宜的
  rationale: 表达未完成时非人称用法所指的适宜、恰当，既保留道德与神学意味，也符合现代汉语。
- source_word: αὐτῷ
  choice: 他
  rationale: 代词在上下文中指神；保留原文的代词表达，并由随后的两个关系分句说明其身份。
- source_word: δι’ ὃν τὰ πάντα καὶ δι’ οὗ τὰ πάντα
  choice: 万有都为他而存在，也都借着他而存在
  rationale: 前一个διά加宾格表示万有以他为终极归向，后一个διά加属格表示万有借他而有；补出“存在”使汉语完整自然。
- source_word: πολλοὺς υἱοὺς
  choice: 许多儿子
  rationale: 保留υἱούς明确的儿子身份及其继承产业的意涵；脚注说明其范围并不限于男性。
- source_word: εἰς δόξαν
  choice: 进入荣耀
  rationale: “进入”保留εἰς所表达的趋向和抵达，“荣耀”则保留本节简洁而浓缩的神学用语。
- source_word: ἀγαγόντα
  choice: 在领……进入……时
  rationale: 将不定过去时分词表达为与主要不定式相联的情境性动作，不擅自改成明确的目的从句；脚注保留句法上的另一种理解。
- source_word: ἀρχηγὸν
  choice: 开创者
  rationale: 兼顾此词“开创、发起”以及带领他人前行的意味；相关的“先锋、领袖、创始者”列于脚注。
- source_word: τῆς σωτηρίας αὐτῶν
  choice: 他们救恩的
  rationale: 自然表达属格关系，并保留救恩与这些“儿子”之间的关联。
- source_word: διὰ παθημάτων
  choice: 借着苦难
  rationale: “借着”保留διά加属格的途径或手段意义；汉语以集合名词“苦难”自然涵盖原文复数所指的受苦经历。
- source_word: τελειῶσαι
  choice: 使……达到完全
  rationale: 表达τελειόω使某人达到预定目标、完成使命的含义，同时避免现代读者误解为纠正道德缺陷。
theological_decisions:
- issue: τελειῶσαι用于救恩的开创者时有何含义
  choice: 使……达到完全
  alternative: 使……完全；使……臻于完备
  rationale: 此词在《希伯来书》中侧重达到预定目标、完成受命的工作；这里不是说他原先有道德缺陷。译文保留“完全”这一书内关键词，同时用“达到”呈现其目标性。
- issue: πολλοὺς υἱοὺς的性别与儿子身份意涵
  choice: 许多儿子
  alternative: 许多儿女；许多孩子
  rationale: 原文明确使用阳性复数“儿子”，并可能呼应儿子身份及承受产业的主题；正文保留这一措辞，脚注说明它包括神所有的儿女。
- issue: ἀγαγόντα与τελειῶσαι的逻辑关系
  choice: 他在领许多儿子进入荣耀时……使……达到完全
  alternative: 为了领许多儿子进入荣耀……使……达到完全
  rationale: 分词可交代主要动作发生的情境或相关过程；原文没有明说目的关系，因此正文不将其限定为“为了”，脚注保留目的性理解的可能。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“万有都为他而存在，也都借着他而存在”保留原文对称、近似信条式的节奏；后半句略作汉语语序调整，但不把分词明确限定为目的关系。
