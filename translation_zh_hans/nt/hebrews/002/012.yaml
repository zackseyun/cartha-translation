base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/012.yaml
  text: saying[a], “I will proclaim your name to my brothers[b]; in the midst of the assembly I will sing praise to you.”
translation:
  language: zh_hans
  text: 说：“我要向我的弟兄[a]宣告你的名；我要在会众中歌颂你。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“弟兄姊妹”；希腊文作“弟兄”，在此语境中可泛指同属信仰群体的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: 说
  rationale: 现在分词在此引出下文引文；译作“说”简洁自然，并保留原文的引述功能。
- source_word: Ἀπαγγελῶ
  choice: 我要……宣告
  rationale: 该动词有公开传报、宣告之意；“宣告”保留其公开而郑重的语气。
- source_word: τὸ ὄνομά σου
  choice: 你的名
  rationale: 按原文直译；“名”在圣经语境中可包含身份、品格与声誉，但正文不作解释性扩展。
- source_word: τοῖς ἀδελφοῖς μου
  choice: 向我的弟兄
  rationale: 保留希腊文阳性复数的亲属称谓；语境可能涵盖整个信徒群体，故以脚注说明其包容性。
- source_word: ἐν μέσῳ
  choice: 在……中
  rationale: 自然表达位于聚集群体当中的意思，同时保持引文庄重的诗歌语气。
- source_word: ἐκκλησίας
  choice: 会众
  rationale: 此处为诗篇引文，指聚集起来的人群；“会众”比“教会”更少带入后期制度性含义，也比“集会”更符合中文敬拜语境。
- source_word: ὑμνήσω
  choice: 我要……歌颂
  rationale: 该动词特指以歌声赞美；“歌颂”简洁自然，并保留音乐性的含义。
- source_word: σε
  choice: 你
  rationale: 作为“歌颂”的宾语，中文直接译为“你”最自然。
theological_decisions:
- issue: ἀδελφοῖς是否采用包含女性的显性译法
  choice: 弟兄
  alternative: 弟兄姊妹
  rationale: 原文使用阳性复数“弟兄”，正文保留其形式及弥赛亚与同属一家之人的亲属意象；同时以脚注说明，在本段语境中所指可能包括所有信徒。
- issue: ἐκκλησία在旧约引文中的译法
  choice: 会众
  alternative: 教会
  rationale: 本节引用诗篇22:22，重点是聚集敬拜的群体，而非明确指后期制度意义上的教会；“会众”既保留集合意义，也符合自然的现代中文。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“宣告”“会众”“歌颂”保留诗篇引文的公开性、群体性和诗歌色彩；句式简洁，并以分号呈现两句平行结构。
