  text: πῶς ἡμεῖς ἐκφευξόμεθα τηλικαύτης ἀμελήσαντες σωτηρίας, ἥτις, ἀρχὴν λαβοῦσα λαλεῖσθαι διὰ τοῦ κυρίου, ὑπὸ τῶν ἀκουσάντων εἰς ἡμᾶς ἐβεβαιώθη,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/003.yaml
  text: How will we escape if we neglect so great a salvation? This salvation[a], having at first been spoken through the Lord, was confirmed to us by those who heard him,
translation:
  language: zh_hans
  text: 如果我们忽略这么大的救恩，又怎能逃脱呢？这救恩[a]最初是借着主传讲的，并由那些听过主的人向我们证实了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这救恩最初开始借着主被传讲，并由那些听过主的人向我们证实了。”
    reason: “最初是……传讲的”自然表达 ἀρχὴν λαβοῦσα λαλεῖσθαι；“开始……被传讲”较明确保留该短语的起始性及被动语态。
lexical_decisions:
- source_word: πῶς ἡμεῖς ἐκφευξόμεθα
  choice: 我们又怎能逃脱呢
  rationale: 保留将来时修辞问句的警告力量，不把它改写成明确的否定陈述；“又”承接上文的比较语境。
- source_word: τηλικαύτης ἀμελήσαντες σωτηρίας
  choice: 如果我们忽略这么大的救恩
  rationale: 将不定过去时分词按语境表达为条件关系；“这么大的”传达 τηλικαύτης 的强调，“救恩”保留 σωτηρία 的拯救与终末含义。
- source_word: ἥτις
  choice: 这救恩
  rationale: 明确回指前面的“救恩”，并体现关系代词在此处的解释性作用。
- source_word: ἀρχὴν λαβοῦσα λαλεῖσθαι
  choice: 起初……传讲
  rationale: 用自然中文表达“开始被说出”的起始意义；“传讲”比生硬的“被说”更符合救恩信息被宣告的语境。
- source_word: διὰ τοῦ κυρίου
  choice: 借着主
  rationale: 保留 διά 加属格所表达的媒介或施事色彩，并将 κύριος 译为传统且具基督论分量的“主”。
- source_word: ὑπὸ τῶν ἀκουσάντων
  choice: 由亲耳听见的人
  rationale: 表达这些人是直接听见主所传之信息的见证者；“亲耳”是由上下文支持的中文明示。
- source_word: εἰς ἡμᾶς ἐβεβαιώθη
  choice: 向我们证实了
  rationale: “向我们”保留信息传至受众的方向性，“证实”准确表达 βεβαιόω 的确认、确立之意。
theological_decisions:
- issue: “主”（τοῦ κυρίου）的指代
  choice: 保留“主”，按上下文指向耶稣
  alternative: 理解为泛指上帝
  rationale: 救恩先借着“主”传讲，继而由听见的人证实，这一见证次序强烈指向耶稣在世的宣讲；译文不额外加入“耶稣”，以保留原文措辞。
- issue: 警告问句的力度
  choice: 保留修辞问句“又怎能逃脱呢”
  alternative: 改为陈述句“我们必不能逃脱”
  rationale: 原文使用将来时疑问形式，暗示无法逃脱，却没有直接改成断言；保留问句可维持其神学张力和劝诫力度。
- issue: ἥτις 从句的句法连接
  choice: 正文重复“这救恩”以形成独立而清楚的中文句子
  alternative: 译作连续关系从句“这救恩起初……并由……”
  rationale: 两种理解所指相同；正文采用自然中文的显性回指，脚注保留更贴近希腊语关系从句结构的译法。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“逃脱”“忽略”“救恩”“证实”兼顾原文形式与中文自然度；避免古奥的“焉能”及过度口语化表达。
