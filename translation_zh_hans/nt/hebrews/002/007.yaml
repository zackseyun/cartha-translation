  text: ἠλάττωσας αὐτὸν βραχύ τι παρ’ ἀγγέλους, δόξῃ καὶ τιμῇ ἐστεφάνωσας ⸀αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/007.yaml
  text: You made him lower than the angels for a little while[a]; you crowned him with glory and honor.
translation:
  language: zh_hans
  text: 你使他暂时比天使低微[a]；你以荣耀和尊贵为他加冕。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你使他比天使稍微低微。”希腊语短语也可表示程度，而不是时间。
    reason: alternative_reading
lexical_decisions:
- source_word: ἠλάττωσας
  choice: 你使……低微
  rationale: 该词为第二人称单数、不定过去时主动直陈语气；与后面的比较结构连用，表达使某人处于较低地位。译作“使……低微”既体现使役义，也符合庄重而自然的现代汉语。
- source_word: αὐτὸν
  choice: 他
  rationale: 保留原文阳性单数代词及其代表性人物的表达，不在本分句中增补原文没有的名词。
- source_word: βραχύ τι
  choice: 暂时
  rationale: 此短语既可指时间短暂，也可指程度稍低。希伯来书当前语境更支持时间义，因此正文译作“暂时”，同时以脚注保留程度义。
- source_word: παρ’ ἀγγέλους
  choice: 比天使
  rationale: παρά加宾格在ἐλαττόω所形成的比较结构中表示比较对象，汉语自然译为“比天使”。
- source_word: δόξῃ
  choice: 荣耀
  rationale: 与στεφανόω连用的与格表示作为冠冕所赋予之物；“荣耀”准确传达δόξα在此处的尊荣含义。
- source_word: τιμῇ
  choice: 尊贵
  rationale: τιμή在此表示被赋予的尊荣和崇高地位；与“荣耀”并列时，“荣耀和尊贵”自然、庄重，并能区分两个近义概念。
- source_word: ἐστεφάνωσας
  choice: 你赐给……作冠冕
  rationale: 该词本义为“给……戴上冠冕”。汉语用“赐给他荣耀和尊贵作冠冕”保留冠冕意象，并清楚表达δόξῃ καὶ τιμῇ所表示的内容。
- source_word: αὐτόν
  choice: 他
  rationale: 保留重复出现的宾语代词，使两个平行分句的结构清楚。
theological_decisions:
- issue: 诗篇第8篇引文中βραχύ τι的含义
  choice: 时间义：“暂时”
  alternative: 程度义：“稍微”或“稍低一点”
  rationale: 希腊语本身容许时间与程度两种理解。希伯来书2章的上下文把耶稣暂时的降卑与随后所得的荣耀相连，因此正文采用时间义；脚注保留程度义，避免消除原文真实存在的诠释张力。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“低微”表达地位较低，而非身材或能力较低；“赐给他荣耀和尊贵作冠冕”保留原文的加冠意象。正文中的[a]与脚注对应。
