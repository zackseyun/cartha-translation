source:
  edition: SBLGNT
  text: Ἐπεὶ οὖν τὰ παιδία κεκοινώνηκεν ⸂αἵματος καὶ σαρκός⸃, καὶ αὐτὸς παραπλησίως μετέσχεν τῶν αὐτῶν, ἵνα διὰ τοῦ θανάτου καταργήσῃ τὸν τὸ κράτος ἔχοντα τοῦ θανάτου, τοῦτ’ ἔστι τὸν διάβολον,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/014.yaml
  text: Therefore[a], since the children share in flesh and blood, he himself likewise partook of the same things, so that through death he might nullify the one who has the power of death—that is, the devil[b],
translation:
  language: zh_hans
  text: 所以，儿女既同有血肉[a]，他自己也同样有分于这些，为要借着死亡使那掌握死亡权势者失去效力[b]，就是魔鬼，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“血和肉”；也可按汉语习惯译作“肉和血”。
    reason: lexical_alternative
  - marker: b
    text: “使……失去效力”也可译作“废掉”或“摧毁”。这个动词可指使之无能为力、失去作用或被废除，不一定表示使其不复存在。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐπεὶ οὖν
  choice: 所以，……既……
  rationale: “所以”保留οὖν承接上文的推论作用，“既”表达ἐπεί在此的原因基础，合乎现代汉语句法。
- source_word: τὰ παιδία
  choice: 儿女
  rationale: 承接上下文中赐给子的“儿女”，既保留亲属语境，也不把所指缩窄为年幼儿童。
- source_word: κεκοινώνηκεν
  choice: 同有
  rationale: 表达共同分享、参与并处于这种共同状态之中；“同有”简洁地保留完成时所呈现的现存结果。
- source_word: αἵματος καὶ σαρκός
  choice: 血和肉
  rationale: 按希腊文次序直译，并明确σάρξ在此指真实的肉身成分，而非“罪性”等引申义。
- source_word: παραπλησίως
  choice: 同样
  rationale: 表达相似方式下的真实参与，同时不擅自将其改写为绝对同一。
- source_word: μετέσχεν τῶν αὐτῶν
  choice: 有分于这些
  rationale: 保留μετέχω“参与、有分”的意义，并用不同于前句“同有”的措辞反映原文动词的变化；“这些”回指血和肉。
- source_word: ἵνα
  choice: 为要
  rationale: 清楚表达目的关系，语体庄重而自然。
- source_word: διὰ τοῦ θανάτου
  choice: 借着死
  rationale: 表达διά加属格所指的途径或手段，不额外加入原文未明说的限定语。
- source_word: καταργήσῃ
  choice: 使……失去效力
  rationale: 体现使之无效、失去作用或权势的语义，避免让读者误以为这里必然指使魔鬼不复存在。
- source_word: τὸν τὸ κράτος ἔχοντα τοῦ θανάτου
  choice: 那掌握死亡权势的
  rationale: κράτος可指权势、威力；此译保留“死亡的权势”这一属格关系，并自然表达其持有者。
- source_word: τοῦτ’ ἔστι
  choice: 就是
  rationale: 自然引出对前述对象的明确说明。
- source_word: τὸν διάβολον
  choice: 魔鬼
  rationale: 按新约中已确立的位格称谓翻译，不采用仅反映词源的“诽谤者”。
theological_decisions:
- issue: 基督对人类血肉的参与
  choice: “他自己也同样有分于这些”
  alternative: “他也和他们一样成了血肉之躯”
  rationale: 所选译法肯定他真实参与血肉，同时保留παραπλησίως及前后不同动词带来的细微张力，不以释义方式加入本节未明说的后期教义表述。
- issue: καταργήσῃ对魔鬼所产生的结果
  choice: “使……失去效力”
  alternative: “废掉”或“摧毁”
  rationale: 该动词可表示使无效、使失去作用或废除；正文避免暗示魔鬼在存在意义上被消灭，同时脚注保留传统而可能的译法。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“所以，……既……”承接前文论证；“同有／有分于”既保持原文两个参与动词的呼应，也保留其措辞差别。句末逗号依照所给经文片段，显示句子在下一节继续。
