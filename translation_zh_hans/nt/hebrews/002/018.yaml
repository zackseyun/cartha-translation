  text: ἐν ᾧ γὰρ πέπονθεν αὐτὸς πειρασθείς, δύναται τοῖς πειραζομένοις βοηθῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/018.yaml
  text: For because he himself suffered when he was tempted[a], he is able to help those who are being tempted.
translation:
  language: zh_hans
  text: 因为他自己在受试探[a]时受过苦，所以能帮助那些正在受试探的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “试探”两处也可译作“考验”：因为他自己在受考验时受过苦，所以能帮助那些正在受考验的人。希腊语动词可按语境表示“试探”或“考验”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ γὰρ
  choice: 因为……既然
  rationale: ἐν ᾧ在这里带因果意味，γὰρ承接上文作解释。中文用“因为……既然”自然表达依据和解释关系，同时避免生硬重复两个因果连词。
- source_word: πέπονθεν
  choice: 受过苦
  rationale: πάσχω的完成时指已经经历的受苦，并且该经历对当前仍有意义；“受过苦”在现代汉语中兼顾完成经历及其持续关联。
- source_word: αὐτὸς
  choice: 他自己
  rationale: 保留代词的强调，突出他亲身经历了这里所说的苦难与试探。
- source_word: πειρασθείς
  choice: 受过试探
  rationale: πειράζω可指“试探”或“考验”。正文采用与希伯来书4:15自然呼应的“试探”，另在脚注保留“考验”这一真实可能。
- source_word: δύναται
  choice: 能
  rationale: 准确表达能力，在现代中文中比“有能力”更简洁自然，语体仍庄重。
- source_word: τοῖς πειραζομένοις
  choice: 那些正在受试探的人
  rationale: 现在分词表示正处于试探或考验中的人；“正在”明确呈现持续中的状态。
- source_word: βοηθῆσαι
  choice: 帮助
  rationale: βοηθέω表示帮助、前来援助；“帮助”清楚自然，而及时援助的意味可由语境传达。
theological_decisions:
- issue: πειράζω用于耶稣和信徒时的含义
  choice: 试探
  alternative: 考验
  rationale: “试探”保留本节与希伯来书4:15的紧密呼应，并不暗示耶稣向罪屈服。由于该希腊词也确可表示“考验”，脚注保留这一译法，不把经文的词义张力静默消除。
- issue: 基督受苦与他帮助受试探者之间的关系
  choice: 将亲身受苦、受试探表达为他能够帮助人的依据
  alternative: 将ἐν ᾧ理解为较严格的范围或处境表达
  rationale: 此处ἐν ᾧ最自然地具有因果功能，说明他亲身经历与其施助能力的关系；译文不进一步界定这种能力在基督论上的本体含义。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“他自己”保留原文强调；“受过”体现已经亲身经历且与当前有关；“正在”传达现在分词的持续状态。脚注标记[a]已置于正文第一次出现“试探”之后，并说明该词在本节两处均可译作“考验”。
