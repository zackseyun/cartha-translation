  text: πάντα ὑπέταξας ὑποκάτω τῶν ποδῶν αὐτοῦ· ἐν ⸂τῷ γὰρ⸃ ⸀ὑποτάξαι τὰ πάντα οὐδὲν ἀφῆκεν αὐτῷ ἀνυπότακτον. νῦν δὲ οὔπω ὁρῶμεν αὐτῷ τὰ πάντα ὑποτεταγμένα·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/008.yaml
  text: You subjected all things under his feet.” For in subjecting all things to him[a], he left nothing not subjected to him[b]. But now we do not yet see all things subjected to him.
translation:
  language: zh_hans
  text: “你使万物都服在他的脚下。”因为在使万物都服在他之下时[a]，他没有留下一样不服在他之下的。可是现在，我们还没有看见万物都服在他之下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里“他的／他”承接诗篇第八篇；在诗篇原有语境中可指人类，而《希伯来书》在此处将这话应用于耶稣。原文这句话也可译作：“因为当他使万物都服在他之下时，他没有留下一样不服在他之下的。”
    reason: 保留代词所指在诗篇原意与《希伯来书》应用之间的张力，并说明ἐν τῷ ... ὑποτάξαι可作时间性理解。
lexical_decisions:
- source_word: πάντα
  choice: 万物
  rationale: 中性复数，范围全面；“万物”简洁庄重，也适合本节关于普遍统辖的语境。
- source_word: ὑπέταξας
  choice: 你使……服在
  rationale: 保留使役和归服、受辖制的语义，并与本节同一词根的重复相呼应。
- source_word: ὑποκάτω τῶν ποδῶν αὐτοῦ
  choice: 在他的脚下
  rationale: 这是表达统治与归服的圣经惯用语，也保留诗篇第八篇的呼应。
- source_word: ἐν τῷ ... ὑποτάξαι
  choice: 既然使……服在
  rationale: 该结构可表达时间或情境；此处译为“既然”自然地引出这一行动所包含的逻辑结论，同时在脚注保留时间性译法。
- source_word: γὰρ
  choice: 既然
  rationale: 与不定式结构合译，承接引文并解释其全面含义。
- source_word: οὐδὲν ἀφῆκεν
  choice: 就没有留下一样
  rationale: 自然表达希腊文“没有留下任何事物”的全面否定。
- source_word: ἀνυπότακτον
  choice: 不服他的
  rationale: 清楚表达“未归服、未受辖制”，并避免生硬的名词化措辞。
- source_word: νῦν δὲ
  choice: 可是现在
  rationale: 鲜明标示经文宣告与当前所见之间的对照。
- source_word: οὔπω ὁρῶμεν
  choice: 我们还没有看见
  rationale: 准确表达当前尚未看见的状态，并保留“尚未”的末世张力。
- source_word: ὑποτεταγμένα
  choice: 都服在他之下
  rationale: 完成时被动分词强调归服后的状态；汉语以“都服在他之下”自然表达这一结果状态。
theological_decisions:
- issue: αὐτοῦ / αὐτῷ（“他的／他”）所指为何
  choice: 正文保留第三人称代词“他”，不明确限定所指，并加脚注说明。
  alternative: 直接译明为“人类”或“耶稣”。
  rationale: 本节正在解释诗篇第八篇；诗篇原有语境可指人类，而《希伯来书》的论证又将其集中应用于耶稣。保留代词可避免过早消解这层有意的神学张力。
- issue: 万物归服与当前经验之间的关系
  choice: 以“可是现在……还没有”保留已经宣告却尚未完全可见的张力。
  alternative: 将后半句解释为万物尚未实际归服。
  rationale: 原文一方面肯定没有任何事物被排除在归服之外，另一方面说当前尚未看见万物处于归服状态；译文不替作者消解两者之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话；以“服在……之下／脚下”贯穿ὑποτάσσω词组，既保留词汇重复，也维持诗篇引文的统治意象。正文中的脚注标记[a]与脚注完全对应。
