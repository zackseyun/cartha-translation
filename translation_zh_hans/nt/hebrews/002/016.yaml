base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/016.yaml
  text: For surely it is not angels that he helps[a], but the offspring of Abraham.
translation:
  language: zh_hans
  text: 因为他所援助的，显然不是天使，而是亚伯拉罕的后裔。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “援助”或译“抓住”。希腊语动词的字面意思可以是“抓住”，但在这里很可能指伸手帮助或施以援救。
    reason: lexical_alternative
lexical_decisions:
- source_word: δήπου
  choice: 显然
  rationale: 该词带有强调而又诉诸听者共识的推论语气；“显然”自然表达“这当然是明白的”这一意味，而不把语气写得过重。
- source_word: ἀγγέλων
  choice: 天使
  rationale: 这是该词在此处直接、通行的对应词；属格形式标明与“亚伯拉罕的后裔”相对照的对象。
- source_word: ἐπιλαμβάνεται
  choice: 援助
  rationale: 该动词本义可指“抓住”，在此语境中更可能指伸手相助、施以救援。“援助”既符合上下文中圣子拯救人的行动，也保留了比泛泛的“帮助”更强的施援意味。
- source_word: σπέρματος Ἀβραὰμ
  choice: 亚伯拉罕的后裔
  rationale: σπέρμα在此为集合性单数，可指后代或子孙；“后裔”在现代汉语中自然庄重，也不必把其所指范围解释得过细。
- source_word: οὐ γὰρ ... ἀλλὰ
  choice: 因为……不是……而是……
  rationale: 用“不是……而是……”清楚保留原文的强烈对照；“因为”承接上文的论证关系。
theological_decisions:
- issue: ἐπιλαμβάνεται如何描述基督的救赎行动
  choice: 正文译作“援助”，表示圣子所援助的是亚伯拉罕的后裔，而不是天使。
  alternative: 译作“抓住”或“扶持”，从较字面的意义理解，并可能使人联想到圣子取了人性。
  rationale: 上下文强调圣子与人认同并施行拯救，习语性的“援助”较切合论证；但“抓住”的字面义及其神学解释具有翻译传统上的重要性，因此在脚注中保留，不在正文中完全消除这一张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“显然”表达δήπου诉诸共同认知的强调语气；“后裔”保留集合性含义。脚注标记置于整句末尾，所注释的是句中重复出现而统一译为“援助”的动词。
