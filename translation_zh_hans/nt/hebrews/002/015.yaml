  yaml_path: translation/nt/hebrews/002/015.yaml
  text: and free those who[a], through fear of death, were subject to slavery all their lives.
translation:
  language: zh_hans
  text: 并释放那些因惧怕死亡而终生受奴役的人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“终生被奴役”或“终生处于奴役之中”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπαλλάξῃ
  choice: 释放
  rationale: 该动词表示使人脱离某种处境或束缚。“释放”简洁自然，也与下文“受奴役”形成清楚对应。
- source_word: τούτους, ὅσοι
  choice: 那些……的人
  rationale: 合并处理指示代词和关系代词，符合现代汉语表达，同时保留其涵盖所有具有下述处境之人的类别性含义。
- source_word: φόβῳ θανάτου
  choice: 因怕死
  rationale: φόβῳ可表达原因、手段或支配性的处境。“因怕死”在汉语中自然，并保留死亡恐惧导致或维系奴役状态的含义。
- source_word: διὰ παντὸς τοῦ ζῆν
  choice: 一生
  rationale: 该短语指整个活着的时期；“一生”准确、凝练地表达持续终身的时间范围。
- source_word: ἔνοχοι ἦσαν δουλείας
  choice: 受奴役
  rationale: ἔνοχος与δουλεία连用，描述处于奴役的约束之下，而不只是可能遭受奴役。“受奴役”保留实际受制的力度，也符合现代汉语。
- source_word: καὶ
  choice: 并
  rationale: 承接上一节的目的或结果陈述；“并”能自然连接两个并列的行动。
theological_decisions:
- issue: 奴役状态的具体性质
  choice: 译作笼统而真实的“受奴役”，不在正文中限定奴役对象或机制。
  alternative: 明确译成受魔鬼奴役、受罪奴役，或仅指人在必死处境中的生存焦虑。
  rationale: 上文提到掌握死亡权势的魔鬼，但本节本身只说人因怕死而处于奴役之下。译文保留这种神学张力，不加入原文未明说的限定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“怕死”比“对死亡的恐惧”更简洁自然，又没有削弱原文；“受奴役”保留δουλεία强烈而具体的奴役意象。
