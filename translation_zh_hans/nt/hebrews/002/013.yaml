  text: καὶ πάλιν· Ἐγὼ ἔσομαι πεποιθὼς ἐπ’ αὐτῷ· καὶ πάλιν· Ἰδοὺ ἐγὼ καὶ τὰ παιδία ἅ μοι ἔδωκεν ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/013.yaml
  text: And again[a], “I will put my trust in him.” And again, “Behold[d][c][b], I and the children whom God has given me.”
translation:
  language: zh_hans
  text: 又说：“我要信靠他。”[a]又说：“看哪，我和上帝所赐给我的儿女。”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较直译可作：“我必一直信赖他”或“我必对他有信心。”
    reason: lexical_alternative
  - marker: b
    text: 本节希腊文没有说明说话者是谁；按上下文，《希伯来书》把这些引文应用于子。
    reason: cross_reference
lexical_decisions:
- source_word: καὶ πάλιν
  choice: 又说
  rationale: 这是引出另一处引文的公式。希腊文直译为“又”，没有明说“说”；但现代汉语单用“又”不易自然引出直接引语，因此补出引语功能所含的“说”，没有指明说话者。
- source_word: Ἐγὼ ἔσομαι πεποιθὼς ἐπ’ αὐτῷ
  choice: 我要信靠他
  rationale: ἔσομαι与完成时分词πεποιθὼς构成迂说结构，表达持续或坚定的信赖状态。“我要信靠他”自然、简洁，也保留面向未来的语气。
- source_word: Ἰδοὺ
  choice: 看哪
  rationale: 保留引文中引人注意的指示语及庄重语气；“看哪”在现代中文圣经文体中清楚且自然。
- source_word: τὰ παιδία
  choice: 儿女
  rationale: 此处强调说话者与这些孩子的关系；“儿女”比“孩子们”更能自然表达这种关系，同时不额外限定年龄。
- source_word: ἅ μοι ἔδωκεν ὁ θεός
  choice: 上帝所赐给我的
  rationale: 按自然汉语调整词序。ἔδωκεν是不定过去时，基本表达“赐给”这一完整行动；“所赐给我的”在定语结构中不强行加入汉语体貌标记，也保留其现今相关性。
- source_word: ὁ θεός
  choice: 上帝
  rationale: 采用现代标准普通话中庄重而通行的θεός译法，不另行体现希腊文冠词。
theological_decisions:
- issue: 引文的基督论说话者
  choice: 正文保留第一人称引文，不点明说话者身份
  alternative: 译作“他又说”或“弥赛亚又说”
  rationale: 本节希腊文只有“又”，没有明确命名说话者。上下文将这些话应用于子，但正文不应把这一语境判断添加成原文没有的称谓。
- issue: “我和儿女”的呈现方式
  choice: 译作“我和……儿女都在这里”
  alternative: 较形式地译作“看哪，我和……儿女”
  rationale: 原文Ἰδοὺ后接名词短语，省略了汉语通常需要的述语。“都在这里”使句子自然完整，并表达“看哪”所呈现的在场情景，不改变儿女由上帝赐予的关系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“又说”自然标示连续引文，但不擅自补明说话者；“看哪”保留引文的修辞力度。正文中的脚注标记均与脚注对应。
