  text: For this reason[a], we must pay much closer attention to what we have heard, lest we drift away.
translation:
  language: zh_hans
  text: 因此，我们必须越发留心所听见的，免得我们随流漂走[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“免得我们从所听见的旁边漂过去”，也可理解为“免得让所听见的从我们这里溜走”。希腊语动词παραρυῶμεν带有漂流、滑过或流失的意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: 因此
  rationale: 自然表达由前文推出本节劝勉的因果和推论关系。
- source_word: δεῖ
  choice: 必须
  rationale: 保留原文明确而有力的必要性；与ἡμᾶς结合译为“我们必须”。
- source_word: περισσοτέρως
  choice: 越发
  rationale: 保留比较和加强语气，表明因前述启示而更应当留心。
- source_word: προσέχειν ἡμᾶς
  choice: 我们必须……留心
  rationale: “留心”是现代汉语中自然、庄重的表达，传达专注听从之意，而不额外加入“持守”等解释。
- source_word: τοῖς ἀκουσθεῖσιν
  choice: 所听见的
  rationale: 保留原文对已听见之内容的概括，不擅自明确为“信息”或“福音”，并体现其持续相关性。
- source_word: μήποτε
  choice: 免得
  rationale: 准确引出可能发生的负面结果和警戒。
- source_word: παραρυῶμεν
  choice: 随流失去
  rationale: 保留动词所含漂流、从旁滑过的生动意象，也使主语仍是“我们”；脚注交代其可能的其他理解。
theological_decisions:
- issue: παραρυῶμεν所表达的警告意象
  choice: 译为“免得随流失去”，将危险理解为听者渐渐漂离所听见的内容。
  alternative: 也可理解为“免得从它旁边漂过去”，或“免得让所听见的从我们这里溜走”。
  rationale: 原词带有漂流、滑过或流失的意象，语法和上下文较支持听者发生危险的偏离，但并不完全排除信息从人手中溜走的理解；正文保留意象，脚注保存歧义，不借此裁定特定的背道教义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“越发留心”兼顾劝勉力度与自然表达；“随流失去”保留原文水流般渐渐偏离的比喻，避免用抽象神学术语消解警告的张力。
