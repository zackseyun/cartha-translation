  rationale: 修订消除了不自然的重复连接，采用“每一次违犯”准确表达 παράβασις，并调整“确定有效”的措辞以符合现代庄重汉语。正文仍保留“那借着天使所传的话”的含蓄说法，不将其直接等同于律法；句末逗号保留，反映本节与下一节相连的未完论证。
