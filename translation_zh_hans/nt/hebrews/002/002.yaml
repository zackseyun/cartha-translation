  text: εἰ γὰρ ὁ δι’ ἀγγέλων λαληθεὶς λόγος ἐγένετο βέβαιος, καὶ πᾶσα παράβασις καὶ παρακοὴ ἔλαβεν ἔνδικον μισθαποδοσίαν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/002.yaml
  text: For if the message spoken through angels proved firm[a], and every transgression and disobedience received a just penalty[b],
translation:
  language: zh_hans
  text: 既然那借着天使所传的话是确定有效的，并且每一次违犯和不听从都得到了公正的报偿，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δι’ ἀγγέλων λαληθεὶς λόγος
  choice: 那借着天使所传的话
  rationale: λόγος在这里指传达出来的信息；译作“话”既贴近原文，也不在正文中直接认定为律法。διά加属格表示媒介或施行者，译作“借着天使”；λαληθείς译作“所传”，比生硬的“所说”更符合现代汉语。
- source_word: ἀγγέλων
  choice: 天使
  rationale: 上下文及犹太传统表明所指最可能是属天的天使，而非普通使者。
- source_word: ἐγένετο βέβαιος
  choice: 确立有效
  rationale: 该表达表示这话被确立为稳固、有效并具有约束力；“确立有效”保留结果性和法律语境，又不缩减为单纯的“证明可靠”。
- source_word: πᾶσα παράβασις
  choice: 一切越界
  rationale: παράβασις本义是越过规定的界限，指违犯命令；“越界”保留其形象和法律意味，并与下文“不听从”有所区分。
- source_word: παρακοὴ
  choice: 不听从
  rationale: παρακοή含有不肯听或未予听从而导致悖逆的意味；“不听从”保留其听觉词源及道德含义。
- source_word: ἔλαβεν
  choice: 受到了
  rationale: 按汉语习惯用“受到报应”表达原文“领受报偿”的司法性结果，同时保持每一种行为为主语。
- source_word: ἔνδικον μισθαποδοσίαν
  choice: 公正的报应
  rationale: ἔνδικος表示合乎公义、罪有应得，μισθαποδοσία表示报偿或偿还；“公正的报应”兼顾司法惩罚和按行为回报之义，脚注保留较宽的词义选择。
theological_decisions:
- issue: “借着天使所传的话”的所指
  choice: 正文保留为“那借着天使所传的话”，不直接增译为“律法”
  alternative: 明确译作“借着天使颁布的律法”或理解为更广泛的天使信息
  rationale: 上下文很可能暗指由天使居间传递的西奈律法传统，但希腊文只说“话”；正文保留原有含蓄，脚注说明其可能所指。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“确立有效”表达信息稳固且具有约束力；“越界”和“不听从”保留两个希腊名词之间的差别。句末逗号保留本节作为下一节条件句前件的未完结构。
