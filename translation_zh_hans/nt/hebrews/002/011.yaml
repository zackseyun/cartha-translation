  text: ὅ τε γὰρ ἁγιάζων καὶ οἱ ἁγιαζόμενοι ἐξ ἑνὸς πάντες· δι’ ἣν αἰτίαν οὐκ ἐπαισχύνεται ἀδελφοὺς αὐτοὺς καλεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/011.yaml
  text: For both the one who sanctifies and those who are being sanctified are all from one[a]; for this reason he is not ashamed to call them brothers[b],
translation:
  language: zh_hans
  text: 因为那使人成圣的和那些正在被成圣的，都同出于一[a]。正因如此，他不以称他们为弟兄[b]为耻，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“都出于同一位父”“都出于同一源头”或“都出于同一祖先”。希腊原文没有说明“一”具体指谁或何者。
    reason: alternative_reading
  - marker: b
    text: “弟兄”译自阳性复数 ἀδελφοὺς；按本段语境，这个称呼可能泛指包括女性在内的整个信徒群体。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἁγιάζων
  choice: 那使人成圣的
  rationale: 将现在时主动分词作名词使用的结构译出；“使人成圣”既保留新约中较固定的神学用语，也清楚表达主动施行成圣的含义。
- source_word: οἱ ἁγιαζόμενοι
  choice: 那些正在被成圣的
  rationale: 保留现在时被动分词所呈现的持续过程或进行中的状态，并与前面的“使人成圣”保持词汇对应。
- source_word: ἐξ ἑνὸς
  choice: 都是出于一位
  rationale: 原文没有明说“一位”所指为何者；“出于一位”在中文中保留了这一省略与神学开放性，没有擅自补成“同一位父”或“同一祖先”。
- source_word: πάντες
  choice: 都是
  rationale: 自然补出希腊文省略的系词，同时强调使人成圣者与被成圣者无一例外地共同“出于一位”。
- source_word: δι’ ἣν αἰτίαν
  choice: 正因如此
  rationale: 自然表达前句作为后句根据或原因的关系；“正”适度体现论述上的强调。
- source_word: οὐκ ἐπαισχύνεται
  choice: 不以……为耻
  rationale: 这是现代中文中自然且庄重的表达，保留原词涉及羞耻与荣辱的语义。
- source_word: ἀδελφοὺς
  choice: 弟兄
  rationale: 保留阳性复数亲属称谓及圣经语体；在本语境中可能涵盖整个信徒群体，包括女性，故以脚注说明。
- source_word: καλεῖν
  choice: 称……为
  rationale: 配合“不以……为耻”构成自然中文句式，准确表达将他们称作弟兄。
theological_decisions:
- issue: “他”的身份与“出于一位”中“一位”的所指
  choice: 正文依上下文以“他”指使人成圣的圣子，但不明说“出于一位”所指为何者。
  alternative: 可明确译为“出于同一位父”“出于同一源头”或“出于同一祖先”。
  rationale: 上下文足以使“他”指向圣子或耶稣；然而 ἐξ ἑνὸς 本身没有说明“一位”是神、父、某位祖先，还是共同源头。因此正文保留原文的含混，不替作者消解神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“那使人成圣的”与“那些正在被成圣的”形成清楚平行；保留“一位”的指称含混。结尾逗号依所给经文片段保留其与下一节引文相连的句法走向。
