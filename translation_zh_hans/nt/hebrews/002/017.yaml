  text: ὅθεν ὤφειλεν κατὰ πάντα τοῖς ἀδελφοῖς ὁμοιωθῆναι, ἵνα ἐλεήμων γένηται καὶ πιστὸς ἀρχιερεὺς τὰ πρὸς τὸν θεόν, εἰς τὸ ἱλάσκεσθαι τὰς ἁμαρτίας τοῦ λαοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/017.yaml
  text: Therefore he had to become like his brothers in every respect[a], so that he might become a merciful and faithful high priest in the things pertaining to God[b], to make atonement for the sins of the people.
translation:
  language: zh_hans
  text: 所以，他必须在各方面都和他的弟兄一样[a]，为要在与上帝有关的事上成为慈悲忠信的大祭司，好为百姓的罪施行赎罪[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他的弟兄姊妹”。希腊文直译为“弟兄”，这里的阳性复数亲属称谓按上下文可以包括更广泛的信徒家庭。
    reason: lexical_alternative
  - marker: b
    text: 也可理解为“除去百姓的罪”或“平息因百姓的罪而有的忿怒”。原词可以涵盖这些赎罪层面的含义。
    reason: alternative_reading
lexical_decisions:
- source_word: ὅθεν
  choice: 所以
  rationale: 承接上文并引出推论，简洁自然地保留逻辑关系。
- source_word: ὤφειλεν
  choice: 必须
  rationale: 表达源文中的必要性和义务性，同时不暗示违背其意愿的外在强迫。
- source_word: κατὰ πάντα
  choice: 在各方面
  rationale: 自然表达相似范围的全面性。
- source_word: τοῖς ἀδελφοῖς
  choice: 他的弟兄
  rationale: 保留希腊文阳性复数亲属称谓及上下文中的家族意象；其可包含更广泛信徒群体的含义由脚注说明。
- source_word: ὁμοιωθῆναι
  choice: 和……一样
  rationale: 以自然现代汉语表达‘成为相似’；结合‘必须’可清楚传达不定式关系。
- source_word: ἵνα
  choice: 为要
  rationale: 明确表达目的关系，并保持庄重流畅。
- source_word: ἐλεήμων
  choice: 慈悲
  rationale: 准确表达怜悯人的品质，也适合祭司语境。
- source_word: πιστὸς
  choice: 忠信
  rationale: 兼顾忠诚与可靠的语义，适合描述履行祭司职分。
- source_word: ἀρχιερεὺς
  choice: 大祭司
  rationale: 这是该祭司职衔在中文圣经语境中的标准、清楚译法。
- source_word: τὰ πρὸς τὸν θεόν
  choice: 在与上帝有关的事上
  rationale: 保留原文较宽泛的祭司性表达，不把它过度限定为单一行为。
- source_word: εἰς τὸ ἱλάσκεσθαι
  choice: 好……献上赎罪祭
  rationale: 在祭司语境中以普通读者易懂的方式表达为罪施行赎罪的行动；脚注保留‘除罪／平息忿怒’之间的语义张力。
- source_word: τὰς ἁμαρτίας τοῦ λαοῦ
  choice: 百姓的罪
  rationale: 直接、自然地表达赎罪行动所针对的对象。
theological_decisions:
- issue: ἱλάσκεσθαι 在赎罪语境中的译法
  choice: 好为百姓的罪献上赎罪祭
  alternative: 好除去百姓的罪；好平息因百姓的罪而有的忿怒
  rationale: 主文采用可读且符合大祭司语境的概括性表达，不预先裁定该词重点在除罪还是平息忿怒；两种常见语义侧重均在脚注中保留。
- issue: ἀδελφοῖς 的性别与群体范围
  choice: 他的弟兄
  alternative: 他的弟兄姊妹
  rationale: 主文保留原文阳性复数亲属称谓及其代表性用法，同时以脚注说明在上下文中可能涵盖整个信徒家庭。
- issue: ὤφειλεν 所表达的必要性
  choice: 必须
  alternative: 有义务；有必要
  rationale: 保留救赎使命中的真实必要性，却不进一步界定这种必要性的形而上或外在性质。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“与上帝有关的事”保留原文祭司职分表达的宽度；“慈悲忠信”简洁并列，符合经文语体。所有脚注标记均已置于主文相应位置。
