  text: προσερχώμεθα οὖν μετὰ παρρησίας τῷ θρόνῳ τῆς χάριτος, ἵνα λάβωμεν ἔλεος καὶ χάριν εὕρωμεν εἰς εὔκαιρον βοήθειαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/016.yaml
  text: Therefore[a], let us approach the throne of grace with boldness[b], so that we may receive mercy and find grace for timely help.
translation:
  language: zh_hans
  text: 所以，让我们坦然无惧地[a]来到恩典的宝座前，为要领受怜悯，寻得恩典，得到及时的帮助[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“满有信心地”或“放胆地”。希腊语兼有确信、坦然和自由进前的意味。
    reason: lexical_alternative
  - marker: b
    text: 或译：“在需要的时候得到帮助”。原文更直接强调帮助来得适时。
    reason: lexical_alternative
lexical_decisions:
- source_word: προσερχώμεθα
  choice: 我们只管……来到……前
  rationale: 现在时中间语态虚拟式在此用于劝勉。“来到……前”自然表达向宝座进前的动作；“只管”加强共同劝勉的语气，但不表示轻率或僭越。
- source_word: οὖν
  choice: 所以
  rationale: 承接上文耶稣作为大祭司的论述，清楚表达推论关系，也符合现代汉语习惯。
- source_word: μετὰ παρρησίας
  choice: 坦然无惧地
  rationale: παρρησία兼有放胆、坦然和确信的意味。“坦然无惧”保留其强烈的自由进前之意，同时避免被误解为傲慢冒失。
- source_word: τῷ θρόνῳ τῆς χάριτος
  choice: 恩典的宝座
  rationale: 按属格结构直译，保留“宝座”意象及“恩典”与宝座之间未被进一步限定的关系，避免用“施恩的宝座”提前解释该属格。
- source_word: ἵνα
  choice: 好让
  rationale: 自然地表达目的，保留“来到宝座前”与随后所要领受之事的目的关系。
- source_word: λάβωμεν ἔλεος
  choice: 我们领受怜悯
  rationale: λαμβάνω通常指领受，ἔλεος译为“怜悯”，准确而自然。
- source_word: χάριν εὕρωμεν
  choice: 寻得恩典
  rationale: 分别保留原文“怜悯”是领受的、“恩典”是寻得的措辞；χάρις译为“恩典”，也维持本节关键词的呼应。
- source_word: εἰς εὔκαιρον βοήθειαν
  choice: 得到及时的帮助
  rationale: εὔκαιρος强调适时、恰逢其时，βοήθεια指帮助。“及时的帮助”简洁自然，并把重点放在帮助来得正是时候。
theological_decisions:
- issue: παρρησία所表达的进到上帝面前的态度
  choice: 坦然无惧地
  alternative: 满有信心地；放胆地
  rationale: 该词既涉及确信，也涉及自由、无所畏惧地进前。“坦然无惧”保留较强的语气，却不暗示人可凭自己僭越地来到上帝面前。
- issue: χάρις在后半句的译法
  choice: 恩典
  alternative: 恩惠
  rationale: “恩典”准确表达上帝所赐的恩惠，并保留本节“恩典的宝座”与“寻得恩典”之间的词语呼应。
- issue: τῆς χάριτος的属格关系
  choice: 恩典的宝座
  alternative: 施恩的宝座
  rationale: 原文未明确限定为“施予恩典的宝座”还是“以恩典为特征的宝座”；采用较形式对应的表达，以保留这一开放性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“恩典的宝座”保留原文意象与属格的开放性；“坦然无惧”保持劝勉力度。两个脚注标记均紧随其所说明的词语。
