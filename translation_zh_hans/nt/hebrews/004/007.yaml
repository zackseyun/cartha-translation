  naturalness: 整体庄重、通顺，适合现代标准汉语。将引文中的禁令改为“不要使你们的心刚硬”，比“不要硬着心”稍正式，但仍自然，并更贴合经文的公共书面语体。
  terminology: “指定”“今天”“借着大卫”“声音”均恰当。“刚硬”是表达σκληρύνω及“心”这一圣经人论意象的规范而清晰的用语；不将“听见”解释为“顺服”。
