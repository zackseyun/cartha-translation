source:
  edition: SBLGNT
  text: πάλιν τινὰ ὁρίζει ἡμέραν, Σήμερον, ἐν Δαυὶδ λέγων μετὰ τοσοῦτον χρόνον, καθὼς ⸀προείρηται, Σήμερον ἐὰν τῆς φωνῆς αὐτοῦ ἀκούσητε, μὴ σκληρύνητε τὰς καρδίας ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/007.yaml
  text: 'Again he appoints a certain day[a], “Today,” saying through David after so long a time, just as has been said before: “Today, if you hear his voice, do not harden your hearts.”'
translation:
  language: zh_hans
  text: '他又指定了一个日子，就是“今天”；过了这么久，他借着大卫说，正如先前所说的：


    “今天，你们若听见他的声音，


    不要使你们的心刚硬。”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάλιν
  choice: 又
  rationale: 承接并推进前文论证，表明上帝再次指定一个日子；“又”在现代汉语中简洁自然。
- source_word: τινὰ ἡμέραν
  choice: 一个日子
  rationale: 保留不定代词所表达的“某个特定日子”，下文随即以“今天”加以说明；汉语中译作“一个日子”比“某一个日子”更自然。
- source_word: ὁρίζει
  choice: 指定
  rationale: 表达权威地划定、确定之意，又不额外解释这个日子的性质。
- source_word: Σήμερον
  choice: 今天
  rationale: 保留诗篇引文中这个日子的名称及其当下呼召力，不将其局限为普通的日历日期。
- source_word: ἐν Δαυὶδ λέγων
  choice: 他借着大卫说
  rationale: 自然表达上帝以大卫为传话者的意思，同时用脚注保留“在大卫篇中说”这一可能理解。
- source_word: μετὰ τοσοῦτον χρόνον
  choice: 过了这么久
  rationale: 准确表达相隔很长时间，符合现代汉语习惯，也保留原文的强调。
- source_word: καθὼς προείρηται
  choice: 正如先前所说的
  rationale: 体现完成时被动语态所指的先前陈述及其持续相关性。
- source_word: ἐὰν τῆς φωνῆς αὐτοῦ ἀκούσητε
  choice: 你们若听见他的声音
  rationale: 保留“听见声音”的圣经意象及条件语气，不直接释义为“顺服”，从而避免消除听见与回应之间的张力。
- source_word: μὴ σκληρύνητε τὰς καρδίας ὑμῶν
  choice: 就不要硬着心
  rationale: 以自然、庄重的现代汉语表达禁令；“心”保留原文有关内在意志与态度的整体意象。
theological_decisions:
- issue: “今天”在进入上帝安息之论证中的含义
  choice: 译为“今天”，让它既指上帝所指定的回应时机，也保留其当下呼召力。
  alternative: 仅理解为诗篇作者发言的历史日期，或专门限定为末世的一日。
  rationale: 本节强调在旷野世代之后很久，上帝仍指定“今天”；译文不把它系统化为单一时间观。
- issue: ἐν Δαυὶδ 的含义
  choice: 正文译为“借着大卫说”。
  alternative: 译为“在大卫篇中说”，把它理解为在与大卫有关的诗篇或文集之中。
  rationale: “借着大卫”在汉语中清楚表达上帝藉人发言，但原短语也可能是文献定位，因此以脚注保存这一歧义，不对诗篇作者身份作超出原文的断言。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。引文分行呈现以突出诗篇劝诫；使用“硬着心”保留传统圣经意象，同时避免生硬的“使你们的心刚硬”。
