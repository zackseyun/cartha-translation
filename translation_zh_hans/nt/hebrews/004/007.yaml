  to: '他又指定了一个日子，就是“今天”；过了这么久，他借着大卫说，正如先前所说的：


    “今天，你们若听见他的声音，


    不要使你们的心刚硬。”'
  rationale: 仅作两项安全的措辞修订：在引文中明确“你们的心”并以“刚硬”贴近原文的心之意象；将脚注的“大卫篇”改为更自然、清楚的现代汉语。经文仍保留“今天”的修辞与神学开放性，也保留“借着大卫”的正文理解及其替代性文献定位。
