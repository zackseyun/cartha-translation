  text: καὶ οὐκ ἔστιν κτίσις ἀφανὴς ἐνώπιον αὐτοῦ, πάντα δὲ γυμνὰ καὶ τετραχηλισμένα τοῖς ὀφθαλμοῖς αὐτοῦ, πρὸς ὃν ἡμῖν ὁ λόγος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/013.yaml
  text: And no creature is hidden from his sight[a], but all things are naked and laid bare to his eyes[b], to whom we must give account.
translation:
  language: zh_hans
  text: 在他面前，没有一个受造之物能隐藏；万物在他眼前都是赤裸并完全显露的[a]；我们必须向他交账[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 译作“完全显露”的词来自一个罕见的希腊语动词，可能带有颈部被露出或向后仰的意象，强调在上帝面前彻底暴露。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近似“我们的话／事情是向着他的”，也可理解为“我们所要面对的是他”。
    reason: alternative_reading
lexical_decisions:
- source_word: κτίσις
  choice: 受造之物
  rationale: 单数在此作概括性用法，指任何受造的存在；“受造之物”既保留其受造性，也比“受造物”略显自然庄重。
- source_word: ἀφανὴς
  choice: 能隐藏
  rationale: 上下文强调没有什么能躲过上帝的鉴察，并非讨论本体上的不可见；结合否定结构译为“没有……能隐藏”符合现代汉语。
- source_word: ἐνώπιον αὐτοῦ
  choice: 在他面前
  rationale: 保留希腊语“在他面前”的空间与关系意象，下一分句的“在他眼前”进一步明确鉴察主题。
- source_word: πάντα
  choice: 万物
  rationale: 简洁而全面地表达中性复数的广泛范围，语体庄重。
- source_word: γυμνὰ
  choice: 赤裸
  rationale: 直接保留完全无遮蔽的鲜明比喻。
- source_word: τετραχηλισμένα
  choice: 完全显露
  rationale: 这个罕见的完成时被动分词强调已经处于彻底暴露的状态；正文采用清楚自然的表达，同时在脚注保留可能涉及颈项外露或后仰的具体意象。
- source_word: τοῖς ὀφθαλμοῖς αὐτοῦ
  choice: 在他眼前
  rationale: 自然表达万物暴露于他的目光之下，并保留原文关于“眼睛”的具体措辞。
- source_word: πρὸς ὃν ἡμῖν ὁ λόγος
  choice: 我们必须向他交账
  rationale: 这一压缩的习语可表达人在上帝面前负有交代、陈明之责；“交账”清楚传达审察与责任的语境，同时以脚注保留较字面的其他理解。
theological_decisions:
- issue: πρὸς ὃν ἡμῖν ὁ λόγος 的解释
  choice: 我们必须向他交账
  alternative: 我们所要面对的是他；或：我们的话／事情是向着他的
  rationale: 4:12—13强调上帝洞察并审察一切，因此“交账”自然传达警告中的责任意味；但原文表达简练且存在语义幅度，脚注列出更贴近字面的可能理解，避免把歧义完全抹平。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“赤裸、完全显露”保留原文强烈的暴露意象；“交账”比“交代”更明确表达 accountability，但不扩展为特定审判体系。所有脚注标记均置于正文对应位置。
