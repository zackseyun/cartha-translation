- from: 所以，既然我们有一位伟大的大祭司，已经穿越诸天[a]——就是上帝的儿子耶稣——就让我们坚守所宣认的信仰。
  to: 所以，既然我们有一位伟大的大祭司，已经穿越诸天[a]——耶稣，上帝的儿子——就让我们坚守我们的宣认。
  rationale: 修订仅处理两处：以“耶稣，上帝的儿子”清楚呈现原文同位语；以“我们的宣认”避免在τῆς ὁμολογίας中补入“信仰”并将其限缩为认信内容。其余措辞及脚注均可保留。
