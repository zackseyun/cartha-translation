  text: Ἔχοντες οὖν ἀρχιερέα μέγαν διεληλυθότα τοὺς οὐρανούς, Ἰησοῦν τὸν υἱὸν τοῦ θεοῦ, κρατῶμεν τῆς ὁμολογίας·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/014.yaml
  text: Therefore[a], since we have a great high priest who has passed through the heavens—Jesus the Son of God—let us hold fast to our confession.
translation:
  language: zh_hans
  text: 所以，既然我们有一位伟大的大祭司，已经穿越诸天[a]——耶稣，上帝的儿子——就让我们坚守我们的宣认。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“已经经过诸天”。希腊文的“天”为复数。
    reason: 说明διέρχομαι的可选译法，并保留τοὺς οὐρανούς的复数形式。
lexical_decisions:
- source_word: Ἔχοντες οὖν
  choice: 所以，既然我们有
  rationale: 分词Ἔχοντες说明随后劝勉的依据，οὖν承接上文作出推论；合译为“所以，既然我们有”，既保留逻辑关系，也符合现代汉语表达。
- source_word: ἀρχιερέα μέγαν
  choice: 一位伟大的大祭司
  rationale: 保留“大祭司”这一祭司职分称谓，并以“伟大的”传达μέγαν的强调，不将其改写成特定教义术语。
- source_word: διεληλυθότα τοὺς οὐρανούς
  choice: 已经穿越诸天
  rationale: “已经”体现完成时所表达的已成事实及其持续意义；“穿越”贴近διέρχομαι，“诸天”保留希腊文复数形式及其空间意象。
- source_word: Ἰησοῦν τὸν υἱὸν τοῦ θεοῦ
  choice: 就是上帝的儿子耶稣
  rationale: 同位说明这位大祭司的身份；保留“上帝的儿子”这一明确的基督论称号，同时采用自然的汉语语序。
- source_word: κρατῶμεν
  choice: 就让我们坚守
  rationale: 第一人称复数劝勉虚拟式译为“让我们”，现在时态所含的持续性由“坚守”自然表达。
- source_word: τῆς ὁμολογίας
  choice: 所宣认的信仰
  rationale: ὁμολογία指群体公开承认的信仰内容。“所宣认的信仰”比直译“宣认”更符合现代汉语，同时保留公开认信的含义；不把定冠词机械改成所有格。
theological_decisions:
- issue: 如何翻译υἱὸς τοῦ θεοῦ这一基督论称号
  choice: 上帝的儿子
  alternative: 上帝之子
  rationale: “上帝的儿子”完整保留原文称号及其神学分量，又比偏文言的“上帝之子”更符合现代标准汉语；不对“儿子”的关系作超出本节的解释。
- issue: 是否弱化τοὺς οὐρανούς的复数宇宙空间意象
  choice: 诸天
  alternative: 天
  rationale: “诸天”保留原文复数以及耶稣穿越天界的意象，但不据此建构原文没有明说的分层宇宙体系。
- issue: ὁμολογία是认信行为还是所认信的内容
  choice: 所宣认的信仰
  alternative: 我们的宣认
  rationale: 原词可以涉及公开宣认的行为及内容；正文采用自然汉语表达其信仰内容，同时以“宣认”保留公开承认的意味，避免把它缩减为仅仅内在的信念。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“伟大的大祭司”“坚守”等措辞保持劝勉段落的分量；破折号标明“上帝的儿子耶稣”是对大祭司身份的同位说明。脚注标记置于其所解释的“诸天”之后。
