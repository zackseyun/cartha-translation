  text: καὶ ἐν τούτῳ πάλιν· Εἰ εἰσελεύσονται εἰς τὴν κατάπαυσίν μου.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/005.yaml
  text: 'And in this place again: ‘They shall certainly not enter my rest.’[a]'
translation:
  language: zh_hans
  text: 又在这一处说：“他们断不能进入我的安息。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“如果他们将进入我的安息”，这是起誓用语，意思是“他们断不能进入我的安息”。
    reason: 说明原文条件句形式及其作为强烈否定誓言的实际意义。
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: 在这一处
  rationale: 这里指另一处经文或引文所在；“在这一处”既保留原文指示语，也符合中文引用经文的表达。
- source_word: πάλιν
  choice: 又
  rationale: 表示作者再次引述经文；“又”简洁自然，并能衔接上下文。
- source_word: Εἰ εἰσελεύσονται
  choice: 他们断不能进入
  rationale: 原文形式上是“如果他们将进入”，实际承载源自希伯来语的起誓用法，在此表达强烈否定；“断不能”传达其郑重而确定的语气。
- source_word: κατάπαυσίν
  choice: 安息
  rationale: 这是希伯来书3—4章的关键用语，指神的安息；“安息”能保持术语连贯，也符合庄重的现代汉语。
- source_word: μου
  choice: 我的
  rationale: 直接保留第一人称所有关系，表明所说的是神自己的安息。
theological_decisions:
- issue: 如何翻译起誓式条件句 Εἰ εἰσελεύσονται
  choice: 他们断不能进入我的安息
  alternative: 如果他们将进入我的安息
  rationale: 虽然希腊语表面采用条件句形式，但这是承接希伯来语习惯的省略式誓言，语用意义是郑重否定。正文传达其实际意义，脚注则保留字面形式，以兼顾原文形式和读者理解。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“又在这一处说”保留引经语气；“安息”维持本段核心术语的一致性。
