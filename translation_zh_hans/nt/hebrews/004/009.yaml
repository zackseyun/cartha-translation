  text: ἄρα ἀπολείπεται σαββατισμὸς τῷ λαῷ τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/009.yaml
  text: So then[a], a Sabbath rest remains for the people of God.
translation:
  language: zh_hans
  text: 这样看来，仍有安息日的安息[a]为上帝的子民存留。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“守安息日”。希腊词 σαββατισμός 很少见，并明确呼应安息日；在这里，它很可能指为上帝子民存留、带有安息日特征的安息。
    reason: 词义存在合理的翻译选择，需保留“安息”与“遵守安息日”之间的语义张力。
lexical_decisions:
- source_word: ἄρα
  choice: 这样看来
  rationale: 这是承接上文推论的语气词；“这样看来”自然地表达由前文论证所得的结论。
- source_word: ἀπολείπεται
  choice: 仍……存留
  rationale: 该词表示某事物尚未消失，仍被留下或继续存在；加入“仍”能清楚传达其持续有效的意味。
- source_word: σαββατισμός
  choice: 安息日的安息
  rationale: 这个罕见名词明确呼应安息日，也可指守安息日；“安息日的安息”既保留该词与安息日的词汇联系，也符合希伯来书3—4章关于上帝之安息和应许之安息的语境。
- source_word: τῷ λαῷ
  choice: 为……子民
  rationale: 此处与格可自然理解为受益或归属对象，表示这安息为上帝的子民存留。
- source_word: τοῦ θεοῦ
  choice: 上帝的
  rationale: 直译所有或关系属格，简洁表达这群子民属于上帝。
theological_decisions:
- issue: 希伯来书4:9中 σαββατισμός 的含义
  choice: 译作“安息日的安息”，指仍为上帝子民存留、带有安息日特征的安息。
  alternative: 译作“守安息日”，或译成不含任何安息日意味的纯粹属灵“安息”。
  rationale: 该词本身明确唤起安息日，而上下文又把上帝的安息、第七日和信徒仍可进入的应许之安息联系起来。正文保留这种关联和张力，不把它限定为每周礼仪，也不抹去其安息日意味。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“安息日的安息”略带源语色彩，是为保留罕见希腊词的安息日回响；全句结构简洁，并与上下文的论证语气相称。
