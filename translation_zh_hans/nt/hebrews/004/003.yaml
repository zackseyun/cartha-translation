id: HEB.4.3
reference: Hebrews 4:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἰσερχόμεθα γὰρ ⸀εἰς κατάπαυσιν οἱ πιστεύσαντες, καθὼς εἴρηκεν· Ὡς ὤμοσα ἐν τῇ ὀργῇ μου, Εἰ εἰσελεύσονται εἰς τὴν κατάπαυσίν μου, καίτοι τῶν ἔργων ἀπὸ καταβολῆς κόσμου γενηθέντων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/003.yaml
  text: For we who have believed enter the rest[a], just as he has said, “As I swore in my wrath[b], ‘If they shall enter my rest,’” although his works were finished from the foundation of the world.
translation:
  language: zh_hans
  text: '因为我们这些已经信的人进入那安息，正如他说过：


    “我在愤怒中起誓：


    ‘他们绝不能进入我的安息。’”[a]


    尽管上帝的作为从创世以来已经完成了。[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“如果他们将进入我的安息”，这是誓言套语，意思是“他们必不能进入我的安息”或“他们绝不能进入我的安息”。
    reason: 保留原文誓言公式的字面形式及其实际语力。
  - marker: b
    text: 或译：“尽管他的作为从创世以来已经完成了。”
    reason: 说明καίτοι所引让步结构及所有格表达的另一种自然译法。
lexical_decisions:
- source_word: εἰσερχόμεθα
  choice: 进入
  rationale: 保留现在时的当前或概括性力量，表达信的人进入上帝的安息，不把经文限缩为纯粹将来。
- source_word: κατάπαυσιν
  choice: 那安息
  rationale: “安息”自然承接上下文已经讨论的特定安息；“那”体现其篇章上的特指性。
- source_word: οἱ πιστεύσαντες
  choice: 我们这些已经信的人
  rationale: 既保留第一人称复数所含作者的自我包括，也以“已经信”体现不定过去时分词。
- source_word: καθὼς εἴρηκεν
  choice: 正如他说过
  rationale: “说过”传达完成时所表示的既已说出且持续有效的话。
- source_word: Ὡς ὤμοσα ἐν τῇ ὀργῇ μου
  choice: 我在愤怒中起誓
  rationale: 以庄重而通行的现代汉语表达上帝在审判性愤怒中所起的誓。
- source_word: Εἰ εἰσελεύσονται εἰς τὴν κατάπαυσίν μου
  choice: 他们绝不能进入我的安息
  rationale: εἰ加将来时在此承接希伯来语誓言套语，语用力量是强烈否定；正文译出实际含义，脚注保留字面形式。
- source_word: καίτοι
  choice: 其实
  rationale: 在这里引出与前述誓言形成让步性张力的事实；“其实”比生硬的“虽然”悬置结构更符合现代汉语，同时不消除逻辑关系。
- source_word: τῶν ἔργων ... γενηθέντων
  choice: 上帝的工作就已经完成了
  rationale: 属格独立结构表示这些工作早已成就或完成；根据语境明示其为上帝的工作。
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: 从创世以来
  rationale: 自然表达世界被奠基、受造之时，并保留ἀπό所指的时间起点。
theological_decisions:
- issue: 诗篇第95篇誓言引文的语力
  choice: 正文译为强烈否定：“他们绝不能进入我的安息。”
  alternative: 按表面句法译为：“如果他们将进入我的安息。”
  rationale: 这是源自希伯来语的省略式誓言公式，上下文含义是断然排除；正文传达其语用意义，脚注说明字面形式，以同时保存原文形式及可理解性。
- issue: 信徒进入安息的时态与层面
  choice: 使用现在时“进入”。
  alternative: 译为“正在进入”或“将要进入”。
  rationale: 希腊文现在时容许当前及概括性的理解，保留信徒现今凭信进入安息、而上下文仍可指向终极成全的张力，不把意义单一化为未来。
- issue: 创造之工与安息的关系
  choice: 译作“从创世以来，上帝的工作就已经完成了”。
  alternative: 译作“这些工作从世界奠基时已经成就”。
  rationale: 按属格独立结构表达创造之工已经完成这一事实，但不额外说明其如何与信徒所进入的安息对应。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“那安息”承接上下文中的特定概念；引文分行呈现其诗篇来源和誓言语气。正文以意译表达誓言公式，脚注交代字面结构；避免把“进入”限定为仅属现在或仅属将来。
