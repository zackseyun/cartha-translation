base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/004.yaml
  text: 'For he has spoken somewhere about the seventh day in this way: “And God rested on the seventh day from all his works,”[a][b]'
translation:
  language: zh_hans
  text: 因为经上有一处这样论到第七日：“上帝在第七日从他一切的工作中安歇了。”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “有一处”也可译作“在某处”。原文以未指明具体位置的方式引入经文，并不表示作者怀疑这段经文的权威或出处。
    reason: lexical_alternative
  - marker: b
    text: “安歇了”也可译作“停止了”。原词可强调停止做工；这里的译法保留了与创世记2:2以及希伯来书3—4章“安息”主题的联系。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴρηκεν
  choice: 圣经……说
  rationale: 原文为完成时，指过去说出而今仍有效的话；汉语无需机械标出完成体，以“圣经……说”自然表达经文持续有效的见证。
- source_word: γάρ
  choice: 因为
  rationale: 承接上文，为前面的论述提供根据，现代汉语用“因为”清楚自然。
- source_word: που
  choice: 有一处
  rationale: 表示未具体指出的经文位置，而非对经文权威或出处有所怀疑；“有一处”符合中文引用圣经的自然表达。
- source_word: περὶ τῆς ἑβδόμης
  choice: 论到第七日
  rationale: 阴性序数词在语境中省略了“日”；译文补出“日”以求清楚。
- source_word: οὕτως
  choice: 这样
  rationale: 自然引出随后引文，同时保留原文指示性的表达。
- source_word: Καὶ
  choice: 就
  rationale: 在创世记引文的汉语句法中，“就”自然承接“到了第七日”，体现原文连接词的推进作用。
- source_word: κατέπαυσεν
  choice: 歇了
  rationale: 兼具停止做工与进入安息的含义，并与希伯来书3—4章关于“安息”的论述保持词义联系；此处不表示上帝因疲乏而休息。
- source_word: ὁ θεὸς
  choice: 上帝
  rationale: 直接对应主语 θεός，采用现代中文庄重且通行的称呼。
- source_word: ἐν τῇ ἡμέρᾳ τῇ ἑβδόμῃ
  choice: 到了第七日
  rationale: 以自然汉语表达第七日这一时间点，也符合创世记叙事引文的语气。
- source_word: ἀπὸ πάντων τῶν ἔργων αὐτοῦ
  choice: 他一切的工
  rationale: 保留 πάντων 的总体性与 ἔργων 的工作含义；“歇了……的工”在汉语中自然包含原文 ἀπό 所表达的停止、离开工作。
theological_decisions:
- issue: 上帝在第七日停止工作与希伯来书“安息”主题的关系
  choice: 歇了
  alternative: 停止了
  rationale: “歇了”既可表达停止做工，也能维系创世记2:2与希伯来书3—4章“安息”主题的联系，同时不必理解为上帝因疲劳而休息。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“圣经”是为明确原文中未明说但语境确定的说话载体；引文采用自然中文语序，并保留两个词义注释标记。
