source:
  edition: SBLGNT
  text: Φοβηθῶμεν οὖν μήποτε καταλειπομένης ἐπαγγελίας εἰσελθεῖν εἰς τὴν κατάπαυσιν αὐτοῦ δοκῇ τις ἐξ ὑμῶν ὑστερηκέναι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/001.yaml
  text: Therefore[a], let us fear lest, while the promise of entering his rest still remains[c][b], any one of you should seem to have fallen short.
translation:
  language: zh_hans
  text: 所以，当进入他安息的应许仍然存留时，我们当惧怕，免得你们中间有人显得没有达到[c]。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们当害怕。”原文动词的语气强于一般的“小心”或“留意”，强调这警告的严肃性。
    reason: lexical_alternative
  - marker: b
    text: 也可较直译为：“有进入他安息的应许仍然存留。”原文结构紧凑；也可理解为“当进入他安息的应许仍然存留时”。
    reason: alternative_reading
  - marker: c
    text: 或译：“显得已经错过了”或“被认为没有赶上”。原文保留“显得／看来”的意味，同时指未能达到所应许的目标。
    reason: lexical_alternative
lexical_decisions:
- source_word: Φοβηθῶμεν
  choice: 我们就当惧怕
  rationale: 该动词以劝勉虚拟式发出直接而严肃的警告；“惧怕”保留原文力度，不弱化为仅仅“小心”或“留意”。
- source_word: οὖν
  choice: 所以
  rationale: 承接上文以色列人未能进入安息的论述，清楚表达推论关系，同时符合现代汉语行文。
- source_word: μήποτε
  choice: 免得
  rationale: 自然表达劝勉之后的负面警戒，保留原文所含的严肃可能性。
- source_word: καταλειπομένης ἐπαγγελίας
  choice: 应许既然仍然存留
  rationale: 将属格独立结构理解为劝勉所处的伴随情境；“仍然存留”表明这应许继续存在，尚未失效。
- source_word: εἰσελθεῖν εἰς τὴν κατάπαυσιν αὐτοῦ
  choice: 进入他安息
  rationale: 保留“进入”与“安息”的核心意象，并照原文使用代词“他”，不在正文中提前限定其末世论或安息日层面的含义。
- source_word: δοκῇ
  choice: 看来
  rationale: 保留 δοκέω 所含“显得、看来”的语义，不径自判定这是纯属表象还是最终裁决。
- source_word: τις ἐξ ὑμῶν
  choice: 你们中间有人
  rationale: 自然表达不定代词与部分属格，同时保留对群体中任何个人的警告。
- source_word: ὑστερηκέναι
  choice: 未能达到
  rationale: 在此指未能达到所应许的目标；这一译法比单纯“缺少”更符合上下文，也避免添加原文没有明说的结果细节。
theological_decisions:
- issue: 警告应译为真实的惧怕，还是弱化为一般性的谨慎
  choice: 我们就当惧怕
  alternative: 我们就当小心／谨慎
  rationale: φοβηθῶμεν 明确带有惧怕的力度。译文保留警告的严肃性，但不借此预先解决有关坚忍或背道的教义争论。
- issue: 是否在正文中把“他的安息”明确解释为“上帝末世的安息”
  choice: 他的安息
  alternative: 上帝的安息／他末世的安息／他的安息日安息
  rationale: 上下文能使所指逐渐清楚，但本节本身使用代词。照原文保留“他”可避免加入超过本节措辞的解释。
- issue: δοκῇ 是否应当消解为确定失败或仅仅表面看来失败
  choice: 看来未能达到
  alternative: 确实未能达到／只是看似未能达到／被发现没有赶上
  rationale: 原文保留“看来、显得”的成分。正文不把它解释为虚假表象，也不完全抹去这一措辞所形成的张力。
translation_notes:
  register: 采用现代、庄重且易懂的书面普通话。“惧怕”保留警告力度；“仍然存留”略带经文语体，但在现代汉语中清楚自然；句序作适度调整，使属格独立结构与主句关系明确，同时不消除原文在“看来”和“未能达到”上的解释张力。
