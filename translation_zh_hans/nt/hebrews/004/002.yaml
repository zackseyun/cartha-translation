  text: καὶ γάρ ἐσμεν εὐηγγελισμένοι καθάπερ κἀκεῖνοι, ἀλλ’ οὐκ ὠφέλησεν ὁ λόγος τῆς ἀκοῆς ἐκείνους, μὴ ⸀συγκεκερασμένους τῇ πίστει τοῖς ἀκούσασιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/002.yaml
  text: For indeed[a], we also have had good news proclaimed to us, just as they did; but the message they heard did not benefit them[b], because it was not united by faith with those who heard.
translation:
  language: zh_hans
  text: 因为好消息也已经传给我们，正如传给他们一样；可是，他们所听见的信息并没有使他们受益，因为他们没有凭着信与那些听见的人相联合。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 另有抄本作：“因为这信息没有在听见的人里面与信调和。”
    reason: textual_variant
lexical_decisions:
- source_word: εὐηγγελισμένοι
  choice: 好消息也已经传给我们
  rationale: 与ἐσμεν构成迂回完成时，表达好消息已经被宣告且其效力延续至今；采用“好消息”保留动词本义，也避免在旷野世代的对比中把它过早术语化为“福音”。
- source_word: καθάπερ κἀκεῖνοι
  choice: 正如传给他们一样
  rationale: 自然表达当前受众与旷野世代同样领受了神所宣告的信息。
- source_word: ὁ λόγος τῆς ἀκοῆς
  choice: 他们所听见的信息
  rationale: 把属格结构自然译出，以“信息”表达λόγος的宣告内容，以“所听见”表达ἀκοή。
- source_word: ὠφέλησεν
  choice: 并没有使他们受益
  rationale: 以现代汉语清楚表达该信息未给他们带来应有的益处。
- source_word: συγκεκερασμένους
  choice: 结合
  rationale: 该词本义涉及混合、结合；此处按比喻义表达人与听从者联合，同时保留结果状态。
- source_word: πίστει
  choice: 借着信
  rationale: 把πίστις译为“信”，并将与格理解为方式或凭借；“信靠”亦可传达其语义，但主文采用较贴近原词且简洁的表达。
- source_word: τοῖς ἀκούσασιν
  choice: 与那些听从的人
  rationale: ἀκούω字面为“听见”，但这里与未因所听信息受益者形成对照；“听从”自然传达有回应的聆听，同时不额外规定回应者身份。
- source_word: μὴ συγκεκερασμένους τῇ πίστει τοῖς ἀκούσασιν
  choice: 因为他们没有借着信与那些听从的人结合
  rationale: 依SBLGNT所列宾格复数分词，使其与ἐκείνους呼应，主文据此译为“他们”未与听从者结合；另有异文支持传统译法，置于脚注以保存文本与句法上的张力。
theological_decisions:
- issue: πίστις在本节中的含义
  choice: 信
  alternative: 信靠；忠信
  rationale: 上下文对比听见信息与作出相信的回应，“信”最贴切且不引入特定宗派对坚忍或圣约忠信的解释。
- issue: 末句的指向与句法
  choice: 他们没有借着信与那些听从的人结合
  alternative: 所听见的信息没有在听见的人里面与信结合
  rationale: 主文遵循所给SBLGNT的συγκεκερασμένους，使宾格复数分词修饰ἐκείνους；传统读法由异文支持，故在脚注中保留，不把文本争议静默消解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“好消息”保留εὐαγγελίζομαι的宣告性；“听从”用来呈现上下文中有回应的听见。主文严格跟随所给SBLGNT较难的宾格复数读法，并以脚注交代传统异文。
