  text: ὁ γὰρ εἰσελθὼν εἰς τὴν κατάπαυσιν αὐτοῦ καὶ αὐτὸς κατέπαυσεν ἀπὸ τῶν ἔργων αὐτοῦ ὥσπερ ἀπὸ τῶν ἰδίων ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/010.yaml
  text: For the one who has entered his rest has himself also rested from his works[b][a], just as God did from his own.
translation:
  language: zh_hans
  text: 因为那进入他的安息[a]的人，自己也歇了自己的工[b]，正如上帝歇了自己的工一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他的安息”也可明确译作“上帝的安息”。按希伯来书3—4章的上下文，这里的“他”最可能指上帝。
    reason: alternative_reading
  - marker: b
    text: “歇了自己的工”也可译作“停止了自己的工作”。这里的希腊语动词与本段译作“安息”的词同源，因此正文保留歇息的表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ... εἰσελθὼν
  choice: 那进入……的人
  rationale: 冠词加不定过去时分词在此作名词用，泛指已经进入安息的人；此译法保留单数形式和进入动作已经发生的意味。
- source_word: γὰρ
  choice: 因为
  rationale: 引出对上一节的解释和根据，现代汉语用“因为”衔接自然。
- source_word: κατάπαυσιν
  choice: 安息
  rationale: 这是希伯来书3—4章的主题词，与上帝创世后的安息相连；“安息”能保留其经文互文和神学分量。
- source_word: αὐτοῦ（位于 κατάπαυσιν 之后）
  choice: 他的
  rationale: 希腊文使用代词，单看语法可能指上帝，也可能被理解为进入者；正文保留代词，不直接改成“上帝的”，以保存原文的形式与一定的含混性。
- source_word: καὶ αὐτὸς
  choice: 自己也
  rationale: “自己”体现 αὐτός 的强调，“也”体现 καί 的附加和比较作用。
- source_word: κατέπαυσεν
  choice: 歇下了
  rationale: 动词与“安息”一词同源，并带有停止工作的意思；“歇下了”既保留安息意象，也适合与“工作”搭配。
- source_word: ἀπὸ τῶν ἔργων αὐτοῦ
  choice: 自己的工作
  rationale: ἔργα 可指工作、行为或所做之事；“工作”最直接，也不把经文限定为赚取功德的行为。汉语以“歇下了自己的工作”自然表达介词 ἀπό 所表示的脱离或停止。
- source_word: ὥσπερ
  choice: 正如……一样
  rationale: 清楚表达进入安息者与上帝之间的比较关系。
- source_word: ἀπὸ τῶν ἰδίων
  choice: 歇下了自己的工作
  rationale: ἰδίων 在此省略了前文的“工作”；汉语补出“工作”以使句意完整，同时用“自己的”保留其强调意味。
- source_word: ὁ θεός
  choice: 上帝
  rationale: θεός 的标准现代汉语译法；按汉语语序把明确的主语置于动词前。
theological_decisions:
- issue: “他的安息”（αὐτοῦ）的所指
  choice: 正文保留“他的”，语境上最可能指上帝的安息。
  alternative: 也可把它理解为进入安息者本人的安息，并在正文中译作“自己的安息”。
  rationale: 希伯来书3—4章反复谈到上帝的安息，本节末尾又以人的歇工与上帝歇工相比，因此指上帝最符合上下文；但原文仅用代词，正文不将其直接明说为“上帝的”，以免消除原有张力。
- issue: “歇下”是否含有停止工作的意思
  choice: 正文译作“歇下了”，保留本段反复出现的安息意象。
  alternative: 可译作“停止了”。
  rationale: κατέπαυσεν 既可表达歇息，也可表达停止；其与 κατάπαυσις 同源，因此正文优先保留安息语言，同时用脚注说明另一译法。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。“歇下了自己的工作”比“从自己的工作中安息”更符合现代汉语习惯，同时仍保留本段的安息主题。正文保留“他的”这一代词，并用脚注说明其最可能的所指。
