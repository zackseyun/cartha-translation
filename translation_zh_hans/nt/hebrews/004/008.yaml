  text: εἰ γὰρ αὐτοὺς Ἰησοῦς κατέπαυσεν, οὐκ ἂν περὶ ἄλλης ἐλάλει μετὰ ταῦτα ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/008.yaml
  text: For if Joshua had given them rest[a], he would not have spoken later about another day.
translation:
  language: zh_hans
  text: 因为如果约书亚[a]使他们得享安息，后来就不会再提到另一个日子了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文为Ἰησοῦς。这一名字形式可指耶稣，也可指约书亚；此处上下文所指的是嫩的儿子约书亚。
    reason: 说明原文名字形式的歧义及正文按语境确定的所指。
lexical_decisions:
- source_word: Ἰησοῦς
  choice: 约书亚
  rationale: 希腊文名形Ἰησοῦς既可指耶稣，也可指约书亚；本段论述以色列人在约书亚带领下进入迦南，却仍有后来所说的安息，因此此处所指是嫩的儿子约书亚。
- source_word: κατέπαυσεν
  choice: 使他们得享安息
  rationale: καταπαύω在这里是使役用法，表示使人停止劳作、进入安息；“使他们得享安息”既保留使役意义，也呼应本段反复出现的“安息”。
- source_word: οὐκ ἂν ... ἐλάλει
  choice: 就不会再说
  rationale: οὐκ ἄν与未完成时ἐλάλει构成与事实相反的结果；“就不会再说”以自然汉语表达反事实条件，并避免补入希腊文未明说的主语。
- source_word: περὶ ἄλλης ... ἡμέρας
  choice: 另有一个日子
  rationale: 直陈所谈的是另一个日子，并保留它与“安息”之间须由上下文建立的关系，不擅自增译为“另一个安息日”。
- source_word: μετὰ ταῦτα
  choice: 后来
  rationale: 简洁表达在约书亚时代之后的时间次序。
- source_word: γὰρ
  choice: 因为
  rationale: 表明本句是在为前文的论述提供理由。
theological_decisions:
- issue: 希腊文Ἰησοῦς在本节的所指
  choice: 约书亚（嫩的儿子）
  alternative: 耶稣
  rationale: 上下文涉及以色列人进入应许之地，并以诗篇中后来仍提到的“今日”证明约书亚并未使安息的应许完全实现。正文据语境译作“约书亚”，脚注则说明希腊文名形与“耶稣”相同，以保持原文资料的透明度。
- issue: “后来就不会再说”的隐含主语
  choice: 不在中文正文中补明主语
  alternative: 补作“上帝后来就不会再说”或“他后来就不会再说”
  rationale: 希腊文动词仅隐含第三人称单数主语，本句自身没有明说是谁；中文可自然省略主语，既贴近原文，也避免过早消除句法上的含混。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“得享安息”保留全段核心词汇的一致性；省略第二分句未明说的主语，使汉语自然，并保存原文的句法含混。
