id: HEB.4.12
reference: Hebrews 4:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ζῶν γὰρ ὁ λόγος τοῦ θεοῦ καὶ ἐνεργὴς καὶ τομώτερος ὑπὲρ πᾶσαν μάχαιραν δίστομον καὶ διϊκνούμενος ἄχρι μερισμοῦ ψυχῆς ⸀καὶ πνεύματος, ἁρμῶν τε καὶ μυελῶν, καὶ κριτικὸς ἐνθυμήσεων καὶ ἐννοιῶν καρδίας·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/012.yaml
  text: For the word of God is living and active[a], and sharper than any double-edged sword, piercing to the division of soul and spirit, of joints and marrow[c][b], and able to judge the thoughts and intentions of the heart.
translation:
  language: zh_hans
  text: 因为上帝的话是活的，是有功效的，比任何双刃剑都锋利，能穿透，直达魂与灵、关节与骨髓的分际[a]，并能评断人心的思念和意图。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “魂与灵、关节与骨髓的分际”强调上帝的话能深入到最深之处。这里的措辞本身并不要求采用某一种关于人由哪些部分构成的学说，也未明确说明每一对项目如何彼此分开。
    reason: alternative_reading
  - marker: b
    text: “能评断”也可译作“能辨明”或“能鉴察”；原词表示具有评断、辨别的能力。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ζῶν
  choice: 是活的
  rationale: 保留谓语性质和持续的生命力；现代汉语自然清楚。
- source_word: γὰρ
  choice: 因为
  rationale: 表明本节为前文劝勉提供理由，保留其解释和论证功能。
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: 上帝的话
  rationale: 保持所指的宽度，不限定为圣经文本、宣讲的信息、上帝的某次发言或作为位格的“道”。
- source_word: ἐνεργὴς
  choice: 是有功效的
  rationale: 兼顾正在发挥作用和确实有效两层含义，又不额外加入“有能力”等原文未明说的概念。
- source_word: τομώτερος ὑπὲρ πᾶσαν μάχαιραν δίστομον
  choice: 比任何双刃剑都锋利
  rationale: 准确表达比较结构，并以现代汉语保留鲜明的刀剑意象。
- source_word: διϊκνούμενος
  choice: 能刺入
  rationale: 延续双刃剑的意象，表达穿透、深入内部之意；“能”使分词结构在汉语中顺畅。
- source_word: ἄχρι μερισμοῦ
  choice: 直至剖开
  rationale: “直至”保留所达到的程度，“剖开”兼顾分开之义和刀剑语境。
- source_word: ψυχῆς καὶ πνεύματος
  choice: 魂与灵
  rationale: 直接保留两个不同名词，不把它们解释为特定的人论体系，也不消除原文的张力。
- source_word: ἁρμῶν τε καὶ μυελῶν
  choice: 关节与骨髓
  rationale: 采用现代汉语中自然的身体用语，保持与“魂与灵”平行的深度穿透意象。
- source_word: κριτικὸς
  choice: 能审断
  rationale: 表达评断、判明的能力，比单纯“知道”更贴近该形容词的判断意味。
- source_word: ἐνθυμήσεων καὶ ἐννοιῶν καρδίας
  choice: 人心里的思量和意图
  rationale: 用“思量”表达内在思考，用“意图”表达内在目的，既作区分又避免过度技术化。
theological_decisions:
- issue: “上帝的话”的所指
  choice: 保留概括性的“上帝的话”
  alternative: 明确译作“圣经”、上帝所说的应许或审判，或作为位格的“道”
  rationale: 上下文强调上帝发言的现实效力，但希腊文本没有在此把所指限定为其中某一种；译文因此保留其广度。
- issue: “魂与灵”的人论含义
  choice: 按原文保留“魂与灵”，不在正文中规定二者的本体关系
  alternative: 将二者解释为可分离的人性组成部分，或合并为笼统的“内心深处”
  rationale: 本节重点在于上帝的话能深入并审断一切；原文的并列措辞应予保留，却不足以单独确立某种二分或三分的人论。
- issue: “剖开”所表达的关系
  choice: 保留可理解为深入到足以分开的意象
  alternative: 明确解释为把魂从灵分开、把关节从骨髓分开，或仅解释为穿透这些事物之间
  rationale: μερισμός可指分开或划分，但句中成对属格的具体关系并不完全明确；译文保留其力度而不补出原文未明说的空间或本体关系。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。句式保留原文由“因为”引出的论证关系，并维持“活的—有功效的—锋利—刺入—审断”的递进。避免把“上帝的话”狭义化，也避免借“魂与灵”引入特定宗派人论。
