  text: οὐ γὰρ ἔχομεν ἀρχιερέα μὴ δυνάμενον συμπαθῆσαι ταῖς ἀσθενείαις ἡμῶν, ⸀πεπειρασμένον δὲ κατὰ πάντα καθ’ ὁμοιότητα χωρὶς ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/015.yaml
  text: For we do not have a high priest unable to sympathize with our weaknesses, but one who has been tested in every way according to likeness, yet without sin.
translation:
  language: zh_hans
  text: 因为我们的大祭司并非不能体恤我们的软弱；相反，他曾在各方面都像我们一样受过考验[a]，却没有罪。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在各方面都像我们一样受过试探”。
    reason: alternative_reading
  - marker: b
    text: 原文直译：“按着相似性”；本短语没有明说比较对象，语境可理解为“像我们一样”或“以与我们相同的方式”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχιερέα
  choice: 大祭司
  rationale: 这是该礼仪职分标准而准确的中文译法，也是《希伯来书》论述耶稣祭司中保职分的核心称谓。
- source_word: οὐ ... μὴ δυνάμενον συμπαθῆσαι
  choice: 并非不能体恤
  rationale: 保留希腊文以双重否定形成的含蓄肯定，而不直接改写成“能够体恤”；“体恤”既表达感同身受，也比单纯的怜悯更贴近 συμπαθέω。
- source_word: ταῖς ἀσθενείαις ἡμῶν
  choice: 我们的软弱
  rationale: 这里泛指人的脆弱和局限，并不只指身体疾病；“软弱”自然、宽泛，也符合受考验的语境。
- source_word: πεπειρασμένον
  choice: 曾……受过考验
  rationale: πειράζω 可指考验，也可指试探；正文采用“受考验”，表达真实经历试炼而不暗示内在的罪恶倾向，并以脚注保留“受试探”这一合理译法。
- source_word: κατὰ πάντα
  choice: 在各方面
  rationale: 自然表达其全面性，意思是在每一方面或各种情形中都经历考验。
- source_word: καθ’ ὁμοιότητα
  choice: 与我们相似
  rationale: 原文直译为“按照相似性”，比较对象在语境中指向“我们”；中文正文作最小限度的补足以避免生硬，同时以脚注说明原文字面形式及其含义范围。
- source_word: χωρὶς ἁμαρτίας
  choice: 只是没有犯罪
  rationale: “只是”标明前述相似性中的决定性例外；“没有犯罪”在现代中文中清楚表达他虽受考验却无罪的事实。
theological_decisions:
- issue: πεπειρασμένον 如何与基督无罪的陈述并置
  choice: 受过考验
  alternative: 受过试探
  rationale: “考验”保留真实试炼的经验，又不使读者误以为经文断言基督里面有罪恶欲望；“试探”在词义上同样成立，因此列入脚注，不消除原词的语义张力。
- issue: 如何表达 καθ’ ὁμοιότητα 所含的比较
  choice: 与我们相似
  alternative: 按照相似性
  rationale: 希腊文明确说“相似”，但本短语没有明说比较对象。正文依据紧邻的“我们的软弱”作自然的语境补足，脚注则保留字面形式，避免把相似性解释为毫无限定的完全相同。
- issue: χωρὶς ἁμαρτίας 是指未犯罪还是未经历与罪有关的试探
  choice: 只是没有犯罪
  alternative: 却与罪无关／除罪以外
  rationale: 该短语可较直译为“没有罪”或“离开罪”；正文避免扩张为“未经历真正试探”，并将其作为相似性中的例外，维持受考验与无罪之间的经文张力。
translation_notes:
  register: 采用现代、庄重且适合公开诵读的标准普通话。“并非不能……；相反……”保留原文修辞对照。“体恤”比“同情”更能表达共同感受软弱；正文中的两个脚注标记均紧随相关表达。
