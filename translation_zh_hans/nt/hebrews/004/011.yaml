  text: σπουδάσωμεν οὖν εἰσελθεῖν εἰς ἐκείνην τὴν κατάπαυσιν, ἵνα μὴ ἐν τῷ αὐτῷ τις ὑποδείγματι πέσῃ τῆς ἀπειθείας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/011.yaml
  text: Therefore[a], let us make every effort to enter that rest, so that no one may fall by the same pattern of disobedience.
translation:
  language: zh_hans
  text: 所以，我们要竭力进入那安息，免得有人照着同样的悖逆[a]模式而跌倒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “悖逆”也可结合旷野世代拒绝信靠上帝的背景理解为“不信”；不过，希腊语这个词更直接的意思是“不顺从、悖逆”。
    reason: lexical_alternative
lexical_decisions:
- source_word: σπουδάσωμεν
  choice: 我们要竭力
  rationale: 该词为劝勉用的第一人称复数虚拟语气，表达共同的郑重呼吁；“竭力”自然、凝练地传达勤勉和迫切努力。
- source_word: οὖν
  choice: 所以
  rationale: 承接上文关于上帝的安息及旷野世代失败的论述，清楚表达推论关系。
- source_word: εἰσελθεῖν
  choice: 进入
  rationale: 直接保留不定式所表达的行动目标，与“竭力”搭配自然。
- source_word: ἐκείνην τὴν κατάπαυσιν
  choice: 那安息
  rationale: 保留指示词的回指作用，连接上文已经论述的安息，同时不把其性质解释得过窄。
- source_word: ἵνα μὴ
  choice: 免得
  rationale: 以现代汉语自然表达否定目的及严肃警告。
- source_word: ἐν τῷ αὐτῷ ... ὑποδείγματι
  choice: 照着同样……的先例
  rationale: ὑπόδειγμα在此指旷野世代留下的反面实例或模式；“先例”既能回指历史事件，也能传达不可重蹈覆辙的警戒意味。
- source_word: πέσῃ
  choice: 跌倒
  rationale: 保留原文“落下、倒下”的警告性意象，不额外限定为失去救恩、死亡或其他特定后果。
- source_word: τῆς ἀπειθείας
  choice: 悖逆
  rationale: ἀπείθεια直接指不顺从、不服从；“悖逆”在庄重而易懂的圣经语体中可同时体现对上帝的不信任所导致的抗命行为。
theological_decisions:
- issue: ἀπείθεια与旷野世代不信之间的关系
  choice: 正文译作“悖逆”
  alternative: 不信
  rationale: 《希伯来书》的上下文把不信与不顺从紧密相连，但ἀπείθεια本身更直接表示悖逆或不顺从。正文保留其行为层面的词义，脚注说明“不信”这一语境理解，避免把二者无声地等同。
- issue: πέσῃ所指的后果
  choice: 保留为“跌倒”
  alternative: 灭亡／落在后面
  rationale: 原文没有在本句明确界定“跌倒”的具体后果，因此保留意象和警告力度，不作教义性扩展。
translation_notes:
  register: 采用现代、庄重而简明的普通话。“所以”清楚承接上文；“竭力”保留劝勉力度；“那安息”维持上下文中的核心用语及其开放性；“先例”突出旷野世代作为反面警戒。脚注标记置于整句末尾，对“悖逆”的语境性替代译法作说明。
