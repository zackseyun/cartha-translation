  text: ἐπεὶ οὖν ἀπολείπεται τινὰς εἰσελθεῖν εἰς αὐτήν, καὶ οἱ πρότερον εὐαγγελισθέντες οὐκ εἰσῆλθον δι’ ἀπείθειαν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/006.yaml
  text: Therefore[a], since it remains for some to enter it, and those who formerly had the good news proclaimed to them did not enter because of disobedience,
translation:
  language: zh_hans
  text: 所以，既然仍留有让一些人进入那安息的机会，而那些先前听闻福音的人因不顺从[a]没有进入，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“因不信”。希腊语这个词可指拒绝相信，并表现为不顺从。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ οὖν
  choice: 所以，既然
  rationale: 兼顾οὖν的推论作用和ἐπεί引出论证前提的作用，并以自然现代汉语衔接上文。
- source_word: ἀπολείπεται τινὰς εἰσελθεῖν εἰς αὐτήν
  choice: 仍有人可以进入那安息
  rationale: ἀπολείπεται表达某种可能仍然存留、尚未关闭；τινὰς保持对象不定。“那安息”明确αὐτήν在汉语中所指的上文内容，避免单用“它”造成生硬或含混。
- source_word: οἱ πρότερον εὐαγγελισθέντες
  choice: 先前听见福音的人
  rationale: 表达被动领受福音宣告的含义；汉语用“听见福音”比“被传了福音”更自然，同时不表示他们已经凭信心接受。
- source_word: οὐκ εἰσῆλθον
  choice: 没有进去
  rationale: 直接对应简单过去时的否定，不额外加入“未能”等可能暗示能力不足的意味。
- source_word: δι’ ἀπείθειαν
  choice: 因不顺从
  rationale: 保留ἀπείθεια以拒绝听从、表现为悖逆的核心含义，同时借脚注说明它在此语境中也含不信的意味。
theological_decisions:
- issue: 安息警告语境中ἀπείθεια的译法
  choice: 因不顺从
  alternative: 因不信
  rationale: 该词在本段把不信与拒绝听从紧密相连，但不宜把两者完全等同。正文采用“不顺从”保留行为和意志层面的抗拒，脚注呈现“不信”这一真实语义关联。
- issue: αὐτήν所指内容是否在译文中明说
  choice: 那安息
  alternative: 其中／它
  rationale: 希腊语阴性代词明确回指上文的κατάπαυσις（安息）。现代汉语若直译为“它”不够自然，补明“那安息”并未增加新的解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“所以，既然”保留本句承上启下、尚未完结的论证句式；句末逗号反映原文继续进入下一节。
