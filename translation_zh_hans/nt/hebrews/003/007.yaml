  text: 所以，正如圣灵所说：“今天，你们若听见他的声音，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διό
  choice: 所以
  rationale: 表示由上文推出结论；“所以”自然、清楚地保留了上下文的推论关系。
- source_word: καθὼς
  choice: 正如
  rationale: 引出经文引述，同时保留原文较鲜明的对应和承接语气。
- source_word: λέγει
  choice: 所说
  rationale: 用现代汉语的引述结构表达希腊文现在时“说”；不改为过去时，从而保留圣灵借经文持续发言的修辞效果。
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: 圣灵
  rationale: 这是该希腊语定冠词短语标准而准确的中文译法，不另加原文没有的强调。
- source_word: Σήμερον
  choice: 今天
  rationale: 直接表达时间副词，并保留诗篇引文对当下听众的即时呼唤。
- source_word: ἐὰν
  choice: 若
  rationale: 准确表达条件关系；“若”用于庄重的经文引语自然简洁，又不增加“果真”等强调。
- source_word: τῆς φωνῆς αὐτοῦ
  choice: 他的声音
  rationale: ἀκούω所带属格宾语在中文中自然译作“听见他的声音”，保留声音所属者的个人性。
- source_word: ἀκούσητε
  choice: 你们……听见
  rationale: 第二人称复数明确译为“你们”；“听见”保留听觉动词的基本意义，不提前解释为顺从或听从。
theological_decisions:
- issue: 诗篇引文的说话者归属
  choice: 直接表述为“圣灵所说”
  alternative: 解释性译为“圣灵借着诗篇作者说”或仅说“经上说”
  rationale: 希腊文明确以圣灵为λέγει的主语。译文保留这一直接归属，不弱化为纯粹的人类发言，也不扩展原文以建立更完整的默示论表述。
- issue: 条件句在本节中的未完成状态
  choice: 以逗号收尾，保留“若”所引条件句延续到下一节
  alternative: 在本节末补足意思或使用句号
  rationale: 原文引文在本节只给出条件句的开头，后件和劝诫延续至下一节；不应在本节内擅自补足或封闭句意。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“所以，正如……”保留论证承接；引文中的“你们若……”符合现代书面语。末尾保留逗号，以显示句法和引文尚未结束。
