source:
  edition: SBLGNT
  text: μὴ σκληρύνητε τὰς καρδίας ὑμῶν ὡς ἐν τῷ παραπικρασμῷ, κατὰ τὴν ἡμέραν τοῦ πειρασμοῦ ἐν τῇ ἐρήμῳ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/008.yaml
  text: do not harden your hearts as in the rebellion[a], as on the day of testing in the wilderness,
translation:
  language: zh_hans
  text: 你们不可硬着心，像在那次悖逆时一样，像在旷野受试验的日子一样[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译（按诗篇95:8背后的希伯来地名）：“像在米利巴时一样，像在旷野玛撒的日子一样。”
    reason: 保留诗篇希伯来文本中“米利巴”（争闹）和“玛撒”（试探）两个地名所构成的历史典故；正文则依《希伯来书》的希腊措辞翻译。
lexical_decisions:
- source_word: μὴ σκληρύνητε
  choice: 不可硬着
  rationale: μή加不定过去时主动虚拟语气构成直接禁令；“不可硬着心”既自然，也保留主动语态所表达的责任。
- source_word: τὰς καρδίας ὑμῶν
  choice: 你们的心
  rationale: καρδία在此指人的内在意志、思想和态度，不仅指情感；“你们的心”也保留对群体的直接称呼。
- source_word: ὡς ἐν τῷ παραπικρασμῷ
  choice: 像在那次悖逆时一样
  rationale: παραπικρασμός可指激怒或悖逆；结合诗篇95篇所回顾的事件，“悖逆”清楚传达以色列人反抗并触怒上帝的行为，同时仍按希腊文译作事件性名词，而不以希伯来地名取代。
- source_word: κατὰ τὴν ἡμέραν τοῦ πειρασμοῦ
  choice: 像在受试验的日子一样
  rationale: κατά加宾格在这里与前面的比较相呼应；πειρασμός在旷野叙事中指试验事件。“受试验”保留“试验”由谁施于谁的语义张力，不把它窄化为内在诱惑。
- source_word: ἐν τῇ ἐρήμῳ
  choice: 在旷野
  rationale: “旷野”是以色列漂流背景下自然且具有经文呼应的译法，比“沙漠”更符合此处的圣经历史语境。
theological_decisions:
- issue: 诗篇95篇历史典故的译法
  choice: 正文按希腊文用描述性事件名词译为“悖逆”和“受试验的日子”
  alternative: 按诗篇95:8背后的希伯来地名译为“在米利巴……在玛撒的日子”
  rationale: 《希伯来书》引用的希腊文本使用事件性普通名词，而非音译希伯来地名。原文优先要求正文反映现存希腊措辞；重要的希伯来背景则在脚注中保留。
- issue: πειρασμός中试验关系的歧义
  choice: 译为“受试验”，不在正文明确说明是百姓试探上帝还是百姓经受考验
  alternative: 译为“试探上帝”或“上帝考验你们”
  rationale: 单凭本节的属格结构并未明确受试者或施试者；上下文和诗篇背景牵涉百姓试探上帝以及旷野考验的双重关联，正文不宜擅自消除这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“硬着心”沿用自然的圣经表达；两个“像……一样”保留希腊文的平行比较结构。脚注标记[a]已置于正文相关句末。
