  text: ἐν τῷ λέγεσθαι· Σήμερον ἐὰν τῆς φωνῆς αὐτοῦ ἀκούσητε, Μὴ σκληρύνητε τὰς καρδίας ὑμῶν ὡς ἐν τῷ παραπικρασμῷ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/015.yaml
  text: while it is being said[a], “Today, if you hear his voice, do not harden your hearts as in the rebellion.”
translation:
  language: zh_hans
  text: 正如这话仍在宣告：“今天，你们若听见他的声音，就不要使你们的心刚硬，像在那次悖逆的时候一样[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“像在那次挑衅、激怒上帝的事中一样。”
    reason: 保留 παραπικρασμός 所含“挑衅／激怒”的词义侧面，以及它在诗篇95篇引文中的传统译法和互文联系。
lexical_decisions:
- source_word: ἐν τῷ λέγεσθαι
  choice: 正如经上所说
  rationale: 该带冠词不定式结构具有时间或伴随意味，并以被动形式引出仍在宣告的引文。汉语用“正如经上所说”自然地承接上下文并引出经文，同时避免生硬直译为“在被说的时候”。
- source_word: Σήμερον
  choice: 今天
  rationale: 准确表达时间副词的即时性与劝勉中的紧迫感。
- source_word: ἐὰν τῆς φωνῆς αὐτοῦ ἀκούσητε
  choice: 你们若听见他的声音
  rationale: 保留条件句结构；“听见他的声音”既符合现代汉语，也保留“听”可能包含留意和顺从的语义张力。
- source_word: Μὴ σκληρύνητε τὰς καρδίας ὑμῶν
  choice: 就不要硬着心
  rationale: “硬着心”是自然且庄重的现代汉语表达，并保留“心”作为人的内在意志与判断中心的圣经意涵。
- source_word: ὡς ἐν τῷ παραπικρασμῷ
  choice: 像在那次悖逆中一样
  rationale: παραπικρασμός指向旷野中以色列人对上帝的抗拒事件。“悖逆”清楚传达其道德与盟约层面的分量；“那次”凸显这是诗篇所回顾的特定事件。
theological_decisions:
- issue: 诗篇95篇引文中 παραπικρασμός 的译法
  choice: 悖逆
  alternative: 激怒上帝
  rationale: 该词既可着重人的反叛，也可着重这种行为对上帝的激怒。“悖逆”在现代汉语中更直接传达以色列人旷野抗拒上帝的性质，同时以脚注保留另一语义侧重，不把两者之间的张力消除。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“正如经上所说”自然引出引文；全句保留原文的条件与禁令结构。脚注标记置于其所说明的“悖逆”引文末尾。
