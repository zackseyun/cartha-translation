  text: πιστὸν ὄντα τῷ ποιήσαντι αὐτὸν ὡς καὶ Μωϋσῆς ⸀ἐν τῷ οἴκῳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/002.yaml
  text: who was faithful to the one who appointed him[b][a], just as Moses also was in all his house.
translation:
  language: zh_hans
  text: 他对设立他的那一位[a]忠心，正如摩西在他的家中[b]忠心一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“造了他的那一位”。希腊语动词可表示“造”，但在这里很可能是“设立”或“委任”的意思。
    reason: lexical_alternative
  - marker: b
    text: 有些抄本作“在他的整个家中”，更贴近《民数记》12:7；另一些抄本作“在他的家中”。这里的“家”很可能指神的家。
    reason: textual_variant
lexical_decisions:
- source_word: πιστὸν ὄντα
  choice: 他忠于
  rationale: 该分词短语承接上一节的“耶稣”，表达他对设立者忠诚可靠；译成“他忠于”符合现代汉语表达，也避免误解为“相信”。
- source_word: τῷ ποιήσαντι αὐτὸν
  choice: 那位设立他的
  rationale: ποιέω基本义可为“造、作”，在此处结合使徒、大祭司以及摩西受托管理神家的语境，宜理解为“设立、委任”；脚注保留“造了他”这一词义可能。
- source_word: ὡς καὶ
  choice: 正如……也……一样
  rationale: 清楚呈现耶稣与摩西在忠心方面的比较关系。
- source_word: Μωϋσῆς
  choice: 摩西
  rationale: 采用现代中文圣经及普通读者熟悉的标准译名。
- source_word: ἐν τῷ οἴκῳ αὐτοῦ
  choice: 在他的家中
  rationale: 依SBLGNT正文翻译，不把异文中的“全”纳入正文；保留“家”的意象，以衔接下文围绕房屋与家所展开的论述，也不在正文中明说代词所指。
theological_decisions:
- issue: ποιήσαντι用于圣子时的含义
  choice: 设立
  alternative: 造了
  rationale: 上下文侧重耶稣受差遣和任职，而非讨论其受造与否；“设立”较能传达此处语境，同时以脚注保留希腊词的基本义和真实歧义。
- issue: “他的家”中αὐτοῦ的所指
  choice: 保留“他的家”
  alternative: 明确译作“神的家”或“摩西的家”
  rationale: 民数记12:7的呼应及本段论证倾向于指神的家，但希腊文只用代词；正文保留代词，不替读者完全消解其所指。
- issue: 是否在正文加入“全”
  choice: 正文作“在他的家中”
  alternative: “在他的全家中”
  rationale: SBLGNT所列正文没有表示“全”的词；部分抄本加入该词，更贴近民数记12:7的措辞，因此在脚注交代。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“忠于”与后半句“忠心”避免机械重复，又保留同一πιστός概念；“家”保留原文及下文的核心意象。所有脚注标记均已置于正文对应位置。
