  yaml_path: translation/nt/hebrews/003/018.yaml
  text: And to whom did he swear that they would not enter his rest[a], if not to those who disobeyed?
translation:
  language: zh_hans
  text: 他又起誓说，哪些人不得进入他的安息呢？不正是那些不顺从[a]的人吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“那些不肯听从的人”。这里的希腊词可强调拒绝顺从；按上下文，这种不顺从与不信密切相关（参3:19）。
    reason: lexical_alternative
lexical_decisions:
- source_word: τίσιν
  choice: 向谁
  rationale: 这是指人的与格复数疑问代词；“向谁”自然表达起誓所针对的对象，并保留反问结构。
- source_word: δὲ
  choice: 又
  rationale: δέ承接上文连续的反问，并不强调强烈转折；“又”符合现代汉语行文。
- source_word: ὤμοσεν
  choice: 起誓
  rationale: 准确表达ὀμνύω所具有的郑重宣誓含义。
- source_word: μὴ εἰσελεύσεσθαι
  choice: 说他们绝不可进入
  rationale: 不定式短语说明誓言的内容；“说”使汉语结构清楚，“绝不可”体现誓言中否定的郑重语气。
- source_word: εἰς τὴν κατάπαυσιν αὐτοῦ
  choice: 进入他的安息
  rationale: 保留“进入”的方向性，并以“他的安息”承接《希伯来书》中关于上帝安息的主题用语。
- source_word: εἰ μὴ
  choice: 不正是……吗
  rationale: 该短语在反问中引出唯一预期答案；此译法自然保留希腊文的修辞力量。
- source_word: τοῖς ἀπειθήσασιν
  choice: 向那些不顺从的人
  rationale: ἀπειθέω在此侧重不肯听从、拒绝顺服；译作“不顺从”保留其与下一节“不信”密切相关却不完全等同的含义。
theological_decisions:
- issue: 警告段落中ἀπειθήσασιν的译法
  choice: 不顺从的人
  alternative: 不信的人；不肯听从的人
  rationale: 本节使用ἀπειθέω，而下一节使用与“不信”相关的词。主文译作“不顺从”，既反映本词的行为和意志层面，也不把上下文中“不信”与“不顺从”的关系过早合并。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以两个相连的反问句再现原文论证节奏；“安息”作为本书主题术语保持稳定。脚注标记置于其实际说明的“不顺从”之后。
