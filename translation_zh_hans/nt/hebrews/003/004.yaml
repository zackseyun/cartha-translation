  text: πᾶς γὰρ οἶκος κατασκευάζεται ὑπό τινος, ὁ ⸀δὲ πάντα κατασκευάσας θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/004.yaml
  text: For every house is built by someone[a], but God is the one who built all things.
translation:
  language: zh_hans
  text: 因为每一座房屋都是由人建造的，但建造万有的是上帝。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς
  choice: 每一座
  rationale: πᾶς修饰单数οἶκος，具有逐一概括的分配意义；“每一座”自然准确，量词“座”也符合汉语对房屋的通常搭配。
- source_word: γὰρ
  choice: 因为
  rationale: γάρ承接上文，说明前述论证的理由；“因为”清楚保留其解释性逻辑关系。
- source_word: οἶκος
  choice: 房屋
  rationale: 上下文借οἶκος形成实体建筑与上帝家室之间的意象关联；此处采用具体的“房屋”，避免提前将比喻解释为“家人”或“家室”。
- source_word: κατασκευάζεται
  choice: 建造
  rationale: 在房屋意象中，κατασκευάζω表示建造或营造；“建造”既自然，又能与后句同一词根的分词保持呼应。
- source_word: ὑπό τινος
  choice: 由人
  rationale: ὑπό加属格表示施事者，τινος是不定代词；现代汉语以“由人”简洁表达“由某个人”，并不特指某一人。
- source_word: ὁ δὲ
  choice: 但……的是
  rationale: δέ表示由一般原则转向结论时的轻微对照；汉语“但……的是”可自然呈现实词化分词结构，并将焦点落在末尾的“上帝”。
- source_word: πάντα
  choice: 万有
  rationale: πάντα指范围广泛的“一切事物”；“万有”庄重而简洁，保留宇宙性范围，又不额外加入“宇宙”等解释。
- source_word: κατασκευάσας
  choice: 建造
  rationale: 采用与前半句相同的“建造”，保留原文κατασκευάζω的词汇重复和由房屋推及万有的论证联系。
- source_word: θεός
  choice: 上帝
  rationale: θεός在此明确指出建造万有者的身份；“上帝”是现代标准普通话中清楚、通行的对应词。
theological_decisions:
- issue: 末句如何表达上帝与建造万有者的同一关系
  choice: 建造万有的是上帝
  alternative: 但上帝建造了万有
  rationale: 原文ὁ δὲ πάντα κατασκευάσας θεός以实词化分词短语指出“建造万有者”的身份是上帝。所选译法保留这一识别式、强调性的结构，不将它弱化为仅仅陈述一个动作。
- issue: πάντα在本节中的范围
  choice: 万有
  alternative: 一切房屋
  rationale: πάντα为中性复数，范围从前句的每一座房屋扩展到一切受造或被构成之物；译作“万有”保留这一广度，不把范围缩限为房屋。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“每一座房屋……建造万有”保留原文由具体建筑转向普遍创造的类比；后句使用“……的是上帝”凸显原文末位θεός的识别和强调作用。
