  text: βλέπετε, ἀδελφοί, μήποτε ἔσται ἔν τινι ὑμῶν καρδία πονηρὰ ἀπιστίας ἐν τῷ ἀποστῆναι ἀπὸ θεοῦ ζῶντος,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/012.yaml
  text: Watch out[a], brothers[c][b], lest there be in any of you an evil heart of unbelief in turning away from the living God.
translation:
  language: zh_hans
  text: 弟兄们[a]，你们要谨慎，免得你们中间有人存着邪恶、不信的心[b]，而离弃[c]永活的上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄们”译自阳性复数 ἀδελφοί；在这里可以用来称呼包括女性在内的信徒群体。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“邪恶、不忠的心”或“邪恶、不信实的心”。
    reason: alternative_reading
  - marker: c
    text: 也可译作“转离”或“背离”。原文此处可表示伴随情形、表现或结果。
    reason: alternative_reading
lexical_decisions:
- source_word: βλέπετε
  choice: 你们要谨慎
  rationale: 现在时主动命令语气复数，表达持续警戒。“要谨慎”自然、庄重，也保留警告的力度。
- source_word: ἀδελφοί
  choice: 弟兄们
  rationale: 阳性复数呼格；“弟兄们”保留原文形式和早期信徒群体中的称呼习惯，并以脚注说明可包括女性信徒。
- source_word: μήποτε ἔσται ἔν τινι ὑμῶν
  choice: 免得你们中间有人怀着
  rationale: “免得”准确引出应当防范的可能后果；“你们中间有人怀着”比逐字译作“在你们某人里面有”更符合现代汉语。
- source_word: καρδία πονηρὰ ἀπιστίας
  choice: 邪恶、不信的心
  rationale: “心”保留圣经中作为思想、意志和情感中心的意象；“邪恶、不信”传达 πονηρά 与 ἀπιστία 的修饰关系，同时保持汉语自然。
- source_word: ἐν τῷ ἀποστῆναι
  choice: 因而离弃
  rationale: ἀφίστημι 在此表示离开、转离。“离弃”传达其严肃性而不直接套用后来的技术性神学术语；“因而”表达不信之心与离弃行为的紧密联系。
- source_word: ἀπὸ θεοῦ ζῶντος
  choice: 永活的上帝
  rationale: “永活的上帝”是自然且庄重的圣经用语，体现真神是活着的，并与无生命的偶像形成隐含对照。
theological_decisions:
- issue: ἀπιστίας 应译为“不信”还是“不忠”
  choice: 不信
  alternative: 不忠／没有信实
  rationale: 本段以旷野世代未能相信上帝的话为背景，“不信”最贴合上下文；脚注保留“不忠”的词义可能性。
- issue: ἀποστῆναι 是否应译成技术性较强的“背道”
  choice: 离弃
  alternative: 转离／背道
  rationale: “离弃”既保留警告的严重性，也不把该动词预先限定为后世神学中的技术术语。
- issue: ἐν τῷ ἀποστῆναι 与“不信的心”之间的关系
  choice: 因而
  alternative: 在离弃……时／表现为离弃
  rationale: 原文结构可表达伴随情形、表现或结果。“因而”在现代汉语中清楚呈现二者的紧密关系，但脚注提示原文关系并非只能理解为严格因果。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“免得”“永活的上帝”保留经文警戒性的语气；避免使用过度技术化的“背道”，并用脚注保留 ἀπιστία 与 ἐν τῷ ἀποστῆναι 的语义张力。
