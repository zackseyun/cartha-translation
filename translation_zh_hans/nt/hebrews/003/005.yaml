- from: 摩西作为仆役，在他的全家[a]中固然忠心，为以后要讲的事作见证[b]；
  to: 摩西作为仆人，在神的全家中固然尽忠，为将来要传讲的事作见证；
  rationale: 修订明确本段“神的家”的语境所指，同时保留“家”的比喻而不将其释作“神的子民”。“仆人”和“尽忠”更自然、庄重地对应 θεράπων 与 πιστός。“将来要传讲的事”保留未来被动分词的前瞻性及未明示传讲者的含蓄。
