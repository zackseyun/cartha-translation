review_pass:
  verdict: revise
  source_fidelity: 原译基本传达了摩西的忠心、仆役身份、见证功能及对将来言说之事的前瞻性。但“他的全家”在现代汉语中通常指家庭成员，弱化并误导了 οἶκος 在本段及下文持续发展的“家／家室”比喻；且本节语境中 αὐτοῦ 所指为神，宜明确为“神的全家”。“仆役”略带日常雇役、身份较低的色彩，不如“仆人”恰当地表达 θεράπων 的尊荣服侍意味。
  naturalness: 句子整体通顺，但“在他的全家中”不自然，也容易被理解为“在他的所有家人当中”。调整为“在神的全家中……尽忠”更合现代庄重书面语，并保留与下一节“家”的连贯意象。
  terminology: 建议以“神的全家”对应本段的 οἶκος，避免将其缩窄为摩西的家庭；以“仆人”对应 θεράπων，避免“奴仆”的强制性含义，也不把“仆役”的近代日常职业色彩带入经文。“尽忠”适切表达 πιστός 在受托服侍中的可靠。
  issues:
  - severity: medium
    issue: “他的全家”误导 οἶκος 的比喻意义，并使代词所指不够清楚。
    rationale: οἶκος 在此承接《民数记》12:7，并在来3:6继续指神的家；现代汉语“全家”通常是全体家人，不能充分承载本段的“家”意象。按紧邻语境，αὐτοῦ 指神，译作“神的全家”既准确又自然。
  - severity: low
    issue: “仆役”不够贴合 θεράπων 的庄重、尊荣服侍意味。
    rationale: “仆人”在现代中文圣经语境中较中性且庄重，能与下一节儿子的身份形成对照，而不引入“奴隶”或日常雇役的额外联想。
  - severity: low
    issue: 脚注a将“全家”与“整个家”并列，未澄清“家”并非仅指家庭成员。
    rationale: 应说明此处保留“家”的意象，并可译为“全家”或“整个家”；正文的“神的全家”需由脚注说明其并非仅指家人。
  revised_text: 摩西作为仆人，在神的全家中固然尽忠，为将来要传讲的事作见证；
  revised_footnotes:
  - marker: a
    text: “全家”也可译作“整个家”。这里的“家”保留本段的比喻意象，并在下文继续沿用，并非仅指家庭成员。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“为将要讲述的事作见证”。原文没有明说传讲者。
    reason: alternative_reading
  revision_rationale: 修订明确本段“神的家”的语境所指，同时保留“家”的比喻而不将其释作“神的子民”。“仆人”和“尽忠”更自然、庄重地对应 θεράπων 与 πιστός。“将来要传讲的事”保留未来被动分词的前瞻性及未明示传讲者的含蓄。
