  text: καὶ Μωϋσῆς μὲν πιστὸς ἐν ὅλῳ τῷ οἴκῳ αὐτοῦ ὡς θεράπων εἰς μαρτύριον τῶν λαληθησομένων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/005.yaml
  text: And Moses indeed was faithful in all his house as a servant[a], for a testimony of the things that would be spoken later[b],
translation:
  language: zh_hans
  text: 摩西作为仆人，在神的全家中固然尽忠，为将来要传讲的事作见证；
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: （承接上文，不另译）
  rationale: 本节延续前文对摩西与耶稣的比较；中文可借句意自然承接，无须机械译出“并且”。
- source_word: Μωϋσῆς μὲν
  choice: 摩西……固然
  rationale: “固然”自然体现 μὲν 所引出的对照，并为下一节的 δέ 留下转折空间。
- source_word: πιστὸς
  choice: 忠心
  rationale: 表示摩西在受托职分上的可靠与尽忠，符合本段语境。
- source_word: ἐν ὅλῳ τῷ οἴκῳ αὐτοῦ
  choice: 在他的全家中
  rationale: “全家”兼有家与家中成员的意象，可延续本段 οἶκος 的比喻；“他的”保留原文代词，没有在正文中擅自明确所指。
- source_word: ὡς θεράπων
  choice: 作为仆役
  rationale: θεράπων 指承担服侍职责的人，并带有尊荣意味；“仆役”既表达服侍身份，也避免译成“奴隶”所带来的过强从属含义。
- source_word: εἰς μαρτύριον
  choice: 作见证
  rationale: 表达摩西忠心服侍所具有的见证作用，中文简洁自然。
- source_word: τῶν λαληθησομένων
  choice: 为以后要讲的事
  rationale: 保留未来被动分词的前瞻性，同时不在正文中添加原文没有明说的讲话者。
theological_decisions:
- issue: “他的全家”所指为何
  choice: 保留“他的”与“全家”的表达
  alternative: 明确译作“神的全家”或解释为“神的子民”
  rationale: 上下文很可能指神的家，但原文在本节使用代词 αὐτοῦ；保留代词及家之意象，既衔接《民数记》12:7，也避免在正文中消除原有表达空间。
- issue: θεράπων 所表达的摩西身份
  choice: 仆役
  alternative: 仆人、侍从、奴仆
  rationale: 该词强调尊荣的服侍职责，不等同于通常表示奴仆的 δοῦλος；如此也保留下一节仆役与儿子的对照。
- issue: “以后要讲的事”的讲话者和具体内容
  choice: 不明确添加讲话者或把内容限定为某一类启示
  alternative: “神以后要说的事”或“后来关于基督的启示”
  rationale: 未来被动形式具有前瞻性，却没有在本句明说讲话者或具体内容；译文保留这一含蓄性。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“固然”承接下一节的对照；句末用分号，表示本节语意尚待下一节完成。
