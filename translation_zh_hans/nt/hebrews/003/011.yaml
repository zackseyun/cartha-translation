  text: ὡς ὤμοσα ἐν τῇ ὀργῇ μου· Εἰ εἰσελεύσονται εἰς τὴν κατάπαυσίν μου.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/011.yaml
  text: as I swore in my wrath[a], ‘They shall never enter my rest.’
translation:
  language: zh_hans
  text: '正如我在愤怒中起誓说：[a]

    “他们绝不能进入我的安息。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“如果他们将进入我的安息”，这是誓言套语，意思是“他们绝不能进入我的安息”。
    reason: 说明闪语式誓言结构的字面形式与实际语力。
lexical_decisions:
- source_word: ὡς
  choice: 正如
  rationale: 承接上文所引经文，引出誓言内容；“正如”既保留比较、引述关系，也符合现代汉语表达。
- source_word: ὤμοσα
  choice: 我起誓说
  rationale: 直接表达ὀμνύω的起誓含义；补出“说”使其自然引出后面的直接引语，并未增添实质内容。
- source_word: ἐν τῇ ὀργῇ μου
  choice: 在愤怒中
  rationale: 保留介词结构和神圣震怒的严肃色彩；“愤怒”庄重而为现代读者易懂。
- source_word: Εἰ εἰσελεύσονται
  choice: 他们绝不能进入
  rationale: εἰ加将来时在此是闪语式誓言套语，表强烈否定，而非普通条件句；“绝不能”明确传达断然禁止、绝不获准进入的语力。
- source_word: εἰς τὴν κατάπαυσίν μου
  choice: 进入我的安息
  rationale: 保留“进入”的空间隐喻，并以“安息”延续《希伯来书》中κατάπαυσις的主题，不将其提前限定为土地、天国或内心平安。
theological_decisions:
- issue: 誓言套语Εἰ εἰσελεύσονται的表达
  choice: 他们绝不能进入我的安息
  alternative: 如果他们将进入我的安息
  rationale: 原文形式上是“如果他们进入……”，但在希腊文所承载的闪语式誓言中，这是省略后果的强烈否定。正文传达其实际语力，脚注保留字面形式，既避免误读，也让读者看见原文特点。
- issue: κατάπαυσις的语义范围
  choice: 安息
  alternative: 安息之地
  rationale: “安息”保留诗篇引文与《希伯来书》论证中的神学张力和主题连贯性，不擅自将所指缩窄为某一地点或状态。
- issue: ὀργή的表达
  choice: 愤怒
  alternative: 震怒
  rationale: “愤怒”准确、自然且庄重；不借“震怒”额外强化司法审判色彩，同时仍保留神在悖逆面前发怒的严肃含义。
translation_notes:
  register: 采用现代、庄重、清晰的普通话书面语。“起誓说”自然引出引文；“安息”保留经文互涉和后文论证所需的开放性。脚注标记[a]置于引语前的引述句末，清楚对应整句誓言套语。
