source:
  edition: SBLGNT
  text: πλείονος γὰρ ⸂οὗτος δόξης⸃ παρὰ Μωϋσῆν ἠξίωται καθ’ ὅσον πλείονα τιμὴν ἔχει τοῦ οἴκου ὁ κατασκευάσας αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/003.yaml
  text: For this one has been counted worthy of more glory than Moses, just as the one who built the house has greater honor than the house.
translation:
  language: zh_hans
  text: 因为他被认为配得比摩西更大的荣耀，正如建造房屋的人比房屋本身更有尊荣。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗτος
  choice: 他
  rationale: 该指示代词承接上文的耶稣；汉语用“他”自然清楚，同时不在本节重复补入名字。
- source_word: ἠξίωται
  choice: 被认为配得
  rationale: 保留完成时被动语态所表达的评定及其持续效力，也避免把“配得”简化为单纯“拥有”。
- source_word: δόξης
  choice: 荣耀
  rationale: 对应“δόξα”的宗教及尊荣语域，并与本句后半的“尊荣”保持相关而不强行同词化。
- source_word: καθ’ ὅσον
  choice: 正如
  rationale: 在此引出与前句相称的类比和论证依据；“正如”符合现代汉语，并保留两部分的对应关系。
- source_word: κατασκευάσας
  choice: 建造
  rationale: 在“房屋”语境中自然表达建造、置备之意；不额外限定为创造或设计。
- source_word: οἴκου
  choice: 房屋
  rationale: 本节的建造者与所建之物形成直接类比；“房屋”保留具体意象，也让上下文可能延展出的“家”之含义保持开放。
- source_word: τιμὴν
  choice: 尊荣
  rationale: 与前半句“荣耀”相呼应，同时保留 τιμή 与 δόξα 的词汇区别。
theological_decisions:
- issue: “他”的身份是否在本节明说
  choice: 译作“他”，由上文确定所指
  alternative: 直接译作“耶稣”或“这一位”
  rationale: 原文使用指示代词 οὗτος，而非再次出现专名；保留代词更忠实于篇章衔接，且不改变其明确所指。
- issue: 建造者与房屋的类比是否直接解释为基督创造万有
  choice: 仅翻译类比，不在正文加入解释
  alternative: 译成“创造这一家的基督”之类的神学释义
  rationale: 本节本身说的是建造者比房屋更有尊荣；其完整神学指向需结合下一节判断，不应在本节中提前消解张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。句式保留原文“因为……正如……”的论证结构；以“荣耀／尊荣”区分 δόξα 与 τιμή，并用“房屋本身”明确比较对象，避免末尾代词在汉语中指代含混。
