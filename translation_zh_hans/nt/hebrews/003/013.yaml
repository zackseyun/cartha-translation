  text: ἀλλὰ παρακαλεῖτε ἑαυτοὺς καθ’ ἑκάστην ἡμέραν, ἄχρις οὗ τὸ Σήμερον καλεῖται, ἵνα μὴ σκληρυνθῇ ⸂τις ἐξ ὑμῶν⸃ ἀπάτῃ τῆς ἁμαρτίας·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/013.yaml
  text: But encourage one another every day[b][a], as long as it is called “Today,” so that none of you may be hardened by the deceitfulness of sin.
translation:
  language: zh_hans
  text: 但你们要天天彼此劝勉[b]，趁着还称为“今天”的时候[a]，免得你们中间有人被罪的迷惑所蒙蔽，以致变得刚硬。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “今天”呼应诗篇95篇，指人必须回应上帝呼召的当前时机。
    reason: cross_reference
  - marker: b
    text: “劝勉”也可译作“劝告”或“鼓励”；希腊语原词可按语境表示劝勉、敦促、鼓励或安慰。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: 相反
  rationale: 承接上一节的警告，表达强烈转折；在汉语中比单用“但”更清楚地显出应当采取的相反行动。
- source_word: παρακαλεῖτε
  choice: 劝勉
  rationale: 此动词兼有劝告、敦促和鼓励之意；“劝勉”在这里既保留警戒力度，也包含扶持人坚持信靠的意味。
- source_word: ἑαυτοὺς
  choice: 彼此
  rationale: 复数反身代词在此具有相互作用的含义，指群体成员互相劝勉，而不是各人只劝自己。
- source_word: καθ’ ἑκάστην ἡμέραν
  choice: 天天
  rationale: 自然简洁地表达每天持续、反复进行的行动。
- source_word: ἄχρις οὗ τὸ Σήμερον καλεῖται
  choice: 趁着还称为“今天”的时候
  rationale: 既保留καλεῖται的被动表达，也传达这段称为“今天”的时期仍在延续；引号标明对诗篇95篇用语的呼应。
- source_word: ἵνα μὴ
  choice: 免得
  rationale: 自然地表达应当避免的目的或结果。
- source_word: σκληρυνθῇ
  choice: 变得刚硬
  rationale: 保留状态发生变化的被动含义，同时不在正文中补入原文没有明说的“心”。
- source_word: τις ἐξ ὑμῶν
  choice: 你们中有人
  rationale: 在“免得”的否定范围内，自然表达群体中任何一个人都不应落入这种情形。
- source_word: ἀπάτῃ τῆς ἁμαρτίας
  choice: 受罪迷惑
  rationale: 将与格理解为造成刚硬的方式或因素；“迷惑”体现罪具有欺骗性，又符合现代汉语表达。
theological_decisions:
- issue: 彼此劝勉的群体性
  choice: 彼此
  alternative: 自己
  rationale: 虽然原词形式上是复数反身代词，但在复数命令语境中具有相互含义；译作“彼此”准确呈现共同体成员之间的责任。
- issue: “今天”的经文互文含义
  choice: 加引号的“今天”
  alternative: 仅作普通时间副词“今天”
  rationale: 本段延续对诗篇95篇的引用和阐释，“今天”不仅指普通日历日期，也指人应当回应上帝呼召的当前时机；引号保留这一含义而不在正文中过度解释。
- issue: 刚硬所指的内在状态
  choice: 变得刚硬
  alternative: 心里刚硬
  rationale: 语境涉及人的内在抗拒，但本节希腊文本没有明说“心”；正文不补入该词，以避免把隐含意义当成明文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“天天彼此劝勉”简洁自然；分号将持续履行的命令与其目的连接起来。正文保留“今天”的引文色彩和罪之迷惑所造成的刚硬，同时避免加入原文未明说的“心”。
