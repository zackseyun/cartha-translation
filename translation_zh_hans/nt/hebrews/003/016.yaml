  text: τίνες γὰρ ἀκούσαντες παρεπίκραναν; ἀλλ’ οὐ πάντες οἱ ἐξελθόντες ἐξ Αἰγύπτου διὰ Μωϋσέως;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/016.yaml
  text: For who[a], when they heard, rebelled? Was it not all those who came out of Egypt through Moses?
translation:
  language: zh_hans
  text: 因为，听见了却悖逆[a]的是谁呢？岂不都是那些借着摩西从埃及出来的人吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“听见后激怒了神”（或“使神苦恼”）。这个希腊语动词较字面的意思是“激怒”或“使苦恼”；这里指他们以悖逆触怒神。
    reason: lexical_alternative
lexical_decisions:
- source_word: τίνες
  choice: 是谁
  rationale: 保留复数对象的身份追问和反问语气；现代汉语用“是谁”已能自然指向这一群人，无须生硬译成“哪些人”。
- source_word: γὰρ
  choice: 因为
  rationale: 承接上文，为前面的劝诫提供解释和论据，保留原文的逻辑连接。
- source_word: ἀκούσαντες
  choice: 听见了
  rationale: 以主句前的动作表达不定过去时分词，表明他们先听见，随后却悖逆。
- source_word: παρεπίκραναν
  choice: 悖逆
  rationale: 在旷野世代的语境中，此词指以不顺从触怒神；“悖逆”准确传达反抗的性质，同时在脚注保留更字面的表达。
- source_word: ἀλλ’ οὐ πάντες
  choice: 岂不是所有……吗
  rationale: 用自然的汉语反问表达预期的肯定答案；ἀλλά在这里引出答案，不必另译为强转折的“但是”。
- source_word: οἱ ἐξελθόντες ἐξ Αἰγύπτου
  choice: 从埃及出来的人
  rationale: 自然而直接地保留出埃及的空间动作和实指群体。
- source_word: διὰ Μωϋσέως
  choice: 借着摩西
  rationale: 保留διά加属格所表达的中介或施行者含义，避免扩译成较解释性的“在摩西带领下”。
theological_decisions:
- issue: παραπικραίνω在旷野世代语境中的含义
  choice: 正文译为“悖逆”
  alternative: “惹怒”“激怒”“使苦恼”
  rationale: 上下文所说的不只是造成某种情绪，而是以不信和不顺从触怒神；“悖逆”传达其叙事与神学力度，脚注则保留原词较字面的可能表达。
- issue: πάντες的概括力度
  choice: 保留“所有”
  alternative: 弱化为“那些”或“大多数”
  rationale: 原文明确使用πάντες；即使出埃及记叙事中存在个别例外，也不应在本节正文中擅自削弱其概括性反问。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“悖逆”略带经文语体，但在此处准确且通行；两个连续反问保留原文的论证节奏。
