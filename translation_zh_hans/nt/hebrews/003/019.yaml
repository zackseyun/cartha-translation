id: HEB.3.19
reference: Hebrews 3:19
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ βλέπομεν ὅτι οὐκ ἠδυνήθησαν εἰσελθεῖν δι’ ἀπιστίαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/019.yaml
  text: And we see that they were not able to enter because of unbelief[a].
translation:
  language: zh_hans
  text: 由此可见，他们不能进入，是因为不信[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“不忠信”。原文所用的词不仅可指不相信，也可包含不忠、拒绝信靠的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: 由此
  rationale: καί承接前文并引出总结。结合本节的结论性语气，译作“由此”比机械地译作“并且”更符合现代汉语篇章衔接，同时不增加过强的推论意味。
- source_word: βλέπομεν
  choice: 可见
  rationale: 原文是第一人称复数“我们看见”。汉语以“可见”自然表达作者邀请读者共同观察所得的结论；若直译“我们看见”，在此论证语境中略显生硬。
- source_word: ὅτι
  choice: （由句式体现）
  rationale: ὅτι引出所看见的内容；汉语“可见”之后可直接接结论，无须另译。
- source_word: οὐκ ἠδυνήθησαν
  choice: 他们不能
  rationale: 保留δύναμαι所表达的能力或可能性，简洁自然，不把这种不能进一步解释为外在禁止或内在无能。
- source_word: εἰσελθεῖν
  choice: 进入
  rationale: 忠实表达“进入”；其对象可由上文所谈的安息或应许之地确定，本节不擅自补明。
- source_word: δι’
  choice: 是因为
  rationale: διά接宾格在这里表示原因，“是因为”清楚呈现他们不能进入的缘由。
- source_word: ἀπιστίαν
  choice: 不信
  rationale: 该词在上下文中指以色列人不相信、不信靠上帝的话。“不信”是现代汉语中清楚自然的对应语，同时以脚注保留“不忠信”的语义可能。
theological_decisions:
- issue: ἀπιστία与πίστις相关语义的表达
  choice: 不信
  alternative: 不忠信
  rationale: 希伯来书3章的直接语境强调他们不相信、拒绝信靠上帝的应许，因此正文用“不信”。不过，该词也可能包含不忠、拒绝信靠的意味，故以脚注保留，避免把信念缺失与关系上的不忠截然分开。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“由此可见”自然呈现本节承接前文所得的结论；“进入”的对象不在正文中补出，以保留原文的简洁及其与上下文的联系。
