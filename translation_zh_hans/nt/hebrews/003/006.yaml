  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Χριστὸς δὲ ὡς υἱὸς ἐπὶ τὸν οἶκον αὐτοῦ· ⸀ὃς οἶκός ἐσμεν ἡμεῖς, ⸀ἐὰν τὴν παρρησίαν καὶ τὸ καύχημα τῆς ⸀ἐλπίδος κατάσχωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/006.yaml
  text: But the Messiah was faithful as a Son over his house[a], whose house we are[c][b], if we hold fast our boldness and the boast of our hope.
translation:
  language: zh_hans
  text: 但弥赛亚[a]作为儿子，忠心地管理他的家[d]；我们若持守坦然无惧[b]和盼望的夸耀[c]，我们就是他的家。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弥赛亚”也可译作“基督”。希腊语Χριστός既可作称号，也可作近似专名的称呼。
    reason: alternative_reading
  - marker: b
    text: “坦然无惧”也可译作“充满把握”或“胆量”。希腊语παρρησία可指坦率、公开或充满把握的勇气。
    reason: lexical_alternative
  - marker: c
    text: “盼望的夸耀”也可译作“对盼望的自豪”或“因盼望而有的欢欣”。希腊语καύχημα可指所夸耀的事、夸耀本身或欢欣自豪。
    reason: lexical_alternative
  - marker: d
    text: “他的家”中的“他”按上文最自然可指上帝，但句法也容许读者将这家与儿子联系起来。
    reason: referent_ambiguity
lexical_decisions:
- source_word: Χριστὸς
  choice: 弥赛亚
  rationale: 这里与摩西形成对照，Χριστός的称号意味较为突出；“弥赛亚”也保留其受膏者的救赎历史背景。
- source_word: δὲ
  choice: 但
  rationale: 承接第5节关于摩西的陈述，并凸显摩西作为仆人与弥赛亚作为儿子之间的对照。
- source_word: ὡς υἱὸς
  choice: 作为儿子
  rationale: 保留ὡς的身份或比较意味，不把原文未明说的内容加入译文。
- source_word: ἐπὶ τὸν οἶκον αὐτοῦ
  choice: 治理他的家
  rationale: ἐπί加宾格在此表示居于其上并负有权柄；“治理”比生硬的“在……之上”更符合现代汉语，同时“家”保留οἶκος兼指家室与家属群体的比喻。
- source_word: ὃς οἶκός ἐσμεν ἡμεῖς
  choice: 我们就是他的家
  rationale: 用自然汉语表达关系从句，并保留信徒群体就是“家”的比喻；“他的”不强行判定所指是上帝还是儿子。
- source_word: ἐὰν
  choice: 只要
  rationale: 表达ἐάν引出的真实条件；“只要”在现代汉语中自然，又不对坚忍或离弃的神学问题作额外裁定。
- source_word: παρρησίαν
  choice: 坦然无惧的心
  rationale: παρρησία可表示公开、坦率和有把握的勇气；此译法兼顾内在把握与无惧表现，符合《希伯来书》的语境。
- source_word: καύχημα
  choice: 夸耀
  rationale: 保留该词“所夸耀之事”或“自豪、欢欣”的鲜明修辞力度，不将它平化为一般的“信心”。
- source_word: τῆς ἐλπίδος
  choice: 因盼望而有的
  rationale: 将属格理解为夸耀的根据或来源，中文表达自然；不增添原文没有明说的盼望对象。
- source_word: κατάσχωμεν
  choice: 我们持守
  rationale: 准确表达在条件句中牢牢保有、不放弃之意，并保留经文对持续坚忍的要求。
theological_decisions:
- issue: Χριστός应译作称号还是近似专名
  choice: 弥赛亚
  alternative: 基督
  rationale: 本节在救赎历史的对照中谈到摩西和儿子，称号意味仍然鲜明；脚注保留传统的近似专名译法。
- issue: 如何表达ἐὰν引出的条件
  choice: 只要我们持守
  alternative: 如果我们持守
  rationale: “只要”清楚保留成为其家的陈述与持守之间的条件关系，但不借译文界定坚忍、确据或离弃的教义体系。
- issue: αὐτοῦ及后续所属关系所指为何
  choice: 以“他的”保留代词
  alternative: 明确译作“上帝的”或“弥赛亚的”
  rationale: 上下文首先延续“上帝的家”的图像，但句法也容易让读者将家与儿子联系起来；译文不替原文消除这种关系上的张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“治理”清楚表达儿子对家的权柄；“家”贯穿本节比喻，避免改成较抽象的“群体”。句末保留条件句的神学张力，不加解释性结论。
