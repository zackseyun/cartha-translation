revisions:
- from: 但弥赛亚[a]作为儿子，治理他的家[d]；我们就是他的家，只要我们持守坦然无惧的心[b]和因盼望而有的夸耀[c]。
  to: 但弥赛亚[a]作为儿子，忠心地管理他的家[d]；我们若持守坦然无惧[b]和盼望的夸耀[c]，我们就是他的家。
  rationale: 修订承接前文关于忠心的省略谓语，并以“管理”自然表达儿子在家之上的权柄。条件句改用“若”，两个持守对象则以并列名词简洁呈现。对“盼望”的属格关系及“他的家”的指代均不在正文中过度判定；脚注也修正了παρρησία不应直接等同于“信心”的问题。
