id: HEB.3.1
reference: Hebrews 3:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ὅθεν, ἀδελφοὶ ἅγιοι, κλήσεως ἐπουρανίου μέτοχοι, κατανοήσατε τὸν ἀπόστολον καὶ ἀρχιερέα τῆς ὁμολογίας ἡμῶν ⸀Ἰησοῦν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/001.yaml
  text: Therefore[a], holy brothers, sharers in a heavenly calling, consider Jesus, the apostle and high priest of our confession[c][b],
translation:
  language: zh_hans
  text: 所以，圣洁的弟兄们[a]，同享天上呼召的人[b]，你们要专心思想我们所宣认的使徒和大祭司耶稣[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄们”在这里是对整个信徒群体的称呼，包括女性。
    reason: cultural_note
  - marker: b
    text: 或译：“有份于属天呼召的人”。“天上”既可表示呼召来自天上，也可表示呼召具有属天的性质。
    reason: lexical_alternative
  - marker: c
    text: 或译：“你们要专心思想耶稣，就是我们信仰宣认中的使徒和大祭司。”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅθεν
  choice: 所以
  rationale: 承接上文，尤其是2:17—18所述耶稣的工作，引出由此而来的劝勉；“所以”自然保留推论关系。
- source_word: ἀδελφοὶ ἅγιοι
  choice: 圣洁的弟兄们
  rationale: 保留原文阳性复数称呼及“分别为圣、归属上帝”的修饰语；此处实际面向包括女性在内的全体信徒，另以脚注说明。
- source_word: κλήσεως ἐπουρανίου μέτοχοι
  choice: 同享天上呼召的人
  rationale: μέτοχοι表示共同有份或参与；“同享”简洁自然。ἐπουρανίου既可指呼召来自天上，也可指其属天性质，译文保留这层开放性。
- source_word: κατανοήσατε
  choice: 要专心思想
  rationale: 该命令要求集中注意、认真思量；“专心思想”比单纯“思想”更充分表达其关注和省察的力度。
- source_word: ἀπόστολον
  choice: 使徒
  rationale: 保留此处用于耶稣的明确称谓，也保留“奉差遣者”的神学关联，而不以解释性意译取代。
- source_word: ἀρχιερέα
  choice: 大祭司
  rationale: 这是犹太祭司制度中该职分的标准中文称谓，也是《希伯来书》的核心主题用语。
- source_word: τῆς ὁμολογίας ἡμῶν
  choice: 我们所宣认的
  rationale: ὁμολογία可指公开的承认或信仰宣认。此译将耶稣理解为信徒所宣认的对象，中文自然，同时以脚注保留该属格短语与两个称谓相连的另一种表达。
- source_word: Ἰησοῦν
  choice: 耶稣
  rationale: 采用该人名通行的现代中文译法。
theological_decisions:
- issue: ἀδελφοὶ的性别涵盖范围
  choice: 正文译作“弟兄们”，脚注说明包括女性信徒。
  alternative: 弟兄姊妹；信徒同伴
  rationale: 原文采用阳性复数亲属称谓，但在此是对整个信仰群体的称呼。正文保留原文形式，脚注交代其包容范围，避免读者误以为只指男性。
- issue: ἀπόστολον用于耶稣时的含义
  choice: 保留“使徒”这一称谓。
  alternative: 使者；奉差遣者
  rationale: 原文直接把ἀπόστολος用于耶稣。保留称谓可呈现经文独特措辞及“受差遣”的含义，不预先套入后世教会职分的限制。
- issue: τῆς ὁμολογίας ἡμῶν的句法关系
  choice: 正文译作“我们所宣认的使徒和大祭司耶稣”。
  alternative: “耶稣，就是我们信仰宣认中的使徒和大祭司”
  rationale: 该属格短语可以较自然地表达为耶稣是信徒宣认的对象，也可以理解为两个称谓与群体的信仰宣认相关。正文采用流畅而有充分语义依据的读法，并在脚注保留另一种可能，避免消除原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“圣洁的弟兄们”保留原文正式称呼；“同享……的人”使同位结构在中文中清楚；“专心思想”体现命令的专注力度。称谓“大祭司”和“使徒”沿用通行圣经术语，但整体句法避免古奥。
