  text: τίσιν δὲ προσώχθισεν τεσσεράκοντα ἔτη; οὐχὶ τοῖς ἁμαρτήσασιν, ὧν τὰ κῶλα ἔπεσεν ἐν τῇ ἐρήμῳ;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/017.yaml
  text: And with whom was he angry for forty years? Was it not with those who sinned[a], whose bodies fell in the wilderness?
translation:
  language: zh_hans
  text: 神又向谁发怒四十年呢？不正是那些犯了罪、尸身[a]倒在旷野的人吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：他们的身体（或肢体）倒在旷野。
    reason: κῶλα本义可指身体的肢体；在本句旷野审判的语境中，主文译为“尸身”，脚注保留较字面的词汇可能性。
lexical_decisions:
- source_word: προσώχθισεν
  choice: 发怒
  rationale: 该动词表示对人愤怒或厌憎；“发怒”在现代汉语中自然清楚，也符合这里反问的语气，同时不过度强化为“憎恶”。
- source_word: τεσσεράκοντα ἔτη
  choice: 四十年
  rationale: 宾格短语表示持续时间；汉语直接说“发怒四十年”即可自然表达“长达四十年”。
- source_word: ἁμαρτήσασιν
  choice: 那些犯了罪……的人
  rationale: 忠实表达过去时分词“犯罪了的人”；“犯了罪”简洁自然，不额外限定为某一次或多次罪行。
- source_word: κῶλα
  choice: 尸身
  rationale: κῶλα本义可指肢体，在此旷野审判的语境中指倒毙者的遗体。“尸身”既保留死亡与审判的严肃意味，也比“尸首”更庄重，比泛称“身体”更准确。
- source_word: ἔπεσεν
  choice: 倒在
  rationale: 保留“倒下”的形象；与“尸身”连用已清楚暗示死亡，无须增译“死”。
- source_word: ἐν τῇ ἐρήμῳ
  choice: 在旷野
  rationale: “旷野”是现代中文圣经语境中自然且准确的表达，并保留以色列旷野漂流的历史背景。
theological_decisions:
- issue: προσώχθισεν的省略主语所指
  choice: 明确译作“神”
  alternative: 用“他”承接上文
  rationale: 希腊文主语由上下文承接，所指为神。单节呈现时，明确译出“神”可避免现代汉语代词指向不清，并未加入原文语境之外的神学判断。
- issue: κῶλα的语义力度
  choice: 尸身
  alternative: 身体／肢体
  rationale: 本句指旷野中因审判而倒毙的人；“尸身”呈现这一死亡含义及原词较强烈的色彩，同时保持庄重，不将其弱化为普通的“身体”。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“神又向谁发怒四十年呢？不正是……”保留原文连续反问的论证力量；后半句用“那些犯了罪、尸身倒在旷野的人”保持关系结构清晰。
