  text: τεσσεράκοντα ἔτη· διὸ προσώχθισα τῇ γενεᾷ ⸀ταύτῃ καὶ εἶπον· Ἀεὶ πλανῶνται τῇ καρδίᾳ· αὐτοὶ δὲ οὐκ ἔγνωσαν τὰς ὁδούς μου·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/010.yaml
  text: For forty years[a], therefore, I was provoked with this generation, and said, ‘They always go astray in their hearts[b], but they have not known my ways.’
translation:
  language: zh_hans
  text: '四十年之久，因此我向这一代人发怒了[a]，并且说：


    “他们的心总是迷失[b]；

    他们却不认识我的道路。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “向……发怒”也可译作“厌恶这一代人”；希腊文表达强烈的不悦，并可带有厌恶的意味。
    reason: lexical_alternative
  - marker: b
    text: 希腊文直译为“在心里”，其中“心”为单数，可能把这一代人作为一个整体来看。
    reason: lexical_alternative
lexical_decisions:
- source_word: τεσσεράκοντα ἔτη
  choice: 四十年之久
  rationale: 将时间长度的宾格自然译出；“之久”明确表达持续时间，也保留与诗篇引文上下文的衔接。
- source_word: διὸ
  choice: 因此
  rationale: 保留该连接词所表达的推论或结果关系，并清楚承接上文。
- source_word: προσώχθισα
  choice: 我厌烦了
  rationale: 该词表达强烈的不悦，甚至可带厌恶意味；“厌烦”比单纯“发怒”更能传达持续受到触犯后的强烈反感，同时避免强化成“憎恶”。
- source_word: τῇ γενεᾷ ταύτῃ
  choice: 这一代人
  rationale: 自然、具体地指旷野时期的那一代群体；与“厌烦了”搭配时无需另加介词。
- source_word: καὶ εἶπον
  choice: 并且说
  rationale: 保留并列推进关系及第一人称神圣发言；汉语承前省略重复的“我”仍清楚自然。
- source_word: Ἀεὶ πλανῶνται
  choice: 总是偏离正道
  rationale: “总是”保留持续、反复的意味；“偏离正道”自然表达道德和属灵层面的迷失，并与下文“道路”意象相呼应。
- source_word: τῇ καρδίᾳ
  choice: 心里
  rationale: 希腊文为单数，可能把整代人视为一个整体；汉语“他们心里”无需标明单复数，既自然又不强行把集体意义个体化。
- source_word: αὐτοὶ δὲ
  choice: 竟
  rationale: δέ在此形成对照，而αὐτοί带有突出主语的作用；“竟”简洁表达责难性的反差。
- source_word: οὐκ ἔγνωσαν
  choice: 不认识
  rationale: 保留γινώσκω可能具有的经验性、关系性含义，不缩减为纯认知层面的“不明白”；汉语引文叙述中无需机械复制英语完成时。
- source_word: τὰς ὁδούς μου
  choice: 我的道路
  rationale: 保留圣经常见的“道路”隐喻，可指神行事的方式以及他为人规定的道路。
theological_decisions:
- issue: προσώχθισα所表达的神圣不悦
  choice: 译作“我厌烦了”
  alternative: “我向这一代人发怒”或“我憎恶这一代人”
  rationale: 原文表达真实而强烈的圣约性不悦，但不宜将其弱化为一般怒气，也不宜过度强化为明确的憎恨；脚注保留词义范围。
- issue: τῇ καρδίᾳ的集体单数
  choice: 译作“他们心里”
  alternative: “他们各人的心里”或“他们的心总是……”
  rationale: 汉语在“心里”一词上不强制区分单复数，能够自然保留原文把这一代视为整体的可能性，同时也不排除其中各人的内在偏离。
- issue: οὐκ ἔγνωσαν中“认识”的性质
  choice: 译作“不认识我的道路”
  alternative: “不明白我的道路”或“不曾知道我的道路”
  rationale: “认识”保留其可能包含的亲历、认同和顺从层面，不把经文限定为单纯缺乏知识。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。引文以诗体分行呈现；“四十年之久”“偏离正道”“我的道路”兼顾自然表达和原文意象。所有脚注标记均已置于正文对应位置。
