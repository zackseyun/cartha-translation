  yaml_path: translation/nt/hebrews/003/009.yaml
  text: where your fathers tested me by trial and saw my works[b][a],
translation:
  language: zh_hans
  text: 在那里，你们的祖先试探我，考验我[a]，并且看见了我的作为。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “考验我”所译的希腊语短语含义较难确定，也可译作“在考验中试探我”或“借着考验试探我”。它可能表示试探的方式或手段。
    reason: lexical_alternative
  - marker: b
    text: 有些译本把后半句理解为让步关系，译作“尽管看见了我的作为”或“虽看见了我的作为”；希腊原文只说“并且看见了”。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗ
  choice: 在那里
  rationale: 这是关系副词，回指上一节所说的旷野地点；采用空间意义，不将其顺译为时间性的“那时”或“当……时”。
- source_word: ἐπείρασαν
  choice: 试探我
  rationale: πειράζω在此指人以挑衅性质试验上帝。“我”虽未在本分句明说，却可由诗篇引文的语境明确补出。
- source_word: οἱ πατέρες ὑμῶν
  choice: 你们的祖先
  rationale: 现代汉语中“祖先”自然地指以色列历史中的前人，也避免“父亲们”被误解为直接父辈。
- source_word: ἐν δοκιμασίᾳ
  choice: 以考验来
  rationale: 保留ἐν可能表达方式或手段的作用，并用脚注说明这一短语在句法和词义上的困难，不把它暗中固定为单一解释。
- source_word: καὶ εἶδον
  choice: 并且看见了
  rationale: 按希腊文καί直译为并列关系，不在正文中增添“尽管”或“却”等让步含义。
- source_word: τὰ ἔργα μου
  choice: 我的作为
  rationale: “作为”既保留ἔργα所指上帝所行之事，也比口语化的“我所做的事”更符合庄重经文语体。
theological_decisions:
- issue: 试探的对象
  choice: 补出“我”
  alternative: 不明说宾语，只译“试探”
  rationale: SBLGNT本分句没有明写宾语，但诗篇引文和说话者语境都表明被试探者是上帝；补出“我”使现代汉语完整，却不增加额外教义判断。
- issue: 看见上帝作为与试探之间的逻辑关系
  choice: 保留简单并列“并且”
  alternative: 译作“尽管看见了”或“却看见了”
  rationale: 上下文可以引出让步理解，但希腊文只用καί；正文保留原文的含混关系，并在脚注交代另一种理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“祖先”比“列祖”更符合当代通用表达；“我的作为”保留经文语体。脚注标记均置于正文对应句末。
