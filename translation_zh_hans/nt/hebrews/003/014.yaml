source:
  edition: SBLGNT
  text: μέτοχοι γὰρ ⸂τοῦ Χριστοῦ γεγόναμεν⸃, ἐάνπερ τὴν ἀρχὴν τῆς ὑποστάσεως μέχρι τέλους βεβαίαν κατάσχωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/014.yaml
  text: For we have become sharers in the Messiah, if indeed we hold the beginning of our assurance firm to the end.
translation:
  language: zh_hans
  text: 因为我们已经成了有分于弥赛亚的人[a]——只要我们确实把我们起初的确信[b]坚定地持守到底[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“与弥赛亚一同有分的人”或“分享弥赛亚的人”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“把握”或“确据”。这个希腊词在其他语境中还可表示“实体”或“实在”。
    reason: lexical_alternative
  - marker: c
    text: 或译：“只要我们确实把我们起初的确信持守到底，始终坚定。”
    reason: word_order_alternative
lexical_decisions:
- source_word: μέτοχοι
  choice: 有分于……的人
  rationale: 该词表示分享、参与某事的人。“有分于”在现代中文里简洁庄重，保留参与和共享的含义；此处不把它具体化为某一种神学关系。
- source_word: γὰρ
  choice: 因为
  rationale: 该连词承接上文，为前面的警告或劝勉提供理由；“因为”清楚呈现其解释性、因果性的衔接作用。
- source_word: τοῦ Χριστοῦ
  choice: 弥赛亚
  rationale: Χριστός在这里具有称号性质，译为“弥赛亚”能体现“受膏者”的身份；属格与μέτοχοι连用，译作“有分于弥赛亚”。
- source_word: γεγόναμεν
  choice: 已经成了
  rationale: 完成时兼顾过去发生的转变及其延续至今的结果；“已经成了”比单纯的“是”更完整地表达这一点。
- source_word: ἐάνπερ
  choice: 只要……确实
  rationale: 该形式是带强调色彩的条件表达。“只要”自然呈现条件，“确实”保留περ所加强的语气，同时不将条件解释为某一特定的救恩论立场。
- source_word: τὴν ἀρχὴν
  choice: 起初的
  rationale: ἀρχή指开始或起点；中文采用定语结构，与后面的ὑπόστασις组成“起初的确信”，指最初所持有的确信。
- source_word: ὑποστάσεως
  choice: 确信
  rationale: 该词在本语境中较可能指坚定的信念或把握。“确信”自然且能表达内在确定性；“信心”是可行的语境性替代，另以脚注保留。
- source_word: μέχρι τέλους
  choice: 到底
  rationale: 该短语表示持续直至终点；“到底”在“持守到底”中自然、简练，并清楚表达坚持至终的时间范围。
- source_word: βεβαίαν
  choice: 坚定地
  rationale: 原文形容词与“起初”在语法上呼应，表达稳固、坚定。中文改用状语“坚定地”修饰“持守”，使句子自然，同时保留所持守之确信必须保持稳固的意思。
- source_word: κατάσχωμεν
  choice: 持守
  rationale: 该动词在此表示牢牢保有、不放弃。“持守”是现代中文圣经语体中清楚而庄重的表达，也与“到底”自然搭配。
theological_decisions:
- issue: 条件句与坚忍的关系
  choice: 保留“只要我们确实……持守到底”这一真实条件，不说明持守究竟是先前参与的证据，还是继续参与的条件。
  alternative: 可将本句解释为坚忍证明先前确已参与，或解释为参与关系有赖于持续坚忍。
  rationale: 希腊文本明确提出条件，却没有在本节内解决后世关于坚忍、离弃与确据的系统神学争论；译文因此保留原有张力。
- issue: μέτοχοι τοῦ Χριστοῦ所表达的关系
  choice: 译作“有分于弥赛亚的人”，保留较宽泛的参与含义。
  alternative: 也可译作“与弥赛亚一同有分的人”或“分享弥赛亚的人”。
  rationale: 属格所表达的具体关系可以理解为有分于弥赛亚本人、与他同享，或成为他的同伴；正文不额外限定其神学机制。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“有分于”“持守”保留经文语体的凝练感，但不使用生僻或古奥措辞。破折号使主句与带强调的条件句之间关系清晰，同时维持原文先陈述、后附条件的次序。
