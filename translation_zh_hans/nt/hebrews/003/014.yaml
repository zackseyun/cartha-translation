  naturalness: ‘因为，’在现代汉语中不应在连词后断开。其余句式庄重自然；以‘我们起初的确信’替代无领属限定的说法，表达更清楚。
  terminology: ‘弥赛亚’、‘有分于’、‘确信’和‘持守到底’均适合现代庄重的圣经语体。脚注b把ὑπόστασις的替代义列为‘信心’，易与πίστις混淆，且未准确对应审计轨迹所保留的‘confidence/assurance’语义范围，宜改为‘把握’或‘确据’等。
