  text: καὶ ὡσεὶ περιβόλαιον ἑλίξεις αὐτούς, ⸂ὡς ἱμάτιον⸃ καὶ ἀλλαγήσονται· σὺ δὲ ὁ αὐτὸς εἶ, καὶ τὰ ἔτη σου οὐκ ἐκλείψουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/012.yaml
  text: and like a cloak you will roll them up[a]; like a garment they will be changed. But you are the same[b], and your years will not fail.
translation:
  language: zh_hans
  text: 你要把它们像斗篷一样卷起来[a]；它们也要像衣服一样被改变。你却始终如一[b]；你的年岁永无穷尽。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “卷起来”也可译作“折叠起来”。
    reason: lexical_alternative
  - marker: b
    text: “始终如一”直译为“是同一位”；也可译作“仍旧不变”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡσεὶ περιβόλαιον
  choice: 像斗篷一样
  rationale: ὡσεὶ引出比喻；περιβόλαιον指披在身外、裹住身体的外衣。“斗篷”在现代汉语中自然地保留了衣物意象。
- source_word: ἑλίξεις
  choice: 卷起来
  rationale: ἑλίσσω可指卷起或折叠。此处以外衣为喻，“卷起来”形象清楚，并保留第二人称将来动作的语气。
- source_word: αὐτούς
  choice: 它们
  rationale: 该阳性复数代词回指上文所说的受造天地；汉语以“它们”自然承接。
- source_word: ὡς ἱμάτιον
  choice: 像衣服一样
  rationale: ἱμάτιον是衣服或外衣；译作“衣服”既通俗，又与前面的“斗篷”形成平行而不完全重复的衣物意象。
- source_word: ἀλλαγήσονται
  choice: 要……被更换
  rationale: 保留将来被动语态。“更换”既可表达发生改变，也与把旧衣换下的比喻相合；不明确补出施事者。
- source_word: σὺ δὲ ὁ αὐτὸς εἶ
  choice: 你却依然如故
  rationale: δὲ标明受造物会改变与“你”恒常不变之间的对照。“依然如故”自然而庄重，贴近“你是同一位”的含义，又不引入后来的技术性神学术语。
- source_word: τὰ ἔτη σου οὐκ ἐκλείψουσιν
  choice: 你的年岁永无穷尽
  rationale: 保留“你的年岁”这一时间性诗歌意象；ἐκλείπω在此表示终止、耗尽。“永无穷尽”准确表达不会结束，且符合引诗的庄重语体。
theological_decisions:
- issue: 基督论引文中关于恒常不变的表述
  choice: 你却依然如故
  alternative: 你却永不改变；你却仍是同一位
  rationale: 上下文把会被更换的受造界与受话者持久不变的身份相对照。“依然如故”保留这一含义和张力，却不把ὁ αὐτός扩写为超出经文本身的系统神学命题。
- issue: 受造天地的“改变”与“更换”
  choice: 它们也要像衣服一样被更换
  alternative: 它们也要像衣服一样改变
  rationale: ἀλλαγήσονται本身可表示改变或更换；衣服比喻使“被更换”十分贴切，同时保留被动形式，不明说更换的方式或结果。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌性汉语。分号呈现两组鲜明对照：受造天地像衣物一样被卷起、更换，而受话者依然如故、年岁无尽。保留第二人称和被动语态，不补入原文未明说的施事者或神学解释。
