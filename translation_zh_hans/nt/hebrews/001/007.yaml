source:
  edition: SBLGNT
  text: καὶ πρὸς μὲν τοὺς ἀγγέλους λέγει· Ὁ ποιῶν τοὺς ἀγγέλους αὐτοῦ πνεύματα, καὶ τοὺς λειτουργοὺς αὐτοῦ πυρὸς φλόγα·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/007.yaml
  text: And about the angels he says[a], “He makes his angels winds, and his ministers a flame of fire.”
translation:
  language: zh_hans
  text: 论到天使，他说：“他使自己的天使成为风[a]，使自己的仆役成为火焰。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“灵”；希腊语原词既可指“风”，也可指“灵”。
    reason: 保留 πνεύματα 的词义歧义及其解释意义。
lexical_decisions:
- source_word: πρὸς μὲν τοὺς ἀγγέλους
  choice: 论到天使
  rationale: 这里的 πρός 与 λέγει 连用，表示经文所谈论的对象；引文是在描述天使，并非直接对天使说话。译作“论到”也保留了本章天使与子之间的对比结构。
- source_word: λέγει
  choice: 他说
  rationale: 保留希腊文现在时的引经表达，使经文作为当下仍在发言的话语呈现；中文“他说”自然庄重。
- source_word: Ὁ ποιῶν
  choice: 他使……成为
  rationale: ποιέω 在双宾语结构中可表达“使某对象成为某物”。这一译法既切合句法，也自然连接“风”和“火焰”两个表语。
- source_word: ἀγγέλους
  choice: 天使
  rationale: 希伯来书第一章明确谈论天上的天使，并将他们与子作对比，因此不采用较宽泛的“使者”。
- source_word: πνεύματα
  choice: 风
  rationale: πνεῦμα 可指“风”或“灵”。此处引自诗篇104:4，与“火焰”构成自然现象的诗意平行，且符合希伯来文背景，故正文译作“风”；真实存在的另一义项以脚注保留。
- source_word: λειτουργοὺς
  choice: 仆役
  rationale: 该词指执行服事者，可能带有礼仪或官方服务色彩。现代中文“仆役”既体现从属服事，又比“执事”更能避免引入后来的教会职分含义。
- source_word: πυρὸς φλόγα
  choice: 火焰
  rationale: 希腊文为单数“火的焰”。中文“火焰”简洁自然，保留单数集合意象，避免生硬的“火之焰”。
- source_word: αὐτοῦ
  choice: 自己的
  rationale: 反身化处理符合现代汉语习惯，清楚表明天使和仆役属于说话与施行行动的神。
theological_decisions:
- issue: 引文中 πνεύματα 的含义
  choice: 正文译作“风”
  alternative: “灵”
  rationale: “风”更符合诗篇104:4的希伯来文背景，也与“火焰”的自然意象形成平行；但希腊词本身确可表示“灵”，因此用脚注保留歧义，不把可能涉及天使本质或职能的解释绝对化。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“论到……他说”保持引经公式的正式感；“使……成为……”呈现原文的平行诗句。正文中的脚注标记[a]与脚注完全对应。
