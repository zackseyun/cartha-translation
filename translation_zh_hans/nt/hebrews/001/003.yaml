id: HEB.1.3
reference: Hebrews 1:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὃς ὢν ἀπαύγασμα τῆς δόξης καὶ χαρακτὴρ τῆς ὑποστάσεως αὐτοῦ, φέρων τε τὰ πάντα τῷ ῥήματι τῆς δυνάμεως, ⸂δι’ αὑτοῦ⸃ καθαρισμὸν ⸂τῶν ἁμαρτιῶν ποιησάμενος⸃ ἐκάθισεν ἐν δεξιᾷ τῆς μεγαλωσύνης ἐν ὑψηλοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/003.yaml
  text: He[a], being the radiance of his glory and the exact imprint of his being, and sustaining all things by the word of his power, after making purification for sins through himself[b], sat down at the right hand of the Majesty on high[c],
translation:
  language: zh_hans
  text: 他是上帝荣耀的光辉，是上帝本体的确切印记[a]，以自己大能的话托住万有。他借着自己[b]成就了罪的洁净，就坐在高天之上那位至大者的右边[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “本体”也可译作“本质”“实在”或“存在”；“确切印记”含有印章所留下的精确印记之意。
    reason: lexical_alternative
  - marker: b
    text: 有些抄本没有“借着自己”；本译文依照SBLGNT正文保留此语。也可按另一种中文表达译作“亲自”。
    reason: textual_variant
  - marker: c
    text: “在高天之上”也可译作“在至高之处”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπαύγασμα
  choice: 光辉
  rationale: 保留由荣耀发出的灿烂这一意象，也避免“反映”可能暗示仅仅外在映照。
- source_word: δόξα
  choice: 荣耀
  rationale: 这是现代中文圣经语体中自然且有神学分量的对应词。
- source_word: χαρακτήρ
  choice: 真像
  rationale: 表达印记与原型精确相符的具体意象；“真”突出精确对应，但不直接套用后期形而上学术语。
- source_word: ὑπόστασις
  choice: 本体
  rationale: 在此指上帝真实、根本的存在；“本体”保留本体论力度，同时脚注列出较通俗的可能译法。
- source_word: φέρων
  choice: 托住
  rationale: 表达持续承载并维系万有的主动作为，中文简洁而有力度。
- source_word: τὰ πάντα
  choice: 万有
  rationale: 保留希腊文涵盖一切的广度，且符合庄重、自然的中文圣经语体。
- source_word: τῷ ῥήματι τῆς δυνάμεως
  choice: 以自己大能的话
  rationale: 按希腊语属格关系自然转译，表达他的话具有大能，避免生硬的“以他能力的话”。
- source_word: δι’ αὑτοῦ
  choice: 借着自己
  rationale: 保留διά加属格通常表示媒介的语义，并依SBLGNT正文纳入主文。
- source_word: καθαρισμὸν τῶν ἁμαρτιῶν
  choice: 成就了罪的洁净
  rationale: 保留洁净的祭仪与献祭色彩；“成就”自然表达ποιησάμενος所指已经完成的行动。
- source_word: ἐκάθισεν ἐν δεξιᾷ
  choice: 坐在……的右边
  rationale: 保留坐下与尊荣位置的意象，不额外解释其神学意义。
- source_word: τῆς μεγαλωσύνης
  choice: 那位至大者
  rationale: 将抽象尊称自然地表达为对上帝的敬称，同时保留原文避免直接使用神名的修辞。
- source_word: ἐν ὑψηλοῖς
  choice: 在高天之上
  rationale: 自然表达天上至高领域，避免把它误解为单纯的空间高度。
theological_decisions:
- issue: ὑπόστασις在后期三一论和基督论中的术语化
  choice: 本体
  alternative: 本质、实在、存在
  rationale: 此处需要保留强烈的本体论含义，却不应把后期信经中已经定型的全部技术含义反向强加给经文；脚注承认词义范围。
- issue: ἀπαύγασμα与χαρακτήρ的基督论力度
  choice: 荣耀的光辉、本体的真像
  alternative: 荣耀的反映、本性的代表
  rationale: 主文保留圣子与上帝荣耀及真实存在之间的紧密、精确对应，避免用较弱措辞把原文降格为仅仅代表或模仿。
- issue: δι’ αὑτοῦ的文本异文
  choice: 主文译出“借着自己”
  alternative: 省略该短语；或译作“亲自”
  rationale: SBLGNT正文包含δι’ αὑτοῦ，因此主文予以翻译；同时用脚注说明抄本差异，不将异文静默处理。
- issue: καθαρισμὸν τῶν ἁμαρτιῶν的救赎含义
  choice: 成就了罪的洁净
  alternative: 洗净了人的罪、除掉了罪
  rationale: 保留原文的祭仪性名词表达，不擅自补出受洁净者，也不把“洁净”收窄为某一种系统神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。以短句拆分希腊文较长的分词结构，同时保留行动次序：持续托住万有，成就洁净，继而坐下。所有代词指向均尽量清楚；为避免连续“他的”造成歧义，在前两处明确补出“上帝”，属于中文必要的指称澄清。
