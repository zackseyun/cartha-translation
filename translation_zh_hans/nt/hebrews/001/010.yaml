  text: καί· Σὺ κατ’ ἀρχάς, κύριε, τὴν γῆν ἐθεμελίωσας, καὶ ἔργα τῶν χειρῶν σού εἰσιν οἱ οὐρανοί·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/010.yaml
  text: And[a], “You, Lord, in the beginning laid the foundation of the earth, and the heavens are the works of your hands.”
translation:
  language: zh_hans
  text: 又说：“主啊，你起初[a]奠定了大地的根基；诸天是你手的作品。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “起初”也可译作“在开始的时候”。
    reason: lexical_alternative
lexical_decisions:
- source_word: καί
  choice: 又说
  rationale: 此处引入一段追加的经文引述；汉语用“又说”自然地表达连接和引述功能，不额外解释其主语。
- source_word: Σὺ
  choice: 你
  rationale: 保留希腊文显明的第二人称代词及直接称呼的语气。
- source_word: κατ’ ἀρχάς
  choice: 起初
  rationale: 表达创造之初的时间意义，简洁自然；其可理解为“在开始的时候”，见脚注。
- source_word: κύριε
  choice: 主啊
  rationale: κύριε是κύριος的呼格；“主啊”保留直接称呼和庄重语气。
- source_word: τὴν γῆν
  choice: 大地
  rationale: 在与“诸天”并列的创造语境中，指全地而非某一片土地；“大地”符合现代汉语的天地表达。
- source_word: ἐθεμελίωσας
  choice: 奠定了……的根基
  rationale: 保留θεμελιόω所含的建筑性根基意象，比单说“建立”更具体。
- source_word: ἔργα τῶν χειρῶν σού
  choice: 你手所造的
  rationale: 自然表达“你双手的作品”，既保留手的拟人意象，也清楚传达受造之物的含义。
- source_word: οἱ οὐρανοί
  choice: 诸天
  rationale: 对应希腊文复数，并保留圣经创造语境中与“大地”相对的庄重表达。
theological_decisions:
- issue: 《希伯来书》将诗篇中对“主”的称呼用于子
  choice: 保留“主啊，你”的直接称呼
  alternative: 采用较中性的表达以淡化该引文的基督论指向
  rationale: 希腊文本明确含有呼格κύριε，并在上下文中把此引文用于子；译文应保留这一张力，而不另加超出经文的教义说明。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“奠定了大地的根基”保留原文建筑隐喻；“诸天”保留复数和经文语体。脚注标记置于整句引文之后。
