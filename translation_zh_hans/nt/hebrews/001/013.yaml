  text: πρὸς τίνα δὲ τῶν ἀγγέλων εἴρηκέν ποτε· Κάθου ἐκ δεξιῶν μου ἕως ἂν θῶ τοὺς ἐχθρούς σου ὑποπόδιον τῶν ποδῶν σου;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/013.yaml
  text: But to which of the angels has he ever said[a], ‘Sit at my right hand until I make your enemies a footstool for your feet’?”
translation:
  language: zh_hans
  text: '但他曾对哪一个天使说过：

    “你坐在我的右边，

    直到我使你的仇敌作你的脚凳[a]”呢？'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“直到我把你的仇敌放在你脚下。”
    reason: 词义与表达方式的另一种译法；θῶ可译为“放置”，而“在你脚下”直接表达ὑποπόδιον意象所指的降服。
lexical_decisions:
- source_word: πρὸς τίνα δὲ τῶν ἀγγέλων
  choice: 但他曾对哪一个天使
  rationale: πρός与τίνα及说话动词连用，表示“对哪一个”；δέ承接上文并形成对比，译为“但”。希腊文说话者的主语承接上下文，中文以“他”保留这种衔接，不在本节中额外明说身份。
- source_word: εἴρηκέν ποτε
  choice: 曾……说过
  rationale: 用“曾……说过”自然表达完成时εἴρηκεν及ποτε“曾经、任何时候”的合意，呼应这个神圣宣告持续有效的语气。
- source_word: Κάθου
  choice: 你坐
  rationale: 直译命令式“坐”；补出“你”符合现代汉语直接引语的自然表达。
- source_word: ἐκ δεξιῶν μου
  choice: 在我的右边
  rationale: 这是君王登位语境中的固定方位表达；“在我的右边”现代、清楚，也保留尊荣位置的意象。
- source_word: ἕως ἂν θῶ
  choice: 直到我使
  rationale: ἕως ἂν加不定过去时虚拟式指向将来的界限；“直到我使”与后面的表语“作……脚凳”搭配自然。
- source_word: τοὺς ἐχθρούς σου
  choice: 你的仇敌
  rationale: 按复数宾语直译，保留敌对关系，不作解释性弱化。
- source_word: ὑποπόδιον τῶν ποδῶν σου
  choice: 作你的脚凳
  rationale: 保留经文中以脚凳象征仇敌被制伏的具体图像；“你的脚凳”在中文中已自然包含“供你的脚踏放”的意义，避免累赘。
theological_decisions:
- issue: 如何保留诗篇110:1引文的基督论作用而不过度阐释
  choice: 保留直接的登位宣告：“你坐在我的右边，直到我使你的仇敌作你的脚凳。”
  alternative: 意译为“直到我彻底击败你的仇敌”。
  rationale: 希伯来书的论证依赖这段引文的确切君王登位与仇敌降服意象，并借此凸显受话者与天使不同；因此不把隐喻改写成神学解释。
- issue: 隐含说话者的处理
  choice: 译作“他”，让所指承接上文。
  alternative: 直接补明为“神”。
  rationale: 希腊文本本节没有明写主语；用“他”既符合中文语法，也避免在本节内把上下文所指改成显性释义。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话；保留反问结构、诗歌分行和“右边／脚凳”的登位与降服意象。脚注标记置于其所说明的引文末尾。
