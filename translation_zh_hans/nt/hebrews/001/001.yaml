  text: Πολυμερῶς καὶ πολυτρόπως πάλαι ὁ θεὸς λαλήσας τοῖς πατράσιν ἐν τοῖς προφήταις
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/001.yaml
  text: Long ago[c][b][a], God spoke to the fathers in many parts and in many ways by the prophets.
translation:
  language: zh_hans
  text: 从前，神曾借着众先知，分段并用多种方式向列祖说话。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “分段”直译可作“以许多部分”；也可译作“多次”。这个词与“用多种方式”有别，前者强调先前说话是分部分赐下的。
    reason: lexical_alternative
  - marker: b
    text: “借着众先知”字面为“在众先知里”；也可译作“通过众先知”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολυμερῶς
  choice: 多次
  rationale: 该词强调先前启示分成许多部分、在不同场合赐下。汉语“多次”自然简洁，并与下文表示方式多样的“多方”保持区别；其“分为许多部分”的含义以脚注保留。
- source_word: πολυτρόπως
  choice: 多方
  rationale: 表示方式或形式的多样。“多方”与“多次”构成简洁庄重的并列，同时不把两个副词混为同义表达。
- source_word: πάλαι
  choice: 古时候
  rationale: 自然表达久远的过去，并适合经文庄重语体，不显生硬古奥。
- source_word: ὁ θεὸς
  choice: 神
  rationale: 直接对应句中带冠词的主语；希腊语冠词无须另行译出。
- source_word: λαλήσας
  choice: 曾……说话
  rationale: 原文为不定过去时分词，句法上连接下一节的主要动词。此处用有限动词形式使单节中文可读，并以“曾”预备与1:2的今昔对照，而不额外增添神学解释。
- source_word: τοῖς πατράσιν
  choice: 向列祖
  rationale: “列祖”保留原文“父辈”的契约历史色彩，在现代中文圣经语体中也能自然指先辈；不擅自加入原文没有的“我们的”。
- source_word: ἐν τοῖς προφήταις
  choice: 借着众先知
  rationale: 介词ἐν在此可表达媒介或代理。“借着”自然呈现神是说话者、先知是传达媒介；“众”体现复数定冠词结构。
theological_decisions:
- issue: 分词结构与希伯来书1:2的关系
  choice: 在本节译作“神曾……说话”，同时用“曾”保留与下一节的时间对照。
  alternative: 较形式化地译为“神既已……说话”，使句子延续到1:2。
  rationale: λαλήσας在希腊文中由下一节的主要动词完成句法结构；但单节呈现若机械保留分词会显得残缺。所选译法保持本节可读，也不提前解释下一节所表达的启示高潮。
- issue: Πολυμερῶς所表达的是次数还是分段
  choice: 正文采用自然的“多次”，脚注说明也可理解为“分成许多部分”。
  alternative: 正文译作“分成许多部分”。
  rationale: 该副词可着重启示的多部分、分阶段性质，也由此包含不同场合的意味。中文“多次、多方”流畅且明确区分次数/部分与方式，但用脚注保留其真实的词义幅度，避免把含义完全收窄为次数。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“多次、多方”保留原文两个相近但有区别的副词所形成的修辞节奏；“列祖”保留历史与群体传承意味。所有脚注标记均置于正文相关句末。
