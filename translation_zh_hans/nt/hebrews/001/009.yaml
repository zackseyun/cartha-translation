  text: ἠγάπησας δικαιοσύνην καὶ ἐμίσησας ἀνομίαν· διὰ τοῦτο ἔχρισέν σε ὁ θεός, ὁ θεός σου, ἔλαιον ἀγαλλιάσεως παρὰ τοὺς μετόχους σου·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/009.yaml
  text: You have loved righteousness and hated lawlessness; therefore God[a], your God, has anointed you with the oil of gladness beyond your companions.
translation:
  language: zh_hans
  text: 你喜爱公义[a]，恨恶不法；因此，上帝，就是你的上帝，以喜乐的油膏你，胜过膏你的同伴。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “公义”也可译为“正义”。希腊文此词可指义或正义；正文按本项目的通常译法译为“公义”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠγάπησας
  choice: 喜爱
  rationale: 不机械复制希腊语不定过去时的时态形式，而以中文自然的陈述表达既成且具有现实意义的品格与行动；与“恨恶”形成工整对照。
- source_word: δικαιοσύνην
  choice: 公义
  rationale: 在君王诗篇及弥赛亚语境中，此词主要指合乎上帝标准的正直与正义；“公义”兼顾道德和审判层面，也符合现代中文圣经语体。
- source_word: ἐμίσησας
  choice: 恨恶
  rationale: 保留原文强烈的道德对立；“恨恶”比单说“恨”更庄重，并与“喜爱”自然对应。
- source_word: ἀνομίαν
  choice: 不法
  rationale: 直接表达违背、漠视法则之意，比“邪恶”更贴近 ἀνομία 的词义，也比“罪孽”少一层泛化。
- source_word: διὰ τοῦτο
  choice: 因此
  rationale: 简洁保留前述品格与随后受膏之间的因果、推论关系。
- source_word: ἔχρισέν
  choice: 膏了
  rationale: 保留 χρίω 的君王受膏及弥赛亚意象；中文以完成体“了”表达已经发生的行动。
- source_word: ὁ θεός, ὁ θεός σου
  choice: 上帝，就是你的上帝
  rationale: 保留“上帝”与“你的上帝”的重复和同位关系；加入“就是”使现代中文清楚自然，却不作三一论式扩写。
- source_word: ἔλαιον ἀγαλλιάσεως
  choice: 喜乐的油
  rationale: 保留诗篇引文中以油施膏、象征欢庆与尊荣的意象；“喜乐”自然且庄重。
- source_word: παρὰ τοὺς μετόχους σου
  choice: 使你超越你的同伴
  rationale: παρά 加宾格在此表达比较上的超过；将比较关系自然接在施膏结果之后。“同伴”保留 μετόχους 的共同参与、相伴之意而不过度具体化。
theological_decisions:
- issue: δικαιοσύνην 在君王／弥赛亚引文中的含义
  choice: 公义
  alternative: 正义
  rationale: “公义”能够同时承载道德正直和公正治理的含义，不把语义限缩为司法层面的“正义”。
- issue: “上帝，就是你的上帝”用于对子的论述
  choice: 照原文保留重复与关系张力
  alternative: 加入解释性措辞以说明父子或三一关系
  rationale: 原文既以崇高称谓论及子，又说“你的上帝”；译文不淡化也不扩写，使读者直接面对经文本身的基督论张力。
- issue: 受膏与超越同伴的关系
  choice: 译为“用喜乐的油膏了你，使你超越你的同伴”
  alternative: “用喜乐的油膏你，胜过膏你的同伴”
  rationale: 希腊语比较结构可理解为受膏的程度或所得尊荣超过同伴；正文采用自然中文表达其结果，同时避免暗示同伴必然也以同样方式受膏。
translation_notes:
  register: 采用现代、庄重而易懂的中文经文语体。句子保持诗歌式对偶：“喜爱公义／恨恶不法”，后半保留受膏、喜乐之油和超越同伴的王权意象。未设置脚注，因为正文“公义”已能涵盖本处可能包含的正义意味，且无需以脚注重复近义中文词。
