base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/006.yaml
  text: And when he again brings the Firstborn into the world[a], he says[b], “And let all God’s angels worship him.”
translation:
  language: zh_hans
  text: 当他再次把长子带进世上时[a]，他说：“上帝的众天使[b]都当敬拜他。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他又说：‘当他把长子带进世上时，上帝的众天使都当敬拜他。’”希腊语中的“又／再次”既可修饰“带进”，也可修饰“说”。
    reason: alternative_reading
  - marker: b
    text: 或译：“上帝所有的天使。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: 当……时
  rationale: 引出时间从句；这里指向一个特定事件，用“当……时”比可能带有反复意味的“每当”更合适。
- source_word: δὲ
  choice: 承接而不单独译出
  rationale: δὲ在此是轻微的承接语气。现代汉语无需机械译作“而且”或“但”，由句际衔接自然体现即可。
- source_word: πάλιν
  choice: 再次
  rationale: 正文将其理解为修饰“带进”；希腊语也可能将其理解为修饰“他说”，这一真实歧义在脚注中保留。
- source_word: εἰσαγάγῃ
  choice: 带进
  rationale: 保留“带入、引入”的动作性，并与介词εἰς所表达的方向自然搭配。
- source_word: τὸν πρωτότοκον
  choice: 长子
  rationale: 这是本段对圣子的称谓；“长子”是自然、庄重的汉语表达，也保留了原词关于儿子身份及首要地位的语义张力。
- source_word: εἰς τὴν οἰκουμένην
  choice: 进世上
  rationale: οἰκουμένη可指有人居住的世界；“世上”在此自然明白，又不将其狭化为某一地区。
- source_word: λέγει
  choice: 他说
  rationale: 原文主语省略，语境中所指为上帝；简译为“他说”，不增添“经上”等解释性成分。
- source_word: προσκυνησάτωσαν
  choice: 都要敬拜
  rationale: 用“要”表达第三人称命令或宣告式命令的语气；在希伯来书第一章众天使对圣子的语境中，“敬拜”最能体现προσκυνέω的力度。
- source_word: αὐτῷ
  choice: 他
  rationale: 作为προσκυνέω的间接宾语，汉语自然译为“敬拜他”。
- source_word: πάντες ἄγγελοι θεοῦ
  choice: 上帝的众天使
  rationale: 既保留θεοῦ的属格关系，也用“众天使”清楚表达πάντες所强调的全体范围。
theological_decisions:
- issue: πάλιν的句法修饰范围
  choice: 正文作“当他再次把长子带进世上时”，让“再次”修饰“带进”。
  alternative: 也可理解为“他又说：‘当他把长子带进世上时，上帝的众天使都要敬拜他。’”即“又”修饰“说”。
  rationale: 原文词序及句法容许两种分析；正文选择顺畅且常见的理解，但以脚注保存另一种可能，不消除原文的真实歧义。
- issue: προσκυνέω用于圣子时的语力
  choice: 敬拜
  alternative: 俯伏在……面前；向……致敬
  rationale: 本章论证圣子高于天使，并命令上帝所有天使向他行此举；“敬拜”较充分地传达本语境中的动词力度，同时不在译文中添加原文没有明说的教义措辞。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“长子”保留基督论称谓的简洁与语义张力；“上帝的众天使”避免文言化，同时明确表达全体范围。正文中脚注标记[a]与脚注对应。
