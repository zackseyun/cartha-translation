  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Τίνι γὰρ εἶπέν ποτε τῶν ἀγγέλων· Υἱός μου εἶ σύ, ἐγὼ σήμερον γεγέννηκά σε, καὶ πάλιν· Ἐγὼ ἔσομαι αὐτῷ εἰς πατέρα, καὶ αὐτὸς ἔσται μοι εἰς υἱόν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/005.yaml
  text: For to which of the angels did he ever say[a], “You are my Son; today I have begotten you”? And again, “I will be to him a father[c][b], and he will be to me a son”?
translation:
  language: zh_hans
  text: 因为，神何曾对哪一位天使说过：“你是我的儿子，我今日生了你”[a]？又说：“我要作他的父亲，他要作我的儿子”[b]？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我今日生了你”引自《诗篇》2:7。这句话可从君王登基、复活，或圣子与父的永恒关系等角度理解；正文保留原有措辞，不在这些解释中作出裁定。
    reason: cross_reference
  - marker: b
    text: 引自《撒母耳记下》7:14。原句以彼此对应的方式宣告：“我要作他的父亲，他要作我的儿子。”
    reason: cross_reference
lexical_decisions:
- source_word: Τίνι ... τῶν ἀγγέλων
  choice: 哪一位天使
  rationale: 以“哪一位……天使”自然表达疑问代词与部分属格的关系，突出神从未对任何一位天使说过这话。
- source_word: γὰρ
  choice: 因为
  rationale: 保留本节对上文论证的解释和论证作用；现代汉语中“因为”比孤立使用“原来”更清楚。
- source_word: εἶπέν ποτε
  choice: 曾……说过
  rationale: “曾……说过”表达 ποτέ 所强调的“在任何时候有过这样的事吗”，并符合汉语反问句习惯。
- source_word: ἀγγέλων
  choice: 天使
  rationale: 希伯来书第一章的语境明确指天上的使者，而非一般的人间信使。
- source_word: Υἱός μου εἶ σύ
  choice: 你是我的儿子
  rationale: 采用自然的现代汉语语序，同时保留直接宣告的父子关系。汉字不以大小写区分称号，因此不人为制造英文大小写所承载的差别。
- source_word: σήμερον
  choice: 今日
  rationale: 直接保留时间副词；“今日”兼具现代可懂性和诗篇引文的庄重语体。
- source_word: γεγέννηκά σε
  choice: 生了你
  rationale: “生”保留 γεννάω 的生育／父子隐喻，“了”在汉语中自然呈现已经成就的意味；不在正文中将其解释为登基、复活或永恒关系。
- source_word: καὶ πάλιν
  choice: 又说
  rationale: 自然表明作者继续引入另一处经文引语；汉语不必重复主语也能保持衔接。
- source_word: Ἐγὼ ἔσομαι αὐτῷ εἰς πατέρα
  choice: 我要作他的父亲
  rationale: 以自然汉语表达“对他成为父亲”的关系，同时保留盟约宣告的庄重语气。
- source_word: καὶ αὐτὸς ἔσται μοι εἰς υἱόν
  choice: 他要作我的儿子
  rationale: 与前半句形成整齐对称，并忠实表达相互对应的父子关系。
theological_decisions:
- issue: 诗篇2:7中“我今日生了你”的所指
  choice: 正文保留“我今日生了你”，不限定其具体神学所指。
  alternative: 明确译成登基、复活时的宣告，或直接解释为圣子与父的永恒关系。
  rationale: 引文在希伯来书中具有基督论意义，但措辞本身可涉及君王登基、复活宣告或圣子与父的永恒关系。翻译应保存这一神学张力，不替正文预先裁定。
- issue: 两处引文中的儿子称谓
  choice: 两处都译为“儿子”，由上下文显明这些引文应用于圣子。
  alternative: 使用“圣子”或其他显性神学称号，以强化基督论身份。
  rationale: 希腊文在此没有可由汉语大小写对应的区别；译为“儿子”既忠于亲属称谓，也避免在引文中添加原文未明说的称号。
- issue: 第二处引文的父子关系表达
  choice: 译为“我要作他的父亲，他要作我的儿子”。
  alternative: 译为较生硬的“我要对他成为父亲，他也要对我成为儿子”。
  rationale: 所选译法保留盟约性的父子关系和平行结构，同时用普通现代读者容易理解的汉语表达，不将其缩减为单纯生物学关系。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“今日”保留诗篇引文的庄严感；“父亲／儿子”比文言式“父／子”更适合普通现代读者。正文补出语境中隐含的主语“神”，使独立诵读时指代清楚。
