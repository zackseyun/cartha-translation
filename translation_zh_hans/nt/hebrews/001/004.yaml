  text: τοσούτῳ κρείττων γενόμενος τῶν ἀγγέλων ὅσῳ διαφορώτερον παρ’ αὐτοὺς κεκληρονόμηκεν ὄνομα.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/004.yaml
  text: having become as much superior to the angels as the name he has inherited is more excellent than theirs.
translation:
  language: zh_hans
  text: 他成为比天使更卓越的一位；他比天使更卓越的程度，正与他所承受的名比他们的名更尊贵的程度相称。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “更卓越”也可译作“更好”；“更尊贵”也可译作“更卓越”。
    reason: lexical_alternative
  - marker: b
    text: 下文说明，这“名”与“儿子”这一身份和称号有关。
    reason: cross_reference
lexical_decisions:
- source_word: τοσούτῳ ... ὅσῳ
  choice: ……正如……一样
  rationale: 保留希腊文表示程度相应的关联比较：他超越天使的程度，与所承受之名超越他们之名的程度相称。
- source_word: κρείττων
  choice: 崇高
  rationale: 这里主要比较地位和尊荣，并非道德品质；“崇高”比笼统的“更好”更能传达其语境含义。
- source_word: γενόμενος
  choice: 成为
  rationale: 直接保留不定过去时分词的基本表达，不译作“被造”或“被造成”，以免加入原文没有的受造含义。
- source_word: τῶν ἀγγέλων
  choice: 比天使
  rationale: 依汉语比较句习惯处理比较级之后的属格。
- source_word: διαφορώτερον
  choice: 更尊贵
  rationale: 在此表示更卓越、更有尊荣；“更尊贵”自然地配合“名”，也保留比较级的力度。
- source_word: παρ’ αὐτοὺς
  choice: 比他们的名
  rationale: 希腊文按比较关系可直译为“比他们”；汉语补出“名”，明确比较双方而不改变含义。
- source_word: κεκληρονόμηκεν
  choice: 他所承受的
  rationale: “承受”是圣经语境中自然且庄重的继承用语；关系结构同时表达完成时所指向的既成、持续结果。
- source_word: ὄνομα
  choice: 名
  rationale: 保留原文的“名”，让下文说明其具体所指，不提前释为“儿子这一称号”。
theological_decisions:
- issue: γενόμενος（“成为”）对基督身份的含义
  choice: 照原文译为“成为”，让上下文将其指向圣子的升高及相对于天使的地位。
  alternative: 译为“被立为”或“被造得”，或据此断言其本体由非神变为神。
  rationale: 原文确实使用“成为”，译文不应抹平这一表达；但被动态或受造含义并不在该词形中，因此也不应擅自加入。
- issue: “名”的具体含义
  choice: 正文保留“名”，由随后经文揭示其与“儿子”的身份和称号相关。
  alternative: 在正文直接改写为“儿子的称号”或宽泛解释为“尊荣地位”。
  rationale: 保留原文的文学推进和一定的语义张力，同时以脚注提示下文联系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“崇高”“尊贵”避免把比较误读为道德优劣；句式保留原文前后程度相应的结构。
