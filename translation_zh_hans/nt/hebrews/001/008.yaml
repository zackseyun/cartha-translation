  text: πρὸς δὲ τὸν υἱόν· Ὁ θρόνος σου ὁ θεὸς εἰς τὸν αἰῶνα τοῦ αἰῶνος, ⸂καὶ ἡ ῥάβδος τῆς εὐθύτητος⸃ ῥάβδος τῆς βασιλείας ⸀σου.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/008.yaml
  text: But of the Son he says[a], “Your throne, O God, is forever and ever[b], and the scepter of uprightness is the scepter of your kingdom.”
translation:
  language: zh_hans
  text: '至于子，他却说：[a]


    “上帝啊，你的宝座是永永远远的；

    正直[b]的权杖，就是你国度的权杖。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译（可能性较小）：“上帝是你的宝座，直到永永远远。”希腊文句法对此存在争议，但直接称呼“上帝啊，你的宝座”更符合上下文和引文的语势。
    reason: alternative_reading
  - marker: b
    text: “正直”也可译作“公义”。希腊词可表示正直、端正或公正。
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς δὲ τὸν υἱόν
  choice: 至于子，他却说
  rationale: πρός加宾格在此引出与“子”有关或对“子”所说的话；结合上下文的对比和省略的言说动词，译作“至于子，他却说”自然地保留了转折与指向。
- source_word: υἱόν
  choice: 子
  rationale: 原文定冠词表明这是确定的称号；中文圣经语境中“子”简洁、庄重，并保留其基督论称谓。
- source_word: Ὁ θρόνος σου ὁ θεὸς
  choice: 上帝啊，你的宝座
  rationale: 将ὁ θεός理解为具有呼格作用的直接称呼，最符合引文的语势和《希伯来书》第一章的论证；另一种语法上可能的理解“上帝是你的宝座”收入脚注。
- source_word: εἰς τὸν αἰῶνα τοῦ αἰῶνος
  choice: 永永远远
  rationale: 这是表示无尽久远的惯用语；“永永远远”在现代中文中自然、庄重，也传达其加强语气。
- source_word: ῥάβδος
  choice: 权杖
  rationale: 在君王和国度的语境中，ῥάβδος指象征统治权柄的杖；“权杖”比“棍”或“杖”更准确。
- source_word: τῆς εὐθύτητος
  choice: 正直的
  rationale: εὐθύτης表示正直、端正或公正；“正直”较直接地保留其词义。“公义”也是可能译法，列入脚注。
- source_word: ῥάβδος τῆς βασιλείας σου
  choice: 你国度的权杖
  rationale: βασιλεία可指国度、王权或统治；“你国度的权杖”保留原文结构和王权意象。
theological_decisions:
- issue: 引文中的ὁ θεός是直接称呼子为“上帝”，还是作表语，意为“上帝是你的宝座”。
  choice: 采用直接称呼：“上帝啊，你的宝座……”。
  alternative: “上帝是你的宝座，直到永永远远。”
  rationale: 定冠词形式的ὁ θεός可以具有呼格作用；在本章以经文凸显子超越天使的论证中，直接称呼更符合上下文和引文的力度。不过，表语读法在语法讨论中确有可能，因此以脚注保留，不把真实歧义隐藏起来。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“至于子，他却说”承接上下文对比；诗体分行保留引文的节奏。所有脚注标记均在正文中出现。
