  text: οὐχὶ πάντες εἰσὶν λειτουργικὰ πνεύματα εἰς διακονίαν ἀποστελλόμενα διὰ τοὺς μέλλοντας κληρονομεῖν σωτηρίαν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/014.yaml
  text: Are they not all ministering spirits, being sent out for service for the sake of those who are about to inherit salvation?[a]
translation:
  language: zh_hans
  text: 他们不都是服役的灵，奉差遣为那些将要承受救恩的人效力吗？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那些将承受救恩的人。”原文的表达具有面向未来的含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχὶ
  choice: 不都是……吗
  rationale: 以现代汉语反问句表达原文预期肯定回答的语气。
- source_word: πάντες
  choice: 都
  rationale: 保留原文涵盖所有天使的完整范围。
- source_word: λειτουργικὰ πνεύματα
  choice: 服役的灵
  rationale: “服役”既表达受命服务，也保留 λειτουργικός 所含较正式、神圣的职事色彩；“灵”按上下文指天使。
- source_word: εἰς διακονίαν
  choice: 去服事
  rationale: 自然表达目的意义，并避免“事工”等可能带有现代教会制度色彩的词。
- source_word: ἀποστελλόμενα
  choice: 奉差遣
  rationale: 保留被动含义，表明这些灵受差派；“奉”也符合本句庄重语体，但不明说差遣者。
- source_word: διὰ τοὺς
  choice: 那些……的人
  rationale: 借“服事那些人”的句法自然传达天使的服事以这些人为受益对象，避免把 διά 过度限定为单一因果意义。
- source_word: μέλλοντας
  choice: 将要
  rationale: 保留面向未来的预期意义，同时不强化为预定或必然命定。
- source_word: κληρονομεῖν
  choice: 承受
  rationale: “承受”是现代中文圣经语境中自然且庄重的继承用语，保留产业与后嗣意象。
- source_word: σωτηρίαν
  choice: 救恩
  rationale: 准确表达本段具有终末指向的 salvation，也符合现代中文基督教通用语汇。
theological_decisions:
- issue: μέλλοντας κληρονομεῖν σωτηρίαν 的时间与神学力度
  choice: 将要承受救恩
  alternative: 必承受救恩／注定承受救恩
  rationale: “将要”保存 μέλλω 的未来、预期取向，却不额外引入关于确据或预定的宗派性结论。
- issue: 天使服事的对象与目的
  choice: 奉差遣去服事那些……的人
  alternative: 为那些……的人被差来效力
  rationale: 将 εἰς διακονίαν 明确处理为差遣的目的，并使 διά 所指的人自然成为受益者，而不超出原文说明服事的具体方式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“服役的灵”保持正式服务的色彩；“奉差遣去服事”使希腊文分词结构在中文中自然，同时保留受差派和目的关系。
