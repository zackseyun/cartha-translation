review_pass:
  verdict: revise
  source_fidelity: 正文准确保留反问语气、全称范围、受差遣的被动意味、服事的目的，以及“将要承受救恩”的未来取向。将“去服事那些人”调整为“为……效力”，更清楚呈现εἰς διακονίαν与διὰ τοὺς的目的及受益关系，也避免把服事方式限定为直接服事对象。
  naturalness: “服役的灵”虽带有较庄重的圣经语体，但在中文圣经语境中稳定且可理解。“奉差遣为……效力”比“奉差遣去服事那些……的人”更凝练自然，句法也更顺畅。
  terminology: “承受救恩”恰当保留κληρονομεῖν的继承意象；“救恩”符合希伯来书语境。原脚注的“必将承受”给“将要／将会”的未来意义加入了原文未明确编码的必然性，因此应改为不带强化意味的替代说法。
  issues:
