    issue: 脚注将替代译法表述为“必将承受救恩的人”。
    rationale: μέλλω加不定式具有未来／预期取向，但“必将”在现代汉语中额外强化了确定性。英语审校轨迹所列替代译法是“those who will inherit salvation”，宜译作“将承受”或“要承受”，而非“必将”。
  - severity: low
    issue: “去服事那些……的人”略将服务关系具体化为直接服事对象。
    rationale: 原文说这些灵被差遣进入服事，为着／为了那些将承受救恩的人；“为……效力”在中文中更自然地保留其受益、目的关系。
