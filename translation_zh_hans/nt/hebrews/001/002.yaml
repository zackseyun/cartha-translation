  text: ἐπ’ ἐσχάτου τῶν ἡμερῶν τούτων ἐλάλησεν ἡμῖν ἐν υἱῷ, ὃν ἔθηκεν κληρονόμον πάντων, δι’ οὗ καὶ ⸂ἐποίησεν τοὺς αἰῶνας⸃·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/002.yaml
  text: in these last days he has spoken to us in a Son[a], whom he appointed heir of all things[b], through whom he also made the ages.
translation:
  language: zh_hans
  text: 在这末后的日子，他借着一位儿子[a]向我们说了话；他立这位儿子为万有的继承者，又借着他创造了诸世代[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在儿子里。”原文介词的基本意思是“在”；“儿子”前没有冠词，着重表明神说话的方式，以及这次说话所具有的高潮性质。这里的“一位”并非必然表示众多儿子中的一个。
    reason: lexical_alternative
  - marker: b
    text: 或译：“宇宙”或“诸世界”。原文是“诸世代”，既可指各个世代，也可延伸指整个受造秩序。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπ’ ἐσχάτου τῶν ἡμερῶν τούτων
  choice: 在这末后的日子
  rationale: 这是自然的现代汉语时间表达，同时保留原文末世性的意味；相比“在这些日子的末了”，更清楚地表达现今处于这些日子的最后阶段。
- source_word: ἐλάλησεν ἡμῖν
  choice: 向我们说了话
  rationale: 用“说了话”体现不定过去时所表达的已发生行动，并与上一节神从前的说话形成对照；“向我们”自然表达间接受词。
- source_word: ἐν υἱῷ
  choice: 借着一位儿子
  rationale: “借着”在现代汉语中清楚表达神说话所采用的媒介；“一位儿子”保留υἱῷ前没有冠词这一显著形式。原文介词ἐν较直译的“在一位儿子里”在汉语中容易被误解为位置或内住，因此将直译可能性收入脚注。
- source_word: ὃν ἔθηκεν κληρονόμον πάντων
  choice: 他立这位儿子承受万有
  rationale: τίθημι在这里指设立或委任；“立……承受万有”比“使……成为继承人”更简洁庄重，也自然表达κληρονόμος的承受产业含义。
- source_word: δι’ οὗ
  choice: 借着他
  rationale: διά加属格表示中介或凭借；“借着他”准确而自然。
- source_word: ἐποίησεν
  choice: 创造了
  rationale: ποιέω本义较宽，可译“造”或“做成”；在宇宙论语境中，“创造”最能让普通读者明白这里是使诸世代及受造秩序存在，同时没有改变句中借着儿子的中介关系。
- source_word: τοὺς αἰῶνας
  choice: 诸世代
  rationale: “诸世代”保留αἰῶνες的时间维度及复数形式，不先把它缩窄为纯空间意义的“宇宙”；该词在此也可延伸指各世代所构成的整个受造秩序，故在脚注列出其他译法。
theological_decisions:
- issue: ἐν υἱῷ的基督论分量及无冠词形式
  choice: 正文译作“借着一位儿子”，并用脚注说明直译“在一位儿子里”
  alternative: 借着他的儿子；在儿子里；以儿子向我们说话
  rationale: 原文没有所有格“他的”，也没有冠词，不宜在正文中默默补入；但汉语“在一位儿子里”容易产生空间或内住意义。当前译法力求兼顾原文形式、启示的高潮性质和普通读者的可理解性，不把“一位”解释成众多同类儿子中的一个。
- issue: τοὺς αἰῶνας的时间—宇宙范围
  choice: 正文保留“诸世代”，脚注说明也可理解为“宇宙”或“诸世界”
  alternative: 宇宙；诸世界；世界
  rationale: αἰῶνες本有世代、时代之义，在相关语境中可转指由时空共同构成的受造秩序。保留“诸世代”可避免消除其时间色彩，脚注则确保读者不会误以为儿子的创造工作仅限于抽象的历史时期。
translation_notes:
  register: 采用现代、庄重而清楚的书面汉语。“末后的日子”“承受万有”保留经文的末世论和产业意象；对较不寻常的“诸世代”以脚注补足其宇宙性含义。句子分为两句，以免长串关系从句妨碍普通读者理解。
