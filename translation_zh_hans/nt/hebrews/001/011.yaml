  text: αὐτοὶ ἀπολοῦνται, σὺ δὲ διαμένεις· καὶ πάντες ὡς ἱμάτιον παλαιωθήσονται,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/011.yaml
  text: They will perish[a], but you remain; and they all will wear out like a garment[b],
translation:
  language: zh_hans
  text: 它们必灭亡，你却长存；它们全都要像衣服一样渐渐破旧，[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “渐渐破旧”也可译作“变旧”。
    reason: lexical_alternative
  - marker: b
    text: 这里的意象引自《诗篇》102:25–27，对比受造界的短暂易逝与被直接称呼的那一位的恒久长存。
    reason: cross_reference
lexical_decisions:
- source_word: αὐτοὶ
  choice: 它们
  rationale: 所指承接上一节的“天地”。现代汉语以“它们”自然指代受造之物；与后面的“你”相对，也保留了原文的强调作用。
- source_word: ἀπολοῦνται
  choice: 必灭亡
  rationale: 此处表示终必消逝、归于无有。“灭亡”保留原词较强的语气，又不像“被毁灭”那样额外指定外在施动者；“必”体现将来语气。
- source_word: σὺ δὲ
  choice: 你却
  rationale: 明确保留第二人称直接称呼，并用“却”突出受造界与受称呼者之间的强烈对比。
- source_word: διαμένεις
  choice: 长存
  rationale: 表达持续存在、恒久不变，既符合 διαμένω 的语义，也与前面的“灭亡”形成简洁鲜明的对照。
- source_word: πάντες
  choice: 它们全都
  rationale: 明确回指前文所说的天地，并保留 πάντες 的整体、无一例外之意。
- source_word: ὡς ἱμάτιον
  choice: 像衣服一样
  rationale: ἱμάτιον 泛指衣物或外衣；“衣服”是现代汉语中自然且不过度限定种类的表达。
- source_word: παλαιωθήσονται
  choice: 要……变旧
  rationale: παλαιόω 的被动形式在此表示因年久而变旧、破损。“变旧”贴近原词，并让衣服的比喻自然清楚。
theological_decisions:
- issue: 受称呼者及其基督论含义
  choice: 保留对圣子的直接第二人称称呼：“你却长存”
  alternative: 改成第三人称，或在正文中增添“圣子永恒不变”等解释
  rationale: 《希伯来书》第一章的语境把这段诗篇引文用于圣子。译文保留直接称呼及受造界会灭亡、受称呼者却长存的张力，但不在正文中加入原文没有明说的教义解释。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“必灭亡／却长存／全都要……变旧”的对称结构保留原文的诗性对比。脚注标记置于“变旧”之后：词汇异译实际对应 παλαιωθήσονται，同时交代引文背景。
