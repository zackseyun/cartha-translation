id: HEB.10.1
reference: Hebrews 10:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Σκιὰν γὰρ ἔχων ὁ νόμος τῶν μελλόντων ἀγαθῶν, οὐκ αὐτὴν τὴν εἰκόνα τῶν πραγμάτων, κατ’ ἐνιαυτὸν ταῖς αὐταῖς θυσίαις ἃς προσφέρουσιν εἰς τὸ διηνεκὲς οὐδέποτε ⸀δύναται τοὺς προσερχομένους τελειῶσαι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/001.yaml
  text: For since the law has only a shadow of the good things to come[a], not the very form of the realities, it can never, by the same sacrifices that they continually offer year after year[c][b], perfect those who draw near.
translation:
  language: zh_hans
  text: 因为律法只有将来美好之事的影子，并不是那些真实事物本身的形象[a]，所以绝不能借着年年不断献上的同样的祭物，使那些前来亲近的人[b]完全[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“并不是那些真实事物本身的实像。”
    reason: lexical_alternative
  - marker: b
    text: “前来亲近”在这里指人在敬拜中来到上帝面前。
    reason: cultural_note
  - marker: c
    text: 或译：“使……达到目标”或“使……得以完全”。这里不单指道德上毫无缺点。
    reason: lexical_alternative
lexical_decisions:
- source_word: Σκιὰν
  choice: 影子
  rationale: 保留原文与“形像”相对的比喻，表达律法所具有的预示性轮廓，而不把它解释成最终实体。
- source_word: τῶν μελλόντων ἀγαθῶν
  choice: 将来美好之事
  rationale: 既保留 μέλλω 的未来指向，也不额外限定这些美好之事实现的具体时间或方式。
- source_word: οὐκ αὐτὴν τὴν εἰκόνα τῶν πραγμάτων
  choice: 并不是那些真实事物本身的形像
  rationale: “本身”体现 αὐτήν 的强调语气；“形像”保留 εἰκών 的图像性，并以“真实事物”呈现影子与实体之间的对照。
- source_word: κατ’ ἐνιαυτὸν ταῖς αὐταῖς θυσίαις ἃς προσφέρουσιν εἰς τὸ διηνεκές
  choice: 借着年年不断献上的同样祭物
  rationale: “年年”表达年度重复，“不断献上”表达持续进行的礼仪实践，“同样祭物”保留反复献同类祭物的重点。
- source_word: οὐδέποτε δύναται
  choice: 绝不能
  rationale: 简洁表达能力动词与绝对否定的合力。
- source_word: τοὺς προσερχομένους
  choice: 那些前来亲近的人
  rationale: 保留原文没有明说宾语的表达，同时使其在希伯来书的敬拜语境中仍带有到上帝面前的含义。
- source_word: τελειῶσαι
  choice: 使……达到完全
  rationale: “达到完全”既保留 τελειόω 的关键词联系，也比单说“使完美”更能表达被带到预定目标、得以完全亲近上帝的含义。
theological_decisions:
- issue: 律法的“影子”与“形像／真实事物”之间的关系
  choice: 律法具有将来美好之事的影子，却不是那些真实事物本身的形像。
  alternative: 把律法说成将来福分的象征性形像。
  rationale: 原文明确以 σκιά 和 εἰκών 构成对照。译文不贬低律法由上帝所赐的预示作用，也不把律法等同于它所指向的最终真实。
- issue: 祭物不能“使人达到完全”的含义
  choice: 保留“达到完全”这一开放而具有神学分量的措辞。
  alternative: 译作“使人道德上毫无瑕疵”或仅译作“完成礼仪”。
  rationale: 希伯来书中的 τελειόω 涉及被带到目标、获得充分亲近上帝的地位；译文避免把它窄化为无罪的道德完美，也避免只理解为礼仪程序的完成。
- issue: “前来亲近”所指的对象
  choice: 正文保留原文未明说的宾语，脚注说明其敬拜语境。
  alternative: 正文直接补出“前来亲近上帝的人”。
  rationale: 上下文清楚指向亲近上帝，但希腊文此处没有明说宾语；保留省略可避免把上下文解释伪装成明文。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“影子—形像—真实事物”保留原文的比喻张力；“年年不断献上”以通顺语序呈现两层重复性；正文不补出“上帝”，由脚注交代其敬拜含义。
