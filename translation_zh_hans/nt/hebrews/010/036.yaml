id: HEB.10.36
reference: Hebrews 10:36
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὑπομονῆς γὰρ ἔχετε χρείαν ἵνα τὸ θέλημα τοῦ θεοῦ ποιήσαντες κομίσησθε τὴν ἐπαγγελίαν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/036.yaml
  text: For you have need of endurance[a], so that after doing the will of God you may receive the promise.
translation:
  language: zh_hans
  text: 因为你们需要坚忍，好使你们实行了上帝的旨意以后，可以领受那应许[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“领受所应许的。”
    reason: 原文“应许”在这里也可转指应许的内容或实现。
lexical_decisions:
- source_word: ὑπομονῆς
  choice: 坚忍
  rationale: 指人在压力和试炼中坚定持守、持续不退；“坚忍”兼顾忍受与恒常坚持的含义。
- source_word: χρείαν ἔχετε
  choice: 你们需要
  rationale: 这是表达“需要”的常用希腊语结构；采用现代汉语的自然说法。
- source_word: ἵνα
  choice: 好使
  rationale: 表达目的或预期结果，同时保留原句的逻辑联系。
- source_word: τὸ θέλημα τοῦ θεοῦ
  choice: 上帝的旨意
  rationale: 直接对应属格结构，且符合现代中文圣经语体。
- source_word: ποιήσαντες
  choice: 实行了……以后
  rationale: 不定过去时分词通常表示先于主句动词发生的行动；“以后”清楚呈现这一时间关系。
- source_word: κομίσησθε
  choice: 可以领受
  rationale: 在本语境中指获得或领受所应许之物；“领受”自然且保留庄重语气。
- source_word: τὴν ἐπαγγελίαν
  choice: 那应许
  rationale: 按字面保留“应许”本身，同时不排除它转指应许之实现或所应许之福分。
theological_decisions:
- issue: ἐπαγγελίαν是指“应许”本身，还是指“所应许的事物或福分”
  choice: 那应许
  alternative: 所应许的
  rationale: 希腊文名词直译为“应许”，但与“领受”连用时也可转指所应许的内容。正文保留原文措辞和其中的张力，脚注列出较具解释性的译法。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准普通话。“坚忍”突出在患难中坚定持守；句法明确呈现先实行上帝旨意、继而领受应许的关系，但不把“应许”的具体内容解释进正文。
