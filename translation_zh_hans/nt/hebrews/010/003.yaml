  text: ἀλλ’ ἐν αὐταῖς ἀνάμνησις ἁμαρτιῶν κατ’ ἐνιαυτόν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/003.yaml
  text: But in these sacrifices there is a reminder of sins year after year,[a]
translation:
  language: zh_hans
  text: 然而，在这些祭物中，每年都有对罪的提醒。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“年年”。
    reason: 说明 κατ’ ἐνιαυτόν 表示每年反复发生；“每年”与“年年”均可，前者在本句中较为平实自然。
lexical_decisions:
- source_word: ἀλλ’
  choice: 然而
  rationale: 承接上文并形成转折：这些祭物不能使敬拜的人完全，反而带来对罪的记念。“然而”庄重自然，清楚表达逆接关系。
- source_word: ἐν αὐταῖς
  choice: 这些祭物却使人
  rationale: 阴性复数代词 αὐταῖς 回指上文反复献上的祭物。汉语若直译为“在这些祭物中”较生硬，因此按语义关系译作“这些祭物却使人”，明确所指而不增加新的对象。
- source_word: ἀνάμνησις
  choice: 想起
  rationale: ἀνάμνησις 表示记起、提醒或记念。译作“使人……想起”符合现代汉语表达，并保留这些祭物唤起对罪之记忆的含义。
- source_word: ἁμαρτιῶν
  choice: 罪
  rationale: 该属格指出所记起的内容是“罪”。汉语用“想起罪来”自然简洁，也不额外限定是罪行、罪责或罪性。
- source_word: κατ’ ἐνιαυτόν
  choice: 年年
  rationale: κατά 加时间宾格表达每年反复发生。“年年”既自然又突出持续的年度重复，与本段论证相合。
theological_decisions:
- issue: αὐταῖς 的所指
  choice: 明确译为“这些祭物”
  alternative: 译作“在其中”或“借着这些”
  rationale: 上文谈到不断献上的同样祭物，代词显然回指这些祭物。明示所指有助于普通读者理解，也保留作者对反复献祭之功效的论述。
- issue: ἀνάμνησις ἁμαρτιῶν 的施事关系
  choice: 译为“这些祭物却使人……想起罪来”
  alternative: 译为“其中有对罪的记念”
  rationale: 原文采用存在式表达，没有明说是谁想起罪。汉语采用使动句较自然，但以泛指的“人”避免把记念限定为上帝、祭司或敬拜者中的某一方。
- issue: κατ’ ἐνιαυτόν 的语气
  choice: 译为“年年”，突出逐年重复
  alternative: 译为“每年”
  rationale: 两者都符合原文；“年年”更能传达本段强调的反复性，却不把经文背景明确限定为某个节期。
translation_notes:
  register: 采用现代、简洁而庄重的书面汉语。“这些祭物”承接上下文；“使人……想起”比“其中有罪的记念”更符合普通现代读者的表达习惯。保留“罪”的宽泛含义，不擅自解释为罪责或具体罪行。
