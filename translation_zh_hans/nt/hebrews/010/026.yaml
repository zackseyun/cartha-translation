  text: Ἑκουσίως γὰρ ἁμαρτανόντων ἡμῶν μετὰ τὸ λαβεῖν τὴν ἐπίγνωσιν τῆς ἀληθείας, οὐκέτι περὶ ἁμαρτιῶν ἀπολείπεται θυσία,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/026.yaml
  text: For if we go on sinning deliberately after receiving the knowledge of the truth[a], there no longer remains a sacrifice for sins,
translation:
  language: zh_hans
  text: 因为如果我们在领受真理的知识[a]以后，仍不断地故意犯罪，就不再有为罪献上的祭了，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“对真理更充分的认识。”希腊语此词可带有较充分或决定性的认识之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἑκουσίως
  choice: 故意
  rationale: 表达有意识、出于意愿的犯罪，现代中文清楚自然，也避免“任意”可能产生的歧义。
- source_word: γὰρ
  choice: 因为
  rationale: 承接上文，保留本句对前文论述的解释关系。
- source_word: ἁμαρτανόντων ἡμῶν
  choice: 若我们仍……不断犯罪
  rationale: 用条件句使属格独立结构符合现代汉语；“仍……不断”体现现在分词所提示的持续性，而非一次孤立的行为。
- source_word: μετὰ τὸ λαβεῖν
  choice: 领受了……以后
  rationale: 准确表达先完成领受、随后发生持续犯罪的时间次序；“领受”也适合本段庄重语体。
- source_word: ἐπίγνωσιν
  choice: 知识
  rationale: 保留该词的基本词义，不在正文中强行加入“完全”或“得救”等神学限定；较强的认识意味列入脚注。
- source_word: τῆς ἀληθείας
  choice: 真理的
  rationale: 忠实保留属格关系，并与新约语境中对真理的表达相符。
- source_word: οὐκέτι
  choice: 再没有
  rationale: 自然表达从此不再存有的含义。
- source_word: περὶ ἁμαρτιῶν
  choice: 为罪而献的
  rationale: 在献祭语境中，περὶ加属格可表示祭物所针对的罪；补出“而献的”使中文关系明确。
- source_word: ἀπολείπεται
  choice: 有
  rationale: 与“再没有”组成自然的汉语存在句，表达“不再留下、存有”。
- source_word: θυσία
  choice: 祭
  rationale: 准确对应献祭语境，且较“祭物”更能涵盖祭献本身；结合“而献的”可清楚表达其用途。
theological_decisions:
- issue: ἁμαρτανόντων的体貌及警告力度
  choice: 译作“若仍故意不断犯罪”，指向持续、执意的犯罪行为。
  alternative: 若故意犯罪
  rationale: 现在分词自然带有持续或反复的意味。此译法保持警告的严肃性，却不把经文扩大解释为任何一次孤立的故意犯罪，也不预断背道与坚忍方面的宗派争论。
- issue: ἐπίγνωσις在归信与警告语境中的含义
  choice: 正文译作“真理的知识”，不界定这种知识是否必然等同于使人得救的重生认识。
  alternative: 对真理的完全认识；使人得救的真理知识
  rationale: 原文说明人已经领受ἐπίγνωσις，却没有在本节明确界定其经验或神学深度。因此正文保持词义层面的开放性，并以脚注提示“充分认识”的可能含义。
- issue: “不再有祭”的范围
  choice: 按原文直译为“再没有为罪而献的祭”，不补充“别的”或直接解释其救恩论结论。
  alternative: 再没有别的赎罪祭；基督的祭不再有效
  rationale: 上下文将基督独一的献祭与持续故意犯罪相对照，但本句本身没有“别的”一词，也没有说祭物本身失效；译文因此保留其严厉而未完全展开的张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“领受”保留经文语体的郑重感；“仍故意不断犯罪”兼顾汉语自然度与希腊语现在分词的持续意味。脚注标记已在正文相应位置标出。
