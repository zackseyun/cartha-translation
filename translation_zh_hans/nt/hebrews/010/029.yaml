id: HEB.10.29
reference: Hebrews 10:29
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: πόσῳ δοκεῖτε χείρονος ἀξιωθήσεται τιμωρίας ὁ τὸν υἱὸν τοῦ θεοῦ καταπατήσας, καὶ τὸ αἷμα τῆς διαθήκης κοινὸν ἡγησάμενος ἐν ᾧ ἡγιάσθη, καὶ τὸ πνεῦμα τῆς χάριτος ἐνυβρίσας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/029.yaml
  text: How much worse punishment do you think will be deserved by the one who has trampled underfoot the Son of God[a], and has regarded the blood of the covenant by which he was sanctified as common[c][b], and has insulted the Spirit of grace?
translation:
  language: zh_hans
  text: 你们想，那践踏了神的儿子，把借着这血使他成圣的盟约的血当作平常之物[a][b]，又侮辱了恩典之灵[c]的人，该受何等更严厉的刑罚呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “当作平常之物”也可译作“当作不洁之物”或“当作俗物”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文在句法上把“借着这血使他成圣”与本节所描述的那个人相连；也有解释采用不同的所指。译文保留原句的张力，不据此解决相关的神学争论。
    reason: alternative_reading
  - marker: c
    text: “侮辱”也可译作“凌辱”或“以傲慢轻蔑的态度对待”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πόσῳ…χείρονος
  choice: 何等更严厉
  rationale: 把希腊文程度词与比较级合起来译成自然的汉语反问，既表达比较，也突出刑罚加重的程度。
- source_word: ἀξιωθήσεται τιμωρίας
  choice: 该受……刑罚
  rationale: 保留“被认定配受”的司法意味，同时避免生硬的被动表达。
- source_word: καταπατήσας
  choice: 践踏
  rationale: 保留原文强烈而具体的蔑视性比喻。
- source_word: υἱὸν τοῦ θεοῦ
  choice: 神的儿子
  rationale: 准确、通行地表达原文的称号。
- source_word: αἷμα τῆς διαθήκης
  choice: 立约之血
  rationale: “立约”清楚表达 διαθήκη 的盟约含义，“之血”则保留庄重、浓缩的圣经语体和献祭联想。
- source_word: κοινὸν ἡγησάμενος
  choice: 当作平常之物
  rationale: κοινός 在这里与圣洁、分别为圣相对；“平常之物”保留这一基本对照，而不直接限定为礼仪上的“不洁”。
- source_word: ἐν ᾧ ἡγιάσθη
  choice: 使他成圣
  rationale: 按工具意义理解 ἐν ᾧ，即借着这血成圣；“他”照希腊文句法自然指向本节所描述的人，同时不额外解释其神学状态。
- source_word: ἐνυβρίσας
  choice: 侮辱
  rationale: 表达以傲慢和轻蔑方式凌辱的强烈含义，又是现代读者容易理解的说法。
- source_word: τὸ πνεῦμα τῆς χάριτος
  choice: 恩典之灵
  rationale: 保留属格结构及其可能的语义层次，不把它进一步解释为“施恩的灵”或“赐下恩典的灵”。
theological_decisions:
- issue: ἐν ᾧ ἡγιάσθη 中“成圣”者的所指
  choice: 译为“使他成圣”，依照本句最自然的语法关系，让“他”指向所描述的犯罪者。
  alternative: 有解释认为所指是基督、立约之血本身或立约群体。
  rationale: 希腊文中单数动词的自然句法联系是那位由三个分词描述的人；译文保存这一表层句法，但用脚注说明争议，不借翻译解决有关背道与坚忍的神学问题。
- issue: κοινόν 的圣俗含义
  choice: 当作平常之物
  alternative: 当作不洁之物；当作俗物
  rationale: “平常”保留它与“圣洁”相对的基本意义，也保留其是否进一步含有“不洁”意味的解释空间。
- issue: τὸ πνεῦμα τῆς χάριτος 的属格关系
  choice: 恩典之灵
  alternative: 施恩之灵；赐恩的灵
  rationale: 直译式属格短语可同时容纳与恩典相关、带来恩典等理解，避免不必要地限定关系。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。句首“你们想”保留原文直接向读者发问的修辞；“践踏”“立约之血”“恩典之灵”保留原文鲜明意象和神学用语。
