  text: ὅπου δὲ ἄφεσις τούτων, οὐκέτι προσφορὰ περὶ ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/018.yaml
  text: Where there is forgiveness of these[a], there is no longer any offering for sin.
translation:
  language: zh_hans
  text: 既然这些已经得到赦免[a]，就不再有为罪而献的祭了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “得到赦免”也可译作“得到宽赦”。“这些”指上一节提到的罪和不法行为。
    reason: 说明ἄφεσις的词义选择及τούτων在上下文中的所指。
lexical_decisions:
- source_word: ὅπου
  choice: 既
  rationale: 此处ὅπου并非着重空间地点，而是引出前提成立时的结论。结合汉语表达，用“既……就……”自然呈现“有这些罪得赦免之处/情形，就……”的逻辑关系。
- source_word: δὲ
  choice: 不单独译出
  rationale: δέ在此承担轻微的承接与推论作用；汉语“既……就……”已清楚表达这一衔接，若另加“而”或“如今”反而可能造成强烈转折或时间含义。
- source_word: ἄφεσις
  choice: 蒙赦免
  rationale: ἄφεσις在此指罪与不法行为得到赦免。“蒙赦免”是现代汉语中自然、庄重的表达，也保留了承受赦免的含义。
- source_word: τούτων
  choice: 这些
  rationale: 保留希腊文指示代词的含蓄所指，由上文说明它指前一节的罪和不法行为，不在正文中擅自补成“这些罪”。
- source_word: οὐκέτι
  choice: 不再
  rationale: 准确表达某种状态从此不复存在，并与上下文反复献祭和一次有效献祭的对比相符。
- source_word: προσφορὰ
  choice: 献祭
  rationale: προσφορά指所献的供物或献上的行动。在本段祭祀语境中，“献祭”比单说“祭物”更自然，同时不把词义限缩为某一种特定祭。
- source_word: περὶ ἁμαρτίας
  choice: 为罪
  rationale: 保留该祭祀短语“为处理罪而献”的宽度，不明确改译为专门礼仪名称“赎罪祭”，也不把单数集合意义机械处理。
theological_decisions:
- issue: 基督献祭终极性的含义
  choice: 译文说明：这些既已得到赦免，就不再需要为罪献祭。
  alternative: 将本节理解为废除一切形式的奉献，或仅指某项狭义礼仪规定。
  rationale: 上下文对比反复献上的祭与基督一次而永远有效的献祭。本译文只表达不再需要“为罪献祭”，不把结论扩展到所有奉献，也不把经文的效力缩小为单一仪式层面。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“既……就……”使推论关系清晰；“不再需要”自然表达原文中不再有为罪之祭的含义，但不扩张为禁止一切献礼或奉献。
