  text: ⸀καὶ τῶν ἁμαρτιῶν αὐτῶν καὶ τῶν ἀνομιῶν αὐτῶν οὐ μὴ ⸀μνησθήσομαι ἔτι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/017.yaml
  text: and I will no longer remember their sins and their lawless deeds[a][b].
translation:
  language: zh_hans
  text: “我也绝不再记得他们的罪和他们不法的事[a][b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较形式地译作：“我必定不再记得他们的罪和他们不法的事。”原文使用强烈的否定形式。
    reason: lexical_alternative
  - marker: b
    text: “不法的事”译自ἀνομίαι，也可译作“不法行为”；传统上常译作“罪孽”。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: 也
  rationale: 本节接续上一节的引文；译作“也”自然地承接前文，同时保留原文开头的连接作用。
- source_word: τῶν ἁμαρτιῶν αὐτῶν
  choice: 他们的罪
  rationale: ἁμαρτία在此最自然地指“罪”；复数形式概括他们所犯的罪，直译清楚且符合现代汉语习惯。
- source_word: καὶ τῶν ἀνομιῶν αὐτῶν
  choice: 和他们不法的事
  rationale: ἀνομία表示不守法律、违背律法或无法无天的行为。译作“不法的事”既体现复数所指的具体行为，也比传统但较抽象的“罪孽”更直接。
- source_word: οὐ μὴ μνησθήσομαι
  choice: 我绝不……记得
  rationale: οὐ μή与将来时动词连用，构成强烈否定；“绝不”传达其确定而强调的语气，同时保留“记得”这一重要的圣经表达。
- source_word: ἔτι
  choice: 再
  rationale: ἔτι在否定句中表示“不再、再也不”；与“绝不……记得”结合为“绝不再记得”，简洁自然。
theological_decisions:
- issue: 上帝不再记得人的罪
  choice: 按原文直译为“我也绝不再记得他们的罪和他们不法的事”，保留“记得”这一盟约性表达。
  alternative: 意译为“我绝不再追究他们的罪和不法行为”。
  rationale: 原文说的是上帝“不再记得”，语境指向赦免，但若直接译成“不再追究”，会替读者解释这一意象。保留原有说法，既不把它曲解为上帝失去知识，也不在译文中预先消解其神学张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留引文开头的连接词和“记得”的圣经意象；用“绝不再”同时表达强烈否定与“不再”的时间含义。两个脚注标记均置于正文相应句末。
