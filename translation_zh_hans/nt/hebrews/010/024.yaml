  text: καὶ κατανοῶμεν ἀλλήλους εἰς παροξυσμὸν ἀγάπης καὶ καλῶν ἔργων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/024.yaml
  text: and let us consider one another[a], to stir up love and good works,
translation:
  language: zh_hans
  text: 也要彼此留意，以激发爱心和善行。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατανοῶμεν
  choice: 要……留意
  rationale: 该词是第一人称复数现在时虚拟语气，在这里表达共同劝勉；“要……留意”既保留仔细关注、认真思量的含义，也符合现代汉语的劝勉语气。
- source_word: ἀλλήλους
  choice: 彼此
  rationale: 准确表达相互关系，并自然体现群体成员互相关注的语境。
- source_word: εἰς
  choice: 好
  rationale: 此处引出目的或结果；“好”在现代汉语中自然地表达“为要、以便”的关系。
- source_word: παροξυσμὸν
  choice: 激发
  rationale: 该名词可指强烈的刺激、促动或激惹。因其后所指向的是爱心和善行，“激发”能传达积极而有力度的促动，同时避免把原词柔化成一般性的“鼓励”。
- source_word: ἀγάπης
  choice: 爱心
  rationale: “爱心”是现代汉语中对ἀγάπη自然、庄重的表达，在“激发”之后也比单用“爱”更顺畅。
- source_word: καλῶν ἔργων
  choice: 善行
  rationale: 简洁对应“美善的行为”，保留实际行动的含义，又不引入有关功德或赚取救恩的特定教义联想。
- source_word: καὶ
  choice: 也；和
  rationale: 句首的καὶ承接上文，译作“也”；名词短语之间的καὶ连接“爱心”和“善行”，译作“和”。
theological_decisions:
- issue: παροξυσμός可能带有负面的“激惹、挑动”色彩
  choice: 正文译作“激发”
  alternative: 促动；激励；激起
  rationale: 原词本身力度较强，有时可含负面意味，但这里的对象是爱心和善行。译作“激发”既符合正面语境，又保留强力促动的意味；脚注说明其较强的词义范围，避免掩盖原文张力。
- issue: ἀλλήλους与劝勉行动的句法关系
  choice: 按原文直接译为“彼此留意”
  alternative: 要想想怎样彼此激励
  rationale: 原文明确以“彼此”作为κατανοῶμεν所关注的对象，而不是直接把它改作“激励”的对象。正文保留这一结构，不把解释性的关系写死。
translation_notes:
  register: 采用现代、庄重而易懂的共同劝勉语体。“彼此留意”保留原文以他人为认真关注对象的结构；“好激发”自然表达目的关系。
