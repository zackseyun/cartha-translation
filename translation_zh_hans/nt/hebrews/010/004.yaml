  text: ἀδύνατον γὰρ αἷμα ταύρων καὶ τράγων ἀφαιρεῖν ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/004.yaml
  text: For it is impossible for the blood of bulls and goats to take away sins[a].
translation:
  language: zh_hans
  text: 因为公牛和公山羊的血绝不可能除去罪[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “除去”也可译作“移除”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδύνατον
  choice: 绝不可能
  rationale: 该形容词与不定式构成无人称表达，表示绝对的不可能；“绝不可能”自然传达其强烈断言。
- source_word: γὰρ
  choice: 因为
  rationale: γάρ说明前文论证的理由；“因为”在现代汉语中清楚呈现解释关系。
- source_word: αἷμα
  choice: 血
  rationale: 原文明确指献祭牲畜的血，这是《希伯来书》论证的核心意象，不宜释作“祭物”或“死亡”。
- source_word: ταύρων
  choice: 公牛
  rationale: 保留ταῦρος所指的雄性牛，也符合祭祀语境。
- source_word: τράγων
  choice: 公山羊
  rationale: τράγος特指雄性山羊；译作“公山羊”准确而自然。
- source_word: ἀφαιρεῖν
  choice: 除去
  rationale: 该动词表示拿走、移除；“除去”既保留具体的移除意味，也适合与“罪”搭配。
- source_word: ἁμαρτίας
  choice: 罪
  rationale: 汉语“罪”通常可作集合性名词，能自然涵盖原文复数所指的诸般罪，而不必使用生硬的“罪行”。
theological_decisions:
- issue: 动物祭牲之血的功效
  choice: 正文仅断言动物的血绝不可能“除去罪”
  alternative: 说明它只能暂时遮盖罪，或只能带来礼仪上的洁净
  rationale: 原句本身未说明动物祭牲具有何种有限或暂时的功效；不把这些解释加入正文，可保留上下文中动物祭与弥赛亚献祭之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“公牛和公山羊的血”保留献祭语言的具体性；“绝不可能”传达ἀδύνατον的绝对力度。脚注标记已在正文中对应出现。
