  text: τὸ λοιπὸν ἐκδεχόμενος ἕως τεθῶσιν οἱ ἐχθροὶ αὐτοῦ ὑποπόδιον τῶν ποδῶν αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/013.yaml
  text: from then on waiting until his enemies are made a footstool for his feet[b][a],
translation:
  language: zh_hans
  text: 从此等候[a]，直到他的仇敌被放在他脚下作脚凳[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“期待”或“等待”。希腊文分词可含有带着期待而等候的意思。
    reason: lexical_alternative
  - marker: b
    text: 这里呼应诗篇110:1：“你坐在我的右边，等我使你的仇敌作你的脚凳。”这是关于君王登基的重要经文。
    reason: cross_reference
lexical_decisions:
- source_word: τὸ λοιπὸν
  choice: 从此
  rationale: 该中性冠词短语在这里作副词，指向前文所述献祭完成并坐下之后的时期。“从此”简洁自然地表达“从那时起”。
- source_word: ἐκδεχόμενος
  choice: 等候
  rationale: 该分词描述基督坐在上帝右边之后持续的状态，也可含有所期待地等待之意。“等候”符合现代庄重汉语，同时不暗示结果尚不确定。
- source_word: ἕως
  choice: 直到
  rationale: 保留时间界限，直接引出等候所指向的终点。
- source_word: τεθῶσιν
  choice: 被放在
  rationale: 该词是 τίθημι 的不定过去时被动虚拟式；“被放在”保留被动语态，并与后面的脚凳意象自然衔接。原文没有明说施动者，因此译文也不补出。
- source_word: οἱ ἐχθροὶ αὐτοῦ
  choice: 他的仇敌
  rationale: 自然、准确地表达原文的所属关系。
- source_word: ὑποπόδιον τῶν ποδῶν αὐτοῦ
  choice: 在他脚下作脚凳
  rationale: 保留诗篇110:1具体的脚凳意象，同时采用现代汉语自然的表达，避免生硬直译为“他双脚的脚凳”。
theological_decisions:
- issue: 诗篇110:1的弥赛亚登基意象
  choice: 保留仇敌被放在他脚下“作脚凳”的具体形象
  alternative: 译作“直到他的仇敌被征服”或“被置于他的权下”
  rationale: 希伯来书在此有意呼应诗篇110:1。保留脚凳形象，既维持经文之间的联系和登基语境，也不把意象提前解释成单一的抽象命题。
- issue: 被动语态的施动者
  choice: 保留“被放在”的被动表达，不明确补出施动者
  alternative: 译作“直到上帝把他的仇敌放在他脚下作脚凳”
  rationale: 上下文和诗篇引文可使读者理解施动者，但本节希腊文采用被动式而未明说施动者；不补出可保存原文形式及其含蓄性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“从此等候”承接前文，不重复补出主语；“在他脚下作脚凳”保留原文和诗篇引文的具体意象。所有脚注标记均置于相关词句之后。
