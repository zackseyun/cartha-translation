base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/030.yaml
  text: For we know the one who said[a], “Vengeance is mine; I will repay,” and again[b], “The Lord will judge his people.”
translation:
  language: zh_hans
  text: 因为我们知道那位曾说：“伸冤在我，我必报应。”又说[a]：“主必审判他的子民。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这两句引语呼应《申命记》32:35—36。在原来的语境中，“审判”可包括惩罚，也可包括为人伸冤；这里的警告语境着重上帝的审判。
    reason: cross_reference
lexical_decisions:
- source_word: οἴδαμεν γὰρ
  choice: 因为我们知道
  rationale: οἶδα虽为完成时形态，在通用希腊语中具有现在时意义；γάρ承接上文，说明前述警告的根据。
- source_word: τὸν εἰπόντα
  choice: 那位说过这话的
  rationale: 以自然的现代汉语表达名词化的不定过去时分词，并保留对说话者上帝的个人性指称。
- source_word: Ἐμοὶ ἐκδίκησις
  choice: 伸冤在我
  rationale: 原文为省略结构，直译近于“伸冤归我”；此译简洁庄重，保留伸张正义并施行惩罚的司法意味，也符合中文经文引语的自然表达。
- source_word: ἐγὼ ἀνταποδώσω
  choice: 我必报应
  rationale: 表达将来施行相应回报或惩罚的意思；“必”体现将来的确定性，“报应”保持本段严肃的审判语境。
- source_word: καὶ πάλιν
  choice: 又说
  rationale: 汉语需补出引语动词才自然；所补内容由前面的“说过”及再次引经公式明确支持。
- source_word: Κρινεῖ κύριος
  choice: 主必审判
  rationale: κρίνω在此具有司法判断的宽广含义；“审判”既不弱化警告语境，也不把词义限缩为单纯惩罚。
- source_word: τὸν λαὸν αὐτοῦ
  choice: 他的子民
  rationale: “子民”自然表达与上帝有归属关系的群体，并保留盟约性的语感。
theological_decisions:
- issue: 申命记引文中ἐκδίκησις的司法与报复含义
  choice: 伸冤在我
  alternative: 报仇在我；伸冤属于我
  rationale: “伸冤”侧重上帝按公义追究并施行裁决，避免把神圣司法降格为私人报复，同时没有淡化惩罚意味。
- issue: κρινεῖ在引文中的意义范围
  choice: 主必审判他的子民
  alternative: 主必为他的子民伸冤
  rationale: 申命记原语境可兼有惩罚与维护、昭雪的意味；希伯来书本段的警告语境尤其突出神的审判。正文采用范围较宽的“审判”，脚注说明其张力，不把含义单向锁定。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“伸冤在我，我必报应”保留引文的凝练节奏；“那位说过这话的”避免生硬直译。脚注标记[a]置于第二处引语导语后，涵盖两句引文及其背景说明。
