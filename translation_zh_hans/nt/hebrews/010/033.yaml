  text: τοῦτο μὲν ὀνειδισμοῖς τε καὶ θλίψεσιν θεατριζόμενοι, τοῦτο δὲ κοινωνοὶ τῶν οὕτως ἀναστρεφομένων γενηθέντες·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/033.yaml
  text: sometimes being publicly exposed to insults and afflictions[b][a], and at other times becoming partners with those who were treated that way.
translation:
  language: zh_hans
  text: 一方面，你们在辱骂和患难中被公开示众[a]；另一方面，你们又与那些遭受同样对待的人一同有分[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“被当众示为笑柄。”原文形象地描写人像在剧场中一样被公开展示，成为众人观看和羞辱的对象。
    reason: lexical_alternative
  - marker: b
    text: 也可能译作：“与那些这样行事为人的人一同有分。”原文分词有时指人的生活或行为方式，不过这里受逼迫的语境较支持“遭受同样对待”。
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦτο μὲν ... τοῦτο δὲ
  choice: 一方面……另一方面……
  rationale: 这一关联结构并列信徒从前忍受苦难的两种情形；现代汉语用“一方面……另一方面……”既自然，也不强行断定二者必定发生在不同时间。
- source_word: ὀνειδισμοῖς
  choice: 辱骂
  rationale: 该词指使人蒙羞的斥责、侮辱或恶言；“辱骂”清楚传达这里敌意言语攻击的意味。
- source_word: θλίψεσιν
  choice: 患难
  rationale: 该词表示外加的压力、困苦和磨难；“患难”在逼迫语境中庄重自然，又不把所受痛苦限制得过窄。
- source_word: θεατριζόμενοι
  choice: 被公开示众
  rationale: 该动词带有如同在剧场中被展示、成为众人观看和羞辱对象的形象；“被公开示众”保留公开羞辱的核心意象，较生动的表达另见脚注。
- source_word: κοινωνοὶ
  choice: 一同有分
  rationale: 该词强调与别人共同承受、参与其处境，而非仅指一般友谊；“一同有分”准确表达信徒与受逼迫者的认同和连带。
- source_word: τῶν οὕτως ἀναστρεφομένων
  choice: 那些遭受同样对待的人
  rationale: ἀναστρέφω常可指行事为人，但此处与辱骂、患难及公开示众平行，语境更支持“遭受这般对待”的理解；另一种可能保留于脚注。
- source_word: γενηθέντες
  choice: 又与……一同有分
  rationale: 不机械译出“成为”，而以汉语结果性表达呈现他们进入并参与受逼迫者处境的含义。
theological_decisions:
- issue: τῶν οὕτως ἀναστρεφομένων 中 ἀναστρεφομένων 的含义
  choice: 理解为“那些遭受同样对待的人”
  alternative: “那些这样行事为人的人”或“那些这样生活的人”
  rationale: 上下文集中于受辱、患难以及与受逼迫者同受苦难，因此受动式语义更符合此处的平行关系；但该动词常有“行事为人”的意思，故以脚注保留真实歧义，不将其悄然消除。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“一方面……另一方面……”保留原文并列结构；“被公开示众”传达剧场式公开羞辱的意象；“一同有分”保留 κοινωνός 所含的参与和连带意味。所有真实的词义歧义均通过脚注明示。
