id: HEB.10.38
reference: Hebrews 10:38
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ δὲ δίκαιός ⸀μου ἐκ πίστεως ζήσεται, καὶ ἐὰν ὑποστείληται, οὐκ εὐδοκεῖ ἡ ψυχή μου ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/038.yaml
  text: But my righteous one will live by faith[a], and if he shrinks back[c][b], my soul takes no pleasure in him.
translation:
  language: zh_hans
  text: 但我的义人必因信[a]而活；他若退缩[c]，我的心就不喜悦他。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “信”也可译作“信实”或“信靠”。希腊词πίστις可有这些含义；正文采用“信”。
    reason: lexical_alternative
  - marker: b
    text: 有些抄本作“义人”，没有“我的”。
    reason: textual_variant
  - marker: c
    text: 原文这里用阳性单数形式，可作代表性用法，并不一定只指男性。
    reason: cultural_note
lexical_decisions:
- source_word: ὁ δὲ δίκαιός μου
  choice: 但我的义人
  rationale: 带冠词的形容词作名词用，指“义人”；μου按SBLGNT正文译为“我的”。δὲ在此承接并形成转折，译作“但”。
- source_word: ἐκ πίστεως
  choice: 因信
  rationale: ἐκ在此表达生命所依据的基础或来源；“因信”自然、简洁，也保留πίστις的主要译法。其“信实、信靠”等可能含义列入脚注。
- source_word: ζήσεται
  choice: 必……活
  rationale: 将ζάω的将来时译为“必……活”，既表达将来指向，也符合庄重的引文语体。
- source_word: ὑποστείληται
  choice: 退缩
  rationale: 该动词在警戒语境中表示畏缩、后退；“退缩”是现代汉语中自然且准确的表达。
- source_word: οὐκ εὐδοκεῖ
  choice: 就不喜悦
  rationale: εὐδοκέω表示喜悦、满意；“不喜悦”贴近原文，并保留鲜明的人格性表达。
- source_word: ἡ ψυχή μου
  choice: 我的心
  rationale: ψυχή在此是闪语式的自称表达，直译“我的灵魂”在现代汉语中容易被误解为人的组成部分；“我的心”保留内在喜悦或不悦的表达，同时比直接译“我”更接近原文形式。
- source_word: ἐν αὐτῷ
  choice: 他
  rationale: 在εὐδοκέω之后，ἐν加与格表示喜悦所指向的对象；汉语自然表达为“喜悦他”，无需机械译出介词。
theological_decisions:
- issue: ἐκ πίστεως中πίστις的含义
  choice: 信
  alternative: 信实；信靠
  rationale: 正文采用“信”，同时以脚注保留“信实”和“信靠”的词义可能，不替读者消除哈巴谷书引文在此处的解释张力。
- issue: “他若退缩”的主语所指
  choice: 依照语法衔接，保留为前述同一单数人物
  alternative: 把它理解为不同于“我的义人”的泛指之人
  rationale: 希腊文在两分句中保持单数指称，且没有明示更换主语；译文不为化解神学上的警戒张力而另加新主语。
- issue: 单数阳性形式的代表性
  choice: 译作“他”，并以脚注说明可作代表性用法
  alternative: 他们；这人
  rationale: 保留原文单数阳性形式，同时说明这种形式并不必然只指男性。
- issue: μου的文本异文
  choice: 正文译为“我的义人”
  alternative: 义人
  rationale: 遵循所给SBLGNT正文中的μου；另以脚注记录部分抄本省略该词的异文。
translation_notes:
  register: 采用现代、庄重而易懂的经文语体。“因信而活”保留熟悉且紧凑的表达；“我的心”传达ἡ ψυχή μου的内在、人格性语气，避免“我的灵魂”在现代汉语中可能产生的实体化误读。所有脚注标记均置于正文相应位置；异文脚注[b]放在全句之后，以免误以为只修饰末尾的“他”。
