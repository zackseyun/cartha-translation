  text: μαρτυρεῖ δὲ ἡμῖν καὶ τὸ πνεῦμα τὸ ἅγιον, μετὰ γὰρ τὸ ⸀εἰρηκέναι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/015.yaml
  text: And the Holy Spirit also testifies to us[a]; for after saying,
translation:
  language: zh_hans
  text: 圣灵也向我们作见证[a]；因为他先前说过：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “作见证”也可译作“为我们作证”。
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτυρεῖ
  choice: 作见证
  rationale: 现在时主动直说语气第三人称单数；“作见证”自然保留了法律和证言语境，也与本段论证中的见证概念相称。
- source_word: δὲ
  choice: 也（结合καὶ表达）
  rationale: δέ在此是轻微的承接词，不表示强烈转折；汉语不必另译“而”，与καί合并为“也”能自然推进论述。
- source_word: ἡμῖν
  choice: 向我们
  rationale: 与μαρτυρέω连用的与格表示见证所面向的对象；“向我们”比“为我们”更少暗示代言或有利于我们的含义。
- source_word: καὶ
  choice: 也
  rationale: 表达附加意义，将圣灵作为进一步的见证者引入论证。
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: 圣灵
  rationale: 现代汉语中对这一特定称谓的标准译法；定冠词与形容词结构指向特定的圣灵。
- source_word: μετὰ γὰρ τὸ εἰρηκέναι
  choice: 因为他先前说过
  rationale: μετά加冠词不定式表达时间先后。希腊文未在不定式中明说主语，但上下文最自然承接“圣灵”；汉语补出“他”使句子完整，“先前说过”也能顺畅引出后续分段引用。
theological_decisions:
- issue: 圣灵在见证中的主体性
  choice: 圣灵也向我们作见证
  alternative: 圣灵也为我们作证
  rationale: 希腊语以“圣灵”为主动见证的主语；译文保留这种人格化的主动作用，但不在经文本身加入超出句法的信息。
- issue: εἰρηκέναι的隐含主语
  choice: 他先前说过
  alternative: 说过以后
  rationale: 语法上不定式的主语未明说，最自然地承接前句的“圣灵”。正文采用自然汉语补出代词，同时以脚注说明原文的紧凑表达及其歧义范围。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“圣灵”“作见证”保留经文的宗教与论证语域；分号和冒号显示本句承上并引出下一节的引文。
