base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/037.yaml
  text: For yet a very little while[b][a], the one who is coming will come and will not delay.
translation:
  language: zh_hans
  text: 因为再过片刻，[a]那位要来的[b]就会来，也不会迟延。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文以重复表达强调时间极短，意为“再过极短的一段时间”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“那要来的”或“要来的那一位”；在上下文中，这一表达可能带有指向弥赛亚的称号意味。
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτι γὰρ
  choice: 因为再过
  rationale: γάρ承接上文，说明为何需要忍耐；ἔτι表达尚需等候一段时间。合译为“因为再过”，符合现代汉语语序，也保留解释关系和时间意味。
- source_word: μικρὸν ὅσον ὅσον
  choice: 极短的一会儿
  rationale: 这是带重复强化的习语，强调时间非常短。“极短的一会儿”自然传达其强调作用；脚注保留较直译的形式。
- source_word: ὁ ἐρχόμενος
  choice: 那要来的
  rationale: 带冠词的现在分词作名词使用，可指“那位将要来者”。“那要来的”既保留分词表达及可能的称号意味，也不借助汉语中原文没有的大小写来强行确定其弥赛亚称号性质。
- source_word: ἥξει
  choice: 就必来
  rationale: 将来时直陈语气表达确定的将来行动。“必”传达陈述的确定性，“就”与前面的短暂等候自然衔接，并保留与“要来的”之间的词语呼应。
- source_word: οὐ χρονίσει
  choice: 绝不迟延
  rationale: χρονίζω在此指耽搁、迟延。“绝不迟延”是庄重而通顺的现代汉语，并以“绝不”清楚传达希腊语否定陈述的力度。
theological_decisions:
- issue: ὁ ἐρχόμενος应译为弥赛亚称号，还是一般性的分词短语
  choice: 正文译作“那要来的”
  alternative: “要来的那一位”或带明确称号意味的“那位来者”
  rationale: 上下文很可能将这句话用于将要再来的基督，但希腊语本身仍是带冠词的分词结构。正文保留其指称性和潜在的称号意味，却不把解释性结论完全写入译文；脚注说明另一种自然译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“极短的一会儿”避免生硬复制希腊语重复形式；“那要来的就必来”刻意保留原文中ἐρχόμενος与ἥξει的词根呼应。脚注标记均置于正文相关表达之后。
