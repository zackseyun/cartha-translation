  text: Καὶ πᾶς μὲν ἱερεὺς ἕστηκεν καθ’ ἡμέραν λειτουργῶν καὶ τὰς αὐτὰς πολλάκις προσφέρων θυσίας, αἵτινες οὐδέποτε δύνανται περιελεῖν ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/011.yaml
  text: And every priest stands day after day ministering and offering the same sacrifices again and again[a], which can never take away sins.
translation:
  language: zh_hans
  text: 每一位祭司天天站着供职，一次又一次献上同样的祭物；这些祭物绝不能除去罪[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “除去罪”也可译作“除掉罪”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ... ἱερεὺς
  choice: 每一位祭司
  rationale: πᾶς与单数名词连用，具有逐一分配的意味，指祭司群体中的每一位；不译作“大祭司”，因为原文是ἱερεύς而非ἀρχιερεύς。
- source_word: ἕστηκεν
  choice: 站着
  rationale: 完成时在此表达持续的站立状态；“站着”自然呈现其姿态，并保留与下一节弥赛亚坐下之间的鲜明对比。
- source_word: καθ’ ἡμέραν
  choice: 天天
  rationale: 表达每日持续、反复发生的行动；现代汉语简洁自然，并与后文反复献祭的论述相称。
- source_word: λειτουργῶν
  choice: 供职
  rationale: 该词在此指礼仪性的祭司职事；“供职”比泛泛的“服事”更能体现履行祭司职责的语境。
- source_word: τὰς αὐτὰς ... θυσίας
  choice: 同样的祭物
  rationale: αὐτάς强调反复献上相同的祭物；“同样的祭物”直接保留这一重点。
- source_word: πολλάκις
  choice: 一次又一次
  rationale: 突出不断重复发生，比单纯的“多次”更能传达作者的修辞力度。
- source_word: προσφέρων
  choice: 献上
  rationale: 在献祭语境中，προσφέρω通常指献上祭物；这是准确而自然的中文表达。
- source_word: αἵτινες
  choice: 这些祭物
  rationale: 该关系代词回指前述祭物，并带有解释其性质的作用；中文另起分句重复“这些祭物”，指代清晰且自然。
- source_word: οὐδέποτε δύνανται
  choice: 绝不能
  rationale: 表达绝对的无能为力；“绝不能”简洁保留原文强度。
- source_word: περιελεῖν ἁμαρτίας
  choice: 除去罪
  rationale: περιαιρέω在此意为移除、除掉；“除去罪”准确而庄重，也保留其祭祀语境中的含义。
theological_decisions:
- issue: 祭司站立姿态与希伯来书第10章论证的关系
  choice: 译作“站着”，保留祭司持续站立供职与下一节弥赛亚坐下之间的对比。
  alternative: 译作“站立着”或“已经站立”，但不明显呈现其持续状态及文学对比。
  rationale: 这项对比存在于紧邻上下文中；译文只呈现原文姿态，不额外加入解释。
- issue: 祭物无效性的范围
  choice: 译作“这些祭物绝不能除去罪”，保留原文在本段论证中的绝对表述。
  alternative: 弱化为“不能完全处理罪”或“不能彻底解决罪”。
  rationale: οὐδέποτε δύνανται明确表达绝对无能；译文不应减弱作者关于旧有重复献祭之不足的论断，同时也不在本节内扩展其系统神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“供职”体现祭司礼仪职事；“天天”和“一次又一次”共同呈现原文反复持续的语气。脚注标记置于整句之后，对应“除去罪”的词义备选。
