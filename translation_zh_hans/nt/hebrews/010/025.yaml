  text: μὴ ἐγκαταλείποντες τὴν ἐπισυναγωγὴν ἑαυτῶν, καθὼς ἔθος τισίν, ἀλλὰ παρακαλοῦντες, καὶ τοσούτῳ μᾶλλον ὅσῳ βλέπετε ἐγγίζουσαν τὴν ἡμέραν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/025.yaml
  text: not neglecting our own gathering together[a], as is the habit of some[b], but encouraging one another—and all the more as you see the Day drawing near.
translation:
  language: zh_hans
  text: 不要忽略我们自己的聚集[a]，像有些人习惯做的那样；反而要彼此劝勉；何况你们看见那日[b]临近，就更应如此。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“不要撇下”或“不要离弃我们自己的聚集”。
    reason: lexical_alternative
  - marker: b
    text: “那日”很可能指主的日子，或最后审判的日子。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγκαταλείποντες
  choice: 停止
  rationale: 此词可指撇下、离弃或不再维持。译作“停止”能自然表达不再参加群体聚集的行为，又不直接断定为彻底背道；其他词义见脚注[a]。
- source_word: ἐπισυναγωγὴν ἑαυτῶν
  choice: 我们自己的聚会
  rationale: ἐπισυναγωγή指共同聚集，ἑαυτῶν表明这是受信群体自身的聚会。“我们自己的聚会”保留群体归属感，也避免加入“礼拜”或制度化“教会聚会”等原文未明说的限定。
- source_word: καθὼς ἔθος τισίν
  choice: 像有些人惯常做的那样
  rationale: ἔθος意为习惯、惯例；此译符合现代汉语，并保留作者温和而明确的责备。
- source_word: παρακαλοῦντες
  choice: 彼此劝勉
  rationale: παρακαλέω在此可包含劝告、鼓励和坚固之意。“劝勉”兼顾劝告与鼓励；“彼此”虽未在该分词后明写，却由群体语境自然 implied。
- source_word: τοσούτῳ μᾶλλον ὅσῳ
  choice: 既然……就更要如此
  rationale: 该关联结构表示随着所见之日临近，前述劝勉更应加强；此译以自然汉语保留递增比较关系。
- source_word: βλέπετε
  choice: 你们看见
  rationale: 保留第二人称复数和直陈语气，不具体限定他们藉何种迹象或认识而“看见”。
- source_word: ἐγγίζουσαν
  choice: 临近
  rationale: 准确表达正在接近的动态，在现代汉语中简洁而庄重。
- source_word: τὴν ἡμέραν
  choice: 那日
  rationale: 定冠词与上下文指向读者已知的末后之日。“那日”是中文圣经语域中自然、含蓄的表达，不擅自扩写为“主的日子”或“审判之日”。
theological_decisions:
- issue: “那日”的末世论所指
  choice: 正文译作“那日”，脚注说明其很可能指主来临或最后审判的日子。
  alternative: 直译“那一天”，或扩写为“主的日子／审判之日”。
  rationale: 上下文关于坚忍和临近终局的论述支持末世论所指，但希腊文只写“那日”，因此正文不作超出原文的具体化。
- issue: παρακαλοῦντες的相互对象
  choice: 译作“彼此劝勉”。
  alternative: 只译“劝勉”，保留宾语省略。
  rationale: 共同聚会的语境强烈表明这是群体成员之间的相互劝勉；补出“彼此”使中文完整自然，并未加入新的教义主张。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“聚会”保持广义，不限定为某种制度化礼仪；“劝勉”兼具劝告与鼓励之意。脚注标记[a]置于相关短语后，[b]置于整句末，分别说明词义幅度与末世论所指。
