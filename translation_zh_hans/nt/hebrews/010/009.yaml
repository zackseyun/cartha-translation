  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: τότε εἴρηκεν· Ἰδοὺ ἥκω τοῦ ⸀ποιῆσαι τὸ θέλημά σου· ἀναιρεῖ τὸ πρῶτον ἵνα τὸ δεύτερον στήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/009.yaml
  text: Then he said[a], ‘Behold, I have come to do your will.’ He takes away the first so that he may establish the second.
translation:
  language: zh_hans
  text: 随后他又说：“看哪，我来了，为要遵行你的旨意。”他除去头一个，为要确立第二个。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “头一个”和“第二个”也可理解为前一种献祭安排与后一种现实，即神的旨意借着弥赛亚献上自己而得到成全；也有人将其理解为引文中的前后两项陈述，或更广义的旧约与新约。原文没有明说所指。
    reason: 保留原文简略指代的歧义，并向读者说明主要的上下文解释。
lexical_decisions:
- source_word: τότε
  choice: 随后
  rationale: 表示承接前文的时间和论证次序；“随后”比“那时”更自然地连接前面的引文。
- source_word: εἴρηκεν
  choice: 他又说
  rationale: 希腊语完成时使先前所说的话在当前论证中仍具效力；汉语用“又说”自然承接上一节，并避免生硬地复制完成体形式。
- source_word: Ἰδοὺ
  choice: 看哪
  rationale: 保留引文中醒目的提示语和庄重的经文语体。
- source_word: ἥκω
  choice: 我来了
  rationale: 表达已经来到且如今在场的含义，是现代汉语中自然、简洁的对应。
- source_word: τοῦ ποιῆσαι
  choice: 为要遵行
  rationale: 带冠词的不定式表达目的；“为要”明确传达目的，“遵行”与“旨意”搭配自然。
- source_word: τὸ θέλημά σου
  choice: 你的旨意
  rationale: “旨意”准确表达这里神的意愿和目的，也符合庄重而通俗的圣经语体。
- source_word: ἀναιρεῖ
  choice: 除去
  rationale: 保留撤除、取消其地位的基本含义，不在正文中过度解释为正式废除某一具体制度。
- source_word: τὸ πρῶτον
  choice: 头一个
  rationale: 保留希腊文名词化形容词的简练和指代上的开放性，不把解释直接写入正文。
- source_word: ἵνα
  choice: 为要
  rationale: 清楚表达目的关系，并与前半句的目的结构形成自然呼应。
- source_word: τὸ δεύτερον
  choice: 第二个
  rationale: 与“头一个”形成平行对照，同时保留原文没有明确补出所指事物的特点。
- source_word: στήσῃ
  choice: 确立
  rationale: 表达使之站立、成立并具有效力的意思，适合本段的论证语境。
theological_decisions:
- issue: “头一个”和“第二个”的所指
  choice: 正文保留简略的“头一个”和“第二个”，由上下文说明其含义。
  alternative: 可将二者明确解释为先前的献祭安排与弥赛亚献上自己而成全神旨意的现实，或更广义地理解为旧约与新约。
  rationale: 希伯来书10:8—10直接对照祭物、供物与遵行神的旨意，但希腊文本身没有在本节补出具体名词；保留简略表达可避免把某一种解释强加于正文。
- issue: “除去”与“确立”的主语
  choice: 沿用引文中说话者的第三人称“他”，不另行补明身份。
  alternative: 可解释为神借着子的顺服除去头一个并确立第二个，或把动作直接归于基督。
  rationale: 希腊文动词主语隐含，语法上自然承接说话者，但本段神学论证也涉及神旨意的施行；译文不额外消解这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”保留经文引语的郑重感；“头一个／第二个”有意保持原文的简练与开放性。
