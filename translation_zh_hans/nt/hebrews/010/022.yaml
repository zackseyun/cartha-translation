source:
  edition: SBLGNT
  text: προσερχώμεθα μετὰ ἀληθινῆς καρδίας ἐν πληροφορίᾳ πίστεως, ῥεραντισμένοι τὰς καρδίας ἀπὸ συνειδήσεως πονηρᾶς καὶ λελουσμένοι τὸ σῶμα ὕδατι καθαρῷ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/022.yaml
  text: let us draw near with a true heart in full assurance of faith[d][c][b][a], with our hearts sprinkled clean from an evil conscience and our bodies washed with pure water.
translation:
  language: zh_hans
  text: 让我们怀着真诚的心[a]，带着充分的信心确信，亲近；我们的心已被洒净[d]，脱离邪恶的良心[b]，身体也已用洁净的水洗过[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“真实的心”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“有罪疚感的良心”。原文“邪恶”所指可能比罪疚感更广。
    reason: lexical_alternative
  - marker: c
    text: 这里的图像可能使人想到礼仪性的洁净；有些读者也会听出洗礼的回响，但本节并未明确说明这洗濯就是洗礼。
    reason: cultural_note
  - marker: d
    text: “被洒净，脱离……”也可译作“受洒而脱离……”。
    reason: translation_alternative
lexical_decisions:
- source_word: προσερχώμεθα
  choice: 就让我们……亲近
  rationale: 以劝勉式表达第一人称复数虚拟语气，并保留《希伯来书》中来到上帝面前的礼仪性语境；不在正文中补出原文未明说的宾语。
- source_word: μετὰ ἀληθινῆς καρδίας
  choice: 怀着真诚的心
  rationale: ἀληθινός可指真实、真诚、名实相符；“真诚的心”符合现代汉语，又不把该词缩减为单纯的情绪感受。
- source_word: ἐν πληροφορίᾳ πίστεως
  choice: 在信心所带来的充分确信中
  rationale: 保留πληροφορία的充分把握、确信之意，并将πίστις按此处语境译为“信心”。“所带来的”使中文关系清楚，但不把信心理解为功德。
- source_word: ῥεραντισμένοι τὰς καρδίας
  choice: 我们的心已经被洒净
  rationale: 用“已经被”体现完成时被动分词所表达的既成状态；“洒净”保留洒血或礼仪洁净的图像，同时表达上下文所含的洁净结果。
- source_word: ἀπὸ συνειδήσεως πονηρᾶς
  choice: 脱离了邪恶的良心
  rationale: 按πoνηρός的宽泛道德含义译作“邪恶”，不擅自缩窄为内疚的心理状态；ἀπό表达因洒净而与之分离。
- source_word: λελουσμένοι τὸ σῶμα
  choice: 身体也已经……洗过了
  rationale: 体现与前一分词平行的完成状态；希腊文单数身体在复数主体下可作分配性理解，中文用无标记的“身体”最自然。
- source_word: ὕδατι καθαρῷ
  choice: 用洁净的水
  rationale: “洁净”兼顾水本身的洁净和礼仪洁净语境，较“纯水”更自然，也不提前判定具体仪式。
theological_decisions:
- issue: 洗身的水是否应在正文中明确认定为基督徒洗礼
  choice: 保留“用洁净的水洗过”的洁净图像，不在正文中明确指称洗礼
  alternative: 直接译成受洗，或完全解释为纯粹的内在洁净
  rationale: 本节的语言可唤起礼仪洁净，也可能使读者联想到洗礼，但原文本身没有明确给这洗濯命名；保留图像可避免宗派性定论。
- issue: συνειδήσεως πονηρᾶς应译为“邪恶的良心”还是“有罪疚感的良心”
  choice: 邪恶的良心
  alternative: 内疚的良心／有罪的良心
  rationale: 原文形容词是“邪恶的”，语义可能涵盖罪疚、玷污和道德败坏；采用较形式对应的译法可保留其宽度。
- issue: ἀληθινῆς καρδίας所指是真实还是主观真诚
  choice: 正文译“真诚的心”，脚注保留“真实的心”
  alternative: 真实的心
  rationale: 现代汉语中“真诚的心”自然且可传达名实相符，但ἀληθινός不只表示主观诚意，因此以脚注保存更形式化的可能译法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“亲近”延续本段来到上帝面前的语境，但不补出原文未明说的宾语；“洒净”“洁净的水”保留祭祀与礼仪洁净的意象。所有脚注标记均已置于正文相应位置。
