  text: διὸ εἰσερχόμενος εἰς τὸν κόσμον λέγει· Θυσίαν καὶ προσφορὰν οὐκ ἠθέλησας, σῶμα δὲ κατηρτίσω μοι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/005.yaml
  text: 'Therefore[a], when he comes into the world, he says: “Sacrifice and offering you did not desire, but a body you prepared for me.”'
translation:
  language: zh_hans
  text: 所以，基督来到世上时说：“祭物和供物不是你所想要的；你却为我预备了身体。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里《希伯来书》采用诗篇40:6的希腊文措辞：“你为我预备了身体。”诗篇40:6的希伯来文本则作：“你为我开通了耳朵。”
    reason: alternative_reading
lexical_decisions:
- source_word: διὸ
  choice: 所以
  rationale: 承接上文作出推论；“所以”自然清楚地保留了逻辑关系。
- source_word: εἰσερχόμενος εἰς τὸν κόσμον
  choice: 来到世上时
  rationale: 保留现在分词的时间关系和经文引述中的鲜明表达；“来到世上”是现代汉语自然说法。
- source_word: λέγει
  choice: 说
  rationale: 希腊文现在时用于引出经文；汉语“说”无需标明时态，也保留引述现场感。
- source_word: Θυσίαν καὶ προσφορὰν
  choice: 祭物和供物
  rationale: 分别表达两个相关的礼仪用语，同时保持并列和类别性含义。
- source_word: οὐκ ἠθέλησας
  choice: 不是你所想要的
  rationale: 表达 θέλω 的意愿或意欲含义，语气自然，并避免将其缩窄为单纯情感上的喜爱。
- source_word: σῶμα
  choice: 身体
  rationale: 按《希伯来书》的希腊文本直译其具体名词，不以诗篇希伯来文本的“耳朵”加以协调。
- source_word: δὲ
  choice: 却
  rationale: 鲜明表达前后两项之间的转折对比。
- source_word: κατηρτίσω
  choice: 预备了
  rationale: 准确表达 καταρτίζω 在此处“使就绪、预备”的意义，且符合现代汉语经文语体。
- source_word: μοι
  choice: 为我
  rationale: 将与格自然表达为受益关系：身体是为说话者预备的。
theological_decisions:
- issue: 本节所引诗篇40:6的希腊措辞与希伯来文本不同。
  choice: 正文依《希伯来书》希腊文本译作“你却为我预备了身体”。
  alternative: 按诗篇的希伯来文本译作“你为我开通了耳朵”。
  rationale: 翻译本节应以《希伯来书》的原文为准，不将其与诗篇的希伯来措辞协调；两者之间真实而重要的文本差异则在脚注中保留。
- issue: εἰσερχόμενος 的隐含主语身份
  choice: 译作“基督来到世上时”，明确为基督。
  alternative: 译作“他来到世上时”，形式上保留代词。
  rationale: 上文直接谈到基督，且本句是由分词引出的主语延续；汉语若只用“他”易因独立呈现而指代不清，明确“基督”不改变原文所指。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“祭物和供物”保留礼仪术语的区别；分号凸显“不是……却……”的对比。脚注标记置于相关引文末尾。
