source:
  edition: SBLGNT
  text: Αὕτη ἡ διαθήκη ἣν διαθήσομαι πρὸς αὐτοὺς μετὰ τὰς ἡμέρας ἐκείνας, λέγει κύριος, διδοὺς νόμους μου ἐπὶ καρδίας αὐτῶν, καὶ ἐπὶ ⸂τὴν διάνοιαν⸃ αὐτῶν ἐπιγράψω αὐτούς,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/016.yaml
  text: 'This is the covenant that I will make with them after those days[a], says the Lord: putting my laws upon their hearts, and I will write them on their minds,'
translation:
  language: zh_hans
  text: “主说：在那些日子以后，我要与他们立的约就是这样：我要把我的律法放在他们心上[a]，也要写在他们的心思里。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文在冒号后的应许中直译为“把我的律法放在他们心上，我也要写在他们的心思里”；其中第一个动词是分词，第二个才是“我要写”。
    reason: 保留引文中不对称的希腊文句法，同时让正文符合现代汉语表达。
lexical_decisions:
- source_word: διαθήκη
  choice: 约
  rationale: 本节引用耶利米书的新约应许；“约”既保留圣经中的立约含义，也符合现代汉语的庄重表达。
- source_word: διαθήσομαι πρὸς αὐτούς
  choice: 我要与他们立
  rationale: 在立约语境中，διατίθεμαι 与表示对象的 πρὸς 合起来宜译为“与……立约”；汉语需与前面的“约”组合为“我要与他们立的约”。
- source_word: μετὰ τὰς ἡμέρας ἐκείνας
  choice: 在那些日子以后
  rationale: 直接保留原文的时间指向，不补充原文没有说明的具体时期。
- source_word: κύριος
  choice: 主
  rationale: 按希腊文本 κύριος 翻译为“主”，既自然，也不把希伯来文底本的神名形式直接引入本节。
- source_word: νόμους μου
  choice: 我的律法
  rationale: νόμους 是复数，但现代汉语中的集合名词“律法”无需机械译成“律法们”；它仍可涵盖多项法则，并保留与 νόμος 的经文联系。
- source_word: διδοὺς
  choice: 我要把……放在
  rationale: 原义是“放置、给予”；在心上的比喻中，“放在”清楚自然。为使汉语完整通顺，以有限动词表达其将来意义，脚注说明希腊文形式。
- source_word: ἐπὶ καρδίας αὐτῶν
  choice: 在他们心上
  rationale: 保留 ἐπί 所呈现的“在……上”意象，也延续立约应许中把律法置于内心的表达。
- source_word: διάνοιαν
  choice: 心思
  rationale: διάνοια 指思想、理解的机能；“心思”与前面的“心”有所区分，又比“理智”更自然宽泛。
- source_word: ἐπιγράψω αὐτούς
  choice: 也要写
  rationale: ἐπιγράψω 表示写在其上；宾语代词所指的“我的律法”在汉语中可从上文自然承接，无须重复。
theological_decisions:
- issue: 耶利米书引文内部的句法
  choice: 正文采用自然汉语的两个将来分句，并以脚注交代第一个动词在希腊文中是分词形式
  alternative: 直译为“把我的律法放在他们心上，我也要写……”
  rationale: 希腊文先用分词 διδοὺς，随后用限定动词 ἐπιγράψω。机械保留这一结构会使现代汉语残缺或含混；正文清楚表达应许，脚注则保留希腊文句法上的差异，不将其悄然抹平。
- issue: “律法”放置和书写的位置
  choice: 分别译作“心上”和“心思里”
  alternative: 两处均泛化为“内心”
  rationale: 原文使用 καρδίας 和 διάνοιαν 两个不同词语。译文保留两者的区别，但不把它们解释成一套特定的人论体系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“立约”“律法”保留经文语域；整体调整为汉语常用语序，把“主说”提前，使引语层次清楚。
