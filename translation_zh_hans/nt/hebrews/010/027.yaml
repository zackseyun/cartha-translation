  text: φοβερὰ δέ τις ἐκδοχὴ κρίσεως καὶ πυρὸς ζῆλος ἐσθίειν μέλλοντος τοὺς ὑπεναντίους.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/027.yaml
  text: but a fearful expectation of judgment[a], and a fury of fire about to consume the adversaries.
translation:
  language: zh_hans
  text: 却只剩下一种可怕的、有关审判的期待，以及将要吞灭敌对者的烈火怒焰。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “烈火怒焰”也可较直译为“火的炽烈愤怒”。原文的ζῆλος可指炽烈的热忱、嫉愤或愤怒；此处与审判及吞灭的火相连。
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβερὰ δέ τις ἐκδοχὴ κρίσεως
  choice: 却只剩下可怕地等候审判
  rationale: 结合上节省略而延续的“剩下”，把希腊语名词结构自然转为现代汉语动词结构。“可怕地”保留 φοβερά 的强烈语气；τις 在此表示不定而真实的情形，不宜生硬译作“某一种”。
- source_word: πυρὸς ζῆλος
  choice: 烈火的狂怒
  rationale: ζῆλος 在此处的审判语境中表达炽烈、吞灭性的愤怒；“烈火的狂怒”既保留属格意象和拟人力量，也比“火的热忱”更符合现代汉语。
- source_word: ἐσθίειν μέλλοντος
  choice: 将要吞灭
  rationale: μέλλω 表达即将发生，ἐσθίω 本义为“吃”，在火的意象中指彻底吞噬；“吞灭”兼顾形象与庄重语体。
- source_word: τοὺς ὑπεναντίους
  choice: 那些敌对的人
  rationale: 保留其“站在对立面的人”这一宽泛含义，不把对象进一步限定为某一特定群体。
theological_decisions:
- issue: 审判之火的性质
  choice: 保留将要吞灭敌对者的烈火审判意象，不说明其具体时长或形态
  alternative: 明确译成永刑，或弱化为纯粹象征性的灾难
  rationale: 本节明确表达严厉而临近的审判，却没有在本句中详述其全部神学性质；译文不作超出原文的界定。
- issue: πυρὸς ζῆλος 的拟人化张力
  choice: 译作“烈火的狂怒”，并用“这火”承接其吞灭行动
  alternative: 译作“熊熊烈火”，省去 ζῆλος 的情感和拟人色彩
  rationale: 原文把炽烈的 ζῆλος 与火紧密结合，并使其成为“将要吞灭”的行动主体；译文保留这种强烈意象。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以分号和“这火”化解希腊语压缩结构，使“将要吞灭”的主语清楚，同时不减弱警告的力度。
