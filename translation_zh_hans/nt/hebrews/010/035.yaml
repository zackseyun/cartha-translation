  text: μὴ ἀποβάλητε οὖν τὴν παρρησίαν ὑμῶν, ἥτις ἔχει ⸂μεγάλην μισθαποδοσίαν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/035.yaml
  text: Therefore[a], do not throw away your boldness, which has a great reward,
translation:
  language: zh_hans
  text: 所以，不要丢弃你们的坦然无惧[a]；这坦然无惧有极大的赏赐。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“放胆”。原文也可指充满把握的坦然，以及自由、公开地说话，特别是在来到神面前时。
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ἀποβάλητε
  choice: 不要丢弃
  rationale: μή加不定过去时虚拟语气构成禁止语；“丢弃”保留主动舍弃、抛开的力度，不弱化为无意间“失去”。
- source_word: οὖν
  choice: 所以
  rationale: 承接上文的劝勉和榜样，表达推论关系；“所以”在现代汉语中自然、清楚。
- source_word: τὴν παρρησίαν ὑμῶν
  choice: 你们的坦然无惧
  rationale: παρρησία兼有坦然、自由公开和勇敢无惧之意；在《希伯来书》中尤其关联到亲近神时的笃定以及持守信仰。“坦然无惧”比单用“信心”更能保留其公开和勇敢的色彩。
- source_word: ἥτις ἔχει
  choice: 这坦然无惧有
  rationale: ἥτις引出说明其性质的关系从句。汉语重复中心词比直译为“它有”更清楚自然，同时不把关系进一步解释为因果。
- source_word: μεγάλην μισθαποδοσίαν
  choice: 极大的赏赐
  rationale: μεγάλην表示程度或分量之大；μισθαποδοσία指报偿、赏赐。此处语境为正面的终末报偿，“极大的赏赐”自然且保留原文力度。
theological_decisions:
- issue: παρρησία在本节中的含义
  choice: 译作“坦然无惧”，涵盖信徒在神面前的笃定坦然，以及持守并公开信仰的勇气。
  alternative: “信心”或“胆量”
  rationale: “信心”容易被理解为纯粹内在确信，“胆量”则可能只强调勇敢；“坦然无惧”较完整地保留该词在《希伯来书》中亲近神与坚忍持守两方面的张力。
- issue: 赏赐与坦然无惧之间的关系
  choice: 保留原文“有极大的赏赐”的直接陈述。
  alternative: 意译为“必带来极大的赏赐”
  rationale: 原文使用ἔχει（有），没有明确说明机制；避免把关系过度解释为行为换取报酬或单纯的结果关系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“丢弃”保留劝诫的力度；分号使劝令及其理由之间的关系清楚。正文中的脚注标记[a]与脚注对应。
