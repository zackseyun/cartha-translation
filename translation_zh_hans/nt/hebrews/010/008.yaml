  text: ἀνώτερον λέγων ὅτι ⸂Θυσίας καὶ προσφορὰς⸃ καὶ ὁλοκαυτώματα καὶ περὶ ἁμαρτίας οὐκ ἠθέλησας οὐδὲ εὐδόκησας, αἵτινες κατὰ ⸀νόμον προσφέρονται,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/008.yaml
  text: After saying above[a], “Sacrifices and offerings and whole burnt offerings and sin offerings you did not desire[c][b], nor did you delight in”—which are offered according to the law—
translation:
  language: zh_hans
  text: 他先前说：“祭物、供物、燔祭和赎罪祭，是你不愿意的，也是你不喜悦的。”这些都是按照律法献上的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνώτερον λέγων
  choice: 上文先说
  rationale: ἀνώτερον回指前面刚引述的经文，λέγων引出直接引语；“上文先说”自然保留其篇章衔接作用。
- source_word: Θυσίας καὶ προσφορὰς
  choice: 祭物、供物
  rationale: 分别保留θυσία与προσφορά的献祭用语及并列关系，不将二者合并。
- source_word: ὁλοκαυτώματα
  choice: 全烧祭
  rationale: 该词指整只焚烧献上的祭物；“全烧祭”既体现完全焚烧的语义，也符合简明庄重的现代汉语。
- source_word: περὶ ἁμαρτίας
  choice: 赎罪祭
  rationale: 在献祭语境中，这是七十士译本常用的礼仪性表达，指为罪而献的祭；“赎罪祭”清楚呈现其祭类性质。
- source_word: οὐκ ἠθέλησας
  choice: 是你不愿意的
  rationale: ἠθέλησας表示意愿或想要；“不愿意”贴近原文，同时不擅自解释这种否定与律法设立之间的关系。
- source_word: οὐδὲ εὐδόκησας
  choice: 也是你不喜悦的
  rationale: εὐδοκέω表示喜悦、认可；与前面的“不愿意”区分，并保留平行递进。
- source_word: αἵτινες κατὰ νόμον προσφέρονται
  choice: 这些都是按照律法献上的
  rationale: “这些”回指前述各类祭物；“按照律法”表达κατὰ νόμον的规范依据，动词用被动式“献上”对应προσφέρονται。
theological_decisions:
- issue: 如何处理诗篇引文中神不愿意、不喜悦祭物与这些祭物按律法献上之间的张力
  choice: 直译两项否定，并另句保留“这些都是按照律法献上的”
  alternative: 解释为“你不以这些为最终所要的”或“这些不能除罪”
  rationale: 原文刻意并置神的否定态度与祭物依律法献上的事实；译文不加入“最终”“不能除罪”等上下文推论，以保留其神学张力。
- issue: περὶ ἁμαρτίας是祭类名称还是一般性的“为罪”
  choice: 赎罪祭
  alternative: 为罪献的祭物
  rationale: 上下文列举具体献祭类别，该短语在希腊旧约祭祀语境中具有术语功能；采用“赎罪祭”不进一步规定其教义机制。
translation_notes:
  register: 采用现代、庄重且易懂的书面普通话。保留四类祭物的并列清单，并用句号处理希腊文末尾承接下节的破折式结构，使本节单独阅读自然，又不补入下节内容。
