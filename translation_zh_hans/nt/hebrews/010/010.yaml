  rationale: 修订以“凭着”自然表达此处回指上帝旨意的凭借性；以“已经成圣”准确而庄重地表达迂回完成时的已成事实及其持续结果。重组献上短语，使“一次而永远地”明确修饰“献上”，同时仍以不定式结构避免在本句无根据地明确献上行动的施行者。脚注文字本身可保留，仅调整正文锚点位置。
