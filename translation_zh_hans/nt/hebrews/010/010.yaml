  text: ἐν ᾧ θελήματι ἡγιασμένοι ⸀ἐσμὲν διὰ τῆς προσφορᾶς τοῦ σώματος Ἰησοῦ Χριστοῦ ἐφάπαξ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/010.yaml
  text: By that will we have been sanctified through the offering of the body of Jesus the Messiah once for all[a][b].
translation:
  language: zh_hans
  text: 我们凭着这旨意[a]，借着一次而永远地献上弥赛亚耶稣[b]的身体，已经成圣。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“在这旨意中”。这里所说的是上文刚提到的上帝旨意。
    reason: lexical_alternative
  - marker: b
    text: “弥赛亚耶稣”也可译作“耶稣基督”。希腊文“基督”（Χριστός）在这里是称号，意为“弥赛亚”。
    reason: alternative_rendering
lexical_decisions:
- source_word: ἐν ᾧ θελήματι
  choice: 因着这旨意
  rationale: 该短语回指上文所说上帝的旨意；“因着”自然表达这里的凭借或根据，而“这”清楚承接前文。
- source_word: ἡγιασμένοι ἐσμὲν
  choice: 已经成为圣洁
  rationale: 这是完成时分词与现在时系词构成的迂回完成时，表达已经完成而结果持续至今；“已经成为圣洁”兼顾体貌和现代汉语的可懂性。
- source_word: διὰ τῆς προσφορᾶς
  choice: 借着……的献上
  rationale: διά加属格在此表示途径或手段；προσφορά译作“献上”，保留献祭语境，又不把词义过度收窄为“祭牲”。
- source_word: τοῦ σώματος
  choice: 身体
  rationale: 保留原文具体的身体性表达，并以“身体……的献上”维持原文名词结构，避免额外明定献上的施行者。
- source_word: Ἰησοῦ Χριστοῦ
  choice: 弥赛亚耶稣
  rationale: Χριστός在此保留称号含义，译为“弥赛亚”；汉语采用“弥赛亚耶稣”的称号加名字次序，庄重而可辨。
- source_word: ἐφάπαξ
  choice: 一次而永远
  rationale: 此词强调一次完成、无需重复；“一次而永远”简洁传达其终极和不可重复的性质。
theological_decisions:
- issue: 成圣的体貌与神学含义
  choice: 已经成为圣洁
  alternative: 已经成圣；得以成圣；正在成为圣洁
  rationale: 原文是迂回完成时，既指已完成的行动，也保留其现今持续的结果；不译为进行式，以免把经文限定为渐进过程，也不额外界定其系统神学性质。
- issue: Χριστός的称号性质
  choice: 弥赛亚
  alternative: 基督
  rationale: 这里将Χριστός作为具有实际意义的称号处理；脚注保留汉语传统译名“基督”，不否认该形式在教会用语中的通行地位。
- issue: 献上身体的施行者
  choice: 保留“身体……的献上”的名词结构
  alternative: 弥赛亚耶稣献上自己的身体
  rationale: 原文属格结构明确指出所献的是耶稣的身体，却没有在本句中用主动动词直接标明施行者；译文不把潜在关系解释得比原文更明确。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“身体一次而永远的献上”略带正式名词化色彩，是为保留原文结构及其对施行者的含蓄表达；脚注标记[a][b]均已置于正文。
