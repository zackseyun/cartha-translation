  text: which he inaugurated for us as a new and living way through the curtain—that is[a], his flesh[b],
translation:
  language: zh_hans
  text: 他为我们开创了这条又新又活的路，穿过幔子——这幔子就是[a]他的肉身[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“也就是说”。
    reason: lexical_alternative
  - marker: b
    text: “这幔子就是他的肉身”说明“幔子”这一比喻，把它与耶稣的肉身联系起来。
    reason: cultural_note
lexical_decisions:
- source_word: ἣν
  choice: 这是……的一条……路
  rationale: 关系代词承接上文所说进入至圣所的途径；中文通过“这是……的一条路”自然保留衔接，不强行指定其先行词。
- source_word: ἐνεκαίνισεν
  choice: 开创
  rationale: 表达启用、开辟一条此前未有的道路，同时保留新近设立的意味；比单纯的“打开”更能体现该动词的郑重语气。
- source_word: ἡμῖν
  choice: 为我们
  rationale: 体现受益与目的关系。
- source_word: ὁδὸν
  choice: 路
  rationale: 既自然又保留通往上帝面前的路径意象。
- source_word: πρόσφατον καὶ ζῶσαν
  choice: 又新又活的
  rationale: 贴近原文并列形容词，保留“新”与“活”的神学张力，不擅自释为“赐生命的”。
- source_word: διὰ τοῦ καταπετάσματος
  choice: 穿过幔子
  rationale: καταπέτασμα指会幕或圣殿中隔开的幔子；“幔子”在中文圣经语境中准确且易懂。
- source_word: τοῦτ’ ἔστιν
  choice: 也就是
  rationale: 自然呈现原文的解释性同位关系。
- source_word: τῆς σαρκὸς αὐτοῦ
  choice: 他的肉身
  rationale: 保留σάρξ的具体、具身含义，并让该短语与“幔子”形成原文中的同位解释，不额外重复“穿过”。
theological_decisions:
- issue: 幔子与耶稣肉身的隐喻性对应
  choice: “穿过幔子，也就是他的肉身”
  alternative: “穿过幔子，也就是穿过他的肉身”
  rationale: 原文以属格短语“他的肉身”同位解释“幔子”。不补第二个“穿过”，可更直接保留这一认同关系，也避免把隐喻解释得过满。
- issue: σάρξ的译法
  choice: 肉身
  alternative: 身体
  rationale: 此处指耶稣具体、有血肉的人性存在；“肉身”比“身体”更透明地对应σάρξ，同时不引入“罪性”等原文没有的含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“又新又活的路”保留原文凝练的并列结构；“幔子”延续会幕和圣殿语境中的专门意象。所有脚注标记均已置于正文。
