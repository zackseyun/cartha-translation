  text: In whole burnt offerings and sin offerings you took no pleasure[a].
translation:
  language: zh_hans
  text: 你不喜悦燔祭和赎罪祭。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“燔祭和为罪所献的祭。”希腊语“为罪”（περὶ ἁμαρτίας）在献祭语境中是指为罪而献的祭。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁλοκαυτώματα
  choice: 燔祭
  rationale: 该词指祭物全部焚烧献上的祭，现代中文圣经语境中“燔祭”是准确而简洁的固定称谓。
- source_word: καὶ
  choice: 和
  rationale: 保留简单并列关系，连接两类祭物。
- source_word: περὶ ἁμαρτίας
  choice: 赎罪祭
  rationale: 在祭祀语境中，这是表示为罪而献之祭的惯用表达；“赎罪祭”自然且能明确呈现其礼仪类别。
- source_word: οὐκ εὐδόκησας
  choice: 是你所不喜悦的
  rationale: 保留第二人称对上帝的直接称呼和明确否定；“不喜悦”体现 εὐδοκέω 的认可、悦纳之意，又不额外强化为厌恶。
theological_decisions:
- issue: 希伯来书引用诗篇时对祭物类别的表述
  choice: 明确译作“燔祭和赎罪祭”
  alternative: “全牲燔祭和为罪所献的祭”
  rationale: 保留两类具体祭物，使读者能看出上下文对献祭制度的论述，同时不在本节中加入这些祭物为何不蒙喜悦的解释。
translation_notes:
  register: 采用现代、庄重而通顺的中文。“燔祭”“赎罪祭”为普通中文读者在圣经语境中可辨识的礼仪术语；句式略带诗歌引文的庄重感，并让脚注标记紧随正文。
