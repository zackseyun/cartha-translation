  text: Ἔχοντες οὖν, ἀδελφοί, παρρησίαν εἰς τὴν εἴσοδον τῶν ἁγίων ἐν τῷ αἵματι Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/019.yaml
  text: Therefore, brothers, since we have boldness to enter the holy places by the blood of Jesus,
translation:
  language: zh_hans
  text: 所以，弟兄们[a]，既然我们靠着耶稣的血，可以坦然进入圣所[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“弟兄姊妹”；希腊文直译为“弟兄们”，在这里可能代表性地称呼全体会众。
    reason: lexical_alternative
  - marker: b
    text: 或译“神圣之处”；这里结合《希伯来书》的会幕意象，指上帝临在的圣所，但原文未明确限定为“至圣所”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔχοντες
  choice: 既然我们……可以
  rationale: 该分词在这里为下文的劝勉提出根据；用“既然”自然表达其因由和逻辑功能。
- source_word: οὖν
  choice: 所以
  rationale: 承接前文论证并引出推论，现代汉语中“所以”清楚自然。
- source_word: ἀδελφοί
  choice: 弟兄们[a]
  rationale: 保留希腊文阳性复数称呼的形式；脚注说明它可代表性地包括全体会众。
- source_word: παρρησίαν
  choice: 坦然
  rationale: 在本语境中表示来到上帝面前时有把握、无所畏惧的自由；“坦然”兼具信心与自由亲近之意。
- source_word: εἰς τὴν εἴσοδον
  choice: 进入
  rationale: 将名词性结构按自然汉语转为动词，同时保留获准进入、得以亲近的意义。
- source_word: τῶν ἁγίων
  choice: 圣所[b]
  rationale: 结合《希伯来书》的会幕和献祭语境，指上帝临在的神圣领域；“圣所”自然简洁，但不强行限定为“至圣所”。
- source_word: ἐν τῷ αἵματι Ἰησοῦ
  choice: 靠着耶稣的血
  rationale: 表达进入的凭借或基础，保留血的献祭含义，而不将其改写成更具体的神学解释。
theological_decisions:
- issue: τῶν ἁγίων 的范围
  choice: 圣所，即上帝临在的神圣领域
  alternative: 众圣徒；至圣所；诸圣处
  rationale: 上下文持续运用会幕礼仪意象，因此空间和敬拜意义最合适；译作“众圣徒”不合语境，译作“至圣所”则比原文更具体。
- issue: ἀδελφοί 的代表范围
  choice: 正文保留“弟兄们”，脚注说明可包括姊妹
  alternative: 弟兄姊妹；众弟兄姊妹
  rationale: 既保存原文阳性复数称呼，又向读者交代它在会众称呼中可能具有代表全体的用法。
- issue: παρρησίαν 的语气
  choice: 坦然
  alternative: 胆量；信心；放胆
  rationale: 此处不是鲁莽无礼，而是基于耶稣之血、可以自由亲近上帝的笃定；“坦然”较好保留这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。经文在希腊文中是延续到下一节的句子，因此保留句末逗号。“坦然进入”是自然汉语搭配，并保留 παρρησία 所表达的有把握和自由亲近之意。
