id: HEB.10.12
reference: Hebrews 10:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ⸀οὗτος δὲ μίαν ὑπὲρ ἁμαρτιῶν προσενέγκας θυσίαν εἰς τὸ διηνεκὲς ἐκάθισεν ἐν δεξιᾷ τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/012.yaml
  text: But this one[a], after offering one sacrifice for sins for all time, sat down at the right hand of God[b],
translation:
  language: zh_hans
  text: 但这一位献上了一次赎罪的祭，永远有效[a]，就坐在上帝的右边[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“献上了一次赎罪的祭，就永远坐在上帝的右边。”希腊语“永远”既可理解为强调这一次献祭永久有效，也可与“坐下”连在一起。
    reason: alternative_reading
  - marker: b
    text: “在上帝的右边”呼应诗篇110:1；希伯来书多次引用这节经文，说明弥赛亚被高举。
    reason: cross_reference
lexical_decisions:
- source_word: οὗτος
  choice: 这一位
  rationale: 保留指示代词的对比作用，承接上文天天站着、屡次献祭的祭司，同时避免只译作“他”而削弱强调。
- source_word: δὲ
  choice: 但
  rationale: 明确表现本节与前文祭司反复献祭之间的对照。
- source_word: μίαν ... θυσίαν
  choice: 一次……的祭
  rationale: 突出祭物只献一次，与上文屡次献上同样的祭形成鲜明对比；现代汉语中比“一件祭物”更自然。
- source_word: ὑπὲρ ἁμαρτιῶν
  choice: 赎罪的
  rationale: 按献祭语境自然表达“为罪而献”的目的，不将其机械译成“代表罪”。
- source_word: προσενέγκας
  choice: 献上了……就
  rationale: 以“了……就”自然表达不定过去时分词先于主句动作发生的时间关系。
- source_word: εἰς τὸ διηνεκές
  choice: 永远有效
  rationale: 在上下文中表达这一次献祭持久不变的效力，同时用脚注保留该短语也可能修饰“坐下”的句法歧义。
- source_word: ἐκάθισεν
  choice: 坐在
  rationale: 保留坐下这一完成动作，并与前文祭司天天站着形成对照。
- source_word: ἐν δεξιᾷ τοῦ θεοῦ
  choice: 在上帝的右边
  rationale: 采用清楚自然的现代汉语表达，并保留对诗篇110:1中尊荣与掌权位置的呼应。
theological_decisions:
- issue: εἰς τὸ διηνεκές的修饰范围
  choice: 正文将其理解为强调一次献祭永久有效，译作“永远有效”置于“祭”之后。
  alternative: 也可理解为修饰主句：“就永远坐在上帝的右边。”
  rationale: 紧接前文反复献祭与本节一次献祭的对比，这种处理较自然地凸显祭的持久效力；但希腊文的词序容许它与“坐下”结合，因此以脚注保存真实的句法与神学张力。
- issue: 基督与前文祭司的对比
  choice: 用“这一位”与“但”保留明确对照。
  alternative: 可简化为“他”。
  rationale: 原文οὗτος带有指示和对比力量，不宜在中文中完全淡化；同时不额外加入原文未明说的身份称谓。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“这一位”保留篇章对比；用“赎罪的祭”体现祭祀语境。正文流畅表达首选理解，并借脚注保留εἰς τὸ διηνεκές修饰范围上的歧义。
