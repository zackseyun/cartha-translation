  text: κατέχωμεν τὴν ὁμολογίαν τῆς ἐλπίδος ἀκλινῆ, πιστὸς γὰρ ὁ ἐπαγγειλάμενος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/023.yaml
  text: Let us hold fast the confession of our hope without wavering[a], for the one who promised is faithful.
translation:
  language: zh_hans
  text: 让我们持守对盼望的坚定宣认[a]，因为作出应许的那一位是信实的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“盼望的坚定宣认。”希腊文没有明确说“我们的”。
    reason: 说明希腊文属格结构，并保留原文未明说物主代词这一点。
lexical_decisions:
- source_word: κατέχωμεν
  choice: 让我们……持守
  rationale: 现在时虚拟语气在此表达共同劝勉；“让我们……持守”既保留劝勉语气，也传达牢牢守住所信之事的持续意味。
- source_word: ὁμολογίαν
  choice: 所宣认的
  rationale: 该词指公开承认或宣告信仰；译作“所宣认的”比名词化的“宣认”更符合现代汉语，同时保留公开表明信仰的含义。
- source_word: τῆς ἐλπίδος
  choice: 盼望
  rationale: 属格结构可直译为“盼望的宣认”。正文采用“所宣认的盼望”，使汉语自然，并未明确加入原文没有的物主代词“我们的”。
- source_word: ἀκλινῆ
  choice: 坚定不移地
  rationale: 原词意为不偏离、不摇动，在句中说明应当使这宣认保持不动摇；副词性表达符合现代汉语习惯。
- source_word: πιστὸς
  choice: 信实的
  rationale: 既表达可信可靠，也保留该词在论及上帝信守应许时的神学分量。
- source_word: ὁ ἐπαγγειλάμενος
  choice: 作出应许的那一位
  rationale: 带冠词的过去时中间语态分词作名词使用；此译法保留原文未明说姓名的表达，并突出先前作出应许者。
theological_decisions:
- issue: “作出应许的那一位”的所指
  choice: 依原文保留含蓄表达，不在正文直接补出“上帝”。
  alternative: 译作“作出应许的上帝”。
  rationale: 上下文清楚指向上帝，但希腊文只说“作出应许的那一位”；保留这种表达可避免不必要的解释性增补。
- issue: τῆς ἐλπίδος中的所属关系
  choice: 正文译为“所宣认的盼望”，不明确补入“我们的”。
  alternative: 译作“我们所宣认的盼望”或较直译的“盼望的宣认”。
  rationale: 希腊文没有物主代词。正文借汉语关系结构传达群体共同宣认的含义，同时不把隐含关系明说为“我们的”；脚注保留较直译的结构。
translation_notes:
  register: 采用现代、庄重而易懂的劝勉语体。“持守”“盼望”“信实”沿用普通读者熟悉的圣经核心词汇；避免过度文言化，也不把上下文隐含的“上帝”直接增补进正文。
