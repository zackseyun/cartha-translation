  text: ἡμεῖς δὲ οὐκ ἐσμὲν ὑποστολῆς εἰς ἀπώλειαν, ἀλλὰ πίστεως εἰς περιποίησιν ψυχῆς.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/039.yaml
  text: But we are not of shrinking back to destruction[d][c][b][a], but of faith to the preservation of the soul.
translation:
  language: zh_hans
  text: 但我们不是那些退缩而走向灭亡的人[a]，而是那些有信心而得以保全生命的人[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “退缩”也可译作“退后”。原词表示撤退或退却；在这里，有人将它理解为更严重的“背道”。
    reason: lexical_alternative
  - marker: b
    text: “信心”也可理解为“忠信”，即坚持信靠、不退后。
    reason: alternative_reading
  - marker: c
    text: “得以保全生命”也可译作“得着生命”或“得以保全灵魂”。这里的“生命”可指人的生命、自己或整个人，并非只指现代意义上与身体相对的“灵魂”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς δὲ
  choice: 但我们
  rationale: 保留显明的第一人称复数及其强调作用；“但”自然表达与上文警告之间的鲜明对比。
- source_word: οὐκ ἐσμὲν ὑποστολῆς
  choice: 不是退缩……的人
  rationale: 两个属格构成简练的类别表达；汉语补出“的人”以自然传达“我们不属于退缩者”之意。“退缩”保留撤退、畏缩的含义，不直接把该词限定为“背道”。
- source_word: εἰς ἀπώλειαν
  choice: 以致灭亡
  rationale: εἰς在此指向结果或结局；“以致”清楚表达退缩所趋向的严重后果，“灭亡”也与后半句的保全形成对照。
- source_word: πίστεως
  choice: 凭信心
  rationale: 以“信心”表达πίστις的通常含义；“凭”使省略式的希腊语类别表达在现代汉语中更顺畅，同时不排除坚忍忠信的语境色彩。
- source_word: εἰς περιποίησιν ψυχῆς
  choice: 使生命得以保全
  rationale: 在与ἀπώλεια“灭亡”的对照中，περιποίησις较自然地取“保全”义。ψυχή在此可指人的生命或整个自我，故正文用“生命”，避免让现代读者误以为只指与身体相分离的“灵魂”。
theological_decisions:
- issue: πίστις在劝勉语境中是“信心”还是“忠信”
  choice: 信心
  alternative: 忠信；持守信仰
  rationale: 正文采用该词最通常的“信心”，但脚注保留其在本语境中可能带有恒久忠信、坚持信靠的色彩，不把二者强行割裂。
- issue: περιποίησις ψυχῆς所指的是保全、获得，还是持守生命／自我
  choice: 使生命得以保全
  alternative: 得着生命；保全灵魂；保全自己
  rationale: 与前句“灭亡”的直接对照支持“保全”，但该名词也可带有获得、取得之意；脚注保留这一词义张力，不据此引入靠功劳赚取救恩的解释。
- issue: ὑποστολή是否应明确译为背道
  choice: 退缩
  alternative: 退后；背道
  rationale: 原词确可在警告语境中被理解为严重离弃，但词本身首先表示退却、退缩；正文不把语境推论写成唯一词义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“不是……的人，而是……的人”重现原文两个属格类别之间的平行对照；后半句为避免汉语生硬，省去重复的“的人”，但结构和对比仍清楚。正文优先呈现“灭亡／保全生命”的语义对应，脚注保留“退缩／背道”“信心／忠信”及“保全／得着”的真实歧义。
