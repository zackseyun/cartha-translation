- from: 但我们不是退缩以致灭亡的人[a]，而是凭信心使生命得以保全的人[b][c]。
  to: 但我们不是那些退缩而走向灭亡的人[a]，而是那些有信心而得以保全生命的人[b][c]。
  rationale: 修订仅调整后半句的句法，恢复两个“……的人”之间的平行类别对照，并避免把“信心”明确说成促成生命保全的工具性原因。保留“生命”以呈现ψυχή的宽广语义，且以脚注保存“灵魂／得着”的可行替代译法。
