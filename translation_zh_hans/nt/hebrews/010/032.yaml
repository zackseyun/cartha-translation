  text: Ἀναμιμνῄσκεσθε δὲ τὰς πρότερον ἡμέρας, ἐν αἷς φωτισθέντες πολλὴν ἄθλησιν ὑπεμείνατε παθημάτων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/032.yaml
  text: But remember the former days[a], when, after you were enlightened, you endured a great struggle of sufferings[c][b],
translation:
  language: zh_hans
  text: 不过，你们要回想从前的日子：你们蒙了光照以后[a][b]，在苦难中经受了一场激烈的抗争[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “蒙了光照以后”也可译作“蒙光照时”。希腊语分词在这里既可理解为先于后面的行动，也可能着重于那段时期。
    reason: lexical_alternative
  - marker: b
    text: “蒙了光照”泛指领受属灵的光照；有人将它联系于归信、洗礼或信仰教导，但本节没有明确限定。
    reason: alternative_reading
  - marker: c
    text: “激烈的抗争”也可译作“艰苦的竞赛”；原词带有奋力竞赛或抗争的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναμιμνῄσκεσθε
  choice: 要回想
  rationale: 现在时命令语气要求受众主动追忆；“要回想”在现代汉语中自然地表达劝勉和命令语气，而持续性可由语境体现。
- source_word: δὲ
  choice: 不过
  rationale: δέ在此承接前文的警告并转入鼓励性的回顾；“不过”能自然表达这一温和的转折。
- source_word: τὰς πρότερον ἡμέρας
  choice: 从前的日子
  rationale: 直接保留时间对照，也符合现代汉语的庄重叙述习惯。
- source_word: ἐν αἷς
  choice: （通过冒号引出其间发生的事）
  rationale: 该关系短语具有时间意义。汉语用冒号把“从前的日子”与后续经历相连，比硬译为“在那些日子里”更流畅，同时不损失时间关系。
- source_word: φωτισθέντες
  choice: 蒙了光照以后
  rationale: 保留“光照”的属灵隐喻和被动意义，不把它具体解释为归信、洗礼或受教；“以后”按主句与不定过去时分词的通常关系表达先后次序，并以脚注保留同时性的可能。
- source_word: πολλὴν ἄθλησιν
  choice: 一场激烈争战
  rationale: ἄθλησις带有竞赛、奋力抗争的意象；“激烈争战”既传达πολλήν所表示的强度，也保留争战或竞赛感。
- source_word: ὑπεμείνατε
  choice: 忍受了
  rationale: 准确表达在苦难压力下承受并坚持下来的意思，且符合现代汉语常用表达。
- source_word: παθημάτων
  choice: 苦难中的
  rationale: 该属格说明争战由各种苦难构成或以苦难为领域；译作“苦难中的”保留这种较宽泛的关系，避免限定为某一种迫害。
theological_decisions:
- issue: 警告与劝勉语境中φωτισθέντες的具体所指
  choice: 保留“蒙了光照”这一隐喻性说法
  alternative: 译为“归信以后”“受洗以后”或“领受福音之光以后”
  rationale: 原文表明确有先前领受属灵光照的经历，却未明确指定这是归信、洗礼还是信仰教导。保留原有隐喻，可避免加入特定宗派解释，并维持经文本身的神学张力。
- issue: φωτισθέντες与主句动作的时间关系
  choice: 正文译为先行关系“以后”，脚注保留同时关系
  alternative: 译为“蒙光照时”
  rationale: 不定过去时分词通常可表示先于主句的动作，但具体时间关系仍由语境决定；原文并未用独立时间连词彻底排除重叠关系。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“蒙了光照”保留经文的核心隐喻；“一场激烈争战”使原文的竞赛意象在自然汉语中仍可感知。句中以冒号组织回忆内容，避免关系从句式的生硬直译。
