  text: ἀθετήσας τις νόμον Μωϋσέως χωρὶς οἰκτιρμῶν ἐπὶ δυσὶν ἢ τρισὶν μάρτυσιν ἀποθνῄσκει·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/028.yaml
  text: Anyone who has set aside the law of Moses dies without mercy on the testimony of two or three witnesses[a].
translation:
  language: zh_hans
  text: 凡弃绝摩西律法的人，经两三个见证人作证，就不蒙怜悯而死[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“被处死。”希腊文直译为“死”，但摩西律法的语境指司法处决。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀθετήσας
  choice: 废弃
  rationale: 该词表示拒绝、否定或置权威于不顾。“废弃”既保留对律法权威的否定之意，又不把含义缩窄为一般性的“违犯”。
- source_word: τις
  choice: 凡……的人
  rationale: 不定代词在此作泛指；此表达在现代汉语中自然，并保留普遍、代表性的语气。
- source_word: νόμον Μωϋσέως
  choice: 摩西律法
  rationale: 简明、自然地表达属格结构，指与摩西相关的律法。
- source_word: χωρὶς οἰκτιρμῶν
  choice: 毫不蒙怜悯
  rationale: 体现“没有怜悯”的司法处境；希腊语复数在汉语中自然地用抽象名词“怜悯”表达。
- source_word: ἐπὶ δυσὶν ἢ τρισὶν μάρτυσιν
  choice: 凭两三个见证人
  rationale: ἐπί加与格在此说明判决所依据的见证。汉语“凭”自然表达法律依据，同时没有强行补入原文未明说的“证词”或“证据”。
- source_word: ἀποθνῄσκει
  choice: 死去
  rationale: 按希腊语动词本身直译，并以一般现在意义陈述律法后果；司法处决之意由上下文表达，而在脚注列出明确译法。
theological_decisions:
- issue: 是否在正文中明确表达ἀποθνῄσκει的司法处决含义
  choice: 正文保留较直译的“死去”
  alternative: 被处死
  rationale: 摩西律法及两三个见证人的背景表明这里涉及司法处决，但希腊文本使用的是普通的“死”而非明确的使役或被动处决表达。正文保持原文措辞的克制，脚注说明语境中的可选译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“凡……的人”保留泛指语气；“毫不蒙怜悯地死去”维持原文法律后果的严肃性，并借脚注保存“被处死”这一语境明确的译法。
