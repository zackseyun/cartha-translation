source:
  edition: SBLGNT
  text: ἐπεὶ οὐκ ἂν ἐπαύσαντο προσφερόμεναι, διὰ τὸ μηδεμίαν ἔχειν ἔτι συνείδησιν ἁμαρτιῶν τοὺς λατρεύοντας ἅπαξ ⸀κεκαθαρισμένους;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/002.yaml
  text: Otherwise[a], would they not have stopped being offered, because those who worship, having once been cleansed[b], would no longer have any consciousness of sins?
translation:
  language: zh_hans
  text: 若不然，这些祭物岂不已经停止献上了吗？因为敬拜者既已一次得了洁净[a]，就不再有罪的意识了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一次”也可理解为“一次而永远”；这里可能带有决定性、无需重复的意味。
    reason: lexical_alternative
  - marker: b
    text: 直译“就不再有罪的意识”。这里不是说他们不再知道什么是罪，而是说他们不再持续背负在神面前的罪责感。
    reason: lexical_clarification
lexical_decisions:
- source_word: ἐπεὶ
  choice: 若不然
  rationale: 本句承接上文，以反事实推论提出修辞问句；“若不然”自然表达这种逻辑关系。
- source_word: οὐκ ἂν ἐπαύσαντο προσφερόμεναι
  choice: 岂不早就停止献上了吗
  rationale: 保留否定反问及反事实语气；“早就”体现未实现的预期结果，“献上”符合祭祀语境。
- source_word: τοὺς λατρεύοντας
  choice: 敬拜的人
  rationale: 该分词作名词使用，指参与礼仪敬拜的人；译法清楚并保留动作含义。
- source_word: ἅπαξ κεκαθαρισμένους
  choice: 既已一次得洁净
  rationale: “既已……得洁净”体现完成时被动分词所表达的已完成且结果持续的洁净；“一次”保留ἅπαξ本身的语义开放性。
- source_word: συνείδησιν ἁμαρτιῶν
  choice: 觉得自己有罪
  rationale: 这里指人在神面前持续的罪责意识，而不是失去辨别罪的道德良知；此译自然表达语境中的内疚与罪责感。
theological_decisions:
- issue: 洁净以后“没有罪的意识”的含义
  choice: 译作“不再觉得自己有罪”，指不再持续承受罪责意识
  alternative: 不再有罪的良心／不再意识到罪
  rationale: 上下文的论证是：若献祭真正使敬拜者完全，重复献祭便会停止，因为他们的罪责已获洁净；这并非说人会失去对罪的道德辨识。
- issue: ἅπαξ是否明确表示“一次而永远”
  choice: 正文保留“一次”，脚注说明也可理解为“一次而永远”
  alternative: 正文直接译作“一次而永远”
  rationale: ἅπαξ在本语境中可能含有决定性、不可重复的意味，但单词本身仍可仅指“一次”；以脚注保存这一语义张力。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“这些祭物”补明希腊文阴性复数分词承接上文所指的祭物；反问句保持原文论证力度。
