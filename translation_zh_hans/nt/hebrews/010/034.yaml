  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ γὰρ τοῖς ⸀δεσμίοις συνεπαθήσατε, καὶ τὴν ἁρπαγὴν τῶν ὑπαρχόντων ὑμῶν μετὰ χαρᾶς προσεδέξασθε, γινώσκοντες ἔχειν ⸀ἑαυτοὺς κρείττονα ⸀ὕπαρξιν καὶ μένουσαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/034.yaml
  text: For you also suffered together with the prisoners[a], and you accepted with joy the plundering of your possessions[b], knowing that you yourselves have a better and lasting possession.
translation:
  language: zh_hans
  text: 因为你们也曾与被囚的人一同受苦[a]，并且欢喜地接受自己的财物被抢夺，知道你们自己有更好的、长存的产业[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“同情被囚的人。”原文动词可以表示同情，但在这里很可能也包括与他们一同承受苦难。
    reason: lexical_alternative
  - marker: b
    text: 有些抄本作：“知道你们自己在天上有更好的、长存的产业。”
    reason: textual_variant
lexical_decisions:
- source_word: δεσμίοις
  choice: 被囚的人
  rationale: 指受捆绑、遭监禁的人；此译自然、庄重，也不额外限定其身份。
- source_word: συνεπαθήσατε
  choice: 与……一同受苦
  rationale: 该动词既可表示同情，也可表达共同承受苦难；结合本节受逼迫的语境，此译凸显付出代价的认同与患难相助，同时以脚注保留词义上的另一可能。
- source_word: ἁρπαγήν
  choice: 被抢夺
  rationale: 表达财物遭强行、不公地夺取，比“没收”更能保留原词的暴力色彩。
- source_word: τῶν ὑπαρχόντων ὑμῶν
  choice: 自己的财物
  rationale: 分词在此作名词使用，指属于他们的物品或财产；“财物”符合现代汉语表达。
- source_word: μετὰ χαρᾶς
  choice: 欢然
  rationale: 简洁传达“带着喜乐”的方式，语体庄重而自然。
- source_word: προσεδέξασθε
  choice: 接受
  rationale: 表示他们甘愿承受这种损失，并不暗示他们认可抢夺本身的正当性。
- source_word: γινώσκοντες
  choice: 知道
  rationale: 保留分词的伴随及隐含因果意味，不将逻辑关系解释得过满。
- source_word: ἑαυτοὺς ἔχειν
  choice: 你们自己有
  rationale: 保留反身代词所带的强调；同时按所采用的正文读法翻译。
- source_word: κρείττονα
  choice: 更美
  rationale: 希伯来书反复用该比较词表达更优越之意；“更美”是中文圣经语境中自然而庄重的表达。
- source_word: ὕπαρξιν
  choice: 产业
  rationale: 此处单数可集合性或抽象地指所拥有之物，与前面的物质财物形成对照；“产业”能表达可持有且具有恒久价值之物，又不擅自具体化为天上的赏赐或救恩。
- source_word: μένουσαν
  choice: 长存
  rationale: 强调持续存在和永久性；“长存”简洁、庄重。
theological_decisions:
- issue: 与被囚者共同受苦的含义
  choice: 正文译作“与被囚的人一同受苦”
  alternative: “同情被囚的人”或“怜恤被囚的人”
  rationale: συμπαθέω可以指同情，但本段回顾受逼迫经历，合成词及其与间接受词的结构适合表达实际参与和患难相助；脚注保留较弱的词义可能。
- issue: “更美且长存的产业”的性质
  choice: 保持概括性，不在正文说明其位于天上，也不具体解释为救恩、基业或赏赐
  alternative: “在天上有更美、长存的产业”或明确译为“更美的基业”
  rationale: 所采用的SBLGNT正文没有“在天上”；虽有异文如此补充，正文不应把这一神学定位或解释直接加入。
- issue: ἑαυτούς相关文本异文
  choice: 采用SBLGNT正文“你们自己有”
  alternative: 异文加入“在天上”，形成“知道自己在天上有更美、长存的产业”
  rationale: 按指定底本翻译，同时用脚注明示具有解释意义的抄本异文。
translation_notes:
  register: 采用现代标准普通话和简体中文，句式简洁、庄重，适合公开诵读。“欢然接受”避免口语化，“产业”保留地上财物与恒久所有之间的词义呼应。脚注标记均已在正文中出现。
