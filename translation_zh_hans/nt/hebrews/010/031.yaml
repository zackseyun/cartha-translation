  text: φοβερὸν τὸ ἐμπεσεῖν εἰς χεῖρας θεοῦ ζῶντος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/031.yaml
  text: It is a fearful thing to fall into the hands of the living God[a].
translation:
  language: zh_hans
  text: 落在永活的上帝手中，是一件可怕的事。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“落在永活的上帝手中，是令人恐惧的事。”
    reason: 词汇替代译法；φοβερὸν可指“可怕的”，也可强调“令人恐惧的、令人战兢的”。
lexical_decisions:
- source_word: φοβερὸν
  choice: 真是可怕
  rationale: φοβερός表示令人恐惧、畏惧或战兢。这里作谓语，与名词化不定式连用；译为“真是可怕”自然、庄重，并保留警告的强烈语气。
- source_word: τὸ ἐμπεσεῖν
  choice: 落在
  rationale: 带冠词的简单过去时不定式在此名词化，指“落入”这一情形；与后面的εἰς χεῖρας合译为“落在……的手里”，保留突然落入对方权下的意味。
- source_word: εἰς χεῖρας
  choice: 在……的手里
  rationale: 这是表示落入某人权势或审判之下的惯用语。保留“手”的形象，兼顾现代汉语表达与经文互文联系。
- source_word: θεοῦ
  choice: 上帝
  rationale: 该词为属格，修饰“手”，即“上帝的手”。“上帝”是现代汉语中自然、庄重且通行的对应词。
- source_word: ζῶντος
  choice: 永活
  rationale: 现在分词作定语修饰θεοῦ，意为“活着的上帝”。译作“永活上帝”符合现代汉语圣经语体，也强调上帝真实、持续而有行动的存在；正文不额外加入“审判”等原文未明说的词。
theological_decisions:
- issue: 警告语的力度与审判含义
  choice: 将本句译为关于落入永活上帝手中之可怕后果的庄严宣告，并让“落在……手里”的意象承载审判意味
  alternative: 明确增译为“落在上帝的审判之下”，或将其限缩为今世的管教
  rationale: 上下文是严肃的警告，而“落在……手里”通常带有受其权力处置或审判的意味。不过希腊文没有明说“审判”，因此不在正文中增添，以保留原文的张力和含蓄。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“真是可怕”重现希腊文以φοβερὸν置于句首的强调效果；感叹号传达警告力度。保留“手里”的圣经意象，不将其解释性改写为“权下”或“审判之下”。
