  text: and a great priest over the house of God[b][a],
translation:
  language: zh_hans
  text: 又有一位伟大的祭司管理上帝的家[a][b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一位大祭司。”《希伯来书》常称耶稣为大祭司，但本节原文直译为“一位伟大的祭司”。
    reason: alternative_reading
  - marker: b
    text: “上帝的家”也可指上帝的家室，即他的子民。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: 又有
  rationale: 本句承接第19—21节前文已有的内容；汉语以“又有”自然表达并列增添关系。
- source_word: ἱερέα μέγαν
  choice: 一位尊大的祭司
  rationale: ἱερεύς是“祭司”，μέγας表示伟大、尊崇或显要。译作“尊大的祭司”既保留两个词的组合，也不直接改写为技术性称号“大祭司”。
- source_word: ἐπὶ
  choice: 治理
  rationale: ἐπί接宾格在此表示对上帝之家的权柄与照管；“治理”比生硬的“在……之上”更符合现代汉语。
- source_word: τὸν οἶκον τοῦ θεοῦ
  choice: 上帝的家
  rationale: οἶκος既可指房屋，也可指家室、家人或群体。“上帝的家”保留原文比喻，并可由脚注说明其群体含义。
theological_decisions:
- issue: 是否把ἱερέα μέγαν译成技术性称号“大祭司”
  choice: 尊大的祭司
  alternative: 大祭司
  rationale: 希伯来书整体确实称耶稣为大祭司，但本节使用ἱερεύς加μέγας，而非通常表示“大祭司”的ἀρχιερεύς。正文保留原文措辞上的区别，脚注列出符合全书语境的另一译法。
- issue: “上帝的家”指建筑还是上帝的子民
  choice: 正文保留“上帝的家”
  alternative: 上帝的家人／上帝的家族
  rationale: οἶκος本身兼有“房屋”与“家室、家人”的语义；结合希伯来书3:2–6，此处很可能着重指上帝的子民，但不应在正文中消除原有比喻及其语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“尊大的祭司”略带经文体色彩，用来保存ἱερέα μέγαν与技术性称号“ἀρχιερεύς（大祭司）”之间的区别；标点显示本节是跨节长句中的承接成分。
