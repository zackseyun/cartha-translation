base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/014.yaml
  text: For by one offering he has perfected for all time those who are being sanctified[a].
translation:
  language: zh_hans
  text: 因为他借着一次献祭，使那些正在被分别为圣的人得以永远完全[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “正在被分别为圣”或译“正在被使成为圣洁”。
    reason: lexical_alternative
lexical_decisions:
- source_word: μιᾷ
  choice: 一次
  rationale: 与“献祭”搭配，既表达数目上的“一”，也自然突出这次献祭的唯一性；相较“一个祭物”，更符合此处工具格短语的汉语表达。
- source_word: γὰρ
  choice: 因为
  rationale: 承接上文并说明理由；现代汉语中“因为”能清楚体现其解释性、因果性的篇章功能。
- source_word: προσφορᾷ
  choice: 献祭
  rationale: 原词指献给上帝的供物或奉献行为。鉴于《希伯来书》此处明确的祭祀语境，“献祭”自然且准确，同时不进一步限定祭物种类。
- source_word: τετελείωκεν
  choice: 使……完全了
  rationale: 保留 τελειόω 的“使完全”含义；句末“了”表达已经完成并产生持续结果的行动，与希腊语完成时相称。
- source_word: εἰς τὸ διηνεκές
  choice: 永远
  rationale: 该惯用语在《希伯来书》中表示效力持续不息。“永远”简洁自然，并与一次献祭所产生的长久结果相合。
- source_word: τοὺς ἁγιαζομένους
  choice: 那些正被分别为圣的人
  rationale: 用“正被”保留现在时被动分词的进行性和被动语态；“分别为圣”表达归给上帝、成为圣洁的祭祀和宗教含义。
theological_decisions:
- issue: 已经成就的完全与持续进行的成圣之间的关系
  choice: 并列保留“永远完全了”和“正被分别为圣”
  alternative: 将分词译成静态的“已经成圣的人”，或弱化完成结果而译成仍在逐步变得完全
  rationale: 原文有意把完成时 τετελείωκεν 所表达的既成且持续有效的结果，与现在时被动分词 ἁγιαζομένους 所表达的持续过程或身份并置。译文不把这种张力归入某一种教义体系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“只用一次献祭”自然突出 μιᾷ προσφορᾷ 的单一性；“使……永远完全了”与“正被……”形成原文所保留的完成结果和持续过程之间的张力。
