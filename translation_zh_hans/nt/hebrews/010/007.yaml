id: HEB.10.7
reference: Hebrews 10:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: τότε εἶπον· Ἰδοὺ ἥκω, ἐν κεφαλίδι βιβλίου γέγραπται περὶ ἐμοῦ, τοῦ ποιῆσαι, ὁ θεός, τὸ θέλημά σου.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/007.yaml
  text: Then I said[a], ‘Behold, I have come—in the scroll of the book it is written about me—to do your will, O God.’
translation:
  language: zh_hans
  text: 那时我说：“看哪，我来了——书卷中[a]已有关于我的记载——为要遵行你的旨意，神啊。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “书卷”指古代卷轴式的书，不是现代装订成册的书。
    reason: 说明ἐν κεφαλίδι βιβλίου所反映的古代卷轴意象，避免现代读者误解。
lexical_decisions:
- source_word: τότε
  choice: 那时
  rationale: 作为时间副词，引出接下来的回应；“那时”简洁自然，并保留叙述衔接。
- source_word: εἶπον
  choice: 我说
  rationale: λέγω的不定过去时在引出直接引语时，最自然地译为“我说”。
- source_word: Ἰδοὺ
  choice: 看哪
  rationale: 保留其引人注意的指示语气和庄重的经文语体，同时是现代中文读者熟悉的表达。
- source_word: ἥκω
  choice: 我来了
  rationale: 该现在时形式常带有已经到达、如今在场的完成意味；“我来了”在中文中自然地兼顾到来与当前在场。
- source_word: ἐν κεφαλίδι βιβλίου
  choice: 书卷中
  rationale: 此惯用语指写在卷轴式书籍中；“书卷中”既自然，又保留古代书卷的意象。
- source_word: γέγραπται
  choice: 已有……记载
  rationale: 完成时被动语态表示所写内容如今仍然有效；“已有……记载”自然传达其持续有效的书面记载。
- source_word: περὶ ἐμοῦ
  choice: 关于我
  rationale: 直接准确地表达περί加属格所表示的“关于、论到”。
- source_word: τοῦ ποιῆσαι
  choice: 为要遵行
  rationale: 带冠词的不定式在此说明到来的目的；“为要”明确呈现目的，“遵行旨意”是自然庄重的中文搭配。
- source_word: ὁ θεός
  choice: 神啊
  rationale: 虽为主格形式，此处具有呼格作用；中文用“神啊”清楚标明直接称呼。
- source_word: τὸ θέλημά σου
  choice: 你的旨意
  rationale: 准确表达θέλημα的意志或意愿含义；“旨意”适合对神的庄重称述，也符合现代中文圣经语体。
theological_decisions:
- issue: 《诗篇》引文中第一人称话语的弥赛亚指向
  choice: 按原文译为第一人称宣告，不在本节正文中另加“弥赛亚”或“基督”等身份说明。
  alternative: 在正文中明确把说话者称为弥赛亚或基督。
  rationale: 《希伯来书》的上下文将这段引文用于子／基督，但本节本身只保留第一人称话语。译文应让上下文显明其基督论应用，不把解释性身份直接加入经文。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准普通话。“看哪”和“神啊”保留引文的郑重语气；破折号呈现“书卷中已有关于我的记载”在句中的插入结构，同时不消除“我来了”与“为要遵行”之间的目的关系。
