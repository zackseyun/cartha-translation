  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὅπου πρόδρομος ὑπὲρ ἡμῶν εἰσῆλθεν Ἰησοῦς, κατὰ τὴν τάξιν Μελχισέδεκ ἀρχιερεὺς γενόμενος εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/020.yaml
  text: where Jesus has entered as a forerunner on our behalf[b][a], having become a high priest forever according to the order of Melchizedek.
translation:
  language: zh_hans
  text: 耶稣已经为我们[a]作先锋，进入了那里；他照着麦基洗德的等次[b]，成为永远的大祭司。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为我们”也可理解为“代表我们”；原文可指为了他人的益处而行动，这里着重耶稣代表我们先行进入。
    reason: lexical_alternative
  - marker: b
    text: “照着麦基洗德的等次”呼应诗篇110:4。也可译作“按麦基洗德的等次”。
    reason: cross_reference
lexical_decisions:
- source_word: ὅπου
  choice: 那里
  rationale: 承接上一节“幔子里面”的所在，用“进入了那里”自然地保留地点含义，不额外解释该处所。
- source_word: πρόδρομος
  choice: 先锋
  rationale: 指先行进入、为后来者开路的人；“先锋”既保留比喻，也符合现代汉语表达。
- source_word: ὑπὲρ ἡμῶν
  choice: 为我们
  rationale: 可表达为他人利益或代表他人而行；此处避免译成较强的“代替我们”，以免把经文本身的含义收窄。
- source_word: εἰσῆλθεν
  choice: 已经……进入了
  rationale: 希腊文不定过去时叙述已完成的进入；汉语用“已经……了”也能自然表达此事对当前论述持续有效。
- source_word: Ἰησοῦς
  choice: 耶稣
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: κατὰ τὴν τάξιν Μελχισέδεκ
  choice: 照着麦基洗德的等次
  rationale: 保留与诗篇110:4相呼应的固定表述，表达祭司职分的类别、模式或序列，而不将含义过度具体化。
- source_word: ἀρχιερεὺς
  choice: 大祭司
  rationale: 这是希伯来书祭司论述中的标准、准确称谓。
- source_word: γενόμενος
  choice: 成为
  rationale: 保留分词所表达的取得祭司身份或职分，不将它改写为关于本体起源的陈述。
- source_word: εἰς τὸν αἰῶνα
  choice: 永远
  rationale: 这是该惯用语在本语境中最清楚自然的译法，强调其大祭司职分恒久不变。
theological_decisions:
- issue: γενόμενος与基督身份的关系
  choice: 译为“成为永远的大祭司”，按取得或受立于祭司职分理解。
  alternative: 译为“被立为永远的大祭司”。
  rationale: “成为”较直接地保留希腊文动词，同时上下文明确其所涉及的是大祭司身份和救赎历史中的职分，并非耶稣本体的产生或改变；“被立为”虽可说明任命含义，却加入了原文未明说的被动语态。
- issue: ὑπὲρ ἡμῶν的语义力度
  choice: 译为“为我们”，并以脚注说明其代表和使人得益的含义。
  alternative: “代表我们”或“代替我们”。
  rationale: 本节着重耶稣先行进入；“为我们”保留受益和代表两方面的可能，不把该短语限定为本节未明确表达的替代公式。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“作先锋，进入了那里”保持上一节至本节的空间意象；分号把耶稣的先行进入与其永远的大祭司职分紧密连接，同时避免汉语长句生硬。
