revisions:
- from: 为要借着这两件不可更改的事——在这些事上，神绝不可能说谎——使我们这些逃来寻求庇护的人受到有力的鼓励，紧紧抓住所摆在我们面前的盼望。[a][b]
  to: 为要借着这两件不可更改的事——神在这两件事上不可能说谎——使我们这些逃来避难[b]、为要紧紧抓住[a]摆在我们面前的盼望的人，得着强有力的鼓励。
  rationale: 修订仅解决原文句法关系及脚注锚点问题：将“为要紧紧抓住摆在我们面前的盼望”明确修饰“逃来避难”的人，保留原文逃避与抓住盼望并置的具体意象；同时将脚注标记移至相应短语之后。
