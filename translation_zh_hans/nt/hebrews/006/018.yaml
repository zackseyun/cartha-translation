source:
  edition: SBLGNT
  text: ἵνα διὰ δύο πραγμάτων ἀμεταθέτων, ἐν οἷς ἀδύνατον ψεύσασθαι ⸀θεόν, ἰσχυρὰν παράκλησιν ἔχωμεν οἱ καταφυγόντες κρατῆσαι τῆς προκειμένης ἐλπίδος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/018.yaml
  text: so that through two unchangeable things[a], in which it is impossible for God to lie[b], we who have fled for refuge might have strong encouragement to take hold of the hope set before us.
translation:
  language: zh_hans
  text: 为要借着这两件不可更改的事——神在这两件事上不可能说谎——使我们这些逃来避难[b]、为要紧紧抓住[a]摆在我们面前的盼望的人，得着强有力的鼓励。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “紧紧抓住”也可译作“牢牢持守”。希腊文动词可指抓取、握住或坚定持守。
    reason: lexical_alternative
  - marker: b
    text: “逃来避难”带有逃往安全之处避难的意象，可能使人联想到旧约中的逃城。
    reason: cross_reference
lexical_decisions:
- source_word: ἵνα
  choice: 为要
  rationale: 承接上文，表达目的或预期结果；“为要”在现代中文中庄重而清楚。
- source_word: διὰ δύο πραγμάτων ἀμεταθέτων
  choice: 借着这两件不可更改的事
  rationale: 保留“两个事项/事实”的宽泛表达，并以“这”自然指回上文的应许和誓言；ἀμεταθέτων强调不可改变。
- source_word: ἐν οἷς
  choice: 在这些事上
  rationale: 保持与前述“两件事”的关系，不把它改写为因果关系。
- source_word: ἀδύνατον ψεύσασθαι θεόν
  choice: 神绝不可能说谎
  rationale: 保留“不可能”的强烈断言；“绝不可能”自然传达希腊文的强调，又不扩展为文本以外的神学命题。
- source_word: ἰσχυρὰν παράκλησιν
  choice: 受到有力的鼓励
  rationale: παράκλησις在此主要指使人坚定的鼓励；“有力”传达ἰσχυράν的强度。
- source_word: ἔχωμεν
  choice: 使……受到
  rationale: 在ἵνα目的从句中，以中文使动结构自然表达“使我们得着/拥有”；不必机械呈现虚拟语气。
- source_word: οἱ καταφυγόντες
  choice: 我们这些逃来寻求庇护的人
  rationale: 同时保留逃奔的动作和寻求安全庇护的目的，避免弱化为抽象的“投靠”。
- source_word: κρατῆσαι
  choice: 紧紧抓住
  rationale: 兼顾“抓取”和“牢牢持守”的词义范围，中文自然且保留主动、强烈的意象。
- source_word: τῆς προκειμένης ἐλπίδος
  choice: 所摆在我们面前的盼望
  rationale: 保留盼望已被放置、呈现在人面前的客观意象。
theological_decisions:
- issue: 避难意象与抓住盼望的关系
  choice: 保留“逃来寻求庇护”及“紧紧抓住”的具体意象
  alternative: 译作“我们这些投靠神的人，得以坚定持守摆在面前的盼望”
  rationale: 原文将逃往避难之处与抓住盼望并置；不将其抽象化，也不明确补入原文未明说的庇护对象。
- issue: 神不说谎的断言
  choice: 神绝不可能说谎
  alternative: 神不会说谎
  rationale: 原文是“不可能”的强断言；保留其神学力度，同时不添加关于神性本质的系统性解释。
- issue: “两件不可更改的事”的所指
  choice: 正文不明说其为应许和誓言
  alternative: 借着他不可更改的应许和誓言
  rationale: 上下文强烈暗示应许和誓言，但本节本身使用概括性表达“两件事”；译文保留这一指代方式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“神”遵循中文圣经常用称谓。破折号突出关于神绝不说谎的插入说明；脚注标记均置于正文末尾，并与脚注内容对应。
