review_pass:
  verdict: revise
  source_fidelity: 原译的主要词义大体准确，但“使……受到有力的鼓励，紧紧抓住……”在中文中把“紧紧抓住”错误地悬接在“受到鼓励”之后。原文的κρατῆσαι更自然地与“逃来避难”相连，表明逃来避难者所要抓住的是摆在面前的盼望。修订恢复这一关系。
  naturalness: “受到有力的鼓励，紧紧抓住……”不够合乎现代中文句法。将“为要紧紧抓住……的人”置入“逃来避难者”的限定语中，句法清楚、庄重且自然。“强有力的鼓励”也比“受到有力的鼓励”更适合与“得着”搭配。
  terminology: 保留“神”“不可更改”“说谎”“盼望”等恰当的中文圣经与现代庄重语体用语。不把“两件事”在正文中具体化为应许和誓言。
