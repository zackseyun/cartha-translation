  text: καὶ οὕτως μακροθυμήσας ἐπέτυχεν τῆς ἐπαγγελίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/015.yaml
  text: And so[a], after waiting patiently, he obtained the promise.
translation:
  language: zh_hans
  text: 这样，亚伯拉罕耐心等候，就得着了应许。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译为“得着了所应许的事”。希腊语直译为“得着了应许”。
    reason: 说明ἐπαγγελία可按其所指内容理解，同时保留正文对希腊语名词“应许”的对应。
lexical_decisions:
- source_word: καὶ οὕτως
  choice: 这样
  rationale: 承接上文神向亚伯拉罕起誓的叙述，表达“如此、于是”的方式和结果关系；中文不必机械译出 καὶ。
- source_word: μακροθυμήσας
  choice: 恒久忍耐
  rationale: 该不定过去时主动分词表示长久而耐心地坚持；结合语境，以“恒久忍耐”自然表达其持续忍耐等候的含义。
- source_word: ἐπέτυχεν
  choice: 得着了
  rationale: 表达成功达到或获得；“得着”符合庄重而通俗的现代汉语，也不额外规定应许实现到何种程度。
- source_word: τῆς ἐπαγγελίας
  choice: 所应许的
  rationale: ἐπαγγελία 可指“应许”本身，也可借指应许的内容；正文采用自然中文“所应许的”，脚注保留更贴近希腊语形式的译法。
theological_decisions:
- issue: 本句是说亚伯拉罕得到了应许的完全实现，还是得到了神所应许的事或应许本身
  choice: 译作“得着了所应许的”，不明说是全部应许的完全实现
  alternative: “得着了应许”
  rationale: 希腊语直译是“得着了那应许”，而 ἐπαγγελία 在语境中既可能指应许本身，也可能指应许的内容。正文采用自然表达，同时不加入“完全实现”等原文没有的限定；脚注交代较直译形式。
translation_notes:
  register: 采用现代、庄重且易懂的简体中文。“恒久忍耐”比“耐心等待”更直接对应 μακροθυμέω 的忍耐含义；补出主语“亚伯拉罕”，使单节独立阅读时指代清楚，并与上文语境一致。
