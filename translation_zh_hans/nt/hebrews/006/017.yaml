source:
  edition: SBLGNT
  text: ἐν ᾧ περισσότερον βουλόμενος ὁ θεὸς ἐπιδεῖξαι τοῖς κληρονόμοις τῆς ἐπαγγελίας τὸ ἀμετάθετον τῆς βουλῆς αὐτοῦ ἐμεσίτευσεν ὅρκῳ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/017.yaml
  text: So when God desired to show more clearly to the heirs of the promise the unchangeable character of his purpose[a], he guaranteed it with an oath[b],
translation:
  language: zh_hans
  text: 这样，神既愿意更充分地向承受应许的人显明他旨意的不变性[a]，就以誓言加以保证[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他所定计划的不变性。”
    reason: βουλή可指旨意、计划或定意；ἀμετάθετον指不可改变的性质。
  - marker: b
    text: 较直译：“以誓言介入其间。”
    reason: ἐμεσίτευσεν字面与居间或介入有关；在此语境中指借着誓言给予保证。
lexical_decisions:
- source_word: ἐν ᾧ
  choice: 因此
  rationale: 该短语承接上文神向亚伯拉罕起誓的论述，主要表达逻辑上的承接；译作“因此”比直译“在其中”更符合现代汉语。
- source_word: περισσότερον
  choice: 更充分地
  rationale: 该比较级副词加强“显明”的程度；“更充分地”既保留比较意味，也不把重点仅限于视觉或认知上的“清楚”。
- source_word: βουλόμενος
  choice: 既愿意
  rationale: 分词表示神有意如此行，译作“既愿意”保留其主动意愿和审慎意图，而不将其弱化为未必实现的愿望。
- source_word: ἐπιδεῖξαι
  choice: 显明
  rationale: 此词意为展示、证明或使人看明；“显明”庄重自然，并与“更充分地”搭配顺畅。
- source_word: τοῖς κληρονόμοις τῆς ἐπαγγελίας
  choice: 向承受应许的人
  rationale: 以现代汉语自然表达“应许的继承人”，指被指定领受应许之福的人；避免“应许的继承人”可能造成继承一项话语本身的生硬感。
- source_word: τὸ ἀμετάθετον τῆς βουλῆς αὐτοῦ
  choice: 他的旨意不可更改
  rationale: ἀμετάθετον强调不能改变或撤换，βουλή指经过定意的目的、计划或决断；此译法把希腊语的抽象名词结构转为自然汉语判断句，同时保留其绝对稳定性。
- source_word: ἐμεσίτευσεν
  choice: 作保
  rationale: 该动词字面涉及居间或介入，在本语境中表示神借誓言给予确证和担保；“作保”简明传达其语用功能，字面意味则收入脚注。
- source_word: ὅρκῳ
  choice: 以誓言
  rationale: 与格表示手段，即神借着誓言作保；“以誓言”准确而庄重。
theological_decisions:
- issue: 如何表达神旨意的不可更改而不引入经文之外的形而上术语
  choice: 他的旨意不可更改
  alternative: 他筹划的不变性／他的计划不可改变
  rationale: 原文强调神这项定意无法更改。所选表达完整保留这一神学力度，同时避免使用普通读者较难理解的“不变性”等抽象术语，也不将陈述扩展为关于神一切属性的系统命题。
- issue: ἐμεσίτευσεν与誓言的关系
  choice: 以誓言作保
  alternative: 以誓言居间／借誓言加以保证
  rationale: 上下文重点是神借起誓向承受应许的人提供额外确证。“作保”传达该动词在此处的功能，但脚注保留其较为字面的“介入其间”可能性。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“承受应许的人”沿用圣经语境中自然的继承意象；“旨意不可更改”避免生硬的抽象名词堆叠；“作保”使罕见动词的语境功能清楚，脚注则保留字面层面的歧义。
