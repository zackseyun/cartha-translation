  text: ἣν ὡς ἄγκυραν ἔχομεν τῆς ψυχῆς, ⸀ἀσφαλῆ τε καὶ βεβαίαν καὶ εἰσερχομένην εἰς τὸ ἐσώτερον τοῦ καταπετάσματος,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/019.yaml
  text: We have this as an anchor of the soul[a], both secure and firm, and entering into the inner place behind the curtain,
translation:
  language: zh_hans
  text: 我们有这盼望，如同灵魂的锚，既稳妥又牢固，并且进入幔子后面的内处[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“进入幔子以内的内处”或“进入幔子后面”。
    reason: “幔子的内处”在圣所语境中指幔子另一边的内在区域；汉语可明确其空间关系。
lexical_decisions:
- source_word: ἣν
  choice: 这盼望
  rationale: 阴性关系代词回指上一节的“盼望”。汉语明说“这盼望”，既自然，也清楚保留跨节照应。
- source_word: ὡς ἄγκυραν
  choice: 如同……的锚
  rationale: ὡς 引出比喻；“如同……的锚”用现代汉语直接保留锚的意象。
- source_word: ἔχομεν
  choice: 我们有
  rationale: 按现在时直译为常用、自然的“我们有”，不采用较生硬的“拥有”。
- source_word: τῆς ψυχῆς
  choice: 灵魂的
  rationale: 保留 ψυχή 的通常词义和属格表达，不把它缩窄为心理活动，也不释义为“生命”。
- source_word: ἀσφαλῆ
  choice: 安全
  rationale: 在锚的比喻中表达不致带来危险、可靠安稳的性质，并与 βεβαίαν 有所区分。
- source_word: τε καὶ
  choice: 既……又……
  rationale: 用汉语关联结构体现 τε καὶ 所连接的两个并列特征。
- source_word: βεβαίαν
  choice: 牢固
  rationale: 表达稳固、可靠之意，贴合锚的意象，同时避免与 ἀσφαλῆ 合并为同一概念。
- source_word: εἰσερχομένην
  choice: 进入
  rationale: 保留现在分词对“锚”的继续描述；汉语以并列谓语自然承接，不补入额外解释。
- source_word: εἰς τὸ ἐσώτερον
  choice: 进入……内层
  rationale: ἐσώτερον 是实体化的比较级，指较里面的区域；“内层”保留空间含义，又不直接指定为“至圣所”。
- source_word: τοῦ καταπετάσματος
  choice: 幔子后面的
  rationale: καταπέτασμα 指圣所中的隔幔。“幔子”保留礼仪空间意象；“后面的”把希腊语属格在语境中隐含的空间关系自然表达出来。
theological_decisions:
- issue: 天上圣所的礼仪意象
  choice: 译作“幔子后面的内层”
  alternative: “幔子以内的内层”或“幔子后面”
  rationale: 经文借用会幕或圣殿的隔幔意象，后文才进一步展开其所指。正文清楚表达空间关系，却不提前明确释作“至圣所”，从而避免超出本句措辞。
- issue: 锚所进入之处的语法与意象张力
  choice: 让“进入”继续描述作为锚的盼望
  alternative: 改写为“这盼望使我们进入”
  rationale: 希腊语分词 εἰσερχομένην 与“锚”一致。保留这种大胆的延伸比喻，不把它解释成盼望带领信徒进入，从而避免消解原文的修辞张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“灵魂的锚”保留原文凝练的比喻；“安全又牢固”以普通读者易懂的词语呈现两个相近但不完全相同的形容词。
