  text: instruction about washings[a], the laying on of hands, the resurrection of the dead, and eternal judgment.
translation:
  language: zh_hans
  text: 关于各样洗濯礼[a]、按手、死人的复活和永恒的审判的教导。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“各种洗礼的教导。”希腊文在这里用复数，也可较广泛地指礼仪性的各种洗濯，不一定专指基督徒的洗礼。
    reason: 保留 βαπτισμῶν 的词义选择及其真实歧义。
lexical_decisions:
- source_word: βαπτισμῶν
  choice: 各种洁净礼仪
  rationale: 该词为复数，可指犹太或礼仪性的各种洗濯；这样既体现复数，也避免直接限定为基督徒的洗礼。
- source_word: διδαχὴν
  choice: 教导
  rationale: 自然承接上一节所列的根基事项，并可统摄本节各个关于某事的属格短语。
- source_word: ἐπιθέσεώς τε χειρῶν
  choice: 按手
  rationale: “按手”是现代汉语中自然、明确且通行的表达，准确指称这一行为。
- source_word: ἀναστάσεώς τε νεκρῶν
  choice: 死人复活
  rationale: 保留 νεκρῶν 的集合意义，是现代中文圣经语体中清楚而自然的说法。
- source_word: κρίματος αἰωνίου
  choice: 永远审判
  rationale: 保留“审判”而不缩窄为“定罪”；“永远”表达 αἰωνίου 在末世语境中的持续、终极性质。
- source_word: τε ... τε καὶ
  choice: 、……和……
  rationale: 用现代汉语并列结构自然呈现希腊文各项之间的连接，无须逐一机械对应连接虚词。
theological_decisions:
- issue: βαπτισμῶν 在基础教导清单中的含义
  choice: 译作“各种洁净礼仪”
  alternative: “各种洗礼”或“洗礼”
  rationale: 复数形式及其词汇用法允许、并较倾向于指较广泛的礼仪洗濯。正文采用较宽泛的表达，脚注保留“洗礼”的可能性，不预先采纳特定圣礼解释。
- issue: κρίματος αἰωνίου 的范围
  choice: 译作“永远审判”
  alternative: “永远定罪”
  rationale: 原文是“审判”，并未只说“定罪”；译文保留其范围及神学张力，不额外限定审判结果。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“各种洁净礼仪”比直译“各种洗濯”更易为普通读者理解，同时通过脚注保留“洗礼”的可能译法。
