source:
  edition: SBLGNT
  text: γῆ γὰρ ἡ πιοῦσα τὸν ἐπ’ αὐτῆς ⸂ἐρχόμενον πολλάκις⸃ ὑετόν, καὶ τίκτουσα βοτάνην εὔθετον ἐκείνοις δι’ οὓς καὶ γεωργεῖται, μεταλαμβάνει εὐλογίας ἀπὸ τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/007.yaml
  text: For land that drinks the rain that often comes upon it and produces vegetation useful to those for whose sake it is also cultivated receives blessing from God[a][b].
translation:
  language: zh_hans
  text: 因为土地喝了多次降在其上的雨水，又长出适合那些人使用的植物[a]——这地也是为他们的缘故而耕种的——就从上帝领受福分[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “植物”也可译作“草木”或“作物”。
    reason: lexical_alternative
  - marker: b
    text: “这地也是为他们的缘故而耕种的”也可理解为“由那些耕种这地的人耕种”；但这里的希腊语介词加宾格更自然地表示“为了……的缘故”。
    reason: alternative_reading
lexical_decisions:
- source_word: γῆ
  choice: 土地
  rationale: 农业比喻中指受耕作的一片地；“土地”比“地球”准确，也不像“土壤”那样偏重土质。
- source_word: πιοῦσα
  choice: 喝了
  rationale: 保留原文把土地人格化的鲜明意象；完成体分词在句中描述土地接受雨水。
- source_word: τὸν ἐπ’ αὐτῆς ἐρχόμενον πολλάκις ὑετόν
  choice: 屡次降在上面的雨水
  rationale: 自然表达雨反复临到土地，同时保留 πολλάκις 的频繁意味与 ἐπί 的空间关系。
- source_word: τίκτουσα
  choice: 长出
  rationale: 符合现代汉语描述土地生长植物的习惯，也保留“产生、结出”的生成意味。
- source_word: βοτάνην
  choice: 植物
  rationale: 该词广指草木或地上长出的植物；“植物”自然且不擅自限定为某一种庄稼。
- source_word: εὔθετον
  choice: 适合……使用的
  rationale: 在农业语境中表达植物对相关之人合用、有益，比单用“合适的”更明确。
- source_word: ἐκείνοις δι’ οὓς καὶ γεωργεῖται
  choice: 那些为其缘故而耕种这地之人
  rationale: διά 加宾格通常表示原因或目的，故保留“为了他们的缘故”这一关系，不把它直接改成施事性的“耕种它的人”。
- source_word: γεωργεῖται
  choice: 耕种这地
  rationale: 以汉语主动式嵌入关系结构，但语义仍是“这地为他们的缘故受到耕种”；“耕种”准确对应农业劳作。
- source_word: μεταλαμβάνει
  choice: 领受
  rationale: 在“从上帝”这一搭配中，“领受”自然庄重，表达获得或有分于福分。
- source_word: εὐλογίας ἀπὸ τοῦ θεοῦ
  choice: 从上帝领受福分
  rationale: 不强加数量，保留无冠词表达的概括性；“福分”比动作性的“祝福”更适合土地所得的益处。
theological_decisions:
- issue: 警告语境中的农业比喻
  choice: 按原文直接保留土地、雨水、植物与上帝所赐福分的比喻，不加入有关信徒身份或最终结局的解释。
  alternative: 解释性地译成蒙悦纳的信徒结果子，或借措辞区分真假信徒。
  rationale: 本节只陈述农业类比的正面一面；译文应保留其与上下文之间的神学张力，不替原文裁定有关坚忍或背道的争议。
- issue: δι’ οὓς 的关系
  choice: 译作“为其缘故”，理解为受益者或耕作目的。
  alternative: 译作“被那些耕种它的人”，将 οὓς 理解为耕种行为的施事者。
  rationale: διά 与宾格最自然地表示原因或目的；不过在实际农业情境中，受益者也可能参与耕作，因此以脚注保留另一种理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“喝了”保留土地拟人化的原文意象；“屡次降在上面”保持农业画面的动态感。句式略作汉语化处理，同时避免将 δι’ οὓς 的歧义静默消除。
