revisions:
- from: 因为土地喝了屡次降在上面的雨水，又长出适合那些为其缘故而耕种这地之人使用的植物[a]，就从上帝领受福分[b]。
  to: 因为土地喝了多次降在其上的雨水，又长出适合那些人使用的植物[a]——这地也是为他们的缘故而耕种的——就从上帝领受福分[b]。
  rationale: 修订仅澄清 δι’ οὓς καὶ γεωργεῖται 的关系：正文明确土地受耕种是为了“那些人”，并以脚注保留把这些人理解为耕种者的替代可能。破折号在汉语中将该关系作为对“那些人”的补充说明，既避免冗长的嵌套定语，也不加入任何神学解释。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T03:56:37Z'
