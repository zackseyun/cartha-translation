  text: καὶ παραπεσόντας, πάλιν ἀνακαινίζειν εἰς μετάνοιαν, ἀνασταυροῦντας ἑαυτοῖς τὸν υἱὸν τοῦ θεοῦ καὶ παραδειγματίζοντας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/006.yaml
  text: and having fallen away[a], to renew them again to repentance[b], since they are crucifying again for themselves the Son of God and exposing him to public shame.
translation:
  language: zh_hans
  text: 并且，那些已经背离了的人[a]，就不可能再次使他们更新，以致悔改[b]，因为他们正为自己把上帝的儿子重新钉在十字架上，并公开羞辱他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“背道了”。希腊语动词可指严重的背离。
    reason: lexical_alternative
  - marker: b
    text: 或译：“当他们还在为自己把上帝的儿子重新钉在十字架上，并公开羞辱他的时候。”原文的两个分词既可理解为说明原因，也可理解为同时发生的情形。
    reason: alternative_reading
lexical_decisions:
- source_word: παραπεσόντας
  choice: 离弃了正道的人
  rationale: 该不定过去时分词在本段表示严重的背离。“离弃了正道”传达其严重性，同时不在正文中采用带有后世教义技术色彩的术语。
- source_word: πάλιν ἀνακαινίζειν
  choice: 再次更新
  rationale: πάλιν自然修饰ἀνακαινίζειν，表示恢复到先前状态；“再次更新”保留重复意味和原文用词。
- source_word: εἰς μετάνοιαν
  choice: 而悔改
  rationale: εἰς表示目标或结果；此处译法自然地表达“更新以至悔改”，并保留μετάνοια的悔改含义。
- source_word: ἀνασταυροῦντας
  choice: 正……重钉十字架
  rationale: 现在时分词可表达与更新不能发生同时存在、并可说明其缘由的行为；“正”保留进行性，“重钉”体现ἀνα-的再次意味。
- source_word: ἑαυτοῖς
  choice: 为自己
  rationale: 反身代词与格可表示关联、利害或立场；“为自己”贴近原文，但不额外断定更具体的语义关系。
- source_word: τὸν υἱὸν τοῦ θεοῦ
  choice: 上帝的儿子
  rationale: 直接保留这一基督论称号及其确定性。
- source_word: παραδειγματίζοντας
  choice: 公然羞辱他
  rationale: 该动词表示公开示众，使之蒙羞；“公然羞辱”简洁地保留公开性与羞辱意味。
theological_decisions:
- issue: 本节是否补出上一节的“不可能”
  choice: 补作“就不能”，但仍以“并且”承接前文
  alternative: 不补谓语，仅译作依附前文的片段
  rationale: 希腊文在句法上承接6:4的ἀδύνατον。汉语若完全不补，单节难以成句；“就不能”明确恢复前文已经明说的句法支配关系，而没有添加新的神学断言。
- issue: 背离的性质
  choice: 离弃了正道
  alternative: 背道了；叛教了
  rationale: 译文保持警告的严重性，但不预先裁定此处是否指失去救恩、从未真正相信，或其他特定教义体系所定义的背道。
- issue: 两个现在时分词的逻辑关系
  choice: 正文按解释或原因译作“因为……正……”
  alternative: 按同时情形译作“当他们还在……的时候”
  rationale: 分词很可能说明不能再次更新的缘由，但也可理解为同时发生的情形；脚注保留后一种可能，不把句法歧义静默消除。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“离弃了正道”避免正文使用过强的教义技术术语；“重钉十字架”“公然羞辱”保持原文鲜明而严肃的警告语气。所有脚注标记均置于正文对应位置。
