revisions:
- from: 又尝过上帝话语的美善，也尝过将来世代的能力[a]，
  to: 又尝过上帝美好的话语，以及将来时代的权能[a]，
  rationale: 修订使“美好”直接修饰“话语”，以反映καλὸν修饰ῥῆμα；以“权能”替代“能力”，使中文搭配更自然，并保留δυνάμεις的开放含义；以“将来时代”表达μέλλοντος αἰῶνος。保留句首“又”、从属分词式片段和句末逗号，以维持其与6:4–6长句的连接；不对“尝过”的经历深度作神学性扩展。
