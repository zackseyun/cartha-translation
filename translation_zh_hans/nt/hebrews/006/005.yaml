  text: καὶ καλὸν γευσαμένους θεοῦ ῥῆμα δυνάμεις τε μέλλοντος αἰῶνος,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/005.yaml
  text: and have tasted the good word of God and the powers of the coming age[b][a],
translation:
  language: zh_hans
  text: 又尝过上帝美好的话语，以及将来时代的权能[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “权能”或译“大能的作为”或“神迹”；“将来时代”或译“将要来临的时代”。
    reason: 保留δυνάμεις可指能力的彰显、大能作为或神迹的语义幅度，并呈现μέλλοντος αἰῶνος的自然替代译法。
lexical_decisions:
- source_word: καλὸν
  choice: 美善
  rationale: καλός在这里修饰ῥῆμα，表达其良善、可喜和有益的性质。“美善”在现代中文中庄重自然，也比单用“好”更适合“话语”这一搭配。
- source_word: γευσαμένους
  choice: 尝过
  rationale: 保留γεύομαι的品尝隐喻，并以“过”表达已经有过的经历；不将其扩展为“充分经历”，也不弱化为“略尝一点”。本节承接上文的复数宾格分词结构，因此译文不是独立完整句。
- source_word: θεοῦ ῥῆμα
  choice: 上帝话语
  rationale: ῥῆμα可指所说的话、言语或话语；“上帝话语”自然地表达属格所指的来源或所属，同时保持庄重而易懂。
- source_word: δυνάμεις
  choice: 能力
  rationale: δύναμις复数可指能力、权能的彰显或大能的作为。“能力”保留较宽的语义范围，不直接限定为神迹；中文虽用集合式单数形式，仍可自然涵盖多种能力彰显。
- source_word: τε
  choice: 也
  rationale: τε把“将来世代的能力”与前面的对象相连；因重复动词“尝过”，“也”最符合现代汉语衔接方式。
- source_word: μέλλοντος αἰῶνος
  choice: 将来世代
  rationale: 该属格短语修饰“能力”，指向尚未来临的末世性时代。“将来世代”保留αἰών的时代维度；脚注列出更具动态意味的自然译法。
theological_decisions:
- issue: 警戒经文语境中“尝过”的含义
  choice: 保留“尝过”，不说明其经历是充分还是肤浅
  alternative: 经历过；只是略尝过
  rationale: γεύομαι本身保留品尝隐喻，而希伯来书6:4–6涉及有争议的神学问题。译文不应替文本判定这些人参与或经历的深浅。
- issue: 末世语境中δυνάμεις的范围
  choice: 译作“能力”，并以脚注提示可指“大能的作为”或“神迹”
  alternative: 神迹；大能的作为
  rationale: 该词可能指将来世代已经彰显的神奇作为，也可能更广泛地指能力或权能。正文采用较宽的译法，以保留原文张力。
translation_notes:
  register: 采用现代、庄重且易懂的简体中文。为反映本节在希伯来书6:4–6长句中的从属关系，保留句首“又”和句末逗号；重复“尝过”使两个宾语的关系清晰。正文中的脚注标记[a]与脚注完全对应。
