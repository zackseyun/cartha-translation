id: HEB.6.8
reference: Hebrews 6:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐκφέρουσα δὲ ἀκάνθας καὶ τριβόλους ἀδόκιμος καὶ κατάρας ἐγγύς, ἧς τὸ τέλος εἰς καῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/008.yaml
  text: But if it bears thorns and thistles[a], it is worthless and near to being cursed, and its end is for burning.
translation:
  language: zh_hans
  text: 但若长出荆棘和蒺藜，就毫无用处[a]，离咒诅不远，最终归于焚烧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“被弃绝”。
    reason: ἀδόκιμος 既可在此强调土地毫无用处，也可表达它未获认可、被弃绝。
lexical_decisions:
- source_word: ἐκφέρουσα
  choice: 长出
  rationale: 承接上一节土地的意象，表达土地持续生出植物；“长出”符合现代汉语的农业语境。
- source_word: δὲ
  choice: 但若
  rationale: δὲ 表明与上一节结出有益作物的土地形成对比；结合分句语义，以“但若”自然引出相反情形。
- source_word: ἀκάνθας καὶ τριβόλους
  choice: 荆棘和蒺藜
  rationale: 保留两种带刺杂草并列的农业意象，也是现代中文圣经语体中清楚而庄重的表达。
- source_word: ἀδόκιμος
  choice: 毫无用处
  rationale: 该词表示经检验不合格、不蒙认可；在土地的语境中，“毫无用处”突出其不能产生有益收成，同时将较强的“被弃绝”保留于脚注。
- source_word: κατάρας ἐγγύς
  choice: 离咒诅不远
  rationale: 保留“咒诅”这一名词和“接近”的程度含义，中文又较“临近咒诅”自然；没有把尚未临到的咒诅说成已经发生。
- source_word: ἧς τὸ τέλος
  choice: 最终
  rationale: ἧς 回指上一节所说的土地；中文可省去生硬的“它的结局”，用“最终”自然表达其末了的归宿。
- source_word: εἰς καῦσιν
  choice: 归于焚烧
  rationale: 保留“焚烧”的农业图像以及目的或结果的开放性，不把它明说为地狱或最终定罪。
theological_decisions:
- issue: 是否在本节重新明说主语是“土地”
  choice: 不重复“土地”，以承前省略的主语表达
  alternative: 但长出荆棘和蒺藜的土地……
  rationale: 希腊文阴性分词承接上一节的土地，但本节没有重述该名词；中文在紧接的上下文中省略主语自然，也避免增添原文未重复的词。
- issue: 如何处理 ἀδόκιμος 的审判色彩
  choice: 正文译作“毫无用处”，脚注保留“被弃绝”
  alternative: 被弃绝
  rationale: 农业比喻首先强调土地未能产生有用作物；“被弃绝”则更突出不蒙认可或遭拒绝的含义，故以脚注保存这一真实词义和神学张力。
- issue: 是否把 εἰς καῦσιν 明确解释为末日审判
  choice: 保留“归于焚烧”的图像
  alternative: 最终要受火的审判
  rationale: 原文只说焚烧，并未在本节明确指出地狱或末日火刑；不作进一步教义化解释，以保存比喻本身的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“荆棘和蒺藜”保留经文的农业意象；“离咒诅不远”兼顾自然表达与原文尚处于临近状态的语气；脚注标记紧随其所说明的“毫无用处”。
