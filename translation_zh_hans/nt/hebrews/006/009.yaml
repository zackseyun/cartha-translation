  text: Πεπείσμεθα δὲ περὶ ὑμῶν, ἀγαπητοί, τὰ κρείσσονα καὶ ἐχόμενα σωτηρίας, εἰ καὶ οὕτως λαλοῦμεν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/009.yaml
  text: But we are convinced of better things concerning you[a], beloved—things that belong to salvation—even though we speak in this way.
translation:
  language: zh_hans
  text: 不过，亲爱的，我们深信你们有更好的事，就是与救恩相连的事[a]，尽管我们这样说。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“伴随救恩的事”。
    reason: ἐχόμενα σωτηρίας可表示与救恩相连、属于救恩的事，也可表示伴随救恩的事；原文未明确界定这种关系。
lexical_decisions:
- source_word: Πεπείσμεθα
  choice: 我们深信
  rationale: 完成时表达已经形成并持续有效的确信；“深信”在现代汉语中自然地传达坚定把握。
- source_word: δὲ
  choice: 不过
  rationale: 承接前文严厉的警告并作转折；“不过”既清楚又符合劝勉语气。
- source_word: περὶ ὑμῶν
  choice: 你们
  rationale: 汉语以“深信你们有……”自然表达“对你们所确信的事”，避免生硬直译为“关于你们”。
- source_word: ἀγαπητοί
  choice: 亲爱的弟兄姊妹
  rationale: 表达呼格中的亲爱与群体关系；“弟兄姊妹”使现代汉语称呼完整，也自然涵盖整个受信群体。
- source_word: τὰ κρείσσονα
  choice: 更好的事
  rationale: 保留中性复数实体化形容词的宽泛含义及比较意味，不把它限缩为行为、表现或处境。
- source_word: ἐχόμενα σωτηρίας
  choice: 与救恩相连的事
  rationale: ἐχόμενα加属格表示紧密关联；此译不限定这些事究竟是救恩的证据、伴随现象还是结果。
- source_word: εἰ καὶ
  choice: 尽管
  rationale: 准确表达让步关系，并与主句的转折语气自然衔接。
- source_word: οὕτως
  choice: 这样
  rationale: 回指前文严厉警告的说法或内容，保持原文指代的概括性。
- source_word: λαλοῦμεν
  choice: 我们……说
  rationale: 以普通而直接的现代汉语表达现在时动词，不额外指定说话方式。
theological_decisions:
- issue: 警告语境中ἐχόμενα与σωτηρίας的关系
  choice: 译为“与救恩相连的事”
  alternative: “伴随救恩的事”
  rationale: 原文肯定受众具有与救恩密切相关的现实，却没有明确界定这些事是救恩的证据、结果、伴随现象还是条件；正文保留这一神学张力，脚注列出另一种合理表达。
translation_notes:
  register: 采用现代、庄重而易懂的书信劝勉语体。“更好的事”刻意保持宽泛，不沿用可能被误解为程度或因果关系的“近乎得救”。
