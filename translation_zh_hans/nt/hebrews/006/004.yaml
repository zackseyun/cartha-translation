  text: Ἀδύνατον γὰρ τοὺς ἅπαξ φωτισθέντας γευσαμένους τε τῆς δωρεᾶς τῆς ἐπουρανίου καὶ μετόχους γενηθέντας πνεύματος ἁγίου
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/004.yaml
  text: For it is impossible[a], in the case of those who were once enlightened, and who tasted the heavenly gift, and became partakers of the Holy Spirit[c][b],
translation:
  language: zh_hans
  text: 因为，对那些曾经蒙了光照[a]、尝过天上的恩赐[b]、又成为有分于圣灵的人[c]来说，这是不可能的——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “蒙了光照”可泛指领受属灵的光或教导；也有人更具体地理解为归信或洗礼中的光照。
    reason: alternative_reading
  - marker: b
    text: “尝过”也可译作“经历过”。原词字面意为“品尝”，但可以表示真实经历，并不必然只是浅尝。
    reason: lexical_alternative
  - marker: c
    text: “有分于圣灵”也可译作“分享圣灵”或“参与圣灵”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδύνατον
  choice: 这是不可能的
  rationale: 保留句首谓语形容词的强烈断言；中文以“这是”承接后文尚待补足的内容，并用破折号表明本节句法未完。
- source_word: γὰρ
  choice: 因为
  rationale: 表达对上文的解释关系，符合现代汉语经文语体。
- source_word: ἅπαξ φωτισθέντας
  choice: 曾经蒙了光照
  rationale: “曾经”自然表达ἅπαξ在此的一次既往经历；“蒙了光照”保留被动形式和光照隐喻，不把它限定为归信或受洗。
- source_word: γευσαμένους
  choice: 尝过
  rationale: 保留“品尝”的具体隐喻，同时不排除该动词表示真实经历的延伸义。
- source_word: τῆς δωρεᾶς τῆς ἐπουρανίου
  choice: 天上恩赐
  rationale: 简洁保留恩赐的属天性质，不擅自确定恩赐具体所指。
- source_word: μετόχους γενηθέντας πνεύματος ἁγίου
  choice: 成为有分于圣灵的人
  rationale: “成为”表达进入一种状态；“有分于”准确传达分享、参与之义，并保留原文的神学力度。
theological_decisions:
- issue: “蒙了光照”是否特指归信或洗礼
  choice: 保留宽泛的“蒙了光照”
  alternative: 译作“归信了”或“受洗得了光照”
  rationale: 原文只使用光照的隐喻，没有明确限定为归信或洗礼；宽泛译法保留其真实歧义。
- issue: “尝过”表示浅尝还是实际经历
  choice: 在正文中直译为“尝过”
  alternative: 译作“经历过”或解释为“仅仅浅尝”
  rationale: γεύομαι可以指实际经历，但该词本身并未在此界定经历的程度，不应借翻译解决有关背道与坚忍的争论。
- issue: “有分于圣灵”是否必然表示完全的救恩性内住
  choice: 译为“成为有分于圣灵的人”
  alternative: 强化为“被圣灵重生的人”或弱化为“仅受圣灵影响的人”
  rationale: 原文明确表达参与、分享，却未在本短语中进一步界定这种参与的系统神学性质，因此既不强化也不弱化。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“蒙了光照”“有分于”保留原文意象与神学张力。因希腊文的主要不定式要到后文才出现，本节本身句法悬而未决；中文以破折号标示句子将在下一节继续，避免擅自补入后文内容。
