review_pass:
  verdict: revise
  source_fidelity: 前半句基本准确地表达了人以比自己更大者为凭起誓。后半句虽包含“确认”和“了结争议”两项意思，却将原文中“誓言是……争议的终结、为着确认”的紧密句法关系改写为两种并列功能，稍弱化了“誓言终结争议”的主断言。
  naturalness: “比自己大的”在现代汉语中容易首先理解为体格或尺寸较大；“比自己更大的那一位”较自然地表达原文所指较高者，同时不擅自限定为神或某种权威。“誓言是为着确认而……的终结”可保持庄重且清楚。
  terminology: “人”“指着……起誓”“誓言”“争议”均适合现代标准汉语及本节的庄重语体。“更大”宜优于“大”，以保留比较级并避免尺寸义。“确认”可对应βεβαίωσις。
  issues:
  - severity: medium
    issue: “比自己大的”存在不必要的尺寸义歧义。
    rationale: μείζονος在此为起誓时所援引的较高者；中文“更大者／更大的那一位”更自然地表达比较性的“较大、较高”，又不增加原文未明说的具体身份。
  - severity: medium
    issue: 后半句将原文的主谓结构改为“确认”和“了结争议”两项并列作用。
    rationale: ὁ ὅρκος是“每一争议的终结”，εἰς βεβαίωσιν修饰其确认性的目的或作用。调整语序可更直接保留“誓言是争议的终结”这一主断言。
  revised_text: 人起誓时，都是指着比自己更大的那一位；对他们来说，誓言是为着确认而使一切争议了结的终结。[a]
  revised_footnotes:
