revisions:
- from: 人都是指着比自己大的起誓；对他们来说，誓言具有确认的作用，能了结一切争议。[a]
  to: 人起誓时，都是指着比自己更大的那一位；对他们来说，誓言是为着确认而使一切争议了结的终结。[a]
  rationale: 修订以“更大的那一位”避免“大”可能引起的尺寸义联想，并保留原文单数、未具体指明的较高者。后半句恢复“誓言”作为“一切争议的终结”的中心断言，同时以“为着确认”表达εἰς βεβαίωσιν；不对其法律或神学含义作扩展。原有脚注锚点及其词汇替代说明均予保留。
