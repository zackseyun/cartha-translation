  text: ⸀ἄνθρωποι γὰρ κατὰ τοῦ μείζονος ὀμνύουσιν, καὶ πάσης αὐτοῖς ἀντιλογίας πέρας εἰς βεβαίωσιν ὁ ὅρκος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/016.yaml
  text: For people swear by one greater than themselves[b][a], and for them an oath is the end of every dispute for confirmation.
translation:
  language: zh_hans
  text: 人起誓时，都是指着比自己更大的那一位；对他们来说，誓言是为着确认而使一切争议了结的终结。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “争议”也可译作“异议”或“争辩”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνθρωποι
  choice: 人
  rationale: 这里泛指人类，并非专指男性；“人”在现代汉语中自然地表达这一概括性含义。
- source_word: κατὰ τοῦ μείζονος
  choice: 指着比自己大的
  rationale: κατά加属格用于起誓对象，可译为“指着”；“比自己大的”保留比较级的含义，也不擅自指定具体对象。
- source_word: ὀμνύουσιν
  choice: 起誓
  rationale: 直接表达以更高者为凭据郑重作证的行为，也与后文“誓言”自然衔接。
- source_word: πάσης ... ἀντιλογίας
  choice: 一切争议
  rationale: ἀντιλογία在此指争辩、异议或争议；结合起誓用来解决争端的语境，“争议”最为自然。
- source_word: πέρας
  choice: 了结
  rationale: 原词意为“终点、终结”；译作动词“了结”符合现代汉语表达，同时保留使争议终止的意义。
- source_word: εἰς βεβαίωσιν
  choice: 具有确认的作用
  rationale: εἰς加宾格在此表达目的或结果；这一译法保留“确认、证实”的核心含义，并使句意清楚。
- source_word: ὁ ὅρκος
  choice: 誓言
  rationale: 在一般性陈述中，“誓言”自然地指起誓所作的郑重保证；希腊语冠词不必机械译出。
theological_decisions:
- issue: 格言中对人类的泛指
  choice: 人
  alternative: 男人
  rationale: ἄνθρωποι在这里概括人通常如何起誓，并不限定男性；“人”准确保留其泛指意义。
- issue: 誓言在争议中的功能
  choice: 具有确认的作用，能了结一切争议
  alternative: 誓言就是一切争议的终结，为要确认
  rationale: 希腊文把“终结争议”与“确认”紧密相连，但二者的具体逻辑关系略显浓缩；正文以自然汉语呈现两项相关功能，不把它扩大为特定法律或教义命题。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“指着……起誓”保留圣经语境中以更高者为凭据的表达；后半句适度调整词序，以清楚表达誓言既作确认、又终止争议的功能。
