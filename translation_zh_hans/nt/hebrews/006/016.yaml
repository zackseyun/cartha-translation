    text: “争议”也可译作“异议”或“争辩”。
    reason: lexical_alternative
  revision_rationale: 修订以“更大的那一位”避免“大”可能引起的尺寸义联想，并保留原文单数、未具体指明的较高者。后半句恢复“誓言”作为“一切争议的终结”的中心断言，同时以“为着确认”表达εἰς βεβαίωσιν；不对其法律或神学含义作扩展。原有脚注锚点及其词汇替代说明均予保留。
