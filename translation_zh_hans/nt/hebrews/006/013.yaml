  text: Τῷ γὰρ Ἀβραὰμ ἐπαγγειλάμενος ὁ θεός, ἐπεὶ κατ’ οὐδενὸς εἶχεν μείζονος ὀμόσαι, ὤμοσεν καθ’ ἑαυτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/013.yaml
  text: For when God made the promise to Abraham[a], since he could swear by no one greater, he swore by himself[b],
translation:
  language: zh_hans
  text: 因为上帝向亚伯拉罕作出应许时，没有比自己更大的可供他指着起誓，所以他指着自己起誓，说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γὰρ
  choice: 因为
  rationale: 承接上文并说明理由；汉语以“因为”自然体现解释关系。
- source_word: Τῷ ... Ἀβραὰμ ἐπαγγειλάμενος
  choice: 应许亚伯拉罕时
  rationale: 将不定过去时中间语态分词自然译为时间性从句；与格表明应许的领受者。原文并未明说应许的宾语，因此不补入“那应许”。
- source_word: ἐπεὶ
  choice: 既然
  rationale: 此处引出上帝指着自己起誓的原因，“既然”准确表达因果关系。
- source_word: κατ’ οὐδενὸς ... μείζονος ὀμόσαι
  choice: 没有比自己更大的可以指着起誓
  rationale: 按起誓语境将οὐδενός理解为位格性的“没有谁”；“指着……起誓”是现代汉语中自然且庄重的誓言表达。补出比较基准“自己”，使汉语语义完整，而不增加原文之外的神学内容。
- source_word: ὤμοσεν καθ’ ἑαυτοῦ
  choice: 就指着自己起誓
  rationale: 保留ὀμόσαι与ὤμοσεν的词汇重复，并准确传达κατά在誓言公式中“指着/凭着”的含义。
- source_word: ὤμοσεν
  choice: 起誓说
  rationale: 原句末尾逗号连接下一节所引誓言；加入“说”可自然引出后文直接引语，同时不改变起誓这一核心动作。
theological_decisions:
- issue: 上帝起誓的性质
  choice: 上帝因没有比自己更大的可供指着起誓，便指着自己起誓
  alternative: 上帝无法指着任何更大的存在起誓
  rationale: 译文保留上帝至高无上的含义，却不扩展为本节未直接陈述的系统神学命题。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“指着……起誓”保留圣经誓言语体，又比“凭……发誓”更贴近原文κατά的公式性用法。句末用冒号承接第14节的誓言内容。
