  text: ἐπιθυμοῦμεν δὲ ἕκαστον ὑμῶν τὴν αὐτὴν ἐνδείκνυσθαι σπουδὴν πρὸς τὴν πληροφορίαν τῆς ἐλπίδος ἄχρι τέλους,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/011.yaml
  text: And we desire each one of you to show the same diligence for the full assurance of hope until the end[b][a],
translation:
  language: zh_hans
  text: 但我们切望你们每一个人都显出同样的殷勤，为使你们的盼望有十足的把握[a]，直到最后[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为使你们的盼望有完全的确信。”原文用词可指充分的确定感或十足的把握。
    reason: lexical_alternative
  - marker: b
    text: 或译：“直到终点”或“坚持到底。”原文短语强调持续到终点或完成之时；在句中可与“显出同样的殷勤”或“盼望有十足的把握”相连。
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: ἐπιθυμοῦμεν
  choice: 我们切望
  rationale: 该动词表达强烈而真挚的愿望；“切望”保留牧养劝勉中的恳切语气，又不带不当的欲求色彩。
- source_word: δὲ
  choice: 但
  rationale: δέ在此承接上文的肯定，同时转入进一步的劝勉；“但”自然呈现这种轻微转折，不表示强烈对立。
- source_word: ἕκαστον ὑμῶν
  choice: 你们每个人
  rationale: 清楚保留原文逐一指向群体中每一人的分配意义。
- source_word: τὴν αὐτὴν ἐνδείκνυσθαι σπουδὴν
  choice: 都同样显出殷勤
  rationale: “同样”回指上文已显出的爱心与服事；“显出殷勤”兼顾ἐνδείκνυσθαι的表现、显明之意和σπουδή所含持续认真、热切投入之意。
- source_word: πρὸς τὴν πληροφορίαν τῆς ἐλπίδος
  choice: 使你们对所盼望的有十足的把握
  rationale: πρός表达所趋向的目标；πληροφορία可指充分的确信或把握。此译法符合现代汉语，也保留“盼望”与充分确信之间的紧密关系。
- source_word: ἄχρι τέλους
  choice: 直到最后
  rationale: 该短语表达延续至终点或完成之时；“直到最后”保留其时间延续性，同时不具体限定所指的终点。
theological_decisions:
- issue: “盼望的十足把握”与坚持到底之间的关系
  choice: 译作“使你们对所盼望的有十足的把握，直到最后”，不把这种把握限定为某一套后期教义体系中的主观得救确据。
  alternative: 可理解为完全的内在确信，也可侧重盼望之应许的确定性或最终实现。
  rationale: τῆς ἐλπίδος的属格容许主观确信与盼望本身所具有的确定性相互交叠；译文不排除任何一面。ἄχρι τέλους在结构上也可能强调殷勤持续到底，或把握保持到底，因此正文保留较宽的连接范围，并以脚注说明。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“切望”体现恳切的牧养语气；“殷勤”是当代宗教与一般书面语均可理解的词。“对所盼望的有十足的把握”避免生硬直译，同时以脚注保留πληροφορία的词义幅度和ἄχρι τέλους的句法歧义。
