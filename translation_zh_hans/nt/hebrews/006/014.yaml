  text: λέγων· ⸀Εἰ μὴν εὐλογῶν εὐλογήσω σε καὶ πληθύνων πληθυνῶ σε·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/014.yaml
  text: saying[a], “Surely I will bless you and surely multiply you.”
translation:
  language: zh_hans
  text: 说[a]：“我必定赐福给你，也必定使你增多。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“赐福，我必赐福给你；增多，我必使你增多”，以同根词重复来加强语气，呼应《创世记》22:17。
    reason: 说明原文的强调结构及互文背景。
lexical_decisions:
- source_word: λέγων
  choice: 说
  rationale: 现在分词引出上帝誓言的内容；汉语用“说”直接承接上文，自然简洁。
- source_word: Εἰ μὴν
  choice: 必定
  rationale: 这是誓言中的强烈断言，并非实际条件句；“必定”清楚传达其确定和强调的语气。
- source_word: εὐλογῶν εὐλογήσω
  choice: 我必定赐福给你
  rationale: 分词与限定动词同根重复，承接《创世记》22:17的闪语式强调结构；正文以“必定”表达强调，脚注保留原文形式。
- source_word: σε
  choice: 给你／使你
  rationale: 第二人称单数，指受应许的亚伯拉罕；按两个汉语动词各自自然的配价分别译出。
- source_word: καὶ
  choice: 也
  rationale: 连接两个平行的应许；“也”在现代汉语中能自然体现递进并列。
- source_word: πληθύνων πληθυνῶ σε
  choice: 也必定使你增多
  rationale: 保留“增多”的宽泛含义，不把所增多的内容限定为后裔、人数或产业；以第二个“必定”反映原文两组平行的强调重复。
theological_decisions:
- issue: 亚伯拉罕应许中两组强调结构的译法
  choice: 正文两次使用“必定”，译作“我必定赐福给你，也必定使你增多”
  alternative: 较形式对应地译为“赐福，我必赐福给你；增多，我必使你增多”
  rationale: 原文两组同根词重复都带强调作用。正文采用自然现代汉语，同时以平行的两个“必定”保留两项应许各自的强调；脚注说明原文结构及其与《创世记》22:17的呼应。
- issue: πληθύνω所指对象是否明确化
  choice: 译为“使你增多”，不补出“后裔”
  alternative: 译为“使你的后裔大大增多”或“使你人数众多”
  rationale: 希腊文本仅以“你”为宾语，没有明说后裔。虽然互文背景可使读者联想到后裔，正文不应把这一理解直接写入而消除原文的概括性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“赐福”保留圣经语境中明确而通行的表达；“使你增多”略带典雅色彩，但仍易懂，并避免擅自补明增多的是后裔。脚注标记[a]已置于正文“说”之后。
