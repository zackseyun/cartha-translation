id: HEB.6.12
reference: Hebrews 6:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἵνα μὴ νωθροὶ γένησθε, μιμηταὶ δὲ τῶν διὰ πίστεως καὶ μακροθυμίας κληρονομούντων τὰς ἐπαγγελίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/012.yaml
  text: so that you may not become sluggish[a], but imitators of those who through faith and patience inherit the promises.
translation:
  language: zh_hans
  text: 免得你们变得懈怠，反而要效法那些借着信心[a]和忍耐承受应许的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “信心”也可译为“忠信”或“信靠”。这个希腊词在某些语境中可带有忠信或信赖的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: νωθροὶ
  choice: 迟钝
  rationale: 该词指反应或行动迟缓、懈怠；“迟钝”既承接希伯来书5:11的语境，也避免“懒惰”过度强调道德责备。
- source_word: γένησθε
  choice: 变得
  rationale: 保留γίνομαι在此处进入某种状态的意味，即警告读者不要变成迟钝的人。
- source_word: μιμηταὶ
  choice: 效法
  rationale: 现代汉语用动词“效法”比名词式“作模仿者”自然，同时准确表达以他人为榜样。
- source_word: διὰ πίστεως
  choice: 借着信心
  rationale: διά加属格表示途径或方式；“信心”保留πίστις在此处对神信靠的广度，同时以脚注提示“忠信”的可能语义。
- source_word: μακροθυμίας
  choice: 恒久忍耐
  rationale: μακροθυμία强调长久等候中的耐心；“恒久忍耐”比单用“忍耐”更充分表达时间延续性，又不与ὑπομονή完全等同。
- source_word: κληρονομούντων
  choice: 承受
  rationale: “承受”是中文圣经语体中自然且可懂的继承用语，保留以产业方式取得应许之福的意象；现在分词在此刻画这类人的特征。
- source_word: τὰς ἐπαγγελίας
  choice: 各样应许
  rationale: 原文为复数；“各样应许”自然体现复数，但不把它改写成单数的“所应许的”。
- source_word: ἵνα μὴ
  choice: 免得
  rationale: 简洁自然地表达ἵνα μή与上文劝勉相连的目的或预期结果。
theological_decisions:
- issue: πίστις在劝勉语境中的含义
  choice: 信心
  alternative: 忠信、信靠
  rationale: “信心”保留该词对神的信靠及其较宽泛的神学内涵，不武断限定为人的忠诚表现；脚注保留“忠信”的可能性。
- issue: κληρονομούντων的时间与实现状态
  choice: 承受
  alternative: 正在承受、将要承受
  rationale: 现在分词可描述这群人的典型特征，未必专指某一时间阶段；不加入“已经”或“将要”，以保留应许承受在本段中的时间张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“免得……倒要……”清楚保留原文的否定与转折结构；“恒久忍耐”传达长期等候的含义。脚注标记已在正文“信心”之后出现。
