review_pass:
  verdict: revise
  source_fidelity: Draft accurately preserves the purpose/exhortation structure, the ingressive force of γένησθε, and the means expressed by διὰ πίστεως καὶ μακροθυμίας. However, “各样应许” adds a distributive sense (“all kinds of”) that is not present in the Greek plural τὰς ἐπαγγελίας; “应许” already naturally represents the plural/collective expression in Mandarin.
  naturalness: “免得……反而要……” is clear, modern, and suitably dignified. “懈怠” is more idiomatic in this exhortational context than “迟钝,” which can primarily suggest intellectual dullness in current Mandarin. “忍耐” naturally conveys μακροθυμία here without the somewhat heavy and redundant-sounding “恒久忍耐.”
  terminology: “信心”“效法”“承受”“应许” are appropriate and consistent biblical Mandarin terms. The footnote may retain “忠信” and “信靠” as possible contextual nuances, but should describe the alternative as a possible sense rather than define it too narrowly as “忠诚可靠.”
  issues:
  - severity: medium
    issue: “各样应许” over-specifies τὰς ἐπαγγελίας.
    rationale: The Greek uses a definite plural, “the promises,” but does not say “various kinds of promises.” Removing “各样” preserves the plural/collective referent without adding distributional meaning.
  - severity: low
    issue: “迟钝” is less contextually precise than “懈怠.”
    rationale: νωθρός can mean dull or sluggish, but Hebrews 6:12 contrasts this condition with diligence and imitation. “懈怠” conveys spiritual or practical sluggishness in natural modern Mandarin.
  - severity: low
    issue: “恒久忍耐” is unnecessarily amplified.
    rationale: μακροθυμία denotes patience/longsuffering, but “忍耐” adequately conveys it here. “恒久” is interpretive intensification and makes the phrase less natural.
  revised_text: 免得你们变得懈怠，反而要效法那些借着信心[a]和忍耐承受应许的人。
  revised_footnotes:
  - marker: a
    text: “信心”也可译为“忠信”或“信靠”。这个希腊词在某些语境中可带有忠信或信赖的意思。
    reason: lexical_alternative
  revision_rationale: The revision removes the added distributive force of “各样,” uses more idiomatic exhortational wording for νωθροί, and avoids amplifying μακροθυμία beyond what the source requires. It retains the draft’s faithful structure and its lexical-alternative footnote anchor.
