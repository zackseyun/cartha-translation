revisions:
- from: 免得你们变得迟钝，倒要效法那些借着信心[a]和恒久忍耐承受各样应许的人。
  to: 免得你们变得懈怠，反而要效法那些借着信心[a]和忍耐承受应许的人。
  rationale: The revision removes the added distributive force of “各样,” uses more idiomatic exhortational wording for νωθροί, and avoids amplifying μακροθυμία beyond what the source requires. It retains the draft’s faithful structure and its lexical-alternative footnote anchor.
  reviewer_model: gpt-5.6-terra
