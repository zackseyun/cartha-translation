id: HEB.6.1
reference: Hebrews 6:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Διὸ ἀφέντες τὸν τῆς ἀρχῆς τοῦ Χριστοῦ λόγον ἐπὶ τὴν τελειότητα φερώμεθα, μὴ πάλιν θεμέλιον καταβαλλόμενοι μετανοίας ἀπὸ νεκρῶν ἔργων, καὶ πίστεως ἐπὶ θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/001.yaml
  text: Therefore[a], leaving the elementary message about the Messiah, let us be carried on to maturity, not laying again a foundation of repentance from dead works and of faith toward God[d][c][b],
translation:
  language: zh_hans
  text: 所以，我们既离开有关弥赛亚的初步教导[a]，就让我们被带向成熟[b][c]，不再奠定根基：就是离弃死的行为的悔改，以及对上帝的信心[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “初步教导”也可译作“起初的信息”或“基础教导”。“离开”在这里可理解为不再停留于基础阶段，并非必然指抛弃这些教导。
    reason: lexical_alternative
  - marker: b
    text: “成熟”也可译作“完全”或“完备”。
    reason: lexical_alternative
  - marker: c
    text: 希腊文采用被动语态，直译为“让我们被带向”；也可较通顺地译作“让我们迈向”或“让我们继续前进”。
    reason: grammatical_alternative
  - marker: d
    text: “对上帝的信心”也可译作“信靠上帝”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὸ
  choice: 所以
  rationale: 表明本节的劝勉是从上文推导出的结论；“所以”简洁自然。
- source_word: ἀφέντες
  choice: 既离开
  rationale: 保留不定过去时分词的结构和“离开、放下”的基本含义；上下文所说的是不再停留于根基阶段，而非否定这些教导。
- source_word: τὸν τῆς ἀρχῆς τοῦ Χριστοῦ λόγον
  choice: 有关弥赛亚的初步教导
  rationale: λόγος在此指信息或教导；τῆς ἀρχῆς结合下文“根基”表示起初、基础阶段。Χριστός在此按头衔译作“弥赛亚”。
- source_word: ἐπὶ τὴν τελειότητα
  choice: 向成熟
  rationale: 在基础教导与进一步长进的对比中，τελειότης主要指成熟或完备；“成熟”避免使现代读者误解为绝对无瑕。
- source_word: φερώμεθα
  choice: 让我们被带向
  rationale: 保留希腊文现在时被动虚拟式的语态，不把进展完全表述为人自行推动；中文虽略带源语痕迹，仍清楚可懂。
- source_word: θεμέλιον καταβαλλόμενοι
  choice: 奠定根基
  rationale: 保留建筑隐喻，也是现代汉语中自然庄重的表达。
- source_word: μετανοίας ἀπὸ νεκρῶν ἔργων
  choice: 从死的行为中悔改
  rationale: μετάνοια译作传统且易懂的“悔改”；“死的行为”保留原文隐喻，不径自限定为“导致死亡的行为”或“毫无功效的行为”。
- source_word: πίστεως ἐπὶ θεόν
  choice: 对上帝有信心
  rationale: 保留ἐπί所带的朝向意味，同时采用自然现代汉语；“信靠上帝”也是可行译法。
theological_decisions:
- issue: “离开”初步教导是否表示抛弃有关弥赛亚的信息
  choice: 正文保留“离开”，并由上下文及脚注说明是越过基础阶段继续前进
  alternative: 译作“越过”或“放下”，明确弱化抛弃之意
  rationale: 原文动词确有“离开”之义，而下文“不再奠定根基”表明重点是继续建造，不是 repudiation；正文与脚注共同保留其张力。
- issue: τελειότης指“成熟”还是“完全”
  choice: 成熟
  alternative: 完全；完备
  rationale: 本段对比初步教导与进一步发展，“成熟”最符合劝勉语境；脚注保留“完全、完备”的词义可能。
- issue: φερώμεθα的被动语态是否应改为主动表达
  choice: 让我们被带向
  alternative: 让我们迈向；让我们继续前进
  rationale: 原文明确为被动形式，保留它可避免把属灵进展说成纯由人主动实现，同时不明确指定施动者。
- issue: “死的行为”的确切含义
  choice: 保留原文隐喻“死的行为”
  alternative: 毫无生命的行为；导致死亡的行为
  rationale: 原文可涉及本身无生命、不能带来生命或与死亡相属的行为；不在正文中排除这些可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“弥赛亚”体现Χριστός在此作为头衔的用法；“被带向”刻意保留源语被动语态，“死的行为”则保留原文未完全解释的隐喻。
