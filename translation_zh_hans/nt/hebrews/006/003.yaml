  yaml_path: translation/nt/hebrews/006/003.yaml
  text: And this we will do[a], if indeed God permits.
translation:
  language: zh_hans
  text: 我们也会这样做，只要上帝许可。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“如果上帝准许，我们也会这样做。”原文的条件词带有强调语气。
    reason: 说明 ἐάνπερ 的条件性和强调色彩，并提供自然的语序替代译法。
lexical_decisions:
- source_word: καὶ
  choice: 就
  rationale: 承接上文的劝勉，并与后面的条件句自然衔接；汉语中用“就”表达这种推进关系，比逐字译作“并且”更自然。
- source_word: τοῦτο
  choice: 这样
  rationale: 中性单数指示代词回指上文所说的行动或进程；“这样做”既保留单数指向，也符合现代汉语表达。
- source_word: ποιήσομεν
  choice: 我们会这样做
  rationale: 将 ποιέω 的将来主动直陈语气直接表达为意向性的将来行动，不将其具体化为原文未明说的“继续讲论”。
- source_word: ἐάνπερ
  choice: 只要……确实
  rationale: 既保留条件关系，也以“确实”体现 περ 所带的强调语气；“只要”在汉语中自然，但不应理解为削弱上帝许可这一真实条件。
- source_word: ἐπιτρέπῃ
  choice: 许可
  rationale: 准确表达 ἐπιτρέπω 的“准许、容许”含义，语体庄重而通顺。
- source_word: ὁ θεός
  choice: 上帝
  rationale: 按现代标准普通话采用清楚、通行的神称，不机械对应希腊语冠词。
theological_decisions:
- issue: 人的行动意向与上帝许可之间的条件关系
  choice: 明确表达作者一方“会这样做”的意向，同时将其置于“上帝确实许可”的条件之下。
  alternative: 译作较弱的惯用语“若上帝愿意”，或扩写为带有特定决定论含义的表述。
  rationale: 原文使用带强调的真实条件 ἐάνπερ，并未进一步说明上帝许可的方式或因果范围；译文保留人的意向与上帝主权之间的张力，不作教派化解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“这样做”有意保留回指范围的简洁与一定开放性；正文调整为自然汉语条件句语序，同时以脚注呈现更贴近希腊语语序的译法。
