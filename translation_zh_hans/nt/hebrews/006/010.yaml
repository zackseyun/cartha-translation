  to: 因为上帝不会不公义到忘记你们的工作，以及你们为他的名[a]所显出的爱；这爱表现在你们曾服侍圣徒[b]，如今仍在服侍他们。
  rationale: 修订以“不会不公义到忘记”自然重现原文的否定与不定式结构，删除无原文依据的“竟”。以“这爱表现在”将两个服侍分词与“所显出的爱”明确关联；“曾”与“如今仍在”保留既往行动和持续行动的对照。脚注内容不变，仅将标记移至对应词语之后。
