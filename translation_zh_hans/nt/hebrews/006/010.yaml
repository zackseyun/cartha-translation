  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οὐ γὰρ ἄδικος ὁ θεὸς ἐπιλαθέσθαι τοῦ ἔργου ὑμῶν ⸀καὶ τῆς ἀγάπης ἧς ἐνεδείξασθε εἰς τὸ ὄνομα αὐτοῦ, διακονήσαντες τοῖς ἁγίοις καὶ διακονοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/010.yaml
  text: For God is not unjust so as to forget your work and the love that you showed for his name in having served the saints and in continuing to serve them[a][b][c].
translation:
  language: zh_hans
  text: 因为上帝不会不公义到忘记你们的工作，以及你们为他的名[a]所显出的爱；这爱表现在你们曾服侍圣徒[b]，如今仍在服侍他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为他的名”也可理解为“为了他的名”或“向着他的名”。
    reason: lexical_alternative
  - marker: b
    text: “圣徒”在这里指属上帝的信徒，并非专指后来经封圣的某一类人。
    reason: cultural_note
lexical_decisions:
- source_word: ἄδικος
  choice: 不公义
  rationale: 既保留“与公义相悖”的神学分量，也自然表达上帝不会不公正地忽略信徒所行之事。
- source_word: ἐπιλαθέσθαι
  choice: 忘记
  rationale: 保留该词的直接意义；上下文自然表明，这不是指记忆失误，而是不会不顾、不认可他们的行动。
- source_word: τοῦ ἔργου ὑμῶν
  choice: 你们所做的工
  rationale: ἔργον为单数集合用法，可概括他们的行为和劳苦；“所做的工”在现代中文中清楚而庄重。
- source_word: τῆς ἀγάπης
  choice: 爱
  rationale: 直接对应ἀγάπη，并由后面的服侍说明这种爱有具体行动。
- source_word: ἐνεδείξασθε
  choice: 所显出的
  rationale: 表达将内在的爱以行动显明出来，比单纯“有”更贴近原文。
- source_word: εἰς τὸ ὄνομα αὐτοῦ
  choice: 为他的名
  rationale: 保留“名”这一圣经意象，并让εἰς在此表达以他的名为指向、为其缘故的意思；不把含义过度释义为“荣耀”。
- source_word: διακονήσαντες
  choice: 从前服侍了
  rationale: 以“从前”呈现不定过去分词所指的既往服侍，并与后面的持续行动形成对照。
- source_word: τοῖς ἁγίοις
  choice: 圣徒
  rationale: 保留新约对归属上帝之信徒群体的常用称呼，同时用脚注避免读者误解为后世封圣制度中的特殊人物。
- source_word: διακονοῦντες
  choice: 如今仍在服侍他们
  rationale: 用“仍在”明确现在分词的持续性，并补出自然中文所需的宾语“他们”。
theological_decisions:
- issue: 本节是否宣称人的行为使上帝欠下功德性的报偿
  choice: 照原文陈述上帝按公义不忘记他们的工作与爱，不进一步说明这些行为赚取救恩或使上帝负债。
  alternative: 将本句强化为人的善工本身使上帝有义务给予救恩或奖赏。
  rationale: 原文焦点是上帝并非不义，也不会忘记信徒借服侍显出的爱；经文本身没有在此界定功德、救恩与奖赏之间的完整教义关系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“并非不公义，竟忘记”保留οὐ…ἄδικος…ἐπιλαθέσθαι的论证力度；分号连接爱与其具体表现。用“从前……如今仍……”在自然中文中呈现两个分词的时态体貌对照。所有脚注标记均置于正文。
