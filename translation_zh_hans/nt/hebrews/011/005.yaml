revisions:
- from: 因着信，以诺被迁去，使他不至于见死[a]；人找不到他，因为神把他迁去了。原来，在他被迁去以前，已有见证说他蒙神喜悦。
  to: 因着信，以诺被接去，使他不至于见死[a]；人找不到他，因为神已经把他接去了。原来，在他被接去以前，已有见证证明他蒙神喜悦。
  rationale: 将三处同根的μετατίθημι／μετάθεσις统一译为“接去”，以改善现代普通话自然度，并保持原文对行动方式和目的地的克制。将“已有见证说”微调为“已有见证证明”，使中文搭配更顺畅；其余表达及脚注均保留。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T03:56:36Z'
review_pass:
  verdict: revise
  source_fidelity: 译文整体准确反映了原文的结构与含义：πίστει译为“因着信”，保留本章公式；“不至于见死”恰当表达目的/结果，并保留“见死”这一意象；“人找不到他”没有擅自补出寻找者；末句也保留了见证者未明说的特点。惟“迁去”在现代普通话中通常指迁移到某一地点，且多用于迁居、迁移等语境，作为神对以诺所作行动的表述略显生硬，并可能带来不必要的目的地联想。
  naturalness: “被迁去／把他迁去”不够自然、庄重。改为“被接去／把他接去了”较符合现代中文圣经语体，也同样不说明目的地或具体机制。其余句法通顺；末句以“已有见证证明”表达完成时的既有见证，较“已有见证说”更自然明确。
  terminology: 保留“信”“见死”“神”“蒙神喜悦”等核心表达。“接去”在此是对μετατίθημι及其名词同根重复的统一、克制译法，不采用“接到天上”等解释性措辞。脚注可继续说明“见死”的惯用含义。
  issues:
