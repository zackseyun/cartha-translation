id: HEB.11.5
reference: Hebrews 11:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Πίστει Ἑνὼχ μετετέθη τοῦ μὴ ἰδεῖν θάνατον, καὶ οὐχ ηὑρίσκετο διότι μετέθηκεν αὐτὸν ὁ θεός· πρὸ γὰρ τῆς ⸀μεταθέσεως μεμαρτύρηται εὐαρεστηκέναι τῷ θεῷ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/005.yaml
  text: By faith Enoch was taken away so that he should not see death[a], and he was not found because God had taken him away. For before his being taken away, he had been commended as having pleased God[c][b],
translation:
  language: zh_hans
  text: 因着信，以诺被接去，使他不至于见死[a]；人找不到他，因为神已经把他接去了。原来，在他被接去以前，已有见证证明他蒙神喜悦。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “见死”意为“经历死亡”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πίστει
  choice: 因着信
  rationale: 保留本章反复出现的关键词“信”，并自然表达与以诺被迁去相关的凭借或关联。
- source_word: μετετέθη / μετέθηκεν / μεταθέσεως
  choice: 被迁去／把他迁去
  rationale: 以同一词根保持三处表达的一致性；“迁去”既体现从原处被移走，又不额外说明目的地或具体方式。
- source_word: τοῦ μὴ ἰδεῖν θάνατον
  choice: 使他不至于见死
  rationale: 保留希腊文“见死”的意象，同时用“使……不至于”表达该不定式结构所含的目的或结果。
- source_word: οὐχ ηὑρίσκετο
  choice: 人找不到他
  rationale: 用现代汉语自然表达未能找到他的意思；泛指主语“人”不限定具体寻找者。
- source_word: μεμαρτύρηται
  choice: 已有见证说
  rationale: 保留被动见证的含义以及完成时所表示的先在、持续有效的见证，不把它过度解释为单纯的称赞。
- source_word: εὐαρεστηκέναι τῷ θεῷ
  choice: 他蒙神喜悦
  rationale: 自然表达以诺使神喜悦、为神所悦纳的含义，并与“已有见证说”顺畅衔接。
theological_decisions:
- issue: 以诺被“迁去”的含义
  choice: 译作“被迁去”，不补出目的地或机制
  alternative: 被接到天上／被提升
  rationale: 本节明确说神迁去了以诺，使他不见死，却没有在此说明迁往何处或如何发生；译文不添加经文未明说的细节。
- issue: “见死”的表达
  choice: 正文保留“见死”
  alternative: 经历死亡／死亡
  rationale: 该意象在现代汉语中仍可理解，也保存原文的圣经语言质感；脚注说明其惯用含义。
- issue: μεμαρτύρηται 的见证性质
  choice: “已有见证说”
  alternative: 他已经得到称许／神称许了他
  rationale: 原文没有在这一动词中明说见证者；较形式化的表达避免直接限定为神的称许，同时让后文内容说明见证所指。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“因着信”与希伯来书第11章的篇章公式相配；“迁去”保留原文重复及其克制性，不使用现代汉语中容易误解的“翻译”或过度解释的“接到天上”。标点按中文长句节奏处理。
