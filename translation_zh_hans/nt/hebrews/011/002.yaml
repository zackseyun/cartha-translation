  text: ἐν ταύτῃ γὰρ ἐμαρτυρήθησαν οἱ πρεσβύτεροι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/002.yaml
  text: For by this the elders received approval[a][b][c].
translation:
  language: zh_hans
  text: 因为古人[c]借着这信[b]得到了称许[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“受到了赞许”或“得了美好的见证”。希腊文动词表示得到有利的见证或肯定。
    reason: lexical_alternative
  - marker: b
    text: 即借着信，如上一节所述；也可较宽泛地理解为借着上一节所描述的这一现实。
    reason: cross_reference
  - marker: c
    text: 希腊文也可直译为“年长者”或“长者们”；这里指往昔的人，也就是后文所列举的信仰先辈。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ταύτῃ
  choice: 借着这信
  rationale: ἐν在这里最自然地表示凭借的方式，阴性单数指示代词ταύτῃ与上一节的πίστις（信）相呼应。译为“借着这信”既清楚连接上文，也符合现代汉语表达。
- source_word: γὰρ
  choice: 因为
  rationale: γάρ说明本节是对上一节有关信的陈述所作的解释；“因为”自然保留了这一逻辑关系。
- source_word: ἐμαρτυρήθησαν
  choice: 得到了称许
  rationale: 这是μαρτυρέω的不定过去时被动形式，在本段语境中指获得有利的见证或肯定。“得到了称许”保留被动含义和正面评价，又不在正文中补出希腊文未明说的评价者。
- source_word: οἱ πρεσβύτεροι
  choice: 古人
  rationale: πρεσβύτεροι字面可指“年长者”或“长老”，但此处泛指后文列举的往昔信仰先辈。现代汉语“古人”简洁准确，也避免“长老”所容易引起的教会职分联想。
theological_decisions:
- issue: ταύτῃ的所指
  choice: 在正文中译作“这信”，指向11:1的“信”
  alternative: 指向上一节所描述的整体现实，而不只限于“信”这个词
  rationale: ταύτῃ在性和数上自然对应πίστις，而且全章论述以信为中心。不过脚注说明它也可较宽泛地指上一节所描述的信及其作用，以保留表达可能具有的范围。
- issue: 称许者的身份
  choice: 正文不补出“神”
  alternative: 译作“得到了神的称许”
  rationale: 本章语境最终表明这见证与神有关，但本节希腊文本身没有明说施事者。正文保留被动式，避免将语境推论直接写入经文。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“古人”比“长老们”更符合本节历史性语境；“得到了称许”通顺地表达希腊文被动式，同时不擅自补明评价者。所有脚注标记均置于相应词语之后。
