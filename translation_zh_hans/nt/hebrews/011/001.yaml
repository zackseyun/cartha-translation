reference: Hebrews 11:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ἔστιν δὲ πίστις ἐλπιζομένων ὑπόστασις, πραγμάτων ἔλεγχος οὐ βλεπομένων·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/001.yaml
  text: Faith is the assurance of things hoped for[b][a], the proof of things not seen.
translation:
  language: zh_hans
  text: 信就是所盼望之事的确据[a]，是未看见之事的明证[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “确据”也可译作“实质”“实际”或“确信”。
    reason: lexical_alternative
  - marker: b
    text: “明证”也可译作“证据”或“确信”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστις
  choice: 信
  rationale: 这里指人对上帝及其应许所持的信靠与信心；译作“信”既简洁自然，也与本章反复论述的主题一致。
- source_word: ἐλπιζομένων
  choice: 所盼望之事
  rationale: 这个现在时被动分词在此作名词用，表示盼望所指向的事物；“所盼望之事”自然地保留了它与ὑπόστασις的属格关系。
- source_word: ὑπόστασις
  choice: 确据
  rationale: 该词可表示根基、实质、现实或确信。这里用“确据”兼顾信所带来的笃定和较为客观的根据意味，同时避免把经文直接限定为后来的形而上学命题。
- source_word: πραγμάτων
  choice: 之事
  rationale: πρᾶγμα泛指事情、事物或现实；译作“事”范围宽广，并与前半句形成整齐的平行结构。
- source_word: ἔλεγχος
  choice: 明证
  rationale: 该词可指证明、证据，也可指由证据产生的确信。“明证”保留其证实作用，并与前半句的“确据”相称。
- source_word: οὐ βλεπομένων
  choice: 未看见之事
  rationale: 直译否定的现在时被动分词，表达那些不在当前视觉范围之内的事；“未看见”不额外断定它们永远不可见。
- source_word: δὲ
  choice: 不单独译出
  rationale: δὲ在此主要是轻微承接并引入对“信”的说明。现代汉语直接以“信就是”起句更自然；若硬译为“如今”“但是”或“而”，容易加入原文没有的时间性或强烈转折。
theological_decisions:
- issue: 希伯来书11:1中ὑπόστασις的含义
  choice: 正文译作“确据”
  alternative: “实质”“实际”“确信”
  rationale: 上下文着重说明信如何使人面对所盼望和尚未看见的事。“确据”保留实践性和认知上的笃定，却不排除该词较客观的“实质／现实”含义；这些可能性在脚注中保留。
- issue: πίστις的译法
  choice: “信”
  alternative: “信靠”“信实”
  rationale: 本节没有属格结构等因素要求译成“某人的信实”；本章语境主要是人因上帝的应许而信靠、行动，因此“信”最贴切且不作过度阐释。
- issue: ἔλεγχος偏客观证据还是主观确信
  choice: 正文译作“明证”
  alternative: “证据”“确信”
  rationale: “明证”体现该词的证明和证实力量，但原词也可着重由此产生的内在确信，所以脚注保留另一理解，不把两者的张力消除。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。两个分句以“是”平行衔接，保留原文定义式的凝练结构；“所盼望之事／未看见之事”形成对应。脚注标记均紧随各自存在词义分歧的词语。
