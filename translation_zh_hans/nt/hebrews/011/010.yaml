  text: ἐξεδέχετο γὰρ τὴν τοὺς θεμελίους ἔχουσαν πόλιν, ἧς τεχνίτης καὶ δημιουργὸς ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/010.yaml
  text: For he was waiting for the city that has foundations[b][a], whose architect and builder is God.
translation:
  language: zh_hans
  text: 因为他一直等候有根基的那座城[a]；这城的设计者和建造者[b]是上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“那座有众根基的城”。希腊文“根基”是复数，可能强调这城的稳固和恒久。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“设计师和建造者”或“匠师和建造者”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεδέχετο
  choice: 一直等候
  rationale: 未完成时表达过去持续的期待；“一直等候”在现代汉语中自然地保留了延续和耐心等候的意味。
- source_word: γὰρ
  choice: 因为
  rationale: 表明本节是在解释亚伯拉罕为何凭信心寄居；“因为”清楚呈现与上文的因果、说明关系。
- source_word: τὴν τοὺς θεμελίους ἔχουσαν πόλιν
  choice: 那座有根基的城
  rationale: 保留定指和分词结构的核心含义，不额外把这城明确解释为“天上的城”或“新耶路撒冷”。
- source_word: θεμελίους
  choice: 根基
  rationale: 希腊文为复数，语境中与帐棚的暂时性相对，突出稳固和恒久；现代汉语通常以集合意义的“根基”自然表达。
- source_word: πόλιν
  choice: 城
  rationale: 符合圣经城市意象，也比“城市”更适合本节庄重、凝练的语体。
- source_word: τεχνίτης
  choice: 设计者
  rationale: 该词指有技艺的工匠；与 δημιουργός 并列时，“设计者”凸显构思和规划的一面，同时避免把两个词都译为“建造者”。
- source_word: δημιουργὸς
  choice: 建造者
  rationale: 在“城”的语境中具体呈现实际建造的意象，并与“设计者”形成自然配对。
- source_word: ὁ θεός
  choice: 上帝
  rationale: 作为关系分句的主语，采用现代标准普通话中庄重而通行的称谓。
theological_decisions:
- issue: 所盼望之城的性质
  choice: 译作“那座有根基的城”，不在正文中加上“天上的”或“新耶路撒冷”。
  alternative: 天上的城；有永恒根基的城；新耶路撒冷
  rationale: 本节以“有根基”及上帝是其设计者和建造者来描述这城，却没有在此直接给出更具体的名称；译文保留原文意象和神学张力。
- issue: 上帝与城的双重关系
  choice: 保留“设计者”和“建造者”两个并列称谓。
  alternative: 匠人和创造者；设计者和制造者
  rationale: 两个希腊名词彼此相关但并不相同；分别翻译可保留上帝既构思又成就这城的修辞力度，而不将两者合并。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“一直等候”保留未完成时的持续意味；“那座……的城”体现定指。“城”比“城市”更凝练，也与圣经中的城邑意象相称。脚注标记全部置于正文，并分别紧随相关表达。
