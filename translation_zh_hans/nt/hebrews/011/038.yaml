  text: ὧν οὐκ ἦν ἄξιος ὁ κόσμος ⸀ἐπὶ ἐρημίαις πλανώμενοι καὶ ὄρεσι καὶ σπηλαίοις καὶ ταῖς ὀπαῖς τῆς γῆς·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/038.yaml
  text: —of whom the world was not worthy—wandering in deserts and mountains[b][a], and caves and holes in the ground.
translation:
  language: zh_hans
  text: ——世界配不上这些人——他们在荒野[a]、山岭、洞穴和地洞[b]里漂泊。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“荒凉之地”。
    reason: lexical_alternative
  - marker: b
    text: 直译：“地的孔穴”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν
  choice: 这些人
  rationale: 关系代词属格复数回指上文受苦而忠信的人；汉语用“这些人”明确承接对象，并与“配不上”构成自然表达。
- source_word: οὐκ ἦν ἄξιος ὁ κόσμος
  choice: 世界配不上这些人
  rationale: 保留原文强烈的价值判断；调整为现代汉语自然语序，不把这句话弱化为彼此不相容。
- source_word: κόσμος
  choice: 世界
  rationale: 既可指人类社会，也保留原词较宽的语义范围；上下文使其与遭排斥的忠信者形成对照。
- source_word: ἐπὶ ἐρημίαις
  choice: 在荒野
  rationale: ἐπί加与格在此表示漂泊的地点；“荒野”具体、简洁，同时以脚注保留“荒凉之地”这一较宽译法。
- source_word: πλανώμενοι
  choice: 漂泊
  rationale: 表达四处流动、居无定所的处境，比中性的“游荡”更符合受逼迫和流离的语境。
- source_word: ὄρεσι
  choice: 山岭
  rationale: 自然表达山地环境，也避免“山上”可能暗示只在山顶活动。
- source_word: σπηλαίοις
  choice: 洞穴
  rationale: 准确、通俗地表达天然洞窟。
- source_word: ὀπαῖς τῆς γῆς
  choice: 地洞
  rationale: 以自然现代汉语呈现地里的孔穴或裂口这一具体意象，并用脚注说明较直译的形式。
theological_decisions:
- issue: “世界配不上这些人”的所指和力度
  choice: 保留为对世界或人类社会的道德评判，并与忠信受苦者的价值形成鲜明对照。
  alternative: 理解为忠信者与世界仅仅彼此不相容。
  rationale: 原文ἄξιος是明确的价值用语，不只是社会学意义上的不相容；译文不进一步扩展为本节未明说的教义结论。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。破折号保留原句插入式评语的力量；“漂泊”呈现受逼迫者居无定所的处境。并列地点不重复介词，使汉语流畅，同时不改变希腊文的结构关系。
