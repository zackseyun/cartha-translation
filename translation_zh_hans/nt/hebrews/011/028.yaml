  text: πίστει πεποίηκεν τὸ πάσχα καὶ τὴν πρόσχυσιν τοῦ αἵματος, ἵνα μὴ ὁ ὀλοθρεύων τὰ πρωτότοκα θίγῃ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/028.yaml
  text: By faith he has kept the Passover and the sprinkling of the blood[a], so that the destroyer of the firstborn might not touch them.
translation:
  language: zh_hans
  text: 因着信，他守了逾越节，并洒了血[a]，为的是使那毁灭长子的，不触及他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把血涂上”或“施用血”。希腊语指以礼仪方式施用血；“洒血”是传统的祭礼译法，但就逾越节的情景而言，也可具体理解为把血涂在门框和门楣上。
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: 因着信
  rationale: 工具格与格，表示凭借或缘由；也保留《希伯来书》11章反复出现的句式。
- source_word: πεποίηκεν
  choice: 守了
  rationale: 这里的 ποιέω 指遵行逾越节的礼仪；中文“守逾越节”自然、庄重，也不过度限定为设立或只吃筵席。
- source_word: τὸ πάσχα
  choice: 逾越节
  rationale: πάσχα 可指逾越节庆典、礼仪或筵席；“逾越节”保留其较宽泛的指涉。
- source_word: τὴν πρόσχυσιν τοῦ αἵματος
  choice: 行了洒血的礼
  rationale: πρόσχυσις 指礼仪性地把血施用在某处；“洒血”承接祭礼传统用语，而“行了……的礼”使中文句法自然。出埃及记语境中也可能更具体地理解为“把血涂上”，故列入脚注。
- source_word: ἵνα μὴ
  choice: 为的是使……不
  rationale: 保留目的从句的语义，不只表达结果。
- source_word: ὁ ὀλοθρεύων
  choice: 那毁灭……的
  rationale: 按名词化分词直译为执行毁灭者，避免增添原文没有明说的“天使”。
- source_word: τὰ πρωτότοκα
  choice: 头生者
  rationale: 保留中性复数名词化形容词的宽泛范围，不擅自限定为孩子或男性长子。
- source_word: θίγῃ
  choice: 触碰
  rationale: 保留 θιγγάνω 的基本义“触碰”；在此语境中这种触碰会带来毁灭，但正文不将其解释性改写为“击杀”或“伤害”。
- source_word: αὐτῶν
  choice: 他们
  rationale: 保留原文简洁的代词指称；其所指是上下文中与摩西一同守逾越节的人。
theological_decisions:
- issue: πεποίηκεν 的隐含主语
  choice: 以“他”承接上下文中的摩西
  alternative: 直接写“摩西”
  rationale: 上下文明确谈论摩西，但希腊文此处省略主语；保留代词式表达，避免在正文中补入专名。
- issue: πίστις 的译法
  choice: 信
  alternative: 信靠；忠信
  rationale: 《希伯来书》11章以“信”为贯穿主题，此处表示凭着信而行动；“忠信”会改变重点。
- issue: 毁灭者的身份
  choice: 那毁灭头生者的
  alternative: 灭命的天使
  rationale: 原文只有名词化分词 ὁ ὀλοθρεύων，并未明说其为天使，故不加入这一解释性身份。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“头生者”比“长子”更能保留原文范围；“触碰”刻意保留原词的含蓄与出埃及叙事的呼应。
