  text: ἔσβεσαν δύναμιν πυρός, ἔφυγον στόματα ⸀μαχαίρης, ⸀ἐδυναμώθησαν ἀπὸ ἀσθενείας, ἐγενήθησαν ἰσχυροὶ ἐν πολέμῳ, παρεμβολὰς ἔκλιναν ἀλλοτρίων·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/034.yaml
  text: quenched the power of fire[a], escaped the edge of the sword, were made strong out of weakness, became mighty in battle[b], put foreign armies to flight.
translation:
  language: zh_hans
  text: 熄灭了火的威力，逃脱了刀剑的锋刃，从软弱中得着刚强，在战场上变得强大，使外族的军队溃退。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “军队”原文也可译作“营地”或“军营”；这里指驻营的军事力量。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσβεσαν δύναμιν πυρός
  choice: 熄灭了烈火的威力
  rationale: ἔσβεσαν意为“熄灭”，δύναμιν πυρός直指火的能力或威力；译文保留具体而有力的意象，不简化为“灭了火”。
- source_word: ἔφυγον στόματα μαχαίρης
  choice: 逃过了刀剑的锋刃
  rationale: ἔφυγον在此表示成功脱险；στόματα μαχαίρης字面为“刀剑的口”，是指刀刃的惯用表达，译作“刀剑的锋刃”自然且保留形象。
- source_word: ἐδυναμώθησαν ἀπὸ ἀσθενείας
  choice: 从软弱中得着刚强
  rationale: ἀπό表示由某种状态而出；ἐδυναμώθησαν为被动形式，“得着刚强”既保持受力意味，也避免暗示力量全由自身产生。
- source_word: ἐγενήθησαν ἰσχυροὶ ἐν πολέμῳ
  choice: 在争战中变得勇猛
  rationale: ἐγενήθησαν表示进入某种状态，ἰσχυροί指强有力；“勇猛”符合军事语境，并与前句“刚强”避免机械重复。
- source_word: παρεμβολὰς ἔκλιναν ἀλλοτρίων
  choice: 使外族的军队溃退
  rationale: παρεμβολή本义为营地或军营，在这里借指驻营的军队；ἔκλιναν表示使之转向、退却。“使……溃退”准确传达军事结果。
theological_decisions:
- issue: 信心人物蒙拯救并得胜的历史与军事意象应保留到何种程度
  choice: 保留烈火、刀剑、软弱、争战和外族军队等具体意象，不作属灵化改写
  alternative: 概括为胜过危险和仇敌
  rationale: 本节以一连串具体行动回顾以色列历史中的信心见证；保留原文的物质与军事图景，可避免把经文预先解释成抽象的属灵胜利。
- issue: 被动语态是否明确指出使人刚强者
  choice: 保留“得着刚强”的被动含义，但不补出施事者
  alternative: 译作“神使他们刚强”或“他们变得刚强”
  rationale: ἐδυναμώθησαν是被动式，但本句没有明说施事者；译文不应擅自补出，同时也不应完全抹去被动意味。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。各分句保持原文排比节奏；“熄灭、逃过、得着、变得、使……溃退”呈现连续推进的行动。脚注标记置于相关经文句末。
