  text: νῦν δὲ κρείττονος ὀρέγονται, τοῦτ’ ἔστιν ἐπουρανίου. διὸ οὐκ ἐπαισχύνεται αὐτοὺς ὁ θεὸς θεὸς ἐπικαλεῖσθαι αὐτῶν, ἡτοίμασεν γὰρ αὐτοῖς πόλιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/016.yaml
  text: But as it is[a], they long for a better country—that is, a heavenly one. Therefore God is not ashamed to be called their God, for he has prepared a city for them.
translation:
  language: zh_hans
  text: 但事实上，他们所向往的是一个更好的家乡[a]，就是在天上的家乡。因此，神被称为他们的神，并不以此为耻；因为他已经为他们预备了一座城。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“更好的故土”。原文的形容词为阴性，所修饰的名词在本节省略，很可能指向上下文的“家乡／故土”。
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν δὲ
  choice: 但事实上
  rationale: 这里承接上一节的假设并转入实际情况，主要是逻辑转折，而不只是时间意义上的“如今”。
- source_word: κρείττονος
  choice: 更美的
  rationale: 表示“更好、更优越”；“更美”在本段有关家乡与城的语境中自然庄重，也呼应《希伯来书》反复出现的优越性对比。
- source_word: ὀρέγονται
  choice: 向往
  rationale: 表达热切渴望并追求的意味，比一般的“想要”更能传达其情感和志向。
- source_word: κρείττονος ... ἐπουρανίου
  choice: 一个更美的家乡，就是在天上的
  rationale: 两个阴性属格形容词省略了名词，可由14节的 πατρίδα 补足；译作“家乡”既保持上下文衔接，也保留归属之意。“在天上的”自然表达 ἐπουρανίου，未进一步解释其性质。
- source_word: διὸ
  choice: 因此
  rationale: 明确表示下文是从他们向往天上家乡这一事实推出的结果。
- source_word: οὐκ ἐπαισχύνεται
  choice: 并不……为耻
  rationale: 忠实保留羞耻与尊荣层面的措辞，不弱化为“并不难为情”。
- source_word: θεὸς ἐπικαλεῖσθαι αὐτῶν
  choice: 以被称为他们的神
  rationale: 按称名或身份表述理解，并保留“他们的神”这一关系性公式，不扩写为别的盟约表述。
- source_word: ἡτοίμασεν
  choice: 已经……预备了
  rationale: 不定过去时表示预备这一行动已经完成；“已经”清楚传达其现今相关性。
- source_word: πόλιν
  choice: 一座城
  rationale: 保留具体的末世性城市意象；原文无冠词，译为“一座城”自然恰当。
theological_decisions:
- issue: κρείττονος 与 ἐπουρανίου 所省略的阴性名词
  choice: 依据14节的 πατρίδα 补作“家乡”
  alternative: 补作“国土”，或笼统译作“更好的，就是属天的”
  rationale: 希腊文在本节省略名词，但阴性形式指回近处上下文的 πατρίς。“家乡”准确呈现出生地、故乡或祖国这一语义范围，同时避免把所指缩窄为现代政治国家。
- issue: “他们的神”的关系性表述
  choice: 原样保留“被称为他们的神”
  alternative: 释义为“承认他们是自己的子民”
  rationale: 原文明确说的是神被称为他们的神；虽有盟约背景，却不应把相关含义直接扩写进正文。
- issue: ἐπουρανίου 的性质
  choice: 译作“在天上的”
  alternative: 译作“属天的”
  rationale: 两者皆可，但“在天上的”在此更直接表达家乡的天上定位，同时不额外界定“属天”究竟侧重来源、性质还是领域。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“但事实上”承接15节的反事实条件；“向往”“家乡”“为耻”“预备了一座城”均保持经文的情感力度、关系性和具体意象。无脚注，因此正文不设脚注标记。
