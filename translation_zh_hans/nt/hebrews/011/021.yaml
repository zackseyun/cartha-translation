  text: πίστει Ἰακὼβ ἀποθνῄσκων ἕκαστον τῶν υἱῶν Ἰωσὴφ εὐλόγησεν, καὶ προσεκύνησεν ἐπὶ τὸ ἄκρον τῆς ῥάβδου αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/021.yaml
  text: By faith Jacob[a], as he was dying, blessed each of the sons of Joseph[b], and worshiped while leaning on the top of his staff.
translation:
  language: zh_hans
  text: 雅各因着信，临终时给约瑟的儿子们一一祝福，又倚着自己手杖的顶端敬拜。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 创世记47:31的希伯来文本可译为：“俯伏在床头敬拜。”本节的希腊文本所写的是“杖”。
    reason: textual_variant
  - marker: b
    text: 或译：“朝着自己手杖的顶端敬拜。”这里的短语较可能是在描述雅各敬拜时的姿势，而不是敬拜的对象。
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: 因着信
  rationale: 在《希伯来书》第11章中，该与格以工具或方式意义引出信心人物的行动；“因着信”自然、准确，并与本章重复句式相称。
- source_word: ἀποθνῄσκων
  choice: 临终时
  rationale: 现在分词表示与主要动作同时发生的过程；“临终时”以简洁自然的中文保留时间及濒死语境。
- source_word: ἕκαστον τῶν υἱῶν Ἰωσὴφ
  choice: 给约瑟的两个儿子一一
  rationale: ἕκαστον加部分属格强调逐个祝福；结合创世记背景，约瑟的儿子是两人。“一一”清楚保留分配意义。
- source_word: εὐλόγησεν
  choice: 祝福
  rationale: 这是εὐλογέω在此处的标准译法，保留雅各为后代宣告福分的语境。
- source_word: προσεκύνησεν
  choice: 敬拜
  rationale: 此处表示向上帝所行的宗教性敬拜，不仅是身体俯伏；“敬拜”保留该核心意义。
- source_word: ἐπὶ τὸ ἄκρον τῆς ῥάβδου αὐτοῦ
  choice: 倚着自己的杖头
  rationale: 按本节希腊文本译出“杖”，并将介词短语理解为描述雅各敬拜时的姿势，避免暗示手杖是敬拜对象；脚注保留另一种句法理解及与创世记希伯来文本的差异。
theological_decisions:
- issue: 末句中雅各的敬拜与“杖头”的关系
  choice: 雅各倚着杖头敬拜上帝
  alternative: 雅各朝着杖头敬拜
  rationale: 希腊短语本身容许句法上的不同理解。正文采用自然且较可能的姿势性理解，但以脚注保留“朝着”的可能，避免把未明说的敬拜对象强加进正文。
- issue: 希伯来书希腊文本的“杖”与创世记47:31希伯来文本的“床”
  choice: 正文依希伯来书希腊文本译作“杖”
  alternative: 依创世记47:31的希伯来文本译作“床头”
  rationale: 本节的直接原文证据明确为ῥάβδος（杖），因此正文遵从希腊文本；显著的互文文本差异在脚注中说明，而不在正文中调和。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“因着信”与本章的章法一致；“一一祝福”自然呈现逐个祝福的含义。正文紧随希腊文本，同时通过脚注保留句法歧义和创世记文本传统的差异。
