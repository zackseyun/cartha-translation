  text: Πίστει πλείονα θυσίαν Ἅβελ παρὰ Κάϊν προσήνεγκεν τῷ θεῷ, δι’ ἧς ἐμαρτυρήθη εἶναι δίκαιος, μαρτυροῦντος ἐπὶ τοῖς δώροις αὐτοῦ ⸂τοῦ θεοῦ⸃, καὶ δι’ αὐτῆς ἀποθανὼν ἔτι ⸀λαλεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/004.yaml
  text: By faith Abel offered to God a better sacrifice than Cain[a], through which he was attested as righteous, God testifying concerning his gifts; and through it, though he died[d][c][b], he still speaks.
translation:
  language: zh_hans
  text: 亚伯因着信，向上帝献上了比该隐所献的更美的祭物[a]。借着这祭物，他被证实为义人——上帝为他的供物作了见证；他虽然死了，却仍借着这说话[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“更大的祭物”。这里的比较级既可侧重祭物更好，也可侧重祭物更多或更大。
    reason: lexical_alternative
  - marker: b
    text: “借着这”可能指借着亚伯的信，也可能指借着他的祭物；希腊原文没有完全明确所指。
    reason: alternative_reading
lexical_decisions:
- source_word: Πίστει
  choice: 因着信
  rationale: 工具格表达方式或凭借；“因着信”自然承接《希伯来书》第11章反复出现的信心主题。
- source_word: πλείονα θυσίαν
  choice: 更美的祭物
  rationale: πλείων既可指更优，也可指更多或更大；上下文较可能强调祭物在性质上的优越。“更美”也呼应《希伯来书》中比较优越性的措辞，同时不擅自加入“更蒙悦纳”。
- source_word: παρὰ Κάϊν
  choice: 比该隐
  rationale: παρά与比较级连用，标明比较对象；中文用“比该隐”简洁自然，所比较的是双方所献的祭物。
- source_word: προσήνεγκεν τῷ θεῷ
  choice: 向上帝献上
  rationale: προσφέρω在献祭语境中表示献上祭物；“向上帝献上”保留动作及其对象。
- source_word: δι’ ἧς
  choice: 借着这祭物
  rationale: 阴性关系代词在语法上自然回指阴性名词θυσίαν（祭物），因此在此处明确译出所指。
- source_word: ἐμαρτυρήθη εἶναι δίκαιος
  choice: 他得了自己是义人的见证
  rationale: 保留μαρτυρέω的“见证”意象及被动含义，又避免生硬的中文被动句；δίκαιος译为“义人”。
- source_word: μαρτυροῦντος ἐπὶ τοῖς δώροις αὐτοῦ τοῦ θεοῦ
  choice: 就是上帝为他的供物作了见证
  rationale: 将属格独立结构自然处理为说明性分句；ἐπί取“关于、就……而言”之意，δῶρα在献祭语境中译为“供物”。
- source_word: δι’ αὐτῆς
  choice: 借着这
  rationale: 希腊语阴性代词可能回指“信”，也可能回指“祭物”；中文使用不明确指定名词的“这”，尽量保留原文的歧义。
- source_word: ἀποθανὼν ἔτι λαλεῖ
  choice: 他虽然死了，却……仍旧说话
  rationale: “虽然……却……”呈现死亡与继续说话之间自然的让步对比；“仍旧说话”表达现在时所含的持续效力。
theological_decisions:
- issue: 末句δι’ αὐτῆς所指为何
  choice: 正文译作“借着这”，不明确指定所指
  alternative: “借着信”或“借着这祭物”
  rationale: “信”是全章的主题框架，“祭物”则是较近的阴性先行词；原文并未完全消除两种可能，因此正文保留张力，脚注说明。
- issue: ἐμαρτυρήθη的语力
  choice: 采用“得了……见证”
  alternative: “被称许为”或“被证实为”
  rationale: 本章反复使用见证词汇；保留“见证”可呈现作者的修辞线索，并避免把该词缩窄为单纯的赞许或认可。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“祭物”“供物”“义人”“见证”等词兼顾普通读者的可懂度与本节献祭、见证语汇的连贯性；句式保留原文的论证推进，但适度分句以免中文过度绵长。
