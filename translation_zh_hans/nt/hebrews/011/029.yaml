  text: Πίστει διέβησαν τὴν Ἐρυθρὰν Θάλασσαν ὡς διὰ ξηρᾶς ⸀γῆς, ἧς πεῖραν λαβόντες οἱ Αἰγύπτιοι κατεπόθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/029.yaml
  text: By faith they crossed the Red Sea as through dry land[a], of which the Egyptians, when they attempted it, were swallowed up.
translation:
  language: zh_hans
  text: 他们因着信，过了红海，如同走过干地[a]；埃及人试图也这样过去，却被吞没了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“芦苇海”。本节希腊文作“红海”（Ἐρυθρὰν Θάλασσαν）；但在讨论《出埃及记》所用的希伯来地名时，有人认为其含义是“芦苇海”。
    reason: 说明希腊文本的直接译法，同时保留《出埃及记》底层地名的词义异译。
lexical_decisions:
- source_word: Πίστει
  choice: 因着信
  rationale: 工具或方式与格；承接《希伯来书》11章反复出现的“因着信”句式，既自然又保留本章主题。
- source_word: διέβησαν
  choice: 过了
  rationale: διαβαίνω指从一边越到另一边；“过了”简洁自然，并与过海的语境相合。
- source_word: τὴν Ἐρυθρὰν Θάλασσαν
  choice: 红海
  rationale: 希腊文明确作Ἐρυθρὰν Θάλασσαν，即“红海”；《出埃及记》希伯来地名可能作“芦苇海”的问题另见脚注。
- source_word: ὡς διὰ ξηρᾶς γῆς
  choice: 如同走过干地
  rationale: 保留ὡς的比较意味和διὰ所表达的穿行过程；“干地”也呼应出埃及叙事。
- source_word: ἧς πεῖραν λαβόντες
  choice: 试图也这样过去
  rationale: πεῖραν λαμβάνειν是“尝试”的惯用语；“这样过去”自然地回指以色列人过海的行动，也保留埃及人企图走同一路径的联系。
- source_word: οἱ Αἰγύπτιοι
  choice: 埃及人
  rationale: 按希腊文直译其民族称谓；上下文表明所指是追赶以色列人的埃及军队，但正文不额外明说。
- source_word: κατεπόθησαν
  choice: 被吞没了
  rationale: 保留καταπίνω“吞下、吞没”的鲜明被动意象，不将其简化为较解释性的“淹死了”。
theological_decisions:
- issue: 希伯来书11章中πίστις的译法
  choice: 信
  alternative: 信靠；信实
  rationale: 本章以Πίστει反复引出信心人物，“信”最能维持这一统摄性主题；本节语境强调凭信而行，不宜改译成主要描述品格的“信实”。
- issue: 埃及人被吞没的表述
  choice: 被吞没了
  alternative: 被淹死了；被水淹没了
  rationale: 采用希腊文的生动比喻和被动语态，不额外限定吞没他们的直接媒介；历史情境中的溺亡含义仍由上下文自然显出。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“因着信”维持本章固定句式；后半句用“试图也这样过去”避免生硬照搬希腊文关系代词结构，同时清楚回指同一次过海行动。
