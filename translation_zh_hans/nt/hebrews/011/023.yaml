base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/023.yaml
  text: By faith Moses[a], when he was born, was hidden for three months by his parents, because they saw that the child was beautiful, and they were not afraid of the king’s edict.
translation:
  language: zh_hans
  text: 因着信，摩西出生后被父母藏了三个月，因为他们看见这孩子俊美[a]，也不惧怕王的命令。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “俊美”也可译作“美好”或“出众”；希腊语ἀστεῖον呼应《出埃及记》2:2和《使徒行传》7:20。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πίστει
  choice: 因着信
  rationale: 工具格表达凭借或方式，并承接希伯来书11章反复出现的主题；“因着信”庄重自然。
- source_word: γεννηθεὶς
  choice: 出生后
  rationale: 将不定过去时被动分词自然地处理为时间关系，不增加原文未明说的内容。
- source_word: ἐκρύβη τρίμηνον
  choice: 被……藏了三个月
  rationale: 保留被动态，并以现代汉语自然表达持续的时段。
- source_word: ὑπὸ τῶν πατέρων αὐτοῦ
  choice: 被他的父母
  rationale: πατέρων字面为“父辈/父亲们”，但本语境指摩西的双亲；“父母”准确且符合出埃及记背景。
- source_word: ἀστεῖον
  choice: 俊美
  rationale: 该词可表示外貌可爱、美好或出众；“俊美”保留外貌层面的基本意义，也不排除“非凡、出众”的语义色彩。
- source_word: τὸ διάταγμα τοῦ βασιλέως
  choice: 王的谕令
  rationale: διάταγμα指正式颁布的命令；“谕令”简洁地体现其君王权威与正式性质。
theological_decisions:
- issue: 摩西父母隐藏他的动机
  choice: 保留“看见孩子俊美”与“不惧怕王的谕令”两个并列陈述，并把整件事置于“因着信”之下。
  alternative: 把孩子的俊美解释为特殊的神圣征兆，或把俊美视为唯一动机。
  rationale: 原文没有明确说明孩子的外貌是神迹或启示；译文不强化这种推论，也不削弱信心与不惧怕之间的关联。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“谕令”略带正式色彩，适合君王颁布的命令；句法保留原文先述隐藏、后述原因与无惧的推进。
