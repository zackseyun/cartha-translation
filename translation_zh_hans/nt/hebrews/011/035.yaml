  text: ἔλαβον γυναῖκες ἐξ ἀναστάσεως τοὺς νεκροὺς αὐτῶν· ἄλλοι δὲ ἐτυμπανίσθησαν, οὐ προσδεξάμενοι τὴν ἀπολύτρωσιν, ἵνα κρείττονος ἀναστάσεως τύχωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/035.yaml
  text: Women received back their dead by resurrection[a]; but others were tortured, not accepting release[c][b], so that they might obtain a better resurrection.
translation:
  language: zh_hans
  text: 有些妇女因死人复活，得回了自己死去的亲人；另一些人却遭受酷刑[a]，不肯接受释放[b]，为要得到更美的复活[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “遭受酷刑”所译的希腊语动词与严酷的肉体折磨有关，可能指人在架子或鼓形刑具上被击打；具体施刑方式不能确定。
    reason: cultural_note
  - marker: b
    text: “释放”也可译作“解脱”。这里指从酷刑或死亡中获释，不一定是救恩意义上的“救赎”。
    reason: lexical_alternative
  - marker: c
    text: “更美的复活”与前面死人恢复今世生命形成对照；这里所表达的是超越死亡、更优越的复活盼望。
    reason: cross_reference
lexical_decisions:
- source_word: ἔλαβον
  choice: 得回了
  rationale: 结合“她们的死人”和“因复活”，此处不是单纯“得到”，而是指死去的亲人活过来后被她们重新得回。
- source_word: γυναῖκες
  choice: 有些妇女
  rationale: 原文指女性，并未限定为妻子；加“有些”符合汉语叙述习惯，也与后句“另一些人”自然衔接。
- source_word: ἐξ ἀναστάσεως
  choice: 因死人复活
  rationale: ἐξ 表明来源或原因；这样译既自然，也明确是由于死者复活，她们才得回亲人。
- source_word: τοὺς νεκροὺς αὐτῶν
  choice: 自己死去的亲人
  rationale: 直译为“她们的死人”在现代汉语中生硬；上下文所指是属于她们亲密关系圈、已经死亡的人。“亲人”传达语境含义而不限定具体亲属身份。
- source_word: ἄλλοι δὲ
  choice: 另一些人却
  rationale: δέ 在这里形成鲜明转折：前者经历今生的拯救，后者则没有接受脱离苦难的机会。
- source_word: ἐτυμπανίσθησαν
  choice: 遭受酷刑
  rationale: 该动词表示严重的肉体折磨，可能涉及在刑具上击打，但具体方式不确定；“遭受酷刑”保留核心意义而不作过度具体化。
- source_word: οὐ προσδεξάμενοι
  choice: 不肯接受
  rationale: 分词表达他们拒绝所提供的释放；“不肯”自然体现主动拒绝。
- source_word: τὴν ἀπολύτρωσιν
  choice: 释放
  rationale: 此处指从酷刑或死亡威胁中获释，不必理解为救恩意义上的“救赎”。
- source_word: ἵνα
  choice: 为要
  rationale: 表达目的：他们拒绝获释，是为了得到更美的复活。
- source_word: κρείττονος ἀναστάσεως
  choice: 更美的复活
  rationale: κρείττων 是《希伯来书》中反复使用的比较用语，意为更好、更优越；“更美”既庄重自然，也保留比较意味。
- source_word: τύχωσιν
  choice: 得到
  rationale: 此处意为获得或达到；“得到”与“复活”搭配自然，并保留其目的性。
theological_decisions:
- issue: ἀπολύτρωσιν 在本节中的含义
  choice: 从酷刑或死亡威胁中获释
  alternative: 广义或救恩意义上的救赎
  rationale: 紧接着“遭受酷刑”和“不肯接受”，语境指迫害者可能给予的现实释放；译作“释放”可避免把后来的系统神学含义强加于此。
- issue: “更美的复活”的比较对象
  choice: 指超越今世暂时复生的复活盼望
  alternative: 仅泛指一种较有利的复活，不明确与前半节对比
  rationale: 本节前半先提到死人复活后回到亲人身边，后半则以“却”和“更美”形成对照。译文保留这种末世性张力，脚注说明其语篇对比，但不进一步界定复活的具体机制。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“得回了自己死去的亲人”避免“得着她们的死人”一类生硬直译；分号和“却”突出本节从蒙拯救者转向忠贞受苦者的强烈对照。脚注标记依实际所释词语分别置于“酷刑”“释放”和“更美的复活”之后。
