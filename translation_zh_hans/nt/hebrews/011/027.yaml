  text: πίστει κατέλιπεν Αἴγυπτον, μὴ φοβηθεὶς τὸν θυμὸν τοῦ βασιλέως, τὸν γὰρ ἀόρατον ὡς ὁρῶν ἐκαρτέρησεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/027.yaml
  text: By faith he left Egypt[a], not fearing the king’s anger[b], for he endured as seeing the One who is invisible.
translation:
  language: zh_hans
  text: 因着信，他离开了埃及[a]，不怕王的震怒；因为他如同看见那不可见者[b]一样，坚持到底。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里可能是指摩西因法老而逃离埃及（出2章），也可能是指他带领以色列人出埃及（出12—14章）；希腊文本身没有明确说明是哪一件事。
    reason: cross_reference
  - marker: b
    text: 也可译作“那看不见者”或“那隐而未见者”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: 因着信
  rationale: 工具或方式用法，承接《希伯来书》11章反复出现的表达，说明摩西如此行是出于信。
- source_word: κατέλιπεν Αἴγυπτον
  choice: 他离开了埃及
  rationale: καταλείπω在此自然表示“离开”；不译作“抛弃”，以免加入原文没有的负面意味。
- source_word: μὴ φοβηθεὶς τὸν θυμὸν τοῦ βασιλέως
  choice: 不怕王的震怒
  rationale: 保留否定分词与主句的紧密关系；θυμός指强烈的怒气，“震怒”既体现强度，又符合庄重的叙事语体。
- source_word: τὸν ἀόρατον
  choice: 那不可见者
  rationale: 带冠词的形容词作名词使用，指一位不可见的对象；“者”保留其人格性，同时不额外加入“神”或“主”等原文未明说的称谓。
- source_word: ὡς ὁρῶν
  choice: 如同看见
  rationale: 保留ὡς的比较意味以及“看见不可见者”的悖论张力，不把它弱化为单纯的思想想象。
- source_word: ἐκαρτέρησεν
  choice: 坚忍不拔
  rationale: καρτερέω表示坚定地忍耐、持守；此译文自然表达持续承受压力而不动摇的含义。
theological_decisions:
- issue: “离开埃及”所指的历史事件
  choice: 正文不判定这是摩西在《出埃及记》2章逃离法老，还是在《出埃及记》12—14章带领以色列人出埃及。
  alternative: 明确解释为摩西个人逃亡，或明确解释为带领以色列人出埃及。
  rationale: 希腊文只说“他离开了埃及”，本身没有指明是哪一次离开；正文和脚注保留这一解释空间。
- issue: “那不可见者”的身份表达
  choice: 译作“那不可见者”，让上下文自然指向神，却不在正文中补入称谓。
  alternative: 译作“那看不见的神”或“那不可见的主”。
  rationale: 原文是名词化的形容词，没有明写θεός或κύριος；保留原文凝练而含蓄的表达，也维持“看见不可见者”的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“因着信”保留本章的重复句式；分号呈现行为与原因之间的结构。“那不可见者”略带凝练的经文语体，但现代读者仍可理解，并能保留原文有意形成的悖论。
