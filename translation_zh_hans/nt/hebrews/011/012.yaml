  text: διὸ καὶ ἀφ’ ἑνὸς ἐγεννήθησαν, καὶ ταῦτα νενεκρωμένου, καθὼς τὰ ἄστρα τοῦ οὐρανοῦ τῷ πλήθει καὶ ὡς ἡ ἄμμος ἡ παρὰ τὸ χεῖλος τῆς θαλάσσης ἡ ἀναρίθμητος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/012.yaml
  text: Therefore from one man[a], and this one as good as dead, descendants were born as numerous as the stars of heaven and as the innumerable sand by the seashore.
translation:
  language: zh_hans
  text: 所以，从一人而出；这人仿佛已经死了，却生出了众多子孙，如同天上的星辰那样多，又如同海边不可胜数的沙。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὸ
  choice: 所以
  rationale: 承接上一节关于因信得着生育之力的陈述，表达由此得出的结果，现代汉语自然清楚。
- source_word: ἀφ’ ἑνὸς
  choice: 从一个人
  rationale: 保留原文“从一个”的简洁表达；阳性形式和上下文均指亚伯拉罕。“人”既符合汉语习惯，也不必在正文中重复专名。
- source_word: ἐγεννήθησαν
  choice: 生出了众多的子孙
  rationale: 原文被动复数表示后裔由此产生。汉语用“生出了……子孙”自然表达结果；“众多”根据后面的数量比喻补出，使句法完整。
- source_word: καὶ ταῦτα νενεκρωμένου
  choice: 就是从一个仿佛已经死了的人
  rationale: 此短语语法凝缩，强调亚伯拉罕因年老而生育能力如同已死，并非实际死亡；“仿佛已经死了”保留强烈比喻，同时避免误解。
- source_word: καθὼς τὰ ἄστρα τοῦ οὐρανοῦ τῷ πλήθει
  choice: 如同天上的星那样多
  rationale: 明确表达 τῷ πλήθει 的数量含义，并保留应许语言的比喻。
- source_word: ὡς ἡ ἄμμος ἡ παρὰ τὸ χεῖλος τῆς θαλάσσης ἡ ἀναρίθμητος
  choice: 又如同海边的沙那样不可胜数
  rationale: 将字面的“海的边缘旁”自然译为“海边”，以“不可胜数”对应 ἀναρίθμητος，保留庄重语体。
theological_decisions:
- issue: “从一个”所指为何
  choice: 译作“从一个人”，由上下文指向亚伯拉罕
  alternative: 直译“从一个”；或明确译成“从亚伯拉罕一人”
  rationale: 原文未在本节重复亚伯拉罕的名字，但阳性单数及上下文清楚指他。正文保留“一人”的修辞重点，又不加入原文没有明说的专名。
- issue: νενεκρωμένου 的含义
  choice: 译作“仿佛已经死了”，指因年老而生育能力衰败
  alternative: “已经死了”或“生育能力已经断绝”
  rationale: 实际死亡不合上下文；仅译成“生育能力断绝”虽清楚，却会削弱原文“死”的强烈比喻。所选译法兼顾比喻及语境。
- issue: 子孙众多与应许意象
  choice: 保留天上星辰和海边沙子的双重比喻
  alternative: 概括为“子孙多得不可胜数”
  rationale: 双重意象呼应旧约应许，是本节神学与修辞内容的一部分，不宜压缩。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“竟”体现从一位年老如同已死的人生出无数后裔这一出人意料的结果；句式保留原文由原因推进到双重比喻的结构。
