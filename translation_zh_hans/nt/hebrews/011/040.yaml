  text: τοῦ θεοῦ περὶ ἡμῶν κρεῖττόν τι προβλεψαμένου, ἵνα μὴ χωρὶς ἡμῶν τελειωθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/040.yaml
  text: since God had provided something better for us[b][a], so that they would not be made perfect apart from us.
translation:
  language: zh_hans
  text: 因为神已经为我们预备了更美的事[a]，好叫他们不至于离开我们而被成全[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “预备了”或译“预先看见了”。希腊语可指预先看见，也可含有预先安排的意思；这里的上下文较支持神的预备和安排。
    reason: lexical_alternative
  - marker: b
    text: “被成全”也可译作“达到完全”或“达到终极的完成”。
    reason: alternative_reading
lexical_decisions:
- source_word: προβλεψαμένου
  choice: 已经……预备了
  rationale: 该中间语态分词在本段语境中不只是指预先看见，也可表达神预先作出的安排；“预备”自然传达神为后来信徒所定的旨意与供应，同时以脚注保留“预先看见”的词义可能。
- source_word: κρεῖττόν τι
  choice: 更美的事
  rationale: “更美”延续《希伯来书》中 κρείττων 反复出现的比较主题；“事”自然表达不定代词 τι，又不擅自限定其具体内容。
- source_word: περὶ ἡμῶν
  choice: 为我们
  rationale: 这里结合 προβλεψαμένου，可自然理解为神的预备以“我们”为对象或把“我们”包括在计划之内；“为我们”是简洁、合乎现代汉语的表达。
- source_word: ἵνα μὴ
  choice: 好使……不
  rationale: 保留目的或结果关系，而“好使”在现代庄重书面语中自然。
- source_word: χωρὶς ἡμῶν
  choice: 若没有我们
  rationale: 准确表达“离开我们、没有我们参与”的意思，并凸显他们达到终局并非与后来信徒分开；脚注补充另一种较贴近形式的表达。
- source_word: τελειωθῶσιν
  choice: 达到完全
  rationale: 该被动式兼有“被成全”和“达到终点、完成”的丰富含义。“达到完全”在现代汉语中较自然，同时不把它缩减为单纯的道德完美。
- source_word: τοῦ θεοῦ
  choice: 神
  rationale: 该属格独立结构以“因为神……”引出原因，在汉语中清楚自然。
theological_decisions:
- issue: τελειωθῶσιν 在《希伯来书》救恩历史语境中的含义
  choice: 达到完全
  alternative: 被成全；达到终极的完成
  rationale: 保留“完全”与“完成、抵达终局”之间的神学张力，不将其单纯解释为道德上的无瑕，也不只理解为时间上的完成。
- issue: 信心前人与“我们”共同达到完全的关系
  choice: 好使他们若没有我们，就不能达到完全
  alternative: 好使他们不至于与我们分开而被成全
  rationale: 原文强调他们并不 χωρὶς ἡμῶν 达到完全；译文保留这种群体性和救恩历史上的共同性，不进一步界定其实现机制或时间。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“更美”呼应《希伯来书》的关键词；“达到完全”保留 τελειόω 的完成与完全双重内涵。所有脚注标记均已在正文中出现。
