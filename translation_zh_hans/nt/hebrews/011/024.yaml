  text: πίστει Μωϋσῆς μέγας γενόμενος ἠρνήσατο λέγεσθαι υἱὸς θυγατρὸς Φαραώ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/024.yaml
  text: By faith Moses[a], when he had grown up, refused to be called the son of Pharaoh’s daughter,
translation:
  language: zh_hans
  text: 摩西长大后，因着信[a]，拒绝被称为法老女儿的儿子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“因着信实”或“因着信靠”；希腊文为 πίστει。正文依照本章反复出现的句式译作“因着信”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: 因着信
  rationale: 工具与凭借意义的与格；希伯来书第11章反复使用这一句式，译作“因着信”既准确又形成贯穿全章的庄重表达。
- source_word: Μωϋσῆς
  choice: 摩西
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: μέγας γενόμενος
  choice: 长大后
  rationale: 此分词短语在这里指达到成年，而非获得显赫地位；“长大后”自然地表达其时间关系。
- source_word: ἠρνήσατο
  choice: 拒绝
  rationale: 本词在不定式补语之前表示有意不接受某种称谓或身份，“拒绝”直接贴合语境。
- source_word: λέγεσθαι
  choice: 被称为
  rationale: 保留被动不定式的意义，表达别人赋予摩西的称谓和身份。
- source_word: υἱὸς θυγατρὸς Φαραώ
  choice: 法老女儿的儿子
  rationale: 虽然希腊文没有冠词，此处所指是摩西特定的宫廷身份；中文无需添加量词即可自然表达。
- source_word: Φαραώ
  choice: 法老
  rationale: 采用现代中文通行的埃及君王称号译法。
theological_decisions:
- issue: 希伯来书第11章固定句式中 πίστις 的译法
  choice: 信
  alternative: 信实；信靠
  rationale: 本章反复以 πίστει 引出人物凭信而行的事迹，因此正文采用“因着信”。“信实”在词义上可能，但此处上下文重在行动所凭借的信；“信靠”也可传达其关系与倚赖层面，故在脚注保留这些可能。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。语序以“摩西长大后”为主题起点，更符合自然中文，同时保留原文中信心作为行动凭借的意义。
