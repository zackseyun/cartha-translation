  text: καὶ εἰ μὲν ἐκείνης ⸀μνημονεύουσιν ἀφ’ ἧς ⸀ἐξέβησαν, εἶχον ἂν καιρὸν ἀνακάμψαι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/015.yaml
  text: And if they had been remembering that land from which they had gone out[a], they would have had opportunity to return.
translation:
  language: zh_hans
  text: 他们若一直想着所离开的那地方[a]，就本有机会回去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“那片土地”或“那家乡”。原文指他们先前离开的地上之地。
    reason: lexical_alternative
lexical_decisions:
- source_word: μνημονεύουσιν
  choice: 一直想着
  rationale: 现在时直陈语气用于与事实相反的条件句，在汉语中用“一直想着”自然表达持续挂念、心思仍停留于其上的意思，同时不把它过度解释为怀旧。
- source_word: ἐκείνης
  choice: 那片故土
  rationale: 阴性指示代词承接上文所说的地方；“故土”既具体指他们离开的居住地，也符合寄居与寻求家乡的语境，不带现代政治实体意味。
- source_word: ἀφ’ ἧς ἐξέβησαν
  choice: 自己所离开的
  rationale: 简洁表达从某地出来、离去的来源关系；中文无需机械保留“出去”，而“离开”仍保有实际地点上的迁离含义。
- source_word: εἶχον ἂν
  choice: 就本有
  rationale: 未完成时配合ἄν表示与事实相反的结果；“本有”准确传达原本会具备、实际却未如此利用的反事实语气。
- source_word: καιρὸν
  choice: 机会
  rationale: 此处指可供采取行动的合适时机或可能性，而不只是时间的延续。
- source_word: ἀνακάμψαι
  choice: 回去
  rationale: 自然表达返回先前所离开之地；较“返回”更符合现代汉语叙述，同时保留空间上的回返。
- source_word: καὶ εἰ μὲν
  choice: 若
  rationale: 承接前文并引出条件说明；汉语经文中省去轻微结构性的καί与μέν，可避免生硬，而不损失论证关系。
theological_decisions:
- issue: 所想念之地的性质
  choice: 族长们先前离开的尘世故土
  alternative: 泛指他们从前的生活方式
  rationale: 希伯来书11:13—16的上下文以尘世故土与更美、属天的家乡相对照；译文保留具体的空间语言，不将其寓意化。
translation_notes:
  register: 采用现代、庄重而自然的普通话。“故土”呼应上下文的家乡主题；“本有机会”清楚表达反事实条件。脚注保留“土地／家乡”的词义选择，避免主文将指称范围限定得过窄。
