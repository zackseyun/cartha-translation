  text: Πίστει προσενήνοχεν Ἀβραὰμ τὸν Ἰσαὰκ πειραζόμενος, καὶ τὸν μονογενῆ προσέφερεν ὁ τὰς ἐπαγγελίας ἀναδεξάμενος,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/017.yaml
  text: By faith Abraham[a], when he was being tested, offered up Isaac, and the one who had received the promises was offering up his one and only son,
translation:
  language: zh_hans
  text: 因着信，亚伯拉罕在受考验时把以撒献上；那领受了众应许的，正把自己独一无二的儿子献上[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“独生子”或“独特的儿子”。原词强调独特、独一无二；“独生子”是传统译法。
    reason: 说明μονογενής的词义范围，并避免误解为亚伯拉罕没有其他亲生儿子。
lexical_decisions:
- source_word: Πίστει
  choice: 因着信
  rationale: 工具格与格表示凭借或方式；“因着信”自然承接本章反复出现的信心表述。
- source_word: προσενήνοχεν
  choice: 把……献上
  rationale: 该词为完成时主动直陈式，带有献祭意味；现代汉语用“献上”简洁表达叙事中的行动。
- source_word: πειραζόμενος
  choice: 受考验的时候
  rationale: 保留现在时被动分词的被动和时间处境；“考验”比“试探”更符合此处检验信心的语境。
- source_word: μονογενῆ
  choice: 独一无二的儿子
  rationale: 原词主要突出独特、无可取代的身份；如此既体现以撒作为应许承受者的独特地位，也不误称他为亚伯拉罕唯一的亲生儿子。
- source_word: προσέφερεν
  choice: 当时正要献上
  rationale: 未完成时描绘当时正在展开、但尚未完成的献祭行动；“正要”也符合创世记叙事中行动被制止的情形。
- source_word: ἀναδεξάμενος
  choice: 领受了
  rationale: 表示亚伯拉罕曾接受神所赐的应许；“领受”庄重自然，并与“应许”搭配。
- source_word: ἐπαγγελίας
  choice: 众应许
  rationale: 保留希腊文复数，并以“众”表明亚伯拉罕所领受的一系列应许。
- source_word: καὶ
  choice: ；
  rationale: 以分号体现后半句对前述事件的推进和强调，避免现代汉语中生硬重复“并且”。
theological_decisions:
- issue: 以撒并非亚伯拉罕唯一的亲生儿子，μονογενῆ应如何表达
  choice: 独一无二的儿子
  alternative: 独生子；唯一的儿子
  rationale: 译文突出以撒在应许中的独特地位，却不否认以实玛利的存在，也不把后来的基督论用语预先带入本处。
- issue: 第二个“献上”是否表达已完成的行动
  choice: 当时正要献上
  alternative: 献上了；当时正在献上
  rationale: 未完成时把读者带入献祭行动正在推进的场景；结合创世记中行动最终被制止，“正要献上”避免暗示献祭已经完成，同时保留经文的张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“因着信”维持本章反复句式；后半句保留原文对“领受众应许的人”与“献上独特儿子”之间的强烈张力。
