  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: μᾶλλον ἑλόμενος συγκακουχεῖσθαι τῷ λαῷ τοῦ θεοῦ ἢ πρόσκαιρον ἔχειν ἁμαρτίας ἀπόλαυσιν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/025.yaml
  text: choosing rather to be mistreated with the people of God than to have the temporary enjoyment of sin,[a]
translation:
  language: zh_hans
  text: 他宁可选择与神的子民一同遭受苦待，也不愿享受罪中短暂的快乐。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“罪中转瞬即逝的享乐”。
    reason: 说明πρόσκαιρον可强调稍纵即逝，ἀπόλαυσις也可译作“享乐”。
lexical_decisions:
- source_word: μᾶλλον
  choice: 宁可……也不愿……
  rationale: 以现代汉语常用的取舍结构表达两种选择之间的明确偏向，并与ἢ引出的另一项形成自然对照。
- source_word: ἑλόμενος
  choice: 选择
  rationale: 该词是αἱρέομαι的不定过去时关身分词，承接上文的摩西，突出其主动而审慎的个人抉择；译作“选择”自然清楚。
- source_word: συγκακουχεῖσθαι
  choice: 一同遭受苦待
  rationale: 既保留συν-所表达的共同参与和连带关系，也体现被动遭受恶劣对待的含义，避免将其泛化为一般性的“受苦”。
- source_word: τῷ λαῷ τοῦ θεοῦ
  choice: 与神的子民
  rationale: “神的子民”是自然、庄重且为现代读者熟悉的圣约群体表达；“与”配合“一同”，准确表示共同承受。
- source_word: ἢ
  choice: 也不愿
  rationale: 与前面的“宁可”配合，构成流畅的汉语比较取舍句式。
- source_word: πρόσκαιρον
  choice: 短暂的
  rationale: 表示仅持续一段有限时间；“短暂的”准确清楚，并保留其与持久价值之间隐含的对照。
- source_word: ἔχειν
  choice: 享受
  rationale: 希腊文直译为“拥有”，但其宾语ἀπόλαυσιν本身意为享受或快乐；汉语若译“拥有……享受”生硬，故合译为“享受”，不增添额外含义。
- source_word: ἁμαρτίας
  choice: 罪中
  rationale: 保留享乐与罪之间较宽泛的关联，不具体限定为何种罪；“罪中”在汉语中比“罪的快乐”更自然。
- source_word: ἀπόλαυσιν
  choice: 快乐
  rationale: 表达由某事所得的享受或乐趣；“快乐”与动词“享受”搭配自然，也未将其过度收窄为感官享乐。
theological_decisions:
- issue: 摩西所拒绝的罪中快乐具体指什么
  choice: 宽泛译为“罪中短暂的快乐”，不界定具体罪行
  alternative: 将其具体解释为法老宫廷的特权、享乐或为保有地位而作的妥协
  rationale: 希腊文只将罪所带来的短暂快乐与同神子民一同受苦待相对照，并未说明罪的具体内容；译文因此保留原文的广度和神学张力。
translation_notes:
  register: 采用现代、庄重而通顺的书面汉语。“宁可……也不愿……”清楚呈现取舍关系；“一同遭受苦待”兼顾原文的共同参与与受恶待含义。
