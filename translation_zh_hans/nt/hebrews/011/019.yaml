  text: λογισάμενος ὅτι καὶ ἐκ νεκρῶν ἐγείρειν δυνατὸς ὁ θεός· ὅθεν αὐτὸν καὶ ἐν παραβολῇ ἐκομίσατο.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/019.yaml
  text: having considered that God is able even to raise from the dead[a], from where, in a figure[b], he also received him back.
translation:
  language: zh_hans
  text: 他认定，神甚至能使人从死里复活；因此[a]，他也在比喻的意义上[b]得回了以撒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “因此”也可理解为“由此”或“从那里”；可指向前述从死亡、复活的观念。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“作为一个比喻”或“以比喻的方式”。这表示亚伯拉罕得回以撒与从死里得回相类，并不表示以撒实际经历了复活。
    reason: lexical_alternative
lexical_decisions:
- source_word: λογισάμενος
  choice: 他认定
  rationale: 该不定过去时中动分词表示亚伯拉罕经过内心思量而形成判断。“认定”既包含推理过程所得的结论，也比“计算”“估量”更符合现代汉语语境。
- source_word: καὶ ἐκ νεκρῶν ἐγείρειν
  choice: 甚至能使人从死里复活
  rationale: καί在此有递进强调作用，译作“甚至”；ἐγείρειν与ἐκ νεκρῶν构成复活用语，译作“使人从死里复活”自然且准确。
- source_word: δυνατὸς ὁ θεός
  choice: 神……能
  rationale: 保留原文对神能力的现在性断言，并采用简洁自然的汉语句式。
- source_word: ὅθεν
  choice: 因此
  rationale: 在这里可承接前面的判断，引出亚伯拉罕得回以撒这一结果；同时以脚注保留“从那里”的来源性理解。
- source_word: ἐν παραβολῇ
  choice: 在比喻意义上
  rationale: παραβολή在此表示以撒被得回与从死里复活之间的类比，并非实际发生了复活。“在比喻意义上”保留原文表达方式，也避免直接限定为某种特定预表理论。
- source_word: ἐκομίσατο
  choice: 得回了
  rationale: 中动形式在本语境中表示亚伯拉罕在献祭危机之后重新得到以撒；“得回”简洁传达恢复所得之意。
- source_word: αὐτόν
  choice: 以撒
  rationale: 按上文明确代词所指，以人名代替汉语中可能含混的“他”，使经文独立诵读时清楚易懂。
theological_decisions:
- issue: 以撒被“得回”的性质
  choice: 以撒是在比喻意义上被得回，并非实际经历复活
  alternative: 把ἐν παραβολῇ理解为“作为一个比喻”或侧重预表意义
  rationale: 原文明确用ἐν παραβολῇ限定此事与复活的关系。正文保留“比喻意义”这一开放表达，不进一步规定其预表对象或教义含义。
- issue: ὅθεν与前句的逻辑或来源关系
  choice: 正文译为表示推论的“因此”
  alternative: 译为表示来源的“从那里”，即仿佛从死亡境地得回以撒
  rationale: ὅθεν既可表达“因此”，也可保有“从那里”的来源意味。正文选择现代汉语中较顺畅的逻辑连接，脚注保留另一种真实可能。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“认定”“得回”简洁有力；“在比喻意义上”略带解释性，但准确保留παραβολή在本句中的限定作用。
