  text: ⸀καὶ πάντες μαρτυρηθέντες διὰ τῆς πίστεως οὐκ ἐκομίσαντο τὴν ἐπαγγελίαν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/039.yaml
  text: And all these[a], though commended through faith, did not receive the promise[b],
translation:
  language: zh_hans
  text: 这些人全都因信得了称许[a]，却没有得到那应许[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“得了见证”或“获得认可”。希腊文强调这些人因信而得到有利的见证。
    reason: lexical_alternative
  - marker: b
    text: 或译：“没有获得那应许”。“那应许”也可理解为“所应许的事”，但原文使用单数名词，未在本节具体展开。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ πάντες
  choice: 这些人全都
  rationale: πάντες回指本章前面列举的信心人物；“这些人全都”在现代汉语中自然地表达这一回指关系。καὶ在此承接上文，不另加过强的转折含义。
- source_word: μαρτυρηθέντες
  choice: 得了称许
  rationale: 该词是被动分词，在本章语境中指这些人得到有利的见证或认可。“得了称许”既保留被动含义，也比直译“被作见证”更清楚自然；具体的见证者在原文此处没有明说，因此正文也不补出。
- source_word: διὰ τῆς πίστεως
  choice: 因信
  rationale: διά加属格在这里表示途径或凭借；“因信”简洁、自然，并与希伯来书11章反复出现的信心主题一致。
- source_word: οὐκ ἐκομίσαντο
  choice: 没有得到
  rationale: κομίζω的中间语态在此表示得到或获得所应许之物。“没有得到”是现代汉语中清楚而不过度解释的表达。
- source_word: τὴν ἐπαγγελίαν
  choice: 那应许
  rationale: 保留原文带冠词的单数名词表达，不在正文中扩写为“应许的实现”或具体的产业、福分，以免提前消除上下文保留的神学张力。
theological_decisions:
- issue: “那应许”在上下文中的具体所指
  choice: 正文保留为“那应许”
  alternative: “所应许的事”、“应许的实现”或“所应许的产业／福分”
  rationale: 原文采用紧凑的单数名词，11:40才进一步说明这些古人尚未与后来的人一同达到完全。直译为“那应许”可保留其概括性和末世性的张力，不把某一种解释写进正文。
- issue: 称许的主体
  choice: 不在正文补出“神”
  alternative: “得了神的称许”
  rationale: 从希伯来书11章整体看，称许最终来自神，但本节的被动结构没有明说施事者。正文不补出，可更严格地保存原文形式；注释说明其有利见证的含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“得了称许”延续本章关于信心人物蒙认可的主题；“却”自然体现分词与后半句之间由语境形成的让步关系，而不把καὶ本身解释成强转折。所有脚注标记均已置于正文相应位置。
