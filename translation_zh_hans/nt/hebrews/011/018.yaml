  text: to whom it was said[a], “In Isaac your offspring will be called,”
translation:
  language: zh_hans
  text: 他曾被告知：“从以撒而出的，才要称为你的后裔。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较直译：“你的后裔要在以撒里面被称为。”
    reason: 保留Ἐν Ἰσαὰκ、κληθήσεται、σοι和σπέρμα较贴近字面的对应形式，供读者看见原文结构。
lexical_decisions:
- source_word: πρὸς ὃν ἐλαλήθη
  choice: 他曾被告知
  rationale: 用无人称施事的被动表达对应希腊文的被动式，既自然简洁，也不在正文中明说说话者是谁；关系结构在中文中顺译为承接上文的“他”。
- source_word: Ἐν Ἰσαὰκ
  choice: 从以撒而出的
  rationale: 此处ἐν表达应许后裔藉以撒这一支系得以认定；按现代汉语习惯译为“从以撒而出的”，比直译“在以撒里”清楚，同时不扩展其神学含义。
- source_word: κληθήσεταί σοι σπέρμα
  choice: 才要称为你的后裔
  rationale: κληθήσεται保留“称为”的基本意义；σπέρμα在这里是集合意义，译作“后裔”；σοι按所属或归算关系自然译为“你的”。“才”体现以撒这一支系的限定作用。
theological_decisions:
- issue: 如何表达以撒与亚伯拉罕应许后裔之间的关系
  choice: 从以撒而出的，才要称为你的后裔
  alternative: 你的后裔要在以撒里得名
  rationale: 所选译法表明应许的后裔由以撒这一支系认定，却不进一步界定“称为”是命名、归算还是盟约身份，从而保留原文的语义张力。
- issue: 是否在被动句中明说上帝为说话者
  choice: 不明说施事者
  alternative: 上帝曾对他说
  rationale: 上下文和引文来源可使读者理解其神圣来源，但希腊文本句本身采用被动式；正文不补出“上帝”，更贴近原文表达。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“被告知”保留原文被动表达；引文以自然汉语重组，避免生硬的“在以撒里”，脚注则提供较直译形式。
