  naturalness: 修订后的句子保持庄重、现代的经文语体。“借着上帝的话被建立起来”比“是借着上帝的话构成的”更自然地表达被动完成式所指的既已建立、安排成形；“由可见之物而成”也比“从显现之物而来”更清楚自然。
  terminology: 保留“因着信”“上帝的话”“诸世界”等稳定、易懂的经文用语。脚注说明 αἰῶνες 的“诸世代”字面义及其可指贯穿时间的世界秩序，避免将正文的“诸世界”误读为唯一可能含义。未把经文扩展为“从无创造”。
