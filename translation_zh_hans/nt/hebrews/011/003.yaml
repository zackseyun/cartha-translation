revisions:
- from: 我们因着信明白，诸世代[a]是借着上帝的话构成的，因此，所看见的并不是从显现之物而来的。
  to: 我们因着信明白，诸世界[a]是借着上帝的话被建立起来的，以致所看见的不是由可见之物而成的。
  rationale: 修订主要处理 αἰῶνες 在中文中的可理解性，以及 φαινομένων 与 τὸ βλεπόμενον 的可见性对应。正文采用“诸世界”以避免“诸世代”在中文中被读作人类代际，同时脚注保留原词的时间性和宇宙性。末句仍严格译为否定：所见之物不是由可见之物而成，未正面补出其来源，也未加入“从无创造”的教义措辞。
