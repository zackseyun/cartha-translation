  text: πίστει νοοῦμεν κατηρτίσθαι τοὺς αἰῶνας ῥήματι θεοῦ, εἰς τὸ μὴ ἐκ φαινομένων ⸂τὸ βλεπόμενον⸃ γεγονέναι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/003.yaml
  text: By faith we understand that the ages were framed by the word of God[a], so that what is seen did not come into being from things that are visible.
translation:
  language: zh_hans
  text: 我们因着信明白，诸世界[a]是借着上帝的话被建立起来的，以致所看见的不是由可见之物而成的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “诸世界”也可译作“诸世代”或“宇宙”；希腊语字面为“诸世代”，在这里可指贯穿时间的世界秩序。
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: 因着信
  rationale: 工具或凭借的与格；“因着信”自然地保留本章反复出现的固定句式和信心作为认识途径的含义。
- source_word: νοοῦμεν
  choice: 我们明白
  rationale: 指心智上的领会，而非感官观察；“明白”符合现代汉语表达。
- source_word: κατηρτίσθαι
  choice: 是……构成的
  rationale: 完成时被动不定式表示已经被建立、整合或安排成形；“构成”保留形成与秩序化的含义，又不把词义过度限定为物质创造。
- source_word: τοὺς αἰῶνας
  choice: 诸世代
  rationale: 直译复数 αἰῶνες，并保留其兼具时间历程与世界秩序的广度；脚注说明语境中可指诸世界或宇宙。
- source_word: ῥήματι θεοῦ
  choice: 借着上帝的话
  rationale: 工具与格表示途径；ῥῆμα 可指说出的话，“上帝的话”在现代汉语中自然且没有过度解释。
- source_word: εἰς τὸ μὴ ... γεγονέναι
  choice: 因此……并不是……而来的
  rationale: 以自然汉语表达结果关系，并保留 γίνομαι 所指的产生、出现之意。
- source_word: ἐκ φαινομένων
  choice: 从显现之物
  rationale: φαινομένων 可指显现出来、可见的事物；“显现之物”保留它与后文“所看见的”之间细微的词汇差异。
- source_word: τὸ βλεπόμενον
  choice: 所看见的
  rationale: 将单数中性实体化分词按集合意义处理，泛指整个可见秩序。
theological_decisions:
- issue: αἰῶνες 在创造语境中的范围
  choice: 正文译为“诸世代”，并以脚注注明“诸世界”或“宇宙”等可能含义。
  alternative: 正文直接译为“宇宙”或“诸世界”。
  rationale: 原词不仅可指空间性的世界，也可涵盖时间中的世界秩序；保留直译与脚注可避免不必要地缩窄其范围。
- issue: 本节与“从无创造”的关系
  choice: 只说可见之物不是从显现之物而来。
  alternative: 明确译成上帝“从无中创造”万物。
  rationale: 本句与从无创造的教义相协调，但希腊文本直接断言的是所见之物并非源自显现之物；不在正文中加入更完整的教义表述。
- issue: ἐκ φαινομένων 的句法范围
  choice: 将否定理解为“所看见的并不是从显现之物而来的”。
  alternative: 理解为“所看见的是从不可见之物而来的”。
  rationale: 原文采用否定 μὴ ἐκ φαινομένων，而非正面陈述 ἐξ ἀφανῶν；译文保留这种否定形式及其神学张力。
translation_notes:
  register: 采用庄重而现代的标准普通话。“诸世代”较具经文语体，因此用脚注帮助普通读者把握其宇宙论含义；句末保留“显现之物”与“所看见的”的用词差别，以尽量反映原文 φαινομένων 与 βλεπόμενον 的区别。
