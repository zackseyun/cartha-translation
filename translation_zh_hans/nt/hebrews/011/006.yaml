source:
  edition: SBLGNT
  text: χωρὶς δὲ πίστεως ἀδύνατον εὐαρεστῆσαι, πιστεῦσαι γὰρ δεῖ τὸν προσερχόμενον τῷ θεῷ ὅτι ἔστιν καὶ τοῖς ἐκζητοῦσιν αὐτὸν μισθαποδότης γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/006.yaml
  text: And without faith it is impossible to please him[c][b][a], for the one who comes to God must believe that he exists and that he is a rewarder of those who diligently seek him.
translation:
  language: zh_hans
  text: 没有信心，就不可能蒙上帝喜悦[a]；因为来到上帝面前的人必须相信他存在[b]，并且相信他必奖赏那些恳切寻求他的人[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “信心”也可译作“信靠”。本节随后的“相信”表明，这里着重指人相信并信靠上帝。
    reason: lexical_alternative
  - marker: b
    text: 或译：“他是。”希腊文的表达十分简洁。
    reason: lexical_alternative
  - marker: c
    text: 希腊文直译可作：“他成为奖赏者”；在此语境中也可译为：“他是奖赏者”或“他显明自己是奖赏者”。
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς δὲ πίστεως
  choice: 然而，人没有信心
  rationale: χωρίς表示“没有、离开”，δέ是较弱的承接或转折词。用“然而”承接上文并突出必要条件；补出“人”使现代汉语句式自然。πίστις在本节由πιστεῦσαι进一步说明，主要指对上帝的信靠。
- source_word: ἀδύνατον εὐαρεστῆσαι
  choice: 就不可能蒙上帝喜悦
  rationale: 保留“不可能”的绝对力度。εὐαρεστέω可指“使……喜悦、讨……喜悦”；中文“蒙上帝喜悦”自然表达成为上帝所喜悦的人。原文未明说宾语，但上下文清楚指上帝。
- source_word: πιστεῦσαι γὰρ δεῖ
  choice: 因为……必须相信
  rationale: γάρ说明理由，δεῖ表达必要性；“必须相信”准确保留其语气。
- source_word: τὸν προσερχόμενον τῷ θεῷ
  choice: 到上帝面前来的人
  rationale: προσέρχομαι表示接近、来到跟前；此处既可含敬拜性的亲近，也有一般关系性的趋近。“到上帝面前来”保留空间隐喻而不过度限定为礼仪行为。
- source_word: ὅτι ἔστιν
  choice: 他存在
  rationale: 简洁表达希腊文对上帝实在性的肯定；脚注保留更贴近字面的“他是”。
- source_word: τοῖς ἐκζητοῦσιν αὐτὸν
  choice: 那些恳切寻求他的人
  rationale: ἐκζητέω比普通的“寻找”语气更强，“恳切寻求”体现持续、认真寻求的意味。
- source_word: μισθαποδότης γίνεται
  choice: 他必奖赏
  rationale: μισθαποδότης指给予报偿者；γίνεται在此描述寻求者实际发现上帝如何待他们。译为“必奖赏”在中文中自然，也保留应许性的结果；脚注说明其更形式对应的表达。
theological_decisions:
- issue: πίστις在本节的含义
  choice: 信心
  alternative: 信靠；忠信
  rationale: 紧接的πιστεῦσαι表明焦点是相信并信靠上帝，而非主要描述人的忠信。“信心”是中文圣经语域中自然且不限定宗派的表达，脚注保留“信靠”。
- issue: εὐαρεστῆσαι未明说的宾语
  choice: 蒙上帝喜悦
  alternative: 讨他喜悦；成为可喜悦的
  rationale: 上下文中的趋近对象是上帝，因此明确宾语不会改变指向，并能避免中文代词含混。
- issue: γίνεται用于上帝是奖赏者
  choice: 必奖赏
  alternative: 是奖赏者；显明自己是奖赏者；成为奖赏者
  rationale: 不把γίνεται解释成上帝本性发生改变，而将其理解为上帝对恳切寻求者显为并实际成为施行奖赏的那一位。“必奖赏”自然表达这种关系性和结果性，同时以脚注保存原文形式上的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“蒙上帝喜悦”保持经文语体但仍为当代读者熟悉；“恳切寻求”传达ἐκζητέω的加强语气。脚注标记按相关词句依次放置，避免英文咨询层中标记倒序造成的混乱。
