source:
  edition: SBLGNT
  text: Καὶ τί ἔτι λέγω; ἐπιλείψει ⸂με γὰρ⸃ διηγούμενον ὁ χρόνος περὶ Γεδεών, Βαράκ, ⸀Σαμψών, Ἰεφθάε, Δαυίδ τε καὶ Σαμουὴλ καὶ τῶν προφητῶν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/032.yaml
  text: And what more shall I say? For time would fail me if I were telling about Gideon[a], Barak, Samson, Jephthah, David, and also Samuel and the prophets,
translation:
  language: zh_hans
  text: 我还要说什么呢？因为若要讲述基甸、巴拉、参孙、耶弗他、大卫，以及撒母耳和众先知，时间就不够了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较直译：“因为我在讲述……时，时间将会不够。”
    reason: 说明原文将来时和表示持续讲述情状的分词结构；正文采用自然的现代汉语条件句。
lexical_decisions:
- source_word: Καὶ τί ἔτι λέγω;
  choice: 我还要说什么呢？
  rationale: 这是承接上文并引出更多例子的反问；译文保留了反问语气和继续列举的推动力。
- source_word: ἐπιλείψει με γὰρ διηγούμενον ὁ χρόνος
  choice: 若要一一讲述……时间就不够了
  rationale: ἐπιλείψει 是将来时，但在这一修辞性语境中表达继续详述所受的时间限制；διηγούμενον 表示持续讲述的情形。“若要一一讲述”以自然汉语传达这种未尽列举的意味，而不把它误解成作者当下完全没有时间。
- source_word: περὶ
  choice: 讲述
  rationale: περί 与属格人名一起标明叙述的对象；汉语中“讲述某人”已能自然表达“讲述关于某人的事”。
- source_word: Γεδεών, Βαράκ, Σαμψών, Ἰεφθάε, Δαυίδ, Σαμουὴλ
  choice: 基甸、巴拉、参孙、耶弗他、大卫、撒母耳
  rationale: 采用现代中文圣经读者熟悉且通行的人名译法。
- source_word: Δαυίδ τε καὶ Σαμουὴλ καὶ τῶν προφητῶν
  choice: 大卫，以及撒母耳和众先知
  rationale: “以及”体现 τε καί 的附加衔接意味，同时使撒母耳与后面的“众先知”在句法上保持可辨，不额外界定二者的关系。
- source_word: τῶν προφητῶν
  choice: 众先知
  rationale: 用“众”自然表达带冠词的复数群体，指作为一类的先知人物。
theological_decisions:
- issue: 时间不够这一说法的修辞性质
  choice: 译作条件式的“若要……时间就不够了”
  alternative: 较直译地译作“因为我若讲述，时间将会不够”
  rationale: 希腊文以将来时配合分词，修辞性地说明作者为何不再详述；条件式汉语保留其缩略论述的功能，并未添加作者绝对没有时间的含义。
- issue: 末尾人物的排列与分组
  choice: “大卫，以及撒母耳和众先知”
  alternative: “大卫、撒母耳和众先知”
  rationale: 这样既保留 τε καί 的轻微附加意味，也不把撒母耳直接等同于或排除于“众先知”，从而避免消解原文可保留的关系张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“一一讲述”适度体现 διηγούμενον 的持续叙述意味；句中人名沿用简体中文通行译名。
