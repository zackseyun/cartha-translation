  source_fidelity: 译文准确呈现原文的主要句法与语义：πίστει译为“因着信”；χρηματισθεὶς保留了领受警示而未在正文补出施事者；“尚未看见之事”“心存敬畏”“造了一只方舟，使他全家得救”均与原文相符。将δι’ ἧς译为“借着这方舟”符合阴性关系代词就近回指κιβωτός的最自然读法，且脚注保留其他理解。κατέκρινεν τὸν κόσμον译为“定了世人的罪”在中文中自然表达对世人的定罪；末句也保留了“按/依据…信”的限定与“义”的继承意象。
