id: HEB.11.7
reference: Hebrews 11:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: πίστει χρηματισθεὶς Νῶε περὶ τῶν μηδέπω βλεπομένων εὐλαβηθεὶς κατεσκεύασεν κιβωτὸν εἰς σωτηρίαν τοῦ οἴκου αὐτοῦ, δι’ ἧς κατέκρινεν τὸν κόσμον, καὶ τῆς κατὰ πίστιν δικαιοσύνης ἐγένετο κληρονόμος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/007.yaml
  text: By faith Noah[a], having been warned about things not yet seen, in reverent fear constructed an ark for the salvation of his household[d][c][b], through which he condemned the world and became heir of the righteousness according to faith.
translation:
  language: zh_hans
  text: 因着信，挪亚领受了关于尚未看见之事的警示[a]，就心存敬畏[b]，造了一只方舟，使他全家得救。借着这方舟[c]，他定了世人的罪，并且成了承受那依据信而有之义的人[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “领受了……警示”也可译作“领受了神的指示”或“蒙了神的警告”。原文所用动词常指领受来自神的信息，但这里没有明说施事者。
    reason: lexical_alternative
  - marker: b
    text: “心存敬畏”也可译作“因敬畏而警醒”或“怀着虔敬的畏惧”。
    reason: lexical_alternative
  - marker: c
    text: “借着这方舟”按语法最自然地回指方舟；也有人把它较宽泛地理解为借着挪亚的信，或他出于信的顺服行动。
    reason: alternative_reading
  - marker: d
    text: “义”也可表达为“公义”。“依据信而有”保留了原文“按照信”的结构，没有进一步界定这里所说的义如何与信相关。
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: 因着信
  rationale: 句首工具与原因色彩兼具的与格，也呼应希伯来书11章反复出现的句式；“因着信”自然且保留信心作为行动依据的含义。
- source_word: χρηματισθεὶς
  choice: 领受了……警示
  rationale: 该被动分词表示领受神圣传达或警告。正文不直接补出希腊文未明说的“神”，但“领受警示”保留了外来启示的语感。
- source_word: περὶ τῶν μηδέπω βλεπομένων
  choice: 关于尚未看见之事
  rationale: 保留μηδέπω“尚未”的时间意味，也不把所指限定为洪水或审判。
- source_word: εὐλαβηθεὶς
  choice: 心存敬畏
  rationale: 表达因所领受的警示而产生的虔敬、慎重回应，不弱化为一般害怕。
- source_word: κατεσκεύασεν
  choice: 造了
  rationale: 在方舟语境中，“造”比“预备”更具体，又比“建造”更简洁自然。
- source_word: κιβωτὸν
  choice: 一只方舟
  rationale: 挪亚叙事中的固定、清楚对应词。
- source_word: εἰς σωτηρίαν τοῦ οἴκου αὐτοῦ
  choice: 使他全家得救
  rationale: σωτηρία在此首先指从洪水中获救；“全家”自然表达οἶκος所指的家户，且“得救”保留救恩词汇的分量。
- source_word: δι’ ἧς
  choice: 借着这方舟
  rationale: 阴性关系代词最自然地回指阴性名词κιβωτός；明示“这方舟”使中文指代清楚，同时以脚注保留较宽泛的理解。
- source_word: κατέκρινεν τὸν κόσμον
  choice: 他定了世人的罪
  rationale: κόσμος在此指与挪亚信从形成对照的人类世界；“世人”比抽象的“世界”更符合中文定罪对象的表达。
- source_word: τῆς κατὰ πίστιν δικαιοσύνης
  choice: 那依据信而有之义
  rationale: 尽量保留κατά与πίστις的关系，不简化为可能带入特定教义框架的“因信称义”；“义”承载δικαιοσύνη在此的关系与地位含义。
- source_word: ἐγένετο κληρονόμος
  choice: 成了承受……的人
  rationale: 中文以“承受……的人”自然表达成为继承者、承受者的身份。
theological_decisions:
- issue: χρηματισθεὶς是否在正文中补明神为来源
  choice: 正文译为“领受了……警示”，不补“神”
  alternative: “蒙神警示”或“领受了神的指示”
  rationale: 该动词在此很可能含神圣来源，但希腊文没有明说施事者；正文保留含蓄表达，脚注说明其神圣传达含义。
- issue: εὐλαβηθεὶς的情感与宗教意味
  choice: 心存敬畏
  alternative: 因惧怕而警醒；虔敬地回应
  rationale: 该词不只是恐惧，也包含面对神圣警示时审慎、虔敬的回应；“心存敬畏”兼顾两面。
- issue: δι’ ἧς的先行词
  choice: 这方舟
  alternative: 挪亚的信，或他出于信的顺服行动
  rationale: 关系代词为阴性，最自然回指同为阴性的κιβωτός；但论述中心是信，因而脚注保留较宽泛理解。
- issue: δικαιοσύνη的译法与信的关系
  choice: 那依据信而有之义
  alternative: 因信而有的义；合乎正义的地位
  rationale: “依据信”较贴近κατὰ πίστιν，并避免过早把短语化约为某一系统神学公式；“义”比“公义”在“承受”结构中更自然，也保留关系性与法庭性张力。
- issue: “借着方舟定世人的罪”的意义
  choice: 保留直接陈述，不解释定罪机制
  alternative: 借着造方舟的顺服显明世人当受定罪
  rationale: 原文直接说挪亚借此定了世界的罪，却未明确说明是见证、对比还是审判工具；正文不替作者消解这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“因着信”与全章反复句式相协调；“全家得救”自然传达家户获救；在“依据信而有之义”处略保留书面感，以承载原文紧凑且神学含量较高的表达。所有脚注标记均置于相关正文之后。
