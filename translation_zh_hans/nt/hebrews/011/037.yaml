  text: ἐλιθάσθησαν, ⸀ἐπρίσθησαν, ἐν φόνῳ ⸀μαχαίρης ἀπέθανον, περιῆλθον ἐν μηλωταῖς, ἐν αἰγείοις δέρμασιν, ὑστερούμενοι, θλιβόμενοι, κακουχούμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/037.yaml
  text: They were stoned[a], they were sawn in two, they died by the sword; they went about in sheepskins, in goatskins, destitute, afflicted, mistreated—
translation:
  language: zh_hans
  text: 他们被人用石头打，被锯成两半，惨死在刀剑之下[a]；他们身披羊皮、山羊皮，四处奔走，穷乏，受压迫，遭虐待——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“死在刀剑之下。”原文含有“杀戮”（φόνος）一词，强化了这里的暴力意味。
    reason: 说明ἐν φόνῳ μαχαίρης的较简洁译法及正文保留的语气强度。
lexical_decisions:
- source_word: ἐλιθάσθησαν
  choice: 被石头砸
  rationale: 准确表达 λιθάζω 的被动含义，同时不擅自补入“打死”；“砸”比“投石”更符合现代汉语。
- source_word: ἐπρίσθησαν
  choice: 被锯成两半
  rationale: πρίζω 意为用锯锯开；在殉道苦难的语境中，“锯成两半”自然、明确。
- source_word: ἐν φόνῳ μαχαίρης ἀπέθανον
  choice: 惨死在刀剑之下
  rationale: “死在刀剑之下”自然表达 ἀπέθανον 与 μαχαίρης，而“惨”传达 φόνος 所强化的残杀、暴死意味，避免生硬直译为“在刀剑的杀戮中死去”。
- source_word: περιῆλθον
  choice: 四处奔走
  rationale: 表达 περιέρχομαι 在此处从一地到另一地活动的含义；结合困窘受迫的语境，“奔走”比中性的“走来走去”更贴切，但未明确添加“流浪”。
- source_word: ἐν μηλωταῖς, ἐν αἰγείοις δέρμασιν
  choice: 身披羊皮、山羊皮
  rationale: 两组 ἐν 短语描述以兽皮为衣；“身披”在现代汉语中清楚自然，并保留羊皮与山羊皮的并列。
- source_word: ὑστερούμενοι
  choice: 穷乏困苦
  rationale: ὑστερέω 在此表示缺少生活所需；“穷乏困苦”传达其严重的匮乏状态。
- source_word: θλιβόμενοι
  choice: 受压迫
  rationale: 被动分词表示遭受挤压、逼迫或患难；“受压迫”保留外在施压的意味。
- source_word: κακουχούμενοι
  choice: 遭虐待
  rationale: κακουχέομαι 指受到恶劣对待；“遭虐待”是清楚有力的现代汉语表达。
theological_decisions:
- issue: ἐν φόνῳ μαχαίρης 中 φόνος 的暴力强度
  choice: 惨死在刀剑之下
  alternative: 死在刀剑之下
  rationale: φόνος 使该短语不只是说明致死工具，也带有残杀、暴死的色彩。正文以“惨死”保留这一力度，脚注列出较简洁的译法，以免将一种表达方式绝对化。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。连续使用被动式和状态短语，保留原文苦难清单的节奏；分号区分遭杀害与漂泊受苦两组经历，末尾破折号承接下一节。
