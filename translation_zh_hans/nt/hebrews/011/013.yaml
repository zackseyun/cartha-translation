  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Κατὰ πίστιν ἀπέθανον οὗτοι πάντες, μὴ ⸀λαβόντες τὰς ἐπαγγελίας, ἀλλὰ πόρρωθεν αὐτὰς ἰδόντες καὶ ἀσπασάμενοι, καὶ ὁμολογήσαντες ὅτι ξένοι καὶ παρεπίδημοί εἰσιν ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/013.yaml
  text: All these died in faith[a], not having received the promises, but having seen them from afar and greeted them[c][b], and having confessed that they are strangers and exiles on the earth.
translation:
  language: zh_hans
  text: 这些人全都存着信心死了，虽然没有得到那些应许，却从远处看见了它们，并向它们致意[a]；他们承认自己在地上是异乡人和寄居者[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “向它们致意”也可译作“欢迎它们”或“拥抱它们”。原文动词通常指问候或欢迎，这里以拟人的方式描述他们对远处应许的回应。
    reason: lexical_alternative
  - marker: b
    text: “寄居者”也可译作“暂住者”或“外来居民”，指住在某地却没有永久、完整归属的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατὰ πίστιν
  choice: 怀着信心
  rationale: κατά加宾格在这里表示与信心相符或处于信心的状态。“怀着信心”自然地表达这些人直到死时所持守的信靠，也避免把该短语仅理解为死亡的手段。
- source_word: ἀπέθανον
  choice: 死去了
  rationale: 直接表达不定过去时动词的意思，不采用委婉说法。
- source_word: οὗτοι πάντες
  choice: 这些人全都
  rationale: 保留指向上文人物的指示意味和πάντες的全称范围，同时符合现代汉语语序。
- source_word: μὴ λαβόντες τὰς ἐπαγγελίας
  choice: 没有得到那些应许
  rationale: 保留否定分词与主句的附属关系，也保留ἐπαγγελίαι的复数形式；“得到”适合表达尚未实际领受应许的内容。
- source_word: πόρρωθεν αὐτὰς ἰδόντες
  choice: 从远处望见了
  rationale: 保留空间性的“从远处”及比喻画面；“望见”比单纯“看见”更贴合远距离观看。宾语由前文“那些应许”承接。
- source_word: ἀσπασάμενοι
  choice: 向它们致意
  rationale: 该词本义可指问候、致意或欢迎；这里以应许为拟人化宾语。“向它们致意”保留原文形象，不将其过早解释成已经领受或完全拥抱。
- source_word: ὁμολογήσαντες
  choice: 承认
  rationale: 表达公开认可或宣认某事实的含义；“承认”在本句中自然清楚，且不额外加入宗教仪式色彩。
- source_word: ξένοι
  choice: 异乡人
  rationale: 表达身处非本乡、没有归属的身份；与“寄居者”搭配自然，也比现代语境中可能带法律色彩的“外国人”更合适。
- source_word: παρεπίδημοί
  choice: 寄居者
  rationale: 指居住在某地却没有永久、完整归属的人。“寄居者”简洁保留临时居留和非本地身份的含义。
- source_word: ἐπὶ τῆς γῆς
  choice: 在地上
  rationale: γῆ在此语境中指广义的地上世界，而非某一特定土地；“在地上”保留这种范围。
theological_decisions:
- issue: Κατὰ πίστιν所表达的信心与行动关系
  choice: 怀着信心死去
  alternative: 因着信心死去
  rationale: 原短语可表达按照信心或在信心状态中。“怀着信心”突出这些人死时仍持守信心，同时不排除信心推动其生命行动的含义。
- issue: 尚未得到“应许”的含义
  choice: 保留复数“那些应许”
  alternative: 所应许的
  rationale: 原文明确使用复数，可能涉及多项应许及其实现。译文不把它们归并成单一对象，也不具体说明他们尚未得到的是哪一种实现。
- issue: ἀσπασάμενοι的拟人化表达
  choice: 向它们致意
  alternative: 欢迎它们；拥抱它们
  rationale: 原文把远处可见的应许拟人化，并描述信心之人的积极回应。“致意”较贴近词汇本义，又不把这种回应解释为已经占有应许。
- issue: ξένοι与παρεπίδημοί的身份意象
  choice: 异乡人和寄居者
  alternative: 陌生人和流亡者
  rationale: 这两个词共同强调在地上缺乏永久归属。原文并未必然表示被强制驱逐，因此不在正文采用含义更强的“流亡者”。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。句子保留原文从“未得到”到“远远望见、致意、承认”的推进，并以“异乡人和寄居者”维持两个身份词之间的并列及朝圣者意象。
