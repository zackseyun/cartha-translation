  text: πίστει Ἰωσὴφ τελευτῶν περὶ τῆς ἐξόδου τῶν υἱῶν Ἰσραὴλ ἐμνημόνευσεν, καὶ περὶ τῶν ὀστέων αὐτοῦ ἐνετείλατο.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/022.yaml
  text: By faith Joseph, as he was nearing the end of his life, mentioned the exodus of the sons of Israel and gave instructions concerning his bones.
translation:
  language: zh_hans
  text: 因着信，约瑟临终时，提到以色列子孙将要出埃及的事[a]，并就自己的骸骨作出吩咐。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“以色列子孙的离去（或出去）”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: 因着信
  rationale: 承接《希伯来书》11章反复出现的固定表达，表明约瑟是在信心的推动下这样说、这样吩咐。
- source_word: τελευτῶν
  choice: 临终时
  rationale: 该现在分词表示约瑟正走到生命终点；“临终时”在现代汉语中自然、庄重，也保留与主句动作同时发生的意义。
- source_word: περὶ τῆς ἐξόδου τῶν υἱῶν Ἰσραήλ
  choice: 以色列子孙将要离开埃及的事
  rationale: ἐξόδου本义为“出去、离去”，这里依创世记背景特指以色列后裔将来离开埃及；补出“埃及”和“将要”使所指清楚，并以脚注保留较贴字面的表达。τῶν υἱῶν Ἰσραήλ译为传统且自然的“以色列子孙”，保留家族后裔关系。
- source_word: ἐμνημόνευσεν
  choice: 提到
  rationale: 该动词与περί连用时表示提及、说到某事，而非仅在心里记念。
- source_word: ἐνετείλατο
  choice: 留下了吩咐
  rationale: 表达约瑟就自己的骸骨作出明确指示；“留下了吩咐”贴合临终语境，比单译“命令”更自然。
- source_word: περὶ τῶν ὀστέων αὐτοῦ
  choice: 为自己的骸骨
  rationale: 保留原文具体的“骨头/骸骨”，不泛化为“遗体”；“骸骨”符合庄重书面语体。
theological_decisions:
- issue: πίστις在《希伯来书》11章中的译法
  choice: 信
  alternative: 信实；信靠
  rationale: 本章重复句式以人的信心为行动依据，“信”既符合上下文，也不把此处改解为人的“信实”。
- issue: ἐξόδου是否采用专名式译法
  choice: 离开埃及
  alternative: 出去；出埃及
  rationale: 这里回指约瑟预告以色列后裔离开埃及的事件，但普通名词本身并非事件标题；正文用描述性表达，避免过度专名化，同时清楚呈现历史所指。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“因着信”维持本章反复句式；“临终时”简洁表达τελευτῶν；“骸骨”保留原文具体意象。
