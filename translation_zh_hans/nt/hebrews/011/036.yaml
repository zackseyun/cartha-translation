  yaml_path: translation/nt/hebrews/011/036.yaml
  text: And others experienced mocking and flogging[a], and even chains and imprisonment.
translation:
  language: zh_hans
  text: 另一些人遭受嘲弄和鞭打[a]，甚至被锁链捆绑、被监禁。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“经受了嘲弄和鞭打的考验，甚至锁链捆绑和监禁的考验。”希腊文较直译为“领受了……的考验”。
    reason: 保留πεῖραν ἔλαβον的字面结构，并表明“考验”统摄所列各项苦难。
lexical_decisions:
- source_word: ἕτεροι
  choice: 另有一些人
  rationale: 指信心见证人中的另一群，与前文形成对比；这样表达比单说“另有人”更符合现代汉语。
- source_word: ἐμπαιγμῶν
  choice: 嘲弄
  rationale: 表示带有羞辱性质的讥笑和戏弄；“嘲弄”庄重自然，也保留公开受辱的意味。
- source_word: μαστίγων
  choice: 鞭打
  rationale: 指用鞭或类似刑具抽打；“鞭打”在现代汉语中清楚、准确。
- source_word: πεῖραν ἔλαβον
  choice: 遭受了
  rationale: 该短语直译近于“经受……的考验”；在本句所列苦难的语境中，“遭受了”自然传达亲身经受这些磨难的意思，但脚注保留较直译的可能。
- source_word: ἔτι δὲ
  choice: 甚至
  rationale: 表达递进和加强，由嘲弄、鞭打推进到捆锁与监禁。
- source_word: δεσμῶν
  choice: 被捆锁
  rationale: 指束缚人的锁链或镣铐；用动词性表达可与“监禁”自然并列，同时保留实际受拘束的含义。
- source_word: φυλακῆς
  choice: 监禁
  rationale: 此处指被关押的处境，而不只是监狱这一地点；“监禁”准确且符合现代汉语搭配。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的书面汉语。“另有一些人”承接前文并引出另一类受苦者；正文以自然表达为主，脚注保留希腊文较直译的结构和语义张力。
