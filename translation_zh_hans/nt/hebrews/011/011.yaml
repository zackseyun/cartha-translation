revisions:
- from: 因着信，就连撒拉本人也得着能力孕育后代[a]；虽然她已经过了合宜的年岁，仍是如此，因为她认定那位作出应许的是信实的。
  to: 因着信，连撒拉自己也得着能力怀孕生子[a]；即使她已过了适合生育的年岁，仍能如此，因为她认定那位应许者是信实的。
  rationale: 修订仅改善中文句法和脚注的字面准确度：以“即使……仍能如此”自然表达超过正常年龄界限的情况，并以“适合生育的年岁”使语境所指清楚而不指定具体年龄。正文仍保留撒拉为领受能力者；脚注继续标示原文生育短语的罕见性和字面张力，未将任何特定神学解释加入经文。
