source:
  edition: SBLGNT
  text: πίστει καὶ ⸂αὐτῇ Σάρρᾳ⸃ δύναμιν εἰς καταβολὴν σπέρματος ἔλαβεν καὶ παρὰ καιρὸν ⸀ἡλικίας, ἐπεὶ πιστὸν ἡγήσατο τὸν ἐπαγγειλάμενον·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/011.yaml
  text: By faith even Sarah herself received power to conceive offspring[a], even beyond the proper time of life, because she considered the one who had promised to be faithful.
translation:
  language: zh_hans
  text: 因着信，连撒拉自己也得着能力怀孕生子[a]；即使她已过了适合生育的年岁，仍能如此，因为她认定那位应许者是信实的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“得着能力，为种子的播下。”这个希腊语短语罕见，且在撒拉为主语时措辞显得不寻常；按上下文，是指获得生育后代的能力。
    reason: 保留 εἰς καταβολὴν σπέρματος 的较字面表达及其不寻常的措辞，同时说明其在本节语境中的含义。
lexical_decisions:
- source_word: πίστει
  choice: 因着信
  rationale: 工具或凭借用法，也承接《希伯来书》11章反复出现的句式；“因着信”在现代中文中庄重、清楚。
- source_word: καὶ αὐτῇ Σάρρᾳ
  choice: 就连撒拉本人也
  rationale: 以“就连……本人也”表达 καὶ 与强调代词所带出的追加和强调意味，同时保留撒拉作为本节焦点。
- source_word: δύναμιν ... ἔλαβεν
  choice: 得着能力
  rationale: 贴近“领受能力”的词义，又比被动式“得以”更能保留原文的表达结构。
- source_word: εἰς καταβολὴν σπέρματος
  choice: 孕育后代
  rationale: 原短语罕见且带有“放下／播下种子”的字面形象；在撒拉为焦点的语境中，“孕育后代”自然表达生育之意，同时不把男性生理意象强加进正文。字面译法留在脚注。
- source_word: καὶ παρὰ καιρὸν ἡλικίας
  choice: 虽然她已经过了合宜的年岁，仍是如此
  rationale: παρά 加宾格表达越过正常界限，καιρός 指合宜的时机，ἡλικία 指年龄或人生阶段；此译不额外限定为某一具体年龄。
- source_word: ἐπεὶ
  choice: 因为
  rationale: 清楚引出撒拉得着能力的原因。
- source_word: πιστὸν
  choice: 信实的
  rationale: 既表达可靠、可信，也保留该词用于上帝时的神学分量，而不增添原文没有的教义内容。
- source_word: ἡγήσατο
  choice: 认定
  rationale: 表达经过判断而视为如此的意思，比单纯“认为”略有确定性，又未超出原词的评价性含义。
- source_word: τὸν ἐπαγγειλάμενον
  choice: 那位作出应许的
  rationale: 忠实表达名词化分词，并让所指为上帝在中文中自然、庄重；不补入原文未明说的受许对象。
theological_decisions:
- issue: 句法困难之处谁是领受能力的主体，以及生育短语如何理解
  choice: 以撒拉为本节焦点和领受能力者，译为“撒拉本人也得着能力孕育后代”
  alternative: 把亚伯拉罕理解为隐含或主要行动者；或把短语理解为建立后裔谱系
  rationale: 按本节语境及传统句法理解，重点在撒拉凭信经历超越年龄限制的生育能力。由于 καταβολὴ σπέρματος 的字面措辞可能带有男性取向，正文采用能与撒拉相配的自然表达，脚注则保留原文异乎寻常的字面形象，避免掩盖张力。
- issue: 用于描述应许者的 πιστός
  choice: 信实的
  alternative: 可信的；可靠的
  rationale: 本节把撒拉的信建立在应许者可信赖的品格上；“信实”保留这一神学分量，却没有加入经文之外的内容。
translation_notes:
  register: 采用现代标准普通话的简体中文，语气庄重而易懂。“合宜的年岁”保留原文“合宜时机／年龄阶段”的宽度；分号与“仍是如此”使让步关系清楚，同时避免把原文过度具体化为现代医学术语。
