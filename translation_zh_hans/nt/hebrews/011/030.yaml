  text: By faith the walls of Jericho fell after they had been encircled for seven days[a].
translation:
  language: zh_hans
  text: 因着信，耶利哥的城墙在被环绕七天之后倒塌了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“借着信。”希腊语πίστει的与格形式可以表示凭借或方式；正文保留《希伯来书》第11章反复使用的句式。
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: 因着信
  rationale: πίστις的与格在此可表示凭借或方式；“因着信”既保留《希伯来书》第11章反复出现的句式，也不把语法关系限定得过细。
- source_word: τὰ τείχη Ἰεριχὼ
  choice: 耶利哥的城墙
  rationale: τεῖχος在此指城墙；Ἰεριχώ为专名，与“城墙”构成所属关系。
- source_word: ἔπεσαν
  choice: 倒塌了
  rationale: πίπτω意为“倒下”；用于城墙时，现代汉语以“倒塌”最自然，并未增加倒塌方式等原文没有的信息。
- source_word: κυκλωθέντα
  choice: 在被环绕……之后
  rationale: κυκλόω的简单过去时被动分词描述城墙受到环绕，且该行动先于主要动词“倒塌”；保留被动表达，避免直接补出原文未明说的环绕者。
- source_word: ἐπὶ ἑπτὰ ἡμέρας
  choice: 七天
  rationale: ἐπί加宾格时间短语表示持续时间；在“被环绕七天之后”中自然表达该动作历时七天。
theological_decisions:
- issue: πίστις在希伯来书11:30中的译法
  choice: 信
  alternative: 信实；信靠
  rationale: 本章反复以πίστει引出信心的实例，语境支持译作“信”；“信实”会改变这里通常所指的信靠层面，“信靠”虽可表达其内涵，却不如“信”便于保留全章的固定句式。
- issue: πίστει的语法关系
  choice: 因着信
  alternative: 借着信
  rationale: 与格既可表达凭借，也可带方式色彩；正文采用自然且熟悉的“因着信”，脚注保留另一种可能的表达。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“因着信”维持本章排比节奏；“被环绕七天之后”紧贴希腊语被动分词，同时不把《约书亚记》叙事中更具体的行动者和方式直接补入正文。
