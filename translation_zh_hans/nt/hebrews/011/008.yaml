  to: 亚伯拉罕因着信，蒙召时就顺从而出去，前往一个将要承受为产业的地方；他出去了，还不知道要往哪里去。
  rationale: 仅作安全的汉语句法润饰：以“顺从而出去，前往”替换原来的“顺从，出去前往”。这维持原文ὑπήκουσεν ἐξελθεῖν与ἐξῆλθεν的行动呼应、目的地的不定性和“承受为产业”的未来意义，不改变经文含义或神学表述。
