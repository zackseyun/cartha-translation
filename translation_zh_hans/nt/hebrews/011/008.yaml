source:
  edition: SBLGNT
  text: ⸀Πίστει καλούμενος Ἀβραὰμ ὑπήκουσεν ἐξελθεῖν εἰς ⸀τόπον ὃν ἤμελλεν λαμβάνειν εἰς κληρονομίαν, καὶ ἐξῆλθεν μὴ ἐπιστάμενος ποῦ ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/008.yaml
  text: By faith Abraham[a], when called, obeyed to go out to a place that he was going to receive as an inheritance, and he went out not knowing where he was going.
translation:
  language: zh_hans
  text: 亚伯拉罕因着信，蒙召时就顺从而出去，前往一个将要承受为产业的地方；他出去了，还不知道要往哪里去。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πίστει
  choice: 因着信
  rationale: 工具或凭借用法；“因着信”自然地表达亚伯拉罕凭信心回应呼召，也与本章反复出现的句式相协调。
- source_word: καλούμενος
  choice: 蒙召的时候
  rationale: 现在时被动分词，作时间兼情境成分；“蒙召的时候”保留被动意义，不额外限定呼召与顺从之间的先后间隔。
- source_word: ὑπήκουσεν ἐξελθεῖν
  choice: 就顺从，出去前往
  rationale: ὑπακούω表示听从、服从，后接不定式说明顺从所采取的行动。汉语用停顿连接“顺从”与“出去”，既自然，也避免把不定式过度解释为方式或结果。
- source_word: τόπον
  choice: 一个……地方
  rationale: 地点尚未指明；译作“一个……地方”符合语境，也保留目的地当时未知的意味。
- source_word: ἤμελλεν λαμβάνειν εἰς κληρονομίαν
  choice: 将要承受为产业
  rationale: μέλλω加不定式表达将来；λαμβάνειν εἰς κληρονομίαν表示领受该地，使之成为产业。“承受为产业”简洁保留继承性用语，而不加入原文未明说的“他的”。
- source_word: καὶ ἐξῆλθεν
  choice: 他出去了
  rationale: 保留与前面ἐξελθεῖν的词语重复，以呈现作者对命令性行动与实际行动的呼应。
- source_word: μὴ ἐπιστάμενος ποῦ ἔρχεται
  choice: 还不知道要往哪里去
  rationale: 否定分词表示伴随情形；ἔρχεται在这里指行程的目的方向，现代汉语自然译作“要往哪里去”。“还”突出他动身时仍不知道目的地，但不增添因果解释。
theological_decisions:
- issue: πίστις在亚伯拉罕回应呼召语境中的译法
  choice: 信
  alternative: 信靠；忠信
  rationale: 本句着重亚伯拉罕因信而顺从神的呼召。“信”保留核心神学用语及本章的关键词联系；“信靠”可表达关系性，但会使本章重复用词不够整齐；“忠信”则较易把重点转向亚伯拉罕自身的信实。
- issue: 产业的领受是否明说为亚伯拉罕个人所有
  choice: 不补入“他的”
  alternative: 承受为他的产业
  rationale: 原文εἰς κληρονομίαν没有物主代词。上下文自然表明领受者是亚伯拉罕，但正文不额外补明，以保留原文表达。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。保留“因着信”“蒙召”“承受为产业”等圣经语域，同时避免生硬直译。“出去”前后重复，对应希腊文ἐξελθεῖν／ἐξῆλθεν的修辞呼应。
