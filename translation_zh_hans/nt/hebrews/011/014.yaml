  yaml_path: translation/nt/hebrews/011/014.yaml
  text: For those who say such things make it clear that they are seeking a homeland[a].
translation:
  language: zh_hans
  text: 因为说这样的话的人，清楚表明他们正在寻求一个家乡[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“自己的国土”或“故土”。下文说明，他们最终盼望的是天上的家乡。
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: 因为
  rationale: 承接上一节，说明这些话为何显出他们的身份与追求；现代汉语中“因为”能自然保留解释关系。
- source_word: τοιαῦτα
  choice: 这样话
  rationale: 回指上文所说“在世上是异乡人，是寄居者”一类的话；中文省去量词“的”更凝练自然。
- source_word: λέγοντες
  choice: 说……的人
  rationale: 将修饰带冠词者的现在分词译为关系性结构，保留一般或持续说出这些话的意味。
- source_word: ἐμφανίζουσιν
  choice: 清楚表明
  rationale: 表达使某事显明、明白可见之意，也保留从他们所说的话得出判断的推论色彩。
- source_word: ὅτι
  choice: （表明）……
  rationale: 作为内容从句的连接成分，汉语以“表明”直接带宾语从句，无须另译“that”。
- source_word: πατρίδα
  choice: 一个家乡
  rationale: πατρίς指本乡、本国或故土。“家乡”是现代汉语中自然且具归属意味的表达；加“一个”对应名词的不定性，不提前限定为天上的家乡。
- source_word: ἐπιζητοῦσιν
  choice: 是在寻求
  rationale: “寻求”保留主动追求的核心语义；“是在”使持续进行及本句所强调的内容自然显出。
theological_decisions:
- issue: 先祖所寻求的 πατρίς 在本节中的所指
  choice: 正文笼统译作“一个家乡”
  alternative: 直接译作“天上的家乡”或“自己的故乡”
  rationale: 本节本身只说他们寻求一个家乡；下一节才进一步说明他们向往的是更美、在天上的家乡。正文不提前消解这一展开过程。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“清楚表明”准确传达论证语气；“家乡”比“祖国”较少现代政治色彩，也比“父国”自然。正文中的脚注标记[a]与脚注对应。
