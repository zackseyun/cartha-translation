base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/026.yaml
  text: He considered the reproach of Messiah greater wealth than the treasures of Egypt[b][a], for he was looking to the reward.
translation:
  language: zh_hans
  text: 他把弥赛亚的凌辱看作比埃及的财宝更大的财富[a][b]，因为他一直注目于那报赏。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“基督的凌辱”。希腊文Χριστοῦ也可译作“基督”；正文采用“弥赛亚”，因为这里该词作为称号使用。
    reason: alternative_reading
  - marker: b
    text: “弥赛亚的凌辱”可能指为弥赛亚所受的凌辱、与上帝的受膏者一同承受的凌辱，或《希伯来书》认为最终在弥赛亚身上得到体现的凌辱。正文保留希腊文的表达，不将其限定为其中一种解释。
    reason: lexical_alternative
lexical_decisions:
- source_word: μείζονα πλοῦτον
  choice: 更大的财富
  rationale: 保留比较结构以及“财富”这一比喻，使它与“埃及的财宝”形成直接对照。
- source_word: ἡγησάμενος
  choice: 看作
  rationale: 表达ἡγέομαι在此“认为、视为”的评估含义；转换为汉语谓语，行文自然清楚。
- source_word: τῶν Αἰγύπτου θησαυρῶν
  choice: 埃及的财宝
  rationale: 忠实表达属格结构，并保留摩西所舍弃之物与属灵价值之间的对比。
- source_word: τὸν ὀνειδισμὸν
  choice: 凌辱
  rationale: 既能表达公开的羞辱与毁谤，也适合描述因与某人认同而承受的耻辱；比“责备”更贴近此处语义。
- source_word: τοῦ Χριστοῦ
  choice: 弥赛亚的
  rationale: Χριστός在此作为称号使用，译作“弥赛亚”；保留属格形式，不把它限定解释为“为弥赛亚所受的”。
- source_word: ἀπέβλεπεν
  choice: 一直注目于
  rationale: 以“一直”体现未完成时所表达的持续取向，“注目于”则保留专注期待的含义。
- source_word: μισθαποδοσίαν
  choice: 报赏
  rationale: 表达回报、奖赏之意，也与《希伯来书》关于信心和忍耐的语境相称。
theological_decisions:
- issue: 摩西与“弥赛亚的凌辱”之间的关系
  choice: 保留“弥赛亚的凌辱”这一属格表达，不加解释性扩充。
  alternative: 可解释为“为弥赛亚所受的凌辱”“与上帝受膏者共同承受的凌辱”，或“在弥赛亚身上得到终极体现的凌辱”。
  rationale: 希腊文属格本身没有明确限定具体关系。直译能保留作者的基督论表达及其张力，避免替读者预先裁定有争议的解释。
- issue: Χριστός的称号性质
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处Χριστός具有称号功能；“弥赛亚”清楚呈现“受膏者”的身份，同时脚注提供传统译法。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“更大的财富”有意保留原文的价值比较和财富意象；“一直注目于”体现未完成时的持续意味。正文中的两个脚注标记均紧接相关分句。
