  text: οἳ διὰ πίστεως κατηγωνίσαντο βασιλείας, εἰργάσαντο δικαιοσύνην, ἐπέτυχον ἐπαγγελιῶν, ἔφραξαν στόματα λεόντων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/033.yaml
  text: who through faith conquered kingdoms[a], worked righteousness, obtained promises, shut the mouths of lions[b],
translation:
  language: zh_hans
  text: 他们借着信[a]，征服了列国，施行了公义[b]，得着了应许，堵住了狮子的口。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“凭着信”或“因着信”；这里强调他们倚靠上帝而行动。
    reason: lexical_alternative
  - marker: b
    text: “公义”也可按语境理解为“正义”或“正直的事”。
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ πίστεως
  choice: 借着信
  rationale: διά加属格在此表示行动所凭借的途径或方式；“借着信”既保留介词结构，也承接《希伯来书》十一章以信回应、倚靠上帝的主题。
- source_word: κατηγωνίσαντο
  choice: 征服了
  rationale: 该动词表示在争战中胜过、制伏；与“列国”搭配时，“征服了”自然有力，并保留军事和政治意味。
- source_word: βασιλείας
  choice: 列国
  rationale: 此处指多个具体的王国或国度。“列国”在现代中文圣经语体中简洁自然，能表达复数政治实体；“诸王国”虽更形式对应，却较生硬。
- source_word: εἰργάσαντο δικαιοσύνην
  choice: 施行了公义
  rationale: ἐργάζομαι表示实行、成就或做出；“施行”比直译“作出”更符合现代中文搭配。δικαιοσύνη保留为“公义”，涵盖正直行为与正义的含义。
- source_word: ἐπέτυχον ἐπαγγελιῶν
  choice: 得着了应许
  rationale: ἐπιτυγχάνω表示获得、达到；此译法贴近原文复数名词“应许”，不擅自说明是领受了应许的话，还是实现了应许的内容，从而保留《希伯来书》中相关张力。
- source_word: ἔφραξαν στόματα λεόντων
  choice: 堵住了狮子的口
  rationale: φράσσω有堵住、封住之意；此译保留具体鲜明的意象，也自然让读者联想到但以理的经历，而不在正文中明说典故。
theological_decisions:
- issue: πίστις在本章事迹清单中的译法
  choice: 信
  alternative: 信靠；忠信
  rationale: 本节强调这些人倚靠上帝而行动，故“信”最适合正文，也与全章主题一致；“信靠”可说明其关系性含义，但正文无需扩译，“忠信”在此较可能误导为人的品格表现。
- issue: δικαιοσύνη在非保罗书信语境中的译法
  choice: 公义
  alternative: 正义；行了正直的事
  rationale: 这里主要指实行合乎上帝旨意的正直之事，也可能包含秉公行义。“公义”保留较宽的道德与盟约含义，不把范围限缩为司法或社会正义。
- issue: “得着应许”与本章尚未完全得着应许的张力
  choice: 保留“得着了应许”的原文表达
  alternative: 得着了所应许的；领受了应许
  rationale: 原文使用复数ἐπαγγελιῶν，可指某些具体应许的实现，并不必然否定11:39所说众人尚未得着那终极应许。直译保留这种张力，不替作者系统化。
translation_notes:
  register: 采用自然、庄重的现代标准汉语，并维持原文连续列举的节奏。“列国”比“王国们”或“诸王国”更符合中文习惯；“得着了应许”略带圣经语体，但有助于保留原文的名词形式及其解释空间。脚注标记按正文出现顺序重新安排，以确保各注紧随其实际所解释的词语。
