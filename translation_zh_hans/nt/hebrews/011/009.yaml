  text: πίστει παρῴκησεν εἰς γῆν τῆς ἐπαγγελίας ὡς ἀλλοτρίαν, ἐν σκηναῖς κατοικήσας μετὰ Ἰσαὰκ καὶ Ἰακὼβ τῶν συγκληρονόμων τῆς ἐπαγγελίας τῆς αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/009.yaml
  text: By faith he lived as a foreigner in the land of promise[a], as in a foreign land, dwelling in tents with Isaac and Jacob, fellow heirs of the same promise.
translation:
  language: zh_hans
  text: 因着信，他在应许之地[a]寄居，如同在异乡；他与以撒和雅各一同住在帐篷里，他们也是同一应许的共同承受者。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因着信，他在应许之地寄居，如同在外地。”
    reason: 原文中εἰς与ὡς ἀλλοτρίαν的句法关系可用不同中文结构表达；此译更直接将“如同外地”的比较关系连于“应许之地”。
lexical_decisions:
- source_word: πίστει
  choice: 因着信
  rationale: 工具格表达凭借或方式；希伯来书11章反复以此短语指出信是行动的凭借。“因着信”自然、庄重，也与本章语境一致。
- source_word: παρῴκησεν
  choice: 寄居
  rationale: 该动词表示以外来者、非本地人的身份居住。“寄居”简洁保留了外来身份及居住并非定居为业的意味。
- source_word: εἰς γῆν τῆς ἐπαγγελίας
  choice: 在应许之地
  rationale: εἰς在居住类动词之后可表示居住所在地；“应许之地”保留土地与应许之间的紧密关系。
- source_word: ὡς ἀλλοτρίαν
  choice: 如同身在异乡
  rationale: ἀλλότριος可指属于别人的、外来的；这里把应许之地呈现为对亚伯拉罕而言仍像异乡。“如同身在异乡”自然表达ὡς的比较意味。
- source_word: ἐν σκηναῖς κατοικήσας
  choice: 住在帐篷里
  rationale: 分词说明他寄居的具体方式；此译保留帐篷所呈现的流动、未永久定居的生活图景。
- source_word: μετὰ Ἰσαὰκ καὶ Ἰακὼβ
  choice: 与……以撒和雅各为伴
  rationale: μετά加属格表示“与……一起”。为使修饰语在中文中归属清楚，将“以撒和雅各”置于共同承受应许的说明之后。
- source_word: τῶν συγκληρονόμων
  choice: 一同承受……的
  rationale: 该词指共同拥有继承权的人。中文用“一同承受”既通顺，又保留共同继承的概念。
- source_word: τῆς ἐπαγγελίας τῆς αὐτῆς
  choice: 这同一应许
  rationale: 重复冠词并使用αὐτός强调他们所承受的正是同一个应许；“这同一应许”保留这一同一性。
theological_decisions:
- issue: 省略主语所指
  choice: 以“他”承接上文的亚伯拉罕
  alternative: 明说“亚伯拉罕”
  rationale: 本节主语从11:8自然延续，原文未重述姓名；用“他”既清楚承接语境，也保留原文衔接方式。
- issue: 应许之地与异乡之间的张力
  choice: 同时译作“应许之地”和“如同身在异乡”
  alternative: 解释为尚未实际拥有该地
  rationale: 原文有意并置应许与异乡身份；正文保留这种张力，不加入超出本节的神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“寄居”“应许之地”“帐篷”沿用读者熟悉的圣经语汇，同时避免古奥句式。脚注标记已在正文中以[a]出现。
