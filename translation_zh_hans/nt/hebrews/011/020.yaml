base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/020.yaml
  text: By faith Isaac blessed Jacob and Esau, even concerning things to come.
translation:
  language: zh_hans
  text: 因着信，以撒就将来的事为雅各和以扫祝福。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πίστει
  choice: 因着信
  rationale: 表达凭借或基于信心而行，符合本章反复出现的结构，也自然通顺。
- source_word: καὶ περὶ μελλόντων
  choice: 所祝福的甚至关乎将来的事
  rationale: καί在此可作强调，译为“甚至”；περὶ μελλόντων指尚未来临之事。补出“所祝福的”以明确该短语修饰祝福的内容，避免误读为单纯的时间状语。
- source_word: εὐλόγησεν
  choice: 为……祝福
  rationale: 保留圣经语境中郑重宣告福分的含义，不弱化为一般的祝愿。
- source_word: τὸν Ἰακὼβ καὶ τὸν Ἠσαῦ
  choice: 雅各和以扫
  rationale: 采用中文圣经传统且通行的人名译法，并保留两人并列的顺序。
theological_decisions:
- issue: 以撒的祝福与未来之事的关系
  choice: “所祝福的甚至关乎将来的事”
  alternative: “以撒就将来的事为雅各和以扫祝福”
  rationale: 原文περὶ μελλόντων与εὐλόγησεν关系紧密，而καί带有强调意味。现译既保留祝福具有面向未来的内容，也不额外界定这些事实现的方式或范围。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“因着信”与希伯来书第11章的重复句式一致；通过补出“所祝福的”使中文关系清晰，同时保留原文对未来内容的概括性。
