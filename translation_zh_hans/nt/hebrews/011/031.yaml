  text: πίστει Ῥαὰβ ἡ πόρνη οὐ συναπώλετο τοῖς ἀπειθήσασιν, δεξαμένη τοὺς κατασκόπους μετ’ εἰρήνης.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/031.yaml
  text: By faith Rahab the prostitute did not perish with those who were disobedient[b][a], because she had welcomed the spies in peace.
translation:
  language: zh_hans
  text: 凭着信，妓女喇合没有和那些不顺从的人一同灭亡[a]，因为她友好地接待了探子[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不顺从的人”也可译作“不信从的人”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“她既以和平的方式接待了探子。”
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: πίστει
  choice: 因着信
  rationale: 工具格用法，说明喇合行动及得以免于灭亡所凭借的是信；也承接《希伯来书》11章反复出现的榜样句式。
- source_word: Ῥαὰβ
  choice: 喇合
  rationale: 采用现代中文圣经传统中通行的人名音译。
- source_word: ἡ πόρνη
  choice: 妓女
  rationale: πόρνη明确指卖淫的女子；“妓女”是现代中文中直接、清楚而不古奥的对应表达。
- source_word: οὐ συναπώλετο
  choice: 没有……一同灭亡
  rationale: συναπόλλυμι含有“与别人一同灭亡”的复合意义；中文将“一同”明示出来，以保留原词的共同遭灭亡之意。
- source_word: τοῖς ἀπειθήσασιν
  choice: 那些不顺从的人
  rationale: ἀπειθέω可表达不顺从、悖逆，也与不信相关；正文选“不顺从”以保留其意志和行为层面的含义，相关语义歧义见脚注。
- source_word: δεξαμένη
  choice: 因为她……接待了
  rationale: δέχομαι在接待来访者的语境中自然译作“接待”。不定过去时分词在此可说明伴随情形或原因；正文用“因为”表达上下文中自然的因果联系，同时以脚注保留较贴近分词结构的译法。
- source_word: τοὺς κατασκόπους
  choice: 探子
  rationale: κατάσκοπος指受派侦察的人；“探子”符合约书亚记叙事背景，也是简明自然的现代中文表达。
- source_word: μετ’ εἰρήνης
  choice: 平安地
  rationale: 该介词短语描述喇合接待探子时和平、友善的方式；“平安地”既保留εἰρήνη的词义，也符合中文表达。
theological_decisions:
- issue: 《希伯来书》11章榜样句式中πίστις的译法
  choice: 信
  alternative: 信靠；忠信
  rationale: πίστει加人物的句式在本章反复说明人物“因着信”而行动。“信靠”可表达相关概念，“忠信”则偏重人的忠诚表现；本节以“信”最能保留该章的统一用语，又不把信的内容或性质解释得过满。
- issue: ἀπειθέω所含不信与不顺从的张力
  choice: 不顺从
  alternative: 不信从；悖逆
  rationale: 该词既可涉及拒绝相信，也常指不服从。正文采用较直接的“不顺从”，不把耶利哥居民的反应仅化约为认知层面的不信；脚注保留兼含“不信”意味的译法。
- issue: δεξαμένη分词与主句的逻辑关系
  choice: 因为她……接待了
  alternative: 她既……接待了
  rationale: 分词本身未用明确的因果连词，既可按原因理解，也可较形式地表达为伴随情形。正文采用语境自然的因果表达，脚注则保留较少解释性的句法关系。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“妓女”不作委婉化处理；“一同灭亡”明示希腊语复合动词的共同灭亡含义。脚注标记均置于正文相应位置。
