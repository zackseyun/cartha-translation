  text: εἰς δὲ τὴν δευτέραν ἅπαξ τοῦ ἐνιαυτοῦ μόνος ὁ ἀρχιερεύς, οὐ χωρὶς αἵματος, ὃ προσφέρει ὑπὲρ ἑαυτοῦ καὶ τῶν τοῦ λαοῦ ἀγνοημάτων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/007.yaml
  text: But into the second room only the high priest enters once a year[a], and not without blood[b], which he offers for himself and for the people's sins committed in ignorance.
translation:
  language: zh_hans
  text: 至于第二间，只有大祭司一年进入一次[a]，而且必须带着血；他把血献上，为自己和百姓因无知所犯的罪[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “第二间”也可译作“第二层帐幕”或“第二部分”，指会幕的内层隔间。
    reason: lexical_alternative
  - marker: b
    text: “因无知所犯的罪”也可译作“无意中犯的罪”或“误犯的罪”。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς δὲ τὴν δευτέραν
  choice: 但进入第二层帐幕的
  rationale: 希腊文省略了所修饰的名词，承接9:2—3所说会幕的内外两层。译作“第二层帐幕”既补足汉语表达，也保留其可能指第二部分或内层空间的含义。
- source_word: ἅπαξ τοῦ ἐνιαυτοῦ
  choice: 每年进去一次
  rationale: 自然表达一年一次的频率；补出“进去”承接前面的进入动作。
- source_word: μόνος ὁ ἀρχιερεύς
  choice: 只有大祭司
  rationale: 清楚体现μόνος所表达的排他性。
- source_word: οὐ χωρὶς αἵματος
  choice: 并且不能不带着血
  rationale: 保留原文“不是没有血”的双重否定意味，同时按献祭语境自然表达大祭司带血进入；不将“血”解释性改写为祭物。
- source_word: ὃ προσφέρει
  choice: 他献上这血
  rationale: ὃ回指“血”，προσφέρει在此具有献祭意义；明确译出指代对象，使汉语清楚。
- source_word: ὑπὲρ ἑαυτοῦ
  choice: 为自己
  rationale: 简洁表达献祭语境中ὑπέρ的代求或受益关系，不额外界定其机制。
- source_word: τῶν τοῦ λαοῦ ἀγνοημάτων
  choice: 百姓因无知而犯的罪
  rationale: ἀγνοήματα指因无知、误失而犯的过错。此译保留“罪”的道德与献祭含义，也保留无知这一特征。
theological_decisions:
- issue: ἀγνοήματα在献祭语境中的性质
  choice: 因无知而犯的罪
  alternative: 无意中犯的罪；误犯的罪
  rationale: 原词涉及因不知道或未认识到而产生的过犯，不只是一般的信息缺乏。译文不把它缩窄为完全非故意，也不扩展到所有类型的罪。
- issue: 血与进入至圣空间的关系
  choice: 不能不带着血；他献上这血
  alternative: 不是不用血；他把血献上
  rationale: 保留原文的否定式强调及献祭关系，不进一步说明血的具体来源或仪式程序。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“第二层帐幕”与上下文的会幕结构相连；分号和短句使进入、带血、献血三层信息清晰。所有脚注标记均已置于正文。
