  text: εἰ γὰρ τὸ αἷμα ⸂τράγων καὶ ταύρων⸃ καὶ σποδὸς δαμάλεως ῥαντίζουσα τοὺς κεκοινωμένους ἁγιάζει πρὸς τὴν τῆς σαρκὸς καθαρότητα,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/013.yaml
  text: For if the blood of goats and bulls[a], and the ashes of a heifer that sprinkle those who have been defiled, sanctify for the purification of the flesh[d][c][b],
translation:
  language: zh_hans
  text: 因为，若山羊和公牛的血，以及洒在受了玷污的人身上的母牛犊的灰[b]，尚且能使他们成圣，以致肉身洁净[c]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 这里暗指《民数记》19章所记用母牛犊之灰施行的洁净礼。
    reason: cross_reference
  - marker: c
    text: “肉身的洁净”指旧约礼仪所达到的外在、身体和礼仪层面的洁净，并非把“肉身”解释为罪性。
    reason: cultural_note
lexical_decisions:
- source_word: εἰ γὰρ
  choice: 因为……尚且
  rationale: 保留γάρ承接上文的论证作用，也以条件句式引出下一节才完成的比较；“尚且”自然地预示后文“何况”的递进。
- source_word: τὸ αἷμα τράγων καὶ ταύρων
  choice: 山羊和公牛的血
  rationale: 准确保留献祭语境中的血及两个属格所表示的来源；现代汉语简洁自然。
- source_word: σποδὸς δαμάλεως
  choice: 母牛犊的灰
  rationale: δαμάλεως指尚年轻的母牛；“母牛犊”既准确，又能保留与《民数记》19章洁净礼的联系。
- source_word: ῥαντίζουσα τοὺς κεκοινωμένους
  choice: 洒在受了玷污的人身上
  rationale: 把分词所表达的洒礼动作译成自然汉语；“受了玷污”反映完成分词，并保留礼仪性不洁的含义。
- source_word: ἁγιάζει
  choice: 使他们成圣
  rationale: 保留ἁγιάζω的礼仪和神学用语色彩；宾语依上下文补出为“他们”，不把此处解释为内在道德转变。
- source_word: πρὸς τὴν τῆς σαρκὸς καθαρότητα
  choice: 达到肉身的洁净
  rationale: 保留σάρξ的字面意义和与下一节“良心”的对照；“达到”自然表达πρός在此所指向的结果。
theological_decisions:
- issue: 旧约礼仪“使人成圣”的范围
  choice: 保留“使他们成圣”，并由“达到肉身的洁净”限定其在本节中的礼仪效力
  alternative: 译作“使人在外表上洁净”，直接消解“成圣”一词
  rationale: 原文同时使用ἁγιάζει和“肉身的洁净”，承认旧约礼仪的实际礼仪效力，却与下一节良心的洁净形成张力；译文不应提前抹平这种张力。
- issue: σάρξ在本节的意义
  choice: 肉身
  alternative: 罪性；外表
  rationale: 上下文谈论礼仪性洁净，并在下一节与良心相对，因此这里是身体、外在层面的意义，不是“罪性”。
- issue: ῥαντίζουσα的句法与施事表达
  choice: 让“母牛犊的灰”承接“洒在……身上”的动作
  alternative: 译作“用母牛犊的灰洒在……身上”，将未明说的礼仪执行者显化为施事
  rationale: 分词在文法上修饰“灰”；主译尽量保留这一结构，虽按实际礼仪而言是人施行洒礼。
translation_notes:
  register: 采用现代、庄重而可朗读的书面汉语。“母牛犊”“成圣”“肉身的洁净”保留祭祀语境和本段关键术语。句末保留逗号，因为本节只是条件比较的前半句，完整结论在下一节出现。
