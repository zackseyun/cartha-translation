  text: καὶ καθ’ ὅσον ἀπόκειται τοῖς ἀνθρώποις ἅπαξ ἀποθανεῖν, μετὰ δὲ τοῦτο κρίσις,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/027.yaml
  text: And just as it is appointed for men to die once[a], and after this, judgment,
translation:
  language: zh_hans
  text: 正如人注定要死一次，此后便有审判，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθ’ ὅσον
  choice: 正如
  rationale: 这里引出与下一节相对应的比较；“正如”既自然，也能使9:28的比较结构清楚衔接。
- source_word: ἀπόκειται
  choice: 注定
  rationale: 该动词本可指“存留、保留”，但在此与不定式连用，表示某事已被确定或命定；“注定要……”符合现代汉语表达，同时不明说命定者。
- source_word: τοῖς ἀνθρώποις
  choice: 人
  rationale: 此处复数名词泛指全人类，并非只指男性；现代汉语的“人”准确保留其普遍含义，无须另加性别说明。
- source_word: ἅπαξ
  choice: 一次
  rationale: 明确表达死亡发生一次；不译作“一劳永逸”，以免把本节的普通副词过度神学化。
- source_word: ἀποθανεῖν
  choice: 要死
  rationale: 作为ἀπόκειται的不定式补语，直译其基本意义；与“注定”搭配后形成自然的现代汉语。
- source_word: μετὰ δὲ τοῦτο
  choice: 此后便有
  rationale: “此后”保留时间先后，“便有”自然表达δέ所推动的进展关系，而不把它强化为额外的转折。
- source_word: κρίσις
  choice: 审判
  rationale: 该词指司法性的判断或裁决；“审判”保留其广义，不预先限定结果为定罪。
theological_decisions:
- issue: ἀνθρώποις的泛指范围
  choice: 译为“人”，指全人类
  alternative: 男人；世人；人类
  rationale: 希腊文虽为阳性复数，语义却显然是泛指。汉语“人”自然、准确，也不会造成仅限男性的误解。
- issue: ἀπόκειται是否明说命定者
  choice: 用“注定”表达已确定的事实，不补出主语
  alternative: 神规定；命运规定；为人存留
  rationale: 原文使用无人称式表达，没有在本句明说是谁作出规定；译文不补入“神”或“命运”，以保留原文的表达范围。
- issue: 死后κρίσις的范围
  choice: 只译“审判”
  alternative: 定罪；末日审判；最后的审判
  rationale: 本节断言死后有审判，却没有在此详述审判的结果、时间或完整的末世次序，因此不加入更具体的教义体系。
translation_notes:
  register: 采用现代、庄重而简洁的经文语体。“正如”保留本节与9:28之间尚未完成的比较，因此句末用逗号而非句号。“人注定要死一次”兼顾原文结构与现代汉语可读性。
