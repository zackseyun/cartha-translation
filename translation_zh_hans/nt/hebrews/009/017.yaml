  text: διαθήκη γὰρ ἐπὶ νεκροῖς βεβαία, ἐπεὶ ⸀μήποτε ἰσχύει ὅτε ζῇ ὁ διαθέμενος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/017.yaml
  text: For a covenant is valid over dead ones[b][a], since it is never in force while the one who made it is living.
translation:
  language: zh_hans
  text: 因为约是在有死亡发生的情况下才有效[a][b]；立约的人还活着时，它绝不会生效。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为遗嘱只有在人死后才有效；立遗嘱的人还活着时，遗嘱绝不会生效。”原文“约”一词也可指“遗嘱”。
    reason: alternative_reading
  - marker: b
    text: 原文此处表达十分简略，直译可作“在死者之上”。它既可能指遗嘱意义上的死者，也可能指确认约时所涉及的死亡，例如祭牲之死。
    reason: lexical_alternative
lexical_decisions:
- source_word: διαθήκη
  choice: 约
  rationale: 此词既可指“约”，也可指“遗嘱”。希伯来书8—10章以立约、献祭和血为主要语境，因此正文采用“约”，同时在脚注保留“遗嘱”这一确有依据的译法。
- source_word: ἐπὶ νεκροῖς
  choice: 在死者的情形下
  rationale: 原文表达简短且有省略，既可能指遗嘱意义上的死者，也可能指立约时死亡的祭牲。此译法在现代汉语中尚可理解，又不明确限定是哪一种死亡。
- source_word: βεβαία
  choice: 有效
  rationale: 这里强调约在法律或立约意义上具有确定的效力；“有效”比单纯的“确定”更准确自然。
- source_word: ἐπεὶ
  choice: （以分号衔接说明理由）
  rationale: 该词引出后一句对前述断言的解释。汉语以分号直接衔接，因果关系清楚，也避免连续重复“因为”。
- source_word: μήποτε
  choice: 绝不会
  rationale: 在本句中表示任何时候都不生效；“绝不会”自然地传达强烈的否定。
- source_word: ἰσχύει
  choice: 生效
  rationale: 此处指约或遗嘱开始具有实际约束力；“生效”是现代汉语中相应的惯用表达。
- source_word: ὅτε ζῇ
  choice: 还活着时
  rationale: 准确表达生命持续期间这一时间关系，并与前半句的死亡形成对照。
- source_word: ὁ διαθέμενος
  choice: 立约的人
  rationale: 配合正文采用的“约”，译作“立约的人”自然明确；若按遗嘱理解，则相应为“立遗嘱的人”，已在脚注保留。
theological_decisions:
- issue: διαθήκη在本节应译为“约”还是“遗嘱”
  choice: 正文译作“约”，脚注保留“遗嘱”的可能。
  alternative: “因为遗嘱只有在人死后才有效；立遗嘱的人还活着时，遗嘱绝不会生效。”
  rationale: 上下文整体处于摩西之约、新约、祭牲和血的立约框架中，支持“约”；但9:16—17的措辞也确实可以按遗嘱法律来理解。正文与脚注共同保留这一真实的释义张力。
- issue: ἐπὶ νεκροῖς所指的死亡
  choice: 译作“在死者的情形下”，不在正文判定死者的身份。
  alternative: “在人死后”或“有祭牲死亡时”
  rationale: 原文可被理解为立遗嘱者死亡，也可联系以祭牲之死确认约。开放式译法避免把其中一种解释直接写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“在死者的情形下”略带原文的压缩感，是为保留本节著名的语义歧义；后半句则用自然汉语“还活着时”“生效”表达。
