  text: ὅπου γὰρ διαθήκη, θάνατον ἀνάγκη φέρεσθαι τοῦ διαθεμένου·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/016.yaml
  text: For where there is a covenant[a], it is necessary for the death of the one who made it to be brought forward.
translation:
  language: zh_hans
  text: 因为哪里有约[a]，就必须提出立约之人死亡的事实。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为哪里有遗嘱，就必须确认立遗嘱的人已经死了。”希腊语“διαθήκη”既可指“约”，也可指“遗嘱”；许多人认为16—17节在这里采用的是法律意义。
    reason: 保留διαθήκη的另一种主要词义及本节常见的法律语境解读。
lexical_decisions:
- source_word: διαθήκη
  choice: 约
  rationale: 此词既可指“约”，也可指“遗嘱”。希伯来书8—10章整体以耶利米书31章和立约、献祭的论述为主，因此正文采用“约”；法律意义上的“遗嘱”保留在脚注中。
- source_word: θάνατον
  choice: 死
  rationale: 按其通常含义翻译，指立约之人的实际死亡。
- source_word: ἀνάγκη
  choice: 必须
  rationale: 自然表达原文所强调的必要性。
- source_word: φέρεσθαι
  choice: 被提出
  rationale: 保留被动不定式“被带出、被提出”的基本意象；在此语境中表示死亡必须被提出作为必要事实，避免将其过度解释为“被证实”或“发生”。
- source_word: τοῦ διαθεμένου
  choice: 立约之人
  rationale: 分词指订立或设立διαθήκη的人；“立约之人”与正文所选的“约”相呼应，同时不使用会预先限定为遗嘱法律语境的“立遗嘱人”。
- source_word: ὅπου γὰρ
  choice: 因为哪里有
  rationale: “因为”保留γάρ的解释作用，“哪里有”对应ὅπου，并保持原句的概括表达。
theological_decisions:
- issue: 希伯来书9:16中的διαθήκη应译作“约”还是“遗嘱”
  choice: 正文译作“约”，脚注保留“遗嘱”的可能意义
  alternative: 正文译作“遗嘱”：因为哪里有遗嘱，就必须确认立遗嘱的人已经死了。
  rationale: 紧邻两节存在公认的语义争议：可按继承法理解为“遗嘱”，也可承接上下文的立约与献祭论证理解为“约”。正文采用更符合希伯来书8—10章整体脉络的“约”，但借脚注明示法律意义，保留原文的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“立约之人的死就必须被提出”略带原文式的凝练和陌生感，旨在贴近φέρεσθαι的被动表达；脚注提供更自然的遗嘱法律读法。
