  to: 因为哪里有约[a]，就必须提出立约之人死亡的事实。
  rationale: 仅作必要的汉语表达调整。修订后的正文不改变“约”作为主文读法，也不将有争议的φέρεσθαι确定解释为“证明”或“生效”；“死亡的事实”使“提出”在现代标准汉语中有明确、自然的宾语，并保留该死亡须在论证中被呈现的含义。
