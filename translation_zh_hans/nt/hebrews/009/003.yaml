lexical_decisions:
- source_word: μετὰ ... τὸ δεύτερον καταπέτασμα
  choice: 第二道幔子后面
  rationale: μετά加宾格在此描述空间位置，译作“后面”比时间性的“之后”准确；καταπέτασμα指分隔圣所的内层幔子。“道”适合作幔子的量词，也保留“第二”的次序。
- source_word: δὲ
  choice: 承接语意，不另译
  rationale: δὲ在这里是轻微的承接词；汉语顺接前文时无需机械译成“而”或“但”，以免造成原文没有的强烈转折。
- source_word: σκηνὴ
  choice: 一间帐幕
  rationale: σκηνή在本段属于会幕语境，并指其中内层的一间；保留“帐幕”可呈现礼仪建筑背景，“间”则使现代汉语清楚表达这里所说的是内部空间。
- source_word: ἡ λεγομένη
  choice: 称为
  rationale: 自然、庄重地表达这个限定性分词短语，意思与“叫作”相同而语体稍正式。
- source_word: Ἅγια Ἁγίων
  choice: 至圣所
  rationale: 这是希腊语以属格表达最高级的固定圣所名称，意为最神圣之处；“至圣所”是现代中文清楚而通行的对应表达。
theological_decisions:
- issue: Ἅγια Ἁγίων这一圣所名称的译法
  choice: 至圣所
  alternative: 圣中之圣
  rationale: “至圣所”准确传达最高级含义，并明确指会幕最里面的圣所；脚注保留较贴近希腊语形式的译法，使原文措辞透明可见，而不额外加入教派解释。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“幔子”保留会幕礼仪语境；句式简洁，并让空间关系和圣所名称清楚可辨。
