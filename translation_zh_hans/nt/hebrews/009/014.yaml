source:
  edition: SBLGNT
  text: πόσῳ μᾶλλον τὸ αἷμα τοῦ Χριστοῦ, ὃς διὰ πνεύματος αἰωνίου ἑαυτὸν προσήνεγκεν ἄμωμον τῷ θεῷ, καθαριεῖ τὴν συνείδησιν ⸀ἡμῶν ἀπὸ νεκρῶν ἔργων εἰς τὸ λατρεύειν θεῷ ζῶντι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/014.yaml
  text: how much more will the blood of Messiah—who through the eternal Spirit offered himself without blemish to God—cleanse our conscience from dead works to serve the living God[a].
translation:
  language: zh_hans
  text: 更何况，弥赛亚的血——他借着永恒的灵[a]，将自己无瑕无疵地献给了上帝——岂不更能洁净我们的良心，使我们脱离死的行为，好服侍永活的上帝吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“借着一个永恒的灵”。这句话也可能指弥赛亚自己的永恒之灵，或指一种属灵而永恒的献上；正文主要理解为上帝的灵。
    reason: 保留πνεύματος αἰωνίου因无冠词而产生的真实语法与神学歧义。
lexical_decisions:
- source_word: πόσῳ μᾶλλον
  choice: 更何况……岂不更能……吗
  rationale: 保留由上一节较小之事推向较大之事的加强论证和反问语气，同时使现代汉语自然流畅。
- source_word: τὸ αἷμα τοῦ Χριστοῦ
  choice: 弥赛亚的血
  rationale: 直译“血”以保留献祭含义；Χριστός在此具有称号性质，译为“弥赛亚”。
- source_word: διὰ πνεύματος αἰωνίου
  choice: 借着永恒的灵
  rationale: 保留διά的媒介意义和原文无冠词短语的基本形式；正文将“灵”理解为圣灵，但不在正文中添加原文没有的“圣”字，并以脚注保存其他可能理解。
- source_word: ἑαυτὸν προσήνεγκεν
  choice: 将自己……献给了
  rationale: “献”符合本段祭祀语境，并保留反身代词“自己”。
- source_word: ἄμωμον
  choice: 无瑕无疵地
  rationale: 采用献祭语境中自然的表达，既指祭物没有残缺，也保留道德上无可指摘的余韵。
- source_word: καθαριεῖ τὴν συνείδησιν ἡμῶν
  choice: 洁净我们的良心
  rationale: 忠实表达将来时所陈述的结果；汉语反问结构中的“岂不更能”自然承载这一语气。“良心”是συνείδησις在本处的标准对应。
- source_word: ἀπὸ νεκρῶν ἔργων
  choice: 使我们脱离死的行为
  rationale: ἀπό表示从某物中除去或脱离；“死的行为”保留原文凝练且具有神学张力的表述，不扩写为“导致死亡的行为”。
- source_word: εἰς τὸ λατρεύειν θεῷ ζῶντι
  choice: 好服侍永活的上帝
  rationale: “好”自然表达目的；“服侍”兼容敬拜和事奉含义，不把祭祀色彩限定得过窄。“永活的上帝”是自然且庄重的汉语表达。
theological_decisions:
- issue: πνεύματος αἰωνίου所指为何
  choice: 正文作“永恒的灵”，主要理解为圣灵
  alternative: “一个永恒的灵”，可理解为弥赛亚自己的永恒之灵，或属灵且永恒的献上方式
  rationale: 原文没有冠词，语法上容许不止一种理解。上下文和早期基督教传统支持指向圣灵，但这种歧义是真实的，因此正文不加“圣”字，并在脚注交代另一种读法。
- issue: Χριστός的称号性质
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处指那位受膏者及其献祭之工，称号意义仍然鲜明；“弥赛亚”直接呈现希腊词所对应的受膏者称号。
- issue: νεκρῶν ἔργων的含义
  choice: 死的行为
  alternative: 导致死亡的行为；毫无生命的行为
  rationale: 原文可能涉及产生死亡、属于死亡或在上帝面前无生命的行为。直译能保留这种神学密度，并与希伯来书6:1的用语呼应。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。以“更何况……岂不更能……吗”呈现加强论证；将关系从句后置为第二句，以避免汉语中心语前修饰过长，同时不改变逻辑关系。脚注标记[a]已在正文相应短语后出现。
