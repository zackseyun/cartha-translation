  text: σκηνὴ γὰρ κατεσκευάσθη ἡ πρώτη ἐν ᾗ ἥ τε λυχνία καὶ ἡ τράπεζα καὶ ἡ πρόθεσις τῶν ἄρτων, ἥτις λέγεται Ἅγια·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/002.yaml
  text: For a first tabernacle was prepared[a], in which were the lampstand and the table and the bread of the Presence[b], which is called the Holy Place.
translation:
  language: zh_hans
  text: 因为预备了第一层帐幕，里面有灯台、桌子和陈设饼[a]；这一层称为“圣所”[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“饼的陈设”，也可理解为“摆在上帝面前的饼”。
    reason: lexical_alternative
  - marker: b
    text: “圣所”原文为复数形式，字面可译作“圣处”；这里指帐幕的第一层，即圣所。
    reason: lexical_alternative
lexical_decisions:
- source_word: σκηνὴ ... ἡ πρώτη
  choice: 第一层帐幕
  rationale: 本节按帐幕的前后两层展开；“第一层帐幕”既保留 σκηνή 的帐幕意象，也使此处所指的第一重空间清楚自然。
- source_word: κατεσκευάσθη
  choice: 已经预备好了
  rationale: 该被动式可指预备、设置妥当；上下文不仅涉及结构，也列举其中陈设，因此用“预备好了”比单说“建造”涵盖更广。
- source_word: λυχνία
  choice: 灯台
  rationale: 指承托油灯的圣所器具；“灯台”准确且避免让人误以为是蜡烛。
- source_word: τράπεζα
  choice: 桌子
  rationale: 以现代普通话直译圣所中的桌子，简明自然。
- source_word: ἡ πρόθεσις τῶν ἄρτων
  choice: 陈设饼
  rationale: 该短语字面涉及饼的摆放或陈列；“陈设饼”是简洁、通行且符合旧约礼仪背景的译法，同时用脚注保留其字面表达。
- source_word: Ἅγια
  choice: 圣所
  rationale: 希腊文形式为中性复数，但此处与下一节帐幕的第二层相对，实际指第一层圣室；现代中文通常称“圣所”。
theological_decisions:
- issue: Ἅγια 的复数形式与帐幕分层的关系
  choice: 圣所
  alternative: 圣处（希腊文作复数）
  rationale: 上下文把第一层与至圣所区分开来，因此正文采用惯常且清楚的空间名称“圣所”；脚注说明原文形式，以免掩盖其语法特征。
- issue: πρόθεσις τῶν ἄρτων 的礼仪含义
  choice: 陈设饼
  alternative: 饼的陈设／摆在上帝面前的饼
  rationale: “陈设饼”保留其礼仪专名性质而不额外规定神学解释；脚注交代原文字面含义及可理解的旧约背景。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“第一层帐幕”使空间层次明确；分号减少长串并列造成的歧义。所有脚注标记均置于正文相应词语之后。
