  verdict: revise
  source_fidelity: 正文正确反映SBLGNT的γενομένων为“已经临到”，并以脚注保留“将要临到”的异读；“帐幕”“不是人手所造”“不属于这个受造世界”均忠实对应原文。惟“来到，作了”容易把分词结构理解成弥赛亚在来到后才“成为”大祭司，且“经过”紧接其后仍可能被读作“来到／作大祭司”的方式，而非悬接至9:12的“进入”。
  naturalness: “作了……的大祭司”略显生硬，且“作了”带有原文未明说的就任完成意味。以破折号标出“经过……帐幕”这一跨节悬接成分，可在保持本节未完句式的同时减轻错误句法归属。
  terminology: “弥赛亚”“大祭司”“帐幕”“受造世界”均合乎现代中文圣经语体，并保留希伯来书的祭祀和创造语汇。“更完全”比“更完美”更适合对应τελειοτέρας，也较能维持本书“完全”词群的连贯性。
