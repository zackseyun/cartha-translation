  to: 但弥赛亚来到，作为已经临到的美好事物的大祭司——经过那更大、更完全、不是人手所造的帐幕，也就是说，不属于这个受造世界的帐幕——
  rationale: 将“作了”改为“作为”，避免添加就任或先后次序；将“经过……帐幕”置于破折号内，使其明确保持为延续到9:12主要动词的跨节成分。另以“更完全”对应τελειοτέρας，并保留希伯来书相关词汇的连贯性。
