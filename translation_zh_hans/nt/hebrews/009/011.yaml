  text: Χριστὸς δὲ παραγενόμενος ἀρχιερεὺς τῶν ⸀γενομένων ἀγαθῶν διὰ τῆς μείζονος καὶ τελειοτέρας σκηνῆς οὐ χειροποιήτου, τοῦτ’ ἔστιν οὐ ταύτης τῆς κτίσεως,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/011.yaml
  text: But the Messiah came as high priest of the good things that have come[a], through the greater and more perfect tabernacle not made by hands—that is[b], not of this creation—
translation:
  language: zh_hans
  text: 但弥赛亚来到，作为已经临到的美好事物的大祭司——经过那更大、更完全、不是人手所造的帐幕，也就是说，不属于这个受造世界的帐幕——
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Χριστὸς
  choice: 弥赛亚
  rationale: 此处突出受膏者的职分，采用“弥赛亚”保留称号意义。
- source_word: δὲ
  choice: 但
  rationale: 承接前文地上帐幕及祭司职事，并引出基督工作的对比。
- source_word: παραγενόμενος
  choice: 来到，作了
  rationale: 表达分词所指的到来及其以大祭司身份出现；中文拆分后更自然，同时不把“经过帐幕”误解为他来到的方式。
- source_word: ἀρχιερεὺς
  choice: 大祭司
  rationale: 这是希伯来书中该祭司职分的标准中文表达。
- source_word: τῶν γενομένων ἀγαθῶν
  choice: 已经临到的美好事物
  rationale: 紧随SBLGNT的γενομένων，表示这些福分已经来到，同时保留较概括的“美好事物”，不擅自具体化。
- source_word: διὰ τῆς ... σκηνῆς
  choice: 经过那……帐幕
  rationale: διά加属格在此宜作空间性的“经过”；该短语在跨节句法上通向下一节的主要动词。“帐幕”保留旷野圣所的互文意象。
- source_word: μείζονος
  choice: 更大
  rationale: 既可包含规模，也主要表达超越性，中文保留原文比较级的开放性。
- source_word: τελειοτέρας
  choice: 更完美
  rationale: 保留希伯来书中“完全/完美”词群的神学呼应及比较级形式。
- source_word: οὐ χειροποιήτου
  choice: 不是人手所造的
  rationale: 采用自然且具有圣经语体的表达，突出它并非人制造。
- source_word: τοῦτ’ ἔστιν
  choice: 也就是说
  rationale: 自然标明后文是对前述帐幕的解释。
- source_word: οὐ ταύτης τῆς κτίσεως
  choice: 不属于这个受造世界的
  rationale: “受造世界”清楚表达κτίσις所指的受造秩序，并以“不属于”自然传达属格关系。
theological_decisions:
- issue: τῶν γενομένων ἀγαθῶν的文本异读与时间指向
  choice: 已经临到的美好事物
  alternative: 将要临到的美好事物
  rationale: 正文依据SBLGNT的γενομένων，保留福分已经来到的实现性指向；μελλόντων这一重要异读则列入脚注，不将两者调和。
- issue: διὰ τῆς……σκηνῆς的句法归属
  choice: 用逗号和节末破折号使“经过……帐幕”保持悬接，等待9:12的主要动词
  alternative: 把它理解为弥赛亚“来到”的途径
  rationale: 希腊文跨至下一节才出现主要动词εἰσῆλθεν；此排法避免误导读者以为弥赛亚是借着帐幕才来到或成为大祭司，同时保留本节未完句式。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“帐幕”“大祭司”等词保留希伯来书的祭祀与旧约背景。正文维持跨节未完句，以反映希腊文句法；不另设英文脚注b，因为其内容只是先前译法说明，并非原文异读或中文正文所需的解释。
