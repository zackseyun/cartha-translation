  yaml_path: translation/nt/hebrews/009/022.yaml
  text: And according to the law[a], almost everything is cleansed with blood, and without the shedding of blood there is no forgiveness.
translation:
  language: zh_hans
  text: 按照律法，几乎一切都要用血洁净；不流血，就没有赦免[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赦免”也可译作“免除”或“释放”；希腊词可指使人脱离债务、罪责或束缚，此处语境指罪得赦免。
    reason: lexical_alternative
lexical_decisions:
- source_word: σχεδόν
  choice: 几乎
  rationale: 保留副词对陈述范围的限定，表明律法之下并非绝对所有洁净礼都涉及血。
- source_word: ἐν αἵματι
  choice: 用血
  rationale: ἐν在此表示手段；“用血”在现代汉语中自然，也准确传达礼仪性洁净所采用的媒介。
- source_word: πάντα
  choice: 一切
  rationale: 中性复数在此概括相关事物或礼仪事项；与“几乎”连用，既简洁又保留原文的广泛概括。
- source_word: καθαρίζεται
  choice: 都是……洁净的
  rationale: 以被动表达律法之下惯常发生的礼仪性洁净，并保留“洁净”在上下文中的礼仪和神学意味。
- source_word: κατὰ τὸν νόμον
  choice: 按照律法
  rationale: κατά表示依照或符合律法的规定；此译法透明自然，不额外限定为某种神学体系。
- source_word: χωρὶς αἱματεκχυσίας
  choice: 若不流血
  rationale: 将“没有／离开流血”自然转化为汉语条件式表达；“流血”简洁保留献祭中血被倾倒或舍出的意象。
- source_word: οὐ γίνεται
  choice: 就没有
  rationale: γίνεται与抽象名词连用，表示某事不会发生或不存在；“就没有”与前面的条件句衔接自然。
- source_word: ἄφεσις
  choice: 赦免
  rationale: 该词可表示释放、免除或宽赦；在本段献祭与罪的语境中，“赦免”准确而庄重，同时不必在正文中补出原文未明说的“罪”。
theological_decisions:
- issue: 献祭语境中ἄφεσις的译法
  choice: 赦免
  alternative: 释放；免除
  rationale: 上下文指向罪得赦免，但该名词本身具有释放、免除和宽赦的语义范围。正文采用符合语境的“赦免”，脚注则保留其较宽的词义，避免把特定教义体系带入译文。
- issue: “不流血，就没有赦免”的陈述范围
  choice: 保留原文简洁而绝对的措辞
  alternative: 补译为“若不献祭流血，罪就不能得赦免”
  rationale: 原文没有明确补出“献祭”“罪”或受赦免者；其具体含义由上下文提供。保留简洁措辞可维持作者论证中的张力，避免译者擅自收窄命题。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“按照律法”置于句首以形成清楚的论述框架；分号保留原文两个并列分句之间紧密而递进的关系。脚注标记放在其实际说明的“赦免”之后。
