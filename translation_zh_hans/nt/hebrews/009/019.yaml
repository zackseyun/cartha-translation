  text: λαληθείσης γὰρ πάσης ἐντολῆς κατὰ ⸀τὸν νόμον ὑπὸ Μωϋσέως παντὶ τῷ λαῷ, λαβὼν τὸ αἷμα τῶν ⸀μόσχων μετὰ ὕδατος καὶ ἐρίου κοκκίνου καὶ ὑσσώπου αὐτό τε τὸ βιβλίον καὶ πάντα τὸν λαὸν ἐράντισεν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/019.yaml
  text: For when every commandment according to the law had been spoken by Moses to all the people[a], he took the blood of the calves with water and scarlet wool and hyssop, and sprinkled both the scroll itself and all the people,
translation:
  language: zh_hans
  text: 因为摩西照着律法把每一条诫命都向全体百姓宣讲了以后，就取了牛犊的血[a]，连同水、朱红色的羊毛和牛膝草，把血洒在书卷本身和全体百姓身上，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“小公牛”。希腊语μόσχων在献祭语境中既可指牛犊，也可指年幼的公牛。
    reason: lexical_alternative
lexical_decisions:
- source_word: λαληθείσης γὰρ πάσης ἐντολῆς
  choice: 因为……宣讲了每一条诫命以后
  rationale: 将属格独立结构自然地译作时间背景，并保留γάρ的因果衔接和πάσης的逐项、全数含义。用“宣讲”表达诫命被公开传达给百姓，而不把ἐντολή泛化为抽象的“律法”。
- source_word: κατὰ τὸν νόμον
  choice: 按照律法
  rationale: 准确表达κατά加宾格所表示的依据或规范，措辞简洁自然。
- source_word: ὑπὸ Μωϋσέως παντὶ τῷ λαῷ
  choice: 摩西……向全体百姓
  rationale: 汉语改用主动句，清楚保留摩西为施事者、全体百姓为听众。
- source_word: λαβὼν τὸ αἷμα τῶν μόσχων
  choice: 便取了牛犊的血
  rationale: 把分词按叙事次序译为限定动词；μόσχος直译为“牛犊”，其祭牲语境中的另一可能译法另见脚注。
- source_word: μετὰ ὕδατος καὶ ἐρίου κοκκίνου καὶ ὑσσώπου
  choice: 连同水、朱红色羊毛和牛膝草
  rationale: “连同”体现μετά所表达的伴随关系；“朱红色羊毛”保留原文的材质和颜色，“牛膝草”采用通行且易懂的礼仪用语。
- source_word: αὐτό τε τὸ βιβλίον καὶ πάντα τὸν λαὸν
  choice: 经卷本身和全体百姓
  rationale: “经卷”符合古代书写载体，避免现代装订书籍的联想；“本身”保留αὐτό的强调，且完整表达τε……καί的并列结构。
- source_word: ἐράντισεν
  choice: 把血洒在……身上
  rationale: “洒”准确而通俗地表达礼仪性的ῥαντίζω；补出语境中明确的“血”，使汉语宾语和动作落点清楚，并未增加新的仪式信息。
theological_decisions:
- issue: 本节与《出埃及记》24章叙事的关系
  choice: 按《希伯来书》现有希腊文本翻译，不为使其与旧约叙事逐项一致而增删细节
  alternative: 按照《出埃及记》的祭牲术语改译或补充仪式背景
  rationale: 本节是对旧约仪式的浓缩陈述，译文应保留作者自己的措辞和叙述方式，不作协调性扩写。
- issue: μόσχων所指祭牲的年龄与性别
  choice: 正文译作“牛犊”，脚注保留“小公牛”的可能性
  alternative: 正文译作“小公牛”
  rationale: 该词可指牛犊，在祭牲语境中也可特指年幼的公牛；正文采用较直接且不额外限定性别的译法，同时不掩盖另一合理理解。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“全体百姓”“经卷本身”等措辞兼顾准确与自然。保留句末逗号，以反映本节在原段落中尚未完结的句法关系。
