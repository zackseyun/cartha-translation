  to: 这些只涉及食物、饮料和各种洗濯；它们是有关肉身的条例，加在人身上，直到整顿的时期。
  rationale: 修订明确区分食物与饮料，保留βαπτισμοί的礼仪洗涤含义；以“有关肉身的”避免将σαρξ不当地限定为伦理性的“肉体”；并以“加在人身上”体现ἐπικείμενα的被动约束意义。“整顿的时期”保留διορθώσεως所含纠正、重整的概括性，不将其锁定为特定教义性事件。
