  text: μόνον ἐπὶ βρώμασιν καὶ πόμασιν καὶ διαφόροις βαπτισμοῖς, ⸀δικαιώματα σαρκὸς μέχρι καιροῦ διορθώσεως ἐπικείμενα.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/010.yaml
  text: concerned only with foods and drinks and various washings, fleshly regulations imposed until the time of reformation.
translation:
  language: zh_hans
  text: 这些只涉及食物、饮料和各种洗濯；它们是有关肉身的条例，加在人身上，直到整顿的时期。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βρώμασιν καὶ πόμασιν
  choice: 饮食、饮料
  rationale: 分别对应食物与饮品；用现代汉语并列名词，简洁自然。
- source_word: διαφόροις βαπτισμοῖς
  choice: 各种洗濯
  rationale: 本处指礼仪性的多种洁净洗涤，不宜径译为通常指基督教仪式的“洗礼”；“洗濯”保留礼仪语感。
- source_word: δικαιώματα σαρκὸς
  choice: 属肉体的条例
  rationale: 保留“肉体”这一神学张力，并将 δικαιώματα 译为具有规范性质的“条例”，不擅自解释成仅属外在或身体方面。
- source_word: καιροῦ διορθώσεως
  choice: 整顿的时候
  rationale: διόρθωσις 含纠正、使之归正或重整之意；“整顿”既传达变革与恢复秩序，也避免预先锁定为宗教改革或万物复兴。
- source_word: ἐπικείμενα
  choice: 施行
  rationale: 在条例语境中表达其加在人身上、具有约束效力；与“到……为止”搭配自然。
theological_decisions:
- issue: σάρξ 在“δικαιώματα σαρκὸς”中的含义
  choice: 属肉体的条例
  alternative: 有关身体的条例
  rationale: 直译保留作者“肉体”用语及其可能包含的神学张力，不将其缩窄为单纯身体卫生规定。
- issue: διόρθωσις 所指的救赎历史节点
  choice: 整顿的时候
  alternative: 改革的时候／更新的时候
  rationale: 原词可指纠正、重整或恢复正序；正文保留概括性，不明确添加“新约建立”等解释。
- issue: μόνον 的修饰范围
  choice: 这些不过涉及……
  alternative: 只在于……
  rationale: 承接上一节所说的礼物和祭物及相关礼仪体系，表达其局限性，同时不硬性断定 μόνον 只修饰某一个并列项目。
translation_notes:
  register: 采用现代、庄重且普通读者可懂的表达。“洗濯”略带礼仪书面色彩，用以区别“洗礼”；“整顿的时候”刻意保留原文所指时间与性质的概括性。
