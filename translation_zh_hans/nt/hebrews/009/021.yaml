base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/021.yaml
  text: And likewise he sprinkled with the blood both the tabernacle and all the vessels of the ministry[a][b].
translation:
  language: zh_hans
  text: 他也照样把血洒在会幕[a]和一切事奉用的器具[b]上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “会幕”所译的希腊语也可译作“帐幕”；这里指神圣的会幕。
    reason: lexical_alternative
  - marker: b
    text: 或译：“一切事奉用的物件”。
    reason: lexical_alternative
lexical_decisions:
- source_word: σκηνή
  choice: 会幕
  rationale: 本词本义可指帐篷，但在本章摩西礼仪的语境中指神圣的会幕；“会幕”是现代中文中准确、自然的表达。
- source_word: σκεύη
  choice: 器具
  rationale: 指用于会幕事奉的各类物件或用具；“器具”既保留具体性，也符合礼仪语境。
- source_word: λειτουργία
  choice: 事奉
  rationale: 这里指祭司性的神圣礼仪职事；“事奉”在现代中文中简明易懂，又保留宗教语域。
- source_word: αἷμα
  choice: 血
  rationale: 上下文明确指献祭之血，应直接翻译，不作释义性改写。
- source_word: ὁμοίως
  choice: 照样
  rationale: 承接前文所述的洒血行动，表达“以同样方式”的比较和连接作用。
- source_word: ῥαντίζω
  choice: 洒
  rationale: 准确表达礼仪中把血洒在对象上的动作，也是现代中文圣经语境中自然清楚的说法。
- source_word: δὲ
  choice: 也
  rationale: 此处主要发挥轻微的连接和递进作用，并非强烈转折；与前后两个 καί 一并自然表达为“也”。
- source_word: πάντα τὰ σκεύη
  choice: 一切……器具
  rationale: 保留 πάντα 所强调的全面范围，中文表达自然。
theological_decisions:
- issue: 本节与《出埃及记》中摩西礼仪记载的关系
  choice: 按本节原文直接译为摩西把血洒在会幕及其全部事奉器具上，不在正文中补充或协调历史细节。
  alternative: 扩写经文，以解释其礼仪背景或协调与《出埃及记》相关记载的细节差异。
  rationale: 本节是作者对礼仪性分别为圣或洁净行动的概述；译文应保留原文陈述及其张力，而不加入原文没有的解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“会幕”和“事奉”保留圣所礼仪语境，同时避免过度技术化；语序以自然中文表达希腊文的洒血动作及其两个对象。
