revisions:
- from: 因此，他是新约[a]的中保，为要借着他的死，救赎人在前约之下所犯的过错，使那些蒙召的人可以领受所应许的永恒产业。
  to: 因此，他是新约[a]的中保，为要使那些蒙召的人得以领受永恒产业的应许；他已经受死，为的是救赎人在前约之下所犯的过犯。
  rationale: 修订保留“新约／前约”的对照及“中保”等核心术语，将παραβάσεις准确译为“过犯”，并恢复“领受永恒产业的应许”这一较贴近原文的表达。句子将死亡已经发生、死亡为救赎过犯的目的，以及蒙召者领受应许之间的关系清楚呈现，同时不把“死亡”过度处理为仅仅的工具性手段。脚注保留διαθήκη在本节以“约”为主、而在后文可引出“遗嘱”语义的张力。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T03:56:39Z'
review_pass:
  verdict: revise
  source_fidelity: 正文将τὴν ἐπαγγελίαν τῆς αἰωνίου κληρονομίας译为“所应许的永恒产业”，把“应许”所指的内容直接表述为实际领受的产业，弱化了原文明确的“领受……的应许”。此外，“过错”较弱，未充分表达παραβάσεων（对规范、约定的违犯）的含义。死亡的施事虽可依上下文指向基督，但原文的属格独立结构首先陈述“死亡已经发生”，宜用较少解释性的表达。
  naturalness: 原译整体通顺，庄重且符合现代标准汉语。不过“为要借着他的死，救赎……，使……”的修饰关系略显拥挤；将死亡及其救赎目的另行清楚表达，可使逻辑更自然。
  terminology: “新约”“中保”“蒙召”“产业”均合乎本段的通行且庄重的汉语圣经用语。应将“过错”改为“过犯”，以保留παραβάσεις的较强伦理和约法意味；“永恒产业的应许”应保留“应许”这一名词及其与产业的属格关系。
  issues:
  - severity: medium
    issue: “所应许的永恒产业”未保留“领受……的应许”的表述。
    rationale: τὴν ἐπαγγελίαν为“应许”，并由τῆς αἰωνίου κληρονομίας限定。原译将应许实现的对象直接作为领受物，虽合语境，却比原文更具解释性。
  - severity: medium
    issue: “过错”弱化了παραβάσεων。
    rationale: παράβασις指逾越、违犯，尤其适于与“前约”相连的语境；“过犯”在现代汉语中更准确。
  - severity: low
    issue: “借着他的死”将θανάτου γενομένου明确工具化并补足死亡者。
    rationale: 上下文确实指向基督，但原文形式是“既已有死亡发生”的属格独立结构。改为“他已经受死，为的是……”既保持语境所指，也较清楚地呈现死亡发生及其救赎目的。
  revised_text: 因此，他是新约[a]的中保，为要使那些蒙召的人得以领受永恒产业的应许；他已经受死，为的是救赎人在前约之下所犯的过犯。
