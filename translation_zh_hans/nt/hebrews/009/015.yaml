id: HEB.9.15
reference: Hebrews 9:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ διὰ τοῦτο διαθήκης καινῆς μεσίτης ἐστίν, ὅπως θανάτου γενομένου εἰς ἀπολύτρωσιν τῶν ἐπὶ τῇ πρώτῃ διαθήκῃ παραβάσεων τὴν ἐπαγγελίαν λάβωσιν οἱ κεκλημένοι τῆς αἰωνίου κληρονομίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/015.yaml
  text: And for this reason he is the mediator of a new covenant[a], so that, since a death has occurred for the redemption of the transgressions committed under the first covenant, those who have been called may receive the promise of the eternal inheritance.
translation:
  language: zh_hans
  text: 因此，他是新约[a]的中保，为要使那些蒙召的人得以领受永恒产业的应许；他已经受死，为的是救赎人在前约之下所犯的过犯。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “约”也可译作“遗嘱”。希腊语διαθήκη可兼有这两种含义；本节与“前约”对照，因此正文译作“约”，但9:16–17会进一步运用“遗嘱”这一层含义。
    reason: 保留原词的语义重叠及后文展开的解释张力。
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: 因此
  rationale: 承接上文并表明因果关系；现代汉语中简洁自然。
- source_word: διαθήκης καινῆς
  choice: 新约
  rationale: 本节与“前约”形成明确对照，盟约义为主；同时以脚注保留“遗嘱”的语义可能。
- source_word: μεσίτης
  choice: 中保
  rationale: 准确表达居间促成双方关系的人，也是中文圣经语境中庄重而通行的用语。
- source_word: ὅπως
  choice: 为要……使
  rationale: 保留目的或预期结果的语气，并使较长句子的逻辑层次清楚。
- source_word: θανάτου γενομένου
  choice: 借着他的死
  rationale: 属格独立结构表明死亡已经发生，并构成救赎的基础；补出“他的”所指为上文的基督，使中文自然，但不改变明确语境。
- source_word: ἀπολύτρωσιν
  choice: 救赎
  rationale: 兼具释放与付出代价的含义，符合本段献祭语境。
- source_word: τῶν ἐπὶ τῇ πρώτῃ διαθήκῃ παραβάσεων
  choice: 人在前约之下所犯的过错
  rationale: “在……之下”表达ἐπί加与格所指的约之管辖或时期；补入“人”和“所犯”以符合汉语表达。
- source_word: τὴν ἐπαγγελίαν ... τῆς αἰωνίου κληρονομίας
  choice: 所应许的永恒产业
  rationale: 将希腊语“领受永恒产业的应许”按自然汉语表达为领受所应许的产业，同时保留应许与产业的关系。
- source_word: οἱ κεκλημένοι
  choice: 那些蒙召的人
  rationale: “蒙召”保留完成时被动分词的受动含义及持续状态，且通俗可懂。
- source_word: τῆς αἰωνίου κληρονομίας
  choice: 永恒产业
  rationale: “永恒”准确表达αἰώνιος，“产业”保留继承所得之物的语义。
theological_decisions:
- issue: ἐστίν隐含主语的所指
  choice: 以“他”明示，指上文的基督
  alternative: 不补主语，或直接译为“基督”
  rationale: 现代汉语需要明确主语；上文所指清楚。用“他”避免在本节直接加入原文未重复出现的称谓。
- issue: διαθήκη在本节的含义
  choice: 正文译为“约”
  alternative: 译为“遗嘱”
  rationale: 本节“新约”与“前约”的对照显示盟约义居主导地位，但9:16–17利用了该词可指遗嘱的语义，因此以脚注保留这一张力。
- issue: θανάτου γενομένου中死亡者的身份
  choice: 译作“他的死”，指中保基督的死
  alternative: 较形式地译作“既然有死亡发生”
  rationale: 紧接的上下文清楚指向基督借自己的死成就救赎；补出代词使汉语避免生硬，但不额外加入专名。
- issue: ἐπαγγελία与κληρονομία的关系
  choice: 译作“领受所应许的永恒产业”
  alternative: 译作“领受永恒产业的应许”
  rationale: 两种句法表达都可能传达原意；所选译法在现代汉语中更自然，并清楚表明蒙召者最终领受的是应许所指的产业。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“中保”“蒙召”“产业”保留必要的圣经神学词汇；通过“为要……使……”清楚呈现原句的目的结构。
