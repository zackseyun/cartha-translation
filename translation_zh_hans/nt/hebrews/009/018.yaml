  text: ὅθεν οὐδὲ ἡ πρώτη χωρὶς αἵματος ἐγκεκαίνισται·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/018.yaml
  text: Therefore not even the first covenant was inaugurated without blood[a].
translation:
  language: zh_hans
  text: 所以，就连第一个约也不是不用血就设立的[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“第一个”，即第一个约。原文没有重复“约”字；有些译法按照前文该词的另一种含义译作“第一份遗嘱”。
    reason: 说明原文省略的名词及“约／遗嘱”的语义可能性。
lexical_decisions:
- source_word: ὅθεν
  choice: 所以
  rationale: 表示由上文关于约、死亡与血的论述所得出的结论；“所以”自然、清楚地保留推论关系。
- source_word: οὐδὲ
  choice: 就连……也不是
  rationale: 保留该否定词的强调作用，指出这原则甚至也适用于第一个约。
- source_word: ἡ πρώτη
  choice: 第一个约
  rationale: 原文只有阴性实词化形容词“第一个”，所指名词需由语境补足；本章上下文及出埃及记24章的背景表明这里指第一个约。
- source_word: χωρὶς αἵματος
  choice: 不用血
  rationale: 自然表达“没有血、离开血便不能”的意思，同时保留立约礼仪中血的关键作用。
- source_word: ἐγκεκαίνισται
  choice: 设立
  rationale: 该完成时被动态可指正式开始、启用或奉献。这里的“设立”适合约的语境，又不把含义过度限定为纯法律意义上的批准；句中用过去表达符合现代汉语叙事习惯。
theological_decisions:
- issue: “第一个”所指为何
  choice: 第一个约
  alternative: 第一个；第一项安排；第一份遗嘱
  rationale: 原文省略了名词，保留一定语法含蓄性虽有依据，但汉语单说“第一个”会晦涩。希伯来书9章的近远语境以及对出埃及记24章的暗引更支持“第一个约”。“遗嘱”可反映前文 διαθήκη 的语义张力，却不适合本节以血设立西奈之约的具体背景。
- issue: ἐγκεκαίνισται 的礼仪与法律色彩
  choice: 设立
  alternative: 启用；奉献；批准生效
  rationale: “设立”兼顾约被正式开启并付诸实行的含义，不把经文只理解为礼仪奉献或法律批准。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“就连……也不是”传达 οὐδὲ 的强调；“不用血就设立”保持原句简洁，并保留血与立约之间的神学张力。
