id: HEB.9.5
reference: Hebrews 9:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὑπεράνω δὲ αὐτῆς Χερουβὶν δόξης κατασκιάζοντα τὸ ἱλαστήριον· περὶ ὧν οὐκ ἔστιν νῦν λέγειν κατὰ μέρος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/005.yaml
  text: And above it were the cherubim of glory overshadowing the atoning sacrifice[a]; about these things it is not now possible to speak in detail.
translation:
  language: zh_hans
  text: 约柜上方有荣耀的基路伯，遮蔽着施恩座[a]。这些事现在不能一一细说。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “施恩座”指约柜的盖，也可译作“赎罪盖”；原词与赎罪、施恩有关。
    reason: 说明本节中ἱλαστήριον的具体器物所指，并保留其祭仪和神学语义。
lexical_decisions:
- source_word: ὑπεράνω δὲ αὐτῆς
  choice: 约柜上方
  rationale: αὐτῆς承接上文的约柜；汉语明确重复所指，比直译“它上方”自然清楚。δὲ在此为叙述推进，不必机械译出。
- source_word: Χερουβὶν δόξης
  choice: 荣耀的基路伯
  rationale: 保留紧凑的属格表达及其可能张力，可指与神荣耀相关的基路伯，也可带有荣耀特征；不扩写为某一解释。
- source_word: κατασκιάζοντα
  choice: 遮蔽着
  rationale: 现在分词描写基路伯在施恩座上方展开遮覆的状态；“遮蔽着”自然且保留持续性。
- source_word: τὸ ἱλαστήριον
  choice: 施恩座
  rationale: 本节具体描述约柜及其上方的基路伯，所指是约柜的盖；“施恩座”是现代中文圣经语境中可辨识的器物名称，也保留赎罪与施恩的祭仪关联。
- source_word: περὶ ὧν
  choice: 这些事
  rationale: 概括指向刚才列举的会幕陈设，符合现代汉语表达。
- source_word: οὐκ ἔστιν νῦν λέγειν κατὰ μέρος
  choice: 现在不能一一细说
  rationale: κατὰ μέρος表示逐项、详细地讲述；译文简洁自然，并保留作者暂不展开的修辞语气。
theological_decisions:
- issue: ἱλαστήριον在圣所器物语境中的译法
  choice: 施恩座
  alternative: 赎罪祭；赎罪之处（或赎罪盖）
  rationale: 原文在此明确谈论约柜上被基路伯遮蔽的实体，因此器物义“施恩座”最符合直接语境。该词同时具有赎罪、平息与施恩的祭仪内涵，脚注说明其为约柜盖并保留“赎罪盖”的可能表达，不将它抽象化为一次“祭物”。
- issue: δόξης与基路伯的关系
  choice: 荣耀的基路伯
  alternative: 荣光中的基路伯；荣耀非凡的基路伯
  rationale: 希腊文属格关系较凝练，可能表示基路伯与神荣耀的关联，也可能具有描述性质；直译式表达避免限定为单一神学解释。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“基路伯”“施恩座”为读者熟悉的圣经术语；句式简洁，保留原文叙述与暂不详论的语气。
