base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/001.yaml
  text: Even the first covenant had regulations for worship and an earthly sanctuary[a][b].
translation:
  language: zh_hans
  text: 前约[a]确有敬拜的规例和属地的圣所[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“第一（个）”，这里理解为前约；也有人较宽泛地理解为“前一种安排”。
    reason: alternative_reading
  - marker: b
    text: 或译“属世的圣所”；这里很可能是指“属地的”，与本章后文所说天上的实在相对。
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶχε
  choice: 有
  rationale: 未完成时在这里引出对先前安排的描述；汉语用“有”自然表达其拥有这些规例和圣所。
- source_word: μὲν οὖν
  choice: 这样……也
  rationale: 该组合承接上文并带轻微强调；“这样”体现论述推进，“也”传达附加或让步性的强调，同时避免生硬直译。
- source_word: ἡ πρώτη
  choice: 前一个约
  rationale: 希腊文只明说“前一个”，但阴性形式最自然地回指8:13的“约”；补出“约”使汉语清楚，“前一个”也比“第一约”更自然。
- source_word: δικαιώματα
  choice: 规例
  rationale: 此词在礼仪语境中指规范敬拜的条例或规定；“规例”简洁且保留法律—礼仪色彩。
- source_word: λατρείας
  choice: 敬拜
  rationale: 这里指礼仪性的事奉或敬拜；“敬拜”在现代汉语中清楚自然。
- source_word: τό τε ἅγιον
  choice: 圣所
  rationale: 该短语指神圣的敬拜场所；下文才进一步说明帐幕各部分，因此此处采用范围较宽的“圣所”。
- source_word: κοσμικόν
  choice: 属地的
  rationale: 这里与本章后文的天上实际形成对照；“属地的”表达其属于现世、地上的性质，避免“属世的”可能带来的道德贬义。
theological_decisions:
- issue: ἡ πρώτη所省略名词的所指
  choice: 前一个约
  alternative: 前一个；前一种安排；第一个帐幕
  rationale: 紧接第8章新约与前一个约的对比，最可能省略的是“约”。正文补出所指以便理解，同时以脚注保留原文省略及较宽泛的理解。
- issue: κοσμικόν的含义
  choice: 属地的
  alternative: 属世的；世界上的
  rationale: 上下文的重点是地上圣所与天上实际之间的对照，并非道德上的属灵与世俗之别；“属地的”可避免暗示圣所本身有道德污点。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“这样”承接上文论证；“前一个约”避免“第一约”可能产生的编号感；“一处”符合汉语对具体场所的表达。所有脚注标记均置于正文相应词语之后。
