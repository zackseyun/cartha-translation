  text: ἥτις παραβολὴ εἰς τὸν καιρὸν τὸν ἐνεστηκότα, καθ’ ⸀ἣν δῶρά τε καὶ θυσίαι προσφέρονται μὴ δυνάμεναι κατὰ συνείδησιν τελειῶσαι τὸν λατρεύοντα,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/009.yaml
  text: which is a parable for the present time[a], according to which both gifts and sacrifices are offered that are not able to perfect the worshiper with respect to conscience,
translation:
  language: zh_hans
  text: 这帐幕是现今时期的一个象征[a]；按这一安排，所献的供物和祭物都不能使敬拜者在良心方面得以完全。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “象征”也可译作“比喻”或“表样”。
    reason: 保留 παραβολή 在本祭仪语境中的其他合理译法；“比喻”较贴近词形，但在现代汉语正文中较容易被理解为叙事性的譬喻。
lexical_decisions:
- source_word: ἥτις
  choice: 这帐幕是
  rationale: 关系代词回指上文的前一个帐幕；中文补出“帐幕”，使指代清楚，同时保持与上文的解释关系。
- source_word: παραβολὴ
  choice: 比喻
  rationale: 保留该词“比喻性对应”的基本意义及希伯来书此处的预表张力；脚注列出本语境中也合适的译法。
- source_word: εἰς τὸν καιρὸν τὸν ἐνεστηκότα
  choice: 现今时期的
  rationale: 表达当下已经来到、正在延续的时期，不将其具体限定为某一种神学时代划分。
- source_word: καθ’ ἣν
  choice: 按这安排
  rationale: 关系代词可能关联比喻所指的帐幕安排；“按这安排”比生硬的“按照它”更符合现代汉语，并避免误指“时期”。
- source_word: δῶρά τε καὶ θυσίαι
  choice: 礼物和祭物
  rationale: 保留两个并列的礼仪用语；“礼物”对应一般献礼，“祭物”对应献祭。
- source_word: προσφέρονται
  choice: 所献上的
  rationale: 以现在时被动含义描述礼仪中持续进行的奉献，嵌入中文句式后自然简洁。
- source_word: μὴ δυνάμεναι
  choice: 都不能
  rationale: 明确表达礼物和祭物本身无力实现下述结果；“都”照应两个并列主语。
- source_word: κατὰ συνείδησιν
  choice: 在良心上
  rationale: 限定“达到完全”所涉及的层面，不把意思缩减为主观真诚或心理感受。
- source_word: τελειῶσαι
  choice: 使……达到完全
  rationale: 保留希伯来书中“达到预定的完整状态、合宜地来到神面前”的重要词义，同时比单说“使……完全”更自然。
- source_word: τὸν λατρεύοντα
  choice: 敬拜的人
  rationale: 指参与礼仪敬拜的单数个体；译文自然，也保留宗教礼仪语境。
theological_decisions:
- issue: 祭仪语境中 παραβολή 的译法
  choice: 比喻
  alternative: 象征；表样
  rationale: “比喻”保留原词所表达的对应和表征关系，不把帐幕仅化约为抽象符号；其他合理译法置于脚注。
- issue: κατὰ συνείδησιν 所限定的范围
  choice: 在良心上达到完全
  alternative: 使敬拜者的良心得以完全
  rationale: 将“良心”理解为达到完全所涉及的方面，而不擅自把良心改作直接宾语，从而保存希腊文的句法和神学张力。
- issue: “现今时期”的时间指向
  choice: 保持为“现今时期”
  alternative: 现今世代；当时的时期
  rationale: 原文从作者论述视角指正在来到或当前有效的时期；译文不进一步断定其起止或教义性时代划分。
translation_notes:
  register: 采用现代、庄重且易懂的简体中文。“这帐幕”承接上文；分号呈现解释与祭仪实践之间的推进。“达到完全”保留 τελειόω 在希伯来书中的神学分量，避免译成仅指情绪安宁或主观无愧的表达。
