source:
  edition: SBLGNT
  text: χρυσοῦν ἔχουσα θυμιατήριον καὶ τὴν κιβωτὸν τῆς διαθήκης περικεκαλυμμένην πάντοθεν χρυσίῳ, ἐν ᾗ στάμνος χρυσῆ ἔχουσα τὸ μάννα καὶ ἡ ῥάβδος Ἀαρὼν ἡ βλαστήσασα καὶ αἱ πλάκες τῆς διαθήκης,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/004.yaml
  text: having the golden censer[a], and the ark of the covenant covered on all sides with gold, in which were a golden jar holding the manna, Aaron’s staff that budded, and the tablets of the covenant,
translation:
  language: zh_hans
  text: 那里有金香坛[a]，还有四面包金的约柜；柜里有盛着吗哪的金罐、亚伦那根发过芽的杖，以及约版。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“金香炉”。希腊语θυμιατήριον可指焚香用的器具，也可指香坛；此处所指存在争议。
    reason: 保留词义与历史解释上的真实歧义。
lexical_decisions:
- source_word: χρυσοῦν ἔχουσα θυμιατήριον
  choice: 那里有金香坛[a]
  rationale: θυμιατήριον可指焚香器具或香坛；在会幕陈设的语境中，主文采用自然且可能性较高的“香坛”，并以脚注保留“金香炉”。χρυσοῦν译作“金”，表达金制或包金的性质。
- source_word: τὴν κιβωτὸν τῆς διαθήκης
  choice: 约柜
  rationale: “约柜”是现代汉语圣经语境中准确、通行的名称，既保留διαθήκη“约”的含义，也清楚指向神圣的柜。
- source_word: περικεκαλυμμένην πάντοθεν χρυσίῳ
  choice: 四面包金的
  rationale: περικεκαλυμμένην与πάντοθεν共同强调各面均被金覆盖；“四面包金”简洁自然，并保留全面覆盖之意。
- source_word: ἐν ᾗ
  choice: 柜里有
  rationale: 关系代词的先行词是约柜；译为“柜里有”明确所指，并自然引出后面的多个物件。
- source_word: στάμνος χρυσῆ ἔχουσα τὸ μάννα
  choice: 盛着吗哪的金罐
  rationale: στάμνος指罐或坛；“金罐”通俗准确。ἔχουσα在此自然译为“盛着”。
- source_word: ἡ ῥάβδος Ἀαρὼν ἡ βλαστήσασα
  choice: 亚伦那根发过芽的杖
  rationale: ῥάβδος译为“杖”符合语境；“发过芽”表达βλαστήσασα所指已经发生的著名事件，“那根”使定语关系在汉语中更清楚。
- source_word: αἱ πλάκες τῆς διαθήκης
  choice: 约版
  rationale: πλάκες是版或石版，διαθήκη是约；“约版”简洁保留原文，且不把本节未明说的材质加入主文。
theological_decisions:
- issue: θυμιατήριον在至圣所描述中的所指
  choice: 香坛
  alternative: 香炉
  rationale: 该词可指香坛或焚香用的香炉，且本节与会幕器具位置的关系形成长期争议。主文采用较符合陈设语境的“香坛”，脚注保留“香炉”，不消除原文的真实歧义。
- issue: “柜里”与旧约所述物件位置之间的张力
  choice: 按ἐν ᾗ直译为“柜里”
  alternative: 与柜相关联／柜旁
  rationale: ἐν ᾗ通常意为“在其中”，其先行词为约柜。尽管这与其他经文对物件位置的叙述可能产生张力，译文不应通过释义消解它。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“那里有”承接上一节的空间描述；全句保持列举结构。脚注标记[a]已置于主文“金香坛”之后。
