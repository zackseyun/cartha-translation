  text: οὕτως καὶ ὁ Χριστός, ἅπαξ προσενεχθεὶς εἰς τὸ πολλῶν ἀνενεγκεῖν ἁμαρτίας, ἐκ δευτέρου χωρὶς ἁμαρτίας ὀφθήσεται τοῖς αὐτὸν ἀπεκδεχομένοις εἰς σωτηρίαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/028.yaml
  text: so also the Messiah[a], having been offered once to bear the sins of many, will appear a second time, apart from sin, to those who eagerly await him, for salvation.
translation:
  language: zh_hans
  text: 照样，弥赛亚也曾一次被献上，为要担当许多人的罪；他将第二次显现，与罪无关[a]，使那些热切等候他的人得救。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“不涉及罪”，也就是说，他第二次显现并不是像第一次被献上时那样担当罪。
    reason: 保留χωρὶς ἁμαρτίας的解释性替代译法，同时避免在正文中消除原文的简洁与神学张力。
lexical_decisions:
- source_word: οὕτως καὶ
  choice: 照样……也
  rationale: 承接第27节的类比，保留比较与推论的作用，也符合现代汉语表达。
- source_word: ὁ Χριστός
  choice: 弥赛亚
  rationale: 此处Χριστός作为救恩历史论述中的称号使用，译作“弥赛亚”可显明其称号意义。
- source_word: ἅπαξ
  choice: 一次
  rationale: 忠实表达该词本身的“一次”；不增译原词未明说的“一次而永远有效”。
- source_word: προσενεχθεὶς
  choice: 曾一次被献上
  rationale: 保留不定过去时被动分词的被动语态，并表明这件事先于将来的显现发生；不增添本句未明说的反身含义。
- source_word: εἰς τὸ πολλῶν ἀνενεγκεῖν ἁμαρτίας
  choice: 为要担当许多人的罪
  rationale: “为要”表达εἰς加冠词不定式的目的含义；“担当……罪”保留ἀναφέρω在献祭与以赛亚书背景中的承罪意象。
- source_word: πολλῶν
  choice: 许多人
  rationale: 直接表达复数“许多”，并保留其可能对以赛亚书53章的呼应。
- source_word: ἐκ δευτέρου
  choice: 第二次
  rationale: 自然表达再次发生且为第二次，并与第一次被献上形成对照。
- source_word: χωρὶς ἁμαρτίας
  choice: 与罪无关
  rationale: 以简洁汉语保留“离开罪、不涉及罪”的含义，同时不在正文中完全解释其与第一次担当罪之间的关系。
- source_word: ὀφθήσεται
  choice: 将……显现
  rationale: 该被动形式在此具有显现用法；“显现”比生硬的“将被看见”更符合末世语境。
- source_word: τοῖς αὐτὸν ἀπεκδεχομένοις
  choice: 那些热切等候他的人
  rationale: “热切等候”传达ἀπεκδέχομαι所含期待而迫切等候的意味。
- source_word: εἰς σωτηρίαν
  choice: 使……得救
  rationale: 以自然汉语表达εἰς σωτηρίαν所指向的目标或结果；与等候者连用可清楚呈现得救的对象。
theological_decisions:
- issue: “χωρὶς ἁμαρτίας”在第二次显现中的含义
  choice: 正文译作“与罪无关”，并以脚注说明不是像第一次那样担当罪。
  alternative: 可译作“不再为罪”或“不是为担当罪”。
  rationale: 正文保留希腊文简洁而略带张力的表达，不直接把一种解释写入经文；脚注则交代上下文最可能指向的含义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“被献上”“担当……罪”“显现”等词保留献祭及末世语境；句式清晰，适合普通现代读者。
