  text: οὐδὲ δι’ αἵματος τράγων καὶ μόσχων διὰ δὲ τοῦ ἰδίου αἵματος, εἰσῆλθεν ἐφάπαξ εἰς τὰ ἅγια, αἰωνίαν λύτρωσιν εὑράμενος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/012.yaml
  text: and not through the blood of goats and calves[a], but through his own blood, he entered once for all into the holy places, having obtained eternal redemption.
translation:
  language: zh_hans
  text: 他也不是借着公山羊和牛犊的血，而是借着自己的血，一次而永远地进入圣所[a]，获得了永远的救赎。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为复数，字面可译为“圣处”（复数），可作为指圣所的礼仪性统称。也有译本译为“至圣所”，但原文本身没有明确作此限定。
    reason: 说明τὰ ἅγια的复数形式、其礼仪性用法，并保留其范围的解释空间。
lexical_decisions:
- source_word: οὐδὲ
  choice: 也不是
  rationale: 承接上一节并延续对比；“也不是”既保留连接作用，又符合现代汉语表达。
- source_word: δι’ αἵματος τράγων καὶ μόσχων
  choice: 借着公山羊和牛犊的血
  rationale: διά加属格在这里表示途径或凭借；“借着”也能与下句重复的διά形成清楚对照。τράγων特指公山羊，μόσχων在此译作“牛犊”。
- source_word: διὰ δὲ τοῦ ἰδίου αἵματος
  choice: 而是借着他自己的血
  rationale: 重复“借着”以保留原文平行对比；“他自己的”体现ἰδίου所强调的所属关系。
- source_word: εἰσῆλθεν
  choice: 进入
  rationale: 不定过去时陈述一次已经完成的行动；“进入”自然地契合圣所语境。
- source_word: ἐφάπαξ
  choice: 只一次
  rationale: 表达单一、决定性且不重复的行动；“只一次”简洁自然，并保留该词在《希伯来书》中的强调作用。
- source_word: εἰς τὰ ἅγια
  choice: 进入圣所
  rationale: τὰ ἅγια虽为复数形式，却可作为礼仪用语统称圣所。“圣所”在现代汉语中比直译复数更自然，同时不把含义过度限定为“至圣所”。
- source_word: αἰωνίαν λύτρωσιν
  choice: 永远的救赎
  rationale: 表达效力恒久的救赎，是准确、自然且为普通读者熟悉的说法。
- source_word: εὑράμενος
  choice: 获得了
  rationale: εὑρίσκω字面可指“找到”，但在此语境中表示取得、获得；保留其结果含义，同时不额外说明救赎的对象或机制。
theological_decisions:
- issue: 基督借着自己的血进入圣所的含义
  choice: 表述为“借着他自己的血”进入，保留διά所表达的途径或凭借关系。
  alternative: 译成他实际携带或呈献血进入；或仅译成他流血之后进入。
  rationale: 前后两次διά加属格构成明确对照，应采用同一表达；这样既保留献祭预表，也不加入原文未明说的天上献血机制。
- issue: τὰ ἅγια的范围
  choice: 译作“圣所”，并以脚注说明原文形式及“至圣所”的可能理解。
  alternative: 直译为“诸圣处”；或明确译成“至圣所”。
  rationale: 该复数形式可作礼仪性统称。“圣所”兼顾自然汉语与原文含义；直接译为“至圣所”会过早解决原文保留的解释空间。
- issue: “获得永远的救赎”的主语含义
  choice: 保留“获得了永远的救赎”这一表达，不增添明示宾语。
  alternative: 译作“为人取得了永远的救赎”或“成就了永远的救赎”。
  rationale: 原文没有明说救赎是“为谁”取得；“成就”虽能减少误读，却比εὑράμενος更偏解释。所选译法保留原文简洁及其可能的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以“借着……而是借着……”保留原文献祭对比；用“圣所”避免生硬的复数直译，并通过脚注交代原文措辞。
