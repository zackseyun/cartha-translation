  text: Ἀνάγκη οὖν τὰ μὲν ὑποδείγματα τῶν ἐν τοῖς οὐρανοῖς τούτοις καθαρίζεσθαι, αὐτὰ δὲ τὰ ἐπουράνια κρείττοσι θυσίαις παρὰ ταύτας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/023.yaml
  text: Therefore it was necessary for the copies of the things in the heavens to be cleansed with these[c][b][a], but the heavenly things themselves with better sacrifices than these.
translation:
  language: zh_hans
  text: 因此，天上事物的摹本[a]必须借着这些得到洁净[b]，但天上的事物本身，却必须借着比这些更好的祭物[c]得到洁净。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “摹本”也可译作“样式”或“表征”。
    reason: lexical_alternative
  - marker: b
    text: “洁净”也可译作“净化”；原文动词在这里属于礼仪性的洁净用语。
    reason: lexical_alternative
  - marker: c
    text: 希腊原文的“祭物”是复数，尽管《希伯来书》的上下文着重于弥赛亚一次而永远有效的献上。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνάγκη οὖν
  choice: 所以……必须
  rationale: οὖν承接上文并引出推论，译作“所以”；Ἀνάγκη是无人称的必要性表达，汉语自然译作“必须”。希腊语未明示时态，因此不在中文中额外加入“当时”或“曾经”。
- source_word: τὰ μὲν ὑποδείγματα τῶν ἐν τοῖς οὐρανοῖς
  choice: 天上事物的仿制品
  rationale: ὑποδείγματα在此指与天上事物相对应的地上表征；“仿制品”清楚保留其从属和对应关系，又与后文“天上的事物本身”形成鲜明对照。
- source_word: τούτοις
  choice: 用这些
  rationale: 工具格指借着前文所述的祭祀洁净之物；“这些”保留指示词的简洁性，不把所指对象扩写进正文。
- source_word: καθαρίζεσθαι
  choice: 来洁净
  rationale: 该动词在上下文中带有礼仪性的洁净含义；“洁净”既贴近原文，也比抽象的“净化”更符合祭祀语境。
- source_word: αὐτὰ δὲ τὰ ἐπουράνια
  choice: 但天上的事物本身
  rationale: “本身”体现αὐτά的强调作用；保留宽泛的“天上的事物”，不擅自限定为天上圣所或属天子民。
- source_word: κρείττοσι θυσίαις παρὰ ταύτας
  choice: 用比这些更好的祭物
  rationale: κρείττοσι……παρὰ表达比较，译作“比这些更好”；“祭物”保留θυσίαις的献祭语义。现代汉语名词通常不标示单复数，故以脚注说明希腊原文为复数。
theological_decisions:
- issue: “天上的事物”为什么需要洁净
  choice: 正文直接保留“天上的事物本身……来洁净”的祭祀语言。
  alternative: 将其解释为“天上的圣所”或“属于天上的人”，或改写以避免天上之物需要洁净的张力。
  rationale: 原文明说地上的仿制品与天上的事物都涉及洁净。译文不替作者消解这一神学张力，也不把某一种解释写入正文。
- issue: “祭物”的复数与弥赛亚一次献上的祭相互关联
  choice: 正文使用数目中性的“祭物”，并在脚注注明希腊原文为复数。
  alternative: 按《希伯来书》其他经文所强调的一次献祭，将此处直接译成明确的单数。
  rationale: θυσίαις在原文中是复数，不能因系统性协调而改成单数；但现代汉语的“祭物”本身不自然标明单复数，所以用脚注准确保存这一形式信息。
translation_notes:
  register: 采用现代、庄重而清楚的书面普通话。前后两分句都明说“来洁净”，补足希腊语后半句的省略成分，使普通读者容易理解，同时保留原文的对照结构和神学张力。
