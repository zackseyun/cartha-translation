  text: οὐδ’ ἵνα πολλάκις προσφέρῃ ἑαυτόν, ὥσπερ ὁ ἀρχιερεὺς εἰσέρχεται εἰς τὰ ἅγια κατ’ ἐνιαυτὸν ἐν αἵματι ἀλλοτρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/025.yaml
  text: Nor was it so that he might offer himself many times[a], just as the high priest enters the holy places year by year with blood not his own,
translation:
  language: zh_hans
  text: 也不是为了多次献上自己，正如大祭司每年带着不是自己的血进入圣所[a]一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文为复数，可译作“圣处”或“圣所”；在这里的祭祀语境中，也有人更具体地理解为“至圣所”。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδ’ ἵνα
  choice: 也不是要
  rationale: 承接上一节的否定语势，表达基督进入并非为了反复献上自己；中文自然且保留目的含义。
- source_word: πολλάκις
  choice: 多次
  rationale: 直接表达次数上的反复，并与大祭司每年的行动形成对比。
- source_word: προσφέρῃ ἑαυτόν
  choice: 献上自己
  rationale: 保留 προσφέρω 的献祭含义和反身代词 ἑαυτόν 的力量。
- source_word: ὥσπερ
  choice: 像……一样
  rationale: 清楚标明基督与大祭司之间的比较。
- source_word: ὁ ἀρχιερεὺς
  choice: 大祭司
  rationale: 这是犹太祭祀职分在现代汉语中的标准译法。
- source_word: εἰσέρχεται
  choice: 进入
  rationale: 现在时在此描述惯常发生的行动；汉语无需额外标示时态。
- source_word: εἰς τὰ ἅγια
  choice: 圣所
  rationale: 在本段祭祀语境中自然地指神圣区域，同时不在正文中过度限定为“至圣所”；复数形式及较窄理解在脚注说明。
- source_word: κατ’ ἐνιαυτὸν
  choice: 每年
  rationale: 自然、简洁地表达逐年重复的惯常行动。
- source_word: ἐν αἵματι ἀλλοτρίῳ
  choice: 带着不是自己的血
  rationale: “带着”符合大祭司携血进入的祭祀场景，“不是自己的”突出这血属于别者，并与基督献上自己形成对照。
theological_decisions:
- issue: 基督与利未体系大祭司之间的比较
  choice: 译文对比基督并非多次献上自己，与大祭司每年携非己之血进入圣所。
  alternative: 可将 τὰ ἅγια 更具体地理解并译作“至圣所”。
  rationale: 上下文强调基督献祭的不重复性与旧约祭司礼仪的逐年重复；译文保留这一内在对比，却不加入经文本身没有明说的后续教义阐释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“也不是要”使本节能自然承接上一节；“圣所”保持祭祀语境中的准确性，并以脚注保存原文复数形式及“至圣所”这一可能理解。
