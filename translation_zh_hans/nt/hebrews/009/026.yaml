  to: 不然，他从创世以来就必须多次受苦了。可是如今，他已经在众世代的终局[a]显现一次，借着献上自己为祭[b]除掉罪[c]。
  rationale: 修订以“已经显现一次”反映πεφανέρωται的完成时，同时维持ἅπαξ与πολλάκις的次数对照；将“万世”改为“众世代”，使复数αἰώνων在现代汉语中更明确。脚注b改正希腊文表层表达与语境性解释之间的关系，不改变正文的安全、自然译法。
