  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐπεὶ ἔδει αὐτὸν πολλάκις παθεῖν ἀπὸ καταβολῆς κόσμου· ⸀νυνὶ δὲ ἅπαξ ἐπὶ συντελείᾳ τῶν αἰώνων εἰς ἀθέτησιν ⸀ἁμαρτίας διὰ τῆς θυσίας αὐτοῦ πεφανέρωται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/026.yaml
  text: Otherwise[a], he would have had to suffer many times since the foundation of the world. But as it is[c][b], he has appeared once for all at the consummation of the ages to put away sin through the sacrifice of himself.
translation:
  language: zh_hans
  text: 不然，他从创世以来就必须多次受苦了。可是如今，他已经在众世代的终局[a]显现一次，借着献上自己为祭[b]除掉罪[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在众世代的末了。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“借着他的祭”或“借着他自己的祭”。希腊文较直译为“借着他的祭”；按上下文可理解为献上他自己为祭。
    reason: lexical_alternative
  - marker: c
    text: 或译：“使罪失效”或“废除罪”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ
  choice: 不然
  rationale: 承接上文的反事实推论，说明若基督需要反复献上自己，就会产生随后所说的结果；“不然”自然传达这一推论作用。
- source_word: ἔδει αὐτὸν πολλάκις παθεῖν
  choice: 他……就必须多次受苦了
  rationale: 未完成时在这一反事实论证中表达假设性的必要；“就必须……了”既符合现代汉语，也保留与后文“只……一次”的鲜明对比。
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: 从创世以来
  rationale: 表达自世界奠基之时延续至今的时间范围；“创世以来”是清楚、庄重而自然的中文说法。
- source_word: νυνὶ δὲ
  choice: 可是如今
  rationale: 既保留时间意味，也突出假设情形与实际事实之间的强烈转折。
- source_word: ἅπαξ
  choice: 只显现一次
  rationale: “只……一次”结合上下文与“多次”的对比，传达此事不重复、具有决定性的意味，同时不在词面上额外扩展。
- source_word: ἐπὶ συντελείᾳ τῶν αἰώνων
  choice: 在万世的终局
  rationale: 保留αἰώνων的复数视野和συντέλεια所含的汇聚、完成之意，避免简化为单纯的时间终点。
- source_word: εἰς ἀθέτησιν ἁμαρτίας
  choice: 除掉罪
  rationale: ἀθέτησις含废除、取消效力、排除之意；“除掉”通顺且能表达决定性处理罪的作用。保留ἁμαρτίας的单数集合性表达。
- source_word: διὰ τῆς θυσίας αὐτοῦ
  choice: 借着献上自己为祭
  rationale: 属格αὐτοῦ在语境中可指以他自己为祭物；此译清楚表达基督既是献祭者、自己也是所献之祭，同时脚注保留较形式对应的译法。
- source_word: πεφανέρωται
  choice: 显现
  rationale: 该完成时指已经发生且持续具有意义的显现；中文正文结合“如今”与“一次”即可自然表达，避免生硬直译为“已被显明”。
theological_decisions:
- issue: ἅπαξ在基督献祭语境中的力度
  choice: 译作“只显现一次”
  alternative: “一次而永远地显现”或仅译“一次显现”
  rationale: 与πολλάκις“多次”形成明确对照，表达事件的唯一性和不重复性；不采用可能被误解为描述持续时长的“一次而永远地”。
- issue: ἁμαρτίας的单数范围
  choice: 保留为单数“罪”
  alternative: “罪恶”或“诸罪”
  rationale: 希腊文单数可将罪视为整体性的现实或权势；译作“罪”保留其宽广含义，也不排除具体罪行。
- issue: διὰ τῆς θυσίας αὐτοῦ中αὐτοῦ的关系
  choice: 正文译作“借着献上自己为祭”
  alternative: “借着他的祭”
  rationale: 上下文论及基督献上自己，反身理解最为贴切；同时以脚注列出更贴近表层结构的译法，避免掩盖属格表达本身的可能简译。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“万世的终局”保留原文末世性的宏大视野；“献上自己为祭”使祭献关系清楚，但用脚注保留较直译形式及词义幅度。所有脚注标记均置于对应正文位置。
