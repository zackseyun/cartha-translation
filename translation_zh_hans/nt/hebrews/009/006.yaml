id: HEB.9.6
reference: Hebrews 9:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Τούτων δὲ οὕτως κατεσκευασμένων, εἰς μὲν τὴν πρώτην σκηνὴν διὰ παντὸς εἰσίασιν οἱ ἱερεῖς τὰς λατρείας ἐπιτελοῦντες,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/006.yaml
  text: With these things prepared in this way[a], the priests continually enter the first tabernacle, performing the services[b],
translation:
  language: zh_hans
  text: 这些都这样布置好以后，祭司们常常进入第一层帐幕[a]，举行各项敬拜礼仪[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “第一层帐幕”也可译作“第一间帐幕”。希腊语“帐幕”既可指整座帐幕，也可在这里指其中的第一部分。
    reason: lexical_alternative
  - marker: b
    text: “举行各项敬拜礼仪”也可译作“执行各项礼仪职务”或“进行各项事奉”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τούτων δὲ οὕτως κατεσκευασμένων
  choice: 这些都这样布置好以后
  rationale: 这是属格独立结构，为下文交代背景。“布置好”既涵盖帐幕的设置，也自然承接前文陈设的器物；“以后”清楚表达其情境关系。δὲ在此仅作轻微承接，汉语无需另加生硬的连接词。
- source_word: εἰς μὲν τὴν πρώτην σκηνὴν
  choice: 进入第一层帐幕
  rationale: σκηνή在本段既可指帐幕，也可按语境指帐幕的一个部分。“第一层帐幕”保留祭祀场所的专门含义，同时让读者明白这里是与下一节的第二层相对。脚注列出“第一间帐幕”等可能译法。
- source_word: διὰ παντὸς
  choice: 常常
  rationale: 这里描述祭司按惯例反复进入，并非每时每刻都在其中。“常常”自然表达习惯性、持续反复的事奉，也保留与下一节大祭司一年一次进入的对比。
- source_word: εἰσίασιν
  choice: 进入
  rationale: 现在时在此表示惯常发生的行动；汉语“常常进入”自然呈现这一点。
- source_word: οἱ ἱερεῖς
  choice: 祭司们
  rationale: 指一般祭司，与下一节的大祭司形成对照；复数形式明确保留。
- source_word: τὰς λατρείας
  choice: 各项敬拜礼仪
  rationale: 复数λατρείας指在圣所中履行的祭祀性敬拜职责。“各项敬拜礼仪”兼顾敬拜和规定礼仪两方面，避免被误解为现代教会的一场“礼拜”。
- source_word: ἐπιτελοῦντες
  choice: 举行
  rationale: 分词说明祭司进入后所做的事。“举行”与“敬拜礼仪”搭配自然，并表达执行规定仪式的意思。
theological_decisions:
- issue: 圣所语境中σκηνή的译法
  choice: 第一层帐幕
  alternative: 第一间帐幕；第一座帐幕；头一层帐幕
  rationale: 本章讲述摩西制度下的帐幕及其前后两层。正文保留“帐幕”的旧约祭祀背景，并用“层”表明此处所指是第一部分，而不是另一个独立帐幕；脚注保留词义和结构上的其他理解。
- issue: διὰ παντὸς所表达的祭司事奉频率
  choice: 常常
  alternative: 不断；经常；随时
  rationale: 本节重点是一般祭司反复进入第一层帐幕，与大祭司受限进入第二层形成对比。“常常”不暗示祭司毫无间断地身处其中，也不把原文缩窄为固定但未说明的频率。
- issue: λατρείας的祭祀与敬拜含义
  choice: 敬拜礼仪
  alternative: 事奉；礼仪职务；祭祀礼仪
  rationale: 该词在此指圣所内规定的宗教事奉。所选译法同时保留其面向上帝的敬拜性质和礼仪性质，不额外限定为某一种祭礼。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“布置好”承接前文帐幕及器物的安排；“常常”表达惯常反复的行动；“敬拜礼仪”保持圣所祭祀语境，又避免现代教会聚会用语造成的误解。
