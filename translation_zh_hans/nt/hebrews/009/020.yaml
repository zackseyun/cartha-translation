  text: saying[a], “This is the blood of the covenant that God commanded for you.”
translation:
  language: zh_hans
  text: 说：“这是上帝向你们所吩咐的约的血。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγων
  choice: 说
  rationale: 现在分词承接上一节的动作并引出直接引语；汉语用“说”即可自然保留这种衔接。
- source_word: Τοῦτο
  choice: 这是
  rationale: 希腊文省略系词；现代汉语补出“是”，清楚表达指示代词与表语之间的关系，不增添额外含义。
- source_word: αἷμα
  choice: 血
  rationale: 直接保留献祭及立约仪式中的具体用语，不作抽象化释义。
- source_word: διαθήκης
  choice: 约
  rationale: 本节呼应《出埃及记》24:8的立约场景；“约”准确表达盟约含义，避免“遗嘱”的法律含义。
- source_word: ἧς
  choice: 之约
  rationale: 关系代词为阴性单数属格，回指“约”；以“上帝向你们所吩咐之约”重组定语关系，既符合现代汉语，也保留修饰对象。
- source_word: ἐνετείλατο
  choice: 吩咐
  rationale: 表达ἐντέλλομαι的命令、嘱咐义；“吩咐”在上帝发令的语境中庄重自然，又不额外解释命令的具体内容。
- source_word: πρὸς ὑμᾶς
  choice: 向你们
  rationale: 保留πρός所表达的朝向或受命对象，比“为你们”更贴近原文，同时在汉语中自然。
- source_word: ὁ θεός
  choice: 上帝
  rationale: 采用现代标准汉语中对θεός的通行、庄重译法。
theological_decisions:
- issue: διαθήκη在流血立约语境中的译法
  choice: 约
  alternative: 遗嘱
  rationale: 经文直接呼应摩西以血确立盟约的场景，因此应保留盟约意义；译作“遗嘱”会引入不符合本节旧约背景的法律概念。
- issue: 如何处理Τοῦτο之后省略的系词
  choice: 补出“是”
  alternative: 不补系词，译作“这——约的血”
  rationale: 现代汉语判断句在此补出“是”最为清楚自然；这只是显明希腊文已有的表语关系，并未增加神学解释。
- issue: ἧς ἐνετείλατο πρὸς ὑμᾶς所修饰的对象
  choice: 明确回指“约”，译作“上帝向你们所吩咐之约”
  alternative: 译作“上帝为你们所吩咐的约”
  rationale: ἧς在语法上回指διαθήκης；采用“向你们”保留πρός的方向性，也不进一步断定该命令是“为了”他们。
translation_notes:
  register: 采用简洁、庄重而可懂的现代标准汉语。“所吩咐之约”略带书面色彩，以便清楚承载关系从句并避免误把“吩咐”直接修饰“血”；全句保持原文的立约用语和语义张力。
