  text: τοῦτο δηλοῦντος τοῦ πνεύματος τοῦ ἁγίου, μήπω πεφανερῶσθαι τὴν τῶν ἁγίων ὁδὸν ἔτι τῆς πρώτης σκηνῆς ἐχούσης στάσιν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/008.yaml
  text: By this the Holy Spirit is indicating that the way into the holy places has not yet been revealed while the first tabernacle still has standing,
translation:
  language: zh_hans
  text: 圣灵借此表明：只要第一层帐幕仍然存立[b]，通往圣所[a]的路就还没有显明。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“通往圣所区域的路”；原文为复数，也有人将这里具体理解为“通往至圣所的路”。
    reason: alternative_reading
  - marker: b
    text: 或译“第一层帐幕还立着的时候”。这里也可能含有它仍维持其地位或效力的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: δηλοῦντος
  choice: 借此表明
  rationale: 现在时分词在独立属格结构中说明前述礼仪安排所表达的意义；“表明”自然、庄重，也保留圣灵持续借此作出指示的意味。
- source_word: πνεύματος τοῦ ἁγίου
  choice: 圣灵
  rationale: 这是新约中该称谓的标准现代汉语表达。
- source_word: μήπω πεφανερῶσθαι
  choice: 还没有显明
  rationale: 完成时被动不定式表达一条路尚未被显明、这种状态仍在持续；“还没有显明”简洁地保留了这一时态意义。
- source_word: τὴν τῶν ἁγίων ὁδὸν
  choice: 通往圣所的路
  rationale: 在帐幕和祭司礼仪的语境中，τὰ ἅγια 指神圣空间；“通往”按汉语习惯表达 ὁδός 所含的进入或接近之意，而“圣所”不把所指过早限定为至圣所。
- source_word: πρώτης σκηνῆς
  choice: 第一层帐幕
  rationale: 紧接上文两层帐幕空间的区分，“第一层帐幕”既保留“第一”的次序，也让现代读者明白这里可指帐幕的第一部分，而不是另一座帐幕。
- source_word: ἐχούσης στάσιν
  choice: 仍然存立
  rationale: 该短语表示继续存在、维持其地位；“存立”比单说“立着”更能容纳实体存在与制度效力两方面的可能含义，同时不替原文消除张力。
- source_word: ἔτι
  choice: 仍然
  rationale: 表示某种状态持续存在，与“只要……就……”的汉语结构自然配合。
theological_decisions:
- issue: τῶν ἁγίων 的所指
  choice: 理解为礼仪语境中的圣所，而不是圣徒
  alternative: 圣徒的路
  rationale: 上下文讨论帐幕的布局和祭司进入其中的限制，因此这里是空间和礼仪性的用语。
- issue: 圣所所指的具体范围
  choice: 正文用“圣所”，保留可泛指神圣区域的宽度
  alternative: 特指“至圣所”
  rationale: 上下文可能尤其指向内层的至圣所，但希腊文使用复数的实词化形容词，范围不必限定得如此狭窄；脚注保留较具体的理解。
- issue: 第一层帐幕“存立”的含义
  choice: 保留实体存在与制度地位之间的张力
  alternative: 明确译作“仍然有效”或仅译作“还立着”
  rationale: ἐχούσης στάσιν 可以强调继续存在或维持地位；正文“存立”避免只选定物理或制度层面的解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“只要……就……”清楚表达独立属格结构的时间关系；“存立”有意保留原文关于帐幕继续存在或仍具地位的语义张力。
