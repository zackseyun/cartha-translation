source:
  edition: SBLGNT
  text: οὐ γὰρ εἰς χειροποίητα ⸂εἰσῆλθεν ἅγια⸃ Χριστός, ἀντίτυπα τῶν ἀληθινῶν, ἀλλ’ εἰς αὐτὸν τὸν οὐρανόν, νῦν ἐμφανισθῆναι τῷ προσώπῳ τοῦ θεοῦ ὑπὲρ ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/024.yaml
  text: For Messiah did not enter into holy places made by hands[a], copies of the true things, but into heaven itself[c][b], now to appear in the presence of God on our behalf.
translation:
  language: zh_hans
  text: 因为弥赛亚不是进入人手所造的圣所[a]——那不过是真实事物的对应样式[b]——而是进入天上本身，如今为我们显现在上帝面前[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣所”原文为复数形式，也可译作“圣地”。这里整体指人手所造的神圣处所。
    reason: 语法与词义说明
  - marker: b
    text: “对应样式”也可译作“表样”或“对应物”；原词表示与天上真实事物相对应的地上事物。
    reason: 词义备选
  - marker: c
    text: 直译“显现在上帝的面容前”。
    reason: 原文直译
lexical_decisions:
- source_word: Χριστός
  choice: 弥赛亚
  rationale: 保留其称号含义；本节论述他以祭司身份进入天上，弥赛亚职分仍在视野之内。
- source_word: χειροποίητα ἅγια
  choice: 人手所造的圣所
  rationale: “人手所造”保留与天上实在的对照；ἅγια虽为复数形式，在希伯来书祭祀语境中可整体指圣所，汉语用单数集合称谓更自然。
- source_word: ἀντίτυπα τῶν ἀληθινῶν
  choice: 真实事物的对应样式
  rationale: ἀντίτυπα强调彼此对应的表样，不仅是简单复制品；此译法也保留地上圣所与天上真实事物之间的关系。
- source_word: αὐτὸν τὸν οὐρανόν
  choice: 天上本身
  rationale: 用“本身”传达强调结构，突出他进入的不是地上对应物，而是天上的实在。
- source_word: νῦν ἐμφανισθῆναι
  choice: 如今……显在
  rationale: 保留νῦν的时间意义，并以“显在”表达进入天上的目的；不额外加入原文未明说的反身成分。
- source_word: τῷ προσώπῳ τοῦ θεοῦ
  choice: 在上帝面前
  rationale: 这是现代汉语对“在上帝的面容前”的自然表达，同时保留直接临到上帝面前的含义。
- source_word: ὑπὲρ ἡμῶν
  choice: 为我们
  rationale: 简洁自然地表达代表、为了我们之意；上下文赋予其祭司性和中保性，不必在正文中额外阐释。
theological_decisions:
- issue: ἅγια的祭祀用语及数
  choice: 译作“圣所”
  alternative: 圣地；诸圣所；至圣所
  rationale: 原文是中性复数，但在希伯来书中常整体指神圣处所。现代汉语“圣所”自然涵盖帐幕中的神圣空间，又不把所指限定为至圣所。
- issue: Χριστός的基督论称号
  choice: 译作“弥赛亚”
  alternative: 基督
  rationale: 此处称号意义活跃，译出“弥赛亚”可直接表达受膏者身份，不改变相关基督论内涵。
- issue: ἀντίτυπα与天上实在的关系
  choice: 译作“对应样式”
  alternative: 复制品；表样；副本
  rationale: 避免把关系缩减为机械复制，同时保留地上圣所对应并表征天上真实事物的张力。
- issue: ὑπὲρ ἡμῶν的代表意义
  choice: 译作“为我们”
  alternative: 代表我们；为了我们的缘故
  rationale: 正文采用自然且范围较宽的表达，不把本节限定为某一特定赎罪理论；祭司性代表意义由上下文显明。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“因为……不是……而是……”保留原句论证结构；破折号清楚标出ἀντίτυπα τῶν ἀληθινῶν对人手所造圣所的补充说明。所有脚注标记均置于相关正文之后。
