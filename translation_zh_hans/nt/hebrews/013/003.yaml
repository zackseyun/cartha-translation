  text: μιμνῄσκεσθε τῶν δεσμίων ὡς συνδεδεμένοι, τῶν κακουχουμένων ὡς καὶ αὐτοὶ ὄντες ἐν σώματι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/003.yaml
  text: Remember those in prison[a], as though imprisoned with them; those who are mistreated[b], since you yourselves also are in the body.
translation:
  language: zh_hans
  text: 要记念被囚的人[a]，如同与他们一同被捆绑；也要记念遭受苦待的人[b]，因为你们自己也同样有血肉之躯。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“被锁链捆绑的人”。原文所用的词指受捆绑者，也常指囚犯。
    reason: lexical_alternative
  - marker: b
    text: 原文直译“在身体之中”。这更可能是指同样有肉身、也可能遭受苦难；也有人认为这是指同属基督的身体。
    reason: alternative_reading
lexical_decisions:
- source_word: μιμνῄσκεσθε
  choice: 要记念
  rationale: 现在时命令语气表达持续的记挂与关怀；“要记念”自然、庄重，也不把含义缩减为单纯回想。
- source_word: τῶν δεσμίων
  choice: 被囚的人
  rationale: δέσμιος指受捆绑者或囚犯；“被囚的人”符合现代汉语，并保留其受拘禁的被动处境。
- source_word: ὡς συνδεδεμένοι
  choice: 如同与他们一同被捆绑
  rationale: συνδέομαι直接唤起“一同受捆绑”的意象，强调与囚犯感同身受；此译比单说“如同也在监里”更贴近原文措辞。
- source_word: τῶν κακουχουμένων
  choice: 受虐待的人
  rationale: κακουχέομαι表示遭受他人恶待、压迫或折磨；“受虐待”清楚保留外力施加伤害的被动意义。
- source_word: ὡς καὶ αὐτοὶ ὄντες ἐν σώματι
  choice: 因为你们自己也在身体之中
  rationale: 保留ἐν σώματι的字面表达和一定的解释开放性；“因为”在汉语中自然呈现这句话劝勉的理由。
theological_decisions:
- issue: “在身体之中”（ἐν σώματι）的含义
  choice: 正文保留“在身体之中”，语境主要指共同具有人身脆弱、会遭受苦难的处境
  alternative: 指同属基督的身体
  rationale: 上下文要求读者同情被囚和受虐待者，最自然的依据是共同的具身处境；但直译该短语可避免完全排除教会作为基督身体的潜在回响。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“记念”沿用经文语体，但在当代仍可理解为持续挂念并付诸关怀。正文保留“身体之中”的含混性，并以脚注说明主要理解与可能的教会论回响。
