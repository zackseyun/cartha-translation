  text: οὐ γὰρ ἔχομεν ὧδε μένουσαν πόλιν, ἀλλὰ τὴν μέλλουσαν ἐπιζητοῦμεν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/014.yaml
  text: For we do not have a lasting city here[a], but we seek the one that is to come.
translation:
  language: zh_hans
  text: 因为我们在这里没有长存的城，而是在寻求那将要来的城。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ γὰρ
  choice: 因为……没有
  rationale: γάρ承接上文，说明前面劝勉的理由；现代汉语以“因为”自然表达这种解释关系，οὐ则由“没有”体现。
- source_word: ἔχομεν
  choice: 我们……有
  rationale: 按普通现在时直译为“有”；与否定词结合为“我们……没有”，自然且准确。
- source_word: ὧδε
  choice: 在这里
  rationale: 保留指示副词“这里”的直接含义，不扩译为“在地上”，以免加入原文未明说的解释。
- source_word: μένουσαν
  choice: 长存的
  rationale: 现在主动分词修饰“城”，表示持续存在、存留；“长存”既自然庄重，也清楚呈现与将来之城的对比。
- source_word: πόλιν
  choice: 城
  rationale: 保留具体名词“城”，不改释为“家乡”“天国”等较宽或带解释性的概念。
- source_word: ἀλλὰ
  choice: 而是
  rationale: 在“不是/没有……而是……”的汉语结构中鲜明表达两项之间的强烈转折。
- source_word: τὴν μέλλουσαν
  choice: 那将要来的城
  rationale: 阴性分词承接πόλιν；汉语补出“城”可避免指代含混，并保留其未来、将临的意味。
- source_word: ἐπιζητοῦμεν
  choice: 我们……寻求
  rationale: “寻求”比单纯的“寻找”更适合所追求的未来之城，也保留ἐπιζητέω所含的积极追求意味，而不额外加入“热切”等副词。
theological_decisions:
- issue: “城”的意象所指
  choice: 正文保留“城”，不具体解释为“天上”“天城”或“天上的耶路撒冷”。
  alternative: 译为“天上的城”“天上的耶路撒冷”或“天堂”。
  rationale: 本节只明说此处没有长存的城，并以将要来的城为寻求对象。虽然《希伯来书》其他段落发展了天上之城的意象，翻译本节仍应保留原文措辞及其开放性，不把上下文解释直接写入正文。
- issue: μένον与μέλλω的时间对比
  choice: 译作“长存的城”与“将要来的城”。
  alternative: 译作“永恒的城”与“未来的城”。
  rationale: “长存”表达持续存留，但不把μένον强化成形而上的“永恒”；“将要来的”则保留μέλλω的将临意味，而不只作静态的“未来”。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“因为”保留与上文的论证联系；“在这里”忠实保留原文的空间指示；重复“城”使汉语指代清楚，并突出两座城的对照。英文咨询稿的脚注似乎附在“here”之后，却解释“the coming city”；中文正文已直接译为“那将要来的城”，无需另设词汇异译脚注。
