  text: ἔχομεν θυσιαστήριον ἐξ οὗ φαγεῖν οὐκ ἔχουσιν ἐξουσίαν οἱ τῇ σκηνῇ λατρεύοντες.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/010.yaml
  text: We have an altar from which those who serve at the tabernacle have no right to eat[a][b].
translation:
  language: zh_hans
  text: 我们有一座祭坛，凡在会幕中事奉的人都无权从这祭坛上吃[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那些在帐幕中供职的人。”这里指参与旧约圣所礼仪事奉的人。
    reason: lexical_alternative
  - marker: b
    text: 这里的“祭坛”有多种解释，包括基督自己、十字架、天上的祭坛，或基督献祭所带来的益处；希腊文在本节并未进一步说明。
    reason: alternative_reading
lexical_decisions:
- source_word: ἔχομεν
  choice: 我们有
  rationale: 保留现在时和包含作者及读者的第一人称复数，表达现今的拥有或可享用。
- source_word: θυσιαστήριον
  choice: 一座祭坛
  rationale: 按该词通常含义直译为“祭坛”，保留其祭祀意象和可能的预表意义，不在正文中解释为基督、十字架或祭物。
- source_word: ἐξ οὗ φαγεῖν
  choice: 吃坛上的祭物
  rationale: 原文直译为“从其吃”；现代汉语通常不说“从祭坛吃”，故以自然表达显明从祭坛所代表或承载的祭物中取食，但不进一步界定祭坛的神学所指。
- source_word: οὐκ ἔχουσιν ἐξουσίαν
  choice: 无权
  rationale: ἐξουσία在此表示获准享用的权利或资格；“无权”简洁保留其授权层面的含义。
- source_word: οἱ τῇ σκηνῇ λατρεύοντες
  choice: 那些在会幕中事奉的人
  rationale: λατρεύω在此指礼仪性的敬奉与圣所职事；σκηνή在《希伯来书》的语境中指会幕。“在会幕中事奉”自然表达与旧约圣所礼仪有关的服事。
theological_decisions:
- issue: “祭坛”在希伯来书13:10中的具体所指
  choice: 正文保留“祭坛”这一具体意象，不明确指定所指
  alternative: 基督自己、十字架、天上的祭坛，或基督献祭所带来的福分
  rationale: 希腊文在本节没有进一步说明“祭坛”的具体所指。保留原有意象，可避免以某一种解释取代经文本身，并保存其神学张力。
- issue: “在会幕中事奉的人”的范围
  choice: 按礼仪性圣所服事来表达，不在正文中进一步限定为某一具体群体
  alternative: 明确译作“旧约祭司”或泛指“在会幕敬拜的人”
  rationale: 分词短语直接描述与会幕礼仪有关的事奉者；译成“旧约祭司”虽可能符合语境，却比原文更具体，而泛译为普通敬拜者又会弱化λατρεύω在此的礼仪含义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“会幕”沿用中文圣经中清楚且通行的圣所术语；“事奉”体现礼仪性服事。“吃坛上的祭物”是对希腊文“从祭坛吃”的自然汉语表达。所有脚注标记均已置于正文。
