source:
  edition: SBLGNT
  text: καταρτίσαι ὑμᾶς ἐν ⸀παντὶ ἀγαθῷ εἰς τὸ ποιῆσαι τὸ θέλημα αὐτοῦ, ποιῶν ἐν ⸀ἡμῖν τὸ εὐάρεστον ἐνώπιον αὐτοῦ διὰ Ἰησοῦ Χριστοῦ, ᾧ ἡ δόξα εἰς τοὺς ⸀αἰῶνας· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/021.yaml
  text: may he equip you in every good thing to do his will[a], working in us what is pleasing before him through Jesus the Messiah, to whom be the glory forever and ever. Amen.
translation:
  language: zh_hans
  text: 愿他使你们在各样善事上齐备，好遵行他的旨意；又借着耶稣弥赛亚，在我们里面成就他眼中所喜悦的事。愿荣耀归给他[a]，直到永永远远。阿们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他”可能特指耶稣弥赛亚；也有人认为是指这段祷告的主语——和平的神。
    reason: 保留希腊文关系代词ᾧ的先行对象歧义。
lexical_decisions:
- source_word: καταρτίσαι
  choice: 使……齐备
  rationale: 该词可指装备、预备、使完善。在祝福祷告中，“使你们……齐备”自然表达神使信徒具备遵行其旨意所需的一切，同时不引入“恢复”这一上下文未明确强调的含义。
- source_word: ἐν παντὶ ἀγαθῷ
  choice: 在各样善事上
  rationale: 保留介词ἐν及“各样美善之事”的范围含义；与“使……齐备”连用，现代汉语通顺，也避免把原文明确改写成工具性的“用各样美善的东西”。
- source_word: εἰς τὸ ποιῆσαι τὸ θέλημα αὐτοῦ
  choice: 好遵行他的旨意
  rationale: εἰς加冠词不定式表示目的；“好……”简洁传达目的关系。“遵行旨意”比字面的“做他的旨意”更符合现代汉语惯用表达。
- source_word: ποιῶν ἐν ἡμῖν
  choice: 在我们里面成就
  rationale: ποιῶν描述神持续施行的工作；“成就”适合其使某事在信徒里面成为现实的语境。ἐν ἡμῖν主要按内在范围译为“在我们里面”，同时不排除群体层面的理解。
- source_word: τὸ εὐάρεστον ἐνώπιον αὐτοῦ
  choice: 他眼中所喜悦的事
  rationale: 以自然汉语表达名词化形容词和“在他面前”的评判视角，保留神所喜悦、悦纳的关系性含义。
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: 借着耶稣弥赛亚
  rationale: διά加属格表达媒介。“弥赛亚”保留Χριστός在此庄重神学语境中的称号意义。
- source_word: ᾧ ἡ δόξα
  choice: 愿荣耀归给他
  rationale: 采用汉语颂赞语的自然形式，同时以代词“他”保留关系代词ᾧ在先行对象上的歧义，不在正文中指定是和平的神还是耶稣弥赛亚。
- source_word: εἰς τοὺς αἰῶνας
  choice: 直到永永远远
  rationale: 这是表达无尽时间的惯用语；“直到永永远远”符合现代汉语经文颂赞语体，并充分传达复数“世代”的延展感。
theological_decisions:
- issue: 颂赞中关系代词ᾧ所指的对象
  choice: 正文译作“愿荣耀归给他”，不明确指定先行对象
  alternative: 明确译作“愿荣耀归给耶稣弥赛亚”，或“愿荣耀归给和平的神”
  rationale: 从语法邻近关系看，ᾧ可以指紧接在前的耶稣弥赛亚；从整段祷告的主语看，也可回指作为祈愿对象的神。原文没有消除这一张力，因此正文保留代词，并用脚注说明。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“使……齐备”“遵行他的旨意”“他眼中所喜悦的事”兼顾原文结构与汉语自然度；颂赞部分使用当代读者熟悉但不过分古雅的表达。
