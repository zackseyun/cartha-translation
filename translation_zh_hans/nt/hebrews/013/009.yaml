  text: διδαχαῖς ποικίλαις καὶ ξέναις μὴ παραφέρεσθε· καλὸν γὰρ χάριτι βεβαιοῦσθαι τὴν καρδίαν, οὐ βρώμασιν, ἐν οἷς οὐκ ὠφελήθησαν οἱ ⸀περιπατοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/009.yaml
  text: Do not be carried away by various and strange teachings[a], for it is good for the heart to be strengthened by grace, not by foods[c][b], by which those who occupied themselves with them were not benefited.
translation:
  language: zh_hans
  text: 不要被各样奇异的教导带偏；因为心靠恩典得以坚固[a]才是好的，不是靠食物[b]；那些以这些为生活准则的人[c]并没有从中得益处。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “得以坚固”也可译作“得以建立”或“变得坚定”。
    reason: lexical_alternative
  - marker: b
    text: “食物”可能指饮食方面的做法或与食物有关的礼仪；希腊原文只说“食物”。
    reason: cultural_note
  - marker: c
    text: “以这些为生活准则”也可译作“专注于这些事”。希腊原文字面意思是“在这些事物中行走”。
    reason: lexical_alternative
lexical_decisions:
- source_word: διδαχαῖς ποικίλαις καὶ ξέναις
  choice: 各种各样、奇异的教导
  rationale: “各种各样”表达ποικίλαις的多样性；“奇异”表达ξέναις在此“不属于所领受之信息、显得陌生”的警示意味，同时避免译成带有族群或来源色彩的“外来的”。“教导”比“教义”更宽泛，未将其限定为成体系的教义。
- source_word: μὴ παραφέρεσθε
  choice: 不要……带走
  rationale: 保留被动语态以及“被带离原处”的动态意象；现在时禁令带有持续警戒的意味。
- source_word: χάριτι
  choice: 靠恩典
  rationale: 将与格理解为方式或凭借，保留“恩典”的神学用语，不作解释性改写。
- source_word: βεβαιοῦσθαι τὴν καρδίαν
  choice: 心……得以坚固
  rationale: 保留καρδία的“心”这一圣经意象，并以“得以坚固”表达βεβαιοῦσθαι的被动含义及内在稳定之意。
- source_word: οὐ βρώμασιν
  choice: 而不是靠食物
  rationale: βρώμασιν字面为“食物”。正文不擅自限定为饮食条例、祭物或礼仪筵席；“靠”与前面的“靠恩典”形成清楚对照。
- source_word: ἐν οἷς οὐκ ὠφελήθησαν οἱ περιπατοῦντες
  choice: 那些照此而行的人并没有得到益处
  rationale: “照此而行”在自然汉语中保留περιπατέω以“行走”喻生活实践的意味，并以“此”回指前述食物及相关实践；“没有得到益处”反映被动形式而不显生硬。
theological_decisions:
- issue: “食物”的具体所指及其与恩典的对比
  choice: 正文保留“食物”，呈现恩典与倚靠食物相关实践之间的对比
  alternative: 明确译为饮食条例、祭祀筵席或犹太礼仪食规
  rationale: βρώμασιν本身只说“食物”。上下文可能涉及饮食规例或礼仪实践，但不足以在正文中锁定某一种解释。
- issue: “心”的隐喻含义
  choice: 保留“心”
  alternative: 译为内心、心灵、思想或内在生命
  rationale: καρδία在本句指人的内在中心，却具有重要的圣经意象；直译“心”可避免将其范围缩窄为理智或情感。
- issue: περιπατοῦντες与“食物”的关系
  choice: 译作“照此而行的人”，并用脚注说明字面形式
  alternative: 译作“拘泥于这些事的人”或“以这些为生活准则的人”
  rationale: 替代译法更顺畅却加入了“拘泥”或“准则”等解释。所选译法兼顾现代汉语与原文隐喻，并保留其可能指持续实践或按其生活的开放性。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“带走”保留原文被动及偏离正道的动态意象；分号和句号使恩典与食物的对比清晰，同时避免过长的欧化句式。所有脚注标记均紧随其所说明的词语或分句。
