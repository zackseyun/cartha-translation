lexical_decisions:
- source_word: ἡ χάρις
  choice: 恩典
  rationale: χάρις在这里是书信结尾祝福语中的惯用词。“恩典”是现代中文圣经语境中自然、庄重且准确的对应表达；希腊语定冠词不必机械译出。
- source_word: μετὰ
  choice: 愿……同在
  rationale: μετά接属格表示“与……同在”。原文是省略动词的祝福句式，中文补出“愿”可自然表达其祝愿语气，而不增加新的神学含义。
- source_word: πάντων ὑμῶν
  choice: 你们众人
  rationale: πάντων明确包含全体收信人。“你们众人”既保留“所有人”的范围，也符合庄重而易懂的现代中文表达。
