  text: ὥστε θαρροῦντας ἡμᾶς λέγειν· Κύριος ἐμοὶ βοηθός, ⸀οὐ φοβηθήσομαι· τί ποιήσει μοι ἄνθρωπος;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/006.yaml
  text: so that we confidently say[a], “The Lord is my helper; I will not be afraid[b]. What can man do to me?”
translation:
  language: zh_hans
  text: 所以，我们可以满怀信心地说：“主是我的帮助者；我必不惧怕。人能把我怎么样呢？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较形式对应地译作：“人会把我怎么样呢？”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: 所以
  rationale: 承接上文并表达由此得出的结果；现代汉语用“所以”自然清楚。
- source_word: θαρροῦντας ἡμᾶς λέγειν
  choice: 我们可以满怀信心地说
  rationale: θαρροῦντας 表示有勇气、有信心；“满怀信心地说”既自然又保留其分量，“可以”体现整个结果结构在汉语中的表达。
- source_word: Κύριος ἐμοὶ βοηθός
  choice: 主是帮助我的
  rationale: 保留帮助者的个人性以及 ἐμοὶ“为我、帮助我”的关系；比“主是我的帮助者”更符合现代汉语经文语体。
- source_word: οὐ φοβηθήσομαι
  choice: 我必不惧怕
  rationale: 保留将来时和坚定宣告的语气；“必不惧怕”庄重而易懂。
- source_word: τί ποιήσει μοι ἄνθρωπος
  choice: 人能把我怎么样呢？
  rationale: 以自然的汉语反问表达将来时 ποιήσει 在语境中的修辞力量；“人”准确传达泛指单数 ἄνθρωπος，并不限于男性。
theological_decisions:
- issue: 泛指单数 ἄνθρωπος 的表达
  choice: 人
  alternative: 世人；任何人；人类
  rationale: “人”在现代汉语中可自然作泛指，既保留单数代表性，也不误导为只指男性。
- issue: 反问中 ποιήσει 的将来时力量
  choice: 人能把我怎么样呢？
  alternative: 人将把我怎么样呢？
  rationale: 原文形式是将来时，直译为“将怎样”虽可行，但汉语通常用“能把我怎么样”表达同一反问含义，即人的威胁最终不足为惧；脚注保留较形式对应的译法。
- issue: 引文所表达的信靠
  choice: 保留“主是帮助我的”与“我必不惧怕”之间的张力
  alternative: 扩写为主必保护我免受一切伤害
  rationale: 原文宣告对主的信靠，却没有明确声称信徒不会遭遇任何现实伤害，因此不作神学扩写。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。引文带有诗篇式宣告色彩，因此以“满怀信心”“必不惧怕”维持庄重语气，同时用“人能把我怎么样呢”呈现自然有力的现代汉语反问。
