base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/015.yaml
  text: Therefore[a], through him let us continually offer up to God a sacrifice of praise—that is[c][b], the fruit of lips confessing his name.
translation:
  language: zh_hans
  text: 因此，让我们借着他不断向上帝献上赞美的祭；这祭就是宣认他名的嘴唇所结的果子。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “宣认”也可译为“承认”或“公开承认”。原文用词可指公开地承认或认可。
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ αὐτοῦ
  choice: 借着他
  rationale: διά加属格表示媒介或途径；“借着他”自然保留上下文中以基督为中保的含义，同时不把代词明说为名字。
- source_word: οὖν
  choice: 所以
  rationale: 表示由前文推出的劝勉；“所以”在现代汉语中清楚而自然。
- source_word: ἀναφέρωμεν
  choice: 我们要……献上
  rationale: 第一人称复数劝勉虚拟式；“我们要”传达共同劝勉，“献上”保留献祭语义。
- source_word: θυσίαν αἰνέσεως
  choice: 赞美的祭
  rationale: 保留祭献意象及属格结构，也与经文的旧约背景相呼应。
- source_word: διὰ παντός
  choice: 常常
  rationale: 表达持续、经常之意；在现代汉语中简洁顺畅，不必强化为毫无间断。
- source_word: τῷ θεῷ
  choice: 向上帝
  rationale: 与“献上”搭配，清楚表达上帝是祭的承受者。
- source_word: τοῦτ’ ἔστιν
  choice: 就是
  rationale: 引出对“赞美的祭”的解释，在汉语中自然直接。
- source_word: καρπὸν χειλέων
  choice: 嘴唇所结的果子
  rationale: 保留“嘴唇之果”的具体比喻，同时用“所结的”使汉语关系清楚；不补入原文没有明说的“我们”。
- source_word: ὁμολογούντων
  choice: 承认
  rationale: 可指公开承认、宣认或认可；“承认”保留一定语义宽度，避免直接解释为“赞美”或“感谢”。
- source_word: τῷ ὀνόματι αὐτοῦ
  choice: 他名
  rationale: 按汉语习惯作“承认”的宾语；“名”保留原文带有身份与声名内涵的圣经表达。
theological_decisions:
- issue: δι’ αὐτοῦ中“他”的所指
  choice: 保留“借着他”，由上下文指向耶稣及其中保作用。
  alternative: 直接译作“借着耶稣”或只作泛指的“借着他”。
  rationale: 紧接前文时，“他”最自然地指耶稣；但原文使用代词，正文也保留代词，以免加入原文未明说的称名。
- issue: 献祭语言的力度
  choice: 保留“献上赞美的祭”。
  alternative: 意译为“向上帝献上赞美”或“赞美上帝”。
  rationale: 原文刻意以献祭来描述赞美；保留这一意象可维持本段在旧约祭制与信徒敬拜之间的神学张力。
- issue: ὁμολογούντων的含义
  choice: 正文译作“承认”，脚注说明也可理解为公开宣认。
  alternative: 译作“宣认”“称颂”或“感谢”。
  rationale: 该词在此可表示承认或公开宣认；不宜把它收窄为单纯赞美或感谢。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“嘴唇所结的果子”有意保留原文及其经文背景中的比喻；整体句序稍作汉语化，同时保存“借着他”“献上”“祭”等关键神学表达。
