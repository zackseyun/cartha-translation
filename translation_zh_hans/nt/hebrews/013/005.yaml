  text: ἀφιλάργυρος ὁ τρόπος· ἀρκούμενοι τοῖς παροῦσιν· αὐτὸς γὰρ εἴρηκεν· Οὐ μή σε ἀνῶ οὐδ’ οὐ μή σε ⸀ἐγκαταλίπω·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/005.yaml
  text: Let your way of life be free from the love of money[a], being content with what you have, for he himself has said, “I will never leave you[b], nor will I ever forsake you.”
translation:
  language: zh_hans
  text: 你们行事为人，不可贪爱钱财；要以现有的为满足[a]，因为他亲自说过：“我绝不撇下你[b]，也绝不离弃你。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“要以自己所有的为足。”直译：“以现有的事物为满足。”
    reason: lexical_alternative
  - marker: b
    text: 这句话呼应旧约中上帝立约的保证，尤其见申命记31:6、8和约书亚记1:5。
    reason: cross_reference
lexical_decisions:
- source_word: ἀφιλάργυρος ὁ τρόπος
  choice: 你们的生活不可贪爱钱财
  rationale: ἀφιλάργυρος明确指不爱钱、不受贪财支配；ὁ τρόπος在此指生活方式或品行。采用“生活不可贪爱钱财”，既保留具体对象“钱财”，也使谓语式劝勉在现代汉语中自然清楚。
- source_word: ἀρκούμενοι
  choice: 要……为满足
  rationale: 该分词承接前句并带劝勉意味，表达持续知足的态度；“要以……为满足”自然体现其与前句的逻辑联系。
- source_word: τοῖς παροῦσιν
  choice: 以现有的为满足
  rationale: 字面指“现有的事物”，可涵盖当前所有和处境。“现有的”较贴近原文，同时避免把范围限定为物质财产。
- source_word: αὐτὸς γὰρ εἴρηκεν
  choice: 因为他亲自说过
  rationale: 保留αὐτός的强调而不在正文补入原文没有的“上帝”；完成时εἴρηκεν以“说过”表达已经说出且仍具效力的话。
- source_word: Οὐ μή σε ἀνῶ
  choice: 我绝不撇下你
  rationale: οὐ μή构成强烈否定；ἀνίημι在此为不放开、不撇下。“绝不撇下”既自然，也有庄重的应许语气。
- source_word: οὐδ’ οὐ μή σε ἐγκαταλίπω
  choice: 也绝不离弃你
  rationale: ἐγκαταλείπω指遗弃、离弃；再次用“绝不”传达第二个οὐ μή的强烈否定，并保留两个并列保证。
theological_decisions:
- issue: 引语说话者的身份
  choice: 正文保留“他亲自说过”
  alternative: “因为上帝亲自说过”
  rationale: 上下文和经文回响表明说话者是上帝，但希腊文使用代词αὐτός，并未明说θεός。保留代词可避免增添原文没有的名词，同时传达强调。
- issue: 引语中双重强烈否定的表达
  choice: “我绝不撇下你，也绝不离弃你”
  alternative: “我决不会撇下你，也决不会遗弃你”
  rationale: 两个οὐ μή分别加强两个动词。汉语用两次“绝不”可自然保留保证的强度，而不机械复制希腊语否定结构。
- issue: “现有的”所指范围
  choice: 保留相对宽泛的“现有的”
  alternative: “你们所有的”
  rationale: τοῖς παροῦσιν可指当前拥有之物，也可能含当前处境；采用“现有的”保留这一语义幅度，不把劝勉仅限于财物。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“贪爱钱财”比笼统的“贪心”更准确对应原文；“撇下／离弃”保留经文应许的庄严语气。所有脚注标记均置于相关正文之后。
