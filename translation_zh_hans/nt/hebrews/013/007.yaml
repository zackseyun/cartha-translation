reference: Hebrews 13:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Μνημονεύετε τῶν ἡγουμένων ὑμῶν, οἵτινες ἐλάλησαν ὑμῖν τὸν λόγον τοῦ θεοῦ, ὧν ἀναθεωροῦντες τὴν ἔκβασιν τῆς ἀναστροφῆς μιμεῖσθε τὴν πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/007.yaml
  text: Remember your leaders[a], who spoke the word of God to you. As you consider the outcome of their way of life[b], imitate their faith.
translation:
  language: zh_hans
  text: 要记得那些带领你们的人；他们曾向你们讲过神的道。你们要仔细思想他们行事为人的结局[a]，效法他们的信心[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “结局”也可译作“结果”或“终局”；有些解释认为这里特指他们离世的方式。
    reason: lexical_alternative
  - marker: b
    text: “信心”也可译作“忠信”。希腊词πίστις在这里可表达这两种意思。
    reason: alternative_reading
lexical_decisions:
- source_word: Μνημονεύετε
  choice: 要记得
  rationale: 现在时命令语气带有持续记念之意；“要记得”是自然的现代汉语，也能在劝勉语境中表达持续关注。
- source_word: τῶν ἡγουμένων ὑμῶν
  choice: 那些带领你们的人
  rationale: 指群体中受认可的带领者；此译法保留实际的带领职分，又避免“统治者”所带来的政治或强权色彩。
- source_word: οἵτινες ἐλάλησαν ὑμῖν τὸν λόγον τοῦ θεοῦ
  choice: 他们曾向你们讲过神的道
  rationale: 忠实表达“向你们说神的话”；“神的道”保留常见的圣经用语，而“曾……讲过”也与过去时相符。
- source_word: ἀναθεωροῦντες
  choice: 仔细思想
  rationale: 该词含仔细观察、反复考量之意；“仔细思想”在汉语中自然地表达关注并省察。
- source_word: τὴν ἔκβασιν
  choice: 结局
  rationale: 可指结果、结局或终局；“结局”既贴近语义，又不在正文中武断限定为死亡或殉道。
- source_word: τῆς ἀναστροφῆς
  choice: 他们行事为人
  rationale: 指人的品行和生活方式；“行事为人”是清楚、庄重而自然的现代汉语表达。
- source_word: μιμεῖσθε
  choice: 效法
  rationale: 直接表达以他人为榜样而仿效；比“模仿”更适合庄重的劝勉语境。
- source_word: τὴν πίστιν
  choice: 他们的信心
  rationale: πίστις在此既可指“信心”，也可指“忠信”；正文依项目通常译法采用“信心”，并以脚注保留另一可能。
theological_decisions:
- issue: πίστις在可供效法的人身上是指“信心”还是“忠信”
  choice: 信心
  alternative: 忠信
  rationale: 两种含义在本句都成立。正文采用“信心”，但用脚注明确保留“忠信”，不消除原文中的解释张力。
- issue: ἔκβασις是否特指这些带领者的死亡或殉道
  choice: 结局
  alternative: 结果；终局；死亡的方式
  rationale: 原词可以泛指结果或结局；上下文可能让人想到生命的终点，甚至死亡，但经文本身没有明说殉道，因此正文不作过度限定。
translation_notes:
  register: 采用现代、庄重、易懂的普通话。“那些带领你们的人”比职衔化的“领袖”更贴近分词结构；“行事为人”和“效法”保持经文劝勉的郑重语气。脚注按正文出现顺序重新编号。
