  terminology: “劝”与“更恳切地”合用恰当地表达恳求/劝勉的语气；“回到你们那里”自然地处理了被动式的汉语表达，未具体化历史处境。脚注应说明“回到/被重新带回到你们身边”的替代表达，而非误作“使这事成就”。
