  text: περισσοτέρως δὲ παρακαλῶ τοῦτο ποιῆσαι ἵνα τάχιον ἀποκατασταθῶ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/019.yaml
  text: And I urge you all the more to do this[a], so that I may be restored to you sooner.
translation:
  language: zh_hans
  text: 我更恳切地劝你们这样做[a]，好让我能早些回到你们那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这样行。”这里“这样做”回指上文请你们为作者祷告的请求。
    reason: 澄清τοῦτο ποιῆσαι的回指对象，并提供不改变原意的自然表达选择。
lexical_decisions:
- source_word: περισσοτέρως
  choice: 更恳切地
  rationale: 这是比较级副词，在此加强劝请的程度；“更恳切地”既保留比较意味，也自然表达请求的迫切性。
- source_word: δὲ
  choice: 不单独译出
  rationale: 此处 δέ 只是轻微承接上文。现代汉语无需另加“而且”或“但是”，省译可避免夸大转折，同时保持语流自然。
- source_word: παρακαλῶ
  choice: 劝
  rationale: 此处表示恳切敦促、请求；与“更恳切地”搭配，准确传达语气，又不过分强化为命令。
- source_word: τοῦτο ποιῆσαι
  choice: 这样做
  rationale: τοῦτο 回指上一节请读者为作者祷告之事。“这样做”简洁自然，并保留回指关系。
- source_word: ἵνα
  choice: 好让
  rationale: 引出目的或预期结果；“好让”在现代汉语中自然地保留目的意味。
- source_word: τάχιον
  choice: 早些
  rationale: 比较级副词，表示“更快、较早”。在返回某地的语境中，“早些”比“更快地”更符合现代汉语习惯。
- source_word: ἀποκατασταθῶ
  choice: 回到
  rationale: 该被动式可指被恢复、被送回或重新回到某人那里。汉语“回到你们那里”自然表达重聚，却不说明造成分离的具体情形。其较宽的词义范围以脚注注明。
- source_word: ὑμῖν
  choice: 你们那里
  rationale: 复数与格表示朝向或重新归于收信人；“你们那里”符合汉语中“回到”所需的方向表达，并明确对象为众人。
theological_decisions:
- issue: 作者盼望以何种方式重新与收信人相聚
  choice: 译作“回到你们那里”，不具体说明分离或不能返回的原因
  alternative: 获释后回去；旅行结束后返回；恢复在他们中间的服事；康复后重聚
  rationale: ἀποκατασταθῶ ὑμῖν 只表明作者希望重新回到或被恢复给收信人，并未说明是监禁、疾病、旅行还是其他处境。正文保持历史与神学上的克制。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“更恳切地劝”传达请求的力度；“早些回到你们那里”读来顺畅，同时不擅自断定作者当时身处监禁、患病或旅行之中。正文脚注标记与脚注条目一致。
