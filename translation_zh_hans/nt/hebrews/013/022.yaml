  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, ἀνέχεσθε τοῦ λόγου τῆς παρακλήσεως, καὶ γὰρ διὰ βραχέων ἐπέστειλα ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/022.yaml
  text: I urge you[a], brothers, bear with this word of exhortation[b], for I have written to you briefly.
translation:
  language: zh_hans
  text: 弟兄们[a]，我劝你们包容这番劝勉的话[b]，因为我简略地写给你们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄们”也可理解为“弟兄姊妹们”；希腊原文作“弟兄们”，在这里可能用来称呼全体会众。
    reason: lexical_alternative
  - marker: b
    text: “劝勉的话”也可译作“鼓励的信息”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: 我劝你们
  rationale: παρακαλέω在此是作者向收信人提出恳切请求；“劝”自然、郑重，也保留劝请而非命令的语气。
- source_word: δὲ
  choice: 不单独译出
  rationale: δὲ在此仅作轻微转折或推进话语的连接词。现代汉语在这句结语中不必另加“如今”或“但是”，省去更自然，也避免制造原文没有的时间或强烈对比。
- source_word: ἀδελφοί
  choice: 弟兄们
  rationale: 该词字面为阳性复数“弟兄们”。正文保留原文形式；其在会众称呼中可能兼指男女，另以脚注说明。
- source_word: ἀνέχεσθε
  choice: 耐心接受
  rationale: ἀνέχομαι有忍受、容忍、耐心承受之意。这里所承受的是劝勉信息；“耐心接受”保留其要求听众包容、承受的力度，同时比“忍受”更符合现代汉语书信语境。
- source_word: τοῦ λόγου τῆς παρακλήσεως
  choice: 这番劝勉的话
  rationale: λόγος指所传达的话或信息，παράκλησις在此兼有劝勉、鼓励的语义。“这番劝勉的话”语言自然，并指向当前这篇文字；“鼓励的信息”作为可能译法收入脚注。
- source_word: καὶ γὰρ
  choice: 因为
  rationale: 该组合为前面的请求提供理由；现代汉语用“因为”即可清楚表达其解释性、因果性功能，无须逐词硬译。
- source_word: διὰ βραχέων
  choice: 简略地
  rationale: 这是“用少量话语、简短地”的习语。“简略地”既保留作者对篇幅或表达简短的陈述，也符合现代汉语。
- source_word: ἐπέστειλα ὑμῖν
  choice: 写给你们
  rationale: ἐπιστέλλω在书信语境中可指写信或以书面方式传达；“写给你们”准确表达动作及收信对象，又不额外补入原文未明说的“这封信”。
theological_decisions:
- issue: ἀδελφοί是否应在正文中明确包含女性
  choice: 正文译“弟兄们”，脚注说明可能包括全体会众
  alternative: 弟兄姊妹们
  rationale: 原文采用阳性复数称呼，但在古代会众语境中可能具有包举性的指称。正文保留词形所体现的称呼，脚注则保存其可能包括女性的语用范围，避免把两者之一静默绝对化。
- issue: παράκλησις的劝勉与鼓励双重色彩
  choice: 正文译“劝勉”，脚注保留“鼓励”
  alternative: 鼓励的信息
  rationale: 本句是作者请求读者承受整篇信息，“劝勉”较能体现训诫和呼吁的力度；但该词也可表达安慰、鼓励，因此以脚注保留这一语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的书信语体。“耐心接受”避免“忍受这话”在现代汉语中过强的负面意味，同时保留ἀνέχεσθε要求读者包容承受的语气；句式简洁，以符合本节结语性质。
