id: HEB.13.16
reference: Hebrews 13:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: τῆς δὲ εὐποιΐας καὶ κοινωνίας μὴ ἐπιλανθάνεσθε, τοιαύταις γὰρ θυσίαις εὐαρεστεῖται ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/016.yaml
  text: And do not neglect doing good and sharing[b][a], for with such sacrifices God is pleased.
translation:
  language: zh_hans
  text: 也不要忘记[a]行善和与人分享[b]，因为这样的祭是上帝所喜悦的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “忘记”也可译作“忽略”。希腊文直译是“忘记”，但在这里实际指没有把这些事付诸行动。
    reason: lexical_alternative
  - marker: b
    text: “与人分享”也可译作“相交”或“慷慨给予”；在本节语境中，很可能是指实际与别人分享自己的资源。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐποιΐας
  choice: 行善
  rationale: 该名词指主动行出美善、惠及他人的事；“行善”简洁自然，并保留其行动意味。
- source_word: κοινωνίας
  choice: 与人分享
  rationale: 此处与“行善”并列，又被称为“祭”，主要指实际与人分享资源；这一译法也保留了原词可涵盖相交、参与和慷慨给予的宽度。
- source_word: μὴ ἐπιλανθάνεσθε
  choice: 不要忘记
  rationale: 直译为“不要忘记”，在劝勉语境中也含有“不要忽略、不去实行”的实际意味；正文保留原词表层意象，脚注说明语用含义。
- source_word: τοιαύταις ... θυσίαις
  choice: 这样的祭
  rationale: 保留原文把行善和分享称为献给上帝之“祭”的明确比喻，不将其弱化为一般善行。
- source_word: εὐαρεστεῖται
  choice: 是上帝所喜悦的
  rationale: 自然表达上帝以这样的祭为喜悦，同时贴合希腊文被动形式。
- source_word: ὁ θεός
  choice: 上帝
  rationale: 现代标准汉语中对 θεός 的清楚、庄重译法。
- source_word: δὲ
  choice: 也
  rationale: 此处承接上一节的劝勉，并无强烈转折；“也”自然体现其增补和连接作用。
theological_decisions:
- issue: 本节“祭”的性质
  choice: 将行善和分享资源比喻为上帝所喜悦的祭
  alternative: 仅指施舍作为礼仪祭献的替代，或泛指不带祭祀意象的伦理行为
  rationale: 原文明确使用 θυσίαις（祭），因此保留祭献比喻，同时不把 κοινωνία 过度限定为施舍，也不消解其敬拜层面的含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“行善”“与人分享”清楚自然；“这样的祭”保留原文的祭献意象。“也”承接前文，避免制造原文没有的强烈转折。
