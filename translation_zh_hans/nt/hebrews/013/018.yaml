source:
  edition: SBLGNT
  text: Προσεύχεσθε περὶ ἡμῶν, ⸀πειθόμεθα γὰρ ὅτι καλὴν συνείδησιν ἔχομεν, ἐν πᾶσιν καλῶς θέλοντες ἀναστρέφεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/018.yaml
  text: Pray for us[a], for we are convinced that we have a good conscience[c][b], since we want to conduct ourselves well in everything.
translation:
  language: zh_hans
  text: 请为我们祷告，因为我们确信[a]自己有一颗无愧的良心[b]，愿意在一切事上都行得端正。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “确信”或译“相信”或“有把握”。
    reason: lexical_alternative
  - marker: b
    text: “无愧的良心”直译“美好的良心”；也可译“清白的良心”。
    reason: lexical_alternative
  - marker: c
    text: 末句也可译作：“因为我们愿意在一切事上都行得端正。”希腊文在此使用分词，和前句的逻辑关系可以不明确说出。
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: Προσεύχεσθε
  choice: 请……祷告
  rationale: 现在时命令语气，要求收信人为作者一行祷告；现代汉语用“请”表达恳请，语气自然庄重，不强行把持续体明说为“不断”。
- source_word: περὶ ἡμῶν
  choice: 为我们
  rationale: περί加属格与祷告用语连用时，汉语惯用“为……祷告”。
- source_word: πειθόμεθα
  choice: 我们确信
  rationale: 表达说话者已经形成并持有的坚定判断；“确信”保留其认知意味。“相信”或“有把握”也可能，列入脚注。
- source_word: καλὴν συνείδησιν
  choice: 一颗无愧的良心
  rationale: “无愧的良心”是自然的现代汉语伦理表达；原文较直译为“美好的良心”，其含义也可理解为清白、正直的良心，因此以脚注保留较形式对应的译法。
- source_word: ἔχομεν
  choice: 有
  rationale: 直接对应简单陈述，无须扩译。
- source_word: ἐν πᾶσιν
  choice: 在一切事上
  rationale: 中性复数在此作全面性的副词用法，指行为生活的各方面。
- source_word: καλῶς
  choice: 端正
  rationale: 在伦理行为语境中自然表达“良好、正当地”；比笼统的“好好地”更庄重，又不限定为某一种具体美德。
- source_word: θέλοντες
  choice: 愿意
  rationale: 保留现在分词所表达的持续意愿，并尽量不在正文中把它与前句的逻辑关系限定为因果。
- source_word: ἀναστρέφεσθαι
  choice: 行得
  rationale: 结合καλῶς译成“行得端正”，自然表达生活方式和品行，不局限于一次行为。
theological_decisions:
- issue: 末尾分词短语与“有一颗无愧的良心”之间的关系
  choice: 以逗号连接“愿意在一切事上都行得端正”，保留分词短语较开放的附属关系
  alternative: 译作“因为我们愿意在一切事上都行得端正”，明确解释为原因或根据
  rationale: θέλοντες在语法上可说明作者为何作出良心无愧的陈述，也可较宽泛地描写其意愿。正文不明确补入“因为”，以免把其逻辑关系说得过死，也不把作者的话强化成无罪或行为完全。
- issue: “美好的良心”的伦理含义
  choice: 译作“无愧的良心”
  alternative: 较直译作“美好的良心”或译作“清白的良心”
  rationale: καλή本义宽泛，不必把良心状态定义为绝对无罪；“无愧”在汉语中能表达良心对自身行为的正面见证，同时脚注保留形式更贴近原文的译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“请为我们祷告”符合教会与日常宗教语境；“在一切事上都行得端正”保留全面性的伦理要求，同时避免古奥的“凡事按正道而行”。所有脚注标记均已置于正文相应位置。
