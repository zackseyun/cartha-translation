  text: τίμιος ὁ γάμος ἐν πᾶσιν καὶ ἡ κοίτη ἀμίαντος, πόρνους ⸀γὰρ καὶ μοιχοὺς κρινεῖ ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/004.yaml
  text: Let marriage be held in honor among all[a], and the marriage bed be undefiled[b], for God will judge the sexually immoral and adulterers.
translation:
  language: zh_hans
  text: 婚姻应当受众人尊重[a][b]，婚床也不可玷污，因为神必审判淫乱的人和通奸的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“婚姻在众人中是尊贵的。”希腊文前半句没有明示动词，因此既可读作劝勉，也可读作陈述。
    reason: alternative_reading
  - marker: b
    text: “受众人尊重”也可理解为“在各方面受尊重”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τίμιος
  choice: 应当受到……尊重
  rationale: 该词表示受尊崇、贵重或值得珍视；结合第13章连续劝勉的语境，译为劝勉语气，同时保留其尊荣含义。
- source_word: γάμος
  choice: 婚姻
  rationale: 此处指婚姻这一关系或制度，而非婚礼仪式。
- source_word: ἐν πᾶσιν
  choice: 受到众人的
  rationale: 该短语最自然地指所有人；这样表达为现代汉语所惯用，并保留普遍范围。另一种可行理解“在各方面”列入脚注。
- source_word: κοίτη
  choice: 婚床
  rationale: 原义为床，在此借指婚姻内的性关系；“婚床”既简洁庄重，也与“婚姻”相呼应。
- source_word: ἀμίαντος
  choice: 不可玷污
  rationale: 该词有不受沾染、纯洁之意；劝勉式译法符合上下文，并保留其道德与礼仪层面的意象。
- source_word: πόρνους
  choice: 淫乱的人
  rationale: 泛指从事不道德性行为的人；此译法现代、清楚，并保持其范围比“通奸”更广。
- source_word: μοιχούς
  choice: 通奸的人
  rationale: 专指违背婚姻忠贞、与配偶以外之人发生性关系者，并保留它与较广义的 πόρνους 之间的区别。
- source_word: κρινεῖ
  choice: 必审判
  rationale: 将来时指向神将来的审判；不译作“定罪”，以免超过原词本身所说明的结果。
- source_word: γάρ
  choice: 因为
  rationale: 明确引出前面劝勉的理由，符合现代汉语逻辑衔接。
theological_decisions:
- issue: 开头无显式动词的分句应理解为陈述还是劝勉
  choice: 正文采用劝勉式：“婚姻应当受到众人的尊重”
  alternative: 陈述式：“婚姻在众人中是可尊重的”
  rationale: 希腊文没有明示的限定动词，两种理解在语法上都可能。希伯来书13章的连续伦理劝勉更支持劝勉式，但真实的语法歧义在脚注中保留。
- issue: ἐν πᾶσιν 的所指
  choice: 理解为“众人”，即婚姻应受所有人尊重
  alternative: 理解为“在各方面”，即婚姻在一切方面都应受尊重
  rationale: 阳性或中性复数形式本身可能容许不同理解；语境中指人较自然，但不宜抹去另一种可行读法。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“婚床”保留原文含蓄但清楚的婚姻性关系意象；“淫乱的人”和“通奸的人”维持两个希腊词范围上的区别。所有脚注标记均已置于正文相应位置。
