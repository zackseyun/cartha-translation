  text: Ὁ δὲ θεὸς τῆς εἰρήνης, ὁ ἀναγαγὼν ἐκ νεκρῶν τὸν ποιμένα τῶν προβάτων τὸν μέγαν ἐν αἵματι διαθήκης αἰωνίου, τὸν κύριον ἡμῶν Ἰησοῦν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/020.yaml
  text: May the God of peace[a], who brought up from the dead our Lord Jesus, the great shepherd of the sheep, by the blood of an eternal covenant,
translation:
  language: zh_hans
  text: 愿平安的上帝，就是那借着永约之血[a]，使群羊的大牧人——我们的主耶稣——从死人中复活的上帝，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文“借着永约之血”也可修饰“群羊的大牧人”，即理解为“那在／借着永约之血中的群羊大牧人”。
    reason: 原文介词短语的修饰对象存在真实的句法歧义。
lexical_decisions:
- source_word: Ὁ δὲ
  choice: 愿……的上帝
  rationale: δέ在这里标示从劝勉转入祝祷；现代汉语无需另加“如今”或“但是”，祝愿式“愿”已自然体现语篇转折。
- source_word: θεὸς τῆς εἰρήνης
  choice: 赐平安的上帝
  rationale: 此属格结构表明上帝以平安为特征并与平安密切相关；“赐平安的上帝”符合现代汉语习惯，也适合祝祷语境。
- source_word: ὁ ἀναγαγὼν ἐκ νεκρῶν
  choice: 使……从死人中起来
  rationale: 保留ἀνάγω“使上来、带上来”的复活意象，同时用现代汉语清楚表达上帝使耶稣从死者中复起。
- source_word: τὸν ποιμένα τῶν προβάτων τὸν μέγαν
  choice: 群羊的大牧人
  rationale: 保留“大牧人”及羊的牧养比喻；“群羊”比逐字的“羊的大牧人”更自然，又不把意象抽象化。
- source_word: ἐν αἵματι
  choice: 借着……之血
  rationale: ἐν可表达工具、媒介或关联；“借着”自然呈现可能的工具意义，但不进一步解释其救赎机制。
- source_word: διαθήκης αἰωνίου
  choice: 永约
  rationale: διαθήκη在《希伯来书》的论述中指“约”；“永约”简洁保留其持续、永久的性质，且原文无冠词，不强加“那永约”的限定。
- source_word: τὸν κύριον ἡμῶν Ἰησοῦν
  choice: 我们的主耶稣
  rationale: 按原文同位关系，明确“大牧人”就是“我们的主耶稣”，并保留κύριος的称号“主”。
theological_decisions:
- issue: ἐν αἵματι διαθήκης αἰωνίου与句中其他成分的关系
  choice: 主要连接上帝使耶稣从死人中起来的行动，译为“借着永约之血……使……起来”
  alternative: 连接“大牧人”，理解为耶稣是“凭着／在永约之血中的群羊大牧人”
  rationale: 原文词序容许不止一种句法连接。正文采用语境中较自然的工具性理解，但以脚注保留修饰“大牧人”的可能性，不把复活、约与血之间的神学关系扩写为特定教义公式。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。以破折号标明“我们的主耶稣”与“大牧人”的同位关系。经文在本节末尚未成句，因此保留句末逗号，与下一节的祝祷内容衔接。
