  text: ἀσπάσασθε πάντας τοὺς ἡγουμένους ὑμῶν καὶ πάντας τοὺς ἁγίους. ἀσπάζονται ὑμᾶς οἱ ἀπὸ τῆς Ἰταλίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/024.yaml
  text: Greet all your leaders and all the saints[a]. Those from Italy greet you.
translation:
  language: zh_hans
  text: 请问候所有带领你们的人和所有圣徒。来自意大利的人向你们问安。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在意大利的人向你们问安。”希腊语短语既可指来自意大利的人，也可指身在意大利的人。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: 请问候
  rationale: 这是不定过去时中间语态命令式；“请问候”在现代书信语境中自然、得体，并保留命令语气。
- source_word: πάντας
  choice: 所有
  rationale: 直接表达对整个群体的涵盖，也符合现代汉语习惯。
- source_word: τοὺς ἡγουμένους ὑμῶν
  choice: 带领你们的人
  rationale: 分词的字面意义是“带领的人”；此译法自然，并避免“统治者”可能带来的政治性误解。
- source_word: τοὺς ἁγίους
  choice: 圣徒
  rationale: 这是新约对信徒群体的常用称呼；“圣徒”保留其词汇和神学分量，而不扩展为解释性的表达。
- source_word: ἀσπάζονται
  choice: 向……问安
  rationale: 在书信结语中，“向你们问安”是自然的现代汉语表达，并准确传达现在时直陈语气。
- source_word: οἱ ἀπὸ τῆς Ἰταλίας
  choice: 来自意大利的人
  rationale: ἀπό加属格通常表示来源或出处，因此正文采用“来自意大利”；该短语也可能指身在意大利的人，故以脚注保留。
theological_decisions:
- issue: οἱ ἀπὸ τῆς Ἰταλίας所指的人
  choice: 来自意大利的人
  alternative: 在意大利的人
  rationale: ἀπό通常表示来源，所以正文保留较直接的词义；但此处也可能按所在地理解，这会影响对本书信写作地点的推断，因此不武断消除其歧义，而在脚注中注明。
translation_notes:
  register: 采用现代、庄重且易懂的书信体。“带领你们的人”比“领袖”更贴近希腊语分词结构；“圣徒”保留新约传统称谓。脚注标记置于相关歧义句之后。
