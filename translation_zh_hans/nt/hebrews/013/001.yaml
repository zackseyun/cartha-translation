  text: Let brotherly love continue[a].
translation:
  language: zh_hans
  text: 弟兄姊妹之间的亲爱要常存[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文也可直译为“弟兄之爱”，指信徒群体中家人般的手足之爱，并非只限于男性。
    reason: 说明原文的家庭隐喻及其包含男女信徒的范围。
lexical_decisions:
- source_word: φιλαδελφία
  choice: 弟兄姊妹之间的亲爱
  rationale: 该词表达家人般的手足之爱；在这里特指信徒群体内部的亲爱。“弟兄姊妹”既保留原文的家庭隐喻，也避免现代读者误以为对象仅限男性。
- source_word: μενέτω
  choice: 要常存
  rationale: 这是现在时主动命令式，要求这种爱持续存在。“要常存”同时传达劝勉语气和延续意义。
- source_word: Ἡ
  choice: 不单独译出
  rationale: 定冠词表明这是读者熟知的德行；现代汉语在此类劝勉句中无需另译，其语用作用已由整体表达体现。
theological_decisions:
- issue: φιλαδελφία所指的范围及其家庭性语言
  choice: 译作“弟兄姊妹之间的亲爱”
  alternative: 弟兄之爱；信徒之间的爱；彼此相爱
  rationale: 原词以手足关系为意象，指基督徒群体中家人般的爱，并非只涉及男性。正文明确写出“弟兄姊妹”，既保存群体的家庭性，也准确表达其涵盖范围；不把它弱化为泛泛的“彼此相爱”。
translation_notes:
  register: 采用简洁、庄重而通顺的现代标准汉语。“常存”保留经文劝勉的凝练感，同时清楚表达持续不断之意。
