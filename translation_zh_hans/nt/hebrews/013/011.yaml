  text: ὧν γὰρ εἰσφέρεται ζῴων τὸ αἷμα περὶ ἁμαρτίας εἰς τὰ ἅγια διὰ τοῦ ἀρχιερέως, τούτων τὰ σώματα κατακαίεται ἔξω τῆς παρεμβολῆς·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/011.yaml
  text: For the bodies of those animals whose blood is brought into the holy places for sin by the high priest are burned outside the camp[a][b].
translation:
  language: zh_hans
  text: 因为那些牲畜的血由大祭司为罪带进圣所[a]，它们的身体在营外焚烧[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作复数“圣处”，是礼仪用语，指神圣的圣所范围。
    reason: lexical_alternative
  - marker: b
    text: 或译：“完全烧尽”。这个动词可以强调彻底焚烧。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν ... ζῴων / τούτων τὰ σώματα
  choice: 那些牲畜……它们的尸体
  rationale: 关系结构与后面的指示结构共同指向献祭用的牲畜；“牲畜”比泛称“动物”更贴合祭祀语境，“它们的尸体”自然保留前后照应。
- source_word: γὰρ
  choice: 因为
  rationale: 引出对上文的解释或根据；现代汉语以“因为”清楚表达这一逻辑联系。
- source_word: εἰσφέρεται
  choice: 带进
  rationale: 现在时被动形式描述血被带入圣所的礼仪行动；汉语借“由大祭司”标明施事后，用“带进”自然简洁。
- source_word: τὸ αἷμα
  choice: 血
  rationale: 直译祭牲之血，准确保留献祭语境。
- source_word: περὶ ἁμαρτίας
  choice: 为罪
  rationale: 保留该短语与罪有关的宽泛祭祀含义，不径自限定为“作赎罪祭”。
- source_word: εἰς τὰ ἅγια
  choice: 进圣所
  rationale: τὰ ἅγια为复数形式的礼仪用语，可指神圣的圣所范围；汉语“圣所”自然且不把范围过度限定为至圣所。
- source_word: διὰ τοῦ ἀρχιερέως
  choice: 由大祭司
  rationale: διά加属格在此表达施事者；“由大祭司”符合汉语被动语义并准确传达祭司的执行作用。
- source_word: κατακαίεται
  choice: 焚烧
  rationale: “焚烧”准确表达以火烧毁的礼仪行动，同时正文不强行凸显动词可能含有的彻底烧尽意味。
- source_word: ἔξω τῆς παρεμβολῆς
  choice: 在营外
  rationale: 准确对应以色列营地及会幕礼仪背景，也是现代汉语简洁自然的表达。
theological_decisions:
- issue: εἰς τὰ ἅγια所指的圣所范围
  choice: 译为“圣所”
  alternative: “圣地”；“至圣所”
  rationale: 《希伯来书》中τὰ ἅγια可较灵活地指神圣的圣所领域。本节虽使人联想到赎罪日礼仪，原文却未明确要求缩窄为“至圣所”，因此正文采用较宽而自然的“圣所”，脚注说明原文形式。
- issue: περὶ ἁμαρτίας的祭祀含义
  choice: 译为“为罪”
  alternative: “作为赎罪祭”；“为赎罪”
  rationale: “为罪”保留原短语的简洁和一定开放性，避免把它无提示地固定为某一种更具体的祭物名称或完整神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“牲畜、血、大祭司、圣所、营外”等词保留献祭礼仪色彩；以“却”清楚呈现血被带入圣所与尸体在营外焚烧之间的对照。所有脚注标记均置于正文相应位置。
