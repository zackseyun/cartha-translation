base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/008.yaml
  text: Jesus the Messiah is the same yesterday and today and forever[a].
translation:
  language: zh_hans
  text: 耶稣基督昨日、今日、直到永远都是一样的[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “基督”也可译作“弥赛亚”；这里的希腊语 Χριστός 是一个称号。
    reason: 说明称号Χριστός的另一种译法，并避免读者将“基督”误当作姓氏。
lexical_decisions:
- source_word: Ἰησοῦς
  choice: 耶稣
  rationale: 采用现代汉语中通行的人名译法。
- source_word: Χριστός
  choice: 基督
  rationale: 采用现代汉语中最通行、庄重且易于辨认的称号译法；此处与“耶稣”连用，但仍保留称号含义，而不把它当作姓氏。脚注提示“弥赛亚”这一可选译法。
- source_word: ἐχθὲς
  choice: 昨日
  rationale: 准确表达“昨天”，并与“今日”“直到永远”构成庄重、简洁的时间序列。
- source_word: σήμερον
  choice: 今日
  rationale: 准确表达“今天”；与“昨日”并列，在现代书面汉语中自然凝练。
- source_word: ὁ αὐτός
  choice: 都是一样的
  rationale: 希腊语意为“同一的、一样的”；汉语补出判断结构，并用“都”呼应跨越三个时间范围的不变一致。
- source_word: εἰς τοὺς αἰῶνας
  choice: 直到永远
  rationale: 以自然现代汉语表达持续到永恒的意思，避免生硬直译为“直到诸世代”。
- source_word: καὶ ... καὶ ... καὶ
  choice: 、……，直到……
  rationale: 汉语以顿号、逗号及“直到”自然呈现希腊语反复连接的时间序列，同时保留其递进节奏。
theological_decisions:
- issue: 本节关于耶稣跨越时间而不改变的基督论含义
  choice: 直译为耶稣基督昨日、今日、直到永远“都是一样的”，不另加“不变性”或“神性”等解释性术语。
  alternative: 将本节扩写为对基督永恒不变或神性的明确教义陈述。
  rationale: 原文直接强调耶稣基督在过去、现在和永远的一致不变；译文应保留这一有力陈述，同时不把可由经文推论的系统神学结论写进正文。
- issue: Χριστός作为称号还是固定姓名成分
  choice: 正文采用通行的“耶稣基督”，并以脚注说明“弥赛亚”译法。
  alternative: 正文译作“耶稣弥赛亚”或将“基督”视为无称号意义的固定姓名成分。
  rationale: “耶稣基督”在现代汉语中最自然且辨识度最高；脚注明确其称号性质及可译性，避免把“基督”误解为姓氏。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“昨日、今日、直到永远”保留原文简洁有力的时间推进；“都是一样的”符合汉语判断句习惯，同时不增加原文未明说的教义解释。
