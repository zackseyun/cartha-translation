  text: διὸ καὶ Ἰησοῦς, ἵνα ἁγιάσῃ διὰ τοῦ ἰδίου αἵματος τὸν λαόν, ἔξω τῆς πύλης ἔπαθεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/012.yaml
  text: Therefore Jesus also suffered outside the gate[b][a], so that he might sanctify the people through his own blood.
translation:
  language: zh_hans
  text: 所以，耶稣也在门外[b]受了苦，为要借着自己的血使百姓成为圣洁[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “成为圣洁”也可译作“分别为圣”或“成圣”。
    reason: lexical_alternative
  - marker: b
    text: “门外”很可能指耶稣在耶路撒冷城外受苦的地方，并呼应上文把祭牲的残余带到营外焚烧。
    reason: cross_reference
lexical_decisions:
- source_word: διὸ
  choice: 所以
  rationale: 表示由上文献祭牲畜在营外焚烧的论述所得出的结论，现代汉语中自然清楚。
- source_word: καὶ
  choice: 也
  rationale: 表明耶稣受苦与上文所述祭牲的模式相呼应。
- source_word: ἵνα ἁγιάσῃ
  choice: 为要……使……成为圣洁
  rationale: 保留ἵνα所表达的目的，并以现代汉语传达ἁγιάζω在本段献祭语境中的成圣、归圣含义。
- source_word: διὰ τοῦ ἰδίου αἵματος
  choice: 借着自己的血
  rationale: “借着”表达διά加属格的手段意义；“自己的”保留ἰδίου的强调及本书核心的献祭意象。
- source_word: τὸν λαόν
  choice: 百姓
  rationale: 保留原文定冠词所指的特定群体及其圣约色彩，但不在正文中增添“上帝的”。
- source_word: ἔξω τῆς πύλης
  choice: 在城门外
  rationale: πύλη在此处结合耶稣受难地点和上文“营外”的背景，指城的门；“城门外”是自然且不致误解为普通房门的现代汉语表达，同时保留单数概念。
- source_word: ἔπαθεν
  choice: 受了苦
  rationale: 直接表达πάσχω的简明含义；“了”自然体现不定过去时所叙述的既成事件。
theological_decisions:
- issue: 献祭语境中ἁγιάζω的译法
  choice: 使……成为圣洁
  alternative: 使……分别为圣；使……成圣
  rationale: “使……成为圣洁”既保留礼仪和圣约层面的归圣含义，也让普通现代读者易于理解；脚注列出可能的简洁译法，以免将其限定为某一宗派的成圣教义。
- issue: τὸν λαόν的范围
  choice: 百姓
  alternative: 上帝的百姓
  rationale: 上下文很可能指上帝的圣约子民，但希腊文只明说“百姓”；正文不补入“上帝的”，从而保留原文的表达范围。
- issue: “门外”所指
  choice: 城门外
  alternative: 门外
  rationale: 上下文和耶稣受难的叙事背景表明这是耶路撒冷城外，并呼应前文祭牲在营外处理；正文以自然汉语表达，脚注说明这种语境联系，而不把解释扩写进经文。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“百姓”保留圣约语感而不作解释性扩充；句序调整为自然汉语的“受苦—目的”结构，同时完整保留原文的因果、对应、手段和目的关系。
