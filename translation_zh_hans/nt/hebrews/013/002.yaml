  text: τῆς φιλοξενίας μὴ ἐπιλανθάνεσθε, διὰ ταύτης γὰρ ἔλαθόν τινες ξενίσαντες ἀγγέλους.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/002.yaml
  text: Do not neglect hospitality[a], for through it some have entertained angels without knowing it.
translation:
  language: zh_hans
  text: 不可忘记接待陌生人，因为曾有人借此在不知不觉中接待了天使[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使者”。希腊词既可指“天使”，也可指“使者”；这里很可能暗指有人接待天上来客的旧约叙事。
    reason: 保留 ἀγγέλους 的词汇替代义，同时说明正文选择“天使”的语境依据。
lexical_decisions:
- source_word: φιλοξενίας
  choice: 接待陌生人
  rationale: 该词本义涉及关爱、欢迎陌生人；译为“接待陌生人”既自然，也比单用“好客”更明确地保留其指向外来者的含义。
- source_word: μὴ ἐπιλανθάνεσθε
  choice: 不可忘记
  rationale: 该动词可指忘记或忽略。此处是劝勉，既要求铭记，也要求实际践行；“不可忘记”简洁保留了原文表达。
- source_word: διὰ ταύτης
  choice: 借此
  rationale: 阴性代词回指接待陌生人这件事；“借此”自然地表达 διά 的手段意义。
- source_word: ἔλαθόν τινες ξενίσαντες
  choice: 曾有人……在不知不觉中接待了
  rationale: λανθάνω 与分词连用，表示当事人在做这事时并不知情；此译法自然传达这一希腊语结构。τινες 译作“有人”，ξενίσαντες 译作“接待了”，与上文的款待主题相呼应。
- source_word: ἀγγέλους
  choice: 天使
  rationale: 该词既可指使者，也可指天使。这里很可能暗指《创世记》18—19章接待天上来客的叙事，因此正文采用“天使”，同时以脚注保留“使者”这一词义可能。
theological_decisions:
- issue: ἀγγέλους 指超自然的天使，还是一般的使者
  choice: 正文译作“天使”
  alternative: 使者
  rationale: 可能的旧约背景较支持超自然意义，但希腊词本身具有两种词义，因此不在脚注中抹去其词汇歧义。
translation_notes:
  register: 采用现代、庄重而通俗的普通话。“不可忘记”保持劝勉语气；“接待陌生人”明确呈现 φιλοξενία 所含的陌生人维度；“在不知不觉中”自然表达原文的无意识状态。
