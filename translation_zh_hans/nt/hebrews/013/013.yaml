  text: τοίνυν ἐξερχώμεθα πρὸς αὐτὸν ἔξω τῆς παρεμβολῆς, τὸν ὀνειδισμὸν αὐτοῦ φέροντες.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/013.yaml
  text: Therefore[a], let us go out to him outside the camp, bearing his reproach.
translation:
  language: zh_hans
  text: 因此，让我们到营外[a]、到他那里去，担当他所受的凌辱。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “营外”也可译作“营地外”。这句话承接上文的献祭图景（参利未记16章），也让人想到耶稣在城外受难并遭弃绝。
    reason: 说明“营外”的词义选择及旧约祭祀背景，同时不把正文中的“营”直接释义化。
lexical_decisions:
- source_word: τοίνυν
  choice: 所以
  rationale: 该推论性小品词承接13:11–12的论述并引出劝勉；“所以”在现代汉语中自然地保留其推论作用。
- source_word: ἐξερχώμεθα
  choice: 我们要……去
  rationale: 第一人称复数、现在时、中间语态、虚拟式在此作劝勉用；“我们要……去”清楚传达共同回应的劝勉语气，同时避免古雅表达。
- source_word: πρὸς αὐτὸν
  choice: 到他那里
  rationale: πρός加宾格表示朝向某人移动；“到他那里”比单说“到他”更符合现代汉语习惯，并保留原文代词。
- source_word: ἔξω τῆς παρεμβολῆς
  choice: 营外
  rationale: παρεμβολή在此指营地；“营外”简洁保留祭祀与旷野营地的意象，并与上文相连。
- source_word: τὸν ὀνειδισμὸν αὐτοῦ
  choice: 他所受的凌辱
  rationale: ὀνειδισμός可指辱骂、羞辱或由此而来的耻辱。“凌辱”兼顾敌意行为与社会羞耻；补出“所受的”自然表达属他的、即加在他身上的凌辱，而不把它误解为他施加的凌辱。
- source_word: φέροντες
  choice: 承受
  rationale: 现在时主动分词表示与“出去”同时持续发生的行动。“承受”自然表达甘愿担当并忍受凌辱；比字面的“携带”更符合汉语搭配，又未消除承担重负的意味。
theological_decisions:
- issue: “他”的所指
  choice: 保留“他”，由紧邻上文（13:12）指向耶稣
  alternative: 直接译作“耶稣”
  rationale: 原文使用代词，且上下文已清楚给出所指；保留代词既忠于形式，也不替原文增添明说的名字。
- issue: “营外”的意义
  choice: 保留祭祀和营地的具体意象
  alternative: 释义为“宗教体制之外”或“群体之外”
  rationale: 本句承接13:11–12，并唤起利未记中祭牲被带到营外的背景，同时含有被排斥的社会意义。直接改成抽象释义会压平经文互文性并过早限定其应用。
- issue: “承受他所受的凌辱”的关系
  choice: 表达信徒与他一同承担加在他身上的凌辱
  alternative: 译为“忍受为了他而来的凌辱”
  rationale: αὐτοῦ最直接修饰“凌辱”，可理解为属于他或加在他身上的凌辱。所选措辞保留认同其被弃绝处境的含义，而不额外规定凌辱的动机。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“所以”承接上文，“我们要”传达共同劝勉；保留“营外”和代词“他”，以维持原文的祭祀意象、上下文衔接及神学张力。脚注标记置于整句之后，所注内容涵盖“营外”的词义和背景。
