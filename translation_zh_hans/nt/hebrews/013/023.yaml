  text: Know that our brother Timothy has been released[a], with whom I will see you if he comes soon.
translation:
  language: zh_hans
  text: 你们要知道，我们的弟兄提摩太已经获释[a]。如果他很快来到，我就同他去见你们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“已经被释放”。这可能是指他从监禁中获释；这个动词也可表示“已经被遣走”或“已经被解职（遣散）”。
    reason: lexical_alternative
lexical_decisions:
- source_word: γινώσκετε
  choice: 你们要知道
  rationale: 将现在时主动命令式复数译为自然的书信告知语，同时保留命令语气。
- source_word: τὸν ἀδελφὸν ἡμῶν
  choice: 我们的弟兄
  rationale: 保留早期基督徒群体中的亲属称谓；此处具体指男性提摩太。
- source_word: Τιμόθεον
  choice: 提摩太
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: ἀπολελυμένον
  choice: 已经获释
  rationale: 该词是ἀπολύω的完成时被动分词，表达已经发生且结果仍然有效的行动；在本语境中最可能指从拘押或监禁中获释，但词义仍有其他可能，故以脚注说明。
- source_word: μεθ’ οὗ
  choice: 和他一起
  rationale: 在中文中以代词承接提摩太，比直译为“与之”更自然，并清楚表达同行关系。
- source_word: ἐὰν τάχιον ἔρχηται
  choice: 他若很快来到
  rationale: 保留条件语气；τάχιον虽为比较级形式，但此处自然表达为“很快”，指提摩太及时来到作者所在之处。
- source_word: ὄψομαι ὑμᾶς
  choice: 我就……去见你们
  rationale: 保留ὁράω“见”的直接意义；“去”由作者与提摩太一同前往受众所在地的语境自然引出，但不将其解释性地改译为“探望”。
