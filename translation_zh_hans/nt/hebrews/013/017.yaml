source:
  edition: SBLGNT
  text: Πείθεσθε τοῖς ἡγουμένοις ὑμῶν καὶ ὑπείκετε, αὐτοὶ γὰρ ἀγρυπνοῦσιν ὑπὲρ τῶν ψυχῶν ὑμῶν ὡς λόγον ἀποδώσοντες, ἵνα μετὰ χαρᾶς τοῦτο ποιῶσιν καὶ μὴ στενάζοντες, ἀλυσιτελὲς γὰρ ὑμῖν τοῦτο.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/017.yaml
  text: Be persuaded by your leaders and yield to them[a], for they are keeping watch over your souls as those who will give an account, so that they may do this with joy and not with groaning, for this would be unprofitable for you.
translation:
  language: zh_hans
  text: 要接受你们带领者的劝导，也要顺从他们[a]，因为他们为你们的灵魂警醒守望，作为将要交账的人。这样，他们就能欢欢喜喜地做这事，而不至于叹息；因为那样对你们没有益处。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“要服从你们的带领者。”希腊词Πείθεσθε可表示“服从”，但较直接的意思是“被说服、信服”，即接受劝导而听从。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πείθεσθε
  choice: 要接受……的劝导
  rationale: 该中间／被动形式可表示“被说服、信服”，并可引申为“听从、服从”。“接受……的劝导”保留了回应劝服的关系性意味，又符合命令语气；常见的“服从”译法列入脚注。
- source_word: τοῖς ἡγουμένοις ὑμῶν
  choice: 你们的带领者
  rationale: 这里指群体中公认的领导者。“带领者”自然清楚，也避免加入原词未必具有的强势统治意味。
- source_word: ὑπείκετε
  choice: 顺从他们
  rationale: 原词有退让、顺从、听凭带领之意。“顺从”在现代中文中自然，并与前一句的“接受劝导”保持区别。
- source_word: ἀγρυπνοῦσιν
  choice: 时刻守望
  rationale: 原词带有不眠警醒的意象；“时刻守望”既保留持续警觉的意味，也适合这里对群体照管的语境。
- source_word: ὑπὲρ τῶν ψυχῶν ὑμῶν
  choice: 守望你们的灵魂
  rationale: ψυχή可指灵魂、生命或人本身。此处保留“灵魂”，传达属灵与道德责任的分量，同时不必把它理解为与整个人割裂的部分。
- source_word: ὡς λόγον ἀποδώσοντες
  choice: 如同将来要交账的人
  rationale: 保留ὡς的比较／身份表达及将来分词的前瞻意味，不在正文中明加原文未明说的交账对象。
- source_word: μετὰ χαρᾶς
  choice: 欢欢喜喜地
  rationale: 用自然现代汉语表达“带着喜乐”，并与后面的“叹息”形成鲜明对照。
- source_word: στενάζοντες
  choice: 叹息
  rationale: στενάζω可指呻吟或叹息；此处“叹息”较符合因牧养负担而发出的愁叹，同时保留具体形象。
- source_word: ἀλυσιτελὲς
  choice: 没有益处
  rationale: 准确表达“不利、无益”的含义；避免译成“有害”而把语气加强。
theological_decisions:
- issue: 信徒对群体带领者应有的态度
  choice: 译为接受劝导并顺从，表达信任、回应和让步，同时避免把命令绝对化。
  alternative: 译为无条件地服从带领者。
  rationale: Πείθεσθε与ὑπείκετε并列，要求信服和顺从；其根据是带领者为众人的灵魂守望并且将要交账。因此，这不是对不受约束之权威的认可，而是置于严肃责任之下的带领关系。
- issue: 带领者向谁交账
  choice: 正文只说“将来要交账”，不明加对象。
  alternative: 明确译作“向上帝交账”。
  rationale: 上下文在神学上自然暗示向上帝负责，但希腊原文没有明说交账对象；正文保留这种省略，避免把解释写进经文。
- issue: 末句“那样”的所指
  choice: 保留概括性的“那样”，主要承接带领者叹息着履行职责的情形。
  alternative: 明确译作“他们的叹息”或“你们的不顺服”。
  rationale: 希腊文τοῦτο的指向可概括前述不理想的整个局面；保留代词可避免将其过度限定为单一因素。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“接受……的劝导”与“顺从”分别呈现两个希腊命令词，避免合并其意义；“时刻守望你们的灵魂”和“将来要交账”保留原文的牧养意象与问责张力。脚注标记[a]已置于相关正文之后。
