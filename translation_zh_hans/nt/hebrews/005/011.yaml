  text: Περὶ οὗ πολὺς ἡμῖν ὁ λόγος καὶ δυσερμήνευτος λέγειν, ἐπεὶ νωθροὶ γεγόνατε ταῖς ἀκοαῖς·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/011.yaml
  text: About this we have much to say[a], and it is hard to explain[c][b], since you have become dull in hearing.
translation:
  language: zh_hans
  text: 关于这事，我们有许多话要说[a]，也难以讲明[b]，因为你们在领受教导上已经变得迟钝了[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“关于他，我们有许多话要说。”原文关系代词也可能指麦基洗德本人，不过也可较广地指正在谈论的主题。
    reason: alternative_reading
  - marker: b
    text: 或译：“难以解释”或“难以阐明”。
    reason: lexical_alternative
  - marker: c
    text: 原文直译可作“在听上迟钝”；“迟钝”也可译作“迟缓”。这里指听取、领受教导时反应迟缓。
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ οὗ
  choice: 关于这事
  rationale: 中性关系代词在语境中可指前述话题，也可能指麦基洗德本人；正文用“这事”自然承接有关麦基洗德与基督祭司职分的论述，并以脚注保留人称所指的可能。
- source_word: πολὺς ἡμῖν ὁ λόγος
  choice: 我们有许多话要说
  rationale: 按现代汉语习惯重组原文“对我们而言话很多”，清楚表达作者尚有大量内容要讲。
- source_word: δυσερμήνευτος λέγειν
  choice: 很难讲解
  rationale: δυσερμήνευτος可指难以解释、阐明或解说；与λέγειν连用时，重点在于将该题目讲明，因此译作“难讲解”简洁自然。
- source_word: ἐπεὶ
  choice: 因为
  rationale: 明确表达后句为难以讲解的原因。
- source_word: νωθροὶ
  choice: 迟钝
  rationale: 表达懒滞、反应不灵敏之意；在领受教导的语境中，“迟钝”比单纯的“懒惰”更准确。
- source_word: γεγόνατε
  choice: 已经变得
  rationale: 保留完成时所表达的变化过程及其现存结果，表明听众后来进入了这种状态。
- source_word: ταῖς ἀκοαῖς
  choice: 在听受方面
  rationale: ἀκοή在这里不是单指听觉器官，而是对教导的聆听与领受；“听受”保留听的意象，同时使含义清楚。
theological_decisions:
- issue: Περὶ οὗ的所指
  choice: 正文主要译为指向前述论题的“关于这事”
  alternative: “关于他”，即直接指麦基洗德
  rationale: 紧邻的上文提到麦基洗德，因此人称解释在语法上成立；但本句也自然引出更广的祭司职分论题。正文采用话题性表达，脚注保留人称解释，避免消除原文的歧义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“听受”用来兼顾听见与领受教导，避免把ταῖς ἀκοαῖς误解为生理听力；句式保留原文先陈述讲论困难、再说明听众责任的推进。
