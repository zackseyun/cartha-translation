id: HEB.5.8
reference: Hebrews 5:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καίπερ ὢν υἱός, ἔμαθεν ἀφ’ ὧν ἔπαθεν τὴν ὑπακοήν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/008.yaml
  text: Although he was a Son[a], he learned obedience from what he suffered[b],
translation:
  language: zh_hans
  text: 他虽然是儿子[a]，还是从所受的苦难中学会了顺服[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他虽然是那位儿子。”希腊原文“儿子”没有冠词；这里可侧重其儿子身份，也可按上下文理解为特指上帝的儿子。
    reason: alternative_reading
  - marker: b
    text: “学会了顺服”是指他在亲身承受苦难的过程中经历并实践顺服，并不是说他先前曾经不顺服。
    reason: lexical_alternative
lexical_decisions:
- source_word: καίπερ
  choice: 虽然
  rationale: 表示让步关系，突出他身为儿子与仍须经历苦难、学习顺服之间的张力。
- source_word: ὢν υἱός
  choice: 是儿子
  rationale: ὢν与无冠词的υἱός构成身份表述；汉语无须添加不定冠词，也不以英文字母大小写标示基督论含义。
- source_word: ἔμαθεν
  choice: 学会了
  rationale: 直接保留μανθάνω的学习含义，表达在实际经历中获得的认识，不将原文的神学张力释义掉。
- source_word: ἀφ’ ὧν ἔπαθεν
  choice: 从所受的苦难中
  rationale: ἀπό表示来源或途径，ἔπαθεν指实际承受痛苦；此译自然地表达借着亲历苦难而学习。
- source_word: τὴν ὑπακοήν
  choice: 顺服
  rationale: 指回应并服从上帝旨意；汉语抽象名词在此不需另译希腊语冠词。
theological_decisions:
- issue: 如何表达基督的儿子身份与学习顺服的关系
  choice: 他虽然是儿子
  alternative: 他虽是那位儿子
  rationale: 原文υἱός无冠词，汉语“儿子”既能保持形式上的不特指，也可由上下文明确指向基督；不擅自加入“那位”来强化确定性。
- issue: “学会了顺服”是否暗示先前不顺服
  choice: 保留“学会了顺服”的直接说法
  alternative: 亲身体验了顺服／懂得了顺服的代价
  rationale: 原文明确说“学习顺服”，译文不以解释性改写消除张力；脚注说明这里着眼于在苦难中的亲身学习，并非纠正先前的不顺服。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“还是”明确承接“虽然”的让步关系；“所受的苦难”比直译“所受的事”更自然，并准确呈现πάσχω的受苦含义。
