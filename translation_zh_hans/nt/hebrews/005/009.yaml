  text: καὶ τελειωθεὶς ἐγένετο ⸂πᾶσιν τοῖς ὑπακούουσιν αὐτῷ⸃ αἴτιος σωτηρίας αἰωνίου,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/009.yaml
  text: and[a], having been made perfect, he became the source of eternal salvation to all who obey him[b],
translation:
  language: zh_hans
  text: 并且他既得以成全，就为所有顺从他的人，成了永恒救恩的根源[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 或译“成因”或“创始者”。原词指促成某事、使其成为现实者。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: 并且
  rationale: 承接上文，保留希腊文简单的连接关系，不额外限定为因果或时间关系。
- source_word: τελειωθεὶς
  choice: 既得以成全
  rationale: 这是 τελειόω 的不定过去时被动分词；在《希伯来书》的语境中，主要指达到预定目标、完成祭司与救赎使命，而非从道德缺陷变为无瑕。“得以成全”既保留传统神学用语，也避免直译为现代汉语中易被误解的“变得完美”。
- source_word: ἐγένετο
  choice: 成了
  rationale: 表达进入一种结果性的身份或作用，现代汉语自然简洁。
- source_word: πᾶσιν τοῖς ὑπακούουσιν αὐτῷ
  choice: 为所有顺从他的人
  rationale: 保留 πᾶσιν 的普遍范围和 ὑπακούω 的顺服、听从含义；不将其弱化为单纯“听见”，也不替换成其他教义术语。
- source_word: αἴτιος
  choice: 根源
  rationale: 此词指促成某事、对其负有决定性因果作用者。“根源”在现代汉语中比“原因”更适合用于救恩，也比“创始者”少一层原文未必明确的个人称号色彩。
- source_word: σωτηρίας αἰωνίου
  choice: 永远救恩
  rationale: σωτηρία 在本语境中译作“救恩”，保留明确的救赎论语域；αἰώνιος 译作“永远”，自然表达其恒久性质。
theological_decisions:
- issue: τελειωθεὶς 用于基督时的含义
  choice: 译作“得以成全”，理解为其祭司职分与救赎使命达到完成
  alternative: 译作“被变得完美”或“得以完全”
  rationale: 原词具有达到目标、臻于完成的意义。译文不暗示耶稣先有道德缺陷，也不抹去经文本身关于他借受苦达到使命完成的张力。
- issue: “所有顺从他的人”所表达的范围与条件
  choice: 明确保留“顺从”
  alternative: 改译为“所有相信他的人”或仅作“所有听他的人”
  rationale: ὑπακούω 明确包含听从、服从之意；译文不把它缩减或扩展为某一宗派性的信仰与行为体系。
- issue: αἴτιος 的救恩论表达
  choice: 译作“根源”
  alternative: “创始者”或“原因”
  rationale: 保留基督是永远救恩之决定性成因的陈述，同时避免把原词过度具体化为文学性的“作者”或抽象生硬的“原因”。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“既……就……”自然呈现分词与主句之间的先后及结果关系，但不强化为严格的因果公式；“得以成全”和“永远救恩的根源”兼顾《希伯来书》的祭司语境、传统可辨识度与普通读者的可理解性。
