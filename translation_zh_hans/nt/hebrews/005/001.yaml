source:
  edition: SBLGNT
  text: Πᾶς γὰρ ἀρχιερεὺς ἐξ ἀνθρώπων λαμβανόμενος ὑπὲρ ἀνθρώπων καθίσταται τὰ πρὸς τὸν θεόν, ἵνα προσφέρῃ δῶρά τε καὶ θυσίας ὑπὲρ ἁμαρτιῶν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/001.yaml
  text: For every high priest[a], being taken from among men, is appointed on behalf of men in the things pertaining to God, so that he may offer both gifts and sacrifices for sins,
translation:
  language: zh_hans
  text: 因为每一位大祭司都是从人中选出的，受委任为人办理与上帝有关的事，为要献上礼物和祭物，为罪。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πᾶς γὰρ ἀρχιερεὺς
  choice: 因为每一位大祭司
  rationale: Πᾶς与单数名词连用，逐一概括大祭司这一职分；γάρ承接并解释上文，译作“因为”。“大祭司”是ἀρχιερεύς的标准称谓。
- source_word: ἐξ ἀνθρώπων λαμβανόμενος
  choice: 都是从人中选出来的
  rationale: 保留被动含义，并以自然汉语表达大祭司取自人类之中；“人”在现代汉语中可泛指人类，同时符合此处历史职分的语境。
- source_word: ὑπὲρ ἀνθρώπων καθίσταται
  choice: 受委任代表人
  rationale: καθίσταται指被设立或委任担任职分；ὑπέρ表示为人、代表人，译为“代表人”突显中保性的职分关系。
- source_word: τὰ πρὸς τὸν θεόν
  choice: 办理与上帝有关的事
  rationale: 该习语指人在上帝面前的敬拜、事奉等事务；“办理与上帝有关的事”既贴近原文又符合现代汉语。
- source_word: ἵνα προσφέρῃ δῶρά τε καὶ θυσίας
  choice: 为要献上礼物和祭物
  rationale: “为要”保留ἵνα的目的意味；“礼物和祭物”分别对应δῶρα和θυσίαι，保留两类献物的区分。
- source_word: ὑπὲρ ἁμαρτιῶν
  choice: 赎人的罪
  rationale: 在献祭语境中，ὑπέρ ἁμαρτιῶν表示为罪而献；正文用自然汉语说明其赎罪指向，并以脚注保留较形式对应的译法。
theological_decisions:
- issue: ἀνθρώπων的代表性用语
  choice: 两处均译为“人”
  alternative: “男人”或“人类／众人”
  rationale: 希腊词在此可泛指人，同时历史上的大祭司职分由男性担任。现代汉语“人”自然涵盖人类，不必强行译成“男人”，也不掩盖大祭司来自人类并代表人的论点。
- issue: ὑπὲρ ἁμαρτιῶν的含义
  choice: 正文译为“赎人的罪”
  alternative: “为罪”或“为着罪”
  rationale: 上下文明确涉及祭司献祭，“赎人的罪”自然传达祭物针对罪的功用；脚注保留原文较简略的表达，避免把介词短语的具体关系规定得过死。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“受委任”“办理”“献上”等词保持祭司职分语域；句法顺应汉语表达，同时保留原文的解释关系、被动受任、代表作用和目的结构。
