  rationale: 将最后的介词短语直译为“为罪”，避免加入“人”或将其效果限定为“赎罪”。同时调整“受委任代表人办理”为“受委任为人办理”，使“为人”的代表／受益关系在汉语中清晰自然。删除原脚注，因为正文现已保留原文的简略措辞，不再需要以脚注纠正正文的扩充。
