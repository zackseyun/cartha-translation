  text: πᾶς γὰρ ὁ μετέχων γάλακτος ἄπειρος λόγου δικαιοσύνης, νήπιος γάρ ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/013.yaml
  text: For everyone who partakes of milk is unskilled in the word of righteousness[b][a], for he is an infant.
translation:
  language: zh_hans
  text: 因为凡以奶为食的，都不熟悉公义之道[a]，因为他是婴孩。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “公义之道”也可译作“关于公义的信息”或“公义的话语”；“公义”也可译作“正义”。
    reason: 保留 λόγου δικαιοσύνης 的属格歧义以及 δικαιοσύνη 的相关词义范围。
lexical_decisions:
- source_word: πᾶς ... ὁ μετέχων
  choice: 凡以……为食的，都
  rationale: 保留希腊文逐一涵盖某类人的概括语气；“以……为食”自然延续吃奶的比喻，又不必把它强化为“只靠……为生”。
- source_word: γάλακτος
  choice: 奶
  rationale: 直译其喂养与成长的比喻；现代汉语中“吃奶”比“吃乳”自然。
- source_word: ἄπειρος
  choice: 不熟悉
  rationale: 表示缺乏经验、尚未通晓，并不武断地说成完全无知；与“道”搭配也较自然。
- source_word: λόγου δικαιοσύνης
  choice: 公义之道
  rationale: 以紧凑、庄重的汉语保留“话语/道”与“公义”的属格关系，不在正文中限定为“关于公义的信息”或“产生公义的教导”。
- source_word: νήπιος
  choice: 婴孩
  rationale: 准确保留尚不能吃固体食物的幼小形象，并突出属灵上的不成熟。
- source_word: γάρ ... γάρ
  choice: 因为
  rationale: 首个 γάρ 承接上一节，在单节独立呈现时由“凡”所引出的说明已自然体现；第二个 γάρ 明译为“因为”，表明不熟悉公义之道的原因。
theological_decisions:
- issue: λόγου δικαιοσύνης 中属格关系的理解
  choice: 公义之道
  alternative: 关于公义的信息／公义的话语／正义之道
  rationale: 希腊文可指与公义有关的信息，也可能有更宽的关联。“公义之道”保留其凝练和一定歧义，不把它限定为某一种神学解释。
- issue: δικαιοσύνη 的译法
  choice: 公义
  alternative: 正义
  rationale: “公义”在此较适合教导与属灵成熟的语境；“正义”属于该词可能的语义范围，故列于脚注。
- issue: νήπιος 的通性指称
  choice: 他还是婴孩
  alternative: 这样的人还是婴孩
  rationale: 原文采用阳性单数的泛指结构；中文“他”可照应前面的单数类指，同时不表示对象仅限男性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留吃奶与婴孩的成长比喻；“公义之道”略具经文语体，但在现代汉语中仍清楚自然。
