source:
  edition: SBLGNT
  text: καὶ ⸂δι’ αὐτὴν⸃ ὀφείλει, καθὼς περὶ τοῦ λαοῦ, οὕτως καὶ περὶ ⸀αὑτοῦ προσφέρειν ⸀περὶ ἁμαρτιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/003.yaml
  text: And because of this he is obligated[a], just as for the people, so also for himself, to offer for sins.
translation:
  language: zh_hans
  text: 也正因如此[a]，他必须为罪献祭，正如为百姓献祭一样，也为自己献祭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “如此”原文直译为“因它”；最自然是指上一节所说大祭司的软弱。
    reason: 说明代词的字面形式及其最自然的先行词，同时保留其语境指代的余地。
lexical_decisions:
- source_word: δι’ αὐτὴν
  choice: 正因如此
  rationale: 保留διά加宾格的因果意义；“如此”自然承接上文，同时不在正文中明说其所指。
- source_word: ὀφείλει
  choice: 必须
  rationale: 表达祭司所负的义务，而不是较弱的劝勉语气。
- source_word: καθὼς ... οὕτως καὶ
  choice: 怎样……也照样……
  rationale: 保留原文前后对应的比较结构，并符合现代汉语表达。
- source_word: τοῦ λαοῦ
  choice: 百姓
  rationale: 在利未祭司制度的语境中指立约的百姓；不在正文中扩展为“以色列百姓”。
- source_word: περὶ αὑτοῦ
  choice: 为自己
  rationale: 简洁表达反身和代求对象的意义。
- source_word: προσφέρειν περὶ ἁμαρτιῶν
  choice: 为罪献祭
  rationale: “献祭”自然表达祭司语境中的προσφέρειν；“为罪”保留περὶ ἁμαρτιῶν的宽泛关系，不限定为某一种特定祭类。
theological_decisions:
- issue: “如此”所指为何
  choice: 正文保持指代，脚注说明最自然地承接上一节大祭司的软弱
  alternative: 理解为泛指大祭司的职分或整体处境
  rationale: 阴性代词αὐτήν最邻近的对应词是上一节的ἀσθένεια（软弱）；但正文不直接代入名词，以保留原文的指代形式。
- issue: προσφέρειν是否补出祭物
  choice: 译为“献祭”，不补出具体祭物
  alternative: 译为“献上祭物”或仅译“献上”
  rationale: 原文未明说宾语，但祭司献祭的语境明确；汉语“献祭”既自然，又避免指定祭物种类。
- issue: περὶ ἁμαρτιῶν的范围
  choice: 译为“为罪”
  alternative: 译为“献赎罪祭”
  rationale: 原文表达与罪有关的祭献，却未在本句使用某一特定祭名；“为罪”避免过度限定。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“为罪献祭”保留祭司礼仪语境；冒号使“为百姓／为自己”的平行关系清楚，同时不改变原文论证。
