  yaml_path: translation/nt/hebrews/005/010.yaml
  text: having been designated by God as a high priest according to the order of Melchizedek[a][b].
translation:
  language: zh_hans
  text: 被上帝照着麦基洗德的等次称为大祭司。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“被上帝宣告为大祭司”，或“被上帝任命为大祭司”。
    reason: lexical_alternative
  - marker: b
    text: 本句呼应《诗篇》110:4。这里的“等次”可指与麦基洗德相应的祭司职分类别或模式。
    reason: cross_reference
lexical_decisions:
- source_word: προσαγορευθεὶς
  choice: 被……称为
  rationale: 这是 προσαγορεύω 的不定过去时被动分词；在此表示上帝正式称呼、认定或宣告耶稣的身份。“被称为”保留被动语态及原词在“称名”与“指定”之间的语义空间，不把它过度收窄为制度性的任命。
- source_word: ὑπὸ τοῦ θεοῦ
  choice: 被上帝
  rationale: ὑπό 加属格标明被动结构中的施事者。原文只说“上帝”，不增添“父”。
- source_word: ἀρχιερεὺς
  choice: 作大祭司
  rationale: ἀρχιερεύς 的标准译法是“大祭司”。“称为……作大祭司”在现代汉语中自然地表达身份宣告，也不因希腊文无冠词而误解为众多同类中的任意一位。
- source_word: κατὰ τὴν τάξιν
  choice: 照着……的等次
  rationale: κατά 表示依照或符合；τάξις 在本书与诗篇110:4的引文语境中指祭司职分的类别、体系或样式。沿用“等次”可保留经文互文及本书论证中的专门含义。
- source_word: Μελχισέδεκ
  choice: 麦基洗德
  rationale: 采用现代简体中文圣经语境中通行的专名音译。
theological_decisions:
- issue: 分词是否应译成带有制度性任职意味的“任命”，还是正式称名、认定或宣告
  choice: 被上帝称为……作大祭司
  alternative: 被上帝任命为大祭司；被上帝宣告为大祭司
  rationale: “称为”最直接保留 προσαγορεύω 的称名意味，同时容纳正式指定的语气；它不预断此处是在描述身份的产生、职分的授予，还是公开的宣告，因而保留原文的神学张力。
- issue: τάξις 所指是排列、品级，还是祭司职分的类别与模式
  choice: 等次
  alternative: 体系；样式；类别
  rationale: “等次”承接诗篇110:4在希伯来书中的固定互文，并可表达与麦基洗德相应的祭司职分类型；脚注说明其含义，以免现代读者只按日常的等级次序理解。
translation_notes:
  register: 采用庄重而可读的现代标准汉语。“照着……的等次”略带经文术语色彩，但有助于维持与诗篇110:4及希伯来书后文的互文联系；通过脚注为普通读者解释。
