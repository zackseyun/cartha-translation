  text: καὶ οὐχ ἑαυτῷ τις λαμβάνει τὴν τιμήν, ἀλλὰ καλούμενος ὑπὸ τοῦ θεοῦ, ⸀καθώσπερ καὶ Ἀαρών.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/004.yaml
  text: And no one takes this honor for himself[a], but is called by God, just as Aaron also was.
translation:
  language: zh_hans
  text: 没有人自行取得这尊荣[a]；他乃是蒙上帝呼召，正如亚伦一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“这尊荣”，在上下文中指大祭司职分所具有的尊荣或尊贵身份。
    reason: 说明“尊荣”的语境所指，同时避免在正文中直接释译为“职分”。
lexical_decisions:
- source_word: οὐχ ... τις
  choice: 没有人
  rationale: 否定词与不定代词连用，在现代汉语中自然表达为全称否定“没有人”。
- source_word: ἑαυτῷ ... λαμβάνει
  choice: 把……据为己有
  rationale: 反身与“取得”结合，强调不是由人自行攫取或承受；“据为己有”比单说“接受”更清楚地保留与上帝呼召的对比。
- source_word: τὴν τιμήν
  choice: 这尊荣
  rationale: τιμή直译为“尊荣”；“这”承接上文所说的大祭司职分所带有的尊荣，而不把该词直接改译成“职分”。
- source_word: ἀλλὰ καλούμενος ὑπὸ τοῦ θεοῦ
  choice: 他必须蒙上帝呼召
  rationale: 被动分词说明取得这尊荣所依据的条件或方式。汉语补出“他必须”可形成完整、自然的对照，并保留上帝是呼召者。
- source_word: καθώσπερ καὶ Ἀαρών
  choice: 正如亚伦一样
  rationale: 简洁保留比较和καί所含“也”的意义；上下文自然补足亚伦同样蒙上帝呼召。
theological_decisions:
- issue: 祭司尊荣的取得方式
  choice: 这尊荣不能由人自行取得，而在于蒙上帝呼召；亚伦是先例。
  alternative: 把本句理解为对一般荣誉的普遍论述。
  rationale: 希伯来书5:1–5的直接语境是大祭司，因此“尊荣”在此指向祭司身份或职分的尊荣；正文仍保留较宽的名词“尊荣”，不把它窄化为“职位”。
- issue: 分词 καλούμενος 的句法力度
  choice: 译作“必须蒙上帝呼召”，表达它在对比结构中所说明的必要条件。
  alternative: 较形式地译作“而是蒙上帝呼召的”，保留分词结构，却在汉语中略显残缺。
  rationale: 原文省略了与前句相应的有限动词，语义是人并非自取，而是作为蒙上帝呼召者取得；“必须”是汉语句法上的明示，不表示额外的呼召机制。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“据为己有”突出不可自取，“蒙上帝呼召”沿用自然的宗教语域。脚注标记已在正文中对应出现。
