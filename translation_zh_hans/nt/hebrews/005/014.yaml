  text: τελείων δέ ἐστιν ἡ στερεὰ τροφή, τῶν διὰ τὴν ἕξιν τὰ αἰσθητήρια γεγυμνασμένα ἐχόντων πρὸς διάκρισιν καλοῦ τε καὶ κακοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/014.yaml
  text: But solid food is for the mature[b][a], who because of practice have their powers of discernment trained to distinguish both good and evil.
translation:
  language: zh_hans
  text: 但固体食物是给成熟之人的；他们的辨别力[b]因着操练[a]已经受到训练，能分辨善恶。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “因着操练”也可译作“由于习惯”或“因经常运用”。
    reason: lexical_alternative
  - marker: b
    text: “辨别力”原文直译为“感官”，这里比喻人的感知和判断能力。
    reason: lexical_alternative
lexical_decisions:
- source_word: τελείων
  choice: 成熟之人
  rationale: 与上文的“婴孩”形成对比，指在属灵理解和判断上长成的人；避免译成“完全人”而让人误以为毫无道德过失。
- source_word: στερεὰ τροφή
  choice: 固体食物
  rationale: 自然保留与“奶”相对的饮食比喻，指较深的教导。
- source_word: διὰ τὴν ἕξιν
  choice: 因着操练
  rationale: ἕξις可指习惯、惯常运用或实践所形成的状态；“操练”能自然表达反复运用产生的效果，同时不排除“习惯”的词义。
- source_word: τὰ αἰσθητήρια
  choice: 辨别力
  rationale: 原指感官或感知官能，此处作比喻，指内在的感知和判断能力；结合后面的“分辨”，译为“辨别力”清楚而自然。
- source_word: γεγυμνασμένα ἐχόντων
  choice: 已经锻炼纯熟
  rationale: 完成时被动分词与“有”连用，强调他们所具有的官能经过锻炼后处于成熟可用的状态。
- source_word: πρὸς διάκρισιν
  choice: 能分辨
  rationale: πρός在此表达目的或结果；采用“能分辨”使中文流畅，并直接连接“善恶”。
- source_word: καλοῦ τε καὶ κακοῦ
  choice: 善恶
  rationale: 简洁保留圣经中熟悉的道德判断用语；中文无需另加“二者”也能表达τε καὶ的并列涵义。
- source_word: δέ
  choice: 但
  rationale: 明确承接上文乳与婴孩的论述，表达对比。
theological_decisions:
- issue: 属灵成长语境中τελείων的含义
  choice: 成熟之人
  alternative: 完全人；成年人；长大成人的人
  rationale: 上下文所强调的是相对于婴孩的成熟与受过训练的辨别能力，并非断言这些人在道德上毫无瑕疵；“成熟之人”保留成长语境，也不引入完全主义解释。
- issue: 善恶的分辨是能力、目的还是结果
  choice: “能分辨”保留训练所带来的实际能力，并容纳目的与结果的关联
  alternative: 为要分辨；用于辨别
  rationale: πρός可表达目的或趋向结果；中文“能分辨”符合上下文，但不把这种分辨说成与操练无关的先天能力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“固体食物—成熟之人”保留上下文比喻；句子依照中文习惯分为两个分句。脚注标记均置于正文末尾，并与相应词义说明对应。
