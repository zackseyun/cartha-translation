  text: μετριοπαθεῖν δυνάμενος τοῖς ἀγνοοῦσι καὶ πλανωμένοις ἐπεὶ καὶ αὐτὸς περίκειται ἀσθένειαν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/002.yaml
  text: being able to deal gently with those who are ignorant and going astray[a], since he himself also is beset with weakness[b],
translation:
  language: zh_hans
  text: 他能温和地对待那些无知而迷失正路的人[a]，因为他自己也被软弱所包围[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“被带入歧途的人”。希腊语分词可带被动意味。
    reason: lexical_alternative
  - marker: b
    text: 直译：“被软弱围绕”，也可理解为“披戴着软弱”。
    reason: lexical_alternative
lexical_decisions:
- source_word: μετριοπαθεῖν
  choice: 温和地对待
  rationale: 该动词表示有分寸、克制而不严厉的态度；“温和地对待”兼顾态度与实际行动，符合现代汉语表达。
- source_word: δυνάμενος
  choice: 能
  rationale: 表达大祭司具备这种持续的能力，并使中文句式自然简洁。
- source_word: τοῖς ἀγνοοῦσι
  choice: 那些无知……的人
  rationale: 保留分词对一类处境中之人的描述，而不把“无知”固化为身份标签；在祭司语境中可涉及因不明白而犯错，但正文不将其限定为技术性祭祀类别。
- source_word: πλανωμένοις
  choice: 走迷了路
  rationale: 既自然表达偏离正途，也保留道德和属灵层面的开放性；希腊语被动形式可能含“被引入歧途”的意味，另列脚注。
- source_word: ἐπεὶ
  choice: 因为
  rationale: 清楚引出大祭司能够温和待人的原因。
- source_word: καὶ αὐτὸς
  choice: 他自己也
  rationale: 同时保留对大祭司本人的强调及“也”的附加关系。
- source_word: περίκειται ἀσθένειαν
  choice: 被软弱所包围
  rationale: 较直接地保存περίκειται“围绕、环绕”的形象，同时“软弱”不限定为身体或道德某一方面。
theological_decisions:
- issue: ἀγνοοῦσι καὶ πλανωμένοις所描述之人的过失性质
  choice: 译作“那些无知和走迷了路的人”，保留一般性的无知与偏离含义。
  alternative: 将其技术性地限定为利未祭祀制度下误犯之罪的人。
  rationale: 祭司语境确实会使人联想到旧约的误犯之罪，但希腊措辞本身更宽泛，因此不在正文中加入狭义限定。
- issue: ἀσθένεια用于大祭司时的范围
  choice: 译作“软弱”，涵盖人的脆弱与有限。
  alternative: 专指身体软弱，或专指道德软弱。
  rationale: 原词在此没有把范围限定为身体或道德方面；采用宽泛译词可保留经文的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“走迷了路”比“误入歧途”略为口语，但仍适合经文语体，并保留原文“偏离、迷失”的形象；“被软弱所包围”有意保存希腊语的环绕意象。
