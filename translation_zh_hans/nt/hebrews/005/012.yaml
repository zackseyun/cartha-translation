source:
  edition: SBLGNT
  text: καὶ γὰρ ὀφείλοντες εἶναι διδάσκαλοι διὰ τὸν χρόνον, πάλιν χρείαν ἔχετε τοῦ διδάσκειν ὑμᾶς ⸀τινὰ τὰ στοιχεῖα τῆς ἀρχῆς τῶν λογίων τοῦ θεοῦ, καὶ γεγόνατε χρείαν ἔχοντες γάλακτος, ⸀οὐ στερεᾶς τροφῆς.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/012.yaml
  text: For although by this time you ought to be teachers[a], you again need someone to teach you the basic elements of the beginning of the oracles of God, and you have come to need milk[b], not solid food.
translation:
  language: zh_hans
  text: 其实，从所经过的时间来看，你们本来应该作教师了；可是，你们又需要有人教导你们上帝圣言最初的基本要素[a]。你们竟成了需要奶、而不是固体食物的人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“上帝圣言开端的初步原则”。
    reason: lexical_alternative
  - marker: b
    text: “奶”和“固体食物”是比喻，分别指适合不成熟者与成熟者的教导；本节并未具体列出两者的内容。
    reason: metaphor_note
lexical_decisions:
- source_word: ὀφείλοντες εἶναι διδάσκαλοι
  choice: 本来应该作教师
  rationale: 表达按时间与成长程度而言应当达到的状态，既保留责任意味，也避免过强的法律语气。
- source_word: διὰ τὸν χρόνον
  choice: 从所经过的时间来看
  rationale: 指已经过去的时间所形成的成熟期待；译文不额外补入原文没有明说的“学习”或“信主”。
- source_word: πάλιν χρείαν ἔχετε τοῦ διδάσκειν ὑμᾶς
  choice: 又需要有人教导你们
  rationale: 自然表达希腊语“有被教导的需要”，并保留πάλιν所含的重复或退步意味。
- source_word: τὰ στοιχεῖα τῆς ἀρχῆς
  choice: 最初的基本要素
  rationale: 保留στοιχεῖα的基础成分之意及τῆς ἀρχῆς对初始阶段的强调，虽略有语义叠加，却体现原文刻意加强的责备。
- source_word: τῶν λογίων τοῦ θεοῦ
  choice: 上帝圣言
  rationale: λόγια在此指来自上帝的神圣言语或启示；“圣言”简洁、庄重，并避免使人联想到异教神谕。
- source_word: γεγόνατε χρείαν ἔχοντες
  choice: 你们竟成了需要……的人
  rationale: 体现完成时所表示的已形成且延续至今的状态；“竟”传达语境中的责备，却未增添新的命题内容。
- source_word: γάλακτος, οὐ στερεᾶς τροφῆς
  choice: 需要奶、而不是干粮
  rationale: 保留奶与固体食物的原有比喻和鲜明对照，不将其直接解释成某一套教义课程。
theological_decisions:
- issue: 奶与干粮的比喻
  choice: 原样保留为“奶”和“干粮”
  alternative: 解释性意译为“初级教导”和“高深教导”
  rationale: 经文本身使用比喻，却未在本节界定一套技术性的属灵成长体系；保留比喻可维持作者的修辞张力。
- issue: “上帝的λόγια”的性质
  choice: 译作“上帝圣言”
  alternative: “上帝的话”或“上帝的神谕”
  rationale: “圣言”既显示这些言语源于上帝，又不把它限定为某一特定经卷范围；同时避免“神谕”在现代汉语中可能带来的异教占卜联想。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“从所经过的时间来看”贴近原文的时间依据；分为两句，以清楚呈现责备的递进。所有脚注标记均置于其所说明的词句之后。
