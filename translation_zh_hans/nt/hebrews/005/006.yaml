  text: καθὼς καὶ ἐν ἑτέρῳ λέγει· Σὺ ἱερεὺς εἰς τὸν αἰῶνα κατὰ τὴν τάξιν Μελχισέδεκ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/006.yaml
  text: just as he also says in another place[b][a], “You are a priest forever according to the order of Melchizedek,”
translation:
  language: zh_hans
  text: '正如他在另一处也说[a]：


    “你照着麦基洗德的等次，


    永远作祭司，”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在另一处”直译为“在另一个（……）中”，原文省略了“地方”或“经文”。
    reason: lexical_alternative
  - marker: b
    text: “等次”也可译为“次序”或“类别”。
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς καὶ
  choice: 正如……也
  rationale: 自然保留比较词“正如”和附加词“也”，表明这里引入与上一节平行的另一处经文引文。
- source_word: ἐν ἑτέρῳ
  choice: 在另一处
  rationale: 希腊文直译为“在另一个（……）中”，所省略的是“地方”或“经文”；“在另一处”简洁自然，也保留其省略性。
- source_word: λέγει
  choice: 他说
  rationale: 保留希腊文第三人称单数的表达，并体现《希伯来书》把经文呈现为神当下说话的修辞方式，而不擅自补出“神”。
- source_word: Σὺ
  choice: 你
  rationale: 保留诗篇引文中第二人称单数的直接称呼。
- source_word: ἱερεὺς
  choice: 祭司
  rationale: 采用现代中文圣经语境中通行、准确的对应词。
- source_word: εἰς τὸν αἰῶνα
  choice: 永远
  rationale: 该固定表达在此表示持续无穷；“永远”准确、自然且庄重。
- source_word: κατὰ τὴν τάξιν
  choice: 照着……的等次
  rationale: “等次”可表达与麦基洗德相关的祭司类别或次序，并保留《希伯来书》论证中的类型关联，而不简化为仅仅“像”或“方式”。
- source_word: Μελχισέδεκ
  choice: 麦基洗德
  rationale: 采用现代简体中文圣经中通行的人名音译。
theological_decisions:
- issue: 引文公式中 λέγει 的说话者
  choice: 译作“他说”，不明说主语是谁。
  alternative: 译作“经上说”或“它说”。
  rationale: 原文只有第三人称单数动词，没有明示主语；“他说”既保持形式，也保留《希伯来书》中神借经文持续说话的神学与修辞张力。
- issue: τάξις 在麦基洗德引文中的含义
  choice: 译作“等次”，指与麦基洗德相关的祭司次序或类别。
  alternative: 译作“样式”“方式”或“体系”。
  rationale: “等次”既能承载祭司职分的类别与次序含义，也避免把关系缩减为外在相似；同时不超出原文去具体界定制度细节。
- issue: 引文语序
  choice: 将“照着麦基洗德的等次”置于“永远作祭司”之前。
  alternative: 按希腊文线性次序译作“你永远作祭司，是照着麦基洗德的等次”。
  rationale: 中文诗句中前置方式短语更自然清楚，命题内容未改变，也未消解“永远”与祭司身份之间的联系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。正文保留引文体，并用分行呈现诗句。“麦基洗德”“祭司”“等次”采用华语圣经传统中较为通行的术语；脚注只说明原文省略和 τάξις 的词义范围，不导入宗派性解释。
