source:
  edition: SBLGNT
  text: ὃς ἐν ταῖς ἡμέραις τῆς σαρκὸς αὐτοῦ δεήσεις τε καὶ ἱκετηρίας πρὸς τὸν δυνάμενον σῴζειν αὐτὸν ἐκ θανάτου μετὰ κραυγῆς ἰσχυρᾶς καὶ δακρύων προσενέγκας καὶ εἰσακουσθεὶς ἀπὸ τῆς εὐλαβείας,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/007.yaml
  text: who[a], in the days of his flesh, having offered up both prayers and petitions with loud cries and tears to the one able to save him from death, and having been heard because of his reverence[b],
translation:
  language: zh_hans
  text: 他[a]在肉身的日子里，曾带着大声的呼喊和眼泪，向那位能救他脱离死亡的上帝献上祈祷和恳求；他因自己的敬虔而蒙了垂听[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他”指上文所说的基督。这里的希腊文关系代词承接上文。
    reason: 指代说明；本节单独呈现时帮助读者辨明关系代词的先行词。
  - marker: b
    text: “救他脱离死亡”也可理解为“从死亡中救他出来”，即借着复活施行拯救。另，“敬虔”也可译作“敬畏”。
    reason: 保留ἐκ θανάτου及εὐλάβεια的语义可能性，避免正文预先限定解释。
lexical_decisions:
- source_word: ἐν ταῖς ἡμέραις τῆς σαρκὸς αὐτοῦ
  choice: 在肉身的日子里
  rationale: 保留σάρξ“肉身”的具体表达及道成肉身、具身体性的意味，同时以现代汉语可理解的结构呈现。
- source_word: δεήσεις τε καὶ ἱκετηρίας
  choice: 祈祷和恳求
  rationale: 用两个自然且有区分度的词表达祷告与迫切求告；“恳求”体现ἱκετηρίας的恳切语气。
- source_word: πρὸς τὸν δυνάμενον σῴζειν αὐτὸν ἐκ θανάτου
  choice: 向那能救他脱离死亡的
  rationale: 保留实体化分词“那能……的”，并以“脱离死亡”尽量容纳免于死和从死亡中得释放两种理解。
- source_word: μετὰ κραυγῆς ἰσχυρᾶς καὶ δακρύων
  choice: 大声呼喊、流泪
  rationale: 自然传达呼喊的强烈程度和眼泪；不拘泥于希腊语单数形式。
- source_word: προσενέγκας
  choice: 献上
  rationale: 既符合汉语祷告搭配，也保留προσφέρω在《希伯来书》祭司语境中可能具有的献祭回响。
- source_word: εἰσακουσθεὶς
  choice: 蒙了垂听
  rationale: 表达祈求获得有利垂听，而不擅自说明回应采取何种具体形式。
- source_word: ἀπὸ τῆς εὐλαβείας
  choice: 因自己的敬虔
  rationale: “敬虔”涵盖εὐλάβεια的虔敬、敬畏意涵，避免将其扩展为原文没有明说的“顺服”；脚注保留“敬畏”这一重要译法。
theological_decisions:
- issue: ἀπὸ τῆς εὐλαβείας所表达的耶稣之态度
  choice: 因自己的敬虔
  alternative: 因他的敬畏
  rationale: 原词可指敬虔、敬畏或虔敬态度。“敬虔”较自然且不暗示不当的恐惧，同时用脚注保留“敬畏”的可能性。
- issue: “救他ἐκ死亡”的范围
  choice: 救他脱离死亡
  alternative: 从死亡中救他出来，即借复活施行拯救
  rationale: ἐκ θανάτου既可能指免于死亡，也可能指经过死亡而从中获救。正文不限定，脚注说明后一种理解，以保留神学张力。
translation_notes:
  register: 采用现代、庄重而通顺的书面普通话。句式保持与上下文相连的关系从句性质，但在独立呈现时仍可理解；以“献上祈祷和恳求”“蒙了垂听”保留祭司语境和经文庄重感。
