  text: Οὕτως καὶ ὁ Χριστὸς οὐχ ἑαυτὸν ἐδόξασεν γενηθῆναι ἀρχιερέα, ἀλλ’ ὁ λαλήσας πρὸς αὐτόν· Υἱός μου εἶ σύ, ἐγὼ σήμερον γεγέννηκά σε·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/005.yaml
  text: 'So also the Messiah did not glorify himself to become high priest[a], but the one who spoke to him: “You are my Son[c][b]; today I have begotten you.”'
translation:
  language: zh_hans
  text: '同样，弥赛亚[a]也没有荣耀自己、使自己成为大祭司[c]；而是那位对他说：


    “你是我的儿子，

    我今日生了你。”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“基督”。希腊语Χριστός在这里用作称号，意为“受膏者”。
    reason: alternative_reading
  - marker: b
    text: 引自《诗篇》2:7。
    reason: cross_reference
  - marker: c
    text: “荣耀”也可译作“尊荣”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὕτως καὶ
  choice: 同样……也
  rationale: 承接上文关于大祭司并非自取尊荣、而是蒙上帝召立的论述，清楚保留比较和推论关系。
- source_word: ὁ Χριστὸς
  choice: 弥赛亚
  rationale: 此处Χριστός在有关受命担任祭司职分的论证中带有称号意味；译作“弥赛亚”比姓名化的“基督”更能显出其称号功能。
- source_word: οὐχ ἑαυτὸν ἐδόξασεν γενηθῆναι ἀρχιερέα
  choice: 没有自取成为大祭司的荣耀
  rationale: 以自然的现代汉语合并表达反身结构、δοξάζω的“使得荣耀”含义，以及进入大祭司身份的γενηθῆναι；避免把原文改写成明确的自我任命。
- source_word: ἀλλ’ ὁ λαλήσας πρὸς αὐτόν
  choice: 这荣耀来自那位对他说
  rationale: 原文在ἀλλά之后省略了与前半句相对的谓语。汉语中适度补出“这荣耀来自”，使句子完整，同时仍让说话者的身份由上下文和引文表明。
- source_word: Υἱός μου εἶ σύ
  choice: 你是我的儿子
  rationale: 采用自然而庄重的汉语语序，直接保留父子称谓，不加入超出引文本身的解释。
- source_word: ἐγὼ σήμερον γεγέννηκά σε
  choice: 我今日生了你
  rationale: 直接呈现γεννάω的生育意象及“今日”的时间表达，保留诗篇引文在基督论语境中的张力，不把它释义为登基、复活或永恒受生等某一特定解释。
theological_decisions:
- issue: Χριστός的称号性质
  choice: 弥赛亚
  alternative: 基督
  rationale: 本节论及受上帝授予职分，称号意义较为突出；正文采用“弥赛亚”，脚注保留传统译名“基督”。
- issue: “我今日生了你”的基督论含义
  choice: 按引文直译，不作解释性扩写
  alternative: 在正文中明确释为登基、复活、成为父子关系或永恒受生
  rationale: 本句引自诗篇2:7。直译能够保留原文的互文关系与神学张力，避免译文替读者裁定后来的解释争议。
- issue: ἀλλά之后的省略结构
  choice: 补出“这荣耀来自”
  alternative: 逐字保留为不完整的“而是那位对他说……”
  rationale: 补足汉语必要的句法成分，使前后形成“并非自取，而是来自那位……”的对照；所补内容来自本句自身的明确语义，并未指定额外的授职方式。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“自取成为大祭司的荣耀”既自然表达与上文的对照，也避免使用过度古雅的“自尊为荣”等说法。诗篇引文分行排写，以显示其引文和诗体性质。
