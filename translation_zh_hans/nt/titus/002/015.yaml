  text: Ταῦτα λάλει καὶ παρακάλει καὶ ἔλεγχε μετὰ πάσης ἐπιταγῆς· μηδείς σου περιφρονείτω.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/015.yaml
  text: Speak these things[a], and exhort and rebuke with all authority. Let no one disregard you.
translation:
  language: zh_hans
  text: 你要讲这些事，也要劝勉、责备人，以完全的权柄。谁也不可轻看你。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “轻看”也可译作“藐视”、“看不起”或“不把你当回事”。
    reason: περιφρονέω可表示轻视、鄙视或不予理会；脚注保留其词义幅度和不同程度的语气。
lexical_decisions:
- source_word: Ταῦτα
  choice: 这些事
  rationale: 中性复数指示代词回指本章前面的各项教导；“这些事”保留其宽泛的指代范围，不把它限缩为某一类内容。
- source_word: λάλει
  choice: 讲明
  rationale: 现在时命令语气要求持续传讲。“讲明”在现代汉语中自然，也不把该词过度具体化为“教导”。
- source_word: παρακάλει
  choice: 劝勉
  rationale: 该词兼有鼓励、劝告和敦促之意；“劝勉”既保留牧养语境中的温度，也体现命令性的道德催促。
- source_word: ἔλεγχε
  choice: 责备人
  rationale: 该词指揭露错误并加以纠正；“责备”保留其直接的纠正力度，加“人”使三个并列动词在汉语中衔接自然。
- source_word: μετὰ πάσης ἐπιταγῆς
  choice: 带着充分的权柄
  rationale: ἐπιταγή可指命令、吩咐或权威；此处修饰前面的行动，表达执行这些职责时所带的充分权威。“充分”体现πάσης的加强作用，同时不把权柄解释为提多自主拥有的权力。
- source_word: μηδείς
  choice: 谁也不可
  rationale: 以自然的现代汉语表达第三人称否定命令，并保留对任何人的全面禁止。
- source_word: σου
  choice: 你
  rationale: 该属格代词是περιφρονείτω所针对的对象，汉语直接译作“你”。
- source_word: περιφρονείτω
  choice: 轻看
  rationale: 该词表示看不起、轻视或不予理会。“轻看”自然、凝练，并保留对提多本人及其职分不加尊重的含义；其他可能译法列于脚注。
theological_decisions:
- issue: μετὰ πάσης ἐπιταγῆς所表达的服事权柄
  choice: 提多要带着充分的权柄讲明、劝勉并责备。
  alternative: 仅指用命令式的口吻说话，或只指信息本身的权威而完全不涉及提多履行职分。
  rationale: 该介词短语自然地修饰前面的几个命令，说明提多执行这些职责时应有的分量与权威；译文没有进一步界定权柄的制度来源或性质，因而保留经文本身的张力。
- issue: μηδείς σου περιφρονείτω的命令对象与语气
  choice: 译作“谁也不可轻看你”，直接禁止任何人轻视提多。
  alternative: 译作“不要让任何人轻看你”，将重点放在提多应如何防止别人轻视他。
  rationale: 希腊文以μηδείς为第三人称命令的主语；“谁也不可”较直接地保留这一句法和禁止语气，也避免暗示提多能够完全控制他人的态度。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“讲明—劝勉—责备”保持三个并列行动的递进感；“带着充分的权柄”避免生硬的直译“带着一切命令”，也不额外引入宗派性的职分解释。
