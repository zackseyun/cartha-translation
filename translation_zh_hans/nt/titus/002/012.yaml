  text: παιδεύουσα ἡμᾶς, ἵνα ἀρνησάμενοι τὴν ἀσέβειαν καὶ τὰς κοσμικὰς ἐπιθυμίας σωφρόνως καὶ δικαίως καὶ εὐσεβῶς ζήσωμεν ἐν τῷ νῦν αἰῶνι,
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/012.yaml
  text: training us[a], so that, having renounced ungodliness and worldly desires, we might live self-controlled, righteous, and godly lives in the present age[c][b],
translation:
  language: zh_hans
  text: 教导我们[a]，使我们弃绝不敬虔和世俗的欲望[b]，并在现今的世代过着自制、公义、敬虔的生活[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “教导”也可译作“训练”或“管教”；希腊词含有借着教导和管教来塑造人的意思。
    reason: lexical_alternative
  - marker: b
    text: “欲望”也可译作“情欲”。
    reason: lexical_alternative
  - marker: c
    text: 原文用三个副词，直译是“自制地、公义地、敬虔地生活”。
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδεύουσα
  choice: 教导
  rationale: 此分词承接上节的“恩典”，表示带有塑造、管教意味的培育行动。“教导”自然易懂，并以脚注补明其内涵不只包括传授知识。
- source_word: ἵνα
  choice: 使
  rationale: 引出恩典施行教导的目的或结果；融入汉语句式，不另作生硬直译。
- source_word: ἀρνησάμενοι
  choice: 除去
  rationale: 表示坚决拒绝、弃绝；“除去”能自然表达与旧有生活决裂，并与后面的新生活形成对照。
- source_word: ἀσέβειαν
  choice: 不敬虔
  rationale: 保留该词对神缺乏敬畏、生活不以神为中心的宗教伦理含义。
- source_word: κοσμικὰς ἐπιθυμίας
  choice: 世俗的欲望
  rationale: 指受现今世界秩序支配的欲求；“世俗的欲望”现代、清楚，也不将 ἐπιθυμία 的强度一概加重为“情欲”。
- source_word: σωφρόνως
  choice: 自制
  rationale: 表达清醒、克制、节制地生活，也是《提多书》中反复出现的伦理主题。
- source_word: δικαίως
  choice: 公义
  rationale: 表达按正直、公正之道行事，保留其伦理及神学色彩。
- source_word: εὐσεβῶς
  choice: 敬虔
  rationale: 表达敬畏神、以神为中心的生活取向，与“不敬虔”形成清楚对照。
- source_word: ζήσωμεν
  choice: 过……的生活
  rationale: 符合现代汉语习惯，并使三个副词所描述的生活方式表达自然。
- source_word: ἐν τῷ νῦν αἰῶνι
  choice: 在现今这个世代
  rationale: αἰών 指当前的时代或世界秩序，并隐含与将来世代的对照；“现今这个世代”保留此末世论色彩。
theological_decisions:
- issue: σωφρόνως καὶ δικαίως καὶ εὐσεβῶς 三个副词的表达
  choice: 过自制、公义、敬虔的生活
  alternative: 自制、公义、敬虔地生活
  rationale: 原文三个副词共同修饰“生活”。汉语中将其表达为生活的三重特质更自然，同时完整保留自我约束、对人正直和对神敬虔三个维度。
- issue: ἀρνησάμενοι 与 ζήσωμεν 的关系
  choice: 除去……，过……的生活
  alternative: 既已弃绝……，就可以……生活
  rationale: 原文不定过去时分词可体现弃绝在逻辑上先于新生活，但整句处在 ἵνα 目的结构中。译文保留两者的顺序和紧密关系，不额外断定一次性经历或特定成圣理论。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“不敬虔／敬虔”保留原文刻意形成的反义呼应；“过……的生活”避免连续副词造成的生硬感。所有脚注标记均已置于正文相应位置。
