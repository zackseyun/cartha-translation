  text: ὃς ἔδωκεν ἑαυτὸν ὑπὲρ ἡμῶν ἵνα λυτρώσηται ἡμᾶς ἀπὸ πάσης ἀνομίας καὶ καθαρίσῃ ἑαυτῷ λαὸν περιούσιον, ζηλωτὴν καλῶν ἔργων.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/014.yaml
  text: who gave himself for us[a], so that he might redeem us from all lawlessness and purify for himself a people for his own possession, zealous for good works.
translation:
  language: zh_hans
  text: 他为我们献上自己，为要救赎我们脱离一切不法，又洁净我们，使我们成为他所特有的子民[a]，热心行善。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“他自己所拥有的子民”、“他所珍爱的子民”或“特别的子民”。原文带有圣约意味，指一群特别归属于他的子民。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκεν ἑαυτὸν
  choice: 献上自己
  rationale: 表达主动、自愿的自我交付；“献上”在现代中文中自然庄重，也符合此处为他人舍己的语境。
- source_word: ὑπὲρ ἡμῶν
  choice: 为我们
  rationale: 简洁保留受益、代表乃至替代的可能含义，不把经文本身未完全限定的救赎模式收窄。
- source_word: ἵνα λυτρώσηται
  choice: 为要救赎
  rationale: λυτρόομαι包含付代价使人得释放的意涵；“救赎”保留其救赎神学和释放色彩。
- source_word: ἀπὸ πάσης ἀνομίας
  choice: 脱离一切不法的事
  rationale: ἀνομία指违背律法或法则的状态与行为；中文补出“的事”使表达自然，并保留“一切”的全面性。
- source_word: καθαρίσῃ
  choice: 洁净
  rationale: 保留礼仪与道德两方面的语义空间，并契合圣约子民的语境。
- source_word: ἑαυτῷ
  choice: 使我们成为……他自己的
  rationale: 用自然中文表达与格所含的归属和为己之意，并承接前面的“我们”。
- source_word: λαὸν περιούσιον
  choice: 专属他自己的子民
  rationale: περιούσιος承载七十士译本中圣约子民特别归属于神的背景；此译法突出专属关系，而不只泛指“特别”。
- source_word: ζηλωτὴν καλῶν ἔργων
  choice: 热心行善
  rationale: 自然表达ζηλωτής所指的热切投入；“行善”准确而通俗地传达καλὰ ἔργα。
theological_decisions:
- issue: ὑπὲρ ἡμῶν在基督自我交付中的含义
  choice: 译作“为我们”
  alternative: “代替我们”或“为了我们的益处”
  rationale: 原介词可包含为某人、代表某人，并在语境中容纳替代意味；宽译避免把本节限定为单一的赎罪理论。
- issue: λαὸν περιούσιον的圣约含义
  choice: 译作“专属他自己的子民”
  alternative: “珍爱的子民”或“特别的子民”
  rationale: 该短语呼应旧约中归神为产业的圣约语言；正文突出专属归属，脚注保留“珍爱的”这一合理侧重。
- issue: 救赎所脱离的ἀνομία
  choice: 译作“脱离一切不法的事”
  alternative: “脱离一切邪恶”
  rationale: “不法”比宽泛的“邪恶”更贴近ἀνομία与法则相悖的意义，同时不将其仅限于外在行为。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“献上自己”“救赎”“洁净”“子民”保留经文的神学与圣约语域；句式按中文习惯调整，同时保持原文目的、洁净、归属和热心行善的逻辑顺序。
