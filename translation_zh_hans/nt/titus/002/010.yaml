id: TIT.2.10
reference: Titus 2:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: μὴ νοσφιζομένους, ἀλλὰ ⸂πᾶσαν πίστιν⸃ ἐνδεικνυμένους ἀγαθήν, ἵνα τὴν διδασκαλίαν ⸀τὴν τοῦ σωτῆρος ἡμῶν θεοῦ κοσμῶσιν ἐν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/010.yaml
  text: not pilfering[a], but showing all good faith, so that in everything they may adorn the teaching of God our Savior.
translation:
  language: zh_hans
  text: 不可私自侵占，却要显出完全的忠信[a]，好使他们在凡事上都为我们救主上帝的教导增添光彩。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “忠信”原文也常译作“信”；在这里，按上下文也可理解为“信实”或“完全可靠”。
    reason: 保留 πίστις 在一般神学用法与本节伦理语境之间的词义幅度。
lexical_decisions:
- source_word: νοσφιζομένους
  choice: 私自侵占
  rationale: 该词指暗中把属于别人的财物据为己有；在仆人与主人这一语境中，“私自侵占”比泛指的“偷窃”更贴近原义，又不把行为限定为特定法律罪名。
- source_word: πᾶσαν πίστιν ἐνδεικνυμένους ἀγαθήν
  choice: 显出完全的忠信
  rationale: 这里的 πίστις 主要指行为上的忠诚、可靠；πᾶσαν 表示充分、全面，ἀγαθήν 表明这种忠信是良善、真实的。“显出完全的忠信”既符合语境，也保留了原文较庄重的表达。
- source_word: κοσμῶσιν
  choice: 增添光彩
  rationale: 该动词本义是装饰、使之美观；“增添光彩”保留其比喻意象，同时符合现代汉语习惯。
- source_word: διδασκαλίαν
  choice: 教导
  rationale: “教导”准确而通俗地表达 διδασκαλία，较“教义”更少带入后世体系化含义。
- source_word: τοῦ σωτῆρος ἡμῶν θεοῦ
  choice: 我们救主上帝的
  rationale: 按原文属格结构直译，清楚保留“上帝是我们的救主”这一称谓，不额外指定为本节未明说的其他位格。
- source_word: ἐν πᾶσιν
  choice: 在凡事上都
  rationale: 表达其全面范围，并在汉语中自然地修饰“为……增添光彩”。
theological_decisions:
- issue: 伦理语境中 πίστις 的译法
  choice: 正文译为“忠信”
  alternative: 信、信实、可靠
  rationale: 上下文谈仆人不侵占主人财物，而以行为证明自己可信，因此伦理意义上的“忠信”最为自然；脚注保留该词通常也可表示“信”的词义张力。
- issue: “我们救主上帝”的所指
  choice: 照原文译作“我们救主上帝”
  alternative: 结合教牧书信其他经文，将“救主”进一步解释为基督
  rationale: 本句直接以“救主”称上帝；译文不把本节未明确表达的基督论指向加进正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“私自侵占”明确行为性质；“增添光彩”保留原文“装饰”的比喻而避免生硬直译。
