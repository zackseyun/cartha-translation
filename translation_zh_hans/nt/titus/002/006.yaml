  text: Likewise[b][a], urge the younger men to be self-controlled.
translation:
  language: zh_hans
  text: 同样，你要劝年轻男子[a]要自制[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“较年轻的男子”。原文特指较年轻的男性，并非泛指所有年轻人。
    reason: lexical_alternative
  - marker: b
    text: 或译“审慎自持”或“头脑清醒”。原词强调健全的判断和有节制的自我约束。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοὺς νεωτέρους
  choice: 年轻男子
  rationale: 定冠词加阳性复数形容词在本段按年龄与性别依次劝勉各群体的结构中，特指较年轻的男性；译作“年轻男子”既保留性别所指，也符合现代汉语。
- source_word: ὡσαύτως
  choice: 同样，也
  rationale: 承接前面对其他群体的平行劝勉。“同样”保留连接作用，加“也”使汉语表达自然。
- source_word: παρακάλει
  choice: 要劝
  rationale: 现在时主动命令式要求提多持续劝导。“劝”在现代汉语中自然，并能表达恳切劝勉而非单纯命令。
- source_word: σωφρονεῖν
  choice: 自守
  rationale: 该词涵盖心思健全、判断审慎和有节制的行为。“自守”简洁庄重，并与本章同一词族的反复使用相协调；脚注补明其语义范围。
theological_decisions:
- issue: νεωτέρους的性别所指
  choice: 特指年轻男子
  alternative: 泛指年轻人
  rationale: 原文为阳性复数，且上下文依次提到老年男子、老年妇女、年轻妇女和年轻男子，因此不将其性别所指泛化。
translation_notes:
  register: 采用现代、简洁而庄重的普通话。“年轻男子”明确保留原文的男性所指；“自守”适合经文语体，但不依赖宗派术语，并以脚注呈现原词兼有审慎、清醒和节制的语义张力。
