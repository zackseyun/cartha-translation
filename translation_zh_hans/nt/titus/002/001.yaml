  yaml_path: translation/nt/titus/002/001.yaml
  text: But as for you[a], speak the things that are fitting for sound teaching.
translation:
  language: zh_hans
  text: 至于你，要讲合乎健全教导的话[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“健全的教义”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Σὺ δὲ
  choice: 但你
  rationale: 显明的代词Σὺ与δὲ共同形成对比，承接上文对假教师的论述；“但你”在现代汉语中简洁自然地保留这一转折和强调。
- source_word: λάλει
  choice: 所讲的
  rationale: λαλέω是宽泛的“说、讲”，不必限缩为正式的“教导”；放在关系结构中译作“所讲的”，既自然又保留命令所指的言说内容。
- source_word: ἃ πρέπει
  choice: 应当合乎
  rationale: πρέπω表达适宜、相称之意；“应当合乎”既体现规范性，也清楚表达提多所讲内容须与健全教导相称。
- source_word: ὑγιαινούσῃ
  choice: 健全的
  rationale: 该词本义涉及健康，此处比喻教导正确、没有败坏；“健全的”在现代汉语中能保留健康隐喻，也适合修饰“教导”。
- source_word: διδασκαλίᾳ
  choice: 教导
  rationale: διδασκαλία可指教导的活动或内容。“教导”比“教义”范围更宽，也更贴近原词在此处可能兼有的两层含义。
theological_decisions:
- issue: τῇ ὑγιαινούσῃ διδασκαλίᾳ的表达
  choice: 健全的教导
  alternative: 纯正的教义
  rationale: “健全的教导”保留ὑγιαίνω的健康隐喻，并避免把διδασκαλία仅限缩为体系化教义；同时仍能表达使徒教导在内容上的可靠与纯正。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“但你”突出与上文假教师的对比；句式略作汉语化重组，以避免“讲那些合宜于……”的生硬表达。
