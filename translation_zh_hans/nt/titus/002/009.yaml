base_translation:
  language: en
  yaml_path: translation/nt/titus/002/009.yaml
  text: Slaves are to submit to their own masters in everything[a], to be pleasing, not argumentative[b],
translation:
  language: zh_hans
  text: 奴隶[a]要在凡事上顺服自己的主人，讨他们的喜悦，不可顶嘴[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“仆人”或“奴仆”；希腊语 doulous 可指服役者，但本句更可能着重其受奴役的身份。
    reason: alternative_reading
  - marker: b
    text: 或译“不可反驳”或“不可出言抵触”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Δούλους
  choice: 作奴隶的
  rationale: δοῦλος 可指仆人或奴隶；本句同时提到 δεσπόταις，显示受主人所有和支配的社会身份，因此译作“奴隶”，不以较柔化的“仆人”掩盖原文所处的现实。
- source_word: ἰδίοις δεσπόταις
  choice: 自己的主人
  rationale: ἰδίοις 表明“自己的”，δεσπότης 在此家庭秩序语境中指对奴隶拥有权柄的主人；“主人”是现代汉语中自然且准确的对应。
- source_word: ὑποτάσσεσθαι
  choice: 要……顺服
  rationale: 该现在时中被动形不定式表达持续处于服从之下的要求；结合汉语劝勉句式译为“要……顺服”。
- source_word: ἐν πᾶσιν
  choice: 凡事
  rationale: 保留 πᾶσιν 的广泛概括范围；“凡事”简洁、庄重，也符合现代圣经语体。
- source_word: εὐαρέστους εἶναι
  choice: 讨主人喜悦
  rationale: εὐάρεστος 表示“令人满意、使人喜悦”；原文虽未重述对象，但上下文明确指主人，汉语补出“主人”可避免歧义并保持自然。
- source_word: μὴ ἀντιλέγοντας
  choice: 不可顶嘴
  rationale: ἀντιλέγω 可指反驳、抵触或说话反抗；在主人与奴隶的关系语境中，“顶嘴”准确传达言语上的抗拒，且为普通读者易懂。
theological_decisions:
- issue: 家庭秩序语境中 δοῦλος 的译法
  choice: 奴隶
  alternative: 仆人／奴仆
  rationale: “奴隶”如实反映本节中受 δεσπότης 支配的身份，不将古代奴隶制度柔化为一般雇佣服务关系；这种翻译是对经文社会现实的描述，并不表示认可该制度。
- issue: “凡事”所表达的顺服范围
  choice: 保留原文概括性的“凡事”
  alternative: 加入伦理限制性说明
  rationale: ἐν πᾶσιν 本身是概括性表达，本节没有明说限制条件；正文不应擅自缩小或解释其范围，以保留原文的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“作奴隶的”作为群体称谓自然引出劝勉；“顶嘴”较口语化，但准确清楚地表达此处言语反抗的含义。句末保留逗号，以反映本节句法尚接续下一节。
