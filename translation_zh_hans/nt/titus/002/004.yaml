  text: ἵνα ⸀σωφρονίζωσι τὰς νέας φιλάνδρους εἶναι, φιλοτέκνους,
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/004.yaml
  text: so that they may train the younger women to be loving toward their husbands and loving toward their children[c][b][a],
translation:
  language: zh_hans
  text: 好让她们劝导[a]年轻妇女[b]爱丈夫、爱儿女[c]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“教导”“规劝”，也可理解为“教导她们明智自守”；原词含有引导人以清醒、健全的心思行事之意。
    reason: lexical_alternative
  - marker: b
    text: 直译“较年轻的妇女”，与上下文中的年长妇女相对。
    reason: lexical_alternative
  - marker: c
    text: 原文用两个形容词，也可译作“疼爱丈夫、疼爱儿女”或“对丈夫有爱、对儿女有爱”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: 好让
  rationale: 引出目的或结果从句；“好让”在现代汉语中自然，并保留希腊文的目的意味。
- source_word: σωφρονίζωσι
  choice: 劝导
  rationale: 该动词可指使人恢复清醒健全的判断，也可指规劝、指导，使人行事明智自守。此处“劝导”既体现年长妇女对年轻妇女的塑造与指导，也不过度限定为课堂式“教导”。
- source_word: τὰς νέας
  choice: 年轻妇女
  rationale: 带冠词的阴性复数形容词在此实词化，指与上文年长妇女相对的年轻妇女；不译作“年轻妻子”，以免把原文所指范围缩窄。
- source_word: φιλάνδρους
  choice: 爱丈夫
  rationale: 该形容词表示对自己丈夫有爱；汉语以动词短语表达最自然，并与下一个形容词构成简洁平行。
- source_word: εἶναι
  choice: （融入“爱”）
  rationale: 希腊文不定式连接“劝导”与后面的两个谓语性形容词；汉语无需逐字译出“成为”，直接说“劝导……爱……”更自然。
- source_word: φιλοτέκνους
  choice: 爱儿女
  rationale: 该形容词表示疼爱自己的孩子；“儿女”自然涵盖子女，并与“爱丈夫”保持平行。
theological_decisions:
- issue: 家庭规范语境中“年轻妇女”的适用范围
  choice: 直接译作“年轻妇女”，并保留本节所设想的丈夫和儿女这一具体家庭处境。
  alternative: 译作“年轻妻子”，或改写成对所有女性的普遍家庭角色定义。
  rationale: 原文称“年轻妇女”，随后以爱丈夫、爱儿女描述所谈论的生活处境。译文既不应把所指擅自缩窄为“妻子”，也不应把这一具体劝导扩展成对所有女性身份的穷尽性定义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“劝导”适合年长妇女以言传身教塑造年轻妇女的语境；“爱丈夫、爱儿女”简洁自然，保留希腊文两个复合形容词的平行结构。末尾逗号表明本节句法仍接续下文。
