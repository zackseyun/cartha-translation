  text: πρεσβύτας νηφαλίους εἶναι, σεμνούς, σώφρονας, ὑγιαίνοντας τῇ πίστει, τῇ ἀγάπῃ, τῇ ὑπομονῇ.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/002.yaml
  text: Older men are to be temperate[a], dignified, self-controlled, sound in faith, in love, and in steadfastness.
translation:
  language: zh_hans
  text: 年长的男子要有节制、庄重、自制，在信心[a]、爱心和忍耐上都要健全。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“忠实”。希腊语πίστις可按语境表示“信心”或“忠实”。
    reason: alternative_reading
lexical_decisions:
- source_word: πρεσβύτας
  choice: 老年男子
  rationale: 本词在家庭与群体生活的劝勉中指年长的男性，并非教会职分“长老”；“老年男子”明确保留年龄与性别所指。
- source_word: νηφαλίους
  choice: 有节制
  rationale: 本词本义涉及清醒、不醉，进而表示克制有度；“有节制”涵盖较广的伦理意义，不把含义局限于饮酒。
- source_word: σεμνούς
  choice: 庄重
  rationale: 表达可敬、端庄而有分量的品格；“庄重”自然简洁，也不致误解为仅仅神情严肃。
- source_word: σώφρονας
  choice: 自守
  rationale: 表示思想审慎、能够约束自己；“自守”保留《提多书》中这一伦理关键词的自我管束意味，并与“有节制”有所区分。
- source_word: ὑγιαίνοντας
  choice: 健全
  rationale: 原义为健康，在此比喻信心、爱心和忍耐处于健全稳固的状态；“健全”在中文中能自然保留这一健康隐喻。
- source_word: τῇ πίστει
  choice: 在信心上
  rationale: πίστις在此可指信心，也可能指忠信；正文采用“信心”，同时用脚注保留另一种合理理解。
- source_word: τῇ ἀγάπῃ
  choice: 在爱心上
  rationale: ἀγάπη在此指爱；与后续并列成分共同受“健全”支配，译作“在爱心上”。
- source_word: τῇ ὑπομονῇ
  choice: 在忍耐上
  rationale: ὑπομονή指在困难中持续承受、坚定不退；“忍耐”是自然通行的中文表达，并包含持久承受之意。
- source_word: εἶναι
  choice: 要
  rationale: 不定式承接上文的劝勉；中文以“要”自然表达规范和劝导语气。
theological_decisions:
- issue: 德目列表中πίστις的含义
  choice: 信心
  alternative: 忠信
  rationale: 在“信心、爱心、忍耐”这一并列结构中，πίστις既可能指对神的信靠，也可能强调忠诚可靠。正文译作“信心”，脚注保留“忠信”，不把语义张力单方面消解。
translation_notes:
  register: 采用现代、庄重而易懂的劝勉语体。“有节制、庄重、自守”保持原文德目列表的简洁节奏；末句用“在……上都健全”保留ὑγιαίνω的健康隐喻。脚注标记置于有歧义的“信心”之后。
