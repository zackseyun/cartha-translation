  text: περὶ πάντα σεαυτὸν παρεχόμενος τύπον καλῶν ἔργων, ἐν τῇ διδασκαλίᾳ ⸀ἀφθορίαν, ⸀σεμνότητα,
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/007.yaml
  text: in every way presenting yourself as an example of good works[a]; in your teaching, purity, dignity[e][d][c][b],
translation:
  language: zh_hans
  text: 你凡事都要以自己作为善行的榜样[a]；在教导上要不受败坏[b]、庄重[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在一切事上都作善行的典范。”
    reason: 说明περὶ πάντα也可更形式对应地译为“在一切事上”，τύπον也可译为“典范”或“模范”。
  - marker: b
    text: 也可译为“纯正”或“不腐败”。有些抄本在“庄重”后加“纯洁”。
    reason: ἀφθορίαν指不受败坏；其在此处具体修饰教导或施教者的范围可保留。相关异读为在σεμνότητα后增添ἁγνείαν，而非替换ἀφθορίαν。
  - marker: c
    text: 或译：“严肃”或“端庄”。
    reason: σεμνότης表示严肃而值得尊敬的品格，中文有多个相近译法。
lexical_decisions:
- source_word: περὶ πάντα
  choice: 凡事都
  rationale: 此短语在这里作副词性修饰，表达提多在一切方面的行为；“凡事都”自然、简洁，并保留范围的广泛性。
- source_word: σεαυτὸν παρεχόμενος
  choice: 以自己为
  rationale: 中间语态分词带有反身意味，指提多主动使自己成为可供效法的对象；结合中文句法译作“以自己为”最为顺畅。
- source_word: τύπον
  choice: 榜样
  rationale: 在伦理语境中指可供他人效法的典范；“榜样”是现代汉语中清楚自然的对应词。
- source_word: καλῶν ἔργων
  choice: 善行
  rationale: 指美善的行为；“善行”凝练而庄重，也避免把该短语过度教义化。
- source_word: ἐν τῇ διδασκαλίᾳ
  choice: 在教导上
  rationale: 上下文着眼于提多的教导活动及其表现；“教导”比“教义”更贴近此处的实际施教语境，同时不排除教导内容。
- source_word: ἀφθορίαν
  choice: 纯正
  rationale: 该词基本含义是未受败坏、腐蚀；在教导语境中，“纯正”可自然表达教导不被败坏、真实健全的性质，又不过度限定为单纯的道德品格。
- source_word: σεμνότητα
  choice: 庄重
  rationale: 指一种严肃、端庄、值得尊敬的品质；“庄重”在现代汉语中准确且自然。
theological_decisions:
- issue: διδασκαλία应译为教导还是教义
  choice: 译作“教导”
  alternative: 教义
  rationale: 原文可以涉及教导的内容或行为；当前语境是在劝勉提多如何施教，因此采用较宽泛、自然的“教导”，不将其缩限为体系化教义。
- issue: ἀφθορίαν在教导语境中的具体所指
  choice: 译作“纯正”
  alternative: 不受败坏；纯洁；正直
  rationale: “纯正”既保留不腐败、不掺假的词义，也适用于教导的内容和施教者的态度，从而保留原文可能兼具伦理与教义层面的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式承接本段对提多的直接劝勉，以“你……要……”显明希腊语分词在语境中的命令性功能；标点将行为榜样与教导品质分开，同时保留二者同属一项劝勉的关系。
