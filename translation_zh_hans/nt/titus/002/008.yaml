source:
  edition: SBLGNT
  text: λόγον ὑγιῆ ἀκατάγνωστον, ἵνα ὁ ἐξ ἐναντίας ἐντραπῇ μηδὲν ἔχων ⸂λέγειν περὶ ἡμῶν⸃ φαῦλον.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/008.yaml
  text: sound speech that cannot be condemned[a], so that the one who opposes us may be put to shame[c][b], having nothing evil to say about us.
translation:
  language: zh_hans
  text: 健全[a]、无可指责[b]的言语，使反对者[c]蒙羞[d]，无从说我们有什么恶事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “健全”也可译作“纯正”或“健全的信息”。
    reason: lexical_alternative
  - marker: b
    text: “无可指责”也可译作“不能被定罪”或“不受非议”。这里指没有正当的指责理由，并非保证无人批评。
    reason: lexical_alternative
  - marker: c
    text: 希腊文直译为“来自对立一方的人”，即反对者。
    reason: lexical_alternative
  - marker: d
    text: “蒙羞”也可译作“感到羞愧”。
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγον
  choice: 言语
  rationale: 此处指提多教导时所说之话及其内容，不宜缩小为单独一个“字”，也不宜明确扩展为某一种特定“信息”。“言语”在现代汉语中自然，并保留原词的宽泛意义。
- source_word: ὑγιῆ
  choice: 健全
  rationale: 保留“健康、完好”的隐喻，同时在教导与言语的语境中表达内容正确、无害而可靠；比直译“健康”更符合现代汉语搭配。
- source_word: ἀκατάγνωστον
  choice: 无可指责
  rationale: 表达其言语没有可成立的谴责理由，兼顾道德声誉和近似司法判断的意味，而不把意思加强为绝对不会受到任何人的批评。
- source_word: ὁ ἐξ ἐναντίας
  choice: 那敌对的人
  rationale: 原文直指“来自对立一方的人”，是对反对者的习惯说法。“那敌对的人”保留其关系性，又不擅自限定为某个特定群体。
- source_word: ἐντραπῇ
  choice: 蒙羞
  rationale: 兼顾被置于羞愧境地和本人感到羞愧的语义范围，保留原文被动形式所具有的张力。
- source_word: μηδὲν ἔχων λέγειν περὶ ἡμῶν φαῦλον
  choice: 因为他对我们无恶言可说
  rationale: 以自然、凝练的汉语表达“没有任何坏的事可说到我们”，保留“我们”的第一人称复数，也避免把“说”过度解释为正式控告。
theological_decisions:
- issue: περὶ ἡμῶν中第一人称复数“我们”的范围
  choice: 保留为“我们”
  alternative: 译作“你”“我们基督徒”或“我们的教导”
  rationale: 原文没有明确限定“我们”只指保罗和提多、全体信徒，或其教导；直接保留代词，可避免加入原文未说明的教会论范围。
- issue: ἐντραπῇ所表达的羞愧是外在蒙羞还是内心羞愧
  choice: 正文译作“蒙羞”，脚注说明也可理解为“感到羞愧”
  alternative: 只译作“感到羞愧”
  rationale: 希腊文被动形式可突出因无话可说而陷入羞愧，也可能描述本人产生羞愧；正文和脚注共同保存这一语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“言语健全”略带圣经语体，但仍可理解，并保留原文“健康”的隐喻；句末“对我们无恶言可说”凝练自然，避免扩充为正式的司法控告。
