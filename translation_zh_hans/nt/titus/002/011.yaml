base_translation:
  language: en
  yaml_path: translation/nt/titus/002/011.yaml
  text: For the grace of God has appeared[b][a], bringing salvation to all people.
translation:
  language: zh_hans
  text: 因为上帝的恩典已经显现，给所有人带来救恩。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“已经显现，拯救所有人”，或“已经向所有人显现”。希腊语形容词 σωτήριος（“施行拯救的”“带来救恩的”）与与格短语 πᾶσιν ἀνθρώποις（“所有人”）在句法上可以有略微不同的理解。
    reason: lexical_alternative
  - marker: b
    text: “人”所对应的希腊语 ἀνθρώποις 在这里泛指人类，并非仅指男性。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπεφάνη
  choice: 已经显现
  rationale: 该词在这里是不及物意义，表示“出现、彰显出来”。“已经显现”既保留这一启示性的意味，也自然表达这一事件对当前仍有意义。
- source_word: γὰρ
  choice: 因为
  rationale: γάρ说明前文劝勉的根据；现代汉语中用“因为”衔接清楚自然。
- source_word: ἡ χάρις τοῦ θεοῦ
  choice: 上帝的恩典
  rationale: 保留属格结构，表达这恩典属于上帝、源于上帝；“恩典”也保留了保罗书信中神圣恩惠及其拯救功效的内涵。
- source_word: σωτήριος
  choice: 带来救恩
  rationale: σωτήριος是修饰“恩典”的形容词，表示具有拯救作用或带来救恩。译作“带来救恩”符合现代汉语习惯，又不额外加入特定救恩论解释。
- source_word: πᾶσιν ἀνθρώποις
  choice: 给所有人
  rationale: 与“带来救恩”搭配自然，并保留与格可表示对象或受益者的关系。“人”在此泛指人类，不限于男性；“所有人”维持原文的普遍范围。
theological_decisions:
- issue: πᾶσιν ἀνθρώποις与救恩之范围
  choice: 译作“给所有人带来救恩”，保留原文普遍性的陈述。
  alternative: “拯救所有人”或“向所有人显现”
  rationale: 原文可以因σωτήριος与与格短语的句法关系而有细微不同的理解。本译文不限定它是指每一个个体，还是各类、各阶层的人，也不据此断定某一特定救恩论立场。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“上帝的恩典已经显现”保留原文简洁、带有启示意味的表达；后半句用“给……带来……”使σωτήριος与πᾶσιν ἀνθρώποις的关系在汉语中自然可读，同时以脚注保留原文真实的句法歧义。
