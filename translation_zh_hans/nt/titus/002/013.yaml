  text: προσδεχόμενοι τὴν μακαρίαν ἐλπίδα καὶ ἐπιφάνειαν τῆς δόξης τοῦ μεγάλου θεοῦ καὶ σωτῆρος ἡμῶν ⸂Ἰησοῦ Χριστοῦ⸃,
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/013.yaml
  text: as we await the blessed hope and the appearing of the glory of our great God and Savior[a], Jesus the Messiah,
translation:
  language: zh_hans
  text: 等候那有福的盼望，并等候我们伟大的上帝和救主——耶稣弥赛亚——的荣耀显现[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“伟大的上帝的荣耀，以及我们救主耶稣弥赛亚的显现。”这种译法把“上帝”和“救主”理解为分别指两位，但可能性较小。
    reason: 保留希腊文结构所容许、但较不可能的两位所指解释。
lexical_decisions:
- source_word: προσδεχόμενοι
  choice: 等候
  rationale: 表达持续而热切的期待，并保留分词与上文相连的句法功能。
- source_word: τὴν μακαρίαν ἐλπίδα
  choice: 那有福的盼望
  rationale: “有福的”符合末世语境的庄重语体；“盼望”指所期待的将来福分，并非不确定的愿望。
- source_word: ἐπιφάνειαν τῆς δόξης
  choice: 荣耀显现
  rationale: 以自然简洁的现代汉语表达“荣耀的显现”，保留可见彰显的末世含义。
- source_word: τοῦ μεγάλου θεοῦ καὶ σωτῆρος ἡμῶν
  choice: 我们伟大的上帝和救主
  rationale: 依照希腊文一个冠词统摄两个单数人物名词的结构，将二者作为指向同一位的联合称号。
- source_word: Ἰησοῦ Χριστοῦ
  choice: 耶稣弥赛亚
  rationale: Χριστός在此为称号，译作“弥赛亚”以传达其含义，而非仅作传统音译。
theological_decisions:
- issue: “我们伟大的上帝和救主耶稣弥赛亚”是指一位还是两位
  choice: 理解为同一位：耶稣弥赛亚就是“我们伟大的上帝和救主”。
  alternative: 理解为两位：“伟大的上帝”和“我们的救主耶稣弥赛亚”。
  rationale: 希腊文以一个冠词统摄两个由καί连接的单数人物名词，随后接“耶稣弥赛亚”，最自然地指向同一位；同时在脚注中保留较不可能的两位所指解释。
- issue: “盼望”与“显现”的关系
  choice: 以“以及”保留两个并列名词短语。
  alternative: 将第二项解释为第一项的具体说明，译作“那有福的盼望，就是……荣耀显现”。
  rationale: καί可承载并列或解释性关系；正文保留形式上的并列，避免在译文中排除二者同指的语义可能。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“有福的盼望”“荣耀显现”保留经文的末世论语气；“弥赛亚”明确呈现Χριστός的称号含义。
