id: TIT.2.5
reference: Titus 2:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: σώφρονας, ἁγνάς, ⸀οἰκουργούς, ἀγαθάς, ὑποτασσομένας τοῖς ἰδίοις ἀνδράσιν, ἵνα μὴ ὁ λόγος τοῦ θεοῦ βλασφημῆται.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/005.yaml
  text: self-controlled[a], pure, working at home, kind, being subject to their own husbands[c][b], so that the word of God may not be slandered.
translation:
  language: zh_hans
  text: 自制、纯洁、勤于家务[a]、良善、顺服自己的丈夫[b]，免得上帝的道受到毁谤[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“操持家务”或“持家”。原文用词罕见，指积极从事家庭事务。
    reason: lexical_alternative
  - marker: b
    text: 或译“顺从自己的丈夫”。
    reason: lexical_alternative
  - marker: c
    text: 或译“受到辱骂”；较直译为“被亵渎”。
    reason: lexical_alternative
lexical_decisions:
- source_word: σώφρονας
  choice: 自制
  rationale: 该词指心思健全而表现出的审慎与自我约束；“自制”在现代汉语中清楚自然，也适合这里的品格清单。
- source_word: ἁγνάς
  choice: 纯洁
  rationale: 该词表达纯净，尤其是道德上的纯洁；“纯洁”保留其宽泛含义，不把它收窄为仅指性方面的贞洁。
- source_word: οἰκουργούς
  choice: 勤于家务
  rationale: 这个罕见词由“家”和“工作”构成，指积极从事家庭事务。“勤于家务”保留劳动和尽责的含义，同时避免暗示不得离家。
- source_word: ἀγαθάς
  choice: 待人良善
  rationale: ἀγαθός基本义为“良善”；在品格与行为清单中加上“待人”，自然呈现其关系和伦理层面，而不把它弱化为单纯的性情温和。
- source_word: ὑποτασσομένας
  choice: 顺服
  rationale: 该分词表示在关系秩序中处于顺从的位置。“顺服”贴近原文，又不在本节之外增添某种婚姻制度的完整神学体系。
- source_word: τοῖς ἰδίοις ἀνδράσιν
  choice: 自己的丈夫
  rationale: 在婚姻和家庭语境中，ἀνήρ明确指丈夫；保留“自己的”，使顺服的对象限于各自的丈夫。
- source_word: ἵνα μὴ
  choice: 免得
  rationale: “免得”简洁自然地表达否定目的，与原文ἵνα μή的目的含义相符。
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: 上帝的道
  rationale: 该短语指来自上帝的信息；“上帝的道”是直接、庄重且为现代中文读者熟悉的表达。
- source_word: βλασφημῆται
  choice: 受到毁谤
  rationale: 该动词指遭受诋毁、辱骂或亵渎。这里的对象是“上帝的道”，“受到毁谤”自然表达福音信息因人的行为而遭受公开非议。
theological_decisions:
- issue: 如何翻译οἰκουργούς而不夸大对女性活动范围的限制
  choice: 勤于家务
  alternative: 操持家务；以家庭为念；持家
  rationale: 原词强调从事家庭事务，并未明确规定不得从事家庭以外的活动。“勤于家务”既传达家庭责任和实际劳作，也避免加入原文没有明说的禁足含义。
- issue: 如何表达ὑποτασσομένας所指的婚姻关系秩序
  choice: 顺服自己的丈夫
  alternative: 顺从自己的丈夫；服从自己的丈夫
  rationale: 译文保留原文所说的关系秩序，却不据此扩展为经文本节没有完整说明的宗派性婚姻理论。“自己的”也明确限定其适用关系。
- issue: βλασφημῆται用于“上帝的道”时的语义
  choice: 受到毁谤
  alternative: 受到辱骂；被亵渎
  rationale: 原词可包括亵渎，但在这里着重于上帝的信息因信徒的行为而被人恶意毁谤。“毁谤”保留公开贬损的含义，并未排除其宗教性的严重程度。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。品格清单保持简洁并列；“勤于家务”避免古旧的“料理家政”，也避免将原词解释为必须局限在家中。“顺服”保留经文的关系性要求，但不加入额外的宗派术语。所有脚注标记均置于对应词语之后。
