  text: Πρεσβύτιδας ὡσαύτως ἐν καταστήματι ἱεροπρεπεῖς, μὴ διαβόλους ⸀μηδὲ οἴνῳ πολλῷ δεδουλωμένας, καλοδιδασκάλους,
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/003.yaml
  text: Older women likewise are to be reverent in behavior[a], not slanderers nor enslaved to much wine, teachers of what is good[b],
translation:
  language: zh_hans
  text: 老年妇女也要照样，在举止上与圣洁相称，不说毁谤人的话[a]，不受过多的酒奴役[b]，并且教导美善的事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不说毁谤人的话”也可译作“不诬告人”或“不恶意说人坏话”。这里的希腊词与常译作“魔鬼”的词相同，但在本处指毁谤别人的人。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“不沉迷于过多的酒”。希腊原文更直译为“已经受过多的酒奴役”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρεσβύτιδας
  choice: 老年妇女
  rationale: 指年长的妇女，与上文的老年男子相对应；“老年妇女”在现代汉语中清楚自然，也保留年龄所指。
- source_word: ὡσαύτως
  choice: 也要照样
  rationale: 承接上文并表明相应的劝勉；“也要照样”自然呈现其篇章衔接作用。
- source_word: ἐν καταστήματι ἱεροπρεπεῖς
  choice: 举止端庄，与圣洁相称
  rationale: κατάστημα指外在的举止、仪态，ἱεροπρεπής指适合神圣之事、与圣洁相称；此译既传达行为层面，也避免把后者弱化为一般意义上的庄重。
- source_word: μὴ διαβόλους
  choice: 不可毁谤人
  rationale: διάβολος在此伦理劝勉中指毁谤者或诬告者，并非专指魔鬼；动词式表达比“不可作毁谤者”更符合现代汉语。
- source_word: μηδὲ οἴνῳ πολλῷ δεδουλωμένας
  choice: 也不可作多酒的奴隶
  rationale: δεδουλωμένας是δουλόω的完成时被动分词，带有已受奴役、受其辖制的强烈意象；保留“奴隶”比仅译作“沉迷”更贴近原文。
- source_word: καλοδιδασκάλους
  choice: 要教导美善的事
  rationale: 这个复合形容词指教导良善内容的人；此译避免“好教师”可能被理解为教学能力高，而清楚表达所教内容是美善的。
theological_decisions:
- issue: 关于酒的劝勉是否保留奴役意象
  choice: 作多酒的奴隶
  alternative: 沉迷于许多酒；嗜酒
  rationale: 原文不是一般性地说饮酒或喜爱酒，而是以奴役描写酒对人的辖制。保留该意象可呈现劝勉的力度，又不把经文扩展为原文没有明说的全面禁酒命令。
- issue: ἱεροπρεπεῖς的伦理与神圣含义
  choice: 举止端庄，与圣洁相称
  alternative: 行为恭敬；举止虔敬
  rationale: 原词强调适合神圣事物的仪态；采用双重表达，既说明外在举止，也保留其与圣洁相称的宗教伦理色彩。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“与圣洁相称”保留原文的神圣语义，“作多酒的奴隶”则刻意保留奴役比喻。两个脚注标记均置于其实际说明的词语之后。
