id: TIT.1.7
reference: Titus 1:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: δεῖ γὰρ τὸν ἐπίσκοπον ἀνέγκλητον εἶναι ὡς θεοῦ οἰκονόμον, μὴ αὐθάδη, μὴ ὀργίλον, μὴ πάροινον, μὴ πλήκτην, μὴ αἰσχροκερδῆ,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/007.yaml
  text: For an overseer must be above reproach as God's steward[a], not self-willed, not quick-tempered, not given to wine, not violent, not greedy for shameful gain[b],
translation:
  language: zh_hans
  text: 因为监督[a]既是上帝的管家，就必须无可指责；不可刚愎自用，不可暴躁，不可贪酒，不可打人，也不可贪图不光彩的利益[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“主教”。希腊文指负责看顾、监察的人；译作“监督”，可避免把后世教会职衔的含义带入本节。
    reason: alternative_reading
  - marker: b
    text: 或译“贪图不义之财”。希腊文强调以可耻、不正当的方式谋取利益，范围未必只限于欺诈所得。
    reason: lexical_alternative
lexical_decisions:
- source_word: δεῖ
  choice: 必须
  rationale: 直接表达必要性和义务，力度符合希腊文。
- source_word: γὰρ
  choice: 因为
  rationale: 保留本节对上文所作的解释和论证关系。
- source_word: ἐπίσκοπον
  choice: 监督
  rationale: 按该词“看顾、监察的人”这一基本含义翻译，避免把后世教会体制中的特定职衔直接带入经文。
- source_word: ἀνέγκλητον
  choice: 无可指责
  rationale: 表示没有正当理由可受控告，并不暗示绝对无罪或毫无缺点。
- source_word: ὡς θεοῦ οἰκονόμον
  choice: 既是上帝的管家
  rationale: “管家”保留受托管理并须向主人负责的含义；“既是”自然表达 ὡς 在此所说明的身份和理由。
- source_word: αὐθάδη
  choice: 刚愎自用
  rationale: 兼顾自我中心、固执己意和傲慢专断的语义，比单译“任性”更充分。
- source_word: ὀργίλον
  choice: 暴躁
  rationale: 表达容易发怒的性情，而非一次性的愤怒行为。
- source_word: πάροινον
  choice: 贪酒
  rationale: 简洁表达受酒支配、耽于饮酒的倾向，又不把词义限定为某一次醉酒。
- source_word: πλήκτην
  choice: 打人
  rationale: 贴近该词“出手击打者”的具体含义，现代读者也容易理解；其含义可延伸至好斗和暴力。
- source_word: αἰσχροκερδῆ
  choice: 贪图不光彩的利益
  rationale: 同时保留“贪图获利”和获利方式或所得在道德上可耻这两层意思，且不把范围缩窄为违法所得。
theological_decisions:
- issue: 教会职分语境中 ἐπίσκοπος 的译法
  choice: 监督
  alternative: 主教
  rationale: “监督”较直接反映原词的看顾职能，不预先套入后世不同宗派对“主教”职衔及教阶结构的理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“刚愎自用”虽略具书面色彩，但在现代汉语中通行，且能准确承载原词的复合语气。分号把资格总述与随后一连串否定要求分开，同时保留希腊文连续列举的节奏。
source_grounding:
  english_pob_role: consult_only
