review_pass:
  verdict: approve
  source_fidelity: 译文准确传达 δεῖ γάρ 的解释性必要语气，以及“监督”作为上帝管家必须具备的资格。ἀνέγκλητον译为“无可指责”恰当，避免误作绝对无罪。后续五项否定性品格要求均得到忠实呈现；“刚愎自用”“暴躁”“贪酒”“打人”“贪图不光彩的利益”分别充分对应 αὐθάδη、ὀργίλον、πάροινον、πλήκτην、αἰσχροκερδῆ。
  naturalness: 整体为自然、庄重且现代可懂的普通话。“因为……既是……就必须……”的因果结构清晰；分号后连续使用“不可”形成适合资格清单的节奏。“打人”具体明白，且在此语境中能自然表达禁止暴力行为。
  terminology: “监督”以职能意义翻译 ἐπίσκοπος，避免预设后世教阶含义；脚注提供“主教”这一传统替代译法，处理平衡。“上帝的管家”准确表达 θεοῦ οἰκονόμον 的受托管理与问责意象。“不光彩的利益”保留 αἰσχροκερδῆ 所含道德可耻的获利意味，而不不当地限缩为违法或欺诈所得。
