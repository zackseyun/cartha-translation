  text: but hospitable[a], loving what is good, self-controlled, upright, holy, and disciplined[d][c][b],
translation:
  language: zh_hans
  text: 却要乐意接待客人，爱好良善，明智自守[a]，为人正直，敬虔，有节制[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “明智自守”和“有节制”所译的两个希腊词意义相关，却各有侧重：前者兼有思想清醒、明智审慎和自我约束之意，后者更强调控制自己的欲望和冲动。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: 却要
  rationale: 承接上一节的反面品格并转入正面要求；“却要”在中文中简洁地表达转折，也符合连续资格清单的句法。
- source_word: φιλόξενον
  choice: 乐意接待客旅
  rationale: 该词指乐于接待客人或陌生人；此译自然清楚，并保留“接待外来者”的具体伦理含义。
- source_word: φιλάγαθον
  choice: 喜爱良善
  rationale: 复合词表达对善或美善事物的喜爱；“喜爱良善”简洁庄重，又不把所爱的对象限定为善人。
- source_word: σώφρονα
  choice: 明达自守
  rationale: 该词兼有心思健全、审慎稳重和自我节制之意；“明达自守”兼顾判断清醒与行为有度，并与末尾的 ἐγκρατῆ 区分。
- source_word: δίκαιον
  choice: 为人正直
  rationale: 在品格清单中强调行为公正、合宜和正直；加上“为人”使现代中文更自然，也避免仅被理解为司法意义上的公平。
- source_word: ὅσιον
  choice: 敬虔
  rationale: 该词指对神圣之事合宜、忠诚而虔敬的品格；“敬虔”比泛化的“圣洁”更能保留其虔诚、虔敬色彩。
- source_word: ἐγκρατῆ
  choice: 克制自己
  rationale: 强调对欲望和冲动具有掌控力；此译清楚直白，并避免与 σώφρονα 完全合并。
theological_decisions:
- issue: 如何区分相邻的 σώφρονα 与 ἐγκρατῆ
  choice: 将 σώφρονα 译为“明达自守”，将 ἐγκρατῆ 译为“克制自己”
  alternative: 可分别译为“谨慎自守”和“有节制”，或使用两个语义重叠的“自守／自制”表达
  rationale: 两词意义相近却不完全相同：前者兼有清醒审慎、思想健全和行为有度之意，后者更侧重对欲望与冲动的实际控制。译文既保留重叠，也不将二者压成同一项品格。
- issue: ὅσιον 的宗教伦理色彩
  choice: 译为“敬虔”
  alternative: 可译为“圣洁”或“虔诚”
  rationale: 此词在本处可指合乎神圣要求、对神虔敬的品格。“敬虔”保留其宗教伦理色彩，同时不把它与通常译作“圣洁”的 ἅγιος 完全等同。
translation_notes:
  register: 采用现代、庄重而易懂的资格清单用语。“乐意接待客旅”具体呈现古代款待客人和陌生人的伦理要求；“明达自守”虽略具书面色彩，但能用简短措辞涵盖 σώφρονα 的复合含义。
