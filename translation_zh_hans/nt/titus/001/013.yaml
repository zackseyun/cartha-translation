source:
  edition: SBLGNT
  text: ἡ μαρτυρία αὕτη ἐστὶν ἀληθής. δι’ ἣν αἰτίαν ἔλεγχε αὐτοὺς ἀποτόμως, ἵνα ὑγιαίνωσιν ἐν τῇ πίστει,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/013.yaml
  text: This testimony is true. For this reason[a], rebuke them sharply, so that they may be sound in the faith,
translation:
  language: zh_hans
  text: 这个见证是真的。因此，要严厉地责备他们，使他们在信仰上健全[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在信仰上健全”也可译为“在信心上健全”，或“在所信的道上健全”。希腊文短语既可指他们的信心处于健康状态，也可指他们在基督信仰的内容上纯正健全。
    reason: 保留ἐν τῇ πίστει在主观信心与客观信仰内容之间的真实歧义。
lexical_decisions:
- source_word: μαρτυρία
  choice: 见证
  rationale: 指上文所引关于克里特人的话及其所作的判断；“见证”保留了作为证言、证词的意味。
- source_word: ἀληθής
  choice: 真的
  rationale: 作谓语形容词，表示这见证符合事实；“是真的”自然直接。
- source_word: δι’ ἣν αἰτίαν
  choice: 因此
  rationale: 承接前句并引出相应行动，简洁保留因果推论。
- source_word: ἔλεγχε
  choice: 责备
  rationale: 现在时命令语气要求提多持续或切实地揭责、纠正他们；“责备”保留直接对付错误的力度。
- source_word: ἀποτόμως
  choice: 严厉地
  rationale: 表达尖锐、严正的方式；“严厉地”在现代汉语中自然，也不额外引入惩罚含义。
- source_word: ὑγιαίνωσιν
  choice: 健全
  rationale: 原词本义与健康有关，此处为比喻用法；“健全”既保留健康意象，也适合信仰语境。
- source_word: ἐν τῇ πίστει
  choice: 在信仰上
  rationale: ἐν可表示所处的领域；带冠词的πίστις既可能指他们所持的信，也可能指基督信仰。正文采用可自然涵盖两者的表达，并以脚注说明歧义。
theological_decisions:
- issue: ἐν τῇ πίστει所指的是个人的信还是作为信仰内容的基督信仰
  choice: 在信仰上
  alternative: 在所信的道上；在信心上
  rationale: 上下文涉及错误教导，可能偏向作为信仰内容的“所信之道”；但希腊短语也可指人的信心或信仰状态。正文不把歧义限定为单一解释，脚注明确两种可能。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“严厉地责备”保留命令的强度；“健全”延续原文的健康隐喻。句末逗号照应本节在原文中继续进入下一节的句法结构。
