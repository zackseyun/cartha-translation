id: TIT.1.1
reference: Titus 1:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Παῦλος δοῦλος θεοῦ, ἀπόστολος δὲ Ἰησοῦ Χριστοῦ κατὰ πίστιν ἐκλεκτῶν θεοῦ καὶ ἐπίγνωσιν ἀληθείας τῆς κατ’ εὐσέβειαν
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/001.yaml
  text: Paul[a], a slave of God and an apostle of Jesus the Messiah, for the faith of God’s chosen ones and the knowledge of the truth that accords with godliness[c][b],
translation:
  language: zh_hans
  text: 保罗，神的奴仆、耶稣基督的使徒，为着神所拣选的人[a]的信心，以及他们对那合乎敬虔的真理的认识[b][c]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“神的选民”。
    reason: lexical_alternative
  - marker: b
    text: “认识”也可译为“充分认识”。
    reason: lexical_alternative
  - marker: c
    text: “合乎敬虔的真理”或译：“引向敬虔的真理”。
    reason: alternative_reading
lexical_decisions:
- source_word: δοῦλος
  choice: 奴仆
  rationale: 既保留保罗完全属于神、受神差遣的含义，也比现代汉语中容易误解为非法人格占有的“奴隶”更适合作为尊严而清楚的自称。
- source_word: ἀπόστολος
  choice: 使徒
  rationale: 这是现代汉语基督教语境中准确而通行的职分名称，表达受差遣并带有权柄的代表。
- source_word: δὲ
  choice: 、
  rationale: 此处δέ不是强烈转折，而是在两个并列身份之间作轻微推进；汉语用顿号自然连接，无须硬译为“但是”。
- source_word: Ἰησοῦ Χριστοῦ
  choice: 耶稣基督
  rationale: “基督”在现代汉语中是Χριστός这一称号的标准译法；全语表示这位使徒属于并受耶稣基督差遣。
- source_word: κατὰ
  choice: 为着
  rationale: 此处可表示保罗使徒职分所指向的目标或关联对象；“为着”保留方向性，同时不把句法关系限定为单纯因果。
- source_word: πίστιν
  choice: 信心
  rationale: 在此最自然地指神所拣选之人的信靠；“信心”比“信实”更符合本句与使徒职分的关联。
- source_word: ἐκλεκτῶν θεοῦ
  choice: 神所拣选的人
  rationale: 直接表达这些人是神拣选的，却不加入任何特定宗派对拣选方式或范围的进一步界定。
- source_word: ἐπίγνωσιν
  choice: 认识
  rationale: 表达对真理的确切认知；该词可能带有更充分、更深入认识的意味，另在脚注保留。
- source_word: ἀληθείας
  choice: 那……真理
  rationale: 用“那”体现希腊语定冠词的特指作用，并让修饰语在汉语中自然地置于“真理”之前。
- source_word: τῆς κατ’ εὐσέβειαν
  choice: 合乎敬虔的
  rationale: 保留κατά所表达的一致或相称关系，不在正文中将其收窄为真理必然“导致”敬虔的因果关系。
- source_word: εὐσέβειαν
  choice: 敬虔
  rationale: 在教牧书信语境中，这是通行且准确的表达，兼有对神的敬畏与由此形成的生活样式。
theological_decisions:
- issue: ἐκλεκτῶν θεοῦ所表达的拣选
  choice: 神所拣选的人
  alternative: 神的选民
  rationale: 正文清楚保留神主动拣选的含义，但不把该短语扩展成某一套特定的预定论体系。
- issue: κατὰ πίστιν……καὶ ἐπίγνωσιν与使徒职分的关系
  choice: 为着……信心，以及……认识
  alternative: 按照……信心和……认识
  rationale: 希腊语结构简练，可表示准则、关联或目标。正文采用较符合使徒使命语境的目标/指向理解，但用“为着”而非更强的使役结构，以免过度消除原文的弹性。
- issue: τῆς κατ’ εὐσέβειαν中真理与敬虔的关系
  choice: 合乎敬虔的真理
  alternative: 引向敬虔的真理
  rationale: 正文保留相称关系，不把κατά明确解释为结果或因果；可能的方向性理解列入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的书信开篇语体。保留本节与下一节相接的逗号。正文中的“他们”补明“认识”的主体，使汉语关系清楚，但并未增添新的神学主张。
