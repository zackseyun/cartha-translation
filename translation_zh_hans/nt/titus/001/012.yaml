id: TIT.1.12
reference: Titus 1:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἶπέν τις ἐξ αὐτῶν, ἴδιος αὐτῶν προφήτης, Κρῆτες ἀεὶ ψεῦσται, κακὰ θηρία, γαστέρες ἀργαί·
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/012.yaml
  text: One of them[a], their own prophet, said, “Cretans are always liars, evil beasts, lazy gluttons.”
translation:
  language: zh_hans
  text: 他们中有一个人，就是他们自己的先知，说：“克里特人总是说谎，是恶兽，是好吃懒做的人[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“懒惰的肚腹。”
    reason: 说明原文的字面意象及正文所采用的惯用表达。
lexical_decisions:
- source_word: εἶπέν τις ἐξ αὐτῶν
  choice: 他们中有一个人……说
  rationale: τις与ἐξ αὐτῶν合起来表示该群体中的某一个人；这样既保留不定指，也自然表达部分关系。
- source_word: ἴδιος αὐτῶν προφήτης
  choice: 他们自己的先知
  rationale: ἴδιος强调此人与克里特人自身的归属关系；“自己的先知”保留原文的强调。
- source_word: Κρῆτες ἀεὶ ψεῦσται
  choice: 克里特人总是说谎
  rationale: ἀεί直译为“总是”；ψεύστης指说谎的人。汉语用“总是说谎”比“总是骗子”更自然，同时保持引语的直率。
- source_word: κακὰ θηρία
  choice: 恶兽
  rationale: 保留θηρία的野兽意象和κακά的道德贬义，不将其弱化为较中性的“凶猛动物”。
- source_word: γαστέρες ἀργαί
  choice: 好吃懒做的人
  rationale: 原文字面是“懒惰的肚腹”，以肚腹代指只顾吃喝而不劳作的人；“好吃懒做的人”在现代汉语中自然传达这一辱骂性比喻。
theological_decisions:
- issue: 如何处理保罗所引用的族群贬抑性说法
  choice: 明确保留为当地先知所说的引语，并如实译出其尖锐措辞
  alternative: 为减轻族群刻板印象而弱化或改写措辞
  rationale: 原文明确把这句话作为“他们自己的先知”的话来引用。译文不应淡化其修辞力度，也不应越过本节，把引语解释成关于所有克里特人的普遍教义判断。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“恶兽”保留引语的强烈比喻；“好吃懒做的人”使“懒惰的肚腹”这一闪族式或古代地中海语境中的身体隐喻为普通读者所理解。
