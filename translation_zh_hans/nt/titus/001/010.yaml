  text: Εἰσὶν γὰρ πολλοὶ ⸀καὶ ἀνυπότακτοι, ματαιολόγοι καὶ φρεναπάται, μάλιστα οἱ ἐκ ⸀τῆς περιτομῆς,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/010.yaml
  text: For there are many rebellious people[a], empty talkers and deceivers, especially those of the circumcision,
translation:
  language: zh_hans
  text: 因为有许多不受约束、说空话、迷惑人心的人，尤其是那些属割礼的人[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“那些属于割礼群体的人”或“那些出自受割礼者当中的人”。这句话很可能指犹太人或主张受割礼的反对者，但希腊原文没有说得这样明确。
    reason: 保留 οἱ ἐκ τῆς περιτομῆς 在群体归属及具体历史所指上的含混性。
lexical_decisions:
- source_word: γὰρ
  choice: 因为
  rationale: 承接上文，说明长老必须能劝勉并驳斥反对者的原因；“因为”自然保留其解释性连接。
- source_word: πολλοὶ καὶ ἀνυπότακτοι
  choice: 有许多人不服管束
  rationale: ἀνυπότακτοι 在此作描述人的形容词，指不肯服从正当权柄的人；译文补出“人”，符合现代汉语表达。καί 在此串联后续特征，汉语中不必机械译为“也”。
- source_word: ματαιολόγοι
  choice: 说空话
  rationale: 该复合词指言谈空洞、无益的人；“说空话”通俗自然，同时保留原文的负面判断。
- source_word: φρεναπάται
  choice: 迷惑人心
  rationale: 该词含欺骗、误导心思之意；“迷惑人心”比笼统的“骗子”更能体现其涉及思想判断的语义。
- source_word: μάλιστα
  choice: 尤其
  rationale: 突出上述众人中的一个特定群体，简洁自然。
- source_word: οἱ ἐκ τῆς περιτομῆς
  choice: 那些奉割礼的人
  rationale: 原意为“那些出于／属于割礼的人”；“奉割礼的人”在现代汉语中较自然，又未明确增添“派”或直接等同于所有犹太人。
theological_decisions:
- issue: “那些出于割礼的人”的具体所指
  choice: 正文译作“那些奉割礼的人”，不明确称其为“割礼派”或“犹太人”。
  alternative: 那些属于割礼派的人；那些犹太背景的人
  rationale: 此短语很可能指犹太人或主张割礼的犹太化反对者，但希腊文没有明说“派”，也不宜扩大为对所有犹太人的概称；正文保留较宽的指涉，脚注说明可能理解。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“不服管束”传达拒绝顺服权柄；“说空话，迷惑人心”用并列动词短语，使三个描述自然顺畅。末尾保留逗号，以配合本节在后文继续展开的句法。
