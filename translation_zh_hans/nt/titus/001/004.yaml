  text: Τίτῳ γνησίῳ τέκνῳ κατὰ κοινὴν πίστιν· χάρις ⸀καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς καὶ ⸂Χριστοῦ Ἰησοῦ⸃ τοῦ σωτῆρος ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/004.yaml
  text: 'To Titus[b][a], my true child according to our common faith: grace and peace from God the Father and Messiah Jesus our Savior.'
translation:
  language: zh_hans
  text: 写信给提多：按我们共同的信仰[a]说，是我真正的孩子。愿恩典和平安从父神和我们的救主弥赛亚耶稣[b]临到你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“共享的信仰”。
    reason: lexical_alternative
  - marker: b
    text: “弥赛亚”传统上常译作“基督”；希腊文为Χριστοῦ Ἰησοῦ，直译为“弥赛亚耶稣”。
    reason: alternative_reading
lexical_decisions:
- source_word: γνησίῳ τέκνῳ
  choice: 真正的孩子
  rationale: γνήσιος在属灵亲子关系中表示真实、名副其实；τέκνον本义为“孩子”，不必因提多是男性而把名词本身窄化为“儿子”。
- source_word: κατὰ κοινὴν πίστιν
  choice: 在我们共同的信仰上
  rationale: κατά在这里表达关系或依据，κοινή表示共同拥有；中文补出“我们”，使保罗与提多共享信仰的关系自然明白。
- source_word: χάρις καὶ εἰρήνη
  choice: 恩典和平安
  rationale: 保留保罗书信问安中两个并列的祝福用语。
- source_word: θεοῦ πατρὸς
  choice: 父神
  rationale: 原文没有在“父”之后使用“我们的”，所以译作“父神”，避免增译为“我们的父神”。
- source_word: Χριστοῦ Ἰησοῦ
  choice: 弥赛亚耶稣
  rationale: Χριστός在此保有称号含义；“弥赛亚”传达“受膏者”的身份，而不只把该词作为音译姓名处理。
- source_word: σωτῆρος ἡμῶν
  choice: 我们的救主
  rationale: 该带冠词的同位语紧接“弥赛亚耶稣”，自然将耶稣称为“我们的救主”。
theological_decisions:
- issue: Χριστός在“Χριστοῦ Ἰησοῦ”中的译法
  choice: 弥赛亚耶稣
  alternative: 基督耶稣
  rationale: 译出称号的语义，同时以脚注保留中文传统译法；不把称号悄然当作单纯姓名。
- issue: “我们的救主”的所指
  choice: 修饰并指认弥赛亚耶稣
  alternative: 宽泛理解为与前面并列来源整体相关
  rationale: τοῦ σωτῆρος ἡμῶν直接跟在Χριστοῦ Ἰησοῦ之后，句法上最自然地是其同位说明。
translation_notes:
  register: 采用现代、庄重而易懂的书信体。原文问安句没有明说动词，中文补入“愿……临到你”以自然表达祝愿；“真正的孩子”保留属灵亲子比喻及τέκνον较宽泛的词义。
