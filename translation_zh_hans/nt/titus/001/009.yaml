  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἀντεχόμενον τοῦ κατὰ τὴν διδαχὴν πιστοῦ λόγου, ἵνα δυνατὸς ᾖ καὶ παρακαλεῖν ἐν τῇ διδασκαλίᾳ τῇ ὑγιαινούσῃ καὶ τοὺς ἀντιλέγοντας ἐλέγχειν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/009.yaml
  text: holding firmly to the trustworthy word in accordance with the teaching[b][a], so that he may be able both to exhort by sound teaching and to rebuke those who contradict it.
translation:
  language: zh_hans
  text: 坚守那合乎教导的可信信息[a]，好使他既能用健全的教导劝勉人，也能驳斥[b]那些反对的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“坚守那按着教导的可信信息。”
    reason: 原文短语可较直译为“按着教导的可信信息”；κατά在此表示合乎或依照，并不表示“来自”。
  - marker: b
    text: 或译：“指出那些反对之人的错误”或“责备”。原文动词既可指揭露、证明对方有错，也可指责备纠正。
    reason: 保留ἐλέγχειν在驳斥、揭错与责备之间的语义幅度。
lexical_decisions:
- source_word: ἀντεχόμενον
  choice: 坚守
  rationale: 表达持续、坚定地持守，既保留主动执着的意味，也符合教会领袖资格的语境。
- source_word: πιστοῦ λόγου
  choice: 可信之道
  rationale: πιστός在此主要表示可靠、可信；λόγος指所传的信息。“可信之道”简洁庄重，并保留其作为教导内容的意味。
- source_word: κατὰ τὴν διδαχήν
  choice: 符合教导的
  rationale: κατά加宾格表示依照、符合；定冠词表明这是已知、受认可的教导。
- source_word: παρακαλεῖν
  choice: 劝勉
  rationale: 既可包含鼓励，也可包含郑重劝告；“劝勉”适合牧养和教导语境，且不局限于安慰。
- source_word: ἐν τῇ διδασκαλίᾳ τῇ ὑγιαινούσῃ
  choice: 用健全的教导
  rationale: 保留ὑγιαίνω“健康、健全”的比喻意义；ἐν在此自然表达凭借或借着这种教导。
- source_word: ἀντιλέγοντας
  choice: 那些反对的人
  rationale: 该分词指说话反驳或抵触教导的人；原文未明说宾语，因此不在正文中补出“反对它”。
- source_word: ἐλέγχειν
  choice: 驳斥
  rationale: 语境涉及面对出言反对者，“驳斥”突出揭明其错误、证明其站不住脚的一面；脚注保留责备、指出错误的语义范围。
- source_word: δυνατὸς ᾖ
  choice: 好使他……能
  rationale: 自然呈现ἵνα引出的目的，并准确表达具备能力。
theological_decisions:
- issue: “教导”与“可信之道”的所指
  choice: 将二者呈现为已受认可并彼此一致的基督信仰教导
  alternative: 泛指一般性的道德训诲
  rationale: διδαχή带定冠词，且“可信之道”在教牧书信语境中指向稳定、可传授的信息；译文不进一步套用后世教义术语。
- issue: ἐλέγχειν对反对者所采取的行动
  choice: 正文译为“驳斥”，侧重揭明并证明错误
  alternative: 责备；指出错误
  rationale: 该动词兼有揭露、证明有错和责备纠正的含义；因对象是“反对的人”，“驳斥”贴合论辩语境，同时以脚注保留其牧养纠正的力度。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“坚守”“劝勉”“健全的教导”适合教会领袖资格的劝诫语境；避免使用过度技术化的宗派术语。
