id: TIT.1.16
reference: Titus 1:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: θεὸν ὁμολογοῦσιν εἰδέναι, τοῖς δὲ ἔργοις ἀρνοῦνται, βδελυκτοὶ ὄντες καὶ ἀπειθεῖς καὶ πρὸς πᾶν ἔργον ἀγαθὸν ἀδόκιμοι.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/016.yaml
  text: They profess to know God[a], but by their works they deny him[d][c][b], being detestable and disobedient and unfit for every good work.
translation:
  language: zh_hans
  text: 他们自称认识神[a]，却在行为上否认他[b]；他们是可憎[c]、不顺服的，对于任何善事都不合格[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们承认自己认识神。”
    reason: ὁμολογοῦσιν既可表示“承认、宣认”，也可在本处语境中表达“声称、自称”。
  - marker: b
    text: 或译：“所做的事却否认他。”
    reason: ἔργοις可译为“行为”或“所做的事”。
  - marker: c
    text: 或译：“令人厌恶。”
    reason: βδελυκτοί表示强烈的可憎、令人厌恶。
  - marker: d
    text: 或译：“在各样善事上都经不起考验。”
    reason: ἀδόκιμοι本可指未通过检验、不获认可；此译法较直接保留该词的检验意象。
lexical_decisions:
- source_word: θεὸν
  choice: 神
  rationale: 作“认识”的宾语；“神”是现代汉语圣经语境中直接、自然的对应词。
- source_word: ὁμολογοῦσιν
  choice: 自称
  rationale: 本词可指承认、宣认或声称；这里与实际行为形成鲜明对照，“自称”自然表达他们口头上的宣称，同时不替文本断定其内心是否真诚。
- source_word: εἰδέναι
  choice: 认识
  rationale: 直接表达对神有所认识，不把这种“认识”扩展解释为得救、相交或仅有知识。
- source_word: τοῖς δὲ ἔργοις
  choice: 行为却
  rationale: 与前半句的口头宣称相对；希腊语与格可表示凭借或体现这种否认的方式，“行为却”在汉语中简洁自然。
- source_word: ἀρνοῦνται
  choice: 否认他
  rationale: 承接前句的“神”为宾语，保留口头承认与实际否认之间的强烈张力。
- source_word: βδελυκτοὶ
  choice: 可憎
  rationale: 表达强烈的道德厌恶，语气庄重而不古奥。
- source_word: ἀπειθεῖς
  choice: 不顺服
  rationale: 在伦理语境中表示拒绝服从；不将其弱化为单纯的“不相信”或“未被说服”。
- source_word: πρὸς πᾶν ἔργον ἀγαθὸν
  choice: 做任何善事
  rationale: πρός在这里表达相对于善事的适合程度；“任何”保留πᾶν的全面范围。
- source_word: ἀδόκιμοι
  choice: 都不合格
  rationale: 表示未能通过检验、达不到认可标准；“不合格”清楚表达这种判断，又避免译成“没有资格”而暗示外在禁令。
theological_decisions:
- issue: 口头宣称认识神与行为否认神之间的关系
  choice: 译为“自称认识神，行为却否认他”，让行为本身构成对其口头宣称的反证。
  alternative: 可把后半句理解为他们的行为否认关于神的真理，而不直接否认神自己。
  rationale: 第二分句没有明说宾语，但最自然地承接第一分句的“神”。译文保留经文所呈现的伦理和神学张力，不进一步界定这种“认识”的性质。
- issue: ἀδόκιμοι所表达的审判或资格含义
  choice: 译为“做任何善事都不合格”。
  alternative: 可译为“在各样善事上都经不起考验”或“不能胜任任何善事”。
  rationale: 原词指经检验后不获认可。译文保留其负面评定，却不擅自说明是谁进行检验，也不把它扩大为关于人完全无力行善的系统性论断。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“自称……行为却……”形成清晰对照；末句以并列短句呈现希腊文三个谓语形容词。保留“可憎”的严厉语气，并用“不顺服”“不合格”等当代常用词，避免过度古雅或引入宗派性解释。
