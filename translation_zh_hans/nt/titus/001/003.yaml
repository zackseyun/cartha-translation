  text: ἐφανέρωσεν δὲ καιροῖς ἰδίοις, τὸν λόγον αὐτοῦ ἐν κηρύγματι ὃ ἐπιστεύθην ἐγὼ κατ’ ἐπιταγὴν τοῦ σωτῆρος ἡμῶν θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/003.yaml
  text: but in his own times he revealed his word through the proclamation with which I was entrusted[a], according to the command of God our Savior[c][b],
translation:
  language: zh_hans
  text: 但在他自己所定的时期[a]，他借着宣讲[b]显明了他的话；这宣讲是照着上帝、我们的救主的命令托付给我的[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“在他自己的时期”；也可译“在适当的时期”，指上帝所安排的时机。
    reason: lexical_alternative
  - marker: b
    text: “宣讲”也可理解为“所宣讲的信息”。原词既可指宣讲的行动，也可指宣讲的内容。
    reason: lexical_alternative
  - marker: c
    text: 关系从句也可能修饰“他的话”，意为：“他的话……是托付给我的。”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐφανέρωσεν
  choice: 显明了
  rationale: 不定过去时主动直说语气；承接上文，以上帝为隐含主语。“显明”保留使原先未公开之事显露出来的含义，也符合庄重而自然的现代汉语。
- source_word: καιροῖς ἰδίοις
  choice: 到了他自己所定的时期
  rationale: καιρός侧重特定、合宜的时机，ἰδίοις保留“属于他自己”的意味；补出“所定”使中文自然，并表达这些时期由上帝安排，而不是偶然到来。
- source_word: τὸν λόγον αὐτοῦ
  choice: 他的话
  rationale: λόγος在此指上帝传达的信息，与上下文中的应许和福音相关；“他的话”既保留核心词义，也不过度限定为某一种神学术语。
- source_word: ἐν κηρύγματι
  choice: 借着宣讲
  rationale: ἐν在此可表达媒介或方式；κήρυγμα既可指宣讲的行动，也可指所宣讲的信息。“宣讲”在中文中保留这两方面的可能。
- source_word: ὃ
  choice: 这宣讲
  rationale: 中性单数关系代词在近距离句法上最自然地回指中性名词κήρυγμα。中文另起分句并重复“这宣讲”，清楚表达所选句法关系，同时以脚注保留回指“他的话”的可能。
- source_word: ἐπιστεύθην
  choice: 托付给我的
  rationale: πιστεύω的不定过去时被动在此表示受托承担某事，并非“我相信”；“托付给我”自然表达保罗受命管理和传扬这信息。
- source_word: κατ’ ἐπιταγὴν
  choice: 照着……的命令
  rationale: κατά加宾格表示依据或遵照权威指令；此译法准确保留受托宣讲是以上帝的命令为根据。
- source_word: τοῦ σωτῆρος ἡμῶν θεοῦ
  choice: 我们的救主上帝
  rationale: 将σωτῆρος与θεοῦ按同位关系理解，表达“上帝就是我们的救主”，并采用现代中文圣经语体中自然、庄重的次序。
theological_decisions:
- issue: ἐφανέρωσεν的隐含主语及καιροῖς ἰδίοις的所属意味
  choice: 以上帝为主语，译作“到了他自己所定的时期，他……显明了”。
  alternative: 采用非人称表达，如“到了适当的时候，这事被显明了”。
  rationale: 上文谈到不说谎的上帝在万古以前所作的应许，此处自然继续以上帝为行动者；这样也保留ἰδίοις的所属意味。
- issue: 关系代词ὃ的先行词
  choice: 主要理解为回指“宣讲”（κήρυγμα）。
  alternative: 理解为回指“他的话”（τὸν λόγον αὐτοῦ），即“他的话……是托付给我的”。
  rationale: κήρυγμα是最近且性数相合的先行词，而ἐπιστεύθην也自然表示某项宣讲使命被托付给保罗；不过语义上“他的话”同样可能是受托内容，因此用脚注明示另一种句法理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。用分号展开希腊文较紧密的关系从句，使“受托”与“照着命令”的关系清楚，同时不消除关系代词先行词的真实歧义；所有异读均以紧邻相关措辞的脚注标记保留。
