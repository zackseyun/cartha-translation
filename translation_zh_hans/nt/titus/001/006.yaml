  text: εἴ τίς ἐστιν ἀνέγκλητος, μιᾶς γυναικὸς ἀνήρ, τέκνα ἔχων πιστά, μὴ ἐν κατηγορίᾳ ἀσωτίας ἢ ἀνυπότακτα.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/006.yaml
  text: if anyone is above reproach[a], the husband of one wife[c][b], having faithful children not under accusation of debauchery or insubordinate.
translation:
  language: zh_hans
  text: 若有人无可指责，作一个妻子的丈夫[a]，有忠信的儿女[b]；这些儿女没有被指控生活放荡，也不悖逆。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“对一位妻子忠贞的男人。”
    reason: lexical_alternative
  - marker: b
    text: “忠信”也可译作“信主”。希腊语πιστά可指忠诚可靠，也可指相信、信主。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνέγκλητος
  choice: 无可指责
  rationale: 表达没有正当把柄可供控告，并不暗示绝对无罪或毫无缺点；也符合教会职分资格的语境。
- source_word: μιᾶς γυναικὸς ἀνήρ
  choice: 一个妻子的丈夫
  rationale: 尽量透明地保留希腊语的男性特指和字面结构，不预先裁定该短语涉及婚姻状况、贞忠或再婚等问题。
- source_word: τέκνα
  choice: 儿女
  rationale: 在家庭语境中自然、通行，也不限定孩子的性别。
- source_word: πιστά
  choice: 忠信
  rationale: πιστά在此既可能指忠诚可靠，也可能指信主；正文采用较宽泛的“忠信”，脚注保留另一可能。
- source_word: ἐν κατηγορίᾳ ἀσωτίας
  choice: 被指控生活放荡
  rationale: 既保留κατηγορία的控告意味，也以现代汉语自然表达ἀσωτία所指的挥霍、失控而不检点的生活。
- source_word: ἀνυπότακτα
  choice: 悖逆
  rationale: 表达不服管束、不肯顺从应有秩序，在家庭权柄语境中比“无纪律”更准确自然。
theological_decisions:
- issue: τέκνα πιστά中πιστά的含义
  choice: 儿女忠信
  alternative: 儿女信主
  rationale: 该词在此可指品行忠诚可靠，也可指具有信仰。正文不把争议限定为子女必须信主，脚注明确保留这一解释。
- issue: μιᾶς γυναικὸς ἀνήρ的指向
  choice: 一个妻子的丈夫
  alternative: 对妻子忠贞的男人
  rationale: 采用形式透明的译法，避免把有争议的资格短语直接解释为只针对一夫多妻、婚姻忠贞、未婚资格或再婚问题中的任何一种立场。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“无可指责”“一个妻子的丈夫”保留资格条文的凝练语气；“被指控生活放荡”使控告关系清楚。脚注标记均在正文中出现。
