id: TIT.1.5
reference: Titus 1:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Τούτου χάριν ⸀ἀπέλιπόν σε ἐν Κρήτῃ ἵνα τὰ λείποντα ἐπιδιορθώσῃ, καὶ καταστήσῃς κατὰ πόλιν πρεσβυτέρους, ὡς ἐγώ σοι διεταξάμην,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/005.yaml
  text: For this reason I left you in Crete[a], so that you might set in order what remained and appoint elders in every city[c][b], as I directed you.
translation:
  language: zh_hans
  text: 为此，我把你留在克里特，好让你把尚未办妥的事整顿好[a]，并在各城[b]设立长老，正如我曾吩咐你的那样[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把所缺欠的整顿好。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“逐城。”
    reason: lexical_alternative
  - marker: c
    text: 或译：“正如我曾命令你的那样。”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τούτου χάριν
  choice: 为此
  rationale: 简洁自然地表达原因与目的之间的承接关系，保留原文解释前事的语气。
- source_word: ἀπέλιπόν
  choice: 我把你留在
  rationale: 准确表达保罗将提多留在克里特的行动；中文无需额外加入可能带有强调意味的“留下来”。
- source_word: ἐν Κρήτῃ
  choice: 在克里特
  rationale: 按现代汉语通行译名处理该岛名，并保留地点含义。
- source_word: ἵνα
  choice: 好让
  rationale: 自然地引出保罗留下提多的目的，同时明确保留原文的目的关系。
- source_word: τὰ λείποντα
  choice: 尚未办妥的事
  rationale: 该短语既可侧重仍然遗留、未完成之事，也可侧重有所欠缺；正文采用“尚未办妥”以贴合后接“整顿好”的语境，并在脚注保留另一可能。
- source_word: ἐπιδιορθώσῃ
  choice: 整顿好
  rationale: 兼顾纠正、整理并使之完善的含义，且符合现代中文表达。
- source_word: καταστήσῃς
  choice: 设立
  rationale: 在教会职分语境中表示任命或安置人担任某项职责；“设立”庄重自然，又不过度预设具体任职程序。
- source_word: κατὰ πόλιν
  choice: 在各城
  rationale: 清楚表达κατά加单数名词的逐一分配含义；脚注保留更贴近形式的“逐城”。
- source_word: πρεσβυτέρους
  choice: 长老
  rationale: 上下文所指是获认可的教会带领者，而不只是年长男性；“长老”是现代中文圣经及教会语境中清楚而通行的对应词。
- source_word: ὡς ἐγώ σοι διεταξάμην
  choice: 正如我吩咐你的
  rationale: 表达保罗曾给予提多具有权威性的指示；“吩咐”兼具权威与自然语气，不必在正文中过度强化为“命令”。
theological_decisions:
- issue: πρεσβυτέρους所指的教会职分
  choice: 译作“长老”，不加入后世宗派体制的具体内涵
  alternative: 司祭；年长者
  rationale: 本节涉及教会中受认可的带领职分，但原文并未在此详细界定其后世制度形态。“长老”既符合词义和上下文，也避免预断不同教会治理传统之间的争论。
- issue: διεταξάμην的权威强度
  choice: 正文译作“吩咐”
  alternative: 命令；指示
  rationale: 该动词可表示权威性的安排或命令。“吩咐”保留使徒对提多的权威，同时不把语气限定为最强烈的“命令”；脚注列出该可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“尚未办妥的事整顿好”保留未完成与需要纠正整理的双重意味；“设立长老”使用通行教会术语，却不引入特定宗派的治理结构。脚注标记均置于正文中相应词句之后。
