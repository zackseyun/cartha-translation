  text: ἐπ’ ἐλπίδι ζωῆς αἰωνίου, ἣν ἐπηγγείλατο ὁ ἀψευδὴς θεὸς πρὸ χρόνων αἰωνίων
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/002.yaml
  text: in the hope of eternal life[a], which the God who does not lie promised before the ages began
translation:
  language: zh_hans
  text: 怀着永生的盼望；这永生就是那不说谎的神在万世以前[a]所应许的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在时间开始以前。”希腊文直译为“在永恒的／历世的时间以前”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπ’ ἐλπίδι
  choice: 怀着……盼望
  rationale: ἐπί加与格在这里可表示所处的情形、范围或依据。“怀着……盼望”符合现代汉语表达，也保留了使徒职分与此盼望相关的含义，不把介词关系过度限定为因果或目的。
- source_word: ζωῆς αἰωνίου
  choice: 永生
  rationale: 属格自然表达盼望的内容或对象。“永生”是清楚、简洁且有新约语境共鸣的现代汉语译法。
- source_word: ἣν
  choice: 这永生
  rationale: 阴性单数关系代词最自然地回指阴性名词ζωή（生命），而不是ἐλπίς（盼望）；在汉语中明说“这永生”可避免指代含混。
- source_word: ἐπηγγείλατο
  choice: 所应许的
  rationale: 准确表达ἐπαγγέλλομαι不定过去时的承诺含义；汉语无需另行表现其中间语态形式。
- source_word: ὁ ἀψευδὴς θεὸς
  choice: 不说谎的神
  rationale: 直接传达ἀψευδής“不会说假话、诚实”的基本词义，表达自然，并避免用“不能说谎”强化为原形容词未明确陈述的能力命题。
- source_word: πρὸ χρόνων αἰωνίων
  choice: 在万世开始以前
  rationale: 既保留πρό的先于关系，也以自然汉语传达χρόνοι αἰώνιοι所指历世、万世的时间概念；不把它直接解释为某种特定的形而上学时间观。
theological_decisions:
- issue: πρὸ χρόνων αἰωνίων所表达的时间及神的应许
  choice: 在万世开始以前
  alternative: 在时间开始以前；从亘古以来
  rationale: 原文把应许置于万世以前，却没有说明应许的对象或其形而上学机制。正文保留这一先于万世的时间陈述，不裁定这是三一内部的应许、神的预旨，还是其他神学解释。
- issue: ἀψευδής对神的描述
  choice: 不说谎的神
  alternative: 不能说谎的神；信实的神
  rationale: “不说谎”贴近该形容词的直接含义；“不能说谎”可能加入能力层面的断言，“信实”则可能淡化原文对虚假的明确否定。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。因本节语法承接第1节，开头保留分句性质；以“这永生”明确关系代词的先行词。脚注标在其实际解释的时间短语之后。
