- from: 不听信犹太人的荒诞传说，也不听从那些背弃真理之人的规条。[a]
  to: 不去理会犹太人的神话传说和背弃真理之人的命令。[a]
  rationale: 修订以“不去理会”统一表达μὴ προσέχοντες，避免把原文一个“留意”的动作扩展为“相信”与“服从”两种动作。以“神话传说”对应μῦθος，避免“荒诞”造成不必要的强化；保留“背弃真理之人的命令”，使属格分词与“人”的修饰关系清楚可见。
