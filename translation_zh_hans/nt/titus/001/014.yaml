  text: μὴ προσέχοντες Ἰουδαϊκοῖς μύθοις καὶ ἐντολαῖς ἀνθρώπων ἀποστρεφομένων τὴν ἀλήθειαν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/014.yaml
  text: not paying attention to Jewish myths and commandments of people who turn away from the truth[a].
translation:
  language: zh_hans
  text: 不去理会犹太人的神话传说和背弃真理之人的命令。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不专注于犹太人的神话传说和背弃真理之人的命令。”
    reason: “专注于”较直接地表达προσέχω“将心思投向、留意”的含义；“命令”是ἐντολή的自然译法。
lexical_decisions:
- source_word: μὴ προσέχοντες
  choice: 不听信……也不听从
  rationale: 该现在分词承接上文的劝勉，表示不可把注意力和信从投向这些事物。依照两个宾语的自然搭配，分别译作“不听信”和“不听从”，既传达持续留意、依从的含义，也使现代汉语流畅。
- source_word: Ἰουδαϊκοῖς μύθοις
  choice: 犹太人的荒诞传说
  rationale: μῦθος在此指虚构、失实而不可信的故事；“荒诞传说”比仅用“神话”更能避免让现代读者误以为这是中性的传统神话分类。Ἰουδαϊκοῖς表明这些传说具有犹太背景或性质。
- source_word: ἐντολαῖς ἀνθρώπων
  choice: 人的规条
  rationale: ἐντολή可指命令、诫命或规条；此处与真理形成对照，强调其人为来源。“人的规条”贴近原文，又不会误解为仅指男性所定的命令。
- source_word: ἀποστρεφομένων
  choice: 背弃
  rationale: 该词描绘从某对象转离；“背弃真理”保留主动离弃、拒绝真理的力度，并符合庄重自然的现代汉语。
- source_word: τὴν ἀλήθειαν
  choice: 真理
  rationale: 按通常用法直译为“真理”，不把它进一步限定为某一教义表述，从而保留原文范围。
theological_decisions:
- issue: 属格分词ἀποστρεφομένων所修饰的对象
  choice: 理解为修饰紧邻的ἀνθρώπων，即“那些背弃真理之人的规条”
  alternative: 较宽泛地理解为犹太传说和人的规条都与背弃真理者相关
  rationale: 分词与ἀνθρώπων同为属格复数，语法上最自然地修饰“人”。译文明确这种连接，但不额外断言这些传说的具体作者或来源。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“不听信……也不听从”按汉语搭配处理同一个希腊分词支配两个不同宾语的结构；脚注保留较形式对应的译法。主文脚注标记[a]已完整出现。
