  text: οὓς δεῖ ἐπιστομίζειν, οἵτινες ὅλους οἴκους ἀνατρέπουσιν διδάσκοντες ἃ μὴ δεῖ αἰσχροῦ κέρδους χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/011.yaml
  text: They must be silenced[c][b][a], since they are upsetting whole households by teaching what they ought not for the sake of shameful gain.
translation:
  language: zh_hans
  text: 必须使他们住口[a]，因为他们为了可耻的利益，教导不该教的事，正在扰乱整个家户[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“必须制止他们。”原文直译为“必须堵住他们的口”。
    reason: lexical_alternative
  - marker: b
    text: “家户”指整个家庭单位，包括家人及家中的从属成员，不只是房屋建筑。
    reason: cultural_note
lexical_decisions:
- source_word: οὓς δεῖ ἐπιστομίζειν
  choice: 这些人的口必须堵住
  rationale: 保留ἐπιστομίζειν“堵住嘴、使不能再说”的形象和δεῖ所表达的必要性；结合上文，用“这些人”明确所指，同时不引入具体的强制手段。
- source_word: οἵτινες
  choice: 他们……竟
  rationale: 该关系代词承接前述对象，并带有说明其为何必须被制止的意味；汉语通过分号和后句的陈述自然表达这一解释关系，“竟”也体现其行为的严重性。
- source_word: ὅλους οἴκους
  choice: 许多家庭全都
  rationale: οἴκους在此更可能指家庭或家户，而非建筑物；ὅλους修饰各个家户的整体。“许多”由复数在汉语中自然体现，但不把范围扩大为所有家庭。
- source_word: ἀνατρέπουσιν
  choice: 使……混乱了
  rationale: 该词有推翻、颠覆、扰乱之意；“使……混乱”表达家庭整体被严重搅扰，却不武断地解释为彻底毁灭。
- source_word: διδάσκοντες ἃ μὴ δεῖ
  choice: 教导不该教的事
  rationale: 自然表达分词所说明的手段，以及ἃ μὴ δεῖ所含“不应当教”的规范性判断。
- source_word: αἰσχροῦ κέρδους χάριν
  choice: 为了可耻的利益
  rationale: 保留αἰσχροῦ对所得及其动机的道德谴责；κέρδος可指利益或获利，原文未限定具体形式，故不窄化为金钱。
theological_decisions:
- issue: 制止假教师的命令具有何种性质
  choice: 这些人的口必须堵住
  alternative: 必须使这些人闭口
  rationale: 译文保留原文“堵住口”的强烈比喻和“必须”的约束力，但不补入原文未说明的民事、身体或惩罚性手段。
- issue: 可耻之“利”的具体性质
  choice: 可耻的利益
  alternative: 不义之财
  rationale: κέρδος常涉及获利，却未必只指金钱；采用较宽的“利益”以保存原文范围，也避免将其直接等同于某一特定法律或教义范畴。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“口必须堵住”有意保留希腊文的形象；后文调整为自然汉语语序，先交代动机和手段，再说明对家庭造成的结果。
