- from: 这些人的口必须堵住[a]；他们为了可耻的利益，教导不该教的事，竟使许多家庭全都混乱了[b]。
  to: 必须使他们住口[a]，因为他们为了可耻的利益，教导不该教的事，正在扰乱整个家户[b]。
  rationale: 修订保留δεῖ的必要性和ἐπιστομίζειν“堵住口”的比喻，同时以自然的现代汉语表达。删除“许多”和“竟”，并将完成式“混乱了”改为持续性的“正在扰乱”，从而更准确反映ὅλους οἴκους及现在时ἀνατρέπουσιν。
