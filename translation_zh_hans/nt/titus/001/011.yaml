  source_fidelity: 译文总体传达了必须制止这些人、其教导扰乱家户、动机为可耻之获利等核心含义。但“许多家庭全都”将原文的复数泛指及“每一整个家户”的表达处理得不够准确；“混乱了”也把现在时的持续行动译成了完成结果。
  naturalness: “这些人的口必须堵住”可以理解，但现代汉语中“必须使他们住口”更自然，也保留原文“堵住口”的比喻。“整个家户”能准确指向社会单位，并可由注释说明。
  terminology: “可耻的利益”可保留，涵盖κέρδος的获利/利益范围而不局限于金钱。“家户”比单纯“家庭”更适合οἶκος在本节所指的家庭单位及其成员。
  issues:
  - severity: medium
    issue: “许多家庭全都”未准确对应ὅλους οἴκους。
    rationale: 原文强调被扰乱的是“整个家户”，复数并不要求译为“许多”；“许多……全都”在汉语中也容易产生范围不清的读法。
  - severity: low
    issue: “使……混乱了”将现在时ἀνατρέπουσιν译为完成状态。
    rationale: 该动词是现在时，描述他们持续进行的扰乱；译为“正在扰乱”更贴切。
  - severity: low
    issue: “竟”增加了原文未明说的感叹/出乎意料色彩。
    rationale: οἵτινες在此说明为何必须制止他们，可译出因果或说明关系，无须加入“竟”。
  revised_text: 必须使他们住口[a]，因为他们为了可耻的利益，教导不该教的事，正在扰乱整个家户[b]。
