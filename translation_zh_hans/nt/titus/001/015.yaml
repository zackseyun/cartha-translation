id: TIT.1.15
reference: Titus 1:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ⸀πάντα καθαρὰ τοῖς καθαροῖς· τοῖς δὲ μεμιαμμένοις καὶ ἀπίστοις οὐδὲν καθαρόν, ἀλλὰ μεμίανται αὐτῶν καὶ ὁ νοῦς καὶ ἡ συνείδησις.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/015.yaml
  text: All things are pure to the pure; but to those who are defiled and unbelieving[a], nothing is pure. Instead, both their mind and their conscience are defiled.
translation:
  language: zh_hans
  text: 对洁净的人来说，一切都是洁净的；但对那些被玷污而不信的人来说，没有什么是洁净的。相反，他们的心思和良心都被玷污了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντα
  choice: 一切
  rationale: 中性复数在此具有概括性；“一切”简洁自然，并保留格言式表达的广泛范围。
- source_word: καθαρά / καθαρόν / καθαροῖς
  choice: 纯洁的／纯洁
  rationale: καθαρός兼有礼仪上洁净与道德上纯洁的意味。“纯洁”在现代汉语中较能保留两方面的共鸣；各处统一译法也维持原文的反复与对照。
- source_word: τοῖς δὲ μεμιαμμένοις
  choice: 对那些被玷污……的人来说
  rationale: 完成时分词强调因先前的玷污而处于被玷污的状态；此译法既自然，也保留其状态意味。
- source_word: ἀπίστοις
  choice: 不信的人
  rationale: 此处主要指不信，而非一般意义上的不忠；“不信的人”清楚而不过度解释其对象。
- source_word: οὐδὲν καθαρόν
  choice: 没有什么是纯洁的
  rationale: 与前句“一切都是纯洁的”形成直接对应，并保留原文的谓语结构。
- source_word: ἀλλὰ
  choice: 相反
  rationale: 标明强烈转折，并把焦点由外在事物转向这些人内在的心思和良知。
- source_word: μεμίανται
  choice: 被玷污了
  rationale: 完成时形式表达已经造成且持续存在的状态；“被玷污了”在汉语中兼顾结果与现状，并呼应前面的分词。
- source_word: νοῦς
  choice: 心思
  rationale: 指思想、理解和判断的能力；“心思”自然且适合本句与“良知”并列。
- source_word: συνείδησις
  choice: 良知
  rationale: 指人的道德自觉与内在判断能力；“良知”是现代汉语中准确、通行的对应词。
- source_word: καὶ ... καὶ
  choice: 连……和……也都
  rationale: 突出心思与良知两者均受玷污；这一结构在汉语中自然表达原文成对的强调。
theological_decisions:
- issue: 纯洁／洁净用语的范围
  choice: 全节统一译作“纯洁”，保留礼仪与道德两方面的含义。
  alternative: 全节译作“洁净”，更突出礼仪性的洁净范畴。
  rationale: 上下文涉及犹太人的规条及有关洁净的关注，但本句又明确延伸到人的心思与良知。“纯洁”较能保留这种范围和张力，不把经文限定为礼仪问题。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“对……来说”清楚呈现两个与格短语的视角对照；重复“纯洁”和“玷污”以保存原文的修辞联系。未加脚注，因为正文统一用词已能保留关键语义张力。
