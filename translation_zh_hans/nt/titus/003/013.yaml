  text: Diligently send Zenas the lawyer and Apollos on their way[a], so that they may lack nothing.
translation:
  language: zh_hans
  text: 你要尽力帮助通晓法律的西纳和亚波罗上路[a]，使他们一无所缺。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你要尽力为通晓法律的西纳和亚波罗的旅程提供帮助。”原文动词可包括送行并供应旅途所需，不只是让他们离开。
    reason: lexical_alternative
lexical_decisions:
- source_word: ζηνᾶν
  choice: 西纳
  rationale: 按现代中文圣经人名的通行译法音译该专名。
- source_word: τὸν νομικὸν
  choice: 律师
  rationale: νομικός可指精通法律的人；此处作为西纳的同位称谓，译作“律师”简洁自然，也符合本段旅行安排的语境。若理解为犹太律法专家，也可能译作“律法师”，但上下文不足以确定这一专门含义。
- source_word: Ἀπολλῶν
  choice: 亚波罗
  rationale: 采用现代中文圣经中此人名的通行音译。
- source_word: σπουδαίως
  choice: 尽心
  rationale: 该副词表示认真、热切并用心办理；“尽心”在命令句中自然庄重，且不把意思局限为速度上的“赶快”。
- source_word: πρόπεμψον
  choice: 帮助……上路
  rationale: προπέμπω在旅行语境中常包含为旅客送行并提供实际所需的意思；此译法比单纯的“送走”更能表达支援旅程的含义。
- source_word: ἵνα μηδὲν αὐτοῖς λείπῃ
  choice: 使他们一无所缺
  rationale: 保留希腊文目的从句及其宽泛表达，指使二人在旅程所需方面没有缺乏，而不擅自限定具体物资。
theological_decisions: []
translation_notes:
  register: 采用现代、自然而庄重的普通话。“尽心帮助……上路”兼顾中文可读性和原文中认真安排、实际支援旅程的语义；保留“一无所缺”的概括性。
