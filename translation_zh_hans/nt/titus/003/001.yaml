  text: Ὑπομίμνῃσκε αὐτοὺς ⸀ἀρχαῖς ἐξουσίαις ὑποτάσσεσθαι πειθαρχεῖν, πρὸς πᾶν ἔργον ἀγαθὸν ἑτοίμους εἶναι,
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/001.yaml
  text: Remind them to be subject to rulers and authorities[a], to be obedient, to be ready for every good work,
translation:
  language: zh_hans
  text: 你要提醒他们顺服、服从执政者和掌权者，随时预备行各样善事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑπομίμνῃσκε
  choice: 你要提醒
  rationale: 现在时主动命令语气第二人称单数，吩咐提多持续承担提醒的责任；汉语“你要提醒”自然表达命令，持续性可由语境体现。
- source_word: αὐτοὺς
  choice: 众人
  rationale: 指前文所涉及的克里特信徒群体；“众人”比孤立的“他们”在本节开头更自然，也不改变复数所指。
- source_word: ἀρχαῖς
  choice: 执政者
  rationale: 在此公民生活语境中指治理者或官长，不是属灵界的权势；“执政者”保留其人格化的治理含义。
- source_word: ἐξουσίαις
  choice: 掌权者
  rationale: 与ἀρχαῖς并列，指拥有治理权柄者；“执政者和掌权者”保留原文两个相近而不完全相同的称谓。
- source_word: ὑποτάσσεσθαι
  choice: 顺服
  rationale: 表达置于既定秩序之下并服从；“顺服”庄重、简明，并不自行扩展为毫无限制的服从。
- source_word: πειθαρχεῖν
  choice: 听从命令
  rationale: 该动词表示服从掌权者；“听从命令”比单说“听从”更明确地体现对权威要求的遵从，同时与前面的“顺服”有所区别。
- source_word: πρὸς πᾶν ἔργον ἀγαθὸν
  choice: 做各样善事
  rationale: πρός在此表示面向或为某事而预备；“各样善事”自然传达πᾶν ἔργον ἀγαθόν的伦理范围。
- source_word: ἑτοίμους εἶναι
  choice: 预备好
  rationale: 表示处于随时可以行动的状态；“预备好做”符合现代汉语习惯，并保留状态性的劝勉。
theological_decisions:
- issue: 对公民政权顺服的范围
  choice: 按原文直陈一般性的顺服与听从劝勉，不添加“无条件”等限定。
  alternative: 译成暗示在任何情形下都必须绝对服从执政权力。
  rationale: 本节的ἀρχαῖς和ἐξουσίαις在语境中指公民社会的治理者。译文保留命令的力度，也不把原文没有明说的绝对范围加入其中。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“执政者和掌权者”保留原文并列结构；全句按汉语劝勉语序展开，避免生硬复制希腊文不定式链。
