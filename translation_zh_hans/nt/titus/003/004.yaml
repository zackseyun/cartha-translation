  text: But when the kindness and love for humanity of God our Savior appeared,[a]
translation:
  language: zh_hans
  text: 但当我们救主上帝的恩慈和对人的爱[a]显现出来时，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “对人的爱”也可译作“对世人的仁爱”；希腊语指对人所怀的仁爱或善意。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ
  choice: 但到了……时
  rationale: ὅτε引出时间从句，δὲ承接上文并带有温和转折；这一表达自然地显示从先前人的罪恶处境转向上帝的拯救行动。
- source_word: χρηστότης
  choice: 恩慈
  rationale: 该词表示在关系中彰显的良善、仁厚或善意。“恩慈”用语庄重自然，也能与后面的“对人类的爱”相区别。
- source_word: φιλανθρωπία
  choice: 对人类的爱
  rationale: 该词指向人所怀的仁爱与善意。此译法直接保留其对象是全体人类，又避免把它缩减为泛泛的“爱”。
- source_word: ἐπεφάνη
  choice: 显出
  rationale: 该不定过去时形式表达显现、彰显。“显出”既保留显现意味，也符合汉语中抽象品质借行动彰显出来的习惯。
- source_word: τοῦ σωτῆρος ἡμῶν θεοῦ
  choice: 我们的救主上帝
  rationale: 该所有格短语同时修饰“恩慈”和“对人类的爱”。“我们的救主上帝”自然保留“救主”作为上帝称号的结构，不额外判定其位格所指。
theological_decisions:
- issue: “我们的救主上帝”的所指
  choice: 正文保留称号“我们的救主上帝”，不在本节中加入“父”等解释性词语。
  alternative: 依据教牧书信的常见用法，将此处明确解释为父上帝；或只笼统理解为神圣称号。
  rationale: 上下文很可能以此称号指父上帝，并在第6节另提耶稣基督；但本节原文没有明说“父”。直译称号可避免混淆位格，也不超出原文所表达的范围。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“但到了……时”承接第3节并标明救恩转折；“恩慈”与“对人类的爱”保留两个并列名词的差异。脚注标记已置于正文对应位置。
