  to: 他借着我们的救主耶稣这位弥赛亚[b]，把圣灵丰富地浇灌在我们身上[a]。
  rationale: 修订不改变句义或上文衔接：仍由“他”保留原文未明说的施事者，仍明确圣灵是被浇灌者。调整“这圣灵”“丰丰富富地”及脚注a，使中文更自然，并更审慎地反映关系代词的语法形式。将“弥赛亚”置于“耶稣这位弥赛亚”的同位结构中，较符合现代汉语，同时保留其称号含义。
