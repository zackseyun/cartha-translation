  text: οὗ ἐξέχεεν ἐφ’ ἡμᾶς πλουσίως διὰ Ἰησοῦ Χριστοῦ τοῦ σωτῆρος ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/006.yaml
  text: whom he poured out on us richly through Jesus the Messiah our Savior[b][a],
translation:
  language: zh_hans
  text: 他借着我们的救主耶稣这位弥赛亚[b]，把圣灵丰富地浇灌在我们身上[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文的关系代词承接上一节的“圣灵”；本句可较直译为“他把圣灵丰富地浇灌在我们身上”。
    reason: 说明关系结构及其先行词，避免将该代词不当地限定为明确的人称形式。
  - marker: b
    text: “弥赛亚”传统译作“基督”；原文为Χριστός，意为“受膏者”。
    reason: 提供传统译名并说明该称号的含义。
lexical_decisions:
- source_word: οὗ
  choice: 这圣灵
  rationale: 关系代词承接上一节的“圣灵”。汉语为使所指清楚而复现先行词；这也符合该代词在本句中的关系连接作用。
- source_word: ἐξέχεεν
  choice: 浇灌
  rationale: ἐκχέω的基本意象是把液体倾倒出来，也常用于圣灵赐下的语境；“浇灌”既保留意象，又符合现代汉语圣经语体。
- source_word: ἐφ’ ἡμᾶς
  choice: 在我们身上
  rationale: ἐπί加宾格在此表示倾注所朝向、所临到的对象；“浇灌在我们身上”自然明确。
- source_word: πλουσίως
  choice: 丰丰富富地
  rationale: 表示充裕、丰盛的程度；叠词形式在现代汉语中自然，并突出赐予的丰盛。
- source_word: διὰ
  choice: 借着
  rationale: διά加属格在此表示中介或途径；“借着”简洁保留这一关系。
- source_word: Ἰησοῦ Χριστοῦ
  choice: 耶稣弥赛亚
  rationale: Χριστός在此仍可理解为称号，意为“受膏者／弥赛亚”；译作“弥赛亚”传达称号含义，并以脚注列出传统译法。
- source_word: τοῦ σωτῆρος ἡμῶν
  choice: 我们的救主
  rationale: σωτήρ是“救主”，ἡμῶν自然转为汉语领属结构“我们的”；该称号在句中指耶稣弥赛亚。
theological_decisions:
- issue: 关系代词οὗ的所指
  choice: 明确承接上一节的圣灵
  alternative: 形式上仅译作“他／这位”，让读者从上文判断所指
  rationale: 最近的先行词是上一节的“圣灵”；汉语若孤立保留关系代词会生硬且可能指代不明，因此复现“这圣灵”，不改变原文所指。
- issue: Χριστοῦ的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 在“耶稣”与“我们的救主”并列的称号语境中，Χριστός仍保有“受膏者／弥赛亚”的称号意义；正文译出其意义，同时用脚注保留通行传统译名。
- issue: 施行浇灌者的身份
  choice: 保留原文第三人称“他”，由上文确定所指
  alternative: 在本节直接补明为“神”
  rationale: 希腊文本只有动词中的第三人称单数主语，身份须由上文判断；不在本节擅自补出名词，可保留原有篇章衔接。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“把”字句使动作、对象和方向清楚；“丰丰富富地”保留πλουσίως的强调色彩。正文依赖上文，以“这圣灵”明确关系代词所指，同时不补明原文未明说的主语身份。
