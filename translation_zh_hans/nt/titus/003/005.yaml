  text: οὐκ ἐξ ἔργων τῶν ἐν δικαιοσύνῃ ⸀ἃ ἐποιήσαμεν ἡμεῖς ἀλλὰ κατὰ ⸂τὸ αὐτοῦ ἔλεος⸃ ἔσωσεν ἡμᾶς διὰ λουτροῦ παλιγγενεσίας καὶ ἀνακαινώσεως πνεύματος ἁγίου,
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/005.yaml
  text: not from works done in righteousness, which we ourselves did, but according to his mercy he saved us, through the washing of regeneration and renewal by the Holy Spirit,
translation:
  language: zh_hans
  text: 他救了我们，并不是因为我们自己所行的、合乎义[a]的事，而是照着他的怜悯，借着重生的洗涤[b]和圣灵所带来的更新[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “义”也可译作“公义”或“正义”。
    reason: alternative_reading
  - marker: b
    text: “洗涤”可能指洗礼、洁净的意象，或兼有二者；希腊原文本身并未要求在正文中明确取舍。
    reason: lexical_alternative
  - marker: c
    text: 或译：“圣灵的更新。”希腊文的属格结构容许对“圣灵”与“更新”的关系作稍有不同的表达。
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ ἐξ ἔργων τῶν ἐν δικαιοσύνῃ ἃ ἐποιήσαμεν ἡμεῖς
  choice: 并不是出于我们自己在义中所行的事
  rationale: “出于”保留ἐκ所表达的来源或根据；“我们自己”体现独立代词ἡμεῖς的强调；“在义中所行的事”自然表达修饰ἔργων的介词短语及关系从句，同时保留δικαιοσύνη在保罗语境中的“义”。
- source_word: ἀλλὰ κατὰ τὸ αὐτοῦ ἔλεος
  choice: 而是照着他的怜悯
  rationale: “照着”贴近κατά所表达的准则或根据，并与前面的“出于……所行的事”形成鲜明对照。
- source_word: ἔσωσεν ἡμᾶς
  choice: 他……救了我们
  rationale: 采用现代中文中自然且具有救恩语境分量的“救”，不额外限定拯救的机制。
- source_word: διὰ λουτροῦ
  choice: 借着……洗涤
  rationale: “借着”表达διά加属格的手段含义；“洗涤”既可指洗浴或洁净意象，也不在正文中强行判定是否专指洗礼。
- source_word: παλιγγενεσίας
  choice: 重生
  rationale: “重生”准确而通俗地表达παλιγγενεσία的再生、新生之义，也保留其神学分量。
- source_word: καὶ ἀνακαινώσεως πνεύματος ἁγίου
  choice: 和圣灵所带来的更新
  rationale: 将πνεύματος ἁγίου最直接地理解为ἀνακαινώσεως的来源或施行者；“所带来的”使中文关系清楚，同时用脚注保留“圣灵的更新”这一较形式对应的译法。
theological_decisions:
- issue: δικαιοσύνη在本节中的含义
  choice: 义
  alternative: 公义；正义
  rationale: 在保罗语境中，“义”最能保留该词的神学关联；此处也可理解为行为所具有的正直或公义性质，因此脚注列出替代译法。
- issue: διὰ λουτροῦ παλιγγενεσίας的所指
  choice: 借着重生的洗涤
  alternative: 借着使人重生的洗礼；借着重生的洁净
  rationale: 原文的λουτρόν可涉及洗浴、洁净意象或洗礼，正文保留“洗涤”，不替读者裁定其圣礼性或比喻性。
- issue: πνεύματος ἁγίου与ἀνακαινώσεως的关系
  choice: 圣灵所带来的更新
  alternative: 圣灵的更新
  rationale: 属格最直接地修饰紧邻的“更新”，且可表达圣灵作为更新的来源或施行者；脚注保留更贴近形式、但关系稍含混的译法。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“在义中所行的事”略带经文语体，用以保留原文结构和“义”的神学张力；全句按中文语序调整，使“照着他的怜悯”与人的行为形成清楚对照。
