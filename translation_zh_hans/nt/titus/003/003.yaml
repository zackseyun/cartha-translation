  text: ἦμεν γάρ ποτε καὶ ἡμεῖς ἀνόητοι, ἀπειθεῖς, πλανώμενοι, δουλεύοντες ἐπιθυμίαις καὶ ἡδοναῖς ποικίλαις, ἐν κακίᾳ καὶ φθόνῳ διάγοντες, στυγητοί, μισοῦντες ἀλλήλους.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/003.yaml
  text: For we ourselves also were once foolish[a], disobedient, being led astray, enslaved to various desires and pleasures, spending our lives in malice and envy, hateful[b], hating one another.
translation:
  language: zh_hans
  text: 因为我们自己从前也曾愚昧、悖逆、被引入歧途[a]，受各种欲望和享乐奴役，在恶意和嫉妒中度日，令人憎恶[b]，彼此憎恨。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“受迷惑”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“遭人憎恨”。希腊文这个形容词既可理解为“令人憎恶、可憎”，也可理解为“遭人憎恨”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦμεν γάρ ποτε καὶ ἡμεῖς
  choice: 因为我们自己从前也曾
  rationale: “因为”保留γάρ与上文的因果或解释关系；“我们自己……也”传达καὶ ἡμεῖς的包容性强调；“从前”表达ποτε的时间意义。
- source_word: ἀνόητοι
  choice: 愚昧
  rationale: 既表达缺乏认识，也可承载语境中的道德判断；比“无知”更贴合这组伦理描述。
- source_word: ἀπειθεῖς
  choice: 悖逆
  rationale: 该词兼有不肯听从和不顺服之意；“悖逆”简洁地保留这种意志性的抗拒。
- source_word: πλανώμενοι
  choice: 被引入歧途
  rationale: 保留分词可能具有的被动意味，并涵盖受迷惑和走错方向，不把意思局限于认知上的“受骗”。
- source_word: δουλεύοντες
  choice: 受……奴役
  rationale: 突出δουλεύω所含的奴役和辖制力度，而不弱化为一般的“服事”或“追求”。
- source_word: ἐπιθυμίαις καὶ ἡδοναῖς ποικίλαις
  choice: 各种欲望和享乐
  rationale: “欲望”保留ἐπιθυμία较宽的语义范围，不限于性欲；“各种”按语义自然地修饰欲望和享乐两项。
- source_word: ἐν κακίᾳ καὶ φθόνῳ διάγοντες
  choice: 在恶意和嫉妒中度日
  rationale: “度日”体现διάγω持续过生活的含义；在人际恶行的语境中，“恶意”比泛指的“邪恶”更具体。
- source_word: στυγητοί
  choice: 令人憎恶
  rationale: 按主动或性质义理解为“可憎、讨人憎恶”；因该词也可能是被动义“遭人憎恨”，另以脚注保留。
- source_word: μισοῦντες ἀλλήλους
  choice: 彼此仇恨
  rationale: 直接表达持续的相互憎恨，并以自然、庄重的现代汉语收束整组描述。
theological_decisions:
- issue: δουλεύοντες以欲望和享乐为非人格主人的奴役意象
  choice: 受各种欲望和享乐奴役
  alternative: 服事各种欲望和享乐
  rationale: 原文使用强烈的奴役语言，描述人受欲望和享乐辖制的状态；译作“受……奴役”保留这一力度，同时不额外引入特定教义体系。
- issue: στυγητοί的主动/性质义与被动义
  choice: 令人憎恶
  alternative: 遭人憎恨
  rationale: 此处可理解为描述人本身可憎，也可理解为他们为人所恨。正文采用较适合恶行清单的性质义，脚注明确保留另一种真实可能。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。整句保留原文连续列举的节奏，以顿号和逗号区分各项；“受……奴役”和“在……中度日”兼顾原文力度与自然表达。脚注标记均置于对应词语之后。
