  text: μωρὰς δὲ ζητήσεις καὶ γενεαλογίας καὶ ⸀ἔρεις καὶ μάχας νομικὰς περιΐστασο, εἰσὶν γὰρ ἀνωφελεῖς καὶ μάταιοι.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/009.yaml
  text: But avoid foolish controversies and genealogies and strife and quarrels about the law[b][a], for they are unprofitable and futile.
translation:
  language: zh_hans
  text: 但要避开愚蠢的争辩[a]、家谱、纷争，以及有关律法的争吵[b]，因为这些都无益且徒劳。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “争辩”也可译作“争议”或“探究”。这里指引发争执的议论。
    reason: lexical_alternative
  - marker: b
    text: 直译“律法方面的争吵”。
    reason: lexical_alternative
lexical_decisions:
- source_word: μωρὰς ζητήσεις
  choice: 愚蠢的争辩
  rationale: μωράς 表示缺乏明智、在实践上愚妄；ζητήσεις 在教牧书信的语境中常指引发争执的探究或议论。“愚蠢的争辩”自然传达其负面、争议性的含义，同时以脚注保留“讨论、探究”等可能性。
- source_word: γενεαλογίας
  choice: 家谱
  rationale: 直译该复数名词的基本词义，不在正文中擅自限定为犹太血统争论或某种神话体系。汉语集合性名词“家谱”在此可自然涵盖原文复数。
- source_word: ἔρεις
  choice: 纷争
  rationale: ἔρις 指争竞、不和或冲突。“纷争”既保留关系失和的意味，也与随后更具体的“争吵”有所区分。
- source_word: μάχας νομικὰς
  choice: 有关律法的争吵
  rationale: μάχας 在此指言语冲突而非实际战斗；νομικάς 修饰它，表示与律法有关。此译法避免被误解为法律诉讼，并保留所指律法范围的开放性。
- source_word: περιΐστασο
  choice: 要避开
  rationale: 该中间语态命令式要求人使自己远离这些事。“要避开”简洁自然，并准确表达持续警惕、不要卷入的命令语气。
- source_word: ἀνωφελεῖς
  choice: 无益
  rationale: 该词表示没有益处、不能带来帮助。“无益”是简明而庄重的现代汉语表达。
- source_word: μάταιοι
  choice: 徒劳
  rationale: μάταιος 表示空洞、无效、达不到有价值的结果。“徒劳”突出其毫无成果，并与“无益”形成自然搭配。
theological_decisions:
- issue: “家谱”与“有关律法的争吵”的具体历史所指
  choice: 在正文中保留概括性措辞，不指明某一种犹太、诺斯替或异端体系。
  alternative: 将“家谱”明确解释为犹太人的血统争论，或解释为早期诺斯替式的神话推演。
  rationale: 本节经文本身没有充分界定这些活动的具体体系；作明确历史归类会超出原文证据。概括性翻译既忠实于词义，也保留真实的不确定性。
- issue: νομικὰς 所指的“律法”
  choice: 译为“有关律法的”，不在正文中进一步限定为摩西律法或一般法律问题。
  alternative: 译为“有关摩西律法的”或“法律上的”。
  rationale: 语境很可能涉及宗教律法，但形容词本身未明说“摩西”。保留“律法”既符合新约惯用表达，又避免把它误译成法庭或诉讼争端。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“愚蠢”保留原文直接的负面评价；“纷争”与“争吵”体现 ἔρεις 和 μάχας 的语义重叠及细微区别。脚注标记按正文出现顺序排列。
