  text: ἵνα δικαιωθέντες τῇ ἐκείνου χάριτι κληρονόμοι ⸀γενηθῶμεν κατ’ ἐλπίδα ζωῆς αἰωνίου.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/007.yaml
  text: so that[a], having been justified by his grace[b], we might become heirs according to the hope of eternal life.
translation:
  language: zh_hans
  text: 好叫我们既因他的恩典得以称义[a]，便得以照着永生的盼望[b]成为继承人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “称义”也可译作“被宣告为义”。
    reason: lexical_alternative
  - marker: b
    text: “照着永生的盼望”也可译作“怀着永生的盼望”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: 好叫
  rationale: 引出目的或结果从句；“好叫”自然、庄重，并保留希腊文的目的意味。
- source_word: δικαιωθέντες
  choice: 既……得以称义
  rationale: 保留不定过去时被动分词的被动意义，并以“既”表达其相对于主句动作的先行背景；“称义”也维持该词在保罗书信中的关键用语联系。
- source_word: τῇ ἐκείνου χάριτι
  choice: 因他的恩典
  rationale: 将工具或凭借意义的与格自然译为“因”；“他的”保留代词指向，不在译文中强行明确究竟指父神还是耶稣基督。
- source_word: κληρονόμοι
  choice: 承受产业的人
  rationale: 保留 κληρονόμος 的继承与产业意象，同时比单用较书面的“继承人”更能传达圣经语境中的产业含义。
- source_word: γενηθῶμεν
  choice: 可以……成为
  rationale: 反映 ἵνα 后不定过去时虚拟语气及进入某种身份或状态的含义，不额外强化外在使役。
- source_word: κατ’ ἐλπίδα
  choice: 照着……盼望
  rationale: 较形式对应地保留 κατά 的表达，同时承认此处也可按惯用法理解为“怀着盼望”。
- source_word: ζωῆς αἰωνίου
  choice: 永生
  rationale: 以现代汉语中固定而清楚的圣经用语表达“永恒的生命”，并与“盼望”构成自然的所属或内容关系。
theological_decisions:
- issue: δικαιωθέντες 的救恩论含义
  choice: 称义
  alternative: 被宣告为义
  rationale: “称义”保留 δικαιόω 的传统关键术语及其神学张力，不把该词在正文中缩减为单一解释；脚注提供较直白的表达。
- issue: ἐκείνου 所指为何
  choice: 他的
  alternative: 明确译作“神的”或“耶稣基督的”
  rationale: 原文代词须由上下文判断，可能联系前文所述的神及救主；正文保留代词，避免过度明确其所指。
- issue: κατ’ ἐλπίδα 与“成为承受产业的人”的关系
  choice: 照着永生的盼望成为承受产业的人
  alternative: 怀着永生的盼望成为承受产业的人
  rationale: 正文保留 κατά 的较直接对应以及原句的结构张力；脚注说明更具状态意味的可行理解。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“好叫……既……就可以……”呈现原句的目的结构与分词关系；“承受产业的人”保留继承意象而避免过度术语化。
