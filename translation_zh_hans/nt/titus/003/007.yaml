- from: 好叫我们既因他的恩典得以称义[a]，就可以照着永生的盼望[b]成为承受产业的人。
  to: 好叫我们既因他的恩典得以称义[a]，便得以照着永生的盼望[b]成为继承人。
  rationale: 修订以“便得以……成为”替代“就可以……成为”，避免把目的性虚拟语气误解为许可或能力，并以“继承人”直接对应κληρονόμοι。保留“照着永生的盼望”及其脚注替代译法，以维持κατ’ ἐλπίδα在汉语中略具张力的表达，未将其关系过度释义。
