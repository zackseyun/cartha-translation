  text: Ὅταν πέμψω Ἀρτεμᾶν πρὸς σὲ ἢ Τυχικόν, σπούδασον ἐλθεῖν πρός με εἰς Νικόπολιν, ἐκεῖ γὰρ κέκρικα παραχειμάσαι.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/012.yaml
  text: When I send Artemas or Tychicus to you[a], make every effort to come to me at Nicopolis[b], for I have decided to spend the winter there.
translation:
  language: zh_hans
  text: 我派亚提马或推基古到你那里时，你要务必设法[a]到尼哥波立来见我，因为我已经决定[b]在那里过冬。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你要赶紧到尼哥波立来见我。”
    reason: σπούδασον可强调殷勤、竭力，也可按语境强调及时行动。
  - marker: b
    text: 或译：“我已经定意在那里过冬。”
    reason: κέκρικα可译作“已经决定”，也可用语气稍强的“已经定意”。
lexical_decisions:
- source_word: Ὅταν πέμψω
  choice: 我派……以后
  rationale: ὅταν加虚拟语气指将来预期发生的具体事件；汉语用“……以后”自然表达该未来条件与先后关系，并不暗示事情已经发生。
- source_word: Ἀρτεμᾶν
  choice: 亚提马
  rationale: 按现代中文圣经人名的通行音译处理。
- source_word: ἢ
  choice: 或
  rationale: 保留两个可能受派者之间的选择关系。
- source_word: Τυχικόν
  choice: 推基古
  rationale: 采用现代中文圣经中较通行的人名音译。
- source_word: πρὸς σὲ
  choice: 到你那里
  rationale: 明确表达受派者前往提多所在地的方向。
- source_word: σπούδασον
  choice: 要尽快
  rationale: 此命令包含认真设法并带有及时行动之意；“尽快”在本语境中自然，但不把含义缩减为单纯仓促，故以脚注保留“务必设法”的译法。
- source_word: ἐλθεῖν πρός με εἰς Νικόπολιν
  choice: 到尼哥波立来见我
  rationale: 保留朝向说话者的“来”以及地点尼哥波立；“来见我”自然表达πρός με的方向关系。
- source_word: ἐκεῖ γὰρ
  choice: 因为……在那里
  rationale: γάρ说明前一请求的理由，ἐκεῖ回指尼哥波立。
- source_word: κέκρικα
  choice: 我已经决定
  rationale: 完成时表达已经作出、目前仍有效的决定。
- source_word: παραχειμάσαι
  choice: 过冬
  rationale: 准确而自然地表达在某地度过冬季。
