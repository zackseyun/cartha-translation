  yaml_path: translation/nt/titus/003/010.yaml
  text: Reject a divisive person after a first and second warning,[a]
translation:
  language: zh_hans
  text: 对于制造分裂的人，在第一次和第二次劝戒之后，要拒绝他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“结党的人”；传统译法作“异端的人”。希腊语在这里很可能指制造派系分裂的人。
    reason: 说明关键词的语义范围，并保留传统译法而不让它主导正文。
lexical_decisions:
- source_word: αἱρετικὸν
  choice: 制造分裂的
  rationale: 该词在此更可能指结党、造成群体分裂，而不是后世教会术语意义上的“异端”。译成“制造分裂的”既自然，也凸显其行为及群体后果。
- source_word: ἄνθρωπον
  choice: 人
  rationale: 此处指一个人；现代汉语“人”自然涵盖个体，又不必把希腊语语法上的阳性误作对性别的特别强调。
- source_word: μετὰ μίαν καὶ δευτέραν νουθεσίαν
  choice: 警戒过一次、两次以后
  rationale: μετά在这里表示采取后续行动之前已有先后两次劝戒；νουθεσία是旨在纠正对方的规劝或警戒。“警戒”保留严肃的纠正意味。
- source_word: παραιτοῦ
  choice: 就要拒绝他
  rationale: 该命令要求不再接纳或与此人来往。“拒绝”表达明确的纪律性行动，同时避免把具体实施方式解释得过细。
theological_decisions:
- issue: αἱρετικὸν是按后世教义术语译作“异端”，还是按当时语境译为制造分裂
  choice: 制造分裂的
  alternative: 异端的；结党的人
  rationale: 上下文涉及一个人在多次警戒后仍需被拒绝。译作“制造分裂的”保留第一世纪语境中结党分派的重点，不将后世已经技术化的“异端”概念直接带入经文。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“警戒过一次、两次以后”明确呈现先后两次纠正；“就要拒绝他”保留命令的果断语气。
