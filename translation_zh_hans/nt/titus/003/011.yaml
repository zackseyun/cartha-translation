  text: εἰδὼς ὅτι ἐξέστραπται ὁ τοιοῦτος καὶ ἁμαρτάνει, ὢν αὐτοκατάκριτος.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/011.yaml
  text: knowing that such a person is warped and is sinning[c][b][a], being self-condemned.
translation:
  language: zh_hans
  text: 你要知道，这样的人[b]已经偏离正道[a]，并且犯罪，是自取定罪的[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“已经转离”或“已经走入歧途”。希腊语完成时表示先前的偏离造成了当前的状态。
    reason: lexical_alternative
  - marker: b
    text: 希腊语原文为阳性单数，也可直译为“这样的一个人”。
    reason: lexical_alternative
  - marker: c
    text: 或译“被自己定罪”或“自证有罪”；可指他因自己的行为或言论而使自己显为有罪。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: 因为你知道
  rationale: 该分词承接上一节对提多的吩咐，隐含主语是提多。译作“因为你知道”使现代汉语通顺，并表达最可能的原因性联系。
- source_word: ἐξέστραπται
  choice: 已经偏离正道
  rationale: 该完成时动词表示先前发生偏离而形成的现状；“已经偏离正道”兼顾动作及其持续结果，又避免“败坏”“乖僻”等可能过度强化的措辞。
- source_word: ὁ τοιοῦτος
  choice: 这样的人
  rationale: 该短语是阳性单数，指上一节所说制造纷争者；现代汉语用“这样的人”自然准确，并不抹去其单数所指。
- source_word: ἁμαρτάνει
  choice: 仍在犯罪
  rationale: 现在时描写持续进行的行为；“仍在”也自然承接此人已经偏离正道的状态，但不扩展为关于其一生恒常状态的判断。
- source_word: ὢν
  choice: 是
  rationale: 希腊语分词把末尾的谓语性描述与前文相连；汉语用“是”简洁自然，无须机械译出“处于……状态”。
- source_word: αὐτοκατάκριτος
  choice: 自取定罪
  rationale: 该复合形容词表示此人因自己的行为或见证而落在定罪之下；“自取定罪”保留反身意味，同时不把它扩展为对末日审判的完整论断。
theological_decisions:
- issue: ὁ τοιοῦτος的性别表达
  choice: 这样的人
  alternative: 这样的男人
  rationale: 希腊语使用阳性单数，是因其所指个体及语法形式；此处重点在“这类制造纷争者”，现代汉语“这样的人”仍是单数泛指，且比“这样的男人”更自然，不额外强调生理性别。
- issue: αὐτοκατάκριτος的定罪含义
  choice: 自取定罪
  alternative: 被自己定罪／自证有罪
  rationale: 经文指出此人的立场和行为使定罪落在自己身上，但没有明确限定是其主观良心宣判自己，还是其行为构成对自己的见证；正文保留这一张力，脚注说明可能含义。
- issue: εἰδὼς与上一节的逻辑关系
  choice: 因为你知道
  alternative: 知道／你知道
  rationale: 分词在语境中最自然地说明上一节吩咐的根据。加“因为”符合现代汉语，但不改变“知道”的隐含主语为接受吩咐的提多。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“偏离正道”保留道德与教义方向上的偏离，却不使用容易产生现代性含义的“变态”；“仍在犯罪”清楚表达现在时的持续性；三个脚注标记均紧随相关措辞。
