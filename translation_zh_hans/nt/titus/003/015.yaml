  text: Ἀσπάζονταί σε οἱ μετ’ ἐμοῦ πάντες. ἄσπασαι τοὺς φιλοῦντας ἡμᾶς ἐν πίστει. ἡ χάρις μετὰ πάντων ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/015.yaml
  text: All who are with me greet you[a]. Greet those who love us in faith. Grace be with all of you.
translation:
  language: zh_hans
  text: 所有跟我在一起的人都向你问安。请问候那些在信心里爱我们的人[a]。愿恩典与你们众人同在。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在共同的信仰里”；也可理解为“以忠信爱我们”。
    reason: 保留 ἐν πίστει 在“信心／共同信仰／忠信”之间的真实词义开放性。
lexical_decisions:
- source_word: Ἀσπάζονταί
  choice: 向……问安
  rationale: 符合书信结尾传达问候的常用语义，也比生硬直译为“问候你”更自然。
- source_word: οἱ μετ’ ἐμοῦ πάντες
  choice: 所有跟我在一起的人
  rationale: 保留 πάντες“所有”的整体范围，并自然表达与保罗同在的众人。
- source_word: ἄσπασαι
  choice: 请问候
  rationale: 准确表达第二人称单数命令式；加“请”符合现代汉语书信语气，不削弱其指令性质。
- source_word: φιλοῦντας
  choice: 爱
  rationale: 保留 φιλέω 所表达的人际 affection 与亲爱之情，简洁直接。
- source_word: ἐν πίστει
  choice: 在信心里
  rationale: 以“信心”作为 πίστις 的首选译法，并保留 ἐν 所表达的范围或关系基础；原文仍可能指共同信仰或忠信，故在脚注说明。
- source_word: ἡ χάρις
  choice: 恩典
  rationale: 符合保罗书信祝福语的惯用神学含义；汉语无需机械表达希腊文冠词。
- source_word: μετὰ πάντων ὑμῶν
  choice: 与你们众人同在
  rationale: 补出祝福语中省略而隐含的“愿……同在”，并保留 πάντων 对全体收信人的强调。
theological_decisions:
- issue: ἐν πίστει 中 πίστις 的含义
  choice: 在信心里
  alternative: 在共同的信仰里；以忠信
  rationale: 此处最自然地把信理解为信徒彼此相爱的共同属灵范围或基础，但无冠词的 πίστις 也可侧重共同信仰或忠信。正文不把歧义过度限定，其他可能译法列入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的书信结束语。“向你问安”“愿恩典……同在”符合当代中文圣经语体，同时避免古奥措辞。
