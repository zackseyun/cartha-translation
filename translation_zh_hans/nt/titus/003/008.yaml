id: TIT.3.8
reference: Titus 3:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Πιστὸς ὁ λόγος, καὶ περὶ τούτων βούλομαί σε διαβεβαιοῦσθαι, ἵνα φροντίζωσιν καλῶν ἔργων προΐστασθαι οἱ πεπιστευκότες θεῷ. ταῦτά ⸀ἐστιν καλὰ καὶ ὠφέλιμα τοῖς ἀνθρώποις·
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/008.yaml
  text: This saying is trustworthy[a], and concerning these things I want you to insist confidently, so that those who have believed God may be careful to devote themselves to good works[b]. These things are good and beneficial for people.
translation:
  language: zh_hans
  text: 这话是可信的。关于这些事，我希望你坚定地加以申明，使那些已经相信上帝[a]的人留心行善[b]。这些事是美好的，对人有益。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “相信上帝”也可译作“相信上帝所说的话”或“信靠上帝”。
    reason: 保留πιστεύω与与格θεῷ可表达相信其所言或信靠其本身的语义幅度，避免将其限定为单一理解。
  - marker: b
    text: “留心行善”也可译作“专心行善”或“积极投身于善行”。
    reason: 保留φροντίζω与προΐστασθαι组合中认真关注、持续投入的语义幅度。
lexical_decisions:
- source_word: Πιστὸς ὁ λόγος
  choice: 这话是可信的
  rationale: 这是教牧书信中的固定表达；λόγος在此指前述的信息或陈述，而不是孤立的一个“字”。中文用“这话”自然承接上文。
- source_word: περὶ τούτων
  choice: 关于这些事
  rationale: 直接表达περί加属格的所指，并把命令与前文内容连接起来。
- source_word: βούλομαί σε διαβεβαιοῦσθαι
  choice: 我希望你坚决地加以申明
  rationale: βούλομαι表达意愿；διαβεβαιόομαι带有坚定、确信地断言或强调之意。“坚决地加以申明”兼顾语气强度与庄重、清楚的现代汉语。
- source_word: ἵνα φροντίζωσιν
  choice: 使……留心
  rationale: φροντίζω表示认真思量、关注并采取相应行动；“留心”简洁地保留这种审慎关注。
- source_word: καλῶν ἔργων προΐστασθαι
  choice: 行善
  rationale: 此处προΐστασθαι很可能指投身、专注于或实践善工，而非担任组织领导。“行善”是自然中文，并在脚注中保留持续投入之义。
- source_word: οἱ πεπιστευκότες θεῷ
  choice: 那些已经信了上帝的人
  rationale: 完成时分词表示已经相信并处于相信状态的人；θεῷ为与格，可表示相信上帝所说的、信靠上帝，中文“信了上帝”保留一定开放性。
- source_word: ταῦτά ἐστιν καλὰ καὶ ὠφέλιμα τοῖς ἀνθρώποις
  choice: 这些事都是美好的，对人有益
  rationale: 保留ταῦτα的复数指向，并分别表达καλά的美善和ὠφέλιμα的益处；ἀνθρώποις泛指人。
theological_decisions:
- issue: 信与善行的关系
  choice: 先说人已经信了上帝，继而要求他们留心行善
  alternative: 把善行表述为获得拯救的根据，或弱化为一般性的道德建议
  rationale: 希腊文把善行呈现为已经相信之人的应有实践，并未说善行是相信或得救的先决条件。译文保留这一先后关系而不附加宗派性解释。
- issue: πιστεύω与与格θεῷ的含义
  choice: 信了上帝
  alternative: 信上帝的话；信靠上帝；信仰上帝
  rationale: 该结构可以侧重相信上帝所说的，也可包含信靠之意。“信了上帝”较贴近原文结构，同时不把语义过早限定为其中一种解释。
- issue: προΐστασθαι在善工语境中的含义
  choice: 行善，并以脚注说明也可理解为专心或积极投身善行
  alternative: 在善行上作带领者
  rationale: 该动词可以有管理、带领之义，但与καλῶν ἔργων连用时，语境更支持从事、实践或致力于善行；不宜在正文中引入组织性领导的特定含义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“坚决地加以申明”传达劝令的力度；“行善”通俗易懂，脚注补足原文所含的专注和投入意味。
