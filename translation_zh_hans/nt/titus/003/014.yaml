  text: μανθανέτωσαν δὲ καὶ οἱ ἡμέτεροι καλῶν ἔργων προΐστασθαι εἰς τὰς ἀναγκαίας χρείας, ἵνα μὴ ὦσιν ἄκαρποι.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/014.yaml
  text: And let our people also learn to engage in good works for necessary needs[c][b][a], so that they may not be unfruitful.
translation:
  language: zh_hans
  text: 我们自己的人[a]也要学习致力于善行[b]，以应付必要的需用[c]，免得不结果子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我们自己的人”或译“我们的人”或“我们这一方的人”。
    reason: lexical_alternative
  - marker: b
    text: “致力于善行”或译“从事善行”或“带头行善”。
    reason: lexical_alternative
  - marker: c
    text: “必要的需用”或译“迫切的需要”。
    reason: lexical_alternative
lexical_decisions:
- source_word: μανθανέτωσαν
  choice: 要学习
  rationale: 第三人称复数现在时命令式，表达持续性的劝勉；“要学习”在现代汉语中自然，也保留命令与劝勉的力度。
- source_word: οἱ ἡμέτεροι
  choice: 我们的人
  rationale: 字面为“我们的（人）”，在此指保罗、提多所属信仰群体中的人；译法保留其关系性和群体性，且不额外限定性别。
- source_word: καλῶν ἔργων
  choice: 善行
  rationale: 简明传达“好的行为/工作”，并与《提多书》中反复出现的同一主题相呼应。
- source_word: προΐστασθαι
  choice: 投身
  rationale: 该词可指带领、管理、关怀或专心从事；与“善行”连用时，“投身”自然表达积极而持续地参与，同时不排除“带头”的词义可能。
- source_word: εἰς τὰς ἀναγκαίας χρείας
  choice: 满足必要的需要
  rationale: εἰς在此表达目的或指向；ἀναγκαίας χρείας指必要或迫切的实际需要。“满足”使善行与需要之间的目的关系在汉语中清楚。
- source_word: ἵνα μὴ ὦσιν ἄκαρποι
  choice: 免得不结果子
  rationale: 保留ἵνα目的句的负向表达和ἄκαρποι“无果子”的比喻，不将其解释性地弱化为“没有成效”。
theological_decisions:
- issue: οἱ ἡμέτεροι的范围
  choice: 指保罗和提多所属的基督徒群体，即“我们的人”
  alternative: 我们自己的人；我们这一方的人；我们的弟兄姊妹
  rationale: 原文是关系性、群体性的称呼，并未限定为男性；采用“我们的人”既保留原文简洁性，也不加入经文未明说的身份界定。
- issue: προΐστασθαι与善行的关系
  choice: 投身善行
  alternative: 从事善行；带头行善；专心行善
  rationale: 原词本身容许“带头”和“专心从事”等含义。正文以“投身”表达积极持续的参与，并用脚注保存“带头”的真实歧义，避免把它限定为教会职分或领导角色。
- issue: ἄκαρποι的比喻
  choice: 不结果子
  alternative: 没有成果；无所作为
  rationale: 保留原文的结果子意象及其伦理和属灵张力，不预先规定这里所说的“果子”仅是哪一种成效。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“投身善行”比“致力于善工”更易为普通读者理解；“免得不结果子”保留圣经常见比喻。脚注标记依照所给咨询层的顺序置于对应短语之后。
