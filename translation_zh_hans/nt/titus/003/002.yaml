  text: μηδένα βλασφημεῖν, ἀμάχους εἶναι, ἐπιεικεῖς, πᾶσαν ἐνδεικνυμένους πραΰτητα πρὸς πάντας ἀνθρώπους.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/002.yaml
  text: to slander no one[a], to be peaceable, gentle[c][b], showing all meekness toward all people.
translation:
  language: zh_hans
  text: 不要毁谤任何人[a]，不与人争竞，要宽厚，对所有人都显出十足的谦和[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“不要说任何人的坏话”。这里的动词可泛指以侮辱性言语攻击人，范围可能比严格意义上的“毁谤”更广。
    reason: lexical_alternative
  - marker: b
    text: “谦和”也可译作“温柔”或“柔和”。这里选“谦和”，并用前面的“宽厚”翻译另一个意义相近的希腊词，以保留两者的区别。
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδένα
  choice: 任何人
  rationale: 作 βλασφημεῖν 的宾语，与否定命令“不要”搭配，清楚保留无一例外的范围。
- source_word: βλασφημεῖν
  choice: 毁谤
  rationale: 此处宾语是人，指以恶言攻击、诋毁，而非专指对上帝的亵渎；“毁谤”简洁庄重，但其希腊语义域可比法律意义上的诽谤更宽。
- source_word: ἀμάχους εἶναι
  choice: 不要争斗
  rationale: 该形容词表示不与人打斗或争吵；汉语用否定动词结构自然地保留其否定形式和伦理重点。
- source_word: ἐπιεικεῖς
  choice: 宽厚
  rationale: 表达通情达理、肯退让、宽和待人的品格；选“宽厚”可与后面的 πραΰτης“温柔”有所区别。
- source_word: πᾶσαν ἐνδεικνυμένους πραΰτητα
  choice: 显出十足的温柔
  rationale: ἐνδείκνυμαι 表示显明、表现；πᾶσαν 修饰抽象名词，在此强调充分而全面，译作“十足的”比“所有的温柔”更自然。
- source_word: πρὸς πάντας ἀνθρώπους
  choice: 在待所有人的事上
  rationale: πρός 表示面对或对待他人的取向；ἄνθρωποι 泛指所有人，译文保留普遍范围，不限于男性。
theological_decisions:
- issue: πᾶσαν πραΰτητα 所表达的品格及其强度
  choice: 十足的温柔
  alternative: 完全的谦和／凡事温柔
  rationale: πραΰτης 可涵盖温柔、谦和、柔和自制等含义；采用现代汉语自然的“温柔”，并以“十足的”保留 πᾶσαν 的强化作用，不把它解释成软弱或特定神学术语。
- issue: πάντας ἀνθρώπους 的所指范围
  choice: 所有人
  alternative: 众人／人人
  rationale: 该短语泛指全体人类，并非只指男性；“所有人”直接保留其普遍性。
translation_notes:
  register: 采用现代、庄重而易懂的劝勉语体。按汉语习惯把希腊语不定式和分词串列改写为连续命令，并以“在待所有人的事上”自然表达对一切人的行为取向。
