  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ εἶδον ὅτε ἤνοιξεν τὴν σφραγῖδα τὴν ἕκτην, καὶ σεισμὸς μέγας ἐγένετο, καὶ ὁ ἥλιος ⸂ἐγένετο μέλας⸃ ὡς σάκκος τρίχινος, καὶ ἡ σελήνη ὅλη ἐγένετο ὡς αἷμα,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/012.yaml
  text: And I saw when he opened the sixth seal[a], and there was a great earthquake, and the sun became black like sackcloth made of hair, and the whole moon became like blood,
translation:
  language: zh_hans
  text: 我看见他揭开第六个印的时候，发生了大地震；太阳变黑，好像毛制的粗袋布[a]，整个月亮变得像血一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“像毛制的袋布”；这里指用动物毛制成的粗糙袋布，传统上与哀悼有关。
    reason: 说明σάκκος τρίχινος所指的毛制粗袋布，并提供较贴近字面的替代译法。
lexical_decisions:
- source_word: εἶδον
  choice: 我看见
  rationale: 这是启示录中引出异象所见的常用表达；“我看见”准确而自然。
- source_word: ὅτε ἤνοιξεν τὴν σφραγῖδα τὴν ἕκτην
  choice: 他揭开第六个印的时候
  rationale: 保留时间关系和希腊文未明说姓名的第三人称主语；“揭开……印”符合封印意象，也不额外补入解释性身份。
- source_word: σεισμὸς μέγας ἐγένετο
  choice: 发生了大地震
  rationale: σεισμός在此最自然地指地震；“发生了”传达ἐγένετο的事件性。
- source_word: ὁ ἥλιος ἐγένετο μέλας
  choice: 太阳变黑
  rationale: μέλας明确表示黑色，而不只是一般的昏暗；简洁保留状态变化。
- source_word: ὡς σάκκος τρίχινος
  choice: 像毛织的粗布
  rationale: σάκκος指粗糙的袋布或丧服用布，τρίχινος说明由毛制成；此译避免让现代读者误以为原料必是麻，同时保留粗糙布料的形象。
- source_word: ἡ σελήνη ὅλη
  choice: 整个月亮
  rationale: 明确表达ὅλη的整体强调，同时避免“满月”所可能引出的月相含义。
- source_word: ἐγένετο ὡς αἷμα
  choice: 变得像血一样
  rationale: 保留ὡς所标明的明喻，不把异象过度实化为月亮字面上成为血。
theological_decisions:
- issue: 宇宙异象的性质
  choice: 直接呈现异象中的地震、日黑和月如血，不判定这些现象是字面的、象征的，还是兼具两者。
  alternative: 将这些景象明确解释为末日天文灾变，或明确解释为神审判及政权动荡的象征。
  rationale: 希腊文使用鲜明的异象语言和明喻，却没有在本节裁定更广泛的诠释问题；译文应保留这种张力。
- issue: 揭印者的身份
  choice: 译作“他”，不在本节补出“羔羊”。
  alternative: 依据上文语境译作“羔羊”。
  rationale: 希腊文本节仅以动词第三人称形式表达主语；“他”既与上下文衔接，也避免在本节正文中增添原文未重复出现的称谓。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以分号划分地震与天象，保留原文连续推进的节奏；“整个月亮”显明整体性，又不误解为“满月”。
