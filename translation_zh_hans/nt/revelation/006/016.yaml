review_pass:
  verdict: revise
  source_fidelity: 草案整体准确保留了历史性现在时、向山和岩石发出的两个命令，以及“坐在宝座上者”和“羔羊”两个并列的躲避对象。但“喊道”比λέγουσιν（说）增添了原文未明说的发声方式；“烈怒”则略强化了ὀργή的词义。
  naturalness: “躲避……的面”在现代汉语中不自然，且“面”单独用作人的脸面在此处显得生硬。改为“面容”，并以脚注给出“面前／临在”的语境义，既保留原文具象性，也使句子通顺。将“磐石”改为“岩石”更符合现代普通用语。
  terminology: “宝座”“羔羊”“愤怒”均恰当，并保留启示录审判语境及“羔羊的愤怒”的张力。两个ἀπό所引出的对象在译文中仍并列呈现。
  issues:
  - severity: medium
    issue: “躲避坐在宝座上那一位的面”表达不自然。
    rationale: πρόσωπον可字面指“脸、面容”，但汉语“躲避某人的面”不合通常搭配。用“面容”可保留具象表达；“面前／临在”应置于脚注说明。
  - severity: low
    issue: “喊道”及“烈怒”略有强化。
    rationale: λέγουσιν的基本义是“说”，上下文虽有恐惧和急迫，却未明示喊叫；ὀργή在审判语境可译“愤怒”或“震怒”，而“烈怒”额外突出强度。采用“说”“愤怒”更贴近原文，同时不削弱审判意味。
  revised_text: 他们对群山和岩石说：“倒在我们身上吧！把我们藏起来，使我们躲避坐在宝座上的那一位的面容和羔羊的愤怒！”
  revised_footnotes:
