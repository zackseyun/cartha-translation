  text: καὶ λέγουσιν τοῖς ὄρεσιν καὶ ταῖς πέτραις· Πέσετε ἐφ’ ἡμᾶς καὶ κρύψατε ἡμᾶς ἀπὸ προσώπου τοῦ καθημένου ἐπὶ τοῦ θρόνου καὶ ἀπὸ τῆς ὀργῆς τοῦ ἀρνίου,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/016.yaml
  text: and they say to the mountains and to the rocks[a], “Fall on us and hide us from the face of the One seated on the throne and from the wrath of the Lamb,”
translation:
  language: zh_hans
  text: 他们对群山和岩石说：“倒在我们身上吧！把我们藏起来，使我们躲避坐在宝座上的那一位的面容和羔羊的愤怒！”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγουσιν
  choice: 喊道
  rationale: 历史性现在时营造异象叙事的临场感；结合向群山和磐石发出紧迫命令的语境，用“喊道”自然传达说话的强烈语气，而不改成过去时。
- source_word: τοῖς ὄρεσιν καὶ ταῖς πέτραις
  choice: 向群山和磐石
  rationale: ὄρος按通常意义译为“山”，复数在汉语中用“群山”较自然；πέτρα指岩石或岩体，“磐石”既准确又符合庄严的启示文学语体。
- source_word: Πέσετε ἐφ’ ἡμᾶς
  choice: 倒在我们身上吧
  rationale: 保留不定过去时命令语气的急迫和直接；“倒在……身上”准确表达πίπτω与ἐπί加宾格的关系，“吧”使现代汉语祈使命令自然。
- source_word: κρύψατε ἡμᾶς
  choice: 把我们藏起来
  rationale: 直截了当地保留复数命令式的语力，并以现代汉语把字句清楚表达受事关系。
- source_word: ἀπὸ προσώπου
  choice: 躲避……的面
  rationale: πρόσωπον字面为“面、脸”。正文保留“面”的具象表达及面对神时的强烈意象；其语境义“临在”列入脚注，避免无声消解歧义。
- source_word: τοῦ καθημένου ἐπὶ τοῦ θρόνου
  choice: 坐在宝座上那一位
  rationale: 以汉语名词化结构表达带冠词的现在时分词，既保留持续坐在宝座上的状态，也采用尊严而自然的现代措辞。
- source_word: ὀργῆς
  choice: 烈怒
  rationale: ὀργή在末世审判语境中不只是一般愤怒；“烈怒”比“愤怒”更能传达审判的强度，同时仍属普通读者易懂的现代汉语。
- source_word: τοῦ ἀρνίου
  choice: 羔羊
  rationale: 保留《启示录》中ἀρνίον作为基督称号的既定意象，以及牺牲温顺与施行审判之间的张力。
theological_decisions:
- issue: 末世审判中坐宝座者与羔羊的关系
  choice: 保留“坐在宝座上那一位”与“羔羊”为两个并列、各由ἀπό支配的躲避对象。
  alternative: 将两者合并为对上帝的笼统称呼，或弱化“羔羊的烈怒”。
  rationale: 希腊文以καί连接两个并列短语，明确同时提到坐宝座者和羔羊。译文不把二者混同，也不消除作为牺牲者的羔羊同时施行末世审判这一刻意的神学张力。
- issue: “羔羊的烈怒”这一悖论性意象
  choice: 按原文直译为“羔羊的烈怒”。
  alternative: 译为较弱的“羔羊的愤怒”，或以解释性措辞回避羔羊发怒的形象。
  rationale: 原文将象征温顺与牺牲的羔羊同ὀργή直接相连；这一反差属于经文本身，不应在翻译中被缓和或解释掉。
translation_notes:
  register: 采用现代、庄严而易懂的简体中文。“群山和磐石”保留启示文学的宏大意象；“喊道”与两个命令句传达现场的惊恐和急迫。正文中的[a]与脚注严格对应。末尾保留分号，以反映本节在6:17继续展开的句法关系。
