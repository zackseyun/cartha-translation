revisions:
- from: 他们向群山和磐石喊道：“倒在我们身上吧！把我们藏起来，躲避坐在宝座上那一位的面[a]，也躲避羔羊的烈怒；”
  to: 他们对群山和岩石说：“倒在我们身上吧！把我们藏起来，使我们躲避坐在宝座上的那一位的面容和羔羊的愤怒！”
  rationale: 修订以更自然的现代标准汉语表达原文，同时避免无根据地强化语气或愤怒的程度。“面容”对应πρόσωπον的字面意象；脚注保留“面前／临在”的可行语境理解。原草案的[a]未实际置入正文，修订正文不设置无对应的脚注标记，以消除锚点不一致；脚注内容作为该处的可用注释保留。
