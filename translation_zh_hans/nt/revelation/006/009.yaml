  to: 他揭开第五个印的时候，我看见祭坛下面那些因上帝的道、又因他们所持有的见证[b]而被宰杀[a]者的灵魂。
  rationale: 本次仅作安全且必要的微调：以“所持有的”对应εἶχον，避免“持守”所增加的解释性；并重排句子，使现代汉语更流畅。保留“被宰杀”及其脚注，以呈现σφάζω的强烈、带献祭联想的语气；不对“灵魂”的异象性质作超出经文的教义推断。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T03:57:18Z'
