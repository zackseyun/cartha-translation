source:
  edition: SBLGNT
  text: Καὶ ὅτε ἤνοιξεν τὴν πέμπτην σφραγῖδα, εἶδον ὑποκάτω τοῦ θυσιαστηρίου τὰς ψυχὰς τῶν ἐσφαγμένων διὰ τὸν λόγον τοῦ θεοῦ καὶ διὰ τὴν ⸀μαρτυρίαν ἣν εἶχον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/009.yaml
  text: And when he opened the fifth seal[b][a], I saw under the altar the souls of those who had been slaughtered because of the word of God and because of the testimony they had.
translation:
  language: zh_hans
  text: 他揭开第五个印的时候，我看见祭坛下面那些因上帝的道、又因他们所持有的见证[b]而被宰杀[a]者的灵魂。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“被杀”。希腊语原词语气较强，也可带有献祭的意味，因此正文译作“被宰杀”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“证言”。希腊语原词既可指所作的见证，也可指见证的内容。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤνοιξεν
  choice: 揭开
  rationale: 在启示录连续开启印的场景中，“揭开”自然地表达把封闭之物开启，同时保留“印”的意象。
- source_word: σφραγῖδα
  choice: 印
  rationale: “印”是现代中文圣经语境中对 σφραγίς 的准确、简洁表达，适合启示文学中的封印意象。
- source_word: ὑποκάτω τοῦ θυσιαστηρίου
  choice: 祭坛下面
  rationale: 直接保留空间关系和献祭场景，不擅自说明祭坛属于天上还是地上。
- source_word: ψυχὰς
  choice: 灵魂
  rationale: 异象中约翰看见已死之人的 ψυχαί；“灵魂”保留这一具体异象，不将其泛化为“生命”或“人”，也不由此推演完整的人论。
- source_word: ἐσφαγμένων
  choice: 被宰杀
  rationale: σφάζω 比一般的“杀死”语气更强，并在启示录中带有明显的献祭联想；“被宰杀”与祭坛意象相呼应。
- source_word: διὰ τὸν λόγον τοῦ θεοῦ
  choice: 因上帝的道
  rationale: διά 加宾格在此表示原因；“因”简洁保留其因果意义。“上帝的道”保持 λόγος 在本书语境中的庄重表达。
- source_word: μαρτυρίαν ἣν εἶχον
  choice: 自己所持守的见证
  rationale: 直译“他们所有的见证”在现代中文中生硬；“所持守的”表达 εἶχον 的持续状态，又避免扩写为特定的讲道或行为。μαρτυρία 的“见证/证言”语义张力以脚注保留。
theological_decisions:
- issue: 异象中 ψυχὰς 的性质
  choice: 正文译作“灵魂”
  alternative: 生命；人
  rationale: “灵魂”最直接保留祭坛下殉道者在异象中的呈现方式，但不借此对死后状态作超出本节的系统性断言。
- issue: ἐσφαγμένων 的暴力及献祭色彩
  choice: 正文译作“被宰杀”
  alternative: 被杀；被杀害
  rationale: 较强的措辞保留希腊词的暴力程度，并使其与“祭坛”的献祭意象保持联系；脚注同时给出较传统、较平顺的译法。
- issue: μαρτυρία 的语义范围
  choice: 正文译作“见证”
  alternative: 证言
  rationale: “见证”既可指所宣认的内容，也可指作见证这件事，较能保留原词的开放性；“证言”则更突出所作陈述的内容。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“祭坛下面”“灵魂”等措辞保留原文的异象画面；“被宰杀”有意维持原词较强的力度及其与献祭场景的联系。脚注标记均紧随其对应词语，避免英文咨询层中标记位置错置的问题。
