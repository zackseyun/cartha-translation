id: REV.6.1
reference: Revelation 6:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ εἶδον ⸀ὅτε ἤνοιξεν τὸ ἀρνίον μίαν ἐκ τῶν ἑπτὰ σφραγίδων, καὶ ἤκουσα ἑνὸς ἐκ τῶν τεσσάρων ζῴων λέγοντος ὡς φωνῇ βροντῆς· ⸀Ἔρχου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/001.yaml
  text: And I saw when the Lamb opened one of the seven seals[a], and I heard one of the four living creatures saying with a voice like thunder, “Come.”
translation:
  language: zh_hans
  text: 我看见羔羊揭开七印中的一个时，就听见四个活物中的一个用雷鸣般的声音说：“来[a]！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“出去”，若这命令被理解为对骑马者而不是对约翰说的。
    reason: 保留Ἔρχου受话者不明确所产生的另一种可能译法。
lexical_decisions:
- source_word: ἀρνίον
  choice: 羔羊
  rationale: 在《启示录》中，这是指向耶稣的称号；“羔羊”自然、庄重，也不刻意强化该词形式上可能含有的微小意味。
- source_word: μίαν ἐκ τῶν ἑπτὰ σφραγίδων
  choice: 七印中的一个
  rationale: 这是部分结构，表示七个印之中的一个；此译法准确而符合现代汉语习惯。
- source_word: ζῴων
  choice: 活物
  rationale: 这里指宝座周围有生命的天上受造者，并非普通动物；“活物”既承接《启示录》的语境，也避免误解为一般牲畜或野兽。
- source_word: ὡς φωνῇ βροντῆς
  choice: 用雷鸣般的声音
  rationale: 保留声音与雷鸣之间的明喻，同时使中文表达自然有力。
- source_word: Ἔρχου
  choice: 来
  rationale: 这是该命令式最直接的含义；原文没有明确指出受话者，因此正文不补明对象。
- source_word: ὅτε
  choice: ……时
  rationale: 表达看见之事与羔羊揭印之间的时间关系，不额外解释为先后完成关系。
- source_word: εἶδον
  choice: 我看见
  rationale: 直接呈现叙事中的第一人称所见，不增添原文没有的“观看”等动作。
- source_word: ἤκουσα
  choice: 我听见
  rationale: 准确呈现第一人称叙事中的听觉动作。
- source_word: λέγοντος
  choice: 说
  rationale: 以自然汉语呈现分词的言说意义，不额外加强为“呼喊”。
theological_decisions:
- issue: 命令Ἔρχου的受话者与方向
  choice: 正文译为“来”，不指明受话者
  alternative: 若理解为对骑马者发出的命令，可译为“出去”或“出发吧”
  rationale: 希腊文最直接是“来”，但本节没有明说命令是对约翰还是对即将出现的骑马者发出。正文保留这种开放性，脚注说明另一种语境性理解。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“揭开”用于印封被开启的动作；“雷鸣般的声音”保留原文的强烈听觉意象。脚注标记紧随存在译法歧义的命令“来”。
