source:
  edition: SBLGNT
  text: καὶ ἐξῆλθεν ἄλλος ἵππος πυρρός, καὶ τῷ καθημένῳ ἐπ’ αὐτὸν ἐδόθη αὐτῷ λαβεῖν τὴν εἰρήνην ἐκ τῆς γῆς ⸀καὶ ἵνα ἀλλήλους ⸀σφάξουσιν, καὶ ἐδόθη αὐτῷ μάχαιρα μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/004.yaml
  text: And another horse came out[a], fiery red; and to the one sitting on it, it was given to take peace from the earth, so that they would slaughter one another[c][b], and a great sword was given to him.
translation:
  language: zh_hans
  text: 又有一匹火红如焰的马出来[a]。那骑在马上的得以从大地[b]夺去和平，使人彼此残杀[c]；又有一把大刀赐给了他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“红马”。希腊语πυρρός更具体地指火焰般的红色。
    reason: lexical_alternative
  - marker: b
    text: “大地”也可译作“土地”。希腊语γῆ两者皆可指；这里按《启示录》的普世性末世语境译作“大地”。
    reason: lexical_alternative
  - marker: c
    text: 译作“残杀”的希腊语动词比一般表示“杀死”的词更强烈，带有暴力流血、如同宰杀的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλος
  choice: 又有一匹
  rationale: 在连续展开的异象中，ἄλλος表示继前一匹之后出现、与之有别的另一匹马；“又有一匹”符合现代汉语叙事习惯。
- source_word: ἵππος πυρρός
  choice: 一匹马……火红如焰
  rationale: πυρρός不只是一般的红色，更带有火焰般赤红的色彩；“火红如焰”保留了鲜明的视觉意象。
- source_word: τῷ καθημένῳ ἐπ’ αὐτὸν
  choice: 骑在马上的那一位
  rationale: 原文是“坐在它上面的那一位”的分词结构；译文采用自然汉语表达，同时不额外界定其身份。
- source_word: ἐδόθη αὐτῷ
  choice: 被赐予／赐给了他
  rationale: 保留两处被动表达，不明说赐予者，也不添加原文未明说的“权柄”，从而维持《启示录》的神圣被动语气。
- source_word: λαβεῖν τὴν εἰρήνην ἐκ τῆς γῆς
  choice: 从大地夺去和平
  rationale: λαβεῖν与ἐκ搭配表达取走、夺去；“夺去”比“拿走”更符合战争异象的力度。γῆ在此按普世性的末世异象译为“大地”。
- source_word: ἵνα ἀλλήλους σφάξουσιν
  choice: 使人彼此残杀
  rationale: ἵνα在这里表达所造成或意在造成的结果；σφάζω具有宰杀、血腥杀戮的强烈意味，“残杀”比一般的“杀害”更贴近原文。
- source_word: μάχαιρα μεγάλη
  choice: 一把大刀
  rationale: μάχαιρα可指刀、短剑或用于杀戮的利刃；在此异象中，“大刀”自然清楚，并保留μεγάλη所强调的巨大或重大形象。
theological_decisions:
- issue: 两处ἐδόθη的神圣被动
  choice: 保留被动措辞，不明说赐予者
  alternative: 译作“上帝赐给他”或补出“权柄赐给他”
  rationale: 原文只说“被赐予／赐给”，虽可能暗示上帝的主权许可，却没有明说施事者或“权柄”。保留被动能维持原文在神圣主权、许可与灾祸施行之间的张力。
- issue: ἵνα所表达的目的或结果
  choice: 译作“使人彼此残杀”
  alternative: 译作“好让人彼此残杀”或“以致人彼此残杀”
  rationale: ἵνα在此可带目的或结果意味。“使”保留因果关联而不严格限定为单纯目的或单纯结果。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。句式保留异象叙事中反复出现的“赐予”被动结构，同时用“火红如焰”“夺去和平”“彼此残杀”等普通读者易懂而有力度的表达；不补明施事者，也不加入特定宗派解释。
