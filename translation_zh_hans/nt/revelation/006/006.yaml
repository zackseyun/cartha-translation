id: REV.6.6
reference: Revelation 6:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἤκουσα ⸀ὡς φωνὴν ἐν μέσῳ τῶν τεσσάρων ζῴων λέγουσαν· Χοῖνιξ σίτου δηναρίου, καὶ τρεῖς χοίνικες ⸀κριθῶν δηναρίου· καὶ τὸ ἔλαιον καὶ τὸν οἶνον μὴ ἀδικήσῃς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/006.yaml
  text: And I heard what seemed to be a voice in the midst of the four living creatures[a], saying, “A quart of wheat for a denarius, and three quarts of barley for a denarius[c][b]; and do not harm the oil and the wine.”
translation:
  language: zh_hans
  text: 我听见在四个活物中间仿佛有声音说：“一升[b]小麦一个第纳尔[a]，三升大麦一个第纳尔；不可损害油和酒[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 第纳尔是古罗马银币，通常约相当于普通工人一天的工资；这里的价格显示粮食严重短缺。
    reason: cultural_note
  - marker: b
    text: 原文为古代干量单位χοῖνιξ，约合一升，通常被认为大致是一人一天所需的谷物口粮。
    reason: cultural_note
  - marker: c
    text: “损害”也可译作“伤害”或“损坏”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς φωνὴν
  choice: 仿佛有声音
  rationale: ὡς表示听觉上的相似或感知，译作“仿佛有声音”既自然，也不武断认定说话者的身份。
- source_word: ἐν μέσῳ τῶν τεσσάρων ζῴων
  choice: 四个活物中间
  rationale: ἐν μέσῳ具有“在……中间”的空间意义；ζῷα在《启示录》的宝座异象中指有生命的异象性存在，译作“活物”可避免与后文敌对的“兽”混淆。
- source_word: Χοῖνιξ
  choice: 一升
  rationale: χοῖνιξ是约合一升的古代干量，也常被视为一人一天的谷物口粮；正文采用易懂的近似现代容量，脚注说明其历史含义。
- source_word: σίτου
  choice: 小麦
  rationale: σῖτος在这里与大麦相对，明确译作“小麦”。
- source_word: δηναρίου
  choice: 卖一个第纳尔
  rationale: 这是表示价格的属格；“卖一个第纳尔”以自然汉语传达标价含义，同时保留古代钱币名称。
- source_word: τρεῖς χοίνικες κριθῶν
  choice: 三升大麦
  rationale: 重复使用同一近似容量单位，并把κριθαί所指的谷物译为“大麦”，清楚呈现两种谷物的相对价格。
- source_word: μὴ ἀδικήσῃς
  choice: 不可损坏
  rationale: ἀδικέω可表示亏负、伤害或损坏；以油和酒为宾语时，“损坏”自然地表达禁止使这些物资受损，同时保留命令的宽泛性。
- source_word: τὸ ἔλαιον
  choice: 油
  rationale: ἔλαιον在当时通常指橄榄油；正文简洁译作“油”，不添加原文未明说的限定。
- source_word: τὸν οἶνον
  choice: 酒
  rationale: οἶνος通常指葡萄酒；汉语“酒”在此足以表达原文，同时保持简洁。
theological_decisions:
- issue: 宝座异象中ζῴων的译法
  choice: 活物
  alternative: 兽；动物
  rationale: “活物”既反映这些存在是有生命的，也避免读者把它们与《启示录》后文敌对的兽混为一谈。
- issue: 古代容量与钱币的处理
  choice: 容量用近似现代单位“升”，钱币保留“第纳尔”
  alternative: 两者都音译；或两者都换算成现代单位
  rationale: 这一处理兼顾可读性和历史语境：容量可直接理解，而第纳尔的工资价值无法准确折算成现代货币，宜由脚注解释。
- issue: 油和酒不受损坏这一命令的范围
  choice: 保留命令本身，不说明其象征对象或原因
  alternative: 解释为保护奢侈品、富人财物或特定农作物
  rationale: 原文只命令不可损坏油和酒，并未明说原因；译文不加入某种特定末世论或社会经济解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“仿佛有声音”保留原文对听觉感知的含蓄表达；报价句使用“卖……第纳尔”的自然汉语结构，突出严重匮乏而不在正文中加入解释。
