id: REV.6.5
reference: Revelation 6:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἤνοιξε τὴν σφραγῖδα τὴν τρίτην, ἤκουσα τοῦ τρίτου ζῴου λέγοντος· Ἔρχου. καὶ ⸀εἶδον, καὶ ἰδοὺ ἵππος μέλας, καὶ ὁ καθήμενος ἐπ’ αὐτὸν ἔχων ζυγὸν ἐν τῇ χειρὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/005.yaml
  text: And when he opened the third seal[a], I heard the third living creature saying, “Come.” And I looked, and behold, a black horse[b], and the one sitting on it had a pair of scales in his hand.
translation:
  language: zh_hans
  text: 羔羊揭开第三印时，我听见第三个活物说：“来！”[a] 我观看，看哪，一匹黑马；骑在马上的人手里拿着一架天平。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “来”也可理解为“到这里来”。这命令可能是对约翰说的，也可能是在召唤马和骑马者。
    reason: alternative_reading
  - marker: b
    text: 或译“一杆秤”。希腊词也可指“轭”；但在这里，结合下一节按量分配粮食的情景，很可能指称量食物的衡器。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤνοιξε
  choice: 揭开
  rationale: 用于“印”时，“揭开”自然地表达开启封印，并与启示录上下文相符。
- source_word: σφραγῖδα τὴν τρίτην
  choice: 第三印
  rationale: 直接保留原文的次序与启示录中一系列印的意象。
- source_word: ζῴου
  choice: 活物
  rationale: 这是启示录宝座异象中这些有生命之存在的惯用且简洁的中文称呼，不把它们误作普通动物。
- source_word: Ἔρχου
  choice: 来！
  rationale: 保留原文简短有力的命令，不补明受话者，维持其歧义。
- source_word: εἶδον
  choice: 我观看
  rationale: 准确表达异象中的观看动作，并与随后引人注意的“看哪”自然衔接。
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留启示文学中突显新景象的指示和惊叹力量。
- source_word: ἵππος μέλας
  choice: 一匹黑马
  rationale: 直译颜色和名词，保存异象中不可省略的象征细节。
- source_word: ὁ καθήμενος ἐπ’ αὐτὸν
  choice: 骑在马上的人
  rationale: 贴近原文“坐在其上的那一位”的分词结构，同时用现代中文清楚表达骑乘关系。
- source_word: ζυγὸν
  choice: 一架天平
  rationale: ζυγός可指轭或衡器；结合下一节称量粮食的语境，此处指用于称量的天平。
- source_word: ἐν τῇ χειρὶ αὐτοῦ
  choice: 手里拿着
  rationale: 以自然中文表达“在他手中持有”，不改变动作与所属关系。
theological_decisions:
- issue: 命令Ἔρχου的受话者
  choice: 只译作“来！”，不说明对谁说
  alternative: 可理解为叫约翰过来观看，也可理解为召唤马和骑马者出来
  rationale: 希腊文没有明说受话者；正文保留这种真实歧义，脚注列出两种主要理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“羔羊”补出希腊文省略的主语，其所指由前文明确；用“活物”“看哪”等保留启示录既有的异象语体。所有脚注标记均置于相应正文处。
