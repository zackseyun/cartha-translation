  text: καὶ οἱ ἀστέρες τοῦ οὐρανοῦ ἔπεσαν εἰς τὴν γῆν, ὡς συκῆ ⸀βάλλει τοὺς ὀλύνθους αὐτῆς ὑπὸ ἀνέμου μεγάλου σειομένη,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/013.yaml
  text: and the stars of heaven fell to the earth[a], as a fig tree drops its unripe figs when shaken by a strong wind,
translation:
  language: zh_hans
  text: 天上的星辰坠落到地上，就像无花果树被强风摇动时抛落未成熟的无花果[a]一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“冬无花果”“青无花果”或“晚季无花果”；希腊语这个词指未成熟、在成熟前被摇落的无花果。
    reason: 保留ὀλύνθους可能指称的不同类别，同时说明其在本句中的共同词义核心。
lexical_decisions:
- source_word: ἀστέρες
  choice: 星辰
  rationale: 保留“星”的通常词义及启示文学中的宇宙性意象，不把它解释为天使或统治者；“星辰”也符合庄重语体。
- source_word: τοῦ οὐρανοῦ
  choice: 天上的
  rationale: οὐρανός可指天空或天；“天上的”既自然，又保留原文宏大的宇宙语域。
- source_word: ἔπεσαν εἰς τὴν γῆν
  choice: 坠落在地上
  rationale: 表达由上而下落向大地的动态；“坠落”比一般的“落”更能传达此处剧烈的末世图景。
- source_word: ὡς
  choice: 仿佛
  rationale: 自然地引出明喻，并保持庄重、流畅的现代汉语表达。
- source_word: συκῆ
  choice: 无花果树
  rationale: 该名词的标准对应词，语境没有要求采用其他译法。
- source_word: βάλλει
  choice: 落下
  rationale: βάλλω本可表示投、抛；用于树木与果实时，译作“落下”符合现代汉语习惯，也准确表达结果。
- source_word: ὀλύνθους
  choice: 未成熟的果子
  rationale: 该词指未成熟、未到时令便脱落的无花果；上下文已明说无花果树，正文用“果子”避免汉语中“无花果树落下未成熟的无花果”略显累赘，同时以脚注保留词义细节。
- source_word: ὑπὸ ἀνέμου μεγάλου
  choice: 被狂风
  rationale: μέγας形容风时表示强劲；“狂风”简洁自然，能传达风力之大。
- source_word: σειομένη
  choice: 摇动
  rationale: 现在时被动分词修饰无花果树；“被狂风摇动”自然体现被动及伴随情状。
theological_decisions:
- issue: 星辰坠地的启示文学意象
  choice: 按词面保留“天上的星辰坠落在地上”
  alternative: 把“星辰”解释为天使、掌权者或其他象征对象
  rationale: 原文呈现宇宙性的启示文学图景，却没有在本句内解释象征所指；译文不替读者消解这种神学与文学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“星辰”“坠落”“仿佛”保持启示文学的宏大语气；句序稍作汉语化处理，将“被狂风摇动”置于“落下”之前，使比喻关系清楚流畅。
