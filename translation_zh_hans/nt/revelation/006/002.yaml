source:
  edition: SBLGNT
  text: καὶ ⸂εἶδον, καὶ⸃ ἰδοὺ ἵππος λευκός, καὶ ὁ καθήμενος ἐπ’ αὐτὸν ἔχων τόξον, καὶ ἐδόθη αὐτῷ στέφανος, καὶ ἐξῆλθεν νικῶν καὶ ἵνα νικήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/002.yaml
  text: And I looked[a], and behold, a white horse, and the one sitting on it had a bow, and a crown was given to him[b], and he went out conquering and to conquer.
translation:
  language: zh_hans
  text: 我观看，看哪，一匹白马；骑在马上的那一位手持弓，有冠冕赐给他[a]。他出去，正在得胜，为要得胜[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “冠冕”所译的希腊词στέφανος常指花冠或得胜者所得的冠冕，不一定是象征王权的王冠。
    reason: lexical_alternative
  - marker: b
    text: 经文没有说明这位骑士是谁；对于他的身份，历来有多种不同解释。
    reason: interpretive_ambiguity
lexical_decisions:
- source_word: εἶδον
  choice: 我观看时
  rationale: 按ὁράω的视觉含义译出，并与后面的ἰδού自然衔接；“观看时”也符合异象叙事的连续展开。
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留该提示词唤起注意、呈现异象突现的语篇功能，也维持启示文学庄重鲜明的语气。
- source_word: ἵππος λευκός
  choice: 一匹白马
  rationale: 自然对应无冠词、首次出现的名词短语；量词“匹”符合现代汉语习惯。
- source_word: ὁ καθήμενος ἐπ’ αὐτὸν
  choice: 骑在马上的
  rationale: 以自然汉语表达“坐在其上的那一位”，不额外说明其身份。
- source_word: ἔχων τόξον
  choice: 手持弓
  rationale: 准确表达ἔχω在此处的持有状态，并使异象画面简洁鲜明。
- source_word: ἐδόθη αὐτῷ στέφανος
  choice: 有冠冕赐给了他
  rationale: 保留神学被动式及原文受赐次序；“冠冕”可涵盖胜利花冠的语义，同时避免直接译成王权性的“王冠”。
- source_word: ἐξῆλθεν
  choice: 他便出去
  rationale: 按叙事视角表达向外而去；“便”顺接受冠与行动。
- source_word: νικῶν
  choice: 得胜
  rationale: νικάω既可表示战胜、征服，也可表示得胜；此处用“得胜”保留启示录中该词较宽的语义范围，避免过度限定为军事征服。
- source_word: ἵνα νικήσῃ
  choice: 并要继续得胜
  rationale: 在自然汉语中传达ἵνα加虚拟式所表达的趋向、目的或预期结果；“继续”呈现与前一分词νικῶν之间的递进关系，但不将其严格限定为单一语法类别。
theological_decisions:
- issue: 白马骑士的身份
  choice: 正文不指明其身份
  alternative: 基督或类似基督的形象；征服者或帝国势力；敌基督或迷惑人的征服者
  rationale: 原文只描写骑士的装备、受冠和行动，并未说明他是谁；译文不把任何有争议的解释写入正文。
- issue: στέφανος所表达的冠冕性质
  choice: 正文译作“冠冕”，脚注说明常与得胜有关
  alternative: 得胜者的冠冕；花冠；王冠
  rationale: στέφανος通常不是表示君王权位的διάδημα。正文采用包容性较强且庄重自然的“冠冕”，脚注交代其常见的胜利含义。
- issue: νικῶν καὶ ἵνα νικήσῃ的关系
  choice: “得胜，并要继续得胜”
  alternative: “征服，并为了征服”；“得胜，为要得胜”
  rationale: 原文将现在分词与ἵνα从句并列，兼有正在得胜与朝向进一步得胜的张力；译文避免把目的与结果的可能性完全锁定。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“看哪”保留启示文学的突现感；分号划分异象呈现与骑士行动。正文中的[a]、[b]均有对应脚注，并避免为骑士身份作宗派性判定。
