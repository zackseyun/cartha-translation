id: REV.6.8
reference: Revelation 6:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ⸂εἶδον, καὶ⸃ ἰδοὺ ἵππος χλωρός, καὶ ὁ καθήμενος ἐπάνω αὐτοῦ ὄνομα αὐτῷ ὁ Θάνατος, καὶ ὁ ᾅδης ἠκολούθει ⸂μετ’ αὐτοῦ⸃, καὶ ἐδόθη ⸀αὐτοῖς ἐξουσία ἐπὶ τὸ τέταρτον τῆς γῆς, ἀποκτεῖναι ἐν ῥομφαίᾳ καὶ ἐν λιμῷ καὶ ἐν θανάτῳ καὶ ὑπὸ τῶν θηρίων τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/008.yaml
  text: And I looked, and behold, a pale green horse, and the name of the one seated on it was Death, and Hades was following with him. And authority was given to them over a fourth of the earth, to kill with sword and with famine and with pestilence and by the wild beasts of the earth.
translation:
  language: zh_hans
  text: 我观看，看哪，有一匹灰绿色的马[a]；骑在马上的那一位名叫“死亡”，阴间也跟随着他。他们被赐予权柄，可以辖制地上的四分之一，用刀剑、饥荒、瘟疫[b]和地上的野兽杀人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一匹苍白的马。”希腊文χλωρός本指绿色或带绿色的苍白色，在这里让人联想到病态、尸体般的灰绿色。
    reason: lexical_alternative
  - marker: b
    text: 或译：“死亡。”这里的“瘟疫”按旧约审判清单的惯用法翻译，尤其呼应《以西结书》十四章。
    reason: alternative_reading
lexical_decisions:
- source_word: χλωρός
  choice: 灰绿色
  rationale: 该词本义为绿色或带绿色的苍白色；在此既保留颜色成分，也传达病态、尸体般的色泽。脚注列出较简洁的译法。
- source_word: ὁ καθήμενος ἐπάνω αὐτοῦ
  choice: 骑在马上的那一位
  rationale: 按希腊文的分词表达译出所指人物，同时比直译“坐在它上面的”更符合现代汉语叙事。
- source_word: ὄνομα αὐτῷ ὁ Θάνατος
  choice: 名字叫“死亡”
  rationale: 保留命名公式，并以引号显示“死亡”在这里是骑马者的名字和拟人化称谓。
- source_word: ᾅδης
  choice: 阴间
  rationale: 指死者所在之境，不等同于最终刑罚之地；“阴间”在现代中文圣经语境中能保留这一区别。
- source_word: μετ’ αὐτοῦ
  choice: 跟随着他
  rationale: 结合前面的动词“跟随”表达陪同而行；不擅自具体化为在他身后多远或以何种方式跟随。
- source_word: ἐδόθη αὐτοῖς ἐξουσία
  choice: 权柄赐给了他们
  rationale: ἐξουσία强调获授的权限或管辖权；保留被动式，以呈现启示录中常见的神圣被动表达。
- source_word: ἐπὶ τὸ τέταρτον τῆς γῆς
  choice: 辖制地上的四分之一
  rationale: 介词短语与“权柄”相连，表达其管辖范围；“地上”在此指全地而非仅某一地区。
- source_word: ἀποκτεῖναι
  choice: 杀人
  rationale: 在所列灾害手段的语境中，明确表达杀害人的意思，符合现代汉语。
- source_word: ἐν ῥομφαίᾳ
  choice: 用刀剑
  rationale: 以自然汉语表达工具或手段，并与后续灾害项目组成并列。
- source_word: ἐν λιμῷ
  choice: 饥荒
  rationale: λιμός在此指造成广泛死亡的饥荒，而非个人主观的饥饿感。
- source_word: ἐν θανάτῳ
  choice: 瘟疫
  rationale: 虽然字面为“死亡”，但在以西结书审判清单的七十士译本背景中可惯用地指瘟疫；脚注保留字面译法。
- source_word: ὑπὸ τῶν θηρίων τῆς γῆς
  choice: 地上的野兽
  rationale: 保留与前三项不同的施动表达，意为人被地上的野兽杀害。
theological_decisions:
- issue: ᾅδης的译法
  choice: 阴间
  alternative: 地狱；坟墓；死人之境
  rationale: 本节区分拟人化的“死亡”和跟随他的死者之境。译作“地狱”容易将其与最终审判混同，译作“坟墓”则可能把范围缩为实体墓穴。
- issue: ἐν θανάτῳ在审判清单中的含义
  choice: 瘟疫
  alternative: 死亡
  rationale: 此处呼应以西结书十四章一类“刀剑、饥荒、恶兽、瘟疫”的审判清单，因此采用语境中的惯用义“瘟疫”；同时用脚注保留字面可能性，避免掩盖文本张力。
- issue: 权柄的授予者
  choice: 保留“权柄赐给了他们”的被动式
  alternative: 上帝赐给他们权柄
  rationale: 原文没有明说授予者。保留被动式既符合启示录的表达习惯，也不在正文中补入原文未明说的主语。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“我观看，看哪”保留异象叙事的重复与突显语气；用“灰绿色”保留χλωρός的真实颜色信息，以脚注说明传统的“苍白”译法。句法适度顺应汉语，但保留“权柄赐给了他们”的被动结构及原文未明说授予者的含蓄性。
