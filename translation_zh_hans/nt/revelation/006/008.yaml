- from: 我观看，看哪，有一匹灰绿色的马[a]；骑在马上的那一位，名字叫“死亡”，阴间跟随着他。权柄赐给了他们，使他们可以辖制地上的四分之一，用刀剑、饥荒、瘟疫[b]和地上的野兽杀人。
  to: 我观看，看哪，有一匹灰绿色的马[a]；骑在马上的那一位名叫“死亡”，阴间也跟随着他。他们被赐予权柄，可以辖制地上的四分之一，用刀剑、饥荒、瘟疫[b]和地上的野兽杀人。
