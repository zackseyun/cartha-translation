  text: Καὶ ὅτε ἤνοιξεν τὴν ⸂σφραγῖδα τὴν δευτέραν⸃, ἤκουσα τοῦ δευτέρου ζῴου λέγοντος· Ἔρχου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/003.yaml
  text: And when he opened the second seal[a], I heard the second living creature saying, “Come.”
translation:
  language: zh_hans
  text: 他揭开第二印的时候，我听见第二个活物说：“来吧！”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可按语境理解为“去吧！”。有些人认为这命令是对骑马者发出的，而不是召唤某人上前来。
    reason: 保留Ἔρχου在具体语境中因受命者不明确而产生的另一种理解。
lexical_decisions:
- source_word: Καὶ
  choice: （不单独译出）
  rationale: 希腊文以连接词承接前文；现代汉语在此无需另加“然后”或“又”，时间从句已经自然保持叙事的连续性。
- source_word: ὅτε
  choice: ……的时候
  rationale: 表达事件发生的时间关系，符合现代汉语叙事习惯，也不把它强化为“之后”。
- source_word: ἤνοιξεν
  choice: 他揭开
  rationale: ἀνοίγω的基本意思是“打开”。中文谈到封印时，“揭开”自然且贴近原文，没有采用更具解释性的“破除”。主语沿用原文的“他”，不在本节补入原文未明说的身份。
- source_word: σφραγῖδα τὴν δευτέραν
  choice: 第二印
  rationale: 简洁自然地表达带定冠词的序数结构，并与《启示录》上下文中的印保持一致。
- source_word: ἤκουσα
  choice: 我听见
  rationale: 准确表达叙事语境中的简单过去事件；“听见”比“聆听”更符合这里的非意志性感知。
- source_word: τοῦ δευτέρου ζῴου
  choice: 第二个活物
  rationale: ζῷον在《启示录》中指宝座周围的特殊生命体，并非普通动物；“活物”是准确、简明且不会误导为一般牲畜的译法。
- source_word: λέγοντος
  choice: 说
  rationale: 以自然汉语表达依附于“我听见”的现在分词，不生硬保留希腊语分词结构。
- source_word: Ἔρχου
  choice: 来吧！
  rationale: ἔρχομαι的命令式最直接的意思是“来”。“吧”使中文命令语气自然，但不指定受命者；语境性的另一种理解放入脚注。
theological_decisions:
- issue: 开启印的叙述中Ἔρχου的译法及受命者
  choice: 正文译“来吧！”
  alternative: 按语境理解为“去吧！”
  rationale: 希腊词最自然的词义是“来”，但上下文并未在本句明确指出受命者。有些人认为命令是向骑马者发出的，因而中文可按功能理解为“去吧”。正文保留词汇上的直接意义，脚注交代语境上的另一种理解，不替读者消除原有的含混。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“他”保留原文主语的简洁性；“第二个活物”与前文异象用语衔接；引语使用自然的命令语气，同时由脚注保留解释空间。
