  text: καὶ ὁ οὐρανὸς ἀπεχωρίσθη ὡς βιβλίον ἑλισσόμενον, καὶ πᾶν ὄρος καὶ νῆσος ἐκ τῶν τόπων αὐτῶν ἐκινήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/014.yaml
  text: And the sky vanished like a scroll being rolled up[c][b][a], and every mountain and island was moved from its place.
translation:
  language: zh_hans
  text: 天空退去[a]，如同书卷被卷起来一样[b]；每一座山岭和每一个海岛都被移离各自的位置[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“天空分开了”或“天空离开了”。希腊文可表示分离，也可表示退离。
    reason: lexical_alternative
  - marker: b
    text: 这里的“书卷”指古代可卷起的卷轴，并非现代装订成册的书。
    reason: cultural_note
  - marker: c
    text: 希腊文直译“离开它们的位置”；“各自的位置”表达每一座山岭和每一个海岛都被移离原处。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐρανὸς
  choice: 天空
  rationale: 此处描绘末世异象中地上可见的穹苍；“天空”既符合宇宙震动的画面，也避免把重点误解为上帝居所本身发生改变。
- source_word: ἀπεχωρίσθη
  choice: 退去
  rationale: 该动词可表达离开、退去或分离。结合书卷卷起的比喻，“退去”自然呈现天空从原处撤离的异象，同时不把动作过度限定为裂开或消失。
- source_word: βιβλίον
  choice: 书卷
  rationale: 在一世纪语境中，此词在这里指可卷起的卷轴，而不是现代装订成册的书；“书卷”兼顾历史形态与庄重文体。
- source_word: ἑλισσόμενον
  choice: 卷起来
  rationale: 该分词表示被卷起或卷拢；此译清楚呈现书卷收卷的动态画面。
- source_word: πᾶν ὄρος καὶ νῆσος
  choice: 所有山岭和海岛
  rationale: πᾶν与单数名词连用具有逐一涵盖的分配意义；现代汉语用“所有……都”表达最为自然。
- source_word: ἐκ τῶν τόπων αὐτῶν
  choice: 离各自的位置
  rationale: 希腊文直译为“离开它们的位置”，其中复数表达每一座山岭和每一个海岛都离开本位；“各自的位置”在汉语中准确保留这一分配意义。
- source_word: ἐκινήθησαν
  choice: 被移离
  rationale: κινέω在此结合“离开位置”表示地点被挪动，不只是震动；“被移离”明确表达位移，并保留被动语态。
theological_decisions:
- issue: 启示文学中οὐρανός所指的范围
  choice: 译作“天空”
  alternative: 译作“天”或“天界”
  rationale: 上下文聚焦可见宇宙秩序的剧烈变动；“天空”保持异象画面，又不额外断定上帝居所遭到改变。
- issue: 天空所发生动作的性质
  choice: 译作“退去”，并以脚注保留“分开”的可能
  alternative: 译作“裂开”“分离”或“消失”
  rationale: ἀπεχωρίσθη可指分离或撤离，书卷卷起的比喻也没有明确交代具体的宇宙机制；“退去”配合脚注可保留原文的语义张力，而不把它解释成毁灭或单纯开裂。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“仿佛……一样”清楚标示明喻；分号区分天空退去与地貌移位两个并列异象。“山岭”比单用“山”略具书面庄重感，但仍属普通现代汉语。
