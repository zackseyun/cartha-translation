id: REV.6.11
reference: Revelation 6:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἐδόθη αὐτοῖς ἑκάστῳ στολὴ λευκή, καὶ ἐρρέθη αὐτοῖς ἵνα ⸀ἀναπαύσονται ἔτι χρόνον ⸀μικρόν, ἕως ⸀πληρωθῶσιν καὶ οἱ σύνδουλοι αὐτῶν καὶ οἱ ἀδελφοὶ ⸀αὐτῶν οἱ μέλλοντες ⸀ἀποκτέννεσθαι ὡς καὶ αὐτοί.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/011.yaml
  text: And a white robe was given to each of them[a], and they were told that they should rest a little longer, until their fellow slaves and their brothers, who are about to be killed just as they were[c][b], should also be completed.
translation:
  language: zh_hans
  text: 每人都获赐了一件白袍；他们又被吩咐再安歇片刻，直到他们那些同作奴仆者和弟兄们——就是将要像他们一样被杀的人——也得以齐全[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “得以齐全”：原文直译可作“被充满／被完成”。也可理解为“他们同作奴仆者和弟兄的数目满了”，但原文没有明说“数目”。
    reason: alternative_reading
  - marker: b
    text: “弟兄们”原文为阳性复数；在这里可能广泛指同信的人，包括女性。
    reason: lexical_alternative
lexical_decisions:
- source_word: στολὴ λευκή
  choice: 一件白袍
  rationale: στολή指长袍一类的衣服；“白袍”简洁自然，也符合《启示录》中的象征性语境。
- source_word: ἑκάστῳ
  choice: 他们每人
  rationale: 体现单数与格的分配意义，即每一个人都领受一件。
- source_word: ἐρρέθη αὐτοῖς
  choice: 有人告诉他们
  rationale: 用汉语不定施事结构自然表达希腊语被动式，同时不擅自指明说话者。
- source_word: ἀναπαύσονται ἔτι χρόνον μικρόν
  choice: 要再安歇片刻
  rationale: “安歇”保留停止劳苦、得到休息的含义；“再……片刻”表达ἔτι与χρόνον μικρόν的时间意义。
- source_word: πληρωθῶσιν
  choice: 也都齐全了
  rationale: 表达群体达到完整状态，却不在正文中添加原文没有明说的“数目”；其被动及“充满／完成”的歧义在脚注中保留。
- source_word: σύνδουλοι
  choice: 同作奴仆者
  rationale: 保留σύνδουλος所表达的共同隶属于同一主人的关系；“奴仆”兼顾受约束的身份和现代中文的可读性。
- source_word: ἀδελφοὶ
  choice: 弟兄
  rationale: 对应阳性复数ἀδελφοί，不在正文中扩写为“弟兄姊妹”；可能包含女性信徒的语用范围以脚注说明。
- source_word: μέλλοντες ἀποκτέννεσθαι
  choice: 将要……被杀的人
  rationale: 准确表达μέλλω加不定式的将临、预期意义，并保留ἀποκτέννεσθαι的被动语态，不强化为“注定被杀”。
- source_word: ὡς καὶ αὐτοί
  choice: 像他们一样
  rationale: 自然表达比较关系，所指是这些殉道者也曾被杀。
theological_decisions:
- issue: πληρωθῶσιν表示群体完成还是数目满额
  choice: 正文译作“也都齐全了”
  alternative: “也都应验了”或“数目也满了”
  rationale: 原文没有“数目”一词，因此正文不把数目满额这一合理理解写死；同时避免把用于人的动词误解为道德上的完全。
- issue: ἀδελφοί是否在正文明确包含女性
  choice: 译作“弟兄”，并以脚注说明其语用范围
  alternative: “弟兄姊妹”或“众信徒”
  rationale: 保留希腊语阳性复数的形式，同时承认早期基督徒用语中该词可以泛指包括女性在内的信徒群体。
- issue: σύνδουλοι中的奴属意象
  choice: 译作“同作奴仆者”
  alternative: “同作仆人的人”
  rationale: 此处共同归属于同一位主人的意象具有神学分量；“奴仆”比单纯“仆人”更能保留这种受主权约束的关系，又不额外引入具体历史奴隶制度的细节。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“获赐”“安歇”略带庄严色彩，适合异象语境；“也都齐全了”有意保留原文关于完成方式的含混，脚注补足可能的数目解释。
