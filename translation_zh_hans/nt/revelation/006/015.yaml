  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ οἱ βασιλεῖς τῆς γῆς καὶ οἱ μεγιστᾶνες καὶ οἱ χιλίαρχοι καὶ οἱ πλούσιοι καὶ οἱ ἰσχυροὶ καὶ πᾶς δοῦλος καὶ ἐλεύθερος ἔκρυψαν ἑαυτοὺς εἰς τὰ σπήλαια καὶ εἰς τὰς πέτρας τῶν ὀρέων·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/015.yaml
  text: And the kings of the earth[a], and the great men, and the commanders, and the rich, and the strong, and every slave and free person[b], hid themselves in the caves and among the rocks of the mountains.
translation:
  language: zh_hans
  text: 地上的君王、权贵、将领、富有的人、有权势的人，以及所有奴隶和自由人，都躲藏在洞穴里和山岭的岩石间。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βασιλεῖς τῆς γῆς
  choice: 地上的君王
  rationale: γῆ可指“地”或“土地”；启示录宇宙性审判的语境以及书中反复出现的表达支持“地上的”。
- source_word: μεγιστᾶνες
  choice: 权贵
  rationale: 指身居高位、显赫的人。“权贵”自然简洁，又不把范围过度限定为世袭贵族。
- source_word: χιλίαρχοι
  choice: 将领
  rationale: 该词本指统领千人的军官；“将领”在现代汉语中自然地传达其军事指挥身份，而不拘泥于具体编制。
- source_word: πλούσιοι
  choice: 富足的
  rationale: 保留名词化形容词的并列形式，指富有的人；语体庄重且易懂。
- source_word: ἰσχυροὶ
  choice: 有权势的
  rationale: ἰσχυρός可表示强大、有能力或有势力；在社会阶层名单中，“有权势的”较自然，同时不与前面的“权贵”完全等同。
- source_word: πᾶς δοῦλος καὶ ἐλεύθερος
  choice: 所有为奴的和自由的
  rationale: 为奴与自由构成明确的社会身份对照。“所有”表达πᾶς的周全范围；名词化的“为奴的和自由的”在汉语中具有概括性，不限于男性。
- source_word: ἔκρυψαν ἑαυτοὺς
  choice: 都藏
  rationale: 自然表达反身动作；“都”承接整串复数主语，清楚表明各类人一同采取行动。
- source_word: εἰς τὰ σπήλαια
  choice: 在山洞里
  rationale: εἰς本可突出进入，但与“藏”搭配时，现代汉语用处所表达更自然，也保留进入后藏身其中的含义。
- source_word: εἰς τὰς πέτρας τῶν ὀρέων
  choice: 在山间的岩石中
  rationale: 表达藏身于群山岩石、石缝或岩层之间的景象，避免生硬地说“进入岩石”。
theological_decisions:
- issue: δοῦλος在“为奴者／自由者”对举中的译法
  choice: 为奴的
  alternative: 仆人；奴隶
  rationale: 与ἐλεύθερος直接对举时，受奴役的社会身份是重点。“为奴的”准确保留这种身份，又能与“自由的”形成自然对称。
- issue: πᾶς δοῦλος καὶ ἐλεύθερος的性别涵盖范围
  choice: 所有为奴的和自由的
  alternative: 每一个男奴和自由男子
  rationale: 希腊文虽采用阳性单数形式，但这是概括全体的固定社会身份对举。汉语译文保留其代表性范围，不无根据地限于男性。
- issue: ἰσχυροί所指的力量类型
  choice: 有权势的
  alternative: 强壮的；强大的
  rationale: 该词本身可涵盖力量与权能；在君王、权贵、将领和富人组成的名单中，译为“有权势的”符合语境，但不把其含义限定为单纯体力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留原文连续列举不同社会阶层的节奏，并用“以及……都……”使长主语在汉语中清晰顺畅。无需脚注；主要词义差异可在翻译决策中充分说明，正文没有必须标注的文本异读或不可兼容歧义。
