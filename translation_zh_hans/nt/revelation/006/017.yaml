  naturalness: “因为他们震怒的大日子已经到了，谁能站立得住呢？”是自然、庄重的现代普通话，也保有启示文学审判宣告的力度。“他们震怒的大日子”虽属较凝练的经文式属格表达，但在此语域中清晰可懂，无须为消除潜在歧义而作生硬扩展。
