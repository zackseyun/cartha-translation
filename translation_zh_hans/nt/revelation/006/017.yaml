  text: ὅτι ἦλθεν ἡ ἡμέρα ἡ μεγάλη τῆς ὀργῆς ⸀αὐτῶν, καὶ τίς δύναται σταθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/017.yaml
  text: because the great day of their wrath has come[a], and who is able to stand?
translation:
  language: zh_hans
  text: 因为他们震怒的大日子已经到了[a]，谁能站立得住呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些解释性译法作“他震怒的日子”；希腊原文作“他们震怒的日子”，共同指坐在宝座上的那一位和羔羊。
    reason: 说明解释性单数译法，并交代原文复数代词的所指。
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 引出上一节众人惊恐躲藏的原因；“因为”是现代汉语中自然明确的因果连接词。
- source_word: ἦλθεν
  choice: 已经到了
  rationale: 不定过去时在此宣告一个已经临到、其后果正在显现的事件；“已经到了”自然传达这种实现感。
- source_word: ἡ ἡμέρα ἡ μεγάλη
  choice: 大日子
  rationale: 保留定冠结构所强调的末世性重大日子，同时采用简洁、庄重的汉语表达。
- source_word: τῆς ὀργῆς
  choice: 震怒
  rationale: ὀργή在审判语境中不只是一般生气，而带有强烈、庄严的审判意味；“震怒”比“愤怒”更符合此处语域。
- source_word: αὐτῶν
  choice: 他们
  rationale: 原文明确使用复数代词，回指上一节“坐在宝座上的那一位”和“羔羊”；译文保留复数，不将其协调为单数。
- source_word: τίς
  choice: 谁
  rationale: 直接保留修辞问句的疑问代词，现代汉语自然清楚。
- source_word: δύναται
  choice: 能
  rationale: 准确表达能力或可能性，并与“站立得住”组成自然、庄重的现代汉语问句。
- source_word: σταθῆναι
  choice: 站立得住
  rationale: 基本义为“站立”；在审判语境中隐含承受审判而仍能立住之意。“站立得住”既保留形象，也自然表达持续承受的含义。
theological_decisions:
- issue: “震怒”的复数所有者同时指坐宝座者与羔羊
  choice: 保留“他们震怒”的复数表达
  alternative: 按单一神圣施行者理解，译作“他的震怒”
  rationale: 希腊文αὐτῶν明确为复数，并自然回指上一节所提到的坐宝座者和羔羊。虽然这种搭配在神学和汉语表达上都颇为醒目，译文仍应保存原文张力，不暗中将其化为单数。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“大日子”“震怒”保留启示文学与审判宣告的肃穆感；“站立得住”兼顾原文站立意象和自然汉语。脚注标记已置于相关短语之后。
