id: REV.6.7
reference: Revelation 6:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἤνοιξεν τὴν σφραγῖδα τὴν τετάρτην, ἤκουσα ⸀φωνὴν τοῦ τετάρτου ζῴου λέγοντος· ⸀Ἔρχου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/007.yaml
  text: And when he opened the fourth seal[a], I heard the voice of the fourth living creature saying, “Come.”
translation:
  language: zh_hans
  text: 当他揭开第四个印时，我听见第四个活物的声音说：“来！”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或可按语境理解为“出去吧”。希腊文直译是“来”，但这命令究竟是对约翰说的，还是对骑马者说的，原文没有明确说明。
    reason: 保留Ἔρχου受命者不明确所造成的另一种语境理解。
lexical_decisions:
- source_word: ἤνοιξεν
  choice: 揭开
  rationale: ἀνοίγω在揭开书卷封印的重复叙事公式中表示开启封印；“揭开”符合现代汉语搭配，也保留实际开启的动作。
- source_word: σφραγῖδα
  choice: 印
  rationale: σφραγίς在本段指封住书卷的印；“印”简洁、准确，并符合《启示录》语境中的惯用表达。
- source_word: τετάρτην / τετάρτου
  choice: 第四个
  rationale: 两处序数词均直译为“第四个”，使“第四个印”和“第四个活物”表达一致、自然。
- source_word: φωνὴν
  choice: 声音
  rationale: φωνή在此由“第四个活物的”加以限定，译作“第四个活物的声音”自然明确，不必增译为另一个说话者。
- source_word: ζῴου
  choice: 活物
  rationale: ζῷον在《启示录》中指宝座周围的有生命者；“活物”既是清楚的固定译法，也与表示兽类或怪兽的θηρίον保持区别。
- source_word: λέγοντος
  choice: 说
  rationale: 现在分词λέγοντος依附于“我听见……的声音”，汉语用“说”即可自然表达同时发生的言说动作。
- source_word: Ἔρχου
  choice: 来
  rationale: ἔρχου最直接的词义是“来”，且原文未明说受命者；用简短命令“来”可避免在正文中加入解释。
theological_decisions:
- issue: 命令Ἔρχου的受命者
  choice: 正文只译“来”，不指明受命者
  alternative: 理解为对约翰说“来”，或理解为命令骑马者“出来／出去吧”
  rationale: 希腊文只有命令式ἔρχου，没有明确指出受命者。保留这句裸露的命令，能够保存叙事上的含混和相关神学张力，而不替读者作出判断。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“当……时，我听见……”贴合希腊文结构，又符合自然汉语；“来！”保持异象场景中命令的简短有力。脚注标记置于其实际所解释的“来”之后。
