id: REV.6.10
reference: Revelation 6:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἔκραξαν φωνῇ μεγάλῃ λέγοντες· Ἕως πότε, ὁ δεσπότης ὁ ἅγιος καὶ ἀληθινός, οὐ κρίνεις καὶ ἐκδικεῖς τὸ αἷμα ἡμῶν ἐκ τῶν κατοικούντων ἐπὶ τῆς γῆς;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/010.yaml
  text: And they cried out with a loud voice[a], saying, “How long, Master, holy and true[b], will you refrain from judging and avenging our blood on those who dwell on the earth?”
translation:
  language: zh_hans
  text: 他们大声呼喊说：“圣洁、真实的主宰[a]啊，要到什么时候，你才审判住在地上的人[b]，并为我们的血向他们伸冤呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “主宰”原文为despotēs，强调拥有绝对权柄者；这个称呼不同于通常译作“主”的kyrios。也可译作“主人”。
    reason: 说明神圣称号的词义及其与另一常见希腊称号的区别。
  - marker: b
    text: “住在地上的人”是《启示录》中反复出现的称谓。原文介词结构也可较直译地理解为：从住在地上的人那里为我们的血追讨公道。
    reason: 保留ἐκ所表示的来源或追讨对象之间的语法张力，并提示这一称谓的主题性。
lexical_decisions:
- source_word: ἔκραξαν φωνῇ μεγάλῃ
  choice: 大声呼喊
  rationale: κράζω与φωνῇ μεγάλῃ共同突出声音洪亮、呼求迫切；“大声呼喊”在现代汉语中自然，并保留原文的强烈语气。
- source_word: Ἕως πότε
  choice: 要到什么时候
  rationale: 这是哀诉中质问行动为何迟延的惯用表达；比逐字译作“直到何时”更符合现代汉语。
- source_word: δεσπότης
  choice: 主宰
  rationale: 此词强调拥有权柄、掌管一切者，有别于通常译作“主”的κύριος；“主宰”既保留绝对权柄的意味，也适合作为对上帝的庄重称呼。
- source_word: ὁ ἅγιος καὶ ἀληθινός
  choice: 圣洁、真实的
  rationale: 两个形容词都作称呼者的属性；“真实”保留ἀληθινός可兼指真实、可靠的语义，不缩窄为仅仅“诚实”。
- source_word: οὐ κρίνεις καὶ ἐκδικεῖς
  choice: 你才审判……向他们追讨……呢
  rationale: 形式上是带οὐ的现在时疑问，但在“要到什么时候”之后表达对迟延行动的迫切追问；“才……呢”自然传达“为何还不”的语用力量，同时保留“审判”和“追讨”两个动作。
- source_word: τὸ αἷμα ἡμῶν
  choice: 我们的血债
  rationale: 原文直译为“我们的血”，是被杀流血的圣经惯用说法；汉语“我们的血债”保留血被追讨的司法和报应意象，也避免被误解为仅指体内的血液。
- source_word: ἐκ τῶν κατοικούντων ἐπὶ τῆς γῆς
  choice: 向住在地上的人
  rationale: ἐκ在ἐκδικέω的结构中标明追讨所针对或所出自的一方；“向……追讨”是自然汉语，并保留《启示录》反复出现的“住在地上的人”这一称谓。
theological_decisions:
- issue: 对上帝的称呼δεσπότης
  choice: 主宰
  alternative: 主人；主；至高的主
  rationale: “主宰”凸显绝对权柄，并维持δεσπότης与κύριος之间的词汇区别；不额外加入原文没有的“至高”等限定。
- issue: 殉道者求上帝施行公义的力度
  choice: 审判……追讨我们的血债
  alternative: 审判……为我们的血伸冤
  rationale: 原文同时包含审判和报偿、追究血债的强烈司法语言。采用“追讨血债”保留这一张力，不把诉求淡化为单纯恢复名誉，也不将其解释为个人私下报复。
- issue: οὐ在“要到什么时候”疑问中的作用
  choice: 用“才……呢”表达尚未行动和迫切催问
  alternative: 你还不……吗；你不……要到什么时候
  rationale: 原文可直观呈现为否定疑问，但整体是询问上帝延迟多久才行动。“才……呢”在汉语中自然表达这种延迟，不把它改写成上帝拒绝行动的断言。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。称呼部分用“圣洁、真实的主宰啊”保留祷告式呼语；全句以“要到什么时候……才……呢”呈现哀诉和迫切追问。避免古奥的“伸雪”或过度口语化表达。
