source:
  edition: SBLGNT
  text: καὶ εἴ τις οὐχ εὑρέθη ἐν ⸂τῇ βίβλῳ⸃ τῆς ζωῆς γεγραμμένος, ἐβλήθη εἰς τὴν λίμνην τοῦ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/015.yaml
  text: And if anyone was not found written in the book of life[b][a], he was thrown into the lake of fire.
translation:
  language: zh_hans
  text: 若查明有人名字没有记在生命册[a]上，这人就被扔进火湖。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “册”也可译作“书卷”。希腊语βίβλος既可指书册，也可指卷轴式书卷。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ τις
  choice: 若……有人
  rationale: 保留不定条件所表达的普遍、开放情形；“若……有人”在现代汉语中自然，也不把条件句改成绝对陈述。
- source_word: οὐχ εὑρέθη
  choice: 若查明……没有
  rationale: εὑρέθη是εὑρίσκω的简单过去时被动式。结合末日审判和查验记录的语境，“查明”既传达“被发现”的揭示、判定意味，又避免生硬的“没有被发现记在”。
- source_word: ἐν τῇ βίβλῳ τῆς ζωῆς
  choice: 在生命册上
  rationale: βίβλος可指书卷或书册；“生命册”是清楚、自然且广为理解的汉语表达。“在……上”符合汉语表达名单记录的习惯。
- source_word: γεγραμμένος
  choice: 记在
  rationale: 该完成时被动分词表示已经写下并仍留有记录的状态。“记在”比逐字的“写在”更符合名册语境，同时保留记录在册的含义。
- source_word: ἐβλήθη
  choice: 被扔进
  rationale: 保留βάλλω被动式所表达的强制投入动作；“扔进”是现代、清楚的说法，不采用略显古雅的“抛入”，也不以“猛掷”过度强化。
- source_word: εἰς τὴν λίμνην τοῦ πυρός
  choice: 进火湖里
  rationale: 直接保留启示录的末世审判意象，不对火湖的性质作额外神学解释。
- source_word: τις ... γεγραμμένος / ἐβλήθη
  choice: 有人……这人
  rationale: 以“这人”承接前面的不定单数“有人”，清楚保留个体、单数指向；汉语无需借性别代词表达希腊语的语法阳性。
theological_decisions:
- issue: 代表性单数与语法性别
  choice: 有人……这人
  alternative: 有人……他
  rationale: 希腊语以阳性单数形式承接不定代词，但在此并非特指男性。现代汉语用“这人”可保留代表性单数，同时不把希腊语语法性别误解为仅限男性。
- issue: 末后审判的意象
  choice: 火湖
  alternative: 燃烧着火的湖
  rationale: 原文直接使用“火湖”这一启示文学意象。译文照原样保留，不扩充说明最终刑罚的性质，也不引入任何宗派解释。
- issue: “被发现”结构的审判语气
  choice: 若查明有人没有记在
  alternative: 若有人没有被发现记在
  rationale: “查明”保留审查后显明结果的语气，并使汉语自然；没有将其解释为预定、除名或其他原文未明说的神学过程。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“若查明……这人就……”保持条件句结构；“生命册”“火湖”保留启示录中简洁鲜明的意象。
