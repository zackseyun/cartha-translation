  text: καὶ ἐκράτησεν τὸν δράκοντα, ⸂ὁ ὄφις ὁ ἀρχαῖος⸃, ὅς ἐστιν Διάβολος καὶ ὁ ⸀Σατανᾶς, καὶ ἔδησεν αὐτὸν χίλια ἔτη,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/002.yaml
  text: And he seized the dragon—that ancient serpent[a], who is the Devil and Satan—and bound him for a thousand years,
translation:
  language: zh_hans
  text: 他抓住那条龙，就是那条古蛇，也就是魔鬼和撒但，把它捆绑了一千年。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκράτησεν
  choice: 抓住
  rationale: κρατέω在这里表示有力地拿住、制伏；“抓住”简洁有力，并保留动作的具体性。
- source_word: τὸν δράκοντα
  choice: 那龙
  rationale: “龙”保留《启示录》的异象意象和书内用语的一致性；定冠词按汉语语境译为“那”。
- source_word: ὁ ὄφις ὁ ἀρχαῖος
  choice: 那古蛇
  rationale: 该短语与“那龙”构成同位说明；“那古蛇”自然、凝练，并呼应创世记中的蛇及《启示录》书内的称谓。
- source_word: Διάβολος
  choice: 魔鬼
  rationale: 这是现代汉语圣经语境中对该称号的通行译法，也保留其与“撒但”并列的形式。
- source_word: ὁ Σατανᾶς
  choice: 撒但
  rationale: 采用该名称在现代汉语中的通行音译，不把它意译或与“魔鬼”合并。
- source_word: ἔδησεν αὐτόν
  choice: 把它捆绑
  rationale: δέω的基本义是捆绑；此译保留具体意象，不预先解释这种约束的性质。“它”按现代汉语指代前文的龙。
- source_word: χίλια ἔτη
  choice: 一千年
  rationale: 直接表达时间长度，不在译文中判断这一千年应按字面还是象征理解。
theological_decisions:
- issue: 一千年的性质
  choice: 直译为“一千年”
  alternative: 在译文中说明为字面的一千年，或改写为象征性的时期
  rationale: 原文只明说“一千年”，没有在本节内裁定其字面或象征性质；译文应保留这一解释空间。
- issue: 龙的多重身份
  choice: 保留“龙—古蛇—魔鬼和撒但”的完整身份链条
  alternative: 将这些称谓简化或合并为单一名称
  rationale: 原文明列这些称谓来识别同一对象，译文不应删减或消解其中的互文联系。
- issue: 两个同位说明之间的关系
  choice: 用“就是……也就是……”清楚呈现同位关系
  alternative: 仅以连续逗号罗列称谓
  rationale: 这种表达符合现代汉语习惯，并明确表示“古蛇”“魔鬼和撒但”都在说明“那龙”，而不增加原文以外的身份判断。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“抓住”“捆绑”保留原文动作的力度与具体意象；句式以同位结构清楚呈现多重称谓，避免教派化解释。
