  text: Καὶ εἶδον θρόνον μέγαν λευκὸν καὶ τὸν καθήμενον ⸂ἐπ’ αὐτοῦ⸃, οὗ ἀπὸ ⸀τοῦ προσώπου ἔφυγεν ἡ γῆ καὶ ὁ οὐρανός, καὶ τόπος οὐχ εὑρέθη αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/011.yaml
  text: And I saw a great white throne and the one seated on it[a], from whose presence the earth and heaven fled, and no place was found for them.
translation:
  language: zh_hans
  text: '我又看见一个白色的大宝座和坐在上面的那一位；天地从他面前[a]逃走，没有地方可容纳它们。


    [a] 原文此处用“脸”或“面”一词；“从他面前”表达其在本句中的语境义。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文此处用“脸”或“面”一词；“从他面前”表达其在本句中的语境义。
    reason: 说明πρόσωπον的字面词义，并保留正文“面前”所传达的临在/面前之意。
lexical_decisions:
- source_word: θρόνον μέγαν λευκὸν
  choice: 一个白色的大宝座
  rationale: “大”兼顾规模与威严；按现代汉语习惯调整形容词次序，使表达自然庄重。
- source_word: τὸν καθήμενον ἐπ’ αὐτοῦ
  choice: 坐在上面的那一位
  rationale: 保留希腊文描述性的称呼，不擅自指明坐宝座者的身份；“那一位”在现代汉语中自然且庄重。
- source_word: ἀπὸ τοῦ προσώπου
  choice: 从他面前
  rationale: πρόσωπον字面为“面”，此处结构表达从某人临在或面前逃离；“从他面前”既自然，又保留原文的具象意味。
- source_word: ἔφυγεν
  choice: 逃走
  rationale: 保留φεύγω鲜明的动态意象，不将其解释性地译成“消失”。
- source_word: ἡ γῆ καὶ ὁ οὐρανός
  choice: 天地
  rationale: “天地”是现代汉语对地与天的自然、凝练表达，适合启示文学的宏大语境。
- source_word: τόπος οὐχ εὑρέθη αὐτοῖς
  choice: 再也找不到它们的所在
  rationale: 保留原文“地方未被找到”的被动含义和庄严语气；“它们”明确回指天地。
theological_decisions:
- issue: 坐宝座者的身份
  choice: 保留为“坐在上面的那一位”
  alternative: 明确译作“上帝”“父上帝”或“神圣的审判者”
  rationale: 本节没有直接点明其身份，因此不以译文消解原文保留的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“我又看见”承接启示录异象叙述；分号保留原文单句结构，同时清楚区分所见对象与随后发生的景象。
