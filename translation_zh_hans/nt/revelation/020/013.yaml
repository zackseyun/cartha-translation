source:
  edition: SBLGNT
  text: καὶ ἔδωκεν ἡ θάλασσα τοὺς νεκροὺς τοὺς ἐν αὐτῇ, καὶ ὁ θάνατος καὶ ὁ ᾅδης ἔδωκαν τοὺς νεκροὺς τοὺς ἐν αὐτοῖς, καὶ ἐκρίθησαν ἕκαστος κατὰ τὰ ἔργα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/013.yaml
  text: And the sea gave up the dead who were in it[a], and Death and Hades gave up the dead who were in them, and each one was judged according to their deeds.
translation:
  language: zh_hans
  text: 海交出了其中的死人；死亡和阴间[a]也交出了其中的死人。每个人都照着自己的行为受了审判。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “阴间”译自希腊文ᾅδης，指死者所在之域，与常译作“地狱”的其他词不同。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκεν / ἔδωκαν
  choice: 交出了
  rationale: δίδωμι的基本义是“给”，但这里描写海、死亡和阴间释放其所容纳的死人以接受审判；“交出了”在现代汉语中自然，并保留移交之意。
- source_word: ἡ θάλασσα
  choice: 海
  rationale: 按通常词义译为“海”；现代汉语无须用冠词表达希腊文定指。
- source_word: τοὺς νεκρούς
  choice: 死人
  rationale: 形容词名词化，指已经死去的人；“死人”简洁、清楚，并符合本节末世异象的语境。
- source_word: τοὺς ἐν αὐτῇ / τοὺς ἐν αὐτοῖς
  choice: 其中的死人
  rationale: 以“其中的”自然表达地点关系，同时保留两组死人的限定结构。
- source_word: ὁ θάνατος
  choice: 死亡
  rationale: 直译为“死亡”；与“阴间”并列并能“交出”死人，句法和语境已足以显明拟人化，无须另加解释。
- source_word: ὁ ᾅδης
  choice: 阴间
  rationale: “阴间”是现代中文圣经语境中对ᾅδης较准确且可理解的表达，指死者所在之域，不与表示最终刑罚的其他希腊词混同。
- source_word: ἐκρίθησαν ἕκαστος
  choice: 每个人……受了审判
  rationale: 希腊文先用复数动词，继而以ἕκαστος逐一分配；中文用“每个人”加单数化表达，自然地保留个别审判的重点。
- source_word: κατὰ τὰ ἔργα αὐτῶν
  choice: 照着自己的行为
  rationale: κατά表示审判所依据的准则；ἔργα在此译为“行为”比“工作”自然。“自己的”配合“每个人”，表达原文复数所有格所指的各人行为。
theological_decisions:
- issue: 末世审判语境中ᾅδης的译法
  choice: 阴间
  alternative: 冥府；地狱；死人之域
  rationale: “阴间”既保持其作为死者所在之域的意义，又避免将它等同于本章随后出现的最终刑罚“火湖”；“地狱”会引入原文未明确表达的神学同一化。
- issue: θάνατος的拟人化
  choice: 死亡
  alternative: 死神
  rationale: 原文是普通名词“死亡”，虽在异象中被拟人化，却没有使用“死神”这一额外身份称谓；直译可保留意象而不增添本体论主张。
- issue: 按行为受审判
  choice: 照着自己的行为受了审判
  alternative: 根据自己所做的受审判
  rationale: 保留κατά与ἔργα的明确对应，不解释这种审判与救恩、功德等更广泛教义之间的关系，从而维持经文本身的神学张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“交出了”重现三组主体释放死人的平行结构；分号和句号使较长的希腊文并列句在中文中易读，同时保留其推进关系。
