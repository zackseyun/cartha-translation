  terminology: “宝座”“生命册”“受审判”“按他们所行的”均恰当，并未擅自将宝座改释为审判台或将审判改为定罪。“书卷”与古代载体相称，脚注适当地说明其也可指书册及通常为卷轴的历史背景。
