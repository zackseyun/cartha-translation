id: REV.20.12
reference: Revelation 20:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ εἶδον τοὺς νεκρούς, τοὺς μεγάλους καὶ τοὺς μικρούς, ἑστῶτας ἐνώπιον τοῦ θρόνου, καὶ βιβλία ἠνοίχθησαν· καὶ ἄλλο βιβλίον ἠνοίχθη, ὅ ἐστιν τῆς ζωῆς· καὶ ἐκρίθησαν οἱ νεκροὶ ἐκ τῶν γεγραμμένων ἐν τοῖς βιβλίοις κατὰ τὰ ἔργα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/012.yaml
  text: And I saw the dead[a], the great and the small, standing before the throne, and books were opened. And another book was opened, which is the book of life. And the dead were judged from what had been written in the books[b], according to their works.
translation:
  language: zh_hans
  text: 我看见死去的人，无论尊卑，都站在宝座前。书卷[a]被展开了；另有一卷也被展开了，就是生命册。死去的人都照着书卷中所记载的，按他们所行的受审判。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “书卷”原文也可指书册；在古代语境中通常是卷轴。
    reason: cultural_note
lexical_decisions:
- source_word: νεκρούς / νεκροὶ
  choice: 死去的人
  rationale: 这里是形容词名词化，统指已经死亡的人；“死去的人”在现代汉语中自然、庄重，也不额外说明其复活状态。
- source_word: μεγάλους καὶ τοὺς μικρούς
  choice: 无论尊卑
  rationale: 原文以“大与小”构成涵盖各等身份地位的并列语。“无论尊卑”自然传达其所指的全体范围，又不把它误解为身体大小或年龄。
- source_word: ἑστῶτας ἐνώπιον τοῦ θρόνου
  choice: 都站在宝座前
  rationale: 完成时分词表达已经站立并处于该状态；“站在宝座前”直接保留其姿态和场景，不把“宝座”解释性改写为“审判台”。
- source_word: βιβλία
  choice: 书卷
  rationale: βιβλίον可指古代卷轴或书册。“书卷”既符合启示录的古代场景，也能自然承载其中记载内容的含义，而不解释性改译为“记录册”。
- source_word: ἠνοίχθησαν / ἠνοίχθη
  choice: 展开了
  rationale: 在“书卷”的语境中，“展开”比“打开”更符合古代卷轴的形态，同时准确表达被开启，未擅自加入“解封”的意思。
- source_word: ἄλλο βιβλίον
  choice: 另有一卷
  rationale: 表达在先前众书卷之外又出现一卷，并保留它与前述书卷既同类又有区别的关系。
- source_word: ὅ ἐστιν τῆς ζωῆς
  choice: 就是生命册
  rationale: 原文省略了在属格结构中可理解的“书卷”一词；“生命册”是简洁自然的汉语表达，清楚表明这一卷与生命有关。
- source_word: ἐκρίθησαν
  choice: 受审判
  rationale: κρίνω在此具有司法审判含义；“受审判”保留裁断过程，不预先把结果限定为定罪。
- source_word: ἐκ τῶν γεγραμμένων ἐν τοῖς βιβλίοις
  choice: 照着书卷中所记载的
  rationale: ἐκ在这里表明审判所依据的内容；“所记载的”也传达完成时分词所指已经写下并留存的记录。
- source_word: κατὰ τὰ ἔργα αὐτῶν
  choice: 按他们所行的
  rationale: ἔργα指人的行为、作为。“所行的”是自然且范围宽广的现代汉语，明确保留审判与人的行为相对应的陈述。
theological_decisions:
- issue: 按行为受审判
  choice: 按他们所行的受审判
  alternative: 按他们的行为受审判
  rationale: 原文明确说审判是κατὰ（按照、依据）他们的ἔργα。译文照实保留这一神学张力，不淡化为仅供参考的证据，也不加入本节未明说的教义解释。
- issue: 审判的结果
  choice: 受审判
  alternative: 被定罪
  rationale: ἐκρίθησαν本身说明受到审判，却未在这个动词中规定所有人的判决结果；因此不译成“被定罪”。
- issue: 宝座的身份
  choice: 宝座
  alternative: 审判台
  rationale: 原文仅作τοῦ θρόνου，并未在本句中另加限定。直译为“宝座”可避免把场景的司法含义替换成原文没有使用的专门名词。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“我又看见”承接异象叙述；以“无论尊卑”自然表达全体社会身份，以“书卷／展开”维持古代场景，并用“生命册”保持汉语中的清晰与凝练。
