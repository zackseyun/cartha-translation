- from: 我又看见死去的人，无论尊卑，都站在宝座前。书卷[a]展开了；另有一卷也展开了，就是生命册。死去的人都照着书卷中所记载的，按他们所行的受审判。
  to: 我看见死去的人，无论尊卑，都站在宝座前。书卷[a]被展开了；另有一卷也被展开了，就是生命册。死去的人都照着书卷中所记载的，按他们所行的受审判。
  rationale: 修订仅删除原文未明示的“又”，并以“被展开了”明确对应两处希腊文被动式。其余措辞保留：既维持原文庄重的审判语境，也保留审判按书卷所载及按各人所行而施行的双重表述，不添加教义性解释。
