  text: καὶ ὁ θάνατος καὶ ὁ ᾅδης ἐβλήθησαν εἰς τὴν λίμνην τοῦ πυρός. οὗτος ὁ ⸂θάνατος ὁ δεύτερός⸃ ἐστιν, ἡ λίμνη τοῦ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/014.yaml
  text: And Death and Hades were thrown into the lake of fire. This is the second death[a], the lake of fire.
translation:
  language: zh_hans
  text: 死亡和阴间[a]被扔进了火湖。这就是第二次的死，即火湖。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “阴间”译自希腊语ᾅδης，指死者所在之处；本节将它与“火湖”明确区分。若译作“地狱”，容易使两者混同；也有译本译作“冥府”或“坟墓”。
    reason: lexical_alternative
lexical_decisions:
- source_word: θάνατος
  choice: 死亡／死
  rationale: 首处用“死亡”，与“阴间”并列，保留启示文学中将死亡实体化的表达；“第二次的死”中用“死”，作为审判状态的名称。汉语没有借大小写区分拟人化与普通名词的手段，因此不额外添加专名标记。
- source_word: ᾅδης
  choice: 阴间
  rationale: “阴间”是现代中文圣经语境中对ᾅδης较清楚且通行的表达，并可保持它与本节“火湖”的区别；不译作“地狱”，以免把两者混同。
- source_word: ἐβλήθησαν
  choice: 被扔进了
  rationale: 保留希腊文被动语态及强制投入的力度；“扔进”比传统的“投入”更直接自然。
- source_word: λίμνη τοῦ πυρός
  choice: 火湖
  rationale: 采用简洁、通行的启示文学用语，保留原文意象，并在句末重复这一名称。
- source_word: οὗτος
  choice: 这就是
  rationale: 明确保留指示词和等同判断，不弱化为“这意味着”。
- source_word: θάνατος ὁ δεύτερος
  choice: 第二次的死
  rationale: 自然表达带定冠词的名词与序数形容词结构，同时保留《启示录》中的特定称谓。
- source_word: ἡ λίμνη τοῦ πυρός
  choice: 即火湖
  rationale: 用“即”呈现句末同位说明，同时照原文重复“火湖”，避免把两者之间的认同关系改写为因果或解释。
theological_decisions:
- issue: 末世审判语境中ᾅδης的译法
  choice: 阴间
  alternative: 地狱；坟墓；冥府
  rationale: 本节明确把ᾅδης扔进火湖，说明二者在意象上有别。译作“地狱”容易将它与最终审判的火湖混为一谈；译作“坟墓”又可能把其含义缩减为实体墓穴。“阴间”较能保留原文概念及其张力。
- issue: θάνατος的拟人化
  choice: 首处译“死亡”，后处译“死”
  alternative: 两处都译“死亡”；以引号或其他标记把首处处理为专名
  rationale: 首处的“死亡”与“阴间”一同承受动作，语境本身足以显出实体化效果；后处“第二次的死”则是末世审判现实的称谓。不借引号或专名化额外强化某种神学解释。
- issue: 句末“火湖”与“第二次的死”的关系
  choice: “这就是第二次的死，即火湖”
  alternative: “火湖就是第二次的死”；“这意味着第二次的死”
  rationale: “即”保留希腊文同位、等同的结构及重复用语，不把“这”所指过早限定为某一单独成分，也不将等同陈述弱化为解释性意译。
translation_notes:
  register: 采用庄重而现代的标准普通话。“火湖”“阴间”“第二次的死”清楚易懂，并保留启示文学的凝练意象。用“被扔进了”自然呈现被动和动作完成；句末以“即”承接同位结构，避免过度解释。
