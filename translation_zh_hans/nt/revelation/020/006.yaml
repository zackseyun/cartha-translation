id: REV.20.6
reference: Revelation 20:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: μακάριος καὶ ἅγιος ὁ ἔχων μέρος ἐν τῇ ἀναστάσει τῇ πρώτῃ· ἐπὶ τούτων ὁ δεύτερος θάνατος οὐκ ἔχει ἐξουσίαν, ἀλλ’ ἔσονται ἱερεῖς τοῦ θεοῦ καὶ τοῦ χριστοῦ, καὶ βασιλεύσουσιν μετ’ αὐτοῦ ⸀χίλια ἔτη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/006.yaml
  text: Blessed and holy is the one who has a share in the first resurrection. Over these the second death has no authority[a], but they will be priests of God and of Messiah, and they will reign with him for a thousand years.
translation:
  language: zh_hans
  text: 在第一次复活中有份的人有福了，是圣洁的！第二次的死对这些人没有权柄；他们却要作上帝和弥赛亚的祭司[a]，并要与他一同作王一千年。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弥赛亚”也常译作“基督”。希腊文Χριστός意为“受膏者”，在这里用作称号。
    reason: 说明重要称号的常见替代译法，并保留其原有的头衔意义。
lexical_decisions:
- source_word: μακάριος καὶ ἅγιος
  choice: 有福了，是圣洁的
  rationale: 保留启示文学中的宣福语气，并将ἅγιος表达为分别归属上帝的“圣洁”，不缩减为主观快乐或单纯道德高尚。
- source_word: ὁ ἔχων μέρος
  choice: 有份的人
  rationale: “有份”自然表达μέρος所指的参与和所得份额，也保留希腊文单数集合性表述。
- source_word: ἐν τῇ ἀναστάσει τῇ πρώτῃ
  choice: 在第一次复活中
  rationale: 直接保留“第一次复活”这一启示文学术语，不预先解释其性质。
- source_word: ἐπὶ τούτων
  choice: 对这些人
  rationale: 与下文“没有权柄”连用，清楚表达第二次的死不能管辖上述参与第一次复活的人。
- source_word: ὁ δεύτερος θάνατος
  choice: 第二次的死
  rationale: 贴近希腊文定冠词加序数词的表达，并与“第一次复活”形成清楚对照。
- source_word: οὐκ ἔχει ἐξουσίαν
  choice: 没有权柄
  rationale: ἐξουσία在此侧重管辖权或支配权；“权柄”比单纯的“能力”更准确。
- source_word: ἱερεῖς
  choice: 祭司
  rationale: 直接保留礼仪和君尊祭司意象，不扩写为解释性称谓。
- source_word: τοῦ θεοῦ καὶ τοῦ χριστοῦ
  choice: 上帝和弥赛亚的
  rationale: Χριστός在此与“上帝”并列，仍具有称号性质；“弥赛亚”保留“受膏者”的头衔意义。
- source_word: βασιλεύσουσιν μετ’ αὐτοῦ
  choice: 要与他一同作王
  rationale: “作王”自然传达βασιλεύω的王权和统治含义；“与他一同”保留共同参与之意。
- source_word: χίλια ἔτη
  choice: 一千年
  rationale: 按原文保留明确的时间表述，不据此引入任何特定千禧年体系。
theological_decisions:
- issue: Χριστός的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处Χριστός作为头衔与“上帝”并列，“弥赛亚”更显明其称号含义；脚注列出中文传统中常见的“基督”。
- issue: 第一次复活的性质
  choice: 不加解释地译作“第一次复活”
  alternative: 将其解释为某种属灵重生、殉道者复活或末世身体复活
  rationale: 本节本身没有消除相关解释张力，译文不应替读者选定某一末世论体系。
- issue: 一千年的理解
  choice: 直译“一千年”
  alternative: 在正文中标明象征性或严格按字面理解
  rationale: 原文明确陈述χίλια ἔτη，却未在本节说明应如何解释其象征性或字面性，因此保持开放。
- issue: 第二次的死的权柄
  choice: “对这些人没有权柄”
  alternative: “不能伤害这些人”
  rationale: 原文ἐξουσία强调权柄或管辖权；译文保留这一司法、统治层面的意象，而不改写为结果性的“伤害”。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以“有福了”“权柄”“祭司”“作王”等读者熟悉的圣经用语维持启示文学的正式语体，同时避免古奥句式。
