id: REV.20.10
reference: Revelation 20:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ὁ διάβολος ὁ πλανῶν αὐτοὺς ἐβλήθη εἰς τὴν λίμνην τοῦ πυρὸς καὶ θείου, ὅπου καὶ τὸ θηρίον καὶ ὁ ψευδοπροφήτης, καὶ βασανισθήσονται ἡμέρας καὶ νυκτὸς εἰς τοὺς αἰῶνας τῶν αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/010.yaml
  text: And the devil[a], who was deceiving them, was thrown into the lake of fire and sulfur, where also the beast and the false prophet are[b], and they will be tormented day and night forever and ever.
translation:
  language: zh_hans
  text: 那迷惑他们的魔鬼被扔进了硫磺火湖[a]；兽和假先知也在那里[b]。他们必昼夜受折磨，直到永永远远[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译作“火与硫磺的湖”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文此处省略了动词；正文按上下文补作“在”。
    reason: textual_ambiguity
  - marker: c
    text: 希腊文直译为“直到万世的万世”，是强调持续无尽的惯用语。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ διάβολος
  choice: 魔鬼
  rationale: 在《启示录》中，这是撒但的固定称谓；“魔鬼”是现代汉语中清楚、通行且符合语境的译法。
- source_word: ὁ πλανῶν αὐτοὺς
  choice: 那迷惑他们的
  rationale: 带冠词的现在分词以持续性的行为指明魔鬼的身份；此译法自然地保留“以迷惑他们为特征”的含义，不过度限定具体时态。
- source_word: ἐβλήθη
  choice: 被扔进了
  rationale: 保留被动语态和强制投入审判之地的力度；“扔进”比文言色彩较重的“掷入”更符合现代标准汉语。
- source_word: λίμνην τοῦ πυρὸς καὶ θείου
  choice: 硫磺火湖
  rationale: 以汉语中简洁自然的复合表达呈现“火与硫磺的湖”；脚注同时保留希腊文较直译的结构。
- source_word: ὅπου καὶ τὸ θηρίον καὶ ὁ ψευδοπροφήτης
  choice: 兽和假先知也在那里
  rationale: 希腊文此处没有明写动词。正文依上下文补出表示持续所在的“在”，同时用脚注说明语法上的省略，避免把补词误当成原文明说。
- source_word: τὸ θηρίον
  choice: 兽
  rationale: 这是《启示录》中该末世异象角色的标准称呼，简明并与上下文一致。
- source_word: ὁ ψευδοπροφήτης
  choice: 假先知
  rationale: 直接对应希腊文复合词，也是现代汉语中清楚而固定的宗教用语。
- source_word: βασανισθήσονται
  choice: 必受折磨
  rationale: 表达将来被动和严厉痛苦；“受折磨”不额外指定折磨的手段，也比“受酷刑”更贴近原词在审判语境中的广度。
- source_word: ἡμέρας καὶ νυκτός
  choice: 昼夜
  rationale: 简洁保留日夜不断的惯用含义，语体庄重而自然。
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: 直到永永远远
  rationale: 这是现代汉语中自然、强调性的对应表达，传达希腊语叠加强调的无尽延续；脚注给出较贴近形式的译法。
theological_decisions:
- issue: εἰς τοὺς αἰῶνας τῶν αἰώνων 所表达的惩罚持续时间
  choice: 直到永永远远
  alternative: 直到万世万代
  rationale: 正文采用汉语中最自然的强烈持续表达，不弱化本节对无尽时长的强调，也不借此处理本节以外更广泛的教义争论。
- issue: ὅπου καὶ τὸ θηρίον καὶ ὁ ψευδοπροφήτης 中省略的动词
  choice: 兽和假先知也在那里
  alternative: 兽和假先知也曾被扔在那里
  rationale: 原文是无动词分句。根据19:20所述先前事件，正文补出现在状态的“在”，最少量地使汉语完整；脚注公开说明原文的省略，避免把时态补足绝对化。
- issue: 复数主语 βασανισθήσονται 的指向
  choice: 他们必昼夜受折磨
  alternative: 魔鬼必昼夜受折磨
  rationale: 复数动词自然承接魔鬼、兽和假先知三个对象；保留复数，不把审判只限于最近提到或句首的单一对象。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“硫磺火湖”“兽”“假先知”等表达兼顾《启示录》的异象语体与普通读者的可理解性；避免文言化的“掷入”“受苦刑”等措辞。标点将地点从后续结果句清楚分开，同时不改变希腊文的逻辑推进。
