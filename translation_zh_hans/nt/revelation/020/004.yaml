id: REV.20.4
reference: Revelation 20:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ εἶδον θρόνους, καὶ ἐκάθισαν ἐπ’ αὐτούς, καὶ κρίμα ἐδόθη αὐτοῖς, καὶ τὰς ψυχὰς τῶν πεπελεκισμένων διὰ τὴν μαρτυρίαν Ἰησοῦ καὶ διὰ τὸν λόγον τοῦ θεοῦ, καὶ οἵτινες οὐ προσεκύνησαν τὸ θηρίον οὐδὲ τὴν εἰκόνα αὐτοῦ καὶ οὐκ ἔλαβον τὸ χάραγμα ἐπὶ τὸ μέτωπον καὶ ἐπὶ τὴν χεῖρα αὐτῶν· καὶ ἔζησαν καὶ ἐβασίλευσαν μετὰ τοῦ χριστοῦ ⸀χίλια ἔτη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/004.yaml
  text: And I saw thrones[a], and they sat on them, and judgment was given to them, and the souls of those who had been beheaded because of the testimony of Jesus and because of the word of God, and those who had not worshiped the beast or its image and had not received the mark on their forehead and on their hand[b]; and they came to life and reigned with the Messiah for a thousand years.
translation:
  language: zh_hans
  text: 我又看见一些宝座，有人坐在上面，审判权赐给了他们。我还看见那些因耶稣的见证[a]和上帝的话而被斩首之人的灵魂，以及那些没有敬拜那兽和兽像、也没有在额头和手上接受印记的人。他们活了过来，与弥赛亚[b]一同作王一千年。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶稣的见证”也可理解为“关于耶稣的见证”或“耶稣所作的见证”。希腊语原文可有这两种含义。
    reason: 保留原文属格结构的真实歧义。
  - marker: b
    text: “弥赛亚”也常译作“基督”；希腊语Χριστός在这里是一个称号。
    reason: 说明重要称号的常见译法。
lexical_decisions:
- source_word: θρόνους
  choice: 一些宝座
  rationale: 直译为“宝座”；汉语中加“一些”自然表达无冠词复数，同时不限定具体数目。
- source_word: ἐκάθισαν ἐπ’ αὐτούς
  choice: 有人坐在上面
  rationale: 希腊文主语隐含且未指明；“有人”保留其身份的不确定性，也保留主动语态。
- source_word: κρίμα ἐδόθη αὐτοῖς
  choice: 审判权赐给了他们
  rationale: κρίμα在此可涉及审判、判决或司法权柄；现代汉语若直说“审判赐给他们”不够自然，因此采用“审判权”，同时不进一步规定其具体范围。
- source_word: ψυχὰς
  choice: 灵魂
  rationale: 保留启示文学异象中的具体意象，也维持他们先前死亡与随后活过来之间的张力。
- source_word: πεπελεκισμένων
  choice: 被斩首
  rationale: 准确表达以斧刃处决、砍下头颅的含义；“被斩首”简洁而庄重。
- source_word: διὰ τὴν μαρτυρίαν Ἰησοῦ
  choice: 因耶稣的见证
  rationale: διά加宾格表示原因；“耶稣的见证”保留属格既可指耶稣所作的见证，也可指关于耶稣的见证这一真实歧义。
- source_word: διὰ τὸν λόγον τοῦ θεοῦ
  choice: 因上帝的话
  rationale: 保留原因关系；“上帝的话”是清楚、自然且符合经文语域的表达。
- source_word: οἵτινες
  choice: 那些……的人
  rationale: 表达该关系代词所引出的、具有辨识性质的一类人。
- source_word: προσεκύνησαν
  choice: 没有敬拜
  rationale: 传达其宗教性效忠含义，比仅译为“跪拜”更符合本段语境。
- source_word: θηρίον
  choice: 那兽
  rationale: 既保留启示文学中的既定对象，又符合汉语对前文已出现对象的指称。
- source_word: εἰκόνα
  choice: 兽像
  rationale: 自然表达“那兽的像”，避免用“偶像”预先加入解释。
- source_word: χάραγμα
  choice: 印记
  rationale: 准确、清楚，并符合《启示录》相关语境中的惯用表达。
- source_word: ἔζησαν
  choice: 活了过来
  rationale: 表达语境中的事件性变化，同时不额外界定复活的性质。
- source_word: τοῦ χριστοῦ
  choice: 弥赛亚
  rationale: Χριστός在此作为头衔使用，译出其“受膏者／弥赛亚”的称号意义。
- source_word: χίλια ἔτη
  choice: 一千年
  rationale: 直接保留原文的数值和时间单位，不对其象征性或字面性作解释。
theological_decisions:
- issue: ἐκάθισαν的隐含主语及审判权的领受者是谁
  choice: 用“有人”和“他们”保持身份未指明
  alternative: 明确说是殉道者、众圣徒、使徒或天庭成员
  rationale: 希腊文没有明说主语身份；译文不应将某种末世论解释写入正文。
- issue: διὰ τὴν μαρτυρίαν Ἰησοῦ中属格的含义
  choice: 正文译“因耶稣的见证”，脚注说明两种可能
  alternative: 因他们为耶稣作见证；因耶稣所作的见证
  rationale: 原文既可能是主语属格，也可能是宾语属格；保留歧义可避免提前解决神学张力。
- issue: Χριστός的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处带定冠词并作为头衔使用，“弥赛亚”更直接呈现称号含义。
- issue: ἔζησαν所指的生命事件
  choice: 活了过来
  alternative: 活着；复活了；再次活了
  rationale: “活了过来”传达事件性，却不在经文明确范围之外规定其复活方式或末世论体系。
- issue: 一千年的性质
  choice: 按原文译“一千年”，不作解释
  alternative: 在正文中明确解释为字面时期或象征时期
  rationale: 本节本身没有说明这一数字应如何解释，译文应保留该问题。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。以短句分开异象中的三组信息，减少希腊语长句在汉语中的负担；不指明坐宝座者的身份，不解释千年的性质。所有脚注标记均置于正文相应位置。
