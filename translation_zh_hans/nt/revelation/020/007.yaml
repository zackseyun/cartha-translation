  text: Καὶ ὅταν τελεσθῇ τὰ χίλια ἔτη, λυθήσεται ὁ Σατανᾶς ἐκ τῆς φυλακῆς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/007.yaml
  text: And when the thousand years are completed, Satan will be released from his prison,
translation:
  language: zh_hans
  text: 那一千年结束时，撒但将被从他的监牢中释放。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅταν
  choice: ……时
  rationale: 与虚拟语气 τελεσθῇ 构成指向将来的时间从句；“……时”自然表达预期将发生的时间，不额外解释先后关系。
- source_word: τελεσθῇ
  choice: 结束
  rationale: 这里指一个规定时期达到终点。汉语“结束”简洁自然；虽然未以显式被动形式翻译，却准确表达其完成、终结的结果义。
- source_word: τὰ χίλια ἔτη
  choice: 那一千年
  rationale: 定冠词结合上下文回指前文已经提到的一千年；“那一千年”既明确回指，也不判断这段时期应按字面还是象征理解。
- source_word: λυθήσεται
  choice: 将……被释放
  rationale: 保留将来和被动语义。“释放”符合解除囚禁的语境，又避免“得自由”可能带来的正面评价色彩。
- source_word: Σατανᾶς
  choice: 撒但
  rationale: 采用现代中文圣经传统中通行的人名／称号译法。
- source_word: ἐκ τῆς φυλακῆς αὐτοῦ
  choice: 从他的监牢里
  rationale: φυλακή 在此语境指关押之处；“监牢”清楚表达囚禁含义，“他的”保留 αὐτοῦ，但不暗示所有权，只表示他被关押的所在。
theological_decisions:
- issue: 一千年的性质
  choice: 直译为“那一千年”，不说明其为字面时期或象征时期。
  alternative: 将其明确解释为字面的一千年统治期，或象征性的漫长时期。
  rationale: 本节只提到一个前文已述及的确定时期，本身并未裁定各种千禧年解释；译文因此保留原文的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。语序顺应汉语习惯，同时保留原文的时间从句、将来指向和释放的被动关系。
