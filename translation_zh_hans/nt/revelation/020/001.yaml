  text: Καὶ εἶδον ἄγγελον καταβαίνοντα ἐκ τοῦ οὐρανοῦ, ἔχοντα τὴν κλεῖν τῆς ἀβύσσου καὶ ἅλυσιν μεγάλην ἐπὶ τὴν χεῖρα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/001.yaml
  text: And I saw an angel coming down from heaven[a], holding the key to the abyss and a great chain in his hand.
translation:
  language: zh_hans
  text: 我又看见一位天使从天上降下，手里拿着深渊的钥匙[a]和一条大锁链。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“无底坑”。希腊文作“深渊”。
    reason: 说明ἄβυσσος的传统替代译法，同时交代正文采用较直接的原文对应词。
lexical_decisions:
- source_word: Καὶ
  choice: 又
  rationale: 承接前后异象的叙述次序，保留《启示录》并列推进的语气，同时比句首直译“并且”更符合现代汉语。
- source_word: εἶδον
  choice: 我看见
  rationale: 直接表达异象叙事中的看见，不增添原文没有的动作。
- source_word: ἄγγελον
  choice: 一位天使
  rationale: 上下文所指是天上的灵界使者；“天使”在此比泛称“使者”明确且自然。
- source_word: καταβαίνοντα ἐκ τοῦ οὐρανοῦ
  choice: 从天上降下
  rationale: 准确保留从天而下的方向，并采用自然、庄重的现代汉语。
- source_word: ἔχοντα
  choice: 手里拿着
  rationale: 该分词同时支配钥匙和锁链；结合句末ἐπὶ τὴν χεῖρα αὐτοῦ，译作“手里拿着”清楚呈现携持的画面。
- source_word: τὴν κλεῖν τῆς ἀβύσσου
  choice: 深渊的钥匙
  rationale: 保留希腊文所有格结构及特指的钥匙；“深渊”直接对应ἄβυσσος，避免在正文中过度具体化。
- source_word: ἅλυσιν μεγάλην
  choice: 一条大锁链
  rationale: “锁链”适合拘禁场景；“大”保留μέγας所表达的尺寸或威势，且不额外解释。
- source_word: ἐπὶ τὴν χεῖρα αὐτοῦ
  choice: 手里
  rationale: 字面有“在手上”之意，此处用汉语习惯表达为“手里”，说明钥匙和锁链由天使拿着。
theological_decisions:
- issue: 末世异象中ἄβυσσος的译法
  choice: 深渊
  alternative: 无底坑／无底深渊
  rationale: “深渊”最直接对应希腊文ἄβυσσος，并保留其异象性含义，不把传统译法所强调的“无底”或“坑”直接加入正文；常见替代译法列入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“我又看见”承接异象次序；句法简洁，保留原文中钥匙与大锁链并列的画面。
