  rationale: 仅作轻微措辞与脚注修订：“大地的广阔之地”比“大地的辽阔之处”更符合现代汉语搭配，并继续避免加入“平原”等解释性地貌；删去“有”使“火从天上降下”更直接对应κατέβη πῦρ。脚注a改为准确说明字面表达及其空间含义。其余正文、术语和脚注均可保留。
