  text: καὶ ἀνέβησαν ἐπὶ τὸ πλάτος τῆς γῆς, καὶ ⸀ἐκύκλευσαν τὴν παρεμβολὴν τῶν ἁγίων καὶ τὴν πόλιν τὴν ἠγαπημένην. καὶ κατέβη πῦρ ⸂ἐκ τοῦ οὐρανοῦ⸃ καὶ κατέφαγεν αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/009.yaml
  text: And they came up over the breadth of the earth and surrounded the camp of the saints and the beloved city[c][b][a]. And fire came down from heaven and consumed them.
translation:
  language: zh_hans
  text: 他们上到大地的广阔之地[a]，包围了圣徒的营地[b]和那蒙爱的城[c]。火从天上降下，吞灭了他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 字面可译为“在大地的宽阔之上”；这个希腊语表达指大地广大的范围。
    reason: lexical_alternative
  - marker: b
    text: “包围”也可译作“环绕”。
    reason: lexical_alternative
  - marker: c
    text: 原文没有明确说明“那蒙爱的城”是哪一座城；常见理解包括耶路撒冷，或更广义的上帝之城。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνέβησαν
  choice: 上到
  rationale: 保留ἀναβαίνω的上行或推进意象；“上到”在叙事中自然，又不擅自断定具体地形。
- source_word: ἐπὶ τὸ πλάτος τῆς γῆς
  choice: 到大地的辽阔之处
  rationale: πλάτος指宽广、辽阔的范围；此译避免添加原文没有的“平原”，同时以自然汉语呈现广阔地域的图景。
- source_word: ἐκύκλευσαν
  choice: 包围了
  rationale: 准确表达环绕、围住之意，是现代汉语中最清楚自然的说法。
- source_word: παρεμβολὴν
  choice: 营地
  rationale: 该词指营盘或营地，常带军事色彩；“营地”简洁地保留这一意象，而不额外补出“军队”。
- source_word: τῶν ἁγίων
  choice: 圣徒的
  rationale: “圣徒”承接《启示录》及新约中的惯用译法，并保留其群体称谓。
- source_word: τὴν πόλιν τὴν ἠγαπημένην
  choice: 那蒙爱的城
  rationale: ἠγαπημένην是完成时被动分词；“蒙爱的”保留被爱及其持续结果的含义，又不在正文中明说施爱者。
- source_word: κατέβη πῦρ ἐκ τοῦ οὐρανοῦ
  choice: 有火从天上降下
  rationale: 直接保留火从天而降的源文图景，措辞自然庄重。
- source_word: κατέφαγεν αὐτούς
  choice: 吞灭了他们
  rationale: κατεσθίω本有吞吃、吞噬之意；以火为主语时，“吞灭”既自然，也传达彻底毁灭的力度。
theological_decisions:
- issue: “那蒙爱的城”的所指及神学含义
  choice: 正文仅译作“那蒙爱的城”，不具体指认
  alternative: 耶路撒冷；末世的上帝之城或上帝子民
  rationale: 希腊文本在本节没有明说这城的名称。正文若直接认定为耶路撒冷或某一象征性实体，会替读者解决原文保留的解释张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。句式贴近希腊文的叙事推进；用“辽阔之处”避免生硬的“大地的宽度”和原文没有的“平原”，并以脚注保留较直译的表达。所有脚注标记均紧随相关词组。
