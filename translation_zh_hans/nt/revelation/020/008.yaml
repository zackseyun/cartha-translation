source:
  edition: SBLGNT
  text: καὶ ἐξελεύσεται πλανῆσαι τὰ ἔθνη τὰ ἐν ταῖς τέσσαρσι γωνίαις τῆς γῆς, τὸν Γὼγ ⸀καὶ Μαγώγ, συναγαγεῖν αὐτοὺς εἰς τὸν πόλεμον, ὧν ὁ ἀριθμὸς ⸀αὐτῶν ὡς ἡ ἄμμος τῆς θαλάσσης.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/008.yaml
  text: and he will go out to deceive the nations at the four corners of the earth—Gog and Magog—and to gather them for war[c][b][a], whose number is like the sand of the sea.
translation:
  language: zh_hans
  text: 他要出去迷惑地上四方的列国，就是歌革和玛各，并聚集他们去争战[c][b][a]；他们的人数多如海沙。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “迷惑”也可译作“引入歧途”。
    reason: lexical_alternative
  - marker: b
    text: “歌革和玛各”呼应《以西结书》38—39章；这里可能用作聚集起来、进行最后反叛之列国的预表性称号。
    reason: cross_reference
  - marker: c
    text: “去争战”也可译作“参加战争”或“参加那场战役”；希腊文直译为“为着战争／战役”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελεύσεται
  choice: 他要出去
  rationale: 承接第7节，省略的主语是撒但；“出去”保留原文的移动意象。
- source_word: πλανῆσαι
  choice: 迷惑
  rationale: 可表示“欺骗”或“引入歧途”；“迷惑”简洁自然，也保留两方面的含义。
- source_word: τὰ ἔθνη
  choice: 列国
  rationale: 这里指世上的众国或众族群，并非特指与犹太人相对的外邦人。
- source_word: τὰ ἐν ταῖς τέσσαρσι γωνίαις τῆς γῆς
  choice: 地上四方的
  rationale: “四角”是指大地四极的惯用意象；汉语以“地上四方”自然表达其遍及全地之意，同时保留空间意象。
- source_word: τὸν Γὼγ καὶ Μαγώγ
  choice: 就是歌革和玛各
  rationale: 按专名音译，并将其理解为对“列国”的同位说明，不进一步断定其象征或地理所指。
- source_word: συναγαγεῖν
  choice: 并聚集
  rationale: 与前一目的不定式相连；“并”反映结构上的并列，“聚集”保留末世群体被召集的意象。
- source_word: εἰς τὸν πόλεμον
  choice: 前来争战
  rationale: πόλεμος可指战争或战役；此译自然表达聚集的目的，又不把所指限定为某一种具体战争形态。
- source_word: ὧν ὁ ἀριθμὸς αὐτῶν
  choice: 他们的人数
  rationale: 关系结构在现代汉语中自然转换为独立分句，指向被聚集的列国。
- source_word: ὡς ἡ ἄμμος τῆς θαλάσσης
  choice: 多如海沙
  rationale: 保留圣经中表示数目极多的传统比喻，并符合现代汉语习惯。
theological_decisions:
- issue: “他要出去”的隐含主语
  choice: 以“他”承接上文的撒但
  alternative: 在本节中明说“撒但”
  rationale: 原文没有重复主语，但第7节已明确是撒但；用代词既保持语篇连续，也避免增添原文未重复的信息。
- issue: “歌革和玛各”与“列国”的关系
  choice: 用“就是”表达同位性指称
  alternative: 把歌革和玛各视为与列国分开的两个个体或两个地域
  rationale: 希腊文最自然地把这两个名字作为对列国的同位说明；译文保留《以西结书》38—39章的呼应，却不裁定这些名称究竟是象征性、预表性还是严格的民族地理名称。
- issue: πόλεμος的范围
  choice: 译为“争战”
  alternative: 译为“战争”或“那场战役”
  rationale: 原词兼有战争与战役的语义；“争战”保留弹性，不预先限定第9节所描写冲突的具体性质。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“列国”“争战”“海沙”保留启示文学及圣经互文的语体色彩；句号前以分号处理人数说明，使长句层次清楚。脚注标记依照所给英文POB的次序置于“争战”之后。
