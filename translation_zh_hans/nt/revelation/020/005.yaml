  naturalness: “其余的死人”及“那一千年结束”自然、庄重。改为“直到……才活过来”更符合现代汉语，也更直接对应原文的时间界限。脚注中的“没有活着”宜调整语序，使其成为可读的汉语，同时保留“活着”这一词汇替代。
  terminology: “死人”“活过来”“复活”均符合现代汉语圣经语域，并没有加入身体性、属灵性或特定千禧年立场。“这就是第一次复活”保留αὕτη所指的开放性。
