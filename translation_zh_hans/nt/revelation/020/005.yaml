  text: ⸀οἱ λοιποὶ τῶν νεκρῶν οὐκ ἔζησαν ἄχρι τελεσθῇ τὰ χίλια ἔτη. αὕτη ἡ ἀνάστασις ἡ πρώτη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/005.yaml
  text: The rest of the dead did not come to life until the thousand years were finished[a]. This is the first resurrection.
translation:
  language: zh_hans
  text: 其余的死人直到那一千年结束才活过来。[a]这就是第一次复活。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“其余的死人直到那一千年结束都没有活着。”
    reason: ζάω可较直接译作“活着”；正文根据复活语境译为“活过来”，脚注保留词汇上的另一种可能。
lexical_decisions:
- source_word: οἱ λοιποὶ τῶν νεκρῶν
  choice: 其余的死人
  rationale: 保留与上文已活过来并作王之人的对比；“其余的死人”在现代汉语中直接自然，也保持原文的集合意义。
- source_word: οὐκ ἔζησαν
  choice: 还没有活过来
  rationale: ζάω 的不定过去时在复活语境中可表达进入生命状态；“活过来”贴合紧接着的“复活”，而“还没有……直到”自然表达截至所述期限的否定。脚注保留较直译的可能。
- source_word: ἄχρι τελεσθῇ
  choice: 直到……结束
  rationale: ἄχρι 标明时间终点，τελεσθῇ 表示达到完成；“结束”简明自然，不额外说明结束的方式。
- source_word: τὰ χίλια ἔτη
  choice: 那一千年
  rationale: 冠词指向上下文已经提到的特定一千年；汉语用“那”清楚体现回指。
- source_word: αὕτη ἡ ἀνάστασις ἡ πρώτη
  choice: 这是第一次复活
  rationale: 按原文直接表达指示语和带序数词的“复活”，不界定“这”所指范围，也不加入特定千禧年体系。
theological_decisions:
- issue: “这是第一次复活”中“这”的所指
  choice: 保留宽泛的指示语“这”，让它按上下文指向刚才所述的复活现实
  alternative: 明确限定为第4节的殉道者、所有义人，或属灵意义上的复活
  rationale: 希腊文本没有进一步限定所指；直接保留“这”可避免把某一种末世论体系写入译文。
- issue: ἔζησαν 在本语境中的含义
  choice: 译为“活过来”，传达复活语境中的恢复生命
  alternative: 译为“活着”或明确解释为属灵复活
  rationale: 上下文紧接“第一次复活”，所以“活过来”最能体现语境力量；同时不添加“身体”或“属灵”等原文未明说的限定。
- issue: “直到”是否暗示期限之后必然发生
  choice: 按原文保留时间终点表达，不在正文中另作逻辑说明
  alternative: 明确说明期限结束后其余死人必定复活，或否认这种推论
  rationale: ἄχρι 直接标示所述状态持续到某一时间点；译文不应超出本句，替读者解决其后事件的解释问题。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“那一千年”自然回指上文；“第一次复活”为通行且清晰的圣经术语。脚注标记已在正文相应位置以[a]标出。
