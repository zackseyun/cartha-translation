id: REV.20.3
reference: Revelation 20:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἔβαλεν αὐτὸν εἰς τὴν ἄβυσσον, καὶ ἔκλεισεν καὶ ἐσφράγισεν ἐπάνω αὐτοῦ, ἵνα μὴ ⸀πλανήσῃ ἔτι τὰ ἔθνη, ἄχρι τελεσθῇ τὰ χίλια ἔτη· ⸀μετὰ ταῦτα δεῖ ⸂λυθῆναι αὐτὸν⸃ μικρὸν χρόνον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/003.yaml
  text: And he threw him into the abyss[a], and shut it and sealed it over him, so that he might no longer deceive the nations until the thousand years were finished[c][b]. After these things he must be released for a short time.
translation:
  language: zh_hans
  text: 又把它扔进无底深渊[a]，把深渊关上，又在它上方加封，使它不再迷惑列国[b]，直到那一千年结束。此后，它必须被释放一小段时间[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “无底深渊”也可译作“深渊”。
    reason: lexical_alternative
  - marker: b
    text: “迷惑”也可译作“欺骗”或“引入歧途”。
    reason: lexical_alternative
  - marker: c
    text: “被释放”也可译作“被松开”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔβαλεν
  choice: 扔进
  rationale: 表达βάλλω带有力度的放置动作，也符合现代汉语叙事语感；比“投进”更通俗，比单纯“放进”更有力。
- source_word: ἄβυσσον
  choice: 无底深渊
  rationale: 启示录中这是具有末世意象的场所名称。“无底深渊”承接该词在本书语境中的传统表达，同时“深渊”保留其核心词义。
- source_word: ἔκλεισεν καὶ ἐσφράγισεν ἐπάνω αὐτοῦ
  choice: 将深渊关闭，在它上面封住
  rationale: 保留“关闭”和“封住”两个连续动作，并以“在它上面”表达ἐπάνω αὐτοῦ的空间关系；补出“深渊”作为关闭的对象，使中文清楚自然。
- source_word: ἵνα μὴ πλανήσῃ ἔτι τὰ ἔθνη
  choice: 使它不再迷惑列国
  rationale: πλανάω可指欺骗或引入歧途；“迷惑”在启示录语境中自然且保留两方面含义。ἔτι译作“不再”，τὰ ἔθνη译作“列国”。
- source_word: ἄχρι τελεσθῇ τὰ χίλια ἔτη
  choice: 直到那一千年结束
  rationale: τελεσθῇ表示达到终点或完成；“结束”自然地标明ἄχρι所引出的时间界限。“那一千年”承接上下文中的特定时期。
- source_word: μετὰ ταῦτα
  choice: 此后
  rationale: 简洁、庄重地表达“这些事以后”的时间推进，适合现代中文叙事。
- source_word: δεῖ
  choice: 必须
  rationale: 准确保留必要性，但不额外说明这是神的旨意、预言的必然性还是叙事安排。
- source_word: λυθῆναι αὐτὸν
  choice: 它必须被释放
  rationale: 被动式“被释放”清楚表达从拘禁中获释，也保留希腊文的被动语态。
- source_word: μικρὸν χρόνον
  choice: 一小段时间
  rationale: 自然表达持续时间有限；较“一会儿”更庄重，也不暗示极短到瞬间的程度。
theological_decisions:
- issue: “一千年”的性质
  choice: 直译为“那一千年”，不作解释性限定。
  alternative: 将其明确解释为字面的一千年或象征性的漫长时期。
  rationale: 原文只陈述“一千年”，译文不应预先解决千禧年性质的神学争议。
- issue: δεῖ在末世叙事中的必要性
  choice: 译为“必须”，保留必要性的力度。
  alternative: 明确译成“按神的旨意必须”或弱化为“将会”。
  rationale: 经文本身没有在本节说明这种必要性的具体机制；“必须”既忠实又不引入额外教义。
- issue: 释放撒但的施事者
  choice: 使用被动式“被释放”，不补明施事者。
  alternative: 补译为“神必须释放它”或“天使必须释放它”。
  rationale: 希腊文采用被动不定式，未在本句指明执行释放者，因此译文保持这一开放性。
translation_notes:
  register: 采用现代、庄重而通俗的书面汉语。以“它”指代龙，即前文所称的古蛇、魔鬼和撒但，避免在本节重复解释性名称。“列国”保留启示文学的经文语体；句法按中文习惯重组，但维持原文动作次序、目的关系和时间界限。
