  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ ἐδόθη μοι κάλαμος ὅμοιος ῥάβδῳ, λέγων· ⸀Ἔγειρε καὶ μέτρησον τὸν ναὸν τοῦ θεοῦ καὶ τὸ θυσιαστήριον καὶ τοὺς προσκυνοῦντας ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/001.yaml
  text: And I was given a reed like a rod[a], saying, “Rise and measure the temple of God and the altar and those who worship in it.”
translation:
  language: zh_hans
  text: 有一根像杖的芦苇赐给我；有人说：“起来，量度上帝的圣殿[a]、祭坛和在殿里敬拜的人。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣殿”或译“圣所”；希腊文ναός可较具体地指圣殿内部的圣所，而非整个圣殿建筑群。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδόθη μοι
  choice: 我又得了
  rationale: 保留被赐予、领受之意；中文用主动领受式表达更自然，同时不明说赐予者。καί 结合上下文译作“又”。
- source_word: κάλαμος
  choice: 一根……芦苇
  rationale: 按基本词义译为“芦苇”，不提前将其解释成量杆；量度用途由后面的命令显明。
- source_word: ὅμοιος ῥάβδῳ
  choice: 像杖一样
  rationale: 保留明确的比较关系；“杖”自然传达细长而较坚实之物的形象，不额外限定其种类。
- source_word: λέγων
  choice: 有话说
  rationale: 希腊文分词在句法上较突兀，发话者没有明说；“有话说”在现代汉语中保留这一匿名性，比补出“天使”或“声音”更克制。
- source_word: Ἔγειρε
  choice: 起来
  rationale: 直接、自然地表达不定过去时命令语气，也符合异象叙事的庄重语域。
- source_word: μέτρησον
  choice: 量一量
  rationale: 表达直接的量度命令；重叠形式在现代汉语中自然，并不削弱命令效力。
- source_word: τὸν ναὸν τοῦ θεοῦ
  choice: 上帝的圣殿
  rationale: ναός通常侧重圣所或殿的核心部分；“圣殿”既是自然的中文圣经用语，也不在正文中判定其为地上、天上或象征性的殿。
- source_word: τὸ θυσιαστήριον
  choice: 祭坛
  rationale: 采用标准对应词，不擅自判定是燔祭坛还是香坛。
- source_word: τοὺς προσκυνοῦντας
  choice: 敬拜的人
  rationale: 保留分词的动作意味，语言自然易懂。
- source_word: ἐν αὐτῷ
  choice: 在殿里
  rationale: 代词最自然地回指ναός；汉语重复“殿”比“在其中”更清楚，也避免误解为“在他里面”。
theological_decisions:
- issue: 启示文学语境中ναός所指为何
  choice: 正文译作“上帝的圣殿”，不判定其具体性质
  alternative: 上帝的圣所；或明确解释为地上的殿、天上的圣所、象征上帝子民
  rationale: 本节本身未解决它究竟是地上的、天上的，还是象征性的；译文应保留这种神学张力。
- issue: λέγων所暗示的说话者身份
  choice: 用“有话说”保持身份未明
  alternative: 有一位天使说；有声音说；有人对我说
  rationale: 原文没有明确说话者，补出天使、声音或特定人物都会超出文本证据。
- issue: 祭坛的具体类别
  choice: 只译“祭坛”
  alternative: 燔祭坛；香坛
  rationale: 上下文在本节内不足以确定具体祭坛，故不以翻译解决解释问题。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我又得了”承接异象叙事；分号呈现领受芦苇与随后话语之间略显突兀的原文连接。正文中的[a]与脚注严格对应。
