id: REV.11.5
reference: Revelation 11:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ εἴ τις αὐτοὺς θέλει ἀδικῆσαι, πῦρ ἐκπορεύεται ἐκ τοῦ στόματος αὐτῶν καὶ κατεσθίει τοὺς ἐχθροὺς αὐτῶν· καὶ εἴ τις ⸂θελήσῃ αὐτοὺς⸃ ἀδικῆσαι, οὕτως δεῖ αὐτὸν ἀποκτανθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/005.yaml
  text: And if anyone wants to harm them[a], fire comes out of their mouth and devours their enemies; and if anyone should want to harm them, in this way he must be killed.
translation:
  language: zh_hans
  text: 如果有人想伤害他们，火就从他们口中出来，吞灭他们的仇敌；如果有人想伤害他们，他就必须这样被杀。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀδικῆσαι
  choice: 伤害
  rationale: 在这里指针对两位见证人的敌对行动；“伤害”自然清楚，又不限定具体攻击方式。
- source_word: πῦρ
  choice: 火
  rationale: 保留启示文学中鲜明而直接的原文意象，不在正文中预先解释为象征。
- source_word: ἐκπορεύεται ἐκ τοῦ στόματος αὐτῶν
  choice: 从他们口中喷出
  rationale: “喷出”自然传达火从口中出来的动态意象；“口”采用单数，保留希腊文单数名词与复数所属者的搭配。
- source_word: κατεσθίει
  choice: 吞灭
  rationale: 兼具吞噬和彻底毁灭之意，符合该句强烈的审判图景。
- source_word: ἐχθροὺς
  choice: 仇敌
  rationale: 准确表达敌对关系，语体庄重，适合经文。
- source_word: θέλει / θελήσῃ
  choice: 想
  rationale: 两个条件句均译为自然汉语“想”；汉语不必机械标示直陈式与虚拟式的形态差异，条件结构本身已表达假设性。
- source_word: οὕτως
  choice: 这样
  rationale: 回指前述被火吞灭的方式，简洁自然，并保留指代关系。
- source_word: δεῖ
  choice: 必
  rationale: 表达原文的必要性或必然性，不额外断定其具体神学来源。
- source_word: ἀποκτανθῆναι
  choice: 被杀
  rationale: 直接保留被动意义，现代汉语清楚有力。
theological_decisions:
- issue: 是否在翻译中解释从口中出来的火为象征性言语或审判
  choice: 正文保留“有火从他们口中喷出”的具体意象
  alternative: 意译为他们所宣告的审判毁灭仇敌
  rationale: 原文直接陈述火的意象；将其理解为字面事件或象征，应留给读者和释经，而不在翻译中预先决定。
- issue: οὕτως所指的死亡方式
  choice: 译作“他就必这样被杀”，保留对前文方式的回指
  alternative: 明确译成“他也必被火吞灭”
  rationale: “这样”最贴近原文οὕτως，避免补入原文未再次明说的“火”，同时维持经文的内在关联。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“如果有人……就……”呈现第一条件句的结果关系；第二句用“必”突出δεῖ所表达的必要性。“他们口中”刻意保留希腊文“口”的单数形式，在汉语中也自然，无需脚注。
