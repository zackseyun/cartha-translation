  terminology: “住在地上的人”保留《启示录》反复使用的表达及其分词的动态色彩；“这两位先知”准确；“折磨”充分表达ἐβασάνισαν的强度，未将其弱化。脚注a提供合宜的词汇替代并谨慎说明该表达在本书中的常见语境；脚注b恰当地说明“欢庆”的喜庆作乐含义，锚点均放置在相应正文词语后。
