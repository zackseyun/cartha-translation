id: REV.11.10
reference: Revelation 11:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ οἱ κατοικοῦντες ἐπὶ τῆς γῆς χαίρουσιν ἐπ’ αὐτοῖς καὶ ⸀εὐφραίνονται, καὶ δῶρα ⸀πέμψουσιν ἀλλήλοις, ὅτι οὗτοι οἱ δύο προφῆται ἐβασάνισαν τοὺς κατοικοῦντας ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/010.yaml
  text: And those who dwell on the earth rejoice over them and celebrate[a], and they will send gifts to one another[b], because these two prophets tormented those who dwell on the earth.
translation:
  language: zh_hans
  text: 住在地上的人[a]因他们而欢喜，并且欢庆[b]，还要彼此赠送礼物，因为这两位先知曾折磨住在地上的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“地上的居民”。《启示录》常用这一表达指敌对上帝的世人。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“欢宴作乐”。原文动词着重表达喜庆作乐。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ κατοικοῦντες ἐπὶ τῆς γῆς / τοὺς κατοικοῦντας ἐπὶ τῆς γῆς
  choice: 住在地上的人
  rationale: 保留分词结构的动态意味，并在本节两次出现时采用一致译法；这也是《启示录》中反复出现的表达。
- source_word: χαίρουσιν ἐπ’ αὐτοῖς
  choice: 因他们而欢喜
  rationale: ἐπί加与格表示欢喜所针对或所缘由的对象；此译法自然地表达众人因两位先知的遭遇而欢喜，同时不额外说明具体情形。
- source_word: εὐφραίνονται
  choice: 欢庆
  rationale: 与χαίρουσιν并列，除欢喜之外还带有庆祝、作乐的意味；“欢庆”既体现节庆色彩，又避免重复。
- source_word: δῶρα πέμψουσιν ἀλλήλοις
  choice: 还要彼此赠送礼物
  rationale: 保留将来时和彼此相向的关系；“赠送礼物”符合现代汉语习惯，也未将其改写成较具解释性的“交换礼物”。
- source_word: οὗτοι οἱ δύο προφῆται
  choice: 这两位先知
  rationale: 直接、自然地传达指示词、数词与名词组成的短语。
- source_word: ἐβασάνισαν
  choice: 曾折磨
  rationale: βασανίζω表示使人遭受强烈痛苦或煎熬；“折磨”保留原文力度，“曾”则自然体现相对于当前欢庆而言已经发生的行动。
theological_decisions:
- issue: 《启示录》中“住在地上的人”这一惯用语的含义
  choice: 住在地上的人
  alternative: 地上的居民
  rationale: 该表达在《启示录》中往往指向敌对上帝及其见证者的世人，但本节不宜把这一神学含义直接扩写进正文；保留原文形态较能兼顾字面指称和书卷中的反复用法。
- issue: 两位先知给世人带来的痛苦之强度
  choice: 折磨
  alternative: 使……受苦／困扰
  rationale: 原文使用强烈动词βασανίζω，不应把世人对先知见证及审判行动的感受弱化；“折磨”保留这种张力，同时不解释折磨的具体方式。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。正文保持原文由现在时转向将来时、再回顾过去行动的推进关系；两次出现的“住在地上的人”保持一致。
