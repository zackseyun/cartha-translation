id: REV.11.15
reference: Revelation 11:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ ὁ ἕβδομος ἄγγελος ἐσάλπισεν· καὶ ἐγένοντο φωναὶ μεγάλαι ἐν τῷ οὐρανῷ ⸀λέγοντες· Ἐγένετο ἡ βασιλεία τοῦ κόσμου τοῦ κυρίου ἡμῶν καὶ τοῦ χριστοῦ αὐτοῦ, καὶ βασιλεύσει εἰς τοὺς αἰῶνας τῶν αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/015.yaml
  text: And the seventh angel sounded his trumpet[a], and there were loud voices in heaven, saying, “The kingdom of the world has become that of our Lord and of his Messiah[c][b], and he will reign forever and ever.”
translation:
  language: zh_hans
  text: 第七位天使吹响了号角[a]，天上响起了响亮的声音，说：“世上的国已经成了我们主和他的弥赛亚[b]的国；他要作王，直到永永远远[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“世上的万国已经成了”，另有抄本作“这世界的国已经成了”。SBLGNT正文采用单数“世上的国已经成了”。
    reason: textual_variant
  - marker: b
    text: “弥赛亚”也可译作“基督”；希腊文Χριστός是“受膏者”的称号。
    reason: lexical_alternative
  - marker: c
    text: 希腊文直译为“直到万世的万世”，是表示永无穷尽的强化性惯用语。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: 吹响了号角
  rationale: σαλπίζω指吹号；中文用“吹响了号角”自然明确，也只把动词本身蕴含的乐器表达出来。
- source_word: φωναὶ μεγάλαι
  choice: 响亮的声音
  rationale: φωνή可指声音、话音或呼声；后接“说”，表明是可传达言语的声音。μεγάλαι在此表示音量大，译作“响亮”符合现代汉语。
- source_word: ἐν τῷ οὐρανῷ
  choice: 天上
  rationale: 此处οὐρανός指属天的领域，而非单指物理天空；“天上”简洁自然。
- source_word: λέγοντες
  choice: 说
  rationale: 分词引出声音所宣告的内容。希腊文阳性分词与阴性名词φωναί在形式上的不一致不宜在中文中生硬复制。
- source_word: Ἐγένετο ἡ βασιλεία τοῦ κόσμου
  choice: 世上的国已经成了
  rationale: SBLGNT的βασιλεία为单数，故译“国”而非“列国”；“已经成了”体现宣告中现已实现的意味。
- source_word: τοῦ κόσμου
  choice: 世上的
  rationale: 原文是“世界的”，没有“这世界”的指示成分；“世上的国”在中文中较自然。
- source_word: τοῦ κυρίου ἡμῶν καὶ τοῦ χριστοῦ αὐτοῦ
  choice: 我们主和他所立的弥赛亚的国
  rationale: 两个属格说明这国如今归属我们主及他的受膏者。补出第二个“国”所表达的归属关系，是为避免中文把“成了我们主和弥赛亚”误解为身份转变；“他所立的”传达“他的弥赛亚”的关系而不把弥赛亚误作普通姓名。
- source_word: τοῦ χριστοῦ αὐτοῦ
  choice: 他所立的弥赛亚
  rationale: Χριστός在此是称号，意为受膏者；“弥赛亚”保留其称号性质，“他所立的”自然表达αὐτοῦ所指的归属关系。
- source_word: καὶ βασιλεύσει
  choice: 他要作王
  rationale: βασιλεύσει是第三人称单数将来时；译文保留单数“他”，不擅自改成“他们”或明确补出所指者。
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: 直到永永远远
  rationale: 字面为“直到世世代代的世代”，是表示无尽持续的强化惯用语；“直到永永远远”保留时间方向与庄重语气。
theological_decisions:
- issue: Χριστός的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处“他的Χριστός”明显作为称号使用。“弥赛亚”较能让现代读者看出“受膏者”的头衔性质；脚注列出传统译法“基督”。
- issue: βασιλεύσει的主语
  choice: 他要作王
  alternative: 他们要作王；主和他的弥赛亚要作王
  rationale: 希腊文动词为单数。译文依原文保留压缩而未明说的单数指称，不替文本消除“我们主和他的弥赛亚”之后主语所指的神学张力。
- issue: 单数ἡ βασιλεία的处理
  choice: 世上的国
  alternative: 世上的万国；这世界的国
  rationale: SBLGNT正文采用单数，并且没有“这”的指示词，因此正文不采用异文所支持的复数或“这世界”措辞。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“吹响了号角”“响亮的声音”避免古奥表达；“作王”“永永远远”保留启示文学宣告的庄严感。正文所有脚注标记均已对应列出。
