  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Οὗτοί εἰσιν αἱ δύο ἐλαῖαι καὶ αἱ δύο λυχνίαι αἱ ἐνώπιον τοῦ κυρίου τῆς γῆς ⸀ἑστῶτες.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/004.yaml
  text: These are the two olive trees and the two lampstands standing before the Lord of the earth[a][b].
translation:
  language: zh_hans
  text: 他们就是那两棵橄榄树和两个灯台，站在全地之主面前。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里呼应《撒迦利亚书》第4章；其中橄榄树和灯台的意象象征上帝所委派、由圣灵赋能的仆人。
    reason: cross_reference
  - marker: b
    text: 或译：“他们站在全地之主面前。”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὗτοί
  choice: 他们
  rationale: 阳性复数指示代词在上下文中回指两位见证人；译作“他们”自然直接，又不把上一节的“见证人”增补进本节。
- source_word: ἐλαῖαι
  choice: 橄榄树
  rationale: 在这一与《撒迦利亚书》第4章相呼应的异象语境中，所指是橄榄树；此译保留原有意象。
- source_word: λυχνίαι
  choice: 灯台
  rationale: λυχνία 指承放灯的灯台，而非灯本身；“灯台”也保持《启示录》中的主题性用语。
- source_word: ἐνώπιον
  choice: 在……面前
  rationale: 表达处于某位面前或临在中的位置；“在……面前”简洁庄重，符合现代汉语。
- source_word: κυρίου
  choice: 主
  rationale: κύριος 在此是带有敬称和神学分量的称号，译作“主”最为贴切。
- source_word: γῆς
  choice: 全地
  rationale: γῆ 在《启示录》的宇宙性语境中指大地或世界；“全地之主”既自然，也传达其普世主权，而非局限于某一地区。
- source_word: ἑστῶτες
  choice: 站在
  rationale: 这是 ἵστημι 的完成时主动分词，描述已经就位并持续站立的状态；“站在”在汉语中简洁地保留这一状态。
theological_decisions:
- issue: 橄榄树、灯台意象与《撒迦利亚书》第4章及两位见证人的关系
  choice: 正文直接保留“那两棵橄榄树和两个灯台”的等同式隐喻，不解释其象征身份。
  alternative: 扩译为“这两位见证人好比那两棵橄榄树和两个灯台”。
  rationale: 希腊文以启示文学的意象直接指认他们，并未使用“好比”。保留原有隐喻可维持经文的互文关联和神学张力，避免在正文中替读者确定象征含义。
- issue: ἑστῶτες 与前面两个阴性复数名词在语法上的关系
  choice: 以“站在全地之主面前”承接整句，并用脚注说明也可理解为关系从句。
  alternative: 译作“他们是站在全地之主面前的那两棵橄榄树和两个灯台”。
  rationale: 分词为阳性复数，与句首回指两位见证人的 Οὗτοί 相呼应，而“橄榄树”和“灯台”均为阴性复数。正文保持自然的分词式表达，脚注保留其明确回指“他们”的可能读法。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“橄榄树”“灯台”“全地之主”保留启示文学意象和经文互文性；句法力求自然，同时不消解希腊文分词所带来的指向张力。
