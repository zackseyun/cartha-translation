base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/014.yaml
  text: The second woe has passed; behold[a], the third woe is coming quickly.
translation:
  language: zh_hans
  text: 第二样灾祸已经过去了；看哪，第三样灾祸正迅速来到。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “迅速”也可理解为“很快”或“不久”。希腊文ταχύ既可强调来临得迅速，也可强调时间临近。
    reason: 保留ταχύ在动作迅速与时间临近之间的语义张力。
lexical_decisions:
- source_word: οὐαί
  choice: 祸
  rationale: 此处名词化并与序数词连用，指《启示录》中依次出现的灾祸；“祸”既保留哀叹和灾难临到的色彩，也避免直接解释为“审判”。
- source_word: δευτέρα
  choice: 第二个
  rationale: 序数词直接修饰“祸”，按现代汉语自然表达译为“第二个”。
- source_word: ἀπῆλθεν
  choice: 已经过去
  rationale: 该不定过去时字面可指“离去”，在一连串灾祸的语境中表示第二个祸已经结束；“已经过去”自然且准确。
- source_word: ἰδού
  choice: 看哪
  rationale: 这是引人注意的语篇标记；“看哪”保留庄严、先知性的语气，又为现代读者所理解。
- source_word: τρίτη
  choice: 第三个
  rationale: 序数词直接修饰“祸”，译为“第三个”。
- source_word: ἔρχεται
  choice: 要来了
  rationale: 现在时使将临之事显得鲜明而迫近；“要来了”符合现代汉语，同时不加强为原文没有明确表达的“即将”。
- source_word: ταχύ
  choice: 快
  rationale: ταχύ既可强调时间上的临近，也可强调来临得迅速；正文用“快要来了”呈现紧迫感，脚注说明也可理解为迅速来临。
theological_decisions:
- issue: 末世语境中 ταχύ 的含义
  choice: 快要来了
  alternative: 来得很快／迅速来临
  rationale: 希腊文可指时间临近，也可指动作迅速。正文采用自然汉语“快要来了”，表达临近性；脚注保留“迅速来临”的可能，避免把有争议的时间与方式含义完全固定下来。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“看哪”有意保留《启示录》的先知性语气；分号体现两个灾祸之间的承接与转折。
