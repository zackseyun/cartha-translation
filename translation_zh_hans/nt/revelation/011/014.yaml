  naturalness: “第二样灾祸已经过去了；看哪，第三样灾祸正迅速来到。”在现代标准汉语中庄重、清晰，也适合《启示录》的宣告体。“第二样灾祸”比“第二个祸”更自然，并清楚表明这是被编号的灾祸。
