language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ τὸ πτῶμα αὐτῶν ἐπὶ τῆς πλατείας τῆς πόλεως τῆς μεγάλης, ἥτις καλεῖται πνευματικῶς Σόδομα καὶ Αἴγυπτος, ὅπου καὶ ὁ κύριος αὐτῶν ἐσταυρώθη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/008.yaml
  text: And their dead bodies lie in the street of the great city[a], which is spiritually called Sodom and Egypt[c][b], where also their Lord was crucified.
translation:
  language: zh_hans
  text: 他们的尸体[a]横陈在那大城的街道上；这城在属灵意义上称为所多玛和埃及[b]；在那里，他们的主也被钉十字架[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “尸体”在希腊文中是单数，可能把两位见证人视为一个整体；汉语“尸体”在形式上不区分单复数。
    reason: alternative_reading
  - marker: b
    text: “在属灵意义上称为”也可译作“象征性地称为”或“比喻地称为”。
    reason: lexical_alternative
  - marker: c
    text: “他们的主也被钉十字架”的地点指向耶路撒冷，但原文仍以象征性的称号“大城”称呼它。
    reason: cross_reference
lexical_decisions:
- source_word: τὸ πτῶμα αὐτῶν
  choice: 他们的尸体
  rationale: πτῶμα指倒下之人的尸身。汉语“尸体”自然、庄重而直接，并且本身不标明单复数，因此既不强行把希腊文单数改成复数，也能让读者理解其所指为两位见证人。
- source_word: ἐπὶ τῆς πλατείας
  choice: 在……街道上
  rationale: πλατεῖα可指宽阔的街道或公共广场；此处译作“街道”符合城市图景和现代汉语习惯，同时不排除其较宽阔、公开的空间含义。
- source_word: τῆς πόλεως τῆς μεγάλης
  choice: 那大城
  rationale: 保留启示录中“大城”这一具有重要象征意义的称谓；定冠词依语境译为“那”。
- source_word: πνευματικῶς
  choice: 按灵意
  rationale: 尽量保留该副词与“灵”有关的字面和神学张力，表明这些名称并非普通地理名称；“象征性地”作为解释性替代译法收入脚注。
- source_word: Σόδομα καὶ Αἴγυπτος
  choice: 所多玛和埃及
  rationale: 采用现代中文圣经读者熟悉的专名形式，不在正文中明说其象征的败坏或压迫，以免把解释加入经文。
- source_word: ὅπου καὶ
  choice: 也是……的地方
  rationale: 自然表达ὅπου的地点关系，并以“也”保留καί的附加语气。
- source_word: ὁ κύριος αὐτῶν
  choice: 他们的主
  rationale: “主”保留κύριος在此处作为基督称号的神学分量；“他们的”照译复数属格，指两位见证人。
- source_word: ἐσταυρώθη
  choice: 被钉十字架
  rationale: 采用现代中文基督教语境中清楚而通行的历史被动表达。
theological_decisions:
- issue: 单数πτῶμα所指的是两位见证人
  choice: 译为“他们的尸体”，利用现代汉语名词通常不显明单复数的特点，保留原文的整体性表达。
  alternative: 他们的两具尸体
  rationale: 原文虽以复数代词指两位见证人，却使用单数πτῶμα。正文不添加“两具”，避免消除这种修辞张力；脚注说明其形式。
- issue: πνευματικῶς在象征性命名中的含义
  choice: 按灵意
  alternative: 象征性地；比喻地
  rationale: “按灵意”较贴近原文字面，不把属灵层面的称呼完全化约为文学修辞；同时在脚注给出更易懂的解释性译法。
- issue: “大城”的具体身份
  choice: 正文保留“大城”，不直接改译为“耶路撒冷”。
  alternative: 耶路撒冷
  rationale: “他们的主被钉十字架的地方”明显指向耶路撒冷，但原文刻意保留“大城”及“所多玛和埃及”的启示文学称谓；译文不应替作者解开这一象征。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“横陈”凝练地表达尸体倒卧并公开暴露在街道上的景象，语体略显庄严但普通读者仍可理解；分号保留原文各部分的紧密联系。
