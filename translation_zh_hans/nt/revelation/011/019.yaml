id: REV.11.19
reference: Revelation 11:19
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ ἠνοίγη ὁ ναὸς τοῦ θεοῦ ⸀ὁ ἐν τῷ οὐρανῷ, καὶ ὤφθη ἡ κιβωτὸς τῆς διαθήκης ⸀αὐτοῦ ἐν τῷ ναῷ αὐτοῦ· καὶ ἐγένοντο ἀστραπαὶ καὶ φωναὶ καὶ βρονταὶ ⸂καὶ σεισμὸς⸃ καὶ χάλαζα μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/019.yaml
  text: And the temple of God in heaven was opened[a], and the ark of his covenant was seen in his temple[c][b]; and there were flashes of lightning and voices and peals of thunder and an earthquake and great hail.
translation:
  language: zh_hans
  text: 天上神的殿开了[a]，他的约柜在他的殿中显现；又有闪电、声音[c]、雷鸣、地震和大冰雹。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “殿”或译“圣所”。希腊语ναός侧重殿内神圣的居所，而不是整个圣殿建筑群。
    reason: lexical_alternative
  - marker: c
    text: “声音”也可译作“众声”或“响声”。启示录常在彰显神威严和审判的异象中使用这一表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: ναὸς
  choice: 殿
  rationale: “殿”在现代中文圣经语境中自然庄重，可指神的天上居所；希腊词更具体地侧重殿内的神圣居所，故在脚注保留“圣所”这一译法。
- source_word: ὁ ἐν τῷ οὐρανῷ
  choice: 在天上的
  rationale: 作为修饰“神的殿”的地点短语处理，简洁保留其位于天上的含义。
- source_word: ἠνοίγη
  choice: 开了
  rationale: 中文不必机械使用被动标记；“开了”保留事件的发生，同时不添加开启者。
- source_word: ὤφθη
  choice: 显现出来
  rationale: 表达约柜进入可见状态，符合希腊语被动形式的语义，又比“被看见”更自然；不明说是谁看见。
- source_word: κιβωτὸς τῆς διαθήκης αὐτοῦ
  choice: 他约的柜
  rationale: 明确保留αὐτοῦ“他的”，并以“约的柜”紧贴原文属格结构；脚注说明也可按固定称谓译作“约柜”。
- source_word: ἐν τῷ ναῷ αὐτοῦ
  choice: 在他的殿中
  rationale: 保留重复出现的ναός及αὐτοῦ所表达的所属关系。
- source_word: ἐγένοντο
  choice: 又有
  rationale: 以自然中文引出随后发生的一连串现象，并保留连接词καί的推进作用。
- source_word: ἀστραπαὶ
  choice: 闪电
  rationale: 现代汉语中“闪电”可自然涵盖希腊语复数所指的多次电光。
- source_word: φωναὶ
  choice: 声音
  rationale: 既保留φωνή的基本语义，也避免将其限定为可辨识的言语；“众声”作为更贴近复数及启示录惯用语的译法收入脚注。
- source_word: βρονταὶ
  choice: 雷鸣
  rationale: 自然表达复数雷声接连响起的景象，并保持庄重的异象文体。
- source_word: σεισμὸς
  choice: 地震
  rationale: 直接、标准地表达该词在审判异象中的含义。
- source_word: χάλαζα μεγάλη
  choice: 大冰雹
  rationale: 贴近形容词加名词的原文形式，保留其规模或强度上的“大”，不擅自改成“冰雹暴”。
theological_decisions:
- issue: 天上ναός的性质
  choice: 正文译作“殿”
  alternative: “圣所”
  rationale: “殿”是自然且不预设天上建筑细节的中文表达；“圣所”更突出ναός所指的内层神圣居所，作为真实的词义可能性列入脚注。
- issue: 神显现景象中φωναί的含义
  choice: 正文译作“声音”
  alternative: “众声”或“响声”
  rationale: “声音”保留词义开放性，不武断判定为说话声、轰响或隆隆声；脚注保留其他可能，以维持启示录这一固定异象用语的张力。
- issue: 约柜与神之约的关系
  choice: 译作“他约的柜”
  alternative: “约柜”
  rationale: 正文保留原文明确的αὐτοῦ“他的”，指出这是神的约；同时脚注提供中文较熟悉的固定称谓，但不让固定称谓遮蔽原文所有格。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。句法保留原文由多个“καί”推动的异象节奏，但以中文分号划分殿中显现与自然现象两部分；避免生硬的显式被动句，也不补入原文未说明的行动者或观看者。
