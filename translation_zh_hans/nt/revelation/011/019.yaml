  source_fidelity: 译文整体准确保留了天上的神殿开启、约柜在殿中可见，以及随后的异象性征兆。μως，“他约的柜”不是现代汉语可接受的属格表达，且会妨碍读者辨认“约柜”这一固定名称；宜改为“他的约柜”，并在脚注说明原文所有格修饰“约”。
  naturalness: “神在天上的殿”语序略有歧义，容易先读成“神在天上”，而非“在天上的神的殿”。改为“天上神的殿”更自然清楚。“他的约柜”是现代庄重书面语中自然、可理解的表达。“显现”已足够，无须“显现出来”。
  terminology: “殿”“圣所”“约柜”“闪电、声音、雷鸣、地震和大冰雹”均符合中文圣经语体。保留“声音”恰当，避免把φωναί过早定为言语或单纯轰响。
