  to: 天上神的殿开了[a]，他的约柜在他的殿中显现；又有闪电、声音[c]、雷鸣、地震和大冰雹。
  rationale: 修订仅处理中文语序与“约柜”术语的自然性。“天上神的殿”明确对应“在天上的神的殿”；“他的约柜”使中文通顺，并借脚注保留原文中所有格具体修饰“约”的信息。其余异象用语、重复的“殿”及语义开放的“声音”均予保留。
