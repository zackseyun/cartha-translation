  text: Καὶ οἱ εἴκοσι τέσσαρες πρεσβύτεροι οἱ ἐνώπιον τοῦ ⸂θεοῦ καθήμενοι⸃ ἐπὶ τοὺς θρόνους αὐτῶν ἔπεσαν ἐπὶ τὰ πρόσωπα αὐτῶν καὶ προσεκύνησαν τῷ θεῷ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/016.yaml
  text: And the twenty-four elders, who were seated before God on their thrones, fell on their faces and worshiped God,
translation:
  language: zh_hans
  text: 那二十四位长老，坐在上帝面前、各自的宝座上；他们俯伏在地，敬拜上帝。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ εἴκοσι τέσσαρες πρεσβύτεροι
  choice: 那二十四位……长老
  rationale: “长老”符合《启示录》中这群天上议会人物的固定称呼；“那”表明他们是异象中先前已经出现的特定群体，“位”使现代汉语表达自然庄重。
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: 在上帝面前
  rationale: 既保留在上帝临在之处的空间关系，也传达宝座异象中的正式场景；“上帝”是现代汉语对 θεός 清楚而庄重的通称。
- source_word: καθήμενοι ἐπὶ τοὺς θρόνους αὐτῶν
  choice: 坐在……各自宝座上的
  rationale: “坐在……上”自然表达持续的坐姿；复数所有关系按汉语习惯译作“各自宝座”，清楚表明众长老坐在分别属于他们的宝座上。
- source_word: ἔπεσαν ἐπὶ τὰ πρόσωπα αὐτῶν
  choice: 俯伏在地
  rationale: 这是现代汉语中表达面伏于地、全身下拜的自然说法，保留原文敬拜时俯身伏地的具体姿态，避免生硬直译为“倒在他们的脸上”。
- source_word: προσεκύνησαν
  choice: 敬拜
  rationale: 受词明确是上帝，且场景位于天上宝座前，因此此处不是普通致敬，而是宗教意义上的敬拜。
theological_decisions:
- issue: 天上礼仪场景中 προσκυνέω 的含义
  choice: 译为“敬拜”
  alternative: “下拜”或“致敬”
  rationale: 动作明确朝向上帝，语境也属于天上的宝座敬拜；“敬拜”准确表达其宗教性质，同时不额外加入原文没有说明的教义内容。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。将较长的希腊语后置修饰结构整理为汉语前置定语，同时用“都”承接复数主语，使句子顺畅，并保留长老、上帝面前、宝座、俯伏和敬拜等关键意象。
