  text: λέγοντες· Εὐχαριστοῦμέν σοι, κύριε, ὁ θεός, ὁ παντοκράτωρ, ὁ ὢν καὶ ὁ ἦν, ὅτι εἴληφας τὴν δύναμίν σου τὴν μεγάλην καὶ ἐβασίλευσας.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/017.yaml
  text: saying[a], “We give thanks to you, Lord God Almighty, who is and who was[b], because you have taken your great power and begun to reign.”
translation:
  language: zh_hans
  text: 说：“主上帝、全能者，今在、昔在的那一位啊[a]，我们感谢你，因为你已经执掌了你那大能，作王了[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本和译本在启示录其他地方有“以后要来的”；但这里的希腊文本没有这句话。
    reason: textual_variant
  - marker: b
    text: 也可译作“开始作王了”或“已经掌权”。原文动词既可着重王权的开始，也可着重王权的实际施行；这里可能强调上帝的统治公开彰显出来。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: 说
  rationale: 现在主动分词，承接上一节众长老的动作并引出其话语；汉语用“说”自然简洁。
- source_word: Εὐχαριστοῦμέν σοι
  choice: 我们感谢你
  rationale: 准确表达向上帝献上感谢，同时保持天上敬拜庄重而自然的语气。
- source_word: κύριε, ὁ θεός, ὁ παντοκράτωρ
  choice: 主上帝，全能者
  rationale: 保留三个并列的神圣称号；“全能者”比单作形容词更能体现原文带冠词的称号性质。
- source_word: ὁ ὢν καὶ ὁ ἦν
  choice: 今在、昔在的那一位
  rationale: 保留启示录中公式化的神圣称谓及现在与过去的对举，不补入本节希腊文本没有的“将要来的”。
- source_word: ὅτι
  choice: 因为
  rationale: 这里说明感谢的原因，现代汉语用“因为”清楚自然。
- source_word: εἴληφας τὴν δύναμίν σου τὴν μεγάλην
  choice: 你已经执掌你的大能
  rationale: 完成时表示已经发生且结果延续至今；“执掌”比直译“拿取”更符合汉语中权能与统治的搭配，同时仍保留主动取得并行使权能的意象。
- source_word: ἐβασίλευσας
  choice: 作王了
  rationale: 简洁保留不定过去时所表达的决定性登基或施行王权；不在正文中强行限定为“开始作王”或持续性的“已经统治”。
theological_decisions:
- issue: 是否补入“将要来的”这一神圣称号成分
  choice: 今在、昔在的那一位
  alternative: 今在、昔在、以后要来的那一位
  rationale: SBLGNT本节只有ὁ ὢν καὶ ὁ ἦν，因此不按启示录其他经文的较长公式加以协调。
- issue: ἐβασίλευσας与上帝王权的关系
  choice: 作王了
  alternative: 开始作王了；已经掌权
  rationale: “作王了”既可指进入公开施行王权，也可指决定性地实行统治，保留原文在起始与实施之间的张力，不暗示上帝此前绝对没有王权。
translation_notes:
  register: 采用现代、庄重而适合诵读的敬拜语言。“今在、昔在”保留启示录神圣称号的凝练节奏；称呼语中的“啊”明确呼格并使长串称号在汉语中自然。
