source:
  edition: SBLGNT
  text: καὶ ἐν ἐκείνῃ τῇ ⸀ὥρᾳ ἐγένετο σεισμὸς μέγας, καὶ τὸ δέκατον τῆς πόλεως ἔπεσεν, καὶ ἀπεκτάνθησαν ἐν τῷ σεισμῷ ὀνόματα ἀνθρώπων χιλιάδες ἑπτά, καὶ οἱ λοιποὶ ἔμφοβοι ἐγένοντο καὶ ἔδωκαν δόξαν τῷ θεῷ τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/013.yaml
  text: And in that hour there was a great earthquake[a], and a tenth of the city fell, and seven thousand people were killed in the earthquake, and the rest became terrified and gave glory to the God of heaven.
translation:
  language: zh_hans
  text: 就在那时，发生了一场大地震，城的十分之一倒塌了。地震中有七千人[a]死亡；其余的人变得非常害怕，并把荣耀归给天上的上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“人的名字，七千”；这是一种以“名字”计数人的表达，意思是被计入死亡人数的有七千人。
    reason: 说明原文特殊的计数表达，并交代正文采用自然汉语“七千人”的依据。
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: 就在那时
  rationale: 保留原文鲜明而紧迫的时间指向；现代汉语中比直译“在那一个时辰”自然，也不把它泛化为较模糊的“当时”。
- source_word: ἐγένετο σεισμὸς μέγας
  choice: 发生了大地震
  rationale: 准确表达事件的发生；“大地震”直接对应 σεισμὸς μέγας，简洁自然。
- source_word: τὸ δέκατον τῆς πόλεως
  choice: 城的十分之一
  rationale: 保留原文明确的比例和部分关系。
- source_word: ἔπεσεν
  choice: 倒塌了
  rationale: 在城市遭遇地震的语境中，“倒塌”自然表达“倒下”的结果，同时不额外说明具体毁坏方式。
- source_word: ἀπεκτάνθησαν
  choice: 死了
  rationale: 原文为“被杀”，但在地震这一致死事件中，现代汉语用“死了”更自然，也清楚表达因灾死亡；不采用较古雅的“被杀戮”。
- source_word: ὀνόματα ἀνθρώπων χιλιάδες ἑπτά
  choice: 七千人
  rationale: ὀνόματα ἀνθρώπων 字面为“人的名字”，在此指按人数计算的人；正文按现代汉语习惯译明其所指，字面形式收入脚注。
- source_word: οἱ λοιποὶ
  choice: 其余的人
  rationale: 直接保留“其余者”的范围，不强化为具有解释性的“幸存者”。
- source_word: ἔμφοβοι ἐγένοντο
  choice: 都非常害怕
  rationale: 体现进入强烈恐惧状态的含义；“非常害怕”比生硬的“成为恐惧的”自然。
- source_word: ἔδωκαν δόξαν
  choice: 把荣耀归给
  rationale: 保留圣经语境中的固定表达及其动作性，不预先判定这是悔改、敬拜还是被迫承认。
- source_word: τῷ θεῷ τοῦ οὐρανοῦ
  choice: 天上的上帝
  rationale: 自然保留 τοῦ οὐρανοῦ 所构成的称号，区别于解释性的“在天上的上帝”。
theological_decisions:
- issue: 其余之人把荣耀归给上帝，是否表示真正悔改或得救的信心
  choice: 仅译出他们非常害怕，并把荣耀归给天上的上帝
  alternative: 明确译成“他们悔改了”，或译成“他们只是因惧怕而承认上帝的权能”
  rationale: 希腊文只陈述恐惧及归荣耀给上帝，没有明确界定这种回应的内在属灵性质；译文保留这一神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“就在那时”保持启示文学的即时感；整体短句化以增强灾变叙述的清晰度。脚注标记[a]已置于正文“七千人”之后。
