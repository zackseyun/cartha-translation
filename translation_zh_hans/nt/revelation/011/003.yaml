id: REV.11.3
reference: Revelation 11:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ δώσω τοῖς δυσὶν μάρτυσίν μου, καὶ προφητεύσουσιν ἡμέρας χιλίας διακοσίας ἑξήκοντα, ⸀περιβεβλημένοι σάκκους.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/003.yaml
  text: And I will grant to my two witnesses[a], and they will prophesy for one thousand two hundred sixty days[b], clothed in sackcloth.
translation:
  language: zh_hans
  text: “我要赐给我的两位见证人[a]；他们要说预言一千二百六十天，身穿麻衣[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“我要赐给我的两位见证人。”希腊文没有明说所赐的是什么；按上下文，很可能指使他们能够或受命说预言的使命、能力或权柄。
    reason: 说明原文省略宾语，并保留可能的理解范围。
  - marker: b
    text: 麻衣通常由粗糙的织物制成，常与哀恸、悔改和先知式的哀诉相关。
    reason: 说明古代文化意象，但不在正文中把象征意义固定为单一解释。
lexical_decisions:
- source_word: δώσω
  choice: 我要赐给
  rationale: 原文直译为“我将赐给”，却没有明说所赐之物。中文虽保留这种省略，但借后句可理解为赐下使命、能力或权柄；不在正文补出具体宾语，以保存原文的含混性。
- source_word: τοῖς δυσὶν μάρτυσίν μου
  choice: 我的两位见证人
  rationale: “见证人”保留 μάρτυς 的作证、见证含义；“两位”符合现代汉语对人的称呼，也自然表达数目。
- source_word: προφητεύσουσιν
  choice: 说预言
  rationale: 这是 προφητεύω 直接而通行的对应语，既可包括传达上帝的信息，也不把含义缩减为单纯预测未来。
- source_word: ἡμέρας χιλίας διακοσίας ἑξήκοντα
  choice: 一千二百六十天
  rationale: 宾格在此表示持续时间；现代汉语无须另加介词，即可自然表达“持续一千二百六十天”。
- source_word: περιβεβλημένοι
  choice: 身穿
  rationale: 完成时分词描写两位见证人处于已经穿着某物的状态；“身穿”简洁、庄重，并保留鲜明形象。
- source_word: σάκκους
  choice: 麻衣
  rationale: 原词字面指粗布或粗布衣；“麻衣”是中文圣经语境中自然、易懂的表达，保留哀恸、悔改和先知性哀诉的文化意象。
theological_decisions:
- issue: δώσω 所省略的宾语
  choice: 正文保留“我要赐给”而不补明所赐之物
  alternative: 我要赐权柄给我的两位见证人／我要委任我的两位见证人
  rationale: 上下文很可能指赐下说预言的使命、能力或权柄，但原文没有明说。中文能够以略带悬置而仍可理解的句式保存这种省略，故不把某一种解释写入正文。
- issue: 麻衣的象征意义
  choice: 正文保留“身穿麻衣”的具体形象
  alternative: 身穿哀服
  rationale: 麻衣可使人联想到哀恸、悔改和先知性的哀诉，但经文本身没有在此明确限定其象征意义，因此只在脚注说明文化背景。
- issue: 分词 περιβεβλημένοι 与主句的关系
  choice: 译为伴随状态“他们要身穿麻衣……说预言”
  alternative: 他们说预言……，并且身穿麻衣
  rationale: 该分词在数和格上与“两位见证人”相配，描写他们执行先知使命时的穿着状态；提前译出更合乎自然汉语，又不改变逻辑关系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我要赐给”有意保留原文未明说宾语的特殊句法；分号帮助读者看出前后紧密相关，同时避免擅自把后句改成明确的目的从句。脚注标记分别紧跟其所解释的“见证人”和“麻衣”。
