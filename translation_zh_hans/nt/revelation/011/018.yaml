id: REV.11.18
reference: Revelation 11:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ τὰ ἔθνη ὠργίσθησαν, καὶ ἦλθεν ἡ ὀργή σου καὶ ὁ καιρὸς τῶν νεκρῶν κριθῆναι καὶ δοῦναι τὸν μισθὸν τοῖς δούλοις σου τοῖς προφήταις καὶ τοῖς ἁγίοις καὶ τοῖς φοβουμένοις τὸ ὄνομά σου, ⸂τοὺς μικροὺς καὶ τοὺς μεγάλους⸃, καὶ διαφθεῖραι τοὺς διαφθείροντας τὴν γῆν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/018.yaml
  text: And the nations became angry[a], and your wrath came, and the time for the dead to be judged, and to give the reward to your servants—the prophets, the saints, and those who fear your name[b], the small and the great—and to destroy those who destroy the earth.
translation:
  language: zh_hans
  text: 列国发怒了；你的忿怒临到了，审判死人、把奖赏赐给你的仆人[a]——众先知、众圣徒和敬畏你名的人，无论卑微的还是尊贵的——并毁灭那些毁灭大地[b]的人的时候也到了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “仆人”也可译作“奴仆”。希腊语 doulos 可按语境指仆人或奴隶。
    reason: alternative_reading
  - marker: b
    text: “毁灭大地”也可译作“败坏大地”或“毁坏大地”；“大地”也可译作“土地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἔθνη
  choice: 列国
  rationale: 这里指世上的各国，处于末世审判的普世语境中；“列国”既保留集体性，也避免把范围缩限为“外邦人”。
- source_word: ὠργίσθησαν
  choice: 发怒了
  rationale: 准确表达不定过去时所述的发怒，并与下文神的“烈怒”形成同根概念上的对照，而不额外强化为“狂怒”。
- source_word: ἡ ὀργή σου
  choice: 你的烈怒
  rationale: “烈怒”自然表达神在末世施行审判的忿怒，并与列国的“发怒”形成鲜明对照。
- source_word: ὁ καιρός
  choice: 时候
  rationale: 指决定性、特定的时刻；上下文已明确其末世性质，无须在正文中增译“指定的”。
- source_word: τῶν νεκρῶν κριθῆναι
  choice: 审判死人的时候
  rationale: 用自然汉语表达被动不定式“死人受审判”，同时保持司法含义。
- source_word: τὸν μισθόν
  choice: 奖赏
  rationale: 此处指神赐给属他之人的报偿；“奖赏”比“工钱”更符合语境，也不引入过强的交易意味。
- source_word: τοῖς δούλοις σου
  choice: 你仆人
  rationale: 此处是对属于神并服事神之人的尊称，重点在其身份及所得奖赏；“仆人”自然贴切，另以脚注保留“奴仆”的可能。
- source_word: τοῖς προφήταις καὶ τοῖς ἁγίοις
  choice: 众先知、众圣徒
  rationale: 保留两个有定指意味的群体称谓；“圣徒”是《启示录》中对分别为圣之神子民的通行表达。
- source_word: τοῖς φοβουμένοις τὸ ὄνομά σου
  choice: 敬畏你名的人
  rationale: 保留圣经中“敬畏神的名”这一表达，其中的“敬畏”兼有畏惧与尊崇，不简化为单纯“尊敬”。
- source_word: τοὺς μικροὺς καὶ τοὺς μεγάλους
  choice: 无论尊卑
  rationale: 该对举涵盖不同地位的人；“无论尊卑”是自然、庄重的现代汉语表达，清楚传达其周全性。
- source_word: διαφθεῖραι τοὺς διαφθείροντας
  choice: 毁灭那些毁灭……之人
  rationale: 重复“毁灭”以尽量保留原文同一词根造成的对应：神毁灭那些正在毁灭大地的人。
- source_word: τὴν γῆν
  choice: 大地
  rationale: 启示文学的普世审判语境支持“大地”；原词也可指“土地”，故在脚注中保留。
theological_decisions:
- issue: δοῦλος用于称呼属神之人时应译为“仆人”还是“奴仆”
  choice: 仆人
  alternative: 奴仆
  rationale: 本节着重于神认可并奖赏属他的人，而不是突出受奴役的社会身份；正文采用自然且有尊称意味的“仆人”，脚注保留更强调归属关系的“奴仆”。
- issue: γῆ的范围是普世的“大地”还是局部的“土地”
  choice: 大地
  alternative: 土地
  rationale: 本节处于列国、死人受审和末世审判的宏观语境中，“大地”更合适；但原词本身允许“土地”，故不排除该词义并在脚注注明。
- issue: “众先知、众圣徒和敬畏你名的人”彼此之间的关系
  choice: 保留并列，不判定为三个互斥群体或同一群体的三个完全同位称谓
  alternative: 明确解释为三个群体，或全部解释为“仆人”的同位描述
  rationale: 希腊文的格位和连词表明这些称谓都与领受奖赏有关，但并未明确规定各组之间是否重叠；译文用破折号引出而不进一步消解这种关系。
- issue: τοὺς μικροὺς καὶ τοὺς μεγάλους修饰的范围
  choice: 将“无论尊卑”理解为概括前述领受奖赏者
  alternative: 仅修饰紧邻的“敬畏你名的人”
  rationale: 其位置允许与最近的群体紧密相连，但该固定对举常表达整体性的涵盖；译文把它置于整个列举之后，保留其概括作用而不添加更具体的群体划分。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以分号和破折号理清原文连续并列结构，同时反复使用“时候也到了”，使审判、奖赏和毁灭都明确受同一个“时候”统摄。保留“发怒／烈怒”的对照以及“毁灭／毁灭”的词语呼应。
