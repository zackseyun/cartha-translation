id: REV.11.2
reference: Revelation 11:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ τὴν αὐλὴν τὴν ἔξωθεν τοῦ ναοῦ ἔκβαλε ⸀ἔξωθεν, καὶ μὴ αὐτὴν μετρήσῃς, ὅτι ἐδόθη τοῖς ἔθνεσιν, καὶ τὴν πόλιν τὴν ἁγίαν πατήσουσιν μῆνας ⸀τεσσεράκοντα δύο.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/002.yaml
  text: But leave out the court outside the temple[a], and do not measure it, because it has been given to the nations[b], and they will trample the holy city for forty-two months.
translation:
  language: zh_hans
  text: 至于殿外的院子，要把它排除在外，不要量它，因为它已经交给列国了；他们要践踏圣城四十二个月。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐλή
  choice: 院子
  rationale: 在圣殿语境中指院落区域；“院子”自然易懂，也能与内层圣所形成空间对照。
- source_word: ἔξωθεν τοῦ ναοῦ
  choice: 殿外的
  rationale: 将介词短语理解为修饰“院子”，表明它位于ναός之外；用“殿外”简洁保留空间关系。
- source_word: ναός
  choice: 殿
  rationale: ναός在这里很可能特指圣殿中的圣所主体；中文“殿”比泛称整个建筑群的“圣殿”更能保留这一较窄含义。
- source_word: ἔκβαλε ἔξωθεν
  choice: 把它排除在外
  rationale: 结合随后“不要量它”，此表达的重点是将外院排除在丈量范围之外，而不是把一个实体猛烈扔出去；译文仍保留“在外”的强调。
- source_word: μὴ αὐτὴν μετρήσῃς
  choice: 不要量它
  rationale: 直接保留第二人称单数禁令的语气，中文简明自然。
- source_word: ἐδόθη
  choice: 它已经给了
  rationale: 保留被动式和未明说的施事者，不擅自补出上帝；“已经”传达交付所造成的当前状态。
- source_word: τοῖς ἔθνεσιν
  choice: 给了列国
  rationale: ἔθνη既可指各国，也可指外族人；“列国”保留启示文学和先知传统中的集体、政治性意味，另一种理解以脚注说明。
- source_word: πόλιν τὴν ἁγίαν
  choice: 圣城
  rationale: 这是简洁而惯用的圣经表达，不在正文中进一步指定为耶路撒冷。
- source_word: πατήσουσιν
  choice: 践踏
  rationale: 保留敌对压制、亵渎和蹂躏的强烈意象，也符合庄重的中文语体。
- source_word: μῆνας τεσσεράκοντα δύο
  choice: 四十二个月
  rationale: 宾格表示持续时间；中文无需另加介词即可自然表达时段。
theological_decisions:
- issue: ναός在异象中是泛指圣殿还是特指圣所
  choice: 正文译作“殿”
  alternative: 圣所；或整个圣殿
  rationale: 本节将外院与ναός相对，较窄的“圣所主体”含义更可能成立。“殿”既自然，又避免将其明确限定为整个圣殿建筑群；由于中文正文已能体现这一层次，未另设脚注。
- issue: ἔθνεσιν指列国还是外族人
  choice: 正文译作“列国”
  alternative: 外族人
  rationale: “列国”保留该词较广的民族—政治含义及启示文学的先知性语感；“外族人”则凸显与上帝子民相对的族群或宗教身份。原文容许两者，故以脚注保留后一种理解。
- issue: ἐδόθη的未明示施事者
  choice: 保持被动，不补明是谁交付的
  alternative: 明确译为“上帝把它交给了列国”
  rationale: 神圣被动虽可能暗示上帝的许可或行动，但原文并未明说施事者；译文不应将这一推论写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“至于”承接上一节并突出话题转换；“排除在外”按上下文表达不纳入丈量范围；“践踏”保留异象中强烈的敌对意象。正文中的脚注标记[a]与脚注对应。
