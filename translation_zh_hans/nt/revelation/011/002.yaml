  naturalness: 除“它已经给了列国”外，译文庄重、清楚，符合现代标准普通话的圣经叙述语体。“排除在外”和“践踏圣城四十二个月”均自然可懂。
  terminology: “院子”“殿”“圣城”“列国”“践踏”均合乎本节语境和庄重文体。“外族人”作为ἔθνεσιν的脚注替代语不如“外邦人”准确且合乎汉语圣经惯用法；改用“外邦人”，同时说明其所指为上帝子民以外的族群，可保留原文的语义张力而不在正文中作解释性限定。
