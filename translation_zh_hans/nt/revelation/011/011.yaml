  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ μετὰ τὰς τρεῖς ἡμέρας καὶ ἥμισυ πνεῦμα ζωῆς ἐκ τοῦ θεοῦ εἰσῆλθεν ⸂ἐν αὐτοῖς⸃, καὶ ἔστησαν ἐπὶ τοὺς πόδας αὐτῶν, καὶ φόβος μέγας ⸀ἐπέπεσεν ἐπὶ τοὺς θεωροῦντας αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/011.yaml
  text: And after the three and a half days[a], a breath of life from God entered into them, and they stood on their feet, and great fear fell on those watching them.
translation:
  language: zh_hans
  text: 过了那三天半，从上帝而来的生命的气息[a]进入他们里面；他们就站了起来，极大的恐惧临到那些注视他们的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“生命之灵”；也可理解为“从上帝而来的生命之灵”，并可能特指圣灵。希腊语πνεῦμα可指气息、灵，或圣灵。
    reason: 保留πνεῦμα的词义歧义，以及此处是否特指圣灵的神学张力；避免把“生命之灵”改释为“赐生命的圣灵”。
lexical_decisions:
- source_word: μετὰ τὰς τρεῖς ἡμέρας καὶ ἥμισυ
  choice: 过了那三天半
  rationale: μετά加宾格表示时间上的“在……之后”；定冠词使这段时期具有特指性。“那三天半”既保留启示文学中的特定时段，也符合现代汉语表达。
- source_word: πνεῦμα ζωῆς
  choice: 生命之气
  rationale: πνεῦμα可指气息、灵或圣灵。此处描写死者恢复生命，并呼应以西结书37章等生命复苏意象，因此正文采用不预先认定为圣灵的“生命之气”；其他可能含义列入脚注。
- source_word: ἐκ τοῦ θεοῦ
  choice: 从上帝而来的
  rationale: ἐκ表示来源；此译明确保留使人复生的生命之气源自上帝。
- source_word: εἰσῆλθεν ἐν αὐτοῖς
  choice: 进入他们里面
  rationale: 保留εἰσέρχομαι的“进入”以及ἐν αὐτοῖς所表达的内部进入；“进入他们里面”在现代汉语中清楚自然。
- source_word: ἔστησαν ἐπὶ τοὺς πόδας αὐτῶν
  choice: 他们就站了起来
  rationale: 该短语表示他们用自己的脚站立起来；汉语“站了起来”已自然包含双脚站立之意，避免生硬直译，同时保留复起的动作。
- source_word: φόβος μέγας
  choice: 极大的恐惧
  rationale: 直接保留形容词μέγας的强度和φόβος的核心含义，不擅自加强为“惊恐”或“恐怖”。
- source_word: ἐπέπεσεν ἐπὶ
  choice: 临到
  rationale: 该结构描写恐惧突然落在或临到人身上；“临到”保留原文形象，也符合庄重的现代汉语。
- source_word: τοὺς θεωροῦντας αὐτούς
  choice: 那些注视他们的人
  rationale: θεωρέω表示持续观看、察看；“注视”比一般的“看见”更能体现现在分词所呈现的持续观看。
theological_decisions:
- issue: πνεῦμα ζωῆς是非人格化的生命气息，还是明确指圣灵
  choice: 正文译作“生命之气”
  alternative: “生命之灵”，或“赐生命的圣灵”
  rationale: 原文明确说明其来自上帝，却没有明确把πνεῦμα认定为圣灵。正文采用“生命之气”，既契合复生场景，也避免加入原文未明说的教义判断；“灵”的可能解释在脚注中保留。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“那三天半”保留特指性；“临到”保留原文中恐惧如同落在人身上的形象。脚注标记紧接其所解释的“生命之气”。
