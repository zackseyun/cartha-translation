id: REV.11.7
reference: Revelation 11:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ ὅταν τελέσωσιν τὴν μαρτυρίαν αὐτῶν, τὸ θηρίον τὸ ἀναβαῖνον ἐκ τῆς ἀβύσσου ποιήσει μετ’ αὐτῶν πόλεμον καὶ νικήσει αὐτοὺς καὶ ἀποκτενεῖ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/007.yaml
  text: And when they finish their testimony[a], the beast that comes up out of the abyss will make war with them and conquer them and kill them.
translation:
  language: zh_hans
  text: 他们完成自己的见证以后，那从深渊上来的兽要与他们交战[a]，并且胜过他们，杀死他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“要向他们发动战争”。
    reason: 原文的战争习语可按μετά的形式译作“与他们交战”，也可按语境明确译出敌对方向。
lexical_decisions:
- source_word: τελέσωσιν
  choice: 完成
  rationale: ὅταν加不定过去时虚拟语气表达将来发生的时点；“完成”自然地传达把所承担的见证进行到底。
- source_word: μαρτυρίαν
  choice: 见证
  rationale: 可指“见证”或“证言”；此处“见证”既可表示两位见证人所作的宣告，也保留启示录中作见证这一主题。
- source_word: θηρίον
  choice: 兽
  rationale: “兽”简洁准确，符合启示文学语境，也与启示录相关称谓保持一致。
- source_word: ἀναβαῖνον
  choice: 上来的
  rationale: 以关系性表达处理现在分词，保留其生动的上升动作，同时符合现代汉语习惯。
- source_word: ἀβύσσου
  choice: 深渊
  rationale: “深渊”直接对应ἀβύσσος，避免把其明确解释为物理意义上的“无底坑”。
- source_word: ποιήσει μετ’ αὐτῶν πόλεμον
  choice: 要与他们交战
  rationale: “与他们交战”自然表达ποιεῖν πόλεμον的战争意象，并贴近μετά加属格的“与他们”；上下文已清楚表明敌对关系。
- source_word: νικήσει
  choice: 胜过
  rationale: “胜过”保留νικάω在启示录中反复出现的“得胜、胜过”词汇联系，又能表达这里兽暂时占据上风的结果。
- source_word: ἀποκτενεῖ
  choice: 杀死
  rationale: “杀死”直接、清楚，准确表达致死含义，不采用古雅的措辞。
theological_decisions:
- issue: ποιήσει μετ’ αὐτῶν πόλεμον中敌对关系的表达
  choice: 要与他们交战
  alternative: 要向他们发动战争
  rationale: 原文使用μετά加属格，字面结构近于“与他们”，而“交战”已明确表示双方敌对；脚注列出更显明攻击方向的译法。
- issue: νικήσει是否暗示最终性的征服
  choice: 胜过他们
  alternative: 战胜他们
  rationale: “胜过”既符合当前叙事中兽杀害见证人的结果，也避免额外断定这是最终、永久的胜利，并保留νικάω在全书中的主题性用语。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“完成自己的见证”比“作完证言”更自然，并保留见证活动的神学分量；“深渊”贴近原词而不过度解释；整体按原文连续三个将来动作的推进来组织。
