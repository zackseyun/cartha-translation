source:
  edition: SBLGNT
  text: καὶ βλέπουσιν ἐκ τῶν λαῶν καὶ φυλῶν καὶ γλωσσῶν καὶ ἐθνῶν τὸ πτῶμα αὐτῶν ἡμέρας τρεῖς ⸀καὶ ἥμισυ, καὶ τὰ πτώματα αὐτῶν οὐκ ⸀ἀφίουσιν τεθῆναι εἰς μνῆμα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/009.yaml
  text: And some from the peoples and tribes and languages and nations look at their dead bodies for three and a half days[a], and they do not allow them to be laid in a tomb.
translation:
  language: zh_hans
  text: 有些来自各民族、各支派、说各种语言、属于各邦国的人，观看他们的尸身长达三天半[a]，又不准把他们的尸体安放在坟墓里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊原文先用单数“他们的尸身”，后用复数“他们的尸体”。前一个单数可能把两位见证人作为一个共同的见证整体来呈现，随后又转回分别指他们的尸体。
    reason: 现代汉语普通名词通常不标示单复数；脚注保留原文由单数转为复数的形式特征及其可能的解释意义，而不将该解释定为唯一含义。
lexical_decisions:
- source_word: βλέπουσιν
  choice: 观看
  rationale: 保留现在时所呈现的持续、鲜明的视觉动作；“观看”比单纯的“看见”更能表达注视尸身之意。
- source_word: ἐκ τῶν λαῶν καὶ φυλῶν καὶ γλωσσῶν καὶ ἐθνῶν
  choice: 各民族、各支派、各语言群体和各邦国中都有人
  rationale: “中都有人”自然表达ἐκ的部分含义，即有人来自这些群体，并不暗示其中每一个人都在观看。
- source_word: λαῶν
  choice: 各民族
  rationale: 保留复数集合群体的意义，也符合《启示录》中反复出现的族群列举。
- source_word: φυλῶν
  choice: 各支派
  rationale: “支派”是圣经语境中φυλή的标准而清楚的译法。
- source_word: γλωσσῶν
  choice: 各语言群体
  rationale: 此处γλῶσσα指语言；译为“语言群体”能与前后所列的人群类别自然并列，避免把抽象的语言本身写成观看者。
- source_word: ἐθνῶν
  choice: 各邦国
  rationale: 在本节列举中表达不同国族；“邦国”既保留复数群体性，也避免与λαῶν同译为“民族”。
- source_word: τὸ πτῶμα αὐτῶν
  choice: 他们的尸身
  rationale: 原文第一处πτῶμα为单数。汉语“尸身”在形式上不标明单复数，可保留原文将两位见证人作为一个整体呈现的可能，又不造出生硬的“一个尸体”。
- source_word: ἡμέρας τρεῖς καὶ ἥμισυ
  choice: 历时三天半
  rationale: 自然表达宾格所表示的持续时间，并保留启示文学中的明确时段。
- source_word: τὰ πτώματα αὐτῶν
  choice: 他们的尸体
  rationale: 第二处πτώματα是复数；现代汉语名词通常不强制标示复数，因此用脚注说明原文由单数转为复数，同时正文保持庄重自然。
- source_word: οὐκ ἀφίουσιν
  choice: 不准
  rationale: 此处ἀφίημι意为准许；“不准”简洁、现代，准确表达禁止。
- source_word: τεθῆναι εἰς μνῆμα
  choice: 安放在坟墓里
  rationale: 保留“被放置进入墓中”的具体图像，比概括性的“埋葬”更贴近原文。
theological_decisions:
- issue: 第一处单数πτῶμα与第二处复数πτώματα之间的变化
  choice: 正文分别译作“尸身”和“尸体”，并以脚注明示原文先单数、后复数
  alternative: 两处均直接译为“尸体”，不说明数的变化；或用生硬措辞在正文强制标出单数与复数
  rationale: 现代汉语普通名词本身通常不标示数，无法像英语那样自然重现这种形式差异。采用不同而相近的词并加脚注，可保留原文可能先把两位见证人作为一个共同见证整体、随后又分别指其身体的张力，而不把这一解释确定为唯一含义。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“各……中都有人”保留部分性，不扩大为所有人；“尸身／尸体”避免古奥，也借词语变化提示原文结构。脚注标记[a]已置于相关时间短语之后，与所给审校层保持一致。
