  text: καὶ ⸀ἤκουσαν ⸂φωνῆς μεγάλης⸃ ἐκ τοῦ οὐρανοῦ ⸀λεγούσης αὐτοῖς· ⸀Ἀνάβατε ὧδε, καὶ ἀνέβησαν εἰς τὸν οὐρανὸν ἐν τῇ νεφέλῃ, καὶ ἐθεώρησαν αὐτοὺς οἱ ἐχθροὶ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/012.yaml
  text: And they heard a loud voice from heaven saying to them, “Come up here,” and they went up to heaven in the cloud, and their enemies watched them.
translation:
  language: zh_hans
  text: 他们听见有一个洪亮的声音从天上对他们说：“上到这里来！”他们就在那云彩[a]中升上天去，他们的仇敌看着他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在一朵云中。”希腊文直译是“在那云中”，也可能呼应圣经中神临在和申雪的云彩意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσαν
  choice: 听见
  rationale: 此处是不定过去时，指他们听见天上声音这一事件，而非持续地聆听。
- source_word: φωνῆς μεγάλης
  choice: 一个洪亮的声音
  rationale: μεγάλης在此修饰声音，主要表示音量或威势；“洪亮”兼顾现代汉语的自然表达和庄严语体。
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: 从天上
  rationale: 启示录的异象及神圣发声语境表明οὐρανός指天上的领域，而不只是天空。
- source_word: λεγούσης αὐτοῖς
  choice: 对他们说
  rationale: 明确保留αὐτοῖς的对象，并以自然汉语表达修饰“声音”的分词结构。
- source_word: Ἀνάβατε ὧδε
  choice: 上到这里来
  rationale: 保留复数命令的向上运动及ὧδε“这里”的指向性；较“到这里来”更清楚呈现ἀναβαίνω。
- source_word: ἀνέβησαν εἰς τὸν οὐρανὸν
  choice: 升到天上
  rationale: 准确表达向上进入天上领域的运动，同时避免使用可能过度术语化的“升天”。
- source_word: ἐν τῇ νεφέλῃ
  choice: 在那云中
  rationale: 保留希腊文定冠词所可能指向的特定云彩，并让读者仍可感受到圣经中神临在与申雪的云彩意象。
- source_word: ἐθεώρησαν
  choice: 注视着
  rationale: θεωρέω含观看、观察之意，强于单纯“看见”；进行性表达符合敌人目睹这一场景的语感。
- source_word: οἱ ἐχθροὶ αὐτῶν
  choice: 他们的仇敌
  rationale: 直接保留所属关系和敌对意味；“仇敌”适合庄重的圣经叙事语体。
theological_decisions:
- issue: “那云”可能含有神临在和申雪的圣经意象
  choice: 正文译作“在那云中”
  alternative: “在一朵云中”
  rationale: 希腊文使用定冠词，可能唤起读者对特定神圣云彩意象的联想；正文保留这种可能性，却不在译文中明说其神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“洪亮的声音”“升到天上”“注视着”既自然又保留原文力度；用“那云”而非通常量词结构，是为保存定冠词及潜在互文意味。脚注标记置于整节末尾，所注对象在脚注中明确指出。
