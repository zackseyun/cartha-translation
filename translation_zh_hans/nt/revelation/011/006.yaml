source:
  edition: SBLGNT
  text: οὗτοι ἔχουσιν ⸂τὴν ἐξουσίαν κλεῖσαι τὸν οὐρανόν⸃, ἵνα μὴ ὑετὸς βρέχῃ τὰς ἡμέρας τῆς προφητείας αὐτῶν, καὶ ἐξουσίαν ἔχουσιν ἐπὶ τῶν ὑδάτων στρέφειν αὐτὰ εἰς αἷμα καὶ πατάξαι τὴν γῆν ⸂ἐν πάσῃ πληγῇ ὁσάκις ἐὰν θελήσωσιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/006.yaml
  text: These have the authority to shut the sky so that no rain may fall during the days of their prophecy[a], and they have authority over the waters to turn them into blood and to strike the earth with every plague as often as they wish.
translation:
  language: zh_hans
  text: 这两位有权封住天空，使雨在他们说预言的日子里不降下[a]；他们也有权掌管众水，把水变成血；无论何时他们愿意，都可以用各样灾祸击打大地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“封住天，使雨在他们说预言的日子里不降下。”希腊语 οὐρανός 既可指“天”，也可指“天空”；正文因上下文谈到降雨而译作“天空”。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτοι
  choice: 这两位
  rationale: 指向上文的两位见证人；中文若仅译“这些”不自然，因此明确其已知所指，并未增加新的身份解释。
- source_word: ἐξουσίαν
  choice: 有权
  rationale: 表达获授的权柄或权限，不只表示施行神迹的能力。
- source_word: κλεῖσαι τὸν οὐρανόν
  choice: 封闭天空
  rationale: οὐρανός 可指“天”或“天空”；因下文直接涉及降雨，正文采用“天空”，并在脚注保留另一可能。
- source_word: ἵνα μὴ ὑετὸς βρέχῃ
  choice: 使雨……不降下
  rationale: 自然表达封闭天空所产生的目的或结果，同时保留原文“雨”这一名词意象。
- source_word: τὰς ἡμέρας τῆς προφητείας αὐτῶν
  choice: 在他们说预言的日子
  rationale: 将属格结构按汉语习惯处理为时间范围；προφητεία 在此指他们进行先知性宣告的时期。
- source_word: ἐπὶ τῶν ὑδάτων
  choice: 掌管众水
  rationale: 与“有权”连用，表示对众水拥有支配权；“众水”保留希腊文复数及启示文学色彩。
- source_word: στρέφειν αὐτὰ εἰς αἷμα
  choice: 把水变成血
  rationale: 直接保留转变的神迹图像，并以“水”明确中文代词所指。
- source_word: πατάξαι τὴν γῆν
  choice: 击打大地
  rationale: “击打”现代而庄重；“大地”体现 γῆ 的广泛范围。
- source_word: ἐν πάσῃ πληγῇ
  choice: 用各种灾祸
  rationale: ἐν 表工具或手段；πάσῃ 在此与可反复施行的语境结合，译为“各种”既自然，也不把灾祸限定为某一固定清单。
- source_word: ὁσάκις ἐὰν θελήσωσιν
  choice: 可以随自己的意愿，屡次
  rationale: 兼顾任意时机与反复发生的含义；避免译成只发生一次的“每当”。
theological_decisions:
- issue: 两位见证人的行动与摩西、以利亚神迹之间的呼应
  choice: 直接保留封天、变血和以灾祸击打大地的神迹语言
  alternative: 在译文中将这些行动解释为纯象征
  rationale: 原文陈述他们获授的权柄，却没有裁定这些图像应理解为字面、象征，还是兼具两者；译文不替正文消解这一张力。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。“这两位”承接上文两位见证人；“众水”“灾祸”“击打大地”保留启示文学的宏阔意象。脚注标记已在正文相应位置列出。
