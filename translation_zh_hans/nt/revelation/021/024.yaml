  text: καὶ περιπατήσουσιν τὰ ἔθνη διὰ τοῦ φωτὸς αὐτῆς· καὶ οἱ βασιλεῖς τῆς γῆς φέρουσιν ⸂τὴν δόξαν αὐτῶν⸃ εἰς αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/024.yaml
  text: And the nations will walk by its light[c][b][a], and the kings of the earth will bring their glory into it.
translation:
  language: zh_hans
  text: 列国要借着城的光行走；地上的君王也要把自己的荣耀[a]带进城里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “荣耀”也可译作“荣华”或“尊荣”。
    reason: lexical_alternative
lexical_decisions:
- source_word: περιπατήσουσιν
  choice: 要……行走
  rationale: 保留“行走”的具体图景；在此与“光”搭配，比泛化为“生活”更贴近原文。
- source_word: τὰ ἔθνη
  choice: 列国
  rationale: 此处指众多民族与邦国；“列国”自然、庄重，也保留其旧约先知书背景。
- source_word: διὰ τοῦ φωτὸς αὐτῆς
  choice: 借着城的光
  rationale: διά接属格在此主要表示凭借的途径或媒介。“借着”保留这种关系；将阴性代词的所指明确为上下文中的城，避免现代汉语中生硬而含混的“它的光”。
- source_word: οἱ βασιλεῖς τῆς γῆς
  choice: 地上的君王
  rationale: 这是《启示录》中常见的末世性称谓；“地上”准确保留γῆ在此的范围。
- source_word: φέρουσιν
  choice: 也要把……带进
  rationale: 原文虽用现在时，但置于异象所描绘的将来场景中；汉语用“也要”使两个并列分句衔接自然，同时保留预言性指向。
- source_word: τὴν δόξαν αὐτῶν
  choice: 自己的荣耀
  rationale: “荣耀”保留δόξα的广阔含义及其先知书互文，可涵盖君王的荣华、尊荣与显赫；“自己的”清楚表达反身领属关系。
- source_word: εἰς αὐτήν
  choice: 带进城里
  rationale: εἰς表示进入，阴性代词指向新耶路撒冷这座城；汉语重复“城”比使用无性别代词更自然，也准确保留空间方向。
theological_decisions:
- issue: 阴性代词所指及新耶路撒冷的拟人化
  choice: 译作“城的光”和“带进城里”，按当前空间场景明确其所指。
  alternative: 译作“她的光”和“带到她那里”，突出新耶路撒冷作为新妇的拟人形象。
  rationale: 本节直接描绘列国行走和君王进入城中的空间场景。现代汉语用“城”既清楚又不否认本章其他经文中的新妇意象，同时避免在此过度强化拟人化。
- issue: 君王带入城中的δόξα所涵盖的意义
  choice: 正文译“荣耀”，脚注列出“荣华”与“尊荣”。
  alternative: 正文直接译“荣华”或“尊荣”。
  rationale: “荣耀”既能承载财富、显赫和尊荣等含义，又保留与先知性经文的神学呼应，不把多义词限缩为单一层面。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“列国”“地上的君王”保持启示文学语体；用“城”代替代词，使所指清楚且符合汉语习惯。分号呈现两个紧密并列的异象画面。
