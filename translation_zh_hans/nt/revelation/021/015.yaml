  text: Καὶ ὁ λαλῶν μετ’ ἐμοῦ εἶχεν μέτρον κάλαμον χρυσοῦν, ἵνα μετρήσῃ τὴν πόλιν καὶ τοὺς πυλῶνας αὐτῆς καὶ τὸ τεῖχος αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/015.yaml
  text: And the one speaking with me had a golden measuring rod[a], so that he might measure the city and its gates and its wall.
translation:
  language: zh_hans
  text: 那位同我说话的，拿着一根金制的量杆[a]，好量那城、城门和城墙。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“一根金制的量苇杆”。希腊语κάλαμος本义是“芦苇、苇杆”，这里指量度用的杆。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λαλῶν μετ’ ἐμοῦ
  choice: 那位同我说话的
  rationale: 保留名词化现在分词的描述性表达，不把上下文中的“天使”明加到本节；“同我说话”自然、庄重，也可体现正在交谈的语境。
- source_word: εἶχεν
  choice: 拿着
  rationale: ἔχω的未完成过去时基本义为“有”；在量杆这一具体器具的语境中，现代汉语用“拿着”更自然，并未超出其持有之意。
- source_word: μέτρον κάλαμον χρυσοῦν
  choice: 一根金量杆
  rationale: μέτρον表明用途，κάλαμος本义为“芦苇、苇杆”，此处指量度所用的杆；“量杆”简洁传达器具功能，“金”保留材质，量词“根”符合汉语习惯。
- source_word: ἵνα μετρήσῃ
  choice: 要量
  rationale: ἵνα加虚拟式表示目的；汉语“要量”简明自然地表达目的，而非仅陈述未来动作。
- source_word: τὴν πόλιν
  choice: 那城
  rationale: 定冠词结合上下文指前述圣城；“那城”既保留指称，也不在本节直接补入“新耶路撒冷”。
- source_word: τοὺς πυλῶνας αὐτῆς
  choice: 城门
  rationale: πυλών可指门或门楼入口；在城市建筑语境中译作“城门”准确自然，并以“城”体现原文所属关系。
- source_word: τὸ τεῖχος αὐτῆς
  choice: 城墙
  rationale: τεῖχος指城市的围墙；“城墙”比泛称“墙”更准确地传达其建筑性质，并自然体现所属关系。
theological_decisions:
- issue: 是否明确把说话者称为天使
  choice: 译作“那位同我说话的”，不增添“天使”
  alternative: “那位同我说话的天使”
  rationale: 虽然前文可辨认此人为天使之一，本节希腊文却只用名词化分词描述他。译文遵从本节措辞，避免把上下文身份直接补入正文。
translation_notes:
  register: 采用现代、简洁而庄重的叙事语言。“那位……的”保留原文描述性结构；“金量杆”便于普通读者理解，同时用脚注保留κάλαμος的具体“苇杆”意象。
