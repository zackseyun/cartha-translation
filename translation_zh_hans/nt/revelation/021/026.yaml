  text: καὶ οἴσουσιν τὴν δόξαν καὶ τὴν τιμὴν τῶν ἐθνῶν εἰς αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/026.yaml
  text: and they will bring the glory and the honor of the nations into it[a].
translation:
  language: zh_hans
  text: 他们必把列国的荣耀和尊荣带进城中[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文用阴性代词，按字面也可译为“带进她里面”。该代词指这座城；城在希腊语中为阴性，周边语境也可能延续圣城作为新妇的拟人形象。
    reason: 保留原文中城市的阴性指代，并谨慎说明其可能的拟人意味。
lexical_decisions:
- source_word: οἴσουσιν
  choice: 他们必……带进
  rationale: 这是φέρω的将来时主动语态；“带进”自然表达把某物从外面带入城中的动作。“他们”保留希腊语第三人称复数主语，并承接上下文。
- source_word: τὴν δόξαν
  choice: 荣耀
  rationale: “荣耀”保留δόξα在《启示录》中兼具荣美、显赫和尊荣的宽广含义，也延续其圣经神学色彩。
- source_word: τὴν τιμὴν
  choice: 尊贵
  rationale: τιμή与δόξα并列，在此可指尊荣、可贵之物或贡礼般的价值；“尊贵”既自然，又避免将其过度限定为物质财富或敬意行为。
- source_word: τῶν ἐθνῶν
  choice: 列国的
  rationale: ἔθνη在这里泛指各国各族；“列国”符合异象体裁的庄重语域，也不额外引入“犹太人与外邦人”的对立。
- source_word: εἰς αὐτήν
  choice: 进城里
  rationale: 阴性代词αὐτήν所指的是新耶路撒冷这座城。“进城里”在现代汉语中清楚自然；原文可能带有的阴性拟人色彩在脚注中说明。
- source_word: καὶ
  choice: （承接上文）
  rationale: 句首καί把本节与前文相连。汉语独立成句时无需机械译出“并且”，由“他们必……”自然承接；名词短语内部的καί译为“和”。
theological_decisions:
- issue: αὐτήν所指及圣城的阴性拟人
  choice: 正文明确译作“进城里”
  alternative: “带进她里面”
  rationale: 代词所指是新耶路撒冷，正文明确说“城”最符合现代汉语习惯；同时以脚注保留希腊语阴性形式及上下文把圣城拟人为新妇的可能意味。
- issue: “列国的荣耀和尊贵”的具体含义
  choice: 保留宽泛表达，不进一步解释
  alternative: 列国的财富；列国文化中的荣美；列国献上的尊荣
  rationale: 原文没有限定这是物质财富、文化成果还是列国所献的敬意。采用宽泛措辞可保存异象本身的丰富性，避免加入特定末世论解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“列国”贴合《启示录》的异象语域；“带进城里”比照搬希腊语代词更自然。正文保留“荣耀和尊贵”的开放含义，不将其窄化为财富、文化成就或贡物。
