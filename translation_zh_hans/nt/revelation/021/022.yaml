id: REV.21.22
reference: Revelation 21:22
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ ναὸν οὐκ εἶδον ἐν αὐτῇ, ὁ γὰρ κύριος, ὁ θεός, ὁ παντοκράτωρ, ναὸς αὐτῆς ἐστιν, καὶ τὸ ἀρνίον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/022.yaml
  text: And I saw no temple in it[a], for the Lord God, the Almighty[b], is its temple, and the Lamb.
translation:
  language: zh_hans
  text: 我在城里没有看见圣殿[a]，因为主、全能的神就是城的圣殿，羔羊也是。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣殿”所译的希腊语ναός也可译作“圣所”，可特指圣殿内部的圣所。
    reason: lexical_alternative
lexical_decisions:
- source_word: ναὸν / ναὸς
  choice: 圣殿
  rationale: ναός在这里指圣殿，尤其可指其内部的圣所；“圣殿”最自然地表达城中不再有实体圣殿，并与神和羔羊亲自作为城的圣殿形成对照。
- source_word: οὐκ εἶδον
  choice: 我……没有看见
  rationale: 直接反映否定词与简单过去时动词的组合，在现代汉语中自然清楚，也保留约翰亲眼所见的叙述角度。
- source_word: ἐν αὐτῇ
  choice: 在城里
  rationale: 阴性代词所指的是前文的城；汉语不以语法性别指称城市，明说“城”可避免“其中”指向不清。
- source_word: ὁ κύριος, ὁ θεός, ὁ παντοκράτωρ
  choice: 主、全能的神
  rationale: 保留κύριος与θεός的神圣称号，并将παντοκράτωρ译为汉语圣经语体中清楚而庄重的“全能的”。标点体现原文同位关系，而不把这些称号误作不同对象。
- source_word: ναὸς αὐτῆς ἐστιν
  choice: 就是城的圣殿
  rationale: 保留单数谓语意象：“圣殿”仍为单数；补出“城”使所属关系在汉语中明确。
- source_word: καὶ τὸ ἀρνίον
  choice: 羔羊也是
  rationale: καί把“羔羊”追加为同样属于谓语“城的圣殿”的对象。“也是”在汉语中自然表达这种追加协调，同时不改写为复数谓语或引入额外教义解释。
theological_decisions:
- issue: 如何理解“ναὸς αὐτῆς ἐστιν, καὶ τὸ ἀρνίον”中神与羔羊的关系
  choice: 译作“主、全能的神就是城的圣殿，羔羊也是”，使神和羔羊都承接“城的圣殿”，并保留原文先陈述神、再以καί追加羔羊的结构。
  alternative: 译作“主、全能的神和羔羊就是城的圣殿”，将二者合并为并列主语。
  rationale: 原文ἐστιν为单数，首先与“主、全能的神”构成完整陈述，随后追加“羔羊”。所选译法既保留这一句法次序，也不削弱羔羊同为城之圣殿的高基督论含义，更不以汉语复数式重组消除原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“在城里”和“城的圣殿”明确代词所指；希腊语阴性代词只是与“城”的语法性别一致，汉语无需另加性别说明。“羔羊也是”既自然，又保留原文追加式结构。
