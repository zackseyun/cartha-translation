id: REV.21.8
reference: Revelation 21:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: τοῖς δὲ δειλοῖς καὶ ⸀ἀπίστοις καὶ ἐβδελυγμένοις καὶ φονεῦσι καὶ πόρνοις καὶ φαρμάκοις καὶ εἰδωλολάτραις καὶ πᾶσι τοῖς ψευδέσιν τὸ μέρος αὐτῶν ἐν τῇ λίμνῃ τῇ καιομένῃ πυρὶ καὶ θείῳ, ὅ ἐστιν ὁ θάνατος ὁ δεύτερος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/008.yaml
  text: But for the cowardly and unbelieving and detestable and murderers and sexually immoral and sorcerers and idolaters and all liars[a], their portion will be in the lake burning with fire and sulfur[c][b], which is the second death.
translation:
  language: zh_hans
  text: 至于胆怯的、不信的[a]、可憎的、杀人的、淫乱的、行邪术的、拜偶像的和所有说谎的人，他们所得的份就在那烧着火与硫磺的湖里；这就是第二次的死。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不信的”也可译作“不忠信的”或“不忠的”。
    reason: alternative_reading
lexical_decisions:
- source_word: δειλοῖς
  choice: 胆怯的
  rationale: 该词在这份恶行名单中指因畏惧而退缩，带有负面的道德意味；“胆怯的”比一般性的“害怕的”更准确。
- source_word: ἀπίστοις
  choice: 不信的
  rationale: ἄπιστος可指“不信”或“不忠信”。本节审判语境中“不信的”最直接，同时用脚注保留另一可能。
- source_word: ἐβδελυγμένοις
  choice: 可憎的
  rationale: 完成时分词描述被可憎之事所刻画的人；“可憎的”保留强烈的厌恶意味，又简洁庄重。
- source_word: φονεῦσι
  choice: 杀人的
  rationale: φονεύς指犯谋杀的人；“杀人的”在现代中文圣经语体中自然，也避免把一切造成死亡者都无差别归入。
- source_word: πόρνοις
  choice: 淫乱的
  rationale: 该词指从事不合宜性行为的人；“淫乱的”在中文中简洁，并可与名单中其他名词化形容词保持平行。
- source_word: φαρμάκοις
  choice: 行邪术的
  rationale: 在《启示录》的语境中指施行巫术或法术的人，并非普通用药者；“行邪术的”比音译或古奥称谓更清楚。
- source_word: εἰδωλολάτραις
  choice: 拜偶像的
  rationale: 直指敬拜偶像的人；此表达比“偶像崇拜者”更口语自然，同时保持庄重。
- source_word: πᾶσι τοῖς ψευδέσιν
  choice: 所有说谎的人
  rationale: ψευδής在此作名词用，可指说谎者或虚假的人；在恶行名单中“所有说谎的人”最清楚自然。
- source_word: τὸ μέρος αὐτῶν
  choice: 他们所得的份
  rationale: μέρος表示分得的份或归宿；这一表达保留分配所得的意象，并补出中文所需的谓语结构。
- source_word: ἐν τῇ λίμνῃ τῇ καιομένῃ πυρὶ καὶ θείῳ
  choice: 就在那烧着火与硫磺的湖里
  rationale: 保留修饰“湖”的燃烧分词结构，并将 θείον 按其实际所指译为现代通用的“硫磺”。
- source_word: ὅ ἐστιν ὁ θάνατος ὁ δεύτερος
  choice: 这就是第二次的死
  rationale: 以“这”回指前述火与硫磺的湖，并保留其解释、认定作用；“第二次的死”准确呈现序数结构。
theological_decisions:
- issue: 审判名单中 ἄπιστος 的含义
  choice: 不信的
  alternative: 不忠信的／不忠的
  rationale: 此处最自然地指不信的人，但词义也可涉及缺乏忠信；正文采用主要含义，脚注保留张力，不把两者强行合并。
- issue: “第二次的死”的回指范围
  choice: 用“这”回指前述火与硫磺的湖
  alternative: 将关系代词处理为“那湖就是第二次的死”
  rationale: 希腊文中关系代词为中性，而“湖”是阴性，可能概括回指前述整个审判景象；中文“这”既自然，也不把语法回指过度限定为单一名词。
- issue: θείῳ 的传统宗教表达
  choice: 硫磺
  alternative: 硫黄
  rationale: 原词指 sulfur；“硫磺”是现代中文中自然且能保留审判意象的表达，不需另引入教派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的中文。恶行名单以多个“……的”构成名词化并列，尽量保留希腊文反复使用 καί 的累加力度，同时用中文顿号和末项“和”避免生硬。正文唯一脚注标记[a]已置于相应词后。
