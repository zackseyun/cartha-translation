  text: ⸀καὶ ἡ ἐνδώμησις τοῦ τείχους αὐτῆς ἴασπις, καὶ ἡ πόλις χρυσίον καθαρὸν ὅμοιον ὑάλῳ καθαρῷ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/018.yaml
  text: And the material of its wall was jasper[a], and the city was pure gold[b], like pure glass.
translation:
  language: zh_hans
  text: 城墙是用碧玉[a]建造的；城是纯金的，如同纯净的玻璃[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“城墙的构造是碧玉。”原文“ἐνδώμησις”可指建造、构造，也可着重指所用的材料。
    reason: lexical_alternative
  - marker: b
    text: “纯净的玻璃”也可译作“清澈的玻璃”或“透明的玻璃”；这里的比喻强调城的纯净与明澈。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνδώμησις
  choice: 是用……建造的
  rationale: 该词可指建造、构造或建筑材料。与表语“碧玉”连用时，此译自然表达城墙的材质，同时不把词义过度限定为单指“材料”。
- source_word: τεῖχος
  choice: 城墙
  rationale: 上下文所描写的是城的外围墙体；“城墙”比泛指的“墙”更准确自然。
- source_word: ἴασπις
  choice: 碧玉
  rationale: 这是现代中文圣经语境中对该宝石名称的通行译法；古代所指矿石未必与现代矿物分类完全相同。
- source_word: χρυσίον καθαρόν
  choice: 纯金
  rationale: χρυσίον指作为材料的金，καθαρόν在此表示纯净、无杂质；合译“纯金”简洁自然。
- source_word: ὅμοιον
  choice: 如同
  rationale: 准确引出相似性比较，语体庄重而自然。
- source_word: ὑάλῳ καθαρῷ
  choice: 纯净的玻璃
  rationale: ὕαλος指玻璃或玻璃状物质，καθαρός可表达纯净或清澈；“纯净的玻璃”贴近原文重复使用καθαρός的措辞，并保留其可能兼含纯洁与清澈的意象。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“是用……建造的”避免生硬的“材料是”，分号呈现两个并列描述。正文中的[a]、[b]均与脚注对应。
