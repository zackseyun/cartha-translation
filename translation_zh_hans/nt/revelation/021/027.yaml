id: REV.21.27
reference: Revelation 21:27
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ οὐ μὴ εἰσέλθῃ εἰς αὐτὴν πᾶν κοινὸν καὶ ⸀ποιῶν βδέλυγμα καὶ ψεῦδος, εἰ μὴ οἱ γεγραμμένοι ἐν τῷ βιβλίῳ τῆς ζωῆς τοῦ ἀρνίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/027.yaml
  text: And nothing unclean will ever enter it[a], nor anyone who does what is detestable or false[b], but only those written in the Lamb’s book of life.
translation:
  language: zh_hans
  text: 凡污秽之物[a]，都绝不能进入那城；行可憎之事和虚假之事的人，也不能进入[b]；只有那些记在羔羊生命册上的人才能进去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “污秽”也可译作“不洁净”“被玷污”或“凡俗”。
    reason: lexical_alternative
  - marker: b
    text: 直译：“行可憎之事和虚假之事。”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μὴ εἰσέλθῃ
  choice: 绝不能进入
  rationale: οὐ μή与不定过去时虚拟语气构成强烈否定；“绝不能”自然地传达彻底排除。
- source_word: εἰς αὐτὴν
  choice: 进入那城
  rationale: 阴性代词指向前文的新耶路撒冷。汉语补出“那城”比单用“它”更自然，也没有引入新的所指。
- source_word: πᾶν κοινὸν
  choice: 凡污秽之物
  rationale: 中性单数πᾶν具有概括作用；κοινός在犹太洁净语境中可指不洁、被玷污或不适于神圣用途之物。“污秽”兼顾礼仪和道德色彩，脚注保留其他可能。
- source_word: ποιῶν βδέλυγμα καὶ ψεῦδος
  choice: 行可憎之事和虚假之事的人
  rationale: 现在分词作名词用，指以此类行为为特征的人；两个宾语同受ποιῶν支配。“行……之事”既较贴近原文，又是庄重而可懂的现代汉语。
- source_word: εἰ μὴ
  choice: 只有……才
  rationale: 此处引出唯一例外；汉语“只有……才”清楚表达限制和对比。
- source_word: οἱ γεγραμμένοι
  choice: 那些记在……上的人
  rationale: 完成时被动分词表示已经被记录并处于记录在册的状态。不补出原文未明说的“名字”。
- source_word: ἐν τῷ βιβλίῳ τῆς ζωῆς τοῦ ἀρνίου
  choice: 在羔羊生命册上
  rationale: “生命册”是βιβλίον τῆς ζωῆς准确而自然的汉语表达；“羔羊”保留启示录中的基督论称号，属格自然理解为所属关系。
theological_decisions:
- issue: 被排除者的范围
  choice: 分别保留“凡污秽之物”和“行可憎、虚假之事的人”两个层面。
  alternative: 把首项也完全人格化，译成“凡不洁净的人”。
  rationale: 希腊文先用中性表达πᾶν κοινόν，随后用名词化分词指人；译文不将两者合并。
- issue: βδέλυγμα καὶ ψεῦδος之间的关系
  choice: 译作“可憎之事和虚假之事”，保留原文的καί。
  alternative: 按自然分类关系译作“可憎或虚假之事”。
  rationale: 原文明确以καί连接两个宾语；直译为“和”保留并列形式，不替作者界定二者是合取条件还是并列类别。
- issue: “记在册上”的内容
  choice: 译作“那些记在……上的人”，不补“名字”。
  alternative: 译作“名字记在……上的人”。
  rationale: 册簿意象暗示所记录的是名字，但本节没有明说ὀνόματα；译文优先保留原文表述。
- issue: 进入与生命册的关系
  choice: 仅陈述经文的排除与唯一例外，不说明被记名的机制或时间。
  alternative: 补充预定、得救次序或行为条件等教义解释。
  rationale: 经文本身没有在此解释这些问题；应保留其神学张力，避免导入宗派性结论。
translation_notes:
  register: 采用现代、庄重、适合公开诵读的普通话。“那城”明示代词所指；分号使三个对照分句清晰。所有脚注标记均置于正文相应位置。
