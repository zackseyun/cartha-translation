  text: Καὶ ἦλθεν εἷς ἐκ τῶν ἑπτὰ ἀγγέλων τῶν ἐχόντων τὰς ἑπτὰ φιάλας, ⸂τῶν γεμόντων⸃ τῶν ἑπτὰ πληγῶν τῶν ἐσχάτων, καὶ ἐλάλησεν μετ’ ἐμοῦ λέγων· Δεῦρο, δείξω σοι τὴν ⸂νύμφην τὴν γυναῖκα⸃ τοῦ ἀρνίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/009.yaml
  text: Then one of the seven angels who had the seven bowls full of the seven last plagues came and spoke with me[a], saying, “Come, I will show you the bride[b], the wife of the Lamb.”
translation:
  language: zh_hans
  text: '启示录 21:9


    拿着那七个碗、盛满末后的七灾的七位天使中，有一位前来，同我说[a]：“来，我要把新娘，就是羔羊的妻子，指给你看。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“对我说”。希腊文作“同我说”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἦλθεν
  choice: 有一位来到我这里
  rationale: καί在这里推进叙事，中文无需机械译作“然后”；ἦλθεν直译为“来到”，补出“我这里”使叙述自然，但不改变方向含义。
- source_word: εἷς ἐκ τῶν ἑπτὰ ἀγγέλων
  choice: 七位天使中，有一位
  rationale: 用现代汉语自然表达ἐκ加属格的部分关系。
- source_word: τῶν ἐχόντων τὰς ἑπτὰ φιάλας
  choice: 拿着那七个碗的七位天使
  rationale: ἐχόντων表示这些天使持有或拿着碗；φιάλη指宽而浅的碗，不译作容易使人误解为小瓶的“瓶”。定冠词译作“那”，呼应前文已经出现的七碗。
- source_word: τῶν γεμόντων τῶν ἑπτὰ πληγῶν τῶν ἐσχάτων
  choice: 那些碗盛满了末后的七灾
  rationale: γεμόντων表达“充满、盛满”；πληγαί在《启示录》的审判语境中译作“灾”；ἐσχάτων保留次序及终末色彩，译为“末后的”。另起分句可避免汉语中修饰语层叠，同时清楚表明所盛的是七灾。
- source_word: ἐλάλησεν μετ’ ἐμοῦ
  choice: 他同我说话
  rationale: 保留μετά加属格的“同／与我”措辞，而不直接压平为通常的“对我说”；后者作为自然汉语的可能表达列入脚注。
- source_word: Δεῦρο
  choice: 来
  rationale: 简洁保留邀请或命令语气，无须增译“到这里来”。
- source_word: δείξω σοι
  choice: 我要……指给你看
  rationale: 直接体现将来时所表达的意向；“指给你看”是现代汉语中自然且准确的表达。
- source_word: τὴν νύμφην τὴν γυναῖκα τοῦ ἀρνίου
  choice: 新娘，就是羔羊的妻子
  rationale: 分别保留νύμφη与γυνή两个同位称谓；“就是”清楚呈现二者所指相同。ἀρνίον按《启示录》中基督的称号译为“羔羊”。
theological_decisions:
- issue: νύμφην与γυναῖκα的关系
  choice: 新娘，就是羔羊的妻子
  alternative: 羔羊的新娘和妻子
  rationale: 希腊文是同位结构，不是在列举两个不同对象；译文保留两个婚姻意象，又用“就是”避免误读为两人。
- issue: ἀρνίον作为基督论称号
  choice: 羔羊
  alternative: 羊羔
  rationale: 采用现代中文圣经语境中清楚、庄重的称号“羔羊”，不在正文中额外解释其所指或引入宗派性诠释。
- issue: 末后七灾所盛载的位置
  choice: 明确为碗盛满七灾
  alternative: 使修饰语在形式上可能贴近天使
  rationale: 从语义和启示录上下文看，盛满七灾的是七碗；中文明确关系，避免产生“天使盛满七灾”的不当歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“末后的七灾”“羔羊”等保留《启示录》的末世审判与婚宴意象。长串希腊语修饰成分拆为两个汉语分句，以确保所指清楚；正文中的脚注标记与脚注内容相符。
