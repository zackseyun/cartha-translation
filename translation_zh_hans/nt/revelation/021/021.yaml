source:
  edition: SBLGNT
  text: καὶ οἱ δώδεκα πυλῶνες δώδεκα μαργαρῖται, ἀνὰ εἷς ἕκαστος τῶν πυλώνων ἦν ἐξ ἑνὸς μαργαρίτου· καὶ ἡ πλατεῖα τῆς πόλεως χρυσίον καθαρὸν ὡς ὕαλος διαυγής.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/021.yaml
  text: And the twelve gates were twelve pearls; each one of the gates was from a single pearl. And the street of the city was pure gold[a], like transparent glass.
translation:
  language: zh_hans
  text: 十二座城门是十二颗珍珠，每座城门各由一颗珍珠而成。城里的大街[a]是纯金的，像透明的玻璃。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“城里的广场”；希腊语 πλατεῖα 也可指宽阔的街道。
    reason: lexical_alternative
lexical_decisions:
- source_word: πυλῶνες
  choice: 城门
  rationale: πυλών在新耶路撒冷的建筑语境中指城门或门楼结构；“城门”自然明确，也与中文圣经语体相称。
- source_word: μαργαρῖται / μαργαρίτου
  choice: 珍珠／一颗珍珠
  rationale: μαργαρίτης直指珍珠；保留先复数、后单数的结构，显明十二座城门与十二颗珍珠一一对应。
- source_word: ἀνὰ εἷς ἕκαστος
  choice: 每座……各
  rationale: ἀνά与εἷς构成分配用法，又由ἕκαστος加强，表示每一座各自对应一颗；中文用“每座……各”自然保留这一强调。
- source_word: ἐξ ἑνὸς μαργαρίτου
  choice: 由一颗珍珠而成
  rationale: ἐξ表示材料或来源；“由……而成”既忠实于原文，又避免生硬的“出自”，且不必过度说明制作过程。
- source_word: πλατεῖα
  choice: 大街
  rationale: πλατεῖα可指宽阔的街道或公共开放空间。此处译作“大街”能体现其名词化形容词所含的宽阔意味；脚注保留“广场”的可能性。
- source_word: χρυσίον καθαρὸν
  choice: 纯金
  rationale: χρυσίον指金，καθαρός在此表示纯净；“纯金”是准确而自然的现代汉语表达。
- source_word: ὡς ὕαλος διαυγής
  choice: 像透明的玻璃
  rationale: ὕαλος意为玻璃，διαυγής表示通透、透明；该译法保留异象中纯金如玻璃般透明的奇特意象。
theological_decisions:
- issue: πλατεῖα所描绘的城内公共空间性质
  choice: 正文译作单数“大街”
  alternative: “广场”或“宽阔的街道”
  rationale: 这是词义与异象意象问题，而非教义判断。译作“大街”保持单数和街道意象，又不对新耶路撒冷的城市布局作额外推断；脚注交代另一种可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“十二座城门”“十二颗珍珠”使用符合汉语习惯的量词；“每座……各”保留原文的分配强调。正文中的[a]与脚注完全对应。
