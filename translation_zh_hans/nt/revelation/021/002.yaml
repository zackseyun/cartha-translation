  text: καὶ τὴν πόλιν τὴν ἁγίαν Ἰερουσαλὴμ καινὴν εἶδον καταβαίνουσαν ἐκ τοῦ οὐρανοῦ ἀπὸ τοῦ θεοῦ, ἡτοιμασμένην ὡς νύμφην κεκοσμημένην τῷ ἀνδρὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/002.yaml
  text: And I saw the holy city[a], new Jerusalem, coming down out of heaven from God[c][b], prepared like a bride adorned for her husband.
translation:
  language: zh_hans
  text: 我又看见圣城，就是新耶路撒冷，从天上、从上帝那里降下，已经预备好了，好像一位为丈夫妆饰整齐的新娘。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πόλιν τὴν ἁγίαν
  choice: 圣城
  rationale: “城”保留异象中具体的城市意象；“圣城”是现代汉语中自然、庄重的圣经用语，也准确传达其归属于上帝、分别为圣的性质。
- source_word: Ἰερουσαλὴμ καινὴν
  choice: 新耶路撒冷
  rationale: “耶路撒冷”按惯用译名音译，καινήν译作“新”。汉字不涉及英文大小写问题，因此无需在正文或脚注中处理其究竟是描述语还是正式称号。
- source_word: εἶδον
  choice: 我又看见
  rationale: “看见”直接对应ὁράω；句首καί承接前一异象，在现代汉语中译为“又”比机械译作“和”更自然。
- source_word: καταβαίνουσαν ἐκ τοῦ οὐρανοῦ ἀπὸ τοῦ θεοῦ
  choice: 从天上由上帝那里降下
  rationale: “降下”准确表达向下移动；“从天上”保留ἐκ所表示的出处，“由上帝那里”另行表达ἀπό所标明的来源，避免把两个介词短语合并而损失层次。
- source_word: ἡτοιμασμένην
  choice: 已经预备妥当
  rationale: 完成时被动分词描写圣城处于预备完成的状态；“已经……妥当”自然地体现这一结果状态。
- source_word: ὡς νύμφην
  choice: 好像……新娘
  rationale: ὡς在此引出明喻；“好像”清楚保留比较性质，不把圣城与新娘的关系直接改写成身份判断。
- source_word: κεκοσμημένην
  choice: 装饰整齐
  rationale: κοσμέω在婚礼语境中指装扮、妆饰；“装饰整齐”既保留外在装扮的图像，也符合庄重而易懂的现代汉语。
- source_word: τῷ ἀνδρὶ αὐτῆς
  choice: 为丈夫
  rationale: ἀνήρ可指男人或丈夫；在新娘预备自己的婚礼语境中，“丈夫”最为自然。“新郎”虽符合场景，却会采用原文未使用的更专门称谓。
theological_decisions:
- issue: 是否把圣城与新娘的比喻直接解释为教会论身份
  choice: 保留“好像……新娘”的明喻，不作解释性扩展
  alternative: 译为“就是教会、羔羊的新妇”等解释性表达
  rationale: 本节以ὡς明确作比较，并未在此直接说明新娘象征谁。译文保留异象本身的神学张力，不把后文或特定教义解释写入正文。
- issue: “新耶路撒冷”是描述语还是正式称号
  choice: 译作“新耶路撒冷”，不另加解释
  alternative: 借助标点或说明把它明确规定为正式专名
  rationale: 希腊文可自然理解为“新的耶路撒冷”，也可在神学语境中被视为末世圣城的称号；中文没有英文大小写差异，直译即可保留这种开放性。
translation_notes:
  register: 采用现代、庄重而通顺的书面汉语。“就是”明确“圣城”与“新耶路撒冷”的同位关系；整体语序尽量贴近希腊文，同时避免生硬直译。
