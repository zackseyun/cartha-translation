id: REV.21.3
reference: Revelation 21:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἤκουσα φωνῆς μεγάλης ἐκ τοῦ ⸀θρόνου λεγούσης· Ἰδοὺ ἡ σκηνὴ τοῦ θεοῦ μετὰ τῶν ἀνθρώπων, καὶ σκηνώσει μετ’ αὐτῶν, καὶ αὐτοὶ ⸀λαοὶ αὐτοῦ ἔσονται, καὶ αὐτὸς ὁ θεὸς ⸂μετ’ αὐτῶν ἔσται⸃,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/003.yaml
  text: And I heard a loud voice from the throne saying[a], “Behold, the dwelling place of God is with humanity, and he will dwell with them, and they will be his peoples[d][c][b], and God himself will be with them.”
translation:
  language: zh_hans
  text: 我听见有洪亮的声音从宝座传来，说：“看哪，上帝的帐幕在人间[a]！他要与他们同住[b]；他们要作他的众民[c]，上帝亲自要与他们同在。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “帐幕”也可译作“居所”或“帐棚”。原文用σκηνή，保留了帐幕的意象；“在人间”对应原文“与人类同在”或“在人类中间”的意思。
    reason: 说明σκηνή的字面意义及帐幕意象，并准确交代μετὰ τῶν ἀνθρώπων与中文意译的关系。
  - marker: b
    text: “同住”所译的动词与“帐幕”同源，较直译可作“在他们中间支搭帐幕”。
    reason: 保留主文难以完整呈现的名词—动词语源呼应。
  - marker: c
    text: “众民”原文为复数；有些抄本作单数“子民”。
    reason: 说明SBLGNT正文的复数形式及重要异文，避免抹平文本差异。
lexical_decisions:
- source_word: φωνῆς μεγάλης
  choice: 洪亮的声音
  rationale: 在此表示声音响亮、有力；“洪亮”自然地传达宣告的声势与庄严感。
- source_word: ἐκ τοῦ θρόνου
  choice: 从宝座传来
  rationale: ἐκ表示声音的来源；补出“传来”符合现代汉语表达，同时保留启示录中的宝座意象。
- source_word: Ἰδοὺ
  choice: 看哪
  rationale: 保留原文唤起注意、郑重宣告的语气，也符合庄重而易懂的现代中文。
- source_word: ἡ σκηνὴ τοῦ θεοῦ
  choice: 上帝的帐幕
  rationale: σκηνή本义是帐棚、帐幕，并承载上帝住在子民中间的帐幕意象；中文“帐幕”既较直接，也能保留经文互文。
- source_word: μετὰ τῶν ἀνθρώπων
  choice: 在人间
  rationale: ἄνθρωποι泛指人类。“在人间”自然、简洁地表达上帝的居所在人类中间，并不限定性别。
- source_word: σκηνώσει μετ’ αὐτῶν
  choice: 他要与他们同住
  rationale: σκηνόω与前面的σκηνή同源，意为搭帐幕居住；“同住”在中文中清楚自然，帐幕这一语源呼应则由脚注说明。
- source_word: λαοὶ αὐτοῦ
  choice: 他的众民
  rationale: λαοί是复数。“众民”保留多个民、万民归属上帝的复数意味，避免按传统译法改成单数，同时比“他的各人民”更符合中文。
- source_word: αὐτὸς ὁ θεὸς
  choice: 上帝亲自
  rationale: “亲自”体现αὐτός的强调作用，突出上帝本身直接与他们同在。
- source_word: μετ’ αὐτῶν ἔσται
  choice: 要与他们同在
  rationale: 直接表达未来的同在，并保留具有盟约意味的庄重表述。
theological_decisions:
- issue: λαοὶ的复数形式与传统单数译法
  choice: 他们要作他的众民
  alternative: 他们要作他的子民
  rationale: SBLGNT正文采用复数λαοί。译作“众民”保留原文的复数张力，不把它默默归并为单数，也不进一步断定这些“民”彼此关系的具体神学含义。
- issue: σκηνή与σκηνόω的帐幕意象
  choice: 上帝的帐幕……他要与他们同住
  alternative: 上帝的居所……他要在他们中间支搭帐幕
  rationale: 主文保留名词“帐幕”，使旧约中上帝临在的意象清晰可见；动词则译成自然中文“同住”，并以脚注交代两词同源，兼顾可读性和互文意味。
- issue: μετὰ τῶν ἀνθρώπων的涵盖范围
  choice: 在人间
  alternative: 与人类同在；在人们中间
  rationale: 原文泛指人类，并非只指男性。“在人间”避免性别误读，也没有把所指缩小为某一个族群。
translation_notes:
  register: 采用现代、庄重而可朗读的标准普通话。“看哪”“帐幕”“同在”保留启示文学的宣告感和经文意象；句式简洁，不使用艰深学术措辞。“众民”有意保留希腊文复数，并通过脚注帮助普通读者理解。
