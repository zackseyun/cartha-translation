  text: ⸀οἱ θεμέλιοι τοῦ τείχους τῆς πόλεως παντὶ λίθῳ τιμίῳ κεκοσμημένοι· ὁ θεμέλιος ὁ πρῶτος ἴασπις, ὁ δεύτερος σάπφιρος, ὁ τρίτος χαλκηδών, ὁ τέταρτος σμάραγδος,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/019.yaml
  text: 'The foundations of the wall of the city were adorned with every kind of precious stone: the first foundation was jasper[a], the second sapphire, the third chalcedony, the fourth emerald[b],'
translation:
  language: zh_hans
  text: 城墙的根基用各样宝石装饰[a]：第一根基是碧玉，第二根基是蓝宝石，第三根基是玉髓[b]，第四根基是绿宝石。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“用每一种宝石装饰。”原文可按分配意义理解，所以正文译作“各样宝石”。
    reason: lexical_alternative
  - marker: b
    text: “玉髓”是希腊词 χαλκηδών 的传统对应译名；古代某些宝石名称究竟指哪一种矿石，难以确定。
    reason: cultural_note
lexical_decisions:
- source_word: οἱ θεμέλιοι
  choice: 根基
  rationale: 复数形式指城墙的各层根基；汉语可用集合性的“根基”，后文再以“第一层、第二层”逐一列举。
- source_word: τοῦ τείχους τῆς πόλεως
  choice: 城墙
  rationale: 按现代汉语自然合并为“城墙”，准确表达“城的墙”，不扩展为防御工事。
- source_word: παντὶ λίθῳ τιμίῳ
  choice: 各样宝石
  rationale: 表达 παντί 可能具有的分配意义，即各种贵重石头；“宝石”在上下文中自然且凝练。
- source_word: κεκοσμημένοι
  choice: 用……装饰
  rationale: 保留完成时被动分词所描写的已装饰状态，同时采用自然的现代汉语句式。
- source_word: ὁ θεμέλιος ὁ πρῶτος
  choice: 第一层根基
  rationale: 这里依次区分各个根基；加“层”符合城墙根基分层排列的汉语表达，但仍以脚注相关说明保留原文名词本身未明说“层”的空间。
- source_word: ἴασπις
  choice: 碧玉
  rationale: 这是 ἴασπις 的传统汉语译名；古代所指矿石未必与现代矿物分类完全相同。
- source_word: σάπφιρος
  choice: 蓝宝石
  rationale: 采用该古代宝石名称通行且易懂的现代汉语对应词。
- source_word: χαλκηδών
  choice: 玉髓
  rationale: 采用“chalcedony”的现代汉语通名；古代名称所指宝石的确切种类仍有不确定性。
- source_word: σμάραγδος
  choice: 绿宝石
  rationale: 准确传达通常理解的绿色珍贵宝石，并比特指现代矿物学品种的译法略能容纳古代名称的不确定性。
theological_decisions:
- issue: 启示文学中宝石名单的象征意义
  choice: 正文直接翻译各宝石名称，不解释其象征含义
  alternative: 把各宝石明确对应于以色列支派、使徒根基或祭司胸牌
  rationale: 本节只描写城墙根基的装饰，并未明说每种宝石的象征对象；译文不应加入原文未解释的神学体系。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以“各样宝石”简洁呈现分配意义；宝石名称不附加象征解释。脚注标记均置于正文相应位置。
