source:
  edition: SBLGNT
  text: Καὶ εἶδον οὐρανὸν καινὸν καὶ γῆν καινήν· ὁ γὰρ πρῶτος οὐρανὸς καὶ ἡ πρώτη γῆ ἀπῆλθαν, καὶ ἡ θάλασσα οὐκ ἔστιν ἔτι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/001.yaml
  text: And I saw a new heaven and a new earth[a], for the first heaven and the first earth had passed away[b], and the sea is no more.
translation:
  language: zh_hans
  text: 我看见了新天和新地，因为先前的天和先前的地[a]已经过去了，海也不再有了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“第一个天和第一片地”；也可译为“从前的天和从前的地”，指与新秩序相对的先前秩序。
    reason: lexical_alternative
  - marker: b
    text: “海”可以按字面理解；在《启示录》的意象中，它也可能使人联想到混乱、危险或隔绝。
    reason: cultural_note
lexical_decisions:
- source_word: εἶδον
  choice: 我又看见
  rationale: 用现代汉语中自然的叙事表达翻译简单过去时；“又”承接句首 Καί，体现异象叙事的推进。
- source_word: οὐρανὸν καινὸν καὶ γῆν καινήν
  choice: 一个新天和一片新地
  rationale: “天”和“地”在此构成宇宙性的配对；量词使现代汉语自然，同时“新”保留 καινός 的开放性，不预先判定这是替换还是更新。
- source_word: ὁ πρῶτος οὐρανὸς καὶ ἡ πρώτη γῆ
  choice: 先前的天和先前的地
  rationale: πρῶτος 在这里把此前的秩序与新秩序相对照；“先前的”比机械直译“第一个”更符合现代汉语，也不改变其时间与次序上的对比。
- source_word: ἀπῆλθαν
  choice: 都过去了
  rationale: 此处表示原有天地已经消逝；“过去了”简洁自然，并保留经文对其如何消逝的未说明状态。“都”清楚表明动词同时支配天与地。
- source_word: ἡ θάλασσα
  choice: 海
  rationale: 直接保留具体意象，不在正文中把它解释为混乱、邪恶或隔绝。
- source_word: οὐκ ἔστιν ἔτι
  choice: 也不再有了
  rationale: 准确表达“已经不再存在”的意思，符合现代汉语习惯，并与前句完成性的叙述自然衔接。
theological_decisions:
- issue: “新天新地”是替换还是更新
  choice: 只译作“新天”和“新地”，不说明其形成方式
  alternative: 明确译成全然取代旧创造，或明确译成旧创造得到更新
  rationale: καινός 表明新颖或新的性质，但本节本身没有裁定旧创造是被完全替换还是被更新；正文应保留这一张力。
- issue: “海也不再有了”的含义
  choice: 正文保留“海”这一具体意象
  alternative: 直接解释为混乱、邪恶、危险或隔绝不复存在
  rationale: 启示录中的海可能具有象征联想，也可按字面理解；翻译不应在正文中排除任何一种可能。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“我又看见”延续启示录异象叙事；“一片新地”避免“一個新地”的生硬。“先前的”准确传达 πρῶτος 在上下文中的对比功能。所有解释性内容均置于脚注，正文保留原文的简洁和象征开放性。
