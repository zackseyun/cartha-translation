  text: ἀπὸ ⸀ἀνατολῆς πυλῶνες τρεῖς, καὶ ἀπὸ βορρᾶ πυλῶνες τρεῖς, καὶ ἀπὸ νότου πυλῶνες τρεῖς, καὶ ἀπὸ δυσμῶν πυλῶνες τρεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/013.yaml
  text: On the east[a], three gates; and on the north, three gates; and on the south, three gates; and on the west, three gates.
translation:
  language: zh_hans
  text: 东边[a]三座门，北边三座门，南边三座门，西边三座门。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作“从东边……从北边……从南边……从西边”；这里按城门所在的方位译为“东边”等。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ ἀνατολῆς / ἀπὸ βορρᾶ / ἀπὸ νότου / ἀπὸ δυσμῶν
  choice: 东边／北边／南边／西边
  rationale: ἀπό的基本意义是“从”，但在这幅按方位描述城墙布局的图景中，四个短语指各门所在的一侧。译为“东边”等，既符合现代汉语习惯，也避免让人误解为移动的起点或来源。
- source_word: πυλῶνες
  choice: 门
  rationale: πυλών可指门或门道，尤其可指较宏伟的入口结构；本节描述新耶路撒冷城墙上的入口，译作“门”最清楚自然，也与上下文用语协调。
- source_word: τρεῖς
  choice: 三座
  rationale: 保留每一方位重复出现的数词“三”；量词“座”适用于城门等建筑结构，使汉语自然，同时维持原文整齐、对称的节奏。
- source_word: καὶ ... καὶ ... καὶ ...
  choice: 以并列分句依次列举
  rationale: 原文反复使用καί，形成有节律的四方列举。汉语以逗号连接四个结构完全平行的分句，自然地保留其并列、均衡和完整感。
theological_decisions:
- issue: 新耶路撒冷各城门的空间描述
  choice: 按四个方位直述每边各有三座门
  alternative: 在译文中明示其与以色列支派排列或以西结异象之城的象征联系
  rationale: 本节本身只按东、北、南、西列举城门。相关的正典象征可由读者从上下文辨认，不应直接加入正文，以免把解释写进翻译。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语。省去“有”字，使四个分句保持原文近似名词短语式的紧凑结构；重复“三座门”，呈现经文刻意营造的整齐与对称。
