  text: καὶ οἱ πυλῶνες αὐτῆς οὐ μὴ κλεισθῶσιν ἡμέρας, νὺξ γὰρ οὐκ ἔσται ἐκεῖ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/025.yaml
  text: And its gates will never be shut by day—for there will be no night there—[a][b]
translation:
  language: zh_hans
  text: 城门在白昼绝不会关闭，因为那里不会有黑夜。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较形式化地译作：“城门在白昼必定不被关闭。”希腊原文使用了强调否定结构。
    reason: lexical_alternative
  - marker: b
    text: 原文给出的理由是：“因为那里不会有黑夜。”
    reason: cross_reference
lexical_decisions:
- source_word: πυλῶνες
  choice: 城门
  rationale: 在新耶路撒冷的城市意象中，指城的门或城门设施；“城门”简明自然，也与上下文相符。
- source_word: οὐ μὴ κλεισθῶσιν
  choice: 绝不会关闭
  rationale: οὐ μή与不定过去时虚拟语气构成强烈的将来否定；“绝不会关闭”既表达将来含义，也保留强调语气。
- source_word: ἡμέρας
  choice: 在白昼
  rationale: 此处属格作时间副词用，表示白昼期间，并与下句的“黑夜”形成直接对照。
- source_word: νὺξ γὰρ οὐκ ἔσται ἐκεῖ
  choice: 因为那里不会有黑夜
  rationale: “因为”明确表达γάρ的解释、说明作用；“不会有”自然传达ἔσται的存在义和将来指向。
- source_word: καὶ
  choice: 承接上文，不另译
  rationale: καί在此连接前后描述；中文连续叙述无需机械译作“并且”，省略后语流更自然，承接关系仍由上下文清楚表达。
- source_word: αὐτῆς
  choice: 以“城门”隐含所属关系
  rationale: 阴性代词指向前文的城。汉语用“城门”已自然表明是该城的门，不必生硬译作“它的门”，也不额外强化拟人色彩。
theological_decisions:
- issue: 新耶路撒冷的拟人化程度
  choice: 用“城门”表达，不译作“她的门”
  alternative: 她的门
  rationale: 希腊语阴性代词与阴性名词“城”保持语法一致，并不必然要求在汉语中拟人化。本节重点是城门恒常开放以及那里没有黑夜，因此采用自然的非拟人表达。
- issue: 城门不关闭与没有黑夜之间的逻辑关系
  choice: 用“因为”明确表示原因
  alternative: 仅以破折号并列两句
  rationale: γάρ明确引出解释或理由；译作“因为”保留原文的逻辑关系，同时不进一步规定这理由的神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“绝不会”保留希腊文强调否定的力度；“在白昼”保留与“黑夜”的词面对应；不照搬英文末尾破折号，以符合现代汉语标点和句法习惯。
