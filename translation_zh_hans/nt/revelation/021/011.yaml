  text: ἔχουσαν τὴν δόξαν τοῦ θεοῦ· ὁ φωστὴρ αὐτῆς ὅμοιος λίθῳ τιμιωτάτῳ, ὡς λίθῳ ἰάσπιδι κρυσταλλίζοντι·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/011.yaml
  text: having the glory of God[a]; its radiance was like a most precious stone, like a jasper stone[b], clear as crystal.
translation:
  language: zh_hans
  text: 城带着上帝的荣耀；城的光辉[a]好像一块最珍贵的宝石，又像一块碧玉，晶莹如水晶[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “光辉”也可译作“光”或“光芒”。
    reason: lexical_alternative
  - marker: b
    text: “晶莹如水晶”也可译作“闪耀如水晶”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχουσαν
  choice: 带着
  rationale: 现在主动分词阴性宾格单数，承接上一节的“城”；“带着”自然保留其修饰关系，并表达城具有上帝荣耀的状态。
- source_word: τὴν δόξαν τοῦ θεοῦ
  choice: 上帝的荣耀
  rationale: “荣耀”是δόξα在圣经语境中的常用译法，既保留可见的辉煌，也保留上帝临在与威荣的神学分量。
- source_word: ὁ φωστὴρ αὐτῆς
  choice: 城的光辉
  rationale: φωστήρ可指发光体、光或辉光；这里描写城所呈现的明亮光彩，译作“光辉”自然且不把它限定为具体发光天体。
- source_word: ὅμοιος λίθῳ τιμιωτάτῳ
  choice: 好像一块极其珍贵的宝石
  rationale: τιμιωτάτῳ具有最高级或强烈程度，译作“极其珍贵”；λίθος在宝石语境中译为“宝石”，符合现代汉语。
- source_word: ὡς λίθῳ ἰάσπιδι
  choice: 又像一块碧玉
  rationale: 保留第二重比拟和λίθος的个体意象；ἴασπις传统译作“碧玉”，但古代所指矿石未必与现代矿物分类完全相同。
- source_word: κρυσταλλίζοντι
  choice: 晶莹如水晶
  rationale: 该分词表示具有水晶般的性质，可能侧重透明、明亮或闪耀；“晶莹如水晶”在汉语中自然，并保留一定语义宽度。
theological_decisions:
- issue: 末世异象中δόξα τοῦ θεοῦ的表达
  choice: 上帝的荣耀
  alternative: 上帝的辉煌
  rationale: 原文不仅描写视觉上的灿烂，也指向上帝临在所彰显的威荣；“荣耀”较完整地保留这种神学内涵。
- issue: φωστήρ与上帝荣耀之间的关系
  choice: 城的光辉
  alternative: 城的光／城的发光体
  rationale: 不把φωστήρ明确等同于上帝本身或某一具体光源，只按本句保留它作为城所显出的光亮，避免加入原文未明说的解释。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“城”补明分词和代词所承接的对象，使单节独立阅读时清楚；两个脚注标记均已置入正文。
