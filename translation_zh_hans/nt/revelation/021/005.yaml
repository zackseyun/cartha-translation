  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ εἶπεν ὁ καθήμενος ἐπὶ τῷ θρόνῳ· Ἰδοὺ ⸂καινὰ ποιῶ πάντα⸃. καὶ ⸀λέγει· Γράψον, ὅτι οὗτοι οἱ λόγοι ⸂πιστοὶ καὶ ἀληθινοί⸃ εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/005.yaml
  text: And the one seated on the throne said[a], “Behold, I am making all things new.” And he said, “Write[b], because these words are trustworthy and true.”
translation:
  language: zh_hans
  text: 坐在宝座上的那一位说：“看哪，我正在使万物成为新的。”他又说：“写下来，因为这些话是可信而真实的。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ καθήμενος ἐπὶ τῷ θρόνῳ
  choice: 坐在宝座上的那一位
  rationale: 保留现在分词的描述作用和宝座意象；“那一位”庄重自然，也不额外指明说话者身份。
- source_word: Ἰδοὺ
  choice: 看哪
  rationale: 保留引人注意的郑重语气，适合启示文学的庄严语境。
- source_word: καινὰ ποιῶ πάντα
  choice: 我正使一切都更新
  rationale: “正使”体现 ποιῶ 的现在时动态；“一切”传达 πάντα 的全面范围；“更新”自然表达使之成为新的含义，同时不裁定是彻底替换还是转化更新。
- source_word: Γράψον
  choice: 你要写下来
  rationale: 传达单数命令式的直接语气；补出汉语中自然的主语，并以“下来”表达记录之意，没有限定原文未明说的具体宾语。
- source_word: ὅτι
  choice: 因为
  rationale: 按语境理解为说明写下这些话的理由，清楚呈现逻辑关系。
- source_word: οὗτοι οἱ λόγοι
  choice: 这些话
  rationale: 自然、直接地指向所宣告的启示性言语。
- source_word: πιστοὶ καὶ ἀληθινοί
  choice: 可信、真实
  rationale: “可信”说明这些话值得信赖；“真实”直接表达其真实性，并保留两个并列形容词的区分。
theological_decisions:
- issue: καινὰ ποιῶ πάντα 所表达的末世更新之范围与性质
  choice: 我正使一切都更新
  alternative: 我使万物成为新的；我更新一切
  rationale: 保留现在时的动态和 πάντα 的全面范围，同时不把经文解释为必然的彻底替换或仅仅修复，维持原文的神学张力。
- issue: 宝座上说话者的称谓
  choice: 坐在宝座上的那一位
  alternative: 坐宝座的；那位坐在宝座上的
  rationale: 忠实保留宝座所象征的权柄，却不在本节明说的内容之外加入更具体的身份界定。
- issue: πιστοὶ καὶ ἀληθινοί 的关系
  choice: 可信、真实
  alternative: 信实、真实
  rationale: 使两个词共同修饰“这些话”，既表达话语可靠，也表达其真实；不把 πιστοί 专门化为某一教义性的“信实”概念。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”略带提升语体，以保存启示文学的宣告感；其余措辞避免过度古雅。原文异文标记所涉及的词序不改变基本意义，正文采用自然汉语语序。
