id: REV.21.10
reference: Revelation 21:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἀπήνεγκέν με ἐν πνεύματι ἐπὶ ὄρος μέγα καὶ ὑψηλόν, καὶ ἔδειξέν μοι τὴν ⸀πόλιν τὴν ἁγίαν Ἰερουσαλὴμ καταβαίνουσαν ἐκ τοῦ οὐρανοῦ ἀπὸ τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/010.yaml
  text: And he carried me away in the Spirit onto a great and high mountain[a], and showed me the holy city, Jerusalem, coming down out of heaven from God,
translation:
  language: zh_hans
  text: 他在圣灵里[a]把我带到一座又大又高的山上，又让我看见圣城耶路撒冷正从天上、从上帝那里降下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在灵里。”这个希腊语短语可能表示处于异象状态；在《启示录》中，它常用来引入先知性的异象。
    reason: 保留ἐν πνεύματι在圣灵的作用与较宽泛的异象状态之间的词义可能性。
lexical_decisions:
- source_word: ἀπήνεγκέν
  choice: 把我带到
  rationale: 该动词在异象语境中表示把约翰从一个观看地点带往另一个地点；“把我带到”符合现代汉语，也保留了移动之意。
- source_word: ἐν πνεύματι
  choice: 在圣灵里
  rationale: 这是《启示录》中反复出现的先知性异象表达，很可能指圣灵的作用；正文采用通行且庄重的译法，同时以脚注保留“在灵里”及异象状态的可能含义。
- source_word: ἐπὶ ὄρος μέγα καὶ ὑψηλόν
  choice: 到一座又大又高的山上
  rationale: ἐπί加宾格表示朝向并到达山上；“又大又高”分别保留μέγα与ὑψηλόν两个形容词。
- source_word: ἔδειξέν μοι
  choice: 让我看见
  rationale: 自然表达“给我看、使我看见”，未额外加入“启示”等原文没有明说的神学含义。
- source_word: τὴν πόλιν τὴν ἁγίαν Ἰερουσαλήμ
  choice: 圣城耶路撒冷
  rationale: 将Ἰερουσαλήμ理解为对“圣城”的同位说明，简洁保留原文所指。
- source_word: καταβαίνουσαν
  choice: 正……降下
  rationale: “正”体现现在分词所描绘的进行中动作；“降下”比“下降而来”更简洁自然。
- source_word: ἐκ τοῦ οὐρανοῦ ἀπὸ τοῦ θεοῦ
  choice: 从天上、从上帝那里
  rationale: 分别保留ἐκ所指的出处与ἀπό所指的来源；两个“从”避免把“上帝”误解为“天上”的同位语。
theological_decisions:
- issue: ἐν πνεύματι中“灵”的所指
  choice: 正文译作“在圣灵里”
  alternative: “在灵里”，可泛指属灵或异象状态，也可能指约翰的灵
  rationale: 《启示录》1:10、4:2、17:3等处以此短语引入先知性异象，圣灵施行作用的理解较为可能；脚注保留希腊语未明确冠词与大小写所留下的张力，不将其扩译为“被圣灵感动”。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“又大又高”完整保留原文并列修饰语；“从天上、从上帝那里”虽略有重复，但有意保存原文两个介词短语及其神学信息。
