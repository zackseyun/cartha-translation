  text: καὶ ἐμέτρησεν τὸ τεῖχος αὐτῆς ἑκατὸν τεσσεράκοντα τεσσάρων πηχῶν, μέτρον ἀνθρώπου, ὅ ἐστιν ἀγγέλου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/017.yaml
  text: And he measured its wall[a], 144 cubits by human measure, which is also an angel’s measure.
translation:
  language: zh_hans
  text: 他又量了城墙，共一百四十四肘；这是按人的量法，也就是天使的量法。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“按人的量法，也就是按那天使的量法。”希腊原文可能强调天使采用了人的计量单位，也可能表示人的量法与天使的量法在这里相同。
    reason: 保留 μέτρον ἀνθρώπου, ὅ ἐστιν ἀγγέλου 这一凝练结构的两种自然理解。
lexical_decisions:
- source_word: ἐμέτρησεν
  choice: 量了
  rationale: 简明传达简单过去时所述的测量动作，符合现代汉语叙事习惯。
- source_word: τὸ τεῖχος αὐτῆς
  choice: 城墙
  rationale: τεῖχος 指城的墙垣；αὐτῆς 所指的城在汉语复合词“城墙”中已自然显明，无须另译所有格。
- source_word: ἑκατὸν τεσσεράκοντα τεσσάρων πηχῶν
  choice: 一百四十四肘
  rationale: 保留原文古代长度单位，不擅自换算；使用中文数字使经文庄重而易读。
- source_word: μέτρον ἀνθρώπου
  choice: 按人的量法
  rationale: ἀνθρώπου 在此为泛指；“人的”不限定男性。“量法”兼顾 μέτρον 可指尺度、计量标准或量度方式的含义。
- source_word: ὅ ἐστιν ἀγγέλου
  choice: 也就是天使的量法
  rationale: 补出汉语所需的“量法”，并用“也就是”表达 ὅ ἐστιν 的解释关系，同时不明确断定究竟强调天使采用人的单位，还是二者尺度在此相同。
theological_decisions:
- issue: μέτρον ἀνθρώπου, ὅ ἐστιν ἀγγέλου 的解释
  choice: 正文译为“这是按人的量法，也就是天使的量法”
  alternative: “按人的量法，也就是按那天使的量法”或“按人的尺度，也就是天使的尺度”
  rationale: 希腊文结构凝练，既可理解为天使采用人所用的计量标准，也可能强调此处人的量法与天使的量法相应。正文保留其解释性关系，脚注说明歧义，不进一步作神学推断。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“肘”保留古代单位；分号使测量结果及其说明层次清楚。脚注标记已在正文中以 [a] 出现。
