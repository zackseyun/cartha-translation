source:
  edition: SBLGNT
  text: καὶ ἡ πόλις τετράγωνος κεῖται, καὶ τὸ μῆκος αὐτῆς ⸀ὅσον τὸ πλάτος. καὶ ἐμέτρησεν τὴν πόλιν τῷ καλάμῳ ἐπὶ ⸀σταδίους δώδεκα ⸀χιλιάδων· τὸ μῆκος καὶ τὸ πλάτος καὶ τὸ ὕψος αὐτῆς ἴσα ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/016.yaml
  text: 'And the city lies foursquare[a], and its length is as great as its width. And he measured the city with the measuring rod: twelve thousand stadia[c][b]. Its length and width and height are equal.'
translation:
  language: zh_hans
  text: 城是四方的，长和宽一样。他用量杆[a]量那城，量得一万二千斯他迪昂[b]。城的长、宽、高都相等[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“芦苇杆”。希腊词可以指芦苇；这里指用来测量的杆。
    reason: lexical_alternative
  - marker: b
    text: “斯他迪昂”是古代长度单位。一万二千斯他迪昂约为二千二百二十公里；具体数值因所采用的单位长度而略有不同。
    reason: cultural_note
  - marker: c
    text: 也可较具解释性地理解为“那城是一个正方体”。希腊文直接说城的长、宽、高都相等。
    reason: alternative_reading
lexical_decisions:
- source_word: τετράγωνος
  choice: 呈四方形
  rationale: 该词指四边或正方的形状。“呈四方形”自然地描述城市的平面形制，又不把后文三维相等的含义提前解释为立方体。
- source_word: κεῖται
  choice: 呈
  rationale: κεῖμαι在这里描述城市所处或展开的形态。汉语用“呈四方形”比直译为“躺着”自然，也保留静态布局的意思。
- source_word: τὸ μῆκος αὐτῆς ὅσον τὸ πλάτος
  choice: 长和宽一样
  rationale: ὅσον表示尺度相同；此译简明、现代，并准确表达长度等于宽度。
- source_word: ἐμέτρησεν
  choice: 他……量了
  rationale: 保留希腊文第三人称单数主语，不在本节中额外补出“天使”，其所指由上文确定。
- source_word: τῷ καλάμῳ
  choice: 用量杆
  rationale: κάλαμος本义可指芦苇，此处是测量工具。“量杆”明确其用途，同时在脚注中保留字面可能性。
- source_word: ἐπὶ σταδίους δώδεκα χιλιάδων
  choice: 共一万二千斯他迪昂
  rationale: 该短语给出测量所得的尺度。“共”自然承接汉语中的测量结果；数字和古代单位均予保留。
- source_word: στάδιος
  choice: 斯他迪昂
  rationale: 采用对古希腊长度单位的音译，避免在正文中用不确定的现代换算值代替原文。
- source_word: τὸ μῆκος καὶ τὸ πλάτος καὶ τὸ ὕψος αὐτῆς ἴσα ἐστίν
  choice: 城的长、宽、高都相等
  rationale: 直接表达原文所说三个维度相等，不把其几何含义改写为“正方体”。
theological_decisions:
- issue: 正文应保留古代单位还是换算成现代单位
  choice: 正文保留“一万二千斯他迪昂”
  alternative: 约二千二百二十公里
  rationale: 原文使用古代单位，而具体换算取决于采用何种斯他迪昂长度；现代近似值放在脚注更能兼顾原文优先和读者理解。
- issue: 是否把三个维度相等直接解释为立方体
  choice: 按原文译作“长、宽、高都相等”
  alternative: 那城是一个正方体
  rationale: 正方体是这句话自然产生的几何理解，但希腊文直接陈述的是三个维度相等。正文保留原有表述，避免把推论取代原文。
translation_notes:
  register: 采用现代、庄重而清楚的书面汉语。“呈四方形”“量杆”“都相等”均便于普通读者理解；古代单位采用音译，并以脚注提供现代近似值。正文保留原文由二维描述推进到三维相等的表达次序。
