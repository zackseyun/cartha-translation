  text: ἔχουσα τεῖχος μέγα καὶ ὑψηλόν, ἔχουσα πυλῶνας δώδεκα, καὶ ἐπὶ ⸂τοῖς πυλῶσιν⸃ ἀγγέλους δώδεκα, καὶ ὀνόματα ἐπιγεγραμμένα ἅ ⸀ἐστιν τῶν δώδεκα ⸀φυλῶν υἱῶν Ἰσραήλ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/012.yaml
  text: having a great and high wall, having twelve gates, and at the gates twelve angels, and names inscribed, which are those of the twelve tribes of the sons of Israel.
translation:
  language: zh_hans
  text: 城有一道巨大而高耸的城墙，有十二座城门；城门旁有十二位天使，城门上刻着名字，就是以色列子孙十二支派的名字。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以色列子孙”直译为“以色列的儿子们”；也可按传统译作“以色列的儿女”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχουσα
  choice: 有
  rationale: 该阴性单数现在分词承接上一节的城，汉语用“有”自然保留连续描写的语气，无须另加主语。
- source_word: τεῖχος μέγα καὶ ὑψηλόν
  choice: 高大巍峨的城墙
  rationale: “高大”表达 μέγα 的宏伟、巨大，“巍峨”突出 ὑψηλόν 的高耸；合起来既保留两个形容特征，也符合现代汉语对宏伟城墙的庄重描写。
- source_word: πυλῶνας δώδεκα
  choice: 十二座城门
  rationale: πυλών 指城的门或入口；量词“座”适合宏大的建筑意象。
- source_word: ἐπὶ τοῖς πυλῶσιν
  choice: 门旁
  rationale: ἐπί 加与格在这里表示位置关系；“门旁”自然表达天使位于各门所在之处，并避免误解为站在门顶上。
- source_word: ἀγγέλους δώδεκα
  choice: 十二位天使
  rationale: 直译其数量与身份，以“位”作为有位格者的现代汉语量词。
- source_word: ὀνόματα ἐπιγεγραμμένα
  choice: 门上刻着名字
  rationale: ἐπιγράφω 含写在其上、铭刻之意；结合城门建筑语境译为“刻着”较具体。“门上”由复合动词所含的附着关系及上下文自然补明。
- source_word: ἅ ἐστιν τῶν δώδεκα φυλῶν
  choice: 就是……十二支派的名字
  rationale: 关系从句指明所刻名字的归属；汉语复现“名字”，比仅说“就是……十二支派的”更清楚自然。
- source_word: υἱῶν Ἰσραήλ
  choice: 以色列众子
  rationale: 保留 υἱῶν 的“儿子、众子”意涵，并按圣经固定的群体称谓理解；脚注提供更通行的现代汉语表达。
theological_decisions:
- issue: υἱῶν Ἰσραήλ 作为群体称谓的译法
  choice: 以色列众子
  alternative: 以色列人
  rationale: 正文保留希腊文明确的男性亲属用语及其盟约群体称谓色彩，不将其直接中性化；同时以脚注说明现代汉语惯常说法，避免读者误以为只指雅各的十二个亲生儿子。
- issue: 十二支派名字与城门的关系
  choice: 门上刻着……十二支派的名字
  alternative: 刻着十二支派各祖先的个人名字
  rationale: 原文只说名字属于十二支派，并未明确这些名字究竟采用支派名称还是支派祖先的个人姓名，因此不作进一步限定。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。分号区分城门与守门天使、铭文两层描写；保留“十二”的反复以呈现启示文学的节奏。脚注标记置于相关群体称谓所在整句句末。
