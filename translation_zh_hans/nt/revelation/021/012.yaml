  to: 城有一道巨大而高耸的城墙，有十二座城门；城门旁有十二位天使，城门上刻着名字，就是以色列子孙十二支派的名字。[a]
  rationale: 修订以自然、庄重的现代汉语重述承接上一节的城市描写；以“巨大而高耸”更透明地对应两个形容词；以“以色列子孙”替换不自然的“以色列众子”，并更新脚注，使其说明原文亲属称谓及传统译法，而不将其泛化为“以色列人”。“城门上刻着名字”保留铭刻于城门的建筑语境，同时不限定这些名字究竟是支派名称或祖先的个人名字。
