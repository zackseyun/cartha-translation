  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἐξαλείψει πᾶν δάκρυον ⸀ἐκ τῶν ὀφθαλμῶν αὐτῶν, καὶ ὁ θάνατος οὐκ ἔσται ἔτι· οὔτε πένθος οὔτε κραυγὴ οὔτε πόνος οὐκ ἔσται ⸀ἔτι. τὰ πρῶτα ἀπῆλθαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/004.yaml
  text: And he will wipe away every tear from their eyes[a], and death will be no more; neither mourning nor crying nor pain will be any more[c][b]. The former things have passed away.
translation:
  language: zh_hans
  text: 他要擦去他们眼中的每一滴泪[a]；不再有死亡，也不再有悲哀、哭喊[b]和疼痛。从前的事都过去了[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“所有的泪”。希腊文用单数表达逐一涵盖的意思，即“每一滴泪”。
    reason: lexical_alternative
  - marker: b
    text: “哭喊”也可译作“喊叫”或“哀号”；希腊文可指一声呼喊或大声喊叫。
    reason: lexical_alternative
  - marker: c
    text: “从前的事”或译“起初的事”或“先前的事”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξαλείψει
  choice: 要擦去
  rationale: 该词为将来时主动直陈语气；与“泪”搭配时，译作“擦去”自然、亲切，也保留亲自除去眼泪的意象。
- source_word: πᾶν δάκρυον
  choice: 每一滴泪
  rationale: πᾶν与单数名词连用具有逐一分配的意味；“每一滴泪”在现代汉语中自然地突出每一滴眼泪都被除去。
- source_word: ἐκ τῶν ὀφθαλμῶν αὐτῶν
  choice: 他们眼中的
  rationale: ἐκ表示从眼睛中除去；“擦去他们眼中的每一滴泪”符合汉语搭配，并准确表达来源。
- source_word: ὁ θάνατος οὐκ ἔσται ἔτι
  choice: 不再有死亡
  rationale: 表达死亡彻底终止；“不再有死亡”简洁庄重，也符合现代汉语。
- source_word: πένθος
  choice: 悲哀
  rationale: 该词指哀恸、举哀或深切悲伤；“悲哀”能涵盖相关意义，并与后面的哭喊、疼痛自然并列。
- source_word: κραυγή
  choice: 哭喊
  rationale: 该词可指叫喊或大声呼喊；在死亡、哀恸和疼痛的语境中，“哭喊”兼顾悲痛与发声的强度。
- source_word: πόνος
  choice: 疼痛
  rationale: 该词可指痛苦、劳苦或患难；本处与死亡、悲哀和哭喊并列，“疼痛”最直接自然，同时不排除广义苦痛。
- source_word: τὰ πρῶτα
  choice: 从前的事
  rationale: 中性复数名词化，指先前存在的事物或旧有秩序；“从前的事”自然且不过度解释。
- source_word: ἀπῆλθαν
  choice: 都过去了
  rationale: 不定过去时表明离去已经成就；“都过去了”符合异象宣告的完成性，其中“都”也自然照应复数主语。
theological_decisions:
- issue: “要擦去”的主语在本节中未明说，而由上文启示录21:3提供。
  choice: 译作“他要擦去”，不在正文补入“神”。
  alternative: “神要擦去”
  rationale: 希腊文动词仅以第三人称单数词形表达主语；保留代词既忠于本节句法，也让读者从紧接的上文确定所指。
- issue: 新创造中死亡及各种苦痛是否彻底终止。
  choice: 采用绝对表达：“不再有死亡，也不再有……”
  alternative: “死亡将不复存在；也不会再有……”
  rationale: 原文两次使用οὐκ ἔσται ἔτι，宣告的是完全止息，而非仅仅减少；译文不添加限制条件。
- issue: 末句与前述“不再有”的逻辑关系。
  choice: 用“因为”连接：“因为从前的事都过去了”。
  alternative: 保留为独立句：“从前的事都过去了。”
  rationale: 希腊文未使用显式因果连词，但末句在语义上说明前述现实不复存在的根据。汉语加“因为”使衔接自然，不过也略微明示了原文隐含的关系，故记录此决定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“不再有……”的重复保持原文肃穆的节奏；“每一滴泪”增强具体、安慰性的意象。脚注标记均置于相关词语或分句之后。
