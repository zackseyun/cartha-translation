id: REV.21.23
reference: Revelation 21:23
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἡ πόλις οὐ χρείαν ἔχει τοῦ ἡλίου οὐδὲ τῆς σελήνης, ἵνα φαίνωσιν αὐτῇ, ἡ γὰρ δόξα τοῦ θεοῦ ἐφώτισεν αὐτήν, καὶ ὁ λύχνος αὐτῆς τὸ ἀρνίον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/023.yaml
  text: And the city has no need of the sun or of the moon to shine on it[a], for the glory of God gave it light, and its lamp is the Lamb.
translation:
  language: zh_hans
  text: 那城不需要太阳或月亮照耀它[a]，因为神的荣耀照亮了它，羔羊就是它的灯。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“给它光照”。希腊文直译为“为它／在它之上照耀”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πόλις
  choice: 城
  rationale: 上下文所指是新耶路撒冷；“城”直接、自然，也符合《启示录》的庄严语体。
- source_word: οὐ χρείαν ἔχει
  choice: 不需要
  rationale: 准确表达“没有……的需要”这一希腊语习语，同时比逐字译法更符合现代汉语。
- source_word: τοῦ ἡλίου οὐδὲ τῆς σελήνης
  choice: 太阳或月亮
  rationale: οὐδέ在否定结构中连接日月两者；现代汉语用“或”自然地表达二者皆非所需。
- source_word: ἵνα φαίνωσιν αὐτῇ
  choice: 照耀它
  rationale: 以日月为主语时，φαίνωσιν自然指发光、照耀；αὐτῇ在此可理解为光照临到那城。脚注保留“给它光照”等可能表达。
- source_word: δόξα
  choice: 荣耀
  rationale: “荣耀”保留δόξα在圣经和启示文学中的神学分量，且不把它缩减为单纯的物理光辉。
- source_word: ἐφώτισεν
  choice: 照亮了
  rationale: 清楚表达使那城得光照的具体含义，并与前面的“照耀”形成自然但不完全相同的措辞。
- source_word: λύχνος
  choice: 灯
  rationale: λύχνος指灯，不是泛指“光”，也不是“灯台”；译作“灯”保留原文意象。
- source_word: ἀρνίον
  choice: 羔羊
  rationale: 这是《启示录》中对耶稣的称号；“羔羊”是准确且通行的译法。
theological_decisions:
- issue: “羔羊就是它的灯”中的隐喻关系
  choice: 直接保留“灯”的隐喻
  alternative: 译作“羔羊就是它的光”或“羔羊照亮它”
  rationale: 原文明确使用λύχνος（灯），不是泛指光的φῶς。保留“灯”也维持神的荣耀照亮城与羔羊作为城之灯两幅相关而不完全相同的意象。
- issue: 神圣光照的末世意象
  choice: 只陈述城不需要日月、神的荣耀照亮它、羔羊是它的灯
  alternative: 增译为神取代一切受造之光，或解释末世光照的具体机制
  rationale: 原文没有进一步说明其机制或系统神学含义，因此不加入推测性的末世论解释。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“那城”承接上下文；“照耀它”保留日月发光的具体图像，“照亮了”则对应神荣耀使城明亮的动作。
