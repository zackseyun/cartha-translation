  text: ὁ νικῶν κληρονομήσει ταῦτα, καὶ ἔσομαι αὐτῷ θεὸς καὶ αὐτὸς ἔσται μοι υἱός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/007.yaml
  text: The one who overcomes will inherit these things[a], and I will be his God[b], and he will be my son.
translation:
  language: zh_hans
  text: 得胜的人必承受这一切[a]。我要作他的上帝，他要作我的儿子[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“必承受这些。”这里所说的是得胜的人承受前文所述的一切。希腊文中“得胜”是《启示录》反复使用的词，也可译为“战胜”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文直译：“他要作我的儿子。”原文使用阳性单数，保留了儿子承受产业的意象；这里很可能具有代表作用，所指不限于男性。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ νικῶν
  choice: 得胜的人
  rationale: 带冠词的现在时分词作名词用，指以持续得胜为特征的人。“得胜的人”自然、简洁，也保留了《启示录》中反复出现的 νικάω 用语；“战胜的人”亦可，但较侧重某次具体胜利。
- source_word: κληρονομήσει
  choice: 必承受
  rationale: κληρονομέω 表示继承或作为产业领受。“承受”保留了产业、盟约与亲子关系的意味；“必”表达直陈将来时所陈明的确定应许。
- source_word: ταῦτα
  choice: 这一切
  rationale: ταῦτα 形式上是复数“这些事物”，在此回指前述新创造与应许的整体内容。现代汉语用“这一切”比“这些”更完整自然，同时不限定其具体所指。
- source_word: ἔσομαι αὐτῷ θεὸς
  choice: 我要作他的上帝
  rationale: 这是盟约关系公式。“作他的上帝”以自然汉语表达与格 αὐτῷ 的关系含义，并保留原文庄重语气。
- source_word: αὐτὸς ἔσται μοι υἱός
  choice: 他要作我的儿子
  rationale: 此表达与前句形成对称，并保留儿子身份及承受产业的意象。原文 υἱός 无冠词，在这一表语结构中不要求译成不定意义。
- source_word: υἱός
  choice: 儿子
  rationale: 原文明确使用阳性单数“儿子”。译文保留亲子和产业继承意象，不以“孩子”淡化；其代表性范围在脚注中说明。
theological_decisions:
- issue: 以阳性单数表达对所有得胜者的应许
  choice: 正文保留“儿子”
  alternative: 孩子／儿女
  rationale: 希腊文明确为 υἱός（儿子），且与“承受”共同构成重要的亲子及产业意象。这里的阳性单数很可能具有代表作用，但不应在正文中将其性别和关系意象中和。
- issue: 盟约公式与亲子关系的呼应
  choice: “我要作他的上帝，他要作我的儿子”
  alternative: “我要成为他的上帝，他也要成为我的一个儿子”
  rationale: “作……的上帝／儿子”符合现代中文圣经语体，也准确传达双向关系；不加“一个”，避免误导为原文强调不定身份。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“得胜的人”“承受”“作他的上帝／作我的儿子”保留《启示录》的关键词、产业意象和盟约关系。正文分为两句，以符合现代中文节奏，同时不改变希腊文 καί 所连接的逻辑。
