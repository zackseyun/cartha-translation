  terminology: 将σάρδιον译为“红玉髓”可较准确对应carnelian这一常见现代候选，脚注保留古代指称不确定性。χρυσόπρασος应译为“绿玉髓”（chrysoprase），不可译为“金绿玉”。ὑάκινθος采用传统且中性的“风信子石”，并以脚注说明是宝石而非花卉、精确鉴定未定，避免把它限定为现代“蓝宝石”。
