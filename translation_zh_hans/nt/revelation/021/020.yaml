base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/020.yaml
  text: the fifth[a], sardonyx; the sixth, sardius; the seventh, chrysolite; the eighth, beryl; the ninth, topaz; the tenth[b], chrysoprase; the eleventh, jacinth; the twelfth, amethyst.
translation:
  language: zh_hans
  text: 第五层是缠丝玛瑙，第六层是红玉髓[a]，第七层是贵橄榄石，第八层是绿柱石，第九层是黄玉，第十层是绿玉髓，第十一层是风信子石[b]，第十二层是紫水晶。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “红玉髓”也可译作“红玛瑙”；古代这一宝石的精确种类难以确定。
    reason: lexical_alternative
  - marker: b
    text: 希腊语所指的是一种宝石，不是风信子花；其精确种类难以确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: σαρδόνυξ
  choice: 缠丝玛瑙
  rationale: 这是现代汉语中对 sardonyx 的常用矿物名称，也能与下一项 σάρδιον 区分。
- source_word: σάρδιον
  choice: 红玉
  rationale: 采用较宽泛且有传统色彩的宝石名称；此古代宝石的精确矿物所指不确定，脚注列出“红玛瑙”这一可能译法。
- source_word: χρυσόλιθος
  choice: 贵橄榄石
  rationale: χρυσόλιθος 字面与“金色石头”有关，但古代矿物名称和现代分类未必对应；采用现代常见的 chrysolite 对应名称，同时承认鉴定的不确定性。
- source_word: βήρυλλος
  choice: 绿柱石
  rationale: 这是 βήρυλλος 的标准现代矿物对应名称。
- source_word: τοπάζιον
  choice: 黄玉
  rationale: 采用现代汉语中 topaz 的标准宝石名称。
- source_word: χρυσόπρασος
  choice: 金绿玉
  rationale: 采用 chrysoprase 的常见中文宝石名称，比按词源直译更自然清楚。
- source_word: ὑάκινθος
  choice: 紫蓝宝石
  rationale: 语境明确指宝石而非花卉；该古代宝石可能呈蓝紫色，但精确矿物鉴定不确定，故用描述性名称并加脚注。
- source_word: ἀμέθυστος
  choice: 紫水晶
  rationale: 这是 amethyst 的标准现代汉语名称。
