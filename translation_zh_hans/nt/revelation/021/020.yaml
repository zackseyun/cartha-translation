  verdict: revise
  source_fidelity: 原文为承接上文“根基”的八项序数与宝石名称。草稿的序数、列举结构及大部分宝石名称均与希腊文相符；但“金绿玉”通常指chrysoberyl（金绿宝石），并非χρυσόπρασος（chrysoprase），会造成具体矿物名称混淆。σάρδιον和ὑάκινθος的古代矿物对应均不确定，宜避免分别以易使人联想到刚玉类的“红玉”和“紫蓝宝石”作确定性现代矿物译名。
