  text: καὶ εἶπέν μοι· ⸂Γέγοναν. ἐγὼ⸃ τὸ Ἄλφα καὶ τὸ Ὦ, ἡ ἀρχὴ καὶ τὸ τέλος. ἐγὼ τῷ διψῶντι δώσω ἐκ τῆς πηγῆς τοῦ ὕδατος τῆς ζωῆς δωρεάν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/006.yaml
  text: And he said to me[a], “It is done. I am the Alpha and the Omega, the beginning and the end[b]. To the one who is thirsty I will give from the spring of the water of life freely.”
translation:
  language: zh_hans
  text: 他对我说：“这些事都成了。[a]我是阿拉法和俄梅伽，是开始，也是终结。我要白白[a]把生命之水泉源中的水赐给口渴的人。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 传统也译作“成了”。原文动词是复数，可直译为“它们都成了”或“这些事都成了”。
    reason: alternative_reading
lexical_decisions:
- source_word: Γέγοναν
  choice: 这些事都成了
  rationale: 该词是γίνομαι的完成时主动直陈语气第三人称复数；以“这些事”补明隐含的复数主语，以“都成了”表达所宣告之事已经实现，同时避免用单数惯用语抹平原文复数。
- source_word: τὸ Ἄλφα καὶ τὸ Ὦ
  choice: 阿拉法……俄梅伽
  rationale: 保留希腊字母名称作为《启示录》中既定的象征性称号；下文“开始……终结”随即说明其意涵。
- source_word: ἡ ἀρχὴ καὶ τὸ τέλος
  choice: 开始……终结
  rationale: 直接保留这组首尾对应的表达，既可涵盖时间意义，也不排除源头与终极归宿的意味。
- source_word: τῷ διψῶντι
  choice: 口渴的人
  rationale: 现在分词作名词用，指以“渴”为特征的人；“口渴的人”自然明白，并保留个人性的应许对象。
- source_word: δώσω
  choice: 我要……赐给
  rationale: 忠实表达简单将来时的应许；“赐给”适合说话者与礼物的语境，但不额外增添神学解释。
- source_word: ἐκ τῆς πηγῆς
  choice: 泉水
  rationale: πηγή指泉、泉源；汉语“生命水的泉水”虽保留原文层叠属格意象，但仍可理解为从生命水之泉而来的水。
- source_word: τοῦ ὕδατος τῆς ζωῆς
  choice: 生命水
  rationale: 采用自然且已有圣经意象的汉语表达，保留水与生命之间的修饰关系，不改写为单一解释性的“赐生命的水”。
- source_word: δωρεάν
  choice: 白白
  rationale: 表达无须付代价、作为恩赐而给的副词意义；“白白赐给”是自然、庄重且清楚的现代汉语。
theological_decisions:
- issue: 神圣宣告Γέγοναν的复数形式
  choice: 这些事都成了
  alternative: 成了／都完成了
  rationale: 原文动词为复数，可能回指先前所宣告的新创造诸事。“这些事都成了”显明复数并保留其指涉范围；脚注保留较传统的单数式译法。
- issue: 保留阿拉法与俄梅伽的象征性称号
  choice: 阿拉法……俄梅伽
  alternative: 首字母和末字母／始与终
  rationale: 音译希腊字母名称可保存《启示录》内部的称号及互文联系，而紧接着的“开始……终结”已提供概念说明，无须用汉语字母体系替换。
- issue: ἀρχή与τέλος的语义张力
  choice: 开始……终结
  alternative: 源头……目标
  rationale: 采用直接对称的译法，既不把两词仅限于时间先后，也不把目的论意义强加为唯一解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“这些事都成了”刻意保存原文复数及完成时所表达的已经实现；“阿拉法、俄梅伽”沿用希腊字母音译；“白白赐给”清楚体现无偿恩赐。所有脚注标记均置于对应正文之后。
