  text: καὶ τὸ τεῖχος τῆς πόλεως ⸀ἔχων θεμελίους δώδεκα, καὶ ἐπ’ αὐτῶν δώδεκα ὀνόματα τῶν δώδεκα ἀποστόλων τοῦ ἀρνίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/014.yaml
  text: And the wall of the city had twelve foundations[a], and on them were the twelve names of the twelve apostles of the Lamb.
translation:
  language: zh_hans
  text: 城墙有十二座根基，根基上有羔羊的十二位使徒的十二个名字。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τεῖχος
  choice: 城墙
  rationale: 在城市建筑语境中指城的墙垣；“城墙”比泛称“墙”更准确自然。
- source_word: πόλεως
  choice: 城
  rationale: 与“墙”合译为“城墙”，自然表达原文“城的墙”。
- source_word: ἔχων
  choice: 有
  rationale: 原文虽为现在分词，汉语叙述中用谓语“有”简洁自然，并保留描述性意义。
- source_word: θεμελίους δώδεκα
  choice: 十二座根基
  rationale: θεμέλιος在建筑语境中可指根基，也可指奠基石；正文采用较直接的“根基”，量词“座”体现其作为建筑基础的具体性。
- source_word: ἐπ’ αὐτῶν
  choice: 根基上
  rationale: 明确代词所指，避免汉语“其上”可能造成的指代含混；ἐπί加属格在此表达位于其上。
- source_word: ὀνόματα
  choice: 名字
  rationale: 原文只说“名字”，没有明说刻写或铭文，故不增添“刻着”等信息。
- source_word: ἀποστόλων
  choice: 使徒
  rationale: 此处指新约中具有特定身份的使徒，“使徒”是准确且通行的译法。
- source_word: τοῦ ἀρνίου
  choice: 羔羊的
  rationale: “羔羊”在《启示录》中是指向基督的重要称号；保留该称号及属有关系。
theological_decisions:
- issue: 基督论称号 ἀρνίον
  choice: 羔羊
  alternative: 羊羔
  rationale: “羔羊”是现代中文圣经语境中自然、庄重且已被广泛理解的基督称号；不改写为“基督”，以保留原文意象。
- issue: “羔羊十二使徒”的属格关系
  choice: 羔羊十二使徒的十二个名字
  alternative: 十二个名字，就是羔羊的十二使徒之名
  rationale: 按原文保留“使徒属于羔羊”的关系，不额外解释这十二人与其他使徒群体的关系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“城墙”自然合并原文的属格结构；以重复“根基”代替代词，使指代清楚。正文保留原文简洁的建筑意象，不添加“刻着”等原文未明说的动作。
