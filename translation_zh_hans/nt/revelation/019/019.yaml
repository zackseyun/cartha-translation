source:
  edition: SBLGNT
  text: καὶ εἶδον τὸ θηρίον καὶ τοὺς βασιλεῖς τῆς γῆς καὶ τὰ στρατεύματα αὐτῶν συνηγμένα ποιῆσαι ⸀τὸν πόλεμον μετὰ τοῦ καθημένου ἐπὶ τοῦ ἵππου καὶ μετὰ τοῦ στρατεύματος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/019.yaml
  text: And I saw the beast and the kings of the earth and their armies gathered to make war against the one seated on the horse and against his army[a][b].
translation:
  language: zh_hans
  text: 我看见那兽、地上的众王和他们的军队都聚集起来[a]，要与坐在马上的那一位和他的军队交战[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“集结起来”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“同……进行战争”；在这里表示敌对，即“与……交战”。
    reason: lexical_alternative
lexical_decisions:
- source_word: θηρίον
  choice: 那兽
  rationale: 在《启示录》的异象语境中，该词是具有特定象征意义的称呼；“那兽”简洁、庄重，也保留其威胁性，不弱化为普通“动物”。
- source_word: βασιλεῖς τῆς γῆς
  choice: 地上的众王
  rationale: γῆ既可指“地”也可指“全地”；此处为末世性的广阔场景，“地上的众王”既自然，又不把范围收窄为某一片土地。
- source_word: στρατεύματα αὐτῶν
  choice: 他们的军队
  rationale: 复数στρατεύματα指众王所属的军事力量；现代汉语用“军队”作集合表达，语意自然，并保留军事场景。
- source_word: συνηγμένα
  choice: 聚集起来
  rationale: 完成时被动分词描写已经聚到一处、处于集结状态；“聚集起来”通顺，并不过度指定是谁使他们聚集。
- source_word: ποιῆσαι τὸν πόλεμον
  choice: 交战
  rationale: 这是表示发动或进行战争的惯用语；“交战”在现代汉语中简洁有力，也适合本节的军事语境。
- source_word: μετὰ τοῦ καθημένου ἐπὶ τοῦ ἵππου
  choice: 与骑在马上的那一位
  rationale: μετά字面为“与、同”，但在“交战”的语境中明确表示敌对对象；汉语“与……交战”同时保留句式并自然传达“对抗”。
- source_word: τοῦ καθημένου
  choice: 那一位
  rationale: 结合“骑在马上的”保留原文描述性指称，不直接添入“基督”“弥赛亚”或“骑士”等原文未在本节使用的称号。
- source_word: ἐπὶ τοῦ ἵππου
  choice: 骑在马上的
  rationale: 原文较直译为“坐在马上的”；现代汉语通常说“骑在马上的”，能自然表达其姿态而不改变所指。
- source_word: μετὰ τοῦ στρατεύματος αὐτοῦ
  choice: 和他的军队
  rationale: 此短语与前一敌对对象并列，受“与……交战”统摄；单数στρατεύματος按集合意义译作“军队”。
theological_decisions:
- issue: “骑在马上的那一位”的身份
  choice: 保留描述性表达，不在正文中直接改称“基督”或“弥赛亚”
  alternative: 译作“基督”或“弥赛亚”
  rationale: 上下文足以帮助读者辨认其身份，但本节希腊文只使用描述性的分词结构。照原文保留该表达，可避免把上下文解释直接替换成本节正文。
- issue: μετά在战争语境中的关系
  choice: 译为“与……交战”，表达敌对关系
  alternative: 机械地译为“同……作战”而不说明可能的歧义，或明确扩译为“攻击……”
  rationale: μετά加属格通常有“与……一起”的形式，但ποιεῖν πόλεμον的语境使其对象关系成为敌对。“与……交战”既符合现代汉语，也不需额外补入原文没有的动词宾语色彩。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“我又看见”承接《启示录》异象叙述；“那兽”“众王”“军队”“交战”保持末世战争场景的力度。正文避免加入本节未明说的基督论称号，并用脚注交代聚集用语及μετά在战争语境中的表达。
