    issue: 前半句的长定语链使“剑”的所属及“从口中出来”的修饰关系不够清楚。
    rationale: 希腊文先说“骑在马上的那一位的剑”，再以分词限定该剑。拆分为两个汉语分句可保留该结构关系及意象。
  - severity: low
    issue: 脚注a目前附在句末，未锚定其所说明的“杀死”。
    rationale: 词汇替代脚注应紧随相应译词，以保证脚注锚点明确。
  - severity: low
    issue: “吃他们的肉，吃饱了”重复且略偏口语。
    rationale: “以他们的肉吃饱了”既通顺，也更直接呈现ἐκ τῶν σαρκῶν αὐτῶν的来源关系。
