id: REV.19.21
reference: Revelation 19:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ οἱ λοιποὶ ἀπεκτάνθησαν ἐν τῇ ῥομφαίᾳ τοῦ καθημένου ἐπὶ τοῦ ἵππου τῇ ἐξελθούσῃ ἐκ τοῦ στόματος αὐτοῦ, καὶ πάντα τὰ ὄρνεα ἐχορτάσθησαν ἐκ τῶν σαρκῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/021.yaml
  text: And the rest were killed by the sword of the one seated on the horse[a], the sword that came out from his mouth[b], and all the birds were filled from their flesh.
translation:
  language: zh_hans
  text: 其余的人都被那骑在马上的一位的剑杀死了[a]；这剑是从他口中出来的[b]。所有的飞鸟都以他们的肉吃饱了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “杀死”也可译作“被杀”。
    reason: lexical_alternative
  - marker: b
    text: “从他口中出来的剑”是启示文学的图像；参见启示录19:15。
    reason: cross_reference
lexical_decisions:
- source_word: οἱ λοιποὶ
  choice: 其余的人
  rationale: 承接上文，指兽和假先知受处置后剩下的敌对者；简洁自然。
- source_word: ἀπεκτάνθησαν
  choice: 被……杀死了
  rationale: 保留不定过去时被动语态的结果性表达；现代汉语清楚自然。
- source_word: ἐν τῇ ῥομφαίᾳ
  choice: 被……剑杀死
  rationale: ἐν加与格在此表示工具；汉语用“被……剑杀死”自然传达其工具作用，并保留具体的剑之意象。
- source_word: τοῦ καθημένου ἐπὶ τοῦ ἵππου
  choice: 骑在马上的那一位
  rationale: 准确表达带冠词的分词结构；“骑在马上”比“坐在马上”更符合现代汉语，同时没有简化为普通的“骑士”。
- source_word: τῇ ἐξελθούσῃ ἐκ τοῦ στόματος αὐτοῦ
  choice: 口中出来的
  rationale: 作为定语直接修饰“剑”，保留剑从他口中出来的启示文学图像。
- source_word: πάντα τὰ ὄρνεα
  choice: 所有的飞鸟
  rationale: ὄρνεα泛指鸟类；上下文虽表明是食腐之鸟，原文却未明说“猛禽”，故不增添限定。
- source_word: ἐχορτάσθησαν
  choice: 吃饱了
  rationale: χορτάζω表示被喂饱、得到饱足；“吃饱了”在涉及飞鸟取食的语境中比直译“被充满”更自然。
- source_word: ἐκ τῶν σαρκῶν αὐτῶν
  choice: 吃他们的肉
  rationale: ἐκ表示饱足所取自的来源；汉语以“吃他们的肉，吃饱了”自然呈现来源关系，σάρξ在此按字面译为“肉”。
theological_decisions:
- issue: 骑马者口中之剑的性质
  choice: 在正文中保留“口中出来的剑”这一具体图像，不解释其象征意义
  alternative: 直接释为他的话语或审判
  rationale: 原文采用启示文学意象，翻译应保留其象征张力，不在正文中把它等同于某一种解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“那一位”保留原文对骑马者的特指；后半句为符合汉语习惯，将原文较直译的“从他们的肉得了饱足”表达为“吃他们的肉，吃饱了”，但不加强为“饱餐”或“吞食殆尽”。
