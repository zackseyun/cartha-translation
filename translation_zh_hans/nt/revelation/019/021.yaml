revisions:
- from: 其余的人都被骑在马上的那一位口中出来的剑杀死了[a][b]；所有的飞鸟都吃他们的肉，吃饱了。
  to: 其余的人都被那骑在马上的一位的剑杀死了[a]；这剑是从他口中出来的[b]。所有的飞鸟都以他们的肉吃饱了。
  rationale: 修订将“骑在马上的一位”与“剑”的所属关系明确表达，并以独立分句保留“从他口中出来的剑”这一不应解释化的启示文学图像。后半句改为“以他们的肉吃饱了”，在不增添程度或鸟类类别的前提下，更自然地表达飞鸟从尸体的肉得饱足。脚注锚点也已分别置于所注释的词语和意象之后。
