id: REV.19.17
reference: Revelation 19:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ εἶδον ⸀ἕνα ἄγγελον ἑστῶτα ἐν τῷ ἡλίῳ, καὶ ⸀ἔκραξεν φωνῇ μεγάλῃ λέγων πᾶσι τοῖς ὀρνέοις τοῖς πετομένοις ἐν μεσουρανήματι· Δεῦτε συνάχθητε εἰς τὸ δεῖπνον τὸ μέγα τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/017.yaml
  text: And I saw one angel standing in the sun[a], and he cried out with a loud voice, saying to all the birds flying in midheaven, “Come, gather for the great supper of God,”
translation:
  language: zh_hans
  text: 我又看见一位天使站在太阳中。他大声呼喊，对所有飞在天空正中[a]的鸟说：“来吧，聚集起来，赴上帝的盛大筵席！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“飞在中天”或“飞在半空”。希腊词μεσουράνημα是《启示录》中一个独特的启示文学用语。
    reason: 词义有可成立的不同表达；正文选择较易懂的“天空正中”，脚注保留“中天”等译法及其文体特色。
lexical_decisions:
- source_word: ἕνα ἄγγελον
  choice: 一位天使
  rationale: 保留希腊文明确出现的数词“一”，同时采用现代汉语对天使自然、庄重的量词“位”。
- source_word: ἑστῶτα ἐν τῷ ἡλίῳ
  choice: 站在太阳中
  rationale: 按ἐν的基本空间意义保留启示文学中鲜明而奇特的图景，不解释性地改成“站在太阳前”或“站在太阳上”。
- source_word: ἔκραξεν φωνῇ μεγάλῃ
  choice: 大声呼喊
  rationale: 以自然现代汉语表达κράζω的强烈呼喊及φωνῇ μεγάλῃ所表示的洪亮声音。
- source_word: πᾶσι τοῖς ὀρνέοις
  choice: 所有……的鸟
  rationale: ὄρνεον泛指鸟；食腐或猛禽的含义来自下文语境，不在本词本身，因此不增译为“猛禽”。
- source_word: τοῖς πετομένοις ἐν μεσουρανήματι
  choice: 飞在天空正中
  rationale: μεσουράνημα指天空的中央或最高处，是《启示录》中有特色的启示文学用语；“天空正中”兼顾可懂性与空间意象。
- source_word: Δεῦτε
  choice: 来吧
  rationale: 直接表达召唤语气；“吧”使现代汉语命令兼邀请的语感自然。
- source_word: συνάχθητε
  choice: 聚集起来
  rationale: 保留聚拢、集合的动作；汉语无需生硬复制希腊文被动形式。
- source_word: εἰς τὸ δεῖπνον τὸ μέγα τοῦ θεοῦ
  choice: 赴上帝的盛大筵席
  rationale: “赴……筵席”自然表达εἰς所指的趋向和目的；“筵席”保留δεῖπνον作为正式宴席的语义，也与上下文的筵席意象相呼应。
theological_decisions:
- issue: 启示文学空间意象的译法
  choice: 站在太阳中
  alternative: 站在太阳前
  rationale: 原文呈现刻意鲜明、超常的异象画面；译文不把它弱化为较安全却带解释性的空间关系。
- issue: “上帝的盛大筵席”中属格的理解
  choice: 保留“上帝的”这一开放结构
  alternative: 上帝所摆设的盛大筵席
  rationale: τοῦ θεοῦ可表所属、来源或主办者；直译式的“上帝的”不在本节中提前限定其关系。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。保留异象的强烈画面和“鸟”的一般词义，不依下文预先增添“猛禽”或“食腐鸟”等解释。
