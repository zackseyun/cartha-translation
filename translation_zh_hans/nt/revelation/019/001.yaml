id: REV.19.1
reference: Revelation 19:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα ἤκουσα ὡς φωνὴν μεγάλην ὄχλου πολλοῦ ἐν τῷ οὐρανῷ λεγόντων· Ἁλληλουϊά· ἡ σωτηρία καὶ ἡ ⸂δόξα καὶ ἡ δύναμις⸃ τοῦ θεοῦ ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/001.yaml
  text: After these things I heard what seemed to be the loud voice of a great multitude in heaven[a], saying, “Hallelujah! Salvation and glory and power belong to our God,”
translation:
  language: zh_hans
  text: 这些事以后，我听见仿佛是天上许多人的洪亮声音，说：“哈利路亚[a]！救恩、荣耀、能力都属于我们的上帝。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “哈利路亚”意为“赞美雅”或“赞美耶和华”。
    reason: 说明此希伯来语礼仪呼声的字义，并保留“雅”（Yah）与“耶和华”（LORD）两种中文释义。
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: 这些事以后
  rationale: 保留复数指示语，体现《启示录》异象叙述的先后推进，同时符合现代汉语表达。
- source_word: ἤκουσα
  choice: 我听见
  rationale: 以一般过去叙事意义表达简单过去时，直接自然。
- source_word: ὡς
  choice: 仿佛
  rationale: 保留末世异象描写中的类比和感知近似，不把所听到的声音径直等同于后面的对象。
- source_word: φωνὴν μεγάλην ὄχλου πολλοῦ
  choice: 一大群人发出洪亮的声音
  rationale: 将 μεγάλην 按声音的强度译为“洪亮”，将 ὄχλου πολλοῦ 译为“一大群人”；补出“发出”使所属关系在现代汉语中清楚自然。
- source_word: ἐν τῷ οὐρανῷ
  choice: 天上
  rationale: 此处指属天领域，并非普通天空；“天上”简洁且符合中文圣经叙事语体。
- source_word: λεγόντων
  choice: 说
  rationale: 引出群体呼喊的内容；中文不必另行保留分词形式。
- source_word: Ἁλληλουϊά
  choice: 哈利路亚
  rationale: 采用已通行的礼仪性音译，保留这句源于希伯来语、嵌入希腊文的赞美呼声；本义以脚注说明。
- source_word: ἡ σωτηρία καὶ ἡ δόξα καὶ ἡ δύναμις
  choice: 救恩、荣耀、能力
  rationale: 采用敬拜语境中清楚而通行的对应词，并以中文并列结构呈现三项颂赞。
- source_word: τοῦ θεοῦ ἡμῶν
  choice: 都属于我们的上帝
  rationale: 把希腊文所有格的归属含义明确表达出来；“都”统摄前述三个名词，使中文关系清晰。
theological_decisions:
- issue: 如何翻译天上的欢呼 Ἁλληλουϊά
  choice: 哈利路亚
  alternative: 要赞美耶和华／要赞美雅
  rationale: 音译保留其跨越希伯来文与希腊文的礼仪和互文特征，不在正文中强行确定神名的中文形式；脚注交代字义。
- issue: 救恩、荣耀和能力与上帝的关系
  choice: 都属于我们的上帝
  alternative: 是我们上帝的
  rationale: 两者都可表达所有格；所选译法在现代汉语颂赞句中更清楚，同时不额外限定这些属性是来源、作为还是应得的称颂。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。正文保持异象叙事的听觉近似语气，以“仿佛”保存 ὡς 的含混性；“哈利路亚”保留通行礼仪音译，并用脚注释义。
