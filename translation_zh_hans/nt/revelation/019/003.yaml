base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/003.yaml
  text: And a second time they said[a], “Hallelujah!” And her smoke goes up forever and ever.
translation:
  language: zh_hans
  text: 他们第二次说：“哈利路亚！”她的烟永永远远地上升。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊语直译为“直到诸世代的诸世代”，是表示时间无穷无尽的惯用语。
    reason: lexical_alternative
lexical_decisions:
- source_word: δεύτερον
  choice: 第二次
  rationale: 作副词使用的宾格，明确表示这是第二次发出同一宣告；比单译“又”更完整地保留次序含义。
- source_word: εἴρηκαν
  choice: 说
  rationale: λέγω 的完成时形式；在这一叙事语境中用现代汉语“说”自然流畅，也不额外加入“呼喊”等原文未明说的强度。
- source_word: Ἁλληλουϊά
  choice: 哈利路亚
  rationale: 保留原文中已经音译为希腊语的礼仪性欢呼语；“哈利路亚”在现代汉语基督教语境中广为人知，并保留其敬拜公式的特征。
- source_word: ὁ καπνὸς αὐτῆς
  choice: 她的烟
  rationale: αὐτῆς 为阴性，承接上下文中被拟人化为女子的巴比伦；用“她”保留原文的阴性拟人，而不改成中性的“它”。
- source_word: ἀναβαίνει
  choice: 上升
  rationale: 现在时呈现持续而鲜明的景象；“上升”简洁自然，忠实保留烟向上升起的画面。
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: 直到永永远远
  rationale: 这是表示无穷时长的希腊语惯用语；“直到永永远远”既符合现代汉语表达，也保留启示文学和颂赞语境中的庄重力度。
theological_decisions:
- issue: εἰς τοὺς αἰῶνας τῶν αἰώνων 所表达的持续时间
  choice: 直到永永远远
  alternative: 直到世世代代
  rationale: 在终局审判的语境中，这一希腊语惯用语最自然地表达无穷无尽的持续时间。正文不弱化其力度，同时以脚注交代较贴近字面的说法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“第二次”保留明确次序；“她”延续巴比伦的女性拟人；脚注标记置于其实际解释的短语之后。
