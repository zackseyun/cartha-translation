  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ φωνὴ ἀπὸ τοῦ θρόνου ἐξῆλθεν λέγουσα· Αἰνεῖτε ⸂τῷ θεῷ⸃ ἡμῶν, πάντες οἱ δοῦλοι αὐτοῦ, ⸀καὶ οἱ φοβούμενοι αὐτόν, οἱ μικροὶ καὶ οἱ μεγάλοι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/005.yaml
  text: And a voice came from the throne[a], saying, “Praise our God, all his slaves, and those who fear him[b], the small and the great.”
translation:
  language: zh_hans
  text: 有一个声音从宝座发出，说：“你们所有他的奴仆[a]和敬畏他的人，无论尊卑[b]，都要赞美我们的上帝！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “奴仆”所译的希腊语词也可译作“仆人”或“奴隶”；这个词强调他们属于上帝并服事他。
    reason: lexical_alternative
  - marker: b
    text: “无论尊卑”，直译“无论小的、大的”，指各等身份和地位的人。
    reason: literal_rendering
lexical_decisions:
- source_word: φωνὴ ἀπὸ τοῦ θρόνου ἐξῆλθεν
  choice: 有声音从宝座那里发出
  rationale: “声音”与后面的“说”自然衔接；“从宝座那里发出”保留ἀπό所表达的来源和ἐξέρχομαι所表达的发出动态，同时不擅自认定说话者。
- source_word: Αἰνεῖτε τῷ θεῷ ἡμῶν
  choice: 要赞美我们的上帝
  rationale: 以复数命令式“要赞美”传达直接召唤；中文“赞美”可直接带宾语，无须另译与格形式。
- source_word: πάντες οἱ δοῦλοι αὐτοῦ
  choice: 你们所有属于他的奴仆
  rationale: “奴仆”兼顾δοῦλοι所含的隶属关系与现代中文圣经语体，较单纯“仆人”更能保留完全属于上帝的意味，又避免“奴隶”在此处可能造成仅指被强迫役使者的误读。
- source_word: οἱ φοβούμενοι αὐτόν
  choice: 敬畏他的人
  rationale: “敬畏”是自然且通行的中文圣经表达，兼含畏惧、尊崇与忠诚，没有把语义缩减为单纯害怕或一般尊敬。
- source_word: οἱ μικροὶ καὶ οἱ μεγάλοι
  choice: 无论尊卑
  rationale: 这对实体化形容词在语境中涵盖地位低微和尊贵的人；“无论尊卑”以自然中文表达其全面性。
theological_decisions:
- issue: δοῦλοι在敬拜语境中的译法
  choice: 奴仆
  alternative: 仆人；奴隶
  rationale: “奴仆”保留归属和受约束的力度，也符合庄重的现代中文；脚注列出语义范围，避免把该词的社会身份含义完全弱化。
- issue: 对上帝的φοβέομαι
  choice: 敬畏他
  alternative: 怕他；尊崇他
  rationale: “敬畏”保留圣经中畏惧与尊崇并存的张力，不把这一表达软化为单纯敬重。
- issue: “小的和大的”所指
  choice: 无论尊卑
  alternative: 无论大小；小的和大的
  rationale: 此处更自然地指社会地位低高；脚注保留较为直译的表达，以免遮蔽原文措辞。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“从宝座那里发出”保留声音来源的异象画面；呼语中的“你们”使复数命令式及后续对象在中文里清楚。脚注标记均置于相关整句末尾。
