id: REV.19.8
reference: Revelation 19:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἐδόθη αὐτῇ ἵνα περιβάληται βύσσινον ⸀λαμπρὸν καθαρόν, τὸ γὰρ βύσσινον τὰ δικαιώματα τῶν ἁγίων ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/008.yaml
  text: And it was given to her to clothe herself with fine linen[a], bright and clean, for the fine linen is the righteous deeds of the saints.
translation:
  language: zh_hans
  text: 又赐给她，使她得以穿上明亮洁净的细麻衣；这细麻衣就是圣徒的义行[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “义行”也可译作“公义的行为”。这个希腊词在别处也可指“公义的要求”或“条例”，但在这里最自然是指圣徒所行的义。
    reason: 说明δικαιώματα的可译选择与语义范围，同时保留本处最可能的含义。
lexical_decisions:
- source_word: ἐδόθη αὐτῇ
  choice: 赐给她
  rationale: 保留被动表达和未明说的赐予者；汉语省略主语，既自然，也不把“上帝”增补为原文没有明说的主语。
- source_word: ἵνα περιβάληται
  choice: 使她穿上
  rationale: 体现ἵνα所表达的目的或结果，并以“她穿上”传达中间语态的反身意味，而不是弱化为单纯的“被穿上”。
- source_word: βύσσινον
  choice: 细麻衣
  rationale: βύσσινον指优质细麻布；此处作为可穿的衣物，用“细麻衣”比单说“细麻布”更符合上下文。两次出现均保持相同译法，以清楚呈现象征与解释之间的对应。
- source_word: λαμπρὸν καθαρόν
  choice: 明亮洁净
  rationale: 分别保留衣裳的光辉视觉意象和洁净状态；“洁净”避免过早把衣物描写抽象化为道德上的“纯洁”。
- source_word: δικαιώματα
  choice: 义行
  rationale: 该词语义范围包括合乎正义的行为、正当要求或条例；在此复数形式和象征性解释中，最自然地指圣徒所行的义。
- source_word: τῶν ἁγίων
  choice: 圣徒
  rationale: 这是新约对属上帝之圣洁群体的惯常称呼；“圣徒”简洁、庄重，也符合现代中文圣经语域。
theological_decisions:
- issue: 细麻衣与圣徒义行的关系
  choice: 译作“这细麻衣就是圣徒的义行”，让衣裳象征圣徒的义行。
  alternative: 理解为与圣徒有关的公义要求，或圣徒所得的称义、伸冤。
  rationale: τὰ δικαιώματα在此为复数，最自然地指合乎正义的行为。同时，上半句说衣裳是“赐给”她的，译文保留神所赐的礼物与圣徒实际义行之间的张力，不把二者调和或互相排除。
- issue: ἐδόθη所暗示的施事者
  choice: 不明说赐予者，仅译“赐给她”。
  alternative: 明确译为“上帝赐给她”。
  rationale: 启示录常用可理解为神圣被动的表达，但希腊原文没有明说施事者；中文无主句可自然保留这一含蓄。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“又赐给她”承接上下文；“明亮洁净”保留并列形容词的简洁力度；分号清楚区分异象描写与随后的象征解释。
