  yaml_path: translation/nt/revelation/019/013.yaml
  text: And he is clothed in a robe dipped in blood[a], and his name is called the Word of God.
translation:
  language: zh_hans
  text: 他身穿一件浸染了血的袍子[a]；他的名被称为“神之道”。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“染了血的”。希腊语动词的基本意思是“蘸”“浸”或“染”。
    reason: lexical_alternative
lexical_decisions:
- source_word: περιβεβλημένος
  choice: 身穿
  rationale: 该完成时分词描述他当下穿着袍子的状态。“身穿”在现代汉语中自然简洁，也保留了状态意义。
- source_word: ἱμάτιον
  choice: 袍子
  rationale: ἱμάτιον泛指外衣；结合异象中骑士兼君王的庄严语境，“袍子”比普通的“衣服”更贴切，又不至于过度限定具体式样。
- source_word: βεβαμμένον αἵματι
  choice: 蘸了血
  rationale: βάπτω的基本意义是“蘸、浸、染”。“蘸了血”保留原文鲜明而强烈的画面；“染了血”也可能表示结果状态，列入脚注。
- source_word: κέκληται
  choice: 名叫作
  rationale: καλέω的完成时被动形式表达已经被如此命名并持续以此名为称。“名叫作”符合现代汉语命名表达，也体现其现今名称。
- source_word: τὸ ὄνομα αὐτοῦ
  choice: 他的名
  rationale: 这是希腊语所有格结构的自然汉语表达。
- source_word: ὁ Λόγος τοῦ Θεοῦ
  choice: 上帝之道
  rationale: λόγος在这里是骑士的个人称号，而不只是“信息”或“话语”。“上帝之道”保留其称号性质及约翰文献中的呼应；加引号标明专名用法。
theological_decisions:
- issue: 基督论称号 λόγος
  choice: 上帝之道
  alternative: 上帝的话语
  rationale: 上下文把ὁ Λόγος τοῦ Θεοῦ作为骑士的个人称号。“上帝之道”保留这一称号的神学分量及其与约翰文献的可能呼应，同时不将其弱化为一般的信息或言语。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“袍子”保持异象的庄严色彩；“蘸了血”刻意保留原文令人震撼的意象，不解释血的来源。用“上帝之道”作为称号，并以引号标示。
