  text: Καὶ λέγει μοι· Γράψον· Μακάριοι οἱ εἰς τὸ δεῖπνον τοῦ γάμου τοῦ ἀρνίου κεκλημένοι. καὶ λέγει μοι· Οὗτοι οἱ λόγοι ἀληθινοὶ τοῦ θεοῦ εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/009.yaml
  text: 'And he says to me[a], “Write: Blessed are those who have been invited to the wedding supper of the Lamb.” And he says to me[c][b], “These are the true words of God.”'
translation:
  language: zh_hans
  text: 他又对我说：“你要写下：蒙福的是那些受邀参加羔羊的婚宴的人[a]。”他又对我说：“这些话是真实的，是神的话[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “受邀”也可译作“蒙召参加”。
    reason: lexical_alternative
  - marker: b
    text: “真实”也可理解为“真实可信”或“可靠”；这句话表明这些话确实是神的话，并且可信可靠。
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ λέγει μοι
  choice: 他又对我说
  rationale: 保留原文现在时的叙事现场感，并以“他”保持说话者在本节中的指代，不擅自补成“天使”。“又”自然承接上下文。
- source_word: Γράψον
  choice: 你要写下
  rationale: 准确表达第二人称单数不定过去时命令语气；“写下”在现代汉语中直接、自然，未增添所写内容。
- source_word: Μακάριοι
  choice: 蒙福的是
  rationale: 沿用圣经宣福句的庄重表达，突出从神而来的福分，较“快乐”更能保留原词的神学分量。
- source_word: οἱ εἰς τὸ δεῖπνον τοῦ γάμου τοῦ ἀρνίου κεκλημένοι
  choice: 那些受邀参加羔羊婚宴的人
  rationale: κεκλημένοι是完成时被动分词，表示处于已经被邀请的状态；在宴席语境中译为“受邀”最自然，同时以脚注保留“蒙召”的可能。
- source_word: δεῖπνον τοῦ γάμου
  choice: 婚宴
  rationale: δεῖπνον指正餐或宴席，γάμος在此构成婚礼庆宴意象；“婚宴”简洁自然地表达二者，不必机械拆译为“婚姻的晚餐”。
- source_word: τοῦ ἀρνίου
  choice: 羔羊
  rationale: 保留《启示录》中重要的基督论称号及其献祭、弥赛亚意涵。
- source_word: Οὗτοι οἱ λόγοι ἀληθινοὶ τοῦ θεοῦ εἰσιν
  choice: 这些话是神真实的话
  rationale: 保留复数“这些话”和属格“神的”；“真实”直接对应ἀληθινοί，并让原文可兼具真实、可靠之意，后者在脚注说明。
theological_decisions:
- issue: 末世筵席语境中κεκλημένοι的译法
  choice: 受邀
  alternative: 蒙召
  rationale: 在赴宴语境中，“受邀”最清楚地传达καλέω的惯用含义，又不把本句预先限定为某一种关于呼召功效的教义解释；“蒙召”作为脚注保留其较字面的神学回响。
- issue: ἀληθινοὶ所表达的真实性与可靠性
  choice: 真实
  alternative: 真实可信／可靠
  rationale: “真实”最直接对应原词，也保留它可指真确、真正的宽度；“可信”明确其可靠性，但解释性稍强，因此置于脚注。
- issue: τοῦ θεοῦ的属格关系
  choice: 神……的话
  alternative: 从神而来的话
  rationale: 原文属格可表达归属，并在语境中暗含来源；正文不将其窄化为单纯来源关系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“婚宴”符合当代汉语习惯；“蒙福的是……”保留宣福句的圣经语体。两次均译作“他又对我说”，维持原文重复和说话者指代的含蓄性。
