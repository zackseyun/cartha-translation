id: REV.19.18
reference: Revelation 19:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἵνα φάγητε σάρκας βασιλέων καὶ σάρκας χιλιάρχων καὶ σάρκας ἰσχυρῶν καὶ σάρκας ἵππων καὶ τῶν καθημένων ἐπ’ ⸀αὐτῶν, καὶ σάρκας πάντων ἐλευθέρων τε καὶ δούλων καὶ μικρῶν ⸀καὶ μεγάλων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/018.yaml
  text: so that you may eat the flesh of kings[a], the flesh of commanders, the flesh of the mighty, the flesh of horses and of those who sit on them, and the flesh of all, both free and slave, and small and great.
translation:
  language: zh_hans
  text: 好让你们吃君王的肉、将领的肉、强者的肉、马的肉和骑在马上的人的肉[a]，也吃所有人的肉，无论是自由人还是奴隶，是小人物还是大人物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“坐在它们上面的人”；这里指骑马的人。
    reason: 说明原文的具体表达，并给出正文采用的自然汉语所对应的含义。
lexical_decisions:
- source_word: ἵνα φάγητε
  choice: 好让你们吃
  rationale: 保留ἵνα引出的目的或结果意味，并用自然的现代汉语表达第二人称复数的动作。
- source_word: σάρκας
  choice: 肉
  rationale: 这里指审判场景中的身体之肉；逐项重复“肉”，保留原文列举所形成的强烈修辞效果。
- source_word: βασιλέων
  choice: 君王
  rationale: 准确表达具体的王权身份，比泛称“统治者”更贴近原文。
- source_word: χιλιάρχων
  choice: 将领
  rationale: 该词指军事指挥官；“将领”在现代汉语中清楚自然，又不拘泥于字面的“千夫长”。
- source_word: ἰσχυρῶν
  choice: 强者
  rationale: 原词是名词化形容词，可指强壮或有权势的人；“强者”保留其概括性，不把它限定为某一类战士。
- source_word: ἵππων καὶ τῶν καθημένων ἐπ’ αὐτῶν
  choice: 马……和骑在马上的人
  rationale: 清楚呈现马匹与其乘骑者，同时保留原文“在它们上面”的具体图像。
- source_word: πάντων
  choice: 所有人
  rationale: 概括随后列出的不同社会身份和地位，表达其无一例外的范围。
- source_word: ἐλευθέρων τε καὶ δούλων
  choice: 无论是自由人还是奴隶
  rationale: “自由人—奴隶”是社会身份的两极；“奴隶”准确体现受奴役的法律和社会地位。
- source_word: μικρῶν καὶ μεγάλων
  choice: 是小人物还是大人物
  rationale: 保留“小—大”的对举及其涵盖各种社会地位之人的作用，同时用现代汉语中可理解的人物称谓避免误读为身体大小。
theological_decisions:
- issue: δοῦλος在社会身份对举中的译法
  choice: 奴隶
  alternative: 仆人
  rationale: 本节把δοῦλος与“自由人”直接相对，重点是受奴役的身份，而非一般的服事关系，因此译作“奴隶”最准确。
- issue: μικρῶν καὶ μεγάλων所指的范围
  choice: 小人物还是大人物
  alternative: 卑微的还是尊贵的
  rationale: 原文以“小”和“大”构成概括所有阶层的对举；正文保留这一意象，而不把它完全解释为社会尊卑。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。保留“肉”的反复和各组身份的排比，以呈现审判异象的强烈节奏；避免使用生硬的“千夫长”，也不把“强者”过度限定为战士。
