id: REV.19.20
reference: Revelation 19:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἐπιάσθη τὸ θηρίον καὶ ⸂μετ’ αὐτοῦ ὁ⸃ ψευδοπροφήτης ὁ ποιήσας τὰ σημεῖα ἐνώπιον αὐτοῦ, ἐν οἷς ἐπλάνησεν τοὺς λαβόντας τὸ χάραγμα τοῦ θηρίου καὶ τοὺς προσκυνοῦντας τῇ εἰκόνι αὐτοῦ· ζῶντες ἐβλήθησαν οἱ δύο εἰς τὴν λίμνην τοῦ πυρὸς ⸂τῆς καιομένης⸃ ἐν θείῳ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/020.yaml
  text: And the beast was captured[a], and with it the false prophet who had performed the signs in its presence, by which he deceived those who had received the mark of the beast and those who worshiped its image[b]. The two of them were thrown alive into the lake of fire that burns with sulfur.
translation:
  language: zh_hans
  text: 那兽被擒拿了；与它一同被擒拿的，还有那假先知。这假先知曾在兽面前行神迹，借这些神迹迷惑了那些领受兽的印记的人和那些敬拜兽像的人。这两个都被活活扔进了那燃烧着硫磺的火湖里。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιάσθη
  choice: 被擒拿了
  rationale: πιάζω在此表示被捕获、被拿住；“被擒拿”保留被动语态，也适合争战与审判场景。
- source_word: τὸ θηρίον
  choice: 那兽
  rationale: “兽”保留《启示录》中既定的末世异象意象；定冠词在上下文中以“那”自然体现。
- source_word: μετ’ αὐτοῦ
  choice: 与它一同
  rationale: αὐτοῦ回指语法上为中性的θηρίον。现代汉语用“它”可避免额外强化人格化解释，同时“一同”表达共同被擒的关系。
- source_word: ὁ ψευδοπροφήτης
  choice: 那假先知
  rationale: 该复合词直译为“假先知”，清楚、自然，并与启示文学用语相符。
- source_word: ὁ ποιήσας τὰ σημεῖα
  choice: 曾……行神迹
  rationale: 分词表示先于主要事件发生的行动，用“曾”体现其先行性；σημεῖα重在具有指示或迷惑作用的超常作为，汉语圣经语境中“神迹”比单独的“迹象”更自然。
- source_word: ἐνώπιον αὐτοῦ
  choice: 在它面前
  rationale: 贴近ἐνώπιον的空间及关系含义，并保持所指对象为兽。
- source_word: ἐν οἷς ἐπλάνησεν
  choice: 借此迷惑了
  rationale: ἐν οἷς在这里表达工具意义，神迹是迷惑人的手段；“借此”自然明确。πλανάω译作“迷惑”兼有欺骗和引人偏离之意。
- source_word: τοὺς λαβόντας τὸ χάραγμα τοῦ θηρίου
  choice: 那些受了兽印记……的人
  rationale: λαμβάνω在此是接受、领受；χάραγμα指刻印或标记，“兽印记”准确保留启示录的固定意象。
- source_word: τοὺς προσκυνοῦντας τῇ εἰκόνι αὐτοῦ
  choice: 又敬拜兽像的人
  rationale: προσκυνέω在此具有宗教敬拜含义；εἰκών译作“像”，为避免“它的像”指代生硬，明说“兽像”。“又”连接同一受迷惑群体的两个特征，但不强行断定两个分词短语所指群体是否完全同一。
- source_word: ζῶντες ἐβλήθησαν οἱ δύο
  choice: 这两个被活活扔进了
  rationale: ζῶντες是述谓性分词，说明二者被投入时仍活着；“活活”是自然有力的现代汉语表达，并保留被动审判行动。
- source_word: τὴν λίμνην τοῦ πυρὸς τῆς καιομένης ἐν θείῳ
  choice: 那燃烧着硫磺的火湖
  rationale: 保留火湖和硫磺燃烧的具体启示性审判图像，不扩展为本节未明说的系统神学解释。
theological_decisions:
- issue: 兽的代词指称
  choice: 使用“它”指兽
  alternative: 使用“他”以突出兽的人格性
  rationale: θηρίον在希腊文中为中性名词，原文代词也依此回指。汉语使用“它”保留这种表达，不额外裁定兽究竟应被理解为人物、政权还是复合象征。
- issue: 假先知所行σημεῖα的性质
  choice: 译为“神迹”而不加“虚假”修饰
  alternative: 译作“假神迹”或“奇事”
  rationale: 原文称这些作为为σημεῖα，并未用形容词说明神迹本身是虚假的；迷惑性来自其用途与施行者。故不在译文中补入“假”。
- issue: 末后审判的意象
  choice: 直译为燃烧着硫磺的火湖
  alternative: 解释性译为“地狱”或明确加入“永刑”
  rationale: 本节以具体的启示文学图像表达审判。译文应保存图像，不把其他经文或后来的教义表述直接纳入本节。
- issue: 两个受迷惑的分词群体之间的关系
  choice: 以“那些……、又……的人”顺畅连接，同时不作详尽逻辑界定
  alternative: 明确译为两个彼此不同的群体，或明确断言两项描述完全同指
  rationale: 两个带冠词的复数分词短语由καί连接，可能是对同一类人的并列描述，也可在语法表面上列出两组。译文保持自然并避免过度裁定。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“擒拿”“假先知”“兽印记”“敬拜”“火湖”“硫磺”等词保留启示文学的力度与传统可识别性，同时句法按现代汉语重组，避免欧化长句。原文在本节没有必须以脚注保存的重大文本或词义歧义，因此不设脚注。
