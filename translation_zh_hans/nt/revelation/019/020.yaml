revisions:
- from: 那兽被擒拿了，与它一同被擒的，还有那假先知；这假先知曾在它面前行神迹，借此迷惑了那些受了兽印记、又敬拜兽像的人。这两个被活活扔进了那燃烧着硫磺的火湖里。
  to: 那兽被擒拿了；与它一同被擒拿的，还有那假先知。这假先知曾在兽面前行神迹，借这些神迹迷惑了那些领受兽的印记的人和那些敬拜兽像的人。这两个都被活活扔进了那燃烧着硫磺的火湖里。
  rationale: 'The revision retains the draft''s accurate terminology and apocalyptic register while representing the two Greek coordinate participial groups separately. It also makes the plural instrumental reference to the signs explicit and uses an unambiguous possessive expression for the beast''s mark. No footnote is needed: the relevant ambiguity is preserved directly by the coordinated Mandarin wording.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:21:04Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the beast's capture, the false prophet's prior performance of signs in the beast's presence, deception by those signs, and the final image of the two being thrown alive into the sulfur-burning lake of fire. However, its single construction “那些受了兽印记、又敬拜兽像的人” assimilates two separately articular plural participial groups into one explicitly shared group. The Greek coordinates “those who received the beast's mark” and “those who worship the image,” without requiring the translator to decide whether they are precisely coextensive.
  naturalness: The current Mandarin is generally clear and suitably solemn. Repeating “被擒拿” for the false prophet is slightly more explicit but remains natural and preserves the shared passive action. “领受兽的印记” is idiomatic and makes the possessive relation unambiguous.
  terminology: “兽”“假先知”“神迹”“敬拜”“火湖”“硫磺” are appropriate established terms. “兽的印记” is preferable to the compressed “兽印记” in this formal translation, and “借这些神迹” preserves the plural reference of τὰ σημεῖα.
  issues:
  - severity: medium
    issue: The two objects of deception are rendered as one explicitly combined group.
    rationale: Greek has τοὺς λαβόντας … καὶ τοὺς προσκυνοῦντας, with a separate article for each plural participial phrase. The Chinese “那些……、又……的人” presents both traits as necessarily applying to each person. Render them as two coordinated “那些……的人” groups to preserve the source's surface distinction and ambiguity.
  revised_text: 那兽被擒拿了；与它一同被擒拿的，还有那假先知。这假先知曾在兽面前行神迹，借这些神迹迷惑了那些领受兽的印记的人和那些敬拜兽像的人。这两个都被活活扔进了那燃烧着硫磺的火湖里。
  revised_footnotes: []
  revision_rationale: 'The revision retains the draft''s accurate terminology and apocalyptic register while representing the two Greek coordinate participial groups separately. It also makes the plural instrumental reference to the signs explicit and uses an unambiguous possessive expression for the beast''s mark. No footnote is needed: the relevant ambiguity is preserved directly by the coordinated Mandarin wording.'
