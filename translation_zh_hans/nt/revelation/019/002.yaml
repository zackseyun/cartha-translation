id: REV.19.2
reference: Revelation 19:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὅτι ἀληθιναὶ καὶ δίκαιαι αἱ κρίσεις αὐτοῦ· ὅτι ἔκρινεν τὴν πόρνην τὴν μεγάλην ἥτις ⸀ἔφθειρεν τὴν γῆν ἐν τῇ πορνείᾳ αὐτῆς, καὶ ἐξεδίκησεν τὸ αἷμα τῶν δούλων αὐτοῦ ἐκ χειρὸς αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/002.yaml
  text: because his judgments are true and just; because he judged the great prostitute who corrupted the earth with her sexual immorality[a], and he avenged the blood of his slaves from her hand.
translation:
  language: zh_hans
  text: 因为他的审判真实而公正；因为他审判了那以自己的淫乱败坏大地的大淫妇，并为他众奴仆的血向她伸冤。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “奴仆”所译的希腊词也可译作“仆人”或“奴隶”；这里采用“奴仆”，以保留完全属于主人的较强含义。
    reason: 说明δοῦλος的语义范围及译词取舍。
lexical_decisions:
- source_word: ἀληθιναὶ καὶ δίκαιαι
  choice: 真实而公正
  rationale: 修饰“审判”的两个并列谓语形容词；“真实”表达其符合真相，“公正”保留司法与道德正当性的含义。
- source_word: αἱ κρίσεις αὐτοῦ
  choice: 他的审判
  rationale: “审判”在现代汉语中可自然涵盖判决及施行审判之举，也保留启示录中的末世司法语境。
- source_word: ἔκρινεν
  choice: 审判了
  rationale: 按希腊语简单过去时所述的已完成行动直译，不擅自收窄为“定罪”。
- source_word: τὴν πόρνην τὴν μεγάλην
  choice: 那大淫妇
  rationale: “淫妇”是现代中文圣经语域中自然、凝练的对应语，既保持人物称号的象征性，也不弱化原词的冲击力。
- source_word: ἥτις
  choice: 就是那……的
  rationale: 在此引出带有说明、定性作用的关系从句；此结构自然传达其所指对象的特征。
- source_word: ἔφθειρεν τὴν γῆν
  choice: 败坏大地
  rationale: φθείρω在这里可含毁坏与腐化之意；鉴于后接“以自己的淫乱”，译作“败坏”能保留道德腐化及造成毁损的双重意味。“大地”符合启示录的广阔范围。
- source_word: ἐν τῇ πορνείᾳ αὐτῆς
  choice: 以自己的淫乱
  rationale: “以”表达手段或媒介；“淫乱”既保留性方面的字面意义，也不排除启示录中属灵不忠的象征意味。
- source_word: ἐξεδίκησεν τὸ αἷμα
  choice: 追讨了……的血
  rationale: 中文圣经语域中的“追讨血债/追讨……的血”可表达为被害者伸冤并惩治凶手，保留神执行报应性公义的力度。
- source_word: τῶν δούλων αὐτοῦ
  choice: 他众奴仆
  rationale: “奴仆”兼顾δοῦλος所含的从属、归属关系和中文庄重语体，比单译“仆人”更有力度，又避免现代“奴隶”一词可能造成的纯社会制度联想。
- source_word: ἐκ χειρὸς αὐτῆς
  choice: 从她手中
  rationale: 保留希腊语及圣经常见的“手”之施害主体/权势意象；中文表达亦自然可懂。
theological_decisions:
- issue: δοῦλοι用于称呼属神之人的译法
  choice: 他众奴仆
  alternative: 他的众仆人；他的众奴隶
  rationale: “奴仆”保留完全属于主并受主支配的强义，同时符合现代中文庄重经文语体；脚注说明其语义范围，避免把原词的张力静默消解。
- issue: πορνεία的字面与象征含义
  choice: 淫乱
  alternative: 淫行；不贞
  rationale: 原词在上下文中既有性方面的词义，也可承载偶像崇拜和属灵不忠的象征意义。“淫乱”保留这种张力，不在正文中限定为单一解释。
- issue: ἐξεδίκησεν所表达的神圣报应
  choice: 追讨了……的血
  alternative: 为……的血报了仇；为……伸了冤
  rationale: “追讨”同时体现司法追责和报应，不把经文仅软化为抽象的平反，也不使其听来像私人泄愤。
translation_notes:
  register: 采用现代、庄重而清楚的汉语，保留启示录赞歌式的两个“因为”及司法意象。“那大淫妇”“败坏大地”“从她手中追讨……的血”维持原文力度与意象，不额外解释象征对象。脚注标记置于相关句末，正文与脚注对应。
