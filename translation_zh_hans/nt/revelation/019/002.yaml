  naturalness: 原句的“那大淫妇，就是那以自己的淫乱败坏大地的”带有重复的指称结构，现代汉语略显滞涩。将关系从句前置为定语，并将末句改为“为……的血向她伸冤”，更自然、庄重，也保留原文意象。
