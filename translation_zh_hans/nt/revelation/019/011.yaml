source:
  edition: SBLGNT
  text: Καὶ εἶδον τὸν οὐρανὸν ἠνεῳγμένον, καὶ ἰδοὺ ἵππος λευκός, καὶ ὁ καθήμενος ἐπ’ αὐτὸν ⸂πιστὸς καλούμενος⸃ καὶ ἀληθινός, καὶ ἐν δικαιοσύνῃ κρίνει καὶ πολεμεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/011.yaml
  text: And I saw heaven opened[a], and behold, a white horse, and the one sitting on it is called Faithful and True, and in righteousness he judges and wages war.
translation:
  language: zh_hans
  text: 我又看见天已经敞开。看哪，有一匹白马；骑在马上的那一位，称为“信实、真实”。他按着公义[a]审判并争战。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “按着公义”也可译作“按着公正”。
    reason: 保留δικαιοσύνη在审判和争战语境中可侧重公正、正义的译法。
lexical_decisions:
- source_word: ἠνεῳγμένον
  choice: 敞开了
  rationale: 这是ἀνοίγω的完成时被动分词，描写天已经被打开并处于敞开的状态；“敞开了”在现代汉语中自然，也保留其结果状态。
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留异象叙述中引人注目、增强现场感的语篇作用，也符合庄重而易懂的经文语体。
- source_word: ἵππος λευκός
  choice: 一匹白马
  rationale: 按现代汉语习惯加入量词“匹”，直译该名词短语。
- source_word: ὁ καθήμενος ἐπ’ αὐτὸν
  choice: 那骑在马上的
  rationale: 原文直义是“坐在它上面的那一位”；语境明确所坐的是马，因此用“骑在马上的”更符合自然汉语，且不增加身份认定。
- source_word: πιστὸς καλούμενος καὶ ἀληθινός
  choice: 称为“忠信、真实”
  rationale: καλούμενος表示被称呼或得名；πιστός与ἀληθινός在此构成称号。“忠信”兼顾忠诚与可信，“真实”保留ἀληθινός的约翰文献用语色彩。
- source_word: ἐν δικαιοσύνῃ
  choice: 凭公义
  rationale: 该介词短语表示审判和争战所依据的原则或方式。“凭公义”自然简洁，并保留δικαιοσύνη的核心语义；“按公正”作为语境合适的替代译法收入脚注。
- source_word: κρίνει
  choice: 审判
  rationale: 保留现在时动词的直接陈述，不另加原文没有的程度或方式副词。
- source_word: πολεμεῖ
  choice: 争战
  rationale: 表达实际进行战争的军事含义，比泛指个人打斗的“战斗”更贴合此处的末世战争语境。
theological_decisions:
- issue: 白马骑士称号的表达
  choice: 将πιστός和ἀληθινός译作称号“忠信、真实”
  alternative: 译为一般性质描述“忠信而真实”
  rationale: καλούμενος明确引出称呼，而启示录的近距离语境也支持称号功能；加引号可标明称号性质，但不在本节内额外明说骑士的身份。
- issue: δικαιοσύνη的译法
  choice: 正文译为“公义”
  alternative: 译为“公正”
  rationale: δικαιοσύνη既可表达公义的性质，也可在审判语境中突出公正、正义。正文保留较宽的“公义”，脚注列出“公正”，避免消除其语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”保留启示文学的突显语气；句式适度分开，以免连续多个“和”造成拖沓。称号使用引号，不依赖中文大小写来标示专名。
