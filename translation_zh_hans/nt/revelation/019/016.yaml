base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/016.yaml
  text: 'And he has a name written on his robe and on his thigh: King of kings and Lord of lords[a].'
translation:
  language: zh_hans
  text: 他的衣服上和他的大腿上写着一个名号：“万王之王，万主之主。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“刻着一个名号。”希腊文直译为“一个写着的名号”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχει
  choice: 有（以“写着”自然表达）
  rationale: 现在时直陈语气呈现异象中的鲜明当前状态；汉语用“写着”可同时自然传达“有一个写成的名号”这一静态结果。
- source_word: ἐπὶ τὸ ἱμάτιον
  choice: 衣服上
  rationale: ἱμάτιον可指衣服、外衣或袍子；此处选择自然且不过度具体的“衣服”，避免把衣物样式限定为袍子。
- source_word: ἐπὶ τὸν μηρὸν αὐτοῦ
  choice: 大腿上
  rationale: μηρός直接指大腿；照译并保留两个并列位置，不解释名号究竟如何分布。
- source_word: ὄνομα γεγραμμένον
  choice: 写着一个名号
  rationale: γεγραμμένον为完成时被动分词，强调已经写下而现今可见的状态；“写着”自然承载这一状态义。“名号”也适合下文兼具名字与称号性质的内容。
- source_word: Βασιλεὺς βασιλέων
  choice: 万王之王
  rationale: 这是现代中文圣经语域中自然、庄重且准确的最高级式表达，保留其崇高王权含义。
- source_word: κύριος κυρίων
  choice: 万主之主
  rationale: 保留κύριος的“主”及与前句平行的属格最高级结构，维持其神学与修辞力量。
theological_decisions:
- issue: 称号应直译还是解释性意译
  choice: 保留“万王之王，万主之主”这一传统而贴近原文的王权称号
  alternative: 至高的王，至高的主
  rationale: 原文明确给出写下的名号/称号；直译能保留其结构、崇高语势和基督论分量，而不作释义性扩展。
- issue: 如何处理“衣服上和大腿上”两个空间短语
  choice: 直接保留两个并列位置
  alternative: 衣服上，也就是遮盖大腿的部位；或衣服及佩剑带附近
  rationale: 希腊文有两个并列的ἐπί短语，却没有解释二者的空间关系；译文不应替原文消除这一图像上的歧义。
translation_notes:
  register: 采用现代、庄重、易懂的简体中文。“他衣服上和大腿上”紧贴原文的并列结构；“名号”兼顾ὄνομα在此既是名字又是尊称的功能。脚注标记已置于正文相应位置。
