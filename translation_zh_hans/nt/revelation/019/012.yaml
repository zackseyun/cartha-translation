  text: οἱ δὲ ὀφθαλμοὶ ⸀αὐτοῦ φλὸξ πυρός, καὶ ἐπὶ τὴν κεφαλὴν αὐτοῦ διαδήματα πολλά, ⸀ἔχων ὄνομα γεγραμμένον ὃ οὐδεὶς οἶδεν εἰ μὴ αὐτός,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/012.yaml
  text: His eyes were a flame of fire, and on his head were many crowns, and he had a name written that no one knows except himself.
translation:
  language: zh_hans
  text: 他的眼睛如火焰，头上戴着许多王冠[a]；他有一个写下的名字，除了他自己，没有人知道。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“许多冠冕”。原文所用的词特指君王所戴、象征王权的冠冕。
    reason: 说明διάδημα的王权含义，并保留较贴近术语的替代译法。
lexical_decisions:
- source_word: οἱ δὲ ὀφθαλμοὶ αὐτοῦ
  choice: 他的双眼
  rationale: 以现代汉语自然表达所属关系；“双眼”保持画面的鲜明性。δέ在连续描写中是轻微承接词，汉语无需另译。
- source_word: φλὸξ πυρός
  choice: 是火焰
  rationale: 原文是无系词的名词性表述，且本节没有明示比较词；译作“是火焰”保留直接而强烈的隐喻，不擅自补入“如同”。
- source_word: ἐπὶ τὴν κεφαλὴν αὐτοῦ
  choice: 头上戴着
  rationale: ἐπί表达位于头上；按汉语习惯以“戴着”自然呈现冠冕与头部的关系。
- source_word: διαδήματα πολλά
  choice: 许多王冠
  rationale: διάδημα特指王权的冠冕；“王冠”既准确体现君王身份，也比音译或古雅术语更易懂。脚注补充其特定含义。
- source_word: ἔχων ὄνομα γεγραμμένον
  choice: 他还有一个被写下的名字
  rationale: 将分词结构转为汉语完整分句；“被写下”保留被动及完成后仍存的结果状态，同时不增添原文未说明的书写位置。
- source_word: ὃ οὐδεὶς οἶδεν εἰ μὴ αὐτός
  choice: 除了他自己，没有人知道
  rationale: 自然表达例外结构，并保留αὐτός所强调的排他性；οἶδεν按其现在意义译为“知道”。
theological_decisions:
- issue: 名字只有骑马者自己知道
  choice: 除了他自己，没有人知道
  alternative: 强调该名字总体上不可理解
  rationale: 原文明确设置“没有人……除了他自己”的例外，译文保留其独有的自知，却不进一步解释这个名字的性质或推演其神学含义。
- issue: 双眼与火焰之间的关系
  choice: 他的双眼是火焰
  alternative: 他的双眼如同火焰
  rationale: 本节原文没有明示比较词，故保留直接的名词性描写；不以“如同”消解其强烈表达，也不把意象作字面神学解释。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“双眼是火焰”有意保留原文突兀、有力的异象语言；句号划分两组描写，使长句易读。脚注标记[a]已置于“王冠”之后。
