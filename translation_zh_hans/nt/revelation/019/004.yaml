  text: καὶ ἔπεσαν οἱ πρεσβύτεροι οἱ εἴκοσι τέσσαρες καὶ τὰ τέσσαρα ζῷα, καὶ προσεκύνησαν τῷ θεῷ τῷ καθημένῳ ἐπὶ ⸂τῷ θρόνῳ⸃ λέγοντες· Ἀμήν, Ἁλληλουϊά.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/004.yaml
  text: And the twenty-four elders and the four living creatures fell down and worshiped God[a], the one seated on the throne, saying, “Amen! Hallelujah!”
translation:
  language: zh_hans
  text: 那二十四位长老和四个活物就俯伏在地，敬拜坐在宝座上的神，说：“阿们！哈利路亚！”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“赞美耶和华！”（源自希伯来语的礼仪欢呼；字面含义为“赞美雅〔Yah〕！”）
    reason: 说明Ἁλληλουϊά的礼仪性质及其所含Yah的字面意义，同时提供自然的中文译法。
lexical_decisions:
- source_word: ἔπεσαν
  choice: 俯伏
  rationale: 在敬拜语境中，πίπτω所描写的是伏地的动作；“俯伏”比单说“倒下”更准确、自然地表达敬拜姿态。
- source_word: οἱ πρεσβύτεροι οἱ εἴκοσι τέσσαρες
  choice: 那二十四位长老
  rationale: “长老”是《启示录》中πρεσβύτεροι的通行译法；量词“位”符合现代汉语对有位格者的表达。
- source_word: τὰ τέσσαρα ζῷα
  choice: 四个活物
  rationale: “活物”既贴近ζῷα的基本含义，也保留这些宝座周围存在者的异象性质，不把它们简化为普通动物。
- source_word: προσεκύνησαν
  choice: 敬拜
  rationale: 受事者明确是神，因此此处表示宗教意义上的敬拜，而不只是一般性的致敬或下拜。
- source_word: τῷ θεῷ τῷ καθημένῳ ἐπὶ τῷ θρόνῳ
  choice: 坐在宝座上的神
  rationale: 以自然的汉语定语结构表达希腊文同位性的分词短语，清楚指出受敬拜的是那位坐在宝座上的神。
- source_word: λέγοντες
  choice: 说
  rationale: 汉语用“说”自然地连接俯伏敬拜的动作与随后发出的欢呼，无须机械保留分词形式。
- source_word: Ἀμήν
  choice: 阿们
  rationale: 保留已经进入汉语基督教礼仪传统的音译形式，符合其固定欢呼语的功能。
- source_word: Ἁλληλουϊά
  choice: 哈利路亚
  rationale: 希腊文本身音译了希伯来语礼仪欢呼；汉语继续采用广为人知的固定音译，并在脚注说明其含义。
theological_decisions:
- issue: 如何处理嵌入希腊文本的希伯来语礼仪欢呼Ἁλληλουϊά
  choice: 正文音译为“哈利路亚”
  alternative: 译为“要赞美主”或“要赞美雅”
  rationale: 该词在此是固定的敬拜欢呼，而非普通陈述。音译可保留其礼仪性质和原文形式；脚注则交代其希伯来语含义，避免读者只识其声音而不知其意义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“俯伏敬拜”清楚呈现连续而统一的敬拜行动；保留“阿们”“哈利路亚”两项为礼仪性欢呼。脚注标记紧接其所解释的“哈利路亚”。
