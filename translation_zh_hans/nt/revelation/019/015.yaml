id: REV.19.15
reference: Revelation 19:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἐκ τοῦ στόματος αὐτοῦ ἐκπορεύεται ⸀ῥομφαία ὀξεῖα, ἵνα ἐν αὐτῇ πατάξῃ τὰ ἔθνη, καὶ αὐτὸς ποιμανεῖ αὐτοὺς ἐν ῥάβδῳ σιδηρᾷ· καὶ αὐτὸς πατεῖ τὴν ληνὸν τοῦ οἴνου τοῦ θυμοῦ τῆς ὀργῆς τοῦ θεοῦ τοῦ παντοκράτορος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/015.yaml
  text: And from his mouth comes a sharp sword[a], so that with it he may strike the nations, and he himself will shepherd them with an iron rod[b]; and he himself treads the winepress of the wine of the fury of the wrath of God the Almighty.
translation:
  language: zh_hans
  text: 有一把利剑从他口中出来，为要用它击打列国；他要用铁杖牧养[a]他们；他也踩踏酒榨，就是全能上帝愤怒的烈怒之酒的酒榨。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “牧养”也可译作“统治”。希腊原文的动词本义是“作牧人、牧养”，在这里回响《诗篇》第二篇，并含有君王治理的意思。
    reason: alternative_reading
  - marker: b
    text: 原文连续使用“烈怒”和“愤怒”两个近义词，加强全能上帝施行审判的强烈语气。
    reason: lexical_clarification
lexical_decisions:
- source_word: ἐκπορεύεται
  choice: 出来
  rationale: 保留现在时异象的鲜活感，表达剑从他口中发出；现代汉语中比“行出”自然。
- source_word: ῥομφαία ὀξεῖα
  choice: 一把利剑
  rationale: ῥομφαία指大型刀剑，但具体形制不宜过度限定；“利剑”简洁保留ὀξεῖα的锋利含义。
- source_word: ἵνα ἐν αὐτῇ πατάξῃ
  choice: 为要用它击打
  rationale: “为要”表达ἵνα的目的含义，“用它”表达工具性的ἐν；“击打”不额外加入“击倒”的结果。
- source_word: τὰ ἔθνη
  choice: 列国
  rationale: 指各国、万邦的集合，符合《启示录》的宏观审判语境，也避免把含义局限为与犹太人相对的“外邦人”。
- source_word: ποιμανεῖ
  choice: 要……牧养
  rationale: 保留动词“作牧人、牧养”的本义及其牧者意象，同时让铁杖所呈现的王权和审判张力保持可见。
- source_word: ἐν ῥάβδῳ σιδηρᾷ
  choice: 用铁杖
  rationale: 自然表达工具含义，并保留诗篇第二篇所回响的“铁杖”意象。
- source_word: πατεῖ τὴν ληνὸν
  choice: 踩踏酒榨
  rationale: 保留葡萄酒榨的先知性审判图像；“踩踏”体现πατεῖ的动作性和持续的异象画面。
- source_word: τοῦ οἴνου τοῦ θυμοῦ τῆς ὀργῆς
  choice: 榨出……忿怒所发的暴怒之酒
  rationale: 用“忿怒”和“暴怒”分别对应ὀργή与θυμός，不把两个近义词压缩为一个；补出汉语中酒榨动作自然蕴含的“榨出”，使层叠属格关系清楚而不改变图像。
- source_word: τοῦ θεοῦ τοῦ παντοκράτορος
  choice: 全能上帝
  rationale: “全能”保留παντοκράτωρ作为上帝称号的力量；语序符合现代标准汉语。
theological_decisions:
- issue: 审判语境及诗篇第二篇回响中的ποιμανεῖ
  choice: 他要用铁杖牧养他们
  alternative: 他要用铁杖统治他们
  rationale: 原文动词本义是“牧养”，但在弥赛亚王权语境中也包含治理含义。正文保留牧者隐喻及其与铁杖并置的神学张力，脚注列出语境性译法“统治”。
- issue: θυμοῦ τῆς ὀργῆς的双重忿怒表达
  choice: 忿怒所发的暴怒
  alternative: 猛烈的忿怒
  rationale: 原文使用两个意义相近而不相同的词强化审判。中文分别译出二词，避免将修辞强度静默压缩为单一概念；同时以关系短语使层叠属格在现代汉语中可懂。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。以分号保留三个并列异象动作的推进；避免古奥的“口中出剑”“辖管”等固定宗教措辞。末句为使希腊语层叠属格在汉语中自然清楚，明确表达酒榨“榨出”暴怒之酒，但仍保留酒、酒榨、踩踏以及两个忿怒词汇的完整图像。
