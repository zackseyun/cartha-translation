id: REV.19.6
reference: Revelation 19:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἤκουσα ὡς φωνὴν ὄχλου πολλοῦ καὶ ὡς φωνὴν ὑδάτων πολλῶν καὶ ὡς φωνὴν βροντῶν ἰσχυρῶν, ⸀λεγόντων· Ἁλληλουϊά, ὅτι ἐβασίλευσεν κύριος, ὁ ⸀θεός, ὁ παντοκράτωρ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/006.yaml
  text: And I heard what seemed to be the voice of a great multitude[a], and like the voice of many waters, and like the voice of mighty thunders, saying, “Hallelujah! For the Lord God, the Almighty[b], reigns.”
translation:
  language: zh_hans
  text: 我听见仿佛是大群人的声音，又像众水的声音，又像强烈雷声的声音；他们说：“哈利路亚！因为主——上帝、全能者——掌权了。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“主我们的上帝，全能者”；所据希腊文本作“主——上帝、全能者——”。“掌权了”也可译作“作王了”“已经作王”或“开始掌权了”；这里的希腊语可理解为庆贺上帝的统治已经决定性地彰显。
    reason: 说明“我们的”这一重要文本异文，并保留ἐβασίλευσεν在此处的词义与时貌张力。
lexical_decisions:
- source_word: ἤκουσα
  choice: 我听见
  rationale: 不定过去时直陈语气在异象叙事中自然译为“我听见”，承接前文所见所闻。
- source_word: ὡς φωνὴν ὄχλου πολλοῦ
  choice: 一个声音，仿佛来自一大群人
  rationale: ὡς表示比拟；φωνή可指声音或嗓音。此处随后有“说”，故保留群体发声的意味，同时以“仿佛来自”避免把比拟写成确定身份。
- source_word: ὡς φωνὴν ὑδάτων πολλῶν
  choice: 又像众水的响声
  rationale: “众水”保留圣经异象语言及其互文色彩；“响声”比“声音”更符合水声的现代汉语表达。
- source_word: ὡς φωνὴν βροντῶν ἰσχυρῶν
  choice: 也像隆隆的巨雷
  rationale: ἰσχυρός强调强大有力；“隆隆的巨雷”自然传达声势，而不把它仅缩减为音量。
- source_word: λεγόντων
  choice: 说
  rationale: 分词引出宣告内容，直译为“说”最少增添解释；其复数形式与前面的众人相呼应。
- source_word: Ἁλληλουϊά
  choice: 哈利路亚
  rationale: 采用现代中文基督教语境中已确立的音译，保留礼仪性欢呼。
- source_word: ὅτι
  choice: 因为
  rationale: 在此引出欢呼的理由，现代汉语用“因为”清楚自然。
- source_word: ἐβασίλευσεν
  choice: 掌权了
  rationale: 不定过去时在此宣告上帝王权决定性地彰显；“掌权了”既有完成/发生的语感，又不明确断言上帝此前没有统治。
- source_word: κύριος, ὁ θεός, ὁ παντοκράτωρ
  choice: 主——全能的上帝——
  rationale: 按所给SBLGNT本文不加入“我们的”；两个带冠词的同位称号以插入结构自然呈现。“全能的”准确表达παντοκράτωρ。
theological_decisions:
- issue: ἐβασίλευσεν与上帝统治的时间含义
  choice: 掌权了
  alternative: 正在掌权／开始掌权／作王了
  rationale: 希腊语不定过去时可庆贺王权已经决定性显明，但经文本身并未要求把它系统化为上帝绝对主权从此才开始。“掌权了”保留完成性和末世性张力，不进一步解释。
- issue: κύριος, ὁ θεός, ὁ παντοκράτωρ中的人称所属
  choice: 主——全能的上帝——
  alternative: 主我们的上帝，全能者
  rationale: 所给SBLGNT正文没有ἡμῶν（“我们的”），因此正文不采纳该读法；重要异文在脚注中说明。
- issue: παντοκράτωρ的译法
  choice: 全能的
  alternative: 全能者／统管万有者
  rationale: “全能的上帝”是自然庄重的现代汉语称号，也保留该词关于无上能力与统治的广度，不强行限定为单一神学释义。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“众水”保留启示文学的圣经意象；“隆隆的巨雷”增强自然听感。破折号标明“全能的上帝”是对“主”的同位说明。脚注标记[a]已置于正文相关宣告之后。
