id: REV.19.7
reference: Revelation 19:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: χαίρωμεν καὶ ⸀ἀγαλλιῶμεν, καὶ ⸀δώσομεν τὴν δόξαν αὐτῷ, ὅτι ἦλθεν ὁ γάμος τοῦ ἀρνίου, καὶ ἡ γυνὴ αὐτοῦ ἡτοίμασεν ἑαυτήν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/007.yaml
  text: Let us rejoice and exult[a], and let us give glory to him, because the marriage of the Lamb has come[b], and his bride has made herself ready.
translation:
  language: zh_hans
  text: 让我们欢喜雀跃，把荣耀归给他[a]！因为羔羊的婚礼到了，他的新娘[b]也已经把自己预备好了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们必把荣耀归给他。”希腊语动词的形式是将来时，不过在这里很可能与前面的“让我们欢喜雀跃”一样，带有劝勉意味。
    reason: alternative_reading
  - marker: b
    text: 或译：“他的妻子。”希腊语γυνή可指“女人”“妻子”，在婚礼语境中也可指“新娘”。
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρωμεν καὶ ἀγαλλιῶμεν
  choice: 让我们欢喜雀跃
  rationale: 两个现在时虚拟语气在此共同表达劝勉；“欢喜雀跃”既保留成对结构，又体现ἀγαλλιῶμεν较强烈、洋溢的喜乐。
- source_word: δώσομεν τὴν δόξαν αὐτῷ
  choice: 把荣耀归给他
  rationale: δώσομεν在形态上是将来时，但处于连续的礼仪性劝勉中，可自然理解为与前两个劝勉式动词并列；“把荣耀归给他”是现代汉语中自然庄重的颂赞表达。
- source_word: ἦλθεν ὁ γάμος
  choice: 婚礼到了
  rationale: ἦλθεν表示已经来临；γάμος在这里指婚礼或婚姻之事，而下一节才明确提到筵席，因此不译作“婚宴”。
- source_word: τοῦ ἀρνίου
  choice: 羔羊的
  rationale: “羔羊”保留《启示录》中这一基督论称号的惯常译法。
- source_word: ἡ γυνὴ αὐτοῦ
  choice: 他的新娘
  rationale: γυνή可指女人、妻子或新娘；婚礼语境使“新娘”最自然，同时以脚注保留“妻子”这一词义可能。
- source_word: ἡτοίμασεν ἑαυτήν
  choice: 已经把自己预备好了
  rationale: 明确保留反身代词ἑαυτήν，并以自然汉语表达已经完成且与当前情景相关的预备。
theological_decisions:
- issue: 婚礼意象中γυνὴ αὐτοῦ的身份称谓
  choice: 他的新娘
  alternative: 他的妻子
  rationale: 本节突出婚礼来临和女方已经预备妥当，“新娘”最贴合场景；但原词也可译为“妻子”，故不应把这一词汇张力静默消除。
- issue: 劝勉序列中δώσομεν的语气
  choice: 把荣耀归给他
  alternative: 我们必把荣耀归给他
  rationale: 虽然δώσομεν在形态上是将来时直陈语气，但在χαίρωμεν和ἀγαλλιῶμεν之后，很可能延续共同劝勉的功能；正文采用劝勉式理解，脚注保留预测性将来时的可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“欢喜雀跃”体现颂赞场景的热烈程度；“婚礼到了”避免提前引入下一节才明说的婚宴；正文中的[a]、[b]均紧随相关词句。
