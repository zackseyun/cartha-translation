  text: καὶ τὰ στρατεύματα ⸀τὰ ἐν τῷ οὐρανῷ ἠκολούθει αὐτῷ ἐφ’ ἵπποις λευκοῖς, ἐνδεδυμένοι βύσσινον λευκὸν καθαρόν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/014.yaml
  text: And the armies in heaven were following him on white horses[a], clothed in fine linen, white and clean.
translation:
  language: zh_hans
  text: 天上的众军[a]骑着白马，跟随着他；他们身穿洁白、洁净的细麻衣。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“在天上的众军”。原文为“众军，就是那些在天上的”。
    reason: 保留处所性短语与可能的关系性理解之间的细微差别。
lexical_decisions:
- source_word: στρατεύματα
  choice: 众军
  rationale: 该复数名词指有组织的军队或武装队伍；“众军”既准确表达复数整体，也符合《启示录》的庄严语体。
- source_word: τὰ ἐν τῷ οὐρανῷ
  choice: 天上的
  rationale: 原文是位置性短语，直指这些军队在天上；中文“天上的众军”自然，同时可兼容“在天上的众军”与“天军”的理解，而不限定其身份。
- source_word: ἠκολούθει αὐτῷ
  choice: 跟随着他
  rationale: 未完成时描写异象中持续进行的动作；“跟随着”比单纯“跟随了”更能体现过程。
- source_word: ἐφ’ ἵπποις λευκοῖς
  choice: 骑着白马
  rationale: 中文用“骑着”自然表达乘在马上的状态，并保留象征性的白色。
- source_word: ἐνδεδυμένοι
  choice: 身穿
  rationale: 表达穿着状态，现代、庄重且清楚；其阳性复数形式与代表军队成员的群体相呼应。
- source_word: βύσσινον
  choice: 细麻衣
  rationale: 该词指优质细麻布制成的衣物；“细麻衣”保留《启示录》中反复出现的材料意象。
- source_word: λευκὸν καθαρόν
  choice: 洁白、洁净的
  rationale: 分别保留两个形容词的视觉色彩与洁净含义，不把 καθαρόν 进一步神学化为“纯洁”。
theological_decisions:
- issue: 天上众军的身份
  choice: 仅译作“天上的众军”，不说明是天使、圣徒或两者兼有
  alternative: 明确译作“天使的军队”或“得荣耀圣徒组成的军队”
  rationale: 本节只交代其所在、行动和衣着，并未明确界定身份；译文保持原文的开放性。
- issue: τὰ ἐν τῷ οὐρανῷ 的关系含义
  choice: 正文采用“天上的众军”，并以脚注说明较直译的表达
  alternative: 在正文译作“在天上的众军”
  rationale: “天上的”是自然简洁的现代汉语，但可能被理解为归属关系；脚注保留希腊语明确的处所结构。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“众军”“细麻衣”保留异象文学的庄严感；分号使骑马跟随与身穿细麻衣两个画面层次清楚。
