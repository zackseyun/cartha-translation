id: REV.19.10
reference: Revelation 19:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἔπεσα ἔμπροσθεν τῶν ποδῶν αὐτοῦ προσκυνῆσαι αὐτῷ. καὶ λέγει μοι· Ὅρα μή· σύνδουλός σού εἰμι καὶ τῶν ἀδελφῶν σου τῶν ἐχόντων τὴν μαρτυρίαν Ἰησοῦ· τῷ θεῷ προσκύνησον· ἡ γὰρ ⸀μαρτυρία Ἰησοῦ ἐστιν τὸ πνεῦμα τῆς προφητείας.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/010.yaml
  text: And I fell before his feet to worship him[a]. But he says to me, “See that you do not! I am a fellow slave with you and with your brothers who hold the testimony of Jesus. Worship God[c][b], for the testimony of Jesus is the spirit of prophecy.”
translation:
  language: zh_hans
  text: 我就俯伏在他脚前，要敬拜他。他对我说：“千万不可！我与你和你那些有耶稣见证[a]的弟兄同为奴仆[c]。你要敬拜上帝！因为耶稣的见证就是预言的灵。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶稣的见证”也可理解为“关于耶稣的见证”或“耶稣自己的见证”。本节末尾同一表达也有这种歧义。
    reason: 保留希腊文属格结构的真实歧义。
  - marker: c
    text: “同为奴仆”也可译作“同为仆人”。
    reason: 提供σύνδουλος较弱化、但在现代汉语中较常见的词汇译法。
lexical_decisions:
- source_word: ἔπεσα ἔμπροσθεν τῶν ποδῶν αὐτοῦ
  choice: 我就俯伏在他脚前
  rationale: 既表达俯身伏地的动作，也保留ἔμπροσθεν所表示的“在……前面”；现代汉语自然庄重。
- source_word: προσκυνῆσαι αὐτῷ / τῷ θεῷ προσκύνησον
  choice: 要敬拜他／你要敬拜上帝
  rationale: 天使拒绝这一举动，并将其明确转向上帝，因此“敬拜”比仅表示身体动作的“下拜”更准确地传达本处的宗教含义。
- source_word: Ὅρα μή
  choice: 千万不可！
  rationale: 该短语是突然、强烈的禁止语；“千万不可”简洁自然，并保留警止的力度。
- source_word: σύνδουλός
  choice: 同是奴仆
  rationale: 该词强调共同处于主人权下的奴仆身份；此处天使借此表明自己与约翰及其他信徒一样服在上帝之下，不是受敬拜者。
- source_word: ἀδελφῶν σου
  choice: 弟兄
  rationale: 对应希腊文阳性复数的亲属称谓，同时在本语境中可作为群体称谓，指同属信仰群体的人；可能包含女性这一点以脚注说明。
- source_word: τῶν ἐχόντων τὴν μαρτυρίαν Ἰησοῦ
  choice: 那些有耶稣的见证的
  rationale: 用“有”直接对应ἔχω，并以“耶稣的见证”保留Ἰησοῦ属格究竟为主格属格还是宾格属格的歧义。
- source_word: μαρτυρία Ἰησοῦ
  choice: 耶稣的见证
  rationale: 此表达既可能指关于耶稣的见证，也可能指耶稣所作或所赐的见证；正文不替原文作出选择，并在两处采用相同译法。
- source_word: πνεῦμα τῆς προφητείας
  choice: 预言的灵
  rationale: 保留πνεῦμα的神学分量及原文属格结构，不把它直接解释为“本质”或“精髓”；“预言”在本书语境中包含受感而传讲上帝信息的含义。
theological_decisions:
- issue: “耶稣的见证”中属格Ἰησοῦ的含义
  choice: 正文保留“耶稣的见证”这一歧义表达
  alternative: “关于耶稣的见证”或“耶稣自己的见证”
  rationale: 希腊文既可理解为以耶稣为内容的见证，也可理解为源于耶稣的见证；上下文并未迫使译者排除其中一种，因此正文保留张力，脚注列出两种理解。
- issue: σύνδουλος所表达的身份关系
  choice: 同是奴仆
  alternative: 同是仆人
  rationale: 本节的重点是天使也完全处在上帝权下，不能成为敬拜对象；“奴仆”比“仆人”更鲜明地表达共同隶属和顺服的身份。
- issue: “预言的灵”的所指
  choice: 不在正文中将πνεῦμα解释为“本质”或明确限定为圣灵
  alternative: “预言的精髓”或“使人说预言的圣灵”
  rationale: πνεῦμα在此可涉及预言的推动力量、内在实质或圣灵的工作；原句简练且具有神学张力，译文不应加入原文未明说的限定。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“千万不可”保留天使制止约翰时的突兀力度；“我和你……同是奴仆”使汉语句法自然，同时准确呈现天使与约翰及众信徒共同隶属于上帝的关系。正文有意重复“耶稣的见证”，以对应原文并保留两处相同的解释空间。
