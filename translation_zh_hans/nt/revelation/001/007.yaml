  naturalness: 修订后的“看哪，他伴着云而来”庄重自然，且不使用“驾着云”这一额外意象。“包括那些刺透他的人”在现代汉语中清楚地表达其属于“每一只眼睛”的范围，无须重复“也要看见他”。
  terminology: 保留“看哪”“刺透”“阿们”等适合本段启示文学及其旧约互文的庄重措辞。以“各支派”对应φυλαί，避免将其泛化为“万族”。
