  text: Ἰδοὺ ἔρχεται μετὰ τῶν νεφελῶν, καὶ ὄψεται αὐτὸν πᾶς ὀφθαλμὸς καὶ οἵτινες αὐτὸν ἐξεκέντησαν, καὶ κόψονται ἐπ’ αὐτὸν πᾶσαι αἱ φυλαὶ τῆς γῆς. ναί, ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/007.yaml
  text: Look[a], he is coming with the clouds, and every eye will see him, even those who pierced him, and all the tribes of the earth will mourn over him. Yes, amen.
translation:
  language: zh_hans
  text: 看哪，他伴着云而来！每一只眼睛都要看见他，包括那些刺透他的人；地上的各支派都要为他哀哭。[a]是的，阿们！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那地的各支派都要为他哀哭。”这句话可能呼应《撒迦利亚书》12:10–12；在那里的语境中，γῆ可理解为“那地”。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰδοὺ
  choice: 看哪
  rationale: 以现代中文仍通行的庄重感叹语唤起注意，保留原文鲜明、宣告性的语气。
- source_word: ἔρχεται
  choice: 而来
  rationale: 结合“驾着云”表达正在来临且指向将来的生动现在时，不弱化其迫近感。
- source_word: μετὰ τῶν νεφελῶν
  choice: 驾着云
  rationale: 自然传达“与云同来”的意象，并呼应《但以理书》7:13；“驾着”不把云仅处理为背景。
- source_word: ὄψεται αὐτὸν πᾶς ὀφθαλμὸς
  choice: 每一只眼睛都要看见他
  rationale: 保留原文具体、逐一分配的“每一只眼睛”，不概括成“所有人”。
- source_word: οἵτινες αὐτὸν ἐξεκέντησαν
  choice: 连那些刺透他的人也要看见他
  rationale: “刺透”保留与《撒迦利亚书》12:10及《约翰福音》19:37的词语联系；补出“也要看见他”使中文关系清楚，但不改变指称范围。
- source_word: κόψονται ἐπ’ αὐτὸν
  choice: 都要因他哀哭
  rationale: κόπτω在此指哀悼、悲号；ἐπί可表示哀哭所针对或所缘由的对象。“因他哀哭”自然且保留原因与对象之间的语义张力。
- source_word: πᾶσαι αἱ φυλαὶ τῆς γῆς
  choice: 地上的万族
  rationale: “万族”兼具庄重与可读性，表达所有族群；“地上”在正文中体现本节普世范围，同时用脚注保留“那地”的可能。
- source_word: ναί, ἀμήν
  choice: 是的，阿们
  rationale: 保留双重确认及“阿们”的礼仪与宣告色彩。
theological_decisions:
- issue: πᾶσαι αἱ φυλαὶ τῆς γῆς中τῆς γῆς的范围
  choice: 正文译作“地上的万族”
  alternative: “那地的各支派”
  rationale: “每一只眼睛”的普遍表达及但以理异象背景支持普世范围；但本句也明显呼应《撒迦利亚书》12:10–12，那里可按语境理解为“那地”，故以脚注保留，不在正文中消除歧义。
- issue: ἐπ’ αὐτὸν所表达的哀哭关系
  choice: “因他哀哭”
  alternative: “为他哀哭”或“向他哀哭”
  rationale: 介词短语既可突出哀悼对象，也可带出因他而起的悲号；正文采用自然且较开放的“因他”，避免明确断定哀哭是悔改、惧怕或单纯哀悼。
translation_notes:
  register: 采用现代、庄重而易懂的宣告体。“看哪”和“阿们”保留经文的礼仪感；“每一只眼睛”维持原文具象表达。标点突出异象宣告及末尾双重确认。
