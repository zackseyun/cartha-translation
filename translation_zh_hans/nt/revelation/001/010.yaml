id: REV.1.10
reference: Revelation 1:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐγενόμην ἐν πνεύματι ἐν τῇ κυριακῇ ἡμέρᾳ, καὶ ἤκουσα ⸂ὀπίσω μου φωνὴν⸃ μεγάλην ὡς σάλπιγγος
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/010.yaml
  text: I came to be in the Spirit on the Lord’s day[a], and I heard behind me a loud voice like a trumpet[b],
translation:
  language: zh_hans
  text: 主日[a]那天，我在圣灵里[b]，听见身后有一个响亮的声音，如同号角，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“主的日子”，但可能性较小。这里的希腊文是“属于主的日子”，不同于通常表示末世性“主的日子”的说法。
    reason: alternative_reading
  - marker: b
    text: 或译“在灵里”。这句话可能表示他处在圣灵所赐的先知性感动之中；原文没有明确说他“进入恍惚状态”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγενόμην
  choice: 我在
  rationale: γίνομαι在此表示进入或处于某种状态。现代汉语若直译为“我成为在”并不自然；“我在圣灵里”简洁地表达该状态，而不额外加入“入了异象”或“魂游象外”等原文没有的内容。
- source_word: ἐν πνεύματι
  choice: 在圣灵里
  rationale: 《启示录》的异象叙事公式很可能指圣灵的感动或掌管；译作“在圣灵里”保留原有介词结构及神学含义，同时用脚注注明“在灵里”的可能，避免把它明确化为“入了迷”或“进入恍惚状态”。
- source_word: ἐν τῇ κυριακῇ ἡμέρᾳ
  choice: 主日那天
  rationale: κυριακός意为“属于主的”。“主日”是自然、简洁的现代汉语对应，也有别于通常表示末世性“主的日子”的希腊语结构；补入“那天”使句法自然。
- source_word: ἤκουσα
  choice: 听见
  rationale: 此处ἀκούω表示听觉感知，而非专心聆听；“听见”准确自然。
- source_word: ὀπίσω μου
  choice: 身后
  rationale: 上下文要求空间意义；“身后”比“在我后面”更凝练自然。
- source_word: φωνὴν μεγάλην
  choice: 一个响亮的声音
  rationale: μέγας修饰φωνή时在此表示音量或声势。“响亮的声音”符合现代汉语表达，并保留φωνή可指声音或说话声的宽度。
- source_word: ὡς σάλπιγγος
  choice: 如同号角
  rationale: 原文将声音与σάλπιγξ相比。“号角”比现代乐器名“喇叭”更符合古代语境，又不擅自增添“吹响”或“号声”等原文未明说的成分。
theological_decisions:
- issue: ἐν πνεύματι是指圣灵所赐的先知性状态，还是泛指“在灵里”
  choice: 正文译“在圣灵里”，并以脚注保留“在灵里”
  alternative: 在灵里；进入恍惚状态
  rationale: 《启示录》中这一短语很可能标示圣灵所引导的异象经验，但希腊文没有明确说“恍惚”或“出神”。正文采用最可能的所指，同时由脚注保存形式上的歧义。
- issue: κυριακῇ ἡμέρᾳ是每周的“主日”，还是末世性的“主的日子”
  choice: 主日
  alternative: 主的日子
  rationale: 形容词κυριακός自然表示“属于主的”，不同于新约中通常表示末世性“主的日子”的所有格结构。因此正文译为“主日”，脚注说明较不可能的另一理解，而不进一步断定具体是星期几。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“主日”沿用现代汉语基督教语境中已广为理解的表达；“在圣灵里”保留启示文学的神学张力。句末逗号反映本节在后文中继续引出声音所说的话。
