id: REV.1.11
reference: Revelation 1:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: λεγούσης· Ὃ βλέπεις γράψον εἰς βιβλίον καὶ πέμψον ταῖς ἑπτὰ ἐκκλησίαις, εἰς Ἔφεσον καὶ εἰς Σμύρναν καὶ εἰς Πέργαμον καὶ εἰς Θυάτειρα καὶ εἰς Σάρδεις καὶ εἰς Φιλαδέλφειαν καὶ εἰς Λαοδίκειαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/011.yaml
  text: 'saying[a], “What you see[b], write in a book and send it to the seven churches: to Ephesus and to Smyrna and to Pergamum and to Thyatira and to Sardis and to Philadelphia and to Laodicea.”'
translation:
  language: zh_hans
  text: 说：“你所看见的，要写在书卷[a]上，寄给七个教会：以弗所、士每拿、别迦摩、推雅推喇、撒狄、非拉铁非和老底嘉。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “书卷”也可译作“书册”或“文书”；希腊词βιβλίον可指卷轴，也可泛指书或书面文件。
    reason: lexical_alternative
lexical_decisions:
- source_word: λεγούσης
  choice: 说
  rationale: 这是阴性属格单数的现在主动分词，承接上一节的“声音”。汉语用“说”自然引出直接引语，又不在本节内强行补明说话者。
- source_word: Ὃ βλέπεις
  choice: 你所看见的
  rationale: 中性关系代词与现在时动词概括约翰正在异象中看见的内容；“你所看见的”自然、庄重，也保留其广泛所指。
- source_word: γράψον εἰς βιβλίον
  choice: 要写在书卷上
  rationale: γράψον是简明有力的命令；βιβλίον可指卷轴、书册或书面文件。“书卷”适合一世纪语境，又能让现代读者理解为成文记录；其材质形态上的歧义收入脚注。
- source_word: πέμψον
  choice: 寄给
  rationale: 该动词是“发送”的命令式。语境中所寄的是写成的书卷，汉语用“寄给”无需另补宾语，也能顺畅连接七个教会。
- source_word: ταῖς ἑπτὰ ἐκκλησίαις
  choice: 七个教会
  rationale: 这里指位于具体城市、接受信息的基督徒群体。“教会”是现代汉语中准确且通行的对应词，不限定任何宗派体制。
- source_word: εἰς Ἔφεσον … εἰς Λαοδίκειαν
  choice: 以弗所、士每拿、别迦摩、推雅推喇、撒狄、非拉铁非和老底嘉
  rationale: 采用现代中文圣经读者熟悉的传统地名译法。希腊文在每个城市前重复εἰς，表达逐一送达；汉语以冒号后的并列城市名单自然体现这一分配关系，避免机械重复“到”。
theological_decisions:
- issue: ἐκκλησίαις所指群体的性质
  choice: 教会
  alternative: 会众／集会
  rationale: 上下文所指是七座城市中具体的基督徒群体。“教会”准确传达其群体身份，同时不引入特定宗派的组织观。
translation_notes:
  register: 采用现代、庄重而易懂的命令句式。“要……，……”在汉语中保留了原文两个命令的力度。城市名称沿用简体中文圣经传统译名，以便辨识；正文不设置与中文无实际差异的英文拼写异读脚注。
