  text: Ἰωάννης ταῖς ἑπτὰ ἐκκλησίαις ταῖς ἐν τῇ Ἀσίᾳ· χάρις ὑμῖν καὶ εἰρήνη ⸀ἀπὸ ὁ ὢν καὶ ὁ ἦν καὶ ὁ ἐρχόμενος, καὶ ἀπὸ τῶν ἑπτὰ πνευμάτων ἃ ἐνώπιον τοῦ θρόνου αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/004.yaml
  text: 'John, to the seven churches in Asia: Grace to you and peace from him who is, and who was, and who is coming, and from the seven spirits who are before his throne,'
translation:
  language: zh_hans
  text: 约翰写信给亚细亚的七个教会：愿恩典、平安从那位今在、昔在、将要来的[a]，并从他宝座前的七灵[b]临到你们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可按较传统的方式译作“那位今在、昔在、以后要来的”。原文末项直译为“正在来的”或“要来的”。
    reason: lexical_alternative
  - marker: b
    text: “七灵”可能象征圣灵的完全或丰满，也可能指七位天上的灵；希腊原文作“七灵”。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰωάννης
  choice: 约翰
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: ταῖς ἑπτὰ ἐκκλησίαις
  choice: 写信给……七个教会
  rationale: ἐκκλησία在本书书信语境中指基督徒群体，“教会”是准确且通行的译法；补出“写信”使中文收信人结构自然。
- source_word: ἐν τῇ Ἀσίᾳ
  choice: 亚细亚
  rationale: 这里指罗马帝国的亚细亚行省，并非现代所说的亚洲；采用“亚细亚”可避免地理误解。
- source_word: χάρις ὑμῖν καὶ εἰρήνη
  choice: 愿恩典、平安……临到你们
  rationale: 将希腊文省略谓语的书信祝福语化为自然中文，同时保留“恩典”和“平安”的次序。
- source_word: ἀπὸ ὁ ὢν καὶ ὁ ἦν καὶ ὁ ἐρχόμενος
  choice: 从那今在、昔在、将要来的
  rationale: 保留三个并列的神圣称号和时间张力；“将要来的”表达ὁ ἐρχόμενος的动态来临含义。
- source_word: τῶν ἑπτὰ πνευμάτων
  choice: 七灵
  rationale: 忠实保留希腊文复数及数字“七”，不在正文中把它解释为“七重的灵”或直接认定为圣灵。
- source_word: ἃ ἐνώπιον τοῦ θρόνου αὐτοῦ
  choice: 他宝座前的
  rationale: 以简洁、自然的中文定语结构表达其位于宝座面前；“他”承接前述神圣称号。
theological_decisions:
- issue: “今在、昔在、将要来的”所指及表达方式
  choice: 作为对上帝的神圣称号，译作“那今在、昔在、将要来的”
  alternative: “那昔在、今在、以后永在的”或“那今在、昔在、以后要在的”
  rationale: 原文最后一项是“来”的现在分词，不只是“存在”；所选译法保留再临或临到的动态含义，也不修平原文刻意不规则的称号结构。
- issue: “七灵”的身份
  choice: 正文保留“七灵”
  alternative: 象征圣灵的完全或丰满；或指上帝宝座前的七位天上灵体
  rationale: 希腊文明确为复数“七灵”，但具体所指有争议；正文不替读者解决这一神学张力，脚注列出主要理解。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“亚细亚”用来明确古罗马行省名称；祝福句补出“愿……临到你们”，使中文完整自然。正文保留“七灵”的歧义，并以脚注说明主要解释。
