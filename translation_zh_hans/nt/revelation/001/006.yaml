  text: καὶ ἐποίησεν ἡμᾶς βασιλείαν, ἱερεῖς τῷ θεῷ καὶ πατρὶ αὐτοῦ— αὐτῷ ἡ δόξα καὶ τὸ κράτος εἰς τοὺς αἰῶνας ⸂τῶν αἰώνων⸃· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/006.yaml
  text: and made us a kingdom[a], priests to his God and Father—to him be the glory and the dominion forever and ever[b]. Amen.
translation:
  language: zh_hans
  text: 又使我们成为国度[a]，作他的上帝和父的祭司——愿荣耀和权能归给他，直到永永远远[b]。阿们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些较晚的抄本读作“君王和祭司”，而不是“国度、祭司”。正文依照所提供的希腊文本。
    reason: textual_variant
  - marker: b
    text: 更直译可作“直到万世的万世”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησεν
  choice: 使……成为
  rationale: 不把不定过去时强行解释为强调持续结果；结合宾语补足结构，用“使我们成为”自然表达已成就的行动。
- source_word: βασιλείαν
  choice: 国度
  rationale: 原文是单数名词“国度、王国”，不是“君王”；保留群体性的身份，也呼应《出埃及记》19:6的背景。
- source_word: ἱερεῖς
  choice: 祭司
  rationale: 直接保留其敬拜、事奉与圣约身份的含义。
- source_word: τῷ θεῷ καὶ πατρὶ αὐτοῦ
  choice: 作他上帝和父的祭司
  rationale: 以“作……的祭司”自然表达与格所指的归属和事奉对象；“他”同时关联“上帝”和“父”，不淡化原文的关系性表述。
- source_word: αὐτῷ
  choice: 归给他
  rationale: 汉语颂赞语通常补出“归给”，自然表达原文无系词的归属式颂赞。
- source_word: δόξα
  choice: 荣耀
  rationale: 这是颂赞语境中准确而通行的对应词。
- source_word: κράτος
  choice: 权能
  rationale: 表达强有力、施行统治的能力；较笼统的“能力”更符合颂赞语境，又避免把词义收窄为制度性的“统治权”。
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: 直到永永远远
  rationale: 以现代汉语中自然庄重的惯用语表达无尽的持续时间，同时在脚注保留原文形式。
- source_word: ἀμήν
  choice: 阿们
  rationale: 保留已进入汉语基督教用语的礼仪性确认语。
theological_decisions:
- issue: “他的上帝和父”的所指与关系
  choice: 保留“他上帝和父”的表述，其中“他”按上下文指耶稣基督。
  alternative: 译作“上帝，就是他的父”，或将其简化为“父上帝”。
  rationale: 最近的上下文先行词是耶稣基督。直译其关系性措辞，既不消解位格区分，也不借译文额外规定“上帝”与“父”之间的句法关系。
- issue: 群体身份的性质
  choice: 正文译作“国度，……祭司”。
  alternative: 译作“君王和祭司”。
  rationale: 所给希腊文本读作单数 βασιλείαν（国度）和复数 ἱερεῖς（祭司），因此正文应保留群体作为“国度”的身份，不采用后期抄本的“君王”读法。
- issue: 颂赞对象
  choice: “愿荣耀和权能归给他”中的“他”按句法承接前文的耶稣基督。
  alternative: 将“他”明确改写为“上帝”或“父”。
  rationale: 原文仅用代词，正文保留其连贯指向，不以解释性名词替换，从而不消除原文可能引发的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“使我们成为国度，作……的祭司”保留原文两个宾语成分的紧密关系；破折号标出由陈述转入颂赞。脚注标记按其实际所注释的词语重新对应：抄本异文置于“国度”后，直译形式置于“永永远远”后。
