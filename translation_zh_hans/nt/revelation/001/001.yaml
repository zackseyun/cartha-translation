  to: 耶稣基督的启示[a]，是上帝赐给他的，好让他把那些不久必发生的事[b]指示给他的奴仆；他借着差遣自己的天使，把这启示指示给他的奴仆约翰[c][d]，
  rationale: 修订只处理汉语句法和主要动词关系：以“是上帝赐给他的”连结关系从句，并以“好让他”明确展示动作属于耶稣。后半句以“借着差遣自己的天使”表达ἀποστείλας的方式／手段关系；脚注d改为不遗漏ἐσήμανεν的替代句式。没有改变原文的属格歧义、时间语义、称谓或神学张力。
