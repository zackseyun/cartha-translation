id: REV.1.1
reference: Revelation 1:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ἀποκάλυψις Ἰησοῦ Χριστοῦ, ἣν ἔδωκεν αὐτῷ ὁ θεὸς δεῖξαι τοῖς δούλοις αὐτοῦ, ἃ δεῖ γενέσθαι ἐν τάχει, καὶ ἐσήμανεν ἀποστείλας διὰ τοῦ ἀγγέλου αὐτοῦ τῷ δούλῳ αὐτοῦ Ἰωάννῃ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/001.yaml
  text: The revelation of Jesus the Messiah[a], which God gave him to show his slaves what must happen soon, and he made it known by sending it through his angel to his slave John[d][c][b],
translation:
  language: zh_hans
  text: 耶稣基督的启示[a]，是上帝赐给他的，好让他把那些不久必发生的事[b]指示给他的奴仆；他借着差遣自己的天使，把这启示指示给他的奴仆约翰[c][d]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“来自耶稣基督的启示”或“关于耶稣基督的启示”。希腊语的属格在这里可以有不止一种理解。
    reason: alternative_reading
  - marker: b
    text: “不久”也可译作“很快”或“迅速”。原文既可能指这些事即将发生，也可能指一旦开始便迅速发生。
    reason: lexical_alternative
  - marker: c
    text: “指示”也可译作“使人知道”；原文用词也可能含有借记号或象征来传达的意味。
    reason: lexical_alternative
  - marker: d
    text: 本句也可译作：“他把这启示指示出来，是借着差遣自己的天使给他的奴仆约翰。”
    reason: translation_alternative
lexical_decisions:
- source_word: Ἀποκάλυψις
  choice: 启示
  rationale: 表示揭开、披露而使人知晓；“启示”是现代汉语中自然、庄重且符合本书文类的通行译法。
- source_word: Ἰησοῦ Χριστοῦ
  choice: 耶稣基督的
  rationale: “基督”在现代中文圣经语境中是 Χριστός 作为称号的标准表达；“的”保留希腊语属格可能表示来源、内容或归属的多重关系。
- source_word: ἣν ἔδωκεν αὐτῷ ὁ θεὸς
  choice: 上帝把这启示赐给他
  rationale: 明确补出关系代词所指的“这启示”，同时保留上帝与耶稣之间的叙述区分，不添加神学解释。
- source_word: δεῖξαι
  choice: 指给……看
  rationale: 以自然汉语表达“展示、给人看”的目的意义，也契合异象语境。
- source_word: τοῖς δούλοις αὐτοῦ / τῷ δούλῳ αὐτοῦ
  choice: 他的奴仆 / 他的奴仆
  rationale: “奴仆”比单纯的“仆人”更能保留 δοῦλος 所含的隶属关系，同时比“奴隶”更适合本节庄重的宗教语域。
- source_word: ἃ δεῖ γενέσθαι
  choice: 那些……必发生的事
  rationale: “必”传达非人称 δεῖ 所表达的必要性，“那些……的事”自然对应中性复数关系结构。
- source_word: ἐν τάχει
  choice: 不久
  rationale: 在此首先按时间临近理解；“很快、迅速”的可能意义收入脚注。
- source_word: ἐσήμανεν
  choice: 指示
  rationale: 既可表示使人知道，也保留借象征或记号传达的潜在意味，适合《启示录》的象征性文体。
- source_word: ἀποστείλας διὰ τοῦ ἀγγέλου αὐτοῦ
  choice: 差遣他的天使，把这启示……
  rationale: 将希腊语分词表达的手段关系转成自然汉语，同时保留天使作为传达中介。
- source_word: Ἰωάννῃ
  choice: 给……约翰
  rationale: 以介词结构自然表达与格所标示的领受者。
theological_decisions:
- issue: Ἀποκάλυψις Ἰησοῦ Χριστοῦ 中属格的关系
  choice: 译作“耶稣基督的启示”，不在正文中限定为单一关系
  alternative: “来自耶稣基督的启示”或“关于耶稣基督的启示”
  rationale: 希腊语属格既可指启示来自耶稣基督，也可指启示以他为内容；上下文虽突出上帝把启示赐给他，却不足以排除其他层面。
- issue: δοῦλος 的身份与隶属意味
  choice: 奴仆
  alternative: 仆人；奴隶
  rationale: “奴仆”兼顾现代可懂性、庄重语域和对主人之隶属的语义，不把它弱化为普通受雇服务者，也不额外强化古代法律身份的细节。
- issue: ἐσήμανεν 是否强调以象征传达
  choice: 正文译“指示”，脚注说明其语义幅度
  alternative: 使人知道；借记号表明
  rationale: 不把“以象征传达”确定为动词在此唯一的含义，但保留与全书象征性表达相呼应的可能性。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“启示”“上帝”“天使”“奴仆”等词保持圣经语域，但避免古奥句式。正文按汉语习惯拆分和重组希腊语长句；末尾保留逗号，以反映原文句子在下一节继续。
