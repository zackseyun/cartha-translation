id: REV.1.8
reference: Revelation 1:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ἐγώ εἰμι τὸ Ἄλφα καὶ τὸ Ὦ, λέγει κύριος, ὁ θεός, ὁ ὢν καὶ ὁ ἦν καὶ ὁ ἐρχόμενος, ὁ παντοκράτωρ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/008.yaml
  text: “I am the Alpha and the Omega,” says the Lord God[a], “the one who is and who was and who is coming, the Almighty.”
translation:
  language: zh_hans
  text: “我是阿尔法和欧米伽，”主上帝说，“是那位今在、昔在、正在来临的[a]，是全能者。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“将要来的”。
    reason: ἐρχόμενος 可按现在分词直译为“正在来临的”，也可按其指向未来来临的语义译为“将要来的”。
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: 我是
  rationale: 以现代汉语自然表达带强调意味的第一人称自我宣告；不另加“我自己”，以免过度翻译主语代词的强调。
- source_word: τὸ Ἄλφα καὶ τὸ Ὦ
  choice: 阿尔法，也是欧米伽
  rationale: 保留希腊字母的名称及其启示文学中的象征意味，不以汉语拼音或拉丁字母替代；“也是”自然呈现两项并列而同属说话者。
- source_word: λέγει κύριος, ὁ θεός
  choice: 主上帝说
  rationale: κύριος 与 ὁ θεός 在此共同构成神圣称号；“主上帝”庄重、清楚，也符合现代汉语圣经语体。现在时 λέγει 按引语公式自然译为“说”。
- source_word: ὁ ὢν καὶ ὁ ἦν καὶ ὁ ἐρχόμενος
  choice: 那位今在、昔在、正在来临的
  rationale: 用“那位”承接三个带冠词的描述，并保留三重结构。“正在来临”直接反映 ἐρχόμενος 的现在分词形式和动态意味，而不把它静态化为单纯的未来存在。
- source_word: ὁ παντοκράτωρ
  choice: 全能者
  rationale: 这是 παντοκράτωρ 在神圣称号语境中的自然、庄重译法，兼顾能力与至高统治的含义，避免生硬的“统管万有者”。
theological_decisions:
- issue: 神的自称与末世来临之间的关系
  choice: 正在来临的
  alternative: 将要来的
  rationale: 希腊文 ὁ ἐρχόμενος 是现在分词，“正在来临”较直接保留其进行性和主动临近的张力；“将要来的”也是合宜的时间性表达，故列入脚注，而不在正文中排除。
- issue: ὁ παντοκράτωρ 与前三重描述的句法关系
  choice: 是那位今在、昔在、正在来临的，是全能者
  alternative: 那位今在、昔在、正在来临的全能者
  rationale: 分别用“是”呈现相继的神圣称谓，使其同位并列关系清楚，同时避免在汉语中把“全能者”仅仅处理成前一描述的普通中心名词。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“阿尔法”“欧米伽”保留希腊字母名称；“今在、昔在”略带庄严凝练色彩，但在现代语境中仍清楚可懂，并与“正在来临”形成整齐的三重表达。
