id: REV.1.15
reference: Revelation 1:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ οἱ πόδες αὐτοῦ ὅμοιοι χαλκολιβάνῳ, ὡς ἐν καμίνῳ ⸀πεπυρωμένης, καὶ ἡ φωνὴ αὐτοῦ ὡς φωνὴ ὑδάτων πολλῶν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/015.yaml
  text: and his feet were like burnished bronze[a], as if refined in a furnace, and his voice was like the sound of many waters[b],
translation:
  language: zh_hans
  text: 他的双脚好像在炉中烧炼得发亮的铜[a]；他的声音如同众水的响声[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “发亮的铜”所译的希腊词十分罕见，确切所指不明，可能是精炼后发亮或灼热发光的铜或铜合金；也可译作“精铜”或“光洁的铜”。
    reason: lexical_alternative
  - marker: b
    text: 较直译作“众水的声音”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πόδες
  choice: 脚
  rationale: πούς通常指“脚”；这里直接保留异象对身体部位的描写，不扩展为“腿”。
- source_word: χαλκολιβάνῳ
  choice: 光亮的铜
  rationale: χαλκολίβανον是罕见且所指不完全确定的金属名称，可能指经过精炼、闪耀发光的铜或铜合金。“光亮的铜”既传达视觉效果，也避免武断指定其确切成分。
- source_word: ὡς ἐν καμίνῳ πεπυρωμένης
  choice: 好像在炉中烧炼得
  rationale: κάμινος指炉或熔炼炉；πυρόομαι可表达经火烧热、锻炼或精炼。此译保留ὡς的比拟语气和冶炼意象。
- source_word: φωνή
  choice: 声音
  rationale: 第一个φωνή明确属于“他”，译作“声音”自然并保留其个人发声的含义。
- source_word: ὡς φωνὴ ὑδάτων πολλῶν
  choice: 如同众水的响声
  rationale: 第二个φωνή在比喻中指可听见的声响，译作“响声”符合现代汉语；“众水”则保留原文广阔而未限定为海浪、瀑布等具体景象的圣经意象。
theological_decisions:
- issue: 末句重复使用φωνή的译法
  choice: 他的声音如同众水的响声
  alternative: 他的声音如同众水的声音
  rationale: 主句用“声音”指异象中那一位的声音，比喻部分用“响声”表达众水发出的声势，现代汉语较为顺畅，同时不把意象缩窄为“怒吼”“海啸”或某种特定自然现象。较直译的重复形式列入脚注。
- issue: χαλκολίβανον所指金属的不确定性
  choice: 光亮的铜
  alternative: 精铜；黄铜；闪耀的金属合金
  rationale: 原词极其罕见，无法确定具体冶金成分。正文呈现其明亮、经火烧炼的视觉特征，脚注保留词义范围，避免赋予异象超出原文证据的特殊材质含义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“烧炼”承接炉火和金属加工的意象；分号使两个并列的异象特征层次清楚。正文不具体化“众水”为海浪或瀑布，以保留原文意象的开放性。
