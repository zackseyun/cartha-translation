id: REV.1.3
reference: Revelation 1:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: μακάριος ὁ ἀναγινώσκων καὶ οἱ ἀκούοντες τοὺς λόγους τῆς προφητείας καὶ τηροῦντες τὰ ἐν αὐτῇ γεγραμμένα, ὁ γὰρ καιρὸς ἐγγύς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/003.yaml
  text: Blessed is the one who reads aloud[a], and those who hear the words of this prophecy and keep what is written in it[b], for the time is near.
translation:
  language: zh_hans
  text: 诵读[a]这预言的话语的人，和听见这预言的话语、又遵守其中所记内容的人，都有福了，因为时候近了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“读”。希腊文很可能指聚会中公开诵读的人，因此正文译作“诵读”。
    reason: lexical_alternative
  - marker: b
    text: “时候”也可译为“指定的时候”。
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριος
  choice: 有福的
  rationale: 采用现代中文圣经中自然且庄重的祝福语体，表达从神而来的福分，不缩减为主观的快乐或世俗的幸运。
- source_word: ὁ ἀναγινώσκων
  choice: 诵读……的人
  rationale: 单数诵读者与复数听众相对，强烈暗示会众中的公开宣读；“诵读”自然包含出声宣读，同时不像“朗读”那样偏日常课堂语体。
- source_word: οἱ ἀκούοντες
  choice: 听见……的人
  rationale: 保留ἀκούω的基本听闻意义，并与公开诵读的场景相配；随后的“遵守”明确表达回应与顺服。
- source_word: τοὺς λόγους τῆς προφητείας
  choice: 这预言之话
  rationale: 保留λόγους的“话”而不泛化为“信息”；“这”按上下文指本书中的预言。“之”使短语庄重而仍为现代读者所熟悉。
- source_word: τηροῦντες
  choice: 遵守
  rationale: 此处指忠实持守并实行所写的内容；“遵守”比单用“守住”更自然，也不把含义局限为保管文字。
- source_word: τὰ ἐν αὐτῇ γεγραμμένα
  choice: 其中所记之事
  rationale: 自然表达中性复数结构，兼顾“写下并持续成文”的完成时结果；“其中”回指这预言。
- source_word: ὁ γὰρ καιρὸς
  choice: 因为那时候
  rationale: καιρός可指关键或指定的时刻；“那时候”在中文中自然保留其特定性，而不额外断定具体的末世时间表。
- source_word: ἐγγύς
  choice: 近了
  rationale: 直接表达时间上的临近，简洁有力，并保留原文关于迫近性的张力。
theological_decisions:
- issue: 单数诵读者与复数听众所暗示的公开宣读场景
  choice: 译为“诵读……的人”，体现出声向会众宣读的可能场景。
  alternative: 译为“读……的人”，不明确表达出声宣读。
  rationale: 原文用单数分词指诵读者、用复数指听众，最自然地指向聚会中的公开宣读；正文如此表达不加入宗派性内容，脚注同时保留较宽的词义。
- issue: μακάριος与单数、复数对象的句法关系
  choice: 将“都是有福的”置于两类人之后，明确福分同时适用于诵读者和听见且遵守的人。
  alternative: 依照希腊语词序直译为“有福的是那诵读的人和那些听见……的人”。
  rationale: 希腊语虽以阳性单数μακάριος起句，却由καί连接单数诵读者和复数听众；中文后置谓语更自然，也忠实呈现两类人均蒙福的意义。
- issue: καιρός ἐγγύς的末世论力度
  choice: 译为“那时候近了”，不说明其应验方式或具体日期。
  alternative: 译为“指定的时候近了”或按某一末世体系解释其临近。
  rationale: 原文断言关键时刻临近，却未在本节界定具体时间表；译文应保留这种迫近感及其解释张力。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。“诵读”与“听见”呈现启示录原初的公开宣读场景；“这预言之话”“其中所记之事”略带经文庄重感，但避免艰深古语。所有脚注标记均已置于正文对应位置。
