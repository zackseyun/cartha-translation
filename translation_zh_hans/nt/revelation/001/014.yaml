source:
  edition: SBLGNT
  text: ἡ δὲ κεφαλὴ αὐτοῦ καὶ αἱ τρίχες λευκαὶ ὡς ἔριον λευκόν, ὡς χιών, καὶ οἱ ὀφθαλμοὶ αὐτοῦ ὡς φλὸξ πυρός,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/014.yaml
  text: His head and hair were white[a], like white wool, like snow, and his eyes were like a flame of fire[b],
translation:
  language: zh_hans
  text: 他的头和头发都白得像白羊毛，像雪；他的眼睛像火焰[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 这一意象呼应《但以理书》7:9，凸显这是异象中的描写。
    reason: 交叉经文与文学背景
lexical_decisions:
- source_word: δὲ
  choice: 不单独译出
  rationale: 这是轻微的连接词，在连续的异象描写中可由汉语语序和标点自然承接；不增添原文没有的明确时间含义。
- source_word: ἡ κεφαλὴ αὐτοῦ καὶ αἱ τρίχες
  choice: 他的头和头发
  rationale: 按原文并列结构直译；“头发”符合现代汉语集合名词的习惯。
- source_word: λευκαὶ
  choice: 洁白
  rationale: 保留白色意象；“洁白”在异象描写中自然而庄重，但不在正文中解释其象征意义。
- source_word: ὡς ἔριον λευκόν
  choice: 如同白羊毛
  rationale: 明确保留比喻，并准确表达形容词 λευκόν 修饰“羊毛”。
- source_word: ὡς χιών
  choice: 如同雪
  rationale: 保留第二重比喻及累积强化的洁白意象。
- source_word: οἱ ὀφθαλμοὶ αὐτοῦ
  choice: 他的眼睛
  rationale: 采用标准、自然的身体部位表达。
- source_word: ὡς φλὸξ πυρός
  choice: 如同火焰
  rationale: 现代汉语中“火焰”已经完整表达 φλὸξ πυρός 的意象；避免生硬重复为“火的火焰”，同时保留明确比喻。
theological_decisions:
- issue: 对得荣耀之人子的象征性描写
  choice: 正文按原文保留异象中的比喻，不解释白发或火焰所象征的具体教义。
  alternative: 在正文中增译纯洁、永恒、审判或洞察等象征含义。
  rationale: 本节给出视觉意象，却未在此处明说其解释；保留意象可避免把某一神学阐释写入正文。
- issue: 头与头发之“白”的句法范围
  choice: 译为“他的头和头发洁白”，使“洁白”同时述说头和头发。
  alternative: 理解为“他的头，连同头发，都白得如同白羊毛、如同雪”，或把后面的比喻主要联系于头发。
  rationale: 希腊文以单一复数谓语形容词 λευκαὶ 配合并列主语，语法上涵盖二者；同时原句略显压缩，故以脚注保留较贴近其结构的另一种表述。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“如同”保留启示文学中连续比喻的节奏；分号清楚区分头发与眼睛两组描写。所有象征解释均留在正文之外。
