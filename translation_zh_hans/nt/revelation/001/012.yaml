  naturalness: 建议采用“我转身要看那正在同我说话的声音；我转过身来，就看见七个金灯台。”这保留原文刻意的“看声音”表达和转身的重复，同时在现代标准汉语中更顺畅、庄重。
  terminology: “灯台”准确对应 λυχνία，且应与启示录1:20保持一致。“金灯台”可自然表达 χρυσᾶς；“同我说话”自然传达 μετά 加属格的“与我”措辞，脚注可说明“对我说话”的常用替代说法。
