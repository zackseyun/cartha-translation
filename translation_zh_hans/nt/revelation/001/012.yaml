  text: ⸀Καὶ ἐπέστρεψα βλέπειν τὴν φωνὴν ἥτις ἐλάλει μετ’ ἐμοῦ· καὶ ἐπιστρέψας εἶδον ἑπτὰ λυχνίας χρυσᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/012.yaml
  text: And I turned to see the voice that was speaking with me[a], and when I turned, I saw seven golden lampstands,
translation:
  language: zh_hans
  text: 我转身要看那正在同我说话的声音[a]；我转过身来，就看见七个金灯台。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“对我说话。”希腊原文直译为“同我说话”。
    reason: 词义替代：现代汉语常说“对我说话”；正文的“同我说话”保留希腊语 μετά 加属格所表达的“与／同”之意。
lexical_decisions:
- source_word: ἐπέστρεψα
  choice: 我转过身来
  rationale: 这里指身体转向；“转过身来”符合现代汉语，也比单说“转向”更清楚地呈现动作。
- source_word: βλέπειν
  choice: 要看看
  rationale: 不定式说明转身的目的，即要察看声音从何而来；“要看看”自然地表达这一目的，同时保留“看”的感官反常搭配。
- source_word: τὴν φωνὴν
  choice: 那……声音
  rationale: 上下文明确是说话者的声音，因此译作“声音”而非泛指“声响”；保留“看声音”这一原文中引人注目的表达，不改写成“看是谁”。
- source_word: ἥτις
  choice: 那……的
  rationale: 以汉语关系结构“那与我说话的声音”自然承接修饰关系，无须为该关系代词另加解释。
- source_word: ἐλάλει μετ’ ἐμοῦ
  choice: 与我说话
  rationale: 未完成时态体现当时持续进行的说话动作；μετά加属格字面表达伴随或交往关系，译为“与我说话”可保留这一措辞。
- source_word: ἐπιστρέψας
  choice: 转过来以后
  rationale: 不定过去时分词表示先于“看见”的动作；“以后”清楚体现先转身、后看见的次序。
- source_word: εἶδον
  choice: 就看见
  rationale: 译出直接的视觉感知；“就”自然衔接转身后的结果，但不额外增添事件内容。
- source_word: ἑπτὰ
  choice: 七座
  rationale: 数词直译为“七”，并按汉语习惯为灯台使用量词“座”。
- source_word: λυχνίας
  choice: 灯台
  rationale: 该词指承放灯盏的台架，而不是灯本身；“灯台”也与本章后文对这一象征的解释保持术语一致。
- source_word: χρυσᾶς
  choice: 金
  rationale: 在“金灯台”中，“金”自然表达由金制成或具有金质特征，简洁而庄重。
theological_decisions:
- issue: 启示异象中 λυχνίας 所指的具体物件
  choice: 灯台
  alternative: 灯
  rationale: 原词指支撑灯盏的台架，且启示录1:20随后解释七个灯台的象征意义；译作“灯”会混淆物件并削弱前后呼应。
- issue: 是否解释“看声音”这一不寻常表达
  choice: 保留“看看……声音”
  alternative: 意译为“看看是谁在说话”或“看看声音从哪里来”
  rationale: 原文把“声音”直接作为 βλέπειν 的宾语，形成刻意而鲜明的表达。正文不替作者消解这一张力，以免加入原文没有明说的对象或方位。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“我转过身来……转过来以后”保留原文对转身动作的重复；“七座金灯台”使用现代汉语常见量词，并维持启示录本章关键意象的一致性。
