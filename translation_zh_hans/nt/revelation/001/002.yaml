source:
  edition: SBLGNT
  text: ὃς ἐμαρτύρησεν τὸν λόγον τοῦ θεοῦ καὶ τὴν μαρτυρίαν Ἰησοῦ Χριστοῦ, ὅσα εἶδεν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/002.yaml
  text: who testified to the word of God and to the testimony of Jesus the Messiah[a], all that he saw.
translation:
  language: zh_hans
  text: 他为上帝的话和耶稣这位弥赛亚的见证[a]作了见证，就是他所看见的一切。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“来自耶稣这位弥赛亚的见证”或“关于耶稣这位弥赛亚的见证”。希腊原文两种意思都可能。
    reason: 原文属格结构存在真实歧义，可能表示见证的来源，也可能表示见证的对象。
lexical_decisions:
- source_word: ἐμαρτύρησεν
  choice: 作了见证
  rationale: 保留法庭与见证人的语义，也与名词 μαρτυρίαν 的“见证”形成同源呼应；过去时由“了”自然表达。
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: 上帝的话
  rationale: λόγος 在此指上帝所传达的话语或启示；“上帝的话”既贴近原文，也是现代汉语中自然稳定的圣经表达。
- source_word: τὴν μαρτυρίαν
  choice: 见证
  rationale: 与动词 ἐμαρτύρησεν 对应，保留原文的词根联系；在“为……作见证”的结构中语义清楚。
- source_word: Ἰησοῦ Χριστοῦ
  choice: 耶稣这位弥赛亚
  rationale: 将 Χριστός 按仍具称号意义的“弥赛亚”处理；加入“这位”使称号与人名的关系符合现代汉语表达，避免把“弥赛亚”误读为姓氏。
- source_word: ὅσα εἶδεν
  choice: 他所看见的一切
  rationale: ὅσα 具有概括全部内容的意味；此译法保留其作为前述两个宾语之总结性同位说明的功能。
theological_decisions:
- issue: Ἰησοῦ Χριστοῦ 在 μαρτυρίαν 之后的属格歧义
  choice: 正文译作“耶稣这位弥赛亚的见证”，不判定是耶稣所作的见证，还是关于耶稣的见证
  alternative: “来自耶稣这位弥赛亚的见证”或“关于耶稣这位弥赛亚的见证”
  rationale: 希腊语属格既可能是主语属格，也可能是宾语属格；原文没有强制排除其中一种，故正文保留张力，并以脚注说明。
- issue: Χριστοῦ 是称号还是名称化形式
  choice: 弥赛亚
  alternative: 基督
  rationale: 本段中称号意义仍然鲜明；译作“弥赛亚”直接传达受膏者称号的含义，而“这位”使汉语表达自然。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“作了见证”兼顾原文的见证语义和汉语习惯；“也就是”明确 ὅσα εἶδεν 对前文内容的总结关系。正文脚注标记与脚注条目一致。
