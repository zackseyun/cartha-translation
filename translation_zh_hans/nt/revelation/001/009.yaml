id: REV.1.9
reference: Revelation 1:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ἐγὼ Ἰωάννης, ὁ ἀδελφὸς ὑμῶν καὶ ⸀συγκοινωνὸς ἐν τῇ θλίψει καὶ βασιλείᾳ καὶ ὑπομονῇ ⸀ἐν Ἰησοῦ, ἐγενόμην ἐν τῇ νήσῳ τῇ καλουμένῃ Πάτμῳ διὰ τὸν λόγον τοῦ θεοῦ ⸀καὶ τὴν μαρτυρίαν ⸀Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/009.yaml
  text: I[a], John, your brother and fellow participant in the tribulation and kingdom and endurance in Jesus, was on the island called Patmos because of the word of God and the testimony of Jesus.
translation:
  language: zh_hans
  text: 我约翰，是你们的弟兄，也是在耶稣里与你们一同有分于患难、国度和忍耐的；我因上帝的话和耶稣的见证[a]，在那名叫拔摩的海岛上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“关于耶稣的见证。”希腊语属格既可指耶稣所作的见证，也可指关于耶稣的见证。
    reason: 保留原文属格结构的真实歧义。
lexical_decisions:
- source_word: συγκοινωνός
  choice: 一同经历……的
  rationale: 该词表示共同有分、共同参与。结合后接的“患难、国度和忍耐”，译为“一同经历……的”符合现代汉语，也清楚表达约翰与读者共同有分。
- source_word: ἐν τῇ θλίψει καὶ βασιλείᾳ καὶ ὑπομονῇ
  choice: 经历患难、国度和忍耐
  rationale: 保留三个并列名词及其共同参与的关系。“患难”符合启示文学语境中 θλῖψις 的分量；“忍耐”简洁对应 ὑπομονή，不额外加入“耐心”等解释成分。
- source_word: ἐν Ἰησοῦ
  choice: 在耶稣里
  rationale: 保留原文紧凑的神学表达，并使其统摄前面的共同参与以及后列的患难、国度和忍耐，不扩译为“与耶稣联合”。
- source_word: ἐγενόμην ἐν τῇ νήσῳ
  choice: 到了……海岛上
  rationale: γίνομαι 在此可表达身处或来到某地。中文“到了……海岛上”自然，并保留了状态形成的意味；原文未交代具体到达方式。
- source_word: τῇ καλουμένῃ Πάτμῳ
  choice: 名叫拔摩的
  rationale: 以现代汉语常用的定语结构表达“被称为拔摩”，并采用该地名通行译法“拔摩”。
- source_word: διὰ τὸν λόγον τοῦ θεοῦ
  choice: 因上帝的话
  rationale: διά 加宾格表示原因。“因”简洁自然，并不进一步断定约翰是因传讲、持守还是受逼迫而到岛上。
- source_word: τὴν μαρτυρίαν Ἰησοῦ
  choice: 耶稣的见证
  rationale: 属格 Ἰησοῦ 可能是主词属格，即耶稣所作的见证，也可能是受词属格，即关于耶稣的见证。主文保留“耶稣的见证”的形式歧义，脚注说明另一理解。
- source_word: ἀδελφὸς ὑμῶν
  choice: 你们的弟兄
  rationale: 直接表达约翰与读者之间属灵家人的连带关系；因约翰是在指自己，无须作性别中和扩译。
theological_decisions:
- issue: μαρτυρίαν Ἰησοῦ 中属格的歧义
  choice: 主文译作“耶稣的见证”
  alternative: “关于耶稣的见证”
  rationale: 原文既可能指耶稣所作的见证，也可能指以耶稣为内容的见证。主文不替读者裁定，脚注保留另一种合理理解。
- issue: ἐν Ἰησοῦ 与并列三项的关系
  choice: 译作“在耶稣里一同经历患难、国度和忍耐”
  alternative: 仅将“在耶稣里”与“忍耐”相连
  rationale: 从语序和结构看，该介词短语最自然地限定整个并列组合，说明这三方面的共同参与都与耶稣相关。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“我约翰”保留原文自我介绍的强调；“患难、国度和忍耐”保持并列张力，不将“国度”解释性改写为“盼望进入国度”。脚注标记 [a] 已置于主文对应短语之后。
