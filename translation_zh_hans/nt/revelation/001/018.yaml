id: REV.1.18
reference: Revelation 1:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ὁ ζῶν— καὶ ἐγενόμην νεκρὸς καὶ ἰδοὺ ζῶν εἰμι εἰς τοὺς αἰῶνας τῶν ⸀αἰώνων— καὶ ἔχω τὰς κλεῖς τοῦ θανάτου καὶ τοῦ ᾅδου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/018.yaml
  text: and the Living One—I became dead[a], and behold[c][b], I am alive forever and ever—and I have the keys of death and of Hades.
translation:
  language: zh_hans
  text: 又是那位活着的——我曾死去[a]；看哪，我活着，直到永永远远[b]，并且我有死亡和阴间的钥匙[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较直译为“我成为死的”；希腊语着重表示进入死亡的转变。
    reason: lexical_alternative
  - marker: b
    text: 希腊语直译为“直到万世万代”，是表示无尽延续的惯用语。
    reason: lexical_alternative
  - marker: c
    text: “阴间”指死人所在的领域，并非专指最终受刑罚之地。
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ζῶν
  choice: 那位永活者
  rationale: 带冠词的现在分词在这里名词化，用作称号。“永活者”以自然、庄重的现代汉语保留其称号性质；“永”也与上下文所宣告的无尽生命相呼应，而不是把它弱化为普通的“活着的人”。
- source_word: ἐγενόμην νεκρός
  choice: 我曾死去
  rationale: γίνομαι与表语形容词连用，着重从生命进入死亡的转变。“死去”比“是死的”更自然，也比单纯状态性的“死过”更能体现这一动态。
- source_word: ἰδού
  choice: 看哪
  rationale: 保留希腊语提示听者注意的强烈指示和感叹作用，同时符合《启示录》庄重而鲜明的语体。
- source_word: ζῶν εἰμι
  choice: 我活着
  rationale: 以自然汉语表达分词加εἰμί所表示的持续现状，并与前面的“死去”形成直接对照；不额外加入原文没有明说的“复活”或“又”。
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: 直到永永远远
  rationale: 这是表达无尽延续的强调性惯用语。“永永远远”既为现代读者所懂，也保留原文层叠强化的修辞效果。
- source_word: κλεῖς
  choice: 钥匙
  rationale: 采用直接对应词；在本段意象中，钥匙表示开启、关闭以及掌管的权柄。
- source_word: τοῦ θανάτου
  choice: 死亡
  rationale: 直接译出属格，不擅自把死亡明确人格化。
- source_word: τοῦ ᾅδου
  choice: 阴间
  rationale: “阴间”在中文圣经语境中可指死人所在的领域，并能与最终刑罚之地相区别；它也避免把该词缩减为实体坟墓。
- source_word: ἔχω τὰς κλεῖς
  choice: 握有……的钥匙
  rationale: “握有”自然表达ἔχω的持有意义，并使钥匙所象征的掌管权清楚可感，却不把象征性的含义直接写进正文。
theological_decisions:
- issue: 如何翻译末世语境中的ᾅδης
  choice: 阴间
  alternative: 坟墓；死人之地；地狱
  rationale: “阴间”保留死亡与ᾅδης彼此相关却不完全相同的张力，既不将其仅限于埋葬之处，也不等同于最终刑罚意义上的“地狱”。
- issue: 是否在ζῶν εἰμι中明说复活
  choice: 我活着
  alternative: 我又活了；我复活了
  rationale: 上下文清楚呈现由死到活，但希腊语此处直接陈述的是“我活着”。正文不添加“又”或“复活”，从而保留原文简洁而有张力的宣告。
- issue: ὁ ζῶν作为称号的表达
  choice: 那位永活者
  alternative: 那位活着的；活着的那一位
  rationale: 选择具有称号感且庄重自然的表达，不把它解释为某一宗派特有的教义称谓。无尽生命随后由“直到永永远远”明确展开。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。以分号和逗号呈现原文连续而有力的自我宣告；保留“看哪”的启示文学语气。正文避免生硬的逐词对应，也不补入“复活”“地狱”等会提前消解原文神学张力的解释。所有脚注标记均置于其所说明的词语之后。
