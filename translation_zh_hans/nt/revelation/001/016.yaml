source:
  edition: SBLGNT
  text: καὶ ἔχων ἐν τῇ δεξιᾷ ⸂χειρὶ αὐτοῦ⸃ ἀστέρας ἑπτά, καὶ ἐκ τοῦ στόματος αὐτοῦ ῥομφαία δίστομος ὀξεῖα ἐκπορευομένη, καὶ ἡ ὄψις αὐτοῦ ὡς ὁ ἥλιος φαίνει ἐν τῇ δυνάμει αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/016.yaml
  text: And he had seven stars in his right hand[a], and from his mouth came a sharp two-edged sword[b], and his appearance was like the sun shining in its strength.
translation:
  language: zh_hans
  text: 他右手拿着七颗星；一把锋利的双刃剑从他口中出来[a]；他的容貌如同太阳在最强烈的时候照耀[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “双刃剑”也可译作“两刃的剑”；原文同时明确说这剑是锋利的。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“如同太阳以其威力照耀”。“最强烈的时候”表达原文所说太阳照耀的力量或强度。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχων
  choice: 拿着
  rationale: 分词用于延续异象中的描写；译作“拿着”自然地表达持续持有的状态。
- source_word: ἐν τῇ δεξιᾷ χειρὶ αὐτοῦ
  choice: 他右手
  rationale: 原文明确包含“手”（χείρ），因此不简化为“右边”或单独的“右手中”；汉语用“右手拿着”表达自然。
- source_word: ἀστέρας ἑπτά
  choice: 七颗星
  rationale: 按现代汉语语序直译，并用量词“颗”使表达自然。
- source_word: ῥομφαία
  choice: 剑
  rationale: 该词可指大型的剑，但本节重点在异象及其修饰语；“剑”清楚、通行，也避免对兵器形制做过度限定。
- source_word: δίστομος ὀξεῖα
  choice: 锋利的双刃
  rationale: δίστομος字面有“两口的”之意，在兵器语境中指“双刃”；ὀξεῖα另表“锋利”，两层意思均予保留。
- source_word: ἐκπορευομένη
  choice: 伸出来
  rationale: 表达剑正从口中向外出现的异象。“伸出来”比“发出”更具体，又不把象征预先解释为言语或审判。
- source_word: ἡ ὄψις αὐτοῦ
  choice: 他的容貌
  rationale: ὄψις指可见的外观或样貌，不必限于脸部；“容貌”在此庄重自然，同时保留视觉描写。
- source_word: ὡς ὁ ἥλιος φαίνει
  choice: 如同太阳……照耀时一样
  rationale: 保留明喻和现在时态所呈现的持续光辉，并采用自然的汉语比较结构。
- source_word: ἐν τῇ δυνάμει αὐτοῦ
  choice: 全力
  rationale: 此处δύναμις描写太阳照耀的力量或强度；“全力照耀”符合现代汉语，也保留“力量”这一核心意象。
theological_decisions:
- issue: 从口中伸出的剑这一异象的含义
  choice: 保留异象本身，不在正文中解释其象征意义。
  alternative: 明说这把剑象征基督施行审判的话语。
  rationale: 本节呈现启示文学的象征画面。上下文或其他经文可以帮助解释，但翻译不应把解释直接写入本节正文。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体；三个并列分句对应原文连续的异象描写。避免以术语解释象征，也避免将ὄψις缩窄为单指“脸”。
