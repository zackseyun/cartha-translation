id: REV.1.20
reference: Revelation 1:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: τὸ μυστήριον τῶν ἑπτὰ ἀστέρων ⸀οὓς εἶδες ἐπὶ τῆς δεξιᾶς μου, καὶ τὰς ἑπτὰ λυχνίας τὰς χρυσᾶς· οἱ ἑπτὰ ἀστέρες ἄγγελοι τῶν ἑπτὰ ἐκκλησιῶν εἰσίν, καὶ αἱ λυχνίαι αἱ ἑπτὰ ἑπτὰ ἐκκλησίαι εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/020.yaml
  text: 'As for the mystery of the seven stars that you saw in my right hand[a], and the seven golden lampstands: the seven stars are the angels of the seven churches, and the seven lampstands are the seven churches.'
translation:
  language: zh_hans
  text: 至于你在我右手中所看见的七颗星，以及那七座金灯台的奥秘：七颗星就是七个教会的天使[a]，七座灯台就是七个教会。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使者”。希腊语原词既可指天使，也可指人的使者。
    reason: alternative_reading
lexical_decisions:
- source_word: μυστήριον
  choice: 奥秘
  rationale: 保留启示文学和圣经神学中的专门意味；这里指异象中如今被揭示的意义，但不将其扁平化为“象征意义”。
- source_word: ἀστέρων / ἀστέρες
  choice: 星／七颗星
  rationale: 按异象的具体形象直译；随后经文本身解释其所指。汉语以量词“颗”自然表达。
- source_word: οὓς εἶδες
  choice: 你……所看见的
  rationale: 用自然、庄重的现代汉语保留修饰“七颗星”的关系从句。
- source_word: ἐπὶ τῆς δεξιᾶς μου
  choice: 在我右手中
  rationale: 结合1:16所建立的异象画面，译为“右手中”符合现代汉语习惯，也保留由右手持有七星的形象。
- source_word: λυχνίας
  choice: 灯台
  rationale: λυχνία指承放灯的灯台而非灯本身；“灯台”准确保留具体意象。
- source_word: χρυσᾶς
  choice: 金
  rationale: “金灯台”简洁自然，表达由金制成或呈金质的形容意义。
- source_word: ἄγγελοι
  choice: 天使
  rationale: 该词既可指天上的使者，也可指人的使者。启示录中超自然意义常见，因此正文采用“天使”，并以脚注保留“使者”的可能。
- source_word: ἐκκλησιῶν / ἐκκλησίαι
  choice: 教会
  rationale: 在启示录写给七个具体信仰群体的语境中，“教会”是现代汉语最通行且贴切的译法。
- source_word: τὸ μυστήριον ... καὶ ...
  choice: 至于……以及……的奥秘：
  rationale: 希腊文先提出主题，随后给出解释；此结构既自然呈现话题，又不补入原文没有的谓语。
theological_decisions:
- issue: ἄγγελοι τῶν ἑπτὰ ἐκκλησιῶν所指为何
  choice: 七个教会的天使
  alternative: 七个教会的使者
  rationale: ἄγγελος可指天使，也可指人的使者；本节没有明确判定所指。正文采用启示录中常见并具传统依据的“天使”，脚注保留“使者”，不消除原文的解释张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“至于……奥秘：”保留原文的话题—解释结构；全句适度调整语序以符合汉语表达。脚注标记紧接可能有歧义的“天使”。
