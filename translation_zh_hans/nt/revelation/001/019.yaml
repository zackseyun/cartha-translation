base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/019.yaml
  text: Therefore write what you have seen[a], and what is, and what is about to happen after these things.
translation:
  language: zh_hans
  text: 所以，要把所看见的事、现在的事，以及这些事以后将要发生的事写下来。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这些事以后将要发生的事”也可译作“这些事以后将发生的事”。这里的动词有时近于一般将来，但通常带有将要或行将发生的意味。
    reason: alternative_reading
lexical_decisions:
- source_word: γράψον
  choice: 写下来
  rationale: 不定过去时主动命令语气第二人称单数，表达直接命令；“写下来”在现代汉语中自然，也体现记录之意而不增加解释。
- source_word: οὖν
  choice: 所以
  rationale: 承接前文的异象与委任，并表示推论；“所以”比“于是”更清楚地保留连接和推论作用。
- source_word: ἃ εἶδες
  choice: 所看见的
  rationale: 指约翰已经看见的异象内容；中文“所看见的”简洁自然，并保留其与当前命令的联系。
- source_word: ἃ εἰσὶν
  choice: 现在的
  rationale: 希腊文直译近于“现有的事”；在三项并列结构中，“现在的”自然表达当前的现实，同时避免把具体所指解释得过窄。
- source_word: μέλλει γίνεσθαι
  choice: 将要发生
  rationale: μέλλω加不定式可表达即将或预期发生；“将要发生”既保留趋近未来的意味，也不像“马上发生”那样过度限定时间。
- source_word: μετὰ ταῦτα
  choice: 此后
  rationale: 表达“这些事之后”的时间关系；“此后”是自然、庄重的现代汉语，并保留启示录中这一时间表达的功能。
theological_decisions:
- issue: 启示文学语境中 μέλλει 的时间力度
  choice: 译作“将要发生”，保留趋近未来或行将发生的意味
  alternative: 译作“以后必发生”或单纯“将发生”
  rationale: 原文可带有迫近意味，也可能在某些语境中近似一般将来。正文采用“将要”保存这种时间张力，不据此裁定更广泛的末世论问题。
- issue: 三组关系从句的结构关系
  choice: 按三项并列理解：“所看见的、现在的，以及此后将要发生的事”
  alternative: 将“所看见的”视为总括，后两项作为其解释
  rationale: 希腊文三个 ἃ 结构允许讨论其句法关系；正文保留表面并列形式，不把某一种启示录结构纲要强加于经文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。三项内容以“的”字结构并列，尽量贴近原文节奏；脚注标记置于整句末，说明 μέλλει 的时间语气而不消解其歧义。
