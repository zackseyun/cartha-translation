id: REV.1.5
reference: Revelation 1:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἀπὸ Ἰησοῦ Χριστοῦ, ὁ μάρτυς ὁ πιστός, ὁ πρωτότοκος τῶν νεκρῶν καὶ ὁ ἄρχων τῶν βασιλέων τῆς γῆς. Τῷ ἀγαπῶντι ἡμᾶς καὶ ⸀λύσαντι ἡμᾶς ⸀ἐκ τῶν ἁμαρτιῶν ἡμῶν ἐν τῷ αἵματι αὐτοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/005.yaml
  text: and from Jesus the Messiah[a], the faithful witness, the firstborn of the dead, and the ruler of the kings of the earth[b]. To him who loves us and freed us from our sins by his blood—
translation:
  language: zh_hans
  text: 也从耶稣弥赛亚[a]而来；他是忠信的见证人、从死人中首先复生者、地上众王的统治者。归给那爱我们、用自己的血使我们脱离罪的他——[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弥赛亚”传统上也译作“基督”；希腊文Χριστός是“受膏者”的称号。
    reason: lexical_alternative
  - marker: b
    text: 有些抄本作“在自己的血中洗净我们，使我们脱离我们的罪”，而不是“用自己的血使我们脱离罪”。
    reason: textual_variant
lexical_decisions:
- source_word: Ἰησοῦ Χριστοῦ
  choice: 耶稣弥赛亚
  rationale: Χριστός在这里是称号；“弥赛亚”既保留其犹太经文背景，也符合现代中文的通行表达。
- source_word: ὁ μάρτυς ὁ πιστός
  choice: 忠信的见证人
  rationale: μάρτυς指作见证者，并不特指殉道者；πιστός兼具忠诚、可靠之意，“忠信”保留这两层意味。
- source_word: ὁ πρωτότοκος τῶν νεκρῶν
  choice: 从死人中首先复生的
  rationale: 用自然中文表达“首生者”的复活意象，同时避免把“死人”误解为一个拥有成员的群体；此短语也含有首位与尊荣意味。
- source_word: ὁ ἄρχων τῶν βασιλέων τῆς γῆς
  choice: 地上众王的统治者
  rationale: ἄρχων在此强调实际权柄；“统治者”比“王子”或“领袖”更清楚地表达其凌驾众王的地位。
- source_word: Τῷ ἀγαπῶντι ἡμᾶς
  choice: 那爱我们的人
  rationale: 现在时分词表示持续的爱；中文以“爱我们”自然表达。
- source_word: λύσαντι ἡμᾶς ἐκ τῶν ἁμαρτιῶν ἡμῶν
  choice: 使我们脱离罪
  rationale: λύω表示解开、释放，ἐκ表示从中脱离；“使我们脱离罪”保留释放意象，且中文自然。
- source_word: ἐν τῷ αἵματι αὐτοῦ
  choice: 用自己的血
  rationale: ἐν在此可表凭借的媒介或手段；“用自己的血”保留血的牺牲性语言，也贴近原文结构。
theological_decisions:
- issue: λύσαντι与λούσαντι的文本异文
  choice: 采用SBLGNT的λύσαντι，译作“使我们脱离”
  alternative: λούσαντι，“洗净了我们”
  rationale: 主文遵循所给希腊文本；因“释放”与“洗净”在意象及神学表达上差异显著，异文列入脚注。
- issue: Χριστός的称号表达
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处作为耶稣的称号使用；“弥赛亚”直接呈现“受膏者”这一称号背景，而脚注保留传统译名。
- issue: τῶν νεκρῶν的关系
  choice: 从死人中首先复生的
  alternative: 死人的长子
  rationale: 选择自然中文以显示复活关联，但不将“首先”解释为受造次序；“长子”所含的尊荣和居首意味在此意译中仍应由上下文理解。
- issue: 未补出原文下一节才出现的颂赞谓语
  choice: 本节止于破折号，不加入“愿荣耀和权能归给”
  alternative: 按跨节句法补出颂赞公式
  rationale: 原文在本节仅开启与格短语Τῷ ἀγαπῶντι，完整颂赞谓语在1:6；按节翻译时应保留悬接结构，不提前加入下一节内容。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。并列的三个身份称号以重复“是”增强可读性。注意：提交文本中“愿荣耀和权能归给”属于1:6，不应出现在本节；本节最终正文应依原文止于破折号。
