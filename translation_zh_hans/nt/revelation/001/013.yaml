  text: καὶ ἐν μέσῳ ⸀τῶν λυχνιῶν ὅμοιον ⸀υἱὸν ἀνθρώπου, ἐνδεδυμένον ποδήρη καὶ περιεζωσμένον πρὸς τοῖς μαστοῖς ζώνην χρυσᾶν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/013.yaml
  text: and in the midst of the lampstands[a], one like a son of man, clothed in a robe reaching to the feet and girded across the chest with a golden sash.
translation:
  language: zh_hans
  text: 在灯台中间，有一位好像人子[a]，身穿垂到脚的长袍，胸间束着一条金带。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人子”也可按传统理解视为称号。这里的措辞呼应《但以理书》7:13，并在此用来描述得荣耀的耶稣。
    reason: 保留原文无冠词表达与传统称号式理解之间的歧义，并交代其经文互涉和基督论背景。
lexical_decisions:
- source_word: ἐν μέσῳ τῶν λυχνιῶν
  choice: 在灯台中间
  rationale: 保留空间方位和异象体裁的庄重感；λυχνία指承放灯盏的灯台，而不是灯本身。
- source_word: ὅμοιον υἱὸν ἀνθρώπου
  choice: 有一位好像人子
  rationale: “人子”既能自然呼应《但以理书》7:13，也保留希腊文无冠词表达所具有的张力，不在正文中强行将其明确处理为固定称号。
- source_word: ἐνδεδυμένον ποδήρη
  choice: 身穿垂到脚的长袍
  rationale: ἐνδεδυμένον表达已经穿着的状态；ποδήρης意为衣服延伸至脚部，译文将其具体含义自然明示。
- source_word: περιεζωσμένον πρὸς τοῖς μαστοῖς
  choice: 胸间束着
  rationale: 准确表达带子束在躯干较高处，而非通常的腰间；“胸间”比直译“乳房处”更符合现代汉语。
- source_word: ζώνην χρυσᾶν
  choice: 一条金带
  rationale: ζώνη可指腰带或束带；结合其位于胸间，采用较宽泛自然的“金带”，避免误导为系在腰部的皮带。
theological_decisions:
- issue: ὅμοιον υἱὸν ἀνθρώπου的基督论含义
  choice: 正文译作“有一位好像人子”，并用脚注说明其《但以理书》背景及这里所指的人物。
  alternative: 有一位好像那位人子；有一位好像人的儿子
  rationale: “人子”保留了《但以理书》7:13的公认呼应及其基督论分量；同时不添加希腊文所没有的定冠性，也不将短语淡化成泛指“人”。脚注说明启示录在此将异象用于得荣耀的耶稣。
translation_notes:
  register: 采用现代、庄重而易懂的异象叙事语言。“垂到脚的长袍”和“胸间束着一条金带”既清楚呈现服饰细节，也避免生硬仿古表达。
