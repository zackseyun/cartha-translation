id: REV.1.17
reference: Revelation 1:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ ὅτε εἶδον αὐτόν, ἔπεσα πρὸς τοὺς πόδας αὐτοῦ ὡς νεκρός· καὶ ἔθηκεν τὴν δεξιὰν αὐτοῦ ἐπ’ ἐμὲ λέγων· Μὴ φοβοῦ· ἐγώ εἰμι ὁ πρῶτος καὶ ὁ ἔσχατος,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/017.yaml
  text: And when I saw him[a], I fell at his feet like a dead man. And he placed his right hand on me, saying, “Do not fear[b]. I am the First and the Last,”
translation:
  language: zh_hans
  text: 我一看见他，就仆倒在他脚前，像死人一样[a]。他把右手放在我身上，说：“不要惧怕[b]。我是首先的，也是末后的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“仿佛死了。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“不要害怕。”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ὅτε εἶδον αὐτόν
  choice: 我一看见他，就
  rationale: 用“一……就……”自然表达ὅτε所引出的时间关系，并以句中衔接保留καί推进叙事的作用；“看见”准确传达直接视觉感知。
- source_word: ἔπεσα πρὸς τοὺς πόδας αὐτοῦ
  choice: 仆倒在他脚前
  rationale: “仆倒”表现突然倒下，“在他脚前”自然传达πρός在此处所表达的位置与姿态，同时保留庄重语体。
- source_word: ὡς νεκρός
  choice: 像死人一样
  rationale: 保留ὡς明确的比喻性质，既生动又不暗示约翰真的死亡。
- source_word: ἔθηκεν τὴν δεξιὰν αὐτοῦ ἐπ’ ἐμέ
  choice: 他把右手放在我身上
  rationale: 直接表达τίθημι的放置动作，并保留“右手”这一明确且具有象征意味的细节；“放在我身上”不额外加入按压或触摸方式。
- source_word: λέγων
  choice: 说
  rationale: 现代汉语以顺承谓语“说”自然表达伴随动作的分词，无须机械保留希腊语分词结构。
- source_word: Μὴ φοβοῦ
  choice: 不要惧怕
  rationale: 准确表达禁止性的命令，在现代汉语中清楚而庄重。
- source_word: ἐγώ εἰμι
  choice: 我是
  rationale: 保留明确主语所带出的郑重自我宣告，不将其扩展解释为本句未明说的神学典故。
- source_word: ὁ πρῶτος καὶ ὁ ἔσχατος
  choice: 首先的，也是末后的
  rationale: 两个带冠词的形容词在此作名词性称号；“首先的”“末后的”直接对应原文，并用“也是”形成自然、郑重的汉语对举。
theological_decisions:
- issue: ὁ πρῶτος καὶ ὁ ἔσχατος的称号性质
  choice: 我是首先的，也是末后的
  alternative: 我是第一位，也是最后一位
  rationale: 上下文表明这是说话者郑重的自我称号，并呼应先知书中的神圣称号语言。所选译法保留称号的绝对性及原文对举，不借助汉语大小写，也不额外加入身份说明。
- issue: ἐγώ εἰμι的语力
  choice: 我是
  alternative: 是我
  rationale: 此处后接两个称号，重在正式自我宣告；“我是”比仅用于辨认身份的“是我”更贴近句法与语境，同时不把该短语单独解释成超出本节明言范围的神学公式。
- issue: ὡς νεκρός是否表示实际死亡
  choice: 像死人一样
  alternative: 仿佛死了
  rationale: ὡς明确标示比喻；译文保留约翰近乎死亡的状态描写，却不将其解释为真正死亡。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“仆倒”保留异象场景的强烈动作感；“不要惧怕”与“首先的，也是末后的”保持启示性宣告的肃穆语气。脚注标记均置于其实际对应的短语之后。
