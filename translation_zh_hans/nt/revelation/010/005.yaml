  text: καὶ ὁ ἄγγελος, ὃν εἶδον ἑστῶτα ἐπὶ τῆς θαλάσσης καὶ ἐπὶ τῆς γῆς, ἦρεν τὴν χεῖρα αὐτοῦ τὴν δεξιὰν εἰς τὸν οὐρανόν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/005.yaml
  text: And the angel whom I saw standing on the sea and on the land raised his right hand to heaven[b][a],
translation:
  language: zh_hans
  text: 我所看见、站在海上和陆地上的那位天使，把自己的右手举向天[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“向着天”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελος
  choice: 天使
  rationale: 在《启示录》的语境中指天上的使者；“天使”比泛指的“使者”更自然、准确。
- source_word: ἑστῶτα
  choice: 站在
  rationale: 该完成时分词着重描述天使当时所处的站立状态；现代汉语用“站在”自然明白。
- source_word: ἐπὶ τῆς θαλάσσης
  choice: 在海上
  rationale: 保留ἐπί加属格所呈现的鲜明异象图景，并与前文一致。
- source_word: ἐπὶ τῆς γῆς
  choice: 在陆地上
  rationale: γῆ可指地、土地或陆地；此处与“海”形成空间对照，译作“陆地”最贴合场景。
- source_word: ἦρεν
  choice: 举起
  rationale: 准确表达αἴρω在此处举手的动作，也符合随后起誓的庄重姿态。
- source_word: τὴν χεῖρα αὐτοῦ τὴν δεξιὰν
  choice: 右手
  rationale: 忠实保留原文对“手”及“右边”的明确限定，且符合现代汉语表达。
- source_word: εἰς τὸν οὐρανόν
  choice: 指向天
  rationale: εἰς表示动作的方向；“指向天”自然呈现举手朝天的姿态，并保留“天”的神学语域。
theological_decisions:
- issue: γῆ与θάλασσα形成的对照
  choice: 陆地
  alternative: 地／大地
  rationale: “陆地”清楚保留异象中海与陆地两个领域的视觉对照，同时不额外引入更广泛的宇宙论含义。
- issue: οὐρανός的译法
  choice: 天
  alternative: 天空
  rationale: 下一节将提到永活者与创造，起誓动作具有超越单纯物理方向的庄重含义；“天”既忠实又保留这一语域。
- issue: 举右手的动作方向
  choice: 指向天
  alternative: 向天举起右手
  rationale: 原文εἰς τὸν οὐρανόν表达朝向；“指向天”明确传达方向，但不把动作解释为手指的特定姿势。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。“我所看见的那位天使”保留关系从句结构；“海上和陆地上”维持异象的空间张力。主文以“指向天”表达方向，脚注保留更贴近常见起誓措辞的语序。
