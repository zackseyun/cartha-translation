    reason: 说明本节词形与邻近经文的差异，避免默默协调。
  revision_rationale: 改用较中性的‘取……来’，避免‘拿过来’可能带出的额外趋向；并重组天使的后置说明以提高中文句法清晰度。脚注 b 保留，但其锚点须随正文‘书卷’标出。
