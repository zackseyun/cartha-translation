id: REV.10.8
reference: Revelation 10:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ ἡ φωνὴ ἣν ἤκουσα ἐκ τοῦ οὐρανοῦ, πάλιν ⸀λαλοῦσαν μετ’ ἐμοῦ καὶ ⸀λέγουσαν· Ὕπαγε λάβε τὸ ⸀βιβλίον τὸ ἠνεῳγμένον ἐν τῇ χειρὶ τοῦ ἀγγέλου τοῦ ἑστῶτος ἐπὶ τῆς θαλάσσης καὶ ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/008.yaml
  text: And the voice that I heard from heaven spoke to me again and said[a], “Go[b], take the scroll that is opened in the hand of the angel who is standing on the sea and on the land.”
translation:
  language: zh_hans
  text: 我先前听见的那从天上来的声音，又对我说[a]：“你去，取那位天使手中展开的书卷来；那天使站在海上和陆地上。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文也可较直译为“又与我说话，并说”。
    reason: 保留 λαλέω μετά 与 λέγω 两个分词的结构差异；正文按现代汉语合并表达。
lexical_decisions:
- source_word: φωνὴ
  choice: 声音
  rationale: 这里指从天上发出、能够说话并传达命令的声音；“声音”在现代汉语中自然，也不额外指定说话者身份。
- source_word: πάλιν
  choice: 又
  rationale: 表示先前听见的声音再次向约翰说话；“又”简洁自然。
- source_word: λαλοῦσαν μετ’ ἐμοῦ καὶ λέγουσαν
  choice: 又对我说
  rationale: 将两个协调的分词按现代汉语合并表达，避免生硬重复，同时保留声音再次向约翰讲话并引出直接引语的功能。
- source_word: Ὕπαγε
  choice: 你去
  rationale: 这是直接命令；加入“你”使汉语命令句清楚自然，并未增加新的指称。
- source_word: λάβε
  choice: 拿过来
  rationale: 语境要求约翰走到天使那里取得书卷；“拿过来”自然表达这一指令，而不把动作弱化为被动的“领受”。
- source_word: βιβλίον
  choice: 书卷
  rationale: 启示文学场景中的对象是卷轴式文献；“书卷”符合历史语境。本节使用的是 βιβλίον，并非邻近经文中的指小形式，因此正文不译作“小书卷”。
- source_word: ἠνεῳγμένον
  choice: 展开的
  rationale: 完成时被动分词表示书卷已经被打开并处于打开状态；卷轴在汉语中通常说“展开”，可自然体现结果状态。
- source_word: ἐν τῇ χειρὶ
  choice: 手中
  rationale: 忠实表达书卷所在的位置；取得书卷的方向已由“拿过来”与语境体现。
- source_word: ἄγγελος
  choice: 天使
  rationale: 异象语境明确指天上的使者，现代中文通常译作“天使”。
- source_word: ἑστῶτος
  choice: 站在
  rationale: 表达完成时分词所描写的持续站立状态。
- source_word: ἐπὶ τῆς θαλάσσης καὶ ἐπὶ τῆς γῆς
  choice: 站在海上和陆地上
  rationale: “陆地”与“海”构成清晰的空间对照，也符合天使跨海陆站立的异象画面；重复“上”使两个方位关系清楚。
theological_decisions:
- issue: γῆ在启示异象中的译法
  choice: 陆地
  alternative: 地上／大地
  rationale: 本节描绘天使站立的位置，γῆ与“海”相对，译作“陆地”最贴合空间画面，不引入不必要的宇宙论判断。
- issue: βιβλίον与上下文指小形式的关系
  choice: 书卷
  alternative: 小书卷
  rationale: 本节希腊正文为 βιβλίον，而邻近经文出现指小形式 βιβλαρίδιον。正文保留本节自身的词形差异，不因上下文而默默协调；“小书卷”列入脚注。
- issue: 书卷打开状态的表达
  choice: 展开的
  alternative: 打开的／已经展开的
  rationale: “展开的”适合卷轴，并保留完成时所指的既已打开、现仍如此的状态；不赋予这一状态额外象征意义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“我先前听见的那从天上来的声音”保留关系从句结构；直接命令用“你去……拿过来”使口吻自然明确。脚注标记均在正文出现。
