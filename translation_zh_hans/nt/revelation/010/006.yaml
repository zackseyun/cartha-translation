source:
  edition: SBLGNT
  text: καὶ ⸀ὤμοσεν τῷ ζῶντι εἰς τοὺς αἰῶνας τῶν αἰώνων, ὃς ἔκτισεν τὸν οὐρανὸν καὶ τὰ ἐν αὐτῷ καὶ τὴν γῆν καὶ τὰ ἐν αὐτῇ καὶ τὴν θάλασσαν καὶ τὰ ἐν αὐτῇ, ὅτι χρόνος οὐκέτι ἔσται·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/006.yaml
  text: and swore by the one who lives forever and ever[a], who created heaven and the things in it, and the earth and the things on it, and the sea and the things in it, that there will no longer be any delay.
translation:
  language: zh_hans
  text: 他指着那位永永远远活着的、就是创造了天和天上的一切、地和地上的一切、海和海里一切的那一位起誓：“不再有延迟了[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译作“不再有时间了”。这里的“时间”（χρόνος）按上下文可理解为“延迟”或“等候的时期”，即上帝采取最终行动以前的等候期已经结束。
    reason: 保留 χρόνος 较字面的传统译法，并说明正文采用语境义“延迟”的依据。
lexical_decisions:
- source_word: ὤμοσεν
  choice: 起誓
  rationale: ὀμνύω表示郑重立誓；“起誓”在现代汉语中简洁、庄重，也适合本段的启示文学场景。
- source_word: τῷ ζῶντι εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: 指着那位活到永永远远的
  rationale: ὀμνύω后的与格指出起誓所凭借的对象；“指着……起誓”是自然庄重的汉语表达。ζῶντι作名词性分词，译为“那位……的”；“活到永永远远”传达该习语所表示的无尽久远。
- source_word: ἔκτισεν
  choice: 创造了
  rationale: κτίζω在宇宙创造语境中指创造；“创造”准确体现造物主的行动。
- source_word: τὸν οὐρανὸν
  choice: 天
  rationale: 单数οὐρανός在天地海的创造公式中指天界或天空这一宇宙领域；“天”是简明而合宜的对应词。
- source_word: τὰ ἐν αὐτῷ / τὰ ἐν αὐτῇ
  choice: ……上的一切／……里的一切
  rationale: 这些中性复数结构指各领域中的所有事物；按汉语搭配分别译为“天上的一切、地上的一切、海里的一切”，既自然，也保留三重平行结构。
- source_word: γῆν
  choice: 地
  rationale: 在天、地、海的宇宙性三分结构中，γῆ指大地，而不是某一局部地区。
- source_word: θάλασσαν
  choice: 海
  rationale: θάλασσα在这里直指海；保留单数，以配合原文的创造公式。
- source_word: ὅτι
  choice: 他说：“……”
  rationale: ὅτι在起誓动词后引出誓言内容。汉语以引语形式表达，比机械译为“即”或“说……这件事”更自然，且不改变其句法功能。
- source_word: χρόνος οὐκέτι ἔσται
  choice: 不会再有延迟了
  rationale: χρόνος基本义为时间或一段时间，但结合下一节神奥秘即将成全的语境，此处最可能指等待期或延迟的终止。“不会再有延迟了”传达语境意义，同时以脚注保留较直译的可能。
theological_decisions:
- issue: 誓言中χρόνος的含义
  choice: 理解为不再延迟，即等候上帝最终行动的时期已经结束
  alternative: “不再有时间了”或“时间将不复存在”
  rationale: 下一节说明到第七位天使吹号时，上帝的奥秘就要成全，因此本句着重宣告延期或等候的终结，而不是断言时间本身从此消失。脚注保留原文较字面的表达及其真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“又”承接上文叙事；以分号和补充句拆开较长的希腊语关系从句，避免汉语定语过度堆叠，同时保留天、地、海及其中万有的三重平行。脚注标记置于其实际解释的“延迟”之后。
