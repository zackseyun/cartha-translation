  text: ἀλλ’ ἐν ταῖς ἡμέραις τῆς φωνῆς τοῦ ἑβδόμου ἀγγέλου, ὅταν μέλλῃ σαλπίζειν, καὶ ἐτελέσθη τὸ μυστήριον τοῦ θεοῦ, ὡς εὐηγγέλισεν τοὺς ⸂ἑαυτοῦ δούλους⸃ τοὺς προφήτας.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/007.yaml
  text: but in the days of the voice of the seventh angel[a], when he is about to sound the trumpet, then the mystery of God is fulfilled, just as he proclaimed the good news to his own slaves, the prophets.
translation:
  language: zh_hans
  text: 但在第七位天使发声的日子，就是他将要吹号的时候，神的奥秘就得以成全，正如神从前向他自己的奴仆[a]——众先知所传的福音那样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “奴仆”也可译作“仆人”。原文此词可指仆人或奴仆；这里“他自己的”强调他们属于神并受他差遣。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: 但
  rationale: 承接上文有关“不再耽延”的话，保留明确的转折关系。
- source_word: ἐν ταῖς ἡμέραις τῆς φωνῆς τοῦ ἑβδόμου ἀγγέλου
  choice: 到了第七位天使发声的日子
  rationale: 保留“日子”和“声音／发声”的措辞，同时用现代汉语较自然的时间表达呈现启示文学语体；不把“发声”提前解释成吹号。
- source_word: ὅταν μέλλῃ σαλπίζειν
  choice: 他将要吹响号筒时
  rationale: “将要”表达 μέλλῃ 的临近意味；“吹响号筒”自然呈现 σαλπίζειν 在本语境中的含义。
- source_word: καὶ ἐτελέσθη
  choice: 就成全了
  rationale: “成全”兼顾完成和实现之意；以“就”表达时间从句所指向的结果。希腊文使用不定过去时，但在未来导向的结构中具有预示性，因此中文保留“了”而不改成单纯过去叙事。
- source_word: τὸ μυστήριον τοῦ θεοῦ
  choice: 神的奥秘
  rationale: 保留圣经中“奥秘”这一重要用语，不将其窄化为某一种具体末世解释。
- source_word: ὡς εὐηγγέλισεν
  choice: 正如神曾……宣告的福音
  rationale: 保留 εὐαγγελίζω 的“传报好消息／福音”色彩；“曾”表明先前借先知所作的宣告。
- source_word: τοὺς ἑαυτοῦ δούλους
  choice: 他自己的奴仆
  rationale: “奴仆”在现代中文圣经语体中既能表达服事，也保留归属和受主人差遣的关系；“自己的”对应 ἑαυτοῦ 的强调。
- source_word: τοὺς προφήτας
  choice: 就是众先知
  rationale: 明确呈现同位关系：这些奴仆就是先知。
theological_decisions:
- issue: ἐτελέσθη 在未来导向语境中的时态和体貌
  choice: 就成全了
  alternative: 就必成全／就完成了
  rationale: 原文以不定过去时置于“当……时”的未来导向结构中，可理解为预示性的完成。译文保留其突出的完成感，而不把它系统化为某种末世时间表。
- issue: δοῦλος 用于神的先知时如何翻译
  choice: 奴仆
  alternative: 仆人
  rationale: ἑαυτοῦ 强调这些先知属于神并受他差遣。“奴仆”比单纯“仆人”更能保留这种归属关系，又比现代汉语单用“奴隶”更符合庄重的圣经语境。
- issue: μυστήριον 的所指
  choice: 奥秘
  alternative: 隐秘的计划
  rationale: 不把“神的奥秘”解释为某项特定事件或完整神学体系，保留原文的开放性及救赎历史张力。
translation_notes:
  register: 采用现代、庄重而可理解的简体中文。“第七位天使”“吹响号筒”“神的奥秘”等表达保留启示文学的正式语气；避免用过度古雅的“第七使者发声之日”等句式。脚注标记置于整节句末，对应“宣告的福音”的译法说明。
