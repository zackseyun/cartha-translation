source:
  edition: SBLGNT
  text: καὶ ὅτε ἐλάλησαν αἱ ἑπτὰ βρονταί, ἤμελλον γράφειν· καὶ ἤκουσα φωνὴν ἐκ τοῦ οὐρανοῦ λέγουσαν· Σφράγισον ἃ ἐλάλησαν αἱ ἑπτὰ βρονταί, καὶ μὴ αὐτὰ γράψῃς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/004.yaml
  text: And when the seven thunders spoke[a], I was about to write; and I heard a voice from heaven saying, “Seal up what the seven thunders spoke, and do not write them.”
translation:
  language: zh_hans
  text: 七声雷说完时，我正要写下来，却听见有声音从天上说：“七声雷所说的，你要封住，不可写下来。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλάλησαν
  choice: 说完
  rationale: λαλέω意为“说、发声”；结合ὅτε和随后“正要写”的动作，译作“说完时”在现代汉语中自然，也清楚呈现约翰是在七声雷发言后准备记录。
- source_word: αἱ ἑπτὰ βρονταί
  choice: 七声雷
  rationale: 保留原文“七”和“雷”的启示文学意象，并使雷声作为说话者的拟人表达在汉语中成立；不扩译为“七个雷霆使者”等。
- source_word: ἤμελλον γράφειν
  choice: 我正要写下来
  rationale: μέλλω加不定式表示动作即将发生；“正要”准确表达临近性，“写下来”符合记录所听内容的语境。
- source_word: φωνὴν ἐκ τοῦ οὐρανοῦ
  choice: 有声音从天上
  rationale: 忠实表达声音来自天上，同时不擅自确定说话者的身份。
- source_word: Σφράγισον
  choice: 你要封住
  rationale: σφραγίζω在此指将启示内容封存、不予公开；“封住”既保留封印意象，也与后面的禁止书写相呼应。
- source_word: ἃ ἐλάλησαν αἱ ἑπτὰ βρονταί
  choice: 七声雷所说的
  rationale: 中性复数关系代词ἃ指七声雷说出的内容；汉语“所说的”自然概括这些话而不增添解释。
- source_word: μὴ αὐτὰ γράψῃς
  choice: 不可写下来
  rationale: 否定命令清楚有力；汉语无需另译复数代词αὐτά，其所指内容已由前句“所说的”明确承接。
theological_decisions:
- issue: 是否明确天上声音的身份
  choice: 有声音从天上
  alternative: 上帝的声音从天上 / 一个天上的声音
  rationale: 原文只说明声音来自天上，没有明说说话者是谁；译文保持这种未确定性。
- issue: “封住”所表达的是封印、保密还是禁止记录
  choice: 保留“封住”的意象，并另说“不可写下来”
  alternative: 把七声雷所说的保密 / 不要公布
  rationale: 原文同时使用Σφράγισον和μὴ γράψῃς两个命令；不可将二者合并成单一解释，否则会削弱原有的启示文学意象和命令层次。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“却”呈现约翰正要书写时受到天上声音制止的转折；保留“七声雷”的拟人化异象语言，不把声音的来源解释为特定说话者。
