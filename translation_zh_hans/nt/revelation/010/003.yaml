  text: καὶ ἔκραξεν φωνῇ μεγάλῃ ὥσπερ λέων μυκᾶται. καὶ ὅτε ἔκραξεν, ἐλάλησαν αἱ ἑπτὰ βρονταὶ τὰς ἑαυτῶν φωνάς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/003.yaml
  text: And he cried out with a loud voice[a], just as a lion roars. And when he cried out, the seven thunders spoke with their own voices.
translation:
  language: zh_hans
  text: 他大声呼喊，如同狮子吼叫。他呼喊的时候，七雷也各自发出了声音。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作：“七雷说出了各自的声音。”原文用“说话”来描写七雷，形成鲜明的拟人表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκραξεν
  choice: 呼喊
  rationale: κράζω在此表示强有力地发声；“呼喊”自然庄重，也不额外暗示痛苦。
- source_word: φωνῇ μεγάλῃ
  choice: 大声
  rationale: 中文以副词性表达最自然，仍清楚保留声音洪亮的含义；若直译为“用大声音”则不合现代汉语习惯。
- source_word: ὥσπερ λέων μυκᾶται
  choice: 如同狮子吼叫
  rationale: “如同”明确保留比较关系，“吼叫”是狮子发声的自然说法，并保留异象的力度。
- source_word: ὅτε
  choice: ……的时候
  rationale: 保留时间关系，不擅自解释为严格的先后次序或因果关系。
- source_word: αἱ ἑπτὰ βρονταὶ
  choice: 七雷
  rationale: 保留带定指意味的异象性称谓；上下文已将其视为特定的七雷，中文通常不另加冠词。
- source_word: ἐλάλησαν τὰς ἑαυτῶν φωνάς
  choice: 也各自发出了声音
  rationale: “发出了声音”在现代汉语中自然，并保留雷声被人格化而主动发声的图景；“各自”体现反身代词ἑαυτῶν所强调的各自所属。
theological_decisions:
- issue: 七雷的人格化表达
  choice: 保留“七雷也各自发出了声音”
  alternative: 七声雷响了／七雷传出了各自的信息
  rationale: 原文以λαλέω描写七雷发声，具有鲜明的人格化色彩。“响了”会削弱这一点，“信息”则加入原文没有明说的内容。译文保留其主动发声的异象性，同时采用自然中文。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“大声呼喊”简洁自然；“如同狮子吼叫”保留比喻的力度；“七雷也各自发出了声音”兼顾原文拟人手法与中文可读性。脚注标记置于所解释的第二句之后。
