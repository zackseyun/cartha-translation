id: REV.10.2
reference: Revelation 10:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἔχων ἐν τῇ χειρὶ αὐτοῦ ⸀βιβλαρίδιον ἠνεῳγμένον. καὶ ἔθηκεν τὸν πόδα αὐτοῦ τὸν δεξιὸν ἐπὶ τῆς θαλάσσης, τὸν δὲ εὐώνυμον ἐπὶ τῆς γῆς,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/002.yaml
  text: and having in his hand a little scroll that had been opened[a]. And he placed his right foot on the sea, and his left on the land[b],
translation:
  language: zh_hans
  text: 他手里拿着一卷已经展开的小书卷[a]。他把右脚踏在海上，左脚踏在陆地上[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一本已经打开的小册子。”希腊词 βιβλαρίδιον 指较小的书卷或册子。
    reason: lexical_alternative
  - marker: b
    text: 或译：“地上”或“大地上”。希腊词 γῆ 可指“陆地”“地”或“大地”；正文采用“陆地”，以突出它与“海”的对比。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχων ἐν τῇ χειρὶ αὐτοῦ
  choice: 他手里拿着
  rationale: 以自然的现代汉语表达现在分词结构，同时保留这动作与上一节那位大力天使的衔接；单数“手”无需在汉语中刻意凸显。
- source_word: βιβλαρίδιον
  choice: 一卷小书卷
  rationale: 该词为指小型书卷或册子的指小形式；“小书卷”既保留启示文学中的卷轴意象，也符合现代中文圣经语体。量词“一卷”使表达自然。
- source_word: ἠνεῳγμένον
  choice: 已经展开的
  rationale: 完成时被动分词表示书卷先前已被打开、如今仍处于展开状态；“已经展开的”兼顾动作完成与持续结果。
- source_word: ἔθηκεν τὸν πόδα
  choice: 把……脚踏在
  rationale: τίθημι在这里描写天使有意将脚置于某处；“踏在”比机械的“放在”更符合脚与海、陆的宏大异象，同时不额外加入踩踏或征服的解释。
- source_word: τὸν πόδα αὐτοῦ τὸν δεξιὸν
  choice: 右脚
  rationale: 直接、自然地对应“他的右脚”；汉语语境已明确所属者，无需重复“他的”。
- source_word: ἐπὶ τῆς θαλάσσης
  choice: 在海上
  rationale: 保留ἐπί与属格所表达的所在位置，并准确呈现θάλασσα的“海”这一意象。
- source_word: τὸν δὲ εὐώνυμον
  choice: 左脚
  rationale: εὐώνυμος在此是“左边的”委婉说法，所省略的“脚”在中文中补出，可使海、陆两部分形成清楚对称。
- source_word: ἐπὶ τῆς γῆς
  choice: 在陆地上
  rationale: γῆ可指地、陆地或大地；这里与“海”直接对举，“陆地”最清楚地呈现空间上的海陆对比。
theological_decisions:
- issue: γῆ与θάλασσα对举时的范围
  choice: 陆地
  alternative: 地上／大地上
  rationale: “陆地”保留本节最直接的海陆对照，不把γῆ无必要地解释为整个地球；脚注则保留该词较广的可能含义。
- issue: 天使将脚置于海和陆上的动作是否含有统治意味
  choice: 仅译作“踏在”，不明说统治或占有
  alternative: 译成带有“征服、掌管”意味的措辞
  rationale: 异象姿态可能暗示广泛权柄，但本节希腊文本只直接叙述双脚的位置；译文不把可能的象征解释写入正文。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“小书卷”保留古代卷轴意象；“已经展开”传达完成时被动分词的结果状态。正文按语义所指重新对应脚注标记：[a]说明βιβλαρίδιον，[b]说明γῆ，避免所给英文材料中标记与脚注内容错位。句末保留逗号，以衔接下一节原文连续的叙述。
