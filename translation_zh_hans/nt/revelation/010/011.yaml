  text: Καὶ λέγουσίν μοι· Δεῖ σε πάλιν προφητεῦσαι ἐπὶ λαοῖς ⸀καὶ ἔθνεσιν καὶ γλώσσαις καὶ βασιλεῦσιν πολλοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/011.yaml
  text: And they say to me, “You must prophesy again about many peoples and nations and languages and kings.”
translation:
  language: zh_hans
  text: 他们对我说：“你必须再次说预言，论到各民族、各国、各种语言和许多君王。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δεῖ σε
  choice: 你必须
  rationale: 表达非人称结构所表示的必要性或使命要求，语气直接而庄重。
- source_word: πάλιν προφητεῦσαι
  choice: 再次说预言
  rationale: 保留“再次”的时间含义，并用普通现代读者容易理解的表达呈现“发出预言”。
- source_word: ἐπὶ
  choice: 论到
  rationale: 此处可表示预言所涉及的对象或内容；“论到”保留这种关系，不擅自限定为“向……宣讲”或“攻击……”。
- source_word: λαοῖς καὶ ἔθνεσιν καὶ γλώσσαις
  choice: 各民族、各国、各种语言
  rationale: 分别保留原文三个并列类别；“语言”沿用原文的转喻性表达，不解释成“说各种语言的人”。
- source_word: βασιλεῦσιν πολλοῖς
  choice: 许多君王
  rationale: πολλοῖς在形态上与“君王”一致，因此直接修饰“君王”，不扩展为统摄整组名词。
theological_decisions:
- issue: 预言与所列群体之间的关系
  choice: 论到
  alternative: 向……说预言；针对……说预言
  rationale: ἐπὶ在这里容许“关于、涉及”等理解；译作“论到”可保留其语义张力，避免把使命明确限定为宣讲对象或审判对象。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“他们”忠实保留原文未说明身份的复数主语；句式简洁，适合公开诵读。
