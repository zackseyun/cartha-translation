id: REV.10.1
reference: Revelation 10:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ εἶδον ⸀ἄλλον ἄγγελον ἰσχυρὸν καταβαίνοντα ἐκ τοῦ οὐρανοῦ, περιβεβλημένον νεφέλην, καὶ ἡ ἶρις ἐπὶ ⸂τὴν κεφαλὴν⸃ αὐτοῦ, καὶ τὸ πρόσωπον αὐτοῦ ὡς ὁ ἥλιος, καὶ οἱ πόδες αὐτοῦ ὡς στῦλοι πυρός,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/001.yaml
  text: And I saw another mighty angel coming down from heaven[a], clothed with a cloud, with the rainbow over his head, and his face was like the sun[b], and his feet like pillars of fire.
translation:
  language: zh_hans
  text: 我又看见另一位大能的天使[a]从天上降下。他身披云彩，头顶上方有一道彩虹[b]；他的脸像太阳，双脚像火柱。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大能的”也可译作“强有力的”。
    reason: lexical_alternative
  - marker: b
    text: “彩虹”也可能指一道灿烂的“光环”；不过，“彩虹”是这个希腊词通常的意思，也符合《启示录》中的相关意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλον ἄγγελον
  choice: 另一位……天使
  rationale: ἄγγελος既可指“天使”，也可指“使者”；但此处是启示异象，且这位从天上降下，因此译作“天使”最自然。“另一位”保留ἄλλον所表达的同类增添关系。
- source_word: ἰσχυρὸν
  choice: 大能的
  rationale: 该词表示强壮、有力或能力非凡。“大能的”符合庄重的异象叙述，也避免把形象仅限于体力强壮。
- source_word: καταβαίνοντα ἐκ τοῦ οὐρανοῦ
  choice: 从天上降下
  rationale: 准确保留从天而下的方向和动态；“降下”在现代中文中简洁、庄重。
- source_word: περιβεβλημένον νεφέλην
  choice: 身披云彩
  rationale: περιβάλλω的完成时分词描写被云包裹、如同以云为衣；“身披云彩”既保留衣袍意象，也符合中文圣经异象文体。
- source_word: ἡ ἶρις
  choice: 一道彩虹
  rationale: ἶρις通常指彩虹；启示录4:3也有相近意象。量词“一道”使现代中文自然，同时不排除其环绕或光辉般的视觉形态。
- source_word: ἐπὶ τὴν κεφαλὴν αὐτοῦ
  choice: 头顶上方有
  rationale: ἐπί加宾格在这里描写位于头部之上；此译清楚表达空间关系，而不武断地说彩虹直接戴在头上。
- source_word: τὸ πρόσωπον αὐτοῦ ὡς ὁ ἥλιος
  choice: 他的脸像太阳
  rationale: 直译比喻结构，不额外补入“发光”等原文未明说的内容。
- source_word: οἱ πόδες αὐτοῦ
  choice: 双脚
  rationale: πούς的基本义是“脚”；“双脚”符合汉语习惯，并保留原文复数。
- source_word: στῦλοι πυρός
  choice: 火柱
  rationale: στῦλος意为柱子，属格πυρός形成“火的柱子”这一鲜明意象；“火柱”凝练而为中文读者熟悉。
theological_decisions:
- issue: 大能天使的身份
  choice: 仅译作“另一位大能的天使”，不进一步确认其身份
  alternative: 将其明确解释为受造天使，或解释为弥赛亚／基督的显现
  rationale: 希腊文本只称其为ἄλλον ἄγγελον ἰσχυρόν。其形象虽带有强烈的神显色彩，但经文本身没有在本节明说其为基督，也没有强调其只是普通受造天使，因此译文保留这一解释张力。
- issue: ἶρις所指的视觉形态
  choice: 正文译作“彩虹”，脚注保留“光环”可能
  alternative: 正文直接译作“光环”
  rationale: “彩虹”是ἶρις通常的词义，也与启示录既有意象相符；不过该词在此可能着重表现环绕头部的灿烂光辉，故以脚注保留另一理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句首“我又看见”承接异象叙事；将较长的希腊语句分成两句，以提高中文可读性，同时保留各意象的并列推进。
