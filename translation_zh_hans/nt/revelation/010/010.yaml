source:
  edition: SBLGNT
  text: καὶ ἔλαβον τὸ ⸀βιβλαρίδιον ἐκ τῆς χειρὸς τοῦ ἀγγέλου καὶ κατέφαγον αὐτό, καὶ ἦν ἐν τῷ στόματί μου ὡς μέλι γλυκύ· καὶ ὅτε ἔφαγον αὐτό, ἐπικράνθη ἡ κοιλία μου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/010.yaml
  text: And I took the little scroll from the hand of the angel and ate it, and in my mouth it was sweet like honey; and when I had eaten it, my stomach was made bitter.
translation:
  language: zh_hans
  text: 我从天使手中接过那小书卷[a]，把它吃了。它在我口中甜如蜜；可是我吃下以后，肚子却变苦了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“小书册”。希腊语用了指小词形式，指一份较小的书写文本；按古代常见形态，正文译作“小书卷”。
    reason: lexical_alternative
  - marker: b
    text: 或译“我的腹中变苦了”。
    reason: lexical_alternative
lexical_decisions:
- source_word: βιβλαρίδιον
  choice: 小书卷
  rationale: 该词是表示书写材料的指小形式；“小书卷”既保留“小”的意味，也符合古代卷轴的可能形态。
- source_word: ἐκ τῆς χειρὸς τοῦ ἀγγέλου
  choice: 从天使手中
  rationale: 直接保留从天使手里接取书卷的生动画面，同时符合现代汉语表达。
- source_word: κατέφαγον
  choice: 把它吃了
  rationale: 这里按实际动作直译为“吃”，不以“吞吃”或“吃尽”额外强化语气，以免过度诠释复合动词。
- source_word: ὡς μέλι γλυκύ
  choice: 甜如蜜
  rationale: 自然、凝练地保留ὡς所表达的比较关系。
- source_word: ὅτε ἔφαγον αὐτό
  choice: 我吃下以后
  rationale: 清楚呈现叙事次序：吃下书卷后，腹中变苦；“吃下”在汉语中也与口中的甜味形成自然推进。
- source_word: ἐπικράνθη
  choice: 变苦了
  rationale: 该被动形式在此可自然表达进入苦的状态；现代汉语用“变苦了”比机械保留被动形式更顺畅，同时不增加致使者。
- source_word: κοιλία
  choice: 肚子
  rationale: 在这一进食语境中，“肚子”是普通读者最易理解且自然的身体用语；脚注保留“腹中”这一较庄重的译法。
theological_decisions:
- issue: 吃下书卷这一象征性行动
  choice: 只按经文呈现甜与苦的意象，不在正文中解释其象征意义
  alternative: 把甜和苦明确解释为喜乐、审判或先知使命的结果
  rationale: 本节本身没有完整解释这些意象；直陈动作与感受可保存其象征张力，避免把特定神学解释写入译文。
- issue: ἐπικράνθη的语态表达
  choice: 译为状态变化“变苦了”
  alternative: 译为“被弄苦了”或“使我的肚子发苦”
  rationale: 希腊语形式虽是被动，但这里可作不及物状态变化理解；汉语若强加被动或明确致使关系，可能暗示原文未指明的施事者。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“接过”自然表达从天使手中取得书卷；用分句和“可是……却……”清楚呈现口中甘甜与腹中变苦的强烈转折。所有脚注标记均置于相关词句之后。
