id: REV.10.9
reference: Revelation 10:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ⸀ἀπῆλθα πρὸς τὸν ἄγγελον λέγων αὐτῷ δοῦναί μοι τὸ ⸀βιβλαρίδιον. καὶ λέγει μοι· Λάβε καὶ κατάφαγε αὐτό, καὶ πικρανεῖ σου τὴν κοιλίαν, ἀλλ’ ἐν τῷ στόματί σου ἔσται γλυκὺ ὡς μέλι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/009.yaml
  text: So I went to the angel[a], telling him to give me the little scroll. And he says to me, “Take and eat it, and it will make your stomach bitter[c][b], but in your mouth it will be sweet like honey.”
translation:
  language: zh_hans
  text: 于是我走到天使那里，请他把小书卷给我。他对我说：“拿去，把它吃下。它会使你的肚子发苦[a]，但在你口中却会像蜜一样甜。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “肚子”也可译作“腹中”。
    reason: 原文κοιλία可指肚腹、腹中或内脏区域；此处与进食有关，正文采用现代汉语较自然的“肚子”。
lexical_decisions:
- source_word: ἀπῆλθα πρὸς τὸν ἄγγελον
  choice: 我走到天使那里
  rationale: 按叙事语境表达约翰朝天使走去；“走到……那里”自然保留移动方向，不机械译成“离去”。
- source_word: λέγων αὐτῷ δοῦναί μοι
  choice: 请他把……给我
  rationale: 该结构表达约翰对天使所说的话。在现代汉语中，“请他给我”自然传达请求语境；不展开为直接引语，以保留原句的间接表达。
- source_word: βιβλαρίδιον
  choice: 小书卷
  rationale: 保留指小型卷册的指小意味，也符合古代文本载体及本段上下文。
- source_word: λέγει μοι
  choice: 他对我说
  rationale: 希腊文使用叙事性的历史现在时以增强现场感；现代汉语叙事通常不以时态形态区分现在与过去，因此用自然的“说”，不另加时间标记。
- source_word: Λάβε
  choice: 拿去
  rationale: 直接表达命令，并以“去”使接续的“吃下”在汉语中更自然；所指对象由下句代词明确。
- source_word: κατάφαγε αὐτό
  choice: 把它吃下
  rationale: κατεσθίω在此要求完整地吃下书卷；“吃下”既保留动作力度，又避免“吞噬”所带来的额外暴烈色彩。
- source_word: πικρανεῖ σου τὴν κοιλίαν
  choice: 它会使你的肚子发苦
  rationale: 保留使役含义和具体身体意象。κοιλία在进食语境中指腹部或肚腹；“肚子”比解剖意味较强的“胃”更贴近原词范围。
- source_word: γλυκὺ ὡς μέλι
  choice: 像蜜一样甜
  rationale: 直接保留明喻，措辞自然、清楚而庄重。
theological_decisions:
- issue: 吃下书卷这一象征行动
  choice: 保留具体命令“拿去，把它吃下”，不在正文中解释其象征意义
  alternative: 释义为领受、消化或内化上帝的信息
  rationale: 原文只呈现先知性的象征行动及其苦甜张力；将寓意写入正文会超出本节明说的内容。
- issue: 肚腹发苦与口中甘甜的张力
  choice: 按原文并列保留两种相反感受
  alternative: 将苦味解释为审判、使命的痛苦或信息带来的忧伤
  rationale: 本节没有在句内明确说明苦与甜各自所指，因此不替读者限定神学解释。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“于是”承接上文；直接引语简洁有力。历史现在时在汉语中无需生硬标示。所有脚注标记均置于正文相应位置。
