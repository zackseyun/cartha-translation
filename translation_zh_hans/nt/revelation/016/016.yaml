  text: καὶ συνήγαγεν αὐτοὺς εἰς τὸν τόπον τὸν καλούμενον Ἑβραϊστὶ Ἁρμαγεδών.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/016.yaml
  text: And he gathered them to the place that in Hebrew is called Armageddon[a][b].
translation:
  language: zh_hans
  text: 又把他们聚集[a]到那地方；那地方用希伯来话[b]称为“哈米吉多顿”。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译可作“他／它把他们聚集到”。动词是单数，但主语没有明说；上文则说那些污灵出去召集众王（13—14节）。
    reason: alternative_reading
  - marker: b
    text: “希伯来话”也可理解为“希伯来语／亚兰语”。在《启示录》中，这个说法着重指出名称的闪语形式，未必严格区分希伯来语和亚兰语。
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήγαγεν
  choice: 把……聚集到
  rationale: 希腊文动词为第三人称单数，但主语没有明说。中文省略主语既自然，也可保留施事者未明的张力；脚注说明其单数形式及上下文所容许的理解。
- source_word: αὐτοὺς
  choice: 他们
  rationale: 忠实表达宾格复数代词；按上下文指被召集的众王及其势力。
- source_word: τόπον
  choice: 一个地方
  rationale: τόπος在此通常指“地方”；首次引入该地点时用“一个地方”符合现代汉语表达。
- source_word: καλούμενον
  choice: 称为
  rationale: 自然表达被动命名之意，并与修饰“地方”的分词结构相符。
- source_word: Ἑβραϊστὶ
  choice: 用希伯来话
  rationale: 直接对应启示录中的Ἑβραϊστί，同时以脚注保留它也可能泛指当地希伯来—亚兰语语境的可能性。
- source_word: Ἁρμαγεδών
  choice: 哈米吉多顿
  rationale: 按汉语圣经传统音译此专名，辨识度高，也不过度断定其词源或地理所指。
theological_decisions:
- issue: 聚集行动的施事者
  choice: 正文省略主语：“又把他们聚集……”
  alternative: “他把他们聚集……”或按上文理解为“那些邪灵把他们聚集……”
  rationale: 原文动词是单数，支持某个单一而未明说的施事者；但13—14节又以邪灵为召集众王的行动者。中文省略主语可忠实保留原文未指明施事者的状态，而不擅自认定是上帝、某个邪恶角色或众邪灵。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“又”承接前文；省略动词主语符合汉语习惯，并保留希腊文在施事者身份上的开放性。专名采用通行译名“哈米吉多顿”。
