  text: καὶ ἐγένοντο ἀστραπαὶ καὶ ⸂φωναὶ καὶ βρονταί⸃, καὶ σεισμὸς ⸀ἐγένετο μέγας, οἷος οὐκ ἐγένετο ἀφ’ οὗ ⸂ἄνθρωποι ἐγένοντο⸃ ἐπὶ τῆς γῆς τηλικοῦτος σεισμὸς οὕτω μέγας,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/018.yaml
  text: And there were flashes of lightning and sounds and peals of thunder, and there was a great earthquake, such as had not happened since men came to be on the earth—so great was that earthquake.
translation:
  language: zh_hans
  text: 又有闪电、声响和雷鸣；又发生了一场大地震。自从人类出现在地上以来，从未发生过如此巨大的地震——那地震实在巨大。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀστραπαὶ
  choice: 闪电
  rationale: 复数表示接连出现的闪电；现代汉语通常用集合性的“闪电”，不必生硬标明复数。
- source_word: φωναὶ
  choice: 声响
  rationale: φωνή既可指“声音/声响”，也可指“嗓音”。在闪电与雷鸣并列的异象场景中，“声响”保留非言语声音的可能，同时不具体解释其来源。
- source_word: βρονταί
  choice: 雷鸣
  rationale: 自然、庄重地表达复数所体现的连续或多次雷声。
- source_word: σεισμὸς μέγας
  choice: 大地震
  rationale: “地震”是σεισμός在此处的标准对应，“大”保留μέγας所表达的规模。
- source_word: οἷος οὐκ ἐγένετο
  choice: 从未发生过这样的地震
  rationale: 清楚表达这种规模的地震前所未有，并保持比较结构。
- source_word: ἀφ’ οὗ ἄνθρωποι ἐγένοντο ἐπὶ τῆς γῆς
  choice: 自从人类出现在地上以来
  rationale: ἄνθρωποι泛指全人类，并非专指男性；“出现在地上”自然地传达ἐγένοντο的起始意味。
- source_word: τηλικοῦτος σεισμὸς οὕτω μέγας
  choice: 这地震竟如此巨大
  rationale: 保留原文末尾对地震规模的重复强化；“竟”体现惊人的程度而不增添新的事件信息。
theological_decisions:
- issue: 末世审判异象中ἄνθρωποι的泛指范围
  choice: 人类
  alternative: 人／世人
  rationale: 该复数名词在此泛指自人类存在以来的历史，并不限定男性；“人类”在现代汉语中明确、庄重，也无需借脚注处理英语中men可能造成的性别歧义。
- issue: φωναὶ是否明确译作“声音”或“说话声”
  choice: 声响
  alternative: 声音／众声
  rationale: 原词可指声音或嗓音，语境未说明是可辨识的话语；“声响”保留其模糊性，避免把它神学化为具体发声者的声音。
translation_notes:
  register: 采用现代、庄重而易懂的启示文学语体。用分号呈现前三项现象与地震之间的推进，用破折号保留原文结尾反复强调地震空前巨大的修辞力量。
