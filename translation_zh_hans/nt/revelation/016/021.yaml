id: REV.16.21
reference: Revelation 16:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ χάλαζα μεγάλη ὡς ταλαντιαία καταβαίνει ἐκ τοῦ οὐρανοῦ ἐπὶ τοὺς ἀνθρώπους· καὶ ἐβλασφήμησαν οἱ ἄνθρωποι τὸν θεὸν ἐκ τῆς πληγῆς τῆς χαλάζης, ὅτι μεγάλη ἐστὶν ἡ πληγὴ αὐτῆς σφόδρα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/021.yaml
  text: And great hail[a], about a talent in weight, comes down from heaven upon the people; and the people blasphemed God because of the plague of the hail[b], because its plague is exceedingly severe.
translation:
  language: zh_hans
  text: 又有大冰雹从天上降到人们身上，每一块约重一他连得[a]。人们因冰雹的灾祸而亵渎上帝，因为这灾祸极其严重。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一他连得”是古代重量单位；各地标准不一，此处表示每块冰雹重约一他连得，并非精确数值。
    reason: 说明古代度量单位及希腊文ὡς所表达的约数比较。
  - marker: b
    text: 或译：“因为冰雹所造成的灾祸实在非常大。”
    reason: 保留μεγάλη与σφόδρα较为字面的另一种译法，以及αὐτῆς回指冰雹的表达。
lexical_decisions:
- source_word: χάλαζα μεγάλη
  choice: 大冰雹
  rationale: 保留希腊文集合单数的表达，同时以现代汉语自然地传达冰雹规模巨大；下文按重量比较可知所指包括一块块雹石。
- source_word: ὡς ταλαντιαία
  choice: 每一块约重一他连得
  rationale: ταλαντιαία表示达到一他连得左右的重量，ὡς表比较而非精确测量；补出“每一块”使汉语读者明白重量是就雹石个体而言。
- source_word: καταβαίνει
  choice: 降到
  rationale: 用简洁而具动态感的动词呈现启示文学叙述中的生动现在时；汉语不必以形态标示时态。
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: 从天上
  rationale: “天上”既可表示从上空而来，也保留启示录中审判从天而降的神学语境。
- source_word: ἐπὶ τοὺς ἀνθρώπους
  choice: 到人们身上
  rationale: ἄνθρωποι泛指人类而非特指男性；“人们”是自然、准确的现代汉语。
- source_word: ἐβλασφήμησαν
  choice: 亵渎
  rationale: 在以上帝为宾语时，βλασφημέω指以言语冒犯、毁谤上帝；“亵渎”保留其宗教与伦理分量。
- source_word: ἐκ τῆς πληγῆς τῆς χαλάζης
  choice: 因冰雹的灾祸
  rationale: ἐκ在此表示原因；πληγή在启示录审判段落中常指降下的灾祸，而不只是一次物理击打。
- source_word: ὅτι μεγάλη ἐστὶν ἡ πληγὴ αὐτῆς σφόδρα
  choice: 因为这灾祸极其严重
  rationale: 保留ὅτι的解释关系，并用“极其严重”自然传达μεγάλη与σφόδρα叠加的强烈程度；“这灾祸”明确回指冰雹造成的灾祸。
theological_decisions:
- issue: οὐρανός在启示文学审判场景中的含义
  choice: 从天上
  alternative: 从天空
  rationale: 此处可指可见的天空，但启示录也将审判描绘为从天而降；“天上”在现代汉语中可兼容空间方向与启示文学的神学意涵，不额外限定解释。
- issue: ἄνθρωποι的泛指范围
  choice: 人们
  alternative: 世人
  rationale: 原词泛指遭受冰雹的人，并不限定男性；“人们”不加入“全世界”等原文未明说的范围，较为稳妥。
- issue: 人亵渎上帝与灾祸严重程度之间的关系
  choice: 保留两个原因性表达：“因……因为……”
  alternative: 合并为“人们因这场极其严重的冰雹灾祸而亵渎上帝”
  rationale: 原文先以ἐκ说明人亵渎上帝是因冰雹之灾，随后以ὅτι进一步说明其灾祸极重。保留两层结构可避免抹平原文的重复与强调。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“他连得”保留圣经古代重量单位，并用脚注解释；“亵渎上帝”维持启示录审判叙事的严肃语域。主文保持原句两层因果关系，未将人的反应合理化或削弱。
