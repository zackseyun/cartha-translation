id: REV.16.1
reference: Revelation 16:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ ἤκουσα ⸂μεγάλης φωνῆς⸃ ἐκ τοῦ ναοῦ λεγούσης τοῖς ἑπτὰ ἀγγέλοις· Ὑπάγετε καὶ ⸀ἐκχέετε τὰς ἑπτὰ φιάλας τοῦ θυμοῦ τοῦ θεοῦ εἰς τὴν γῆν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/001.yaml
  text: And I heard a loud voice from the sanctuary saying to the seven angels[b][a], “Go and pour out the seven bowls of the wrath of God onto the earth.”
translation:
  language: zh_hans
  text: 我听见一个响亮的声音从圣所[a]里传出，对七位天使说：“你们去，把装着上帝烈怒的七只碗[b]倒在地上。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣所”也可译作“圣殿”。希腊语ναός往往较具体地指内殿，而不是整个圣殿范围。
    reason: lexical_alternative
  - marker: b
    text: 希腊语φιάλη指碗或浅口器皿；有些传统译本译作“瓶”。
    reason: lexical_alternative
lexical_decisions:
- source_word: μεγάλης φωνῆς
  choice: 一个响亮的声音
  rationale: μέγας修饰φωνή时主要表示音量大；“响亮的声音”符合现代汉语，也保留原文的听觉力度。
- source_word: ναοῦ
  choice: 圣所
  rationale: ναός通常特指殿宇中的内殿或神圣居所，比泛指整个圣殿范围的词更具体；启示录此处的天上场景也适合译作“圣所”。
- source_word: λεγούσης
  choice: 对七位天使说
  rationale: 该现在分词在语法上修饰“声音”；汉语用“声音……对……说”自然地表达其持续发令的画面。
- source_word: Ὑπάγετε
  choice: 你们去
  rationale: 复数命令式，是对七位天使直接发出的行动命令；补出“你们”使中文指向清楚。
- source_word: ἐκχέετε
  choice: 倒
  rationale: ἐκχέω表示将容器中的东西倾倒出来；“倒”简洁自然，并与“碗”的意象协调。
- source_word: φιάλας
  choice: 碗
  rationale: φιάλη指碗状或浅口器皿，并非现代意义的细颈小瓶；量词采用“只”。
- source_word: θυμοῦ τοῦ θεοῦ
  choice: 上帝烈怒
  rationale: θυμός在此表示上帝施行审判时强烈而严肃的忿怒；“烈怒”既有分量，又不把它弱化为一般的不快。
- source_word: εἰς τὴν γῆν
  choice: 在地上
  rationale: 介词短语与“倾倒”类动词连用时表示倒向地面或世界；“倒在地上”是自然现代汉语，并保留γῆ可指大地的范围。
theological_decisions:
- issue: 启示录天上场景中ναός的译法
  choice: 圣所
  alternative: 圣殿
  rationale: “圣所”保留ναός偏重内殿、神圣居所的含义；脚注同时说明“圣殿”这一较宽泛而常见的译法。
- issue: θυμός τοῦ θεοῦ的译法
  choice: 上帝烈怒
  alternative: 上帝的愤怒
  rationale: “烈怒”传达末世审判语境中强烈、庄严的神圣忿怒，同时不加入原文之外的教义解释。
- issue: “上帝烈怒的七只碗”中属格关系的表达
  choice: 装着上帝烈怒的七只碗
  alternative: 上帝烈怒的七只碗
  rationale: 结合碗被倾倒的具体意象，将属格自然表达为碗中所装的内容；这使现代读者易懂，同时没有改变审判从碗中倾倒出来的图景。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“从圣所里传出”使声音的来源清楚；直接引语中的“你们去”保留复数命令语气。脚注标记均置于对应词语之后。
