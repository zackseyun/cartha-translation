base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/006.yaml
  text: because they poured out the blood of saints and prophets[a], and you have given them blood to drink[b]; they are worthy.
translation:
  language: zh_hans
  text: 因为他们流了圣徒和先知的血[a]，你也给他们血喝；他们是罪有应得的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“倾倒了圣徒和先知的血。”原文动词字面是“倾倒”，也呼应上下文倾倒碗的审判；这里指流血、杀害。
    reason: lexical_alternative
  - marker: b
    text: “他们是罪有应得的”意为他们配受这样的审判。原文直译为“他们是配得的”，未明说所配得的对象。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 引出对上一节宣告的原因，直接保留因果关系。
- source_word: αἷμα
  choice: 血
  rationale: 两处均直译，并借重复凸显与所流之血相称的审判。
- source_word: ἁγίων
  choice: 圣徒
  rationale: 在《启示录》中通常指属上帝的圣洁子民；“圣徒”是现代中文圣经语境中自然且通行的表达，并非特指后来受封的某类人。
- source_word: προφητῶν
  choice: 先知
  rationale: 按通常词义翻译，与“圣徒”并列，指明被杀害的人。
- source_word: ἐξέχεαν
  choice: 倾倒
  rationale: 保留ἐκχέω“倒出、倾倒”的具体意象，也呼应上下文中倾倒碗的审判；脚注注明中文更惯用的“流”。
- source_word: αὐτοῖς
  choice: 他们
  rationale: 指向倾倒圣徒和先知之血的人，是“给”的间接宾语。
- source_word: δέδωκας
  choice: 你也给了
  rationale: 希腊语完成时表示已经成就且结果仍然有效；中文以“给了”自然表达已完成的行动，“也”则显明相称回应的关系。
- source_word: πιεῖν
  choice: 喝
  rationale: 作为“给”的目的或补语，译成“给了他们血喝”简洁自然。
- source_word: ἄξιοί εἰσιν
  choice: 他们是配得的
  rationale: 形式上保留原文未明说宾语的评断，也维持庄严而尖锐的司法语气；具体含义在脚注解释。
theological_decisions:
- issue: 报应性公义的表述
  choice: 保留“给了他们血喝；他们是配得的”这一直接、严厉的宣告。
  alternative: 以“你照他们所做的报应他们；这是他们应得的”等解释性措辞弱化血的意象。
  rationale: 原文以重复“血”呈现与罪行相称的审判，不应将其泛化或缓和。“配得”在这里指配受此审判，并非道德上的称许。
- issue: “圣徒”的所指
  choice: 采用“圣徒”，按启示录中的广义理解为属上帝的圣洁子民。
  alternative: 圣洁的人
  rationale: “圣徒”能保留其经文用语和群体称谓，同时不应被理解为后来教会制度中特定的封圣类别。
- issue: ἄξιοί εἰσιν省略宾语所形成的张力
  choice: 正文译作“他们是配得的”，不补出“这审判”。
  alternative: 他们配受这样的惩罚／这是他们应得的
  rationale: 原文只作评断而未明说所配得的对象；正文保留这种凝练表达，脚注再说明语境含义。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。保留“倾倒……血”的不寻常搭配，以承载原文意象及上下文呼应，并用脚注提供更惯用的中文说法。正文中的两个脚注标记均已对应列出。
