  rationale: 修订以自然的现代书面普通话表达流血杀害的含义，同时在脚注保留原文“倾倒”的词汇意象和与碗灾的关联。末句改为惯用的司法性表达，消除“配得”在汉语中的正面歧义；脚注说明原文省略宾语，避免将解释性对象硬性写入正文。
