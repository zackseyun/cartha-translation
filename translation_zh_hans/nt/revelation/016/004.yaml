source:
  edition: SBLGNT
  text: Καὶ ὁ τρίτος ἐξέχεεν τὴν φιάλην αὐτοῦ εἰς τοὺς ποταμοὺς ⸀καὶ τὰς πηγὰς τῶν ὑδάτων· καὶ ἐγένετο αἷμα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/004.yaml
  text: And the third poured out his bowl into the rivers and the springs of water[a], and it became blood.
translation:
  language: zh_hans
  text: 第三位把自己的碗倒入江河和水泉[a]，水就变成了血。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文末句直译为“就成了血”；动词是单数，主语没有明说，可理解为这些地方的水总体。
    reason: 说明原文省略主语及单数动词所保留的集合意义，避免正文补出的“水”被误认为原文明说。
lexical_decisions:
- source_word: ὁ τρίτος
  choice: 第三位
  rationale: 希腊文只有带冠词的序数词“第三位”，所指名词由上下文补足。中文用“第三位”可以自然保留这一省略，不在正文中增添“天使”。
- source_word: ἐξέχεεν
  choice: 倒入
  rationale: ἐκχέω表示把液体倾倒出去；结合介词εἰς及其宾语，译作“倒入”既自然，也清楚表达碗中之物被倾倒到江河和水泉中。
- source_word: τὴν φιάλην αὐτοῦ
  choice: 自己的碗
  rationale: φιάλη指碗状或浅盘状容器，现代汉语译作“碗”准确而清楚；反身形式“自己的”自然表达αὐτοῦ与主语的所属关系。
- source_word: εἰς τοὺς ποταμοὺς καὶ τὰς πηγὰς τῶν ὑδάτων
  choice: 倒入江河和水泉
  rationale: ποταμοί为江河，πηγαί为泉或水源；“水泉”简洁保留泉水涌出处的具体意象。εἰς表达朝向并进入，故与动词合译为“倒入”。
- source_word: καὶ ἐγένετο αἷμα
  choice: 水就变成了血
  rationale: 原文动词为单数，主语没有明说，αἷμα为表语。“水”按紧邻短语“水泉”及整体语境补出，既符合现代汉语，又把江河与水泉中的水作为集合整体理解；脚注保留原文无明示主语的形式。
theological_decisions:
- issue: ἐγένετο的隐含主语
  choice: 把隐含主语理解为江河和水泉中的水，正文译作“水就变成了血”
  alternative: 不补主语，直译作“就成了血”；或以复数理解为“它们就变成了血”
  rationale: 希腊文使用单数动词且未明说主语，可能概括前述各处的水。中文若完全省略主语略显突兀，而补作集合意义的“水”既不扩大审判范围，也不把单数强改为复数；脚注说明较直译的形式，以保留语法上的含混。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“第三位”保留原文省略，“碗”“江河”“水泉”均为普通读者容易理解且贴近原文意象的用语。
