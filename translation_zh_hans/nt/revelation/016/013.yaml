  text: καὶ εἶδον ἐκ τοῦ στόματος τοῦ δράκοντος καὶ ἐκ τοῦ στόματος τοῦ θηρίου καὶ ἐκ τοῦ στόματος τοῦ ψευδοπροφήτου πνεύματα ⸂τρία ἀκάθαρτα⸃ ὡς βάτραχοι·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/013.yaml
  text: And I saw three unclean spirits like frogs coming out of the mouth of the dragon[a], out of the mouth of the beast, and out of the mouth of the false prophet.
translation:
  language: zh_hans
  text: 我看见三个污秽的灵，像青蛙，从龙的口中、兽的口中和假先知的口中出来。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我看见从龙的口中、兽的口中和假先知的口中出来的三个污秽的灵，像青蛙。”希腊原文先列出三个来源短语，然后才提到“三个污秽的灵”。
    reason: 句序与译法备选
lexical_decisions:
- source_word: εἶδον
  choice: 我又看见
  rationale: 用简明的叙事过去表达异象中的所见；“又”承接 καί 在连续异象叙事中的推进作用。
- source_word: ἐκ τοῦ στόματος
  choice: 从……的口中出来
  rationale: ἐκ 表示来源；汉语补出“出来”，自然呈现这些灵由三者口中而出的关系，同时不增加原文没有的具体动作方式。
- source_word: δράκοντος
  choice: 龙
  rationale: 保留《启示录》中已经确立的象征形象，采用现代中文通行译法。
- source_word: θηρίου
  choice: 兽
  rationale: 保留 θηρίον 的末世异象意象，不弱化为一般的“动物”。
- source_word: ψευδοπροφήτου
  choice: 假先知
  rationale: 准确表达复合词“虚假的先知”，也是自然、通行的现代中文称谓。
- source_word: πνεύματα
  choice: 灵
  rationale: 此处指灵界实体；“灵”既准确又避免提前加入下一节才明确说明的“鬼魔”身份。
- source_word: τρία ἀκάθαρτα
  choice: 三个污秽的
  rationale: “污秽”保留 ἀκάθαρτα 所含的礼仪及道德—属灵色彩；按自然汉语置于“灵”之前。
- source_word: ὡς βάτραχοι
  choice: 好像青蛙
  rationale: ὡς 表示比拟而非等同；“好像青蛙”自然地保留异象中的明喻。
theological_decisions:
- issue: 污秽之灵在异象中的性质
  choice: 译作“三个污秽的灵，好像青蛙”，不作寓意扩写
  alternative: 译作“三个形似青蛙的鬼魔之灵”
  rationale: 本节只称它们为“污秽的灵”并以青蛙作比；下一节才明确其鬼魔性质，因此本节保留原文的渐进揭示与张力。
- issue: 三个来源短语与所见对象的句法关系
  choice: 在主文中将“三个污秽的灵”提前，再以“从……出来”说明来源
  alternative: 严格照希腊语次序，先列出三个“从……口中”，再说看见三个污秽的灵
  rationale: 希腊语将三个来源短语前置；现代汉语若完全照排会显得滞重。主文调整语序以求清楚自然，并用脚注保存原文次序的信息。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“龙、兽、假先知、污秽的灵”等表达保持《启示录》的异象色彩；句序适度调整，使三个来源及其共同谓语在汉语中清楚流畅。
