  naturalness: ‘他们仍不从自己的行为中悔改’较生硬，且‘仍’并非原文明确表达，虽可由上下文推知，但不必加入。调整后语句庄重、自然，并保留原文的简洁对照。
  terminology: ‘亵渎’、‘天上的上帝’、‘疼痛’、‘疮’和‘悔改’均适合本节的启示文学语域。原脚注标记未附在各自所说明的词语上；修订后分别锚定‘亵渎’、‘疮’及末句的悔改表达。
