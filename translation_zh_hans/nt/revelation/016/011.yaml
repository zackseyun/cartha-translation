id: REV.16.11
reference: Revelation 16:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἐβλασφήμησαν τὸν θεὸν τοῦ οὐρανοῦ ἐκ τῶν πόνων αὐτῶν καὶ ἐκ τῶν ἑλκῶν αὐτῶν, καὶ οὐ μετενόησαν ἐκ τῶν ἔργων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/011.yaml
  text: And they blasphemed the God of heaven because of their pains and their sores[c][b][a], and they did not repent of their deeds.
translation:
  language: zh_hans
  text: 他们因自己的疼痛和疮[b]，亵渎[a]天上的上帝；他们也没有悔改，离弃自己的行为[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亵渎”也可译为“辱骂”或“说毁谤的话”。
    reason: lexical_alternative
  - marker: b
    text: “疮”也可译为“溃疡”。
    reason: lexical_alternative
  - marker: c
    text: 直译：“没有从自己的行为中悔改。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβλασφήμησαν
  choice: 亵渎
  rationale: 该词在这里以神为对象，指以毁谤、不敬的话冒犯神；“亵渎”保留了明确的宗教语义和启示文学的庄重语气。
- source_word: τὸν θεὸν τοῦ οὐρανοῦ
  choice: 天上的上帝
  rationale: 忠实表达属格限定，并采用现代汉语中自然、庄重的圣经称谓；这里不是泛指一位“天神”。
- source_word: ἐκ τῶν πόνων αὐτῶν
  choice: 因自己的疼痛
  rationale: 此处ἐκ在语境中表示原因；πόνος指强烈的疼痛或痛苦，而非劳作。
- source_word: ἑλκῶν
  choice: 疮
  rationale: ἕλκος可指疮、溃疡或创口；“疮”简洁自然，也与灾祸语境相符而不过度作医学限定。
- source_word: μετενόησαν
  choice: 悔改
  rationale: 在《启示录》中，该词具有道德和宗教上的回转含义，不只是改变想法。
- source_word: ἐκ τῶν ἔργων αὐτῶν
  choice: 从自己的行为中悔改
  rationale: 保留ἐκ所表达的离开、转离之意，同时用现代汉语可理解的“行为”表达ἔργα，避免“工作”可能造成的误解。
theological_decisions:
- issue: 三个ἐκ短语的语义作用
  choice: 前两个译为痛苦与疮导致亵渎的原因，最后一个保留从其行为中转离的含义
  alternative: 三个短语一律按字面译作“从/出于”
  rationale: 上下文强调人在审判的痛苦中仍以亵渎回应，而不悔改；同一介词与不同动词搭配时承担不同语义功能。这样处理符合希腊语习惯，也不额外说明其行为的具体性质。
- issue: 是否在译文中强化持续顽梗
  choice: 以“仍不”自然表达灾祸之下依旧不悔改
  alternative: 只译“并不悔改”
  rationale: καί连接前后反应，语境形成“遭受痛苦却仍不悔改”的对照；“仍”使汉语关系清楚，但没有加入行为时间或预定论等解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“疼痛和疮”保留两个并列原因；分号呈现亵渎与不悔改这两个紧密相连的反应。脚注标记均置于相关词句之后。
