  to: 他们因自己的疼痛和疮[b]，亵渎[a]天上的上帝；他们也没有悔改，离弃自己的行为[c]。
  rationale: 修订保留原文中痛苦和疮作为亵渎的原因、‘天上的上帝’这一庄重称谓，以及悔改须转离自身行为的含义。改写末句以符合现代标准汉语，并移正全部脚注锚点；未增添对行为内容或神学意义的解释。
