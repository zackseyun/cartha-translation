id: REV.16.17
reference: Revelation 16:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ ὁ ἕβδομος ἐξέχεεν τὴν φιάλην αὐτοῦ ἐπὶ τὸν ἀέρα— καὶ ἐξῆλθεν φωνὴ μεγάλη ⸀ἐκ τοῦ ⸀ναοῦ ἀπὸ τοῦ θρόνου λέγουσα· Γέγονεν—
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/017.yaml
  text: And the seventh poured out his bowl into the air[a], and a loud voice came out from the sanctuary, from the throne, saying[b], “It has come to pass.”
translation:
  language: zh_hans
  text: 第七位把他的碗倒在空中。于是，有响亮的声音从圣所[a]、从宝座那里传出来，说：“成了！”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“圣殿”。希腊语ναός通常指圣所或圣殿本体，而不是整个圣殿区域。
    reason: lexical_alternative
  - marker: b
    text: 或译“已经发生了”。
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἕβδομος
  choice: 第七位
  rationale: 原文只有带冠词的序数词，并未明说“天使”；上下文足以确定所指，因此保留省略。
- source_word: ἐξέχεεν
  choice: 倒
  rationale: 符合把碗中之物倾倒出来的语境，也与本章七碗的重复句式自然衔接。
- source_word: φιάλην
  choice: 碗
  rationale: 指宽口器皿；“碗”是现代汉语中自然、清楚的对应词，避免使用容易误解为瓶子的译法。
- source_word: ἐπὶ τὸν ἀέρα
  choice: 在空中
  rationale: ἐπί加宾格用于倾倒动作之后，表示倾倒所及的领域；现代汉语以“倒在空中”表达较自然。
- source_word: ἐξῆλθεν φωνὴ μεγάλη
  choice: 有宏亮的声音……传出
  rationale: “宏亮”表达声音大而有威势；“传出”保留ἐξῆλθεν所表示的由内向外。
- source_word: ἐκ τοῦ ναοῦ
  choice: 从圣所
  rationale: ναός特指圣殿中的圣所，而非整个圣殿范围。
- source_word: ἀπὸ τοῦ θρόνου
  choice: 从宝座那里
  rationale: 保留原文与“从圣所”并列的第二重来源说明，不将两者合并。
- source_word: λέγουσα
  choice: 说
  rationale: 阴性分词与“声音”一致，汉语自然译作“说”。
- source_word: Γέγονεν
  choice: 成了
  rationale: 完成时表达事情已经发生并达到完成状态；“成了”简洁、庄重，也保留完成宣告的力度。
theological_decisions:
- issue: 天上圣殿意象中ναός的译法
  choice: 圣所
  alternative: 圣殿
  rationale: 这是词义范围的选择，而非教义推断；“圣所”保留ναός相对于ἱερόν更具体的含义。
- issue: Γέγονεν所表达的完成宣告
  choice: 成了
  alternative: 已经实现了；事情已经发生了
  rationale: “成了”兼顾完成时的结果状态与末世审判达到终点的语气，但不说明究竟是哪一事件“成了”，从而保留原文的简略和张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“第七位”保留原文对“天使”的省略；“从圣所、从宝座那里”保留两个并列来源短语；末句用简短有力的“成了”再现宣告语气。
