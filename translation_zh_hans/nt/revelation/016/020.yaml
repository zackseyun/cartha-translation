  yaml_path: translation/nt/revelation/016/020.yaml
  text: And every island fled[a], and mountains were not found.
translation:
  language: zh_hans
  text: 所有岛屿都逃走了[a]，山岭也无处可寻。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“消失了。”希腊语动词的字面意思是“逃走了”，保留了本节鲜明的拟人手法。
    reason: 词义替代译法
lexical_decisions:
- source_word: πᾶσα νῆσος
  choice: 所有岛屿
  rationale: 单数名词νῆσος与πᾶσα连用，表达逐一涵盖的整体意义；现代汉语以“所有岛屿”自然传达每一座岛的含义。
- source_word: ἔφυγεν
  choice: 逃走了
  rationale: 保留φεύγω“逃离、逃走”的本义及启示文学中鲜明的拟人化图景，不直接释为“消失了”。
- source_word: ὄρη
  choice: 众山
  rationale: 以“众山”简洁表达无冠词复数ὄρη，语体庄重而不额外限定为某一组山。
- source_word: οὐχ εὑρέθησαν
  choice: 不见了
  rationale: 对应εὑρίσκω被动式“未被找到”；“不见了”在现代汉语中自然表达再也找不到的结果，同时避免生硬的“未被找到”。
- source_word: καὶ ... καὶ
  choice: ……，……也……
  rationale: 用汉语并列结构保留两项灾变图景的累加关系；第二个καί译作“也”。
theological_decisions:
- issue: 是否把末世异象中的宇宙性图景解释为字面消失或象征性崩塌
  choice: 保留“岛屿逃走、众山不见”的具体异象，不判定其字面或象征性质
  alternative: 直接译作“所有岛屿都消失了，群山也荡然无存”
  rationale: 原文以具体而拟人化的语言描写异象；译文应保存这一张力，把其所指是字面还是象征留给解释。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“逃走了”刻意保留原文拟人化；“不见了”较“未被找到”更符合自然汉语，并传达无从寻见的结果。
