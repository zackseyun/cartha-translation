id: REV.16.12
reference: Revelation 16:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ ὁ ἕκτος ἐξέχεεν τὴν φιάλην αὐτοῦ ἐπὶ τὸν ποταμὸν τὸν μέγαν ⸀τὸν Εὐφράτην· καὶ ἐξηράνθη τὸ ὕδωρ αὐτοῦ, ἵνα ἑτοιμασθῇ ἡ ὁδὸς τῶν βασιλέων τῶν ἀπὸ ἀνατολῆς ἡλίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/012.yaml
  text: And the sixth poured out his bowl on the great river Euphrates[a], and its water was dried up, so that the way of the kings from the rising of the sun might be prepared.
translation:
  language: zh_hans
  text: 第六位把他的碗倒在幼发拉底大河上；河水就干了，为要给那些从日出之地而来的王预备道路。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可较简洁地译作“从东方而来的王”。原文直译为“从太阳升起之处而来的王”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἕκτος
  choice: 第六位
  rationale: 希腊文只有带冠词的序数词，承接上下文中倒碗者；不在正文补出“天使”，以保留原文省略。
- source_word: ἐξέχεεν
  choice: 把……倒在……上
  rationale: ἐκχέω在此指将碗中之物倾倒出来；“倒在……上”自然清楚，并保留审判意象。
- source_word: φιάλην
  choice: 碗
  rationale: φιάλη指宽而浅的盛器；现代汉语“碗”准确自然，不采用易使人联想到小瓶的译法。
- source_word: ἐπὶ τὸν ποταμὸν τὸν μέγαν τὸν Εὐφράτην
  choice: 在幼发拉底大河上
  rationale: 按现代汉语地名习惯表达同位结构，同时保留“大河”这一修饰语。
- source_word: ἐξηράνθη
  choice: 干了
  rationale: 此处不及物结果表达在汉语中自然承载希腊文被动式“被弄干、干涸”的事件与结果，无须生硬译作“被弄干”。
- source_word: τὸ ὕδωρ αὐτοῦ
  choice: 河水
  rationale: 代词所指明确为幼发拉底河；“河水”比“它的水”更符合现代汉语，同时不改变所指。
- source_word: ἵνα ἑτοιμασθῇ
  choice: 为要……预备
  rationale: 保留ἵνα从句的目的含义，并用自然而庄重的汉语表达被动语义。
- source_word: ἡ ὁδὸς τῶν βασιλέων
  choice: 给……王预备道路
  rationale: 汉语采用受益者结构比直译“王的道路”更自然；“道路”仍可兼容异象中的实际与象征意味。
- source_word: τῶν ἀπὸ ἀνατολῆς ἡλίου
  choice: 那些从日出之地而来的
  rationale: 保留“太阳升起”这一鲜明意象，同时以“日出之地”构成自然、庄重的汉语；脚注说明可简译为“东方”。
theological_decisions:
- issue: 是否明确补出“第六位”是天使
  choice: 正文仅译“第六位”
  alternative: 第六位天使
  rationale: 上下文可确定其为天使，但本节希腊文本身没有重复该名词；不补出可更忠实地保留原文省略。
- issue: 是否在译文中解释幼发拉底河干涸和众王来临的象征意义
  choice: 直接呈现异象，不作解释性扩写
  alternative: 加入入侵、末世集结等象征解释
  rationale: 本节没有自行说明这些意象的全部意义；译文应保留启示文学的张力，不以特定解释取代原文。
translation_notes:
  register: 采用现代、庄重且易懂的简体中文。“第六位”保留原文省略；“日出之地”保留启示文学的图像感。脚注标记置于完整相关表述之后。
