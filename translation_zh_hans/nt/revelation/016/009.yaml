id: REV.16.9
reference: Revelation 16:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἐκαυματίσθησαν οἱ ἄνθρωποι καῦμα μέγα· καὶ ⸀ἐβλασφήμησαν τὸ ὄνομα τοῦ θεοῦ τοῦ ἔχοντος ⸀τὴν ἐξουσίαν ἐπὶ τὰς πληγὰς ταύτας, καὶ οὐ μετενόησαν δοῦναι αὐτῷ δόξαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/009.yaml
  text: And the people were scorched with great heat[a], and they blasphemed the name of God, who has authority over these plagues[b], and they did not repent to give him glory.
translation:
  language: zh_hans
  text: 人们被酷热灼伤[a]，并亵渎了那位对这些灾祸有权柄的上帝的名；他们却不悔改，不把荣耀归给他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“被猛烈的高温灼烧”。
    reason: καῦμα μέγα 可较展开地表达为强烈或猛烈的高温；正文用“酷热”以求简洁自然。
lexical_decisions:
- source_word: ἐκαυματίσθησαν
  choice: 被……灼伤
  rationale: 该词是 καυματίζω 的不定过去时被动式，表示受到高热灼烧；“灼伤”在现代汉语中自然，也没有夸大为完全烧毁。
- source_word: οἱ ἄνθρωποι
  choice: 人们
  rationale: 此处泛指受审判的人类，并非特指男性；“人们”准确表达其集合性和包容性。
- source_word: καῦμα μέγα
  choice: 酷热
  rationale: μέγα 在这里强调热力的强烈程度；“酷热”简洁自然地表达强烈高温，并与“灼伤”搭配顺畅。
- source_word: ἐβλασφήμησαν
  choice: 亵渎了
  rationale: 对象是上帝的名，因此“亵渎”保留了该词关于冒犯、辱骂神圣者的宗教分量。
- source_word: τὸ ὄνομα τοῦ θεοῦ
  choice: 上帝的名
  rationale: 保留原文的圣经惯用表达，其中“名”关乎上帝所启示的身份与尊荣。
- source_word: τοῦ ἔχοντος τὴν ἐξουσίαν ἐπὶ τὰς πληγὰς ταύτας
  choice: 上帝有权掌管这些灾祸
  rationale: ἔχοντος 为现在分词，ἐξουσία 表示权柄或支配权；拆成分句可在现代汉语中清楚表达修饰关系，同时保留上帝对这些灾祸拥有权柄的直接陈述。
- source_word: πληγὰς
  choice: 灾祸
  rationale: 在《启示录》的审判语境中，该词指降下的灾殃；“灾祸”自然，并保留与出埃及灾难叙事的呼应。
- source_word: οὐ μετενόησαν
  choice: 不悔改
  rationale: 在审判语境中，μετανοέω 表示道德和属灵上的悔改，而不只是改变想法。
- source_word: δοῦναι αὐτῷ δόξαν
  choice: 把荣耀归给他
  rationale: 这一表达保留了原文“给他荣耀”的具体圣经意象，也符合现代汉语的敬拜用语。
theological_decisions:
- issue: οἱ ἄνθρωποι 的指称范围
  choice: 采用包容性的泛指“人们”
  alternative: “男人们”
  rationale: 上下文描述受审判的人类，并无仅限男性的依据；译作“男人们”会造成原文没有的性别限制。
- issue: 上帝与这些灾祸的关系
  choice: 明确译为“上帝有权掌管这些灾祸”
  alternative: 仅含糊表达上帝与灾祸有关
  rationale: 原文明确使用 ἐξουσία，直接宣称上帝对这些灾祸拥有权柄；译文不淡化这一陈述，也不在经文之外加以扩展。
- issue: 悔改与归荣耀给上帝的关系
  choice: 保留“不悔改，不把荣耀归给他”的并列兼目的关系
  alternative: 解释为只有先归荣耀才算悔改，或把两者完全割裂
  rationale: δοῦναι 可说明悔改所应导向的行动，但原文没有进一步界定二者的系统关系；译文保留这种紧密联系而不作额外教义解释。
translation_notes:
  register: 采用庄重而通俗的现代标准汉语。“人们”避免误解为仅指男性；将较长的希腊语属格修饰语拆为分句，使“上帝有权掌管这些灾祸”清晰易懂。保留“上帝的名”“悔改”“把荣耀归给他”等圣经核心表达。
