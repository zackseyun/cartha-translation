  text: καὶ ἐγένετο ἡ πόλις ἡ μεγάλη εἰς τρία μέρη, καὶ αἱ πόλεις τῶν ἐθνῶν ἔπεσαν· καὶ Βαβυλὼν ἡ μεγάλη ἐμνήσθη ἐνώπιον τοῦ θεοῦ δοῦναι αὐτῇ τὸ ποτήριον τοῦ οἴνου τοῦ θυμοῦ τῆς ὀργῆς αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/019.yaml
  text: And the great city was split into three parts[a], and the cities of the nations fell. And Babylon the great was remembered before God, to give her the cup of the wine of the fury of his wrath.
translation:
  language: zh_hans
  text: 那大城裂成三部分，列国的城倒塌了。大巴比伦也在神面前被记起[a]，为要把盛着他愤怒的烈怒之酒的杯给她。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在神面前被想起。”这是圣经中的惯用表达，指她受到神的注意，要接受审判。
    reason: 说明“被记起”的字面译法及其审判语境，避免读者误以为神先前遗忘了巴比伦。
lexical_decisions:
- source_word: ἐγένετο ἡ πόλις ἡ μεγάλη εἰς τρία μέρη
  choice: 那大城裂成三部分
  rationale: ἐγένετο与εἰς τρία μέρη构成结果表达，直译为“成为三部分”，实际描写城被分裂后的状态；“裂成三部分”在现代汉语中清楚而保留异象的力度。
- source_word: αἱ πόλεις τῶν ἐθνῶν
  choice: 列国的城
  rationale: ἔθνη在普世审判语境中指众国；“列国”简洁、庄重，也避免把此处限定为族群意义上的“外邦人”。
- source_word: ἔπεσαν
  choice: 倒塌了
  rationale: πίπτω字面为“倒下”，用于城市时“倒塌”是自然汉语，同时保留毁灭性的图景。
- source_word: Βαβυλὼν ἡ μεγάλη
  choice: 大巴比伦
  rationale: 保留启示录中反复出现的象征性名称和“大”这一称号。
- source_word: ἐμνήσθη ἐνώπιον τοῦ θεοῦ
  choice: 在神面前被记起
  rationale: 贴近希腊文的被动式圣经惯用语，不直接改写成“神审判她”，从而让上下文显明这次记念是为了施行审判。
- source_word: δοῦναι αὐτῇ
  choice: 为要把……给她
  rationale: 将不定式表达为目的，保持它与“被记起”之间的逻辑联系；施予者由“神”及代词“他”自然确定。
- source_word: τὸ ποτήριον τοῦ οἴνου
  choice: 盛着……之酒的杯
  rationale: 保留“酒”与“杯”的审判意象，并用“盛着”使层叠属格在汉语中更易理解。
- source_word: τοῦ θυμοῦ τῆς ὀργῆς αὐτοῦ
  choice: 他愤怒所发烈怒
  rationale: 分别以“烈怒”和“愤怒”表达θυμός与ὀργή，避免把两个相关但有区别的词压缩为一个，同时用“所发”形成自然的汉语关系。
theological_decisions:
- issue: 如何翻译ἐμνήσθη ἐνώπιον τοῦ θεοῦ这一审判惯用语
  choice: 在神面前被记起
  alternative: 神想起了她，要审判她
  rationale: 所选译法保留原文的被动表达和圣经式“记念”语言，不把其司法含义直接写进正文；随后赐下烈怒之杯的语境已经表明这是为审判而记起。
- issue: 是否区分θυμός与ὀργή
  choice: 他愤怒所发烈怒
  alternative: 他的烈怒
  rationale: 原文连续使用两个怒气词来加强审判的力度。译文保留两个对应表达，既不将其合并，也不主张二者之间存在原文未明确界定的神学区分。
translation_notes:
  register: 采用现代、庄重而可朗读的书面汉语。“列国”“烈怒之酒”等措辞保留启示文学的宏大意象；脚注标记放在其实际说明的“被记起”之后。
