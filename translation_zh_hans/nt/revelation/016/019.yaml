revisions:
- from: 那大城裂成三部分，列国的城也都倒塌了。大巴比伦也在神面前被记起[a]，为要把盛着他愤怒所发烈怒之酒的杯给她。
  to: 那大城裂成三部分，列国的城倒塌了。大巴比伦也在神面前被记起[a]，为要把盛着他愤怒的烈怒之酒的杯给她。
  rationale: 修订只处理末句属格关系的过度解释和“都”的轻微强化。正文继续保留“愤怒”与“烈怒”两个对应词，并维持原文的审判意象、句法推进和脚注锚点。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:21:02Z'
