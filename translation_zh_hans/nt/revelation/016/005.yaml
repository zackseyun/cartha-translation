  text: καὶ ἤκουσα τοῦ ἀγγέλου τῶν ὑδάτων λέγοντος· Δίκαιος εἶ, ὁ ὢν καὶ ὁ ἦν, ⸀ὁ ὅσιος, ὅτι ταῦτα ἔκρινας,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/005.yaml
  text: And I heard the angel of the waters saying[a], “Righteous are you, the one who is and who was, the Holy One[c][b], because you have judged these things.”
translation:
  language: zh_hans
  text: 我听见那位管辖众水的天使[a]说：“那今在、昔在的圣者啊，你是公义的，因为你审判了这些事。”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“众水的天使”，也可译“与众水有关的天使”。这里可能指负责或管辖众水的天使。
    reason: lexical_alternative
  - marker: b
    text: 有些抄本在“今在、昔在”之后有“以后要来的”等较长表述，可能是依照《启示录》其他地方的类似称号而作的协调。这里所依据的正文读作“今在、昔在的圣者”。
    reason: textual_variant
lexical_decisions:
- source_word: τοῦ ἀγγέλου τῶν ὑδάτων
  choice: 掌管众水的天使
  rationale: 该属格结构直译为“众水的天使”，在本段语境中表示与众水相关、负责众水的天使。汉语译作“掌管众水的天使”更自然，也清楚表达其可能的职分；脚注保留较形式对应的译法。
- source_word: Δίκαιος
  choice: 公义的
  rationale: δίκαιος兼有“公义、正直、公正”之意；这里称颂上帝审判中的道德正直，译为“公义的”符合庄重的颂赞语体，又不把含义局限于司法公平。
- source_word: ὁ ὢν καὶ ὁ ἦν
  choice: 今在、昔在的
  rationale: 保留启示录中公式化的神圣称号，并按现代汉语压缩表达。原文此处没有“以后要来的”，故不补入。
- source_word: ὁ ὅσιος
  choice: 圣者
  rationale: ὅσιος在此指上帝的圣洁与道德纯全，并以带冠词的名词性称号出现；“圣者”既简洁庄重，也区别于通常对应ἅγιος的表达。
- source_word: ὅτι
  choice: 因为
  rationale: 明确表达其因果作用：上帝作出这些审判，正是天使宣告他公义的理由。
- source_word: ταῦτα
  choice: 这些审判
  rationale: ταῦτα字面为“这些事”，但与ἔκρινας连用并承接本章的审判行动，汉语译为“这些审判”能自然表达所指，不改变其语境意义。
- source_word: ἔκρινας
  choice: 作出了……审判
  rationale: 该不定过去时指已经实施的审判行动；“作出了这些审判”在现代汉语中庄重自然，并保留完成行动的语感。
theological_decisions:
- issue: 神圣称号中没有通常所见的未来成分
  choice: 今在、昔在的圣者
  alternative: 今在、昔在、以后要来的那一位
  rationale: SBLGNT正文为ὁ ὢν καὶ ὁ ἦν, ὁ ὅσιος，包含“今在、昔在”与“圣者”，却没有“以后要来的”。正文遵从所给希腊文本，不按启示录其他经节的较长公式加以协调；异文见脚注。
- issue: ὁ ὅσιος与前一称号的句法关系
  choice: 将“圣者”作为呼格式神圣称号，与“今在、昔在的”连读
  alternative: 你是公义的；你是今在、昔在的那一位，是圣者
  rationale: 希腊文在称呼上帝的颂赞中允许主格形式承担呼格功能。此译法保留其称号性质和颂赞语气，不把“圣者”误解为对天使的描述。
translation_notes:
  register: 采用现代、庄重而易懂的颂赞语体。“今在、昔在”保留启示录神圣称号的辨识度；以“圣者啊”明确呼语关系。正文用“掌管众水”实现自然汉语，脚注注明希腊属格的较直译表达。
