  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ ὁ πέμπτος ἐξέχεεν τὴν φιάλην αὐτοῦ ἐπὶ τὸν θρόνον τοῦ θηρίου· καὶ ἐγένετο ἡ βασιλεία αὐτοῦ ἐσκοτωμένη, καὶ ἐμασῶντο τὰς γλώσσας αὐτῶν ἐκ τοῦ πόνου,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/010.yaml
  text: And the fifth poured out his bowl on the throne of the beast[a], and its kingdom became darkened, and they were gnawing their tongues because of the pain[b],
translation:
  language: zh_hans
  text: 第五位把自己的碗倒在兽的宝座上，兽的国度就变得黑暗了；他们因疼痛而咬着自己的舌头。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ πέμπτος
  choice: 第五位
  rationale: 原文只有带冠词的序数词“第五位”，上下文虽暗示是第五位天使，本节却没有明说，因此正文不补出“天使”。“位”使现代汉语表达自然。
- source_word: ἐξέχεεν τὴν φιάλην αὐτοῦ
  choice: 把自己的碗倒在
  rationale: “倒”自然表达ἐκχέω的倾倒动作；φιάλη指盛物的浅碗，用现代汉语“碗”比传统而易误解的器皿名称更清楚。“自己的”明确碗属于执行动作的第五位。
- source_word: ἐπὶ τὸν θρόνον τοῦ θηρίου
  choice: 在兽的宝座上
  rationale: ἐπί加宾格在此表示倾倒所及之处；“兽”和“宝座”保留《启示录》的末世异象用语。
- source_word: ἡ βασιλεία αὐτοῦ
  choice: 兽的国度
  rationale: βασιλεία在此指兽统治的国度或权域。重复“兽的”既符合汉语，也避免使用代词时不必要地决定拟人化程度。
- source_word: ἐγένετο … ἐσκοτωμένη
  choice: 就变得黑暗了
  rationale: γίνομαι与完成时被动分词共同表示进入并处于被变黑的状态；“变得黑暗了”保留状态变化及其结果，不额外加入“陷入”等形象化措辞。
- source_word: ἐμασῶντο τὰς γλώσσας αὐτῶν
  choice: 咬着自己的舌头
  rationale: 未完成时表示持续进行的动作，“咬着”体现这一延续性；中间语态结合所有格自然译为“自己的舌头”。
- source_word: ἐκ τοῦ πόνου
  choice: 因疼痛
  rationale: ἐκ在这里表示原因或来源；“因疼痛”简洁、自然地传达“由于疼痛”。
theological_decisions:
- issue: 兽与其国度的指称及拟人化程度
  choice: 兽的国度
  alternative: 它的国度／他的国度
  rationale: 希腊语θηρίον为中性名词，但汉语代词选择可能引入是否拟人的判断。直接重复“兽的”忠实保留所指，又不额外决定其人格化程度。
- issue: 黑暗审判的表达强度
  choice: 变得黑暗了
  alternative: 陷入了黑暗
  rationale: 原文以被动分词陈述变黑后的状态，并未另外使用“陷入”的比喻；正文采取较直接的表达，保留审判的力度而不作扩写。
- issue: 受痛者的身份
  choice: 人们
  alternative: 他们／兽国中的人
  rationale: 原文仅以第三人称复数动词和物主代词指称受痛者，没有在本句明说其具体身份。“人们”提供汉语所需的显性主语，同时不把他们进一步限定为某一群体。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留“第五位”而不补“天使”，并用“咬着”呈现未完成时的持续动作。经由重复名词避免汉语代词造成不必要的拟人化解释；本节无需脚注。
