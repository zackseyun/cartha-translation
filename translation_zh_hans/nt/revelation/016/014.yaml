id: REV.16.14
reference: Revelation 16:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἰσὶν γὰρ πνεύματα δαιμονίων ποιοῦντα σημεῖα, ἃ ἐκπορεύεται ἐπὶ τοὺς βασιλεῖς τῆς οἰκουμένης ὅλης, συναγαγεῖν αὐτοὺς εἰς τὸν πόλεμον τῆς ⸀ἡμέρας τῆς μεγάλης τοῦ θεοῦ τοῦ παντοκράτορος—
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/014.yaml
  text: For they are spirits of demons[a], performing signs, which go out to the kings of the whole world[b], to gather them for the battle of the great day of God the Almighty—
translation:
  language: zh_hans
  text: 因为它们是鬼魔的灵[a]，施行神迹；它们到全世界众王那里去[b]，要把众王召集起来，参加全能的上帝大日的争战——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“邪灵”。原文也可较直译为“鬼魔的诸灵”。
    reason: 说明πνεύματα δαιμονίων中属格结构既可按描述性意义自然表达为“邪灵”，也可保留较字面的“鬼魔的灵”。
  - marker: b
    text: 直译：“整个有人居住的世界的众王”。
    reason: 说明οἰκουμένη的字面含义是“有人居住的世界”，主文以自然汉语译为“全世界”。
lexical_decisions:
- source_word: πνεύματα δαιμονίων
  choice: 鬼魔的灵
  rationale: 保留属格结构及其可能的描述性含义，不把它过早限定为所属关系或来源关系；现代汉语虽略带经文语体，但仍清楚可懂。
- source_word: ποιοῦντα σημεῖα
  choice: 施行神迹
  rationale: 表达“行出具有超自然意义的记号”；不擅自断定这些神迹只是骗术，也不将其等同于出于上帝的神迹。
- source_word: ἃ ἐκπορεύεται
  choice: 这些灵出去
  rationale: 希腊文关系代词为复数，动词却为单数；译文按其复数先行词“灵”表达，并明确所指，使现代汉语自然清楚。
- source_word: ἐπὶ τοὺς βασιλεῖς
  choice: 到……众王那里
  rationale: ἐπί在移动语境中表示趋向；下文召集众王的目的也支持这一理解。
- source_word: τῆς οἰκουμένης ὅλης
  choice: 全世界
  rationale: 在此指整个人类居住的世界，尤其突出普世性的政治范围；“全世界”是自然、通行的现代汉语。
- source_word: συναγαγεῖν
  choice: 要召集
  rationale: 不定式表示这些灵出去的目的；“要召集”直接而自然。
- source_word: εἰς τὸν πόλεμον
  choice: 争战
  rationale: πόλεμος可指战争或具体战役；此处与“召集”及末世大日相连，“争战”既保留冲突规模，也不强行缩窄为单次战役。
- source_word: τῆς ἡμέρας τῆς μεγάλης
  choice: 在……的大日
  rationale: 以自然汉语表达这场争战与“大日”的关联，同时保留启示文学庄严的末世语气。
- source_word: τοῦ θεοῦ τοῦ παντοκράτορος
  choice: 全能者上帝
  rationale: 将παντοκράτωρ作为上帝的称号译为“全能者”，保留原文称号结构和庄严语体。
theological_decisions:
- issue: 鬼魔之灵所施行神迹的性质
  choice: 直译为“施行神迹”，不解释其具体机制
  alternative: 译成“施展骗术”或明确称为与上帝神迹性质相同的超自然作为
  rationale: σημεῖα本身意为具有指示意义的记号或神迹；本节说明其施行者是鬼魔的灵，却没有进一步判定这些作为只是障眼法，还是实际的超自然现象。译文应保留这种张力。
- issue: 争战与“大日”的关系
  choice: 译为“在全能者上帝的大日争战”
  alternative: 译为“为全能者上帝大日的战役而聚集”
  rationale: 希腊文属格链可理解为属于或发生于那大日的争战。中文采用时间关联明确而不过度解释的表达，避免暗示“大日本身就是争战”。
translation_notes:
  register: 采用现代、庄重而清楚的经文语体。“鬼魔的灵”“全能者上帝的大日”“争战”保留启示文学的肃穆感；分号帮助读者辨明“这些灵”是出去并召集众王的主体。句末长破折号保留原段落未完待续的衔接形式。
