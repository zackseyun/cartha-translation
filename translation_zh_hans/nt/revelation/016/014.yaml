revisions:
- from: 因为它们是鬼魔的灵[a]，施行神迹；这些灵出去，到全世界的众王那里[b]，要召集他们，在全能者上帝的大日争战——
  to: 因为它们是鬼魔的灵[a]，施行神迹；它们到全世界众王那里去[b]，要把众王召集起来，参加全能的上帝大日的争战——
  rationale: 修订仅调整汉语句法和称号搭配：明确众王被召集的目的在于参加那场属于全能的上帝大日的争战，并使“παντοκράτωρ”在现代庄重汉语中表达得更自然。未改变鬼魔之灵所行“神迹”的性质，也未对争战的具体性质作额外解释。
