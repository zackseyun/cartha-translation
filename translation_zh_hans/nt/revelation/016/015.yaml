  text: Ἰδοὺ ἔρχομαι ὡς κλέπτης. μακάριος ὁ γρηγορῶν καὶ τηρῶν τὰ ἱμάτια αὐτοῦ, ἵνα μὴ γυμνὸς περιπατῇ καὶ βλέπωσιν τὴν ἀσχημοσύνην αὐτοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/015.yaml
  text: Behold[a], I am coming like a thief. Blessed is the one who stays awake and keeps his garments[b], so that he may not walk about naked and they see his shame—
translation:
  language: zh_hans
  text: “看哪，我来如同贼一样。那警醒[a]并持守自己衣服的人有福了，免得他赤身行走，让人看见他的羞耻[b]——”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“保持清醒”或“警觉守望”。
    reason: lexical_alternative
  - marker: b
    text: 或译“他可耻的暴露”或“他的不体面”；希腊语这个词可指因身体暴露而显出的羞耻。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: 看哪
  rationale: 保留引人注意的感叹语气，也符合《启示录》庄重的警告语体。
- source_word: ἔρχομαι
  choice: 我来
  rationale: 保留希腊语现在时所呈现的鲜明临近感，不把时间含义过度限定为单纯将来。
- source_word: ὡς κλέπτης
  choice: 如同贼一样
  rationale: 明确表达比较关系，强调来临的出人意料，并不暗示品格上的相似。
- source_word: μακάριος
  choice: 有福了
  rationale: 符合祝福宣告的固定语义，保留其神学分量，避免仅表达主观快乐。
- source_word: ὁ γρηγορῶν
  choice: 那警醒……的人
  rationale: 兼顾保持清醒与警觉守望的含义；“警醒”简洁自然，也保留经文中的属灵隐喻空间。
- source_word: τηρῶν
  choice: 持守
  rationale: 表达保有、看守而不失去；与“衣服”搭配时略带庄重感，并保留可能的象征意味。
- source_word: τὰ ἱμάτια αὐτοῦ
  choice: 自己的衣服
  rationale: 准确表达复数衣物的集合概念；现代汉语中“衣服”比“衣裳”更自然，同时不解释其象征意义。
- source_word: ἵνα μὴ
  choice: 免得
  rationale: 简明表达带否定的目的或预防结果，符合本句警告语气。
- source_word: γυμνὸς περιπατῇ
  choice: 赤身行走
  rationale: 保留赤裸与行走的具体图像，不将其提前解释为末世羞辱。
- source_word: βλέπωσιν
  choice: 让人看见
  rationale: 希腊语使用未明说主语的第三人称复数；汉语用泛指的“人”自然地保留主语的不确定性。
- source_word: τὴν ἀσχημοσύνην αὐτοῦ
  choice: 他的羞处
  rationale: “羞处”既可指因裸露而被看见的不体面部位，也保留羞耻含义，比单译“赤裸”更能避免与前文重复。
theological_decisions:
- issue: 衣服、赤身与羞处在启示文学中的象征意义
  choice: 正文保留“衣服”“赤身”“羞处”的具体图像，不作寓意性展开。
  alternative: 将衣服解释为道德上的预备或义行，将赤身解释为末世受辱。
  rationale: 这些图像在《启示录》中很可能具有象征共鸣，但希腊文本本身没有在本节明说具体对应关系；翻译应保留这种神学张力。
- issue: 阳性单数参与者的表达
  choice: 译为“那……的人”，后文用“他”。
  alternative: 改写为复数“那些……的人”，或全句避免性别指称。
  rationale: 原文为阳性单数分词结构，具有代表性和普遍适用性；采用单数形式较忠实地保留其语法和修辞结构。
- issue: 来临如贼的比喻重点
  choice: 译为“我来如同贼一样”，不补充解释。
  alternative: 明译为“我会在人意想不到的时候来”。
  rationale: 原文以比喻表达突然和不可预料；保留比喻可避免把其含义缩减为单一解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”保留启示文学的郑重呼告；“持守”略高于日常口语，以承载原文可能具有的象征分量。句末保留原文破折号，显示话语在上下文中随即转回叙事。
