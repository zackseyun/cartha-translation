  text: καὶ ἤκουσα τοῦ θυσιαστηρίου λέγοντος· Ναί, κύριε, ὁ θεός, ὁ παντοκράτωρ, ἀληθιναὶ καὶ δίκαιαι αἱ κρίσεις σου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/007.yaml
  text: And I heard the altar saying[a], “Yes, Lord God, the Almighty, true and just are your judgments.”
translation:
  language: zh_hans
  text: 我又听见祭坛说[a]：“是的，主上帝，全能者，你的审判真实而公义。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我又听见从祭坛那里有话说。”希腊文可表示所听见之话的来源；不过按句式看，更自然的理解是把祭坛拟人化为说话者。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσα
  choice: 我又听见
  rationale: 不定过去时在叙事中表示一次听见的事件；καί承接上下文，译作“又”。“听见”不额外加入主动聆听的含义。
- source_word: τοῦ θυσιαστηρίου λέγοντος
  choice: 祭坛说
  rationale: 属格结构与ἤκουσα连用可表示听见的来源，而分词λέγοντος直接将“说”归于祭坛。正文保留启示文学中的拟人表达，不增添原文没有的“声音”。
- source_word: Ναί
  choice: 是的
  rationale: 保留强烈肯定及回应语气，是现代汉语中自然、清楚的对应表达。
- source_word: κύριε, ὁ θεός, ὁ παντοκράτωρ
  choice: 主—全能的上帝
  rationale: 保留对上帝的全部称号，并以破折号显示“全能的上帝”与“主”处于同位、直接称呼的关系；避免把三个希腊语成分误读为不同对象。
- source_word: ἀληθιναὶ καὶ δίκαιαι
  choice: 真实而公正
  rationale: 两个谓语形容词共同描述审判。“真实”表达符合实情、可信可靠，“公正”保持司法语域及道德分量。
- source_word: αἱ κρίσεις σου
  choice: 你的审判
  rationale: κρίσεις在此指上帝所作或施行的审判。汉语以集合性的“审判”自然涵盖复数，不必机械加上“各项”。
theological_decisions:
- issue: 祭坛是否被拟人化为说话者
  choice: 正文译为“我又听见祭坛说”
  alternative: “我又听见从祭坛那里有话说”或“我又听见有声音从祭坛发出”
  rationale: 原文以“祭坛”为属格成分，并用“说”的分词修饰它；直接保留祭坛说话的拟人意象最贴近句法和启示文学风格。“从祭坛”在语法上可能，但加入“声音”则超出本节明说的内容。
- issue: 直接称呼中的神圣称号
  choice: “主—全能的上帝”
  alternative: “主上帝，全能者”或“主，全能的上帝”
  rationale: 原文的κύριε、ὁ θεός、ὁ παντοκράτωρ连续同位，均指同一位受称呼者。所选表达完整保留“主”“上帝”“全能者”的内容，同时用自然汉语显示同位关系，不引入宗派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“祭坛说”保留启示文学鲜明的拟人意象；“真实而公正”兼顾自然搭配和审判语境。正文中的[a]与脚注标记一致。
