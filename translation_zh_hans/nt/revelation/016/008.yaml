id: REV.16.8
reference: Revelation 16:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ ὁ ⸀τέταρτος ἐξέχεεν τὴν φιάλην αὐτοῦ ἐπὶ τὸν ἥλιον· καὶ ἐδόθη αὐτῷ καυματίσαι ⸂τοὺς ἀνθρώπους ἐν πυρί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/008.yaml
  text: And the fourth poured out his bowl on the sun[a], and it was given to it to scorch the people with fire.
translation:
  language: zh_hans
  text: 第四位把他的碗倒在太阳上[a]；太阳又获准用火灼烧世人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文较直译为：“又赐给它，使它在火中灼烧世人。”其中“它”很可能指太阳。
    reason: 保留ἐδόθη αὐτῷ的被动结构、代词指向以及ἐν πυρί较直译的表达。
lexical_decisions:
- source_word: ὁ τέταρτος
  choice: 第四位
  rationale: 带冠词的序数词在此作名词使用，按上下文指第四位天使；译文不补出原文未明说的“天使”。
- source_word: ἐξέχεεν
  choice: 倒
  rationale: 符合把碗中之物倾倒出来的动作，也适合本章反复出现的审判场景。
- source_word: φιάλην
  choice: 碗
  rationale: φιάλη指宽口浅碗；“碗”是现代汉语中自然、准确的对应词，避免采用古旧或形制不符的说法。
- source_word: ἐπὶ τὸν ἥλιον
  choice: 倒在太阳上
  rationale: ἐπί加宾格标明倾倒所针对的对象；“在太阳上”自然保留其空间及目标意象。
- source_word: ἐδόθη αὐτῷ
  choice: 太阳又获准
  rationale: 以“获准”表达无施事者的被动授予或许可，不明说授予者；并按最近且语义最合适的先行词，将αὐτῷ理解为太阳。
- source_word: καυματίσαι
  choice: 灼烧
  rationale: 该动词表示以强烈热力使之灼热或烧伤；“灼烧”准确传达炽热伤人的含义。
- source_word: τοὺς ἀνθρώπους
  choice: 世人
  rationale: 此处泛指受审判的人，并非专指男性；“世人”在庄重叙事中简洁自然。
- source_word: ἐν πυρί
  choice: 用火
  rationale: 此处可表达手段或方式；“用火灼烧”是自然汉语，同时保留火的审判意象。
theological_decisions:
- issue: ἐδόθη所暗示的施事者
  choice: 用“获准”保留未明说施事者的表达
  alternative: 明确译作“上帝赐给太阳权能”
  rationale: 启示录常以此类被动式暗示主权性的授予或许可，但本句没有直接说出上帝，也没有“权能”一词，因此不将这些内容明文化。
- issue: αὐτῷ所指为何
  choice: 理解为太阳
  alternative: 理解为第四位（天使）或未指明的执行者
  rationale: 太阳是最近的语法先行词，而且由太阳施行灼热与上下文相合；脚注保留原文代词形式及其解释空间。
- issue: τοὺς ἀνθρώπους的涵盖范围
  choice: 译为“世人”
  alternative: 译为“男人”或“人类”
  rationale: ἄνθρωπος在此为泛性用语，指受灾的人群，不应造成仅指男性的误解。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“第四位”承接上下文而不增补“天使”；“获准”兼顾自然汉语与原文的神圣被动，不擅自说出授予者。
