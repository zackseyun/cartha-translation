revisions:
- from: 第一位便去，把他的碗倒在地上。于是，那些有兽的印记、敬拜兽像的人身上，就生了恶毒而严重的疮[a]。
  to: 第一位就去，把自己的碗倒在地上；于是，有害而严重的疮生在那些带有那兽的印记、敬拜兽像的人身上[a]。
  rationale: 修订仅处理现代汉语中“恶毒”的语义错位、所属关系的清晰度及叙事语流；保留原文的动作次序、单数集合性“疮”、对受灾者的双重限定，以及两形容词的强化效果。脚注锚点仍紧随“疮”，并对应原文的词汇问题。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:21:08Z'
review_pass:
  verdict: revise
  source_fidelity: 译文准确保留了第一位（承接上下文的天使）倾倒碗、灾疮临到特定两类特征之人的基本结构，也没有扩大受灾者范围。不过“恶毒”在现代汉语通常指人的用心、言语或手段狠毒，或带有毒性，容易把疮患拟人化或引入原文未明说的“毒性”。κακὸν καὶ πονηρόν在此以两个负面形容词叠加强调疮患的有害、严重和可怕，宜作较中性的疾病描述。
  naturalness: “第一位便去”略显生硬；“第一位就去”较合现代叙事语流。“有兽的印记”可理解，却不如“带有那兽的印记”清楚自然，后者明确这是兽所属的印记，而非“有兽”这一描述。
  terminology: 保留“兽”“印记”“兽像”“敬拜”“疮”等《启示录》核心术语。“那兽的印记”与“兽像”在指代和搭配上更清晰。“有害而严重的疮”避免将疾病本身道德化，同时保留双重贬义的强化。
  issues:
  - severity: medium
    issue: “恶毒而严重的疮”中的“恶毒”不适合描述疮患。
    rationale: “恶毒”在现代汉语主要用于人的品性、言行或带毒性事物；原文在此并未断言疮具有道德邪恶或毒性。应以“有害而严重”一类描述保留κακόν与πονηρόν的负面叠加强调。
  - severity: low
    issue: “有兽的印记”略有歧义。
    rationale: 可改为“带有那兽的印记”，更明确表达τὸ χάραγμα τοῦ θηρίου的所属关系，并与后文“兽像”所指一致。
  - severity: low
    issue: “第一位便去”语流稍显不自然。
    rationale: “第一位就去”更符合现代标准汉语的连续叙事，未添加原文未明说的名词。
  revised_text: 第一位就去，把自己的碗倒在地上；于是，有害而严重的疮生在那些带有那兽的印记、敬拜兽像的人身上[a]。
