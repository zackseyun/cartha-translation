id: REV.16.2
reference: Revelation 16:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ ἀπῆλθεν ὁ πρῶτος καὶ ἐξέχεεν τὴν φιάλην αὐτοῦ εἰς τὴν γῆν· καὶ ἐγένετο ἕλκος κακὸν καὶ πονηρὸν ἐπὶ τοὺς ἀνθρώπους τοὺς ἔχοντας τὸ χάραγμα τοῦ θηρίου καὶ τοὺς προσκυνοῦντας τῇ εἰκόνι αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/002.yaml
  text: And the first went and poured out his bowl onto the earth[a], and a harmful and grievous sore came upon the people who had the mark of the beast and who worshiped its image.
translation:
  language: zh_hans
  text: 第一位就去，把自己的碗倒在地上；于是，有害而严重的疮生在那些带有那兽的印记、敬拜兽像的人身上[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“又坏又恶的疮。”希腊原文连用两个强烈的负面形容词κακόν和πονηρόν，强调这场灾害的有害和严重程度。
    reason: 说明两个近义负面形容词的叠加强调及可译范围，避免把疾病本身过度理解为具有道德邪恶。
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: 便去
  rationale: 作为不定过去时叙事动词，承接前文命令并推进事件；“去”自然表达行动，不额外强化离开的含义。
- source_word: ὁ πρῶτος
  choice: 第一位
  rationale: 原文以带冠词的形容词作名词使用，语境指七位天使中的第一位；不在正文补入原文省略的“天使”。
- source_word: ἐξέχεεν
  choice: 倒
  rationale: 在“碗”这一宾语和审判场景中，“倒”是现代汉语最自然的表达，也传达把碗中之物倾出的动作。
- source_word: φιάλην
  choice: 碗
  rationale: φιάλη指较浅的盛器；“碗”通俗清楚，并符合《启示录》中这一重复意象。
- source_word: εἰς τὴν γῆν
  choice: 在地上
  rationale: εἰς在此标明倾倒所朝向并落到的目标；“倒在地上”符合现代汉语习惯。γῆ在本启示文学语境中译作“地”，不限定为某一地区。
- source_word: ἐγένετο
  choice: 就生了
  rationale: γίνομαι在此引出倾倒所造成的灾害；汉语以“在人身上生了……疮”自然表达其出现和结果。
- source_word: ἕλκος
  choice: 疮
  rationale: ἕλκος表示溃烂性疮患；“疮”简明、易懂，也避免“溃疡”过于临床化或“疖”过于具体。单数按原文保留，作为灾害的集合性表述。
- source_word: κακὸν καὶ πονηρὸν
  choice: 恶毒而严重
  rationale: 两个强烈的负面形容词并列修饰疮患。“恶毒”表达其有害、凶恶的性质，“严重”表达其难受、厉害的程度，既保留叠加强调，又不把疮解释为具有道德邪恶。
- source_word: ἐπὶ τοὺς ἀνθρώπους
  choice: 那些……的人身上
  rationale: ἐπί表示疮临到这些人；ἄνθρωποι泛指人，不含男性限定。将修饰语嵌入“那些……的人身上”符合汉语语序。
- source_word: τοὺς ἔχοντας τὸ χάραγμα τοῦ θηρίου
  choice: 那些有兽的印记……的人
  rationale: 现在分词表示这群人的持续特征；“有兽的印记”直接保留印记与兽之间的所属关系。
- source_word: τοὺς προσκυνοῦντας τῇ εἰκόνι αὐτοῦ
  choice: 敬拜兽像的人
  rationale: προσκυνέω在此为宗教性敬拜；“兽像”简洁表达“它的像”，并清楚保留代词所指的兽。
theological_decisions:
- issue: κακὸν καὶ πονηρὸν两个形容词如何描述疮患
  choice: 译为“恶毒而严重的疮”
  alternative: 又坏又恶的疮；有害而痛苦的疮；恶性溃疡
  rationale: 原文并列两个意义相近但语义范围宽的负面形容词，以加强灾害的可怕程度。正文用两个不同的汉语描述保留强化作用，同时避免断定疮本身具有道德意义；脚注提示原文的叠加强调和其他可能表达。
- issue: 受灾者的范围
  choice: 限定为“那些有兽的印记、敬拜兽像的人”
  alternative: 泛指所有人；只译作“众人”
  rationale: 原文的两个带冠词分词短语明确界定受灾者为与兽结盟、接受其印记并敬拜其像的人；译文不扩大或缩小这一范围。
- issue: 是否在“第一位”之后补出“天使”
  choice: 正文保留“第一位”
  alternative: 第一位天使
  rationale: 上下文足以说明所指，原文则有意使用名词化形容词。保留省略可忠实呈现原文，同时不会造成实际理解困难。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“第一位便去”保持启示文学叙事的简洁推进；“有兽的印记、敬拜兽像的人”清楚而通俗。标点将行动与结果分开，使长句易读。
