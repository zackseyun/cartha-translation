id: REV.16.3
reference: Revelation 16:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ ὁ ⸀δεύτερος ἐξέχεεν τὴν φιάλην αὐτοῦ εἰς τὴν θάλασσαν· καὶ ἐγένετο αἷμα ὡς νεκροῦ, καὶ πᾶσα ψυχὴ ⸀ζωῆς ἀπέθανεν ⸀τὰ ἐν τῇ θαλάσσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/003.yaml
  text: And the second poured out his bowl into the sea[a], and it became blood like that of a dead man, and every living creature in the sea died.
translation:
  language: zh_hans
  text: 第二位把他的碗倒进海里，海就变成了血，像死人的血一样[a]；海里一切有生命的都死了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“像尸体流出的血”；希腊文直译为“像死人的血”。
    reason: 说明原文简略的比较结构，并提供能体现尸体意象的译法。
lexical_decisions:
- source_word: ὁ δεύτερος
  choice: 第二位
  rationale: 带冠词的序数词在上下文中指第二位天使，但本节希腊文没有明说“天使”，因此保留原文的省略表达。
- source_word: ἐξέχεεν
  choice: 倒
  rationale: 自然表达把碗中之物倾倒出去的动作，并保留审判倾倒的意象。
- source_word: φιάλην
  choice: 碗
  rationale: φιάλη指较浅、敞口的容器；“碗”比“瓶”更符合器形，也与本段连续出现的容器意象相称。
- source_word: εἰς τὴν θάλασσαν
  choice: 倒进海里
  rationale: εἰς表示朝向并进入，以“进海里”准确传达倾倒方向。
- source_word: ἐγένετο αἷμα
  choice: 海就变成了血
  rationale: 直译γίνομαι加表语名词的结构；补出“海”作为自然的汉语主语，不把异象弱化为仅仅“看起来像血”。
- source_word: ὡς νεκροῦ
  choice: 像死人的血一样
  rationale: 原文省略了比较项中的“血”，直译为“像死人的血”既补足汉语表达，又保留νεκροῦ单数所指的死人。
- source_word: πᾶσα ψυχὴ ζωῆς
  choice: 一切有生命的
  rationale: 此处ψυχή不是现代意义上与身体相对的“灵魂”，而是指有生命的生物；结合海洋语境，用此表达简洁自然。
- source_word: ἀπέθανεν
  choice: 都死了
  rationale: 直接传达ἀποθνῄσκω的普通含义，不作解释性强化。
- source_word: τὰ ἐν τῇ θαλάσσῃ
  choice: 海里
  rationale: 中性复数结构回指海中的生物；汉语将地点提前，与“一切有生命的”自然组合。
theological_decisions:
- issue: 灾祸异象中海变为血的性质
  choice: 译作“海就变成了血”
  alternative: 译作“海看起来像血”
  rationale: 希腊文明确说海“变成了血”，随后才以死人的血说明其性质；译文保留异象中审判的强烈陈述，不将其化为单纯的视觉印象。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“第二位”保留原文省略，不擅自补入“天使”；分号呈现海变为血与海中生命死亡之间紧密的结果关系。
