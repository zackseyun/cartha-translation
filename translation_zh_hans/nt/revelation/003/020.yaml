id: REV.3.20
reference: Revelation 3:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἰδοὺ ἕστηκα ἐπὶ τὴν θύραν καὶ κρούω· ἐάν τις ἀκούσῃ τῆς φωνῆς μου καὶ ἀνοίξῃ τὴν θύραν, ⸀καὶ εἰσελεύσομαι πρὸς αὐτὸν καὶ δειπνήσω μετ’ αὐτοῦ καὶ αὐτὸς μετ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/020.yaml
  text: Look[a], I stand at the door and knock. If anyone hears my voice and opens the door, I will come in to him and dine with him[c][b], and he with me.
translation:
  language: zh_hans
  text: 看哪[a]，我站在门外敲门。若有人听见我的声音就开门，我就要进到他那里去[b]，与他一同吃饭[c]，他也要与我一同吃饭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “看哪”也可译作“请看”。“我站在”所译的希腊文动词是完成时，在这里强调已经站定并仍然站着；“敲门”则是现在时，呈现持续的动作。
    reason: lexical_alternative
  - marker: b
    text: “进到他那里去”也可译作“进去与他相聚”。原文的说法指向那个人，不只是指进入某个地方。
    reason: lexical_alternative
  - marker: c
    text: 一同吃饭的意象表达亲密、彼此的相交。有人认为这里特别暗指圣餐，也有人理解为归信或恢复与基督的团契；经文本身没有明确限定。
    reason: theological_ambiguity
lexical_decisions:
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 这是引人注意的语气词；“看哪”在现代中文圣经语体中庄重而清楚，也保留了原文的突显作用。
- source_word: ἕστηκα
  choice: 我站在
  rationale: 完成时在这里具有现在状态的含义，表达已经站定并仍在那里；中文“站在”自然地呈现当前持续的姿态。
- source_word: ἐπὶ τὴν θύραν
  choice: 门外
  rationale: 原文表示在门边、门前的位置。结合随后“进去”的动作，中文译作“门外”能自然明确地呈现场景，而不把门理解为站立其上的表面。
- source_word: κρούω
  choice: 敲门
  rationale: 现在时表示正在进行或持续的动作；中文“敲门”与“站在门外”搭配自然。
- source_word: ἐάν τις
  choice: 若有人
  rationale: 保留不定条件和对任何人的开放性，不引入性别限制。
- source_word: ἀκούσῃ τῆς φωνῆς μου
  choice: 听见我的声音
  rationale: 忠实表达φωνή的“声音、嗓音”义；不擅自加强为“听从”。
- source_word: ἀνοίξῃ τὴν θύραν
  choice: 开门
  rationale: 简洁自然地表达条件从句中的动作；中文无需重复宾语的定语形式。
- source_word: καὶ εἰσελεύσομαι πρὸς αὐτόν
  choice: 我就要进去，到他那里
  rationale: “进去”表达εἰσελεύσομαι，“到他那里”保留πρὸς αὐτόν指向人的关系性，不把意思缩减为仅仅进入一个地方。
- source_word: δειπνήσω
  choice: 一同吃饭
  rationale: δειπνέω指享用正餐，常为晚餐；“一同吃饭”比“赴宴”或“吃晚饭”更自然，也清楚传达席间相交。
- source_word: μετ’ αὐτοῦ καὶ αὐτὸς μετ’ ἐμοῦ
  choice: 与他一同吃饭，他也要与我一同吃饭
  rationale: 原文后半句省略动词并强调彼此性。中文补出“吃饭”避免歧义，同时以“也”保留互相相交的强调。
theological_decisions:
- issue: 共同吃饭这一比喻的具体所指
  choice: 按原文直接译为彼此一同吃饭，不限定为某一种特定教义含义
  alternative: 明确解释为圣餐、初次归信，或信徒及教会与基督恢复相交
  rationale: 经文明确表达亲密而相互的团契，却没有明说这顿饭专指圣餐、归信或恢复关系；译文保留意象及其神学张力。
- issue: 呼召对象的身份
  choice: 保留“若有人”的开放表达
  alternative: 明确译成“若有不信的人”或“若有信徒”
  rationale: 本节本身使用不定代词τις；虽然上下文是写给老底嘉教会，翻译不应在正文中加入原文未明说的身份限定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话圣经语体。“看哪”保留宣告的力度；全句避免古奥措辞。“我就要”呈现条件满足后的将来行动。“他”按现代汉语作无标记单数代词使用，不意在限制性别。
