source:
  edition: SBLGNT
  text: Οἶδά σου τὰ ἔργα, ὅτι οὔτε ψυχρὸς εἶ οὔτε ζεστός. ὄφελον ψυχρὸς ἦς ἢ ζεστός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/015.yaml
  text: 'I know your works: you are neither cold nor hot[a]. I wish that you were cold or hot.'
translation:
  language: zh_hans
  text: 我知道你的行为：你不冷也不热。我真希望[a]你或冷或热。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“巴不得你或冷或热。”
    reason: ὄφελον既可用现代口语化的“我真希望”表达，也可用较凝练、贴近原文愿望语气的“巴不得”表达。
lexical_decisions:
- source_word: Οἶδά
  choice: 我知道
  rationale: οἶδα在这里具有现在时的状态意义；“我知道”自然、直接，也保留审察和评价的语气。
- source_word: σου τὰ ἔργα
  choice: 你的行为
  rationale: ἔργα指可受评价的所作所为。“行为”是现代汉语中自然而庄重的表达，也比“你所做的”更凝练。
- source_word: ψυχρὸς
  choice: 冷
  rationale: 保留原文的温度比喻，并与“热”形成直接对照，不在译文中预先解释其属灵含义。
- source_word: ζεστός
  choice: 热
  rationale: 按基本温度意义翻译，与“冷”构成自然对比；不译作“火热”或“热心”，以免把某一种解释写入正文。
- source_word: ὄφελον
  choice: 我真希望
  rationale: ὄφελον表达对与现状不符之事的强烈愿望。“我真希望”符合现代汉语，同时保留愿望的力度；脚注列出较贴近形式的译法。
- source_word: ἢ
  choice: 或
  rationale: 表达两个选项之间的选择。“或冷或热”简洁自然，并对应原文的析取关系。
theological_decisions:
- issue: “冷”和“热”这一温度比喻的含义
  choice: 正文保留字面的“冷”和“热”，不解释二者具体象征什么。
  alternative: 可将“冷”理解为属灵上的冷漠或不信，将“热”理解为属灵上的热心；也有人把两者理解为各有益处的冷水与热水。
  rationale: 本节没有明确解释比喻。直译温度词能保留原文的开放性和神学张力，避免把特定诠释写入经文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你的行为”延续《启示录》中审察行为的语境；“不冷也不热”和“或冷或热”保留原文重复及鲜明的温度对比。
