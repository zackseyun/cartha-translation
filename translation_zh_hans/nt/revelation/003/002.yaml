- from: 你要警醒，坚固那剩下、将要死去的，因为我看出你的行为在我的上帝面前还没有完成。
  to: 你要警醒，坚固那剩下而濒临死亡的；因为我没有发现你的行为在我上帝面前已经完成。
  rationale: 以“没有发现”准确对应εὕρηκα，以“濒临死亡”传达ἔμελλον ἀποθανεῖν的临近性；其余保持原有的含混性、庄重语域及“完成”这一关键措辞。
