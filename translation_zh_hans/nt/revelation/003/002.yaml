id: REV.3.2
reference: Revelation 3:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: γίνου γρηγορῶν, καὶ στήρισον τὰ λοιπὰ ἃ ⸂ἔμελλον ἀποθανεῖν⸃, οὐ γὰρ εὕρηκά σου ⸀τὰ ἔργα πεπληρωμένα ἐνώπιον τοῦ θεοῦ μου·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/002.yaml
  text: Wake up, and strengthen what remains, which was about to die, for I have not found your works completed in the sight of my God.
translation:
  language: zh_hans
  text: 你要警醒，坚固那剩下而濒临死亡的；因为我没有发现你的行为在我上帝面前已经完成。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γίνου γρηγορῶν
  choice: 你要警醒
  rationale: γίνου加现在分词表达进入并持续保持警醒的状态；“警醒”自然、庄重，也保留本书中属灵警觉与醒来的双重意象。
- source_word: στήρισον
  choice: 坚固
  rationale: 表示使余下之物稳固、得以加强；“坚固”准确承接该动词的使动意味。
- source_word: τὰ λοιπὰ
  choice: 那剩下的
  rationale: 保留中性复数表达的概括性，不擅自限定为人、行为或事物。
- source_word: ἃ ἔμελλον ἀποθανεῖν
  choice: 将要死去的
  rationale: ἔμελλον加不定式表示濒临或即将发生；直译保留原文拟人化及所指对象的含混。
- source_word: τὰ ἔργα πεπληρωμένα
  choice: 行为……完成
  rationale: ἔργα译为“行为”，πεπληρωμένα表示已经成全、完成；与否定和“还没有”搭配，清楚表达尚未达到完成状态。
- source_word: ἐνώπιον τοῦ θεοῦ μου
  choice: 在我的上帝面前
  rationale: 直接保留审察发生于“我的上帝面前”的关系性与神学措辞。
theological_decisions:
- issue: “剩下的”具体指人、行为还是属灵生命
  choice: 保留为“那剩下的”
  alternative: 译作“剩下的人”或“剩下的事”
  rationale: 原文使用中性复数τὰ λοιπὰ，所指并未明说；不应在译文中替作者消除歧义。
- issue: “行为尚未完成”的含义
  choice: 译为“你的行为……还没有完成”
  alternative: 译为“你的行为不完全”或“未达到标准”
  rationale: πεπληρωμένα首先表达完成、成全的状态；直译可保留它究竟涉及数量、持续到底还是上帝所要求之圆满的张力。
- issue: γρηγορέω是“醒来”还是“警醒”
  choice: 你要警醒
  alternative: 醒来吧
  rationale: 该词可由实际醒来引申为保持警觉；此处命令带持续意味，“警醒”兼顾惯用语义与属灵劝诫，但不排除醒来的意象。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“警醒、坚固”延续圣经语域但仍为现代读者所熟悉；句法尽量贴近希腊文论证次序，并保留“那剩下的”所指含混。
