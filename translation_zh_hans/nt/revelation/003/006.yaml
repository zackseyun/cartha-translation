base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/006.yaml
  text: The one who has an ear[a], let him hear what the Spirit says to the churches.
translation:
  language: zh_hans
  text: 有耳的[a]，就应当听圣灵向众教会所说的话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译：“有一只耳的，就应当听。”这里的单数形式是泛指，劝勉任何人留心听从。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: 有耳朵的
  rationale: 保留原文单数“耳朵”和实体化分词所形成的泛指表达；现代汉语中简洁、自然，也延续这一劝诫语的格言色彩。
- source_word: ἀκουσάτω
  choice: 就应当听
  rationale: 第三人称单数命令式在汉语中用“应当”表达劝诫和命令的力度；不另加性别代词，也不把单数泛指改成复数。
- source_word: τί
  choice: 所说的话
  rationale: 以“所说的话”自然表达内容关系；“话”是汉语句法所需的名词中心，不增添实质内容。
- source_word: τὸ πνεῦμα
  choice: 圣灵
  rationale: 启示录二至三章反复出现的公式表明，这是圣灵向众教会发言；译作“圣灵”比含混的“灵”更符合语境。
- source_word: λέγει
  choice: 所说
  rationale: 用一般现在意义的“所说”表达持续或特征性的发言，并与“话”构成自然的现代汉语结构。
- source_word: ταῖς ἐκκλησίαις
  choice: 对众教会
  rationale: 介词“对”准确表达说话的对象；复数译为“众教会”，保留本书七个教会及其共同受话者的含义。
theological_decisions:
- issue: τὸ πνεῦμα的所指
  choice: 圣灵
  alternative: 那灵／灵
  rationale: 启示录二至三章反复使用这一结语，语境强烈指向借先知信息向教会说话的圣灵。
- issue: 劝诫中的泛指单数
  choice: 有耳朵的，就应当听
  alternative: 凡有耳的，都要听／有耳可听的，就应当听
  rationale: 原文以单数分词和单数命令式作泛指。汉语“有耳朵的”无需性别代词即可保留其代表任何人的开放指向；不加入原文没有的“可听”。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“耳朵”保留原文单数意象；“众教会”保持复数。“应当听”表达命令式的劝诫力度，同时避免生硬的逐字结构。
