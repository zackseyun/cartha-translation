  source_fidelity: 译文整体准确保留了两个“看哪”、对该群体自称的否定、使役性的“使他们来”、以及在收信者脚前的俯伏。可是“我要把……交出来”在中文中通常有揭发、移交或被迫交出的含义，未能自然表达 δίδωμι 的“给／交给”；且将现在时 διδῶ 处理为“我要”没有保留其当前、宣告性的表达。“我爱了你”虽试图对应不定过去时，但在现代普通话中不自然，且容易被理解为爱已结束。
  naturalness: “看哪”“撒但会堂”“在你脚前俯伏”均庄重且自然。“我爱了你”不符合现代汉语对“爱”的通常体貌表达；“交出来”也不适合此处的授予／交付语境。修订以“我已经爱你了”自然表达先前已发生、现仍具效力的爱，而不规定特定神学解释。
  terminology: “撒但”“会堂”“犹太人”和“俯伏”均可保留。“俯伏”恰当地避免把 προσκυνέω 在此处直接限定为对信徒的神圣敬拜。涉及“自称是犹太人，其实不是”的尖锐措辞应维持贴近原文，不扩展为对族裔身份的解释。
