id: REV.3.9
reference: Revelation 3:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἰδοὺ ⸀διδῶ ἐκ τῆς συναγωγῆς τοῦ Σατανᾶ, τῶν λεγόντων ἑαυτοὺς Ἰουδαίους εἶναι, καὶ οὐκ εἰσὶν ἀλλὰ ψεύδονται— ἰδοὺ ποιήσω αὐτοὺς ἵνα ⸂ἥξουσιν καὶ προσκυνήσουσιν⸃ ἐνώπιον τῶν ποδῶν σου, καὶ γνῶσιν ὅτι ⸀ἐγὼ ἠγάπησά σε.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/009.yaml
  text: Look[a], I am giving some from the synagogue of Satan—those who call themselves Jews and are not, but are lying—look, I will make them come and bow down before your feet[b], and they will know that I have loved you.
translation:
  language: zh_hans
  text: 看哪，我正把撒但会堂中的一些人交给你[a]——他们自称是犹太人，其实不是，而是在说谎。看哪，我要使他们前来，在你脚前俯伏[b]，并且知道我已经爱你了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“我从撒但的会堂中给”；原文没有明说“给”的宾语，这里补出“一些人”，表示可能是该群体中的一些人将被使前来。也可理解为“从撒但会堂而来的人”。
    reason: 说明 διδῶ 的省略宾语及 ἐκ 的来源和部分性，并保留句法上的替代理解。
  - marker: b
    text: 或译“前来，在你脚前敬拜”。原词既可指“俯伏”，也可指“敬拜”；这里译作“俯伏”，以免让人误以为信徒接受神圣的敬拜。
    reason: 保留 προσκυνέω 的词义范围，同时说明正文译法。
lexical_decisions:
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 用现代中文仍通行且庄重的提示语，保留原文两次唤起注意的作用。
- source_word: διδῶ ἐκ τῆς συναγωγῆς τοῦ Σατανᾶ
  choice: 我要把撒但会堂中的一些人交出来
  rationale: διδῶ 是现在时“我给”，在此结构中带有交出、交付之意；补出“一些人”以使中文完整，并保留 ἐκ 的部分性，不暗示整个群体都在内。“要”用于表达正在宣告的行动，而非把它简单处理为普通将来时。
- source_word: συναγωγῆς τοῦ Σατανᾶ
  choice: 撒但会堂
  rationale: 保留“会堂”这一具体的犹太社群用语及原文尖锐的属格表达，不加以软化或扩展。
- source_word: τῶν λεγόντων ἑαυτοὺς Ἰουδαίους εἶναι
  choice: 他们自称是犹太人
  rationale: “自称”自然传达反身结构，且不额外判定其族裔背景。
- source_word: καὶ οὐκ εἰσὶν ἀλλὰ ψεύδονται
  choice: 其实不是，而是在说谎
  rationale: 保留原文鲜明的否定与转折，并以“在说谎”表达 ψεύδονται 的持续性陈述。
- source_word: ποιήσω αὐτοὺς ἵνα ἥξουσιν
  choice: 我要使他们来
  rationale: 保留 ποιέω 的使役作用，不添加原文没有的目的或方式。
- source_word: προσκυνήσουσιν ἐνώπιον τῶν ποδῶν σου
  choice: 在你脚前俯伏
  rationale: προσκυνέω 可指敬拜，也可指俯伏致敬；此处地点是收信者脚前，“俯伏”既保留身体动作，也避免误示信徒接受只应归给神的敬拜。
- source_word: γνῶσιν ὅτι ἐγὼ ἠγάπησά σε
  choice: 让他们知道，我爱了你
  rationale: “让他们知道”承接 ἵνα 所表示的预期结果；“爱了”保留 ἠγάπησα 的不定过去时形态及其简洁力度，而不擅自限定为过去或持续之爱的某一种神学解释。
theological_decisions:
- issue: “自称是犹太人，其实不是”的含义
  choice: 按原文保留其关于真实身份或盟约忠诚的尖锐论断，不加以解释性扩写。
  alternative: 明确解释为属灵意义上的非犹太人，或直接否定对方的族裔身份。
  rationale: 经文本身没有说明“不是”具体否定族裔、宗教忠诚还是盟约身份；直译可保留张力，并避免引入超出文本的反犹太含义。
- issue: προσκυνήσουσιν 在信徒脚前的性质
  choice: 译为“俯伏”，表达降服或致敬。
  alternative: 译为“敬拜”。
  rationale: 原词语义范围包括敬拜和俯伏；因动作发生在收信者脚前，“俯伏”更能避免暗示信徒接受神圣敬拜，同时保留原文可能呼应先知书中仇敌降服的图景。
- issue: ἠγάπησά 的时态表达
  choice: 译为“我爱了你”。
  alternative: 译为“我一直爱你”或“我是爱你的”。
  rationale: 不定过去时可从整体上陈述爱的行动；保留较直译的“爱了”，避免擅自把它限定为持续状态或仅作强调判断。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“看哪”保留启示文学的宣告语气；“撒但会堂”保留原文的强烈措辞。句中使用破折号隔开对该群体的说明，使复杂希腊句法在中文中清晰可读。
