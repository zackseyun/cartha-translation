  text: ἔρχομαι ταχύ· κράτει ὃ ἔχεις, ἵνα μηδεὶς λάβῃ τὸν στέφανόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/011.yaml
  text: I am coming soon[a]; hold fast what you have[b], so that no one may take your crown.
translation:
  language: zh_hans
  text: 我快要来了[a]。你要牢牢守住你所拥有的，免得有人夺去你的冠冕[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我会迅速地来”。希腊语副词既可强调时间临近，也可强调行动迅速。
    reason: alternative_reading
  - marker: b
    text: 这里的“冠冕”指赐给得胜者或受尊荣者的花冠、荣冠，并非特指君王的王冠。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχομαι
  choice: 我……来了
  rationale: 希腊语现在时在这里带有临近将来的意味；配合“快要”，译为“我快要来了”既自然，也表达即将到来的应许与警告。
- source_word: ταχύ
  choice: 快要
  rationale: 该副词既可指时间临近，也可指行动迅速。正文采用“快要”表达临近性，同时用脚注保留“迅速”的可能含义。
- source_word: κράτει
  choice: 牢牢守住
  rationale: 命令式要求坚定地保有、坚持不放；“牢牢守住”比单用“守住”更充分传达其力度，又符合现代汉语。
- source_word: ὃ ἔχεις
  choice: 你所有的
  rationale: 保留原文未明说具体所指的特点，让上下文界定其内容，不擅自补入“信心”“真道”等解释。
- source_word: ἵνα μηδεὶς λάβῃ
  choice: 免得有人夺去
  rationale: “免得”自然表达应当防止的结果；“夺去”体现这里的负面取走之意，同时不把动作夸张为暴力抢夺。
- source_word: τὸν στέφανόν σου
  choice: 你的冠冕
  rationale: στέφανος指作为得胜或尊荣标志的花冠、冠冕，并非特指君王的王冠；“冠冕”保留圣经语境中的尊荣意象，具体词义以脚注说明。
theological_decisions:
- issue: ταχύ在基督来临应许中的含义
  choice: 快要
  alternative: 迅速地
  rationale: 原文可能强调来临在时间上临近，也可能强调来临时行动迅速。正文采用较符合本段警醒语气的“快要”，脚注则保留另一种可能，避免消除原文的张力。
- issue: “你所有的”具体指什么
  choice: 保持原文的非特指表达
  alternative: 明确译成“你的信心”或“你所得的真道”
  rationale: 希腊文没有明说其内容；不在正文中补足特定神学解释，以免缩窄上下文所容许的意义。
- issue: “冠冕”的性质
  choice: 冠冕
  alternative: 王冠
  rationale: 原词στέφανος通常是得胜者或受尊荣者所得的冠，不是特指统治权的διάδημα（王冠）；因此不用“王冠”，并在脚注中交代其意象。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“牢牢守住”保留命令的力度；“你所有的”有意维持原文的含蓄；“冠冕”保留启示文学的尊荣与得胜意象，并借脚注避免被误解为王权象征。
