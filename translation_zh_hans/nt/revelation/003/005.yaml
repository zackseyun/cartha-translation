  terminology: “得胜的人”“白衣”“生命册”均合适。“抹去”比“涂去”更符合中文中从名册除名的惯用表达，同时保留ἐξαλείφω的擦除意象。脚注不应将“得胜”释为“忠心到底”，因为这会把本节未明说的解释加入词义说明。
