id: REV.3.5
reference: Revelation 3:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ νικῶν ⸀οὕτως περιβαλεῖται ἐν ἱματίοις λευκοῖς, καὶ οὐ μὴ ἐξαλείψω τὸ ὄνομα αὐτοῦ ἐκ τῆς βίβλου τῆς ζωῆς, καὶ ὁμολογήσω τὸ ὄνομα αὐτοῦ ἐνώπιον τοῦ πατρός μου καὶ ἐνώπιον τῶν ἀγγέλων αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/005.yaml
  text: The one who conquers will thus be clothed in white garments[a], and I will certainly not erase his name from the book of life[d][c][b], and I will confess his name before my Father and before his angels.
translation:
  language: zh_hans
  text: 得胜的人必这样披上白衣[a]；我绝不会从生命册中抹去他的名字[b][c]；我也要在我父面前，也在他的众天使面前公开承认他[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “得胜的人”也可译作“胜过的人”。
    reason: lexical_alternative
  - marker: b
    text: “绝不会”对应希腊文的强调否定；也可译作“决不”或“绝不”。
    reason: source_emphasis
  - marker: c
    text: “生命册”是天上的名册这一象征性意象。
    reason: cultural_note
  - marker: d
    text: 直译为“承认他的名”；也可译作“公开宣认他”。参马太福音10:32。
    reason: lexical_alternative_cross_reference
lexical_decisions:
- source_word: ὁ νικῶν
  choice: 得胜的人
  rationale: 现在时分词作名词用，描写以得胜为特征的人；“得胜”自然承接《启示录》的胜利主题，也保留单数代表性表达。
- source_word: οὕτως
  choice: 这样
  rationale: 保留原文的连接和对应作用，指向上文所述的应许或情形，不作过度解释。
- source_word: περιβαλεῖται ἐν ἱματίοις λευκοῖς
  choice: 必这样穿上白衣
  rationale: περιβαλεῖται 是将来时中间／被动形态；“穿上”在现代汉语中自然，并保留披戴衣服的意象。“白衣”简洁表达白色衣服，避免擅自限定为某种特定袍服。
- source_word: οὐ μὴ ἐξαλείψω
  choice: 我绝不会……涂去
  rationale: οὐ μή 加将来时构成强烈否定；“绝不会”传达其强调语气。“涂去”适合古代名册上除名的图像，也比单纯“删除”更能保留原文意象。
- source_word: τὸ ὄνομα αὐτοῦ
  choice: 他的名字／他的名
  rationale: 按单数阳性结构直译；这里具有代表性，并不排除女性。前句用“名字”较口语清楚，后句用“名”与“承认”搭配庄重自然。
- source_word: ἐκ τῆς βίβλου τῆς ζωῆς
  choice: 从生命册上
  rationale: βίβλος 可指书或卷册；中文圣经语境中“生命册”清楚表达天上名册的意象。“从……上涂去”符合汉语搭配。
- source_word: ὁμολογήσω τὸ ὄνομα αὐτοῦ
  choice: 承认他的名
  rationale: ὁμολογέω 在此表示公开承认、认可；“承认他的名”既保留公开宣认的含义，也与马太福音10:32的相近表达相呼应。
- source_word: ἐνώπιον τοῦ πατρός μου καὶ ἐνώπιον τῶν ἀγγέλων αὐτοῦ
  choice: 在我父和我父的众天使面前
  rationale: 两次 ἐνώπιον 的共同范围以自然汉语表达；αὐτοῦ 最近且最自然的先行词是“我父”，故明确译作“我父的”，避免中文代词指向含混。
theological_decisions:
- issue: “绝不会从生命册上涂去他的名字”是否决定圣徒坚忍或失去救恩的争论
  choice: 按原文直译为基督赐给得胜者的强烈应许，不附加教义结论。
  alternative: 将其解释为圣徒必然坚忍的保证，或解释为某些人可能失去救恩的明示警告。
  rationale: 本节以名册意象作出强调性的应许，但单凭这句话不能无歧义地解决更广泛的神学争论；译文应保留其保证力度与神学张力。
- issue: 单数阳性表达的性别处理
  choice: 使用“他／他的”。
  alternative: 使用复数或性别中性的表达。
  rationale: 原文以单数阳性分词及代词作代表性泛指；中文保留单数形式最贴近源文，同时其适用对象不限于男性。
- issue: “他的众天使”中代词的指向
  choice: 译为“我父的众天使”。
  alternative: 保留“他的众天使”，或解释为基督自己的天使。
  rationale: 原文 αὐτοῦ 在语法上最自然地回指紧邻的“我父”；中文若直译“他的”容易产生不必要的指代歧义，因此明确为“我父的”，不改变所有关系。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“得胜的人”“生命册”保留启示文学的核心意象；“绝不会”明确传达希腊文的强烈否定。“我父的众天使”在不改变语义的前提下消除中文代词歧义。所有脚注标记均已置于正文相应位置。
