- from: 得胜的人必这样穿上白衣[a]；我绝不会从生命册上涂去他的名字[b][c]，并且要在我父和我父的众天使面前承认他的名[d]。
  to: 得胜的人必这样披上白衣[a]；我绝不会从生命册中抹去他的名字[b][c]；我也要在我父面前，也在他的众天使面前公开承认他[d]。
  rationale: 修订使汉语更合乎现代普通话，同时保留原文的语义和修辞：以“披上白衣”表达衣饰意象，以“绝不会”表达οὐ μή的强烈否定，以“从生命册中抹去”保留名册除名的图像；“公开承认他”是对“承认他的名”的自然汉语等值表达。删去脚注a中超出词汇说明的“忠心到底”，不对得胜的具体神学含义作额外界定。
  reviewer_model: gpt-5.6-terra
