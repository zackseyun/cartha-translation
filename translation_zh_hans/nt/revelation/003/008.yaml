id: REV.3.8
reference: Revelation 3:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Οἶδά σου τὰ ἔργα— ἰδοὺ δέδωκα ἐνώπιόν σου θύραν ἠνεῳγμένην, ἣν οὐδεὶς δύναται κλεῖσαι αὐτήν— ὅτι μικρὰν ἔχεις δύναμιν, καὶ ἐτήρησάς μου τὸν λόγον, καὶ οὐκ ἠρνήσω τὸ ὄνομά μου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/008.yaml
  text: I know your works. Look[a], I have set before you an open door, which no one is able to shut, because you have little strength, and you have kept my word, and have not denied my name.
translation:
  language: zh_hans
  text: 我知道你的行为。看哪，我已在你面前设下一扇敞开的门[a]，没有人能关上它；因为你的力量微小，又遵守了我的话，也没有否认我的名。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一扇已经打开的门”，或“一扇开着的门”。希腊文分词明确表示这扇门已经被打开。
    reason: 词义备选，并说明希腊文完成时被动分词的语义。
lexical_decisions:
- source_word: Οἶδά σου τὰ ἔργα
  choice: 我知道你的行为
  rationale: οἶδα 虽为完成时形式，却具有现在时意义；“行为”保留 ἔργα 的复数整体概念及《启示录》中反复出现的固定表达。
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 这是唤起注意的话语标记；“看哪”在现代中文中庄重、清楚，也保留了原文的强调作用。
- source_word: δέδωκα ἐνώπιόν σου
  choice: 我在你面前放了
  rationale: δέδωκα 字面为“已经给了”，但与“门”和“在你面前”连用时，“放了”更符合中文表达，并保留已完成且现今仍有效的含义。
- source_word: θύραν ἠνεῳγμένην
  choice: 一扇敞开的门
  rationale: “敞开的”既自然，又反映完成时被动分词所表达的门已经被打开并保持敞开的状态。
- source_word: ἣν οὐδεὶς δύναται κλεῖσαι αὐτήν
  choice: 没有人能把它关上
  rationale: 直接表达 δύναται 的能力含义，并以自然中文保留“门—关上”的具体意象。
- source_word: ὅτι μικρὰν ἔχεις δύναμιν
  choice: 因为你的力量虽小
  rationale: ὅτι 按最自然的因果关系译为“因为”；“力量虽小”保留有限能力之意，并与后面的忠心形成让步性的语义张力。
- source_word: ἐτήρησάς μου τὸν λόγον
  choice: 却遵守了我的话
  rationale: τηρέω 可指持守、遵守或保守；此处“遵守”自然表达忠实回应，同时不把 λόγος 具体解释为某一种信息。
- source_word: οὐκ ἠρνήσω τὸ ὄνομά μου
  choice: 也没有否认我的名
  rationale: 保留“否认”与“我的名”的原文措辞，使“名”所承载的身份与归属意义不被解释性改写。
theological_decisions:
- issue: “敞开的门”这一意象的具体所指
  choice: 按原文保留为“敞开的门”，不说明它具体代表什么
  alternative: 宣教机会、进入救恩或国度的通道、一般性的机遇或蒙保守的途径
  rationale: 本节没有明说这一比喻的唯一所指；直译意象可以保留其真实的神学开放性。
- issue: “力量虽小”与后文忠心之间的关系
  choice: 用“虽小，却……”表达让步关系，同时保留 ὅτι 的因果引导
  alternative: 译作并列的“你的力量小，并且你遵守了……”
  rationale: 希腊文形式上以 καί 连接，但语境显出在有限力量中仍然忠心的张力；中文用“虽……却……”更自然，且没有把“小力量”改成属灵优点或缺点。
- issue: 完成动作及其当前效力
  choice: 用“放了”“遵守了”“没有否认”表达已经发生且与当前处境相关的行动
  alternative: 用“已经放置”“一直持守”“从未否认”等更强的时体表达
  rationale: 现代中文通常不以强制标记完整对应希腊语完成时；简洁表达可让上下文承载持续效力，避免添加“一直”或“从未”所带来的过度限定。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“看哪”保留启示文学的郑重语气；整体避免解释“门”的具体神学含义，也不加入宗派性措辞。
