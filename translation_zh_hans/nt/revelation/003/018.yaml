id: REV.3.18
reference: Revelation 3:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: συμβουλεύω σοι ἀγοράσαι ⸂παρ’ ἐμοῦ χρυσίον⸃ πεπυρωμένον ἐκ πυρὸς ἵνα πλουτήσῃς, καὶ ἱμάτια λευκὰ ἵνα περιβάλῃ καὶ μὴ φανερωθῇ ἡ αἰσχύνη τῆς γυμνότητός σου, καὶ κολλούριον ⸀ἐγχρῖσαι τοὺς ὀφθαλμούς σου ἵνα βλέπῃς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/018.yaml
  text: I counsel you to buy from me gold refined by fire so that you may become rich[a], and white garments so that you may clothe yourself and the shame of your nakedness may not be exposed[c][b], and eye salve to anoint your eyes so that you may see.
translation:
  language: zh_hans
  text: 我劝你向我买火炼的金子[a]，使你富足；又买白衣[b]穿上，免得你赤身的羞耻显露出来；还要买眼药[c]涂在眼睛上，使你能看见。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“用火炼净的”或“经火试验的”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“白色衣服”；在某些语境中可特指“白袍”。
    reason: lexical_alternative
  - marker: c
    text: “眼药”指涂用于眼部的药物制剂。
    reason: cultural_note
lexical_decisions:
- source_word: συμβουλεύω σοι
  choice: 我劝你
  rationale: 以自然、郑重的现代汉语表达带有权威分量的劝告，同时保留第一人称对第二人称的直接语气。
- source_word: ἀγοράσαι παρ’ ἐμοῦ
  choice: 向我买
  rationale: 准确表达 παρά 加属格所指的来源；“向我买”符合现代汉语交易表达，也保留取得属灵物品的比喻。
- source_word: χρυσίον πεπυρωμένον ἐκ πυρός
  choice: 火炼的金子
  rationale: 保留冶炼意象，并以简洁自然的汉语体现完成时被动分词所表示的经火处理后的状态。
- source_word: ἵνα πλουτήσῃς
  choice: 使你富足
  rationale: 表达目的，并体现进入富足状态的含义；“富足”比单纯“有钱”更适合本节的象征语境。
- source_word: ἱμάτια λευκά
  choice: 白衣
  rationale: “白衣”是自然、庄重且范围较宽的表达，不擅自限定为某一种袍服。
- source_word: ἵνα περιβάλῃ
  choice: 穿上
  rationale: 中间语态在此表示主体亲自穿戴；汉语“穿上”自然地传达这一含义。
- source_word: μὴ φανερωθῇ ἡ αἰσχύνη τῆς γυμνότητός σου
  choice: 免得你赤身的羞耻显露出来
  rationale: 保留“赤身”与“羞耻”的直接关联，并以“显露出来”准确表达被动虚拟语气的结果。
- source_word: κολλούριον
  choice: 眼药
  rationale: 该词指用于眼部的药物制剂；“眼药”是普通现代读者易懂且不过度限定剂型的译法。
- source_word: ἐγχρῖσαι τοὺς ὀφθαλμούς σου
  choice: 涂在眼睛上
  rationale: 该动词表示涂抹、擦用；此译法清楚呈现医疗动作，同时不额外引入礼仪性“膏抹”的含义。
- source_word: ἵνα βλέπῃς
  choice: 使你能看见
  rationale: 保留目的从句及“看见”的基本意象，不在正文中解释其象征所指。
theological_decisions:
- issue: 金子、白衣和眼药的象征意义
  choice: 在正文中按原文保留具体物品的意象，不直接解释其属灵所指。
  alternative: 把金子译解为真正的属灵财富、白衣译解为义或纯洁、眼药译解为属灵洞察力。
  rationale: 本节使用鲜明的象征性劝告，却没有在句内逐一说明象征意义；直译意象可保留原文的开放性及神学张力。
- issue: ἐγχρῖσαι 是否应带出膏抹或圣礼色彩
  choice: 译为“涂在眼睛上”，突出语境中的施药动作。
  alternative: 译为“膏抹你的眼睛”，保留更强的象征性或礼仪性联想。
  rationale: 该动词在这里与眼药连用，首先指涂抹药物；采用“涂”可忠实表达动作，又避免添加原文未明确提出的圣礼含义。
- issue: “买”在象征性交易中的神学含义
  choice: 保留“买”，不说明代价、功德或恩典的关系。
  alternative: 意译为“从我领受”或在正文中解释为无偿获得。
  rationale: ἀγοράσαι 明确使用购买意象；翻译不应预先消解这一意象与其他经文之间可能存在的神学张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。全句以分号分隔三项劝告，既显出原文的并列结构，也避免中文长句拖沓；保留“买”“金子”“白衣”“眼药”“赤身”等核心意象，不在正文中作教义化解释。
