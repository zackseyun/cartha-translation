id: REV.3.16
reference: Revelation 3:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οὕτως, ὅτι χλιαρὸς εἶ καὶ ⸀οὔτε ζεστὸς οὔτε ψυχρός, μέλλω σε ἐμέσαι ἐκ τοῦ στόματός μου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/016.yaml
  text: So[a], because you are lukewarm, and neither hot nor cold, I am about to vomit you out of my mouth.
translation:
  language: zh_hans
  text: 因此，你既然不冷不热，既不热也不冷，我就要把你从我口中呕出来[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把你从我口中吐出去。”原文动词更明确地指“呕吐”，语气比一般的“吐”更强烈。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: 因此
  rationale: 承接上一节并引出由此而来的后果；“因此”自然保留推论语气。
- source_word: ὅτι
  choice: 既然
  rationale: 在这里说明审判宣告的原因；与后面的“就要”搭配，清楚表达因果关系，同时避免“因此，因为”在中文中的生硬重复。
- source_word: χλιαρός
  choice: 不冷不热
  rationale: 准确传达温度处于冷热之间的意象，也是现代汉语中自然、易懂的说法。
- source_word: οὔτε ζεστὸς οὔτε ψυχρός
  choice: 既不热也不冷
  rationale: 保留原文成对的对比及其与“不冷不热”形成的刻意复述，不对比喻作额外解释。
- source_word: μέλλω
  choice: 就要
  rationale: 表达行动即将发生的迫近感，比单纯的“要”更能保留警告的紧迫性。
- source_word: ἐμέσαι
  choice: 呕出来
  rationale: 该动词明确指呕吐；采用直接而强烈的表达，不把原文令人震动的意象弱化为“吐掉”或“吐出去”。
- source_word: ἐκ τοῦ στόματός μου
  choice: 从我口中
  rationale: 保留原文具体的身体意象和从口中排出的方向。
theological_decisions:
- issue: ἐμέσαι所表达的审判意象强度
  choice: 保留“呕出来”这一强烈而具体的意象。
  alternative: 译作“吐出去”或“吐掉”。
  rationale: 原文有意用令人不适的呕吐画面表达严厉拒绝；较温和的译法会削弱警告的修辞和神学力度。
- issue: μέλλω的时间意味
  choice: 译为“就要”，呈现行动迫近。
  alternative: 译为一般将来意义的“要”或“将”。
  rationale: 原文强调即将采取的行动，而不只是抽象或无时间性的审判宣告；保留这一点能传达警告的紧迫感。
translation_notes:
  register: 采用现代、庄重而直接的普通话。“不冷不热，既不热也不冷”有意保留原文的重复；“呕出来”虽带有强烈的生理画面，却符合原文措辞，不作委婉化处理。
