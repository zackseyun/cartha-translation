id: REV.3.1
reference: Revelation 3:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ τῆς ἐν Σάρδεσιν ἐκκλησίας γράψον· Τάδε λέγει ὁ ἔχων τὰ ἑπτὰ πνεύματα τοῦ θεοῦ καὶ τοὺς ἑπτὰ ἀστέρας· Οἶδά σου τὰ ἔργα, ὅτι ὄνομα ἔχεις ὅτι ζῇς, καὶ νεκρὸς εἶ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/001.yaml
  text: 'And write to the angel of the church in Sardis: These things says the one who has the seven spirits of God and the seven stars: I know your works[a]; you have a name that you are alive[d][c][b], but you are dead.'
translation:
  language: zh_hans
  text: “你要写信给撒狄教会的天使[a]：‘那拥有上帝的七灵[b]和七星的如此说：我知道你的行为；你有活着的名声[c]，却是死的。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “天使”也可译作“使者”。希腊文ἄγγελος可指天使，也可指传递信息的人。
    reason: alternative_reading
  - marker: b
    text: “上帝的七灵”按原文复数直译。这可能象征圣灵的完全或丰满；也有人理解为上帝面前的七位天上的灵。
    reason: alternative_reading
  - marker: c
    text: 较直译为“你有名声，说你是活着的”。这里的“名声”指人对你的公众评价。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: 天使
  rationale: ἄγγελος既可指天使，也可指使者；启示录的异象语境及七封信的固定称呼支持正文采用“天使”，同时以脚注保留另一可能。
- source_word: ἐκκλησίας
  choice: 教会
  rationale: 在此指撒狄当地的基督徒群体，“教会”是现代汉语中自然且准确的通行译法。
- source_word: Τάδε λέγει
  choice: ……这样说
  rationale: 保留宣告式、先知性公式的庄重语气，同时避免生硬直译“这些事说”。
- source_word: ὁ ἔχων
  choice: 那位拥有……的
  rationale: 自然表达希腊文带冠词的现在分词结构，并保留其称号性质。
- source_word: τὰ ἑπτὰ πνεύματα τοῦ θεοῦ
  choice: 上帝的七灵
  rationale: 依照希腊文复数直译，不在正文中将其解释为“七重之灵”或圣灵的丰满。
- source_word: τοὺς ἑπτὰ ἀστέρας
  choice: 七星
  rationale: 简洁直译，并与启示录中的重复象征用语保持一致。
- source_word: Οἶδά σου τὰ ἔργα
  choice: 我知道你的行为
  rationale: “行为”在现代汉语中自然，能概括所做之事，也适合启示录审察教会的固定表达。
- source_word: ὄνομα ἔχεις ὅτι ζῇς
  choice: 你有活着的名声
  rationale: 既保留ὄνομα“名、名声”的意象，又使现代读者理解这是外在声誉；脚注提供更贴近字面的表达。
- source_word: νεκρὸς εἶ
  choice: 其实你是死的
  rationale: 直截了当地保留与“活着”的强烈反差；“其实”自然传达καί在此形成的转折，而不削弱判语。
theological_decisions:
- issue: “上帝的七灵”的所指
  choice: 正文保留复数形式“上帝的七灵”
  alternative: 解释为圣灵的完全或丰满；或理解为七位天上的灵
  rationale: 希腊文明确使用复数，具体象征所指存在争议，因此译文不预先作教义性裁定。
- issue: 受信对象ἀγγέλῳ的身份
  choice: 正文译为“天使”
  alternative: 使者，或教会的人间代表
  rationale: 该词兼有“天使”和“使者”两义；启示录的天启文学语境支持“天使”，但以脚注保留真实的词义歧义。
- issue: “活着”与“死的”性质
  choice: 保留未经解释的生命与死亡比喻
  alternative: 明确增译为“属灵上活着／死亡”
  rationale: 原文以强烈比喻作出判断，却没有在本节明说“属灵上”；正文不应加入解释性限定。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。引语层次以冒号和单引号呈现；“这样说”保留先知宣告的语感。“行为”“名声”避免古奥，同时“上帝的七灵”“死的”等关键表达尽量贴近原文并保留象征张力。
