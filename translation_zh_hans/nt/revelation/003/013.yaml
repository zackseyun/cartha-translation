  yaml_path: translation/nt/revelation/003/013.yaml
  text: The one who has an ear[b][a], let him hear what the Spirit says to the churches.
translation:
  language: zh_hans
  text: 凡有耳的，就当听圣灵向众教会所说的话。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: 凡有耳的
  rationale: 希腊文以带冠词的现在分词作名词用，连同单数“耳”，形成普遍性的格言式呼吁。“凡有耳的”既保留单数意象，也符合现代汉语表达。
- source_word: ἀκουσάτω
  choice: 就应当听
  rationale: 第三人称单数不定过去时主动命令式，表达郑重的劝令。“应当听”自然传达命令语气；这里的“听”也可包含留心并回应之意。
- source_word: τί
  choice: 所说的话
  rationale: τί引出圣灵言说的内容。译为“所说的话”比直译“什么”更符合现代汉语句法，意义不变。
- source_word: τὸ πνεῦμα
  choice: 圣灵
  rationale: 在《启示录》写给众教会的重复劝勉公式中，此处最可能指圣灵；汉语直接译作“圣灵”，明确其语境中的所指。
- source_word: λέγει
  choice: 所说
  rationale: 现在时陈述该言说行为；汉语“所说”自然表达其内容关系，无须刻意加入进行体。
- source_word: ταῖς ἐκκλησίαις
  choice: 向众教会
  rationale: 与格名词标明圣灵讲话的对象。复数译作“众教会”，既保留复数，也贴合本书七封信的语境；“各教会”亦属可能。
theological_decisions:
- issue: τὸ πνεῦμα的所指
  choice: 圣灵向众教会说话
  alternative: 人的灵，或非人格化的预言之灵
  rationale: 本句是《启示录》七封信中反复出现的固定劝勉，语境最自然地指圣灵借先知性信息向众教会讲话；这一选择依据上下文，不加入宗派性解释。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“凡……的，就应当……”传达格言式、普遍性的呼吁；避免古雅的“有耳可听的，就应当听”。脚注标记置于完整句末，正文与脚注相互对应。
