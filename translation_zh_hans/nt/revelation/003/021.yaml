  text: ὁ νικῶν δώσω αὐτῷ καθίσαι μετ’ ἐμοῦ ἐν τῷ θρόνῳ μου, ὡς κἀγὼ ἐνίκησα καὶ ἐκάθισα μετὰ τοῦ πατρός μου ἐν τῷ θρόνῳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/021.yaml
  text: The one who conquers—I will grant him to sit with me on my throne[b][a], just as I also conquered and sat down with my Father on his throne.
translation:
  language: zh_hans
  text: 得胜的人[a]，我要赐他在我的宝座上与我同坐，正如我也得了胜，在我父的宝座上与他同坐。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“战胜的人”。本节两次使用同一希腊语动词νικάω；正文前后均译作“得胜”，以保留重复和胜利主题。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ νικῶν
  choice: 得胜的人
  rationale: 现在时分词作名词用，指任何持续忠贞并最终得胜的人。“得胜”在现代中文中自然，也能与本节后半句的ἐνίκησα保持词根呼应。
- source_word: δώσω αὐτῷ καθίσαι
  choice: 我要赐他……坐
  rationale: δίδωμι与不定式连用，表达赐予某人一项权利或殊荣；“赐他……坐”既保留“赐予”的意义，也符合中文表达。
- source_word: μετ’ ἐμοῦ
  choice: 与我一同
  rationale: μετά加属格表示相伴、联合；“与我一同”清楚保留共同坐席的关系。
- source_word: ἐν τῷ θρόνῳ μου
  choice: 坐在我的宝座上
  rationale: 希腊语ἐν在宝座意象中按现代汉语习惯译作“在……上”，避免生硬的“在宝座里”。
- source_word: ὡς κἀγὼ
  choice: 正如我也
  rationale: 保留ὡς的比较关系，以及κἀγώ中καί所表达的“也”。
- source_word: ἐνίκησα
  choice: 得了胜
  rationale: 与前面的νικῶν统一译出胜利主题，同时用完成性的“得了胜”反映不定过去时所叙述的已成事实。
- source_word: ἐκάθισα μετὰ τοῦ πατρός μου
  choice: 与我的父一同坐
  rationale: 直接表达基督得胜后与父同坐的陈述，不额外解释其性质。
- source_word: ἐν τῷ θρόνῳ αὐτοῦ
  choice: 在他的宝座上
  rationale: 按现代汉语的宝座搭配自然处理ἐν，同时保留“他的宝座”这一所属关系。
theological_decisions:
- issue: ὁ νικῶν所指的范围及阳性单数表达
  choice: 正文采用代表性单数“得胜的人……他”
  alternative: 得胜者……他们；凡得胜的
  rationale: 希腊文以阳性单数分词和代词表达代表性个体，应许适用于每一位得胜的人。中文“他”可保留单数对应，脚注说明其代表性，避免误解为只限男性。
- issue: 得胜者与基督同坐，以及基督与父同坐之间的平行
  choice: 直接保留经文的强烈平行关系
  alternative: 在正文中将“同坐”解释为仅具象征意义，或加入本体论限定
  rationale: 原文把两者明确类比，却未在本节解释这种同坐的具体性质。译文应保留其神学张力，不削弱应许，也不加入原文没有的教义说明。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“得胜的人”兼顾启示录反复出现的胜利主题与普通读者的可理解性；两处“一同坐”保持原文平行，句式清晰，不加入解释性神学限定。
