base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/022.yaml
  text: The one who has an ear[b][a], let him hear what the Spirit says to the churches.
translation:
  language: zh_hans
  text: 凡有耳的，就当听圣灵向众教会所说的话。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: 凡有耳的
  rationale: 定冠词加现在分词构成实体化表达，指任何符合条件的人；保留原文“耳”的单数形式，也符合汉语圣经劝勉语体。
- source_word: ἀκουσάτω
  choice: 都应当听
  rationale: 第三人称单数不定过去时命令式表达郑重劝勉。汉语用“应当听”自然传达命令力量；“都”使前面的泛指主语与谓语衔接顺畅，并非把原文改为复数对象。
- source_word: τί
  choice: ……的话
  rationale: τί引出所听内容。汉语以“所说的话”表达最自然，同时完整保留内容关系。
- source_word: τὸ πνεῦμα
  choice: 圣灵
  rationale: 在启示录二至三章反复出现的公式中，此处所指是圣灵。汉语没有借大小写标明专名的手段，因此译作“圣灵”以明确语境中的所指。
- source_word: λέγει
  choice: 所说
  rationale: 现在时直陈语气表示圣灵正在或一贯向众教会发言；嵌入“所说的话”是自然、庄重的现代汉语表达。
- source_word: ταῖς ἐκκλησίαις
  choice: 向众教会
  rationale: 与格标明说话的对象。复数ἐκκλησίαις译作“众教会”，保留对多个地方教会的指向。
theological_decisions:
- issue: 泛指单数表达及其性别形式
  choice: 凡有耳的，都应当听
  alternative: 有耳的人，就让他听
  rationale: 希腊文为阳性单数的实体化分词和第三人称单数命令式，但其功能是代表性、泛指性的。现代汉语无需用性别代词表达这种语法性别；所选译法保留个体性的呼召，同时自然涵盖所有听者。
- issue: τὸ πνεῦμα的所指
  choice: 圣灵
  alternative: 那灵／灵
  rationale: 上下文中这是启示录写给众教会之信息的固定结语，所指为圣灵。译作“圣灵”在汉语中明确该语境所指，而不引入额外教义说明。
translation_notes:
  register: 采用现代、庄重且便于诵读的标准普通话。“凡有耳的”保留原文反复劝勉的修辞特色；“都应当听”避免生硬照搬希腊语第三人称命令式。脚注标记置于全句之后。
