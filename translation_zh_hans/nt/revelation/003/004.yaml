id: REV.3.4
reference: Revelation 3:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἀλλὰ ⸂ἔχεις ὀλίγα⸃ ὀνόματα ἐν Σάρδεσιν ἃ οὐκ ἐμόλυναν τὰ ἱμάτια αὐτῶν, καὶ περιπατήσουσιν μετ’ ἐμοῦ ἐν λευκοῖς, ὅτι ἄξιοί εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/004.yaml
  text: But you have a few names in Sardis who have not soiled their garments[a], and they will walk with me in white[c][b], because they are worthy.
translation:
  language: zh_hans
  text: 但在撒狄，你还有几个名字[a]没有玷污自己的衣裳[b]；他们要身穿白衣[c]与我同行，因为他们是配得的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “几个名字”即“几个人”；希腊文直译为“几个名字”。
    reason: lexical_alternative
  - marker: b
    text: “玷污”也可译作“弄脏”。
    reason: lexical_alternative
  - marker: c
    text: 希腊文简作“在白色中”，这里很可能指身穿白衣。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: 但
  rationale: 承接上文对撒狄教会的责备，表达鲜明转折；“但”简洁自然。
- source_word: ἔχεις ὀλίγα ὀνόματα
  choice: 你还有几个名字
  rationale: 保留希腊文“几个名字”的醒目说法，以“名字”转指可辨认的个人；“还有”符合汉语语境，也凸显在整体衰败中仍有少数人。
- source_word: ἐν Σάρδεσιν
  choice: 在撒狄
  rationale: 按地点意义直译城市名；前置地点短语使现代汉语行文自然。
- source_word: οὐκ ἐμόλυναν τὰ ἱμάτια αὐτῶν
  choice: 没有玷污自己的衣裳
  rationale: μολύνω兼有弄脏、玷污之意；“玷污”既保留衣着意象，也传达其道德和宗教象征。“自己的”自然表达反身所属关系。
- source_word: περιπατήσουσιν μετ’ ἐμοῦ
  choice: 他们要……与我同行
  rationale: 保留“行走”的具体意象及与基督相伴的含义；“同行”比逐字的“与我行走”更自然庄重。
- source_word: ἐν λευκοῖς
  choice: 身穿白衣
  rationale: 希腊文简略作“在白色之中”，结合前面的衣裳意象，所省略的衣物含义明确；汉语以“身穿白衣”自然呈现该椭圆表达。
- source_word: ὅτι ἄξιοί εἰσιν
  choice: 因为他们是配得的
  rationale: 直接保留经文所陈述的原因和“配得”概念，不以教义性解释淡化或扩充其含义。
theological_decisions:
- issue: ὀνόματα应直译为“名字”还是意译为“人”
  choice: 正文保留“几个名字”
  alternative: 几个人
  rationale: “名字”是原文有意而醒目的转喻，可强调在失落群体中仍被辨认的个人；脚注说明其实际所指，以兼顾可懂度。
- issue: μολύνω的衣着及道德象征
  choice: 没有玷污自己的衣裳
  alternative: 没有弄脏自己的衣裳
  rationale: “玷污”能同时承载衣裳被污染的图像和道德、宗教层面的不洁含义，而不把象征解释死。
- issue: ἐν λευκοῖς的简略表达
  choice: 身穿白衣
  alternative: 在白色中
  rationale: 原文形容词作名词性或省略性用法，语境很可能指白衣；正文采用自然汉语，脚注保留原文的简洁形式。
- issue: ἄξιοί εἰσιν是否需要用教义解释加以缓和
  choice: 因为他们是配得的
  alternative: 因为他们配这样做
  rationale: 原文明确陈述“他们是配得的”；译文不把它扩展为功德论，也不因系统神学顾虑而弱化。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留启示录中的衣裳、白衣和同行意象；对“几个名字”采取较形式对应的译法，并以脚注帮助普通读者理解。
