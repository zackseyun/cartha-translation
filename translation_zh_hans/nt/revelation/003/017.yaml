id: REV.3.17
reference: Revelation 3:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὅτι λέγεις ⸀ὅτι Πλούσιός εἰμι καὶ πεπλούτηκα καὶ ⸀οὐδὲν χρείαν ἔχω, καὶ οὐκ οἶδας ὅτι σὺ εἶ ὁ ταλαίπωρος ⸀καὶ ἐλεεινὸς καὶ πτωχὸς καὶ τυφλὸς καὶ γυμνός,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/017.yaml
  text: because you say[a], ‘I am rich, and I have become wealthy[b], and I have need of nothing,’ and you do not know that you are wretched and pitiable and poor and blind and naked.
translation:
  language: zh_hans
  text: 因为你说：“我是富足的，已经发了财，什么都不缺。”你却不知道，你正是那困苦、可怜、贫穷、瞎眼、赤身的人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι（句首）
  choice: 因为
  rationale: 在上下文中引出责备的缘由，保留其因果作用。
- source_word: λέγεις ὅτι
  choice: 你说：“……”
  rationale: 第二个 ὅτι 引出所说的内容；汉语以直接引语表达最清楚自然。
- source_word: Πλούσιός εἰμι
  choice: 我是富足的
  rationale: 直译其自我评价，并与后文“贫穷”形成鲜明反差。
- source_word: πεπλούτηκα
  choice: 已经发了财
  rationale: 希腊语完成时兼有致富过程及其现存结果；“已经发了财”在现代汉语中自然地保留这两层意味。
- source_word: οὐδὲν χρείαν ἔχω
  choice: 什么都不缺
  rationale: 准确表达“没有任何需要”的强调语气，同时符合现代汉语习惯。
- source_word: οὐκ οἶδας
  choice: 你却不知道
  rationale: 保留认知动词“知道”；“却”显明自我判断与真实处境之间的反差。
- source_word: σὺ εἶ ὁ ταλαίπωρος
  choice: 你正是那困苦……的人
  rationale: “正是”体现显明的主语代词所带的强调，“那……的人”则自然传达定冠词使描述格外尖锐的作用。
- source_word: ἐλεεινός
  choice: 可怜
  rationale: 表达值得怜悯，与“困苦”有所区分。
- source_word: πτωχός
  choice: 贫穷
  rationale: 保留经济词汇的字面形象，与“富足、发了财”的自称构成反讽。
- source_word: τυφλός
  choice: 瞎眼
  rationale: 保留原文形象，不在正文中加上“属灵”等解释。
- source_word: γυμνός
  choice: 赤身
  rationale: 保留原文直白而强烈的裸露形象。
theological_decisions:
- issue: 是否在财富、贫穷、瞎眼和赤身等形象中明加“属灵”
  choice: 正文保留这些字面的形象，不增添“属灵”等限定语。
  alternative: 译作“属灵上富足……属灵上贫穷”等解释性表达。
  rationale: 原文本身借这些并列形象形成反讽和隐喻张力；加上解释性限定会替读者预先消解这种张力。
- issue: 如何体现 ὁ ταλαίπωρος 中定冠词的尖锐语气
  choice: 译作“你正是那困苦……的人”。
  alternative: 仅译作“你是困苦、可怜……”或“你这个困苦的人”。
  rationale: 所选表达既体现定冠词及显明主语的强调，又避免“你这个……”在现代汉语中过度口语化或辱骂化。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“富足”与“发了财”避免机械重复，同时保留状态与致富结果的区别；末尾连续并列五项描述，以维持原文紧迫、尖锐的修辞力度。英文咨询层所列脚注标记与脚注内容位置明显不相符，因此未将其移植到中文正文；本节无需脚注即可忠实表达原文。
