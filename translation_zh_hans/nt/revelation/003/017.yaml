  source_fidelity: 译文准确传达句首ὅτι的因果关系、两层自我宣称（“富足”“已经发了财”）及“什么都不缺”的全称否定；也保留了随后对真实处境的无知，以及五项连续、尖锐的描述。未将贫穷、瞎眼和赤身解释化为“属灵”层面，恰当地保留原文的修辞张力。
  naturalness: 整体为自然、庄重的现代标准汉语。“富足的，已经发了财，什么都不缺”层递清晰；“你却不知道，你正是那困苦、可怜、贫穷、瞎眼、赤身的人”有足够的对比与谴责力度，末尾并列亦流畅。
