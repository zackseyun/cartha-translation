  text: Καὶ τῷ ἀγγέλῳ τῆς ἐν Λαοδικείᾳ ἐκκλησίας γράψον· Τάδε λέγει ὁ Ἀμήν, ὁ μάρτυς ὁ πιστὸς ⸀καὶ ἀληθινός, ἡ ἀρχὴ τῆς κτίσεως τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/014.yaml
  text: 'And write to the angel of the church in Laodicea: These things says the Amen[a], the faithful and true witness[b], the beginning of the creation of God.'
translation:
  language: zh_hans
  text: 你要写信给在老底嘉的教会的使者[a]：那位“阿们”、信实而真实的见证者、上帝所造万物的开端[b]，这样说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“天使”。原词既可指天使，也可指传信者。
    reason: lexical_alternative
  - marker: b
    text: 或译“上帝所造万物的源头”，或“掌管上帝所造万物的主宰”。“开端”所译的希腊词也可表示“源头”或“掌权者”。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: 使者
  rationale: “使者”保留该词既可指天使、也可指传信者的基本含义；在启示录七教会的固定称呼中通常理解为教会的“使者”，另一可能译法在脚注说明。
- source_word: Τάδε λέγει
  choice: 这样说
  rationale: 采用简洁庄重的先知宣告公式，贴近希腊文表达，同时符合现代汉语习惯。
- source_word: ὁ Ἀμήν
  choice: 那位“阿们”
  rationale: 保留“阿们”这一独特称号及其希伯来语所承载的真实、确定和可信意味，不将其解释性地改译。
- source_word: μάρτυς
  choice: 见证者
  rationale: 既保留作证的法律意味，也适合启示和宣告真理的语境。
- source_word: πιστὸς
  choice: 信实
  rationale: 表达忠诚与可靠，并与基督称号的庄重语体相称。
- source_word: ἀληθινός
  choice: 真实
  rationale: 与“信实”自然并列，表达真实、确实而非虚假之意。
- source_word: ἀρχὴ
  choice: 开端
  rationale: 这是最直接且不预先裁定解释的译法；该词也可能表示源头或掌权者，相关可能性列入脚注。
- source_word: κτίσεως
  choice: 创造
  rationale: 在“上帝创造的开端”这一属格结构中简明对应 κτίσις，并保留其可指创造行动或受造界的语义空间。
- source_word: τοῦ θεοῦ
  choice: 上帝
  rationale: 以现代标准汉语常用称谓直接表达希腊文属格“上帝的”。
theological_decisions:
- issue: 基督称号 ἡ ἀρχὴ τῆς κτίσεως τοῦ θεοῦ 的含义
  choice: 那位上帝创造的开端
  alternative: 那位上帝创造万物的源头；那位掌管上帝所造万物的主宰
  rationale: ἀρχή 可指开端、源头或掌权者。正文采用最直接的“开端”，保留原文的神学张力，不在翻译中裁定这句争议性称号的具体关系；其他有词义依据的理解列入脚注。
- issue: ἀγγέλῳ 在七教会书信称呼中的所指
  choice: 使者
  alternative: 天使
  rationale: 原词可指天上的天使或受差遣传信的人。正文用较宽泛的“使者”，避免把所指对象解释得过死，并在脚注保留“天使”译法。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“那位……那位……那位……”对应原文连续的定冠词称号结构，保留宣告的节奏和强调。“阿们”作为专名式称号加引号，以帮助普通读者识别其特殊用法。
