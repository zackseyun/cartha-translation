id: REV.3.19
reference: Revelation 3:19
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐγὼ ὅσους ἐὰν φιλῶ ἐλέγχω καὶ παιδεύω· ⸀ζήλευε οὖν καὶ μετανόησον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/019.yaml
  text: Those whom I love[a], I rebuke and discipline[c][b]. Therefore be zealous and repent.
translation:
  language: zh_hans
  text: 凡我所爱的人，我都责备管教[a]。所以，你要热心，也要悔改。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “管教”在这里包含为使人改正并成长而施行的训练，不只是惩罚。
    reason: cultural_note
lexical_decisions:
- source_word: ἐγὼ
  choice: 我
  rationale: 希腊文显明主语并带一定强调；现代汉语用“我”即可自然表达，若译成“至于我”会在本句中过度凸显对比。
- source_word: ὅσους ἐὰν
  choice: 凡……的人……都
  rationale: 这一不定关系结构表示“凡是我所……的／所有我所……的”。“凡……都”在汉语中自然地保留其概括范围。
- source_word: φιλῶ
  choice: 爱
  rationale: φιλέω在此表达真实的爱与亲爱；译作“爱”既自然有力，也不人为建立它与ἀγαπάω之间的技术性区别。
- source_word: ἐλέγχω
  choice: 责备
  rationale: 语境指向揭明过错并促使人改正；“责备”准确表达纠正性的斥责，而不局限于单纯揭露。
- source_word: παιδεύω
  choice: 管教
  rationale: 该词兼含纠正和培育训练，并非只指惩罚。“管教”在现代汉语中能保留这种带有塑造目的的纠正含义。
- source_word: ζήλευε
  choice: 要热心
  rationale: 现在时命令语气要求持续保持热切、认真积极的态度；“热心”直接而自然，也保留命令的强度。
- source_word: οὖν
  choice: 所以
  rationale: οὖν引出由前句而来的回应；“所以”清楚自然地表达推论关系。
- source_word: μετανόησον
  choice: 要悔改
  rationale: μετανοέω在此要求道德与属灵方向的转变；“悔改”是准确、通行且庄重的表达。
theological_decisions:
- issue: φιλέω所表达的爱与管教之间的关系
  choice: 译为“爱”，不弱化为“喜欢”或“疼爱”
  alternative: 所疼爱／所喜爱
  rationale: 原文以真实的爱作为责备和管教的根据。译作“爱”保留其神学分量，同时不把φιλέω与其他希腊语爱词之间的差异教义化。
- issue: παιδεύω的性质
  choice: 译为“管教”，兼顾纠正与培育
  alternative: 惩罚／训练／责打
  rationale: 原词并非仅指报应式惩罚，也不只是温和教导；“管教”保留纠正与塑造并存的张力。
- issue: ζήλευε的命令所指
  choice: 译为“要热心”
  alternative: 要恳切／要发热心
  rationale: 原文要求热切认真的回应，但未进一步限定具体表现；主文不补入原文没有明说的对象或方式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“凡……都”保留ὅσους ἐὰν的概括意味；两次“要”使并列命令在汉语中清楚有力。脚注标记紧随其解释的“管教”之后。
