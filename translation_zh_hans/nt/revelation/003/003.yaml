id: REV.3.3
reference: Revelation 3:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: μνημόνευε οὖν πῶς εἴληφας καὶ ἤκουσας καὶ τήρει, καὶ μετανόησον· ἐὰν οὖν μὴ γρηγορήσῃς, ⸀ἥξω ὡς κλέπτης, καὶ οὐ μὴ ⸀γνῷς ποίαν ὥραν ἥξω ἐπὶ σέ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/003.yaml
  text: Therefore remember how you have received and heard[a]; keep it, and repent. So if you do not stay awake, I will come like a thief[c][b], and you will certainly not know at what hour I will come upon you.
translation:
  language: zh_hans
  text: 所以，要记得你是怎样领受、怎样听见的[a]；要持守，并且悔改。那么，你若不警醒[b]，我必像贼一样来到[c]；我在什么时刻临到你，你绝不会知道。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“记得你是怎样领受、怎样听见的”。这里可能强调他们当初领受和听见的方式；也有人理解为要记住所领受、所听见的信息。
    reason: alternative_reading
  - marker: b
    text: “警醒”也可译作“保持清醒”或“儆醒守望”。
    reason: lexical_alternative
  - marker: c
    text: “像贼一样来到”强调来得突然、出乎意料。本节本身没有说明这是指末后的审判，还是较近期的管教性临到。
    reason: cross_reference
lexical_decisions:
- source_word: μνημόνευε
  choice: 要记得
  rationale: 现在时命令语气带有持续记念的意味；“要记得”自然、明确，也保留劝诫力度。
- source_word: οὖν
  choice: 所以／因此
  rationale: 本节两处 οὖν 都承接上下文作推论；分别用“所以”和“因此”，既显明逻辑关系，也避免中文重复生硬。
- source_word: πῶς
  choice: 怎样
  rationale: 忠实保留方式副词的含义，不直接改成“什么”，从而保留它可能强调领受和听见之方式的歧义。
- source_word: εἴληφας
  choice: 你是怎样领受
  rationale: “领受”适合信息或教导的语境；中文借“要记得”及整体语境表达其过去发生而至今仍有影响的完成时意义。
- source_word: ἤκουσας
  choice: 怎样听见
  rationale: 直接表达先前听见信息的行动，并与前面的“怎样领受”构成自然平行。
- source_word: τήρει
  choice: 要持守
  rationale: τηρέω 可含保守、遵守之意；“持守”兼顾保存所领受的信息和按其而行，不把语义单独限定为“服从”。
- source_word: μετανόησον
  choice: 悔改
  rationale: 这是新约语境中简明、通行的表达，指从罪中回转。
- source_word: γρηγορήσῃς
  choice: 警醒
  rationale: “警醒”保留清醒守望的隐喻，也与随后贼突然来到的意象自然衔接。
- source_word: ἥξω ὡς κλέπτης
  choice: 我就要像贼一样来到
  rationale: 保留明喻及突然、出乎意料的意味，不进一步界定这次来到的性质。
- source_word: οὐ μὴ γνῷς
  choice: 你绝不会知道
  rationale: “绝不会”传达 οὐ μή 加虚拟语气的强烈否定，现代中文自然有力。
- source_word: ποίαν ὥραν
  choice: 在什么时刻
  rationale: “时刻”比泛指的“时候”更贴近 ὥρα，同时符合现代中文表达。
- source_word: ἐπὶ σέ
  choice: 临到你
  rationale: 表达朝向并及于对象的动态，语气庄重；同时不把它过度限定为“攻击你”或纯粹中性的“到你这里”。
theological_decisions:
- issue: πῶς εἴληφας καὶ ἤκουσας 所指的是方式还是内容
  choice: 译作“你是怎样领受、怎样听见的”
  alternative: “你所领受、所听见的是什么”或“你领受和听见的道”
  rationale: 原文明确使用 πῶς（“怎样”），最直接指向方式；译文保留这一措辞及其可能的强调，不擅自把它收窄为信息内容。
- issue: “我就要像贼一样来到”所指的来临性质
  choice: 保留未加限定的警告
  alternative: 明确解释为末日再临，或明确解释为对当地教会的即时审判／管教
  rationale: 本节强调来临的突然和不可预知，却没有明说其范围；译文不替原文解决这一神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“持守”“悔改”“警醒”“临到”保留启示文学和劝诫语气，但避免古奥句式。脚注标记均置于对应主文位置。
