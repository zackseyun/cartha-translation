id: REV.3.10
reference: Revelation 3:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὅτι ἐτήρησας τὸν λόγον τῆς ὑπομονῆς μου, κἀγώ σε τηρήσω ἐκ τῆς ὥρας τοῦ πειρασμοῦ τῆς μελλούσης ἔρχεσθαι ἐπὶ τῆς οἰκουμένης ὅλης, πειράσαι τοὺς κατοικοῦντας ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/010.yaml
  text: Because you have kept my word of endurance[a], I also will keep you from the hour of testing that is about to come upon the whole inhabited world[b], to test those who dwell on the earth.
translation:
  language: zh_hans
  text: 因为你持守了我忍耐之道[a]，我也必保守你脱离[b]那将要临到普天下的试炼时刻，为要试验那些住在地上的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“关于我忍耐的道”，或“我那呼召人忍耐的信息”。原文短语可以有几种彼此相关的理解。
    reason: lexical_alternative
  - marker: b
    text: 或译“在这试炼时刻中保守你”，或“使你不进入这试炼时刻”。原文直译为“保守……脱离”，本身并未解决后来关于这种保护将如何实现的神学争论。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐτήρησας
  choice: 持守了
  rationale: 既表达遵守、坚守的含义，也与下文同源动词 τηρήσω 所译的“保守”形成可辨认的呼应；简体中文不必机械复制同一个词。
- source_word: τὸν λόγον τῆς ὑπομονῆς μου
  choice: 我忍耐的道
  rationale: “道”在此指话语或信息；这一较为凝练的表达保留了属格关系的多义性，没有断定它只指基督的忍耐、关于忍耐的信息，或呼召人忍耐的命令。
- source_word: κἀγώ
  choice: 我也
  rationale: 保留原文强调而相应的意味：因为对方持守，基督也必保守。
- source_word: τηρήσω ἐκ
  choice: 必保守你脱离
  rationale: 直接呈现 τηρέω 与 ἐκ 的组合，同时不把“脱离”进一步解释为灾前移走、在试炼中蒙保全，或免受试炼效力。
- source_word: ὥρας
  choice: 时刻
  rationale: 既保留“hour”的意象，又符合现代汉语对一段特定时期的自然表达。
- source_word: πειρασμοῦ
  choice: 试炼
  rationale: 涵盖考验、试验和患难性试炼的语义范围，避免把此处仅限于引诱犯罪的“试探”。
- source_word: τῆς μελλούσης ἔρχεσθαι
  choice: 那将要临到
  rationale: 自然表达 μέλλω 加不定式所具有的前瞻性，并保留事件临近或即将发生的语感。
- source_word: ἐπὶ τῆς οἰκουμένης ὅλης
  choice: 临到普天下
  rationale: “普天下”是自然而庄重的现代汉语表达，可传达整个有人居住之世界的范围，而不把 οἰκουμένη 误作宇宙本身。
- source_word: πειράσαι
  choice: 为要试验
  rationale: 表达不定式在语境中的目的意义，并与前面的“试炼”保持词义呼应。
- source_word: τοὺς κατοικοῦντας ἐπὶ τῆς γῆς
  choice: 那些住在地上的人
  rationale: 保留启示录反复使用的动词性表达及其文学呼应，不压缩成较普通的“地上的居民”。
theological_decisions:
- issue: 末世语境中 τηρήσω ἐκ 的含义
  choice: 必保守你脱离
  alternative: 保守你经过这试炼时刻而安然无恙；使你不进入这试炼时刻
  rationale: 正文按原文结构直译，但不裁定这应许具体借着事先移走、在其中保护，还是使其免受试炼而实现，从而保留原文引发的神学张力。
- issue: τὸν λόγον τῆς ὑπομονῆς μου 中属格的关系
  choice: 我忍耐的道
  alternative: 关于我忍耐的道；我那呼召人忍耐的信息
  rationale: 希腊文可容纳数种彼此相关的理解；正文不把属格关系限定为其中一种，脚注列出主要可能。
translation_notes:
  register: 采用自然、庄重而普通读者可懂的现代标准汉语。“持守—保守”兼顾中文习惯与原文重复；“普天下”“住在地上的人”保留启示文学语感。脚注标记均置于所说明的正文短语之后。
