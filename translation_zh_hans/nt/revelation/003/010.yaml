  naturalness: “我忍耐的道”沿用传统译经语汇，读者大致能理解，但在现代标准汉语中属格关系不够清楚，容易被读作“我所忍耐的道路”，略显生硬。改为“我忍耐之道”可保留其凝练、庄重和未完全限定的关系，同时更合乎汉语书面表达。
