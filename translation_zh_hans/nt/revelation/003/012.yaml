id: REV.3.12
reference: Revelation 3:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ νικῶν ποιήσω αὐτὸν στῦλον ἐν τῷ ναῷ τοῦ θεοῦ μου, καὶ ἔξω οὐ μὴ ἐξέλθῃ ἔτι, καὶ γράψω ἐπ’ αὐτὸν τὸ ὄνομα τοῦ θεοῦ μου καὶ τὸ ὄνομα τῆς πόλεως τοῦ θεοῦ μου, τῆς καινῆς Ἰερουσαλήμ, ἡ ⸀καταβαίνουσα ἐκ τοῦ οὐρανοῦ ἀπὸ τοῦ θεοῦ μου, καὶ τὸ ὄνομά μου τὸ καινόν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/012.yaml
  text: The one who conquers—I will make him a pillar in the temple of my God[a], and he will never go out from it anymore. And I will write on him the name of my God, and the name of the city of my God, the new Jerusalem, which comes down out of heaven from my God[c][b], and my own new name.
translation:
  language: zh_hans
  text: 得胜的人[a]，我要使他成为我神的殿中的柱子；他必永不再出去。[b]我要把我神的名、我神之城——就是那从天上、从我神那里降下来的新耶路撒冷——的名，以及我自己的新名[c]，都写在他身上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “得胜”也可译作“战胜”或“胜过”。相应的希腊语动词在《启示录》中反复出现，指忠信而得胜。
    reason: lexical_alternative
  - marker: b
    text: 希腊文使用强烈否定，意思是“必定永远不再出去”。
    reason: source_emphasis
  - marker: c
    text: 也可译作“我的新名”；希腊文的表达带有强调。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ νικῶν
  choice: 得胜的人
  rationale: 现在时分词作名词用，指代表性的一类人；“得胜”保留《启示录》中反复出现的 νικάω 主题，也比单称“胜利者”更能体现持续忠信而得胜的意味。
- source_word: ποιήσω αὐτὸν στῦλον
  choice: 我要使他成为……柱子
  rationale: 保留 ποιέω 加宾语和表语的结构，以及“柱子”这一关于稳固、长存和尊荣的建筑意象，不将比喻解释化。
- source_word: ἐν τῷ ναῷ τοῦ θεοῦ μου
  choice: 我神殿中
  rationale: ναός 特指殿或圣所，而非整个圣殿区域；“神殿”在现代汉语中简洁清楚，并保留“我神”这一重要重复。
- source_word: ἔξω οὐ μὴ ἐξέλθῃ ἔτι
  choice: 他必永不再出去
  rationale: “必永不”表达 οὐ μή 加虚拟式的强烈否定，“再”对应 ἔτι；不在正文中补出原文未明说的“从那里”。
- source_word: γράψω ἐπ’ αὐτὸν
  choice: 写在他身上
  rationale: 直译 γράφω 与 ἐπί 的组合，保留写上或刻上标记的意象，而不限定具体方式。
- source_word: τὸ ὄνομα τῆς πόλεως τοῦ θεοῦ μου
  choice: 我神之城的名
  rationale: 保留与前后几个“名”短语平行的结构；“之城”使多层所属关系清晰且庄重。
- source_word: ἡ καταβαίνουσα ἐκ τοῦ οὐρανοῦ ἀπὸ τοῦ θεοῦ μου
  choice: 那从天上、从我神那里降下来的
  rationale: 分别呈现 ἐκ 所指的出处“从天上”和 ἀπό 所指的来源“从我神那里”，并用定语结构体现分词对新耶路撒冷的修饰。
- source_word: τὸ ὄνομά μου τὸ καινόν
  choice: 我自己的新名
  rationale: “自己的”自然地表达重复冠词及后置形容词所带的强调，同时不推测这个新名的内容。
theological_decisions:
- issue: 应许对象的阳性单数形式
  choice: 使用“他”
  alternative: 使用“那人”或复数“他们”
  rationale: 希腊文以阳性单数分词和代词表达代表性对象；“他”保留原文形式，同时在“得胜的人”这一通称中仍具有代表性。
- issue: 得荣耀的耶稣所说“我神”的重复
  choice: 四处均明确保留“我神”
  alternative: 为行文顺畅而省略或合并部分重复
  rationale: 原文四次重复 τοῦ θεοῦ μου／ἀπὸ τοῦ θεοῦ μου，具有显著的文本与神学分量；译文保留这种张力，不作教义化解释。
- issue: 最后“新名”短语的强调与奥秘性
  choice: 译为“我自己的新名”
  alternative: 译为“我的新名”
  rationale: 前者体现希腊文 τὸ ὄνομά μου τὸ καινόν 的强调结构，却不解释新名是什么，从而保留原文的奥秘性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“柱子”“写在他身上”等核心意象按原文保留；四次“我神”不作修辞性删减。破折号标明“新耶路撒冷”是“我神之城”的同位说明，避免误解修饰关系。
