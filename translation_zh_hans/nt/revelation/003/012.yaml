  to: 得胜的人[a]，我要使他成为我神的殿中的柱子；他必永不再出去。[b]我要把我神的名、我神之城——就是那从天上、从我神那里降下来的新耶路撒冷——的名，以及我自己的新名[c]，都写在他身上。
