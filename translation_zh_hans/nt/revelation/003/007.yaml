id: REV.3.7
reference: Revelation 3:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ τῆς ἐν Φιλαδελφείᾳ ἐκκλησίας γράψον· Τάδε λέγει ὁ ἅγιος, ὁ ἀληθινός, ὁ ἔχων τὴν κλεῖν ⸀Δαυίδ, ὁ ἀνοίγων καὶ οὐδεὶς κλείσει, ⸂καὶ κλείων⸃ καὶ οὐδεὶς ⸀ἀνοίγει·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/007.yaml
  text: 'And write to the angel of the church in Philadelphia: These things says the Holy One[a], the True One, the one who has the key of David, who opens and no one will shut[b], and who shuts and no one opens:'
translation:
  language: zh_hans
  text: “你要写信给非拉铁非教会的天使[a]：那位圣洁、真实的，拿着大卫的钥匙[b]，开了，无人能关；关了，无人能开的，这样说：”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “天使”也可译作“使者”。希腊词ἀγγέλῳ可指天上的使者或人的传信者；此处具体所指仍有争议。
    reason: alternative_reading
  - marker: b
    text: “大卫的钥匙”很可能呼应《以赛亚书》22:22，是王权中开启和关闭之权柄的意象。
    reason: cross_reference
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: 使者
  rationale: 该词既可指天上的“天使”，也可指传递信息的“使者”。此处身份存在真实歧义；正文采用较宽泛的“使者”，并在脚注保留“天使”这一传统译法。
- source_word: ἐκκλησίας
  choice: 教会
  rationale: 在七封信的称呼格式中，指当地的基督徒群体；“教会”是现代汉语中最清楚自然的对应词。
- source_word: Τάδε λέγει
  choice: 这样说
  rationale: 保留先知宣告式引语的庄重语气，同时符合现代汉语表达。
- source_word: ὁ ἅγιος
  choice: 那圣者
  rationale: 带冠词的形容词在此用作称号；“圣者”既保留称号性质，也不把含义弱化为一般修饰语。
- source_word: ὁ ἀληθινός
  choice: 那真实者
  rationale: ἀληθινός可兼有真实、真正、可信实等意味；“真实者”保留其约翰文献中的宽广含义，不局限为仅仅“诚实”。
- source_word: κλεῖν Δαυίδ
  choice: 大卫钥匙
  rationale: 直译属格结构并保留钥匙这一权柄意象，避免在正文中释义为“大卫王国的权柄”。
- source_word: ἀνοίγων καὶ οὐδεὶς κλείσει
  choice: 开了就无人会关
  rationale: 以自然汉语表达现在分词与将来时动词的组合，并保留无人能够逆转其开启之举的含义。
- source_word: κλείων καὶ οὐδεὶς ἀνοίγει
  choice: 关了就无人打开
  rationale: 与前句形成对应，并保留希腊文末尾现在时的表达，不擅自改成将来时。
theological_decisions:
- issue: ὁ ἅγιος、ὁ ἀληθινός作为基督论称号
  choice: 译为指向说话者的两个并列称号：“那圣者、那真实者”
  alternative: 译为一般形容性表达：“那圣洁、真实的”
  rationale: 冠词加形容词的结构在这里具有名词性和称号功能；上下文中的说话者是复活的基督。译文保留这一庄严称谓，而不额外扩展其教义含义。
- issue: “大卫钥匙”的以赛亚书背景
  choice: 正文保留“大卫钥匙”的意象
  alternative: 释译为“掌管大卫王国权柄的”
  rationale: 该短语很可能呼应以赛亚书22:22，表达大卫王权范围内开启和关闭的权柄；但正文应保留经文意象，让脚注说明互文背景。
- issue: ἀγγέλῳ所指的身份
  choice: 正文译“使者”，脚注注明也可译“天使”
  alternative: 正文直接译“天使”
  rationale: 希腊词本身容许天上使者或人间传信者两种理解，启示录七教会信息中的具体所指有争议；采用“使者”避免在正文中排除任何一方。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。称号使用“那圣者、那真实者”，保留原文的平行结构和庄严语气；“开了……关了……”则采用自然汉语，呈现两句不可逆转的对称宣告。脚注标记均置于其实际说明的词语之后，并纠正咨询层中脚注标记与内容错位的问题。
