  source_fidelity: 译文整体准确传达了收信对象、基督的称号、“大卫的钥匙”及开启/关闭无人能逆转的宣告。但ἀγγέλῳ在本书及本节的常规、直接译法宜为“天使”；正文用“使者”虽属该词可容许的词义，却在没有上下文决定人间使者的情况下弱化了原文最自然的指称。以脚注保留“使者”的可能性，较能同时维持原文的歧义与译文的准确性。
