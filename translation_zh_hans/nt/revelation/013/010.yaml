id: REV.13.10
reference: Revelation 13:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἴ τις ⸂εἰς αἰχμαλωσίαν, εἰς αἰχμαλωσίαν⸃ ὑπάγει· εἴ τις ἐν μαχαίρῃ ⸀ἀποκτανθῆναι αὐτὸν ἐν μαχαίρῃ ἀποκτανθῆναι. ὧδέ ἐστιν ἡ ὑπομονὴ καὶ ἡ πίστις τῶν ἁγίων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/010.yaml
  text: If anyone is for captivity[a], into captivity he goes; if anyone is to be killed with the sword, with the sword he must be killed[c][b]. Here is the endurance and the faith of the saints.
translation:
  language: zh_hans
  text: 若有人是要被掳的，他就被掳去[a]；若有人是要被刀杀的，他就必被刀杀[b]。圣徒的忍耐和信心[c]就在这里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“若有人被掳，他就被掳去。”这句话也可理解为对既定遭遇的陈述，而不是一道命令。
    reason: alternative_reading
  - marker: b
    text: 有些抄本或异文在本句写作：“若有人用刀杀人，他也必被刀杀。”这一异文会使本句带有报应原则的含义。
    reason: textual_variant
  - marker: c
    text: “信心”也可译作“忠信”。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ τις
  choice: 若有人
  rationale: 保留不定条件句的普遍、开放语气，也是自然的现代汉语表达。
- source_word: εἰς αἰχμαλωσίαν ... ὑπάγει
  choice: 是要被掳的……就被掳去
  rationale: 保留“被掳”这一关键词的重复，并以“是要……的”反映原文省略、格言式的结构；“去”对应ὑπάγει。
- source_word: αἰχμαλωσία
  choice: 被掳
  rationale: 表达被人掳走、落入俘虏境地的意思，同时保留启示文学中审判宣告的色彩。
- source_word: ἐν μαχαίρῃ
  choice: 被刀
  rationale: 在被动句中以“被刀杀”自然表达工具意义，并保留圣经审判用语的简洁力度。
- source_word: ἀποκτανθῆναι
  choice: 被杀
  rationale: 准确表达不定过去时被动不定式的被动意义，语言清楚、现代。
- source_word: αὐτὸν
  choice: 他就必被刀杀
  rationale: 原文代词所在结构在汉语中若逐字翻译会显得生硬；改用主语“他”构成完整被动句，并以“必”传达这句话所表达的确定性。
- source_word: ὧδέ ἐστιν
  choice: 就在这里
  rationale: 保留指示和强调作用，同时符合现代汉语表达习惯。
- source_word: ὑπομονή
  choice: 忍耐
  rationale: 指圣徒在苦难压力下坚忍持守；“忍耐”简洁且符合《启示录》语境。
- source_word: πίστις
  choice: 信心
  rationale: 保留“信”的基本含义；本语境也可能强调“忠信”，故在脚注中注明。
- source_word: τῶν ἁγίων
  choice: 圣徒的
  rationale: 简洁表达属于上帝之圣洁子民的忍耐和信心，并沿用读者熟悉的圣经称谓。
theological_decisions:
- issue: 前两小句表达命定的遭遇，还是向读者发出的命令
  choice: 以描述性的确定遭遇来翻译：“是要……的，就……”
  alternative: 可理解为“若有人被掳，他就被掳去”；另有异文可形成报应原则，即用刀杀人的也必被刀杀
  rationale: 所采用的希腊文本简短且带省略，较自然地宣告将要临到的遭遇。译文不把它扩展成禁止抵抗的命令，也不依据异文把报应原则直接写入正文。
- issue: πίστις在结句中的含义
  choice: 信心
  alternative: 忠信
  rationale: πίστις可指信心，也可在坚忍受苦的语境中带有忠贞、忠信的意味；正文采用“信心”，脚注保留另一可能。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。前两句保留原文格言式的平行和关键词重复，不以解释性措辞消除其省略与张力；结句用“就在这里”突出圣徒在压迫中的忍耐与信心。
