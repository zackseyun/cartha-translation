source:
  edition: SBLGNT
  text: καὶ ἤνοιξε τὸ στόμα αὐτοῦ εἰς ⸀βλασφημίας πρὸς τὸν θεόν, βλασφημῆσαι τὸ ὄνομα αὐτοῦ καὶ τὴν σκηνὴν αὐτοῦ, τοὺς ἐν τῷ οὐρανῷ σκηνοῦντας.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/006.yaml
  text: And it opened its mouth in blasphemies against God[a], to blaspheme his name and his dwelling[b], those dwelling in heaven.
translation:
  language: zh_hans
  text: 它就开口说出亵渎神的话[a]，亵渎他的名和他的居所[b]，就是那些住在天上的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“又亵渎那些住在天上的”；即把末句看作“亵渎”的第三个对象，而不是对“他的居所”的解释。
    reason: alternative_reading
  - marker: b
    text: “居所”也可译作“会幕”或“帐棚”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤνοιξε τὸ στόμα αὐτοῦ
  choice: 它就开口
  rationale: 按汉语习惯表达“张开它的口”；“开口”保留原文鲜明动作，又避免生硬直译。首个 αὐτοῦ 指兽，故用“它”。
- source_word: εἰς βλασφημίας πρὸς τὸν θεόν
  choice: 说亵渎神的话
  rationale: εἰς βλασφημίας 表示开口发出亵渎言语，πρός 在敌对言语语境中指向神；此译自然呈现复数所含的多番或多样亵渎言论。
- source_word: βλασφημῆσαι
  choice: 亵渎
  rationale: 不额外限定为目的或结果，以并列动词形式自然承接前句，同时保留不定式的语义作用。
- source_word: τὸ ὄνομα αὐτοῦ
  choice: 他的名
  rationale: 直译“名”，保留圣经语境中关乎神身份与尊荣的内涵。
- source_word: τὴν σκηνὴν αὐτοῦ
  choice: 他的居所
  rationale: σκηνή 可指帐棚、会幕或居所；“居所”在此能自然表达神在天上的居处，同时不强加礼仪性含义。
- source_word: τοὺς ἐν τῷ οὐρανῷ σκηνοῦντας
  choice: 那些住在天上的
  rationale: 以自然现代汉语表达现在分词；主文按同位解释理解，但另以脚注保留它作为第三个亵渎对象的可能。
theological_decisions:
- issue: “他的居所”与“那些住在天上的”之间的句法关系
  choice: 主文将末句视为解释“他的居所”的同位语，以“就是”明示现代汉语所需的解释关系。
  alternative: 将“那些住在天上的”视为与“他的名”“他的居所”并列的第三个亵渎对象。
  rationale: 两种分析在希腊文中都可成立。同位语解读可说明 σκηνή 与 σκηνοῦντας 的词义呼应；但并列解读同样可信，故在脚注中保留，不将歧义静默消除。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“它”承接上下文中的兽；涉及神时用“他”。“开口说亵渎神的话”比逐字译作“在亵渎中张口”更符合汉语，同时保留原文的强烈动作感。
