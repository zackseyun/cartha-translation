id: REV.13.1
reference: Revelation 13:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ εἶδον ἐκ τῆς θαλάσσης θηρίον ἀναβαῖνον, ἔχον κέρατα δέκα καὶ κεφαλὰς ἑπτά, καὶ ἐπὶ τῶν κεράτων αὐτοῦ δέκα διαδήματα, καὶ ἐπὶ τὰς κεφαλὰς αὐτοῦ ⸀ὀνόματα βλασφημίας.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/001.yaml
  text: And I saw a beast coming up out of the sea[a], having ten horns and seven heads, and on its horns ten crowns[b], and on its heads names of blasphemy.
translation:
  language: zh_hans
  text: 我看见一只兽从海中上来。它有十个角、七个头；十个角上有十顶王冠[a]，七个头上有亵渎的名号[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“冠冕”；原文指王者所戴的冠饰。
    reason: lexical_nuance
  - marker: b
    text: 也可译作“亵渎之名”。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδον
  choice: 我又看见
  rationale: 用简单叙事动词表达不定过去时；“又”承接本段开头的 καί，也符合异象叙述的推进，不增添“在异象中”等原文未明说的内容。
- source_word: ἐκ τῆς θαλάσσης
  choice: 从海中
  rationale: ἐκ 表明兽从海的内部出来；“从海中上来”既保留方向感，也符合现代汉语表达。
- source_word: θηρίον
  choice: 一只兽
  rationale: 保留启示文学中的兽形意象，不译成“怪物”，也不在正文中直接解释为帝国、君王或其他对象。
- source_word: ἀναβαῖνον
  choice: 上来
  rationale: 现在分词描绘兽正在从海中升上来的动态场景；汉语以“从海中上来”自然表达。
- source_word: ἔχον κέρατα δέκα καὶ κεφαλὰς ἑπτά
  choice: 它有十个角、七个头
  rationale: 直接保留角与头的异象形象；补出代词并使用现代汉语量词，使句子清楚自然。
- source_word: διαδήματα
  choice: 王冠
  rationale: διάδημα 特指带有王权意味的冠冕；“王冠”比音译或较古雅的“冕”更易懂，同时保留其王权色彩。
- source_word: ἐπὶ τῶν κεράτων αὐτοῦ
  choice: 十个角上
  rationale: 按处所义翻译 ἐπί，保留十顶王冠分别位于十角之上的异象结构。
- source_word: ἐπὶ τὰς κεφαλὰς αὐτοῦ
  choice: 七个头上
  rationale: 按处所义表达，明确名号位于兽的七个头上。
- source_word: ὀνόματα βλασφημίας
  choice: 亵渎的名号
  rationale: 以定中结构表达属格关系，保留它既可理解为“带有亵渎性质的名号”，也可较直译地理解为“亵渎之名”的空间，不擅自补出被亵渎的对象。
theological_decisions:
- issue: 启示文学象征的解释
  choice: 在正文中保留“兽、角、头、王冠、名号”等具体意象
  alternative: 把兽直接解释为帝国、君王、政权或撒但的代理者
  rationale: 本节呈现异象而未在此处明说各象征的具体所指；翻译不应把某一种末世论解释写入正文。
- issue: διάδημα 的王权含义
  choice: 译作“王冠”
  alternative: 译作“冠冕”或“冕”
  rationale: “王冠”清楚表达这种冠饰的王权性质，并与较宽泛、也可能表示奖赏之冠的词汇保持概念区别。
- issue: ὀνόματα βλασφημίας 的属格关系
  choice: 译作“亵渎的名号”，并以脚注给出较形式对应的译法
  alternative: 译作“亵渎上帝的名号”或“亵渎性名号”
  rationale: 原文没有明说亵渎的对象；当前译法保存属格的语义张力，避免补入原文未明示的信息。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“一只兽”“十个角、七个头”使用现代量词以提高可读性；“名号”比“名字”更符合铭刻于头上的庄严而可怖的异象语境。标点将兽的出现与其外形描述分开，便于朗读。
