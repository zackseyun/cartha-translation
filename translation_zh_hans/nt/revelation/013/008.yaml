  rationale: 修订仅改善汉语句法和名册意象的常用表达，没有改变原文的范围、时态结果或神学张力。正文仍按就近关系把“从创世以来”连于“被杀的羔羊”；脚注完整呈现该短语可连于名字被记入生命册的另一种读法。
