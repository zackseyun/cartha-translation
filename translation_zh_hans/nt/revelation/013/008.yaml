  text: καὶ προσκυνήσουσιν ⸀αὐτὸν πάντες οἱ κατοικοῦντες ἐπὶ τῆς γῆς, ⸀οὗ οὐ γέγραπται τὸ ὄνομα ⸀αὐτοῦ ἐν τῷ βιβλίῳ τῆς ζωῆς τοῦ ἀρνίου τοῦ ἐσφαγμένου ἀπὸ καταβολῆς κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/008.yaml
  text: And all who dwell on the earth will worship him—everyone whose name has not been written in the book of life of the Lamb who was slain from the foundation of the world[a].
translation:
  language: zh_hans
  text: 凡住在地上、名字没有记在那位从创世以来被杀的羔羊的生命册上的人，都要敬拜它。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“凡住在地上、名字从创世以来没有记在那被杀的羔羊的生命册上的人，都要敬拜它。”希腊文中的“从创世以来”既可理解为修饰“被杀”，也可理解为修饰“记在”。
    reason: alternative_reading
lexical_decisions:
- source_word: προσκυνήσουσιν
  choice: 要敬拜
  rationale: 在《启示录》中，该词通常指带有宗教意义的崇拜，与敬拜上帝和羔羊形成鲜明对照；“敬拜”准确保留这种语义。
- source_word: κατοικοῦντες ἐπὶ τῆς γῆς
  choice: 住在地上的人
  rationale: 保留《启示录》中反复出现的表达及其群体指向，同时符合现代汉语习惯。
- source_word: οὗ οὐ γέγραπται τὸ ὄνομα αὐτοῦ
  choice: 所有名字没有写在……上的人
  rationale: 希腊文以单数关系代词和单数“名字”逐一指向前述众人；汉语用总括结构表达自然，并保留每个人的名字是否被记载这一重点。
- source_word: γέγραπται
  choice: 没有写在
  rationale: 希腊文完成时强调先前写入所形成的现存状态；汉语“没有写在……上”在此自然地表达该结果状态。
- source_word: βιβλίῳ τῆς ζωῆς
  choice: 生命册
  rationale: “生命册”是清楚、凝练且广为理解的圣经用语，能表达记载名字的天上名册意象。
- source_word: τοῦ ἀρνίου
  choice: 羔羊的
  rationale: “羔羊”保留《启示录》中这一基督论称号的献祭与弥赛亚意象。
- source_word: τοῦ ἐσφαγμένου
  choice: 被杀的
  rationale: 该词含暴力宰杀及献祭色彩；“被杀”庄重而易懂，并避免“被屠宰”在现代汉语中可能产生的不当物化感。
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: 从创世以来
  rationale: 这一译法自然表达自世界奠基之时起的时间含义，并保留传统圣经语感。
- source_word: αὐτόν
  choice: 它
  rationale: 代词回指前文的兽；现代汉语通常以“它”指非人受造物。虽然兽被人格化，译作“它”仍能清楚区分其与羔羊。
theological_decisions:
- issue: “从创世以来”的句法归属
  choice: 正文连接“被杀的羔羊”
  alternative: 连接“名字没有写在生命册上”，即“名字从创世以来没有写在那被杀之羔羊的生命册上”
  rationale: 按本节希腊文词序，该短语紧接“被杀的”，较自然地修饰羔羊被杀；但《启示录》17:8的平行表达有力支持它修饰名字的写入。正文采用就近连接，并以脚注保留真实存在的另一种句法理解，不消解其神学张力。
translation_notes:
  register: 采用现代、庄重、易懂的标准普通话。“生命册”“羔羊”等词保持《启示录》的核心意象与互文一致性；句式尽量贴近原文，同时用“就是”明确解释前面的“凡住在地上的人”。
