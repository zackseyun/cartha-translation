  text: καὶ ἵνα μή τις ⸀δύνηται ἀγοράσαι ἢ πωλῆσαι εἰ μὴ ὁ ἔχων τὸ χάραγμα, τὸ ὄνομα τοῦ θηρίου ἢ τὸν ἀριθμὸν τοῦ ὀνόματος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/017.yaml
  text: so that no one can buy or sell unless he has the mark[b][a], the name of the beast or the number of its name.
translation:
  language: zh_hans
  text: 使任何人都不能买卖，除非有那印记、兽的名或它名的数目的人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “它名的数目”也可译作“他名的数目”。
    reason: 保留αὐτοῦ在“兽”具人格化描写的语境中可采用的另一种代词译法。
lexical_decisions:
- source_word: ἵνα μή τις δύνηται
  choice: 使任何人都不能
  rationale: ἵνα在这里表达目的或结果，μή τις是否定的不定主体，δύνηται表示能力或可能性；此译法自然地保留“使无人能够”的语力。
- source_word: ἀγοράσαι ἢ πωλῆσαι
  choice: 买卖
  rationale: 两个不定式指日常商业活动；“买卖”是现代汉语中简洁自然的对应表达。
- source_word: εἰ μὴ ὁ ἔχων
  choice: 除非是有……的人
  rationale: εἰ μή引出唯一例外，冠词化分词ὁ ἔχων意为“有……的人”；中文无需把希腊文的语法阳性误译成仅指男性。
- source_word: τὸ χάραγμα
  choice: 那印记
  rationale: χάραγμα可指刻印、盖印或标记；启示录这一语境中，“印记”既准确又符合中文读者熟悉的意象。
- source_word: τὸ ὄνομα τοῦ θηρίου
  choice: 兽的名
  rationale: 直接保留属格关系以及启示文学中θηρίον作为象征性称号的用法。
- source_word: ἢ τὸν ἀριθμὸν τοῦ ὀνόματος αὐτοῦ
  choice: 或它名的数目
  rationale: 保留“名的数目”这一不寻常但重要的原文表达；“它”以兽为直接先行词，同时脚注注明人格化译法的可能性。
theological_decisions:
- issue: ὁ ἔχων的语法阳性与泛指意义
  choice: 有……的人
  alternative: 他有……
  rationale: 希腊文为阳性单数形式，但在此泛指任何人；现代汉语用“……的人”可准确表达其泛指功能，不额外限定性别。
- issue: 印记、兽名与名的数目之间的句法关系
  choice: 那印记……也就是有兽的名或它名的数目
  alternative: 有那印记、兽的名或它名的数目
  rationale: 原文以并置结构把“印记”与“兽的名或它名的数目”相连，可理解为后者说明印记的内容，也可视为并列标识。正文采用较自然的解释性表达，同时不把“兽名”和“名的数目”合并为同一项。
- issue: αὐτοῦ指向兽时的表达
  choice: 它名的数目
  alternative: 他名的数目
  rationale: θηρίον在希腊文中为中性名词，中文“兽”通常用“它”回指；但上下文赋予兽人格化行动，因此“他”仍是可行译法，列入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“买卖”简洁表达商业限制；“印记”“兽的名”“名的数目”保留启示文学的关键术语。
