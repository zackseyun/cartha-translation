id: REV.13.15
reference: Revelation 13:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἐδόθη ⸀αὐτῷ ⸂δοῦναι πνεῦμα⸃ τῇ εἰκόνι τοῦ θηρίου, ἵνα καὶ λαλήσῃ ἡ εἰκὼν τοῦ θηρίου καὶ ποιήσῃ ⸀ἵνα ὅσοι ἐὰν μὴ προσκυνήσωσιν τῇ εἰκόνι τοῦ θηρίου ἀποκτανθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/015.yaml
  text: And it was given to him to give breath to the image of the beast[b][a], so that the image of the beast might even speak and cause those who would not worship the image of the beast to be killed.
translation:
  language: zh_hans
  text: 它得以把气息赐给兽的像[a]，以致兽的像甚至能说话；兽的像又使[b]所有不敬拜兽像的人都被杀害。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “气息”或译“灵”或“生命”。
    reason: lexical_alternative
  - marker: b
    text: “又使”或译“并使事情如此发生：凡不敬拜兽像的，都被杀害”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδόθη αὐτῷ
  choice: 它得以
  rationale: 用不指明施予者的表达保留希腊文被动句所留下的施事空缺，同时自然表达这能力是被准许或授予的；“它”按上下文指前述第二只兽，却不在译文中另加身份解释。
- source_word: δοῦναι πνεῦμα
  choice: 把气息赐给
  rationale: πνεῦμα可指气息、灵或生命；兽像随后能够说话，因此“气息”最贴近使像活动起来的具体图景，也避免断言它真正具有生命或有某个灵住在其中。
- source_word: εἰκών
  choice: 像
  rationale: “像”既简洁又能涵盖供人敬拜的形像，不把原文范围缩窄为特定材质或形制的“雕像”。
- source_word: θηρίον
  choice: 兽
  rationale: 采用《启示录》异象语境中自然、庄重的通用译法，不用解释性较强的“怪兽”。
- source_word: ἵνα καὶ λαλήσῃ
  choice: 使兽像甚至能够说话
  rationale: “使……能够”自然表达目的或结果；“甚至”传达καί在此所突出的惊异意味。
- source_word: ποιήσῃ ἵνα
  choice: 并使
  rationale: 以现代汉语的使役结构表达ποιέω后接ἵνα从句的致使意义，避免生硬直译。
- source_word: ὅσοι ἐὰν μὴ προσκυνήσωσιν
  choice: 所有不敬拜……的人
  rationale: 自然表达不定关系结构的普遍范围，并保留拒不敬拜者这一条件。
- source_word: προσκυνήσωσιν
  choice: 敬拜
  rationale: 在《启示录》中，对兽及兽像所作的προσκυνέω具有明确的宗教敬拜含义。
- source_word: ἀποκτανθῶσιν
  choice: 都被杀害
  rationale: 保留原文被动形式，措辞清楚直接，不额外赋予司法处决的意味。
theological_decisions:
- issue: πνεῦμα在兽像受活动能力时的含义
  choice: 气息
  alternative: 灵；生命
  rationale: “气息”既与兽像开口说话的情景相合，也保留πνεῦμα的语义张力；它不武断认定兽像得着真正生命或有位格性的灵。
- issue: ἐδόθη这一被动形式的施予者
  choice: 不明说施予者
  alternative: 明说是上帝或龙所授予
  rationale: 希腊文没有点明施予者。译文保留这种含蓄，不替读者判定终极许可者或直接赋能者。
- issue: 兽像致使拒拜者死亡的作用方式
  choice: 译作“并使……都被杀害”
  alternative: 并使事情如此发生：凡不敬拜兽像的，都被杀害
  rationale: 原文ποιήσῃ ἵνα表达致使关系，却没有说明兽像如何实施或由谁执行杀害；译文保留结果与间接施事的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“它得以”保留启示文学中能力被授予的意味和未明说的施予者；避免用“获赐权柄”等措辞增添原句没有明说的名词。“兽像”作为后文简称，符合现代汉语表达。
