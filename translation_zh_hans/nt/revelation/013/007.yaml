review_pass:
  verdict: revise
  source_fidelity: 译文基本准确传达了两次无名被动式、兽与圣徒的敌对争战、对圣徒的得胜，以及对四类群体的权柄。惟首句“又赐给它去与圣徒争战”在汉语中缺少受赐内容，句法不完整；末尾将 γλῶσσα 释为“说各种语言的人”则把原文并列的“语言”项目解释性地改写成人群，且破坏四项名词并列。
  naturalness: “赐给它去与圣徒争战”不合现代标准汉语的通常搭配。改为“又准许它与圣徒争战，并胜过他们”既自然，也保留原文未说明准许者的被动／受准含义。四项范围改作“每一支派、民族、语言和国家”，清晰、平行且符合启示录的固定列举。
  terminology: “圣徒”“争战”“权柄”“胜过”均适合庄重的现代圣经汉语，并未擅自界定得胜的终极性质。“民族”可对应 λαός，“国家”可对应 ἔθνος；“语言”保留 γλῶσσα 的转喻用法，不将其扩展为“说该语言的人”。
