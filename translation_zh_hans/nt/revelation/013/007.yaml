revisions:
- from: 又赐给它去与圣徒争战[a]，并胜过他们[b]；又有权柄赐给它，可以管辖各支派、各民族、说各种语言的人[c]和各国。
  to: 又准许它与圣徒争战[a]，并胜过他们[b]；又有权柄赐给它，管辖每一支派、民族、语言[c]和国家。
  rationale: 修订首句，使汉语完整自然，并以不指明施事者的“准许”保留 ἐδόθη 的受准／被动含义。第二处仍明确译出“有权柄赐给它”，对应原文的 ἐξουσία。末尾恢复四项名词的平行列举；脚注保留 γλῶσσα 可转指语言群体的说明，而不在正文中作解释性扩展。
