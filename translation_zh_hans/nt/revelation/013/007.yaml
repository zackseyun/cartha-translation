source:
  edition: SBLGNT
  text: καὶ ἐδόθη αὐτῷ ποιῆσαι πόλεμον μετὰ τῶν ἁγίων καὶ νικῆσαι αὐτούς, καὶ ἐδόθη αὐτῷ ἐξουσία ἐπὶ πᾶσαν φυλὴν καὶ λαὸν καὶ γλῶσσαν καὶ ἔθνος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/007.yaml
  text: And it was given to him to make war against the saints and to conquer them[c][b][a], and authority was given to him over every tribe and people and language and nation.
translation:
  language: zh_hans
  text: 又准许它与圣徒争战[a]，并胜过他们[b]；又有权柄赐给它，管辖每一支派、民族、语言[c]和国家。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“同圣徒争战”；在这里表示敌对性的争战，即攻击圣徒。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“战胜他们”或“制伏他们”。
    reason: lexical_alternative
  - marker: c
    text: 原文直译为“舌头”；这里转指语言，亦可指使用该语言的群体。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδόθη αὐτῷ
  choice: 赐给它／有……赐给它
  rationale: 保留两处被动、受予的表达，不点明赐予者，以维持原文对许可来源的含蓄处理；以“它”指兽，也避免赋予人格化性别。
- source_word: ποιῆσαι πόλεμον μετὰ τῶν ἁγίων
  choice: 去与圣徒争战
  rationale: “争战”自然表达 ποιῆσαι πόλεμον；在战争搭配中，“与”表示敌对对象。“圣徒”是 ἅγιοι 在本语境中简洁而通行的译法。
- source_word: νικῆσαι αὐτούς
  choice: 胜过他们
  rationale: “胜过”既可表达战胜，也能保持《启示录》中 νικάω 反复出现的主题性用语，不把含义缩窄为单纯杀灭。
- source_word: ἐξουσία
  choice: 权柄
  rationale: 表达获授的统治权或管辖权，与“赐给”的被动结构相配，避免仅理解为强力或能力。
- source_word: ἐπὶ πᾶσαν φυλὴν καὶ λαὸν καὶ γλῶσσαν καὶ ἔθνος
  choice: 管辖各支派、各民族、说各种语言的人和各国
  rationale: “管辖”自然表达 ἐπί 所指的权柄范围；四项并列予以保留。把 γλῶσσα 按其转喻意义译作“说各种语言的人”，使现代汉语读者不至误解为管辖抽象的语言本身。
theological_decisions:
- issue: 两次 ἐδόθη 所构成的无名被动式
  choice: 采用“赐给它／有权柄赐给它”，不说明赐予者
  alternative: 译作“它获准”或明说“上帝准许它”
  rationale: 原文没有明说赐予者。保留无名施事者，既呈现兽的权力是受授的，也不在译文中替原文解决神圣主权与邪恶获准行动之间的张力。
- issue: 兽对圣徒“得胜”的范围
  choice: 直译为“胜过他们”
  alternative: 解释为永远征服或属灵毁灭圣徒
  rationale: 本节陈述兽在争战中的得胜，却没有在此界定这种得胜的终极或属灵意义；译文不根据后续神学结论加以限定。
translation_notes:
  register: 采用现代、庄重而清楚的书面汉语。“争战”“圣徒”“权柄”保留启示文学和圣经语汇的连贯性；句法尽量贴近希腊文两次“赐给”的平行结构，同时避免生硬直译。
