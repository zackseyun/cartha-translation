  - severity: medium
    issue: γλῶσσα 被解释性改写为“说各种语言的人”
    rationale: 原文在四项范围中并列 φυλή、λαός、γλῶσσα、ἔθνος；将“语言”改为“说各种语言的人”改变了并列项目的语义类别。现代汉语中“管辖……语言”在这一固定范围公式内可理解为语言群体，宜保留“语言”并在脚注说明转喻。
  - severity: low
