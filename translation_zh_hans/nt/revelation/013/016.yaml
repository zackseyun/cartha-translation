revisions:
- from: 它又使所有人——无论是小人物还是大人物，是富人还是穷人，是自由人还是奴隶——都在右手或额头上被加上一个印记[a]，
  to: 它使所有人——无论是小人物还是大人物，是富人还是穷人，是自由人还是奴隶——都在右手或额头上被打上一个印记[a]，
  rationale: 修订仅改善措辞和脚注的句法说明：省去非必要的“又”，将“被加上”改为更自然的“被打上”，并更明确但不武断地交代困难希腊语结构。原有社会身份、印记和身体位置的译法均予保留。
