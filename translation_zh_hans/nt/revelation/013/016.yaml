id: REV.13.16
reference: Revelation 13:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ποιεῖ πάντας, τοὺς μικροὺς καὶ τοὺς μεγάλους, καὶ τοὺς πλουσίους καὶ τοὺς πτωχούς, καὶ τοὺς ἐλευθέρους καὶ τοὺς δούλους, ἵνα ⸀δῶσιν αὐτοῖς ⸀χάραγμα ἐπὶ τῆς χειρὸς αὐτῶν τῆς δεξιᾶς ἢ ἐπὶ τὸ μέτωπον αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/016.yaml
  text: And it causes everyone—the small and the great[a], and the rich and the poor, and the free and the slaves—to be given a mark on their right hand or on their forehead,
translation:
  language: zh_hans
  text: 它使所有人——无论是小人物还是大人物，是富人还是穷人，是自由人还是奴隶——都在右手或额头上被打上一个印记[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较直译为“使他们给他们一个印记”。这里希腊文用主动式“给”，却以“他们”为间接受词，句法不寻常；正文按上下文以被动表达所述结果，未确定执行打印记者。
    reason: 保留ἵνα δῶσιν αὐτοῖς χάραγμα的较字面形式，并说明其主动动词、间接受词与语境性被动译法之间的张力。
lexical_decisions:
- source_word: ποιεῖ
  choice: 使
  rationale: 这里的 ποιέω 与 ἵνα 加虚拟语气连用，表达使某事发生的致使意义。“使”准确而自然，也不额外强化为“强迫”。
- source_word: πάντας
  choice: 所有人
  rationale: 后面三组相对的社会类别说明其范围具有全面性；“所有人”在现代汉语中清楚自然。
- source_word: τοὺς μικροὺς καὶ τοὺς μεγάλους
  choice: 小人物……大人物
  rationale: 该对举泛指社会地位或影响力各异的人。“小人物”和“大人物”既保留原文“小／大”的修辞，又比单说“大小”更不易被误解为年龄或体格。
- source_word: τοὺς πλουσίους καὶ τοὺς πτωχούς
  choice: 富人……穷人
  rationale: 直接呈现原文的经济处境对比，简明自然。
- source_word: τοὺς ἐλευθέρους καὶ τοὺς δούλους
  choice: 自由人……奴隶
  rationale: ἐλεύθερος 与 δοῦλος 在此构成法律和社会身份的明确对比，因此将 δοῦλος 译作“奴隶”，而不是较宽泛的“仆人”。
- source_word: ἵνα δῶσιν αὐτοῖς χάραγμα
  choice: 都……被加上一个印记
  rationale: 现存希腊文按字面是“使他们给他们一个印记”，受事对象明确，而施事指向不够顺畅。正文采用汉语被动式，传达上下文中的事件，同时不指定加印记者；较直译的形式保留在脚注中。
- source_word: χάραγμα
  choice: 印记
  rationale: 该词可指刻印、戳记或识别性的标志；“印记”适合《启示录》的语境，也能涵盖其具体形式未明的特点。
- source_word: ἐπὶ τῆς χειρὸς αὐτῶν τῆς δεξιᾶς
  choice: 在右手……上
  rationale: 按分配意义使用单数“右手”，在汉语中自然，并忠实表达位置。
- source_word: ἢ ἐπὶ τὸ μέτωπον αὐτῶν
  choice: 或额头上
  rationale: 保留原文在“右手”与“额头”之间的二选一结构；汉语不必重复所属代词。
theological_decisions:
- issue: 社会身份对举中的 δοῦλος
  choice: 奴隶
  alternative: 仆人；受束缚的人
  rationale: 与“自由人”直接对举时，重点是受奴役的身份，而不是一般性的服事关系；“奴隶”最清楚地保留这一社会现实。
- issue: 如何处理 ἵνα δῶσιν αὐτοῖς χάραγμα 的不寻常结构
  choice: 正文译为“被加上一个印记”，脚注保留较直译形式
  alternative: “使他们领受一个印记”；“叫他们给他们一个印记”
  rationale: “领受”会把原文的“给”改为“接受”，而逐字翻译在汉语中施事关系含混且生硬。被动表达既忠于上下文所述结果，也不武断确定究竟是谁执行加印记的动作；原文张力由脚注说明。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“小人物／大人物、富人／穷人、自由人／奴隶”保留原文连续三组对举和启示文学的节奏。破折号界定插入的类别清单；句末逗号依照本节尚未完结、继续进入下一节的句法关系。
