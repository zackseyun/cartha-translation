revisions:
- from: 它借着获准在那兽面前施行的神迹，迷惑住在地上的人[a]，吩咐他们为那受过刀伤却仍然活着的兽造一个像[b][c]。
  to: 它借着它获准在那兽面前施行的神迹，迷惑住在地上的人[a]，对住在地上的人说，要为那受过刀伤却仍然活着的兽造一个像[b][c]。
  rationale: 本次修订只处理语气、中文指代清晰度和脚注措辞。正文仍保留“借着”所表达的神迹作为迷惑手段，不明说被动式“获准”的许可者；“为那兽造一个像”仍反映与格关系；“却仍然活着”不将伤后生命状态教义化为明确复活。脚注标记均保留并置于所说明的对应短语之后。
