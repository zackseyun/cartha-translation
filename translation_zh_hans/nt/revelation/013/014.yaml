id: REV.13.14
reference: Revelation 13:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ πλανᾷ ⸀τοὺς κατοικοῦντας ἐπὶ τῆς γῆς διὰ τὰ σημεῖα ἃ ἐδόθη αὐτῷ ποιῆσαι ἐνώπιον τοῦ θηρίου, λέγων τοῖς κατοικοῦσιν ἐπὶ τῆς γῆς ποιῆσαι εἰκόνα τῷ θηρίῳ, ⸂ὃς ἔχει⸃ τὴν πληγὴν ⸂τῆς μαχαίρης καὶ ἔζησεν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/014.yaml
  text: And it deceives those who dwell on the earth because of the signs that it was given to perform in the presence of the beast[c][b][a], telling those who dwell on the earth to make an image for the beast that had the wound of the sword and yet lived.
translation:
  language: zh_hans
  text: 它借着它获准在那兽面前施行的神迹，迷惑住在地上的人[a]，对住在地上的人说，要为那受过刀伤却仍然活着的兽造一个像[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “迷惑”也可译作“使住在地上的人走迷”。
    reason: lexical_alternative
  - marker: b
    text: “为那兽造一个像”也可理解为“造那兽的像”；希腊文直译更接近“为那兽造一个像”。
    reason: lexical_alternative
  - marker: c
    text: “却仍然活着”也可译作“又活了”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πλανᾷ
  choice: 迷惑
  rationale: 既可表达欺骗，也保留使人走迷的含义；现在时在异象叙述中自然译作一般性动作。
- source_word: κατοικοῦντας / κατοικοῦσιν ἐπὶ τῆς γῆς
  choice: 住在地上的人
  rationale: 保留启示录中反复出现的主题性表达及其动词色彩，同时符合现代汉语习惯。
- source_word: διὰ τὰ σημεῖα
  choice: 借着……神迹
  rationale: διά加宾格在此兼具手段与依据色彩；“借着”突出这些神迹是迷惑人的手段。
- source_word: σημεῖα
  choice: 神迹
  rationale: 在本段语境中指超常、具有表征作用的作为；“神迹”是自然且传统的中文对应，但不将其译成更偏重观感的“奇事”。
- source_word: ἐδόθη αὐτῷ ποιῆσαι
  choice: 获准……施行
  rationale: 保留被动所表达的许可，不明说许可者是谁；中文用“获准”比直译“被赐予去做”自然。
- source_word: ἐνώπιον τοῦ θηρίου
  choice: 在那兽面前
  rationale: 简洁保留空间与当面施行的关系。
- source_word: λέγων
  choice: 吩咐
  rationale: 此分词引出它对地上居民所说的话；上下文带有指示其行动的语气，“吩咐”自然，但不强化为绝对权威性的“命令”。
- source_word: ποιῆσαι εἰκόνα τῷ θηρίῳ
  choice: 为……兽造一个像
  rationale: “为”准确反映与格τῷ θηρίῳ的受益、归属或敬奉关系，不直接改成属格意义的“兽的像”。
- source_word: εἰκόνα
  choice: 像
  rationale: 保留可指形象、偶像或雕像的较宽语义范围，不限定其材质与形式。
- source_word: ὃς ἔχει τὴν πληγὴν τῆς μαχαίρης καὶ ἔζησεν
  choice: 那受过刀伤却仍然活着的兽
  rationale: 关系从句指向兽；“受过刀伤”自然表达现有伤痕所源自的既往事件，“却仍然活着”传达伤后存活的语境反差，同时不明确断定复活。
- source_word: μάχαιρα
  choice: 刀
  rationale: μάχαιρα可指刀或短剑；现代中文“刀伤”自然且不对武器形制做过度限定。
theological_decisions:
- issue: ἐδόθη的神圣被动含义
  choice: 译作“获准”，不点明许可者
  alternative: “神赐给它能力”或“它得以”
  rationale: 原文被动语态可能暗示一切仍在更高主权许可之下，但没有明说赐予者；译文保留这一克制与张力。
- issue: ἔζησεν所表达的是存活还是复生
  choice: 译作“却仍然活着”
  alternative: “又活了”或“复活了”
  rationale: 原文可描写受伤之后仍有生命或恢复生命；本节本身不足以要求明确的复活术语，因此避免把神学含义说得过满。
- issue: εἰκών与兽的关系
  choice: 正文译作“为那兽造一个像”
  alternative: “造一个那兽的像”
  rationale: 与格首先表达为兽而造、归于兽或用于敬奉兽；像是否在外形上表现兽虽可能由语境暗示，却不应在正文中取代原有句法关系。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。用“住在地上的人”维持启示录中的重复措辞；以“获准”保留许可者未明的被动表达；“刀伤”避免过度限定μάχαιρα的具体形制。脚注标记均置于与其解释最相关的正文位置。
