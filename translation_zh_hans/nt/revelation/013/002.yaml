id: REV.13.2
reference: Revelation 13:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ τὸ θηρίον ὃ εἶδον ἦν ὅμοιον παρδάλει, καὶ οἱ πόδες αὐτοῦ ὡς ἄρκου, καὶ τὸ στόμα αὐτοῦ ὡς στόμα λέοντος. καὶ ἔδωκεν αὐτῷ ὁ δράκων τὴν δύναμιν αὐτοῦ καὶ τὸν θρόνον αὐτοῦ καὶ ἐξουσίαν μεγάλην.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/002.yaml
  text: And the beast that I saw was like a leopard[a], and its feet were like a bear's, and its mouth was like a lion's mouth. And the dragon gave it his power and his throne and great authority.
translation:
  language: zh_hans
  text: 我所看见的那兽像豹[a]，脚像熊的脚，口像狮子的口。龙把自己的能力、宝座和极大的权柄给了它。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 豹、熊和狮子的形象呼应《但以理书》第7章中关于兽的异象。
    reason: cross_reference
lexical_decisions:
- source_word: θηρίον
  choice: 兽
  rationale: “兽”直接保留启示录中这一固定的末世异象称谓及其凶猛、怪异的象征色彩；“动物”或“生物”过于中性。
- source_word: ὅμοιον παρδάλει
  choice: 形状像豹
  rationale: ὅμοιος加与格表达相似；中文用“形状像豹”自然地呈现整体外观上的比较，又不作额外解释。
- source_word: πόδες αὐτοῦ ὡς ἄρκου
  choice: 脚像熊的脚
  rationale: 原文使用普通的“脚”（πόδες）而非特指爪掌的词；补出第二个“脚”可使希腊文省略式比较在现代汉语中清楚自然。
- source_word: στόμα αὐτοῦ ὡς στόμα λέοντος
  choice: 口像狮子的口
  rationale: 保留原文两次出现的στόμα，以维持异象描写的鲜明感和三个比较之间的形式平衡。
- source_word: δράκων
  choice: 龙
  rationale: “龙”是δράκων在启示录语境中的直接、惯常译法，保留其末世异象角色，不在本节内增添身份解释。
- source_word: δύναμιν
  choice: 能力
  rationale: 此处指龙交给兽的实际力量或行动能力；译作“能力”可与后面的ἐξουσία“权柄”保持语义区别。
- source_word: θρόνον
  choice: 宝座
  rationale: “宝座”保留θρόνος所带有的王权和统治意象，比泛化为“统治地位”更贴近原文。
- source_word: ἐξουσίαν μεγάλην
  choice: 极大的权柄
  rationale: ἐξουσία表示获授的统治权或行使权力的资格，译作“权柄”可区别于δύναμις；“极大的”自然传达μεγάλην的强调。
- source_word: ἔδωκεν αὐτῷ
  choice: 都给了它
  rationale: δίδωμι直译为“给”；“它”清楚指向兽，“都”统摄前列的能力、宝座和权柄，符合现代汉语列举习惯。
- source_word: αὐτοῦ
  choice: 自己的
  rationale: 指龙所有的能力和宝座；反身表达“自己的”在中文中明确回指主语“龙”，避免与兽混淆。
theological_decisions:
- issue: 龙与兽之间的关系及代词指向
  choice: 将兽称为“它”，并用“自己的”明确能力和宝座属于龙。
  alternative: 各处均机械译为“它的”，由读者按上下文判断所指。
  rationale: 希腊文的代词形式本身不区分人格程度；中文采用不同指称可消除语法歧义，同时不增加关于二者本体或身份的教义判断。
- issue: 复合动物形象与《但以理书》第7章的关联
  choice: 正文直接保留豹、熊、狮子的形象，只在脚注提示其呼应。
  alternative: 在正文中明说这是对《但以理书》第7章异象的引用或解释。
  rationale: 原文只陈述比较，并未在本节解释其来源或意义；把关联置于脚注，既帮助读者识别互文，也不替正文解决其象征含义。
- issue: δύναμις与ἐξουσία的区别
  choice: 分别译为“能力”和“权柄”。
  alternative: 分别译为“力量”和“权力”，或两者都译为“权力”。
  rationale: 区分实际能力与获授的统治权，保留原文并列两个不同名词所形成的张力；避免用同一汉语词抹平区别。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。保留“兽、龙、宝座、权柄”等启示文学核心意象；句式略作汉语化处理，以“形状像豹—脚像熊的脚—口像狮子的口”呈现原文的三重平行结构。
