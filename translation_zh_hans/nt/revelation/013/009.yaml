  text: If anyone has an ear[a], let him hear.
translation:
  language: zh_hans
  text: 谁若有耳，就应当听！
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἴ τις
  choice: 谁若
  rationale: 保留原文条件句的形式与开放、泛指的范围；现代汉语“谁若”比逐字的“若有人”更凝练，也符合庄重的劝诫语体。
- source_word: ἔχει
  choice: 有
  rationale: 直接表达持有或具备；在“有耳”这一固定劝诫表达中自然明白。
- source_word: οὖς
  choice: 耳
  rationale: 保留希腊文单数形式及其惯用表达，不扩展为“耳朵”或“能听的耳”，从而避免把隐含意义写入正文。
- source_word: ἀκουσάτω
  choice: 就应当听
  rationale: 第三人称单数命令式在汉语中不能机械对应；“应当”传达郑重的命令和劝勉力量，“听”保留原文关于听见并留心领受的文学与神学回响。
theological_decisions:
- issue: 泛指对象及希腊文单数形式
  choice: 谁若有耳，就应当听
  alternative: 若有人有耳，就让他听
  rationale: 希腊文 τις 是泛指，动词为单数；汉语“谁若……就……”既保持单数性的条件结构，又无需加入原文没有的性别代词。“让他听”在现代汉语中也容易被误解为准许，而非命令。
- issue: 听觉劝诫公式的惯用力量
  choice: 听
  alternative: 听从；留心听；领会
  rationale: 原文使用 ἀκούω 的先知性、启示文学式召唤。保留“听”可维持其丰富含义和与相关经文的呼应，不把它限定为顺从、专注或理解中的某一层面。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。句式保留原文格言式、郑重的呼召；以感叹号体现命令式的强度。正文没有脚注，因此无需脚注标记。
