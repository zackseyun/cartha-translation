id: REV.13.18
reference: Revelation 13:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὧδε ἡ σοφία ἐστίν· ὁ ἔχων νοῦν ψηφισάτω τὸν ἀριθμὸν τοῦ θηρίου, ἀριθμὸς γὰρ ἀνθρώπου ἐστίν· καὶ ὁ ἀριθμὸς ⸀αὐτοῦ ⸂ἑξακόσιοι ἑξήκοντα ἕξ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/018.yaml
  text: 'Here is wisdom: let the one who has understanding calculate the number of the beast[a], for it is the number of a man[b], and its number is six hundred sixty-six.'
translation:
  language: zh_hans
  text: 智慧就在这里：有悟性的人，应当算出那兽的数目，因为这是一个人的数目[a]；它的数目是六百六十六[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这是人的数目”；也可理解为“这是人类的数目”。
    reason: 原文“人的”可指某一个人，也可泛指人或人类，含义并未完全限定。
  - marker: b
    text: 有些抄本作“六百一十六”。
    reason: 说明希腊文抄本中的重要文本异文。
lexical_decisions:
- source_word: ὧδε ἡ σοφία ἐστίν
  choice: 智慧就在这里
  rationale: 保留ὧδε的指示意味，并以自然的现代汉语引出需要智慧辨明之处。
- source_word: ὁ ἔχων νοῦν
  choice: 有悟性的人
  rationale: νοῦς在此侧重理解力和辨识力；“悟性”简洁、庄重，也保留单数概括性表达。
- source_word: ψηφισάτω
  choice: 应当算出
  rationale: 该命令式表示计算、核算；“算出”既体现计算过程，也符合现代汉语。用“应当”传达第三人称命令的劝令语气。
- source_word: τὸν ἀριθμὸν τοῦ θηρίου
  choice: 那兽的数目
  rationale: 直译其所有关系；“那兽”承接上下文中特指的启示文学形象。
- source_word: ἀριθμὸς γὰρ ἀνθρώπου ἐστίν
  choice: 因为这是一个人的数目
  rationale: 保留ἀνθρώπου的单数形式及其可能指向某个人的含义；其也可能表示“人的／人类的”，故在脚注中保留歧义。
- source_word: καὶ ὁ ἀριθμὸς αὐτοῦ
  choice: 它的数目
  rationale: αὐτοῦ回指中性名词θηρίον；汉语以“它”回指兽，清楚而不额外认定其人格身份。
- source_word: ἑξακόσιοι ἑξήκοντα ἕξ
  choice: 六百六十六
  rationale: 按希腊文数词直接译出。
theological_decisions:
- issue: ἀνθρώπου在“ἀριθμὸς γὰρ ἀνθρώπου ἐστίν”中的含义
  choice: 正文译为“一个人的数目”
  alternative: “人的数目”或“人类的数目”
  rationale: 该单数属格可指属于某个人的数目，也可带泛指人或人类性质的意味。正文保留单数指向，脚注列出更宽泛的理解，不判定兽所对应的具体人物，也不消解经文本身的解释张力。
- issue: 数目的抄本异文
  choice: 正文采用“六百六十六”
  alternative: “六百一十六”
  rationale: SBLGNT正文采用666；部分抄本见616，因此以脚注如实说明。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“智慧就在这里”保留启示文学的郑重提示；“有悟性的人，应当算出”避免过度古雅，同时维持劝令语气。脚注只说明真实存在的语义歧义和抄本异文，不加入特定宗派解释。
