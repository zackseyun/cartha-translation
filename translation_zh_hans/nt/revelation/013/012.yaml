revisions:
- from: 它在头一个兽面前[a]施行头一个兽的一切权柄，又使大地和住在地上的人敬拜头一个兽，就是那致命伤已经医好的兽[b]。
  to: 它在头一个兽面前[a]施行头一个兽的一切权柄，又使大地和住在地上的人敬拜头一个兽，就是那致命伤得了医治的兽[b]。
  rationale: 仅作低风险的汉语表达与脚注措辞调整。修订后的“得了医治”忠实呈现ἐθεραπεύθη的被动医治含义，避免将伤口说成“已经医好”的轻微搭配不顺；其余译文保留原稿对希腊文句法、术语和关系含义的准确处理。
