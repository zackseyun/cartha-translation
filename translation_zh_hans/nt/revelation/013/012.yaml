  naturalness: 整体庄重、清楚，适合现代标准汉语的启示文学语体。“住在地上的人”“头一个兽”“敬拜”等措辞自然且前后一致。将“已经医好的”改为“得了医治”可消除修饰结构中的轻微生硬感。
