id: REV.13.12
reference: Revelation 13:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ τὴν ἐξουσίαν τοῦ πρώτου θηρίου πᾶσαν ποιεῖ ἐνώπιον αὐτοῦ. καὶ ⸀ποιεῖ τὴν γῆν καὶ τοὺς ἐν αὐτῇ κατοικοῦντας ἵνα ⸀προσκυνήσουσιν τὸ θηρίον τὸ πρῶτον, οὗ ἐθεραπεύθη ἡ πληγὴ τοῦ θανάτου αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/012.yaml
  text: And it exercises all the authority of the first beast in its presence[a]. And it causes the earth and those who dwell on it to worship the first beast[b], whose mortal wound was healed.
translation:
  language: zh_hans
  text: 它在头一个兽面前[a]施行头一个兽的一切权柄，又使大地和住在地上的人敬拜头一个兽，就是那致命伤得了医治的兽[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“当着头一个兽的面”。这个短语可能强调第二个兽在头一个兽面前，或在它的注视下行事。
    reason: lexical_alternative
  - marker: b
    text: 直译“它那死亡的伤得了医治”；意思是它的致命伤得了医治。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξουσίαν
  choice: 权柄
  rationale: 这里指可施行的权威或支配权，而不只是能力；“权柄”也符合启示文学的庄重语体。
- source_word: πᾶσαν
  choice: 一切
  rationale: 表达头一个兽权柄的完整范围，中文自然且贴近原文。
- source_word: ποιεῖ（第一次）
  choice: 施行
  rationale: ποιεῖ τὴν ἐξουσίαν是“运用、行使权柄”的意思；“施行”比逐字译作“做”自然。
- source_word: ἐνώπιον αὐτοῦ
  choice: 在头一个兽面前
  rationale: 既可表示处于其当面，也可能含有在其注视之下行事的意味；正文保留“面前”这一空间和关系上的含混性。
- source_word: ποιεῖ（第二次）
  choice: 使
  rationale: 与后面的ἵνα结构连用时具有使役作用；“使”没有额外断定具体采用了何种强迫手段。
- source_word: τὴν γῆν
  choice: 大地
  rationale: 启示录中常与天、海相对，具有广泛的世界性范围；“大地”在中文启示文学语境中自然。
- source_word: τοὺς ἐν αὐτῇ κατοικοῦντας
  choice: 住在地上的人
  rationale: 保留κατοικέω的动词表达，也延续启示录反复出现的“住在地上的人”这一主题性称呼。
- source_word: ἵνα προσκυνήσουσιν
  choice: 敬拜
  rationale: 接在使役动词“使”之后，用“使……敬拜”自然表达原文所指向或造成的行动。
- source_word: θηρίον
  choice: 兽
  rationale: 这是启示文学中θηρίον直接而通行的译法。
- source_word: πρῶτον
  choice: 头一个
  rationale: 清楚区别本节所说的两个兽；“头一个”比单独用“第一”更适合修饰具体对象。
- source_word: ἐθεραπεύθη
  choice: 医好
  rationale: 被动形式表示伤得了医治；“医好”保留医治和复原的意象。
- source_word: ἡ πληγὴ τοῦ θανάτου αὐτοῦ
  choice: 致命伤
  rationale: 原文直译为“死亡的伤”，指会导致死亡或具有死亡性质的伤；“致命伤”是自然中文，脚注保留较直译形式。
theological_decisions:
- issue: 第二个兽使地上之人敬拜时，其行动的强制程度
  choice: 使……敬拜
  alternative: 迫使……敬拜
  rationale: 原文使役结构表明第二个兽促成了敬拜，却未在本句明确说明具体强制程度；“使”保留力度而不额外强化为“迫使”。
- issue: ἐνώπιον αὐτοῦ所表达的关系
  choice: 在头一个兽面前
  alternative: 在头一个兽的注视下
  rationale: 原文既可能强调当面或临在，也可能暗示在其注视下行事；正文采用较形式对应的表达，并以脚注说明可能含义，不把关系解释得过窄。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“权柄”“敬拜”等词保留启示文学和宗教语境所需的分量；句式适度贴近原文两个并列分句，同时避免生硬逐字翻译。
