  source_fidelity: 译文准确涵盖 καὶ ποιεῖ σημεῖα μεγάλα、ἵνα καὶ πῦρ ποιῇ、ἐκ τοῦ οὐρανοῦ καταβαίνειν εἰς τὴν γῆν 及 ἐνώπιον τῶν ἀνθρώπων。“又行大异兆”保留了“施行/作出大 signs”的含义；“甚至使火从天降到地上”自然表达该醒目作为；“在人们眼前”准确传达公开可见的范围。未把现象机制断定为神圣神迹或纯属幻象。
  naturalness: 整体庄重、清楚，适合现代汉语圣经叙述语体。“大异兆”稍带圣经文学色彩，但在此类启示文学语境中可理解，也有助于避免“神迹”可能附带的正面神圣评价。语序顺畅，无需改动。
  terminology: “异兆”能保留 σημεῖα 的征象性和非常性，不把它缩窄为一般“奇迹”；“火”“天”“地上”“人们”均恰当。“它”依上下文指称该兽，符合汉语连贯表达。脚注 a 提供“大神迹”“大奇事”等可选译法，脚注 b 适切说明“在人们眼前”的替代表达；标记与正文锚点对应正确。
