id: REV.13.13
reference: Revelation 13:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ποιεῖ σημεῖα μεγάλα, ⸂ἵνα καὶ πῦρ ποιῇ⸃ ἐκ τοῦ οὐρανοῦ ⸂καταβαίνειν εἰς⸃ τὴν γῆν ἐνώπιον τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/013.yaml
  text: And it performs great signs[b][a], even causing fire to come down from heaven to the earth before people.
translation:
  language: zh_hans
  text: 它又行大异兆[a]，甚至使火从天降到地上，就在人们眼前[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“大神迹”或“大奇事”；希腊文意为“异兆、征兆”。
    reason: lexical_alternative
  - marker: b
    text: 或译“当着众人的面”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιεῖ
  choice: 行
  rationale: “行”与“异兆”搭配简洁自然，表达施行或产生非凡作为，不额外判断其机制。
- source_word: σημεῖα μεγάλα
  choice: 大异兆
  rationale: “异兆”保留 σημεῖον 作为具有指示性、可用于迷惑人的非凡征象这一含义；“大”直接对应 μεγάλα。
- source_word: ἵνα καὶ πῦρ ποιῇ
  choice: 甚至使火
  rationale: 此处 ἵνα 可表达结果或目的；“甚至使”自然呈现火从天而降是格外惊人的异兆，同时不强行限定为目的或结果。
- source_word: πῦρ
  choice: 火
  rationale: 按字面翻译，并保留其与先知性天火意象可能存在的呼应。
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: 从天
  rationale: “天”兼具天空与天界的语义空间，适合《启示录》的末世异象语域，也不武断排除原文的含义幅度。
- source_word: καταβαίνειν εἰς τὴν γῆν
  choice: 降到地上
  rationale: 准确表达从上向下并抵达地面的运动，现代汉语自然明晰。
- source_word: ἐνώπιον τῶν ἀνθρώπων
  choice: 在人们眼前
  rationale: 突出异兆公开可见；“人们”对应泛指全人类的 ἀνθρώπων，不限于男性。
theological_decisions:
- issue: 异兆的性质与机制
  choice: 描述兽确实在众人眼前行出可观察的异兆，但不说明这些现象究竟源于超自然能力还是欺骗手段。
  alternative: 译作“大神迹”以强化超自然奇迹，或加入“假象”等措辞以断定只是骗局。
  rationale: 本节陈述异兆及火从天而降的可见现象，却没有在此解释其形而上机制；译文因此保留经文本身的神学张力。
- issue: ἵνα 从句的目的或结果色彩
  choice: 以“甚至使”承接，保留其可表示目的或结果的弹性。
  alternative: 明确译为“为要使”或“结果使”。
  rationale: 上下文可将该从句理解为异兆行为的目的性表现，也可侧重其结果；不宜在译文中单方面消除这种语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“它”承接上下文中的兽；“又”对应 καί。“异兆”避免“神迹”在现代读者心中可能带有的正面神圣色彩，同时保留启示文学中非凡征象的意味。所有脚注标记均置于正文相应位置。
