  text: καὶ μίαν ἐκ τῶν κεφαλῶν αὐτοῦ ⸀ὡς ἐσφαγμένην εἰς θάνατον, καὶ ἡ πληγὴ τοῦ θανάτου αὐτοῦ ἐθεραπεύθη. καὶ ⸀ἐθαυμάσθη ⸂ὅλη ἡ γῆ⸃ ὀπίσω τοῦ θηρίου,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/003.yaml
  text: And one of its heads was as if slaughtered to death[a], and its deadly wound was healed. And the whole earth marveled and followed after the beast[b],
translation:
  language: zh_hans
  text: 我看见它的一颗头，仿佛被宰杀至死[a]；它那致命的伤得了医治。全地都惊叹，跟从了那兽[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“好像被杀至死。”原文用“仿佛”，可能表示所见的样子或相似性，并非直截了当地断定它确实死亡。
    reason: lexical_alternative
  - marker: b
    text: “全地”也可译作“全境”或“全地”；在这里的启示文学语境中，较可能指整个世界，而其惊叹和跟从也涵盖地上的居民。
    reason: lexical_alternative
lexical_decisions:
- source_word: μίαν ἐκ τῶν κεφαλῶν αὐτοῦ
  choice: 它的一颗头
  rationale: μίαν ἐκ加复数属格是部分结构；中文用“它的一颗头”自然、准确。原文此处受前文“我看见”支配，译文补出该动词以形成完整、自然的中文句子。
- source_word: ὡς ἐσφαγμένην εἰς θάνατον
  choice: 仿佛被宰杀至死
  rationale: ὡς保留“仿佛、好像”的异象性比较，并不直接断定事实状态；σφάζω的语气强于一般的“杀死”，故译“宰杀”；εἰς θάνατον译作“至死”，保留其致死意味。
- source_word: ἡ πληγὴ τοῦ θανάτου αὐτοῦ
  choice: 它那致命的伤
  rationale: 属格短语直译为“死亡的伤”不自然；“致命的伤”准确表达该伤带来死亡或具有致死性质，同时不预断其究竟是真死还是表象。
- source_word: ἐθεραπεύθη
  choice: 医好了
  rationale: 被动形式表示伤势得到医治；“医好了”是现代汉语中清楚自然的表达。
- source_word: ἐθαυμάσθη
  choice: 都惊叹
  rationale: 该被动形式在此表达全地陷入惊奇、赞叹之中；“惊叹”保留强烈惊异，又不额外断定这种反应是敬拜、赞同还是恐惧。
- source_word: ὅλη ἡ γῆ
  choice: 全地
  rationale: γῆ可指“地”或“土地”；启示文学的广阔语境支持“全地”，同时中文“地”仍保留一定的词义开放性。
- source_word: ὀπίσω τοῦ θηρίου
  choice: 跟从了那兽
  rationale: ὀπίσω加属格既有在其后而行的图像，也可表达归附；“跟从”在现代汉语中自然，并兼具行动与效忠的可能含义。
- source_word: θηρίου
  choice: 那兽
  rationale: θηρίον在《启示录》的异象中通常指凶猛的兽；“那兽”承接上下文，不将其处理为专名。
theological_decisions:
- issue: 兽头受死与复原的性质
  choice: 译作“仿佛被宰杀至死……致命的伤却医好了”，保留表象、异象类比与致命伤得医治之间的张力。
  alternative: 明确译成真实死亡后复活、政治势力复兴，或伪装出来的死亡。
  rationale: 希腊文以ὡς限定“被宰杀”，又明确说致命伤得了医治，却没有说明这是字面复活、象征性复兴还是欺骗性的模仿；译文不替原文解决这一解释问题。
- issue: 全地跟从兽的反应性质
  choice: 用“惊叹，跟从”描述反应，不直接增译为敬拜或效忠。
  alternative: 译作“敬拜那兽”或“效忠那兽”。
  rationale: 本节只有惊叹和跟从的措辞；敬拜在后续经文中才明确出现，因此此处不提前引入。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“宰杀至死”有意保留原文强烈而略显异象化的表达；“那兽”承接上下文，不作专名化处理。所有脚注标记均已置于正文。
