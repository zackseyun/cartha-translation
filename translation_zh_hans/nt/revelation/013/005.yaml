source:
  edition: SBLGNT
  text: Καὶ ἐδόθη αὐτῷ στόμα λαλοῦν μεγάλα καὶ ⸀βλασφημίας, καὶ ἐδόθη αὐτῷ ⸀ἐξουσία ποιῆσαι μῆνας ⸀τεσσεράκοντα δύο.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/005.yaml
  text: And a mouth was given to him[a], speaking great things and blasphemies[b], and authority was given to him to act for forty-two months.
translation:
  language: zh_hans
  text: 又赐给它一张口，能说大话[b]和亵渎的话；又赐给它权柄，使它能行事四十二个月[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本和译本作：“赐给它权柄，可以持续四十二个月。”
    reason: textual_variant
  - marker: b
    text: “大话”在这里很可能指自大、狂妄或夸口的话。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδόθη
  choice: 赐给
  rationale: 保留被动领受的含义，表明兽所得的口和权柄并非本来就属于它；两次重复“赐给”也对应原文结构。
- source_word: στόμα
  choice: 一张口
  rationale: 保留启示文学中具体而鲜明的“口”这一意象，不将其抽象化为“说话的能力”。
- source_word: λαλοῦν
  choice: 能说
  rationale: 用现代汉语自然表达修饰“口”的现在分词，同时体现这口获赐后所具有的言说功能。
- source_word: μεγάλα
  choice: 大话
  rationale: 原义为“大事／大的话”；在本语境中带有自大、狂妄的意味。“大话”既贴近字面，也能自然传达夸口色彩，而脚注说明其语境含义。
- source_word: βλασφημίας
  choice: 亵渎的话
  rationale: 明确保留该词在上下文中冒犯上帝的宗教含义，并以汉语可数、自然的表达对应复数。
- source_word: ἐξουσία
  choice: 权柄
  rationale: 表达获准或受委派的权限，比“能力”更能配合“赐给”的被动表述。
- source_word: ποιῆσαι
  choice: 行事
  rationale: ποιέω含义宽泛；在持续时间短语前译作“行事”，既符合汉语，也避免擅自补出具体行动或将其窄化为“掌权”。
- source_word: μῆνας τεσσεράκοντα δύο
  choice: 四十二个月
  rationale: 直接表达作为时间延续范围的宾格短语，保留启示文学中的明确数字。
theological_decisions:
- issue: μεγάλα所描写的言语性质
  choice: 译作“大话”，并以脚注说明其自大、狂妄的语境色彩
  alternative: 狂妄的话；夸口的话
  rationale: 上下文强烈暗示骄傲、敌对上帝的言语，但形容词本身较宽泛；正文不将其过度限定，脚注则帮助读者把握语境。
- issue: ποιῆσαι与四十二个月的关系
  choice: 按所给SBLGNT正文译作“可以行事四十二个月”
  alternative: 可以持续四十二个月
  rationale: “行事”对应ποιῆσαι，保留其宽泛含义；“持续”作为部分抄本或翻译传统中的读法置于脚注，不取代正文所据的希腊文本。
- issue: 兽所得权柄的来源性质
  choice: 重复译出“赐给它”
  alternative: 它有权柄
  rationale: 保留两个ἐδόθη的被动形式，呈现兽的口与权柄均为领受所得，同时不在译文中明说赐予者是谁，从而保留原文的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。以“它”指兽，符合中文对非人受造物的通常指称；保留“一张口”的启示文学意象和两次“赐给”的平行结构。
