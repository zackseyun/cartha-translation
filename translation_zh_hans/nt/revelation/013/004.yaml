source:
  edition: SBLGNT
  text: καὶ προσεκύνησαν τῷ δράκοντι ⸂ὅτι ἔδωκεν⸃ τὴν ἐξουσίαν τῷ θηρίῳ, καὶ προσεκύνησαν τῷ θηρίῳ λέγοντες· Τίς ὅμοιος τῷ θηρίῳ, καὶ τίς ⸀δύναται πολεμῆσαι μετ’ αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/004.yaml
  text: And they worshiped the dragon because he had given authority to the beast[a], and they worshiped the beast, saying, “Who is like the beast[c][b], and who is able to make war with it?”
translation:
  language: zh_hans
  text: 他们敬拜那龙，因为龙把权柄给了那兽；他们也敬拜那兽，说：“谁像这兽？[a][c]谁能与它交战呢？”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“谁能与这兽相比？”
    reason: lexical_alternative
  - marker: b
    text: 或译：“谁能与它争战？”
    reason: lexical_alternative
  - marker: c
    text: 这句颂词很可能呼应旧约宣告上帝无可比拟的话（例如《出埃及记》15:11；《诗篇》35:10），却在这里被亵渎性地套用在兽身上。
    reason: cross_reference
lexical_decisions:
- source_word: προσεκύνησαν
  choice: 敬拜
  rationale: 在《启示录》中，προσκυνέω通常指宗教性的崇拜；“敬拜”准确传达此处拜偶像的意味。
- source_word: τῷ δράκοντι
  choice: 那龙
  rationale: 直译启示文学中的象征称谓，并以“那”承接上下文中特指的龙。
- source_word: ὅτι ἔδωκεν
  choice: 因为龙把……给了
  rationale: 将ὅτι理解为原因，说明众人敬拜龙的缘由；汉语无需用过去完成时，语序本身已清楚表达先后关系。补出“龙”可避免连续代词造成歧义。
- source_word: τὴν ἐξουσίαν
  choice: 权柄
  rationale: ἐξουσία在此指授予的统治权或支配权；“权柄”比宽泛的“能力”更贴切，也符合庄重的现代圣经语体。
- source_word: τῷ θηρίῳ
  choice: 那兽
  rationale: “兽”直接保留θηρίον的启示文学意象，不在正文中预先解释其象征对象。
- source_word: Τίς ὅμοιος τῷ θηρίῳ
  choice: 谁能与这兽相比
  rationale: ὅμοιος表达相似或可比性；此译自然地呈现反问和无可比拟的宣称，同时保留其对旧约独一性颂词的仿拟。
- source_word: πολεμῆσαι μετ’ αὐτοῦ
  choice: 与它交战
  rationale: πολεμέω含战争性交锋之意；μετά加属格在此表示敌对交战。“与它交战”既贴近结构，也符合现代汉语。
theological_decisions:
- issue: 兽的代词是否人格化
  choice: 用“它”指代兽
  alternative: 用“他”突出兽如统治者般的人格化表现
  rationale: 希腊文αὐτοῦ回指中性名词θηρίον。现代汉语以“它”回指兽最直接，也避免在翻译中额外确定其人格身份。
- issue: “谁能与这兽相比”的旧约回声
  choice: 正文保留反问，脚注说明其可能的亵渎性仿拟
  alternative: 在正文中明说这是对上帝独一无比之颂词的亵渎性套用
  rationale: 原文只呈现呼喊，并未明说典故。保留其神学张力，让脚注提示《出埃及记》15:11和《诗篇》35:10等背景，不把解释写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“那龙”“那兽”保留启示文学的特指意象；两个反问句保持口头颂词的力度。脚注标记均置于相关正文之后。
