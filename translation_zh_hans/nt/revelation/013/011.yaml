id: REV.13.11
reference: Revelation 13:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ εἶδον ἄλλο θηρίον ἀναβαῖνον ἐκ τῆς γῆς, καὶ εἶχεν κέρατα δύο ὅμοια ἀρνίῳ, καὶ ἐλάλει ὡς δράκων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/011.yaml
  text: And I saw another beast coming up out of the earth[a], and it had two horns like a lamb, and it was speaking like a dragon.
translation:
  language: zh_hans
  text: 我又看见另一个兽从地中上来[a]。它有两只角，像羔羊的角，说话像龙。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从陆地上来。”希腊词 γῆ 可指“大地”，也可指“陆地”。
    reason: 保留 γῆ 的词义歧义；上下文可能强调与从海中上来的兽相对，但原词本身不强制限定。
lexical_decisions:
- source_word: ἄλλο θηρίον
  choice: 另一个兽
  rationale: “兽”保留《启示录》中 θηρίον 一贯的末世象征色彩及与上下文的互文联系；“另一个”直接对应 ἄλλο。
- source_word: ἀναβαῖνον ἐκ τῆς γῆς
  choice: 从地里上来
  rationale: 现在分词描绘兽正在出现的动态过程；“上来”自然地传达 ἀναβαῖνον，“地”则保留 γῆ 可指大地或陆地的语义空间。
- source_word: εἶχεν κέρατα δύο
  choice: 它有两只角
  rationale: 直译其描述性叙事功能；“角”保留启示文学中与能力、权柄相关的象征意象。
- source_word: ὅμοια ἀρνίῳ
  choice: 像羔羊的角
  rationale: ὅμοια 在语法上修饰复数的“角”。补出“的角”使汉语清楚表达两只角与羔羊之角相似，同时避免误解为整只兽像羔羊。
- source_word: ἐλάλει ὡς δράκων
  choice: 说话却像龙
  rationale: “像”保留 ὡς 的比较意义，不将兽直接等同于龙；“却”自然凸显外貌似羔羊与言语似龙之间的强烈反差。
theological_decisions:
- issue: ἀρνίον 是否保留对《启示录》中“羔羊”意象的呼应
  choice: 羔羊
  alternative: 小羊羔
  rationale: “羔羊”既是自然、庄重的现代汉语，也能保留对本书羔羊意象的潜在呼应，而不把这兽认同为真正的羔羊；“小羊羔”会加入不必要的幼小语感。
- issue: γῆ 译作“大地”还是“陆地”
  choice: 地（正文作“地里”）
  alternative: 陆地
  rationale: γῆ 两义皆可。“地”在汉语中既可指大地，也可按上下文理解为与海相对的陆地，因而不把具有解释空间的异象过早限定为某一地理含义；脚注列出另一译法。
- issue: 两只角与羔羊之间比较范围的表达
  choice: 两只角像羔羊的角
  alternative: 有两只角，像羔羊
  rationale: 希腊文形容词 ὅμοια 在语法上与“角”一致。汉语补出第二个“角”，较准确地限定比较对象，又不消除这幅形象可能带有的仿冒羔羊意味。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“我又看见”承接异象叙事；“说话却像龙”以简洁的转折呈现羔羊般外观与龙般言语之间的张力。
