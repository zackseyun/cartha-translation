id: REV.5.10
reference: Revelation 5:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἐποίησας αὐτοὺς τῷ θεῷ ἡμῶν ⸀βασιλείαν καὶ ἱερεῖς, καὶ ⸀βασιλεύουσιν ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/010.yaml
  text: and you made them a kingdom and priests to our God[b][a], and they reign on the earth.
translation:
  language: zh_hans
  text: 你使他们成为一个国度[a]，作我们上帝的祭司；他们在地上掌权[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“君王和祭司”，而不是“一个国度和祭司”。
    reason: textual_variant
  - marker: b
    text: 有些抄本作“他们将在地上掌权”。
    reason: textual_variant
lexical_decisions:
- source_word: ἐποίησας
  choice: 你使……成为
  rationale: 不定过去时在颂歌中陈述上帝已经成就的行动；汉语无需另加时态标记。“使……成为”也自然承接后面的双重身份。
- source_word: αὐτοὺς
  choice: 他们
  rationale: 复数宾格代词，指上一节所说从各族群中被买赎的人。
- source_word: τῷ θεῷ ἡμῶν
  choice: 我们上帝的
  rationale: 与“祭司”连用时，以所属表达呈现其归属和事奉对象；同时避免把与格关系解释得过细。
- source_word: βασιλείαν
  choice: 一个国度
  rationale: 采用SBLGNT的单数名词，表示蒙救赎的人共同被构成一个国度，而不是把他们分别称为君王。
- source_word: ἱερεῖς
  choice: 祭司
  rationale: 该词的常规对应词，也保留与出埃及记19:6及启示录1:6的呼应。
- source_word: βασιλεύουσιν
  choice: 掌权
  rationale: 所给SBLGNT正文是现在时直陈式，译作不带将来标记的“掌权”；这比“作王”更符合现代普通话，同时保留统治之意。
- source_word: ἐπὶ τῆς γῆς
  choice: 在地上
  rationale: 直译ἐπί加属格的处所意义，不采用解释性更强的“统治全地”。
theological_decisions:
- issue: 蒙救赎者是“国度”还是“君王”
  choice: 一个国度
  alternative: 君王
  rationale: SBLGNT正文采用βασιλείαν（国度）。异文βασιλεῖς（君王）具有重要翻译传统，因此收入脚注，但不取代正文。
- issue: 掌权的时间
  choice: 他们在地上掌权
  alternative: 他们将在地上掌权
  rationale: 所给希腊正文βασιλεύουσιν是现在时，不应因末世论预设而改译为将来时；将来时异文另见脚注。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“一个国度”保留集体单数；分号呈现颂歌中身份与行动之间的层次。脚注标记分别紧随相关词句，避免把两个异文都误挂在“上帝”之后。
