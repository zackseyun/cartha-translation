  source_fidelity: 正文准确反映所给SBLGNT：ἐποίησας译为“使……成为”；αὐτούς译为“他们”；βασιλείαν保留为集体性的“一个国度”，未采纳“君王”的异文；ἱερεῖς译为“祭司”；并按所给希腊正文的现在时βασιλεύουσιν译为“在地上掌权”。“作我们上帝的祭司”自然表达了与格短语所指向的归属和事奉关系，未作不必要的神学扩展。
  naturalness: “你使他们成为一个国度，作我们上帝的祭司；他们在地上掌权。”庄重、清晰，符合现代标准普通话的经文语体。分号也恰当地分隔身份的设立与随后的掌权陈述。
  terminology: “国度”“祭司”“掌权”术语一致且可理解。“掌权”能自然表达βασιλεύουσιν的统治/作王含义；“君王和祭司”脚注准确呈现所述异文传统。
