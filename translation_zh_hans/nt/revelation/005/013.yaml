id: REV.5.13
reference: Revelation 5:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ πᾶν κτίσμα ὃ ἐν τῷ οὐρανῷ καὶ ἐπὶ τῆς γῆς καὶ ὑποκάτω τῆς γῆς καὶ ἐπὶ τῆς ⸀θαλάσσης, καὶ τὰ ἐν αὐτοῖς ⸀πάντα, ἤκουσα λέγοντας· Τῷ καθημένῳ ἐπὶ ⸂τῷ θρόνῳ⸃ καὶ τῷ ἀρνίῳ ἡ εὐλογία καὶ ἡ τιμὴ καὶ ἡ δόξα καὶ τὸ κράτος εἰς τοὺς αἰῶνας τῶν ⸀αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/013.yaml
  text: And I heard every creature in heaven and on the earth and under the earth and on the sea[a], and all that is in them, saying[b], “To the one seated on the throne and to the Lamb be blessing and honor and glory and dominion forever and ever.”
translation:
  language: zh_hans
  text: 我又听见天上、地上、地底下和海上的每一个受造物，以及这些地方中的一切，都在说：“愿颂赞、尊贵、荣耀和权能，都归给坐在宝座上的那一位和羔羊，直到永永远远[b]！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 直译：“直到诸世代的诸世代”。这是表示无穷尽的惯用语。
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν κτίσμα
  choice: 一切受造之物
  rationale: κτίσμα指受造的存在或事物；此处它们共同发声颂赞，因此用“一切受造之物”既保留普世范围，也不把所指限缩为某一类有生命的受造者。
- source_word: ὃ ἐν τῷ οὐρανῷ ... καὶ τὰ ἐν αὐτοῖς πάντα
  choice: 天上、地上、地底下、海上，以及其中的一切
  rationale: 按原文依次保留四个领域；ἐπί与海连用在此直译为“海上”。“其中的一切”承接这些领域，表达涵盖整个受造界的总括。
- source_word: ἤκουσα λέγοντας
  choice: 我又听见……都在说
  rationale: 用“都”使集合名词“一切受造之物”与复数意义的分词λέγοντας自然衔接；“又”承接异象叙述中的καί。
- source_word: Τῷ καθημένῳ ἐπὶ τῷ θρόνῳ
  choice: 归给坐在宝座上的那一位
  rationale: 将带冠词的现在分词译成自然的实体化称谓，并保留其庄重语气。
- source_word: τῷ ἀρνίῳ
  choice: 羔羊
  rationale: 保留《启示录》中ἀρνίον作为基督称号的固定意象及其献祭与得胜含义。
- source_word: ἡ εὐλογία
  choice: 颂赞
  rationale: 在颂荣语境中，εὐλογία指向神献上的称颂；“颂赞”比字面的“祝福”更符合现代汉语敬拜用语。
- source_word: ἡ τιμή
  choice: 尊贵
  rationale: 表达被归给受颂者的尊荣，与δόξα并列时庄重而自然。
- source_word: ἡ δόξα
  choice: 荣耀
  rationale: “荣耀”是敬拜语境中δόξα准确且通行的对应词。
- source_word: τὸ κράτος
  choice: 权能
  rationale: κράτος侧重彰显出来的强大能力和统治威势；“权能”兼顾力量与王权语境，而不泛化为一般的“能力”。
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: 直到永永远远
  rationale: 这是表达无尽延续的惯用语；“直到永永远远”在现代汉语中清楚、庄重，并保留原文加强的语势。
theological_decisions:
- issue: 颂荣同时归给坐宝座者和羔羊
  choice: 用一个统一的句式：“都归给坐在宝座上的那一位和羔羊”
  alternative: 分别补出两个谓语，说明颂赞各自归给谁
  rationale: 希腊文以同一个颂荣宣告并列指向两者，没有另作解释。译文保持这种礼仪性平行结构及其神学张力，不额外展开教义说明。
- issue: κτίσμα在宇宙性颂赞场景中的范围
  choice: 译作“一切受造之物”
  alternative: 译作“一切受造者”或“整个受造界”
  rationale: 原词既可指受造者，也可泛指受造之物。这里虽有发声的拟人化描写，范围却覆盖各领域中的一切，因此采用不将对象限定为有生命者的表达。
translation_notes:
  register: 采用现代、庄重而易懂的敬拜语体。“愿……都归给……”补足汉语颂荣句所需的句法成分，但不改变希腊文名词性宣告的内容。四重空间次序按原文保留，并以“其中的一切”收束全句。
