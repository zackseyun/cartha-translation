  rationale: 修订删除原文未明示的“又”，以“强大的”替换不自然的“大力的”，并将两个不定式分别译为“打开”和“解开”，更紧密地对应ἀνοῖξαι与λῦσαι。保留“书卷”“谁配”及庄重公开的宣告语体；不需脚注，因为此处“书卷”的选择在正文中已清楚自然，且无须在本节重复英语审计轨迹中的词汇备选。
