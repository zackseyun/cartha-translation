    issue: “又”无明确原文依据
    rationale: 本节开头仅有καὶ εἶδον（“我看见”）；译作“我又看见”增添了重复或续见的语义。
  - severity: medium
    issue: “大力的天使”搭配不自然
    rationale: “大力”在现代汉语通常不作“天使”的定语；“强大的天使”更自然，并准确表达ἰσχυρός。
  - severity: low
    issue: “展开／揭开”可更贴近原文动词
    rationale: ἀνοίγω宜译“打开”，λύω宜译“解开”；这也保留了打开书卷与解开其封印两个动作的区分。
