base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/002.yaml
  text: And I saw a mighty angel proclaiming with a loud voice[a], “Who is worthy to open the scroll and break its seals?”
translation:
  language: zh_hans
  text: 我看见一位强大的天使，高声宣告说：“谁配打开这书卷，并解开它的封印？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄγγελον ἰσχυρόν
  choice: 一位大力的天使
  rationale: ἰσχυρός表示强大、有力量。“大力的天使”既保留原文对能力的强调，也符合启示文学庄严的语体。
- source_word: κηρύσσοντα
  choice: 宣告
  rationale: κηρύσσω指像传令者一样公开、郑重地宣布；“宣告”比“讲道”更符合此处天庭场景。
- source_word: ἐν φωνῇ μεγάλῃ
  choice: 高声
  rationale: 该短语是指声音洪亮、有力；“高声”在现代汉语中自然简洁，并保留其强调。
- source_word: Τίς ἄξιος
  choice: 谁配
  rationale: ἄξιος在这里表示有资格、配得承担这项庄严行动。“谁配”自然有力，也保留经文关于配得与资格的含义。
- source_word: ἀνοῖξαι τὸ βιβλίον
  choice: 展开这书卷
  rationale: βιβλίον可泛指书写材料；本段所描绘的是带有多重封印的卷状文书。“书卷”符合历史图景，而“展开”自然表达卷轴被打开的动作。
- source_word: λῦσαι τὰς σφραγῖδας αὐτοῦ
  choice: 揭开它的封印
  rationale: λύω本义为解开、松开；与封印连用时，指解除封印，使书卷可以展开。“揭开封印”保留具体意象，又比“打破封印”更贴近λύω的语义范围。
theological_decisions:
- issue: 宝座异象中βιβλίον的译法
  choice: 书卷
  alternative: 书；文书
  rationale: 带有多个封印且将被展开的物件，在一世纪语境中最自然地理解为卷轴。“书卷”是词汇与历史语境上的选择，不预先限定其内容或神学身份。
- issue: ἄξιος所表达的资格
  choice: 谁配
  alternative: 谁有资格；谁配得
  rationale: 保留原文对“配得”这一核心问题的强调，同时不在本节中提前说明谁配或为何配，以维持叙事张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我又看见”承接异象叙事；引语末用“呢”使公开发问在汉语中自然，但不削弱其庄严性。本节无需脚注，因为“书卷”已在正文中准确表达βιβλίον在此语境下的最佳含义，且不存在必须展示的实质性异读。
