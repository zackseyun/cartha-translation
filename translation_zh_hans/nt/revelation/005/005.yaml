id: REV.5.5
reference: Revelation 5:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ εἷς ἐκ τῶν πρεσβυτέρων λέγει μοι· Μὴ κλαῖε· ἰδοὺ ἐνίκησεν ὁ λέων ὁ ἐκ τῆς φυλῆς Ἰούδα, ἡ ῥίζα Δαυίδ, ⸀ἀνοῖξαι τὸ βιβλίον καὶ τὰς ἑπτὰ σφραγῖδας αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/005.yaml
  text: And one of the elders says to me[a], “Do not weep. Behold, the Lion from the tribe of Judah, the Root of David, has conquered[c][b], to open the scroll and its seven seals.”
translation:
  language: zh_hans
  text: 有一位长老对我说：“不要哭！看哪，出自犹大支派的狮子，大卫的根，已经得胜了[a]，能够打开书卷和它的七个封印。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “能够打开”直译可作“去打开”或“为要打开”。这里的希腊语不定式把他的得胜与打开书卷相连，既可理解为目的，也可理解为得胜所带来的结果或资格。
    reason: 保留 ἀνοῖξαι 与 ἐνίκησεν 之间目的、结果或资格关系的句法歧义。
lexical_decisions:
- source_word: πρεσβυτέρων
  choice: 长老
  rationale: 在《启示录》中，这是天上群体的固定称谓，并非单指年长者。
- source_word: λέγει
  choice: 说
  rationale: 希腊语现在时在此为叙事现在时；现代汉语用“说”自然，也保留场景的即时感。
- source_word: Μὴ κλαῖε
  choice: 不要哭
  rationale: 准确表达 κλαίω，同时比“不要哀哭”更符合现代普通话，仍保持庄重。
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留引人注意的语用功能，也符合庄重而易懂的经文语体。
- source_word: ἐνίκησεν
  choice: 已经得胜了
  rationale: νικάω 是《启示录》中反复出现的胜利主题词；“得胜”既自然，又能维持全书用词联系。
- source_word: ὁ λέων ὁ ἐκ τῆς φυλῆς Ἰούδα
  choice: 出自犹大支派的狮子
  rationale: “出自”明确反映 ἐκ 的来源含义，同时保留弥赛亚称号的形象。
- source_word: ἡ ῥίζα Δαυίδ
  choice: 大卫的根
  rationale: 直译这一弥赛亚称号，保留其经文互文和“根”所包含的张力，不改写为后裔等解释性表达。
- source_word: ἀνοῖξαι
  choice: 能够打开
  rationale: 不定式与“得胜”相连，表示得胜所带来的有效资格或能力；“能够打开”在汉语中清楚表达这种关系，又不加入本节未明说的“配得”。
- source_word: τὸ βιβλίον
  choice: 书卷
  rationale: 此处所指是以封印封住的卷轴；“书卷”兼顾历史形态与汉语经文语体。
- source_word: σφραγῖδας
  choice: 封印
  rationale: 指封住书卷的七个印；“封印”比单用“印”更清楚，且为现代汉语常用表达。
- source_word: αὐτοῦ
  choice: 它的
  rationale: 代词指向中性的 βιβλίον；明译为“它的”保留原文的所属关系。
theological_decisions:
- issue: 应用于耶稣的弥赛亚君王称号
  choice: 保留“出自犹大支派的狮子”和“大卫的根”两个并列称号
  alternative: 把一个或两个称号解释性改写为“犹大支派的王”或“大卫的后裔”
  rationale: 原文刻意叠加源自以色列经文传统的王权与弥赛亚意象；直译可保留其基督论力度，也不超出文本作教义性阐释。
- issue: ἐνίκησεν 与 ἀνοῖξαι 的关系
  choice: 译作“已经得胜了，能够打开”
  alternative: 译作“已经得胜，为要打开”或“已经得胜，可以打开”
  rationale: 此不定式可表达目的、结果或资格关系。正文采用自然汉语呈现得胜所产生的有效能力，同时不添加“配得”等原文未出现的概念；有关句法幅度以脚注保留。
translation_notes:
  register: 采用现代、庄重、易懂的普通话。“看哪”“长老”“得胜”“书卷”“封印”维持《启示录》的肃穆和互文色彩，同时避免过度古雅。正文中的脚注标记 [a] 已对应脚注。
