base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/014.yaml
  text: And the four living creatures were saying[a], “Amen.” And the elders fell down and worshiped.
translation:
  language: zh_hans
  text: 四个活物说着：“阿们！”众长老俯伏敬拜。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本在“敬拜”之后明确加上敬拜的对象，如“那活到永永远远的”或“他”。正文依照SBLGNT所采用的较短读法，由上下文暗示敬拜的对象。
    reason: textual_variant
lexical_decisions:
- source_word: ζῷα
  choice: 活物
  rationale: 在《启示录》的异象语境中，指宝座周围有生命的天上受造者；“活物”既简洁庄重，也保留了与《以西结书》宝座异象的呼应。
- source_word: ἔλεγον
  choice: 说着
  rationale: 未完成过去时呈现当时持续进行的动作；“说着”比单纯的“说了”更能保留这一体貌，同时避免过度断定为反复多次。
- source_word: Ἀμήν
  choice: 阿们
  rationale: 这是礼仪性的赞同与确认用语；沿用现代汉语基督教语境中通行的音译，保留其敬拜呼声的性质。
- source_word: πρεσβύτεροι
  choice: 长老
  rationale: 此处是《启示录》中一个特定的天上群体称谓，并非单指年长者；“长老”符合上下文和现代汉语惯用表达。
- source_word: ἔπεσαν
  choice: 俯伏
  rationale: 在敬拜场景中，此动词表示身体伏下；“俯伏”自然表达这一姿态，也比字面的“倒下”更准确。
- source_word: προσεκύνησαν
  choice: 敬拜
  rationale: 在天上宝座的场景中，该词表达宗教性的崇敬；“敬拜”传达其意义，同时不在正文中补出希腊文本未明说的对象。
theological_decisions:
- issue: 敬拜对象在正文中未明说
  choice: 保留不带明示宾语的“敬拜”
  alternative: 译作“敬拜他”“敬拜上帝”或“敬拜那活到永永远远的”
  rationale: SBLGNT所采用的较短文本在προσεκύνησαν之后没有明示宾语。现代汉语可以自然地省略宾语，由语境领会；若补出具体对象，就会把其他抄本的文字或上下文推断写进正文。
translation_notes:
  register: 采用现代、庄重而易懂的敬拜语体。“说着”保留未完成过去时的持续意味；“俯伏敬拜”清楚呈现两个连续动作。脚注标记置于相关异文所在的句末，避免误解为只涉及“说着”。
