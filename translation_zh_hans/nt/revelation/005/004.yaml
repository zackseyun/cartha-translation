revisions:
- from: 我就大大哭泣，因为找不到一个配展开那书卷[a]、察看它[b]的人。
  to: 我就大哭，因为没有找到配得展开那书卷[a]或察看它[b]的人。
  rationale: 修订仅处理汉语句法、并列否定关系和自然表达：“配得”补足ἄξιος在汉语中的常规搭配；“或”对应οὔτε在否定范围内的并列功能；“大哭”较“大大哭泣”更合现代庄重叙事语体。保留“书卷／展开”及“察看它”，并维持脚注对βιβλίον和βλέπειν两处词义余地的说明。
