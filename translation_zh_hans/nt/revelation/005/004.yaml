  text: καὶ ⸀ἐγὼ ἔκλαιον πολὺ ὅτι οὐδεὶς ἄξιος εὑρέθη ἀνοῖξαι τὸ βιβλίον οὔτε βλέπειν αὐτό·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/004.yaml
  text: And I was weeping greatly because no one was found worthy to open the scroll or to look into it.
translation:
  language: zh_hans
  text: 我就大哭，因为没有找到配得展开那书卷[a]或察看它[b]的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“书”。希腊语βιβλίον可指书或卷轴；这里的封印和展开书卷的场景更符合古代卷轴的形态。
    reason: lexical_alternative
  - marker: b
    text: 或译“看它”；也可能指“察看其中的内容”。原文没有明确区分观看书卷本身与察看书卷内容。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἐγώ
  choice: 我就
  rationale: καί承接前文，显式的ἐγώ突出约翰本人；“我就”在现代汉语叙事中自然地保留了承接关系，而不过分强化主语。
- source_word: ἔκλαιον
  choice: 哭泣
  rationale: 未完成时描写当时持续进行的哭泣；汉语结合上下文和程度补语即可呈现过程，不必硬加“开始”或限定为哭了一次。
- source_word: πολύ
  choice: 大大
  rationale: 作副词强化哭泣的程度。“大大哭泣”保留原文强度和庄重语体，又不擅自加入“痛苦”“放声”等原文未明说的情态。
- source_word: οὐδεὶς ἄξιος εὑρέθη
  choice: 找不到一个配……的人
  rationale: 这是自然的现代汉语无人称表达，保留“经过寻找却无人符合”的含义；“配”承载ἄξιος所含的资格与价值分量，比单纯“有资格”更具原文的神学重量。
- source_word: ἀνοῖξαι
  choice: 展开
  rationale: 对于卷轴，汉语通常说“展开”，比泛称“打开”更准确地呈现古代物件和本段意象。
- source_word: τὸ βιβλίον
  choice: 那书卷
  rationale: 本段描述有封印并可展开的卷状文书，“书卷”最符合历史形态；“那”承接前文已经出现的特定书卷。
- source_word: οὔτε βλέπειν αὐτό
  choice: 、察看它
  rationale: οὔτε连接第二个否定范围内的动作；汉语并列结构无需重复“也不能”。“察看它”贴近直接观看这一基本义，同时不在正文中断定只是看外观还是察看内容。
- source_word: ὅτι
  choice: 因为
  rationale: 明确引出约翰大哭的原因。
theological_decisions:
- issue: 宝座异象中ἄξιος所表达的性质
  choice: 译为“配”，保留在上帝面前堪当此任的价值和身份分量
  alternative: 译为“有资格”或“适合”
  rationale: 此处并非仅指程序上的能力或资格，而涉及谁堪当执行书卷所载的神圣旨意；“配”能保留这种神学张力而不扩写其具体根据。
- issue: 启示录第五章βιβλίον所指物件
  choice: 译为“书卷”
  alternative: 译为“书”
  rationale: 上下文中的封印和展开动作指向古代卷轴形态；此选择帮助读者形成符合场景的图像，但不把书卷内容作进一步神学定性。
- issue: βλέπειν αὐτό是看书卷本身还是察看其中内容
  choice: 正文译作较开放的“察看它”
  alternative: 明确译为“察看其中的内容”或较字面的“看它”
  rationale: 原文直接宾语是书卷，动词本身没有明说“内容”；上下文可能暗示察看其中所载之事。正文不把这一含义完全坐实，并以脚注保存两种理解。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“大大哭泣”较书面，用以保留πολύ的强度而不额外加入“放声”或“悲痛”等情绪细节；“配”延续汉语圣经语境中清楚且凝练的价值判断。“书卷”与“展开”形成自然搭配。
