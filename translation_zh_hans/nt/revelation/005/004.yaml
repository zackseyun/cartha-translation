  source_fidelity: 译文总体准确传达了约翰因无人被发现配得对书卷采取相关行动而大哭的原因，也正确保留了“书卷”和“察看它”的开放性。不过，“配展开”在现代汉语中缺少必要的结构助词“得”；并列处以顿号连接，未清楚表达原文οὔτε所标示的“或／也不”的否定并列关系。
  naturalness: “我就大大哭泣”虽可理解，但“大大”直接修饰“哭泣”在现代标准汉语叙事中略显生硬。“我就大哭”更自然、庄重，且不额外加入“放声”“悲痛”等原文没有明说的情态。
  terminology: “书卷”及“展开”准确反映本段所设想的古代卷轴；“配得”恰当地表达ἄξιος的堪当、配得之意，避免弱化为单纯程序性的“有资格”。“察看它”不将βλέπειν明确限定为阅读内容，处理审慎。
