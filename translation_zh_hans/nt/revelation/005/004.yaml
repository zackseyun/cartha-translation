    rationale: 汉语中“配”表示“值得／堪当”某行动时，通常应说“配得＋动词”。“配展开”不够合乎现代标准汉语的搭配和句法。
  - severity: medium
    issue: “展开那书卷、察看它”未明确呈现οὔτε的否定并列关系
