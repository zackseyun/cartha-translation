id: REV.5.8
reference: Revelation 5:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ὅτε ἔλαβεν τὸ βιβλίον, τὰ τέσσαρα ζῷα καὶ οἱ εἴκοσι τέσσαρες πρεσβύτεροι ἔπεσαν ἐνώπιον τοῦ ἀρνίου, ἔχοντες ἕκαστος κιθάραν καὶ φιάλας χρυσᾶς γεμούσας θυμιαμάτων, αἵ εἰσιν ⸀αἱ προσευχαὶ τῶν ἁγίων·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/008.yaml
  text: And when he took the scroll[a], the four living creatures and the twenty-four elders fell down before the Lamb, each holding a harp and golden bowls full of incense[b], which are the prayers of the saints.
translation:
  language: zh_hans
  text: 他拿了书卷以后，四个活物和二十四位长老就俯伏在羔羊面前，各自拿着一把琴[a]和盛满了香的金碗；这些[c]就是圣徒[b]的祷告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “琴”或译“里拉琴”，指古代的一种弦乐器。
    reason: lexical_alternative
  - marker: b
    text: “圣徒”或译“圣洁的人”。
    reason: lexical_alternative
  - marker: c
    text: 原文中的“这些”为阴性复数，在语法上回指“金碗”；异象把盛满香的金碗直接说成圣徒的祷告。
    reason: grammatical_and_symbolic_clarification
lexical_decisions:
- source_word: βιβλίον
  choice: 书卷
  rationale: 在《启示录》的场景中，所指是古代有文字的卷轴；“书卷”既符合历史形态，也自然庄重。
- source_word: ζῷα
  choice: 活物
  rationale: 指宝座周围有生命的天上受造者；“活物”避免“野兽”的贬义，并与本书相关异象用语保持一致。
- source_word: πρεσβύτεροι
  choice: 长老
  rationale: 自然表达这二十四位天上尊长的身份，同时不额外限定为后世某种教会职分。
- source_word: ἐνώπιον τοῦ ἀρνίου
  choice: 在羔羊面前
  rationale: 保留空间位置与敬拜意味；“羔羊”是《启示录》中具有献祭意涵的基督称号。
- source_word: ἔχοντες ἕκαστος
  choice: 各自拿着
  rationale: 保留ἕκαστος的逐一分配意味，且符合现代汉语表达。
- source_word: κιθάραν
  choice: 一把琴
  rationale: κιθάρα是古代弦乐器，但其确切形制与现代竖琴并不完全相同；正文用较宽泛的“琴”，脚注提供更具体的可能译法。
- source_word: φιάλας χρυσᾶς
  choice: 金碗
  rationale: φιάλη指碗状或浅盘状器皿；“金碗”比“金瓶”更符合器形。
- source_word: γεμούσας θυμιαμάτων
  choice: 盛满了香
  rationale: θυμίαμα指焚烧用的香；汉语“香”在敬拜语境中简洁自然，复数在此不必机械体现。
- source_word: τῶν ἁγίων
  choice: 圣徒
  rationale: 指分别为圣、属于上帝的群体；“圣徒”保留经文的神学用语，脚注说明也可直译为“圣洁的人”。
theological_decisions:
- issue: 金碗、香与祷告之间的象征性等同
  choice: 译作“这些就是圣徒的祷告”，不把“是”弱化为“代表”
  alternative: 这些代表圣徒的祷告；这些香就是圣徒的祷告
  rationale: 原文使用直接的等同结构αἵ εἰσιν。关系代词αἵ为阴性复数，在语法上与φιάλας“碗”一致，因此正文用可回指复数金碗的“这些”，既保留直接等同，也不擅自把语法所指改成“香”。脚注提示这一结构，以保留异象语言可能包含的张力。
- issue: ἅγιοι所指群体
  choice: 圣徒
  alternative: 圣洁的人；上帝的子民
  rationale: “圣徒”在此指属上帝、被分别为圣的人，不应被狭义理解为后来经正式册封的少数圣人；脚注提供较直白的译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“俯伏”保留敬拜场景的肃穆感；“拿了……以后”清楚表达时间先后；避免使用容易让现代读者误以为是特定现代乐器的“竖琴”。
