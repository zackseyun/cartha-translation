  text: Καὶ εἶδον ἐπὶ τὴν δεξιὰν τοῦ καθημένου ἐπὶ τοῦ θρόνου βιβλίον γεγραμμένον ἔσωθεν καὶ ⸀ὄπισθεν, κατεσφραγισμένον σφραγῖσιν ἑπτά.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/001.yaml
  text: And I saw in the right hand of the one seated on the throne a scroll written within and on the back[b][a], sealed with seven seals.
translation:
  language: zh_hans
  text: 我看见一卷书[a]在坐在宝座上的那一位的右手中，里面和背面都写着字[b]，由七个印封着。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“书卷”。这里的希腊词很可能指卷轴，而不是现代装订成册的书。
    reason: lexical_alternative
  - marker: b
    text: 直译“里面和背面都写着字”；“背面”也可较概括地理解为“外面”。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδον
  choice: 我看见
  rationale: 以简明的过去叙事表达不定过去时，符合现代汉语叙事习惯。
- source_word: ἐπὶ τὴν δεξιὰν
  choice: 右手中
  rationale: ἐπί加宾格字面可表示“在……上”，但此处描述手持或手中所有；“右手中”在现代汉语中自然清楚，同时不改变画面核心。
- source_word: τοῦ καθημένου ἐπὶ τοῦ θρόνου
  choice: 坐在宝座上的那一位
  rationale: 保留希腊文以描述性分词指称该位格的方式，不在本节明说其身份。
- source_word: βιβλίον
  choice: 书卷
  rationale: 在本段一世纪语境和封印、两面书写的意象中，所指很可能是卷轴；“书卷”既符合古代载体，也保持庄重自然。
- source_word: γεγραμμένον
  choice: 写着字
  rationale: 表达完成时被动分词所呈现的持续状态，即书卷已经写成并处于有文字的状态。
- source_word: ἔσωθεν καὶ ὄπισθεν
  choice: 里外都
  rationale: ἔσωθεν指里面，ὄπισθεν在此最可能指背面或外面；“里外都”自然表达书卷内面和背面均有文字，并由脚注交代较直译形式。
- source_word: κατεσφραγισμένον
  choice: 封住了
  rationale: 体现完成时被动分词所指已经封妥的状态；与“七道印”搭配自然。
- source_word: σφραγῖσιν ἑπτά
  choice: 用七道印
  rationale: 将工具性与格译为“用”，量词“道”适合表示封印，并清楚呈现七个封印。
theological_decisions:
- issue: 宝座上那一位的身份表述
  choice: 坐在宝座上的那一位
  alternative: 坐在宝座上的神
  rationale: 原文只用描述性称谓，并未在本节直接使用神的名号；译文保留启示录在此处的文学呈现，不替作者提前明确身份。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“书卷”保留古代卷轴意象；句式按汉语信息结构调整，把所属者置于“右手中有”之前。所有脚注标记均置于相关词句之后。
