id: REV.5.12
reference: Revelation 5:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: λέγοντες φωνῇ μεγάλῃ· Ἄξιόν ἐστιν τὸ ἀρνίον τὸ ἐσφαγμένον λαβεῖν τὴν δύναμιν ⸀καὶ πλοῦτον καὶ σοφίαν καὶ ἰσχὺν καὶ τιμὴν καὶ δόξαν καὶ εὐλογίαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/012.yaml
  text: saying with a loud voice[c][b][a], “Worthy is the Lamb who was slain to receive power and wealth and wisdom and might and honor and glory and blessing.”
translation:
  language: zh_hans
  text: 他们大声说：“那曾被杀的羔羊[a]配得领受能力、财富[b]、智慧、力量[c]、尊荣、荣耀和颂赞！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“曾被宰杀的”。希腊语可表达较强烈的宰杀画面；正文采用“曾被杀”，以符合本节庄严的敬拜语境。
    reason: lexical_alternative
  - marker: b
    text: 或译“丰富”。这里的希腊语指财富、资财或丰富的资源。
    reason: lexical_alternative
  - marker: c
    text: 或译“强力”。正文用“力量”，以便与前面的“能力”有所区别。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες φωνῇ μεγάλῃ
  choice: 他们大声说
  rationale: 现在分词承接上一节的众天使；汉语用“他们……说”明确复数主语并自然衔接。“大声”准确表达φωνῇ μεγάλῃ，又避免生硬直译为“用大声音”。
- source_word: Ἄξιόν ἐστιν τὸ ἀρνίον
  choice: 羔羊配得
  rationale: “羔羊”是《启示录》中指向基督的称号；“配得”保留ἄξιος所表达的资格与相称性，也符合庄严的敬拜语体。
- source_word: τὸ ἐσφαγμένον
  choice: 曾被杀的
  rationale: 完成时被动分词表明羔羊遭杀这一已经发生且仍具意义的事实。“曾被杀”自然、庄重，并保留被动含义。
- source_word: λαβεῖν
  choice: 领受
  rationale: 在敬拜颂词中，λαβεῖν表示羔羊配得接受所列的一切；“领受”比“拿取”更符合被赋予尊荣的语境。
- source_word: δύναμιν
  choice: 能力
  rationale: 直接表达δύναμις的权能、能力含义，并与后面的ἰσχύς有所区分。
- source_word: πλοῦτον
  choice: 财富
  rationale: “财富”是现代汉语对πλοῦτος清楚自然的表达，指丰富的资财或资源。
- source_word: σοφίαν
  choice: 智慧
  rationale: 与σοφία语义直接对应，且是现代汉语中自然的圣经及敬拜用语。
- source_word: ἰσχὺν
  choice: 力量
  rationale: ἰσχύς强调强力、实力；译作“力量”既自然，也与前面的δύναμις“能力”保持词义和修辞上的区别。
- source_word: τιμὴν
  choice: 尊贵
  rationale: 在受敬奉的语境中，τιμή指所归给的尊崇与荣誉；“尊贵”适合与“荣耀、颂赞”并列。
- source_word: δόξαν
  choice: 荣耀
  rationale: “荣耀”是δόξα在敬拜语境中的标准且自然的对应表达。
- source_word: εὐλογίαν
  choice: 颂赞
  rationale: εὐλογία在此七项敬拜颂词中指归给羔羊的称颂；“颂赞”比字面性的“祝福”更自然地表达此处的人向羔羊发出的赞美。
theological_decisions:
- issue: 羔羊作为基督论称号
  choice: 羔羊
  alternative: 小羊；羊羔
  rationale: ἀρνίον在《启示录》的上下文中是指耶稣的固定称号。“羔羊”保留这一称号的传统辨识度，不额外加入经文未明说的教义解释。
- issue: 羔羊受死的表达
  choice: 曾被杀的
  alternative: 曾被宰杀的；被杀过的
  rationale: σφάζω可带有宰杀的强烈画面，但本节处于庄严的天上敬拜场景。“曾被杀”保留其死亡与被动受害的含义，同时不把赎罪机制等解释直接写入正文。
- issue: εὐλογία在敬拜中的意义
  choice: 颂赞
  alternative: 祝福；称颂
  rationale: 这里列举的是羔羊配得领受的七项，语境支持“称颂、赞美”的意义。“颂赞”表达敬拜者归给羔羊的赞誉，而不将其误解为羔羊从受造者那里获得福祉。
translation_notes:
  register: 采用现代、庄重而易懂的敬拜语体。七项并列名词按希腊原文次序保留，以“、”分隔，并在末项前用“和”，使汉语朗读自然。正文不机械复制希腊语的前置谓语语序，而以“羔羊配得领受”呈现自然汉语，同时保留颂词的庄严感。
