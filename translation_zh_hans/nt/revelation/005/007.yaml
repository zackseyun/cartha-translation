  text: καὶ ἦλθεν καὶ εἴληφεν ἐκ τῆς δεξιᾶς τοῦ καθημένου ἐπὶ τοῦ θρόνου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/007.yaml
  text: And he came and took it from the right hand of the one seated on the throne.
translation:
  language: zh_hans
  text: 于是，他上前，从坐在宝座上的那一位的右手中拿过书卷。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦλθεν
  choice: 上前
  rationale: 这是ἔρχομαι的不定过去时；在异象叙事中，所描写的是羔羊朝宝座前去的动作。“上前”符合现代汉语叙事，也不必硬性规定观察者的空间视角。
- source_word: εἴληφεν
  choice: 拿过书卷
  rationale: 这是λαμβάνω的完成时，叙述羔羊已经实施并完成取卷的动作。“拿过”保留主动取走的力度；宾语“书卷”由上文明确提供，在汉语中补出可使本节独立朗读时更清楚。
- source_word: ἐκ
  choice: 从……中
  rationale: 表达动作的来源，即书卷原在坐宝座者的右手中。
- source_word: τῆς δεξιᾶς
  choice: 右手
  rationale: 此处δεξιά具体指右手，而不是笼统的右边；这样保留异象中的具体画面。
- source_word: τοῦ καθημένου
  choice: 坐在……上的那一位
  rationale: 将实词化的现在分词自然译为现代汉语，同时保留这位坐宝座者与羔羊之间的区分。
- source_word: ἐπὶ τοῦ θρόνου
  choice: 在宝座上
  rationale: 按ἐπί在此处的方位意义翻译，表达坐于宝座之上，措辞自然庄重。
theological_decisions:
- issue: εἴληφεν所省略的直接宾语
  choice: 在正文中补出“书卷”
  alternative: 不补宾语，译作“从……右手中拿过来”
  rationale: 希腊文因上文语境清楚而省略宾语；所指就是5:1所见的书卷。汉语补出“书卷”能清楚衔接上下文，并未增加新的神学内容。
- issue: 坐宝座者的称谓
  choice: 坐在宝座上的那一位
  alternative: 那坐在宝座上的
  rationale: 保留原文的描述性称谓，不直接加上“神”或其他身份说明，从而维持羔羊与坐宝座者在本句中的叙事区分，也不超出原文作神学解释。
- issue: 完成时εἴληφεν的体貌
  choice: 以“拿过”表达已完成的动作
  alternative: 译作“已经拿了”或“接过”
  rationale: 这里的完成时处在异象叙事的动作次序中；“拿过”既体现动作完成，也避免“接过”可能暗示对方主动递交，而原文只明确羔羊取卷。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“于是”承接异象中的叙事推进；“那一位”保持敬重而不显古奥。句子不加注释标记，因为正文已能清楚传达原文及其语境所省略的宾语。
