id: REV.5.6
reference: Revelation 5:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ εἶδον ἐν μέσῳ τοῦ θρόνου καὶ τῶν τεσσάρων ζῴων καὶ ἐν μέσῳ τῶν πρεσβυτέρων ἀρνίον ⸀ἑστηκὸς ὡς ἐσφαγμένον, ⸀ἔχων κέρατα ἑπτὰ καὶ ὀφθαλμοὺς ἑπτά, ⸀οἵ εἰσιν τὰ ἑπτὰ πνεύματα τοῦ θεοῦ, ⸀ἀπεσταλμένοι εἰς πᾶσαν τὴν γῆν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/006.yaml
  text: And I saw[a], in the midst of the throne and of the four living creatures, and in the midst of the elders, a Lamb standing as though it had been slain, having seven horns and seven eyes[b], which are the seven Spirits of God sent out into all the earth.
translation:
  language: zh_hans
  text: 我又看见，在宝座和四个活物中间，又在众长老中间，有一只羔羊站着，像是被宰杀过的[a]。它有七角七眼；这七眼就是神的七灵[b]，已被差遣到全地去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可较直译为“如同被杀过的”或“仿佛被宰杀”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“神的七灵”。有人把这理解为象征圣灵七重的丰满；正文保留原文措辞，不限定这一解释。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν μέσῳ ... καὶ ... ἐν μέσῳ
  choice: 在……中间，又在……中间
  rationale: 保留原文重复的空间表达和异象中层叠的方位关系，不把它简化为单一位置。
- source_word: ζῴων
  choice: 活物
  rationale: 在《启示录》的宝座异象中指有生命的天上受造者；“活物”既符合上下文，也避免让人误解为普通动物。
- source_word: πρεσβυτέρων
  choice: 众长老
  rationale: 此处是异象中一个特定群体的称谓；加“众”自然表达希腊文复数。
- source_word: ἀρνίον
  choice: 羔羊
  rationale: 保留献祭与弥赛亚意象；不刻意译出词形中可能残留的指小意味，以免语气显得轻微或幼稚。
- source_word: ἑστηκὸς
  choice: 站着
  rationale: 该完成时分词描写羔羊处于站立状态；现代汉语用“站着”简洁而生动。
- source_word: ὡς ἐσφαγμένον
  choice: 像是被宰杀过的
  rationale: “像是”保留ὡς所表达的外观或比较，“被宰杀过”则传达已经发生并留下可见结果的被动完成状态，同时保留活着站立与曾被杀之间的张力。
- source_word: ἔχων κέρατα ἑπτὰ καὶ ὀφθαλμοὺς ἑπτά
  choice: 它有七角七眼
  rationale: 直译角与眼的异象意象，不在正文中提前解释象征意义；用独立短句符合自然汉语。
- source_word: οἵ εἰσιν τὰ ἑπτὰ πνεύματα τοῦ θεοῦ
  choice: 这七眼就是神的七灵
  rationale: 把关系代词按最接近的先行词“七眼”明确译出，使汉语清楚，同时依从最自然的希腊语句法关联。
- source_word: ἀπεσταλμένοι εἰς πᾶσαν τὴν γῆν
  choice: 已经奉差遣到全地去
  rationale: “奉差遣”表达被动和差派意味，“已经”反映完成状态，“全地”保留γῆ在此处可指整个世界的经文表达。
theological_decisions:
- issue: 关系从句所指的是七眼，还是七角与七眼两者
  choice: 正文译为“这七眼就是神的七灵”，把关系从句连接到最近的“七眼”。
  alternative: 将关系从句较宽泛地理解为七角和七眼合在一起所代表的对象。
  rationale: “七眼”是最近且在异象互文中最连贯的先行词。译文明确正常的句法关系，却不进一步解释其象征体系。
- issue: “神的七灵”的身份
  choice: 保留原文的复数表达“神的七灵”，不在正文中改写为“七重的圣灵”。
  alternative: 译作“神七重的灵”或“具有七重丰满的圣灵”。
  rationale: 原文的复数措辞具有神学分量，也存在解释空间；直译可保留这种张力，脚注仅说明一种常见理解而不把它定为唯一解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“羔羊、七角、七眼、神的七灵”等启示文学意象，不以解释性改写取代原文；标点略作汉语化处理，使长句关系清楚。
