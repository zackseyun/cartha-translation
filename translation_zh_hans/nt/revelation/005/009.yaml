  to: '他们唱着一首新歌，说：


    “你配拿起书卷，揭开它的封印，


    因为你曾被杀，


    并且用自己的血，


    从各支派、各种语言、各民族、各邦国中


    买来人[a]归给上帝[b]。”'
  rationale: 仅作两处安全的汉语措辞调整：“各语言”改为“各种语言”，“买了人”改为“买来人”。两处均不改变原文的语义、四项并列结构、隐含宾语的处理，或与格的译法；脚注锚点及内容均保留并与正文对应。
