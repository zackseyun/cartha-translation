id: REV.5.9
reference: Revelation 5:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ᾄδουσιν ᾠδὴν καινὴν λέγοντες· Ἄξιος εἶ λαβεῖν τὸ βιβλίον καὶ ἀνοῖξαι τὰς σφραγῖδας αὐτοῦ, ὅτι ἐσφάγης καὶ ἠγόρασας τῷ ⸀θεῷ ἐν τῷ αἵματί σου ἐκ πάσης φυλῆς καὶ γλώσσης καὶ λαοῦ καὶ ἔθνους,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/009.yaml
  text: And they sing a new song[a], saying, “You are worthy to take the scroll and to open its seals, because you were slain[c][b], and by your blood you purchased for God people from every tribe and language and people and nation,”
translation:
  language: zh_hans
  text: '他们唱着一首新歌，说：


    “你配拿起书卷，揭开它的封印，


    因为你曾被杀，


    并且用自己的血，


    从各支派、各种语言、各民族、各邦国中


    买来人[a]归给上帝[b]。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文在这里没有明说“买”的宾语；“人”是按上下文补出的。有些抄本作“买了我们”。
    reason: textual_and_grammatical_note
  - marker: b
    text: “归给上帝”也可译作“为上帝”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾄδουσιν
  choice: 他们唱着
  rationale: 现在时在异象叙事中呈现正在发生的场景；“唱着”符合现代汉语表达，也不增添原文没有的“赞美”等内容。
- source_word: ᾠδὴν καινὴν
  choice: 一首新歌
  rationale: 准确保留“新歌”这一圣经意象，同时是自然的现代汉语。
- source_word: Ἄξιος εἶ
  choice: 你配
  rationale: “配”简洁、庄重，表达有资格接受并执行下文行动的意思；比“你是配得的”更自然。
- source_word: τὸ βιβλίον
  choice: 书卷
  rationale: 此处指带有封印的古代卷轴式文书；“书卷”比现代意义的“书”更贴合所指之物。
- source_word: ἀνοῖξαι τὰς σφραγῖδας αὐτοῦ
  choice: 揭开它的封印
  rationale: 原文直译为“打开它的封印”。汉语用“揭开封印”既保留原文意象，也比“打开封印”自然；不采用较强解释性的“撕开”。
- source_word: ἐσφάγης
  choice: 你曾被杀
  rationale: 保留被动语态和暴力、祭牲式的语感。“曾”点明这件事已经发生，但不把词义扩展成完整的赎罪教义表述。
- source_word: ἠγόρασας
  choice: 买了
  rationale: 保留动词本身的买赎、付价意象，不直接改译为神学解释色彩更强的“救赎了”。
- source_word: ἐν τῷ αἵματί σου
  choice: 用自己的血
  rationale: 这里的介词短语表达手段或代价。“用……血”是自然汉语，并保留原文具体的血之意象。
- source_word: ἐκ πάσης φυλῆς καὶ γλώσσης καὶ λαοῦ καὶ ἔθνους
  choice: 从各支派、各语言、各民族、各邦国中
  rationale: 保留原文四项并列及其普世范围。“各”在汉语中自然统摄每一类别；“语言”按其本义译出 γλῶσσα。
- source_word: τῷ θεῷ
  choice: 归给上帝
  rationale: 与“买了人”连用时，“归给上帝”自然表达与格所指的归属或受益关系，同时没有断言比原文更多的细节。
theological_decisions:
- issue: “买了”的直接宾语在所据希腊文本中没有明说
  choice: 在正文补出泛指的“人”，并加注说明
  alternative: 保留宾语省略，译作“从各支派……中买来归给上帝”
  rationale: 希腊文可依语境理解其对象，但现代汉语若完全省略会显得突兀。“人”仅补足语法和语境所隐含的对象，不把对象限定为某一特定群体，也不采用部分抄本所见的第一人称“我们”。
- issue: 血与买赎的关系
  choice: 译作“用自己的血……买了”
  alternative: 意译为“借着自己的死亡救赎了”
  rationale: 原文明确提到羔羊的血并使用“买”这一动词。正文保留这两个具体意象，不把它们扩写成某一宗派化的赎罪理论。
- issue: τῷ θεῷ 所表达的关系
  choice: 译作“归给上帝”
  alternative: 译作“为上帝”或“给上帝”
  rationale: 与格可表达受益者或归属方向；“归给上帝”在本句中最自然，但脚注保留“为上帝”的可能表达，避免过度消除语法张力。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。“你配”保持颂歌式宣告的凝练；分行呈现原句的诗歌节奏。正文保留“书卷、封印、血、买”等启示文学与祭牲意象，不以解释性神学术语替换。所有脚注标记均已置于正文相应位置。
