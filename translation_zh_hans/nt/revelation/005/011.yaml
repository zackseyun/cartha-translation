  text: Καὶ εἶδον, καὶ ⸀ἤκουσα φωνὴν ἀγγέλων πολλῶν κύκλῳ τοῦ θρόνου καὶ τῶν ζῴων καὶ τῶν πρεσβυτέρων, καὶ ἦν ὁ ἀριθμὸς αὐτῶν μυριάδες μυριάδων καὶ χιλιάδες χιλιάδων,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/011.yaml
  text: And I looked[a], and I heard the voice of many angels around the throne and the living creatures and the elders, and their number was myriads of myriads and thousands of thousands[b],
translation:
  language: zh_hans
  text: 我又观看[a]，又听见许多天使的声音；他们围绕着宝座、活物和众长老，数目有亿万又亿万、千千万万[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我又看见”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文直译为“万的万倍和千的千倍”，是形容数目极其庞大的重复表达；也可译为“万万又万万、千千又千千”。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδον
  choice: 我又观看
  rationale: 这里没有明说所看的对象，随即转入“听见”；“观看”自然地表现约翰在异象中再次留意眼前景象的叙事推进，同时以脚注保留“看见”的常见译法。
- source_word: ἤκουσα
  choice: 又听见
  rationale: 按不定过去时的叙事用法直译，并与前面的“又观看”形成连续动作。
- source_word: φωνὴν ἀγγέλων πολλῶν
  choice: 许多天使的声音
  rationale: φωνή为单数，可指众天使汇成的声音；此译法既保留单数的整体性，也避免擅自改成“众声”。
- source_word: κύκλῳ τοῦ θρόνου καὶ τῶν ζῴων καὶ τῶν πρεσβυτέρων
  choice: 他们围绕着宝座、活物和众长老
  rationale: 将希腊文的方位成分用独立分句表达，使现代汉语关系清楚；“他们”指前述许多天使。
- source_word: ζῴων
  choice: 活物
  rationale: 沿用《启示录》宝座异象中这类独特受造者的简洁称呼，既体现“活着的”含义，也不将其降格为普通动物。
- source_word: πρεσβυτέρων
  choice: 众长老
  rationale: “长老”是该词在《启示录》宝座场景中的标准现代汉语对应词；“众”符合复数并使表达自然。
- source_word: ἦν ὁ ἀριθμὸς αὐτῶν
  choice: 数目有
  rationale: 以自然现代汉语表达明确的数目陈述，不增添“无法计算”等原文未明说的判断。
- source_word: μυριάδες μυριάδων καὶ χιλιάδες χιλιάδων
  choice: 亿万又亿万、千千万万
  rationale: 用现代汉语可理解且具有庄严反复感的数量表达传达极其庞大的群体；脚注列出更贴近希腊文形式的译法，避免掩盖原文措辞。
theological_decisions:
- issue: 宝座异象中ζῷα所指受造者的称呼
  choice: 活物
  alternative: 活着的受造物；生灵
  rationale: “活物”保留这四位异象性受造者的独特身份，又不进一步界定其本质或象征意义，避免导入特定解释传统。
- issue: 庞大数量是否译作“无数”
  choice: 保留重复的数量表达
  alternative: 无数；数不胜数
  rationale: 原文使用具体而夸张的成组数词，并未直接说“不可数”；保留数量意象可避免把修辞效果解释成明确的不可计算性。
translation_notes:
  register: 采用现代、庄重而便于朗读的书面汉语。“亿万又亿万、千千万万”保留启示文学的宏大节奏；分号使“听见声音”与天使的位置、数目层次清楚。所有脚注标记均已置于正文。
