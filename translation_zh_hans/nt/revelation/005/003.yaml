  text: καὶ οὐδεὶς ἐδύνατο ἐν τῷ ⸀οὐρανῷ ⸂οὐδὲ ἐπὶ τῆς γῆς οὐδὲ⸃ ὑποκάτω τῆς γῆς ἀνοῖξαι τὸ βιβλίον οὔτε βλέπειν αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/003.yaml
  text: And no one in heaven or on the earth or under the earth was able to open the scroll or to look at it[a].
translation:
  language: zh_hans
  text: 天上、地上、地底下，没有一个能展开那书卷，也没有一个能观看它。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “书卷”也可译作“书”。这里的希腊词可泛指书写成的文献，但在本异象中，“书卷”更符合古代的形象。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς
  choice: 没有一个
  rationale: 准确表达全然否定，并与后面的“能”自然搭配；在庄重叙事中清楚流畅。
- source_word: ἐδύνατο
  choice: 能
  rationale: 希腊语未完成时在叙事背景中表示当时无人具备这种能力；现代汉语用“能”即可自然表达。
- source_word: ἐν τῷ οὐρανῷ / ἐπὶ τῆς γῆς / ὑποκάτω τῆς γῆς
  choice: 天上、地上、地底下
  rationale: 保留原文三重宇宙空间结构，同时采用现代汉语整齐、自然的并列表达。
- source_word: ἀνοῖξαι
  choice: 展开
  rationale: 对象是卷轴，中文通常说“展开书卷”；比泛称“打开”更贴合古代卷轴的具体形象。
- source_word: τὸ βιβλίον
  choice: 那书卷
  rationale: 本异象的对象是可展开的古代书卷；“那”体现希腊语定冠词所指向的场景中已知对象。
- source_word: οὔτε βλέπειν αὐτό
  choice: 也没有一个能观看它
  rationale: οὔτε连接第二项否定；重复“没有一个能”使中文结构清楚，并避免添加原文没有明说的“甚至”。“观看”比单纯“看见”更能表达有意注视。
theological_decisions:
- issue: 无人有能力展开或观看书卷的宇宙性范围
  choice: 照原文保留“天上、地上、地底下”的三重空间表达
  alternative: 概括为“整个受造界中”或“任何地方”
  rationale: 原文借三重空间结构强调普遍无一例外；保留具体意象可维持启示文学的张力，不把它抽象化。
- issue: 观看书卷是否带有递进强调
  choice: 译作“也没有一个能观看它”，不加入“甚至”
  alternative: 译作“甚至不能观看它”
  rationale: οὔτε明确连接第二个否定不定式，但“甚至”的递进意味并非必须由词形本身表达；不添加可保留原文两项能力之间可能的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。三处方位短语保持整齐节奏；后半句重复“没有一个能”，以免汉语将第二项误解为仅修饰“书卷”。脚注标记已置于正文相应位置。
