source:
  edition: SBLGNT
  text: ὁ ἀδικῶν ἀδικησάτω ἔτι, καὶ ὁ ῥυπαρὸς ⸀ῥυπαρευθήτω ἔτι, καὶ ὁ δίκαιος δικαιοσύνην ποιησάτω ἔτι, καὶ ὁ ἅγιος ἁγιασθήτω ἔτι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/011.yaml
  text: Let the one who does wrong still do wrong, and the filthy still be made filthy, and the righteous still practice righteousness, and the holy still be made holy.
translation:
  language: zh_hans
  text: 行不义的人，让他仍旧行不义；污秽的人，让他仍旧被玷污[a]；义人，让他仍旧行义[b]；圣洁的人，让他仍旧被分别为圣[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“仍旧污秽。”希腊语动词是被动形式，直译可作“仍旧被玷污”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“仍旧施行公正。”这里的“义”也可表达“公正”的意思。
    reason: lexical_alternative
  - marker: c
    text: 或译：“仍旧被圣化。”希腊语动词是被动形式，可表示“被分别为圣”或“被圣化”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἀδικῶν / ἀδικησάτω
  choice: 行不义的／让他仍旧行不义
  rationale: 以名词化的“……的”对应带冠词的现在分词，并以“让他……”保留第三人称命令式；“行不义”既保留动词意味，也与后文“行义”形成鲜明对照。
- source_word: ἔτι
  choice: 仍旧
  rationale: 四次重复译作“仍旧”，表达持续、依然如此的意味，并保留原文反复造成的庄严节奏。
- source_word: ὁ ῥυπαρός / ῥυπαρευθήτω
  choice: 污秽的／让他仍旧被玷污
  rationale: “污秽”兼具道德败坏与礼仪不洁的色彩；“被玷污”明确保留希腊语被动形式，并不补明施事者。
- source_word: ὁ δίκαιος / δικαιοσύνην ποιησάτω
  choice: 义人／让他仍旧行义
  rationale: “义人”是自然而庄重的名词化表达；“行义”简明地呈现 ποιεῖν δικαιοσύνην 的主动伦理行为，也维持与“行不义”的平行。
- source_word: ὁ ἅγιος / ἁγιασθήτω
  choice: 圣洁的／让他仍旧成为圣洁
  rationale: “圣洁的”保留形容词名词化用法；“成为圣洁”在现代汉语中比机械的“被圣化”自然，同时保留状态得以成就或加深的含义，且不明定施事者。
theological_decisions:
- issue: 末世语境中命令式的语气
  choice: 四个分句均采用“让他……”的命令式表达
  alternative: 译成预告性的“他还会……”
  rationale: 四个希腊语动词都是第三人称命令式。译文保留其严肃而带审判意味的修辞力量，不把它化约为单纯预言，也不暗示上帝赞同恶行。
- issue: ῥυπαρευθήτω 与 ἁγιασθήτω 的语态及隐含施事者
  choice: 前者译为“被玷污”，后者译为“成为圣洁”
  alternative: 译为“仍旧污秽”和“仍旧圣洁”，或两处都使用显式“被……”结构
  rationale: 前者用显式被动保存其尖锐语态；后者采用可自然表达结果状态、又不指定施事者的“成为圣洁”。这样既顾及现代汉语，又不擅自解释谁使其污秽或圣洁。
- issue: δικαιοσύνη 的伦理含义
  choice: 行义
  alternative: 施行公正
  rationale: 此处处于两组道德身份与行为的平行对照中，“义”范围较广，能涵盖正直、公义的生活；“公正”作为可能的语义另列脚注，避免把含义限缩为司法或社会公平。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。四个分句以“……的，让他仍旧……”构成整齐排比，并用分号呈现启示文学中郑重、断然的节奏；避免古奥的“任凭”“成圣之”等表达，同时保留原文命令式、重复和语态所带来的神学张力。
