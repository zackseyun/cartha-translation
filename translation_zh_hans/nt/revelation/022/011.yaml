review_pass:
  verdict: revise
  source_fidelity: 译文准确保留了四个第三人称命令式、“仍旧”的重复，以及前两组与后两组之间的道德对照。‘被玷污’恰当地反映了ῥυπαρευθήτω的被动形式。末句‘成为圣洁’虽可表达状态变化，但在汉语中主要是自发/结果性的变化，未能与原文ἁγιασθήτω的被动语态及其隐含施事者相对应；改为‘被分别为圣’可更明确保留语态，且不指定施事者。
  naturalness: 原有排比庄重清楚。将‘圣洁的’调整为‘圣洁的人’，使形容词名词化在现代汉语中更自然；相应地使用‘污秽的人’，也使四个主语的指称更清晰、结构更整齐。‘被分别为圣’属庄重的经文语体，在此语境下可接受。
  terminology: ‘行不义／行义’准确保留ἀδικέω与ποιεῖν δικαιοσύνην的行为性对照；脚注保留‘施行公正’作为δικαιοσύνη的可行替代。‘分别为圣’是对ἁγιάζω的常用、可理解的译法，并比‘成为圣洁’更能反映被动形式。
  issues:
