  to: 行不义的人，让他仍旧行不义；污秽的人，让他仍旧被玷污[a]；义人，让他仍旧行义[b]；圣洁的人，让他仍旧被分别为圣[c]。
  rationale: 修订仅处理末句被动语态未充分体现的问题，并将两个形容词性主语补足为现代汉语中更自然的‘……的人’。四个命令式、‘仍旧’的反复、原文的平行结构与隐含施事者均予保留。
