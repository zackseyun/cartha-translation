  naturalness: “城外有狗、行邪术的、淫乱的人、杀人的、拜偶像的，以及一切喜爱并实行虚假的人”在现代标准汉语中庄重、清晰，且各项可自然理解为类别名称。“淫乱的人”比单用“淫乱的”更完整自然。
  terminology: “狗”应保留为正文中的形象，不应释作某一特定群体；“行邪术的”“拜偶像的”准确。“虚假”适当地保留 ψεῦδος 可指谎言及更广泛虚妄的空间。原脚注把“实行虚假”替换性地说成“说谎行骗”，会缩窄语义并加入“行骗”的具体行为，宜改为以“谎言”为词汇替代项。
