id: REV.22.15
reference: Revelation 22:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἔξω οἱ κύνες καὶ οἱ φάρμακοι καὶ οἱ πόρνοι καὶ οἱ φονεῖς καὶ οἱ εἰδωλολάτραι καὶ πᾶς φιλῶν καὶ ποιῶν ψεῦδος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/015.yaml
  text: Outside are the dogs and the sorcerers and the sexually immoral and the murderers and the idolaters[b][a], and everyone who loves and practices falsehood.
translation:
  language: zh_hans
  text: 城外有狗[a]、行邪术的、淫乱的人、杀人的、拜偶像的，以及一切喜爱并实行虚假的人。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “狗”在这里很可能是比喻，表示被排斥和道德上不洁净的人；也有人将它更具体地理解为某一类人。
    reason: cultural_note
  - marker: b
    text: “虚假”也可译为“谎言”；原文较直译为“一切喜爱并实行谎言的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔξω
  choice: 城外有
  rationale: 结合上文所述圣城，补出“城”使现代汉语指向清楚；保留原文句首“在外面”的强调，表达被排除在城外。
- source_word: κύνες
  choice: 那些狗
  rationale: 保留原文具体而尖锐的象征形象，不在正文中限定为某一有争议的特定群体。
- source_word: φάρμακοι
  choice: 行邪术的
  rationale: 此词在《启示录》中指施行巫术、邪术的人；用“行邪术的”比音译或现代职业联想更清楚。
- source_word: πόρνοι
  choice: 淫乱的
  rationale: 概括从事不合正当性伦理之性行为的人，不将所指缩窄为某一种行为。
- source_word: φονεῖς
  choice: 杀人的
  rationale: 直接表达实施杀人行为的人，并与整串“……的”结构协调。
- source_word: εἰδωλολάτραι
  choice: 拜偶像的
  rationale: 现代汉语清楚、简洁地表达敬拜偶像者，并保持罪恶清单的节奏。
- source_word: πᾶς φιλῶν καὶ ποιῶν ψεῦδος
  choice: 一切喜爱并实行虚假的人
  rationale: “一切……的人”自然表达 πᾶς 加分词；“喜爱并实行”保留两个并列分词及持续、惯常的意味。“虚假”可兼指谎言和更广泛的虚妄。
theological_decisions:
- issue: κύνες 是否应在正文中解释为某个特定群体
  choice: 正文保留“狗”这一形象
  alternative: 译作男妓、不洁净的人、无耻的人或泛指外人
  rationale: 原文使用具体名词 κύνες，且《启示录》常用鲜明象征。直译可保留修辞冲击力，也避免把有争议的特定解释写入正文。
- issue: ψεῦδος 应理解为单独的“一个谎言”还是广义的“虚假”
  choice: 译作“虚假”
  alternative: 译作“谎言”或“一个谎言”
  rationale: 该词与“喜爱并实行”连用，更像一种持续的取向和行为类别；“虚假”既可包含说谎，也保留参与虚妄之事的较广含义。脚注列出较窄译法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。用重复的“……的”保持原文罪恶清单的紧凑节奏；“城外有”承接上下文并保留句首强调。所有脚注标记均置于相应正文位置。
