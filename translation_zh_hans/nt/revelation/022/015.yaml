  to: 城外有狗[a]、行邪术的、淫乱的人、杀人的、拜偶像的，以及一切喜爱并实行虚假的人。[b]
  rationale: 修订仅去除无必要的“那些”，将“淫乱的”调整为更完整的名词性表达，并将脚注中的过窄释义改为原文支持的词汇替代项。其余用语保留原稿对原文结构、意象及含义范围的忠实表达。
