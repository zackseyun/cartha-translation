id: REV.22.8
reference: Revelation 22:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Κἀγὼ Ἰωάννης ὁ ἀκούων καὶ βλέπων ταῦτα. καὶ ὅτε ἤκουσα καὶ ἔβλεψα, ἔπεσα προσκυνῆσαι ἔμπροσθεν τῶν ποδῶν τοῦ ἀγγέλου τοῦ δεικνύοντός μοι ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/008.yaml
  text: And I[a], John, am the one hearing and seeing these things. And when I heard and saw, I fell down to worship before the feet of the angel who was showing me these things.
translation:
  language: zh_hans
  text: 我约翰，就是那听见、看见这些事的人。当我听见、看见这些事时，就俯伏在那把这些事指给我看的天使脚前，要敬拜他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “敬拜”也可译作“俯伏致敬”或“下拜”。希腊文动词既可表示俯伏或尊敬的动作，也可表示敬拜；这里译作“敬拜”，是因为该词在《启示录》中通常具有这一含义，而且下一节天使随即制止约翰。
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀγὼ Ἰωάννης
  choice: 我约翰
  rationale: καί承接上文，但汉语在本句开头省去“而”更自然；ἐγώ与名字并列所带的强调由“我约翰”保留。
- source_word: ὁ ἀκούων καὶ βλέπων ταῦτα
  choice: 就是听见、看见这些事的人
  rationale: 保留定冠词加现在分词的实质化结构，并用“就是……的人”自然表达约翰对自己见证人身份的强调；汉语不强行标出英语式进行体。
- source_word: ὅτε ἤκουσα καὶ ἔβλεψα
  choice: 我听见、看见以后
  rationale: ὅτε本义为“当……时”；此处结合随后的俯伏动作，现代汉语用“以后”清楚表达叙事顺序，但不引入完成时含义。
- source_word: ἔπεσα
  choice: 俯伏
  rationale: 语境显示这不是普通跌倒，而是为行προσκυνέω而伏下；“俯伏”兼顾身体动作和庄重语体。
- source_word: προσκυνῆσαι
  choice: 要敬拜他
  rationale: 在《启示录》中该词通常具有敬拜意味，且下一节的责备表明此举不当；补出“他”符合汉语表达，而所指对象由“天使”明确。
- source_word: ἔμπροσθεν τῶν ποδῶν
  choice: 脚前
  rationale: 保留ἔμπροσθεν的“在……前”和明确的“脚”，同时采用简洁自然的汉语搭配。
- source_word: τοῦ ἀγγέλου τοῦ δεικνύοντός μοι ταῦτα
  choice: 那把这些事指给我看的天使
  rationale: “天使”符合本书语境；现在分词表达天使在异象中持续担任指示者的角色，“指给我看”自然对应δεικνύω。
theological_decisions:
- issue: 约翰对天使所行προσκυνέω的性质
  choice: 译作“敬拜”，并以脚注保留“俯伏致敬”的词义可能
  alternative: 译作“俯伏致敬”或“下拜”
  rationale: 该动词可指俯伏、致敬，也可指敬拜；本书中的通常用法和下一节的制止支持正文采用“敬拜”。同时以脚注保存词汇本身的范围，不预先消解叙事中的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“我约翰，就是……”保留见证式自我指认；避免机械复制希腊文分词时态，同时保留其身份描述功能。脚注标记置于相关动作之后。
