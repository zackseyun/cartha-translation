id: REV.22.6
reference: Revelation 22:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ ⸀εἶπέν μοι· Οὗτοι οἱ λόγοι πιστοὶ καὶ ἀληθινοί, καὶ ⸀ὁ κύριος, ὁ θεὸς τῶν πνευμάτων τῶν προφητῶν, ἀπέστειλεν τὸν ἄγγελον αὐτοῦ δεῖξαι τοῖς δούλοις αὐτοῦ ἃ δεῖ γενέσθαι ἐν τάχει·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/006.yaml
  text: And he said to me[a], “These words are trustworthy and true, and the Lord, the God of the spirits of the prophets[b], sent his angel to show his slaves what must happen soon.”
translation:
  language: zh_hans
  text: 他对我说：“这些话可信、真实。主——众先知之灵的神——差遣了他的天使，把不久必发生的事[a]指示给他的奴隶[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“必迅速发生的事”。希腊语短语既可强调时间临近（“不久”），也可强调事情发生或进展迅速。
    reason: alternative_reading
  - marker: b
    text: 或译“仆人”或“奴仆”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστοὶ καὶ ἀληθινοί
  choice: 可信、真实
  rationale: “可信”表达这些话可靠、值得信赖；“真实”表达其真实性，并保留希腊文两个并列形容词的区分。
- source_word: κύριος
  choice: 主
  rationale: 此处是神的称号，又与“众先知之灵的神”同位；“主”保留其圣经语境中的神学分量。
- source_word: ὁ θεὸς τῶν πνευμάτων τῶν προφητῶν
  choice: 众先知之灵的神
  rationale: 按原文属格结构直译，不把它解释性地改写为“感动众先知的神”或“掌管众先知之灵的神”，从而保留关系上的含混。
- source_word: ἄγγελον
  choice: 天使
  rationale: 启示录的异象语境表明这里指天上的使者；“天使”比泛称“使者”更合适。
- source_word: δούλοις
  choice: 奴隶
  rationale: 该词强调归属于主并受其支配的人；“奴隶”直接保留这种隶属意味，另以脚注提供较传统、较缓和的译法。
- source_word: δεῖξαι
  choice: 指示
  rationale: 既表达“使人看见、显示”，也自然适用于天使向神的奴隶传达异象的语境。
- source_word: ἃ δεῖ γενέσθαι
  choice: 必发生的事
  rationale: “必”保留 δεῖ 所表达的必要性，“发生的事”自然表达 γενέσθαι。
- source_word: ἐν τάχει
  choice: 不久
  rationale: 正文采用时间临近的理解；原短语也可能强调事情发生得迅速，因此在脚注中保留另一译法。
- source_word: Καὶ εἶπέν μοι
  choice: 他又对我说
  rationale: “又”自然承接上文，并不过度强化 καί 的时间推进意味。
theological_decisions:
- issue: 末世语境中 ἐν τάχει 的含义
  choice: 不久
  alternative: 迅速地、很快地
  rationale: 原短语既可表示时间上的临近，也可表示事情一旦发生便进展迅速。正文采用本段及启示录反复强调临近性的读法，脚注保留另一可能，避免消除末世论上的张力。
- issue: δούλοι 对神子民的称呼
  choice: 奴隶
  alternative: 仆人、奴仆
  rationale: 正文保留该词所含的归属和受支配意味，不用较柔化的传统译语取代；脚注列出中文圣经语体中常见的替代译法。
- issue: “众先知之灵的神”中属格关系
  choice: 保留属格结构
  alternative: 感动众先知的神；掌管众先知之灵的神
  rationale: 原文没有明确说明这些“灵”与神之间的具体关系；直译可避免把神的主权或默示方式当作唯一解释写入正文。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“主——众先知之灵的神——”用破折号标明同位关系；正文保留“奴隶”的尖锐隶属意味，并以脚注照顾传统译法。
