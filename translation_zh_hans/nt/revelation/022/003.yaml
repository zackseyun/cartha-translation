id: REV.22.3
reference: Revelation 22:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ πᾶν κατάθεμα οὐκ ἔσται ἔτι. καὶ ὁ θρόνος τοῦ θεοῦ καὶ τοῦ ἀρνίου ἐν αὐτῇ ἔσται, καὶ οἱ δοῦλοι αὐτοῦ λατρεύσουσιν αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/003.yaml
  text: And there will no longer be any curse[a]. And the throne of God and of the Lamb will be in it, and his slaves will worship him[d][c][b],
translation:
  language: zh_hans
  text: 再也不会有任何咒诅[a]。上帝和羔羊的宝座必在城中；他的奴仆[c]要敬拜[d]他[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“任何被咒诅之物”。
    reason: lexical_alternative
  - marker: b
    text: 原文用的是单数：“上帝和羔羊”的“宝座”……“他的奴仆要敬拜他”；这既保留上帝与羔羊的区别，也体现他们共同掌权。
    reason: alternative_reading
  - marker: c
    text: 或译“仆人”。
    reason: lexical_alternative
  - marker: d
    text: 或译“事奉”，即从事神圣的事奉。
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν κατάθεμα
  choice: 任何咒诅
  rationale: “任何”体现πᾶν的全面含义；“咒诅”在现代汉语中自然，也符合新创造中咒诅被除去的语境。原词也可能具体指被咒诅之物，故列入脚注。
- source_word: οὐκ ἔσται ἔτι
  choice: 再也没有
  rationale: 以自然、简洁的现代汉语表达将来的存在句，并保留ἔτι“不再”的含义。
- source_word: ὁ θρόνος
  choice: 宝座
  rationale: 启示录语境中的标准译法，并严格保留单数。
- source_word: τοῦ θεοῦ καὶ τοῦ ἀρνίου
  choice: 上帝和羔羊的
  rationale: 明确保留两个并列属格；“羔羊”延续启示录中的献祭与弥赛亚意象。
- source_word: ἐν αὐτῇ
  choice: 在城中
  rationale: 阴性单数代词回指前文的城，即新耶路撒冷；汉语中明示所指比直译“在它里面”更自然。
- source_word: οἱ δοῦλοι αὐτοῦ
  choice: 他的奴仆
  rationale: “奴仆”既保留δοῦλοι所含的隶属关系，又符合庄重的现代汉语圣经语体；单数“他的”忠实保留原文形式。
- source_word: λατρεύσουσιν αὐτῷ
  choice: 要敬拜他
  rationale: λατρεύω在此宝座与圣城语境中指向献给上帝的宗教性服事；“敬拜”清楚传达这一含义，并以脚注保留“事奉”的词义可能。
theological_decisions:
- issue: 一个宝座、两个并列所属者与单数代词之间的张力
  choice: 保留单数：“上帝和羔羊的宝座……他的奴仆……敬拜他”
  alternative: 为求表面清楚而改成复数：“他们的奴仆……敬拜他们”
  rationale: 希腊文既区分“上帝”和“羔羊”，又使用一个“宝座”及单数的“他的／他”。译文保留这种形式，不以复数代词或释义消解其神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“城中”自然承接前文的新耶路撒冷；分号呈现两个紧密相连的陈述。保留“宝座”“他的”“他”的单数形式，并用脚注说明其刻意保留的语法与神学张力。
