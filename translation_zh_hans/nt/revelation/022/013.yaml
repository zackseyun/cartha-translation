  text: ἐγὼ τὸ Ἄλφα καὶ τὸ Ὦ, ὁ πρῶτος καὶ ὁ ἔσχατος, ⸀ἡ ἀρχὴ καὶ ⸀τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/013.yaml
  text: I am the Alpha and the Omega[a], the first and the last, the beginning and the end.
translation:
  language: zh_hans
  text: 我就是阿拉法和俄梅伽，是首先的和末后的，是开始和终结[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“根源和目标。”
    reason: 保留ἀρχή可指“根源”、τέλος可指“目标”的词义可能，同时不打断正文三组首尾称号的平行结构。
lexical_decisions:
- source_word: ἐγὼ
  choice: 我就是
  rationale: 希腊文明确使用第一人称代词，带有强调意味；“我就是”在现代汉语中自然、庄重，也适合这一宣告式语境。
- source_word: τὸ Ἄλφα
  choice: 阿拉法
  rationale: 音译希腊字母表的第一个字母，保留《启示录》中固定象征性称号的形式，不改写为汉语字母或“第一个字母”。
- source_word: τὸ Ὦ
  choice: 俄梅伽
  rationale: 音译希腊字母表的最后一个字母，与“阿拉法”构成公认的象征性称号，并保持原文首尾相对的表达。
- source_word: ὁ πρῶτος
  choice: 首先的
  rationale: 直接呈现该形容词名词化的称号用法，并与“末后的”形成自然、对称的搭配。
- source_word: ὁ ἔσχατος
  choice: 末后的
  rationale: 准确表达“最后的”这一称号意义；“末后的”语体庄重，且与“首先的”平衡。
- source_word: ἡ ἀρχὴ
  choice: 开始
  rationale: 保留与“终结”的对应关系和概括性；该词也可能表示根源，因此以脚注注明这一语义可能。
- source_word: τὸ τέλος
  choice: 终结
  rationale: 与“开始”构成紧凑而庄重的对应，可表达终点或完成；该词也可侧重目标，故在脚注中保留这一可能。
theological_decisions:
- issue: 三组自我称号是否应解释为关于永恒、主权或本体的明说
  choice: 保留“阿拉法和俄梅伽、首先的和末后的、开始和终结”三组并列称号，不加入解释性措辞
  alternative: 译为“万有的根源和目标”等解释性表达
  rationale: 原文以三组平行称号作出高度概括的宣告，却没有展开其形而上或神学含义。直译其结构可让经文本身的张力与高基督论含义自然呈现，避免加入原文未明说的教义解释。
- issue: ἀρχή与τέλος的语义范围
  choice: 正文采用“开始和终结”
  alternative: “根源和目标”
  rationale: 上下文中的三组首尾对应支持“开始和终结”，而“根源和目标”则能体现两个希腊词可能具有的来源与目的含义；正文保留形式平衡，脚注保存词义上的真实可能。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“我就是”体现显式代词的强调；三个“是”维持原文三组称号的节奏与对称。“阿拉法”和“俄梅伽”采用中文圣经语境中通行的希腊字母音译。
