  text: καὶ ὄψονται τὸ πρόσωπον αὐτοῦ, καὶ τὸ ὄνομα αὐτοῦ ἐπὶ τῶν μετώπων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/004.yaml
  text: and they will see his face[b][a], and his name will be on their foreheads.
translation:
  language: zh_hans
  text: 他们将看见他的面容[a][b]，他的名也将在他们的额头上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们将瞻仰他的面容。”
    reason: lexical_alternative
  - marker: b
    text: 这里单数的“他”可能指上帝，也可能反映紧邻上下文中上帝与羔羊共同的神圣统治。
    reason: alternative_reading
lexical_decisions:
- source_word: ὄψονται
  choice: 将看见
  rationale: 这是ὁράω的将来时形式，在此表达直接的将来意义。“将看见”自然清楚，并保留视觉含义；较庄重的“瞻仰”列入脚注作为可能译法。
- source_word: τὸ πρόσωπον αὐτοῦ
  choice: 他的面容
  rationale: πρόσωπον在此最自然地指“面容”，因其作“看见”的直接宾语，不宜弱化为抽象的“同在”。保留单数代词“他的”，不擅自明确所指。
- source_word: τὸ ὄνομα αὐτοῦ
  choice: 他的名
  rationale: ὄνομα直译为“名”。经文可能含有身份、归属或品格等意蕴，但正文不将这些解释加入译文。
- source_word: ἐπὶ τῶν μετώπων αὐτῶν
  choice: 在他们的额头上
  rationale: ἐπί加属格在这里表示所在位置。“在他们的额头上”符合现代汉语，并保留μετώπων的复数群体含义。
- source_word: καὶ … καὶ
  choice: ……，……也……
  rationale: 首个καί承接上文，在单节中文中不必机械译出句首“并且”；第二个καί用“也”表达两个陈述的并列递进关系。
- source_word: αὐτοῦ
  choice: 他的
  rationale: 两处都保留原文的单数第三人称代词，使其指代仍由上下文决定，不改写成“上帝的”或“羔羊的”。
theological_decisions:
- issue: “他的面容”和“他的名”中单数代词的所指
  choice: 正文保留“他的”，不明确指定所指。
  alternative: 明确译为“上帝的”，或将其解释为上帝与羔羊共同掌权背景下的共同指涉。
  rationale: 紧邻上文同时提到上帝和羔羊，而本节使用单数代词。保留代词可保存原文在神学与基督论上的张力，避免译文作出原文未明说的限定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“面容”比单用“面”更符合当代读者习惯，又保留原文具体、可见的含义；“额头”较“额”自然。句式简洁，并保留两处单数“他的”所具有的指代张力。
