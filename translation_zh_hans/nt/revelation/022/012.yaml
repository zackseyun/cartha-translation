review_pass:
  verdict: revise
  source_fidelity: 草稿准确传达了来临、随身带着报偿及按个人行为施行回报的基本意思。但“与我同来”把μετ’ ἐμοῦ（直义“与我同在／在我这里”）具体化为“同来”，而“报应他”在现代汉语中通常带有惩罚性，且与“我的报偿”的较宽语义及ἀποδοῦναι的“偿还、回报”不完全相称。
  naturalness: “看哪，我快要来了”庄重自然。“照每个人所行的报应他”句法可懂，但“报应”作动词及末尾“他”的搭配略显生硬，也容易被读作只指惩罚。改为“照各人所行的报还各人”更符合现代庄重书面语，并明确分配性。
  terminology: “看哪”适合启示文学宣告语气。“报偿”可保留μισθός在本节审判语境中的回报含义；“报还”较好对应ἀποδοῦναι，而不预设回报必为正面或负面。采用“各人”避免不必要的汉语性别代词，同时不损失原文的个体分配意义。
  issues:
  - severity: medium
    issue: “与我同来”超出了μετ’ ἐμοῦ的直接表述。
    rationale: 原文为省略系词的“我的报偿与我同在”，并未明说报偿“同来”。译为“在我这里”既自然，也保留其由主所持有、可随即施行的含义。
  - severity: medium
    issue: “报应他”在汉语中偏指惩罚。
    rationale: ἀποδοῦναι指按所当得的偿付、回报；本句不应因“报应”一词的通常负面色彩而预先缩窄。改用“报还各人”保留回报／偿付的开放性。
  - severity: low
    issue: “每个人……他”的指代略显累赘。
    rationale: “各人……各人”在庄重现代汉语中自然，能表达ἑκάστῳ和αὐτοῦ的逐一分配，不引入性别层面的额外强调。
