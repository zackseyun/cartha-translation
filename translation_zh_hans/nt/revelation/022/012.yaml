  text: Ἰδοὺ ἔρχομαι ταχύ, καὶ ὁ μισθός μου μετ’ ἐμοῦ, ἀποδοῦναι ἑκάστῳ ὡς τὸ ἔργον ⸀ἐστὶν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/012.yaml
  text: Behold[a], I am coming soon, and my reward is with me, to repay each one according to what his work is.
translation:
  language: zh_hans
  text: 看哪，我快要来了！我的报偿在我这里，要照各人所行的报还各人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “快要来了”也可译作“很快就来”或“迅速地来”。希腊语ταχύ既可强调时间临近，也可强调来临迅速或突然。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: 看哪
  rationale: 保留先知性、启示文学中郑重唤起注意的语气；现代读者也能理解。
- source_word: ἔρχομαι
  choice: 我要来了
  rationale: 希腊语现在时在此具有面向未来的临近意味；汉语用“要……了”自然表达将近发生。
- source_word: ταχύ
  choice: 快要
  rationale: 在末世语境中可指时间临近，也可强调行动迅速；正文采用自然表达临近性的“快要”，另一可能见脚注。
- source_word: ὁ μισθός μου
  choice: 我的报偿
  rationale: μισθός可指工价、赏赐或报偿；此处涉及按行为施行审判，“报偿”既涵盖奖赏也不排除惩处，比单用“赏赐”更能保留语义张力。
- source_word: μετ’ ἐμοῦ
  choice: 与我同来
  rationale: 原文是省略系词的“与我同在”；结合“我来”的语境，汉语译作“与我同来”自然地表达报偿随他而来。
- source_word: ἀποδοῦναι
  choice: 报应
  rationale: 该词表示按应得的归还、偿付；“报应”在此可作中性偏庄重的审判用语，与“照……所行的”搭配自然。
- source_word: ἑκάστῳ
  choice: 每个人
  rationale: 准确表达单数分配意义和个体责任，同时符合现代汉语习惯。
- source_word: ὡς τὸ ἔργον ἐστὶν αὐτοῦ
  choice: 照每个人所行的
  rationale: 原文直译近于“照他的行为如何”；汉语以“所行的”表达ἔργον的行为或作为之意，避免生硬的“他的工作是什么”。
theological_decisions:
- issue: 按行为施行报偿的性质
  choice: 我的报偿……照每个人所行的报应他
  alternative: 我的赏赐……按各人所作的给他
  rationale: 保留经文关于个体按行为受报的陈述，不进一步断定这是得救的依据，也不把报偿缩限为只有奖赏。
- issue: ἑκάστῳ与αὐτοῦ的性别表达
  choice: 每个人……他
  alternative: 各人……各人
  rationale: “每个人”传达希腊语代表性阳性单数所涵盖的普遍对象；末尾用“他”保持单数指代，在现代标准汉语中清楚自然。
translation_notes:
  register: 采用现代、庄重而易懂的启示文学语体。“看哪”保留郑重的宣告感；“报偿／报应”保留审判语境中可涉及奖赏或惩处的张力。脚注标记置于整节末尾，说明ταχύ的真实歧义。
