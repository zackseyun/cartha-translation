id: REV.22.17
reference: Revelation 22:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ τὸ πνεῦμα καὶ ἡ νύμφη λέγουσιν· Ἔρχου· καὶ ὁ ἀκούων εἰπάτω· Ἔρχου· καὶ ὁ διψῶν ἐρχέσθω, ὁ θέλων λαβέτω ὕδωρ ζωῆς δωρεάν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/017.yaml
  text: And the Spirit and the bride say[a], “Come.” And let the one who hears say, “Come.” And let the one who is thirsty come[c][b]; let the one who desires take the water of life freely.
translation:
  language: zh_hans
  text: 圣灵和新妇说：“来！”听见的人也应当说：“来！”口渴的人应当前来；愿意的人也应当白白取生命的水喝。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “白白”也可译作“无需付代价”或“作为礼物”。
    reason: lexical_alternative
  - marker: b
    text: 前两声“来！”通常被理解为呼求主来；接下来的话则邀请口渴、愿意的人前来领受生命。不过，原文没有明说前两声呼喊的对象。
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ πνεῦμα
  choice: 圣灵
  rationale: 定冠词与《启示录》的语境表明此处最自然地指圣灵；中文用“圣灵”明确这一指称。
- source_word: ἡ νύμφη
  choice: 新妇
  rationale: 保留《启示录》中 νύμφη 的婚姻象征，不在正文中将其解释为教会、上帝的子民或新耶路撒冷。
- source_word: λέγουσιν
  choice: 都说
  rationale: 用现代汉语的一般现在表达持续而鲜明的宣告；“都”自然体现圣灵和新妇共同发声。
- source_word: Ἔρχου
  choice: 来！
  rationale: 直接保留第二人称命令语气，不补出原文未明说的受话者。
- source_word: ὁ ἀκούων
  choice: 听见的人
  rationale: 贴近带冠词的现在分词，并以自然的泛指表达涵盖任何听见者。
- source_word: εἰπάτω
  choice: 也要说
  rationale: 体现第三人称命令式；“也”传达听见者加入前述呼声的承接关系。
- source_word: ὁ διψῶν
  choice: 口渴的人
  rationale: 保留原文具体的干渴意象，不提前将其抽象解释为属灵需要。
- source_word: ἐρχέσθω
  choice: 要来
  rationale: 简洁表达第三人称命令式所含的邀请兼劝促语气。
- source_word: ὁ θέλων
  choice: 愿意的人
  rationale: 保留 θέλω 所表达的意愿，不添加原文没有明说的宾语“想要这水的人”。
- source_word: λαβέτω
  choice: 可以……取……喝
  rationale: “取”对应 λαμβάνω；因宾语是水，补入“喝”使现代汉语意象完整自然，但核心动作仍是取用。
- source_word: ὕδωρ ζωῆς
  choice: 生命的水
  rationale: 直接保留属格结构及约翰传统中的固定意象，不改写为“活水”。
- source_word: δωρεάν
  choice: 白白
  rationale: 表达无须付代价、作为恩赐取得的意义；在中文圣经语体中简洁自然。
theological_decisions:
- issue: 两次“来”的受话者是谁
  choice: 正文不补出受话者，保留两次直接呼喊“来！”；随后明确转为邀请口渴者前来取水。
  alternative: 明确译成“主啊，请来”，或把所有“来”都理解为对口渴者的邀请。
  rationale: 原文前两次均为第二人称命令式 Ἔρχου，却未明说对象；之后才改用第三人称命令式邀请口渴和愿意的人。保留这一转折可维持文本的层次与神学张力。
- issue: “新妇”的象征所指
  choice: 正文保留“新妇”这一象征。
  alternative: 译为“教会”“上帝的子民”或“新耶路撒冷”。
  rationale: 《启示录》有意让这些关联彼此交叠；直接解释会缩窄原文意象。
- issue: δωρεάν 所表达的恩赐性质
  choice: 译为“白白”，并以脚注说明“无需付代价／作为礼物”。
  alternative: 正文直译为“无需付代价”或“作为礼物”。
  rationale: “白白”兼具简洁、尊严和传统可识别性，而脚注可澄清其不是“徒然”，而是免费赐予。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“新妇”保留启示文学的传统象征语汇；“口渴的人要来”保持简洁有力。“可以”使末句在汉语中自然呈现开放邀请，并不削弱希腊语命令式。正文中的脚注标记均有对应脚注。
