base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/007.yaml
  text: And behold[a], I am coming soon[b]. Blessed is the one who keeps the words of the prophecy of this book.
translation:
  language: zh_hans
  text: 看哪，我快要来了[a]！遵守这书的预言之话的人有福了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“迅速地”。希腊词既可强调时间临近（“快要”），也可强调来临得迅速或突然。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留原文唤起注意、郑重宣告的语用力量；在启示文学语境中自然且庄重。
- source_word: ἔρχομαι
  choice: 我就要来了
  rationale: 以现代汉语自然表达现在时形式在此处所具有的将来及临近意味，同时不补入原文未明说的说话者姓名。
- source_word: ταχύ
  choice: 很快
  rationale: 本语境下主要表达时间上的临近；脚注保留其也可指行动迅速或突然发生的可能。
- source_word: μακάριος
  choice: 有福了
  rationale: 符合汉语祝福宣告的惯用表达，保留其末世性和属灵分量，避免缩减为主观情绪上的快乐。
- source_word: ὁ τηρῶν
  choice: 遵守……的人
  rationale: 以泛指结构表达带冠词的现在分词；“遵守”兼顾持守、谨守并照着实行的含义，而不把意义收窄为单纯服从命令。
- source_word: τοὺς λόγους
  choice: ……之话
  rationale: 保留复数 λόγους 所指的具体言语内容；“预言之话”庄重而仍为现代读者可懂，也避免概括成单数的“信息”。
- source_word: τῆς προφητείας
  choice: 预言
  rationale: 保留原文明确的启示文学类别以及“预言之话”的属格关系，不另加解释性限定。
- source_word: τοῦ βιβλίου τούτου
  choice: 这书中
  rationale: “书”是现代汉语最自然的指称；“中”使“这书中预言之话”的修饰关系清楚。古代载体可能是书卷，故在脚注说明。
theological_decisions:
- issue: “我很快就要来了”的说话者身份
  choice: 正文只保留第一人称“我”，不补出姓名
  alternative: 在正文中明确补作“耶稣说：我很快就要来了”
  rationale: 希腊文本本节只使用第一人称动词，身份应由上下文辨明；翻译不应把解释性的专名加入正文。
- issue: τηρέω 在本节中的范围
  choice: 译作“遵守”
  alternative: 译作“保守”或“顺服”
  rationale: “遵守”可涵盖珍重、持守并实行预言之话，不把祝福条件仅解释为保存文本，也不将其窄化为命令式的服从。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“看哪”保留启示性宣告的郑重语气；“很快就要来了”自然表达临近感；整体维持原文先宣告来临、后宣告有福的紧凑结构。脚注标记依其实际说明对象分别置于“很快”和“书”之后。
