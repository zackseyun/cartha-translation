  text: Ἡ χάρις τοῦ κυρίου ⸀Ἰησοῦ μετὰ ⸀πάντων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/021.yaml
  text: The grace of the Lord Jesus be with all[a].
translation:
  language: zh_hans
  text: 愿主耶稣的恩典与所有人同在。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“愿主耶稣的恩典与众圣徒同在”，另有些抄本作“与你们众人同在”。
    reason: textual_variant
lexical_decisions:
- source_word: χάρις
  choice: 恩典
  rationale: 在新约祝福语中，“恩典”是自然且沿用已久的对应词，保留了上帝施恩与救赎的内涵。
- source_word: κυρίου
  choice: 主
  rationale: κύριος在此是耶稣的称号；“主”准确、庄重，也符合现代汉语基督教文本的通行表达。
- source_word: Ἰησοῦ
  choice: 耶稣
  rationale: 按现代标准汉语采用该人名的通行音译。
- source_word: μετὰ
  choice: 与……同在
  rationale: 希腊文祝福语省略动词；汉语补出“愿……同在”，自然表达祈愿语气，同时不增加实质内容。
- source_word: πάντων
  choice: 所有人
  rationale: 本文读作不带限定语的πάντων，指“所有人”；不擅自补入“圣徒”或第二人称限定。
theological_decisions:
- issue: 是否明确祝福所指的对象
  choice: 译作“与所有人同在”
  alternative: “与你们众人同在”或“与众圣徒同在”
  rationale: SBLGNT正文仅有πάντων，范围宽泛而未加限定。正文保留这种广度；其他抄本的明确说法置于脚注，以免用异文消解正文的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的祝福语体。“愿”补足希腊文无动词句的祈愿功能；“所有人”比单说“所有”更符合现代汉语，同时避免加入正文没有的“你们”或“圣徒”。
