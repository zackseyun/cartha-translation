id: REV.22.20
reference: Revelation 22:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Λέγει ὁ μαρτυρῶν ταῦτα· Ναί· ἔρχομαι ταχύ. Ἀμήν· ⸀ἔρχου, κύριε Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/020.yaml
  text: The one who testifies to these things says[a], “Yes, I am coming soon.” Amen. Come, Lord Jesus.
translation:
  language: zh_hans
  text: 为这些事作见证的那一位说：“是的，我快要来了[a]。”阿们。主耶稣啊，请来吧！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我会迅速地来。”希腊语副词既可强调时间临近，也可强调来临或行动迅速。
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγει
  choice: 说
  rationale: 以现代汉语常用的现在时引语表达方式呈现，无须增添“宣告”等较强语气。
- source_word: ὁ μαρτυρῶν
  choice: 作见证的那一位
  rationale: 保留实词化现在分词的指称作用和μαρτυρέω的见证含义；“那一位”在中文中自然地指向耶稣。
- source_word: ταῦτα
  choice: 这些事
  rationale: 保留复数指示语，指向刚刚启示的内容。
- source_word: Ναί
  choice: 是的
  rationale: 直接表达肯定回应，不额外加入“必定”等解释性强调。
- source_word: ἔρχομαι
  choice: 我要来了
  rationale: 用现代汉语表达其面向将来的临近行动，与ταχύ连用自然。
- source_word: ταχύ
  choice: 快要
  rationale: 正文采用时间临近之义；原词也可能强调来临迅速，故在脚注中保留另一种理解。
- source_word: Ἀμήν
  choice: 阿们
  rationale: 保留传统礼仪性音译，表达认同和祈愿。
- source_word: ἔρχου
  choice: 请来吧
  rationale: 呈现第二人称单数命令式的直接呼求；“请……吧”兼具迫切和敬意，符合现代汉语祷告语体。
- source_word: κύριε
  choice: 主
  rationale: 保留对耶稣的尊称及新约中κύριος的常规对应。
- source_word: Ἰησοῦ
  choice: 耶稣
  rationale: 采用现代简体中文圣经传统通行的人名译法。
theological_decisions:
- issue: 基督应许来临时ταχύ的含义
  choice: 快要（强调时间临近）
  alternative: 迅速地、很快地（强调来临或行动的迅疾）
  rationale: ταχύ既可指时间上的临近，也可指行动发生得迅速。上下文中的应许和随后的呼求支持正文采用“快要”，但末世论上的真实歧义不应消除，因此以脚注保留另一含义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“为这些事作见证的那一位”保留原文结构；末句加“啊”和“请……吧”，使直接呼语与祈求在中文中清楚自然，同时不削弱其迫切感。
