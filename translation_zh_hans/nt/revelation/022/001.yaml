  text: Καὶ ἔδειξέν μοι ⸀ποταμὸν ὕδατος ζωῆς λαμπρὸν ὡς κρύσταλλον, ἐκπορευόμενον ἐκ τοῦ θρόνου τοῦ θεοῦ καὶ τοῦ ἀρνίου
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/001.yaml
  text: And he showed me a river of the water of life[a], bright as crystal[b], flowing out from the throne of God and of the Lamb.
translation:
  language: zh_hans
  text: 他给我看一条生命之水的河，光亮如水晶，从上帝和羔羊的宝座流出。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔδειξέν μοι
  choice: 指给我看
  rationale: 直接表达“让某人看见、指示给某人看”的意思，保留异象叙事的具体性；“又”对应句首连接词 καί。
- source_word: ποταμὸν ὕδατος ζωῆς
  choice: 一条生命之水的河
  rationale: 保留“河—水—生命”的属格意象链，同时采用现代汉语可理解而庄重的表达；“一条”符合汉语对河流的常用量词。
- source_word: λαμπρὸν ὡς κρύσταλλον
  choice: 光亮如水晶
  rationale: λαμπρός主要表示明亮、闪耀，而非单纯透明；“如水晶”准确保留 ὡς 引出的明喻。
- source_word: ἐκπορευόμενον
  choice: 流出
  rationale: 该分词修饰“河”，在此用“流出”自然呈现河水由源头涌流的动态。
- source_word: ἐκ τοῦ θρόνου τοῦ θεοῦ καὶ τοῦ ἀρνίου
  choice: 从上帝和羔羊的宝座
  rationale: 按原文保留单数“宝座”和并列的两个属格，不增添原文没有的解释。
theological_decisions:
- issue: 上帝与羔羊共有宝座的异象
  choice: 上帝和羔羊的宝座
  alternative: 上帝的宝座和羔羊的宝座
  rationale: 希腊文“宝座”为单数，后接“上帝”和“羔羊”两个并列属格。译文保留这一结构及其神学张力，不改成复数，也不额外说明二者如何共有宝座。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。“生命之水”保留启示文学和圣经互文中的核心意象；句式尽量贴近原文的连续视觉描写，同时避免生硬直译。
