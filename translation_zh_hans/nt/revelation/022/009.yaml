  text: καὶ λέγει μοι· Ὅρα μή· σύνδουλός σού εἰμι καὶ τῶν ἀδελφῶν σου τῶν προφητῶν καὶ τῶν τηρούντων τοὺς λόγους τοῦ βιβλίου τούτου· τῷ θεῷ προσκύνησον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/009.yaml
  text: And he says to me[a], “Do not do that! I am a fellow slave with you and with your brothers the prophets, and with those who keep the words of this book[c][b]. Worship God.”
translation:
  language: zh_hans
  text: 他对我说：“千万不可！[b]我是你的同作奴仆，也与你那些作先知的弟兄和那些持守这书中的话语的人同作奴仆。[a]要敬拜上帝！”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “同作奴仆”也可译作“同作仆人”。希腊词强调他们同属一位主人；这里表明天使和约翰一样都在上帝权下，因此不应受敬拜。
    reason: lexical_alternative
  - marker: b
    text: 希腊原文的禁令很简略，直译近似“当心，不可”；意思是“不可这样做”，所指的是约翰企图敬拜天使。
    reason: lexical_alternative
  - marker: c
    text: 参见《启示录》19:10，天使在那里也作出同样的纠正：“要敬拜上帝。”
    reason: cross_reference
lexical_decisions:
- source_word: Ὅρα μή
  choice: 千万不可！
  rationale: 这是针对约翰俯伏敬拜天使之举的简短而强烈的禁止语。中文用“千万不可”既保留突兀的警告语气，也不必重复上下文已清楚表明的动作。
- source_word: σύνδουλός
  choice: 同是奴仆
  rationale: 该词表示同属一位主人的奴仆身份。这里天使借此表明自己和约翰等人一样都在上帝权下，不能接受敬拜；“同是奴仆”比“同作仆人”更明确保留这种隶属关系。
- source_word: ἀδελφῶν σου τῶν προφητῶν
  choice: 你的弟兄——众先知
  rationale: “众先知”最自然地作为“你的弟兄”的同位说明。破折号既呈现这种关系，也避免把两者误读为彼此无关的两组人。
- source_word: τηρούντων
  choice: 持守
  rationale: τηρέω在这里兼有谨守、遵行并忠于书中话语之意。“持守”保留这一较宽的语义范围，不把含义缩窄为单纯保管或仅仅服从。
- source_word: τοὺς λόγους τοῦ βιβλίου τούτου
  choice: 这书上话语
  rationale: 直译并自然表达书中所载的言语内容，同时与《启示录》中反复出现的“话语”用词保持联系。
- source_word: τῷ θεῷ προσκύνησον
  choice: 要敬拜上帝
  rationale: προσκυνέω在此指宗教性的俯伏敬拜；命令把敬拜从天使明确转向上帝。
theological_decisions:
- issue: σύνδουλος所表达的身份
  choice: 译为“同是奴仆”
  alternative: 同作仆人
  rationale: 本节的论证依赖天使与约翰同受上帝支配的身份。“奴仆”保留该词所含的隶属地位，并突出天使不是敬拜对象。
- issue: Ὅρα μή省略的动作
  choice: 译为“千万不可！”而不明说“不可这样做”
  alternative: 不要这样做！
  rationale: 原文的禁令简短且有所省略，上文已明确约翰正要敬拜天使。“千万不可”在自然中文中保留这种省略与强烈语气。
- issue: “你的弟兄”与“众先知”的关系
  choice: 以破折号将“众先知”作为同位说明
  alternative: 你的弟兄和众先知
  rationale: 原文第二个带冠词的属格短语最自然地进一步说明“你的弟兄”。采用同位结构可避免无根据地把他们拆成两个群体，同时不添加超出原文的身份解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“千万不可”传达天使立即制止约翰的强烈语气；句中以破折号清楚呈现“众先知”对“你的弟兄”的同位说明。保留“奴仆”的身份力度及“持守”的宽广含义，不弱化经文中敬拜唯独归于上帝的对比。
