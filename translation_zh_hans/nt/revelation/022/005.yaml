  rationale: 修订仅处理两项安全且必要的问题：以“和”对应原文并列的两个光源，并更正脚注b对αἰῶνας的字面说明。“照耀”保留φωτίσει ἐπ’ αὐτούς的向人照射之光的形象。其余译法维持原稿的现代、庄重表达及原文的未来异象语境。
