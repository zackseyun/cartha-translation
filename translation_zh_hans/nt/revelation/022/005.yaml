id: REV.22.5
reference: Revelation 22:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ νὺξ οὐκ ἔσται ⸀ἔτι, καὶ ⸂οὐκ ἔχουσιν χρείαν⸃ ⸀φωτὸς λύχνου καὶ ⸀φῶς ἡλίου, ὅτι κύριος ὁ θεὸς φωτίσει ⸀ἐπ’ αὐτούς, καὶ βασιλεύσουσιν εἰς τοὺς αἰῶνας τῶν αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/005.yaml
  text: And night will be no more[a], and they will have no need of lamplight or sunlight, because the Lord God will shine on them[b], and they will reign forever and ever.
translation:
  language: zh_hans
  text: 不再有黑夜；他们也不需要灯的光和太阳的光[a]，因为主上帝要照耀他们；他们要作王，直到永永远远[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“灯的光和太阳的光”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文直译：“直到万世的万世”，是表示永无止境的惯用语。
    reason: lexical_alternative
lexical_decisions:
- source_word: νὺξ
  choice: 黑夜
  rationale: 基本义为“夜、夜晚”；在此与灯光、日光以及上帝的光照形成鲜明对照，“黑夜”自然清楚。
- source_word: οὐκ ἔσται ἔτι
  choice: 不再有
  rationale: 准确表达某事以后不复存在，简洁自然，也符合启示文学的庄严语气。
- source_word: οὐκ ἔχουσιν χρείαν
  choice: 他们也不需要
  rationale: 希腊文虽用现在时，但上下文以将来时描写终末景象；现代汉语无需明确标出时态，既可保持连贯，也不必过度解释该现在时。
- source_word: φωτὸς λύχνου καὶ φῶς ἡλίου
  choice: 灯光或日光
  rationale: 分别传达“灯的光”和“太阳的光”；中文在否定句中用“或”自然表达两者都不需要。
- source_word: κύριος ὁ θεός
  choice: 主上帝
  rationale: 直接而庄重地对应“主”和“上帝”，符合现代标准汉语的圣经语体。
- source_word: φωτίσει ἐπ’ αὐτούς
  choice: 要光照他们
  rationale: 保留光向他们照耀的意象；“光照”既准确又自然，没有把这一表达抽象化。
- source_word: βασιλεύσουσιν
  choice: 要作王
  rationale: 保留动词所含的君王性意象；相比仅译“掌权”，“作王”更直接对应“统治、为王”。
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: 直到永永远远
  rationale: 这是现代汉语中自然、庄严的永恒时长表达，同时脚注说明希腊文的字面结构。
theological_decisions:
- issue: οὐκ ἔχουσιν χρείαν在未来异象中的时间指向
  choice: 译为“他们也不需要”，不另加强制性的将来时标记
  alternative: 译为“他们也将不需要”
  rationale: 希腊文用现在时，而周围动词多为将来时。汉语“他们也不需要”在此语境中可自然指向异象所描绘的将来状态，同时保留原文时态表达的张力。
- issue: βασιλεύσουσιν的君王意象
  choice: 译为“要作王”
  alternative: 译为“要掌权”或“要统治”
  rationale: “作王”保留原动词明确的王权语义，却不进一步说明其统治对象或方式，避免加入原文未明说的神学细节。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文；以短句呈现异象的递进，并保留“黑夜—灯光、日光—上帝光照”的意象结构。
