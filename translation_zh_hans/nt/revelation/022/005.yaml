  naturalness: 整体庄重流畅，符合现代汉语圣经语体。将“光照他们”调整为“照耀他们”，更直接保留光向他们照射的具体意象；将并列光源改为“灯的光和太阳的光”，虽略正式，但与本节庄严语体协调。
