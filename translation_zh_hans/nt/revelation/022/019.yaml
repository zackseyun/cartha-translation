id: REV.22.19
reference: Revelation 22:19
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἐάν τις ἀφέλῃ ἀπὸ τῶν λόγων τοῦ βιβλίου τῆς προφητείας ταύτης, ⸀ἀφελεῖ ὁ θεὸς τὸ μέρος αὐτοῦ ἀπὸ τοῦ ξύλου τῆς ζωῆς καὶ ἐκ τῆς πόλεως τῆς ἁγίας, τῶν γεγραμμένων ἐν τῷ βιβλίῳ τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/019.yaml
  text: and if anyone takes away from the words of the book of this prophecy[a], God will take away his share from the tree of life and from the holy city, which are written in this book.
translation:
  language: zh_hans
  text: 若有人删去这预言书中的话[a]，上帝必从这书所记的生命树和圣城中，除去他的一份。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“生命册”，不作“生命树”。
    reason: textual_variant
lexical_decisions:
- source_word: ἀφέλῃ
  choice: 删去
  rationale: 表示从既有文字中除去内容；与后面的ἀφελεῖ采用同一译词，以保留原文警告中的对应关系。
- source_word: λόγων
  choice: 话
  rationale: 这里指预言的言语内容。“话”自然、庄重，也与汉语圣经语境相称。
- source_word: βιβλίου
  choice: 书
  rationale: 虽可指古代书卷，但现代汉语用“书”最自然；此处结合全句译作“这卷预言书”。
- source_word: προφητείας
  choice: 预言
  rationale: 保留作品的预言性质和原文的庄严语气，不扩译为“预言信息”。
- source_word: ἀφελεῖ
  choice: 必……删去
  rationale: 未来陈述在警告语境中译作“必”，并重复“删去”，保留行为与后果之间刻意形成的对照。
- source_word: μέρος
  choice: 所得的份
  rationale: μέρος在这里可表达获分或有份的意义；“所得的份”比单用“部分”更清楚，同时不把其具体神学机制说死。
- source_word: ξύλου τῆς ζωῆς
  choice: 生命树
  rationale: 符合《启示录》22章近处语境及固定称谓。
- source_word: πόλεως τῆς ἁγίας
  choice: 圣城
  rationale: 简洁保留定指的末世性称谓，现代中文自然。
- source_word: τῶν γεγραμμένων ἐν τῷ βιβλίῳ τούτῳ
  choice: 这些都记在这书上
  rationale: 将复数短语理解为回指“生命树”和“圣城”两项；“记在”保留完成时被动所表达的已载明状态。
theological_decisions:
- issue: “生命树”与“生命册”的文本异文
  choice: 生命树
  alternative: 生命册
  rationale: 所给SBLGNT正文为ξύλου τῆς ζωῆς（生命树），且与本章2、14节的近处语境吻合；传统中知名的“生命册”异文收入脚注。
- issue: “从生命树和圣城中删去他所得的份”的具体神学含义
  choice: 保留“所得的份”及原文的警告性表述
  alternative: 明确解释为失去救恩、继承权或名字被除去
  rationale: 原文μέρος表达份额或参与，却未在本句解释其神学机制；译文不应替作者消除这一张力。
- issue: 末尾复数分词短语的回指范围
  choice: 回指生命树和圣城两者
  alternative: 仅回指圣城，或泛指本书所记福分
  rationale: τῶν γεγραμμένων为复数，最自然地承接前面的两个并列对象；用“这些”使这一关系在中文中清楚可见。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“若有人……上帝必……”保留条件警告的严肃语气；用分号理顺较长句法，同时保持原文各成分之间的关系。
