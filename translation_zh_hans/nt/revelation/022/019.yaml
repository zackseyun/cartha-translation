  naturalness: ‘这预言书中的话’比‘这卷预言书上的话’更合现代标准汉语，也避免‘书上’带来的载体性表述。‘上帝必从这书所记的生命树和圣城中，除去他的一份’庄重、通顺，并保留原文‘从……除去其份’的句法关系。
  terminology: ‘上帝’、‘预言书’、‘生命树’、‘圣城’均合乎庄重的现代汉语圣经语体。异文脚注正确说明‘生命册’这一读法。
