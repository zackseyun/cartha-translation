revisions:
- from: 若有人删去这卷预言书上的话[a]，上帝必从生命树和圣城中删去他所得的份；这些都记在这书上。
  to: 若有人删去这预言书中的话[a]，上帝必从这书所记的生命树和圣城中，除去他的一份。
  rationale: 修订只调整中文搭配和分词短语的句法呈现：保留前后‘除去’的报应性对应，同时避免将‘份’说成被‘删去’的文字；并将‘这书所记的’明确限定生命树和圣城。未扩大该警告的神学含义，也未改变SBLGNT正文或异文说明。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:20:56Z'
