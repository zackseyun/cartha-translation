  text: ἐν μέσῳ τῆς πλατείας αὐτῆς· καὶ τοῦ ποταμοῦ ἐντεῦθεν καὶ ἐκεῖθεν ξύλον ζωῆς ποιοῦν καρποὺς δώδεκα, κατὰ μῆνα ἕκαστον ⸀ἀποδιδοῦν τὸν καρπὸν αὐτοῦ, καὶ τὰ φύλλα τοῦ ξύλου εἰς θεραπείαν τῶν ἐθνῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/002.yaml
  text: in the middle of its street[a], and on this side and on that side of the river, was the tree of life, bearing twelve fruits, yielding its fruit each month[c][b]. And the leaves of the tree are for the healing of the nations.
translation:
  language: zh_hans
  text: 在城的街道中央，又在河的这边和那边[a]，有生命树，结十二个果子[b]，每月都结出果子。树上的叶子是为医治列国。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文以单数说“生命树”，却又描绘它在河的这边和那边；译文保留这一异象式的压缩图景，并不替原文确定其空间布局。
    reason: syntactical_ambiguity
  - marker: b
    text: 原文直译为“十二个果子”。这也可能指十二种果实，或描绘完整而丰盛的结果周期。
    reason: lexical_alternative
  - marker: c
    text: 这里的图景呼应《创世记》2:9的生命树，以及《以西结书》47:12中每月结果、叶子可作医治之用的树。
    reason: cross_reference
lexical_decisions:
- source_word: ἐν μέσῳ τῆς πλατείας αὐτῆς
  choice: 在城的街道中央
  rationale: πλατεία可指宽阔的街道或广场；此处按新耶路撒冷的城市图景译作“街道”。αὐτῆς所指为城，中文补出“城的”以免误解。
- source_word: ἐντεῦθεν καὶ ἐκεῖθεν
  choice: 在河的这边和那边
  rationale: 贴近原文的分布式空间表达，不将异象中过度压缩的地理关系改写得过于明确。
- source_word: ξύλον ζωῆς
  choice: 生命树
  rationale: ξύλον在此指树；这一表达承接创世记中的生命树意象。虽无冠词，所指仍是读者熟知的生命树。
- source_word: ποιοῦν καρποὺς δώδεκα
  choice: 结十二样果子
  rationale: ποιοῦν与果子连用意为“结出”。原文直说“十二果”，中文以“十二样果子”表达可能的十二类或十二期出产，但以脚注保留直译。
- source_word: κατὰ μῆνα ἕκαστον ἀποδιδοῦν τὸν καρπὸν αὐτοῦ
  choice: 每月都结出果子
  rationale: 自然表达逐月持续出产的分配意义，也保留ἀποδιδοῦν“结出、产出”的农业语感。
- source_word: εἰς θεραπείαν τῶν ἐθνῶν
  choice: 为医治列国
  rationale: εἰς表示用途或目的；θεραπεία译为“医治”，ἐθνῶν译为末世图景中范围广泛的“列国”，不限定为外邦人。
theological_decisions:
- issue: 生命树与街道、河流之间的空间关系
  choice: 保留单数“生命树”，并依原文先后呈现它在街道中央、又在河两边的压缩图景
  alternative: 改为复数“生命树”，或重排为更容易想象的明确地理布局
  rationale: 原文用单数ξύλον，却说在河的“这边和那边”，形成有意或至少未被解释的异象张力。译文不把它改成多棵树，也不替原文解决其空间关系。
- issue: “十二果”的含义
  choice: 正文译作“十二样果子”，脚注说明也可直译为“十二个果子”
  alternative: 仅译“十二个果子”或明确译作“十二种果子”
  rationale: 上下文每月结果，可能表示十二种果实或完整丰盛的周期；正文采用自然而不过度僵硬的表达，脚注保留词面歧义。
- issue: 列国需要“医治”的末世张力
  choice: 直译为“医治列国”
  alternative: 弱化为“使列国健康”或解释为象征性的福祉
  rationale: 译文保留θεραπεία的医治语义，不预先裁定新创造中医治的具体性质。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“列国”保留启示文学和圣经互文的语体色彩；句法尽量自然，同时不消解原文奇特的空间关系。
