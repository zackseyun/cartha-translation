source:
  edition: SBLGNT
  text: Μακάριοι οἱ ⸂πλύνοντες τὰς στολὰς αὐτῶν⸃, ἵνα ἔσται ἡ ἐξουσία αὐτῶν ἐπὶ τὸ ξύλον τῆς ζωῆς καὶ τοῖς πυλῶσιν εἰσέλθωσιν εἰς τὴν πόλιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/014.yaml
  text: Blessed are those who wash their robes[c][b][a], so that they may have the right to the tree of life and may enter the city by the gates.
translation:
  language: zh_hans
  text: 那些洗自己袍子的人有福了！[a][b]好叫他们有权享用生命树，并从城门[c]进入城中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作：“遵行他诫命的人有福了”或“谨守他诫命的人有福了”，而不是“那些洗自己袍子的人有福了”。
    reason: textual_variant
  - marker: b
    text: 洗袍子的意象与《启示录》7:14相呼应；那里说，他们在羔羊的血中洗净了自己的袍子，使袍子变白。
    reason: cross_reference
  - marker: c
    text: “从城门”也可译作“穿过城门”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μακάριοι
  choice: 有福了
  rationale: 沿用祝福宣告的庄重表达，保留末世性和属灵分量；“快乐”偏重主观感受，“幸运”则容易显得只是境遇偶然。
- source_word: πλύνοντες
  choice: 洗涤
  rationale: 保留具体的洗衣意象，并以现在分词所描述的特征来指称这群人；不采用解释性更强的“洁净”。
- source_word: στολὰς
  choice: 长袍
  rationale: στολή在《启示录》的异象中指较长的袍服；“长袍”既自然，也能保持象征性的衣袍意象。
- source_word: ἵνα
  choice: 这样
  rationale: 自然连接前后的目的或结果关系，同时避免把ἵνα与将来时形式的关系限定得过死。
- source_word: ἔσται ἡ ἐξουσία αὐτῶν
  choice: 他们就有权
  rationale: 以现代汉语自然表达其将获得或拥有正当资格的意思；这里并非强调统治权或能力。
- source_word: ἐπὶ τὸ ξύλον τῆς ζωῆς
  choice: 取用生命树
  rationale: 与ἐξουσία连用时表示对生命树的正当接近和享用资格。“取用”比“管辖”更符合语境，同时不在正文中额外补出“果子”。
- source_word: τοῖς πυλῶσιν
  choice: 由城门
  rationale: 将无介词与格理解为进入的途径或方式；“由城门”简洁地表达经由城门进入。
- source_word: εἰσέλθωσιν εἰς τὴν πόλιν
  choice: 进入城中
  rationale: 准确、自然地表达进入这座城，语体庄重而不古奥。
theological_decisions:
- issue: 首句的抄本文本差异
  choice: 正文采用SBLGNT的“洗涤自己长袍的人”。
  alternative: “遵行他诫命的人”或“谨守他诫命的人”。
  rationale: 所给希腊文本是πλύνοντες τὰς στολὰς αὐτῶν。正文据此翻译，并在脚注保留重要且影响传统译本的异文。
- issue: 洗涤长袍与获得生命树资格之间的关系
  choice: 保留经文所陈述的联系，不进一步说明其教义机制。
  alternative: 把洗涤明确解释为赚取资格的功德行为，或在正文中直接补明长袍是在羔羊的血中洗净。
  rationale: 本节说明这群人有权取用生命树并进入圣城，却未在本句中详述洗涤如何发生；译文不应替经文消除这一神学张力。
- issue: ἐξουσία在本节中的含义
  choice: 译为“有权”，表示正当的资格或获准取用。
  alternative: 译为“有权柄管辖”或“有能力接近”。
  rationale: 上下文谈的是获准接近生命树和进入圣城，并非对生命树施行统治，也不只是具备能力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“有福了”保留祝福宣告的经文语体；“洗涤”“长袍”“取用”“进入城中”清楚自然，不使用生僻古语。所有脚注标记均置于正文相应位置。
