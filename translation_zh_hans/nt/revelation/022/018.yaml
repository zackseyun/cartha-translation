source:
  edition: SBLGNT
  text: Μαρτυρῶ ἐγὼ παντὶ τῷ ἀκούοντι τοὺς λόγους τῆς προφητείας τοῦ βιβλίου τούτου· ἐάν τις ἐπιθῇ ἐπ’ αὐτά, ⸀ἐπιθήσει ὁ θεὸς ἐπ’ αὐτὸν τὰς πληγὰς τὰς γεγραμμένας ἐν τῷ βιβλίῳ τούτῳ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/018.yaml
  text: 'I testify to everyone who hears the words of the prophecy of this book: if anyone adds to them[b][a], God will add to him the plagues that are written in this book.'
translation:
  language: zh_hans
  text: 我向一切听见这书上预言的话的人郑重作证[a]：若有人给这些话加添什么，神必把写在这书[b]上的灾害加在他身上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “作证”也可译作“见证”；原文是郑重的见证用语，并不只是一般性的“警告”。
    reason: lexical_alternative
  - marker: b
    text: “书”也可译作“书卷”，反映这部作品在古代可能采用的实体形态。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μαρτυρῶ
  choice: 郑重作证
  rationale: 保留 μαρτυρέω 的见证、作证意味，并以“郑重”体现此处严肃的宣告语气，而不把它简化为“警告”。
- source_word: παντὶ τῷ ἀκούοντι
  choice: 向一切听见……的人
  rationale: 自然表达与格分词结构；“听见”既保留听觉行为，也符合本书面向听众宣读的语境。
- source_word: τοὺς λόγους τῆς προφητείας
  choice: 预言之话
  rationale: 保留 λόγοι 的复数及 προφητεία 的先知性类别；“预言”在这里不应缩减为单纯对未来的预测。
- source_word: τοῦ βιβλίου τούτου
  choice: 这书上
  rationale: βιβλίον 在古代可指书卷，正文采用现代汉语更自然的“书”；“上”符合中文指称书中所载内容的习惯。
- source_word: ἐάν τις ἐπιθῇ ἐπ’ αὐτά
  choice: 若有人在这些话上加添什么
  rationale: ἐπιτίθημι 在此表示增添；补出“什么”使现代汉语完整自然，“这些话”明确复数代词的所指。
- source_word: ἐπιθήσει ὁ θεὸς ἐπ’ αὐτὸν
  choice: 神必把……加在他身上
  rationale: 重复使用“加”以保留原文同一动词形成的修辞对应：人若加添，神也必加在他身上。
- source_word: τὰς πληγὰς
  choice: 灾祸
  rationale: πληγή 在《启示录》中指神审判所降的灾害；“灾祸”比现代汉语中的“瘟疫”涵盖面更广，也能涵盖书中各样灾难。
- source_word: τὰς γεγραμμένας ἐν τῷ βιβλίῳ τούτῳ
  choice: 这书上所记的
  rationale: 表达完成时被动分词所含的“已经写下并仍载于其中”之意，同时保持中文简洁。
theological_decisions:
- issue: 开头是作证还是直接警告
  choice: 译作“郑重作证”
  alternative: “警告”或“我警告”
  rationale: 希腊文使用见证语言；后面的条件句自然显明警告作用，不必在动词中提前加入解释。
- issue: “加添”的对象范围
  choice: 依语法译为“在这些话上加添什么”
  alternative: 泛化为对整本圣经增添内容
  rationale: αὐτά 就近回指“这书上预言之话”。译文保留原句明确所指，不把适用范围作超出本节语法的教义性扩展。
- issue: 神回应中的词语对应
  choice: 保留“加添／加在”之间的对应
  alternative: 后句意译为“降下”或“施加”灾祸
  rationale: 原文两次使用 ἐπιτίθημι，形成与行为相应的审判措辞；中文即使略显庄重，也值得保留这一修辞张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“郑重作证”保存司法性和见证性的语气；“预言之话”略带经文体庄重感，但仍为普通读者所理解。脚注标记均置于正文中，且避免把本节的直接所指扩展为未由原文明确表达的教义命题。
