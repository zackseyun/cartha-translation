  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ἐγὼ Ἰησοῦς ἔπεμψα τὸν ἄγγελόν μου μαρτυρῆσαι ὑμῖν ταῦτα ἐπὶ ταῖς ἐκκλησίαις. ἐγώ εἰμι ἡ ῥίζα καὶ τὸ γένος Δαυίδ, ὁ ἀστὴρ ὁ λαμπρός, ὁ πρωϊνός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/016.yaml
  text: I[a], Jesus, have sent my angel to testify to you these things for the churches[b]. I am the root and the descendant of David, the bright morning star.
translation:
  language: zh_hans
  text: “我，耶稣，差遣了我的天使，向你们见证这些事，为众教会[a]。我是大卫的根，也是大卫的后裔[b]；我是明亮的晨星。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在众教会中向你们见证这些事”，也可理解为“向你们见证有关众教会的这些事”。希腊语短语 ἐπὶ ταῖς ἐκκλησίαις 可有不止一种语义侧重。
    reason: 介词短语存在真实的词义与句法歧义。
  - marker: b
    text: 或译：“大卫的子孙”。
    reason: γένος 可用不同的亲属或家系用语表达。
lexical_decisions:
- source_word: Ἐγὼ Ἰησοῦς
  choice: 我耶稣
  rationale: 显明带强调意味的自我表明，同时按现代汉语习惯自然表达；不补入原文没有的系词。
- source_word: ἔπεμψα
  choice: 差遣了
  rationale: 不定过去时表示已经完成的差遣行动；“差遣”也保留受托执行使命的语气。
- source_word: τὸν ἄγγελόν μου
  choice: 我的天使
  rationale: 《启示录》的异象语境明确倾向于超自然的天使，而不是一般的人间使者。
- source_word: μαρτυρῆσαι ὑμῖν ταῦτα
  choice: 向你们见证这些事
  rationale: 保留目的不定式、复数受事者和复数指示词，也保留 μαρτυρέω 的作证意味。
- source_word: ἐπὶ ταῖς ἐκκλησίαις
  choice: 为众教会
  rationale: 在不把介词短语局限为地点的前提下，表达这见证以众教会为对象和用途；其他可能语义置于脚注。
- source_word: ἡ ῥίζα
  choice: 大卫的根
  rationale: 直译“根”的意象，不将其解释性改写为“源头”，从而保留称号的象征张力。
- source_word: τὸ γένος Δαυίδ
  choice: 大卫的后裔
  rationale: γένος 在此指家系或出身；“后裔”是现代汉语中清楚而庄重的表达。
- source_word: ὁ ἀστὴρ ὁ λαμπρός, ὁ πρωϊνός
  choice: 明亮的晨星
  rationale: 将希腊文并列叠加的限定语按自然汉语组合，完整保留“明亮”和“晨星”两个意象。
theological_decisions:
- issue: 弥赛亚与大卫的双重关系
  choice: 我是大卫的根，也是大卫的后裔
  alternative: 我是大卫的源头，也是他的子孙
  rationale: 原文同时称耶稣为大卫的“根”和“后裔”，形成既先于大卫又出自大卫的张力；译文不加解释，也不消解这层张力。
- issue: “晨星”作为基督的自称
  choice: 我是明亮的晨星
  alternative: 我是那颗明亮的早晨之星
  rationale: 保留原文直接的自我称谓及其鲜明意象，不引入本节以外的教义阐释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“众教会”简洁表达复数；后半句重复“大卫的”，既避免代词指向含混，也清楚呈现“根”与“后裔”这两个并列称号。
