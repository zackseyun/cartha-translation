id: REV.22.10
reference: Revelation 22:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ λέγει μοι· Μὴ σφραγίσῃς τοὺς λόγους τῆς προφητείας τοῦ βιβλίου τούτου, ὁ καιρὸς γὰρ ἐγγύς ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/010.yaml
  text: And he says to me[a], “Do not seal up the words of the prophecy of this book[c][b], for the time is near.”
translation:
  language: zh_hans
  text: 他对我说：“不要封住[a]这书上预言的话[c]，因为时候近了[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “封住”也可译作“封闭”或“秘藏”；这里沿用先知文学中启示是否被封闭、不予公开的说法。
    reason: lexical_alternative
  - marker: b
    text: “时候”也可译作“指定的时刻”。希腊文 καιρός 可指关键或预定的时刻。
    reason: lexical_alternative
  - marker: c
    text: 参但以理书12:4；那里吩咐要把预言封住，这里的命令正好相反。
    reason: cross_reference
lexical_decisions:
- source_word: λέγει μοι
  choice: 他又对我说
  rationale: 希腊文用叙事现在时，启示录中常见；现代汉语叙事通常自然地用“说”。加“又”承接上文连续的发言，不改变说话内容。
- source_word: Μὴ σφραγίσῃς
  choice: 不要封住
  rationale: 保留“盖印、封闭”的具体意象，同时在中文中表达不可将启示封闭起来、不予公开的语境含义。
- source_word: τοὺς λόγους
  choice: 话
  rationale: 对应复数 λόγους；中文“预言的话”自然且比抽象化为“信息”更贴近原文。
- source_word: τῆς προφητείας τοῦ βιβλίου τούτου
  choice: 这卷书中预言的话
  rationale: 以自然中文表达原文连续属格关系，同时保留“这卷书”和“预言”两个成分；“卷”也契合古代书卷背景，但不强制译成物质形态更明确的“卷轴”。
- source_word: ὁ καιρὸς
  choice: 那时候
  rationale: καιρός 可指关键、特定或指定的时刻；“那时候”在本句中既自然，又不把“指定”的语义明说得过满。
- source_word: ἐγγύς ἐστιν
  choice: 近了
  rationale: 直接保留临近性陈述，不将其改释为具体末世时间表；“近了”是清楚、自然的现代汉语。
theological_decisions:
- issue: 启示文学中的临近性表述
  choice: 因为那时候近了
  alternative: 因为指定的时刻近了；因为时候就在眼前
  rationale: 原文宣告 καιρός 临近，却没有说明详细时间表。正文保留这一张力，不淡化，也不作教义性展开。
- issue: 与但以理书封闭预言命令的关系
  choice: 不要封住
  alternative: 不要秘藏；不要使其保密
  rationale: 保留“封”的先知文学意象，使与但以理书12:4相反的命令可被读者辨认，同时不在正文中额外解释其神学意义。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“封住”保留原文意象；“这卷书中预言的话”避免生硬复制希腊文双重属格。“那时候近了”保持末世临近性的开放张力。
