source:
  edition: SBLGNT
  text: μνημόνευε οὖν πόθεν ⸀πέπτωκας, καὶ μετανόησον καὶ τὰ πρῶτα ἔργα ποίησον· εἰ δὲ μή, ἔρχομαί ⸀σοι, καὶ κινήσω τὴν λυχνίαν σου ἐκ τοῦ τόπου αὐτῆς, ἐὰν μὴ μετανοήσῃς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/005.yaml
  text: Therefore remember from where you have fallen[a], and repent, and do the works you did at first. But if not, I am coming to you, and I will remove your lampstand from its place[b], unless you repent.
translation:
  language: zh_hans
  text: 所以，要记住你是从哪里坠落的[a]；要悔改，并做起初所做的事。若不这样，我就要到你那里去，把你的灯台从原处移走[b]，除非你悔改。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“要记住你是从怎样的高处坠落的。”希腊文直译是“从哪里坠落的”；有人认为这里暗含从高处坠落的比喻。
    reason: lexical_alternative
  - marker: b
    text: “灯台”在启示录1:20中用来代表教会。
    reason: cross_reference
lexical_decisions:
- source_word: μνημόνευε
  choice: 要记住
  rationale: 现在时命令语气可含持续记念之意；“要记住”在现代汉语中自然，也保留命令的力度。
- source_word: οὖν
  choice: 所以
  rationale: 承接上文责备并引出结论；“所以”清楚而自然地表达推论关系。
- source_word: πόθεν πέπτωκας
  choice: 你是从哪里坠落的
  rationale: 直译“从哪里”，不把隐含的高度意象直接写入正文；“坠落”保留空间隐喻，而完成时所表达的既成状态由汉语语境体现。
- source_word: μετανόησον
  choice: 要悔改
  rationale: “悔改”是道德与属灵语境中准确、通行的表达，兼有内在转变与回转之意。
- source_word: τὰ πρῶτα ἔργα ποίησον
  choice: 做起初所做的事
  rationale: 表达他们先前阶段所行之事，既保留“起初”的时间意义，也符合现代汉语习惯。
- source_word: εἰ δὲ μή
  choice: 不然
  rationale: 简洁表达否定条件及警告，承接前面的命令自然有力。
- source_word: ἔρχομαί σοι
  choice: 我就要到你那里来
  rationale: 保留原文生动迫近的现在时表达；不添加原文没有明说的“攻击你”。
- source_word: κινήσω
  choice: 移走
  rationale: κινέω本义为移动，结合“从原处”在审判语境中表示移离其位置；“移走”兼顾字面意象与实际结果。
- source_word: τὴν λυχνίαν σου
  choice: 你的灯台
  rationale: λυχνία指承放灯的灯台而非灯本身；保留《启示录》中的具体象征意象。
- source_word: ἐκ τοῦ τόπου αὐτῆς
  choice: 从原处
  rationale: 自然表达“从它所在的位置移开”；“原处”简洁保留位置意义。
theological_decisions:
- issue: 移走灯台这一警告的性质
  choice: 保留“把你的灯台从原处移走”的象征画面，不在正文中解释为某一种系统神学结论。
  alternative: 可解释为教会失去见证、教会的存在或地位受到审判，或个人失去救恩。
  rationale: 启示录1:20将灯台解释为教会，但本节没有明确界定这一警告对个人救恩或教会见证的全部神学含义，因此应保留原文的张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。以分号区分命令、条件与警告，使句法清楚；保留“坠落”和“灯台”的原文意象，不作过度解释。
