id: REV.2.16
reference: Revelation 2:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: μετανόησον οὖν· εἰ δὲ μή, ἔρχομαί σοι ταχύ, καὶ πολεμήσω μετ’ αὐτῶν ἐν τῇ ῥομφαίᾳ τοῦ στόματός μου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/016.yaml
  text: Therefore repent[a]. But if not, I am coming to you quickly[b], and I will make war against them with the sword of my mouth.
translation:
  language: zh_hans
  text: 所以，你要悔改！否则，我很快就要到你那里来，并要用我口中的剑，与他们争战[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “与他们争战”意为以他们为敌、同他们作战，并非与他们并肩作战。
    reason: lexical_alternative
  - marker: b
    text: “我口中的剑”是启示文学的意象，表示基督施行审判的话语或判决。
    reason: cross_reference
lexical_decisions:
- source_word: μετανόησον
  choice: 你要悔改
  rationale: 这是简洁有力的命令，表达一次明确、决断性的回转；“悔改”也保留了原文的道德与属灵分量。
- source_word: οὖν
  choice: 所以
  rationale: 承接上文的责备并引出结论，现代汉语自然清楚，同时保留原文的推论关系。
- source_word: εἰ δὲ μή
  choice: 否则
  rationale: 凝练表达带有转折意味的条件警告，语气明确而庄重。
- source_word: ἔρχομαί σοι
  choice: 我……就要到你那里来
  rationale: 保留单数对象“你”所指向的教会整体，并以“就要”传达现在时形式在警告中的迫近感；不预先把“到你那里”解释成“攻击你”。
- source_word: ταχύ
  choice: 很快
  rationale: 既可表达时间上的临近，也可含行动迅速之意，不把原文限定为单一层面。
- source_word: πολεμήσω
  choice: 争战
  rationale: 保留强烈的军事和审判色彩，比一般的“对抗”更贴近原文。
- source_word: μετ’ αὐτῶν
  choice: 与他们
  rationale: 在“争战”之后，“与他们争战”在现代汉语中自然表示以他们为敌，同时较贴近介词短语的形式。
- source_word: ἐν τῇ ῥομφαίᾳ
  choice: 用……剑
  rationale: 清楚表达工具或手段意义，并保留原文的刀剑意象。
- source_word: ῥομφαίᾳ
  choice: 剑
  rationale: 原词可指大型刀剑，但此处译作“剑”自然、庄重，也避免加入原文未着重说明的形制细节。
- source_word: τοῦ στόματός μου
  choice: 我口中的
  rationale: 以自然现代汉语保留这把剑与基督之口相连的启示文学意象，而不将其直接释义为“我的话”。
theological_decisions:
- issue: 基督警告中的整体对象与具体争战对象
  choice: 保留“到你那里来”与“同他们争战”的区别
  alternative: 把基督的来临直接译成针对全教会的攻击，或把来临仅限于假教师
  rationale: 原文先以单数“你”面对教会整体，随后以复数“他们”指出争战对象。译文保留两者之间的张力，不进一步裁定其教会论含义。
- issue: 审判工具的启示文学意象
  choice: 保留“我口中的剑”
  alternative: 释义为“我的话”或“我话语的能力”
  rationale: 原文使用鲜明的启示文学图像；保留比喻可避免削弱其文学力度与审判意味。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你要悔改”保持命令的直接性；“否则”使警告紧凑有力；“很快就要到你那里来”兼顾迫近与迅速两种可能意味。标点突出劝诫与警告之间的转折。
