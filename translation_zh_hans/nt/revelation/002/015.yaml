base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/015.yaml
  text: So you also have those who hold to the teaching of the Nicolaitans likewise[a].
translation:
  language: zh_hans
  text: 照样，你那里也有些人同样[a]持守尼哥拉一党人的教导。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “同样”可理解为概括全句，使本句与上一节所说的情形相对应；也可较直接修饰“持守”，指这些人以与上一节所说的人相似的方式持守这种教导。
    reason: 保留ὁμοίως在句中所修饰范围的歧义。
lexical_decisions:
- source_word: οὕτως
  choice: 照样
  rationale: 承接上一节并引出类比；“照样”自然地保留“如此、以这种方式”的比较意味。
- source_word: ἔχεις
  choice: 你那里有人
  rationale: 原义是“你有”；按此处对教会说话的语境，译为“你那里有人”更符合现代汉语，同时保留直接责备的语气。
- source_word: καὶ σὺ
  choice: 你那里也
  rationale: καί与强调代词σύ表明别迦摩教会也有这样的人；“也”保留了强调和比较。
- source_word: κρατοῦντας
  choice: 持守
  rationale: 表示坚持、紧守某种教导；“持守”简洁而庄重，也与本章相关用语协调。
- source_word: διδαχὴν
  choice: 教导
  rationale: 准确表达所教导的内容，比“教义”更贴近日常现代汉语，也不过度加入宗派色彩。
- source_word: Νικολαϊτῶν
  choice: 尼哥拉一党人
  rationale: 采用中文圣经传统中易辨识的音译，并用“一党人”表明这是一个群体名称。
- source_word: ὁμοίως
  choice: 照样（并以脚注说明句法位置）
  rationale: 该副词可表达“同样、以相似方式”，既可能概括整句与上一节的对应，也可能较直接地修饰这些人持守教导的方式。正文用句首“照样”保持自然，脚注保留另一种连接方式。
theological_decisions:
- issue: ὁμοίως与本句及上一节的关系
  choice: 在正文以句首“照样”表达整句与上一节的对应
  alternative: 译为“你那里也有人同样持守尼哥拉一党人的教导”或把“同样”置于句末
  rationale: 希腊语容许该词概括整句与上一节作比较，也可能更直接说明“持守”的方式。正文采用自然汉语次序，脚注提示另一种理解，不把句法歧义化解为单一解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你那里有人”符合对教会群体说话的语境；“持守”保留原文坚持某种教导的力度。
