  text: Καὶ τῷ ἀγγέλῳ τῆς ἐν Περγάμῳ ἐκκλησίας γράψον· Τάδε λέγει ὁ ἔχων τὴν ῥομφαίαν τὴν δίστομον τὴν ὀξεῖαν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/012.yaml
  text: 'And to the angel of the church in Pergamum write: These things says the one who has the sharp, double-edged sword:[a]'
translation:
  language: zh_hans
  text: 你要写信给别迦摩教会的天使[a]：那位持有锋利双刃剑的这样说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使者”。这里所指的是天上的存在，还是教会在人间的代表，解释者看法不一。
    reason: 保留ἀγγέλῳ可指“天使”或“使者”的词义范围，以及经文本身未解决的所指歧义。
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: 使者
  rationale: ἄγγελος既可指天使，也可指传信者；汉语“使者”保留词义及所指对象的开放性，并以脚注说明“天使”这一常见译法。
- source_word: ἐκκλησίας
  choice: 教会
  rationale: 在启示录写给基督徒群体的语境中，“教会”是现代汉语最自然、明确的对应词。
- source_word: γράψον
  choice: 你要写信
  rationale: 以命令式“你要写”表达不定过去时命令语气；补出“信”符合汉语书信语境，后文则给出信的内容。
- source_word: Τάδε λέγει
  choice: 这样说
  rationale: 这是先知性、权威性宣告的固定引语格式；“这样说”自然而庄重，并可在启示录二至三章中保持一致。
- source_word: ὁ ἔχων
  choice: 那位有……的
  rationale: 保留带冠词分词结构的称号性质，同时符合现代汉语表达。
- source_word: ῥομφαίαν
  choice: 剑
  rationale: 该词可指较大或沉重的剑，但本节未要求进一步确定剑的具体形制；译作“剑”可避免过度具体化。
- source_word: δίστομον
  choice: 双刃
  rationale: 该词字面为“两口的”，用于剑时即两边开刃；“双刃”准确、简洁且符合现代汉语。
- source_word: ὀξεῖαν
  choice: 锋利
  rationale: 直接表达剑刃锐利的性质，语义明确而自然。
- source_word: Περγάμῳ
  choice: 别迦摩
  rationale: 采用现代简体中文圣经语境中广为人知的传统地名译法。
theological_decisions:
- issue: 教会“使者”的身份
  choice: 正文译作“使者”，不确定其为天上存在还是教会的人间代表
  alternative: 译作“天使”，或具体解释为教会领袖
  rationale: 希腊文ἄγγελος本身容许“天使”和“传信者／使者”两类理解，本节并未解决其身份；正文与脚注共同保留这一神学和释义上的张力。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。以“你要写信给……”顺应汉语语序；“那位有锋利双刃剑的”保留原文称号式结构和“锋利”“双刃”两个修饰语。引号在本节末暂不闭合，因为宣告内容延续至后文。
