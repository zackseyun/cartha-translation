  text: Οἶδά σου τὰ ἔργα, καὶ τὴν ⸂ἀγάπην καὶ τὴν πίστιν⸃ καὶ τὴν διακονίαν καὶ τὴν ὑπομονήν σου, καὶ τὰ ἔργα σου τὰ ἔσχατα πλείονα τῶν πρώτων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/019.yaml
  text: I know your works[a], your love and faith and service and endurance, and that your last works are more than the first.
translation:
  language: zh_hans
  text: 我知道你的行为、爱心、信心[a]、服事和忍耐，也知道你后来所做的事比先前更多。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“忠信”。这里的希腊词既可指信心，也可指忠信。
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἶδά
  choice: 我知道
  rationale: οἶδα在此具有现在时的状态意义；“我知道”自然体现《启示录》写给各教会时反复使用的宣告句式。
- source_word: ἔργα
  choice: 行为
  rationale: ἔργα指可观察的行动或所做之事；“行为”在现代中文中自然，并在本节两处保持同词复现。
- source_word: ἀγάπην
  choice: 爱心
  rationale: ἀγάπη在此列举基督徒群体的品格；“爱心”既通俗又能表达付诸行动的爱。
- source_word: πίστιν
  choice: 信心
  rationale: πίστις可指信或忠信；正文采用常见的“信心”，并以脚注保留“忠信”这一语境上可能的含义。
- source_word: διακονίαν
  choice: 服事
  rationale: διακονία指为他人所作的实际服务；“服事”适合教会语境，却不暗示正式职分。
- source_word: ὑπομονήν
  choice: 忍耐
  rationale: ὑπομονή表示在压力下坚定持守、忍耐到底；“忍耐”简洁且符合《启示录》的语境。
- source_word: τὰ ἔργα σου τὰ ἔσχατα
  choice: 你后来的行为
  rationale: ἔσχατα在与πρώτων对照时具有时间上的比较意义；“后来的”比字面的“最后的”更自然，也不误示这些行为已经终结。
- source_word: πλείονα τῶν πρώτων
  choice: 比先前的更多
  rationale: πλείονα表示数量或程度上的更多；此译保留比较表达及其可能涵盖数量和程度的开放性。
theological_decisions:
- issue: 德目列表中πίστις的含义
  choice: 信心
  alternative: 忠信
  rationale: 该词既可能指对上帝或基督的信，也可能指在行为上表现出的忠信。正文采用惯常译法“信心”，脚注保留另一可能，避免消除原文的词义张力。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。以“行为”复现两处ἔργα；末句使用“后来／先前”的清楚对照，同时避免把比较范围过度限定为数量、质量或价值。
