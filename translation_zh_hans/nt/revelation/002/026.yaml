  text: καὶ ὁ νικῶν καὶ ὁ τηρῶν ἄχρι τέλους τὰ ἔργα μου, δώσω αὐτῷ ἐξουσίαν ἐπὶ τῶν ἐθνῶν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/026.yaml
  text: And to the one who conquers and keeps my works until the end[a], I will give authority over the nations[c][b],
translation:
  language: zh_hans
  text: 那得胜、又持守我的作为直到末了的人[a]，我要赐给他辖管列国的权柄[c]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “得胜的人”也可译作“战胜的人”。
    reason: lexical_alternative
  - marker: c
    text: 希腊文使用阳性单数形式（“那……的人；我要赐给他”），这里是代表性的说法，并非只指男性。
    reason: cultural_note
lexical_decisions:
- source_word: ὁ νικῶν
  choice: 那得胜者
  rationale: 带冠词的现在分词作名词用，指以持续得胜为特征的人。“得胜”保留《启示录》中争战与胜利的意象，也符合现代中文圣经语体。
- source_word: ὁ τηρῶν
  choice: 持守
  rationale: τηρέω可指持守、遵守或守护；“持守”既表达忠心坚持，也不把含义限定为单纯服从命令。
- source_word: ἄχρι τέλους
  choice: 直到末了
  rationale: 保留原文的时间延续性，表示持续到终点；措辞庄重而易懂。
- source_word: τὰ ἔργα μου
  choice: 我的作为
  rationale: 原文直译为“我的作为/工作”，所属关系并未具体说明。“我的作为”保留其可能指属于耶稣、符合耶稣或由耶稣所要求之事的开放性。
- source_word: δώσω αὐτῷ
  choice: 我要赐给他
  rationale: 忠实呈现将来时和阳性单数代词；“赐给”自然表达说话者授予权柄的语境。
- source_word: ἐξουσίαν
  choice: 权柄
  rationale: ἐξουσία在此表示获授的统治权或合法权限；“权柄”比泛指能力的“力量”更准确。
- source_word: ἐπὶ τῶν ἐθνῶν
  choice: 辖管列国
  rationale: ἐπί加属格在此具有居于其上、施行统治之意；“列国”指世上的各国或各族，而非专指与犹太人相对的外邦人。
theological_decisions:
- issue: 阳性单数的代表性用法
  choice: 正文保留单数代词“他”
  alternative: 译为“这人”或省略代词
  rationale: 希腊文以阳性单数分词和代词指称得胜者。中文“他”在此承接单数语法形式，但属于代表性用法，并不排除女性。
- issue: “我的作为”的所属关系
  choice: 保留“我的作为”
  alternative: 译为“我所吩咐的事”或“为我所做的事”
  rationale: 原文没有明确限定这些作为究竟是耶稣自己的作为、他所要求的行为，还是与他旨意相符的行为；保留较直译的表达可避免加入狭窄的神学解释。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“那得胜者，就是……”用同位说明呈现两个带冠词分词共同指向同一人的结构；“辖管列国的权柄”以自然中文表达“在列国之上的权柄”。保留句末逗号，以反映本节在原文中与下一节语法和内容相连。
