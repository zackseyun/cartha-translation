source:
  edition: SBLGNT
  text: Οἶδα τὰ ἔργα σου, καὶ τὸν ⸀κόπον καὶ τὴν ὑπομονήν σου, καὶ ὅτι οὐ δύνῃ βαστάσαι κακούς, καὶ ἐπείρασας τοὺς λέγοντας ἑαυτοὺς ⸀ἀποστόλους, καὶ οὐκ εἰσίν, καὶ εὗρες αὐτοὺς ψευδεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/002.yaml
  text: I know your works[a], your labor, and your endurance, and that you cannot tolerate evil people. You tested those who call themselves apostles and are not[b], and you found them to be false.
translation:
  language: zh_hans
  text: 我知道你所做的事、你的劳苦和忍耐，也知道你不能容忍恶人[a]。那些自称为使徒[b]、其实并不是使徒的人，你考验过他们，并且发现他们是虚假的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“不能承受恶人”；这里是“不肯容忍恶人”的意思。
    reason: 词义选择
  - marker: b
    text: 或译“声称自己是使徒”。
    reason: 表达方式
lexical_decisions:
- source_word: Οἶδα
  choice: 我知道
  rationale: 按现在状态表达基督对教会的认识；“我知道”直接、自然，并保留亲自鉴察和评价的语气。
- source_word: τὰ ἔργα σου
  choice: 你所做的事
  rationale: ἔργα泛指行为和活动；此译比单用“工作”更能涵盖其宽泛意义，也符合现代汉语。
- source_word: τὸν κόπον
  choice: 劳苦
  rationale: κόπος指付出艰辛、令人疲惫的劳作；“劳苦”兼顾辛劳与郑重语体。
- source_word: τὴν ὑπομονήν σου
  choice: 你的忍耐
  rationale: ὑπομονή表示在压力中坚忍持守；“忍耐”简洁自然，同时保留其持续承受的含义。
- source_word: οὐ δύνῃ βαστάσαι
  choice: 你不能容忍
  rationale: 字面是“你不能承受”，在这里指拒绝容许恶人在群体中不受制止；“不能容忍”准确传达语境中的惯用义。
- source_word: κακούς
  choice: 恶人
  rationale: 阳性复数形容词在此作名词，指邪恶的人；“恶人”简洁且不把语法性别误作仅指男性。
- source_word: ἐπείρασας
  choice: 你考验过
  rationale: πειράζω在此指检验使徒身份的声称；“考验”保留测试真伪的含义。
- source_word: λέγοντας ἑαυτοὺς ἀποστόλους
  choice: 自称为使徒
  rationale: “自称”自然表达ἑαυτούς的反身意义，也清楚表明这是他们对自身身份的声称。
- source_word: ἀποστόλους
  choice: 使徒
  rationale: 此处很可能是教会语境中的特定称谓，涉及权威性身份的声称；“使徒”比泛称“使者”更切合上下文。
- source_word: ψευδεῖς
  choice: 假的
  rationale: ψευδεῖς作表语，判定这些声称者并非真实的使徒；“假的”保留原文简练而直接的否定评价，不额外限定其欺骗动机。
theological_decisions:
- issue: 自称者所声称的ἀπόστολοι身份
  choice: 译作教会语境中的称谓“使徒”
  alternative: 使者
  rationale: 上下文强调对其身份与权威声称的检验。“使徒”保留最可能的专门含义，同时不引入后世特定制度的解释。
- issue: κακούς所指对象的性别范围
  choice: 译作不限定性别的“恶人”
  alternative: 恶男子
  rationale: 希腊文虽为阳性复数，但在此名词化泛指邪恶的人；汉语不应把语法性别误译为仅指男性。
- issue: ψευδεῖς对这些人的判断性质
  choice: 译作“假的”
  alternative: 说谎的人；骗子
  rationale: 原文可指虚假、不真实，也可能连带说谎之意；正文采用较少解释性的“假的”，保留其身份虚假与言语不实之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。句式保留原文层层并列的鉴察语气，同时适度分句以增强可读性；不用过度教会化或古雅的措辞。
