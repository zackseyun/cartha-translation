  text: καὶ ἔδωκα αὐτῇ χρόνον ἵνα μετανοήσῃ, καὶ οὐ θέλει μετανοῆσαι ἐκ τῆς πορνείας αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/021.yaml
  text: And I gave her time to repent[a], but she is not willing to repent of her sexual immorality.
translation:
  language: zh_hans
  text: 我给了她时间，让她悔改，但她不愿悔改，离开自己的淫乱。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为自己的淫乱悔改。”
    reason: “为……悔改”更符合现代汉语习惯；正文则较明确地保留希腊文 ἐκ（“从……出来、离开”）的方向意味。
lexical_decisions:
- source_word: ἔδωκα
  choice: 我曾给
  rationale: 不定过去时陈述已经施予的行动；“曾”自然地表明此前给过她悔改的时间，又不必强化为完成时。
- source_word: χρόνον
  choice: 时间
  rationale: 直接保留 χρόνος 的时间含义；上下文自然显出这是给她悔改的期限或机会。
- source_word: ἵνα μετανοήσῃ
  choice: 让她悔改
  rationale: ἵνα 加虚拟式表达目的；“给她时间，让她悔改”是自然、准确的现代汉语。
- source_word: οὐ θέλει
  choice: 她不愿
  rationale: θέλω 在此表达意愿；“不愿”保留其主观不肯之意，但不强化成更绝对的“拒绝”。
- source_word: μετανοῆσαι
  choice: 悔改
  rationale: 作为 θέλει 的补足语，并按希腊文重复“悔改”，保留原句的强调。
- source_word: ἐκ τῆς πορνείας αὐτῆς
  choice: 离开自己的淫乱
  rationale: ἐκ 的基本方向义是“从……出来、离开”；如此译法保留悔改与离开淫乱之间的紧密关系。πορνεία 译作“淫乱”，在庄重而通俗的经文语体中明确指涉性方面的不道德。
theological_decisions:
- issue: 启示文学责备语境中 πορνεία 的含义
  choice: 译作“淫乱”，让上下文决定其是否兼有属灵不忠或偶像崇拜的象征意味
  alternative: 淫行；性方面的不道德；卖淫
  rationale: πορνεία 的常用实义涉及不正当性行为，但在先知性和启示文学中也可能具有象征意味。正文采用具体而不过度解释的词，不把经文限定为纯字面或纯隐喻。
- issue: ἐκ 与 μετανοέω 的关系
  choice: 译作“悔改，离开自己的淫乱”
  alternative: 为自己的淫乱悔改；从自己的淫乱中悔改
  rationale: 该结构可按目的和结果理解为悔改并转离淫乱。正文保留 ἐκ 的方向性，同时用脚注说明更贴近汉语惯用表达的另一种译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“淫乱”简洁明确，并适合启示录的责备语气；句中重复“悔改”以保留原文强调。
