  text: Καὶ τῷ ἀγγέλῳ ⸀τῆς ἐν Σμύρνῃ ἐκκλησίας γράψον· Τάδε λέγει ὁ πρῶτος καὶ ὁ ἔσχατος, ὃς ἐγένετο νεκρὸς καὶ ἔζησεν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/008.yaml
  text: 'And to the angel of the church in Smyrna write: These things says the First and the Last[b][a], who became dead and lived again:'
translation:
  language: zh_hans
  text: “你要写信给士每拿教会的使者[a]：那首先的、末后的，就是那曾死去又活了的，如此说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使者”也可译作“天使”。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: 使者
  rationale: ἄγγελος既可指天使，也可指传信者。启示录的异象语境支持“天使”，但收信对象与地方教会相连；正文采用较宽泛的“使者”，并以脚注保留“天使”，避免过早判定其身份。
- source_word: ἐκκλησίας
  choice: 教会
  rationale: 此处指士每拿的基督徒群体；“教会”是现代汉语中自然且准确的对应。
- source_word: Τάδε λέγει
  choice: 这样说
  rationale: 保留先知性宣告公式的庄重语气，同时符合现代汉语表达。
- source_word: ὁ πρῶτος καὶ ὁ ἔσχατος
  choice: 那首先的、末后的
  rationale: 以定指结构呈现其称号性质，并保留与旧约神圣称号语言的呼应，不作额外解释。
- source_word: ἐγένετο νεκρὸς
  choice: 曾死去
  rationale: “死去”体现ἐγένετο的事件性，即进入死亡，而不只描述静态的“曾是死的”。
- source_word: ἔζησεν
  choice: 又活了
  rationale: 结合前面的死亡，汉语“又活了”自然表达由死而生的对比，并保留复活含义而不扩写。
theological_decisions:
- issue: 教会的ἀγγέλος身份
  choice: 正文译“使者”，脚注“也可译作‘天使’”
  alternative: 正文译“天使”，脚注“也可译作‘使者’”
  rationale: 原词本身容许两义，且经文没有明说该对象是属天存在还是教会的人间代表；用正文与脚注共同保存这一真实歧义。
- issue: 基督称号及死而复生的表述
  choice: “那首先的、末后的，就是那曾死去又活了的”
  alternative: “那首先的和末后的，就是那曾是死的、后来活过来的”
  rationale: 译文保留称号的庄严性，并清楚表达死亡与重新活着的对照；不加入关于复活性质的经文外说明。
translation_notes:
  register: 采用现代、庄重且适合公开诵读的普通话书面语。“士每拿”沿用通行圣经地名译法；用“你要写信给……”使希腊语命令式自然呈现。引号内为基督的信息开端，本节末保留冒号以衔接后文。
