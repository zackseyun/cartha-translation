  text: Τῷ ἀγγέλῳ ⸀τῆς ἐν Ἐφέσῳ ἐκκλησίας γράψον· Τάδε λέγει ὁ κρατῶν τοὺς ἑπτὰ ἀστέρας ἐν τῇ δεξιᾷ αὐτοῦ, ὁ περιπατῶν ἐν μέσῳ τῶν ἑπτὰ λυχνιῶν τῶν χρυσῶν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/001.yaml
  text: 'To the angel of the church in Ephesus write: These things says the one who holds the seven stars in his right hand[a], who walks among the seven golden lampstands:'
translation:
  language: zh_hans
  text: “你要写信给在以弗所的教会的天使[a]：那右手握着七颗星、在七个金灯台中间行走的，说：”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “天使”也可译作“使者”。
    reason: 原文ἄγγελος既可指属天的天使，也可指传递信息的人；此处所指存在争议。
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: 天使
  rationale: 该词既可指属天的“天使”，也可指人的“使者”。启示录的异象语境支持正文采用“天使”，同时以脚注保留另一可能。
- source_word: ἐκκλησίας
  choice: 教会
  rationale: 在早期基督徒群体的语境中，“教会”是现代汉语最自然、明确的对应词。
- source_word: γράψον
  choice: 你要写信给
  rationale: 这是对约翰发出的不定过去时命令；结合间接受词，用“写信给”比单说“写给”更清楚自然。
- source_word: Τάδε λέγει
  choice: 这样说
  rationale: 保留先知宣告公式的庄重语气，同时符合现代汉语表达。
- source_word: κρατῶν
  choice: 握着
  rationale: 表达持续而有力地持有，既保留具体动作，也隐含掌管之意而不作过度解释。
- source_word: ἐν τῇ δεξιᾷ αὐτοῦ
  choice: 右手
  rationale: 保留原文具体意象；汉语在主语明确时省略“他的”更自然，所属关系仍然清楚。
- source_word: περιπατῶν ἐν μέσῳ
  choice: 在……中间行走
  rationale: 保留行走的动态画面，并准确表达处于众灯台之间。
- source_word: λυχνιῶν τῶν χρυσῶν
  choice: 金灯台
  rationale: λυχνία指承放灯盏的灯台而非灯本身；“金灯台”简洁且与启示录前文意象一致。
theological_decisions:
- issue: “教会的天使”所指为何
  choice: 正文译作“天使”
  alternative: 使者
  rationale: ἄγγελος本身容许两种理解。启示录的天启文学背景使“天使”较为顺畅，但具体所指仍有争议，因此不在正文中武断消除张力，而以脚注保留“使者”。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“这样说”保持宣告语气；“右手握着七颗星”和“在七座金灯台中间行走”保留原文鲜明、具体的异象画面。
