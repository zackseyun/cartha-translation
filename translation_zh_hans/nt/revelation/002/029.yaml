  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/029.yaml
  text: The one who has an ear, let him hear what the Spirit says to the churches.
translation:
  language: zh_hans
  text: 凡有耳的，就应当听圣灵对众教会所说的话。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: 凡有耳的
  rationale: 定冠词加分词构成名词性表达，指任何具备听觉、因而应当留心回应的人；“凡……的”自然保留格言式的普遍呼召，且不必补出性别代词。οὖς为单数，故保留“耳”。
- source_word: ἀκουσάτω
  choice: 就应当听
  rationale: 第三人称单数不定过去时命令式，表达郑重的劝令。“应当听”在现代汉语中比直译式“让他听”更自然，也保留命令力度；此处“听”兼有留心并回应之意，但不在正文中扩充解释。
- source_word: τί
  choice: 所说的话
  rationale: τί引出圣灵说话的内容。汉语以“所说的话”自然表达“所说的是什么/内容”，避免生硬的“听什么”。
- source_word: τὸ πνεῦμα
  choice: 圣灵
  rationale: 在启示录二至三章反复出现的宣告公式中，此词指向向众教会说话的神圣之灵。汉语通常以“圣灵”明确这一惯用称谓；这是语境所支持的指称，而非额外添加教义说明。
- source_word: λέγει
  choice: 说
  rationale: 现在时直陈语气在该公式中表达正在或一贯发出的宣告；汉语普通现在表达“说”最自然，无须机械加入进行体。
- source_word: ταῖς ἐκκλησίαις
  choice: 对众教会
  rationale: 复数指启示录二至三章所面对的各地信徒群体。“众教会”既保留复数与整体范围，也符合现代中文基督教语境；“对”准确表达间接受词关系。
theological_decisions:
- issue: τὸ πνεῦμα的指称
  choice: 圣灵
  alternative: 灵；耶稣信息中的灵性声音
  rationale: 上下文中，各封信由基督宣告，却以“圣灵对众教会所说的话”作结，呈现圣灵作为神圣说话者。译作“圣灵”符合这一语境，同时不进一步界定基督与圣灵说话之间的神学关系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式保留启示录重复警语的格言性和郑重感；避免古雅的“有耳可听的，就应当听”，也避免性别限定。
