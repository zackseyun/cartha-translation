source:
  edition: SBLGNT
  text: ἰδοὺ βάλλω αὐτὴν εἰς κλίνην, καὶ τοὺς μοιχεύοντας μετ’ αὐτῆς εἰς θλῖψιν μεγάλην, ἐὰν μὴ ⸀μετανοήσωσιν ἐκ τῶν ἔργων αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/022.yaml
  text: Look[a], I am throwing her onto a bed, and those who commit adultery with her into great affliction[b], unless they repent of her works.
translation:
  language: zh_hans
  text: 看哪，我要把她扔到床上[a]，也要把那些与她通奸的人投入极大的患难中[b]；除非他们悔改、离弃她的所作所为。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“病床”。希腊原文直译为“床”；在本节审判的语境中，许多人理解为受苦或患病之床。
    reason: lexical_alternative
  - marker: b
    text: 或译“极大的患难”。这里指严重的痛苦或困境。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 作为引人注意的感叹语，“看哪”既保留原文的郑重和警示语气，也符合现代中文圣经语体。
- source_word: βάλλω
  choice: 我就要把……扔到／投入
  rationale: 现在时在审判宣告中带有鲜明而迫近的意味。“就要”传达临近性；依中文搭配，对床用“扔到”，对苦难用“投入”，同时保留同一动词统摄两个宾语的结构关系。
- source_word: αὐτὴν εἰς κλίνην
  choice: 把她扔到床上
  rationale: κλίνη本义是“床”或“卧榻”，原文没有明说是病床，因此正文保留“床”，将审判性“病床”的理解列入脚注。
- source_word: τοὺς μοιχεύοντας μετ’ αὐτῆς
  choice: 那些与她通奸的人
  rationale: μοιχεύω直接指通奸；译文保留具体词义，不预先判定这里只指肉体关系、属灵不忠，还是兼有两层含义。
- source_word: εἰς θλῖψιν μεγάλην
  choice: 投入极大的苦难中
  rationale: θλῖψις可指患难、压迫、痛苦或困苦。“极大的苦难”自然表达严重的痛苦处境，又避免在正文中不必要地限定为某一特定末世术语。
- source_word: ἐὰν μὴ μετανοήσωσιν
  choice: 除非他们悔改
  rationale: 以“除非”自然对应ἐὰν μή的否定条件结构，并保留审判仍以悔改为条件的张力。
- source_word: ἐκ τῶν ἔργων αὐτῆς
  choice: 离弃她的所作所为
  rationale: ἐκ与“悔改”连用时表示转离；中文补出“离弃”，使方向含义清楚，同时严格保留αὐτῆς“她的”，不改成“他们的”。
theological_decisions:
- issue: κλίνη是否应在正文中明确译为审判性的“病床”
  choice: 正文译作“床”
  alternative: 病床
  rationale: 上下文确实表明这是审判，也可能以受苦或患病之床反讽淫乱之床；但κλίνη本身不必然表示病床，因此正文不把这一解释定死，而在脚注中保存。
- issue: μοιχεύοντας是肉体通奸还是象征属灵不忠
  choice: 按直接词义译作“通奸”
  alternative: 与她行淫／同她一起不忠
  rationale: 原词直接表示通奸，而《启示录》的语境可能同时赋予它象征意义。保留具体意象，可让上下文承载其更广的神学含义。
- issue: “她的所作所为”与悔改者之间的关系
  choice: 保留“她的”，并用“离弃”表达他们要转离这些行为
  alternative: 他们自己的行为
  rationale: 所给SBLGNT正文明确读αὐτῆς，即“她的”。虽然这些人与她同流，译文仍不把所有格改为“他们的”，以免消除原文的文本特征和责任关联。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“看哪”保留启示性宣告的语气；正文维持原文“床”的含混性及“通奸”的具体意象。两个脚注标记均已在正文相应位置出现。
