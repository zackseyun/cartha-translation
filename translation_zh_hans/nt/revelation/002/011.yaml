id: REV.2.11
reference: Revelation 2:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις. ὁ νικῶν οὐ μὴ ἀδικηθῇ ἐκ τοῦ θανάτου τοῦ δευτέρου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/011.yaml
  text: The one who has an ear[a], let him hear what the Spirit says to the churches[b]. The one who conquers will certainly not be harmed by the second death.
translation:
  language: zh_hans
  text: 有耳的，就应当听圣灵对众教会所说的话。得胜的[a]，绝不会受第二次的死所害[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“胜过的”。
    reason: lexical_alternative
  - marker: b
    text: 也可译：“绝不会被第二次的死伤害”；较直译为：“绝不会因第二次的死而受害。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: 有耳的
  rationale: 保留希腊文单数代表性表达及启示文学中的固定呼吁形式；现代汉语无须添加性别代词。
- source_word: ἀκουσάτω
  choice: 就应当听
  rationale: 第三人称单数不定过去时命令式，在此表达郑重劝勉；“应当听”比单纯“要听”更清楚传达其命令和呼吁意味。
- source_word: τί τὸ πνεῦμα λέγει
  choice: 圣灵……所说的话
  rationale: τί引出所说的内容，汉语以“所说的话”自然表达；在启示录致众教会的反复句式中，τὸ πνεῦμα最可能指圣灵。
- source_word: ταῖς ἐκκλησίαις
  choice: 对众教会
  rationale: 上下文指启示录第二至三章所面对的各地信徒群体；“众教会”准确表达复数，又符合庄重的现代汉语。
- source_word: ὁ νικῶν
  choice: 得胜的
  rationale: 现在时冠词化分词指持续以得胜为特征的人；“得胜的”在现代汉语中自然，也保留启示录反复出现的胜利意象。
- source_word: οὐ μὴ
  choice: 绝不会
  rationale: οὐ μή加虚拟式构成强烈否定；“绝不会”简洁而明确地传达强调语气。
- source_word: ἀδικηθῇ
  choice: 受到……伤害
  rationale: ἀδικέω的被动态在此侧重遭受损害，而非法律意义上的“被冤枉”；“受到伤害”符合死亡造成不利后果的语境。
- source_word: ἐκ τοῦ θανάτου τοῦ δευτέρου
  choice: 受到第二次的死所带来的伤害
  rationale: ἐκ在被动结构中可表示伤害的来源；“所带来的”使这种来源关系在汉语中清楚自然，同时不把它过度解释为工具关系。
- source_word: τοῦ θανάτου τοῦ δευτέρου
  choice: 第二次的死
  rationale: 直译并保留启示录中特有且具有神学分量的表达，不在正文中提前解释其具体含义。
theological_decisions:
- issue: “灵”的所指
  choice: 译作“圣灵”
  alternative: 译作“灵”或理解为一般意义上的预言之灵
  rationale: 在启示录反复出现的“圣灵对众教会所说的话”这一宣告句式中，它作为神圣的说话者出现，最自然地指圣灵；此译法不进一步界定圣灵与基督说话之间的关系。
- issue: 代表性阳性单数形式
  choice: 用无性别标记的汉语单数结构“有耳的……得胜的”
  alternative: 添加“他”或改写为明确复数
  rationale: 希腊文语法形式为阳性单数，但具有代表性、普遍适用的功能。现代汉语的“……的”既可保留单数式呼吁的简洁，也无需凭空加入性别信息。
- issue: “第二次的死”的含义
  choice: 保留原有表达，不在正文内解释
  alternative: 扩译为永远定罪、最终审判或永远的死亡
  rationale: 该表达在启示录后文得到进一步说明；本节应保留其启示文学意象及神学张力，不把某种完整解释直接写入正文。
- issue: 第二次的死与伤害之间的关系
  choice: 译为“第二次的死所带来的伤害”
  alternative: 译为“不会被第二次的死伤害”或“不会受害于第二次的死”
  rationale: ἐκ可表示来源或近似施事的关系；所选译法保留来源含义，避免断言“第二次的死”在语法上仅仅是直接施事者。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“有耳的，就应当听”保留启示文学中郑重呼吁的节奏；“众教会”简洁表达复数对象。脚注标记均置于相应词句之后，避免沿用咨询层中位置与内容不相符的标记。
