  text: ἀλλὰ τοῦτο ἔχεις ὅτι μισεῖς τὰ ἔργα τῶν Νικολαϊτῶν, ἃ κἀγὼ μισῶ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/006.yaml
  text: 'But this you have: you hate the works of the Nicolaitans[a], which I also hate.'
translation:
  language: zh_hans
  text: 不过，你有这一点：你恨恶尼哥拉一党人的行为[a]，这些行为也是我所恨恶的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “行为”也可译作“所做的事”；原文指行动或实践。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: 不过
  rationale: 承接上文形成转折；“不过”简洁自然，又不削弱转折意味。
- source_word: τοῦτο ἔχεις
  choice: 你有这一点
  rationale: 保留原文“有这一点”的表达及 τοῦτο 的突出位置，不扩展为较具解释性的“这是你的可取之处”。
- source_word: ὅτι
  choice: ：
  rationale: ὅτι 在此引出“这一点”的具体内容，用冒号符合现代汉语表达。
- source_word: μισεῖς / μισῶ
  choice: 恨恶 / 恨恶
  rationale: 两处使用同一动词，译文保持重复，并保留原文强烈的否定态度而不予弱化。
- source_word: τὰ ἔργα
  choice: 行为
  rationale: 此处指该群体所做的事或所实行的作法；“行为”在现代汉语中自然，并清楚表明被恨恶的是其所行之事。
- source_word: τῶν Νικολαϊτῶν
  choice: 尼哥拉一党人
  rationale: 采用中文圣经语境中易辨识的群体名称，表达该复数称谓所指的一群人。
- source_word: ἃ κἀγὼ μισῶ
  choice: 这些行为也是我所恨恶的
  rationale: 明确关系代词回指“行为”，并保留 καί 的“也”以及说话者与受信者立场的一致。
theological_decisions:
- issue: 恨恶的对象
  choice: 明确将“这些行为”作为恨恶的对象
  alternative: 较宽泛地译成恨恶尼哥拉一党人本身
  rationale: 原文直接宾语是 τὰ ἔργα（行为），关系代词 ἃ 也回指这些行为；译文不应把谴责对象扩大为人本身。
- issue: 说话者与教会立场一致
  choice: 译为“这些行为也是我所恨恶的”
  alternative: 弱化为“这些行为也是我所不赞同的”
  rationale: 原文两次使用 μισέω，必须保留“恨恶”的力度，并表达说话者同样恨恶这些行为。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“你有这一点”保留原文较凝练的措辞；后半句重复“这些行为”，避免汉语关系结构产生指代含混。
