base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/004.yaml
  text: 'But I have this against you: you have abandoned your first love[a].'
translation:
  language: zh_hans
  text: 然而，有一件事我要责备你：你离弃了起初的爱[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你离开了起初的爱。”这句话可能指他们起初所怀有的爱，无论是对主的爱、彼此之间的爱，还是两者兼有。
    reason: 说明ἀφῆκες可译为“离开”，并保留“起初的爱”所指对象的歧义。
lexical_decisions:
- source_word: ἀλλὰ
  choice: 然而
  rationale: 表示与前文称赞之间鲜明的转折；“然而”自然、庄重，又不削弱责备的力度。
- source_word: ἔχω κατὰ σοῦ
  choice: 有一件事我要责备你
  rationale: 该习语表示对某人有所指责或控告；此译法符合现代汉语表达，并保留审断和责备的语气。
- source_word: ὅτι
  choice: ：
  rationale: ὅτι引出责备的具体内容；用冒号衔接清楚自然，也避免译成“因为”而过度解释句法关系。
- source_word: ἀγάπην
  choice: 爱
  rationale: 直接对应ἀγάπη，并保持其对象在上下文中的开放性。
- source_word: τὴν πρώτην
  choice: 起初的
  rationale: 既可表达时间上最初、早先的含义，又比单独说“第一”更符合现代汉语；不擅自限定为对主或对彼此的爱。
- source_word: ἀφῆκες
  choice: 离弃了
  rationale: ἀφίημι在此意为离开、撇下；“离弃”保留行为的严肃性，同时比“遗弃”更适合以“爱”为宾语。
theological_decisions:
- issue: “起初的爱”所指为何
  choice: 保留为“起初的爱”，不明确限定爱的对象
  alternative: 你起初对我的爱；你们起初彼此相爱的心；你从前的爱
  rationale: 希腊文τὴν ἀγάπην σου τὴν πρώτην没有明说爱的对象，可能指对主的爱、彼此相爱，或兼指两者。正文保留这种真实的语义和神学开放性。
- issue: ἀφῆκες的力度
  choice: 离弃了
  alternative: 离开了；撇下了
  rationale: “离弃”体现原文所表达的严重偏离，但不额外断定这种爱已经完全消失或不可恢复。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“有一件事我要责备你”比逐字译作“我有反对你的事”自然；“起初的爱”保留原文简洁性及解释空间。
