id: REV.2.14
reference: Revelation 2:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἀλλὰ ἔχω κατὰ σοῦ ὀλίγα, ὅτι ἔχεις ἐκεῖ κρατοῦντας τὴν διδαχὴν Βαλαάμ, ὃς ⸂ἐδίδασκεν τῷ⸃ Βαλὰκ βαλεῖν σκάνδαλον ἐνώπιον τῶν υἱῶν Ἰσραήλ, ⸀φαγεῖν εἰδωλόθυτα καὶ πορνεῦσαι·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/014.yaml
  text: 'But I have a few things against you: you have there some who hold to the teaching of Balaam[a], who taught Balak to put a stumbling block before the sons of Israel, to eat food sacrificed to idols and to commit sexual immorality.'
translation:
  language: zh_hans
  text: 然而，我有几件事要责备你：你那里有人持守巴兰的教导；巴兰曾教巴勒把绊脚石放在以色列人[a]面前，使他们吃献给偶像的食物，并且犯淫乱。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“以色列的众子”。或译“以色列的子民”。
    reason: 说明希腊文 υἱῶν Ἰσραήλ 的字面形式，同时保留正文中符合现代汉语习惯的群体称谓。
lexical_decisions:
- source_word: ὀλίγα
  choice: 几件事
  rationale: 中性复数形容词在此作名词使用；“几件事”自然补出汉语所需的量词和所指，同时保留数量不多的意思。
- source_word: κρατοῦντας τὴν διδαχὴν
  choice: 持守……的教导
  rationale: κρατέω在此指坚持、依附某种教导，并非实际抓握；“持守”保留其持续坚持的力度。
- source_word: Βαλαάμ / Βαλὰκ
  choice: 巴兰／巴勒
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: ἐδίδασκεν τῷ Βαλὰκ
  choice: 曾教巴勒
  rationale: 未完成时在此回顾巴兰对巴勒的教唆；汉语以“曾教”自然表达过去背景，不强行加入希腊语未明确要求的反复含义。
- source_word: βαλεῖν σκάνδαλον
  choice: 把绊脚石放在……面前
  rationale: 保留原文“放置绊脚石”的比喻，以及诱使人跌倒、犯罪的道德含义，不直接解释成“陷阱”或“犯罪的诱因”。
- source_word: τῶν υἱῶν Ἰσραήλ
  choice: 以色列众子
  rationale: 较贴近希腊文“以色列的众子”，并以脚注提供更自然、涵盖群体的译法。
- source_word: φαγεῖν εἰδωλόθυτα
  choice: 吃献给偶像的食物
  rationale: 清楚表达这些食物曾用于献祭偶像，比“偶像之物”等较生硬说法更适合现代普通读者。
- source_word: πορνεῦσαι
  choice: 行淫乱之事
  rationale: πορνεύω泛指不合正道的性行为；此译法保留其广度和道德分量，不将其缩窄为某一种具体行为。
theological_decisions:
- issue: 如何表达“以色列的众子”中的阳性复数形式
  choice: 正文译作“以色列众子”
  alternative: 以色列的子民／以色列人
  rationale: 原文明确使用υἱῶν（众子），正文保留这一传统群体称谓的形式，脚注则说明现代汉语中更自然的群体译法。
- issue: σκάνδαλον应保留比喻还是直接解释
  choice: 绊脚石
  alternative: 陷阱／犯罪的诱因
  rationale: “绊脚石”在汉语中能够传达使人跌倒的比喻意义，保留原文的神学和修辞张力，避免过度诠释。
- issue: 吃祭偶像之物与淫乱在句法上如何连接“绊脚石”
  choice: 用“使他们……并且……”表达其导致的行为
  alternative: 用“就是……”将两个不定式直接同位解释为绊脚石的内容
  rationale: 两个不定式说明巴兰所设绊脚石引向的行为；“使他们”符合民数记背景和汉语表达，但不进一步断定二者是纯目的、结果或同位关系。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“责备”“持守”“绊脚石”等词保留经文的审判语气和核心比喻；句式避免过度古雅，也不加入宗派性解释。
