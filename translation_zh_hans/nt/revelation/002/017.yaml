  naturalness: 整体庄重、流畅，符合现代标准汉语。“凡有耳的，都应当听”自然可懂；将“都”改为“就”更贴合“凡……的，就……”的现代书面句式。以逗号衔接“白石”与其上的名字，比用分号更清楚地显示二者在同一应许中的关系。
  terminology: “圣灵”“众教会”“得胜的人”“吗哪”“白石”均合适且前后一致。“一块白石”保留ψῆφος的未定文化指涉；脚注也恰当地不裁定其象征背景。
