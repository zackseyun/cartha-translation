id: REV.2.17
reference: Revelation 2:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις. τῷ νικῶντι δώσω ⸀αὐτῷ τοῦ μάννα τοῦ κεκρυμμένου, καὶ δώσω αὐτῷ ψῆφον λευκήν, καὶ ἐπὶ τὴν ψῆφον ὄνομα καινὸν γεγραμμένον ὃ οὐδεὶς οἶδεν εἰ μὴ ὁ λαμβάνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/017.yaml
  text: The one who has an ear[a], let him hear what the Spirit says to the churches. To the one who conquers I will give some of the hidden manna, and I will give him a white stone, and a new name written on it[c][b], which no one knows except the one who receives it.
translation:
  language: zh_hans
  text: 凡有耳的，就应当听圣灵对众教会所说的话。得胜的人，我要赐给他一些隐藏的吗哪，也要赐给他一块白石[a]，石上写着一个新名字；除了领受的人以外，没有人知道。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “白石”可能使人联想到投票用的小石、宣告无罪的凭证或准许入场的信物；原文没有说明具体所指。
    reason: cultural_note
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: 凡有耳的
  rationale: 保留希腊文单数“耳”的惯用表达，同时用现代汉语“凡……的”自然传达其普遍邀请。
- source_word: ἀκουσάτω
  choice: 都应当听
  rationale: 以劝告性的“应当”表达第三人称命令语气；“都”与前面的泛指结构配合，并未把“耳”改为复数。
- source_word: τὸ πνεῦμα
  choice: 圣灵
  rationale: 在《启示录》反复出现的公式中明确指神的灵；汉语通常以“圣灵”自然指称，而非含混的“那灵”。
- source_word: ταῖς ἐκκλησίαις
  choice: 众教会
  rationale: 指本书所致信的各地信徒群体；“众教会”简洁保留复数。
- source_word: τῷ νικῶντι
  choice: 得胜的人
  rationale: νικάω含战胜、胜过之意；“得胜的人”符合《启示录》的胜利主题，也比“征服的人”更自然且不引入军事施暴意味。
- source_word: τοῦ μάννα τοῦ κεκρυμμένου
  choice: 隐藏的吗哪
  rationale: 保留部分属格在“把……赐给”结构中的自然含义，不额外添加“一些”；“隐藏的”表达其已被藏起、仍处隐藏状态。
- source_word: ψῆφον λευκήν
  choice: 一块白石
  rationale: ψῆφος可指小石、投票石或凭证；正文采用不过度限定的“白石”，将可能的文化背景留给脚注。
- source_word: ἐπὶ τὴν ψῆφον ὄνομα καινὸν γεγραμμένον
  choice: 石上写着一个新名字
  rationale: 按自然汉语重组语序，清楚表达名字写在白石上，同时保留完成后持续存在的状态。
- source_word: ὃ οὐδεὶς οἶδεν εἰ μὴ ὁ λαμβάνων
  choice: 除了领受的人以外，没有人知道
  rationale: 关系代词所指最自然是“新名字”；汉语无需补出“它”，仍能清楚表达只有领受者知道。
theological_decisions:
- issue: τῷ νικῶντι所表达的得胜
  choice: 译为“得胜的人”，不说明其得胜的具体方式
  alternative: “胜过的人”或“征服的人”
  rationale: 本节承接《启示录》各封信中的应许公式，但没有在此处界定得胜的具体性质；译文保留这一开放性。
- issue: 白石的象征背景
  choice: 正文仅译“一块白石”
  alternative: 明确译作无罪票石、宴席入场凭证或投票石
  rationale: 原文没有解释白石所对应的社会习俗，故不在正文中裁定其象征含义。
- issue: 新名字的归属或指涉
  choice: 译作“一个新名字”，不说明是谁的名字
  alternative: 解释为领受者的新名、基督的新名或神的名
  rationale: 原文只说石上写着新名字，未明确交代名字属于谁；译文保留此神学与释经张力。
- issue: 单数阳性形式的泛指功能
  choice: 以“凡有耳的”“得胜的人”“他”“领受的人”表达
  alternative: 使用复数或反复使用性别中性的泛称
  rationale: 汉语“他”可作传统泛指，但主要借助“凡……的”和“……的人”表达普遍范围，既保留原文单数形式，也避免把应许限制为男性。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“圣灵对众教会所说的话”保留启示录书信公式；分号凸显白石与其上新名之间的紧密关系。所有脚注标记均置于正文相应位置。
