source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ ⸀τῆς ἐν Θυατείροις ἐκκλησίας γράψον· Τάδε λέγει ὁ υἱὸς τοῦ θεοῦ, ὁ ἔχων τοὺς ὀφθαλμοὺς αὐτοῦ ὡς φλόγα πυρός, καὶ οἱ πόδες αὐτοῦ ὅμοιοι χαλκολιβάνῳ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/018.yaml
  text: 'And to the angel of the church in Thyatira write: These things says the Son of God[a], the one who has his eyes like a flame of fire[b], and his feet like burnished bronze:'
translation:
  language: zh_hans
  text: 你要写信给在推雅推喇的教会的天使[a]，说：“那眼目如火焰、双脚像精炼之铜[b]的上帝之子，这样说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “天使”也可译作“使者”。
    reason: alternative_reading
  - marker: b
    text: 译作“精炼之铜”的希腊词十分罕见，确切所指不明；也可能泛指一种经过提炼、闪耀发光的金属或合金。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: 使者
  rationale: ἄγγελος既可指天上的“天使”，也可指受差遣的“使者”。中文“使者”自然贴合写信给教会使者的句式，并保留原词所容许的指称空间；脚注说明“天使”这一可能理解。
- source_word: ἐκκλησίας
  choice: 教会
  rationale: 这里指推雅推喇的基督徒群体；“教会”是现代中文中自然、明确的对应词。
- source_word: Τάδε λέγει
  choice: 这样说
  rationale: 保留先知性宣告公式的庄重语气，同时避免生硬直译为“这些事说”。
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: 上帝的儿子
  rationale: 直接保留原文明确的基督论称号，不作弱化或释义性改写。
- source_word: ὀφθαλμοὺς αὐτοῦ ὡς φλόγα πυρός
  choice: 那双眼如火焰
  rationale: 紧贴希腊文的明喻，保留启示文学鲜明而凝练的意象。
- source_word: οἱ πόδες αὐτοῦ ὅμοιοι χαλκολιβάνῳ
  choice: 双脚像精炼之铜
  rationale: 以“精炼之铜”表达一种明亮、经提炼的金属，同时用脚注交代χαλκολίβανον所指金属或合金并不确定。
theological_decisions:
- issue: ἀγγέλῳ在致推雅推喇教会话语中的所指
  choice: 使者
  alternative: 天使
  rationale: 原词可指天使或一般使者，文本没有在本节中明确判定其身份。正文采用较能保留语义范围的“使者”，脚注列出“天使”，不武断解决这一解释问题。
- issue: 说话者的基督论称号
  choice: 上帝的儿子
  alternative: 神的儿子
  rationale: 原文明确使用ὁ υἱὸς τοῦ θεοῦ。正文完整保留亲子与神圣称号；“上帝”是现代标准普通话中清楚、庄重且易懂的表达。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“这样说”保留宣告公式的语感；“就是那……”以自然中文承接两个描述说话者身份的分词结构。正文按本节开头保留引号，但因宣告内容延续至下一节，此处不闭合引号。
