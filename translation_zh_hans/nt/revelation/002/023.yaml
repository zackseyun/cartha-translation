  text: καὶ τὰ τέκνα αὐτῆς ἀποκτενῶ ἐν θανάτῳ· καὶ γνώσονται πᾶσαι αἱ ἐκκλησίαι ὅτι ἐγώ εἰμι ὁ ἐραυνῶν νεφροὺς καὶ καρδίας, καὶ δώσω ὑμῖν ἑκάστῳ κατὰ τὰ ἔργα ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/023.yaml
  text: And I will kill her children with death[a], and all the churches will know that I am the one who searches hearts and minds[b], and I will give to each of you according to your works.
translation:
  language: zh_hans
  text: 我也要使她的儿女死于死亡[a]。这样，众教会就会知道，我就是那察验人肺腑和内心的那一位[b]；我也要照你们各人所行的报应你们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使她的儿女死于瘟疫”。希腊文直译是“以死亡杀死”，可能是加强审判的语气，也可能呼应旧约的审判用语。
    reason: lexical_alternative
  - marker: b
    text: 直译“肾脏和心”。这是圣经中的惯用说法，指人的内在，包括隐藏的动机、思想和欲望。
    reason: cultural_note
lexical_decisions:
- source_word: τέκνα
  choice: 儿女
  rationale: 直译为“儿女”，在现代汉语中自然，也保留可指亲生儿女或追随者的歧义。
- source_word: ἀποκτενῶ ἐν θανάτῳ
  choice: 使……死于死亡
  rationale: 保留原文“以死亡杀死”的异常强化表达及其旧约审判语言的回响；“瘟疫”作为可能解释列入脚注。
- source_word: ἐκκλησίαι
  choice: 众教会
  rationale: 指启示录所面对的基督徒群体；“众”自然表达 πᾶσαι 的全称意义。
- source_word: ὁ ἐραυνῶν
  choice: 那察验……的
  rationale: “察验”兼顾深入探查与审判性鉴察，且保留分词所表达的持续特征。
- source_word: νεφροὺς καὶ καρδίας
  choice: 肺腑和内心
  rationale: “肺腑”保留身体意象及圣经语体，“内心”传达人思想、意愿与欲望的中心；脚注说明其惯用意义。
- source_word: δώσω ὑμῖν ἑκάστῳ κατὰ τὰ ἔργα ὑμῶν
  choice: 照你们各人所行的报应你们
  rationale: 原文动词直义是“给”，但在按行为施行审判的语境中表示报偿；此译法在汉语中清楚表达司法性含义，同时保留“各人”的分配意义。
theological_decisions:
- issue: 说话者察验人内在生命的身份宣告
  choice: 保留“我就是那察验人肺腑和内心的”这一强烈自我宣告
  alternative: 弱化为“我知道人的想法”或一般性的观察
  rationale: 原文把洞察并审判人内在生命的权柄归给说话者；译文不应削弱这一神学分量。
- issue: “她的儿女”的所指
  choice: 正文保留“儿女”，不明确限定为亲生儿女或追随者
  alternative: 直释为“她的亲生儿女”或“她的门徒/追随者”
  rationale: 上下文可能暗示追随者，但希腊文本本身没有排除字面意义，因此应保存歧义。
- issue: ἐν θανάτῳ 的审判方式
  choice: 正文保留“死于死亡”的突兀表达
  alternative: 明确译为“死于瘟疫”
  rationale: “瘟疫”有七十士译本语言背景支持，但并非此处希腊文唯一必然的意义；正文保留张力，脚注列出解释。
translation_notes:
  register: 采用现代、庄重而可懂的普通话。“死于死亡”有意保留原文的异常力度；“肺腑和内心”兼顾圣经意象与现代可理解性。正文所有脚注标记均应出现；因此在“肺腑和内心”后标注[b]。
