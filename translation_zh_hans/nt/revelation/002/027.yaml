  text: καὶ ποιμανεῖ αὐτοὺς ἐν ῥάβδῳ σιδηρᾷ ὡς τὰ σκεύη τὰ κεραμικὰ ⸀συντρίβεται,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/027.yaml
  text: and he will shepherd them with an iron rod[a], as clay vessels are shattered[b],
translation:
  language: zh_hans
  text: 他必以铁杖牧养他们[a]，如同陶器被打得粉碎[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他必以铁杖治理他们”。原文动词本义是“牧养”，但这里借用《诗篇》2:9，也带有君王治理的含义。
    reason: alternative_reading
  - marker: b
    text: 这里借用《诗篇》2:9，那里以陶器被打碎的意象描写列国的毁灭。
    reason: cross_reference
lexical_decisions:
- source_word: ποιμανεῖ
  choice: 必……牧养
  rationale: 原词的基本意象是牧人放牧、照管羊群；在诗篇第二篇的王权语境中也含有治理之意。正文保留“牧养”，不抹平关怀与威权并存的张力。
- source_word: ἐν ῥάβδῳ σιδηρᾷ
  choice: 用铁杖
  rationale: “杖”可指牧杖、棍杖或权杖；“铁杖”既自然简洁，也保留诗篇第二篇中力量与审判的意象。
- source_word: ὡς
  choice: 如同
  rationale: 清楚引出比较，在现代汉语中庄重而自然。
- source_word: τὰ σκεύη τὰ κεραμικὰ
  choice: 陶器
  rationale: 该短语指陶土制成的器皿；“陶器”简洁自然，并保留其易碎的特征。
- source_word: συντρίβεται
  choice: 被摔得粉碎
  rationale: 原词表示猛烈地击碎。“粉碎”传达结果，“被摔得”使陶器破碎的画面在汉语中更鲜明；希腊语中性复数主语配单数动词属于常见句法，不影响汉语表达。
- source_word: καὶ
  choice: 承接上文，不单独译出
  rationale: καὶ连接本句与上一节的应许。因所给经文是上一句的延续，汉语独立呈现本节时以“他”直接起句更自然，语义联系仍由上下文体现。
theological_decisions:
- issue: ποιμανεῖ与“铁杖”所承载的诗篇2:9王权—弥赛亚意象
  choice: 正文译作“牧养”，保留牧人意象，同时让“铁杖”和粉碎陶器的语境表达王权与审判。
  alternative: 译作“治理”或“统治”，直接突出王权。
  rationale: 希腊文使用ποιμαίνω，而非一般表示统治的动词。保留“牧养”可忠实呈现原文中照管、治理和施行审判之间的张力，脚注则说明其王权含义。
translation_notes:
  register: 采用现代、庄重且易懂的简体中文。“牧养”保留圣经牧人意象；“被摔得粉碎”增强陶器遭毁坏的具体画面。所有脚注标记均已置于正文对应位置。
