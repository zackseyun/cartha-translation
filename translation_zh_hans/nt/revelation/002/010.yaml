id: REV.2.10
reference: Revelation 2:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ⸀μηδὲν φοβοῦ ἃ μέλλεις ⸀πάσχειν. ⸀ἰδοὺ μέλλει ⸀βάλλειν ὁ διάβολος ἐξ ὑμῶν εἰς φυλακὴν ἵνα πειρασθῆτε, καὶ ⸀ἕξετε θλῖψιν ἡμερῶν δέκα. γίνου πιστὸς ἄχρι θανάτου, καὶ δώσω σοι τὸν στέφανον τῆς ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/010.yaml
  text: Do not fear what you are about to suffer[a]. Look, the devil is about to throw some of you into prison so that you may be tested, and you will have tribulation for ten days. Be faithful until death[c][b], and I will give you the crown of life.
translation:
  language: zh_hans
  text: 你将要受的苦，一点也不要怕。看哪，魔鬼将要把你们中间的一些人投入监牢，使你们受考验[a]；你们将遭受十天的患难。你要忠心，直到死[b]，我就赐给你生命的冠冕[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “受考验”也可译作“受试炼”或“受诱惑”；希腊语动词可按语境指考验、试炼或诱惑。
    reason: lexical_alternative
  - marker: b
    text: “直到死”也可理解为“即使到死的地步”，表示哪怕必须殉道也仍然忠心。
    reason: alternative_reading
  - marker: c
    text: 这里译作“冠冕”的希腊语词指赐给得胜者或受奖者的花冠，并非君王所戴的王冠。
    reason: cultural_note
lexical_decisions:
- source_word: μηδὲν φοβοῦ
  choice: 一点也不要怕
  rationale: μηδέν加强否定的范围；此译自然地表达“什么都不要怕”，并与后面的受苦内容衔接。
- source_word: ἃ μέλλεις πάσχειν
  choice: 你将要受的苦
  rationale: μέλλω加不定式表示即将发生，πάσχω在此指遭受苦难；译文保留临近将来的意味。
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 作为引人注意的话语标记，“看哪”既保留强调作用，也符合庄重的经文语体。
- source_word: μέλλει βάλλειν ὁ διάβολος
  choice: 魔鬼将要……投入
  rationale: μέλλει表示事情即将发生；βάλλειν本义为扔、投，在投入监牢的搭配中自然且保留原文力度。
- source_word: ἐξ ὑμῶν
  choice: 你们中间的一些人
  rationale: ἐκ加复数代词表示从群体中取出一部分，此译明确表达部分成员而非全体。
- source_word: εἰς φυλακήν
  choice: 投入监牢
  rationale: φυλακή在此指拘禁之处；“监牢”符合处境和庄重语域。
- source_word: ἵνα πειρασθῆτε
  choice: 使你们受考验
  rationale: πειράζω可指考验、试炼或诱惑；逼迫与监禁的语境较支持“受考验”，同时以脚注保留其他词义可能。
- source_word: ἕξετε θλῖψιν
  choice: 你们将遭受……患难
  rationale: θλῖψις指压迫性的困苦，在《启示录》中分量较重；“患难”兼具可懂性和经文语体。
- source_word: ἡμερῶν δέκα
  choice: 十天
  rationale: 属格表达持续时间，汉语直接说“十天”即可自然呈现。
- source_word: γίνου πιστός
  choice: 你要忠心
  rationale: 现在时命令式在语境中要求进入并持续保持忠信状态；“要忠心”简洁自然。
- source_word: ἄχρι θανάτου
  choice: 直到死
  rationale: 贴近原文，既可表示一生忠心到死亡，也容纳忠心到殉道地步的含义，不在正文中把范围缩窄。
- source_word: τὸν στέφανον τῆς ζωῆς
  choice: 生命的冠冕
  rationale: 保留属格结构的开放性；στέφανος指胜利者或受奖者所得的花冠，而非王室冠冕，文化信息置于脚注。
theological_decisions:
- issue: πειρασθῆτε在魔鬼、监禁和逼迫语境中的含义
  choice: 受考验
  alternative: 受试炼；受诱惑
  rationale: 上下文首先呈现外在苦难对忠心的检验，因此正文采用“受考验”；但该动词也可表达试炼或诱惑，脚注保留其真实词义张力。
- issue: ἄχρι θανάτου的范围
  choice: 直到死
  alternative: 即使到死的地步；至死不渝
  rationale: 直译可同时涵盖终身忠心和面对殉道仍忠心，不把经文限定为其中一种。
- issue: τῆς ζωῆς与στέφανος的关系
  choice: 生命的冠冕
  alternative: 以生命为冠冕；带来生命的冠冕
  rationale: 希腊语属格可承载多种关系；沿用简洁的属格表达，避免在正文中替原文作过度解释。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“看哪”保留原文提示和强调的功能；“患难”“冠冕”维持《启示录》的庄严意象。脚注标记按正文相关词语顺序排列，并分别紧随“受考验”“直到死”“冠冕”之后。
