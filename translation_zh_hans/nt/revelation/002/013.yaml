id: REV.2.13
reference: Revelation 2:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ⸀Οἶδα ποῦ κατοικεῖς, ὅπου ὁ θρόνος τοῦ Σατανᾶ, καὶ κρατεῖς τὸ ὄνομά μου, καὶ οὐκ ἠρνήσω τὴν πίστιν μου ⸀καὶ ἐν ταῖς ⸀ἡμέραις Ἀντιπᾶς, ὁ μάρτυς μου, ὁ πιστός ⸀μου, ὃς ἀπεκτάνθη παρ’ ὑμῖν, ὅπου ὁ Σατανᾶς κατοικεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/013.yaml
  text: I know where you live—where Satan’s throne is[a]. Yet you hold fast my name, and you did not deny faith in me, even in the days of Antipas, my witness, my faithful one, who was killed among you[b], where Satan lives.
translation:
  language: zh_hans
  text: 我知道你住在哪里，就是撒但宝座所在的地方。然而，你仍坚守我的名，没有否认对我的信仰[a]。甚至在安提帕的那些日子也是如此；他是我的见证人[b]，我那忠信者，在你们那里，就是撒但居住的地方，被杀了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“我的信”，也可理解为“对我的信仰”或“我的信实”。这个简洁的希腊语短语有不止一种可能的理解。
    reason: alternative_reading
  - marker: b
    text: “见证人”也可译作“殉道者”。这个希腊词基本意为“见证人”，在受苦或死亡的语境中也可带有“殉道者”的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἶδα
  choice: 我知道
  rationale: 该完成时具有现在意义；“我知道”直接、自然。
- source_word: κατοικεῖς / κατοικεῖ
  choice: 你住 / 居住
  rationale: κατοικέω表示在某处居住；按两处不同主语采用自然的现代汉语表达。
- source_word: ὅπου ὁ θρόνος τοῦ Σατανᾶ
  choice: 就是撒但宝座所在的地方
  rationale: 保留鲜明的启示文学意象，不对“宝座”所指作解释性扩展。
- source_word: κρατεῖς τὸ ὄνομά μου
  choice: 你仍坚守我的名
  rationale: κρατέω在此表达坚定持守；“我的名”保留原文关于身份、承认与忠诚的浓缩表达。
- source_word: οὐκ ἠρνήσω τὴν πίστιν μου
  choice: 没有否认对我的信
  rationale: 在此语境中，μου自然理解为信心所指向的对象；同时用脚注保留“我的信”及“我的信实”等可能理解。
- source_word: ἐν ταῖς ἡμέραις Ἀντιπᾶς
  choice: 在安提帕的那些日子
  rationale: 尽量保留有文本异读痕迹的希腊语时间短语，而不擅自补出“活着”或“殉道”等内容。
- source_word: ὁ μάρτυς μου
  choice: 我的见证人
  rationale: μάρτυς的基本义为“见证人”；死亡语境使“殉道者”的含义成为可能，故列入脚注。
- source_word: ὁ πιστός μου
  choice: 我忠信的人
  rationale: 保留其独立同位语结构，不将πιστός直接并入“见证人”；“忠信”兼顾忠诚与可信。
- source_word: ἀπεκτάνθη παρ’ ὑμῖν
  choice: 在你们那里……被杀了
  rationale: ἀποκτείνω的被动式直译为“被杀”；παρά加与格在此表示在某人中间或所在之处，避免误译成“被你们杀了”。
theological_decisions:
- issue: τὴν πίστιν μου中属格μου的含义
  choice: 正文译为“对我的信”
  alternative: “我的信”或“我的信实”
  rationale: 上下文是在称赞会众没有否认基督，宾语属格式理解在现代汉语中最自然；但希腊语短语简洁且具有真实歧义，因此脚注保留其他可能。
- issue: 死亡语境中的μάρτυς
  choice: 正文译为“见证人”
  alternative: “殉道者”
  rationale: “见证人”是该词的基本词义，且下文已经明确安提帕被杀；脚注提示该词在此语境中也可带有“殉道者”的意味。
- issue: “撒但的宝座”所指
  choice: 保留原有意象，不解释其具体历史指涉
  alternative: 解释为某种政治、宗教或崇拜中心
  rationale: 原文没有明确说明该意象对应何物，正文不应替读者解决这一开放问题。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“然而”“甚至……也是如此”使长句关系清楚；保留“我的名”“撒但的宝座”等启示文学和神学意象。所有脚注标记均已置于正文。
