  text: ὑμῖν δὲ λέγω τοῖς λοιποῖς τοῖς ἐν Θυατείροις, ὅσοι οὐκ ἔχουσιν τὴν διδαχὴν ταύτην, οἵτινες οὐκ ἔγνωσαν τὰ βαθέα τοῦ Σατανᾶ, ὡς λέγουσιν, οὐ βάλλω ἐφ’ ὑμᾶς ἄλλο βάρος·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/024.yaml
  text: 'But to the rest of you in Thyatira I say: all who do not hold this teaching[a], who have not known the deep things of Satan, as they call them—I am not laying any other burden on you.'
translation:
  language: zh_hans
  text: 至于你们在推雅推喇其余的人，就是所有不持守这教导、也不曾认识那所谓“撒但深奥之事”[a]的人，我告诉你们：我不把别的重担加在你们身上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“撒但的深处”。这希腊语表达可能呼应有人自称拥有“深奥”的属灵知识，而约翰否定这种主张。
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῖς λοιποῖς τοῖς ἐν Θυατείροις
  choice: 你们推雅推喇其余的人
  rationale: 保留“其余的人”与跟从该教导者之间的对比，并按中文习惯将地点置于所属群体之前；“推雅推喇”采用通行圣经地名译法。
- source_word: ἔχουσιν τὴν διδαχὴν ταύτην
  choice: 持守这教导
  rationale: 此处ἔχω表示接受并坚持某种教导；“持守”比直译“有”更准确，又不扩展为具体行为层面的“遵从”。
- source_word: οἵτινες οὐκ ἔγνωσαν
  choice: 不曾认识
  rationale: 既可指未获得相关知识，也可能含未曾亲历之意；“不曾认识”保留这种范围。
- source_word: τὰ βαθέα τοῦ Σατανᾶ
  choice: 撒但深奥之事
  rationale: βαθέα指“深处、深奥之事”；此译保留其可能影射所谓高深属灵知识的修辞意味。
- source_word: ὡς λέγουσιν
  choice: 所谓
  rationale: 以简洁自然的中文标示这是被如此称说的名称，同时不判定究竟是对方的自称，还是说话者讽刺性的反称。
- source_word: οὐ βάλλω ἐφ’ ὑμᾶς ἄλλο βάρος
  choice: 我不把别的重担加在你们身上
  rationale: 自然表达βάλλω ἐπί的“加在……身上”，并保留βάρος“重担”所含外加要求或义务的意象。
theological_decisions:
- issue: “所谓撒但深奥之事”的所指与语气
  choice: 以“所谓‘撒但深奥之事’”保留转述和讽刺两种可能
  alternative: 明确译作假教师自称掌握“深奥之事”，而约翰判定其源于撒但；或明确视整句为约翰的讽刺称呼
  rationale: 希腊文表达压缩而带论战色彩，不能确定称呼的准确发言者及范围；译文不替原文消除这种含混。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“至于……我告诉你们”重现话语对象转换；用破折号式插入结构的功能改为“就是……”展开，以免中文主干过度拥挤。
