  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἀλλὰ ἔχω κατὰ σοῦ ὅτι ἀφεῖς τὴν ⸀γυναῖκα Ἰεζάβελ, ἡ ⸀λέγουσα ἑαυτὴν προφῆτιν, καὶ διδάσκει καὶ πλανᾷ τοὺς ἐμοὺς δούλους πορνεῦσαι καὶ φαγεῖν εἰδωλόθυτα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/020.yaml
  text: 'But I have this against you: you tolerate the woman Jezebel[c][b][a], who calls herself a prophetess and teaches and deceives my slaves to commit sexual immorality and to eat food sacrificed to idols.'
translation:
  language: zh_hans
  text: 但有一件事我要责备你：你容忍那女人耶洗别[a]；她自称是女先知[b]，却教导并迷惑[c]我的奴仆，使他们行淫乱，吃祭献给偶像的食物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“你的妻子耶洗别”，而非“那女人耶洗别”。
    reason: textual_variant
  - marker: b
    text: 或译：“她声称自己是女先知”。
    reason: lexical_alternative
  - marker: c
    text: “迷惑”也可译作“引人走入歧途”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: 但
  rationale: 承接上文的称许并转入责备，保留鲜明的转折。
- source_word: ἔχω κατὰ σοῦ
  choice: 有一件事我要责备你
  rationale: 按现代汉语自然表达这一指控性习语，并以“一件事”承接后面的内容从句。
- source_word: ἀφεῖς
  choice: 你容忍
  rationale: 此处指任由有害的教导和行为继续存在，含有应受责备的纵容意味。
- source_word: τὴν γυναῖκα Ἰεζάβελ
  choice: 那女人耶洗别
  rationale: 贴近所给主文本“女人耶洗别”，不把异文“你的妻子耶洗别”纳入正文。
- source_word: ἡ λέγουσα ἑαυτὴν προφῆτιν
  choice: 她自称是女先知
  rationale: 保留身份出于她自己的宣称，也明确表达原文阴性名词。
- source_word: διδάσκει καὶ πλανᾷ
  choice: 教导并迷惑
  rationale: 保留两个并列的现在时动词；“迷惑”兼具欺骗和使人偏离正道的含义。
- source_word: τοὺς ἐμοὺς δούλους
  choice: 我的奴仆
  rationale: “奴仆”既保留属于主、受主支配的关系，也比现代社会身份词“奴隶”更符合庄重的经文语域。
- source_word: πορνεῦσαι
  choice: 使他们行淫乱
  rationale: 概括原词所指的不正当性行为，并借“使他们”清楚表达两个不定式所表示的受迷惑后果。
- source_word: φαγεῖν εἰδωλόθυτα
  choice: 吃祭过偶像的食物
  rationale: 以自然现代汉语说明食物与偶像祭祀的关联。
theological_decisions:
- issue: “耶洗别”的身份
  choice: 正文只保留“耶洗别”这一称呼
  alternative: 将其明确解释为真实姓名，或明确解释为借用旧约人物的象征性称号
  rationale: 本节本身不能确定这是本名还是象征性称呼，因此不在译文中消解这一开放性。
- issue: δοῦλος的译法
  choice: 我的奴仆
  alternative: 我的仆人；我的奴隶
  rationale: “奴仆”保留归属和受支配的意味，同时在现代中文圣经语域中庄重可懂；不把关系弱化为一般受雇服务。
- issue: 淫乱与祭偶像之物的关系
  choice: 保留为两个并列行为
  alternative: 把两者合并解释为同一种宗教性背叛的象征
  rationale: 原文并列两个不定式，可能涉及实际行为，也可能具有更广的宗教意涵；译文不预先裁定。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“行淫乱”保持经文语体；“祭过偶像的食物”避免生硬的名词堆叠。所有脚注标记均置于所说明词语之后。
