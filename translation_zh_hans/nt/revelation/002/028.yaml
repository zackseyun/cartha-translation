  rationale: 修订以“从我父亲那里”取代较古典的“从我父”，并补出由紧邻上下文明示、但希腊文在本节省略的“这权柄”，以使现代汉语句法完整。保留分号，表明“正如……一样”的比较是承接前文关于权柄的应许，而“赐给他晨星”是随后独立展开的应许。脚注仅作可能性提示，保留“晨星”的多重经文共鸣。
