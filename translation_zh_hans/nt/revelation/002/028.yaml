  naturalness: “从我父领受”偏古典且在现代标准汉语中略显生硬；“从我父亲那里领受”更自然。原草稿的“还要”容易把连接词理解为额外、递进的“还”，而本句仅需表达未来的另一应许，改为“也要”更顺畅。
  terminology: “父亲”“领受”“权柄”“赐给”和“晨星”均庄重、现代且适合本段启示文学的语体。“晨星”保留其未界定的象征性；脚注不将其身份或意义定为唯一解释。
