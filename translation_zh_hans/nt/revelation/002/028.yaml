  text: ὡς κἀγὼ εἴληφα παρὰ τοῦ πατρός μου, καὶ δώσω αὐτῷ τὸν ἀστέρα τὸν πρωϊνόν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/028.yaml
  text: just as I also have received from my Father[a], and I will give him the morning star.
translation:
  language: zh_hans
  text: 正如我也从我父亲那里领受了这权柄一样；我也要把晨星[a]赐给他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“黎明之星”。这一说法可能暗指弥赛亚王权的意象，也可能预示启示录22:16；在那里，耶稣称自己为“明亮的晨星”。
    reason: 说明词语的另一译法及其可能的弥赛亚王权和经内呼应，同时不在正文中确定该意象的唯一含义。
lexical_decisions:
- source_word: ὡς
  choice: 正如……一样
  rationale: 明确表达与上文应许之间的比较和对应关系，同时保持现代汉语的自然表达。
- source_word: κἀγὼ
  choice: 我也
  rationale: 保留καὶ ἐγώ中第一人称代词的强调及“也”的附加、对应意味，但不作过度强化。
- source_word: εἴληφα
  choice: 领受了
  rationale: “领受”适合表示所得来自父，避免“取得”可能带出的主动夺取意味；句末“了”表达已经领受并构成当前对应关系。
- source_word: παρὰ τοῦ πατρός μου
  choice: 从我父
  rationale: παρά加属格在此表示来源；“我父”直接保留原文的父子关系，不添加教义性解释。
- source_word: καὶ δώσω αὐτῷ
  choice: 我还要……赐给他
  rationale: “要”表达将来，“赐给”符合应许和赏赐语境；“还”承接上文的应许，也体现καί的连接和附加作用。
- source_word: τὸν ἀστέρα τὸν πρωϊνόν
  choice: 晨星
  rationale: 这是简洁、自然且庄重的现代汉语表达，完整保留原文意象，不在正文中预先界定其象征含义。
theological_decisions:
- issue: “晨星”的身份和象征意义
  choice: 正文仅译作“晨星”，不明确定义所指。
  alternative: 将其解释为弥赛亚君王的得胜、末世荣耀，或基督自己。
  rationale: 本节没有直接解释这一意象。保留隐喻可维持原文的丰富含义和神学张力；脚注仅提示可能的经内关联。
- issue: “从我父领受”所表达的基督论关系
  choice: 直接译作“从我父领受了”，不补充所领受之物，也不解释这种领受的教义性质。
  alternative: 补译为“从我父领受了权柄”，或进一步说明为受托的权柄。
  rationale: 原文本节没有重复宾语，而是依靠上文语境理解。直译既保留父子关系和领受语言，也避免把后来的神学说明写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“正如……一样”保留比较结构；分号显示前半句与上文紧密相连，同时使后一个应许清楚展开。脚注标记紧随“晨星”，与注释内容准确对应。
