  text: καὶ ὑπομονὴν ἔχεις, καὶ ἐβάστασας διὰ τὸ ὄνομά μου, καὶ ⸂οὐ κεκοπίακες⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/003.yaml
  text: And you have endurance[a], and have borne up for my name[b], and have not grown weary.
translation:
  language: zh_hans
  text: 你有坚忍，也曾为我的名[a]而忍受，并且没有疲倦[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为我的名”或“为了我的名”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“没有变得疲乏”；本句也可理解为“没有因劳苦而疲倦”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπομονὴν
  choice: 坚忍
  rationale: 指人在考验或压力下坚定持守、持续忍耐。“坚忍”简洁庄重，兼顾忍耐与坚定，不把含义限缩为被动等待。
- source_word: ἔχεις
  choice: 你有
  rationale: 直接表达现在时的称许，说明受话者现今具有这种坚忍。
- source_word: ἐβάστασας
  choice: 曾……忍受苦难
  rationale: βαστάζω可指背负、承受或忍受。此处与“为我的名”及上下文中的坚忍相连，所承受的是压力或苦难；补出“苦难”使现代汉语完整自然，同时不限定苦难的具体形式。
- source_word: διὰ τὸ ὄνομά μου
  choice: 为我的名
  rationale: διά加宾格在此可表示缘由或目的。“为我的名”保留圣经中因忠于耶稣之名而承受苦难的凝练表达，也保留“因为”与“为了”的语义空间。
- source_word: οὐ κεκοπίακες
  choice: 没有疲倦
  rationale: κοπιάω既可指劳苦，也可指因劳苦而疲倦。这里的否定式与坚忍、承受相呼应；“没有疲倦”保留持续未曾疲乏退缩的状态，又不把词义完全锁定为“劳作”。
theological_decisions:
- issue: 称许中受苦与坚忍的具体所指
  choice: 表达他们为耶稣的名持续承受苦难，却不说明苦难属于哪一种逼迫、事奉或劳作。
  alternative: 可将末句较具体地理解为“没有因劳苦而疲倦”，或把整节限定为遭受逼迫。
  rationale: 原文称许他们在压力下坚忍，却没有明确说明苦难的形式；译文因此保留其广度，不引入特定的逼迫观、事奉观或报偿观。
- issue: διὰ τὸ ὄνομά μου所表达的是原因还是目的
  choice: 正文采用兼具缘由和忠诚意味的“为我的名”。
  alternative: “因为我的名”或“为了我的名”。
  rationale: διά加宾格可依语境表达缘由或目的；不宜在正文中无必要地排除其中一种关系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“坚忍”与“忍受苦难”分别对应ὑπομονή和βαστάζω，既保留两者联系，也避免完全用同一词抹平差异。所有脚注标记均置于相关正文之后。
