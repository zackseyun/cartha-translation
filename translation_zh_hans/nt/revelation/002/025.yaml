  text: πλὴν ὃ ἔχετε κρατήσατε ἄχρι οὗ ἂν ἥξω.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/025.yaml
  text: Nevertheless[a], hold fast what you have until I come.
translation:
  language: zh_hans
  text: 不过[a]，你们已经有的，务要持守，直到我来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不过”或译“只是”；全句也可译：“只是，你们已经有的，务要持守，直到我来。”
    reason: πλὴν 在这里既可表达转折，也可表达限制。
lexical_decisions:
- source_word: πλὴν
  choice: 不过
  rationale: 此词承接上文，带有限定兼转折的作用。“不过”在现代汉语中自然、庄重，也保留了原文可理解为“但”或“只是”的语义幅度。
- source_word: ὃ ἔχετε
  choice: 你们已经有的
  rationale: 中性关系代词与“有”构成概括性表达，指他们目前所有、所持守的内容；不具体补明所指，以保留原文的概括性。
- source_word: κρατήσατε
  choice: 务要持守
  rationale: 该命令式要求坚定保有。“持守”准确表达牢牢守住所拥有之物的意思；“务要”体现命令和劝勉的力度。
- source_word: ἄχρι οὗ ἂν
  choice: 直到
  rationale: 自然表达以将来的来到为时间界限，无须译出较繁复的“直到……的时候”。
- source_word: ἥξω
  choice: 我来
  rationale: 简明保留“来到”的意义及其末世性回响，同时不把这次来临明确限定为末日再来或针对教会的审判临到。
theological_decisions:
- issue: 耶稣所说的“我来”是特指最终的末世再来，还是较广义地指向这间教会施行审判或临到
  choice: 只译为“直到我来”，不说明来临的方式或时间性质。
  alternative: 直到我来施行审判／直到我最终再来
  rationale: 希腊原文在本节没有明确界定这次“来”的性质；保持简洁可保留原文的神学张力，避免解释性定论。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“持守”保留启示文学劝勉语气；“务要”强化命令力度而不增加具体神学内容。脚注标记置于全句之后，对应整句开头连接词的另一种理解。
