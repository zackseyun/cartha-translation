  text: Οἶδά ⸀σου τὴν θλῖψιν καὶ τὴν πτωχείαν, ἀλλὰ πλούσιος εἶ, καὶ τὴν βλασφημίαν ἐκ τῶν λεγόντων Ἰουδαίους εἶναι ἑαυτούς, καὶ οὐκ εἰσίν, ἀλλὰ συναγωγὴ τοῦ Σατανᾶ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/009.yaml
  text: I know your affliction and your poverty—but you are rich—and the slander of those who say that they are Jews and are not[b][a], but are a synagogue of Satan.
translation:
  language: zh_hans
  text: 我知道你的患难和贫穷——然而你是富足的——也知道来自那些自称是犹太人、却不是犹太人的人的毁谤[a]；他们乃是撒但的会堂[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“亵渎的话”。这里指针对信徒的敌意诋毁，因此正文译作“毁谤”。
    reason: lexical_alternative
  - marker: b
    text: “会堂”也可译作“集会”或“群体”；这里的词不一定只指一座建筑物。
    reason: lexical_alternative
lexical_decisions:
- source_word: θλῖψιν
  choice: 患难
  rationale: 指压力、困苦或受压迫的处境；“患难”庄重自然，也避免把此处限定为某个特定的末世时期。
- source_word: πτωχείαν
  choice: 贫穷
  rationale: 直接表达物质匮乏，不以“赤贫”等词额外强化程度。
- source_word: πλούσιος
  choice: 富足
  rationale: 与“贫穷”形成鲜明反差；不添加“属灵上”，以保留原文未加限定的含义和张力。
- source_word: βλασφημίαν
  choice: 毁谤
  rationale: 本处语境是针对信徒的敌意诋毁；“毁谤”比现代汉语中的“亵渎”更准确地传达针对人的恶意言论。
- source_word: ἐκ τῶν λεγόντων
  choice: 那些自称……之人的
  rationale: ἐκ 表明毁谤的来源，λεγόντων 在此指“那些声称的人”；中文以所属结构自然表达其来源。
- source_word: Ἰουδαίους εἶναι ἑαυτούς
  choice: 自称是犹太人
  rationale: 忠实保留“犹太人”这一明确用词，并以“自称”自然表达反身结构，不加入“真”或“属灵”等原文没有的限定。
- source_word: συναγωγὴ
  choice: 会堂
  rationale: 在本语境中保留犹太群体及其聚会的历史特指，同时脚注说明该词也可指集会或群体。
- source_word: τοῦ Σατανᾶ
  choice: 撒但的
  rationale: 直接保留属格的强烈表达，不软化为较宽泛的关联，也不扩写为解释性措辞。
theological_decisions:
- issue: 如何翻译“自称是犹太人、其实不是”这一争议性表述
  choice: 照原文保留“犹太人”，不加“真正的”“属灵的”等限定
  alternative: 自称是上帝子民的人；自称是真犹太人的人
  rationale: Ἰουδαίους 明确指“犹太人”。译文应保留原文的论争张力，既不把它改写成民族身份的全面否定，也不借增词替经文预先界定何谓身份真实。
- issue: 是否说明“富足”是属灵意义
  choice: 正文只译“然而你是富足的”
  alternative: 然而你在属灵上是富足的
  rationale: 上下文暗示这不是物质财富，但原文没有限定语；不明说“属灵上”，可保留其含蓄性。
- issue: 如何处理“撒但的会堂”
  choice: 保留这一直接而尖锐的原文表达
  alternative: 属于撒但的群体；撒但的集会
  rationale: 直译保存历史语境、词汇双关空间和论争力度；脚注提示 συναγωγή 的词义范围，避免将“会堂”误解为只指建筑物。
translation_notes:
  register: 采用现代、庄重而清楚的标准普通话。以破折号保留“贫穷—富足”的插入式强烈对照；后半句略作中文句法调整，以免长串修饰语生硬。所有解释性限定均留在脚注或翻译说明中，不写入正文。
