id: REV.2.7
reference: Revelation 2:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις. τῷ νικῶντι δώσω αὐτῷ φαγεῖν ἐκ τοῦ ξύλου τῆς ζωῆς, ὅ ἐστιν ἐν τῷ παραδείσῳ τοῦ ⸀θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/007.yaml
  text: The one who has an ear[a], let him hear what the Spirit says to the churches. To the one who conquers I will give to eat from the tree of life, which is in the paradise of God.
translation:
  language: zh_hans
  text: 有耳的，就应当听圣灵向众教会所说的话。得胜的[a]，我必赐他从生命树上吃；这树在上帝的乐园里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“胜过的”。
    reason: νικάω可译为“胜过”或“得胜”；正文采用“得胜”以保留启示录中的胜利意象，并维持中文圣经语体的自然表达。
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: 有耳的
  rationale: 保留原文单数“耳”和名词化分词的概括性用法；这是自然、庄重的汉语劝诫句式。
- source_word: ἀκουσάτω
  choice: 就要听
  rationale: 表达第三人称命令式的劝诫力量，比单纯陈述性的“会听”更准确，也比生硬的“让他听”更符合现代汉语。
- source_word: τὸ πνεῦμα
  choice: 圣灵
  rationale: 启示录二至三章反复出现的公式表明这里所指的是圣灵；汉语不能靠首字母大写标示专名，因此译作“圣灵”。
- source_word: λέγει ταῖς ἐκκλησίαις
  choice: 对众教会所说的话
  rationale: “对”准确表达间接受词，“众教会”保留复数，并使整句符合现代汉语表达。
- source_word: τῷ νικῶντι
  choice: 得胜的人
  rationale: 保留现在分词所指持续争战而得胜的人，并承接启示录中的胜利意象；“得胜”在中文圣经语体中自然且广为理解。
- source_word: δώσω αὐτῷ φαγεῖν
  choice: 我必让他吃
  rationale: 希腊文直译为“我必赐给他去吃”，在汉语中以“我必让他吃”自然表达所赐的许可和恩典，避免不通顺的逐词对应。
- source_word: ἐκ τοῦ ξύλου τῆς ζωῆς
  choice: 生命树上的果子
  rationale: ἐκ表示取自这棵树；汉语说“吃树上的果子”最自然。“果子”虽未明说，却是“从树上吃”在上下文中必然包含的对象。
- source_word: παραδείσῳ
  choice: 乐园
  rationale: 在末世和创世记互文背景下，“乐园”比普通的“园子”更能保留παράδεισος的内涵。
- source_word: τοῦ θεοῦ
  choice: 上帝的
  rationale: 以简洁的所属结构表达希腊文属格，不额外限定其关系。
theological_decisions:
- issue: τὸ πνεῦμα所指为何
  choice: 圣灵
  alternative: 灵
  rationale: 七封信反复使用“圣灵对众教会所说的话”这一神圣宣告公式；译作“圣灵”是依上下文确认所指，并非加入原文没有的教义说明。
- issue: νικάω在应许公式中的译法
  choice: 得胜
  alternative: 战胜；胜过
  rationale: “得胜”既保留胜利意象，又在现代中文中自然；脚注列出同一词在争战语境下可能采用的其他表达，不限定得胜所针对的对象。
- issue: 单数概括性表达
  choice: 有耳的……得胜的人……他
  alternative: 凡有耳的人……他们
  rationale: 保留原文单数形式及其代表所有人的概括作用；中文“的／人”本身不标示性别，而后文“他”自然回指单数人物。
- issue: 生命树可食之物是否明说
  choice: 生命树上的果子
  alternative: 从生命树上吃
  rationale: 原文只说“从生命树吃”，没有明说果子；然而中文若不补出可食对象会显得残缺。“果子”使隐含意义清楚，但不改变生命树本身作为来源的重点。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“有耳的，就要听”保留启示录反复劝诫的凝练节奏；“众教会”体现复数而不显冗长。脚注标记紧随其所说明的“得胜的人”，避免与前半句误配。
