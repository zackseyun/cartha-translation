id: REV.17.16
reference: Revelation 17:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ τὰ δέκα κέρατα ἃ εἶδες καὶ τὸ θηρίον, οὗτοι μισήσουσι τὴν πόρνην, καὶ ἠρημωμένην ποιήσουσιν αὐτὴν καὶ ⸀γυμνήν, καὶ τὰς σάρκας αὐτῆς φάγονται, καὶ αὐτὴν κατακαύσουσιν ἐν πυρί·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/016.yaml
  text: And the ten horns that you saw[a], and the beast—these will hate the prostitute, and they will make her desolate and naked, and they will eat her flesh[b], and they will burn her up with fire.
translation:
  language: zh_hans
  text: 你所看见的那十个角和那兽——他们必恨这妓女，使她荒凉、赤身露体[a]，又要吃她的肉[b]，用火把她烧尽。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“赤裸”；这里含有被公开暴露、受羞辱的意味。
    reason: lexical_alternative
  - marker: b
    text: 这里原文直说“肉”；在《启示录》的象征性异象中，这一画面描绘彻底而暴烈的毁灭。
    reason: cultural_note
lexical_decisions:
- source_word: κέρατα
  choice: 角
  rationale: 直译启示文学中的象征形象，不在本节中提前解释为“王”或“权势”；其所指在上下文中另有说明。
- source_word: θηρίον
  choice: 兽
  rationale: 保留启示文学中这一象征的形象和凶险意味，也符合《启示录》中文表达的连贯性。
- source_word: πόρνην
  choice: 妓女
  rationale: 这是现代汉语对该词清楚、直接的对应，既保留人物化的象征，也不在正文中把她直接解释为城市或制度。
- source_word: μισήσουσι
  choice: 必恨
  rationale: 准确表达将来时及 μισέω 的基本含义；“必”自然传达预告语气。
- source_word: ἠρημωμένην ποιήσουσιν
  choice: 使她荒凉
  rationale: 保留使役和结果状态，并维持原文把人物形象与荒凉审判意象并置所产生的张力。
- source_word: γυμνήν
  choice: 赤身露体
  rationale: 对应“赤裸”的直接含义，同时以自然、庄重的现代汉语表现公开暴露与受辱的意味。
- source_word: σάρκας
  choice: 她的肉
  rationale: 按字面保留 σάρξ 的血肉意象，不弱化为“身体”，也不强化改写为“吞灭”。
- source_word: φάγονται
  choice: 要吃
  rationale: 采用 ἐσθίω 的基本义“吃”，保留原文刻意而强烈的暴力画面。
- source_word: κατακαύσουσιν ἐν πυρί
  choice: 用火把她烧尽
  rationale: “烧尽”体现 κατακαίω 较强的彻底焚烧含义，“用火”自然对应 ἐν πυρί。
- source_word: οὗτοι
  choice: 他们
  rationale: 破折号后的“他们”作为复指成分，回指“十个角和那兽”，既反映原文强调性的复指代词和复数动词，也符合现代汉语习惯。
theological_decisions:
- issue: “十个角和那兽”与复数代词、动词之间的关系
  choice: 译作集合主语，并以破折号后的复数“他们”加以强调性复指。
  alternative: 删去复指，直接译成“十个角和那兽必……”；或把兽理解为十角的同位成分。
  rationale: 希腊文用阳性复数 οὗτοι 和复数动词统摄“十个角……和那兽”。保留复指既反映原文结构，也呈现这些联合行动者共同攻击妓女。
- issue: 妓女遭毁灭的意象性质
  choice: 正文保留妓女、吃肉和焚烧等启示文学意象，不直接解释其象征所指。
  alternative: 在正文中把妓女改译或解释为某座城、某种制度或权势。
  rationale: 本节以象征性的审判图像叙述毁灭；翻译应保存原文的隐喻及神学张力，而不把一种解释写入正文。
translation_notes:
  register: 采用现代、清楚而庄重的标准普通话。“妓女”比传统的“淫妇”更直接对应职业称谓，也避免额外加入主要指向性道德标签；“荒凉、赤身露体”保留原文中城市废墟意象与人格受辱意象的并置。破折号帮助读者把握希腊文的强调性复指结构。
