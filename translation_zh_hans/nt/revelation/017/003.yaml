source:
  edition: SBLGNT
  text: καὶ ἀπήνεγκέν με εἰς ἔρημον ἐν πνεύματι. καὶ εἶδον γυναῖκα καθημένην ἐπὶ θηρίον κόκκινον, ⸀γέμοντα ὀνόματα βλασφημίας, ⸀ἔχων κεφαλὰς ἑπτὰ καὶ κέρατα δέκα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/003.yaml
  text: And he carried me away in the Spirit into a wilderness. And I saw a woman sitting on a scarlet beast[a], full of blasphemous names, having seven heads and ten horns.
translation:
  language: zh_hans
  text: 天使就在灵里把我带到一片旷野。[a]我看见一个女人坐在一头朱红色的兽上；那兽满是亵渎的名号，有七个头、十只角。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在灵里”也可理解为“在圣灵里”。这个希腊语短语在《启示录》中常用来引出异象经历，既可表示处于属灵状态，也可强调圣灵的带领。
    reason: 保留ἐν πνεύματι在属灵状态与圣灵带领之间的真实歧义。
lexical_decisions:
- source_word: ἀπήνεγκέν
  choice: 带我……来到
  rationale: 表达从一处被带往另一处的动作，符合异象中被带到某地的语境，同时保持现代汉语自然流畅。主语依上文明确为天使，故译出“天使”。
- source_word: εἰς ἔρημον
  choice: 来到一片旷野
  rationale: ἔρημος可指旷野、荒野或荒凉之地；原文无冠词，译作“一片旷野”不将其限定为某个特定地点，也避免误解为纯粹的沙漠。
- source_word: ἐν πνεύματι
  choice: 在灵里
  rationale: 保留原文可指属灵状态、也可指圣灵带领的歧义；启示录中此短语常用于引出异象经历。
- source_word: γυναῖκα καθημένην ἐπὶ θηρίον
  choice: 一个女人坐在一头……兽上
  rationale: 直接保留女人位于兽上这一异象画面，不把“坐”解释性改译为“驾驭”或“骑乘”。
- source_word: θηρίον κόκκινον
  choice: 一头朱红色的兽
  rationale: θηρίον在启示录中是固定的异象用语，译作“兽”；κόκκινον指鲜明的红色，以“朱红色”准确传达其色彩和庄重语体。
- source_word: γέμοντα ὀνόματα βλασφημίας
  choice: 满是亵渎的名号
  rationale: 保留γέμω“充满”的意义，并将属格短语自然译为带有亵渎性质的名号，不擅自说明这些名号的具体内容或对象。
- source_word: ἔχων κεφαλὰς ἑπτὰ καὶ κέρατα δέκα
  choice: 有七个头、十只角
  rationale: 按原文直接呈现兽的两个特征，保留启示文学的象征图像，不在正文中加以解释。
theological_decisions:
- issue: ἐν πνεύματι所指为何
  choice: 正文译作“在灵里”，保留指向属灵状态或圣灵带领的开放性
  alternative: 明确译作“在圣灵里”或“在异象中”
  rationale: 希腊文不以大小写标示是否专指圣灵；该短语在启示录中常引出先知性异象，但若直接译作“在圣灵里”或“在异象中”，都会比原文更明确，因此以脚注说明可能含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“一片旷野”“朱红色的兽”“亵渎的名号”兼顾原文形式与现代汉语习惯；不提前解释女人、兽、七头或十角的象征意义。
