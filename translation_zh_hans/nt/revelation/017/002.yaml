  text: μεθ’ ἧς ἐπόρνευσαν οἱ βασιλεῖς τῆς γῆς, καὶ ἐμεθύσθησαν οἱ κατοικοῦντες τὴν γῆν ἐκ τοῦ οἴνου τῆς πορνείας αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/002.yaml
  text: with whom the kings of the earth committed sexual immorality[d][c][b][a], and those who dwell on the earth became drunk from the wine of her sexual immorality.
translation:
  language: zh_hans
  text: 地上的君王曾跟她行淫[a]；住在地上的人[b]也因她淫乱[c]的酒而醉了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“行淫”很可能象征腐败、偶像崇拜或不忠的勾结，同时仍保留原文强烈的性隐喻。
    reason: cultural_note
  - marker: b
    text: 或译：“地上的居民”。
    reason: lexical_alternative
  - marker: c
    text: 或译：“她卖淫的酒”。
    reason: lexical_alternative
lexical_decisions:
- source_word: μεθ’ ἧς
  choice: 跟她
  rationale: 关系代词回指上一节的女人；现代汉语用“跟她”自然表达共同关系，同时不改变所指。
- source_word: ἐπόρνευσαν
  choice: 行淫
  rationale: “行淫”保留明确的性意象，也容许其在启示录语境中承载偶像崇拜、政治勾结和不忠等象征意义，不在正文中过早限定解释。
- source_word: οἱ βασιλεῖς τῆς γῆς
  choice: 地上的君王
  rationale: 保留启示录反复出现的“地上”用语及其广泛、世界性的指向；“君王”符合庄重的现代汉语圣经语体。
- source_word: ἐμεθύσθησαν
  choice: 醉了
  rationale: 希腊语不定过去时被动式在此描述进入醉酒状态；“因……而醉了”既符合现代汉语，也保留酒所造成的结果。
- source_word: οἱ κατοικοῦντες τὴν γῆν
  choice: 住在地上的人
  rationale: 按动词结构翻译这一启示录中的惯用表达，较“地上的居民”更贴近原文形式，同时自然易懂。
- source_word: ἐκ τοῦ οἴνου
  choice: 因……的酒
  rationale: ἐκ在这里表示来源或原因；汉语以“因……而醉了”清楚表达酒是致醉的来源，同时保留酒的比喻。
- source_word: τῆς πορνείας αὐτῆς
  choice: 她淫乱的
  rationale: “淫乱”与前面的“行淫”保持词义关联，保留性方面的隐喻及其较宽语义；“卖淫”也可能，但会更明确地将重点落在妓女形象上。
theological_decisions:
- issue: 是否在正文中把 πορνεύω/πορνεία 明说为偶像崇拜或政治宗教上的不忠
  choice: 保留“行淫／淫乱”的性意象，不作解释性改写
  alternative: 译作“在偶像崇拜的勾结中对上帝不忠”或“犯属灵的奸淫”
  rationale: 启示录有意借性方面的语言表达宗教、政治及盟约上的腐败与不忠。保留隐喻可维持原文的象征张力，不把多层意义缩减为单一解释。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“行淫”“淫乱”保留启示文学的鲜明意象；分号呈现两个并列分句，“因……而醉了”则自然表达原文ἐκ所含的来源或原因关系。
