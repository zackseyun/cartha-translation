id: REV.17.4
reference: Revelation 17:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἡ γυνὴ ἦν περιβεβλημένη πορφυροῦν καὶ κόκκινον, ⸀καὶ κεχρυσωμένη ⸀χρυσίῳ καὶ λίθῳ τιμίῳ καὶ μαργαρίταις, ἔχουσα ποτήριον χρυσοῦν ἐν τῇ χειρὶ αὐτῆς γέμον βδελυγμάτων καὶ τὰ ἀκάθαρτα τῆς πορνείας αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/004.yaml
  text: And the woman was clothed in purple and scarlet[a], and adorned with gold and precious stones and pearls, holding in her hand a golden cup full of abominations and the unclean things of her sexual immorality.
translation:
  language: zh_hans
  text: 那女人身穿紫色和朱红色的衣服，又用金子、宝石和珍珠装饰；她手中拿着一个金杯，杯中盛满了可憎之物和她淫乱的污秽之物。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “她淫乱的污秽之物”也可理解为“与她淫乱有关的不洁之物”。“淫乱”也可译作“卖淫”或“性方面的不道德”；在《启示录》中，这个词可以同时带有实际和象征性的含义。
    reason: 保留 τὰ ἀκάθαρτα τῆς πορνείας αὐτῆς 属格关系的开放性，并说明 πορνεία 可兼具字面和象征性含义。
lexical_decisions:
- source_word: περιβεβλημένη
  choice: 身穿……衣服
  rationale: 与ἦν构成迂回表达，描述女人穿着后的状态；此译法保留结果状态，又符合现代汉语习惯。
- source_word: πορφυροῦν καὶ κόκκινον
  choice: 紫色和朱红色衣服
  rationale: 两个形容词承接穿着概念，分别指奢华、显贵的紫色和鲜明的朱红色；补出“衣服”使汉语自然。
- source_word: κεχρυσωμένη
  choice: 装饰
  rationale: 表示以贵重材料装点自身；译为“装饰”比“镀金”更能容纳金子、宝石和珍珠并列作装饰物的语境。
- source_word: χρυσίῳ καὶ λίθῳ τιμίῳ καὶ μαργαρίταις
  choice: 用金子、宝石和珍珠
  rationale: 保留材料或手段关系；λίθῳ τιμίῳ虽为单数形式，在清单中可作类别性集合理解，汉语“宝石”不标单复数，恰好保留这种开放性。
- source_word: ποτήριον χρυσοῦν
  choice: 一个金杯
  rationale: 直接保留名词及其材质修饰，简洁自然。
- source_word: γέμον
  choice: 盛满了
  rationale: 描述杯中充满某物；“盛满了”符合容器语境，并保留充盈的画面。
- source_word: βδελυγμάτων
  choice: 可憎之物
  rationale: 既传达强烈的道德和宗教厌恶色彩，也比“憎恶”作为抽象名词更贴合复数事物。
- source_word: τὰ ἀκάθαρτα
  choice: 污秽
  rationale: 中性复数实词化，兼有不洁事物及污秽内涵；汉语集合名词“污秽”自然，并保留礼仪与道德不洁的语感。
- source_word: πορνείας
  choice: 淫乱
  rationale: 在启示录语境中既可指实际的性不道德，也可象征偶像崇拜和属灵不忠；“淫乱”能承载这两层力量，且为现代读者易懂。
theological_decisions:
- issue: πορνεία在象征性启示文学中兼具实际性行为与属灵不忠的可能
  choice: 淫乱
  alternative: 卖淫；性方面的不道德；属灵淫乱
  rationale: “淫乱”既不把图像限缩为商业性卖淫，也不直接添加“属灵”而替读者解释象征，因而保留原文在字面与隐喻之间的张力。
- issue: τὰ ἀκάθαρτα τῆς πορνείας αὐτῆς的属格关系
  choice: 她淫乱所产生的污秽
  alternative: 她淫乱中的污秽；她淫乱的污秽之物
  rationale: “所产生的”把属格理解为来源或结果，使汉语清楚顺畅；脚注同时说明原文关系较宽，可作“她淫乱的污秽”直译，避免把语法关系绝对化。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“朱红色”“可憎之物”“淫乱”保留启示文学强烈、浓重的意象；避免古奥的“披戴”“妆饰”，也不在正文中直接释为偶像崇拜。脚注标记置于相关分句末，正文与脚注相互对应。
