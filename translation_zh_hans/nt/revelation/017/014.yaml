id: REV.17.14
reference: Revelation 17:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οὗτοι μετὰ τοῦ ἀρνίου πολεμήσουσιν, καὶ τὸ ἀρνίον νικήσει αὐτούς, ὅτι κύριος κυρίων ἐστὶν καὶ βασιλεὺς βασιλέων, καὶ οἱ μετ’ αὐτοῦ κλητοὶ καὶ ἐκλεκτοὶ καὶ πιστοί.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/014.yaml
  text: These will make war against the Lamb[a], and the Lamb will conquer them, because he is Lord of lords and King of kings, and those with him are called and chosen and faithful.
translation:
  language: zh_hans
  text: 这些人要与羔羊争战[a]，羔羊必胜过他们，因为他是万主之主、万王之王；那些与他同在的人，是蒙召的、蒙拣选的、忠信的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“要与羔羊争战”；这里的意思是向羔羊发动争战。
    reason: 说明μετά加属格的字面形式与争战语境中的敌对含义。
lexical_decisions:
- source_word: οὗτοι
  choice: 这些人
  rationale: 保留指示代词的回指作用，指向上文与兽结盟的众王；比单用“他们”更贴近原文。
- source_word: μετὰ τοῦ ἀρνίου πολεμήσουσιν
  choice: 要与羔羊争战
  rationale: μετά加属格字面为“与……”，但与πολεμέω连用时，语境明确表示敌对交战。中文“与……争战”既自然表达敌对关系，也较贴近原文形式。
- source_word: ἀρνίον
  choice: 羔羊
  rationale: 这是《启示录》中指向基督的标志性称号；采用通行而庄重的“羔羊”。
- source_word: νικήσει
  choice: 必胜过
  rationale: νικάω是《启示录》的主题词之一；“胜过”既适合争战语境，也有助于保持书内用语的一致性。
- source_word: κύριος κυρίων
  choice: 万主之主
  rationale: 希伯来式最高级称号，表示至高无上的主权；“万主之主”是现代中文中凝练而庄重的表达。
- source_word: βασιλεὺς βασιλέων
  choice: 万王之王
  rationale: 表示凌驾于一切君王之上的王权，与“万主之主”形成对称。
- source_word: οἱ μετ’ αὐτοῦ
  choice: 那些与他同在的人
  rationale: 自然呈现实词化的冠词加介词短语，不额外界定这些人的身份。
- source_word: κλητοὶ
  choice: 蒙召的
  rationale: 保留新约中κλητός的神学和词汇共鸣，同时不把“召”具体限定为邀请或有效呼召。
- source_word: ἐκλεκτοὶ
  choice: 蒙拣选的
  rationale: 准确表达被拣选的含义，并避免用可能带有较强教义系统色彩的术语来替代原文。
- source_word: πιστοί
  choice: 忠信的
  rationale: πιστός在此既可涉及信实、忠诚，也可能含有信靠的意味；“忠信”较能保留这种语义幅度。
theological_decisions:
- issue: 羔羊的称号与得胜语言
  choice: 译为“羔羊必胜过他们”
  alternative: “羔羊必征服他们”或“羔羊必战胜他们”
  rationale: 保留《启示录》独特的基督论称号，并以“胜过”呼应νικάω在全书中的反复使用，不额外增添教义解释。
- issue: κλητοὶ καὶ ἐκλεκτοὶ καὶ πιστοί三项描述的关系
  choice: 译为“是蒙召的、蒙拣选的、忠信的”
  alternative: “就是蒙召、蒙拣选并且忠心的人”或“蒙召、被选、相信的人”
  rationale: 按原文并列保留三个描述，不将其解释为救恩次序，也不预先解决πιστοί究竟侧重信靠、忠诚还是信实的问题。
- issue: 末句与前句的句法关系
  choice: 用分号连接，并保留独立陈述：“那些与他同在的人，是……”
  alternative: 补成“与他同在的蒙召、蒙拣选、忠信之人也必得胜”
  rationale: 原文末句没有明说“也必得胜”或为前句动词补足共同主语；译文避免加入省略内容的一种特定解释，从而保留句法张力。
translation_notes:
  register: 采用现代、庄重且易懂的书面普通话。“争战”“羔羊”“万主之主、万王之王”保持启示文学的崇高语体；末句重复“的”以清楚保留三个并列称谓。
