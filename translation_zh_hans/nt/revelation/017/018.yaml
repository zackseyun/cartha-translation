  text: καὶ ἡ γυνὴ ἣν εἶδες ἔστιν ἡ πόλις ἡ μεγάλη ἡ ἔχουσα βασιλείαν ἐπὶ τῶν βασιλέων τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/018.yaml
  text: And the woman whom you saw is the great city that has dominion over the kings of the earth[a].
translation:
  language: zh_hans
  text: 你所看见的那女人，就是那座拥有统治地上众王的王权的大城。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那座在地上的众王之上拥有国度的大城。”原文直译为“拥有王权（或国度）”；此处也可指掌有统治权。
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: 女人
  rationale: 此处指异象中象征性的女性形象，不是婚姻关系中的“妻子”，因此译作“女人”最自然，也最少加入解释。
- source_word: ἣν εἶδες
  choice: 你所看见的
  rationale: 准确表达关系从句，直接指向约翰先前在异象中看见的女人，符合现代汉语庄重而自然的表达。
- source_word: πόλις ἡ μεγάλη
  choice: 那座大城
  rationale: πόλις通常指“城、城市”，μέγας在此为“大”；加量词“座”使现代汉语自然，并以“那”体现定指。
- source_word: ἔχουσα βασιλείαν
  choice: 她统治着
  rationale: 原文直译为“拥有王权/国度”。结合其后“在地上众王之上”，这里强调实际掌有统治权；“统治着”清楚自然，同时将较直译的可能性保留在脚注中。
- source_word: βασιλεία
  choice: 统治权（在正文中以‘统治’表达）
  rationale: 该词可指国度、王权或统治。此处与ἐπί加属格连用，重点更可能是对众王拥有的统治权，而非疆域性的国家。
- source_word: ἐπὶ τῶν βασιλέων
  choice: 着……众王
  rationale: ἐπί加属格在此表达居于其上、对其拥有权势；汉语用“统治着……众王”自然传达这种支配关系。
- source_word: τῆς γῆς
  choice: 地上的
  rationale: 《启示录》的语境具有普世、末世性的范围，“地上”比特定地域意义的“那地”更合适，也符合汉语圣经语体。
theological_decisions:
- issue: 女人与大城之间的关系
  choice: 译作“那女人，就是那座大城”
  alternative: 译作“那女人代表那座大城”
  rationale: 原文使用简单系词ἔστιν（“是”），作直接的象征性等同。保留“就是”而不改为“代表”，可避免把解释写入正文，并保存异象语言本身的张力。
- issue: βασιλεία在此指国度还是统治权
  choice: 正文按“统治权”理解，译为“她统治着”
  alternative: 直译为“她拥有一个凌驾于地上众王之上的国度”或“她在地上的众王之上拥有王权”
  rationale: 上下文中的ἐπὶ τῶν βασιλέων强调对众王的权势，因此动态表达“统治着”最为清楚；但βασιλεία本身仍可有“国度、王权”之义，故以脚注保存词义空间。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“你所看见的……就是……”保留原文直接认定的句式；分号帮助读者辨明“那座大城”与后续关系分句。正文中的“她”承接象征性的女人，也使汉语表达流畅。脚注标记[a]已在正文中出现。
