id: REV.17.11
reference: Revelation 17:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ τὸ θηρίον ὃ ἦν καὶ οὐκ ἔστιν. καὶ ⸀αὐτὸς ὄγδοός ἐστιν καὶ ἐκ τῶν ἑπτά ἐστιν, καὶ εἰς ἀπώλειαν ὑπάγει.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/011.yaml
  text: And the beast that was and is not is itself an eighth and is from the seven[b][a], and it goes to destruction.
translation:
  language: zh_hans
  text: 那曾经有、如今没有的兽，它本身是第八个[a]，又出自那七个[b]，并且走向灭亡。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“它本身是第八个王。”上下文暗含的名词可能是“王”，但希腊文在本句没有明说。
    reason: alternative_reading
  - marker: b
    text: 或译：“是那七个中的一个。”希腊文直译为“出自那七个”，可能表示来源、归属或密切关联。
    reason: lexical_alternative
lexical_decisions:
- source_word: θηρίον
  choice: 兽
  rationale: 《启示录》中这一词是带有末世异象色彩的固定象征用语；“兽”简洁庄重，也保留了其怪异、敌对的象征力量。
- source_word: ὃ ἦν καὶ οὐκ ἔστιν
  choice: 曾经有、如今没有
  rationale: 保留希腊文“曾有而现今没有”的鲜明对照，并以自然的现代汉语交代时间关系，不解释其具体存在状态。
- source_word: αὐτὸς
  choice: 它本身
  rationale: 体现强调语气；指代“兽”而不额外断定这是男性人物。
- source_word: ὄγδοός
  choice: 第八个
  rationale: 希腊文只有序数词，没有明说所修饰的名词；“第八个”保留省略，不在正文中补入“王”。
- source_word: ἐκ τῶν ἑπτά
  choice: 出自那七个
  rationale: 贴近ἐκ所表达的来源或关联，同时不把含义限定为“七个中的一个”。
- source_word: εἰς ἀπώλειαν
  choice: 走向灭亡
  rationale: ἀπώλεια在此指最终的毁灭；“灭亡”清楚、庄重，并符合末世审判的语境。
- source_word: ὑπάγει
  choice: 走向
  rationale: 保留现在时所呈现的动态趋向，也与方向短语“灭亡”自然搭配。
theological_decisions:
- issue: 是否补出“第八个王”
  choice: 正文仅译“第八个”
  alternative: 第八个王
  rationale: 上文谈到众王，因此“王”很可能是语境中隐含的名词；但本节希腊文没有出现βασιλεύς，正文保留其简约和象征性含混，脚注说明可补出的理解。
- issue: ἐκ τῶν ἑπτά是否明确译为“七个中的一个”
  choice: 译作“出自那七个”
  alternative: 是那七个中的一个
  rationale: 该短语可表示来源、归属或密切关联；不宜在正文中把它限定为某一种具体关系。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“曾经有、如今没有”保留原文刻意形成的对照；“第八个”有意不补名词，“出自那七个”有意保留关系上的歧义。
