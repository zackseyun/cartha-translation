id: REV.17.12
reference: Revelation 17:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ τὰ δέκα κέρατα ἃ εἶδες δέκα βασιλεῖς εἰσιν, οἵτινες βασιλείαν οὔπω ἔλαβον, ἀλλὰ ἐξουσίαν ὡς βασιλεῖς μίαν ὥραν λαμβάνουσιν μετὰ τοῦ θηρίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/012.yaml
  text: And the ten horns that you saw are ten kings[a], who have not yet received a kingdom, but they receive authority as kings for one hour with the beast.
translation:
  language: zh_hans
  text: 你所看见的十个角，就是十个王。他们还没有得国，却与那兽一同以王的身份领受权柄，为时一个时辰[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“短暂的一段时间。”在启示文学的图像中，“一个时辰”很可能表示短暂而有限的时期。
    reason: 说明μίαν ὥραν既保留为“一个时辰”的字面表达，也可能具有象征性的短暂时间含义。
lexical_decisions:
- source_word: κέρατα
  choice: 角
  rationale: 按字面译为“角”，保留启示文学的象征图像；下文直接说明这些角是王，无须在正文中释作“势力”。
- source_word: βασιλεῖς
  choice: 王
  rationale: 这是该词的基本含义；虽然经文中的王可能具有象征意义，但译文不将其解释性改写为“统治者”或“政权”。
- source_word: βασιλείαν
  choice: 国
  rationale: “得国”是自然而凝练的汉语表达，指获得国度或王权领域，同时与后面的“权柄”保持词义区分。
- source_word: οὔπω ἔλαβον
  choice: 还没有得
  rationale: 准确表达尚未发生而与当前异象有关的状态；“得”与“国”搭配自然。
- source_word: ἐξουσίαν
  choice: 权柄
  rationale: 表达被授予的统治权限，并与前面的“国”区分；“权柄”也符合启示录庄重的语体。
- source_word: ὡς βασιλεῖς
  choice: 作王
  rationale: 自然表达他们以王的身份行使所领受的权柄，避免“像王一样”可能暗示他们并非真正以王的身份掌权。
- source_word: μίαν ὥραν
  choice: 一个时辰
  rationale: 保留原文“一小时”的启示文学表达；现代汉语圣经语体中的“一个时辰”既可指一小时，也能承载象征性的短暂时段。
- source_word: λαμβάνουσιν
  choice: 领受
  rationale: 保留希腊文现在时的直接陈述，不在正文中明确改成将来时；上下文中的“还没有”已显示其相对于异象的时间关系。
- source_word: μετὰ τοῦ θηρίου
  choice: 与那兽一同
  rationale: 表达与兽同时并联合领受权柄的关系；“那兽”承接本章异象中已经出现的特指对象。
- source_word: θηρίου
  choice: 兽
  rationale: 采用启示录中这一形象的常用译法，保留其象征性，不解释性扩展为具体政治实体。
theological_decisions:
- issue: 十个王应在正文中理解为字面君王，还是象征性的统治者或政权
  choice: 正文译作“十个王”，保留原文的直接称谓及其启示文学张力。
  alternative: 十个统治者、十个政权或十股政治势力
  rationale: 希腊文明确称其为“十个王”，而上下文又明显具有象征性。翻译不应替读者预先确定这些王的具体历史或政治身份。
- issue: “一个时辰”是字面的一小时，还是象征短暂而有限的时期
  choice: 正文保留“一个时辰”，脚注说明可能指短暂时期。
  alternative: 片刻、短暂的一段时间
  rationale: 原文明确使用“一小时”，但在启示文学中很可能强调时间短暂且受限；正文与脚注共同保存这两层可能性。
- issue: λαμβάνουσιν的现在时是否应按语境译成将来时
  choice: 译作“领受”，不明确加上“将要”。
  alternative: 将要领受、会领受
  rationale: 前句“还没有得国”使未来指向成为可能，但希腊文使用现在时，可能属于异象叙述中的生动现在时。译文保留这种时间张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“得国”“权柄”“作王”保持经文语体的凝练；分成两句以提升可读性。脚注标记置于“一个时辰”之后，使其所说明的词语清楚明确。
