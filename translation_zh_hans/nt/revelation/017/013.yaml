  text: οὗτοι μίαν ⸂γνώμην ἔχουσιν⸃, καὶ τὴν δύναμιν ⸀καὶ ἐξουσίαν αὐτῶν τῷ θηρίῳ διδόασιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/013.yaml
  text: These are of one mind[a], and they give their power and authority to the beast.
translation:
  language: zh_hans
  text: 他们心意一致[a]，把自己的力量和权柄交给那兽。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们有同一个目的。”希腊原文直译为“他们有一个心意”，可表示共同的看法、决心或目的。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτοι
  choice: 他们
  rationale: 指回前文的十王。现代汉语用“他们”自然承接所指对象，无须生硬译作“这些”。
- source_word: μίαν γνώμην ἔχουσιν
  choice: 同心同意
  rationale: 原文直译为“有一个心意/意见”，可表示共同的看法、决心或目的。“同心同意”保留其一致性及意向色彩，同时以脚注说明可能的译法。
- source_word: δύναμιν
  choice: 能力
  rationale: 此处指可以实际施展的力量或实力；译作“能力”并与“权柄”区分。
- source_word: ἐξουσίαν
  choice: 权柄
  rationale: 表示行使统治的权利或权限；“权柄”在庄重而通俗的圣经语体中能与“能力”形成清楚区别。
- source_word: τὴν δύναμιν καὶ ἐξουσίαν αὐτῶν
  choice: 自己的能力和权柄
  rationale: 保留两个相关但不相同的概念，并用“自己的”自然表达共同的属格关系。
- source_word: τῷ θηρίῳ
  choice: 给那兽
  rationale: “兽”是《启示录》中该末世异象角色的惯常称呼；“那”体现原文定冠词及特指作用。
- source_word: διδόασιν
  choice: 交给
  rationale: 现在时在异象叙述中表达正在陈述的行动。“交给”比单纯的“给”更自然地表现他们将能力和权柄置于兽手中的行为，又不额外断定是否永久转让。
theological_decisions:
- issue: μίαν γνώμην ἔχουσιν 在末世政治语境中的含义
  choice: 同心同意
  alternative: 有同一个目的；意见一致
  rationale: 该短语可涵盖共同意见、决心或目的。“同心同意”不把语义限缩为其中一项，并由脚注保留更偏向共同目的的理解。
- issue: 区分 δύναμις 与 ἐξουσία
  choice: 能力和权柄
  alternative: 力量和权力；实力和统治权
  rationale: 分别呈现实际施展的力量与行使统治的权限，避免把二者合并成单一概念。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“同心同意”保留原文习语的宽度；“能力和权柄”维持两个希腊词之间的语义区别。
