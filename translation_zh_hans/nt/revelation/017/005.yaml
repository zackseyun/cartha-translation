  text: καὶ ἐπὶ τὸ μέτωπον αὐτῆς ὄνομα γεγραμμένον, μυστήριον, Βαβυλὼν ἡ μεγάλη, ἡ μήτηρ τῶν πορνῶν καὶ τῶν βδελυγμάτων τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/005.yaml
  text: 'And on her forehead a name was written: Mystery[a], Babylon the Great, the mother of prostitutes and of the abominations of the earth.'
translation:
  language: zh_hans
  text: 她的额头上写着一个名字：“奥秘[a]，大巴比伦，地上的妓女和可憎之物的母亲。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“她的额头上写着一个名字，一个奥秘：‘大巴比伦，地上的妓女和可憎之物的母亲。’”这种理解把“奥秘”看作引出这个名字象征意义的说明，而不是铭文本身的一部分。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπὶ τὸ μέτωπον αὐτῆς
  choice: 她额上
  rationale: 按空间意义直译，并采用自然、凝练的现代汉语表达，保留名字写在额上的异象画面。
- source_word: ὄνομα γεγραμμένον
  choice: 写着一个名字
  rationale: γεγραμμένον具有被动和完成后持续的结果意味；“写着”在汉语中自然地呈现名字已写在额上的状态。
- source_word: μυστήριον
  choice: 奥秘
  rationale: 此处可视为额上所写名称的一部分。“奥秘”既符合启示文学语域，也比“秘密”更能保留其象征性和神学意味。
- source_word: Βαβυλὼν ἡ μεγάλη
  choice: 大巴比伦
  rationale: 保留专名“巴比伦”，并以汉语惯用次序表达ἡ μεγάλη这一称号。
- source_word: ἡ μήτηρ
  choice: 母
  rationale: 在整个铭文式称号中用“母”简洁庄重；其定指性由上下文和称号结构自然体现。
- source_word: τῶν πορνῶν
  choice: 众淫妇
  rationale: πόρνη指从事卖淫的女子，也承载先知文学中属灵淫乱的意象。“淫妇”保留原文强烈的性与道德象征；“众”体现复数和类属意义。
- source_word: τῶν βδελυγμάτων
  choice: 可憎之物
  rationale: βδέλυγμα指令人厌恶、尤其与偶像崇拜或道德污秽相关的事物。“可憎之物”保留圣经语域，也避免将其范围过早限定。
- source_word: τῆς γῆς
  choice: 地上
  rationale: 在《启示录》的普世性语境中，γῆ宜指全地；“地上”自然地统摄“众淫妇”和“可憎之物”。
theological_decisions:
- issue: μυστήριον是铭文的一部分，还是引出其象征意义的叙述性标签
  choice: 将“奥秘”列为额上铭文的一部分：“奥秘，大巴比伦……”
  alternative: 理解为“写着一个名字，一个奥秘：大巴比伦……”，即“奥秘”不是名字本身，而是对下文象征名称的说明。
  rationale: 希腊原文没有足以排除任一理解的标点。词序容许将μυστήριον视为铭文的一部分，同时另一种句法理解也成立，因此正文采用前者，并用脚注保留后者。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文，保留启示文学中铭文式称号的凝练和震撼力。标点属于句法解释，正文与脚注共同保存原文的真实歧义。
