id: REV.17.1
reference: Revelation 17:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ ἦλθεν εἷς ἐκ τῶν ἑπτὰ ἀγγέλων τῶν ἐχόντων τὰς ἑπτὰ φιάλας, καὶ ἐλάλησεν μετ’ ἐμοῦ λέγων· Δεῦρο, δείξω σοι τὸ κρίμα τῆς πόρνης τῆς μεγάλης τῆς καθημένης ἐπὶ ⸀ὑδάτων πολλῶν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/001.yaml
  text: Then one of the seven angels who had the seven bowls came and spoke with me[a], saying, “Come[b], I will show you the judgment of the great prostitute who sits on many waters,”
translation:
  language: zh_hans
  text: 随后，那拿着七个碗的七位天使中，有一位前来对我说：“来吧！我要把那坐在众水之上的大淫妇所受的审判[a]指给你看。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “审判”也可理解为“定罪”或“刑罚”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: 随后
  rationale: 承接前文并推进叙事，比直译为“并且”更符合现代汉语，同时保留连接作用。
- source_word: ἦλθεν
  choice: 前来
  rationale: 表达天使来到约翰这里的叙事动作，自然且庄重。
- source_word: εἷς ἐκ τῶν ἑπτὰ ἀγγέλων
  choice: 七位天使中，有一位
  rationale: 准确表达希腊语的部分关系，并符合汉语语序。
- source_word: τῶν ἐχόντων τὰς ἑπτὰ φιάλας
  choice: 那拿着七个碗的
  rationale: 关系性分词短语用于限定前文七位天使；“碗”与启示录中盛载灾殃的器皿意象一致。
- source_word: ἐλάλησεν μετ’ ἐμοῦ λέγων
  choice: 对我说
  rationale: 希腊语字面近于“与我说话，说道”；汉语合并为“对我说”更自然，不损失实际语义。
- source_word: Δεῦρο
  choice: 来吧
  rationale: 保留召唤语气；“吧”使现代汉语表达自然，但不将其弱化为纯粹建议。
- source_word: δείξω σοι
  choice: 我要……指给你看
  rationale: 直接体现将来时与展示动作；“指给你看”适合异象将被揭示的语境。
- source_word: τὸ κρίμα
  choice: 所受的审判
  rationale: κρίμα可涵盖司法判决及其惩罚性后果；“审判”保留其语义宽度，“所受的”清楚表明审判临到该妇人。
- source_word: τῆς πόρνης τῆς μεγάλης
  choice: 大淫妇
  rationale: “淫妇”是现代中文圣经及先知性意象中可理解、庄重而有力度的表达，保留该词的性与不忠隐喻；不具体断定其象征对象。
- source_word: τῆς καθημένης ἐπὶ ὑδάτων πολλῶν
  choice: 坐在众水之上的
  rationale: 按原文保留超现实的异象图景，不提前用后文解释替换“众水”。
theological_decisions:
- issue: 如何翻译象征巴比伦的 πόρνη
  choice: 大淫妇
  alternative: 大妓女
  rationale: “大淫妇”保留先知传统中性不忠与属灵、政治腐败的强烈隐喻，也较适合庄重经文语体；不借翻译限定巴比伦具体指谁。
- issue: 如何理解末世审判语境中的 κρίμα
  choice: 审判
  alternative: 定罪；刑罚
  rationale: “审判”可兼容裁决过程、定罪判决和惩罚结果，不把原文可能包含的语义范围过早收窄。
- issue: ἐπὶ ὑδάτων πολλῶν 的空间关系
  choice: 坐在众水之上
  alternative: 坐在众水旁边
  rationale: “之上”最直接保留ἐπί与异象本身的奇特画面，并与本章后文对象征的解释相衔接。
translation_notes:
  register: 采用现代、庄重、易懂的标准普通话。“众水”略带经文诗性，用以保留启示文学意象；整体避免过度古雅。脚注标记[a]已置于“审判”之后。
