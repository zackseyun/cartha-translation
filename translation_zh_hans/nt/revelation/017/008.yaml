  naturalness: 句法流畅，庄重而符合现代标准汉语。“住在地上的人，就是那些……”清楚表达原文的限定关系；“会因……而惊奇”也自然。将“无底深渊”改为“深渊”后，整体更简洁且避免不必要的解释性增添。
  terminology: “兽”“生命册”“灭亡”“住在地上的人”均适合《启示录》的庄重、连贯用语。“深渊”更贴近ἄβυσσος的基本词义；不必在正文固定为“无底深渊”。脚注应保留ὅτι可作原因或内容的句法歧义，并说明παρέσται可指来到、出现或临在。
