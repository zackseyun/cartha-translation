revisions:
- from: 你所看见的兽，先前有，如今没有，将要从无底深渊上来，又走向灭亡。住在地上的人，就是那些从创世以来名字没有记在生命册上的人，看见那兽时，会因它先前有、如今没有、将要出现而惊奇。[a]
  to: 你所看见的兽，先前有，如今没有，将要从深渊上来，又走向灭亡。住在地上的人，就是那些从世界奠基以来名字没有记在生命册上的人，看见那兽时，会因它先前有、如今没有、将要出现而惊奇。[a]
  rationale: 仅作谨慎的词义收敛：以“深渊”对应ἄβυσσος，避免正文把“无底”作为原文已明说的限定；并将“从创世以来”调整为“从世界奠基以来”，更直接反映ἀπὸ καταβολῆς κόσμου。其余保留原译的句法取向、重复节奏和脚注歧义处理。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:21:19Z'
