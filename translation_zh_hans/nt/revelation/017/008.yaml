id: REV.17.8
reference: Revelation 17:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: τὸ θηρίον ὃ εἶδες ἦν καὶ οὐκ ἔστιν, καὶ μέλλει ἀναβαίνειν ἐκ τῆς ἀβύσσου, καὶ εἰς ἀπώλειαν ⸀ὑπάγει· καὶ ⸀θαυμασθήσονται οἱ κατοικοῦντες ἐπὶ τῆς γῆς, ὧν οὐ γέγραπται ⸂τὸ ὄνομα⸃ ἐπὶ τὸ βιβλίον τῆς ζωῆς ἀπὸ καταβολῆς κόσμου, βλεπόντων ⸂τὸ θηρίον ὅτι ἦν⸃ καὶ οὐκ ἔστιν καὶ παρέσται.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/008.yaml
  text: The beast that you saw was[a], and is not, and is about to come up out of the abyss and go to destruction. And those who dwell on the earth, whose name has not been written in the book of life from the foundation of the world, will marvel when they see the beast[c][b], because it was and is not and will be present.
translation:
  language: zh_hans
  text: 你所看见的兽，先前有，如今没有，将要从深渊上来，又走向灭亡。住在地上的人，就是那些从世界奠基以来名字没有记在生命册上的人，看见那兽时，会因它先前有、如今没有、将要出现而惊奇。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句也可译作：“他们看见那兽先前有、如今没有、将要来到，就会惊奇。”希腊语ὅτι既可表示原因（“因为”），也可引出所看见的内容（“看见……先前有、如今没有、将要……”）；“将要出现”也可译作“将要来到”或“将要临在”。
    reason: alternative_reading
lexical_decisions:
- source_word: θηρίον
  choice: 兽
  rationale: “兽”是《启示录》中自然、庄重且一贯的译法，保留其凶猛、怪异和象征意味，不弱化为泛指的“动物”。
- source_word: ἦν καὶ οὐκ ἔστιν
  choice: 先前有，如今没有
  rationale: 保留“有／没有”的鲜明对照；加入“先前、如今”使汉语时态关系清楚，同时不把它解释为死亡、复活等原文未明说的概念。
- source_word: μέλλει ἀναβαίνειν
  choice: 将要……上来
  rationale: “将要”表达 μέλλει 所指的即将发生，“上来”保留 ἀναβαίνειν 的向上运动，也符合现代汉语。
- source_word: ἄβυσσος
  choice: 无底深渊
  rationale: 准确传达启示文学中的深渊意象；比单用“深渊”更能体现该词在本书语境中的特殊含义，又不采用较生硬的传统措辞。
- source_word: εἰς ἀπώλειαν ὑπάγει
  choice: 走向灭亡
  rationale: 保留介词结构所表达的趋向以及最终毁灭的结局，汉语自然且不使用较古旧的“沉沦”。
- source_word: θαυμασθήσονται
  choice: 会……惊奇
  rationale: 表达因所见之事而震惊、诧异；“惊奇”比“赞叹”更中性，避免暗示赞许。
- source_word: οἱ κατοικοῦντες ἐπὶ τῆς γῆς
  choice: 住在地上的人
  rationale: 保留《启示录》中反复出现的固定表达及其群体身份色彩，同时符合现代汉语。
- source_word: ὧν οὐ γέγραπται τὸ ὄνομα
  choice: 那些……名字没有记……的人
  rationale: 依照希腊文保留集合性单数“名字”，在汉语中可自然地理解为每个人的名字。
- source_word: ἐπὶ τὸ βιβλίον τῆς ζωῆς
  choice: 记在生命册上
  rationale: 汉语习惯说名字“记在册上”；“生命册”准确而简洁地传达 βιβλίον τῆς ζωῆς。
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: 从创世以来
  rationale: 自然传达自世界奠基之时起的时间含义，并保留其神学分量。
- source_word: βλεπόντων
  choice: 看见……时
  rationale: 将属格分词自然地译为时间从句，明确惊奇发生于看见那兽之时。
- source_word: ὅτι ἦν καὶ οὐκ ἔστιν καὶ παρέσται
  choice: 因它先前有、如今没有、将要出现
  rationale: 正文将 ὅτι 理解为原因，引出他们惊奇的缘由；“将要出现”以普通现代汉语表达 παρέσται 的未来临到或在场之意，脚注保留另一种句法理解和词义表达。
theological_decisions:
- issue: “从创世以来”的修饰范围
  choice: 连接“名字没有记在生命册上”
  alternative: 把该短语与其他经文中的被杀等概念联系起来
  rationale: 本节希腊文的词序和句法最自然地使该时间短语修饰“没有记”；译文不据此进一步建立原文未明说的预定论体系。
- issue: ὅτι 的句法功能
  choice: 在正文中取原因义：“因……”
  alternative: 取内容义：“看见那兽先前有、如今没有、将要出现”
  rationale: 原因义能自然说明地上居民为何惊奇，但内容义在语法上也成立，故在脚注中明确保留。
- issue: παρέσται 的含义
  choice: 将要出现
  alternative: 将要来到／将要临在
  rationale: 该词是 πάρειμι 的将来时，可指到来或在场；“出现”在启示异象语境中通顺，但不将其扩展解释为复活，脚注保留更贴近字面的译法。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以短句保留原文反复出现的“先前有、如今没有”节奏；避免用“复活”等解释性神学词语。脚注标记已在正文相应位置标出。
