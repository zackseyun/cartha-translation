source:
  edition: SBLGNT
  text: οἱ πέντε ἔπεσαν, ὁ εἷς ἔστιν, ὁ ἄλλος οὔπω ἦλθεν, καὶ ὅταν ἔλθῃ ὀλίγον ⸂αὐτὸν δεῖ⸃ μεῖναι,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/010.yaml
  text: Five have fallen[a], one is, the other has not yet come; and when he comes, he must remain for a little while.
translation:
  language: zh_hans
  text: 五位已经倒下了[a]，一位还在，另一位还没有来；他来的时候，必须停留片刻。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 按上下文，也可明确译作：“五位王已经倒下了，一位王还在，另一位王还没有来。”
    reason: 说明省略成分及其上下文所指，同时不在正文中消除原文的简略表达。
lexical_decisions:
- source_word: οἱ πέντε
  choice: 五位
  rationale: 定冠词加数词回指上文的七位王；中文用量词“位”自然承接人物指称，同时不必在正文重复“王”。
- source_word: ἔπεσαν
  choice: 已经倾覆了
  rationale: πίπτω的简单过去时本义为“倒下”，在君王的异象语境中表示败亡或失势；“倾覆”既保留坠落意象，也适合政权人物的覆亡，且“已经……了”表达既成事实。
- source_word: ὁ εἷς ἔστιν
  choice: 一位还在
  rationale: 原文极为简练，直译近于“一位是/存在”；“还在”在现代汉语中自然表达其现今存在，又不擅自明确为“正在掌权”。
- source_word: ὁ ἄλλος
  choice: 另一位
  rationale: 指七位中与前述五位及现存一位相对的另一位，保留序列关系。
- source_word: οὔπω ἦλθεν
  choice: 还没有来
  rationale: 准确表达οὔπω与ἦλθεν所指尚未发生的到来，并保持异象语言的简洁。
- source_word: ὅταν ἔλθῃ
  choice: 他来的时候
  rationale: ὅταν加简单过去虚拟式表示未来发生之时；中文以“……的时候”自然表达，不强化不确定性。
- source_word: ὀλίγον
  choice: 片刻
  rationale: 该词在此作时间副词性用法，表示短暂时段；“片刻”简洁而庄重，不额外加入“只”所带的限制强调。
- source_word: αὐτὸν δεῖ μεῖναι
  choice: 必须停留
  rationale: δεῖ表示必要性，μεῖναι表示留下或持续停留；“必须停留”直接保留原文的必要性措辞，不解释其必要性的来源。
theological_decisions:
- issue: 七王意象的具体历史身份
  choice: 正文保留“五位、一位、另一位”的省略表达，不指认具体君王或帝国统治者。
  alternative: 正文明确译作“五位王已经倾覆，一位王还在，另一位王还没有来”，或进一步对应特定罗马皇帝。
  rationale: 上文已说明所指为王，但本节原文以冠词化数词简略回指。保留这种压缩表达可避免把有争议的历史解释写入译文。
- issue: ὁ εἷς ἔστιν的状态含义
  choice: 译为“一位还在”。
  alternative: 译为“一位正在掌权”或“一位仍然存在”。
  rationale: 原文只使用εἰμί，并未明说“掌权”；“还在”保留其当前存在的基本含义和解释空间。
- issue: δεῖ所表达的必要性
  choice: 译为“必须”，但不说明这是神命定、历史必然或其他性质的必要。
  alternative: 扩译为“按着神的旨意必须”。
  rationale: δεῖ确实表达必要性，但本句没有明示其来源；译文不应加入原文未明说的神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“倾覆”与启示文学语体相称；“还在”避免生硬的“一位是”，也不越界解释为“在位”。正文脚注标记[a]与脚注完全对应。
