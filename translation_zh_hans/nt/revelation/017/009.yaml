  text: Ὧδε ὁ νοῦς ὁ ἔχων σοφίαν. αἱ ἑπτὰ κεφαλαὶ ἑπτὰ ὄρη εἰσίν, ὅπου ἡ γυνὴ κάθηται ἐπ’ αὐτῶν. καὶ βασιλεῖς ⸂ἑπτά εἰσιν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/009.yaml
  text: 'Here is the mind that has wisdom: the seven heads are seven mountains on which the woman sits[a], and they are seven kings.'
translation:
  language: zh_hans
  text: 这里需要智慧的心思：七个头是七座山，那女人坐在这些山上[a]；七个头也是七个王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“七座山丘”。希腊语原词既可指山，也可指山丘；“山”是较直接的译法。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὧδε
  choice: 这里需要
  rationale: Ὧδε引出对异象的解释；结合下文的智慧要求，译为“这里需要”符合现代汉语表达，同时保留提示读者留意此处的作用。
- source_word: ὁ νοῦς ὁ ἔχων σοφίαν
  choice: 有智慧的心思
  rationale: νοῦς指理解、思考和辨识的心智；“有智慧的心思”保留原文结构与辨识异象所需智慧的含义，不将其窄化为单纯的知识或聪明。
- source_word: αἱ ἑπτὰ κεφαλαὶ
  choice: 七个头
  rationale: 保留启示文学中的象征形象，不预先解释其具体所指。
- source_word: ἑπτὰ ὄρη
  choice: 七座山
  rationale: ὄρη通常指山；量词“座”符合现代汉语。虽然也可指山丘，但不应在正文中直接限定为罗马的七丘。
- source_word: ὅπου ἡ γυνὴ κάθηται ἐπ’ αὐτῶν
  choice: 那女人坐在这些山上
  rationale: 将ὅπου与ἐπ’ αὐτῶν合并为自然汉语，避免直译产生“在那里……在它们上面”的重复，同时清楚保留女人坐在七山之上的空间关系。
- source_word: καὶ βασιλεῖς ἑπτά εἰσιν
  choice: 也就是七个王
  rationale: 原句承接“七个头”，继续给出对应关系。“也就是”在汉语中明确表达七个头同时对应七个王，并避免误读为另有一组七王。
theological_decisions:
- issue: 七个头的象征所指
  choice: 仅保留经文本身给出的双重对应：七个头是七座山，也是七个王。
  alternative: 把七座山明确解释为罗马七丘，或把七个王具体解释为某七位君王、某七个帝国。
  rationale: 原文提供象征对应，却未在本节明确锁定具体历史对象；译文不应替读者解决这一末世论与历史解释上的张力。
- issue: “山”与“山丘”的选择
  choice: 正文译作“山”，脚注保留“山丘”这一词义可能。
  alternative: 正文译作“七座山丘”，从而更明显地指向罗马。
  rationale: ὄρος的直接常见义是“山”，也可用于山丘；正文采用较直接且解释负担较小的译法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“这里需要有智慧的心思”保留启示文学对辨识力的呼召；后半句以“那女人坐在这些山上”消除希腊语结构直译在汉语中的累赘，并用“也就是”清楚连接七个头与七个王的象征对应。
