review_pass:
  verdict: revise
  source_fidelity: 草稿将未在本句明示的说话者补为“天使”，并把“淫妇坐着的众水”改述为“淫妇坐着的地方”，都超出了本句的表达。末项γλῶσσαι应保留为“语言”，不宜显化为“语言的人”。
  naturalness: “你所看见、那淫妇所坐的众水”在现代汉语中清楚自然，并准确保留原文关系从句的修饰关系。四项并列采用简洁、庄重的异象说明语体。
  terminology: “淫妇”保留原文的负面象征称谓；“万民、群众、列国和各种语言”分别对应λαοί、ὄχλοι、ἔθνη、γλῶσσαι，避免将“语言”解释性地替换为说该语言的人。
  issues:
  - severity: medium
    issue: 补入“天使”作为说话者
    rationale: 原文仅作“他对我说”，英语审计文本亦为“he says to me”。即便近文语境可能指天使，本节本身未明说，不应补入。
  - severity: medium
    issue: 将“那淫妇坐着的众水”改为“那淫妇坐着的地方”
    rationale: 原文的关系从句修饰“水”，不是把水转换成一个泛称的地点；修订应保留“众水”是被看见且被解释的对象。
  - severity: medium
    issue: 将γλῶσσαι译为“各种语言的人”
    rationale: 原文列举的是“语言”，其可具有转喻效果，但没有明说“人”；显化会缩窄并改变原文措辞。
  - severity: low
    issue: “众多的人”未充分体现ὄχλοι的群体义
    rationale: “群众”更直接对应“crowds/众人群”，也与“万民”形成可辨的并列层次。
