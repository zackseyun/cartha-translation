source:
  edition: SBLGNT
  text: Καὶ λέγει μοι· Τὰ ὕδατα ἃ εἶδες, οὗ ἡ πόρνη κάθηται, λαοὶ καὶ ὄχλοι εἰσὶν καὶ ἔθνη καὶ γλῶσσαι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/015.yaml
  text: And he says to me, “The waters that you saw, where the prostitute sits, are peoples and crowds and nations and languages.”
translation:
  language: zh_hans
  text: 他对我说：“你所看见、那淫妇所坐的众水，就是万民、群众、列国和各种语言。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: 说
  rationale: 历史现在时在现代汉语叙事中自然译为过去语境中的“说”，并以“又”承接前文。
- source_word: ἡ πόρνη
  choice: 那淫妇
  rationale: 保留启示录异象中直接而负面的象征称谓；“那”指向前文已出现的人物。
- source_word: λαοί
  choice: 各族人民
  rationale: 用复数化表达体现不同群体的人民，避免仅译“人民”而丢失复数层次。
- source_word: ὄχλοι
  choice: 众多的人
  rationale: 表达大批人群，与λαοί有所区分，同时符合普通现代汉语。
- source_word: ἔθνη
  choice: 各国
  rationale: 在与人民、人群、语言并列的世界性清单中，译为“各国”自然清楚。
- source_word: γλῶσσαι
  choice: 各种语言的人
  rationale: 原文直译为“语言”，但此处与人口群体并列，是以语言代指说不同语言的人；显化为“各种语言的人”可避免把抽象语言误当作水所象征的对象。
theological_decisions:
- issue: 众水所象征对象的范围
  choice: 保留“各族人民、众多的人、各国和各种语言的人”的四重并列
  alternative: 概括为“世界各地的人”
  rationale: 原文刻意铺陈普世性范围；不将其压缩，以保留异象解释的修辞力度。
- issue: 淫妇“坐着”与众水的空间关系
  choice: 译作“水，就是那淫妇坐着的地方”
  alternative: 译作“淫妇所管辖的水”
  rationale: 原文只陈述她坐在众水所在之处，并未在本句明说“管辖”，故不加入解释性神学含义。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“天使”由近距离语境补明说话者，使中文指代自然；全句保留异象解释的直陈语气。
