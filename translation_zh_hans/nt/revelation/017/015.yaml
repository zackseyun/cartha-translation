- from: 天使又对我说：“你所看见的水，就是那淫妇坐着的地方，是各族人民、众多的人、各国和各种语言的人。”
  to: 他对我说：“你所看见、那淫妇所坐的众水，就是万民、群众、列国和各种语言。”
  rationale: 修订撤除本句未明示的“天使”，恢复“众水”作为关系从句和解释句的中心对象，并按四项并列保留“语言”而不作解释性显化。
