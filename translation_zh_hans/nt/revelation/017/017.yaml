id: REV.17.17
reference: Revelation 17:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ γὰρ θεὸς ἔδωκεν εἰς τὰς καρδίας αὐτῶν ποιῆσαι τὴν γνώμην αὐτοῦ, καὶ ποιῆσαι ⸂μίαν γνώμην⸃ καὶ δοῦναι τὴν βασιλείαν αὐτῶν τῷ θηρίῳ, ἄχρι ⸀τελεσθήσονται οἱ λόγοι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/017.yaml
  text: For God put it into their hearts to carry out his purpose[a], and to act with one purpose and to give their kingdom to the beast[b], until the words of God are fulfilled.
translation:
  language: zh_hans
  text: 因为神使他们心里起意，去实行他的旨意，同心合意，并把他们的国权交给那兽，直到神的话都实现为止。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔδωκεν εἰς τὰς καρδίας αὐτῶν
  choice: 使他们心里起意
  rationale: 这是表示内在驱动的习语。译文保留“心里”的意象和神主动促成的语气，同时避免生硬直译为“给进他们的心里”。
- source_word: ποιῆσαι τὴν γνώμην αὐτοῦ
  choice: 实行他的旨意
  rationale: γνώμη在这里指意向、意旨或定意；“实行他的旨意”既表达实际执行，也不把其含义收窄为单纯的想法或意见。
- source_word: ποιῆσαι μίαν γνώμην
  choice: 同心合意
  rationale: 原文是压缩的表达，近于“形成一个意向”，指诸王有一致的意向并共同采取行动。“同心合意”是自然、庄重的现代汉语，并由脚注保留较直译的可能。
- source_word: δοῦναι τὴν βασιλείαν αὐτῶν
  choice: 把他们的国权交给
  rationale: βασιλεία可指国、统治或王权。上下文描述诸王把统治权交给兽，因此“国权”比“国”更清楚，同时保留共同权柄的集合意义。
- source_word: τῷ θηρίῳ
  choice: 那兽
  rationale: “兽”保留《启示录》一贯的象征意象；“那”对应定冠词，并指向上下文已出现的兽。
- source_word: ἄχρι τελεσθήσονται οἱ λόγοι τοῦ θεοῦ
  choice: 直到神的话都实现为止
  rationale: τελέω在这里表示达到完成、应验或实现；“实现”适合神所说之话在事件中成为事实，也保持自然现代汉语。
theological_decisions:
- issue: 神的主权与诸王的行动责任
  choice: 既明确说神使他们心里起意，也保留诸王同心行动并交出国权的主体性。
  alternative: 把神的作用弱化为仅仅“容许”，或用超出原文的决定论措辞强化神的操控。
  rationale: 原文同时陈述神的主动促成和诸王实际采取的行动；译文不消解这两方面之间的神学张力。
- issue: “神的话”实现的终末性语气
  choice: 译作“直到神的话都实现为止”。
  alternative: 译作“直到神的话都完成”或“都应验”。
  rationale: “实现”可涵盖完成和成为事实，不额外限定这些话全是预言，也保留其必然达到终点的含义。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“旨意”“国权”“那兽”保持《启示录》的郑重和象征语域；句式保留原文三个行动层次的推进关系。
