id: REV.17.7
reference: Revelation 17:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ εἶπέν μοι ὁ ἄγγελος· Διὰ τί ἐθαύμασας; ἐγὼ ἐρῶ σοι τὸ μυστήριον τῆς γυναικὸς καὶ τοῦ θηρίου τοῦ βαστάζοντος αὐτήν, τοῦ ἔχοντος τὰς ἑπτὰ κεφαλὰς καὶ τὰ δέκα κέρατα·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/007.yaml
  text: And the angel said to me[a], “Why did you marvel? I will tell you the mystery of the woman and of the beast that carries her, which has the seven heads and the ten horns.”
translation:
  language: zh_hans
  text: 天使对我说：“你为什么惊奇？我要把这女人和那托着她[a]、有七个头和十只角的兽的奥秘告诉你。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“承载着她”。
    reason: βαστάζω的意义范围包括托着、承载或负载；脚注保留这一词义层次。
lexical_decisions:
- source_word: ἐθαύμασας
  choice: 惊奇
  rationale: θαυμάζω在此表示因异象而惊讶、诧异；“惊奇”既保留强烈反应，也不把它弱化为单纯的疑问或好奇。
- source_word: μυστήριον
  choice: 奥秘
  rationale: μυστήριον指原本隐藏、如今将被揭示的实情；“奥秘”符合启示文学语境，不把它误解为仅供猜解的谜题。
- source_word: γυναικός
  choice: 女人
  rationale: γυνή虽也可指妻子，但这里是异象中的象征性人物，并无婚姻关系的含义。
- source_word: θηρίου
  choice: 兽
  rationale: θηρίον是《启示录》中反复出现的启示文学意象；“兽”保留其敌对、怪异的形象及书内用语的一致性。
- source_word: βαστάζοντος
  choice: 托着她
  rationale: βαστάζω可指携带、承托或负载；结合女人坐在兽上的异象，“托着她”清楚呈现两者的空间关系，同时不过度解释其象征意义。
- source_word: ἔχοντος
  choice: 有
  rationale: 分词修饰“兽”；汉语用“有七个头和十只角”自然简洁，并保留所属关系。
- source_word: κεφαλάς
  choice: 头
  rationale: 保留异象中明确的身体意象及其象征表达。
- source_word: κέρατα
  choice: 角
  rationale: 保留启示文学中的角之意象，不提前解释其象征所指。
- source_word: Διὰ τί
  choice: 为什么
  rationale: 准确、自然地表达原因问句。
- source_word: ἐρῶ σοι
  choice: 我要……告诉你
  rationale: 忠实表达λέγω的将来时及天使即将作出解释的语境；现代汉语中直接自然。
theological_decisions:
- issue: “有七个头和十只角”所修饰的对象
  choice: 明确修饰“兽”
  alternative: 在汉语中保留可能使其修饰女人或整个奥秘的松散结构
  rationale: τοῦ βαστάζοντος与τοῦ ἔχοντος在语法上都与θηρίου呼应，而不与阴性属格γυναικός呼应，因此应清楚表明是兽托着女人，并且兽有七头十角。
- issue: “奥秘”的数量与涵盖范围
  choice: 用一个“奥秘”统摄女人和兽
  alternative: 译为“女人的奥秘和兽的奥秘”，使之听来像两个彼此分开的奥秘
  rationale: 原文只有单数τὸ μυστήριον，后接两个由καί连接的属格成分；译文保留一个共同的奥秘，不把两者人为拆分。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“这女人”与“那……兽”使两个异象对象层次清楚；整句保留原文较长的解释性结构，但用汉语定语顺序确保修饰关系明确。
