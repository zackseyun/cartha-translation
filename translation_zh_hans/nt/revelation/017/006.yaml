revisions:
- from: 我又看见那女人喝圣徒的血和耶稣见证人[a]的血，竟然醉了。我看见她，就大为惊异。
  to: 我看见那女人因圣徒的血和耶稣的见证人的血而醉。我看见她，就大为惊异。
  rationale: 修订删除无对应的“又”，以“因……而醉”准确表达μεθύουσαν ἐκ τοῦ αἵματος所描写的状态，避免把状态扩展为明确的饮血动作或加入评价性语气；并将“耶稣见证人”改为自然且仍保留属格开放性的“耶稣的见证人”。脚注标记应置于正文“见证人”之后，完整经文可排作“……耶稣的见证人[a]的血……”。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:21:04Z'
review_pass:
  verdict: revise
  source_fidelity: “我又看见”中的“又”在本节希腊文没有对应词，增加了重复看见的意思。“喝……的血，竟然醉了”把女人的醉态改写为明确饮血的动作，并加入原文未明说的“竟然”。原文是她“因／由……的血而醉”的状态。
  naturalness: “耶稣见证人”在现代普通话中缺少必要的结构标记，读起来不够自然，且可能被误解为“耶稣所见证的人”。“耶稣的见证人”较自然，同时保留属格关系的适度开放性。
  terminology: “圣徒”“见证人”“殉道者”“大为惊异”均适合庄重的现代中文经文语体。脚注恰当地保留了μάρτυς在本语境中的“殉道者”含义。
  issues:
  - severity: medium
    issue: “又”无原文依据。
    rationale: καὶ仅为连接词；本节没有πάλιν等表示“又、再次”的词。
  - severity: high
    issue: “喝……的血，竟然醉了”增添了明确饮血动作及评价性“竟然”。
    rationale: μεθύουσαν ἐκ τοῦ αἵματος描述女人由血而醉的状态；虽保留骇人意象，但原文没有明说她正在喝血，也没有“竟然”的语义。
  - severity: medium
    issue: “耶稣见证人”不符合自然现代汉语的定中结构。
    rationale: 加“的”后更清楚自然，并仍可让“耶稣的见证人”保留原属格的关系张力。
  revised_text: 我看见那女人因圣徒的血和耶稣的见证人的血而醉。我看见她，就大为惊异。
  revised_footnotes:
  - marker: a
    text: “见证人”也可译作“殉道者”。希腊语原词可有这两种含义；这里既提到他们的血，“殉道者”的含义尤其贴切。
    reason: 保留μάρτυς在“见证人”与“殉道者”之间的词义张力。
  revision_rationale: 修订删除无对应的“又”，以“因……而醉”准确表达μεθύουσαν ἐκ τοῦ αἵματος所描写的状态，避免把状态扩展为明确的饮血动作或加入评价性语气；并将“耶稣见证人”改为自然且仍保留属格开放性的“耶稣的见证人”。脚注标记应置于正文“见证人”之后，完整经文可排作“……耶稣的见证人[a]的血……”。
