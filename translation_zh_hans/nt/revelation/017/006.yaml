source:
  edition: SBLGNT
  text: καὶ εἶδον τὴν γυναῖκα μεθύουσαν ἐκ τοῦ αἵματος τῶν ἁγίων ⸀καὶ ἐκ τοῦ αἵματος τῶν μαρτύρων Ἰησοῦ. Καὶ ἐθαύμασα ἰδὼν αὐτὴν θαῦμα μέγα·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/006.yaml
  text: And I saw the woman drunk with the blood of the saints and with the blood of the martyrs of Jesus. And seeing her[a], I marveled greatly.
translation:
  language: zh_hans
  text: 我看见那女人因圣徒的血和耶稣的见证人的血而醉。我看见她，就大为惊异。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεθύουσαν ἐκ τοῦ αἵματος
  choice: 喝……的血，竟然醉了
  rationale: 分词描述女人因血而醉的状态。中文若直译为“从血而醉”生硬；用“喝……的血，竟然醉了”自然保留了骇人的醉酒与血的意象，而“竟然”传达这一景象的反常和震撼，并未改变其基本意义。
- source_word: τῶν ἁγίων
  choice: 圣徒
  rationale: 在《启示录》中通常指归属上帝、分别为圣的子民。“圣徒”简洁、庄重，也是现代中文基督教语境中通行的称呼。
- source_word: τῶν μαρτύρων Ἰησοῦ
  choice: 耶稣见证人
  rationale: μάρτυς的词义核心是“见证人”，而流血的语境同时使“殉道者”之义十分贴切。“耶稣见证人”保留简练的属格结构，不完全限定为“为耶稣作见证的人”或“属于耶稣的见证人”；脚注说明殉道含义。
- source_word: ἐθαύμασα
  choice: 大为惊异
  rationale: θαυμάζω在这里表示强烈的惊奇或震撼，不必含有赞叹。“大为惊异”既自然庄重，也避免“希奇”等较陈旧表达。
- source_word: ἰδὼν αὐτὴν
  choice: 我看见她，就
  rationale: 将希腊语过去时分词自然转为中文的承接复句，清楚表达看见女人之后产生惊异。
- source_word: θαῦμα μέγα
  choice: 大为
  rationale: 这是与动词同源的宾格结构，用来强化惊异的程度；中文以程度补语“大为”自然表达这一强调。
theological_decisions:
- issue: 末世迫害语境中μάρτυρες的含义
  choice: 正文译作“见证人”，脚注注明“殉道者”这一语境义。
  alternative: 正文直接译作“殉道者”。
  rationale: 原词既可指作见证的人，也发展出因见证而死的殉道者之义。这里提到他们的血，殉道含义显然突出；但正文保留“见证人”，可保存《启示录》对“见证”的词汇联系，并用脚注呈现不能在单一译词中完整保留的语义。
- issue: Ἰησοῦ属格与μάρτυρες的关系
  choice: 译作紧凑的“耶稣见证人”。
  alternative: “为耶稣作见证的人”或“属于耶稣的见证人”。
  rationale: 希腊语属格本身可容纳归属耶稣、为耶稣作见证等相近理解。紧凑表达避免无根据地排除其中一种关系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“竟然醉了”保持异象的震撼感；“大为惊异”避免把约翰的反应误解为赞赏。脚注标记紧随存在词义歧义的“见证人”。
