  text: καὶ εἶδον τοὺς ἑπτὰ ἀγγέλους οἳ ἐνώπιον τοῦ θεοῦ ἑστήκασιν, καὶ ἐδόθησαν αὐτοῖς ἑπτὰ σάλπιγγες.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/002.yaml
  text: And I saw the seven angels who stand before God[a], and seven trumpets were given to them.
translation:
  language: zh_hans
  text: 我看见那站在上帝面前的七位天使[a]，七支号筒赐给了他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“那正站在上帝面前的七位天使”，也可理解为“那已经站在上帝面前的七位天使”；希腊语完成时强调他们已经站定，并持续处于站立的状态。
    reason: 说明ἑστήκασιν的完成时状态意义及可行译法。
lexical_decisions:
- source_word: εἶδον
  choice: 我看见
  rationale: 在异象叙事中自然表达不定过去时的所见，也保留约翰亲眼目睹的叙述力度。
- source_word: τοὺς ἑπτὰ ἀγγέλους
  choice: 那……七位天使
  rationale: 定冠词与数词指向一个特定群体；“那”体现其确定性，“位”适合有位格的天使。
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: 在上帝面前
  rationale: 简洁自然，并保留原文的空间与关系含义。
- source_word: ἑστήκασιν
  choice: 站
  rationale: 希腊语完成时在此着重持续至今的站立状态；汉语“站在”可自然表达这种状态，时态细节由脚注说明。
- source_word: ἐδόθησαν αὐτοῖς
  choice: 赐给了他们
  rationale: 保留原文被动表达和未明说的施予者；“赐”符合天上场景，但不擅自指明是谁所赐。
- source_word: ἑπτὰ σάλπιγγες
  choice: 七枝号筒
  rationale: “号筒”能表达启示文学中用于发出信号的吹奏器具，也避免现代管弦乐器“喇叭”可能带来的窄化；量词“枝”自然庄重。
theological_decisions:
- issue: 七位天使的身份与等级
  choice: 译作“那站在上帝面前的七位天使”，不进一步界定其等级。
  alternative: 译作“七位天使长”，或明确关联后来的七大天使传统。
  rationale: 原文使用ἀγγέλους，而非ἀρχαγγέλους；虽以定冠词指特定群体，却没有说明他们是天使长，因此不引入后期传统。
- issue: 号筒的施予者
  choice: 采用被动式“赐给了他们”，不明说施予者。
  alternative: 补出“上帝赐给他们”。
  rationale: 原文神圣被动的施予者未明说；译文保留这一含蓄性，避免把合理推断写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“上帝”与本项目用语保持一致；句式尽量贴近原文两分句结构，同时以“有七枝号筒赐给了他们”保留被动和叙事推进。
