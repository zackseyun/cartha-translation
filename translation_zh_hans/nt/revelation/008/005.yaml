id: REV.8.5
reference: Revelation 8:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ εἴληφεν ὁ ἄγγελος τὸν λιβανωτόν, καὶ ἐγέμισεν αὐτὸν ἐκ τοῦ πυρὸς τοῦ θυσιαστηρίου, καὶ ἔβαλεν εἰς τὴν γῆν· καὶ ἐγένοντο βρονταὶ καὶ φωναὶ καὶ ἀστραπαὶ καὶ σεισμός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/005.yaml
  text: And the angel took the censer[a], and filled it with fire from the altar, and threw it onto the earth; and there came peals of thunder and sounds and flashes of lightning and an earthquake.
translation:
  language: zh_hans
  text: 天使拿起香炉，用祭坛上的火装满香炉，然后将它投到地上；随即有雷鸣、响声[a]、闪电和地震。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “响声”也可译作“声音”或“说话声”。希腊语在这里可指一般的声响，也可指有言语内容的声音。
    reason: 保留 φωναί 在神显现语境中的词义歧义。
lexical_decisions:
- source_word: εἴληφεν
  choice: 拿起
  rationale: 虽为完成时形式，但在本节连续叙事中，用现代汉语的“拿起”自然表达动作及其后续结果，也与接连出现的不定过去时动作衔接。
- source_word: λιβανωτόν
  choice: 香炉
  rationale: 此处指盛放香料或祭坛炭火的礼仪器皿；“香炉”简洁、通行，并符合上下文。
- source_word: ἐγέμισεν αὐτὸν ἐκ τοῦ πυρὸς τοῦ θυσιαστηρίου
  choice: 把祭坛上的火装满香炉
  rationale: 明确保留火来自祭坛以及香炉被装满这两层意思；重复“香炉”可避免代词指向含混。
- source_word: θυσιαστηρίου
  choice: 祭坛
  rationale: 准确表达启示录圣所异象中的礼仪性坛，而不是泛指普通台坛。
- source_word: ἔβαλεν εἰς τὴν γῆν
  choice: 将它投到地上
  rationale: “投”保留 βάλλω 的有力动作；“地上”在启示录语境中可指与天相对的地上世界，而不局限于脚下地面。
- source_word: ἐγένοντο
  choice: 随即有
  rationale: 自然表达这些现象在动作之后突然发生；“随即”体现叙事上的紧密承接。
- source_word: βρονταὶ
  choice: 雷鸣
  rationale: 现代汉语以集合性表达自然涵盖多次雷响，既庄重又不生硬。
- source_word: φωναὶ
  choice: 响声
  rationale: φωνή 可指声音，也可指有言语内容的声音；正文用较宽泛的“响声”，避免在没有说话者的情况下擅自确定为言语。
- source_word: ἀστραπαὶ
  choice: 闪电
  rationale: 现代汉语中“闪电”可作集合名词，自然表达原文复数。
- source_word: σεισμός
  choice: 地震
  rationale: 直接、准确地表达该自然震动现象。
theological_decisions:
- issue: 末世审判异象中 γῆ 的范围
  choice: 地上
  alternative: 地面；大地
  rationale: “地上”既能保持与天上场景的对照，也不把范围收窄为香炉落下处的地面；同时比“大地”更自然地承接“投到”。
- issue: 神显现象组合中 φωναί 的含义
  choice: 响声
  alternative: 声音；说话声
  rationale: 原文没有指出说话者或话语内容。“响声”保留听觉现象及其含混性，不把它限定为有言语内容的声音；脚注列出另一可能。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“然后……随即……”清楚呈现动作与异象结果的推进；保留“祭坛”“香炉”等礼仪意象，不作解释性扩写。
