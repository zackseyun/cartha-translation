id: REV.8.3
reference: Revelation 8:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ ἄλλος ἄγγελος ἦλθεν καὶ ἐστάθη ἐπὶ τοῦ θυσιαστηρίου ἔχων λιβανωτὸν χρυσοῦν, καὶ ἐδόθη αὐτῷ θυμιάματα πολλὰ ἵνα ⸀δώσει ταῖς προσευχαῖς τῶν ἁγίων πάντων ἐπὶ τὸ θυσιαστήριον τὸ χρυσοῦν τὸ ἐνώπιον τοῦ θρόνου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/003.yaml
  text: And another angel came and stood at the altar[a], holding a golden censer[b], and much incense was given to him so that he might offer it with the prayers of all the saints on the golden altar before the throne.
translation:
  language: zh_hans
  text: 另有一位天使来，站在祭坛旁，手里拿着一个金香炉[a]。有许多香被赐给他，好让他把香连同众圣徒的祷告[b]，献在宝座前的金祭坛上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“金焚香器”。
    reason: lexical_alternative
  - marker: b
    text: 直译“好让他把〔香〕给众圣徒的祷告”；这里也可理解为把香加在他们的祷告上。
    reason: alternative_reading
lexical_decisions:
- source_word: ἄλλος ἄγγελος
  choice: 另有一位天使
  rationale: ἄλλος表示在先前所述天使之外又有一位；“另有一位”自然地表达叙事中的追加，而不暗示另一类受造物。
- source_word: ἐστάθη ἐπὶ τοῦ θυσιαστηρίου
  choice: 站在祭坛旁
  rationale: ἐστάθη表示站定；此处ἐπί加属格在语境中宜理解为空间上的“在祭坛旁”，避免误解为站在祭坛顶上。
- source_word: λιβανωτὸν χρυσοῦν
  choice: 金香炉
  rationale: λιβανωτός在此指焚香用的器皿；“金香炉”简洁、通行，并直接体现χρυσοῦν。
- source_word: ἐδόθη αὐτῷ θυμιάματα πολλὰ
  choice: 有许多香赐给他
  rationale: 保留原文的神学被动式“赐给”，不擅自说明赐予者；θυμιάματα按汉语习惯译作不可数意义的“香”。
- source_word: ἵνα δώσει
  choice: 好让他……献
  rationale: ἵνα引出目的；δίδωμι本义为“给”，但在香与祭坛的礼仪语境中，“献”较自然，同时以脚注保留字面表达。
- source_word: ταῖς προσευχαῖς τῶν ἁγίων πάντων
  choice: 连同众圣徒的祷告
  rationale: 与格关系较为压缩且存在歧义；正文按上下文表达香与祷告一同献上，脚注保留“给众圣徒的祷告”这一字面结构。
- source_word: ἅγιοι
  choice: 圣徒
  rationale: 指归属于神、分别为圣的群体；“圣徒”是简洁而通行的现代中文圣经用语。
- source_word: ἐπὶ τὸ θυσιαστήριον τὸ χρυσοῦν
  choice: 献在……金祭坛上
  rationale: ἐπί加宾格在献祭动作后表示朝向并置于祭坛之上；“献在……上”符合中文礼仪语境。
- source_word: τὸ ἐνώπιον τοῦ θρόνου
  choice: 宝座前的
  rationale: ἐνώπιον在此表达空间位置，“宝座前”自然、准确，也保留启示录的宫廷—圣殿图景。
theological_decisions:
- issue: 香与众圣徒祷告之间的关系
  choice: 正文译为香“连同”众圣徒的祷告献上
  alternative: 较字面的表达是把香“给众圣徒的祷告”
  rationale: 原文与格结构简略，可能表达香伴随、加于或被给予祷告。上下文支持一同献上的图景，但不宜据此发展出经文未明说的天使中保教义；脚注保留原文张力。
- issue: 赐香者的身份
  choice: 采用无施事者的被动表达“赐给他”
  alternative: 明确说“神赐给他”
  rationale: 希腊文未明说施事者，因此译文不补出身份，以免增加经文没有直接陈述的神学判断。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“另有一位”“站在……旁”“手里拿着”保持叙事流畅；“祭坛、香炉、圣徒、宝座”等保留启示文学和圣殿礼仪的核心术语。所有脚注标记均已置于正文相应位置。
