id: REV.8.12
reference: Revelation 8:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ ὁ τέταρτος ἄγγελος ἐσάλπισεν· καὶ ἐπλήγη τὸ τρίτον τοῦ ἡλίου καὶ τὸ τρίτον τῆς σελήνης καὶ τὸ τρίτον τῶν ἀστέρων, ἵνα σκοτισθῇ τὸ τρίτον αὐτῶν καὶ ⸂ἡ ἡμέρα μὴ φάνῃ τὸ τρίτον αὐτῆς⸃, καὶ ἡ νὺξ ὁμοίως.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/012.yaml
  text: And the fourth angel sounded the trumpet[a], and a third of the sun and a third of the moon and a third of the stars was struck, so that a third of them was darkened, and the day did not shine for a third of it, and the night likewise.
translation:
  language: zh_hans
  text: 第四位天使吹响了号筒，太阳的三分之一、月亮的三分之一和众星的三分之一都受到击打，以致它们的三分之一变暗，白昼有三分之一没有亮光[a]，黑夜也是如此。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为要使它们的三分之一变暗，使白昼有三分之一没有亮光。”希腊文结构也可带有较明显的目的意味。
    reason: 保留ἵνα结构在结果与目的之间的语气可能性。
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: 吹响号筒
  rationale: σαλπίζω指吹号；中文补出语境中明确的乐器“号筒”，表达自然，也没有增加原文以外的行动。
- source_word: ἐπλήγη
  choice: 受了击打
  rationale: 保留被动语态和审判性的打击意象，同时避免文言或过度解释性的措辞。
- source_word: τὸ τρίτον
  choice: 三分之一
  rationale: 准确保留原文反复出现的定量范围；中文按原文重复，以突出各天体均有三分之一受影响。
- source_word: ἥλιος / σελήνη / ἀστέρες
  choice: 太阳／月亮／众星
  rationale: 采用现代汉语中直接、清楚的天体名称；“众星”自然表达复数。
- source_word: ἵνα
  choice: 以致
  rationale: 在此用结果意味自然地连接所受击打及随后的变暗，同时不否认该结构也可带有目的意味。
- source_word: σκοτισθῇ
  choice: 变暗
  rationale: 简洁表达被动式所描述的受影响结果；中文无需生硬地保留形式被动。
- source_word: αὐτῶν
  choice: 它们
  rationale: 保留复数指代，统指太阳、月亮和众星。
- source_word: ἡ ἡμέρα μὴ φάνῃ
  choice: 白昼……没有亮光
  rationale: φαίνω在宇宙变暗的语境中表示发光、显出光来；此译法符合现代汉语习惯，也保持光明受限的图景。
- source_word: τὸ τρίτον αὐτῆς
  choice: 白昼有三分之一
  rationale: 表达受影响的是白昼的三分之一，保留原文对范围或时段的限定，而不进一步规定其机制。
- source_word: ἡ νὺξ ὁμοίως
  choice: 黑夜也是如此
  rationale: 简明保留原文“同样”的关系，使白昼所述的三分之一限制也适用于黑夜。
theological_decisions:
- issue: 宇宙性审判图景的性质
  choice: 按经文直接呈现日月众星受击打和变暗的启示文学图景，不判定其仅为字面事件、仅为象征，或两者兼有。
  alternative: 将其明确解释为纯粹的天文事件，或明确解释为政治／宇宙秩序的象征。
  rationale: 经文本身没有在本节说明该图景应如何对应现实；译文应保留其审判意味及解释张力，不加入特定末世论体系。
- issue: ἵνα所表达的目的与结果关系
  choice: 正文采用偏结果意味的“以致”，脚注保留偏目的意味的另一种表达。
  alternative: 正文译作“为要使”，明确突出目的意味。
  rationale: ἵνα可引出目的或结果；本处两种语气均有语言依据，不宜在译文中完全抹去这种张力。
translation_notes:
  register: 采用现代、清楚而庄重的叙述语体。“受了击打”保留审判意象；“白昼……没有亮光”比直译为“白昼不照耀”更符合现代汉语，同时不解释天体变暗究竟是字面还是象征。
