  text: Καὶ οἱ ἑπτὰ ἄγγελοι οἱ ἔχοντες τὰς ἑπτὰ σάλπιγγας ἡτοίμασαν ⸀αὑτοὺς ἵνα σαλπίσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/006.yaml
  text: And the seven angels who had the seven trumpets prepared themselves to sound them[a].
translation:
  language: zh_hans
  text: 那七位拿着七枝号筒的天使预备好了，要吹号[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“要吹响号筒”。希腊语动词意为“吹号”，即吹响号筒。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελοι
  choice: 天使
  rationale: 在《启示录》的异象语境中，此词指天上的使者；译作“天使”最符合上下文。
- source_word: ἔχοντες
  choice: 拿着
  rationale: 该分词表示这些天使持有七枝号筒；“拿着”比生硬的“有”更自然，也契合具体器物。
- source_word: σάλπιγγας
  choice: 号筒
  rationale: σάλπιγξ指用于发出信号的号类乐器；“号筒”既准确又保留启示文学和礼仪场景的庄重感。
- source_word: ἡτοίμασαν αὑτοὺς
  choice: 预备好自己
  rationale: 保留动词与反身代词所表达的自我预备，同时采用现代汉语可理解的表达。
- source_word: ἵνα σαλπίσωσιν
  choice: 要吹响号筒
  rationale: “要”自然表达ἵνα引出的目的，且“吹响号筒”清楚传达动词σαλπίζω的含义。
theological_decisions:
- issue: 异象中ἄγγελοι所指的身份
  choice: 天使
  alternative: 使者
  rationale: 七位持号的角色位于天上异象之中，上下文强烈支持天上使者；译文不额外说明其等级或性质。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“七枝号筒”沿用汉语对细长器物的常用量词；“预备好自己”保留原文反身结构，“要吹响号筒”自然呈现目的关系。
