  text: Καὶ ὁ τρίτος ἄγγελος ἐσάλπισεν· καὶ ἔπεσεν ἐκ τοῦ οὐρανοῦ ἀστὴρ μέγας καιόμενος ὡς λαμπάς, καὶ ἔπεσεν ἐπὶ τὸ τρίτον τῶν ποταμῶν καὶ ἐπὶ τὰς πηγὰς τῶν ὑδάτων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/010.yaml
  text: And the third angel sounded his trumpet[a], and a great star fell from heaven, burning like a torch[c][b], and it fell on a third of the rivers and on the springs of the waters.
translation:
  language: zh_hans
  text: 第三位天使吹响了号筒；有一颗大星从天上[a]坠落，燃烧如火把[b]；它落在三分之一的河流和众水的泉源上。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “天上”也可译作“天空”。希腊词既可指天界，也可指天空；此处保留“天上”，以适合异象性的启示文学语境。
    reason: lexical_alternative
  - marker: b
    text: “火把”也可译作“灯”。希腊词可指火把或灯；在这颗炽燃坠落之星的图像中，“火把”较贴切。
    reason: lexical_alternative
  - marker: c
    text: 这里保留“大星”这一异象，没有说明它所代表的对象。有人认为它指天使性存在、流星状物体，或象征性的权势。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: 吹响了号筒
  rationale: σαλπίζω指吹号或使号筒发声；“吹响了号筒”在现代汉语中自然明确，也符合号筒审判的叙事次序。
- source_word: ἀστὴρ μέγας
  choice: 一颗大星
  rationale: 直译名词与形容词组合，保留异象本身的意象，不预先判定它是天使、流星状物体或象征性权势。
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: 从天上
  rationale: οὐρανός既可指天界，也可指天空；“天上”在汉语中保留了两者之间一定的开放性，并适合启示文学语境。
- source_word: καιόμενος ὡς λαμπάς
  choice: 燃烧如火把
  rationale: καιόμενος表示正在燃烧，λαμπάς可指火把或灯；在一颗炽燃坠落之星的画面中，“火把”更形象贴切，同时保留明喻。
- source_word: ἔπεσεν ... καὶ ἔπεσεν
  choice: 坠落，落在
  rationale: 保留希腊文同一动词的重复及先下降、后落到水源之上的推进；按汉语搭配分别用“坠落”和“落在”。
- source_word: ἐπὶ τὸ τρίτον τῶν ποταμῶν
  choice: 落在三分之一的河流……上
  rationale: τὸ τρίτον在本段号筒异象中表示三分之一；该译法数量意义清楚，现代汉语自然。
- source_word: πηγὰς τῶν ὑδάτων
  choice: 众水的泉源
  rationale: πηγή指泉或源头；“众水的泉源”贴近复数属格结构，具有庄重感且仍易懂。
theological_decisions:
- issue: 坠落之星的所指
  choice: 按异象直译为“一颗大星”，不解释其象征对象
  alternative: 天使性存在、流星状物体，或象征性的统治者或权势
  rationale: 本节只将其呈现为“星”，没有明说其所代表的对象；保持意象可避免把某一种解释写入正文。
- issue: οὐρανός在此指天界还是天空
  choice: 译作“天上”，并以脚注说明两种可能
  alternative: 明确译作“天界”或“天空”
  rationale: 希腊词本身容许两种空间含义；“天上”既适合异象语体，也不必过早消除词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“吹响了号筒”明确表达动作；“燃烧如火把”保留紧凑的启示文学图像；分号再现两个主要事件之间的推进。所有脚注标记均置于正文相应位置。
