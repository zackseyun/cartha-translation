id: REV.8.8
reference: Revelation 8:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ ὁ δεύτερος ἄγγελος ἐσάλπισεν· καὶ ὡς ὄρος μέγα ⸀πυρὶ καιόμενον ἐβλήθη εἰς τὴν θάλασσαν· καὶ ἐγένετο τὸ τρίτον τῆς θαλάσσης αἷμα,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/008.yaml
  text: And the second angel sounded the trumpet[a], and something like a great mountain burning with fire was thrown into the sea, and a third of the sea became blood.
translation:
  language: zh_hans
  text: 第二位天使吹响了号角；有一样东西，仿佛一座燃着火的大山[a]，被扔进海里；海的三分之一就变成了血。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“仿佛一座燃着火的大山被扔进海里。”希腊原文表示相似，不一定说明被扔进去的就是一座山。
    reason: 词义与句法的可能译法
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: 吹响了号角
  rationale: σαλπίζω指吹号或使号筒发声；中文用“吹响号角”自然清楚，也符合这一连串异象的语境。
- source_word: ὡς
  choice: 有一样东西，仿佛
  rationale: ὡς表示相似，而不必表示所见之物本身就是一座山；补出“有一样东西”可使现代汉语通顺，同时保留异象描述的不确定性。
- source_word: ὄρος μέγα
  choice: 一座大山
  rationale: 直译名词与形容词的组合；“大山”简洁庄重，不把形象进一步解释为火山、陨石或象征。
- source_word: πυρὶ καιόμενον
  choice: 燃着火
  rationale: 保留与格πυρί和分词καιόμενον所描绘的燃烧景象；措辞自然，不额外加入“熊熊”等原文没有的强度。
- source_word: ἐβλήθη
  choice: 被扔进
  rationale: 不定过去时被动语态表明这东西被投掷；“被扔进”是现代汉语的自然表达，不补明施动者。
- source_word: εἰς τὴν θάλασσαν
  choice: 进海里
  rationale: εἰς表示进入的方向，θάλασσα通常指“海”；与“扔”合译为“扔进海里”准确自然。
- source_word: τὸ τρίτον τῆς θαλάσσης
  choice: 海的三分之一
  rationale: 按现代汉语表达这一部分属格结构，并保留《启示录》中反复出现的三分之一审判意象。
- source_word: αἷμα
  choice: 血
  rationale: 该词直接指血；不应在译文中将其弱化为“血一样”或另作象征性解释。
theological_decisions:
- issue: 像大山之物的性质
  choice: 译出比较关系，但不判定该物是实际的山还是某种象征。
  alternative: 把它明确译成一座实际的大山、类似陨石的物体，或审判的象征。
  rationale: 原文以ὡς标示相似关系。译文应保留异象的开放性，不擅自断定其为字面、象征，或两者兼具。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。分号保留原文连续推进的异象节奏；不使用古奥的“吹号”“投入”等表达，也不把景象具体解释为火山、陨石或纯粹象征。
