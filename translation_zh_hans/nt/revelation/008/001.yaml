id: REV.8.1
reference: Revelation 8:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ ⸀ὅταν ἤνοιξεν τὴν σφραγῖδα τὴν ἑβδόμην, ἐγένετο σιγὴ ἐν τῷ οὐρανῷ ὡς ἡμιώριον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/001.yaml
  text: And when he opened the seventh seal[b][a], there was silence in heaven for about half an hour.
translation:
  language: zh_hans
  text: 当他揭开第七印[a]时，天上寂静了约有半小时[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“打开第七印。”希腊文只说“打开第七印”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“天上出现了约有半小时的寂静。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: 当……时
  rationale: 这里叙述一次具体事件，用现代汉语的“当……时”自然表达时间关系；不译成带反复意味的“每当”。
- source_word: ἤνοιξεν
  choice: 揭开
  rationale: ἀνοίγω的基本意思是“打开”。在封印的语境中，“揭开第七印”自然、庄重，也不额外强调破坏封印的动作。
- source_word: σφραγῖδα τὴν ἑβδόμην
  choice: 第七印
  rationale: σφραγίς在本卷书卷的语境中指封印；“第七印”准确表达定冠词和序数词所限定的对象。
- source_word: ἐγένετο σιγὴ
  choice: 寂静了
  rationale: γίνομαι在此表示一种状态出现；汉语“寂静了”简洁自然，同时保留场景由有声转为无声的动态感。
- source_word: ἐν τῷ οὐρανῷ
  choice: 天上
  rationale: 此处οὐρανός指属天的领域，而不是自然界的天空；“天上”符合启示录的叙事语境和现代汉语表达。
- source_word: ὡς ἡμιώριον
  choice: 约有半小时
  rationale: ὡς用于时间量时表示约数；“约有半小时”同时表达近似程度和持续时间。
theological_decisions:
- issue: ἤνοιξεν所省略主语的所指
  choice: 译作“他”，不在本节明说身份
  alternative: 译作“羔羊”
  rationale: 希腊文为第三人称单数动词，主语承接上文，语境中自然指羔羊。汉语需明示代词，但不应把上文所指直接扩写成本节明说的名称。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“揭开第七印”延续启示录封印场景的形象；“寂静了”避免生硬直译，同时保留ἐγένετο所含状态开始出现的意味。
