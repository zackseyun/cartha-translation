  text: καὶ ἀνέβη ὁ καπνὸς τῶν θυμιαμάτων ταῖς προσευχαῖς τῶν ἁγίων ἐκ χειρὸς τοῦ ἀγγέλου ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/004.yaml
  text: And the smoke of the incense went up with the prayers of the saints from the hand of the angel before God[a][b].
translation:
  language: zh_hans
  text: 那香所发出的烟，连同众圣徒的祷告，从天使手中升到上帝面前。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “升到”也可译作“上升”或“升起”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文在此将香的烟与众圣徒的祷告联系起来，却没有明确说二者就是同一事物。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνέβη
  choice: 升到
  rationale: 该词表示向上移动；结合句末“上帝面前”，译作“升到”自然地呈现烟上升并抵达上帝面前的异象。
- source_word: καπνὸς
  choice: 烟
  rationale: 采用普通、具体的含义“烟”，不把启示文学的形象另作解释。
- source_word: θυμιαμάτων
  choice: 香
  rationale: θυμίαμα在此指礼仪中焚烧的香。现代汉语以“香”表达最自然，并与“烟”构成清楚的属有关系。
- source_word: ταῖς προσευχαῖς
  choice: 同……祷告一起
  rationale: 与格在此把香烟和祷告联系起来；“同……一起”保留伴随或关联关系，不明确断定香就是祷告，也不暗示香承载祷告。
- source_word: τῶν ἁγίων
  choice: 众圣徒的
  rationale: “圣徒”是圣经中对归属上帝之人的通行称谓；加“众”符合汉语表达，也避免将其限于后来获封圣者的含义。
- source_word: ἐκ χειρὸς τοῦ ἀγγέλου
  choice: 从天使手中
  rationale: 贴近希腊文的具体异象，同时是自然的现代汉语。
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: 到上帝面前
  rationale: ἐνώπιον表示在上帝面前或临在中；与表示上升的动词结合，译作“到上帝面前”清楚而简洁。
theological_decisions:
- issue: 香与众圣徒祷告之间的关系
  choice: 译作“香的烟同众圣徒的祷告一起……升到”，只表明二者在异象中相伴、相关。
  alternative: 把香烟解释为祷告本身，或译成香烟为祷告而升起。
  rationale: 希腊文将香烟与祷告联系起来，却没有在本节明确将二者等同；译文保留这一神学与意象上的张力。
- issue: “圣徒”的所指
  choice: 保留“众圣徒”，泛指归属上帝、分别为圣的人。
  alternative: 译作“上帝圣洁的子民”。
  rationale: “圣徒”保留启示录的圣经用语，同时不把所指缩小为某一宗派传统中的特定群体。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“香的烟”保留原文“香烟”的属有结构，同时避免现代汉语中“香烟”一词被误解为卷烟；“上帝面前”保持礼仪性和异象性的表达。
