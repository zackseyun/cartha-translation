id: REV.8.13
reference: Revelation 8:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ εἶδον, καὶ ἤκουσα ἑνὸς ἀετοῦ πετομένου ἐν μεσουρανήματι λέγοντος φωνῇ μεγάλῃ· Οὐαὶ οὐαὶ οὐαὶ ⸂τοὺς κατοικοῦντας⸃ ἐπὶ τῆς γῆς ἐκ τῶν λοιπῶν φωνῶν τῆς σάλπιγγος τῶν τριῶν ἀγγέλων τῶν μελλόντων σαλπίζειν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/013.yaml
  text: And I saw[a], and I heard one eagle flying in midheaven, saying with a loud voice, “Woe, woe, woe to those who dwell on the earth[b], because of the remaining trumpet-blasts of the three angels who are about to sound!”
translation:
  language: zh_hans
  text: 我看见，又听见一只鹰[a]在中天[b]飞翔，大声喊着说：“祸哉！祸哉！祸哉！住在地上的人有祸了！因为那三位将要吹号的天使其余的号声！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“一位天使”，而不是“一只鹰”。
    reason: textual_variant
  - marker: b
    text: 或译“在半空中”；希腊语这个词指天空的最高处或头顶上方的天空。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀετοῦ
  choice: 鹰
  rationale: 该词通常指鹰；本节没有食腐鸟类的明确语境，因此不译作“秃鹫”。正文依照SBLGNT采用“鹰”，异文“天使”列入脚注。
- source_word: μεσουρανήματι
  choice: 在中天
  rationale: 指天空最高处或头顶上方的开阔天空。“中天”既保留启示文学的宏阔语体，也符合现代汉语的庄重表达。
- source_word: φωνῇ μεγάλῃ
  choice: 大声说
  rationale: 以自然汉语表达“大声音说”的意思，保留公开宣告的强烈语气。
- source_word: Οὐαὶ οὐαὶ οὐαὶ
  choice: 祸哉！祸哉！祸哉！
  rationale: 保留原文三次重复及先知性警告的强烈修辞；“祸哉”庄重而且为现代读者所能理解。
- source_word: τοὺς κατοικοῦντας ἐπὶ τῆς γῆς
  choice: 住在地上的人
  rationale: 尽量保留《启示录》中反复出现的表达，不压缩为“世人”，也不额外解释其神学所指。
- source_word: ἐκ τῶν λοιπῶν φωνῶν τῆς σάλπιγγος
  choice: 因为……即将吹响号筒
  rationale: ἐκ在语境中表示原因；φωναί与号筒连用，指吹号所发的声音。汉语将原因融入“因为其余三位天使即将吹响号筒”，避免生硬的“其余号筒的声音”。
- source_word: τῶν τριῶν ἀγγέλων
  choice: 其余三位天使
  rationale: “三位”体现三名天使；“其余”在汉语中自然地表明他们属于尚未吹号的余下三位。
- source_word: τῶν μελλόντων σαλπίζειν
  choice: 即将吹响号筒
  rationale: μέλλω加不定式表达临近将发生之事；“即将”保留迫近感，“吹响号筒”符合现代汉语习惯。
theological_decisions:
- issue: 飞行宣告者的文本读法
  choice: 一只鹰
  alternative: 一位天使
  rationale: 正文遵循所提供的SBLGNT读法ἀετοῦ（“鹰”）。部分抄本的“天使”读法不纳入正文，但在脚注中保留，以呈现文本异文。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“我又看见，并听见”保留原文两个并列感知动词；“祸哉”保留三重重复的先知性力度。脚注[b]置于“中天”之后，使词汇说明与所解释的正文词语准确对应。
