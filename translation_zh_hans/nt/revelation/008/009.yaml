  text: καὶ ἀπέθανε τὸ τρίτον ⸀τῶν κτισμάτων τῶν ἐν τῇ θαλάσσῃ, τὰ ἔχοντα ψυχάς, καὶ τὸ τρίτον τῶν πλοίων ⸀διεφθάρησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/009.yaml
  text: And a third of the creatures in the sea—the ones that have living souls—died[a], and a third of the ships were destroyed.
translation:
  language: zh_hans
  text: 海里有生命的受造物死了三分之一[a]，船只也毁坏了三分之一。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“有性命的”，也可按字面译作“有魂的”。希腊原文直译为“那些有魂／性命的”。
    reason: 说明ψυχή在此处可表示魂、性命或生命，并保存原文措辞的多义性。
lexical_decisions:
- source_word: ἀπέθανε
  choice: 死了
  rationale: 该动词直接表示死亡；用于海中有生命的受造物时，“死了”自然、准确。
- source_word: τὸ τρίτον
  choice: 三分之一
  rationale: 准确保留原文的数量含义，也符合现代汉语表达。
- source_word: κτισμάτων
  choice: 受造物
  rationale: κτίσμα指被造之物；上下文借“有生命的”限定为海中的有生命受造物。“受造物”保留其受造含义，且不把限定语并入名词。
- source_word: τῶν ἐν τῇ θαλάσσῃ
  choice: 海里
  rationale: 简洁、自然地表达原文的地点范围。
- source_word: τὰ ἔχοντα ψυχάς
  choice: 有生命的
  rationale: 这里的ψυχή表示使受造物成为活物的生命，而非专门论述灵魂性质；“有生命的”在现代汉语中清楚自然，同时保留与无生命之物的区别。
- source_word: ψυχάς
  choice: 生命
  rationale: 在描述海中受造物的语境中，ψυχή可指生命或活着的存在；译作“生命”避免把经文误读为动物灵魂论。
- source_word: πλοίων
  choice: 船只
  rationale: πλοῖον指船；“船只”适合现代书面汉语，并与海上灾难的语境吻合。
- source_word: διεφθάρησαν
  choice: 毁坏了
  rationale: 此处被动形式表示遭到毁灭性破坏，不是道德上的败坏；“毁坏了”准确传达结果。
theological_decisions:
- issue: 海中受造物的ψυχάς应如何表达
  choice: 在正文译作“有生命的”
  alternative: “有魂的”或“有性命的”
  rationale: 此处重点是海中受造物具有动物性的生命，并非提出关于动物是否具有灵魂的技术性教义。“有生命的”保留语义张力而不引入不必要的本体论判断；脚注列出较贴近词形的译法，以便查考。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“海里有生命的受造物”按汉语习惯整合原文的地点短语和限定结构；两个“三分之一”均明确保留，以维持原文平行句式。
