id: REV.8.11
reference: Revelation 8:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ τὸ ὄνομα τοῦ ἀστέρος λέγεται· ⸀ὁ Ἄψινθος. καὶ ἐγένετο τὸ τρίτον τῶν ὑδάτων εἰς ἄψινθον, καὶ πολλοὶ τῶν ἀνθρώπων ἀπέθανον ἐκ τῶν ὑδάτων, ὅτι ἐπικράνθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/011.yaml
  text: And the name of the star is called Wormwood[a]. And a third of the waters became wormwood, and many of the people died from the waters[b], because they had been made bitter.
translation:
  language: zh_hans
  text: 这星的名字叫“苦艾”[a]。众水的三分之一变成了苦艾；许多人因这些水而死[b]，因为这些水已经变苦了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “苦艾”是一种味道很苦的植物。希腊文用同一个词作为星的名字，并描述水所发生的变化。
    reason: 说明词义，并保留星名与水变苦之间的词语关联。
  - marker: b
    text: 希腊文直译为“许多人从这些水而死”；这里表示这些水是死亡的来源或原因，并没有明说人喝了水。
    reason: 说明介词ἐκ的因果或来源含义，同时避免补入原文未明说的动作。
lexical_decisions:
- source_word: ὄνομα
  choice: 名字
  rationale: 这是表示名称或称谓的常用现代汉语译法。
- source_word: ἀστέρος
  choice: 星
  rationale: 直接对应ἀστήρ，也自然符合本段的启示文学意象。
- source_word: λέγεται
  choice: 叫
  rationale: 以自然的现代汉语表达现在时被动语态“被称为”，避免生硬的“被叫作”。
- source_word: Ἄψινθος / ἄψινθον
  choice: 苦艾／苦艾
  rationale: 苦艾是一种味苦的植物；同一译词既用作星名，也用于描述水的变化，从而保留原文刻意的词语重复和关联。
- source_word: ἐγένετο ... εἰς ἄψινθον
  choice: 变成了苦艾
  rationale: γίνομαι与εἰς连用在这里表达变化及其结果；具体译为“变成了苦艾”，可保留原文鲜明的隐喻。
- source_word: τὸ τρίτον τῶν ὑδάτων
  choice: 众水的三分之一
  rationale: 既保留部分结构和三分之一的数量意义，也符合启示录上下文中“众水”的表达。
- source_word: πολλοὶ τῶν ἀνθρώπων
  choice: 许多人
  rationale: ἄνθρωποι泛指人类，并非专指男性；“许多人”是自然且准确的汉语。
- source_word: ἀπέθανον ἐκ τῶν ὑδάτων
  choice: 因这些水而死
  rationale: ἐκ在此表示来源或原因；不增添原文没有明说的“饮用”。
- source_word: ὅτι ἐπικράνθησαν
  choice: 因为这些水已经变苦了
  rationale: 复数被动动词最自然地回指众水。汉语以“这些水”明确所指，并用“已经变苦了”自然表达已发生变化后的结果状态。
theological_decisions:
- issue: ἐπικράνθησαν的所指
  choice: 理解为众水变苦
  alternative: 理解为人变得痛苦、患病或心中苦毒
  rationale: 从语法看，最近且数一致的先行词是复数的“众水”；从上下文看，人死亡的原因也是水变得苦而有害。此处依句法和语境处理，不引入额外的教义解释。
- issue: “苦艾”的意象
  choice: 保留具体植物名称及原文的重复
  alternative: 意译为“苦水”或“有毒的水”
  rationale: 原文用同一个词命名那颗星并描写水的变化；保留“苦艾”可维持两者之间的文学联系，也不把“苦”进一步解释成原文未明说的特定毒性或象征意义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。以“苦艾”保留具体意象和重复，用“因这些水而死”自然表达原因而不增译“饮用”；末句明确重复“这些水”，避免汉语代词指向含混。
