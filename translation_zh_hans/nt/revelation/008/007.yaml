id: REV.8.7
reference: Revelation 8:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ ὁ πρῶτος ἐσάλπισεν· καὶ ἐγένετο χάλαζα καὶ πῦρ μεμιγμένα ἐν αἵματι, καὶ ἐβλήθη εἰς τὴν γῆν· καὶ τὸ τρίτον τῆς γῆς κατεκάη, καὶ τὸ τρίτον τῶν δένδρων κατεκάη, καὶ πᾶς χόρτος χλωρὸς κατεκάη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/007.yaml
  text: And the first sounded his trumpet[a], and there came hail and fire mixed with blood, and it was thrown onto the earth. And a third of the earth was burned up, and a third of the trees was burned up[b], and all the green grass was burned up.
translation:
  language: zh_hans
  text: 第一位吹响了号筒，便有冰雹和火混着血，被投到地上；大地[a]的三分之一被烧尽，树木的三分之一被烧尽，一切青翠的草也都被烧尽了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大地”或译“地土”。希腊语γῆ两者都可表示；这里的启示性异象语境较支持“大地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πρῶτος
  choice: 第一位
  rationale: 原文只说“第一位”，没有明说“天使”；上下文已表明是七位拿着号筒的天使，因此保留原文的省略表达，不在正文中增词。
- source_word: ἐσάλπισεν
  choice: 吹响了号筒
  rationale: σαλπίζω意为吹号；“吹响了号筒”符合现代汉语习惯，也承接启示录8:2、6所说的号筒。
- source_word: ἐγένετο χάλαζα καὶ πῦρ
  choice: 便有冰雹和火
  rationale: 用“便有”表达ἐγένετο引出异象事件的叙事作用，同时直接保留“冰雹和火”的图像。
- source_word: μεμιγμένα ἐν αἵματι
  choice: 混着血
  rationale: 表达冰雹和火与血混合的状态，采用清楚、自然的现代汉语，不解释这幅异象的象征意义。
- source_word: ἐβλήθη εἰς τὴν γῆν
  choice: 被投到地上
  rationale: 保留被动语态和向下投掷的动态；希腊文单数动词把前述现象视为一个整体，汉语无需用数来强行消解这种集合表达。
- source_word: τὸ τρίτον τῆς γῆς
  choice: 大地的三分之一
  rationale: “三分之一”自然表达部分关系；“大地”适合此处宇宙性审判的异象语境，同时以脚注保留“地土”的词义可能。
- source_word: κατεκάη
  choice: 被烧尽
  rationale: κατακαίω带有彻底焚烧、烧毁的加强意味；“烧尽”比单说“烧了”更准确，并保留三次重复造成的强烈节奏。
- source_word: τὸ τρίτον τῶν δένδρων
  choice: 树木的三分之一
  rationale: 直接、自然地表达原文的部分关系，并与“大地的三分之一”形成平行。
- source_word: πᾶς χόρτος χλωρός
  choice: 一切青翠的草
  rationale: χόρτος在此具体指草或草本植物，χλωρός指鲜绿、青翠；该译法保留鲜明而具体的受灾景象。
theological_decisions:
- issue: 启示性审判图景中γῆ的范围
  choice: 大地
  alternative: 地土／土地
  rationale: γῆ既可指大地、世界，也可指地土或土地。上下文中的号筒之灾具有广阔的宇宙性图景，因此正文采用“大地”，但脚注保留较局部的词义可能，不把异象范围绝对化。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。保留原文连续使用“被烧尽”的重复，不为求文采而改写，以维持号筒审判层层推进的节奏；“第一位”保留希腊文省略，不擅自补入“天使”。
