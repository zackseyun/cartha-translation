  text: ἐκ φυλῆς Ζαβουλὼν δώδεκα χιλιάδες, ἐκ φυλῆς Ἰωσὴφ δώδεκα χιλιάδες, ἐκ φυλῆς Βενιαμὶν δώδεκα χιλιάδες ⸀ἐσφραγισμένοι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/008.yaml
  text: from the tribe of Zebulun[a], twelve thousand; from the tribe of Joseph, twelve thousand; from the tribe of Benjamin, twelve thousand, having been sealed.
translation:
  language: zh_hans
  text: 西布伦支派中有一万二千人；约瑟支派中有一万二千人；便雅悯支派中有一万二千人；他们都受了印。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以上是受了印的。”原文的分词放在名单末尾，概括所列的各组人。
    reason: 说明句末希腊语分词的另一种译法及其总结作用。
lexical_decisions:
- source_word: ἐκ φυλῆς
  choice: 支派中
  rationale: 在以色列十二支派的名单语境中，表示成员的来源或归属；译作“支派中”符合现代汉语列举人数的自然表达，也保留反复句式。
- source_word: Ζαβουλών
  choice: 西布伦
  rationale: 采用现代中文圣经语境中通行且易识别的专名译法。
- source_word: δώδεκα χιλιάδες
  choice: 一万二千人
  rationale: 准确保留原文数目；补出量词“人”，使汉语表达完整自然。
- source_word: Ἰωσήφ
  choice: 约瑟
  rationale: 原文明确写“约瑟”，因此不以以法莲或玛拿西替换，避免消解名单本身的张力。
- source_word: Βενιαμίν
  choice: 便雅悯
  rationale: 采用现代中文圣经语境中通行且易识别的专名译法。
- source_word: ἐσφραγισμένοι
  choice: 他们都受了印
  rationale: 该词是完成时被动分词、主格复数，置于名单末尾，概括上述各组为已经被盖印的人。“受了印”保留被动和既成结果；“他们都”明确其总结范围。
theological_decisions:
- issue: 句末分词ἐσφραγισμένοι的指向和作用
  choice: 在三组名单之后译作总结性陈述“他们都受了印”
  alternative: 译作“以上是受了印的”，或把“受了印的”移到各组人数之前
  rationale: 原文把分词置于整段列举末尾，作为对所列群体的总结。保留句末位置可呈现其文学作用；同时不进一步解释印的性质、施印者或这些群体的身份。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。以分号呈现名单的平行结构；“一万二千人”比逐字式“十二千”自然。“他们都受了印”兼顾希腊语完成时被动分词的结果性、被动性和句末总结功能。
