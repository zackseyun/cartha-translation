  text: ἐκ φυλῆς Ἀσὴρ δώδεκα χιλιάδες, ἐκ φυλῆς Νεφθαλὶμ δώδεκα χιλιάδες, ἐκ φυλῆς Μανασσῆ δώδεκα χιλιάδες,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/006.yaml
  text: from the tribe of Asher[a], twelve thousand; from the tribe of Naphtali, twelve thousand; from the tribe of Manasseh, twelve thousand;
translation:
  language: zh_hans
  text: 亚设支派中有一万二千人；拿弗他利支派中有一万二千人；玛拿西支派中有一万二千人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 按上下文，也可更明确地译作：“亚设支派中有一万二千人受了印”（以下各支派同）。本节希腊文本身没有重复“受了印”这个动词。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ
  choice: ……中
  rationale: 此介词表示来源或所属范围。在逐支派点数的名单中，用“某支派中”自然、准确地表达这些人出自各支派。
- source_word: φυλῆς
  choice: 支派
  rationale: 在以色列谱系和民族结构的语境中，φυλή指以色列的支派；“支派”是现代中文圣经语境中准确而通行的对应词。
- source_word: Ἀσὴρ
  choice: 亚设
  rationale: 采用该以色列支派名称在现代简体中文中的通行译名。
- source_word: δώδεκα χιλιάδες
  choice: 一万二千人
  rationale: 该数词短语表示所数的人数。中文补出量词“人”以符合自然表达，但不在正文补出希腊文本本节未重复的“受了印”。
- source_word: Νεφθαλὶμ
  choice: 拿弗他利
  rationale: 采用该以色列支派名称在现代简体中文中的通行译名。
- source_word: Μανασσῆ
  choice: 玛拿西
  rationale: 采用该以色列支派名称在现代简体中文中的通行译名。
theological_decisions:
- issue: 是否根据上下文补出“受了印”等隐含谓语
  choice: 正文不补“受了印”，以“支派中有一万二千人”的简洁列举形式表达。
  alternative: 亚设支派中有一万二千人受了印；拿弗他利支派中有一万二千人；玛拿西支派中有一万二千人。
  rationale: 本节希腊文由重复的介词短语和数目组成，没有明说谓语；受印的概念由前文统摄。中文为句法自然加入“有”和量词“人”，却不把上下文中的“受了印”写入正文，从而保留原文简略的名单形式及其依赖上下文的特点。
translation_notes:
  register: 采用现代、庄重而易懂的名单式表达；分号保留三个平行项目的节奏。人名使用现代简体中文圣经中通行的支派名称。
