id: REV.7.11
reference: Revelation 7:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ πάντες οἱ ἄγγελοι εἱστήκεισαν κύκλῳ τοῦ θρόνου καὶ τῶν πρεσβυτέρων καὶ τῶν τεσσάρων ζῴων, καὶ ἔπεσαν ἐνώπιον τοῦ θρόνου ἐπὶ τὰ πρόσωπα αὐτῶν καὶ προσεκύνησαν τῷ θεῷ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/011.yaml
  text: And all the angels were standing around the throne and the elders and the four living creatures[a], and they fell before the throne on their faces and worshiped God,
translation:
  language: zh_hans
  text: 所有天使都站在宝座、众长老和四个活物[a]的周围。他们便在宝座前俯伏下来，脸伏于地，敬拜上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “活物”或译“有生命者”。
    reason: 保留 ζῷον 可指“有生命的存在”的词义幅度，同时主译采用较自然且为读者熟悉的“活物”。
lexical_decisions:
- source_word: πάντες οἱ ἄγγελοι
  choice: 所有天使
  rationale: 忠实表达带冠词的复数名词与 πάντες 所强调的全体范围；“天使”是《启示录》中 ἄγγελοι 自然且通行的译法。
- source_word: εἱστήκεισαν
  choice: 都站在
  rationale: 该形式在此表达持续的站立状态；“都站在”既保留状态意义，也符合现代汉语叙事习惯。
- source_word: κύκλῳ τοῦ θρόνου καὶ τῶν πρεσβυτέρων καὶ τῶν τεσσάρων ζῴων
  choice: 在宝座、众长老和四个活物的周围
  rationale: κύκλῳ 加属格表示环绕这些对象的空间位置；此译法保留三组并列对象，不额外解释其相互位置。
- source_word: τῶν πρεσβυτέρων
  choice: 众长老
  rationale: “长老”是 πρεσβύτεροι 在《启示录》天上宝座场景中的通行称谓；加“众”使复数在汉语中清楚自然。
- source_word: τῶν τεσσάρων ζῴων
  choice: 四个活物
  rationale: “活物”保留 ζῷα 作为有生命之受造者的含义，也符合启示文学的异象语境，避免误译成普通“动物”或擅自界定其身份。
- source_word: ἔπεσαν ἐνώπιον τοῦ θρόνου ἐπὶ τὰ πρόσωπα αὐτῶν
  choice: 他们便在宝座前俯伏下来，脸伏于地
  rationale: “俯伏下来”表达 ἔπεσαν 的动作，“脸伏于地”明确保留原文所描写的身体姿态；“在宝座前”传达 ἐνώπιον 的空间意义。
- source_word: προσεκύνησαν τῷ θεῷ
  choice: 敬拜上帝
  rationale: 受敬拜者明确是上帝，而且前文已描述俯伏动作，因此“敬拜”恰当地表达 προσκυνέω 在此处超越单纯行礼的宗教含义。
theological_decisions:
- issue: 宝座周围的 ζῷα 如何称呼
  choice: 四个活物
  alternative: 四个有生命者
  rationale: 采用不把这些存在等同于普通动物、也不进一步解释其具体身份的译法，从而保留启示文学意象及原词的宽度。
- issue: προσκυνέω 对上帝所表达的行为
  choice: 敬拜上帝
  alternative: 向上帝下拜
  rationale: 原文已用“俯伏、脸伏于地”描写外在姿态；此处译作“敬拜”可表达该动作以神为对象时的宗教意义，又不重复弱化为单纯身体动作。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“俯伏下来，脸伏于地”兼顾动作的清楚性与异象场景的肃穆感；并列结构尽量贴近原文，不对宝座、长老和活物之间的空间关系作额外推断。
