id: REV.7.10
reference: Revelation 7:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ κράζουσι φωνῇ μεγάλῃ λέγοντες· Ἡ σωτηρία τῷ θεῷ ἡμῶν τῷ καθημένῳ ἐπὶ τῷ θρόνῳ καὶ τῷ ἀρνίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/010.yaml
  text: And they cry out with a loud voice[a], saying, “Salvation belongs to our God, who sits on the throne, and to the Lamb!”
translation:
  language: zh_hans
  text: 他们高声呼喊说：“救恩属于坐在宝座上的我们的上帝，也属于羔羊！”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或更直译：“救恩归于坐在宝座上的我们的上帝，也归于羔羊！”
    reason: 原文是没有明说动词的欢呼句，直译为“救恩归于……”更贴近其句式；正文用“属于”表达与格的归属含义。
lexical_decisions:
- source_word: κράζουσι
  choice: 呼喊
  rationale: 现在时直陈语气在异象叙事中呈现鲜明、持续的动作；“呼喊”既保留强烈语气，也比单纯的“说”更贴近原词。
- source_word: φωνῇ μεγάλῃ
  choice: 高声
  rationale: 该与格短语表示方式；“高声”是自然、庄重的现代汉语表达，并保留声音洪亮的意象。
- source_word: λέγοντες
  choice: 说
  rationale: 分词引出呼喊的具体内容；汉语用“呼喊说”能清楚衔接引语。
- source_word: Ἡ σωτηρία
  choice: 救恩属于
  rationale: 原文是无系词的欢呼句，定冠词名词“救恩”后接归属与格；“救恩属于”自然表达归属或归因，同时不把 σωτηρία 过度解释为单纯的“胜利”。
- source_word: τῷ θεῷ ἡμῶν
  choice: 坐在宝座上的我们的上帝
  rationale: 与格指出救恩所归属的对象；将修饰语按原文关系理解为修饰“我们的上帝”，并用现代汉语清楚表达。
- source_word: τῷ καθημένῳ ἐπὶ τῷ θρόνῳ
  choice: 坐在宝座上的
  rationale: 现在分词短语与“我们的上帝”同位；“坐在宝座上的”保留异象的鲜明画面，表达自然。
- source_word: τῷ ἀρνίῳ
  choice: 羔羊
  rationale: 这是《启示录》中对耶稣的固定称号；译为“羔羊”可保留其献祭与弥赛亚意象。
theological_decisions:
- issue: 救恩与上帝及羔羊的关系
  choice: 译作“救恩属于……我们的上帝，也属于羔羊”
  alternative: 较为直译地译作“愿救恩归给……我们的上帝和羔羊”或“救恩归于……我们的上帝和羔羊”
  rationale: 原文以两个并列与格共同承接“救恩”，把救恩同时归于上帝和羔羊。“属于……也属于……”明确保留这种共同归属及礼仪性欢呼，又不进一步限定其教义含义。
translation_notes:
  register: 采用现代、庄重且适合公开诵读的简体中文。“高声呼喊”传达异象场面的强烈声音；“上帝”依项目用语；“羔羊”作为称号保留其传统意象。脚注标记已在正文中标出。
