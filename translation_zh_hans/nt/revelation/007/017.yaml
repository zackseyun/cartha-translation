id: REV.7.17
reference: Revelation 7:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὅτι τὸ ἀρνίον τὸ ἀνὰ μέσον τοῦ θρόνου ⸀ποιμανεῖ αὐτούς, καὶ ⸀ὁδηγήσει αὐτοὺς ἐπὶ ζωῆς πηγὰς ὑδάτων· καὶ ἐξαλείψει ὁ θεὸς πᾶν δάκρυον ἐκ τῶν ὀφθαλμῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/017.yaml
  text: because the Lamb in the midst of the throne will shepherd them[a], and he will guide them to springs of the water of life[c][b], and God will wipe away every tear from their eyes.
translation:
  language: zh_hans
  text: 因为宝座中央[a]的羔羊必牧养他们，并要引导[b]他们到生命水的泉源[c]；上帝也必擦去他们眼中的每一滴泪。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“宝座中间”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“引领”。
    reason: lexical_alternative
  - marker: c
    text: 或译：“活水的泉源”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρνίον
  choice: 羔羊
  rationale: 保留《启示录》中已形成的基督论称号，也保有献祭与弥赛亚的意蕴；不直译其指小形式，以免产生轻佻或仅指幼小动物的感觉。
- source_word: ἀνὰ μέσον τοῦ θρόνου
  choice: 宝座中央
  rationale: 表达羔羊相对于宝座所处的中心位置，现代汉语自然简洁，同时以脚注保留“宝座中间”这一较贴近原文形式的译法。
- source_word: ποιμανεῖ
  choice: 必牧养
  rationale: 保留ποιμαίνω的牧者意象，以及“羔羊成为牧者”这一刻意形成的悖论；上下文随后提到引往水泉，也支持牧养义而非单译为统治。
- source_word: ὁδηγήσει
  choice: 要引导
  rationale: 准确传达带领并指引前行之意，又不与前面的“牧养”合并；“引领”列为可行异译。
- source_word: ἐπὶ ζωῆς πηγὰς ὑδάτων
  choice: 到生命水的泉源
  rationale: 将ζωῆς自然地理解为修饰“水”，即赐生命之水；“泉源”符合自然涌流的图景，ἐπί随移动动词译作“到”。
- source_word: ἐξαλείψει
  choice: 必擦去
  rationale: 在安慰性的语境中，“擦去”自然地呈现亲近而彻底除去眼泪的动作，比“涂抹掉”更合宜。
- source_word: πᾶν δάκρυον
  choice: 每一滴泪
  rationale: 以个体化的表达体现πᾶν加单数名词所强调的完全性；量词“滴”符合现代汉语习惯。
- source_word: ἐκ τῶν ὀφθαλμῶν αὐτῶν
  choice: 他们眼中的
  rationale: 自然传达眼泪从眼中被擦去的图景，符合现代汉语表达。
theological_decisions:
- issue: 羔羊同时作为牧者的基督论悖论
  choice: 直译为“羔羊必牧养他们”
  alternative: “羔羊必照料他们”或“羔羊必统治他们”
  rationale: 原文刻意把羔羊置于牧者角色中，既呼应圣经的牧者意象，也构成《启示录》独特而有力的图景；不应为求平顺而削弱这一张力。
- issue: 末句中上帝与羔羊的关系
  choice: 明确保留“上帝”作“擦去”的主语
  alternative: 沿用羔羊作为省略的主语
  rationale: 希腊文明确出现ὁ θεός作为ἐξαλείψει的主语。译文保留独立主语，既忠于句法，也不把异象中的指称对象混为一谈。
- issue: “生命”与“水泉”的修饰关系
  choice: 译为“生命水的泉源”
  alternative: “活水的泉源”
  rationale: 属格结构允许汉语中两种相近表达；正文采用较直接体现“生命之水”的译法，同时用脚注保留“活水”读法，不将意象的语义范围限制为仅指流动的水。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“必……并要……”表达异象中将来应验的语气；保留“羔羊—牧养—泉源”的连贯牧者图景，并将所有异译脚注标记放在对应词语之后。
