  text: Καὶ ἤκουσα τὸν ἀριθμὸν τῶν ἐσφραγισμένων, ⸀ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες, ⸀ἐσφραγισμένοι ἐκ πάσης φυλῆς υἱῶν Ἰσραήλ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/004.yaml
  text: 'And I heard the number of those who had been sealed: one hundred forty-four thousand[a], sealed from every tribe of the sons of Israel.'
translation:
  language: zh_hans
  text: 我听见受印之人的数目：十四万四千人；他们都是从以色列子孙[a]的各支派中受印的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“以色列人”。希腊原文直译为“以色列的众子”，保留了阳性的族谱用语。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσα
  choice: 我听见了
  rationale: 不定过去时直陈语气在叙事报告中自然译为“我听见了”，表示约翰听到所报的数目。
- source_word: τὸν ἀριθμὸν τῶν ἐσφραγισμένων
  choice: 受印之人的数目
  rationale: ἀριθμός译为“数目”；完成时被动分词指已经受印、并处于该状态的人。汉语“受印之人”简洁地表达这一结果状态。
- source_word: ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες
  choice: 十四万四千人
  rationale: 按现代汉语计数习惯准确表达144,000；补出量词“人”使句子自然，未改变原意。
- source_word: ἐσφραγισμένοι
  choice: 受印的
  rationale: 保留原文对“受印”分词的重复，同时用“都是……受印的”形成自然的汉语说明结构。
- source_word: ἐκ πάσης φυλῆς
  choice: 从……各支派中
  rationale: ἐκ表示来源；πάσης与单数φυλῆς构成逐一分配的意义，汉语“各支派”比“每一个支派”更符合族谱语境。
- source_word: υἱῶν Ἰσραήλ
  choice: 以色列众子
  rationale: 保留υἱῶν明确的阳性复数及其族谱、后裔色彩；“众子”较“儿子们”庄重，也能与后续支派名单衔接。
theological_decisions:
- issue: 在支派名单语境中如何翻译υἱῶν Ἰσραήλ
  choice: 以色列众子
  alternative: 以色列子民；以色列的后裔
  rationale: 原文明确使用阳性名词υἱοί，并带有族谱和支派归属意味。正文保留“众子”，不把它预先解释为某一末世论群体；脚注列出更自然但会弱化阳性措辞的汉语表达。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“受印”沿用启示录语境中的简洁术语；调整语序为“都是从……中受印的”，以自然汉语保留原文重复出现的“受印”。
