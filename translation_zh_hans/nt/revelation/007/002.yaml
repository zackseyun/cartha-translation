id: REV.7.2
reference: Revelation 7:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ εἶδον ἄλλον ἄγγελον ἀναβαίνοντα ἀπὸ ἀνατολῆς ἡλίου, ἔχοντα σφραγῖδα θεοῦ ζῶντος, καὶ ἔκραξεν φωνῇ μεγάλῃ τοῖς τέσσαρσιν ἀγγέλοις οἷς ἐδόθη αὐτοῖς ἀδικῆσαι τὴν γῆν καὶ τὴν θάλασσαν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/002.yaml
  text: And I saw another angel coming up from the east[a], having the seal of the living God, and he cried out with a loud voice to the four angels to whom it had been given to harm the earth and the sea,
translation:
  language: zh_hans
  text: 我又看见另一位天使从东方上来[a]，拿着活着的上帝的印；他向那四位天使大声呼喊，就是那得以伤害地和海的四位，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“从日出之处”。
    reason: 保留ἀπὸ ἀνατολῆς ἡλίου的字面意象，同时正文采用自然的方向表达。
lexical_decisions:
- source_word: ἄλλον ἄγγελον
  choice: 另一位天使
  rationale: ἄλλον表明这是与前述四位天使有别的另一位；“另一位天使”自然、准确。
- source_word: ἀναβαίνοντα
  choice: 上来
  rationale: 保留向上移动及约翰异象观察视角的意味，同时符合现代汉语习惯。
- source_word: ἀπὸ ἀνατολῆς ἡλίου
  choice: 从东方
  rationale: 该短语字面为“从日出之处”，在上下文中用作方向表达；正文译“从东方”，字面意象收入脚注。
- source_word: ἔχοντα σφραγῖδα
  choice: 拿着……的印
  rationale: ἔχω表示持有；此处“拿着”比抽象的“有”更适合具体的印，同时不进一步断定其用途。
- source_word: θεοῦ ζῶντος
  choice: 永生上帝
  rationale: “永生上帝”是自然且庄重的汉语圣经表达，传达上帝是活着的，与无生命之神像形成潜在对照；也可直译为“活着的上帝”。
- source_word: ἔκραξεν φωνῇ μεγάλῃ
  choice: 大声呼喊
  rationale: 简洁传达κράζω的强烈呼喊和φωνῇ μεγάλῃ的音量，避免生硬直译为“以大声音”。
- source_word: τοῖς τέσσαρσιν ἀγγέλοις
  choice: 那四位天使
  rationale: 定冠词与数词合译为“那四位”，自然指回7:1的四位天使。
- source_word: οἷς ἐδόθη αὐτοῖς ἀδικῆσαι
  choice: 那得以伤害……的四位
  rationale: “得以”保留被动式所含的获准或获授意味，却不增添原文没有明说的“权柄”或指定授予者。复指“四位”使中文关系结构清晰。
- source_word: τὴν γῆν καὶ τὴν θάλασσαν
  choice: 地和海
  rationale: γῆ在此与海并列，指受灾害的受造领域；“地和海”保留启示录的宏观图景，也比“陆地和海洋”更符合庄重经文语体。
theological_decisions:
- issue: ἐδόθη所表达的授予或许可
  choice: 译作“得以伤害”
  alternative: “得了权柄去伤害”或“获准伤害”
  rationale: 希腊文使用神学被动语态，但未明说所给的是“权柄”，也未明确指出授予者。“得以”保留受授或蒙准的含义和施事者未明的张力，不作过度补充。
- issue: ἀπὸ ἀνατολῆς ἡλίου的方向与意象
  choice: 正文译“从东方”，脚注保留“从日出之处”
  alternative: 正文直译“从日出之处”
  rationale: “从东方”清楚表达方向功能；脚注让读者看见原文的太阳升起意象，不预先规定其象征意义。
- issue: θεοῦ ζῶντος的表达
  choice: “永生上帝”
  alternative: “活着的上帝”
  rationale: “永生上帝”在现代中文中庄重自然，并表达ζῶντος的神学分量；备选更贴近分词字面，但略显解释性口语。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“我又看见”衔接启示录异象叙述；“就是……”明确关系从句的指代。句末保留逗号，因为本节语法和内容延续到下一节。
