id: REV.7.15
reference: Revelation 7:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: διὰ τοῦτό εἰσιν ἐνώπιον τοῦ θρόνου τοῦ θεοῦ, καὶ λατρεύουσιν αὐτῷ ἡμέρας καὶ νυκτὸς ἐν τῷ ναῷ αὐτοῦ, καὶ ὁ καθήμενος ἐπὶ ⸂τοῦ θρόνου⸃ σκηνώσει ἐπ’ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/015.yaml
  text: For this reason they are before the throne of God[a], and they serve him day and night in his temple, and the one seated on the throne will spread his tent over them.
translation:
  language: zh_hans
  text: 因此，他们在上帝的宝座前，昼夜在他的殿中敬奉他；坐在宝座上的那一位必在他们之上支搭帐幕[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“必在他们上方居住”或“必覆庇他们”。希腊语动词与“帐幕”或“会幕”的意象有关。
    reason: 该动词兼具支搭帐幕、居住临在和覆庇的意味；主文保留帐幕意象，脚注列出可成立的替代译法。
lexical_decisions:
- source_word: διὰ τοῦτό
  choice: 所以
  rationale: 承接上一节对这群人身份与经历的说明，清楚表达由此得出的结果；现代汉语自然简洁。
- source_word: ἐνώπιον
  choice: 在……前
  rationale: 既可表达空间位置，也包含身处上帝临在中的意味，符合宝座场景。
- source_word: λατρεύουσιν
  choice: 敬奉
  rationale: 该词在这里指向献给上帝的宗教性服事；“敬奉”兼顾敬拜与服事，不把含义局限为言语赞美。
- source_word: ἡμέρας καὶ νυκτός
  choice: 昼夜
  rationale: 保留原文“白昼和黑夜”的持续性意象，同时符合庄重、自然的现代汉语表达。
- source_word: ναῷ
  choice: 殿
  rationale: ναός特指圣殿或圣所；上下文已表明这是上帝的殿，“殿”简明而庄重。
- source_word: ὁ καθήμενος ἐπὶ τοῦ θρόνου
  choice: 坐在宝座上的那一位
  rationale: 保留分词称号的持续状态和指称作用，并采用清楚自然的现代汉语。
- source_word: σκηνώσει ἐπ’ αὐτούς
  choice: 必在他们之上搭起帐幕
  rationale: 保留σκηνόω的帐幕意象及ἐπί所表达的“在……之上”，呈现上帝临在并覆庇他们的图景，而不把比喻直接改写成抽象解释。
theological_decisions:
- issue: σκηνώσει所表达的上帝临在与帐幕意象
  choice: 必在他们之上搭起帐幕
  alternative: 必覆庇他们；必在他们之上居住
  rationale: 主文保留帐幕这一具体意象，使上帝保护性的临在与圣幕背景仍然可见；脚注列出较偏重功能或居住含义的译法，避免把原文的多重意味限定为单一解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“昼夜”“敬奉”“殿”保持启示文学和敬拜场景的庄严感；“搭起帐幕”保留原文鲜明比喻，脚注说明其居住与覆庇含义。
