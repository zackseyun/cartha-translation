  to: 因此，他们在上帝的宝座前，昼夜在他的殿中敬奉他；坐在宝座上的那一位必在他们之上支搭帐幕[a]。
  rationale: 将“所以”调整为较庄重、明确承接前文理由的“因此”；将“搭起帐幕”调整为“支搭帐幕”，以更自然地表达原文所保留的帐幕覆盖图景。同步修订脚注的居住译法，使其汉语更通顺，并保留原文的语义张力。
