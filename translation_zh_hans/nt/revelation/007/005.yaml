  text: ἐκ φυλῆς Ἰούδα δώδεκα χιλιάδες ⸀ἐσφραγισμένοι, ἐκ φυλῆς Ῥουβὴν δώδεκα χιλιάδες, ἐκ φυλῆς Γὰδ δώδεκα χιλιάδες,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/005.yaml
  text: from the tribe of Judah[a], twelve thousand were sealed; from the tribe of Reuben, twelve thousand; from the tribe of Gad, twelve thousand.
translation:
  language: zh_hans
  text: 犹大支派中有一万二千人受了印；流便支派中有一万二千人；迦得支派中有一万二千人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκ
  choice: ……支派中
  rationale: 这里表示来源或所属群体。汉语列举各支派人数时，用“某支派中”比逐字译作“从某支派”更自然，同时保留重复句式。
- source_word: φυλῆς
  choice: 支派
  rationale: 在以色列谱系和十二支派的语境中，“支派”是准确且通行的译法；“宗族”会缩小其组织层级。
- source_word: Ἰούδα
  choice: 犹大
  rationale: 采用现代中文圣经传统中通行的人名及支派名译法。
- source_word: δώδεκα χιλιάδες
  choice: 一万二千人
  rationale: 准确表达数目；汉语需要量词，按上下文所数的是人，因此补出“人”，不增加身份解释。
- source_word: ἐσφραγισμένοι
  choice: 受了印
  rationale: 保留被动含义，并以自然汉语表达已经被加印的状态。该分词明写于第一支派人数之后，后续平行分句承接而省略。
- source_word: Ῥουβὴν
  choice: 吕便
  rationale: 采用现代中文圣经传统中通行的支派名译法。
- source_word: Γὰδ
  choice: 迦得
  rationale: 采用现代中文圣经传统中通行的支派名译法。
theological_decisions:
- issue: 支派名单中ἐσφραγισμένοι的语法作用与涵盖范围
  choice: 在第一分句译作“有一万二千人受了印”，后两分句保留原文的省略。
  alternative: 较形式化地译作“犹大支派中，一万二千名受印的”；或在每个支派后都重复“受了印”。
  rationale: 希腊文被动分词位于第一项人数之后，直接修饰所数的人，并在名单结构中自然涵盖随后各项。只在第一项明确译出，既使现代汉语完整通顺，又不把原文的省略过度填满。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。保留三项名单的平行节奏；“受了印”承接7:3—4的语境，但不额外解释印的性质或受印者身份。
