source:
  edition: SBLGNT
  text: Μετὰ ταῦτα εἶδον, καὶ ἰδοὺ ὄχλος πολύς, ὃν ἀριθμῆσαι ⸀αὐτὸν οὐδεὶς ἐδύνατο, ἐκ παντὸς ἔθνους καὶ φυλῶν καὶ λαῶν καὶ γλωσσῶν, ⸀ἑστῶτες ἐνώπιον τοῦ θρόνου καὶ ἐνώπιον τοῦ ἀρνίου, περιβεβλημένους στολὰς λευκάς, καὶ ⸀φοίνικες ἐν ταῖς χερσὶν αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/009.yaml
  text: After these things I looked[a], and behold, a great multitude that no one was able to count, from every nation and tribe and people and language, standing before the throne and before the Lamb, clothed in white robes, with palm branches in their hands.
translation:
  language: zh_hans
  text: 这些事以后，我观看，看哪，有极多的人，无人能数清；他们来自各国、各支派、各民族和说各种语言的人中，站在宝座和羔羊面前，身穿白袍，手里拿着棕榈枝。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: 这些事以后
  rationale: 保留复数指示词ταῦτα及《启示录》异象推进的次序感，比“此后”更贴近原文。
- source_word: εἶδον, καὶ ἰδοὺ
  choice: 我观看，看哪
  rationale: “观看”适合异象叙述；“看哪”保留ἰδού引人注意的语用力度及庄重语气。
- source_word: ὄχλος πολύς
  choice: 一大群人
  rationale: 自然表达人数众多的群体，同时避免使用现代语境中可能偏随意的“大群群众”。
- source_word: ὃν ἀριθμῆσαι αὐτὸν οὐδεὶς ἐδύνατο
  choice: 没有人能数得过来
  rationale: 以自然现代汉语表达无人有能力数清这一含义，不额外解释人数无限。
- source_word: ἐκ παντὸς ἔθνους καὶ φυλῶν καὶ λαῶν καὶ γλωσσῶν
  choice: 来自各邦国、各支派、各民族、各语言群体
  rationale: 分别保留ἔθνος、φυλή、λαός、γλῶσσα所指的政治文化、宗族、族群和语言类别；正文采用自然汉语的分配式表达，原文单复数转换另见脚注。
- source_word: ἑστῶτες
  choice: 站在
  rationale: 简洁保留现在时分词所描绘的现场姿态。
- source_word: ἐνώπιον τοῦ θρόνου καὶ ἐνώπιον τοῦ ἀρνίου
  choice: 站在宝座和羔羊面前
  rationale: “面前”准确表达ἐνώπιον；汉语中共用一次方位词自然清楚，不改变两者并列关系。
- source_word: περιβεβλημένους στολὰς λευκάς
  choice: 身穿白袍
  rationale: στολή指长袍一类衣服；“身穿白袍”既简练，又保留其异象性画面。
- source_word: φοίνικες ἐν ταῖς χερσὶν αὐτῶν
  choice: 手里拿着棕榈枝
  rationale: 此处φοῖνιξ按上下文指棕榈枝；“拿着”自然呈现枝子在他们手中的图景。
theological_decisions:
- issue: 基督论语境中的ἀρνίον
  choice: 羔羊
  alternative: 小羊羔
  rationale: ἀρνίον虽在词形来源上带小称色彩，却在《启示录》中已成为固定的基督论称号；“羔羊”既为汉语读者所熟悉，也避免不自然地强调幼小。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“看哪”“宝座”“羔羊”“白袍”保留启示文学的肃穆色彩；句法适度汉语化，但不消解原文各族群类别及其单复数上的细微张力。
