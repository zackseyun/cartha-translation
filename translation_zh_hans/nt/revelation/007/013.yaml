  naturalness: “这些身穿白袍的人是谁？他们是从哪里来的？”自然、清楚，语体适合经文。加入“这时”以承接Καὶ，并用“回答我说”不会造成不自然的表达。
  terminology: “长老”“白袍”均为准确、自然并适合《启示录》语境的既有术语。无需增设脚注；“从哪里来的”已充分表达πόθεν ἦλθον，中文不必复制英语现在完成时与简单过去时之间的风格差异。
