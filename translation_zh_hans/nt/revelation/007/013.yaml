source:
  edition: SBLGNT
  text: Καὶ ἀπεκρίθη εἷς ἐκ τῶν πρεσβυτέρων λέγων μοι· Οὗτοι οἱ περιβεβλημένοι τὰς στολὰς τὰς λευκὰς τίνες εἰσὶν καὶ πόθεν ἦλθον;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/013.yaml
  text: Then one of the elders answered[a], saying to me, “These who are clothed in the white robes—who are they, and where have they come from?”
translation:
  language: zh_hans
  text: 这时，一位长老回答我说：“这些身穿白袍的人是谁？他们是从哪里来的？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: 有
  rationale: 此处承接异象叙事。汉语不必逐字译作“然后”或“又”，以“有一位……”自然推进场景。
- source_word: ἀπεκρίθη…λέγων μοι
  choice: 对我说
  rationale: ἀπεκρίθη可有“回答、回应”之意，但上下文并无约翰刚提出的问题；希腊语“回答说”也可用于主动开口。合并译为“对我说”更符合现代汉语，同时不误示约翰先发问。
- source_word: εἷς ἐκ τῶν πρεσβυτέρων
  choice: 一位长老
  rationale: 自然表达部分结构，即长老群体中的一位；“一位”也保持庄重语体。
- source_word: Οὗτοι οἱ περιβεβλημένοι
  choice: 这些身穿……的人
  rationale: περιβεβλημένοι为完成时被动分词，描写已经穿上并处于穿着状态的人；“身穿”简洁地表达其当前状态。
- source_word: τὰς στολὰς τὰς λευκάς
  choice: 白袍
  rationale: στολή指长袍或礼服；在《启示录》反复出现的意象中译作“白袍”准确、自然且便于保持术语一致。
- source_word: τίνες εἰσὶν
  choice: 是谁
  rationale: 现代汉语直接询问这群人的身份，保留原文问题。
- source_word: πόθεν ἦλθον
  choice: 是从哪里来的
  rationale: πόθεν询问来源；ἦλθον为不定过去时。汉语“从哪里来的”自然涵盖其来处及已来到当前场景的含义，无须强行标示英语式时态区别。
theological_decisions:
- issue: ἀπεκρίθη在无先行问题时的表达
  choice: 译作“对我说”
  alternative: “回答我说”或“回应说”
  rationale: 原词确有“回答”这一常见义，但在闪语影响下的希腊叙事中也可作为开口说话的程式。译作“对我说”避免在汉语中凭空制造一个先前问题，不涉及教义取舍。
- issue: ἦλθον的时体表达
  choice: 译作“是从哪里来的”
  alternative: “从哪里来”或“从哪里而来”
  rationale: 保留已抵达当前异象场景并询问来源的意思；现代汉语不以形态时态区分简单过去与现在完成，因此不另加解释性成分。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“白袍”与《启示录》的核心意象相称；整体问句简洁自然。原文没有需要在本节中文正文中标注的实质性异文或不可兼容歧义，因此不设脚注。
