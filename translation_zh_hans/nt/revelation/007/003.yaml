  text: λέγων· Μὴ ἀδικήσητε τὴν γῆν μήτε τὴν θάλασσαν μήτε τὰ δένδρα, ⸀ἄχρι σφραγίσωμεν τοὺς δούλους τοῦ θεοῦ ἡμῶν ἐπὶ τῶν μετώπων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/003.yaml
  text: saying[a], “Do not harm the earth or the sea or the trees until we have sealed the slaves of our God on their foreheads.”
translation:
  language: zh_hans
  text: 说：“不要伤害大地、海洋或树木，直到我们在属于我们上帝的奴隶们的额头上盖了印。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγων
  choice: 说
  rationale: 以自然简洁的引语引介词承接前文说话者。
- source_word: ἀδικήσητε
  choice: 伤害
  rationale: 此处宾语是大地、海洋和树木，所指是在审判中造成损害，而不是对人行不义。
- source_word: γῆν
  choice: 大地
  rationale: 与“海洋”和“树木”并列，呈现宇宙性审判场景；“大地”比局部性的“土地”更合适。
- source_word: θάλασσαν
  choice: 海洋
  rationale: 准确表达该名词在此处所指的海，并与“大地”自然并列。
- source_word: δένδρα
  choice: 树木
  rationale: 直接、自然地表达复数名词。
- source_word: ἄχρι
  choice: 等……以后再说
  rationale: 清楚表达禁令持续到盖印完成为止，并使现代汉语句式自然。
- source_word: σφραγίσωμεν
  choice: 我们……盖了印
  rationale: 保留第一人称复数，并表达在伤害发生前须完成的盖印行动。
- source_word: δούλους
  choice: 奴隶
  rationale: 保留该词所强调的隶属关系；在此异象中，盖印标明这些人属于上帝。
- source_word: τοῦ θεοῦ ἡμῶν
  choice: 我们上帝的
  rationale: 保留属格所表达的归属，也保留说话者所说的“我们的”。
- source_word: ἐπὶ τῶν μετώπων αὐτῶν
  choice: 在……额上
  rationale: 以自然现代汉语准确表达盖印的位置。
theological_decisions:
- issue: 在末世异象的归属语境中如何翻译 δοῦλος
  choice: 奴隶
  alternative: 奴仆；仆人
  rationale: 本节的盖印突出这些人属于上帝，因此正文保留 δοῦλος 的隶属力度；脚注列出较柔和且常见的译法，避免掩盖词义范围。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“大地、海洋和树木”保持异象中的三项并列；“等……以后再说”明确表达先完成盖印、随后才可施行伤害的时间界限。
