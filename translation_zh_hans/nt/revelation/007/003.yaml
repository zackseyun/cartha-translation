  terminology: “奴隶”可保留δούλους所含的归属、受主人支配的力度；脚注列出“奴仆”“仆人”作为可行替代。以“属于我们上帝的”表达τοῦ θεοῦ ἡμῶν，既保留“我们的”，也避免“我们上帝的”在现代汉语中的黏连和歧义。
