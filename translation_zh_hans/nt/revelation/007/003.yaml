  source_fidelity: 译文准确保留了对“大地、海洋、树木”的三重禁令、第一人称复数的盖印行动、上帝的归属关系及盖印的位置。原文的ἄχρι界定禁令持续至盖印完成；“等……以后再说”虽意图表达此界限，却带有汉语口语中“暂且不谈／以后再议”的附加语感，不宜用于此处。
