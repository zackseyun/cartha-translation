  rationale: 修订仅调整时间界限和领属结构的汉语表达：以“直到……”直接对应ἄχρι，并以“属于我们上帝的奴隶们的额头上”清楚呈现“我们上帝”“他们”及额头上的盖印。保留“大地”“海洋”“树木”及“奴隶”的译法和脚注所说明的词义范围。
