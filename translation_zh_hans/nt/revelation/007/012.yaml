id: REV.7.12
reference: Revelation 7:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: λέγοντες· Ἀμήν· ἡ εὐλογία καὶ ἡ δόξα καὶ ἡ σοφία καὶ ἡ εὐχαριστία καὶ ἡ τιμὴ καὶ ἡ δύναμις καὶ ἡ ἰσχὺς τῷ θεῷ ἡμῶν εἰς τοὺς αἰῶνας τῶν αἰώνων· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/012.yaml
  text: saying[a], “Amen! The blessing and the glory and the wisdom and the thanksgiving and the honor and the power and the might be to our God forever and ever. Amen.”
translation:
  language: zh_hans
  text: 说：“阿们！愿颂赞、荣耀、智慧、感谢、尊荣、权能和力量都归给我们的神，直到永永远远。[a]阿们！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较贴近字面可译为“直到世世代代”；原文以重复表达强调无尽久远。
    reason: 保留 εἰς τοὺς αἰῶνας τῶν αἰώνων 的重复修辞，并以自然的现代汉语说明其强调无尽时间的作用。
lexical_decisions:
- source_word: λέγοντες
  choice: 说
  rationale: 现在时主动分词引出众者共同宣告的内容；汉语用“说”简洁自然，并由上下文承接其复数主语。
- source_word: Ἀμήν / ἀμήν
  choice: 阿们
  rationale: 在礼仪和颂赞语境中采用通行音译；首尾重复，保留原文为颂歌加框的结构。
- source_word: ἡ εὐλογία
  choice: 颂赞
  rationale: 此处是向神发出的七重颂赞之一，“颂赞”比“祝福”更自然地表达归给神的赞美，同时不把它仅缩减为言语上的称颂。
- source_word: ἡ δόξα
  choice: 荣耀
  rationale: 符合颂赞语境中的常用含义，并保留庄重语体。
- source_word: ἡ σοφία
  choice: 智慧
  rationale: 直接保留该名词所表达的神圣属性；汉语无需逐项重复冠词。
- source_word: ἡ εὐχαριστία
  choice: 感谢
  rationale: 表达向神所献的感恩，现代汉语自然明白，并保持名词性列举。
- source_word: ἡ τιμή
  choice: 尊荣
  rationale: 在敬拜语境中表示归给神的尊敬与荣耀，不取经济价值之义。
- source_word: ἡ δύναμις
  choice: 权能
  rationale: 表示能力与大能；采用“权能”既符合庄重颂赞语体，也可与后面的 ἰσχύς 区分。
- source_word: ἡ ἰσχύς
  choice: 力量
  rationale: 表示强力、力量；与“权能”并列，保留原文近义词叠加所形成的充实节奏。
- source_word: τῷ θεῷ ἡμῶν
  choice: 归给我们的神
  rationale: 与格表示颂赞所归向的对象；补出“归给”，符合汉语颂赞句式，又不将原文无动词结构过度解释为静态所有。
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: 直到永永远远
  rationale: 以现代汉语中通行而庄重的表达传达无尽久远；较贴近形式的说法收入脚注。
theological_decisions:
- issue: 颂赞句中补出原文省略的谓语
  choice: 愿……都归给我们的神
  alternative: ……都是我们神的；……都要归于我们的神
  rationale: 希腊文在七个名词之后没有明说动词。“愿……归给”保留颂赞和祈愿式的归荣耀语气，避免把它单纯解释为所有权陈述。
- issue: 区分 δύναμις 与 ἰσχύς
  choice: 权能……力量
  alternative: 能力……大能；能力……力量
  rationale: 两个词意义相近但并非同一个词；分别译出可保留七重颂赞中近义词层叠的修辞力度，而不人为赋予二者严格的教义差别。
- issue: εὐλογία 在向神颂赞中的含义
  choice: 颂赞
  alternative: 祝福；赞美
  rationale: 该词本可表示“祝福”，但在归给神的颂赞公式中，“颂赞”更自然；同时承认原词比单纯“赞美”具有更宽的语义范围。
translation_notes:
  register: 采用现代、庄重而易懂的敬拜语言。七个带冠词的希腊名词在汉语中不机械重复虚词，以并列顿号保持节奏；“愿……都归给”使无动词的希腊颂赞式在汉语中完整自然。脚注标记置于其实际说明的“直到永永远远”之后。
