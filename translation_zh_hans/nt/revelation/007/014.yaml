  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ⸀εἴρηκα αὐτῷ· Κύριέ μου, σὺ οἶδας. καὶ εἶπέν μοι· Οὗτοί εἰσιν οἱ ἐρχόμενοι ἐκ τῆς θλίψεως τῆς μεγάλης, καὶ ἔπλυναν τὰς στολὰς αὐτῶν καὶ ἐλεύκαναν ⸀αὐτὰς ἐν τῷ αἵματι τοῦ ἀρνίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/014.yaml
  text: And I said to him[a], “My lord, you know.” And he said to me, “These are the ones coming out of the great tribulation[b]. They washed their robes and made them white in the blood of the Lamb.”
translation:
  language: zh_hans
  text: 我对他说：“我主，你知道。”他对我说：“这些人就是从那大患难中出来的[a]。他们洗了自己的长袍，并在羔羊的血中使长袍变得洁白[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大患难”也可译作“大苦难”或“大困厄”。希腊语θλῖψις可指压力、患难、苦楚或困厄。
    reason: lexical_alternative
  - marker: b
    text: 这里保留原文“在羔羊的血中”这一表达。希腊语也可按工具意义理解为“借着羔羊的血”，但直译更能保留《启示录》中以血洗净并使衣袍洁白的悖论意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴρηκα
  choice: 我对他说
  rationale: 虽为完成时形式，但在约翰叙事的对话引语中可起简单过去时的作用；现代汉语以“我对他说”最自然。
- source_word: Κύριέ μου
  choice: 我主
  rationale: 说话对象是一位天上的长老，并非明确指上帝或弥赛亚。“我主”保留尊敬而不过度判定其身份；“先生”则会削弱异象场景的庄重感。
- source_word: σὺ οἶδας
  choice: 你知道
  rationale: 明说的代词带有轻微强调；汉语“你知道”已能自然表达约翰恭敬承认长老知道答案的语气。
- source_word: οἱ ἐρχόμενοι
  choice: 从……中出来的
  rationale: 以“出来的”保留现在分词所表达的持续或特征性动作，不译成明确的单次过去事件。
- source_word: ἐκ τῆς θλίψεως τῆς μεγάλης
  choice: 从那大患难中
  rationale: “大患难”准确传达θλῖψις所含的压迫、苦难和困厄，并保留定冠词所指向的特定性；不据任何末世论体系进一步解释。
- source_word: ἔπλυναν
  choice: 洗了
  rationale: 以完成体“了”呈现不定过去时所概括的完整行动，同时不先行加入“洗净”这一结果性解释。
- source_word: στολάς
  choice: 长袍
  rationale: στολή指长而庄重的袍服；“长袍”比泛称“衣服”更贴合本段异象。
- source_word: ἐλεύκαναν
  choice: 使长袍洁白了
  rationale: 保留动词“使之变白”的使动意义；重复“长袍”以免汉语代词指向含混。
- source_word: ἐν τῷ αἵματι
  choice: 在……的血中
  rationale: 直保留ἐν的空间性表达，使血反而带来洁白这一启示录特有的悖论意象不被弱化；工具性理解仍以脚注说明。
- source_word: τοῦ ἀρνίου
  choice: 羔羊
  rationale: ἀρνίον在《启示录》中用作耶稣的称号；中文“羔羊”按惯例即可体现这一称号性用法。
theological_decisions:
- issue: 对长老的称呼Κύριέ μου
  choice: 我主
  alternative: 先生；主啊
  rationale: “我主”保留原文的敬称和所有关系用语，却不明确把长老等同于神或基督；这种译法也比“先生”更符合天上异象的庄重语域。
- issue: “那大患难”的所指
  choice: 那大患难
  alternative: 那大苦难；那大困厄
  rationale: 按词义翻译而不判定它专指某一末世时期、泛指信徒历代所受苦难，还是兼有两者，以保留原文的神学张力。
- issue: 以羔羊之血使衣袍洁白的意象
  choice: 在羔羊的血中使长袍洁白
  alternative: 借着羔羊的血使长袍洁白
  rationale: 保留ἐν的直观表达和血使衣袍洁白的悖论；同时承认该介词在语义上也可能具有工具性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。引语结构简洁；“我主”有意保留对天上长老的敬称而不把他神格化；“那大患难”沿用读者熟悉的经文用语，但以脚注交代词义范围；末句略具陌生感，以保存原文刻意形成的血与洁白的强烈反差。
