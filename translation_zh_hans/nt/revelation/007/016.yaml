source:
  edition: SBLGNT
  text: οὐ πεινάσουσιν ἔτι ⸀οὐδὲ διψήσουσιν ἔτι, οὐδὲ μὴ πέσῃ ἐπ’ αὐτοὺς ὁ ἥλιος οὐδὲ πᾶν καῦμα,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/016.yaml
  text: They will hunger no more[a], nor thirst anymore; the sun will not strike them, nor any scorching heat.
translation:
  language: zh_hans
  text: 他们不再饥饿，也不再口渴；太阳绝不会灼晒他们[a]，任何酷热也不会临到他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文可直译为“太阳绝不会落在他们身上”。
    reason: 保留πέσῃ ἐπ’ αὐτούς“落在……身上”的字面意象，并说明正文采用“灼晒”的自然汉语表达。
lexical_decisions:
- source_word: πεινάσουσιν
  choice: 饥饿
  rationale: 以动词性表达对应将来时主动语态，并与“口渴”构成自然的平行。
- source_word: ἔτι
  choice: 不再
  rationale: 在否定的末世应许中表示从此停止；两处均译为“不再”，清楚而整齐。
- source_word: διψήσουσιν
  choice: 口渴
  rationale: 保留具体的身体经验，并与“饥饿”平行，不将其预先解释为属灵隐喻。
- source_word: οὐδὲ μὴ πέσῃ ἐπ’ αὐτούς
  choice: 绝不会灼晒他们
  rationale: οὐδὲ μή加虚拟式构成强烈的将来否定，故用“绝不会”；πέσῃ ἐπ’ αὐτούς字面为“落在他们身上”，在太阳作主语时译作“灼晒他们”较符合现代汉语，也保留其伤害性的具体意象。
- source_word: ὁ ἥλιος
  choice: 太阳
  rationale: 直接对应原文名词。
- source_word: πᾶν καῦμα
  choice: 任何灼热
  rationale: πᾶν在否定结构中用“任何”表达周全性；καῦμα指灼人的炎热，译为“灼热”既简洁又保留强度。
theological_decisions:
- issue: 对以赛亚书49:10的呼应及末世复兴意象
  choice: 保留饥饿、口渴、太阳和灼热的具体意象
  alternative: 把饥渴主要译解为属灵渴慕
  rationale: 经文本身以具体的受苦经验表达终末安慰，并呼应先知性的复兴应许；译文不把这些意象限定为纯粹的隐喻。
- issue: 强烈否定的表达
  choice: 用“绝不会”体现οὐδὲ μή的强调语气
  alternative: 仅译为“不会”
  rationale: 原文在太阳这一分句使用强调性的将来否定；“绝不会”能自然传达其确定性，而不增添额外教义含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“饥饿／口渴”保持平行；分号划分身体匮乏与环境侵袭两组意象。脚注标记紧接其所说明的“灼晒他们”。
