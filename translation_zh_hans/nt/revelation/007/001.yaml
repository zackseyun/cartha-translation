id: REV.7.1
reference: Revelation 7:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ⸀Μετὰ τοῦτο εἶδον τέσσαρας ἀγγέλους ἑστῶτας ἐπὶ τὰς τέσσαρας γωνίας τῆς γῆς, κρατοῦντας τοὺς τέσσαρας ἀνέμους τῆς γῆς, ἵνα μὴ πνέῃ ἄνεμος ἐπὶ τῆς γῆς μήτε ἐπὶ τῆς θαλάσσης μήτε ἐπὶ ⸀πᾶν δένδρον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/001.yaml
  text: After this I saw four angels standing at the four corners of the earth[b][a], holding back the four winds of the earth so that no wind might blow on the earth or on the sea or on any tree.
translation:
  language: zh_hans
  text: 此后，我看见四位天使站在大地的四角[a]，挡住大地的四方之风，使风不吹在大地上、海上或任何一棵树上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大地的四角”是惯用表达，指大地的四极或四个方向。
    reason: cultural_note
lexical_decisions:
- source_word: Μετὰ τοῦτο
  choice: 此后
  rationale: 这是启示文学中常见的时序衔接语；“此后”自然、简洁，并保留事件先后关系。
- source_word: εἶδον
  choice: 我看见
  rationale: 直接表达异象中的视觉感知，无须扩写为“我观看，看见”。
- source_word: τέσσαρας ἀγγέλους
  choice: 四位天使
  rationale: 忠实对应数词与名词；量词“位”符合现代汉语对有位格者的表达。
- source_word: ἑστῶτας
  choice: 站在
  rationale: 保留完成时分词所描写的站立状态；不采用解释性更强的“驻守”。
- source_word: ἐπὶ τὰς τέσσαρας γωνίας τῆς γῆς
  choice: 在大地的四角
  rationale: 保留原文具有启示文学色彩的空间意象；“在”比生硬的“在……之上”更合乎汉语。
- source_word: κρατοῦντας
  choice: 挡住
  rationale: 下文说明其目的在于不让风吹动，因此这里表达的是拦阻、控制；“挡住”自然且未额外说明手段。
- source_word: τοὺς τέσσαρας ἀνέμους τῆς γῆς
  choice: 大地的四方之风
  rationale: “四方之风”自然传达从四个方向而来的风，同时保留“四”的对应关系与诗性意象。
- source_word: ἵνα μὴ πνέῃ ἄνεμος
  choice: 使风不吹
  rationale: 简明保留ἵνα所表达的目的或结果关系；不强行在译文中区分这两种相近功能。
- source_word: ἐπὶ τῆς γῆς μήτε ἐπὶ τῆς θαλάσσης μήτε ἐπὶ πᾶν δένδρον
  choice: 在大地上、海上或任何一棵树上
  rationale: 在前置否定“使风不吹”的管辖下，用“或”自然连接三个范围；“任何一棵树”体现πᾶν的逐一、无一例外之意。
theological_decisions:
- issue: 启示异象中γῆ的范围
  choice: 译为“大地”
  alternative: “土地”或“地”
  rationale: 四角、四方之风、大地、海和所有树共同构成广阔的宇宙性场景；“大地”避免把范围收窄为某一片土地，也比“地球”少现代科学术语色彩。
- issue: “大地的四角”的宇宙图景语言
  choice: 保留“四角”意象，并加注说明其惯用含义
  alternative: 正文直接意译为“大地的四极”或“四方尽头”
  rationale: 原文的形象性应予保留，不宜在正文中把它消解为解释；脚注可防止读者误把惯用表达理解为对地球形状所作的技术性陈述。
- issue: ἵνα从句的功能
  choice: 用“使”表达目的或预期结果
  alternative: “为要使”或“以致”
  rationale: 此处目的与结果语义接近；“使”既自然，又不把原文明确限定为单一范畴。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留启示文学的“四角”和“四方之风”等意象；避免“地球”等过度现代化措辞，也避免古奥的“其上”“无一”等表达。
