  text: ἐκ φυλῆς Συμεὼν δώδεκα χιλιάδες, ἐκ φυλῆς Λευὶ δώδεκα χιλιάδες, ἐκ φυλῆς Ἰσσαχὰρ δώδεκα χιλιάδες,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/007.yaml
  text: from the tribe of Simeon[a], twelve thousand; from the tribe of Levi, twelve thousand; from the tribe of Issachar, twelve thousand.
translation:
  language: zh_hans
  text: 西缅支派中有一万二千人；利未支派中有一万二千人；以萨迦支派中有一万二千人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκ
  choice: ……中
  rationale: 此处表示来源或所属群体。汉语用“某支派中”自然、准确，也能保留逐项列举的结构。
- source_word: φυλῆς
  choice: 支派
  rationale: 在以色列宗族谱系语境中，φυλή指以各先祖命名的支派；“支派”是现代中文圣经语境中准确且通行的对应词。
- source_word: Συμεὼν
  choice: 西缅
  rationale: 采用现代中文中通行的圣经人名译法；这里该名用于指其支派。
- source_word: δώδεκα χιλιάδες
  choice: 一万二千人
  rationale: 按汉语数词习惯译出数目，并补出由上下文明确限定的量词“人”，使句子自然；原文此处承接7:4所述受印者。
- source_word: Λευὶ
  choice: 利未
  rationale: 采用现代中文中通行的圣经人名译法。原文明确把利未列入此名单，译文不作解释性增补。
- source_word: Ἰσσαχὰρ
  choice: 以萨迦
  rationale: 采用现代中文中通行的圣经人名译法；这里该名用于指其支派。
theological_decisions:
- issue: 支派名单的重复句式
  choice: 每个支派都重复“某支派中有一万二千人”
  alternative: 合并为“西缅、利未和以萨迦支派各有一万二千人”
  rationale: 希腊文逐项重复ἐκ φυλῆς…δώδεκα χιλιάδες，形成庄严的列举节奏；保留重复可避免抹平启示文学的形式特征。
- issue: 利未被列入支派名单
  choice: 正文直接译出“利未支派”，不附加解释
  alternative: 在正文说明利未在旧约支派分配中的特殊地位
  rationale: 本节只将利未列在名单中；解释其特殊性会加入原文没有明说的诠释。
- issue: 数目所指对象
  choice: 译作“一万二千人”
  alternative: 仅译“一万二千”，或明确增译“一万二千名受印的人”
  rationale: “人”是汉语所需且由上下文清楚表明；但不在本节重复增译“受印”，以免把上文信息过度写入本句。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以分号分隔三项，保留原文平行、重复的名单节奏。中文“……支派中”已经自然表达ἐκ的来源/所属含义，无需为“从……出来”设置脚注，因为该直译在此处不如正文自然，也未形成实质性释义差异。
