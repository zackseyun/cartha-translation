  text: καὶ ἐν αὐτῇ ⸀αἷμα προφητῶν καὶ ἁγίων εὑρέθη καὶ πάντων τῶν ἐσφαγμένων ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/024.yaml
  text: And in her was found the blood of prophets and saints[c][b][a], and of all who have been slaughtered on the earth.
translation:
  language: zh_hans
  text: 在她[c]里面，发现了众先知、圣徒[a]和地上一切被屠杀[b]之人的血。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣徒”也可译作“圣洁的人”或“上帝圣洁的子民”。
    reason: lexical_alternative
  - marker: b
    text: “被屠杀”也可译作“被杀”。原文动词比一般表示“杀死”的词语更强，常带有宰杀或残酷杀戮的意味。
    reason: lexical_alternative
  - marker: c
    text: “她”指巴比伦；在上下文的异象中，巴比伦被描绘成一个女人。
    reason: cross_reference
lexical_decisions:
- source_word: ἐν αὐτῇ
  choice: 在她里面
  rationale: 阴性代词回指上下文中被拟人化为女人的巴比伦；用“她”保留异象中的女性意象。
- source_word: αἷμα
  choice: 血
  rationale: 直译自然，并保留上下文中流血与血债的司法意味。
- source_word: προφητῶν
  choice: 众先知
  rationale: προφήτης 的标准译法；复数以“众”自然表达。
- source_word: ἁγίων
  choice: 圣徒
  rationale: 在《启示录》中通常指归属上帝、分别为圣的人；“圣徒”简洁庄重，并以脚注列出更直白的译法。
- source_word: εὑρέθη
  choice: 发现了
  rationale: 保留被动式所表达的揭露、查明意味；汉语中“发现了……的血”自然且清楚。
- source_word: πάντων τῶν ἐσφαγμένων
  choice: 一切被屠杀之人
  rationale: σφάζω 比一般的“杀”更强，含残酷杀戮意味；被动表达不补出经文未明说的施害者。
- source_word: ἐπὶ τῆς γῆς
  choice: 地上
  rationale: 符合《启示录》的广泛、末世性语境，不局限为某一地区的“土地”。
theological_decisions:
- issue: 巴比伦罪责的范围
  choice: 保留经文全面性的指控：众先知、圣徒以及地上一切被屠杀之人的血都在她里面被发现。
  alternative: 可将末句理解为末世异象中的概括性或夸张性司法语言，而非逐一归责的历史陈述。
  rationale: 希腊文没有限定这种象征如何对应具体历史；译文不缩小其范围，也不替读者决定应按何种程度理解其普遍性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“在她里面”保留拟人化意象；“发现了……的血”维持原文的司法揭露色彩。脚注标记均置于正文中，并紧邻相关表达。
