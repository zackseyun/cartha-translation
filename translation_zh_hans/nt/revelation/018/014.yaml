id: REV.18.14
reference: Revelation 18:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἡ ὀπώρα ⸂σου τῆς ἐπιθυμίας τῆς ψυχῆς⸃ ἀπῆλθεν ἀπὸ σοῦ, καὶ πάντα τὰ λιπαρὰ καὶ τὰ λαμπρὰ ἀπώλετο ἀπὸ σοῦ, καὶ ⸀οὐκέτι ⸂οὐ μὴ αὐτὰ εὑρήσουσιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/014.yaml
  text: And the fruit of your soul’s desire has gone away from you[a], and all the rich and splendid things have perished from you[b], and they will never be found again.
translation:
  language: zh_hans
  text: 你心里所贪恋的果子已经离你而去；一切奢华绚丽之物也都从你那里消失了，再也找不到了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“人再也找不到这些东西了。”希腊原文使用第三人称复数，却没有明说主语。
    reason: 保留εὑρήσουσιν不定主语的另一种直译方式。
lexical_decisions:
- source_word: ὀπώρα
  choice: 果子
  rationale: 指成熟的果实，尤可指晚熟果品；这里既延续前文货物语境，也保留原文以果实表达所欲之物的意象。
- source_word: σου τῆς ἐπιθυμίας τῆς ψυχῆς
  choice: 你心里所贪恋的
  rationale: ψυχή在此表达人的内在欲望，用现代汉语“心里”自然传达；ἐπιθυμία在巴比伦奢欲的语境中译作“贪恋”，保留强烈而带负面的欲求。
- source_word: ἀπῆλθεν ἀπὸ σοῦ
  choice: 已经离你而去
  rationale: 准确表达离开并不再归属的结果；“已经”体现哀歌中既成且持续的丧失。
- source_word: πάντα τὰ λιπαρὰ καὶ τὰ λαμπρὰ
  choice: 一切奢华绚丽之物
  rationale: λιπαρά在此不是单指肥美食物，而泛指丰厚奢华之物；λαμπρά指耀眼、华美，故译“绚丽”，切合商业奢华语境。
- source_word: ἀπώλετο ἀπὸ σοῦ
  choice: 都从你那里消失了
  rationale: 中间态/不及物用法表示失去、灭没；“消失”比“灭亡”更自然地描述这些奢侈品从巴比伦手中永远失落。
- source_word: οὐκέτι οὐ μὴ αὐτὰ εὑρήσουσιν
  choice: 再也找不到了
  rationale: “再也……不到”传达οὐκέτι与οὐ μή叠加的强烈、终局性否定，同时用汉语无主句保留希腊文第三人称复数主语未明的特点。
theological_decisions:
- issue: εὑρήσουσιν的隐含主语
  choice: 用无主句“再也找不到了”
  alternative: “人再也找不到这些东西了”或“他们再也找不到这些东西了”
  rationale: 希腊文第三人称复数没有明说主语，可作不定人称理解。汉语无主句既自然，也不额外指定寻找者，并保留原文的含混性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以分号划分两层失落，并将末句处理为自然的汉语无主句。主文中的脚注标记置于相关末句之后。
