source:
  edition: SBLGNT
  text: γόμον χρυσοῦ καὶ ἀργύρου καὶ λίθου τιμίου καὶ ⸀μαργαριτῶν καὶ βυσσίνου καὶ ⸀πορφύρας καὶ σιρικοῦ καὶ κοκκίνου, καὶ πᾶν ξύλον θύϊνον καὶ πᾶν σκεῦος ἐλεφάντινον καὶ πᾶν σκεῦος ἐκ ξύλου τιμιωτάτου καὶ χαλκοῦ καὶ σιδήρου καὶ μαρμάρου,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/012.yaml
  text: cargo of gold and silver and precious stones and pearls and fine linen and purple cloth and silk and scarlet cloth[a], and every kind of citron wood and every kind of ivory vessel and every kind of vessel made from very precious wood and bronze and iron and marble,
translation:
  language: zh_hans
  text: 金、银、宝石、珍珠、细麻布、紫色布、丝绸、猩红色布，以及各样香木[a]、各样象牙器具、各样用极贵重的木材、铜、铁和大理石制成的器具，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “香木”原文指一种昂贵的芳香木材，传统上称为“推雅木”；也有人认为可能是香橼木，但其确切树种不能确定。
    reason: 避免将有争议的θύϊνος植物鉴定固定为“香柏木”，同时保留传统名称及常见的具体认定。
lexical_decisions:
- source_word: γόμον
  choice: 货物（由上节领起，正文不重复）
  rationale: γόμος指船载货物或货载；本节在句法上延续18:11的“货物”，因此中文按清单自然续接，不另加“货物”。
- source_word: λίθου τιμίου
  choice: 宝石
  rationale: 希腊文虽用单数形式，却可作材料的集合称谓；中文“宝石”自然涵盖集合意义。
- source_word: μαργαριτῶν
  choice: 珍珠
  rationale: 准确保留复数所表达的类别性商品意义。
- source_word: βυσσίνου
  choice: 细麻布
  rationale: 指优质细麻织物；“细麻布”既通俗又保留其贵重纺织品含义。
- source_word: πορφύρας
  choice: 紫色布
  rationale: 该词可指紫色染料、布料或衣物；商业货品清单中译作“紫色布”较明确，同时不缩窄为某种服装。
- source_word: σιρικοῦ
  choice: 丝绸
  rationale: 指丝或丝织品；“丝绸”是现代中文贸易清单中自然的对应表达。
- source_word: κοκκίνου
  choice: 朱红色布
  rationale: 该词指鲜红或朱红色的材料；与“紫色布”保持平行，并明确这里列的是纺织商品。
- source_word: πᾶν ξύλον θύϊνον
  choice: 各样香柏木
  rationale: θύϊνος指一种昂贵而芳香的木材，通常与北非香柏类木材相联系；中文用“香柏木”表达其香木性质，具体植物鉴定仍有不确定性，故加注说明。
- source_word: πᾶν σκεῦος ἐλεφάντινον
  choice: 各样象牙器具
  rationale: σκεῦος是宽泛的器物用语；“器具”比“器皿”更能涵盖各种象牙制品。
- source_word: πᾶν σκεῦος ἐκ ξύλου τιμιωτάτου
  choice: 各样用极贵重的木材……制成的器具
  rationale: τιμιωτάτου是最高级形式，“极贵重”在中文中自然保留其强化语气；ἐκ译为“用……制成”。
- source_word: χαλκοῦ
  choice: 铜
  rationale: χαλκός可指铜或铜合金；中文“铜”能保留这种材料范围，不必武断限定为青铜。
- source_word: σιδήρου
  choice: 铁
  rationale: 标准而明确的材料名称。
- source_word: μαρμάρου
  choice: 大理石
  rationale: 标准词义，符合贵重器物材料清单的语境。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的商品清单语体。本节是跨节句子的延续，故以名词清单开头并以逗号收尾；重复“各样”以反映πᾶν的平行结构。
