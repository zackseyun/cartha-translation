  text: καὶ ⸀ἔκραξαν βλέποντες τὸν καπνὸν τῆς πυρώσεως αὐτῆς λέγοντες· Τίς ὁμοία τῇ πόλει τῇ μεγάλῃ;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/018.yaml
  text: And they cried out as they saw the smoke of her burning[a], saying, “What city is like the great city?”
translation:
  language: zh_hans
  text: 他们看见她被焚烧所冒出的烟时，就呼喊说：“哪一座城能与那座大城相比呢？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“有什么能与那座大城相比呢？”希腊文的疑问式带有省略；“哪一座城”是按上下文显明比较对象。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκραξαν
  choice: 呼喊
  rationale: 该词表示高声喊叫；“呼喊”既保留声音强度，也符合庄重叙事语体。
- source_word: βλέποντες
  choice: 看见……就
  rationale: 现在分词表示与主句动作同时发生；汉语用“看见……就”自然呈现当时所见与呼喊之间的紧密关系。
- source_word: τὸν καπνὸν τῆς πυρώσεως αὐτῆς
  choice: 她焚烧的烟
  rationale: πύρωσις指焚烧的过程或状态；保留“她”以延续上下文把巴比伦大城人格化为女性的文学形象。
- source_word: Τίς ὁμοία τῇ πόλει τῇ μεγάλῃ;
  choice: 有什么能与这座大城相比呢？
  rationale: 希腊文省略系词，τίς也可按语境理解为“谁/什么”；此译保留比较式反问，不另行补出“哪一座城”，并以“能……相比”构成自然的现代汉语。
- source_word: τῇ πόλει τῇ μεγάλῃ
  choice: 这座大城
  rationale: 定冠词结构指向上下文已明确的那座大城；“这座”在汉语中清楚承接当前所见对象。
theological_decisions:
- issue: 巴比伦／大城的女性人格化
  choice: 用“她”指称大城
  alternative: 用“它”指称大城
  rationale: 启示录持续把巴比伦描绘为女性与城市；“她”保留原文的文学和神学意象，而不额外解释其身份。
- issue: 比较对象的省略
  choice: 译为“有什么能与这座大城相比呢？”
  alternative: 译为“哪一座城能与这座大城相比呢？”
  rationale: 原文τίς的指称较开放，且句式有所省略；不明确补入“城”，可在自然汉语中保留原文的概括性和修辞张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。句式保持哀叹性的反问语气；“焚烧的烟”紧贴原文属格结构，并保留城市的女性人格化。
