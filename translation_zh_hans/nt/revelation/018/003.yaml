id: REV.18.3
reference: Revelation 18:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὅτι ἐκ τοῦ οἴνου τοῦ θυμοῦ τῆς πορνείας αὐτῆς ⸀πέπτωκαν πάντα τὰ ἔθνη, καὶ οἱ βασιλεῖς τῆς γῆς μετ’ αὐτῆς ἐπόρνευσαν, καὶ οἱ ἔμποροι τῆς γῆς ἐκ τῆς δυνάμεως τοῦ στρήνους αὐτῆς ἐπλούτησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/003.yaml
  text: For all the nations have drunk from the wine of the wrath of her sexual immorality[a], and the kings of the earth committed sexual immorality with her[c][b], and the merchants of the earth grew rich from the power of her luxury.
translation:
  language: zh_hans
  text: 因为列国都因她淫乱之烈怒的酒而倾倒了[a]；地上的君王与她行淫[b]；地上的商人都因她穷奢极欲的势力而发了财[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “她淫乱之烈怒的酒”也可理解为“她淫乱之激情的酒”，或“因她淫乱而招致烈怒的酒”。希腊文的连续属格有不止一种理解，而 θυμός 既可指“烈怒”，也可指强烈的“激情”。有些希腊文本在这里作“喝了”；所据文本则作“倾倒了”。
    reason: lexical_alternative
  - marker: b
    text: 这里“行淫”的说法很可能是隐喻，指与她建立腐败、拜偶像并剥削人的关系；正文保留了希腊文的性意象。
    reason: alternative_reading
  - marker: c
    text: “穷奢极欲”所译的希腊词指奢靡放纵、傲慢挥霍的生活，并非仅指物质生活舒适。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 承接上文，说明巴比伦倾倒及受审判的原因，保留因果关系。
- source_word: ἐκ τοῦ οἴνου
  choice: 因……的酒
  rationale: ἐκ 表示来源或原因；与 πέπτωκαν 连用时，译为“因……而倾倒”既保留酒的意象，也使汉语因果关系清楚。
- source_word: θυμοῦ
  choice: 烈怒
  rationale: θυμός 可指烈怒或强烈激情；启示录的审判语境支持“烈怒”，但属格连缀仍有歧义，故在脚注中保留另一种理解。
- source_word: πορνείας
  choice: 淫乱
  rationale: 保留原文的性意象，同时可在上下文中承载偶像崇拜、腐败结盟等隐喻含义，不直接将其解释为某一种神学概念。
- source_word: πέπτωκαν
  choice: 倾倒了
  rationale: 按所给 SBLGNT 文本 πέπτωκαν（πίπτω 的完成时）译作“倾倒了”，而不是依据异文 πέπωκαν 译作“喝了”；“倾倒”也与巴比伦倾倒的上下文形成呼应。
- source_word: πάντα τὰ ἔθνη
  choice: 列国都
  rationale: 自然表达所有国家或民族整体受其影响的意思。
- source_word: μετ’ αὐτῆς ἐπόρνευσαν
  choice: 与她行淫
  rationale: 简洁保留 πορνεύω 的鲜明性隐喻以及与前文 πορνεία 的词义呼应。
- source_word: ἔμποροι
  choice: 商人
  rationale: 符合第18章贸易和奢侈品交易的经济语境。
- source_word: ἐκ τῆς δυνάμεως
  choice: 因……的势力
  rationale: 保留 δύναμις 的力量、影响力含义，而不将其窄化为财富本身。
- source_word: στρήνους
  choice: 穷奢极欲
  rationale: στρῆνος 不只是舒适富足，而含奢靡放纵、傲慢挥霍之意；“穷奢极欲”能自然传达这种过度与腐化。
- source_word: ἐπλούτησαν
  choice: 发了财
  rationale: 现代汉语中自然明确地表达商人因贸易而致富的结果。
theological_decisions:
- issue: πορνεία／πορνεύω 应直译性意象，还是解释为偶像崇拜或属灵不忠
  choice: 正文保留“淫乱／行淫”
  alternative: 偶像崇拜；属灵上的淫乱；腐败结盟
  rationale: 启示录有意用性不忠描绘宗教、政治和经济上的腐败关系；保留原有意象，避免将其神学含义限定为单一解释。
- issue: πέπτωκαν 与异文 πέπωκαν 的取舍
  choice: 依所给 SBLGNT 正文译为“倾倒了”
  alternative: 依 πέπωκαν 译为“喝了”
  rationale: 翻译以所给原文证据为先；πέπτωκαν 明确来自动词 πίπτω，意为“已经倒下／倾倒”，不应改按另一希腊异文翻译。
- issue: τοῦ θυμοῦ τῆς πορνείας 的属格关系
  choice: 正文译为“她淫乱烈怒的酒”，保留压缩而多义的意象
  alternative: 她淫乱激情的酒；因她淫乱而招致烈怒的酒
  rationale: 连续属格可有不同关系，θυμός 也可指烈怒或激情；正文不把这一张力完全解释掉，并以脚注说明。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“列国”“行淫”保留启示录的经文语体和强烈意象；“发了财”使经济结果表达自然。分号呈现原文三个并列分句。
