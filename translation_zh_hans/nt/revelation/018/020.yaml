review_pass:
  verdict: revise
  source_fidelity: 译文总体把握了对天、圣徒、使徒和先知的欢庆呼吁，也保留了末句的司法语义。但“天哪”在现代汉语中通常是表示惊讶或感叹的固定语气词，不能稳妥地承担对“天”的呼格；“从她那里为你们作出判决”则使“从她那里”修饰“作出判决”，汉语关系不清。修订以“天啊，你要……”明确保留拟人化呼格，以“向她施行了为你们作出的审判”表达原文中上帝针对“她”的司法行动，同时不在主文擅自改作“报仇”。
  naturalness: 原文第二句补出“你们也要欢喜”是合乎汉语的；但首句“天哪，要因她而欢喜”不自然，且“天哪”语用不当。末句应调整语序，使受审判的一方及审判与“你们”的关系明确可读。
  terminology: “圣徒、使徒和先知”准确且符合启示录的庄重语体；“上帝”与本译文体系一致。“审判”比“作出判决”更能保持 κρίνω／κρίμα 的同根司法关联。
  issues:
  - severity: medium
    issue: “天哪”未能适当地翻译 οὐρανέ 的呼格。
    rationale: 现代普通话中的“天哪”常是“oh my”的感叹，通常不表示向拟人化的天直接说话。应使用“天啊，你要……”等明确呼格结构。
  - severity: medium
    issue: “从她那里为你们作出判决”语义关系含混且不够自然。
    rationale: “从她那里”在汉语中容易被理解为判决的来源，而非上帝向她施行、从她身上追讨的司法行动。调整为“向她施行了为你们作出的审判”，并在脚注说明原文压缩的 ἐξ αὐτῆς，可兼顾可读性与保留歧义。
  - severity: low
    issue: 脚注中的拟直译“从她那里审判了你们的判决”汉语不通。
    rationale: 可明确标为尽量逐词的近似表达，并说明这不是自然汉语句式，以免脚注本身造成误解。
