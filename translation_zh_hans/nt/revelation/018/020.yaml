source:
  edition: SBLGNT
  text: Εὐφραίνου ἐπ’ αὐτῇ, οὐρανέ, καὶ οἱ ἅγιοι καὶ οἱ ἀπόστολοι καὶ οἱ προφῆται, ὅτι ἔκρινεν ὁ θεὸς τὸ κρίμα ὑμῶν ἐξ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/020.yaml
  text: Rejoice over her[a], O heaven, and you saints and apostles and prophets, because God has judged your judgment from her.
translation:
  language: zh_hans
  text: 天啊，你要因她欢喜！圣徒、使徒和先知啊，你们也要欢喜！因为上帝已经向她施行了为你们作出的审判[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊原文表达十分浓缩，尽量逐词可近似为“上帝已经从她那里审判了你们的审判”，但这不是自然的汉语句式。也可解释为：“上帝已经为你们审判她”，或“上帝已经在她身上替你们伸冤。”原文的 κρίνω／κρίμα 为同根词；ἐξ αὐτῆς 的具体作用也有争议。
    reason: 说明 κρίνω／κρίμα 的同根结构及 ἐξ αὐτῆς 的难解用法，并保留不将主文限定为“伸冤”或“报仇”的解释空间。
lexical_decisions:
- source_word: Εὐφραίνου
  choice: 要……欢喜
  rationale: 保留第二人称单数命令语气；在汉语中以“要”表达直接而庄重的劝令。
- source_word: ἐπ’ αὐτῇ
  choice: 因她而
  rationale: ἐπί加与格在表示欢喜的动词后可指欢喜的对象或缘由；“因她而”既自然，也避免把欢喜误解为认同她。
- source_word: οὐρανέ
  choice: 天哪
  rationale: 保留单数呼格及拟人化的直接呼唤，符合现代汉语庄重语体。
- source_word: οἱ ἅγιοι
  choice: 众圣徒
  rationale: 此处指属上帝的圣洁子民；“圣徒”简洁且为启示录语境中的通行译法。
- source_word: οἱ ἀπόστολοι
  choice: 使徒
  rationale: 与“先知”并列时，最可能是指具有特定身份的使徒，而非泛指使者。
- source_word: οἱ προφῆται
  choice: 先知
  rationale: 准确对应原词，并符合经文中的惯常称谓。
- source_word: ἔκρινεν
  choice: 已经……作出判决
  rationale: 表达不定过去时所指向的已完成司法行动，同时保留 κρίνω 的审判性语义。
- source_word: τὸ κρίμα ὑμῶν
  choice: 为你们作出判决
  rationale: 所有格结构高度压缩，可能指涉及他们、归于他们或为他们作出的判决；此译法在汉语中可懂，又不直接改写成“报仇”。
- source_word: ἐξ αὐτῆς
  choice: 从她那里
  rationale: 尽量保留 ἐκ/ἐξ 的来源或取自之意，以及原文刻意压缩而略显不寻常的表达；具体司法含义留在脚注说明。
theological_decisions:
- issue: 是否把上帝对巴比伦的司法行动明确译成替圣徒报仇或给他们伸冤
  choice: 保留司法用语，译作“从她那里为你们作出判决”
  alternative: 上帝已经为你们审判她／上帝已经在她身上替你们伸冤
  rationale: 原文使用 κρίνω/κρίμα 的同根司法词语，并没有明用“报仇”的动词。主文保留判决概念与介词结构，不把所含的昭雪、追讨或惩罚意味扩写为唯一解释。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。“天哪”保留呼格；第二句补出“你们也要欢喜”，使单数命令向随后并列群体的延伸在汉语中清楚。主文刻意保留末句司法表达的一定压缩性，脚注提供较顺畅的解释性读法。
