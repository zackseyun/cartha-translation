revisions:
- from: 天哪，要因她而欢喜！众圣徒、使徒和先知啊，你们也要欢喜！因为上帝已经从她那里为你们作出判决[a]。
  to: 天啊，你要因她欢喜！圣徒、使徒和先知啊，你们也要欢喜！因为上帝已经向她施行了为你们作出的审判[a]。
  rationale: 修订纠正“天哪”的现代语用问题，并重组末句的汉语语序。主文仍使用“审判”而非“报仇”或“伸冤”，保留原文的司法性及压缩表达；脚注则透明说明较字面的构造和可行的解释性理解。
