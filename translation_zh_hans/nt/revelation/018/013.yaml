  text: καὶ κιννάμωμον ⸂καὶ ἄμωμον⸃ καὶ θυμιάματα καὶ μύρον καὶ λίβανον καὶ οἶνον καὶ ἔλαιον καὶ σεμίδαλιν καὶ σῖτον καὶ ⸂κτήνη καὶ πρόβατα⸃, καὶ ἵππων καὶ ῥεδῶν καὶ σωμάτων, καὶ ψυχὰς ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/013.yaml
  text: and cinnamon and spice and incense and perfume and frankincense and wine and olive oil and fine flour and wheat and cattle and sheep[a], and horses and chariots and slaves, that is[b], human souls.
translation:
  language: zh_hans
  text: 还有肉桂、香料、熏香、香膏、乳香、酒、橄榄油、细面、小麦、牲畜、羊、马、马车、身体[a]和人的灵魂。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “身体”在此商业清单中通常指被当作货物买卖的人，即奴隶。原文随后说“人的灵魂”；这两个并列说法突出了把人当作商品的情形。
    reason: lexical_alternative
lexical_decisions:
- source_word: κιννάμωμον
  choice: 桂皮
  rationale: 指作为进口香料的肉桂；“桂皮”是现代汉语中自然、明确的商品名称。
- source_word: ἄμωμον
  choice: 香料
  rationale: 指一种昂贵的芳香植物或香料，具体品种难以确定；用较宽泛的“香料”保留不确定性。
- source_word: θυμιάματα
  choice: 香
  rationale: 在商品清单中指焚烧用的香料，而非焚香这一行为。
- source_word: μύρον
  choice: 香膏
  rationale: 指昂贵的芳香油膏；“香膏”既自然，也符合古代商品语境。
- source_word: λίβανον
  choice: 乳香
  rationale: 特指乳香，与前面泛指的“香”有别。
- source_word: ἔλαιον
  choice: 橄榄油
  rationale: 此处通常指橄榄油；明确译出可避免现代读者误解为其他油类。
- source_word: σεμίδαλιν
  choice: 细面
  rationale: 指上等精细面粉；“细面”简洁，并保留圣经商品清单的庄重语感。
- source_word: σῖτον
  choice: 小麦
  rationale: 虽可泛指谷物，但在此类地中海贸易清单中以“小麦”为较可能的具体含义。
- source_word: κτήνη
  choice: 牲畜
  rationale: 泛指家养的大型动物；原词未限定为牛，故不收窄为“牛”。
- source_word: πρόβατα
  choice: 羊
  rationale: 直接指羊，与前面的牲畜类别并列。
- source_word: ῥεδῶν
  choice: 车
  rationale: 指四轮车辆，可能是载人马车；“车”不擅自规定其为战车或豪华马车。
- source_word: σωμάτων
  choice: 人的身体
  rationale: 原文直译为“身体”，在商业语境中指被买卖的奴隶。保留身体意象，以呈现把人商品化的震撼效果。
- source_word: ψυχὰς ἀνθρώπων
  choice: 人的性命
  rationale: ψυχή可指生命、性命或人本身；“人的性命”保留与“身体”的张力，也突显交易所践踏的是活生生的人。
theological_decisions:
- issue: σωμάτων καὶ ψυχὰς ἀνθρώπων 的关系
  choice: 人的身体和人的性命
  alternative: 奴隶，也就是人口
  rationale: 希腊文以两个并列宾语表达，未明说“也就是”。直译保留身体与性命之间的修辞张力，并由脚注说明奴隶贸易语境，避免在正文中把并列关系确定为解释性同位关系。
translation_notes:
  register: 采用现代、庄重而易懂的商品清单句式。重复使用顿号形成累积效果；在结尾保留“人的身体和人的性命”的突兀表达，以呈现原文对人口买卖的谴责。
