id: REV.18.11
reference: Revelation 18:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ οἱ ἔμποροι τῆς γῆς ⸂κλαίουσιν καὶ πενθοῦσιν⸃ ἐπ’ ⸀αὐτήν, ὅτι τὸν γόμον αὐτῶν οὐδεὶς ἀγοράζει οὐκέτι,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/011.yaml
  text: And the merchants of the earth weep and mourn over her[a], because no one buys their cargo anymore[b],
translation:
  language: zh_hans
  text: 地上[a]的商人也为她哭泣哀悼，因为再也没有人购买他们的船货[b]了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“世上”。原文也可指“土地”或“大地”；在《启示录》中，这一说法往往具有广泛、世界性的范围。
    reason: lexical_alternative
  - marker: b
    text: 或译“货物”。原词可指船上装载的一批货物，也可泛指用于贸易的商品。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔμποροι
  choice: 商人
  rationale: 这是现代汉语中对从事商业贸易者最自然、通行的称呼，也符合本章奢侈品与海运贸易的语境。
- source_word: τῆς γῆς
  choice: 地上
  rationale: γῆ既可指“大地、世界”，也可指“土地、地方”。“地上”保留原词的空间意象，并容纳《启示录》中常见的广泛、世界性范围。
- source_word: κλαίουσιν καὶ πενθοῦσιν
  choice: 哭泣哀悼
  rationale: 分别保留κλαίω的哭泣和πενθέω的哀悼之意，以呈现两个并列动词所形成的加强语气。
- source_word: ἐπ’ αὐτήν
  choice: 为她
  rationale: 在哀哭语境中，ἐπί加宾格可指哀悼的对象；“为她”是自然汉语，同时保留巴比伦作为女性形象和城邑人格化的表达。
- source_word: γόμον
  choice: 船货
  rationale: γόμος可指船上装载的一批货物；“船货”比泛称“商品”更贴合本章的海运贸易背景，也自然引出下文的货物清单。
- source_word: οὐδεὶς ἀγοράζει οὐκέτι
  choice: 再也没有人购买
  rationale: “再也没有人”清楚表达οὐκέτι所强调的终止和不再发生；“购买”准确对应ἀγοράζει。
- source_word: αὐτῶν
  choice: 他们的
  rationale: 属格代词在此表示货物属于这些商人，译作“他们的”自然明确。
theological_decisions:
- issue: 巴比伦的指称与人格化形象
  choice: 以“她”指巴比伦
  alternative: 以“它”指城市或商业体系
  rationale: 原文使用阴性代词，并延续巴比伦被描绘成女人兼城邑的意象。“她”保留这一文学与神学张力，不把象征预先化约为抽象制度。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“也”承接上文其他为巴比伦哀哭的人；“哭泣哀悼”保留原文两个并列动词；“船货”凸显本章海运贸易场景。所有脚注标记均置于其对应词语之后。
