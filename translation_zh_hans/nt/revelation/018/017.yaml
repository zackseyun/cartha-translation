  text: ὅτι μιᾷ ὥρᾳ ἠρημώθη ὁ τοσοῦτος πλοῦτος. Καὶ πᾶς κυβερνήτης καὶ πᾶς ὁ ἐπὶ τόπον πλέων, καὶ ναῦται καὶ ὅσοι τὴν θάλασσαν ἐργάζονται, ἀπὸ μακρόθεν ἔστησαν
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/017.yaml
  text: for in one hour such great wealth has been laid waste. And every shipmaster, and everyone sailing to a place, and sailors, and as many as work the sea, stood far off
translation:
  language: zh_hans
  text: 因为这么巨大的财富，竟在一小时之内被毁灭了！所有船长、所有航往某地的人[a]、水手，以及一切靠海谋生的人，都远远地站着。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“所有航往目的地的人”或“所有航向港口的人”。希腊语这一表达带有习语色彩，可能泛指乘船前往某处的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 承接上文的哀叹，表达其原因或解释；现代汉语用“因为”衔接自然。
- source_word: μιᾷ ὥρᾳ
  choice: 在一小时之内
  rationale: 保留时间短促的强调，但不预先断定这一小时应按字面还是象征理解。
- source_word: ἠρημώθη
  choice: 荒废了
  rationale: 表达财富遭毁坏、归于荒凉的结果，保留ἐρημόω的荒芜色彩。
- source_word: ὁ τοσοῦτος πλοῦτος
  choice: 这么巨大的财富
  rationale: 体现τοσοῦτος对财富规模的强烈感叹。
- source_word: πᾶς κυβερνήτης
  choice: 所有船长
  rationale: 在航海语境中指掌舵或主管船只的人；“船长”是清楚自然的现代汉语称谓。
- source_word: πᾶς ὁ ἐπὶ τόπον πλέων
  choice: 所有航往各地的人
  rationale: 保留驶往目的地的含义，同时避免把这一群体过窄地限定为乘客、商人或某种特定职业。
- source_word: ναῦται
  choice: 水手
  rationale: 现代汉语中对应船上工作人员的常用词。
- source_word: ὅσοι τὴν θάλασσαν ἐργάζονται
  choice: 一切靠海谋生的人
  rationale: 该表达范围比“水手”更广，泛指以海上劳作或经营维生的人；此译法自然呈现其经济含义。
- source_word: ἀπὸ μακρόθεν ἔστησαν
  choice: 都远远地站着
  rationale: 保留他们与灾难现场保持距离的空间画面，并以简单过去叙事表达动作。
theological_decisions:
- issue: 哀叹中各类航海相关人群的范围
  choice: 分别译出船长、航往各地的人、水手和靠海谋生的人
  alternative: 合并概括为“所有航海的人”，或把“航往各地的人”限定为乘客或商人
  rationale: 希腊文以并列结构列出多个群体，分别译出能保留其修辞上的全面性，也不加入原文没有明说的身份限定。
- issue: “一小时”的性质
  choice: 直译为“在一小时之内”
  alternative: 解释为“转眼之间”或明确认定为字面上的六十分钟
  rationale: 译文保留原有时间意象和突发性，不替读者消解其可能的象征张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“竟”强化哀叹中的震惊语气；各航海群体保持并列，不合并处理。脚注说明ἐπὶ τόπον πλέων的语义不确定性。
