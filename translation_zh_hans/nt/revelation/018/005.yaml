  text: ὅτι ἐκολλήθησαν αὐτῆς αἱ ἁμαρτίαι ἄχρι τοῦ οὐρανοῦ, καὶ ἐμνημόνευσεν ὁ θεὸς τὰ ἀδικήματα αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/005.yaml
  text: for her sins have piled up as high as heaven, and God has remembered her wrongdoings.
translation:
  language: zh_hans
  text: 因为她的罪恶堆积到了天上[a]，上帝已经记念了她所行的不义[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“她的罪恶彼此粘连，直到天上。”原文动词本义是“粘合、连接”；这里描绘罪恶大量聚集、堆积的景象。
    reason: lexical_alternative
  - marker: b
    text: 这里的“记念”在上下文中带有审判意味：上帝并没有忽略她所行的不义。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 承接上一节，说明命令的理由，保留原文的因果关系。
- source_word: ἐκολλήθησαν
  choice: 堆积
  rationale: 该动词本义为“粘合、连接”，在这里以罪恶为主语，并与“直到天上”连用，形象地表达罪恶层层聚集；“堆积”是自然、清楚的现代汉语。
- source_word: αὐτῆς αἱ ἁμαρτίαι
  choice: 她的罪恶
  rationale: 准确表达所属关系；“罪恶”符合启示录庄重的审判语境。
- source_word: ἄχρι τοῦ οὐρανοῦ
  choice: 到了天上
  rationale: 保留原文表示界限的“直到天上”这一垂直意象，同时采用自然的现代汉语表达。
- source_word: ἐμνημόνευσεν
  choice: 记起了
  rationale: 保留“记念、想起”的基本意义，不在正文中直接扩写为“追究”或“审判”，从而保留其在上下文中的司法含义与原文张力。
- source_word: ὁ θεός
  choice: 上帝
  rationale: 采用现代汉语中清楚、庄重且通行的称谓。
- source_word: τὰ ἀδικήματα αὐτῆς
  choice: 她所行的不义
  rationale: ἀδικήματα指不义之事或恶行；此译法既自然，也与前面的“罪恶”有所区别，不把两个相关但不同的希腊词合并。
theological_decisions:
- issue: 同一节中ἁμαρτίαι与ἀδικήματα的区别
  choice: 分别译为“罪恶”和“所行的不义”
  alternative: 两者都译为“罪”或“罪孽”
  rationale: 原文使用两个相关但不同的词；分别翻译可保留修辞层次，又不强行建立过度精细的神学区分。
- issue: 上帝“记起”的司法含义
  choice: 正文保留“记起了”
  alternative: 译为“追究”“算账”或“施行审判”
  rationale: 上下文表明上帝的记念带有审判和行动的含义，但原文仍使用“记念”一词；正文不将隐含意义直接改写为审判行为，以保留神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“堆积到了天上”保留原文夸张而鲜明的垂直意象；“她所行的不义”与“罪恶”形成适度区别。所有脚注标记均已置于正文相应位置。
