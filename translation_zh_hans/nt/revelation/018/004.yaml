revisions:
- from: 我又听见另一个声音从天上说：“我的子民，你们要从她那里出来，免得与她一同有分于她的罪，也免得遭受她的灾殃。”
  to: 我又听见有另一个声音从天上说：“我的子民，你们要从她中间出来，免得有分于她的罪，也免得承受她的灾殃。”
  rationale: 修订仅改善汉语的自然度和对συγκοινωνέω的准确呈现：删除冗余的“与她一同”，以“有分于她的罪”表达参与；将“从她那里”调整为“从她中间”，并以“承受”对应审判语境中的“领受”。未增添巴比伦的具体历史或神学解释，也保留两个“免得”的并列结构及女性人格化意象。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:20:55Z'
review_pass:
  verdict: revise
  source_fidelity: 译文整体忠实反映原文的叙述、呼召和两个并列的避免性目的从句，也保留了以“她”指巴比伦的女性人格化意象。但“与她一同有分于她的罪”把“与她一同”附加在“有分于她的罪”之前，造成语义重复且句法不够顺畅；原文的重点是“参与她的罪”，无须另加这一层表述。
  naturalness: “从她那里出来”可以理解，但“从她中间出来”更合乎现代汉语及此处从巴比伦之中离开的语境。“有分于她的罪”庄重、自然，并准确表达参与/共同分担。“承受她的灾殃”比“遭受她的灾殃”更贴近λάβητε（领受、承受）在审判语境中的表达。
  terminology: “天上”“我的子民”“罪”“灾殃”均适合庄重而可理解的现代标准汉语。“灾殃”能涵盖πληγαί在《启示录》中所指的审判性灾祸，不限于疾病。保留“她”恰当维持巴比伦的拟人化形象。
  issues:
  - severity: medium
    issue: “与她一同有分于她的罪”语义重复且不够自然。
    rationale: συγκοινωνήσητε本身已表达共同参与或有分；译为“有分于她的罪”即可。额外的“与她一同”使“她”在短语中重复出现，也模糊了原文直接的参与对象。
  - severity: low
    issue: “从她那里出来”略显口语化且空间关系不够明确。
    rationale: ἐξ αὐτῆς要求离开被人格化的巴比伦；“从她中间出来”更自然地表达从其范围、群体或城中离开，同时保留女性代词。
  revised_text: 我又听见有另一个声音从天上说：“我的子民，你们要从她中间出来，免得有分于她的罪，也免得承受她的灾殃。”
  revised_footnotes: []
