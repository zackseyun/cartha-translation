  text: Καὶ ἤκουσα ἄλλην φωνὴν ἐκ τοῦ οὐρανοῦ λέγουσαν· ⸀Ἐξέλθατε, ⸂ὁ λαός μου, ἐξ αὐτῆς⸃, ἵνα μὴ συγκοινωνήσητε ταῖς ἁμαρτίαις αὐτῆς, καὶ ἐκ τῶν πληγῶν αὐτῆς ἵνα μὴ λάβητε·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/004.yaml
  text: And I heard another voice from heaven saying[a], “Come out of her, my people, so that you may not share in her sins[b], and so that you may not receive any of her plagues.”
translation:
  language: zh_hans
  text: 我又听见有另一个声音从天上说：“我的子民，你们要从她中间出来，免得有分于她的罪，也免得承受她的灾殃。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλην φωνὴν
  choice: 另一个声音
  rationale: 表示在先前声音之外又有一个不同的声音，译法自然，并保留叙事上的递进。
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: 从天上
  rationale: 本段指属天领域，而非单指可见的天空；“从天上”是现代汉语中自然且符合《启示录》语境的表达。
- source_word: Ἐξέλθατε ... ἐξ αὐτῆς
  choice: 你们要从她那里出来
  rationale: 复数命令式表达直接召唤；“从她那里出来”既准确表达离开，也保留巴比伦被人格化为女性的意象。
- source_word: ὁ λαός μου
  choice: 我的子民
  rationale: 体现呼格功能和归属关系；“子民”保留群体性及盟约语感，又符合庄重的现代汉语。
- source_word: ἵνα μὴ συγκοινωνήσητε ταῖς ἁμαρτίαις αὐτῆς
  choice: 免得与她一同有分于她的罪
  rationale: συγκοινωνέω含共同参与、分担之意；“一同有分于”保留参与及连带责任的含义，不把它弱化为仅仅受到影响。
- source_word: ἐκ τῶν πληγῶν αὐτῆς ἵνα μὴ λάβητε
  choice: 也免得遭受她的灾殃
  rationale: λαβητε在审判语境中可自然译为“遭受”；“灾殃”表达《启示录》中由审判带来的灾祸，并比现代汉语中偏疾病义的“瘟疫”覆盖面更广。
theological_decisions:
- issue: αὐτῆς所指对象的性别化意象
  choice: 用“她”指巴比伦
  alternative: 用“它”把巴比伦主要作为城市或制度来指称
  rationale: 上下文把巴比伦人格化为女人；保留“她”可维持全书的文学意象，同时不限定她只代表某一种历史实体。
- issue: 两个ἵνα μή从句的关系
  choice: 译为两个并列的“免得”警告
  alternative: 把第二句处理为第一句的解释或结果
  rationale: 原文重复ἵνα μή，形成并列结构：既不要参与她的罪，也不要承受她的灾殃。重复“免得”保留其修辞力度。
- issue: 罪与灾殃之间的关系
  choice: 保留参与罪与遭受灾殃的并列警告，不进一步解释其因果机制
  alternative: 明说因参与她的罪而受到同样惩罚
  rationale: 经文本身将两者紧密相连，却没有在本节中完整说明因果方式；译文不应额外加入神学推论。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“我的子民”前置，符合汉语呼语习惯；保留“她”的女性人格化表达。“一同有分于”略带经文语体，但能准确承载共同参与和连带责任的含义。
