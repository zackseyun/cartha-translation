id: REV.18.1
reference: Revelation 18:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα εἶδον ἄλλον ἄγγελον καταβαίνοντα ἐκ τοῦ οὐρανοῦ, ἔχοντα ἐξουσίαν μεγάλην, καὶ ἡ γῆ ἐφωτίσθη ἐκ τῆς δόξης αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/001.yaml
  text: After these things I saw another angel coming down out of heaven[a], having great authority[b], and the earth was illuminated by his glory.
translation:
  language: zh_hans
  text: 这些事以后，我看见另一位天使从天上降下[a]，拥有极大的权柄；大地被他的荣耀照亮了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从天而降”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“大地因他的荣耀而明亮起来”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: 这些事以后
  rationale: 保留 ταῦτα 的复数指向，并自然地承接《启示录》中接续展开的异象。
- source_word: εἶδον
  choice: 我看见
  rationale: 直接表达 ὁράω 的简单过去叙事意义，不增添原文没有的动作或语气。
- source_word: ἄλλον ἄγγελον
  choice: 另一位天使
  rationale: 准确表达在先前异象中的天使之外又出现一位天使；“位”符合现代汉语对有位格者的自然称说。
- source_word: καταβαίνοντα ἐκ τοῦ οὐρανοῦ
  choice: 从天上降下
  rationale: 表达分词所描写的、与“我看见”同时呈现的下降动作，也保留 ἐκ 所表示的来源。
- source_word: ἔχοντα ἐξουσίαν μεγάλην
  choice: 拥有极大的权柄
  rationale: “权柄”体现 ἐξουσία 所侧重的权威、权限或受托权力，避免仅译作一般能力。
- source_word: ἡ γῆ
  choice: 大地
  rationale: 此处的宏大照明景象指向广阔、宇宙性的地面世界，而非某一局部地区。
- source_word: ἐφωτίσθη
  choice: 被……照亮了
  rationale: 保留 φωτίζω 不定过去时被动语态的意义，并以自然现代汉语呈现异象中的结果。
- source_word: ἐκ τῆς δόξης αὐτοῦ
  choice: 被他的荣耀照亮
  rationale: 将 ἐκ 理解为光照的来源或原因；“被……照亮”在汉语中清楚表达荣耀是使大地明亮的源头。
theological_decisions:
- issue: 天使的荣耀与权柄的性质
  choice: 按原文直接说天使拥有极大的权柄，并且大地被他的荣耀照亮，不进一步界定其荣耀的性质。
  alternative: 可将这种荣耀明确解释为从上帝领受的荣耀，或因其强烈光辉而把天使作神性理解。
  rationale: 经文本身将权柄和荣耀归于这位天使，却没有在本节明说其来源，也没有称这位天使为神。因此译文既不削弱其荣耀，也不加入超出原文的神学说明。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“这些事以后”保留异象次序及复数指向；“权柄”维持 ἐξουσία 与一般“能力”的区别；句末使用被动结构，既贴近希腊文语态，也保持画面的宏阔感。
