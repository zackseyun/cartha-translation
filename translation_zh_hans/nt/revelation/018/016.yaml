source:
  edition: SBLGNT
  text: ⸀λέγοντες· Οὐαὶ οὐαί, ἡ πόλις ἡ μεγάλη, ἡ περιβεβλημένη βύσσινον καὶ πορφυροῦν καὶ κόκκινον καὶ ⸀κεχρυσωμένη χρυσίῳ καὶ λίθῳ τιμίῳ καὶ ⸀μαργαρίτῃ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/016.yaml
  text: saying[a], “Woe, woe, the great city, clothed in fine linen and purple and scarlet, and adorned with gold and precious stones and pearls,”
translation:
  language: zh_hans
  text: 说着：[a]“祸哉！祸哉！那座大城，身披细麻、紫色和朱红色的衣服，又以金子、宝石和珍珠为饰！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“哀哉！哀哉！”
    reason: 词义可兼有灾祸宣告和悲痛哀叹；正文保留前者，脚注呈现后者。
lexical_decisions:
- source_word: λέγοντες
  choice: 说
  rationale: 现在主动分词，承接上一节商人的哀哭；汉语用“说”自然引出其话语，不另行补出主语。
- source_word: Οὐαὶ οὐαί
  choice: 祸哉！祸哉！
  rationale: 兼具哀叹与审判宣告的意味，也保留重复所产生的强烈语气。
- source_word: ἡ πόλις ἡ μεγάλη
  choice: 这座大城
  rationale: 以自然的现代汉语表达希腊文带冠词的强调结构；“这座”指向上下文中的巴比伦大城。
- source_word: περιβεβλημένη
  choice: 身穿
  rationale: 完成时中被动分词描写大城所处的华服盛装状态；“身穿”简洁自然，并延续拟人化形象。
- source_word: βύσσινον
  choice: 细麻衣
  rationale: 指贵重的细麻织物；“细麻衣”既传达材质，也符合穿着语境。
- source_word: πορφυροῦν
  choice: 紫色衣
  rationale: 保留象征富贵的颜色，并补“衣”使汉语并列关系清楚。
- source_word: κόκκινον
  choice: 朱红色衣
  rationale: 准确传达鲜艳的猩红色调，并与奢华意象相称。
- source_word: κεχρυσωμένη
  choice: 装饰
  rationale: 其后以金子、宝石和珍珠并列，故采用涵盖多种饰物的“装饰”，而不局限于镀金。
- source_word: χρυσίῳ
  choice: 金子
  rationale: 直接表达作为装饰材料的黄金。
- source_word: λίθῳ τιμίῳ
  choice: 宝石
  rationale: 希腊文单数在此可作集合用法；汉语“宝石”不强制标明单复数，兼顾形式与自然表达。
- source_word: μαργαρίτῃ
  choice: 珍珠
  rationale: 希腊文单数可表类别或集合；汉语“珍珠”自然保留数目上的开放性。
theological_decisions:
- issue: 巴比伦倾覆时哀歌的语气
  choice: 将 οὐαί 译为“祸哉”以同时保留哀叹和审判色彩
  alternative: 译为“哀哉”，较突出悲叹
  rationale: 本节处于针对巴比伦的审判语境；“祸哉”既可作为哀号，也带有先知性灾祸宣告的力度，不把语义缩减为单纯悲伤。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“她”延续大城的拟人化表达；服饰和珠宝词汇保持鲜明、奢华的启示文学意象。
