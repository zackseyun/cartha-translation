  text: Καὶ ἦρεν εἷς ἄγγελος ἰσχυρὸς λίθον ὡς ⸀μύλινον μέγαν, καὶ ἔβαλεν εἰς τὴν θάλασσαν λέγων· Οὕτως ὁρμήματι βληθήσεται Βαβυλὼν ἡ μεγάλη πόλις, καὶ οὐ μὴ εὑρεθῇ ἔτι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/021.yaml
  text: And one mighty angel lifted up a stone like a great millstone and threw it into the sea[a], saying, “So will Babylon the great city be thrown down with violence, and it will never be found again.”
translation:
  language: zh_hans
  text: 有一位大能的天使举起一块石头，仿佛一块大磨石，把它扔进海里，说：“大城巴比伦必这样以猛烈之势被扔下[a]，再也找不到了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以猛烈之势”也可译作“猛然地”“以强力”或“猛烈地”。希腊词指骤然、强力的冲势。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦρεν
  choice: 举起
  rationale: 这里的简单过去时描写天使拿起并举起石头，预备施行象征性动作；“举起”自然地保留了有意而明确的动作。
- source_word: εἷς ἄγγελος ἰσχυρὸς
  choice: 一位大能的天使
  rationale: 保留 εἷς 所强调的单一人物；“大能的”符合启示文学的庄重语体，也表达 ἰσχυρός 的强大有力。
- source_word: λίθον ὡς μύλινον μέγαν
  choice: 一块石头，仿佛一块大磨石
  rationale: 用“仿佛”保留 ὡς 的比较性质，不把这块石头直接等同于磨石；“大磨石”传达其巨大沉重的意象。
- source_word: ἔβαλεν εἰς τὴν θάλασσαν
  choice: 把它扔进海里
  rationale: “扔进”是现代汉语中自然有力的表达，准确传达 βάλλω 的投掷动作和 εἰς 的方向。
- source_word: Οὕτως
  choice: 也必这样
  rationale: 把象征动作与随后的解释直接连接起来；“这样”保留指示意义，“也”使中文对应关系清楚。
- source_word: ὁρμήματι
  choice: 被猛力摔下
  rationale: ὅρμημα 表达猛烈、骤然的冲力；“猛力”保留方式或力量层面的含义，同时不把词义限缩为单纯的暴力。[a]列出可行译法。
- source_word: βληθήσεται
  choice: 必……被……摔下
  rationale: 未来被动式与前面天使把石头扔进海里的动作相呼应；“摔下”表达向下毁灭的语境含义，而“必”传达预告的确定性。
- source_word: Βαβυλὼν ἡ μεγάλη πόλις
  choice: 大城巴比伦
  rationale: 采用自然、庄重的现代汉语称谓，同时保留“巴比伦”与“大城”的同位关系。
- source_word: οὐ μὴ εὑρεθῇ ἔτι
  choice: 再也找不到了
  rationale: “再也不”结合结果式“找不到了”，自然地表达 οὐ μή 的强烈否定和 ἔτι 的“不再”含义。
theological_decisions:
- issue: 巴比伦毁灭意象的性质
  choice: 将审判译为猛烈而彻底的倾覆，不判定“巴比伦”是字面、象征，还是兼具二者。
  alternative: 将其明确解释为古代巴比伦城、敌对上帝的世界体系，或某一特定末世实体。
  rationale: 本节以象征性动作宣告灾难性的倾覆和最终消失；译文应保留意象及其终局性，不引入希腊文本未明确规定的末世论体系。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“大能的天使”“大城巴比伦”保留启示文学语感；“扔进”“再也找不到了”则避免过度古雅。脚注标记[a]已置于对应词组之后。
