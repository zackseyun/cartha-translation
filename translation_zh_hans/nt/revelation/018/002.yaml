id: REV.18.2
reference: Revelation 18:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἔκραξεν ⸀ἐν ἰσχυρᾷ φωνῇ λέγων· Ἔπεσεν, ⸀ἔπεσεν Βαβυλὼν ἡ μεγάλη, καὶ ἐγένετο κατοικητήριον ⸀δαιμονίων καὶ φυλακὴ παντὸς πνεύματος ἀκαθάρτου καὶ φυλακὴ παντὸς ὀρνέου ἀκαθάρτου ⸂καὶ φυλακὴ παντὸς θηρίου ἀκαθάρτου⸃ καὶ μεμισημένου,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/002.yaml
  text: And he cried out with a mighty voice[a], saying, “Fallen, fallen is Babylon the great! She has become a dwelling place of demons, a prison of every unclean spirit, a prison of every unclean bird[b], and a prison of every unclean and hated beast.”
translation:
  language: zh_hans
  text: 他以强有力的声音呼喊：“倒塌了！大巴比伦倒塌了！它成了鬼魔的住处，一切污秽之灵的囚禁之所[a]，一切污秽之鸟的囚禁之所，以及一切污秽而被憎恶之兽的囚禁之所[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “囚禁之所”也可译作“出没之处”。这里的希腊词也可指某类存在栖居或经常出现的地方。
    reason: lexical_alternative
  - marker: b
    text: 有些抄本没有“以及一切污秽而被憎恶之兽的囚禁之所”。
    reason: textual_variant
lexical_decisions:
- source_word: ἔκραξεν
  choice: 喊道
  rationale: 表达大声呼喊并引出直接引语，现代汉语自然，也保留宣告的力度。
- source_word: ἐν ἰσχυρᾷ φωνῇ
  choice: 用强有力的声音
  rationale: 按方式或工具理解介词短语；“强有力”比单纯的“大声”更明确地体现ἰσχυρᾷ。
- source_word: Ἔπεσεν, ἔπεσεν
  choice: 倒塌了！……倒塌了
  rationale: 重复动词，保留先知性审判宣告的节奏；汉语将“大巴比伦”置于第二次动词之前，使表达自然清楚。
- source_word: Βαβυλὼν ἡ μεγάλη
  choice: 大巴比伦
  rationale: 保留《启示录》中反复出现的称号式表达，避免增添原文没有的“城”字。
- source_word: ἐγένετο
  choice: 成了
  rationale: 简洁表达变化及其现存结果，符合现代汉语。
- source_word: κατοικητήριον
  choice: 住处
  rationale: 直接表达居住之地，清楚自然。
- source_word: δαιμονίων
  choice: 鬼魔
  rationale: 具体表达邪灵性的存在者，不以较宽泛的“邪灵”替代名词本身。
- source_word: φυλακὴ
  choice: 囚禁之所
  rationale: 保留“拘禁、看守之地”的核心意象，同时比把灵、鸟、兽都称为“监狱”更符合汉语搭配；其“出没之处”义另列脚注。
- source_word: παντὸς πνεύματος ἀκαθάρτου
  choice: 一切污秽之灵
  rationale: “一切”保留παντός的周遍含义，“污秽之灵”延续圣经中的礼仪与属灵语汇。
- source_word: παντὸς ὀρνέου ἀκαθάρτου
  choice: 一切污秽之鸟
  rationale: 不把ὄρνεον具体化为猛禽或食腐鸟，保留原文宽泛的“鸟”。
- source_word: παντὸς θηρίου ἀκαθάρτου καὶ μεμισημένου
  choice: 一切污秽、遭憎恶之兽
  rationale: θηρίον在此为兽类通称，不是特定的末世“兽”；“遭憎恶”保留完成时被动分词的被动及结果意味，也不擅自说明憎恶者。
theological_decisions:
- issue: θηρίου是否指《启示录》中特定的“兽”
  choice: 按普通名词译为“兽”
  alternative: 作为特定称号译为“那兽”
  rationale: 该词受παντός修饰，并与各样污秽之灵和污秽之鸟并列，因此语法和语境都支持兽类通称；译成特定称号会加入原文未要求的神学认定。
- issue: 审判图景中的φυλακή应如何理解
  choice: 正文译为“囚禁之所”
  alternative: 出没之处
  rationale: 该词可指监牢、看守或被拘留之处，也可能在此指某类存在栖居或出没的地方。正文保留拘禁意象，脚注说明另一种合乎词义和语境的理解，不消除原文张力。
- issue: 巴比伦的代词性别
  choice: 译为“它”
  alternative: 她
  rationale: 希腊文此处没有明示阴性代词；现代汉语通常用“它”回指城市或地点。这样既不否认上下文中的拟人意象，也不凭语法性别增添女性指称。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。审判宣告保留动词重复造成的强烈节奏；后半句重复“成了”和“囚禁之所”，再现原文排比。脚注标记均紧随其所说明的正文成分。
