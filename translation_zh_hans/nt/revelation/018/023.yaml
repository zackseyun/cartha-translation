id: REV.18.23
reference: Revelation 18:23
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ φῶς λύχνου οὐ μὴ φάνῃ ἐν σοὶ ἔτι, καὶ φωνὴ νυμφίου καὶ νύμφης οὐ μὴ ἀκουσθῇ ἐν σοὶ ἔτι· ὅτι οἱ ἔμποροί σου ἦσαν οἱ μεγιστᾶνες τῆς γῆς, ὅτι ἐν τῇ φαρμακείᾳ σου ἐπλανήθησαν πάντα τὰ ἔθνη,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/023.yaml
  text: And the light of a lamp will never shine in you again[a], and the voice of bridegroom and bride will never be heard in you again; for your merchants were the great ones of the earth[b], because by your sorcery all the nations were led astray.
translation:
  language: zh_hans
  text: 灯光在你那里绝不会再照耀；新郎和新娘的声音在你那里绝不会再听见。因为你的商人原是地上的权贵[a]，万国都因你的邪术[b]受了迷惑。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “权贵”也可译作“显要人物”。希腊词指地位显赫或有权势的人。
    reason: lexical_alternative
  - marker: b
    text: “邪术”也可译作“巫术”或“魔法”。希腊词φαρμακεία指施行巫术或魔法，也可带有借此迷惑人的含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: φῶς λύχνου
  choice: 灯光
  rationale: 按字面为“灯的光”；现代汉语用“灯光”自然简洁，也保留了灯所发之光的意象。
- source_word: οὐ μὴ φάνῃ ... ἔτι
  choice: 绝不会再照耀
  rationale: οὐ μή加虚拟式表达强烈否定，ἔτι在否定句中表示“再、继续”；“绝不会再”传达判决的确定性和终局性。
- source_word: ἐν σοὶ
  choice: 在你那里
  rationale: 保留对巴比伦这座城的第二人称称呼，同时比生硬的“在你里面”更符合现代汉语。
- source_word: φωνὴ νυμφίου καὶ νύμφης
  choice: 新郎和新娘的声音
  rationale: φωνή可指声音或嗓音；此译法保留“声音”这一宽泛含义，并呼应先知书中的审判用语。
- source_word: οὐ μὴ ἀκουσθῇ ... ἔτι
  choice: 绝不会再听见
  rationale: 用汉语无主句自然表达希腊文被动语态，并保留οὐ μή所强调的彻底否定。
- source_word: οἱ ἔμποροί σου
  choice: 你的商人
  rationale: ἔμπορος指从事贸易的人；“商人”符合本章的商业语境。
- source_word: οἱ μεγιστᾶνες τῆς γῆς
  choice: 地上的权贵
  rationale: μεγιστᾶνες指显赫而有权势的人；“权贵”兼顾地位和权势，又不限定为世袭贵族或商业巨头。
- source_word: ἐν τῇ φαρμακείᾳ σου
  choice: 因你的邪术
  rationale: φαρμακεία在此指巫术、魔法一类的实践及其迷惑作用；“邪术”在现代汉语中清楚而不误解为一般药物。
- source_word: ἐπλανήθησαν
  choice: 受了迷惑
  rationale: 保留希腊文被动形式，表达万国受到欺骗并被引入歧途，而不进一步限定迷惑的具体方式。
- source_word: πάντα τὰ ἔθνη
  choice: 万国
  rationale: 简洁表达世界各国各族的总体，与《启示录》的宏观审判语境相称。
theological_decisions:
- issue: 末世审判语境中的φαρμακεία
  choice: 邪术
  alternative: 巫术；魔法
  rationale: 该词可涉及符咒、药剂等魔法实践；“邪术”保留其宗教与欺骗色彩，又避免把它缩减为现代药物含义。
- issue: 两处οὐ μή的语气力度
  choice: 绝不会再……
  alternative: 不再……；断不会……
  rationale: 重复的强烈否定宣告巴比伦所受审判不可逆转；“绝不会再”在现代汉语中清楚呈现这种终局性。
- issue: ἐπλανήθησαν所表达的受动与责任
  choice: 受了迷惑
  alternative: 被引入歧途；被欺骗
  rationale: 此译保留语法上的被动及语义上欺骗、误导之间的张力，不额外断定万国毫无自身责任。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以“在你那里”维持对巴比伦的直接拟人称呼；两次“绝不会再”形成平行结构，突出审判的彻底性。
