id: REV.18.15
reference: Revelation 18:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οἱ ἔμποροι τούτων, οἱ πλουτήσαντες ἀπ’ αὐτῆς, ἀπὸ μακρόθεν στήσονται διὰ τὸν φόβον τοῦ βασανισμοῦ αὐτῆς κλαίοντες καὶ πενθοῦντες,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/015.yaml
  text: The merchants of these things[a], who became rich from her, will stand far off because of the fear of her torment, weeping and mourning,
translation:
  language: zh_hans
  text: 这些货物的商人[a]，就是那些靠她发了财的人，因惧怕她所受的折磨，必远远地站着，哭泣哀悼。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这些货物的商人”，直译“这些东西的商人”；“这些东西”回指上文所列的奢侈商品。
    reason: 说明 τούτων 的形式对应译法及其上下文所指。
lexical_decisions:
- source_word: ἔμποροι
  choice: 商人
  rationale: 指从事商业贸易的人；“商人”是现代汉语中自然、明确且符合本段经济审判语境的译法。
- source_word: τούτων
  choice: 这些货物
  rationale: 属格指示代词回指上文列举的奢侈商品。正文补出“货物”，使汉语指向清楚，同时以脚注保留较形式对应的译法。
- source_word: πλουτήσαντες
  choice: 发了财
  rationale: 不定过去时分词表示这些商人先前因她而致富；“发了财”自然表达财富增长，不引入被动含义。
- source_word: ἀπ’ αὐτῆς
  choice: 从她那里
  rationale: ἀπό表示来源，说明她是商人财富的来源；“从她那里”也保留原文以阴性代词指称巴比伦的拟人表达。
- source_word: ἀπὸ μακρόθεν
  choice: 远远地
  rationale: 表达他们因恐惧而刻意保持空间距离，与本章同类场景一致。
- source_word: στήσονται
  choice: 必……站着
  rationale: 将来时表示叙事中将发生的动作；“站着”简洁自然，不必另行凸显中间语态。
- source_word: διὰ τὸν φόβον
  choice: 因惧怕
  rationale: διά加宾格表达原因；“因惧怕”在现代汉语中凝练而庄重。
- source_word: βασανισμοῦ
  choice: 痛苦
  rationale: 该词在《启示录》的审判语境中指严厉的折磨性痛苦。“痛苦”保留严重性，又避免现代汉语“酷刑”所暗示的具体施刑方式。
- source_word: κλαίοντες
  choice: 哭泣
  rationale: 表达实际的哭号流泪，符合庄重语域。
- source_word: πενθοῦντες
  choice: 哀悼
  rationale: 强调因损失而悲哀、哀恸；与“哭泣”并列，保留两个分词的意义区别。
theological_decisions:
- issue: 启示文学审判语境中 βασανισμός 的性质
  choice: 译为“痛苦”，不把它弱化为单纯的经济困境或内心忧愁。
  alternative: 可译“折磨”或“刑罚”。
  rationale: 上下文描写巴比伦遭受审判，该词在《启示录》中通常表示严厉的惩罚性痛苦。此译法保留审判的严重性，却不把本节扩展为有关终极刑罚方式的具体教义陈述。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“就是那些……”自然承接同位修饰语；保留“她”对巴比伦的拟人称呼，并保留“哭泣／哀悼”的并列。
