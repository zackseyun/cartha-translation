id: REV.18.8
reference: Revelation 18:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἐν μιᾷ ἡμέρᾳ ἥξουσιν αἱ πληγαὶ αὐτῆς, θάνατος καὶ πένθος καὶ λιμός, καὶ ἐν πυρὶ κατακαυθήσεται· ὅτι ἰσχυρὸς κύριος ὁ θεὸς ὁ κρίνας αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/008.yaml
  text: 'For this reason, in one day her plagues will come: death and mourning and famine, and she will be burned up with fire; because strong is the Lord God who judged her.'
translation:
  language: zh_hans
  text: 因此，在一天之内，她的灾祸必临到她：死亡、哀恸和饥荒。她也必被火烧尽，因为审判她的主上帝大有能力。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: 因此
  rationale: 自然表达因果承接，准确对应“由于这个缘故”。
- source_word: ἐν μιᾷ ἡμέρᾳ
  choice: 在一天之内
  rationale: 保留灾祸集中而迅速临到的时间表述，不额外判定是字面一天还是象征性的短期。
- source_word: αἱ πληγαὶ αὐτῆς
  choice: 她的灾祸
  rationale: πληγή在此指惩罚性的灾难；“灾祸”比医学意义较强的“瘟疫”更能涵盖下列死亡、哀恸和饥荒。
- source_word: κατακαυθήσεται
  choice: 必被火烧尽
  rationale: 体现被动语态及κατα-所带的彻底焚烧意味。
- source_word: ἰσχυρός
  choice: 大有能力
  rationale: 在本句审判语境中自然传达“强有力、能够施行审判”，避免生硬的“强壮”。
- source_word: ὁ κρίνας αὐτήν
  choice: 审判她的
  rationale: 保留不定过去时分词的定语功能；中文无需强行标出相对于主句的具体时态层次。
theological_decisions:
- issue: 灾祸在“一天”临到的性质
  choice: 保留“在一天之内”
  alternative: 顷刻之间
  rationale: 原文明确使用“一天”，译文不将其预先解释为纯象征性的“顷刻”。
- issue: 上帝能力与审判之间的关系
  choice: 因为审判她的主上帝大有能力
  alternative: 因为主上帝是大能的，他已经审判了她
  rationale: 保留希腊文分词对“主上帝”的限定，并表达灾祸必然实现的依据是审判者有能力执行审判；不额外引入时态化的教义解释。
translation_notes:
  register: 采用现代、庄重而通顺的简体中文。“她”延续上下文对巴比伦城的拟人化指称；列举处用冒号，随后分句，以提升普通读者的可读性。
