source:
  edition: SBLGNT
  text: καὶ φωνὴ κιθαρῳδῶν καὶ μουσικῶν καὶ αὐλητῶν καὶ σαλπιστῶν οὐ μὴ ἀκουσθῇ ἐν σοὶ ἔτι, καὶ πᾶς τεχνίτης πάσης τέχνης οὐ μὴ εὑρεθῇ ἐν σοὶ ἔτι, καὶ φωνὴ μύλου οὐ μὴ ἀκουσθῇ ἐν σοὶ ἔτι,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/022.yaml
  text: And the sound of harpists and musicians and flute players and trumpeters will never be heard in you again[a], and no craftsman of any craft will ever be found in you again, and the sound of a mill will never be heard in you again[b],
translation:
  language: zh_hans
  text: 弹琴的、乐师、吹笛的和吹号的声音，在你中间必不再听见[a]；任何手艺的工匠，在你中间必不再找着；磨的声音，在你中间必不再听见[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “吹笛的”所吹的是古代的αὐλός，一种管乐器，并不完全等同于现代笛子；也可译作“吹管乐器的”。
    reason: lexical_alternative
  - marker: b
    text: “磨的声音”也可译作“磨石的声音”。原词可指碾磨用的器具，尤其可指磨石；这里指碾磨活动所发出的声响。
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνὴ
  choice: 声音
  rationale: 这里指可听见的声响，而非言语；译作“声音”既适用于乐者，也适用于推磨，并保留原文反复出现的寂静意象。
- source_word: κιθαρῳδῶν
  choice: 弹琴者
  rationale: 指与 κιθάρα 一类弦乐器相关的演奏者；“弹琴者”是现代中文自然且易懂的概括，不以生僻音译限定古代乐器的具体形制。
- source_word: μουσικῶν
  choice: 乐师
  rationale: 该词泛指从事音乐的人；“乐师”在列举各类表演者的语境中简洁而庄重。
- source_word: αὐλητῶν
  choice: 吹笛者
  rationale: 指吹奏 αὐλός 的人；“吹笛者”便于现代读者理解，同时以脚注说明这种古代管乐器并不等同于现代横笛。
- source_word: σαλπιστῶν
  choice: 吹号者
  rationale: 指吹奏 σάλπιγξ 的人；“吹号者”比音译更清楚，也适合与前面的乐者并列。
- source_word: οὐ μὴ ἀκουσθῇ
  choice: 再也听不见了
  rationale: οὐ μή 加不定过去时虚拟语气表达强烈否定；结合 ἔτι，译文自然传达彻底而终局性的止息。
- source_word: ἐν σοὶ
  choice: 在你里面
  rationale: 巴比伦被拟人化为受直接宣告的城；此译保留第二人称和空间意象。
- source_word: πᾶς τεχνίτης πάσης τέχνης
  choice: 各行各业的工匠
  rationale: 原文以重复结构强调各种技艺及其工匠的全面消失；该译在现代中文中自然，并保留范围的周全性。
- source_word: εὑρεθῇ
  choice: 找不到了
  rationale: 配合 οὐ μή 和 ἔτι，表示这些工匠将完全不复存在；“再也找不到了”以自然中文表现其绝对性。
- source_word: μύλου
  choice: 推磨
  rationale: μύλος 可指磨、磨石或磨具；在“声音”的搭配中，“推磨的声音”自然呈现日常碾磨活动，又不武断限定为单独一块磨石。
theological_decisions:
- issue: 巴比伦受审判后的荒凉意象
  choice: 按三重宣告呈现音乐、手艺劳动和日常碾磨活动的彻底止息。
  alternative: 把这些项目仅当作装饰性的生活细节，弱化其共同表现的终局荒凉。
  rationale: 原文三次使用 οὐ μή……ἔτι 的强烈否定格式，凸显审判后不可逆转的寂静与荒废；译文保留具体意象，不进一步把各项寓意化。
translation_notes:
  register: 采用现代、庄重且易懂的书面中文。以分号保留原文三个并列判断，并重复“在你里面再也……”的结构，以呈现宣告的节奏和终局性。
