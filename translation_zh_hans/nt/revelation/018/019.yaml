  rationale: 修订恢复ἐν ᾗ与ἐκ τῆς τιμιότητος αὐτῆς所表达的地点／关联和来源两个层面，以“财富”作为商业语境中的主译，并以脚注保留词义范围。又将“荒废了”改为“被毁成荒场了”，更准确传达毁灭而荒凉的被动结果，且不添加施事者。其余保留原有庄重、现代的汉语语域及“祸哉”的先知性哀歌色彩。
