id: REV.18.19
reference: Revelation 18:19
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἔβαλον χοῦν ἐπὶ τὰς κεφαλὰς αὐτῶν καὶ ⸀ἔκραξαν κλαίοντες καὶ ⸀πενθοῦντες λέγοντες· Οὐαὶ οὐαί, ἡ πόλις ἡ μεγάλη, ἐν ᾗ ἐπλούτησαν πάντες οἱ ἔχοντες τὰ πλοῖα ἐν τῇ θαλάσσῃ ἐκ τῆς τιμιότητος αὐτῆς, ὅτι μιᾷ ὥρᾳ ἠρημώθη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/019.yaml
  text: And they threw dust on their heads and cried out[a], weeping and mourning, saying, “Woe, woe, the great city, in which all who had ships on the sea became rich from her wealth[b], because in one hour she has been laid waste.”
translation:
  language: zh_hans
  text: 他们把尘土撒在头上，大声喊叫，哭泣哀悼着说：“祸哉！祸哉！这座大城！凡在海上有船的，都在这城中因她的财富[a]而致富；她竟在一小时之内被毁成荒场了！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “财富”也可译作“奢华”或“华美”。原词可指昂贵、贵重、富裕或宏伟华美。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔβαλον χοῦν ἐπὶ τὰς κεφαλὰς αὐτῶν
  choice: 把尘土撒在头上
  rationale: 保留希腊文所描绘的哀悼动作；“撒在头上”符合现代汉语表达，也不把动作弱化为仅仅“放”。
- source_word: ἔκραξαν κλαίοντες καὶ πενθοῦντες
  choice: 痛哭哀悼，大声喊着
  rationale: 分别表达 κλαίοντες 的哭泣、πενθοῦντες 的哀悼和 ἔκραξαν 的高声呼喊，避免将三个相近但有区别的动作合并。
- source_word: Οὐαὶ οὐαί
  choice: 祸哉！祸哉！
  rationale: 既可表达哀叹，也保留启示文学和先知性审判宣告的庄重语气；重复形式照原文保留。
- source_word: ἡ πόλις ἡ μεγάλη
  choice: 这座大城
  rationale: 自然呈现带冠词的同位结构，并借“这座”承接当前哀歌所指的城。
- source_word: ἐν ᾗ
  choice: 因她
  rationale: 在本句商业语境中采用自然的因由表达，说明有船的人从该城的奢华获利，同时不增添具体商业机制。
- source_word: οἱ ἔχοντες τὰ πλοῖα ἐν τῇ θαλάσσῃ
  choice: 所有在海上有船的人
  rationale: 贴近原文“有船”的宽泛说法，不擅自限定为船主；“在海上”保留原有场景。
- source_word: ἐκ τῆς τιμιότητος αὐτῆς
  choice: 因她的奢华
  rationale: τιμιότης 可指贵重、昂贵或华美；上下文聚焦巴比伦昂贵奢侈的贸易，“奢华”较能兼顾昂贵与富丽，并以脚注保留其他可能。
- source_word: μιᾷ ὥρᾳ
  choice: 在一小时之内
  rationale: 保留原文时间意象和灾变突然而迅速的强调，不将其解释成泛指的“顷刻”。
- source_word: ἠρημώθη
  choice: 荒废了
  rationale: 简洁表达不定过去时被动式造成荒凉的结果；汉语以状态式表达较自然，施事者仍未明说。
theological_decisions:
- issue: 审判语境中 Οὐαὶ οὐαί 同时具有哀叹与灾祸宣告色彩
  choice: 祸哉！祸哉！
  alternative: 哀哉！哀哉！
  rationale: “祸哉”较完整地保留先知性审判的回响；“哀哉”更突出悲叹，却可能淡化灾祸宣告。正文保留前者，不进一步解释审判主体。
- issue: ἠρημώθη 的神学施事者未明说
  choice: 荒废了
  alternative: 被毁成荒场了
  rationale: 原文使用被动语态而未在本节明确指出施事者；译文不补入“被神毁灭”等解释，以保留原文的含蓄。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“祸哉”保留启示文学的先知性语域，其余措辞避免过度文言化。正文中的脚注标记 [a] 已与脚注对应。
