review_pass:
  verdict: revise
  source_fidelity: 草稿准确保留了撒尘于头、重复的哀号、海上有船者致富及突如其来的毁灭等主要内容。但“因她的奢华而富足”将ἐν ᾗ（在其中／在这城中）与ἐκ τῆς τιμιότητος αὐτῆς（由于她的财富、富丽或昂贵）两个关系压缩为单一因由；“荒废了”也较易指长期失修闲置，未充分表达ἠρημώθη的毁灭而成荒凉之意。
  naturalness: “痛哭哀悼，大声喊着说”虽可理解，调整为“大声喊叫，哭泣哀悼着说”更贴近原文的动作关系，也更顺畅。“被毁成荒场”在现代庄重汉语中比“荒废”更明确而自然。
  terminology: “祸哉！祸哉！”恰当保留οὐαὶ οὐαί的哀叹与审判性语调。“财富”在此商业哀歌中是τιμιότης的稳妥主译；脚注保留“奢华”和“华美”等语义可能。
  issues:
  - severity: medium
    issue: “因她的奢华而富足”合并了ἐν ᾗ与ἐκ τῆς τιμιότητος αὐτῆς。
    rationale: 原文先说船只相关者“在这城中”致富，再说其来源是“她的财富／富丽”。译文宜尽可能保留这两个互相关联但不相同的表达。
  - severity: medium
    issue: “荒废了”不足以表达ἠρημώθη。
    rationale: 该被动动词指被毁灭、成为荒凉，不只是逐渐废弃或无人使用；应采用明确的毁坏／荒凉表述，同时不指明施事者。
  - severity: low
    issue: 哀哭、哀悼与喊叫的语序和连接关系可更贴近原文。
    rationale: ἔκραξαν κλαίοντες καὶ πενθοῦντες λέγοντες可自然译为“大声喊叫，哭泣哀悼着说”，既保留三个动作，也避免汉语中先“痛哭哀悼”后“喊着说”的轻微断裂。
