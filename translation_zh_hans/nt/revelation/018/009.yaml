  text: Καὶ κλαύσουσιν καὶ κόψονται ἐπ’ αὐτὴν οἱ βασιλεῖς τῆς γῆς οἱ μετ’ αὐτῆς πορνεύσαντες καὶ στρηνιάσαντες, ὅταν βλέπωσιν τὸν καπνὸν τῆς πυρώσεως αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/009.yaml
  text: And the kings of the earth who committed sexual immorality and lived in luxury with her will weep and mourn over her when they see the smoke of her burning[b][a],
translation:
  language: zh_hans
  text: 地上的君王，就是那些曾与她淫乱[b]、与她一同奢华度日的人，看见她焚烧所冒的烟，就要为她哭泣哀号[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“捶胸悲哭”或“哀悼”；希腊语动词使人联想到以明显举动表达哀痛。
    reason: lexical_alternative
  - marker: b
    text: “与她淫乱”很可能承接《启示录》中反复出现的比喻，指腐败、拜偶像的结盟；同时仍保留希腊原文的性意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: κλαύσουσιν
  choice: 哭泣
  rationale: 该词表示出声哭泣或悲叹；“哭泣”自然清楚，并保留强烈的悲痛情绪。
- source_word: κόψονται
  choice: 哀号
  rationale: κόπτω 的中间语态在此用于丧礼悲悼的惯用表达，指以明显的举动哀悼；“哀号”传达其悲恸之意，具体动作另见脚注。
- source_word: ἐπ’ αὐτὴν
  choice: 为她
  rationale: ἐπί 加宾格与悲悼动词连用时可标明哀悼的对象；现代汉语以“为她”表达最自然。
- source_word: οἱ βασιλεῖς τῆς γῆς
  choice: 地上的君王
  rationale: 这是《启示录》中指世上统治者的常见末世性表达；“地上”符合本书语境。
- source_word: μετ’ αὐτῆς
  choice: 与她……、同享……
  rationale: μετά 加属格表示联合关系；中文通过“与她淫乱、同享奢华”自然地使这一关系涵盖两个并列分词。
- source_word: πορνεύσαντες
  choice: 淫乱
  rationale: 保留原文明确的性意象，同时不排除《启示录》中这一意象所承载的偶像崇拜及腐败结盟等比喻含义。
- source_word: στρηνιάσαντες
  choice: 同享奢华
  rationale: 该词指骄奢放纵、沉溺享乐；“同享奢华”既表现奢靡生活，也保留君王与巴比伦共同参与的关系。
- source_word: ὅταν βλέπωσιν
  choice: 看见……就
  rationale: ὅταν 加现在时虚拟语气在此表示将来的条件性时刻；“看见……就”符合现代汉语叙述习惯。
- source_word: καπνὸν
  choice: 烟
  rationale: 直接对应原词，并在中文中与“冒”搭配，使画面自然清晰。
- source_word: τῆς πυρώσεως αὐτῆς
  choice: 她焚烧所冒的
  rationale: πύρωσις 指焚烧或燃烧过程；此译保留毁于火焚的意象，不擅自引入邻近经文中更具体的表述。
theological_decisions:
- issue: 巴比伦“淫乱”意象的性质
  choice: 正文保留“淫乱”的性意象，同时容许其在上下文中具有比喻意义。
  alternative: 译作较抽象的“行不义”或“与她不忠”。
  rationale: 《启示录》反复以淫乱描绘偶像崇拜和腐败结盟。保留原有性意象，能维持先知性比喻及其神学张力，而不把它缩减为单一的政治解释。
- issue: κόψονται 的表达
  choice: 译为表示悲悼的“哀号”。
  alternative: 译为“捶胸”或按字面译成带有击打身体意味的表达。
  rationale: 这里的惯用法主要表示公开而强烈的哀悼。正文采用意义清楚的译法，脚注则保留原词所唤起的外在哀悼动作。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。以“就是那些……”清楚连接“地上的君王”与两个修饰成分；“哭泣哀号”保留原文两个并列悲悼动词的递进力度。脚注标记紧随各自所解释的词语。
