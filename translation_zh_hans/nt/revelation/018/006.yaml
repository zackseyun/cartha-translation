  text: ἀπόδοτε αὐτῇ ὡς καὶ αὐτὴ ἀπέδωκεν, καὶ ⸀διπλώσατε ⸀τὰ διπλᾶ κατὰ τὰ ἔργα αὐτῆς· ἐν τῷ ποτηρίῳ ᾧ ἐκέρασεν κεράσατε αὐτῇ διπλοῦν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/006.yaml
  text: Pay her back as she herself has paid back[a], and repay her double according to her works; in the cup that she mixed[b], mix a double portion for her.
translation:
  language: zh_hans
  text: 她怎样报还，你们也要怎样报还她；要按她所做的，加倍报还她[a]。在她所调制的那杯中，要为她调制双倍的分量[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文措辞强烈而简练，亦可较直译为“把双倍的（报偿）加倍”；可能强调加重的报还。
    reason: lexical_alternative
  - marker: b
    text: 即她所调制、预备的那杯饮料；这一画面可能指向预备好的审判之杯。
    reason: cultural_note
lexical_decisions:
- source_word: ἀπόδοτε αὐτῇ ὡς καὶ αὐτὴ ἀπέδωκεν
  choice: 她怎样报应别人，你们也要怎样报应她
  rationale: ἀποδίδωμι在此表示按行为施行报偿或报应；结合审判语境译作“报应”。αὐτή的强调通过重复“她”体现。原文未明说“别人”，但汉语需补出其先前行为所针对的对象，避免句意残缺。
- source_word: διπλώσατε τὰ διπλᾶ
  choice: 加倍报应她
  rationale: 原文是强烈而压缩的同根式表达，直译近似“把双倍之事加倍”。正文采用自然汉语传达加重报应的力量，同时以脚注保留其措辞上的歧义。
- source_word: κατὰ τὰ ἔργα αὐτῆς
  choice: 按她所行的
  rationale: 既保留κατά所表达的衡量标准，也以现代汉语常用的“所行的”表达ἔργα，不把它缩减为笼统的罪恶。
- source_word: ἐν τῷ ποτηρίῳ ᾧ ἐκέρασεν
  choice: 她在杯中怎样调制
  rationale: κεράννυμι表示调和、调制饮料；译文保留“杯”和“调制”的意象，并避免将其直接解释成倒酒。
- source_word: κεράσατε αὐτῇ διπλοῦν
  choice: 也要为她调上双倍的分量
  rationale: 重复“调”以对应原文同一动词的重复；“双倍的分量”使διπλοῦν在汉语中自然明确，同时保留杯中审判的象征画面。
theological_decisions:
- issue: “双倍”报应的性质
  choice: 保留加倍报应与杯中双倍分量的审判意象，不说明为严格数学刑罚
  alternative: 将“双倍”解释为精确的法律赔偿倍数，或弱化为一般性的公正报应
  rationale: 启示文学的措辞可兼具衡量和强化作用。译文不削弱其严厉性，也不替文本判定“双倍”是否必须按精确数量理解。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“报应”保持司法性和审判语气；分号与重复句式保留原文命令的节奏和修辞力度。所有脚注标记均已置于正文相应位置。
