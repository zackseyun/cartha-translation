id: REV.18.7
reference: Revelation 18:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὅσα ἐδόξασεν αὑτὴν καὶ ἐστρηνίασεν, τοσοῦτον δότε αὐτῇ βασανισμὸν καὶ πένθος. ὅτι ἐν τῇ καρδίᾳ αὐτῆς λέγει ὅτι Κάθημαι βασίλισσα, καὶ χήρα οὐκ εἰμί, καὶ πένθος οὐ μὴ ἴδω.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/007.yaml
  text: As much as she glorified herself and lived in luxury[a], give her that much torment and mourning. For she says in her heart, ‘I sit as a queen, and I am not a widow[b], and I will certainly never see mourning.’
translation:
  language: zh_hans
  text: '她使自己何等荣耀，又何等奢华享乐[a]，就给她多少折磨和哀伤。因为她心里说：


    “我安坐为女王，


    我不是寡妇，


    绝不会见到哀伤。”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“纵情享乐”或“奢靡放纵”。希腊文动词可指奢华、放纵、自我满足的生活。
    reason: lexical_alternative
  - marker: b
    text: “绝不会”对应希腊文的强调否定，表达她确信哀伤永远不会临到。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσα ... τοσοῦτον
  choice: 到什么程度……同等程度
  rationale: 保留希腊文关联结构所表达的等量报应：她自我抬高、纵情享乐的程度，与所受痛苦和哀伤的程度相称。
- source_word: ἐδόξασεν αὑτὴν
  choice: 她自我荣耀
  rationale: 保留反身结构和“荣耀”的词义，突出巴比伦把荣耀归给自己、自我抬高；“自我荣耀”也比“使自己显得荣耀”更简洁有力。
- source_word: ἐστρηνίασεν
  choice: 奢华享乐
  rationale: 该动词指奢侈、放纵的生活。“奢华享乐”符合本章财富与王权的语境，同时不把词义不必要地局限为性方面的放纵。
- source_word: δότε αὐτῇ
  choice: 给她
  rationale: 直接保留命令语气，也能自然地与“痛苦和哀伤”搭配。
- source_word: βασανισμὸν
  choice: 痛苦
  rationale: 表达审判所带来的严重折磨与苦楚，但不把含义收窄为某一种具体的肉体酷刑。
- source_word: πένθος
  choice: 哀伤
  rationale: 该词表示因丧失或灾祸而有的悲哀、哀悼；两处采用同一译词，以保留原文的重复。
- source_word: ἐν τῇ καρδίᾳ αὐτῆς λέγει
  choice: 她心里说
  rationale: 这是自然的现代汉语表达，也保留了原文关于内心自信和自我夸口的意象。
- source_word: Κάθημαι βασίλισσα
  choice: 我端坐为女王
  rationale: “端坐”保留安坐、稳居其位的姿态，“为女王”保留表语关系，整体传达她自以为拥有稳固王权的夸口。
- source_word: χήρα οὐκ εἰμί
  choice: 并不是寡妇
  rationale: 直接保留寡妇意象；该意象表达她自认为不会失去倚靠、陷入孤苦。
- source_word: οὐ μὴ ἴδω
  choice: 绝不会经历
  rationale: “绝不会”体现 οὐ μή 与虚拟式构成的强烈否定；“经历哀伤”用自然汉语传达闪族式“看见哀伤”的含义。
theological_decisions:
- issue: 巴比伦被拟人化为女人、女王和寡妇
  choice: 全文保留阴性人物形象，并译作“她”“女王”“寡妇”
  alternative: 把巴比伦处理成非人格化的城市或经济体系
  rationale: 希腊文始终以阴性单数指称巴比伦，女王与寡妇的对照也是本节傲慢和受审判意象的核心，不应将其淡化。
- issue: βασανισμός 所表达的审判性质
  choice: 译为“痛苦”
  alternative: 译为“折磨”或“酷刑”
  rationale: 本节表达与巴比伦自我荣耀和奢华生活相称的司法性报应。“痛苦”保留审判的严重性，又不擅自指定施行审判的具体方式。
- issue: οὐ μὴ ἴδω 的强烈否定
  choice: 译为“绝不会经历哀伤”
  alternative: 译为较弱的“不会经历哀伤”
  rationale: 原文的强调否定表现巴比伦自信哀伤永远不会临到；译文保留这种傲慢而强烈的确信，不提前削弱其张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。首句略带审判宣告的正式语气，并保留原文“到什么程度……同等程度”的比例结构。引语分行呈现女王的三重夸口；“端坐”传达稳居王位的姿态，但不明说原文未出现的“宝座”。
