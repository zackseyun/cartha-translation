  text: ἀπὸ μακρόθεν ἑστηκότες διὰ τὸν φόβον τοῦ βασανισμοῦ αὐτῆς λέγοντες· Οὐαὶ οὐαί, ἡ πόλις ἡ μεγάλη, Βαβυλὼν ἡ πόλις ἡ ἰσχυρά, ὅτι μιᾷ ὥρᾳ ἦλθεν ἡ κρίσις σου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/010.yaml
  text: standing far off because of the fear of her torment[a], saying, ‘Woe, woe, the great city, Babylon[b], the strong city! For in one hour your judgment has come.’
translation:
  language: zh_hans
  text: 他们因害怕她所受的折磨，远远地站着，说：“有祸了！有祸了！[a]大城巴比伦，坚固的城啊！[b]因为在一小时之内，你的审判已经临到。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“哀哉！哀哉！”。希腊语感叹词既能表达哀恸，也能宣告灾祸；正文译作“有祸了”，以保留先知性和启示文学的力度。
    reason: lexical_alternative
  - marker: b
    text: 或译“强大的城啊！”。希腊语形容词可表示坚强、强大或有力量。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ μακρόθεν ἑστηκότες
  choice: 就远远地站着
  rationale: ἀπὸ μακρόθεν表示空间上的远距离，ἑστηκότες描述持续站立的状态；合译既保留画面，也符合现代汉语表达。
- source_word: διὰ τὸν φόβον τοῦ βασανισμοῦ αὐτῆς
  choice: 因害怕她所受的折磨
  rationale: διά加宾格表示原因；βασανισμός指严重的折磨或痛苦。此译保留“她的折磨”这一属格关系，同时用自然汉语表明他们因看见她受折磨而惧怕。
- source_word: Οὐαὶ οὐαί
  choice: 有祸了！有祸了！
  rationale: οὐαί兼有哀叹与宣告灾祸的意味；“有祸了”保留先知性和启示文学的力度，重复形式也照原文保留。
- source_word: ἡ πόλις ἡ μεγάλη, Βαβυλὼν
  choice: 大城巴比伦
  rationale: 按现代汉语自然语序表达同位关系，并按通行译名音译专名Βαβυλών。
- source_word: ἡ πόλις ἡ ἰσχυρά
  choice: 坚固的城
  rationale: ἰσχυρός可表示强壮、强大或有力量；修饰城时，“坚固”自然地传达其强盛难摧的形象，同时不排除“强大的城”这一理解。
- source_word: μιᾷ ὥρᾳ
  choice: 在一小时之内
  rationale: 时间与格在此表示事情发生于一个小时的范围内，突出审判来临之迅速。
- source_word: ἦλθεν ἡ κρίσις σου
  choice: 你的审判就来到了
  rationale: ἦλθεν表示审判已经到来；“你的审判”保留σου的第二人称属格表达，而“就”配合一小时的语境传达突然而迅速的临到。
theological_decisions:
- issue: 启示文学哀叹词οὐαί的表达
  choice: 有祸了！有祸了！
  alternative: 哀哉！哀哉！
  rationale: 原词既可表达哀恸，也可宣告厄运。“有祸了”在现代汉语中较易懂，并保留审判宣告的力度；脚注说明其哀叹色彩，避免抹平原文张力。
- issue: ἡ κρίσις σου中属格σου的理解
  choice: 你的审判
  alternative: 对你的审判
  rationale: 语境明显指临到巴比伦的审判，但正文保留原文简洁的属格结构，不进一步限定其语法关系。
- issue: ἦλθεν的时体表达
  choice: 就来到了
  alternative: 已经临到
  rationale: 不定过去时在直接引语中陈述审判已然发生；“来到了”保留来临意象，“就”则体现其在一小时内突然发生，属于语境化表达而非教义解释。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。保留原文重复感叹、对城的直接呼告及“审判来到”的启示文学意象；句首承接上文的分词结构，译为“他们……站着，说”。
