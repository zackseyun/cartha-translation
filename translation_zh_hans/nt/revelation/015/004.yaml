  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: τίς οὐ μὴ ⸀φοβηθῇ, κύριε, καὶ ⸀δοξάσει τὸ ὄνομά σου, ὅτι μόνος ⸀ὅσιος; ὅτι πάντα τὰ ἔθνη ἥξουσιν καὶ προσκυνήσουσιν ἐνώπιόν σου, ὅτι τὰ δικαιώματά σου ἐφανερώθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/004.yaml
  text: Who will not fear[a], Lord, and glorify your name? For you alone are holy. For all the nations will come and worship before you, because your righteous acts have been revealed.
translation:
  language: zh_hans
  text: 主啊，谁会不敬畏你，不荣耀你的名呢？因为惟有你是圣洁的。万国都要来，在你面前敬拜，因为你公义的作为[a]已经显明了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“公义的判决”或“公义的典章”。希腊词也可指司法裁决或法令；这里很可能侧重上帝如今已经显明的公正作为。
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς οὐ μὴ φοβηθῇ
  choice: 谁会不敬畏你
  rationale: 疑问词与 οὐ μή 构成强烈的反问，预期答案是“没有人”；“谁会不……”既保留反问语气，也自然表达面向将来的意味。
- source_word: κύριε
  choice: 主啊
  rationale: κύριος 的呼格；“主啊”是现代汉语中自然、庄重的直接称呼。
- source_word: δοξάσει τὸ ὄνομά σου
  choice: 荣耀你的名
  rationale: 保留“使你的名得荣耀”这一圣经表达，指尊崇上帝所显明的身份、品格与声誉。
- source_word: μόνος ὅσιος
  choice: 惟有你是圣洁的
  rationale: ὅσιος 可指圣洁、虔敬或忠贞；在对上帝的颂赞中，“圣洁”最贴合语境。“惟有”明确表达 μόνος 的排他性。
- source_word: πάντα τὰ ἔθνη
  choice: 万国
  rationale: 简洁保留所有民族、邦国的整体含义，也符合汉语圣经颂赞和末世敬拜语境。
- source_word: ἥξουσιν
  choice: 都要来
  rationale: 表达将来的来到；“都”与“万国”呼应，体现 πάντα 的全称范围。
- source_word: προσκυνήσουσιν ἐνώπιόν σου
  choice: 在你面前敬拜
  rationale: προσκυνέω 在此天上礼仪语境中指宗教性的敬拜；同时直接保留 ἐνώπιόν σου 的空间与临在意味。
- source_word: τὰ δικαιώματά σου
  choice: 你公义的作为
  rationale: δικαίωμα 可指法令、判决或公义之举；本节强调上帝公义已经公开显明，“公义的作为”保留较宽语义，不将其限定为法规或司法裁决。
- source_word: ἐφανερώθησαν
  choice: 已经显明了
  rationale: 表达不定过去时被动式所指的显现，并在汉语中自然呈现其已经发生且结果可见的意义。
theological_decisions:
- issue: 颂赞中 ὅσιος 的译法
  choice: 圣洁
  alternative: 忠信；虔敬
  rationale: 这里宣告上帝独有的属性，并置于敬畏、荣耀和敬拜的语境中；“圣洁”最能保留其道德与宗教层面的分量，又不把含义缩减为单一的守约忠信。
- issue: 末世审判语境中 δικαιώματα 的理解
  choice: 公义的作为
  alternative: 公义的判决；典章
  rationale: 上下文歌颂上帝向万国显明的公义。“公义的作为”涵盖其公正行动，也保留原词可能涉及判决或法令的张力；其他可能性列入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“谁会不……呢”保留原文强烈反问；“万国”“荣耀你的名”“在你面前敬拜”延续经文颂赞语体，同时避免生硬古奥。脚注标记置于其实际说明的“公义的作为”之后。
