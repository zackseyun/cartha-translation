id: REV.15.3
reference: Revelation 15:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ᾄδουσιν τὴν ᾠδὴν Μωϋσέως τοῦ δούλου τοῦ θεοῦ καὶ τὴν ᾠδὴν τοῦ ἀρνίου λέγοντες· Μεγάλα καὶ θαυμαστὰ τὰ ἔργα σου, κύριε, ὁ θεός, ὁ παντοκράτωρ· δίκαιαι καὶ ἀληθιναὶ αἱ ὁδοί σου, ὁ βασιλεὺς τῶν ⸀αἰώνων·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/003.yaml
  text: 'And they sing the song of Moses[a], the slave of God, and the song of the Lamb, saying: “Great and marvelous are your works, Lord God, the Almighty; righteous and true are your ways, O King of the ages.”'
translation:
  language: zh_hans
  text: '他们唱着上帝的奴仆摩西之歌和羔羊之歌，说：

    “主上帝，全能者啊，

    你的作为伟大而奇妙！

    万世之王啊，[a]

    你的道路公义而真实！”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“万国之王”。
    reason: textual_variant
lexical_decisions:
- source_word: ᾄδουσιν
  choice: 唱着
  rationale: 现在时在异象叙事中呈现正在展开的场景；“唱着”自然地衔接后面的“说”。
- source_word: τὴν ᾠδὴν Μωϋσέως ... καὶ τὴν ᾠδὴν τοῦ ἀρνίου
  choice: 摩西之歌和羔羊之歌
  rationale: 保留两个并列且各有定冠词的“歌”；“之歌”符合庄重诗歌语体，也不擅自判断这是同一首歌还是两首歌。
- source_word: τοῦ δούλου τοῦ θεοῦ
  choice: 上帝的奴仆
  rationale: “奴仆”既保留δοῦλος所含的隶属意味，又比现代汉语单用“奴隶”更适合作为摩西的庄重称号，兼顾受差遣服事的语境。
- source_word: τοῦ ἀρνίου
  choice: 羔羊
  rationale: 在《启示录》中是基督的称号；采用“羔羊”保留祭牲与弥赛亚意象。
- source_word: Μεγάλα καὶ θαυμαστὰ τὰ ἔργα σου
  choice: 你的作为伟大而奇妙
  rationale: 按谓语结构直译，并以“作为”表达上帝所行之事；“奇妙”保留引发惊叹的含义。
- source_word: κύριε, ὁ θεός, ὁ παντοκράτωρ
  choice: 主上帝，全能者啊
  rationale: 保留“主”“上帝”“全能者”三个称谓，并用呼格语气词“啊”自然呈现颂歌中的直接呼告。
- source_word: δίκαιαι καὶ ἀληθιναὶ αἱ ὁδοί σου
  choice: 你的道路公义而真实
  rationale: “公义”保留δίκαιος的道德与审判维度；“真实”对应ἀληθινός，不缩减为仅仅“可靠”。
- source_word: ὁ βασιλεὺς τῶν αἰώνων
  choice: 万世之王
  rationale: 以自然庄重的汉语表达“诸时代之王／永世之王”，保留αἰώνων的时间范围含义。
theological_decisions:
- issue: 摩西称号中δοῦλος的译法
  choice: 上帝的奴仆
  alternative: 上帝的仆人／上帝的奴隶
  rationale: “仆人”容易淡化隶属意味，“奴隶”在现代汉语中又可能只唤起被强制剥削的社会身份；“奴仆”较好地兼顾归属、服事和受差遣的含义。
- issue: 末尾君王称号的文本异文
  choice: 万世之王
  alternative: 万国之王
  rationale: 正文遵从所给SBLGNT的αἰώνων（万世）；“万国”对应重要异文ἐθνῶν，故列入脚注而不并入正文。
- issue: “摩西之歌”和“羔羊之歌”的关系
  choice: 保留并列表达，不解释为一首或两首
  alternative: 摩西和羔羊的歌／两首歌
  rationale: 希腊文重复定冠词和“歌”，但经文未明确解释二者在此究竟是一首联合之歌还是两个相连的称名；译文保留这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话；颂歌部分分行排布以呈现诗歌结构。称呼使用“啊”，避免过度古雅；正文中的脚注标记[a]与脚注完全对应。
