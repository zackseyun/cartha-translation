  text: καὶ ἓν ἐκ τῶν τεσσάρων ζῴων ἔδωκεν τοῖς ἑπτὰ ἀγγέλοις ἑπτὰ φιάλας χρυσᾶς γεμούσας τοῦ θυμοῦ τοῦ θεοῦ τοῦ ζῶντος εἰς τοὺς αἰῶνας τῶν αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/007.yaml
  text: And one of the four living creatures gave to the seven angels seven golden bowls full of the wrath of God[b][a], who lives forever and ever.
translation:
  language: zh_hans
  text: 四个活物中有一个，把七个金碗[a]交给那七位天使；碗里盛满了永永远远[b]活着的上帝的烈怒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“七个金浅盘”；希腊语所指的是一种碗状器皿。
    reason: lexical_alternative
  - marker: b
    text: 直译“直到诸世代的诸世代”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἓν ἐκ τῶν τεσσάρων ζῴων
  choice: 四个活物中有一个
  rationale: ζῷον在《启示录》的宝座异象中指有生命的天上受造者；译作“活物”既简洁庄重，也避免与本书用θηρίον指称的“兽”混淆。
- source_word: ἔδωκεν
  choice: 交给
  rationale: δίδωμι在此表示把器皿给七位天使；“交给”符合现代汉语叙事，也不增添“呈献”等原文未明说的含义。
- source_word: τοῖς ἑπτὰ ἀγγέλοις
  choice: 那七位天使
  rationale: 上下文所指明确；“位”适合有位格的天上使者，“天使”是ἄγγελος在此语境中的通常译法。
- source_word: ἑπτὰ φιάλας χρυσᾶς
  choice: 七个金碗
  rationale: φιάλη指碗状、通常较浅的器皿，“金碗”自然准确；脚注保留“浅盘”等器形上的可能表达。
- source_word: γεμούσας
  choice: 碗里盛满了
  rationale: γέμω与属格搭配表示器皿充满某物；补出“碗里”使汉语关系清楚，同时保留分词对七个碗的修饰作用。
- source_word: τοῦ θυμοῦ τοῦ θεοῦ
  choice: 上帝的烈怒
  rationale: θυμός在此末世审判语境中表达强烈的神圣震怒；“烈怒”保留其力度，又不把它弱化为一般的生气。
- source_word: τοῦ ζῶντος
  choice: 活着的
  rationale: 现在分词修饰“上帝”，表明他是活着的那一位；译文不把这一修饰误接到“烈怒”上。
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: 永永远远
  rationale: 这是表达无尽久远的固定语式；“永永远远”在现代汉语中清楚自然，并保留原文的强调意味。
theological_decisions:
- issue: 上帝之怒的译法
  choice: 上帝的烈怒
  alternative: 上帝的愤怒／上帝的震怒
  rationale: “烈怒”保留θυμός在末世审判场景中的强度，却不额外规定这种怒所涉及的系统神学性质。
- issue: 上帝的生命与永恒的句法关系
  choice: 永永远远活着的上帝
  alternative: 上帝——他活到永永远远
  rationale: 原文的τοῦ ζῶντος修饰“上帝”，εἰς τοὺς αἰῶνας τῶν αἰώνων说明其无尽长存；定语结构忠实保留二者关系，且避免把永恒误解为修饰“烈怒”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“活物”沿用圣经异象语境中的简明称呼；“金碗”比“金瓶”更符合器皿形状。以分号分开交付器皿和器皿内容，提升可读性，同时保持为一个完整句子。
