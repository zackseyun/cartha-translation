id: REV.15.8
reference: Revelation 15:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἐγεμίσθη ὁ ναὸς καπνοῦ ἐκ τῆς δόξης τοῦ θεοῦ καὶ ἐκ τῆς δυνάμεως αὐτοῦ, καὶ οὐδεὶς ἐδύνατο εἰσελθεῖν εἰς τὸν ναὸν ἄχρι τελεσθῶσιν αἱ ἑπτὰ πληγαὶ τῶν ἑπτὰ ἀγγέλων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/008.yaml
  text: And the sanctuary was filled with smoke from the glory of God and from his power[a], and no one was able to enter the sanctuary until the seven plagues of the seven angels were finished.
translation:
  language: zh_hans
  text: 圣所[a]中充满了从神的荣耀和能力而来的烟；直到七位天使的七灾结束，谁也不能进入圣所。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣所”或译“神殿”。希腊文ναός通常更具体地指殿内神圣的居所，而不是整个圣殿区域。
    reason: lexical_alternative
lexical_decisions:
- source_word: ναὸς / ναόν
  choice: 圣所
  rationale: ναός通常指神圣居所或殿的内部圣域，而非整个圣殿范围；“圣所”既保留这一较具体的含义，也适合本节天上敬拜与神显的语境。两处采用同一译法以保持一致。
- source_word: ἐγεμίσθη
  choice: 充满了
  rationale: 准确表达不定过去时被动语态，同时符合现代汉语习惯。
- source_word: καπνοῦ
  choice: 烟
  rationale: “烟”是此处神显意象中自然且准确的译法；在“充满”之后用内容关系表达希腊文属格。
- source_word: ἐκ τῆς δόξης τοῦ θεοῦ καὶ ἐκ τῆς δυνάμεως αὐτοῦ
  choice: 从神的荣耀和能力而来
  rationale: 两次ἐκ均表示来源；译文保留烟源自神的荣耀与能力这一图像，不将二者改写为原因或手段。
- source_word: οὐδεὶς ἐδύνατο εἰσελθεῖν
  choice: 没有人能进入
  rationale: 简洁自然地表达未完成时所描述的持续不能及其不定式补语。
- source_word: ἄχρι τελεσθῶσιν
  choice: ……结束以前
  rationale: 表达时间界限，并保留灾祸须达到终结之后方可进入的结果意味；现代汉语中比逐字译作“被完成”自然。
- source_word: αἱ ἑπτὰ πληγαὶ
  choice: 七种灾祸
  rationale: πληγή在《启示录》此语境中指审判性的灾祸；量词“种”使现代汉语表达自然，又不额外限定灾祸的具体形式。
- source_word: τῶν ἑπτὰ ἀγγέλων
  choice: 七位天使的
  rationale: 保留属格所表达的关联关系，不擅自明确为“所降下的”或“所带来的”。
theological_decisions:
- issue: 天上异象语境中ναός的译法
  choice: 圣所
  alternative: 神殿
  rationale: “圣所”较能体现ναός所指向的内部神圣居所，并与烟充满神居所的神显图像相合；同时不对天上圣所的性质作超出原文的教义界定。
- issue: 烟与神的荣耀、能力之间的关系
  choice: 烟从神的荣耀和能力而来
  alternative: 圣所因神的荣耀和能力而充满烟
  rationale: 原文两次使用ἐκ，最直接表示来源。译文保留这一来源关系，不把它单一解释为因果或工具关系。
- issue: 七种灾祸与七位天使的关系
  choice: 七位天使的七种灾祸
  alternative: 七位天使所降的七种灾祸
  rationale: 希腊文属格本身可以表达归属或关联，却未明说“降下”；采用较开放的表达以保留原文张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。前半句以“从……而来的烟”明确保留原文的来源结构；后半句调整为符合汉语习惯的时间从句在前。脚注标记置于“圣所”之后，使其与所说明的词直接对应。
