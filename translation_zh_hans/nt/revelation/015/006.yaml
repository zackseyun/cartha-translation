  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἐξῆλθον οἱ ἑπτὰ ἄγγελοι οἱ ἔχοντες τὰς ἑπτὰ πληγὰς ἐκ τοῦ ναοῦ, ⸀ἐνδεδυμένοι ⸀λίνον καθαρὸν λαμπρὸν καὶ περιεζωσμένοι περὶ τὰ στήθη ζώνας χρυσᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/006.yaml
  text: And the seven angels who had the seven plagues came out from the sanctuary[a], clothed in clean, bright linen[c][b], and wrapped around the chest with golden sashes.
translation:
  language: zh_hans
  text: 那带着七灾的七位天使从圣所[a]出来，身穿洁净明亮的亚麻衣[b]，胸前束着金带[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“圣殿”。这里的希腊词ναός通常特指圣殿内部的圣所，而不是整个圣殿范围。
    reason: lexical_alternative
  - marker: b
    text: “洁净”也可译作“纯洁”，“明亮”也可译作“闪耀”。有些希腊文抄本在此处作“宝石”，因而可读作“身穿洁净明亮的宝石”。
    reason: textual_variant_and_lexical_alternative
  - marker: c
    text: 或译“各自在胸前系着金色束带”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον
  choice: 出来
  rationale: 准确表达从圣所内部向外移动；现代汉语自然简洁。
- source_word: οἱ ἑπτὰ ἄγγελοι
  choice: 七位天使
  rationale: 异象语境明确指超自然的天使；“位”适合有位格者，也保持庄重。
- source_word: τὰς ἑπτὰ πληγάς
  choice: 七灾
  rationale: 在《启示录》的语境中指神所降的灾祸或审判；“七灾”简洁并与上下文协调。
- source_word: ναοῦ
  choice: 圣所
  rationale: ναός通常特指圣殿内部的神圣处所，而非整个圣殿范围；“圣所”保留这一较窄的含义。
- source_word: ἐνδεδυμένοι
  choice: 身穿
  rationale: 表达完成时分词所描述的穿着状态，符合现代汉语叙述习惯。
- source_word: λίνον
  choice: 麻衣
  rationale: 指用亚麻制成的衣物；原文没有另一个明确表示“细”的词，因此不在正文增译“细麻”。
- source_word: καθαρὸν λαμπρὸν
  choice: 洁净明亮的
  rationale: 分别保留“洁净”和“明亮”的直接语义，同时让汉语修饰关系清楚自然。
- source_word: περιεζωσμένοι περὶ τὰ στήθη
  choice: 胸间束着
  rationale: 准确表现带子系束在胸部而非腰部，并以自然庄重的现代汉语呈现。
- source_word: ζώνας χρυσᾶς
  choice: 金带
  rationale: ζώνη可指腰带、束带或饰带；因位置在胸间，“金带”比“金腰带”更准确。
theological_decisions:
- issue: 天上圣殿语境中ναός的译法
  choice: 圣所
  alternative: 圣殿
  rationale: “圣所”保留ναός所指内部神圣处所的具体含义，但不进一步界定其建筑结构或神学象征。
- issue: 如何表达天使“有”七灾
  choice: 带着七灾
  alternative: 掌管七灾
  rationale: “掌管”会明确加入权柄或职能的解释；“带着”更贴近ἔχοντες，并保留这些天使与七灾之间关系的简约表达。
- issue: λίνον与λίθον的抄本异文
  choice: 正文采用“麻衣”
  alternative: “洁净明亮的宝石”
  rationale: 依所给SBLGNT正文采用λίνον；同时在脚注注明重要异文，不把异文可能产生的意象静默消除。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式紧凑，保留异象叙事的肃穆感；避免使用较古旧的“束胸”“佩带于胸”等表达，也不以“掌管”替代原文较宽泛的“带着”。
