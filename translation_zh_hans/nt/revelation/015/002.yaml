  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ εἶδον ὡς θάλασσαν ὑαλίνην μεμιγμένην πυρί, καὶ τοὺς νικῶντας ἐκ τοῦ θηρίου καὶ ἐκ τῆς εἰκόνος αὐτοῦ καὶ ἐκ τοῦ ἀριθμοῦ τοῦ ὀνόματος αὐτοῦ ἑστῶτας ἐπὶ τὴν θάλασσαν τὴν ὑαλίνην, ἔχοντας κιθάρας τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/002.yaml
  text: And I saw what appeared to be a sea of glass mixed with fire[a], and those who were victorious over the beast and over its image and over the number of its name, standing on the sea of glass[b], holding harps of God.
translation:
  language: zh_hans
  text: 我又看见，仿佛有一片掺杂着火的玻璃海。那些胜过兽、它的像和它名字的数目的人[a]，站在玻璃海上，手拿上帝的竖琴[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “胜过……的人”也可理解为“从兽、它的像和它名字的数目所代表的权势中出来的人”。希腊语的表达既可着重于他们战胜这些对象，也可着重于他们脱离其权势。
    reason: alternative_reading
  - marker: b
    text: “上帝的竖琴”也可理解为属于上帝、由上帝赐予或献给上帝的竖琴；原文属格没有明确限定是哪一种关系。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: 仿佛有
  rationale: 表明这是异象中的比拟或观感，而不是对所见之物作严格等同；现代汉语中自然清楚。
- source_word: θάλασσαν ὑαλίνην
  choice: 一片玻璃海
  rationale: 保留启示文学中鲜明而反常的意象；“玻璃海”简洁庄重，并与本节后半句的重复相呼应。
- source_word: μεμιγμένην πυρί
  choice: 掺杂着火
  rationale: 保留完成时分词所描绘的混合状态，不把“火”解释为颜色、审判或其他象征意义。
- source_word: τοὺς νικῶντας
  choice: 那些胜过了……的人
  rationale: νικάω在《启示录》中常表达胜过、得胜；“胜过了”能自然连接后面的三个对象，同时避免额外加入军事征服色彩。
- source_word: ἐκ τοῦ θηρίου ... καὶ ἐκ τῆς εἰκόνος αὐτοῦ καὶ ἐκ τοῦ ἀριθμοῦ τοῦ ὀνόματος αὐτοῦ
  choice: 兽、兽像和兽名数目
  rationale: 正文按汉语习惯与“胜过了”连用；重复的ἐκ所带来的“胜过”或“脱离其权势”两种可能，则在脚注中保留。
- source_word: ἑστῶτας ἐπὶ τὴν θάλασσαν τὴν ὑαλίνην
  choice: 站在玻璃海上
  rationale: 按ἐπί加宾格在异象描写中的直接空间意义译作“在……上”，保留原文令人惊异的画面，不弱化为“在海边”。
- source_word: κιθάρας τοῦ θεοῦ
  choice: 上帝的琴
  rationale: 以简洁的属格结构保留其可能表示属于上帝、来自上帝或献给上帝的多重关系，不在正文中强行确定。
theological_decisions:
- issue: νικῶντας之后重复使用ἐκ，得胜者与兽、兽像及兽名数目之间究竟是什么关系
  choice: 正文译作他们“胜过了”这些敌对对象
  alternative: 他们从这些对象的领域或权势中出来、获得解救
  rationale: “胜过”符合《启示录》中νικάω反复出现的得胜主题，也最适合现代汉语表达；但ἐκ通常含“从、出于”之意，因此以脚注保留脱离其权势的可能，避免消除原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“玻璃海”“兽像”“兽名数目”保留异象的凝练意象；分为两句以便朗读和理解，同时维持原文各视觉要素的顺序。
