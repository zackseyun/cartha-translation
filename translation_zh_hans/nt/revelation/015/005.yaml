source:
  edition: SBLGNT
  text: Καὶ μετὰ ταῦτα εἶδον, καὶ ἠνοίγη ὁ ναὸς τῆς σκηνῆς τοῦ μαρτυρίου ἐν τῷ οὐρανῷ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/005.yaml
  text: And after these things I saw[a], and the temple of the tabernacle of the testimony in heaven was opened[b],
translation:
  language: zh_hans
  text: 此后，我看见天上那见证之帐幕[b]的圣所[a]开了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣所”也可译作“殿”。原文ναός着重指圣殿内部的神圣空间，而不是整个圣殿建筑群。
    reason: lexical_alternative
  - marker: b
    text: “见证之帐幕”呼应旧约关于圣所的用语，尤其是旷野中与上帝圣约的见证相连的帐幕。
    reason: cross_reference
lexical_decisions:
- source_word: Καὶ μετὰ ταῦτα
  choice: 此后
  rationale: 这是启示文学中常见的叙事推进语。现代汉语用“此后”自然简洁，也保留了与前文相接及时间先后的意思。
- source_word: εἶδον
  choice: 我看见
  rationale: 这里指约翰在异象中的视觉感知；“我看见”直接对应原文，不改成侧重主动察看的“我观看”。
- source_word: ἠνοίγη
  choice: 开了
  rationale: 原文是不定过去时被动语态，表示圣所被打开。汉语“开了”自然表达这一状态变化，而不必明确说出施动者。
- source_word: ὁ ναὸς
  choice: 圣所
  rationale: ναός通常指圣殿内部的神圣空间，而非整个圣殿建筑群；“圣所”较准确地传达这一范围。脚注保留“殿”这一较熟悉的译法。
- source_word: τῆς σκηνῆς
  choice: 帐幕
  rationale: 在敬拜礼仪语境中，σκηνή指旷野时期的会幕；“帐幕”既贴近字义，也保留旧约背景。
- source_word: τοῦ μαρτυρίου
  choice: 见证之
  rationale: “见证”保留μαρτύριον与上帝所赐见证及圣约凭据有关的旧约用语；采用“之”使层叠的属格结构在现代庄重汉语中清楚可读。
- source_word: ἐν τῷ οὐρανῷ
  choice: 天上
  rationale: 明确指出圣所位于属天领域；置于整个名词短语之前，符合现代汉语语序。
theological_decisions:
- issue: 天上圣所与见证帐幕的礼仪意象
  choice: 保留“天上那见证之帐幕的圣所”这一完整复合表达
  alternative: 简化为“天上的圣所”或解释为“天上的殿，就是见证的帐幕”
  rationale: 原文以连续属格将圣所、帐幕和见证联系起来，呼应旧约旷野帐幕，也延续《启示录》中天上圣所的意象。译文不把这些意象合并成解释性意译。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“见证之帐幕”以适度正式的“之”保留原文层叠的礼仪性表达；全句则按汉语习惯组织为“我看见……开了”，避免生硬照搬希腊语并列结构。
