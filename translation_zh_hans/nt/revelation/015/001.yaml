  naturalness: “天上另有一个又大又奇妙的异象”庄重而自然。“七位天使带着最后的七场灾祸”比“拿着末后的七种灾祸”更符合现代汉语，并清楚表达灾祸的数目和其“最后”的性质。
  terminology: “异象”在《启示录》此处可接受；“上帝的烈怒”恰当传达θυμός在审判语境中的强烈意味。“最后的七场灾祸”准确对应ἑπτὰ ... πληγὰς ... τὰς ἐσχάτας。
  issues:
