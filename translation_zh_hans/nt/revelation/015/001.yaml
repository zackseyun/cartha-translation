  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ εἶδον ἄλλο σημεῖον ἐν τῷ οὐρανῷ μέγα καὶ θαυμαστόν, ἀγγέλους ἑπτὰ ἔχοντας πληγὰς ἑπτὰ τὰς ἐσχάτας, ὅτι ἐν αὐταῖς ἐτελέσθη ὁ θυμὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/001.yaml
  text: 'And I saw another sign in heaven[a], great and marvelous: seven angels having seven last plagues[b], because in them the wrath of God was finished.'
translation:
  language: zh_hans
  text: 我又看见天上另有一个又大又奇妙的异象：七位天使带着最后的七场灾祸，因为上帝的烈怒在这些灾祸中已经完成了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σημεῖον
  choice: 异象
  rationale: 本词本义为可见的“记号”；在《启示录》的异象语境中，此处指具有象征意义的天上景象。译作“异象”比日常中文的“记号”自然，同时不把它强化为凶兆。
- source_word: ἐν τῷ οὐρανῷ
  choice: 天上
  rationale: 此处是启示文学中的天界场景，不只是可见的天空。
- source_word: μέγα καὶ θαυμαστόν
  choice: 宏大而奇妙
  rationale: 兼顾 μέγα 的规模与庄严，以及 θαυμαστόν 所表达的惊叹感。
- source_word: ἀγγέλους ἑπτὰ ἔχοντας πληγὰς ἑπτὰ
  choice: 七位天使拿着七种灾祸
  rationale: “拿着”自然保留 ἔχοντας 的持有意味；“灾祸”适合表达 πληγή 在神圣审判语境中的含义，又避免让“瘟疫”把范围缩窄为疾病。
- source_word: τὰς ἐσχάτας
  choice: 末后的
  rationale: 保留其在次序上居末、并可能具有终局性质的含义。
- source_word: ὅτι
  choice: 因为
  rationale: 明确表达这些灾祸之所以是“末后的”的原因。
- source_word: ἐν αὐταῖς
  choice: 在这些灾祸中
  rationale: 明示代词所指并保留 ἐν 的范围或媒介色彩，不强行限定为单一工具关系。
- source_word: ἐτελέσθη
  choice: 要达到终点
  rationale: 希腊语为不定过去时被动式，但异象叙事可从预示性角度把将来的完成呈现为确定事实。中文用“要”与“达到终点”既顺应上下文，又保留完成、终结的语义；脚注说明更贴近形式的译法。
- source_word: ὁ θυμὸς τοῦ θεοῦ
  choice: 上帝的烈怒
  rationale: “烈怒”体现 θυμός 的强烈审判色彩，比一般的“愤怒”更有力度，又不额外加入任意的教义解释。
theological_decisions:
- issue: 启示文学中上帝审判用语的强度
  choice: 上帝的烈怒
  alternative: 上帝的愤怒
  rationale: θυμός 在本书的审判语境中语气强烈；“烈怒”保留这种庄严与力度，不淡化也不夸饰。
- issue: ἐτελέσθη 的完成意义及时间表达
  choice: 要在这些灾祸中达到终点
  alternative: 在这些灾祸中完成了
  rationale: 原文以完成体式描写异象所见之事，但七灾随后才展开。正文采用自然中文表达其确定将成的终局性，脚注保留原文更直接的过去时被动形式，从而不把它解释成超出本节范围的所有审判均已终结。
translation_notes:
  register: 采用庄重而现代的普通话。“七位”用于有位格的天使，“七种”用于灾祸，使中文清楚自然。用冒号引出所见异象的具体内容；脚注标记置于相关句末。
