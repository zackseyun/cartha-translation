- from: 我又看见天上有另一个异象，宏大而奇妙：七位天使拿着末后的七种灾祸，因为上帝的烈怒要在这些灾祸中达到终点。[a]
  to: 我又看见天上另有一个又大又奇妙的异象：七位天使带着最后的七场灾祸，因为上帝的烈怒在这些灾祸中已经完成了。
  rationale: 将“要达到终点”改为“已经完成了”，以忠实保留ἐτελέσθη的完成义，而不在正文中预设未来时间框架。将“宏大而奇妙”调整为“又大又奇妙”，并将“拿着末后的七种灾祸”调整为“带着最后的七场灾祸”，使中文更自然且不改变原文意义。删除仅为原先不当未来译法辩护的脚注。
