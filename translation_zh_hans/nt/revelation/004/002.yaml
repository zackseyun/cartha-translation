id: REV.4.2
reference: Revelation 4:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ⸀εὐθέως ἐγενόμην ἐν πνεύματι· καὶ ἰδοὺ θρόνος ἔκειτο ἐν τῷ οὐρανῷ, καὶ ἐπὶ τὸν θρόνον καθήμενος,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/002.yaml
  text: Immediately I was in the Spirit[a], and behold, a throne stood in heaven, and one seated on the throne,
translation:
  language: zh_hans
  text: 我立刻就在圣灵里[a]。看哪，天上安设着一个宝座，宝座上坐着一位。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在灵里”。希腊原文“灵”没有冠词，既可能指在圣灵里，也可能指处于属灵或异象的状态。
    reason: 保留原文在圣灵所指与异象状态之间的解释空间。
lexical_decisions:
- source_word: εὐθέως
  choice: 立刻
  rationale: 表达动作随即发生，保留异象突然转入下一幕的紧迫感，也符合现代汉语习惯。
- source_word: ἐγενόμην
  choice: 在……里
  rationale: γίνομαι在此与介词短语合用，表示约翰随即进入或处于先知性的属灵状态；汉语用“立刻在……”自然简洁，时间副词已传达状态的转变。
- source_word: ἐν πνεύματι
  choice: 在圣灵里
  rationale: 《启示录》中这一短语常标示先知受感而进入异象；“圣灵”是很可能的所指，但原文无冠词，因此以脚注保留“在灵里”这一可能译法。
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 作为引人注意的话语标记，“看哪”保留启示文学庄重而鲜明的语气。
- source_word: θρόνος
  choice: 一个宝座
  rationale: 无冠词名词在此首次引入异象中的宝座；“一个”符合现代汉语的信息结构。
- source_word: ἔκειτο
  choice: 安设着
  rationale: κεῖμαι在此表示宝座处于设立、安置好的状态；“安设着”比“躺着”准确，也比单说“有”更能保留其既定位置的意味。
- source_word: ἐν τῷ οὐρανῷ
  choice: 天上
  rationale: 这里指属天领域而非大气层中的天空；“天上”是自然、庄重的汉语表达。
- source_word: καθήμενος
  choice: 坐着一位
  rationale: 实词化分词只说明有一位坐在宝座上，并未在本短语中明说身份；译文避免提前具体指认。
theological_decisions:
- issue: ἐν πνεύματι是特指圣灵，还是泛指属灵或异象状态
  choice: 在圣灵里
  alternative: 在灵里
  rationale: 上下文及《启示录》中相近公式支持圣灵使先知进入异象的理解；但原文πνεύματι没有冠词，仍容许理解为属灵或异象状态，因此在脚注中保存歧义。
- issue: 宝座上所坐者的身份是否在本节明说
  choice: 宝座上坐着一位
  alternative: 有一位坐在宝座上
  rationale: 原文仅用实词化分词καθήμενος，没有在此直接加上“神”等身份称谓；译文保留这种含蓄。
translation_notes:
  register: 采用现代、庄重而易懂的启示文学语体。“看哪”保留原文的引人注目功能；分为两句，使汉语节奏清楚，同时不消解原文异象展开的连贯性。
