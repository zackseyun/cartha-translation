  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ἄξιος εἶ, ὁ κύριος καὶ ὁ θεὸς ⸀ἡμῶν, λαβεῖν τὴν δόξαν καὶ τὴν τιμὴν καὶ τὴν δύναμιν, ὅτι σὺ ἔκτισας ⸀τὰ πάντα, καὶ διὰ τὸ θέλημά σου ἦσαν καὶ ἐκτίσθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/011.yaml
  text: You are worthy[a], our Lord and God, to receive the glory and the honor and the power, because you created all things[b], and by your will they existed and were created.
translation:
  language: zh_hans
  text: “我们的主和上帝，你配得[a]领受荣耀、尊贵和权能，因为你创造了万物；万物因你的旨意[b]而存在，也被创造。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可按原文语序译作：“配得的是你。”希腊原文把“配得”置于句首，以示强调。
    reason: word_order_emphasis
  - marker: b
    text: “因你的旨意”也可译作“借着你的旨意”。希腊语διὰ τὸ θέλημά σου主要可表示原因，也可能带有凭借的含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄξιος εἶ
  choice: 你配得
  rationale: 谓语形容词ἄξιος与εἶ合用，表示受话者配得领受随后所列的荣耀、尊贵和权能。“你配得”是自然、庄重的现代汉语，同时保留直接称颂的语气。
- source_word: ὁ κύριος καὶ ὁ θεὸς ἡμῶν
  choice: 我们的主和上帝
  rationale: 此处带冠词的名词组合在敬拜语境中作直接称呼。“我们的主和上帝”保留两个称号及复数属格ἡμῶν所表达的“我们的”。
- source_word: λαβεῖν
  choice: 配得（领受）
  rationale: λαβεῖν是不定式，说明受话者配得什么。汉语“配得荣耀、尊贵和权能”已自然包含“配得领受”的意思，省去“领受”可避免生硬而不损失语义。
- source_word: τὴν δόξαν καὶ τὴν τιμὴν καὶ τὴν δύναμιν
  choice: 荣耀、尊贵和权能
  rationale: 三个名词构成敬拜中的并列颂词。“荣耀”对应δόξα，“尊贵”对应τιμή，“权能”对应δύναμις；措辞庄重且保持三项并列的节奏。
- source_word: ὅτι
  choice: 因为
  rationale: ὅτι引出上帝配得颂赞的理由；“因为”在现代汉语中清楚保留其因果作用。
- source_word: ἔκτισας τὰ πάντα
  choice: 你创造了万物
  rationale: κτίζω意为“创造”，τὰ πάντα涵盖一切受造之物；“万物”简洁、庄重，并保留其全面范围。
- source_word: διὰ τὸ θέλημά σου
  choice: 因你的旨意
  rationale: διά接宾格通常表示原因或缘由。“因你的旨意”直接保留这一因果含义，同时不排除该短语可能带有较弱的凭借色彩。
- source_word: ἦσαν καὶ ἐκτίσθησαν
  choice: 而存在，也被创造
  rationale: 分别保留未完成时ἦσαν和不定过去时被动式ἐκτίσθησαν两个动词，不将“存在”与“被创造”合并为单一概念。虽然汉语表达带有张力，但这正反映原文措辞。
theological_decisions:
- issue: 对上帝称号组合的称呼式处理
  choice: 我们的主和上帝
  alternative: 主啊，我们的上帝
  rationale: 上下文表明这是对宝座上那一位的直接称颂。所选译法保留两个称号及“我们的”，不额外说明二者之间的神学关系。
- issue: 上帝旨意与万物存在、受造的关系
  choice: 万物因你的旨意而存在，也被创造
  alternative: 万物借着你的旨意而存在，也被创造
  rationale: διά加宾格首先支持原因或缘由义，因此译作“因”。脚注保留凭借义的可能性，避免把经文扩展成更明确的哲学或形而上学命题。
- issue: ἦσαν与ἐκτίσθησαν的并列张力
  choice: 存在，也被创造
  alternative: 得以存在并被创造
  rationale: 所选译法分别呈现两个动词，保留原文在“存在”与“被创造”之间的张力，而不擅自规定时间先后或将二者化约为一个事件。
translation_notes:
  register: 采用现代、庄重且适合公开诵读的汉语。以分号划分创造的理由与万物因上帝旨意而存在、受造的陈述；保留颂赞体的节奏。所有脚注标记均置于正文中相应词语之后。
