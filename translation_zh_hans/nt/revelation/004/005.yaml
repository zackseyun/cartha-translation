  text: καὶ ἐκ τοῦ θρόνου ἐκπορεύονται ἀστραπαὶ καὶ φωναὶ καὶ βρονταί· καὶ ἑπτὰ λαμπάδες πυρὸς καιόμεναι ἐνώπιον τοῦ θρόνου, ⸀ἅ εἰσιν ⸀τὰ ἑπτὰ πνεύματα τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/005.yaml
  text: And from the throne come flashes of lightning and sounds and peals of thunder[a]; and before the throne were seven lamps of fire burning[c][b], which are the seven spirits of God.
translation:
  language: zh_hans
  text: 有闪电、声响[a]和雷鸣从宝座发出；宝座前有七盏火灯燃烧着[b]，这就是上帝的七灵[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “声响”或译“声音”。
    reason: lexical_alternative
  - marker: b
    text: 或译“七支燃烧的火把”。
    reason: lexical_alternative
  - marker: c
    text: 许多人把“上帝的七灵”理解为象征独一圣灵的完全；但希腊原文写的是复数“七灵”。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκπορεύονται
  choice: 发出
  rationale: 表达这些现象从宝座中出来，保留现在时所呈现的持续、鲜活景象，同时符合现代汉语习惯。
- source_word: ἀστραπαὶ
  choice: 闪电
  rationale: 现代汉语通常不以复数形态标示多次闪电；在并列异象中，“闪电”自然地涵盖反复出现的电光。
- source_word: φωναὶ
  choice: 声响
  rationale: φωνή既可指人的“声音”，也可泛指“声响”。与闪电、雷鸣并列时，“声响”较为自然，又不擅自断定是有位格者说话；“声音”列入脚注。
- source_word: βρονταί
  choice: 雷鸣
  rationale: 以自然凝练的汉语表达复数所描绘的接连雷声。
- source_word: λαμπάδες πυρὸς
  choice: 火炬
  rationale: λαμπάς通常指燃烧的火把或火炬；结合πυρός和καιόμεναι，以“火炬燃烧着”自然呈现火焰意象。“灯”仍是可能译法，列入脚注。
- source_word: καιόμεναι
  choice: 燃烧着
  rationale: 保留现在分词所表达的持续燃烧状态。
- source_word: ἐνώπιον τοῦ θρόνου
  choice: 宝座前
  rationale: 直接表达异象中的空间位置，简洁而庄重。
- source_word: ἅ εἰσιν
  choice: 这就是
  rationale: 自然引出七支火炬的象征性身份，并适应汉语不区分单复数的指示表达。
- source_word: τὰ ἑπτὰ πνεύματα τοῦ θεοῦ
  choice: 上帝的七灵
  rationale: 忠实保留希腊文明确的复数“七灵”，不在正文中将其解释性改写为“七重的灵”或“一位圣灵”。
theological_decisions:
- issue: τὰ ἑπτὰ πνεύματα τοῦ θεοῦ的所指
  choice: 正文直译为“上帝的七灵”
  alternative: “上帝七重的灵”，或理解为一位圣灵之完全的象征性说法
  rationale: 希腊文明确使用复数“七灵”。正文保留其措辞及神学张力，不以解释取代翻译；常见的象征性理解放入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“又有……从……发出”保持异象叙述的动态感；以分号对应原文两组并列景象。正文避免用解释性措辞消除“七灵”的有意张力。
