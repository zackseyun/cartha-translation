  naturalness: 译文庄重、通顺，标点与异象叙述的节奏自然。“又有”并非错误，但原文καὶ在此仅为连词，以“有……从宝座发出”更简洁自然。将“燃烧着”置于“七盏火灯”之后，语序流畅。
  terminology: “宝座”“闪电”“雷鸣”“上帝的七灵”均恰当，且保留了τὰ ἑπτὰ πνεύματα的复数，未作教义性化约。脚注c的“一位圣灵的完全”措辞稍不自然，改为“独一圣灵的完全”更合汉语神学书面语，同时明确其为常见理解而非正文所断言。
