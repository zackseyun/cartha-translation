- from: 又有闪电、声响[a]和雷鸣从宝座中发出；宝座前有七支火炬燃烧着[b]，这就是上帝的七灵[c]。
  to: 有闪电、声响[a]和雷鸣从宝座发出；宝座前有七盏火灯燃烧着[b]，这就是上帝的七灵[c]。
  rationale: 修订仅消除“宝座中”所增添的空间具体化，并以“七盏火灯”较贴切地表达λαμπάδες πυρὸς；保留原文的现在时动态、三项并列现象、七盏／七灵的数量及象征性身份说明。脚注锚点均保留并与对应词语相连。
