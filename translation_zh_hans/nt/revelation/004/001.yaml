id: REV.4.1
reference: Revelation 4:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα εἶδον, καὶ ἰδοὺ θύρα ἠνεῳγμένη ἐν τῷ οὐρανῷ, καὶ ἡ φωνὴ ἡ πρώτη ἣν ἤκουσα ὡς σάλπιγγος λαλούσης μετ’ ἐμοῦ, λέγων· Ἀνάβα ὧδε, καὶ δείξω σοι ἃ δεῖ γενέσθαι. μετὰ ταῦτα
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/001.yaml
  text: After these things I looked[a], and behold, a door standing open in heaven, and the first voice that I had heard, like a trumpet speaking with me, said, “Come up here[c][b], and I will show you what must take place after these things.”
translation:
  language: zh_hans
  text: 这些事以后[a]，我观看，看哪，天上有一扇门敞开着；我最初听见的那声音[b]，像号筒一样同我说话[c]，说：“上到这里来，我要把这些事以后必须发生的事指给你看。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可较顺畅地译作：“此后……这以后必须发生的事。”希腊文在本节开头和结尾都重复了复数短语“这些事以后”。
    reason: lexical_alternative
  - marker: b
    text: “我最初听见的那声音”很可能回指约翰先前听见的声音；参《启示录》1:10。
    reason: cross_reference
  - marker: c
    text: 或译：“对我说话。”希腊文较直译为“同我说话”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: 这些事以后
  rationale: 保留复数指示语气，并在本节开头和结尾照原文重复；不预先断定这顺序只是文学、异象或救赎历史层面的顺序。
- source_word: εἶδον
  choice: 我观看
  rationale: 在异象语境中表达约翰转而观看，也避免与随后表示引人注意的“看哪”形成生硬的“我看见，看哪”。
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留原文突然引导读者注意异象的语篇功能，并维持启示文学庄重而有张力的语气。
- source_word: θύρα ἠνεῳγμένη
  choice: 一扇门敞开着
  rationale: 希腊文完成时被动分词强调门已经被打开并保持敞开的状态；此译法自然传达这一结果状态。
- source_word: ἐν τῷ οὐρανῷ
  choice: 天上
  rationale: 本处指属天领域，而不是单指可见的天空。
- source_word: ἡ φωνὴ ἡ πρώτη
  choice: 先前我听见的那声音
  rationale: 用自然汉语表达“第一个声音”的回指作用，同时不把声音的身份说得比原文更明确。
- source_word: ὡς σάλπιγγος
  choice: 像号筒一样
  rationale: 保留明喻而非把声音等同于号筒；“号筒”符合古代吹奏信号乐器的语境。
- source_word: λαλούσης μετ’ ἐμοῦ
  choice: 同我说话
  rationale: 保留 μετά 加属格较直译的“同我”，同时在现代汉语中仍然自然；“对我说话”也是可能的表达。
- source_word: Ἀνάβα ὧδε
  choice: 上到这里来
  rationale: 既表达向上移动，也保留说话者所在位置所决定的“这里来”。
- source_word: ἃ δεῖ γενέσθαι
  choice: 必定发生的事
  rationale: δεῖ 表达必要性；“必定”在此自然传达事情必须发生，而不额外解释这种必要性的性质。
- source_word: δείξω σοι
  choice: 我要……指给你看
  rationale: 自然表达将来的应许，也准确保留“使你看见、展示给你”的视觉含义。
theological_decisions:
- issue: 重复的 μετὰ ταῦτα 所表达的时间次序
  choice: 两处都译作“这些事以后”
  alternative: 译作“此后”，或在结尾译作“这以后”
  rationale: 原文在句首和句末重复同一复数短语。保留重复可避免预先断定这次序究竟是文学结构、异象经历还是救赎历史的时间表。
- issue: “先前的声音”的身份
  choice: 只作回指，并以脚注提示《启示录》1:10
  alternative: 在正文中明确说是1:10中的同一个声音或说明说话者身份
  rationale: 上下文很可能回指1:10，但本节并未进一步明说声音的身份，因此正文保留原文的含蓄。
- issue: 门敞开的施事者
  choice: 表达门已经敞开并保持该状态，不补出是谁开的门
  alternative: 译成“上帝打开的一扇门”
  rationale: 被动形式没有明说施事者；不应因神学推断而将其补入正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”有意保留启示文学中引人注意的语气；“号筒”避免现代乐队用语“喇叭”可能带来的语域偏差。句式保留原文的异象推进和重复，但以分句和标点减轻汉语阅读负担。
