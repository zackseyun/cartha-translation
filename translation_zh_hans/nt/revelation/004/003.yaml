  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ⸂καὶ ὁ καθήμενος⸃ ὅμοιος ὁράσει λίθῳ ἰάσπιδι καὶ σαρδίῳ, καὶ ἶρις κυκλόθεν τοῦ θρόνου ⸂ὅμοιος ὁράσει σμαραγδίνῳ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/003.yaml
  text: And the one seated there was in appearance like jasper and sardius stone[b][a], and around the throne was a rainbow in appearance like emerald.
translation:
  language: zh_hans
  text: 坐在宝座上的那一位，看起来仿佛碧玉和红玉髓[a]；宝座周围有一道彩虹[b]，看起来仿佛绿宝石。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“红玛瑙”；这种古代宝石的确切矿物种类不能完全确定，传统上也有音译作“撒狄石”的。
    reason: lexical_alternative
  - marker: b
    text: 或译“虹光”；这里可能指环绕宝座、如彩虹般的光辉。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ καθήμενος
  choice: 坐在宝座上的那一位
  rationale: 这是带冠词的实词化分词，指上文坐在宝座上的那一位。“宝座”由紧接的上文明确给出，在中文中补出可使指代自然清楚，同时保留其安坐掌权的姿态。
- source_word: ὅμοιος ὁράσει
  choice: 看起来仿佛
  rationale: ὁράσει 是表示方面的与格，意思是“就外观而言”。译文突出异象中的视觉相似，而不把宝石当作那一位的实际材质。
- source_word: λίθῳ ἰάσπιδι
  choice: 碧玉
  rationale: ἴασπις 指一种珍贵石料，中文圣经语境中“碧玉”简明而庄重；不另译 λίθος 为“石头”，以免中文累赘。
- source_word: σαρδίῳ
  choice: 红玉髓
  rationale: 该词通常指带红色的玉髓类宝石。“红玉髓”比音译名称更便于现代读者理解，也避免将其过度确定为现代矿物学意义上的红宝石。
- source_word: ἶρις
  choice: 彩虹
  rationale: 该词通常指彩虹；在此异象中也可能侧重环绕宝座的虹状光辉。正文采用直接常见的“彩虹”，脚注保留“虹光”的可能。
- source_word: κυκλόθεν τοῦ θρόνου
  choice: 宝座周围
  rationale: κυκλόθεν 表示从四周环绕的位置。“宝座周围”自然、准确，不额外规定其形状或运动。
- source_word: ὅμοιος ὁράσει σμαραγδίνῳ
  choice: 看起来仿佛绿宝石
  rationale: 再次保留外观上的比拟。σμαράγδινος 表示绿宝石般的外观或色泽，译文不暗示彩虹实际由绿宝石构成。
theological_decisions:
- issue: 以宝石的比喻描写宝座上的那一位
  choice: 两处都保留“看起来仿佛”的视觉比拟
  alternative: 将那一位或彩虹直接说成宝石，或解释为发出特定颜色的光
  rationale: 希腊文两次使用 ὅμοιος ὁράσει，描述的是异象中的外观相似，而非材质或本体。保留比拟可避免把象征性异象改写为直接的形体描写。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。句式保持启示文学的异象感，以“看起来仿佛”明确两层视觉类比；宝石名称选用现代读者较易理解的名称，并用脚注保留古代宝石辨识上的不确定性。
