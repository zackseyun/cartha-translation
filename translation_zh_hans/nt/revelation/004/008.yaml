id: REV.4.8
reference: Revelation 4:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ τὰ τέσσαρα ζῷα, ἓν ⸂καθ’ ἓν⸃ ⸀αὐτῶν ⸀ἔχων ἀνὰ πτέρυγας ἕξ, κυκλόθεν καὶ ἔσωθεν γέμουσιν ὀφθαλμῶν· καὶ ἀνάπαυσιν οὐκ ἔχουσιν ἡμέρας καὶ νυκτὸς λέγοντες· Ἅγιος ἅγιος ἅγιος κύριος, ὁ θεός, ὁ παντοκράτωρ, ὁ ἦν καὶ ὁ ὢν καὶ ὁ ἐρχόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/008.yaml
  text: 'And the four living creatures[a], each one of them having six wings, are full of eyes all around and within; and they have no rest day and night, saying: “Holy, holy, holy is the Lord God, the Almighty, who was and who is and who is coming.”'
translation:
  language: zh_hans
  text: 四个活物，每一个都有六只翅膀，周围和里面都布满了眼睛。它们昼夜不停地说：“圣哉，圣哉，圣哉！主上帝是全能者；他昔在、今在，并且正在来临。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可按较传统的表达译作“昔在、今在、将要来的”。希腊原文末项为现在分词，正文译作“正在来临”以保留其动态意味。
    reason: 更正原脚注把“来临”误作“永在”的问题，并保留与英语审校记录一致的传统性替代表达。
lexical_decisions:
- source_word: ζῷα
  choice: 活物
  rationale: 指异象中有生命的天上受造者；“活物”既沿用汉语圣经中清晰庄重的表达，也避免现代“动物”一词造成误解。
- source_word: ἓν καθ’ ἓν αὐτῶν
  choice: 每一个
  rationale: 保留分配性的强调，表明四个活物各自都具有下述特征。
- source_word: ἔχων ἀνὰ πτέρυγας ἕξ
  choice: 都有六只翅膀
  rationale: ἀνά在此表达逐一分配，即每个活物各有六只翅膀；译法自然明确。
- source_word: κυκλόθεν καὶ ἔσωθεν
  choice: 周围和里面
  rationale: 保留两个空间层面，不把异象具体化为原文未明说的身体部位。
- source_word: γέμουσιν ὀφθαλμῶν
  choice: 都布满了眼睛
  rationale: 传达“充满”的鲜明异象；“布满”比直译“充满眼睛”更符合现代汉语。
- source_word: ἀνάπαυσιν οὐκ ἔχουσιν ἡμέρας καὶ νυκτός
  choice: 昼夜不停
  rationale: 自然表达他们日夜没有歇息的持续状态，又由下文“说”明确其持续活动。
- source_word: λέγοντες
  choice: 说
  rationale: 保持动词的中性语气，不擅自增添“呼喊”等强度。
- source_word: Ἅγιος ἅγιος ἅγιος
  choice: 圣哉！圣哉！圣哉！
  rationale: 完整保留三重重复及礼赞语气；“圣哉”庄重且为普通读者熟悉。
- source_word: κύριος, ὁ θεός
  choice: 主上帝
  rationale: 将两个神圣称号紧密相连，符合现代汉语宗教语体。
- source_word: ὁ παντοκράτωρ
  choice: 全能者
  rationale: 保留其作为神圣称号的名词形式，传达掌有一切权能之意。
- source_word: ὁ ἦν καὶ ὁ ὢν καὶ ὁ ἐρχόμενος
  choice: 他昔在、今在，并且正在来临
  rationale: 前两项以凝练庄重的“昔在、今在”表达，末项用“正在来临”保留希腊语现在分词的动态和持续意味。
theological_decisions:
- issue: 神圣时间称号 ὁ ἦν καὶ ὁ ὢν καὶ ὁ ἐρχόμενος 的末项
  choice: 他昔在、今在，并且正在来临
  alternative: 他昔在、今在、以后永在
  rationale: ὁ ἐρχόμενος 字面是“那正在来临者”，重点是来临的行动，而非单纯表示未来存在。正文保留其动态和末世张力；脚注列出汉语传统译法，以反映其熟悉度而不让传统表达取代原文意象。
translation_notes:
  register: 采用现代、庄重而易懂的敬拜语体。“圣哉”保留礼仪性的三重宣告；其余句法尽量简洁。脚注标记[a]置于相关神圣称号之后。
