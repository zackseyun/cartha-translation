  text: καὶ τὸ ζῷον τὸ πρῶτον ὅμοιον λέοντι, καὶ τὸ δεύτερον ζῷον ὅμοιον μόσχῳ, καὶ τὸ τρίτον ζῷον ⸀ἔχων ⸂τὸ πρόσωπον ὡς⸃ ἀνθρώπου, καὶ τὸ τέταρτον ζῷον ὅμοιον ἀετῷ πετομένῳ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/007.yaml
  text: And the first living creature was like a lion, and the second living creature like a calf, and the third living creature had a face like a man, and the fourth living creature was like an eagle in flight.
translation:
  language: zh_hans
  text: 第一个活物像狮子，第二个活物像牛犊，第三个活物有一张像人的脸[a]，第四个活物像飞翔的鹰。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一张人脸。”希腊文直译为“一张像人的脸”。
    reason: 说明‘人脸’是较简约的汉语表达，同时保留原文ὡς所标示的比较关系。
lexical_decisions:
- source_word: ζῷον
  choice: 活物
  rationale: ζῷον在宝座异象中指有生命的受造者；译作“活物”既自然，也可与本书后文敌对性的“兽”（θηρίον）区分。
- source_word: ὅμοιον
  choice: 像
  rationale: 表达相似而非同一；“像”简洁自然，并在四个并列描述中保持一致。
- source_word: λέοντι
  choice: 狮子
  rationale: 该词在ὅμοιον之后表示比较对象，直译为“像狮子”。
- source_word: μόσχῳ
  choice: 牛犊
  rationale: μόσχος通常指幼牛；“牛犊”比泛称“牛”更准确，同时不额外限定性别或祭牲含义。
- source_word: ἔχων
  choice: 有
  rationale: 将分词按汉语习惯处理为谓语“有”，清楚保留第三个活物的外貌描写。
- source_word: τὸ πρόσωπον ὡς ἀνθρώπου
  choice: 有一张像人的脸
  rationale: πρόσωπον指“脸”，ὡς表示比较；“像人的脸”保留比较关系，而“人”在现代汉语中可自然泛指人类，不必额外限定为男性。
- source_word: ἀετῷ πετομένῳ
  choice: 飞翔的鹰
  rationale: ἀετός通常指鹰，πετομένῳ描绘鹰正在飞翔；“飞翔的鹰”直接而有画面感。
theological_decisions:
- issue: 第三个活物之脸的比较对象（ἀνθρώπου）
  choice: 像人的脸
  alternative: 人的脸；像男人的脸
  rationale: ἀνθρώπου在此可泛指人类，且ὡς明确表达相似关系。“像人的脸”既不把比较改成等同，也不无根据地将其限定为男性。脚注保留较简约的译法和原文语序。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。四个活物的描述保持整齐的并列结构；“牛犊”体现幼牛之义，“飞翔的鹰”直接呈现分词所描绘的动态。
