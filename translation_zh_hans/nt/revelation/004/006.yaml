id: REV.4.6
reference: Revelation 4:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἐνώπιον τοῦ θρόνου ὡς θάλασσα ὑαλίνη ὁμοία κρυστάλλῳ. Καὶ ἐν μέσῳ τοῦ θρόνου καὶ κύκλῳ τοῦ θρόνου τέσσαρα ζῷα γέμοντα ὀφθαλμῶν ἔμπροσθεν καὶ ὄπισθεν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/006.yaml
  text: And before the throne was something like a sea of glass[a], like crystal. And in the midst of the throne and around the throne were four living creatures[c][b], full of eyes in front and behind.
translation:
  language: zh_hans
  text: 宝座前仿佛有一片玻璃海[a]，如同水晶。宝座之中和宝座周围[c]有四个活物[b]，前后都布满了眼睛。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“玻璃般的海”。希腊文采用比拟的说法，即“仿佛有一片玻璃海”。
    reason: lexical_alternative
  - marker: b
    text: 或译“四个有生命的受造物”。这里的希腊词并不是启示录后文所说的那些敌对的“兽”。
    reason: lexical_alternative
  - marker: c
    text: “宝座之中和宝座周围”在空间上不易理解；希腊文可能反映异象中的观看视角，因此这里特意保留接近原文的表达。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐνώπιον
  choice: 在……前（宝座前）
  rationale: 表达宝座与眼前景象的空间关系；“宝座前”简洁自然，不额外引入“临在”等含义。
- source_word: ὡς
  choice: 仿佛
  rationale: 明确这是异象中的比拟，而非把所见之物严格等同于海。
- source_word: θάλασσα ὑαλίνη
  choice: 一片玻璃海
  rationale: 保留名词与形容词构成的鲜明意象，也与后面的“如同水晶”自然衔接；脚注列出更直白的表达。
- source_word: ὁμοία κρυστάλλῳ
  choice: 如同水晶
  rationale: 保留第二层比较及其晶莹明澈的视觉效果，不增添原文未明说的属性。
- source_word: ἐν μέσῳ τοῦ θρόνου καὶ κύκλῳ τοῦ θρόνου
  choice: 宝座之中和宝座周围
  rationale: 原文的空间关系难以形成单一、明确的几何图景；译文贴近其措辞，保留异象视角中的张力。
- source_word: ζῷα
  choice: 活物
  rationale: “活物”在中文圣经语境中能指有生命的受造者，同时避免译作“兽”而让人误以为是启示录后文敌对的兽。
- source_word: γέμοντα ὀφθαλμῶν
  choice: 布满了眼睛
  rationale: 用自然的现代汉语表达“满有眼睛”的形象，并保持其强烈的视觉感。
- source_word: ἔμπροσθεν καὶ ὄπισθεν
  choice: 前后
  rationale: 简明对应两个方位，修饰这些活物身上眼睛的分布。
theological_decisions:
- issue: 天上宝座异象中 ζῷα 的译法
  choice: 活物
  alternative: 有生命的受造物；生灵；兽
  rationale: 该词在这里指宝座周围有生命的存在，并呼应以西结书的宝座异象。“活物”不贬抑这些存在，也不把它们与启示录后文敌对的“兽”混同。
- issue: 如何处理“宝座之中和宝座周围”的空间张力
  choice: 保留“宝座之中和宝座周围”
  alternative: 宝座中央的四周；在宝座周围；在宝座和环绕它的区域之间
  rationale: 希腊文的空间描述本身较难协调，可能反映异象的观看视角。译文不强行整理成一种确定布局，以免消除原文的含混与张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“仿佛”“如同”保留异象中的双重比拟；“宝座之中和宝座周围”有意不作空间上的解释性改写；“布满了眼睛”比“满有眼睛”更符合当代汉语，同时保留原文的视觉冲击。
