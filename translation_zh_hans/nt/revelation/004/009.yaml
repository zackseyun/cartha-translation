  text: καὶ ὅταν ⸀δώσουσιν τὰ ζῷα δόξαν καὶ τιμὴν καὶ εὐχαριστίαν τῷ καθημένῳ ἐπὶ ⸂τῷ θρόνῳ⸃, τῷ ζῶντι εἰς τοὺς αἰῶνας τῶν αἰώνων,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/009.yaml
  text: And whenever the living creatures give glory and honor and thanksgiving to the one seated on the throne[a], to the one who lives forever and ever,
translation:
  language: zh_hans
  text: 每逢这些活物把荣耀、尊贵和感谢归给那位坐在宝座上、永永远远活着[a]的，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“直到万世万代。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: 每逢
  rationale: 与带将来指向的动词连用，表达不定而反复发生的时间关系；“每逢”比单纯的“当……时”更清楚地呈现宝座异象中一再发生的行动。
- source_word: δώσουσιν
  choice: 献给
  rationale: δίδωμι的基本义是“给”；这里宾语为“荣耀、尊贵和感谢”，受事者又是坐宝座者，用“献给”符合现代汉语敬拜语境，同时仍保留“给予”的基本关系。
- source_word: τὰ ζῷα
  choice: 这些活物
  rationale: ζῷα在本章指前文已经出现的宝座周围活物，并非普通动物。“这些”自然承接上文；本节没有重述数目，因此不增添“四个”。
- source_word: δόξαν
  choice: 荣耀
  rationale: δόξα在颂赞语境中直接对应“荣耀”；不译作“赞美”，以免把所归给对方的尊荣转化为敬拜者的行动。
- source_word: τιμήν
  choice: 尊贵
  rationale: τιμή表示所给予的尊荣或敬重。“尊贵”与“荣耀”并列自然，也适合庄重的敬拜语域。
- source_word: εὐχαριστίαν
  choice: 感谢
  rationale: 此词表示表达感谢的行为。“感谢”是现代汉语中自然清楚的名词性表达；“感恩”也可行，但较容易同时指内在心态。
- source_word: τῷ καθημένῳ ἐπὶ τῷ θρόνῳ
  choice: 那位坐在宝座上
  rationale: 保留希腊文以分词称呼宝座上那一位的方式，不擅自补出“神”；“坐在宝座上”清楚而自然地呈现宝座意象。
- source_word: τῷ ζῶντι
  choice: 活……的
  rationale: 将现在分词按动词性结构处理，并与后面的永恒时限连在一起，形成“活到永永远远的”，自然修饰同一位坐宝座者。
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: 永永远远
  rationale: 这是表达无穷持续时间的固定语句。“永永远远”既准确传达其意义，也保有庄重、有节奏的圣经汉语风格；较贴近形式的译法置于脚注。
theological_decisions:
- issue: 不增添经文未明说的神圣称谓，并保留同位结构
  choice: 那位坐在宝座上、活到永永远远的
  alternative: 坐在宝座上、活到永永远远的神
  rationale: 原文用两个带冠词的分词短语指同一位受敬拜者，却没有在本节明确补出“神”。译文让上下文确定其身份，避免加入原文没有的称谓，同时保留宝座与永生这两重描述。
- issue: 保留本节与下一节之间未完结的句法关系
  choice: 句末使用逗号
  alternative: 将本节改写为独立完整句
  rationale: ὅταν引出的时间从句要到下一节才出现主要结果。以逗号收束本节，避免把原文跨节延续的句法误作已经完成的陈述。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“每逢”呈现反复性，“将……献给”保持敬拜场景的自然表达。句末逗号有意保留本节从句延续至下一节的结构。脚注标记紧随其实际解释的“永永远远”，而非放在“宝座”之后。
