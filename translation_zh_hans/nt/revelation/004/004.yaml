id: REV.4.4
reference: Revelation 4:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ κυκλόθεν τοῦ θρόνου ⸀θρόνοι εἴκοσι τέσσαρες, καὶ ἐπὶ τοὺς ⸀θρόνους εἴκοσι τέσσαρας πρεσβυτέρους καθημένους περιβεβλημένους ⸀ἐν ἱματίοις λευκοῖς, καὶ ἐπὶ τὰς κεφαλὰς αὐτῶν στεφάνους χρυσοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/004.yaml
  text: And around the throne were twenty-four thrones[a], and on the thrones were seated twenty-four elders, clothed in white garments, and on their heads were golden crowns.
translation:
  language: zh_hans
  text: 宝座周围有二十四个宝座；这些宝座上坐着二十四位长老，身穿白衣，头戴金冠冕[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“花冠”或“金制的胜利花冠”。这里的希腊词可指因荣誉或胜利而授予的冠，不仅指君王所戴的王冠。
    reason: 保留 στέφανος 的词义范围，并说明它与专指王者冠冕的词并不完全相同。
lexical_decisions:
- source_word: κυκλόθεν
  choice: 周围
  rationale: 表示环绕中心宝座的空间关系；“周围”自然清楚，又保留异象中的布局。
- source_word: θρόνοι
  choice: 宝座
  rationale: 原文与中央的“宝座”使用同一个名词；重复译作“宝座”，保留其君王或审判意象，不弱化为普通“座位”。
- source_word: εἴκοσι τέσσαρες
  choice: 二十四个／二十四位
  rationale: 按现代汉语量词习惯，宝座用“个”，长老用尊称量词“位”。
- source_word: ἐπὶ τοὺς θρόνους
  choice: 这些宝座上
  rationale: 表达在宝座上的位置；加“这些”使现代汉语衔接自然，并明确回指前述二十四个宝座。
- source_word: πρεσβυτέρους
  choice: 长老
  rationale: 这是启示录中一个特定群体的称谓；“长老”既符合上下文，也不把词义缩减为仅指年长男子。
- source_word: καθημένους
  choice: 坐着
  rationale: 以现代汉语的谓语结构自然表达分词所描述的姿态和持续状态。
- source_word: περιβεβλημένους
  choice: 身穿
  rationale: 表达已经穿戴在身的状态；简洁、庄重而不古奥。
- source_word: ἐν ἱματίοις λευκοῖς
  choice: 白衣
  rationale: ἱμάτια泛指衣服或衣裳；“白衣”自然凝练，不擅自具体化为某种款式的长袍。
- source_word: στεφάνους
  choice: 冠冕
  rationale: στέφανος可指表示荣誉或胜利的冠；正文用“冠冕”符合庄严语境，同时以脚注保留“花冠／胜利冠”的词义可能。
- source_word: χρυσοῦς
  choice: 金
  rationale: “金冠冕”是自然简洁的现代汉语表达，准确表示冠冕由金制成或呈金质。
theological_decisions:
- issue: 周围二十四个 θρόνοι 的性质
  choice: 译作“宝座”，与中央“宝座”保持词语对应。
  alternative: 译作“座位”，以避免让人误以为这些座位与中央宝座具有同等权柄。
  rationale: 希腊文重复使用 θρόνος，翻译应保留这一联系；上下文本身仍清楚地以中央宝座为核心，因此无须通过弱化词义来建立区别。
- issue: 二十四位长老的身份
  choice: 仅译作“长老”，不增加身份说明。
  alternative: 解释为教会的代表、天使性存在，或以色列与使徒的代表。
  rationale: 本节只称他们为 πρεσβύτεροι，并未解释其身份；保留称谓可避免把某种神学解释写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。重复“宝座”以呈现原文的词语联系；用分号划分场景布局与人物描写，使长句清晰流畅。
