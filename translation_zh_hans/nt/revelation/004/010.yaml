  text: πεσοῦνται οἱ εἴκοσι τέσσαρες πρεσβύτεροι ἐνώπιον τοῦ καθημένου ἐπὶ τοῦ θρόνου, καὶ προσκυνήσουσιν τῷ ζῶντι εἰς τοὺς αἰῶνας τῶν αἰώνων, καὶ βαλοῦσιν τοὺς στεφάνους αὐτῶν ἐνώπιον τοῦ θρόνου, λέγοντες·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/010.yaml
  text: 'the twenty-four elders will fall down before the one seated on the throne[a], and they will worship the one who lives forever and ever, and they will cast their crowns before the throne[b], saying:'
translation:
  language: zh_hans
  text: 二十四位长老将俯伏在坐在宝座上的那一位面前，敬拜那位永永远远活着的，并将自己的冠冕投在宝座前[b]，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “冠冕”所译的希腊词也可指作为尊荣或得胜标志而授予的花冠。
    reason: lexical_alternative
lexical_decisions:
- source_word: πεσοῦνται
  choice: 就俯伏
  rationale: 在敬拜语境中既表达身体伏下的动作，也传达敬畏之意；“就”自然承接上文反复发生的天上敬拜场景，并体现希腊语将来时在该异象叙述中的作用。
- source_word: οἱ εἴκοσι τέσσαρες πρεσβύτεροι
  choice: 二十四位长老
  rationale: “长老”是启示录天上议会语境中自然、通行且不带过强技术色彩的译法。
- source_word: τοῦ καθημένου ἐπὶ τοῦ θρόνου
  choice: 坐宝座的那一位
  rationale: 保留原文以描述性称谓指称宝座上那位的方式，不在正文中直接补明为“父神”。
- source_word: προσκυνήσουσιν
  choice: 敬拜
  rationale: 此处对象是永活者，语境明确是宗教敬拜；“敬拜”比单纯的“下拜”更充分表达该动词在此处的含义。
- source_word: τῷ ζῶντι εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: 那位活到永永远远的
  rationale: 用自然庄重的现代汉语表达持续存活与无尽久远，同时保留描述性称谓。
- source_word: βαλοῦσιν
  choice: 投
  rationale: 保留 βάλλω 所表达的鲜明动作感，较“放下”更贴近原文，又比“扔”庄重。
- source_word: τοὺς στεφάνους αὐτῶν
  choice: 自己的冠冕
  rationale: στέφανος 可指作为尊荣或得胜标志的花冠、桂冠；在异象和王权语境中，“冠冕”自然且庄重，其历史语义以脚注说明。
- source_word: λέγοντες
  choice: 说
  rationale: 自然引出下一节的直接引语，符合现代汉语叙述习惯。
theological_decisions:
- issue: 坐宝座者与永活者的身份
  choice: 沿用原文的描述性称谓“坐宝座的那一位”和“那位活到永永远远的”
  alternative: 在译文中明确译作“父神”或“神”
  rationale: 上下文清楚指向坐宝座的神，但本节原文本身没有直接补出身份名称；保留其措辞可避免在翻译中加入超出本节明说内容的教义说明。
- issue: προσκυνέω 所表示的行为
  choice: 译为“敬拜”
  alternative: 译为“下拜”或“俯伏致敬”
  rationale: 本节已另用 πεσοῦνται 表达俯伏的身体动作，而 προσκυνήσουσιν 的神圣对象与上下文支持“敬拜”，也避免把两个不同动词扁平化为同一动作。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句法保留原文连续动作的推进：“俯伏—敬拜—投下冠冕—说”。英文咨询层的脚注[a]位置与内容明显不相符：其内容解释“永永远远”，但标记却置于“宝座”之后。中文正文直接采用该惯用表达，故不设[a]；保留与冠冕词义直接相关的[b]。
