  text: Καὶ ἄλλος ἄγγελος ἐξῆλθεν ἐκ τοῦ ναοῦ τοῦ ἐν τῷ οὐρανῷ, ἔχων καὶ αὐτὸς δρέπανον ὀξύ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/017.yaml
  text: And another angel came out from the temple in heaven[a], also having a sharp sickle.
translation:
  language: zh_hans
  text: 又有一位天使从天上的圣殿[a]里出来；他也拿着一把锋利的镰刀。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“天上的圣所”。希腊语ναός可较具体地指圣殿的内殿或圣所。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλος ἄγγελος
  choice: 又有一位天使
  rationale: ἄλλος表示同类中的“另一位”；结合异象中接连出现的天使，用“又有一位天使”自然呈现叙事次序。
- source_word: ἐξῆλθεν
  choice: 出来
  rationale: ἐξέρχομαι表示从内部向外移动；“从……里出来”准确而符合现代汉语习惯。
- source_word: ναοῦ
  choice: 殿
  rationale: ναός通常特指圣殿或其内殿，而非整个殿宇范围；“殿”简洁庄重，并以脚注保留“圣所”这一较具体的译法。
- source_word: τοῦ ἐν τῷ οὐρανῷ
  choice: 天上的
  rationale: 该限定语说明殿位于天上；“天上的殿”简明自然，不扩展为对其性质的解释。
- source_word: ἔχων καὶ αὐτὸς
  choice: 他也拿着
  rationale: καὶ αὐτός强调这位天使也同样持有镰刀；“他也拿着”既表达比较意味，也将希腊语分词结构自然转换为汉语分句。
- source_word: δρέπανον
  choice: 镰刀
  rationale: δρέπανον指收割用的弯刃工具；“镰刀”是清楚、标准的现代汉语对应词。
- source_word: ὀξύ
  choice: 锋利的
  rationale: ὀξύ描述镰刀刃口锐利；“锋利的”准确保留鲜明意象。
theological_decisions:
- issue: 天上之殿的意象性质
  choice: 正文直译为“天上的殿”，不作解释性扩展。
  alternative: 译作“天上的圣所”，以突出ναός可能特指内殿；或意译为象征性的天上居所。
  rationale: 经文以启示文学的异象呈现天上的殿。译文保留这一原有意象，不判定它是建筑性的、象征性的还是礼仪性的，从而避免加入特定神学体系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“又有一位”衔接异象中连续出现的天使；“他也拿着”自然表达καὶ αὐτός的强调。脚注标记[a]已置于正文对应词后。
