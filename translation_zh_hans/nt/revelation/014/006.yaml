id: REV.14.6
reference: Revelation 14:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ εἶδον ⸀ἄλλον ἄγγελον πετόμενον ἐν μεσουρανήματι, ἔχοντα εὐαγγέλιον αἰώνιον εὐαγγελίσαι ⸀ἐπὶ τοὺς καθημένους ἐπὶ τῆς γῆς καὶ ἐπὶ πᾶν ἔθνος καὶ φυλὴν καὶ γλῶσσαν καὶ λαόν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/006.yaml
  text: And I saw another angel flying in midheaven[a], having an eternal gospel to proclaim to those who dwell on the earth, and to every nation and tribe and language and people[b],
translation:
  language: zh_hans
  text: 我又看见另一位天使飞翔在中天[a]，带着永恒的福音，要向住在地上的人[b]宣告，也向每一个邦国、支派、语言和民族宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “中天”也可译作“天空中央”或“高空”；希腊语在这里使用了启示文学中一个独特的表达。
    reason: lexical_alternative
  - marker: b
    text: “住在地上的人”直译为“坐在地上的人”；在《启示录》中，这一表达常用来指地上的居民。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλον ἄγγελον
  choice: 另一位天使
  rationale: ἄλλος表示叙事中“另一位”；在《启示录》的异象语境里，ἄγγελος指天上的天使，而非一般使者。
- source_word: πετόμενον
  choice: 飞
  rationale: 现在分词描写天使正在飞行；汉语用“飞在”自然简洁。
- source_word: ἐν μεσουρανήματι
  choice: 在中天
  rationale: μεσουράνημα是启示文学中独特的空间用语，指天空中央或高空；“中天”保留其意象，并以脚注说明其他可能表达。
- source_word: ἔχοντα
  choice: 带着
  rationale: ἔχω本义为“有、持有”。此处“带着”比生硬的“有着”更符合汉语，也不限定天使是用手拿着。
- source_word: εὐαγγέλιον αἰώνιον
  choice: 一个永恒的福音
  rationale: 保留无冠词短语的不定性，不擅自译成“那永恒的福音”；“福音”保存该词在基督教经文中的既有含义和互文联系。
- source_word: εὐαγγελίσαι
  choice: 要……宣告
  rationale: 不定式表达目的；“宣告”避免把同根词机械重复为“传福音”，同时仍由前面的“福音”承载好消息的含义。
- source_word: ἐπὶ τοὺς καθημένους ἐπὶ τῆς γῆς
  choice: 向住在地上的人
  rationale: καθημένους字面为“坐着的人”，但在《启示录》中常作为地上居民的惯用表达；正文采用自然汉语，脚注保留字面信息。
- source_word: πᾶν ἔθνος καὶ φυλὴν καὶ γλῶσσαν καὶ λαόν
  choice: 各邦国、各支派、说各种语言的人和各民族
  rationale: 保留四重并列及普世范围。γλῶσσα在这里是按语言划分的人群，译成“说各种语言的人”比单独的“各语言”更自然，并与其余人群类别协调。
theological_decisions:
- issue: εὐαγγέλιον αἰώνιον应采用传统经文术语还是一般化表达
  choice: 一个永恒的福音
  alternative: 永远的好消息；那永恒的福音
  rationale: “福音”保留原词的经文与神学回响，但不添加其具体内容；“一个”反映希腊语无冠词形式，而不把不定性绝对化，相关可能性在翻译中不作教义性裁定。
- issue: 如何处理“坐在地上的人”这一启示文学惯用语
  choice: 住在地上的人
  alternative: 坐在地上的人；生活在地上的人
  rationale: 正文表达其语境中的居民含义，避免现代读者误解为身体姿势；脚注注明字面形式，从而保留原文意象及其潜在张力。
- issue: 两个ἐπί短语之间的关系
  choice: “也向”并列承接
  alternative: 将第二项解释为第一项的同位展开
  rationale: 原文以καί连接，既可读作并列，也可理解为后项具体展开前项。正文保留并列形式，不用破折号或“就是”等表达强行消除这种句法张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式尽量贴近希腊文的叙事推进和并列结构；“各邦国、各支派、说各种语言的人和各民族”保持异象宣告的累积节奏。所有脚注标记均已在正文中出现。
