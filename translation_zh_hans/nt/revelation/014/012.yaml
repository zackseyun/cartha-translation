id: REV.14.12
reference: Revelation 14:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ὧδε ἡ ὑπομονὴ τῶν ἁγίων ἐστίν, οἱ τηροῦντες τὰς ἐντολὰς τοῦ θεοῦ καὶ τὴν πίστιν Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/012.yaml
  text: Here is the endurance of the saints[a], those who keep the commandments of God and the faith of Jesus.
translation:
  language: zh_hans
  text: 圣徒的忍耐就在这里，他们持守上帝的诫命和耶稣的信[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“对耶稣的信”；另一种理解是“耶稣的忠信”。希腊语原文在这里有歧义。
    reason: alternative_reading
lexical_decisions:
- source_word: Ὧδε
  choice: 就在这里
  rationale: 保留指示副词指向当前所述情形的修辞作用；“就在这里”在现代汉语中自然，并带有强调意味。
- source_word: ὑπομονὴ
  choice: 忍耐
  rationale: 指人在患难和考验中坚定持守；“忍耐”简洁、庄重，也符合汉语圣经语境，未额外加入“耐心”等解释。
- source_word: ἁγίων
  choice: 圣徒
  rationale: 这是新约对属上帝之圣洁群体的常用称呼；“圣徒”通行且易于识别。
- source_word: τηροῦντες
  choice: 持守
  rationale: 该分词同时支配“诫命”和“信”；“持守”既可表达遵守诫命，也可表达坚定守住所信，较“遵守”更能自然兼顾两个宾语。
- source_word: ἐντολὰς
  choice: 诫命
  rationale: 指上帝所颁布的命令；“诫命”保留原词的分量和经文语感。
- source_word: πίστιν
  choice: 信
  rationale: 保留 πίστις 可指信、信仰或忠信的语义空间；不在正文中预先判定它在本处专指人的信心还是耶稣的忠信。
- source_word: Ἰησοῦ
  choice: 耶稣之
  rationale: 用“耶稣之信”贴近希腊语属格结构，并以脚注说明其可能的关系，避免正文静默地选定“信耶稣”或“耶稣的忠信”。
theological_decisions:
- issue: τὴν πίστιν Ἰησοῦ 的含义
  choice: 耶稣之信
  alternative: 对耶稣的信；耶稣的忠信
  rationale: 希腊语属格存在真实歧义，既可理解为以耶稣为对象的信，也可理解为耶稣所表现的信或忠信。正文采用简洁而贴近结构的表达，脚注列明主要解释，不替读者消除神学张力。
translation_notes:
  register: 采用现代、庄重而简洁的普通话。“耶稣之信”略带书面色彩，但比“耶稣的信”更凝练，也能保留原文属格的开放性；脚注为普通读者解释其歧义。正文以逗号保留“圣徒”与后续分词短语的同位关系，不改成带较强解释性的冒号结构。
