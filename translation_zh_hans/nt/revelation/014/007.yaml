id: REV.14.7
reference: Revelation 14:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: λέγων ἐν φωνῇ μεγάλῃ· Φοβήθητε τὸν ⸀θεὸν καὶ δότε αὐτῷ δόξαν, ὅτι ἦλθεν ἡ ὥρα τῆς κρίσεως αὐτοῦ, καὶ προσκυνήσατε ⸂τῷ ποιήσαντι⸃ τὸν οὐρανὸν καὶ τὴν γῆν ⸀καὶ θάλασσαν καὶ πηγὰς ὑδάτων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/007.yaml
  text: saying with a loud voice[a], “Fear God and give him glory, because the hour of his judgment has come[b], and worship the one who made heaven and earth and sea and springs of waters.”
translation:
  language: zh_hans
  text: 他大声说：“要敬畏上帝[a]，把荣耀归给他，因为他审判的时刻已经到了。要敬拜那创造天、地、海和众水泉源[b]的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“要惧怕上帝。”希腊语动词既可表示敬畏，也可表示面对审判时的惧怕。
    reason: lexical_alternative
  - marker: b
    text: 希腊语直译为“众水的泉源”。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων ἐν φωνῇ μεγάλῃ
  choice: 他大声说
  rationale: 以自然的现代汉语表达分词及介词短语，并保留其与上文那位天使的衔接和“大声”宣告的力度。
- source_word: Φοβήθητε τὸν θεὸν
  choice: 要敬畏上帝
  rationale: “敬畏”在现代汉语圣经语体中兼含崇敬与面对审判时的惧意，不把原文限定为单纯尊敬或恐慌。
- source_word: δότε αὐτῷ δόξαν
  choice: 把荣耀归给他
  rationale: 这是自然且庄重的汉语表达，保留 δόξα 的“荣耀”含义，并清楚传达归荣耀于上帝的命令。
- source_word: ὅτι ἦλθεν ἡ ὥρα τῆς κρίσεως αὐτοῦ
  choice: 因为他审判的时刻已经到了
  rationale: “因为”表达 ὅτι 的因果关系；“时刻”保留 ὥρα 的末世紧迫感。“他审判”自然表达该属格可指由上帝施行的审判。
- source_word: προσκυνήσατε τῷ ποιήσαντι
  choice: 要敬拜那创造……的
  rationale: “敬拜”符合《启示录》中 προσκυνέω 的宗教语境；“那创造……的”保留实词化分词的动作性。
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν καὶ θάλασσαν καὶ πηγὰς ὑδάτων
  choice: 天、地、海和众水泉源
  rationale: 保留创造清单及其经文回响；“众水泉源”兼顾 πηγὰς 与 ὑδάτων 的复数意味，同时保持凝练庄重。
theological_decisions:
- issue: Φοβήθητε 所表达之命令的性质
  choice: 敬畏上帝
  alternative: 惧怕上帝／尊崇上帝
  rationale: 审判、归荣耀和敬拜的语境使该词同时带有崇敬与惧意。“敬畏”保留这种张力，不将其弱化为尊重，也不限定为惊恐。
- issue: τῆς κρίσεως αὐτοῦ 中属格的关系
  choice: 他审判的时刻
  alternative: 对他的审判之时／属于他的审判之时
  rationale: 在上下文中，上帝是创造者和审判者；此译法自然地表达由他施行的审判，同时不增添审判方式或对象。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“敬畏”“荣耀”“敬拜”等保留经文的神学分量；句式简洁有宣告感。脚注标记均置于正文相应词语之后。
