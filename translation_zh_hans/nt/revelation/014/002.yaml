  text: καὶ ἤκουσα φωνὴν ἐκ τοῦ οὐρανοῦ ὡς φωνὴν ὑδάτων πολλῶν καὶ ὡς φωνὴν βροντῆς μεγάλης, καὶ ἡ φωνὴ ἣν ἤκουσα ὡς κιθαρῳδῶν κιθαριζόντων ἐν ταῖς κιθάραις αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/002.yaml
  text: And I heard a sound from heaven like the sound of many waters and like the sound of loud thunder[c][b][a], and the sound that I heard was like harpists playing on their harps.
translation:
  language: zh_hans
  text: 我听见有声音[a]从天上传来，好像众水的声音[b]，又像响亮的雷声；我所听见的那声音，又好像琴师弹奏自己的琴[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文词也可指“人声”或“说话声”；本节三次出现的“声音”均为同一个希腊词。
    reason: lexical_alternative
  - marker: b
    text: “众水”是圣经中形容浩大、压倒性声响的意象；参以西结书43:2。
    reason: cross_reference
  - marker: c
    text: 这里的“琴”指古代一种拨弦乐器，形制更接近里拉琴；传统上常译作“琴”或“竖琴”。
    reason: cultural_note
lexical_decisions:
- source_word: φωνή
  choice: 声音
  rationale: 本节三次出现该词，所指听觉现象依次与众水、巨雷和乐器演奏相比。“声音”在现代汉语中既可指一般声响，也可指人声，既贴合这里的声学语境，又保留原词可能具有的歧义。
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: 从天上传来
  rationale: οὐρανός在《启示录》的语境中通常指天上的领域，而不只是物理天空；加上“传来”使汉语表达自然，并准确体现声音的来源。
- source_word: ὡς
  choice: 好像
  rationale: 这里连续引出明喻；“好像”清楚、自然地表达比较关系。
- source_word: ὑδάτων πολλῶν
  choice: 众水
  rationale: 直译并保留圣经中广大水声所形成的宏大、压倒性意象及其经文互文联系。
- source_word: βροντῆς μεγάλης
  choice: 巨雷
  rationale: μέγας在这里表达雷声的强度和规模；“巨雷”简洁而有力度，又避免增添原文未明说的效果。
- source_word: κιθαρῳδῶν
  choice: 琴师
  rationale: 该词指与κιθάρα相关的演奏者或弹唱者；下接分词明确说明其正在弹奏，因此“琴师”简明自然，不额外加入歌唱之意。
- source_word: κιθαριζόντων
  choice: 弹奏
  rationale: 明确表达演奏弦乐器的动作，符合现代汉语习惯，也不加入“拨弄”等原文未强调的细节。
- source_word: ἐν ταῖς κιθάραις αὐτῶν
  choice: 自己的琴
  rationale: 介词短语说明他们用所属的κιθάρα演奏；汉语“弹奏自己的琴”自然简洁。“琴”沿用《启示录》中易识别的传统译法，具体器物差异另以脚注说明。
theological_decisions:
- issue: 天上这一听觉现象的性质
  choice: 三处φωνή均译为“声音”
  alternative: 三处均译为“嗓音”或“说话声”，或按不同位置混合译法
  rationale: 上下文把它与众水、雷和乐器声相比，并未明说是一位人物在说话。“声音”避免擅自设定说话者，同时在汉语中仍可涵盖人声，从而保留原文的歧义和张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留“众水”的圣经意象，以“巨雷”传达强度；用分号呈现原文从宏大自然声响转向琴师演奏声的结构。所有脚注标记均置于相应词语之后。
