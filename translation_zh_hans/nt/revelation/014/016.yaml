  text: καὶ ἔβαλεν ὁ καθήμενος ἐπὶ ⸂τῆς νεφέλης⸃ τὸ δρέπανον αὐτοῦ ἐπὶ τὴν γῆν, καὶ ἐθερίσθη ἡ γῆ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/016.yaml
  text: And the one seated on the cloud cast his sickle upon the earth[c][b][a], and the earth was harvested.
translation:
  language: zh_hans
  text: 于是，那位坐在云上的人[c]把镰刀挥向地上[a]，地就被收割了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把镰刀投向地上。”希腊文动词的字面意思是“投、掷”，但在这里的收割场景中，是指挥动镰刀开始收割。
    reason: lexical_alternative
  - marker: b
    text: 或译：“地就被刈割了。”
    reason: lexical_alternative
  - marker: c
    text: 根据前文，这位坐在云上的通常被认作人子；不过本节本身只称他为“那位坐在云上的”。
    reason: alternative_reading
lexical_decisions:
- source_word: ἔβαλεν
  choice: 挥向
  rationale: βάλλω通常有“投、掷”之意；与“镰刀”搭配并处于收割场景中，译作“挥向”能自然表达使镰刀开始收割的动作，同时保留明确的方向感。
- source_word: ὁ καθήμενος ἐπὶ τῆς νεφέλης
  choice: 那位坐在云上的
  rationale: 按名词化分词直译为描述性称谓，既承接上文特指的云，也不在本节中直接断定这位的身份。
- source_word: δρέπανον
  choice: 镰刀
  rationale: 这是现代汉语中清楚、常用的收割工具名称，也保留本段的农业及审判意象。
- source_word: ἐπὶ τὴν γῆν
  choice: 向地上
  rationale: ἐπί加宾格在这里表示动作所朝向的对象；“向地上”适合镰刀挥出以收割的图景。
- source_word: ἐθερίσθη
  choice: 被收割了
  rationale: 保留θερίζω不定过去时被动语态的结果性表达；“收割”比“收刈”更符合现代普通话。
- source_word: ἡ γῆ
  choice: 地
  rationale: 在启示录的宇宙性语境中指大地；汉语重复“地”可保留希腊文的呼应，同时比两次使用“地球”更自然。
theological_decisions:
- issue: 坐在云上者的身份
  choice: 正文只译作“那位坐在云上的”，不明说其身份
  alternative: 根据上一节将其明确译作“人子”或“弥赛亚”；或解释为执行命令的天使
  rationale: 本节希腊文本本身只用描述性分词称呼这位。如此翻译既保留与上文的联系，也不把有争议的身份判断写入正文。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“于是”承接叙事；“挥向”避免生硬的字面表达，又以脚注保留“投、掷”的词义可能。脚注标记均放在其所说明的语句之后。
