  text: καὶ ἐπατήθη ἡ ληνὸς ἔξωθεν τῆς πόλεως, καὶ ἐξῆλθεν αἷμα ἐκ τῆς ληνοῦ ἄχρι τῶν χαλινῶν τῶν ἵππων ἀπὸ σταδίων χιλίων ἑξακοσίων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/020.yaml
  text: And the winepress was trodden outside the city[b][a], and blood came out from the winepress up to the horses’ bridles for one thousand six hundred stadia.
translation:
  language: zh_hans
  text: 酒榨在城外被踩踏；血从酒榨中流出[b]，高达马的嚼子，延伸达一千六百斯他丢[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “斯他丢”是古代长度单位；一千六百斯他丢约为296公里。
    reason: cultural_note
  - marker: b
    text: 或译：“血从酒榨中出来。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπατήθη
  choice: 被踩踏
  rationale: 保留πατέω被动式的字面动作，也维持人用脚踩压酒榨的具体意象；比笼统的“受压榨”更贴近原文。
- source_word: ληνός / ληνοῦ
  choice: 酒榨
  rationale: 这是酿酒时踩压葡萄的设施；“酒榨”简洁地保留收割与审判的启示性意象。
- source_word: ἔξωθεν τῆς πόλεως
  choice: 在城外
  rationale: 直接、自然地表达原文的空间位置，不增添原文没有指明的城市名称。
- source_word: ἐξῆλθεν αἷμα
  choice: 血……流出
  rationale: ἐξέρχομαι本义为“出来、出去”；在血液语境中译作“流出”符合现代汉语，同时不改变其方向和来源。
- source_word: ἄχρι τῶν χαλινῶν τῶν ἵππων
  choice: 深及马的嚼环
  rationale: ἄχρι表示达到的界限。“深及”自然呈现液体达到马嚼环高度的骇人画面；“嚼环”指马具中位于马口附近、与缰绳相连的部分。
- source_word: ἀπὸ σταδίων χιλίων ἑξακοσίων
  choice: 绵延一千六百斯他丢
  rationale: 这里的ἀπό与距离数量连用，表达延伸的距离；保留古代单位“斯他丢”，并在脚注提供约合的现代距离。
theological_decisions:
- issue: 是否把血、马的嚼环和一千六百斯他丢解释性地改写为压倒性的审判象征
  choice: 保留全部具体而强烈的启示文学画面
  alternative: 释义为审判极其广大或彻底
  rationale: 原文用具象且夸张有力的图景传达审判；翻译不应预先限定其象征方式或削弱其张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。分号对应原文两个并列分句；“深及”和“绵延”使高度与距离两个范围在汉语中清楚自然，同时保留原文宏大而骇人的意象。
