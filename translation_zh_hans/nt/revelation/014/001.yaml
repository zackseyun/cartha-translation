id: REV.14.1
reference: Revelation 14:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ εἶδον, καὶ ἰδοὺ τὸ ἀρνίον ⸀ἑστὸς ἐπὶ τὸ ὄρος Σιών, καὶ μετ’ ⸀αὐτοῦ ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες ἔχουσαι τὸ ὄνομα αὐτοῦ καὶ τὸ ὄνομα τοῦ πατρὸς αὐτοῦ γεγραμμένον ἐπὶ τῶν μετώπων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/001.yaml
  text: Then I looked[a], and behold, the Lamb was standing on Mount Zion, and with him were one hundred forty-four thousand who had his name and his Father's name written on their foreheads.
translation:
  language: zh_hans
  text: 我又观看，看哪，羔羊站在锡安山上；同他在一起的有十四万四千人。他们的额上写着羔羊的名和他父亲的名。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本只作：“他们的额上写着他父亲的名。”
    reason: textual_variant
lexical_decisions:
- source_word: Καὶ εἶδον
  choice: 我又观看
  rationale: καί推动异象叙事继续发展，εἶδον表示约翰所见；“我又观看”既自然，也保留异象接续的语气。
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留启示文学中引人注意的指示和强调作用；“看哪”庄重而仍为现代读者所理解。
- source_word: τὸ ἀρνίον
  choice: 羔羊
  rationale: 这是《启示录》中指向基督的固定称号；不增添“献祭的”等原文未明说的解释。
- source_word: ἑστὸς
  choice: 站在
  rationale: 该完成时分词强调已经站立并保持站立的状态；汉语“站在”自然地表达这一状态。
- source_word: ἐπὶ τὸ ὄρος Σιών
  choice: 在锡安山上
  rationale: 采用现代汉语通行地名“锡安山”，准确表达所在位置。
- source_word: μετ’ αὐτοῦ
  choice: 同他在一起的有
  rationale: 补出汉语句法所需的谓语，使随后的人数短语自然成为主体，同时保留与羔羊同在的关系。
- source_word: ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες
  choice: 十四万四千人
  rationale: 按现代汉语数字习惯准确表达144,000，并补“人”明确所指。
- source_word: ἔχουσαι
  choice: 他们的……写着
  rationale: 将分词结构转换为独立句，清楚说明这十四万四千人具有额上所写的名字。
- source_word: τὸ ὄνομα αὐτοῦ καὶ τὸ ὄνομα τοῦ πατρὸς αὐτοῦ
  choice: 羔羊的名和他父的名
  rationale: 明确首个“他”指羔羊，同时保留两个并列的名字及羔羊与父之间的区别，不将两者解释为同一个名。
- source_word: γεγραμμένον ἐπὶ τῶν μετώπων αὐτῶν
  choice: 他们的额上写着
  rationale: 自然表达名字已经写在额上的结果状态，并保留与《启示录》其他额上标记意象的对应。
theological_decisions:
- issue: τὸ ἀρνίον的身份
  choice: 译作称号“羔羊”，不作解释性扩写
  alternative: 献祭的羔羊
  rationale: 上下文表明该称号指基督，但本节没有加入“献祭的”等修饰，译文不应把隐含神学解释写入正文。
- issue: 两个名字之间的关系
  choice: 译作“羔羊的名和他父的名”
  alternative: 羔羊的名，也就是他父的名
  rationale: 希腊文以καί并列两个宾语，并未明确表示同位关系；译文保留二者的区别及紧密关联。
- issue: 额上所写之名的文本异文
  choice: 正文依SBLGNT保留“羔羊的名和他父的名”
  alternative: 只保留“他父的名”
  rationale: 所给SBLGNT正文包含两个名字；部分抄本省略第一个名字，这一实质性异文在脚注中说明。
translation_notes:
  register: 采用现代、庄重而清楚的标准普通话。“看哪”保留启示文学的高昂语体；其余句法尽量自然，避免过度古雅。脚注标记置于相关整句之后。
