source:
  edition: SBLGNT
  text: καὶ ἄλλος ⸀ἄγγελος ἐκ τοῦ θυσιαστηρίου, ⸀ὁ ἔχων ἐξουσίαν ἐπὶ τοῦ πυρός, καὶ ἐφώνησεν ⸀φωνῇ μεγάλῃ τῷ ἔχοντι τὸ δρέπανον τὸ ὀξὺ λέγων· Πέμψον σου τὸ δρέπανον τὸ ὀξὺ καὶ τρύγησον τοὺς βότρυας τῆς ἀμπέλου τῆς γῆς, ὅτι ἤκμασαν αἱ σταφυλαὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/018.yaml
  text: And another angel came out from the altar[a], the one who has authority over the fire, and he called out with a loud voice to the one who had the sharp sickle, saying, “Send out your sharp sickle and gather the clusters of the vine of the earth[b], because its grapes are ripe.”
translation:
  language: zh_hans
  text: 又有一位天使从祭坛出来，就是那有权掌管火的。他大声向那拿着锋利镰刀的喊道：“把你锋利的镰刀伸出去[a]，采收地上葡萄树的葡萄串[b]，因为它的葡萄已经熟了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译：“发出（或差出）你的锋利镰刀”；在收割的语境中，也可译作“把你的锋利镰刀伸出去”。
    reason: lexical_alternative
  - marker: b
    text: “地上的葡萄树”是启示文学的意象；本节没有明确说明它具体所指，但上下文与审判有关。
    reason: cross_reference
lexical_decisions:
- source_word: ἄλλος ἄγγελος
  choice: 又有一位天使
  rationale: “天使”符合《启示录》异象场景中的通常所指；“又有”自然体现ἄλλος的叙事推进。
- source_word: ἐκ τοῦ θυσιαστηρίου
  choice: 从祭坛那里出来
  rationale: 保留θυσιαστήριον“祭坛”的意象，并以现代汉语自然表达其出来的起点；原文未明说是从祭坛内部出来。
- source_word: ὁ ἔχων ἐξουσίαν ἐπὶ τοῦ πυρός
  choice: 就是那有权掌管火的
  rationale: 将带冠词的分词短语作为对该天使的说明；“有权掌管”表达ἐξουσία ἐπί所指的权柄或管辖。
- source_word: ἐφώνησεν φωνῇ μεγάλῃ
  choice: 大声……喊道
  rationale: 以自然汉语传达同源动词与名词构成的强调表达，保留声音强烈的语气。
- source_word: τῷ ἔχοντι τὸ δρέπανον τὸ ὀξὺ
  choice: 向那拿着锋利镰刀的
  rationale: 准确体现与格所标示的受话者，并保留“锋利”这一重复出现的描述。
- source_word: Πέμψον σου τὸ δρέπανον τὸ ὀξὺ
  choice: 挥动你锋利的镰刀
  rationale: πέμπω字面为“差出、发出”，但此处宾语是镰刀，在收割语境中“挥动”是清楚自然的动作表达；脚注保留较贴近字面的译法。
- source_word: τρύγησον τοὺς βότρυας
  choice: 收取……果串
  rationale: τρυγάω特指采收葡萄；βότρυς指成串的葡萄。后文已明确提到葡萄，因此译作“果串”可避免累赘。
- source_word: τῆς ἀμπέλου τῆς γῆς
  choice: 地上葡萄树的
  rationale: “地上的葡萄树”在中文中自然，并保留原文属格结构可能表达的启示文学意象，不在正文中直接解释其所指。
- source_word: ἤκμασαν αἱ σταφυλαὶ αὐτῆς
  choice: 树上的葡萄已经熟了
  rationale: ἀκμάζω表示达到成熟阶段；“已经熟了”自然传达完成时所呈现的成熟状态。“树上的”明确中文代词所指而不增添解释。
theological_decisions:
- issue: τῆς ἀμπέλου τῆς γῆς的启示文学隐喻
  choice: 正文保留“地上的葡萄树”这一意象
  alternative: 直接译为“地上的恶人”或“地上的人类”
  rationale: 上下文指向审判，但本节本身以葡萄树和采收的图像表达，并未直接说明其所指；保留隐喻可避免把特定解释写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。正文维持异象叙事的紧迫感，并保留葡萄收成所承载的审判意象；脚注标记[a]、[b]均已置于正文相应位置。
