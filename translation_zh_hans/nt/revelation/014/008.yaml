id: REV.14.8
reference: Revelation 14:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ ἄλλος ⸂δεύτερος ἄγγελος⸃ ἠκολούθησεν λέγων· Ἔπεσεν, ⸀ἔπεσεν Βαβυλὼν ἡ μεγάλη, ⸀ἣ ἐκ τοῦ οἴνου τοῦ θυμοῦ τῆς πορνείας αὐτῆς πεπότικεν πάντα τὰ ἔθνη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/008.yaml
  text: And another[a], a second angel, followed, saying, “Fallen, fallen is Babylon the great[c][b], she who has made all the nations drink from the wine of the passion of her sexual immorality.”
translation:
  language: zh_hans
  text: 又有另一位天使，就是第二位，接着而来，说：“大巴比伦倾倒了！倾倒了！她使万国都喝了[c]她淫乱[b]的激情之酒[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “激情”也可译作“烈怒”或“狂怒”。希腊词θυμός既可指愤怒、暴怒，也可指强烈的激情。
    reason: lexical_alternative
  - marker: b
    text: 这里巴比伦的“淫乱”很可能是象征说法，涉及她使人败坏、拜偶像和不忠的影响；但原文并未把含义限定为其中任何一种。
    reason: cultural_note
  - marker: c
    text: 也可意译为“灌醉了万国”。希腊原文直译是“使万国都喝了”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλος … δεύτερος ἄγγελος
  choice: 另一位天使，就是第二位
  rationale: 同时保留ἄλλος（“另一位”）和δεύτερος（“第二位”），用“就是”表达同位关系，使现代汉语自然清楚。
- source_word: ἠκολούθησεν
  choice: 随后而来
  rationale: 表达异象中这位天使接续前一位出现的次序，同时避免生硬的“跟随”。
- source_word: λέγων
  choice: 说
  rationale: 汉语用顺承谓语自然表达希腊语分词与主要动词的联系。
- source_word: Ἔπεσεν, ἔπεσεν
  choice: 倒下了！倒下了！
  rationale: 保留动词的重复、完成性宣告及预言式审判语气，并以短句增强原文的冲击力。
- source_word: Βαβυλὼν ἡ μεγάλη
  choice: 大巴比伦
  rationale: 保留专名及“大”的称号性表达，符合简体中文圣经语境中清楚而凝练的说法。
- source_word: ἣ
  choice: 她
  rationale: 巴比伦在原文中被人格化，阴性关系代词在汉语中以“她”明确保留这一形象。
- source_word: ἐκ τοῦ οἴνου
  choice: 喝了……的酒
  rationale: 以汉语自然的饮酒结构表达从酒这一来源取饮的意象，不将其抽象化。
- source_word: τοῦ θυμοῦ
  choice: 狂情
  rationale: θυμός既可指烈怒，也可指强烈激情；“狂情”在此保留淫乱所具有的炽烈、失控和毁坏意味，而不直接限定为神的震怒。其他可能译法列入脚注。
- source_word: τῆς πορνείας αὐτῆς
  choice: 她淫乱
  rationale: “淫乱”可承载字面的性不道德和象征性的偶像崇拜、不忠与败坏影响，避免只译成某一种解释。
- source_word: πεπότικεν
  choice: 使……喝了
  rationale: 保留ποτίζω的使役意义；“了”表达已经发生的行动，而“灌醉”所含的结果性解释留在脚注。
- source_word: πάντα τὰ ἔθνη
  choice: 万国
  rationale: 在启示录的宏观语境中指所有列国与民族；“万国”简洁、庄重，并非专指与犹太人相对的外邦人。
theological_decisions:
- issue: 巴比伦之πορνεία的象征意义
  choice: 正文译作“淫乱”，不直接释为偶像崇拜、政治败坏或属灵不忠。
  alternative: 邪淫；卖淫；偶像崇拜
  rationale: 原文保留了性意象及其象征张力；正文不把这一多层意象缩减为单一神学解释，脚注仅说明其可能的象征范围。
- issue: “淫乱之θυμός”中θυμός的含义
  choice: 正文译作“狂情”。
  alternative: 烈怒；狂怒；激情
  rationale: 该词在语法上与巴比伦的淫乱相连，既可能强调炽烈激情，也可能含暴怒与审判色彩。“狂情”保留强烈、失控的性质，脚注同时列出“烈怒”等可能译法。
- issue: 巴比伦的人格化
  choice: 用“她”指巴比伦。
  alternative: 它；该城
  rationale: 原文以阴性关系代词延续城市如女人的形象；保留人格化有助于承接“淫乱”的象征，不将巴比伦仅处理为地理地点。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“另一位……就是第二位”保留原文看似重复却有意义的编号表达；宣告部分用短促感叹句再现重复的审判语势。正文不采用较古旧的“倾倒了”，也不以解释性词语取代“淫乱”或“使……喝了”。
