    rationale: 原文ἐξηράνθη字面是“干了”，在农业语境中指庄稼已达到收割状态；英文审校定稿为“ripe”，并非“overripe”。“已经熟了”保留可收割的意思而避免额外的“过熟／熟透”强化。
  - severity: low
    issue: “伸出你的镰刀”搭配稍显生硬
    rationale: πέμψον的字面义是“送出／差出”；汉语在收割图像中以“挥动你的镰刀”表达更自然，并与后面的“收割吧”形成连贯动作。
