  source_fidelity: “庄稼已经熟透了”将ἐξηράνθη（“已干了／干透了”）在收割意象中的“成熟可收割”稍作过度强化，容易引出“过熟”的含义；改为“已经熟了”较妥当地保留英语审校轨迹的“ripe”，也不超过原文语义。其余主要成分均忠实：ναός译为“圣所”，命令式及其直接语气得到保留，且未将收割意象解释化为特定神学结论。
  naturalness: 整体庄重、清楚且符合现代标准汉语。“挥动你的镰刀”比“伸出你的镰刀”更自然地表达向镰刀发出动作、继而收割的画面，同时不改变命令关系。
  terminology: “圣所”“天使”“镰刀”“收割”均恰当。“那位”可自然指代坐在云上的者，不预设其身份。
  issues:
