id: REV.14.15
reference: Revelation 14:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἄλλος ἄγγελος ἐξῆλθεν ἐκ τοῦ ναοῦ κράζων ἐν φωνῇ μεγάλῃ τῷ καθημένῳ ἐπὶ τῆς νεφέλης· Πέμψον τὸ δρέπανόν σου καὶ θέρισον, ὅτι ἦλθεν ἡ ὥρα θερίσαι, ὅτι ἐξηράνθη ὁ θερισμὸς τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/015.yaml
  text: And another angel came out from the sanctuary, crying out with a loud voice to the one seated on the cloud, “Send your sickle and reap, because the hour to reap has come, because the harvest of the earth is ripe.”
translation:
  language: zh_hans
  text: 又有一位天使从圣所出来，向坐在云上的那位大声呼喊：“挥动你的镰刀，收割吧！因为收割的时候到了，地上的庄稼已经熟了。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ναός
  choice: 圣所
  rationale: 在《启示录》的天上场景中指圣殿内部的圣所；译作“圣所”比泛称“殿”更准确。
- source_word: Πέμψον τὸ δρέπανόν σου
  choice: 伸出你的镰刀
  rationale: πέμπω本义为“差遣、送出”；与镰刀搭配时，现代汉语用“伸出”能自然表达挥出镰刀开始收割，同时保留命令语气。
- source_word: θέρισον
  choice: 收割吧
  rationale: 采用直接命令式，准确传达希腊文不定过去时命令语气。
- source_word: ἡ ὥρα θερίσαι
  choice: 收割的时候
  rationale: ὥρα在此指指定的时刻；“时候”自然明白，并避免机械地译作“小时”。
- source_word: ἐξηράνθη ὁ θερισμὸς τῆς γῆς
  choice: 地上的庄稼已经熟透了
  rationale: ἐξηράνθη字面为“变干、干透”，用于庄稼表示已成熟至可收割；“熟透”既保留完成状态，也符合现代汉语农业意象。
theological_decisions:
- issue: 收割意象的审判含义
  choice: 不在正文中明说审判或得救，仅保留收割图像
  alternative: 译成“审判的时候到了”
  rationale: 原文使用农业隐喻，具体所指需由上下文判断；正文不应替作者消解其象征张力。
- issue: 天使对坐在云上者使用命令式
  choice: 保留直接呼喊和命令语气
  alternative: 弱化为“请求那位……收割”
  rationale: 希腊文确为命令式；不因对坐在云上者身份的神学理解而改写句法关系。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。句式保持经文的推进次序，并用“那位”清楚标示坐在云上者；“庄稼已经熟透”传达原文“已经干透”的收割语境，不额外加入解释性神学术语。
