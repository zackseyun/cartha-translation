source:
  edition: SBLGNT
  text: οὗτοί εἰσιν οἳ μετὰ γυναικῶν οὐκ ἐμολύνθησαν, παρθένοι γάρ εἰσιν· ⸀οὗτοι οἱ ἀκολουθοῦντες τῷ ἀρνίῳ ὅπου ἂν ⸀ὑπάγῃ· ⸁οὗτοι ἠγοράσθησαν ἀπὸ τῶν ἀνθρώπων ἀπαρχὴ τῷ θεῷ καὶ τῷ ἀρνίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/004.yaml
  text: These are the ones who have not defiled themselves with women[a], for they are virgins. These are the ones who follow the Lamb wherever he goes. These were purchased from among mankind as firstfruits to God and to the Lamb[b],
translation:
  language: zh_hans
  text: 这些人没有因与女人发生关系而玷污自己[a]，因为他们持守童贞。这些人就是羔羊无论往哪里去都跟随他的人。这些人是从人类[b]中买来的，作为献给上帝和羔羊的初熟的果子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的意象也可能表示属灵的纯洁，或未受偶像崇拜的玷污，而不只是对字面上性禁欲的陈述。
    reason: alternative_reading
  - marker: b
    text: “人类”泛指人，不专指男性。“初熟的果子”指收成中首先献给上帝的部分；此处保留了献祭和收成的意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμολύνθησαν
  choice: 未曾……玷污自己
  rationale: 原文是被动形式，表达受玷污或处于污秽状态；中文用“玷污自己”较自然，也保留道德或礼仪污秽的语义色彩。
- source_word: μετὰ γυναικῶν
  choice: 与女人
  rationale: μετά加属格通常表示“与……一起/同……”，γυναικῶν在此宜译为泛指的“女人”，不限定为妻子。
- source_word: παρθένοι
  choice: 童身
  rationale: 原词直接指未有性经历者。鉴于所指群体在语法和上下文中为男性，“童身”比现代汉语中通常偏指女性的“处女”更合适，同时保留具体意象。
- source_word: ἀκολουθοῦντες
  choice: 跟随
  rationale: 现在分词表示持续且具有特征性的行动；“跟随”自然传达此义。
- source_word: ἀρνίῳ
  choice: 羔羊
  rationale: 启示录中这是指向耶稣的称号和意象，应保留其献祭与末世文学色彩。
- source_word: ὅπου ἂν ὑπάγῃ
  choice: 无论往哪里去
  rationale: ὅπου ἄν加虚拟式表达不定范围，即“无论哪里/无论往哪里”。
- source_word: ἠγοράσθησαν
  choice: 买来的
  rationale: 保留ἀγοράζω的购买比喻，不在正文中直接改译为解释性更强的“救赎”。
- source_word: ἀπὸ τῶν ἀνθρώπων
  choice: 从人类中
  rationale: ἄνθρωποι泛指人类，并非专指男性；“从人类中”准确保留其整体范围。
- source_word: ἀπαρχὴ
  choice: 初熟的果子
  rationale: ἀπαρχή指首先收取并献上的部分；此译保留收成和献祭的双重意象，在现代中文中也较易理解。
theological_decisions:
- issue: “未曾与女人玷污自己、因为他们是童身”应按字面表达还是在正文中直接解释为属灵纯洁
  choice: 正文保留具体的性与童身表述
  alternative: 直接译作在属灵上纯洁、未受偶像崇拜玷污
  rationale: 希腊文本采用具体措辞，而启示录意象可能兼具象征意义。翻译不应替读者消解这一张力，故正文按文本形式表达，并以脚注说明象征性解释的可能。
- issue: ἀπαρχή在句中的献呈关系
  choice: 译为“作为初熟的果子献给上帝和羔羊”
  alternative: 仅译“是上帝和羔羊的初熟果子”
  rationale: “献给”显明该词固有的礼仪献呈背景，但不进一步界定这群人与其后收成之间的末世次序。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“童身”避免“处女”在现代汉语中主要指女性所造成的误解；“买来的”保留原文商业—救赎比喻；全节维持启示文学的重复句式。
