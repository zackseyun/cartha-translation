id: REV.14.10
reference: Revelation 14:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ αὐτὸς πίεται ἐκ τοῦ οἴνου τοῦ θυμοῦ τοῦ θεοῦ τοῦ κεκερασμένου ἀκράτου ἐν τῷ ποτηρίῳ τῆς ὀργῆς αὐτοῦ, καὶ βασανισθήσεται ἐν πυρὶ καὶ θείῳ ἐνώπιον ⸂ἀγγέλων ἁγίων⸃ καὶ ἐνώπιον τοῦ ἀρνίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/010.yaml
  text: he also will drink from the wine of God's wrath[a], mixed undiluted in the cup of his anger[b], and he will be tormented with fire and sulfur before the holy angels and before the Lamb.
translation:
  language: zh_hans
  text: 这人也必喝上帝烈怒的酒；这酒是在上帝愤怒的杯中调制的，却没有兑水[a]。他要在圣天使和羔羊面前，在火与硫磺中受折磨。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文把“调制”与“没有兑水”并列。古代的酒通常会兑水；这里强调杯中的酒虽已调好，却丝毫没有稀释，象征上帝的审判以完全的力度临到。
    reason: 解释原文刻意保留的词义张力及其古代饮酒背景。
lexical_decisions:
- source_word: καὶ αὐτὸς
  choice: 这人也
  rationale: 承接上一节所说的个人，并保留代词的强调及καί的附加意味；现代汉语用“这人也”比“他自己也”更自然。
- source_word: πίεται ἐκ τοῦ οἴνου
  choice: 必喝……的酒
  rationale: 未来时译作“必喝”；汉语“喝……的酒”自然表达从这酒中饮用，无须生硬直译ἐκ。
- source_word: τοῦ θυμοῦ τοῦ θεοῦ
  choice: 上帝烈怒的
  rationale: θυμός在审判语境中表示强烈的愤怒；“烈怒”既保留力度，也便于与后面的ὀργή有所区分。
- source_word: τοῦ κεκερασμένου ἀκράτου
  choice: 调制，却没有兑水
  rationale: 同时保留κεράννυμι“调制、调和”和ἄκρατος“未兑水、未稀释”这两个表面张力鲜明的概念，表达审判毫无减弱。
- source_word: ἐν τῷ ποτηρίῳ τῆς ὀργῆς αὐτοῦ
  choice: 在他震怒的杯中
  rationale: 按ἐν直译“在……中”，保留杯的意象；ὀργή译为“震怒”，与θυμός的“烈怒”近义而不完全重合。
- source_word: βασανισθήσεται
  choice: 要……受折磨
  rationale: 保留未来被动意义，明确表示严厉而持续的惩罚性痛苦，不额外界定其时长。
- source_word: ἐν πυρὶ καὶ θείῳ
  choice: 在火与硫磺中
  rationale: ἐν保留为“在……中”；θεῖον在此指硫磺，现代汉语“硫磺”清楚且保留传统审判意象。
- source_word: ἐνώπιον ἀγγέλων ἁγίων καὶ ἐνώπιον τοῦ ἀρνίου
  choice: 在圣天使和羔羊面前
  rationale: “面前”准确表达ἐνώπιον；第二个“面前”在汉语中可合并而不损失两组见证者都在场的意义。
theological_decisions:
- issue: 同一句中θυμός与ὀργή的区分
  choice: 分别译为“烈怒”和“震怒”
  alternative: 两者都译为“愤怒”或“烈怒”
  rationale: 原文紧邻使用两个相关而不同的词。采用两个自然的近义词，既不夸大词义差别，也避免将修辞层次完全抹平。
- issue: τοῦ κεκερασμένου ἀκράτου的内在张力
  choice: 译作“调制，却没有兑水”
  alternative: 意译为“纯烈、毫未稀释”或“以十足浓度倒入”
  rationale: 原文将“经过调制”与“未兑水”并置。正文保留这种真实张力，并用转折使现代读者明白：酒已备好，却没有被水冲淡，象征审判不打折扣。
- issue: 受折磨的时长
  choice: 只译出本节的未来被动陈述，不添加“永远”
  alternative: 根据后文预先译成“永远受折磨”
  rationale: 本节本身只说将受折磨；不把下一节关于烟上腾的表述提前并入，以免超出本节原文。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“上帝”“羔羊”“圣天使”延续启示录常见的圣经语域；“火与硫磺”比古雅或化学化的替代说法更易懂。句子分为两句，以减轻长串属格结构对普通读者造成的负担，同时保持原文意象和逻辑关系。
