  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ ἤκουσα φωνῆς ἐκ τοῦ οὐρανοῦ λεγούσης· Γράψον· Μακάριοι οἱ νεκροὶ οἱ ἐν κυρίῳ ἀποθνῄσκοντες ἀπ’ ἄρτι. ⸂ναί, λέγει⸃ τὸ πνεῦμα, ἵνα ⸀ἀναπαήσονται ἐκ τῶν κόπων αὐτῶν, τὰ ⸀γὰρ ἔργα αὐτῶν ἀκολουθεῖ μετ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/013.yaml
  text: 'And I heard a voice from heaven saying[a], “Write: Blessed are the dead who die in the Lord from now on.” “Yes,” says the Spirit, “so that they may rest from their labors[b], for their deeds follow with them.”'
translation:
  language: zh_hans
  text: 我听见有声音从天上说：“你要写下：从今以后，那些在主里死去的人有福了！”“是的，”圣灵说，“他们得以歇息，脱离自己的劳苦[a]，因为他们的作为也跟随他们[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文这一分句可带目的或结果意味，也可译作“好让他们歇息，脱离自己的劳苦”或“他们将要歇息，脱离自己的劳苦”。
    reason: alternative_reading
  - marker: b
    text: 也可译作“伴随他们”或“随着他们”。原文以“跟随”的动词表达其作为与他们同在的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνῆς ἐκ τοῦ οὐρανοῦ λεγούσης
  choice: 有声音从天上说
  rationale: 按不定形式译作“有声音”，并以“从天上”自然表达声音的来源；“说”保留分词所引出的言语。
- source_word: Γράψον
  choice: 你要写下
  rationale: 保留单数命令语气；“写下”符合现代汉语中吩咐记录话语的表达，且不增添原文没有的宾语。
- source_word: Μακάριοι
  choice: 有福了
  rationale: 沿用汉语圣经祝福宣告的庄重表达，比“快乐”或“幸运”更能涵盖该词在此处的意义。
- source_word: οἱ νεκροὶ οἱ ἐν κυρίῳ ἀποθνῄσκοντες
  choice: 那些在主里死去的人
  rationale: “在主里”直接保留原文关系性和神学上的宽度，不将其限缩为“忠于主”或“属于主”；“死去的人”是现代汉语的自然说法。
- source_word: ἀπ’ ἄρτι
  choice: 从今以后
  rationale: 清楚表达以当前时刻为起点的时间含义。
- source_word: ναί, λέγει τὸ πνεῦμα
  choice: “是的，”圣灵说
  rationale: “是的”保留肯定和确认的语气；“圣灵”明确译出原文的定冠词与 πνεῦμα 在本语境中的指称。
- source_word: ἵνα ἀναπαήσονται
  choice: 他们得以歇息
  rationale: “得以”既可承载目的，也可表达结果，避免把有语法张力的 ἵνα 加将来时直陈式过度限定为单一解释。
- source_word: ἐκ τῶν κόπων αὐτῶν
  choice: 脱离自己的劳苦
  rationale: “劳苦”涵盖耗力的工作、辛劳及由此而来的困顿；“脱离”对应 ἐκ 所表达的离开。
- source_word: τὰ γὰρ ἔργα αὐτῶν
  choice: 因为他们的作为
  rationale: “作为”比单纯的“行为”更庄重，也保留 ἔργα 所指实际所行之事的广度，不预先赋予功德性解释。
- source_word: ἀκολουθεῖ μετ’ αὐτῶν
  choice: 也随着他们
  rationale: “随着”保留 ἀκολουθέω 的跟随意象，同时体现 μετά 的伴随含义；“也”使现代汉语表达顺畅。
theological_decisions:
- issue: “在主里”与死者的关系
  choice: 直译为“在主里死去的人”
  alternative: “至死忠于主的人”或“死时属于主的人”
  rationale: 原文没有把 ἐν κυρίῳ 限定为忠诚、归属或联合中的任何一种；直译可保留这些可能相互关联的含义。
- issue: ἵνα ἀναπαήσονται 的目的或结果语气
  choice: 译为“他们得以歇息”，并加注说明
  alternative: “好让他们歇息”或“他们将要歇息”
  rationale: 原文以 ἵνα 配将来时直陈式，目的与结果色彩均可能存在；正文采用可兼容二者的表达，不强行消除语法张力。
- issue: 死者与其作为的关系
  choice: 译为“他们的作为也随着他们”
  alternative: 将作为解释为赢得福分的功德，或仅解释为死后的纪念
  rationale: 经文只陈述其作为伴随他们，并未说明这种伴随的机制或救恩论意义，因此不加入功德或纯粹纪念的解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“有福了”保留启示文学中宣告福分的语气；引语层次清楚，避免古奥措辞。正文不解释“在主里”或“作为随着他们”的具体教义机制，并以脚注呈现目的／结果及“跟随／伴随”的真实语义空间。
