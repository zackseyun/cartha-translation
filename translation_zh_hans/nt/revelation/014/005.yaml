  text: καὶ ⸂ἐν τῷ στόματι αὐτῶν οὐχ εὑρέθη⸃ ψεῦδος· ⸀ἄμωμοί εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/005.yaml
  text: And in their mouth no lie was found[a]; they are blameless.
translation:
  language: zh_hans
  text: 在他们口中找不出谎言；他们是无瑕疵的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“无可指摘的”。希腊语这个词既可表达祭牲“没有残缺”的意象，也可指道德上无可指责。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ στόματι αὐτῶν
  choice: 在他们口中
  rationale: 贴近希腊文的表达，保留单数“口”的集合用法，同时在现代汉语中自然可懂，所指是他们言语的内容。
- source_word: οὐχ εὑρέθη
  choice: 找不出
  rationale: 以自然的汉语保留被查验而未发现的语义重点，强调谎言并不存在于他们的言语中。
- source_word: ψεῦδος
  choice: 谎言
  rationale: 直接对应虚假、不真实的话，比“诡诈”更少强调欺骗意图，也比“虚假”更具体地指向言语。
- source_word: ἄμωμοί
  choice: 无瑕疵的
  rationale: 既保留该词可能具有的祭牲纯全意象，也可表达道德上无可指摘；脚注说明另一种自然译法，以免把意象限于单一层面。
- source_word: καὶ
  choice: 在
  rationale: 本节前半句与上文的连接在汉语中可由连续叙述自然承接；不另译“并且”，避免生硬，同时没有切断语义联系。
theological_decisions:
- issue: ἄμωμοί兼具祭牲无残缺与道德无可指摘的含义
  choice: 无瑕疵的
  alternative: 无可指摘的
  rationale: 正文用“无瑕疵”保留启示录语境中可能存在的祭牲纯全意象，同时并不必然宣称抽象意义上的绝对无罪；脚注保留道德层面的译法。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“在他们口中找不出谎言”兼顾原文形式与汉语自然度；“无瑕疵”保留原词的意象和神学张力。
