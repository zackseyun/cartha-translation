    issue: “挥向地上”的动作方向略不自然且可能窄化画面。
    rationale: 英语审计文本采用“swung his sickle over the earth”。“挥过大地”在现代汉语中更自然地表达镰刀横扫大地、施行收割的意象，而不暗示把镰刀朝地面投掷。
  - severity: low
    issue: “收割葡萄”的搭配不如“采收葡萄”自然。
    rationale: ἐτρύγησεν 特别用于葡萄采收；“采收”既自然又保留农业意象，不对审判象征作额外阐释。
