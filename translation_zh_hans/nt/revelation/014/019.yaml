  text: καὶ ἔβαλεν ὁ ἄγγελος τὸ δρέπανον αὐτοῦ εἰς τὴν γῆν, καὶ ἐτρύγησεν τὴν ἄμπελον τῆς γῆς, καὶ ἔβαλεν εἰς τὴν ληνὸν τοῦ θυμοῦ τοῦ θεοῦ τὸν μέγαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/019.yaml
  text: And the angel swung his sickle over the earth, and harvested the vine of the earth, and threw it into the great winepress of the wrath of God.
translation:
  language: zh_hans
  text: 那天使把镰刀挥过大地，采收了地上的葡萄，把葡萄扔进上帝烈怒的巨大榨酒池里。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔβαλεν ... τὸ δρέπανον ... εἰς τὴν γῆν
  choice: 把镰刀挥向地上
  rationale: ἔβαλεν 基本义为“投、放”，但与镰刀及收割动作连用时，表达挥动镰刀施行收割；“挥向地上”既符合意象，也避免误解为把镰刀丢弃在地里。
- source_word: ἐτρύγησεν
  choice: 收割
  rationale: 该词常指采收葡萄；此处以“地上的葡萄”为宾语，用“收割”保留与本段审判收割意象的呼应。
- source_word: τὴν ἄμπελον τῆς γῆς
  choice: 地上的葡萄
  rationale: ἄμπελος 可指葡萄树、葡萄藤，也可集合性地指葡萄作物；下文将其投入榨酒池，译为“葡萄”在现代汉语中更自然，并保留集合意义。
- source_word: τὴν ληνὸν ... τὸν μέγαν
  choice: 大榨酒池
  rationale: ληνός 指压榨葡萄的池槽；“榨酒池”准确传达古代设施，τὸν μέγαν 译作“大”。
- source_word: τοῦ θυμοῦ τοῦ θεοῦ
  choice: 上帝烈怒的
  rationale: θυμός 在此表示强烈的忿怒；“烈怒”兼具力度与庄重语体，属格关系保持为“上帝烈怒的”。
theological_decisions:
- issue: 葡萄收割与上帝忿怒的审判意象
  choice: 直译为把葡萄扔进“上帝烈怒的大榨酒池”
  alternative: 解释为恶人被投入最终审判
  rationale: 原文以象征意象表达审判，却未在本节明确解释葡萄所指；译文保留意象及其神学张力，不在正文中加入解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“挥向地上”呈现镰刀的收割动作；连续使用“收割、扔进”保持原文紧凑而强烈的叙事节奏。
