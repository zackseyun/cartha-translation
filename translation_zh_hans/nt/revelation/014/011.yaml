id: REV.14.11
reference: Revelation 14:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ὁ καπνὸς τοῦ βασανισμοῦ αὐτῶν εἰς αἰῶνας αἰώνων ἀναβαίνει, καὶ οὐκ ἔχουσιν ἀνάπαυσιν ἡμέρας καὶ νυκτός, οἱ προσκυνοῦντες τὸ θηρίον καὶ τὴν εἰκόνα αὐτοῦ, καὶ εἴ τις λαμβάνει τὸ χάραγμα τοῦ ὀνόματος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/011.yaml
  text: And the smoke of their torment goes up forever and ever[a], and they have no rest day and night, those who worship the beast and its image[b], and whoever receives the mark of its name.
translation:
  language: zh_hans
  text: 他们所受折磨的烟不断上升，直到永永远远[a]；那些敬拜兽和它的像，以及凡接受它名号的印记的人[b]，昼夜不得安息。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较直译为“直到万世之世”。
    reason: lexical_alternative
  - marker: b
    text: 希腊原文在这里突然转成单数条件式：“并且，若有人接受它名号的印记。”这很可能继续描述受审判的人；正文按汉语表达加以顺接。
    reason: alternative_reading
lexical_decisions:
- source_word: καπνὸς τοῦ βασανισμοῦ αὐτῶν
  choice: 他们受苦的烟
  rationale: 保留“烟”的具体末世意象；“受苦”自然表达 βασανισμός 在审判语境中的痛苦含义，又不额外限定为某种施刑方式。
- source_word: εἰς αἰῶνας αἰώνων
  choice: 直到永永远远
  rationale: 这是启示录中表达持续无尽的惯用叠加强调语；正文采用自然庄重的汉语惯用表达，脚注保留较直译的形式。
- source_word: ἀναβαίνει
  choice: 不断上升
  rationale: 现在时描绘持续而鲜明的景象；“不断”在汉语中自然呈现其延续性。
- source_word: οὐκ ἔχουσιν ἀνάπαυσιν ἡμέρας καὶ νυκτός
  choice: 昼夜不得安息
  rationale: 准确保留“安息”及昼夜持续的含义，并符合现代汉语表达。
- source_word: προσκυνοῦντες
  choice: 敬拜
  rationale: 在启示录语境中指带有宗教效忠性质的崇拜，不仅是身体上的下拜。
- source_word: τὸ θηρίον καὶ τὴν εἰκόνα αὐτοῦ
  choice: 兽和兽像
  rationale: “兽”延续启示录的标准末世意象；“兽像”简洁表达属于该兽的像。
- source_word: εἴ τις λαμβάνει
  choice: 以及任何接受……的人
  rationale: 正文以可懂的汉语连接受审判的两类描述；脚注说明原文从复数分词突然转为单数不定条件句，避免掩盖句法张力。
- source_word: τὸ χάραγμα τοῦ ὀνόματος αὐτοῦ
  choice: 它名号的印记
  rationale: “印记”是 χάραγμα 在启示录中的常用准确对应；“名号”在此比日常的“名字”更庄重，也保留属格关系。
theological_decisions:
- issue: εἰς αἰῶνας αἰώνων 所表达的审判持续时间
  choice: 正文译为“直到永永远远”
  alternative: 直译为“直到世世代代”或“直到万世之世”
  rationale: 该叠加语在启示录中具有最强烈的持续性表达。正文不弱化其力度，也不借译文引入超出原句的教义体系；脚注呈现字面结构。
- issue: 末句的指称与突转句法
  choice: 正文按汉语顺畅地并列为“以及任何接受……的人”，并用脚注交代原文突转
  alternative: 严格仿译为“那些敬拜……的人，并且若有人接受……”
  rationale: 希腊文由复数分词 οἱ προσκυνοῦντες 转为单数不定条件 εἴ τις λαμβάνει，句法显得突然。正文须让普通读者明白末句也描述昼夜不得安息者，但脚注保留其形式上的含混与张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“不断上升”保留现在时的持续画面；调整信息顺序，将受审判者置于“昼夜不得安息”之前，以避免汉语中后置主语造成误读。所有解释性处理均以脚注明示。
