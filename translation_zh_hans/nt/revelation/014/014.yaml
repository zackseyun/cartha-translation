  text: Καὶ εἶδον, καὶ ἰδοὺ νεφέλη λευκή, καὶ ἐπὶ τὴν νεφέλην καθήμενον ὅμοιον ⸀υἱὸν ἀνθρώπου, ἔχων ἐπὶ τῆς κεφαλῆς αὐτοῦ στέφανον χρυσοῦν καὶ ἐν τῇ χειρὶ αὐτοῦ δρέπανον ὀξύ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/014.yaml
  text: And I looked[a], and behold, a white cloud, and seated on the cloud was one like a son of man[b], having on his head a golden crown and in his hand a sharp sickle.
translation:
  language: zh_hans
  text: 我又观看，看哪，有一朵白云；云上坐着一位好像人子[a]，头上戴着金冠冕[b]，手里拿着一把锋利的镰刀。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“有一位好像那位人子。”这里的措辞呼应《但以理书》7:13，通常被理解为弥赛亚称号；不过希腊文“人子”前没有冠词，字面为“好像人子”。
    reason: alternative_reading
  - marker: b
    text: 这里译作“冠冕”的希腊词是 stephanos，常指胜利者所得的花冠，而不一定是君王的王冠。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留异象叙述中突然引人注意的指示语气；“看哪”庄重而简明，也符合《启示录》的文体。
- source_word: νεφέλη λευκή
  choice: 一朵白云
  rationale: 按 λευκή 的基本词义译为“白”，不解释性地扩展为“明亮”；量词“一朵”符合现代汉语习惯。
- source_word: ἐπὶ τὴν νεφέλην καθήμενον
  choice: 云上坐着
  rationale: 自然表达所见者处于坐姿，并保留其位于云上的空间关系。
- source_word: ὅμοιον υἱὸν ἀνθρώπου
  choice: 一位好像人子的
  rationale: “一位”使名词化结构在汉语中自然，“好像人子”保留对《但以理书》7:13的呼应；不在正文中擅自加强为明确带定指的称号。
- source_word: στέφανον χρυσοῦν
  choice: 金冠冕
  rationale: “冠冕”是自然、庄重的对应词，同时避免直接译成专指君王权位的“王冠”；其可能具有胜利花冠的含义留在脚注说明。
- source_word: δρέπανον ὀξύ
  choice: 一把锋利的镰刀
  rationale: “镰刀”清楚呈现收割器具，并与后文的庄稼收割意象自然衔接。
theological_decisions:
- issue: 是否把 υἱὸν ἀνθρώπου 明确译成定指的弥赛亚称号
  choice: 正文译作“一位好像人子的”
  alternative: “一位好像那位人子的”
  rationale: 希腊文此处 υἱὸν ἀνθρώπου 没有冠词，正文因此不额外加入明确的定指；但措辞明显呼应《但以理书》7:13，并常被理解为指向弥赛亚，故在脚注中保留另一种理解。
- issue: στέφανος 是否应直接解释为君王的王冠
  choice: 译作“冠冕”
  alternative: “胜利者的花冠”或“王冠”
  rationale: στέφανος 常指奖赏或胜利的冠，而非 διάδημα 所指的王室冠冕；正文采用涵盖面较宽的“冠冕”，不预先限定其象征意义。
translation_notes:
  register: 采用现代、庄重而易懂的异象叙述语体。“我又观看，看哪”保留原文重复所形成的现场感；用分号划分白云的出现与云上人物的描写，使长句清晰。脚注标记分别紧跟“人子”和“金冠冕”，与说明内容准确对应。
