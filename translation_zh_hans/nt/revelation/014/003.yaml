source:
  edition: SBLGNT
  text: καὶ ᾄδουσιν ⸀ὡς ᾠδὴν καινὴν ἐνώπιον τοῦ θρόνου καὶ ἐνώπιον τῶν τεσσάρων ζῴων καὶ τῶν πρεσβυτέρων· καὶ οὐδεὶς ἐδύνατο μαθεῖν τὴν ᾠδὴν εἰ μὴ αἱ ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες, οἱ ἠγορασμένοι ἀπὸ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/003.yaml
  text: And they are singing what seemed to be a new song before the throne and before the four living creatures and the elders[a]. And no one was able to learn the song except the one hundred forty-four thousand[b], those who had been purchased from the earth.
translation:
  language: zh_hans
  text: 他们在宝座前、在四个活物和众长老面前唱着；那歌仿佛是一首新歌[a]。除了那十四万四千人[b]——就是从地上被买来的人——以外，没有人能学会这首歌。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“像一首新歌”或“作为一首新歌”。希腊文使用了启示录异象叙述中常见的近似或观感用语。
    reason: lexical_alternative
  - marker: b
    text: “被买来”也可按其神学含义译作“被救赎”。希腊文原词直译为“买来”。
    reason: alternative_reading
lexical_decisions:
- source_word: ᾄδουσιν
  choice: 唱着
  rationale: 希腊文为现在时直陈语气；“唱着”自然地传达异象叙事中的生动进行感。
- source_word: ὡς ᾠδὴν καινὴν
  choice: 仿佛是一首新歌
  rationale: 既保留ὡς在异象中表示所见、所闻仿佛如此的语气，也不武断否认这歌确实是新歌。
- source_word: ἐνώπιον
  choice: 在……面前
  rationale: 准确表达处于宝座及天上众活物临在之处的空间含义，且符合现代汉语习惯。
- source_word: τῶν τεσσάρων ζῴων
  choice: 四个活物
  rationale: “活物”是启示录语境中对宝座周围天上活着之受造者的简洁、庄重称呼，避免误译为普通动物或野兽。
- source_word: τῶν πρεσβυτέρων
  choice: 众长老
  rationale: πρεσβύτεροι在启示录中是天上议会特定群体的称谓；“众长老”自然且明确。
- source_word: οὐδεὶς ἐδύνατο μαθεῖν
  choice: 没有人能学会
  rationale: 保留能力含义；“学会”比单纯“学习”更适合歌曲这一宾语。
- source_word: αἱ ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες
  choice: 那十四万四千人
  rationale: 以现代汉语常用数字表达呈现，并用“那”体现希腊文定冠词所指向的特定群体。
- source_word: οἱ ἠγορασμένοι ἀπὸ τῆς γῆς
  choice: 就是从地上被买来的人
  rationale: “被买来”保留ἀγοράζω直接的买卖隐喻；“就是”表明该分词短语同位说明十四万四千人。
theological_decisions:
- issue: 异象描述中ὡς的语力
  choice: 仿佛是一首新歌
  alternative: 作为一首新歌／像一首新歌
  rationale: 该词可标示异象感知中的近似或呈现方式；译文保留这种现象性语气，却不判定这歌在本体上并非新歌。
- issue: ἠγορασμένοι的译法
  choice: 被买来
  alternative: 被救赎
  rationale: 原词直接使用市场交易的“买”这一隐喻。“救赎”虽与相关神学观念相通，却比本词的词汇核心更具解释性，因此正文保留直译，脚注列出传统神学译法。
- issue: 十四万四千人与被买来之人的关系
  choice: 用“就是”表达同位说明
  alternative: 省略连接语，译作“那十四万四千从地上被买来的人”
  rationale: 希腊文冠词分词短语οἱ ἠγορασμένοι对前述群体作同位说明；“就是”使现代汉语关系清楚，而不额外界定该数目的象征性或字面性。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“宝座”“活物”“长老”保持启示录天上宫廷场景的语域；句序略作汉语化处理，同时保留原文两句结构、ὡς的异象性模糊，以及ἀγοράζω的交易隐喻。
