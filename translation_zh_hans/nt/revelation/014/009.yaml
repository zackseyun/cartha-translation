id: REV.14.9
reference: Revelation 14:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ ἄλλος ἄγγελος τρίτος ἠκολούθησεν αὐτοῖς λέγων ἐν φωνῇ μεγάλῃ· Εἴ τις προσκυνεῖ τὸ θηρίον καὶ τὴν εἰκόνα αὐτοῦ, καὶ λαμβάνει χάραγμα ἐπὶ τοῦ μετώπου αὐτοῦ ἢ ἐπὶ τὴν χεῖρα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/009.yaml
  text: And another angel[a], a third, followed them, saying with a loud voice, “If anyone worships the beast and its image[b], and receives a mark on his forehead or on his hand,”
translation:
  language: zh_hans
  text: 又有一位天使，就是第三位，跟在他们后面，大声说：“若有人敬拜那兽和兽像，又在额头上或手上领受印记，[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“在他的额头上或在他的手上”；这里的单数阳性代词泛指前面的“有人”，并非只指男性。
    reason: 说明希腊文泛指单数阳性代词在现代汉语中的处理。
lexical_decisions:
- source_word: ἄλλος ἄγγελος τρίτος
  choice: 又有一位天使，就是第三位
  rationale: 同时保留ἄλλος“另一位”和τρίτος“第三位”的双重信息，并以自然汉语表明这位天使在异象中的次序。
- source_word: ἠκολούθησεν αὐτοῖς
  choice: 跟在他们后面
  rationale: 表达叙事上的跟随与先后关系；“他们”承接前文出现的天使。
- source_word: λέγων ἐν φωνῇ μεγάλῃ
  choice: 大声说
  rationale: 以简洁自然的现代汉语传达公开而响亮的宣告。
- source_word: Εἴ τις
  choice: 若有人
  rationale: 保留不定条件句及其普遍警告的范围。
- source_word: προσκυνεῖ
  choice: 敬拜
  rationale: 此处所指不只是身体俯伏，而是对兽的宗教性尊崇与效忠。
- source_word: τὸ θηρίον
  choice: 那兽
  rationale: “兽”是《启示录》中θηρίον的既定末世异象称谓；指示性的“那”使所指明确。
- source_word: τὴν εἰκόνα αὐτοῦ
  choice: 兽像
  rationale: 自然、凝练地表达“那兽的像”，避免汉语代词性别造成不必要的解释。
- source_word: λαμβάνει χάραγμα
  choice: 受了印记
  rationale: λαμβάνει在此表示接受，χάραγμα指具有归属和识别作用的刻印或标记；“受了印记”符合汉语搭配。
- source_word: ἐπὶ τοῦ μετώπου αὐτοῦ ἢ ἐπὶ τὴν χεῖρα αὐτοῦ
  choice: 在额头上或手上
  rationale: 准确表达印记所在的位置。汉语不必重复泛指单数代词，仍可自然回指“有人”，且不缩窄适用对象。
theological_decisions:
- issue: προσκυνέω对兽所表达的行为性质
  choice: 敬拜
  alternative: 向……俯伏
  rationale: 上下文涉及偶像崇拜和对兽的效忠；“敬拜”保留其宗教与神学分量，而“俯伏”可能只被理解为身体姿势。
- issue: τις与αὐτοῦ的泛指表达
  choice: 若有人……在额头上或手上
  alternative: 若有人……在他的额头上或他的手上
  rationale: 希腊文以阳性单数代词回指泛指的τις；现代汉语省略重复代词既忠实又自然，也避免把本来普遍适用的警告误读为仅指男性。
- issue: 兽像的所属关系
  choice: 兽像
  alternative: 它的像／那兽的像
  rationale: “兽像”明确保留像属于或代表那兽的关系，同时不因希腊语法中性而人为判定该异象角色的人格性别。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“又有一位天使，就是第三位”保留原文叠置的“另一位／第三位”；“大声说”避免生硬直译。“兽像”沿用普通读者易懂的启示文学表达。本节句末仍未完结，保留逗号和未闭合语意，以衔接下一节。
