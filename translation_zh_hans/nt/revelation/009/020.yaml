id: REV.9.20
reference: Revelation 9:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ οἱ λοιποὶ τῶν ἀνθρώπων, οἳ οὐκ ἀπεκτάνθησαν ἐν ταῖς πληγαῖς ταύταις, ⸀οὐδὲ μετενόησαν ἐκ τῶν ἔργων τῶν χειρῶν αὐτῶν, ἵνα μὴ ⸀προσκυνήσουσιν τὰ δαιμόνια καὶ τὰ εἴδωλα τὰ χρυσᾶ καὶ τὰ ἀργυρᾶ καὶ τὰ χαλκᾶ καὶ τὰ λίθινα καὶ τὰ ξύλινα, ἃ οὔτε βλέπειν ⸀δύνανται οὔτε ἀκούειν οὔτε περιπατεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/020.yaml
  text: And the rest of humanity[a], who were not killed by these plagues, did not even repent of the works of their hands, so as not to worship demons and the idols of gold and silver and bronze and stone and wood[c][b], which can neither see nor hear nor walk.
translation:
  language: zh_hans
  text: 其余那些没有死在这些灾祸中的人，也没有为自己双手所做的事悔改[a]，好不再敬拜鬼魔和那些用金、银、铜、石头和木头制成的偶像[b]；这些偶像既不能看，也不能听，也不能行走。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“从自己双手所做的事中悔改”，意思是转离这些事；本节尤其指他们制造并敬拜的偶像。
    reason: lexical_alternative
  - marker: b
    text: “好不再敬拜”也可译作“以致不再敬拜”或“为的是不再敬拜”；希腊文可表达目的或预期的结果。
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ λοιποὶ τῶν ἀνθρώπων
  choice: 其余……的人
  rationale: 表达“其余的人类/其余众人”，并由后接关系从句自然限定为在灾祸中未死的人，不带男性专指。
- source_word: οὐκ ἀπεκτάνθησαν ἐν ταῖς πληγαῖς ταύταις
  choice: 没有死在这些灾祸中
  rationale: 准确传达不定过去时被动形式及ἐν在此所表示的灾祸情境或手段；现代汉语自然清楚。
- source_word: οὐδὲ μετενόησαν ἐκ τῶν ἔργων τῶν χειρῶν αὐτῶν
  choice: 仍不悔改，不离开自己双手所做的事
  rationale: “仍不”在幸存于灾祸之后仍未悔改的语境中体现οὐδέ的递进力度；另用“不离开”保留ἐκ所表达的转离，并保留“双手所做”这一具体意象。
- source_word: ἵνα μὴ προσκυνήσουσιν
  choice: 以致不再敬拜
  rationale: 结合上下文表达悔改本应带来的停止敬拜；“以致”保留ἵνα从句可有目的或预期结果的张力，不按表面未来式生硬直译。
- source_word: τὰ δαιμόνια
  choice: 鬼魔
  rationale: 新约语境中指敌对的灵界存在；“鬼魔”是现代中文圣经语域中清楚而庄重的对应。
- source_word: τὰ εἴδωλα τὰ χρυσᾶ καὶ τὰ ἀργυρᾶ καὶ τὰ χαλκᾶ καὶ τὰ λίθινα καὶ τὰ ξύλινα
  choice: 那些金、银、铜、石、木的偶像
  rationale: 将一连串材料形容词自然译为中文并列定语，同时用“那些”反映冠词所带的指称性。
- source_word: ἃ οὔτε βλέπειν δύνανται οὔτε ἀκούειν οὔτε περιπατεῖν
  choice: 这些偶像既不能看，也不能听，也不能行走
  rationale: 保留三个并列的不可能行为及对偶像无能的讽刺；περιπατεῖν直译为“行走”。
theological_decisions:
- issue: 悔改与停止偶像崇拜之间的关系
  choice: 译为“以致不再敬拜”，呈现悔改所指向的转离行为
  alternative: “为的是不敬拜”或“所以不再敬拜”
  rationale: ἵνα μή在此可表达目的或预期结果。所选译法不把悔改简化为单一行为，也不额外建立特定的悔改教义。
- issue: “双手所做的事”是否仅指偶像
  choice: 正文保留较宽的表达，由下文说明其中特别涉及所造所拜的偶像
  alternative: 直接译为“自己双手所造的偶像”
  rationale: 原文先用较宽的ἔργα，再以鬼魔和偶像具体展开；保留这一结构可避免把语义范围过早收窄。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“双手所做”和“看、听、行走”的圣经意象；材料列表用顿号增强中文可读性，同时维持原文累积铺陈的力度。
