id: REV.9.6
reference: Revelation 9:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἐν ταῖς ἡμέραις ἐκείναις ζητήσουσιν οἱ ἄνθρωποι τὸν θάνατον καὶ οὐ μὴ εὑρήσουσιν αὐτόν, καὶ ἐπιθυμήσουσιν ἀποθανεῖν καὶ ⸀φεύγει ⸂ὁ θάνατος ἀπ’ αὐτῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/006.yaml
  text: And in those days people will seek death and will certainly not find it[a], and they will long to die, but death flees from them.
translation:
  language: zh_hans
  text: 在那些日子，人们将寻求死亡，却绝对找不到；他们渴望死去，死亡却躲避他们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: 在那些日子
  rationale: 保留原文标准的时间表达及ἐκείναις的指示意味，现代汉语自然庄重。
- source_word: ζητήσουσιν οἱ ἄνθρωποι τὸν θάνατον
  choice: 人们将寻死
  rationale: οἱ ἄνθρωποι在此泛指受审判的人类，并非专指男性，故译为“人们”；“寻死”简洁传达主动寻求死亡的意思。
- source_word: οὐ μὴ εὑρήσουσιν αὐτόν
  choice: 却绝对找不到
  rationale: οὐ μή加将来时构成强烈否定；“绝对找不到”保留强调语气。汉语可省略指回“死亡”的宾语而不致含混。
- source_word: ἐπιθυμήσουσιν ἀποθανεῖν
  choice: 他们渴望死去
  rationale: ἐπιθυμέω表达强烈愿望，“渴望”准确保留其力度；“死去”对应不定式ἀποθανεῖν。
- source_word: φεύγει ὁ θάνατος ἀπ’ αὐτῶν
  choice: 死亡却躲避他们
  rationale: 保留死亡作为主语的拟人意象，也保留历史现在时带来的鲜明感；“躲避”在现代汉语中自然表达死亡主动离开、不给他们临到。
theological_decisions:
- issue: 审判异象中死亡的拟人化
  choice: 直接译作“死亡却躲避他们”
  alternative: 意译为“他们却死不了”
  rationale: 原文明确以“死亡”为φεύγει的主语。直译保留约翰异象语言的张力，不把意象化约为解释。
- issue: οἱ ἄνθρωποι的性别与范围
  choice: 译为“人们”
  alternative: 译为“男人们”或“世人”
  rationale: ἄνθρωποι在本语境泛指人类，并无仅限男性的语义证据；“人们”在现代汉语中准确、自然，也不额外加入“世”所可能带来的神学色彩。
- issue: 强烈否定οὐ μή的表达
  choice: 译为“绝对找不到”
  alternative: 译为“决不能找到”或“永远找不到”
  rationale: “绝对”清楚体现原文的强调；不采用“永远”，避免把语法上的强烈否定扩大为明确的无限时间断言。
translation_notes:
  register: 采用现代、庄重且易懂的普通话书面语。句式紧凑，保留原文两组并列动作及末尾拟人化反转；无需脚注。
