review_pass:
  verdict: revise
  source_fidelity: “寻死”在现代汉语中通常带有主动自杀的特定义项，较原文ζητήσουσιν τὸν θάνατον所表达的寻求／企求死亡略显狭窄。改为“寻求死亡”可保留原文的对象、主动性及其未明示的具体方式。其余部分准确保留了οὐ μή的强烈否定、渴望死亡的含义，以及“死亡”逃离他们的拟人化现在时画面。
  naturalness: 原译整体庄重流畅。“寻求死亡”虽比“寻死”正式，却适合启示文学的书面语体，且避免“寻死”的现代口语和自杀联想。省略“找不到”的宾语在上下文中清楚，汉语自然。
  terminology: “人们”准确表达泛指的οἱ ἄνθρωποι；“死亡”前后一致，并保留其在末句作主动主语的拟人化；“渴望死去”恰当对应ἐπιθυμήσουσιν ἀποθανεῖν。“绝对找不到”充分而不过度地表达οὐ μή的强调。
  issues:
