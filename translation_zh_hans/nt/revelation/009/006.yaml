    issue: “寻死”可能将“寻求死亡”具体化为自杀。
    rationale: ζητέω与“死亡”作宾语表达寻求死亡，并未说明人们以何种方式求死；现代汉语“寻死”常指企图自杀。改作“寻求死亡”较不限定具体行为，也更贴近原文。
