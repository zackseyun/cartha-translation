  text: καὶ οὐ μετενόησαν ἐκ τῶν φόνων αὐτῶν οὔτε ἐκ τῶν ⸀φαρμάκων αὐτῶν οὔτε ἐκ τῆς πορνείας αὐτῶν οὔτε ἐκ τῶν κλεμμάτων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/021.yaml
  text: And they did not repent of their murders[a], or of their sorceries, or of their sexual immorality, or of their thefts.
translation:
  language: zh_hans
  text: 他们也没有悔改，没有离弃自己的凶杀、邪术[a]、淫乱和偷盗。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“巫术”。这个希腊词也可与配制药剂或毒物有关，因而在某些语境中可指“下毒”。
    reason: lexical_alternative
lexical_decisions:
- source_word: μετενόησαν ἐκ
  choice: 悔改，没有离弃
  rationale: μετανοέω在此处指道德意义上的悔改，ἐκ则表明要从所列的恶行中转离。译文用“悔改”和“离弃”共同表达这一结构，既自然，也不把悔改缩减为内心改变。
- source_word: φόνων
  choice: 凶杀
  rationale: φόνος指杀人、谋杀；“凶杀”保留其道德和犯罪色彩，又适合启示录罪恶清单的庄重语体。
- source_word: φαρμάκων
  choice: 邪术
  rationale: 在启示录的语境中，此词主要指借助药剂等实施的巫术或魔法行为。“邪术”是现代汉语中简洁自然的表达；其与药剂、毒物相关的词义范围在脚注中保留。
- source_word: πορνείας
  choice: 淫乱
  rationale: πορνεία泛指不合道德规范的性行为。“淫乱”在现代中文圣经语体中清楚、凝练，并保留其较广的伦理范围。
- source_word: κλεμμάτων
  choice: 偷盗
  rationale: κλέμμα可指偷窃行为或赃物；在罪恶清单中，“偷盗”最自然地表达其行为意义。
- source_word: οὔτε ... οὔτε ... οὔτε
  choice: 、……、……和……
  rationale: 初始否定已由“没有离弃”表达，后续各项在中文中用并列顿号和“和”连接，否定范围自然涵盖全部项目，避免机械重复“也不”。
theological_decisions:
- issue: φαρμάκων在启示文学罪恶清单中的语义范围
  choice: 邪术
  alternative: 巫术；配制药剂或毒物；下毒
  rationale: 启示录中同源词通常涉及邪术和迷惑人的魔法实践，因此正文采用“邪术”。同时，该词与药剂、毒物的历史关联是真实的词义张力，故以脚注保留，不将其武断地限定为现代意义的药物或下毒。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“自己的”对应重复出现的αὐτῶν；“没有悔改，没有离弃”清楚呈现μετανοέω与ἐκ所包含的从恶行中回转之意。脚注标记置于“邪术”之后，以准确对应φαρμάκων。
