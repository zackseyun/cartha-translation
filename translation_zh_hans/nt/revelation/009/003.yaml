  text: καὶ ἐκ τοῦ καπνοῦ ἐξῆλθον ἀκρίδες εἰς τὴν γῆν, καὶ ἐδόθη αὐταῖς ἐξουσία ὡς ἔχουσιν ἐξουσίαν οἱ σκορπίοι τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/003.yaml
  text: And out of the smoke came locusts onto the earth[a], and authority was given to them, as the scorpions of the earth have authority.
translation:
  language: zh_hans
  text: 又有蝗虫从烟中出来，来到地上；它们被赐予权柄，正如地上的蝎子有权柄一样。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκ τοῦ καπνοῦ
  choice: 从烟中
  rationale: ἐκ表示从内部出来；“从烟中”自然保留蝗虫由烟里涌现的画面。
- source_word: ἐξῆλθον
  choice: 出来
  rationale: 采用ἐξέρχομαι的基本动态意义，与“从烟中”搭配清楚自然。
- source_word: ἀκρίδες
  choice: 蝗虫
  rationale: ἀκρίς在圣经及启示文学语境中通常指蝗虫，而非泛指蚱蜢。
- source_word: εἰς τὴν γῆν
  choice: 来到地上
  rationale: εἰς带有趋向意义；“来到地上”既表达移动方向，也避免把γῆ局限为某一片土地。
- source_word: ἐδόθη αὐταῖς ἐξουσία
  choice: 有权柄赐给它们
  rationale: 保留希腊文的被动表达，不明说赐予者；“权柄”体现获准行使的权能，而不只表示内在力量。
- source_word: ὡς ἔχουσιν ἐξουσίαν
  choice: 如同……有权柄一样
  rationale: 直接保留ὡς引出的比较，并重复“权柄”，对应原文两次出现ἐξουσία。
- source_word: οἱ σκορπίοι τῆς γῆς
  choice: 地上的蝎子
  rationale: 此处属格用现代汉语自然表达为“地上的”，说明这些蝎子属于地上领域，同时与从烟中出来的蝗虫形成对照。
theological_decisions:
- issue: 蝗虫所得能力的性质与来源
  choice: 译作“有权柄赐给它们”，保留神学被动式，不明确指出赐予者。
  alternative: 译作“它们得了能力”，或在正文中明确说是上帝赐予。
  rationale: ἐξουσία可指权柄、权限或能力；上下文中的被动式强调这种作用是获准的，却没有明说赐予者。译文保留这一含蓄性，不把解释写入正文。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“又有……；有……”保持异象叙述的推进感；重复“权柄”有意对应原文措辞，虽略带启示文学的陌生感，却保留原文的比较结构与神学张力。
