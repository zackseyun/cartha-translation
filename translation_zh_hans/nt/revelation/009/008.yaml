  text: 它们有头发，像女人的头发[a]；它们的牙齿像狮子的牙齿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“像妇女的头发。”希腊语“妇女”为复数；汉语通常以单数泛指来表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶχον
  choice: 有
  rationale: 未完成时在异象的描述性叙事中交代其外貌特征；现代汉语用“有”自然表达，无须另加持续意味。
- source_word: τρίχας
  choice: 头发
  rationale: 希腊语虽为复数，现代汉语通常用集合名词“头发”；加“头”可明确这里不是一般毛发。
- source_word: ὡς τρίχας γυναικῶν
  choice: 像女人的头发
  rationale: ὡς表示明喻；“女人的头发”既贴近原文复数属格，也自然、清楚，并不解释这种形象的象征意义。
- source_word: οἱ ὀδόντες αὐτῶν
  choice: 它们的牙齿
  rationale: 以汉语领属结构自然表达定冠词名词短语及其复数代词领属关系。
- source_word: ὡς λεόντων
  choice: 像狮子的牙齿
  rationale: 原文属格复数“狮子的”省略了从上下文可知的“牙齿”；汉语补出“牙齿”，避免读成牙齿本身像整只狮子。
- source_word: ἦσαν
  choice: （体现在“像”句式中）
  rationale: 汉语名词性比较通常无需明说系词；“它们的牙齿像……”自然承载“是……一样”的含义。
theological_decisions:
- issue: 启示文学异象的性质与象征意义
  choice: 直接保留“像女人的头发”和“像狮子的牙齿”两个明喻，不在正文中解释其象征。
  alternative: 加入解释性措辞，说明这些特征所象征的意义。
  rationale: 希腊文本只呈现异象中的比较，并未在本节解释其含义；翻译应保留这种形象及其诠释空间。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“它们”承接异象中的群体；分号对应两个并列外貌特征。保留原文的重复“头发”和“牙齿”，使两个明喻清晰对称。
