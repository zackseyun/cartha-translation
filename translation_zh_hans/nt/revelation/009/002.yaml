id: REV.9.2
reference: Revelation 9:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἤνοιξεν τὸ φρέαρ τῆς ἀβύσσου, καὶ ἀνέβη καπνὸς ἐκ τοῦ φρέατος ὡς καπνὸς καμίνου ⸀μεγάλης, καὶ ⸀ἐσκοτώθη ὁ ἥλιος καὶ ὁ ἀὴρ ἐκ τοῦ καπνοῦ τοῦ φρέατος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/002.yaml
  text: And he opened the shaft of the abyss[a], and smoke went up from the shaft like the smoke of a great furnace, and the sun and the air were darkened by the smoke from the shaft.
translation:
  language: zh_hans
  text: 他打开了深渊的竖井[a]，烟从竖井升上来，好像大火炉的烟；太阳和空气都因从竖井出来的烟而变暗了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“深渊的坑”；传统译法为“无底坑”。
    reason: alternative_reading
lexical_decisions:
- source_word: ἤνοιξεν
  choice: 打开了
  rationale: 直接表达不定过去时主动陈述语气；不增添“解锁”等原文未说明的方式。
- source_word: φρέαρ
  choice: 井口
  rationale: 该词可指井、坑或其竖直开口；此处烟从中升起，译作“井口”自然地呈现通向深渊的开口，并与“深渊”本身保持区别。
- source_word: ἀβύσσου
  choice: 无底深渊
  rationale: “深渊”直接对应该名词；“无底”体现词源及启示录中的幽深意象，同时不把 φρέαρ 与 ἄβυσσος 混为一物。
- source_word: ἀνέβη
  choice: 升上来
  rationale: 保留烟向上运动的方向，符合现代汉语表达。
- source_word: καπνὸς
  choice: 烟
  rationale: 采用标准对应词，并在本节中保持一致。
- source_word: ὡς καπνὸς καμίνου μεγάλης
  choice: 好像大火炉的烟
  rationale: 保留 ὡς 的明喻以及 κάμινος μεγάλης 的强烈形象。
- source_word: ἐσκοτώθη
  choice: 昏暗了
  rationale: 表达被动造成的变暗结果；汉语以“因……而昏暗”自然呈现原因及结果。
- source_word: ὁ ἥλιος
  choice: 太阳
  rationale: 直接词义对应。
- source_word: ὁ ἀὴρ
  choice: 天空
  rationale: 本义是空气或大气；在与太阳并列且被烟遮暗的视觉场景中，“天空”比抽象的“空气”更自然，脚注保留直译可能。
- source_word: ἐκ τοῦ καπνοῦ τοῦ φρέατος
  choice: 因井口冒出的烟
  rationale: ἐκ 在此表达来源兼原因；“冒出的”明确烟来自井口，“因”保留其致暗作用。
theological_decisions:
- issue: 如何翻译启示文学中的 φρέαρ 与 ἄβυσσος，而不把入口和深渊混为一体
  choice: 无底深渊的井口
  alternative: 深渊的坑；无底坑
  rationale: 此译法区分通往深渊的开口与深渊本身，并以脚注说明其他可能译法，避免把传统表达当作唯一解释。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语体。“井口”与后文两次出现的来源意象相呼应；分号使长句层次清晰。
