revisions:
- from: 他打开了无底深渊的井口[a]，烟从井口升上来，好像大火炉的烟；太阳和天空都因井口冒出的烟而昏暗了。
  to: 他打开了深渊的竖井[a]，烟从竖井升上来，好像大火炉的烟；太阳和空气都因从竖井出来的烟而变暗了。
  rationale: 修订以“深渊”对应ἀβύσσος，避免在正文加入“无底”的传统性解释；以“竖井”对应φρέαρ，保留其作为通向深渊的通道、而非深渊本身或仅其井口的功能。将ἀήρ译为“空气”，并以“因从竖井出来的烟而变暗了”表达ἐκ的来源／致因关系及ἐσκοτώθη的被动结果。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T03:57:11Z'
