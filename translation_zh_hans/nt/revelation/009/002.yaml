  source_fidelity: 草稿将ἀβύσσος译为“无底深渊”，加入了原文名词本身未明说的“无底”限定；这正是英文审校轨迹刻意避免置入正文的传统性解释。另将ἀήρ译作“天空”，虽能适应画面，却从原文的“空气／大气”转移到天空，宜改正。φρέαρ在此应译出通往深渊的竖直通道，而不只是其口部。
  naturalness: “深渊的竖井”在启示文学的庄重语境中清楚且自然，能与“深渊”区分。“太阳和空气都因……而变暗了”虽然描写异常景象，仍是通顺的现代汉语，并保留原文的被动结果和因果关系。
  terminology: 将ἀβύσσος统一作“深渊”，将φρέαρ作“竖井”，保留二者的语义区分；ἀήρ作“空气”。脚注把“无底坑”限定为传统译法，而非正文的附加限定。
