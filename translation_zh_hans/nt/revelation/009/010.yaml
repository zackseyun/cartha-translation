  naturalness: “螫针”庄重、自然，适合本段异象体裁。改为“它们的尾巴中有……”在中文中虽稍具文学性，但清楚保留原文的意象及句法焦点；以“达五个月”明确伤害行动的持续时段，表达流畅。
  terminology: “能力”恰当地表达此处ἐξουσία的实际施害能力；“伤害人”准确表达ἀδικῆσαι τοὺς ἀνθρώπους，且“人”自然涵盖泛指的人类。无需就此设置脚注。
