id: REV.9.10
reference: Revelation 9:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἔχουσιν οὐρὰς ὁμοίας σκορπίοις καὶ κέντρα, καὶ ἐν ταῖς οὐραῖς αὐτῶν ⸂ἡ ἐξουσία αὐτῶν⸃ ἀδικῆσαι τοὺς ἀνθρώπους μῆνας πέντε.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/010.yaml
  text: And they have tails like scorpions[a], and stingers; and in their tails is their power to harm people for five months.
translation:
  language: zh_hans
  text: 它们有像蝎子一样的尾巴，也有螫针；它们的尾巴中有伤害人的能力，能伤害人达五个月。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐρὰς
  choice: 尾巴
  rationale: 采用直接的身体部位用语，并按上下文保留复数所表达的群体性；汉语名词无需另加复数标记。
- source_word: ὁμοίας σκορπίοις
  choice: 像蝎子一样
  rationale: ὅμοιος与与格表示相似；此译保留比喻，同时不强行限定究竟是整体像蝎子，还是尾巴具体像蝎子的尾巴。
- source_word: κέντρα
  choice: 螫针
  rationale: κέντρον可指尖刺、螫刺或赶牲口的刺棒；在蝎子的意象中，“螫针”能自然表达其具体伤人器官，又不额外明说毒液。
- source_word: ἐξουσία
  choice: 能力
  rationale: 此处与不定式ἀδικῆσαι连用，着重这些受造物能够施害的实际力量。“能力”在现代汉语中比“权柄”更贴合此处功能，同时不否认这种能力在异象中受到许可和限制。
- source_word: ἀδικῆσαι
  choice: 伤害
  rationale: 在灾祸与折磨的语境中，此动词表示使人受损或受伤，而非抽象意义上的行不义。
- source_word: τοὺς ἀνθρώπους
  choice: 人
  rationale: ἄνθρωποι在此泛指人类，而非专指男性；现代汉语用“人”准确、自然地保留其泛称范围。
- source_word: μῆνας πέντε
  choice: 期限是五个月
  rationale: 宾格表示持续时间；此译明确表达施害能力所受的五个月期限，避免误读为伤害的结果持续五个月。
theological_decisions:
- issue: ἐξουσία在末世异象灾祸中的含义
  choice: 译为“能力”
  alternative: 权柄
  rationale: 上下文直接描述其尾巴实施伤害的效能，因此主译突出实际施害能力；此选择不判断该能力最终来源，也不排除它是被授予或许可的。
- issue: 五个月所修饰的范围
  choice: 表达为施害能力受限的期限
  alternative: 译作“伤害人五个月”
  rationale: 希腊文把“五个月”置于句末，语法上可自然关联伤害行为的持续期。汉语以“期限是五个月”保留其时间限制，并与本章前文的五个月相呼应，而不推断受害者必定连续受伤整整五个月。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“螫针”略带书面色彩，但在蝎子意象中准确易懂；分号保留原句前后两部分的结构。未沿用英文资料中位置与内容不相符的脚注，因为“人”已自然传达τοὺς ἀνθρώπους的泛称意义。
