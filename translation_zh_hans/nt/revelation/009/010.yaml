- from: 它们有像蝎子一样的尾巴，也有螫针；它们伤害人的能力就在尾巴上，期限是五个月。
  to: 它们有像蝎子一样的尾巴，也有螫针；它们的尾巴中有伤害人的能力，能伤害人达五个月。
  rationale: 修订“尾巴上”为“尾巴中”，以对应ἐν ταῖς οὐραῖς αὐτῶν；并将五个月明确连于伤害行动的持续时间。其余措辞保留草稿对原文和异象体裁的准确、自然表达。
