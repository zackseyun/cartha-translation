  text: Καὶ ὁ πέμπτος ἄγγελος ἐσάλπισεν· καὶ εἶδον ἀστέρα ἐκ τοῦ οὐρανοῦ πεπτωκότα εἰς τὴν γῆν, καὶ ἐδόθη αὐτῷ ἡ κλεὶς τοῦ φρέατος τῆς ἀβύσσου·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/001.yaml
  text: And the fifth angel sounded the trumpet[a], and I saw a star that had fallen from heaven to the earth[c][b], and the key to the shaft of the abyss was given to him.
translation:
  language: zh_hans
  text: 第五位天使吹响了号筒；我看见一颗星，已经从天上坠落到地上[a]。通往深渊的竖井的钥匙赐给了他[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可较简洁地译作“一颗从天上坠落到地上的星”。原文的完成时分词很可能表示：约翰看见这颗星时，坠落已经发生。
    reason: lexical_alternative
  - marker: b
    text: 原文以阳性代词“他”指这颗“星”，可能暗示这星象征一位有位格的存在。φρέαρ可译为“井”“坑”或“竖井”；传统译法常将这里译作“无底坑”或“无底深坑”。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: 吹响了号筒
  rationale: σαλπίζω表示吹奏号筒；此译自然，并保留动词所含的号筒意象。
- source_word: ἀστέρα
  choice: 一颗星
  rationale: ἀστήρ的直接含义是“星”。尽管启示文学语境可能暗示有位格的存在，正文仍保留原有意象，不直接解释为天使或撒但。
- source_word: πεπτωκότα
  choice: 已经……坠落
  rationale: 完成时主动分词表示坠落已经发生，并且其结果状态仍然持续；“已经坠落”清楚表达约翰看见时这事已发生。
- source_word: ἐκ τοῦ οὐρανοῦ ... εἰς τὴν γῆν
  choice: 从天上……到地上
  rationale: 在启示录的异象语境中，οὐρανός宜译为“天上”；“天上—地上”保留原文的宇宙性对照。
- source_word: ἐδόθη αὐτῷ
  choice: 赐给了他
  rationale: 保留原文被动表达，不说明赐予者是谁；“他”也反映希腊文阳性代词，并与后续行动显示的位格性相符。
- source_word: ἡ κλεὶς
  choice: 钥匙
  rationale: κλείς意为钥匙；定指意义由具体所属关系“无底深渊竖井的”自然体现。
- source_word: τοῦ φρέατος
  choice: 竖井
  rationale: φρέαρ可指井、坑或竖井。译作“竖井”能将通往深渊的通道与深渊本身区分开来。
- source_word: τῆς ἀβύσσου
  choice: 无底深渊
  rationale: ἄβυσσος指深不可测的深处；“无底深渊”是现代读者易懂的启示文学用语，同时避免把φρέαρ和ἄβυσσος合并成一个概念。
theological_decisions:
- issue: 是否在正文中把“星”认定为天使或撒但
  choice: 保留“星”的意象，并以“他”反映原文的位格性提示
  alternative: 直接译作“天使”或“撒但”
  rationale: 经文以星来呈现这个对象，随后又用阳性代词指称他，却没有明确说明其身份。译文保留这种象征和身份上的开放性。
- issue: 是否明确说明钥匙是上帝赐下的
  choice: 保留不说明施事者的被动表达“赐给了他”
  alternative: 译作“上帝把钥匙赐给了他”
  rationale: 原文没有指出赐予者。虽然神圣被动的理解很可能成立，正文不应补出原文未明说的主语。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“吹响了号筒”符合异象叙事语体；用分号连接两项连续动作。保留“星”“赐给了他”和被动结构，以维持原文的象征性、位格性暗示及未明说施事者的张力。
