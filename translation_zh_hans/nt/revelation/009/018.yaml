    rationale: 该分词意为“出来、发出、流出”，并未明确喷射方式；“发出的”既自然，也适用于火、烟和硫磺三项。
  - severity: medium
    issue: 脚注“‘硫磺’传统译作‘硫黄’”不宜保留。
