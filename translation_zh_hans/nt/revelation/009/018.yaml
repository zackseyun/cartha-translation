  text: ἀπὸ τῶν τριῶν πληγῶν τούτων ἀπεκτάνθησαν τὸ τρίτον τῶν ἀνθρώπων, ⸀ἐκ τοῦ πυρὸς καὶ τοῦ καπνοῦ καὶ τοῦ θείου τοῦ ἐκπορευομένου ἐκ τῶν στομάτων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/018.yaml
  text: By these three plagues a third of mankind was killed—by the fire and the smoke and the sulfur coming out of their mouths[a][b].
translation:
  language: zh_hans
  text: 人类中有三分之一因这三样灾害而被杀：就是从它们口中发出的火、烟和硫磺。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπὸ τῶν τριῶν πληγῶν τούτων
  choice: 由于这三样灾害
  rationale: ἀπό在这里表示原因或致死的手段；“由于”自然地表达因果关系。保留τούτων的指示意味，以“这”回指上文所述。
- source_word: ἀπεκτάνθησαν
  choice: 被杀了
  rationale: 保留不定过去时被动语态所表达的受害意义；汉语以“被杀了”简洁呈现事件的完成。
- source_word: τὸ τρίτον τῶν ἀνθρώπων
  choice: 人类有三分之一
  rationale: τὸ τρίτον是部分表达，指总数的三分之一；ἄνθρωποι泛指人类，并非专指男性。
- source_word: ἐκ τοῦ πυρὸς καὶ τοῦ καπνοῦ καὶ τοῦ θείου
  choice: 就是……火、烟和硫磺
  rationale: ἐκ在此进一步说明三样灾害的具体来源或构成。中文用“就是”承接解释，三项并列清楚而庄重。
- source_word: τοῦ ἐκπορευομένου ἐκ τῶν στομάτων αὐτῶν
  choice: 从它们口中喷出的
  rationale: 现在分词描写这些物质持续从口中出来；结合火、烟和硫磺的异象，“喷出”比笼统的“出来”更鲜明自然。αὐτῶν回指上文异象中的马，故用“它们”。
theological_decisions:
- issue: 末世审判语境中ἀνθρώπων的范围
  choice: 人类
  alternative: 世人；人
  rationale: 原词泛指人类整体，不限定男性。“人类”既准确又符合庄重的异象审判语体，不额外界定被杀者的身份或神学类别。
- issue: 三样灾害与火、烟、硫磺之间的关系
  choice: 以“就是”表明后三者具体说明前三者
  alternative: 仅以破折号并列；译作“因火、烟和硫磺”
  rationale: 希腊文先总称“这三样灾害”，再以ἐκ短语列出火、烟和硫磺。中文用“就是”显明同位解释，同时不超出原文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式保留原文先总述三样灾害、后具体列举火烟硫磺的结构；避免古旧的“硫黄”正文形式，并以脚注保留传统译法。
