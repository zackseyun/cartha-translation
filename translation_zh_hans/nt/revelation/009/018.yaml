- from: 由于这三样灾害，就是从它们口中喷出的火、烟和硫磺，人类有三分之一被杀了。[a]
  to: 人类中有三分之一因这三样灾害而被杀：就是从它们口中发出的火、烟和硫磺。
  rationale: 修订保留ἀπό所表达的致死原因／手段、“这三样灾害”的回指、三分之一的部分意义、被动的死亡表述，以及火、烟、硫磺从其口中持续而出的异象。改用“发出的”避免将原文未明说的喷射方式具体化；删除无必要的术语脚注。
