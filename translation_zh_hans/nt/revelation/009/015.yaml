id: REV.9.15
reference: Revelation 9:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἐλύθησαν οἱ τέσσαρες ἄγγελοι οἱ ἡτοιμασμένοι εἰς τὴν ὥραν ⸀καὶ ἡμέραν καὶ μῆνα καὶ ἐνιαυτόν, ἵνα ἀποκτείνωσιν τὸ τρίτον τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/015.yaml
  text: And the four angels who had been prepared for the hour and day and month and year were released[b][a], so that they might kill a third of humanity.
translation:
  language: zh_hans
  text: 那四位为那一时、那一日、那一月、那一年预备好的天使被释放了，为要杀死人类的三分之一。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλύθησαν
  choice: 被释放了
  rationale: 该词是 λύω 的不定过去时被动式；结合上一节天使先前被捆绑的语境，“被释放了”自然地保留被动意义。
- source_word: οἱ τέσσαρες ἄγγελοι
  choice: 那四个天使
  rationale: 在《启示录》的异象语境中，ἄγγελοι 指超自然的天使；定冠词承接上文已经提到的四位天使。
- source_word: οἱ ἡτοιμασμένοι
  choice: 预备好的
  rationale: 完成时被动分词表示他们此前已经被预备，并处于准备就绪的状态；“预备好的”简洁保留这一结果状态。
- source_word: εἰς τὴν ὥραν καὶ ἡμέραν καὶ μῆνα καὶ ἐνιαυτόν
  choice: 为那时、那日、那月、那年
  rationale: 依照原文次序保留层层累加的时间表达。单一定冠词可统摄整个并列结构，突出所指定时间的准确性，但正文不把它解释成一段合计的时长。
- source_word: ἵνα ἀποκτείνωσιν
  choice: 要杀死
  rationale: ἵνα 加虚拟式在此表达目的；“要杀死”在现代汉语中清楚自然，也保留行动目的。
- source_word: τὸ τρίτον τῶν ἀνθρώπων
  choice: 人类的三分之一
  rationale: τὸ τρίτον 是部分表达，意为“三分之一”；ἀνθρώπων 泛指人类，并非仅指男性。
theological_decisions:
- issue: “那时、那日、那月、那年”所指的时间及其作用
  choice: 正文呈现一个被准确指定的时刻，并保留原文累加的时间措辞。
  alternative: 也可理解为“这一时、日、月、年”，或理解成合计为一年一月一日一时的一段时长。
  rationale: 原文较自然地把多个时间单位置于一个定冠词之下，强调特定安排；但启示文学的具体年代解释不应由译文替读者决定，因此以脚注提示歧义。
- issue: ἀνθρώπων 的范围
  choice: 人类
  alternative: 世人；人们
  rationale: 该词在此泛指人类整体，不限定男性；“人类”准确体现集合和部分关系。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“那时、那日、那月、那年”贴近原文的累加次序；“预备好的”“被释放了”清楚呈现先前预备及随后获释的关系。脚注标记均置于相关正文之后。
