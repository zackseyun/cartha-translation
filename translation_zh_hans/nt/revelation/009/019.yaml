id: REV.9.19
reference: Revelation 9:19
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἡ γὰρ ἐξουσία τῶν ἵππων ἐν τῷ στόματι αὐτῶν ἐστιν καὶ ἐν ταῖς οὐραῖς αὐτῶν· αἱ γὰρ οὐραὶ αὐτῶν ὅμοιαι ⸀ὄφεσιν, ἔχουσαι κεφαλάς, καὶ ἐν αὐταῖς ἀδικοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/019.yaml
  text: For the power of the horses is in their mouths and in their tails[a]; for their tails are like serpents, having heads[b], and with them they do harm.
translation:
  language: zh_hans
  text: 因为这些马的能力在它们口中，也在它们尾巴上；因为它们的尾巴像蛇，有头，并借着这些尾巴施害。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“在这些尾巴中，它们造成伤害”；这里的“在……中”表示借着这些尾巴施害。
    reason: 说明介词短语 ἐν αὐταῖς 的字面形式及其工具性含义。
lexical_decisions:
- source_word: ἐξουσία
  choice: 能力
  rationale: 这里指这些马借以造成伤害的实际力量或能力，并非主要强调受委任的权柄；“能力”自然贴合异象语境。
- source_word: στόματι
  choice: 口中
  rationale: 希腊文用单数配合复数所有格，具有逐一分配的意味；现代汉语用“在它们口中”即可自然表达。
- source_word: οὐραῖς
  choice: 尾巴
  rationale: 这是 οὐρά 的常规含义；中文量词式表达无需采用生硬的“诸尾”。
- source_word: ὅμοιαι ὄφεσιν
  choice: 像蛇
  rationale: ὄφις 指蛇；“像蛇”是自然、清楚而又忠实于异象画面的现代汉语。
- source_word: ἔχουσαι κεφαλάς
  choice: 并且有头
  rationale: 分词的阴性复数形式与“尾巴”呼应，说明这些像蛇的尾巴有头；保留原文鲜明而奇异的形象。
- source_word: ἀδικοῦσιν
  choice: 造成伤害
  rationale: ἀδικέω 在此指加害、伤害，而非抽象意义上的行不义；原文未明说受害对象，因此不增补“人”。
- source_word: ἐν αὐταῖς
  choice: 用这些尾巴
  rationale: ἐν 在这里表示凭借的工具或手段，阴性代词回指“尾巴”；明说“这些尾巴”可消除中文代词歧义。
- source_word: γὰρ
  choice: 因为／省略重复连接词
  rationale: 第一个 γάρ说明上文所述灾害的原因，译作“因为”；第二个继续解释能力为何也在尾巴上，中文以分号直接承接更自然，逻辑关系仍然清楚。
theological_decisions:
- issue: 马的尾巴像蛇且有头的启示文学意象
  choice: 按异象本身直接描述，不加寓意解释
  alternative: 把尾巴明确解释为假教导、邪灵势力或其他特定象征
  rationale: 希腊文本只呈现异象画面，并未在本节解释其象征意义；译文应保留其神秘性和张力，不把某一神学解释写入正文。
- issue: 伤害的对象
  choice: 译作“造成伤害”，不补出特定受害者
  alternative: 译作“伤人”或补出“他们”
  rationale: ἀδικοῦσιν 在本句没有明示宾语；虽然上下文可推知有人受害，正文仍不宜把隐含对象具体化。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“能力在……中”的结构略带异象文学的陌生感，刻意保留原文关于力量所在之处的表达；后半句用“这些尾巴”明确代词所指。
