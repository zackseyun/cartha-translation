  text: Καὶ ὁ ἕκτος ἄγγελος ἐσάλπισεν· καὶ ἤκουσα φωνὴν μίαν ἐκ ⸀τῶν κεράτων τοῦ θυσιαστηρίου τοῦ χρυσοῦ τοῦ ἐνώπιον τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/013.yaml
  text: And the sixth angel blew his trumpet[a], and I heard one voice from the horns of the golden altar that is before God,
translation:
  language: zh_hans
  text: 第六位天使吹响了号角；我听见一个声音[a]从上帝面前那座金坛的众角传来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“单一的声音”。希腊文强调这声音只有一个。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: 吹响了号角
  rationale: σαλπίζω指吹号或使号筒发声；汉语用“吹响了号角”自然清楚，也符合本段七号的异象背景。
- source_word: φωνὴν μίαν
  choice: 一个声音
  rationale: 保留μίαν所强调的单一性，同时不推断声音发出者的身份。
- source_word: ἐκ τῶν κεράτων
  choice: 从……坛的角上传来
  rationale: ἐκ表示来源；κέρατα是祭坛四角突出的角。“从……角上传来”在汉语中明确表达声音的来源，并保留圣所意象。
- source_word: θυσιαστηρίου τοῦ χρυσοῦ
  choice: 金坛
  rationale: “金坛”是简洁自然的现代汉语表达，保留祭坛由金构成或覆金的意象及其特指性。
- source_word: τοῦ ἐνώπιον τοῦ θεοῦ
  choice: 上帝面前那座
  rationale: ἐνώπιον表示位于某位面前或在其临在之处；此译法贴近原文，并自然修饰“金坛”。
- source_word: ἄγγελος
  choice: 天使
  rationale: 在《启示录》的异象语境中，此词指天上的使者，译作“天使”最为明确自然。
theological_decisions:
- issue: 声音的身份
  choice: 仅译作“一个声音”，不指明是谁的声音
  alternative: 译作“上帝的声音”、“一位天使的声音”或“与祭坛相关的声音”
  rationale: 希腊文只说约翰听见“一个声音”从金坛的角上传来，没有说明发声者；译文保留这一有意或客观存在的含混。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“第六位天使”与七号异象的连续叙事相符；以分号承接两个并列的καί分句。脚注标记置于其实际说明的“一个声音”之后，而非“号角”之后。
