  text: ⸀λέγοντα τῷ ἕκτῳ ἀγγέλῳ, ὁ ἔχων τὴν σάλπιγγα· Λῦσον τοὺς τέσσαρας ἀγγέλους τοὺς δεδεμένους ἐπὶ τῷ ποταμῷ τῷ μεγάλῳ Εὐφράτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/014.yaml
  text: saying to the sixth angel[a], the one who had the trumpet, “Release the four angels who are bound at the great river Euphrates.”
translation:
  language: zh_hans
  text: 对第六位天使，就是那拿着号筒的，说：“释放那四位被捆绑[a]在幼发拉底大河边的天使。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被捆绑”也可译作“已经被捆绑、如今仍受约束”。希腊文完成时分词强调：他们先前被捆绑，其结果持续到当时。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντα
  choice: 说
  rationale: 现在时分词承接上一节从祭坛发出的声音；中文以“说”自然衔接，同时保留其附属于前文的句法关系。
- source_word: τῷ ἕκτῳ ἀγγέλῳ
  choice: 对……第六位天使
  rationale: 与格作间接宾语；“第六位天使”符合现代汉语语序。
- source_word: ὁ ἔχων τὴν σάλπιγγα
  choice: 那位拿着号筒的
  rationale: 带冠词的分词短语用于进一步指明受命的天使；“拿着”保留ἔχω在场景中的持有含义，“号筒”适合启示录的吹号语境。
- source_word: Λῦσον
  choice: 释放
  rationale: λύω的不定过去时命令式，指解除约束；“释放”是自然、庄重且准确的现代汉语表达。
- source_word: τοὺς τέσσαρας ἀγγέλους
  choice: 那四位……天使
  rationale: 直接保留定冠词、数词和名词；量词“位”使中文自然。
- source_word: τοὺς δεδεμένους
  choice: 被捆绑……的
  rationale: 完成时被动分词表示先前受捆绑而目前仍处于受约束状态；正文采用自然的定语结构，脚注补明时态体意义。
- source_word: ἐπὶ τῷ ποταμῷ
  choice: 在……河边
  rationale: ἐπί加与格在此表示地点关系；“河边”自然表达他们被拘束于该河一带，而不武断限定为水面之上。
- source_word: τῷ μεγάλῳ Εὐφράτῃ
  choice: 幼发拉底大河
  rationale: 保留“大河”这一修饰语及专名；此语序符合现代汉语地名表达。
theological_decisions:
- issue: 四位天使的身份与道德性质
  choice: 仅译作“四位……天使”，不说明其为圣天使、堕落天使或审判天使。
  alternative: 译作“四位堕落的天使”或“四位奉派施行审判的天使”。
  rationale: 本节只说他们是被捆绑在幼发拉底大河边的天使；添加性质判断会消除原文保留的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。以“号筒”对应σάλπιγξ，以便与启示录吹号的上下文一致；句首保持承接上一节的残句形式，不擅自补出“有声音”等主语。
