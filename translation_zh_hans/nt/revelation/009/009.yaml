  text: καὶ εἶχον θώρακας ὡς θώρακας σιδηροῦς, καὶ ἡ φωνὴ τῶν πτερύγων αὐτῶν ὡς φωνὴ ἁρμάτων ἵππων πολλῶν τρεχόντων εἰς πόλεμον·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/009.yaml
  text: And they had breastplates like iron breastplates[a], and the sound of their wings was like the sound of many chariots with horses rushing into battle.
translation:
  language: zh_hans
  text: 它们有胸甲，像铁制的胸甲；它们翅膀的响声，好像许多马拉的战车奔赴战场时的响声。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译为：“好像许多奔赴战场的马所拉战车的响声。”希腊文中“奔赴”的分词在形式上可与这一战车和马的整体意象相关。
    reason: 保留“许多马”与“战车”的属格关联，并避免把分词的具体修饰对象作过度确定。
lexical_decisions:
- source_word: θώρακας
  choice: 胸甲
  rationale: 指遮护胸部或躯干的护甲；“胸甲”准确而简洁，也保留原文前后重复这一词的表达。
- source_word: ὡς θώρακας σιδηροῦς
  choice: 像铁制的胸甲
  rationale: ὡς明确表示比较；“像”保留异象中的明喻，“铁制的胸甲”自然表达σιδηροῦς。
- source_word: φωνὴ
  choice: 响声
  rationale: 此处指翅膀和战车所发出的声音，并非说话的“声音”；“响声”符合宏大而嘈杂的听觉意象。
- source_word: πτερύγων
  choice: 翅膀
  rationale: 直译πτέρυξ，并与所有格代词合为“它们翅膀的响声”。
- source_word: ἁρμάτων ἵππων πολλῶν
  choice: 许多马拉的战车
  rationale: 以现代汉语自然表达战车与马之间的属格关系，同时明确保留“马”和“战车”两个意象；脚注列出更贴近希腊语结构的译法。
- source_word: τρεχόντων
  choice: 奔赴
  rationale: τρέχω本义为“奔跑”；结合εἰς πόλεμον，“奔赴”既表现迅速前进，也不额外加入原文没有明说的解释。
- source_word: εἰς πόλεμον
  choice: 战场
  rationale: πόλεμος可指战争或战斗；在战车向前疾驰的具体画面中，“奔赴战场”是自然、鲜明的现代汉语。
theological_decisions:
- issue: 约翰异象中这些形象的性质
  choice: 按原文明喻直接呈现，不在译文中认定它们是现代机器、鬼魔或某种特定军队。
  alternative: 把这些形象明确解释为某一种实际或象征性的对象。
  rationale: 本节两次使用ὡς（“像、好像”），译文应保留启示文学意象及其可能解释的开放性，不替读者解决有争议的指涉问题。
- issue: τρεχόντων在“战车—马”短语中的关联
  choice: 在正文中用“许多马拉的战车奔赴战场”作整体动态描写。
  alternative: 明确限定为许多马在奔跑，或明确限定为许多战车在疾驰。
  rationale: 希腊语属格复数分词在形式上可与相邻意象形成关联；整体化表达既通顺，又避免过度锁定修饰对象。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“胸甲”保留专业而常见的军事用语；分号呈现原文两个并列分句。“奔赴战场”使动态画面自然有力，同时不对启示文学意象作教派性解释。
