id: REV.9.17
reference: Revelation 9:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ οὕτως εἶδον τοὺς ἵππους ἐν τῇ ὁράσει καὶ τοὺς καθημένους ἐπ’ αὐτῶν, ἔχοντας θώρακας πυρίνους καὶ ὑακινθίνους καὶ θειώδεις· καὶ αἱ κεφαλαὶ τῶν ἵππων ὡς κεφαλαὶ λεόντων, καὶ ἐκ τῶν στομάτων αὐτῶν ἐκπορεύεται πῦρ καὶ καπνὸς καὶ θεῖον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/017.yaml
  text: And this is how I saw the horses in the vision, and those sitting on them[a]—they had breastplates fiery red and hyacinth-blue and sulfur-yellow; and the heads of the horses were like lions’ heads[b], and out of their mouths come fire and smoke and sulfur.
translation:
  language: zh_hans
  text: 我在异象中这样看见那些马和骑在马上的人：他们穿着火焰般、风信子色和硫磺般的胸甲[a]；那些马的头好像狮子的头，火、烟和硫磺从它们口中出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可较贴近字面译为“如火、风信子色和如硫磺的胸甲”。这些形容词在此可能带有色彩联想，也可能较宽泛地描写其性质；原文没有明确指定红、蓝、黄等具体色相。
    reason: 保留三个希腊形容词在颜色描写与性质描写之间的语义幅度，避免将未明说的具体色相固定为正文含义。
lexical_decisions:
- source_word: οὕτως
  choice: 是这样的
  rationale: 表达所见景象的样态，既保留指示意味，也符合现代汉语叙述习惯。
- source_word: ἐν τῇ ὁράσει
  choice: 在异象中
  rationale: 《启示录》的语境是先知性的异象经历，而不只是外在的视觉形貌。
- source_word: τοὺς καθημένους ἐπ’ αὐτῶν
  choice: 骑在马上的人
  rationale: 明确保留“坐在它们上面”的关系，同时采用自然的现代汉语表达。
- source_word: θώρακας
  choice: 胸甲
  rationale: 保留具体的护胸甲胄意象，较笼统的“盔甲”更贴近原词。
- source_word: πυρίνους
  choice: 火红色
  rationale: 在三个并列的视觉形容词中表达火的色彩联想，同时以脚注保留“火一般”的较形式化理解。
- source_word: ὑακινθίνους
  choice: 风信子蓝色
  rationale: 保留与ὑάκινθος相关的名称和深蓝至蓝紫的传统色彩联想，避免只译“蓝色”而丢失原有意象。
- source_word: θειώδεις
  choice: 硫磺黄色
  rationale: 在胸甲的视觉描写中表达硫磺的黄色联想，同时不把它与句末作为物质的“硫磺”混同。
- source_word: ὡς κεφαλαὶ λεόντων
  choice: 像狮子的头
  rationale: 直接保留ὡς所标示的明喻，不把马头解释成真正的狮头。
- source_word: ἐκπορεύεται
  choice: 正……喷出
  rationale: 用进行意味保留希腊文的现在时及其鲜明动态；“喷出”适合火、烟和硫磺从口中涌出的可怖图景。
- source_word: θεῖον
  choice: 硫磺
  rationale: 采用现代通行名称，清楚表达该物质，避免较古旧或可能含混的说法。
theological_decisions:
- issue: 胸甲三个形容词是颜色描写，还是较宽泛的性质描写
  choice: 正文译作“火红色、风信子蓝色和硫磺黄色”，脚注说明较直译的可能性。
  alternative: 译作“火一般、风信子色、硫磺一般”，不明确补出红、蓝、黄。
  rationale: 异象语境和三个并列形容词支持视觉色彩理解，但原词本身仍可表示与火、风信子和硫磺相似的性质，因此用脚注保留其语义张力。
- issue: ἔχοντας所指的是骑马者，还是马和骑马者整体
  choice: 以“他们”承接就近的“骑在马上的人”，理解为骑马者穿着胸甲。
  alternative: 让该分词同时修饰马和骑马者。
  rationale: 虽然希腊语阳性复数宾格在形式上可能产生句法范围上的含混，但胸甲通常是骑马者的装备，就近先行项也是骑马者；中文用代词承接，不添加额外身份或教义解释。
translation_notes:
  register: 采用现代、庄重而具画面感的叙述。保留异象的并列节奏和现在时的鲜明效果；“风信子蓝色”兼顾原词意象与普通读者的可理解性。
