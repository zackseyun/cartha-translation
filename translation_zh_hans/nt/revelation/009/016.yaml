base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/016.yaml
  text: And the number of the troops of the cavalry was two hundred million; I heard their number.
translation:
  language: zh_hans
  text: 骑兵部队的数目是两亿[a]；我听见了他们的数目。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译：“两万乘以万”，即两亿。
    reason: 保留希腊文数字表达的字面构成，同时说明其数值。
lexical_decisions:
- source_word: ἀριθμὸς
  choice: 数目
  rationale: 对应“数目、总数”，并在前后两处重复，以保留希腊文的呼应。
- source_word: στρατευμάτων
  choice: 部队
  rationale: 该词可指军队或军事力量；与“骑兵”连用时，“骑兵部队”自然地表达其军事编制与集合意义。
- source_word: ἱππικοῦ
  choice: 骑兵
  rationale: 这里是集合性用法，指骑兵或骑乘部队；“骑兵”比“骑马的人”更简洁准确。
- source_word: δισμυριάδες μυριάδων
  choice: 两亿
  rationale: 该表达按字面构成为“两个万乘万”，即二亿；正文用现代读者易懂的确定数值，脚注保留原文的表达形式。
- source_word: ἤκουσα
  choice: 我听见了
  rationale: 直译简单过去叙事动作，符合现代汉语表达。
- source_word: αὐτῶν
  choice: 他们的
  rationale: 代词回指骑兵部队中的人员；中文用“他们的数目”自然，并保留原文重复。
