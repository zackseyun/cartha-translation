  text: Καὶ τὰ ὁμοιώματα τῶν ἀκρίδων ὅμοια ἵπποις ἡτοιμασμένοις εἰς πόλεμον, καὶ ἐπὶ τὰς κεφαλὰς αὐτῶν ὡς στέφανοι ⸂ὅμοιοι χρυσῷ⸃, καὶ τὰ πρόσωπα αὐτῶν ὡς πρόσωπα ἀνθρώπων,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/007.yaml
  text: And the appearance of the locusts was like horses prepared for battle[a], and on their heads were what seemed to be crowns like gold, and their faces were like human faces[b],
translation:
  language: zh_hans
  text: 这些蝗虫的样子好像预备出战的马；它们头上仿佛有金子般的冠冕[a]，脸好像人的脸[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “冠冕”或译“花冠、得胜者的冠冕”；希腊词στέφανοι可指与尊荣或得胜有关的环状冠饰。
    reason: lexical_alternative
  - marker: b
    text: 希腊原文直译为“人的脸”，泛指人类，并非特指男性。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ὁμοιώματα τῶν ἀκρίδων
  choice: 这些蝗虫的形状
  rationale: ὁμοίωμα可指形状、外观或样式。这里描写异象中所见的形态；“形状”自然简洁，也不把比拟当作实体身份。
- source_word: ὅμοια ἵπποις ἡτοιμασμένοις εἰς πόλεμον
  choice: 好像预备出战的马
  rationale: 保留ὅμοια的比较意味，并以“预备出战”表达完成时被动分词所呈现的整装待发状态。
- source_word: ὡς στέφανοι ὅμοιοι χρυσῷ
  choice: 仿佛戴着金子般的冠冕
  rationale: 连续保留ὡς与ὅμοιοι所表达的表象和相似性。“金子般”表示像金子，而不断定其材质就是金子；“戴着”是根据冠冕位于头上的自然汉语表达。
- source_word: στέφανοι
  choice: 冠冕
  rationale: στέφανος可指冠冕或花冠，常与荣誉、得胜相关。“冠冕”适合庄重的异象语境，其他可能含义置于脚注。
- source_word: τὰ πρόσωπα αὐτῶν ὡς πρόσωπα ἀνθρώπων
  choice: 脸好像人的脸
  rationale: 直承原文的重复比拟；ἀνθρώπων泛指人类，并非特指男性，因此译作“人的”。
theological_decisions:
- issue: 启示文学异象中的连续比拟
  choice: 用“好像”“仿佛”“……般”保留各层比较
  alternative: 把冠冕或金质写成确定事实
  rationale: 原文反复使用ὅμοια、ὡς和ὅμοιοι，强调所见之物的相似性；译文不把异象中的表象断言为其实际本体或材质。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。用分号分隔马匹比喻与头脸描写，使长句层次清楚；保留异象语言的重复和不确定性。
