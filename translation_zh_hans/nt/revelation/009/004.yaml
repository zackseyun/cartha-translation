id: REV.9.4
reference: Revelation 9:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἐρρέθη αὐταῖς ἵνα μὴ ⸀ἀδικήσουσιν τὸν χόρτον τῆς γῆς οὐδὲ πᾶν χλωρὸν οὐδὲ πᾶν δένδρον, εἰ μὴ τοὺς ἀνθρώπους οἵτινες οὐκ ἔχουσι τὴν σφραγῖδα τοῦ θεοῦ ἐπὶ τῶν ⸀μετώπων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/004.yaml
  text: And they were told not to harm the grass of the earth[a], or any green thing, or any tree, but only the people who do not have the seal of God on their foreheads.
translation:
  language: zh_hans
  text: 它们奉命不可伤害地上的草、任何青绿之物或任何树木，而只可伤害那些额上没有上帝印记的人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐρρέθη αὐταῖς
  choice: 有话吩咐它们
  rationale: 保留被动、未明说发话者的表达，同时传达语境中权威性的指示；“它们”承接前文的蝗虫。
- source_word: ἵνα μὴ ἀδικήσουσιν
  choice: 不可伤害
  rationale: ἀδικέω在此审判异象中指造成伤害；“不可”自然表达否定指令。
- source_word: τὸν χόρτον τῆς γῆς
  choice: 地上的草
  rationale: χόρτος在此指草，τῆς γῆς译作“地上的”，符合现代汉语并保留范围关系。
- source_word: οὐδὲ πᾶν χλωρόν
  choice: 任何青绿之物
  rationale: χλωρόν是名词化形容词，直指任何青绿的东西；不把含义收窄为某一种植物。
- source_word: οὐδὲ πᾶν δένδρον
  choice: 任何树木
  rationale: 准确表达δένδρον，并与前面的植被类别并列。
- source_word: εἰ μὴ
  choice: 只可
  rationale: 在否定禁令之后引出唯一获准伤害的对象，比单用“除了”更清楚。
- source_word: τοὺς ἀνθρώπους
  choice: 那些……的人
  rationale: ἄνθρωποι泛指人类，不限男性；汉语“人”自然且准确。
- source_word: οἵτινες οὐκ ἔχουσι
  choice: 那些……没有……的人
  rationale: 自然表达限定性描述，同时保留原文否定。
- source_word: τὴν σφραγῖδα τοῦ θεοῦ
  choice: 上帝印记
  rationale: σφραγίς译作“印记”，保留启示文学中归属与保护的标识意象；属格以汉语定中结构表达。
- source_word: ἐπὶ τῶν μετώπων
  choice: 额上
  rationale: 准确、简洁地表达印记所在的前额部位。
theological_decisions:
- issue: 被动指令的发话者
  choice: 用“有话吩咐”，不明说发话者
  alternative: “上帝吩咐它们”或“它们奉命”
  rationale: ἐρρέθη是被动式，原文没有指出发话者；译文保留这一含蓄性，不把语境推断写入正文。
- issue: τοὺς ἀνθρώπους的范围
  choice: 泛指“人”
  alternative: 仅指男性的“男人”
  rationale: 上下文对比的是植物与人类，并无把对象限定为男性的依据。
- issue: 上帝印记的功能
  choice: 仅陈述这些人有无印记
  alternative: 在正文中解释为得救、拣选或绝对免受一切伤害
  rationale: 本节明确的是这次灾害不得伤害有印记者；译文不额外界定印记的全部神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“有话吩咐它们”兼顾汉语自然度、权威语气和原文未明说施事者的被动结构；“青绿之物”保留πᾶν χλωρόν的宽泛措辞。
