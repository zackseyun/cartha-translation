  text: καὶ ἐδόθη ⸀αὐτοῖς ἵνα μὴ ἀποκτείνωσιν αὐτούς, ἀλλ’ ἵνα ⸀βασανισθήσονται μῆνας πέντε· καὶ ὁ βασανισμὸς αὐτῶν ὡς βασανισμὸς σκορπίου, ὅταν παίσῃ ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/005.yaml
  text: And it was given to them that they should not kill them[a], but that they should be tormented for five months[b]; and their torment was like the torment of a scorpion when it strikes a man.
translation:
  language: zh_hans
  text: 它们得到准许：不可杀害那些人，只可使他们受折磨五个月；它们所施的折磨，就像蝎子蜇[a]人时的折磨。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊语直译为“击打”；在蝎子的语境中，指用尾刺蜇人。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδόθη αὐτοῖς
  choice: 它们获准
  rationale: 以未说明许可者的被动表达，保留启示文学中常见的神圣被动及其含蓄性；不擅自补出“上帝”或“权柄”。
- source_word: ἵνα μὴ ἀποκτείνωσιν αὐτούς
  choice: 不可杀死那些人
  rationale: 表达所获许可中的限制，并以“那些人”清楚承接受害者。
- source_word: ἀλλ’ ἵνα βασανισθήσονται μῆνας πέντε
  choice: 只可使他们受折磨五个月
  rationale: 把不寻常的ἵνα加将来被动式理解为许可所指向的结果；“受折磨”保留被动意义，“五个月”自然表达持续时间。
- source_word: βασανισθήσονται / βασανισμός
  choice: 受折磨／折磨
  rationale: 重复使用同一词根的译语，保留原文动词与名词的呼应，也传达强烈痛苦而不限定为司法酷刑。
- source_word: ὁ βασανισμὸς αὐτῶν
  choice: 他们所受的折磨
  rationale: 依紧邻语境，将代词理解为遭受折磨的人；中文用“所受”明确其被动经历，避免把“他们的折磨”误解为他们施加的折磨。
- source_word: ὡς βασανισμὸς σκορπίου
  choice: 就像蝎子……所造成的折磨
  rationale: 保留比较关系和“折磨”的词语重复，同时使中文表达自然。
- source_word: ὅταν παίσῃ
  choice: 蜇
  rationale: παίω本义为击打，但以蝎子为主语时，中文惯用“蜇”，准确呈现具体情景；较直译的说法列入脚注。
- source_word: ἄνθρωπον
  choice: 人
  rationale: 此处为泛指单数；现代汉语“人”自然涵盖任何人，无须添加性别含义。
theological_decisions:
- issue: 启示文学审判语境中的神圣被动
  choice: 保留未说明许可者的表达“它们获准”
  alternative: 上帝准许它们／有权柄赐给它们
  rationale: 原文未明说赐予者，也未出现“权柄”一词；译文既表达许可，又不把隐含的施行者明文化。
- issue: ἵνα与将来被动式的异常搭配
  choice: 译为许可所规定的结果：“只可使他们受折磨”
  alternative: 而他们将受折磨／只是为了折磨他们
  rationale: 这种结构兼有内容、目的和结果色彩；译文不把它收窄为单一的目的陈述，并与前面的禁止形成对照。
- issue: ὁ βασανισμὸς αὐτῶν中代词所指
  choice: 理解为受害者所受的折磨
  alternative: 它们所施加的折磨
  rationale: 前句被动式的主语是遭受折磨的人，随后“他们所受的折磨”最自然地延续这一指称；比较的也是受苦经验。
translation_notes:
  register: 采用现代、庄重而易懂的书面语。“获准不可……只可……”呈现许可及其严格界限；“折磨”保留原文词根重复和强烈程度。
