  text: ⸂ἔχουσιν ἐπ’ αὐτῶν βασιλέα τὸν⸃ ἄγγελον τῆς ἀβύσσου· ὄνομα αὐτῷ Ἑβραϊστὶ Ἀβαδδών ⸂καὶ ἐν⸃ τῇ Ἑλληνικῇ ὄνομα ἔχει Ἀπολλύων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/011.yaml
  text: They have over them as king the angel of the abyss[a]. His name in Hebrew is Abaddon[c][b], and in Greek he has the name Apollyon.
translation:
  language: zh_hans
  text: '它们有深渊[a]的天使作王统领它们。他的名字用希伯来语说是“亚巴顿”[b]，用希腊语说是“亚玻伦”[c]。


    [a] “深渊”也可译作“无底坑”。


    [b] “亚巴顿”是希伯来语名字，意思与“毁灭”有关。


    [c] “亚玻伦”是希腊语名字，意思是“毁灭者”。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “深渊”也可译作“无底坑”。
    reason: 提供ἄβυσσος的传统替代译法。
  - marker: b
    text: “亚巴顿”是希伯来语名字，意思与“毁灭”有关。
    reason: 说明音译专名背后的希伯来语语义，同时避免把其语义范围过度限定为单一释义。
  - marker: c
    text: “亚玻伦”是希腊语名字，意思是“毁灭者”。
    reason: 保留希腊名字Ἀπολλύων清楚可辨的语义。
lexical_decisions:
- source_word: ἔχουσιν ἐπ’ αὐτῶν βασιλέα
  choice: 它们有……作王，统领它们
  rationale: 保留希腊文“有一位王在它们之上”的结构与君王意象，同时用“统领它们”自然表达ἐπ’ αὐτῶν所表示的管辖关系。
- source_word: τὸν ἄγγελον τῆς ἀβύσσου
  choice: 深渊的天使
  rationale: ἄγγελος在《启示录》的此类语境中指“天使”；ἄβυσσος直译为“深渊”，比传统的“无底坑”少一层解释。
- source_word: Ἑβραϊστὶ Ἀβαδδών
  choice: 希伯来语的名字是“亚巴顿”
  rationale: 将作为专名的Ἀβαδδών音译，并在脚注说明其与“毁灭”相关的词义。
- source_word: ἐν τῇ Ἑλληνικῇ ὄνομα ἔχει Ἀπολλύων
  choice: 希腊语的名字是“亚玻伦”
  rationale: 采用现代中文圣经读者较熟悉的专名音译；Ἀπολλύων所含“毁灭者”之义在脚注中保留。
theological_decisions:
- issue: Ἀβαδδών与Ἀπολλύων应音译还是意译
  choice: 正文分别音译为“亚巴顿”和“亚玻伦”，脚注说明词义
  alternative: 正文译作“毁灭”与“毁灭者”
  rationale: 两词在本节明确充当名字；音译保留其专名功能，而脚注又使两个名字的毁灭语义不致丢失。
- issue: ἀβύσσου的译法
  choice: 深渊
  alternative: 无底坑
  rationale: “深渊”更直接对应ἄβυσσος，也不把“无底”这一解释直接写入正文；传统译法列入脚注。
- issue: τῆς ἀβύσσου所表达的关系
  choice: 保留为“深渊的天使”
  alternative: 来自深渊的天使／掌管深渊的天使
  rationale: 希腊文属格本身未明确限定为来源或管辖，因此不在正文中替作者消除这一含混。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“作王，统领它们”既保留原文的君王意象，也让“在它们之上”的关系在中文中清楚自然；正文不把“深渊的天使”解释成“来自”或“掌管”深渊，以保留属格关系的含混。
