  text: Ἡ οὐαὶ ἡ μία ἀπῆλθεν· ἰδοὺ ἔρχεται ἔτι δύο οὐαὶ μετὰ ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/012.yaml
  text: The first woe has passed[a]. Behold[b], two woes are still coming after these things.
translation:
  language: zh_hans
  text: 第一样灾祸过去了[a]。看哪，此后还有两样灾祸要来[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那一样灾祸过去了。”希腊文直译为“那一个灾祸”，上下文表明这是三样灾祸中的第一样。
    reason: lexical_alternative
  - marker: b
    text: 或译：“看哪，在这些事以后，另有两样灾祸要来。”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐαί
  choice: 灾祸
  rationale: 此处名词化，指启示录中依次临到的审判性灾难；“灾祸”既自然，又保留其庄严、可怕的宣告意味。
- source_word: ἡ μία
  choice: 第一样
  rationale: 字面是“那一个”，但上下文将三样灾祸依次编号，因此译作序数性的“第一样”，同时用量词与后文“两样”呼应。
- source_word: ἀπῆλθεν
  choice: 过去了
  rationale: 表达第一样灾祸已经结束；比空间性的“离去了”更符合现代汉语对事件告一段落的说法。
- source_word: ἰδού
  choice: 看哪
  rationale: 保留先知性话语中唤起注意、加强警示的功能，也符合启示文学庄重的语体。
- source_word: ἔρχεται
  choice: 要来
  rationale: 以自然汉语表达其即将临到的动态和前瞻性；希腊文虽用单数动词搭配复数主语，中文无需形式对应。
- source_word: ἔτι
  choice: 还有
  rationale: 表示第一样之后仍余下两样，现代汉语中与“两样灾祸要来”搭配自然。
- source_word: μετὰ ταῦτα
  choice: 此后
  rationale: 简洁表达时间和次序上的“在这些事以后”；比直译“这些事以后”更自然，同时不增添具体所指。
theological_decisions:
- issue: 三样灾祸的启示文学次序
  choice: 译作第一样灾祸已经过去，此后另有两样将来
  alternative: 把οὐαί泛化为“审判”或仅译作一般的“灾难”
  rationale: 保留重复的“灾祸”称谓和编号结构，呈现异象中逐次展开的审判，却不对这些灾祸的性质或时间作额外解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”保留启示文学的警示语气；“第一样／两样”清楚呈现系列关系。所有脚注标记均置于正文对应位置。
