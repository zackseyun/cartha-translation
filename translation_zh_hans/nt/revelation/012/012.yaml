id: REV.12.12
reference: Revelation 12:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: διὰ τοῦτο εὐφραίνεσθε, ⸀οἱ οὐρανοὶ καὶ οἱ ἐν αὐτοῖς σκηνοῦντες. οὐαὶ ⸂τὴν γῆν καὶ τὴν θάλασσαν⸃, ὅτι κατέβη ὁ διάβολος πρὸς ὑμᾶς, ἔχων θυμὸν μέγαν, εἰδὼς ὅτι ὀλίγον καιρὸν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/012.yaml
  text: Therefore rejoice[a], O heavens, and you who dwell in them. Woe to the earth and the sea, because the devil has come down to you with great fury[c][b], knowing that he has only a little time.
translation:
  language: zh_hans
  text: 所以，诸天哪，和住在其中的人，你们都要欢喜！地[a]和海有祸了！因为魔鬼已经下到你们那里，怀着极大的愤怒[b]，知道自己的时间不多了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “地”也可译作“陆地”。希腊文γῆ既可指大地，也可指陆地。
    reason: lexical_alternative
  - marker: b
    text: “愤怒”也可译作“烈怒”或“怒气”。这里的希腊词表示强烈的怒气。
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: 所以
  rationale: 承接上文天上的得胜及控告者被摔下之事，简洁地保留推论关系。
- source_word: εὐφραίνεσθε
  choice: 你们都要欢喜
  rationale: 保留命令语气；“欢喜”庄重而又是现代汉语中易懂的表达。
- source_word: οἱ οὐρανοὶ
  choice: 诸天哪
  rationale: 该主格形式在此作呼语；“诸天哪”既显明直接呼告，也保留复数和启示文学的庄重语体。
- source_word: οἱ ἐν αὐτοῖς σκηνοῦντες
  choice: 住在其中的人
  rationale: σκηνόω本有搭帐幕、居住之意，此处指居于诸天者；译作“住在其中”自然清楚，不把“帐幕”的字面意象强加于本句。
- source_word: οὐαὶ
  choice: 有祸了
  rationale: 传达先知性灾祸宣告，同时符合现代汉语表达。
- source_word: τὴν γῆν καὶ τὴν θάλασσαν
  choice: 地和海
  rationale: γῆ可指大地或陆地；与“海”并列时，“地”能保留两种理解，并符合全节的宇宙性对照。
- source_word: κατέβη
  choice: 已经下到
  rationale: 表达已发生且对当前仍有后果的下降行动；“下到”也保留从天上到地上领域的空间方向。
- source_word: ὁ διάβολος
  choice: 魔鬼
  rationale: 在本语境中是撒但的固定称号；“魔鬼”是现代中文圣经语境中清楚而通行的对应词。
- source_word: πρὸς ὑμᾶς
  choice: 到你们那里
  rationale: 保留朝向并抵达受话对象所在领域的意思，不额外将介词解释为“攻击”。
- source_word: ἔχων θυμὸν μέγαν
  choice: 怀着极大的愤怒
  rationale: 较贴近“有极大的θυμός”的结构，也清楚表达强烈、爆发性的怒气。
- source_word: εἰδὼς
  choice: 知道
  rationale: 保留与魔鬼下降及怀怒同时发生的认知状态，中文分句自然流畅。
- source_word: ὀλίγον καιρὸν ἔχει
  choice: 知道自己的时间不多了
  rationale: 自然表达其可用的期限短暂；“自己的”明确希腊文ἔχει的主语关系，“了”传达当前已进入短暂余期的语境含义。
theological_decisions:
- issue: “魔鬼已经下到你们那里”中“你们”的所指
  choice: 让“你们”在行文上自然指向刚被宣告有祸的“地和海”，但不在正文中增添“地上的居民”等解释语。
  alternative: 把“你们”理解为继续呼告诸天及住在其中的人。
  rationale: 紧邻的“地和海有祸了”最自然地构成“你们”的对象领域；但原文使用第二人称代词而未明说居民，因此译文保留代词，避免过度释义。
- issue: 魔鬼所剩期限的性质
  choice: 译作“自己的时间不多了”，只陈述期限短暂。
  alternative: 释作末日以前、受审判以前或其活动机会所剩的特定期限。
  rationale: καιρός可表示一段特定时期或机会，但本节没有进一步界定其终点；译文不把任何特定末世论体系带入正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“诸天哪”保留启示文学中的呼告语气；“有祸了”保留警告和审判宣告的力度。正文避免生硬直译“支搭帐幕”，也不添加原文未明说的末世论解释。
