id: REV.12.10
reference: Revelation 12:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ ἤκουσα φωνὴν μεγάλην ἐν τῷ οὐρανῷ λέγουσαν· Ἄρτι ἐγένετο ἡ σωτηρία καὶ ἡ δύναμις καὶ ἡ βασιλεία τοῦ θεοῦ ἡμῶν καὶ ἡ ἐξουσία τοῦ χριστοῦ αὐτοῦ, ὅτι ἐβλήθη ὁ ⸀κατήγωρ τῶν ἀδελφῶν ἡμῶν, ὁ κατηγορῶν ⸀αὐτοὺς ἐνώπιον τοῦ θεοῦ ἡμῶν ἡμέρας καὶ νυκτός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/010.yaml
  text: And I heard a loud voice in heaven saying[a], “Now have come the salvation and the power and the kingdom of our God, and the authority of his Messiah, because the accuser of our brothers has been thrown down[b], the one who accuses them before our God day and night.”
translation:
  language: zh_hans
  text: 我听见天上有一个响亮的声音说：“现在，我们上帝的救恩、能力和国度，以及他的弥赛亚的权柄，都已经来到！因为那控告我们弟兄[a]的人已经被摔下了；他就是那昼夜在我们上帝面前控告他们的人。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄”在这里可泛指同属信仰群体的人，包括女性。
    reason: 说明希腊文阳性复数ἀδελφῶν在此可能具有群体性的广义所指。
lexical_decisions:
- source_word: φωνὴν μεγάλην
  choice: 响亮的声音
  rationale: μέγας修饰φωνή时表示音量大；“响亮”比直译“大的声音”更符合现代汉语。
- source_word: Ἄρτι ἐγένετο
  choice: 现在……都已经彰显了
  rationale: ἄρτι标明决定性的当前时刻；ἐγένετο表示所列诸事已成为现实。汉语“已经彰显”既传达结果状态，也适合天上宣告胜利的语境，同时避免把救恩理解为此前不存在。
- source_word: ἡ σωτηρία καὶ ἡ δύναμις καὶ ἡ βασιλεία τοῦ θεοῦ ἡμῶν
  choice: 我们上帝的救恩、能力和国度
  rationale: 保留三个并列名词及“我们的上帝”这一关系；βασιλεία可指王权或国度，此处用传统而清楚的“国度”，不排除其统治之意。
- source_word: ἡ ἐξουσία τοῦ χριστοῦ αὐτοῦ
  choice: 他所立的弥赛亚的权柄
  rationale: ἐξουσία译作“权柄”，与δύναμις“能力”区分；χριστός在此是上帝受膏君王的称号，译作“弥赛亚”，“所立的”自然表达其属于上帝而不把称号当作姓名。
- source_word: ἐβλήθη
  choice: 已经被摔下去了
  rationale: 被动形式描绘强制性的向下抛落，与本章从天上被摔下的场景相合；“摔下去”比“赶出去”更保留方向意象。
- source_word: ὁ κατήγωρ ... ὁ κατηγορῶν
  choice: 那控告……的……他就是那……控告……的
  rationale: 以“控告”对应名词与分词的词根重复，保留司法色彩及原文的强调性同位说明。
- source_word: ἡμέρας καὶ νυκτός
  choice: 昼夜
  rationale: 简洁、庄重地表达持续不断的“白天和夜间”。
theological_decisions:
- issue: Χριστός的称号含义
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处τοῦ χριστοῦ αὐτοῦ意为上帝的受膏者，是职分性称号。“弥赛亚”凸显受膏君王之义；加“所立的”帮助现代读者自然理解αὐτοῦ的所属关系，但不添加特定宗派解释。
- issue: Ἄρτι ἐγένετο所表达的实现方式
  choice: 现在……都已经彰显了
  alternative: 现在……已经来到了／成就了
  rationale: 宣告强调上帝的救恩、能力、国度和弥赛亚权柄此刻在胜利事件中成为明显现实。“彰显”保留末世性的实现张力，不暗示这些此前完全不存在。
- issue: ἀδελφῶν的性别与群体所指
  choice: 弟兄
  alternative: 弟兄姊妹／信徒同伴
  rationale: 主文保留阳性复数的形式和经文的亲属群体称谓；脚注说明在此可统指信徒群体，包括女性。
- issue: βασιλεία的语义
  choice: 国度
  alternative: 统治／王权
  rationale: “国度”符合启示文学的庄重语域，也可承载上帝施行王权的含义；不在正文中单方面消除“领域”与“统治”的语义张力。
translation_notes:
  register: 采用现代、庄重且适合公开诵读的简体中文。保留原文从宏大宣告转入控告者被摔下的因果结构，并以重复的“控告”再现司法意象。脚注标记[a]已置于相关句末。
