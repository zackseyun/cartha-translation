id: REV.12.14
reference: Revelation 12:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἐδόθησαν τῇ γυναικὶ ⸀αἱ δύο πτέρυγες τοῦ ἀετοῦ τοῦ μεγάλου, ἵνα πέτηται εἰς τὴν ἔρημον εἰς τὸν τόπον αὐτῆς, ⸂ὅπου τρέφεται⸃ ἐκεῖ καιρὸν καὶ καιροὺς καὶ ἥμισυ καιροῦ ἀπὸ προσώπου τοῦ ὄφεως.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/014.yaml
  text: And the woman was given the two wings of the great eagle, so that she might fly into the wilderness to her place, where she is nourished there for a time and times and half a time, away from the presence of the serpent.
translation:
  language: zh_hans
  text: 于是，那妇人被赐给那大鹰的两只翅膀，好让她飞往旷野，到她自己的地方去；她要在那里、在远离那蛇之处，受到供养，一个时期、若干时期和半个时期。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一个时期、若干时期和半个时期”直译希腊文的“一个时期、时期们和半个时期”。这是启示文学中的固定表达，通常理解为三个半时期；但本节本身没有说明每个时期的具体长度。
    reason: 说明该短语的字面形式及其未明定具体历法长度的性质，同时不把复数“时期”译成确定的“两载”。
lexical_decisions:
- source_word: ἐδόθησαν
  choice: 得了
  rationale: 保留神学被动式所暗示的赐予，同时符合现代汉语表达。
- source_word: αἱ δύο πτέρυγες τοῦ ἀετοῦ τοῦ μεγάλου
  choice: 大鹰的两只翅膀
  rationale: 按原文定冠结构直译，不将鹰的象征意义具体化。
- source_word: τὴν ἔρημον
  choice: 旷野
  rationale: 采用圣经语境中自然且常见的对应词，兼具荒凉与庇护之意。
- source_word: τρέφεται
  choice: 得到供养
  rationale: 原词为现在时被动，可指被喂养、养育或维持；此译保留施事者未明的被动意义。
- source_word: ἀπὸ προσώπου τοῦ ὄφεως
  choice: 躲避那蛇
  rationale: 该短语字面为“离开那蛇的面”，在此表示远离其面前或威胁；译为“躲避”使汉语自然，又不增添逃脱方式。
- source_word: καιρὸν καὶ καιροὺς καὶ ἥμισυ καιροῦ
  choice: 一载、两载、半载
  rationale: 保留单数、复数及半个时期的固定启示文学表达；“载”体现时段含义而不直接替换为解释性的“三年半”。
theological_decisions:
- issue: 妇人所代表的对象
  choice: 不作解释，仅译作“那妇人”
  alternative: 明确解释为以色列、教会或马利亚
  rationale: 本节原文没有在此直接界定其单一所指，译文不导入宗派性认定。
- issue: 供养者的身份
  choice: 使用被动式“得到供养”
  alternative: 补明为“神供养她”
  rationale: 原文未明说施事者，虽然上下文可能暗示神的保护，译文仍保留原有含蓄。
- issue: 时段的精确长度
  choice: 保留“一载、两载、半载”
  alternative: 译为“三年半”或“一千二百六十天”
  rationale: 不把象征性时期预先等同为某种历法计算或特定末世论方案。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“于是”承接上文；分号帮助呈现目的与结果层次。保留“那妇人”“那蛇”等启示文学称谓，不额外解释象征对象。
