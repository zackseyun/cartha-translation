revisions:
- from: 于是，那妇人得了大鹰的两只翅膀，好飞到旷野，去到她自己的地方；她在那里得到供养，躲避那蛇，度过一载、两载、半载。[a]
  to: 于是，那妇人被赐给那大鹰的两只翅膀，好让她飞往旷野，到她自己的地方去；她要在那里、在远离那蛇之处，受到供养，一个时期、若干时期和半个时期。[a]
  rationale: 修订恢复原文的句法与信息次序：妇人获得翅膀，飞往她在旷野的地方，并在那里、远离蛇而受供养。时间短语保留为不定的“一个时期、若干时期和半个时期”，不预设复数等于两个或等同特定历法。
