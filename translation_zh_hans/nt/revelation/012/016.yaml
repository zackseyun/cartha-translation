  text: καὶ ἐβοήθησεν ἡ γῆ τῇ γυναικί, καὶ ἤνοιξεν ἡ γῆ τὸ στόμα αὐτῆς καὶ κατέπιεν τὸν ποταμὸν ὃν ἔβαλεν ὁ δράκων ἐκ τοῦ στόματος αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/016.yaml
  text: And the earth helped the woman[b][a], and the earth opened its mouth and swallowed the river that the dragon had thrown from his mouth.
translation:
  language: zh_hans
  text: 大地[a]帮助了那妇人；大地张开口，吞下了龙从自己口中抛出的[b]那条河。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大地”也可译作“土地”或“地面”。希腊语γῆ具有这些含义。
    reason: lexical_alternative
  - marker: b
    text: “抛出”也可译作“放出”或“喷出”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβοήθησεν
  choice: 帮助了
  rationale: 直接表达帮助、援助之意，保留不定过去时在叙事中的简洁推进力。
- source_word: ἡ γῆ
  choice: 大地
  rationale: γῆ可指大地、土地或地面；本节处于宇宙性的启示异象中，“大地”最能自然保留其宏阔意象，并在两次出现时保持重复。
- source_word: τῇ γυναικί
  choice: 那妇人
  rationale: 按上下文指前文已经出现的象征性妇人；不在译文中解释其身份。
- source_word: ἤνοιξεν ἡ γῆ τὸ στόμα αὐτῆς
  choice: 大地张开口
  rationale: 保留原文把大地人格化的鲜明异象，同时采用自然简洁的现代汉语。
- source_word: κατέπιεν
  choice: 吞下了
  rationale: 直接对应“吞咽、吞下”，既保留动作形象，也不额外强化为“吞灭”。
- source_word: τὸν ποταμόν
  choice: 那条河
  rationale: ποταμός通常指河流；译作“河”而非“洪水”，避免根据上下文作过度解释。“那条”体现定冠词及前文所述河流。
- source_word: ὃν ἔβαλεν ὁ δράκων ἐκ τοῦ στόματος αὐτοῦ
  choice: 龙从口中喷出的
  rationale: βάλλω基本义域包括投出、抛出；此处宾语是从龙口中出来的河流，“喷出”在汉语中自然呈现其强力发出，同时以脚注保留较形式对应的译法。
- source_word: ὁ δράκων
  choice: 龙
  rationale: 直接对应启示录中已确立的异象角色，不添加象征解释。
theological_decisions:
- issue: 异象中大地的人格化行动
  choice: 保留“大地张开口并吞下河”的人格化图景，不解释其象征所指。
  alternative: 把“大地”解释为某片土地、人群，或上帝施行拯救的某种具体途径。
  rationale: 原文只呈现异象行动，并未在本节界定象征含义；译文应保留其神学张力与开放性。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。保留“大地”两次作主语的重复和人格化意象；分号呈现两个紧密相连的叙事动作。脚注标记均置于相应词语之后。
