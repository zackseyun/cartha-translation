source:
  edition: SBLGNT
  text: καὶ ὠργίσθη ὁ δράκων ἐπὶ τῇ γυναικί, καὶ ἀπῆλθεν ποιῆσαι πόλεμον μετὰ τῶν λοιπῶν τοῦ σπέρματος αὐτῆς, τῶν τηρούντων τὰς ἐντολὰς τοῦ θεοῦ καὶ ἐχόντων τὴν μαρτυρίαν Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/017.yaml
  text: And the dragon became enraged with the woman[a], and went away to make war with the rest of her offspring, those who keep the commandments of God and hold to the testimony of Jesus.
translation:
  language: zh_hans
  text: 龙向那女人大发烈怒，便去与她其余的后裔争战，就是那些遵守上帝的诫命、持守耶稣的见证[a]的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“关于耶稣的见证”；也可理解为“耶稣所作的见证”。希腊语的属格在这里可以有不止一种理解。
    reason: alternative_reading
lexical_decisions:
- source_word: ὠργίσθη
  choice: 大发烈怒
  rationale: 表达进入强烈愤怒状态，符合动词的语义和启示文学中敌对反应的强度，又不额外添加动机。
- source_word: δράκων
  choice: 龙
  rationale: 这是《启示录》中该象征形象的标准、直接译法，并与本章前文的指称保持一致。
- source_word: ἐπὶ τῇ γυναικί
  choice: 向那女人
  rationale: ἐπί与与格在此表示愤怒所针对的对象；“向……大发烈怒”是自然、准确的现代汉语表达。
- source_word: ἀπῆλθεν
  choice: 就去
  rationale: 保留叙事中的离去及行动转折；相比“离开了”，此处“就去”与目的不定式衔接更自然。
- source_word: ποιῆσαι πόλεμον
  choice: 争战
  rationale: 准确传达“发动战争／进行争战”的惯用意义，并保持庄重的经文语体。
- source_word: μετὰ τῶν λοιπῶν
  choice: 与……其余的
  rationale: 保留μετά的“与”形式；在“争战”这一搭配中，敌对关系已经清楚，无须改译成“攻击”。
- source_word: τοῦ σπέρματος αὐτῆς
  choice: 她其余的后裔
  rationale: σπέρμα在此指后代或子孙；“后裔”保留亲缘和群体延续的含义，也比字面的“种子”自然。
- source_word: τηρούντων τὰς ἐντολὰς τοῦ θεοῦ
  choice: 遵守上帝的诫命
  rationale: τηρέω在诫命语境中表示忠实遵行；“诫命”保留ἐντολή的圣经语义分量。
- source_word: ἐχόντων
  choice: 持守
  rationale: ἔχω字面为“有”，在此可表达持续拥有和忠于见证；“持守”使现代汉语清楚自然，同时不把含义缩减为单纯持有。
- source_word: τὴν μαρτυρίαν Ἰησοῦ
  choice: 耶稣的见证
  rationale: 属格短语本身可指关于耶稣的见证，也可指耶稣所作的见证；正文采用形式上同样开放的表达，把主要解释列于脚注。
theological_decisions:
- issue: τὴν μαρτυρίαν Ἰησοῦ中属格Ἰησοῦ的关系
  choice: 耶稣的见证
  alternative: 关于耶稣的见证；或耶稣所作的见证
  rationale: 希腊语属格既可能是受事属格，也可能是主事属格。正文不替读者消解这一真实歧义，脚注说明两种主要理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。用“于是……就去”保持叙事推进，以“争战、后裔、诫命、见证”保存启示文学和圣经语境的凝练表达。脚注标记置于其所说明的“耶稣的见证”之后。
