id: REV.12.9
reference: Revelation 12:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἐβλήθη ὁ δράκων ὁ μέγας, ὁ ὄφις ὁ ἀρχαῖος, ὁ καλούμενος Διάβολος καὶ ⸀ὁ Σατανᾶς, ὁ πλανῶν τὴν οἰκουμένην ὅλην— ἐβλήθη εἰς τὴν γῆν, καὶ οἱ ἄγγελοι αὐτοῦ μετ’ αὐτοῦ ἐβλήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/009.yaml
  text: And the great dragon was thrown down—the ancient serpent[a], the one called the Devil and Satan, who deceives the whole world. He was thrown down to the earth[b], and his angels were thrown down with him.
translation:
  language: zh_hans
  text: 那条大龙被摔了下来，就是那条古蛇[a]，名叫魔鬼和撒但，迷惑全世界[b]。它被摔到地上，它的众天使也和它一同被摔了下来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “古蛇”呼应《创世记》第3章中的蛇。
    reason: cross_reference
  - marker: b
    text: 或译：“使整个有人居住的世界走迷了路。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβλήθη / ἐβλήθησαν
  choice: 被摔了下去／被摔到地上
  rationale: 被动式表达遭受强力驱逐；结合从天到地的语境译作“摔下去”，并保留原文三次重复所形成的强调。
- source_word: ὁ δράκων ὁ μέγας
  choice: 那条大龙
  rationale: “龙”保留《启示录》的异象意象；“大”直接对应 μέγας，量词“条”符合现代汉语习惯。
- source_word: ὁ ὄφις ὁ ἀρχαῖος
  choice: 那条古蛇
  rationale: “蛇”准确对应 ὄφις；“古”自然表达 ἀρχαῖος 的久远含义，同时不在正文中把所指进一步解释为“太古”或“起初”。
- source_word: ὁ καλούμενος
  choice: 称为
  rationale: 简洁表达该分词所引出的名称和称号，并使一连串同位语在汉语中自然连贯。
- source_word: Διάβολος
  choice: 魔鬼
  rationale: 此处作为公认称号使用；“魔鬼”是现代中文圣经语境中清楚而通行的对应词，不在正文中改译其词源义“诽谤者”。
- source_word: Σατανᾶς
  choice: 撒但
  rationale: 按中文通行形式音译这一名称，避免把词源义“敌对者”直接代入正文。
- source_word: ὁ πλανῶν
  choice: 迷惑
  rationale: πλανάω 可指欺骗或使人走迷；“迷惑”简洁自然，并保留两方面的语义空间。
- source_word: τὴν οἰκουμένην ὅλην
  choice: 全世界
  rationale: οἰκουμένην 可特指有人居住的世界；在本节宇宙性的异象语境中，“全世界”自然传达其完整范围。
- source_word: εἰς τὴν γῆν
  choice: 到地上
  rationale: γῆ 可指地、土地或大地；这里与天形成对照，“地上”最符合空间性的驱逐场景。
- source_word: οἱ ἄγγελοι αὐτοῦ
  choice: 它的众天使
  rationale: 异象语境中的 ἄγγελοι 指超自然的天使，而非一般的人间使者；“众”自然表达复数。
- source_word: μετ’ αὐτοῦ
  choice: 和它一同
  rationale: 明确表达陪同关系，并使末句强调这些天使与大龙遭受相同结局。
theological_decisions:
- issue: Διάβολος 与 Σατανᾶς 并列作为大龙的身份名称
  choice: 称为魔鬼和撒但
  alternative: 称为魔鬼和敌对者
  rationale: 原文用一连串同位语辨明大龙的身份。“魔鬼”和“撒但”采用通行名称，既保留经文的明确认同，也不额外加入关于其本质或起源的教义说明。
- issue: οἰκουμένη 的范围
  choice: 全世界
  alternative: 整个有人居住的世界
  rationale: 选择自然的现代汉语表达其普遍范围；脚注保留该词“有人居住的世界”这一较字面的可能表达。
- issue: πλανάω 的作用方式
  choice: 迷惑
  alternative: 使……走迷了路
  rationale: “迷惑”可涵盖欺骗和引人偏离，不把原文的语义张力限定为纯认知欺骗或纯道路隐喻。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。通过“被摔”三次重复再现原文的修辞强调；用分号和短句整理希腊文连续同位语，使异象叙述清楚而不削弱力度。代词依汉语对动物／异象形象的通常用法译作“它”，不借代词预先强化人格化解释。
