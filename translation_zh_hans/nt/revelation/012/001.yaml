id: REV.12.1
reference: Revelation 12:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ σημεῖον μέγα ὤφθη ἐν τῷ οὐρανῷ, γυνὴ περιβεβλημένη τὸν ἥλιον, καὶ ἡ σελήνη ὑποκάτω τῶν ποδῶν αὐτῆς, καὶ ἐπὶ τῆς κεφαλῆς αὐτῆς στέφανος ἀστέρων δώδεκα,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/001.yaml
  text: 'And a great sign appeared in heaven: a woman clothed with the sun[a], and the moon under her feet, and on her head a crown of twelve stars,'
translation:
  language: zh_hans
  text: 天上出现了一个大异象：有一个妇人，身披太阳，月亮在她脚下，头上戴着一顶由十二颗星组成的冠冕[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“花冠”或“得胜者的冠冕”；希腊词是στέφανος，与君王所戴的王冠（διάδημα）不同。
    reason: 词义备选及原文术语辨析
lexical_decisions:
- source_word: σημεῖον
  choice: 异象
  rationale: 这里指启示文学中显现于天上的象征性景象。“异象”符合现代汉语的启示文学语境；同时不在译文中解释其具体所指。
- source_word: μέγα
  choice: 大
  rationale: 既可表达景象的宏大，也保留其重大意义，且与“大异象”搭配自然庄重。
- source_word: ὤφθη
  choice: 出现了
  rationale: 该词形式上是被动语态“被看见”，但在异象叙述中表达“显现、出现”；译作“出现了”符合现代汉语表达。
- source_word: ἐν τῷ οὐρανῷ
  choice: 天上
  rationale: οὐρανός也可指天空，但《启示录》的异象场景宜译作“天上”，同时保留其空间和神学语境。
- source_word: γυνή
  choice: 妇人
  rationale: 经文只表明这是一位成年女性，并未在本节说明其身份或婚姻关系。“妇人”庄重且适合经文体裁。
- source_word: περιβεβλημένη τὸν ἥλιον
  choice: 身披太阳
  rationale: περιβάλλω的完成时分词描绘她以太阳为衣、被太阳包裹的持续状态。“身披太阳”简洁自然，并保留鲜明意象。
- source_word: ἡ σελήνη ὑποκάτω τῶν ποδῶν αὐτῆς
  choice: 月亮在她脚下
  rationale: 直接保留原文的空间关系，不加入有关征服、统治或其他象征意义的解释。
- source_word: στέφανος
  choice: 冠冕
  rationale: στέφανος指花冠、奖赏性的冠冕，与王权的διάδημα有别。“冠冕”适合作为正文用词，具体词义差异在脚注说明。
- source_word: ἀστέρων δώδεκα
  choice: 由十二颗星组成
  rationale: 将属格关系明确自然地表达为冠冕由十二颗星构成，没有进一步解释数字或星辰的象征意义。
theological_decisions:
- issue: 妇人的象征身份
  choice: 只按异象所见描述，不在译文中指认其身份。
  alternative: 可解释为以色列、马利亚、上帝的子民或教会。
  rationale: 本节本身没有明确说明妇人是谁；保持描述性译法可保存经文的象征张力，避免加入特定宗派或解释传统的结论。
- issue: στέφανος所表达的冠冕性质
  choice: 正文译为“冠冕”，脚注说明它也可指花冠或得胜者的冠冕。
  alternative: 正文直接译为“花冠”或“得胜者的冠冕”。
  rationale: 原词区别于王室的冠冕（διάδημα），但本节并未明确要求只取“得胜者奖赏”这一层含义；正文采用较宽的词，脚注保存词义范围。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“大异象”“身披太阳”“冠冕”保留启示文学的宏伟意象；不解释妇人的身份。脚注标记[a]紧随其所说明的“冠冕”。
