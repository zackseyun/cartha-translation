  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἔβαλεν ὁ ὄφις ἐκ τοῦ στόματος αὐτοῦ ὀπίσω τῆς γυναικὸς ὕδωρ ὡς ποταμόν, ἵνα αὐτὴν ποταμοφόρητον ποιήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/015.yaml
  text: And the serpent hurled water like a river out of his mouth after the woman[b][a], so that he might cause her to be swept away by the river.
translation:
  language: zh_hans
  text: 蛇就从口中向着那妇人[a]喷出像一条河的水，要使她被河水冲走[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在那妇人身后。”希腊语既可表示空间位置，也可表示追赶。
    reason: lexical_alternative
  - marker: b
    text: 直译：“使她成为被河流冲走的。”意思是使她被河水冲走。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔβαλεν
  choice: 喷出
  rationale: βάλλω基本义为“投、掷”，但水是从蛇口中出来；“喷出”在现代汉语中自然、形象，也保留攻击性的力度。
- source_word: ὁ ὄφις
  choice: 蛇
  rationale: ὄφις意为“蛇”；沿用本段清楚而庄重的称谓，并保留其圣经象征意象。
- source_word: ἐκ τοῦ στόματος αὐτοῦ
  choice: 从口中
  rationale: 直接表达水由蛇口中出来；汉语无需重复物主代词，所指仍然明确。
- source_word: ὀπίσω τῆς γυναικός
  choice: 追着那妇人
  rationale: ὀπίσω加属格既可表示空间上的“在……后面”，也可表示追赶意义的“追着”。上下文是蛇攻击并追赶妇人，正文采用后者，同时以脚注保留空间读法。
- source_word: ὕδωρ ὡς ποταμόν
  choice: 水来，像一条河
  rationale: 保留ὡς所引出的明喻，并将ποταμός译作“河”，不把象征解释为军队、谎言或泛称的洪水。
- source_word: ἵνα
  choice: 要
  rationale: 在此自然表达蛇行动的目的；既简洁又保留目的从句的语气。
- source_word: ποταμοφόρητον ποιήσῃ
  choice: 使她被河水冲走
  rationale: ποταμοφόρητος字面指“被河流带走”，与ποιέω构成使役表达。“使她被河水冲走”保留使役结构与河流意象，也没有增添“淹死”的含义。
theological_decisions:
- issue: 蛇发动攻击的启示文学象征
  choice: 在正文中保留“水像一条河”以及“被河水冲走”的原始意象，不直接解释其象征对象。
  alternative: 在正文中把水解释为军队、逼迫、谎言或混乱。
  rationale: 原文呈现象征性异象，却没有在本节明说水所代表的对象；翻译不应把某一种解释写入正文。
- issue: ὀπίσω τῆς γυναικός的空间或追赶含义
  choice: 正文译为“追着那妇人”，脚注保留“在那妇人身后”的可能。
  alternative: 正文译为“在那妇人身后”。
  rationale: 追赶义符合上下文的敌对行动，但希腊语本身容许空间读法，因此不将另一可能性隐去。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“喷出”传达敌对行动的力度；“河水冲走”既自然，又紧贴罕见复合词ποταμοφόρητος。脚注标记按正文出现顺序排列。
