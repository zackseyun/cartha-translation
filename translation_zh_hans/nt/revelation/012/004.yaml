  to: 它的尾巴拖着天上三分之一的星辰，把它们抛到地上。那龙站在将要分娩的妇人面前，等她一生下孩子，就要吞吃她的孩子。
  rationale: 修订仅调整动词的时体和动作力度，并微调“分娩”的语域。保留星辰的未解释性、龙站在妇人面前的持续状态，以及ἵνα从句所表达的守候吞吃之目的。
