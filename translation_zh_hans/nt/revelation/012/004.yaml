id: REV.12.4
reference: Revelation 12:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἡ οὐρὰ αὐτοῦ σύρει τὸ τρίτον τῶν ἀστέρων τοῦ οὐρανοῦ, καὶ ἔβαλεν αὐτοὺς εἰς τὴν γῆν. καὶ ὁ δράκων ἕστηκεν ἐνώπιον τῆς γυναικὸς τῆς μελλούσης τεκεῖν, ἵνα ὅταν τέκῃ τὸ τέκνον αὐτῆς καταφάγῃ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/004.yaml
  text: And his tail sweeps away a third of the stars of heaven and threw them to the earth. And the dragon stood before the woman who was about to give birth, so that when she gave birth, he might devour her child.
translation:
  language: zh_hans
  text: 它的尾巴拖着天上三分之一的星辰，把它们抛到地上。那龙站在将要分娩的妇人面前，等她一生下孩子，就要吞吃她的孩子。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σύρει
  choice: 拖走了
  rationale: 该词基本义为“拖、拉”，此处取叙事性的过去表达；既保留尾巴拖曳星辰的强烈图像，也避免把它具体化为单纯“扫落”。
- source_word: τὸ τρίτον τῶν ἀστέρων τοῦ οὐρανοῦ
  choice: 天上三分之一的星辰
  rationale: 直接保留原文的比例和属格关系，中文自然清楚。
- source_word: ἔβαλεν
  choice: 摔在
  rationale: βάλλω在此表示有力地投下；“摔在地上”比中性的“扔到地上”更符合异象的力度。
- source_word: ἕστηκεν
  choice: 站在
  rationale: 完成时呈现龙已经就位并站立在妇人面前的状态；中文用“站在”自然表达其持续等候的姿态。
- source_word: τῆς μελλούσης τεκεῖν
  choice: 将要生产的
  rationale: 准确表达μέλλω加不定式所指的临近生产，采用现代汉语常用说法。
- source_word: καταφάγῃ
  choice: 吞吃
  rationale: 保留该强化动词“吞下、吃尽”的凶猛意味，也符合启示文学的庄重语体。
theological_decisions:
- issue: 星辰所指对象
  choice: 不在正文中解释其象征身份
  alternative: 明确译成天使或其他属灵存在
  rationale: 本节原文本身只说“星辰”，其象征解释应留给上下文和注释，不应写入翻译。
- issue: 历史现在时与过去时的转换
  choice: 将σύρει按异象叙事译为“拖走了”，并与ἔβαλεν协调
  alternative: 译为“拖着……又摔在”，或保留现在时“拖走”
  rationale: 希腊文在σύρει现在时之后使用ἔβαλεν简单过去时，存在时态突变；现代中文不强制标示时态，用完成体使叙事连贯，同时不改变事件内容。
- issue: ἵνα从句的目的意味
  choice: 译为“等……就要……”
  alternative: 直译为“为要在……的时候……”
  rationale: 上下文明确表现龙守候吞吃孩子的目的；所选表达在自然中文中同时传达守候时机与恶意企图。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“星辰”“妇人”“那龙”保持启示文学意象；避免古奥的“临产”“甫一生产”等表达，也不额外解释象征含义。
