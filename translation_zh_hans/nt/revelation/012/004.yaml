review_pass:
  verdict: revise
  source_fidelity: “天上三分之一的星辰”“那龙”“妇人”“吞吃她的孩子”均忠实保留了原文意象和指代，且没有把“星辰”解释为特定象征对象。不过，σύρει为现在时，宜在中文中保留异象叙述的进行感；ἔβαλεν的基本义是“投、抛”，而“摔”会额外带入猛摔、撞击的具体方式。
  naturalness: 原译整体通顺，语体庄重易懂。“将要生产的妇人”可理解，但“将要分娩的妇人”在此庄重叙事中更自然、准确。“等……就要……”自然传达龙守候并企图吞吃的目的。
  terminology: “星辰”“妇人”“那龙”“吞吃”适合启示录异象文体；不需术语性改动。
  issues:
  - severity: medium
    issue: “拖走了”未反映σύρει的现在时，且“摔在地上”对ἔβαλεν作了过强、过具体的诠释。
    rationale: 原文以现在时σύρει呈现尾巴正在拖曳星辰，随后以过去时ἔβαλεν叙述将其投到地上。中文可自然保留前者的进行态；“抛到地上”忠实表达投掷，而不预设“猛摔”的动作方式。
  - severity: low
    issue: “将要生产的妇人”略带现代医疗行政语感。
    rationale: “将要分娩的妇人”更贴近文学叙事语域，也准确表达μέλλουσης τεκεῖν。
