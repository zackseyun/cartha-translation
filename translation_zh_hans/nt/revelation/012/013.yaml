id: REV.12.13
reference: Revelation 12:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ ὅτε εἶδεν ὁ δράκων ὅτι ἐβλήθη εἰς τὴν γῆν, ἐδίωξεν τὴν γυναῖκα ἥτις ἔτεκεν τὸν ἄρσενα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/013.yaml
  text: And when the dragon saw that he had been thrown down to the earth[b][a], he pursued the woman who had given birth to the male child.
translation:
  language: zh_hans
  text: 那条龙见自己被摔到地上，就追赶[a]那生了男孩子[b]的妇人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“迫害”。希腊文这个词既可指“追赶”，也可指“迫害”；这里可能兼有敌意追逐和迫害两层意思。
    reason: lexical_alternative
  - marker: b
    text: 直译“男性”。根据上下文，译文补出“孩子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: δράκων
  choice: 龙
  rationale: 在启示文学意象中，此词明确指“龙”；不因上下文另称其为蛇而在本节改译为“蛇”。
- source_word: ἐβλήθη
  choice: 被摔到
  rationale: 保留不定过去时被动语态所表达的强制、猛烈驱逐之意；汉语借上下文自然呈现先后关系，无须另加完成体标记。
- source_word: εἰς τὴν γῆν
  choice: 到地上
  rationale: 本段以天与地形成宇宙性的对照，γῆ在此宜指“地”而非某片“土地”；“摔到地上”符合现代汉语习惯。
- source_word: ἐδίωξεν
  choice: 追赶
  rationale: διώκω既可指实际追赶，也可指迫害；此处叙事动作首先呈现龙敌意追逐妇人，故正文译作“追赶”，并以脚注保留“迫害”的语义可能。
- source_word: γυναῖκα
  choice: 妇人
  rationale: 保留异象中人物的普通称谓，不在译文中指定她象征马利亚、以色列或上帝的子民。
- source_word: ἥτις
  choice: 那……的
  rationale: 用自然的汉语定语结构表达关系代词，清楚限定这位妇人就是生了男孩子的那一位。
- source_word: ἔτεκεν
  choice: 生了
  rationale: 准确而自然地表达“生育、产下”；事件先于龙的追赶，汉语语序已清楚表达这一点。
- source_word: τὸν ἄρσενα
  choice: 男孩子
  rationale: 希腊文实为名词化的“男性”，上下文所指为妇人所生的孩子；补出“孩子”使现代汉语通顺，同时保留对男性性别的明确强调。
theological_decisions:
- issue: 妇人与男孩子的象征身份
  choice: 正文仅保留“妇人”和“男孩子”的异象性称谓，不作解释性扩写。
  alternative: 将妇人明确译解为马利亚、以色列或上帝的子民，并将男孩子直接指明为某一特定身份。
  rationale: 原文在本节没有明说这些象征的具体身份，且存在多种解释；翻译不应替读者消除这种诠释空间。
- issue: διώκω所含的敌对行动
  choice: 正文译作“追赶”，脚注说明也可译作“迫害”。
  alternative: 正文直接译作“迫害”。
  rationale: 场景具有具体追逐的叙事动作，同时也蕴含迫害意义；采用正文加脚注的方式保留两层可能，而不把词义限缩为其中之一。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“那条龙……就……”使叙事关系清楚；避免使用古雅的“妇人所生之男”之类结构，也不在正文中解释启示文学意象。
