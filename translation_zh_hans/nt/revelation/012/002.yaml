id: REV.12.2
reference: Revelation 12:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἐν γαστρὶ ἔχουσα· ⸂καὶ κράζει⸃ ὠδίνουσα καὶ βασανιζομένη τεκεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/002.yaml
  text: And she was pregnant[a], and she cries out[c][b], suffering birth pains and being tormented to give birth.
translation:
  language: zh_hans
  text: 她怀了孕[a]，在产痛中呼喊，并因要生产而受折磨[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“腹中有（孩子）”；也可译作“有了身孕”。
    reason: lexical_alternative
  - marker: b
    text: “受折磨”也可译作“痛苦不堪”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν γαστρὶ ἔχουσα
  choice: 怀了孕
  rationale: 该短语字面为“腹中有（孩子）”，是表达怀孕的常用说法；“怀了孕”自然、准确，也适合现代汉语。
- source_word: κράζει
  choice: 呼喊
  rationale: 保留现在时所呈现的异象现场感；汉语用“呼喊”无需额外标明进行体，也能表达持续而强烈的喊叫。
- source_word: ὠδίνουσα
  choice: 在产痛中
  rationale: 该分词指经历分娩阵痛；此译明确保留疼痛意象，同时比“劬劳”更符合现代普通读者的语言。
- source_word: βασανιζομένη
  choice: 受折磨
  rationale: 被动分词表达剧烈痛苦；“受折磨”保留原文的强度，不弱化为一般的难受或忧苦。
- source_word: τεκεῖν
  choice: 要生产
  rationale: 不定式在此说明其剧痛所关联的分娩；“要生产”简洁自然，并清楚表达即将生育。
- source_word: καὶ ... καὶ
  choice: 并……而……
  rationale: 以汉语自然的连接方式保留原文累积推进的结构，而不机械重复每一个“和”。
theological_decisions:
- issue: 异象中妇人痛苦的强度与性质
  choice: 将 βασανιζομένη 强译为“受折磨”，但不解释妇人的象征身份。
  alternative: 译为较柔和的“极其痛苦”或“痛苦不堪”。
  rationale: 原文突出她分娩时所受的剧烈痛苦，却未在本节界定她的象征身份；译文应保留强度和解释空间，不引入特定神学体系。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“产痛”准确呈现分娩阵痛，“受折磨”保留原文较强烈的措辞。所有脚注标记均置于正文相应位置。
