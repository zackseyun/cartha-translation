  text: And he stood on the sand of the sea[a].
translation:
  language: zh_hans
  text: 龙站在海边的沙滩上[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作：“我站在海边的沙滩上。”
    reason: textual_variant
lexical_decisions:
- source_word: καὶ
  choice: 于是
  rationale: 承接上一节的叙事并引出下一幕；现代汉语用“于是”比机械译作“并且”更自然，同时保留事件的连续性。
- source_word: ἐστάθη
  choice: 龙站
  rationale: 该动词是不及物用法，意为“站立”；希腊文动词本身未明说主语，但第三人称单数结合上一节最近的明确行动者“龙”，以“龙”补出主语最清楚。
- source_word: ἐπὶ
  choice: 在……上
  rationale: 与宾格连用，在此描述站立所在的位置；汉语以“在……上”自然表达。
- source_word: τὴν ἄμμον
  choice: 沙滩
  rationale: ἄμμος本义为“沙”；结合“海的”这一限定，现代汉语“海边的沙滩”既保留沙地意象，也避免生硬的“海的沙”。
- source_word: τῆς θαλάσσης
  choice: 海边的
  rationale: 这是修饰“沙”的属格结构；译作“海边的”符合现代汉语习惯，并保留其与海相属的空间关系。
theological_decisions:
- issue: 动词主语及文本异读
  choice: 正文按SBLGNT的第三人称读法译为“龙站……”，主语依上下文指向上一节的龙。
  alternative: 有些抄本作第一人称：“我站在海边的沙滩上。”
  rationale: 正文忠实采用所给底本ἐστάθη（第三人称单数）；同时以脚注保存ἐστάθην（第一人称单数）的重要异读，不把叙述者与龙之间的文本张力静默消除。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“海边的沙滩”较“海的沙”更符合中文表达；明确补出“龙”，使第三人称主语在单节呈现中清楚。
