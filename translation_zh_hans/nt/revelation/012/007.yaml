  text: Καὶ ἐγένετο πόλεμος ἐν τῷ οὐρανῷ, ὁ Μιχαὴλ καὶ οἱ ἄγγελοι αὐτοῦ ⸀τοῦ πολεμῆσαι μετὰ τοῦ δράκοντος. καὶ ὁ δράκων ἐπολέμησεν καὶ οἱ ἄγγελοι αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/007.yaml
  text: 'And war broke out in heaven: Michael and his angels fought against the dragon[a]. And the dragon and his angels fought back[c][b],'
translation:
  language: zh_hans
  text: 天上爆发了战争[a]：米迦勒和他的天使与那龙争战[b]；那龙和他的天使也争战[c]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“天上发生了战争”或“天上兴起了战争”。
    reason: lexical_alternative
  - marker: b
    text: 原文较直译为：“米迦勒和他的天使，要与那龙争战”；希腊文用带冠词的不定式表达这一行动或目的。
    reason: lexical_alternative
  - marker: c
    text: 原文的句式较直译为：“那龙争战，他的天使也争战”；也可按语境译作“那龙和他的天使起来应战”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο πόλεμος
  choice: 爆发了战争
  rationale: γίνομαι与名词连用可表示一件事发生或兴起。“爆发了战争”既符合现代汉语习惯，也保留了战争开始发生的动态意味。
- source_word: ἐν τῷ οὐρανῷ
  choice: 天上
  rationale: 本处οὐρανός指属天的领域，而非单指可见的天空；“天上”简明自然，并符合启示文学语境。
- source_word: Μιχαὴλ
  choice: 米迦勒
  rationale: 采用现代中文圣经传统中通行的人名音译，不在名字中加入身份或职分解释。
- source_word: οἱ ἄγγελοι αὐτοῦ
  choice: 他的天使
  rationale: 直接表达所属及结盟关系，并保留米迦勒一方与龙一方之间的平行结构。
- source_word: τοῦ πολεμῆσαι μετὰ τοῦ δράκοντος
  choice: 与那龙争战
  rationale: 带冠词的不定式以压缩结构说明米迦勒及其天使所进行的行动；“与……争战”在中文中自然，并由上下文清楚表达敌对关系。
- source_word: δράκοντος / δράκων
  choice: 那龙
  rationale: δράκων在本段启示文学意象中应译为“龙”；加“那”使特指关系在中文中更自然。
- source_word: ἐπολέμησεν
  choice: 争战
  rationale: 采用与前句相同的动词，以保留原文词根重复和双方交战的平行关系；不在正文中额外明确为“反击”，以免过度解释。
theological_decisions:
- issue: 米迦勒的身份与地位
  choice: 仅译其名为“米迦勒”，不加身份说明
  alternative: 译文中称其为“天使长”，或将其解释为基督论人物
  rationale: 本节只点出米迦勒的名字，并未在此说明其职分，也未将他等同于基督；不作扩充可保留经文本身的神学张力。
- issue: 龙一方行动的响应性质
  choice: 译为“也争战”
  alternative: 译为“起来应战”或“反击”
  rationale: 上下文可以理解为龙一方回应米迦勒一方，但ἐπολέμησεν本身只是“争战”。正文保留较少解释性的表达，并以“也”呈现叙事中的对应关系。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“爆发了战争”传达事件兴起的动态感；两次使用“争战”保留原文重复和平行结构。经节末保留逗号，以衔接下一节尚未完结的句意。
