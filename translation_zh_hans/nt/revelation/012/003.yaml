source:
  edition: SBLGNT
  text: καὶ ὤφθη ἄλλο σημεῖον ἐν τῷ οὐρανῷ, καὶ ἰδοὺ δράκων ⸂μέγας πυρρός⸃, ἔχων κεφαλὰς ἑπτὰ καὶ κέρατα δέκα καὶ ἐπὶ τὰς κεφαλὰς αὐτοῦ ἑπτὰ διαδήματα,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/003.yaml
  text: And another sign appeared in heaven[a], and behold, a great red dragon, having seven heads and ten horns, and on his heads seven diadems[b],
translation:
  language: zh_hans
  text: 天上又出现了一个异象：看哪，一条火红的大龙，有七个头、十只角，头上有七顶王冠[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文所用的词特指象征王权的冠饰，也可译作“王室冠冕”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὤφθη
  choice: 出现了
  rationale: 此处为异象叙事中的惯用被动形式，表达“显现、出现”，比“被看见”更符合现代汉语。
- source_word: ἄλλο σημεῖον
  choice: 又一个异象
  rationale: σημεῖον本义为“记号、征象”；在本段启示性异象语境中，“异象”自然地表达可见而具有象征意义的征兆，并与12:1衔接。
- source_word: ἐν τῷ οὐρανῷ
  choice: 天上
  rationale: οὐρανός可指天空或天界；此处宇宙性异象语境以“天上”最为自然，并保留原文的空间与神学张力。
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留原文引人注意、突显画面的语篇功能，也符合庄重的启示文学语体。
- source_word: δράκων μέγας πυρρός
  choice: 一条火红的大龙
  rationale: “大龙”准确表达μέγας与δράκων；“火红”传达πυρρός所指如火焰般的红色，比单说“红”更充分且汉语自然。
- source_word: κεφαλὰς ἑπτὰ καὶ κέρατα δέκα
  choice: 七个头、十只角
  rationale: 直接保留异象的具体形象，不在译文中解释其象征意义；量词按现代汉语习惯处理。
- source_word: ἐπὶ τὰς κεφαλὰς αὐτοῦ
  choice: 七个头上
  rationale: 忠实表达冠饰位于各头之上；汉语无需另加物主代词即可明确指向大龙，并避免生硬。
- source_word: ἑπτὰ διαδήματα
  choice: 七顶王冠
  rationale: διάδημα特指王权性的冠饰，有别于得胜者的花冠；“王冠”比音译或较生僻的“冕旒”更便于普通现代读者理解。
theological_decisions:
- issue: σημεῖον应译为“异象”还是“征兆/记号”
  choice: 异象
  alternative: 征兆；记号
  rationale: 这里所说的是在天上显现、被观看的象征性景象。“异象”适合上下文，但不在译文中说明其具体象征含义。
- issue: πυρρός的颜色表达
  choice: 火红
  alternative: 红；如火般红
  rationale: “火红”简洁地保留该词与火焰色泽的词义联系，不把颜色进一步解释为血腥、邪恶等神学象征。
- issue: διάδημα的王权含义
  choice: 王冠
  alternative: 冠冕；头带
  rationale: “王冠”传达其王权标志，并保留与στέφανος类冠饰的区别；不据此判断其王权是否合法。
translation_notes:
  register: 采用现代、庄重而清楚的启示文学语体。“看哪”保留突现感；以冒号引出视觉画面。句末改为完整句号，适合独立经节呈现。
