id: REV.12.6
reference: Revelation 12:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἡ γυνὴ ἔφυγεν εἰς τὴν ἔρημον, ὅπου ἔχει ἐκεῖ τόπον ἡτοιμασμένον ⸀ἀπὸ τοῦ θεοῦ, ἵνα ἐκεῖ ⸀τρέφωσιν αὐτὴν ἡμέρας χιλίας διακοσίας ἑξήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/006.yaml
  text: And the woman fled into the wilderness[a], where she has there a place prepared by God, so that there they might nourish her for one thousand two hundred sixty days.
translation:
  language: zh_hans
  text: 那妇人逃到旷野；在那里，她有一处上帝所预备的地方，好让他们在那里供养她[a]一千二百六十天。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“好让她在那里得到供养一千二百六十天。”希腊原文使用主语未说明的第三人称复数动词，直译为“好让他们在那里供养她”。
    reason: 说明原文未指明供养者，并提供较自然的被动替代译法。
lexical_decisions:
- source_word: ἔφυγεν
  choice: 逃到
  rationale: φеύγω表示逃离、躲避；结合方向短语εἰς τὴν ἔρημον，译作“逃到”自然明确，又不增添原文没有的细节。
- source_word: ἔρημον
  choice: 旷野
  rationale: ἔρημος可指荒漠或人烟稀少之地；“旷野”既保留较宽泛的含义，也承接圣经中的相关意象，不把场景限定为沙漠。
- source_word: τόπον
  choice: 地方
  rationale: τόπος在此为普通意义的“地方”；中文无需另加不定冠词。
- source_word: ἡτοιμασμένον ἀπὸ τοῦ θεοῦ
  choice: 上帝为她预备的
  rationale: 完成时被动分词表明该地方已经预备妥当；ἀπό引出施事者，中文主动结构“上帝为她预备的”自然地表达同一关系。“为她”由上下文关系明确，未另定预备行为的神学性质。
- source_word: ἵνα
  choice: 使
  rationale: ἵνα引出目的或预期结果；“使”简洁保留目的色彩。
- source_word: τρέφωσιν αὐτὴν
  choice: 他们可以……供养她
  rationale: τρέφωσιν是第三人称复数主动虚拟式，主语未说明。“他们”保留复数主动形式及施事者的不确定性；“供养”适合一段时期内持续供应所需的语境。
- source_word: ἡμέρας χιλίας διακοσίας ἑξήκοντα
  choice: 一千二百六十天
  rationale: 宾格表示时间延续；中文直接以时段作补语即可，无须另加“为期”。
- source_word: ὅπου ἔχει ἐκεῖ
  choice: 在那里有
  rationale: ὅπου与ἐκεῖ均强调地点。中文“在那里有”表达这一地点关系，同时避免机械重复“那里……那里”造成的不自然。
theological_decisions:
- issue: τρέφωσιν的未指明主语
  choice: 译作“他们可以……供养她”，保留第三人称复数主动表达。
  alternative: 译作“使她可以在那里得到供养”，以无施事者的被动式表达。
  rationale: 希腊文没有说明“他们”是谁。正文不把施事者解释为上帝、天使或任何特定群体，以免消除原文的含混；脚注提供更自然的中文被动表达。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“旷野”保留圣经语境中的宽泛意象；“供养”表达持续供应生活所需。正文保留原文未指明的复数施事者，脚注解释其语法含混。
