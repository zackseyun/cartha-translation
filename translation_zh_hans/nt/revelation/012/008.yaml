  text: καὶ οὐκ ⸀ἴσχυσεν, οὐδὲ τόπος εὑρέθη ⸀αὐτῶν ἔτι ἐν τῷ οὐρανῷ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/008.yaml
  text: But he was not strong enough[a], nor was any place found for them any longer in heaven.
translation:
  language: zh_hans
  text: 可是，龙没有得胜[a]，天上也再没有他们的地方了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“龙没有足够的力量。”希腊文动词可表示有力量、能够或得胜。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: 可是
  rationale: 结合上一节的争战语境，此处καί带有转折推进作用；译作“可是”比机械地译作“并且”更自然。
- source_word: οὐκ ἴσχυσεν
  choice: 龙没有胜过他们
  rationale: ἰσχύω可表示有力量、能够或得胜。希腊文动词为单数，承接上一节的单数主语“龙”；中文补出“龙”可避免代词指向不明。“没有胜过他们”符合争战语境，同时以脚注保留“没有足够力量”的可能译法。宾语“他们”由上一节的交战对象补出。
- source_word: οὐδὲ
  choice: 也……没有
  rationale: 与前一否定分句相连，现代汉语用“也……没有”自然地表达递进的否定关系。
- source_word: τόπος
  choice: 地方
  rationale: τόπος在这里指位置或所在之处；“地方”直接、自然，适合天上领域的语境。
- source_word: εὑρέθη
  choice: 有
  rationale: 原文是“被找到”的被动形式，但“再没有他们的地方了”是自然汉语，并传达结果：他们在那里已无容身之处。若直译“再也找不到给他们的地方”，容易使人误解为有人进行搜寻。
- source_word: αὐτῶν
  choice: 他们的
  rationale: 该复数代词指上一节的龙和他的使者；在汉语中用“他们的地方”简洁表达“给他们的地方”。
- source_word: ἔτι
  choice: 再……了
  rationale: 在否定语境中表示“不再、再也不”，说明争战之后他们在天上已无地方。
- source_word: ἐν τῷ οὐρανῷ
  choice: 天上
  rationale: 此处οὐρανός指属天的领域而非可见的天空；“天上”自然且符合《启示录》的语境。
theological_decisions:
- issue: 单数动词ἴσχυσεν的主语及复数αὐτῶν的所指
  choice: 第一分句以单数“龙”为主语；第二分句的“他们”统指龙和他的使者。
  alternative: 把第一分句统译为复数：“他们没有胜过对方。”
  rationale: 上一节的“龙”是单数主语，ἴσχυσεν也是单数；随后αὐτῶν转为复数，涵盖龙及其使者。保留这一转换更忠实于原文的语法与叙事焦点。
- issue: οὐκ ἴσχυσεν在争战语境中的含义
  choice: 正文译为“没有胜过他们”。
  alternative: “没有足够力量”或“不能取胜”。
  rationale: 该动词兼有“有力量、能够、胜过”的语义。在争战语境中，“没有胜过”最自然，但脚注保留力量层面的译法，避免把词义范围收窄为唯一解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。补出“龙”以明确单数主语；正文保留争战语境中的“胜过”，脚注说明原词也可从力量或能力角度理解。
