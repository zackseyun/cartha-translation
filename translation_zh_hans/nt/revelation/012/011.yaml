id: REV.12.11
reference: Revelation 12:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ αὐτοὶ ἐνίκησαν αὐτὸν διὰ τὸ αἷμα τοῦ ἀρνίου καὶ διὰ τὸν λόγον τῆς μαρτυρίας αὐτῶν, καὶ οὐκ ἠγάπησαν τὴν ψυχὴν αὐτῶν ἄχρι θανάτου·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/011.yaml
  text: And they conquered him by the blood of the Lamb and by the word of their testimony[b][a], and they did not love their life even unto death.
translation:
  language: zh_hans
  text: 他们借着羔羊的血，也借着自己见证的话，胜过了他[a]；他们即使至死，也不爱惜自己的性命[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “胜过”也可译作“战胜”。
    reason: lexical_alternative
  - marker: b
    text: “性命”：希腊文也可指“生命”“自己”或“灵魂”；这里按至死忠诚的语境译作“性命”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνίκησαν
  choice: 胜过了
  rationale: 该词表示战胜、胜过。选用“胜过了”既保留启示录中的争战与得胜意象，也符合现代汉语表达。
- source_word: διὰ τὸ αἷμα τοῦ ἀρνίου
  choice: 借着羔羊的血
  rationale: διά加宾格在此可表达凭借的途径或根据；“借着”保留这种语义空间，不把经文扩展为更具体的教义说明。
- source_word: ἀρνίου
  choice: 羔羊
  rationale: ἀρνίον在启示录中是指向基督的称号；“羔羊”保留其祭牲和启示文学意象。
- source_word: λόγον τῆς μαρτυρίας αὐτῶν
  choice: 自己见证的话
  rationale: 同时表达λόγος的“话／信息”和μαρτυρία的“见证”，比单译“见证”更贴近原文结构，同时在汉语中自然易懂。
- source_word: οὐκ ἠγάπησαν
  choice: 不爱惜
  rationale: 直译“不爱”自己的性命在现代汉语中容易被理解为厌恶生命；“不爱惜”准确传达他们不以保全性命为重的意思。
- source_word: τὴν ψυχὴν αὐτῶν
  choice: 自己的性命
  rationale: ψυχή可指生命、自我或灵魂；在殉道和死亡的语境中，“性命”最准确，也避免引入原文未强调的灵魂与身体二分。
- source_word: ἄχρι θανάτου
  choice: 即使面对死亡
  rationale: 该短语表示直至死亡这一极限；此译法自然传达他们面对死亡仍不以性命为重的意思，而不暗示他们只是一直活到自然死亡。
theological_decisions:
- issue: 借着“羔羊的血”得胜的含义
  choice: 译作“借着羔羊的血”，将羔羊的血保留为他们得胜的途径或根据，不进一步阐释其救赎机制。
  alternative: 译作“因为羔羊的血”，侧重原因。
  rationale: διά加宾格可以带有原因或凭借之意；上下文支持羔羊的血是得胜的根本，译文应保留这一点，却不加入经文本身没有明说的赎罪理论。
- issue: 殉道语境中ψυχή的含义
  choice: 译作“性命”。
  alternative: 译作“灵魂”或“生命”。
  rationale: 此处紧接“死亡”，重点是信徒不以保全今世性命为重；“性命”最符合语境，并避免制造不必要的身心二分。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“自己见证的话”保留原文λόγος与μαρτυρία的双重表达；分号呈现得胜的根据与至死忠诚之间的推进关系。
