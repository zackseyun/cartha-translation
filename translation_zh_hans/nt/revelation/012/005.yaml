id: REV.12.5
reference: Revelation 12:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἔτεκεν υἱόν, ⸀ἄρσεν, ὃς μέλλει ποιμαίνειν πάντα τὰ ἔθνη ἐν ῥάβδῳ σιδηρᾷ· καὶ ἡρπάσθη τὸ τέκνον αὐτῆς πρὸς τὸν θεὸν καὶ πρὸς τὸν θρόνον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/005.yaml
  text: And she gave birth to a son, a male child, who is about to shepherd all the nations with an iron rod; and her child was snatched up to God and to his throne.
translation:
  language: zh_hans
  text: 她生了一个儿子，是个男孩子；他将要用铁杖牧养万国[a]。她的孩子被猛然提到上帝和他的宝座那里去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他将要用铁杖统治万国。”原文动词直译为“牧养”，但这里呼应诗篇第二篇，也含有君王治理的意思。
    reason: 说明原文牧者隐喻与王权含义并存的另一种译法。
lexical_decisions:
- source_word: ἔτεκεν
  choice: 生了
  rationale: 自然、直接地表达具体的生产意象。
- source_word: υἱόν, ἄρσεν
  choice: 一个儿子，是个男孩子
  rationale: 保留υἱόν与ἄρσεν的并置和刻意强调，又符合现代汉语表达。
- source_word: μέλλει ποιμαίνειν
  choice: 将要……牧养
  rationale: 既表达μέλλει所含的未来指向，也避免以“即将”过度限定为时间上的迫近。
- source_word: ποιμαίνειν
  choice: 牧养
  rationale: 保留ποιμαίνω的牧者隐喻；在诗篇第二篇的呼应中，该词同时带有君王治理的意味。
- source_word: πάντα τὰ ἔθνη
  choice: 万国
  rationale: 简洁而庄重地表达世上所有民族和邦国，并契合经文的王权语境。
- source_word: ἐν ῥάβδῳ σιδηρᾷ
  choice: 用铁杖
  rationale: 清楚保留工具格意义及诗篇第二篇的意象。
- source_word: ἡρπάσθη
  choice: 被猛然提到
  rationale: 被动表达保留动作的承受者；“猛然”体现ἁρπάζω所含突然、有力地移走之意，“提到”体现向上的移动。
- source_word: τὸ τέκνον αὐτῆς
  choice: 她的孩子
  rationale: 反映原文从υἱός转为较一般的τέκνον，不强行统一用词。
- source_word: πρὸς τὸν θεὸν καὶ πρὸς τὸν θρόνον αὐτοῦ
  choice: 到上帝和他的宝座那里去
  rationale: 保留朝向上帝及其宝座的移动；“那里去”使现代汉语句法自然。
theological_decisions:
- issue: ποιμαίνειν ... ἐν ῥάβδῳ σιδηρᾷ对诗篇第二篇的弥赛亚性呼应
  choice: 正文保留“牧养”隐喻，脚注说明其君王治理含义。
  alternative: 用铁杖统治万国
  rationale: 原文动词本义是“牧养”，但在诗篇第二篇的王权语境中也含治理之意。正文保留隐喻可避免把神学张力直接化约为解释。
- issue: μέλλει的语气
  choice: 译作“将要”
  alternative: 即将；必定要；要
  rationale: “将要”保留未来取向，并容纳预定将发生与时间临近之间的语义空间，不在启示文学语境中过度断定。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“万国”“铁杖”保留启示文学及诗篇呼应的凝练语体；避免古奥句法。
