  rationale: 修订恢复原文的修辞和句法重心：先提出“一个在弥赛亚里的人”，以“十四年前”开始对该人的叙述，将关于身体状态的双重未知作为破折号内的插入语，最后以“这个人被提到第三层天”完成主句。这样既不判定经历是肉身的还是离体的，也保留了 τὸν τοιοῦτον 对先前“一个人”的回指。脚注标记均仍紧邻其相关措辞，内容无需更动。
