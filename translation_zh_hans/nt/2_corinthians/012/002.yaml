  text: οἶδα ἄνθρωπον ἐν Χριστῷ πρὸ ἐτῶν δεκατεσσάρων— εἴτε ἐν σώματι οὐκ οἶδα, εἴτε ἐκτὸς τοῦ σώματος οὐκ οἶδα, ὁ θεὸς οἶδεν— ἁρπαγέντα τὸν τοιοῦτον ἕως τρίτου οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/002.yaml
  text: I know a man in Messiah who[a], fourteen years ago—whether in the body I do not know, or outside the body I do not know[c][b], God knows—was caught up to the third heaven.
translation:
  language: zh_hans
  text: 我知道有一个在弥赛亚里的人[a]：十四年前——是在身体里，我不知道；还是在身体以外，我不知道，神知道[b]——这个人被提到第三层天[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在弥赛亚里”也常译作“在基督里”。原文是 ἐν Χριστῷ；这里把 Χριστός 作为称号译为“弥赛亚”。
    reason: alternative_reading
  - marker: b
    text: 保罗没有说明这次经历是在身体里还是在身体以外；原文有意让经历的方式保持未定。
    reason: lexical_alternative
  - marker: c
    text: “第三层天”沿用古代犹太人的宇宙观用语，可指至高的天或乐园；正文保留原有说法，不直接作出解释。
    reason: cultural_note
lexical_decisions:
- source_word: οἶδα ἄνθρωπον
  choice: 我认识一个……人
  rationale: οἶδα 在这里具有现在时意义；“认识”自然表达说话者知道某个特定的人，而 ἄνθρωπον 在语境中指一名男子。
- source_word: ἐν Χριστῷ
  choice: 在弥赛亚里
  rationale: 保留保罗特有的联合性表达“在……里”，并将 Χριστός 作为称号译为“弥赛亚”。
- source_word: πρὸ ἐτῶν δεκατεσσάρων
  choice: 十四年前
  rationale: 以现代汉语自然的时间表达准确传达 πρό 加时间属格。
- source_word: εἴτε ἐν σώματι … εἴτε ἐκτὸς τοῦ σώματος
  choice: 是在身体里……还是在身体以外
  rationale: 直接保留“身体里／身体以外”的对照，不把经历解释为肉身升天或纯粹异象。
- source_word: ὁ θεὸς οἶδεν
  choice: 神知道
  rationale: 直译原文，不增添原文未明说的“惟有”。
- source_word: ἁρπαγέντα
  choice: 被提到
  rationale: 被动表达保留此人是承受动作的一方；“被提到”在庄重而通顺的汉语中表达向上带走。
- source_word: ἕως τρίτου οὐρανοῦ
  choice: 到第三层天
  rationale: 保留古代宇宙观表达及序数含义，不在正文中解释为乐园或最高天。
theological_decisions:
- issue: ἐν Χριστῷ 中 Χριστῷ 的译法
  choice: 在弥赛亚里
  alternative: 在基督里
  rationale: Χριστός 在此仍具有称号意义；“弥赛亚”呈现该称号，同时“在……里”保留保罗的联合用语。
- issue: 这次经历是在身体里还是身体以外
  choice: 保留说话者两次表示不知道，并以“神知道”收束
  alternative: 解释为肉身升天，或解释为离体异象
  rationale: 原文明确悬置经历方式；译文不应替作者解决这一张力。
- issue: “第三层天”的所指
  choice: 正文保留“第三层天”
  alternative: 直接译成“最高天”或“乐园”
  rationale: 原文采用 τρίτου οὐρανοῦ，翻译保留其文化和宇宙观措辞，仅在脚注说明。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“当时”补足汉语衔接，但不增加事件内容；调整希腊语长句次序，先交代被提，再呈现插入性的双重不确定，以避免中文主干过度拖延。所有脚注标记均置于相关正文之后。
