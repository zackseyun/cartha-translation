id: 2CO.12.4
reference: 2 Corinthians 12:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὅτι ἡρπάγη εἰς τὸν παράδεισον καὶ ἤκουσεν ἄρρητα ῥήματα ἃ οὐκ ἐξὸν ἀνθρώπῳ λαλῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/004.yaml
  text: that he was caught up into paradise and heard inexpressible words, which a man is not permitted to speak.
translation:
  language: zh_hans
  text: 他被提到乐园里，听见了不可言传的话，是人不可说的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡρπάγη
  choice: 被提到
  rationale: 保留被动语态以及突然被带走、被提上去的意味，同时用现代汉语中较自然的表达。
- source_word: παράδεισον
  choice: 乐园
  rationale: 这是该希腊词在新约语境中的传统且清楚的对应词，不把它直接等同于本节未明说的其他概念。
- source_word: ἄρρητα ῥήματα
  choice: 不可言传的话
  rationale: 既可涵盖难以用言语表达，也可与下文‘不可说’形成呼应；不擅自限定为仅仅‘无法表达’或仅仅‘禁止透露’。
- source_word: οὐκ ἐξὸν
  choice: 不可
  rationale: 表达‘不被允许／不合许可’的含义，同时保留原文没有交代许可来源的简洁性。
- source_word: ἀνθρώπῳ
  choice: 人
  rationale: 此处泛指人类个体，不译成带男性限定的‘男人’。
theological_decisions:
- issue: ‘不可言传’与‘不可说’之间的关系
  choice: 保留两层表述，不说明究竟是无法表达还是不蒙准许透露
  alternative: 译为‘无法用言语表达的话，是人不得说出的’
  rationale: ἄρρητα 可有难以言说或不可说出的张力，οὐκ ἐξὸν 则明确涉及不许可；译文不应把前者的歧义完全消解。
- issue: 乐园的具体所在
  choice: 仅译‘乐园’，不加‘天上’等解释
  alternative: 译为‘天上的乐园’
  rationale: 本节本身只说 παράδεισος；其与前文‘第三层天’的关系不宜在译文中额外判定。
translation_notes:
  register: 采用简洁、庄重而现代的书面汉语。句式紧贴希腊文的两个并列动作及其后的关系从句；‘是人不可说的’保留原文略带凝练感的限定结构。
