id: 2CO.12.9
reference: 2 Corinthians 12:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ εἴρηκέν μοι· Ἀρκεῖ σοι ἡ χάρις μου· ἡ γὰρ ⸀δύναμις ἐν ἀσθενείᾳ ⸀τελεῖται. ἥδιστα οὖν μᾶλλον καυχήσομαι ἐν ταῖς ἀσθενείαις ⸀μου, ἵνα ἐπισκηνώσῃ ἐπ’ ἐμὲ ἡ δύναμις τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/009.yaml
  text: And he has said to me[a], “My grace is sufficient for you, for my power is made perfect in weakness.” Therefore I will boast all the more gladly in my weaknesses[d][c][b], so that the power of Messiah may dwell upon me.
translation:
  language: zh_hans
  text: 他对我说过：“我的恩典对你已经够了，因为能力在软弱中得以成全。”所以，我就更乐意夸耀自己的种种软弱[a]，好让弥赛亚的能力覆庇我[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “更乐意夸耀”也可译作“更欢喜地夸耀”。
    reason: lexical_alternative
  - marker: b
    text: “覆庇我”也可译作“停驻在我身上”；原文更直白地带有“在我之上支搭帐幕”的意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴρηκέν
  choice: 说过
  rationale: 用“说过”体现完成时所表达的既已说出、其效力仍然持续的意味，同时符合现代汉语习惯。
- source_word: Ἀρκεῖ σοι ἡ χάρις μου
  choice: 我的恩典对你已经够了
  rationale: “够了”自然传达恩典足以应付保罗处境的意思；“已经”加强其现实有效性，但不暗示恩典仅在过去足够。
- source_word: χάρις
  choice: 恩典
  rationale: “恩典”是现代中文基督教语境中成熟且易懂的对应词，也保留保罗用语所具有的神学内涵。
- source_word: ἡ δύναμις
  choice: 我的能力
  rationale: SBLGNT正文此处有定冠词而无明确所有格，但引语语境自然指向说话者的能力；“我的能力”使中文指代清楚，同时在神学说明中保留原文形式上的含混。
- source_word: τελεῖται
  choice: 显得完全
  rationale: 既保留“达到完全、充分实现”的含义，也避免让读者误以为神的能力原先存在道德或本质缺陷；被动形式在汉语中自然表达为“显得完全”。
- source_word: ἀσθενείᾳ / ἀσθενείαις
  choice: 软弱／种种软弱
  rationale: 单数表达一般原则，复数指保罗具体的多种软弱经历；以“种种”自然体现复数，并保留关键词的重复。
- source_word: ἥδιστα οὖν μᾶλλον καυχήσομαι
  choice: 所以，我更要欢欢喜喜地夸耀
  rationale: “更要”体现μᾶλλον的比较加强，“欢欢喜喜地”表达ἥδιστα的高度乐意；“夸耀”保留保罗修辞中的悖论，而非淡化为一般的欣慰。
- source_word: ἐπισκηνώσῃ ἐπ’ ἐμέ
  choice: 覆庇我
  rationale: 该动词带有在某人之上搭帐幕、停驻的形象；“覆庇”兼顾临到、停驻和遮盖的空间意象，又比直译“在我上面支搭帐幕”自然。
- source_word: Χριστοῦ
  choice: 弥赛亚的
  rationale: 此处带定冠词的中文表达将Χριστός作为称号处理；“弥赛亚”保留其“受膏者”的称号含义。
theological_decisions:
- issue: δύναμις是否明确译作“我的能力”
  choice: 正文译作“我的能力”
  alternative: 译作“能力”
  rationale: 所给SBLGNT文本在δύναμις前没有显式的μου，但引语的说话者及后文“弥赛亚的能力”使所有关系在语境中十分自然。中文若只说“能力”略显悬空，因此正文补足“我的”；同时不声称这是原文明确写出的所有格。
- issue: τελεῖται如何描述神的能力
  choice: 显得完全
  alternative: 达到完全／在软弱中成全
  rationale: “显得完全”表达能力在软弱中得到充分彰显，并避免暗示神的能力本身原先不完全；“达到完全”更形式对应，但中文可能造成神力逐渐完善的误解。
- issue: Χριστοῦ的称号性质
  choice: 弥赛亚
  alternative: 基督
  rationale: 这里可自然理解为称号，故用“弥赛亚”显明“受膏者”的意义；“基督”是传统且可成立的音译性表达，但更容易被当作名字的一部分。
- issue: ἐπισκηνώσῃ的帐幕意象
  choice: 覆庇我
  alternative: 停驻在我身上／在我之上支搭帐幕
  rationale: “覆庇”保留能力临到并遮盖保罗的意象，同时适合现代庄重汉语；脚注说明更直译的帐幕意象，以免其隐喻完全消失。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“恩典、软弱、夸耀、弥赛亚”等核心神学和修辞词汇；避免过度文言化。引语与叙述衔接自然，并以“种种软弱”明确复数。所有脚注标记均已置于正文相应位置。
