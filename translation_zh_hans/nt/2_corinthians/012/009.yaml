revisions:
- from: 他对我说过：“我的恩典对你已经够了，因为我的能力在软弱中显得完全。”所以，我更要欢欢喜喜地夸耀自己的种种软弱[a]，好让弥赛亚的能力覆庇我[b]。
  to: 他对我说过：“我的恩典对你已经够了，因为能力在软弱中得以成全。”所以，我就更乐意夸耀自己的种种软弱[a]，好让弥赛亚的能力覆庇我[b]。
  rationale: 修订以所给SBLGNT正文为准，删除未明示的“我的”，从而保留“能力”的形式歧义；将τελεῖται译为“得以成全”，表达其被动及充分实现的含义，而不暗示神的能力本有缺陷。其余核心术语和帐幕意象予以保留，并调整夸耀短语使其更符合现代庄重普通话。
