  - severity: medium
    issue: “显得完全”弱化并改变τελεῖται的语义
    rationale: τελεῖται是被动式，指能力在软弱中得以成全、充分实现，而不只是“看起来完全”。
  - severity: low
    issue: “更要欢欢喜喜地夸耀”略显重复和口语化
    rationale: “更乐意夸耀”在现代庄重汉语中更凝练，并保留“更”和最高程度的乐意。
