base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/016.yaml
  text: 'But let it be so: I did not burden you[a]. Yet, being crafty[c][b], I took you by deceit.'
translation:
  language: zh_hans
  text: 就算如此吧：我并没有加重你们的负担[a]。但我这个狡猾的人，用诡诈抓住了你们[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“好吧，就算是这样”或“无论如何”；保罗似乎为了论证而暂且承认这一点。
    reason: lexical_alternative
  - marker: b
    text: “我这个狡猾的人，用诡诈抓住了你们”很可能是保罗以反讽口吻复述别人对他的指控，并非真的承认自己欺骗了他们。
    reason: alternative_reading
  - marker: c
    text: “抓住了你们”也可译作“把你们套住了”“诱骗了你们”或“用诡诈占了你们的便宜”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστω δέ
  choice: 就算如此吧
  rationale: 这是用于论辩的让步表达，表示保罗暂且承认对方所说的一点，以推进论证；译文保留其修辞性的让步语气。
- source_word: κατεβάρησα
  choice: 加重……的负担
  rationale: 该动词本义是“压重、使负担沉重”；本段语境尤其涉及物质或经济上的拖累。此译既保留负重意象，也符合现代汉语表达。
- source_word: ὑπάρχων
  choice: 既然
  rationale: 希腊语分词表示伴随处境，其确切逻辑关系并未明说。中文若直译“身为”略显生硬；“既然”自然呈现被转述指控的推论口吻，但不把该话当作保罗真诚的自白。
- source_word: πανοῦργος
  choice: 狡猾
  rationale: 该词在此带有负面的机巧、诡诈含义；“狡猾”通俗而庄重，符合保罗所反讽复述的指控。
- source_word: δόλῳ
  choice: 用诡诈
  rationale: 工具格表达手段；“用诡诈”简洁地保留了“借欺骗手段”的指控语气。
- source_word: ἔλαβον
  choice: 把你们套住了
  rationale: λαμβάνω 基本义为“拿、取得”，此处结合“用诡诈”可指以计谋攫取、捕获或占便宜。“套住”在现代汉语中能表达设法使人落入掌控，同时不直接限定为经济剥削。
theological_decisions:
- issue: ἀλλὰ之后的话是保罗本人的承认，还是对别人指控的反讽复述
  choice: 正文按表层措辞直译为“我既然狡猾，就用诡诈把你们套住了”，并以脚注说明其反讽可能性
  alternative: 显译为“你们却说，我狡猾地用诡诈套住了你们”
  rationale: 上下文中保罗否认自己或同工占哥林多人的便宜，因此这句话很可能是在反讽地复述对他的指控。正文不补入原文没有的“你们却说”，以保留原有的修辞张力；脚注帮助读者避免把它简单视为真实认罪。
translation_notes:
  register: 采用现代、清楚而庄重的普通话。“就算如此吧”传达论辩中的让步；“加重你们的负担”与上下文的经济负担相合；后半句保留尖锐且略显突兀的表层自述，使反讽不被正文提前消解。
