  text: ἐὰν γὰρ θελήσω καυχήσασθαι, οὐκ ἔσομαι ἄφρων, ἀλήθειαν γὰρ ἐρῶ· φείδομαι δέ, μή τις εἰς ἐμὲ λογίσηται ὑπὲρ ὃ βλέπει με ἢ ἀκούει ⸀τι ἐξ ἐμοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/006.yaml
  text: For if I should want to boast[a], I would not be foolish, for I would be speaking the truth. But I refrain, so that no one may reckon me above what he sees in me or hears from me.
translation:
  language: zh_hans
  text: 因为，如果我想夸口，我也不会是愚妄的，因为我会说实话；但我还是不说，免得有人对我的评价超过他在我身上所看见的，或从我这里所听见的[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“或从我这里听见的任何话。”希腊文在“听见”之后有一个不定代词。
    reason: 说明原文明确含有不定成分τι；正文按自然汉语将其隐含在“所听见的”之中。
lexical_decisions:
- source_word: θελήσω
  choice: 想
  rationale: 与ἐὰν构成假设条件；“即使我想”以自然现代汉语表达一种可能的意愿，而不把它强化为已经作出的决定。
- source_word: καυχήσασθαι
  choice: 夸口
  rationale: 保留保罗语境中自我称许、且可能带有反讽意味的用语，并与本章前文一致。
- source_word: ἄφρων
  choice: 愚妄的
  rationale: 对应作表语的形容词，保留本段关于“愚妄”的主题性用语；“愚妄”也比“没脑子”更庄重。
- source_word: ἀλήθειαν γὰρ ἐρῶ
  choice: 因为我说的会是实话
  rationale: 将条件语境中的将来时自然表达为“会是”，同时明确保留所说内容真实这一理由。
- source_word: φείδομαι
  choice: 但我还是不说
  rationale: 在本语境中指克制自己、不再夸口；译成具体自然的汉语，避免含混地理解为“怜惜自己”。
- source_word: λογίσηται
  choice: 把我看得
  rationale: 这里是对保罗作出评价或估量；“把我看得过高”自然传达λογίζομαι的评估意味。
- source_word: ὑπὲρ ὃ
  choice: 过高，超过……
  rationale: 明确表达ὑπέρ所表示的超越某一根据或限度。
- source_word: βλέπει με
  choice: 在我身上所看见的
  rationale: 表达别人以保罗身上可观察到的事实为评价根据，不把原文具体化为仅仅“看见我做的事”。
- source_word: ἀκούει τι ἐξ ἐμοῦ
  choice: 从我这里所听见的
  rationale: 自然表达信息或话语出自保罗；希腊文不定成分τι在汉语关系结构中可以隐含，另以脚注说明。
theological_decisions:
- issue: 保罗夸口的真实性与他选择克制之间的张力
  choice: 译为他若夸口也不会愚妄，因为所说属实；然而他仍选择不说，以免别人过高评价他。
  alternative: 将本句释义为保罗认为夸口本身就是正当的，或反过来认定一切夸口都必然虚假、犯罪。
  rationale: 原文同时陈述这种夸口会真实且不愚妄，又强调保罗主动克制；译文保留两面，不扩展成关于一切夸口的教义判断。
- issue: 别人评价保罗的合宜依据
  choice: 保留“所看见的”与“从我这里所听见的”作为评价限度。
  alternative: 将其解释成只可根据神迹、启示或某一特定类目的事工来评价保罗。
  rationale: 原文没有进一步限定所见所闻的内容，译文不补入特定神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“夸口”“愚妄”延续保罗书信中的主题词；句法稍作汉语化处理，但保留条件、理由、转折、目的以及评价限度的逻辑关系。
