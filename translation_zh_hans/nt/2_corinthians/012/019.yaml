  text: ⸀Πάλαι δοκεῖτε ὅτι ὑμῖν ἀπολογούμεθα; ⸀κατέναντι θεοῦ ἐν Χριστῷ λαλοῦμεν. τὰ δὲ πάντα, ἀγαπητοί, ὑπὲρ τῆς ὑμῶν οἰκοδομῆς,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/019.yaml
  text: Have you been thinking all along that we are defending ourselves to you? Before God[a], in Messiah, we are speaking. And everything, beloved[b], is for your building up.
translation:
  language: zh_hans
  text: 你们一直以为，我们是在向你们为自己辩解吗？我们是在上帝面前、在弥赛亚里说话。这一切，亲爱的，都是为了造就你们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πάλαι
  choice: 一直
  rationale: 这里表示读者持续至今的看法，而非严格指很久以前；“一直”自然地传达这种延续性。
- source_word: δοκεῖτε
  choice: 你们一直以为……吗
  rationale: 与 Πάλαι 合译为持续性的反问，符合现代汉语表达。
- source_word: ἀπολογούμεθα
  choice: 向你们为自己辩解
  rationale: 保留自我申辩、自我辩护的语义，同时避免过于专门的法律术语。
- source_word: κατέναντι θεοῦ
  choice: 在上帝面前
  rationale: 表达在上帝临在与鉴察之下说话的庄重含义。
- source_word: ἐν Χριστῷ
  choice: 在基督里
  rationale: 保留保罗常用的联合或关系范畴；简体中文圣经语域中“基督”自然、明确。
- source_word: λαλοῦμεν
  choice: 说话
  rationale: 直接保留现在时语境中的言说动作。
- source_word: τὰ δὲ πάντα
  choice: 我们所做的一切
  rationale: 结合上下文，将中性复数概括为保罗一切言行；补出“所做”使汉语自然，但不把范围限制为言语。
- source_word: ἀγαπητοί
  choice: 亲爱的弟兄姊妹
  rationale: 以现代教会共同体中自然且具包容性的称呼传达亲爱之意；原词本身未标明性别。
- source_word: ὑπὲρ τῆς ὑμῶν οἰκοδομῆς
  choice: 为了造就你们
  rationale: “造就”准确传达属灵建立的建筑隐喻，并在现代中文中简洁易懂。
theological_decisions:
- issue: ἐν Χριστῷ 的译法
  choice: 在基督里
  alternative: 在弥赛亚里
  rationale: 此处重点是保罗式的“在基督里”关系表达；“基督”在现代标准中文中既保留称号含义，也比“在弥赛亚里”更自然，未将其简化为纯粹人名。
- issue: οἰκοδομή 的隐喻
  choice: 造就你们
  alternative: 建立你们
  rationale: “造就”保留群体属灵成长的含义，同时不把具体方式限定为教义教导或个人品格塑造。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。首句保留反问语气；第二句维持“在上帝面前”与“在基督里”两个短语的并列张力；末句将呼语前置，使中文流畅，并以“造就”保留 οἰκοδομή 的建筑隐喻。
