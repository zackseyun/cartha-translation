revisions:
- from: 你们一直以为，我们是在向你们为自己辩解吗？我们是在上帝面前、在基督里说话。亲爱的弟兄姊妹，我们所做的一切，都是为了造就你们。
  to: 你们一直以为，我们是在向你们为自己辩解吗？我们是在上帝面前、在弥赛亚里说话。这一切，亲爱的，都是为了造就你们。
  rationale: 删除原文未明示的“弟兄姊妹”，以“亲爱的”保留呼语；将“我们所做的一切”改为“这一切”，不把τὰ πάντα限于行为；并将称号性Χριστός译为“弥赛亚”，以脚注列出常见替代译法。
