  text: καὶ οἶδα τὸν τοιοῦτον ἄνθρωπον— εἴτε ἐν σώματι εἴτε ⸀χωρὶς τοῦ σώματος οὐκ οἶδα, ὁ θεὸς οἶδεν—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/003.yaml
  text: And I know such a man—whether in the body or apart from the body I do not know[a]; God knows—
translation:
  language: zh_hans
  text: 我也知道这样一个人——是在身体里，还是在身体以外，我不知道，神知道——
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἶδα
  choice: 知道
  rationale: 这是现代汉语中表达认知性知晓的自然对应词；原文在本节反复使用该词，因此统一译为“知道”，保留修辞呼应。
- source_word: τὸν τοιοῦτον ἄνθρωπον
  choice: 这样一个人
  rationale: 既指向上文所描述的特定男子，又保留保罗以第三人称间接指称自己的修辞距离；不直接增译为“我”。
- source_word: εἴτε ... εἴτε
  choice: 是……还是……
  rationale: 自然呈现原文列出的两种可能性，并保持问题未决。
- source_word: ἐν σώματι
  choice: 在身体里
  rationale: 较形式地保留介词结构，并与下文“在身体以外”形成清楚对照；汉语无需增添所有格。
- source_word: χωρὶς τοῦ σώματος
  choice: 在身体以外
  rationale: χωρίς表达与身体分离；此译法自然且不过度界定其形而上性质。“离开身体”也是可能译法。
- source_word: οὐκ οἶδα, ὁ θεὸς οἶδεν
  choice: 我不知道，神知道
  rationale: 保留保罗的未知与神的知晓之间的鲜明对照，也维持“知道”一词的重复。
- source_word: θεὸς
  choice: 神
  rationale: 无歧义地指上帝；“神”是简体中文圣经语体中自然、庄重且通行的称呼。
theological_decisions:
- issue: 保罗的间接自指及该经历的性质
  choice: 保留第三人称“这样一个人”，并让“在身体里”或“在身体以外”保持未决。
  alternative: 明说此人就是保罗，或把该经历确定译成灵魂出窍。
  rationale: 希腊文刻意保持修辞距离，也没有说明该经历究竟是否具身体性；译文不应代替原文解决这一张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“这样一个人”保留原文略显间接的表达；破折号照应上下文中插入式说明，并保留本句未完待续的结构。
