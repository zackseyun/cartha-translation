id: 2CO.12.1
reference: 2 Corinthians 12:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καυχᾶσθαι ⸀δεῖ· οὐ ⸂συμφέρον μέν⸃, ἐλεύσομαι ⸀δὲ εἰς ὀπτασίας καὶ ἀποκαλύψεις κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/001.yaml
  text: Boasting is necessary[a], though it is not beneficial[b]; but I will go on to visions and revelations of the Lord.
translation:
  language: zh_hans
  text: 夸口是必要的，虽然没有益处；不过，我要进而说到主的异象和启示[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “主的”也可译作“从主而来的”。希腊语属格没有明确限定这里所表达的关系。
    reason: alternative_reading
lexical_decisions:
- source_word: Καυχᾶσθαι
  choice: 夸口
  rationale: 该现在时中间语态不定式在句中作名词性成分；“夸口”保留其动作含义，也符合本段保罗不情愿地谈论自己的语境。
- source_word: δεῖ
  choice: 是必要的
  rationale: δεῖ表达必要性。“是必要的”保留原文无人称结构的力度，不额外补出主语“我”。
- source_word: οὐ συμφέρον μέν
  choice: 虽然没有益处
  rationale: συμφέρον指有利、有益；“虽然”自然体现μέν所引出的让步关系，并为后面的δέ作铺垫。
- source_word: ἐλεύσομαι δὲ εἰς
  choice: 不过，我要进而说到
  rationale: 此处ἔρχομαι与εἰς表示转入下一个话题；“进而说到”比直译为“来到”更符合现代汉语，并由“不过”体现δέ的转折。
- source_word: ὀπτασίας
  choice: 异象
  rationale: ὀπτασία指超自然的所见或异象；“异象”是准确、简明且通行的对应词。
- source_word: ἀποκαλύψεις
  choice: 启示
  rationale: ἀποκάλυψις指揭示、显明，在此语境中“启示”自然地表达来自神圣领域的显明，同时保留复数概念的集合性。
- source_word: κυρίου
  choice: 主的
  rationale: 以“主的”对应属格κυρίου，并让它同时修饰“异象”和“启示”；这种表达没有把属格关系限定为来源，较好地保留原文的含混性。
theological_decisions:
- issue: κυρίου与“异象和启示”的关系
  choice: 主的异象和启示
  alternative: 从主而来的异象和启示
  rationale: 希腊语属格可表示来源，也可能容许其他关联。译作“主的”保留原文的简约和关系上的含混，避免把它明确限定为“来自主”。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“夸口是必要的”略带书面色彩，以保留原文无人称、概括性的句法；“进而说到”清楚表明话题推进。用“虽然……不过……”呈现μέν……δέ的让步转折关系。
