  text: παρεκάλεσα Τίτον καὶ συναπέστειλα τὸν ἀδελφόν· μήτι ἐπλεονέκτησεν ὑμᾶς Τίτος; οὐ τῷ αὐτῷ πνεύματι περιεπατήσαμεν; οὐ τοῖς αὐτοῖς ἴχνεσιν;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/018.yaml
  text: I urged Titus to go and sent the brother with him. Titus did not take advantage of you[a], did he? Did we not walk in the same spirit? Did we not walk in the same footsteps?
translation:
  language: zh_hans
  text: 我劝提多前去，又派那位弟兄和他同去。提多没有占你们的便宜，不是吗？我们不是以同一精神行事吗？不是踏着同样的脚踪吗？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρεκάλεσα Τίτον
  choice: 我劝提多前去
  rationale: παρακαλέω在此表示为实际使命而恳切劝请；“前去”虽非希腊文明说，却由差派语境自然补出，使现代汉语完整通顺。
- source_word: συναπέστειλα
  choice: 又差派……和他同去
  rationale: 复合动词表达把另一人一同差去；汉语用“和他同去”清楚呈现同行关系。
- source_word: τὸν ἀδελφόν
  choice: 那位弟兄
  rationale: 保留定冠词所指的特定人物，不擅自添加“我们的”；“弟兄”符合初期信徒彼此称呼的语境。
- source_word: μήτι ἐπλεονέκτησεν ὑμᾶς Τίτος
  choice: 提多没有占你们的便宜，不是吗？
  rationale: μήτι预期否定回答；“没有……不是吗”在现代汉语中自然传达这一反问。πλεονεκτέω指为自己谋利而损害别人，“占便宜”保留其范围，不限缩为法律意义的欺诈。
- source_word: τῷ αὐτῷ πνεύματι
  choice: 本着同一个灵
  rationale: 与格可表示行事的领域、方式或动力。“本着同一个灵”尽量保留“共同的心志”与“同一位圣灵”之间的可能张力，并以脚注说明。
- source_word: περιεπατήσαμεν
  choice: 行事
  rationale: 此处“行走”比喻生活与行为方式；首句译为“行事”符合现代汉语，同时下一句保留脚踪和行走的形象。
- source_word: τοῖς αὐτοῖς ἴχνεσιν
  choice: 沿着同样的脚踪行走
  rationale: ἴχνος是脚印、踪迹，转指相同的行为路径；此译保留原文鲜明的行走隐喻。
theological_decisions:
- issue: τῷ αὐτῷ πνεύματι中πνεῦμα的所指
  choice: 正文译作“本着同一个灵”，不在正文中限定为人的心志或圣灵
  alternative: “怀着同样的心志”或“靠着同一位圣灵”
  rationale: 上下文强调保罗与提多行事一致，可能首先指共同的心志和态度；但与格也可能指同一位圣灵的引导或能力。正文与脚注共同保留此神学歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“那位弟兄”保留特指；两个反问分别呈现。首个περιπατέω按习惯译作“行事”，末句则保留“脚踪—行走”的原文意象。
