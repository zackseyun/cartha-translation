  text: Concerning this[d][c][b][a], three times I pleaded with the Lord that it might depart from me.
translation:
  language: zh_hans
  text: 关于这事，我曾三次恳求主，求它离开我。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “关于这事”也可译作“为这事”。
    reason: lexical_alternative
  - marker: b
    text: 原文没有明说“它”所指为何；这个隐含的主语承接上一节所说的“肉体上的一根刺”或“撒但的使者”。
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπὲρ τούτου
  choice: 为这事
  rationale: ὑπέρ加属格在这里引出恳求所关乎的事，承接上一节所说的苦楚；“为这事”自然简洁，也保留“关于此事／因这事”的语义范围。
- source_word: τρὶς
  choice: 三次
  rationale: 准确表达三次发生的恳求，符合现代汉语。
- source_word: τὸν κύριον
  choice: 主
  rationale: 原文仅说“主”，没有明说耶稣；译文不作扩充，以保留原文措辞及其所指。
- source_word: παρεκάλεσα
  choice: 恳求
  rationale: παρακαλέω在向主祈求解除苦楚的语境中表示郑重而迫切地请求；“恳求”既传达语气，又不过度强化。
- source_word: ἵνα ἀποστῇ ἀπ’ ἐμοῦ
  choice: 叫它离开我
  rationale: ἵνα引出恳求的内容；ἀποστῇ表示离去、离开。动词主语在希腊文中省略，中文用“它”回指上文的苦楚，同时避免明确判定是“刺”还是“撒但的使者”。
theological_decisions:
- issue: “主”的所指
  choice: 保留为“主”
  alternative: 主耶稣
  rationale: 在保罗书信的语境中很可能指主耶稣，但希腊文没有出现“耶稣”之名，因此不在正文中补明。
- issue: ἀποστῇ的隐含主语
  choice: 用中性的“它”
  alternative: 他／那使者／那根刺
  rationale: 上文同时提到“肉体上的刺”和“撒但的使者”；用“它”可维持原文未明说主语所留下的张力，而不替读者作出判定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“曾三次恳求”表达过去发生的三次祈求；保留“主”而不扩写为“主耶稣”，并以“它”维持隐含主语的模糊性。
