  text: Did I exploit you through any of those whom I sent to you?[a]
translation:
  language: zh_hans
  text: 我所派到你们那里去的人中，难道我借着哪一个占过你们的便宜吗？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“剥削过你们”或“欺诈过你们”。这个希腊语动词有损人利己、从别人身上牟利的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: μή
  choice: 难道……吗
  rationale: μή引出预期否定回答的反问；“难道……吗”既符合现代汉语习惯，也保留保罗否认指控的反问语气。
- source_word: τινα ὧν
  choice: 我派到你们那里去的人中……哪一个
  rationale: 保留从保罗所差派的一群人中任选一人的部分关系，并以自然的汉语结构表达。
- source_word: ἀπέσταλκα πρὸς ὑμᾶς
  choice: 我派到你们那里去的人
  rationale: 完成时在这里着重于保罗曾差派到哥林多的人；汉语用“派到……去”自然清楚，无须另行标示完成体。
- source_word: δι’ αὐτοῦ
  choice: 借着哪一个
  rationale: αὐτοῦ为单数，回指前面的不定代词；译文保留逐一设问的单数含义，而不把它泛化为整个群体。
- source_word: ἐπλεονέκτησα ὑμᾶς
  choice: 占过你们的便宜
  rationale: 该动词表示以他人为代价谋利或不当取利。“占……的便宜”是自然、易懂的现代汉语，并保留其可能涉及经济或关系层面侵害的语义范围。
theological_decisions:
- issue: 保罗是否承认曾借差派者牟利
  choice: 用预期否定回答的反问表达坚决否认
  alternative: 改写为直接陈述“我没有……”
  rationale: 原文采用μή引导的反问，不只是平铺直叙；保留反问可呈现保罗在辩护中的语气和论证张力。
translation_notes:
  register: 采用庄重而口语自然的现代标准普通话。“难道……吗”清楚传达预期否定回答的反问；“占过你们的便宜”便于普通读者理解，脚注补充其较强的牟利、剥削和欺诈色彩。
