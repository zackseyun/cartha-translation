id: 2CO.12.7
reference: 2 Corinthians 12:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ τῇ ὑπερβολῇ τῶν ἀποκαλύψεων. ⸀διὸ ἵνα μὴ ὑπεραίρωμαι, ἐδόθη μοι σκόλοψ τῇ σαρκί, ἄγγελος ⸀Σατανᾶ, ἵνα με κολαφίζῃ, ⸂ἵνα μὴ ὑπεραίρωμαι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/007.yaml
  text: And because of the surpassing greatness of the revelations—so that I might not exalt myself—a thorn in the flesh was given to me[a], a messenger of Satan, so that it might torment me[e][d][c][b], so that I might not exalt myself.
translation:
  language: zh_hans
  text: 又因这些启示极其非凡，免得我自高，有一根刺加在我肉体上[a]，就是撒但的使者[b]，为要击打我[c]，免得我自高[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “刺”也可译作“尖桩”或“尖木刺”。希腊语 σκόλοψ 指尖锐之物，具体形象不能确定。
    reason: lexical_alternative
  - marker: b
    text: “使者”也可译作“天使”。希腊语 ἄγγελος 可指“使者”或“天使”。
    reason: lexical_alternative
  - marker: c
    text: “击打我”也可译作“折磨我”。希腊语动词 κολαφίζῃ 本义是用拳头打或接连打击。
    reason: lexical_alternative
  - marker: d
    text: “免得我自高”在希腊文中前后出现两次，正文保留了这一重复。
    reason: textual_transparency
lexical_decisions:
- source_word: τῇ ὑπερβολῇ τῶν ἀποκαλύψεων
  choice: 所得的启示极其非凡
  rationale: “ὑπερβολή”表示超常、极高的程度；译为“极其非凡”能自然传达这些启示的非同寻常，同时不把重点窄化为数量或某一种品质。“所得的”在汉语中补明保罗领受启示的关系，并未另行指定启示的来源。
- source_word: διὸ ἵνα μὴ ὑπεραίρωμαι
  choice: 为了使我不自高
  rationale: “διὸ”承接启示的非凡，“ἵνα”引出目的；“不自高”保留动词的抬高、抬举意象，也符合现代汉语。
- source_word: ἐδόθη μοι
  choice: 就有……加在我……上
  rationale: 保留希腊文的神学被动，不明说是谁施加或赐下这根刺，从而不替文本判定最终施事者。
- source_word: σκόλοψ τῇ σαρκί
  choice: 一根刺加在我的肉体上
  rationale: “刺”是自然且有力度的传统隐喻；“肉体”比“身体”更贴近 σάρξ，并不把这处经文解释成某种具体疾病或所谓“罪性”。脚注说明 σκόλοψ 也可指尖桩或尖木刺。
- source_word: ἄγγελος Σατανᾶ
  choice: 撒但的使者
  rationale: “使者”保留 ἄγγελος 可指天使性存在或一般使者的语义宽度，不预先判定其本体身份。
- source_word: κολαφίζῃ
  choice: 击打我
  rationale: 该动词本义涉及用拳头殴打、连续打击；“击打”保留暴力意象，又能在此隐喻语境中自然理解。
- source_word: ἵνα μὴ ὑπεραίρωμαι
  choice: 使我不自高
  rationale: 原文末尾重复同一目的语，正文照样保留，不以汉语修辞为由删略。
theological_decisions:
- issue: “肉体上的刺”的具体性质
  choice: 保留“一根刺加在我的肉体上”的隐喻，不说明它究竟是什么
  alternative: 明确译成身体疾病、逼迫、敌对者或邪灵压制
  rationale: 本节没有界定这根刺的具体性质；保留隐喻可避免把某一种解释写进正文。
- issue: “加在我身上”的施事者
  choice: 采用不明说施事者的表达
  alternative: 译为“上帝把一根刺加在我身上”或“撒但把一根刺加在我身上”
  rationale: 希腊文使用被动式，虽可能暗含上帝的许可或安排，却没有在本句明说；与此同时，经文又称其为“撒但的使者”。译文保留这种张力。
- issue: ἄγγελος Σατανᾶ 的身份
  choice: 撒但的使者
  alternative: 撒但的天使；撒但派来的人
  rationale: “使者”不限定它是邪灵还是人间代理者，符合原词的语义范围。
- issue: 两次“使我不自高”
  choice: 两次都保留
  alternative: 为避免重复而删除其中一次
  rationale: SBLGNT 正文两次出现相应目的语；保留重复能呈现原文强调，并避免根据修辞判断改写文本。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“极其非凡”“不自高”“加在……上”“击打”等措辞保持经文的力度和隐喻，同时避免生硬仿照希腊语序。标点梳理了前置原因、目的和主句之间的关系，但没有删去原文重复。
