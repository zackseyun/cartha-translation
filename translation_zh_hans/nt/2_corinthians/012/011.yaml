  text: Γέγονα ⸀ἄφρων· ὑμεῖς με ἠναγκάσατε· ἐγὼ γὰρ ὤφειλον ὑφ’ ὑμῶν συνίστασθαι. οὐδὲν γὰρ ὑστέρησα τῶν ὑπερλίαν ἀποστόλων, εἰ καὶ οὐδέν εἰμι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/011.yaml
  text: I have become a fool; you forced me to it. For I ought to have been commended by you[a], for I fell short in nothing compared with those super-apostles, even if I am nothing.
translation:
  language: zh_hans
  text: 我成了愚妄人；是你们逼我到这一步的。因为我本该由你们称许；因为我丝毫不比那些超级使徒[a]逊色，即使我算不得什么。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那些极其卓越的使徒。”希腊语措辞极为强调，在本段语境中也可能带有反讽意味。
    reason: 保留该短语可作非反讽理解的另一译法，并说明其强烈但未被原文明示为讽刺的语气。
lexical_decisions:
- source_word: Γέγονα
  choice: 我成了
  rationale: 用“成了”表达完成时所指向的现今状态，同时保持自然简洁。
- source_word: ἄφρων
  choice: 愚妄人
  rationale: 保留名词性谓语和保罗带有反讽意味的自我描述；“愚妄人”庄重而易懂。
- source_word: ὑμεῖς με ἠναγκάσατε
  choice: 是你们逼我到这一步的
  rationale: 用“是你们”体现强调的人称主语，并以“到这一步”自然补出上下文所指的愚妄自夸。
- source_word: ἐγὼ γὰρ ὤφειλον ὑφ’ ὑμῶν συνίστασθαι
  choice: 其实，本该由你们举荐我
  rationale: “本该”表达未实现的应有之事；“由你们举荐我”保留被动关系及哥林多人本应公开支持保罗的语境。句首“其实”承接前句并体现第一个 γάρ 的解释作用。
- source_word: οὐδὲν γὰρ ὑστέρησα
  choice: 因为我丝毫不……逊色
  rationale: “丝毫不逊色”准确表达在任何方面都不落后或不及，并以“因为”直接体现第二个 γάρ。
- source_word: τῶν ὑπερλίαν ἀποστόλων
  choice: 那些超级使徒
  rationale: 保留 ὑπερλίαν 的强烈夸张色彩，并让上下文中的反讽或论战意味保持可感而不在正文中明说。
- source_word: εἰ καὶ οὐδέν εἰμι
  choice: 即使我算不得什么
  rationale: 保留让步结构以及保罗自谦、自我贬抑的张力；“算不得什么”比生硬的“我是无有”更符合现代汉语。
theological_decisions:
- issue: τῶν ὑπερλίαν ἀποστόλων 的指称与语气
  choice: 正文译为“那些超级使徒”，不明说这是讽刺，也不加“所谓的”
  alternative: 译为“那些极其卓越的使徒”，按非反讽方式理解为备受尊崇的使徒
  rationale: 该短语在《哥林多后书》的上下文中很可能带有反讽或论战色彩，但希腊文本没有相当于“所谓的”的显式标记。正文保留夸张措辞，脚注提供非反讽译法，以保存原文的歧义与神学张力。
- issue: 保罗宣称不逊色与承认自己算不得什么之间的张力
  choice: 并列保留“丝毫不……逊色”和“即使我算不得什么”
  alternative: 将后半句解释为单纯谦辞，或弱化前半句的使徒权柄主张
  rationale: 原文有意把两项陈述紧密并置；翻译不替读者消解其修辞和神学张力。
translation_notes:
  register: 采用现代、庄重而口语可懂的普通话。“愚妄人”“本该”“丝毫不逊色”兼顾书面尊严与日常可读性；不使用“所谓的”来过度解释反讽。
