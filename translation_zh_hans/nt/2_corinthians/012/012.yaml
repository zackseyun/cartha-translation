  text: τὰ μὲν σημεῖα τοῦ ἀποστόλου κατειργάσθη ἐν ὑμῖν ἐν πάσῃ ⸀ὑπομονῇ, σημείοις ⸀τε καὶ τέρασιν καὶ δυνάμεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/012.yaml
  text: Indeed[a], the signs of an apostle were performed among you with all perseverance[b], with signs and wonders and powers.
translation:
  language: zh_hans
  text: 使徒的凭据确实是在你们中间，在百般忍耐中，借着神迹、奇事和大能[a]成就的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大能”也可译作“异能”“大能的作为”或“神迹”；此处复数形式在“神迹、奇事”的并列中可指能力的彰显。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ μὲν σημεῖα
  choice: 凭据确实
  rationale: σημεῖα在本句先指证明使徒身份的标志或凭据，后又在列举中指神迹；中文分别按语境译出。μέν没有对应的δέ，在这里表达强调，译为“确实”。
- source_word: τοῦ ἀποστόλου
  choice: 使徒的
  rationale: 保留希腊语属格表达，不强行判定是泛指“一个使徒”还是特指保罗这位使徒，让上下文承载其范围。
- source_word: κατειργάσθη
  choice: 已经……显明出来
  rationale: 该词为不定过去时被动式，表示这些凭据在哥林多人中实际成就并呈现出来；此译自然保留结果和被动意味，又不明确指定施行者。
- source_word: ἐν ὑμῖν
  choice: 在你们中间
  rationale: 这里指事情发生在哥林多信徒群体之中，而不是发生在他们内心。
- source_word: ἐν πάσῃ ὑπομονῇ
  choice: 在百般忍耐中
  rationale: ὑπομονή指在艰难中坚定持守、忍耐到底；πάσῃ在此表示充分、各样境况下的忍耐。
- source_word: σημείοις τε καὶ τέρασιν καὶ δυνάμεσιν
  choice: 借着神迹、奇事和大能的作为
  rationale: 保留三项并列及其区别：σημεῖα为具有指示意义的神迹，τέρατα为使人惊异的奇事，δυνάμεις强调能力彰显出来的作为。用“借着”表达其对前述凭据的说明及方式意味。
theological_decisions:
- issue: “使徒的凭据”所指范围
  choice: 译文让“百般忍耐”与“神迹、奇事和大能的作为”共同说明使徒凭据如何显明。
  alternative: 把“使徒的凭据”仅仅等同于后列的超自然神迹。
  rationale: 原句先陈述使徒的σημεῖα在他们中间成就，再以忍耐及三类能力彰显加以说明。译文不把经文缩减为一套固定的使徒资格，也不排除神迹在认证中的突出作用。
- issue: τοῦ ἀποστόλου是泛指还是特指
  choice: 采用可兼容两者的“使徒的”。
  alternative: 明确译为“一个使徒的”或“这位使徒的”。
  rationale: 希腊语有定冠词，但属格短语可描述使徒身份所特有的凭据，也可能在语境中特指保罗；中文“使徒的”保留这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“凭据”避免把前一个σημεῖα误读为仅指神迹；冒号和重复“显明”使希腊语的总述—说明结构在中文中清楚自然。
