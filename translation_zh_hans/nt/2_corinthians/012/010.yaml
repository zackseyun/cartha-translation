source:
  edition: SBLGNT
  text: διὸ εὐδοκῶ ἐν ἀσθενείαις, ἐν ὕβρεσιν, ἐν ἀνάγκαις, ἐν διωγμοῖς ⸀καὶ στενοχωρίαις, ὑπὲρ Χριστοῦ· ὅταν γὰρ ἀσθενῶ, τότε δυνατός εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/010.yaml
  text: Therefore I delight in weaknesses[a], in insults, in hardships, in persecutions and distresses, for the sake of Messiah; for when I am weak, then I am strong.
translation:
  language: zh_hans
  text: 因此，我为弥赛亚[a]的缘故，以软弱、羞辱、困苦、迫害和困厄为乐；因为我什么时候软弱，什么时候就刚强。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“基督”。
    reason: 保留Χριστός的传统译法及其在书信语境中可能呈现的名称化用法。
lexical_decisions:
- source_word: διὸ
  choice: 因此
  rationale: 承接上文并引出推论，保留原文的逻辑关系。
- source_word: εὐδοκῶ
  choice: 以……为乐
  rationale: 表达欣然接受、引以为喜悦的态度，保留保罗在苦难中喜悦的悖论，而不弱化为仅仅“知足”或忍受。
- source_word: ἐν ἀσθενείαις
  choice: 以软弱
  rationale: 保留复数所涵盖的各种软弱与脆弱，不限定为身体疾病。汉语在并列结构中用集合性名词即可自然表达。
- source_word: ἐν ὕβρεσιν
  choice: 羞辱
  rationale: 此处指侮辱、凌虐及由此受到的屈辱；“羞辱”既可涵盖言语侮辱，也保留遭受不当对待的意味。
- source_word: ἐν ἀνάγκαις
  choice: 困苦
  rationale: 该词在此指受逼迫性的艰难处境；“困苦”自然传达压力和匮乏，又不把含义缩窄为某一种需要。
- source_word: ἐν διωγμοῖς
  choice: 迫害
  rationale: 在保罗书信语境中指因信仰归属而遭受的逼迫，“迫害”准确而通行。
- source_word: καὶ στενοχωρίαις
  choice: 和困厄
  rationale: 原词带有空间狭窄所引申的受压、走投无路之感；“困厄”保留其强烈程度，也与前面的“困苦”有所区分。
- source_word: ὑπὲρ Χριστοῦ
  choice: 为了弥赛亚的缘故
  rationale: ὑπέρ在此说明这些遭遇所为或所因；Χριστός在此仍可按称号理解，因此译作“弥赛亚”，并以脚注保留传统译法。
- source_word: ὅταν γὰρ ἀσθενῶ
  choice: 因为我什么时候软弱
  rationale: ὅταν加现在时虚拟语气表达一般性、反复适用的时间关系；“什么时候……什么时候……”自然呈现“每当”的意义。
- source_word: τότε δυνατός εἰμι
  choice: 什么时候就刚强
  rationale: “刚强”与“软弱”形成清楚对照，保留 τότε 所标示的对应时间关系和整句悖论。
theological_decisions:
- issue: Χριστοῦ的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处可保留Χριστός作为受膏者称号的含义，避免完全名称化；同时用脚注明示传统且通行的“基督”，不排除其名称化理解。
- issue: 软弱与刚强的悖论
  choice: 不补明刚强的来源或方式
  alternative: 补译为“靠着他就刚强”或“就有基督的能力”
  rationale: 本节本身只说“那时我就是刚强的”；虽然上文提供神学语境，正文仍不应把解释直接加入本句，以保留原文简洁而有张力的表达。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“以……为乐”统摄五项并列遭遇，使句式自然且接近原文结构；后半句用“什么时候……什么时候就……”呈现一般性时间关系，并保持“软弱—刚强”的鲜明对照。
