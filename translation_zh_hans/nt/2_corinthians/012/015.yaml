  text: ἐγὼ δὲ ἥδιστα δαπανήσω καὶ ἐκδαπανηθήσομαι ὑπὲρ τῶν ψυχῶν ὑμῶν. ⸀εἰ περισσοτέρως ὑμᾶς ⸀ἀγαπῶν, ἧσσον ἀγαπῶμαι;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/015.yaml
  text: But I will most gladly spend and be spent for your souls. If I love you more abundantly[a], am I loved less?
translation:
  language: zh_hans
  text: 我却极其乐意为你们的生命[a]付出，并耗尽自己。若我越发爱你们，反而越少得到爱吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你们自己”，或“你们的灵魂”。
    reason: ψυχή在此可指生命、本人或整个人；不同译法各自突出其语义范围的一面。
lexical_decisions:
- source_word: ἥδιστα
  choice: 极其乐意
  rationale: 保留最高程度副词所表达的热切与甘愿，不只表示勉强同意。
- source_word: δαπανήσω
  choice: 付出一切
  rationale: 承接“花费、支出”的意象；汉语补出“一切”，自然表达保罗愿意倾其所有的语气，并与下句“耗尽自己”形成递进。
- source_word: ἐκδαπανηθήσομαι
  choice: 甚至耗尽自己
  rationale: 该词强化前一个“花费”，表示不只付出所有，也连自己都被完全耗费；汉语用主动形式表达被动含义，使句子自然。
- source_word: ὑπὲρ
  choice: 为
  rationale: 在这里表示为了对方的益处，“为”简洁自然，也保留舍己服事的目的。
- source_word: τῶν ψυχῶν ὑμῶν
  choice: 你们的生命
  rationale: ψυχή在此可指生命、本人或整个人。“你们的生命”保留原文名词表达及深切的牧养关怀，又避免现代汉语“灵魂”可能带来的过度二分意味。
- source_word: εἰ
  choice: 难道
  rationale: 原文以条件结构引出反问。汉语直接用“难道”呈现其修辞功能，同时让“越发……越少……”保留条件性的逻辑关系。
- source_word: περισσοτέρως
  choice: 越发
  rationale: 表达程度上的增加，与后面的“越少”构成自然、清楚的比较对照。
- source_word: ἀγαπῶν
  choice: 爱你们
  rationale: 分词在反问中表达保罗持续爱他们；汉语以限定动词翻译更自然。
- source_word: ἧσσον
  choice: 越少
  rationale: 准确保留与περισσοτέρως相对的比较程度。
- source_word: ἀγαπῶμαι
  choice: 得到的爱
  rationale: 保留现在时被动意义，却不擅自明说施爱者；在现代汉语中也比“被爱得越少”自然。
theological_decisions:
- issue: ψυχή在保罗牧养语境中的译法
  choice: 你们的生命
  alternative: 你们的灵魂；你们自己
  rationale: 此处并非要界定人的构成，而是指哥林多信徒的生命或他们整个人。采用“生命”既保留原词的实质内容，也避免把经文限定为只关乎与身体相对的“灵魂”；脚注列出其他可能译法。
- issue: 反问中ἀγαπῶμαι的施事者
  choice: 不明说施爱者，以“得到的爱”表达
  alternative: 越少得到你们的爱
  rationale: 上下文很可能指哥林多人对保罗的爱，但希腊文被动式没有明说施事者。正文保留这一形式上的开放性，不把解释直接写进译文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“付出一切，甚至耗尽自己”保留两个相关动词的支出意象和递进关系；后一句用“越发……反而越少……”呈现保罗反问中的痛切张力。
