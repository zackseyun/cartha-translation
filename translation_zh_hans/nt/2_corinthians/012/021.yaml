  text: μὴ πάλιν ⸂ἐλθόντος μου⸃ ⸀ταπεινώσῃ ⸀με ὁ θεός μου πρὸς ὑμᾶς, καὶ πενθήσω πολλοὺς τῶν προημαρτηκότων καὶ μὴ μετανοησάντων ἐπὶ τῇ ἀκαθαρσίᾳ καὶ πορνείᾳ καὶ ἀσελγείᾳ ᾗ ἔπραξαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/021.yaml
  text: I fear that when I come again[a], my God may humble me before you[d][c][b], and I will mourn over many who have sinned before and have not repented of the impurity and sexual immorality and sensuality that they practiced.
translation:
  language: zh_hans
  text: 我怕我再来的时候，我的上帝会在你们面前使我降卑[a]；我也会为许多从前犯了罪、却没有为自己所行的污秽、淫乱和放荡[b]悔改的人哀痛。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使我降卑”也可译作“使我受辱”或“使我低微”。原文所用的词可涵盖这些意思。
    reason: lexical_alternative
  - marker: b
    text: “放荡”也可译作“无耻的放纵”。这里指不受约束、毫不知耻的行为，在本段语境中尤其带有性方面的含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ πάλιν ἐλθόντος μου
  choice: 我怕我再来的时候
  rationale: 本句承接20节的“怕”，μή引出保罗所担心的情形；将隐含的“我怕”补出，符合现代汉语，也保留πάλιν“再”的含义。
- source_word: ταπεινώσῃ με ὁ θεός μου πρὸς ὑμᾶς
  choice: 我的上帝会在你们面前使我降卑
  rationale: ταπεινόω可指使人谦卑、降卑或受辱；“使我降卑”既保留上帝使保罗处于低微痛苦境地的含义，又不把语义限定为公开羞辱。πρὸς ὑμᾶς译为“在你们面前”，表达此事发生在哥林多人那里或他们面前。
- source_word: πενθήσω
  choice: 我也会……哀痛
  rationale: πενθέω表示深切哀恸或悲悼；“哀痛”自然庄重，并保留其强烈程度。
- source_word: πολλοὺς τῶν προημαρτηκότων καὶ μὴ μετανοησάντων
  choice: 许多从前犯了罪、却没有悔改的人
  rationale: προημαρτηκότων是完成时分词，指先前犯罪且其后果仍与当前有关；“从前犯了罪”表达时间先后。“却没有悔改”呈现这些人到保罗来访时仍未悔改的情形。
- source_word: ἀκαθαρσίᾳ καὶ πορνείᾳ καὶ ἀσελγείᾳ
  choice: 污秽、淫乱和放荡
  rationale: 分别保留三个彼此相关但不完全相同的恶行：道德上的污秽、性方面的不道德行为，以及无耻而不受约束的放纵行为。
- source_word: ᾗ ἔπραξαν
  choice: 他们所行的是
  rationale: 关系代词以单数概括前述三项，πράσσω可表示实行或惯行；调整为汉语分句，明确这些是他们实际所行的恶事。
theological_decisions:
- issue: 本节是否应补出承接上节的惧怕表达
  choice: 补作“我怕”
  alternative: 直译为“免得我再来的时候……”
  rationale: 希腊文本在本节以μή延续上一节φοβοῦμαι所引出的担忧，并非独立断言；补出“我怕”可使单节阅读时句法清楚，而不改变神学含义。
- issue: ταπεινόω在此指谦卑还是羞辱
  choice: 使我降卑
  alternative: 使我受辱
  rationale: 原词允许由处境使人低微乃至受辱的语义范围。“降卑”保留这种张力，不把上帝的作为单一解释为公开羞辱。
- issue: 三项道德恶行是否合并处理
  choice: 分别译为“污秽、淫乱和放荡”
  alternative: 概括为“各种淫乱放纵的行为”
  rationale: 原文并列三个有重叠却有区别的词，逐项翻译可保留其累积力度，也避免把各词限定为某一宗派性的道德分类。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我怕”补足跨节省略的谓语；以分号拆分较长句子。“降卑”保留原词在谦卑、被压低和受辱之间的语义张力；三项恶行使用常见而不过度古雅的词语分别呈现。
