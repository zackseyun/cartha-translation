id: 2CO.12.14
reference: 2 Corinthians 12:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ἰδοὺ τρίτον ⸀τοῦτο ἑτοίμως ἔχω ἐλθεῖν πρὸς ὑμᾶς, καὶ οὐ ⸀καταναρκήσω· οὐ γὰρ ζητῶ τὰ ὑμῶν ἀλλὰ ὑμᾶς, οὐ γὰρ ὀφείλει τὰ τέκνα τοῖς γονεῦσιν θησαυρίζειν, ἀλλὰ οἱ γονεῖς τοῖς τέκνοις.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/014.yaml
  text: Look, this is the third time I am ready to come to you, and I will not be a burden to you. For I do not seek what is yours, but you. For children are not obligated to store up for their parents, but parents for their children.
translation:
  language: zh_hans
  text: 看哪，这是我第三次准备到你们那里去[a]，我也不会加重你们的负担[b]。因为我所寻求的不是你们的财物，而是你们自己。儿女没有义务为父母积蓄，父母却应当为儿女积蓄。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这第三次，我已经准备好到你们那里去。”原文强调第三次作好前往的准备，不必然断定此前已经实际到访两次。
    reason: 保留原文结构以及有关行程次数的歧义。
  - marker: b
    text: “加重……负担”在这里可特指在经济或物质上给人添负担。
    reason: 说明该动词在本段语境中的具体含义。
lexical_decisions:
- source_word: Ἰδοὺ
  choice: 看哪
  rationale: 作为引起注意的表达，保留原文的提示语气；“看哪”庄重而且现代读者容易理解。
- source_word: τρίτον τοῦτο ἑτοίμως ἔχω ἐλθεῖν
  choice: 这是我第三次准备到你们那里去
  rationale: 自然表达保罗第三次作好前往准备的意思，同时不武断认定此前已经实际到访两次；脚注保留更贴近原文结构的译法。
- source_word: καταναρκήσω
  choice: 加重你们的负担
  rationale: 该动词在上下文中指不给对方造成物质或经济负担；此译法既自然，也保留“负担”的一般表达，具体含义由脚注说明。
- source_word: ζητῶ τὰ ὑμῶν ἀλλὰ ὑμᾶς
  choice: 我所寻求的不是你们的财物，而是你们自己
  rationale: 清楚保留“属于你们的东西”与“你们本人”的对比；结合经济负担的上下文，用“财物”传达这里的物质含义。
- source_word: ὀφείλει
  choice: 没有义务……却应当
  rationale: 表达原文关于责任与本分的规范性含义；后半句虽省略动词，汉语补出“应当”以完整呈现对比。
- source_word: θησαυρίζειν
  choice: 积蓄
  rationale: 保留储存、积攒财物的核心含义，在家庭供养语境中比“积存财宝”更自然。
- source_word: τέκνα / τέκνοις; γονεῦσιν / γονεῖς
  choice: 儿女；父母
  rationale: 两组词均为性别涵盖性的家庭称谓；“儿女”和“父母”准确、自然。
theological_decisions:
- issue: “第三次”所指的是第三次实际访问，还是第三次准备访问
  choice: 译为“这是我第三次准备到你们那里去”
  alternative: “这第三次，我已经准备好到你们那里去”
  rationale: 原文把“第三次”与“准备前去”紧密相连；正文采用自然汉语，但不据此强行重构保罗此前实际到访的次数，脚注保留结构上的歧义。
- issue: 保罗所寻求的是信徒本人还是其财物
  choice: 保留“不是你们的财物，而是你们自己”的鲜明对比
  alternative: “我不是要你们的东西，而是要得着你们”
  rationale: 原文直接对照“你们的”与“你们”；正文不额外说明“得着”具体是牧养、归信或忠诚，从而保留其修辞和神学张力。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“看哪”保留使徒书信中的强调语气；“财物”“积蓄”贴合上下文的经济主题，同时避免过度口语化。所有脚注标记均已置于正文相应位置。
