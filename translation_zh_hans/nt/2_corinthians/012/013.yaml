  naturalness: 原译通顺、庄重。“其余的众教会”略显重复，因为“其余”已含复数集合含义；“其余教会”更自然。“这件不义的事”虽可懂，但在此反讽性道歉中“这项过错”更符合现代汉语搭配，同时仍保留ἀδικία的“wrong”意义。
