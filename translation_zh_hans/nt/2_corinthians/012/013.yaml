  text: τί γάρ ἐστιν ὃ ⸀ἡσσώθητε ὑπὲρ τὰς λοιπὰς ἐκκλησίας, εἰ μὴ ὅτι αὐτὸς ἐγὼ οὐ κατενάρκησα ὑμῶν; χαρίσασθέ μοι τὴν ἀδικίαν ταύτην.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/013.yaml
  text: For in what were you treated as inferior to the rest of the churches[c][b][a], except that I myself did not become a burden to you? Forgive me this wrong.
translation:
  language: zh_hans
  text: 因为，除了我本人没有成为你们的负担以外，你们在哪一点上比其余教会处于不利地位呢？[a][b]请原谅我这项过错！[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “处于不利地位”也可译作“被置于比其他教会低的地位”或“比其他教会吃亏”。这里的希腊语被动动词可表示被置于劣势、受较低对待，或处于不利地位。
    reason: lexical_alternative
  - marker: b
    text: 这里指保罗没有接受他们的供给，因此没有在经济上成为他们的负担。
    reason: cultural_note
  - marker: c
    text: 保罗在这里带着反讽说话：他所称的“过错”，正是自己没有成为他们的负担。
    reason: rhetorical_note
lexical_decisions:
- source_word: ἡσσώθητε
  choice: 不如
  rationale: 该被动形式在这里表示处于较低或不利地位；结合反问和比较结构，译作“不如”自然，并保留其可能指“被置于较低地位”的含义。
- source_word: ὑπὲρ τὰς λοιπὰς ἐκκλησίας
  choice: 其余的众教会
  rationale: ὑπέρ在此配合比较语意，表示“比……更低”；λοιπάς指其余或其他教会。
- source_word: αὐτὸς ἐγώ
  choice: 我本人
  rationale: 保留强化代词与明示主语形成的个人强调，也服务于保罗的反讽语气。
- source_word: οὐ κατενάρκησα ὑμῶν
  choice: 没有成为你们的负担
  rationale: καταναρκάω在哥林多后书的语境中指在物质或经济上加重他人的负担；此译保持比喻而不把解释直接写入正文。
- source_word: χαρίσασθέ μοι
  choice: 请原谅我
  rationale: χαρίζομαι可指恩赐或宽恕；在此命令句中，“原谅”最符合保罗反讽式的自辩。
- source_word: τὴν ἀδικίαν ταύτην
  choice: 这件不义的事
  rationale: ἀδικία可指不义、不公或过错；“不义的事”较贴近原词力度，同时让上下文显明其反讽。
- source_word: τί γάρ ἐστιν ὃ
  choice: 你们在哪一点上
  rationale: 这是询问“在哪一方面”的修辞问句；中文如此表达自然，也保持论证连接和提问方式。
theological_decisions:
- issue: 保罗就经济供养所作的反讽式自辩
  choice: 正文直译为“请原谅我这件不义的事吧”，以语境呈现反讽
  alternative: 在正文中明说“所谓的不义”或加入“反话”等解释
  rationale: 原文没有显式标注反讽，而是通过上下文和措辞表达；正文不宜替读者消解修辞张力，脚注可作必要说明。
- issue: 哥林多人“不如”其他教会的性质
  choice: 正文用较开放的“不如”，脚注说明也可理解为“被置于较低地位”
  alternative: 正文明确译为“受到低一等的待遇”
  rationale: ἡσσώθητε的被动形式容许受亏待或被置于劣势的理解，但中文若强行补出施事或“待遇”，会缩窄原文的表达范围。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“其余的众教会”保留 λοιπαί 的整体比较范围；“我本人”保留原文强调；末句以“吧”呈现带有反讽的请求语气，但不额外夸张。
