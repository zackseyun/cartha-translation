revisions:
- from: 因为我怕我来的时候，见你们不像我所希望的；你们也会发现我不像你们所希望的。恐怕你们中间有争吵、嫉妒、暴怒、自私争竞、毁谤、窃窃私语[a]、自高自大和混乱。
  to: 因为我怕，我来的时候，会发现你们并不像我所愿的那样；而你们也会发现我不像你们所愿的那样；又恐怕你们中间有争吵、嫉妒、怒气爆发、自私争竞、毁谤、窃窃私语[a]、自高自大和混乱。
  rationale: 修订仅改善汉语句法和情态表达：以“会发现”置于“我怕……来的时候”的范围内，表达所担心的可能情形；以“又恐怕”明确引出第二个 μή πως；并将“暴怒”改为“怒气爆发”，更贴近复数 θυμοί 所指反复爆发的怒气。其余清单及脚注均保留原有译法与含义。
