source:
  edition: SBLGNT
  text: φοβοῦμαι γὰρ μή πως ἐλθὼν οὐχ οἵους θέλω εὕρω ὑμᾶς, κἀγὼ εὑρεθῶ ὑμῖν οἷον οὐ θέλετε, μή πως ⸀ἔρις, ⸀ζῆλος, θυμοί, ἐριθεῖαι, καταλαλιαί, ψιθυρισμοί, φυσιώσεις, ἀκαταστασίαι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/020.yaml
  text: For I fear that perhaps when I come I may find you not as I wish[a], and I may be found by you to be as you do not wish—that perhaps there may be strife, jealousy, outbursts of anger, selfish ambition, slanders, whisperings, conceit, and disorder.
translation:
  language: zh_hans
  text: 因为我怕，我来的时候，会发现你们并不像我所愿的那样；而你们也会发现我不像你们所愿的那样；又恐怕你们中间有争吵、嫉妒、怒气爆发、自私争竞、毁谤、窃窃私语[a]、自高自大和混乱。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “窃窃私语”或译“散布流言”。
    reason: ψιθυρισμοί 保有低声私议的形象，也可在此语境中指暗中说闲话或传播流言。
lexical_decisions:
- source_word: φοβοῦμαι γὰρ μή πως
  choice: 因为我怕……恐怕
  rationale: 保留保罗持续的忧虑及 μή πως 所表达的担心与可能性；第二个 μή πως 用“恐怕”自然引出罪行清单。
- source_word: ἐλθὼν
  choice: 我来的时候
  rationale: 此处不定过去时分词在语境中表时间，以“来的时候”清楚表达。
- source_word: οὐχ οἵους θέλω εὕρω ὑμᾶς
  choice: 见你们不像我所希望的
  rationale: 表达保罗担心哥林多人的实际状况不合其期望，同时保持 οἷος 结构的比较意味。
- source_word: κἀγὼ εὑρεθῶ ὑμῖν οἷον οὐ θέλετε
  choice: 你们也会发现我不像你们所希望的
  rationale: 将希腊文被动结构自然转换为现代汉语主动句，同时保留前后双方彼此“发现”的对称关系。
- source_word: ἔρις
  choice: 争吵
  rationale: 在群体恶行清单中指争竞、纷争；“争吵”通俗明确。
- source_word: ζῆλος
  choice: 嫉妒
  rationale: 此处位于恶行清单，取负面的嫉妒义，而非正面的热心。
- source_word: θυμοί
  choice: 暴怒
  rationale: 复数形式指反复发生的怒气爆发；“暴怒”简洁而有力度。
- source_word: ἐριθεῖαι
  choice: 自私争竞
  rationale: 兼顾自利图谋与党争、竞争的语义，比单说“野心”更能体现群体冲突。
- source_word: καταλαλιαί
  choice: 毁谤
  rationale: 指贬损、恶意中伤他人的言语；“毁谤”符合庄重而易懂的经文语体。
- source_word: ψιθυρισμοί
  choice: 窃窃私语
  rationale: 字面指低声私语，在此带有暗中议论或传播流言的负面意味；正文保留形象表达，脚注说明另一译法。
- source_word: φυσιώσεις
  choice: 自高自大
  rationale: 源于“吹胀”的比喻，表示骄傲自负；“自高自大”自然且准确。
- source_word: ἀκαταστασίαι
  choice: 混乱
  rationale: 可指失序、动荡；在教会群体恶行清单中，“混乱”保留其较宽泛的含义。
theological_decisions:
- issue: 保罗所担心的会面语气
  choice: 表达双方可能彼此失望，并列出群体中的恶行，不进一步说明其教义原因。
  alternative: 明确译成保罗担心届时必须严厉行使使徒权柄，或认定这些恶行主要源自假教师。
  rationale: 本节直接陈述的是彼此不合期望和群体失序；虽然上下文可能暗示保罗会严厉处理，译文不应把推论写进本节。
translation_notes:
  register: 采用现代、庄重而通俗的普通话。“不像……所希望的”保持前后对称；清单用并列名词表达。正文脚注标记 [a] 已与脚注对应。
