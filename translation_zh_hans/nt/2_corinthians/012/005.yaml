  text: ὑπὲρ τοῦ τοιούτου καυχήσομαι, ὑπὲρ δὲ ἐμαυτοῦ οὐ καυχήσομαι εἰ μὴ ἐν ταῖς ⸀ἀσθενείαις.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/005.yaml
  text: On behalf of such a one I will boast[a], but on behalf of myself I will not boast[b], except in my weaknesses.
translation:
  language: zh_hans
  text: 我会为这样的人夸口[a]；但我不会为自己夸口，只会在自己的软弱上夸口[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为这样的人”也可译作“关于这样的人”或“谈到这样的人”。这里的希腊语介词可表示夸口所涉及的对象；正文保留保罗刻意与此人拉开距离的语气。
    reason: lexical_alternative
  - marker: b
    text: 希腊语直译为“在软弱中／在软弱上”（“软弱”为复数），没有“自己的”一词。“软弱”可泛指人的脆弱、苦难或无能；“自己的”是根据本句与“我自己”的对照补出的。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ
  choice: 为
  rationale: ὑπέρ与属格连用，在这里表示夸口所涉及的人。“为”保留了关系性的表达和保罗刻意拉开的修辞距离；脚注注明也可理解为“谈到”。
- source_word: τοῦ τοιούτου
  choice: 这样的人
  rationale: 此短语以间接方式指称前文所说的人。“这样的人”自然、简明，不额外断定此人是否真与保罗不同。
- source_word: καυχήσομαι
  choice: 我要夸口／我不会夸口
  rationale: καυχάομαι在保罗书信中通常指“夸口”。按两个将来时形式分别译为“我要”和“我不会”，并保留前后对照。
- source_word: ἐμαυτοῦ
  choice: 我自己
  rationale: 反身代词突出保罗本人，与前面的“这样的人”形成鲜明对照。
- source_word: εἰ μὴ
  choice: 除非
  rationale: 此处引出例外，而非提出普通条件；“除非”保留原文的例外结构。
- source_word: ἐν ταῖς ἀσθενείαις
  choice: 夸自己的软弱
  rationale: ἀσθένεια在此可涵盖人的脆弱、苦难及无能状态。中文补出“自己的”和动词“夸”，使例外关系清楚自然；脚注保留原文没有所有格且使用复数这一信息。
theological_decisions:
- issue: 保罗所准许的夸口具有什么性质
  choice: 保留“这样的人”与“我自己”之间的修辞距离，并将保罗唯一准许涉及自己的夸口限定为自己的软弱。
  alternative: 把“这样的人”明确解释为另一个实际人物；或把本句完全处理为一条与保罗个人无关的普遍神学原则。
  rationale: 上下文的说法既可能是保罗以第三人称谈论自己的经历，也在修辞上将自己与那经历拉开距离。正文不替读者解决这一张力，而明确保留原句转向软弱的重点。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。分号呈现两个分句的强烈对照；重复“夸口”以保留原文修辞。正文中的“为”略带书面色彩，但在此简短结构中自然，并能保留ὑπέρ的关系含义。
