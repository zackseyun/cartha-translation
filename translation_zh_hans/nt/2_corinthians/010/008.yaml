  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐάν ⸀τε ⸀γὰρ περισσότερόν τι καυχήσωμαι περὶ τῆς ἐξουσίας ἡμῶν, ἧς ἔδωκεν ὁ ⸀κύριος εἰς οἰκοδομὴν καὶ οὐκ εἰς καθαίρεσιν ὑμῶν, οὐκ αἰσχυνθήσομαι,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/008.yaml
  text: For even if I should boast somewhat more about our authority[a], which the Lord gave for building you up and not for tearing you down[b], I will not be put to shame.
translation:
  language: zh_hans
  text: 因为，即使我为我们的权柄多夸口一点——这权柄是主赐下的，为要造就你们，而不是拆毁你们[b]——我也不至于蒙羞[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我也不至于羞愧。”希腊语动词可以表达“羞愧”，但这里的被动形式也可理解为“蒙羞”或“受辱”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“不是要毁灭你们。”希腊语在这里把“造就”与“拆毁／毁灭”相对照；正文用“拆毁”保留建造的比喻。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τε γὰρ
  choice: 因为，即使
  rationale: “因为”保留γάρ承接上文、说明理由的作用；“即使”自然表达ἐάν加虚拟语气所构成的假设条件，并体现τε在此加强语气的作用。
- source_word: περισσότερόν τι
  choice: 多……一点
  rationale: περισσότερον表示程度更高，τι使表达有所缓和；“多……一点”兼顾比较意味和不确定、克制的语气。
- source_word: καυχήσωμαι
  choice: 我……夸口
  rationale: 在“即使”引出的假设条件中，“夸口”准确保留καυχάομαι的语义，也符合本段反复出现的用语。
- source_word: περὶ τῆς ἐξουσίας ἡμῶν
  choice: 为我们的权柄
  rationale: ἐξουσία指受托的权柄或权限，不只是抽象能力；现代汉语以“权柄”表达其带有授予来源的权威意味。介词περί在“夸口”的搭配中自然译作“为……夸口”。
- source_word: ἧς ἔδωκεν ὁ κύριος
  choice: 这权柄是主赐下的
  rationale: 明确关系代词所指的是前面的“权柄”，并以“主”保留κύριος的尊称；“赐下”自然表达权柄来自主的授予。
- source_word: εἰς οἰκοδομὴν
  choice: 为要造就你们
  rationale: οἰκοδομή本义涉及建造，在此比喻使信徒得建立、坚固；“造就”是自然庄重的现代教会语汇。根据与后文ὑμῶν的对应关系补出“你们”。
- source_word: καὶ οὐκ εἰς καθαίρεσιν ὑμῶν
  choice: 而不是拆毁你们
  rationale: καθαίρεσις可指拆除或毁坏；“拆毁”与“造就”形成建造意象上的鲜明对照，同时不把意思强化为彻底毁灭。
- source_word: οὐκ αἰσχυνθήσομαι
  choice: 我也不至于蒙羞
  rationale: “蒙羞”较清楚地体现αἰσχυνθήσομαι的被动形式，表示保罗的夸口不会被事实证明为空妄而使他受辱；“不至于”与前面的假设条件自然衔接。
theological_decisions:
- issue: 使徒权柄的来源与目的
  choice: 权柄由主赐下，目的在于造就哥林多人，而不是拆毁他们。
  alternative: 将这里理解为这种权柄本身以惩罚或毁灭教会为目的。
  rationale: 原文明确以οἰκοδομή和καθαίρεσις构成对照，既肯定权柄的真实和属主来源，也说明其根本指向是建设性的；译文不削弱保罗可能严厉运用权柄的张力，却不把严厉误写成毁灭性的目的。
- issue: “不蒙羞”的客观与主观含义
  choice: 采用“蒙羞”，侧重保罗的夸口不会被证明为虚假而使他受辱。
  alternative: 译作“羞愧”，侧重保罗内在的羞耻感。
  rationale: 希腊语为将来被动形式，可容纳客观受辱与主观羞愧两层含义；正文用“蒙羞”较好地反映形式，脚注保留另一种可能。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以破折号标出解释“权柄”的关系从句，使较长的希腊语句法在汉语中仍清楚，并让句末“我也不至于蒙羞”保持原文的落点和强调。
