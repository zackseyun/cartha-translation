  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: τοῦτο λογιζέσθω ὁ τοιοῦτος, ὅτι οἷοί ἐσμεν τῷ λόγῳ δι’ ἐπιστολῶν ἀπόντες, τοιοῦτοι καὶ παρόντες τῷ ἔργῳ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/011.yaml
  text: 'Let such a person consider this: what we are in word by letters when absent[b][a], we are also in deed when present.'
translation:
  language: zh_hans
  text: 这样的人应当想清楚：我们不在场时，借着书信在言语上是什么样；在场时，在行动上也是什么样。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在言语上……在行动上”也可译作“在所说的事上……在所做的事上”。
    reason: 说明λόγος与ἔργον在此处的对应关系既可用较凝练的“言语／行动”表达，也可展开为“所说的／所做的”；两种译法均保留原文对照。
lexical_decisions:
- source_word: λογιζέσθω
  choice: 应当想清楚
  rationale: 第三人称单数命令式，要求所指之人认真思量并认清事实；“想清楚”既自然，也保留劝诫和警告的力度。
- source_word: ὁ τοιοῦτος
  choice: 这样的人
  rationale: 指上文所说的那一类批评者，同时保持单数所指；现代汉语自然明白。
- source_word: οἷοί ἐσμεν … τοιοῦτοι
  choice: 是什么样……也是什么样
  rationale: 保留两个相关词之间关于性质和表现的对应关系，不把经文缩减为单纯的说话方式或行动能力。
- source_word: τῷ λόγῳ
  choice: 在言语上
  rationale: 与格表示方面或领域；“在言语上”保留与“在行动上”的紧凑对照，也涵盖保罗借书信所表达的话。
- source_word: δι’ ἐπιστολῶν
  choice: 借着书信
  rationale: διά加属格表达媒介或手段；“借着书信”直接体现书信是保罗在缺席时传达言语的媒介。
- source_word: ἀπόντες
  choice: 不在场时
  rationale: 作情境性分词，与后面的παρόντες构成明确而对称的对比。
- source_word: παρόντες
  choice: 在场时
  rationale: 保持原文与“不在场时”的平行关系，不额外限定到达时间或地点。
- source_word: τῷ ἔργῳ
  choice: 在行动上
  rationale: 与格表示方面或领域；“行动”在现代汉语中比“行为”更能传达实际付诸实施之意，并与“言语”形成自然对照。
theological_decisions:
- issue: 保罗的书信言语与亲自到场后的行动之间的关系
  choice: 译为保罗及同工在场时的实际行动会与缺席时书信所显出的样子一致
  alternative: 将本句扩写成关于将来惩罚的明确威胁，或理解为文风与属灵能力之间的抽象对比
  rationale: 希腊文直接比较缺席时借书信在言语上的表现和在场时在行动上的表现。上下文带有警告意味，但本节没有具体说明将采取何种行动，因此不在译文中补入惩罚内容。
- issue: 现在时形式与语境中的将来指向
  choice: 用“也是什么样”保留原文直陈式的对应表达
  alternative: 译为“也必定会怎样”，明确强化将来的威胁
  rationale: 原文使用ἐσμεν并省略第二分句的系词，语境可指将来亲临时的表现，但语法本身强调身份与表现的一致；译文不将潜在的将来含义绝对化。
translation_notes:
  register: 采用庄重而现代的劝诫语气。“这样的人”承接上文，“应当想清楚”具有命令力度而不显古奥。分号突出“不在场／在场”和“言语／行动”两组平行对照；避免加入原文未明说的惩罚、权柄或到访地点。
