  text: Οὐ γὰρ τολμῶμεν ἐγκρῖναι ἢ συγκρῖναι ἑαυτούς τισιν τῶν ἑαυτοὺς συνιστανόντων· ἀλλὰ αὐτοὶ ἐν ἑαυτοῖς ἑαυτοὺς μετροῦντες καὶ συγκρίνοντες ἑαυτοὺς ἑαυτοῖς οὐ συνιᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/012.yaml
  text: For we do not dare to classify or compare ourselves with some of those who commend themselves[a]. But when they measure themselves by themselves and compare themselves with themselves[b], they do not understand.
translation:
  language: zh_hans
  text: 因为我们不敢把自己归入某些自我举荐的人之列，或拿自己和他们相比[a]。可是，这些人却在自己中间衡量自己，又拿自己同自己比较[b]，就不明白了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “归入……之列”也可译作“列入”或“与……并列”；原文动词指把自己置于同一类别之中。
    reason: lexical_alternative
  - marker: b
    text: 直译：“在自己中间衡量自己，又拿自己同自己比较。”这可指他们以自己或自己这一群人为衡量和比较的范围或标准。
    reason: lexical_alternative
lexical_decisions:
- source_word: τολμῶμεν
  choice: 我们不敢
  rationale: 保留该动词所表达的不愿贸然如此行的意味，也传达保罗带有讽刺色彩的语气。
- source_word: ἐγκρῖναι
  choice: 把自己列入
  rationale: 此处指将自己归入某一类或某一群体，而非一般意义上的评判；“列入”自然地表达这种归类含义。
- source_word: συγκρῖναι / συγκρίνοντες
  choice: 比作 / 比较
  rationale: 两处都保留比较的核心意义；前处“比作”适合人与某类人相提并论的语境，后处“比较”则自然承接衡量行为。
- source_word: ἑαυτούς τισιν τῶν ἑαυτοὺς συνιστανόντων
  choice: 把自己列入或比作那些自我举荐的人
  rationale: συνιστάνω在此指举荐、称许；反身结构明确表示这些人举荐自己。“那些”在现代汉语中已足以表达不定范围，无须生硬补出“某些”。
- source_word: ἀλλὰ αὐτοὶ
  choice: 可是，他们
  rationale: “可是”显明与保罗一方的对照，“他们”承接强调代词；中文断句使转折清楚自然。
- source_word: ἐν ἑαυτοῖς
  choice: 拿自己
  rationale: 结合μετροῦντες理解为以自身范围或自身标准来衡量；正文用“拿自己衡量自己”保留自我指涉，脚注说明原文结构及可能含义。
- source_word: μετροῦντες
  choice: 衡量
  rationale: 保留“测量”的比喻，同时“衡量”在现代汉语中可自然表达评价之意。
- source_word: ἑαυτοὺς ἑαυτοῖς
  choice: 拿自己与自己比较
  rationale: 尽量保留连续反身代词造成的修辞重复，显出他们以自身作为比较范围或标准。
- source_word: οὐ συνιᾶσιν
  choice: 实在不明事理
  rationale: 表达他们缺乏领悟，并以“实在”自然传达句末判断的力度；不擅自补定他们所不明白的具体对象。
theological_decisions:
- issue: 自我衡量的具体含义
  choice: 正文保留“拿自己衡量自己”的反身表达，并在脚注指出以自己为标准的语境含义
  alternative: 直接译为“以自己为标准衡量自己”
  rationale: 原文ἐν ἑαυτοῖς在句法和语义上可有“在自己中间、以自己为范围或标准”等理解；不在正文中完全消除这种张力。
- issue: οὐ συνιᾶσιν所隐含的宾语
  choice: 译作“实在不明事理”，不补明具体所不明白的内容
  alternative: “他们不明白这样做是愚昧的”
  rationale: 希腊文没有明说宾语；保留概括性的责备，避免加入原文未明确陈述的解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留“自己”连续反复的修辞效果，以呈现保罗对自我举荐、自定标准的讽刺；避免使用过于学术化的“分类”或可能引入额外道德定性的措辞。
