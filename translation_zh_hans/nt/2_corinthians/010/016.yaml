  text: εἰς τὰ ὑπερέκεινα ὑμῶν εὐαγγελίσασθαι, οὐκ ἐν ἀλλοτρίῳ κανόνι εἰς τὰ ἕτοιμα καυχήσασθαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/016.yaml
  text: to proclaim the good news in the regions beyond you[c][b][a], not to boast in another's sphere about things already prepared.
translation:
  language: zh_hans
  text: 以便把福音传到你们以外的地区[a]，而不是在别人的事工范围[b]内，拿已经预备好的事夸口。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以便在你们以外的地方宣讲福音。”
    reason: lexical_alternative
  - marker: b
    text: “事工范围”所译的希腊语κανών，在这里指划定或分派的事工领域，并非道德“准则”，也不是后来所说的“正典”。
    reason: cultural_note
  - marker: c
    text: 或译：“而不是在别人的事工范围内，拿已经做成的事夸口。”
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπερέκεινα ὑμῶν
  choice: 你们以外的地区
  rationale: ὑπερέκεινα指越过某一点而在其外的地方；与ὑμῶν连用，表示以哥林多人所在之处为参照。“你们以外的地区”自然表达这种相对位置，又不擅自指定某一地名或疆界。
- source_word: εὐαγγελίσασθαι
  choice: 把福音传到
  rationale: 该不定式表达保罗继续宣讲福音的目标。“传福音”是现代汉语中清楚而自然的说法，并保留此词的动词性质；结合方向短语译作“把福音传到”更符合汉语表达。
- source_word: ἀλλοτρίῳ
  choice: 别人的
  rationale: 该形容词表示属于他人的。译作“别人的”简洁、自然，并保留原文未说明具体是谁的特点。
- source_word: κανόνι
  choice: 工作范围
  rationale: κανών在本段语境中指划定或分派的活动范围，而不是道德准则或后来的“正典”概念。加上“工作”可使普通读者明白这里所说的是事奉劳作的领域，同时由脚注交代原词意象。
- source_word: ἕτοιμα
  choice: 已经预备好的事
  rationale: 该形容词在此名词化，字面指已经准备妥当的事物。此译法保留其措辞和一定程度的含混，不在正文中直接断定它专指别人已经完成的传道成果。
- source_word: καυχήσασθαι
  choice: 夸口
  rationale: “夸口”准确保留保罗在上下文中反复使用的修辞关键词及其较强语气。
- source_word: ἐν ἀλλοτρίῳ κανόνι εἰς τὰ ἕτοιμα
  choice: 在别人的工作范围内，拿已经预备好的事
  rationale: 原文结构紧凑，εἰς在这里表达夸口所针对或涉及的对象。译作“拿……夸口”符合现代汉语，同时保留“已经预备好”究竟指已完成还是已具备条件的语义张力。
theological_decisions:
- issue: κανών在保罗事工语境中的含义
  choice: 指别人所负责或获分派的工作范围
  alternative: 准则、标准或正典
  rationale: 10:13–15持续谈论量给保罗的界限、范围和劳作，因此这里最自然是指事工领域；不应把后来的“正典”含义带入本文。
- issue: τὰ ἕτοιμα所指为何
  choice: 正文保留为“已经预备好的事”
  alternative: 明确译作“别人已经完成的工作”
  rationale: 上下文很可能指他人已经预备或完成的事工成果，但原文只说名词化的“预备好的”。正文不把推论写死，脚注提供“已经做成的事”这一语境化理解。
- issue: 本节与前文的句法关系
  choice: 以“好……”开头，保留目的性和接续性
  alternative: 补成独立陈述“我们要……”
  rationale: εὐαγγελίσασθαι是不定式，承接前文所表达的盼望与目标。用“好……”既自然衔接，也避免添加原文在本节未明说的主语和情态。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“传福音”“夸口”保留本段的重要圣经词汇，但句式避免古奥。正文保留τὰ ἕτοιμα的含混，未将其过度解释为某一位同工已经完成的具体成果。
