  text: Τὰ κατὰ πρόσωπον βλέπετε. εἴ τις πέποιθεν ἑαυτῷ Χριστοῦ εἶναι, τοῦτο λογιζέσθω πάλιν ⸀ἐφ’ ἑαυτοῦ ὅτι καθὼς αὐτὸς Χριστοῦ οὕτως καὶ ⸀ἡμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/007.yaml
  text: 'You are looking at outward appearances[a]. If anyone is confident in himself that he belongs to Messiah, let him consider this again within himself: that just as he belongs to Messiah[b], so also do we.'
translation:
  language: zh_hans
  text: 你们看外表[a]。如果有人确信自己属于弥赛亚，他就该再自己想一想：他怎样属于弥赛亚，我们也同样属于弥赛亚。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们看眼前的事”；也可较直译为：“你们按外貌看事情。”希腊文也可能理解为命令句：“看看摆在眼前的事。”
    reason: 原文短语Τὰ κατὰ πρόσωπον及动词βλέπετε在此存在词义和语气上的多种可能。
lexical_decisions:
- source_word: Τὰ κατὰ πρόσωπον
  choice: 外表
  rationale: 该短语在这里最自然地指外在、表面的事；“外表”简洁自然，同时以脚注保留其他可能理解。
- source_word: βλέπετε
  choice: 你们只看
  rationale: 按直陈语气理解为保罗的责备；加入“只”表达按外表评断的语境含义，而不把句子误作命令。
- source_word: πέποιθεν ἑαυτῷ
  choice: 自信自己
  rationale: πέποιθεν表示已经形成并持续的确信；“自信自己”在现代汉语中自然表达其自我确信。
- source_word: Χριστοῦ εἶναι
  choice: 属于弥赛亚
  rationale: 属格加εἶναι表示归属；Χριστός按称号译作“弥赛亚”，而非仅作专名处理。
- source_word: λογιζέσθω πάλιν ἐφ’ ἑαυτοῦ
  choice: 就该再在心里想一想
  rationale: 保留命令式的劝令、πάλιν的“再”，以及ἐφ’ ἑαυτοῦ所表达的内在反思。
- source_word: καθὼς αὐτὸς Χριστοῦ οὕτως καὶ ἡμεῖς
  choice: 他怎样属于弥赛亚，我们也同样属于弥赛亚
  rationale: 明确补出希腊文省略的“属于”，保留双方同等归属于弥赛亚的比较结构。
theological_decisions:
- issue: Χριστοῦ的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: Χριστός在此仍可理解为称号；译作“弥赛亚”凸显“受膏者”的称号性质，并与项目方针对该词的政策一致。
- issue: 对方自称属于弥赛亚的有效性
  choice: 保留原文的条件式陈述，不判定其主张真伪
  alternative: 将其解释为讽刺或否认对方确实属于弥赛亚
  rationale: 原文的重点是：即使有人确信自己属于弥赛亚，也必须承认保罗一方同样属于弥赛亚；译文不应额外裁定对方主张。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“在心里想一想”比生硬的“在自己里面思量”更自然；正文采取责备性的直陈句，并用脚注保留命令句的可能。
