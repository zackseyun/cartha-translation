- from: 以及一切高抬起来、抵挡人认识上帝的事物[a]；我们也把一切心思掳来，使它顺服弥赛亚[b]。
  to: 以及一切被高举起来、用以抵挡对上帝的认识的事物[a]；我们也将一切心思掳获，使它们顺服弥赛亚[b]。
  rationale: 修订使“被高举起来”成为自然、清楚的现代汉语，并以“对上帝的认识”较紧凑地对应γνῶσις τοῦ θεοῦ，避免把原文直接限定为“人认识上帝”。“用以抵挡”使“被高举”与其敌对方向的关联在汉语中清晰可读，同时不把“高耸之物”限缩为某一类心理或言论现象。“掳获”加强军事俘获的比喻；“使它们顺服弥赛亚”保留带入顺服的结果。脚注标记及其对应内容均完整保留。
