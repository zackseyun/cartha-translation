  text: καὶ πᾶν ὕψωμα ἐπαιρόμενον κατὰ τῆς γνώσεως τοῦ θεοῦ, καὶ αἰχμαλωτίζοντες πᾶν νόημα εἰς τὴν ὑπακοὴν τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/005.yaml
  text: and every lofty thing raised up against the knowledge of God[a], and taking every thought captive into obedience to Messiah[b],
translation:
  language: zh_hans
  text: 以及一切被高举起来、用以抵挡对上帝的认识的事物[a]；我们也将一切心思掳获，使它们顺服弥赛亚[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被高举起来的事物”也可译作“高耸之物”或“狂妄的主张”。
    reason: lexical_alternative
  - marker: b
    text: 希腊语意为“弥赛亚”；传统译作“基督”。
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶν ὕψωμα
  choice: 一切……事物
  rationale: ὕψωμα指被抬高或高耸之物；在此为比喻用法。“事物”保持所指的宽泛性，不把它限缩为“狂妄言论”“思想”或某种具体障碍。
- source_word: ἐπαιρόμενον
  choice: 高抬起来
  rationale: 保留分词所表达的被抬高、被高举的形象，也不强行加入希腊语并不必然要求的反身含义“自高”。
- source_word: κατὰ τῆς γνώσεως τοῦ θεοῦ
  choice: 抵挡人认识上帝
  rationale: κατά表达敌对方向；γνῶσις τοῦ θεοῦ可指关于上帝或对上帝的认识。此译自然表达这种关系，同时不把它缩减为纯粹的知识资料。
- source_word: αἰχμαλωτίζοντες
  choice: 把……掳来
  rationale: 保留把战俘掳获的军事比喻，并与上下文的争战意象相协调。
- source_word: πᾶν νόημα
  choice: 一切心思
  rationale: νόημα可指思想、意念、谋算或心态；“心思”在现代汉语中自然且范围较宽，πᾶν译作“一切”。
- source_word: εἰς τὴν ὑπακοὴν
  choice: 使它顺服
  rationale: 用结果式表达εἰς所含的趋向和进入某种状态之意，比静态的“为要顺服”更贴合原文动势。
- source_word: τοῦ Χριστοῦ
  choice: 弥赛亚
  rationale: Χριστός在此作为称号，译出其“受膏者／弥赛亚”的含义；现代中文以“弥赛亚”自然传达该称号。
theological_decisions:
- issue: πᾶν ὕψωμα ἐπαιρόμενον所指的敌对事物性质
  choice: 保留为广义的、被高抬而抵挡人认识上帝的“事物”
  alternative: 一切自高的妄念／一切狂妄的主张
  rationale: 原文的比喻范围较广，可能涵盖论说、权势、障碍或其他敌对之物；不将其仅仅心理化或智识化。
- issue: τοῦ Χριστοῦ的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处可自然理解为称号，译作“弥赛亚”保留Χριστός的称号意义；脚注列出中文传统译法。
- issue: ὑπακοὴ τοῦ Χριστοῦ中属格的关系
  choice: 顺服弥赛亚（以弥赛亚为顺服对象）
  alternative: 弥赛亚的顺服
  rationale: 上下文描写把一切心思掳来而使之归服，因此以弥赛亚为顺服对象最合语境；不过希腊语属格形式本身较为紧凑。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留原文的军事意象和“高抬”意象；“以及”承接上文，“我们”则将希腊语复数分词的隐含主语明示出来，以免中文句子悬空。所有脚注标记均已置于正文对应位置。
