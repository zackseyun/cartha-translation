  text: ἐν σαρκὶ γὰρ περιπατοῦντες οὐ κατὰ σάρκα στρατευόμεθα—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/003.yaml
  text: For though we walk in the flesh[a], we do not wage war according to the flesh—
translation:
  language: zh_hans
  text: 因为我们虽然活在肉身中[a]，却不按肉体争战——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为我们虽然作为血肉之躯活着，却不按人的标准争战。”
    reason: 说明两处σάρξ在本节中的可能语义：前者可明说有形身体的生活，后者可解释为仅凭人的标准或方式。
lexical_decisions:
- source_word: ἐν σαρκὶ
  choice: 活在肉身中
  rationale: 此处首先指人在有血肉之躯的现实处境中生活。“肉身”在现代汉语中比“肉体”更自然，也避免误解为“罪性”，同时保留与下半句“肉体”的词义呼应。
- source_word: γὰρ
  choice: 因为
  rationale: γάρ承接上文并引出解释；“因为”清楚呈现论证关系，也符合现代汉语表达。
- source_word: περιπατοῦντες
  choice: 虽然活
  rationale: 该分词字面为“行走”，在保罗书信中常泛指生活或行事；结合后句的对比，按让步关系译为“虽然活”，简洁自然。
- source_word: οὐ κατὰ σάρκα
  choice: 不按肉体
  rationale: κατά在此表达准则、方式或支配原则。“按肉体”保留原文第二次σάρξ的开放性，未将其限定为“人的标准”“世俗方式”或“罪性”。
- source_word: στρατευόμεθα
  choice: 争战
  rationale: 原词采用军事意象，语境所指是使徒职分中的冲突与攻坚；“争战”既保留比喻，也符合庄重而通行的中文表达。
theological_decisions:
- issue: 两处σάρξ的译法及其关系
  choice: 第一处译“肉身”，第二处译“肉体”
  alternative: 两处都译“肉体”；或译“活在血肉之躯中……不按人的标准争战”
  rationale: 第一处主要指具身的人类生活，第二处则指争战所依据的属人或属肉体原则。采用“肉身／肉体”既使中文自然，又保留同一希腊词的明显呼应及两处含义之间的张力，不把第二处直接解释成“罪性”或仅仅“人的标准”。
- issue: 分词περιπατοῦντες与主句的逻辑关系
  choice: 以“虽然……却……”表达让步关系
  alternative: 译作“当我们活在肉身中时，我们不按肉体争战”
  rationale: 上下文强调外在处境与争战方式之间的反差；让步表达最能清楚传达这一关系，同时不改变命题内容。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“争战”保留军事比喻；句末破折号承接下一节。主文避免把σάρξ窄化为“罪性”，脚注提供较解释性的自然译法。
