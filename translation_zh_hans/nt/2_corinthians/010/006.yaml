  text: καὶ ἐν ἑτοίμῳ ἔχοντες ἐκδικῆσαι πᾶσαν παρακοήν, ὅταν πληρωθῇ ὑμῶν ἡ ὑπακοή.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/006.yaml
  text: and being ready to punish every act of disobedience[b][a], when your obedience is complete.
translation:
  language: zh_hans
  text: 并且随时准备着，等你们的顺服完全了[b]，就惩治[a]一切不顺服。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “惩治”或译“施行报应”或“伸张正义”。这个希腊语动词可指施行惩罚、报应或伸张正义；在这里很可能指按使徒权柄施行惩戒。
    reason: lexical_alternative
  - marker: b
    text: “等你们的顺服完全了”也可译作“当你们的顺服达到完全时”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἑτοίμῳ ἔχοντες
  choice: 已经准备好
  rationale: 该习语表示处于预备妥当、随时可以行动的状态；这样译成现代汉语自然，也保留了与上文相连的分词意味。
- source_word: ἐκδικῆσαι
  choice: 惩治
  rationale: 此处指保罗预备运用使徒权柄处理悖逆；“惩治”既表达施行惩戒或公正处置，又避免让人误解为私人报复。
- source_word: πᾶσαν παρακοήν
  choice: 一切不顺服
  rationale: παρακοή表示不听从、拒绝服从；“一切不顺服”保留集合性表达，也不把原文抽象名词不必要地限定为个别行为。
- source_word: ὅταν
  choice: 在……的时候
  rationale: ὅταν与虚拟语气构成尚待实现的将来时间条件；中文“在……的时候”自然表达事情发生之后才采取行动的关系。
- source_word: πληρωθῇ
  choice: 完全
  rationale: 该被动形式表示达到完满或完成；与“顺服”搭配译作“完全顺服”，简洁而自然。
- source_word: ὑμῶν ἡ ὑπακοή
  choice: 你们完全顺服
  rationale: 属格明确指哥林多人；将名词结构自然转化为汉语主谓结构，同时保留“你们的顺服”这一基本意义。
theological_decisions:
- issue: 保罗将如何回应不顺服
  choice: 以使徒权柄惩治不顺服
  alternative: 为一切不顺服伸冤或进行报复
  rationale: 上下文涉及使徒权柄以及对教会中反对者的处置。“惩治”符合管教和公正处置的语境，但脚注保留“伸张正义”的词义可能性，不将其缩减为私人报复。
- issue: “你们完全顺服”的范围和性质
  choice: 保留原文概括性的表述
  alternative: 明确解释为全体哥林多人服从保罗的使徒指示
  rationale: 原文没有明确界定谁必须达到何种程度的顺服；正文不补入“全体”或具体对象，以保留其范围上的张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“惩治”比“惩罚”略能涵盖司法性和管教性的意味；语序将时间从句前置，使条件关系清楚。正文中的脚注标记均与脚注对应。
