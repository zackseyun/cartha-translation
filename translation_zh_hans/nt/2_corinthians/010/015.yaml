id: 2CO.10.15
reference: 2 Corinthians 10:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οὐκ εἰς τὰ ἄμετρα καυχώμενοι ἐν ἀλλοτρίοις κόποις, ἐλπίδα δὲ ἔχοντες αὐξανομένης τῆς πίστεως ὑμῶν ἐν ὑμῖν μεγαλυνθῆναι κατὰ τὸν κανόνα ἡμῶν εἰς περισσείαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/015.yaml
  text: not boasting beyond measure in the labors of others, but having hope that, as your faith is growing among you, we will be enlarged according to our sphere of ministry, unto abundance,
translation:
  language: zh_hans
  text: 我们并不是在别人的劳苦上越过限度地夸口；相反，我们盼望，随着你们的信心增长，我们能在你们中间按着我们的范围，得以进一步扩展[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在你们中间”也可与前句相连，译作“随着你们中间的信心增长”。原文的连接关系存在真实歧义。
    reason: 句法歧义；ἐν ὑμῖν可修饰“信心增长”，也可修饰“得以扩展”。
  - marker: b
    text: “得以进一步扩展”直译可作“被增大，达到更丰盛的程度”；也有人理解为“更受尊崇”。按上下文，这里较可能指保罗使徒工作的范围进一步扩大。“我们的范围”指量定的活动领域。
    reason: 保留μεγαλυνθῆναι及εἰς περισσείαν的词义张力，并说明κανών的语境含义。
lexical_decisions:
- source_word: οὐκ εἰς τὰ ἄμετρα καυχώμενοι
  choice: 不是越过限度……夸口
  rationale: 保留“尺度、界限”的比喻，也延续本段καυχάομαι的“夸口”用语；中文以“越过限度”自然表达不超出正当范围之意。
- source_word: ἐν ἀλλοτρίοις κόποις
  choice: 拿别人的劳苦夸口
  rationale: κόπος指辛劳及其工作成果；此处意为不把别人辛苦完成的工作当作自己夸口的资本。
- source_word: αὐξανομένης τῆς πίστεως ὑμῶν
  choice: 随着你们的信心增长
  rationale: 以时间或伴随关系表达属格独立结构；πίστις在此指哥林多人对福音的信，译作“信心”。
- source_word: ἐν ὑμῖν
  choice: 在你们中间
  rationale: 按词序和语境将其理解为保罗工作的范围在哥林多人中间得以扩展；由于也可能修饰信心的增长，另以脚注保留。
- source_word: μεγαλυνθῆναι
  choice: 大大扩展
  rationale: 本义有“使增大、使显大”；结合上下文所谈的工作范围，译出使徒事工范围扩大，而不是把它处理为个人受尊崇。
- source_word: κατὰ τὸν κανόνα ἡμῶν
  choice: 照着划给我们的范围
  rationale: κανών在本段指量定或分派的活动范围，不是后来的“正典”概念；“划给”结合13节的语境，表达此范围来自分派。
- source_word: εἰς περισσείαν
  choice: 大大
  rationale: 表达向更丰盛、更广大程度发展的方向与结果，并与μεγαλυνθῆναι合译成自然中文“大大扩展”。
theological_decisions:
- issue: μεγαλυνθῆναι所指的是使徒工作扩展还是保罗个人受尊崇
  choice: 理解为保罗使徒工作的范围大大扩展
  alternative: 理解为保罗在哥林多人中更受尊崇或声望提高
  rationale: 上下文持续谈论神量给的界限、抵达哥林多以及不借别人的劳苦夸口，因此工作范围的扩展更切合论证；脚注仍说明原词可有“被高举、被尊为大”的形式意义。
- issue: ἐν ὑμῖν的句法归属
  choice: 与μεγαλυνθῆναι相连，即“我们在你们中间……扩展”
  alternative: 与αὐξανομένης τῆς πίστεως ὑμῶν相连，即“你们中间的信心增长”
  rationale: 两种连接在希腊文中都可成立；正文采用与后面的不定式相连的理解，因其符合本段事工范围的主题，同时用脚注明示另一读法，不消除原文歧义。
- issue: κανών的语境含义
  choice: 划定的工作范围
  alternative: 准则、尺度或规则
  rationale: 本段的空间与量度意象表明这里主要指所分派的活动领域；不采用可能令人误会为教会正典或抽象行为规范的译法。
translation_notes:
  register: 采用现代、庄重而清晰的书面普通话。“劳苦”“夸口”“信心”等词保留保罗论述的经文语体；句式避免生硬直译，并以脚注保存ἐν ὑμῖν的句法歧义及μεγαλυνθῆναι的语义张力。
