  text: ἡμεῖς δὲ ⸀οὐκ εἰς τὰ ἄμετρα καυχησόμεθα, ἀλλὰ κατὰ τὸ μέτρον τοῦ κανόνος οὗ ἐμέρισεν ἡμῖν ὁ θεὸς μέτρου, ἐφικέσθαι ἄχρι καὶ ὑμῶν—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/013.yaml
  text: But we will not boast beyond measure[a], but according to the measure of the sphere that God assigned to us—a measure that reaches even to you—
translation:
  language: zh_hans
  text: 但我们不作越过限度的夸口，只按上帝分给我们的范围[a]的尺度夸口；这范围甚至延伸到你们那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “范围”所译的希腊词也可指“测量杆”“准则”或“标准”；这里主要指上帝所划定的范围。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄμετρα
  choice: 越过限度
  rationale: 结合 εἰς 构成越界之意，既表达超出适当界限，也保留本节反复出现的度量和范围意象。
- source_word: καυχησόμεθα
  choice: 夸口
  rationale: 准确反映保罗在争辩语境中谈论自夸或声称功劳，且是现代中文圣经语体中自然明确的表达。
- source_word: κατὰ τὸ μέτρον
  choice: 只按……范围
  rationale: κατά 表示依照，μέτρον 在这里涉及获分派的限度；中文用“按……范围”传达依照既定界限的意思。
- source_word: κανόνος
  choice: 范围
  rationale: 此处与分派、度量及延伸到哥林多人那里等空间意象相连，主要指上帝所划定的工作范围，而不只是抽象的规则或标准。
- source_word: οὗ ἐμέρισεν ἡμῖν ὁ θεὸς
  choice: 上帝分给我们的
  rationale: μερίζω 表示分配、划分份额；“分给”自然地表达这一范围由上帝划定并赐予。
- source_word: μέτρου
  choice: 这范围的限度
  rationale: 原文第二次使用 μέτρον，语法上略显压缩，可能进一步说明 κανών；此译保留度量概念，同时使中文关系清楚。
- source_word: ἐφικέσθαι
  choice: 延伸到
  rationale: 不定式在此说明所分范围达到何处；“延伸到”保留空间上的幅度意象。
- source_word: ἄχρι καὶ ὑμῶν
  choice: 甚至……你们那里
  rationale: ἄχρι 表示达到的界限，καί 加强语气；“甚至”保留哥林多人也包括在其中的强调。
theological_decisions:
- issue: κανών 所指的是事工范围还是衡量夸口的抽象准则
  choice: 上帝所分派、且包括哥林多人的事工范围
  alternative: 衡量保罗夸口的规则或标准
  rationale: 上下文集中使用限度、分配和延伸等意象，并明确说这一范围达到哥林多人那里，因此空间性和事工分派的含义更突出；脚注仍保留“准则、标准”等真实词义可能。
translation_notes:
  register: 采用庄重而现代的普通话。“越过限度”“范围”“限度”“延伸”共同保留原文的度量与空间意象；将尾部压缩的希腊句法适度展开，以免中文晦涩。脚注标记置于整句末尾，对“范围”的词义作说明。
