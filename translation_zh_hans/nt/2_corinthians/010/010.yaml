id: 2CO.10.10
reference: 2 Corinthians 10:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὅτι Αἱ ⸂ἐπιστολαὶ μέν⸃, φησίν, βαρεῖαι καὶ ἰσχυραί, ἡ δὲ παρουσία τοῦ σώματος ἀσθενὴς καὶ ὁ λόγος ἐξουθενημένος.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/010.yaml
  text: For they say[a], “His letters are weighty and strong, but his bodily presence is weak[b], and his speech is despised.”
translation:
  language: zh_hans
  text: 因为有人说[a]：“他的信又有分量又有力量，他本人在场时却显得软弱，言语也受人轻视[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “有人说”原文形式上也可译作“他说”。这里是引述批评保罗者的说法。
    reason: lexical_alternative
  - marker: b
    text: “受人轻视”也可译作“被人看不起”或“被视为不足取”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 承接上文并引出其所依据的批评内容；中文用“因为有人说”自然地表达理由与引述关系。
- source_word: ἐπιστολαὶ
  choice: 信
  rationale: 指普通的书信往来；“信”比教会化色彩较浓的“书信”更自然简明。
- source_word: μέν ... δὲ
  choice: 又……又……却
  rationale: 以“却”明确表现信件与本人在场时的反差，同时使中文句式流畅。
- source_word: φησίν
  choice: 有人说
  rationale: 原文形式上是单数“他说”，但在这里可作插入式引述语，代表批评保罗者的说法；“有人说”保留未明确指出说话者人数的特点。
- source_word: βαρεῖαι
  choice: 有分量
  rationale: 既保留“沉重”的隐喻，又自然表达信件严肃、具有影响力的意思。
- source_word: ἰσχυραί
  choice: 有力量
  rationale: 直接表达强而有力，并与“有分量”构成自然搭配。
- source_word: παρουσία τοῦ σώματος
  choice: 本人在场时
  rationale: 这里指保罗亲身出现、面对众人时的表现；此译法比直译“身体的临在”更符合现代汉语，同时没有把所指缩窄为外貌。
- source_word: ἀσθενὴς
  choice: 显得软弱
  rationale: “软弱”保留原词的一般意义；“显得”表明这是批评者对保罗现场表现的评价，而非叙述者的断言。
- source_word: λόγος
  choice: 言语
  rationale: 在信件与亲身在场的对比中，指保罗口头表达或讲话；“言语”既自然又不限定为演说技巧或信息内容。
- source_word: ἐξουθενημένος
  choice: 受人轻视
  rationale: 原词表达被视为无足轻重、遭到鄙视；被动表达能清楚保留这是别人对其言语的评价，而不是断言其言语本身卑劣。
theological_decisions:
- issue: 批评保罗的话是否应被译成叙述者本人的判断
  choice: 用“有人说”引出整段引语，并以“显得”“受人轻视”标示评价视角
  alternative: 译作“他说”，或不加引语而直接陈述
  rationale: 上下文表明这是保罗所转述的批评，不是作者认可保罗确实软弱或其言语毫无价值。
- issue: παρουσία τοῦ σώματος所指是外貌还是亲身表现
  choice: 本人在场时
  alternative: 外表；身体的临在
  rationale: 原文强调与书信相对的亲身在场，但未明确只指外貌；译文保留对现场整体表现的开放性。
translation_notes:
  register: 采用现代、庄重而通俗的汉语。“有分量又有力量”保留原文并列的修辞力度；“本人在场时”避免生硬直译，也不把含义限制为身体外貌。所有脚注标记均已置于正文相应位置。
