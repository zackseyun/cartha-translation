  text: ἵνα μὴ δόξω ὡς ἂν ἐκφοβεῖν ὑμᾶς διὰ τῶν ἐπιστολῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/009.yaml
  text: so that I may not seem as though I were trying to frighten you by my letters[a].
translation:
  language: zh_hans
  text: 免得我显得像是要借着这些信吓唬你们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “吓唬”也可译作“威吓”。
    reason: ἐκφοβεῖν既可侧重使人害怕，也可在此语境中表达以恐惧施压、威吓之意。
lexical_decisions:
- source_word: ἵνα μὴ
  choice: 免得
  rationale: ἵνα加否定词μή在这里引出与上文相连的否定目的或所要避免的结果；“免得”简洁自然，也保留了从属关系。
- source_word: δόξω
  choice: 我显得
  rationale: δοκέω在此不是“认为”，而是“显得、看来”；第一人称单数形式译为“我显得”。
- source_word: ὡς ἂν
  choice: 像是要
  rationale: 这一组合表达一种表象或假定性的比较，“像是要”在现代汉语中自然，并保留保罗所否认的是给人的印象。
- source_word: ἐκφοβεῖν
  choice: 吓唬
  rationale: 该动词表示使人害怕或受到惊吓。“吓唬”直接易懂；“威吓”也可能，并在脚注中保留。
- source_word: ὑμᾶς
  choice: 你们
  rationale: 这是复数第二人称，作ἐκφοβεῖν的宾语。
- source_word: διὰ τῶν ἐπιστολῶν
  choice: 借着这些信
  rationale: διά加属格表示手段。原文有定冠词而无明确的第一人称物主词，因此不用“我的信”，译作“这些信”既符合语境，也避免补入原文未明说的所有关系。
theological_decisions:
- issue: 保罗是在否认实际威吓，还是避免给人这种印象
  choice: 保留“显得像是要”的表象性说法
  alternative: 直译成“免得我借着这些信吓唬你们”
  rationale: δόξω与ὡς ἂν共同突出的是别人可能形成的观感；删去这一层会把经文说得比原文更绝对。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“免得”保留本节与上文的语法联系；“借着这些信”体现手段关系，并保留原文定冠词所指信件的语境性。
