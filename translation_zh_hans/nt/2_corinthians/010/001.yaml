source:
  edition: SBLGNT
  text: Αὐτὸς δὲ ἐγὼ Παῦλος παρακαλῶ ὑμᾶς διὰ τῆς πραΰτητος καὶ ἐπιεικείας τοῦ Χριστοῦ, ὃς κατὰ πρόσωπον μὲν ταπεινὸς ἐν ὑμῖν, ἀπὼν δὲ θαρρῶ εἰς ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/001.yaml
  text: I myself[a], Paul, appeal to you by the meekness and gentleness of Messiah—I who am humble face to face among you[c][b], but bold toward you when absent.
translation:
  language: zh_hans
  text: 我，保罗，亲自凭着弥赛亚[a]的温柔和宽厚劝你们——我在你们当面[b]时是谦卑的[c]，不在时对你们却很大胆。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弥赛亚”也常译作“基督”；希腊文Χριστός是“受膏者”的称号。
    reason: 称号译法说明
  - marker: b
    text: 希腊文直译为“按着脸面”，这里指本人在场、面对面。
    reason: 原文习语说明
  - marker: c
    text: “谦卑”也可理解为“低微”；这里可能带有反讽，呼应有人认为保罗当面显得软弱或胆怯的说法，但原文没有明说这是引语。
    reason: 保留词义范围与潜在反讽
lexical_decisions:
- source_word: Αὐτὸς δὲ ἐγὼ Παῦλος
  choice: 我保罗亲自
  rationale: αὐτός与显明的第一人称代词共同加强语气；“我保罗亲自”在现代汉语中自然地保留这种亲自出面的强调。δέ在此主要承接并转折话题，不必机械译出。
- source_word: παρακαλῶ
  choice: 劝你们
  rationale: 这里是保罗亲自提出恳切劝告，而不是发布命令；“劝”简明自然，并保留关系性的恳求语气。
- source_word: διὰ τῆς πραΰτητος καὶ ἐπιεικείας
  choice: 借着……的温柔和宽厚
  rationale: διά加属格可表示凭借或诉诸的基础。πραΰτης译作“温柔”，ἐπιείκεια译作“宽厚”，既区分两者，也表达克制、体谅、不苛刻的品格。
- source_word: τοῦ Χριστοῦ
  choice: 弥赛亚的
  rationale: Χριστός在这里是称号，译作“弥赛亚”可传达其受膏者的称号意义，而不是仅作音译名称。
- source_word: κατὰ πρόσωπον
  choice: 当面
  rationale: 该短语字面与“脸面”有关，在这里指亲身相处、面对面，与后文“不在”构成清楚对照；“当面”最符合现代汉语习惯。
- source_word: ταπεινὸς
  choice: 谦卑的
  rationale: ταπεινός可指谦卑或低微；上下文可能带有对保罗当面表现的讥讽。“谦卑”保留基本词义及潜在反讽，不直接解释成“胆怯”。
- source_word: ἀπὼν δὲ θαρρῶ εἰς ὑμᾶς
  choice: 不在时对你们却很大胆
  rationale: ἀπών按处境译为“不在时”；θαρρῶ表示有胆量、敢于直言，译作“大胆”；εἰς ὑμᾶς只表达朝向或针对，译作“对你们”，不增添敌对意味。
theological_decisions:
- issue: Χριστός作为称号的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处指耶稣的弥赛亚身份及其品格。正文译出称号的意义，脚注保留华人基督教读者熟悉的传统音译。
- issue: 保罗“谦卑”的语气
  choice: 保留“谦卑”，并以脚注说明可能带有反讽
  alternative: 胆怯；低微
  rationale: 希腊文没有明确的引语标记，不能断言保罗是在直接引用对手；正文保留词义和修辞张力，不替读者决定这究竟是自述还是对别人批评的反讽复述。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“我保罗亲自”突出保罗本人出面劝告；破折号保留由恳劝转入自我描述的修辞推进。“温柔和宽厚”避免两个近义词完全重叠，“当面／不在”则清楚呈现原文的对照。
