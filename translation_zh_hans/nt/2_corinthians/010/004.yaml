  text: τὰ γὰρ ὅπλα τῆς στρατείας ἡμῶν οὐ σαρκικὰ ἀλλὰ δυνατὰ τῷ θεῷ πρὸς καθαίρεσιν ὀχυρωμάτων— λογισμοὺς καθαιροῦντες
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/004.yaml
  text: For the weapons of our warfare are not fleshly[c][b][a], but powerful before God for the tearing down of strongholds—tearing down arguments
translation:
  language: zh_hans
  text: 因为我们争战所用的兵器不是属血肉的[a]，而是在神面前大有能力[b]，为要摧毁堡垒——摧毁论辩[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不属于血肉”或“不是凭人的”。“属血肉”在这里不一定只指道德上的罪恶。
    reason: lexical_alternative
  - marker: b
    text: “在神面前大有能力”也可理解为“靠神大有能力”或“具有神所赐的大能”。
    reason: alternative_reading
  - marker: c
    text: “论辩”也可译作“推论”“思量”或“谋算”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπλα
  choice: 兵器
  rationale: 保留具体的军事意象；“兵器”在现代汉语中自然、庄重，也适合上下文中的比喻。
- source_word: στρατείας
  choice: 争战
  rationale: 表达持续的军事斗争，比“服兵役”更符合本段语境，又比“战役”涵盖更广。
- source_word: σαρκικὰ
  choice: 属血肉的
  rationale: 保留与σάρξ（血肉）的词义联系，不把含义过早缩窄为“罪恶的”，也不淡化为泛泛的“世俗的”。
- source_word: δυνατὰ τῷ θεῷ
  choice: 在神面前大有能力
  rationale: 较直接地反映压缩的与格结构，不在正文中断定它必然表示工具或来源；其他可能理解收入脚注。
- source_word: πρὸς καθαίρεσιν
  choice: 足以摧毁
  rationale: 既表达兵器的效力和指向，也保持拆毁防御工事的鲜明意象。
- source_word: ὀχυρωμάτων
  choice: 堡垒
  rationale: 是现代汉语中清楚自然的军事用语，可同时承载字面意象及保罗的比喻性运用。
- source_word: λογισμοὺς
  choice: 论辩
  rationale: 结合下一节反对人认识神的语境，指带有对抗性的推理或主张；脚注保留“推论、思量”等较宽泛可能。
- source_word: καθαιροῦντες
  choice: 摧毁
  rationale: 与前面的καθαίρεσις采用同一译词，保留原文的词根呼应和修辞力度。
theological_decisions:
- issue: σαρκικὰ所表达的人与神之间的对照
  choice: 属血肉的
  alternative: 属世的；出于肉体的；凭人的
  rationale: 这里主要对比人的资源或方式与神所关联的大能。“属血肉的”保留保罗用语的神学张力，而不武断地限定为道德上的罪性。
- issue: δυνατὰ τῷ θεῷ中τῷ θεῷ的语义作用
  choice: 在神面前大有能力
  alternative: 靠神大有能力；具有神所赐的大能
  rationale: 希腊语与格表达简练，可被理解为在神面前、借着神或由神赋能。正文采用较贴近形式且较少解释性的译法，脚注列出其他合理理解。
- issue: λογισμοὺς的对抗性质
  choice: 论辩
  alternative: 推论；思量；谋算
  rationale: 下一节表明这些思想活动与认识神相对抗，但本节本身仍可容纳较宽的“推理、思想”范围，因此不译成更强烈且带定罪色彩的词。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“兵器—争战—堡垒—摧毁”维持贯穿全句的军事意象；破折号保留原文由一般性的“摧毁堡垒”转入具体说明“摧毁各种论辩”的推进。所有脚注标记均紧随其所说明的词语。
