  yaml_path: translation/nt/2_corinthians/010/017.yaml
  text: But the one who boasts must boast in the Lord[a].
translation:
  language: zh_hans
  text: 但夸口的，要在主里夸口。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较形式对应地译作：“夸口的，当在主里夸口。”保罗很可能是在呼应《耶利米书》9:24（《七十士译本》编号9:23）。
    reason: cross_reference
lexical_decisions:
- source_word: Ὁ ... καυχώμενος
  choice: 夸口的
  rationale: 定冠词加现在时中间语态分词作名词用，泛指任何夸口的人；“夸口的”简洁自然，并保留原文的代表性单数表达。
- source_word: δὲ
  choice: 但
  rationale: δέ在此承接上文并带有温和的转折意味，把不当的自夸与合宜的夸口相对照；“但”准确且自然。
- source_word: καυχώμενος / καυχάσθω
  choice: 夸口的／要……夸口
  rationale: καυχάομαι在本段语境中指“夸口、自豪”；重复使用“夸口”保留原文的修辞呼应。“要……夸口”传达第三人称命令式的劝诫语气，同时符合现代汉语表达。
- source_word: ἐν
  choice: 在……里
  rationale: ἐν与καυχάομαι连用，可表达夸口所归属的领域、根据或对象。“在主里夸口”保留原文较宽的语义，也呼应其可能援引的《耶利米书》措辞。
- source_word: κυρίῳ
  choice: 主
  rationale: 原文只写κύριος，并未进一步明确是“主耶稣”还是“神”；译作“主”保留保罗用语及经文回声中的神学张力。
theological_decisions:
- issue: 引文或典故语境中“主”的所指
  choice: 主
  alternative: 主耶稣；神
  rationale: 本句很可能呼应《耶利米书》9:24（七十士译本编号9:23），而保罗书信中的“主”又常指主耶稣。由于本句没有明确限定，译文不作解释性扩充。
- issue: 命令式καυχάσθω的表达
  choice: 要在主里夸口
  alternative: 就当在主里夸口；让他在主里夸口
  rationale: 第三人称命令式表达规范性劝诫。“要”在现代汉语中自然地传达这种要求，同时不把语气强化为绝对义务，也不采用较生硬的“让他”。
translation_notes:
  register: 采用现代、庄重而简洁的普通话。“夸口”保留本段的修辞锋芒；“在主里”虽略带经文语体，却准确保留ἐν的宽泛关系及可能的旧约回声。脚注标记已在正文中呈现。
