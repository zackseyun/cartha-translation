  text: οὐ γὰρ ὁ ἑαυτὸν ⸀συνιστάνων, ἐκεῖνός ἐστιν δόκιμος, ἀλλὰ ὃν ὁ κύριος συνίστησιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/018.yaml
  text: For it is not the one who commends himself who is approved[a], but the one whom the Lord commends.
translation:
  language: zh_hans
  text: 因为，得到认可的人，不是自我举荐的人，而是主所举荐的人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “举荐”也可译作“推荐”或“称许”。原文前后两处使用同一个希腊动词。
    reason: lexical_alternative
lexical_decisions:
- source_word: συνιστάνων / συνίστησιν
  choice: 举荐
  rationale: 本节处于夸口与评判的语境中，动词表示把某人呈交评判、为其作出推荐。“举荐”自然地保留了两处同一希腊动词的重复，也适用于自我举荐和主的举荐。
- source_word: δόκιμος
  choice: 蒙认可的
  rationale: 该词指经检验或评定后获得认可。“蒙认可的”既表达评判结果，也与后文主的举荐形成清楚对照。
- source_word: κύριος
  choice: 主
  rationale: 按其称号直译为“主”，不在正文中进一步指定是主耶稣还是上帝。
- source_word: ἑαυτόν
  choice: 自我
  rationale: 与“举荐”组成现代汉语中自然的“自我举荐”，准确表达反身含义；汉语无须添加原文阳性单数所对应的性别代词。
- source_word: γάρ
  choice: 因为
  rationale: 表明本句是对前文论述的解释或理由，现代汉语用“因为”衔接自然。
theological_decisions:
- issue: “主”（ὁ κύριος）的所指
  choice: 正文仅译作“主”
  alternative: 明确译作“主耶稣”或“上帝”
  rationale: 保罗书信中“主”在此很可能指耶稣，但本节本身只写“主”；保留原文称号，避免消除其所指仍有的含蓄性。
- issue: 获得认可的依据
  choice: 保留“自我举荐”与“主所举荐”的直接对照
  alternative: 解释性地改写为“主所称许的才算合格”
  rationale: 原文强调举荐者是谁，同时使用 δόκιμος 表达认可结果；译文不把二者合并成一项解释，以保留论证张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“蒙认可的”保留 δόκιμος 所含经评定而获认可的意味；“自我举荐”简洁自然，并与“主所举荐”形成原文式重复。
