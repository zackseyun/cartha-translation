  text: οὐ γὰρ ὡς μὴ ἐφικνούμενοι εἰς ὑμᾶς ὑπερεκτείνομεν ἑαυτούς, ἄχρι γὰρ καὶ ὑμῶν ἐφθάσαμεν ἐν τῷ εὐαγγελίῳ τοῦ Χριστοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/014.yaml
  text: For we are not overextending ourselves[a], as though we had not reached you[c][b], for we came even as far as you with the gospel of Messiah—
translation:
  language: zh_hans
  text: 因为我们并不是过分扩展自己，好像还没有到达你们那里；因为我们带着基督的福音，甚至已经到达你们那里——
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπερεκτείνομεν ἑαυτούς
  choice: 越过界限伸展自己
  rationale: 保留原文“伸展过度、超出适当范围”的空间隐喻，同时用现代汉语明确表达越界之意。
- source_word: ὡς μὴ ἐφικνούμενοι εἰς ὑμᾶς
  choice: 仿佛没有达到你们那里
  rationale: 保留分词短语所表达的假设情形，也延续本段关于事工范围的空间性措辞。
- source_word: ἄχρι γὰρ καὶ ὑμῶν ἐφθάσαμεν
  choice: 事实上……甚至已经到了你们那里
  rationale: “甚至”体现καί的强调作用，“已经到了”表达ἐφθάσαμεν所指的实际、已完成的到达；“事实上”在汉语中自然承接原文γάρ的论证。
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: 带着……福音
  rationale: 这里的ἐν可表示伴随、凭借或事工所处的领域；“带着……福音”自然表达保罗传福音而到达哥林多的意思，又不过度限定其语义。
- source_word: τοῦ Χριστοῦ
  choice: 基督的
  rationale: “基督”是现代汉语中Χριστός在保罗书信里的通行、庄重译法；属格结构照译，也保留福音属于基督或以基督为内容的语义空间。
theological_decisions:
- issue: τοῦ Χριστοῦ中Χριστός的译法
  choice: 基督
  alternative: 弥赛亚
  rationale: 此处Χριστός位于固定而自然的“基督的福音”结构中，较接近称号已成为专称的用法；译作“基督”既符合现代中文读者的惯常理解，也不否认其弥赛亚称号背景。
- issue: τοῦ Χριστοῦ属格关系
  choice: 保留为“基督的福音”
  alternative: 关于基督的福音／来自基督的福音
  rationale: 原文属格可能涵盖福音以基督为内容、属于基督或源于基督等关系；不在正文中把它收窄为单一解释。
translation_notes:
  register: 采用现代、庄重而可懂的书面汉语；保留“伸展—达到—到了”的空间隐喻链条，并以破折号承接原文未完的句势。
