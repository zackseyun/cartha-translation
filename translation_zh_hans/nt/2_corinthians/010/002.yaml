reference: 2 Corinthians 10:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: δέομαι δὲ τὸ μὴ παρὼν θαρρῆσαι τῇ πεποιθήσει ᾗ λογίζομαι τολμῆσαι ἐπί τινας τοὺς λογιζομένους ἡμᾶς ὡς κατὰ σάρκα περιπατοῦντας.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/002.yaml
  text: But I beg that when I am present I may not have to be bold with the confidence by which I consider daring to confront some who regard us as walking according to the flesh[a].
translation:
  language: zh_hans
  text: 但我恳求你们，免得我到你们那里时，不得不凭着那种把握放胆行事；我打算凭着这种把握，大胆针对某些认为我们是按着肉体行事的人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“认为我们是按人的标准行事的人。”
    reason: 说明κατὰ σάρκα可作较解释性的理解，同时正文保留“肉体”这一保罗式表达。
lexical_decisions:
- source_word: δέομαι
  choice: 我恳求你们
  rationale: 表达恳切请求，语气强于一般的“请求”；宾语“你们”由上下文自然补出，使现代汉语完整。
- source_word: τὸ μὴ παρὼν θαρρῆσαι
  choice: 等我到了你们那里，不要逼我……放胆行事
  rationale: 该结构说明保罗所恳求之事。原文含有不愿在场时采取强硬行动的意味；“不要逼我”自然传达这种不希望成为必要的含义。
- source_word: παρὼν
  choice: 等我到了你们那里
  rationale: 结合上下文与“不在场”相对，译出亲自来到哥林多人中间之意，比孤立的“在场”更符合现代汉语。
- source_word: θαρρῆσαι
  choice: 放胆行事
  rationale: 保留其勇敢、无所畏惧地采取行动的含义，也适合此处预期严厉处置的语境。
- source_word: τῇ πεποιθήσει
  choice: 用那种自信／凭着这自信
  rationale: πεποίθησις 指信心、把握；与行动相连时，汉语用“凭着”自然体现工具或依据关系。
- source_word: ᾗ λογίζομαι
  choice: 我料想，我会凭着这自信
  rationale: λογίζομαι 在此可指经过考虑后所作的判断或打算。“料想”既保留判断意味，又不把尚未发生的行动说成确定决定。
- source_word: τολμῆσαι
  choice: 大胆对付
  rationale: 保留“敢于采取行动”的语义，并与后面的 ἐπί τινας 一同表达行动所针对的对象。
- source_word: ἐπί τινας
  choice: 对付某些……的人
  rationale: ἐπί 加人称宾语在这里带有针对、对抗色彩；“对付”比中性的“对待”更能表达这种敌对方向，同时没有具体化对付方式。
- source_word: τοὺς λογιζομένους
  choice: 认为……的人
  rationale: 表示某些人对保罗及其同工所作的判断；“认为”清楚而自然。
- source_word: κατὰ σάρκα
  choice: 按着肉体
  rationale: 直译并保留保罗用语的神学张力和多义性，不把它单一解释为犯罪本性或仅仅人的标准。
- source_word: περιπατοῦντας
  choice: 行事
  rationale: περιπατέω 在此以“行走”比喻生活方式或行为表现；现代汉语“行事”自然，也能与 κατὰ σάρκα 紧密搭配。
theological_decisions:
- issue: κατὰ σάρκα 中 σάρξ 的译法
  choice: 按着肉体
  alternative: 按人的标准
  rationale: 此处可能指按世俗、属人的方式行事，但 σάρξ 是保罗书信中具有重要神学内涵且语义宽广的词。“肉体”保留原文的张力；“人的标准”作为脚注提供较解释性的可能读法。
- issue: 保罗预期行动的确定程度
  choice: 我料想，我会……大胆对付
  alternative: 我决定要……大胆对付
  rationale: λογίζομαι 可含考虑、判断或意图；译作“决定”会把意向说得过于确定。“料想”保留其审慎判断及尚未付诸行动的状态。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以分号梳理原文较长的句法关系，并用“不要逼我”表达隐含的“不愿到时不得不如此”；正文保留“按着肉体”的神学与词义张力，脚注给出通俗替代译法。
