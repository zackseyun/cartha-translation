id: 2CO.2.15
reference: 2 Corinthians 2:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὅτι Χριστοῦ εὐωδία ἐσμὲν τῷ θεῷ ἐν τοῖς σῳζομένοις καὶ ἐν τοῖς ἀπολλυμένοις,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/015.yaml
  text: For we are the aroma of Messiah to God among those who are being saved and among those who are perishing[b][a],
translation:
  language: zh_hans
  text: 因为，无论在正在得救的人中，还是在正在灭亡的人中，我们在上帝面前都是基督的馨香。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 本词承接上文并引出解释或原因；“因为”在现代汉语中自然地保留这一因果、说明作用。
- source_word: Χριστοῦ
  choice: 基督的
  rationale: 属格表示这馨香属于基督、源于基督或以基督为特征。“基督”是现代汉语中对 Χριστός 的通行称谓，也保留其称号性质。
- source_word: εὐωδία
  choice: 馨香
  rationale: “馨香”既表达令人悦纳的香气，也符合本段带有献祭和凯旋行列背景的庄重语域；没有另加原文未明说的修饰成分。
- source_word: τῷ θεῷ
  choice: 在上帝面前
  rationale: 与“馨香”搭配时，“在上帝面前”自然表达这香气与上帝的关系及其蒙上帝鉴察、悦纳的方向；比生硬的“对上帝”更符合现代汉语。
- source_word: ἐν τοῖς σῳζομένοις
  choice: 在正在得救的人中
  rationale: “正在得救”保留现在分词所呈现的持续、进程性含义，“在人中”自然表达 ἐν 在此处的群体范围。
- source_word: ἐν τοῖς ἀπολλυμένοις
  choice: 在正在灭亡的人中
  rationale: “正在灭亡”与前一现在分词形成平行，并保留持续、进程性的表达，不把它简化为静态标签“失丧的人”。
theological_decisions:
- issue: σῳζομένοις 与 ἀπολλυμένοις 的进程性及其张力
  choice: 分别译作“正在得救的人”和“正在灭亡的人”
  alternative: “得救的人”和“失丧的人”
  rationale: 两个现在分词都把得救与灭亡呈现为正在展开的现实。译文保留这种平行和神学张力，不将其改写为纯粹静态或已经完成的类别。
- issue: τῷ θεῷ 所表达的关系
  choice: 译作“在上帝面前”
  alternative: “对上帝来说”或“献给上帝”
  rationale: “在上帝面前”保留关系上的开放性，既可涵盖香气朝向上帝，也可表达其在上帝鉴察之下；避免用“献给”过度明确原文未直接陈述的献祭动作。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“无论……还是……”清楚呈现两个平行群体；保留“正在”以反映两个现在分词的进程性。“馨香”延续经文意象而不过度口语化。
