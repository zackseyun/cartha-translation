id: 2CO.2.10
reference: 2 Corinthians 2:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ᾧ δέ τι χαρίζεσθε, κἀγώ· καὶ γὰρ ἐγὼ ⸂ὃ κεχάρισμαι, εἴ τι⸃ κεχάρισμαι, δι’ ὑμᾶς ἐν προσώπῳ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/010.yaml
  text: To anyone whom you forgive anything[a], I do too. For what I have forgiven—if I have forgiven anything—I have forgiven for your sake in the presence of Messiah,
translation:
  language: zh_hans
  text: 你们无论饶恕谁，无论饶恕什么，我也一样。因为我所饶恕的——若我曾饶恕过什么——是在弥赛亚面前[a]，为了你们而饶恕的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“代表弥赛亚（行事）”。
    reason: 原文ἐν προσώπῳ Χριστοῦ可指“在弥赛亚面前”，也可能表示在其位格或权柄之下、代表他行事。
lexical_decisions:
- source_word: ᾧ δέ τι χαρίζεσθε, κἀγώ
  choice: 你们无论饶恕谁什么事，我也同样饶恕
  rationale: χαρίζομαι 在管教与恢复关系的语境中指免除过错，译作“饶恕”最自然；“无论……谁什么事”保留关系代词与不定代词所表达的开放范围，“也同样”体现 κἀγώ 的回应意味。
- source_word: ὃ κεχάρισμαι, εἴ τι κεχάρισμαι
  choice: 我所饶恕的——如果我确实饶恕过什么——
  rationale: 保留完成时所表达的既成行动，也保留保罗略带自我收敛的条件式插语；破折号使插语关系在现代中文中清楚可读。
- source_word: δι’ ὑμᾶς
  choice: 为了你们
  rationale: διά 加宾格在此表达为哥林多信徒的益处或缘故；“为了你们”简洁地传达这种牧养取向。
- source_word: ἐν προσώπῳ Χριστοῦ
  choice: 在弥赛亚面前
  rationale: πρόσωπον 可指脸、面前或身份；正文采用“在……面前”，表达保罗是在弥赛亚的临在和鉴察之下行事，同时以脚注保留身份或代表层面的可能解释。
- source_word: Χριστοῦ
  choice: 弥赛亚
  rationale: Χριστός 在此仍具有称号性质，译作“弥赛亚”可保留其受膏者称号的意义，而不只作为姓名式称呼。
theological_decisions:
- issue: ἐν προσώπῳ Χριστοῦ 是指在弥赛亚面前，还是以弥赛亚的身份行事
  choice: 在弥赛亚面前
  alternative: 以弥赛亚的身份
  rationale: “面前”较直接保留 πρόσωπον 的临在、当面含义，也符合保罗在弥赛亚鉴察下行事的庄重语气；但该短语也可能强调代表弥赛亚或以其身份行事，因此不在正文中排除这一解释，而以脚注注明。
- issue: Χριστός 应译作传统姓名式的“基督”，还是翻出称号意义
  choice: 弥赛亚
  alternative: 基督
  rationale: 本节没有要求把 Χριστός 当作纯粹姓名使用；译作“弥赛亚”保留其称号意义，并避免无根据地消解这一层含义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“饶恕”符合教会书信语境，也为普通读者熟悉；保留重复和条件式插语，不将保罗原文中的修辞张力过度顺平。脚注标记置于其所解释的短语之后。
