  source_fidelity: 主译准确呈现了两次 λελύπηκεν 的呼应、οὐκ…ἀλλά 的对照、ἀπὸ μέρους 的限定，以及 ἵνα μὴ ἐπιβαρῶ 所带的自我缓和语气。“免得把话说得太重”在此上下文中是自然且贴切的意译。脚注中把 ἀπὸ μέρους 释为“他只是使你们中的一部分人忧伤”则将程度性限定改成受影响者的子集，缺乏充分依据，且“只是”额外加强了语气。
