  text: Εἰ δέ τις λελύπηκεν, οὐκ ἐμὲ λελύπηκεν, ἀλλὰ ἀπὸ μέρους ἵνα μὴ ἐπιβαρῶ πάντας ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/005.yaml
  text: But if anyone has caused grief[a], he has grieved not me, but in part all of you—to some extent[b], so that I may not overstate it.
translation:
  language: zh_hans
  text: 若有人使人忧伤，他其实不是使我忧伤，而是在某种程度上使你们大家忧伤——我这样说，是免得把话说得太重。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“免得我加重你们大家的负担。”这里“在某种程度上”限制保罗对全体会众所受忧伤的说法；“加重负担”是该动词的字面意思，而正文按上下文译为“把话说得太重”。
    reason: 保留 ἐπιβαρῶ 的字面性译法和本句的修辞缓和，同时避免把 ἀπὸ μέρους 不当地解释为“你们中的一部分人”。
lexical_decisions:
- source_word: λελύπηκεν
  choice: 使人忧伤／使……忧伤
  rationale: 保留 λυπέω 两次出现的词语呼应；“忧伤”在现代汉语中自然、庄重，也能表达过去行为延续至今的影响。汉语不以形态直接标示完成时，因此不生硬添加“已经”。
- source_word: οὐκ ἐμὲ
  choice: 不是使我忧伤
  rationale: 直接保留保罗在“我”与“你们大家”之间所作的对比，不增添原文没有的“单单”或“亲自”等限定。
- source_word: ἀπὸ μέρους
  choice: 在某种程度上
  rationale: 此短语在这里作限制语，表示所说的话并非毫无限定；译为“在某种程度上”比直译“部分地”更符合现代汉语，同时保留其修饰范围可能存在的张力。
- source_word: ἐπιβαρῶ
  choice: 把话说得太重
  rationale: 该动词本义涉及“加重负担”。结合本句修辞，保罗似乎是在限制自己对全体会众的归责，因此采用汉语惯用表达“把话说得太重”；脚注保留更直译的理解。
- source_word: πάντας ὑμᾶς
  choice: 你们大家
  rationale: 明确表达 πάντας 的整体性，也自然体现第二人称复数的群体指向。
theological_decisions:
- issue: ἵνα μὴ ἐπιβαρῶ πάντας ὑμᾶς 的理解
  choice: 理解为保罗不愿把对全体会众的说法说得过重
  alternative: 免得我加重你们大家的负担
  rationale: 主译反映本句中 ἀπὸ μέρους 的缓和语气及 ἐπιβαρῶ 的修辞作用，但原文也可较直接地理解为不愿“使你们大家负担加重”，故以脚注明示，避免把歧义静默消除。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“其实”用于使希腊文 οὐκ…ἀλλά 的转折在汉语中自然清楚；破折号标出保罗对前述说法的缓和说明。
