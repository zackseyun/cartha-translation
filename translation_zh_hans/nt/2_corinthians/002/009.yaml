  text: εἰς τοῦτο γὰρ καὶ ἔγραψα ἵνα γνῶ τὴν δοκιμὴν ὑμῶν, εἰ εἰς πάντα ὑπήκοοί ἐστε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/009.yaml
  text: 'For this is why I also wrote: so that I might know the proof of you[a], whether you are obedient in everything.'
translation:
  language: zh_hans
  text: 我也正是为此写了信：好知道你们经考验所显出的表现[a]，看你们是否在一切事上都顺服。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“对你们的考验”；或“你们经考验所显出的品格”。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τοῦτο γὰρ καὶ ἔγραψα
  choice: 我写信也正是为此
  rationale: 以自然汉语表达说明目的的语气，并保留 καὶ 的附加意味“也”；ἔγραψα 依语境译为“写信”。
- source_word: ἵνα γνῶ
  choice: 要知道
  rationale: 保留目的从句以及“得知、了解”的含义，避免增添原文没有的解释。
- source_word: τὴν δοκιμὴν ὑμῶν
  choice: 你们经受考验的表现[a]
  rationale: δοκιμή 可指考验本身，也可指经考验所显出的可靠表现或品格。“经受考验的表现”在现代汉语中较自然，并保留从过程到结果的语义张力；脚注列出其他可能理解。
- source_word: εἰ εἰς πάντα ὑπήκοοί ἐστε
  choice: 看你们是否在一切事上都顺服
  rationale: εἰ 在 γνῶ 之后引出间接问句，译作“是否”；εἰς πάντα 表示范围全面，译作“在一切事上”；ὑπήκοοι 译作“顺服”。
theological_decisions:
- issue: δοκιμή 所指是受试验的过程、试验结果，还是经验证的品格
  choice: 正文采用兼顾过程与结果的“经受考验的表现”
  alternative: “你们是否经得起考验”或“你们经考验而显出的品格”
  rationale: 原词在本句中容许“考验”与“经考验证明”的含义，不宜把它单限定为抽象品格或单纯测试，因此在正文和脚注中保留其张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“我写信”符合书信语境；“在一切事上都顺服”保留原文全面性的强调。
