  text: Ἐλθὼν δὲ εἰς τὴν Τρῳάδα εἰς τὸ εὐαγγέλιον τοῦ Χριστοῦ καὶ θύρας μοι ἀνεῳγμένης ἐν κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/012.yaml
  text: When I came to Troas for the gospel of Messiah[a], and a door had been opened for me in the Lord[b],
translation:
  language: zh_hans
  text: 我到了特罗亚，为着弥赛亚的福音[a]，并且在主里有一扇门已经为我打开了[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“基督的福音”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“并且在主里有一扇门为我敞开着。”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐλθὼν δὲ
  choice: 但我来到
  rationale: 不定过去时分词在这里交代后续叙述的时间背景；中文以“我来到”自然承接。δέ表示轻微转折或推进，结合上文译作“但”，不把它误作表示“现在”的时间副词。
- source_word: εἰς τὴν Τρῳάδα
  choice: 来到特罗亚
  rationale: εἰς加地名表示移动的终点；“来到”符合现代汉语叙事表达。
- source_word: εἰς τὸ εὐαγγέλιον τοῦ Χριστοῦ
  choice: 为了传扬弥赛亚的福音
  rationale: 第二个εἰς表示目的；汉语若直译“为了福音”语意生硬，因此以“传扬”明示语境中隐含的事奉目的。τοῦ Χριστοῦ保留属格关系，并将Χριστός按称号译为“弥赛亚”。
- source_word: θύρας
  choice: 一扇门
  rationale: 保留保罗所用的“门”这一机会隐喻，不直接释义为“机会”。
- source_word: ἀνεῳγμένης
  choice: 敞开了
  rationale: 完成时被动分词表达门已经被打开并处于敞开状态；“敞开了”兼顾既成动作和当前结果。
- source_word: ἐν κυρίῳ
  choice: 在主里
  rationale: 保留ἐν的宽泛关系和保罗惯用表达，不擅自限定为工具性的“被主”。
theological_decisions:
- issue: Χριστοῦ的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处Χριστός仍可清楚理解为受膏者的称号；译作“弥赛亚”保留其称号含义，同时以脚注提供教会传统常用译法。
- issue: ἐν κυρίῳ与开门动作的关系
  choice: 在主里有一扇门为我敞开了
  alternative: 主为我开了门
  rationale: 原文ἐν κυρίῳ并非明确的施事表达；正文保留“在主里”的关系性和神学张力，避免把语法上较宽的表达收窄为“由主打开”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句末保留逗号，因为本节希腊原文在语法和思想上延续到下一节。
