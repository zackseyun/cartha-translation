  text: καὶ ⸀ἔγραψα τοῦτο αὐτὸ ἵνα μὴ ἐλθὼν λύπην ⸀σχῶ ἀφ’ ὧν ἔδει με χαίρειν, πεποιθὼς ἐπὶ πάντας ὑμᾶς ὅτι ἡ ἐμὴ χαρὰ πάντων ὑμῶν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/003.yaml
  text: And I wrote this very thing so that, when I came, I might not have grief from those who ought to make me rejoice, because I was confident about all of you that my joy is the joy of you all.
translation:
  language: zh_hans
  text: 我写这件事，正是为了免得我来的时候，反而从那些本应使我喜乐的人那里感到忧愁[a]；我深信你们众人：我的喜乐就是你们众人的喜乐。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“从那些我本应因他们而喜乐的人那里。”
    reason: 保留ἀφ’ ὧν ἔδει με χαίρειν的原句法，以及这些人本应成为保罗喜乐来源的关系。
lexical_decisions:
- source_word: ἔγραψα
  choice: 我写
  rationale: 不定过去时在这里指保罗先前写信这一行动；汉语用“我写”自然表达，不必强加完成体标记。
- source_word: τοῦτο αὐτὸ
  choice: 这件事，正是
  rationale: αὐτό具有强调作用；用“正是”保留强调，同时使现代汉语句势自然。“这件事”也保留其所指可能联系前文内容或先前书信的空间。
- source_word: ἵνα μὴ ἐλθὼν λύπην σχῶ
  choice: 免得我来的时候……受到忧愁
  rationale: ἵνα μή表达否定目的；“免得”简洁保留目的关系。λύπην σχῶ直指经历或承受忧愁，译为“受到忧愁”兼顾形式和可懂度。
- source_word: ἀφ’ ὧν ἔδει με χαίρειν
  choice: 从那些本该使我喜乐的人那里
  rationale: 原文直译近于“从那些我本该由他们而喜乐的人那里”。正文用自然汉语表达这些人本应成为保罗喜乐的来源，并以脚注保留原句法。
- source_word: πεποιθὼς ἐπὶ πάντας ὑμᾶς
  choice: 我对你们众人有信心
  rationale: 完成时分词表达已经形成并持续的确信。另起分句可保留其与前句的联系，又不把分词与主句之间的逻辑关系过度限定为因果。
- source_word: ὅτι ἡ ἐμὴ χαρὰ πάντων ὑμῶν ἐστιν
  choice: 深知我的喜乐就是你们众人的喜乐
  rationale: ὅτι引出信心的内容。“就是”保留原文判断句的紧密等同关系；“众人”对应πάντων，避免淡化群体的完整性。
theological_decisions:
- issue: 保罗的喜乐与哥林多人喜乐之间的关系
  choice: 我的喜乐就是你们众人的喜乐
  alternative: 你们众人都以我的喜乐为喜乐
  rationale: 原文采用判断句，可能表达共同分享的喜乐，也可能强调保罗与他们的喜乐相连。正文保留其简洁而略带张力的表达，不明确加入“分享”或“以……为……”等解释。
- issue: πεποιθὼς与主句的逻辑关系
  choice: 以并列分句“我对你们众人有信心”表达
  alternative: 因为我对你们众人有信心
  rationale: 分词可带原因意味，但原文并未使用明确的因果连词。并列处理既传达保罗持久的确信，也避免把逻辑关系限定得过强。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“反而”凸显本应带来喜乐的人却可能带来忧愁的反差；“众人”两次对应原文对全体收信人的强调。脚注标记已在正文相应位置标出。
