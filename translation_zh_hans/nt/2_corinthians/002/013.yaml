  text: οὐκ ἔσχηκα ἄνεσιν τῷ πνεύματί μου τῷ μὴ εὑρεῖν με Τίτον τὸν ἀδελφόν μου, ἀλλὰ ἀποταξάμενος αὐτοῖς ἐξῆλθον εἰς Μακεδονίαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/013.yaml
  text: I had no rest in my spirit because I did not find Titus my brother[a], but after taking leave of them[c][b], I went on to Macedonia.
translation:
  language: zh_hans
  text: 我心里不得安宁，因为没有见到我的弟兄提多[a]；但我向他们告别后，就往马其顿去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我的弟兄”是说提多与保罗同为信徒，也是他的同工，并非指亲生兄弟。
    reason: cultural_note
lexical_decisions:
- source_word: οὐκ ἔσχηκα ἄνεσιν
  choice: 不得安宁
  rationale: 希腊语完成时在叙事语境中描述保罗离开前持续存在的状态；“不得安宁”自然表达内在没有安歇或舒缓，同时不过度心理化。
- source_word: τῷ πνεύματί μου
  choice: 我心里
  rationale: 这里的与格可表示领域或所涉及的方面。“我心里”是现代汉语中自然庄重的表达，保留保罗内在不安的含义；若直译“我的灵里”，容易让普通读者误解为专门的本体论论断。
- source_word: τῷ μὴ εὑρεῖν με Τίτον
  choice: 因为没有见到提多
  rationale: 带冠词的不定式短语说明不得安宁的原因。“没有见到”贴合当时未能找到、会合的语境，又不额外加入“不能”等能力含义。
- source_word: Τίτον τὸν ἀδελφόν μου
  choice: 我的弟兄提多
  rationale: 保留保罗的亲属隐喻及关系上的温情；“弟兄”在书信语境中可指同信者和同工，而非亲生兄弟，故加注说明。
- source_word: ἀποταξάμενος αὐτοῖς
  choice: 于是我向他们告别
  rationale: 该不定过去时分词表示保罗与特罗亚的人辞别后离去。“向他们告别”现代、清楚，也准确传达辞行之意。
- source_word: ἐξῆλθον εἰς Μακεδονίαν
  choice: 就往马其顿去了
  rationale: 按现代汉语行程叙述自然表达从当地出发前往马其顿；“出去到”虽较逐字，却不合汉语习惯。
theological_decisions:
- issue: πνεῦμα在此指圣灵还是保罗内在的灵
  choice: 译作“我心里”
  alternative: “我的灵里”
  rationale: 物主代词μου明确指向保罗自身；上下文重在他因未见提多而内在不安。译文不将其解释为圣灵，也不对人的构成作教义性界定。
- issue: “我的弟兄”是否指血缘兄弟
  choice: 正文保留“我的弟兄”，脚注说明为同信者和同工
  alternative: 正文直接译作“我的同工提多”
  rationale: 源文的亲属隐喻具有关系温度，不宜在正文中消解；脚注可防止现代读者误认为提多是保罗的亲生兄弟。
translation_notes:
  register: 采用现代标准汉语，语气自然、庄重而易懂。句中用分号呈现从内在不安到辞别前往马其顿的推进关系；不另设“告别”的词义脚注，因为正文已充分表达ἀποτάσσομαι的通常含义。
