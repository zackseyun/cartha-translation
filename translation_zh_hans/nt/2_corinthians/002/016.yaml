source:
  edition: SBLGNT
  text: οἷς μὲν ὀσμὴ ⸀ἐκ θανάτου εἰς θάνατον, οἷς δὲ ὀσμὴ ⸁ἐκ ζωῆς εἰς ζωήν. καὶ πρὸς ταῦτα τίς ἱκανός;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/016.yaml
  text: To the one[a], a fragrance from death to death; to the other, a fragrance from life to life[c][b]. And who is sufficient for these things?
translation:
  language: zh_hans
  text: 对一些人，是从死到死的气味[a]；对另一些人，是从生到生的气味[b]。对于这些事，谁能胜任呢？[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “气味”也可译作“香气”或“香味”；本节两处均同。
    reason: lexical_alternative
  - marker: b
    text: “从死到死”和“从生到生”可能表示来源和结果（即“出于死亡、导致死亡／出于生命、带来生命”），也可能是加强其死亡或生命性质的说法。
    reason: alternative_reading
  - marker: c
    text: “胜任”也可译作“足以承担”或“够资格”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀσμή
  choice: 气味
  rationale: “气味”是现代汉语中自然、宽泛的感官用语，本身不预设香臭，适合承载同一气味对不同人产生死亡或生命之效的对比，也避免“香气”在“从死到死”一语中造成源文没有明示的正面倾向。
- source_word: ἐκ θανάτου εἰς θάνατον
  choice: 从死到死
  rationale: 保留希腊文紧缩而对称的介词结构，不限定它究竟表示来源与结果，还是加强性质的表达。
- source_word: ἐκ ζωῆς εἰς ζωήν
  choice: 从生到生
  rationale: 与“从死到死”保持严格平行，保存原文的修辞节奏和解释空间。
- source_word: πρὸς ταῦτα
  choice: 对于这些事
  rationale: 反映复数指示词 ταῦτα，并自然表达人在这些重大事务面前是否足以承担。
- source_word: ἱκανός
  choice: 胜任
  rationale: 在现代汉语中自然表达足以承担某项使命或任务的意思，既包含能力，也包含资格与合宜性，适合此处的反问。
theological_decisions:
- issue: “从死到死”与“从生到生”的解释作用
  choice: 正文保留原文的压缩结构和歧义，不明确指定为来源至结果、性质强化或对听者产生的效果。
  alternative: 译作“出于死亡、导致死亡／出于生命、带来生命”，或“致死的／赐生命的气味”。
  rationale: 希腊文本身没有强制要求单一解释；直译式的平行表达能保存保罗刻意营造的神学张力与修辞力量。
- issue: ὀσμή 是否应译为带正面意味的“香气”
  choice: 译为中性的“气味”。
  alternative: 译为“香气”或“馨香”。
  rationale: 上下文中同一意象分别与死亡和生命相连；采用中性词可避免把气味本身先验地解释为悦人或蒙悦纳，也不引入宗派性联想。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。保留两个“从……到……”的对称句式，以再现希腊文的紧凑平行结构；末句用“谁能胜任呢”形成自然有力的反问。
