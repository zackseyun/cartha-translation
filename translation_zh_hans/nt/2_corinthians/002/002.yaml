  text: εἰ γὰρ ἐγὼ λυπῶ ὑμᾶς, καὶ ⸀τίς ὁ εὐφραίνων με εἰ μὴ ὁ λυπούμενος ἐξ ἐμοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/002.yaml
  text: For if I grieve you[a], who is there to make me glad except the one who is grieved by me?
translation:
  language: zh_hans
  text: 因为如果我使你们忧愁，那么除了被我使之忧愁的人以外，还有谁能使我欢喜呢？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被我使之忧愁的人”也可译作“因我而忧愁的人”或“因我而感到忧愁的人”；原文表达此人忧愁的来源或原因是保罗。
    reason: lexical_alternative
lexical_decisions:
- source_word: λυπῶ
  choice: 使……忧愁
  rationale: 该动词表示使人悲伤、痛苦；“使你们忧愁”自然地保留了其使动含义。
- source_word: εὐφραίνων
  choice: 使我欢喜
  rationale: 分词指给保罗带来喜乐的人；此译与前面的“使……忧愁”形成清楚而自然的对照。
- source_word: τίς ὁ εὐφραίνων με
  choice: 还有谁能使我欢喜呢
  rationale: 以现代汉语的反问句表达原文疑问结构及实体化分词的作用。
- source_word: ὁ λυπούμενος
  choice: 那……忧愁的人
  rationale: 保留现在时被动分词所描写的受忧愁者，而不改写为完成性的主动表达。
- source_word: ἐξ ἐμοῦ
  choice: 因我而
  rationale: ἐκ在此可表达来源或原因；“因我而”既自然，也保留“由于我”的因果意味。
- source_word: γὰρ
  choice: 因为
  rationale: 承接上文，表明本句是在说明保罗为何不愿再带着忧愁到他们那里去。
