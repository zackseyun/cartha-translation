base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/001.yaml
  text: 'For I decided this for myself: not to come to you again in sorrow[a].'
translation:
  language: zh_hans
  text: 因为我心里已经决定：不再带着忧愁到你们那里去[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在忧愁中”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκρινα
  choice: 作了……决定
  rationale: 这里的简单过去时表达保罗已经作出的明确决定；现代汉语用“作了决定”自然、庄重，也保留了审慎定意的意味。
- source_word: γὰρ
  choice: 因为
  rationale: γάρ承接上文并作解释；“因为”清楚呈现这一因果、说明关系。
- source_word: ἐμαυτῷ
  choice: 我自己
  rationale: 反身代词的与格强调这是保罗亲自作出的内在决定；“我自己”在现代汉语中简洁自然。
- source_word: τοῦτο
  choice: 这个
  rationale: 指示代词后指下文不定式所说明的决定内容；以冒号引出内容，既保留原文结构，又便于理解。
- source_word: τὸ μὴ ... ἐλθεῖν
  choice: 不再……去
  rationale: 冠词化不定式说明决定的具体内容；汉语用“不……去”直接自然。
- source_word: πάλιν
  choice: 再
  rationale: 表示重复；与否定词组合为“不再”，符合现代汉语习惯。
- source_word: ἐν λύπῃ
  choice: 在忧愁中
  rationale: 保留ἐν的状态性表达，并让“忧愁”究竟主要指保罗自身的状态、同行时的氛围，还是一次令人忧愁的探访保持适度开放。
- source_word: πρὸς ὑμᾶς
  choice: 到你们那里
  rationale: πρός与表示前往的动词连用，表示趋向某些人；“到你们那里”比直译“向你们”更符合汉语表达。
theological_decisions:
- issue: ἐν λύπῃ所指忧愁的主体和作用
  choice: 在忧愁中
  alternative: 带着忧愁；使你们忧愁
  rationale: 原文没有明确说明是谁忧愁，也没有直接使用使役结构。正文采用较宽泛的状态表达，不把它限定为保罗的主观情绪或他使哥林多人忧愁。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“我自己作了这个决定”保留原文的个人强调；冒号明示后文是决定的内容。正文与脚注共同保留ἐν λύπῃ的语义张力。
