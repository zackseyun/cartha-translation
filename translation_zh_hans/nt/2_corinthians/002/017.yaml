source:
  edition: SBLGNT
  text: οὐ γάρ ἐσμεν ὡς οἱ ⸀πολλοὶ καπηλεύοντες τὸν λόγον τοῦ θεοῦ, ἀλλ’ ὡς ἐξ εἰλικρινείας, ἀλλ’ ὡς ἐκ θεοῦ ⸀κατέναντι θεοῦ ἐν Χριστῷ λαλοῦμεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/017.yaml
  text: For we are not like the many[a], peddling the word of God, but as from sincerity, but as from God[f][e][d][c][b], before God we speak in Messiah.
translation:
  language: zh_hans
  text: 因为我们不像许多人[a]那样兜售[b]上帝的话；我们乃是本着真诚[c]、出于上帝，在上帝面前[d]，在弥赛亚里[e]说话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“多数人”或“许多别的人”。这里不一定是在作严格的数量统计。
    reason: lexical_alternative
  - marker: b
    text: “兜售”含有把商品拿来牟利的贬义，也可能连带有掺假、以次充好的意味。
    reason: lexical_alternative
  - marker: c
    text: 直译“出于真诚”。原文连续以两个“如同／作为”（ὡς）结构说明说话的方式或立场；可较直译为“而是如同出于真诚，而是如同出于上帝”。这里的“如同”并不表示假装真诚或假装出于上帝。
    reason: source_structure
  - marker: d
    text: 也可译作“在上帝眼前”或“在上帝的同在中”。
    reason: lexical_alternative
  - marker: e
    text: 传统译法：“在基督里”。“弥赛亚”和“基督”都表示“受膏者”。
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ πολλοί
  choice: 那许多人
  rationale: 保留带冠词短语所指的特定群体以及保罗与他们之间的鲜明对比，不把它统计化地解释为“大多数人”。
- source_word: καπηλεύοντες
  choice: 兜售
  rationale: 保留商贩叫卖、以圣言谋取私利的贬义商业意象，同时不在正文中把可能包含的掺假含义定死。
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: 上帝的话
  rationale: 直接对应属格结构，保留保罗用语的庄重性和熟悉度。
- source_word: ἐξ εἰλικρινείας
  choice: 本着真诚
  rationale: 以自然汉语表达真诚是说话的内在出发点；脚注保留更贴近介词形式的“出于真诚”。
- source_word: ἐκ θεοῦ
  choice: 出于上帝
  rationale: 保留来源含义，不擅自扩写成“受上帝差遣”。
- source_word: κατέναντι θεοῦ
  choice: 在上帝面前
  rationale: 简洁表达在上帝临在和鉴察之下说话的含义，不增加解释性内容。
- source_word: ἐν Χριστῷ
  choice: 在弥赛亚里
  rationale: 在这一保罗式关系短语中保留Χριστός的称号意义，并忠实表达ἐν所指的联合、领域或关系；脚注列出传统译法。
- source_word: λαλοῦμεν
  choice: 说话
  rationale: 直接表达一般现在时和动词本义，避免强化为原文没有明说的“宣讲”。
theological_decisions:
- issue: ἐν Χριστῷ中Χριστῷ的译法
  choice: 在弥赛亚里
  alternative: 在基督里
  rationale: Χριστός在此仍可作为“受膏者”的称号理解；采用“弥赛亚”保存称号意义，同时以脚注注明汉语传统教会常用的“基督”。
- issue: ἐκ θεοῦ所表达的事奉来源
  choice: 出于上帝
  alternative: 受上帝差遣
  rationale: 原文强调来源，但未在此明确使用“差遣”一词；因此不把可能蕴含的差遣观念写入正文。
- issue: 两个ὡς结构的处理
  choice: 本着真诚，出于上帝
  alternative: 如同出于真诚，如同出于上帝
  rationale: 希腊语ὡς在这里刻画说话者的身份、立场或方式，并非暗示其来源并不真实。正文采用自然汉语，避免“好像”造成虚假表象；脚注保留句法上的直译信息。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“那许多人”保存原文特指性的对比；分号划开反面与正面的事奉方式。“本着真诚，出于上帝”兼顾汉语流畅度和ἐξ／ἐκ的来源平行；不机械重复两个“而是”，以免现代汉语误读为后项纠正前项。所有解释性替代译法均置于脚注。
