  text: This punishment by the majority is enough for such a man,[a]
translation:
  language: zh_hans
  text: 多数人所作的这项惩处，对这样的人已经够了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“对这样的人来说，多数人所施的这项责罚已经足够了。”
    reason: 提供较贴近希腊文语序的译法，并呈现“惩处／责罚”的词汇选择。
lexical_decisions:
- source_word: ἱκανὸν
  choice: 已经够了
  rationale: 该词在句中作谓语，表示所施行的管教已达到足够程度；加入“已经”自然体现上下文中责罚已实施并已足够，但不增添终止管教以外的新含义。
- source_word: τῷ τοιούτῳ
  choice: 这样的人
  rationale: 指上下文中的某一具体犯错者。现代汉语用“这样的人”自然、清楚，也保留希腊文对该人的间接指称。
- source_word: ἐπιτιμία
  choice: 责罚
  rationale: 此处指群体所施加的纠正性处分。“责罚”既能表达实质性的惩处，也保留其管教性质；“责备”可能被理解为仅有言语批评。
- source_word: ἡ ὑπὸ τῶν πλειόνων
  choice: 受多数人所施的
  rationale: πλείονες 表示人数较多的一方，即多数人；采用被动结构衔接“这样的人受……责罚”，符合现代汉语表达，并清楚标明施行者。
