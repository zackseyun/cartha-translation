  text: ὥστε τοὐναντίον ⸀μᾶλλον ὑμᾶς χαρίσασθαι καὶ παρακαλέσαι, μή πως τῇ περισσοτέρᾳ λύπῃ καταποθῇ ὁ τοιοῦτος.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/007.yaml
  text: so that[a], on the contrary, you should rather forgive and comfort him[b], so that such a person may not be overwhelmed by excessive sorrow.
translation:
  language: zh_hans
  text: 所以，你们反倒更要饶恕他[a]，安慰他，免得这样的人被过多的忧愁吞没[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “饶恕”所译的动词也有“施恩、施惠”的含义。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“被吞下”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τοὐναντίον
  choice: 反倒
  rationale: 明确表达处置方向的逆转，现代汉语自然简洁。
- source_word: μᾶλλον
  choice: 要
  rationale: 与“反倒”合译，传达“相反，倒应当如此”的比较和劝勉语气，避免生硬重复为“更要”。
- source_word: χαρίσασθαι
  choice: 饶恕
  rationale: 在管教与恢复的语境中指施恩宽赦；“饶恕”准确而通俗，恩惠色彩在脚注说明。
- source_word: παρακαλέσαι
  choice: 安慰
  rationale: 这里的对象正承受忧愁，故取该词的安慰、慰藉义，而不限定为一般性的劝勉。
- source_word: μή πως
  choice: 免得
  rationale: 自然表达希腊文所引出的否定目的或担忧结果。
- source_word: τῇ περισσοτέρᾳ λύπῃ
  choice: 过度的忧愁
  rationale: 按语境表达忧愁超过可承受程度；比直译“更大的忧愁”更符合现代汉语，同时不夸张为绝望。
- source_word: καταποθῇ
  choice: 被……吞没
  rationale: 保留原文“吞下、吞没”的鲜明隐喻，也能自然表达被忧愁压倒。
- source_word: ὁ τοιοῦτος
  choice: 这样的人
  rationale: 保留原文概括性指称，不擅自补明身份或性别。
theological_decisions:
- issue: χαρίσασθαι所指的行动
  choice: 译为“饶恕”，指群体停止惩处并施予宽赦
  alternative: 施恩给他／赦免他
  rationale: 上下文关乎对受管教者的恢复；译文不进一步界定教会赦免与神赦免之间的神学关系。
- issue: 忧愁可能造成的结果
  choice: 保留“吞没”的被动隐喻
  alternative: 压垮／使不堪承受
  rationale: 原文描述严重危险，却未明确其最终性质；保留隐喻可避免把它解释成特定的心理或救恩结局。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“反倒要”承接上一节形成鲜明转折；“饶恕他，安慰他”保持两个并列不定式的紧凑结构；主文保留“吞没”这一原文隐喻。
