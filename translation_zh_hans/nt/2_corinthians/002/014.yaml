    issue: “认识他的香气”属格结构在汉语中不够清楚。
    rationale: γνῶσις αὐτοῦ是“对他的认识”，并由此与“香气”构成比喻性关联；原译虽逐字对应，却不符合自然现代汉语的修饰关系。
  - severity: medium
    issue: 脚注a增添“把我们押在凯旋的行列中”。
    rationale: θριαμβεύω的替代理解可译为“胜过我们”，但“押送”为对凯旋图像及其对象的进一步解释。该细节在此有争议，不宜在脚注中当作确定译文加入。
  - severity: low
