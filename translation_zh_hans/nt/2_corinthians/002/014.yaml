  to: 但感谢上帝！他常常在弥赛亚里带领我们在凯旋的行列中前行[a]，又借着我们在各处显明对他的认识所散发的香气[b]。
  rationale: 修订仅改善汉语的属格表达和行文流畅度。“对他的认识所散发的香气”清楚表达“知识／认识”与“香气”的原文比喻关联，仍以“他”保留αὐτοῦ可指上帝或按近处语境理解为弥赛亚的讨论空间。脚注a删去未由原文语义本身确定的“押送”细节，保留审校轨迹要求的替代读法。
