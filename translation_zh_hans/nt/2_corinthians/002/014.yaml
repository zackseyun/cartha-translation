  text: Τῷ δὲ θεῷ χάρις τῷ πάντοτε θριαμβεύοντι ἡμᾶς ἐν τῷ Χριστῷ καὶ τὴν ὀσμὴν τῆς γνώσεως αὐτοῦ φανεροῦντι δι’ ἡμῶν ἐν παντὶ τόπῳ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/014.yaml
  text: But thanks be to God[b][a], who always leads us in triumphal procession in the Messiah and makes the fragrance of the knowledge of him known through us in every place.
translation:
  language: zh_hans
  text: 但感谢上帝！他常常在弥赛亚里带领我们在凯旋的行列中前行[a]，又借着我们在各处显明对他的认识所散发的香气[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他常常在弥赛亚里胜过我们。”
    reason: alternative_reading
  - marker: b
    text: “香气”也可译作“气味”。
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: 感谢
  rationale: 在“Τῷ δὲ θεῷ χάρις”这一固定感恩表达中，用“感谢上帝”自然传达颂赞和感恩的语气。
- source_word: θριαμβεύοντι
  choice: 带领我们走在凯旋的行列中
  rationale: 保留罗马凯旋行列的具体意象，并维持ἡμᾶς作动词宾语；该词也可能表示“胜过并押着”，故在脚注保留另一理解。
- source_word: ἐν τῷ Χριστῷ
  choice: 在弥赛亚里
  rationale: 此处Χριστός具有称号意味；“在……里”保留与弥赛亚联合或处于其范围之内的表达。
- source_word: ὀσμὴν
  choice: 香气
  rationale: 上下文中的比喻偏向正面，用“香气”自然且清楚；原词本身也可泛指“气味”，故列入脚注。
- source_word: γνώσεως
  choice: 认识
  rationale: “认识他”比抽象的“关于他的知识”更符合现代汉语，同时保留关系性认识的可能含义。
- source_word: φανεροῦντι
  choice: 显明
  rationale: 贴近“使显现、使人察觉”的使动含义，也与香气被散发、被察觉的比喻相称。
- source_word: δι’ ἡμῶν
  choice: 借着我们
  rationale: 准确表达διά加属格所表示的媒介或工具。
- source_word: ἐν παντὶ τόπῳ
  choice: 在各处
  rationale: 以自然简洁的现代汉语表达“在每一个地方”，保留广泛传播的重点。
theological_decisions:
- issue: θριαμβεύω以ἡμᾶς为宾语时的含义
  choice: 上帝带领我们走在弥赛亚里的凯旋行列中
  alternative: 上帝在弥赛亚里胜过我们，把我们作为俘虏押在凯旋行列中
  rationale: 正文保留凯旋行列的鲜明图景，并与后面的香气意象连贯；但该动词可能描绘得胜者胜过并押送俘虏，因此用脚注保留这一更尖锐的含义，不消除其神学张力。
- issue: “认识他的香气”中αὐτοῦ的所指
  choice: 理解为对上帝的认识
  alternative: 可由近处的“弥赛亚”理解为对弥赛亚的认识
  rationale: 语法上代词可能引发指代讨论；本句的主语和施事者是上帝，按语流较自然地指对上帝的认识，但译文仅用“他”，不在正文中强行消除可能的指代张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“凯旋的行列”保留古代胜利游行的历史意象；“认识他的香气”有意保留原文浓缩的属格结构和比喻张力。所有脚注标记均置于正文相应位置。
