  text: ἵνα μὴ πλεονεκτηθῶμεν ὑπὸ τοῦ Σατανᾶ, οὐ γὰρ αὐτοῦ τὰ νοήματα ἀγνοοῦμεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/011.yaml
  text: so that we would not be outwitted by Satan[b][a], for we are not ignorant of his schemes.
translation:
  language: zh_hans
  text: 免得撒但占我们的便宜[a]，因为我们并非不知道他的计谋[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“利用我们”“从我们身上得利”。
    reason: lexical_alternative
  - marker: b
    text: 或译“意图”“心思”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα μή
  choice: 免得
  rationale: 以自然简洁的现代汉语表达否定目的，同时保留本句承接上文的前瞻作用。
- source_word: πλεονεκτηθῶμεν
  choice: 占我们的便宜
  rationale: 该词的被动形式指遭人占便宜、利用或侵害；此译法比单纯译作“胜过”更清楚，也不把含义限缩为智力上的欺骗。
- source_word: Σατανᾶ
  choice: 撒但
  rationale: 按现代中文圣经传统音译此专名。
- source_word: γάρ
  choice: 因为
  rationale: 引出前一分句所述目的能够实现的理由，现代汉语中以“因为”表达最自然。
- source_word: νοήματα
  choice: 计谋
  rationale: 该词可指思想、意图或谋划；在此语境中带有敌对而有策略的意味，“计谋”能体现这一点。
- source_word: οὐ…ἀγνοοῦμεν
  choice: 我们并非不知道
  rationale: 保留原文以否定方式表达“知道”的措辞和强调，同时符合庄重而自然的现代汉语。
theological_decisions:
- issue: 撒但的 νοήματα 是一般“思想”还是敌对“计谋”
  choice: 计谋
  alternative: 意图／心思
  rationale: 上下文谈到撒但可能借机占便宜，因此“计谋”最贴合语境；脚注保留该词较宽的语义范围，避免断言每次用法都必然指阴谋。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“免得”紧密承接上文；后半句略作话题前置（“他的计谋，我们……”），既保留原文宾语前置所带的强调，也不致生硬。
