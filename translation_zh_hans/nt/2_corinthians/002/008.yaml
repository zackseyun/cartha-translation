  yaml_path: translation/nt/2_corinthians/002/008.yaml
  text: Therefore I urge you to confirm your love for him.
translation:
  language: zh_hans
  text: 因此，我劝你们向他明确表示你们的爱。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διό
  choice: 因此
  rationale: 承接上文所述的宽恕与安慰，表达明确的因果推论。
- source_word: παρακαλῶ
  choice: 我劝你们
  rationale: 在此表示恳切劝勉；“劝”自然传达语气，又不强化为命令。
- source_word: κυρῶσαι
  choice: 确认
  rationale: 该词有认可、核准、使之生效之意；“确认”保留正式认可并以行动落实的意味，也与原文及审定后的英文咨询文本相符。
- source_word: εἰς αὐτὸν ἀγάπην
  choice: 你们对他的爱
  rationale: 自然表达爱所指向的对象，不额外限定这种爱应以何种具体方式表现。
theological_decisions:
- issue: 教会对受管教者恢复接纳的表达
  choice: 保留“确认”这一正式而开放的措辞
  alternative: 译作“重新表明”或“证实”你们对他的爱
  rationale: 原文要求群体使其爱获得明确认可或落实，但没有明说必须公开宣告，也未明确表示此前的爱已经中断，因此不增添这些解释。
translation_notes:
  register: 采用简洁、庄重而自然的现代普通话。“你们”保留复数群体指向；不加脚注，因为本节的词义可在正文中充分表达。
