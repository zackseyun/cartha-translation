  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐκ γὰρ πολλῆς θλίψεως καὶ συνοχῆς καρδίας ἔγραψα ὑμῖν διὰ πολλῶν δακρύων, οὐχ ἵνα λυπηθῆτε, ἀλλὰ τὴν ἀγάπην ἵνα γνῶτε ἣν ἔχω περισσοτέρως εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/004.yaml
  text: For out of much affliction and anguish of heart I wrote to you through many tears[a], not so that you might be grieved[b], but so that you might know the love that I have especially for you.
translation:
  language: zh_hans
  text: 我给你们写信，是出于极大的患难和内心的煎熬，流了许多眼泪；不是要使你们忧伤，而是要让你们知道，我对你们的爱格外深厚[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “格外深厚”也可译作“更加丰盛”；原文可表示程度特别深，也可带有比较意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ
  choice: 出于
  rationale: 表示写信的内在缘由或源头，保留保罗的文字源自其痛苦处境这一含义。
- source_word: πολλῆς θλίψεως
  choice: 极大的患难
  rationale: πολλῆς在此加强程度；“患难”既可涵盖外在压力，也不把含义局限为某一种迫害。
- source_word: συνοχῆς καρδίας
  choice: 内心的煎熬
  rationale: 表达心被压迫、紧缩的强烈内在痛苦；“煎熬”在现代汉语中自然且有足够力度。
- source_word: ἔγραψα ὑμῖν
  choice: 我给你们写信
  rationale: 采用自然汉语语序，不额外加入“先前”，以免把上下文推断写入动词本身。
- source_word: διὰ πολλῶν δακρύων
  choice: 流了许多眼泪
  rationale: 传达写信伴随着大量眼泪；比逐字译为“经过许多眼泪”更符合现代汉语。
- source_word: λυπηθῆτε
  choice: 使你们忧伤
  rationale: 在使役结构中自然表达被动虚拟式的结果，即收信人因这封信而忧伤。
- source_word: ἀγάπην
  choice: 爱
  rationale: 采用ἀγάπη在本项目中的常规译法。
- source_word: γνῶτε
  choice: 知道
  rationale: 保留目的从句，可涵盖认识、体会或更充分意识到这份爱。
- source_word: περισσοτέρως εἰς ὑμᾶς
  choice: 对你们的爱格外深厚
  rationale: 以自然汉语表达程度加强，同时用脚注保留该副词可能具有的比较意味。
theological_decisions:
- issue: περισσοτέρως的比较或加强语气
  choice: 格外深厚
  alternative: 更加丰盛／更多
  rationale: 原文既可能强调保罗对哥林多人之爱的非同寻常程度，也可能保留“更多”的比较意味；正文采用自然的程度表达，脚注保存比较性可能。
translation_notes:
  register: 采用庄重而现代的书面汉语。“内心的煎熬”保留情感强度，“流了许多眼泪”清楚呈现写信时的状态；分号对应原文由否定目的转向正面目的的结构。
