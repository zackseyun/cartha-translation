  text: οὐ γὰρ ἄλλα γράφομεν ὑμῖν ἀλλ’ ἢ ἃ ἀναγινώσκετε ἢ καὶ ἐπιγινώσκετε, ἐλπίζω δὲ ⸀ὅτι ἕως τέλους ἐπιγνώσεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/013.yaml
  text: For we are not writing anything else to you except what you read and indeed understand[a], and I hope that you will understand fully to the end,
translation:
  language: zh_hans
  text: 因为我们写给你们的，除了你们所读、也明白的以外，没有别的；而我盼望你们会明白到底[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“完全明白”；按字面可译作“明白到末了”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα
  choice: 别的
  rationale: 中性复数在否定句中可自然译作“别的”，表示保罗所写的并无另一层不同内容。
- source_word: ἀναγινώσκετε
  choice: 你们所读
  rationale: 保留动词“读”的直接含义，并以“所”字结构自然衔接后文。
- source_word: ἐπιγινώσκετε
  choice: 也所明白
  rationale: 本语境侧重读者对所读内容的领会；“明白”比“认出”更符合现代汉语。καί译作“也”，保留阅读与理解之间的并列递进。
- source_word: ἐπιγνώσεσθε
  choice: 会明白
  rationale: 未来时译作“会明白”，与前面的现在时形成时间上的推进，同时保持与同一词根前一用例的对应。
- source_word: ἕως τέλους
  choice: 到底
  rationale: “到底”自然保留“直到终点／末了”的时间性，也容许“彻底、完全”的程度含义，不强行消除原文可能的双重意味。
- source_word: οὐ γὰρ ... ἀλλ’ ἢ
  choice: 因为……并没有别的，无非是
  rationale: 这一结构排除任何不同或隐藏的书面信息；“并没有别的，无非是”既传达限定性，也符合庄重的现代汉语。
theological_decisions:
- issue: ἕως τέλους是时间意义还是程度意义
  choice: 译作“到底”，保留时间与完全程度两种可能
  alternative: “完全明白”或“明白到末了”
  rationale: 原短语字面为“直到终点／末了”，在语境中也可能表示完全。正文采用可兼容两义的表达，脚注说明替代译法，避免把歧义单方面定为某一种。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准普通话。“无非是”准确表达排他结构；“明白到底”稍具书面色彩，但能紧凑保留原文ἕως τέλους在时间和程度上的张力。句末逗号保留本节与下一节在句法上的连续性。
