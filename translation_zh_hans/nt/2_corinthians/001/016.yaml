  text: καὶ δι’ ὑμῶν διελθεῖν εἰς Μακεδονίαν, καὶ πάλιν ἀπὸ Μακεδονίας ἐλθεῖν πρὸς ὑμᾶς καὶ ὑφ’ ὑμῶν προπεμφθῆναι εἰς τὴν Ἰουδαίαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/016.yaml
  text: and through you to pass into Macedonia[a], and again from Macedonia to come to you and by you to be sent on to Judea.
translation:
  language: zh_hans
  text: 也要从你们那里经过，前往马其顿；再从马其顿到你们这里来，然后由你们为我送行，前往犹太地。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为我送行”也可译作“帮助我继续前往犹太地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ ὑμῶν
  choice: 从你们那里经过
  rationale: διά加属格在行程语境中表示途经哥林多人所在之处；此译自然地保留路线含义。
- source_word: διελθεῖν εἰς Μακεδονίαν
  choice: 经过，前往马其顿
  rationale: διέρχομαι表示经过或继续行程，εἰς标明目的地；这样既体现途经，又符合现代汉语旅行表达。
- source_word: πάλιν ἀπὸ Μακεδονίας ἐλθεῖν πρὸς ὑμᾶς
  choice: 再从马其顿到你们这里来
  rationale: πάλιν标明随后再次到访，ἀπό表示出发地，πρός表示来到他们那里；不额外加入原文未明说的“回来”。
- source_word: ὑφ’ ὑμῶν προπεμφθῆναι
  choice: 好让你们为我送行
  rationale: ὑπό加属格表示行动者；προπέμπω在旅行语境中通常指为旅人送行，并可包含供应、陪送等实际帮助。“为我送行”准确而自然，同时避免把具体帮助方式固定下来。
- source_word: εἰς τὴν Ἰουδαίαν
  choice: 前往犹太地
  rationale: εἰς表示行程目的地；“前往犹太地”符合现代汉语，并清楚连接保罗后续的旅程。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“马其顿”“犹太地”沿用常见圣经地名译法；用分号呈现先去马其顿、再到哥林多的两段行程。脚注标记置于整句末尾，对“送行”的旅行语境含义作说明。
