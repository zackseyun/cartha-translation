  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἀλλὰ αὐτοὶ ἐν ἑαυτοῖς τὸ ἀπόκριμα τοῦ θανάτου ἐσχήκαμεν, ἵνα μὴ πεποιθότες ὦμεν ἐφ’ ἑαυτοῖς ἀλλ’ ἐπὶ τῷ θεῷ τῷ ἐγείροντι τοὺς νεκρούς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/009.yaml
  text: Indeed[a], we ourselves had the sentence of death within ourselves, so that we would not rely on ourselves but on God, who raises the dead.
translation:
  language: zh_hans
  text: 其实，我们自己心里已经有了必死的判决[a]，为要使我们不倚靠自己，只倚靠那使死人复活的上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“死刑判决”。
    reason: ἀπόκριμα τοῦ θανάτου 可理解为司法意义较强的“死刑判决”，也可较自然地表达为认定自己“必死”的裁断。
lexical_decisions:
- source_word: ἀλλὰ
  choice: 其实
  rationale: 承接上文并加强语气，表明保罗的处境不只是几乎绝望，内心甚至已认定必死；“其实”在现代汉语中自然地传达这里强烈的转折和递进作用。
- source_word: αὐτοὶ ἐν ἑαυτοῖς
  choice: 我们自己心里
  rationale: “自己”保留 αὐτοί 的强调，“心里”自然表达 ἐν ἑαυτοῖς 所指的内在判断，同时避免生硬的“在我们自己里面”。
- source_word: τὸ ἀπόκριμα τοῦ θανάτου
  choice: 必死的判决
  rationale: ἀπόκριμα 在本语境中指决定性的裁断或判决；“必死的判决”保留司法意象，也表达死亡仿佛已经确定。
- source_word: ἐσχήκαμεν
  choice: 已经有了
  rationale: 直译动词“有”，并以“已经”体现完成时所表达的既成、持续状态；不增添原文没有明说的“领受”。
- source_word: ἵνα μὴ πεποιθότες ὦμεν
  choice: 为要使我们不倚靠
  rationale: “为要使”保留 ἵνα 的目的意味；“倚靠”自然表达 πεποιθότες 在这里所指的信赖和依凭。
- source_word: ἐφ’ ἑαυτοῖς ἀλλ’ ἐπὶ τῷ θεῷ
  choice: 不倚靠自己，只倚靠……上帝
  rationale: 以重复“倚靠”清楚呈现两个介词短语的平行对照；“只”自然传达 ἀλλά 的排他性转折。
- source_word: τῷ ἐγείροντι τοὺς νεκρούς
  choice: 那使死人复活的上帝
  rationale: 准确表达上帝使死者起来的能力；“使死人复活”是自然、清楚且庄重的现代汉语，不把复活仅限于当前这次脱险。
theological_decisions:
- issue: “使死人复活”是否应弱化为比喻性的“救人脱离死亡”
  choice: 保留“那使死人复活的上帝”
  alternative: 那救人脱离死亡的上帝
  rationale: 原文明确说上帝“使死人起来”，既能联系保罗当前绝境，也具有真实复活的神学张力；不应把它缩减为仅指脱险。
- issue: ἵνα 所表达的是目的还是单纯结果
  choice: 为要使
  alternative: 结果使得
  rationale: ἵνα 通常表达目的，这里可理解为苦难及其内在判决所具有的神圣目的；译文保留目的表达，同时不额外说明是谁作出或安排这一目的。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我们自己心里”保留原文强调而不显生硬；“必死的判决”维持司法意象及死亡已成定局的语感。脚注标记紧跟其所说明的词组。
