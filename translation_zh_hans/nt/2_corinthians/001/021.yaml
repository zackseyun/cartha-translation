id: 2CO.1.21
reference: 2 Corinthians 1:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ δὲ βεβαιῶν ἡμᾶς σὺν ὑμῖν εἰς Χριστὸν καὶ χρίσας ἡμᾶς θεός,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/021.yaml
  text: But the one who establishes us with you in Messiah[a], and who anointed us, is God.
translation:
  language: zh_hans
  text: 然而，那使我们和你们一同在弥赛亚[a]里坚定，又膏抹了我们的，就是上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“基督”。希腊语称号Christos意为“受膏者”，这里译作“弥赛亚”。
    reason: 提供传统称号译法，并说明原文称号的含义。
lexical_decisions:
- source_word: βεβαιῶν
  choice: 使……坚定
  rationale: 表示使人稳固、坚立；译文保留现在分词所表达的持续作用，同时符合现代汉语表达。
- source_word: σὺν ὑμῖν
  choice: 和你们一同
  rationale: 明确表达保罗一方与哥林多信徒共同蒙受上帝坚固，而非只指其中一方。
- source_word: εἰς Χριστόν
  choice: 在弥赛亚里
  rationale: εἰς本有朝向或进入之意，但在此保罗语境中主要表达与弥赛亚联合、归属他的关系；“在……里”自然地传达这一含义，又不把具体机制说死。
- source_word: χρίσας
  choice: 膏抹了
  rationale: 保留χρίω“膏抹”的核心意象，也呼应Χριστός所含“受膏者”的意义；不擅自限定为某种特定仪式或职分。
- source_word: θεός
  choice: 上帝
  rationale: 保留希腊文句末揭示并强调施行者是上帝的结构，以“就是上帝”自然完成汉语判断句。
- source_word: Χριστόν
  choice: 弥赛亚
  rationale: 此处作为称号，译作“弥赛亚”可显明“受膏者”的称号含义；脚注提供传统译名“基督”。
- source_word: δέ
  choice: 然而
  rationale: 承接上文并带轻微转折；“然而”在此庄重而清楚。
theological_decisions:
- issue: εἰς Χριστόν中εἰς的语义
  choice: 按关系与联合意义译为“在弥赛亚里”
  alternative: 较字面的“进入弥赛亚”或带方向性的“归向弥赛亚”
  rationale: 直译“进入”在现代汉语中生硬，也可能不必要地限定为某一时点或礼仪；“在……里”传达保罗式的归属与联合，同时保留经文本身的神学张力。
- issue: χρίσας的神学范围
  choice: 译为“膏抹了”，不补充具体目的或职分
  alternative: “分别为圣”或“委任”
  rationale: 原文没有说明膏抹的具体方式、职分或目的；保留膏抹意象可避免加入经文未明说的解释。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“使……坚定”避免过度古雅；“膏抹”保留关键原文意象。句末“就是上帝”对应原文将θεός置后的强调。
