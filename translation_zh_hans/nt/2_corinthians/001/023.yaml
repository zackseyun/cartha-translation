  text: Ἐγὼ δὲ μάρτυρα τὸν θεὸν ἐπικαλοῦμαι ἐπὶ τὴν ἐμὴν ψυχήν, ὅτι φειδόμενος ὑμῶν οὐκέτι ἦλθον εἰς Κόρινθον.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/023.yaml
  text: But I call God as witness upon my own life[b][a], that to spare you I did not come again to Corinth.
translation:
  language: zh_hans
  text: 但我以自己的性命为凭，呼求上帝作证：我没有再到哥林多去，是为了顾惜你们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以自己的性命为凭”直译为“在我的性命之上”，也可理解为“针对我自己”；这是郑重的誓言用语，表示若所言不实，后果由自己承担。“没有再到”也可译作“不再到”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγὼ δὲ
  choice: 但我要
  rationale: 保留δέ所表达的轻微转折和ἐγώ的第一人称强调；“但我要”在现代汉语中自然，并引出郑重宣告。
- source_word: μάρτυρα τὸν θεὸν ἐπικαλοῦμαι
  choice: 呼求上帝作证
  rationale: 准确传达带有誓言和法庭色彩的表达，即请上帝为保罗所言的真实性作证。
- source_word: ἐπὶ τὴν ἐμὴν ψυχήν
  choice: 以自己的性命为凭
  rationale: ψυχή在此指保罗自己的生命；整个短语表达他以自身承担虚假誓言后果的郑重呼求。“为凭”既自然，也保留誓言性质。
- source_word: ὅτι
  choice: ：
  rationale: 此处引出呼求上帝作证的具体内容；中文用冒号比直译“即”或“因为”更自然清楚。
- source_word: φειδόμενος ὑμῶν
  choice: 是为了宽容你们
  rationale: 分词说明保罗没有前往的动机。“宽容”保留φείδομαι不严厉对待、使人免受责罚或痛苦的含义，不将其弱化为一般性的“体谅”。
- source_word: οὐκέτι ἦλθον
  choice: 没有再……去
  rationale: 在上下文中指没有按计划再次前往；同时为οὐκέτι在此可能表示“不再/不再继续”保留脚注说明。
- source_word: εἰς Κόρινθον
  choice: 到哥林多去
  rationale: 符合现代汉语表达前往城市的习惯。
theological_decisions:
- issue: 保罗呼求上帝作证时，ἐπὶ τὴν ἐμὴν ψυχήν所表达的责任指向
  choice: 以自己的性命为凭
  alternative: 针对我自己／以我的灵魂为凭
  rationale: 正文既表达誓言以自身生命作保，也不把ψυχή限定为与身体对立的非物质“灵魂”；脚注保留更贴近字面的表达及责任落在保罗自身这一层含义。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。将郑重誓言置于句首，并用冒号清楚引出其内容；避免把ψυχή机械译成容易引发身心二分联想的“灵魂”。
