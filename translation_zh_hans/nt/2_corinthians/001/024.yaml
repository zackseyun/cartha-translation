id: 2CO.1.24
reference: 2 Corinthians 1:24
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οὐχ ὅτι κυριεύομεν ὑμῶν τῆς πίστεως, ἀλλὰ συνεργοί ἐσμεν τῆς χαρᾶς ὑμῶν, τῇ γὰρ πίστει ἑστήκατε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/024.yaml
  text: Not that we lord it over your faith[a], but we are fellow workers for your joy[c][b], for you stand firm by faith.
translation:
  language: zh_hans
  text: 这并不是说，我们要辖制你们的信心[a]；相反，我们是为你们的喜乐而同工[b]，因为你们凭着信心站立得稳[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “信心”也可译作“信靠”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“我们是为你们的喜乐共同作工的人。”原文没有明说与谁同工。
    reason: ambiguity
  - marker: c
    text: “凭着信心站立得稳”也可译作“在信心中站立得稳”。
    reason: alternative_reading
lexical_decisions:
- source_word: κυριεύομεν
  choice: 辖制
  rationale: 该动词表示施行主权或支配；在否定语境中，“辖制”自然传达凌驾、掌控之意，同时保持庄重。
- source_word: ὑμῶν τῆς πίστεως
  choice: 你们的信心
  rationale: 属格结构自然表达为“你们的信心”。πίστις 在这里指哥林多信徒所持的信靠立场。
- source_word: συνεργοί
  choice: 一同作工
  rationale: 该词强调保罗一行与哥林多人共同劳作，而非居于他们之上；“一同作工”在现代中文中清楚且符合书信语体。
- source_word: τῆς χαρᾶς ὑμῶν
  choice: 为使你们喜乐
  rationale: 属格可表达共同工作的目标或所关切的事；此译自然呈现他们的工作以哥林多人的喜乐为目的。
- source_word: τῇ γὰρ πίστει
  choice: 凭着信心
  rationale: 此处与格最自然地表示凭借或基础；“凭着信心”保留这种工具性或根据性的理解。
- source_word: ἑστήκατε
  choice: 站立得稳
  rationale: 完成时表达已经站立并持续处于稳固状态；“站立得稳”自然体现其结果和持续性。
theological_decisions:
- issue: 两处 πίστις 的含义
  choice: 信心
  alternative: 信靠；忠信
  rationale: 上下文谈到哥林多人所持守并赖以站稳的相信与信靠，并非明确指忠信这一品质；两处统一译为“信心”也保留保罗论述的衔接。
- issue: συνεργοί 与 τῆς χαρᾶς ὑμῶν 的关系
  choice: 我们与他们一同作工，以他们的喜乐为目标
  alternative: 我们是他们喜乐的同工；我们是上帝的同工，为他们的喜乐作工
  rationale: 原文没有明说共同工作的另一方是谁，且属格关系有一定弹性。正文采用中文中最顺畅的目标性表达，但不把未明说的神学对象加入正文。
- issue: τῇ πίστει 的与格功能
  choice: 凭着信心（方式或基础）
  alternative: 在信心中
  rationale: 与格可理解为方式、基础或范围。正文采用较自然的“凭着”，脚注保留范围性理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“这并不是说……相反……”清楚呈现 οὐχ ὅτι…ἀλλά 的转折；避免使用带明显古典色彩的“作你们信心的主”，也不补入原文未明说的同工对象。所有脚注标记均置于相关短语之后。
