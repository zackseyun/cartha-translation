id: 2CO.1.8
reference: 2 Corinthians 1:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Οὐ γὰρ θέλομεν ὑμᾶς ἀγνοεῖν, ἀδελφοί, ⸀ὑπὲρ τῆς θλίψεως ἡμῶν τῆς ⸀γενομένης ἐν τῇ Ἀσίᾳ, ὅτι καθ’ ὑπερβολὴν ⸂ὑπὲρ δύναμιν ἐβαρήθημεν⸃, ὥστε ἐξαπορηθῆναι ἡμᾶς καὶ τοῦ ζῆν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/008.yaml
  text: For we do not want you to be unaware[a], brothers, about our affliction that happened in Asia, that we were burdened exceedingly, beyond our strength[c][b], so that we despaired even of life.
translation:
  language: zh_hans
  text: 弟兄们[a]，我们不愿你们不知道我们在亚细亚[b]所遭遇的患难：我们所承受的压力极其沉重，超过了我们的力量，以致我们甚至对活下去也绝望了。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄们”所译的希腊语是阳性复数；在这里，保罗很可能以此称呼整个信徒群体，包括其中的女性。
    reason: cultural_note
  - marker: b
    text: “亚细亚”指罗马帝国在小亚细亚西部的亚细亚行省，并非现代所说的亚洲大陆。
    reason: cultural_note
  - marker: c
    text: “对活下去也绝望了”也可译作“连活命的希望也没有了”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ γὰρ θέλομεν ὑμᾶς ἀγνοεῖν
  choice: 我们不愿你们不知道
  rationale: 以现代汉语自然表达保罗的意愿，并保留“不愿……不知道”这一书信中引出重要信息的句式。γάρ承接上文的解释作用在本节独立呈现时不宜生硬译作“因为”。
- source_word: ἀδελφοί
  choice: 弟兄们
  rationale: 保留希腊语阳性复数称呼的形式；其在语境中可能涵盖整个信徒群体，另以脚注说明。
- source_word: ὑπὲρ τῆς θλίψεως ἡμῶν
  choice: 我们……所遭遇的患难
  rationale: θλῖψις表示压迫、困苦或患难；“患难”庄重而通俗，也与下文受重压的意象相呼应。
- source_word: τῆς γενομένης ἐν τῇ Ἀσίᾳ
  choice: 在亚细亚所遭遇的
  rationale: 将分词结构自然地嵌入汉语定语，同时不补入原文未明说的具体事件。
- source_word: καθ’ ὑπερβολὴν ὑπὲρ δύναμιν ἐβαρήθημεν
  choice: 我们所受的重压极其沉重，超过了我们的力量
  rationale: 保留ἐβαρήθημεν的负重意象，并分别表达καθ’ ὑπερβολὴν的强烈程度和ὑπὲρ δύναμιν超出承受能力之意。
- source_word: ὥστε ἐξαπορηθῆναι ἡμᾶς καὶ τοῦ ζῆν
  choice: 以致我们甚至对活下去也绝望了
  rationale: ὥστε表达结果；ἐξαπορέομαι在此指陷入彻底无望，τοῦ ζῆν则具体指活着或继续活下去。
theological_decisions:
- issue: 书信称呼ἀδελφοί的性别与涵盖范围
  choice: 正文译作“弟兄们”，脚注说明可能包括全体信徒
  alternative: 弟兄姊妹们
  rationale: 原词在语法形式上为阳性复数；正文保留这一形式，同时不否认它在当时书信语境中可作为对男女信徒共同体的统称。
- issue: 保罗“对活下去也绝望了”的陈述
  choice: 保留其强烈、直接的绝望表述
  alternative: 弱化为“几乎失去了活下去的希望”
  rationale: ἐξαπορηθῆναι语气强烈，原文没有“几乎”；译文不因神学预设而减弱保罗所述患难的极端程度。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“遭遇的患难”“所受的重压”兼顾汉语流畅度与原文压力、负重的意象；避免古奥表达，也不补明保罗在亚细亚所遭遇之患难的具体性质。
