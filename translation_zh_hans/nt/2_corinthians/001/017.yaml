  text: τοῦτο οὖν ⸀βουλόμενος μήτι ἄρα τῇ ἐλαφρίᾳ ἐχρησάμην; ἢ ἃ βουλεύομαι κατὰ σάρκα βουλεύομαι, ἵνα ᾖ παρ’ ἐμοὶ τὸ Ναὶ ναὶ καὶ τὸ Οὒ οὔ;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/017.yaml
  text: So when I intended this[a], was I acting lightly? Or do I plan what I plan according to the flesh, so that with me there should be both “Yes, yes” and “No[d][c][b], no”?
translation:
  language: zh_hans
  text: 那么，我有这个打算时，难道是出于反复无常吗？还是说，我所筹划的事，是按着肉体来筹划的吗，以致在我这里有“是，是”，又有“不，不”？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “按着肉体”在这里可以指按纯属人的或世俗的标准来筹划。“有‘是，是’，又有‘不，不’”可能是指前后反复，也可能是指仿佛肯定和否定都能同时成立。
    reason: lexical_and_cultural_note
lexical_decisions:
- source_word: βουλόμενος
  choice: 原有这个打算
  rationale: 分词承接上文保罗原先的行程安排；“打算”自然表达意愿与计划，又不把它说成已经作出的正式决定。
- source_word: τῇ ἐλαφρίᾳ ἐχρησάμην
  choice: 出于反复无常
  rationale: 该搭配指行事轻率或心意不定；本节针对的是保罗是否随意更改计划，“反复无常”在现代汉语中准确传达这种指控。
- source_word: ἃ βουλεύομαι ... βουλεύομαι
  choice: 我所作的打算……作的
  rationale: 适度保留希腊文的词语重复，以呈现反问中的强调，同时避免生硬直译。
- source_word: κατὰ σάρκα
  choice: 顺着肉体
  rationale: 保留保罗用语“肉体”的开放性及神学张力，不在正文中提前限定为“按世俗标准”或“凭人的私意”。
- source_word: παρ’ ἐμοὶ
  choice: 我这里
  rationale: 自然表达某种言行出现在保罗这一方或成为其作风，并与后面的并列说法顺畅衔接。
- source_word: τὸ Ναὶ ναὶ καὶ τὸ Οὒ οὔ
  choice: 既是“是，是”，又是“不，不”
  rationale: 保留原文肯定与否定各自的重复，也保留二者并列所造成的暧昧：既可能指前后不一，也可能指让肯定和否定同时成立。
theological_decisions:
- issue: κατὰ σάρκα 中 σάρξ 的译法
  choice: 顺着肉体
  alternative: 按人的标准；以世俗的方式
  rationale: 此处虽可能指仅凭人的、世俗的考虑来计划，但直译“肉体”能保留保罗词汇的神学关联和语义张力；解释性读法适合放入注释。
- issue: “是，是”与“不，不”的关系
  choice: 保留并列形式，不在正文中解释
  alternative: 一会儿说“是”，一会儿说“不”；让“是”和“不”同时成立
  rationale: 原文可以使人想到摇摆反复，也可强调相互矛盾的肯定与否定并存；正文不应替读者排除其中一种理解。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。两个反问句保持原文推进方式；保留“肉体”以及“是，是／不，不”的重复，并用一则脚注说明而不消解原文的含混。
