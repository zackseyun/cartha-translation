reference: 2 Corinthians 1:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἴτε δὲ θλιβόμεθα, ὑπὲρ τῆς ὑμῶν παρακλήσεως καὶ σωτηρίας· ⸂εἴτε παρακαλούμεθα, ὑπὲρ τῆς ὑμῶν παρακλήσεως⸃ τῆς ἐνεργουμένης ἐν ὑπομονῇ τῶν αὐτῶν παθημάτων ὧν καὶ ἡμεῖς πάσχομεν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/006.yaml
  text: But if we are afflicted[a], it is for your comfort and salvation; or if we are comforted, it is for your comfort[b], which is at work in enduring the same sufferings that we also suffer.
translation:
  language: zh_hans
  text: 我们若受患难，是为了使你们得安慰、得救；我们若得安慰，也是为了使你们得安慰[a][b]。这安慰在你们忍耐承受我们也同样遭受的苦难时发挥功效。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本没有“我们若得安慰，也是为了使你们得安慰”这句话。
    reason: textual_variant
  - marker: b
    text: 本节的“安慰”也可译作“鼓励”。
    reason: lexical_alternative
lexical_decisions:
- source_word: θλιβόμεθα
  choice: 受患难
  rationale: 现在时被动语态表达持续承受压力、困苦或患难；“受患难”自然庄重，也与本段反复出现的安慰形成鲜明对应。
- source_word: παρακλήσεως / παρακαλούμεθα
  choice: 安慰 / 得安慰
  rationale: 本段反复使用同一词族，兼有抚慰和使人得力量的含义；统一译为“安慰”可保留词语呼应，“得安慰”也自然体现被动意义。
- source_word: σωτηρίας
  choice: 得救
  rationale: σωτηρία可指拯救或解救；此处译作“得救”保留保罗用语较宽广的救恩含义，不将其缩限为眼前脱困。
- source_word: ὑπὲρ
  choice: 为了使……得
  rationale: 这里表示使哥林多人受益的目的或指向；用“为了使……得”清楚传达受益关系，同时符合现代汉语表达。
- source_word: τῆς ἐνεργουμένης
  choice: 发挥功效
  rationale: 该分词表示实际运行并产生效力，不只是静态存在；“发挥功效”简洁保留其有效运作之意。
- source_word: ἐν ὑπομονῇ
  choice: 在……忍耐……时
  rationale: ἐν与ὑπομονή的关系可理解为安慰在坚忍承受中发生作用；此译法不强行限定为工具或结果，并使汉语句子自然。
- source_word: τῶν αὐτῶν παθημάτων
  choice: 我们也同样遭受的苦难
  rationale: 突出保罗等人与哥林多人所受苦难的共同性，并保留πάθημα所指的受苦经历。
theological_decisions:
- issue: σωτηρία在此指终极救恩还是现实中的解救
  choice: 译作“得救”，不在正文中限定范围
  alternative: 得解救
  rationale: 原词在保罗书信中可带宽广的救恩意义，而语境也涉及当前苦难；采用“得救”可保留这种张力，避免只解释为脱离眼前困境。
- issue: 安慰与忍耐苦难之间的关系
  choice: 译作“在……时发挥功效”
  alternative: 借着忍耐……发挥功效；使你们能够忍耐……
  rationale: ἐν可容纳处境、范围或方式等关系；正文保留较开放的表达，不把安慰明确解释为忍耐的工具或直接原因。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“受患难”“得安慰”“发挥功效”保持本段的词语呼应；将较长的希腊语句分成两句，以避免汉语结构拖沓，同时保留关系从句所指向的“安慰”。
