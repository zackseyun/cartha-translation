  to: 因为神的应许，无论有多少，在他里面都是“是”[a]。因此，借着他，“阿们”也归给神，使神借着我们得荣耀[b][c]。
  rationale: 修订使“是”与“阿们”在中文中保持原文的平行，并将“借着我们”保留为“荣耀”实现的媒介，而非把它改写成未明说的“我们说阿们”。脚注依旧保留原文凝练表达、阿们的文化含义及末句句法关联的替代理解。
