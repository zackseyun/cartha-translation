  text: ὅσαι γὰρ ἐπαγγελίαι θεοῦ, ἐν αὐτῷ τὸ Ναί· ⸀διὸ καὶ ⸂δι’ αὐτοῦ⸃ τὸ Ἀμὴν τῷ θεῷ πρὸς δόξαν δι’ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/020.yaml
  text: For however many promises of God there are[a], in him is the Yes[c][b]. Therefore also through him is the Amen to God for glory through us.
translation:
  language: zh_hans
  text: 因为神的应许，无论有多少，在他里面都是“是”[a]。因此，借着他，“阿们”也归给神，使神借着我们得荣耀[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文十分凝练，直译近似“在他里面是那‘是’”；也可表述为“在他里面都有了肯定的答复”。
    reason: alternative_reading
  - marker: b
    text: “阿们”是音译词，用来表示肯定，意思近似“确实如此”或“愿如此成就”。
    reason: cultural_note
  - marker: c
    text: 末句也可理解为：“借着我们，荣耀归给神。”
    reason: alternative_reading
lexical_decisions:
- source_word: ὅσαι
  choice: 无论有多少
  rationale: 表达不限定数目的总体，涵盖神所有的应许，也符合现代汉语习惯。
- source_word: ἐπαγγελίαι θεοῦ
  choice: 神的应许
  rationale: 自然保留属格关系，指神自己所作的应许。
- source_word: ἐν αὐτῷ
  choice: 在他里面
  rationale: 保留保罗凝练、以基督为中心的表达，不在正文中增添“实现”或“成全”等解释性动词。
- source_word: τὸ Ναί
  choice: “是”
  rationale: 保留肯定语的修辞力量；中文不宜机械添加定冠词，但用引号表明该词被当作肯定答复来使用。
- source_word: διὸ καὶ δι’ αὐτοῦ
  choice: 所以，借着他，我们也
  rationale: “所以”标明推论，“借着他”保留基督的中介作用，“也”体现καί。
- source_word: τὸ Ἀμὴν
  choice: “阿们”
  rationale: 采用中文基督教语境中通行的音译，并以脚注说明其肯定含义。
- source_word: τῷ θεῷ
  choice: 向神
  rationale: 体现与格所指的对象，即“阿们”是向神而说。
- source_word: πρὸς δόξαν
  choice: 使神……得荣耀
  rationale: 以自然汉语表达目的或结果，同时在脚注中保留另一种句法理解。
- source_word: δι’ ἡμῶν
  choice: 借着我们
  rationale: 保留διά加属格所表达的媒介意义，不限定为“我们的事工”。
theological_decisions:
- issue: 是否把“在他里面是‘是’”明确扩写为应许在基督里得到成全
  choice: 正文采用“在他里面都是‘是’”，保留原文凝练的肯定表达
  alternative: 在他里面都得以实现／在他里面都有了肯定的答复
  rationale: 上下文确实含有神的应许在基督里得到确认或成全之意，但原文没有明说“实现”或“成全”；正文不应消除这种修辞张力。
- issue: πρὸς δόξαν δι’ ἡμῶν的句法关系
  choice: 使神借着我们得荣耀
  alternative: 借着我们，归荣耀给神
  rationale: 正文选择自然且上下文合理的目的表达，同时用脚注保留该短语与“向神”结合得更紧密的理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“是”与“阿们”加引号，以显明二者在原文中的平行和名词化用法；句式保持保罗原话的紧凑性，同时避免生硬直译。
