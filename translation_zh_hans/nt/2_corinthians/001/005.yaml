source:
  edition: SBLGNT
  text: ὅτι καθὼς περισσεύει τὰ παθήματα τοῦ Χριστοῦ εἰς ἡμᾶς, οὕτως διὰ τοῦ Χριστοῦ περισσεύει καὶ ἡ παράκλησις ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/005.yaml
  text: For just as the sufferings of Christ overflow to us[b][a], so also through Christ our comfort overflows.
translation:
  language: zh_hans
  text: 因为正如基督[b]的苦难[a]满溢到我们身上，我们所得到的安慰也同样借着基督满溢。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为基督所受的苦难”。希腊语既可指属于基督、与基督相关的苦难，也可指因基督而承受的苦难。
    reason: alternative_reading
  - marker: b
    text: “基督”在强调其称号含义时，也可译作“弥赛亚”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 承接上文，说明保罗能够安慰患难之人的原因，保留原文的因果说明作用。
- source_word: καθὼς ... οὕτως
  choice: 怎样……也照样
  rationale: 自然、清楚地保留原文前后对应的比较结构。
- source_word: περισσεύει
  choice: 满溢
  rationale: 兼顾数量丰盛与溢流的动态意象，并在前后两处采用同一译法，以保留原文的重复和对称。
- source_word: τὰ παθήματα
  choice: 苦难
  rationale: 直接表达 πάθημα 在本段患难语境中的含义，语言庄重而通俗。
- source_word: τοῦ Χριστοῦ
  choice: 基督的
  rationale: 保留属格结构，不在正文中断定它专指基督亲受的苦难、信徒与基督共同有分的苦难，还是为基督所受的苦难；另一可能译法见脚注。
- source_word: εἰς ἡμᾶς
  choice: 到我们身上
  rationale: 表达苦难临到并由保罗及其同工经历，比直译“进入我们”更符合现代汉语。
- source_word: διὰ τοῦ Χριστοῦ
  choice: 借着基督
  rationale: 准确表达 διά 加属格所表示的中介，说明安慰是借着基督临到的。
- source_word: ἡ παράκλησις ἡμῶν
  choice: 我们所得的安慰
  rationale: παράκλησις 在上下文中与苦难相对，译作“安慰”最贴合牧养语境；将属有表达略作展开，避免“我们的安慰”在汉语中被误解为我们给予别人的安慰。
theological_decisions:
- issue: “基督的苦难”的含义
  choice: 正文保留“基督的苦难”这一开放的属格表达，可涵盖与基督联合而有分于属于他的苦难
  alternative: 为基督所受的苦难；或基督亲自经历、如今延及其子民的苦难
  rationale: 希腊语属格本身容许多种相关含义。正文不把关系解释得过窄，脚注则明示“为基督受苦”这一合理可能。
- issue: “基督”作为称号或名称
  choice: 正文译作“基督”
  alternative: 弥赛亚
  rationale: 在保罗书信中 Χριστός 在此自然地具有近似名称的用法；脚注保留其称号意义突出时可译作“弥赛亚”的可能。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“满溢”保留原文两次 περισσεύει 的重复意象；“我们所得的安慰”以最小幅度的显化消除现代汉语中所有格可能造成的歧义。
