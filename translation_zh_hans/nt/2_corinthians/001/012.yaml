id: 2CO.1.12
reference: 2 Corinthians 1:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ἡ γὰρ καύχησις ἡμῶν αὕτη ἐστίν, τὸ μαρτύριον τῆς συνειδήσεως ἡμῶν, ὅτι ἐν ⸀ἁγιότητι καὶ εἰλικρινείᾳ ⸀τοῦ θεοῦ, ⸀οὐκ ἐν σοφίᾳ σαρκικῇ ἀλλ’ ἐν χάριτι θεοῦ, ἀνεστράφημεν ἐν τῷ κόσμῳ, περισσοτέρως δὲ πρὸς ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/012.yaml
  text: 'For this is our boast: the testimony of our conscience[a], that we conducted ourselves in the world in holiness and sincerity of God[c][b], not in fleshly wisdom but in the grace of God—and especially toward you.'
translation:
  language: zh_hans
  text: 我们所夸的就是这件事：我们的良心作证，我们在世上行事为人，是本着圣洁[a]和上帝所赐的真诚[b]，不是凭属肉体的智慧[c]，而是凭上帝的恩典；对你们更是如此。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“单纯”，而不是“圣洁”。
    reason: textual_variant
  - marker: b
    text: “上帝所赐的真诚”也可译作“上帝所喜悦的真诚”或“属上帝的真诚”。
    reason: lexical_alternative
  - marker: c
    text: “属肉体的智慧”也可译作“人的智慧”。
    reason: lexical_alternative
lexical_decisions:
- source_word: καύχησις
  choice: 所夸的
  rationale: 保留保罗在此正面而有根据的“夸耀”含义，同时避免把它弱化为一般的自信。
- source_word: μαρτύριον τῆς συνειδήσεως
  choice: 我们的良心作证
  rationale: 将名词结构自然转为现代汉语动词结构，清楚表达良心所作的内在见证。
- source_word: ἁγιότητι
  choice: 圣洁
  rationale: 直接反映SBLGNT正文的宗教与道德含义；异文“纯一”置于脚注。
- source_word: εἰλικρινείᾳ τοῦ θεοῦ
  choice: 上帝所赐的……真诚
  rationale: 把属格理解为来源，表达这种真诚源自上帝；脚注保留性质属格的另一种可能。
- source_word: σοφίᾳ σαρκικῇ
  choice: 属肉体的智慧
  rationale: 保留σαρκ-词族的可见性及保罗用语中的张力，不笼统改写为“人的智慧”。
- source_word: χάριτι θεοῦ
  choice: 上帝的恩典
  rationale: 准确保留保罗神学用语χάρις及其属格结构。
- source_word: ἀνεστράφημεν
  choice: 为人
  rationale: 在现代汉语圣经语体中简洁自然地表达生活方式和行事为人。
- source_word: περισσοτέρως δὲ πρὸς ὑμᾶς
  choice: 对你们更是如此
  rationale: 体现περισσοτέρως的比较强调和πρός的关系指向，汉语表达自然。
theological_decisions:
- issue: εἰλικρινείᾳ τοῦ θεοῦ中τοῦ θεοῦ的作用
  choice: 译为“上帝所赐的……真诚”，按来源理解
  alternative: “上帝所喜悦的真诚”或“属上帝的真诚”
  rationale: 来源义在上下文中通顺，并与随后“凭上帝的恩典”相呼应；脚注保留性质义，避免把属格的歧义完全消除。
- issue: σοφίᾳ σαρκικῇ中σαρκικός的含义
  choice: 译为“属肉体的”
  alternative: “人的”或“世俗的”
  rationale: 直译保留保罗“肉体”概念的神学张力，脚注说明它在此可指仅属人的智慧。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“为人”“属肉体”保留圣经语体和保罗术语，但句法尽量自然；所有正文脚注标记均与脚注对应。
