  source_fidelity: 正文基本准确地传达了保罗及同工以良心见证其在世行事的根据，并保留了“属肉体的智慧”与“上帝的恩典”的对照。不过，“上帝所赐的”在现有汉语句法中同时修饰“圣洁”和“真诚”，而希腊文属格τοῦ θεοῦ紧邻并直接限定εἰλικρινείᾳ（“真诚”）。宜将其限定在“真诚”上，以免扩大原文的语法范围。
  naturalness: “我们在世上为人”可以理解，但“我们在世上行事为人”在现代标准汉语中更完整、自然，也更贴合ἀνεστράφημεν所指的生活行为。“单纯”比“纯一”更符合现代汉语，适合脚注说明异文。
  terminology: “圣洁”“属肉体的智慧”“上帝的恩典”均恰当，并保留了保罗书信的重要术语。“上帝所赐的真诚”是可成立的来源义处理；脚注保留“属上帝的真诚”等替代理解，足以避免将有争议的属格关系绝对化。
