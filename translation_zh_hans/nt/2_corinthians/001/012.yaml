revisions:
- from: 我们所夸的就是这件事：我们的良心作证，我们在世上为人，是本着上帝所赐的圣洁[a]和真诚[b]，不是凭属肉体的智慧[c]，而是凭上帝的恩典；对你们更是如此。
  to: 我们所夸的就是这件事：我们的良心作证，我们在世上行事为人，是本着圣洁[a]和上帝所赐的真诚[b]，不是凭属肉体的智慧[c]，而是凭上帝的恩典；对你们更是如此。
  rationale: 修订仅调整“上帝所赐的”的修饰范围，使之在汉语中对应原文τοῦ θεοῦ与“真诚”的紧邻关系；同时将“为人”扩展为较自然的“行事为人”，并以现代汉语更新异文脚注。未改变经文的神学张力或属格解释的脚注保留。
