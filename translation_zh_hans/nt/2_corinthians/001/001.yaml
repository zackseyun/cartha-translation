  text: Παῦλος ἀπόστολος ⸂Χριστοῦ Ἰησοῦ⸃ διὰ θελήματος θεοῦ καὶ Τιμόθεος ὁ ἀδελφὸς τῇ ἐκκλησίᾳ τοῦ θεοῦ τῇ οὔσῃ ἐν Κορίνθῳ, σὺν τοῖς ἁγίοις πᾶσιν τοῖς οὖσιν ἐν ὅλῃ τῇ Ἀχαΐᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/001.yaml
  text: 'Paul[a], an apostle of Messiah Jesus by the will of God, and Timothy our brother, to the church of God that is in Corinth[b], together with all the saints who are in all Achaia:'
translation:
  language: zh_hans
  text: 保罗，奉上帝旨意作弥赛亚耶稣[a]的使徒，和弟兄提摩太，写信给在哥林多的上帝的教会，以及遍布亚该亚的众圣徒：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弥赛亚耶稣”也可译作“基督耶稣”。
    reason: 保留 Χριστός 在此既可凸显称号含义、又可按传统译作“基督”的表达选择。
lexical_decisions:
- source_word: ἀπόστολος
  choice: 使徒
  rationale: “使徒”是保罗书信中这一受差遣职分的通行、准确译法，比泛指的“使者”更能体现此处的职分含义。
- source_word: Χριστοῦ Ἰησοῦ
  choice: 弥赛亚耶稣
  rationale: 此处 Χριστός 在保罗的正式自称中仍具有称号意味；译作“弥赛亚”使其受膏君王的含义清楚可见。传统译法见脚注。
- source_word: διὰ θελήματος θεοῦ
  choice: 奉上帝旨意
  rationale: διά 加属格在此说明保罗作使徒所依据的神圣旨意；“奉上帝旨意”符合现代中文书信语体，也不弱化其来源。
- source_word: Τιμόθεος ὁ ἀδελφὸς
  choice: 弟兄提摩太
  rationale: 希腊文直称提摩太为“那位弟兄”，没有所有格代词。中文“弟兄提摩太”自然地保留其群体身份，又不增添“我们的”。
- source_word: ἐκκλησίᾳ τοῦ θεοῦ
  choice: 上帝教会
  rationale: “教会”是保罗书信语境中 ἐκκλησία 最自然的现代中文译法；“上帝教会”表达该群体属于上帝。
- source_word: ἁγίοις
  choice: 圣徒
  rationale: “圣徒”是保罗对分别归属上帝之人的通行称呼，简洁且符合语境，并非特指后世受封圣者。
- source_word: σὺν τοῖς ἁγίοις πᾶσιν
  choice: 以及……众圣徒
  rationale: “以及”自然表达 σύν 所带出的共同收信范围；“众”对应 πᾶσιν 的全体含义。
- source_word: ἐν ὅλῃ τῇ Ἀχαΐᾳ
  choice: 遍布亚该亚
  rationale: 这一译法自然表达“在整个亚该亚”的地域范围，说明圣徒散居于全省各处。
theological_decisions:
- issue: 保罗开篇称号中 Χριστός 的译法
  choice: 弥赛亚耶稣
  alternative: 基督耶稣
  rationale: 此处保留 Χριστός 的称号含义，避免其在中文中仅被理解为专名；同时以脚注提供传统且同样可能的译法。
- issue: ὁ ἀδελφός 是否加入群体所有格
  choice: 弟兄提摩太
  alternative: 我们的弟兄提摩太
  rationale: 原文有定冠词而无“我们的”所有格。中文无需逐字呈现冠词，采用“弟兄提摩太”既自然，也避免补入原文未明说的所有关系。
translation_notes:
  register: 采用现代、庄重而易懂的中文书信格式。“写信给”补足中文所需的谓语，不增加原文实质内容。将地域范围译为“遍布亚该亚”，比逐字的“在全亚该亚”更自然。脚注标记置于整节末尾，对应“弥赛亚耶稣”的译名说明。
