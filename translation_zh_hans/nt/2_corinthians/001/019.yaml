source:
  edition: SBLGNT
  text: ὁ ⸂τοῦ θεοῦ γὰρ⸃ υἱὸς ⸂Ἰησοῦς Χριστὸς⸃ ὁ ἐν ὑμῖν δι’ ἡμῶν κηρυχθείς, δι’ ἐμοῦ καὶ Σιλουανοῦ καὶ Τιμοθέου, οὐκ ἐγένετο Ναὶ καὶ Οὒ, ἀλλὰ Ναὶ ἐν αὐτῷ γέγονεν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/019.yaml
  text: For the Son of God[a], Jesus the Messiah, who was proclaimed among you through us—through me and Silvanus and Timothy—did not become Yes and No; rather[d][c][b], in him it has become Yes.
translation:
  language: zh_hans
  text: 因为上帝的儿子耶稣基督——就是我们在你们中间所传扬的，借着我、西拉和提摩太——并不是既“是”又“不是”；相反，在他里面，已经成了“是”。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ τοῦ θεοῦ υἱός
  choice: 上帝的儿子
  rationale: 保留原文完整的称号及其基督论分量；现代汉语中“上帝的儿子”自然清楚。
- source_word: Ἰησοῦς Χριστός
  choice: 耶稣基督
  rationale: 此处与“上帝的儿子”同位，整体呈固定姓名式用法；“耶稣基督”符合现代中文圣经语体，同时不额外解释 Χριστός。
- source_word: κηρυχθείς
  choice: 所传扬的
  rationale: 表达 κηρύσσω 的公开宣告含义，又比生硬直译更符合现代汉语。
- source_word: ἐν ὑμῖν δι’ ἡμῶν
  choice: 我们在你们中间所传扬的
  rationale: “在你们中间”对应 ἐν ὑμῖν；汉语主动结构自然表达 δι’ ἡμῶν 的施事关系。
- source_word: δι’ ἐμοῦ καὶ Σιλουανοῦ καὶ Τιμοθέου
  choice: 由我、西拉和提摩太传扬的
  rationale: 明确列出保罗和两位同工，并以“由”保留 διά 所表达的媒介或施事关系。Σιλουανός 采用中文圣经中通行的简称“西拉”。
- source_word: οὐκ ἐγένετο Ναὶ καὶ Οὔ
  choice: 并不是既“是”又“不是”
  rationale: 保留保罗以“是／不是”构成的修辞对照，不把它释义为“反复无常”等，以免消解原文张力；“既……又……”清楚传达并置关系。
- source_word: ἀλλὰ Ναὶ ἐν αὐτῷ γέγονεν
  choice: 相反，在他里面，已经成了“是”
  rationale: 保留“在他里面”及 γίνομαι 的“成为”语义；“已经成了”体现完成时所指的既成而持续的状态，并保留代词所指的含混。
theological_decisions:
- issue: Χριστός 在同位结构中应译作称号还是姓名式表达
  choice: 耶稣基督
  alternative: 耶稣弥赛亚
  rationale: Ἰησοῦς Χριστός 在这里作为与“上帝的儿子”同位的固定个人称谓，中文采用“耶稣基督”最自然；并不否认 Χριστός 的弥赛亚称号内涵。
- issue: 是否解释 Ναί／Οὔ 的神学所指
  choice: 保留“是／不是”的原有措辞
  alternative: 译作“不反复无常，而是信实可靠”
  rationale: 原文借基督论述“是”与“不是”的对照，具体所指与下文相连。直译其修辞可保存神学张力，避免将含义提前限定为某一种解释。
- issue: γέγονεν 的主语是否应明确补出
  choice: 不明确补出主语，只译“已经成了‘是’”
  alternative: “上帝的应许在他里面都成了‘是’”
  rationale: 本节原文没有明说“应许”，尽管下节会提到上帝的应许；不提前补入可避免把下文的解释直接写进本节。
translation_notes:
  register: 采用庄重而现代的标准普通话。“是／不是”加引号以提示其名词化、口号式用法；破折号保留原文插入说明的结构。未设置脚注，因为正文能够保存主要词义和句法张力，无须以注释引入解释性改写。
