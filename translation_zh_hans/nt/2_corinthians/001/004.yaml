id: 2CO.1.4
reference: 2 Corinthians 1:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ παρακαλῶν ἡμᾶς ἐπὶ πάσῃ τῇ θλίψει ἡμῶν, εἰς τὸ δύνασθαι ἡμᾶς παρακαλεῖν τοὺς ἐν πάσῃ θλίψει διὰ τῆς παρακλήσεως ἧς παρακαλούμεθα αὐτοὶ ὑπὸ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/004.yaml
  text: who comforts us in all our affliction[a], so that we may be able to comfort those in any affliction through the comfort with which we ourselves are comforted by God.
translation:
  language: zh_hans
  text: 他在我们一切的患难中安慰[a]我们，使我们能用自己从上帝所蒙的安慰，去安慰遭遇各种患难的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“鼓励……鼓励”；原文在本节各处使用同一词族。
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλῶν / παρακαλεῖν / παρακλήσεως / παρακαλούμεθα
  choice: 安慰 / 安慰 / 安慰 / 蒙……安慰
  rationale: 本节以患难为语境，这一词族在此主要指人在苦难中所得的慰藉与扶持。“安慰”自然易懂，也能在全节保持原文刻意重复的同一词族。
- source_word: ἐπὶ πάσῃ τῇ θλίψει ἡμῶν
  choice: 在我们一切的患难中
  rationale: θλῖψις指患难、困苦或重压；“患难”保留其分量。ἐπί在这里按处境关系自然译为“在……中”。
- source_word: εἰς τὸ δύνασθαι ἡμᾶς
  choice: 使我们能
  rationale: 此不定式结构可表达目的或结果；“使我们能”既保留这种关联，也符合现代汉语表达。
- source_word: τοὺς ἐν πάσῃ θλίψει
  choice: 遭遇各种患难的人
  rationale: πάσῃ在此具有广泛、分配性的含义，指处于任何一种患难中的人；“各种患难”比机械重复“一切患难”更自然。
- source_word: αὐτοὶ
  choice: 自己
  rationale: 保留强调代词的作用，表明我们用来安慰别人的，正是我们自己亲身从上帝领受的安慰。
- source_word: ὑπὸ τοῦ θεοῦ
  choice: 从上帝所蒙
  rationale: ὑπό配合被动动词标明施事者。汉语“从上帝所蒙”既明确安慰的来源，也自然体现领受的被动含义。
theological_decisions:
- issue: παρακαλέω / παράκλησις的语义范围
  choice: 安慰
  alternative: 鼓励；劝勉；慰藉
  rationale: 患难的上下文使慰藉和扶持之义居于前景，但该词也可包含鼓舞、坚固之意。正文采用“安慰”，脚注提示“鼓励”这一真实的词义可能，不把它缩减为纯粹的情绪抚慰。
- issue: εἰς τό结构表达目的还是结果
  choice: 使我们能
  alternative: 为要使我们能
  rationale: 原文可兼具目的和结果色彩；“使我们能”保留二者之间的张力，避免断然限定为单一目的。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“蒙……安慰”略带经文体色彩，但在现代宗教语境中清楚自然，并能简洁保留被动领受及上帝施行安慰的含义。
