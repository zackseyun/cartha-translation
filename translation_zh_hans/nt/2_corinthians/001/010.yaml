  to: 他曾救我们脱离如此严重的死亡[a]，也必救我们。我们已经把盼望寄托在他身上，盼望他还会再救我们。
  rationale: 修订仅处理语气与汉语搭配：“深信”改为“盼望”，以对应原文已确立、持续的盼望而不额外加强确定性；“那么大的死亡”改为“如此严重的死亡”，在保留字面“死亡”和程度强调的同时提升现代汉语自然度。脚注锚点及其所保留的词汇替代义均维持不变。
