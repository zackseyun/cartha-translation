  naturalness: “那么大的死亡”在现代汉语中不够自然，虽可理解却显生硬；“如此严重的死亡”较通顺，仍保留θανάτου“死亡”的字面措辞和原文的强烈表达。
  terminology: “救……脱离”与三次ῥύομαι的译法一致；“把盼望寄托在他身上”恰当。“还会再救”可表达καὶ ἔτι所指的进一步拯救。
