  text: ὃς ἐκ τηλικούτου θανάτου ἐρρύσατο ἡμᾶς καὶ ⸀ῥύσεται, εἰς ὃν ἠλπίκαμεν ὅτι καὶ ἔτι ῥύσεται,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/010.yaml
  text: who rescued us from so great a death and will rescue us[a], in whom we have hoped that he will indeed rescue us again,
translation:
  language: zh_hans
  text: 他曾救我们脱离如此严重的死亡[a]，也必救我们。我们已经把盼望寄托在他身上，盼望他还会再救我们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“脱离那样致命的危险”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τηλικούτου
  choice: 那么大的
  rationale: 保留指示形容词对危险程度的强调，与“死亡”搭配，也延续原文强烈的表达。
- source_word: θανάτου
  choice: 死亡
  rationale: 该名词直译为“死亡”；正文保留原文意象，而可能指致命危险的惯用含义放入脚注。
- source_word: ἐρρύσατο
  choice: 曾救……脱离
  rationale: 该动词表示从危险中解救；“救……脱离”符合现代汉语，并清楚表达过去已经发生的拯救。
- source_word: ῥύσεται
  choice: 必救／还会再救
  rationale: 以同一动词“救”对应原文同源形式；“必”和“还会再”分别传达两处将来时以及后一句的持续期待。
- source_word: εἰς ὃν
  choice: 把希望寄托在他身上
  rationale: 此结构表示盼望所指向的对象；这一译法在现代汉语中自然，并保留以神为盼望对象的个人性。
- source_word: ἠλπίκαμεν
  choice: 已经把希望寄托
  rationale: “已经”配合“寄托”表达完成时所含已经确立、持续至今的盼望。
- source_word: καὶ ἔτι
  choice: 还会再
  rationale: “还”表达持续和强调，“再”表达未来进一步的拯救，不把两层语气简化为单一意思。
theological_decisions:
- issue: 正文中的“死亡”应按字面保留，还是意译为“致命危险”
  choice: 正文保留“死亡”
  alternative: 正文译为“那样致命的危险”
  rationale: 希腊文明确使用“死亡”；保留这一措辞可呈现保罗强烈的表达和原文张力，同时用脚注说明其可能的惯用含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“那么大的死亡”略带非常规色彩，是为保留希腊文的强烈意象；脚注提供自然的惯用理解。将较长的希腊语句分为两句，以避免汉语结构拖沓，同时保留过去、将来和继续盼望再次蒙救的推进。
