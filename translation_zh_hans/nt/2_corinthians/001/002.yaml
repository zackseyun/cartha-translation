  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/002.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a][b].
translation:
  language: zh_hans
  text: 愿恩典和平安从我们的父上帝和主[a]耶稣基督[b]临到你们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “主”在某些语境中也可译作“主人”；这里是用于耶稣的尊称。
    reason: lexical_alternative
  - marker: b
    text: “基督”意为“受膏者”，也就是“弥赛亚”。
    reason: lexical_clarification
lexical_decisions:
- source_word: χάρις
  choice: 恩典
  rationale: 这是保罗书信问候中的核心用语；“恩典”既保留问候语的庄重色彩，也承载其神学分量。
- source_word: ὑμῖν
  choice: 临到你们
  rationale: 希腊语与格表示领受者；结合汉语祝愿句式，以“临到你们”自然表达“给你们”。
- source_word: εἰρήνη
  choice: 平安
  rationale: “平安”是符合圣经语境的常用对应，也保留了此词所含的安宁与福祉意味。
- source_word: ἀπὸ
  choice: 从
  rationale: 直接表达恩典和平安的来源。
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: 我们的父上帝
  rationale: 将πατρὸς理解为对θεοῦ的同位说明；这一表达清楚保留“上帝是我们的父”的关系。
- source_word: κυρίου
  choice: 主
  rationale: 在此基督论称号和祝福公式中，“主”最为准确、庄重，也符合现代汉语圣经用语。
- source_word: Ἰησοῦ Χριστοῦ
  choice: 耶稣基督
  rationale: “耶稣基督”在现代汉语中自然且广为理解；脚注说明“基督”的称号含义，以免其仅被当作姓名的一部分。
theological_decisions:
- issue: 保罗问候语中Χριστοῦ的称号性质
  choice: 正文采用“基督”，并在脚注说明其意为“受膏者”，即“弥赛亚”
  alternative: 正文译作“弥赛亚”或“受膏者”
  rationale: 原文形式既可作为耶稣的固定称号，又保有“受膏者”的意义。“耶稣基督”在汉语书信问候中最自然，而脚注使其称号含义保持可见，不把两者之间的张力静默消除。
- issue: κυρίου用于耶稣时的译法
  choice: 主
  alternative: 主人
  rationale: 此处是与“我们的父上帝”并列出现的尊称；“主”最符合该祝福公式的语域。“主人”虽在某些语境可表达κύριος，却不适合此处。
- issue: θεοῦ πατρὸς ἡμῶν的句法关系
  choice: 我们的父上帝
  alternative: 我们的上帝和父
  rationale: 原文没有在θεοῦ与πατρὸς之间使用καί，较自然地表示“上帝，就是我们的父”，而不是两个并列称谓。
translation_notes:
  register: 采用现代、庄重而易懂的书信祝愿语体。“愿……临到你们”补出汉语所需的祝愿结构，但没有给原文增加新的实质内容；“恩典和平安”保留保罗问候语的固定次序。
