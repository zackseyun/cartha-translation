  text: πιστὸς δὲ ὁ θεὸς ὅτι ὁ λόγος ἡμῶν ὁ πρὸς ὑμᾶς οὐκ ⸀ἔστιν Ναὶ καὶ Οὔ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/018.yaml
  text: As surely as God is faithful[b][a], our message to you is not “Yes and No.”
translation:
  language: zh_hans
  text: 上帝是信实的：我们对你们所说的话，不是“是而又非”。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“但上帝是信实的：我们对你们所说的话，并非‘是和非’。”
    reason: 保留δὲ较形式对应的“但”，并较逐词呈现Ναὶ καὶ Οὔ；“话”也可译为“信息”。
lexical_decisions:
- source_word: πιστός
  choice: 信实的
  rationale: 表达上帝可靠、可信的属性，并与保罗为自己话语的可信性作保证这一语境相称。
- source_word: δὲ
  choice: 不单独译出
  rationale: 此处与“上帝是信实的”共同构成郑重保证；汉语以整个句式自然表达其语用力量，无须机械译作“但是”。
- source_word: ὅτι
  choice: 以逗号连接后面的断言
  rationale: 这里引出保罗郑重确认的内容。汉语用“上帝是信实的，……”既保留两部分的关联，也避免生硬的“上帝是信实的，即……”。
- source_word: λόγος
  choice: 所传的话
  rationale: λόγος在此指保罗及同工向哥林多人所说或传达的内容；“所传的话”比单独的“话”更明确，同时未将其过度限定为某种专门术语。
- source_word: ὁ πρὸς ὑμᾶς
  choice: 对你们
  rationale: 简洁保留该话语以哥林多人为对象的关系。
- source_word: οὐκ ἔστιν
  choice: 并不是
  rationale: 对应希腊文现在时，并以“并”加强对矛盾或反复不定的否定。
- source_word: Ναὶ καὶ Οὔ
  choice: “是而又非”
  rationale: 保留“是”与“非”的尖锐对照，并用“而又”自然表达同一话语既肯定又否定的含义。
theological_decisions:
- issue: 如何处理 πιστὸς δὲ ὁ θεὸς ὅτι 的郑重保证结构
  choice: “上帝是信实的，我们……”
  alternative: “上帝既是信实的，我们……”；“但上帝是信实的，因此我们……”
  rationale: 采用并列式表达，使上帝的信实成为随后断言的郑重保证，同时不把ὅτι明确锁定为因果关系，保留原文句法张力。
- issue: “是而又非”所指的范围
  choice: 不在正文中解释为反复无常、矛盾或不可信
  alternative: 意译为“反复无常”或“自相矛盾”
  rationale: 原文保留简洁的“是和非”对举；直译式表达让上下文界定其具体含义，避免提前化解保罗的修辞张力。
translation_notes:
  register: 采用现代、庄重且便于普通读者理解的书面汉语。“上帝是信实的”保留圣经语体的郑重感；“所传的话”清楚自然。脚注标记已在正文相应位置列出。
