  text: συνυπουργούντων καὶ ὑμῶν ὑπὲρ ἡμῶν τῇ δεήσει, ἵνα ἐκ πολλῶν προσώπων τὸ εἰς ἡμᾶς χάρισμα διὰ πολλῶν εὐχαριστηθῇ ὑπὲρ ⸀ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/011.yaml
  text: as you also join in helping us by prayer[c][b][a], so that thanks may be given by many on our behalf for the gracious gift given to us.
translation:
  language: zh_hans
  text: 你们也借着祈求一同帮助我们，好使许多人为临到我们的恩赐而为我们献上感谢[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: d
    text: 原文在“感谢”前另有“借着许多”一语，未说明所指为何，且其与上下文的修饰关系有争议。它可能指借着许多人的祈求，或指感谢借着许多人而发出。也可译作：“好使临到我们的恩赐，借着许多人，从许多人那里，为我们得到感谢。”
    reason: alternative_reading
lexical_decisions:
- source_word: συνυπουργούντων
  choice: 一同出力
  rationale: 该词含有共同参与援助的意思。“一同出力”既保留 συν- 的协作意味，也符合现代汉语表达。
- source_word: τῇ δεήσει
  choice: 借着祈求
  rationale: δέησις 指有所求的恳切祷告；“祈求”比泛称“祷告”更能体现其具体而迫切的性质，介词结构则表达工具意义。
- source_word: ἐκ πολλῶν προσώπων
  choice: 许多人
  rationale: πρόσωπον 字面为“脸、面容”，此处以“许多面孔”转指许多人；正文采用自然汉语“许多人”，字面意象在脚注保留。
- source_word: τὸ εἰς ἡμᾶς χάρισμα
  choice: 我们所得的恩赐
  rationale: εἰς ἡμᾶς 表示恩赐临到“我们”；χάρισμα 带有出于恩惠而赐下之物的含义，“恩赐”兼顾礼物与恩惠两个层面。
- source_word: διὰ πολλῶν
  choice: 借着许多人的祈求
  rationale: 原文只说“借着许多”，省略所借助的事物。结合前文的“祈求”，正文补出“人的祈求”，使汉语清楚，同时以脚注保留该短语在修饰关系上的困难。
- source_word: εὐχαριστηθῇ
  choice: 献上感谢
  rationale: 该被动式若直译为“被感谢”在汉语中容易误解为恩赐本身接受感谢；“献上感谢”自然表达因恩赐而发出的感恩行动。
- source_word: ὑπὲρ ἡμῶν
  choice: 为我们
  rationale: 此处可表达关乎我们或代表我们；“为我们”简洁保留这种范围，不把它限定为单一关系。
theological_decisions:
- issue: “恩赐”在本节具体指什么
  choice: 保留概括性的“恩赐”，不在正文中明确为脱险、祝福或其他具体事件
  alternative: 译作“赐给我们的拯救”或“临到我们的福分”
  rationale: 上下文暗示这是上帝施予保罗一行人的恩惠，可能尤其涉及患难中的搭救，但本节使用的是宽泛的 χάρισμα；不应把具体解释写入正文。
- issue: 感谢的对象
  choice: 使用“献上感谢”而不在正文补出“向上帝”
  alternative: 译作“向上帝献上感谢”
  rationale: 语境中感谢显然指向上帝，但希腊文此处没有明说对象；正文不补出对象，可避免把语境推论冒充明文。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“一同出力”呈现共同参与的意味；后半句适度拆开希腊文密集结构，以免两个“许多”造成误读，同时借脚注保留原文省略和修饰关系上的真实歧义。
