  text: Εὐλογητὸς ὁ θεὸς καὶ πατὴρ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὁ πατὴρ τῶν οἰκτιρμῶν καὶ θεὸς πάσης παρακλήσεως,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/003.yaml
  text: Blessed be the God and Father of our Lord Jesus the Messiah[a], the Father of mercies and God of all comfort[d][c][b],
translation:
  language: zh_hans
  text: 愿颂赞归于我们主耶稣——弥赛亚[a]——的上帝和父！他是怜悯之父[b]，也是赐一切安慰[c]的上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弥赛亚”意为“受膏者”；传统译作“基督”。
    reason: 说明称号含义并列出传统译法。
  - marker: b
    text: 也可译作“满有怜悯的父”或“一切怜悯的父”。原文“怜悯”为复数。
    reason: 保留οἰκτιρμῶν的复数形式及属格关系可能表达的丰富含义。
  - marker: c
    text: “安慰”也可译作“鼓励”或“劝慰”。
    reason: 反映παράκλησις在本语境中的语义范围。
lexical_decisions:
- source_word: Εὐλογητὸς
  choice: 愿颂赞归给
  rationale: 这是颂赞公式中的表语形容词；译为“愿颂赞归给”符合现代汉语敬拜语体，并表达原文宣告与颂赞的功能。
- source_word: ὁ θεὸς καὶ πατὴρ
  choice: 上帝和父
  rationale: 定冠词统摄两个并列名词，指同一位；保留“上帝”和“父”两个称谓，避免压缩成单一的“父神”。
- source_word: κυρίου
  choice: 主
  rationale: 在新约基督论语境中，κύριος通常译为“主”，既自然又保留尊称及权柄含义。
- source_word: Ἰησοῦ Χριστοῦ
  choice: 耶稣——弥赛亚
  rationale: Χριστός在此仍可辨认为称号；用破折号以自然汉语标明“弥赛亚”是对耶稣身份的称谓，而非姓氏，同时脚注列出传统译法。
- source_word: οἰκτιρμῶν
  choice: 怜悯之父
  rationale: 属格复数表达上帝是一切怜悯的源头；汉语“怜悯之父”保留原文简洁的关系隐喻，复数含义由语境概括表达。
- source_word: πάσης παρακλήσεως
  choice: 赐一切安慰
  rationale: παράκλησις在患难语境中主要指安慰，也可包括鼓励与劝慰；加入“赐”使“安慰的上帝”在现代汉语中自然，并显明源头关系。
theological_decisions:
- issue: Χριστός在“Ἰησοῦ Χριστοῦ”中的称号性质
  choice: 耶稣——弥赛亚
  alternative: 耶稣基督
  rationale: 主译保留Χριστός“受膏者／弥赛亚”的可理解意义，不把它无声地处理成姓氏；脚注保留汉语基督教传统中熟悉的译名。
- issue: “ὁ θεὸς καὶ πατὴρ”与耶稣的关系
  choice: 我们主……的上帝和父
  alternative: 我们主……的父神
  rationale: 原文明确并列θεός与πατήρ，并由同一冠词统摄。译文保留“上帝和父”，不消解“我们的主”与“他的上帝和父”并置所形成的神学张力。
- issue: παράκλησις的语义范围
  choice: 安慰
  alternative: 鼓励／劝慰
  rationale: 本段随后谈到患难，故“安慰”最贴合上下文；脚注承认该词也有鼓励和劝慰之义。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。“愿颂赞归给”保留颂赞句式；两个分句使长串同位结构更清楚。“上帝和父”略带经文语体，但为忠实保留原文两个称谓及其神学张力而采用。所有脚注标记均已置于正文相应位置。
