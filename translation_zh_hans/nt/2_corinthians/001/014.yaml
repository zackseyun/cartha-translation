source:
  edition: SBLGNT
  text: καθὼς καὶ ἐπέγνωτε ἡμᾶς ἀπὸ μέρους, ὅτι καύχημα ὑμῶν ἐσμεν καθάπερ καὶ ὑμεῖς ἡμῶν ἐν τῇ ἡμέρᾳ τοῦ κυρίου ⸀ἡμῶν Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/014.yaml
  text: just as you also came to understand us in part[a], that we are your boast, just as you also are ours[b], in the day of our Lord Jesus.
translation:
  language: zh_hans
  text: 正如你们已经在一定程度上认识我们，知道在我们主耶稣的日子，我们是你们所夸耀的，正如你们也是我们所夸耀的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπέγνωτε
  choice: 认识了
  rationale: 表示哥林多人已经对保罗及其同工有了真实的认识，但不把动词本身强化为“完全了解”；其不完全性由后面的“在一定程度上”表达。
- source_word: ἀπὸ μέρους
  choice: 在一定程度上
  rationale: 保留认识尚属部分、不完全的含义，同时不限定具体程度。
- source_word: καύχημα
  choice: 所夸耀的
  rationale: 保留保罗“夸耀”的修辞和彼此以对方为荣的张力，不淡化为单纯的“喜悦”。
- source_word: καθάπερ
  choice: 正如
  rationale: 清楚呈现保罗与哥林多人之间相互夸耀的对应关系。
- source_word: ἡμέρᾳ τοῦ κυρίου ἡμῶν Ἰησοῦ
  choice: 我们主耶稣的日子
  rationale: 保留早期基督教关于末后审判与显现之日的固定表达，并忠实呈现属格结构。
- source_word: κύριος
  choice: 主
  rationale: 符合该处作为耶稣尊称的通常译法。
- source_word: καθὼς καὶ
  choice: 正如……也
  rationale: 承接上文，并保留比较及附加语气；按现代汉语语序自然表达。
theological_decisions:
- issue: 保罗使用彼此为“夸耀”的语言
  choice: 我们是你们所夸耀的，正如你们也是我们所夸耀的
  alternative: 我们是你们引以为荣的理由，正如你们也是我们的理由
  rationale: 直译“夸耀”更能保留保罗的修辞和神学张力；经文所说的是使徒与教会在主耶稣之日彼此以对方为夸耀，并非额外断言自我高举。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“在一定程度上”自然表达认识的不完全；重复“所夸耀的”以保留原文的互惠结构。末句将“也是如此”后置，使“在我们主耶稣的日子”自然涵盖双方彼此夸耀的关系。
