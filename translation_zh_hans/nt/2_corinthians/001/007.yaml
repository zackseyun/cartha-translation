  text: καὶ ἡ ἐλπὶς ἡμῶν βεβαία ὑπὲρ ⸀ὑμῶν· εἰδότες ὅτι ⸀ὡς κοινωνοί ἐστε τῶν παθημάτων, οὕτως καὶ τῆς παρακλήσεως.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/007.yaml
  text: And our hope for you is firm[a], because we know that just as you share in the sufferings, so also you share in the comfort.
translation:
  language: zh_hans
  text: 我们对你们所怀的盼望是坚定的，因为我们知道：正如你们有分于苦难，也有分于安慰。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “安慰”也可译作“鼓励”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπίς
  choice: 盼望
  rationale: 采用现代中文圣经语境中自然、通行的对应词，兼顾期待与确信，不将词义收窄为单纯的“信心”。
- source_word: βεβαία
  choice: 坚定的
  rationale: 表达这盼望牢靠、确定的性质，同时保持自然庄重的现代汉语。
- source_word: ὑπὲρ ὑμῶν
  choice: 对你们所怀的
  rationale: 此处表示关于或指向哥林多信徒；这样译可自然地与“盼望”搭配，避免“为你们的盼望”可能产生的歧义。
- source_word: εἰδότες
  choice: 因为我们知道
  rationale: 分词在语境中说明盼望坚定的根据，译作原因从句可清楚呈现逻辑关系。
- source_word: ὡς ... οὕτως καί
  choice: 怎样……也必怎样
  rationale: 保留希腊文前后对应的关联结构；“必”体现坚定预期，但不改变其参与安慰与参与苦难相对应的意义。
- source_word: κοινωνοί
  choice: 同受／同得
  rationale: 该名词表示共同有分、参与。结合两个宾语分别译为“同受苦难”和“同得安慰”，在中文中简洁自然，并保留共同参与之意。
- source_word: παθημάτων
  choice: 苦难
  rationale: 涵盖受苦、患难等广义经历，并与本章上下文相符。
- source_word: παρακλήσεως
  choice: 安慰
  rationale: 在哥林多后书1章的上下文中，此词反复出现，主要指人在苦难中所得的安慰；同时保留“鼓励”这一可能含义于脚注。
- source_word: '[elliptical second clause]'
  choice: 同得
  rationale: 希腊文后半句省略了与前半句对应的参与概念；中文补出“同得”，使句意完整而不增添新内容。
theological_decisions:
- issue: 后半句是否表达将来的确定性
  choice: 也必怎样同得安慰
  alternative: 也怎样同得安慰
  rationale: 希腊文使用现在时“你们是……有分者”，本身并无明示的将来时；但全句以“坚定的盼望”为框架，中文加入“必”可自然表达保罗的确信。脚注不必展开，因为这属于语用层面的明确化，而非另立教义。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。以“怎样……也必怎样”重现希腊文的对应结构；用“同受／同得”表达共同有分，避免生硬的名词化表达。脚注标记置于相关词句之后。
