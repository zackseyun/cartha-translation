  rationale: 修订仅处理两个安全且必要的表达问题：以“确信”准确表达πεποίθησις，并以“再得到一次益处”清楚表达δευτέραν χάριν在本段行程语境中的含义。保留原有脚注锚点及句末逗号，以维持与下一节的连续性；脚注保留“恩惠/恩典”及“早些到”的替代理解。
