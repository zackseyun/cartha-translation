  text: Καὶ ταύτῃ τῇ πεποιθήσει ἐβουλόμην ⸂πρότερον πρὸς ὑμᾶς ἐλθεῖν⸃, ἵνα δευτέραν ⸀χάριν ⸀σχῆτε,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/015.yaml
  text: And with this confidence I intended to come to you first[a], so that you might have a second benefit[b],
translation:
  language: zh_hans
  text: 我怀着这样的确信，本来打算先到你们那里去[b]，使你们再得到一次益处[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“得第二份恩惠”；“益处”也可译为“恩惠”或“恩典”。
    reason: lexical_alternative
  - marker: b
    text: “先到”也可译作“早些到”。
    reason: source_ambiguity
lexical_decisions:
- source_word: πεποιθήσει
  choice: 信心
  rationale: 这里指保罗基于前文所述事实而有的确信。“信心”自然庄重，也保留该词可指信赖或把握的语义范围。
- source_word: ἐβουλόμην
  choice: 本来打算
  rationale: 该词表达意愿或意图；结合上下文，“本来打算”既说明这是保罗原有的行程意向，也不把它说成已经确定不变的正式计划。
- source_word: πρότερον πρὸς ὑμᾶς ἐλθεῖν
  choice: 先到你们那里去
  rationale: πρότερον在这里最自然地表示行程次序上的优先，与下一节所述往返路线相合；“先到”简洁清楚。
- source_word: δευτέραν χάριν
  choice: 再得一次恩惠
  rationale: χάρις在此可指保罗探访给收信人带来的恩惠或益处。“恩惠”保留了原词的积极意味和一定神学张力；“再得一次”在现代汉语中比“有第二个恩惠”自然。
- source_word: σχῆτε
  choice: 得
  rationale: ἔχω在此可按语境理解为拥有或领受；汉语用“得”能自然表达领受这份恩惠。
theological_decisions:
- issue: χάρις在本节是神学意义的“恩典”，还是探访带来的“益处/恩惠”
  choice: 正文译作“恩惠”
  alternative: “恩典”或“益处”
  rationale: 行程语境倾向于具体的恩惠或益处，但原文仍使用通常可译为“恩典”的χάρις。采用“恩惠”可兼顾语境与词义联系，不把它明确限定为救恩意义，也不完全消除其神学色彩。
- issue: δευτέραν是指“第二份恩惠”还是“第二次得益处”
  choice: 译作“再得一次恩惠”
  alternative: “得第二份恩惠”
  rationale: 下一节暗示保罗计划两度与哥林多人相会，因此次数解释较自然；但正文仍保留名词“恩惠”，脚注说明另一种较形式对应的表达。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“我既有这样的信心”承接上文；“本来打算”符合保罗为改变行程作解释的语境。保留句末逗号，以反映本节与下一节在句法和内容上的连续性。
