  source_fidelity: 原文以两个并列的不定过去时分词继续描述上帝的行动：他给信徒盖印，并赐下作为ἀρραβών的圣灵。草案的“在我们身上盖了印”虽可理解，但汉语搭配不够自然；“把圣灵的定金赐在我们心里”则使“赐在”的宾语和处所关系显得生硬，也未清楚呈现圣灵与定金比喻的关系。修订以“把圣灵作为定金赐在我们心里”忠实表达圣灵是所赐的定金，同时保留商业意象。
  naturalness: “给我们盖上了印记”是现代庄重汉语中表达“sealed us”的自然说法。“把圣灵作为定金赐在我们心里”比“把圣灵的定金赐在我们心里”更通顺，且“在我们心里”明确修饰赐予／安置的内在处所。
  terminology: 保留“圣灵”“印记”“定金”等一致而庄重的术语。“定金”可保留ἀρραβών的具体商业比喻；脚注补列“保证金”“首期款”等可行表达，并说明其为预付部分、保证余款的含义，避免把正文抽象化为单纯“保证”。
