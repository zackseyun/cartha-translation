    rationale: 汉语通常说“给某人盖上印记”或“在某人身上盖上印记”；修订使动宾关系更自然，而不增添归属、认证或保障等原文未明说的解释。
  - severity: medium
    issue: “把圣灵的定金赐在我们心里”语义关系不清且句法不够自然。
    rationale: 该表述易使“圣灵的定金”被理解为属于圣灵的某种定金，也使“赐在”显得别扭。原文在此语境中自然指所赐的圣灵为定金；“把圣灵作为定金赐在我们心里”清楚保留此商业比喻。
