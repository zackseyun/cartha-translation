  text: ὁ καὶ σφραγισάμενος ἡμᾶς καὶ δοὺς τὸν ἀρραβῶνα τοῦ πνεύματος ἐν ταῖς καρδίαις ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/022.yaml
  text: who also sealed us and gave the down payment of the Spirit in our hearts.
translation:
  language: zh_hans
  text: 他也给我们盖上了印记，并把圣灵作为定金赐在我们心里[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “定金”或译“保证金”或“首期款”；指预先支付的一部分，用以保证其余部分随后付清。
    reason: 词义备选及商业比喻说明
lexical_decisions:
- source_word: σφραγισάμενος
  choice: 在我们身上盖了印
  rationale: 保留“盖印”的具体比喻；该词可涉及归属、认证或保障，但正文不把其中某一层含义解释得过满。
- source_word: δοὺς
  choice: 赐
  rationale: 这是 δίδωμι 的不定过去时分词，与前一分词并列。汉语用“并……赐……”自然承接前文所指的上帝，也体现所赐之物的恩赐性质。
- source_word: ἀρραβῶνα
  choice: 定金
  rationale: 该词指先付的一笔款项，并以此保证其余部分将会兑现。“定金”在现代汉语中简洁地保留了商业比喻，优于只表达抽象功能的“保证”。
- source_word: τοῦ πνεύματος
  choice: 圣灵的
  rationale: 直译属格结构，不在正文中断定这是“由圣灵而来的定金”还是“以圣灵为定金”；结合语境，后者自然可见，但原文的紧凑表达与张力得到保留。
- source_word: ἐν ταῖς καρδίαις ἡμῶν
  choice: 在我们心里
  rationale: 按 ἐν 加与格表达内在的位置；“心里”是普通现代汉语中自然且庄重的说法。
- source_word: ὁ καὶ ... καὶ
  choice: 他也……并……
  rationale: 冠词加分词回指上一节的上帝。汉语以“他”承接，并用“也……并……”表现两个并列行动。
theological_decisions:
- issue: 圣灵作为 ἀρραβών 的含义
  choice: 以具体的商业比喻译作“圣灵的定金”
  alternative: 译作“圣灵的保证”或“以圣灵作凭据”
  rationale: “保证”较清楚地表达功用，却会淡化首笔付款保证余款兑现的具体意象；“圣灵的定金”既保存保罗的比喻，也不在正文中扩展其末世论含义。
- issue: τοῦ πνεύματος 的属格关系
  choice: 保留为“圣灵的定金”
  alternative: 明确译作“把圣灵作为定金”或“从圣灵而来的定金”
  rationale: 原文属格可被理解为定金就是圣灵，也可在形式上容许来源或关联的读法。保留紧凑属格，避免无必要地消除原文的表达张力。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“盖了印”与“定金”保留原文两个具体比喻；不用较陈旧的“膏我们”“质”等表达。脚注标记紧跟“定金”，便于读者准确对应词义说明。
