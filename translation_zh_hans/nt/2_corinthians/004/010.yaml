  text: πάντοτε τὴν νέκρωσιν ⸀τοῦ Ἰησοῦ ἐν τῷ σώματι περιφέροντες, ἵνα καὶ ἡ ζωὴ τοῦ Ἰησοῦ ἐν τῷ σώματι ἡμῶν φανερωθῇ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/010.yaml
  text: always carrying in the body the death of Jesus[a], so that the life of Jesus may also be revealed in our body.
translation:
  language: zh_hans
  text: 总是把耶稣的死[a]带在身体上，好让耶稣的生命也在我们的身体上显明出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“耶稣的受死”。希腊语名词既可侧重死亡的状态，也可侧重身体所承受的受死经历。
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντοτε
  choice: 总是
  rationale: 表达持续不变的处境，简洁自然，并保留原文“始终如此”的力度。
- source_word: νέκρωσιν
  choice: 死
  rationale: 此名词可指死亡、死的状态或受死的经历；正文用“死”，既与下文“生命”形成鲜明对应，也不把含义限缩为单纯的死亡过程。
- source_word: τοῦ Ἰησοῦ
  choice: 耶稣的
  rationale: 保留属格结构，不进一步断定是“耶稣所经历的死”还是“与耶稣相关、属于耶稣的死”。
- source_word: ἐν τῷ σώματι
  choice: 在身体里
  rationale: 原文第一次没有明说“我们的”；译文不增添所有格，并保留身体作为承受死亡印记之处的意象。
- source_word: περιφέροντες
  choice: 带
  rationale: 现在分词表示持续随身承受；“带在身体里”保留携带的比喻，也符合现代汉语表达。
- source_word: ἵνα
  choice: 好让
  rationale: 自然表达目的兼结果关系，不强行排除两者中的任何一面。
- source_word: καὶ
  choice: 也
  rationale: 体现耶稣的“死”与“生命”之间相应并列的关系。
- source_word: ζωὴ
  choice: 生命
  rationale: 直接对应原文，并在语境中指向复活之耶稣的生命。
- source_word: ἐν τῷ σώματι ἡμῶν
  choice: 在我们的身体上
  rationale: 保留原文单数“身体”和复数所有格“我们的”，以维持与前半句的平行及群体性的表达。
- source_word: φανερωθῇ
  choice: 显明出来
  rationale: 表达被动语态所含的“被彰显、成为可见”之意，语言自然且不必明说施事者。
theological_decisions:
- issue: νέκρωσις与耶稣的关系
  choice: 译作“耶稣的死”
  alternative: “耶稣的受死”或“耶稣的死亡过程”
  rationale: “死”最能维持与“生命”的平行，也保留属格关系和该名词在死亡状态、受死经历之间的语义张力；脚注提示另一种侧重点。
- issue: σῶμα的数
  choice: 两处都保留单数“身体”
  alternative: 第二处译作“我们的身体各自”或“我们的身体里”而按意义作复数理解
  rationale: 希腊文两处均为单数；保留单数可维持修辞平行，也容纳保罗及其同工共同承受苦难的群体性含义。
- issue: ἵνα所表达的关系
  choice: 译作“好让”
  alternative: “以致”
  rationale: 原文可兼有目的与结果色彩；“好让”以目的为主，同时不排除实际结果，避免作过度神学化的界定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“死—生命”保留原文鲜明对照；“带在身体里”维持具象的身体性和携带意象。脚注标记紧接存在词义选择的“死”之后。
