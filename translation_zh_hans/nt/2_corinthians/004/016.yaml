  text: Διὸ οὐκ ⸀ἐγκακοῦμεν, ἀλλ’ εἰ καὶ ὁ ἔξω ἡμῶν ἄνθρωπος διαφθείρεται, ἀλλ’ ὁ ⸂ἔσω ἡμῶν⸃ ἀνακαινοῦται ἡμέρᾳ καὶ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/016.yaml
  text: Therefore we do not lose heart. But even if our outer man is wasting away[a], yet our inner man is being renewed day by day.
translation:
  language: zh_hans
  text: 所以，我们不灰心。即使我们外在的人日渐衰残[a]，我们内在的人却一天一天地得以更新。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “外在的人”和“内在的人”也可译作“外在的自我”和“内在的自我”。原文以“外在的……人”和省略“人”的“内在的……”构成刻意的对照；这里的“人”具有泛指性。这一对照涉及人的外在与内在层面，但本节未详尽界定二者。
    reason: 说明ἄνθρωπος的泛指性、外在／内在表达的刻意平行，以及内项省略ἄνθρωπος；避免把该对照界定为特定的人论。
lexical_decisions:
- source_word: Διὸ
  choice: 所以
  rationale: 承接上文作出推论；“所以”在现代汉语中自然、清楚，又保留因果承接关系。
- source_word: οὐκ ἐγκακοῦμεν
  choice: 我们不灰心
  rationale: ἐγκακέω在此指不丧失勇气、不因困苦而气馁；“不灰心”简洁地表达其惯用意义。
- source_word: ἀλλ’ εἰ καὶ
  choice: 即使
  rationale: 该结构引入让步情形；汉语以“即使”自然表达这一让步关系，后句的“却”承接原文第二个ἀλλά的强烈对比。
- source_word: ὁ ἔξω ἡμῶν ἄνθρωπος
  choice: 我们外在的人
  rationale: 保留ἄνθρωπος及“外在—内在”的刻意对应，同时避免把它直接缩减为“身体”，从而不超出原文所陈述的人性层面对照。
- source_word: διαφθείρεται
  choice: 日渐衰残
  rationale: 现在时被动形式描写持续发生的败坏、衰退过程；“日渐衰残”在汉语中自然，并与下文逐日更新形成鲜明对照。
- source_word: ὁ ἔσω ἡμῶν
  choice: 我们内在的人
  rationale: 原文省略ἄνθρωπος，但显然与前面的“外在的人”配对；译文补出“人”，保存平行结构和保罗式表达。
- source_word: ἀνακαινοῦται
  choice: 一天新似一天
  rationale: ἀνακαινοῦται为现在时被动，表达持续蒙更新；结合ἡμέρᾳ καὶ ἡμέρᾳ译成“一天新似一天”，既体现逐日持续，也保留被更新的动态意义。
- source_word: ἡμέρᾳ καὶ ἡμέρᾳ
  choice: 一天新似一天
  rationale: 这是分配性的时间表达，意为日复一日；融入“一天新似一天”的现代汉语结构，清楚传达不断更新。
theological_decisions:
- issue: “外在的人”与“内在的人”所表达的人论对照
  choice: 译作“我们外在的人”与“我们内在的人”，不把前者直接等同于身体，也不把后者技术性地界定为灵魂。
  alternative: 可译作“外在的自我／内在的自我”或“外在生命／内在生命”。
  rationale: 上下文涉及肉身受苦与内在更新，但本节本身并未完整界定身体与灵魂的关系。保留“人”的对称说法，既反映原文，也避免加入特定的二元人论。
- issue: 更新的施事者
  choice: 以“一天新似一天”表达持续而承受性的更新，不在正文中明说施事者。
  alternative: 可释义为“上帝使我们内在的人日日更新”。
  rationale: 希腊文使用被动语态，却没有在本句明说施事者；不补出“上帝”可保存原文的含蓄，同时不否认上下文中的神圣施行。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“外在的人／内在的人”略带保罗书信特有的表达色彩，但普通读者可以理解，并由脚注补充说明；“一天新似一天”较“日日更新”更鲜明地呈现持续过程和两半句的修辞对照。
