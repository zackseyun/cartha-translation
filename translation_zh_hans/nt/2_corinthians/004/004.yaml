revisions:
- from: 对这些不信的人来说，今世的神[a]弄瞎了他们的心思，使弥赛亚荣耀福音的光不能照耀他们[b]；弥赛亚就是神的像。
  to: 对这些不信的人来说，今世的神[a]蒙蔽了他们的心思，以致关于弥赛亚荣耀的福音之光不能照在他们身上[b]；弥赛亚就是神的像。
  rationale: 修订仅改善汉语表达并澄清原文句法关系：“蒙蔽心思”适合认知层面的比喻；“不能照在他们身上”将否定的结果正确落在不信者未受福音之光照临；“关于弥赛亚荣耀的福音之光”使连续属格的关系在现代汉语中清晰可辨。保留‘弥赛亚’、‘今世的神’及脚注中的替代理解，不加入经文未明说的解释。
  reviewer_model: gpt-5.6-terra
