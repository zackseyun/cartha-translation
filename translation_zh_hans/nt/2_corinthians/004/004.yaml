  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐν οἷς ὁ θεὸς τοῦ αἰῶνος τούτου ἐτύφλωσεν τὰ νοήματα τῶν ἀπίστων εἰς τὸ μὴ ⸀αὐγάσαι τὸν φωτισμὸν τοῦ εὐαγγελίου τῆς δόξης τοῦ Χριστοῦ, ὅς ἐστιν εἰκὼν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/004.yaml
  text: In their case[a], the god of this age has blinded the minds of the unbelieving, so that the light of the gospel of the glory of Messiah, who is the image of God[c][b], might not shine on them.
translation:
  language: zh_hans
  text: 对这些不信的人来说，今世的神[a]蒙蔽了他们的心思，以致关于弥赛亚荣耀的福音之光不能照在他们身上[b]；弥赛亚就是神的像。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “今世的神”传统上理解为撒但。原文没有在这里直接使用“撒但”这个名称；“今世”强调现今这个堕落的时代，也可译作“这个世代”。
    reason: referential_and_lexical_clarification
  - marker: b
    text: 也可译作：“以致他们看不见关于弥赛亚荣耀的福音之光。”这里的希腊语动词很少见，可能侧重光的照耀，也可能侧重人对光的看见。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν οἷς
  choice: 对这些不信的人来说
  rationale: 承接上文所说正在灭亡、不信的人；采用自然汉语表达其所指范围，避免把介词短语误解为内住关系。
- source_word: ὁ θεὸς τοῦ αἰῶνος τούτου
  choice: 今世的神
  rationale: αἰών在这里侧重现今的时代，而非受造世界；汉语没有大小写之分，因此保留原文称谓，不直接替换为“撒但”。
- source_word: ἐτύφλωσεν τὰ νοήματα
  choice: 弄瞎了他们的心思
  rationale: 保留“使瞎眼”的强烈比喻；“心思”在此指理解、认知和属灵感知的能力，比“思想”更能涵盖原词语义。
- source_word: τῶν ἀπίστων
  choice: 这些不信的人
  rationale: 表达实词化形容词的群体所指，突出他们“不信”的状态，不额外加入“不忠”等道德含义。
- source_word: εἰς τὸ μὴ αὐγάσαι
  choice: 使……不能照耀他们
  rationale: 按目的或结果来表达，并将罕见动词理解为光照在他们身上；另一种“使他们看不见”的理解收入脚注。
- source_word: τὸν φωτισμὸν
  choice: 光
  rationale: 在福音与荣耀的比喻语境中，“光”比“照明”或“光照”更自然，也能与后面的“照耀”协调。
- source_word: τοῦ εὐαγγελίου τῆς δόξης τοῦ Χριστοῦ
  choice: 弥赛亚荣耀福音的光
  rationale: 尽量保留连续属格的层次，使“荣耀”与“弥赛亚”相连，同时让汉语可顺畅理解为关于弥赛亚荣耀的福音之光。
- source_word: τοῦ Χριστοῦ
  choice: 弥赛亚
  rationale: Χριστός在此具有称号功能，译作“弥赛亚”能显明“受膏者”的头衔性质，而不只作为专名处理。
- source_word: ὅς ἐστιν εἰκὼν τοῦ θεοῦ
  choice: 弥赛亚就是神的像
  rationale: 直接保留原文对弥赛亚与神之像的认定，不加入原文没有的后期教义术语。
theological_decisions:
- issue: “今世的神”所指为何
  choice: 保留“今世的神”这一称谓，不在正文中直接写成“撒但”
  alternative: 明确译作“撒但”或解释为非人格化的世俗体系
  rationale: 原文描写一位辖制现今世代的邪恶权势，传统上理解为撒但，但经文本身没有在本节直接使用该名称；保留原称谓既传达其人格性，也避免过度解释。
- issue: αὐγάσαι与φωτισμός的句法关系
  choice: 福音的光不能照耀不信的人
  alternative: 不信的人看不见福音的光
  rationale: 该罕见动词既可侧重光的照耀，也可侧重人的看见；正文采用与“光”最自然呼应的解释，并以脚注保存另一种可能。
- issue: “神的像”的基督论含义
  choice: 直译为“神的像”
  alternative: 加入“完全彰显神”等解释性措辞
  rationale: 原文直接陈述弥赛亚是神的像；译文保留其强度和开放的神学内涵，不以解释替代经文。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“弄瞎”保留原文比喻的力度；“心思”兼顾认知与理解。“弥赛亚荣耀福音的光”略带经文式凝练，以保存原文连续属格的神学层次；分号则清楚标示末尾关系从句所作的基督论说明。
