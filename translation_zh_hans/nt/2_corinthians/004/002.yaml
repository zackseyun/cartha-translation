source:
  edition: SBLGNT
  text: ἀλλὰ ἀπειπάμεθα τὰ κρυπτὰ τῆς αἰσχύνης, μὴ περιπατοῦντες ἐν πανουργίᾳ μηδὲ δολοῦντες τὸν λόγον τοῦ θεοῦ, ἀλλὰ τῇ φανερώσει τῆς ἀληθείας ⸀συνιστάνοντες ἑαυτοὺς πρὸς πᾶσαν συνείδησιν ἀνθρώπων ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/002.yaml
  text: Instead[a], we have renounced the hidden things of shame, not walking in cunning nor falsifying the word of God[b], but by the open display of the truth commending ourselves to every human conscience before God.
translation:
  language: zh_hans
  text: 反而，我们已经弃绝了可耻的隐秘之事；不以诡诈行事，也不篡改上帝的话[a]；反倒借着真理的显明，在上帝面前将自己推荐给每一个人的良心。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “篡改”也可译作“给……掺假”；原词可指为欺骗而搀杂或改坏某物。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπειπάμεθα
  choice: 我们已经弃绝了
  rationale: 表达不定过去时所指的明确、坚决拒绝；“弃绝”庄重自然，比“否认”更能体现主动与这些事断绝。
- source_word: τὰ κρυπτὰ τῆς αἰσχύνης
  choice: 那些可耻的隐秘之事
  rationale: 将属格自然地理解为性质说明，既保留“隐秘”与“羞耻”两个要素，也符合现代汉语表达。
- source_word: μὴ περιπατοῦντες ἐν πανουργίᾳ
  choice: 不以诡诈行事
  rationale: περιπατέω在此比喻生活和行为方式；译作“行事”比直译“行走”自然，πανουργία所含不择手段的狡猾意味以“诡诈”表达。
- source_word: δολοῦντες
  choice: 篡改
  rationale: 该词指带着欺骗意图掺杂、弄假或歪曲；“篡改”简洁地传达蓄意改动并损害原意的含义，另在脚注保留“掺假”的具体意象。
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: 上帝的话
  rationale: 保留λόγος在此处作为神圣信息或宣讲内容的广度，不缩窄为书面经文。
- source_word: τῇ φανερώσει τῆς ἀληθείας
  choice: 把真理显明出来
  rationale: φανέρωσις核心是使之显露、公开可见，并不专指口头宣讲；此译保留方式与范围上的开放性。
- source_word: συνιστάνοντες ἑαυτούς
  choice: 表明自己是可信的
  rationale: 在此指通过公开呈现真理，使自己得到认可或举荐；直译“推荐自己”在现代汉语中易显得自我宣传，故以符合语境的功能表达呈现。
- source_word: πρὸς πᾶσαν συνείδησιν ἀνθρώπων
  choice: 向每一个人的良心
  rationale: 保留πᾶσαν的逐一、普遍意味，并以自然现代汉语表达人的道德意识所作的判断。
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: 在上帝面前
  rationale: 直接保留上帝作为见证者和审察者的含义。
theological_decisions:
- issue: 本节对欺骗性事奉与真实事奉的对比范围
  choice: 译文呈现使徒事奉中的道德透明与忠实传达，不将其限定为修辞问题，也不扩展成一套技术性的经论或教职教义。
  alternative: 把本节专门理解为对修辞操控的谴责，或泛化为关于一切经文处理方式的全面教义命题。
  rationale: 上下文直接讨论保罗及同工事奉的方式；译文保留这一语境，同时不排除原则上的广泛应用。
- issue: φανέρωσις是否专指公开宣讲
  choice: 采用“把真理显明出来”，保留言语、行为或整体事奉使真理公开呈现的可能。
  alternative: 译作“公开宣讲真理”，将意义明确限定为言语宣告。
  rationale: 该名词强调显露、彰显或使人看见，本身不要求只用言语实现；保留其开放性更贴近原文。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“不以诡诈行事”保留保罗关于行为方式的比喻功能；“表明自己是可信的”避免“推荐自己”在汉语中可能造成的自夸误解，同时保留向人的良心求证、又处于上帝鉴察之下的张力。
