  text: οὐ γὰρ ἑαυτοὺς κηρύσσομεν ἀλλὰ ⸂Χριστὸν Ἰησοῦν⸃ κύριον, ἑαυτοὺς δὲ δούλους ὑμῶν διὰ Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/005.yaml
  text: For we do not proclaim ourselves[a], but Messiah Jesus as Lord[c][b], and ourselves as your slaves for Jesus' sake.
translation:
  language: zh_hans
  text: 因为我们所传扬的不是自己，而是耶稣这位弥赛亚为主[a]；我们自己则因耶稣的缘故，作你们的奴仆[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶稣这位弥赛亚”也可译作“基督耶稣”或“弥赛亚耶稣”。“弥赛亚”是称号；当这个词更像姓名的一部分时，常译作“基督”。
    reason: lexical_alternative
  - marker: b
    text: “奴仆”也可译作“仆人”或“奴隶”。原文可指仆役或奴隶；这里采用“奴仆”，以保留其强烈的隶属意味，并与耶稣为“主”形成对照。
    reason: lexical_alternative
  - marker: c
    text: “因耶稣的缘故”也可译作“因为耶稣”。
    reason: alternative_reading
lexical_decisions:
- source_word: κηρύσσομεν
  choice: 传扬
  rationale: 保留公开宣告、传报的含义，同时不限于正式讲道。
- source_word: ἑαυτοὺς
  choice: 自己／我们自己
  rationale: 保留反身代词的重复，以突出保罗同工不是传扬的内容，而是在与哥林多信徒的关系中自居卑微。
- source_word: Χριστὸν Ἰησοῦν
  choice: 弥赛亚耶稣
  rationale: Χριστός在此仍有称号意味，译作“弥赛亚”；并依照希腊语词序置于“耶稣”之前。
- source_word: κύριον
  choice: 为主
  rationale: κύριον在宾格短语中作述语，说明他们传扬弥赛亚耶稣具有“主”的身份；“为主”尽量保留这一结构，而不扩写。
- source_word: δούλους
  choice: 奴仆
  rationale: 兼顾现代汉语可读性与δοῦλος所表达的强烈隶属、降卑意味，也与耶稣为“主”形成刻意对照。
- source_word: ὑμῶν
  choice: 你们的
  rationale: 按δοῦλος之后属格的自然关系表达，表明保罗同工甘愿处于服事哥林多信徒的位置。
- source_word: διὰ Ἰησοῦν
  choice: 因耶稣的缘故
  rationale: διά加宾格在此最自然地表达原因或动机：他们为信徒作奴仆，是由于耶稣。
theological_decisions:
- issue: Χριστός应译作称号还是姓名化形式
  choice: 称号“弥赛亚”
  alternative: “基督”
  rationale: 此处是所传扬内容的一部分，称号意味仍然明显；脚注保留姓名化译法的可能。
- issue: Χριστὸν Ἰησοῦν κύριον的句法关系
  choice: “弥赛亚耶稣为主”
  alternative: “主弥赛亚耶稣”或“弥赛亚耶稣是主”
  rationale: 将κύριον理解为述语，表达传扬耶稣为主，同时避免把“主”仅处理成姓名前的称谓，也不必补出希腊文没有的显式系词。
- issue: δοῦλος的社会与神学力度
  choice: “奴仆”
  alternative: “仆人”或“奴隶”
  rationale: “奴仆”保留隶属与降卑的力度，并与“主”构成对照；同时比现代汉语“奴隶”更适合此处带有自愿服事意味的语境。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“因为……而是……”清楚呈现否定与转折；“至于我们自己，则……”保留原文第二次ἑαυτούς所形成的对照。分号帮助普通读者辨认宣告的内容与使徒自我定位这两个并列层面。
