  text: Διὰ τοῦτο, ἔχοντες τὴν διακονίαν ταύτην καθὼς ἠλεήθημεν, οὐκ ⸀ἐγκακοῦμεν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/001.yaml
  text: Therefore, since we have this ministry, just as we have received mercy, we do not lose heart.
translation:
  language: zh_hans
  text: 因此，我们既有这项职分——正如我们曾蒙怜悯——就不灰心。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: 所以
  rationale: 承接前文所论新约事奉的荣光与圣灵的工作，自然表达推论关系。
- source_word: τὴν διακονίαν ταύτην
  choice: 这项事奉
  rationale: διακονία在本段指保罗等人受托承担的新约福音职分；“事奉”既保留服事含义，也符合现代中文教会语境，而“这项”明确其特指性。
- source_word: καθὼς ἠλεήθημεν
  choice: 既然蒙了怜悯
  rationale: 被动式保留上帝为施怜悯者的含意；在句法上与“领受了这项事奉”相连，表达他们蒙怜悯而获此职分。καθώς可表示与所述事实相应或基于该事实，中文用“既然”使逻辑自然，但不把怜悯仅限于任职行为。
- source_word: οὐκ ἐγκακοῦμεν
  choice: 就不灰心
  rationale: ἐγκακέω在此表示面对艰难不丧胆、不气馁；“不灰心”简洁、自然，并与上下文相合。
theological_decisions:
- issue: 蒙怜悯与领受事奉之间的关系
  choice: 我们既然蒙了怜悯，领受了这项事奉
  alternative: 我们既然领受了这项事奉，正如我们蒙了怜悯
  rationale: 希腊文καθὼς ἠλεήθημεν修饰拥有此事奉的方式或依据。所选语序清楚呈现事奉是出于怜悯，同时没有将“怜悯”缩减为单纯的任职资格。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“领受了这项事奉”比直译“有这事奉”更自然，也表达受托所得；全句保持简洁，并延续前文的推论语气。
