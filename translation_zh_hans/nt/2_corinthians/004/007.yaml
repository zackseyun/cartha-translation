  text: Ἔχομεν δὲ τὸν θησαυρὸν τοῦτον ἐν ὀστρακίνοις σκεύεσιν, ἵνα ἡ ὑπερβολὴ τῆς δυνάμεως ᾖ τοῦ θεοῦ καὶ μὴ ἐξ ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/007.yaml
  text: But we have this treasure in clay jars[b][a], so that the surpassing greatness of the power may be of God and not from us.
translation:
  language: zh_hans
  text: 然而，我们有这宝贝，放在瓦器里[a]，为要显明这超乎寻常的能力[b]是出于上帝，不是出于我们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“陶土器皿”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“这非同寻常的大能”或“这无比的大能”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔχομεν δὲ
  choice: 然而，我们有
  rationale: δὲ承接上文并带有转折意味，译作“然而”自然地保留这种对比；Ἔχομεν按现在时直译为“我们有”。
- source_word: τὸν θησαυρὸν τοῦτον
  choice: 这宝贝
  rationale: θησαυρός指珍贵之物；“宝贝”既符合现代汉语，也保留比喻，不在正文中把它解释为福音、真光或别的具体对象。
- source_word: ἐν ὀστρακίνοις σκεύεσιν
  choice: 放在瓦器里
  rationale: ὀστράκινος指陶土烧制的，σκεῦος指器皿或容器。“瓦器”简洁、庄重，并保留卑微、易碎的器皿意象；“放在”使汉语句法自然，并未进一步解释该比喻。
- source_word: ἵνα
  choice: 为要显明
  rationale: ἵνα引出目的，也可能兼有结果色彩。“为要”保留目的意味；补出“显明”使后面的归属判断在现代汉语中通顺，但不改变能力来源的重点。
- source_word: ἡ ὑπερβολὴ τῆς δυνάμεως
  choice: 这超凡的能力
  rationale: ὑπερβολή表示超过通常限度、非同寻常；“超凡的能力”自然传达能力的超越性，避免生硬照搬希腊语属格结构。
- source_word: ᾖ τοῦ θεοῦ καὶ μὴ ἐξ ἡμῶν
  choice: 是出于上帝，不是出于我们
  rationale: τοῦ θεοῦ在此与ἐξ ἡμῶν形成来源或归属上的对照。汉语统一译为“出于”，清楚保留能力源自上帝而非传道者自身的意思。
theological_decisions:
- issue: “宝贝”与“瓦器”比喻所指
  choice: 正文保留比喻，不明确解释“宝贝”或“瓦器”各自所指。
  alternative: 译成“福音的宝贝”或“我们脆弱的身体”。
  rationale: 上下文有助于理解比喻，但本节本身没有把对应对象明说；直接解释会缩小原文容许的表达空间。
- issue: ἵνα从句的目的与结果意味
  choice: 用“为要显明”表达主要的目的意味，同时容许结果含义。
  alternative: 纯结果式地译为“结果显明”。
  rationale: ἵνα在保罗书信中有时兼具结果色彩，但这里保留目的表达更贴近其语法形式，也不排除由此产生的结果。
- issue: 能力与上帝的关系
  choice: 译作“是出于上帝”，强调来源，并与“不是出于我们”平行。
  alternative: 译作“是属于上帝”或“是上帝的”。
  rationale: 希腊文前半使用属格，后半明确使用ἐξ表示来源。按汉语习惯统一成“出于”可清楚呈现对照，同时不引入能力与人的本体论区分等额外教义解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“宝贝”“瓦器”保留传统而仍通行的圣经意象；“超凡的能力”较自然地传达希腊文所强调的非凡程度。正文中的脚注标记[a]、[b]均置于相关词组之后。
