lexical_decisions:
- source_word: διωκόμενοι
  choice: 遭受迫害
  rationale: 该词在保罗书信的语境中指敌对者的追逼和压迫；“遭受迫害”既准确表达被动含义，也符合现代汉语习惯。
- source_word: ἐγκαταλειπόμενοι
  choice: 被遗弃
  rationale: 表达被撇下、被离弃的意思，措辞现代而庄重；不额外指明是谁没有遗弃他们，保留原文在本句中的含蓄。
- source_word: καταβαλλόμενοι
  choice: 被击倒
  rationale: 原词可指被扔倒、打倒或放倒；“被击倒”自然呈现冲突意象，并与下文“没有被毁灭”构成有力对照。
- source_word: ἀπολλύμενοι
  choice: 被毁灭
  rationale: 在与“被击倒”的对照中，该词表示彻底毁坏或灭亡；“被毁灭”保留被动形式和强烈的反差。
- source_word: ἀλλ’ οὐκ
  choice: 却没有
  rationale: 简洁保留原文两组否定性转折的平行结构和节奏。
theological_decisions:
- issue: ἐγκαταλειπόμενοι是否采用较具传统神学色彩的“被撇弃”
  choice: 被遗弃
  alternative: 被撇弃
  rationale: “被遗弃”准确、通俗且不削弱神没有离弃使徒同工的含义；同时避免仅凭传统措辞给本句添加原文未明确标示的互文色彩。
- issue: 是否明确补出没有遗弃他们的施事者是神
  choice: 不补出施事者
  alternative: 没有被神遗弃
  rationale: 上下文可使读者理解其神学含义，但希腊文本本句采用被动式，并未明说施事者；不补出可保存原文的表达张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“遭受迫害／被遗弃”和“被击倒／被毁灭”形成两组紧凑平行的对照；脚注标记紧随各自所说明的词语。
