id: 2CO.4.14
reference: 2 Corinthians 4:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἰδότες ὅτι ὁ ἐγείρας ⸀τὸν Ἰησοῦν καὶ ἡμᾶς ⸀σὺν Ἰησοῦ ἐγερεῖ καὶ παραστήσει σὺν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/014.yaml
  text: because we know that the one who raised Jesus will also raise us with Jesus and will present us with you[a].
translation:
  language: zh_hans
  text: 因为我们知道，那使耶稣[a]复活的，也必使我们与耶稣一同复活，并使我们和你们一同站在他面前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“主耶稣”。
    reason: textual_variant
lexical_decisions:
- source_word: εἰδότες
  choice: 因为我们知道
  rationale: 该完成时主动分词在上下文中说明保罗忍受患难的依据；用因果从句既体现其语篇功能，也符合现代汉语表达。
- source_word: ὁ ἐγείρας
  choice: 那使……复活的
  rationale: 带冠词的不定过去时分词指上帝；此译法保留原文的指称方式，并以自然汉语表达。
- source_word: τὸν Ἰησοῦν
  choice: 耶稣
  rationale: 遵循所给SBLGNT正文；异文“主耶稣”列入脚注。
- source_word: καὶ ἡμᾶς
  choice: 也必使我们……复活
  rationale: “也”保留καί的添加意义，将耶稣的复活与信徒将来的复活相连；“必”自然表达直陈式将来时所陈述的确信。
- source_word: σὺν Ἰησοῦ
  choice: 与耶稣一同
  rationale: σύν加与格表达联合、相伴；避免译成“借着耶稣”，以免加入原文没有明示的工具意义。
- source_word: παραστήσει
  choice: 使……站在他面前
  rationale: 该动词可指使人站立或把人呈到某位面前；此译法保留其末世性呈现的空间与临在意味，又不明确限定为某种特定审判场景。
- source_word: σὺν ὑμῖν
  choice: 和你们一同
  rationale: 准确表达共同相伴之意，突出保罗及其同工与哥林多信徒共享复活和被呈到上帝面前的盼望。
theological_decisions:
- issue: ἐγείρας之后的文本异文
  choice: 正文采用“耶稣”
  alternative: “主耶稣”
  rationale: 所给SBLGNT正文为τὸν Ἰησοῦν；“主耶稣”是有抄本支持的较长读法，故在脚注中保留，不让文本问题被误当作教义判断。
- issue: παραστήσει的末世论含义
  choice: 译作“使我们和你们一同站在他面前”
  alternative: 笼统译作“使我们和你们一同得着伸冤”，或明确限定为站在基督审判台前
  rationale: 上下文中的复活盼望支持将此理解为将来被带到上帝面前；译文不进一步规定确切场景，以保留原文的宽度与张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“复活”按现代汉语惯用法分别用于及物结构“使……复活”。用“站在他面前”呈现παρίστημι的具体意象，同时避免生硬的“呈献”或过度解释为特定法庭程序。
