  text: ἀεὶ γὰρ ἡμεῖς οἱ ζῶντες εἰς θάνατον παραδιδόμεθα διὰ Ἰησοῦν, ἵνα καὶ ἡ ζωὴ τοῦ Ἰησοῦ φανερωθῇ ἐν τῇ θνητῇ σαρκὶ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/011.yaml
  text: For we who are living are always being handed over to death for Jesus’ sake[b][a], so that the life of Jesus also may be revealed in our mortal flesh.
translation:
  language: zh_hans
  text: 因为我们这些活着的人总是为耶稣的缘故[a]被交给死亡，好使耶稣的生命也在我们这必死的肉身中[b]显明出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为耶稣”，或“为着耶稣”。
    reason: lexical_alternative
  - marker: b
    text: 这里的“肉身”指终必死亡的身体存在，并非“罪性”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀεὶ
  choice: 总是
  rationale: 表达持续或反复发生的处境，保留原文强调的一贯性。
- source_word: γάρ
  choice: 因为
  rationale: 承接上一节并说明其缘由；现代汉语用“因为”能自然呈现解释关系。
- source_word: ἡμεῖς οἱ ζῶντες
  choice: 我们这些活着的人
  rationale: 保留实词化现在分词的持续意味，也凸显“活着”与下文“死亡”的对照。
- source_word: εἰς θάνατον
  choice: 给死亡
  rationale: 与“被交”连用，表达被交出去、面临死亡这一归向或结果，不把含义缩窄为已经被处死。
- source_word: παραδιδόμεθα
  choice: 被交
  rationale: 保留现在时被动语态及持续、反复遭受的意味，也保留原文未明说行动者的特点。
- source_word: διὰ Ἰησοῦν
  choice: 为耶稣的缘故
  rationale: διά加宾格在此表示原因或缘故；这一译法自然表达他们因耶稣而遭受死亡威胁，同时以脚注保留其他可行措辞。
- source_word: ἵνα
  choice: 好使
  rationale: 呈现目的—结果关系，又不强行排除其中任何一面。
- source_word: καὶ
  choice: 也
  rationale: 保留与前文受死处境相呼应的附加和对应关系。
- source_word: ἡ ζωὴ τοῦ Ἰησοῦ
  choice: 耶稣的生命
  rationale: 直接保留属格结构及“生命”与“死亡”的神学对照。
- source_word: φανερωθῇ
  choice: 显明出来
  rationale: 自然表达被动虚拟式的意义，不擅自补出使其显明的行动者。
- source_word: ἐν τῇ θνητῇ σαρκὶ ἡμῶν
  choice: 在我们这必死的肉身上
  rationale: “肉身”保留σάρξ的具体身体含义，“必死的”表达会死亡、会朽坏的性质；“在……上”符合汉语表达生命借身体处境显露出来的方式。
theological_decisions:
- issue: 保罗书信中σάρξ在本节的含义
  choice: 肉身
  alternative: 身体；罪性
  rationale: “必死的”明确限定这里所指的是脆弱、终必死亡的身体存在，而不是伦理意义上的犯罪倾向。“肉身”既保留保罗的用词特色，也避免误译为“罪性”。
- issue: διὰ Ἰησοῦν所表达的关系
  choice: 为耶稣的缘故
  alternative: 因为耶稣；为着耶稣
  rationale: 原文διά加宾格可表示原因或缘故；正文采用自然且包含忠于耶稣而受苦之意的译法，脚注保留其措辞上的开放性。
- issue: ἵνα从句的目的与结果张力
  choice: 好使
  alternative: 以致
  rationale: “好使”保留较明显的目的意味，同时上下文也容许结果色彩；不把这层关系单纯化为偶然结果。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。句式保留“活着—死亡—生命—必死”的密集对照；使用“被交”维持原文被动语态，用“显明出来”使汉语自然，同时不补出原文未明说的行动者。
