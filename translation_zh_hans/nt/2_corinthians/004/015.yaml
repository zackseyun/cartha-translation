  text: τὰ γὰρ πάντα δι’ ὑμᾶς, ἵνα ἡ χάρις πλεονάσασα διὰ τῶν πλειόνων τὴν εὐχαριστίαν περισσεύσῃ εἰς τὴν δόξαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/015.yaml
  text: For all things are for your sake[a], so that as grace increases through more and more people, thanksgiving may overflow to the glory of God.
translation:
  language: zh_hans
  text: 因为这一切都是为了你们，好让恩典借着越来越多的人[a]而增多，使感恩更加洋溢，归荣耀给上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“借着许多人”或“借着更多的人”。希腊文可泛指许多人，也可指人数不断增加。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ πάντα
  choice: 这一切
  rationale: 带冠词的中性复数是概括性表达；“这一切”自然承接上文，同时保留其广泛含义。
- source_word: γὰρ
  choice: 因为
  rationale: 该连词说明前文所述之事的根据；句首用“因为”清楚保留解释和论证作用。
- source_word: δι’ ὑμᾶς
  choice: 为了你们
  rationale: διά加宾格在此表示受益或目的；“为了你们”比“因为你们”更准确地传达使读者受益之意。
- source_word: ἵνα
  choice: 好让
  rationale: 兼顾目的与结果意味；“好让”是自然的现代汉语，也保留目的从句的语气。
- source_word: ἡ χάρις
  choice: 恩典
  rationale: 保留该词在本段中所指的上帝恩惠与恩寸运行，不将其限定为某一种更狭窄的神学机制。
- source_word: πλεονάσασα
  choice: 增长
  rationale: 分词表示恩典增多、扩展；汉语用谓语“增长”可自然表达其动态，并与后面的主要动词衔接。
- source_word: διὰ τῶν πλειόνων
  choice: 借着越来越多的人
  rationale: 比较级的实体化表达在语境中可指人数增加；此译突出扩展之势，同时以脚注保留“众人”或“更多的人”等可能。
- source_word: τὴν εὐχαριστίαν
  choice: 感恩
  rationale: 指向上帝的感谢；“感恩”在现代汉语中简洁自然，也适合本节庄重语体。
- source_word: περισσεύσῃ
  choice: 越发洋溢
  rationale: 该动词有丰盛、增多乃至满溢之意；“越发洋溢”既保留丰富意象，也与“感恩”自然搭配。
- source_word: εἰς τὴν δόξαν τοῦ θεοῦ
  choice: 使上帝得荣耀
  rationale: εἰς表示目标或结果；此译以自然汉语表达感恩最终归向上帝荣耀的结果。
theological_decisions:
- issue: 目的从句中“恩典”的所指与作用
  choice: 保留“恩典”为在保罗事工及其扩展中运行的上帝恩惠，不进一步限定其机制。
  alternative: 可专指临到更多领受者的救恩之恩，或指促使感谢增多的恩惠。
  rationale: 本节本身没有要求在这些相近含义之间作排他选择；译文应保留其神学广度。
- issue: 恩典增长、人数增多与感恩洋溢之间的句法关系
  choice: 译作恩典借着越来越多的人增长，从而使感恩越发洋溢。
  alternative: 也可理解为恩典增多以后，感恩借着更多的人而越发充盈。
  rationale: 希腊语中分词短语及介词短语的结合存在一定张力；正文采用最顺畅且符合语序的理解，脚注则保留人数表达本身的歧义，不额外断定更细的神学因果机制。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“这一切”自然承接上下文；“好让……使……”理清希腊语较密集的目的与结果结构；“上帝”依人民开放圣经的现代公共语体处理。
