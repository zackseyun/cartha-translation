  text: τὸ γὰρ παραυτίκα ἐλαφρὸν τῆς θλίψεως ⸀ἡμῶν καθ’ ὑπερβολὴν εἰς ὑπερβολὴν αἰώνιον βάρος δόξης κατεργάζεται ἡμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/017.yaml
  text: For our momentary light affliction is producing for us an eternal weight of glory beyond all comparison,[a]
translation:
  language: zh_hans
  text: 因为我们这短暂而轻微的患难，正在为我们成就无比厚重、永恒的荣耀。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以超乎一切的程度。”希腊文直译为“照着超越，进入超越”，是重复用语，用来强调程度极其超越。
    reason: lexical_alternative
lexical_decisions:
- source_word: παραυτίκα
  choice: 眼前这短暂
  rationale: 该词表示只限于当下、为时短暂；译文兼顾“眼前”与“短暂”，并与后文“永恒”形成鲜明对照。
- source_word: ἐλαφρὸν
  choice: 轻微
  rationale: “轻微”自然描述患难，同时保留与 βάρος 所表达之“厚重”的修辞对照；这不是否认患难本身的痛苦，而是按永恒荣耀作比较。
- source_word: θλίψεως
  choice: 患难
  rationale: θλῖψις 指压力、困苦或苦难；“患难”庄重、通俗，也不额外限定为某一种末世事件。
- source_word: ἡμῶν
  choice: 我们
  rationale: 属格表明这是保罗及其同工所遭受的患难；译入“我们……的患难”所对应的现代汉语结构中。
- source_word: καθ’ ὑπερβολὴν εἰς ὑπερβολὴν
  choice: 无比
  rationale: 原文重复 ὑπερβολή，极力强调超越寻常尺度。汉语“无比”简洁传达这种极度超越的程度，脚注说明其字面形式及另一译法。
- source_word: αἰώνιον
  choice: 永恒
  rationale: 在与眼前短暂无常的患难对照时，“永恒”准确表达持续不止、属于将来永恒秩序的含义。
- source_word: βάρος
  choice: 厚重
  rationale: 用“厚重”保留与“轻微”的重量意象和对照，又避免把荣耀说成压人的“重担”。
- source_word: δόξης
  choice: 荣耀
  rationale: 保留保罗用语中的神学内涵，不缩减为仅仅可见的光彩或辉煌。
- source_word: κατεργάζεται
  choice: 正在……成就
  rationale: 现在时体现持续发生的有效作用；“成就”表达带来结果，而不把患难本身解释为赚取救恩的功劳。
- source_word: ἡμῖν
  choice: 为我们
  rationale: 此与格最自然地表示受益者，即荣耀是为我们而成就的；避免译成“在我们里面”，以免擅自限定为内在品格的塑造。
- source_word: τὸ ... ἐλαφρὸν τῆς θλίψεως ἡμῶν
  choice: 我们眼前这短暂、轻微的患难
  rationale: 按现代汉语语序重组带冠词的短语，完整保留所属关系、短暂性和轻微性。
theological_decisions:
- issue: 患难与荣耀之间的关系
  choice: 译作患难“正在为我们成就”永恒荣耀，保留原文所说的作用与结果关系，但不解释为人凭受苦赚取救恩。
  alternative: 把经文理解为患难凭人的功劳赚得荣耀，或只理解为当下内在品格的成长。
  rationale: “短暂”与“永恒”的对照指向将来的荣耀；κατεργάζεται 表达有效结果，却没有说明这种结果基于人的功德。译文保留原有张力，不加入经文本身未明说的因果体系。
- issue: “轻微”是否淡化现实中的痛苦
  choice: 保留“轻微”，使其与荣耀的“厚重”形成原文的修辞对照。
  alternative: 为避免听来淡化痛苦而改译为一般性的“患难”。
  rationale: 保罗是在与无比且永恒的荣耀相比较时称患难为轻，并非断言患难本身没有分量；保留这一对照对理解句意至关重要。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“短暂、轻微”与“永恒而无比厚重”形成清晰对照；“厚重的荣耀”保留原文重量隐喻，同时比“荣耀的重量”更符合自然汉语。
