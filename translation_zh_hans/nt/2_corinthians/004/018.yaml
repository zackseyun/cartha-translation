id: 2CO.4.18
reference: 2 Corinthians 4:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: μὴ σκοπούντων ἡμῶν τὰ βλεπόμενα ἀλλὰ τὰ μὴ βλεπόμενα, τὰ γὰρ βλεπόμενα πρόσκαιρα, τὰ δὲ μὴ βλεπόμενα αἰώνια.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/018.yaml
  text: as we look not to the things that are seen but to the things that are not seen. For the things that are seen are temporary[a], but the things that are not seen are eternal.
translation:
  language: zh_hans
  text: 我们不注目于所看见的，而注目于所看不见的[a]；因为所看见的是暂时的，所看不见的却是永恒的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“可见的事物……不可见的事物”。
    reason: 说明冠词化分词可以用较名词化的方式表达，同时不改变原文的可见与不可见之对照。
lexical_decisions:
- source_word: σκοπούντων
  choice: 所注目的
  rationale: 这里表示把注意力或目光对准某个对象。“注目”保留了视觉比喻，也包含专注关注的意思；以“我们所注目的”表达属格分词在上下文中的伴随情形。
- source_word: μὴ
  choice: 不是
  rationale: 直接否定“注目”的对象，没有加入原文并不含有的“不再”等时间意味。
- source_word: τὰ βλεπόμενα
  choice: 所看见的
  rationale: 原文是中性复数冠词化分词，泛指可见的事物或现实。“所看见的”保留其开放性，并与下文形成工整重复。
- source_word: ἀλλὰ
  choice: 而是
  rationale: 与前面的“不是”搭配，清楚表达强烈的对照关系。
- source_word: τὰ μὴ βλεπόμενα
  choice: 所看不见的
  rationale: 保留与“所看见的”相同的结构和修辞平行，不擅自解释为“属灵的”或其他特定类别。
- source_word: γὰρ
  choice: 因为
  rationale: 引出前述注目对象之所以不同的理由，明确保留保罗论证中的解释关系。
- source_word: πρόσκαιρα
  choice: 暂时的
  rationale: 表示只持续有限时间，与“永恒的”构成直接对照；避免译成“片刻的”，因为那会比本词本身更加强调短促。
- source_word: δέ
  choice: 却
  rationale: 标明后一分句与前一分句的鲜明反差，中文表达自然。
- source_word: αἰώνια
  choice: 永恒的
  rationale: 在与“暂时的”对照的语境中，指持续而不终止、属于永恒领域的现实；“永恒的”是自然且准确的现代汉语表达。
- source_word: ἡμῶν
  choice: 我们
  rationale: 形式上是与分词相连的属格代词，在汉语中自然处理为分词性语句的主语“我们”。
theological_decisions:
- issue: 可见与不可见之对照的表达
  choice: 保留“所看见的……所看不见的”这一具体而开放的说法
  alternative: 译作“可见的事物……不可见的事物”，或解释成“物质的……属灵的”
  rationale: 保罗在此对照可见与不可见的现实，却没有明确把二者等同于哲学意义上的物质与属灵范畴。保留原文用语可避免替经文消解其神学张力。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“注目”既自然又保留原文视觉意象；全句以“不是……而是”和“……却……”呈现原文严整的对比结构。
