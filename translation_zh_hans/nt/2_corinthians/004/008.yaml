base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/008.yaml
  text: We are afflicted in every way[a], but not crushed; perplexed[c][b], but not driven to despair.
translation:
  language: zh_hans
  text: 我们在各方面都受压[a]，却不至困顿[b]；心里困惑，却不至绝望[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在一切事上受压”。这里强调所受压力范围全面，并非指四周的空间。
    reason: lexical_alternative
  - marker: b
    text: 原文含“被挤进狭窄之处、受到限制”的意思；也可译“却不至于无路可走”或“却没有被压垮”。
    reason: lexical_alternative
  - marker: c
    text: 也可译“却没有完全走投无路”。原文的复合动词强化前面的“困惑”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν παντί
  choice: 在各方面
  rationale: 这里表示处境或范围的全面性，而非字面上的空间环绕；“在各方面”自然地保留了这一广泛范围。
- source_word: θλιβόμενοι
  choice: 受压迫
  rationale: θλίβω 表示承受压力、患难或苦楚；“受压迫”既保留压力意象，也适合保罗所述的使徒苦难。
- source_word: στενοχωρούμενοι
  choice: 被困住
  rationale: 该词带有陷入狭窄之处、受到限制而无活动余地的意象；“被困住”与前面的“受压迫”形成清楚而不重复的对照。
- source_word: ἀπορούμενοι
  choice: 心里困惑
  rationale: 该词表示茫然、不知如何是好；补出“心里”使现代汉语表达自然，但不把它限定为纯粹理智上的疑问。
- source_word: ἐξαπορούμενοι
  choice: 绝望
  rationale: 复合形式加强前一动词，表示彻底走投无路或失去指望；“绝望”简明地传达被否定的极端状态。
- source_word: ἀλλ’ οὐ ... ἀλλ’ οὐκ
  choice: 却没有……却没有
  rationale: 重复“却没有”保留原文两组鲜明的逆转和整齐节奏。
theological_decisions:
- issue: ἐξαπορούμενοι 的强化程度
  choice: 译作“没有绝望”，与“心里困惑”形成由困惑到绝境的递进。
  alternative: 译作“并非完全走投无路”，更直接保留与 ἀπορούμενοι 相同的词根关系。
  rationale: 原文描述使徒在苦难中的极端压力及仍未被逼至绝境，并非在建立有关心理状态或信心是否丧失的专门教义；“没有绝望”保留力度而不过度阐释。
- issue: 第一组对比中的空间隐喻
  choice: 以“受压迫／被困住”表达外在压力与未被限制到无路可走的对照。
  alternative: 译作“遭受患难／却没有被压垮”，更偏重结果而弱化狭窄空间的意象。
  rationale: στενοχωρούμενοι 本身含狭窄、受困的意象；“被困住”较能保留词义联系，同时避免把原文明确解释为完全崩溃。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。两组分句以“却没有”保持保罗原文的对偶节奏；避免生硬直译，也不把苦难中的韧性扩展为超出经文的教义断言。
