  text: ὅτι ὁ θεὸς ὁ εἰπών· Ἐκ σκότους φῶς ⸀λάμψει, ὃς ἔλαμψεν ἐν ταῖς καρδίαις ἡμῶν πρὸς φωτισμὸν τῆς γνώσεως τῆς δόξης τοῦ θεοῦ ἐν προσώπῳ ⸀Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/006.yaml
  text: For God[a], who said[c][b], “Light will shine out of darkness,” has shone in our hearts for the illumination of the knowledge of the glory of God in the face of Messiah.
translation:
  language: zh_hans
  text: 因为那位说“光要从黑暗中照出来”[a]的上帝，已经照进我们心里，为要使我们因认识显在基督[b]面容上的上帝的荣耀而得着光照。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这句话呼应《创世记》1:3，以创造时的光描写上帝使人认识他的工作。
    reason: cross_reference
  - marker: b
    text: “基督”是称号，意思是“受膏者”，相当于“弥赛亚”。
    reason: lexical_alternative
  - marker: c
    text: “在基督面容上”也可理解为“在基督身上”；直译“面容”保留了上帝荣耀显现的具体意象。
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 本句说明上一节论述的根据；译作“因为”清楚保留因果关系。
- source_word: ὁ θεὸς ὁ εἰπών
  choice: 那位说……的上帝
  rationale: 用现代汉语关系结构表达带冠词的分词短语，既忠实又自然。
- source_word: Ἐκ σκότους φῶς λάμψει
  choice: 光要从黑暗中照出来
  rationale: 保留ἐκ“从……中”和将来时λάμψει，并维持创造之光的意象。
- source_word: ὃς ἔλαμψεν ἐν ταῖς καρδίαις ἡμῶν
  choice: 已经在我们心里照耀
  rationale: 让“上帝”继续作不及物动词“照耀”的主语，避免改写成单纯“照亮我们的心”；“心里”保留指向内在生命的圣经意象。
- source_word: πρὸς φωτισμὸν τῆς γνώσεως
  choice: 使我们得到光照，认识
  rationale: 以自然的汉语展开抽象名词和属格结构，同时保留“光照”与“认识”两层含义。
- source_word: τῆς δόξης τοῦ θεοῦ
  choice: 上帝……所显出的荣耀
  rationale: 保留“上帝的荣耀”这一核心关系，并与后面的介词短语自然衔接。
- source_word: ἐν προσώπῳ Χριστοῦ
  choice: 在基督面容上
  rationale: πρόσωπον的直接含义是“脸、面容”；上下文中的光和荣耀支持具体形象。“基督”是现代中文读者熟悉且庄重的称谓。
theological_decisions:
- issue: Χριστοῦ的译法
  choice: 基督
  alternative: 受膏者；弥赛亚
  rationale: 此处Χριστός带有称号意义；正文采用现代中文基督教语境中最通行的“基督”，脚注说明其称号含义，不把它仅当作无意义的专名。
- issue: ἐν προσώπῳ Χριστοῦ的含义
  choice: 在基督面容上
  alternative: 在基督身上
  rationale: 正文保留“面容”的具体意象，与“照耀”和“荣耀”呼应；脚注保留该短语可较宽泛地指基督本人这一理解，不排除原文的语义张力。
- issue: πρὸς φωτισμὸν τῆς γνώσεως的关系
  choice: 使我们得到光照，认识
  alternative: 发出认识……的光
  rationale: 原文紧密的名词—属格结构在汉语中容易生硬；正文以并列相承的动词表达其目的和结果，却不把“光照”与“认识”割裂。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“已经在我们心里照耀”刻意保留上帝亲自照耀这一语法形象；后半句适度展开希腊语抽象名词链，使普通读者能够顺畅理解，同时用脚注保留重要的词义选择。
