  text: εἰ δὲ καὶ ἔστιν κεκαλυμμένον τὸ εὐαγγέλιον ἡμῶν, ἐν τοῖς ἀπολλυμένοις ἐστὶν κεκαλυμμένον,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/003.yaml
  text: And even if our gospel is veiled[a], it is veiled among those who are perishing,
translation:
  language: zh_hans
  text: 即使我们的福音是被帕子遮蔽的，对那些正在灭亡的人而言，它是被遮蔽的[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“在那些正在灭亡的人中间”；也可译“对那些正在灭亡的人来说”。“正在灭亡的人”也可译“失丧的人”。
    reason: 保留ἐν的范围／关系两种可能表达，并说明ἀπολλυμένοις可有较静态的替代译法。
lexical_decisions:
- source_word: εἰ δὲ καὶ
  choice: 即使
  rationale: 以自然的现代汉语表达条件兼让步语气；上下文的承接或轻微转折由语境体现，避免生硬地叠加“但/而且”。
- source_word: κεκαλυμμένον
  choice: 蒙着帕子
  rationale: 保留完成时被动分词所表达的受遮蔽状态，也延续3:14—16关于帕子的上下文隐喻；比单说“隐藏”更具体。
- source_word: τὸ εὐαγγέλιον ἡμῶν
  choice: 我们的福音
  rationale: 保留ἡμῶν的所有格形式，并采用现代汉语基督教语境中简明而通行的“福音”。
- source_word: ἐν τοῖς ἀπολλυμένοις
  choice: 在那些正在灭亡的人中间
  rationale: 将ἐν首先理解为空间或群体范围的“在……中间”；用“正在灭亡”保留现在分词所呈现的持续状态或过程，不将其静态化为“失丧的人”。
- source_word: ἐστὶν κεκαλυμμένον
  choice: 也只是在……中间蒙着
  rationale: 保留原文第二次重复“蒙着”的强调；“只”自然表达该遮蔽状态所限定的范围，但不说明遮蔽的最终原因。
theological_decisions:
- issue: ἀπολλυμένοις在保罗救恩论语境中的性质
  choice: 那些正在灭亡的人
  alternative: 那些失丧的人
  rationale: “正在灭亡”保留现在分词所含的过程性及其神学张力，避免把原文提前定型为纯粹静态的身份标签。
- issue: 福音被遮蔽的适用范围
  choice: 在那些正在灭亡的人中间
  alternative: 对那些正在灭亡的人来说
  rationale: 主译以“中间”保留ἐν的群体范围意义；“对……来说”虽符合语境，也可能把表达更明确地解释为感知或关系层面，因此列入脚注。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“蒙着帕子”承接前文的帕子意象；句末重复“蒙着”，对应原文有意的重复。
