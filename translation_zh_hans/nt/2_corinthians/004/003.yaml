  to: 即使我们的福音是被帕子遮蔽的，对那些正在灭亡的人而言，它是被遮蔽的[a]。
  rationale: 删除无明示根据的“只”，并调整第二分句语序，使中文自然地表达原文重复的“被遮蔽”及其与“正在灭亡的人”的关系。保留“帕子”意象、所有格“我们的”、以及ἀπολλυμένοις的过程性；脚注继续标示ἐν和该分词的可行替代译法。
