  text: Ἔχοντες δὲ τὸ αὐτὸ πνεῦμα τῆς πίστεως, κατὰ τὸ γεγραμμένον· Ἐπίστευσα, διὸ ἐλάλησα, καὶ ἡμεῖς πιστεύομεν, διὸ καὶ λαλοῦμεν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/013.yaml
  text: But having the same spirit of faith[a], according to what is written, “I believed; therefore I spoke,” we also believe; therefore we also speak[b],
translation:
  language: zh_hans
  text: 但我们既有同样的信心之灵[a]，正如经上所记：“我信了，所以我说了。”我们也信，所以也说话[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “信心之灵”也可理解为“同一位信心的圣灵”；希腊文πνεῦμα在这里既可能指共同的、充满信心的内在精神，也可能指圣灵。
    reason: alternative_reading
  - marker: b
    text: 保罗引用《诗篇》116:10（七十士译本115:1），把自己因信而说话与诗人的见证联系起来。
    reason: cross_reference
lexical_decisions:
- source_word: Ἔχοντες δὲ
  choice: 但我们既有
  rationale: 分词ἔχοντες与后面的主要动词相连；“既有”保留其附属关系，也让中文句势自然，而不把因果意味说得过强。δέ在上下文中表示轻微转折或推进，译作“但”。
- source_word: τὸ αὐτὸ πνεῦμα τῆς πίστεως
  choice: 同样信心的灵
  rationale: 直译属格结构，并用“灵”而非明确的“圣灵”，保留πνεῦμα可指信心所形成的共同内在精神，也可被理解为圣灵的歧义。
- source_word: κατὰ τὸ γεγραμμένον
  choice: 正如经上所记
  rationale: 这是引介经文的固定表达；此译法庄重、自然，并体现所引话语已经写在经上。
- source_word: Ἐπίστευσα, διὸ ἐλάλησα
  choice: 我信了，所以说话
  rationale: 分别直接对应πιστεύω、διό和λαλέω，保留“相信—说话”的逻辑关系与简洁平行。
- source_word: καὶ ἡμεῖς πιστεύομεν, διὸ καὶ λαλοῦμεν
  choice: 我们也信，所以也说话
  rationale: 两个“也”体现强调代词ἡμεῖς及两个καί所表达的对应关系，使保罗的话与诗人的见证形成平行。
theological_decisions:
- issue: πνεῦμα是指圣灵，还是指共同的信心精神或内在倾向
  choice: 正文作“信心的灵”，不明说“圣灵”
  alternative: “同一位赐信心的圣灵”或“同样充满信心的精神”
  rationale: 希腊文本本身没有足以排除任一理解的标记；正文采用较形式对应的表达，并由脚注说明另一种可能，以保留神学张力。
- issue: πιστεύω词组的翻译
  choice: “信了／信”
  alternative: “信靠了／信靠”
  rationale: “信”直接对应πιστεύω，也与“信心”保持词族联系；在此引文和保罗的应用中均简洁自然。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“正如经上所记”符合中文圣经引文语体；“我信了，所以说话／我们也信，所以也说话”保留原文鲜明的平行结构。
