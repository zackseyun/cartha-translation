  text: ὥστε ⸀ὁ θάνατος ἐν ἡμῖν ἐνεργεῖται, ἡ δὲ ζωὴ ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/012.yaml
  text: So then[a], death is at work in us, but life in you.
translation:
  language: zh_hans
  text: 所以，死亡在我们身上发挥作用，生命却在你们身上发挥作用。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“所以，死在我们里面起作用，生命却在你们里面起作用。”
    reason: “ἐν”可按语境译为“在……里面”；“ἐνεργεῖται”可译为“起作用”。此译文保留原文可能带有的内在、有效运作之意。
lexical_decisions:
- source_word: ὥστε
  choice: 这样
  rationale: 此处承接4:8–11所述使徒受苦而耶稣的生命显明出来的情形，引出结果或结论。“这样”自然简洁，也保留ὥστε可表达的推论色彩。
- source_word: ὁ θάνατος
  choice: 死
  rationale: 这里是抽象而具作用力的“死”，指保罗等人在使徒服事中承受的死亡处境；现代汉语用“死”比“死亡”更能与下文“生命”形成凝练对举。
- source_word: ἐν ἡμῖν
  choice: 在我们身上
  rationale: ἐν可指在某人里面或身上发生作用。结合前文“必死的身体”，译作“在我们身上”既自然，又保留身体经验和群体层面的含义。
- source_word: ἐνεργεῖται
  choice: 运行
  rationale: 该动词表示持续产生实际效力。“运行”保留主动发挥作用的意味，并可同时搭配“死”和省略谓语后的“生命”。
- source_word: ἡ δὲ ζωὴ
  choice: 生命却
  rationale: δέ在此标明“死”与“生命”的鲜明对照，故用“却”；不将“生命”解释为某一种狭义生命，以保留上下文的神学张力。
- source_word: ἐν ὑμῖν
  choice: 在你们身上
  rationale: 与“在我们身上”保持严格平行；“你们”是复数，既可指哥林多信徒群体，也不排除生命在个人身上的作用。
theological_decisions:
- issue: “死”与“生命”的对照所指为何
  choice: 保留简洁的“死”与“生命”，让“死”指向使徒所承受的死亡性苦难，并让“生命”指向借着其服事在哥林多人中发生作用的生命，而不把二者限定为纯身体或纯属灵意义。
  alternative: 将其明确解释为使徒肉身受苦与哥林多人所得的属灵生命，或解释为使徒向己死而哥林多人得永生。
  rationale: 4:10–11同时谈到耶稣的死与生命在使徒身体上的显明，而本段整体又关乎使徒服事使别人得益处。直译核心意象最能保留这些彼此交织的层面。
- issue: ἐνεργεῖται的语态及其隐含施事者
  choice: 译为不指明施事者的“运行”，不补出是神、苦难或使徒使死与生命发生作用。
  alternative: 译为“神使死在我们身上发动，却使生命在你们身上发动”。
  rationale: 希腊文没有明说施事者，且该中间/被动形式在这里重点是死与生命正在发挥效力。补出施事者会超出原文并缩小歧义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。主句保留希腊文简短有力的对偶结构；后半句虽可依汉语习惯省略“运行”，但为避免造成静态断句并清楚表达同一动词同时支配“死”和“生命”，予以重复。脚注标记置于整句之后。
