base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/015.yaml
  text: 'as it is written: The one who had much did not have too much[a], and the one who had little did not have too little.'
translation:
  language: zh_hans
  text: 正如经上所记：“那拥有许多的，没有多余[a]；那拥有少许的，也没有缺乏。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译，按《出埃及记》16:18的语境更直译为：“多收的没有剩余，少收的也没有缺乏。”
    reason: 提供受原引文语境补足省略动词“收取”的另一译法。
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: 正如经上所记
  rationale: 这是引述圣经的惯用语；“经上所记”自然体现希腊语完成时所表达的、至今有效的书面见证。
- source_word: Ὁ τὸ πολὺ
  choice: 那有许多的
  rationale: 冠词加中性形容词在此作名词性用法，直指“有许多的那个人”。保罗的引文没有明说“收取”，因此正文不从《出埃及记》的上下文补入该动词。
- source_word: ἐπλεόνασεν
  choice: 没有多余
  rationale: πλεονάζω可指增多、富余或有剩余；在此与后半句形成对称，表示最终并无过量的盈余。
- source_word: ὁ τὸ ὀλίγον
  choice: 那有少许的
  rationale: 与Ὁ τὸ πολὺ平行，保留数量对比，同时避免加入希腊文未明说的“收取”。
- source_word: ἠλαττόνησεν
  choice: 没有缺乏
  rationale: ἐλαττονέω在此表示不足、短缺；“没有缺乏”既简洁自然，也与“没有多余”构成清楚的对偶。
theological_decisions:
- issue: 保罗在论述均衡供应时引用《出埃及记》16:18
  choice: 正文按保罗所引希腊文呈现最终拥有或分配的结果，不明确补入“收取”。
  alternative: “多收的没有剩余，少收的也没有缺乏。”
  rationale: 保罗借这段经文说明物质供应中的均衡；正文保留其当下应用，也不把原引文背景中隐含的动作写成明说内容。脚注则交代与《出埃及记》背景更贴近的译法。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“许多／少许”保留原文的数量对照，“多余／缺乏”形成简明对偶。正文中的[a]与脚注对应。
