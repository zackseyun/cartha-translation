  text: γινώσκετε γὰρ τὴν χάριν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὅτι δι’ ὑμᾶς ἐπτώχευσεν πλούσιος ὤν, ἵνα ὑμεῖς τῇ ἐκείνου πτωχείᾳ πλουτήσητε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/009.yaml
  text: For you know the grace of our Lord Jesus Christ[a], that though he was rich, yet for your sake he became poor[b], so that you by his poverty might become rich.
translation:
  language: zh_hans
  text: 因为你们知道我们主耶稣基督[a]的恩典：他虽然富足，却为了你们变得贫穷，好使你们因着他的贫穷变得富足。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “基督”意为“受膏者”，也可译作“弥赛亚”。
    reason: alternative_reading
lexical_decisions:
- source_word: γινώσκετε
  choice: 你们知道
  rationale: 现在时主动直陈语气第二人称复数；保罗诉诸哥林多人已有的认识，译为“你们知道”自然准确。
- source_word: χάριν
  choice: 恩典
  rationale: χάρις可指恩典、恩惠或慷慨的施予。此处既指基督施恩的行动，也在上下文中成为慷慨奉献的典范；“恩典”保留其神学分量和伦理含义。
- source_word: κυρίου
  choice: 主
  rationale: κύριος在此是对耶稣的尊称，表达权柄并具有基督论分量；“主”是现代汉语圣经语体中自然、准确的对应词。
- source_word: Ἰησοῦ Χριστοῦ
  choice: 耶稣基督
  rationale: Χριστός本义为“受膏者”，即“弥赛亚”；正文采用现代汉语读者最熟悉的称谓“耶稣基督”，脚注说明其称号含义和另一译法。
- source_word: δι’ ὑμᾶς
  choice: 为了你们
  rationale: διά接宾格在此表达受益或缘故；“为了你们”清楚传达基督行动以他们为受益对象的含义。
- source_word: ἐπτώχευσεν
  choice: 变得贫穷
  rationale: πτωχεύω是不及物动词，表示成为贫穷；“变得贫穷”既准确表达状态转变，也不额外规定其具体方式。
- source_word: πλούσιος ὤν
  choice: 本来富足
  rationale: 分词结构在语境中带有让步和对比意味；“本来富足，却……”以自然汉语呈现这一对照，同时不界定“富足”的具体所指。
- source_word: τῇ ἐκείνου πτωχείᾳ
  choice: 因他的贫穷
  rationale: 与格在此表示途径或凭借；“因他的贫穷”自然表达信徒借着基督的贫穷而受益。
- source_word: πλουτήσητε
  choice: 变得富足
  rationale: ἵνα之后的虚拟语气表达目的或结果；“好使……变得富足”保留这种关系，并与前面的“变得贫穷”形成原文刻意的反义平行。
theological_decisions:
- issue: 基督的“富足”“贫穷”以及信徒“变得富足”的具体含义
  choice: 正文保留富足与贫穷的比喻，不限定为某一种神学解释。
  alternative: 可具体解释为基督降世前的神圣荣耀、弥赛亚身份的尊荣、道成肉身与受难中的自我降卑，或信徒所得的救恩福分及群体慷慨生活。
  rationale: 希腊文本本身没有在本节明确界定这些词的所指。该比喻既指向基督的自我施予，也服务于上下文关于慷慨奉献的劝勉；译文应保留这种神学张力，而不擅自缩窄。
- issue: ὅτι与前文“恩典”的关系
  choice: 用冒号引出对这恩典的说明。
  alternative: 可译为“就是”或以逗号连接。
  rationale: ὅτι在此引出“恩典”的具体内容。汉语使用冒号能清楚表达解释关系，同时不改变命题内容。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“恩典”“主”“基督”等沿用读者熟悉的圣经核心词汇；句式以“本来……却……好使……”清楚呈现原文的让步、对比和目的关系。
