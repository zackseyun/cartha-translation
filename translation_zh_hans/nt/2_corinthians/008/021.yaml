  text: ⸂προνοοῦμεν γὰρ⸃ καλὰ οὐ μόνον ἐνώπιον κυρίου ἀλλὰ καὶ ἐνώπιον ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/021.yaml
  text: For we take thought for what is good[a], not only before the Lord but also before people.
translation:
  language: zh_hans
  text: 因为我们留心筹划美善的事[a]，不但在主面前，也在人们面前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“可敬的事”或“正当的事”。
    reason: καλά可指美善的事，也可指可敬、正当、无可指摘的事；在本段涉及款项处理的语境中，后两种理解尤其贴切。
lexical_decisions:
- source_word: προνοοῦμεν
  choice: 我们留心做
  rationale: προνοέω表示预先考虑、留意筹划或设法做到。结合本段对捐款管理的谨慎安排，“留心做”既体现有意识的周全考虑，也符合现代汉语表达。
- source_word: γὰρ
  choice: 因为
  rationale: γάρ承接上文，说明保罗作出谨慎安排的原因；“因为”清楚呈现这一解释关系。
- source_word: καλὰ
  choice: 美好的事
  rationale: 中性复数καλά可泛指美善、正当或可敬的事。主译保留其宽广的伦理含义，不把它局限为公众声誉；其他语义以脚注说明。
- source_word: οὐ μόνον ... ἀλλὰ καὶ
  choice: 不但……也……
  rationale: 自然保留原文的递进并列结构和平衡强调。
- source_word: ἐνώπιον
  choice: 在……面前
  rationale: 准确表达“在某者眼前、鉴察之下”的意思，并可自然地用于主和人两个对象。
- source_word: κυρίου
  choice: 主
  rationale: κύριος在此依上下文指主；译作“主”符合新约通行称谓，也不额外限定具体所指。
- source_word: ἀνθρώπων
  choice: 人们
  rationale: ἄνθρωποι在此泛指人的观察和评价，并非专指男性；“人们”是自然且性别准确的表达。
theological_decisions:
- issue: καλὰ在财务问责语境中的伦理含义
  choice: 正文译作“美好的事”
  alternative: “可敬的事”或“正当的事”
  rationale: 原文既可广指道德上美善之事，也可强调在人看来体面、无可指摘的行为。正文保留较宽的含义，脚注则呈现与公开问责更密切的可能译法，避免消除原文的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“留心做”比直译为“预先考虑”更自然，同时保留审慎筹划的意味；“在主面前，也在人们面前”维持原文两个观察层面的对称。
