id: 2CO.8.20
reference: 2 Corinthians 8:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: στελλόμενοι τοῦτο μή τις ἡμᾶς μωμήσηται ἐν τῇ ἁδρότητι ταύτῃ τῇ διακονουμένῃ ὑφ’ ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/020.yaml
  text: taking this precaution, so that no one may blame us in regard to this generous gift being administered by us,
translation:
  language: zh_hans
  text: 我们这样谨慎行事，免得有人因这笔由我们经管的丰厚捐款[a]而指责我们。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这笔慷慨的馈赠”、“这笔丰裕的捐款”。希腊语ἁδρότης可表示丰厚、慷慨或丰裕。
    reason: lexical_alternative
  - marker: b
    text: 本句也可译：“我们这样谨慎行事，免得有人在这笔由我们经管的丰厚捐款上挑我们的不是。”
    reason: lexical_alternative
lexical_decisions:
- source_word: στελλόμενοι τοῦτο
  choice: 我们这样谨慎行事
  rationale: στελλόμενοι在此表示采取防范措施、避免可能的问题；结合τοῦτο，译为“这样谨慎行事”，既承接上文的安排，也自然引出后面的μή目的／防范从句。
- source_word: μή τις ἡμᾶς μωμήσηται
  choice: 免得有人……指责我们
  rationale: μή加虚拟语气表达防止某事发生；μωμάομαι意为责怪、挑剔或指摘。“免得有人……指责我们”保留了问责与避免毁谤的语气。
- source_word: ἐν τῇ ἁδρότητι ταύτῃ
  choice: 因这笔……丰厚捐款
  rationale: ἐν在此指可能受指责所涉及的事项，可按汉语习惯译为“因”；ἁδρότης表示丰厚、慷慨或丰裕，语境中具体指所募集的大笔赈济捐款。
- source_word: τῇ διακονουμένῃ ὑφ’ ἡμῶν
  choice: 由我们经管的
  rationale: διακονέω在此募捐与运送赈济款的语境中，指受托办理、管理这项服事。“经管”准确表达实际管理钱款的责任，又不过度加入教会术语。
theological_decisions:
- issue: 保罗处理捐款时所关注的事项
  choice: 突出他采取防范措施，以免在经管捐款一事上受到指责
  alternative: 仅将其理解为一般性的行程或人员安排，弱化公开问责的含义
  rationale: 原文以στελλόμενοι和μή τις…μωμήσηται明确呈现预防指责的目的，重点是经管捐款时的谨慎与可问责性；译文不将其扩展为更广泛的制度性教义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“丰厚捐款”使抽象的ἁδρότης在募捐语境中具体化；“经管”比“服事”或“管理运作”更简洁，也能体现受托办理钱款的责任。脚注保留“慷慨／丰裕”以及“挑不是”的词义幅度。
