  text: Χάρις δὲ τῷ θεῷ τῷ ⸀διδόντι τὴν αὐτὴν σπουδὴν ὑπὲρ ὑμῶν ἐν τῇ καρδίᾳ Τίτου,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/016.yaml
  text: But thanks be to God[a], who puts the same earnestness for you into Titus's heart,
translation:
  language: zh_hans
  text: 但感谢上帝，他把同样为你们所怀的热忱放在提多心里。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文只说“同样的热忱”，未明说这热忱与谁的相同；按上下文，可能是指保罗对你们所怀的热忱。
    reason: genuine_ambiguity
lexical_decisions:
- source_word: Χάρις δὲ τῷ θεῷ
  choice: 但要感谢上帝
  rationale: χάρις与间接受格“上帝”构成感谢用语，在这里不是神学术语“恩典”；δέ表示温和的转折或承接，以“但”自然引出保罗的感谢。
- source_word: τῷ διδόντι
  choice: 他把……放在……心里
  rationale: δίδωμι本义为“给予”，与ἐν τῇ καρδίᾳ连用时，汉语以“把……放在……心里”既自然，又保留内在意愿由上帝所赐的意象。
- source_word: τὴν αὐτὴν σπουδὴν
  choice: 同样的热忱
  rationale: σπουδή在本语境指热切、认真关怀的态度，而不只是办事勤奋；“热忱”兼顾热切和认真。αὐτήν译为“同样的”，其比较对象由上下文指向保罗的热忱。
- source_word: ὑπὲρ ὑμῶν
  choice: 对你们
  rationale: ὑπέρ表示这份关切以哥林多人为对象；“对你们”比“为了你们”更自然地搭配“热忱”。
- source_word: ἐν τῇ καρδίᾳ Τίτου
  choice: 在提多心里
  rationale: 直译为“在提多的心里”；置于汉语“把……放在……心里”结构中，保留原文的内心意向隐喻。
theological_decisions:
- issue: “同样的”所比较的对象
  choice: 在正文中补出“我对你们”，指保罗对哥林多人的热忱
  alternative: 不补明比较对象，只译“为你们有同样的热忱”
  rationale: 希腊文只说“同样的热忱”，比较对象依上下文推知。汉语若完全不补，指代较悬空；补出“我对你们”使语义清楚，同时以脚注说明原文的简略表达，避免把推定内容伪装成明说。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“感谢上帝”自然表达书信中的感恩公式；“热忱”比“殷勤”更准确地传达提多对收信人的热切关怀。脚注标记置于完整句末。
