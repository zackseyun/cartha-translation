  text: συνεπέμψαμεν δὲ μετ’ αὐτοῦ τὸν ἀδελφὸν οὗ ὁ ἔπαινος ἐν τῷ εὐαγγελίῳ διὰ πασῶν τῶν ἐκκλησιῶν—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/018.yaml
  text: And we sent with him the brother whose praise in the gospel is throughout all the churches—[a]
translation:
  language: zh_hans
  text: 我们还打发了那位弟兄同他一起去；他在福音方面所受的称赞，传遍了众教会。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这位弟兄在众教会中都因福音方面的事受到称赞。”
    reason: “在福音方面”可修饰“所受的称赞”，也可较自然地转述为该弟兄在与福音相关的领域受到称赞；两种表达均不限定为传讲或某一职分。
lexical_decisions:
- source_word: συνεπέμψαμεν
  choice: 我们还打发了……与他同去
  rationale: 不定过去时陈述已经采取的行动；复合动词中的 σύν 表达同行之意。中文用“打发……与他同去”自然呈现差遣和陪同两层含义。
- source_word: δὲ
  choice: 还
  rationale: 此处是推进叙述的轻微连接，不表示强烈转折；结合上文另有同行者的语境，“还”符合现代汉语表达。
- source_word: μετ’ αὐτοῦ
  choice: 与他同去
  rationale: μετά 加属格表示陪同；“与他同去”比单说“与他”更完整自然。
- source_word: τὸν ἀδελφόν
  choice: 那位弟兄
  rationale: 定冠词指一位特定、已知的男性基督徒同工；“那位弟兄”既保留特指，也不添加原文没有的“我们的”。
- source_word: οὗ ὁ ἔπαινος
  choice: 这位弟兄……受到称赞
  rationale: 希腊文采用关系代词加名词“称赞”的结构；中文改用被动述谓更自然，同时保留其受到广泛赞誉的意思。
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: 因福音的事
  rationale: 该短语表明称赞与福音有关，但没有明确限定为讲道或某项职分；“因福音的事”保留这种宽泛联系。
- source_word: διὰ πασῶν τῶν ἐκκλησιῶν
  choice: 在众教会中都
  rationale: διά 加属格在这里表达遍及整个群体的范围；“在众教会中都”自然传达其声誉遍及各教会。
- source_word: ἐκκλησιῶν
  choice: 教会
  rationale: 在保罗书信中通常指各地的基督徒群体；“教会”是现代中文最清楚且通行的对应词。
theological_decisions:
- issue: ἀδελφός 的身份与性别
  choice: 译作“那位弟兄”，指一位特定的男性基督徒同工。
  alternative: 译作泛指的“信徒”或“同道”。
  rationale: 阳性单数并带冠词，且处于差遣同行的语境，指向一位具体男子；保留“弟兄”避免抹去原文的个人与性别信息。
- issue: ἐν τῷ εὐαγγελίῳ 的具体含义
  choice: 译作“因福音的事”，不明确指定其事奉方式。
  alternative: “因传福音”或“因福音事工”。
  rationale: 原文只说明他的称赞与福音相关，并未明确说是讲道、传福音或担任某种职分；采用较宽的表达，以保存原文的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“打发”符合圣经叙事中的差遣语境；分号帮助读者清楚区分差遣行动与对该弟兄声誉的说明。
