  rationale: 修订仅调整 ἐν τῷ εὐαγγελίῳ 的表达，避免把原文宽泛的“在福音方面”具体化为因果性的“因福音的事”。同时采用名词性“所受的称赞”与“传遍了众教会”，更直接对应 οὗ ὁ ἔπαινος 与 διὰ πασῶν τῶν ἐκκλησιῶν，并保留自然的现代普通话文体。
