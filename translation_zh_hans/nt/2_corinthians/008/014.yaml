  text: ἐν τῷ νῦν καιρῷ τὸ ὑμῶν περίσσευμα εἰς τὸ ἐκείνων ὑστέρημα, ἵνα καὶ τὸ ἐκείνων περίσσευμα γένηται εἰς τὸ ὑμῶν ὑστέρημα, ὅπως γένηται ἰσότης·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/014.yaml
  text: At the present time[a], your abundance is for their need, so that their abundance may also be for your need, in order that there may be equality.
translation:
  language: zh_hans
  text: 现今，你们的富余是为补足他们的缺乏，好使他们的富余也补足你们的缺乏，为要有平等[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“公平”或“均衡”。这里的希腊词指彼此供应、补足缺乏所形成的平衡，不一定表示人人拥有完全相同的财物。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ νῦν καιρῷ
  choice: 现今
  rationale: 既表达当前的特定时势，也符合现代汉语简洁自然的用法。
- source_word: τὸ ὑμῶν περίσσευμα
  choice: 你们的富余
  rationale: περίσσευμα指超过自身所需的有余之物；“富余”保留物质供应的语境，又不把含义收窄为金钱。
- source_word: εἰς τὸ ἐκείνων ὑστέρημα
  choice: 补足他们的缺乏
  rationale: εἰς在此表示富余所趋向的用途；“补足……的缺乏”清楚传达供应短缺的意思。
- source_word: ἵνα καὶ
  choice: 好让……也
  rationale: “好让”表达目的关系，“也”保留καί所强调的互惠对应。
- source_word: τὸ ἐκείνων περίσσευμα
  choice: 他们的富余
  rationale: 与前一个περίσσευμα采用相同译法，以保留原文对称、互惠的结构。
- source_word: γένηται εἰς τὸ ὑμῶν ὑστέρημα
  choice: 可以补足你们的缺乏
  rationale: 以“可以”体现目的从句中的可能和预期，不生硬直译γένηται，同时保持双方彼此供应的关系。
- source_word: ὅπως γένηται ἰσότης
  choice: 从而实现平等
  rationale: “从而”表达结果或目的，“实现平等”直接传达ἰσότης，同时由脚注说明这不是要求财物完全相同。
theological_decisions:
- issue: 保罗劝勉捐助时ἰσότης的含义
  choice: 彼此供应中的平等
  alternative: 公平；均衡
  rationale: 上下文所谈的是信徒以各自的富余补足对方的缺乏，重点在互惠供应所形成的平衡，并非脱离语境的抽象社会理论，也不必然指人人拥有完全相同的财物。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“富余／缺乏”重复出现，以保留希腊文刻意安排的对称结构；脚注标记置于其实际解释的“平等”之后。
