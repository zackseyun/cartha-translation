source:
  edition: SBLGNT
  text: ἀλλ’ ὥσπερ ἐν παντὶ περισσεύετε, πίστει καὶ λόγῳ καὶ γνώσει καὶ πάσῃ σπουδῇ καὶ τῇ ἐξ ⸂ἡμῶν ἐν ὑμῖν⸃ ἀγάπῃ, ἵνα καὶ ἐν ταύτῃ τῇ χάριτι περισσεύητε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/007.yaml
  text: But just as you abound in everything—in faith and speech and knowledge and all diligence and in our love in you—see that you also abound in this grace[a][b].
translation:
  language: zh_hans
  text: 但你们既在各样事上都很丰富——在信心、言语、知识、各样热忱，以及从我们而来、在你们里面的爱[a]上——也要在这恩典上丰富有余[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文这一短语较难理解，直译为“从我们而来、在你们里面的爱”。也可能译作“你们对我们的爱”；另有一些抄本作“你们在我们里面的爱”。
    reason: alternative_reading
  - marker: b
    text: “这恩典”在这里指为有需要的圣徒慷慨捐助的恩慈行动。
    reason: lexical_alternative
lexical_decisions:
- source_word: περισσεύετε / περισσεύητε
  choice: 丰富 / 丰富有余
  rationale: 保留原词两次出现所表达的充盈、丰盛意象；末句用“丰富有余”自然传达劝勉语气，同时维持词语呼应。
- source_word: ἐν παντί
  choice: 在一切事上
  rationale: 作为后列各项的总括，既保留范围的广泛性，又符合现代汉语表达。
- source_word: πίστει
  choice: 信心
  rationale: 此处列举哥林多信徒的属灵长处，“信心”是最直接而不过度限定的译法。
- source_word: λόγῳ
  choice: 言语
  rationale: 在此项列中可能指表达或说话的恩赐；“言语”比“话语”更自然，也不局限于某一句话。
- source_word: γνώσει
  choice: 知识
  rationale: 准确保留该词在保罗书信中常见的认知含义。
- source_word: πάσῃ σπουδῇ
  choice: 万般热忱
  rationale: σπουδή兼有热切、认真、殷勤之意；“万般热忱”在此处自然地表达全然投入的态度。
- source_word: τῇ ἐξ ἡμῶν ἐν ὑμῖν ἀγάπῃ
  choice: 我们在你们里面的爱
  rationale: 尽量保留所据文本中“出于我们/我们的”与“在你们里面”这两个成分，同时承认原文结构艰涩，不在正文中强行消除其歧义。
- source_word: χάριτι
  choice: 恩典之事
  rationale: χάρις在上下文中特指为圣徒捐助这一蒙恩的善举；“恩典之事”既保留“恩典”的神学内涵，又使具体所指在汉语中较清楚。
theological_decisions:
- issue: χάρις在耶路撒冷捐助语境中的意义
  choice: 正文译作“恩典之事”
  alternative: 恩典；善举；慷慨捐助之事
  rationale: 该词在这里既关乎具体捐助，也保有恩典的神学意味；译作“恩典之事”避免只将其处理为钱财或礼物。
- issue: τῇ ἐξ ἡμῶν ἐν ὑμῖν ἀγάπῃ的解释
  choice: 译作“我们在你们里面的爱”，并以脚注说明歧义及异文
  alternative: 你们对我们的爱；我们对你们的爱
  rationale: 原文句法艰涩且存在抄本异文。正文贴近所据文本，脚注保留其他可能解释，避免替读者过早裁定。
- issue: ἵνα加虚拟式在此处的语用功能
  choice: 译为劝勉性的“也要”
  alternative: 使你们也能；务要
  rationale: 在上下文中，这一结构自然承接前面的称许并发出劝勉；“也要”简洁体现这种语气。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“不过”承接前文转折；破折号清楚标示“一切事”的具体项目。“丰富”虽略具书面色彩，却能保留περισσεύω贯穿全句的丰盛意象。
