id: 2CO.8.24
reference: 2 Corinthians 8:24
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: τὴν οὖν ἔνδειξιν τῆς ἀγάπης ὑμῶν καὶ ἡμῶν καυχήσεως ὑπὲρ ὑμῶν εἰς αὐτοὺς ⸀ἐνδεικνύμενοι εἰς πρόσωπον τῶν ἐκκλησιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/024.yaml
  text: Therefore[b][a], show them before the churches the proof of your love and of our boasting about you.
translation:
  language: zh_hans
  text: 所以，你们要在众教会面前[b]向他们显出你们爱心的明证[a]，并证实我们为你们所夸耀的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “明证”也可译作“表现”或“证据”。这里指以实际行动使爱心清楚可见。
    reason: lexical_alternative
  - marker: b
    text: “在众教会面前”指公开地在各教会的代表面前。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: 所以
  rationale: 表示由上文引出的结论或劝勉；“所以”在现代汉语中自然，并保留推论关系。
- source_word: ἔνδειξιν
  choice: 明证
  rationale: 该词指使某事明显可见的证明或表现；“明证”既保留证据含义，也适合这里以实际行动证实爱心的语境。
- source_word: ἀγάπης
  choice: 爱心
  rationale: 在此指借着实际行动表达的爱；“爱心”符合现代汉语教会语境，同时没有削弱其关系性和实践性。
- source_word: καυχήσεως
  choice: 所夸耀的
  rationale: 保留保罗用语中“夸耀”的修辞力度，不以较弱的“自豪”或“信心”代替。
- source_word: ὑπὲρ ὑμῶν
  choice: 为你们
  rationale: 在καύχησις之后表示夸耀所涉及的对象；“为你们所夸耀”自然表达保罗以哥林多人为夸耀内容。
- source_word: εἰς αὐτοὺς
  choice: 向他们
  rationale: 指上文提到的弟兄，即各教会的代表；保留希腊文行动所朝向的对象。
- source_word: ἐνδεικνύμενοι
  choice: 显出／显明
  rationale: 该分词在语境中具有劝勉或命令作用，意为以行动使某事得到显示；汉语改用“要……显出／显明”清楚表达这一功能。
- source_word: εἰς πρόσωπον τῶν ἐκκλησιῶν
  choice: 在众教会面前
  rationale: 保留原文“在……面前”的公开性；在本语境中，众教会借其代表在场见证。
- source_word: τῶν ἐκκλησιῶν
  choice: 众教会
  rationale: 指多个地方教会群体；“众教会”简洁、庄重，并明确其复数。
theological_decisions:
- issue: ἔνδειξιν与两个属格短语的关系
  choice: 译为“显出你们爱心的明证，也显明我们为你们所夸耀的是有根据的”
  alternative: “显出你们的爱和我们为你们夸耀的明证”
  rationale: 希腊文把“你们的爱”与“我们为你们的夸耀”并列置于ἔνδειξιν之后。汉语若完全照搬会含混难懂，因此保留两者都需得到公开证实的关系，同时不把“夸耀”改释为某一特定教义主张。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“夸耀”保留保罗原有的修辞力度；后半句略作汉语化展开，以避免生硬的多重属格结构，同时维持原文中爱心与保罗的夸耀都要得到实际印证的张力。
