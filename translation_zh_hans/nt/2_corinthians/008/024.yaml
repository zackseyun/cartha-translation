  terminology: “爱心”、“夸耀”、“众教会”和“明证” are suitable in a modern, dignified Christian register. “证实” accurately conveys the requested public validation of Paul's boasting without weakening καύχησις to 'pride' or introducing a doctrinal interpretation.
  issues:
