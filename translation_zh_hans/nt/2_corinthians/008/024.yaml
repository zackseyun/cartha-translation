    issue: The second coordinated element is recast as a proposition 'our boasting ... is well founded.'
    rationale: The Greek calls for the Corinthians to provide/show the evidence of both their love and Paul's boasting about them. '有根据' is a plausible implication but is a less direct and slightly interpretive reformulation. '证实我们为你们所夸耀的' retains the exhortation and the public evidentiary sense.
