  source_fidelity: 'The draft correctly preserves the inferential force of οὖν, the public setting before the churches, the recipients (''them''), and both coordinated matters: the Corinthians'' love and Paul''s boasting concerning them. However, rendering the second matter as ''我们为你们所夸耀的是有根据的'' adds an explanatory formulation (''is well founded'') rather than directly retaining the imperative force of publicly demonstrating/confirming what Paul boasts about them.'
