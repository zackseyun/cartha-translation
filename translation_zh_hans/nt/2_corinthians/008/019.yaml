  text: οὐ μόνον δὲ ἀλλὰ καὶ χειροτονηθεὶς ὑπὸ τῶν ἐκκλησιῶν συνέκδημος ἡμῶν ⸀σὺν τῇ χάριτι ταύτῃ τῇ διακονουμένῃ ὑφ’ ἡμῶν πρὸς τὴν ⸀αὐτοῦ τοῦ κυρίου δόξαν καὶ προθυμίαν ἡμῶν—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/019.yaml
  text: And not only that[d][c][b][a], but he was also appointed by the churches as our traveling companion with this gracious gift that is being administered by us for the glory of the Lord himself and our eagerness—
translation:
  language: zh_hans
  text: 不但如此，他还受众教会选派[a]，作我们办理这份恩惠之礼[b]时的旅伴；这份礼物由我们经办，为要使主自己得荣耀[c]，也显明我们的热忱——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“拣选”或“委派”。原词表示众教会选定他承担这项任务，但未必特指现代意义上的投票选举。
    reason: lexical_alternative
  - marker: b
    text: 直译“与这恩惠一同”；这里的“恩惠”在上下文中指所募集的礼物。
    reason: lexical_alternative
  - marker: c
    text: “主自己得荣耀”也可理解为“他的主得荣耀”，或较一般地译作“主得荣耀”。
    reason: alternative_reading
lexical_decisions:
- source_word: χειροτονηθεὶς
  choice: 受……选派
  rationale: 表示此人由众教会指定承担任务；“选派”既保留被选择、委任之意，也不限定为现代投票程序。
- source_word: ἐκκλησιῶν
  choice: 众教会
  rationale: 保罗书信中通常指各地基督徒教会；“众教会”自然表达复数及共同参与。
- source_word: συνέκδημος
  choice: 旅伴
  rationale: 指同行出外的人；结合“与我们一同”清楚传达共同旅行。
- source_word: σὺν τῇ χάριτι ταύτῃ
  choice: 与我们一同办理这份恩惠之礼
  rationale: σύν本义为“同、与……一起”；在募捐语境中，χάρις具体指出于恩惠的捐献。中文适度调整句法，使同行与办理礼物的关系清楚。
- source_word: διακονουμένῃ ὑφ’ ἡμῶν
  choice: 由我们经办
  rationale: 描述保罗一行负责办理、管理这笔捐献；“经办”简洁体现实际服事与受托处理。
- source_word: πρὸς
  choice: 为要
  rationale: 在此表达行动的目标或目的。
- source_word: αὐτοῦ τοῦ κυρίου
  choice: 主自己
  rationale: 将αὐτοῦ理解为强调用法，突出“主自己”，同时以脚注保留压缩结构的其他可能理解。
- source_word: δόξαν
  choice: 得荣耀
  rationale: “荣耀”是δόξα在保罗神学语境中的标准译法；中文以“使……得荣耀”自然表达目的。
- source_word: προθυμίαν ἡμῶν
  choice: 显明我们的热忱
  rationale: προθυμία表示甘心、热切的意愿；补出“显明”使它能与前面的目的结构自然并列，但不把热忱具体限定为某一种行动。
theological_decisions:
- issue: πρὸς τὴν αὐτοῦ τοῦ κυρίου δόξαν中αὐτοῦ的所指与作用
  choice: 译作“使主自己得荣耀”，将αὐτοῦ视为强调“主”的成分。
  alternative: 也可能理解为“使他的主得荣耀”或较一般的“使主得荣耀”。
  rationale: 原文结构紧凑，确有多种句法理解。正文采用语境中较顺畅的强调读法，脚注保留其他可能，避免消除原文歧义。
- issue: χάρις在募捐语境中的含义
  choice: 译作“恩惠之礼”，兼顾恩惠性质与具体捐献。
  alternative: 可直译为“这恩惠”或译作“这份礼物”。
  rationale: 上下文所指是为圣徒筹集的款项，但χάρις仍带有恩惠、慷慨行动的意味；合成表达保存这两层含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“恩惠之礼”略具经文语体，用来保存χάρις既指恩惠又指具体捐献的双重意味。句末保留破折号，因为本节原文句法延续到下一节。
