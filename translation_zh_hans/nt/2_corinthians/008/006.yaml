  text: εἰς τὸ παρακαλέσαι ἡμᾶς Τίτον ἵνα καθὼς προενήρξατο οὕτως καὶ ἐπιτελέσῃ εἰς ὑμᾶς καὶ τὴν χάριν ταύτην·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/006.yaml
  text: So we urged Titus that[a], just as he had previously begun, he should also complete among you this act of grace.
translation:
  language: zh_hans
  text: 因此，我们劝提多，正如他先前已经开始，也照样在你们中间完成这项恩典之举。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这项恩典之举”也可译作“这项恩惠的工作”；直译为“这恩典”。
    reason: 说明 χάρις 在此可按较直译保留为“恩典”，也可在募捐语境中指具体的恩惠行动或事工。
lexical_decisions:
- source_word: παρακαλέσαι
  choice: 劝
  rationale: 此处指保罗等人促请提多采取行动。“劝”在现代汉语中自然庄重，既有推动之意，又不至于强化为命令。
- source_word: Τίτον
  choice: 提多
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: καθὼς προενήρξατο
  choice: 既然他先前已经开始了
  rationale: 保留 προενήρξατο 所含“较早开始、事先着手”的时间意味；结合上下文，用“既然……也……”自然表达对应关系。
- source_word: ἐπιτελέσῃ
  choice: 要……完成
  rationale: 表达 ἵνα 加虚拟语气所指的目的或预期行动，也保留将已经开始的工作贯彻到底之意。
- source_word: εἰς ὑμᾶς
  choice: 在你们中间
  rationale: 表示提多要在哥林多信徒群体中完成这项工作，比“为你们”更能保留行动所指向并发生于该群体的含义。
- source_word: καὶ τὴν χάριν ταύτην
  choice: 也要……完成这项恩典之举
  rationale: “恩典之举”既保留 χάρις 的恩典用语，也让读者看出这里指具体的慷慨奉献及相关服事；“也”对应 καί。
theological_decisions:
- issue: 募捐语境中 χάρις 的含义
  choice: 译作“恩典之举”，兼指恩典及其体现于奉献中的具体行动
  alternative: “这恩典”“这项善举”“这份捐赠”
  rationale: 本章语境涉及为圣徒筹集奉献以及提多完成这项工作。译文不把 χάρις 缩减为金钱礼物，也不使其只剩抽象的神学概念，从而保留保罗把具体慷慨行动称为“恩典”的张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“因此”承接上一节所述结果；冒号使“劝”的具体内容清楚。“既然……也……”自然呈现 καθὼς……οὕτως καί 的对应结构，同时保留提多先前开始、如今应完成的时间关系。
