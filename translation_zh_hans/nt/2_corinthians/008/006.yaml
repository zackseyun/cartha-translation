revisions:
- from: 因此，我们劝提多：既然他先前已经开始了，也要在你们中间完成这项恩典之举。[a]
  to: 因此，我们劝提多，正如他先前已经开始，也照样在你们中间完成这项恩典之举。[a]
  rationale: 将“既然……也要……”改为“正如……也照样……”，以保留希腊文 καθὼς…οὕτως καί 的比较对应结构；同时修正脚注中会误导为“接受恩典”的词汇替代。其余措辞维持原译的现代庄重语体及对具体恩惠事工的表达。
