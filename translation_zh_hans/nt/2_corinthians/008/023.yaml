  text: εἴτε ὑπὲρ Τίτου, κοινωνὸς ἐμὸς καὶ εἰς ὑμᾶς συνεργός· εἴτε ἀδελφοὶ ἡμῶν, ἀπόστολοι ἐκκλησιῶν, δόξα Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/023.yaml
  text: As for Titus[a], he is my partner and fellow worker for you; as for our brothers, they are messengers of the churches[b], the glory of Messiah.
translation:
  language: zh_hans
  text: 至于提多，他是我的伙伴，也是为你们工作的同工；至于我们的弟兄，他们是众教会的使者[a]，是弥赛亚[b]的荣耀。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“众教会的使徒”。这里的希腊词既可指受差遣的使者或代表，也可在较广的意义上译作“使徒”；本段语境较支持“教会所委派的代表”。
    reason: alternative_reading
  - marker: b
    text: 或译“基督”。“弥赛亚”和“基督”都表示“受膏者”；这里的希腊词 Χριστός 是称号。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴτε ὑπὲρ Τίτου
  choice: 至于提多
  rationale: 原文以省略结构引出两个并列对象；“至于”自然表达这里的转题和分别说明功能，也不把 εἴτε 生硬译成条件句。
- source_word: κοινωνὸς ἐμὸς
  choice: 我的伙伴
  rationale: κοινωνός 指共同参与者或伙伴；“伙伴”既保留共同承担事工的关系，也符合现代汉语。
- source_word: εἰς ὑμᾶς συνεργός
  choice: 为你们工作的同工
  rationale: συνεργός 是“同工”，εἰς ὑμᾶς 表明工作面向哥林多人；此译法保留“为你们”的方向性，不额外加入“为你们的益处”。
- source_word: ἀδελφοὶ ἡμῶν
  choice: 我们的弟兄
  rationale: 原文为阳性复数，语境中指参与捐献事务的男性代表，因此保留“弟兄”。
- source_word: ἀπόστολοι ἐκκλησιῶν
  choice: 众教会的使者
  rationale: ἀπόστολοι 可指受差遣的使者或代表；本段语境是各教会所委派的人，“使者”既贴合语境，也避免擅自赋予专门的使徒职分。
- source_word: δόξα Χριστοῦ
  choice: 弥赛亚的荣耀
  rationale: 原文是无系词的同位性表述，直接称这些弟兄为弥赛亚的荣耀；保留这一凝练而有张力的说法，不改写为“使弥赛亚得荣耀”。Χριστός 在此作为称号处理。
theological_decisions:
- issue: ἀπόστολοι 是否表示专门职分上的“使徒”
  choice: 译作非专门意义的“使者”
  alternative: 众教会的使徒
  rationale: 上下文谈论为捐献事宜受教会委派的代表，而且“众教会的”表明其差派来源；译作“使者”避免加入原文未必主张的教会职分判断，同时以脚注保留另一可能。
- issue: δόξα Χριστοῦ 所表达的关系
  choice: 直译为“弥赛亚的荣耀”
  alternative: 使弥赛亚得荣耀的人
  rationale: 原文没有明说因果或结果，而是以同位语作出浓缩陈述；直译保留其可能表示彰显、承载或归属于弥赛亚之荣耀的神学张力。
- issue: Χριστοῦ 的称号性质
  choice: 弥赛亚
  alternative: 基督
  rationale: Χριστός 在这里作为称号使用；正文采用“弥赛亚”以凸显称号性质，并在脚注列出汉语中更传统的“基督”。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。两个“至于”对应原文平行结构；末句保留原文简洁的同位表达。所有脚注标记均置于正文相关词语之后。
