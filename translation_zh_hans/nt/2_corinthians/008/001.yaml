id: 2CO.8.1
reference: 2 Corinthians 8:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Γνωρίζομεν δὲ ὑμῖν, ἀδελφοί, τὴν χάριν τοῦ θεοῦ τὴν δεδομένην ἐν ταῖς ἐκκλησίαις τῆς Μακεδονίας,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/001.yaml
  text: We make known to you[a], brothers, the grace of God that has been given among the churches of Macedonia[b],
translation:
  language: zh_hans
  text: 弟兄们[a]，我们要让你们知道，上帝在马其顿各教会中所赐的恩典[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“弟兄姊妹们”；希腊文直译为“弟兄们”，这种阳性形式常用来称呼全体会众。
    reason: lexical_alternative
  - marker: b
    text: “上帝的恩典”既可指上帝所赐的恩惠，也可包括这恩典在马其顿各教会中所产生的慷慨奉献。
    reason: lexical_alternative
lexical_decisions:
- source_word: Γνωρίζομεν
  choice: 我们要让你们知道
  rationale: γνωρίζω意为“使人知道、告知”。此处用现代汉语自然的书信表达“我们要让你们知道”，避免生硬的“我们使你们知道”；其中“要”表达行文意图，并非将现在时改成将来时。
- source_word: δὲ
  choice: 不单独译出
  rationale: δέ在此标示轻微的行文转换，并无强烈转折。汉语直接以呼语开启新段落即可自然体现转换；译成“但是”会过强，译成“现在”又容易产生原文没有明确表达的时间含义。
- source_word: ὑμῖν
  choice: 你们
  rationale: 作为γνωρίζομεν的间接宾语，直译为复数“你们”。
- source_word: ἀδελφοί
  choice: 弟兄们
  rationale: 保留希腊文阳性复数呼格的字面形式及保罗书信的传统称呼；在此很可能包括全体会众，因此以脚注说明可作包容性理解。
- source_word: χάριν
  choice: 恩典
  rationale: χάρις是保罗的重要神学用语。“恩典”既可指上帝的恩惠与施恩，也可涵盖该恩典在信徒慷慨行动中的具体果效，避免窄化为“捐款”或“礼物”。
- source_word: τοῦ θεοῦ
  choice: 上帝……所赐的
  rationale: 属格短语修饰“恩典”。结合被动分词“所赐的”，汉语将“上帝”自然地理解为恩典的来源和赐予者，同时仍保留核心表达“上帝的恩典”。
- source_word: τὴν δεδομένην
  choice: 所赐的
  rationale: 以“所赐的”表达完成时被动分词，指出恩典已经赐下并具有持续的现实结果。
- source_word: ἐν
  choice: 在……中
  rationale: 保留ἐν所表达的范围或运行领域，不直接收窄为单纯的接受关系“赐给”；这也让恩典在各教会中彰显并发挥作用的含义保持开放。
- source_word: ἐκκλησίαις
  choice: 各教会
  rationale: 此处指马其顿地区的多个基督徒群体。“各教会”符合复数形式，也比“众教会”更符合现代普通话。
- source_word: τῆς Μακεδονίας
  choice: 马其顿
  rationale: 作为“各教会”的地域限定，译为“马其顿各教会”，简洁自然地表达“马其顿的各教会”。
theological_decisions:
- issue: “上帝的恩典”在本节中的含义
  choice: 保留为上帝在马其顿各教会中所赐并运行的恩典，同时容纳其所产生的慷慨奉献
  alternative: 直接译成“上帝所赐的慷慨”“慈善捐款”或“恩赐”
  rationale: 上下文把这恩典与马其顿信徒的慷慨相连，但本节措辞既指向神圣来源，也指向实际果效。保留“恩典”可避免把二者之一排除在外。
- issue: ἀδελφοί所称呼的对象
  choice: 正文按阳性形式译作“弟兄们”，脚注说明在保罗用法中可包括全体会众
  alternative: 正文直接译作“弟兄姊妹们”
  rationale: 这样既准确反映原文语法形式，又不使读者误以为保罗必然只向男性说话。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“弟兄们”保留书信呼语的源文形态；“我们要让你们知道”比“我们使你们知道”自然。“在……中所赐”有意保留ἐν的范围含义以及“恩典”既是上帝的恩惠、又在群体生活中显出果效的张力。
