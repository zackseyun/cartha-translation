  text: συνεπέμψαμεν δὲ αὐτοῖς τὸν ἀδελφὸν ἡμῶν ὃν ἐδοκιμάσαμεν ἐν πολλοῖς πολλάκις σπουδαῖον ὄντα, νυνὶ δὲ πολὺ σπουδαιότερον πεποιθήσει πολλῇ τῇ εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/022.yaml
  text: And we have sent with them our brother[a], whom we have often tested in many matters and found to be diligent, but who is now even more diligent because of his great confidence in you.
translation:
  language: zh_hans
  text: 我们也派我们的弟兄与他们一同去。我们多次在许多事上考验过他，发现他很殷勤；如今他因对你们很有信心，远比从前更殷勤。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“如今他因在你们的事上很有把握，远比从前更殷勤”。这“很大的信心／把握”最自然地指这位弟兄对你们的信心；也有理解认为可指保罗等人对你们的信心。
    reason: 保留 πεποιθήσει πολλῇ τῇ εἰς ὑμᾶς 在信心持有者及其与“更殷勤”之关系上的可讨论之处，同时优先呈现最符合就近语法连接的理解。
lexical_decisions:
- source_word: συνεπέμψαμεν
  choice: 派了……和他们同去
  rationale: 既表达不定过去时所叙述的差派行动，也体现 σύν- 所含“与……一同”的意思；中文自然明晰。
- source_word: ἀδελφὸν ἡμῶν
  choice: 我们的弟兄
  rationale: 保留初期基督徒群体的亲属称谓，也符合原文所指的一位未具名男性同工。
- source_word: ἐδοκιμάσαμεν
  choice: 考验……证实
  rationale: δοκιμάζω 不仅指检验过程，也含经过检验而得到认可的意味；用“考验……证实”把这两层意思自然表达出来。
- source_word: ἐν πολλοῖς πολλάκις
  choice: 多次在许多事上
  rationale: 分别保留 πολλάκις 的反复性和 ἐν πολλοῖς 的范围广泛性。
- source_word: σπουδαῖον ὄντα
  choice: 他是热心的
  rationale: σπουδαῖος 在此表示认真、殷勤、热切；“热心”能与下文比较级顺畅呼应，又不把意思局限为办事效率。
- source_word: νυνὶ δὲ πολὺ σπουδαιότερον
  choice: 如今……就更加热心了
  rationale: “更加”体现比较级和 πολὺ 的加强作用，并与前句“热心”形成明确比较。
- source_word: πεποιθήσει πολλῇ τῇ εἰς ὑμᾶς
  choice: 因对你们深有信心
  rationale: 把与格理解为原因或凭借，πεποίθησις 译为“信心/信任”，εἰς ὑμᾶς 表明其指向哥林多人；“深有”体现 πολλῇ。
theological_decisions:
- issue: πεποιθήσει πολλῇ τῇ εἰς ὑμᾶς 的信心属于谁，以及如何指向哥林多人
  choice: 正文按最自然的衔接，理解为这位弟兄因对哥林多人深有信心而更加热心
  alternative: 也可能指保罗等人对哥林多人的信心，或理解为在哥林多人的事上有把握
  rationale: 紧接的主语是那位弟兄，因此正文采用最自然的所指；但希腊文没有明示信心的持有者，故以脚注保留真实的句法歧义，不将其提升为额外的神学主张。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“弟兄”保留群体亲属语汇；“考验……证实”兼顾检验过程和认可结果；分成两句并用分号，使较长的希腊语句在中文中清楚流畅。
