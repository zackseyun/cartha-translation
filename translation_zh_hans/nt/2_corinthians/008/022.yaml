  to: 我们也派我们的弟兄与他们一同去。我们多次在许多事上考验过他，发现他很殷勤；如今他因对你们很有信心，远比从前更殷勤。[a]
  rationale: 修订使中文更自然，并以“远比从前更殷勤”完整表达 πολὺ σπουδαιότερον 的加强比较。“发现他很殷勤”保留 δοκιμάζω 经验证而认可的含义，避免不必要地重复强化。“对你们很有信心”维持正文最自然的句法所指；脚注以不武断的方式保留替代理解。
