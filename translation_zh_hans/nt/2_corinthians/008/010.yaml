source:
  edition: SBLGNT
  text: καὶ γνώμην ἐν τούτῳ δίδωμι· τοῦτο γὰρ ὑμῖν συμφέρει, οἵτινες οὐ μόνον τὸ ποιῆσαι ἀλλὰ καὶ τὸ θέλειν προενήρξασθε ἀπὸ πέρυσι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/010.yaml
  text: 'And in this matter I give my judgment: for this is beneficial for you[b][a], who began last year not only to do it but also to will it.'
translation:
  language: zh_hans
  text: 在这件事上，我提出我的意见[a]；因为这对你们有益——你们从去年就已开始，不但着手去做，也有这样的意愿[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “意见”也可译作“建议”或“判断”。这里是经过考虑的郑重劝告，并非以命令的形式表达。
    reason: lexical_alternative
  - marker: b
    text: “有这样的意愿”也可译作“愿意”或“想要去做”。原文把内在的意愿与实际行动区分开来。
    reason: lexical_alternative
lexical_decisions:
- source_word: γνώμην
  choice: 意见
  rationale: 表示经过考虑的看法或建议；结合上下文，这是保罗的郑重劝告，而不是以命令的形式发出。
- source_word: ἐν τούτῳ
  choice: 在这件事上
  rationale: 自然地指向当前讨论的捐助之事，同时保持原文指代的简洁。
- source_word: δίδωμι
  choice: 提出
  rationale: 汉语中“提出意见”比直译为“给出意见”更自然，也保留现在时陈述的直接性。
- source_word: συμφέρει
  choice: 有益
  rationale: 准确表达有利、合宜的意思，不引入商业获利的色彩。
- source_word: οἵτινες
  choice: 你们……
  rationale: 拆分为新句以符合现代汉语表达，同时保留对哥林多人已有行动的说明。
- source_word: τὸ ποιῆσαι
  choice: 实际去做
  rationale: 指实际实行先前所谈的捐助；“实际”使它与内在意愿的对比清楚。
- source_word: τὸ θέλειν
  choice: 有意愿去做
  rationale: 表达意志、愿意或想要的层面，并与实际行动区分；不把它强化为情感性的渴望。
- source_word: προενήρξασθε
  choice: 就开始了
  rationale: 表达先前已经着手的意思；其时间上的先行由“从去年”明确。
- source_word: ἀπὸ πέρυσι
  choice: 从去年
  rationale: 保留ἀπό的起点意味，同时不强行断定行动是否始终连续至今。
theological_decisions:
- issue: 保罗这句话与使徒权威的关系
  choice: 译为“提出我的意见”，呈现经过考虑的郑重建议，而非直接命令。
  alternative: 译为“作出裁断”或视为权威性命令。
  rationale: 上下文将命令与意见相区别（8:8、8:10）；本译法既不削弱保罗劝告的分量，也不把它说成原文未明确采用的命令。
- issue: “去做”与“有意愿”的先后或范围
  choice: 二者都由“从去年就开始了”统摄。
  alternative: 理解为他们去年开始实行，而愿意得更早；或只让时间短语修饰其中一项。
  rationale: 原文的结构将“不但去做，也愿意”共同置于“先前开始”之下；译文保留这种并列关系，不额外规定二者的精确先后。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“提出我的意见”避免生硬直译；第二句稍作拆分，以清楚呈现“实际行动—内在意愿”的平行对照。所有脚注标记均置于相关词语之后。
