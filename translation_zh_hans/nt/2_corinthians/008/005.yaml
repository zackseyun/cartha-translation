revisions:
- from: 而且，事情并不像我们所期待的[a]；他们反而先把自己献给了主，也献给了我们，这是借着神的旨意[b]。
  to: 而且，他们并没有照我们所期待的那样做[a]；反而先把自己献给主，也献给我们——这是借着神的旨意[b]。
  rationale: 修订删除无对应且笼统的“事情”，以“并没有照我们所期待的那样做”自然表达原文的否定比较。保留“反而”“先”“也”，使对比、优先次序和两个与格对象均可见。以破折号将“这是借着神的旨意”接回“献给”的行动，改善汉语句法，同时不把该短语限定为单纯的原因、授权或合乎旨意；脚注保留这些可行的替代侧重。
