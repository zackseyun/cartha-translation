  naturalness: 原文整体庄重，但“而且，事情并不像……”较生硬，“这是借着神的旨意”也不够自然。修订采用现代普通话中更顺畅的“并没有照……那样做”，并用破折号把末尾短语自然地接回前述行动。
  terminology: “主”“神”“献给”均合适。“献给”恰当表达ἑαυτοὺς ἔδωκαν的自我交付，不应改成仅指金钱捐献的说法。保留“主”，不额外释义或强化使徒与主之间的关系。
