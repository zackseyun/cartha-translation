  text: καὶ οὐ καθὼς ἠλπίσαμεν ἀλλ’ ἑαυτοὺς ἔδωκαν πρῶτον τῷ κυρίῳ καὶ ἡμῖν διὰ θελήματος θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/005.yaml
  text: And not as we expected[a], but they gave themselves first to the Lord and to us through the will of God[b],
translation:
  language: zh_hans
  text: 而且，他们并没有照我们所期待的那样做[a]；反而先把自己献给主，也献给我们——这是借着神的旨意[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“像我们所盼望的”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“出于神的旨意”，或“按照神的旨意”。
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς ἠλπίσαμεν
  choice: 像我们所期待的
  rationale: ἠλπίσαμεν通常可指“盼望”，但本处是在对比使徒原先的预期与马其顿信徒实际所做的事；“期待”更符合现代汉语语境，同时在脚注保留“盼望”这一可行译法。
- source_word: ἑαυτοὺς ἔδωκαν
  choice: 把自己献给了
  rationale: 保留反身代词与δίδωμι所表达的自我交付，不把意思缩减为捐献财物；“献给”在中文中自然、庄重，也能表达委身。
- source_word: πρῶτον
  choice: 先
  rationale: 保留其时间和次序上的优先含义，而不进一步限定为纯时间或纯逻辑优先。
- source_word: τῷ κυρίῳ
  choice: 给了主
  rationale: κύριος按其保罗书信语境译为“主”；与“献给”组合后自然表达其与格关系。
- source_word: καὶ ἡμῖν
  choice: 也献给了我们
  rationale: 保留与“主”并列的与格结构，同时由“先”维持次序，不暗示“我们”与主地位相等。
- source_word: διὰ θελήματος θεοῦ
  choice: 这是借着神的旨意
  rationale: “借着”尽量保留διά加属格可能表达的媒介或作用，并避免正文直接限定为单纯的“按照”；脚注列出其他自然译法。
theological_decisions:
- issue: 把自己献给主与献给使徒之间的关系
  choice: 译文按原文次序说“先”献给主，“也”献给我们，使对主的优先性清楚可见，但不扩大为更强的教会论主张。
  alternative: 也可理解为双重的委身，而“先”并不必然建立完整的层级关系。
  rationale: πρῶτον及两个与格的排列显示主居首位；直译其结构可保留关系上的张力。
- issue: διὰ θελήματος θεοῦ的语义作用
  choice: 正文采用“借着神的旨意”，保留神的旨意作为媒介、作用或促成因素的可能。
  alternative: 可译“出于神的旨意”或“按照神的旨意”。
  rationale: διά加属格在这里可有神圣作用、授权或与旨意相合等不同侧重，不宜在正文中只固定为其中一种。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“事情”补足汉语表达所需的主语，使承接上文的省略结构自然；分号呈现从“并不像所期待的”到“反而献上自己”的转折。所有脚注标记均已置于正文。
