  text: οὐ γὰρ ἵνα ἄλλοις ἄνεσις, ⸀ὑμῖν θλῖψις· ἀλλ’ ἐξ ἰσότητος
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/013.yaml
  text: For I do not mean that there should be relief for others and hardship for you, but equality[a]—
translation:
  language: zh_hans
  text: 因为我并不是要别人得轻省，你们却受困苦，而是要均平[a]——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“平等”或“公平”。希腊语可指公平的均衡，不一定表示人人拥有完全相同的财物。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ γὰρ
  choice: 我并不是
  rationale: γάρ承接上文，带有解释、澄清的语气；中文在单节呈现时不必机械译作“因为”，以“并不是”自然表达否定和纠正。
- source_word: ἵνα
  choice: 要
  rationale: 此处ἵνα依附于语境中省略的意愿或目的表达；“要”简洁补出保罗所否定的意图。
- source_word: ἄλλοις
  choice: 别人
  rationale: 不定指其他受益者，与“你们”形成清楚对照。
- source_word: ἄνεσις
  choice: 得轻省
  rationale: ἄνεσις指压力或负担得到缓解；在捐助语境中，“得轻省”既保留解除重担之意，也避免误解为单纯的情绪安慰。
- source_word: ὑμῖν
  choice: 你们
  rationale: 与“别人”平衡对应，指哥林多信徒群体。
- source_word: θλῖψις
  choice: 受困苦
  rationale: 该词可指压力、患难或窘迫；这里涉及物质奉献，“受困苦”表达因负担而陷入艰难，却不把含义限死为经济贫困。
- source_word: ἀλλ’ ἐξ ἰσότητος
  choice: 而是要均平
  rationale: ἀλλά构成强烈转折；ἐξ ἰσότητος表达以均平、公平为原则或目标。“均平”在现代中文中比“平等”更能保留处境与负担取得适当平衡的语义，同时不暗示财产必须绝对相同。
theological_decisions:
- issue: 物质分享语境中ἰσότης的含义
  choice: 均平
  alternative: 平等；公平
  rationale: ἰσότης既可表示平等，也可表示公平、均衡。正文采用“均平”，保留保罗关于彼此供应、取得适当平衡的张力，既不将其解释为绝对财产一致，也不把它弱化为主观的公平感；脚注列出可行译法。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“得轻省／受困苦”形成紧凑对照；句末破折号保留原句向下一节延续的语势。
