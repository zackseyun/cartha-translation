  text: ὅτι τὴν μὲν παράκλησιν ἐδέξατο, σπουδαιότερος δὲ ὑπάρχων αὐθαίρετος ἐξῆλθεν πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/017.yaml
  text: For he accepted the appeal[a], but being more earnest[d][c][b], he went to you of his own accord.
translation:
  language: zh_hans
  text: 他固然接受了这劝请[a]，却更加热切，主动动身到你们那里去了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “劝请”也可译作“劝勉”或“请求”。
    reason: lexical_alternative
  - marker: b
    text: “动身到你们那里去了”也可译作“到你们那里去了”。希腊语动词字面有“出去、离开”之意，可能着重他从所在之处出发。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 承接上一节保罗感谢上帝的话，表达原因或解释；中文用“因为”自然地保留这种因果关系。
- source_word: παράκλησιν
  choice: 劝请
  rationale: 此处指保罗请提多承担任务的劝勉和请求；“劝请”兼顾劝促与请求，避免误解为安慰。
- source_word: ἐδέξατο
  choice: 接受了
  rationale: 表示提多欣然接纳保罗的劝请；“接受”符合现代汉语，也不过度扩充中动语态的含义。
- source_word: σπουδαιότερος
  choice: 更加热切
  rationale: 保留比较级，表示提多的热心或迫切程度更高；“热切”贴合他关怀并愿意行动的语境。
- source_word: ὑπάρχων
  choice: 自己……
  rationale: 该分词描述提多本有的状态，与后面的自愿行动结合表达；中文不机械译作“存在着”，以保持自然。
- source_word: αὐθαίρετος
  choice: 主动
  rationale: 表示出于自愿、自己作主而行动；“主动”简洁地传达自发性，不暗示他拒绝或无需保罗劝请。
- source_word: ἐξῆλθεν πρὸς ὑμᾶς
  choice: 动身到你们那里去
  rationale: ἐξῆλθεν 可指离开所在之处、启程前往；“动身到……去”保留从保罗一方出发的方向感，又符合现代汉语。
theological_decisions:
- issue: 提多接受劝请与自愿行动之间的关系
  choice: 用“而且”连接，并译为“自己更加热切，便主动动身”
  alternative: 用“但是”形成转折，或解释为提多未受劝请便自行前往
  rationale: 希腊语 μὲν…δὲ 在此可标示递进或对照；上下文同时肯定提多接受保罗的劝请和他本人的热心。译文不把两者设为矛盾，也不消除原文轻微的对照张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“劝请”准确反映具体任务语境；“更加热切”保留比较级；“主动动身”清楚表达提多自愿且付诸行动。所有脚注标记均置于正文相应位置。
