revisions:
- from: 因为他接受了劝请[a]，而且自己更加热切，便主动动身到你们那里去[b]。
  to: 他固然接受了这劝请[a]，却更加热切，主动动身到你们那里去了[b]。
  rationale: 将连接方式改为“固然……却……”，以较自然的汉语保留希腊语 μὲν…δὲ 的对照而不强化为矛盾。重整后半句语序，消除“自己更加热切”的生硬感；保留比较级“更加”、自愿含义“主动”，以及 ἐξῆλθεν 所可暗示的启程、离开所在之处。
