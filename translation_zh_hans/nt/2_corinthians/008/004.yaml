  text: μετὰ πολλῆς παρακλήσεως δεόμενοι ἡμῶν, τὴν χάριν καὶ τὴν κοινωνίαν τῆς διακονίας τῆς εἰς τοὺς ἁγίους—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/004.yaml
  text: begging us with much urging for the grace and the fellowship of this ministry to the saints—[a]
translation:
  language: zh_hans
  text: 他们带着再三的恳求，求我们准许他们得着这恩典，有份于服事圣徒的事工—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这恩典，有份于”或译“参与服事圣徒的殊荣”。
    reason: χάρις 可表示恩典、恩惠或殊荣，κοινωνία 可表示有份、分享或参与；两者在本句可理解为紧密关联的表达。
lexical_decisions:
- source_word: μετὰ πολλῆς παρακλήσεως
  choice: 再三
  rationale: 该短语表示恳切、强烈地请求；与后面的“恳求”合译为“再三恳求”，在现代汉语中自然地传达持续而迫切的意味，避免生硬重复。
- source_word: δεόμενοι ἡμῶν
  choice: 恳求我们
  rationale: δέομαι 表示请求、恳求，ἡμῶν 指受请求的人；“恳求我们”既准确又符合庄重自然的现代汉语。
- source_word: τὴν χάριν
  choice: 这份恩典
  rationale: χάρις 可指恩典、恩惠或殊荣。保留“恩典”以体现保罗的用词及其神学余韵；“这份”使抽象名词在汉语中更自然，并由上下文限定为参与捐助之恩。
- source_word: τὴν κοινωνίαν
  choice: 有份参与
  rationale: κοινωνία 在此强调共同参与和有份于援助行动。“有份参与”兼顾关系性的共享与实际参与，虽略有语义叠加，却自然清楚地保留两层意味。
- source_word: τῆς διακονίας
  choice: 服事……的事
  rationale: διακονία 在此指实际援助性的服事。“服事……的事”在现代汉语中自然，并保留保罗赋予物质援助的尊严。
- source_word: τῆς εἰς τοὺς ἁγίους
  choice: 服事圣徒
  rationale: 该介词短语说明服事的对象或受益者。ἅγιοι 是保罗对信徒的惯常称呼；译作“圣徒”可保持关键术语的一致性，也不暗示后世封圣制度。
theological_decisions:
- issue: χάρις 与 κοινωνία 的关系
  choice: 译为两个相连但有区别的内容：“得着这份恩典，并有份参与”
  alternative: 把两者合并为“获准参与”或“有参与的殊荣”
  rationale: 希腊文以 καί 连接两个带冠词的宾格名词。语境允许把它们理解为紧密相联甚至重言式的表达，但正文不把这种关系完全合并，以保存原文的语法张力。
- issue: ἅγιοι 的译法
  choice: 圣徒
  alternative: 圣洁的人；上帝的圣民
  rationale: “圣徒”保持保罗书信中的术语连续性，所指为属上帝的信徒群体，并非少数被正式封圣的人。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“再三恳求”浓缩原文两个相互加强的请求表达；保留句末破折号，反映本节在句法上承接下文。
