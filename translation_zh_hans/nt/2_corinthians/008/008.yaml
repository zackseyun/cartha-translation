source:
  edition: SBLGNT
  text: Οὐ κατ’ ἐπιταγὴν λέγω ἀλλὰ διὰ τῆς ἑτέρων σπουδῆς καὶ τὸ τῆς ὑμετέρας ἀγάπης γνήσιον δοκιμάζων·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/008.yaml
  text: I am not saying this as a command[b][a], but through the earnestness of others I am also testing the genuineness of your love.
translation:
  language: zh_hans
  text: 我这样说，并不是在下命令；我借着别人的热心[a]，也在检验[b]你们的爱是否真诚。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “热心”也可译作“热切”或“殷勤”。
    reason: lexical_alternative
  - marker: b
    text: “检验”也可译作“证实”或“考验”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιταγή
  choice: 命令
  rationale: “不是在下命令”自然表达 οὐ κατ’ ἐπιταγὴν λέγω，明确保留保罗并非以权威命令方式发言的意思。
- source_word: διὰ τῆς ἑτέρων σπουδῆς
  choice: 借着别人的热心
  rationale: “借着”体现 διά 加属格的凭借或媒介意义；“别人”不在正文中擅自明确为马其顿人。
- source_word: σπουδή
  choice: 热心
  rationale: 在捐助的语境中，σπουδή 表示积极而认真的热忱；“热心”是现代汉语中自然且涵盖较广的对应词。[a]
- source_word: ἀγάπη
  choice: 爱
  rationale: 直接对应 ἀγάπη；本节所说的爱借慷慨给予表现出来。
- source_word: γνήσιον
  choice: 是否真诚
  rationale: 以汉语谓语结构自然表达名词化的 τὸ…γνήσιον，即爱所具有的真实、真挚性质。
- source_word: δοκιμάζων
  choice: 要检验
  rationale: 分词与主句所述言说同时关联，并带有检验其真实性的作用；“检验”保留判断与试验之间的语义张力。[b]
- source_word: καί
  choice: 也
  rationale: 保留 καί 的添加意义，表明保罗借别人所表现的热心，也检验哥林多人的爱。
- source_word: ὑμετέρας
  choice: 你们的
  rationale: 准确表达复数群体性的所有关系，指哥林多信徒的爱。
theological_decisions:
- issue: 保罗对奉献所采取的修辞立场
  choice: 明确说自己不是在下命令，而是借别人的热心检验哥林多人的爱是否真诚。
  alternative: 将这句话理解为保罗只是在修辞上软化命令，但仍实际发出命令。
  rationale: οὐ κατ’ ἐπιταγὴν λέγω 的否定意义直接明确，不宜在翻译中削弱；译文保留使徒权柄与由爱推动的自愿回应之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“下命令”比“按命令说”更自然；“爱是否真诚”避免生硬的“你们之爱的真实性”，同时保留 γνήσιον 所强调的真实与真挚。脚注标记均置于相关词句之后。
