  text: ὅτι ἐν πολλῇ δοκιμῇ θλίψεως ἡ περισσεία τῆς χαρᾶς αὐτῶν καὶ ἡ κατὰ βάθους πτωχεία αὐτῶν ἐπερίσσευσεν εἰς ⸂τὸ πλοῦτος⸃ τῆς ἁπλότητος αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/002.yaml
  text: that in a severe test of affliction[b][a], the abundance of their joy and their deep poverty overflowed into the wealth of their generosity.
translation:
  language: zh_hans
  text: 因为他们在极大的患难考验中，满溢的喜乐和极深的贫穷[a]，竟使他们极其慷慨[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“贫穷到了极深之处”，或“极度贫穷”。
    reason: lexical_alternative
  - marker: b
    text: 直译：“他们慷慨的丰富”。“慷慨”所译的希腊语也可指“单纯”或“专一”，但在这里很可能指慷慨施予。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν πολλῇ δοκιμῇ θλίψεως
  choice: 在患难的严峻考验中
  rationale: δοκιμή在这里指经受考验的处境，θλίψεως说明这考验带有患难；“严峻”表达πολλῇ所强调的强烈程度，同时保留“考验—患难”的关系。
- source_word: ἡ περισσεία τῆς χαρᾶς αὐτῶν
  choice: 满溢的喜乐
  rationale: περισσεία表示丰盛、充盈；“满溢”既自然，又与后面的ἐπερίσσευσεν形成词义呼应。
- source_word: ἡ κατὰ βάθους πτωχεία αὐτῶν
  choice: 极深的贫穷
  rationale: κατὰ βάθους以“深处”这一意象加强πτωχεία；“极深”既保留深度隐喻，也清楚表达贫穷到了极点。
- source_word: ἐπερίσσευσεν
  choice: 涌流出
  rationale: περισσεύω表示充盈、丰盛，并在εἰς所引出的结果中呈现由内向外的动态；“涌流出”保留这一鲜明意象。
- source_word: εἰς τὸ πλοῦτος
  choice: 丰盛的
  rationale: εἰς在此引出结果，πλοῦτος表示丰富或丰厚。汉语以“涌流出丰盛的……”自然表达结果关系，避免生硬直译为“进入财富”。
- source_word: ἁπλότης
  choice: 慷慨
  rationale: ἁπλότης本可指单纯、专一或真诚，但在本段为圣徒捐助的语境中，最可能指不计较地慷慨给予。
theological_decisions:
- issue: 奉献语境中ἁπλότης的含义
  choice: 慷慨
  alternative: 单纯、真诚、专一
  rationale: 上下文谈论为圣徒筹集捐款，因此译作“慷慨”最能表达这里实际施予的意义；同时以脚注保留该词“单纯、专一”等真实语义可能性，避免把词义范围完全封闭。
- issue: 喜乐、贫穷与慷慨之间的悖论关系
  choice: 保留“满溢的喜乐”与“极深的贫穷”共同涌流出慷慨的句法张力
  alternative: 解释为他们虽然贫穷，却因喜乐而慷慨
  rationale: 原文并未明确把两项改写为让步或因果关系，而是将二者并列为ἐπερίσσευσεν的主项；译文不额外判定二者之间的逻辑。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“严峻的考验”“极深的贫穷”保持原文的强度；“满溢”与“涌流出”形成有意的词义呼应。用“加上”使两个差异强烈的主项在汉语中清晰并列，但不将其解释成明确的让步或因果关系。
