  text: νυνὶ δὲ καὶ τὸ ποιῆσαι ἐπιτελέσατε, ὅπως καθάπερ ἡ προθυμία τοῦ θέλειν οὕτως καὶ τὸ ἐπιτελέσαι ἐκ τοῦ ἔχειν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/011.yaml
  text: But now complete the doing of it also[a], so that just as there was the eagerness to will it[b], so also there may be the completion from what you have.
translation:
  language: zh_hans
  text: 如今，你们也要把这事完成[a]，使你们怎样有乐意的心，也怎样照着自己所有的，把这事完成[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把这事贯彻到底。”
    reason: lexical_alternative
  - marker: b
    text: 直译：“出于你们所拥有的。”意思是照着你们现有的资源或能力来完成。
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: 如今
  rationale: 既承接上文，又把劝勉转向当前应采取的行动；中文语境已能体现轻微的转折，不必硬译“但是”。
- source_word: τὸ ποιῆσαι
  choice: 把这事办完
  rationale: 所指是上文已经发起的捐献行动。“这事”承接明确，“办完”与命令式 ἐπιτελέσατε 合并表达，符合自然汉语。
- source_word: ἐπιτελέσατε
  choice: 要……办完
  rationale: 表达将已经开始或计划的事贯彻到底；“办完”简明自然，并保留完成之意。
- source_word: ἡ προθυμία τοῦ θέλειν
  choice: 愿意去做的热忱
  rationale: προθυμία 表示积极的热切、甘愿和准备行动的态度，θέλειν 则突出意愿；此译兼顾两者，避免只译成较弱的“愿意”。
- source_word: οὕτως καὶ τὸ ἐπιτελέσαι
  choice: 也照样……把它完成
  rationale: 保留“怎样……也照样”的对称结构，使先前的意愿与实际完成形成对应。
- source_word: ἐκ τοῦ ἔχειν
  choice: 按着自己所有的
  rationale: 保留以现有资源为出发点或尺度的含义，不把经文扩大成超越个人能力的要求。
theological_decisions:
- issue: 奉献与现有能力之间的关系
  choice: 将完成捐献理解为按着自己现有的资源来实行
  alternative: 把本句理解为不考虑个人能力、无条件完成任何善愿的普遍命令
  rationale: 上下文谈的是哥林多人先前承诺的捐献，而 ἐκ τοῦ ἔχειν 明确把实际完成与他们所有的资源联系起来。译文保留这种限制，同时不额外规定具体比例。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“热忱”表达积极甘愿的态度；“按着自己所有的”略带经文体色彩，但能简洁保留原文 ἐκ 的来源或尺度含义。两个脚注标记均放在其所解释的短语之后。
