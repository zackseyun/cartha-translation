  text: ὅτι κατὰ δύναμιν, μαρτυρῶ, καὶ ⸀παρὰ δύναμιν, αὐθαίρετοι
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/003.yaml
  text: For[a], I testify, they gave according to their ability, and beyond their ability, of their own accord[b],
translation:
  language: zh_hans
  text: 因为我作证：他们按自己的能力，甚至超过自己的能力，自愿捐献[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “自愿”也可译作“主动地”或“出于自己的意愿”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 在此承接并解释上一节所述马其顿众教会的慷慨表现；“因为”自然表达其论证关系。
- source_word: κατὰ δύναμιν
  choice: 按着自己的能力
  rationale: κατά与宾格在此表示尺度或限度；该译法保留“依照能力范围”的意思，并与后句形成对照。
- source_word: μαρτυρῶ
  choice: 我可以作证
  rationale: 表达保罗亲自为此作证的强调语气；加入“可以”符合现代汉语习惯，并未改变直陈语气的实质。
- source_word: καὶ παρὰ δύναμιν
  choice: 甚至超过了自己的能力
  rationale: παρά与宾格表示越过界限；“甚至”凸显递进和出乎寻常的程度，与前面的“按着自己的能力”形成鲜明对照。
- source_word: αὐθαίρετοι
  choice: 自愿
  rationale: 该词指由自己作主、主动而非受强迫；“自愿”简洁保留这一核心含义。
theological_decisions:
- issue: αὐθαίρετοι所修饰的省略动作
  choice: 根据上下文补出“捐献”，译为“自愿捐献的”
  alternative: 较直译为“他们是自愿的”，不补出具体动作
  rationale: 希腊文以谓语性形容词作省略表达，而8:2—4的语境清楚表明所说的是捐献。现代汉语补出动作可使句子完整，且不增加语境之外的神学含义。
- issue: 能力与财力的语义范围
  choice: 正文采用“能力”
  alternative: 译为“财力”或“经济能力”
  rationale: δύναμις本身可泛指能力、力量；虽在捐献语境中自然涉及经济承受力，但保留“能力”可避免把词义不必要地收窄。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“按着……甚至超过……”保留原文的平行和递进；将“我可以作证”置于冒号前，使原文插入式见证在汉语中清晰自然。
