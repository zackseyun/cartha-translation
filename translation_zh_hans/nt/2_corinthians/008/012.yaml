  text: εἰ γὰρ ἡ προθυμία πρόκειται, καθὸ ἐὰν ⸀ἔχῃ εὐπρόσδεκτος, οὐ καθὸ οὐκ ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/012.yaml
  text: For if the readiness is present[a], it is acceptable according to what one has[b], not according to what one does not have.
translation:
  language: zh_hans
  text: 因为，若有乐意的心[a]，这心意就按人所有的而蒙悦纳，不按人所没有的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “乐意的心”也可译作“热切的意愿”或“甘心”。
    reason: lexical_alternative
  - marker: b
    text: 直译：“按他无论有什么……不按他没有什么。”
    reason: lexical_alternative
lexical_decisions:
- source_word: προθυμία
  choice: 愿意的心
  rationale: 该词指甘心而积极的意愿或态度。“愿意的心”是现代汉语中自然、清楚的表达，也符合本段乐意捐助的语境；脚注保留“热心”和“乐意”等可能译法。
- source_word: πρόκειται
  choice: 有
  rationale: 在“εἰ … ἡ προθυμία πρόκειται”这一表达中，动词表示这种意愿已经存在、具备。译作“人若有愿意的心”符合汉语习惯，避免生硬直译为“摆在面前”。
- source_word: καθὸ ἐὰν ἔχῃ
  choice: 照着他所有的
  rationale: 该短语说明接纳所依据的尺度是一个人实际拥有的资源。“照着他所有的”既保留原文的衡量关系，也不过度解释为固定比例。
- source_word: εὐπρόσδεκτος
  choice: 蒙悦纳的
  rationale: 该词表示可接受、受欢迎或获认可。“蒙悦纳”适合庄重的圣经语体，同时不在正文中明确补出悦纳者是谁。
- source_word: οὐ καθὸ οὐκ ἔχει
  choice: 不是照着他所没有的
  rationale: 这一译法保留原文与前句对称的结构，明确指出衡量标准不是人并不具备的资源。
- source_word: εἰ γὰρ
  choice: 因为……若
  rationale: “因为”承接上文的解释关系，“若”保留条件意味；汉语中调整词序为“因为，人若……”，表达自然。
theological_decisions:
- issue: 悦纳者的身份
  choice: 使用“蒙悦纳”，不明说是蒙谁悦纳
  alternative: 明确译为“蒙神悦纳”或“被教会接纳”
  rationale: εὐπρόσδεκτος表达悦纳或认可，却没有明说悦纳者。正文不补入“神”或“教会”，从而保留原文在神学和群体层面的开放性。
- issue: 蒙悦纳的语法主体
  choice: 以“这心意”承接“愿意的心”
  alternative: 补出“人所献的”作为蒙悦纳的主体
  rationale: 希腊文中εὐπρόσδεκτος在语法上与ἡ προθυμία相配。译文保持这一关系，不把上下文所暗示的礼物直接补为正文主语。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“愿意的心”贴近日常表达；“蒙悦纳”保留圣经语体及原文未明说悦纳者的特点。句式尽量维持原文前后对称。
