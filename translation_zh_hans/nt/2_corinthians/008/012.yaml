  rationale: 修订仅改善汉语句法和脚注措辞：以“这心意就按……而蒙悦纳”明确保持εὐπρόσδεκτος与προθυμία的语法关联，并保留悦纳者未明说的开放性；“人”用于泛指，不限男性。前后“按……不按……”继续反映原文对称结构。
