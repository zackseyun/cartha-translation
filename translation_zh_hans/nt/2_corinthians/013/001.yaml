  text: Τρίτον τοῦτο ἔρχομαι πρὸς ὑμᾶς· ἐπὶ στόματος δύο μαρτύρων καὶ τριῶν σταθήσεται πᾶν ῥῆμα.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/001.yaml
  text: 'This is the third time I am coming to you: “Every matter will be established by the testimony of two witnesses or three.”[a][b]'
translation:
  language: zh_hans
  text: 这是我第三次要到你们那里去。“每一件事都要凭两个或三个见证人的证词得以确立。”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“每一句话都要凭两个或三个见证人的口得以确立。”希腊文紧随《申命记》十九章15节的措辞，采用了法律用语。
    reason: lexical_alternative
  - marker: b
    text: 这里引自《申命记》十九章15节。
    reason: cross_reference
lexical_decisions:
- source_word: Τρίτον τοῦτο
  choice: 这是我第三次
  rationale: 该中性宾格短语在句中作状语，表示这次到访是第三次；译为“这是我第三次”符合现代汉语习惯，也保留了原文对次数的强调。
- source_word: ἔρχομαι πρὸς ὑμᾶς
  choice: 要到你们那里去
  rationale: ἔρχομαι在此为带将来意味的现在时，指保罗即将成行；“要到……那里去”自然表达了这种临近而尚未实现的到访。
- source_word: ἐπὶ στόματος
  choice: 凭……的证词
  rationale: 这是申命记十九章15节背景下的法律惯用语，字面为“凭……的口”；“凭……的证词”在现代汉语中清楚传达其司法含义，字面形式则收入脚注。
- source_word: δύο μαρτύρων καὶ τριῶν
  choice: 两个或三个见证人
  rationale: καί在沿用的经文法律套语中表达“二或三”的选择范围，并非把两名与三名见证人累加；现代汉语以“两个或三个见证人”最为自然明确。
- source_word: σταθήσεται
  choice: 才能确定
  rationale: ἵστημι的将来被动式在法律语境中指事情得到确立或证实；“才能确定”既表达被确立的结果，也反映见证人数是必要条件。
- source_word: πᾶν ῥῆμα
  choice: 任何事情
  rationale: ῥῆμα本可指“话、陈述”，但在这段法律引文中指需要查明和确立的事项；“任何事情”保留其广度，避免过度限定为某一项指控。
theological_decisions:
- issue: 申命记法律原则在保罗管教语境中的适用范围
  choice: 将πᾶν ῥῆμα译为广义的“任何事情”，不把引文限定为教会纪律或具体指控。
  alternative: 译作“每一句话”“每项指控”或专门解释为教会纪律案件。
  rationale: 保罗引用的是普遍表述的经文法律原则；译文应保留这种广度及其在当前语境中的张力，不加入原文未明说的教会制度或教义限定。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“证词”清楚传达法律语境；“见证人”保留圣经法律术语。主文中的[a][b]与两条脚注逐一对应。
