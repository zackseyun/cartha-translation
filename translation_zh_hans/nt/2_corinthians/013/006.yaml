  yaml_path: translation/nt/2_corinthians/013/006.yaml
  text: But I hope that you will know that we are not disqualified[a].
translation:
  language: zh_hans
  text: 但我希望你们会知道，我们并非不合格[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们并非未获认可”或“我们并非没有通过检验”。希腊语这个形容词指经检验后未能证明为合格。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπίζω
  choice: 我希望
  rationale: 现在时直陈语气第一人称单数，表达保罗当前对将来结果的期待；“希望”自然保留其前瞻意味。
- source_word: δὲ
  choice: 但
  rationale: δέ在这里承接上文并形成温和对比；“但”符合现代汉语表达。
- source_word: γνώσεσθε
  choice: 你们会知道
  rationale: 将来时形式指向哥林多人将来的认识；如此译法直接自然，不额外强调认识的过程或将其解释为“承认”。
- source_word: ὅτι
  choice: （引出宾语从句）
  rationale: 两个ὅτι均引出内容从句；汉语分别以“希望你们会知道”和“知道，我们……”的自然句法表达，无须逐字译出连接词。
- source_word: ἡμεῖς
  choice: 我们
  rationale: 保留明示的人称代词，所指为保罗及其同工；不另加原文没有的强化词。
- source_word: οὐκ ἐσμὲν
  choice: 并不是
  rationale: 准确表达否定系词；“并”使上下文对比自然，但不把简单否定强化为“绝不是”。
- source_word: ἀδόκιμοι
  choice: 经不起检验的
  rationale: ἀδόκιμος在本段“省察、考验”的语境中指经检验而未获认可、未能通过；“经不起检验”既保留检验意象，又避免“被弃绝”等可能附带的教义含义。
theological_decisions:
- issue: 检验语境中ἀδόκιμοι的含义及其与使徒资格的关系
  choice: 并不是经不起检验的
  alternative: 并非不合格的／并非未获认可的／并非经不起考验的
  rationale: 本节延续上下文有关省察与验证的措辞，焦点是保罗及其同工是否能在检验中显明为合格。译文保留评价与检验的双重意味，却不把它限定为某种后来的教义术语，也不把“我们”所受检验的具体性质解释得超过原文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“经不起检验”与前后文的检验意象相呼应；脚注列出较形式对应的译法，以保留ἀδόκιμος在“未获认可”与“不合格”之间的语义幅度。
