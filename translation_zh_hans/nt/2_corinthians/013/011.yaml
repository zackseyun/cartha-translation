id: 2CO.13.11
reference: 2 Corinthians 13:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Λοιπόν, ἀδελφοί, χαίρετε, καταρτίζεσθε, παρακαλεῖσθε, τὸ αὐτὸ φρονεῖτε, εἰρηνεύετε, καὶ ὁ θεὸς τῆς ἀγάπης καὶ εἰρήνης ἔσται μεθ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/011.yaml
  text: Finally[a], brothers, rejoice, be restored, be encouraged, think the same thing, live in peace[e][d][c][b], and the God of love and peace will be with you.
translation:
  language: zh_hans
  text: 最后，弟兄们[b]，要喜乐[a]，要恢复健全[c]，要接受劝勉[d]，要同心[e]，要和睦相处；爱与和平的神必与你们同在。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “要喜乐”也可译作“再会”；这个希腊词可作书信结尾的问候语，但在这里更可能与后面各项劝勉并列。
    reason: lexical_alternative
  - marker: b
    text: “弟兄们”在这里是对全体会众的称呼，通常包括男性和女性。
    reason: cultural_note
  - marker: c
    text: “要恢复健全”也可译作“要得以完全”“要被修复”或“要整顿好自己”。
    reason: lexical_alternative
  - marker: d
    text: “要接受劝勉”也可译作“要得到鼓励”或“要受安慰”。
    reason: lexical_alternative
  - marker: e
    text: “要同心”直译为“要思想同一件事”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Λοιπόν
  choice: 最后
  rationale: 作为书信结尾的篇章标记，引出末了的劝勉；“最后”自然、简洁。
- source_word: ἀδελφοί
  choice: 弟兄们
  rationale: 保留希腊文阳性复数称呼；在这里是对整个会众的集体称呼，其包含女性的语用范围在脚注说明。
- source_word: χαίρετε
  choice: 要喜乐
  rationale: 该词也可用作告别语，但在此处一连串命令中，取“喜乐”的劝勉义更符合句法和语境。
- source_word: καταρτίζεσθε
  choice: 要恢复健全
  rationale: 该动词表示修复、整顿或使之达到合宜状态；“恢复健全”贴合哥林多教会需要修复的语境，又不误解为达到毫无瑕疵的完全。
- source_word: παρακαλεῖσθε
  choice: 要接受劝勉
  rationale: 此中间或被动形式可表示接受劝勉、鼓励或安慰；上下文带有使徒劝告的意味，“接受劝勉”保留了这种开放性。
- source_word: τὸ αὐτὸ φρονεῖτε
  choice: 要同心
  rationale: 字面为“思想同一件事”；“同心”是自然的现代汉语，表达共同心志而不强解为所有意见完全一致。
- source_word: εἰρηνεύετε
  choice: 要和睦相处
  rationale: 现在时命令强调持续的和平生活；“和睦相处”清楚体现会众彼此之间的关系。
- source_word: ὁ θεὸς τῆς ἀγάπης καὶ εἰρήνης
  choice: 爱与和平的神
  rationale: 直接保留两个属格名词，避免擅自限定为“赐下”或仅仅“具有”爱与和平。
- source_word: ἔσται μεθ’ ὑμῶν
  choice: 必与你们同在
  rationale: 以现代而庄重的汉语表达简单将来时所含的应许语气。
theological_decisions:
- issue: ἀδελφοί作为会众称呼的包容范围
  choice: 正文译作“弟兄们”，脚注说明这是对全体会众的称呼，通常包括男女。
  alternative: 正文译作“弟兄姊妹们”或“众弟兄姊妹”。
  rationale: 正文保留原文的阳性复数形式，同时借脚注交代其在当时书信称呼中的广泛语用范围。
- issue: 结尾应许与前述命令的逻辑关系
  choice: 用分号连接，不添加“这样”或“就”。
  alternative: 译作“这样，爱与和平的神就必与你们同在”。
  rationale: 原文只有连接词 καί，并未明说神的同在严格以履行这些命令为条件；不添加条件或结果关系，可保留原文的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的会众用语。连续使用“要”呈现一连串命令式劝勉；结尾用“必与你们同在”保持应许的郑重语气。
