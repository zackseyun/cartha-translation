  terminology: “弟兄们”保留原文阳性复数称呼，脚注适当说明其面向全体会众的语用范围。“爱与和平的神”“同在”“劝勉”等术语准确、常用，未引入特定宗派解释。“恢复健全”避免把καταρτίζεσθε过度限定为无罪的“完全”。
