  text: ⸀εὐχόμεθα δὲ πρὸς τὸν θεὸν μὴ ποιῆσαι ὑμᾶς κακὸν μηδέν, οὐχ ἵνα ἡμεῖς δόκιμοι φανῶμεν, ἀλλ’ ἵνα ὑμεῖς τὸ καλὸν ποιῆτε, ἡμεῖς δὲ ὡς ἀδόκιμοι ὦμεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/007.yaml
  text: We pray to God that you may do nothing wrong—not so that we may appear approved[a], but so that you may do what is right[c][b], even if we may seem disqualified.
translation:
  language: zh_hans
  text: 我们向上帝祷告，愿你们不做任何恶事[a]；我们这样祷告，并不是为了让我们显得通过了考验[b]，而是为了让你们行正确的事，即使我们被看作没有通过考验[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恶事”也可译作“任何坏事”或“任何不对的事”。
    reason: lexical_alternative
  - marker: b
    text: “通过了考验”也可译作“获认可”或“证明为真”。原文在这里与后面的“没有通过考验”使用一对意义相反的相关词。
    reason: lexical_alternative
  - marker: c
    text: 或译：“而我们则像是没有通过考验的。”原文可强调他人眼中的表现或未获认可的状态。
    reason: alternative_reading
lexical_decisions:
- source_word: εὐχόμεθα δὲ πρὸς τὸν θεόν
  choice: 我们向上帝祷告
  rationale: εὔχομαι在这里指向上帝祈求；πρός加宾格表示祷告所朝向的对象。δὲ承接上下文，但本节单独呈现时不宜机械译为“现在”。
- source_word: μὴ ποιῆσαι ὑμᾶς κακὸν μηδέν
  choice: 愿你们不做任何恶事
  rationale: 不定式结构表达祷告的内容；κακὸν μηδέν是强调性的否定，意为“任何恶事都不做”。“愿”在现代汉语中自然表达祈求内容。
- source_word: οὐχ ἵνα
  choice: 这不是为了
  rationale: 保留ἵνα所表达的目的关系，并清楚引出保罗所否定的动机。
- source_word: δόκιμοι φανῶμεν
  choice: 让我们显得经得起考验
  rationale: δόκιμος指经过检验而获认可；φαίνω在此表示“显得、被看出”。译文既保留检验意象，也保留外在观感。
- source_word: τὸ καλὸν ποιῆτε
  choice: 让你们行善
  rationale: τὸ καλόν在伦理语境中指美善、正确的事；“行善”简洁自然，并与前面的“不做任何恶事”形成对应。
- source_word: ἡμεῖς δὲ ὡς ἀδόκιμοι ὦμεν
  choice: 哪怕我们显得经不起考验
  rationale: ἀδόκιμος与δόκιμος直接相反，指未通过检验、未获认可。结合前文φανῶμεν，主文以“显得”表达修辞上的观感；脚注保留ὡς也可理解为“像是”或按某种身份看待的空间。
theological_decisions:
- issue: ὡς ἀδόκιμοι是否表示最终被弃绝
  choice: 译作“显得经不起考验”，侧重在哥林多人所要求的验证中不获认可或看似失败
  alternative: 译作“我们是未蒙认可的”或“我们没有通过检验”
  rationale: 上下文围绕使徒身份的检验和显明展开，并以δόκιμοι和ἀδόκιμοι形成词义对照。本节本身并未断言保罗在终极救恩意义上被弃绝，因此不将该含义写入正文。
- issue: ὡς与δὲ ὦμεν所表达的让步或状态
  choice: 以“哪怕”表达上下文中的让步关系
  alternative: 较形式地译为“而我们则像是经不起考验的”
  rationale: “哪怕”使现代汉语中的逻辑关系清楚，同时脚注保留较贴近形式的另一种理解，避免把ὡς的细微含义完全固定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“经得起考验／经不起考验”保留原文δόκιμος／ἀδόκιμος的词根对照；句式先陈明祷告内容，再以“不是为了……而是为了……”呈现鲜明的目的对比。
