id: 2CO.13.12
reference: 2 Corinthians 13:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἀσπάσασθε ἀλλήλους ἐν ἁγίῳ φιλήματι. ἀσπάζονται ὑμᾶς οἱ ἅγιοι πάντες.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/012.yaml
  text: Greet one another with a holy kiss[b][a]. All the saints greet you.
translation:
  language: zh_hans
  text: 你们要以圣洁的亲吻彼此问安。[a] 众圣徒[b]都向你们问安。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以神圣的亲吻。”这是当时一种公认的问安方式，在信徒群体中表达圣洁与团契。
    reason: lexical_alternative
  - marker: b
    text: 这里的“圣徒”指信徒，也就是上帝圣洁的子民，并非只指后来被特别册封的一小类基督徒。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: 问安
  rationale: 该词为不定过去时中态命令语气、第二人称复数，在书信劝勉中表示主动彼此致意；“问安”简洁自然，也与下句的同一词根相呼应。
- source_word: ἀλλήλους
  choice: 彼此
  rationale: 相互代词，表示群体成员之间互相施行这一行动；“彼此”是现代汉语中自然、凝练的对应表达。
- source_word: ἐν ἁγίῳ φιλήματι
  choice: 以圣洁的亲吻
  rationale: 介词ἐν在此表示问安所采用的方式，译作“以”符合现代汉语。ἅγιος保留“圣洁”的分别为圣含义，φίλημα直译为“亲吻”，不将具体举动抽象化。
- source_word: ἀσπάζονται
  choice: 向……问安
  rationale: 现在时中态直陈语气、第三人称复数；在书信结尾表示他人托作者传达问候，“向你们问安”自然准确。
- source_word: ὑμᾶς
  choice: 你们
  rationale: 第二人称复数宾格；汉语“你们”明确保留复数所指。
- source_word: οἱ ἅγιοι πάντες
  choice: 众圣徒都
  rationale: ἅγιοι是保罗对信徒群体的常用称呼，“圣徒”保留关键词及群体身份；“众……都”自然表达πάντες所强调的全体性。
theological_decisions:
- issue: 保罗书信中ἅγιοι这一群体称谓的译法
  choice: 圣徒
  alternative: 圣洁的人；上帝圣洁的子民
  rationale: “圣徒”在中文圣经语境中是对全体信徒的既定称谓，保留“分别为圣”的身份含义；脚注澄清这里并非仅指后来被特别册封的少数人，以免导入后世制度性含义。
- issue: “圣洁的亲吻”是具体举动还是一般性友好问候
  choice: 保留具体的“亲吻”
  alternative: 亲切地彼此问候
  rationale: 原文φίλημα明确指亲吻；直译既保存其历史文化形式，也保存该问安因基督徒团契而具有的圣洁性质，不把具体表达方式悄然泛化。
translation_notes:
  register: 采用现代、庄重而易懂的书信体。“问安”在两句中对应同一希腊词根，形成原文的衔接；“众圣徒都”兼顾汉语自然语序与πάντες的全体强调。所有脚注标记均置于相关词句之后。
