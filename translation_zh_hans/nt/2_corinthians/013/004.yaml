id: 2CO.13.4
reference: 2 Corinthians 13:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ⸀γὰρ ἐσταυρώθη ἐξ ἀσθενείας, ἀλλὰ ζῇ ἐκ δυνάμεως θεοῦ. καὶ γὰρ ἡμεῖς ἀσθενοῦμεν ἐν αὐτῷ, ἀλλὰ ⸀ζήσομεν σὺν αὐτῷ ἐκ δυνάμεως θεοῦ εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/004.yaml
  text: For indeed he was crucified in weakness[a], but he lives by the power of God. For indeed we are weak in him[d][c][b], but we will live with him by the power of God toward you.
translation:
  language: zh_hans
  text: 因为他固然因软弱被钉在十字架上[a]，却因上帝的能力活着。我们在他里面也确实软弱[b]，但在你们这里[d]，我们必因上帝的能力与他一同活着[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “因软弱”也可译作“在软弱中”。原文介词ἐξ较直白地表示来源或根据。
    reason: lexical_alternative
  - marker: b
    text: “在他里面”也可理解为“与他联合”；译文保留原文简练的表达。
    reason: lexical_alternative
  - marker: c
    text: “必与他一同活着”可指保罗在与哥林多人交往时将彰显基督所赐的生命和能力，也可能令人联想到更广泛的复活生命主题。
    reason: alternative_reading
  - marker: d
    text: “在你们这里”也可译作“对你们”“为你们”或“在你们中间”。原文εἰς ὑμᾶς十分简练，可表示方向、关系或产生作用的范围。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσταυρώθη
  choice: 被钉在十字架上
  rationale: 准确表达不定过去时被动语态，并采用现代汉语中清楚、通行的说法。
- source_word: ἐξ ἀσθενείας
  choice: 因软弱
  rationale: “因”既能表达ἐξ所含的来源或根据意味，也比生硬的“出于软弱”更符合现代汉语；同时保留与下文“因上帝的能力”的对照。
- source_word: ζῇ
  choice: 活着
  rationale: 保留现在时的持续状态和动词意味，比单说“是活的”自然。
- source_word: ἐκ δυνάμεως θεοῦ
  choice: 因上帝的能力
  rationale: 重复使用“因”来对应原文重复的ἐκ/ἐξ，使“软弱”与“上帝的能力”形成有意的平行对照；脚注说明更惯用的工具性译法。
- source_word: ἀσθενοῦμεν
  choice: 软弱
  rationale: 与前面的ἀσθένεια采用同一词根译法，保留保罗的词语呼应。
- source_word: ἐν αὐτῷ
  choice: 在他里面
  rationale: 保留保罗简练的“在基督里”联合语言，不将其解释性扩写为某一种特定关系。
- source_word: ζήσομεν
  choice: 必……活着
  rationale: 明确保留将来时；“必”在此表达未来而非另加必然性教义判断。
- source_word: σὺν αὐτῷ
  choice: 与他一同
  rationale: 自然表达共同、联合或参与的含义。
- source_word: εἰς ὑμᾶς
  choice: 在你们这里
  rationale: 以简洁汉语表达这一压缩结构在方向、关联和作用范围上的含义，避免武断限定为“为了你们”或“对付你们”。
theological_decisions:
- issue: 基督被钉十字架时的“软弱”是什么意思
  choice: 保留“因软弱”的悖论性表述，使它指向受难所呈现的人性软弱处境，而不将其扩写为对基督本性或无罪性的判断。
  alternative: 可译为“在软弱中”，强调受难发生的状态或处境。
  rationale: 本节有意把十字架的软弱与上帝使他活着的大能相对照；译文应保留这种张力，而不是用解释性措辞消除它。
- issue: “我们必与他一同活着”的所指
  choice: 保留简单将来时，使其既可在直接语境中指保罗面对哥林多人时彰显的、由上帝大能所支持的使徒生命，也可与更广泛的复活生命主题相呼应。
  alternative: 仅指末日复活，或仅指保罗当前及将来的使徒职事。
  rationale: εἰς ὑμᾶς使这句话明确关联哥林多人，但“与他一同活着”的措辞又具有更广的与基督联合及复活生命意涵，因此不宜排他性定解。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“固然……却……”重现让步与转折；两次“因……”刻意保持原文ἐξ/ἐκ的平行。末句调整了语序，把“在你们这里”前置，以免中文误把它理解成单纯修饰“活着”，同时不补入“显明”“施行”等原文没有明说的动词。
