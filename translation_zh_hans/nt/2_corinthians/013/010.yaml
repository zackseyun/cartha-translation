source:
  edition: SBLGNT
  text: διὰ τοῦτο ταῦτα ἀπὼν γράφω, ἵνα παρὼν μὴ ἀποτόμως χρήσωμαι κατὰ τὴν ἐξουσίαν ἣν ⸂ὁ κύριος ἔδωκέν μοι⸃, εἰς οἰκοδομὴν καὶ οὐκ εἰς καθαίρεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/010.yaml
  text: For this reason I write these things while absent[a], so that when present I may not have to act harshly[b], according to the authority that the Lord gave me for building up and not for tearing down.
translation:
  language: zh_hans
  text: 因此，我不在场时写这些话，为的是我在场时，不必照着主所赐给我的权柄严厉行事[a]；这权柄是为了建造，不是为了拆毁[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“严厉处置”，或“采取严厉手段”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作：“为造就，而不是为毁坏。”原文使用建筑隐喻，字面意思是“建造”与“拆毁”。
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: 因此
  rationale: 自然表达因果承接关系，明确连接上文。
- source_word: ταῦτα
  choice: 这些话
  rationale: 保留复数指示意义，并按书信语境指向保罗所写的内容。
- source_word: ἀπὼν γράφω
  choice: 我趁着不在你们那里时写下这些话
  rationale: 以时间从句表达分词的时间作用，并与后面的παρὼν形成清楚对照；“你们那里”根据书信交往语境补出，使现代汉语自然。
- source_word: ἵνα παρὼν
  choice: 好使我到了你们那里时
  rationale: “好使”表达目的；“到了你们那里时”自然呈现亲自在场之意。
- source_word: μὴ ἀποτόμως χρήσωμαι
  choice: 不必……严厉行事
  rationale: ἀποτόμως含严厉、尖锐之意，χράομαι在此指采取或施行某种做法；“不必”传达语境中保罗希望避免被迫严厉处置的意味。
- source_word: κατὰ τὴν ἐξουσίαν
  choice: 凭着……权柄
  rationale: 表达行动与所受权柄相符并以该权柄为根据，符合现代汉语习惯。
- source_word: ἣν ὁ κύριος ἔδωκέν μοι
  choice: 主赐给我的
  rationale: 保留“主”的称号，不进一步限定所指；“赐给”自然表达权柄来自主。
- source_word: εἰς οἰκοδομὴν καὶ οὐκ εἰς καθαίρεσιν
  choice: 是为建造，而不是为拆毁
  rationale: 保留原文成对的建筑隐喻及鲜明对照，不以抽象教会术语替换。
theological_decisions:
- issue: “主”（ὁ κύριος）的具体所指
  choice: 只译作“主”
  alternative: 明确译作“主耶稣”或泛指“上帝”
  rationale: 本节原文仅使用称号ὁ κύριος；译文不作超出本节措辞的神学限定。
- issue: 权柄的目的及其对象
  choice: 保留“为建造，而不是为拆毁”的隐喻，不明说建造或拆毁的具体对象
  alternative: 译作“为建立你们，而不是毁坏你们”
  rationale: 原文没有明示宾语；保留省略可避免把可能指向群体、个人或教会生命的意象过早收窄。
translation_notes:
  register: 采用现代、庄重而易懂的书信语体。“趁着不在你们那里时”与“到了你们那里时”突出原文的在场／不在场对照；分号使长句层次清楚，同时保持原文思想连续。所有脚注标记均置于对应词句之后。
