id: 2CO.13.3
reference: 2 Corinthians 13:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐπεὶ δοκιμὴν ζητεῖτε τοῦ ἐν ἐμοὶ λαλοῦντος Χριστοῦ· ὃς εἰς ὑμᾶς οὐκ ἀσθενεῖ ἀλλὰ δυνατεῖ ἐν ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/003.yaml
  text: since you are seeking proof that Messiah is speaking in me—he is not weak toward you[a], but is powerful in you[b],
translation:
  language: zh_hans
  text: 既然你们在寻求弥赛亚在我里面说话的凭据[a]——他对你们并不软弱，反而在你们里面大有能力[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“弥赛亚借着我说话”。希腊文直译为“在我里面说话的弥赛亚”。
    reason: 保留ἐν ἐμοί可能表达内在临在或借保罗发言的歧义。
  - marker: b
    text: 也可译作“在你们中间大有能力”。
    reason: ἐν ὑμῖν既可指在众人里面，也可指在群体中间。
lexical_decisions:
- source_word: ἐπεὶ
  choice: 既然
  rationale: 保留该词承接上下文、说明保罗将严厉行事之缘由的因果语气。
- source_word: δοκιμὴν ζητεῖτε
  choice: 在寻求……的凭据
  rationale: δοκιμήν在这里指可验证某事的证据，而不是试验的过程；现在时用“在寻求”表达持续的要求。
- source_word: τοῦ ἐν ἐμοὶ λαλοῦντος Χριστοῦ
  choice: 弥赛亚在我里面说话
  rationale: 以内容关系表达属格分词结构；“在我里面”直接对应ἐν ἐμοί，同时用脚注保留“借着我”的可能理解。
- source_word: Χριστοῦ
  choice: 弥赛亚
  rationale: 此处保留Χριστός作为受膏者称号的意义，而不只将其当作专名。
- source_word: εἰς ὑμᾶς οὐκ ἀσθενεῖ
  choice: 他对你们并不软弱
  rationale: “对你们”保留εἰς的指向和关系意味；“并不软弱”与下文能力形成明确对照。
- source_word: ἀλλὰ δυνατεῖ ἐν ὑμῖν
  choice: 反而在你们里面大有能力
  rationale: “大有能力”自然表达罕见动词δυνατέω，并直接保留ἐν ὑμῖν的“在……里面”；脚注注明群体性的另一种译法。
theological_decisions:
- issue: Χριστοῦ是称号还是近似专名
  choice: 弥赛亚
  alternative: 基督
  rationale: 这里的表达可自然理解为称号，译作“弥赛亚”可显明原词“受膏者”的含义，同时不增添宗派性解释。
- issue: ἐν ἐμοί所表达的是内在说话还是借保罗说话
  choice: 在我里面说话
  alternative: 借着我说话
  rationale: 正文紧贴介词ἐν，保留弥赛亚在保罗里面说话与借保罗说话之间的张力；另一理解列入脚注。
- issue: ἐν ὑμῖν指个人里面还是群体中间
  choice: 在你们里面大有能力
  alternative: 在你们中间大有能力
  rationale: 正文直接对应原文介词和复数代词，不预先限定为个人内在经验或群体中的作为；脚注保留群体性读法。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“凭据”“并不软弱”“大有能力”既贴近原文的证据、软弱与能力主题，也便于普通读者理解；破折号保留后半句对前述要求所作的强调性说明。
source_grounding:
  english_pob_role: consult_only
